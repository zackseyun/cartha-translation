source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י יִהְיֶ֨ה לָ/כֶ֥ם קֹ֛דֶשׁ שַׁבַּ֥ת שַׁבָּת֖וֹן לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֥ה ב֛/וֹ מְלָאכָ֖ה יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: ml
  text: ആറു ദിവസം ജോലി ചെയ്യാം; എന്നാൽ ഏഴാം ദിവസം നിങ്ങൾക്കു വിശുദ്ധമായ ഒരു ശബ്ബത്തായിരിക്കും—യഹോവയ്ക്കുള്ള[b] സമ്പൂർണ വിശ്രമത്തിന്റെ ശബ്ബത്ത്[a]. അന്ന് ജോലി ചെയ്യുന്ന ഏതൊരാളും കൊല്ലപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ശബ്ബത്ത്, ശബ്ബത്ത്-വിശ്രമം’; ജോലി പൂർണമായി നിർത്തിവെക്കുന്നതിനെ ഈ എബ്രായ പ്രയോഗം ഊന്നിപ്പറയുന്നു. ‘ഗൗരവപൂർണ വിശ്രമത്തിന്റെ ശബ്ബത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘യഹോവയ്ക്കായി’, ‘യഹോവയോടുള്ള’, അല്ലെങ്കിൽ ‘യഹോവയുടേതായ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: ജോലി ചെയ്യാം
  rationale: നിഫാൽ രൂപത്തിലെ അപരോക്ഷമായ ‘ജോലി ചെയ്യപ്പെടാം/ചെയ്യപ്പെടും’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാള നിയമഭാഷയിൽ അവതരിപ്പിക്കുന്നു; അനുമതിയാണോ ഭാവിനിർദേശമാണോ എന്ന സൂക്ഷ്മത അനാവശ്യമായി കടുപ്പിക്കുന്നില്ല.
- source_word: קֹדֶשׁ
  choice: വിശുദ്ധമായിരിക്കണം
  rationale: ദിവസം ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടതാണെന്ന വിധേയപ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: സമ്പൂർണ വിശ്രമത്തിന്റെ ശബ്ബത്ത്
  rationale: ആവർത്തനസ്വഭാവമുള്ള എബ്രായ പ്രയോഗം ജോലിയിൽനിന്നുള്ള പൂർണ വിരാമത്തെ ഊന്നുന്നതായി മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണം, ദിശാബോധം, ഉടമസ്ഥബന്ധം എന്നിവയിൽ ഒന്നിനെ മാത്രം അന്തിമമായി നിശ്ചയിക്കാതെ സ്വാഭാവികമായ സമർപ്പണാർഥം നൽകുന്നു.
- source_word: כָּל הָעֹשֶׂה בּוֹ מְלָאכָה
  choice: അന്ന് ജോലി ചെയ്യുന്ന ഏതൊരാളും
  rationale: പൊതുവായ നിയമവ്യവസ്ഥയുടെ സർവവ്യാപകത നിലനിർത്തുന്നു; ദിവസത്തെ സൂചിപ്പിക്കുന്ന בּוֹ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അന്ന്’ എന്നു നൽകുന്നു.
- source_word: יוּמָת
  choice: കൊല്ലപ്പെടണം
  rationale: ഹോഫാൽ രൂപത്തിന്റെ കാരണകർത്തൃകർമണി അർഥമായ ‘മരണത്തിന് വിധേയമാക്കപ്പെടുക’ നേരിട്ട് നിലനിർത്തുന്നു. മൂലപാഠത്തിൽ പ്രത്യേക ഊന്നൽ നൽകുന്ന infinitive absolute ഇല്ലാത്തതിനാൽ ‘നിശ്ചയമായും’ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: സീനായിയിലെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: ലַיהוָה എന്നതിലെ לְ ഉപസർഗത്തിന്റെ ബന്ധം
  choice: യഹോവയ്ക്കുള്ള
  alternative: യഹോവയ്ക്കായി / യഹോവയോടുള്ള
  rationale: ശബ്ബത്ത് യഹോവയ്ക്കായി സമർപ്പിക്കപ്പെട്ടതോ അവനോടു ദിശാബദ്ധമായതോ അവന്റേതോ എന്ന അർഥസാധ്യതകൾ ഉണ്ട്; മുഖ്യപാഠം സ്വാഭാവികമായൊരു രൂപം ഉപയോഗിക്കുകയും അടിക്കുറിപ്പ് ശേഷിക്കുന്ന വ്യാപ്തി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘ശബ്ബത്ത്’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തി അതിന്റെ അർഥം സമീപവാക്യത്തിലും അടിക്കുറിപ്പിലും വ്യക്തമാക്കി. ഇംഗ്ലീഷ് consultation layer-ൽ [a] തെറ്റായ സ്ഥാനത്തുണ്ടായിരുന്നതായി തോന്നുന്നതിനാൽ അതിനെ שַׁבַּת שַׁבָּתוֹן എന്ന പദസമുച്ചയത്തിനു പിന്നാലെ സ്ഥാപിച്ചു; [b] ദൈവനാമവുമായി ബന്ധപ്പെട്ട ഉപസർഗത്തിനു പിന്നാലെ സ്ഥാപിച്ചു.
