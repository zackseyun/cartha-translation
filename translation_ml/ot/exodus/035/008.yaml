lexical_decisions:
- source_word: שֶׁמֶן
  choice: എണ്ണ
  rationale: ഈ സന്ദർഭത്തിൽ സാധാരണയായി ഒലിവെണ്ണയെയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും, എബ്രായപദം പൊതുവായി ‘എണ്ണ’ എന്നാണ്; മൂലത്തിൽ വ്യക്തമാക്കാത്ത പ്രത്യേകത വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: לַמָּאוֹר
  choice: വെളിച്ചത്തിനുള്ള
  rationale: മָאוֹר എന്ന നാമപദത്തിന്റെ ‘വെളിച്ചം’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, എണ്ണയുടെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְשָׂמִים
  choice: സുഗന്ധവ്യഞ്ജനങ്ങൾ
  rationale: വിശുദ്ധ ആവശ്യങ്ങൾക്കായി ഉപയോഗിച്ചിരുന്ന സുഗന്ധമുള്ള പദാർഥങ്ങളെയാണ് ബഹുവചനപദം സൂചിപ്പിക്കുന്നത്; ‘സുഗന്ധവ്യഞ്ജനങ്ങൾ’ ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലം
  rationale: ഇത് ആരാധനാസംബന്ധമായ ഒരു നിശ്ചിത എണ്ണയെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്; ‘അഭിഷേകതൈലം’ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപമാണ്.
- source_word: קְטֹרֶת
  choice: ധൂപം
  rationale: സമാഗമകൂടാരത്തിന്റെ പശ്ചാത്തലത്തിൽ കത്തിക്കുന്ന സുഗന്ധധൂപത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
- source_word: הַסַּמִּים
  choice: സുഗന്ധ-
  rationale: קְטֹרֶת הַסַּמִּים എന്നത് അക്ഷരാർഥത്തിൽ ‘സുഗന്ധവ്യഞ്ജനങ്ങളുടെ ധൂപം’ എന്നാണ്; മുഖ്യപാഠത്തിലെ ‘സുഗന്ധധൂപം’ സ്വാഭാവിക മലയാളത്തിൽ അതേ ആശയം നൽകുന്നു.
