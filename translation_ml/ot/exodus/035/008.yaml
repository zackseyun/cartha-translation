translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. എബ്രായവാക്യത്തിലെ സമാന്തരഘടന നിലനിർത്തി. ലഭിച്ച ഇംഗ്ലീഷ് പാഠത്തിൽ [a] വെളിച്ചത്തിനു ശേഷം വന്നിട്ടുണ്ടെങ്കിലും, അതിന്റെ കുറിപ്പ് קְטֹרֶת הַסַּמִּים എന്ന അവസാന പദസമുച്ചയത്തെയാണ് വിശദീകരിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ അടയാളം ‘സുഗന്ധധൂപം’ എന്നതിനോടു ചേർത്തു.
