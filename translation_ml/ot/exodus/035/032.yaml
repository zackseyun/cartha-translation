translation:
  language: ml
  text: രൂപകൽപ്പനകൾ മെനയാനും[a] സ്വർണം, വെള്ളി, വെങ്കലം[b] എന്നിവകൊണ്ട് പണിയാനും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പദ്ധതികൾ വിഭാവനം ചെയ്യാനും’ അല്ലെങ്കിൽ ‘രൂപകൽപ്പനകൾ രൂപപ്പെടുത്താനും’; നൈപുണ്യമുള്ള കലാസങ്കൽപ്പത്തെ ഊന്നിപ്പറയാൻ എബ്രായത്തിൽ ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയും നാമവും ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘വെങ്കലം’ എന്നത് ‘ചെമ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/חְשֹׁב מַחַשָׁבֹת
  choice: രൂപകല്പനകൾ ആസൂത്രണം ചെയ്യാനും
  rationale: חשׁב എന്ന ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള מַחֲשָׁבוֹת എന്ന നാമവും ചേർന്ന് കരകൗശലസന്ദർഭത്തിലെ നൈപുണ്യമുള്ള സൃഷ്ടിപരമായ ആസൂത്രണത്തെ ഊന്നിപ്പറയുന്നു. മലയാളത്തിൽ പദാനുപദ ആവർത്തനം അസ്വാഭാവികമായതിനാൽ അർത്ഥവും ഊന്നലും സ്വാഭാവികമായി പകരുന്ന പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: לַ/עֲשֹׂת
  choice: പണിയാനും
  rationale: עשה എന്നതിന് പൊതുവേ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നർത്ഥമുണ്ടെങ്കിലും, ഇവിടെ ലോഹങ്ങളിൽ നടത്തുന്ന വിദഗ്ധ കരകൗശലപ്പണിയാണ് ഉദ്ദേശിക്കുന്നത്; ‘പണിയുക’ അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בַּ/זָּהָב
  choice: സ്വർണം ... എന്നിവകൊണ്ട്
  rationale: കരകൗശലത്തിനുപയോഗിക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന ב എന്ന ഉപസർഗം മലയാളത്തിൽ ‘കൊണ്ട്’ എന്നു സ്വാഭാവികമായി പകരുന്നു.
- source_word: וּ/בַ/כֶּסֶף
  choice: വെള്ളി
  rationale: כֶּסֶף എന്ന ലോഹനാമത്തിന്റെ സാധാരണ മലയാളപരിഭാഷ ‘വെള്ളി’ ആണ്; സമാന്തരമായ വസ്തുപ്പട്ടികയിൽ ചേർത്തിരിക്കുന്നു.
- source_word: וּ/בַ/נְּחֹשֶׁת
  choice: വെങ്കലം
  rationale: נְחֹשֶׁת എന്നത് ഈ പുരാതന കരകൗശലസന്ദർഭത്തിൽ സാധാരണയായി ‘വെങ്കലം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു; ‘ചെമ്പ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
