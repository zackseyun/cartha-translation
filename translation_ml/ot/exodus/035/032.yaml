translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വാക്യം മുൻവാക്യത്തിലെ കഴിവുകളുടെ പട്ടിക തുടരുന്നതിനാൽ ക്രിയകൾ ‘-ആനും’ രൂപത്തിലും അവസാനം അല്പവിരാമത്തോടെയും നൽകിയിരിക്കുന്നു. മൂലത്തിലെ സമാന്തര ലോഹപ്പട്ടിക മലയാളത്തിലെ സ്വാഭാവികമായ ‘എന്നിവകൊണ്ട്’ എന്ന ഘടനയിൽ അവതരിപ്പിച്ചു.
