translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി സ്വീകരിച്ചു. വാക്യം അടുത്ത വാക്യഘടകത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിലെ ദീർഘരേഖ നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലഭാഷയിലെ ബന്ധപ്പെട്ട പദങ്ങളായ ‘വെങ്കലജാലി’ക്കും ‘അടിത്താങ്ങ്’ക്കും പിന്നാലെ ചിഹ്നങ്ങൾ സ്ഥാപിച്ചു.
