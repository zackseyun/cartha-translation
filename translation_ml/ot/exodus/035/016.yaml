translation:
  language: ml
  text: ഹോമയാഗപീഠവും അതിന്റെ വെങ്കലജാലിയും[a], യാഗപീഠത്തിന്റെ തണ്ടുകളും അതിന്റെ എല്ലാ ഉപകരണങ്ങളും, കഴുകുപാത്രവും അതിന്റെ അടിത്താങ്ങും[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെങ്കല അരിപ്പ്’ അല്ലെങ്കിൽ ‘വെങ്കല വലക്കെട്ട്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അതിന്റെ അടിസ്ഥാനം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: ഹോമയാഗപീഠം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗവുമായി ബന്ധപ്പെട്ട പ്രത്യേക യാഗപീഠത്തെയാണ് ഈ സംയുക്തപദം സൂചിപ്പിക്കുന്നത്. മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സ്വാഭാവികവുമായ ‘ഹോമയാഗപീഠം’ അതിന്റെ യാഗപരമായ ധർമ്മം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: വെങ്കലജാലി
  rationale: യാഗപീഠത്തോടു ചേർന്ന വലക്കണ്ണികളുള്ള ലോഹഘടനയെയാണ് מִכְבָּר സൂചിപ്പിക്കുന്നത്. ‘വെങ്കലജാലി’ വസ്തുവിന്റെ രൂപം സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר לוֹ
  choice: അതിനുള്ള
  rationale: ഈ ബന്ധവാക്യം യാഗപീഠവുമായുള്ള ഉടമസ്ഥതയോ അനുബന്ധമോ സൂചിപ്പിക്കുന്നു. എബ്രായം വ്യക്തമാക്കാത്ത കൃത്യമായ സ്ഥാനം ചേർക്കാതെ ‘അതിനുള്ള’ ആ ബന്ധം നിലനിർത്തുന്നു.
- source_word: בַּדָּיו
  choice: അതിന്റെ തണ്ടുകൾ
  rationale: തിരുനിവാസത്തിലെ സാമഗ്രികൾ ചുമക്കാൻ ഉപയോഗിച്ച നീണ്ട തണ്ടുകളാണിവ. സന്ദർഭത്തിൽ ചുമക്കാനുള്ള ഉപയോഗം വ്യക്തമായതിനാൽ മുഖ്യപാഠത്തിൽ അത് പ്രത്യേകം ചേർക്കേണ്ടതില്ല.
- source_word: כָּל כֵּלָיו
  choice: അതിന്റെ എല്ലാ ഉപകരണങ്ങൾ
  rationale: യാഗപീഠവുമായി ബന്ധപ്പെട്ട വിവിധ സാമഗ്രികളെ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ് כֵּלִים. ‘ഉപകരണങ്ങൾ’ ആ വ്യാപ്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַכִּיֹּר
  choice: കഴുകുപാത്രം
  rationale: തിരുനിവാസത്തിന്റെ പ്രാകാരത്തിൽ കഴുകുന്നതിനായി ഉപയോഗിച്ച പാത്രമാണിത്. ‘കഴുകുപാത്രം’ അതിന്റെ ഉപയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: כַּנּוֹ
  choice: അതിന്റെ അടിത്താങ്ങ്
  rationale: കഴുകുപാത്രത്തെ താങ്ങുന്ന അടിഘടകത്തെയാണ് כֵּן സൂചിപ്പിക്കുന്നത്. ‘അടിത്താങ്ങ്’ ആധുനിക മലയാളത്തിൽ പീഠം/അടിസ്ഥാനം എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
