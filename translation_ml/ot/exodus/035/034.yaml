  to: പഠിപ്പിക്കാനുള്ള[a] കഴിവ് അവന്റെ ഹൃദയത്തിൽ ദൈവം വെച്ചിരിക്കുന്നു—അവനും ദാൻ ഗോത്രത്തിലെ അഹീസാമാക്കിന്റെ മകൻ ഒഹൊലീയാബും.
