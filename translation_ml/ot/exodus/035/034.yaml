source:
  edition: WLC
  text: וּ/לְ/הוֹרֹ֖ת נָתַ֣ן בְּ/לִבּ֑/וֹ ה֕וּא וְ/אָֽהֳלִיאָ֥ב בֶּן אֲחִיסָמָ֖ךְ לְ/מַטֵּה דָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/034.yaml
  text: And he has put in his heart the ability to teach[a], both he and Oholiab son of Ahisamach, of the tribe of Dan.
translation:
  language: ml
  text: പഠിപ്പിക്കാനുള്ള[a] കഴിവ് അവന്റെ ഹൃദയത്തിൽ ദൈവം വെച്ചിരിക്കുന്നു—അവനും ദാൻ ഗോത്രത്തിലെ അഹീസാമാക്കിന്റെ മകൻ ഒഹൊലീയാബും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിർദേശം നൽകാനുള്ള.’ എബ്രായ ഇൻഫിനിറ്റീവ് പൊതുവായ പഠിപ്പിക്കലിനെ മാത്രമല്ല, വൈദഗ്ധ്യമുള്ള പ്രവൃത്തിയിൽ മാർഗനിർദേശം നൽകുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: പഠിപ്പിക്കാനുള്ള കഴിവ്
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള ירה ഇവിടെ ‘പഠിപ്പിക്കുക’ അല്ലെങ്കിൽ ‘നിർദേശം നൽകുക’ എന്നാണ്. נָתַן בְּלִבּוֹ എന്ന പ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായ മലയാളത്തിനായി ‘കഴിവ്’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: נָתַן בְּלִבּוֹ
  choice: അവരുടെ ഉള്ളിൽ നിക്ഷേപിച്ചു
  rationale: ഈ എബ്രായപ്രയോഗം ഉള്ളിലുള്ള കഴിവോ പ്രേരണയോ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഹൃദയം എന്ന പദത്തിന്റെ അക്ഷരാർഥം നിർബന്ധിക്കാതെ അതിന്റെ ആന്തരിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; തുടർന്നുള്ള രണ്ടു വ്യക്തികളെയും ഉൾക്കൊള്ളാൻ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: הוּא וְאָהֳלִיאָב
  choice: അവനിലും ... ഒഹൊലീയാബിലും
  rationale: മൂലത്തിലെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് കഴിവ് ലഭിച്ച ഇരുവരെയും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: അഹീസാമാക്കിന്റെ മകൻ
  rationale: വംശബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: לְמַטֵּה דָן
  choice: ദാൻ ഗോത്രത്തിലെ
  rationale: לְ ഇവിടെ ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നു; ‘ദാൻ ഗോത്രത്തിലെ’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
