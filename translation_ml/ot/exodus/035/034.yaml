translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ആന്തരിക ദാനത്തിന്റെ ആശയം ‘ഉള്ളിൽ നിക്ഷേപിച്ചു’ എന്നു നിലനിർത്തി; വാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ഏകവചന ഹൃദയപ്രയോഗം ആശയപരമായി ബഹുവചനമാക്കി.
