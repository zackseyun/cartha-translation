  terminology: ‘യഹ്‌വേ,’ ‘ഗിബെയോന്യർ,’ ‘പ്രായശ്ചിത്തം,’ and ‘യഹ്‌വേയുടെ അവകാശം’ are suitable and source-sensitive. The cultural note helpfully identifies the referent of ‘the inheritance of Yahweh’ without replacing the metaphor in the main text.
