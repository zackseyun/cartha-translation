  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/גִּבְעֹנִ֔ים מָ֥ה אֶעֱשֶׂ֖ה לָ/כֶ֑ם וּ/בַ/מָּ֣ה אֲכַפֵּ֔ר וּ/בָרְכ֖וּ אֶת נַחֲלַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
translation:
  language: ml
  text: 'ദാവീദ് ഗിബെയോന്യരോടു പറഞ്ഞു: “ഞാൻ നിങ്ങൾക്കുവേണ്ടി എന്തു ചെയ്യണം? ഏതു മാർഗത്തിലൂടെ ഞാൻ പ്രായശ്ചിത്തം ചെയ്യണം, നിങ്ങൾ യഹ്‌വേയുടെ അവകാശത്തെ[a] അനുഗ്രഹിക്കേണ്ടതിന്[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹ്‌വേയുടെ അവകാശം’ എന്നത് യഹ്‌വേക്കു സ്വന്തമായ ജനമായ ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ, “യഹ്‌വേയുടെ അവകാശത്തെ അനുഗ്രഹിക്കുവിൻ.” ഹീബ്രുരൂപം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഒരു സമുച്ചിത ഖണ്ഡമായി വായിക്കാം; പ്രധാനപാഠം സന്ദർഭത്തിൽ സാധ്യതയേറിയ ഉദ്ദേശ്യ/ഫലഭാവം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; തുടർന്ന് വരുന്ന ദാവീദിന്റെ വാക്കുകളെ അതിവ്യാഖ്യാനം ചെയ്യാതെ അവതരിപ്പിക്കുന്നു.
- source_word: הַגִּבְעֹנִים
  choice: ഗിബെയോന്യർ
  rationale: ഗിബെയോൻ ദേശക്കാരെ സൂചിപ്പിക്കുന്ന ജനനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: מָה אֶעֱשֶׂה לָכֶם
  choice: ഞാൻ നിങ്ങൾക്കുവേണ്ടി എന്തു ചെയ്യണം?
  rationale: ചോദനാപദവും അപൂർണക്രിയയും ചേർന്നുള്ള ആലോചനാത്മക ഭാവി അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּבַמָּה
  choice: എന്തു മുഖാന്തരം
  rationale: ‘എന്തുകൊണ്ട്’ എന്നു പറഞ്ഞാൽ കാരണത്തെക്കുറിച്ചുള്ള ചോദ്യമായി തെറ്റിദ്ധരിക്കാം; ‘എന്തു മുഖാന്തരം’ എന്നത് ഹീബ്രുവിലെ ഉപകരണാർഥം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: אֲכַפֵּר
  choice: ഞാൻ പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: כפר എന്ന പിയേൽ ക്രിയയുടെ കുറ്റപരിഹാരപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു; വെറും നഷ്ടപരിഹാരമോ ക്ഷമാപണമോ ആയി ചുരുക്കുന്നില്ല.
- source_word: וּבָרְכוּ
  choice: നിങ്ങൾ അനുഗ്രഹിക്കേണ്ടതിന്
  rationale: സന്ദർഭത്തിൽ ദാവീദ് നിർവഹിക്കേണ്ട പരിഹാരത്തിന്റെ ഉദ്ദേശ്യമോ ഫലമോ വ്യക്തമാക്കുന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ലളിതമായ സമുച്ചയവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: נַחֲלַת יְהוָה
  choice: യഹ്‌വേയുടെ അവകാശം
  rationale: נחלה എന്ന പദത്തിന്റെ ‘അവകാശം/പൈതൃകം’ എന്ന രൂപകം നിലനിർത്തുന്നു; ഇവിടെ യഹ്‌വേക്കു സ്വന്തമായ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: രക്തപാതകത്തിന്റെയും ഉടമ്പടിലംഘനത്തിന്റെയും പശ്ചാത്തലത്തിൽ כפר എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പ്രായശ്ചിത്തം ചെയ്യുക
  alternative: പരിഹാരം ചെയ്യുക / നഷ്ടം നികത്തുക
  rationale: ദൈവസന്നിധിയിലെ സമൂഹകുറ്റത്തിനും ഗിബെയോന്യരോടു ചെയ്ത അനീതിക്കും പരിഹാരം വരുത്തുന്ന ഗൗരവം ‘പ്രായശ്ചിത്തം’ സൂക്ഷിക്കുന്നു; അതിനെ വെറും സാമൂഹിക ഒത്തുതീർപ്പായി പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: וּבָרְכוּ אֶת נַחֲלַת יְהוָה എന്ന അവസാന ഖണ്ഡത്തിന്റെ ബന്ധം
  choice: 'ഉദ്ദേശ്യ/ഫലഭാവം: ‘നിങ്ങൾ അനുഗ്രഹിക്കേണ്ടതിന്’'
  alternative: 'ലളിതമായ സമുച്ചയം: ‘യഹ്‌വേയുടെ അവകാശത്തെ അനുഗ്രഹിക്കുവിൻ’'
  rationale: ദാവീദ് ചെയ്യേണ്ട പ്രവൃത്തിയും പ്രായശ്ചിത്തവും ഗിബെയോന്യർ ഇസ്രായേലിനെ അനുഗ്രഹിക്കുന്നതിലേക്കു നയിക്കണമെന്ന സന്ദർഭഭാവം പ്രധാനപാഠം വ്യക്തമാക്കുന്നു; ഹീബ്രുവിന്റെ കൂടുതൽ അക്ഷരാർഥമായ സമുച്ചയവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ഉദ്ദേശ്യഖണ്ഡം മുന്നിൽ വച്ചു. ‘പ്രായശ്ചിത്തം’ എന്ന പരിചിതമായ ദൈവശാസ്ത്രപദം നിലനിർത്തി; ഉപകരണാർഥം വ്യക്തമാക്കാൻ ‘എന്തു മുഖാന്തരം’ ഉപയോഗിച്ചു.
