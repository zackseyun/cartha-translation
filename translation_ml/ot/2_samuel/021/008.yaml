reference: 2 Samuel 21:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֶת שְׁ֠נֵי בְּנֵ֨י רִצְפָּ֤ה בַת אַיָּה֙ אֲשֶׁ֣ר יָלְדָ֣ה לְ/שָׁא֔וּל אֶת אַרְמֹנִ֖י וְ/אֶת מְפִבֹ֑שֶׁת וְ/אֶת חֲמֵ֗שֶׁת בְּנֵי֙ מִיכַ֣ל בַּת שָׁא֔וּל אֲשֶׁ֥ר יָלְדָ֛ה לְ/עַדְרִיאֵ֥ל בֶּן בַּרְזִלַּ֖י הַ/מְּחֹלָתִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
translation:
  language: ml
  text: അങ്ങനെ രാജാവ്, അയ്യാവിന്റെ മകളായ രിസ്പാ ശൗലിനു പ്രസവിച്ച രണ്ടു പുത്രന്മാരായ അർമോനിയെയും മെഫീബോശെത്തെയും, ശൗലിന്റെ മകളായ മീഖൾ മെഹോലാത്യനായ ബർസില്ലായിയുടെ മകൻ അദ്രിയേലിനു പ്രസവിച്ച അഞ്ചു പുത്രന്മാരെയും എടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: അങ്ങനെ ... എടുത്തു
  rationale: വാവ്-തുടർച്ചാഘടന ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. ‘അങ്ങനെ’ മുൻസന്ദർഭവുമായുള്ള തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘എടുത്തു’ എന്നത് לקח എന്ന ക്രിയയുടെ പൊതുവായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ ദാവീദിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും എബ്രായപാഠം വ്യക്തിനാമത്തിനു പകരം പദവി ഉപയോഗിക്കുന്നതിനാൽ അതുതന്നെ നിലനിർത്തി.
- source_word: שְׁנֵי בְּנֵי רִצְפָּה בַת אַיָּה
  choice: അയ്യാവിന്റെ മകളായ രിസ്പാ ... പ്രസവിച്ച [രണ്ട് പുത്രന്മാർ]
  rationale: എബ്രായത്തിലെ സംഖ്യയോടുകൂടിയ ബന്ധനപദസമുച്ചയം രണ്ട് പുത്രന്മാരെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പേരുകൾ രണ്ടും ചേർത്ത് പറയുന്നതിനാൽ ‘രണ്ട്’ പ്രത്യേകം ആവർത്തിക്കാതെതന്നെ എണ്ണം വ്യക്തമാണ്.
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל
  choice: ശൗലിനു പ്രസവിച്ച
  rationale: ילד എന്ന ക്രിയയോടു ചേർന്ന ל പിതാവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ ബന്ധം നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: אַרְמֹנִי וְאֶת מְפִבֹשֶׁת
  choice: അർമോനിയെയും മെഫീബോശെത്തെയും
  rationale: വ്യക്തിനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാളരൂപങ്ങളിൽ ലിപ്യന്തരിച്ചു; കർമസൂചകമായ ‘-യെ’ ചേർത്ത് വാക്യഘടന വ്യക്തമാക്കി.
- source_word: חֲמֵשֶׁת בְּנֵי מִיכַל בַּת שָׁאוּל
  choice: ശൗലിന്റെ മകളായ മീഖൾ ... പ്രസവിച്ച അഞ്ചു പുത്രന്മാർ
  rationale: WLC പാഠത്തിലെ ‘മീഖൾ’ പ്രധാനപാഠത്തിൽ നിലനിർത്തി. പാഠഭേദമായ ‘മേരബ്’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֲשֶׁר יָלְדָה לְעַדְרִיאֵל
  choice: അദ്രിയേലിനു പ്രസവിച്ച
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ സമാന എബ്രായഘടനയോട് ഒത്തവിധം പരിഭാഷപ്പെടുത്തി.
- source_word: בֶּן בַּרְזִלַּי הַמְּחֹלָתִי
  choice: മെഹോലാത്യനായ ബർസില്ലായിയുടെ മകൻ
  rationale: പിതൃനാമബന്ധവും ഭൂമിശാസ്ത്രപരമായ വിശേഷണവും മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ നൽകി.
theological_decisions:
- issue: അദ്രിയേലിന്റെ പുത്രന്മാരുടെ അമ്മയായി ‘മീഖൾ’ എന്നു പറയുന്നതിലെ ചരിത്രപരവും പാഠപരവുമായ സംഘർഷം
  choice: എബ്രായ മൂലപാഠത്തിലെ ‘മീഖൾ’ പ്രധാനപാഠത്തിൽ നിലനിർത്തി; ‘മേരബ്’ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ശൗലിന്റെ മകളായ മേരബ്
  rationale: WLC ഇവിടെ ‘മീഖൾ’ എന്നു വായിക്കുന്നതിനാൽ പൊരുത്തപ്പെടുത്താനായി പ്രധാനപാഠം നിശ്ശബ്ദമായി തിരുത്തിയില്ല. എന്നാൽ 1 ശമൂവേൽ 18:19 അദ്രിയേലിനെ മേരബിന്റെ ഭർത്താവായി പറയുന്നതിനാൽ പ്രധാനപ്പെട്ട പാഠഭേദം വായനക്കാരനു തുറന്നുകാട്ടി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളോട് ചേർന്നും എബ്രായരൂപത്തോട് അടുത്തും നൽകി. മൂലപാഠത്തിലെ നീണ്ട സമാന്തരഘടന നിലനിർത്തിയെങ്കിലും ബന്ധങ്ങൾ വ്യക്തമാകുന്ന വിധത്തിൽ മലയാള പദക്രമം ക്രമപ്പെടുത്തി.
