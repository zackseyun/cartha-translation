id: 2SA.21.7
reference: 2 Samuel 21:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּחְמֹ֣ל הַ/מֶּ֔לֶךְ עַל מְפִי בֹ֖שֶׁת בֶּן יְהוֹנָתָ֣ן בֶּן שָׁא֑וּל עַל שְׁבֻעַ֤ת יְהוָה֙ אֲשֶׁ֣ר בֵּֽינֹתָ֔/ם בֵּ֣ין דָּוִ֔ד וּ/בֵ֖ין יְהוֹנָתָ֥ן בֶּן שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
translation:
  language: ml
  text: എന്നാൽ, ദാവീദിനും ശൗലിന്റെ മകനായ യോനാഥാനും തമ്മിലുണ്ടായിരുന്ന യഹോവയുടെ ശപഥം[a] നിമിത്തം, രാജാവ് യോനാഥാന്റെ മകനായ മെഫീബോശെത്തിനെ ജീവൻ രക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, യഹോവയുടെ നാമത്തിൽ ചെയ്ത ശപഥം എന്നു ഇവിടെ അർഥമാകാം; ദാവീദും യോനാഥാനും തമ്മിൽ യഹോവയെ സാക്ഷിയാക്കി ചെയ്ത ശപഥം.
    reason: ‘യഹോവയുടെ ശപഥം’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ സന്ദർഭത്തിൽ സാധ്യതയേറിയ അർഥം സൂചിപ്പിക്കുമ്പോഴും, പ്രധാനപാഠത്തിലെ പദബന്ധത്തിന്റെ അവ്യക്തത നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: ഒഴിവാക്കി
  rationale: ഈ സന്ദർഭത്തിൽ കൊല്ലപ്പെടാൻ ഏല്പിക്കാതെ ജീവൻ രക്ഷിച്ചതാണ് ക്രിയയുടെ മൂർത്തമായ അർഥം. ‘കരുണ തോന്നി’ എന്ന പൊതുവായ പ്രയോഗത്തേക്കാൾ ‘ഒഴിവാക്കി’ ആ കഥാസന്ദർഭം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ ദാവീദിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, എബ്രായപാഠത്തിലെ ഔദ്യോഗിക വിശേഷണം നിലനിർത്തുന്നു.
- source_word: מְפִיבֹשֶׁת
  choice: മെഫീബോശെത്ത്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: ശൗലിന്റെ മകനായ യോനാഥാന്റെ മകൻ
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള വംശപരമ്പരാഘടന സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַל
  choice: കാരണം
  rationale: രാജാവിന്റെ നടപടിക്കുള്ള കാരണം ഇവിടെ עַל അവതരിപ്പിക്കുന്നു.
- source_word: שְׁבֻעַת יְהוָה
  choice: യഹോവയുടെ ശപഥം
  rationale: 'എബ്രായ ഘടനയുടെ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു: ഇത് യഹോവയുടെ നാമത്തിൽ ചെയ്ത ശപഥമായിരിക്കാം; യഹോവ നൽകിയ ശപഥമെന്ന വായനയും വ്യാകരണപരമായി പൂർണമായി നീക്കം ചെയ്യുന്നില്ല.'
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲשֶׁר בֵּינֹתָם
  choice: തമ്മിലുണ്ടായിരുന്ന
  rationale: ശപഥം രണ്ടു കക്ഷികൾക്കിടയിൽ നിലവിലുണ്ടായിരുന്നുവെന്ന ബന്ധഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בֵּין דָּוִד וּבֵין יְהוֹנָתָן
  choice: ദാവീദിനും ... യോനാഥാനും തമ്മിൽ
  rationale: ആവർത്തിച്ചുള്ള എബ്രായ പൂർവപ്രത്യയം മലയാളത്തിലെ ദ്വിപക്ഷ ‘-നും ... -നും തമ്മിൽ’ ഘടനയിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ‘യഹോവയുടെ ശപഥം’ എന്നതിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ അക്ഷരാർഥ ഘടനയായ ‘യഹോവയുടെ ശപഥം’ നിലനിർത്തി
  alternative: യഹോവയുടെ നാമത്തിൽ ദാവീദും യോനാഥാനും ചെയ്ത ശപഥം
  rationale: കഥാസന്ദർഭത്തിൽ യഹോവയെ സാക്ഷിയാക്കി അവന്റെ നാമത്തിൽ ചെയ്ത ശപഥമാണ് സാധ്യതയേറിയ അർഥം. എങ്കിലും പ്രധാനപാഠം ദൈവം തന്ന ശപഥമെന്ന വ്യാകരണസാധ്യതയെ നിശ്ശബ്ദമായി ഇല്ലാതാക്കുന്നില്ല; അടിക്കുറിപ്പ് സാധ്യതയേറിയ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- issue: ‘രാജാവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: എബ്രായപാഠംപോലെ ‘രാജാവ്’ നിലനിർത്തി
  alternative: ദാവീദ്
  rationale: സന്ദർഭത്തിൽ രാജാവ് ദാവീദാണെങ്കിലും മൂലപാഠം ഉപയോഗിക്കുന്ന വിശേഷണം വിവർത്തനം നേരിട്ട് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. വംശാവലിയുടെ ആവർത്തിച്ച ഘടനയും ‘രാജാവ്’ എന്ന വിശേഷണവും സംരക്ഷിച്ചു. [a] എന്ന അടിക്കുറിപ്പുസൂചകം ബന്ധപ്പെട്ട പ്രയോഗത്തിനു പിന്നാലെ പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
