revisions:
- from: എന്നാൽ ശൗലിന്റെ മകനായ യോനാഥാന്റെ മകൻ മെഫീബോശെത്തിനെ രാജാവ് ഒഴിവാക്കി; കാരണം ദാവീദിനും ശൗലിന്റെ മകനായ യോനാഥാനും തമ്മിലുണ്ടായിരുന്ന യഹോവയുടെ ശപഥം[a] ആയിരുന്നു.
  to: എന്നാൽ, ദാവീദിനും ശൗലിന്റെ മകനായ യോനാഥാനും തമ്മിലുണ്ടായിരുന്ന യഹോവയുടെ ശപഥം[a] നിമിത്തം, രാജാവ് യോനാഥാന്റെ മകനായ മെഫീബോശെത്തിനെ ജീവൻ രക്ഷിച്ചു.
  rationale: മുഖ്യ തിരുത്തൽ ‘ഒഴിവാക്കി’ എന്ന അവ്യക്തപ്രയോഗത്തിനു പകരം ‘ജീവൻ രക്ഷിച്ചു’ ഉപയോഗിക്കുന്നതാണ്. ഇതു രാജാവ് മെഫീബോശെത്തിനെ മരണത്തിൽനിന്ന് ഒഴിവാക്കിയെന്ന വാക്യത്തിന്റെ കഥാസന്ദർഭം വ്യക്തമാക്കുന്നു; അതേസമയം മൂലപാഠത്തിലെ ഔദ്യോഗികവും വംശപരമ്പരാപരവുമായ ഘടനയും യഹോവയുടെ ശപഥത്തെക്കുറിച്ചുള്ള അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
