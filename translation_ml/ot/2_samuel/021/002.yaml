  text: וַ/יִּקְרָ֥א הַ/מֶּ֛לֶךְ לַ/גִּבְעֹנִ֖ים וַ/יֹּ֣אמֶר אֲלֵי/הֶ֑ם וְ/הַ/גִּבְעֹנִ֞ים לֹ֣א מִ/בְּנֵ֧י יִשְׂרָאֵ֣ל הֵ֗מָּה כִּ֚י אִם מִ/יֶּ֣תֶר הָ/אֱמֹרִ֔י וּ/בְנֵ֤י יִשְׂרָאֵל֙ נִשְׁבְּע֣וּ לָ/הֶ֔ם וַ/יְבַקֵּ֤שׁ שָׁאוּל֙ לְ/הַכֹּתָ֔/ם בְּ/קַנֹּאת֥/וֹ לִ/בְנֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
translation:
  language: ml
  text: അതിനാൽ രാജാവ് ഗിബെയോന്യരെ വിളിച്ചുവരുത്തി അവരോടു സംസാരിച്ചു. ഗിബെയോന്യർ ഇസ്രായേൽമക്കളിൽപ്പെട്ടവരല്ലായിരുന്നു[a]; അമോര്യരുടെ ശേഷിപ്പിൽപ്പെട്ടവരായിരുന്നു.[b] ഇസ്രായേൽമക്കൾ അവരോടു ശപഥം ചെയ്തിരുന്നു. എന്നാൽ ഇസ്രായേലിനും യെഹൂദയ്ക്കും വേണ്ടിയുള്ള തന്റെ തീക്ഷ്ണമായ ആവേശം നിമിത്തം, ശൗൽ അവരെ കൊല്ലാൻ ശ്രമിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇസ്രായേല്യരായിരുന്നില്ല.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “ഇസ്രായേൽമക്കളിൽപ്പെട്ടവരല്ലായിരുന്നു” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “അമോര്യരിൽ ശേഷിച്ചവരിൽപ്പെട്ടവരായിരുന്നു.”
    reason: lexical_alternative
  - marker: c
    text: “തീക്ഷ്ണമായ ആവേശം” എന്നതിന് “അസൂയ” എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായപദം സന്ദർഭമനുസരിച്ച് തീക്ഷ്ണമായ ആവേശത്തെയോ അസൂയയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ לַגִּבְעֹנִים
  choice: രാജാവ് ഗിബെയോന്യരെ വിളിച്ചുവരുത്തി
  rationale: קרא എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ സന്നിധിയിലേക്കു വിളിക്കുക എന്ന അർഥമാണ്; ‘വിളിച്ചുവരുത്തി’ ആ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ‘രാജാവ്’ എന്ന നിർദിഷ്ട നാമം മൂലപാഠംപോലെ ദാവീദിന്റെ പേര് ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: അവരോടു സംസാരിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരോടു പറഞ്ഞു’; മുൻവാക്യത്തിലെ വിളിച്ചുവരുത്തലുമായി ചേർന്ന് മലയാളത്തിൽ ‘സംസാരിച്ചു’ സ്വാഭാവികവും അർഥപരിധിക്കുള്ളിലുമാണ്.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: ഇസ്രായേൽമക്കളിൽപ്പെട്ടവരായിരുന്നില്ല
  rationale: בני ישראל എന്ന കുടുംബബന്ധസൂചക പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുകയും מן എന്ന അംഗത്വ/ഉത്ഭവ ആശയം ‘പ്പെട്ടവർ’കൊണ്ട് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מִיֶּתֶר הָאֱמֹרִי
  choice: അമോര്യരിൽ ശേഷിച്ചവരായിരുന്നു
  rationale: יֶתֶר ശേഷിപ്പ് അഥവാ ശേഷിച്ച ഭാഗം സൂചിപ്പിക്കുന്നു. അമോര്യരിൽ അവശേഷിച്ച ജനവിഭാഗം എന്ന അർഥം സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: അവരോടു ശപഥം ചെയ്തിരുന്നു
  rationale: സംഭവത്തിനു മുമ്പുണ്ടായ ഉടമ്പടിശപഥത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ചെയ്തിരുന്നു’ എന്ന പൂർവകാലരൂപം അനുയോജ്യം.
- source_word: לְהַכֹּתָם
  choice: അവരെ കൊന്നൊടുക്കാൻ
  rationale: נכה ഇവിടെ കേവലം പ്രഹരിക്കലല്ല, കൂട്ടത്തെ ഇല്ലാതാക്കാനുള്ള മാരകശ്രമമാണ് സൂചിപ്പിക്കുന്നത്; ‘കൊന്നൊടുക്കാൻ’ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּקַנֹּאתוֹ
  choice: തന്റെ തീക്ഷ്ണതയിൽ
  rationale: קנא ഇവിടെ ഇസ്രായേലിനും യെഹൂദയ്ക്കും വേണ്ടിയുള്ള അതിതീവ്ര പക്ഷപാതപരമായ ആവേശം സൂചിപ്പിക്കുന്നു. ‘തീക്ഷ്ണത’ അതിന്റെ നൈതികമായ അസ്പഷ്ടത മുൻകൂട്ടി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: בני ישראל എന്ന ദേശീയ-കുടുംബപരമായ വിശേഷണം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഒരേ വാക്യത്തിൽ രണ്ടുതവണ വരുന്ന മൂലപദബന്ധം തിരിച്ചറിയാൻ കഴിയുന്ന വിധം നിലനിർത്തുന്നു; അതേസമയം മലയാളത്തിലെ പതിവായ ബൈബിൾഭാഷയിലും ഇത് മനസ്സിലാകുന്നതാണ്.
- issue: ശൗലിന്റെ പ്രേരണയിലെ קנא എന്ന പദത്തിന്റെ ഭാവം
  choice: തീക്ഷ്ണത
  alternative: അസൂയ / എരിവ്
  rationale: ദേശീയ താൽപര്യത്തിനുവേണ്ടിയുള്ള ശക്തമായ ആവേശമാണ് സന്ദർഭത്തിൽ മുഖ്യം; ‘അസൂയ’ എന്നു പറഞ്ഞാൽ ഇല്ലാത്ത മത്സര-ഈർഷ്യാഭാവം വരാം. എന്നാൽ പദത്തിന്റെ നൈതികമായി സംശയാസ്പദമായ തീവ്രത ‘തീക്ഷ്ണത’യിൽ നിലനിൽക്കുന്നു.
- issue: לְהַכֹּתָם എന്നതിന്റെ മാരകബലം
  choice: കൊന്നൊടുക്കാൻ
  alternative: അവരെ പ്രഹരിക്കാൻ / വെട്ടിവീഴ്ത്താൻ
  rationale: ഗിബെയോന്യരെ ഇല്ലാതാക്കാനുള്ള ശൗലിന്റെ ശ്രമമാണ് വിശാലസന്ദർഭം കാണിക്കുന്നത്. അതിനാൽ മാരകഫലം വ്യക്തമാക്കുന്നത് ന്യായമാണ്; പ്രത്യേക ആയുധമോ നടപടിയോ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കഥാഭാഗത്തിന്റെ ഒഴുക്ക് നിലനിർത്താൻ പശ്ചാത്തലവിവരങ്ങൾ ചെറുവാക്യങ്ങളാക്കി. ‘ഇസ്രായേൽമക്കൾ’, ‘ശപഥം’ തുടങ്ങിയ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
