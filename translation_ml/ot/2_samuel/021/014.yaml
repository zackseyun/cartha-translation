  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
translation:
  language: ml
  text: അവർ ശൗലിന്റെയും അവന്റെ മകനായ യോനാഥാന്റെയും അസ്ഥികൾ ബെന്യാമീൻദേശത്ത്, സേലയിൽ, ശൗലിന്റെ പിതാവായ കീശിന്റെ കല്ലറയിൽ അടക്കം ചെയ്തു. രാജാവ് കൽപ്പിച്ചതെല്ലാം അവർ ചെയ്തു. അതിനുശേഷം ദേശത്തിനുവേണ്ടിയുള്ള പ്രാർത്ഥനയ്ക്ക് ദൈവം അനുകൂലമായി ഉത്തരം നൽകി.[a]
