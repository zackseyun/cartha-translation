  alternative: ദേശത്തിനുവേണ്ടി ദൈവത്തോട് അപേക്ഷിക്കപ്പെട്ടു; ദേശത്തിനുവേണ്ടിയുള്ള പ്രാർഥന ദൈവം കേട്ടു
  rationale: എബ്രായ വാക്യത്തിൽ ‘പ്രാർഥന’ എന്ന നാമം പ്രത്യേകം ഇല്ലെങ്കിലും עתר എന്ന ക്രിയയുടെ നിഫാൽ രൂപം അപേക്ഷയ്ക്ക് അനുകൂലമായി പ്രതികരിക്കുന്ന ആശയം വഹിക്കുന്നു. ‘ദേശം സൗഖ്യമാക്കി’ എന്ന സന്ദർഭാധിഷ്ഠിത വികസനം ചേർക്കാതെ ക്രിയയിലെ അപേക്ഷാർഥം പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അസ്ഥികൾ,’ ‘കല്ലറ,’ ‘കല്പിച്ചു’ എന്നീ മൂർത്തവും പരിചിതവുമായ പദങ്ങൾ ഉപയോഗിച്ചു. അവ്യക്തമായ സർവനാമബന്ധം മാത്രം വായനാസൗകര്യത്തിനായി ‘ശൗലിന്റെ പിതാവായ’ എന്നു വ്യക്തമാക്കി.
