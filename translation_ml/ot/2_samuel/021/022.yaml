revisions:
- from: ഈ നാലുപേരും ഗത്തിൽ രാഫായ്ക്കു ജനിച്ചവരായിരുന്നു[a]. അവർ ദാവീദിന്റെയും അവന്റെ ദാസന്മാരുടെയും കൈകളാൽ വീണു.
  to: ഈ നാലുപേരും ഗത്തിൽ രാഫായ്ക്ക്[a] ജനിച്ചവരായിരുന്നു. അവർ ദാവീദിന്റെ കൈയാലും അവന്റെ ദാസന്മാരുടെ കൈകളാലും വീണു.
