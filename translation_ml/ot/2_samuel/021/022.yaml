id: 2SA.21.22
reference: 2 Samuel 21:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶת אַרְבַּ֥עַת אֵ֛לֶּה יֻלְּד֥וּ לְ/הָ/רָפָ֖ה בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖ד וּ/בְ/יַ֥ד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: ml
  text: ഈ നാലുപേരും ഗത്തിൽ രാഫായ്ക്ക്[a] ജനിച്ചവരായിരുന്നു. അവർ ദാവീദിന്റെ കൈയാലും അവന്റെ ദാസന്മാരുടെ കൈകളാലും വീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രാഫാ’ എന്നതിന് ‘ഭീമൻ’ എന്നും ‘റെഫായീമുകൾ’ എന്നും അർഥമാക്കാം. ഗത്തുമായി ബന്ധപ്പെട്ട ഭീമവംശത്തിൽ നിന്നുള്ള വംശപരമ്പരയെയാണ് ഹീബ്രു പദപ്രയോഗം സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְבַּעַת אֵלֶּה
  choice: ഈ നാലുപേരും
  rationale: എബ്രായത്തിൽ ‘പുരുഷന്മാർ’ എന്ന പദം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും, മുമ്പ് പരാമർശിച്ച വ്യക്തികളെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഈ നാലുപേരും’ എന്നു നൽകി.
- source_word: יֻלְּדוּ
  choice: ജനിച്ചവരായിരുന്നു
  rationale: ഇവിടെ ילד എന്ന ധാതുവിന്റെ നിഷ്ക്രിയരൂപം ജനനത്തെയും വംശപരമ്പരയെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ജനിച്ചവരായിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְהָרָפָה
  choice: രാഫായ്ക്കു
  rationale: നിർദിഷ്ടരൂപത്തിലുള്ള ഹീബ്രു പദത്തെ വ്യക്തിയുടെയോ വംശപൂർവികന്റെയോ പേരായി കരുതാവുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു; ‘മല്ലൻ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ചില്ല.
- source_word: בְּגַת
  choice: ഗത്തിൽ
  rationale: സ്ഥലസൂചകമായ בְ എന്ന ഉപസർഗത്തിന്റെ നേരായ, സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: וַיִּפְּלוּ
  choice: അവർ ... വീണു
  rationale: യുദ്ധസന്ദർഭത്തിൽ മരണം സൂചിപ്പിക്കുന്ന נפל എന്ന ക്രിയയുടെ ‘വീഴുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തി.
- source_word: בְיַד
  choice: കൈകളാൽ
  rationale: പ്രവർത്തകത്വം സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയായ ‘കൈയാൽ’ എന്ന പ്രയോഗം മലയാളത്തിലും വ്യക്തവും ഗൗരവമുള്ളതുമാണ്; ദാവീദിനെയും ദാസന്മാരെയും ചേർത്തുള്ള സംയുക്തപ്രയോഗത്തിന് ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: עֲבָדָיו
  choice: അവന്റെ ദാസന്മാർ
  rationale: രാജകീയ-സൈനിക സാഹചര്യത്തിലെ സേവകരെയോ അനുചരരെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരായ പരിഭാഷ; ‘ആളുകൾ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം ഒഴിവാക്കി.
theological_decisions:
- issue: הָרָפָה എന്നതിന്റെ തിരിച്ചറിയൽ
  choice: പേര് അഥവാ വംശപൂർവികനെ സൂചിപ്പിക്കാവുന്ന ‘രാഫാ’ എന്ന ലിപ്യന്തരണം
  alternative: ‘മല്ലൻ’ എന്ന പൊതുനാമം, അല്ലെങ്കിൽ ‘റെഫായീം’ എന്ന ജനവിഭാഗനാമം
  rationale: ഗത്തിലെ മല്ലവംശവുമായി ഈ നാലുപേരെയും ബന്ധിപ്പിക്കുന്നതായിരിക്കാം പ്രയോഗം. എന്നാൽ ഹീബ്രു രൂപം പലവിധത്തിൽ ഗ്രഹിക്കാവുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ഒരു വ്യാഖ്യാനം മാത്രം ഉറപ്പിക്കാതെ അവ്യക്തത നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. എബ്രായത്തിലെ ‘കൈയാൽ വീണു’ എന്ന യുദ്ധശൈലി നിലനിർത്തിയപ്പോൾ, വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
