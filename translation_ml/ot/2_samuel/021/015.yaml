translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രായ കഥനത്തിലെ ആവർത്തനവും പ്രവർത്തനക്രമവും നിലനിർത്തിയിട്ടുണ്ട്.
