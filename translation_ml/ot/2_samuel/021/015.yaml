  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּהִי ע֧וֹד מִלְחָמָ֛ה לַ/פְּלִשְׁתִּ֖ים אֶת יִשְׂרָאֵ֑ל וַ/יֵּ֨רֶד דָּוִ֜ד וַ/עֲבָדָ֥י/ו עִמּ֛/וֹ וַ/יִּלָּחֲמ֥וּ אֶת פְּלִשְׁתִּ֖ים וַ/יָּ֥עַף דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
translation:
  language: ml
  text: ഫെലിസ്ത്യരും ഇസ്രായേലും തമ്മിൽ വീണ്ടും യുദ്ധമുണ്ടായി. ദാവീദും അവനോടൊപ്പം അവന്റെ സേവകരും ഇറങ്ങിച്ചെന്ന് ഫെലിസ്ത്യരോടു പൊരുതി. ദാവീദ് ക്ഷീണിച്ചുപോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ക്ഷീണിച്ചുപോയി’ എന്നതിന് ‘തളർന്നുപോയി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: വീണ്ടും യുദ്ധമുണ്ടായി
  rationale: עוֹד ശത്രുതയുടെ ആവർത്തനത്തെയും מִלְחָמָה യുദ്ധത്തെയും സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അസ്തിത്വാർഥത്തോടെ പരിഭാഷപ്പെടുത്തി.
- source_word: לַפְּלִשְׁתִּים אֶת יִשְׂרָאֵל
  choice: ഫെലിസ്ത്യരും ഇസ്രായേലും തമ്മിൽ
  rationale: ഹീബ്രായ പ്രയോഗം ഇരുകക്ഷികൾ തമ്മിലുള്ള ശത്രുതയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘തമ്മിൽ’ അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: ירד എന്ന ക്രിയയുടെ ‘താഴേക്കു പോകുക/ഇറങ്ങുക’ എന്ന ദിശാസൂചന നിലനിർത്തിക്കൊണ്ട് മലയാള വിവരണശൈലിയിൽ സ്വാഭാവികമായി നൽകി.
- source_word: וַעֲבָדָיו עִמּוֹ
  choice: അവനോടൊപ്പം അവന്റെ സേവകരും
  rationale: עבד എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘സേവകർ’ നിലനിർത്തുന്നു; രാജാവിന്റെ സൈനിക അനുചരന്മാരും ഇതിൽ ഉൾപ്പെടാം.
- source_word: וַיִּלָּחֲמוּ אֶת פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരോടു പൊരുതി
  rationale: לחם എന്നത് യുദ്ധത്തിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പൊരുതി’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיָּעַף דָּוִד
  choice: ദാവീദ് ക്ഷീണിച്ചുപോയി
  rationale: ക്രിയ ക്ഷീണിതനാകുക അഥവാ തളരുക എന്ന അവസ്ഥയിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുന്നു; ‘ക്ഷീണിച്ചുപോയി’ ആ ആരംഭാർഥം കാത്തുസൂക്ഷിക്കുന്നു.
