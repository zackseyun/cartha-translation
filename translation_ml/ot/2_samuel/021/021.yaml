translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. യുദ്ധസന്ദർഭത്തിലെ ധിക്കാരവും മരണകരമായ പ്രഹരവും അതിശയോക്തിയില്ലാതെ പ്രകടിപ്പിച്ചു. അടിക്കുറിപ്പിന്റെ സൂചകം ബന്ധപ്പെട്ട പേരിനോടു ചേർത്തു.
