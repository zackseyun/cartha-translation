  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שמעי אֲחִ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/021.yaml
  text: And he defied Israel[a], and Jonathan the son of Shimei, David’s brother, struck him down.
translation:
  language: ml
  text: അവൻ ഇസ്രായേലിനെ നിന്ദിച്ചു വെല്ലുവിളിച്ചു. അപ്പോൾ ദാവീദിന്റെ സഹോദരനായ ശിമെയിയുടെ[a] മകൻ യോനാഥാൻ അവനെ അടിച്ചു വീഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളും 1 ദിനവൃത്താന്തം 20:7-ലെ സമാന്തരവിവരണവും ഇവിടെ ‘ശിമെയി’ എന്നതിനുപകരം ‘ശിമെയാ’ അഥവാ ‘ശിമെയാഹ്’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: നിന്ദിച്ചു വെല്ലുവിളിച്ചു
  rationale: യുദ്ധസന്ദർഭത്തിൽ חרף അപമാനകരമായ വാക്കുകളിലൂടെയുള്ള ധിക്കാരവും വെല്ലുവിളിയും സൂചിപ്പിക്കുന്നു. ‘നിന്ദിച്ചു വെല്ലുവിളിച്ചു’ എന്ന പ്രയോഗം ഈ രണ്ടു ഭാവങ്ങളും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ
  rationale: മൂലപാഠം ‘ഇസ്രായേൽ’ എന്ന ദേശീയസമൂഹത്തെ ഏകവചന കൂട്ടായ നാമമായി നേരിട്ടുള്ള കർമമാക്കുന്നു; അതേ രൂപം നിലനിർത്തി.
- source_word: וַיַּכֵּהוּ
  choice: അവനെ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്നതാണ്; ഈ യുദ്ധസന്ദർഭത്തിൽ പ്രഹരം മരണകരമാണെന്ന് സൂചിപ്പിക്കുന്നു. ‘വെട്ടിവീഴ്ത്തി’ പോരാട്ടത്തിന്റെ ദൃശ്യഭാവവും അന്തിമഫലവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: בֶּן שמעי
  choice: ശിമെയിയുടെ മകൻ
  rationale: മസോറെറ്റിക് പാഠത്തിലെ שמעי എന്ന രൂപം പിന്തുടരുന്നു; സമാന്തരപാഠത്തിലെ പേരുരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: אֲחִי דָוִד
  choice: ദാവീദിന്റെ സഹോദരനായ
  rationale: ‘ദാവീദിന്റെ സഹോദരൻ’ എന്ന ബന്ധം ശിമെയിയെ വിശേഷിപ്പിക്കുന്നതായി മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
