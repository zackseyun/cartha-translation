  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
translation:
  language: ml
  text: അപ്പോൾ ദാവീദ് പോയി ശൗലിന്റെയും ശൗലിന്റെ മകനായ യോനാഥാന്റെയും അസ്ഥികൾ[a] യാബേശ്-ഗിലെയാദിലെ നിവാസികളിൽനിന്ന് എടുത്തു. ഫെലിസ്ത്യർ ഗിൽബോവയിൽ[c] ശൗലിനെ വീഴ്ത്തിയ ദിവസം അവരെ തൂക്കിയിട്ടിരുന്ന[b] ബേത്ത്-ശാനിലെ പൊതുചത്വരത്തിൽനിന്ന് ആ നിവാസികൾ അവ മോഷ്ടിച്ചെടുത്തിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അസ്ഥികൾ’ എന്നതിന് പകരം ‘അവശിഷ്ടങ്ങൾ’ എന്നും പറയാം; എന്നാൽ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘അസ്ഥികൾ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘തൂക്കിയിട്ടിരുന്നു’ എന്നത് ‘പ്രദർശിപ്പിച്ചിരുന്നു’ എന്നും, കൂടുതൽ ശക്തമായ അർഥത്തിൽ ‘കഴുവേറ്റിയിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായക്രിയയുടെ ഏറ്റവും നേരിട്ടുള്ള അർഥം ‘തൂക്കുക’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: ഗിൽബോവ എന്നത് ശൗൽ വീണ പർവതപ്രദേശമാണ് (1 ശമൂവേൽ 31:8–13 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמוֹת
  choice: അസ്ഥികൾ
  rationale: ഈ നാമം അക്ഷരാർഥത്തിൽ ‘അസ്ഥികൾ’ എന്നാണ്. ശവസംസ്കാരത്തിനായി അവശിഷ്ടങ്ങൾ വീണ്ടെടുക്കുന്ന സന്ദർഭത്തിലും എബ്രായപദത്തിന്റെ ദൃശ്യമായ കൃത്യത ഇത് നിലനിർത്തുന്നു.
- source_word: בַּעֲלֵי יָבֵישׁ גִּלְעָד
  choice: യാബേശ്-ഗിലെയാദിലെ നിവാസികൾ
  rationale: സ്ഥലനാമത്തോടുചേർന്ന בַּעֲלֵי ഇവിടെ ആ സ്ഥലത്തെ ആളുകളെയോ നിവാസികളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ‘ഉടമകൾ’ എന്ന അക്ഷരാർഥം സന്ദർഭോചിതമല്ല.
- source_word: גָּנְבוּ
  choice: മോഷ്ടിച്ചെടുത്തിരുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘മോഷ്ടിക്കുക’ നിലനിർത്തുകയും ദാവീദിന്റെ പ്രവൃത്തിക്കുമുമ്പ് നടന്ന സംഭവമാണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מֵרְחֹב
  choice: പൊതുചത്വരത്തിൽനിന്ന്
  rationale: רְחֹב നഗരത്തിലെ തുറസ്സായ പൊതുസ്ഥലത്തെയോ ചത്വരത്തെയോ സൂചിപ്പിക്കുന്നു; ‘പൊതുചത്വരം’ ആ സാമൂഹിക പശ്ചാത്തലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תלוּם שָׁם
  choice: അവരെ തൂക്കിയിട്ടിരുന്ന
  rationale: תלה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘തൂക്കുക’ എന്നാണ്. മരണാനന്തര പൊതുപ്രദർശനം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നുവെങ്കിലും ‘കഴുവേറ്റുക’ പോലുള്ള കൂടുതൽ നിർദിഷ്ടമായ അർഥം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: הַכּוֹת ... אֶת שָׁאוּל
  choice: ശൗലിനെ വീഴ്ത്തിയ
  rationale: נכה ഇവിടെ ശൗലിന്റെ മാരകമായ പരാജയത്തെ സൂചിപ്പിക്കുന്നു. ‘വീഴ്ത്തിയ’ എന്നത് ക്രിയയുടെ ശക്തി നിലനിർത്തുകയും ‘കൊന്നു’ എന്നു മാത്രം വ്യാഖ്യാനിച്ച് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בַּגִּלְבֹּעַ
  choice: ഗിൽബോവയിൽ
  rationale: എബ്രായത്തിൽ സ്ഥലനാമം മാത്രം നൽകിയിരിക്കുന്നു. ‘ഗിൽബോവ പർവതത്തിൽ’ എന്ന വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ സംയമിതമായി വിവർത്തനം ചെയ്തു.
- source_word: וַיֵּלֶךְ ... וַיִּקַּח
  choice: അപ്പോൾ ദാവീദ് പോയി ... എടുത്തു
  rationale: വാവ്-തുടർക്രിയകൾ കഥയുടെ പുരോഗതി സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനബന്ധം നൽകുന്നു.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: അവന്റെ മകനായ യോനാഥാൻ
  rationale: യോനാഥാൻ ശൗലിന്റെ മകനാണെന്ന എബ്രായ അന്വയം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
