translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ചരിത്രാഖ്യാനത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗത്തിന് യോജിച്ച രൂപത്തിൽ ലിപ്യന്തരിച്ചു. നീണ്ട എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും സംഭവക്രമവും ബന്ധങ്ങളും സംരക്ഷിച്ചു.
