  to: ഫെലിസ്ത്യരുമായി ഗോബിൽ വീണ്ടും യുദ്ധമുണ്ടായി.[a] അപ്പോൾ ബേത്‌ലഹേമ്യനായ യാരേ-ഒരെഗീമിന്റെ മകൻ എൽഹാനാൻ ഗിത്യനായ ഗൊല്യാത്തിനെ അടിച്ചുവീഴ്ത്തി.[b] അവന്റെ കുന്തത്തിന്റെ തണ്ട് നെയ്ത്തുതറിയുടെ പടിമരംപോലെയായിരുന്നു.
  rationale: മസോരറ്റിക് പാഠത്തിന്റെ ദുഷ്കരമായ ചരിത്രവായനയും അടിക്കുറിപ്പുകളിലെ പാഠവ്യത്യാസങ്ങളും മാറ്റിയിട്ടില്ല. ഉറവിടത്തിൽ ഇല്ലാത്ത മുറിക്കൽ-രീതി സൂചിപ്പിക്കുന്ന ‘വെട്ടിവീഴ്ത്തി’ എന്നതിനു പകരം, נכה യുടെ അർഥപരിധിയോട് അടുത്ത ‘അടിച്ചുവീഴ്ത്തി’ ഉപയോഗിച്ചു.
