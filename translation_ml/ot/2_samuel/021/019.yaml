  text: וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים וַ/יַּ֡ךְ אֶלְחָנָן֩ בֶּן יַעְרֵ֨י אֹרְגִ֜ים בֵּ֣ית הַלַּחְמִ֗י אֵ֚ת גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
translation:
  language: ml
  text: ഫെലിസ്ത്യരുമായി ഗോബിൽ വീണ്ടും യുദ്ധമുണ്ടായി.[a] അപ്പോൾ ബേത്‌ലഹേമ്യനായ യാരേ-ഒരെഗീമിന്റെ മകൻ എൽഹാനാൻ ഗിത്യനായ ഗൊല്യാത്തിനെ അടിച്ചുവീഴ്ത്തി.[b] അവന്റെ കുന്തത്തിന്റെ തണ്ട് നെയ്ത്തുതറിയുടെ പടിമരംപോലെയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '1 ദിനവൃത്താന്തം 20:5-ൽ വ്യത്യസ്തമായ വായനയുണ്ട്: എൽഹാനാൻ ഗൊല്യാത്തിന്റെ സഹോദരനായ ലഹ്മിയെ കൊന്നുവെന്നാണ് അവിടെ പറയുന്നത്. ശമൂവേലിലെ ഈ ഭാഗം ദുഷ്കരമോ പകർപ്പിൽ തകരാറിലായതോ ആയ ഒരു വായന സംരക്ഷിക്കുന്നതായി പലരും കരുതുകയും അതനുസരിച്ച് ദിനവൃത്താന്തപാഠവുമായി സമന്വയിപ്പിക്കുകയും ചെയ്യുന്നു.'
    reason: textual_variant
  - marker: b
    text: ‘യാരേ-ഒരെഗീം’ എന്ന എബ്രായ പിതൃനാമം ദുഷ്കരമാണ്. വാക്യത്തിന്റെ അവസാനത്തിലുള്ള ‘ഒരെഗീം’—‘നെയ്ത്തുകാർ’—എന്ന പദം അബദ്ധത്തിൽ ഇവിടെ വീണ്ടും പകർത്തപ്പെട്ടതാകാമെന്ന് ചിലർ കരുതുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: בְּגוֹב
  choice: ഗോബിൽ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന בְ യുദ്ധം നടന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഗോബിൽ’ സ്വാഭാവികമാണ്.
- source_word: וַיַּךְ
  choice: വെട്ടിവീഴ്ത്തി
  rationale: യുദ്ധസന്ദർഭത്തിലെ נכה എന്ന ക്രിയയുടെ പ്രഹരിക്കുകയും വീഴ്ത്തുകയും ചെയ്യുന്ന ശക്തി നിലനിർത്തുന്നു; ‘കൊന്നു’ എന്നു മാത്രം പറഞ്ഞ് ക്രിയയുടെ ദൃശ്യഭാവം ചുരുക്കുന്നില്ല.
- source_word: יַעְרֵי אֹרְגִים
  choice: യാരേ-ഒരെഗീം
  rationale: മസോരറ്റിക് പാഠത്തിലെ ദുഷ്കരമായ സംയുക്തരൂപം തിരുത്താതെ ലിപ്യന്തരണം ചെയ്യുന്നു; പാഠപ്രശ്നം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: בֵּית הַלַּחְמִי
  choice: ബേത്‌ലഹേമ്യനായ
  rationale: ബേത്‌ലഹേമിൽ നിന്നുള്ളവൻ എന്ന ജന്മദേശസൂചക രൂപം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵת גָּלְיָת הַגִּתִּי
  choice: ഗിത്യനായ ഗൊല്യാത്തിനെ
  rationale: ലഭ്യമായ എബ്രായപാഠത്തിൽ നേരിട്ടുള്ള കർമമായി ഗൊല്യാത്ത് തന്നെയാണ് നൽകിയിരിക്കുന്നത്; ദിനവൃത്താന്തത്തിലെ സമാന്തരപാഠവുമായി നിശ്ശബ്ദമായി സമന്വയിപ്പിക്കുന്നില്ല.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: അവന്റെ കുന്തത്തിന്റെ തണ്ട്
  rationale: עֵץ അക്ഷരാർഥത്തിൽ ‘മരം’ ആണെങ്കിലും കുന്തത്തിന്റെ മരഭാഗത്തെ മലയാളത്തിൽ കൃത്യവും സ്വാഭാവികവുമായി ‘തണ്ട്’ എന്നു പറയുന്നു.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: നെയ്ത്തുതറിയുടെ പടിമരംപോലെ
  rationale: מְנוֹר എന്നത് നെയ്ത്തുതറിയിലെ കനത്ത പടിമരത്തെ സൂചിപ്പിക്കുന്നു; കുന്തത്തണ്ടിന്റെ വണ്ണം വ്യക്തമാക്കുന്ന ഉപമയായി ഈ രൂപം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ദാവീദ് ഗൊല്യാത്തിനെ കൊന്നുവെന്ന 1 ശമൂവേൽ 17-ലെ വിവരണത്തോടും 1 ദിനവൃത്താന്തം 20:5-ലെ സമാന്തരപാഠത്തോടുമുള്ള പ്രത്യക്ഷ സംഘർഷം
  choice: പ്രധാനപാഠത്തിൽ മസോരറ്റിക് വായനയായ ‘എൽഹാനാൻ ... ഗൊല്യാത്തിനെ വെട്ടിവീഴ്ത്തി’ നിലനിർത്തി.
  alternative: ‘എൽഹാനാൻ ... ഗൊല്യാത്തിന്റെ സഹോദരനായ ലഹ്മിയെ വെട്ടിവീഴ്ത്തി’ എന്ന് ദിനവൃത്താന്തപാഠത്തോട് സമന്വയിപ്പിക്കുക.
  rationale: നൽകിയിരിക്കുന്ന എബ്രായസ്രോതസ്സ് ഗിത്യനായ ഗൊല്യാത്തിനെ നേരിട്ടുള്ള കർമമായി വ്യക്തമാക്കുന്നു. യഥാർഥ പാഠസംഘർഷം പരിഹരിച്ചതായി നടിക്കാതെ പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും സമാന്തരവായന അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പേരുകൾ എബ്രായരൂപത്തോട് ചേർന്ന് മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു. മസോരറ്റിക് പാഠത്തിലെ ദുഷ്കരതകൾ പ്രധാനവാക്യത്തിൽ നിശ്ശബ്ദമായി തിരുത്താതെ അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചിരിക്കുന്നു.
