  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הָ/אִישׁ֙ אֲשֶׁ֣ר כִּלָּ֔/נוּ וַ/אֲשֶׁ֖ר דִּמָּה לָ֑/נוּ נִשְׁמַ֕דְנוּ מֵֽ/הִתְיַצֵּ֖ב בְּ/כָל גְּבֻ֥ל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
translation:
  language: ml
  text: 'അവർ രാജാവിനോടു പറഞ്ഞു: “ഞങ്ങളെ മുടിച്ചുകളയുകയും ഞങ്ങൾക്കെതിരെ തന്ത്രം മെനയുകയും ചെയ്ത[a] ആ മനുഷ്യൻ, ഞങ്ങളെ ഉന്മൂലനം ചെയ്യാനും ഇസ്രായേലിന്റെ സകല പ്രദേശത്തും ഞങ്ങൾക്ക് നിലകൊള്ളാൻ കഴിയാതാക്കാനും പദ്ധതിയിട്ടു—[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾക്കെതിരെ പദ്ധതി തയ്യാറാക്കിയ.” എബ്രായക്രിയയ്ക്ക് ആസൂത്രണം ചെയ്യുക, തന്ത്രം മെനയുക എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
  - marker: b
    text: പദശഃ, “ഇസ്രായേലിന്റെ സകല പ്രദേശത്തും നിലകൊള്ളുന്നതിൽനിന്ന് ഞങ്ങൾ നശിപ്പിക്കപ്പെടേണ്ടതിന്”; അതായത്, ഇസ്രായേലിൽ എവിടെയും തുടർന്നും നിലനിൽക്കാൻ കഴിയാതിരിക്കാൻ.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּנוּ
  choice: ഞങ്ങളെ മുടിച്ചുകളയുകയും
  rationale: כלה എന്ന ക്രിയയുടെ ‘അവസാനിപ്പിക്കുക, നശിപ്പിച്ചുതീർക്കുക’ എന്ന ശക്തമായ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ശേഷിച്ചിരുന്ന ഗിബെയോന്യർ സംസാരിക്കുന്നതിനാൽ പൂർണമായും ഇല്ലാതാക്കി എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: דִּמָּה לָנוּ
  choice: ഞങ്ങൾക്കെതിരെ ഗൂഢാലോചന നടത്തുകയും ചെയ്ത
  rationale: ഈ സന്ദർഭത്തിൽ דמה എന്നത് ആലോചിക്കുക/പദ്ധതിയിടുക എന്ന അർഥത്തിലാണ്; לָנוּ ശത്രുതാപരമായ ലക്ഷ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘ഞങ്ങൾക്കെതിരെ’ എന്നു നൽകി. ‘ഗൂഢാലോചന’ ദോഷകരമായ പദ്ധതിയുടെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: נִשְׁמַדְנוּ
  choice: ഞങ്ങളെ ഉന്മൂലനം ചെയ്യാൻ
  rationale: שׁמד എന്ന ക്രിയയുടെ നിഫാൽ രൂപം നാശം അല്ലെങ്കിൽ സമൂലനാശം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ വാക്യഘടനയിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ ക്രിയാത്മകമായി അവതരിപ്പിച്ചു.
- source_word: מֵהִתְיַצֵּב
  choice: ഞങ്ങൾക്ക് ഒരിടവും ഇല്ലാതാകേണ്ടതിന്
  rationale: പദശഃ ‘നിലകൊള്ളുന്നതിൽനിന്ന്/സ്വയം സ്ഥാപിക്കുന്നതിൽനിന്ന്’ എന്നാണ്. ഇവിടെ ഇസ്രായേലിൽ തുടർന്നും നിലനിൽക്കാനോ പാർക്കാനോ ഇടമില്ലാതാക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പ്രദേശത്തെങ്ങും
  rationale: גְּבוּל ഇവിടെ അതിർത്തിരേഖ മാത്രമല്ല, മുഴുവൻ ഭൂപ്രദേശത്തെയും സൂചിപ്പിക്കുന്നു; כָל എന്നതിന്റെ സമഗ്രത ‘പ്രദേശത്തെങ്ങും’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: നേരത്തെ പരാമർശിക്കപ്പെട്ട ശൗലിനെ ചൂണ്ടിക്കാണിക്കുന്ന നിർദിഷ്ട നാമപദം; നേരിട്ടുള്ള സംഭാഷണത്തിൽ ‘ആ മനുഷ്യൻ’ സ്വാഭാവികവും ഊന്നലുള്ളതുമാണ്.
