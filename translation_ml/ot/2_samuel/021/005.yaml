  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നേരിട്ടുള്ള സംഭാഷണശൈലി. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി. എബ്രായത്തിലെ ഉദ്ദേശ്യം/ഫലം സംബന്ധിച്ച ചെറിയ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും പരമാവധി സംരക്ഷിച്ചിട്ടുണ്ട്.
