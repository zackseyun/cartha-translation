  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ ആഖ്യാനമലയാളം. മൂലത്തിലെ കഠിനമായ ദൃശ്യവും ദീർഘകാല കാവലിന്റെ താളവും നിലനിർത്തിയിരിക്കുന്നു.
