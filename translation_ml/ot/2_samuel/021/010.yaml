  text: וַ/תִּקַּ֣ח רִצְפָּה֩ בַת אַיָּ֨ה אֶת הַ/שַּׂ֜ק וַ/תַּטֵּ֨/הוּ לָ֤/הּ אֶל הַ/צּוּר֙ מִ/תְּחִלַּ֣ת קָצִ֔יר עַ֛ד נִתַּךְ מַ֥יִם עֲלֵי/הֶ֖ם מִן הַ/שָּׁמָ֑יִם וְ/לֹֽא נָתְנָה֩ ע֨וֹף הַ/שָּׁמַ֜יִם לָ/נ֤וּחַ עֲלֵי/הֶם֙ יוֹמָ֔ם וְ/אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה לָֽיְלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
translation:
  language: ml
  text: അപ്പോൾ അയ്യാവിന്റെ മകൾ രിസ്പാ ചാക്കുതുണി എടുത്ത് പാറമേൽ തനിക്കായി വിരിച്ചു. കൊയ്ത്തിന്റെ ആരംഭം മുതൽ ആകാശത്തുനിന്ന് അവരുടെമേൽ വെള്ളം ചൊരിയപ്പെടുന്നതുവരെ, പകൽ ആകാശത്തിലെ പക്ഷികളെയോ രാത്രി കാട്ടുമൃഗങ്ങളെയോ അവരുടെമേൽ വന്നിരിക്കുവാൻ അവൾ അനുവദിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആകാശത്തുനിന്ന് അവരുടെമേൽ മഴ പെയ്യുന്നതുവരെ.” എബ്രായപാഠം അക്ഷരാർഥത്തിൽ, “ആകാശത്തുനിന്ന് അവരുടെമേൽ വെള്ളം ചൊരിയപ്പെടുന്നതുവരെ” എന്നു പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׂק
  choice: ചാക്കുതുണി
  rationale: ശോകാചരണവുമായി ബന്ധപ്പെട്ട പരുപരുത്ത വസ്ത്രമായ sackcloth എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  choice: പാറമേൽ തനിക്കായി വിരിച്ചു
  rationale: נטה എന്ന ക്രിയയുടെ തുണി വിരിക്കുക/നീട്ടുക എന്ന ആശയവും לָהּ എന്ന ഗുണഭോക്തൃ ദത്തിവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ אֶל സ്ഥാനം സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കുന്നു.
- source_word: הַצּוּר
  choice: പാറ
  rationale: മൂലത്തിലെ ലളിതമായ ‘rock’ എന്ന അർഥം നിലനിർത്തുന്നു; വധസ്ഥലമോ പാറക്കെട്ടോ എന്ന് കൂടുതൽ വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: מִתְּחִלַּת קָצִיר
  choice: കൊയ്ത്തിന്റെ ആരംഭംമുതൽ
  rationale: ഏതു വിളയുടെ കൊയ്ത്താണെന്ന് മൂലവാക്യം വ്യക്തമാക്കാത്തതിനാൽ വിളയുടെ പേര് ചേർക്കുന്നില്ല.
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  choice: ആകാശത്തുനിന്ന് അവരുടെമേൽ വെള്ളം ചൊരിയപ്പെടുന്നതുവരെ
  rationale: נתך എന്നതിലെ ‘ചൊരിയുക’ എന്ന ദൃശ്യഭാഷയും ‘വെള്ളം’ എന്ന വ്യാകരണവിഷയവും സംരക്ഷിക്കുന്നു; ഉദ്ദേശ്യം മഴയായിരിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: പക്ഷികളെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לָנוּחַ עֲלֵיהֶם
  choice: അവരുടെമേൽ വന്നിരിക്കാൻ
  rationale: ശവങ്ങളുടെമേൽ പക്ഷികൾ ഇറങ്ങിയിരിക്കുക/മൃഗങ്ങൾ എത്തിനിൽക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു; വെറും ‘വിശ്രമിക്കുക’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: חַיַּת הַשָּׂדֶה
  choice: കാട്ടുമൃഗങ്ങൾ
  rationale: വയലിലെയോ തുറസ്സായ പ്രദേശത്തിലെയോ വന്യമൃഗങ്ങളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘കാട്ടുമൃഗങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: יוֹמָם ... לָיְלָה
  choice: പകൽ ... രാത്രി
  rationale: കാലവൈരുധ്യവും വാക്യത്തിന്റെ താളവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְלֹא נָתְנָה
  choice: അവൾ അനുവദിച്ചില്ല
  rationale: נתן + infinitive എന്ന ഘടനയുടെ ‘അനുവദിക്കുക’ എന്ന പ്രയോഗാർഥം മാന്യമായ ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
