  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ הַ/גִּבְעֹנִ֗ים אֵֽין ל/י כֶּ֤סֶף וְ/זָהָב֙ עִם שָׁא֣וּל וְ/עִם בֵּית֔/וֹ וְ/אֵֽין לָ֥/נוּ אִ֖ישׁ לְ/הָמִ֣ית בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֛אמֶר מָֽה אַתֶּ֥ם אֹמְרִ֖ים אֶעֱשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
translation:
  language: ml
  text: 'ഗിബെയോന്യർ അവനോടു പറഞ്ഞു: “ശൗലിനോടോ അവന്റെ കുടുംബത്തോടോ വെള്ളിയെയോ പൊന്നിനെയോ സംബന്ധിച്ച ഒരു അവകാശവാദവും ഞങ്ങൾക്കില്ല[a]; ഇസ്രായേലിൽ ഒരാളെയും കൊല്ലാൻ ഞങ്ങൾക്ക് അധികാരവുമില്ല[b].” അപ്പോൾ അവൻ ചോദിച്ചു: “ഞാൻ നിങ്ങൾക്കുവേണ്ടി എന്തു ചെയ്യണമെന്നാണ് നിങ്ങൾ പറയുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശൗലിനും അവന്റെ കുടുംബത്തിനും ഞങ്ങൾക്കും ഇടയിലെ പ്രശ്നം വെള്ളിയുടെയോ പൊന്നിന്റെയോ കാര്യമല്ല.” ഈ എബ്രായപ്രയോഗം ഒരു ശൈലിയാണ്; അത് ധനപരമായ നഷ്ടപരിഹാരത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇസ്രായേലിൽ ഒരാളെ കൊല്ലാൻ ഞങ്ങൾക്ക് അവകാശമില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  choice: ശൗലിനോടോ അവന്റെ കുടുംബത്തോടോ വെള്ളിയോ പൊന്നോ ആവശ്യപ്പെടാൻ ഞങ്ങൾക്ക് അവകാശവാദമില്ല
  rationale: ഈ എബ്രായപ്രയോഗം കൈവശമുള്ള സമ്പത്തിനെക്കുറിച്ചുള്ള അക്ഷരാർഥ പ്രസ്താവനയല്ല; ശൗലിന്റെ കുടുംബത്തിൽനിന്ന് ധനപരമായ നഷ്ടപരിഹാരം ആവശ്യപ്പെടുന്നില്ലെന്ന നിയമപരവും സാഹചര്യോചിതവുമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഏകവചനമായ לִי സംഘത്തെ പ്രതിനിധീകരിക്കുന്ന പ്രയോഗമായി ഗ്രഹിച്ച് മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: עִם
  choice: -നോടോ
  rationale: അടിസ്ഥാനാർഥം ‘കൂടെ’ എന്നാണെങ്കിലും, ഇവിടെ തർക്കത്തിലോ അവകാശവാദത്തിലോ ഉൾപ്പെട്ട കക്ഷിയെ സൂചിപ്പിക്കുന്നു. ‘ശൗലിനോടോ ... കുടുംബത്തോടോ’ എന്ന പ്രയോഗം ആ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ ആരെയെങ്കിലും കൊല്ലുന്നതും ഞങ്ങളുടെ അധികാരത്തിൽപ്പെട്ട കാര്യമല്ല
  rationale: ഈ അപൂർണപ്രയോഗം കൊല്ലാൻ ഒരാളെ കണ്ടെത്താനില്ല എന്നതിലുപരി, ഒരാളെ വധിക്കാനുള്ള അധികാരമോ അവകാശമോ തങ്ങൾക്കില്ലെന്ന അർഥമാണ് സാഹചര്യത്തിൽ നൽകുന്നത്.
- source_word: אִישׁ
  choice: ആരെയെങ്കിലും
  rationale: ഇവിടെ אִישׁ ഒരു വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘ആരെയെങ്കിലും’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും അർഥകൃത്യവുമാണ്.
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  choice: ഞാൻ നിങ്ങൾക്കുവേണ്ടി എന്തു ചെയ്യണമെന്നാണ് നിങ്ങൾ പറയുന്നത്?
  rationale: ചുരുക്കിയ എബ്രായവാക്യത്തിന്റെ ആശയം, തങ്ങൾക്കുവേണ്ടി താൻ ചെയ്യേണ്ടത് അവർ നിർദേശിക്കണമെന്ന ദാവീദിന്റെ ചോദ്യം, സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. നിയമപരമായ സൂചന വ്യക്തമാക്കുമ്പോഴും എബ്രായത്തിലെ ശൈലീഭാവവും പകരംവായനകളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
