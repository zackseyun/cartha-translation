id: 2SA.21.13
reference: 2 Samuel 21:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַל מִ/שָּׁם֙ אֶת עַצְמ֣וֹת שָׁא֔וּל וְ/אֶת עַצְמ֖וֹת יְהוֹנָתָ֣ן בְּנ֑/וֹ וַ/יַּ֣אַסְפ֔וּ אֶת עַצְמ֖וֹת הַ/מּוּקָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/013.yaml
  text: He brought up from there the bones of Saul and the bones of Jonathan his son[a], and they gathered the bones of those who had been impaled.
translation:
  language: ml
  text: അവൻ അവിടെനിന്ന് ശൗലിന്റെ അസ്ഥികളും ശൗലിന്റെ മകനായ യോനാഥാന്റെ അസ്ഥികളും എടുത്തുകൊണ്ടുവന്നു; സ്തംഭത്തിൽ തറയ്ക്കപ്പെട്ടവരുടെ[a] അസ്ഥികൾ അവർ ശേഖരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തൂക്കിയിടപ്പെട്ടവരുടെ” അഥവാ “പരസ്യമായി പ്രദർശിപ്പിക്കപ്പെട്ടവരുടെ.” എബ്രായപദം വധിക്കപ്പെട്ട് അവരുടെ ശരീരങ്ങൾ പൊതുദർശനത്തിന് വെക്കപ്പെട്ട പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: എടുത്തുകൊണ്ടുവന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു കൊണ്ടുവരുക’ എന്ന അടിസ്ഥാനഭാവവും, ഈ സന്ദർഭത്തിലെ അസ്ഥികൾ വീണ്ടെടുത്തു കൊണ്ടുവരുന്ന പ്രവൃത്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: עַצְמוֹת
  choice: അസ്ഥികൾ
  rationale: ‘ഭൗതികാവശിഷ്ടങ്ങൾ’ എന്ന പൊതുവായ പദത്തിനു പകരം മൂലപാഠത്തിലെ ‘എല്ലുകൾ/അസ്ഥികൾ’ എന്ന കൃത്യമായ അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: അവന്റെ മകനായ യോനാഥാൻ
  rationale: യോനാഥാൻ ശൗലിന്റെ മകനാണെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וַיַּאַסְפוּ
  choice: അവർ ശേഖരിച്ചു
  rationale: എബ്രായ ക്രിയ ബഹുവചനമായതിനാൽ അതിനെ ഏകവചനമാക്കി സമന്വയിപ്പിക്കാതെ ‘അവർ’ എന്നു നിലനിർത്തുന്നു.
- source_word: הַמּוּקָעִים
  choice: സ്തംഭത്തിൽ തറച്ചവർ
  rationale: יקע എന്ന പദം വധിക്കപ്പെട്ടവരെ സ്തംഭത്തിലോ മരത്തിലോ പരസ്യമായി പ്രദർശിപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘സ്തംഭത്തിൽ തറച്ചവർ’ പ്രധാന സാധ്യതയെ നൽകുന്നു; പ്രവർത്തിയുടെ കൃത്യരീതി സംബന്ധിച്ച അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ആദ്യ ക്രിയയിലെ ഏകവചനവും രണ്ടാമത്തെ ക്രിയയിലെ ബഹുവചനവും മൂലപാഠമനുസരിച്ച് സംരക്ഷിച്ചു; നിർവഹണരീതിയിലെ പദാർഥപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
