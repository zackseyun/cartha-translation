revisions:
- from: അവൻ അവിടെനിന്ന് ശൗലിന്റെ അസ്ഥികളും അവന്റെ മകനായ യോനാഥാന്റെ അസ്ഥികളും എടുത്തുകൊണ്ടുവന്നു; സ്തംഭത്തിൽ തറച്ചവരുടെ[a] അസ്ഥികൾ അവർ ശേഖരിച്ചു.
  to: അവൻ അവിടെനിന്ന് ശൗലിന്റെ അസ്ഥികളും ശൗലിന്റെ മകനായ യോനാഥാന്റെ അസ്ഥികളും എടുത്തുകൊണ്ടുവന്നു; സ്തംഭത്തിൽ തറയ്ക്കപ്പെട്ടവരുടെ[a] അസ്ഥികൾ അവർ ശേഖരിച്ചു.
  rationale: The revision corrects the Malayalam voice of the final participial expression so that it refers to those subjected to impalement/exposure, not to those performing the act. It also makes Jonathan’s filial relation to Saul explicit and adjusts the footnote alternatives to passive Malayalam. No theological or interpretive expansion has been introduced.
