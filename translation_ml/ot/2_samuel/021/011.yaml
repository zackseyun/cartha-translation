id: 2SA.21.11
reference: 2 Samuel 21:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֻּגַּ֖ד לְ/דָוִ֑ד אֵ֧ת אֲשֶׁר עָשְׂתָ֛ה רִצְפָּ֥ה בַת אַיָּ֖ה פִּלֶ֥גֶשׁ שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/011.yaml
  text: And it was reported to David what Rizpah daughter of Aiah, Saul’s concubine, had done.
translation:
  language: ml
  text: അയ്യാവിന്റെ മകളും ശൗലിന്റെ ഉപപത്നിയുമായ രിസ്പാ ചെയ്ത കാര്യം ദാവീദിനെ അറിയിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: അറിയിച്ചു
  rationale: נגד എന്ന ക്രിയയുടെ ഹുഫ്അൽ രൂപം വിവരമറിയിക്കപ്പെട്ടുവെന്ന അർഥം നൽകുന്നു. മലയാളത്തിലെ കർമണിപ്രയോഗത്തേക്കാൾ സ്വാഭാവികമായ അനിശ്ചിതകർത്തൃപ്രയോഗം ഉപയോഗിച്ചെങ്കിലും റിപ്പോർട്ട് ദാവീദിലേക്കെത്തിയെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: לְדָוִד
  choice: ദാവീദിനെ
  rationale: ‘അറിയിക്കുക’ എന്ന മലയാളക്രിയയോടൊപ്പം വിവരം ലഭിക്കുന്ന വ്യക്തിയെ ‘-നെ’ വിഭക്തിയിൽ സൂചിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: אֵת אֲשֶׁר
  choice: ചെയ്ത കാര്യം
  rationale: കർമചിഹ്നവും ബന്ധസർവനാമവും ചേർന്ന് റിപ്പോർട്ടിന്റെ ഉള്ളടക്കത്തെ അവതരിപ്പിക്കുന്നു; ‘കാര്യം’ ചേർക്കുന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עָשְׂתָה
  choice: ചെയ്ത
  rationale: റിപ്പോർട്ട് ലഭിക്കുന്നതിന് മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധകൃതന്തം ഉപയോഗിച്ചു.
- source_word: רִצְפָּה
  choice: രിസ്പാ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: בַת אַיָּה
  choice: അയ്യാവിന്റെ മകൾ
  rationale: ഹീബ്രു പിതൃനാമപരമായ തിരിച്ചറിയൽ നേരിട്ട് മലയാളത്തിൽ നൽകി.
- source_word: פִּלֶגֶשׁ שָׁאוּל
  choice: ശൗലിന്റെ ഉപപത്നി
  rationale: ബന്ധവും സാമൂഹികപദവിയും മയപ്പെടുത്താതെ വ്യക്തമാക്കുന്നു; ‘ഉപപത്നി’ ആധുനിക മാനക മലയാളത്തിൽ dignified ആയ സമാനപദമാണ്.
