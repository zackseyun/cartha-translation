  register: ആധുനികവും മാന്യവുമായ മാനക മലയാളം. ഹീബ്രുവിലെ appositional തിരിച്ചറിയലുകൾ ‘മകളും ... ഉപപത്നിയുമായ’ എന്ന സ്വാഭാവിക ഘടനയിൽ ചേർത്തു. പ്രത്യേക വ്യാഖ്യാനമോ സഭാപാരമ്പര്യപരമായ ഭാഷയോ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
