source:
  edition: WLC
  text: וַ/יַּֽעֲזָר ל/וֹ֙ אֲבִישַׁ֣י בֶּן צְרוּיָ֔ה וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י וַ/יְמִיתֵ֑/הוּ אָ֣ז נִשְׁבְּעוּ֩ אַנְשֵׁי דָוִ֨ד ל֜/וֹ לֵ/אמֹ֗ר לֹא תֵצֵ֨א ע֤וֹד אִתָּ֨/נוּ֙ לַ/מִּלְחָמָ֔ה וְ/לֹ֥א תְכַבֶּ֖ה אֶת נֵ֥ר יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
translation:
  language: ml
  text: 'എന്നാൽ സെരൂയയുടെ മകൻ അബീശായി ദാവീദിന്റെ സഹായത്തിനെത്തി; അവൻ ആ ഫെലിസ്ത്യനെ അടിച്ചു കൊന്നു. അപ്പോൾ ദാവീദിന്റെ ആളുകൾ അദ്ദേഹത്തോട് ഇങ്ങനെ ശപഥം ചെയ്തു: “ഇനി അങ്ങ് ഞങ്ങളോടൊപ്പം യുദ്ധത്തിനു പോകരുത്, ഇസ്രായേലിന്റെ ദീപം അണച്ചുകളയാതിരിക്കാൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  choice: ദാവീദിന്റെ സഹായത്തിനെത്തി
  rationale: עזר എന്നത് സഹായിക്കുക എന്നാണ്. യുദ്ധത്തിനിടയിലെ ഇടപെടൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘സഹായത്തിനെത്തി’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിൽ സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ ‘ദാവീദിന്റെ’ എന്നു ചേർത്തു.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: സെരൂയയുടെ മകൻ അബീശായി
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയനുസരിച്ച് നൽകി; בן എന്ന ബന്ധപദം ‘മകൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: ആ ഫെലിസ്ത്യനെ വെട്ടി
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/വെട്ടുക’ എന്ന ആശയം നിലനിർത്തുന്നു. പിന്നാലെ മരണം പ്രത്യേകം പറയുന്നതിനാൽ ഇവിടെ ‘കൊന്നുകളഞ്ഞു’ എന്ന ഫലസൂചക വിവർത്തനം ഒഴിവാക്കി.
- source_word: וַיְמִיתֵהוּ
  choice: കൊന്നു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള מות ഇവിടെ മരണത്തിനു കാരണമാകുക, കൊല്ലുക എന്ന വ്യക്തമായ അർഥത്തിലാണ്.
- source_word: אָז נִשְׁבְּעוּ אַנְשֵׁי דָוִד לוֹ
  choice: അപ്പോൾ ദാവീദിന്റെ ആളുകൾ അദ്ദേഹത്തോട് ഇങ്ങനെ ശപഥം ചെയ്തു
  rationale: נשבע എന്നത് ശപഥം ചെയ്യുക എന്നാണ്. രാജാവായ ദാവീദിനോടുള്ള അഭിസംബോധനയ്ക്ക് സ്വാഭാവികമായ ആദരരൂപം ഉപയോഗിച്ചു.
- source_word: לֹא תֵצֵא עוֹד אִתָּנוּ לַמִּלְחָמָה
  choice: ഇനി അങ്ങ് ഞങ്ങളോടൊപ്പം യുദ്ധത്തിനു വരരുത്
  rationale: ശപഥത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള ശക്തമായ നിരോധനം ‘വരരുത്’ എന്ന രൂപത്തിൽ നൽകി. യുദ്ധത്തിനു പുറപ്പെടുക എന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘യുദ്ധത്തിനു വരുക’ എന്നു പറഞ്ഞു.
- source_word: וְלֹא תְכַבֶּה
  choice: അണച്ചുകളയരുതല്ലോ
  rationale: വ്യാകരണപരമായി ‘ഒപ്പം അണയ്ക്കരുത്’ എന്ന ഏകോപനമാണെങ്കിലും, മുൻനിരോധനത്തിന്റെ ഒഴിവാക്കേണ്ട ഫലം/കാരണം ഇവിടെ സൂചിപ്പിക്കുന്നു. ‘-രുതല്ലോ’ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נֵר יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദീപം
  rationale: נֵר എന്ന മൂർത്തമായ ‘ദീപം’ എന്ന രൂപകം നിലനിർത്തി; ‘വെളിച്ചം’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചില്ല.
theological_decisions:
- issue: ദാവീദിനെ ഇസ്രായേലിന്റെ നിലനിൽപ്പിനും സ്ഥിരതയ്ക്കും ആധാരമായ ദീപമായി ചിത്രീകരിക്കുന്ന രൂപകം
  choice: ‘ഇസ്രായേലിന്റെ ദീപം’ എന്ന മൂലരൂപകം പ്രധാനപാഠത്തിൽ നിലനിർത്തുക
  alternative: ‘ഇസ്രായേലിന്റെ വെളിച്ചം’ അല്ലെങ്കിൽ ‘ഇസ്രായേലിന്റെ പ്രത്യാശ’
  rationale: ഹീബ്രു പാഠം അമൂർത്തമായ വിശദീകരണമല്ല, ദീപം എന്ന മൂർത്തരൂപകമാണ് ഉപയോഗിക്കുന്നത്. അതിനെ നിലനിർത്തുന്നത് രാജകീയവും സാഹിത്യപരവുമായ ധ്വനി സംരക്ഷിക്കുകയും അതിവ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ദാവീദിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ എന്ന ആദരരൂപവും വിവരണത്തിൽ ‘അദ്ദേഹം’ എന്ന രൂപവും ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ യുദ്ധവിവരണത്തിന്റെ സംക്ഷിപ്തതയും ‘ദീപം’ എന്ന രൂപകവും സംരക്ഷിച്ചു.
