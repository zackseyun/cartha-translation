revisions:
- from: 'എന്നാൽ സെരൂയയുടെ മകൻ അബീശായി ദാവീദിന്റെ സഹായത്തിനെത്തി; അവൻ ആ ഫെലിസ്ത്യനെ വെട്ടി കൊന്നു. അപ്പോൾ ദാവീദിന്റെ ആളുകൾ അദ്ദേഹത്തോട് ഇങ്ങനെ ശപഥം ചെയ്തു: “ഇനി അങ്ങ് ഞങ്ങളോടൊപ്പം യുദ്ധത്തിനു വരരുത്; ഇസ്രായേലിന്റെ ദീപം[a] അണച്ചുകളയരുതല്ലോ.”'
  to: 'എന്നാൽ സെരൂയയുടെ മകൻ അബീശായി ദാവീദിന്റെ സഹായത്തിനെത്തി; അവൻ ആ ഫെലിസ്ത്യനെ അടിച്ചു കൊന്നു. അപ്പോൾ ദാവീദിന്റെ ആളുകൾ അദ്ദേഹത്തോട് ഇങ്ങനെ ശപഥം ചെയ്തു: “ഇനി അങ്ങ് ഞങ്ങളോടൊപ്പം യുദ്ധത്തിനു പോകരുത്, ഇസ്രായേലിന്റെ ദീപം അണച്ചുകളയാതിരിക്കാൻ.”'
  rationale: The revision replaces the weapon-specific «വെട്ടി» with source-general «അടിച്ചു» and makes the final clause explicitly dependent on the preceding prohibition, corresponding to the Hebrew “lest” sense. The royal metaphor and the existing footnote are retained.
