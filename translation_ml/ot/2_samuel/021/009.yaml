revisions:
- from: അവൻ അവരെ ഗിബെയോന്യരുടെ കയ്യിൽ ഏല്പിച്ചു. അവർ അവരെ യഹോവയുടെ സന്നിധിയിൽ മലമുകളിൽ തൂക്കിക്കൊന്നു[a]; ആ ഏഴുപേരും ഒരുമിച്ചു വീണു. കൊയ്ത്തുകാലത്തിന്റെ ആദ്യദിവസങ്ങളിൽ, യവക്കൊയ്ത്തിന്റെ ആരംഭത്തിൽത്തന്നെ, അവർ വധിക്കപ്പെട്ടു.
  to: അവൻ അവരെ ഗിബെയോന്യരുടെ കയ്യിൽ ഏല്പിച്ചു. അവർ അവരെ യഹോവയുടെ സന്നിധിയിൽ മലയിൽ തൂക്കിയിട്ടു[a]; ആ ഏഴുപേരും ഒരുമിച്ചു വീണു. കൊയ്ത്തുകാലത്തിന്റെ ആദ്യദിവസങ്ങളിൽ, യവക്കൊയ്ത്തിന്റെ തുടക്കത്തിൽ, അവർ വധിക്കപ്പെട്ടു.
  rationale: The revision preserves the juridical transfer to the Gibeonites, the setting before Yahweh, the collective fall of all seven, and the harvest-time notice. It replaces the overly specific ‘തൂക്കിക്കൊന്നു’ with ‘തൂക്കിയിട്ടു’ so that the main text does not settle the disputed mechanics of יקע; the anchored footnote explicitly preserves the relevant alternatives. The temporal wording is also made exact by removing unwarranted emphasis.
