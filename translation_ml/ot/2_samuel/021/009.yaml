base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
translation:
  language: ml
  text: അവൻ അവരെ ഗിബെയോന്യരുടെ കയ്യിൽ ഏല്പിച്ചു. അവർ അവരെ യഹോവയുടെ സന്നിധിയിൽ മലയിൽ തൂക്കിയിട്ടു[a]; ആ ഏഴുപേരും ഒരുമിച്ചു വീണു. കൊയ്ത്തുകാലത്തിന്റെ ആദ്യദിവസങ്ങളിൽ, യവക്കൊയ്ത്തിന്റെ തുടക്കത്തിൽ, അവർ വധിക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കഴുവിലേറ്റി’ അല്ലെങ്കിൽ ‘പരസ്യമായി പ്രദർശിപ്പിച്ചു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് ശരീരം പൊതുദർശനത്തിനായി തൂക്കിയിടുക എന്ന വിശാലമായ അർഥവും വരാം; പിൽക്കാലത്തെ സങ്കുചിത അർഥത്തിലുള്ള തൂക്കിക്കൊലയെ മാത്രം അതു നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד הַגִּבְעֹנִים
  choice: അവൻ അവരെ ഗിബെയോന്യരുടെ കയ്യിൽ ഏല്പിച്ചു
  rationale: נתן + בְּיַד എന്ന പ്രയോഗം നിഷ്പക്ഷമായി ‘കൊടുക്കുക’ എന്നതിലുപരി മറ്റൊരാളുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കയ്യിൽ ഏല്പിച്ചു’ എന്നത് ഹീബ്രു ദൃശ്യഭാഷയും നിയമപരമായ കൈമാറ്റത്തിന്റെ ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֹּקִיעֻם
  choice: അവർ അവരെ തൂക്കിക്കൊന്നു
  rationale: יקע ഇവിടെ പൊതുസ്ഥലത്തെ വധവും ശരീരം തൂക്കിയുള്ള പ്രദർശനവും സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ മരണദണ്ഡം വ്യക്തമായതിനാൽ ‘തൂക്കിക്കൊന്നു’ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാണ്; കൃത്യമായ രീതി അനിശ്ചിതമായതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
- source_word: בָּהָר
  choice: മലമുകളിൽ
  rationale: നിർദിഷ്ട ഏകവചനമായ הַר-നെ വധം നടന്ന ഉയർന്ന സ്ഥലം എന്ന നിലയിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: കർത്താവിന്റെ മുമ്പിൽ നടന്നതായി കരുതപ്പെട്ട ഉടമ്പടിപരവും ന്യായവിധിസംബന്ധവുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיִּפְּלוּ שבעתים יָחַד
  choice: ആ ഏഴുപേരും ഒരുമിച്ചു വീണു
  rationale: മരണത്തിൽ ഒരുമിച്ചു വീണ ഏഴുപേരെക്കുറിച്ചുള്ള കൂട്ടായ ഫലം വ്യക്തമാക്കുകയും ‘വീണു’ എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הֻמְתוּ
  choice: അവർ വധിക്കപ്പെട്ടു
  rationale: מות എന്ന ധാതുവിന്റെ കാരക കർമണിരൂപം ‘മരിക്കാനിടയായി’ എന്നതിനെക്കാൾ ഉദ്ദേശ്യപൂർവമായ മരണദണ്ഡത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വധിക്കപ്പെട്ടു’ കൃത്യവും സംക്ഷിപ്തവുമാണ്.
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים תחלת קְצִיר שְׂעֹרִים
  choice: കൊയ്ത്തുകാലത്തിന്റെ ആദ്യദിവസങ്ങളിൽ, യവക്കൊയ്ത്തിന്റെ ആരംഭത്തിൽത്തന്നെ
  rationale: രണ്ടാമത്തെ സമയപ്രയോഗം ആദ്യത്തേതിനെ കൂടുതൽ കൃത്യമായി വിശദീകരിക്കുന്നു. ‘യവക്കൊയ്ത്ത്’ שְׂעֹרִים-ന്റെ സാധാരണ മലയാള സമാനപദമാണ്.
theological_decisions:
- issue: יקע സൂചിപ്പിക്കുന്ന വധരീതി
  choice: മുഖ്യപാഠത്തിൽ ‘തൂക്കിക്കൊന്നു’ എന്ന് നൽകി, കൃത്യമായ ശാരീരിക രീതി അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
  alternative: ‘കഴുവിലേറ്റി’ അല്ലെങ്കിൽ ‘പരസ്യമായി തൂക്കിക്കാട്ടി’
  rationale: ഈ ക്രിയ തൂക്കൽ, കഴുവിലേറ്റൽ, അല്ലെങ്കിൽ വധിക്കപ്പെട്ട ശരീരം പൊതുവായി പ്രദർശിപ്പിക്കൽ എന്നിവയിൽ ഏതിനെ സൂചിപ്പിക്കുന്നു എന്ന് ഹീബ്രു മാത്രം നിർണായകമായി വ്യക്തമാക്കുന്നില്ല. ഉടമ്പടിപരമായ ന്യായവിധിയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനിശ്ചിതത്വം മറച്ചുവെക്കാതിരിക്കുകയാണ് ഉചിതം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘കയ്യിൽ ഏല്പിച്ചു,’ ‘സന്നിധിയിൽ,’ ‘വധിക്കപ്പെട്ടു’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ നിയമപരവും ആരാധനാപരവുമായ ഭാവം നിലനിർത്തുന്നു. ദൈവനാമം പദ്ധതിയുടെ രീതിപ്രകാരം ‘യഹോവ’ എന്നു നൽകി.
