  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
translation:
  language: ml
  text: റാഫായുടെ സന്തതികളിൽപ്പെട്ടവനായ ഇശ്ബി-ബെനോബ്[a] ഉണ്ടായിരുന്നു[b]. അവന്റെ കുന്തം മുന്നൂറ് ശേക്കേൽ വെങ്കലഭാരമുള്ളതായിരുന്നു. അവൻ ഒരു പുതിയ വാൾ അരയിൽ കെട്ടിയിരുന്നു[c]. ദാവീദിനെ അടിച്ചുവീഴ്ത്തുമെന്ന് അവൻ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പേരിന്റെ രൂപം അനിശ്ചിതമാണ്. ഇവിടെ പരമ്പരാഗത വായന പിന്തുടരുന്നു; ‘യെശ്ബി-ബെനോബ്’ എന്ന ലിപ്യന്തരണവും വ്യഞ്ജനങ്ങളെ വേറൊരു വിധത്തിൽ പദങ്ങളായി വിഭജിക്കുന്ന വായനകളും സാധ്യമാണ്.
    reason: textual_variant
  - marker: b
    text: അഥവാ, ‘റാഫായ്ക്കു ജനിച്ചവരിൽ ഒരുവൻ.’ ഈ പ്രയോഗം രെഫായീമുമായി ബന്ധപ്പെട്ട ഭീമന്മാരുടെ കുലത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപാഠത്തിൽ ‘പുതിയത്’ എന്നു മാത്രമേയുള്ളൂ; അതോടൊപ്പമുള്ള നാമം വിട്ടുപോയിരിക്കുന്നു. പരമ്പരാഗതമായി അത് ‘വാൾ’ എന്നു മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבו בְּנֹב
  choice: ഇശ്ബി-ബെനോബ്
  rationale: മസോററ്റിക് വ്യഞ്ജനപാഠവും പദവിഭജനവും ദുഷ്കരമാണെങ്കിലും, യുദ്ധവിവരണത്തിന്റെയും ചുറ്റുമുള്ള വീരന്മാരുടെ പേരുകളുടെയും പശ്ചാത്തലത്തിൽ പരമ്പരാഗത വ്യക്തിനാമവായനയാണ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചത്; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר בִּילִידֵי הָרָפָה
  choice: റാഫായുടെ സന്തതികളിൽ ഒരുവൻ
  rationale: יְלִידֵי ഇവിടെ ജനനം, വംശപരമ്പര, കുലബന്ധം എന്നിവ സൂചിപ്പിക്കുന്നു. റാഫാ എന്ന പേര് ലിപ്യന്തരണം ചെയ്ത് വംശബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കി.
- source_word: וּמִשְׁקַל קֵינוֹ
  choice: അവന്റെ കുന്തത്തിന്റെ ഭാരം
  rationale: קֵין എന്ന അപൂർവപദം ഈ യുദ്ധസന്ദർഭത്തിൽ പരമ്പരാഗതമായി കുന്തമോ കുന്തത്തണ്ടോ എന്നു മനസ്സിലാക്കപ്പെടുന്നു; സംശയം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  choice: മുന്നൂറു ശേക്കേൽ വെങ്കലം
  rationale: പുരാതന ഭാരമാനമായ ശേക്കേൽ പരിവർത്തനം ചെയ്യാതെ നിലനിർത്തി; נְחֹשֶׁת ആയുധസന്ദർഭത്തിൽ ‘വെങ്കലം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  choice: അവൻ ഒരു പുതിയ വാൾ അരയിൽ കെട്ടിയിരുന്നു
  rationale: חֲדָשָׁה ‘പുതിയത്’ എന്ന സ്ത്രീലിംഗ വിശേഷണം മാത്രമാണ്; നാമം പാഠത്തിൽ വിട്ടുപോയിരിക്കുന്നു. യുദ്ധസന്ദർഭവും ‘അരയിൽ കെട്ടുക’ എന്ന പ്രയോഗവും അനുസരിച്ച് പരമ്പരാഗതമായി അനുമാനിക്കുന്ന ‘വാൾ’ മുഖ്യപാഠത്തിൽ ചേർത്ത്, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  choice: അവൻ ദാവീദിനെ വെട്ടിവീഴ്ത്തുമെന്ന് പറഞ്ഞു
  rationale: അക്ഷരാർഥത്തിൽ ‘ദാവീദിനെ അടിക്കാൻ/വെട്ടാൻ പറഞ്ഞു’ എന്ന അസാധാരണ ഘടന ഇവിടെ ഉദ്ദേശ്യമോ ദൃഢനിശ്ചയമോ പ്രകടിപ്പിക്കുന്നു. ‘പറഞ്ഞു’ എന്ന ക്രിയാശക്തി നിലനിർത്തിക്കൊണ്ട് യുദ്ധസന്ദർഭത്തിന് യോജിച്ച ‘വെട്ടിവീഴ്ത്തുക’ തെരഞ്ഞെടുത്തു.
