  edition: WLC
  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֗ה סִבְּכַי֙ הַ/חֻ֣שָׁתִ֔י אֶת סַ֕ף אֲשֶׁ֖ר בִּ/ילִדֵ֥י הָ/רָפָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
translation:
  language: ml
  text: ഇതിനുശേഷം ഗോബിൽ ഫെലിസ്ത്യരുമായി വീണ്ടും യുദ്ധമുണ്ടായി. അപ്പോൾ ഹൂശാത്യനായ സിബ്ബെഖായി സാഫിനെ[a] അടിച്ചുവീഴ്ത്തി; അവൻ രാഫായുടെ സന്തതികളിൽ ഒരാളായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠത്തിൽ “സാഫ്”; 1 ദിനവൃത്താന്തം 20:4-ലെ സമാന്തരവിവരണത്തിൽ പേര് “സിപ്പായി” എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: “ഭീമന്റെ സന്തതികളിൽ ഒരാളായിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഹീബ്രു പദം രാഫാ എന്ന വ്യക്തിയെയോ ഭീമനുമായി/രെഫായീം വംശവുമായി ബന്ധപ്പെട്ട വംശസൂചനയെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: ഇതിനുശേഷം
  rationale: കഥയിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം; ഹീബ്രുവിലെ കാലസൂചനയെ അനാവശ്യമായി വികസിപ്പിക്കുന്നില്ല.
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  choice: വീണ്ടും യുദ്ധമുണ്ടായി
  rationale: עוֹד സൂചിപ്പിക്കുന്ന ആവർത്തനം നിലനിർത്തുകയും ഹീബ്രു വാക്യഘടനയെ സ്വാഭാവിക മലയാളത്തിലാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּגֹב
  choice: ഗോബിൽവെച്ച്
  rationale: യുദ്ധം നടന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ב എന്ന മുൻപ്രത്യയത്തിന് സന്ദർഭോചിതമായ മലയാളരൂപം.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതവും വ്യക്തവുമായ പേര്.
- source_word: אָז
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ കഥനബന്ധം.
- source_word: הִכָּה
  choice: അടിച്ചുവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ പ്രഹരിക്കുക/വീഴ്ത്തുക എന്ന യുദ്ധസന്ദർഭത്തിലെ ശക്തി നിലനിർത്തുന്നു; പ്രധാനപാഠത്തിൽ ‘കൊന്നു’ എന്ന് നിർബന്ധമായി വ്യക്തമാക്കാതെ മാരകമായ പരാജയത്തിന്റെ സാധ്യതയും സൂക്ഷിക്കുന്നു.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: ഹൂശാത്യനായ സിബ്ബെഖായി
  rationale: വ്യക്തിനാമവും ജന്മസ്ഥലമോ വംശബന്ധമോ സൂചിപ്പിക്കുന്ന വിശേഷണവും ശബ്ദാനുസൃതമായി മലയാളത്തിൽ നൽകുന്നു.
- source_word: סַף
  choice: സാഫ്
  rationale: മസോററ്റിക് പാഠത്തിലെ സַף എന്ന പേരിന്റെ നേരിട്ടുള്ള ലിപ്യന്തരണം; സമാന്തരവിവരണത്തിലെ വ്യത്യസ്ത നാമരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  choice: അവൻ രാഫായുടെ സന്തതികളിൽ ഒരാളായിരുന്നു
  rationale: יְלִידֵי എന്ന ബഹുവചനരൂപത്തിന്റെ വംശപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. הָרָפָהയെ പ്രധാനപാഠത്തിൽ വംശപൂർവികന്റെ പേരായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: הָרָפָה എന്നത് ‘രാഫാ’ എന്ന പേരാണോ ‘മല്ലൻ/ഭീമൻ’ എന്ന പൊതുവിശേഷണമാണോ
  choice: രാഫാ എന്ന വംശപൂർവികന്റെ പേര്
  alternative: മല്ലന്റെ സന്തതികളിൽ ഒരാൾ; അല്ലെങ്കിൽ രെഫായീം വംശത്തിൽപ്പെട്ട ഒരാൾ
  rationale: ‘സന്തതികളിൽ’ എന്ന വംശാവലിസദൃശ പ്രയോഗത്തിൽ ഒരു പേരോ വംശസൂചനയോ സ്വാഭാവികമാണ്. എന്നാൽ ഹീബ്രു രൂപം ‘മല്ലൻ’ എന്ന അർഥത്തിലും പരമ്പരാഗതമായി മനസ്സിലാക്കപ്പെട്ടതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; പ്രധാനപാഠം ഒരു വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി ഉപയോഗിച്ചു. സ്ഥല-വ്യക്തിനാമങ്ങൾ ഹീബ്രു ശബ്ദരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരപ്പെടുത്തി. മൂലപാഠത്തിലെ വംശസൂചനയുടെ ദ്വയാർഥത പ്രധാനപാഠവും അടിക്കുറിപ്പും ചേർന്ന് സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
