  source_fidelity: 'പ്രധാനപാഠം ഹീബ്രു വാക്യക്രമവും അർഥവും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു: തുടര്‍ന്നുള്ള സംഘർഷം, ഗോബ്, ഫെലിസ്ത്യർ, സിബ്ബെഖായി സാഫിനെ അടിച്ചുവീഴ്ത്തിയത്, രാഫായുമായി ബന്ധപ്പെട്ട വംശസൂചന എന്നിവയെല്ലാം നിലനിൽക്കുന്നു. എന്നാല്‍ അടിക്കുറിപ്പ് b-യിലെ “മല്ലൻ” എന്ന പദം הָרָפָהയുടെ പരമ്പരാഗത ‘giant’ വായനയ്ക്ക് യോജിച്ചതല്ല; അത് ‘wrestler’ എന്ന തെറ്റായ അർഥം ഉണർത്താം.'
  naturalness: ഭാഷ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്. “ഗോബിൽവെച്ച്” എന്നതിനു പകരം “ഗോബിൽ” ഉപയോഗിക്കുന്നത് അല്പം കൂടുതൽ മിനുസമുള്ളതാണ്, അർഥവ്യത്യാസമില്ലാതെ.
  terminology: ഫെലിസ്ത്യർ, സാഫ്, രാഫാ, രെഫായീം എന്നിവ യോജിച്ച രൂപങ്ങളാണ്. ഹീബ്രുവിലെ ദ്വയാർഥത സംരക്ഷിക്കാൻ അടിക്കുറിപ്പിൽ ‘ഭീമൻ’/‘ഭീമവംശം’ എന്നും രെഫായീം വംശം എന്നും പറയുന്നതാണ് ഉചിതം; ‘മല്ലൻ’ ഒഴിവാക്കണം.
