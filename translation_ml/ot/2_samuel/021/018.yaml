  to: ഇതിനുശേഷം ഗോബിൽ ഫെലിസ്ത്യരുമായി വീണ്ടും യുദ്ധമുണ്ടായി. അപ്പോൾ ഹൂശാത്യനായ സിബ്ബെഖായി സാഫിനെ[a] അടിച്ചുവീഴ്ത്തി; അവൻ രാഫായുടെ സന്തതികളിൽ ഒരാളായിരുന്നു.[b]
