source:
  edition: WLC
  text: וַ/יְהִ֣י רָעָב֩ בִּ/ימֵ֨י דָוִ֜ד שָׁלֹ֣שׁ שָׁנִ֗ים שָׁנָה֙ אַחֲרֵ֣י שָׁנָ֔ה וַ/יְבַקֵּ֥שׁ דָּוִ֖ד אֶת פְּנֵ֣י יְהוָ֑ה וַ/יֹּ֣אמֶר יְהוָ֗ה אֶל שָׁאוּל֙ וְ/אֶל בֵּ֣ית הַ/דָּמִ֔ים עַל אֲשֶׁר הֵמִ֖ית אֶת הַ/גִּבְעֹנִֽים־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: There was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
translation:
  language: ml
  text: 'ദാവീദിന്റെ കാലത്ത് മൂന്നു വർഷം, വർഷം കഴിഞ്ഞ് വർഷം, ക്ഷാമമുണ്ടായി. ദാവീദ് യാഹ്‌വെയുടെ മുഖം തേടി[a]. യാഹ്‌വെ പറഞ്ഞു: “ഇത് ശൗലും രക്തപാതകക്കുറ്റമുള്ള അവന്റെ കുടുംബവും നിമിത്തമാണ്[b]; അവൻ ഗിബെയോന്യരെ കൊന്നതുകൊണ്ടാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യാഹ്‌വെയെ തേടി’ അല്ലെങ്കിൽ ‘യാഹ്‌വെയോട് അരുളപ്പാട് ചോദിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം; അക്ഷരാർഥത്തിൽ, ‘യാഹ്‌വെയുടെ മുഖം തേടി.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘രക്തങ്ങളുടെ ഭവനം’; രക്തപാതകത്തിനുള്ള കുറ്റം വഹിക്കുന്ന കുടുംബം അഥവാ വംശം എന്നർഥമുള്ള ശൈലീപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: ക്ഷാമം
  rationale: സന്ദർഭത്തിൽ ദേശത്തെ ബാധിച്ച കടുത്ത ഭക്ഷ്യക്ഷാമമാണ് ഉദ്ദേശിക്കുന്നത്; പൊതുവായ ‘വിശപ്പ്’ എന്നതിനെക്കാൾ ‘ക്ഷാമം’ യോജിക്കുന്നു.
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  choice: തുടർച്ചയായി മൂന്നു വർഷം—വർഷംതോറും
  rationale: മൂന്നു വർഷം എന്ന എണ്ണവും ‘വർഷത്തിനു പിന്നാലെ വർഷം’ എന്ന തുടർച്ചയുടെ ഊന്നലും എബ്രായത്തിൽ ഉള്ളതിനാൽ രണ്ടും നിലനിർത്തുന്നു.
- source_word: וַיְבַקֵּשׁ ... אֶת־פְּנֵי יְהוָה
  choice: യാഹ്‌വെയുടെ മുഖം തേടി
  rationale: ‘യാഹ്‌വെയുടെ മുഖം തേടി’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യക്തിപരമായ ഭാവം സംരക്ഷിക്കുന്നു; അർഥം അന്വേഷിച്ചറിവാൻ ദൈവത്തെ സമീപിച്ചു എന്നതാണ്.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുർക്ഷരനാമത്തിന്റെ ഉച്ചാരണാധിഷ്ഠിത ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; ഒരു പദവിനാമം പകരംവയ്ക്കുന്നില്ല.
- source_word: אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים
  choice: ശൗലും രക്തപാതകക്കുറ്റം വഹിക്കുന്ന അവന്റെ കുടുംബവും കാരണമാണ് ഇത്
  rationale: മറുപടി ക്ഷാമത്തിന്റെ കാരണം വ്യക്തമാക്കുന്നതിനാൽ കാരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. ‘ഭവനം’ ഇവിടെ കുടുംബത്തെയോ വംശത്തെയോ സൂചിപ്പിക്കുന്നു; ‘രക്തങ്ങൾ’ എന്ന പ്രയോഗം രക്തപാതകത്തിനുള്ള കുറ്റബാധ്യതയാണ്.
- source_word: עַל אֲשֶׁר הֵמִית אֶת־הַגִּבְעֹנִים
  choice: അവൻ ഗിബെയോന്യരെ കൊന്നുകളഞ്ഞതുകൊണ്ടുതന്നെ
  rationale: ഏകവചന ക്രിയയുടെ കർത്താവ് ശൗലാണ്. ‘കൊന്നുകളഞ്ഞു’ മരണത്തിനിടയാക്കിയ പ്രവൃത്തി വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הַגִּבְעֹנִים
  choice: ഗിബെയോന്യർ
  rationale: ജനവിഭാഗത്തിന്റെ പേരിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പദവിനാമമാക്കി മാറ്റാതെ സംരക്ഷിക്കുകയും ‘Yahweh’ എന്ന രൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം നൽകുകയും ചെയ്യുന്നു.
- issue: ശൗലിന്റെ കുടുംബത്തെപ്പറ്റിയുള്ള കാരണവാക്യം
  choice: ക്ഷാമം ശൗലും രക്തപാതകക്കുറ്റം വഹിക്കുന്ന അവന്റെ കുടുംബവും നിമിത്തമുള്ള ദൈവിക ന്യായവിധിയായി അവതരിപ്പിക്കുന്നു.
  alternative: ‘ശൗലിനെക്കുറിച്ചും രക്തങ്ങളുടെ ഭവനത്തെക്കുറിച്ചും’ എന്ന അക്ഷരാർഥ രൂപം
  rationale: സന്ദർഭത്തിൽ യാഹ്‌വെയുടെ മറുപടി ക്ഷാമത്തിന്റെ കാരണം അറിയിക്കുന്നു. എന്നാൽ കുറ്റം ശൗലിൽ മാത്രം ഒതുക്കാതെ ‘കുടുംബം/ഭവനം’ എന്ന കൂട്ടായ പരാമർശവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ആവർത്തന ഊന്നൽ, ദൈവനാമം, ‘മുഖം തേടുക’ എന്ന രൂപകം, കുടുംബത്തിന്റെ രക്തപാതകക്കുറ്റം എന്നിവ സംരക്ഷിച്ചിരിക്കുന്നു. വായനാസൗകര്യത്തിനായി ദീർഘവിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു.
