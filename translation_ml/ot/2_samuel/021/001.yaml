revisions:
- from: 'ദാവീദിന്റെ കാലത്ത് തുടർച്ചയായി മൂന്നു വർഷം—വർഷംതോറും—ക്ഷാമമുണ്ടായി. ദാവീദ് യാഹ്‌വെയുടെ മുഖം തേടി[a]. യാഹ്‌വെ പറഞ്ഞു: “ശൗലും രക്തപാതകക്കുറ്റം വഹിക്കുന്ന അവന്റെ കുടുംബവും കാരണമാണ് ഇത്[b]; അവൻ ഗിബെയോന്യരെ കൊന്നുകളഞ്ഞതുകൊണ്ടുതന്നെ.”'
  to: 'ദാവീദിന്റെ കാലത്ത് മൂന്നു വർഷം, വർഷം കഴിഞ്ഞ് വർഷം, ക്ഷാമമുണ്ടായി. ദാവീദ് യാഹ്‌വെയുടെ മുഖം തേടി[a]. യാഹ്‌വെ പറഞ്ഞു: “ഇത് ശൗലും രക്തപാതകക്കുറ്റമുള്ള അവന്റെ കുടുംബവും നിമിത്തമാണ്[b]; അവൻ ഗിബെയോന്യരെ കൊന്നതുകൊണ്ടാണ്.”'
  rationale: The revision keeps all source-level content and the Hebrew idioms while improving modern Malayalam flow. It preserves the emphatic succession of years, identifies Saul’s household as corporately bloodguilty without over-specifying its composition, and removes an unwarranted emphatic nuance from the statement that Saul killed the Gibeonites.
