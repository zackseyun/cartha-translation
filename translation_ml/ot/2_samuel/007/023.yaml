id: 2SA.7.23
reference: 2 Samuel 7:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
translation:
  language: ml
  text: ഭൂമിയിലെ ഏകജനതയായ ഇസ്രായേൽ എന്ന അങ്ങയുടെ ജനത്തെപ്പോലെ ആരുണ്ട്? ദൈവം തനിക്കായി ഒരു ജനമായി വീണ്ടെടുക്കാനും തനിക്കായി ഒരു നാമം ഉണ്ടാക്കാനും നിങ്ങൾക്കുവേണ്ടി മഹത്തും ഭയജനകവുമായ കാര്യങ്ങൾ പ്രവർത്തിക്കാനും അങ്ങയുടെ ദേശത്തിനുവേണ്ടി, അങ്ങ് ഈജിപ്തിൽനിന്ന് തനിക്കായി വീണ്ടെടുത്ത അങ്ങയുടെ ജനത്തിന്റെ മുമ്പിൽനിന്ന് ജനതകളെയും അവരുടെ ദേവന്മാരെയും നീക്കിക്കളയാനും പുറപ്പെട്ടത് മറ്റേതു ജനത്തിനുവേണ്ടിയാണ്?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭയജനകമായ’ എന്നതിന് ‘ഭക്ത്യാദരം ഉണർത്തുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദം ഭയമോ ഭക്ത്യാദരമോ വിസ്മയമോ ഉണർത്തുന്ന പ്രവൃത്തികളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിലെ അവസാനഭാഗം ദുഷ്കരമാണ്. ‘ഈജിപ്തിൽനിന്ന്—ജനതകളെയും അതിന്റെ ദേവനെയും’ എന്നോ ‘ഈജിപ്തിൽനിന്ന്, ജനതകളെയും ദേവന്മാരെയും’ എന്നോ വായിക്കാനും കഴിയും.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְיִשְׂרָאֵל
  choice: ഇസ്രായേൽ എന്ന അങ്ങയുടെ ജനത്തെപ്പോലെ ആരുണ്ട്?
  rationale: താരതമ്യരൂപത്തിലുള്ള അലങ്കാരചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇസ്രായേലിനെ ‘അങ്ങയുടെ ജനം’ എന്നതിന്റെ വിശദീകരണമായി വായിക്കുന്നു.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: ഭൂമിയിലെ ഏകജനത
  rationale: ഇവിടെ אֶחָד സൂചിപ്പിക്കുന്ന അതുല്യതയും വാക്യത്തിന്റെ ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר הָלְכוּ אֱלֹהִים
  choice: ദൈവം ... പുറപ്പെട്ടത് മറ്റേതു ജനത്തിനുവേണ്ടിയാണ്?
  rationale: אֱלֹהִים രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും സന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ ദൈവത്തെ ഏകവചനമായി സൂചിപ്പിക്കുന്നു. ബന്ധവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിലെ അലങ്കാരചോദ്യമായി ക്രമീകരിച്ചു.
- source_word: לִפְדּוֹת לוֹ לְעָם
  choice: തനിക്കായി ഒരു ജനമായി വീണ്ടെടുക്കാൻ
  rationale: פדה എന്നതിന്റെ വീണ്ടെടുപ്പ് അർത്ഥവും לְ־യുടെ ഉടമസ്ഥത/ലക്ഷ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: וְלָשׂוּם לוֹ שֵׁם
  choice: തനിക്കായി ഒരു നാമം ഉണ്ടാക്കാൻ
  rationale: കീർത്തി നേടുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപകാത്മകത സംരക്ഷിക്കുന്ന, മലയാളത്തിൽ മനസ്സിലാകുന്ന അവതരണം.
- source_word: וְלַעֲשׂוֹת לָכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി ... പ്രവർത്തിക്കാൻ
  rationale: മസോററ്റിക് പാഠത്തിലെ രണ്ടാം പുരുഷ ബഹുവചനമായ לָכֶם ഒഴിവാക്കാതെ, ഇസ്രായേലിനെ കൂട്ടമായി അഭിസംബോധന ചെയ്യുന്നതായി നിലനിർത്തുന്നു.
- source_word: הַגְּדוּלָּה וְנֹרָאוֹת
  choice: മഹത്തും ഭയജനകവുമായ കാര്യങ്ങൾ
  rationale: നാമവിശേഷണസദൃശമായ ആദ്യരൂപവും ഭയം/ഭക്ത്യാദരം ഉണർത്തുന്ന נוראות എന്ന പദത്തിന്റെ ശക്തിയും പകരുന്നു.
- source_word: לְאַרְצְךָ מִפְּנֵי עַמְּךָ
  choice: അങ്ങയുടെ ദേശത്തിനുവേണ്ടി, അങ്ങയുടെ ജനത്തിന്റെ മുമ്പിൽനിന്ന്
  rationale: ദേശത്തോടുള്ള ദ്വിതീയപുരുഷ ഏകവചനബന്ധവും מִפְּנֵי എന്നതിന്റെ സ്ഥാനികമായ ‘മുമ്പിൽനിന്ന്’ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם
  choice: അങ്ങ് ഈജിപ്തിൽനിന്ന് തനിക്കായി വീണ്ടെടുത്ത
  rationale: פדהയുടെ ആവർത്തനം ‘വീണ്ടെടുത്ത’ എന്നു തന്നെ പകരുകയും ദൈവത്തോടുള്ള ആദരസൂചക ഏകവചന അഭിസംബോധന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: גּוֹיִם וֵאלֹהָיו
  choice: ജനതകളെയും അവരുടെ ദേവന്മാരെയും
  rationale: ദുഷ്കരമായ അവസാനപ്രയോഗത്തെ, ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് നീക്കപ്പെട്ടവയായി ജനതകളെയും അവരുടെ ദേവന്മാരെയും കാണുന്ന സന്ദർഭോചിത വായനയായി മുഖ്യപാഠത്തിൽ നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ വചനവും സൂചിതവ്യക്തിയും
  choice: ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനം ‘ദൈവം’
  alternative: ‘ദേവന്മാർ’ എന്ന ബഹുവചനവായന
  rationale: വാക്യത്തിന്റെ പ്രസംഗസന്ദർഭം ഇസ്രായേലിനുവേണ്ടി പ്രവർത്തിക്കുന്ന ഏക ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; രൂപപരമായ ബഹുവചനം മാത്രം പിന്തുടരുന്നത് ആശയം വികലമാക്കും.
- issue: גּוֹיִם וֵאלֹהָיו എന്ന ദുഷ്കരമായ അവസാനപ്രയോഗം
  choice: ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് നീക്കപ്പെട്ട ‘ജനതകളെയും അവരുടെ ദേവന്മാരെയും’
  alternative: ‘ഈജിപ്തിൽനിന്ന്—ജനതകളെയും അതിന്റെ ദേവനെയും’ അല്ലെങ്കിൽ ‘ഈജിപ്തിൽനിന്ന്, ജനതകളെയും ദേവന്മാരെയും’
  rationale: ഹീബ്രു വാക്യാന്ത്യം സംക്ഷിപ്തവും വ്യാകരണപരമായി ദുഷ്കരവുമാണ്. മുഖ്യവായന സന്ദർഭത്തോട് യോജിക്കുന്നുവെങ്കിലും അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർത്ഥനാഭാഷയാണ് ഉപയോഗിച്ചത്. ദൈവത്തോടുള്ള ഏകവചന അഭിസംബോധനയ്ക്ക് ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും ഇസ്രായേലിനോടുള്ള לָכֶם എന്ന ബഹുവചനത്തിന് ‘നിങ്ങൾക്കുവേണ്ടി’ എന്നും നൽകി, മൂലപാഠത്തിലെ വ്യക്തി-വചനമാറ്റം സംരക്ഷിച്ചു. ദീർഘമായ ഹീബ്രു വാക്യം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി അലങ്കാരചോദ്യത്തിന്റെ സ്വാഭാവിക ക്രമത്തിൽ പുനഃക്രമീകരിച്ചെങ്കിലും ആശയഘടകങ്ങൾ ഒഴിവാക്കിയിട്ടില്ല.
