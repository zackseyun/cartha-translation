reference: 2 Samuel 7:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הוֹאֵל֙ וּ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֞ה אֲדֹנָ֤/י יְהוִה֙ דִּבַּ֔רְתָּ וּ/מִ/בִּרְכָ֣תְ/ךָ֔ יְבֹרַ֥ךְ בֵּֽית עַבְדְּ/ךָ֖ לְ/עוֹלָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
translation:
  language: ml
  text: ഇപ്പോൾ, അങ്ങയുടെ ദാസന്റെ ഭവനം അങ്ങയുടെ സന്നിധിയിൽ എന്നേക്കും നിലനിൽക്കേണ്ടതിന്, അതിനെ അനുഗ്രഹിക്കാൻ ദയവായി മനസ്സാകണമേ.[a] കർത്താവായ യാഹ്‌വേ,[b] അങ്ങുതന്നെ അരുളിച്ചെയ്തിരിക്കുന്നുവല്ലോ. അങ്ങയുടെ അനുഗ്രഹത്താൽ അങ്ങയുടെ ദാസന്റെ ഭവനം[c] എന്നേക്കും അനുഗ്രഹിക്കപ്പെട്ടിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദയവായി പ്രസാദിച്ച് അനുഗ്രഹിക്കണമേ’ അല്ലെങ്കിൽ ‘അനുഗ്രഹിക്കാൻ സമ്മതിക്കണമേ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ ‘അദോനായ് യാഹ്‌വേ’—‘കർത്താവ്’ എന്ന പദവിയും ‘യാഹ്‌വേ’ എന്ന ദൈവനാമവും ചേർന്ന രൂപം.
    reason: alternative_reading
  - marker: c
    text: ഇവിടെ ‘ഭവനം’ എന്നതിന് ‘കുടുംബം’ അല്ലെങ്കിൽ ‘രാജവംശം’ എന്ന അർഥവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל
  choice: ദയവായി മനസ്സാകണമേ
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള ഈ ക്രിയ ദയാപൂർവം സമ്മതിക്കുകയോ സന്നദ്ധനാകുകയോ ചെയ്യുക എന്ന അപേക്ഷാഭാവം വഹിക്കുന്നു. മലയാളത്തിലെ പ്രാർഥനാഭാഷയിൽ ‘മനസ്സാകണമേ’ ആ വിനീതമായ അപേക്ഷ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּבָרֵךְ
  choice: അതിനെ അനുഗ്രഹിക്കാൻ
  rationale: മലയാളത്തിൽ הוֹאֵל എന്ന ക്രിയയോടു ചേർന്ന് ‘അനുഗ്രഹിക്കാൻ മനസ്സാകണമേ’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്; അനുഗ്രഹിക്കണമെന്ന ആജ്ഞാപേക്ഷയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: בֵּית עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസന്റെ ഭവനം
  rationale: בַּיִת എന്നതിന് ഭവനം, കുടുംബം, രാജവംശം എന്നീ പാളികളുള്ള അർഥമുണ്ട്. ‘ഭവനം’ അധ്യായത്തിലെ ആ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ ബഹുവാച്യത സംരക്ഷിക്കുന്നു.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: അങ്ങയുടെ സന്നിധിയിൽ എന്നേക്കും നിലനിൽക്കേണ്ടതിന്
  rationale: അക്ഷരാർഥമായ ‘അങ്ങയുടെ മുമ്പിൽ എന്നേക്കും ആയിരിക്കേണ്ടതിന്’ എന്നതിലെ ദീർഘകാല നിലനിൽപ്പിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘സ്ഥാപിക്കപ്പെടുക’ എന്ന ഉറവിടത്തിൽ നേരിട്ട് ഇല്ലാത്ത ആശയം ചേർക്കുന്നില്ല.
- source_word: אֲדֹנָי יְהוִה
  choice: കർത്താവായ യഹോവേ
  rationale: אֲדֹנָי എന്ന പദവിയും יהוה എന്ന ദൈവനാമവും രണ്ടും വ്യക്തമായി സൂക്ഷിക്കുന്നു; നേരിട്ടുള്ള അഭിസംബോധനയായതിനാൽ സംബോധനരൂപം ഉപയോഗിച്ചു.
- source_word: דִּבַּרְתָּ
  choice: അരുളിച്ചെയ്തിരിക്കുന്നുവല്ലോ
  rationale: ദൈവത്തിന്റെ മുൻപ്രസ്താവന പൂർത്തിയായതും ഇപ്പോഴും പ്രാബല്യമുള്ളതുമാണെന്ന ആശയം പ്രകടമാക്കുന്നു. ‘വല്ലോ’ തുടർന്നുള്ള വിശ്വാസപൂർവമായ നിഗമനത്തിന് ആധാരം നൽകുന്ന כי-യുടെ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: וּמִבִּרְכָתְךָ
  choice: അങ്ങയുടെ അനുഗ്രഹത്താൽ
  rationale: מִן ഇവിടെ അനുഗ്രഹത്തിന്റെ ഉറവിടമോ കാരണമോ സൂചിപ്പിക്കുന്നു; ‘അനുഗ്രഹത്താൽ’ അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יְבֹרַךְ
  choice: അനുഗൃഹീതമായിരിക്കും
  rationale: നിഫാൽ അപൂർണരൂപത്തിന്റെ കർമണിപ്രയോഗവും ഭാവിദിശയും സംരക്ഷിക്കുന്നു.
- source_word: לְעוֹלָם
  choice: എന്നേക്കും
  rationale: ഉടമ്പടി-സന്ദർഭത്തിലെ നിലനിൽക്കുന്ന ഭാവികാലത്തെ സാധാരണയും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: אֲדֹנָי יְהוִה എന്ന സംയുക്തത്തിൽ ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: കർത്താവായ യഹോവേ
  alternative: കർത്താവായ ദൈവമേ / പരമാധികാരിയായ കർത്താവേ
  rationale: ഹീബ്രു പാഠത്തിലെ പദവിയെയും ദൈവത്തിന്റെ വ്യക്തിനാമത്തെയും വേർതിരിച്ചറിയാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു; ‘യഹോവ’ എന്നത് മലയാളത്തിൽ പരിചിതമായ നാമരൂപമാണ്.
- issue: ‘ഭവനം’ എന്നത് രാജവംശമായി വ്യക്തമാക്കണമോ
  choice: അങ്ങയുടെ ദാസന്റെ ഭവനം
  alternative: അങ്ങയുടെ ദാസന്റെ രാജവംശം / കുടുംബം
  rationale: ഈ സന്ദർഭം ദാവീദിന്റെ വംശപരമ്പരയെ ഉൾക്കൊള്ളുന്നുവെങ്കിലും, ഹീബ്രു ‘ഭവനം’ എന്ന പദത്തിലൂടെ കുടുംബം, വംശം, രാജവംശം എന്നീ അർഥങ്ങൾ ഉദ്ദേശപൂർവം തുറന്നുവെക്കുന്നു. അതിനാൽ ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം; ദൈവത്തോടുള്ള ആദരസൂചക അഭിസംബോധനയ്ക്ക് ‘അങ്ങ്’ ഉപയോഗിച്ചു. പ്രാർഥനയുടെ വിനീതതയ്ക്കായി ‘മനസ്സാകണമേ’യും ദൈവവചനത്തിന് ‘അരുളിച്ചെയ്യുക’യും സ്വീകരിച്ചു. പ്രധാനപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
