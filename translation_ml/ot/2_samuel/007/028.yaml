  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י יְהוִ֗ה אַתָּה הוּא֙ הָֽ/אֱלֹהִ֔ים וּ/דְבָרֶ֖י/ךָ יִהְי֣וּ אֱמֶ֑ת וַ/תְּדַבֵּר֙ אֶֽל עַבְדְּ/ךָ֔ אֶת הַ/טּוֹבָ֖ה הַ/זֹּֽאת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/028.yaml
  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
translation:
  language: ml
  text: ഇപ്പോൾ, കർത്താവായ യഹോവേ[a], അങ്ങുതന്നെയാണ് ദൈവം; അങ്ങയുടെ വചനങ്ങൾ സത്യമാണ്[b]. അങ്ങയുടെ ദാസനോട് ഈ നല്ല കാര്യം അങ്ങ് പറഞ്ഞിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘കർത്താവായ യഹോവേ.’ ദൈവത്തിന്റെ പ്രത്യേക നാമമായ יהוה ഇവിടെ നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അങ്ങയുടെ വചനങ്ങൾ സത്യമായിരിക്കും’ അല്ലെങ്കിൽ ‘അങ്ങയുടെ വചനങ്ങൾ വിശ്വാസയോഗ്യമാണ്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: കർത്താവായ യഹോവേ
  rationale: אֲדֹנָי എന്ന അധികാരസൂചകമായ അഭിസംബോധനയും יהוה എന്ന ദൈവനാമവും വേർതിരിച്ചു നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക അഭിസംബോധനയ്ക്കായി ‘യഹോവേ’ എന്നു പ്രയോഗിച്ചു.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: അങ്ങുതന്നെയാണ് ദൈവം
  rationale: אַתָּה הוּא എന്ന ഊന്നൽ ‘അങ്ങുതന്നെ’ എന്നു പ്രകടമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായ ദൈവാഭിസംബോധന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: דְבָרֶיךָ
  choice: അങ്ങയുടെ വചനങ്ങൾ
  rationale: മൂലത്തിലെ ബഹുവചനം സംരക്ഷിക്കുന്നു; ദൈവത്തിന്റെ പ്രസ്താവനകളെ സൂചിപ്പിക്കാൻ ‘വചനങ്ങൾ’ ഗൗരവമുള്ളതും സാധാരണ ബൈബിൾ ഭാഷയിൽ ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: יִהְיוּ אֱמֶת
  choice: സത്യമാണ്
  rationale: അപൂർണ്ണക്രിയാരൂപത്തിന് ഇവിടെ നിലനിൽക്കുന്ന യാഥാർഥ്യത്തെയോ ഉറപ്പിനെയോ സൂചിപ്പിക്കാം. אֱמֶת എന്ന നാമപദത്തിന്റെ ‘സത്യം/വിശ്വാസ്യത’ എന്ന അർഥവ്യാപ്തി ചുരുക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַתְּדַבֵּר
  choice: അരുളിച്ചെയ്തിരിക്കുന്നു
  rationale: ദൈവം മുമ്പ് പറഞ്ഞതിന്റെ ഇപ്പോഴും പ്രസക്തമായ ഫലം വ്യക്തമാക്കുന്നു; ‘വാഗ്ദാനം ചെയ്തു’ എന്ന വ്യാഖ്യാനപരമായ പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു.
- source_word: אֶל עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനോട്
  rationale: രാജകീയ പ്രാർഥനയിൽ ദാവീദ് ദൈവസന്നിധിയിൽ സ്വയം വിശേഷിപ്പിക്കുന്ന രീതിക്ക് ‘ദാസൻ’ അനുയോജ്യമാണ്.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: ഈ നന്മ
  rationale: ‘ഈ നല്ല കാര്യം’ എന്നതിനെക്കാൾ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളം; ‘വാഗ്ദാനം’ അല്ലെങ്കിൽ ‘അനുഗ്രഹം’ എന്നു നിർവചിച്ച് മൂലത്തിലെ വിശാലത ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: אֲדֹנָי יְהוִה എന്ന സംയുക്ത ദൈവാഭിസംബോധന
  choice: കർത്താവായ യഹോവേ
  alternative: കർത്താവായ ദൈവമേ / കർത്താവായ യാഹ്‌വേ
  rationale: ദൈവനാമം ഒരു പൊതുപദംകൊണ്ട് പകരാതെ മൂലത്തിലെ പ്രത്യേക നാമം നിലനിർത്തുന്നു; അതേസമയം אֲדֹנָי എന്ന ‘കർത്താവ്’ എന്ന ഘടകവും സംരക്ഷിക്കുന്നു.
- issue: יִהְיוּ אֱמֶת എന്നതിന്റെ കാലവും അർഥവും
  choice: അങ്ങയുടെ വചനങ്ങൾ സത്യമാണ്
  alternative: അങ്ങയുടെ വചനങ്ങൾ സത്യമായിരിക്കും / അങ്ങയുടെ വചനങ്ങൾ വിശ്വാസയോഗ്യമാണ്
  rationale: ഹീബ്രു രൂപം ഭാവികാലമായി വായിക്കാവുന്നതാണെങ്കിലും സന്ദർഭത്തിൽ ദൈവവചനത്തിന്റെ സ്ഥിരമായ സത്യതയും വിശ്വാസ്യതയും ഏറ്റുപറയുന്നതായി വർത്തമാനകാലം സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പ്രാർഥനാസ്വഭാവമുള്ളതുമായ ശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു. പദാനുപദ കൃത്രിമത ഒഴിവാക്കിയെങ്കിലും മൂലത്തിലെ ബഹുവചനം, ദൈവനാമം, ഊന്നൽ, അർഥസന്ദിഗ്ധത എന്നിവ സംരക്ഷിച്ചു.
