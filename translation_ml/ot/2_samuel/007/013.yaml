  text: ה֥וּא יִבְנֶה בַּ֖יִת לִ/שְׁמִ֑/י וְ/כֹנַנְתִּ֛י אֶת כִּסֵּ֥א מַמְלַכְתּ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/013.yaml
  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
translation:
  language: ml
  text: അവൻ എന്റെ നാമത്തിനായി ഒരു ഭവനം പണിയും[a]; അവന്റെ രാജ്യത്തിന്റെ സിംഹാസനം ഞാൻ എന്നേക്കും ഉറപ്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ നാമത്തിനായി ഒരു ദൈവാലയം.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘എന്റെ നാമത്തിനായി ഒരു ഭവനം’ എന്നാണ്; ഈ അധ്യായത്തിൽ ദൈവാലയത്തെയും രാജവംശത്തെയും ബന്ധിപ്പിക്കുന്ന ‘ഭവനം’ എന്ന പദപ്രയോഗം ഇതിലൂടെ നിലനിൽക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: അവൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ സ്വതന്ത്ര സർവനാമം ഇവിടെ വ്യക്തമായ കർത്താവായി വരുന്നു; സന്ദർഭം ആവശ്യപ്പെടാത്തതിനാൽ ‘അവൻ തന്നേ’ എന്ന ഊന്നൽ ചേർത്തിട്ടില്ല.
- source_word: יִבְנֶה
  choice: പണിയും
  rationale: בנה എന്ന ധാതുവിന്റെ കാൽ അപൂർണ്ണരൂപം വാഗ്ദാനസന്ദർഭത്തിൽ ഭാവിക്രിയയെ സൂചിപ്പിക്കുന്നു; ‘പണിയും’ സ്വാഭാവികവും പ്രവചനാത്മക ബലം നിലനിർത്തുന്നതുമാണ്.
- source_word: בַּיִת
  choice: ഒരു ഭവനം
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘വീട്/ഭവനം’ എന്നാണ്. ഇവിടെ ദൈവാലയമാണ് ഉടനെയുള്ള സൂചനയെങ്കിലും, അധ്യായത്തിൽ ദൈവാലയവും രാജവംശവും തമ്മിലുള്ള ‘ഭവനം’ എന്ന പദപ്രയോഗം നിലനിർത്താൻ ‘ഭവനം’ തെരഞ്ഞെടുത്തു.
- source_word: לִשְׁמִי
  choice: എന്റെ നാമത്തിനായി
  rationale: לְ + ‘എന്റെ നാമം’ എന്ന എബ്രായ പ്രയോഗത്തെ അതിരുകടന്ന് വിശദീകരിക്കാതെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: וְכֹנַנְתִּי
  choice: ഞാൻ ... ഉറപ്പിക്കും
  rationale: വാഗ്ദാനക്രമത്തിൽ ഈ ഒന്നാംപുരുഷ പൂർണ്ണരൂപത്തിന് ഭാവിബലം ഉണ്ട്. כון എന്ന ധാതുവിന്റെ ഉറപ്പിക്കൽ/സ്ഥിരമാക്കൽ എന്ന ആശയം രാജകീയ സന്ദർഭത്തിൽ ‘ഉറപ്പിക്കും’ നന്നായി നൽകുന്നു.
- source_word: אֶת כִּסֵּא
  choice: സിംഹാസനം
  rationale: രാജകീയ സന്ദർഭത്തിലെ כִּסֵּאയുടെ നേരിട്ടുള്ള അർഥമാണ് ‘സിംഹാസനം’; אֶת എന്ന കർമസൂചകം പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല.
- source_word: מַמְלַכְתּוֹ
  choice: അവന്റെ രാജ്യത്തിന്റെ
  rationale: രാജ്യം അഥവാ രാജാധിപത്യപരിധി എന്ന ആശയം നൽകുന്ന പദത്തിന് ‘രാജ്യം’ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: നിലനിൽക്കുന്ന ശാശ്വതതയെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പ്രയോഗം; ദാവീദീയ വാഗ്ദാനത്തിന്റെ പൂർണബലം ക്ഷയിപ്പിക്കാതെ ‘എന്നേക്കും’ നൽകുന്നു.
theological_decisions:
- issue: בַּיִת എന്നത് ‘ഭവനം’ എന്നോ വ്യാഖ്യാനാത്മകമായി ‘ദൈവാലയം’ എന്നോ നൽകുക
  choice: ഭവനം
  alternative: ദൈവാലയം
  rationale: ഉടനെയുള്ള സൂചന ശലോമോൻ പണിയുന്ന ദൈവാലയമാണെങ്കിലും, ഈ അധ്യായത്തിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര ഘടന ദൈവാലയവും രാജവംശവും സൂചിപ്പിക്കുന്ന ‘ഭവനം’ എന്ന ഇരട്ടപ്രയോഗത്തെ ആശ്രയിക്കുന്നു. പ്രധാനപാഠത്തിൽ ‘ഭവനം’ നിലനിർത്തുന്നത് ആ അർഥസമ്പുഷ്ടത സംരക്ഷിക്കുന്നു.
- issue: ദാവീദീയ വാഗ്ദാനത്തിലെ עַד עוֹלָם എന്നതിന്റെ ബലം
  choice: എന്നേക്കും
  alternative: വളരെക്കാലത്തേക്ക്
  rationale: ഈ ഉടമ്പടി-വാഗ്ദാന സന്ദർഭത്തിൽ പ്രയോഗം നിലനിൽക്കുന്ന ശാശ്വതതയുടെ പൂർണബലം വഹിക്കുന്നു; അതിനെ വെറും അനിശ്ചിതമായ ദീർഘകാലമായി ദുർബലപ്പെടുത്തരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഭവനം’ എന്നത് ‘വീട്’ എന്നതിനെക്കാൾ ആരാധനാലയസൂചനയ്ക്ക് യോജിച്ച ഗൗരവം നൽകുകയും എബ്രായത്തിലെ പദപ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
