source:
  edition: WLC
  text: וְ/חַסְדִּ֖/י לֹא יָס֣וּר מִמֶּ֑/נּוּ כַּ/אֲשֶׁ֤ר הֲסִרֹ֨תִי֙ מֵ/עִ֣ם שָׁא֔וּל אֲשֶׁ֥ר הֲסִרֹ֖תִי מִ/לְּ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/015.yaml
  text: But my steadfast love will not depart from him[a], as I removed it from Saul[b], whom I removed from before you.
translation:
  language: ml
  text: എന്നാൽ എന്റെ അചഞ്ചല സ്നേഹം അവനെ വിട്ടുമാറുകയില്ല[a]; നിന്റെ മുമ്പിൽനിന്ന്[b] ഞാൻ നീക്കിയ ശൗലിൽനിന്ന് അതു നീക്കിയതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ വിശ്വസ്തസ്നേഹം’ അല്ലെങ്കിൽ ‘എന്റെ ഉടമ്പടിവിശ്വസ്തത’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഉടമ്പടി ബന്ധത്തിനുള്ളിലെ ഉറച്ചതും വിശ്വസ്തവുമായ സ്നേഹത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘നിന്റെ മുമ്പിൽനിന്ന്’. ഇത് കേവലം ശാരീരികമായി അകറ്റിയതിനെക്കാൾ, ദാവീദിനോടുള്ള ബന്ധത്തിൽ ശൗലിനെ അവന്റെ സ്ഥാനത്തുനിന്ന് നീക്കിയതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: എന്റെ അചഞ്ചലസ്നേഹം
  rationale: חֶסֶד ഇവിടെ ഉടമ്പടി ബന്ധത്തിലെ ഉറച്ചതും വിശ്വസ്തവുമായ സ്നേഹത്തെ സൂചിപ്പിക്കുന്നു. ‘അചഞ്ചലസ്നേഹം’ അതിന്റെ ബന്ധപരവും നിലനിൽക്കുന്നതുമായ ഭാരം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יָסוּר
  choice: വിട്ടുമാറുകയില്ല
  rationale: סור എന്നതിന് മാറിപ്പോകുക, വിട്ടുമാറുക, നീങ്ങിപ്പോകുക എന്നീ അർഥങ്ങളുണ്ട്. സ്നേഹമാണ് കർത്താവ് എന്നതിനാൽ ‘വിട്ടുമാറുകയില്ല’ സ്വാഭാവികവും മൂലരൂപത്തോട് അടുത്തതുമാണ്.
- source_word: מִמֶּנּוּ
  choice: അവനെ
  rationale: מן എന്ന വേർപാടുസൂചക ഉപസർഗത്തിന്റെ ആശയം ‘അവനെ വിട്ട്’ എന്ന ക്രിയാപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു; വാഗ്ദത്ത രാജവംശജനെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: כַּאֲשֶׁר
  choice: അതുപോലെ
  rationale: ശൗലിനോടു ചെയ്തതിനോടുള്ള താരതമ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הֲסִרֹתִי מֵעִם שָׁאוּל
  choice: ശൗലിൽനിന്ന് അതു നീക്കിയ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥമായ ‘നീക്കുക’ നിലനിർത്തുകയും സന്ദർഭത്തിൽ കർമമായി മനസ്സിലാകുന്ന ദൈവത്തിന്റെ അചഞ്ചലസ്നേഹത്തെ ‘അതു’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר הֲסִרֹתִי מִלְּפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന് ഞാൻ നീക്കിയ
  rationale: മൂലത്തിലെ ‘നിന്റെ മുമ്പിൽനിന്ന്’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; ശൗലിനെ രാജസ്ഥാനത്തുനിന്ന് നീക്കിയെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ദാവീദിക ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ חֶסֶד എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: അചഞ്ചലസ്നേഹം
  alternative: കരുണ; വിശ്വസ്തസ്നേഹം; ഉടമ്പടിവിശ്വസ്തത
  rationale: ദൈവത്തിന്റെ സ്ഥിരമായ ബന്ധനിഷ്ഠയും സ്നേഹവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു; അതേസമയം ഒരു പ്രത്യേക സിദ്ധാന്തസൂത്രത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- issue: ‘നിന്റെ മുമ്പിൽനിന്ന്’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: എബ്രായ ദൃശ്യപ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തുക
  alternative: നിന്റെ സന്നിധിയിൽനിന്ന്; നിന്റെ മുമ്പിൽ രാജാവായിരിക്കുന്നതിൽനിന്ന്
  rationale: ശൗലിന്റെ നീക്കം ദാവീദിനോടുള്ള ബന്ധത്തിൽ സംഭവിച്ചതാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നുവെങ്കിലും, അതിന്റെ കൃത്യസ്വഭാവം മുഖ്യവാചകത്തിൽ വിശദീകരിക്കാതെ മൂലത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ താരതമ്യഘടനയും ‘നിന്റെ മുമ്പിൽനിന്ന്’ എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തിയിട്ടുണ്ട്; ദൈർഘ്യമേറിയ വ്യാഖ്യാനം അടിക്കുറിപ്പിലേക്കു മാറ്റിയിരിക്കുന്നു.
