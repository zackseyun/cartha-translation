  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י לְ/יִשְׂרָאֵ֤ל וּ/נְטַעְתִּי/ו֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹֽא יֹסִ֤יפוּ בְנֵֽי עַוְלָה֙ לְ/עַנּוֹת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
translation:
  language: ml
  text: ഞാൻ എന്റെ ജനമായ ഇസ്രായേലിനായി ഒരു സ്ഥലം നിശ്ചയിക്കുകയും അവരെ അവിടെ നട്ടുറപ്പിക്കുകയും ചെയ്യും; അങ്ങനെ അവർ തങ്ങളുടെ സ്വന്തം സ്ഥലത്തു വസിക്കും, ഇനി അസ്വസ്ഥരാകുകയുമില്ല. ദുഷ്ടതയുടെ പുത്രന്മാർ[a] മുമ്പത്തെപ്പോലെ ഇനി അവരെ പീഡിപ്പിക്കുകയുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “ദുഷ്പ്രവൃത്തിക്കാർ” അല്ലെങ്കിൽ “ദുഷ്ടന്മാർ.” എബ്രായത്തിൽ അക്ഷരാർഥം: “ദുഷ്ടതയുടെ പുത്രന്മാർ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: ഒരു സ്ഥലം നിശ്ചയിക്കുകയും
  rationale: שׂוּם എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘വെക്കുക’ എന്നാണെങ്കിലും, מָקוֹם കൂടെയുള്ള ഈ വാഗ്ദാനസന്ദർഭത്തിൽ ഒരു സ്ഥലം നിയോഗിക്കുക എന്ന ആശയമാണ്; ‘നിശ്ചയിക്കുക’ ദൈവിക മുൻകൈയും വാചകത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു.
- source_word: לְעַמִּי לְיִשְׂרָאֵל
  choice: എന്റെ ജനമായ ഇസ്രായേലിനായി
  rationale: ഇരട്ട പ്രയോഗം സമാനാധികരണമാണ്; ‘എന്റെ ജനം’ എന്ന ഉടമ്പടിബന്ധവും ‘ഇസ്രായേൽ’ എന്ന തിരിച്ചറിയലും ഒരുമിച്ചു സൂക്ഷിക്കുന്നു.
- source_word: וּנְטַעְתִּיו
  choice: അവരെ അവിടെ നട്ടുറപ്പിക്കുകയും
  rationale: ‘നടുക’ എന്ന കാർഷിക രൂപകം നിലനിർത്തിക്കൊണ്ട് സുരക്ഷിതമായി സ്ഥാപിക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘നട്ടുറപ്പിക്കുക’ തെരഞ്ഞെടുത്തു. ‘അവിടെ’ എന്നത് തുടർന്നുള്ള תַּחְתָּיו സൂചിപ്പിക്കുന്ന നിയുക്ത സ്ഥലവുമായി ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: അവർ തങ്ങളുടെ സ്വന്തം സ്ഥലത്തു വസിക്കും
  rationale: ഇസ്രായേൽ എന്ന സമൂഹവാചക ഏകവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി അവതരിപ്പിക്കുന്നു. תַּחְתָּיו ഇവിടെ കീഴിലായിരിക്കുക എന്നതിലുപരി സ്വന്തം നിയുക്ത സ്ഥാനത്ത് സ്ഥിരതാമസമാക്കുക എന്ന പ്രയോഗാർഥത്തിലാണ്.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: ഇനി അസ്വസ്ഥരാക്കപ്പെടുകയുമില്ല
  rationale: רגז കുലുക്കപ്പെടുക, കലങ്ങുക, അസ്വസ്ഥമാക്കപ്പെടുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു; ശത്രുക്കളാൽ ജനതയുടെ സുരക്ഷ തകർക്കപ്പെടുന്ന സന്ദർഭത്തിന് ഈ പ്രയോഗം യോജിക്കുന്നു.
- source_word: בְנֵי עַוְלָה
  choice: ദുഷ്ടതയുടെ പുത്രന്മാർ
  rationale: ഹീബ്രു ഭാഷയിലെ ‘ദുഷ്ടതയുടെ/അനീതിയുടെ പുത്രന്മാർ’ എന്ന ശക്തമായ പുരുഷലിംഗ രൂപകം മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുന്നു; സ്വാഭാവികമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְעַנּוֹתוֹ
  choice: അവരെ പീഡിപ്പിക്കുക
  rationale: Piel രൂപത്തിലുള്ള ענה ഇവിടെ പീഡിപ്പിക്കുക, കഷ്ടപ്പെടുത്തുക, അടിച്ചമർത്തുക എന്നീ അർഥങ്ങളുള്ളതാണ്; ശത്രുതാപരമായ പെരുമാറ്റത്തെ ഉൾക്കൊള്ളുന്ന ‘പീഡിപ്പിക്കുക’ അനുയോജ്യം.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: മുമ്പത്തെപ്പോലെ
  rationale: മുൻകാല പീഡനാവസ്ഥയിലേക്കുള്ള കാലപരമായ താരതമ്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന സമൂഹവാചക ഏകവചനവും ഏകവചന പ്രത്യയങ്ങളും
  choice: മലയാളത്തിൽ ‘അവർ/അവരെ’ എന്ന ബഹുവചനം ഉപയോഗിച്ചു
  alternative: ‘അവൻ/അവനെ’ എന്ന ഏകവചന ദേശീയ വ്യക്തിവൽക്കരണം നിലനിർത്തുക
  rationale: ഹീബ്രു ഒരു ജനതയെ സമൂഹവാചക ഏകവചനമായി കാണുന്നു. മലയാളത്തിൽ ജനസമൂഹത്തെ സൂചിപ്പിക്കാൻ ബഹുവചനം ഉപയോഗിക്കുന്നത് അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഇത് ഭാഷാപരമായ തീരുമാനമാണ്.
- issue: בְנֵי עַוְלָה എന്ന ഹീബ്രു പ്രയോഗം
  choice: മുഖ്യപാഠത്തിൽ ‘ദുഷ്ടതയുടെ പുത്രന്മാർ’ എന്നു രൂപകം നിലനിർത്തി
  alternative: ‘ദുഷ്പ്രവൃത്തിക്കാർ’ അല്ലെങ്കിൽ ‘ദുഷ്ടന്മാർ’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്യുക
  rationale: മൂലത്തിലെ വ്യക്തമായ പുരുഷലിംഗ രൂപകവും അതിന്റെ ഊന്നലും സംരക്ഷിച്ചു; അർഥസഹായം അടിക്കുറിപ്പിൽ നൽകി.
- issue: תַּחְתָּיו എന്നതിന്റെ സ്ഥലസൂചന
  choice: ‘തങ്ങളുടെ സ്വന്തം സ്ഥലത്തു’ എന്ന സന്ദർഭോചിത പ്രയോഗാർഥം സ്വീകരിച്ചു
  alternative: ‘അതിന്റെ കീഴിൽ’ അല്ലെങ്കിൽ ‘അവന്റെ കീഴിൽ’ എന്ന അക്ഷരാർഥം
  rationale: ഈ വാഗ്ദാനസന്ദർഭം കീഴ്വഴക്കത്തെയല്ല, നിയുക്ത സ്ഥലത്തെ സുരക്ഷിതവും സ്ഥിരവുമായ വാസത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നട്ടുറപ്പിക്കുക’ എന്നത് മൂലത്തിലെ നടൽരൂപകവും സ്ഥിരസ്ഥാപനത്തിന്റെ ആശയവും ചേർത്ത് നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
