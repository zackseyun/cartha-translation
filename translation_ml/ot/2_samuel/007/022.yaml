source:
  edition: WLC
  text: עַל כֵּ֥ן גָּדַ֖לְתָּ אֲדֹנָ֣/י יְהוִ֑ה כִּֽי אֵ֣ין כָּמ֗וֹ/ךָ וְ/אֵ֤ין אֱלֹהִים֙ זֽוּלָתֶ֔/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
translation:
  language: ml
  text: അതുകൊണ്ട്, കർത്താവായ യഹോവേ[a], അങ്ങ് മഹാനാകുന്നു; കാരണം അങ്ങയെപ്പോലെ ആരുമില്ല, അങ്ങയല്ലാതെ ദൈവവുമില്ല[b]—ഞങ്ങൾ ഞങ്ങളുടെ ചെവികളാൽ കേട്ടിട്ടുള്ള സകലത്തിനും അനുസരിച്ച്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘അദോനായ് യഹോവ.’ ഇവിടെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരും ‘യഹോവ’ എന്ന ദൈവനാമവും ഒരുമിച്ചു വരുന്നു.'
    reason: cultural_note
  - marker: b
    text: 'മറ്റൊരു വിവർത്തനം: ‘അങ്ങയെക്കൂടാതെ ഒരു ദൈവവുമില്ല’ അല്ലെങ്കിൽ ‘അങ്ങയൊഴികെ ദൈവമില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ദൈവിക വാഗ്ദാനത്തിലും പ്രവൃത്തികളിലുംനിന്നുള്ള നിഗമനം അവതരിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ യുക്തിബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: גָּדַלְתָּ
  choice: അങ്ങ് വലിയവനാകുന്നു
  rationale: גדל എന്ന ക്രിയയുടെ ഫലസ്ഥിതിയെയോ മഹത്ത്വത്തിന്റെ അംഗീകാരത്തെയോ സൂചിപ്പിക്കുന്ന അർഥം, വ്യാഖ്യാനപരമായി അധികം വികസിപ്പിക്കാതെ സ്തുതിസന്ദർഭത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֲדֹנָי יְהוִה
  choice: കർത്താവായ യഹോവേ
  rationale: אֲדֹנָי എന്ന അധികാരസൂചക പദവും יהוה എന്ന ദൈവനാമവും വേർതിരിച്ചും സ്വാഭാവികമായ മലയാള സംബോധനരൂപത്തിലും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന അർധവിരാമബന്ധം
  rationale: മലയാളത്തിൽ ‘കാരണം’ ആവർത്തിക്കാതെ, തുടർന്നുള്ള വാക്യഭാഗം മുൻപ്രഖ്യാപനത്തിന്റെ അടിസ്ഥാനം ആണെന്ന് വാക്യഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: אֵין כָּמוֹךָ
  choice: അങ്ങയെപ്പോലെ ആരുമില്ല
  rationale: ദൈവത്തിന്റെ അതുല്യതയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: അങ്ങയല്ലാതെ ദൈവവുമില്ല
  rationale: זוּלָתֶךָ എന്നതിലെ ‘അല്ലാതെ/ഒഴികെ’ എന്ന ഒഴിവാക്കൽഭാവവും ഏകദൈവവിശ്വാസപരമായ നേരിട്ടുള്ള പ്രഖ്യാപനവും നിലനിർത്തുന്നു.
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: ഞങ്ങൾ സ്വന്തം ചെവികൊണ്ട് കേട്ടിട്ടുള്ളതൊക്കെയും അനുസരിച്ച്
  rationale: ‘ചെവികൊണ്ട്’ എന്ന ഹീബ്രു ഊന്നൽ മലയാളത്തിൽ ‘സ്വന്തം’ ചേർത്ത് സ്വാഭാവികമാക്കുകയും, בְּ എന്നതിന്റെ ‘അനുസരിച്ച്’ എന്ന ബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: אֲדֹנָי יְהוִה എന്ന സംയുക്ത ദൈവിക നാമത്തിന്റെ വിവർത്തനം
  choice: കർത്താവായ യഹോവേ
  alternative: കർത്താവായ ദൈവമേ / പരമാധികാരിയായ കർത്താവേ
  rationale: മൂലപാഠത്തിലെ יהוה എന്ന പ്രത്യേക ദൈവനാമം മറച്ചുവയ്ക്കാതെ ‘യഹോവ’ എന്നു നൽകുകയും, אֲדֹנָי എന്ന പദത്തിന്റെ ‘കർത്താവ്’ എന്ന അർഥവും നിലനിർത്തുകയും ചെയ്യുന്നു.
- issue: אֵין אֱלֹהִים זוּלָתֶךָ എന്ന ഏകദൈവവിശ്വാസ പ്രഖ്യാപനം
  choice: അങ്ങയല്ലാതെ ദൈവവുമില്ല
  alternative: അങ്ങയെക്കൂടാതെ ഒരു ദൈവവുമില്ല / അങ്ങയൊഴികെ ദൈവമില്ല
  rationale: വാക്യത്തിന്റെ സവിശേഷതയും ദൈവിക ഏകത്വത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള അവകാശവാദവും സംരക്ഷിക്കുന്നു; പിന്നീട് രൂപപ്പെട്ട തത്ത്വചിന്താപരമായ വിശദീകരണം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമായ ഭാഷ. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്/അങ്ങയെ’ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ആവർത്തനവും അതുല്യത–ഏകദൈവത്വ സമാന്തരഘടനയും നിലനിർത്തി; അതേസമയം മലയാളത്തിൽ അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി.
