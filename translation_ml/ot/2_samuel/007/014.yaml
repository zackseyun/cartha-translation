reference: 2 Samuel 7:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲנִי֙ אֶהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִהְיֶה לִּ֣/י לְ/בֵ֑ן אֲשֶׁר֙ בְּ/הַ֣עֲוֺת֔/וֹ וְ/הֹֽכַחְתִּי/ו֙ בְּ/שֵׁ֣בֶט אֲנָשִׁ֔ים וּ/בְ/נִגְעֵ֖י בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
translation:
  language: ml
  text: ഞാൻ അവന് പിതാവായിരിക്കും; അവൻ എനിക്ക് പുത്രനായിരിക്കും. അവൻ അകൃത്യം ചെയ്യുമ്പോൾ, ഞാൻ അവനെ മനുഷ്യരുടെ വടികൊണ്ടും മനുഷ്യപുത്രന്മാരുടെ പ്രഹരങ്ങൾകൊണ്ടും[a] ശിക്ഷിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “മനുഷ്യർ ഏൽപ്പിക്കുന്ന പ്രഹരങ്ങൾകൊണ്ടും.” എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “മനുഷ്യപുത്രന്മാരുടെ പ്രഹരങ്ങൾകൊണ്ടും” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: ഞാൻ അവന് പിതാവായിരിക്കും
  rationale: ലാമെദ് ഘടനയിലെ ബന്ധസൂചകവും വിധേയവുമായ രൂപം നിലനിർത്തുന്നു; ‘ഞാൻ അവന്റെ പിതാവായിരിക്കും’ എന്നതിനെക്കാൾ എബ്രായ പ്രയോഗത്തോട് സുതാര്യമാണ്, എന്നാൽ മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: അവൻ എനിക്ക് പുത്രനായിരിക്കും
  rationale: പരസ്പരമുള്ള ഉടമ്പടി-സൂത്രത്തിന്റെ സമാന്തരഘടനയും ബന്ധസൂചകമായ എബ്രായ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: അവൻ അകൃത്യം ചെയ്യുമ്പോൾ
  rationale: אֲשֶׁר ഇവിടെ തുടർന്നുവരുന്ന പ്രവൃത്തിയുടെ സാഹചര്യത്തെ പരിചയപ്പെടുത്തുന്നു. ‘എങ്കിൽ’ എന്നത് നിബന്ധനാഭാവം അനാവശ്യമായി ശക്തമാക്കും; ‘ചെയ്യുമ്പോൾ’ കാലസാഹചര്യം സ്വാഭാവികമായി നൽകുന്നു. ‘അകൃത്യം’ ധാർമിക ഗൗരവം നിലനിർത്തുന്നു.
- source_word: וְהֹכַחְתִּיו
  choice: ഞാൻ അവനെ … ശിക്ഷിച്ചു തിരുത്തും
  rationale: יכח എന്ന ഹിഫിൽ രൂപത്തിലെ ശാസന, തിരുത്തൽ എന്നീ അർത്ഥങ്ങളും പിന്നാലെയുള്ള പ്രഹരോപാധികളും ഒരുമിച്ച് പ്രകടിപ്പിക്കാൻ ഈ സംയുക്തപ്രയോഗം ഉപയോഗിച്ചു; വെറും വാക്കാലുള്ള ശാസനയായി ചുരുക്കുന്നില്ല.
- source_word: בְּשֵׁבֶט אֲנָשִׁים
  choice: മനുഷ്യരുടെ വടികൊണ്ട്
  rationale: ‘വടി’ എന്ന രൂപകം നിലനിർത്തുകയും, സാധാരണ മനുഷ്യോപാധികളെയോ മനുഷ്യർ മുഖാന്തരമുള്ള ശിക്ഷയെയോ സൂചിപ്പിക്കുന്നതിലെ അവ്യക്തത പരിഹരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וּבְנִגְעֵי בְּנֵי אָדָם
  choice: മനുഷ്യപുത്രന്മാരുടെ പ്രഹരങ്ങൾകൊണ്ട്
  rationale: נגע എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ ‘പ്രഹരം’ എന്ന അർത്ഥവും בני אדם എന്ന എബ്രായ പദസമുച്ചയത്തിന്റെ രൂപവും സംരക്ഷിക്കുന്നു; കൂടുതൽ സ്വാഭാവികമായ അർത്ഥവ്യക്തീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ രാജവംശത്തെയും പിന്നീടുള്ള മശീഹാപരമായ പ്രയോഗത്തെയും സംബന്ധിച്ച പുത്രത്വവാഗ്ദാനത്തിന്റെ വ്യാപ്തി
  choice: ദാവീദിന്റെ സന്തതി/രാജാവ് എന്ന ഉടൻപ്രസക്തമായ ചരിത്രസന്ദർഭത്തിന് യോജിച്ച വിധത്തിൽ വാക്യം പരിഭാഷപ്പെടുത്തി; പ്രധാനപാഠത്തിൽ വ്യക്തമായി പറയാത്ത മശീഹാപരമായ വ്യാഖ്യാനം ചേർത്തില്ല.
  alternative: പ്രധാനപാഠത്തിൽ നേരിട്ടുള്ള മശീഹാപരമായ അർത്ഥം ഉൾപ്പെടുത്തുക.
  rationale: ഈ വാക്യം ആദ്യം ദാവീദിന്റെ സന്തതിയെക്കുറിച്ചുള്ള ഉടമ്പടിക്കുള്ളിലാണ് പ്രവർത്തിക്കുന്നത്; പുത്രത്വഭാഷയ്ക്ക് പിന്നീടുള്ള തിരുവെഴുത്തുകളിൽ വിശാലമായ പ്രയോഗമുണ്ടെങ്കിലും, എബ്രായപാഠത്തിൽ വ്യക്തമല്ലാത്ത ക്രിസ്തുശാസ്ത്രപരമായ വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യാപ്തിയും സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പിതാവ്/പുത്രൻ’, ‘അകൃത്യം’, ‘വടി’, ‘പ്രഹരം’ എന്നീ പദങ്ങൾ ഉടമ്പടി-ഭാഷയുടെയും ശിക്ഷണരൂപകത്തിന്റെയും ഭാരത്വം നിലനിർത്തുന്നു. ‘ശിക്ഷിച്ചു തിരുത്തും’ എന്നത് ശിക്ഷയുടെ തിരുത്തൽലക്ഷ്യം വ്യക്തമാക്കുന്നു, എന്നാൽ ശിക്ഷയെ മൃദൂകരിക്കുന്നില്ല.
