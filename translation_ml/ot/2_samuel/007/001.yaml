  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֕י כִּי יָשַׁ֥ב הַ/מֶּ֖לֶךְ בְּ/בֵית֑/וֹ וַ/יהוָ֛ה הֵנִֽיחַ ל֥/וֹ מִ/סָּבִ֖יב מִ/כָּל אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: When the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
translation:
  language: ml
  text: രാജാവ് തന്റെ വീട്ടിൽ[a] താമസിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, യഹോവ ചുറ്റുമുള്ള സകല ശത്രുക്കളിൽനിന്നും അവന് സ്വസ്ഥത നൽകിയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൊട്ടാരത്തിൽ.’ എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘വീട്ടിൽ’ എന്നാണ്; ഈ അധ്യായത്തിൽ പിന്നീട് വരുന്ന പദപ്രയോഗം നിലനിർത്തുന്നതിനായി ഇവിടെ ‘വീട്’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …താമസിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: പുതിയ രംഗത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ ആഖ്യാനസൂത്രത്തെ പുരാതനശൈലിയിലുള്ള അനാവശ്യ പദപ്രയോഗമില്ലാതെ സ്വാഭാവികമായ കാലസംബന്ധ ഉപവാക്യമായി നൽകി.
- source_word: יָשַׁב
  choice: താമസിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ഇവിടെ ശാരീരികമായി ഇരിക്കുക എന്നതല്ല, സ്ഥിരമായി വസിക്കുന്ന അവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുകൊണ്ടിരുന്ന ആ അവസ്ഥയും മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: മൂലപാഠം ദാവീദ് എന്ന വ്യക്തിനാമത്തിനു പകരം നിശ്ചിതമായ രാജപദവി ഉപയോഗിക്കുന്നതിനാൽ അതു നിലനിർത്തി.
- source_word: בְּבֵיתוֹ
  choice: തന്റെ വീട്ടിൽ
  rationale: בַּיִת എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘വീട്’ നിലനിർത്തുന്നതോടൊപ്പം അധ്യായത്തിൽ പിന്നീട് വരുന്ന ‘വീട്’ എന്ന പദത്തിന്റെ സാഹിത്യപരമായ ബഹുവർത്ഥതയും സംരക്ഷിക്കുന്നു.
- source_word: וַיהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ יהוה വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു; മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
- source_word: הֵנִיחַ לוֹ
  choice: അവന് സ്വസ്ഥത നൽകിയിരുന്നു
  rationale: נוח എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം—സംഘർഷത്തിൽനിന്ന് വിശ്രമം അഥവാ ആശ്വാസം നൽകുക—വ്യക്തമായി നൽകുന്നു.
- source_word: מִסָּבִיב
  choice: ചുറ്റുമുള്ള
  rationale: എല്ലാ വശങ്ങളിലും ഉണ്ടായിരുന്ന ശത്രുക്കളിൽനിന്നുള്ള സുരക്ഷ എന്ന സ്ഥലപരമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִכָּל אֹיְבָיו
  choice: സകല ശത്രുക്കളിൽനിന്നും
  rationale: സ്വസ്ഥത ലഭിച്ചതിന്റെ ഉറവിടമായ എല്ലാ ശത്രുക്കളെയും ഉൾക്കൊള്ളുന്ന മൂലപാഠത്തിന്റെ സമഗ്രത നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ സ്ഥാനനാമമല്ല, ദൈവത്തിന്റെ ഉടമ്പടിനാമമാണ് നേരിട്ട് ഉള്ളത്; അതിനാൽ വ്യക്തിനാമമായി നിലനിർത്തി.
- issue: בַּיִת എന്ന പദത്തിലെ രാജവസതി എന്ന സാധ്യതയും അധ്യായത്തിലെ പദപ്രയോഗവും
  choice: വീട്
  alternative: കൊട്ടാരം
  rationale: സന്ദർഭത്തിൽ രാജകൊട്ടാരം ഉദ്ദേശിക്കാമെങ്കിലും, ‘വീട്’ മൂലപദത്തോട് അടുത്തതും ദാവീദിന്റെ വീട്, യഹോവയ്ക്കുള്ള വീട്, രാജവംശം എന്നീ തുടർ ആശയങ്ങളുടെ ഉദ്ദേശപൂർവമായ ബന്ധം മുൻകൂട്ടി സംരക്ഷിക്കുന്നതുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്ന രീതിയിലുള്ളതിനാൽ അന്ത്യത്തിൽ പൂർണവിരാമമില്ല. ‘തന്റെ’ എന്നത് കർത്താവായ രാജാവിലേക്കുള്ള പ്രതിഫലനബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
