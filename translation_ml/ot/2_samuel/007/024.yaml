  text: וַ/תְּכ֣וֹנֵֽן לְ֠/ךָ אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
translation:
  language: ml
  text: ഇസ്രായേൽ എന്ന അങ്ങയുടെ ജനത്തെ, അങ്ങേക്കായി എന്നേക്കും ഒരു ജനമായി നിലനിൽക്കേണ്ടതിന്, അങ്ങ് ഉറപ്പിച്ചു; യഹോവയായ[a] അങ്ങ് അവർക്കു ദൈവമായിത്തീർന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ YHWH ആണ്; ഇവിടെ അത് ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ ‘അവരുടെ ദൈവമായിരുന്നു.’ എബ്രായപ്രയോഗം സ്ഥിതിവാചകമായി വിവർത്തനം ചെയ്യാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ ‘ദൈവമായിത്തീർന്നു’ എന്നത് ഉടമ്പടിബന്ധം സ്ഥാപിക്കപ്പെട്ടതിന്റെ ഭാവം കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכוֹנֵן
  choice: ഉറപ്പിച്ചു
  rationale: כון എന്ന ധാതുവിന്റെ ഈ രൂപം ‘ഉറപ്പിക്കുക, സ്ഥിരമായി സ്ഥാപിക്കുക’ എന്ന ആശയം നൽകുന്നു. ‘ഉറപ്പിച്ചു’ എന്നത് ഇസ്രായേലിന്റെ ഉടമ്പടിജനമായുള്ള നില ഉറപ്പിച്ചതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לְךָ ... לְךָ לְעָם
  choice: അങ്ങയുടെ ... അങ്ങേക്കുതന്നെ ഒരു ജനമായിരിക്കേണ്ടതിന്
  rationale: ആവർത്തിക്കുന്ന לְךָ ദൈവത്തോടുള്ള ഉടമസ്ഥതയും ഉടമ്പടിബന്ധവും ഊന്നുന്നു. മലയാളത്തിൽ ആ ആവർത്തനത്തിന്റെ ആശയം നിലനിർത്താൻ ‘അങ്ങയുടെ’ എന്നും ‘അങ്ങേക്കുതന്നെ’ എന്നും നൽകി.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: അങ്ങയുടെ ജനമായ ഇസ്രായേൽ
  rationale: ഇസ്രായേലിന്റെ പേരും ദൈവത്തിന്റെ ജനമെന്ന തിരിച്ചറിയലും ഒരുമിച്ച് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: ദീർഘകാലസ്ഥിരതയും തുടർച്ചയും സൂചിപ്പിക്കുന്ന ഈ എബ്രായപ്രയോഗത്തിന് ലളിതവും ഗൗരവമുള്ളതുമായ സമാനപദം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവികനാമമായ YHWH-യെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നൽകി.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: അങ്ങ് അവർക്കു ദൈവമായിത്തീർന്നു
  rationale: היה + ל എന്ന ഘടന ഇവിടെ ദൈവവും ഇസ്രായേലും തമ്മിലുള്ള ഉടമ്പടിബന്ധം സ്ഥാപിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു. ‘ദൈവമായിത്തീർന്നു’ ആ സജീവമായ അർഥം നിലനിർത്തുന്നു; എങ്കിലും സ്ഥിതിവാചകമായ വിവർത്തനവും വ്യാകരണപരമായി സാധ്യമാണ്.
theological_decisions:
- issue: ഉടമ്പടിസൂത്രത്തിന്റെ പരസ്പരബന്ധം
  choice: ഇസ്രായേൽ അങ്ങേക്കുതന്നെ ഒരു ജനമായിരിക്കേണ്ടതിന് ... അങ്ങ് അവർക്കു ദൈവമായിത്തീർന്നു
  alternative: ഇസ്രായേൽ അങ്ങയുടെ ജനമായിരിക്കേണ്ടതിന് ... അങ്ങ് അവരുടെ ദൈവമായിരുന്നു
  rationale: ഇസ്രായേൽ ദൈവത്തിന്റെ ജനവും യഹോവ ഇസ്രായേലിന്റെ ദൈവവും ആകുന്ന പരസ്പര ഉടമ്പടിബന്ധം വാക്യം അവതരിപ്പിക്കുന്നു. വിവർത്തനം ഈ ബന്ധം നിലനിർത്തുന്നു; അതിനുമീതെ പിൽക്കാല ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: הָיִיתָ എന്ന ക്രിയയുടെ സജീവമോ സ്ഥിതിവാചകമോ ആയ അർഥം
  choice: ദൈവമായിത്തീർന്നു
  alternative: ദൈവമായിരുന്നു
  rationale: സന്ദർഭത്തിൽ ദൈവം ഇസ്രായേലിനെ തന്റെ ജനമായി ഉറപ്പിച്ചതിന് സമാന്തരമായി ഉടമ്പടിബന്ധം സ്ഥാപിക്കുന്ന സജീവമായ ഭാവം മുൻഗണിച്ചു. സാധ്യമായ സ്ഥിതിവാചകവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: പ്രാർഥനാസന്ദർഭത്തിന് യോജിച്ച ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഭാഷ ആധുനികവും ഗൗരവമുള്ളതുമാണ്. ‘അങ്ങയുടെ ... അങ്ങേക്കുതന്നെ’ എന്ന ആവർത്തനം എബ്രായത്തിലെ ആവർത്തിച്ച לְךָ നൽകുന്ന ഉടമസ്ഥതയുടെയും ഉടമ്പടിബന്ധത്തിന്റെയും ഊന്നൽ സൂക്ഷിക്കുന്നു.
