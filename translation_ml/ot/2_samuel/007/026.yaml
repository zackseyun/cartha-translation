id: 2SA.7.26
reference: 2 Samuel 7:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֣ה צְבָא֔וֹת אֱלֹהִ֖ים עַל יִשְׂרָאֵ֑ל וּ/בֵית֙ עַבְדְּ/ךָ֣ דָוִ֔ד יִהְיֶ֥ה נָכ֖וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
translation:
  language: ml
  text: “സൈന്യങ്ങളുടെ യഹ്‌വേ ഇസ്രായേലിന്മേൽ ദൈവമാണ്” എന്നു പറയത്തക്കവിധം നിന്റെ നാമം എന്നേക്കും മഹത്തായിരിക്കട്ടെ[a]. നിന്റെ ദാസനായ ദാവീദിന്റെ ഭവനം[b] നിന്റെ സന്നിധിയിൽ സ്ഥിരമായി നിലനിൽക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ നാമം എന്നേക്കും മഹത്താക്കപ്പെടട്ടെ.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ഭവനം’ എന്നത് ഒരു കെട്ടിടത്തെ മാത്രമല്ല, ദാവീദിന്റെ കുടുംബത്തെയോ രാജവംശത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִגְדַּל
  choice: മഹത്തായിരിക്കട്ടെ
  rationale: സന്ദർഭത്തിലെ പ്രാർഥനാപരമായ ആശംസാഭാവം മലയാളത്തിലെ ‘-ട്ടെ’ രൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു. നാമം കൂടുതൽ മഹത്തായി അംഗീകരിക്കപ്പെടുക എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: שִׁמְךָ
  choice: നിന്റെ നാമം
  rationale: ഹീബ്രായ പ്രയോഗം അതേപടി നിലനിർത്തുന്നു; ഇവിടെ ‘നാമം’ ദൈവത്തിന്റെ പ്രസിദ്ധിയെയും വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വത്തെയും സൂചിപ്പിക്കാമെങ്കിലും അതിനെ മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: לֵאמֹר
  choice: എന്നു പറയത്തക്കവിധം
  rationale: തുടർന്നുവരുന്ന പ്രഖ്യാപനവുമായി ബന്ധിപ്പിക്കുന്ന ഉദ്ധരണിഭാവം നിലനിർത്തുന്നു; അക്ഷരാർഥമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്നതിനെക്കാൾ മലയാളത്തിൽ വാക്യബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ, മൂലരൂപത്തെ അടിസ്ഥാനമാക്കിയുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ
  rationale: ദൈവിക വിശേഷണത്തിലെ ബഹുവചനവും വിശാലമായ സൈനിക/സ്വർഗീയ കൂട്ടങ്ങളുടെ ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്മേൽ ദൈവമാണ്
  rationale: עַל ഇവിടെ അധികാരത്തെയും പരമാധികാരത്തെയും സൂചിപ്പിക്കുന്നതായി എടുത്ത് ‘ഇസ്രായേലിന്മേൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וּבֵית עַבְדְּךָ דָוִד
  choice: നിന്റെ ദാസനായ ദാവീദിന്റെ ഭവനം
  rationale: בַּיִת എന്ന ‘വീട്/ഭവനം’ പദം നിലനിർത്തി അധ്യായത്തിലെ ഭവനം–രാജവംശം പദപ്രയോഗബന്ധം സംരക്ഷിക്കുന്നു; ഉദ്ദേശിക്കുന്ന കുടുംബവംശാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִהְיֶה נָכוֹן
  choice: സ്ഥിരമായി നിലനിൽക്കട്ടെ
  rationale: היה + נָכוֹן നൽകുന്ന ഉറപ്പിക്കപ്പെടുക, ദൃഢമായി നിലകൊള്ളുക എന്നീ ആശയങ്ങളും പ്രാർഥനാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לְפָנֶיךָ
  choice: നിന്റെ സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിലും സാന്നിധ്യത്തിലുമുള്ള സ്ഥിരത എന്ന ബന്ധപരമായ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ, സാധ്യമായ മൂലോച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്ന ‘യഹ്‌വേ’ നിലനിർത്തുന്നു.
- issue: ദാവീദിന്റെ ‘ഭവനം’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘ഭവനം’ നിലനിർത്തി, രാജവംശാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക
  alternative: രാജവംശം; വംശപരമ്പര
  rationale: ഭൗതിക കെട്ടിടം മാത്രമല്ല, ദാവീദിന്റെ കുടുംബത്തെയും രാജവംശത്തെയും ഉദ്ദേശിക്കുന്നുവെങ്കിലും, 2 ശമൂവേൽ 7-ലെ ‘ഭവനം’ എന്ന പദത്തിന്റെ ഉദ്ദേശപൂർവമായ ആവർത്തനവും പദപ്രയോഗബന്ധവും സംരക്ഷിക്കുന്നു.
- issue: לֵאמֹר എന്നതിന്റെ വാക്യബന്ധം
  choice: ‘എന്നു പറയത്തക്കവിധം’ എന്ന ഫലസൂചക ബന്ധം
  alternative: ‘എന്നു പറഞ്ഞുകൊണ്ട്’; ‘എന്നു പറയപ്പെടട്ടെ’
  rationale: നാമം മഹത്താകുന്നതും തുടർന്നുള്ള പൊതുപ്രഖ്യാപനവും തമ്മിലുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആരാണ് പറയുന്നത് എന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പ്രത്യേക കർത്താവിനെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ പ്രാർഥനയുടെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ദൈവനാമത്തിന് ‘യഹ്‌വേ’ എന്നും covenantal/dynastic പദപ്രയോഗത്തിന് ‘ഭവനം’ എന്നും ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാപാരമ്പര്യ പദങ്ങൾ ഒഴിവാക്കി.
