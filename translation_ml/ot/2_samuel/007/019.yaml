source:
  edition: WLC
  text: וַ/תִּקְטַן֩ ע֨וֹד זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֣/י יְהוִ֔ה וַ/תְּדַבֵּ֛ר גַּ֥ם אֶל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵֽ/רָח֑וֹק וְ/זֹ֛את תּוֹרַ֥ת הָ/אָדָ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
translation:
  language: ml
  text: കർത്താവായ യഹോവേ, ഇതുപോലും അങ്ങയുടെ ദൃഷ്ടിയിൽ ചെറിയ കാര്യമായിരുന്നു; അങ്ങയുടെ ദാസന്റെ ഭവനത്തെക്കുറിച്ചും[a] ദൂരെയുള്ള ഭാവിയിലേക്കും അങ്ങ് അരുളിച്ചെയ്തിരിക്കുന്നു. ഇതാണ് മനുഷ്യനുള്ള നിർദേശം, കർത്താവായ യഹോവേ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ «ഭവനം»; ഇത് കുടുംബത്തെയോ രാജവംശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അവസാന വാക്യഭാഗത്തിന്റെ എബ്രായപാഠം ദുഷ്കരമാണ്. «ഇതാണ് മനുഷ്യന്റെ നിയമം/പതിവ്», «ഇതാണ് മനുഷ്യരാശിക്കുള്ള പ്രമാണം», അല്ലെങ്കിൽ «ഇതാണ് മനുഷ്യനെക്കുറിച്ചുള്ള നിർദേശം» എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן עוֹד זֹאת בְּעֵינֶיךָ
  choice: ഇതും അങ്ങയുടെ ദൃഷ്ടിയിൽ ചെറിയ കാര്യമായിരുന്നു
  rationale: קטן എന്നതിന്റെ ‘ചെറുതായിരിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും בְּעֵינֶיךָ എന്ന വിലയിരുത്തൽസൂചകമായ എബ്രായ പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲדֹנָי יְהוִה
  choice: കർത്താവായ യഹോവേ
  rationale: സംയുക്ത ദൈവനാമത്തിലെ אֲדֹנָי എന്ന പദവിയും יהוה എന്ന വ്യക്തിനാമവും വേർതിരിച്ചറിയാവുന്ന വിധത്തിൽ അഭിസംബോധനയായി നൽകുന്നു.
- source_word: בֵּית עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസന്റെ ഭവനം
  rationale: ‘ദാസന്റെ വീട്’ എന്ന മൂലരൂപകം നിലനിർത്തുന്നു; ഇവിടെ ഭവനം കുടുംബത്തെയോ രാജവംശത്തെയോ സൂചിപ്പിക്കാം.
- source_word: לְמֵרָחוֹק
  choice: വിദൂരഭാവിയിലേക്കും
  rationale: ‘ദൂരത്തേക്ക്’ എന്ന പദപ്രയോഗത്തിന് സന്ദർഭത്തിലുള്ള കാലപരമായ, ഏറെക്കാലം വരെയുള്ള അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְזֹאת תּוֹרַת הָאָדָם
  choice: ഇതാണ് മനുഷ്യനുള്ള പ്രബോധനം
  rationale: תּוֹרָה എന്നതിന്റെ വിശാലമായ ‘പ്രബോധനം/നിർദേശം’ എന്ന അർഥം സ്വീകരിച്ച്, ദുഷ്കരമായ അവസാനവാക്യത്തെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ സമീപിക്കുന്നു.
theological_decisions:
- issue: וְזֹאת תּוֹרַת הָאָדָם എന്ന ദുഷ്കരമായ വാക്യഭാഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ഇതാണ് മനുഷ്യനുള്ള പ്രബോധനം
  alternative: ‘ഇതാണ് മനുഷ്യരാശിക്കുള്ള പ്രമാണം,’ ‘ഇതാണ് മനുഷ്യന്റെ നിയമം/പതിവ്,’ അല്ലെങ്കിൽ ‘ഇതാണ് മനുഷ്യനെക്കുറിച്ചുള്ള പ്രബോധനം’
  rationale: എബ്രായ വാക്യഘടനയും תּוֹרָה, הָאָדָם എന്നീ പദങ്ങളുടെ വ്യാപ്തിയും ഒന്നിലധികം വ്യാഖ്യാനങ്ങൾ അനുവദിക്കുന്നു. മുഖ്യപാഠം പദങ്ങളോട് അടുത്തുനിൽക്കുന്നു; യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. പ്രാർഥനാത്മകവും ഗൗരവമുള്ളതുമായ ശൈലി നിലനിർത്തിക്കൊണ്ട് അപൂർവമായ പഴഞ്ചൊല്ലുകൾ ഒഴിവാക്കി. യഥാർഥ പാഠദുഷ്കരത [a] എന്ന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
