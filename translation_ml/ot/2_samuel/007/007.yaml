source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל בְּנֵ֣י יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר צִוִּ֗יתִי לִ/רְע֛וֹת אֶת עַמִּ֥/י אֶת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לָ֛/מָּה לֹֽא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെ ഇടയിൽ ഞാൻ സഞ്ചരിച്ച സകല സ്ഥലങ്ങളിലും, എന്റെ ജനമായ ഇസ്രായേലിനെ മേയ്ക്കാൻ ഞാൻ കല്പിച്ച ഇസ്രായേൽ ഗോത്രങ്ങളിൽ ഒന്നിനോട്, ‘നിങ്ങൾ എനിക്കായി ദേവദാരുകൊണ്ടുള്ള ഒരു ഭവനം പണിയാതിരുന്നത് എന്തുകൊണ്ട്?’ എന്ന് ഞാൻ ഒരിക്കലെങ്കിലും ഒരു വാക്കു പറഞ്ഞിട്ടുണ്ടോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: ഞാൻ സഞ്ചരിച്ച
  rationale: הלך എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം ഇവിടെ സ്ഥിരവാസത്തെയല്ല, ദൈവം തന്റെ ജനത്തിന്റെ ഇടയിൽ സഞ്ചരിച്ചതിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സഞ്ചരിച്ച’ എന്നത് ആ ചലനഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഇത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവായ ഉടമ്പടിനാമമാണ്. ‘ഇസ്രായേൽമക്കൾ’ മൂലരൂപത്തോട് സുതാര്യമായും മലയാള ബൈബിൾ ഭാഷയിൽ ഗ്രാഹ്യമായും നിൽക്കുന്നു.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: ഞാൻ ഒരു വാക്കെങ്കിലും പറഞ്ഞിട്ടുണ്ടോ?
  rationale: ചോദകഘടനയും ഒരേ ധാതുവിൽനിന്നുള്ള നാമ-ക്രിയാസംയോജനവും ചേർന്ന് നിഷേധത്തിന് ഊന്നൽ നൽകുന്നു. ‘ഒരു വാക്കെങ്കിലും’ ആ വാചാടോപശക്തി മലയാളത്തിൽ പകരുന്നു.
- source_word: אַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗോത്രങ്ങളിൽ ഏതെങ്കിലും ഒന്നിനോട്
  rationale: മസോററ്റിക് പാഠത്തിലെ שִׁבְטֵי എന്നത് ‘ഗോത്രങ്ങൾ’ എന്നാണ്. തുടർന്നുള്ള മേയ്ക്കാനുള്ള കല്പന നേതാക്കളിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും ആ അർഥം മുഖ്യപാഠത്തിൽ പകരാതെ പാഠഭേദം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: אֲשֶׁר צִוִּיתִי לִרְעוֹת
  choice: മേയ്ക്കാൻ ഞാൻ കല്പിച്ച
  rationale: רעה എന്ന ക്രിയയുടെ ഇടയരൂപകം നിലനിർത്തുന്നു; ‘ഭരിക്കാൻ’ എന്നു സമതലപ്പെടുത്തുന്നില്ല. ബന്ധവാക്യം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ ഗോത്രങ്ങളെ വിശേഷിപ്പിക്കുന്നു.
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: എന്റെ ജനമായ ഇസ്രായേൽ
  rationale: ഉടമ്പടിബന്ധമായ ‘എന്റെ ജനം’ എന്ന ഉടമസ്ഥതാഭാവവും ‘ഇസ്രായേൽ’ എന്ന തിരിച്ചറിയലും രണ്ടും നിലനിർത്തുന്നു.
- source_word: לָמָּה לֹא בְנִיתֶם לִי בֵּית אֲרָזִים
  choice: നിങ്ങൾ എനിക്കായി ദേവദാരുകൊണ്ടുള്ള ഒരു ഭവനം പണിയാതിരുന്നത് എന്തുകൊണ്ട്?
  rationale: ബഹുവചന അഭിസംബോധനയായ בְנִיתֶם ‘നിങ്ങൾ’ എന്നതിലൂടെ നിലനിർത്തുന്നു. ‘ദേവദാരുകൊണ്ടുള്ള ഒരു ഭവനം’ നിർമ്മാണവസ്തുവിനെയും കൂടാരവുമായി ഉള്ള വ്യത്യാസത്തെയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന ലിംഗചിഹ്നമുള്ള ദേശീയനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം / ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ בְּנֵי יִשְׂרָאֵל എന്ന പരമ്പരാഗത ദേശീയനാമത്തിന്റെ രൂപം സാധ്യമായത്ര നിലനിർത്തുന്നു; അതിനെ വ്യാഖ്യാനാത്മകമായി പൊതുവാക്കുന്നില്ല.
- issue: ‘ഗോത്രങ്ങൾ’ എന്ന പാഠവും നേതൃസൂചനയും തമ്മിലുള്ള സംഘർഷം
  choice: ഇസ്രായേൽഗോത്രങ്ങളിൽ ഏതെങ്കിലും ഒന്ന്
  alternative: ഇസ്രായേലിന്റെ ന്യായാധിപന്മാരിൽ/ഭരണാധികാരികളിൽ ഒരാൾ
  rationale: 2 ശമൂവേലിന്റെ മസോററ്റിക് പാഠം ‘ഗോത്രങ്ങൾ’ എന്നാണ് വായിക്കുന്നത്. മേയ്ക്കാൻ കല്പിക്കപ്പെട്ടവർ എന്ന സന്ദർഭവും 1 ദിനവൃത്താന്തം 17:6-ലെ ‘ന്യായാധിപന്മാർ’ എന്ന സമാന്തരവായനയും നേതാക്കളെ സൂചിപ്പിച്ചേക്കാം; എങ്കിലും ആ വായന മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘മേയ്ക്കുക’, ‘ഭവനം’, ‘ദേവദാരം’ എന്നീ പദങ്ങൾ ഇടയരൂപകവും ആരാധനാസന്ദർഭവും നിലനിർത്തുന്നു; വാക്യത്തിലെ ദീർഘമായ എബ്രായ ബന്ധഘടന മലയാളത്തിൽ വായിക്കാവുന്ന ക്രമത്തിലാക്കി.
