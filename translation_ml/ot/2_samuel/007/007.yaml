    text: എബ്രായപാഠത്തിൽ ‘ഇസ്രായേൽ ഗോത്രങ്ങളിൽ ഒന്ന്’ എന്നാണ്. സമാന്തരവാക്യമായ 1 ദിനവൃത്താന്തം 17:6-ൽ ‘ഇസ്രായേലിന്റെ ന്യായാധിപന്മാർ’ എന്നു വായിക്കുന്നു; ജനത്തെ മേയ്ക്കാനുള്ള ചുമതല ലഭിച്ച നേതാക്കളെയായിരിക്കാം അത് സൂചിപ്പിക്കുന്നത്.
