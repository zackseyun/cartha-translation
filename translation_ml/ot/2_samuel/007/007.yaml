revisions:
- from: ഇസ്രായേൽമക്കളുടെ ഇടയിൽ ഞാൻ സഞ്ചരിച്ചിടങ്ങളിലെല്ലാം, എന്റെ ജനമായ ഇസ്രായേലിനെ മേയ്ക്കാൻ ഞാൻ കല്പിച്ച ഇസ്രായേൽഗോത്രങ്ങളിൽ ഏതെങ്കിലും ഒന്നിനോട്[a], ‘നിങ്ങൾ എനിക്കായി ദേവദാരുകൊണ്ടുള്ള ഒരു ഭവനം പണിയാതിരുന്നത് എന്തുകൊണ്ട്?’ എന്ന് ഞാൻ ഒരു വാക്കെങ്കിലും പറഞ്ഞിട്ടുണ്ടോ?
  to: ഇസ്രായേൽമക്കളുടെ ഇടയിൽ ഞാൻ സഞ്ചരിച്ച സകല സ്ഥലങ്ങളിലും, എന്റെ ജനമായ ഇസ്രായേലിനെ മേയ്ക്കാൻ ഞാൻ കല്പിച്ച ഇസ്രായേൽ ഗോത്രങ്ങളിൽ ഒന്നിനോട്, ‘നിങ്ങൾ എനിക്കായി ദേവദാരുകൊണ്ടുള്ള ഒരു ഭവനം പണിയാതിരുന്നത് എന്തുകൊണ്ട്?’ എന്ന് ഞാൻ ഒരിക്കലെങ്കിലും ഒരു വാക്കു പറഞ്ഞിട്ടുണ്ടോ?
  rationale: 'The revision makes two limited improvements: it renders the singular “one” without the potentially over-indefinite “ഏതെങ്കിലും,” and it explicitly reflects the rhetorical emphasis of the Hebrew question with “ഒരിക്കലെങ്കിലും.” The Masoretic “tribes” reading remains in the text, while the Chronicles parallel remains confined to the footnote.'
