  terminology: “സന്തതി,” “എഴുന്നേൽപ്പിക്കും,” “രാജ്യം,” and “ഉറപ്പിക്കും” are appropriate for the dynastic context. “സന്തതി” appropriately preserves the Hebrew זַרְעֲךָ's possible representative-singular or collective force. The notes accurately explain the lexical and idiomatic expressions.
