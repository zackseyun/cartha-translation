source:
  edition: WLC
  text: כִּ֣י יִמְלְא֣וּ יָמֶ֗י/ךָ וְ/שָֽׁכַבְתָּ֙ אֶת אֲבֹתֶ֔י/ךָ וַ/הֲקִימֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יֵצֵ֖א מִ/מֵּעֶ֑י/ךָ וַ/הֲכִינֹתִ֖י אֶת מַמְלַכְתּֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
translation:
  language: ml
  text: നിന്റെ ആയുസ്സ് തികഞ്ഞ് നീ നിന്റെ പിതാക്കന്മാരോടൊപ്പം ശയിക്കുമ്പോൾ, നിനക്കുശേഷം നിന്റെ സ്വന്തം ശരീരത്തിൽനിന്നു പുറപ്പെടുന്ന നിന്റെ സന്തതിയെ[a][b] ഞാൻ എഴുന്നേൽപ്പിക്കും; അവന്റെ രാജ്യം ഞാൻ ഉറപ്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘നിന്റെ വിത്ത്’; ഈ പദത്തിന് ഒരു വംശജനെയോ വംശപരമ്പരയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘നിന്റെ ആന്തരഭാഗങ്ങളിൽനിന്ന്’; നിന്റെ സ്വന്തം ശരീരത്തിൽനിന്നുള്ള ജൈവസന്തതി എന്നർഥമുള്ള പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִמְלְאוּ יָמֶיךָ
  choice: നിന്റെ ആയുസ്സ് തികഞ്ഞ് … ശയിക്കുമ്പോൾ
  rationale: כִּי ഇവിടെ കാരണത്തെക്കാൾ ഭാവിയിലെ സമയസാഹചര്യം അവതരിപ്പിക്കുന്നു. ‘ആയുസ്സ് തികഞ്ഞ്’ എന്നത് ദിവസങ്ങൾ നിറയുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥവും ഗൗരവഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְשָׁכַבְתָּ אֶת־אֲבֹתֶיךָ
  choice: നീ നിന്റെ പിതാക്കന്മാരോടൊപ്പം ശയിക്കുമ്പോൾ
  rationale: മരണത്തെയും പൂർവികരോടു ചേരുന്നതിനെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; ‘മരിക്കുമ്പോൾ’ എന്നു വ്യാഖ്യാനിച്ച് രൂപകം ഇല്ലാതാക്കുന്നില്ല.
- source_word: וַהֲקִימֹתִי
  choice: ഞാൻ എഴുന്നേൽപ്പിക്കും
  rationale: പിൻഗാമിയെ ഉയർത്തി നിർത്തുക എന്ന ഹിഫീൽ ക്രിയയുടെ അർഥവും രാജവംശപരമായ പിൻതുടർച്ചയുടെ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: זַרְעֲךָ
  choice: നിന്റെ സന്തതി
  rationale: ‘സന്തതി’ എന്ന പദം ഒരൊറ്റ വംശജനെയും വംശപരമ്പരയെയും സൂചിപ്പിക്കാൻ കഴിയുന്നതിനാൽ എബ്രായത്തിലെ ഏകവചന/സമൂഹവാചക സാധ്യത പൂർണമായി അടച്ചുകളയുന്നില്ല.
- source_word: אַחֲרֶיךָ
  choice: നിനക്കുശേഷം
  rationale: കാലപരവും രാജവംശപരവുമായ പിൻതുടർച്ച ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: നിന്റെ സ്വന്തം ശരീരത്തിൽനിന്നു പുറപ്പെടുന്നവനെ
  rationale: מֵעֶה എന്നതിന്റെ അക്ഷരാർഥമായ ‘ആന്തരഭാഗങ്ങൾ’ എന്ന ദേഹരൂപകത്തെ ആധുനിക വായനക്കാരന് വ്യക്തമായ ജൈവവംശബന്ധമായി സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘പുറപ്പെടുക’ എന്ന ക്രിയാചിത്രവും നിലനിർത്തുന്നു.
- source_word: וַהֲכִינֹתִי
  choice: ഞാൻ ഉറപ്പിക്കും
  rationale: כון ഹിഫീലിന്റെ ‘ദൃഢമാക്കുക/സ്ഥിരപ്പെടുത്തുക’ എന്ന ആശയം നൽകുന്നു; മുമ്പുള്ള ‘എഴുന്നേൽപ്പിക്കും’ എന്നതിൽനിന്നുള്ള ക്രിയാഭേദവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: מַמְלַכְתּוֹ
  choice: അവന്റെ രാജ്യം
  rationale: രാജത്വം, രാജാധികാരം, ഭരണപരിധി എന്നിവ ഉൾക്കൊള്ളുന്ന സാധാരണവും സന്ദർഭോചിതവുമായ പരിഭാഷ.
theological_decisions:
- issue: ദാവീദിനോടുള്ള വാഗ്ദാനത്തിലെ זַרְעֲךָ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: നിന്റെ സന്തതി
  alternative: നിന്റെ വംശജൻ / നിന്റെ വിത്ത്
  rationale: എബ്രായപദം സമൂഹവാചകമായോ ഒരു പ്രതിനിധിയായ ഏകവചനമായോ പ്രവർത്തിക്കാം. ‘സന്തതി’ ഉടൻ വരാനിരിക്കുന്ന വ്യക്തിപരമായ പിൻഗാമിയെ അനുവദിക്കുമ്പോഴും വിശാലമായ രാജവംശപരമായ സാധ്യത അടച്ചുകളയുന്നില്ല; വാക്യത്തിലേക്ക് പിന്നീടുള്ള ദൈവശാസ്ത്രവികാസം നേരിട്ട് ഇറക്കിവയ്ക്കുന്നുമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പിതാക്കന്മാരോടൊപ്പം ശയിക്കുക’ എന്ന മരണരൂപകവും ‘എഴുന്നേൽപ്പിക്കുക’ എന്ന പിൻഗാമിത്വഭാവവും ഉദ്ദേശപൂർവം നിലനിർത്തി. ദീർഘവാക്യം വായിക്കാൻ എളുപ്പമാക്കാൻ സന്തതിയെ വിശദീകരിക്കുന്ന ഉപവാക്യം ദീർഘവിരാമചിഹ്നങ്ങൾക്കിടയിൽ നൽകി.
