  source_fidelity: 'മുഖ്യപാഠം എബ്രായവാക്യത്തിന്റെ ഘടനയും ആശയവും വിശ്വസ്തമായി നൽകുന്നു: ദൈവത്തോടുള്ള അഭിസംബോധന, ദാസനെയും അവന്റെ ‘ഭവന’ത്തെയും സംബന്ധിച്ച അരുളപ്പാട്, അതിനെ എന്നേക്കുമായി ഉറപ്പിക്കണമെന്ന അപേക്ഷ, ഒടുവിൽ ‘അരുളിച്ചെയ്തതുപോലെ ചെയ്യണമേ’ എന്ന ആവർത്തനം എന്നിവ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു. എന്നാൽ അടിക്കുറിപ്പിലെ ‘രാജഭവനം’ ഭൗതിക രാജകൊട്ടാരം/വസതിയെന്ന അർത്ഥം സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിലെ בֵּיתוֹ പ്രധാനമായി രാജകുടുംബം/രാജവംശം എന്ന ആശയമാണ്.'
  naturalness: ‘യാഹ്‌വേ ദൈവമേ,’ ‘അങ്ങയുടെ ദാസൻ,’ ‘ഉറപ്പിക്കണമേ,’ ‘ചെയ്യണമേ’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പ്രാർഥനോചിതവുമായ പ്രയോഗങ്ങളാണ്. ‘ഭവനം’ അല്പം ഔപചാരികമാണെങ്കിലും അധ്യായത്തിലെ മുഖ്യമായ ‘house’ പദചിത്രം നിലനിർത്താൻ യോജിക്കുന്നു.
