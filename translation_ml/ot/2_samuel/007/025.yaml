id: 2SA.7.25
reference: 2 Samuel 7:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ הָקֵ֖ם עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
translation:
  language: ml
  text: ഇപ്പോൾ, യാഹ്‌വേ ദൈവമേ, അങ്ങയുടെ ദാസനെക്കുറിച്ചും അവന്റെ ഭവനത്തെക്കുറിച്ചും[b] അങ്ങ് അരുളിച്ചെയ്ത വചനം[a] എന്നേക്കുമായി ഉറപ്പിക്കണമേ; അങ്ങ് അരുളിച്ചെയ്തതുപോലെ ചെയ്യണമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങ് അരുളിച്ചെയ്ത വാഗ്ദാനം.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “അവന്റെ ഭവനം” എന്നത് വെറും പാർപ്പിടത്തെയോ വീട്ടുകാരെയോ അല്ല, അവന്റെ രാജകുടുംബത്തെയോ രാജവംശത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവമേ
  rationale: യാഹ്‌വേ എന്ന നാമത്തിനു പിന്നാലെയുള്ള നേരിട്ടുള്ള അഭിസംബോധനയായതിനാൽ സ്വാഭാവികമായ മലയാള സംബോധനാരൂപം ഉപയോഗിച്ചു.
- source_word: הַדָּבָר
  choice: വചനം
  rationale: ദൈവം പറഞ്ഞ കാര്യത്തെയോ വാഗ്ദാനത്തെയോ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തിലെ ‘വചനം’ എന്ന വിശാലമായ പ്രയോഗം നിലനിർത്തുന്നു; ‘വാഗ്ദാനം’ എന്ന സന്ദർഭോചിത അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: דִּבַּרְתָּ
  choice: അങ്ങ് അരുളിച്ചെയ്ത
  rationale: ദൈവത്തിന്റെ മുൻപ്രസ്താവനയെ മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘വാഗ്ദാനം ചെയ്തു’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: עַל
  choice: കുറിച്ച്
  rationale: ദൈവം അരുളിച്ചെയ്തതിന്റെ വിഷയത്തെ വ്യക്തമാക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ദൈവസന്നിധിയിലെ വിനീതസേവനത്തെ സൂചിപ്പിക്കുന്ന രാജകീയ പ്രാർഥനാഭാഷയ്ക്ക് ‘ദാസൻ’ യോജിക്കുന്നു.
- source_word: בֵּיתוֹ
  choice: അവന്റെ ഭവനം
  rationale: ഈ അധ്യായത്തിലെ ‘വീട്/ഭവനം’ എന്ന ഉടമ്പടിപരമായ പദചിത്രം നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്ന രാജവംശാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָקֵם
  choice: ഉറപ്പിക്കണമേ
  rationale: ഹിഫീൽ ആജ്ഞാരൂപം ദൈവം തന്റെ അരുളപ്പാടിനെ സ്ഥിരമായി നിലനിൽക്കുമാറാക്കണമെന്ന അപേക്ഷയാണ്; ‘വചനം’ എന്ന കർമത്തോടൊപ്പം ‘ഉറപ്പിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കുമായി
  rationale: നിലനിൽക്കുന്ന ശാശ്വതതയെ ആധുനികവും വ്യക്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וַעֲשֵׂה
  choice: ചെയ്യണമേ
  rationale: മൂലത്തിലെ സംക്ഷിപ്തവും വിശാലവുമായ ക്രിയ നിലനിർത്തുന്നു; ‘നിറവേറ്റണമേ’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: അങ്ങ് അരുളിച്ചെയ്തതുപോലെ
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ ‘അരുളിച്ചെയ്ത’ എന്ന പദത്തിന്റെ ആവർത്തനം നിലനിർത്തി, ദൈവം സ്വന്തം അരുളപ്പാടനുസരിച്ച് പ്രവർത്തിക്കണമെന്ന അപേക്ഷ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി പശ്ചാത്തലത്തിൽ הַדָּבָר എന്നത് ‘വചനം’ എന്നോ ‘വാഗ്ദാനം’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: വചനം
  alternative: വാഗ്ദാനം
  rationale: സന്ദർഭത്തിൽ വാഗ്ദാനാർഥം ശക്തമാണെങ്കിലും, എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘അങ്ങ് അരുളിച്ചെയ്ത വചനം’ എന്നാണ്. അതിനാൽ ഉടമ്പടിപരമായ അർത്ഥം സന്ദർഭത്തിൽനിന്ന് ഉയർന്നുവരാൻ അനുവദിച്ച് വിശാലമായ പദം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
- issue: בֵּיתוֹ എന്നത് ‘രാജവംശം’ എന്ന് തുറന്നുപറയണമോ, ‘ഭവനം’ എന്ന പദചിത്രം നിലനിർത്തണമോ
  choice: അവന്റെ ഭവനം
  alternative: അവന്റെ രാജവംശം
  rationale: 2 ശമൂവേൽ 7-ൽ രാജവംശാർഥം നിർണായകമാണെങ്കിലും, ‘ഭവനം’ എന്ന പദമാണ് അധ്യായത്തിലെ പ്രധാന ഉടമ്പടിപരമായ പദചിത്രം. അതിനാൽ അത് മുഖ്യപാഠത്തിൽ നിലനിർത്തി അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പ്രാർഥനോചിതവുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും അപേക്ഷകൾക്ക് ‘-ണമേ’ എന്നും ഉപയോഗിച്ചു. ദൈവനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു. മൂലത്തിലെ ‘അരുളിച്ചെയ്ത’ എന്ന ആശയപരമായ ആവർത്തനം നിലനിർത്തി.
