  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
translation:
  language: ml
  text: '“ആകയാൽ ഇപ്പോൾ, നീ എന്റെ ദാസനായ ദാവീദിനോടു പറയേണ്ടത് ഇതാണ്: സൈന്യങ്ങളുടെ യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: മേച്ചിൽപ്പുറത്തുനിന്ന്[a], ആട്ടിൻകൂട്ടത്തിന്റെ പിന്നാലെ നടന്നിരുന്നതിൽനിന്ന്, എന്റെ ജനത്തിന്മേൽ, ഇസ്രായേലിന്മേൽ, ഭരണാധികാരിയാകാൻ[b] ഞാൻ നിന്നെ എടുത്തു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആട്ടിൻതൊഴുത്തിൽനിന്ന്.” ഹീബ്രു പദം മേച്ചിൽസ്ഥലത്തെയോ ആട്ടിൻകൂട്ടങ്ങൾ പാർക്കുന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ഭരണാധികാരി” എന്നതിന് “നേതാവ്” അല്ലെങ്കിൽ “പ്രഭു” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദം ഭരിക്കാൻ നിയമിക്കപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്നു; അത് നിർബന്ധമായും “രാജാവ്” എന്ന പ്രത്യേക പദവിയല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ആകയാൽ ഇപ്പോൾ
  rationale: കാലസൂചനയും സന്ദേശത്തിലെ നിഗമനാത്മകമായ മാറ്റവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: לְעַבְדִּי לְדָוִד
  choice: എന്റെ ദാസനായ ദാവീദിനോട്
  rationale: עבד ഇവിടെ യഹോവയോടുള്ള ദാവീദിന്റെ ആദരണീയമായ സേവകബന്ധത്തെ സൂചിപ്പിക്കുന്നു; അടിമത്തത്തെ മുൻനിർത്തുന്നില്ല.
- source_word: יְהוָה צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ യഹോവ
  rationale: ദൈവനാമം നേരിട്ട് നിലനിർത്തുകയും צבאות എന്ന ബഹുവചനത്തിന്റെ വിശാലമായ സൈനിക അർഥം അനാവശ്യമായി പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מִן הַנָּוֶה
  choice: മേച്ചിൽപ്പുറത്തുനിന്ന്
  rationale: ആട്ടിൻകൂട്ടങ്ങൾ മേയുകയോ പാർക്കുകയോ ചെയ്യുന്ന സ്ഥലമെന്ന മുഖ്യസന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵאַחַר הַצֹּאן
  choice: ആട്ടിൻകൂട്ടത്തെ പിന്തുടർന്നിരുന്ന
  rationale: അക്ഷരാർഥമായ ‘കൂട്ടത്തിന്റെ പിന്നാലെ’ എന്ന ഇടയചിത്രം നിലനിർത്തി മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: נָגִיד
  choice: ഭരണാധികാരി
  rationale: ഭരിക്കാൻ നിയമിക്കപ്പെട്ട നേതാവിനെ സൂചിപ്പിക്കുന്നു; ‘രാജാവ്’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ പദവി മൂലപാഠത്തിൽ ഇല്ല.
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  choice: എന്റെ ജനത്തിന്മേൽ, ഇസ്രായേലിന്മേൽ
  rationale: עַל എന്ന പദത്തിന്റെ ആവർത്തനവും അതിലൂടെ ലഭിക്കുന്ന ഊന്നലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ദാവീദിനെക്കുറിച്ചുള്ള עבד
  choice: ദാസൻ
  alternative: അടിമ
  rationale: ഇവിടെ രാജകീയ-ഉടമ്പടി സന്ദർഭത്തിലെ ദൈവസേവകനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദാസൻ’ യോജിക്കുന്നു.
- issue: נָגִיד എന്ന ഭരണപദവി
  choice: ഭരണാധികാരി
  alternative: നേതാവ് / പ്രഭു / രാജാവ്
  rationale: ദൈവത്താൽ നിയമിക്കപ്പെട്ട ഭരണനേതൃത്വം വ്യക്തമാക്കുന്നു; എന്നാൽ ‘രാജാവ്’ എന്നു പറഞ്ഞ് ഹീബ്രു പദത്തേക്കാൾ നിർദിഷ്ടമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദൈവിക സന്ദേശസൂത്രത്തിന് ‘ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു’ എന്ന തിരുവെഴുത്തുശൈലി നിലനിർത്തി; അവസാനത്തെ ആവർത്തിച്ച עַל മലയാളത്തിലും സംരക്ഷിച്ചു.
