  to: '“ആകയാൽ ഇപ്പോൾ, നീ എന്റെ ദാസനായ ദാവീദിനോടു പറയേണ്ടത് ഇതാണ്: സൈന്യങ്ങളുടെ യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: മേച്ചിൽപ്പുറത്തുനിന്ന്[a], ആട്ടിൻകൂട്ടത്തിന്റെ പിന്നാലെ നടന്നിരുന്നതിൽനിന്ന്, എന്റെ ജനത്തിന്മേൽ, ഇസ്രായേലിന്മേൽ, ഭരണാധികാരിയാകാൻ[b] ഞാൻ നിന്നെ എടുത്തു.”'
