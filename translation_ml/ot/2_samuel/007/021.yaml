id: 2SA.7.21
reference: 2 Samuel 7:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/עֲב֤וּר דְּבָֽרְ/ךָ֙ וּֽ/כְ/לִבְּ/ךָ֔ עָשִׂ֕יתָ אֵ֥ת כָּל הַ/גְּדוּלָּ֖ה הַ/זֹּ֑את לְ/הוֹדִ֖יעַ אֶת עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
translation:
  language: ml
  text: നിന്റെ വചനം നിമിത്തവും[a] നിന്റെ ഹൃദയപ്രകാരവും[b] നീ ഈ മഹത്വമെല്ലാം[c] ചെയ്തിരിക്കുന്നു—നിന്റെ ദാസനെ അത് അറിയിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ വചനത്തിനുവേണ്ടി’ എന്നോ, സന്ദർഭത്തിൽ ‘നിന്റെ വാഗ്ദാനം നിമിത്തം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘നിന്റെ ഹൃദയപ്രകാരം’; അതായത്, നിന്റെ സ്വന്തം ഉദ്ദേശ്യത്തിനോ ഇഷ്ടത്തിനോ അനുസരിച്ച്.
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായത്തിൽ ഏകവചനം: ‘ഈ മഹത്വമെല്ലാം.’ ചില പരിഭാഷകൾ ‘ഈ മഹത്തായ കാര്യങ്ങളെല്ലാം’ എന്നു നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר דְּבָרְךָ
  choice: നിന്റെ വചനം നിമിത്തം
  rationale: בַּעֲבוּר കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. דָּבָר എന്നതിന് ‘വചനം,’ ‘കാര്യം,’ ‘വാഗ്ദാനം’ എന്നീ അർഥസാധ്യതകളുണ്ട്; ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ വാഗ്ദാനം ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെങ്കിലും ‘വചനം’ എന്നത് മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וּכְלִבְּךָ
  choice: നിന്റെ ഹൃദയപ്രകാരം
  rationale: לֵב ഇവിടെ ഉള്ളിലെ ഉദ്ദേശ്യം, ഇച്ഛ, മനസ്സ് എന്നിവയെ സൂചിപ്പിക്കുന്നു. ‘ഹൃദയം’ എന്ന എബ്രായ രൂപകം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തി.
- source_word: עָשִׂיתָ
  choice: നീ ... ചെയ്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിക്കും ഇപ്പോഴത്തെ പ്രസക്തിക്കും യോജിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗമാണിത്.
- source_word: אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: ഈ മഹത്വമെല്ലാം
  rationale: എബ്രായത്തിൽ ഏകവചനത്തിലുള്ള അമൂർത്തനാമമായ ‘മഹത്വം’ ആണ്. ‘ഈ മഹത്തായ കാര്യങ്ങളെല്ലാം’ എന്നു ബഹുവചനമാക്കാതെ ദൈവത്തിന്റെ പ്രവൃത്തിയെ ഏകീകൃതമായ മഹത്വപ്രകടനമായി അവതരിപ്പിക്കുന്ന രൂപം സംരക്ഷിച്ചു.
- source_word: לְהוֹדִיעַ אֶת עַבְדֶּךָ
  choice: നിന്റെ ദാസനെ അത് അറിയിക്കേണ്ടതിന്
  rationale: ידע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘അറിയാൻ ഇടയാക്കുക/അറിയിക്കുക’ എന്ന കാരണാർഥം നിലനിർത്തുന്നു. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി മുൻപറഞ്ഞ മഹത്വത്തെ സൂചിപ്പിക്കുന്ന ‘അത്’ ചേർത്തിരിക്കുന്നു.
- source_word: עַבְדֶּךָ
  choice: നിന്റെ ദാസൻ
  rationale: രാജകീയ പ്രാർഥനയിൽ ദാവീദ് ദൈവസന്നിധിയിൽ തന്നെ താഴ്ത്തി പറയുന്ന സന്ദർഭത്തിന് ‘ദാസൻ’ സ്വാഭാവികവും സ്ഥാപിതവുമായ പദമാണ്.
theological_decisions:
- issue: ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ ‘നിന്റെ വചനം’ എന്നതിന്റെ സൂചന
  choice: നിന്റെ വചനം
  alternative: നിന്റെ വാഗ്ദാനം; നീ അരുളിച്ചെയ്തത്
  rationale: സന്ദർഭം ദൈവം ദാവീദിനോടു പറഞ്ഞ ഉടമ്പടിവചനമാണെങ്കിലും, എബ്രായം നേരിട്ട് ‘വചനം’ എന്നാണ് പറയുന്നത്. ‘വാഗ്ദാനം’ എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കാതെ സന്ദർഭത്തിൽനിന്ന് ആ അർഥം ഗ്രഹിക്കാൻ കഴിയുന്ന വിധം വിശാലത നിലനിർത്തി.
- issue: ദൈവത്തെക്കുറിച്ചുള്ള ‘നിന്റെ ഹൃദയപ്രകാരം’ എന്ന മാനവരൂപക ഭാഷ
  choice: രൂപകം അതേപടി നിലനിർത്തി
  alternative: നിന്റെ ഇഷ്ടപ്രകാരം; നിന്റെ ഉദ്ദേശ്യപ്രകാരം
  rationale: ദൈവത്തിന്റെ ഉള്ളിലെ ഇച്ഛയെയും ഉദ്ദേശ്യത്തെയും എബ്രായം ‘ഹൃദയം’ എന്ന രൂപകത്തിലൂടെയാണ് അവതരിപ്പിക്കുന്നത്. അതിനെ അമൂർത്തമായ ദൈവശാസ്ത്രഭാഷയാക്കി മാറ്റിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു. ‘വചനം,’ ‘ഹൃദയം,’ ‘മഹത്വം’ എന്നീ മൂലരൂപങ്ങൾ അവയുടെ സന്ദർഭപരമായ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്ന വിധം സംരക്ഷിച്ചു.
