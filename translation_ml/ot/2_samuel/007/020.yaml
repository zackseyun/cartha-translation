  yaml_path: translation/ot/2_samuel/007/020.yaml
  text: And what more can David say to you? You know your servant[a], Lord GOD.
translation:
  language: ml
  text: ഇനി ദാവീദിന് അങ്ങയോടു കൂടുതലായി എന്തു പറയാൻ കഴിയും? കർത്താവായ യഹോവേ[a], അങ്ങ് അങ്ങയുടെ ദാസനെ അറിയുന്നുവല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘കർത്താവായ യഹോവ’ (אֲדֹנָי יְהוִה).'
    reason: മൂലപാഠത്തിലെ പൊതുവായ അധികാരപദവിയും ദൈവത്തിന്റെ പ്രത്യേക നാമവും ചേർന്ന സംയുക്ത അഭിധാനം വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וּמַה יוֹסִיף דָּוִד עוֹד לְדַבֵּר אֵלֶיךָ
  choice: ഇനി ദാവീദ് അങ്ങയോട് കൂടുതലായി എന്തു പറയാനാണ്?
  rationale: יסף + עוד + לדבר എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഇനിയും സംസാരിക്കാൻ കൂട്ടിച്ചേർക്കുക’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ കൂടുതലായി എന്തു പറയാനാകും എന്ന അലങ്കാരചോദ്യമാണ്. ‘ഇനി’ മുൻപ്രാർത്ഥനയോടുള്ള തുടർച്ചയും עוד എന്നതിന്റെ ഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְאַתָּה יָדַעְתָּ
  choice: അങ്ങ് ... അറിയുന്നുവല്ലോ
  rationale: രണ്ടാംപുരുഷ സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു. പൂർത്തിക്രിയ ഇവിടെ നിലവിലുള്ള ഉറച്ച അറിവിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ വർത്തമാനകാലം ഉപയോഗിച്ചു; ‘-വല്ലോ’ ദാവീദിന്റെ ഉറപ്പും അലങ്കാരപരമായ ഭാവവും പ്രകടമാക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനെ
  rationale: ദൈവത്തോടുള്ള പ്രാർത്ഥനയിൽ ദാവീദ് സ്വയം വിനയത്തോടെ വിശേഷിപ്പിക്കുന്ന പദമാണിത്. ഇവിടെ ‘അടിമ’ എന്നതിനെക്കാൾ ‘ദാസൻ’ സന്ദർഭോചിതവും മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവുമാണ്.
- source_word: אֲדֹנָי יְהוִה
  choice: കർത്താവായ യഹോവേ
  rationale: אֲדֹנָי എന്ന അധികാരപദവിയെയും יהוה എന്ന ദൈവനാമത്തെയും വേർതിരിച്ചു നിലനിർത്തുന്നു. നേരിട്ടുള്ള അഭിസംബോധനയായതിനാൽ ‘യഹോവേ’ എന്ന സംബോധനരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: אֲדֹנָי יְהוִה എന്ന സംയുക്ത ദൈവാഭിധാനത്തിന്റെ പരിഭാഷ
  choice: കർത്താവായ യഹോവേ
  alternative: കർത്താവായ ദൈവമേ; സർവാധികാരിയായ കർത്താവേ
  rationale: മൂലപാഠത്തിൽ പൊതുവായ പദവിയായ אֲדֹנָיയും ദൈവത്തിന്റെ പ്രത്യേക നാമമായ יהוהയും ഒരുമിച്ചുണ്ട്. ‘യഹോവ’ എന്നു നൽകുന്നത് ഈ വ്യത്യാസം മറച്ചുകളയാതെ സംരക്ഷിക്കുന്നു; ‘കർത്താവായ’ എന്നു ചേർക്കുന്നത് אֲדֹנָיയുടെ അർഥവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ പ്രാർത്ഥനാഭാഷയാണ് ഉപയോഗിച്ചത്. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും ദാവീദിന്റെ വിനയപദവിക്ക് ‘ദാസൻ’ എന്നും നൽകി. അലങ്കാരചോദ്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി കർശനമായ പദാനുപദക്രമത്തിനു പകരം മലയാള വാക്യക്രമം സ്വീകരിച്ചു.
