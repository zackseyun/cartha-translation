source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל נָתָ֣ן הַ/נָּבִ֔יא רְאֵ֣ה נָ֔א אָנֹכִ֥י יוֹשֵׁ֖ב בְּ/בֵ֣ית אֲרָזִ֑ים וַֽ/אֲרוֹן֙ הָֽ/אֱלֹהִ֔ים יֹשֵׁ֖ב בְּ/ת֥וֹךְ הַ/יְרִיעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
translation:
  language: ml
  text: 'രാജാവ് നാഥാൻ പ്രവാചകനോടു പറഞ്ഞു: “നോക്കൂ, ഞാൻ ദേവദാരുകൊണ്ടുള്ള ഒരു ഭവനത്തിൽ വസിക്കുന്നു; എന്നാൽ ദൈവത്തിന്റെ പെട്ടകം കൂടാരത്തുണികൾക്കുള്ളിൽ വസിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു കൂടാരത്തുണിക്കുള്ളിൽ”; എബ്രായപദം കൂടാരത്തിന്റെ തുണിയെയോ തൂക്കിയ തിരശ്ശീലയെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് സമാഗമകൂടാരത്തിന്റെ മൂടുതുണികളെ ഓർമിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിന്റെ തുടർച്ച മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപം മതിയാകുന്നതിനാൽ നിർബന്ധമായി ‘അപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: എബ്രായത്തിൽ വ്യക്തമായ പദവി മാത്രമാണുള്ളത്; ‘ദാവീദ്’ എന്ന പേര് പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: נָתָן הַנָּבִיא
  choice: നാഥാൻ പ്രവാചകൻ
  rationale: വ്യക്തിനാമത്തോടു ചേർന്ന വിശേഷണപദവിയെ ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: רְאֵה נָא
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞയും נָא എന്ന മൃദൂകരണകണികയും ആധുനിക മലയാളത്തിലെ ആദരസൂചകമായ ‘നോക്കൂ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אָנֹכִי יוֹשֵׁב
  choice: ഞാൻ ... വസിക്കുന്നു
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ നേരിയ ഊന്നൽ ‘ഞാൻ’ നിലനിർത്തുന്നു; ישב ഇവിടെ ഇരിക്കുക എന്നതിലുപരി താമസിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: בְּבֵית אֲרָזִים
  choice: ദേവദാരുകൊണ്ടുള്ള ഒരു ഭവനത്തിൽ
  rationale: നിർമാണവസ്തുവായ ദേവദാരുവിനെ സൂചിപ്പിക്കുന്ന ഘടന; ‘ഭവനം’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമാണ്.
- source_word: וַאֲרוֹן הָאֱלֹהִים
  choice: എന്നാൽ ദൈവത്തിന്റെ പെട്ടകം
  rationale: വാവ് ഇവിടെ രാജാവിന്റെ ഭവനവും പെട്ടകത്തിന്റെ പാർപ്പിടവും തമ്മിലുള്ള വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു; അതിനാൽ ‘എന്നാൽ’ യോജിക്കുന്നു.
- source_word: בְּתוֹךְ הַיְרִיעָה
  choice: കൂടാരത്തുണികൾക്കുള്ളിൽ
  rationale: יְרִיעָה കൂടാരത്തിന്റെ തുണി, തിരശ്ശീല, മൂടുപടം എന്നിവയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ കൂടാരബന്ധം വ്യക്തമാക്കിക്കൊണ്ട്, ഏകവചനത്തിന്റെ കൂട്ടാർഥം സ്വാഭാവിക മലയാള ബഹുവചനത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പെട്ടകത്തിന്റെ പാർപ്പിടത്തെ എങ്ങനെ വിവരിക്കണം
  choice: ‘കൂടാരത്തുണികൾക്കുള്ളിൽ’ എന്ന് വസ്തുനിഷ്ഠമായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘ഒരു കൂടാരത്തിൽ’ അല്ലെങ്കിൽ ‘ഒരു കൂടാരത്തുണിക്കുള്ളിൽ’
  rationale: എബ്രായം പൊതുവായി ‘കൂടാരം’ എന്നു പറയാതെ יְרִיעָה എന്ന തുണി/തിരശ്ശീലപദം ഉപയോഗിക്കുന്നു. അതിന്റെ താൽക്കാലിക കൂടാരസദൃശ ചിത്രം നിലനിർത്തുന്നു; പിന്നീടുള്ള ദൈവാലയശാസ്ത്രം പാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിന്റെ ഭവനവും പെട്ടകത്തിന്റെ തുണികൊണ്ടുള്ള പാർപ്പിടവും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തിയിരിക്കുന്നു.
