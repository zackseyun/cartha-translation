  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔ד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִ֣י אָנֹכִ֞י אֲדֹנָ֤/י יְהוִה֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് രാജാവ് അകത്തു ചെന്ന് യഹോവയുടെ സന്നിധിയിൽ ഇരുന്ന് പറഞ്ഞു: “കർത്താവായ യഹോവേ, ഞാൻ ആരാണ്? എന്റെ വീട്[a] എന്താണ്? അങ്ങ് എന്നെ ഇത്രത്തോളം കൊണ്ടുവന്നല്ലോ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്റെ കുടുംബം/കുടുംബവംശം.” ഇവിടെ “വീട്” എന്നതിന് ദാവീദിന്റെ കുടുംബത്തെയും വളർന്നുവരുന്ന രാജവംശത്തെയും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർത്ഥമുണ്ടാകാം; ഈ അധ്യായത്തിൽ ആവർത്തിക്കുന്ന “വീട്” എന്ന പദപ്രതിധ്വനിയും ഇതിലൂടെ നിലനിൽക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അകത്തു ചെന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ ദൃശ്യമായ ചലനം നിലനിർത്തുന്നു; സ്ഥലം ഏതെന്ന് മൂലപാഠം പറയാത്തതിനാൽ അത് വ്യക്തമാക്കാതെ വിടുന്നു.
- source_word: וַיֵּשֶׁב לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ ഇരുന്ന്
  rationale: ישב എന്നതിന്റെ ശാരീരിക അർത്ഥമായ ‘ഇരിക്കുക’യും לִפְנֵי എന്നതിന്റെ സാന്നിധ്യാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲדֹנָי יְהוִה
  choice: കർത്താവായ യഹോവേ
  rationale: അദോനായ് എന്ന അധികാരപദവും യഹോവ എന്ന ദൈവനാമവും വേർതിരിച്ചറിയാവുന്ന വിധത്തിൽ സംബോധനാരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּמִי בֵיתִי
  choice: എന്റെ ഭവനം എന്താണ്?
  rationale: ഹീബ്രുവിലെ ‘ആർ’ മലയാളത്തിൽ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘എന്ത്’ ആയി നൽകുന്നു; ‘ഭവനം’ കുടുംബം/കുടുംബവംശം എന്ന വിപുലമായ സൂചനയും അധ്യായത്തിലെ പദപ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: הֲבִיאֹתַנִי עַד הֲלֹם
  choice: അങ്ങ് എന്നെ ഇത്രത്തോളം എത്തിച്ചല്ലോ
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരണാർഥമായ ‘എത്തിക്കുക’യും ദാവീദിന്റെ വിസ്മയവും വിനയവും പ്രകടമാക്കുന്ന עַד הֲלֹם എന്ന പ്രയോഗവും സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം വ്യക്തമായി നിലനിർത്തുന്നു; אֲדֹנָי יְהוִה വന്നിടത്ത് ‘കർത്താവായ യഹോവ’ എന്നു നൽകി രണ്ട് ഘടകങ്ങളും സംരക്ഷിക്കുന്നു.
- issue: ‘എന്റെ ഭവനം’ എന്നതിന്റെ അർത്ഥവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘ഭവനം’ നിലനിർത്തുക
  alternative: എന്റെ കുടുംബം / എന്റെ കുടുംബവംശം
  rationale: 2 ശമൂവേൽ 7-ലെ ‘ഭവനം’ എന്ന കേന്ദ്ര പദപ്രതിധ്വനി നിലനിർത്തുകയും കുടുംബം, ഗൃഹം, ഉയർന്നുവരുന്ന രാജവംശം എന്നീ അർത്ഥസൂചനകൾ ഒതുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: അവസാന വാക്യത്തിന്റെ ഭാവം
  choice: വിസ്മയസൂചകമായി ‘എന്നിട്ടും ... എത്തിച്ചല്ലോ!’
  alternative: ‘അങ്ങ് എന്നെ ഇത്രത്തോളം എത്തിച്ചതിന്?’ എന്ന നേരിട്ടുള്ള ഘടന
  rationale: כִּי ഘടിപ്പിക്കുന്ന ആശ്ചര്യവും വിനയവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ദൈവകൃപയുടെ കാരണം വിശദീകരിക്കുന്നതായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദൈവത്തോടുള്ള സംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. അധ്യായത്തിലെ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ ‘ഭവനം’ പദപ്രതിധ്വനി സംരക്ഷിച്ചു.
