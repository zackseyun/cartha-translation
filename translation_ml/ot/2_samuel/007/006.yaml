source:
  edition: WLC
  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת לְ֠/מִ/יּוֹם הַעֲלֹתִ֞/י אֶת בְּנֵ֤י יִשְׂרָאֵל֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶֽהְיֶה֙ מִתְהַלֵּ֔ךְ בְּ/אֹ֖הֶל וּ/בְ/מִשְׁכָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
translation:
  language: ml
  text: കാരണം, ഞാൻ ഇസ്രായേൽമക്കളെ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്ന ദിവസംമുതൽ ഇന്നുവരെ ഒരു ഭവനത്തിൽ വസിച്ചിട്ടില്ല; മറിച്ച്, ഒരു കൂടാരത്തിലും ഒരു തിരുനിവാസത്തിലും സഞ്ചരിച്ചുകൊണ്ടിരിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇസ്രായേൽമക്കൾ” എന്നതിന് “ഇസ്രായേല്യർ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “കൊണ്ടുവന്ന” എന്നതിന് അക്ഷരാർഥത്തിൽ “മേലേക്കു കൊണ്ടുവന്ന”; അവസാനഭാഗം “ഒരു കൂടാരത്തിലും ഒരു നിവാസസ്ഥലത്തിലും സഞ്ചരിച്ചുകൊണ്ടിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: വസിച്ചിട്ടില്ല
  rationale: ישׁב എന്നതിന്റെ ‘വസിക്കുക’ എന്ന താമസാർഥം ഭവനം എന്ന സന്ദർഭത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായി നൽകുന്നു; ഭൂതകാലംമുതൽ പ്രസ്തുത ദിവസംവരെ നീളുന്ന അവസ്ഥയും നിലനിർത്തുന്നു.
- source_word: בְּבַיִת
  choice: ഒരു ഭവനത്തിൽ
  rationale: ഹീബ്രുവിൽ പദം അനിശ്ചിതമാണ്; ‘ക്ഷേത്രം’ എന്നു വ്യാഖ്യാനിച്ച് ചേർക്കാതെ ‘ഭവനം’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു.
- source_word: לְמִיּוֹם הַעֲלֹתִי
  choice: കൊണ്ടുവന്ന ദിവസംമുതൽ
  rationale: കാലത്തിന്റെ ആരംഭബിന്ദുവും ഹിഫീൽ രൂപത്തിലുള്ള ദൈവിക പ്രവർത്തനവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘മേലേക്കു കൊണ്ടുവന്ന’ എന്ന ദിശാസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ
  rationale: പരമ്പരാഗതമായ പദഘടനയും ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗവും ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: പുറപ്പാടിന്റെ സ്ഥലാരംഭം വ്യക്തമായി നൽകുന്നു; മലയാളത്തിൽ ‘കൊണ്ടുവരുക’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമാണ്.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: തുടർന്നുനിൽക്കുന്ന കാലപരിധിയെ ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: וָאֶהְיֶה מִתְהַלֵּךְ
  choice: മറിച്ച് … സഞ്ചരിച്ചുകൊണ്ടിരുന്നു
  rationale: സ്ഥിരഭവനത്തിൽ വസിക്കാതിരുന്നതും ചലിക്കുന്ന സാന്നിധ്യവും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം ‘മറിച്ച്’ വ്യക്തമാക്കുന്നു; മിത്ഹല്ലേഖ് രൂപത്തിന്റെ തുടർച്ചയായ സഞ്ചാരഭാവം സംരക്ഷിക്കുന്നു.
- source_word: בְּאֹהֶל
  choice: കൂടാരത്തിൽ
  rationale: אֹהֶל എന്നതിന്റെ അടിസ്ഥാനാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: וּבְמִשְׁכָּן
  choice: തിരുനിവാസത്തിൽ
  rationale: מִשְׁכָּן എന്ന ‘വാസസ്ഥലം/നിവാസം’ എന്ന പദാർഥവും വിശുദ്ധമന്ദിരസന്ദർഭവും ‘തിരുനിവാസം’ സൂചിപ്പിക്കുന്നു; ‘സമാഗമനകൂടാരം’ എന്നു രണ്ടുപദങ്ങളെയും ഒറ്റ ആശയമാക്കുന്നില്ല.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക ജനനാമത്തിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ‘ഇസ്രായേൽമക്കൾ’ ഹീബ്രു ഘടനയുമായി അടുത്തുനിൽക്കുകയും മുഴുവൻ ഉടമ്പടിജനത്തെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമായിരിക്കുകയും ചെയ്യുന്നു; ‘പുത്രന്മാർ’ ഇവിടെ പുരുഷന്മാർക്ക് മാത്രമെന്ന അനാവശ്യ ധാരണ സൃഷ്ടിക്കാം.
- issue: מִשְׁכָּן എന്ന ആരാധനാസംബന്ധിയായ പദം
  choice: തിരുനിവാസം
  alternative: നിവാസസ്ഥലം / സമാഗമനകൂടാരം
  rationale: സ്ഥിരക്ഷേത്രത്തിനു മുമ്പുള്ള ദൈവത്തിന്റെ വിശുദ്ധവും ചലനക്ഷമവുമായ നിവാസത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ പദത്തിന്റെ അടിസ്ഥാനമായ ‘നിവാസം’ എന്ന ആശയം മറയ്ക്കുന്നില്ല.
- issue: אֹהֶל וּבְמִשְׁכָּן എന്ന ഇരട്ടപ്രയോഗം
  choice: കൂടാരത്തിലും തിരുനിവാസത്തിലും
  alternative: കൂടാരമായ തിരുനിവാസത്തിൽ
  rationale: ഹീബ്രുവിലെ രണ്ടു നാമങ്ങളും അവയ്ക്കിടയിലെ സംയോജനവും നിലനിർത്തി, അവയെ വ്യാഖ്യാനപരമായി ഒറ്റ ഘടനയാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യരീതി. ‘ഭവനം’, ‘തിരുനിവാസം’ എന്നിവ ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; അതേസമയം വാക്യം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായി സൂക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
