reference: 2 Samuel 7:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כְּ/כֹל֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וּ/כְ/כֹ֖ל הַ/חִזָּי֣וֹן הַ/זֶּ֑ה כֵּ֛ן דִּבֶּ֥ר נָתָ֖ן אֶל דָּוִֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/017.yaml
  text: According to all these words and according to all this vision[a], so Nathan spoke to David.
translation:
  language: ml
  text: ഈ വചനങ്ങൾക്കെല്ലാം അനുസരിച്ചും ഈ ദർശനം മുഴുവനും അനുസരിച്ചും നാഥാൻ ദാവീദിനോടു സംസാരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל
  choice: എല്ലാം അനുസരിച്ചും
  rationale: כְ സൂചിപ്പിക്കുന്ന ‘അനുസരിച്ച്/ഒത്തവണ്ണം’ എന്ന ബന്ധവും כֹל എന്നതിന്റെ സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വചനങ്ങൾ
  rationale: ഇവിടെ നാഥാൻ അറിയിക്കുന്ന ദൈവിക സന്ദേശത്തിന്റെ വാചിക ഉള്ളടക്കമാണ് സന്ദർഭം; അതിനാൽ ‘കാര്യങ്ങൾ’ എന്നതിനെക്കാൾ ‘വചനങ്ങൾ’ യോജിക്കുന്നു.
- source_word: וּכְכֹל
  choice: മുഴുവനും അനുസരിച്ചും
  rationale: എബ്രായത്തിലെ ആവർത്തനവും സമാന്തരഘടനയും ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: הַחִזָּיוֹן הַזֶּה
  choice: ഈ ദർശനം
  rationale: חִזָּיוֹן ദർശനരൂപത്തിൽ ലഭിക്കുന്ന പ്രവാചക വെളിപ്പാടിനെ സൂചിപ്പിക്കുന്നു; ‘ദർശനം’ അതിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: כֵּן
  choice: അങ്ങനെ
  rationale: മുൻപുള്ള രണ്ട് ‘അനുസരിച്ച്’ പ്രയോഗങ്ങളെ സംഗ്രഹിച്ച്, നാഥാൻ അതേവിധം സംസാരിച്ചുവെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: דִּבֶּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന സാധാരണ സംസാരക്രിയയെ ആഖ്യാനശൈലിയിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: נָתָן
  choice: നാഥാൻ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֶל דָּוִד
  choice: ദാവീദിനോട്
  rationale: אֶל സൂചിപ്പിക്കുന്ന വ്യക്തിയിലേക്കുള്ള സംസാരദിശ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: חִזָּיוֹן എന്ന പദത്തിലെ പ്രവാചക വെളിപ്പാടിന്റെ സ്വഭാവം
  choice: മുഖ്യപാഠത്തിൽ ‘ദർശനം’
  alternative: ‘വെളിപ്പാട്’ അല്ലെങ്കിൽ ‘പ്രവാചകദർശനം’
  rationale: എബ്രായപദം ദർശനാത്മകമായ പ്രവാചക വെളിപ്പാടിനെ സൂചിപ്പിക്കുന്നു. ‘ദർശനം’ മൂലപദത്തിന്റെ രൂപഭാവം നിലനിർത്തുന്നു; ‘വെളിപ്പാട്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ഇരട്ട ‘അനുസരിച്ച്’ ഘടനയും ‘എല്ലാം/മുഴുവനും’ എന്ന സമഗ്രതയും വായനാസൗകര്യം നഷ്ടപ്പെടാതെ നിലനിർത്തിയിരിക്കുന്നു.
