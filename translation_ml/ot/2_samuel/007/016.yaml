id: 2SA.7.16
reference: 2 Samuel 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נֶאְמַ֨ן בֵּיתְ/ךָ֧ וּ/מַֽמְלַכְתְּ/ךָ֛ עַד עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽסְאֲ/ךָ֔ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/016.yaml
  text: And your house and your kingdom shall be made sure forever before me[b][a]; your throne shall be established forever.
translation:
  language: ml
  text: നിന്റെ ഭവനവും[a] രാജ്യവും നിന്റെ സന്നിധിയിൽ[b] എന്നേക്കും ഉറപ്പിക്കപ്പെടും; നിന്റെ സിംഹാസനം എന്നേക്കും സ്ഥിരമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “ഭവനം” എന്നത് രാജകുടുംബത്തെ, അതായത് രാജവംശത്തെ, സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായ പാഠം: “നിന്റെ സന്നിധിയിൽ”; ചില പാഠസാക്ഷികൾ: “എന്റെ സന്നിധിയിൽ.”'
    reason: textual_variant
lexical_decisions:
- source_word: וְנֶאְמַן
  choice: ഉറപ്പിക്കപ്പെടും
  rationale: אמן എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ഉറപ്പുള്ളതാക്കപ്പെടുക, സുസ്ഥിരമാക്കപ്പെടുക എന്ന നിഷ്ക്രിയ ആശയം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ ആ നിഷ്ക്രിയ ഭാവം നിലനിർത്തുന്നു.
- source_word: בֵּיתְךָ
  choice: നിന്റെ ഭവനം
  rationale: മൂലപദത്തിന്റെ ‘വീട്/ഭവനം’ എന്ന രൂപകം നിലനിർത്തുന്നു; ഈ രാജകീയ ഉടമ്പടി-സന്ദർഭത്തിൽ അത് ദാവീദിന്റെ വംശപരമ്പരയെയും രാജവംശത്തെയും സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּמַמְלַכְתְּךָ
  choice: രാജ്യം
  rationale: രാജത്വം, രാജ്യം, രാജാധികാരമേഖല എന്നീ അർഥങ്ങളിൽ ഇവിടെ ‘രാജ്യം’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: നിലച്ചുപോകാത്ത ദൈർഘ്യം വ്യക്തമാക്കുന്ന സാധാരണ ആധുനിക മലയാളപ്രയോഗം. വാക്യത്തിലെ ആവർത്തനം ഊന്നലിനായി അതേപടി നിലനിർത്തുന്നു.
- source_word: לְפָנֶיךָ
  choice: നിന്റെ സന്നിധിയിൽ
  rationale: നൽകിയിരിക്കുന്ന എബ്രായ പാഠത്തിലെ രണ്ടാംപുരുഷ ഏകവചനമായ ‘നിന്റെ മുമ്പാകെ/സന്നിധിയിൽ’ എന്ന വായനയാണ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചത്. ‘എന്റെ സന്നിധിയിൽ’ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: כִּסְאֲךָ
  choice: നിന്റെ സിംഹാസനം
  rationale: രാജാവിന്റെ ഇരിപ്പിടത്തെയും അതിലൂടെ രാജാധികാരത്തെയും സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ നേരിട്ടുള്ള തത്തുല്യം.
- source_word: יִהְיֶה נָכוֹן
  choice: സ്ഥിരമായിരിക്കും
  rationale: നിലനിൽക്കുക, ഉറച്ചിരിക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും മുൻപത്തെ നിഷ്ക്രിയ ക്രിയയായ ‘ഉറപ്പിക്കപ്പെടും’ എന്നതിൽനിന്നുള്ള എബ്രായ പദവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: രാജവംശവാഗ്ദാനവും അതിന്റെ സാധ്യതയുള്ള മശീഹീയ പ്രാധാന്യവും
  choice: ‘ഭവനം,’ ‘രാജ്യം,’ ‘സിംഹാസനം’ എന്നീ രാജകീയ പദങ്ങൾ ചരിത്രപരവും വംശപരവുമായ അർഥസാധ്യതകളോടെ നിലനിർത്തി; മശീഹീയ പൂർത്തീകരണം പരിഭാഷയിൽ തുറന്നുപറഞ്ഞില്ല.
  alternative: ‘ഭവനം’ എന്നത് നേരിട്ട് ‘രാജവംശം’ എന്നു പരിഭാഷപ്പെടുത്തുകയോ മശീഹീയ സൂചന കൂടുതൽ വ്യക്തമാക്കുകയോ ചെയ്യുക.
  rationale: വാക്യം ആദ്യം ദാവീദിന്റെ രാജവംശത്തെക്കുറിച്ചുള്ള ഉടമ്പടി-വാഗ്ദാനമാണ്. വിശാലമായ മശീഹീയ വായനയ്ക്ക് ഇടമുണ്ടെങ്കിലും അത് മൂലപാഠത്തിന്റെ പദങ്ങളിൽ ചേർത്തുവയ്ക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: לְפָנֶיךָ എന്ന പാഠവും ‘എന്റെ സന്നിധിയിൽ’ എന്ന പാഠഭേദവും
  choice: നൽകിയ WLC പാഠപ്രകാരം ‘നിന്റെ സന്നിധിയിൽ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ദൈവിക പ്രസംഗസന്ദർഭത്തോടും ചില പാഠസാക്ഷികളോടും ചേർന്ന് ‘എന്റെ സന്നിധിയിൽ’ എന്നു വായിക്കുക.
  rationale: ലഭ്യമായ എബ്രായ സ്രോതസ്സിലെ വ്യക്തമായ രണ്ടാംപുരുഷ വായനയ്ക്ക് മുൻഗണന നൽകി; പ്രാധാന്യമുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി, അനിശ്ചിതത്വം മറച്ചുവച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭവനം’ എന്ന മൂലരൂപകം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ രാജവംശാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. സമാന്തര ഘടനയും ‘എന്നേക്കും’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചു.
