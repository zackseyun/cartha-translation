source:
  edition: WLC
  text: וּ/לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וַ/הֲנִיחֹ֥תִי לְ/ךָ֖ מִ/כָּל אֹיְבֶ֑י/ךָ וְ/הִגִּ֤יד לְ/ךָ֙ יְהוָ֔ה כִּי בַ֖יִת יַעֲשֶׂה לְּ/ךָ֥ יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
translation:
  language: ml
  text: 'എന്റെ ജനമായ ഇസ്രായേലിന്മേൽ ഞാൻ ന്യായാധിപന്മാരെ നിയമിച്ച നാൾമുതൽ. നിന്റെ സകല ശത്രുക്കളിൽനിന്നും ഞാൻ നിനക്കു സ്വസ്ഥത നൽകിയിരിക്കുന്നു. യഹ്‌വേ നിന്നോട് ഇതും പ്രഖ്യാപിക്കുന്നു: യഹ്‌വേ നിനക്കായി ഒരു ഭവനം[a] ഉണ്ടാക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിനക്കായി ഒരു ഭവനം പണിയും.’ ഇവിടെ ‘ഭവനം’ പ്രധാനമായും രാജവംശത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു; അതേസമയം യഹ്‌വേക്കായി ഒരു ഭവനം (ആലയം) പണിയണമെന്ന ദാവീദിന്റെ ആഗ്രഹവും ഇതിൽ പ്രതിധ്വനിക്കുന്നു.
    reason: בַּיִת എന്ന പദത്തിന്റെ കെട്ടിടം/രാജവംശം എന്നീ ഇരട്ടാർഥവും ‘ഉണ്ടാക്കുക/പണിയുക’ എന്ന പരിഭാഷാവികല്പവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם
  choice: നാൾമുതൽ
  rationale: മുൻവാക്യവുമായി ബന്ധപ്പെടുന്ന കാലാരംഭം സൂചിപ്പിക്കുന്നു; വാക്യഘടനയിലെ അപൂർണബന്ധം അമിതമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: צִוִּיתִי שֹׁפְטִים
  choice: ഞാൻ ന്യായാധിപന്മാരെ നിയമിച്ച
  rationale: צוה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കല്പിക്കുക’ ആണെങ്കിലും, ഇവിടെ ഇസ്രായേലിന്മേൽ ഭരണാധികാരികളായി ന്യായാധിപന്മാരെ നിയോഗിച്ചതാണ് സന്ദർഭാർഥം.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: എന്റെ ജനമായ ഇസ്രായേലിന്മേൽ
  rationale: עַל ഇവിടെ അധികാരപരിധിയെയും മേൽനോട്ടത്തെയും സൂചിപ്പിക്കുന്നു; ‘ഇന്മേൽ’ ആ ഭരണബന്ധം നിലനിർത്തുന്നു.
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  choice: നിന്റെ സകല ശത്രുക്കളിൽനിന്നും ഞാൻ നിനക്കു സ്വസ്ഥത നൽകിയിരിക്കുന്നു
  rationale: נוח എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ദൈവം ആശ്വാസവും സുരക്ഷയും നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം ‘നൽകിയിരിക്കുന്നു’ പ്രകടമാക്കുന്നു.
- source_word: וְהִגִּיד לְךָ יְהוָה
  choice: യഹ്‌വേ നിന്നോട് ഇതും പ്രഖ്യാപിക്കുന്നു
  rationale: נגד എന്ന ക്രിയയുടെ ഗൗരവമുള്ള അറിയിപ്പെന്ന ഭാവം ‘പ്രഖ്യാപിക്കുന്നു’ നൽകുന്നു; וְ എന്ന ബന്ധകത്തിന്റെ കൂട്ടിച്ചേർക്കൽഭാവം ‘ഇതും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ അടുത്തായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: כִּי בַיִת יַעֲשֶׂה לְּךָ יְהוָה
  choice: യഹ്‌വേ നിനക്കായി ഒരു ഭവനം ഉണ്ടാക്കും
  rationale: עשה എന്നതിന്റെ വിശാലമായ ‘ഉണ്ടാക്കുക’ എന്ന അർഥവും בַּיִת എന്നതിലെ കെട്ടിടം/രാജവംശം എന്നീ ഇരട്ടസൂചനകളും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയാക്കി മാറ്റാതെ ‘Yahweh’ എന്ന രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരം ചെയ്തു.
- issue: ദാവീദിനുള്ള വാഗ്ദാനത്തിലെ בַּיִת എന്ന പദത്തിന്റെ അർഥം
  choice: ഭവനം—രാജവംശസൂചന തുറന്നുവെച്ച്
  alternative: രാജവംശം; രാജകുടുംബം; ആലയം
  rationale: ദാവീദ് ദൈവത്തിനായി ഒരു ആലയം പണിയാൻ ആഗ്രഹിച്ചതും ദൈവം ദാവീദിന് ഒരു വംശപരമ്പര സ്ഥാപിക്കുമെന്നതും തമ്മിലുള്ള സാഹിത്യപരമായ പദപ്രയോഗം ‘ഭവനം’ നിലനിർത്തുന്നു; ‘രാജവംശം’ എന്നു മാത്രം പറഞ്ഞ് അർഥം മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വാക്യാരംഭത്തിലെ കാലപ്രയോഗം മുൻവാക്യത്തോടുള്ള മൂലഭാഷാ ബന്ധം പ്രതിഫലിപ്പിക്കുന്നതിനാൽ അതിനെ വ്യാഖ്യാനപരമായി പൂരിപ്പിച്ചില്ല. ‘സ്വസ്ഥത’, ‘പ്രഖ്യാപിക്കുന്നു’, ‘ഭവനം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ ഉടമ്പടിസന്ദർഭത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
