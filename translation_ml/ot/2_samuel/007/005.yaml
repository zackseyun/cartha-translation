revisions:
- from: 'നീ പോയി എന്റെ ദാസനായ ദാവീദിനോട് പറയുക: ‘യഹ്‌വ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: എനിക്കു വസിക്കേണ്ടതിന് ഒരു ആലയം പണിയുന്നത് നീയാണോ?[a]’'
  to: 'നീ പോയി എന്റെ ദാസനായ ദാവീദിനോടു പറയുക: ‘യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: എനിക്കു വസിക്കാനുള്ള ഒരു ഭവനം പണിയുന്നത് നീയാണോ?[a]’'
  rationale: The revision retains the imperative sequence, honorific designation for David, prophetic register, and emphatic rhetorical question. It replaces the interpretive “ആലയം” with “ഭവനം” to preserve the Hebrew ‘house’ and its contextual wordplay, uses “യഹ്‌വേ” for Yahweh, and adjusts the footnote so that it does not introduce an unnecessary prospective sense.
