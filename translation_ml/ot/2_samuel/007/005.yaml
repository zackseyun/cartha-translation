id: 2SA.7.5
reference: 2 Samuel 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֵ֤ךְ וְ/אָֽמַרְתָּ֙ אֶל עַבְדִּ֣/י אֶל דָּוִ֔ד כֹּ֖ה אָמַ֣ר יְהוָ֑ה הַ/אַתָּ֛ה תִּבְנֶה לִּ֥/י בַ֖יִת לְ/שִׁבְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
translation:
  language: ml
  text: 'നീ പോയി എന്റെ ദാസനായ ദാവീദിനോടു പറയുക: ‘യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: എനിക്കു വസിക്കാനുള്ള ഒരു ഭവനം പണിയുന്നത് നീയാണോ?[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്കു വസിക്കാനുള്ള ഒരു ഭവനം പണിയേണ്ടത് നീയോ?” എബ്രായത്തിലെ ചോദ്യം ‘നീ’ എന്നതിന് ഊന്നൽ നൽകുന്നതും ആലങ്കാരികവുമാണ്.
    reason: ഊന്നൽപ്രാപിച്ച എബ്രായ ചോദ്യത്തിന്റെ സാധുവായ മറ്റൊരു രൂപം രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: നീ പോയി ... പറയുക
  rationale: ആദ്യത്തെ ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള വാവ്-പെർഫെക്റ്റും ആജ്ഞാബോധത്തോടെയാണ് വരുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്ത നിർദേശം ഉപയോഗിച്ചു.
- source_word: עַבְדִּי אֶל דָּוִד
  choice: എന്റെ ദാസനായ ദാവീദിനോട്
  rationale: עבד ഇവിടെ രാജകീയ-ഉടമ്പടി സന്ദർഭത്തിലെ ബഹുമാനസൂചകമായ ‘ദാസൻ’ എന്ന അർഥത്തിലാണ്; ആവർത്തിച്ചിരിക്കുന്ന എബ്രായ മുൻപ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായി ലയിപ്പിച്ചു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകസന്ദേശത്തിന്റെ ഔപചാരിക സൂത്രവാക്യം നിലനിർത്തുകയും യഹ്‌വ എന്ന ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ നൽകുകയും ചെയ്തു.
- source_word: הַאַתָּה תִּבְנֶה
  choice: പണിയുന്നത് നീയാണോ?
  rationale: ചോദ്യകണത്തോടുകൂടിയ ഊന്നൽപ്രാപിച്ച സ്വതന്ത്ര സർവനാമത്തിന്റെ പ്രഭാവം മലയാളത്തിലെ ‘നീയാണോ’ എന്ന ഘടന സംരക്ഷിക്കുന്നു.
- source_word: בַיִת
  choice: ആലയം
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിനായുള്ള വിശുദ്ധ വാസസ്ഥലമാണ് ഉദ്ദേശ്യം. ‘ക്ഷേത്രം’ എന്ന പദത്തിന്റെ ആധുനിക മതപരമായ പരിമിതി ഒഴിവാക്കി ‘ആലയം’ തെരഞ്ഞെടുത്തു; എന്നാൽ അധ്യായത്തിലെ ‘ഭവനം/വംശം’ എന്ന പദപ്രയോഗബന്ധം മലയാളത്തിൽ പൂർണമായി നിലനിർത്താനാവില്ല.
- source_word: לְשִׁבְתִּי
  choice: എനിക്കു വസിക്കേണ്ടതിന്
  rationale: ישב എന്ന ധാതുവിന്റെ ഇൻഫിനിറ്റീവ് കൺസ്ട്രക്റ്റും ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയായി മാറ്റാതെ, സാധാരണ മലയാള ഉച്ചാരണത്തിന് യോജിച്ച ലിപ്യന്തരണം നൽകി.
- issue: בַיִת എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ആലയം
  alternative: ഭവനം / വീട് / ദേവാലയം
  rationale: ഇവിടെ ദൈവത്തിനുള്ള വാസസ്ഥലമാണ് നേരിട്ടുള്ള സൂചന. ‘ആലയം’ അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘ദേവാലയം’ കുറച്ചുകൂടി വ്യാഖ്യാനാത്മകവും ‘വീട്’ ഈ സന്ദർഭത്തിൽ അസ്വാഭാവികവുമാണ്.
- issue: ചോദ്യം നേരിട്ടതോ ഊന്നൽപ്രാപിച്ച ആലങ്കാരിക ചോദ്യമോ
  choice: 'ഊന്നൽപ്രാപിച്ച ചോദ്യം: ‘പണിയുന്നത് നീയാണോ?’'
  alternative: ‘നീ എനിക്ക് ഒരു ആലയം പണിയുമോ?’
  rationale: הַאַתָּה എന്ന രൂപം ‘നീ’ എന്ന കർത്താവിന് ഊന്നൽ നൽകുന്നു. വാചകം വെറും അനുമതി അഭ്യർഥനയായി തോന്നാതിരിക്കാനായി ഈ ഊന്നൽ സംരക്ഷിച്ചു; സന്ദർഭം അതിന്റെ ആലങ്കാരിക സ്വഭാവം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രവാചകശൈലി സ്വീകരിച്ചു. ‘അരുളിച്ചെയ്യുന്നു’ സന്ദേശസൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്കു വ്യക്തമായിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
