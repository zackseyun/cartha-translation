id: 2SA.7.9
reference: 2 Samuel 7:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֶהְיֶ֣ה עִמְּ/ךָ֗ בְּ/כֹל֙ אֲשֶׁ֣ר הָלַ֔כְתָּ וָ/אַכְרִ֥תָ/ה אֶת כָּל אֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ וְ/עָשִׂ֤תִֽי לְ/ךָ֙ שֵׁ֣ם גָּד֔וֹל כְּ/שֵׁ֥ם הַ/גְּדֹלִ֖ים אֲשֶׁ֥ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
translation:
  language: ml
  text: നീ പോയിടത്തെല്ലാം ഞാൻ നിന്നോടുകൂടെ ഉണ്ടായിരുന്നു; നിന്റെ മുമ്പിൽനിന്ന് നിന്റെ സകല ശത്രുക്കളെയും ഞാൻ ഇല്ലാതാക്കി. ഭൂമിയിലുള്ള മഹത്തുക്കളുടെ[b] പേരുപോലെ നിനക്കു ഞാൻ ഒരു മഹത്തായ പേര്[a] ഉണ്ടാക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മഹത്തായ കീർത്തി.” എബ്രായത്തിൽ “പേര്” എന്നത് പലപ്പോഴും കീർത്തിയെയോ പ്രശസ്തിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഭൂമിയിലുള്ള മഹാന്മാരുടെ പേരുപോലെ.”
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: ഞാൻ നിന്നോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: ഭൂതകാല ആഖ്യാനക്രമവും ദൈവിക സാന്നിധ്യത്തിന്റെയും പിന്തുണയുടെയും സൂചനയും നിലനിർത്തുന്നു.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: നീ പോയിടത്തെല്ലാം
  rationale: ദാവീദിന്റെ എല്ലാ യാത്രകളെയും സാഹചര്യങ്ങളെയും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וָאַכְרִתָה אֶת כָּל אֹיְבֶיךָ מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന് നിന്റെ സകല ശത്രുക്കളെയും ഞാൻ ഇല്ലാതാക്കി
  rationale: כרת എന്നതിന്റെ ‘ഛേദിക്കുക/നീക്കിക്കളയുക’ എന്ന ശക്തമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; מִפָּנֶיךָ എന്ന സ്ഥലസൂചനയും നിലനിർത്തുന്നു.
- source_word: וְעָשִׂיתִי לְךָ
  choice: നിനക്കു ഞാൻ ... ഉണ്ടാക്കും
  rationale: ലാമെദിന്റെ ഗുണഭോക്തൃഭാവം ‘നിനക്കു’ എന്നു സൂക്ഷിക്കുകയും വാഗ്ദാനസന്ദർഭത്തിലെ ഭാവികാലശക്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: שֵׁם גָּדוֹל
  choice: ഒരു മഹത്തായ പേര്
  rationale: ‘പേര്’ എന്ന ബൈബിൾ പ്രയോഗവും അതിലുള്ള കീർത്തി/പ്രശസ്തി എന്ന അർഥസൂചനയും നിലനിർത്തുന്നു.
- source_word: כְּשֵׁם הַגְּדֹלִים אֲשֶׁר בָּאָרֶץ
  choice: ഭൂമിയിലുള്ള മഹത്തുക്കളുടെ പേരുപോലെ
  rationale: ‘പേര്’ എന്ന ആവർത്തനം സംരക്ഷിക്കുന്നു; הַגְּדֹלִים എന്നതിനെ ലിംഗം അനാവശ്യമായി നിർണ്ണയിക്കാതെ ‘മഹത്തുക്കൾ’ എന്നും, ഇവിടെ വിശാലമായ താരതമ്യം സൂചിപ്പിക്കുന്ന אָרֶץ എന്നതിനെ ‘ഭൂമി’ എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: വാഗ്ദാനസന്ദർഭത്തിലെ וְעָשִׂיתִי എന്ന ക്രിയയുടെ കാലശക്തി
  choice: ഭാവികാലമായി ‘ഉണ്ടാക്കും’
  alternative: പൂർണഭൂതകാലമായി ‘ഉണ്ടാക്കിയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ഉണ്ടാക്കി’
  rationale: രൂപത്തിൽ ഖാതൽ ആയിരുന്നാലും, മുൻകാല ദൈവപ്രവൃത്തികളുടെ വിവരണത്തിൽനിന്ന് തുടർന്നുള്ള വാഗ്ദാനത്തിലേക്കുള്ള പ്രഭാഷണഗതിയും 1 ദിനവൃത്താന്തം 17:8-ലെ സമാന്തരവും ഇവിടെ ഭാവികാലത്തെ പിന്തുണയ്ക്കുന്നു.
- issue: הַגְּדֹלִים എന്നതിന്റെ വ്യക്തിസൂചന
  choice: മഹത്തുക്കൾ
  alternative: മഹാന്മാർ
  rationale: എബ്രായ ബഹുവചനം പ്രമുഖരെയോ ശക്തരെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യമായ പുരുഷലിംഗ-നിർണ്ണയം ഒഴിവാക്കി പൊതുവായ വ്യക്തിസൂചന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പേര്’ എന്ന ബൈബിൾ രൂപകവും ‘നിന്റെ മുമ്പിൽനിന്ന്’ എന്ന സ്ഥലപ്രയോഗവും നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാനുവാദം ഒഴിവാക്കി.
