id: 2SA.7.3
reference: 2 Samuel 7:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל הַ/מֶּ֔לֶךְ כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ לֵ֣ךְ עֲשֵׂ֑ה כִּ֥י יְהוָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/003.yaml
  text: And Nathan said to the king[a], “Go, do all that is in your heart, for Yahweh is with you.”
translation:
  language: ml
  text: 'നാഥാൻ രാജാവിനോടു പറഞ്ഞു: “നിന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം പോയി ചെയ്യുക[a]; കാരണം, യാഹ്‌വെ നിന്നോടുകൂടെ ഉണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പോകുക, നിന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം ചെയ്യുക.” ‘ഹൃദയത്തിലുള്ളത്’ എന്ന എബ്രായ പ്രയോഗം മനസ്സിലുള്ള ഉദ്ദേശ്യമോ ആഗ്രഹമോ തീരുമാനമോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മലയാളത്തിൽ വാക്യക്രമം തന്നെയാണ് ഈ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാക്കുന്നത്; നിർബന്ധമില്ലാത്ത ഒരു ബന്ധപദം ചേർത്തിട്ടില്ല.
- source_word: נָתָן
  choice: നാഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֶל הַמֶּלֶךְ
  choice: രാജാവിനോടു
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമല്ല, നിർദ്ദിഷ്ട പൊതുനാമമായ ‘രാജാവ്’ ആണ്; അതിനാൽ സന്ദർഭത്തിൽനിന്ന് ‘ദാവീദ്’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: നിന്റെ ഹൃദയത്തിലുള്ളതെല്ലാം
  rationale: לֵבָב വികാരം മാത്രമല്ല, ആന്തരിക ഉദ്ദേശ്യം, ഇച്ഛ, തീരുമാനം എന്നിവയും സൂചിപ്പിക്കുന്നു. ‘ഹൃദയത്തിലുള്ളത്’ എന്ന പ്രയോഗം എബ്രായ രൂപകവും അർത്ഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: לֵךְ עֲשֵׂה
  choice: പോയി ചെയ്യുക
  rationale: തുടർച്ചയായ രണ്ടു ആജ്ഞാരൂപങ്ങൾ അനുവാദവും പ്രോത്സാഹനവും നൽകുന്നു. ‘പോയി ചെയ്യുക’ മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കാൻ അർധവിരാമം
  rationale: כִּי നാഥാന്റെ ഉപദേശത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ അർധവിരാമത്തിനു ശേഷമുള്ള വാക്യം ഈ വിശദീകരണബന്ധം വ്യക്തമായി നൽകുന്നു; ‘കാരണം’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ വ്യാപകമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עִמָּךְ
  choice: നിന്നോടുകൂടെ ഉണ്ട്
  rationale: സാന്നിധ്യത്തെയും കൂടെയിരിപ്പിനെയും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; പിന്തുണയെന്ന അർത്ഥം വിശദീകരിച്ച് ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു പദവി പകരംവെച്ചിട്ടില്ല. ആധുനിക പണ്ഡിതലോകത്ത് ‘യാഹ്‌വെ’ എന്ന പുനർനിർമിത ഉച്ചാരണം പ്രചാരമുള്ളതാണെങ്കിലും, സാധാരണ മലയാള വായനക്കാർക്ക് പരിചിതവും ദൈവനാമമെന്ന നില വ്യക്തമാക്കുന്നതുമായ ‘യഹോവ’ തിരഞ്ഞെടുത്തു.
- issue: ‘നിന്നോടുകൂടെ’ എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: സാന്നിധ്യം സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പ്രയോഗം നിലനിർത്തി
  alternative: ‘നിന്നെ പിന്തുണയ്ക്കുന്നു’ / ‘നിന്റെ പക്ഷത്താണ്’
  rationale: നാഥാന്റെ വാക്ക് ദൈവിക സാന്നിധ്യത്തെയോ പിന്തുണയെയോ സൂചിപ്പിക്കാം; എന്നാൽ സന്ദർഭത്തിലെ പിന്നീടുള്ള ദൈവിക തിരുത്തലിന്റെ വെളിച്ചത്തിൽ ഇതിനെ നിർവ്യാജ അംഗീകാരമായി വികസിപ്പിക്കാതെ മൂലപാഠത്തിന്റെ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായ പദക്രമത്തിന്റെ കാഠിന്യം ഒഴിവാക്കിയെങ്കിലും ‘ഹൃദയം’, ‘രാജാവ്’, ദൈവനാമം, ദൈവസാന്നിധ്യം എന്നിവയുടെ മൂലരൂപവും അർത്ഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
