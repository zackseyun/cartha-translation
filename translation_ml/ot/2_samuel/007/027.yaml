source:
  edition: WLC
  text: כִּֽי אַתָּה֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל גָּלִ֜יתָה אֶת אֹ֤זֶן עַבְדְּ/ךָ֙ לֵ/אמֹ֔ר בַּ֖יִת אֶבְנֶה לָּ֑/ךְ עַל כֵּ֗ן מָצָ֤א עַבְדְּ/ךָ֙ אֶת לִבּ֔/וֹ לְ/הִתְפַּלֵּ֣ל אֵלֶ֔י/ךָ אֶת הַ/תְּפִלָּ֖ה הַ/זֹּֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
translation:
  language: ml
  text: കാരണം, സൈന്യങ്ങളുടെ യഹ്‌വേ, ഇസ്രായേലിന്റെ ദൈവമേ, “ഞാൻ നിനക്കൊരു ഭവനം പണിയും”[b] എന്ന് അങ്ങ് അങ്ങയുടെ ദാസനായ എനിക്കു വെളിപ്പെടുത്തിയിരിക്കുന്നു.[a] അതുകൊണ്ട്, ഈ പ്രാർഥന അങ്ങയോടു പ്രാർഥിക്കാൻ അങ്ങയുടെ ദാസനായ എനിക്കു മനസ്സുറപ്പ് ലഭിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അങ്ങയുടെ ദാസന്റെ ചെവി മറനീക്കി”; വെളിപ്പെടുത്തുക എന്നർഥമുള്ള ഒരു എബ്രായ ശൈലിയാണിത്.
    reason: lexical_alternative
  - marker: b
    text: “ഭവനം” എന്നത് ഇവിടെ ഒരു വീടിനെയോ ആലയത്തെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ രാജവംശം എന്ന ഉടമ്പടിസംബന്ധമായ അർഥവും അതിൽ അനുനാദിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “അങ്ങയുടെ ദാസൻ തന്റെ ഹൃദയം കണ്ടെത്തി”; അതായത്, പ്രാർഥിക്കാനുള്ള ധൈര്യമോ മനസ്സുറപ്പോ ലഭിച്ചു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ യഹ്‌വേ
  rationale: ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുകയും צְבָאוֹת എന്ന ബഹുവചനത്തിന്റെ വ്യാപ്തി ചുരുക്കാതെ ‘സൈന്യങ്ങൾ’ എന്നു നൽകുകയും ചെയ്തു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമേ
  rationale: സംയുക്തപദത്തിന്റെ ഉടമസ്ഥബന്ധവും പ്രാർഥനയിലെ സംബോധനരൂപവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ എനിക്കു വെളിപ്പെടുത്തിയിരിക്കുന്നു
  rationale: ‘ദാസന്റെ ചെവി തുറന്നു/മറനീക്കി’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ആദ്യപുരുഷ പ്രാർഥനയിൽ ദാവീദ് തന്നെ ‘അങ്ങയുടെ ദാസൻ’ എന്നു വിളിക്കുന്നതും വ്യക്തമാക്കുന്നു.
- source_word: בַּיִת אֶבְנֶה לָּךְ
  choice: ഞാൻ നിനക്കൊരു ഭവനം പണിയും
  rationale: ‘ഭവനം’ എന്ന പദം പ്രത്യേകമായി ‘ആലയം’ എന്നോ ‘രാജവംശം’ എന്നോ ചുരുക്കാതെ സന്ദർഭത്തിലെ ദ്വയാർഥസാധ്യത സംരക്ഷിക്കുന്നു.
- source_word: מָצָא עַבְדְּךָ אֶת לִבּוֹ
  choice: ധൈര്യം ... മനസ്സിൽ ലഭിച്ചു
  rationale: അക്ഷരാർഥമായ ‘തന്റെ ഹൃദയം കണ്ടെത്തി’ എന്ന അപരിചിത പ്രയോഗത്തിന്റെ ധൈര്യം/മനസ്സുറപ്പ് എന്ന ആശയം നൽകുമ്പോഴും ‘മനസ്സിൽ’ എന്ന ഘടകം നിലനിർത്തുന്നു.
- source_word: לְהִתְפַּלֵּל אֵלֶיךָ אֶת הַתְּפִלָּה הַזֹּאת
  choice: ഈ പ്രാർഥന അങ്ങയോടു പ്രാർഥിക്കാൻ
  rationale: എബ്രായത്തിലെ നാമ-ക്രിയ ആവർത്തനം ഒഴിവാക്കാതെ, മലയാളത്തിൽ മനസ്സിലാകുന്ന പ്രാർഥനാഭാഷയായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ഭവനം’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ഭവനം
  alternative: ആലയം; രാജവംശം
  rationale: ദാവീദിക ഉടമ്പടിയുടെ സന്ദർഭത്തിൽ ഈ പദം കെട്ടിടത്തെയും വംശപരമ്പരയെയും അനുനാദിപ്പിക്കുന്നു; ഒരൊറ്റ അർഥത്തിലേക്ക് വിവർത്തനം ചെയ്യുന്നത് മൂലപാഠത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ പദപ്രയോഗം ഇല്ലാതാക്കും.
- issue: വെളിപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി
  choice: എനിക്കു വെളിപ്പെടുത്തിയിരിക്കുന്നു
  alternative: അങ്ങയുടെ ദാസന്റെ ചെവി മറനീക്കിയിരിക്കുന്നു
  rationale: ദൈവിക വെളിപ്പെടുത്തൽ എന്ന ആശയം വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥ ശൈലി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: מָצָא ... אֶת לִבּוֹ എന്ന പ്രയോഗം
  choice: പ്രാർഥിക്കാനുള്ള ധൈര്യം ... മനസ്സിൽ ലഭിച്ചു
  alternative: തന്റെ ഹൃദയം കണ്ടെത്തി
  rationale: മൂലത്തിലെ രൂപകം പൂർണമായി മറയ്ക്കാതെ, അതിന്റെ മനസ്സുറപ്പ്/ധൈര്യം എന്ന പ്രായോഗിക അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. ദൈവത്തോടുള്ള നേരിട്ടുള്ള സംബോധനയിൽ ‘അങ്ങ്’ എന്നും ദൈവം ദാവീദിനോടു പറയുന്ന ഉദ്ധരണിയിൽ ഏകവചനമായ ‘നീ’ എന്നും വ്യത്യാസപ്പെടുത്തി. ‘ദാസനായ എനിക്ക്’ എന്ന ആദ്യപുരുഷരൂപം ആവർത്തിക്കുന്നതിലൂടെ എബ്രായത്തിലെ വിനയപൂർവമായ സ്വയംപരാമർശം മലയാളത്തിൽ വ്യക്തമായി.
