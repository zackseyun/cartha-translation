  to: കാരണം, സൈന്യങ്ങളുടെ യഹ്‌വേ, ഇസ്രായേലിന്റെ ദൈവമേ, “ഞാൻ നിനക്കൊരു ഭവനം പണിയും”[b] എന്ന് അങ്ങ് അങ്ങയുടെ ദാസനായ എനിക്കു വെളിപ്പെടുത്തിയിരിക്കുന്നു.[a] അതുകൊണ്ട്, ഈ പ്രാർഥന അങ്ങയോടു പ്രാർഥിക്കാൻ അങ്ങയുടെ ദാസനായ എനിക്കു മനസ്സുറപ്പ് ലഭിച്ചു.[c]
