id: 2SA.7.4
reference: 2 Samuel 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֖י בַּ/לַּ֣יְלָה הַ/ה֑וּא וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל נָתָ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/004.yaml
  text: But that night the word of Yahweh came to Nathan[a], saying,
translation:
  language: ml
  text: 'എന്നാൽ ആ രാത്രിയിൽ യാഹ്‌വേയുടെ വചനം നാഥാനോടു വന്നു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: എന്നാൽ ... ലഭിച്ചു
  rationale: ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന രൂപമാണിത്. മുൻവാക്യത്തിൽ നാഥാൻ നൽകിയ അനുമതിയോട് തുടർന്നുള്ള ദൈവിക തിരുത്തലിന്റെ വൈരുധ്യം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്; ആവർത്തിച്ചിരിക്കുന്ന ‘സംഭവിച്ചു/ഉണ്ടായി’ എന്ന ഘടന മലയാളത്തിൽ ലളിതമാക്കി.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ആ രാത്രിയിൽ
  rationale: കാലസൂചനയുടെ നിർദിഷ്ടത കാത്തുസൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וַיְהִי דְּבַר יְהוָה
  choice: യഹോവയുടെ അരുളപ്പാട് ... ലഭിച്ചു
  rationale: പ്രവാചകനു ദൈവിക സന്ദേശം ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം. ‘വചനം ഉണ്ടായി’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ സ്വാഭാവികമായിരിക്കെ വെളിപ്പാടിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֶל נָתָן
  choice: നാഥാനു
  rationale: വെളിപ്പാടിന്റെ സ്വീകർത്താവിനെ ദിശ/ലക്ഷ്യ അർഥത്തിൽ സ്വാഭാവികമായ ദത്തിവിഭക്തിയിലൂടെ രേഖപ്പെടുത്തി.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: എബ്രായത്തിലെ ‘പറഞ്ഞുകൊണ്ട്/പറയാൻ’ അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള ദൈവവചനത്തെ പരിചയപ്പെടുത്തുന്നു; മലയാളത്തിൽ ദ്വിബിന്ദു ഇതു ചുരുക്കമായും സ്വാഭാവികമായും നിർവഹിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. പ്രവാചകവെളിപ്പാടിന്റെ ഔപചാരിക ഭാവം നിലനിർത്താൻ ‘അരുളപ്പാട്’ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ഇരട്ട וַיְהִי ഘടന മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ ഒറ്റ സ്വാഭാവിക വാക്യമായി അവതരിപ്പിച്ചു.
