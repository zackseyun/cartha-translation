  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַ/צֹּפֶ֔ה אֲנִ֤י רֹאֶה֙ אֶת מְרוּצַ֣ת הָ/רִאשׁ֔וֹן כִּ/מְרֻצַ֖ת אֲחִימַ֣עַץ בֶּן צָד֑וֹק וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אִֽישׁ ט֣וֹב זֶ֔ה וְ/אֶל בְּשׂוֹרָ֥ה טוֹבָ֖ה יָבֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
translation:
  language: ml
  text: 'അപ്പോൾ കാവൽക്കാരൻ പറഞ്ഞു: “ആദ്യത്തെയാളുടെ ഓട്ടം സാദോക്കിന്റെ മകനായ അഹീമയാസിന്റെ ഓട്ടംപോലെയാണെന്ന് ഞാൻ കാണുന്നു[a].” രാജാവ് പറഞ്ഞു: “അവൻ നല്ല മനുഷ്യനാണ്; അവൻ നല്ല വാർത്തയുമായി വരുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാനുസൃതമായി: “ആദ്യത്തെയാളുടെ ഓട്ടം സാദോക്കിന്റെ മകനായ അഹീമയാസിന്റെ ഓട്ടംപോലെയാണെന്ന് ഞാൻ കാണുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “അവൻ നല്ല വാർത്തയുമായി വരും.” എബ്രായ ക്രിയയെ ഭാവികാലമായും മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: കാവൽക്കാരൻ
  rationale: കാവൽനിന്ന് ദൂരെയുള്ള ആളുകളെ നിരീക്ഷിക്കുന്ന വ്യക്തിയെയാണ് ഈ കർത്തൃവാചക കൃദന്തം സൂചിപ്പിക്കുന്നത്. കഥാസന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപദമാണ് ‘കാവൽക്കാരൻ’.
- source_word: מְרוּצַת הָרִאשׁוֹן ... כִּמְרֻצַת
  choice: ആദ്യം വരുന്നവൻ ഓടുന്ന രീതി ... ഓടുന്ന രീതിപോലെയാണ്
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ചിരിക്കുന്ന ‘ഓട്ടം’ എന്ന നാമരൂപവും താരതമ്യവും അർത്ഥത്തിൽ നിലനിർത്തിക്കൊണ്ട്, ഒരാളുടെ പ്രത്യേക ഓട്ടശൈലി തിരിച്ചറിയുന്നതാണ് ഉദ്ദേശ്യമെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲחִימַעַץ בֶּן צָדוֹק
  choice: സാദോക്കിന്റെ മകനായ അഹീമയാസ്
  rationale: בֶּן എന്ന ബന്ധം വ്യക്തമായി പരിഭാഷപ്പെടുത്തുകയും പേരുകൾ മലയാളത്തിലെ ബൈബിൾനാമങ്ങളുടെ സാധാരണ ലിപ്യന്തരണരീതിയിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: אִישׁ טוֹב זֶה
  choice: അവൻ നല്ല മനുഷ്യനാണ്
  rationale: അക്ഷരാർഥത്തിൽ ‘നല്ല മനുഷ്യൻ, ഇവൻ’ എന്ന ഊന്നലുള്ള വാക്യം ആണെങ്കിലും, രാജാവ് അഹീമയാസിന്റെ സ്വഭാവത്തെ അനുകൂലമായി വിലയിരുത്തുന്നത് സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ പ്രകടമാകുന്നു.
- source_word: וְאֶל בְּשׂוֹרָה טוֹבָה יָבוֹא
  choice: അവൻ നല്ല വാർത്തയുമായാണ് വരുന്നത്
  rationale: בְּשׂוֹרָה טוֹבָה എന്നത് ‘നല്ല വാർത്ത’ എന്നും, സന്ദേശവുമായി സമീപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മുഴുവൻ പ്രയോഗം സ്വാഭാവികമായി ‘നല്ല വാർത്തയുമായി വരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്തി. יָבוֹא എന്ന രൂപത്തിന്റെ ഭാവികാലസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, കഥനത്തിന് യോജിച്ച ഗൗരവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തതയും നിലനിർത്തി. ‘ഓട്ടം’ എന്ന എബ്രായ നാമപ്രയോഗത്തിന്റെ ആവർത്തനം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘ഓടുന്ന രീതി’ എന്നാക്കി; കൂടുതൽ അക്ഷരാനുസൃത രൂപം അടിക്കുറിപ്പിൽ നൽകി. ക്രിയയുടെ വർത്തമാന/ഭാവി കാലസന്ദിഗ്ധതയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
