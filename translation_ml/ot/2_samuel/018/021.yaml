translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘കൂശ്യൻ’ എന്നത് ഉറവിടത്തിലെ ജനവിഭാഗസൂചന നിലനിർത്തുന്നു; ‘കുനിഞ്ഞുവണങ്ങി’ ആദരസൂചകമായ ശരീരഭാവം വ്യക്തമാക്കുന്നു.
