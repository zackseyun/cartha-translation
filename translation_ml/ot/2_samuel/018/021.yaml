id: 2SA.18.21
reference: 2 Samuel 18:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹאָב֙ לַ/כּוּשִׁ֔י לֵ֛ךְ הַגֵּ֥ד לַ/מֶּ֖לֶךְ אֲשֶׁ֣ר רָאִ֑יתָה וַ/יִּשְׁתַּ֧חוּ כוּשִׁ֛י לְ/יוֹאָ֖ב וַ/יָּרֹֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/021.yaml
  text: Then Joab said to the Cushite[a], “Go, tell the king what you have seen.” And the Cushite bowed down to Joab and ran.
translation:
  language: ml
  text: അപ്പോൾ യോവാബ് കൂശ്യനോട്[a], “പോകുക; നീ കണ്ടത് രാജാവിനെ അറിയിക്കുക” എന്നു പറഞ്ഞു. കൂശ്യൻ യോവാബിന്റെ മുമ്പിൽ കുനിഞ്ഞുവണങ്ങി ഓടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഇത് വ്യക്തിനാമമായി മനസ്സിലാക്കിയാൽ “കൂശി”; പരമ്പരാഗതമായി “എത്യോപ്യക്കാരൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: കൂശ്യൻ
  rationale: എബ്രായപദം സാധാരണയായി കൂശ് ദേശക്കാരനെയോ കൂശ് വംശജനെയോ സൂചിപ്പിക്കുന്ന ജനവിഭാഗനാമമാണ്. വ്യക്തിനാമമായ ‘കൂശി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לֵךְ
  choice: പോകുക
  rationale: הלך എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ആജ്ഞാരൂപം; ആധുനികവും മാന്യവുമായ മലയാള ആജ്ഞാശൈലി.
- source_word: הַגֵּד
  choice: അറിയിക്കുക
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപത്തിന് ‘അറിയിക്കുക/വിവരം പറയുക’ എന്ന അർഥം. രാജാവിനുള്ള റിപ്പോർട്ടിന്റെ സന്ദർഭത്തിൽ ‘അറിയിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר רָאִיתָה
  choice: നീ കണ്ടത്
  rationale: എബ്രായ ബന്ധവാക്യത്തിന്റെ ലളിതവും കൃത്യവുമായ മലയാള രൂപം; പൂർത്തിയായ ദർശനാനുഭവത്തെ അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: וַיִּשְׁתַּחוּ
  choice: കുനിഞ്ഞുവണങ്ങി
  rationale: ശാരീരികമായി താഴ്ന്ന് ആദരം പ്രകടിപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ആരാധനയെന്ന അർഥം ഇറക്കുമതി ചെയ്യാതെ ആദരപ്രകടനം നിലനിർത്തുന്നു.
- source_word: וַיָּרֹץ
  choice: ഓടി
  rationale: רוץ എന്ന ക്രിയയുടെ ലളിതമായ കഥനാർഥം നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ക്രമം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘അപ്പോൾ’ സ്വാഭാവികമാണ്.
