source:
  edition: WLC
  text: וְ/דָוִ֥ד יוֹשֵׁ֖ב בֵּין שְׁנֵ֣י הַ/שְּׁעָרִ֑ים וַ/יֵּ֨לֶךְ הַ/צֹּפֶ֜ה אֶל גַּ֤ג הַ/שַּׁ֨עַר֙ אֶל הַ֣/חוֹמָ֔ה וַ/יִּשָּׂ֤א אֶת עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִ֖ישׁ רָ֥ץ לְ/בַדּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
translation:
  language: ml
  text: ദാവീദ് രണ്ടു കവാടങ്ങൾക്കിടയിൽ[a] ഇരിക്കുകയായിരുന്നു. കാവൽക്കാരൻ മതിലിനോടു ചേർന്ന കവാടത്തിന്റെ മേൽക്കൂരയിലേക്കു കയറി. അവൻ കണ്ണുകൾ ഉയർത്തി നോക്കി; അതാ, ഒരു മനുഷ്യൻ തനിച്ച് ഓടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രണ്ടു കവാടഗൃഹങ്ങൾക്കിടയിൽ.” എബ്രായത്തിൽ അക്ഷരാർഥം “രണ്ടു കവാടങ്ങൾക്കിടയിൽ” എന്നാണ്; പ്രതിരോധസജ്ജമായ ഒരു നഗരകവാടത്തിലെ പുറംകവാടത്തിനും അകക്കവാടത്തിനും ഇടയിലുള്ള സ്ഥലമായിരിക്കാം ഇത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: വർത്തമാനകൃതന്തം ആ സമയത്ത് തുടരുന്ന ദാവീദിന്റെ ഇരിപ്പിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഭൂതകാല തുടർച്ചാരൂപം അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  choice: രണ്ടു കവാടങ്ങൾക്കിടയിൽ
  rationale: എബ്രായത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; അകത്തെയും പുറത്തെയും കവാടങ്ങളാണെന്ന് മുഖ്യപാഠത്തിൽ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: הַצֹּפֶה
  choice: കാവൽക്കാരൻ
  rationale: നഗരകവാടത്തിന്റെയും മതിലിന്റെയും പശ്ചാത്തലത്തിൽ നിരീക്ഷണച്ചുമതലയുള്ള ആളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: אֶל גַּג הַשַּׁעַר אֶל הַחוֹמָה
  choice: മതിലിനോടു ചേർന്ന കവാടത്തിന്റെ മുകളിലേക്കു
  rationale: കവാടഘടനയുടെ മേൽഭാഗത്തേക്കുള്ള ചലനവും മതിലുമായുള്ള സ്ഥലബന്ധവും വ്യക്തമാക്കുന്നു; വാസ്തുവിവരം അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: കണ്ണുകളുയർത്തി
  rationale: എബ്രായ ശൈലിയുടെ ദൃശ്യഭാവം നിലനിർത്തുന്ന, മലയാളത്തിലും മനസ്സിലാകുന്ന പ്രയോഗം.
- source_word: וַיַּרְא וְהִנֵּה
  choice: നോക്കിയപ്പോൾ, അതാ
  rationale: കാണുന്ന പ്രവൃത്തിയെയും പിന്നാലെയുള്ള അപ്രതീക്ഷിത ദൃശ്യാവതരണത്തെയും മലയാള കഥനത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു; הִנֵּה എന്നതിന്റെ ശ്രദ്ധാകർഷകശക്തി ‘അതാ’ നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: സന്ദർഭത്തിൽ ഒരു പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, ആധുനിക മലയാളത്തിൽ ‘ഒരാൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; ലിംഗം നിർബന്ധമായി ആവർത്തിക്കാതെ ഏക വ്യക്തിയെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: רָץ
  choice: ഓടിവരുന്നു
  rationale: കാവൽക്കാരന്റെ ദിശയിലേക്കു സമീപിക്കുന്ന ഓട്ടക്കാരനെ ദൃശ്യമായി അവതരിപ്പിക്കുന്നു; കൃതന്തത്തിന്റെ പുരോഗമനസ്വഭാവം വർത്തമാന ദൃശ്യരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְבַדּוֹ
  choice: തനിച്ച്
  rationale: ഓട്ടക്കാരനോടൊപ്പം മറ്റാരുമില്ലെന്ന അർഥം ലളിതമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ ദൃശ്യഗതിയും ‘അതാ’ എന്ന ശ്രദ്ധാകർഷകഭാവവും നിലനിർത്തി; കവാടഘടനയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
