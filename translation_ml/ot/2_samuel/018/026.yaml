  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
translation:
  language: ml
  text: അപ്പോൾ കാവൽക്കാരൻ ഓടുന്ന മറ്റൊരാളെ കണ്ടു. കാവൽക്കാരൻ കവാടപാലകനെ വിളിച്ച്, “നോക്കൂ, ഒരാൾ തനിച്ച് ഓടുന്നു” എന്നു പറഞ്ഞു. രാജാവ്, “ഇവനും വാർത്ത കൊണ്ടുവരുന്നവനാണ്[a]” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സന്ദേശവാഹകനാണ്”; ഈ എബ്രായ ക്രിയാരൂപം ഒരു വിവരം, പലപ്പോഴും നല്ല വാർത്ത, കൊണ്ടുവരുന്നവനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: കാവൽക്കാരൻ
  rationale: צפה എന്ന ധാതുവിന്റെ പങ്കാളിത്തരൂപം നിരീക്ഷിച്ചുകൊണ്ട് കാവൽ നിൽക്കുന്ന ആളെ സൂചിപ്പിക്കുന്നു; നഗരകവാടത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘കാവൽക്കാരൻ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אִישׁ אַחֵר
  choice: മറ്റൊരാൾ
  rationale: ഇത് മുമ്പത്തെ ഓട്ടക്കാരനിൽനിന്ന് വ്യത്യസ്തനായ മറ്റൊരു പുരുഷനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സന്ദർഭം വ്യക്തമായതിനാൽ ‘മറ്റൊരാൾ’ സ്വാഭാവികമാണ്.
- source_word: רָץ
  choice: ഓടിവരുന്ന / ഓടിവരുന്നു
  rationale: പങ്കാളിത്തരൂപം നടന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ ചിത്രീകരിക്കുന്നു. സന്ദർഭത്തിൽ ആൾ നഗരത്തിലേക്കു സമീപിക്കുന്നതിനാൽ ‘ഓടിവരുക’ ആ ദിശയും തുടർച്ചയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַשֹּׁעֵר
  choice: കവാടപാലകൻ
  rationale: നഗരകവാടത്തിന്റെ ചുമതലയുള്ള ആളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘കവാടപാലകൻ’ കൃത്യവും ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു നിപാതത്തിന്റെ സംഭാഷണശക്തി ‘നോക്കൂ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְבַדּוֹ
  choice: തനിച്ച്
  rationale: ഓട്ടക്കാരൻ ഒരു സംഘത്തിന്റെ ഭാഗമല്ലാതെ ഒറ്റയ്ക്കാണെന്ന നിരീക്ഷണം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: גַּם זֶה
  choice: ഇവനും
  rationale: זֶה എന്ന സമീപസൂചകത്തിന്റെയും גַּם എന്ന ‘കൂടി’ എന്ന ആശയത്തിന്റെയും സംയുക്തബലം മലയാളത്തിലെ ‘ഇവനും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מְבַשֵּׂר
  choice: വാർത്ത കൊണ്ടുവരുന്നവനാണ്
  rationale: בשׂר എന്ന ധാതുവിന്റെ പീയേൽ പങ്കാളിത്തരൂപം വാർത്തയോ അറിയിപ്പോ കൊണ്ടുവരുന്നവനെ സൂചിപ്പിക്കാം; വാർത്ത നിർബന്ധമായും നല്ലതാണെന്ന് മുൻകൂട്ടി നിശ്ചയിക്കാതെ മൂലത്തിലെ വിശാലത ഇത് നിലനിർത്തുന്നു.
