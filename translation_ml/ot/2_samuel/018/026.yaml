  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും ലളിതവുമായ കഥനഭാഷ ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന ‘കാവൽക്കാരൻ’ എന്ന നാമം മൂലപാഠത്തിന്റെ ആവർത്തനം നിലനിർത്താൻ സംരക്ഷിച്ചു; സംഭാഷണം സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ നൽകി.
