translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. രാജാവിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ’ എന്ന ആദരരൂപം സ്വീകരിച്ചു. അഹീമയസിന്റെ സദസ്സുഭാഷയിലെ താഴ്മ ‘അങ്ങയുടെ ദാസനായ ഞാൻ’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു. അടിക്കുറിപ്പിന്റെ സൂചകം അതു വിശദീകരിക്കുന്ന ‘ബഹളം’ എന്ന പദത്തിനോടു ചേർത്തിരിക്കുന്നു.
