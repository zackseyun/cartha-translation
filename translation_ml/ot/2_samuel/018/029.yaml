  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ שָׁל֥וֹם לַ/נַּ֖עַר לְ/אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר אֲחִימַ֡עַץ רָאִיתִי֩ הֶ/הָמ֨וֹן הַ/גָּד֜וֹל לִ֠/שְׁלֹחַ אֶת עֶ֨בֶד הַ/מֶּ֤לֶךְ יוֹאָב֙ וְ/אֶת עַבְדֶּ֔/ךָ וְ/לֹ֥א יָדַ֖עְתִּי מָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/029.yaml
  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
translation:
  language: ml
  text: 'രാജാവ് ചോദിച്ചു: “അബ്ശാലോം എന്ന യുവാവിന് സുഖമാണോ?” അഹീമാസ് പറഞ്ഞു: “യോവാബ് രാജാവിന്റെ ദാസനെയും അങ്ങയുടെ ദാസനായ എന്നെയും അയച്ചപ്പോൾ വലിയൊരു ബഹളം[a] ഞാൻ കണ്ടു; എന്നാൽ അത് എന്തായിരുന്നുവെന്ന് എനിക്ക് അറിയില്ലായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വലിയൊരു ജനക്കൂട്ടം” അല്ലെങ്കിൽ “വലിയൊരു കോലാഹലം”; എബ്രായപദത്തിന് ജനക്കൂട്ടം, ശബ്ദം, അല്ലെങ്കിൽ കലക്കം എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: സുഖമാണോ
  rationale: ചോദ്യരൂപത്തിലുള്ള שָׁלוֹם ഇവിടെ അബ്ശാലോമിന്റെ ക്ഷേമത്തെക്കുറിച്ചാണ് അന്വേഷിക്കുന്നത്. ‘സുഖമാണോ’ എന്നത് സുരക്ഷിതനാണെന്ന അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ ക്ഷേമാന്വേഷണം പ്രകടിപ്പിക്കുന്നു.
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: യുവാവായ അബ്ശാലോം
  rationale: נַעַר എന്ന പദത്തിന്റെ ‘യുവാവ്’ എന്ന അർഥവും ദാവീദ് മകനെ നേരിട്ടു ‘എന്റെ മകൻ’ എന്നു വിളിക്കാതെ പരാമർശിക്കുന്ന മൂലപാഠത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: הֶהָמוֹן הַגָּדוֹל
  choice: വലിയൊരു ബഹളം
  rationale: הָמוֹן ജനക്കൂട്ടം, ശബ്ദം, കോലാഹലം, കലക്കം എന്നിവ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ചലനവും ശബ്ദവും ഉൾപ്പെട്ട അവ്യക്തമായ കലക്കം സ്വാഭാവികമായി അറിയിക്കാൻ ‘ബഹളം’ തിരഞ്ഞെടുത്തു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לִשְׁלֹחַ
  choice: അയച്ചപ്പോൾ
  rationale: לְ ചേർന്ന infinitive construct ഇവിടെ കാലസംബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘അയച്ചപ്പോൾ’ എന്ന ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: עֶבֶד הַמֶּלֶךְ
  choice: രാജാവിന്റെ ദാസൻ
  rationale: עֶבֶד ഇവിടെ രാജസേവനത്തിലുള്ള കീഴുദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു; ഉടമസ്ഥബന്ധം മുൻനിർത്തുന്ന ‘അടിമ’യെക്കാൾ സന്ദർഭോചിതം ‘ദാസൻ’ ആണ്.
- source_word: וְאֶת עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസനായ എന്നെയും
  rationale: അഹീമയസ് സ്വയം താഴ്മയോടെ ‘അങ്ങയുടെ ദാസൻ’ എന്നു വിളിക്കുന്ന രാജസദസ്സിലെ ആദരസൂത്രം നിലനിർത്തുന്നു; മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ ‘എന്നെയും’ ചേർത്തു.
- source_word: וְלֹא יָדַעְתִּי מָה
  choice: എന്നാൽ അത് എന്തായിരുന്നുവെന്ന് എനിക്ക് അറിയില്ലായിരുന്നു
  rationale: എബ്രായത്തിലെ ‘എന്തെന്ന് അറിഞ്ഞില്ല’ എന്ന അപൂർണപ്രയോഗത്തിന്റെ സൂചിതവിഷയം സ്വാഭാവിക മലയാളത്തിനായി ‘അത്’ എന്നു വ്യക്തമാക്കി; പുതിയ വിവരമൊന്നും ചേർത്തിട്ടില്ല.
