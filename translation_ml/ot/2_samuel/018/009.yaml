base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/009.yaml
  text: Absalom happened to come before David’s servants while Absalom was riding on the mule. The mule went under the thick branches of a large terebinth[a], and his head got caught in the terebinth, so that he was left hanging between heaven and earth while the mule that was under him passed on.
translation:
  language: ml
  text: അബ്ശാലോം ദാവീദിന്റെ സേവകരുടെ മുമ്പിൽ അപ്രതീക്ഷിതമായി വന്നുപെട്ടു. അപ്പോൾ അവൻ കോവർകഴുതപ്പുറത്ത് കയറി സഞ്ചരിക്കുകയായിരുന്നു. ആ കോവർകഴുത ആ വലിയ ടെറിബിന്ത് വൃക്ഷത്തിന്റെ[a] ഇടതൂർന്ന കൊമ്പുകൾക്കടിയിലൂടെ കടന്നുപോയപ്പോൾ അബ്ശാലോമിന്റെ തല ആ വൃക്ഷത്തിൽ കുടുങ്ങി. അങ്ങനെ അവൻ ആകാശത്തിനും ഭൂമിക്കും മധ്യേ തൂങ്ങിക്കിടന്നു; അവന്റെ കീഴിലുണ്ടായിരുന്ന കോവർകഴുതയാകട്ടെ മുന്നോട്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു വലിയ ഓക്കുമരത്തിന്റെ ഇടതൂർന്ന കൊമ്പുകൾ.’ എബ്രായത്തിലെ אֵלָה എന്ന പദം പൊതുവായി ഒരു വലിയ വൃക്ഷത്തെയും സൂചിപ്പിക്കാം; ഇവിടെ ‘ടെറിബിന്ത് വൃക്ഷം’ എന്നതാണ് കൂടുതൽ കൃത്യമായ സസ്യനാമം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרֵא ... לִפְנֵי
  choice: മുമ്പിൽ അപ്രതീക്ഷിതമായി വന്നുപെട്ടു
  rationale: നിഫാൽ രൂപം മനഃപൂർവമായ കൂടിക്കാഴ്ചയല്ല, യാദൃച്ഛികമായി അവരുടെ മുമ്പിൽ വന്നുപെടുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עַבְדֵי דָוִד
  choice: ദാവീദിന്റെ ഭൃത്യന്മാർ
  rationale: സൈനിക പശ്ചാത്തലത്തിൽ രാജാവിന്റെ സേവകരെയോ ആളുകളെയോ സൂചിപ്പിക്കുന്നു; ‘ഭൃത്യന്മാർ’ മൂലപദത്തിന്റെ സേവകഭാവം നിലനിർത്തുന്നു.
- source_word: רֹכֵב עַל הַפֶּרֶד
  choice: കോവർകഴുതപ്പുറത്ത് സഞ്ചരിക്കുകയായിരുന്നു
  rationale: അബ്ശാലോമിന്റെ അന്നത്തെ അവസ്ഥ വ്യക്തമാക്കുന്ന കർത്തൃവാചക പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תַּחַת שׂוֹבֶךְ הָאֵלָה הַגְּדוֹלָה
  choice: ഒരു വലിയ ഏലാവൃക്ഷത്തിന്റെ ഇടതൂർന്ന കൊമ്പുകൾക്കടിയിലൂടെ
  rationale: שׂוֹבֶךְ ഇടതൂർന്നതോ പരസ്പരം പിണഞ്ഞതോ ആയ കൊമ്പുകളുടെ കൂട്ടത്തെയും אֵלָה ടെറിബിന്ത്/ഏലാവൃക്ഷത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: וַיֶּחֱזַק רֹאשׁוֹ בָאֵלָה
  choice: തല ആ വൃക്ഷത്തിൽ കുടുങ്ങി
  rationale: അക്ഷരാർഥത്തിൽ തല വൃക്ഷത്തിൽ മുറുകെ പിടിക്കപ്പെട്ടുവെന്ന ആശയം; ‘കുടുങ്ങി’ അനൈച്ഛികമായ സംഭവത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു. മുടിയാണ് കുടുങ്ങിയതെന്ന് മൂലപാഠം പറയുന്നില്ല.
- source_word: וַיֻּתַּן בֵּין הַשָּׁמַיִם וּבֵין הָאָרֶץ
  choice: ആകാശത്തിനും ഭൂമിക്കും മധ്യേ തൂങ്ങിക്കിടന്നു
  rationale: נתן എന്ന നിഷ്ക്രിയരൂപം ഇവിടെ ഉണ്ടായ ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ തൂങ്ങിക്കിടക്കുന്ന അവസ്ഥ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: עָבָר
  choice: മുന്നോട്ടുപോയി
  rationale: അബ്ശാലോം കുടുങ്ങിയശേഷവും കോവർകഴുത യാത്ര തുടർന്നുവെന്ന ചലനം വ്യക്തമാക്കുന്നു.
