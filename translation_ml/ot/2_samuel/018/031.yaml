source:
  edition: WLC
  text: וְ/הִנֵּ֥ה הַ/כּוּשִׁ֖י בָּ֑א וַ/יֹּ֣אמֶר הַ/כּוּשִׁ֗י יִתְבַּשֵּׂר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי שְׁפָטְ/ךָ֤ יְהוָה֙ הַ/יּ֔וֹם מִ/יַּ֖ד כָּל הַ/קָּמִ֥ים עָלֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
translation:
  language: ml
  text: 'ഇതാ, കൂശ്യൻ[a] വന്നു. കൂശ്യൻ പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവേ, നല്ല വാർത്ത അറിയട്ടെ! അങ്ങേക്കെതിരെ എഴുന്നേറ്റ എല്ലാവരുടെയും കൈയിൽനിന്ന് യഹ്‌വെ ഇന്ന് അങ്ങേക്കുവേണ്ടി നീതി നടപ്പാക്കിയിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “എത്യോപ്യക്കാരൻ.” എബ്രായയിൽ: “കൂശ്യൻ.”'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യഹ്‌വെ ഇന്ന് അങ്ങേക്കുവേണ്ടി ന്യായവിധി നടത്തിയിരിക്കുന്നു” അല്ലെങ്കിൽ “അങ്ങേക്കു നീതി നൽകിയിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: പുതിയ ദൂതന്റെ വരവ് സജീവമായി അവതരിപ്പിക്കുന്ന ആഖ്യാനസൂചകത്തിന്റെ അടിയന്തരതയും ദൃശ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: הַכּוּשִׁי
  choice: കൂശ്യൻ
  rationale: നിശ്ചയാർഥപ്രത്യയത്തോടെയുള്ള വംശദേശസൂചക പ്രയോഗമായി പരിഭാഷപ്പെടുത്തി; വ്യക്തിനാമമായി എടുത്തിട്ടില്ല. ‘എത്യോപ്യക്കാരൻ’ എന്നത് സാധ്യമെങ്കിലും ആധുനിക രാജ്യവുമായി അനാവശ്യമായി സമീകരിക്കാം.
- source_word: בָּא
  choice: വന്നു
  rationale: ആഖ്യാനത്തിലെ സാധാരണ ഭൂതകാലക്രിയ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ആഖ്യാനക്രമത്തിലെ אמר എന്ന സാധാരണ സംസാരക്രിയയുടെ സ്വാഭാവിക പരിഭാഷ.
- source_word: יִתְבַּשֵּׂר
  choice: സുവാർത്ത കേൾക്കട്ടെ
  rationale: ഹിത്പയേൽ അപൂർണരൂപത്തിന്റെ ആശംസാ/ആജ്ഞാർഥഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ദൂതൻ രാജാവിനോടു നല്ല വാർത്ത അറിയിക്കുന്ന സന്ദർഭത്തിനും യോജിക്കുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: രാജസദസ്സിലെ ആദരപൂർവമായ അഭിസംബോധന നിലനിർത്തുന്നു; ഇവിടെ ദൈവിക പദവിയെന്ന ധ്വനി വരുത്തുന്നില്ല.
- source_word: כִּי
  choice: (ആശ്ചര്യചിഹ്നത്തിനു പിന്നാലെയുള്ള വിശദീകരണം)
  rationale: നല്ല വാർത്തയുടെ ഉള്ളടക്കവും കാരണവും അടുത്ത വാക്യം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകം ബന്ധപദം ചേർക്കാതെ സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: שְׁפָטְךָ
  choice: അങ്ങേക്കുവേണ്ടി ന്യായം നടത്തിയിരിക്കുന്നു
  rationale: שׁפט എന്ന പദത്തിന്റെ ന്യായവിധി നടത്തുക, ഒരാളുടെ പക്ഷത്ത് നീതി നടപ്പാക്കുക എന്നീ നിയമപരമായ അർഥങ്ങൾ നിലനിർത്തുന്നു; ‘നീതീകരിച്ചു’ എന്ന സാങ്കേതിക ദൈവശാസ്ത്രധ്വനി ഒഴിവാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകി.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചനയുടെ ഊന്നൽ ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: ശത്രുക്കളുടെ അധികാരത്തെയും പിടിയെയും സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യപ്രയോഗം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ നിലനിർത്തി.
- source_word: כָּל הַקָּמִים עָלֶיךָ
  choice: അങ്ങേക്കെതിരെ എഴുന്നേറ്റ എല്ലാവരും
  rationale: קום + על എന്ന പ്രയോഗത്തിലെ ശത്രുതാപൂർവമായ എഴുന്നേൽപ്പിന്റെ ക്രിയാചിത്രം നിലനിർത്തുന്നു; ‘കലാപകാരികൾ’ എന്ന് സന്ദർഭത്തേക്കാൾ അധികം നിർവചിച്ചിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ Yahweh എന്ന രൂപത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകിയിരിക്കുന്നു.
- issue: שְׁפָטְךָ എന്നതിലെ ന്യായവിധി-വിടുതൽ ബന്ധം
  choice: അങ്ങേക്കുവേണ്ടി ന്യായം നടത്തിയിരിക്കുന്നു
  alternative: അങ്ങയെ കുറ്റവിമുക്തനാക്കിയിരിക്കുന്നു / അങ്ങേക്കു നീതി നൽകിയിരിക്കുന്നു
  rationale: വാക്യം യഹ്‌വെ ദാവീദിന്റെ പക്ഷത്ത് ന്യായവിധി നടപ്പാക്കിയെന്ന ആശയം നൽകുന്നു. ‘ന്യായം നടത്തി’ എന്ന രൂപം നിയമപരമായ അർഥവും അതിലൂടെ ലഭിക്കുന്ന വിടുതലും തമ്മിലുള്ള പിരിമുറുക്കം മുൻകൂട്ടി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ആഖ്യാനശൈലി. രാജാവിനോടുള്ള ആദരം സൂചിപ്പിക്കാൻ ‘അങ്ങ്’ രൂപവും രാജസദസ്സിന് യോജിച്ച ‘യജമാനൻ’ എന്ന അഭിസംബോധനയും ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനം നിലനിർത്താൻ ‘കൂശ്യൻ’ രണ്ടുതവണയും നൽകിയിരിക്കുന്നു.
