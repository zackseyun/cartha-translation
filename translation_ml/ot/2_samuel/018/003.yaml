  to: 'എന്നാൽ ജനം പറഞ്ഞു: “അങ്ങ് പുറപ്പെടരുത്. ഞങ്ങൾ ഓടിപ്പോയാൽ അവർ ഞങ്ങളെ ശ്രദ്ധിക്കുകയില്ല[a]; ഞങ്ങളിൽ പകുതിപ്പേർ മരിച്ചാൽ അവർ ഞങ്ങളെ ശ്രദ്ധിക്കുകയില്ല. ഇപ്പോൾ അങ്ങ് ഞങ്ങളിൽ പതിനായിരംപേർക്കു തുല്യനാണ്[b]. അതുകൊണ്ട്, നഗരത്തിൽനിന്ന് ഞങ്ങൾക്ക് സഹായമെത്തിക്കാൻ അങ്ങ് സന്നദ്ധനായിരിക്കുന്നതാണ് നല്ലത്[c].”'
