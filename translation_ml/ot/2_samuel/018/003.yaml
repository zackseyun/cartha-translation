translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. രാജാവായ ദാവീദിനെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ സ്വീകരിച്ചു. സൈനികസന്ദർഭം വ്യക്തമായി നിലനിർത്തിയെങ്കിലും മൂലപാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേക തന്ത്രവിവരങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
