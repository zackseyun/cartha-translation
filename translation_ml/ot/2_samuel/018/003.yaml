source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם לֹ֣א תֵצֵ֗א כִּי֩ אִם נֹ֨ס נָנ֜וּס לֹא יָשִׂ֧ימוּ אֵלֵ֣י/נוּ לֵ֗ב וְ/אִם יָמֻ֤תוּ חֶצְיֵ֨/נוּ֙ לֹֽא יָשִׂ֤ימוּ אֵלֵ֨י/נוּ֙ לֵ֔ב כִּֽי עַתָּ֥ה כָמֹ֖/נוּ עֲשָׂרָ֣ה אֲלָפִ֑ים וְ/עַתָּ֣ה ט֔וֹב כִּי תִֽהְיֶה לָּ֥/נוּ מֵ/עִ֖יר ל/עזיר־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
translation:
  language: ml
  text: 'എന്നാൽ ജനം പറഞ്ഞു: “അങ്ങ് പുറപ്പെടരുത്. ഞങ്ങൾ ഓടിപ്പോയാൽ അവർ ഞങ്ങളെ ശ്രദ്ധിക്കുകയില്ല[a]; ഞങ്ങളിൽ പകുതിപ്പേർ മരിച്ചാൽ അവർ ഞങ്ങളെ ശ്രദ്ധിക്കുകയില്ല. ഇപ്പോൾ അങ്ങ് ഞങ്ങളിൽ പതിനായിരംപേർക്കു തുല്യനാണ്[b]. അതുകൊണ്ട്, നഗരത്തിൽനിന്ന് ഞങ്ങൾക്ക് സഹായമെത്തിക്കാൻ അങ്ങ് സന്നദ്ധനായിരിക്കുന്നതാണ് നല്ലത്[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവർ ഞങ്ങളിലേക്കു ഹൃദയം വെക്കുകയില്ല”; ഞങ്ങളെ പ്രധാനമായി കണക്കാക്കുകയോ ശ്രദ്ധിക്കുകയോ ഇല്ല എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ, “ഇപ്പോൾ അങ്ങ് ഞങ്ങളിൽ പതിനായിരംപേരെപ്പോലെയാണ്.” അർഥം: ദാവീദ് അവരിൽ പതിനായിരംപേരോളം വിലപ്പെട്ടവനാണ്.'
    reason: lexical_alternative
  - marker: c
    text: അവസാന വാക്യഭാഗം ദാവീദ് നഗരത്തിൽ തുടരുകയും ആവശ്യമായാൽ സഹായമോ അധികസേനയോ നൽകുകയും ചെയ്യണമെന്നാണ് സാധാരണയായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കപ്പെടുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תֵצֵא
  choice: അങ്ങ് പുറപ്പെടരുത്
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണക്രിയ ഇവിടെ ശക്തമായ വിലക്കാണ്. ദാവീദിനോടുള്ള ആദരവും വിലക്കിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: כִּי אִם נֹס נָנוּס
  choice: ഞങ്ങൾ ഓടിപ്പോയാലും
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്ന രൂപം ഓടിപ്പോകുന്നതിന് ഊന്നൽ നൽകുന്നു. സന്ദർഭത്തിലെ concessive നിബന്ധന മലയാളത്തിലെ ‘-ആലും’ രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  choice: അവർ ഞങ്ങളെ ഗൗനിക്കുകയില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘ഞങ്ങളിലേക്കു ഹൃദയം വെക്കുകയില്ല’ എന്ന ഈ പ്രയോഗം ശ്രദ്ധയോ പ്രാധാന്യമോ നൽകാതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. യുദ്ധസന്ദർഭത്തിൽ ‘ഗൗനിക്കുകയില്ല’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְאִם יָמֻתוּ חֶצְיֵנוּ
  choice: ഞങ്ങളിൽ പകുതിപ്പേർ മരിച്ചാലും
  rationale: മൂലത്തിലെ ‘മരിക്കുക’ എന്ന ക്രിയയെ ‘കൊല്ലപ്പെട്ടാലും’ എന്ന് വ്യാഖ്യാനപരമായി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  choice: ഇപ്പോൾ അങ്ങ് ഞങ്ങളിൽ പതിനായിരംപേർക്കു തുല്യനാണ്
  rationale: മസോററ്റിക് പാഠത്തിലെ ‘ഞങ്ങളെപ്പോലെ/ഞങ്ങളിൽ പതിനായിരം’ എന്ന താരതമ്യം നിലനിർത്തിക്കൊണ്ട്, ദാവീദിന്റെ താരതമ്യേന വലിയ പ്രാധാന്യം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ‘വിലമതിക്കുന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനപരമായ ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: וְעַתָּה טוֹב
  choice: അതുകൊണ്ട് ... നല്ലത്
  rationale: ഇവിടെ טוֹב അഭിലഷണീയമായ നടപടിയെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ കാരണം-ഫലബന്ധം വ്യക്തമാക്കാൻ ‘അതുകൊണ്ട്’ ചേർത്ത് ‘നല്ലത്’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: מֵעִיר
  choice: നഗരത്തിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗത്തിന്റെ ഉറവിട/സ്ഥാനാർഥം നേരിട്ട് പകർത്തുന്നു.
- source_word: לְעָזִיר
  choice: ഞങ്ങളെ സഹായിക്കാൻ അങ്ങ് തയ്യാറായിരിക്കുന്നതാണ്
  rationale: ഈ രൂപം עזר, ‘സഹായിക്കുക’, എന്ന ധാതുവുമായി ബന്ധപ്പെടുത്തി മനസ്സിലാക്കുന്നു. ദാവീദ് നഗരത്തിൽ തുടരുകയും ആവശ്യമായപ്പോൾ സഹായം നൽകുകയും ചെയ്യണമെന്ന സന്ദർഭസൂചന സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
