- from: 'അപ്പോൾ രാജാവ് കൂശ്യനോട് ചോദിച്ചു: “യുവാവായ അബ്ശാലോമിനു ക്ഷേമമാണോ[a]?” കൂശ്യൻ പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവിന്റെ ശത്രുക്കളും അങ്ങേക്കു ദോഷം വരുത്താൻ എതിരായി എഴുന്നേൽക്കുന്ന എല്ലാവരും ആ യുവാവിനെപ്പോലെ ആയിത്തീരട്ടെ[b].”'
  to: 'അപ്പോൾ രാജാവ് കൂശ്യനോട് ചോദിച്ചു: “യുവാവായ അബ്ശാലോമിനു ക്ഷേമമാണോ[a]?” കൂശ്യൻ പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവിന്റെ ശത്രുക്കളും അങ്ങേക്കെതിരെ ദോഷം ചെയ്യാൻ എഴുന്നേൽക്കുന്ന എല്ലാവരും ആ യുവാവിനെപ്പോലെ ആയിത്തീരട്ടെ[b].”'
  rationale: കָמוּ עָלֶיךָ לְרָעָה എന്ന എബ്രായപ്രയോഗത്തിന്റെ വ്യാകരണബന്ധവും ദോഷോദ്ദേശ്യവും വ്യക്തമായി പ്രകടിപ്പിക്കാൻ മാത്രം വാക്യഭാഗം പുനഃക്രമീകരിച്ചു. മറ്റെല്ലാ ഘടകങ്ങളും നിലനിർത്തി.
