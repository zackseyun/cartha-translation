  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הַ/כּוּשִׁ֔י הֲ/שָׁל֥וֹם לַ/נַּ֖עַר לְ/אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר הַ/כּוּשִׁ֗י יִהְי֤וּ כַ/נַּ֨עַר֙ אֹֽיְבֵי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ וְ/כֹ֛ל אֲשֶׁר קָ֥מוּ עָלֶ֖י/ךָ לְ/רָעָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് കൂശ്യനോട് ചോദിച്ചു: “യുവാവായ അബ്ശാലോമിനു ക്ഷേമമാണോ[a]?” കൂശ്യൻ പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവിന്റെ ശത്രുക്കളും അങ്ങേക്കെതിരെ ദോഷം ചെയ്യാൻ എഴുന്നേൽക്കുന്ന എല്ലാവരും ആ യുവാവിനെപ്പോലെ ആയിത്തീരട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യുവാവായ അബ്ശാലോം സുരക്ഷിതനാണോ?” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ അവന്റെ ‘സമാധാനത്തെ/സുഖസ്ഥിതിയെ’ (ശാലോം) കുറിച്ചാണ് ചോദിക്കുന്നത്; ജീവിച്ചിരിപ്പോ സുരക്ഷയോ മാത്രമല്ല, അതിലും വിശാലമായ അർഥമുള്ള പദമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: കൂശ്യൻ പരോക്ഷമായാണ് മറുപടി പറയുന്നത്. അബ്ശാലോം മരിച്ചുവെന്ന് തുറന്നുപറയാതെ, രാജാവിന്റെ ശത്രുക്കൾക്ക് യോജിച്ച ഗതി അവനും സംഭവിച്ചുവെന്ന് അവന്റെ വാക്കുകൾ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  choice: കൂശ്യൻ
  rationale: കൂശ് ദേശക്കാരനെ സൂചിപ്പിക്കുന്ന ജനവിഭാഗനാമമാണിത്. എബ്രായത്തിലെ ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയൽ നിലനിർത്തുകയും പിൽക്കാലത്തെ കൂടുതൽ സങ്കുചിതമായ ‘എത്യോപ്യൻ’ എന്ന തിരിച്ചറിയൽ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: הֲשָׁלוֹם
  choice: ക്ഷേമമാണോ
  rationale: שָׁלוֹם ഇവിടെ ജീവിച്ചിരിപ്പോ സുരക്ഷയോ മാത്രം ചോദിക്കുന്നതല്ല; സമാധാനം, സുഖസ്ഥിതി, ക്ഷേമം എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥത്തിലാണ്. ‘ക്ഷേമമാണോ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ വിശാലത നിലനിർത്തുന്നു.
- source_word: לַנַּעַר
  choice: യുവാവായ
  rationale: נַעַר എന്നതിന് ബാലൻ, യുവാവ് തുടങ്ങിയ അർഥങ്ങളുണ്ടെങ്കിലും അബ്ശാലോം പ്രായപൂർത്തിയായ മകനായതിനാൽ ‘യുവാവ്’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: לְאַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന അംഗീകൃത മലയാള ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: יִהְיוּ
  choice: ആയിത്തീരട്ടെ
  rationale: ഇവിടെയുള്ള ജസ്സീവ് രൂപം ഒരു ആഗ്രഹമോ ശാപാത്മകമായ ആശംസയോ പ്രകടിപ്പിക്കുന്നു; ‘ആയിത്തീരട്ടെ’ അതിന്റെ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כַנַּעַר
  choice: ആ യുവാവിനെപ്പോലെ
  rationale: כְּ താരതമ്യം സൂചിപ്പിക്കുന്നു. ‘ആ യുവാവ്’ മുമ്പ് പരാമർശിച്ച അബ്ശാലോമിലേക്കുള്ള പരോക്ഷ സൂചന നിലനിർത്തുന്നു; അവന്റെ മരണം നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല.
- source_word: אֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവിന്റെ ശത്രുക്കൾ
  rationale: രാജസന്നിധിയിലെ ആദരപൂർവമായ അഭിസംബോധനയും എബ്രായത്തിലെ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: קָמוּ עָלֶיךָ
  choice: അങ്ങേക്കു ... എതിരായി എഴുന്നേൽക്കുന്ന
  rationale: קום על എന്ന പ്രയോഗം ശത്രുതാപരമായ എതിർപ്പോ കലാപമോ സൂചിപ്പിക്കുന്നു. രാജാവിനോടുള്ള ബഹുമാനം ‘അങ്ങ്’ എന്ന രൂപത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: לְרָעָה
  choice: ദോഷം വരുത്താൻ
  rationale: ദോഷകരമായ ഉദ്ദേശ്യമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘ദോഷം വരുത്താൻ’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיֹּאמֶר
  choice: ചോദിച്ചു / പറഞ്ഞു
  rationale: ആദ്യ സന്ദർഭത്തിൽ വാക്കുകൾ ചോദ്യമായതിനാൽ ‘ചോദിച്ചു’ എന്നും മറുപടിയിൽ ‘പറഞ്ഞു’ എന്നും നൽകുന്നത് ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായ ആഖ്യാനശൈലി സൃഷ്ടിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും അന്തസ്സുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. രാജാവിനോടുള്ള ആദരം ‘അങ്ങ്’ എന്ന അഭിസംബോധനയിൽ നിലനിർത്തി. കൂശ്യന്റെ മറുപടിയിലെ ഉദ്ദേശപൂർവമായ പരോക്ഷത വിശദീകരിച്ച് തീർക്കാതെ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
