id: 2SA.18.6
reference: 2 Samuel 18:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֥א הָ/עָ֛ם הַ/שָּׂדֶ֖ה לִ/קְרַ֣את יִשְׂרָאֵ֑ל וַ/תְּהִ֥י הַ/מִּלְחָמָ֖ה בְּ/יַ֥עַר אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/006.yaml
  text: So the troops went out into the field to meet Israel[a], and the battle took place in the forest of Ephraim.
translation:
  language: ml
  text: അങ്ങനെ സൈന്യം ഇസ്രായേലിനെ നേരിടാൻ തുറസ്സായ സ്ഥലത്തേക്കു പുറപ്പെട്ടു; യുദ്ധം എഫ്രയീമിന്റെ വനത്തിൽ നടന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘ജനം’; ഇവിടെ അത് ദാവീദിന്റെ പോരാളികളെയാണ് സൂചിപ്പിക്കുന്നത്, അതിനാൽ ‘സൈന്യം’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: സൈന്യം
  rationale: സാധാരണയായി ‘ജനം’ എന്നാണ് അർഥമെങ്കിലും, ഈ സൈനിക സന്ദർഭത്തിൽ ദാവീദിന്റെ പോരാളികളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘സൈന്യം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הַשָּׂדֶה
  choice: തുറസ്സായ സ്ഥലത്തേക്ക്
  rationale: ഈ പദത്തിന് ‘വയൽ/തുറസ്സായ പ്രദേശം’ എന്ന അർഥമുണ്ട്. യുദ്ധത്തിനായി പുറപ്പെടുന്ന സന്ദർഭത്തിൽ ‘തുറസ്സായ സ്ഥലത്തേക്ക്’ എന്നത് ഭൂപ്രകൃതിയെ അനാവശ്യമായി ‘വയൽ’ എന്നു ചുരുക്കാതെ അർഥം നൽകുന്നു.
- source_word: לִקְרַאת
  choice: നേരിടാൻ
  rationale: അടിസ്ഥാന അർഥം ‘കാണാൻ/എതിരേ ചെല്ലാൻ’ എന്നതാണ്; ഇവിടെ സൈനിക ഏറ്റുമുട്ടലായതിനാൽ ‘നേരിടാൻ’ വൈരപരമായ സന്ദർഭം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: സന്ദർഭത്തിൽ അബ്ശാലോമിനോടൊപ്പമുള്ള എതിർസൈന്യത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തിലെ ദേശീയനാമം അതേപടി നിലനിർത്തുന്നു.
- source_word: הַמִּלְחָמָה
  choice: യുദ്ധം
  rationale: ഇവിടെ വിവരിക്കുന്ന പ്രത്യേക സൈനിക ഏറ്റുമുട്ടലിന് മലയാളത്തിൽ സ്വാഭാവികമായ പദം ‘യുദ്ധം’ ആണ്.
- source_word: וַתְּהִי
  choice: നടന്നു
  rationale: അക്ഷരാർഥം ‘ഉണ്ടായി/ആയി’ എന്നാണെങ്കിലും, സംഭവനാമത്തോടൊപ്പം ‘യുദ്ധം നടന്നു’ എന്നത് സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: בְּיַעַר אֶפְרָיִם
  choice: എഫ്രയീംവനത്തിൽവെച്ചു
  rationale: יַעַר എന്നത് ‘വനം/കാട്’ എന്നാണ്. സ്ഥലനാമത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ ചോദ്യങ്ങൾ പരിഹരിക്കാൻ ശ്രമിക്കാതെ എബ്രായ നിർമാണം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
