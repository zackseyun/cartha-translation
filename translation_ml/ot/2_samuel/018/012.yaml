translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കൈവെള്ളകളിൽ തൂക്കിത്തന്നാലും’ എന്ന രൂപം മൂലത്തിലെ തൂക്കിനൽകുന്ന ദൃശ്യം സംരക്ഷിക്കുന്നു; ദുഷ്കരമായ അവസാന എബ്രായരൂപം മുഖ്യപാഠത്തിൽ നിശ്ശബ്ദമായി മറയ്ക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
