  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ אֶל יוֹאָ֔ב ו/לא אָנֹכִ֜י שֹׁקֵ֤ל עַל כַּפַּ/י֙ אֶ֣לֶף כֶּ֔סֶף לֹֽא אֶשְׁלַ֥ח יָדִ֖/י אֶל בֶּן הַ/מֶּ֑לֶךְ כִּ֣י בְ/אָזְנֵ֜י/נוּ צִוָּ֣ה הַ/מֶּ֗לֶךְ אֹ֠תְ/ךָ וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר שִׁמְרוּ מִ֕י בַּ/נַּ֖עַר בְּ/אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
translation:
  language: ml
  text: 'എന്നാൽ ആ മനുഷ്യൻ യോവാബിനോടു പറഞ്ഞു: “എന്റെ കൈവെള്ളങ്ങളിൽ ആയിരം വെള്ളി തൂക്കിവെച്ചാലും[a], രാജാവിന്റെ മകനെതിരെ ഞാൻ കൈവെക്കുകയില്ല. കാരണം, രാജാവ് നിന്നോടും അബീശായിയോടും ഇത്തായിയോടും, ‘എനിക്കുവേണ്ടി യുവാവായ അബ്ശാലോമിനെ കാത്തുകൊള്ളുവിൻ’ എന്നു കല്പിച്ചത് ഞങ്ങൾ സ്വന്തം ചെവികൊണ്ട് കേട്ടതാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: “എന്റെ കൈവെള്ളങ്ങളിൽ ആയിരം വെള്ളി തൂക്കിയാലും.” വലിയൊരു പ്രതിഫലം വെള്ളിയുടെ തൂക്കമനുസരിച്ച് ലഭിക്കുന്നതാണു സൂചന; മൂലപാഠത്തിൽ അളവിന്റെ ഏകകം പറഞ്ഞിട്ടില്ല.'
    reason: lexical_alternative
  - marker: b
    text: വാക്യത്തിന്റെ അവസാനഭാഗത്തുള്ള എബ്രായപാഠം ദുഷ്കരമാണ്; അക്ഷരാർഥത്തിൽ, “യുവാവായ അബ്ശാലോമിനെ מי കാത്തുകൊള്ളുവിൻ.” 18:5-ലെ സമാന്തര കല്പനയുടെ അടിസ്ഥാനത്തിൽ പലരും ഇതിനെ “എനിക്കുവേണ്ടി യുവാവായ അബ്ശാലോമിനെ കാത്തുകൊള്ളുവിൻ” എന്നു മനസ്സിലാക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  choice: ആയിരം വെള്ളിനാണയങ്ങൾ എന്റെ കൈവെള്ളകളിൽ തൂക്കിത്തന്നാലും
  rationale: വെള്ളി തൂക്കി കൈകളിൽ പ്രതിഫലമായി നൽകുന്ന ദൃശ്യവും സോപാധികമായ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. മൂലത്തിൽ അളവിന്റെ ഏകകം വ്യക്തമല്ലാത്തതിനാൽ ‘ശേക്കെൽ’ എന്ന് നിർണ്ണയിച്ചില്ല.
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  choice: കൈ ഉയർത്തുകയില്ല
  rationale: ആർക്കെങ്കിലും എതിരെ അക്രമിക്കാൻ കൈ നീട്ടുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥവും കൈയുടെ ദൃശ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֶּן הַמֶּלֶךְ
  choice: രാജാവിന്റെ മകൻ
  rationale: രാജകീയ ബന്ധത്തെ നേരായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: בְאָזְנֵינוּ
  choice: ഞങ്ങൾ സ്വന്തം ചെവികൊണ്ട് കേട്ടതാണ്
  rationale: കല്പന നേരിട്ട് കേട്ടവരാണെന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചത്
  rationale: രാജാവിന്റെ അധികാരപൂർവമായ നിർദേശം സൂചിപ്പിക്കുന്നു.
- source_word: שִׁמְרוּ
  choice: കാത്തുകൊള്ളുവിൻ
  rationale: അബ്ശാലോമിനെ അപകടത്തിൽനിന്ന് സംരക്ഷിക്കുക എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുകയും ബഹുവചന കല്പനാഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: എനിക്കുവേണ്ടി യുവാവായ അബ്ശാലോമിനെ
  rationale: മസോററ്റിക് രൂപം ദുഷ്കരമാണെങ്കിലും 18:5-ലെ സമാന്തര കല്പനയുടെ അടിസ്ഥാനത്തിൽ മുഖ്യപാഠത്തിൽ സാധ്യതയേറിയ അർഥം നൽകുന്നു; പാഠപ്രശ്നം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: നിശ്ചയാർഥക ഉപപദം കഥയിലെ നിർദിഷ്ട മനുഷ്യനെ സൂചിപ്പിക്കുന്നതിനാൽ അതു നിലനിർത്തുന്നു.
- source_word: וְלֹא אָנֹכִי
  choice: തന്നാലും ... ഞാൻ ... ഇല്ല
  rationale: പ്രതിഫലം എത്ര വലുതായാലും താൻ അങ്ങനെ ചെയ്യില്ലെന്ന വക്താവിന്റെ ഊന്നിയ നിരാകരണം concessive രൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
