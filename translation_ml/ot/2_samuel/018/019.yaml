  source_fidelity: മുഖ്യവാചകത്തിലെ “അവന് നീതി നേടിക്കൊടുത്തിരിക്കുന്നു” എന്ന പ്രയോഗം യഹ്‌വെ രാജാവിനുവേണ്ടി നീതി ‘നേടുന്നു’ എന്ന അസ്വാഭാവികവും അൽപം വഴിതെറ്റിക്കുന്നതുമായ ആശയം സൃഷ്ടിക്കുന്നു. שְׁפָטוֹ എന്ന ക്രിയയുടെ ന്യായവിധി/നീതിനടത്തൽ അർഥവും ശത്രുക്കളുടെ അധികാരത്തിൽനിന്നുള്ള വിടുതൽ എന്ന സന്ദർഭാർഥവും വ്യക്തമായി നിലനിർത്തണം.
  naturalness: “സദ്വാർത്ത” സാധാരണമായി ഗ്രഹിക്കാവുന്നതാണെങ്കിലും ആധുനിക മലയാളത്തിൽ അതിന് ശക്തമായ സാങ്കേതിക ക്രൈസ്തവ അനുരണനമുണ്ട്. ഇവിടെ സാധാരണ വിജയവാർത്തയെ സൂചിപ്പിക്കുന്നതിനാൽ “വാർത്ത” മുഖ്യവാചകത്തിൽ കൂടുതൽ നിഷ്പക്ഷവും സ്വാഭാവികവുമാണ്. പരിഷ്കരിച്ച വാക്യം നേരിട്ടുള്ള സംഭാഷണത്തിൽ സ്വാഭാവികമാണ്.
  terminology: അഹീമാസ്, സാദോക്ക്, രാജാവ്, യഹ്‌വെ എന്നീ പേരുകളും പദവിയും ഉചിതമാണ്. യഹ്‌വെ എന്ന ദൈവനാമ-ലിപ്യന്തരണം മൂലപാഠത്തോടും നിശ്ചിത നയത്തോടും യോജിക്കുന്നു. “അവനുവേണ്ടി ന്യായം നടത്തി ... വിടുവിച്ചിരിക്കുന്നു” ന്യായവിധിയും വിടുതലും ചേർന്ന സന്ദർഭാർഥം നിഷ്പക്ഷമായി നൽകുന്നു.
