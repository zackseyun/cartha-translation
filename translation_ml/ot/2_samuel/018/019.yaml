id: 2SA.18.19
reference: 2 Samuel 18:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲחִימַ֤עַץ בֶּן צָדוֹק֙ אָמַ֔ר אָר֣וּצָה נָּ֔א וַ/אֲבַשְּׂרָ֖ה אֶת הַ/מֶּ֑לֶךְ כִּי שְׁפָט֥/וֹ יְהוָ֖ה מִ/יַּ֥ד אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
translation:
  language: ml
  text: 'അപ്പോൾ സാദോക്കിന്റെ മകനായ അഹീമാസ് പറഞ്ഞു: “ദയവായി, ഞാൻ ഓടി രാജാവിനോടു വാർത്ത അറിയിക്കട്ടെ[a]; യഹ്‌വെ അവനുവേണ്ടി ന്യായം നടത്തി അവനെ അവന്റെ ശത്രുക്കളുടെ കൈയിൽനിന്ന് വിടുവിച്ചിരിക്കുന്നുവല്ലോ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജാവിനോടു സദ്വാർത്ത അറിയിക്കട്ടെ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് അനുകൂലമായ വാർത്ത അറിയിക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “യഹ്‌വെ അവനുവേണ്ടി ന്യായം നിർവഹിച്ചിരിക്കുന്നു.” എബ്രായ പ്രയോഗം ന്യായവിധിയിലൂടെയുള്ള നീതീകരണത്തെ സൂചിപ്പിക്കുന്നു; ശത്രുക്കളുടെ കൈയിൽനിന്നുള്ള വിടുതൽ അതിന്റെ സന്ദർഭപരമായ ഫലമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ בֶּן צָדוֹק אָמַר
  choice: അപ്പോൾ സാദോക്കിന്റെ മകനായ അഹീമാസ് പറഞ്ഞു
  rationale: വാവ് ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമത്തിന് ‘അപ്പോൾ’ ഉപയോഗിച്ചു; പുത്രബന്ധവും പേരുകളും നേരിട്ട് നിലനിർത്തി.
- source_word: אָרוּצָה נָּא
  choice: ദയവായി, ഞാൻ ഓടിച്ചെന്ന് … അറിയിക്കട്ടെ
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിലെ ആഗ്രഹം/അനുമതി അഭ്യർഥിക്കൽ ‘അറിയിക്കട്ടെ’ എന്നതിലൂടെയും נָאയുടെ വിനയപൂർവമായ അഭ്യർഥന ‘ദയവായി’ എന്നതിലൂടെയും പ്രകടമാക്കുന്നു.
- source_word: וַ/אֲבַשְּׂרָה אֶת הַ/מֶּלֶךְ
  choice: രാജാവിനെ സദ്വാർത്ത അറിയിക്കട്ടെ
  rationale: בשׂר എന്ന പിയേൽ ക്രിയയ്ക്ക് വാർത്ത, പലപ്പോഴും അനുകൂല വാർത്ത, അറിയിക്കുക എന്ന അർഥമുണ്ട്. ഇവിടെ വിജയവാർത്തയായതിനാൽ ‘സദ്വാർത്ത’ സന്ദർഭോചിതമാണ്; പിന്നീട് രൂപപ്പെട്ട സാങ്കേതിക മതാർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: כִּי
  choice: …വല്ലോ
  rationale: വാർത്ത അറിയിക്കാനുള്ള കാരണവും അതിന്റെ ഉള്ളടക്കവും അവതരിപ്പിക്കുന്ന ബന്ധം, മലയാളത്തിലെ നേരിട്ടുള്ള സംഭാഷണത്തിൽ സ്വാഭാവികമായ വിശദീകരണഭാവമുള്ള ‘വല്ലോ’യിലൂടെ നൽകി.
- source_word: שְׁפָטוֹ
  choice: അവന് നീതി നേടിക്കൊടുത്തിരിക്കുന്നു
  rationale: שׁפט ഇവിടെ വെറും രക്ഷപ്പെടുത്തൽ മാത്രമല്ല, രാജാവിനുവേണ്ടിയുള്ള ന്യായവിധിയും നീതീകരണവും സൂചിപ്പിക്കുന്നു. അതിനാൽ നീതിന്യായ ഭാവം മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ പ്രചാരത്തിലുള്ള ശബ്ദലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: מִ/יַּד אֹיְבָיו
  choice: അവന്റെ ശത്രുക്കളുടെ കൈയിൽനിന്ന്
  rationale: ‘കൈ’ അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യപ്രയോഗമാണ്; മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ ചിത്രം നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദനാമംകൊണ്ട് പകരാതെ നിലനിർത്തുന്നു; ‘യഹ്‌വെ’ എന്നത് Yahweh-യുടെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണമാണ്.
- issue: שְׁפָטוֹ എന്നതിലെ ന്യായവിധി-വിടുതൽ ബന്ധം
  choice: അവന് നീതി നേടിക്കൊടുത്തിരിക്കുന്നു
  alternative: അവനെ വിടുവിച്ചിരിക്കുന്നു / അവനുവേണ്ടി ന്യായം വിധിച്ചിരിക്കുന്നു
  rationale: സന്ദർഭത്തിൽ ഫലം ശത്രുക്കളിൽനിന്നുള്ള വിടുതലാണെങ്കിലും ക്രിയയുടെ ന്യായവിധിസംബന്ധിയായ അർഥം മായ്ച്ചുകളയാതെ നിലനിർത്തി; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സദ്വാർത്ത’ സാധാരണ വിജയവാർത്ത എന്ന അർഥത്തിലാണ്; പ്രത്യേക സാങ്കേതിക മതാർഥം ഇവിടെ ചുമത്തിയിട്ടില്ല. മൂലത്തിലെ ന്യായവിധി-വിടുതൽ സംഘർഷം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
