- from: 'അപ്പോൾ സാദോക്കിന്റെ മകനായ അഹീമാസ് പറഞ്ഞു: “ദയവായി, ഞാൻ ഓടിച്ചെന്ന് രാജാവിനെ സദ്വാർത്ത അറിയിക്കട്ടെ[a]; യഹ്‌വെ അവന്റെ ശത്രുക്കളുടെ കൈയിൽനിന്ന് അവന് നീതി നേടിക്കൊടുത്തിരിക്കുന്നുവല്ലോ[b].”'
  to: 'അപ്പോൾ സാദോക്കിന്റെ മകനായ അഹീമാസ് പറഞ്ഞു: “ദയവായി, ഞാൻ ഓടി രാജാവിനോടു വാർത്ത അറിയിക്കട്ടെ[a]; യഹ്‌വെ അവനുവേണ്ടി ന്യായം നടത്തി അവനെ അവന്റെ ശത്രുക്കളുടെ കൈയിൽനിന്ന് വിടുവിച്ചിരിക്കുന്നുവല്ലോ[b].”'
  rationale: ശത്രുക്കളിൽനിന്നുള്ള വിടുതലിന്റെ സന്ദർഭം നഷ്ടപ്പെടുത്താതെ שְׁפָטוֹ-യിലെ ന്യായവിധിസംബന്ധിയായ അർഥം “അവനുവേണ്ടി ന്യായം നടത്തി” എന്നതിലൂടെ വ്യക്തമാക്കി. “വിടുവിച്ചിരിക്കുന്നുവല്ലോ” മൂലത്തിലെ ശത്രുക്കളുടെ ‘കൈയിൽനിന്ന്’ എന്ന ദൃശ്യപ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ ഉൾക്കൊള്ളിക്കുന്നു. നല്ല വാർത്ത എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി, മുഖ്യവാചകത്തിൽ നിഷ്പക്ഷമായ “വാർത്ത” ഉപയോഗിച്ചു.
