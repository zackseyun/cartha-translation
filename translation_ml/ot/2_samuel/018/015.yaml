  yaml_path: translation/ot/2_samuel/018/015.yaml
  text: Then ten young men, Joab’s armor-bearers, surrounded Absalom and struck him and killed him.
translation:
  language: ml
  text: അപ്പോൾ യോവാബിന്റെ ആയുധവാഹകരായ പത്തു യുവാക്കൾ അബ്ശാലോമിനെ വളഞ്ഞ് അടിച്ചു കൊന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: വളഞ്ഞ്
  rationale: סבב ഇവിടെ ഒരാളെ ചുറ്റി വളയുന്ന സൈനികനടപടിയെ സൂചിപ്പിക്കുന്നു. ‘വളഞ്ഞ്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളമാണ്.
- source_word: עֲשָׂרָה נְעָרִים
  choice: പത്തു യുവാക്കൾ
  rationale: נְעָרִים ഇവിടെ കുട്ടികളെയല്ല, സൈനികസേവനത്തിലുള്ള യുവാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. അവരുടെ കൃത്യമായ പദവി അധികമായി നിർവചിക്കാതെ മൂലപദത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  choice: യോവാബിന്റെ ആയുധവാഹകർ
  rationale: ഈ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം യോവാബിന്റെ ആയുധങ്ങളോ സൈനികോപകരണങ്ങളോ വഹിക്കുന്നവർ എന്നാണ്. ‘ആയുധവാഹകർ’ സൈനികസന്ദർഭത്തിൽ കൃത്യവും വ്യക്തവുമാണ്.
- source_word: וַיַּכּוּ
  choice: അടിച്ചു
  rationale: נכה എന്ന ക്രിയയ്ക്ക് അടിക്കുക, പ്രഹരിക്കുക എന്നീ വിശാലാർഥങ്ങളുണ്ട്. ‘അടിച്ചു’ പ്രവർത്തിയെ നേരിട്ട് അവതരിപ്പിക്കുകയും പിന്നാലെയുള്ള ‘കൊന്നു’ എന്ന ഫലത്തിൽനിന്ന് അതിനെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְמִיתֻהוּ
  choice: കൊന്നു
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘മരിക്കാൻ ഇടയാക്കുക’, അഥവാ ‘കൊല്ലുക’ എന്നാണ്. ‘കൊന്നു’ ഏറ്റവും നേരിട്ടും സ്വാഭാവികമായും അർഥം നൽകുന്നു.
- source_word: אַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വ്യക്തമായി വായിക്കാവുന്ന ലിപ്യന്തരണം.
