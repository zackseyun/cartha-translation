  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി. എബ്രായ ക്രിയാശൃംഖലയുടെ വേഗതയും സംഭവക്രമവും ‘വളഞ്ഞ് അടിച്ചു കൊന്നു’ എന്ന സംക്ഷിപ്ത ഘടനയിൽ നിലനിർത്തിയിരിക്കുന്നു.
