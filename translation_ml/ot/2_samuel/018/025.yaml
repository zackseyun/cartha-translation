translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അവന്റെ വായിൽ’ എന്ന ഹീബ്രായ ദൃശ്യപ്രയോഗം ബോധപൂർവം നിലനിർത്തി; വാർത്തയുടെ അനുകൂലസ്വഭാവം പ്രധാനപാഠത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
