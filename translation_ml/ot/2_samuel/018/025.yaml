  yaml_path: translation/ot/2_samuel/018/025.yaml
  text: Then the watchman called out and told the king. And the king said[a], “If he is by himself, there is news in his mouth.” And he kept coming nearer and nearer.
translation:
  language: ml
  text: 'അപ്പോൾ കാവൽക്കാരൻ ഉറക്കെ വിളിച്ച് രാജാവിനെ വിവരം അറിയിച്ചു. രാജാവ് പറഞ്ഞു: “അവൻ തനിച്ചാണെങ്കിൽ, അവന്റെ പക്കൽ വാർത്തയുണ്ട്[a].” അവൻ കൂടുതൽ കൂടുതൽ അടുത്തുവന്നുകൊണ്ടിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വാർത്ത’ എന്നതിനുള്ള ഹീബ്രായപദത്തിന് ‘നല്ല വാർത്ത’ എന്നും അർഥമാകാം; ഈ സന്ദർഭത്തിൽ അനുകൂലവാർത്തയാണ് ഉദ്ദേശിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: കാവൽക്കാരൻ
  rationale: കാവൽനിൽക്കാൻ നിയോഗിക്കപ്പെട്ട ആളെയാണ് ഈ നാമരൂപം സൂചിപ്പിക്കുന്നത്; നഗരകവാടത്തിന്റെയും സൈനികസാഹചര്യത്തിന്റെയും പശ്ചാത്തലത്തിൽ ‘കാവൽക്കാരൻ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וַיִּקְרָא
  choice: ഉറക്കെ വിളിച്ച്
  rationale: കാവൽക്കാരൻ കണ്ട കാര്യം രാജാവിനെ കേൾപ്പിക്കാനായി ശബ്ദമുയർത്തുന്നതാണ് സന്ദർഭം; ‘ഉറക്കെ വിളിച്ച്’ ആ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיַּגֵּד לַמֶּלֶךְ
  choice: രാജാവിനെ വിവരം അറിയിച്ചു
  rationale: നגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ അറിയിക്കുക അഥവാ റിപ്പോർട്ട് ചെയ്യുക എന്നാണ്; ആ ഔദ്യോഗിക റിപ്പോർട്ടിന്റെ ഭാവം ഈ പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִם לְבַדּוֹ
  choice: അവൻ തനിച്ചാണെങ്കിൽ
  rationale: ലְבַדּוֹ എന്നത് നേരിട്ട് ‘തനിച്ച്/ഒറ്റയ്ക്ക്’ എന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ചലനത്തെ അനാവശ്യമായി ചേർക്കാതെ മൂലപാഠത്തോട് ചേർന്ന് നിൽക്കുന്നു.
- source_word: בְּשׂוֹרָה
  choice: വാർത്ത
  rationale: ഈ നാമത്തിന് പൊതുവായി ‘വാർത്ത’ എന്നും സന്ദർഭാനുസരിച്ച് ‘നല്ല വാർത്ത’ എന്നും അർഥമാകാം. ഇവിടെ അനുകൂലവാർത്തയെന്ന സൂചനയുണ്ടെങ്കിലും മൂലപദം അതിനെ നിർബന്ധമായി വ്യക്തമാക്കാത്തതിനാൽ പ്രധാനപാഠത്തിൽ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בְּפִיו
  choice: അവന്റെ വായിൽ
  rationale: ഹീബ്രായയിലെ ‘അവന്റെ വായിൽ’ എന്ന ദൃശ്യപ്രയോഗം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതായതിനാൽ അതേ രൂപത്തിൽ നിലനിർത്തി.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  choice: അവൻ അടുത്തടുത്ത് വന്നുകൊണ്ടിരുന്നു
  rationale: ഈ ക്രിയാസംയോജനം തുടർച്ചയായ സമീപനത്തെ സൂചിപ്പിക്കുന്നു; ‘അടുത്തടുത്ത് വന്നുകൊണ്ടിരുന്നു’ അതിന്റെ പുരോഗമനസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
