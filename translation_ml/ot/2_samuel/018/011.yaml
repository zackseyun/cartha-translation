source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֗ב לָ/אִישׁ֙ הַ/מַּגִּ֣יד ל֔/וֹ וְ/הִנֵּ֣ה רָאִ֔יתָ וּ/מַדּ֛וּעַ לֹֽא הִכִּית֥/וֹ שָׁ֖ם אָ֑רְצָ/ה וְ/עָלַ֗/י לָ֤/תֶת לְ/ךָ֙ עֲשָׂ֣רָה כֶ֔סֶף וַ/חֲגֹרָ֖ה אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
translation:
  language: ml
  text: 'അപ്പോൾ യോവാബ് തന്നോടു വിവരം അറിയിച്ച മനുഷ്യനോടു പറഞ്ഞു: “നീ അവനെ കണ്ടല്ലോ! പിന്നെ എന്തുകൊണ്ടാണ് അവിടെവെച്ച് അവനെ അടിച്ചു നിലത്തിടാതിരുന്നത്? നിനക്കു പത്തു വെള്ളിക്കഷണങ്ങളും[a] ഒരു അരപ്പട്ടയും നൽകേണ്ടത് എന്റെ ബാധ്യതയായിരുന്നേനേ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘പത്തു വെള്ളി’ എന്നാണ്; പ്രത്യേക അളവോ നാണയയൂണിറ്റോ പറഞ്ഞിട്ടില്ല. സ്വാഭാവിക മലയാളത്തിനായി ‘വെള്ളിക്കഷണങ്ങൾ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഞാൻ നിനക്കു പത്തു വെള്ളിക്കഷണങ്ങളും ഒരു അരപ്പട്ടയും നൽകുമായിരുന്നു.’ ഹീബ്രു പ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘നിനക്കു നൽകുന്നത് എന്റെമേൽ ആയിരുന്നു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגִּיד לֹו
  choice: തന്നോടു വിവരം അറിയിച്ച മനുഷ്യൻ
  rationale: നിശ്ചയാർഥക കർത്തൃവാചക പങ്കാളിത്തരൂപം ഇവിടെ നാമപദമായി പ്രവർത്തിക്കുന്നു. മുൻപ് യോവാബിനോടു വിവരം അറിയിച്ച ആളെയാണ് സ്വാഭാവികമായ മലയാളത്തിൽ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: וְהִנֵּה רָאִיתָ
  choice: നീ അവനെ കണ്ടല്ലോ!
  rationale: וְהִנֵּה യോവാബിന്റെ ഊന്നലോടെയുള്ള പ്രതികരണമാണ് അവതരിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘കണ്ടല്ലോ’ ദർശനക്രിയയെയും ആ ചൂണ്ടിക്കാട്ടൽഭാവത്തെയും സ്വാഭാവികമായി ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു; ‘അവനെ’ എന്ന കർമം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
- source_word: הִכִּיתוֹ שָׁם אָרְצָה
  choice: അവിടെവെച്ച് അവനെ അടിച്ചു നിലത്തിടുക
  rationale: נכה എന്നത് അടിസ്ഥാനമായി ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്നാണ്; സന്ദർഭത്തിൽ മരണകരമായ പ്രഹരം ഉദ്ദേശിച്ചേക്കാമെങ്കിലും ‘കൊല്ലുക’ എന്നു തീർപ്പാക്കാതെ മൂലരൂപത്തിലെ ദൃശ്യഭാവം നിലനിർത്തുന്നു. אָרְצָה എന്ന ദിശാഭാവം ‘നിലത്തിടുക’ വഴി വ്യക്തമാകുന്നു.
- source_word: וְעָלַי לָתֶת לְךָ
  choice: നിനക്കു … നൽകേണ്ടത് എന്റെ ബാധ്യതയായിരുന്നേനേ
  rationale: עָלַי + ക്രിയാനാമരൂപം ‘എന്റെമേൽ ആയിരുന്നു/എന്റെ ബാധ്യതയായിരുന്നു’ എന്ന ബാധ്യതാഭാവം വഹിക്കുന്നു. വെറും ‘ഞാൻ നൽകുമായിരുന്നു’ എന്നതിനെക്കാൾ ഈ തിരഞ്ഞെടുപ്പ് ആ ഹീബ്രു പ്രയോഗത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: עֲשָׂרָה כֶסֶף
  choice: പത്തു വെള്ളിക്കഷണങ്ങൾ
  rationale: ഹീബ്രുവിൽ അളവോ നാണയയൂണിറ്റോ വ്യക്തമാക്കാതെ അക്ഷരാർഥത്തിൽ ‘പത്തു വെള്ളി’ എന്നാണ്. സ്വാഭാവിക മലയാളത്തിനായി ‘കഷണങ്ങൾ’ ചേർത്തു; ‘ശേക്കെൽ’ എന്നു നിർദിഷ്ടമാക്കിയില്ല.
- source_word: חֲגֹרָה אֶחָת
  choice: ഒരു അരപ്പട്ട
  rationale: חֲגֹרָה അരയിൽ കെട്ടുന്ന പട്ടയെയോ കച്ചയെയോ സൂചിപ്പിക്കുന്നു. ‘അരപ്പട്ട’ ആ വസ്തുവിനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; אֶחָת എന്ന സംഖ്യ ‘ഒരു’ ആയി നിലനിർത്തി.
theological_decisions:
- issue: യോവാബിന്റെ പ്രതിഫലവാഗ്ദാനത്തിലെ ബാധ്യതാഭാവം
  choice: ‘നൽകേണ്ടത് എന്റെ ബാധ്യതയായിരുന്നേനേ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ഞാൻ നൽകുമായിരുന്നു’
  rationale: മൂലത്തിലെ עָלַי + infinitive ബാധ്യതയെയോ തനിക്കു ചുമത്തപ്പെട്ട കാര്യമെയോ സൂചിപ്പിക്കുന്നു. അതിനെ സാധാരണ ഭാവികാല വാഗ്ദാനമായി മാത്രം ചുരുക്കാതെ മൂലത്തിലെ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ ഗദ്യശൈലി. യോവാബിന്റെ മൂർച്ചയുള്ള ചോദ്യം ‘കണ്ടല്ലോ!’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി. അനാവശ്യമായി ‘കൊല്ലുക’ എന്നു വ്യാഖ്യാനിക്കാതെ പ്രഹരത്തിന്റെയും നിലത്തേക്കുള്ള ദിശയുടെയും ഭാഷ സംരക്ഷിച്ചു.
