source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/מֶּ֔לֶךְ אֲשֶׁר יִיטַ֥ב בְּ/עֵינֵי/כֶ֖ם אֶעֱשֶׂ֑ה וַ/יַּעֲמֹ֤ד הַ/מֶּ֨לֶךְ֙ אֶל יַ֣ד הַ/שַּׁ֔עַר וְ/כָל הָ/עָם֙ יָֽצְא֔וּ לְ/מֵא֖וֹת וְ/לַ/אֲלָפִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
translation:
  language: ml
  text: 'രാജാവ് അവരോടു പറഞ്ഞു: “നിങ്ങൾക്ക് നല്ലതെന്നു തോന്നുന്നത് ഞാൻ ചെയ്യും.” അങ്ങനെ രാജാവ് കവാടത്തിനരികെ നിന്നു; ജനമെല്ലാം നൂറുപേരും ആയിരംപേരും വീതമുള്ള വിഭാഗങ്ങളായി[a] പുറപ്പെട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ക്രമീകരിച്ച സൈനികവിഭാഗങ്ങളായി.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  choice: നിങ്ങൾക്ക് നല്ലതെന്നു തോന്നുന്നത്
  rationale: ‘നിങ്ങളുടെ കണ്ണുകളിൽ നല്ലതായിരിക്കുന്നത്’ എന്ന എബ്രായ പ്രയോഗം അവരുടെ വിലയിരുത്തലിൽ നല്ലതോ ഉചിതമോ ആയ കാര്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം പകരുന്നു.
- source_word: אֶעֱשֶׂה
  choice: ഞാൻ ചെയ്യും
  rationale: עשה എന്ന ക്രിയയുടെ വിശാലവും നേരിട്ടുമുള്ള ഭാവികാല അർഥം നിലനിർത്തുന്നു; രാജാവ് അവരുടെ ഉപദേശം അംഗീകരിക്കുന്നതിനപ്പുറം മറ്റൊരു ഭാവം ചേർക്കുന്നില്ല.
- source_word: אֶל יַד הַשַּׁעַר
  choice: പടിവാതിലിനരികെ
  rationale: അക്ഷരാർഥത്തിൽ ‘പടിവാതിലിന്റെ കൈയരികിൽ’ എന്നുള്ളത് സമീപസ്ഥാനം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. ‘അരികെ’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: וְכָל הָעָם
  choice: ജനമെല്ലാം
  rationale: സന്ദർഭം സൈനികമാണെങ്കിലും മൂലപാഠത്തിലെ עָם എന്ന ‘ജനം’ എന്ന പദം നിലനിർത്തുന്നു.
- source_word: יָצְאוּ
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്നത് അടിസ്ഥാനപരമായി ‘പുറത്തുപോകുക’ എന്നാണ്. ഇവിടെ സൈനികസന്ദർഭത്തിൽ ‘പുറപ്പെട്ടു’ സ്വാഭാവികമാണ്; ‘അണിനിരന്നു നീങ്ങി’ പോലുള്ള അധികഭാവം ചേർക്കുന്നില്ല.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: നൂറുപേരും ആയിരംപേരും വീതമുള്ള വിഭാഗങ്ങളായി
  rationale: നൂറും ആയിരവും അടിസ്ഥാനമാക്കിയുള്ള സൈനികവിഭാഗങ്ങളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. സംഖ്യാഘടന നിലനിർത്തിക്കൊണ്ട് അതിന്റെ സംഘടനാപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പടിവാതിൽ’ നഗരകവാടത്തെ സൂചിപ്പിക്കാൻ ഉപയോഗിച്ചു. ‘ജനം’ എന്ന മൂലപദം സൈനികസന്ദർഭം ഉണ്ടായിട്ടും ‘സൈന്യം’ എന്നു വ്യാഖ്യാനിച്ചില്ല; അവസാന വാക്യഭാഗം സൈനികസംഘടന വ്യക്തമാക്കുന്നു.
