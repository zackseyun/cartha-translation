  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
translation:
  language: ml
  text: അബ്ശാലോം തന്റെ ജീവിതകാലത്ത് രാജാവിന്റെ താഴ്‌വരയിൽ തനിക്കായി ഒരു സ്തംഭം എടുത്ത് സ്ഥാപിച്ചിരുന്നു; കാരണം, “എന്റെ പേര് ഓർമയിൽ നിലനിർത്താൻ എനിക്കു മകനില്ല” എന്ന് അവൻ പറഞ്ഞിരുന്നു. അങ്ങനെ അവൻ ആ സ്തംഭത്തിന് തന്റെ സ്വന്തം പേര് നൽകി; ഇന്നുവരെയും അത് ‘അബ്ശാലോമിന്റെ സ്മാരകം’[a] എന്നു വിളിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായയിൽ അക്ഷരാർഥം: “അബ്ശാലോമിന്റെ കൈ.” ഇവിടെ “കൈ” എന്നത് ഒരു സ്മാരകചിഹ്നത്തെയോ സ്മാരകസ്തംഭത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח וַיַּצֶּב לוֹ
  choice: തനിക്കായി ... സ്ഥാപിച്ചിരുന്നു
  rationale: לָקַח ഇവിടെ പ്രത്യേകം ‘എടുത്തു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമാണ്; തുടർന്നുള്ള וַיַּצֶּב-നോടൊപ്പം ഒരുക്കി സ്ഥാപിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മുൻകാല പശ്ചാത്തലപ്രവൃത്തി ആയതിനാൽ ‘സ്ഥാപിച്ചിരുന്നു’ എന്നു നൽകി.
- source_word: בְחַיּו
  choice: തന്റെ ജീവിതകാലത്ത്
  rationale: അബ്ശാലോം ജീവിച്ചിരിക്കുമ്പോൾ ചെയ്ത പ്രവൃത്തിയാണെന്ന കാലസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מַצֶּבֶת
  choice: സ്തംഭം
  rationale: നാട്ടിനിർത്തിയ കല്ലിനെയോ സ്തംഭത്തെയോ സൂചിപ്പിക്കുന്ന മൂർത്തമായ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
- source_word: בְּעֵמֶק הַמֶּלֶךְ
  choice: രാജാവിന്റെ താഴ്‌വരയിൽ
  rationale: സ്ഥലനാമഘടനയോട് അടുത്തുനിൽക്കുന്ന വ്യക്തവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  choice: എന്റെ പേര് ഓർമയിൽ നിലനിർത്താൻ
  rationale: പേര് തുടർന്നും ഓർക്കപ്പെടുക എന്ന ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; വംശതുടർച്ചയെക്കുറിച്ചുള്ള അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: וַיִּקְרָא לַמַּצֶּבֶת עַל שְׁמוֹ
  choice: ആ സ്തംഭത്തിന് സ്വന്തം പേര് നൽകി
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יַד אַבְשָׁלוֹם
  choice: അബ്ശാലോമിന്റെ സ്മാരകം
  rationale: יַד എന്നതിന്റെ അക്ഷരാർഥം ‘കൈ’ ആണെങ്കിലും ഇവിടെ സ്മാരകചിഹ്നം എന്ന പ്രയോഗാർഥമാണ് ഉദ്ദേശിക്കുന്നത്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: പേരിന്റെ ഉപയോഗം രചനാകാലംവരെ തുടർന്നുവെന്ന സാധാരണ എബ്രായ കാലപ്രയോഗം കൃത്യമായി നൽകുന്നു.
