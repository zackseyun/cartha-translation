translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വാക്യത്തിന്റെ ആരംഭത്തിൽ മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ പോലുള്ള വ്യവഹാരസൂചകം ചേർത്തിട്ടില്ല. ‘മകനില്ലല്ലോ’ എന്ന രൂപം כִּי אָמַר എന്ന വിശദീകരണത്തിനുള്ളിലെ അബ്ശാലോമിന്റെ പ്രസ്താവനയുടെ സ്വാഭാവിക ഭാവം നൽകുന്നു.
