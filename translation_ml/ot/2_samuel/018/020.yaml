source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ יוֹאָ֗ב לֹא֩ אִ֨ישׁ בְּשֹׂרָ֤ה אַתָּה֙ הַ/יּ֣וֹם הַ/זֶּ֔ה וּ/בִשַּׂרְתָּ֖ בְּ/י֣וֹם אַחֵ֑ר וְ/הַ/יּ֤וֹם הַ/זֶּה֙ לֹ֣א תְבַשֵּׂ֔ר כִּֽי על בֶּן הַ/מֶּ֖לֶךְ מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
translation:
  language: ml
  text: 'യോവാബ് അവനോടു പറഞ്ഞു: “ഇന്നു നീ വാർത്ത അറിയിക്കേണ്ടവനല്ല.[a] മറ്റൊരു ദിവസം നിനക്കു വാർത്ത അറിയിക്കാം; എന്നാൽ ഇന്നു നീ വാർത്ത അറിയിക്കരുത്. കാരണം രാജാവിന്റെ മകൻ മരിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സന്തോഷവാർത്ത അറിയിക്കേണ്ടവൻ.” എബ്രായപദത്തിന് വാർത്തയെയോ സന്ദേശത്തെയോ സൂചിപ്പിക്കാം; പലപ്പോഴും അത് സന്തോഷവാർത്തയാണ്. എന്നാൽ ഇവിടെ രാജാവിന്റെ മകന്റെ മരണമാണ് സന്ദർഭം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּשֹׂרָה
  choice: വാർത്ത അറിയിക്കേണ്ടവൻ
  rationale: അക്ഷരാർഥത്തിലെ ‘വാർത്തയുടെ മനുഷ്യൻ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. സന്ദർഭം അബ്ശാലോമിന്റെ മരണമായതിനാൽ ‘സന്തോഷവാർത്ത അറിയിക്കുന്നവൻ’ എന്നു മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുന്നത് അർഥം അനാവശ്യമായി പരിമിതപ്പെടുത്തും.
- source_word: וּבִשַּׂרְתָּ
  choice: നിനക്കു വാർത്ത അറിയിക്കാം
  rationale: ഇന്നത്തെ വിലക്കിനു വിരുദ്ധമായി മറ്റൊരു ദിവസം അതു ചെയ്യാനുള്ള അനുമതിയോ അവസരമോ ഉണ്ടാകുമെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: לֹא תְבַשֵּׂר
  choice: നീ വാർത്ത അറിയിക്കരുത്
  rationale: ലോ എന്ന നിഷേധപദത്തോടുകൂടിയ അപൂർണക്രിയ ഇവിടെ യോവാബിന്റെ വിലക്കാണ്; മലയാളത്തിലെ നിഷേധാജ്ഞ അതു നേരിട്ട് നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: യോവാബിന്റെ വിലക്കിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בֶּן הַמֶּלֶךְ
  choice: രാജാവിന്റെ മകൻ
  rationale: എബ്രായ സംയുക്തബന്ധത്തെ സ്വാഭാവികമായ മലയാള ഷഷ്ഠീബന്ധമായി നൽകുന്നു.
- source_word: מֵת
  choice: മരിച്ചിരിക്കുന്നു
  rationale: മരണത്തിന്റെ നിലവിലുള്ള ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന്റെ സ്ഥിതിവാചക ഭാവം നിലനിർത്തുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: ആവർത്തിക്കുന്ന കാലസൂചനയെ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
