translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി സ്വീകരിച്ചു. വാർത്തയെ സൂചിപ്പിക്കുന്ന ഒരേ പദശൃംഖല മൂന്നു പ്രാവശ്യം ഉപയോഗിച്ച് എബ്രായത്തിലെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തി.
