  edition: WLC
  text: וַ/יִּקְרָ֣א אֲחִימַ֗עַץ וַ/יֹּ֤אמֶר אֶל הַ/מֶּ֨לֶךְ֙ שָׁל֔וֹם וַ/יִּשְׁתַּ֧חוּ לַ/מֶּ֛לֶךְ לְ/אַפָּ֖י/ו אָ֑רְצָ/ה וַ/יֹּ֗אמֶר בָּרוּךְ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֤ר סִגַּר֙ אֶת הָ֣/אֲנָשִׁ֔ים אֲשֶׁר נָשְׂא֥וּ אֶת יָדָ֖/ם בַּֽ/אדֹנִ֥/י הַ/מֶּֽלֶךְ־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
translation:
  language: ml
  text: 'അഹീമയസ് രാജാവിനോടു വിളിച്ചുപറഞ്ഞു: “സമാധാനം!”[a] പിന്നെ അവൻ രാജാവിന്റെ മുമ്പിൽ മുഖം നിലത്തോടു ചേർത്ത് പ്രണമിച്ചു പറഞ്ഞു: “എന്റെ പ്രഭുവായ രാജാവിനെതിരെ കൈ ഉയർത്തിയ മനുഷ്യരെ കൈമാറിക്കൊടുത്ത അങ്ങയുടെ ദൈവമായ യഹ്‌വെ വാഴ്ത്തപ്പെടട്ടെ!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എല്ലാം ശുഭം!” ദൂതൻ വാർത്ത അറിയിക്കുന്ന ഈ സന്ദർഭത്തിൽ എബ്രായ ശാലോം എന്ന പദം അഭിവാദ്യം മാത്രമല്ല, ക്ഷേമമോ അനുകൂലവാർത്തയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “കൈമാറിക്കൊടുത്ത” എന്നതിന് “ഏൽപ്പിച്ചുകൊടുത്ത” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: സമാധാനം!
  rationale: ദൂതന്റെ വാർത്താവിവരണസന്ദർഭത്തിൽ ഈ പദം അഭിവാദ്യം മാത്രമല്ല, ക്ഷേമമോ അനുകൂലവാർത്തയോ അറിയിക്കാനും കഴിയും. ‘സമാധാനം!’ എന്ന സംക്ഷിപ്ത രൂപം മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ לְאַפָּיו אָרְצָה
  choice: രാജാവിന്റെ മുമ്പിൽ മുഖം നിലത്തുതൊടുമാറ് കുമ്പിട്ട്
  rationale: ക്രിയയും തുടർന്നുള്ള ശരീരനിലാവിവരണവും ചേർന്ന് പൂർണമായ ആദരപ്രണാമത്തെ സൂചിപ്പിക്കുന്നു; ഈ രൂപം ദൃശ്യമായ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  choice: അങ്ങയുടെ ദൈവമായ യഹ്‌വെ വാഴ്ത്തപ്പെടുമാറാകട്ടെ
  rationale: പരമ്പരാഗത സ്തുതിവാക്യത്തിന്റെ ആശംസാത്മകവും ആരാധനാപരവുമായ ഭാവം നിലനിർത്തുന്നു; രാജാവിനോടുള്ള ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിക്കുന്നു.
- source_word: סִגַּר
  choice: ഏല്പിച്ചുതന്ന
  rationale: ശത്രുക്കളെ മറ്റൊരാളുടെ അധികാരത്തിലാക്കുക, കൈമാറുക എന്ന സൈനികസന്ദർഭത്തിലെ അർഥം നൽകുന്നു; ‘അടച്ചുകളഞ്ഞ’ എന്ന അക്ഷരാർഥത്തിലെ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: נָשְׂאוּ אֶת יָדָם
  choice: കൈ ഉയർത്തിയ
  rationale: വിരോധപ്രവർത്തനമോ കലാപമോ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യപ്രയോഗം വിവർത്തനത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בַּאדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവിനെതിരെ
  rationale: ദാവീദിനോടുള്ള കൊട്ടാരപരമായ ആദരവും അധീനതയും നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא
  choice: വിളിച്ചുപറഞ്ഞു
  rationale: ദൂതൻ ശബ്ദമുയർത്തി രാജാവിനോട് വാർത്ത അറിയിക്കുന്ന കഥാസന്ദർഭം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ലിപ്യന്തരണം ഉപയോഗിച്ച് പേരും സ്ഥാനപ്പേരും തമ്മിലുള്ള വ്യത്യാസം സംരക്ഷിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള കഥനശൈലി. രാജാവിനോടുള്ള ആദരത്തിന് ‘അങ്ങയുടെ’ എന്നും കൊട്ടാരപരമായ അഭിസംബോധനയ്ക്ക് ‘എന്റെ യജമാനനായ രാജാവ്’ എന്നും ഉപയോഗിച്ചു. എബ്രായ ദൃശ്യപ്രയോഗമായ ‘കൈ ഉയർത്തുക’ വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി.
