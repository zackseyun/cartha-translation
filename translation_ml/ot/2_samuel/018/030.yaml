source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ סֹ֖ב הִתְיַצֵּ֣ב כֹּ֑ה וַ/יִּסֹּ֖ב וַֽ/יַּעֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/030.yaml
  text: The king said[a], “Turn aside; stand here.” So he turned aside and stood.
translation:
  language: ml
  text: 'രാജാവ് പറഞ്ഞു[a]: “ഒരുവശത്തേക്കു മാറി ഇവിടെ നിൽക്കുക.” അപ്പോൾ അവൻ ഒരുവശത്തേക്കു മാറിനിന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “തിരിഞ്ഞ് ഇവിടെ നിൽക്കുക.” എബ്രായക്രിയയ്ക്ക് പൊതുവായി തിരിയുക എന്ന അർഥമുണ്ടാകാം; എന്നാൽ അടുത്ത ദൂതന് ഇടം നൽകാൻ ഒരുവശത്തേക്കു മാറുക എന്നായിരിക്കാനാണ് സന്ദർഭത്തിൽ കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നതിന് സ്വാഭാവികമായ മലയാളം.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിതത്വസൂചകമുള്ള നാമം; സന്ദർഭത്തിൽ മുമ്പേ അറിയപ്പെടുന്ന രാജാവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: סֹב
  choice: ഒരുവശത്തേക്കു മാറി
  rationale: סבב എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം പൊതുവായി തിരിയുന്നതിനെ സൂചിപ്പിക്കാമെങ്കിലും, അടുത്ത ദൂതന് ഇടം നൽകാൻ മാറിനിൽക്കാനുള്ള നിർദേശമാണ് സന്ദർഭത്തിൽ കൂടുതൽ സാധ്യതയുള്ളത്.
- source_word: הִתְיַצֵּב
  choice: നിൽക്കുക
  rationale: സ്വയം ഒരു സ്ഥാനത്ത് ഉറപ്പിച്ചു നിൽക്കുക എന്ന അർഥമുള്ള התפעל ആജ്ഞാരൂപം; മലയാളത്തിൽ ഇവിടെ ലളിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: כֹּה
  choice: ഇവിടെ
  rationale: ഈ ആജ്ഞയുടെ സന്ദർഭത്തിൽ നിർദിഷ്ടമായ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനക്രിയാവിശേഷണം.
- source_word: וַיִּסֹּב וַיַּעֲמֹד
  choice: അവൻ ഒരുവശത്തേക്കു മാറിനിന്നു
  rationale: ആജ്ഞ അനുസരിച്ചതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സംയുക്തക്രിയയിലൂടെ പറയുന്നു; മാറുകയും നിൽക്കുകയും ചെയ്തുവെന്ന രണ്ടു ഘടകങ്ങളും നിലനിർത്തുന്നു.
