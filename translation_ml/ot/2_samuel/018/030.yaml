  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ആജ്ഞയിലെ ചുരുക്കവും ആഖ്യാനത്തിലെ ആവർത്തനബന്ധവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
