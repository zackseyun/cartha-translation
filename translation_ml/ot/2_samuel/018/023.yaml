  text: וִ/יהִי מָ֣ה אָר֔וּץ וַ/יֹּ֥אמֶר ל֖/וֹ ר֑וּץ וַ/יָּ֤רָץ אֲחִימַ֨עַץ֙ דֶּ֣רֶךְ הַ/כִּכָּ֔ר וַֽ/יַּעֲבֹ֖ר אֶת הַ/כּוּשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/023.yaml
  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
translation:
  language: ml
  text: 'എന്നാൽ അഹീമാസ് പറഞ്ഞു: “എന്തായാലും, ഞാൻ ഓടട്ടെ.”[a] അപ്പോൾ യോവാബ് അവനോട്, “ഓടിക്കൊള്ളൂ,” എന്നു പറഞ്ഞു. അങ്ങനെ അഹീമാസ് സമതലവഴിയിലൂടെ[b] ഓടി കൂശ്യനെ കടന്നുപോയി.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്തു വന്നാലും, ഞാൻ ഓടും.” ഫലം എന്തായാലും ഓടണമെന്ന അഹീമാസിന്റെ നിർബന്ധം പ്രകടമാക്കുന്ന ഒരു എബ്രായ ശൈലിയാണിത്.
    reason: alternative_reading
  - marker: b
    text: “സമതലം” എന്നത് യോർദ്ദാൻ സമതലത്തെ സൂചിപ്പിക്കുന്നതാകാം; എന്നാൽ എബ്രായപാഠം മുഖ്യവാക്യത്തിൽ അത്രയും ഭൂമിശാസ്ത്രപരമായ വിശദീകരണം ആവശ്യപ്പെടുന്നില്ല.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “ഓട്ടത്തിൽ കൂശ്യനെ മറികടന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  choice: എന്തായാലും, ഞാൻ ഓടട്ടെ
  rationale: ഈ എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിലുള്ള ചോദ്യത്തേക്കാൾ, ഫലം എന്തായാലും ഓടാൻ അനുവദിക്കണമെന്ന അഹീമാസിന്റെ നിർബന്ധപൂർവമായ അപേക്ഷയാണ് സൂചിപ്പിക്കുന്നത്. “ഞാൻ ഓടട്ടെ” എന്നത് സന്ദർഭത്തിലെ അനുവാദാഭ്യർഥന നിലനിർത്തുന്നു.
- source_word: רוּץ
  choice: ഓടിക്കൊള്ളൂ
  rationale: רוץ എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം. മലയാള സംഭാഷണത്തിൽ അനുവാദം നൽകുന്ന ആജ്ഞയായി ഇത് സ്വാഭാവികമാണ്.
- source_word: דֶּרֶךְ הַכִּכָּר
  choice: സമതലവഴിയിലൂടെ
  rationale: דֶּרֶךְ ‘വഴി/പാത’ എന്നും הַכִּכָּר ഇവിടെ ‘സമതലം’ എന്നും സൂചിപ്പിക്കുന്നു. ഭൂമിശാസ്ത്രം അനാവശ്യമായി വിശദീകരിക്കാതെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വിവർത്തനം ചെയ്തു.
- source_word: וַיַּעֲבֹר אֶת־הַכּוּשִׁי
  choice: കൂശ്യനെ കടന്നുപോയി
  rationale: עבר എന്ന ക്രിയയ്ക്ക് ഇവിടെ ‘കടന്നുപോകുക’ അല്ലെങ്കിൽ ‘മറികടക്കുക’ എന്ന അർഥമാകാം. മുഖ്യപാഠം പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ഓട്ടത്തിൽ മറികടന്നുവെന്ന സന്ദർഭോചിതമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הַכּוּשִׁי
  choice: കൂശ്യൻ
  rationale: കൂശിൽ നിന്നുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന വംശീയ-ഭൗമിക വിശേഷണം നേരിട്ട് നിലനിർത്തുന്നു; പരമ്പരാഗതമായെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘എത്യോപ്യക്കാരൻ’ ഒഴിവാക്കുന്നു.
- source_word: אֲחִימַעַץ
  choice: അഹീമാസ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ സർവനാമങ്ങൾ മലയാളത്തിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതിരിക്കാനായി സന്ദർഭത്തിൽ വ്യക്തമായ അഹീമാസ്, യോവാബ് എന്നീ പേരുകൾ ചേർത്തു; എന്നാൽ സംഭവക്രമത്തിലോ അർഥത്തിലോ പുതിയ വിവരം ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
