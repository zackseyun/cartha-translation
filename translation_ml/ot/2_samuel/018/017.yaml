source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶת אַבְשָׁל֗וֹם וַ/יַּשְׁלִ֨יכוּ אֹת֤/וֹ בַ/יַּ֨עַר֙ אֶל הַ/פַּ֣חַת הַ/גָּד֔וֹל וַ/יַּצִּ֧בוּ עָלָ֛י/ו גַּל אֲבָנִ֖ים גָּד֣וֹל מְאֹ֑ד וְ/כָל יִשְׂרָאֵ֔ל נָ֖סוּ אִ֥ישׁ ל/אהל/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
translation:
  language: ml
  text: അവർ അബ്ശാലോമിനെ എടുത്ത് കാട്ടിലെ വലിയ കുഴിയിൽ എറിഞ്ഞു; അവന്റെ മേൽ വളരെ വലിയ കല്ലുകളുടെ കൂമ്പാരം ഉയർത്തി. ഇസ്രായേലൊക്കെയും ഓടിപ്പോയി, ഓരോരുത്തനും അവനവന്റെ കൂടാരത്തിലേക്ക്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവനവന്റെ കൂടാരത്തിലേക്ക്” എന്നത് ഓരോരുത്തരും സ്വന്തം വാസസ്ഥലത്തേക്കു പിരിഞ്ഞുപോയി എന്നർഥമുള്ള ഒരു പ്രയോഗമാണ്; അതായത്, “അവനവന്റെ വീട്ടിലേക്ക്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: എടുത്ത്
  rationale: לקח എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ബലപ്രയോഗം ചേർക്കുന്നില്ല.
- source_word: וַיַּשְׁלִיכוּ
  choice: എറിഞ്ഞു
  rationale: ശരീരം അപമാനകരമായി വലിച്ചെറിഞ്ഞതിന്റെ ശക്തമായ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַיַּעַר
  choice: കാട്ടിലെ
  rationale: יער എന്ന പദത്തിനും സന്ദർഭത്തിൽ മുമ്പേ സ്ഥാപിച്ചിരിക്കുന്ന സ്ഥലത്തിനും യോജിച്ച സ്വാഭാവിക പരിഭാഷ.
- source_word: אֶל הַפַּחַת הַגָּדוֹל
  choice: വലിയ കുഴിയിൽ
  rationale: פחת സൂചിപ്പിക്കുന്ന കുഴി അഥവാ താഴ്ച വ്യക്തമായി നൽകുകയും വിശേഷണത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיַּצִּבוּ עָלָיו
  choice: അവന്റെമേൽ ... ഉയർത്തി
  rationale: ശരീരത്തിനുമുകളിൽ കല്ലുകൾ കൂട്ടി വലിയ കൂമ്പാരം സ്ഥാപിച്ച ഭൗതികദൃശ്യം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: גַּל אֲבָנִים גָּדוֹל מְאֹד
  choice: അതിവലിയ ഒരു കൽക്കൂമ്പാരം
  rationale: കല്ലുകളുടെ കൂമ്പാരവും מְאֹד നൽകുന്ന വലുപ്പത്തിന്റെ തീവ്രതയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְכָל יִשְׂרָאֵל נָסוּ
  choice: ഇസ്രായേലൊക്കെയും ഓടിപ്പോയി
  rationale: ദേശനാമത്തിന്റെ കൂട്ടായ പ്രയോഗവും נוס എന്ന ക്രിയയുടെ പലായനഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ לְאֹהָלוֹ
  choice: ഓരോരുത്തനും അവനവന്റെ കൂടാരത്തിലേക്ക്
  rationale: വിതരണാർഥമുള്ള איש എന്ന രൂപവും വ്യക്തിഗത മടങ്ങിപ്പോക്കും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; കൂടാരം വീടിനെയോ താമസസ്ഥലത്തെയോ സൂചിപ്പിക്കാവുന്ന പ്രയോഗമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אִישׁ എന്ന പുല്ലിംഗ ഏകവചന വിതരണപ്രയോഗം
  choice: ഓരോരുത്തനും അവനവന്റെ കൂടാരത്തിലേക്ക്
  alternative: ഓരോ പുരുഷനും തന്റെ കൂടാരത്തിലേക്ക്
  rationale: യുദ്ധസന്ദർഭത്തിലെ വ്യക്തിഗത പലായനം കൃത്യമായി സൂചിപ്പിക്കുമ്പോഴും മലയാളത്തിൽ അനാവശ്യമായി കടുപ്പമുള്ള ലിംഗചിഹ്നനം ഒഴിവാക്കി എബ്രായത്തിലെ വിതരണാർഥം സംരക്ഷിക്കുന്നു.
- issue: לְאֹהָלוֹ എന്നതിന്റെ അക്ഷരാർഥവും പ്രയോഗാർഥവും
  choice: കൂടാരത്തിലേക്ക്
  alternative: വീട്ടിലേക്ക്
  rationale: മൂലത്തിലെ ദൃശ്യരൂപം പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു; സ്വന്തം വാസസ്ഥലത്തേക്ക് പിരിഞ്ഞുപോയി എന്ന പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാള ആഖ്യാനശൈലി. അക്ഷരാർഥത്തിലെ ‘കൂടാരം’ നിലനിർത്തി അതിന്റെ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു.
