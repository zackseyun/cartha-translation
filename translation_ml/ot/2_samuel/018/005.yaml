  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת י֠וֹאָב וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר לְ/אַט לִ֖/י לַ/נַּ֣עַר לְ/אַבְשָׁל֑וֹם וְ/כָל הָ/עָ֣ם שָׁמְע֗וּ בְּ/צַוֺּ֥ת הַ/מֶּ֛לֶךְ אֶת כָּל הַ/שָּׂרִ֖ים עַל דְּבַ֥ר אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
translation:
  language: ml
  text: 'രാജാവ് യോവാബിനോടും അബീശായിയോടും ഇത്തായിയോടും ഇങ്ങനെ കല്പിച്ചു: “എന്നെ ഓർത്ത് ആ യുവാവായ അബ്ശാലോമിനോട് സൗമ്യമായി പെരുമാറുക.” അബ്ശാലോമിനെക്കുറിച്ച് രാജാവ് എല്ലാ സേനാനായകന്മാരോടും കല്പിച്ചത് ജനമെല്ലാം കേട്ടു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ അധികാരപൂർണമായ ആജ്ഞാഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: എബ്രായത്തിലെ പദവിനാമം തന്നെ നിലനിർത്തുന്നു; ‘ദാവീദ്’ എന്ന് വ്യക്തമാക്കേണ്ട ആവശ്യമില്ല.
- source_word: אֶת יואב וְאֶת אֲבִישַׁי וְאֶת אִתַּי
  choice: യോവാബിനോടും അബീശായിയോടും ഇത്തായിയോടും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; ‘കല്പിച്ചു’ എന്ന ക്രിയയോടൊപ്പം ദത്തിവിഭക്തി മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗം മലയാള കഥനത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְאַט
  choice: സൗമ്യമായി പെരുമാറുക
  rationale: സൈനിക സാഹചര്യത്തിൽ അബ്ശാലോമിനോടു നിയന്ത്രണത്തോടെയും മൃദുത്വത്തോടെയും ഇടപെടണമെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: לִי
  choice: എന്നെ ഓർത്ത്
  rationale: ദാവീദിന്റെ വ്യക്തിപരമായ അപേക്ഷയും ബന്ധപരമായ ഊന്നലും ‘എനിക്കുവേണ്ടി’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לַנַּעַר
  choice: ആ യുവാവായ
  rationale: נַעַר എന്നത് പ്രായപൂർത്തിയായ അബ്ശാലോമിനെ പിതൃസ്നേഹത്തോടെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യുവാവ്’ യോജിക്കുന്നു; ‘ബാലൻ’ ബാലിശത വരുത്തും.
- source_word: לְאַבְשָׁלוֹם
  choice: അബ്ശാലോമിനോട്
  rationale: ‘യുവാവ്’ എന്നതിനെ അബ്ശാലോമായി തിരിച്ചറിയിക്കുന്ന സംക്ഷിപ്ത എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയയുടെ ബന്ധപദത്തോടു ചേർത്തു നൽകുന്നു.
- source_word: וְכָל הָעָם שָׁמְעוּ
  choice: ജനമെല്ലാം കേട്ടു
  rationale: הָעָם എന്നതിന്റെ അടിസ്ഥാന അർത്ഥമായ ‘ജനം’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സൈന്യമായി ഒത്തുകൂടിയവരാണെന്നത് വായനക്കാരന് വ്യക്തമാണ്.
- source_word: בְּצַוֹּת
  choice: കല്പിച്ചത്
  rationale: സമകാലിക സാഹചര്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ നാമവാക്യഘടനയിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: כָּל הַשָּׂרִים
  choice: എല്ലാ സേനാനായകന്മാരോടും
  rationale: ശׂרים എന്ന പൊതുവായ നേതൃപദത്തിന് ഈ സൈനിക സന്ദർഭത്തിൽ ‘സേനാനായകന്മാർ’ കൃത്യമാണ്.
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  choice: അബ്ശാലോമിനെക്കുറിച്ച്
  rationale: ‘സംബന്ധിച്ച്/കുറിച്ച്’ എന്ന അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. എബ്രായത്തിലെ രാജകീയ ആജ്ഞയുടെ ശക്തിയും ദാവീദിന്റെ പിതൃസ്നേഹമുള്ള വ്യക്തിപരമായ അപേക്ഷയും ഒരുമിച്ച് നിലനിർത്തി. പ്രത്യേക മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
