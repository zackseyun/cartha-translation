source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֔ב לֹא כֵ֖ן אֹחִ֣ילָה לְ/פָנֶ֑י/ךָ וַ/יִּקַּח֩ שְׁלֹשָׁ֨ה שְׁבָטִ֜ים בְּ/כַפּ֗/וֹ וַ/יִּתְקָעֵ/ם֙ בְּ/לֵ֣ב אַבְשָׁל֔וֹם עוֹדֶ֥/נּוּ חַ֖י בְּ/לֵ֥ב הָ/אֵלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
translation:
  language: ml
  text: 'യോവാബ് പറഞ്ഞു: “ഇല്ല; നിന്റെ മുമ്പിൽ ഇങ്ങനെ ഞാൻ കാത്തുനിൽക്കില്ല.” പിന്നെ അവൻ മൂന്നു കുന്തങ്ങൾ[a] കൈയിലെടുത്ത്, അബ്ശാലോം ഇനിയും ജീവനോടെയിരിക്കെ, ടെറിബിന്ത് മരത്തിന്റെ നടുവിൽ[b] അവന്റെ ഹൃദയത്തിലേക്ക് അവ കുത്തിയിറക്കി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മൂന്നു വടികൾ/ദണ്ഡങ്ങൾ.’ എബ്രായപദത്തിന് വടി, ദണ്ഡ്, ചെങ്കോൽ എന്നീ അർഥങ്ങൾ വരാം; എന്നാൽ ഇവിടെ കുത്താൻ ഉപയോഗിച്ച ആയുധങ്ങളെയാണു കൂടുതൽ സാധ്യത സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഓക്ക് മരം.’ എബ്രായ אֵלָה സാധാരണയായി ടെറിബിന്ത് മരത്തെ സൂചിപ്പിക്കുന്നു; ചില പരിഭാഷകൾ ഇതിനെ കൂടുതൽ പൊതുവായി ‘ഓക്ക് മരം’ എന്നു നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹחִילָה לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ കാത്തുനിൽക്കാൻ
  rationale: ‘കാത്തിരിക്കുക/താമസിക്കുക’ എന്ന ആശയവും ‘നിന്റെ സന്നിധിയിൽ’ എന്ന എബ്രായ പ്രയോഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ചേർത്തു നൽകുന്നു.
- source_word: שְׁלֹשָׁה שְׁבָטִים
  choice: മൂന്നു കുന്തങ്ങൾ
  rationale: ശബ്‌ദത്തിന് വടി, ദണ്ഡ് തുടങ്ങിയ അർഥങ്ങളുണ്ടെങ്കിലും, സൈനികസന്ദർഭവും അവ കുത്തിയിറക്കുന്ന പ്രവൃത്തിയും ഇവിടെ ആയുധങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּתְקָעֵם
  choice: അവ കുത്തിയിറക്കി
  rationale: ബലമായി തുളച്ചുകയറ്റുന്ന പ്രവൃത്തിയെ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּלֵב אַבְשָׁלוֹם
  choice: അബ്ശാലോമിന്റെ ഹൃദയത്തിലേക്ക്
  rationale: മൂലപാഠത്തിലെ ശരീരാവയവത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പ്രയോഗം നിലനിർത്തുന്നു; ‘നെഞ്ച്’ എന്ന പൊതുവായ പദത്തിലേക്ക് മാറ്റുന്നില്ല.
- source_word: עוֹדֶנּוּ חַי
  choice: ഇനിയും ജീവനോടെ കിടന്നിരുന്ന
  rationale: യോവാബ് പ്രഹരിച്ചപ്പോൾ അബ്ശാലോം മരിച്ചിരുന്നില്ലെന്ന ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּלֵב הָאֵלָה
  choice: ടെറിബിന്ത് മരത്തിന്റെ നടുവിൽ
  rationale: אֵלָה എന്ന വൃക്ഷനാമത്തിന് സാധാരണയായി നൽകുന്ന ‘ടെറിബിന്ത്’ നിലനിർത്തുന്നു; ‘മരത്തിന്റെ ഹൃദയത്തിൽ’ എന്ന അക്ഷരാർഥപ്രയോഗത്തേക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായ ‘നടുവിൽ’ ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സാങ്കേതികമായ വൃക്ഷനാമം മൂലഭാഷയോട് കൃത്യത പാലിക്കാൻ ലിപ്യന്തരണം ചെയ്തു; അതിന്റെ പരിഭാഷാഭേദം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. അടിക്കുറിപ്പുസൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കരികിൽ സ്ഥാപിച്ചു.
