source:
  edition: WLC
  text: וַ/תְּהִי שָׁ֧ם הַ/מִּלְחָמָ֛ה נפצית עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַ/יֶּ֤רֶב הַ/יַּ֨עַר֙ לֶ/אֱכֹ֣ל בָּ/עָ֔ם מֵ/אֲשֶׁ֥ר אָכְלָ֛ה הַ/חֶ֖רֶב בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/008.yaml
  text: The battle spread there over the face of all the land[a], and the forest devoured more of the people that day than the sword devoured.
translation:
  language: ml
  text: അവിടെ യുദ്ധം ദേശമെങ്ങും പരന്നുകിടന്നു[a]. അന്നു വാൾ വിഴുങ്ങിയതിനെക്കാൾ അധികം പേരെ വനം വിഴുങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യുദ്ധം ദേശമെങ്ങും ചിതറിക്കിടന്നു.’ എബ്രായത്തിലെ രൂപം യുദ്ധം പ്രദേശത്താകെ ചിതറിപ്പോയതിനോ വ്യാപിച്ചുകിടന്നതിനോ ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נפצית
  choice: പരന്നുകിടന്നു
  rationale: פוץ എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം യുദ്ധം പ്രദേശത്താകെ ചിതറിപ്പരന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘പരന്നുകിടന്നു’ ഈ സ്ഥിതിവിശേഷം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘ചിതറിക്കിടന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: ദേശമെങ്ങും
  rationale: പ്രയോഗം യുദ്ധം നടന്ന പ്രാദേശിക ഭൂപ്രദേശത്തിന്റെ മുഴുവൻ വ്യാപ്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദേശമെങ്ങും’ മലയാളത്തിൽ സ്വാഭാവികവും ഭൂമിയാകെയെന്ന ആഗോള അർഥം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: וירב ... לֶאֱכֹל
  choice: അധികം ... വിഴുങ്ങി
  rationale: רבה, തുടർന്നുള്ള לֶאֱכֹל എന്നും מֵאֲשֶׁר എന്ന താരതമ്യഘടനയും ചേർന്ന്, വനം വാളിനെക്കാൾ കൂടുതൽ മരണങ്ങൾക്ക് കാരണമായി എന്ന അർഥം നൽകുന്നു.
- source_word: היער
  choice: വനം
  rationale: יַעַר വനപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘വനം’ ഗൗരവമുള്ളതും സൈനിക വിവരണത്തിൽ വ്യക്തവുമായ സാധാരണ മലയാളപദമാണ്.
- source_word: לֶאֱכֹל / אכלה
  choice: വിഴുങ്ങി
  rationale: ‘തിന്നുക’ എന്ന അടിസ്ഥാനരൂപകത്തെ മരണകാരകമായ ശക്തിയായി അവതരിപ്പിക്കുന്നതിനാൽ ‘വിഴുങ്ങി’ അതിന്റെ സജീവമായ വ്യക്തിവൽക്കരണം കാത്തുസൂക്ഷിക്കുന്നു; വനത്തിനും വാളിനും ഒരേ ക്രിയ ഉപയോഗിച്ച് എബ്രായ സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: בעם
  choice: ജനത്തെ
  rationale: രൂപകാത്മകമായ ‘വിഴുങ്ങുക’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ ‘ജനത്തെ’ എന്ന കർമരൂപം സ്വാഭാവികമായി മരണത്തിനിരയായവരെ സൂചിപ്പിക്കുന്നു.
- source_word: ביום ההוא
  choice: അന്നു
  rationale: ‘ആ ദിവസം’ എന്ന സമയസൂചനയ്ക്ക് കഥനശൈലിയിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപമാണ് ‘അന്നു’.
