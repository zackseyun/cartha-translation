  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘വനം വിഴുങ്ങി / വാൾ വിഴുങ്ങി’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ വ്യക്തിവൽക്കരണവും സമാന്തരതയും നിലനിർത്തുന്നു.
