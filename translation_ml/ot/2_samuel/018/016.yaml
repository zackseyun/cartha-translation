reference: 2 Samuel 18:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שֹּׁפָ֔ר וַ/יָּ֣שָׁב הָ/עָ֔ם מִ/רְדֹ֖ף אַחֲרֵ֣י יִשְׂרָאֵ֑ל כִּֽי חָשַׂ֥ךְ יוֹאָ֖ב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/016.yaml
  text: Then Joab blew the trumpet[a], and the people turned back from pursuing Israel[c][b], because Joab restrained the people.
translation:
  language: ml
  text: അപ്പോൾ യോവാബ് കാഹളം ഊതി[a]. ജനം ഇസ്രായേലിനെ പിന്തുടരുന്നതിൽനിന്ന് പിന്തിരിഞ്ഞു[b]; കാരണം യോവാബ് ജനത്തെ തടഞ്ഞുനിർത്തി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊമ്പുകാഹളം’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായത്തിലെ ശോഫാർ അടയാളം നൽകാൻ ഉപയോഗിച്ചിരുന്ന, പലപ്പോഴും ആട്ടുകൊമ്പുകൊണ്ടുണ്ടാക്കിയ വാദ്യമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ഇസ്രായേൽ’ എന്നു പറയുന്നത് അബ്ശാലോമിന്റെ പക്ഷത്തുണ്ടായിരുന്ന ഇസ്രായേൽ സേനയെയാണ്.
    reason: cultural_note
  - marker: c
    text: ‘ജനത്തെ പിടിച്ചുനിർത്തി’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായക്രിയയ്ക്ക് ‘തടയുക,’ ‘ഒഴിവാക്കുക,’ ‘രക്ഷിക്കുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്; ഇവിടെ യോവാബ് തന്റെ ആളുകളെ പിന്തുടരുന്നതിൽനിന്ന് തടഞ്ഞു എന്നതാണ് സാധ്യതയേറിയ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: ഊതി
  rationale: שׁוֹפָר എന്ന വാദ്യത്തോടൊപ്പം תקע എന്ന ക്രിയയ്ക്ക് ‘ഊതുക/മുഴക്കുക’ എന്നാണ് സന്ദർഭോചിതമായ അർഥം. ‘ഊതി’ മൂലത്തിലെ ദൃശ്യമായ പ്രവർത്തനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בַּשֹּׁפָר
  choice: കാഹളം
  rationale: שׁוֹפָר അടയാളം നൽകാൻ ഉപയോഗിച്ചിരുന്ന, സാധാരണയായി മൃഗക്കൊമ്പുകൊണ്ടുള്ള വാദ്യമാണ്. സൈനികസന്ദർഭത്തിൽ ‘കാഹളം’ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണ്; വാദ്യത്തിന്റെ കൃത്യസ്വഭാവം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיָּשָׁב הָעָם
  choice: ജനം … പിന്തിരിഞ്ഞു
  rationale: שׁוּב ഇവിടെ തിരികെ പോകുക അഥവാ പിന്തിരിയുക എന്ന അർഥത്തിലാണ്. הָעָם സന്ദർഭത്തിൽ യോവാബിന്റെ സൈനികരെ സൂചിപ്പിച്ചാലും, ‘ജനം’ എബ്രായപദത്തിന്റെ പൊതുവായ സ്വഭാവവും വാക്യത്തിനുള്ളിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: מִרְדֹף
  choice: പിന്തുടരുന്നതിൽനിന്ന്
  rationale: מִן ചേർന്ന ക്രിയാനാമരൂപം ഒരു പ്രവൃത്തി നിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പിന്തുടരുന്നതിൽനിന്ന് പിന്തിരിഞ്ഞു’ എന്നത് ഈ ഘടനയും സൈനികസന്ദർഭവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַחֲרֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പിന്നാലെ’ എന്നാണ്. ഇവിടെ അബ്ശാലോമിന്റെ പക്ഷത്തുണ്ടായിരുന്ന ഇസ്രായേൽ സേനയെ ഉദ്ദേശിക്കുന്നുവെങ്കിലും, മൂലത്തിലെ ‘ഇസ്രായേൽ’ പ്രധാനപാഠത്തിൽ അതേപടി നിലനിർത്തി സന്ദർഭവിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: പിന്തുടരൽ അവസാനിച്ചതിന്റെ കാരണം ഇവിടെ כִּי അവതരിപ്പിക്കുന്നു; ആ ബന്ധം ആധുനിക മലയാളത്തിൽ ‘കാരണം’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: חָשַׂךְ
  choice: തടഞ്ഞുനിർത്തി
  rationale: חשׂך എന്നതിന് പിടിച്ചുനിർത്തുക, വിലക്കുക, ഒഴിവാക്കുക/രക്ഷിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ഈ സൈനികസന്ദർഭത്തിൽ യോവാബ് തന്റെ ആളുകളെ തുടർപിന്തുടർച്ചയിൽനിന്ന് തടഞ്ഞു എന്ന പ്രായോഗിക അർഥം ‘തടഞ്ഞുനിർത്തി’ നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֶת הָעָם
  choice: ജനത്തെ
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ הָעָם എന്നതുമായുള്ള പദസാമ്യം നിലനിർത്തുന്നു. സന്ദർഭം ഇത് യോവാബിന്റെ സൈന്യത്തെ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യക്തമാക്കുന്നു.
