translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ജനം’ എന്ന പദം മൂലത്തിലെ הָעָם എന്നതിന്റെ ആവർത്തനം നിലനിർത്തുന്നു; സൈനികസൂചന സന്ദർഭത്തിലും അടിക്കുറിപ്പിലും വ്യക്തമാക്കുന്നു. വാക്യം ദീർഘമാകാതിരിക്കാൻ ആദ്യ പ്രവൃത്തിക്ക് ശേഷം പൂർണവിരാമവും തുടർന്ന് കാരണബന്ധത്തിന് അർധവിരാമവും ഉപയോഗിച്ചു.
