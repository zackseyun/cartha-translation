id: 2SA.18.10
reference: 2 Samuel 18:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּרְא֙ אִ֣ישׁ אֶחָ֔ד וַ/יַּגֵּ֖ד לְ/יוֹאָ֑ב וַ/יֹּ֗אמֶר הִנֵּה֙ רָאִ֣יתִי אֶת אַבְשָׁלֹ֔ם תָּל֖וּי בָּ/אֵלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/010.yaml
  text: One man saw it and told Joab[a], and said, “Look, I saw Absalom hanging in the terebinth tree.”
translation:
  language: ml
  text: 'ഒരാൾ അതു കണ്ടിട്ട് യോവാബിനെ അറിയിച്ചു: “നോക്കൂ, അബ്ശാലോം ആ തെരബിന്ത് മരത്തിൽ[a] തൂങ്ങിക്കിടക്കുന്നതു ഞാൻ കണ്ടു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആ ഓക്കുമരത്തിൽ.” എബ്രായത്തിലെ אֵלָה സാധാരണയായി തെരബിന്ത് മരത്തെ സൂചിപ്പിക്കുന്നു; ചിലപ്പോൾ അതിനെ പൊതുവായി “ഓക്ക്” എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: ഒരാൾ
  rationale: ‘ഒരു മനുഷ്യൻ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ആധുനിക മലയാള കഥനത്തിൽ സ്വാഭാവികമായ ഏകവചന അനിശ്ചിത പരാമർശം; പുരുഷനെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം നഷ്ടപ്പെടുന്നില്ല.
- source_word: וַיַּרְא
  choice: അതു കണ്ടിട്ട്
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കണ്ടു’; മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന കാഴ്ചയെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ‘അതു’ ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: וַיַּגֵּד לְיוֹאָב
  choice: യോവാബിനെ അറിയിച്ചു
  rationale: נגד എന്ന റിപ്പോർട്ട് ചെയ്യുക/അറിയിക്കുക എന്ന അർഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ നിപാതത്തിന്റെ ശക്തി പഴഞ്ചൻ ശൈലിയില്ലാതെ നിലനിർത്തുന്നു.
- source_word: רָאִיתִי
  choice: ഞാൻ കണ്ടു
  rationale: കഴിഞ്ഞുപോയ ഒരു നേരിട്ടുള്ള നിരീക്ഷണത്തെ സ്വാഭാവിക മലയാള ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תָּלוּי
  choice: തൂങ്ങിക്കിടക്കുന്നതു
  rationale: നിലവിലുള്ള തൂങ്ങിയ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ അർഥം നിലനിർത്തുന്നു; മരണത്തെ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: בָּאֵלָה
  choice: ആ ഏലാമരത്തിൽ
  rationale: אֵלָהയെ സസ്യനാമമായ ‘ഏലാമരം’ എന്നു നൽകുന്നു; നിർദ്ദിഷ്ടത സൂചിപ്പിക്കാൻ ‘ആ’ ഉപയോഗിക്കുന്നു. മരത്തിന്റെ കൃത്യമായ തിരിച്ചറിയലിലെ വ്യത്യാസം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും കഥനത്തിന് യോജിച്ചതുമായ മലയാളം. വാക്യക്രമം സ്വാഭാവികമാക്കിയെങ്കിലും എബ്രായത്തിലെ ദൃക്സാക്ഷി റിപ്പോർട്ടും തൂങ്ങിയ അവസ്ഥയും മരത്തിന്റെ നിർദ്ദിഷ്ടതയും സംരക്ഷിച്ചിട്ടുണ്ട്. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്കിനേക്കാൾ വാക്യാവസാനത്ത് വെച്ചിരിക്കുന്നു.
