id: 2SA.18.7
reference: 2 Samuel 18:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּנָּ֤גְפוּ שָׁם֙ עַ֣ם יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וַ/תְּהִי שָׁ֞ם הַ/מַּגֵּפָ֧ה גְדוֹלָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא עֶשְׂרִ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/007.yaml
  text: 'There the people of Israel were defeated before the servants of David[b][a], and the slaughter there was great on that day: twenty thousand men.'
translation:
  language: ml
  text: അവിടെ ഇസ്രായേൽജനം ദാവീദിന്റെ സേവകരുടെ മുമ്പിൽ തോറ്റു. അന്നു അവിടെ വലിയൊരു സംഹാരം ഉണ്ടായി—ഇരുപതിനായിരം പേർ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘ഇരുപതിനായിരം’ എന്നു മാത്രമേയുള്ളൂ; യുദ്ധസന്ദർഭം വ്യക്തമാക്കാൻ ‘പേർ’ എന്നു ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  choice: തോറ്റു
  rationale: നָגַף എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ യുദ്ധത്തിൽ പരാജയപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഓരോരുത്തരും കൊല്ലപ്പെട്ടു എന്ന ധ്വനി അമിതമായി നൽകാതെ സൈനികസന്ദർഭം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: עַם יִשְׂרָאֵל
  choice: ഇസ്രായേൽജനം
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേൽജനം’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേലിന്റെ സൈനികരെ സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: യുദ്ധസന്ദർഭത്തിൽ എതിരാളിയുടെ മുമ്പിൽ പരാജയപ്പെടുക എന്ന എബ്രായപ്രയോഗത്തെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: עַבְדֵי דָוִד
  choice: ദാവീദിന്റെ സേവകർ
  rationale: עֶבֶד എന്ന പദത്തിന്റെ ‘സേവകൻ/അനുചരൻ’ എന്ന അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; ഇവിടെ ദാവീദിന്റെ അനുയായികളായ സൈനികരാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: הַמַּגֵּפָה
  choice: സംഹാരം
  rationale: מַגֵּפָה മറ്റു സന്ദർഭങ്ങളിൽ ‘ബാധ’ എന്നു വരാമെങ്കിലും ഇവിടെ യുദ്ധത്തിലെ മാരകമായ പ്രഹരവും കൂട്ടക്കൊലയും സൂചിപ്പിക്കുന്നു. ‘സംഹാരം’ ഈ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גְדוֹלָה
  choice: വലിയൊരു
  rationale: ‘വലിയ’ എന്ന ലളിതമായ അർഥം നിലനിർത്തുകയും സംഹാരത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നു
  rationale: ‘ആ ദിവസം’ എന്ന കാലസൂചന മലയാള കഥനശൈലിയിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: עֶשְׂרִים אָלֶף
  choice: ഇരുപതിനായിരം പേർ
  rationale: എബ്രായത്തിൽ സംഖ്യ മാത്രമാണുള്ളത്. യുദ്ധത്തിലെ മനുഷ്യനഷ്ടമാണ് എണ്ണപ്പെടുന്നതെന്ന് വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘പേർ’ ചേർത്തിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. മൂലപാഠത്തിന്റെ പദക്രമത്തെ അനാവശ്യമായി അനുകരിക്കാതെ അതിലെ ആവർത്തനമായ ‘അവിടെ’ നിലനിർത്തി. ‘സേവകർ’ എന്നത് പദാർത്ഥത്തോട് അടുത്തതാണ്; സന്ദർഭത്തിൽ ദാവീദിന്റെ സൈനികാനുചരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
