source:
  edition: WLC
  text: אֽוֹ עָשִׂ֤יתִי ב/נפש/ו שֶׁ֔קֶר וְ/כָל דָּבָ֖ר לֹא יִכָּחֵ֣ד מִן הַ/מֶּ֑לֶךְ וְ/אַתָּ֖ה תִּתְיַצֵּ֥ב מִ/נֶּֽגֶד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/013.yaml
  text: Or if I had dealt falsely against his life, and no matter is hidden from the king, then you yourself would have stood aside.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, അവന്റെ ജീവനെതിരെ ഞാൻ വഞ്ചനാപരമായി പ്രവർത്തിച്ചിരുന്നെങ്കിൽ—ഒരു കാര്യവും രാജാവിൽനിന്ന് മറഞ്ഞിരിക്കുകയില്ല—നീ തന്നെ മാറിനിൽക്കുമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׂיתִי בְנַפְשׁוֹ שֶׁקֶר
  choice: അവന്റെ ജീവന് ഹാനി വരുത്തിക്കൊണ്ട് ഞാൻ വഞ്ചനാപരമായി പ്രവർത്തിച്ചിരുന്നെങ്കിൽ
  rationale: ശബ്ദാർഥത്തിൽ ‘അവന്റെ ജീവനോടു വിരോധമായി വ്യാജം/വഞ്ചന പ്രവർത്തിക്കുക’ എന്നാണ്. അബ്ശാലോമിന്റെ ജീവനെതിരായ ദ്രോഹനടപടിയും രാജകല്പനയുടെ വഞ്ചനാപരമായ ലംഘനവും ഉൾക്കൊള്ളുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: וְכָל־דָּבָר לֹא־יִכָּחֵד מִן־הַמֶּלֶךְ
  choice: ഒരു കാര്യവും രാജാവിൽനിന്ന് മറഞ്ഞിരിക്കുകയില്ലല്ലോ
  rationale: יִכָּחֵד എന്നത് ‘മറയ്ക്കപ്പെടുക/മറഞ്ഞിരിക്കുക’ എന്ന ആശയം നൽകുന്നു; വക്താവിന്റെ ഉറച്ച നിരീക്ഷണം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְאַתָּה תִּתְיַצֵּב מִנֶּגֶד
  choice: നീ തന്നെ മാറിനിൽക്കുമായിരുന്നു
  rationale: മുന്നിൽനിന്ന് അകന്നു നിൽക്കുക, സഹായിക്കാതെ മാറിനിൽക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; യോവാബ് വക്താവിനെ പിന്തുണയ്ക്കില്ലെന്ന ആരോപണം നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְנַפְשׁוֹ എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: അവന്റെ ജീവന് ഹാനി വരുത്തിക്കൊണ്ട്
  alternative: അവന്റെ ജീവനെതിരായി
  rationale: സന്ദർഭത്തിൽ അബ്ശാലോമിനെ കൊല്ലുന്നതാണ് ഉദ്ദേശ്യമെങ്കിലും, മൂലപാഠത്തിലെ ‘ജീവൻ’ എന്ന പദം നിലനിർത്തി കൊലപാതകം എന്നതിലേക്ക് മാത്രം വ്യാഖ്യാനം ചുരുക്കിയില്ല.
- issue: തִּתְיַצֵּב מִנֶּגֶד എന്നതിലെ യോവാബിന്റെ നിലപാട്
  choice: മാറിനിൽക്കുമായിരുന്നു
  alternative: എനിക്കെതിരായി നിലകൊള്ളുമായിരുന്നു
  rationale: മൂലപ്രയോഗം എതിർത്ത് നിൽക്കലിനെയോ അകന്നു നിൽക്കലിനെയോ സൂചിപ്പിക്കാം. ഉടൻ സഹായിക്കാതെ കൈവിടുമെന്ന സന്ദർഭാർഥം തെരഞ്ഞെടുത്തെങ്കിലും ‘എതിരായി’ എന്ന കൂടുതൽ ശക്തമായ വ്യാഖ്യാനം പാഠത്തിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിബന്ധനാവാക്യത്തിന്റെ ദൈർഘ്യം നിയന്ത്രിക്കാൻ ഇടവരകൾ ഉപയോഗിച്ചു; പ്രത്യേക സഭാപാരമ്പര്യ പദാവലി ഒഴിവാക്കി.
