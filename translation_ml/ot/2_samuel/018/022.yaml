source:
  edition: WLC
  text: וַ/יֹּ֨סֶף ע֜וֹד אֲחִימַ֤עַץ בֶּן צָדוֹק֙ וַ/יֹּ֣אמֶר אֶל יוֹאָ֔ב וִ֣/יהִי מָ֔ה אָרֻֽצָה נָּ֥א גַם אָ֖נִי אַחֲרֵ֣י הַ/כּוּשִׁ֑י וַ/יֹּ֣אמֶר יוֹאָ֗ב לָֽ/מָּה זֶּ֞ה אַתָּ֥ה רָץ֙ בְּנִ֔/י וּ/לְ/כָ֖ה אֵין בְּשׂוֹרָ֥ה מֹצֵֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
translation:
  language: ml
  text: 'സാദോക്കിന്റെ മകനായ അഹീമാസ് പിന്നെയും യോവാബിനോട് പറഞ്ഞു: “എന്തു സംഭവിച്ചാലും, ദയവായി ഞാനും കൂശ്യന്റെ പിന്നാലെ ഓടട്ടെ.” യോവാബ് പറഞ്ഞു: “എന്റെ മകനേ, നീ എന്തിന് ഓടണം? നിനക്കു പ്രതിഫലം നേടിത്തരുന്ന വാർത്തയൊന്നുമില്ലല്ലോ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അവസാനത്തെ ഹീബ്രു വാക്യഭാഗം ദുഷ്കരമാണ്. “നല്ല രീതിയിൽ സ്വീകരിക്കപ്പെടുന്ന വാർത്ത നിനക്കില്ല” എന്നോ “ഈ വാർത്ത അറിയിച്ചതിന് നിനക്കു പ്രതിഫലം ലഭിക്കില്ല” എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: പിന്നെയും ... പറഞ്ഞു
  rationale: ‘വീണ്ടും കൂട്ടിച്ചേർത്തു’ എന്ന അക്ഷരാർഥമുള്ള ഈ പ്രയോഗം ആവർത്തിച്ച അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പിന്നെയും പറഞ്ഞു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וִיהִי מָה
  choice: എന്തു സംഭവിച്ചാലും
  rationale: ഫലം എന്തായാലും എന്ന ഉറച്ച നിലപാട് പ്രകടിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തെ വ്യക്തമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אָרֻצָה נָּא גַם אֲנִי
  choice: ദയവായി ഞാനും ... ഓടട്ടെ
  rationale: കോഹോർട്ടേറ്റീവും נָא-യും ചേർന്ന വിനീതവും നിർബന്ധപൂർവവുമായ അഭ്യർഥനയും גַם אֲנִיയിലെ ‘ഞാനും’ എന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: הַכּוּשִׁי
  choice: കൂശ്യൻ
  rationale: ജനവിഭാഗനാമത്തെ ചരിത്രപരമായി നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു; ആധുനിക ഭൂമിശാസ്ത്രപരമായ ‘എത്യോപ്യക്കാരൻ’ എന്ന അനുമാനം ഒഴിവാക്കുന്നു.
- source_word: לָמָּה זֶּה אַתָּה רָץ
  choice: നീ എന്തിന് ഓടണം?
  rationale: യോവാബിന്റെ ആശ്ചര്യവും എതിർപ്പും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; זֶהയുടെ സൂചനാഭാവം മലയാള ചോദ്യത്തിന്റെ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: בְּנִי
  choice: എന്റെ മകനേ
  rationale: അക്ഷരാർഥത്തിലുള്ള പിതൃബന്ധം നിർബന്ധമാക്കാതെ സ്നേഹപൂർവമോ മേൽസ്ഥാനത്തുനിന്നുള്ളതോ ആയ സംബോധന നിലനിർത്തുന്നു.
- source_word: אֵין בְּשׂוֹרָה מֹצֵאת
  choice: നിനക്കു പ്രതിഫലം നേടിത്തരുന്ന വാർത്തയൊന്നുമില്ല
  rationale: ദുഷ്കരവും അപൂർണവുമായ ഹീബ്രു വാക്യഭാഗത്തിന്റെ സാധ്യതയുള്ള അർഥം മുഖ്യപാഠത്തിൽ വായനാസൗകര്യത്തോടെ നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֵין בְּשׂוֹרָה מֹצֵאת എന്ന ദുഷ്കരമായ അവസാന വാക്യഭാഗം
  choice: നിനക്കു പ്രതിഫലം നേടിത്തരുന്ന വാർത്തയൊന്നുമില്ല
  alternative: നല്ല രീതിയിൽ സ്വീകരിക്കപ്പെടുന്ന വാർത്ത നിനക്കില്ല
  rationale: വാക്യഭാഗം പ്രതിഫലത്തെയോ അനുകൂല സ്വീകരണത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ദൂതന് ലഭിക്കാവുന്ന നേട്ടം മുഖ്യപാഠത്തിൽ എടുത്തെങ്കിലും യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. കഥനത്തിന്റെ ചുരുക്കവും സംഭാഷണത്തിലെ വിനീതമായ നിർബന്ധവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
