translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ‘ജനം’ എന്ന പദം നിലനിർത്തിക്കൊണ്ട് സൈനികസന്ദർഭം ക്രിയയിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു; സംഖ്യകൾക്കും സൈനികഘടകങ്ങൾക്കും ഇടയിലുള്ള സാധ്യതാപരമായ അർഥവ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
