source:
  edition: WLC
  text: וַ/יִּפְקֹ֣ד דָּוִ֔ד אֶת הָ/עָ֖ם אֲשֶׁ֣ר אִתּ֑/וֹ וַ/יָּ֣שֶׂם עֲלֵי/הֶ֔ם שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֥י מֵאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/001.yaml
  text: Then David mustered the people who were with him and appointed over them commanders of thousands and commanders of hundreds[a][b].
translation:
  language: ml
  text: പിന്നെ ദാവീദ് തന്നോടൊപ്പമുണ്ടായിരുന്ന ജനത്തെ[b] അണിനിരത്തി പരിശോധിച്ചു[a]; അവരുടെ മേൽ ആയിരങ്ങളുടെ തലവന്മാരെയും നൂറുകളുടെ തലവന്മാരെയും[c] നിയമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എണ്ണി’ അല്ലെങ്കിൽ ‘പരിശോധിച്ചു’; എബ്രായ ക്രിയ വെറും എണ്ണലിനപ്പുറം സൈനികരെ അണിനിരത്തി പരിശോധിക്കുന്നതിനെയോ ക്രമീകരിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ജനത്തെ’; ഇവിടെ ദാവീദിനോടൊപ്പമുണ്ടായിരുന്ന സൈനികബലത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘ആയിരങ്ങൾ’, ‘നൂറുകൾ’ എന്നിവ കൃത്യമായ സംഖ്യകളെയോ ആ പേരുകളിൽ അറിയപ്പെട്ടിരുന്ന സൈനികവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: സൈനികപരിശോധനയ്ക്ക് വിധേയരാക്കി
  rationale: פקד എന്ന ക്രിയ ഈ സൈനികസന്ദർഭത്തിൽ വെറും എണ്ണലല്ല, സൈന്യത്തെ പരിശോധിച്ച് ക്രമീകരിക്കുന്ന നടപടിയെയാണ് സൂചിപ്പിക്കുന്നത്. തുടർന്നുള്ള ഉദ്യോഗസ്ഥനിയമനവും ഈ അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: עם എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘ജനം’ നിലനിർത്തുന്നു; ഇവിടെ ദാവീദിനോടൊപ്പമുള്ള സൈനികസംഘത്തെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר אִתּוֹ
  choice: തന്നോടുകൂടെ ഉണ്ടായിരുന്ന
  rationale: ബന്ധവാക്യത്തിന്റെ ലളിതമായ അർഥം നിലനിർത്തുന്നു; ‘അവന്റെ കീഴിലുള്ള’ എന്നു പറഞ്ഞ് ഔപചാരികമായ അധികാരബന്ധം അധികമായി ചേർക്കുന്നില്ല.
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  choice: അവരുടെമേൽ ... നിയമിച്ചു
  rationale: שׂים + עַל ഇവിടെ ഒരാളെ മറ്റുള്ളവരുടെമേൽ അധികാരിയായി നിയമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: שָׂרֵי
  choice: അധിപന്മാർ
  rationale: സൈനികവിഭാഗങ്ങളുടെ ചുമതലയുള്ള അധികാരികളെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: אֲלָפִים
  choice: ആയിരങ്ങൾ
  rationale: സൈനിക-ഭരണപരമായ പതിവുജോടിയിലെ സംഖ്യാത്മക രൂപം നിലനിർത്തുന്നു; ഇത് കൃത്യമായി ആയിരം പേരെയോ ‘ആയിരം’ എന്നറിയപ്പെട്ട ഒരു ഘടകത്തെയോ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵאוֹת
  choice: നൂറുകൾ
  rationale: ‘ആയിരങ്ങൾ’ എന്നതിനോടൊപ്പമുള്ള സൈനിക-ഭരണപരമായ സമാന്തരപ്രയോഗം അതേ ഘടനയിൽ നിലനിർത്തുന്നു.
