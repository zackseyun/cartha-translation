translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ വിവരണശൈലി. സൈനികസന്ദർഭം കണക്കിലെടുത്ത് הָעָם എന്നത് ‘സൈന്യം’ എന്നും בְּיַד എന്നത് ‘കീഴിൽ’ എന്നും പരിഭാഷപ്പെടുത്തി.
