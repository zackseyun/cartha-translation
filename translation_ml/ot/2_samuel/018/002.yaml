  text: וַ/יְשַׁלַּ֨ח דָּוִ֜ד אֶת הָ/עָ֗ם הַ/שְּׁלִשִׁ֤ית בְּ/יַד יוֹאָב֙ וְ֠/הַ/שְּׁלִשִׁית בְּ/יַ֨ד אֲבִישַׁ֤י בֶּן צְרוּיָה֙ אֲחִ֣י יוֹאָ֔ב וְ/הַ֨/שְּׁלִשִׁ֔ת בְּ/יַ֖ד אִתַּ֣י הַ/גִּתִּ֑י וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הָ/עָ֔ם יָצֹ֥א אֵצֵ֛א גַּם אֲנִ֖י עִמָּ/כֶֽם־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
translation:
  language: ml
  text: 'ദാവീദ് സൈന്യത്തെ മൂന്നായി വിഭജിച്ച് അയച്ചു: മൂന്നിലൊന്ന് യോവാബിന്റെ കീഴിലും[a], മൂന്നിലൊന്ന് യോവാബിന്റെ സഹോദരനും സെരൂയയുടെ മകനുമായ അബീശായിയുടെ കീഴിലും, മൂന്നിലൊന്ന് ഗിത്യനായ ഇത്തായിയുടെ കീഴിലും. രാജാവ് സൈന്യത്തോട്, “ഞാനും നിങ്ങളോടൊപ്പം തീർച്ചയായും പുറപ്പെടും” എന്നു പറഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘കൈയിൽ’; ഇവിടെ ‘അധികാരത്തിലോ നേതൃത്വത്തിലോ’ എന്നർത്ഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: അയച്ചു
  rationale: യുദ്ധത്തിനായി സൈന്യത്തെ നിയോഗിച്ച് അയയ്ക്കുന്നതാണ് സന്ദർഭം; മലയാളത്തിൽ ‘അയച്ചു’ സ്വാഭാവികവും അർത്ഥസമ്പന്നവുമാണ്.
- source_word: הָעָם
  choice: സൈന്യം
  rationale: അക്ഷരാർഥത്തിൽ ‘ജനം’ എന്നാണെങ്കിലും, ഇവിടെ ദാവീദിന്റെ യുദ്ധസേനയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַשְּׁלִשִׁית / הַשְּׁלִשִׁת
  choice: മൂന്നിലൊന്ന്
  rationale: സൈന്യത്തെ തുല്യമായ മൂന്നു വിഭാഗങ്ങളാക്കിയതിനെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בְּיַד
  choice: കീഴിൽ
  rationale: ‘കൈയിൽ’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം ഇവിടെ അധികാരത്തിന്റെയോ സൈനിക നേതൃത്വത്തിന്റെയോ കീഴിൽ എന്ന അർത്ഥത്തിലാണ്.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: യോവാബിന്റെ സഹോദരനും സെരൂയയുടെ മകനുമായ അബീശായി
  rationale: ബന്ധസൂചനകൾ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ നൽകുകയും മൂലത്തിലെ രണ്ടു തിരിച്ചറിയലുകളും നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אִתַּי הַגִּתִּי
  choice: ഗിത്യനായ ഇത്ഥായി
  rationale: വ്യക്തിനാമവും ഗത്ത് സ്വദേശിയെന്ന ജനവിശേഷണവും മലയാള ബൈബിൾ ശൈലിക്ക് യോജിച്ച രൂപത്തിൽ നൽകുന്നു.
- source_word: יָצֹא אֵצֵא
  choice: തീർച്ചയായും പുറപ്പെടും
  rationale: ക്രിയാനാമവും ക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: גַּם אֲנִי
  choice: ഞാനും
  rationale: രാജാവും സൈന്യത്തോടൊപ്പം വ്യക്തിപരമായി പോകുമെന്ന ഉൾപ്പെടുത്തലും ഊന്നലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עִמָּכֶם
  choice: നിങ്ങളോടൊപ്പം
  rationale: യുദ്ധയാത്രയിലെ സഹഗമനം നേരിട്ട് വ്യക്തമാക്കുന്നു.
