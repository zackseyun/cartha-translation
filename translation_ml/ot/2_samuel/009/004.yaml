  yaml_path: translation/ot/2_samuel/009/004.yaml
  text: The king said to him, “Where is he?” Ziba said to the king, “Look, he is in the house of Machir son of Ammiel, in Lo-debar.”
translation:
  language: ml
  text: രാജാവ് അവനോട്, “അവൻ എവിടെയാണ്?” എന്നു ചോദിച്ചു. സീബാ രാജാവിനോട്, “ഇതാ, അവൻ ലോ-ദെബാറിൽ അമ്മീയേലിന്റെ മകൻ മാഖീരിന്റെ വീട്ടിലുണ്ട്” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיפֹה הוּא
  choice: അവൻ എവിടെയാണ്?
  rationale: സ്ഥലം ചോദിക്കുന്ന എബ്രായ ചോദ്യത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: הִנֵּה הוּא
  choice: ഇതാ, അവൻ
  rationale: הִנֵּה എന്ന ശ്രദ്ധ ക്ഷണിക്കുന്ന അവതരണപദത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്ഥലം ചൂണ്ടിക്കാണിക്കുന്ന മറുപടിയായും സ്വാഭാവികമാണ്.
- source_word: בֵּית מָכִיר בֶּן עַמִּיאֵל
  choice: അമ്മീയേലിന്റെ മകൻ മാഖീരിന്റെ വീട്ടിൽ
  rationale: ബന്ധങ്ങളും ഉടമസ്ഥതയും എബ്രായ മൂലത്തിന്റെ ക്രമാനുസൃതമായി വ്യക്തമായി നൽകുന്നു.
- source_word: בְּלוֹ דְבָר
  choice: ലോ-ദെബാറിൽ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ആവർത്തിക്കുന്ന ‘രാജാവ്’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ ഘടന അനുസരിച്ച് നിലനിർത്തി; പേരുകൾ മലയാള ബൈബിൾ വായനയ്ക്ക് സ്വാഭാവികമായ രീതിയിൽ ലിപ്യന്തരിച്ചു.
