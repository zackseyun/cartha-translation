source:
  edition: WLC
  text: וְ/עָבַ֣דְתָּ לּ֣/וֹ אֶֽת הָ/אֲדָמָ֡ה אַתָּה֩ וּ/בָנֶ֨י/ךָ וַ/עֲבָדֶ֜י/ךָ וְ/הֵבֵ֗אתָ וְ/הָיָ֨ה לְ/בֶן אֲדֹנֶ֤י/ךָ לֶּ֨חֶם֙ וַ/אֲכָל֔/וֹ וּ/מְפִיבֹ֨שֶׁת֙ בֶּן אֲדֹנֶ֔י/ךָ יֹאכַ֥ל תָּמִ֛יד לֶ֖חֶם עַל שֻׁלְחָנִ֑/י וּ/לְ/צִיבָ֗א חֲמִשָּׁ֥ה עָשָׂ֛ר בָּנִ֖ים וְ/עֶשְׂרִ֥ים עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your servants shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty servants.
translation:
  language: ml
  text: നീയും നിന്റെ പുത്രന്മാരും നിന്റെ അടിമകളും അവനുവേണ്ടി നിലം കൃഷി ചെയ്യണം. നീ വിളവ് കൊണ്ടുവരണം; അതു നിന്റെ യജമാനന്റെ പുത്രന് അപ്പമായിരിക്കും[a], അവൻ അതു കഴിക്കും. എന്നാൽ നിന്റെ യജമാനന്റെ പുത്രനായ മെഫീബോശെത്ത് എപ്പോഴും എന്റെ മേശയിൽ ഇരുന്ന് അപ്പം കഴിക്കും.” സീബായ്ക്ക് പതിനഞ്ചു പുത്രന്മാരും ഇരുപതു അടിമകളും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘അപ്പം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രു പദത്തിന് സന്ദർഭത്തിൽ ‘ഭക്ഷണം’ അല്ലെങ്കിൽ ‘ഉപജീവനത്തിനുള്ള വക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת־הָאֲדָמָה
  choice: അവനുവേണ്ടി നിലം കൃഷി ചെയ്യണം
  rationale: עבד എന്ന ക്രിയ אֲדָמָה എന്ന നേരിട്ടുള്ള കർമത്തോടൊപ്പം ഇവിടെ പൊതുവായ സേവനമല്ല, മെഫീബോശെത്തിനുവേണ്ടിയുള്ള കാർഷിക അധ്വാനമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אַתָּה וּבָנֶיךָ וַעֲבָדֶיךָ / וְעֶשְׂרִים עֲבָדִים
  choice: നീയും നിന്റെ പുത്രന്മാരും നിന്റെ അടിമകളും / ഇരുപതു അടിമകൾ
  rationale: עֶבֶד എന്ന പദം ഈ ഗാർഹിക-സാമൂഹിക പശ്ചാത്തലത്തിൽ സ്വതന്ത്ര കൂലിവേലക്കാരെയല്ല, ബന്ധിത നിലയിലുള്ളവരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘അടിമകൾ’ ഉറവിടത്തിന്റെ സാമൂഹിക യാഥാർഥ്യം വ്യക്തമാക്കുന്നു.
- source_word: וְהֵבֵאתָ
  choice: നീ വിളവ് കൊണ്ടുവരണം
  rationale: ക്രിയയുടെ കർമം ഹീബ്രുവിൽ പ്രസ്താവിച്ചിട്ടില്ലെങ്കിലും, നിലം കൃഷി ചെയ്യുന്ന പശ്ചാത്തലത്തിൽ കൊണ്ടുവരേണ്ടത് അതിന്റെ വിളവാണെന്ന് വ്യക്തമാണ്; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘വിളവ്’ ചേർത്തു.
- source_word: וְהָיָה לְבֶן־אֲדֹנֶיךָ לֶּחֶם וַאֲכָלוֹ
  choice: അതു നിന്റെ യജമാനന്റെ പുത്രന് അപ്പമായിരിക്കും, അവൻ അതു ഭക്ഷിക്കും
  rationale: לֶחֶם എന്നത് വിശാലമായി ഭക്ഷണം അല്ലെങ്കിൽ ഉപജീവനസാധനം എന്നും അർഥമാക്കാമെങ്കിലും, തുടർന്ന് രാജാവിന്റെ മേശയിൽ ‘അപ്പം ഭക്ഷിക്കുക’ എന്ന ആവർത്തനബന്ധം നിലനിർത്താൻ ‘അപ്പം’ ഉപയോഗിച്ചു. പ്രത്യയത്തിന്റെ കർമസൂചന ‘അതു’ എന്നു വ്യക്തമാക്കി.
- source_word: יֹאכַל תָּמִיד לֶחֶם עַל שֻׁלְחָנִי
  choice: എപ്പോഴും എന്റെ മേശയിൽനിന്ന് അപ്പം ഭക്ഷിക്കും
  rationale: תָּמִיד എന്നതിന്റെ തുടർച്ച ‘എപ്പോഴും’ സ്വാഭാവികമായി നൽകുന്നു. עַל שֻׁלְחָנִי എന്ന രാജകീയ പരിപാലനസന്ദർഭം മലയാളത്തിൽ സ്വാഭാവികമായ ‘എന്റെ മേശയിൽനിന്ന്’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: וּלְצִיבָא חֲמִשָּׁה עָשָׂר בָּנִים וְעֶשְׂרִים עֲבָדִים
  choice: സീബായ്ക്ക് പതിനഞ്ചു പുത്രന്മാരും ഇരുപതു അടിമകളും ഉണ്ടായിരുന്നു
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു വാക്യം പശ്ചാത്തലവിവരമാണ്; മലയാളത്തിലെ സമ്പൂർണ വാക്യഘടനയ്ക്കായി ‘ഉണ്ടായിരുന്നു’ ചേർത്തു.
