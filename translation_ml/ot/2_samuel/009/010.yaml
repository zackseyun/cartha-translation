translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പുത്രൻ’, ‘യജമാനൻ’ എന്നീ പദങ്ങൾ രാജകീയ-ഗാർഹിക പശ്ചാത്തലത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു. നേരിട്ടുള്ള പ്രസംഗം അവസാനിക്കുന്നിടത്ത് സമാപന ഉദ്ധരണിച്ചിഹ്നം നിലനിർത്തിയിരിക്കുന്നു; അവസാന വാക്യം വിവരണകർത്താവിന്റെ പശ്ചാത്തലവിവരമാണ്.
