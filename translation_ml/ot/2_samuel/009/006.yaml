source:
  edition: WLC
  text: וַ֠/יָּבֹא מְפִיבֹ֨שֶׁת בֶּן יְהוֹנָתָ֤ן בֶּן שָׁאוּל֙ אֶל דָּוִ֔ד וַ/יִּפֹּ֥ל עַל פָּנָ֖י/ו וַ/יִּשְׁתָּ֑חוּ וַ/יֹּ֤אמֶר דָּוִד֙ מְפִיבֹ֔שֶׁת וַ/יֹּ֖אמֶר הִנֵּ֥ה עַבְדֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: ml
  text: ശൗലിന്റെ മകനായ യോനാഥാന്റെ മകൻ മെഫീബോശെത്ത് ദാവീദിന്റെ അടുക്കൽ വന്നു, കമിഴ്ന്നുവീണ് നമസ്കരിച്ചു. ദാവീദ്, “മെഫീബോശെത്തേ!” എന്നു പറഞ്ഞു. അവൻ, “ഇതാ, അങ്ങയുടെ ദാസൻ” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: കമിഴ്ന്നുവീണ്
  rationale: മുഖം നിലത്താകുന്ന വിധം വീഴുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: וַיִּשְׁתָּחוּ
  choice: നമസ്കരിച്ചു
  rationale: രാജാവിന്റെ മുമ്പിലുള്ള ആദരപൂർവമായ കുനിയലിനെ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ആരാധന എന്ന അധിക അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: הִנֵּה עַבְדֶּךָ
  choice: ഇതാ, അങ്ങയുടെ ദാസൻ
  rationale: הִנֵּה എന്ന ശ്രദ്ധാകർഷക പദവും വിനീതമായ സ്വയംസമർപ്പണവും നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ രാജസന്നിധി ഭാഷ ഉപയോഗിക്കുന്നു.
- source_word: מְפִיבֹשֶׁת
  choice: മെഫീബോശെത്ത്
  rationale: എബ്രായ നാമത്തിന്റെ സാധാരണ മലയാള ലിപ്യന്തരണം പിന്തുടരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിലവാരമലയാളം. വംശപരമ്പരയുടെ എബ്രായ ക്രമം നിലനിർത്തിയിട്ടുണ്ട്. ദാവീദിന്റെ ഒറ്റപ്പദ അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ സംബോധനപ്രത്യയം ചേർത്ത് ‘വിളിച്ചു’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
