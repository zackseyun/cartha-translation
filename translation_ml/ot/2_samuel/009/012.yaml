id: 2SA.9.12
reference: 2 Samuel 9:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לִ/מְפִיבֹ֥שֶׁת בֵּן קָטָ֖ן וּ/שְׁמ֣/וֹ מִיכָ֑א וְ/כֹל֙ מוֹשַׁ֣ב בֵּית צִיבָ֔א עֲבָדִ֖ים לִ/מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/012.yaml
  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
translation:
  language: ml
  text: മെഫീബോശെത്തിന് ചെറുപ്പക്കാരനായ ഒരു മകൻ ഉണ്ടായിരുന്നു; അവന്റെ പേര് മീഖാ എന്നായിരുന്നു. സീബയുടെ വീട്ടിൽ താമസിച്ചിരുന്ന എല്ലാവരും മെഫീബോശെത്തിന്റെ ദാസന്മാരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദാസന്മാർ’ എന്നതിനുള്ള എബ്രായപദത്തിന് സന്ദർഭമനുസരിച്ച് ‘അടിമകൾ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְפִיבֹשֶׁת
  choice: മെഫീബോശെത്തിന് … ഉണ്ടായിരുന്നു
  rationale: לְ എന്ന മുൻപ്രത്യയം ഉപയോഗിച്ചുള്ള എബ്രായ ഉടമസ്ഥതാ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘മെഫീബോശെത്തിന് … ഉണ്ടായിരുന്നു’ എന്നു നൽകി.
- source_word: בֵּן קָטָן
  choice: ഒരു ചെറിയ മകൻ
  rationale: קָטָן പ്രായക്കുറവിനെയോ ചെറുപ്പത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ചെറിയ മകൻ’ സാധാരണ മലയാളത്തിൽ ബാലനായ മകൻ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּ/שְׁמ/וֹ מִיכָא
  choice: അവന്റെ പേര് മീഖാ എന്നായിരുന്നു
  rationale: എബ്രായ വാക്യഘടനയുടെ തിരിച്ചറിയിക്കൽ സ്വഭാവം നിലനിർത്തി; מִיכָא എന്ന പേര് ‘മീഖാ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ/כֹל מוֹשַׁב בֵּית צִיבָא
  choice: സീബയുടെ വീട്ടിൽ താമസിച്ചിരുന്ന എല്ലാവരും
  rationale: מוֹשַׁב ഇവിടെ ഒരു വീട്ടിൽ പാർക്കുന്നവരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘വീട്ടുകാർ’ എന്നതിനേക്കാൾ ഉറവിടത്തിലെ താമസധ്വനി ഇതിൽ വ്യക്തമായി നിലനിൽക്കുന്നു.
- source_word: עֲבָדִים
  choice: ദാസന്മാർ
  rationale: עֶבֶד എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ദാസൻ, സേവകൻ, അടിമ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ സീബയുടെ വീട്ടിലുള്ളവരുടെ മെഫീബോശെത്തിനോടുള്ള സേവനബന്ധമാണ് പ്രധാനം; ‘ദാസന്മാർ’ ആ അർഥവും പദത്തിന്റെ സാമൂഹിക ആശയവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: לִ/מְפִיבֹשֶׁת
  choice: മെഫീബോശെത്തിന്റെ ദാസന്മാർ
  rationale: ‘ദാസന്മാർ’ എന്ന മലയാളപ്രയോഗത്തോടൊപ്പം ബന്ധസൂചകമായ לְ സ്വാഭാവികമായി ജനിറ്റീവ് രൂപത്തിൽ നൽകി; ഉടമസ്ഥതയുടെ കൃത്യസ്വഭാവം അധികമായി നിർണയിച്ചിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പുകളുടെ സ്ഥാനമാറ്റം മൂലപാഠവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, യഥാർഥ എബ്രായ പദവൈകല്യമായ עֲבָדִים എന്നതിനു മാത്രം അടിക്കുറിപ്പ് നൽകി.
