  to: 'ദാവീദ് പറഞ്ഞു: “ശൗലിന്റെ കുടുംബത്തിൽ ആരെങ്കിലും ഇനിയും ശേഷിച്ചിട്ടുണ്ടോ? യോനാഥാനെ ഓർത്ത് ഞാൻ അവനോടു വിശ്വസ്തസ്നേഹം[a] കാണിക്കാനായി?”'
