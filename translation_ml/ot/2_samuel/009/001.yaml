  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/כִ֣י יֶשׁ ע֔וֹד אֲשֶׁ֥ר נוֹתַ֖ר לְ/בֵ֣ית שָׁא֑וּל וְ/אֶעֱשֶׂ֤ה עִמּ/וֹ֙ חֶ֔סֶד בַּ/עֲב֖וּר יְהוֹנָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/001.yaml
  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
translation:
  language: ml
  text: 'ദാവീദ് പറഞ്ഞു: “ശൗലിന്റെ കുടുംബത്തിൽ ആരെങ്കിലും ഇനിയും ശേഷിച്ചിട്ടുണ്ടോ? യോനാഥാനെ ഓർത്ത് ഞാൻ അവനോടു വിശ്വസ്തസ്നേഹം[a] കാണിക്കാനായി?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദയ,” “വിശ്വസ്തമായ സ്നേഹം,” അല്ലെങ്കിൽ “ഉടമ്പടിയോടുള്ള വിശ്വസ്തത.” ഹീബ്രു പദം പലപ്പോഴും വെറും വികാരമല്ല, ഒരു ബന്ധത്തിലെ വിശ്വസ്തതയിൽ പ്രകടമാകുന്ന സ്നേഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്നത് സാധാരണ ആഖ്യാനക്രിയയായ ‘പറയുക’ എന്നാണ്; പിന്നാലെ ചോദ്യം വരുന്നതുകൊണ്ട് മാത്രം അതിനെ ‘ചോദിച്ചു’ എന്നു മാറ്റേണ്ടതില്ല.
- source_word: הֲכִי יֶשׁ עוֹד
  choice: ആരെങ്കിലും ഇനിയും ... ഉണ്ടോ?
  rationale: ചോദ്യം ഉന്നയിക്കുന്ന ഘടകവും തുടർന്നുള്ള നിലനിൽപ്പിനെ സൂചിപ്പിക്കുന്ന יֶשׁ עוֹד-ഉം ചേർന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ പ്രകടമാകുന്നു.
- source_word: אֲשֶׁר נוֹתַר
  choice: ശേഷിച്ചിട്ടുണ്ടോ
  rationale: נותר ജീവനോടെ ശേഷിച്ചിരിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു; ‘ശേഷിച്ചിട്ടുണ്ടോ’ സന്ദർഭത്തിലെ അതിജീവിച്ച അംഗം എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: לְבֵית שָׁאוּל
  choice: ശൗലിന്റെ കുടുംബത്തിൽ
  rationale: בית ഇവിടെ കെട്ടിടത്തെയല്ല, കുടുംബത്തെയോ രാജവംശത്തെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് ‘കുടുംബം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד
  choice: ഞാൻ അയാളോടു വിശ്വസ്തസ്നേഹം കാണിക്കേണ്ടതിന്നാണ്
  rationale: עשה ... חסד എന്ന പ്രയോഗം ഒരാളോടു കരുണാപൂർവവും വിശ്വസ്തവുമായ സ്നേഹം പ്രവൃത്തിയിൽ കാണിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ ഉദ്ദേശ്യഭാവം ‘കാണിക്കേണ്ടതിന്നാണ്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: חֶסֶד
  choice: വിശ്വസ്തസ്നേഹം
  rationale: חֶסֶד വെറും വികാരപരമായ ദയയെക്കാൾ ബന്ധത്തോടുള്ള വിശ്വസ്തതയിൽ പ്രകടമാകുന്ന സ്നേഹത്തെ സൂചിപ്പിക്കാം. ‘വിശ്വസ്തസ്നേഹം’ ഈ സമ്പന്നതയെ മുഖ്യപാഠത്തിൽ സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: בַּעֲבוּר יְהוֹנָתָן
  choice: യോനാഥാനെ ഓർത്ത്
  rationale: בעבור ഇവിടെ യോനാഥാൻ നിമിത്തം അഥവാ അദ്ദേഹത്തെ പരിഗണിച്ചുള്ള പ്രേരണയെ സൂചിപ്പിക്കുന്നു. ‘യോനാഥാനെ ഓർത്ത്’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധപ്രേരണ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദാവീദ് കാണിക്കാനുദ്ദേശിക്കുന്ന חֶסֶד എന്നതിന്റെ ബന്ധപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം
  choice: മുഖ്യപാഠത്തിൽ ‘വിശ്വസ്തസ്നേഹം’
  alternative: ‘ദയ’, ‘കരുണ’, ‘ഉടമ്പടിവിശ്വസ്തത’
  rationale: സന്ദർഭത്തിൽ ദാവീദിന്റെ പ്രവൃത്തി യോനാഥാനുമായുള്ള ബന്ധത്തിലും പ്രതിബദ്ധതയിലും വേരൂന്നിയതാണ്. ‘ദയ’ മാത്രം ആ വിശ്വസ്തതയുടെ ഭാവം ക്ഷയിപ്പിച്ചേക്കാം; ‘ഉടമ്പടിവിശ്വസ്തത’ അതിനെ മുഖ്യപാഠത്തിൽ അനാവശ്യമായി സാങ്കേതികമാക്കാം. അതിനാൽ ‘വിശ്വസ്തസ്നേഹം’ തെരഞ്ഞെടുത്ത് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ശൗലിന്റെ കുടുംബം’ കുടുംബ-രാജവംശ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു. ‘അയാളോടു’ എന്നത് അറിയപ്പെടാത്ത വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; חֶסֶד എന്ന പദത്തിന്റെ ബന്ധപരമായ ആഴം ‘വിശ്വസ്തസ്നേഹം’ എന്നും അടിക്കുറിപ്പിലൂടെയും സംരക്ഷിച്ചിരിക്കുന്നു.
