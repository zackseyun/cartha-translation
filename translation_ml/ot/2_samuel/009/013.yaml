translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. രാജസദസ്സിലെ സഹഭോജനത്തെ സൂചിപ്പിക്കുന്ന ‘രാജാവിന്റെ മേശ’ എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തി. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പ്രസക്തമായ വാക്യഭാഗങ്ങൾക്കു പിന്നാലെ ചേർത്തു.
