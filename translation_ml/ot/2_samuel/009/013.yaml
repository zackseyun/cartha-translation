source:
  edition: WLC
  text: וּ/מְפִיבֹ֗שֶׁת יֹשֵׁב֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֣י עַל שֻׁלְחַ֥ן הַ/מֶּ֛לֶךְ תָּמִ֖יד ה֣וּא אֹכֵ֑ל וְ/ה֥וּא פִסֵּ֖חַ שְׁתֵּ֥י רַגְלָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/013.yaml
  text: And Mephibosheth lived in Jerusalem[a], because he always ate at the king’s table[b]. Now he was lame in both his feet.
translation:
  language: ml
  text: മെഫീബോശെത്ത് യെരൂശലേമിൽ താമസിച്ചു, കാരണം[a] അവൻ എപ്പോഴും രാജാവിന്റെ മേശയിൽ ഭക്ഷണം കഴിച്ചിരുന്നു. അവൻ രണ്ടു കാലുകൾക്കും മുടന്തനായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാരണം’ എന്നതിന് പകരം ‘എന്തെന്നാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അവന്റെ രണ്ടു കാലുകൾക്കും മുടന്തൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: താമസിച്ചു
  rationale: നഗരനാമത്തോടൊപ്പം വരുന്ന ישׁב എന്ന ക്രിയ ഇവിടെ ഇരിക്കുക എന്നതിലുപരി അവിടെ വസിക്കുക എന്ന അർഥമാണ് നൽകുന്നത്. ‘താമസിച്ചു’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മെഫീബോശെത്ത് യെരൂശലേമിൽ താമസിച്ചതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധപദമായതിനാൽ കാരണാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  choice: രാജാവിന്റെ മേശ
  rationale: എബ്രായത്തിലെ സമാസബന്ധം സ്വാഭാവികമായ മലയാള ഉടമസ്ഥപ്രയോഗത്തിൽ നൽകുന്നു; രാജകീയ പരിപാലനത്തിന്റെയും സഹഭോജനത്തിന്റെയും ആശയം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: תָּמִיד
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായ പതിവിനെയും സ്ഥിരമായ ആനുകൂല്യത്തെയും സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം സന്ദർഭത്തിന് യോജിച്ച രീതിയിൽ നൽകുന്നു.
- source_word: אֹכֵל
  choice: ഭക്ഷണം കഴിച്ചിരുന്നു
  rationale: എബ്രായ വർത്തമാനകൃദന്തം ഇവിടെ പതിവായി ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കഴിച്ചിരുന്നു’ എന്ന രൂപം ഭൂതകാലത്തെ ആ പതിവ് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: פִסֵּחַ
  choice: മുടന്തനായിരുന്നു
  rationale: ശാരീരികമായ മുടന്തിനെ നേരിട്ടും സംക്ഷിപ്തമായും അറിയിക്കുന്ന പദമാണ്; മൂലപാഠത്തിൽ ഇല്ലാത്ത രോഗനിർണയമോ വിശദീകരണമോ ചേർക്കുന്നില്ല.
- source_word: שְׁתֵּי רַגְלָיו
  choice: രണ്ടു കാലിനും
  rationale: മൂലത്തിലെ ‘അവന്റെ രണ്ടു കാലുകൾ’ എന്ന നിർദിഷ്ടത നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളപ്രയോഗം സ്വീകരിക്കുന്നു.
- source_word: וְהוּא
  choice: അവൻ
  rationale: വാക്യത്തിന്റെ അവസാനത്തെ വിവരണക്കുറിപ്പ് മലയാളത്തിൽ പുതിയ വാക്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; എബ്രായത്തിലെ וְ എന്ന ബന്ധകത്തിന്റെ പ്രഭാഷണധർമ്മം നിർബന്ധമായി ‘എന്നും’ എന്നു പകർത്തുന്നില്ല.
