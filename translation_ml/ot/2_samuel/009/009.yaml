reference: 2 Samuel 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א הַ/מֶּ֗לֶךְ אֶל צִיבָ֛א נַ֥עַר שָׁא֖וּל וַ/יֹּ֣אמֶר אֵלָ֑י/ו כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה לְ/שָׁאוּל֙ וּ/לְ/כָל בֵּית֔/וֹ נָתַ֖תִּי לְ/בֶן אֲדֹנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ശൗലിന്റെ പരിചാരകനായ സീബയെ[a] വിളിച്ച് അവനോടു പറഞ്ഞു: “ശൗലിനും അവന്റെ മുഴുവൻ ഭവനത്തിനും[b] സ്വന്തമായിരുന്നതെല്ലാം ഞാൻ നിന്റെ യജമാനന്റെ മകന്[c] കൊടുത്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന് “ശൗലിന്റെ യുവാവ്” എന്നോ “ശൗലിന്റെ സേവകൻ” എന്നോ പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഒരു ഗൃഹപരിചാരകനെയോ ആശ്രിതസേവകനെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “അവന്റെ മുഴുവൻ ഭവനം” എന്നത് ശൗലിന്റെ കുടുംബത്തെയും ഗൃഹവ്യവസ്ഥയെയും ഗൃഹസ്ഥസ്വത്തിനെയും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: c
    text: “നിന്റെ യജമാനന്റെ മകൻ” എന്നു പറയുന്നത് മെഫീബോശെത്തിനെ സൂചിപ്പിക്കുന്നു. അവൻ ശൗലിന്റെ കൊച്ചുമകനാണ്; ഇവിടെ ഈ പ്രയോഗം വിശാലമായ വംശ-സാമൂഹിക ബന്ധഭാഷയായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: പരിചാരകൻ
  rationale: ഈ പദത്തിന് ‘യുവാവ്’ എന്നും അർഥമുണ്ടെങ്കിലും, ഇവിടെ ശൗലിന്റെ ഭവനവുമായി ബന്ധപ്പെട്ട സീബായുടെ സേവനപദവിയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘പരിചാരകൻ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל
  choice: ശൗലിന് ഉണ്ടായിരുന്നതെല്ലാം
  rationale: ഹീബ്രായ ഉടമസ്ഥതാപ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായും അതിന്റെ വ്യാപ്തി നിലനിർത്തിയും അവതരിപ്പിക്കുന്നു.
- source_word: וּלְכָל בֵּיתוֹ
  choice: അവന്റെ മുഴുവൻ ഭവനത്തിനും
  rationale: בַּיִת എന്ന പദത്തിലെ വീട്, കുടുംബം, ഗൃഹസ്ഥസ്വത്ത് എന്നീ സാധ്യതകൾ തുറന്നുവയ്ക്കാൻ ‘ഭവനം’ ഉപയോഗിച്ചു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: נָתַתִּי
  choice: ഞാൻ ... കൊടുത്തിരിക്കുന്നു
  rationale: പൂർത്തിയായതും ഇപ്പോഴും പ്രാബല്യത്തിലുള്ളതുമായ കൈമാറ്റം എന്ന ഹീബ്രായ perfect-ന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: നിന്റെ യജമാനന്റെ മകന്
  rationale: אֲדוֹן ഇവിടെ ദൈവിക സംബോധനമല്ല, സാമൂഹിക മേലധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘യജമാനൻ’ യോജിക്കുന്നു. ബന്ധപ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തി.
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  choice: അപ്പോൾ ... വിളിച്ച് ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ കഥാഗതിയും സംഭവക്രമവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘നിന്റെ യജമാനന്റെ മകൻ’ എന്ന ബന്ധനിർദേശം
  choice: മൂലത്തിലെ ബന്ധപ്രയോഗം അതേപടി നിലനിർത്തി; വ്യക്തിയെ അടിക്കുറിപ്പിൽ തിരിച്ചറിഞ്ഞു.
  alternative: പ്രധാനവാക്യത്തിൽ നേരിട്ട് ‘മെഫീബോശെത്തിന്’ എന്നു നൽകുക.
  rationale: മൂലപാഠത്തിലെ കുടുംബ-സാമൂഹിക ബന്ധഭാഷ സംരക്ഷിക്കുകയും, സന്ദർഭത്തിലെ വ്യക്തിയെ വായനക്കാരന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ കഥനശൈലി. ‘പരിചാരകൻ’, ‘ഭവനം’, ‘യജമാനൻ’ എന്നീ പദങ്ങൾ രാജകീയ-ഗൃഹസ്ഥ പശ്ചാത്തലം നിലനിർത്തുന്നു; മൂലത്തിലെ സാധ്യതയുള്ള അർഥവ്യാപ്തികൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
