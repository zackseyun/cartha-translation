  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിനോടുള്ള ആദരസൂചകമായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു; അതേസമയം ഹീബ്രായിലെ കൊട്ടാരവിനയവും സംക്ഷിപ്തതയും സംരക്ഷിച്ചു.
