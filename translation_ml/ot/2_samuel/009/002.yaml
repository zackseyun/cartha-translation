base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: The house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
translation:
  language: ml
  text: ശൗലിന്റെ കുടുംബത്തിന് സീബാ എന്നു പേരുള്ള ഒരു ദാസൻ ഉണ്ടായിരുന്നു. അവർ അവനെ ദാവീദിന്റെ അടുക്കൽ വിളിച്ചുവരുത്തി. രാജാവ് അവനോട്, “നീയാണോ സീബാ?” എന്നു ചോദിച്ചു. അവൻ, “അങ്ങയുടെ ദാസൻ[a],” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “ഞാൻ അങ്ങയുടെ ദാസനാണ്.” ഹീബ്രായിലെ മറുപടി സംക്ഷിപ്തമായി “അങ്ങയുടെ ദാസൻ” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית שָׁאוּל
  choice: ശൗലിന്റെ കുടുംബത്തിന് ... ഉണ്ടായിരുന്നു
  rationale: ഹീബ്രായിലെ അസ്തിത്വം/ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ആരംഭത്തിലെ waw-ന് പ്രത്യേകമായ കാലസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: עֶבֶד
  choice: ഒരു ദാസൻ
  rationale: עבד എന്നതിന് അടിമ എന്നും ദാസൻ എന്നും അർഥമാകാം; ഇവിടെ ശൗലിന്റെ കുടുംബവുമായി ബന്ധപ്പെട്ട ഗൃഹപരിചാരകന്റെ നിലയാണ് സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്.
- source_word: וּשְׁמוֹ צִיבָא
  choice: സീബാ എന്നു പേരുള്ള
  rationale: തിരിച്ചറിയൽ നൽകുന്ന ഹീബ്രായിപ്രയോഗത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: וַיִּקְרְאוּ לוֹ אֶל דָּוִד
  choice: അവർ അവനെ ദാവീദിന്റെ അടുക്കൽ വിളിച്ചുവരുത്തി
  rationale: קרא എന്ന ക്രിയയും ലക്ഷ്യസൂചക ഘടനയും ചേർന്ന് ദാവീദിന്റെ സന്നിധിയിലേക്കു വിളിപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ 'വിളിച്ചുവരുത്തി' ഈ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: കഥാസന്ദർഭത്തിൽ ദാവീദിനെ സൂചിപ്പിക്കുന്ന നിശ്ചിത സ്ഥാനപ്പേര്.
- source_word: הַאַתָּה צִיבָא
  choice: നീയാണോ സീബാ?
  rationale: ചോദ്യകണവും സർവനാമവും ചേർന്ന ഹീബ്രായിചോദ്യം സ്വാഭാവികമായ മലയാളചോദ്യമായി നൽകിയിരിക്കുന്നു.
- source_word: עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻതന്നെ
  rationale: മൂലത്തിലെ അക്ഷരാർഥം 'അങ്ങയുടെ ദാസൻ' എന്ന സംക്ഷിപ്തവും വിനയപൂർവവുമായ മറുപടിയാണ്. 'തന്നെ' ചോദ്യം സ്ഥിരീകരിക്കുന്ന സന്ദർഭാർഥം മലയാളത്തിൽ നൽകുന്നു; കർത്താവും ക്രിയയും ചേർക്കാത്തതിനാൽ മൂലത്തിലെ സംക്ഷിപ്തത നിലനിൽക്കുന്നു.
