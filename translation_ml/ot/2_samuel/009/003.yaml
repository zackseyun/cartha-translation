id: 2SA.9.3
reference: 2 Samuel 9:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֗לֶךְ הַ/אֶ֨פֶס ע֥וֹד אִישׁ֙ לְ/בֵ֣ית שָׁא֔וּל וְ/אֶעֱשֶׂ֥ה עִמּ֖/וֹ חֶ֣סֶד אֱלֹהִ֑ים וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ ע֛וֹד בֵּ֥ן לִ/יהוֹנָתָ֖ן נְכֵ֥ה רַגְלָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/003.yaml
  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ചോദിച്ചു: “ശൗലിന്റെ കുടുംബത്തിൽ ഇനിയും ആരെങ്കിലും ശേഷിച്ചിട്ടുണ്ടോ? ഞാൻ അയാളോടു ദൈവത്തിന്റെ ദയ[a] കാണിക്കട്ടെ.” സീബാ രാജാവിനോടു പറഞ്ഞു: “യോനാഥാന് ഒരു മകൻ ഇപ്പോഴും ഉണ്ട്; അയാളുടെ ഇരുകാലുകൾക്കും വൈകല്യമുണ്ട്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൈവത്തിന്റെ ഉടമ്പടിവിശ്വസ്തത” എന്നോ “ദൈവികമായ ദയ” എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “കാലുകളിൽ മുടന്തുള്ളവൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ
  choice: ഇനിയും ആരെങ്കിലും ശേഷിച്ചിട്ടുണ്ടോ?
  rationale: ഈ എബ്രായ പ്രയോഗം ആരെങ്കിലും ശേഷിക്കുന്നുണ്ടോ എന്ന അന്വേഷണമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ ചോദ്യരൂപം ഉപയോഗിച്ചുകൊണ്ട് ‘ഇനിയും’ എന്ന ആശയവും ശേഷിച്ചിരിക്കുന്ന കുടുംബാംഗത്തെക്കുറിച്ചുള്ള അന്വേഷണവും നിലനിർത്തുന്നു.
- source_word: לְבֵית שָׁאוּל
  choice: ശൗലിന്റെ കുടുംബത്തിൽ
  rationale: ഇവിടെ ‘ഭവനം’ എന്നത് കെട്ടിടമല്ല, ശൗലിന്റെ കുടുംബവംശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കുടുംബം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְאֶעֱשֶׂה עִמּוֹ
  choice: ഞാൻ അയാളോടു ... കാണിക്കട്ടെ
  rationale: חֶסֶד-നോടൊപ്പം ‘ചെയ്യുക’ എന്ന അക്ഷരാർഥത്തെക്കാൾ ‘ദയ കാണിക്കുക’ മലയാളത്തിൽ സ്വാഭാവികമാണ്. ക്രിയാരൂപത്തിലെ ഉദ്ദേശ്യഭാവം ‘കാണിക്കട്ടെ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: חֶסֶד אֱלֹהִים
  choice: ദൈവത്തിന്റെ ദയ
  rationale: חֶסֶד എന്നതിൽ കരുണയും വിശ്വസ്തമായ സ്നേഹവും ഉടമ്പടിനിഷ്ഠയും ഉൾക്കൊള്ളാം. ‘ദൈവത്തിന്റെ ദയ’ എബ്രായത്തിലെ ദൈവസംബന്ധിയായ ജനിറ്റീവ് ബന്ധം തുറന്നുവെക്കുകയും ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: עוֹד בֵּן לִיהוֹנָתָן
  choice: യോനാഥാന് ഒരു മകൻ ഇപ്പോഴും ഉണ്ട്
  rationale: യോനാഥാന്റെ ഒരു മകൻ ശേഷിച്ചിരിക്കുന്നുവെന്ന പ്രസ്താവന ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘ഇപ്പോഴും’ എബ്രായത്തിലെ עוֹד-ന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: נְכֵה רַגְלָיִם
  choice: അയാളുടെ ഇരുകാലുകൾക്കും വൈകല്യമുണ്ട്
  rationale: ഈ പ്രയോഗം കാലുകളെ ബാധിച്ച ശാരീരിക വൈകല്യത്തെ സൂചിപ്പിക്കുന്നു. വ്യക്തിയെ അപമാനകരമായ ഒരു വിശേഷണത്തിലേക്ക് ചുരുക്കാതെ, ഉറവിടത്തിലെ ഇരുകാലുകളെ സംബന്ധിച്ച അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: חֶסֶד אֱלֹהִים എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: ദൈവത്തിന്റെ ദയ
  alternative: ദൈവത്തിന്റെ ഉടമ്പടിവിശ്വസ്തത / ദൈവികമായ ദയ
  rationale: ഈ പ്രയോഗം ദൈവത്തിന്റേതായ ദയയെയോ ദൈവത്തെ പ്രതിഫലിപ്പിക്കുന്ന ദയയെയോ ഉടമ്പടിബന്ധത്തിലെ വിശ്വസ്തസ്നേഹത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഈ സാധ്യതകളെ ചുരുക്കാതെ നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് പ്രധാന വ്യാഖ്യാനവികല്പങ്ങൾ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ശാരീരിക വൈകല്യത്തെ വിവരിക്കുമ്പോൾ അപമാനകരമാകാവുന്ന പഴയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി വ്യക്തികേന്ദ്രിതമായ ഭാഷ ഉപയോഗിച്ചു; അതേസമയം എബ്രായത്തിലെ ഇരുകാലുകളെ സംബന്ധിച്ച സൂചന സംരക്ഷിച്ചു.
