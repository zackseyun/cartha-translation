  yaml_path: translation/ot/2_samuel/009/005.yaml
  text: So King David sent and took him from the house of Machir son of Ammiel[a], from Lo-debar.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് രാജാവ് ആളയച്ച്, അമ്മീയേലിന്റെ മകനായ മാഖീരിന്റെ ലോ-ദെബാറിലെ വീട്ടിൽനിന്ന് അവനെ കൊണ്ടുവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ദാവീദ് രാജാവ് അയച്ച്, ... അവനെ എടുത്തു.” ഇവിടെ “ആളയച്ച് ... കൊണ്ടുവന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ച്
  rationale: ശׁלח എന്ന ക്രിയയുടെ ‘അയച്ചു’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, ഒരാളെ വരുത്താനായി ആളെ അയച്ചുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവ്
  rationale: എബ്രായത്തിലെ രാജപദവിയും വ്യക്തിനാമവും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകുന്നു.
- source_word: וַיִּקָּחֵהוּ
  choice: അവനെ കൊണ്ടുവന്നു
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണെങ്കിലും, രാജാവ് ആളയച്ചശേഷം മഫീബോശെത്തിനെ തന്റെ അടുക്കൽ വരുത്തുന്ന ഈ സന്ദർഭത്തിൽ ‘കൊണ്ടുവന്നു’ എന്നത് ലക്ഷ്യാർഥം അമിതമായി വികസിപ്പിക്കാതെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִבֵּית
  choice: വീട്ടിൽനിന്ന്
  rationale: בַּיִת എന്നത് ‘വീട്’ എന്നും ‘കുടുംബം/ഭവനം’ എന്നും വരാം; ഇവിടെ ഒരാൾ താമസിച്ചിരുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നതിനാൽ ‘വീട്ടിൽനിന്ന്’ യോജിക്കുന്നു, അതേസമയം അടിസ്ഥാന ദ്വയാർഥസാധ്യത നിലനിൽക്കുന്നു.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: അമ്മീയേലിന്റെ മകനായ മാഖീർ
  rationale: ബന്ധസൂചകമായ എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃക്രമീകരിക്കുകയും പേരുകൾ ഉറവിട ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: מִלּוֹ דְבָר
  choice: ലോ-ദെബാറിലെ
  rationale: ഇത് സന്ദർഭത്തിൽ സ്ഥലനാമമാണ്. ആവർത്തിച്ചുള്ള מִן മലയാളത്തിൽ ‘ലോ-ദെബാറിലെ വീട്ടിൽനിന്ന്’ എന്ന ഒറ്റ സ്വാഭാവിക ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
