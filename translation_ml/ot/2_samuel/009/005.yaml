translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ‘അയച്ചു + അവനെ എടുത്തു’ എന്ന ക്രമം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചുകൊണ്ട് മുഖ്യവാചകത്തിൽ സന്ദർഭോചിതമായ മലയാള പ്രയോഗം ഉപയോഗിച്ചു.
