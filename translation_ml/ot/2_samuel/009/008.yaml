reference: 2 Samuel 9:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁתַּ֕חוּ וַ/יֹּ֖אמֶר מֶ֣ה עַבְדֶּ֑/ךָ כִּ֣י פָנִ֔יתָ אֶל הַ/כֶּ֥לֶב הַ/מֵּ֖ת אֲשֶׁ֥ר כָּמֽוֹ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/008.yaml
  text: And he bowed down and said[a], “What is your servant[b], that you have turned toward a dead dog like me?”
translation:
  language: ml
  text: 'അവൻ വണങ്ങി പറഞ്ഞു: “അങ്ങയുടെ ദാസൻ എന്താണ്, എന്നെപ്പോലെയുള്ള ചത്ത നായയുടെ[b] നേരെ അങ്ങ് തിരിഞ്ഞത്[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നേരെ തിരിയുക” എന്നത് ഇവിടെ ശ്രദ്ധിക്കുകയോ പരിഗണിക്കുകയോ ചെയ്യുക എന്ന അർഥം നൽകുന്നു; എബ്രായം കരുണാപൂർവമായ ശ്രദ്ധയെ ദൃശ്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ചത്ത നായ” എന്നത് അങ്ങേയറ്റത്തെ ആത്മതാഴ്ത്തലും താൻ തീർത്തും വിലയില്ലാത്തവനാണെന്ന ബോധവും പ്രകടിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: സാഷ്ടാംഗം വീണു
  rationale: ഹിത്പാഎൽ രൂപത്തിലുള്ള שׁחה ആദരവോടെയോ വിധേയത്വത്തോടെയോ ശരീരം കുനിച്ച് നമസ്കരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. രാജസന്നിധിയിലെ ശാരീരിക ഭാവം വ്യക്തമാക്കുകയും ആരാധന എന്ന അർഥം നിർബന്ധമായി ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מֶה עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ എന്തുള്ളൂ
  rationale: ‘അങ്ങയുടെ ദാസൻ എന്താണ്?’ എന്ന എബ്രായ ആത്മതാഴ്ത്തൽ പ്രയോഗത്തിന്റെ അസാധാരണമായെങ്കിലും ഗ്രഹിക്കാവുന്ന രൂപം നിലനിർത്തുന്നു; ‘ഞാൻ ആരാണ്?’ എന്നു ലളിതമാക്കി മൂലത്തിലെ ‘എന്ത്’ എന്ന ഊന്നൽ നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: כִּי
  choice: …തിരിയാൻ?
  rationale: ഇവിടെ כִּי ആലങ്കാരിക ചോദ്യത്തിന്റെ ഫലമോ അടിസ്ഥാനമോ അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ക്രിയാനാമപ്രയോഗം ‘എന്തുള്ളൂ, … തിരിയാൻ?’ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: פָנִיתָ אֶל
  choice: നേരെ അങ്ങ് തിരിയാൻ
  rationale: פנה אל എന്നതിന്റെ ‘നേരെ തിരിയുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് കരുണാപൂർവമായ ശ്രദ്ധയെയും പരിഗണനയെയും സൂചിപ്പിക്കുന്നു.
- source_word: הַכֶּלֶב הַמֵּת
  choice: ചത്ത നായ
  rationale: അങ്ങേയറ്റത്തെ ആത്മതാഴ്ത്തലും വിലയില്ലായ്മയും പ്രകടിപ്പിക്കുന്ന ശക്തമായ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר כָּמוֹנִי
  choice: എന്നെപ്പോലെയുള്ള
  rationale: ബന്ധവാക്യം ‘ചത്ത നായ’യെ വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
