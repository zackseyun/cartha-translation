translation_notes:
  register: ആധുനികവും മാന്യവുമായ രാജസദസ്സിന്റെ ഭാഷയ്ക്കായി രാജാവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. മൂലത്തിലെ ശക്തമായ ആത്മതാഴ്ത്തൽ മൃദുവാക്കാതെ, വാക്യം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
