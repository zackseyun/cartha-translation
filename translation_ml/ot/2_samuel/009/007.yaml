source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ דָוִ֜ד אַל תִּירָ֗א כִּ֣י עָשֹׂה֩ אֶעֱשֶׂ֨ה עִמְּ/ךָ֥ חֶ֨סֶד֙ בַּֽ/עֲבוּר֙ יְהוֹנָתָ֣ן אָבִ֔י/ךָ וַ/הֲשִׁבֹתִ֣י לְ/ךָ֔ אֶֽת כָּל שְׂדֵ֖ה שָׁא֣וּל אָבִ֑י/ךָ וְ/אַתָּ֗ה תֹּ֥אכַל לֶ֛חֶם עַל שֻׁלְחָנִ֖/י תָּמִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
translation:
  language: ml
  text: 'ദാവീദ് അവനോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ. നിന്റെ പിതാവായ യോനാഥാനെ ഓർത്ത് ഞാൻ നിനക്കു തീർച്ചയായും ദയ[a] കാണിക്കും. നിന്റെ പിതാവായ ശൗലിന്റെ ഭൂമിയെല്ലാം ഞാൻ നിനക്കു തിരികെ നൽകും[b]. നീ എപ്പോഴും എന്റെ മേശയിൽ ഭക്ഷണം കഴിക്കും[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദയ’ എന്നതിനുള്ള ഹീബ്രു പദമായ ഹെസെദിന് ‘വിശ്വസ്തസ്നേഹം’, ‘അചഞ്ചലസ്നേഹം’, ‘ഉടമ്പടി-വിശ്വസ്തത’ എന്നീ അർഥഭാവങ്ങളും ഉണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നിന്റെ പിതാവായ ശൗൽ.” ഹീബ്രുവിൽ ‘പിതാവ്’ എന്ന പദം ഒരു പൂർവപിതാവിനെയും സൂചിപ്പിക്കാം; ഇവിടെ ശൗൽ മെഫീബോശെത്തിന്റെ പിതാമഹനാണ്.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “എന്റെ മേശയിൽ എപ്പോഴും അപ്പം ഭക്ഷിക്കും”; ഇത് തുടർച്ചയായ പരിപാലനത്തെയും മേശക്കൂട്ടായ്മയെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധാത്മക ആജ്ഞയോടൊപ്പം ആശ്വാസവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כִּי עָשֹׂה אֶעֱשֶׂה
  choice: ഞാൻ നിനക്കു തീർച്ചയായും ... കാണിക്കും
  rationale: ക്രിയയെ ശക്തിപ്പെടുത്തുന്ന infinitive absolute രൂപത്തിന്റെ ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: חֶסֶד
  choice: ദയ
  rationale: ഈ സന്ദർഭത്തിലെ പ്രവൃത്തിയായി പ്രകടമാകുന്ന വിശ്വസ്ത സ്നേഹവും ഔദാര്യവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന പദത്തിൽ നൽകുന്നു; വിശാലമായ ഉടമ്പടി-വിശ്വസ്തതയുടെ ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בַּעֲבוּר יְהוֹנָתָן אָבִיךָ
  choice: നിന്റെ പിതാവായ യോനാഥാനെ ഓർത്ത്
  rationale: പ്രവൃത്തിയുടെ കാരണം യോനാഥാനുമായുള്ള ബന്ധമാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַהֲשִׁבֹתִי לְךָ
  choice: ഞാൻ നിനക്കു തിരികെ നൽകും
  rationale: Hiphil രൂപത്തിന്റെ സ്വത്ത് പുനഃസ്ഥാപിക്കുന്ന അർഥം നേരായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל שְׂדֵה שָׁאוּל
  choice: ശൗലിന്റെ ഭൂമിയെല്ലാം
  rationale: שָׂדֶה ഏകവചനമായിരുന്നാലും ഇവിടെ മുഴുവൻ ഭൂസ്വത്തിനെ കൂട്ടായ അർഥത്തിൽ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭൂമിയെല്ലാം’ അനുയോജ്യം.
- source_word: שָׁאוּל אָבִיךָ
  choice: നിന്റെ പിതാവായ ശൗൽ
  rationale: മൂലപാഠത്തിലെ ബന്ധപദം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു; ഇവിടെ അത് പൂർവപിതാവിനെയും സൂചിപ്പിക്കാമെന്ന ചരിത്രബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: תֹּאכַל לֶחֶם עַל שֻׁלְחָנִי תָּמִיד
  choice: നീ എപ്പോഴും എന്റെ മേശയിൽ ഭക്ഷണം കഴിക്കും
  rationale: ‘അപ്പം ഭക്ഷിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ തുടർച്ചയായ പരിപാലനവും രാജാവിനോടുള്ള മേശക്കൂട്ടായ്മയും സ്വാഭാവിക മലയാളത്തിൽ എത്തിക്കുന്നു.
theological_decisions:
- issue: חֶסֶד എന്ന പദത്തിലെ ഉടമ്പടി-വിശ്വസ്തതയുടെ ഭാവം
  choice: മുഖ്യപാഠത്തിൽ ‘ദയ’; അടിക്കുറിപ്പിൽ ‘വിശ്വസ്തസ്നേഹം’, ‘അചഞ്ചലസ്നേഹം’, ‘ഉടമ്പടി-വിശ്വസ്തത’ എന്നീ സാധ്യതകൾ
  alternative: മുഖ്യപാഠത്തിൽ ‘വിശ്വസ്തസ്നേഹം’ അല്ലെങ്കിൽ ‘ഉടമ്പടി-വിശ്വസ്തത’
  rationale: ദാവീദ് യോനാഥാനുമായുള്ള ബന്ധത്തെ മാനിച്ച് മെഫീബോശെത്തിനോടു ചെയ്യുന്ന പ്രായോഗിക നന്മയാണ് സന്ദർഭത്തിലെ മുൻനിര ആശയം. എന്നാൽ പദത്തിന്റെ ബന്ധപരവും ഉടമ്പടിപരവുമായ സമ്പന്നത നഷ്ടപ്പെടാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
- issue: שָׁאוּל אָבִיךָ എന്നതിലെ אָב ബന്ധപദം
  choice: മൂലരൂപം അനുസരിച്ച് ‘നിന്റെ പിതാവായ ശൗൽ’
  alternative: വംശാവലി വ്യക്തതയ്ക്കായി ‘നിന്റെ പിതാമഹനായ ശൗൽ’
  rationale: ഹീബ്രുവിലെ אָב നേരിട്ടുള്ള പിതാവിനൊപ്പം പൂർവപിതാവിനെയും സൂചിപ്പിക്കാം. മെഫീബോശെത്തിന്റെ പിതാവ് യോനാഥാനും പിതാമഹൻ ശൗലുമാണെങ്കിലും, മുഖ്യപാഠത്തിൽ ഉറവിടത്തിന്റെ ഭാഷ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിലാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. കൃത്രിമമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കിയെങ്കിലും, ആവർത്തനത്തിലെ ഊന്നൽ, ബന്ധപദത്തിലെ ഉറവിടരൂപം, חֶסֶד എന്ന പദത്തിന്റെ അർഥസമ്പത്ത് എന്നിവ സംരക്ഷിച്ചു.
