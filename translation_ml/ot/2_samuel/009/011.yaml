reference: 2 Samuel 9:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ כְּ/כֹל֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ אֶת עַבְדּ֔/וֹ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וּ/מְפִיבֹ֗שֶׁת אֹכֵל֙ עַל שֻׁלְחָנִ֔/י כְּ/אַחַ֖ד מִ/בְּנֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
translation:
  language: ml
  text: 'സീബാ രാജാവിനോടു പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവ് തന്റെ ദാസനോടു കല്പിക്കുന്നതെല്ലാം അങ്ങയുടെ ദാസൻ അതുപോലെ ചെയ്യും.” മെഫീബോശെത്ത് രാജാവിന്റെ പുത്രന്മാരിൽ ഒരാളെപ്പോലെ എന്റെ മേശയിൽ ഭക്ഷണം കഴിച്ചുപോന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘എന്റെ മേശയിൽ’ എന്നാണ്. ഇവിടെ പെട്ടെന്ന് ഒന്നാംപുരുഷത്തിലേക്കു മാറുന്നത് ദാവീദിന്റെ കാഴ്ചപ്പാട് പ്രതിഫലിപ്പിക്കുന്നതാകാം. ചില പുരാതന സാക്ഷ്യങ്ങളും വിവർത്തനങ്ങളും ഇത് ‘രാജാവിന്റെ മേശയിൽ’ എന്നു നൽകുന്നു.
    reason: പാഠത്തിലെ വ്യക്തിമാറ്റവും പുരാതന പാഠസാക്ഷ്യങ്ങളിലെ വ്യത്യാസവും വായനക്കാരനെ അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: കഥാഖ്യാനത്തിൽ നേരിട്ടുള്ള സംഭാഷണം അവതരിപ്പിക്കുന്ന אָמַר എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: כְּכֹל אֲשֶׁר יְצַוֶּה
  choice: കല്പിക്കുന്നതെല്ലാം … അതുപോലെ
  rationale: כְּכֹל אֲשֶׁר എന്ന സമഗ്രതയും כֵּן എന്ന അനുരൂപതയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: രാജസന്നിധിയിലെ ആദരപൂർവമായ അഭിസംബോധന സംരക്ഷിക്കുന്നു; ഇവിടെ യജമാനൻ എന്നത് മനുഷ്യനായ രാജാവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: עַבְדּוֹ / עַבְדֶּךָ
  choice: തന്റെ ദാസൻ / അങ്ങയുടെ ദാസൻ
  rationale: രാജസേവനത്തിലെ വിനയപൂർവമായ സ്വയംപരാമർശമാണ് സന്ദർഭത്തിൽ പ്രധാനമായത്; ബദ്ധദാസ്യതയെ അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: כֵּן יַעֲשֶׂה
  choice: അതുപോലെ ചെയ്യും
  rationale: അനുസരണത്തിന്റെ പ്രതിജ്ഞയായ ഭാവിക്രിയയും כֵּן എന്ന അനുരൂപതയും വ്യക്തമായി നൽകുന്നു.
- source_word: אֹכֵל
  choice: ഭക്ഷണം കഴിച്ചുപോന്നു
  rationale: ഖാൽ പാർട്ടിസിപ്പിളിന്റെ തുടരുന്നതോ പതിവായതോ ആയ ക്രമീകരണത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാലപ്രയോഗത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל שֻׁלְחָנִי
  choice: എന്റെ മേശയിൽ
  rationale: മസോററ്റിക് പാഠത്തിലെ ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം മാറ്റാതെ നിലനിർത്തുന്നു; വിരുന്നുമേശയിലെ പങ്കാളിത്തം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ പുത്രന്മാരിൽ ഒരാളെപ്പോലെ
  rationale: താരതമ്യവും രാജകുടുംബാംഗത്തിനുതുല്യമായ പദവിയും കൃത്യമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവസാന വാക്യത്തിലെ ‘എന്റെ മേശ’ എന്നു പറയുന്ന വ്യക്തി
  choice: മസോററ്റിക് പാഠത്തിലെ ഒന്നാംപുരുഷരൂപമായ ‘എന്റെ മേശയിൽ’ നിലനിർത്തി; അത് ദാവീദിന്റെ കാഴ്ചപ്പാട് പ്രതിഫലിപ്പിക്കുന്നതായി കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: വ്യക്തിമാറ്റം ലളിതമാക്കാൻ ‘രാജാവിന്റെ മേശയിൽ’ എന്നു വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ ഇതിനെ പൂർണമായും ആഖ്യാതാവിന്റെ സംഗ്രഹമായി കാണുക.
  rationale: שֻׁלְחָנִי എന്ന എബ്രായരൂപം വ്യക്തമായി ‘എന്റെ മേശ’ എന്നാണ്. ലക്ഷ്യഭാഷയിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ മുഖ്യപാഠം തിരുത്തുന്നതിനുപകരം യഥാർഥ പാഠത്തിലെ പെട്ടെന്നുള്ള വ്യക്തിമാറ്റവും അതിന്റെ വ്യാഖ്യാനസാധ്യതയും അടിക്കുറിപ്പോടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജസന്നിധിയിലെ ആദരസൂചകമായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു; അമിതപുരാതന പദക്രമം ഒഴിവാക്കി.
