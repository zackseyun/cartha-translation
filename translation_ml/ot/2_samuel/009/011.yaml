  naturalness: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വാക്യങ്ങൾ വ്യക്തവും മാന്യവുമാണ്. രാജാവിനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ സ്വാഭാവികമായി യോജിക്കുന്നു. ‘രാജാവിന്റെ പുത്രന്മാരിൽ ഒരാളെപ്പോലെ’ എന്ന പ്രയോഗം താരതമ്യവും രാജകീയപദവിയും വ്യക്തമായി കൈമാറുന്നു.
