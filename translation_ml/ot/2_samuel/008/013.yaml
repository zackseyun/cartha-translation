  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ דָּוִד֙ שֵׁ֔ם בְּ/שֻׁב֕/וֹ מֵ/הַכּוֹת֥/וֹ אֶת אֲרָ֖ם בְּ/גֵיא מֶ֑לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/013.yaml
  text: And David made a name for himself when he returned from striking down Aram in the Valley of Salt—eighteen thousand men[a].
translation:
  language: ml
  text: ദാവീദ് ഉപ്പുതാഴ്‌വരയിൽ അരാമ്യരായ പതിനെണ്ണായിരം പേരെ അടിച്ചുവീഴ്ത്തിയശേഷം മടങ്ങിവന്നപ്പോൾ തനിക്കു കീർത്തി നേടി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പാഠസാക്ഷികളും 1 ദിനവൃത്താന്തം 18:12-ലെ സമാന്തരവിവരണവും ഇവിടെ ‘അരാമ്യർ’ എന്നതിനുപകരം ‘എദോമ്യർ’ എന്ന വായനയെ സൂചിപ്പിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַשׂ ... שֵׁם
  choice: തനിക്കു കീർത്തി നേടി
  rationale: ‘ഒരു പേര് ഉണ്ടാക്കി’ എന്ന എബ്രായ ശൈലിയുടെ അർഥം പ്രശസ്തിയോ കീർത്തിയോ നേടുക എന്നതാണ്. അക്ഷരാർഥത്തിലുള്ള പ്രയോഗത്തേക്കാൾ ‘കീർത്തി നേടി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അർഥസുതാര്യവുമാണ്.
- source_word: בְּשֻׁבוֹ
  choice: മടങ്ങിവന്നപ്പോൾ
  rationale: ബെത് ഉപസർഗത്തോടുകൂടിയ infinitive construct ഇവിടെ കാലസൂചന നൽകുന്നു; മലയാളത്തിലെ ‘മടങ്ങിവന്നപ്പോൾ’ സംഭവക്രമം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: מֵהַכּוֹתוֹ
  choice: സംഹരിച്ചശേഷം
  rationale: נכה യുദ്ധസന്ദർഭത്തിൽ പ്രഹരിച്ച് വീഴ്ത്തുകയോ കൊല്ലുകയോ എന്ന ശക്തമായ അർഥം വഹിക്കുന്നു. എണ്ണപ്പെട്ട യുദ്ധനഷ്ടം സൂചിപ്പിക്കുന്നതിനാൽ ‘സംഹരിച്ചശേഷം’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: אֶת אֲרָם
  choice: അരാമ്യരിൽ
  rationale: മസോറെറ്റിക് പാഠത്തിലെ אֲרָם മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. വ്യക്തികളുടെ എണ്ണം പിന്നാലെ വരുന്നതിനാൽ മലയാളത്തിൽ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ‘അരാമ്യരിൽ’ സ്വാഭാവികമാണ്.
- source_word: בְּגֵיא מֶלַח
  choice: ഉപ്പുതാഴ്‌വരയിൽ
  rationale: സ്ഥലനാമത്തിന്റെ ഘടകാർഥം നിലനിർത്തുന്ന, ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: പതിനെണ്ണായിരം പേരെ
  rationale: എബ്രായത്തിൽ സംഖ്യയ്ക്കുശേഷം നാമം വ്യക്തമാക്കിയിട്ടില്ല. യുദ്ധസന്ദർഭത്തിൽ മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘പേരെ’ ചേർത്തു.
theological_decisions:
- issue: പരാജയപ്പെടുത്തിയ ശത്രുവിന്റെ തിരിച്ചറിയൽ
  choice: മുഖ്യപാഠത്തിൽ ‘അരാം/അരാമ്യർ’
  alternative: ‘എദോം/എദോമ്യർ’
  rationale: നൽകിയിരിക്കുന്ന WLC മസോറെറ്റിക് പാഠം אֲרָם (‘അരാം’) എന്നാണ് വായിക്കുന്നത്. എന്നാൽ ചില പാഠസാക്ഷികളും 1 ദിനവൃത്താന്തം 18:12-ലെ സമാന്തരവിവരണവും ‘എദോം’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. അതിനാൽ മൂലപാഠവായന മുഖ്യവാക്യത്തിൽ നിലനിർത്തി പ്രധാനപ്പെട്ട വ്യത്യസ്തവായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായ ശൈലിപ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായി പകർന്നുകൊടുക്കുന്നതിനൊപ്പം പാഠഭേദം അടിക്കുറിപ്പിലൂടെ സുതാര്യമാക്കി.
