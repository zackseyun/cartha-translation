  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘അരാം/അരാമ്യർ’ എന്ന വ്യത്യാസം രാജ്യത്തെയും ജനവിഭാഗത്തെയും സ്വാഭാവികമായി വേർതിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
