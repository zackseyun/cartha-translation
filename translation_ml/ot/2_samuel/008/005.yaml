  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: ml
  text: ദമസ്കൊസിലെ അരാം, സോബാ രാജാവായ ഹദദേസെരിനെ[b] സഹായിക്കാൻ വന്നു. ദാവീദ് അരാമ്യരായ ഇരുപത്തിരണ്ടായിരം പുരുഷന്മാരെ അടിച്ചുവീഴ്ത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദമായ אֲרַם ഇവിടെ പരമ്പരാഗതമായ ‘സിറിയ’ എന്നതിനു പകരം ‘അരാം’ എന്നു നൽകിയിരിക്കുന്നു; അത് ദമസ്കൊസ് കേന്ദ്രമായിരുന്ന അരാമ്യ രാജ്യത്തെയും ജനത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ചില വേദഭാഗങ്ങളിലും പരിഭാഷകളിലും ഹദദേസെർ എന്ന പേര് ‘ഹദരെസെർ’ എന്നു കാണപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבֹא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ കഥനക്രമത്തിലുള്ള രൂപം; സ്വാഭാവികമായ ഭൂതകാല വിവരണമായി ‘വന്നു’ എന്നു നൽകി.
- source_word: אֲרַם דַּמֶּשֶׂק
  choice: ദമസ്കൊസിലെ അരാം
  rationale: പിൽക്കാല ഭൂമിശാസ്ത്രനാമമായ ‘സിറിയ’ കൊണ്ടുവരാതെ, ദമസ്കൊസ് കേന്ദ്രമായിരുന്ന അരാമ്യ രാജ്യത്തെ സൂചിപ്പിക്കുന്ന മൂലപദം നിലനിർത്തുന്നു.
- source_word: לַעְזֹר
  choice: സഹായിക്കാൻ
  rationale: עזר എന്നതിന്റെ ലളിതവും സ്വാഭാവികവുമായ അർഥം.
- source_word: לַהֲדַדְעֶזֶר
  choice: ഹദദേസെരിനെ
  rationale: ഇവിടെയുള്ള എബ്രായ നാമരൂപമായ הֲדַדְעֶזֶר അനുസരിച്ചുള്ള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ צוֹבָה
  choice: സോബാ രാജാവായ
  rationale: നാമത്തോടു ചേർന്ന സ്ഥാനവിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּךְ
  choice: സംഹരിച്ചു
  rationale: യുദ്ധസന്ദർഭത്തിലെ נכה ഇവിടെ അനേകം ആളുകളുടെ മരണത്തിലേക്കു നയിച്ച പ്രഹരത്തെ സൂചിപ്പിക്കുന്നു; ‘സംഹരിച്ചു’ അതിന്റെ സൈനികബലം വ്യക്തമാക്കുന്നു.
- source_word: בַּאֲרָם
  choice: അരാമ്യരിൽ
  rationale: נכה-യോടൊപ്പമുള്ള ב ആക്രമണം ഏറ്റ ജനവിഭാഗത്തെ അടയാളപ്പെടുത്തുന്നു; തുടർന്നുള്ള ആളെണ്ണത്തോടു ചേർന്ന് ‘അരാമ്യരിൽ’ സ്വാഭാവികമാണ്.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: ഇരുപത്തിരണ്ടായിരം പേരെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇരുപത്തിരണ്ടായിരം മനുഷ്യർ’; പുരുഷസൈനികർ സന്ദർഭത്തിൽ സൂചിതരാണെങ്കിലും ‘സൈനികർ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘പേർ’ ഉപയോഗിച്ചു.
