id: 2SA.8.1
reference: 2 Samuel 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛ד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֥ח דָּוִ֛ד אֶת מֶ֥תֶג הָ/אַמָּ֖ה מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
translation:
  language: ml
  text: ഇതിനുശേഷം ദാവീദ് ഫെലിസ്ത്യരെ ആക്രമിച്ചു കീഴടക്കി. ഫെലിസ്ത്യരുടെ കൈയിൽനിന്ന് ദാവീദ് മെഥെഗ്-അമ്മാ[a] പിടിച്ചെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടത്തെ ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘മാതൃനഗരത്തിന്റെ കടിഞ്ഞാൺ’ എന്നാണ്; ഇത് ദുഷ്കരമായ ഒരു പ്രയോഗമാണ്. മുഖ്യനഗരത്തിന്മേലുള്ള നിയന്ത്രണത്തെ ഇതു സൂചിപ്പിക്കാം. 1 ദിനവൃത്താന്തം 18:1-ൽ സമാന്തരവിവരണം ‘ഗത്തും അതിന്റെ പുത്രിനഗരങ്ങളും’ എന്നു പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: ഇതിനുശേഷം
  rationale: കഥയുടെ കാലക്രമത്തിലുള്ള മുന്നേറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘സംഭവിച്ചു’ എന്ന ഹീബ്രു ആഖ്യാനസൂത്രം വേറിട്ട് പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: וַיַּךְ
  choice: ആക്രമിച്ചു
  rationale: സൈനികസന്ദർഭത്തിൽ נכה അടിക്കുക/ആക്രമിക്കുക എന്ന പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘കീഴടക്കി’ ഫലം വ്യക്തമാക്കുന്നതിനാൽ ‘തോൽപ്പിച്ചു’ എന്ന ആവർത്തനപരമായ അർഥം ഒഴിവാക്കി.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ പേരിന് മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ രൂപം.
- source_word: וַיַּכְנִיעֵם
  choice: കീഴടക്കി
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള כנע സൂചിപ്പിക്കുന്ന സൈനിക-രാഷ്ട്രീയ അധീനപ്പെടുത്തൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיִּקַּח
  choice: പിടിച്ചെടുത്തു
  rationale: לקח എന്ന സാധാരണ ‘എടുക്കുക’ എന്ന ക്രിയയ്ക്ക് യുദ്ധസന്ദർഭത്തിൽ കൈവശപ്പെടുത്തുക/പിടിച്ചെടുക്കുക എന്ന സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: מֶתֶג הָאַמָּה
  choice: മെഥെഗ്-അമ്മാ
  rationale: വളരെ ദുഷ്കരമായ ഈ പദസമുച്ചയം സ്ഥലനാമസദൃശമായി ലിപ്യന്തരണം ചെയ്യുന്നത് അനിശ്ചിതമായ ‘മാതൃനഗരത്തിന്റെ കടിഞ്ഞാൺ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കുന്നതു ഒഴിവാക്കുന്നു; സാദ്ധ്യമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: അധികാരം/കൈവശം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപകാത്മകത മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു ആഖ്യാനത്തിന്റെ ക്രമവും സൈനിക പ്രവർത്തി-ഫല വ്യത്യാസവും നിലനിർത്തി. ദുഷ്കരമായ സ്ഥലനാമ/പ്രയോഗം മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്ത് അതിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
