id: 2SA.8.6
reference: 2 Samuel 8:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם דָּוִ֤ד נְצִבִים֙ בַּ/אֲרַ֣ם דַּמֶּ֔שֶׂק וַ/תְּהִ֤י אֲרָם֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נוֹשְׂאֵ֣י מִנְחָ֑ה וַ/יֹּ֤שַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
translation:
  language: ml
  text: ദാവീദ് ദമസ്കൊസിലെ അരാമിൽ സൈനികത്താവളങ്ങൾ സ്ഥാപിച്ചു[a]. അരാമ്യർ ദാവീദിന്റെ ദാസന്മാരായി, കപ്പം കൊണ്ടുവന്നു[b]. ദാവീദ് ചെന്നിടത്തെല്ലാം യഹ്‌വെ അവന് വിജയം നൽകി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൈനിക ഉദ്യോഗസ്ഥരെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘സമ്മാനം’ അല്ലെങ്കിൽ ‘ഉപഹാരം’ എന്നും അർഥമാകാം; ഇവിടെ കീഴടങ്ങിയ രാജ്യം നൽകുന്ന കപ്പമാണ് സാധ്യത.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘ദാവീദ് ചെന്നിടത്തെല്ലാം യഹ്‌വെ അവനെ രക്ഷിച്ചു’ അല്ലെങ്കിൽ ‘വിടുവിച്ചു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: സ്ഥാപിച്ചു
  rationale: שׂים എന്ന സാധാരണ ക്രിയയ്ക്ക് ഇവിടെ സൈനിക-ഭരണപരമായ സംവിധാനങ്ങളെ ഒരു പ്രദേശത്ത് നിയോഗിച്ചു നിർത്തുക എന്ന അർഥമാണ്; ‘സ്ഥാപിച്ചു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: נְצִבִים
  choice: സൈനികകാവൽപ്പടകൾ
  rationale: ഈ യുദ്ധവിജയസന്ദർഭത്തിൽ പദം നിയോഗിക്കപ്പെട്ട ഉദ്യോഗസ്ഥരെയോ സൈനികത്താവളങ്ങളെയോ സൂചിപ്പിക്കാം. ‘സൈനികകാവൽപ്പടകൾ’ സാധ്യതയേറിയ സൈനിക അർഥം വ്യക്തമാക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  choice: ദമസ്കൊസിലെ അരാമിൽ
  rationale: അരാം എന്ന എബ്രായ ഭൂമിശാസ്ത്രനാമം നിലനിർത്തുകയും ദമസ്കൊസ് കേന്ദ്രമായ അരാമ്യരാജ്യത്തെ സൂചിപ്പിക്കുന്ന ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: וַתְּהִי אֲרָם לְדָוִד לַעֲבָדִים
  choice: അരാമ്യർ ദാവീദിന്റെ ദാസന്മാരായി
  rationale: രാഷ്ട്രീയ കീഴടങ്ങലാണ് സന്ദർഭം. ‘ദാസന്മാർ’ עֲבָדִים എന്ന പദത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു; രാജ്യനാമമായ ‘അരാം’ സമൂഹത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘അരാമ്യർ’ എന്നു നൽകി.
- source_word: נוֹשְׂאֵי מִנְחָה
  choice: കപ്പം കൊണ്ടുവന്നു
  rationale: מִנְחָה സമ്മാനം, വഴിപാട്, കപ്പം എന്നീ അർഥങ്ങൾക്കു വരാം; കീഴടക്കപ്പെട്ട രാജ്യം നൽകുന്ന ബാധ്യതാപരമായ സമർപ്പണമെന്ന നിലയിൽ ഇവിടെ ‘കപ്പം’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: וַיֹּשַׁע
  choice: വിജയം നൽകി
  rationale: ישׁע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം രക്ഷിക്കുക/വിടുവിക്കുക എന്നാണ് അടിസ്ഥാനമായി സൂചിപ്പിക്കുന്നത്; സൈനികസന്ദർഭത്തിൽ ഫലത്തെ സ്വാഭാവികമായി ‘വിജയം നൽകി’ എന്നു രേഖപ്പെടുത്തി, കൂടുതൽ രൂപസമീപമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ സാധാരണ ശബ്ദലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: ചെന്നിടത്തെല്ലാം
  rationale: ദാവീദിന്റെ എല്ലാ സഞ്ചാരങ്ങളിലും സൈനികപ്രവർത്തനങ്ങളിലും ലഭിച്ച സമഗ്രവിജയം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിനാമമാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ഉച്ചാരണത്തിന്റെ അനിശ്ചിതത്വം അംഗീകരിച്ചുകൊണ്ട് ആധുനികമായി വ്യാപകമായ രൂപം ഉപയോഗിക്കുന്നു.
- issue: עֲבָדִים എന്ന പദത്തിന്റെ രാഷ്ട്രീയ അർഥം
  choice: ദാസന്മാർ
  alternative: അധീനർ; അടിമകൾ
  rationale: രാജ്യത്തിന്റെ രാഷ്ട്രീയ കീഴടങ്ങലും കപ്പം നൽകലുമാണ് സന്ദർഭം. ‘ദാസന്മാർ’ മൂലപദത്തോട് അടുത്തുനിൽക്കുന്നു; ‘അടിമകൾ’ വ്യക്തിഗത അടിമത്തത്തിന്റെ അർഥം അനാവശ്യമായി ശക്തമാക്കാം, ‘അധീനർ’ കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- issue: וַיֹּשַׁע എന്ന രക്ഷാഭാഷയുടെ സൈനികസന്ദർഭം
  choice: വിജയം നൽകി
  alternative: രക്ഷിച്ചു; വിടുവിച്ചു
  rationale: യഹ്‌വെയുടെ പ്രവർത്തനത്തെ സൈനിക വിജയമായി സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു; എന്നാൽ ക്രിയയുടെ വിശാലമായ രക്ഷ/വിടുതൽ അർഥം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘അരാം’ എന്ന മൂലഭാഷാനാമവും ‘യഹ്‌വെ’ എന്ന ദൈവനാമവും നിലനിർത്തി. സൈനികവും രാഷ്ട്രീയവുമായ സന്ദർഭം വ്യക്തമാക്കുമ്പോഴും നְצִבִים, מִנְחָה, ישׁע എന്നിവയിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
