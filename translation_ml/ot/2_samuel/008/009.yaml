source:
  edition: WLC
  text: וַ/יִּשְׁמַ֕ע תֹּ֖עִי מֶ֣לֶךְ חֲמָ֑ת כִּ֚י הִכָּ֣ה דָוִ֔ד אֵ֖ת כָּל חֵ֥יל הֲדַדְעָֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/009.yaml
  text: When Toi king of Hamath heard that David had struck down all the army of Hadadezer,[a]
translation:
  language: ml
  text: ഹമാത്തിലെ രാജാവായ തോയി[a], ദാവീദ് ഹദദേസെരിന്റെ സൈന്യത്തെ മുഴുവൻ തോല്പിച്ചുവെന്നു കേട്ടപ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 ദിനവൃത്താന്തം 18:9-ലെ സമാന്തരഭാഗത്തിൽ ഈ രാജാവിന്റെ പേര് ‘തോവു’ എന്നാണ്. ഇവിടെ എബ്രായപാഠം ‘തോയി’ എന്നാണ് വായിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടപ്പോൾ
  rationale: ശמע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു; തുടർന്നുള്ള വാക്യവുമായി ബന്ധിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനക്രമം മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: תֹּעִי
  choice: തോയി
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് എബ്രായ പാഠത്തിലുള്ള പേരിന്റെ രൂപം ലിപ്യന്തരണം ചെയ്യുന്നു; സമാന്തരഭാഗത്തിലെ വ്യത്യസ്ത രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מֶלֶךְ חֲמָת
  choice: ഹമാത്തിലെ രാജാവ്
  rationale: തോയിയുടെ രാജപദവിയും ഭരണദേശവും വ്യക്തമാക്കുന്ന എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: כִּי
  choice: എന്നു
  rationale: തോയി കേട്ട വാർത്തയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ, കാരണാർഥമായ ‘കാരണം’ എന്നതിനു പകരം ഉദ്ധരണിപൂരകമായ ‘എന്നു’ ഉപയോഗിക്കുന്നു.
- source_word: הִכָּה
  choice: തോല്പിച്ചു
  rationale: സൈനികസന്ദർഭത്തിൽ נכה ശത്രുസേനയെ ആക്രമിച്ചു പരാജയപ്പെടുത്തുക എന്ന അർഥം നൽകുന്നു. ‘അടിച്ചുവീഴ്ത്തി’ കൂടുതൽ അക്ഷരാർഥമായിരിക്കുമെങ്കിലും ഒരു മുഴുവൻ സൈന്യത്തെക്കുറിച്ചുള്ള ആധുനിക മലയാളത്തിൽ ‘തോല്പിച്ചു’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: אֵת כָּל חֵיל
  choice: സൈന്യത്തെ മുഴുവൻ
  rationale: חַיִל ഇവിടെ സൈനികശക്തിയെയോ സേനയെയോ സൂചിപ്പിക്കുന്നു; כָּל എന്ന സമഗ്രത ‘മുഴുവൻ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: הֲדַדְעָזֶר
  choice: ഹദദേസെർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
