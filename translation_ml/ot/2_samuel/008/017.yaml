  text: וְ/צָד֧וֹק בֶּן אֲחִיט֛וּב וַ/אֲחִימֶ֥לֶךְ בֶּן אֶבְיָתָ֖ר כֹּהֲנִ֑ים וּ/שְׂרָיָ֖ה סוֹפֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/017.yaml
  text: Zadok son of Ahitub and Ahimelech son of Abiathar were priests[b][a], and Seraiah was secretary.
translation:
  language: ml
  text: അഹീതൂബിന്റെ മകൻ സാദോക്കും അബ്യാഥാരിന്റെ മകൻ അഹീമേലെക്കും പുരോഹിതന്മാരായിരുന്നു[a]; സെരായാവ് കാര്യദർശിയായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മുഖ്യ മന്ത്രിമാർ’ അല്ലെങ്കിൽ ‘രാജകീയ ഉദ്യോഗസ്ഥർ.’ ദാവീദിന്റെ ഉദ്യോഗസ്ഥരുടെ പട്ടികയിലാണ് ഈ പദം വരുന്നത് എന്നതിനാൽ, ഇവിടെ വിശാലമായ കൊട്ടാര-ഭരണപരമായ അർഥമുണ്ടെന്ന് ചിലർ കരുതുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘എഴുത്തുകാരൻ.’ എഴുത്തും ഭരണകാര്യങ്ങളും കൈകാര്യം ചെയ്തിരുന്ന ഒരു ഉദ്യോഗസ്ഥനെയാണ് ഹീബ്രുപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: സാദോക്ക്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണം.
- source_word: בֶּן
  choice: മകൻ
  rationale: ഈ ഔദ്യോഗികപ്പട്ടികയിലെ വംശബന്ധസൂചന നേരിട്ടുള്ള പുത്രബന്ധത്തെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: אֲחִיטוּב
  choice: അഹീതൂബ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲחִימֶלֶךְ
  choice: അഹീമേലെക്ക്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֶבְיָתָר
  choice: അബ്യാഥാർ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: כֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണവും പ്രാഥമികവുമായ അർഥം ‘പുരോഹിതൻ’ എന്നതാണ്; രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥരുടെ പട്ടികയാണെന്ന സാഹചര്യം മാത്രം ഈ അർഥം മാറ്റാൻ മതിയായതല്ല.
- source_word: שְׂרָיָה
  choice: സെരായാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണം.
- source_word: סוֹפֵר
  choice: കാര്യദർശി
  rationale: രാജകൊട്ടാരസന്ദർഭത്തിൽ എഴുത്തും ഭരണകാര്യങ്ങളും കൈകാര്യം ചെയ്ത ഉദ്യോഗസ്ഥനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘കാര്യദർശി’ ആ ഔദ്യോഗിക ചുമതല ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: രാജകീയ ഉദ്യോഗസ്ഥരുടെ പട്ടികയിൽ כֹּהֲנִים എന്ന പദത്തിന്റെ അർഥം
  choice: പുരോഹിതന്മാർ
  alternative: മുഖ്യശുശ്രൂഷകർ; രാജകീയ ഉദ്യോഗസ്ഥർ
  rationale: ഈ പദത്തിന്റെ സാധാരണ അർഥം ‘പുരോഹിതന്മാർ’ എന്നാണ്. ചുറ്റുപാട് ഭരണോദ്യോഗസ്ഥരുടെ പട്ടികയായതിനാൽ വിശാലമായ കൊട്ടാര-ഭരണപരമായ അർഥം ചിലർ നിർദേശിക്കുന്നുണ്ടെങ്കിലും, മുഖ്യപാഠത്തിൽ പ്രാഥമിക അർഥം നിലനിർത്തുകയും യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഔദ്യോഗിക ശൈലി. പേരുകൾ ലിപ്യന്തരിച്ചു; ബന്ധസൂചന സ്വാഭാവികമായ മലയാള ഷഷ്ഠീവാക്യഘടനയിൽ നൽകി. മുഖ്യപാഠത്തിൽ സാധാരണ അർഥങ്ങൾ നിലനിർത്തി, സന്ദർഭജന്യമായ പദാർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
