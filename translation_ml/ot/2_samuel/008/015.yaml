id: 2SA.8.15
reference: 2 Samuel 8:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖ד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֣י דָוִ֗ד עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/015.yaml
  text: So David reigned over all Israel[a], and David was administering justice and righteousness to all his people.
translation:
  language: ml
  text: ദാവീദ് സകല ഇസ്രായേലിന്മേൽ രാജാവായി ഭരിച്ചു. ദാവീദ് തന്റെ എല്ലാ ജനങ്ങൾക്കും ന്യായവും നീതിയും നടപ്പാക്കിവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി ഭരിച്ചു
  rationale: מלך ഇവിടെ രാജസ്ഥാനാരോഹണം മാത്രം സൂചിപ്പിക്കുന്നതല്ല; ദാവീദിന്റെ രാജഭരണത്തെ സംഗ്രഹിക്കുന്നു. ‘രാജാവായി ഭരിച്ചു’ എന്നത് ഈ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവന്റെയുംമേൽ
  rationale: עַל ഭരണാധികാരത്തിന്റെ പരിധിയെയും כָּל അതിന്റെ സമഗ്രതയെയും സൂചിപ്പിക്കുന്നു.
- source_word: וַיְהִי ... עֹשֶׂה
  choice: നടപ്പാക്കിവന്നു
  rationale: וַיְהִי എന്നതിനോടുകൂടിയ കർത്തൃവാചക രൂപം പതിവായി തുടർന്നിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘നടപ്പാക്കിവന്നു’ ആ ദൈർഘ്യഭാവം പകർത്തുന്നു.
- source_word: מִשְׁפָּט
  choice: ന്യായം
  rationale: രാജഭരണസന്ദർഭത്തിൽ ഈ പദം ശരിയായ ന്യായവിധിയും നീതിനിർവഹണവും സൂചിപ്പിക്കുന്നു.
- source_word: וּצְדָקָה
  choice: നീതി
  rationale: צְדָקָה ധാർമികമായ നേരും ശരിയായ സാമൂഹികക്രമവും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നീതി’ സ്വാഭാവികമാണ്; מִשְׁפָּט എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്താൻ അതിനെ ‘ന്യായം’ എന്നു വേർതിരിച്ചു.
- source_word: לְכָל עַמּוֹ
  choice: തന്റെ സകലജനത്തിനും
  rationale: മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം ‘തന്റെ’ എന്നും לְ എന്നത് ഭരണത്തിന്റെ ഗുണഭോക്താക്കളെ സൂചിപ്പിക്കുന്ന ‘-നും’ എന്നും പകർത്തുന്നു.
theological_decisions:
- issue: മִשְׁפָּט וּצְדָקָה എന്ന രാജഭരണസംഗ്രഹത്തിലെ ഇരട്ടപ്രയോഗം
  choice: നീതിയും ന്യായവും
  alternative: ന്യായവും നീതിയും; ന്യായവിധിയും നീതിയും
  rationale: രണ്ട് എബ്രായ നാമങ്ങളെയും ഒരേ ആശയമായി ലയിപ്പിക്കാതെ, ധാർമികമായ നേരും നീതിനിർവഹണവും എന്ന ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ വശങ്ങൾ നിലനിർത്തുന്നു. മലയാളത്തിലെ കൂടുതൽ സ്വാഭാവികമായ കൂട്ടുപ്രയോഗമായതിനാൽ പദക്രമം ‘നീതിയും ന്യായവും’ എന്നു നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. തുടർന്നുനിന്ന രാജഭരണപ്രവർത്തനം ‘നടപ്പാക്കിവന്നു’ എന്ന രൂപത്തിലൂടെ പ്രകടമാക്കി; അനാവശ്യമായ സഭാപാരമ്പര്യ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി.
