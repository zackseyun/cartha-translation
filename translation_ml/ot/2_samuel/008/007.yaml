  text: וַ/יִּקַּ֣ח דָּוִ֗ד אֵ֚ת שִׁלְטֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֣ר הָי֔וּ אֶ֖ל עַבְדֵ֣י הֲדַדְעָ֑זֶר וַ/יְבִיאֵ֖/ם יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/007.yaml
  text: And David took the shields of gold that belonged to the servants of Hadadezer and brought them to Jerusalem[a].
translation:
  language: ml
  text: ഹദദേസെരിന്റെ സേവകരുടെ കൈവശമുണ്ടായിരുന്ന സ്വർണപരിചകൾ ദാവീദ് എടുത്ത് അവ യെരൂശലേമിലേക്കു കൊണ്ടുവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വർണത്തിന്റെ പരിചകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘പരിചകൾ’ എന്നതിനുള്ള എബ്രായപദത്തെ ‘അമ്പുതൊട്ടികൾ’ എന്നു മനസ്സിലാക്കുന്ന ന്യൂനപക്ഷാഭിപ്രായവുമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: പിടിച്ചെടുത്തു
  rationale: לקח എന്ന ക്രിയയ്ക്ക് സാധാരണയായി ‘എടുത്തു’ എന്നർഥമുണ്ടെങ്കിലും, യുദ്ധവിജയത്തിന്റെയും കൊള്ളമുതലിന്റെയും ഈ സന്ദർഭത്തിൽ ‘പിടിച്ചെടുത്തു’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: സ്വർണക്കവചങ്ങൾ
  rationale: שלטים എന്ന പദത്തിന്റെ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥം കവചങ്ങൾ എന്നാണ്. എബ്രായ ഘടനയിലെ ‘സ്വർണത്തിന്റെ കവചങ്ങൾ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘സ്വർണക്കവചങ്ങൾ’ എന്നു നൽകി.
- source_word: אֲשֶׁר הָיוּ אֶל
  choice: കൈവശമുണ്ടായിരുന്ന
  rationale: ഇവിടെ ഈ പ്രയോഗം വെറും സ്ഥലബന്ധത്തേക്കാൾ ഉടമസ്ഥതയെയോ കൈവശബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കൈവശമുണ്ടായിരുന്ന’ എന്നത് മൂലത്തിലെ ബന്ധം അനാവശ്യമായി കർശനമായ നിയമപരമായ ഉടമസ്ഥതയായി മാറ്റുന്നില്ല.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: ഹദദേസെരിന്റെ സേവകർ
  rationale: עבדים എന്നത് അടിമകൾ, സേവകർ, രാജഭൃത്യർ, ഉദ്യോഗസ്ഥർ എന്നിവരെ സൂചിപ്പിക്കാം. ഈ രാജകീയ-സൈനിക സന്ദർഭത്തിൽ പൊതുവും മാന്യവുമായ ‘സേവകർ’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: וַיְבִיאֵם
  choice: അവയെ ... കൊണ്ടുവന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘കൊണ്ടുവരിക’ എന്നാണ്; ബഹുവചന സർവനാമപ്രത്യയം കവചങ്ങളിലേക്കു വ്യക്തമായി ചൂണ്ടാൻ ‘അവയെ’ എന്നു നൽകി.
- source_word: יְרוּשָׁלִָם
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും മൂലനാമത്തോട് ചേർന്നതുമായ സ്ഥലനാമരൂപം.
