  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. ‘കൈവശമുണ്ടായിരുന്ന’ എന്ന പ്രയോഗം മൂലത്തിലെ ബന്ധസൂചന നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അപൂർവമായ പദാർഥവികല്പവും കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള ഘടനയും രേഖപ്പെടുത്തുന്നു.
