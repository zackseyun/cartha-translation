source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
translation:
  language: ml
  text: അവൻ ഏദോമിൽ കാവൽപ്പടകളെ നിയോഗിച്ചു; ഏദോമിലെങ്ങും അവൻ കാവൽപ്പടകളെ നിയോഗിച്ചു. ഏദോം മുഴുവൻ ദാവീദിന്റെ സേവകരായിത്തീർന്നു.[a] ദാവീദ് ചെന്നിടത്തെല്ലാം യഹ്‌വെ അവനു വിജയം നൽകി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഏദോം മുഴുവൻ ദാവീദിന്റെ അടിമകളായിത്തീർന്നു,” അല്ലെങ്കിൽ “ഏദോമ്യരെല്ലാം ദാവീദിന്റെ സേവകരായിത്തീർന്നു.” എബ്രായത്തിൽ രാഷ്ട്രനാമമായ “ഏദോം” അവിടത്തെ ജനങ്ങളെ സമഷ്ടിയായി സൂചിപ്പിക്കുന്നു; עֲבָדִים എന്ന പദത്തിന് ‘സേവകർ’ എന്നും ‘അടിമകൾ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദാവീദ് ചെന്നിടത്തെല്ലാം യഹ്‌വെ അവനെ രക്ഷിച്ചു” അല്ലെങ്കിൽ “വിടുവിച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയയ്ക്ക് ‘രക്ഷിക്കുക,’ ‘വിടുവിക്കുക,’ ‘വിജയം നൽകുക’ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  choice: നിയോഗിച്ചു
  rationale: שׂים എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണ്. സൈനിക കാവൽപ്പടകളെ ഒരു പ്രദേശത്ത് സ്ഥാപിക്കുന്ന സന്ദർഭത്തിൽ ‘നിയോഗിച്ചു’ സ്വാഭാവികവും അർഥസൂചകവുമാണ്.
- source_word: נְצִבִים
  choice: കാവൽപ്പടകൾ
  rationale: ഈ സൈനിക-അധിനിവേശ സന്ദർഭത്തിൽ നിശ്ചിത സ്ഥലങ്ങളിൽ സ്ഥാപിച്ച നിയന്ത്രണസേനകളെയോ കാവൽത്താവളങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘ഭരണാധികാരികൾ’ എന്ന അർഥവും സാദ്ധ്യമെങ്കിലും ഇവിടെ സൈനിക അർഥമാണ് കൂടുതൽ യോജിച്ചത്.
- source_word: בֶּאֱדוֹם / בְּכָל אֱדוֹם
  choice: ഏദോമിൽ / ഏദോമിലെങ്ങും
  rationale: בְ സ്ഥലസൂചന നൽകുന്നു; בְכָל എന്നതിന്റെ സമഗ്ര-വിതരണാർഥം ‘ഏദോമിലെങ്ങും’ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: וַיְהִי כָל אֱדוֹם עֲבָדִים לְדָוִד
  choice: ഏദോം മുഴുവൻ ദാവീദിനു കീഴ്പ്പെട്ട് സേവകരായിത്തീർന്നു
  rationale: ‘ഏദോം മുഴുവൻ’ എന്ന ദേശീയ സമഷ്ടിപ്രയോഗം നിലനിർത്തുന്നു. עֲבָדִים കീഴടക്കപ്പെട്ട രാഷ്ട്രീയ സേവനാവസ്ഥയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കീഴ്പ്പെട്ട് സേവകർ’ എന്ന് നൽകി; ‘അടിമകൾ’ എന്ന ശക്തമായ പദസാദ്ധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וַיּוֹשַׁע
  choice: വിജയം നൽകി
  rationale: ישׁע-യുടെ ഹിഫിൽ രൂപത്തിന് ‘രക്ഷിച്ചു/വിടുവിച്ചു/വിജയം നൽകി’ എന്ന അർഥപരിധിയുണ്ട്. യുദ്ധവിജയങ്ങളുടെ സംഗ്രഹസന്ദർഭത്തിൽ ‘വിജയം നൽകി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണമായ ‘യഹ്‌വെ’ എന്നു നൽകി.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: ചെന്നിടത്തെല്ലാം
  rationale: ‘അവൻ പോയ എല്ലായിടത്തും’ എന്ന സമഗ്രാർഥം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘പടനയിച്ചിടത്തെല്ലാം’ എന്നു സൈനികവിശദീകരണം കൂട്ടിച്ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്താനും അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതിരിക്കാനും ‘യഹ്‌വെ’ ഉപയോഗിച്ചു.
- issue: וַיּוֹשַׁע എന്നതിലെ ദൈവിക പ്രവർത്തനം
  choice: യഹ്‌വെ അവനു വിജയം നൽകി
  alternative: യഹ്‌വെ ദാവീദിനെ രക്ഷിച്ചു/വിടുവിച്ചു
  rationale: ദൈവിക കാരണകർത്തൃത്വം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് സൈനിക സന്ദർഭത്തിലെ ഫലാർഥം നൽകുന്നു; ‘രക്ഷിച്ചു/വിടുവിച്ചു’ എന്ന മൂലാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. എബ്രായത്തിലെ ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി. രാഷ്ട്രീയ കീഴടങ്ങലിന്റെ ഭാവം വ്യക്തമാക്കാൻ ‘കീഴ്പ്പെട്ട് സേവകരായി’ എന്നു നൽകി; കൂടുതൽ കടുത്ത ‘അടിമകൾ’ എന്ന സാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
