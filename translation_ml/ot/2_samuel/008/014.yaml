revisions:
- from: അവൻ ഏദോമിൽ കാവൽപ്പടകളെ നിയോഗിച്ചു; ഏദോമിലെങ്ങും അവൻ കാവൽപ്പടകളെ നിയോഗിച്ചു. ഏദോം മുഴുവൻ ദാവീദിനു കീഴ്പ്പെട്ട് സേവകരായിത്തീർന്നു.[a] ദാവീദ് ചെന്നിടത്തെല്ലാം യഹ്‌വെ അവനു വിജയം നൽകി.[b]
  to: അവൻ ഏദോമിൽ കാവൽപ്പടകളെ നിയോഗിച്ചു; ഏദോമിലെങ്ങും അവൻ കാവൽപ്പടകളെ നിയോഗിച്ചു. ഏദോം മുഴുവൻ ദാവീദിന്റെ സേവകരായിത്തീർന്നു.[a] ദാവീദ് ചെന്നിടത്തെല്ലാം യഹ്‌വെ അവനു വിജയം നൽകി.[b]
  rationale: മുഖ്യപാഠത്തിൽ മൂലവാക്യത്തിൽ പ്രത്യക്ഷമല്ലാത്ത ‘കീഴ്പ്പെട്ട്’ ഒഴിവാക്കി עֲבָדִים-ന്റെ നേരിട്ടുള്ള സമാനതയായ ‘സേവകരായിത്തീർന്നു’ നിലനിർത്തി. ഇതിലൂടെ രാഷ്ട്രീയസന്ദർഭം മായുന്നില്ല; കൂടുതൽ ശക്തമായ ‘അടിമകൾ’ എന്ന സാദ്ധ്യതയും ദേശീയനാമത്തിന്റെ സമഷ്ടിപ്രയോഗവും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. മറ്റെല്ലാ പദചയനങ്ങളും സുരക്ഷിതമാണ്.
