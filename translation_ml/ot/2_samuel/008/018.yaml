source:
  edition: WLC
  text: וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וְ/הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וּ/בְנֵ֥י דָוִ֖ד כֹּהֲנִ֥ים הָיֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
translation:
  language: ml
  text: യെഹോയാദായുടെ മകനായ ബെനായാവു കെരേത്യരുടെയും പെലേത്യരുടെയും മേൽനോട്ടം വഹിച്ചിരുന്നു; ദാവീദിന്റെ പുത്രന്മാർ പുരോഹിതന്മാരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മുഖ്യ മന്ത്രിമാർ’ അല്ലെങ്കിൽ ‘രാജകീയ ഉദ്യോഗസ്ഥർ.’ എബ്രായപദം സാധാരണയായി ‘പുരോഹിതന്മാർ’ എന്നാണ് അർഥമാക്കുന്നത്. എന്നാൽ ഇവിടെ രാജഭരണത്തെക്കുറിച്ചുള്ള സന്ദർഭമായതിനാൽ ചിലർ അതിനെ വിശാലമായ രാജസഭാപദവിയായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן־יְהוֹיָדָע
  choice: യഹോയാദയുടെ മകനായ ബെനായാവ്
  rationale: വ്യക്തിനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്നുനിൽക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: וְהַכְּרֵתִי
  choice: കെരേത്യർ
  rationale: ഇത് ഒരു ജനവിഭാഗത്തെയോ സൈനികസംഘത്തെയോ സൂചിപ്പിക്കുന്ന പേരായതിനാൽ അർഥം അനുമാനിക്കാതെ എബ്രായരൂപം ലിപ്യന്തരിച്ചു.
- source_word: וְהַפְּלֵתִי
  choice: പെലേത്യർ
  rationale: കെരേത്യരോടൊപ്പം പരാമർശിക്കുന്ന സംഘനാമം നേരിട്ട് ലിപ്യന്തരിച്ചു; അവരുടെ കൃത്യമായ വംശീയമോ സൈനികമോ ആയ സ്വഭാവം വിവർത്തനത്തിൽ നിർണയിച്ചിട്ടില്ല.
- source_word: כֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: എബ്രായപദത്തിന്റെ സാധാരണവും നേരിട്ടുള്ളതുമായ അർഥം നിലനിർത്തി. രാജസഭയിലെ ഉന്നത ഉദ്യോഗസ്ഥർ എന്ന സന്ദർഭാധിഷ്ഠിത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: הָיוּ
  choice: ആയിരുന്നു
  rationale: היה എന്ന ക്രിയയുടെ സാധാരണ ഭൂതകാല സംയോജകപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു; ‘സേവിച്ചു’ എന്ന വ്യാഖ്യാനാത്മക അർഥം ചേർത്തില്ല.
- source_word: וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: കെരേത്യരുടെയും പെലേത്യരുടെയും മേൽനോട്ടക്കാരനായിരുന്നു
  rationale: മസോററ്റിക് പാഠത്തിൽ അധികാരബന്ധം സൂചിപ്പിക്കുന്ന പ്രത്യേക പദം പ്രകടമല്ലെങ്കിലും, രാജകാര്യസ്ഥാനങ്ങളുടെ പട്ടികയായ സന്ദർഭവും സമാന്തരവിവരണവും പരിഗണിച്ച് മലയാളത്തിൽ ആവശ്യമായ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കി.
theological_decisions:
- issue: ദാവീദിന്റെ പുത്രന്മാരെ כֹּהֲנִים എന്നു വിളിക്കുന്നത്
  choice: മുഖ്യപാഠത്തിൽ ‘പുരോഹിതന്മാർ’ എന്നു നിലനിർത്തി
  alternative: ‘മുഖ്യ ശുശ്രൂഷകർ’ അല്ലെങ്കിൽ ‘രാജകീയ ഉദ്യോഗസ്ഥർ’
  rationale: ദാവീദിന്റെ പുത്രന്മാർ ആരാധനാക്രമത്തിലെ പുരോഹിതന്മാരായിരുന്നോ എന്ന ചരിത്ര-ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനത്തിലൂടെ തീർപ്പാക്കാതെ എബ്രായപദത്തിന്റെ സാധാരണ അർഥം സംരക്ഷിച്ചു; വിശാലമായ രാജസഭാ അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. സംഘനാമങ്ങൾ ലിപ്യന്തരിച്ചു; മുഖ്യപാഠത്തിലെ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
