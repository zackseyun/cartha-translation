  naturalness: ‘കെരേത്യരുടെയും പെലേത്യരുടെയും മേൽനോട്ടക്കാരനായിരുന്നു’ മനസ്സിലാക്കാവുന്നതാണ്; എങ്കിലും ‘കെരേത്യരുടെയും പെലേത്യരുടെയും മേൽനോട്ടം വഹിച്ചിരുന്നു’ ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്. ‘മുഖ്യ ശുശ്രൂഷകർ’ എന്ന അടിക്കുറിപ്പ്-വാക്ക് രാജഭരണസന്ദർഭത്തിൽ അനാവശ്യമായി മതപരമായ അർഥം ഉണർത്താം.
