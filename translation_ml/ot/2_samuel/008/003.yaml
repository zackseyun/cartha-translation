  yaml_path: translation/ot/2_samuel/008/003.yaml
  text: David struck down Hadadezer son of Rehob[a], king of Zobah[c][b], when he went to restore his power at the River.
translation:
  language: ml
  text: ദാവീദ് രെഹോബിന്റെ മകനും സോബാരാജാവുമായ ഹദദേസെരിനെ[a], ഹദദേസെർ നദിക്കരയിൽ[c] തന്റെ അധികാരം പുനഃസ്ഥാപിക്കാൻ[b] പോയപ്പോൾ, പരാജയപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായ പാഠത്തിൽ ‘ഹദദേസെർ’; ചില പാഠപാരമ്പര്യങ്ങളിലും 1 ദിനവൃത്താന്തത്തിലെ സമാന്തരവിവരണത്തിലും ‘ഹദരേസെർ’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: '‘തന്റെ നിയന്ത്രണം വീണ്ടെടുക്കാൻ’ എന്നോ ‘തന്റെ ആധിപത്യം വീണ്ടും സ്ഥാപിക്കാൻ’ എന്നോ പരിഭാഷപ്പെടുത്താം; അക്ഷരാർഥം: ‘തന്റെ കൈ പുനഃസ്ഥാപിക്കാൻ.’'
    reason: lexical_alternative
  - marker: c
    text: ഇത് സാധ്യതയോടെ യൂഫ്രട്ടീസ് നദിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּךְ
  choice: പരാജയപ്പെടുത്തി
  rationale: נכה എന്ന ക്രിയ യുദ്ധസന്ദർഭത്തിൽ പ്രഹരിക്കുകയും അതിലൂടെ തോൽപ്പിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം. വാക്യം അയാളെ കൊന്നുവെന്ന് വ്യക്തമാക്കാത്തതിനാൽ ‘കൊന്നുവീഴ്ത്തി’ എന്നതിനെക്കാൾ ‘പരാജയപ്പെടുത്തി’ കൃത്യമാണ്.
- source_word: הֲדַדְעֶזֶר
  choice: ഹദദേസെർ
  rationale: WLC-യിലെ വ്യഞ്ജനരൂപം പിന്തുടർന്ന് വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു; മറ്റൊരു പാഠരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בֶּן רְחֹב
  choice: രെഹോബിന്റെ മകൻ
  rationale: ഹീബ്രായ പിതൃനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു.
- source_word: מֶלֶךְ צוֹבָה
  choice: സോബാ രാജാവ്
  rationale: നിർമാണബന്ധം നേരിട്ട്, സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് അവതരിപ്പിച്ചു.
- source_word: בְּלֶכְתּוֹ
  choice: അയാൾ ... പോയപ്പോൾ
  rationale: ב ചേർന്ന ക്രിയാനാമഘടനയുടെ കാലസാഹചര്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി; സർവനാമം സന്ദർഭത്തിൽ ഹദദേസെരിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לְהָשִׁיב
  choice: പുനഃസ്ഥാപിക്കാൻ
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘തിരികെ കൊണ്ടുവരുക/പുനഃസ്ഥാപിക്കുക’ എന്നാണ്; ഉദ്ദേശ്യാർഥം നിലനിർത്തി.
- source_word: יָדוֹ
  choice: തന്റെ അധികാരം
  rationale: ‘കൈ’ ഇവിടെ രാഷ്ട്രീയ-സൈനിക ശക്തിയെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘അധികാരം’ വായനാസൗകര്യം നൽകുമ്പോഴും കൂടുതൽ നിർദിഷ്ടമായ ‘ആധിപത്യം’ എന്ന വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: בִּנְהַר
  choice: നദിക്കരയിൽ
  rationale: נהר നിർദിഷ്ടമായ ‘നദി’യെ സൂചിപ്പിക്കുന്നു; സ്ഥലസംബന്ധിയായ ב മലയാളത്തിൽ ‘നദിക്കരയിൽ’ എന്നു സ്വാഭാവികമായി നൽകി. ഇത് സാധ്യതയോടെ യൂഫ്രട്ടീസ് ആണെന്ന തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. ‘കൈ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം മുഖ്യപാഠത്തിൽ അസ്പഷ്ടമാകുന്നതിനാൽ ‘അധികാരം’ എന്നു നൽകി, എന്നാൽ അതിന്റെ യഥാർഥ രൂപവും മറ്റു സാധ്യതകളും അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ സംബന്ധിക്കുന്ന പദപ്രയോഗത്തിനരികിൽ ചേർത്തിട്ടുണ്ട്.
