id: 2SA.8.16
reference: 2 Samuel 8:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יוֹאָ֥ב בֶּן צְרוּיָ֖ה עַל הַ/צָּבָ֑א וִ/יהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד מַזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/016.yaml
  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: ml
  text: സെരൂയായുടെ മകൻ യോവാബ് സൈന്യത്തിന്റെ ചുമതല വഹിച്ചിരുന്നു[a]; അഹീലൂദിന്റെ മകൻ യെഹോശാഫാത്ത് രാജകീയ രേഖാധികാരിയായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൈന്യാധിപനായിരുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: ‘രാജകീയ രേഖാധികാരി’ എന്നു പറയുന്നത് രേഖകൾ സൂക്ഷിക്കുകയും കാര്യങ്ങൾ രാജാവിന്റെ ശ്രദ്ധയിൽപ്പെടുത്തുകയും ചെയ്തിരുന്ന ഒരു കൊട്ടാര ഉദ്യോഗസ്ഥനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘രാജകീയ കാര്യദർശി’ അല്ലെങ്കിൽ ‘വൃത്താന്തരേഖകൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: സൈന്യത്തിന്റെ ചുമതല വഹിച്ചിരുന്നു
  rationale: ഔദ്യോഗിക പട്ടികയിൽ עַל അധികാരവും മേൽനോട്ടവും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി സൈന്യത്തിന്മേലുള്ള ഭരണചുമതല വ്യക്തമാക്കുന്ന പ്രയോഗമാണിത്; ‘സൈന്യാധിപനായിരുന്നു’ എന്ന പദവിനാമവും സാധ്യമാണ്.
- source_word: מַזְכִּיר
  choice: രാജകീയ രേഖാധികാരി
  rationale: രാജാവിനുവേണ്ടി കാര്യങ്ങൾ രേഖപ്പെടുത്തുകയും അവ രാജാവിന്റെ ശ്രദ്ധയിൽപ്പെടുത്തുകയും ചെയ്തിരുന്ന കൊട്ടാര ഉദ്യോഗസ്ഥനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘രേഖാധികാരി’ ആ ഔദ്യോഗിക സ്വഭാവം നിലനിർത്തുന്നു; ‘രാജകീയ’ എന്നത് സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായ കൊട്ടാരബന്ധം വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശപരമായ തിരിച്ചറിയലിൽ בֶּן എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷയാണ് ‘മകൻ’.
- source_word: וְ / וִ
  choice: ;
  rationale: ഹീബ്രുവിലെ ലളിതമായ സംയോജകബന്ധം മലയാളത്തിലെ ഉദ്യോഗസ്ഥപ്പട്ടികയുടെ ഒഴുക്ക് കാത്തുകൊണ്ട് അർധവിരാമത്തിലൂടെ അവതരിപ്പിച്ചു; രണ്ടു സമാന്തര ഔദ്യോഗിക പ്രസ്താവനകളുടെ ബന്ധം ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  choice: യോവാബ് / സെരൂയാ / യെഹോശാഫാത്ത് / അഹീലൂദ്
  rationale: എബ്രായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ രൂപങ്ങളിൽ വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ഔദ്യോഗിക പട്ടികാശൈലി സ്വീകരിച്ചു. പദവികളുടെ ചരിത്രപരമായ സ്വഭാവം വ്യക്തമാക്കാൻ ‘രാജകീയ രേഖാധികാരി’ ഉപയോഗിച്ചു; മൂലത്തിലെ പദവിസംബന്ധമായ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
