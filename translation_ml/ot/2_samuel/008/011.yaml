id: 2SA.8.11
reference: 2 Samuel 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: גַּם אֹתָ֕/ם הִקְדִּ֛ישׁ הַ/מֶּ֥לֶךְ דָּוִ֖ד לַֽ/יהוָ֑ה עִם הַ/כֶּ֤סֶף וְ/הַ/זָּהָב֙ אֲשֶׁ֣ר הִקְדִּ֔ישׁ מִ/כָּל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר כִּבֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
translation:
  language: ml
  text: ദാവീദ് രാജാവ് അവയെയും[b] താൻ കീഴടക്കിയ[a] സകല ജനതകളിൽനിന്നും സമർപ്പിച്ചിരുന്ന വെള്ളിയോടും സ്വർണത്തോടുംകൂടെ യഹ്‌വെക്കു സമർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അധീനത്തിലാക്കി.’ എബ്രായക്രിയയ്ക്ക് ബലപ്രയോഗത്തിലൂടെ ജനവിഭാഗങ്ങളെ നിയന്ത്രണത്തിലാക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവ’ എന്നത് മുൻവാക്യത്തിൽ പറഞ്ഞ വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: -യും / കൂടെ
  rationale: മുൻവാക്യത്തിലെ വിവരത്തോടുള്ള കൂട്ടിച്ചേർക്കൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘അവയെയും’ എന്നും ‘കൂടെ’ എന്നും പ്രകടമാക്കുന്നു.
- source_word: אֹתָם
  choice: അവയെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ വസ്തുക്കളെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; മുഖ്യപാഠത്തിൽ അവ എന്താണെന്ന് അനാവശ്യമായി വ്യക്തമാക്കാതെ എബ്രായത്തിലെ പൊതുവായ പരാമർശം നിലനിർത്തുന്നു.
- source_word: הִקְדִּישׁ
  choice: സമർപ്പിച്ചു
  rationale: വിലപിടിപ്പുള്ള വസ്തുക്കൾ ദൈവത്തിനായി വിശുദ്ധമായി നീക്കിവെക്കുന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവ്
  rationale: രാജകീയ പദവിയും പേരും ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെക്കു
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עִם
  choice: വെള്ളിയോടും സ്വർണത്തോടുംകൂടെ
  rationale: മുൻപ് സമർപ്പിച്ച വിലപിടിപ്പുള്ള ലോഹങ്ങളോടുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: വെള്ളിയും സ്വർണവും
  rationale: പ്രത്യേകമായി പരാമർശിക്കപ്പെട്ട വിലപിടിപ്പുള്ള ലോഹങ്ങൾ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: സമർപ്പിച്ചിരുന്ന
  rationale: ഈ വെള്ളിയും സ്വർണവും മുൻകാല വിജയങ്ങളിൽനിന്ന് ഇതിനകം സമർപ്പിച്ചവയാണെന്ന സന്ദർഭപരമായ മുൻകാലബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: מִכָּל הַגּוֹיִם
  choice: സകല ജനതകളിൽനിന്നും
  rationale: מִן സൂചിപ്പിക്കുന്ന ഉറവിടവും גּוֹיִם എന്നതിന്റെ രാഷ്ട്രീയ-ജനവിഭാഗപരമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר כִּבֵּשׁ
  choice: താൻ കീഴടക്കിയ
  rationale: ബലപ്രയോഗത്തിലൂടെ നിയന്ത്രണത്തിലാക്കുക എന്ന ക്രിയയുടെ സൈനിക-രാഷ്ട്രീയ അർഥം നൽകുന്നു; ‘ജയിച്ച’ എന്നതിനെക്കാൾ നിയന്ത്രണവിധേയമാക്കിയെന്ന ഘടകം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠം ദൈവത്തിന്റെ ചതുരക്ഷര ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: הִקְדִּישׁ എന്ന ആരാധനാസംബന്ധമായ ക്രിയയുടെ അർഥം
  choice: സമർപ്പിച്ചു
  alternative: വിശുദ്ധീകരിച്ചു; വിശുദ്ധമായി വേർതിരിച്ചുവെച്ചു
  rationale: വസ്തുക്കളെ ദൈവത്തിനായി നീക്കിവെച്ചുവെന്ന ആശയം നൽകുമ്പോഴും അവയുടെ സ്വഭാവത്തിൽ മാറ്റം സംഭവിച്ചുവെന്ന് അനാവശ്യമായി സൂചിപ്പിക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആദ്യവാക്യത്തിൽ എബ്രായത്തിലെ സർവനാമപരാമർശം നിലനിർത്തി; ആവർത്തനമുള്ള രണ്ടാമത്തെ വാക്യം മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ഉപയോഗിച്ചു. ദൈവനാമം പേരായി ലിപ്യന്തരണം ചെയ്തു.
