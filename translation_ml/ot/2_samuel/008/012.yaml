  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പട്ടികയുടെ ആവർത്തനഘടന നിലനിർത്തി. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ മൂലപാഠത്തിനനുസരിച്ച് ഖണ്ഡവാക്യരൂപം സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
