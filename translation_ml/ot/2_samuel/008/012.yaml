  text: from Aram[a], and from Moab, and from the Ammonites, and from the Philistines, and from Amalek, and from the spoil of Hadadezer son of Rehob[c][b], king of Zobah.
translation:
  language: ml
  text: അരാമിൽനിന്നും[a] മോവാബിൽനിന്നും അമ്മോന്യരിൽനിന്നും[b] ഫെലിസ്ത്യരിൽനിന്നും അമാലേക്കിൽനിന്നും സോബാ രാജാവായ രെഹോബിന്റെ മകൻ ഹദദേസെരിന്റെ[c] കൊള്ളയിൽനിന്നും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘അരാം’; പരമ്പരാഗതമായി ‘സിറിയ’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അമ്മോന്റെ മക്കൾ.’'
    reason: lexical_alternative
  - marker: c
    text: ചില ഭാഗങ്ങളിൽ ഈ പേര് ‘ഹദരേസെർ’ എന്നു എഴുതിയിരിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: מֵאֲרָם
  choice: അരാമിൽനിന്നും
  rationale: അരാമ്യ പ്രദേശത്തെയും ജനത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ പേരായ אֲרָם അതേ രൂപത്തിൽ നിലനിർത്തുന്നു; പിൽക്കാല ഭൂമിശാസ്ത്രനാമമായ ‘സിറിയ’ എന്നു പകരുന്നില്ല.
- source_word: וּמִמּוֹאָב
  choice: മോവാബിൽനിന്നും
  rationale: രാജ്യത്തിന്റെയും പ്രദേശത്തിന്റെയും പേരായ മോവാബിനെ സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: וּמִבְּנֵי עַמּוֹן
  choice: അമ്മോന്യരിൽനിന്നും
  rationale: അക്ഷരാർഥത്തിൽ ‘അമ്മോന്റെ മക്കളിൽനിന്ന്’; ഇവിടെ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘അമ്മോന്യർ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: וּמִפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരിൽനിന്നും
  rationale: ജനനാമത്തിന് മലയാളത്തിൽ പരിചിതവും വ്യക്തവുമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: וּמֵעֲמָלֵק
  choice: അമാലേക്കിൽനിന്നും
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായ ജനനാമരൂപമല്ല, עֲמָלֵק എന്ന പേരുതന്നെയാണ്; അതിനാൽ ‘അമാലേക്കിൽനിന്നും’ എന്നു അടുത്തുനിൽക്കുന്ന വിധത്തിൽ നൽകി.
- source_word: וּמִשְּׁלַל
  choice: പിടിച്ചെടുത്ത കൊള്ളയിൽനിന്നും
  rationale: שָׁלָל യുദ്ധത്തിൽ പിടിച്ചെടുത്ത വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം വ്യക്തമായി വരാൻ ‘പിടിച്ചെടുത്ത കൊള്ള’ എന്നു നൽകി.
- source_word: הֲדַדְעֶזֶר
  choice: ഹദദേസെർ
  rationale: ഈ വാക്യത്തിലെ വ്യഞ്ജനരൂപമായ הדדעזר അനുസരിച്ചുള്ള ലിപ്യന്തരണം; മറ്റിടങ്ങളിലെ ‘ഹദരേസെർ’ രൂപഭേദം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בֶּן רְחֹב
  choice: രെഹോബിന്റെ മകൻ
  rationale: പിതൃപുത്രബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ ഘടന മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: מֶלֶךְ צוֹבָה
  choice: സോബാ രാജാവ്
  rationale: രാജപദവിയും സ്ഥലനാമവും മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നൽകുന്നു.
