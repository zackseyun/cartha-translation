  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣ךְ אֶת מוֹאָ֗ב וַֽ/יְמַדְּדֵ֤/ם בַּ/חֶ֨בֶל֙ הַשְׁכֵּ֣ב אוֹתָ֣/ם אַ֔רְצָ/ה וַ/יְמַדֵּ֤ד שְׁנֵֽי חֲבָלִים֙ לְ/הָמִ֔ית וּ/מְלֹ֥א הַ/חֶ֖בֶל לְ/הַחֲי֑וֹת וַ/תְּהִ֤י מוֹאָב֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נֹשְׂאֵ֥י מִנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
translation:
  language: ml
  text: ദാവീദ് മോവാബിനെ അടിച്ചു. മോവാബ്യരെ നിലത്തു കിടത്തിയിട്ട് അളവുകയർകൊണ്ട്[a] അളന്നു. കൊല്ലുന്നതിനായി രണ്ട് കയർനീളങ്ങളും ജീവനോടെ വിടുന്നതിനായി ഒരു മുഴുവൻ കയർനീളവും അവൻ അളന്നു.[b] അങ്ങനെ മോവാബ്യർ ദാവീദിന്റെ ദാസന്മാരായി, കപ്പം കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അളക്കാനുള്ള ചരടുകൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'നിലത്തു കിടന്നിരുന്ന മോവാബ്യരെ ദാവീദ് അളന്നതായി എബ്രായപാഠം വിവരിക്കുന്നു: അളന്ന രണ്ട് ഭാഗങ്ങൾ ‘കൊല്ലുന്നതിനായി’ എന്നും ഒരു മുഴുവൻ ഭാഗം ‘ജീവനോടെ വിടുന്നതിനായി’ എന്നും നിയോഗിച്ചു. അതായത്, ചിലരെ വധിക്കുകയും മറ്റുള്ളവരെ ജീവനോടെ വിടുകയും ചെയ്തു.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ אֶת־מוֹאָב
  choice: ദാവീദ് മോവാബിനെ പരാജയപ്പെടുത്തി
  rationale: נכה എന്ന ക്രിയയ്ക്ക് ‘അടിക്കുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും സൈനികസന്ദർഭത്തിൽ ‘പരാജയപ്പെടുത്തുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്. മുൻവാക്യങ്ങളിൽനിന്ന് വ്യക്തമാകുന്ന കർത്താവായ ദാവീദിനെ മലയാളത്തിൽ തുറന്നുപറഞ്ഞു.
- source_word: וַיְמַדְּדֵם בַּחֶבֶל
  choice: മോവാബ്യരെ ... അളവുകയർകൊണ്ട് അളന്നു
  rationale: മോവാബ് എന്ന സമൂഹനാമത്തെ തുടർന്നുള്ള ബഹുവചനസർവനാമം ജനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. חֶבֶל ഇവിടെ അളക്കാനുള്ള കയർ/ചരടാണ്; ‘അളവുകയർ’ അതിന്റെ ഉപകരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: הַשְׁכֵּב אֹתָם אַרְצָה
  choice: മോവാബ്യരെ നിലത്തു കിടത്തിയിട്ട്
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥം നിലനിർത്തുകയും അളക്കൽ നടന്ന രീതി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְמַדֵּד שְׁנֵי חֲבָלִים לְהָמִית
  choice: കൊല്ലാൻ രണ്ടു കയർനീളം ... അളന്നു
  rationale: ‘രണ്ടു കയറുകൾ’ എന്നതിലുപരി അളന്ന രണ്ടു ഭാഗങ്ങൾ എന്ന ആശയം ‘രണ്ടു കയർനീളം’ അറിയിക്കുന്നു. לְהָמִית എന്ന കാരണാർഥക ക്രിയാരൂപം ‘കൊല്ലാൻ’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: וּמְלֹא הַחֶבֶל לְהַחֲיוֹת
  choice: ജീവനോടെ വിടാൻ ഒരു മുഴുവൻ കയർനീളം
  rationale: מְלֹא הַחֶבֶל എന്നത് ഒരു പൂർണ അളവിനെ സൂചിപ്പിക്കുന്നു; വ്യക്തമായ സംഖ്യ മൂലപാഠത്തിലില്ലെങ്കിലും മലയാളത്തിൽ ഏകവചനത്തിന് ആവശ്യമായ ‘ഒരു’ ചേർത്തു. לְהַחֲיוֹת ഇവിടെ കൊല്ലാതെ ജീവനോടെ വിടുക എന്നാണ്.
- source_word: וַתְּהִי מוֹאָב לְדָוִד לַעֲבָדִים
  choice: മോവാബ്യർ ദാവീദിന്റെ ദാസന്മാരായി
  rationale: עֲבָדִים എന്നത് രാഷ്ട്രീയ കീഴടക്കത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘ദാസന്മാർ’ എന്ന് നേരിട്ട് നിലനിർത്തി; ‘അടിമകൾ’ എന്ന് സാമൂഹികസ്ഥിതി അതിരുകടന്ന് നിർവചിച്ചില്ല.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: കപ്പം കൊണ്ടുവന്നു
  rationale: രാജകീയ-രാഷ്ട്രീയ സന്ദർഭത്തിൽ מִנְחָה ആരാധനാവഴിപാടല്ല, അധീനജനത നൽകുന്ന കപ്പമാണ്.
theological_decisions:
- issue: മോവാബ്യരെ അളന്നതിന്റെ സ്വഭാവവും മരണത്തിനും ജീവനുമുള്ള വിഹിതവും
  choice: നിലത്തു കിടത്തി കയർകൊണ്ട് അളിച്ചതും രണ്ടു അളവുകൾ കൊല്ലാനും ഒരു പൂർണ അളവ് ജീവനോടെ വിടാനും നിശ്ചയിച്ചതും പ്രധാനപാഠത്തിൽ അതിന്റെ കഠിനത കുറയ്ക്കാതെ നിലനിർത്തി.
  alternative: ഇത് കീഴടക്കത്തിന്റെ ആലങ്കാരിക വിവരണമായി മാത്രം പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ കൃത്യമായി മൂന്നിൽ രണ്ടുപേരെ കൊന്നുവെന്നും മൂന്നിൽ ഒരാളെ ജീവനോടെ വിട്ടുവെന്നും പ്രധാനപാഠത്തിൽ പറയുക.
  rationale: എബ്രായപാഠം യഥാർഥമായ അളക്കൽപ്രക്രിയയും മരണ/ജീവൻ വിഭജനവും വിവരിക്കുന്നു. അനുപാതം മൂന്നിൽ രണ്ട്, മൂന്നിൽ ഒന്ന് എന്ന് മനസ്സിലാക്കാമെങ്കിലും മൂലപാഠം അത് ഭിന്നസംഖ്യയായി തുറന്നുപറയുന്നില്ല; അതിനാൽ ആ നിഗമനം പ്രധാനപാഠത്തിലേക്ക് ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി ഉപയോഗിച്ചു. യുദ്ധവിവരണത്തിന്റെ കഠിനത മയപ്പെടുത്താതെയും അതിൽ ഇല്ലാത്ത വിശദീകരണം പ്രധാനപാഠത്തിൽ ചേർക്കാതെയും വാക്യങ്ങൾ ഹ്രസ്വമായി ക്രമപ്പെടുത്തി.
