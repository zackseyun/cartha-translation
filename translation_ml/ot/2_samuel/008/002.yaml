  terminology: “അളവുകയർ,” “ദാസന്മാർ,” and “കപ്പം” appropriately convey the measuring line, vassal-servants, and political tribute. The footnotes retain the lexical alternative and explain the difficult procedure without asserting an explicit numerical fraction.
