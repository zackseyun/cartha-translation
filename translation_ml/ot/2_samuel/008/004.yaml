  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സൈനിക പദാവലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ പരോക്ഷസൂചന വ്യക്തതയ്ക്കായി തുറന്നുപറഞ്ഞെങ്കിലും അക്ഷരാർഥഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; സാമുവേലും ദിനവൃത്താന്തവും തമ്മിലുള്ള സംഖ്യാഭേദം പരിഹരിക്കാതെ രേഖപ്പെടുത്തി.
