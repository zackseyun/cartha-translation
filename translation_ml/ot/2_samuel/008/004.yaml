  text: וַ/יִּלְכֹּ֨ד דָּוִ֜ד מִמֶּ֗/נּוּ אֶ֤לֶף וּ/שְׁבַע מֵאוֹת֙ פָּרָשִׁ֔ים וְ/עֶשְׂרִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וַ/יְעַקֵּ֤ר דָּוִד֙ אֶת כָּל הָ/רֶ֔כֶב וַ/יּוֹתֵ֥ר מִמֶּ֖/נּוּ מֵ֥אָה רָֽכֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
translation:
  language: ml
  text: ദാവീദ് അവനിൽനിന്ന് 1,700 കുതിരപ്പടയാളികളെയും 20,000 കാലാൾപ്പടയാളികളെയും പിടിച്ചെടുത്തു.[a] പിന്നെ ദാവീദ് രഥപ്പടയിലെ കുതിരകളുടെയെല്ലാം കാൽഞരമ്പ് മുറിച്ചു; എന്നാൽ നൂറ് രഥങ്ങൾക്കു വേണ്ടത്ര കുതിരകളെ ശേഷിപ്പിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പാഠത്തിൽ ‘1,700 കുതിരപ്പടയാളികൾ’ എന്നാണ്. 1 ദിനവൃത്താന്തം 18:4-ലെ സമാന്തരവിവരണത്തിൽ ‘7,000 കുതിരപ്പടയാളികൾ’ എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: എബ്രായത്തിൽ ‘രഥപ്പട മുഴുവനെയും കാൽഞരമ്പ് മുറിച്ചു; എന്നാൽ അതിൽനിന്ന് നൂറ് രഥം ശേഷിപ്പിച്ചു’ എന്നു പറയുന്നു. കാൽഞരമ്പ് മുറിക്കപ്പെടുന്നത് കുതിരകളുടേതായതിനാൽ, നൂറ് രഥങ്ങൾക്കു വേണ്ടത്ര കുതിരകളാണ് ശേഷിപ്പിച്ചതെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: പിടിച്ചെടുത്തു
  rationale: לכד എന്ന ക്രിയ യുദ്ധസന്ദർഭത്തിൽ പിടിച്ചെടുക്കുക, കൈവശപ്പെടുത്തുക എന്നർഥം നൽകുന്നു; സൈനികരെ സംബന്ധിച്ച് ‘പിടിച്ചെടുത്തു’ സ്വാഭാവികമാണ്.
- source_word: מִמֶּנּוּ
  choice: അവനിൽനിന്ന്
  rationale: എബ്രായ പ്രത്യയം ഏകവചനമാണ്; സന്ദർഭത്തിൽ അത് പരാജിതനായ രാജാവായ ഹദദേസെരിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  choice: 1,700 കുതിരപ്പടയാളികൾ
  rationale: פָּרָשִׁים കുതിരപ്പടയെയോ കുതിരപ്പടയാളികളെയോ സൂചിപ്പിക്കുന്നു. സംഖ്യ സാമുവേലിലെ മസോരറ്റിക് പാഠപ്രകാരം നിലനിർത്തുന്നു.
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  choice: 20,000 കാലാൾപ്പടയാളികൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘കാൽനടയായ മനുഷ്യർ’; സൈനികസന്ദർഭം വ്യക്തമായി നൽകുന്ന ആധുനിക മലയാളപ്രയോഗമാണ് ‘കാലാൾപ്പടയാളികൾ’.
- source_word: וַיְעַקֵּר
  choice: കാൽഞരമ്പ് മുറിച്ച് പ്രവർത്തനരഹിതമാക്കി
  rationale: ഈ സന്ദർഭത്തിൽ עקר കുതിരകളുടെ കാൽഞരമ്പ് മുറിച്ച് അവയെ സൈനിക ഉപയോഗത്തിന് അയോഗ്യമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രവൃത്തിയും ഫലവും വ്യക്തമായി പറയുന്നു.
- source_word: אֶת כָּל הָרֶכֶב
  choice: രഥപ്പടയിലെ കുതിരകളെയെല്ലാം
  rationale: רֶכֶב സാധാരണയായി രഥം/രഥപ്പട എന്നാണ്; എന്നാൽ ‘കാൽഞരമ്പ് മുറിക്കുക’ എന്ന ക്രിയ കാരണം ഇവിടെ രഥപ്പടയിലെ കുതിരകളാണ് പരോക്ഷമായി ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: 100 രഥങ്ങൾക്കാവശ്യമായവയെ ശേഷിപ്പിച്ചു
  rationale: יתר ശേഷിപ്പിക്കുക/ബാക്കിവെക്കുക എന്നാണ്. ‘നൂറ് രഥങ്ങൾ’ എന്ന അളവിന് വേണ്ട കുതിരകളെ ശേഷിപ്പിച്ചു എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
