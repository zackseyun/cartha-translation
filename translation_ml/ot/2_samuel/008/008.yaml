translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. ഹീബ്രു വാക്യക്രമം അതേപടി അനുകരിക്കാതെ, സ്ഥലങ്ങളുടെ ഹദദേസെരുമായുള്ള ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ബന്ധവാചകം ഉപയോഗിച്ചു. എല്ലാ പാഠവ്യത്യാസങ്ങളും ലോഹപദത്തിന്റെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
