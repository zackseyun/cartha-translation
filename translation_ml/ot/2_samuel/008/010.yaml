  rationale: അക്ഷരാർഥത്തിൽ ചുരുക്കവും അസ്വാഭാവികവുമായ ‘തോയിയുമായി യുദ്ധങ്ങളുടെ മനുഷ്യൻ’ എന്ന പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
