  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
translation:
  language: ml
  text: അപ്പോൾ തോയി തന്റെ മകൻ യോരാമിനെ ദാവീദ് രാജാവിന്റെ അടുക്കൽ അയച്ചു. ദാവീദ് ഹദദേസെരിനെതിരെ യുദ്ധം ചെയ്ത് അവനെ തോൽപ്പിച്ചതിനാൽ, ദാവീദിന്റെ ക്ഷേമം അന്വേഷിക്കാനും അദ്ദേഹത്തെ ആശീർവദിക്കാനുമായിരുന്നു അവനെ അയച്ചത്. ഹദദേസെർ തോയിയോടു യുദ്ധത്തിലായിരുന്നു[a]. യോരാമിന്റെ കൈവശം വെള്ളി, പൊന്ന്, വെങ്കലം എന്നിവകൊണ്ടുള്ള വസ്തുക്കൾ ഉണ്ടായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഹദദേസെർ തോയിയുടെ യുദ്ധങ്ങളുടെ മനുഷ്യനായിരുന്നു”; അതായത്, അവൻ തോയിയോടു യുദ്ധം ചെയ്തിരുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവന്റെ കയ്യിൽ ഉണ്ടായിരുന്നു”; അതായത്, യോരാം ഈ വസ്തുക്കൾ കൂടെ കൊണ്ടുവന്നിരുന്നു.
    reason: lexical_alternative
