  rationale: כְּלִי എന്ന വിശാലപദത്തിന് ‘വസ്തുക്കൾ’ യോജിക്കുന്നു; נְחֹשֶׁת ഇവിടെ ‘വെങ്കലം’ എന്നു നൽകുന്നു.
