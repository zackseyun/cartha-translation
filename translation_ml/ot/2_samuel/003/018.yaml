  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֖ה עֲשׂ֑וּ כִּ֣י יְהוָ֗ה אָמַ֤ר אֶל דָּוִד֙ לֵ/אמֹ֔ר בְּ/יַ֣ד דָּוִ֣ד עַבְדִּ֗/י הוֹשִׁ֜יעַ אֶת עַמִּ֤/י יִשְׂרָאֵל֙ מִ/יַּ֣ד פְּלִשְׁתִּ֔ים וּ/מִ/יַּ֖ד כָּל אֹיְבֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
translation:
  language: ml
  text: 'ഇപ്പോൾ അതു ചെയ്യുവിൻ; കാരണം യഹോവ ദാവീദിനെക്കുറിച്ച് ഇങ്ങനെ അരുളിച്ചെയ്തിരിക്കുന്നു: “എന്റെ ദാസനായ ദാവീദിന്റെ കൈയാൽ ഞാൻ എന്റെ ജനമായ ഇസ്രായേലിനെ ഫെലിസ്ത്യരുടെ കൈയിൽനിന്നും അവരുടെ സകല ശത്രുക്കളുടെയും കൈയിൽനിന്നും രക്ഷിക്കും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു വായന: “എന്റെ ദാസനായ ദാവീദ് എന്റെ ജനമായ ഇസ്രായേലിനെ ഫെലിസ്ത്യരുടെ കൈയിൽനിന്നും അവരുടെ സകല ശത്രുക്കളുടെയും കൈയിൽനിന്നും രക്ഷിക്കും.” എബ്രായരൂപത്തിൽ യഹോവയെ സൂചിത കർത്താവായും ദാവീദിനെ അവൻ പ്രവർത്തിക്കുന്ന ഉപാധിയായും മനസ്സിലാക്കാം; അല്ലെങ്കിൽ ദാവീദിനെ വ്യാകരണകർത്താവായി എടുക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മുൻസംഭാഷണത്തിൽനിന്ന് അടിയന്തരമായ പ്രവർത്തനാഹ്വാനത്തിലേക്കുള്ള മാറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֲשׂוּ
  choice: അതു ചെയ്യുക
  rationale: ബഹുവചന ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുകയും സന്ദർഭത്തിൽ മുമ്പ് നിർദേശിച്ച കാര്യം നടപ്പാക്കുന്നതിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെ അതിന്റെ അടിസ്ഥാനം അവതരിപ്പിക്കുന്ന കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אָמַר אֶל דָּוִד לֵאמֹר
  choice: ദാവീദിനെക്കുറിച്ച് ഇങ്ങനെ അരുളിച്ചെയ്തിരിക്കുന്നു
  rationale: ഈ സന്ദർഭത്തിൽ വരുന്ന ദൈവവചനം ദാവീദിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയായി വായിക്കുന്നതിലുപരി ദാവീദിനെക്കുറിച്ചുള്ള പ്രഖ്യാപനമായി സ്വാഭാവികമായി ചേരുന്നു; perfect രൂപത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി ‘അരുളിച്ചെയ്തിരിക്കുന്നു’ പ്രകടമാക്കുന്നു.
- source_word: בְּיַד דָּוִד עַבְדִּי
  choice: എന്റെ ദാസനായ ദാവീദിന്റെ കൈയാൽ
  rationale: בְּיַד എന്ന ഏജൻസി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സാഹിത്യരൂപം നിലനിർത്തുകയും ദാവീദ് നിയോഗിക്കപ്പെട്ട ഉപകരണമാണെന്ന അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הוֹשִׁיעַ
  choice: ഞാൻ ... രക്ഷിക്കും
  rationale: ദൈവം സംസാരിക്കുന്ന ഉദ്ധരണിയിൽ ദാവീദിന്റെ കൈയിലൂടെ ദൈവം നടത്തുന്ന രക്ഷയായി മുഖ്യവായന നൽകുന്നു; രൂപസംബന്ധമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: എന്റെ ജനമായ ഇസ്രായേലിനെ
  rationale: ഉടമ്പടിസംബന്ധമായ ഉടമസ്ഥപ്രയോഗവും ‘ഇസ്രായേൽ’ എന്ന വിശദീകരണനാമവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִיַּד פְּלִשְׁתִּים וּמִיַּד כָּל אֹיְבֵיהֶם
  choice: ഫെലിസ്ത്യരുടെ കൈയിൽനിന്നും അവരുടെ സകല ശത്രുക്കളുടെയും കൈയിൽനിന്നും
  rationale: ശത്രുവിന്റെ അധികാരം സൂചിപ്പിക്കുന്ന ആവർത്തിത ‘കൈയിൽനിന്ന്’ പ്രയോഗവും כָּל എന്ന സമഗ്രതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: הוֹשִׁיעַ എന്ന രൂപത്തിന്റെ കർത്താവും രക്ഷയിലെ ദൈവിക-മാനുഷിക പ്രവർത്തനബന്ധവും
  choice: ‘എന്റെ ദാസനായ ദാവീദിന്റെ കൈയാൽ ഞാൻ ... രക്ഷിക്കും’—യഹോവയാണ് രക്ഷയുടെ ആത്യന്തിക കർത്താവ്; ദാവീദ് അവന്റെ നിയോഗിക്കപ്പെട്ട ഉപകരണം.
  alternative: ‘എന്റെ ദാസനായ ദാവീദ് എന്റെ ജനമായ ഇസ്രായേലിനെ ... രക്ഷിക്കും’—ദാവീദിനെ വ്യാകരണകർത്താവായി എടുക്കുന്ന വായന.
  rationale: ‘യഹോവ ... അരുളിച്ചെയ്തിരിക്കുന്നു’ എന്ന അവതരണവും ‘എന്റെ ദാസനായ ദാവീദിന്റെ കൈയാൽ’ എന്ന ഏജൻസി പ്രയോഗവും മുഖ്യവായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും എബ്രായരൂപം ദാവീദിനെ വ്യാകരണകർത്താവാക്കി മനസ്സിലാക്കാൻ ഇടനൽകുന്നതിനാൽ ആ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘അരുളിച്ചെയ്തിരിക്കുന്നു’ ദൈവവചനത്തിന് യോജിച്ച മാന്യത നൽകുന്നു; ‘കൈയാൽ/കൈയിൽനിന്ന്’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ സാഹിത്യഘടന സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം സംശയമുള്ള രക്ഷാവാക്യത്തിനു പിന്നാലെ വെച്ചിരിക്കുന്നു.
