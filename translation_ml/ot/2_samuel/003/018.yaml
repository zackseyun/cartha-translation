  to: 'ഇപ്പോൾ അതു ചെയ്യുവിൻ; കാരണം യഹോവ ദാവീദിനെക്കുറിച്ച് ഇങ്ങനെ അരുളിച്ചെയ്തിരിക്കുന്നു: “എന്റെ ദാസനായ ദാവീദിന്റെ കൈയാൽ ഞാൻ എന്റെ ജനമായ ഇസ്രായേലിനെ ഫെലിസ്ത്യരുടെ കൈയിൽനിന്നും അവരുടെ സകല ശത്രുക്കളുടെയും കൈയിൽനിന്നും രക്ഷിക്കും.”[a]'
