  text: While the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
translation:
  language: ml
  text: ശൗലിന്റെ ഭവനവും ദാവീദിന്റെ ഭവനവും തമ്മിലുള്ള യുദ്ധം തുടർന്നുകൊണ്ടിരിക്കുമ്പോൾ, അബ്നേർ ശൗലിന്റെ ഭവനത്തിൽ സ്വയം ശക്തിപ്പെടുത്തിക്കൊണ്ടിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ശൗലിന്റെ ഭവനത്തിൽ ശക്തനായിക്കൊണ്ടിരുന്നു.” ഹീബ്രായ ക്രിയയ്ക്ക് ശക്തനായിത്തീരുക എന്നോ സ്വയം ശക്തിപ്പെടുത്തുക എന്നോ അർഥമാകാം; ഇവിടെ അബ്നേർ ശൗലിന്റെ ഭവനത്തിനുള്ളിൽ സ്വന്തം സ്ഥാനം ഉറപ്പിച്ചുകൊണ്ടിരുന്നു എന്ന സൂചനയുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת הַמִּלְחָמָה
  choice: യുദ്ധം തുടർന്നുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ב + infinitive construct ആയ בִּהְיוֹת ദൈർഘ്യമുള്ള കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. വാക്യാരംഭത്തിലെ וַיְהִי‌ക്ക് പ്രത്യേകം ‘ഇപ്പോൾ’ ചേർക്കാതെ, അതിന്റെ ആഖ്യാനബന്ധം സ്വാഭാവികമായ കാലവാക്യത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: ശൗലിന്റെ ഭവനവും ദാവീദിന്റെ ഭവനവും തമ്മിലുള്ള
  rationale: בֵּית എന്നതിലെ കുടുംബം, രാജവംശം, രാഷ്ട്രീയപക്ഷം എന്നീ അർഥവ്യാപ്തികൾ നിലനിർത്താൻ ‘ഭവനം’ ഉപയോഗിച്ചു; ‘രാജവംശം’ എന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
- source_word: וְאַבְנֵר
  choice: അബ്നേർ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: הָיָה מִתְחַזֵּק
  choice: സ്വയം ശക്തിപ്പെടുത്തിക്കൊണ്ടിരുന്നു
  rationale: חזק എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപത്തിലുള്ള പ്രതിഫലനാത്മക/സ്വയം മുന്നേറുന്ന ഭാവവും പ്രവൃത്തിയുടെ തുടർച്ചയും പ്രകടമാക്കുന്നു.
- source_word: בְּבֵית שָׁאוּל
  choice: ശൗലിന്റെ ഭവനത്തിൽ
  rationale: അബ്നേർ തന്റെ സ്വാധീനം ഉറപ്പിച്ചിരുന്ന കുടുംബ-രാഷ്ട്രീയ മേഖലയെ സൂചിപ്പിക്കുന്ന בְּ എന്ന മുൻപ്രത്യയവും ‘ഭവനം’ എന്ന മൂലരൂപകവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: മִתְחַזֵּק എന്ന രൂപം വളർന്നുവരുന്ന ശക്തിയെയോ സ്വസ്ഥാനം ബലപ്പെടുത്തുന്നതിനെയോ സൂചിപ്പിക്കുമോ
  choice: സ്വയം ശക്തിപ്പെടുത്തിക്കൊണ്ടിരുന്നു
  alternative: ശക്തനായിക്കൊണ്ടിരുന്നു
  rationale: ഹിത്പയേൽ രൂപത്തിന്റെ പ്രതിഫലനാത്മക സ്വഭാവം പ്രധാനവാചകത്തിൽ നിലനിർത്തി; എന്നാൽ സ്വാഭാവികമായി ശക്തി വർധിച്ചു എന്ന വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ അത് രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. ‘ഭവനം’ എന്ന പദം വീട്ടുകാർ, രാജവംശം, രാഷ്ട്രീയപക്ഷം എന്നീ ഹീബ്രായ അർഥതലങ്ങൾ തുറന്നുവയ്ക്കുന്നു. കാലവാക്യം സ്വാഭാവികമാക്കിയെങ്കിലും മുഖ്യക്രിയയുടെ പ്രതിഫലനാത്മക സൂക്ഷ്മത സംരക്ഷിച്ചു.
