  text: וְ/יוֹאָב֙ וַ/אֲבִישַׁ֣י אָחִ֔י/ו הָרְג֖וּ לְ/אַבְנֵ֑ר עַל֩ אֲשֶׁ֨ר הֵמִ֜ית אֶת עֲשָׂהאֵ֧ל אֲחִי/הֶ֛ם בְּ/גִבְע֖וֹן בַּ/מִּלְחָמָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
translation:
  language: ml
  text: അങ്ങനെ[a] യോവാബും അവന്റെ സഹോദരനായ അബീശായിയും അബ്നേരിനെ കൊന്നു, അബ്നേർ ഗിബെയോനിൽ നടന്ന യുദ്ധത്തിൽ അവരുടെ സഹോദരനായ അസാഹേലിനെ കൊന്നിരുന്നതിനാൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യോവാബും അവന്റെ സഹോദരനായ അബീശായിയും അബ്നേരിനെ കൊന്നു.” എബ്രായ ബന്ധകം ലളിതമായി ‘ഉം/എന്നിട്ട്’ എന്ന അർഥത്തിൽ നൽകാം; ‘അങ്ങനെ’ എന്നത് ചുറ്റുമുള്ള സന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ לְאַבְנֵר
  choice: അബ്നേരിനെ കൊന്നു
  rationale: הרג എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം നേരിട്ട് നൽകുന്നു. ‘കൊലപ്പെടുത്തി’ എന്നതിനെക്കാൾ ‘കൊന്നു’ സ്വാഭാവികവും മൂലപാഠത്തിലുള്ള നിയമപരമോ ധാർമികമോ ആയ വിധിയെ അതിലധികം വ്യാഖ്യാനിക്കാത്തതുമാണ്; ל ഇവിടെ കർമത്തെ അടയാളപ്പെടുത്തുന്നു.
- source_word: עַל אֲשֶׁר
  choice: കാരണം
  rationale: അബ്നേരിനെ കൊന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ഘടകമാണിത്; ആ കാരണബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הֵמִית
  choice: കൊന്നിരുന്നു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ‘മരണത്തിന് കാരണമായി/കൊന്നു’ എന്നാണ്. അബ്നേരിന്റെ പ്രവൃത്തി യോവാബിന്റെയും അബീശായിയുടെയും പ്രവൃത്തിക്ക് മുമ്പുണ്ടായതാണെന്ന് മലയാളത്തിലെ ഭൂതകാലപൂർണരൂപം വ്യക്തമാക്കുന്നു.
- source_word: אָחִיו / אֲחִיהֶם
  choice: അവന്റെ സഹോദരനായ / അവരുടെ സഹോദരനായ
  rationale: ആദ്യത്തേത് അബീശായി യോവാബിന്റെ സഹോദരനാണെന്നും രണ്ടാമത്തേത് അസാഹേൽ ഇരുവരുടെയും സഹോദരനാണെന്നും വ്യക്തമാക്കുന്ന ബന്ധങ്ങൾ സംരക്ഷിക്കുന്നു.
- source_word: בְּגִבְעוֹן בַּמִּלְחָמָה
  choice: ഗിബെയോനിൽ നടന്ന യുദ്ധത്തിൽ
  rationale: നിശ്ചിതമായ, കഥാസന്ദർഭത്തിൽ മുമ്പേ അറിയപ്പെടുന്ന യുദ്ധത്തെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ടത നിലനിർത്തുകയും മലയാളത്തിൽ സ്ഥലം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְ / וַ
  choice: അങ്ങനെ
  rationale: വാക്യം മുൻസന്ദർഭത്തെ സംഗ്രഹിച്ചും അതിൽനിന്നുള്ള വിശദീകരണബന്ധം സൂചിപ്പിച്ചും വരുന്നു. അടിസ്ഥാനമായ ‘എന്നും/ഉം’ എന്ന ബന്ധകവായനയ്ക്കുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
