translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു; മൂലപാഠം നേരിട്ട് പ്രസ്താവിക്കാത്ത ‘കൊലപാതകം’ പോലുള്ള നിയമ-ധാർമിക വിലയിരുത്തൽ ഒഴിവാക്കി.
