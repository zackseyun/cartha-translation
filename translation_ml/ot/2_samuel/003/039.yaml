id: 2SA.3.39
reference: 2 Samuel 3:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָנֹכִ֨י הַ/יּ֥וֹם רַךְ֙ וּ/מָשׁ֣וּחַ מֶ֔לֶךְ וְ/הָ/אֲנָשִׁ֥ים הָ/אֵ֛לֶּה בְּנֵ֥י צְרוּיָ֖ה קָשִׁ֣ים מִמֶּ֑/נִּי יְשַׁלֵּ֧ם יְהוָ֛ה לְ/עֹשֵׂ֥ה הָ/רָעָ֖ה כְּ/רָעָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
translation:
  language: ml
  text: ഞാൻ രാജാവായി അഭിഷേകം ചെയ്യപ്പെട്ടവനാണെങ്കിലും ഇന്ന് ബലഹീനനാണ്[a]. സെരൂയയുടെ പുത്രന്മാരായ ഈ മനുഷ്യർ എനിക്ക് കൈകാര്യം ചെയ്യാനാവാത്തവിധം കഠിനരാണ്[b]. തിന്മ പ്രവർത്തിക്കുന്നവന് അവന്റെ തിന്മയ്ക്കൊത്ത പ്രതിഫലം യഹ്‌വെ നൽകട്ടെ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇന്ന് ഞാൻ ഇപ്പോഴും മൃദുവായവനാണ്’ എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രു പദത്തിന് ‘മൃദുവായ/കോമളമായ’ എന്നർഥമുണ്ടെങ്കിലും ഇവിടെ അത് ബലഹീനതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഈ മനുഷ്യർ എന്നെക്കാൾ ശക്തരാണ്’ എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രു പദം അവരുടെ കഠിനതയെയോ ശക്തിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘തിന്മ പ്രവർത്തിക്കുന്നവന് അവന്റെ തിന്മയ്ക്കൊത്ത പ്രതിഫലം യഹ്‌വെ നൽകും’ എന്നും വായിക്കാം. ഹീബ്രു ക്രിയ ആശംസയായോ ലളിതഭാവിയായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  choice: ബലഹീനൻ
  rationale: ഈ വിശേഷണത്തിന് അക്ഷരാർഥത്തിൽ ‘മൃദുവായവൻ/കോമളൻ’ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ യോവാബിനെയും സഹോദരന്മാരെയും നിയന്ത്രിക്കാനുള്ള ദാവീദിന്റെ രാഷ്ട്രീയവും പ്രായോഗികവുമായ അശക്തിയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: וּמָשׁוּחַ מֶלֶךְ
  choice: രാജാവായി അഭിഷേകം ചെയ്യപ്പെട്ടവനാണെങ്കിലും
  rationale: ഹീബ്രുവിലെ സംയോജനം ദാവീദിന്റെ ബലഹീനതയും അഭിഷിക്ത രാജാവെന്ന പദവിയും തമ്മിലുള്ള വൈരുധ്യം പ്രകടമാക്കുന്നു; മലയാളത്തിൽ ‘ആണെങ്കിലും’ ആ concessive ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנֵי צְרוּיָה
  choice: സെരൂയയുടെ പുത്രന്മാർ
  rationale: യോവാബിനെയും അവന്റെ സഹോദരന്മാരെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു കുടുംബനാമപ്രയോഗത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു.
- source_word: קָשִׁים מִמֶּנִּי
  choice: എനിക്ക് കൈകാര്യം ചെയ്യാനാവാത്തവിധം കഠിനർ
  rationale: קָשִׁים എന്നത് കഠിനത, നിർദയത, ശക്തി എന്നിവ സൂചിപ്പിക്കാം; מִמֶּנִּי എന്ന താരതമ്യപ്രയോഗത്തോടൊപ്പം, അവരുടെ കഠിനസ്വഭാവവും അവരെ നിയന്ത്രിക്കാനുള്ള ദാവീദിന്റെ അശക്തിയും ഈ വിവർത്തനം അറിയിക്കുന്നു.
- source_word: יְשַׁלֵּם
  choice: പ്രതിഫലം നൽകട്ടെ
  rationale: സന്ദർഭത്തിൽ ഈ അപൂർണ്ണക്രിയ ദൈവനീതിക്കായുള്ള ആശംസയോ അപേക്ഷയോ ആയി വായിക്കാം; പ്രവചനാത്മകമായ ലളിതഭാവിയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ യ്ഹ്വ്ഹ് ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്യുന്നു.
- source_word: לְעֹשֵׂה הָרָעָה
  choice: തിന്മ പ്രവർത്തിക്കുന്നവന്
  rationale: തിന്മ ചെയ്യുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു കൃദന്തരൂപം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: כְּרָעָתוֹ
  choice: അവന്റെ തിന്മയ്ക്കൊത്ത
  rationale: പ്രതിഫലം ആ വ്യക്തിയുടെ തിന്മയ്ക്ക് അനുപാതമായിരിക്കണമെന്ന ഹീബ്രു ആശയം വ്യാഖ്യാനാതിരേകമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ശബ്ദാന്തരം ചെയ്തു.
- issue: ദാവീദിന്റെ അവസാന വാക്കുകളുടെ ഭാവം
  choice: 'ആശംസ/അപേക്ഷ: ‘യഹ്‌വെ നൽകട്ടെ’'
  alternative: 'ലളിതഭാവി: ‘യഹ്‌വെ നൽകും’'
  rationale: ദാവീദ് പ്രതികാരം ദൈവനീതിക്ക് വിടുന്ന സന്ദർഭത്തിൽ ആശംസാഭാവം യോജിക്കുന്നു; എന്നാൽ ഹീബ്രു അപൂർണ്ണക്രിയയ്ക്ക് ലളിതഭാവിയായും വായന സാധ്യമാകുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: കָשִׁים מִמֶּנִּי എന്നതിലെ സ്വഭാവവും ശക്തിയും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: ‘എനിക്ക് കൈകാര്യം ചെയ്യാനാവാത്തവിധം കഠിനർ’
  alternative: ‘എന്നെക്കാൾ ശക്തർ’
  rationale: വാക്കിന് കഠിനത/നിർദയതയും താരതമ്യേന കൂടുതൽ ശക്തിയുമെന്ന രണ്ടു ഭാവങ്ങളുണ്ട്. മുഖ്യപാഠം സന്ദർഭത്തിലെ ഇരുവശവും കൂട്ടിപ്പിടിക്കുമ്പോൾ മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘അഭിഷേകം ചെയ്യപ്പെട്ടവൻ’, ‘സെരൂയയുടെ പുത്രന്മാർ’ എന്നീ പ്രയോഗങ്ങൾ വാക്യത്തിന്റെ രാജകീയവും ഔപചാരികവുമായ ഭാവം നിലനിർത്തുന്നു; അർഥസന്ദിഗ്ധതകൾ അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
