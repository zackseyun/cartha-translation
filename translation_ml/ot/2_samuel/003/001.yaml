id: 2SA.3.1
reference: 2 Samuel 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ אֲרֻכָּ֔ה בֵּ֚ין בֵּ֣ית שָׁא֔וּל וּ/בֵ֖ין בֵּ֣ית דָּוִ֑ד וְ/דָוִד֙ הֹלֵ֣ךְ וְ/חָזֵ֔ק וּ/בֵ֥ית שָׁא֖וּל הֹלְכִ֥ים וְ/דַלִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: The war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
translation:
  language: ml
  text: ശൗലിന്റെ ഭവനവും ദാവീദിന്റെ ഭവനവും തമ്മിലുള്ള യുദ്ധം നീണ്ടുനിന്നു[a]. ദാവീദ് കൂടുതൽ കൂടുതൽ ശക്തനായിക്കൊണ്ടിരുന്നു; ശൗലിന്റെ ഭവനമാകട്ടെ കൂടുതൽ കൂടുതൽ ദുർബലമായിക്കൊണ്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദീർഘമായിരുന്നു.” ഹീബ്രായ വിശേഷണം അക്ഷരാർഥത്തിൽ “നീണ്ടത്” എന്നാണ്; ഇവിടെ അത് യുദ്ധത്തിന്റെ ദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ഭവനം” എന്നതിന് കുടുംബം, വംശപരമ്പര, അല്ലെങ്കിൽ രാജവംശം എന്നൊക്കെ അർഥമാകാം; ഇവിടെ ഹീബ്രായ പദത്തിന് കുടുംബപരവും രാഷ്ട്രീയവുമായ അർഥബലം ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: നീണ്ടുനിന്നു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിന്റെ അടുത്ത ഘട്ടം അവതരിപ്പിക്കുന്നു; ഹീബ്രായിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ പ്രത്യേക കാലസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: הַמִּלְחָמָה
  choice: യുദ്ധം
  rationale: ഇരു ഭവനങ്ങൾക്കുമിടയിലെ സൈനിക-രാഷ്ട്രീയ പോരാട്ടത്തെ നേരായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: אֲרֻכָּה
  choice: നീണ്ടുനിന്നു
  rationale: അക്ഷരാർഥം ‘നീണ്ടത്’; ഇവിടെ യുദ്ധത്തിന്റെ ദൈർഘ്യമാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ ‘നീണ്ടുനിന്നു’ സ്വാഭാവികമായി ആ കാലവ്യാപ്തി നൽകുന്നു.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: ശൗലിന്റെ ഭവനവും ദാവീദിന്റെ ഭവനവും തമ്മിലുള്ള
  rationale: ‘ഭവനം’ കുടുംബം, വംശപരമ്പര, രാജകുടുംബം എന്നീ കുടുംബപരവും രാഷ്ട്രീയവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וְדָוִד הֹלֵךְ וְחָזֵק
  choice: ദാവീദ് കൂടുതൽ കൂടുതൽ ശക്തനായിക്കൊണ്ടിരുന്നു
  rationale: הלך സഹിതമുള്ള ഘടന തുടർച്ചയായ പുരോഗതിയെ സൂചിപ്പിക്കുന്നു; ആവർത്തിച്ചുള്ള ‘കൂടുതൽ കൂടുതൽ’ ക്രമേണ ശക്തിവർധിക്കുന്ന ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: וּבֵית שָׁאוּל הֹלְכִים וְדַלִּים
  choice: ശൗലിന്റെ ഭവനമാകട്ടെ കൂടുതൽ കൂടുതൽ ദുർബലമായിക്കൊണ്ടിരുന്നു
  rationale: ദാവീദിന്റെ ശക്തിവർധനയോടുള്ള തുടർച്ചയായ വിപരീതഗതി ‘മാകട്ടെ’യും പുരോഗമന ക്രിയാരൂപവും പ്രകടമാക്കുന്നു.
- source_word: דַלִּים
  choice: ദുർബലമായിക്കൊണ്ടിരുന്നു
  rationale: ഇവിടെ സാമ്പത്തിക ദാരിദ്ര്യമല്ല, ശക്തിയുടെയും രാഷ്ട്രീയ-സൈനിക ശേഷിയുടെയും ക്ഷയമാണ് സന്ദർഭോചിതമായ അർഥം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭവനം’ എന്ന പദം ഹീബ്രായിലെ കുടുംബ-രാജവംശ ദ്വയാർഥം നിലനിർത്താൻ ഉപയോഗിച്ചു. മുഖ്യവാക്യത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
