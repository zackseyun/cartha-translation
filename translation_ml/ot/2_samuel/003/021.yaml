source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְנֵ֣ר אֶל דָּוִ֡ד אָק֣וּמָה וְֽ/אֵלֵ֡כָה וְ/אֶקְבְּצָה֩ אֶל אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אֶת כָּל יִשְׂרָאֵ֗ל וְ/יִכְרְת֤וּ אִתְּ/ךָ֙ בְּרִ֔ית וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וַ/יְּשַׁלַּ֥ח דָּוִ֛ד אֶת אַבְנֵ֖ר וַ/יֵּ֥לֶךְ בְּ/שָׁלֽוֹם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
translation:
  language: ml
  text: 'അബ്നേർ ദാവീദിനോടു പറഞ്ഞു: “ഞാൻ എഴുന്നേറ്റ് പോകാം; ഇസ്രായേൽ മുഴുവനെയും എന്റെ യജമാനനും രാജാവുമായ അങ്ങയുടെ അടുക്കൽ കൂട്ടിച്ചേർക്കാം. അവർ അങ്ങയുമായി ഒരു ഉടമ്പടി ചെയ്യട്ടെ[a]; അപ്പോൾ അങ്ങയുടെ ഉള്ളം ആഗ്രഹിക്കുന്ന സകലത്തിന്മേലും അങ്ങ് രാജാവായി വാഴും[b].” പിന്നെ ദാവീദ് അബ്നേരിനെ യാത്രയാക്കി; അവൻ സമാധാനത്തോടെ പോയി[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ പദശഃ: “അങ്ങയുമായി ഒരു ഉടമ്പടി മുറിക്കട്ടെ.”'
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “അങ്ങ് ആഗ്രഹിക്കുന്ന സകലത്തിന്മേലും”; എബ്രായത്തിൽ പദശഃ: “അങ്ങയുടെ പ്രാണൻ ആഗ്രഹിക്കുന്ന സകലത്തിന്മേലും.”'
    reason: lexical_alternative
  - marker: c
    text: “സമാധാനത്തോടെ പോയി” എന്നത് സുരക്ഷിതമായും സൗഹാർദപരമായ വ്യവസ്ഥകളിലും യാത്രതിരിച്ചതിനെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: אָקוּמָה וְאֵלֵכָה
  choice: ഞാൻ എഴുന്നേറ്റു പോയി
  rationale: തുടർച്ചയായ cohortative രൂപങ്ങൾ അബ്നേരിന്റെ ഉറച്ച ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു. ‘എഴുന്നേറ്റു പോയി’ എന്നത് എബ്രായ ക്രമവും മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹവും നിലനിർത്തുന്നു.
- source_word: וְאֶקְבְּצָה
  choice: കൂട്ടിവരാം
  rationale: കേവലം ഒരുമിച്ചുകൂട്ടുക എന്നതിലുപരി, ഇസ്രായേലിനെ ദാവീദിന്റെ അടുക്കലേക്ക് കൊണ്ടുവരിക എന്ന ദിശാസൂചനയും സന്ദർഭവും ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവിന്റെ അടുക്കൽ
  rationale: ദാവീദിനോടുള്ള അബ്നേരിന്റെ രാജസദസ്സിലെ ആദരസംബോധനയും אֶל എന്നതിന്റെ ദിശാസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനെയും
  rationale: ഗോത്രസമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  choice: അവർ അങ്ങയുമായി ഒരു ഉടമ്പടി ചെയ്യട്ടെ
  rationale: כרת ברית എന്ന സ്ഥിരപ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘മുറിക്കുക’ എന്ന പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וּמָלַכְתָּ
  choice: അങ്ങ് രാജാവായി വാഴും
  rationale: രാജത്വം പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: അങ്ങയുടെ ഉള്ളം ആഗ്രഹിക്കുന്ന സകലത്തിന്മേലും
  rationale: נפש എന്ന പദത്തിലെ ആന്തരിക വ്യക്തിത്വത്തിന്റെയും ആഗ്രഹത്തിന്റെയും ഭാവം ‘ഉള്ളം’ വഴി സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഭരണത്തിന്റെ വ്യാപ്തിയെക്കുറിച്ചുള്ള മൂലവാക്യത്തിന്റെ പൊതുസ്വഭാവം ചുരുക്കുന്നില്ല.
- source_word: וַיְשַׁלַּח דָּוִד אֶת אַבְנֵר
  choice: ദാവീദ് അബ്നേരിനെ യാത്രയാക്കി
  rationale: ഇവിടെ ശലാഹ് എന്നത് ഒരാളെ സമാധാനപരമായി പറഞ്ഞയയ്ക്കുന്നതാണ്; ‘യാത്രയാക്കി’ എന്നത് വിടവാങ്ങലിന്റെ സന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: അവൻ സമാധാനത്തോടെ പോയി
  rationale: സുരക്ഷിതമായും സൗഹാർദപരമായ വ്യവസ്ഥകളിലുമുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അടിസ്ഥാന അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടി സ്ഥാപിക്കുന്നതിനുള്ള כרת ברית എന്ന പ്രയോഗം
  choice: ഒരു ഉടമ്പടി ചെയ്യുക
  alternative: ഒരു ഉടമ്പടി മുറിക്കുക; ഒരു ഉടമ്പടിയിൽ ഏർപ്പെടുക
  rationale: ഇവിടെ രാഷ്ട്രീയ ഉടമ്പടിയാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ അർഥം വ്യക്തമാകാൻ പതിവായ ‘ഉടമ്പടി ചെയ്യുക’ ഉപയോഗിക്കുകയും ആചാരപശ്ചാത്തലമുള്ള പദശഃ പ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
- issue: נפש ഉൾപ്പെടുന്ന ആഗ്രഹപ്രയോഗം
  choice: അങ്ങയുടെ ഉള്ളം ആഗ്രഹിക്കുന്ന
  alternative: അങ്ങ് ആഗ്രഹിക്കുന്ന; അങ്ങയുടെ പ്രാണൻ ആഗ്രഹിക്കുന്ന
  rationale: ‘ഉള്ളം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ, נפש സൂചിപ്പിക്കുന്ന ആന്തരിക വ്യക്തിത്വത്തെ പൂർണമായി ഒഴിവാക്കുന്നില്ല. ‘പ്രാണൻ’ ഇവിടെ അസ്വാഭാവികമായോ തെറ്റിദ്ധരിപ്പിക്കുന്നതായോ തോന്നാം.
- issue: രാജത്വത്തിന്റെ വ്യാപ്തി
  choice: സകലത്തിന്മേലും
  alternative: എല്ലാവരുടെയുംമേൽ; ദേശം മുഴുവനും
  rationale: כֹל אֲשֶׁר എന്ന മൂലവാക്യം ഉദ്ദേശ്യപൂർവം പൊതുവായതാണ്. അതിനെ ആളുകളിലേക്കോ പ്രദേശത്തിലേക്കോ മാത്രം പരിമിതപ്പെടുത്തി വ്യാഖ്യാനിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി ഉപയോഗിച്ചു. ദാവീദിനോടുള്ള ആദരസംബോധനയ്ക്ക് ‘അങ്ങ്’ എന്നും രാജസദസ്സിലെ പദവിക്ക് ‘യജമാനനായ രാജാവ്’ എന്നും നൽകി. വാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും ഉടമ്പടി, נפש, ‘സമാധാനത്തോടെ പോകുക’ എന്നീ മൂലഭാഷാ സവിശേഷതകൾ അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
