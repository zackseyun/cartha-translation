    rationale: “ഞാൻ എഴുന്നേറ്റു പോയി” normally reads as a completed action (“I got up and went”), whereas אָקוּמָה וְאֵלֵכָה consists of cohortatives expressing Abner’s intended future action. The revision preserves that prospective resolve.
  - severity: low
