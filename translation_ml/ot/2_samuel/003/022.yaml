  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
translation:
  language: ml
  text: ഇതാ, ദാവീദിന്റെ ഭൃത്യന്മാരും യോവാബും ഒരു കൊള്ളയാത്രയിൽനിന്ന് വന്നു[a]; അവർ ധാരാളം കൊള്ളമുതൽ കൂടെ കൊണ്ടുവന്നു. എന്നാൽ അബ്നേർ ദാവീദിനോടൊപ്പം ഹെബ്രോനിൽ ഉണ്ടായിരുന്നില്ല; കാരണം ദാവീദ് അവനെ പറഞ്ഞയച്ചിരുന്നു, അവൻ സമാധാനത്തോടെ പോയിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു കൊള്ളയാത്രയിൽനിന്ന്” എന്നതിനുപകരം “സൈനികസംഘത്തിൽനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ גְּדוּד ഒരു സൈനികസംഘത്തെയോ കൊള്ളയാത്ര നടത്തുന്ന സംഘത്തെയോ സൂചിപ്പിക്കാം; അടുത്ത വാക്യഭാഗത്തിൽ കൊള്ളമുതൽ പറയുന്നതിനാൽ ഇവിടെ “കൊള്ളയാത്ര” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “സമാധാനത്തോടെ പോയി.” അബ്നേർ സുരക്ഷിതമായും നല്ല ബന്ധം നിലനിന്ന നിലയിലും യാത്രതിരിച്ചു എന്നാണ് ഈ എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: പുതിയതും ശ്രദ്ധേയവുമായ ഒരു സംഭവവികാസം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യതയും ആഖ്യാനപ്രവാഹവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַבְדֵי דָוִד
  choice: ദാവീദിന്റെ ഭൃത്യന്മാർ
  rationale: ഇവിടെ עֶבֶד അടിമത്തത്തെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല; ദാവീദിന്റെ സേവനത്തിലുള്ള അനുചരന്മാരെയോ സൈനികരെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭൃത്യന്മാർ’ ഔപചാരികതയും അർത്ഥസാമീപ്യവും നിലനിർത്തുന്നു.
- source_word: מֵהַגְּדוּד
  choice: ഒരു കൊള്ളയടിക്കൽ കഴിഞ്ഞ്
  rationale: גְּדוּד എന്നതിന് സൈനികസംഘം എന്നും ആക്രമണയാത്ര എന്നും അർത്ഥമാകാം. പിന്നാലെ കൊള്ളമുതൽ പറയുന്നതിനാൽ ഇവിടെ ആക്രമണപ്രവർത്തനമാണ് സന്ദർഭത്തിൽ കൂടുതൽ സ്വാഭാവികം; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְשָׁלָל רָב עִמָּם הֵבִיאוּ
  choice: അവർ ധാരാളം കൊള്ളമുതൽ കൂടെ കൊണ്ടുവന്നു
  rationale: שָׁלָל എന്ന സൈനികപദത്തിന് വ്യക്തമായ ആധുനിക മലയാളമായി ‘കൊള്ളമുതൽ’ ഉപയോഗിച്ചു; רָב എന്നതിനെ ‘ധാരാളം’ എന്നു നേരിട്ട് പ്രതിഫലിപ്പിച്ചു.
- source_word: וְאַבְנֵר אֵינֶנּוּ עִם דָּוִד בְּחֶבְרוֹן
  choice: എന്നാൽ അബ്നേർ ദാവീദിനോടൊപ്പം ഹെബ്രോനിൽ ഉണ്ടായിരുന്നില്ല
  rationale: യോവാബിന്റെ വരവും അബ്നേരിന്റെ അഭാവവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കാൻ וְ എന്നത് ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: כִּי שִׁלְּחוֹ
  choice: കാരണം ദാവീദ് അവനെ പറഞ്ഞയച്ചിരുന്നു
  rationale: എബ്രായത്തിൽ കർത്താവ് സർവനാമരൂപത്തിൽ സൂചിതമാണെങ്കിലും സന്ദർഭത്തിൽ അത് ദാവീദാണ്; മലയാളത്തിലെ അനാവശ്യ സർവനാമാശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് വ്യക്തമാക്കി. മുൻപ് നടന്ന പ്രവൃത്തിയെ ‘പറഞ്ഞയച്ചിരുന്നു’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: അവൻ സമാധാനത്തോടെ പോയിരുന്നു
  rationale: ശത്രുതയോ അപകടമോ കൂടാതെ നല്ല ബന്ധത്തിൽ യാത്രതിരിച്ചതിനെ സൂചിപ്പിക്കുന്ന ‘സമാധാനത്തോടെ പോകുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും സൂചനയും നിലനിർത്തുന്നു.
