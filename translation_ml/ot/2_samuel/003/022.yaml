  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്നത് ഹീബ്രു അവതരണപദത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ‘ഭൃത്യന്മാർ’, ‘കൊള്ളമുതൽ’ തുടങ്ങിയ പദങ്ങൾ ചരിത്ര-സൈനിക സന്ദർഭത്തിന് അനുയോജ്യമായ ഔപചാരികത നൽകുന്നു. സ്രോതസ്സിലെ അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
