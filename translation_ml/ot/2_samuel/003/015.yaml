  text: וַ/יִּשְׁלַח֙ אִ֣ישׁ בֹּ֔שֶׁת וַ/יִּקָּחֶ֖/הָ מֵ֣/עִֽם אִ֑ישׁ מֵ/עִ֖ם פַּלְטִיאֵ֥ל בֶּן לוש־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/015.yaml
  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
translation:
  language: ml
  text: അപ്പോൾ ഈശ്-ബോശെത്ത് അയച്ചു; അവളുടെ ഭർത്താവായ ലയീശിന്റെ മകൻ പൽതീയേലിന്റെ അടുക്കൽനിന്ന് അവളെ എടുത്തു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “ഒരു പുരുഷന്റെ അടുക്കൽനിന്ന്, ലയീശിന്റെ മകൻ പൽതീയേലിന്റെ അടുക്കൽനിന്ന്.” സന്ദർഭം വ്യക്തമാക്കാൻ “പുരുഷൻ” എന്നത് പ്രധാനപാഠത്തിൽ “അവളുടെ ഭർത്താവ്” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ബന്ധപ്പെട്ട മറ്റൊരു വാക്യത്തിൽ ഈ പേരിന്റെ ഹ്രസ്വരൂപമായ “പൽതി” കാണുന്നു; ഇവിടെ എബ്രായപാഠത്തിലുള്ള രൂപം “പൽതീയേൽ” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ച്
  rationale: ശָׁלַח എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം ‘അയച്ചു’ എന്നാണ്; ആരെയാണ് അയച്ചതെന്ന് മൂലപാഠം വ്യക്തമാക്കുന്നില്ല. മലയാളത്തിൽ ഈ സന്ദർഭത്തിലെ ദൗത്യാർഥം സ്വാഭാവികമായി അറിയിക്കാൻ ‘ആളയച്ച്’ ഉപയോഗിച്ചു.
- source_word: אִישׁ בֹּשֶׁת
  choice: ഈശ്-ബോശെത്ത്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיִּקָּחֶהָ
  choice: അവളെ ... കൊണ്ടുവന്നു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുത്തു/കൊണ്ടുപോയി’ എന്നതാണ്. അയച്ചയാളുടെ ദൃഷ്ടികോണത്തിൽ ആളുകൾ അവളെ കൊണ്ടുവന്നുവെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ബലപ്രയോഗം സൂചിപ്പിക്കുന്ന പദം ചേർത്തിട്ടില്ല.
- source_word: מֵעִם אִישׁ
  choice: അവളുടെ ഭർത്താവിന്റെ അടുക്കൽനിന്ന്
  rationale: אִישׁ അക്ഷരാർഥത്തിൽ ‘പുരുഷൻ’ എന്നാണെങ്കിലും ഇവിടെ മീഖലിനോടുള്ള വിവാഹബന്ധത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഭർത്താവ്’ എന്ന് വ്യക്തമാക്കുന്നത് സന്ദർഭാനുസൃതവും സ്വാഭാവികവുമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: פַּלְטִיאֵל
  choice: പൽതീയേൽ
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് പാഠത്തിലുള്ള പേരിന്റെ രൂപം നേരിട്ട് മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു.
- source_word: בֶּן לוש
  choice: ലയീശിന്റെ മകൻ
  rationale: בֶּן എന്ന ബന്ധപദം സ്വാഭാവിക മലയാളത്തിൽ ‘മകൻ’ എന്നു നൽകി; לוש എന്ന പേര് ബൈബിൾപരമ്പരയിലെ ലയീശ് എന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
