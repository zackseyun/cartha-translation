    issue: ‘ആളയച്ച്’ adds ‘people/agents’ as the object of ‘sent.’
    rationale: The Hebrew says only that Ish-bosheth ‘sent’; it does not state whom he sent. Agents may be inferred from context, but should not be placed in the main text under an optimal-equivalence approach.
  - severity: medium
    issue: ‘കൊണ്ടുവന്നു’ adds ‘brought [her]’ toward an implied destination.
    rationale: The Hebrew simply says ‘took her’ from Paltiel. It does not specify a destination or use a verb meaning ‘bring.’ ‘എടുത്തു’ preserves the stated act without that added perspective.
