translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തിച്ച מֵעִם ഘടന മലയാളത്തിൽ ഒരൊറ്റ ബന്ധപ്രയോഗമായി സ്വാഭാവികമാക്കി; അതിന്റെ അക്ഷരാർഥഘടന അടിക്കുറിപ്പിൽ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
