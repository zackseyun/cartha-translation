source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ט֔וֹב אֲנִ֕י אֶכְרֹ֥ת אִתְּ/ךָ֖ בְּרִ֑ית אַ֣ךְ דָּבָ֣ר אֶחָ֡ד אָנֹכִי֩ שֹׁאֵ֨ל מֵ/אִתְּ/ךָ֤ לֵ/אמֹר֙ לֹא תִרְאֶ֣ה אֶת פָּנַ֔/י כִּ֣י אִם לִ/פְנֵ֣י הֱבִיאֲ/ךָ֗ אֵ֚ת מִיכַ֣ל בַּת שָׁא֔וּל בְּ/בֹאֲ/ךָ֖ לִ/רְא֥וֹת אֶת פָּנָֽ/י־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ശരി, ഞാൻ നിന്നോടു ഉടമ്പടി ചെയ്യും. എന്നാൽ ഒരു കാര്യം മാത്രം ഞാൻ നിന്നോട് ആവശ്യപ്പെടുന്നു: നീ എന്നെ കാണാൻ വരുമ്പോൾ ശൗലിന്റെ മകളായ മീഖളിനെ ആദ്യം കൊണ്ടുവരാതെ എന്റെ മുഖം കാണുകയില്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നീ എന്നെ കാണാൻ വരുമ്പോൾ ശൗലിന്റെ മകളായ മീഖളിനെ ആദ്യം കൊണ്ടുവരാതെ എന്റെ മുമ്പാകെ പ്രത്യക്ഷപ്പെടരുത്.” എബ്രായഭാഷയിൽ അക്ഷരാർഥം “എന്റെ മുഖം കാണുക” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: ശരി
  rationale: അബ്നേറിന്റെ നിർദേശത്തോടുള്ള ഹ്രസ്വമായ സമ്മതമാണ് ഇവിടെ; ആധുനിക മലയാളത്തിൽ ‘ശരി’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: אֶכְרֹת ... בְּרִית
  choice: ഞാൻ നിന്നോടു ഉടമ്പടി ചെയ്യും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിക്കും’ എന്ന എബ്രായ പ്രയോഗം; മലയാളത്തിൽ ഔപചാരികമായ ഉടമ്പടിയുടെ അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക രൂപം.
- source_word: אַךְ דָּבָר אֶחָד אָנֹכִי שֹׁאֵל מֵאִתְּךָ
  choice: എന്നാൽ ഒരു കാര്യം മാത്രം ഞാൻ നിന്നോട് ആവശ്യപ്പെടുന്നു
  rationale: אַךְ എന്നതിന്റെ നിയന്ത്രണസ്വഭാവവും ദാവീദ് വെക്കുന്ന ഏക നിബന്ധനയും വ്യക്തമാക്കുന്നു; שֹׁאֵל എന്നത് അതിരുകടന്ന് കല്പനയായി മാറ്റാതെ സന്ദർഭത്തിലെ ഗൗരവം സൂചിപ്പിക്കുന്നു.
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  choice: എന്റെ മുഖം കാണുകയില്ല
  rationale: ‘എന്റെ മുഖം കാണുക’ എന്ന ആവർത്തിത എബ്രായ പ്രയോഗം നിലനിർത്തി, വ്യക്തിപരമായ കൂടിക്കാഴ്ചയുടെയും രാജസന്നിധിയുടെയും സാധ്യത തുറന്നുവെക്കുന്നു.
- source_word: כִּי אִם לִפְנֵי הֱבִיאֲךָ
  choice: ആദ്യം കൊണ്ടുവരാതെ
  rationale: മീഖളിനെ കൊണ്ടുവരുന്നത് കൂടിക്കാഴ്ചയ്ക്കു മുമ്പുള്ള നിർബന്ധമായ വ്യവസ്ഥയാണെന്ന exceptive-conditional അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: ശൗലിന്റെ മകളായ മീഖൾ
  rationale: പേരും ബന്ധവും വ്യക്തമായി തിരിച്ചറിയിക്കുന്ന സ്വാഭാവിക മലയാള പദക്രമം.
- source_word: בְּבֹאֲךָ לִרְאוֹת אֶת פָּנָי
  choice: നീ എന്നെ കാണാൻ വരുമ്പോൾ
  rationale: വാക്യാവസാനത്തിലെ ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ഇവിടെ ആശയം സ്വാഭാവികമായി നൽകുന്നു; മുൻഭാഗത്ത് ‘എന്റെ മുഖം’ എന്ന മൂലപ്രയോഗം സംരക്ഷിച്ചിട്ടുണ്ട്.
theological_decisions:
- issue: ‘എന്റെ മുഖം കാണുക’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ അക്ഷരരൂപമായ ‘എന്റെ മുഖം കാണുക’ നിലനിർത്തി
  alternative: ‘എന്റെ സന്നിധിയിൽ വരുക’ / ‘എന്റെ മുമ്പാകെ പ്രത്യക്ഷപ്പെടുക’
  rationale: ഇത് നേരിൽ കാണുന്നതെയോ രാജസന്നിധിയിൽ ഹാജരാകുന്നതെയോ സൂചിപ്പിക്കാം. മൂലഭാഷയിലെ അർഥവ്യാപ്തി ചുരുക്കാതെ വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘ഉടമ്പടി’ എന്ന ഔപചാരിക പദം സംരക്ഷിച്ചു; ആവർത്തിത എബ്രായ മുഖപ്രയോഗം പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും രേഖപ്പെടുത്തി.
