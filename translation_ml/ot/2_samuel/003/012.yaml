source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ אַבְנֵ֨ר מַלְאָכִ֧ים אֶל דָּוִ֛ד תחת/ו לֵ/אמֹ֖ר לְ/מִי אָ֑רֶץ לֵ/אמֹ֗ר כָּרְתָ֤/ה בְרִֽיתְ/ךָ֙ אִתִּ֔/י וְ/הִנֵּה֙ יָדִ֣/י עִמָּ֔/ךְ לְ/הָסֵ֥ב אֵלֶ֖י/ךָ אֶת כָּל יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
translation:
  language: ml
  text: 'അബ്നേർ തന്റെ പേരിൽ[a] ദാവീദിന്റെ അടുക്കൽ ദൂതന്മാരെ അയച്ച് ഇങ്ങനെ പറയിച്ചു: “ദേശം ആർക്കുള്ളതാണ്? എന്നോടു നിന്റെ ഉടമ്പടി ചെയ്യുക; ഇതാ, ഇസ്രായേൽ മുഴുവനെയും നിന്റെ പക്ഷത്തേക്കു തിരിക്കാൻ എന്റെ കൈ നിനക്കൊപ്പമുണ്ട്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ സ്ഥാനത്ത്.” എബ്രായപ്രയോഗം ഹ്രസ്വമാണ്; അബ്നേർ സ്വന്തം പ്രതിനിധികളായി ദൂതന്മാരെ അയച്ചുവെന്ന അർഥമാണ് സന്ദർഭത്തിൽ സാധ്യതയേറിയത്.
    reason: alternative_reading
  - marker: b
    text: എബ്രായം അക്ഷരാർഥത്തിൽ, “എന്റെ കൈ നിനക്കൊപ്പമുണ്ട്.” പിന്തുണയും പ്രവർത്തനശക്തിയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תחתו
  choice: തനിക്കുവേണ്ടി
  rationale: ഈ സന്ദർഭത്തിൽ പ്രതിനിധാനം/സ്വന്തം പേരിലുള്ള പ്രവർത്തനം സൂചിപ്പിക്കുന്നു; ‘തനിക്കുവേണ്ടി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: לְמִי אָרֶץ
  choice: ദേശം ആർക്കുള്ളതാണ്?
  rationale: ദേശത്തിന്റെ അവകാശമോ ഭരണാധികാരമോ സംബന്ധിച്ച എബ്രായത്തിലെ ഹ്രസ്വവും അർഥസാന്ദ്രവുമായ ചോദ്യം വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  choice: നിന്റെ ഉടമ്പടി എന്നോടു ചെയ്യുക
  rationale: כרת ברית എന്നത് ഉടമ്പടി ചെയ്യുക എന്ന സ്ഥിരപ്രയോഗമാണ്; നാമത്തിലെ രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം ‘നിന്റെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  choice: ഇതാ, എന്റെ കൈ നിനക്കൊപ്പമുണ്ടാകും
  rationale: പിന്തുണയും അധികാരശക്തിയും സൂചിപ്പിക്കുന്ന ‘കൈ’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു; തുടർന്നുള്ള ഉദ്ദേശ്യപ്രയോഗത്തോട് ചേർന്ന് മലയാളത്തിൽ ഭാവികാലം സ്വാഭാവികമാണ്.
- source_word: לְהָסֵב אֵלֶיךָ
  choice: നിന്റെ പക്ഷത്തേക്കു തിരിക്കാൻ
  rationale: രാഷ്ട്രീയ വിധേയത്വം ദാവീദിന്റെ പക്ഷത്തേക്കു മാറ്റുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനെയും
  rationale: ദേശീയ സമൂഹത്തിന്റെ സമഗ്രത സൂചിപ്പിക്കുന്ന പ്രയോഗം.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഇവിടെ സ്വർഗീയ ദൂതന്മാരല്ല, മനുഷ്യസന്ദേശവാഹകരാണ്; മലയാളത്തിൽ സന്ദർഭം അത് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: לְמִי אָרֶץ എന്ന അബ്നേരിന്റെ വാചാടോപപരമായ ചോദ്യത്തിന്റെ വ്യാഖ്യാനം
  choice: “ദേശം ആർക്കുള്ളതാണ്?” എന്ന നേരിട്ടുള്ള ചോദ്യമായി നിലനിർത്തി.
  alternative: “ദേശം എന്റെ അധീനതയിലാണ്” എന്ന അവകാശവാദമായോ “ദേശം ആര് ഭരിക്കണം?” എന്ന വിശദീകരണമായോ നൽകാം.
  rationale: എബ്രായം ഹ്രസ്വവും അല്പം ദ്വയാർഥമുള്ളതുമാണ്. നേരിട്ടുള്ള ചോദ്യം അബ്നേർ ഉദ്ദേശിച്ച രാഷ്ട്രീയ അവകാശവാദത്തിന്റെ കൃത്യസ്വഭാവം തീർപ്പാക്കാതെ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള לֵאמֹר മലയാളത്തിൽ ‘ഇങ്ങനെ പറഞ്ഞു … പിന്നെ അവൻ പറഞ്ഞു’ എന്നു ദൃശ്യമായി നിലനിർത്തി; അസ്വാഭാവികമായ യാന്ത്രിക ആവർത്തനം ഒഴിവാക്കി. രാഷ്ട്രീയവും ദൈവശാസ്ത്രപരവുമായ ദ്വയാർഥം വിശദീകരിച്ച് തീർപ്പാക്കിയിട്ടില്ല.
