reference: 2 Samuel 3:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יָחֻ֨לוּ֙ עַל רֹ֣אשׁ יוֹאָ֔ב וְ/אֶ֖ל כָּל בֵּ֣ית אָבִ֑י/ו וְֽ/אַל יִכָּרֵ֣ת מִ/בֵּ֣ית יוֹאָ֡ב זָ֠ב וּ/מְצֹרָ֞ע וּ/מַחֲזִ֥יק בַּ/פֶּ֛לֶךְ וְ/נֹפֵ֥ל בַּ/חֶ֖רֶב וַ/חֲסַר לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
translation:
  language: ml
  text: അത് യോവാബിന്റെ തലയിന്മേലും അവന്റെ പിതാവിന്റെ കുടുംബത്തിന്മേലും പതിക്കട്ടെ. യോവാബിന്റെ ഭവനത്തിൽനിന്ന് സ്രവരോഗമുള്ളവനോ, ഗുരുതരമായ ചർമരോഗമുള്ളവനോ[a], നൂൽനൂൽപ്പുകോൽ പിടിക്കുന്നവനോ[b], വാളാൽ വീഴുന്നവനോ, അപ്പത്തിന് വകയില്ലാത്തവനോ ഒരിക്കലും ഇല്ലാതാകാതിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അശുദ്ധനാക്കുന്ന ചർമരോഗമുള്ളവൻ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം ആധുനിക അർഥത്തിലുള്ള കുഷ്ഠരോഗം മാത്രമല്ല, പലതരം ഗുരുതരമായ ചർമരോഗങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഊന്നുവടി പിടിക്കുന്നവൻ.” ഹീബ്രുപദം സാധാരണയായി നൂൽനൂൽപ്പുകോലിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ചിലർ ഈ പ്രയോഗത്തെ വടിയിൽ ഊന്നിനിൽക്കുന്നവൻ എന്നർഥത്തിൽ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֻלוּ עַל רֹאשׁ
  choice: തലയിന്മേൽ പതിക്കട്ടെ
  rationale: മുൻവാക്യത്തിലെ രക്തപാതകക്കുറ്റമോ അതിന്റെ ശിക്ഷയോ യോവാബിന്മേൽ വരട്ടെയെന്ന ശാപാശംസയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘തലയിന്മേൽ പതിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപവും അർഥവും നിലനിർത്തുന്നു.
- source_word: כָּל בֵּית אָבִיו
  choice: അവന്റെ പിതൃഭവനം മുഴുവൻ
  rationale: വ്യക്തിയുടെ പിതൃവംശത്തെയും കുടുംബഗൃഹത്തെയും ഉൾക്കൊള്ളുന്ന ഹീബ്രു ആശയം സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: אַל יִכָּרֵת מִבֵּית יוֹאָב
  choice: യോവാബിന്റെ ഭവനത്തിൽനിന്ന് ... ഒരിക്കലും ഇല്ലാതിരിക്കരുത്
  rationale: ഇത്തരം ദുരിതബാധിതർ യോവാബിന്റെ കുടുംബത്തിൽ തുടർന്നും ഉണ്ടായിരിക്കട്ടെ എന്ന നിഷേധാത്മക ശാപസൂത്രത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: זָב
  choice: സ്രവരോഗമുള്ളവൻ
  rationale: ശരീരത്തിൽനിന്നുള്ള ദീർഘകാല സ്രവം മൂലം ആചാരപരമായി അശുദ്ധനായിരുന്ന ഒരാളെ സൂചിപ്പിക്കുന്ന പദമാണ്; അനാവശ്യമായ വൈദ്യനിർണയം ഒഴിവാക്കുന്നു.
- source_word: מְצֹרָע
  choice: ഗുരുതരമായ ചർമരോഗമുള്ളവൻ
  rationale: ആധുനിക കുഷ്ഠരോഗത്തിൽ മാത്രം ഒതുങ്ങാത്ത വിശാലമായ ഹീബ്രു പദപരിധി പകരുന്നു.
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  choice: നൂൽനൂൽപ്പുകോൽ പിടിക്കുന്നവൻ
  rationale: פֶּלֶךְ എന്നതിന് സാധാരണയായ ‘spindle/distaff’ എന്ന മൂർത്തചിത്രം നിലനിർത്തുന്നു; ‘ഊന്നുവടി’ എന്ന പാഠവ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: נֹפֵל בַּחֶרֶב
  choice: വാളാൽ വീഴുന്നവൻ
  rationale: വാളാൽ കൊല്ലപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയും ശാപപ്പട്ടികയുടെ ഗൗരവമുള്ള താളവും സംരക്ഷിക്കുന്നു.
- source_word: חֲסַר לָחֶם
  choice: അപ്പത്തിന് വകയില്ലാത്തവൻ
  rationale: ഉപജീവനക്കുറവിനെ സൂചിപ്പിക്കുന്ന ‘അപ്പം’ എന്ന ഹീബ്രു പ്രതീകം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളം നൽകുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ പ്രസ്താവനയുടെ സ്വഭാവം
  choice: യോവാബിന്റെ കുടുംബത്തിനെതിരായ ന്യായവിധിക്കായുള്ള ശാപാശംസ
  alternative: ഭാവിയിൽ സംഭവിക്കാനുള്ള കാര്യത്തിന്റെ പ്രവചനം
  rationale: ‘പതിക്കട്ടെ’, ‘ഇല്ലാതിരിക്കരുത്’ എന്നീ ആശംസാർഥക രൂപങ്ങൾ വെറും പ്രവചനത്തേക്കാൾ ന്യായവിധി വരണമെന്ന ശാപാശംസയെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ശാപവാക്യത്തിന്റെ ഭാവം നിലനിർത്തി. കുടുംബവംശം, രോഗാവസ്ഥകൾ, വാൾ, അപ്പം എന്നീ ഹീബ്രു ചിത്രങ്ങൾ പരമാവധി സംരക്ഷിച്ചു; വിവാദമായ פֶּלֶךְ എന്ന പദത്തിന്റെ പ്രധാന സാധ്യത മുഖ്യവാചകത്തിലും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിലും നൽകി.
