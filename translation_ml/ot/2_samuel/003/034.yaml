id: 2SA.3.34
reference: 2 Samuel 3:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יָדֶ֣/ךָ לֹֽא אֲסֻר֗וֹת וְ/רַגְלֶ֨י/ךָ֙ לֹא לִ/נְחֻשְׁתַּ֣יִם הֻגָּ֔שׁוּ כִּ/נְפ֛וֹל לִ/פְנֵ֥י בְנֵֽי עַוְלָ֖ה נָפָ֑לְתָּ וַ/יֹּסִ֥פוּ כָל הָ/עָ֖ם לִ/בְכּ֥וֹת עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
translation:
  language: ml
  text: '“നിന്റെ കൈകൾ ബന്ധിക്കപ്പെട്ടിരുന്നില്ല;

    നിന്റെ കാലുകൾ വെങ്കലവിലങ്ങുകളിൽ വെക്കപ്പെട്ടിരുന്നില്ല.

    അനീതിയുടെ മക്കളുടെ മുമ്പിൽ[a] ഒരാൾ വീഴുന്നതുപോലെ

    നീ വീണല്ലോ!”


    അപ്പോൾ ജനമെല്ലാം അവനെച്ചൊല്ലി കൂടുതൽ കരഞ്ഞു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: ‘ദുഷ്ടന്മാരുടെ മുമ്പിൽ’ അല്ലെങ്കിൽ ‘അക്രമികളുടെ മുമ്പിൽ.’ എബ്രായയിൽ അക്ഷരാർഥം ‘അനീതിയുടെ മക്കളുടെ മുമ്പിൽ’ എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘ജനമെല്ലാം അവനെച്ചൊല്ലി കരഞ്ഞുകൊണ്ടിരുന്നു.’'
    reason: source_ambiguity
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  choice: നിന്റെ കൈകൾ ബന്ധിക്കപ്പെട്ടിരുന്നില്ല
  rationale: നിഷ്ക്രിയരൂപത്തിലുള്ള אָסַר കൈകൾ കെട്ടപ്പെട്ടതോ ബന്ധിക്കപ്പെട്ടതോ ആയ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ബന്ധിക്കപ്പെട്ടിരുന്നില്ല’ തടവുകാരനുമായുള്ള പരോക്ഷവൈരുധ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  choice: നിന്റെ കാലുകൾ വെങ്കലവിലങ്ങുകളിൽ വെക്കപ്പെട്ടിരുന്നില്ല
  rationale: נְחֻשְׁתַּיִם വെങ്കലംകൊണ്ടുള്ള കാലുവിലങ്ങുകളെ സൂചിപ്പിക്കുന്നു. הֻגָּשׁוּ അക്ഷരാർഥത്തിൽ ‘അടുപ്പിക്കപ്പെട്ടു/കൊണ്ടുവരപ്പെട്ടു’ എന്നാണെങ്കിലും ഇവിടെ വിലങ്ങുകളിൽ ഇടപ്പെടുക എന്ന പ്രയോഗാർഥമാണ്.
- source_word: כִּנְפוֹל
  choice: ഒരാൾ വീഴുന്നതുപോലെ
  rationale: כְּ ചേർന്ന infinitive construct ഒരു താരതമ്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ പൊതുവായ കർത്താവായി ‘ഒരാൾ’ ചേർക്കുന്നത് അർഥം വ്യക്തമാക്കുകയും താരതമ്യത്തിന്റെ സ്വഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לִפְנֵי בְנֵי עַוְלָה
  choice: അനീതിയുടെ മക്കളുടെ മുമ്പിൽ
  rationale: എബ്രായയിലെ ‘അനീതിയുടെ മക്കൾ’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ സ്വാഭാവിക മലയാള അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: נָפָלְתָּ
  choice: നീ വീണല്ലോ
  rationale: പൂർത്തിയായ ദാരുണസംഭവത്തെ വിലാപസ്വരത്തിൽ അഭിസംബോധന ചെയ്യുന്നു. ‘വീണല്ലോ’ ആ വിലാപഭാവവും നേരിട്ടുള്ള സംബോധനയും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  choice: അപ്പോൾ ജനമെല്ലാം അവനെച്ചൊല്ലി കൂടുതൽ കരഞ്ഞു
  rationale: יָסַף + infinitive ഒരു പ്രവൃത്തി തുടരുന്നതിനെയോ അതിന്റെ വർധനയെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ വിലാപത്തിനുശേഷമുള്ള കരച്ചിലിന്റെ തീവ്രതയായി ‘കൂടുതൽ കരഞ്ഞു’ സ്വീകരിച്ചു; ‘കരഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
