  terminology: “വെങ്കലവിലങ്ങുകൾ” faithfully represents bronze fetters. “അനീതിയുടെ മക്കൾ” is deliberately literal and the anchored note supplies idiomatic Malayalam alternatives; this is appropriate for an optimal-equivalence text. No theological terminology is at issue.
