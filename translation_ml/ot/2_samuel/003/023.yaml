id: 2SA.3.23
reference: 2 Samuel 3:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יוֹאָ֛ב וְ/כָל הַ/צָּבָ֥א אֲשֶׁר אִתּ֖/וֹ בָּ֑אוּ וַ/יַּגִּ֤דוּ לְ/יוֹאָב֙ לֵ/אמֹ֔ר בָּֽא אַבְנֵ֤ר בֶּן נֵר֙ אֶל הַ/מֶּ֔לֶךְ וַֽ/יְשַׁלְּחֵ֖/הוּ וַ/יֵּ֥לֶךְ בְּ/שָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: ml
  text: 'യോവാബും അവനോടുകൂടെ ഉണ്ടായിരുന്ന സൈന്യമെല്ലാം എത്തിയപ്പോൾ, അവർ യോവാബിനോടു അറിയിച്ചു: “നേരിന്റെ മകൻ അബ്നേർ രാജാവിന്റെ അടുക്കൽ വന്നു; രാജാവ് അവനെ അയച്ചുവിട്ടു, അവൻ സമാധാനത്തോടെ പോയി.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ
  choice: മടങ്ങിവന്നപ്പോൾ
  rationale: സന്ദർഭത്തിൽ യോവാബും സൈന്യവും സൈനികനടപടിയിൽനിന്നു തിരിച്ചെത്തുന്നതാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി കാലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: הַצָּבָא
  choice: സൈന്യം
  rationale: ഇവിടെ യോവാബിനോടൊപ്പമുള്ള സൈനികസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיַּגִּדוּ
  choice: ആളുകൾ ... പറഞ്ഞു
  rationale: ഹീബ്രൂ ക്രിയയുടെ നിർദ്ദിഷ്ടമല്ലാത്ത ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; അവർ ആരെന്നു അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: രാജാവ് അവനെ യാത്രയാക്കി
  rationale: സർവനാമകർത്താവ് സമീപമുള്ള ‘രാജാവിനെ’ സൂചിപ്പിക്കുന്നതായി ഭാഷാപരമായി വ്യക്തമാക്കുന്നു; അയച്ചുവിടുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּשָׁלוֹם
  choice: സമാധാനത്തോടെ
  rationale: അബ്നേർ സുരക്ഷിതമായും സൗഹൃദപരമായും വിട്ടുപോയെന്ന ആശയം നൽകുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ തർജമ.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രൂവിലെ ആവർത്തനപരമായ ‘പറഞ്ഞുകൊണ്ട്’ മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ നേരിട്ടുള്ള ഉദ്ധരണിയായി മാറ്റി. പേരുകൾ ‘യോവാബ്’, ‘അബ്നേർ’, ‘നേർ’ എന്ന സാധാരണ മലയാള ബൈബിൾ രൂപങ്ങളിൽ നൽകി.
