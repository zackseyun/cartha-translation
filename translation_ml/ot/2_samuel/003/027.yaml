  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
translation:
  language: ml
  text: അബ്നേർ ഹെബ്രോനിലേക്കു മടങ്ങിവന്നപ്പോൾ, യോവാബ് അവനോടു സ്വകാര്യമായി സംസാരിക്കാനായി അവനെ കവാടത്തിന്റെ നടുവിലേക്കു മാറ്റിക്കൊണ്ടുപോയി; അവിടെവെച്ച് അവന്റെ വയറ്റിൽ[a] പ്രഹരിച്ചു. അങ്ങനെ അവൻ മരിച്ചു; യോവാബിന്റെ സഹോദരനായ അസാഹേലിന്റെ രക്തം നിമിത്തം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗത വിവർത്തനം: “അഞ്ചാമത്തെ വാരിയെല്ലിൽ.” ഇത് വയർ അഥവാ ഉദരഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ പ്രയോഗമായി മനസ്സിലാക്കപ്പെടുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിവന്നപ്പോൾ
  rationale: שׁוב എന്ന ക്രിയ സന്ദർഭത്തിൽ അബ്നേർ അയയ്ക്കപ്പെട്ടശേഷം ഹെബ്രോനിലേക്കു തിരിച്ചെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּטֵּהוּ
  choice: അവനെ ... മാറ്റിക്കൊണ്ടുപോയി
  rationale: נטה എന്നതിന്റെ ഹിഫീൽ രൂപം ഒരാളെ വഴിയിൽനിന്നു മാറ്റുകയോ വശത്തേക്കു കൊണ്ടുപോകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ യോവാബ് അബ്നേരിനെ കവാടത്തിനകത്തേക്കു മാറ്റുന്നു.
- source_word: אֶל־תּוֹךְ הַשַּׁעַר
  choice: കവാടത്തിന്റെ അകത്തേക്ക്
  rationale: תוך അകം/ഉൾഭാഗം എന്നും שער കവാടമോ കവാടപ്രദേശമോ എന്നും അർഥമാക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി സ്ഥലചലനം വ്യക്തമാക്കുന്ന പ്രയോഗമാണിത്.
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  choice: സ്വകാര്യമായി സംസാരിക്കാനായി
  rationale: בשלי ദുഷ്കരമായ പദമാണ്; ശാന്തമായോ സ്വകാര്യമാക്കിയോ ഉള്ള സംഭാഷണം എന്ന സാധ്യത നിലനിൽക്കുന്നു. സന്ദർഭത്തിൽ ‘സ്വകാര്യമായി’ സ്വാഭാവികമാണ്, എന്നാൽ രഹസ്യമായ ഉദ്ദേശ്യം വാചകത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  choice: അവിടെവെച്ച് അവന്റെ വയറ്റിൽ പ്രഹരിച്ചു
  rationale: חֹמֶשׁ മരണകരമായ പ്രഹാരങ്ങളുടെ ഈ വിവരണങ്ങളിൽ ഉദരഭാഗത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം. ‘വയറ്റിൽ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; പരമ്പരാഗത അക്ഷരാർഥസദൃശ വിവർത്തനം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു. ആയുധം മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ‘കുത്തി’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: וַיָּמָת
  choice: അങ്ങനെ അവൻ മരിച്ചു
  rationale: തുടർന്നുള്ള മരണം പ്രഹാരത്തിന്റെ ഫലമാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּדַם עֲשָׂהאֵל אָחִיו
  choice: ഇത് യോവാബിന്റെ സഹോദരനായ അസാഹേലിന്റെ രക്തം നിമിത്തമായിരുന്നു
  rationale: ב ഇവിടെ കാരണം അല്ലെങ്കിൽ പ്രതികാരപ്രേരണ സൂചിപ്പിക്കുന്നു. ‘രക്തം നിമിത്തം’ നിയമപരവും പ്രതികാരപരവുമായ സൂചന നിലനിർത്തുന്നു; ‘പ്രതികാരം ചെയ്യാൻ’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല. മലയാളത്തിൽ ഉടമസ്ഥതയിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സഹോദരൻ യോവാബിന്റേതാണെന്ന് വ്യക്തമാക്കുന്നു.
