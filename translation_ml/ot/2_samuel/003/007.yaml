  text: וּ/לְ/שָׁא֣וּל פִּלֶ֔גֶשׁ וּ/שְׁמָ֖/הּ רִצְפָּ֣ה בַת אַיָּ֑ה וַ/יֹּ֨אמֶר֙ אֶל אַבְנֵ֔ר מַדּ֥וּעַ בָּ֖אתָה אֶל פִּילֶ֥גֶשׁ אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
translation:
  language: ml
  text: ശൗലിന് രിസ്പാ എന്നു പേരുള്ള ഒരു ഉപപത്നി ഉണ്ടായിരുന്നു; അവൾ അയ്യാവിന്റെ മകളായിരുന്നു. ഇശ്‌ബോശെത്ത് അബ്നേരിനോട്, “നീ എന്തിനാണ് എന്റെ അപ്പന്റെ ഉപപത്നിയുടെ അടുക്കൽ ചെന്നത്[a]?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “നീ എന്തിനാണ് എന്റെ അപ്പന്റെ ഉപപത്നിയുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടത്?” ഹീബ്രുവിൽ “അടുക്കൽ ചെല്ലുക” എന്നത് ലൈംഗിക സൂചനയുള്ള ഒരു സാധാരണ പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשָׁאוּל
  choice: ശൗലിന് … ഉണ്ടായിരുന്നു
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ഉടമസ്ഥതാസംബന്ധമായ അസ്തിത്വവാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ശൗലിന് … ഉണ്ടായിരുന്നു’ എന്നു നൽകി; മൂലത്തിൽ വ്യക്തമായ കാലസൂചകമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തില്ല.
- source_word: פִּלֶגֶשׁ / פִּילֶגֶשׁ
  choice: ഉപപത്നി
  rationale: പുരാതന സാമൂഹിക-നിയമപരമായ പ്രത്യേക പദവിയെ സൂചിപ്പിക്കുന്ന മാന്യവും സംക്ഷിപ്തവുമായ പദം; ‘വെപ്പാട്ടി’ എന്നതിലുണ്ടാകാവുന്ന അധിക അവഹേളനഭാവം ഒഴിവാക്കുന്നു.
- source_word: וּשְׁמָהּ רִצְפָּה בַת אַיָּה
  choice: രിസ്പാ എന്നു പേരുള്ള …; അവൾ അയ്യാവിന്റെ മകളായിരുന്നു
  rationale: പേരും പിതൃപരിചയവും വ്യക്തവും സ്വാഭാവികവുമായി മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיֹּאמֶר
  choice: ഇശ്‌ബോശെത്ത് … ചോദിച്ചു
  rationale: ഹീബ്രുവിൽ കർത്താവ് സർവനാമമായി ഉൾക്കൊള്ളപ്പെട്ടിട്ടുണ്ടെങ്കിലും മുൻസന്ദർഭം സംസാരിക്കുന്നത് ഇശ്‌ബോശെത്താണെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് വ്യക്തമാക്കി. ചോദ്യം അവതരിപ്പിക്കുന്നതിനാൽ ‘ചോദിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: בָּאתָה אֶל
  choice: അടുക്കൽ ചെന്നത്
  rationale: בוא + אֶל എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ചലനരൂപവും ലൈംഗിക സദൃശോക്തിയും നിലനിർത്തുന്നു; അർഥം മുഖ്യവാചകത്തിൽ തുറന്നുപറഞ്ഞ് ചുരുക്കുന്നില്ല.
- source_word: פִּילֶגֶשׁ אָבִי
  choice: എന്റെ അപ്പന്റെ ഉപപത്നി
  rationale: ഹീബ്രു ഉടമസ്ഥബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; നേരിട്ടുള്ള സംഭാഷണത്തിന് ‘അപ്പൻ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: രാജാവിന്റെ ഉപപത്നിയുടെ അടുക്കൽ ചെല്ലുന്നതിന്റെ രാഷ്ട്രീയമോ ലൈംഗികമോ ആയ സൂചന
  choice: വാക്യം ആരോപണത്തിന്റെ ലൈംഗിക സദൃശോക്തി മാത്രം നിലനിർത്തുന്നു; രാഷ്ട്രീയ ഉദ്ദേശ്യം ചേർക്കുന്നില്ല
  alternative: അധികാരാവകാശവാദമെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക
  rationale: ഈ വാക്യം പ്രവൃത്തിയെ ചോദ്യം ചെയ്യുന്നു; അതിന്റെ രാഷ്ട്രീയ അർഥം ഇവിടെ തുറന്നുപറയുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ നിഗമനം വിവർത്തനത്തിൽ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ വായിക്കാൻ സൗകര്യപ്രദമായി ലിപ്യന്തരിച്ചു. ലൈംഗിക സദൃശോക്തി മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ച് അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കി.
