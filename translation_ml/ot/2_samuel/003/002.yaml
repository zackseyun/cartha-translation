source:
  edition: WLC
  text: ו/ילדו לְ/דָוִ֛ד בָּנִ֖ים בְּ/חֶבְר֑וֹן וַ/יְהִ֤י בְכוֹר/וֹ֙ אַמְנ֔וֹן לַ/אֲחִינֹ֖עַם הַ/יִּזְרְעֵאלִֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/002.yaml
  text: Sons were born to David in Hebron[a], and his firstborn was Amnon, by Ahinoam the Jezreelitess.
translation:
  language: ml
  text: ദാവീദിന് ഹെബ്രോനിൽ പുത്രന്മാർ ജനിച്ചു; അവന്റെ ആദ്യജാതനായ അമ്നോൻ യിസ്രെയേൽ സ്വദേശിനിയായ അഹീനോവാമിൽനിന്ന് ജനിച്ചവനായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യിസ്രെയേല്യ സ്ത്രീയായ” അല്ലെങ്കിൽ “യിസ്രെയേലിൽനിന്നുള്ള സ്ത്രീയായ.”
    reason: സ്ത്രീലിംഗ ദേശനാമമായ הַיִּזְרְעֵאלִת അഹീനോവാമിനെ യിസ്രെയേലുമായി ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇതിന് സ്വാഭാവികമായ പകരംപ്രയോഗങ്ങളുണ്ട്.
lexical_decisions:
- source_word: ו/ילדו
  choice: ജനിച്ചു
  rationale: ഹീബ്രായ ക്രിയാരൂപത്തിന്റെ ബഹുവചന സംഭവാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; അമ്മമാരെ വ്യാകരണകർത്താക്കളായി വ്യക്തമാക്കാതെ പുത്രന്മാർ ജനിച്ച സംഭവത്തിലാണ് ഊന്നൽ.
- source_word: לְ/דָוִד
  choice: ദാവീദിന്
  rationale: ബന്ധം സൂചിപ്പിക്കുന്ന ל എന്ന ഉപസർഗത്തിന്റെ വംശാവലി-സന്ദർഭത്തിലുള്ള സ്വാഭാവിക മലയാളരൂപം.
- source_word: בָּנִים
  choice: പുത്രന്മാർ
  rationale: പൊതുവായ മക്കൾ എന്നതിലുപരി ആൺമക്കളെയാണ് ഹീബ്രായ പദം വ്യക്തമാക്കുന്നത്.
- source_word: בְּ/חֶבְרוֹן
  choice: ഹെബ്രോനിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥലസൂചകാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: וַ/יְהִי
  choice: ആയിരുന്നു
  rationale: ദാവീദിന്റെ ആദ്യജാതനെ തിരിച്ചറിയിക്കുന്ന ലളിതമായ സംയോജക-അസ്തിത്വപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְכוֹר/וֹ
  choice: അവന്റെ ആദ്യജാതൻ
  rationale: ജനനക്രമവും അതിനോടനുബന്ധിച്ച കുടുംബപരമായ പ്രാധാന്യസാധ്യതയും ‘മൂത്തവൻ’ എന്നതിനെക്കാൾ കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: אַמְנוֹן
  choice: അമ്നോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: לַ/אֲחִינֹעַם
  choice: അഹീനോവാമിൽ ജനിച്ച
  rationale: ഈ ജനനപ്പട്ടികയിൽ ל മാതൃത്വബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അവ്യക്തതയില്ലാതെ സ്വാഭാവികമായി അത് പ്രകടിപ്പിക്കുന്നു.
- source_word: הַ/יִּזְרְעֵאלִת
  choice: യിസ്രെയേൽക്കാരിയായ
  rationale: സ്ത്രീലിംഗ ജനവിഭാഗ/ദേശനാമം അഹീനോവാമിന്റെ യിസ്രെയേൽബന്ധം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
