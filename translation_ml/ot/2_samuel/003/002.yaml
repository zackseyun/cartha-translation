translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലി സ്വഭാവമുള്ള വാക്യത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തിയിട്ടുണ്ട്; ‘ആദ്യജാതൻ’ എന്ന പദം മൂലപാഠത്തിന്റെ കുടുംബപരമായ സൂക്ഷ്മത സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ദേശനാമപ്രയോഗത്തിന് പിന്നാലെ വെച്ചിരിക്കുന്നു.
