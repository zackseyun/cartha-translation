- from: ദാവീദിന് ഹെബ്രോനിൽ പുത്രന്മാർ ജനിച്ചു. അവന്റെ ആദ്യജാതൻ യിസ്രെയേൽക്കാരിയായ അഹീനോവാമിൽ ജനിച്ച അമ്നോൻ ആയിരുന്നു.[a]
