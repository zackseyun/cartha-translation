language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּֽה יַעֲשֶׂ֤ה אֱלֹהִים֙ לְ/אַבְנֵ֔ר וְ/כֹ֖ה יֹסִ֣יף ל֑/וֹ כִּ֗י כַּ/אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לְ/דָוִ֔ד כִּֽי כֵ֖ן אֶֽעֱשֶׂה לּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/009.yaml
  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
translation:
  language: ml
  text: ദൈവം അബ്നേരിനോടു ഇപ്രകാരവും അതിലധികവും ചെയ്യട്ടെ! യാഹ്‌വെ ദാവീദിനോടു സത്യം ചെയ്തതുപോലെ, ഞാൻ അവനുവേണ്ടി അങ്ങനെതന്നെ ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים לְאַבְנֵר וְכֹה יֹסִיף לוֹ
  choice: ദൈവം അബ്നേരിനോട് ഇതും ഇതിനുമപ്പുറവും ചെയ്യട്ടെ
  rationale: സ്വയം ദൈവശിക്ഷ ക്ഷണിച്ചുവരുത്തുന്ന എബ്രായ ശപഥസൂത്രത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. לְאַבְנֵר എന്ന മൂന്നാംപുരുഷ സ്വയംപരാമർശവും സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെ ഏകവചന അർഥത്തിൽ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כַּאֲשֶׁר
  choice: സത്യം ചെയ്തതുപോലെതന്നെ
  rationale: യാഹ്‌വെയുടെ ശപഥവും അബ്നേരിന്റെ ഉദ്ദേശിച്ച പ്രവൃത്തിയും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം വ്യക്തമാക്കുന്നു.
- source_word: נִשְׁבַּע
  choice: സത്യം ചെയ്ത
  rationale: മുൻപ് ചെയ്തതും ഇപ്പോഴും പ്രാബല്യമുള്ളതുമായ ശപഥത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ നാല് എബ്രായ വ്യഞ്ജനാക്ഷരങ്ങളുടെ വ്യക്തിനാമസ്വഭാവം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כִּי כֵן אֶעֱשֶׂה לוֹ
  choice: ഞാൻ അവനുവേണ്ടി ചെയ്യും
  rationale: എബ്രായ അപൂർണക്രിയയുടെ ഭാവിമുഖമായ ദൃഢനിശ്ചയം പ്രകടമാക്കുന്നു; לוֹ ദാവീദിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവനുവേണ്ടി’ എന്നു നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിച്ചില്ല; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിൽനിന്ന് വേർതിരിച്ച് Yahweh എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: ശപഥത്തിലെ നിബന്ധന വ്യക്തമാക്കണോ എന്നത്
  choice: അവസാന വാക്യം അനുകൂല പ്രഖ്യാപനമായി നിലനിർത്തി
  alternative: ‘ഞാൻ അവനുവേണ്ടി അങ്ങനെ ചെയ്യാതിരുന്നാൽ’
  rationale: മസോററ്റിക് പാഠത്തിൽ നിഷേധപദം ഇല്ല; כִּי ... כִּי כֵן אֶעֱשֶׂה לוֹ എന്നത് അബ്നേരിന്റെ ഉറച്ച പ്രഖ്യാപനമായി നേരിട്ട് വായിക്കാം. എന്നാൽ ശപഥസൂത്രത്തിൽ നിഷേധാത്മക നിബന്ധന അന്തർലീനമാണെന്ന വായനയും സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ശപഥത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പുരാതന പ്രയോഗങ്ങൾ ഒഴിവാക്കി. അവസാനത്തിലെ ദീർഘവിരാമം അടുത്ത വാക്യത്തിലേക്ക് ശപഥത്തിന്റെ ഉള്ളടക്കം തുടരുന്നതു സൂചിപ്പിക്കുന്നു.
