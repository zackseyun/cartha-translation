  text: וַ/יָּבֹ֣א כָל הָ/עָ֗ם לְ/הַבְר֧וֹת אֶת דָּוִ֛ד לֶ֖חֶם בְּ/ע֣וֹד הַ/יּ֑וֹם וַ/יִּשָּׁבַ֨ע דָּוִ֜ד לֵ/אמֹ֗ר כֹּ֣ה יַעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י אִם לִ/פְנֵ֧י בֽוֹא הַ/שֶּׁ֛מֶשׁ אֶטְעַם לֶ֖חֶם א֥וֹ כָל מְאֽוּמָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
translation:
  language: ml
  text: 'പകൽ ശേഷിക്കുമ്പോൾ ദാവീദിനെ അപ്പം[a] കഴിക്കാൻ പ്രേരിപ്പിക്കാൻ ജനമെല്ലാം വന്നു. എന്നാൽ ദാവീദ് ശപഥം ചെയ്തു പറഞ്ഞു: “ദൈവം എന്നോട് അങ്ങനെ ചെയ്യട്ടെ; അതിലും അധികം ചെയ്യട്ടെ—സൂര്യൻ അസ്തമിക്കുന്നതിനുമുമ്പ് ഞാൻ അപ്പമോ യാതൊന്നുമോ രുചിച്ചാൽ!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘അപ്പം’ എന്നാണ്; ഇവിടെ അത് ഭക്ഷണത്തെ പൊതുവായി സൂചിപ്പിക്കാമെങ്കിലും, മൂർത്തമായ പദം പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവം എന്നോട് അങ്ങനെ ചെയ്യട്ടെ; അതിലും അധികം ചെയ്യട്ടെ’ എന്നത് സ്വയം ശാപം വിളിച്ചുവരുത്തുന്ന പതിവ് ശപഥസൂത്രമാണ്. ശിക്ഷ എന്താണെന്ന് എബ്രായത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  choice: അപ്പം കഴിപ്പിക്കാൻ
  rationale: ברה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ വിലാപസന്ദർഭത്തിൽ ദാവീദിനെ ഭക്ഷണം കഴിക്കാൻ പ്രേരിപ്പിക്കുകയോ ഭക്ഷിപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കഴിപ്പിക്കാൻ’ പ്രവർത്തനത്തിന്റെ കാരകഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: לֶחֶם എന്നത് പൊതുവായി ‘ഭക്ഷണം’ എന്നും അർഥമാക്കാമെങ്കിലും, എബ്രായത്തിലെ മൂർത്തമായ പദവും നോമ്പിന്റെ പശ്ചാത്തലവും നിലനിർത്താൻ ‘അപ്പം’ ഉപയോഗിച്ചു.
- source_word: בְּעוֹד הַיּוֹם
  choice: പകൽ കഴിയുന്നതിനുമുമ്പ്
  rationale: പകൽ ഇനിയും ശേഷിച്ചിരിക്കുമ്പോൾ എന്ന സമയാർഥം നൽകുകയും തുടർന്നുള്ള സൂര്യാസ്തമയ പരാമർശവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּשָּׁבַע
  choice: ശപഥം ചെയ്തു
  rationale: ഗൗരവമുള്ള പ്രതിജ്ഞയെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  choice: ദൈവം എന്നോട് അങ്ങനെ ചെയ്യട്ടെ; അതിലധികവും ചെയ്യട്ടെ
  rationale: ശിക്ഷ എന്താണെന്ന് വ്യക്തമാക്കാതെ വിടുന്ന പതിവ് എബ്രായ സ്വയംശാപ ശപഥസൂത്രത്തിന്റെ രൂപവും ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: כִּי אִם
  choice: …ചെയ്താൽ
  rationale: ശപഥത്തിലെ സ്വയംശാപം ബാധകമാകുന്ന വ്യവസ്ഥ മലയാളത്തിൽ വ്യവസ്ഥാസൂചക ക്രിയാരൂപത്തിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לִפְנֵי בּוֹא הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിക്കുന്നതിനുമുമ്പ്
  rationale: അക്ഷരാർഥത്തിലെ ‘സൂര്യന്റെ വരവ്’ എന്ന പ്രയോഗം സന്ദർഭത്തിൽ സൂര്യാസ്തമയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֶטְעַם
  choice: ഞാൻ … രുചിച്ചാൽ
  rationale: ‘രുചിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തി, അല്പംപോലും കഴിക്കില്ലെന്ന ശപഥത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: אוֹ כָל מְאוּמָה
  choice: മറ്റെന്തെങ്കിലുമോ
  rationale: അപ്പത്തിന് പുറമേ യാതൊന്നും കഴിക്കില്ലെന്ന സമഗ്രമായ നിരോധനം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ശപഥസൂത്രത്തിലെ വ്യക്തമാക്കാത്ത ശിക്ഷ
  choice: ‘ദൈവം എന്നോട് അങ്ങനെ ചെയ്യട്ടെ; അതിലധികവും ചെയ്യട്ടെ’ എന്ന് തുറന്ന രൂപത്തിൽ നിലനിർത്തി.
  alternative: ‘ദൈവം എന്നെ കഠിനമായി ശിക്ഷിക്കട്ടെ’ എന്ന് അർഥം വ്യക്തമാക്കുക.
  rationale: എബ്രായം ശിക്ഷയുടെ സ്വഭാവം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായി അത് പൂരിപ്പിക്കാതെ മൂലത്തിലെ അനിശ്ചിതത്വവും ഗൗരവവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ചരിത്രവിവരണത്തിനും ഗൗരവമുള്ള ശപഥത്തിനും യോജിച്ച മാന്യമായ ശൈലി. ‘അപ്പം’, ‘രുചിക്കുക’ എന്നീ മൂർത്തമായ ഉറവിടപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, സമയപ്രയോഗവും ശപഥവ്യവസ്ഥയും സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ അവതരിപ്പിച്ചു.
