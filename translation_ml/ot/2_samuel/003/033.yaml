id: 2SA.3.33
reference: 2 Samuel 3:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְקֹנֵ֥ן הַ/מֶּ֛לֶךְ אֶל אַבְנֵ֖ר וַ/יֹּאמַ֑ר הַ/כְּ/מ֥וֹת נָבָ֖ל יָמ֥וּת אַבְנֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/033.yaml
  text: And the king lamented over Abner and said[a], “Should Abner die as a fool dies?”
translation:
  language: ml
  text: 'രാജാവ് അബ്നേരിനെക്കുറിച്ച് വിലാപഗാനം പാടി പറഞ്ഞു: “ഒരു മൂഢൻ മരിക്കുന്നതുപോലെ അബ്നേർ മരിക്കണമോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: വിലാപഗാനം പാടി
  rationale: קונן എന്ന ക്രിയ ഔപചാരികമായ വിലാപമോ ചരമഗീതമോ ആലപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. പിന്നാലെ വിലാപത്തിന്റെ വാക്കുകൾ ഉദ്ധരിക്കുന്നതിനാൽ പൊതുവായ ‘വിലപിച്ചു’ എന്നതിനെക്കാൾ ഈ പ്രയോഗം സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: אֶל אַבְנֵר
  choice: അബ്നേരിനെക്കുറിച്ച്
  rationale: വിലാപക്രിയയോടൊപ്പം אֶל വിലാപത്തിന്റെ വിഷയത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അബ്നേരിനെക്കുറിച്ച്’ സ്വാഭാവികവും അർഥവ്യക്തവുമാണ്.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: കഥാസന്ദർഭത്തിൽ ദാവീദിനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമപദം; മൂലത്തിലെ പദവി അതേപടി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמַר
  choice: പറഞ്ഞു
  rationale: കാവ്യാത്മകമായ വിലാപവാക്കുകൾ അവതരിപ്പിക്കാൻ എബ്രായമൂലം സാധാരണ സംസാരക്രിയ തന്നെയാണ് ഉപയോഗിക്കുന്നത്.
- source_word: הַכְּמוֹת נָבָל יָמוּת
  choice: ഒരു മൂഢൻ മരിക്കുന്നതുപോലെ ... മരിക്കണമോ?
  rationale: അക്ഷരാർഥത്തിൽ ‘മൂഢന്റെ മരണംപോലെ ... മരിക്കുമോ?’ എന്ന താരതമ്യഘടനയാണ്. മലയാളത്തിലെ ആലങ്കാരിക ചോദ്യമായി നൽകുന്നത് വിലാപത്തിലെ പ്രതിഷേധസ്വരം സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: נָבָל
  choice: ഒരു മൂഢൻ
  rationale: נָבָל ബുദ്ധിഹീനതയ്ക്കൊപ്പം ധാർമികമായ അധമത്വവും അപമാനകരമായ പെരുമാറ്റവും സൂചിപ്പിക്കാം. ‘മൂഢൻ’ നേരിട്ടുള്ള സമാനപദമായിരിക്കെ മൂലത്തിലെ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: אַבְנֵר
  choice: അബ്നേർ
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളത്തിലെ പതിവ് ബൈബിൾ ലിപ്യന്തരണത്തിന് അനുയോജ്യമായി നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വിലാപത്തിന്റെ കാവ്യസ്വഭാവവും ആലങ്കാരിക ചോദ്യത്തിലെ പ്രതിഷേധവും നിലനിർത്തി.
