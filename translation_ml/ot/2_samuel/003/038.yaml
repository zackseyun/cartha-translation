  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל עֲבָדָ֑י/ו הֲ/ל֣וֹא תֵדְע֔וּ כִּי שַׂ֣ר וְ/גָד֗וֹל נָפַ֛ל הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/038.yaml
  text: Then the king said to his servants[a], “Do you not know that a prince and a great man has fallen today in Israel?”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് തന്റെ ദാസന്മാരോട് പറഞ്ഞു: “ഇന്ന് ഇസ്രായേലിൽ ഒരു നേതാവും മഹാനുമായ വ്യക്തി വീണുപോയിരിക്കുന്നു എന്നു നിങ്ങൾ അറിയുന്നില്ലയോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു പ്രഭുവും മഹാനുമായ വ്യക്തി.” എബ്രായത്തിലെ שַׂר എന്ന പദത്തിന് പ്രഭു, സേനാധിപൻ, ഭരണാധികാരി, പ്രമുഖ ഉദ്യോഗസ്ഥൻ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ സംഭവക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിത നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ; സന്ദർഭത്തിൽ രാജാവ് ദാവീദാണെന്ന് വ്യക്തമായതിനാൽ പേര് ചേർക്കേണ്ടതില്ല.
- source_word: עֲבָדָיו
  choice: തന്റെ ദാസന്മാരോട്
  rationale: രാജസഭാ പശ്ചാത്തലത്തിലും עֶבֶד എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘ദാസൻ’ നിലനിർത്തുന്നു; ‘ഉദ്യോഗസ്ഥർ’ എന്നത് സന്ദർഭപരമായി സാധ്യമെങ്കിലും പദവി അനാവശ്യമായി നിർണയിക്കും.
- source_word: הֲלוֹא תֵדְעוּ
  choice: നിങ്ങൾ അറിയുന്നില്ലയോ?
  rationale: നിഷേധത്തോടുകൂടിയ ചോദ്യം സമ്മതം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യമാണ്; മലയാളത്തിലും അതിന്റെ ചോദ്യംഭാവം നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: അവർ അറിയേണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ ‘എന്ന്’ സ്വാഭാവികമാണ്.
- source_word: שַׂר
  choice: പ്രഭു
  rationale: ഈ പദം പ്രഭു, അധിപൻ, സേനാധിപൻ, പ്രമുഖ ഉദ്യോഗസ്ഥൻ എന്നീ അർഥങ്ങൾ വഹിക്കാം. അബ്നേരിന്റെ ഉയർന്ന സൈനിക-രാഷ്ട്രീയ പദവിയും മൂലപാഠത്തിലെ ഗൗരവവും ‘പ്രഭു’ നിലനിർത്തുന്നു.
- source_word: וְגָדוֹל
  choice: മഹാനുമായ ഒരാൾ
  rationale: വിശേഷണം ഇവിടെ നാമസദൃശമായി പ്രയോഗിച്ച് വ്യക്തിയുടെ മഹത്ത്വവും പ്രാമുഖ്യവും സൂചിപ്പിക്കുന്നു; ആ വ്യക്തിപരമായ പരാമർശം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: נָפַל
  choice: വീണുപോയിരിക്കുന്നു
  rationale: മരണത്തെ ഗൗരവപൂർവം സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ രൂപകം നിലനിർത്തുകയും സംഭവത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: ‘ഈ ദിവസം’ എന്ന അക്ഷരാർഥത്തിന്റെ സ്വാഭാവിക ആധുനിക മലയാളരൂപം.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: ഈ ശ്രദ്ധേയമായ മരണം സംഭവിച്ച ദേശീയ പരിധിയെ בְּ സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേലിൽ’ അതിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷയാണ്.
