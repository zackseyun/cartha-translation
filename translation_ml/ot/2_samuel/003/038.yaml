translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. രാജാവിന്റെ വിലാപസന്ദർഭത്തിന് യോജിച്ച ഉയർന്ന ഭാവം നിലനിർത്തുന്നു; മരണത്തെ സൂചിപ്പിക്കുന്ന ‘വീണുപോയിരിക്കുന്നു’ എന്ന രൂപകം സംരക്ഷിച്ചിരിക്കുന്നു.
