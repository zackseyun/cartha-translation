base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/005.yaml
  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
translation:
  language: ml
  text: ആറാമൻ, ദാവീദിന്റെ ഭാര്യയായ[a] എഗ്ലായ്ക്കു ജനിച്ച യിത്രെയാം. ഇവർ ദാവീദിനു ഹെബ്രോനിൽ ജനിച്ചവരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദാവീദിന്റെ ഭാര്യ.’ എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ദാവീദിന്റെ ഭാര്യ’ എന്നാണ്; സന്ദർഭത്തിൽ എഗ്ലാ ദാവീദിന്റെ ഭാര്യമാരിൽ ഒരാളാണെന്നാണ് ഇതു സൂചിപ്പിക്കുന്നത്, അവൾ അദ്ദേഹത്തിന്റെ ഏകഭാര്യയായിരുന്നു എന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  choice: ആറാമൻ
  rationale: മുൻവാക്യങ്ങളിലെ പുത്രന്മാരുടെ പട്ടിക തുടരുന്ന പുല്ലിംഗ ഏകവചന ക്രമസംഖ്യയാണ്. മലയാളത്തിൽ ‘മകൻ’ എന്നു പ്രത്യേകം ചേർക്കാതെ ‘ആറാമൻ’ എന്നു പറയുന്നത് സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יִתְרְעָם
  choice: യിത്രെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: לְעֶגְלָה
  choice: എഗ്ലായിൽ ജനിച്ച
  rationale: ജനനപ്പട്ടികയിലെ לְ മാതാവിനെ സൂചിപ്പിക്കുന്നു. ‘എഗ്ലായിൽ ജനിച്ച’ എന്ന പ്രയോഗം മാതൃത്വബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֵשֶׁת דָּוִד
  choice: ദാവീദിന്റെ ഭാര്യയായ
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; എന്നാൽ ദാവീദിന് ഒരേയൊരു ഭാര്യയേ ഉണ്ടായിരുന്നുള്ളൂ എന്ന നിഗമനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: אֵלֶּה
  choice: ഇവർ
  rationale: മുൻപു പറഞ്ഞ വ്യക്തികളെ സംഗ്രഹിക്കുന്ന സൂചകസർവനാമം. ആളുകളെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ഇവർ’ സ്വാഭാവികമാണ്.
- source_word: יֻלְּדוּ
  choice: ജനിച്ചവരാണ്
  rationale: ילד എന്ന ക്രിയയുടെ കർമണി രൂപം ലളിതമായ വംശാവലി പ്രസ്താവനയായി അവതരിപ്പിക്കുന്നു.
- source_word: לְדָוִד
  choice: ദാവീദിനു
  rationale: ജനനസൂചനകളിൽ לְ മാതാപിതൃബന്ധം അടയാളപ്പെടുത്തുന്നു; ‘ദാവീദിനു ജനിച്ചവർ’ എന്നത് മലയാളത്തിലെ സാധാരണ വംശാവലിപ്രയോഗമാണ്.
- source_word: בְּחֶבְרוֹן
  choice: ഹെബ്രോനിൽ
  rationale: ജനനങ്ങൾ നടന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനിക പ്രയോഗം.
theological_decisions:
- issue: ‘ദാവീദിന്റെ ഭാര്യ’ എന്ന പ്രയോഗം ഏകഭാര്യത്വം സൂചിപ്പിക്കുന്നുവോ
  choice: മുഖ്യപാഠത്തിൽ എബ്രായത്തിലെ ബന്ധസൂചക രൂപം ‘ദാവീദിന്റെ ഭാര്യയായ’ എന്നു നിലനിർത്തി, അതിന്റെ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ദാവീദിന്റെ ഭാര്യമാരിൽ ഒരാളായ’ എന്നു മുഖ്യപാഠത്തിൽ വിപുലീകരിക്കുക.
  rationale: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘ദാവീദിന്റെ ഭാര്യ’ എന്നാണ്; സന്ദർഭം എഗ്ലാ ദാവീദിന്റെ ഭാര്യമാരിൽ ഒരാളാണെന്നു വ്യക്തമാക്കുന്നു. വിപുലീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ യഥാർഥ രൂപവും സന്ദർഭസത്യവും ഒരുമിച്ച് സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. പേരുകൾ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; സന്ദർഭത്തിൽ വ്യക്തമായിടത്ത് അനാവശ്യമായി ‘മകൻ’ ചേർത്തിട്ടില്ല.
