  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אִֽישׁ בֹּ֥שֶׁת בֶּן שָׁא֖וּל לֵ/אמֹ֑ר תְּנָ֤/ה אֶת אִשְׁתִּ/י֙ אֶת מִיכַ֔ל אֲשֶׁר֙ אֵרַ֣שְׂתִּי לִ֔/י בְּ/מֵאָ֖ה עָרְל֥וֹת פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/014.yaml
  text: Then David sent messengers to Ish-bosheth son of Saul[a], saying, “Give me my wife Michal[b], whom I betrothed to myself for a hundred Philistine foreskins.”
translation:
  language: ml
  text: 'പിന്നെ ദാവീദ് ശൗലിന്റെ മകനായ ഈശ്-ബോശെത്തിന്റെ അടുക്കലേക്ക് ദൂതന്മാരെ അയച്ചു: “നൂറ് ഫെലിസ്ത്യരുടെ അഗ്രചർമങ്ങൾ നൽകി എനിക്കായി ഞാൻ വിവാഹനിശ്ചയം ചെയ്ത[a] എന്റെ ഭാര്യ മീഖളിനെ[b] എനിക്കു തരിക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “നൂറ് ഫെലിസ്ത്യരുടെ അഗ്രചർമങ്ങൾ നൽകി ഞാൻ ഭാര്യയായി നേടിയവൾ.” എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി, “എനിക്കായി ഞാൻ വിവാഹനിശ്ചയം ചെയ്തവൾ” എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ശൗൽ ആവശ്യപ്പെട്ട വിവാഹമൂല്യമായി ഫെലിസ്ത്യരുടെ അഗ്രചർമങ്ങൾ സമർപ്പിച്ച് ദാവീദ് മീഖളിനെ നേടിയ സംഭവത്തിന് 1 ശമൂവേൽ 18:25–27 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: പിന്നെ ദാവീദ് ... അയച്ചു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘പിന്നെ’ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, കാരണം അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: മനുഷ്യരായ സന്ദേശവാഹകരെ സൂചിപ്പിക്കുന്ന സാധാരണവും സന്ദർഭോചിതവുമായ പദം.
- source_word: אֶל אִישׁ בֹּשֶׁת בֶּן שָׁאוּל
  choice: ശൗലിന്റെ മകനായ ഈശ്-ബോശെത്തിന്റെ അടുക്കൽ
  rationale: പേരും പിതൃബന്ധവും നിലനിർത്തി മലയാളത്തിലെ സ്വാഭാവിക ദിശാപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിയിലേക്കുള്ള എബ്രായ അവതാരകപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: תְּנָה
  choice: എനിക്ക് തരിക
  rationale: נתן എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം നേരിട്ടും ഗൗരവത്തോടെയും പകരുന്നു.
- source_word: אֶת אִשְׁתִּי אֶת מִיכַל
  choice: എന്റെ ഭാര്യ മീഖളിനെ
  rationale: ആവർത്തിച്ച കർമചിഹ്നത്തോടെയുള്ള സമാനാധികരണഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ഒരൊറ്റ നാമപദസമുച്ചയമാക്കുന്നു.
- source_word: אֲשֶׁר אֵרַשְׂתִּי לִי
  choice: എനിക്കായി വിവാഹനിശ്ചയം ചെയ്ത
  rationale: ארשׂ എന്നത് പൊതുവായ വിവാഹത്തേക്കാൾ വിവാഹനിശ്ചയത്തെ സൂചിപ്പിക്കുന്നു; לִי ദാവീദിന്റെ സ്വന്തം അവകാശവാദം നിലനിർത്തുന്നു.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: നൂറ് ഫെലിസ്ത്യരുടെ അഗ്രചർമങ്ങൾ നൽകി
  rationale: בְ ഇവിടെ വിവാഹമൂല്യമായി നൽകിയ മാർഗമോ വിലയോ സൂചിപ്പിക്കുന്നു. ‘അഗ്രചർമങ്ങൾ’ മൂലത്തിലെ ദൃഢമായ ശരീരസംബന്ധ പദം മറച്ചുവയ്ക്കാതെ പകരുന്നു.
theological_decisions:
- issue: മീഖളുമായുള്ള ബന്ധത്തിന്റെ നിയമപരമായ പദപ്രയോഗം
  choice: ‘എന്റെ ഭാര്യ’ എന്നതും ‘വിവാഹനിശ്ചയം ചെയ്ത’ എന്നതും ഒരുമിച്ച് നിലനിർത്തി.
  alternative: പിരിമുറുക്കം നീക്കി ‘ഞാൻ വിവാഹം കഴിച്ച എന്റെ ഭാര്യ’ എന്നാക്കുക.
  rationale: ദാവീദ് അവളെ ‘എന്റെ ഭാര്യ’ എന്നു വിളിക്കുമ്പോഴും തന്റെ അവകാശം മുൻകാല വിവാഹനിശ്ചയത്തിലും വിവാഹമൂല്യത്തിലും ആധാരപ്പെടുത്തുന്നു. മൂലത്തിലെ ഈ നിയമ-ബന്ധപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അഗ്രചർമങ്ങൾ’ എന്ന നേരിട്ടുള്ള ശരീരശാസ്ത്രപദം മൂലത്തിന്റെ കഠിനത മൃദൂകരിക്കാതെ നൽകുന്നു. [a], [b] എന്നീ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
