id: 2SA.3.26
reference: 2 Samuel 3:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֤א יוֹאָב֙ מֵ/עִ֣ם דָּוִ֔ד וַ/יִּשְׁלַ֤ח מַלְאָכִים֙ אַחֲרֵ֣י אַבְנֵ֔ר וַ/יָּשִׁ֥בוּ אֹת֖/וֹ מִ/בּ֣וֹר הַסִּרָ֑ה וְ/דָוִ֖ד לֹ֥א יָדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
translation:
  language: ml
  text: അപ്പോൾ യോവാബ് ദാവീദിന്റെ അടുക്കൽനിന്ന് പുറപ്പെട്ട് അബ്നേരിന്റെ പിന്നാലെ ദൂതന്മാരെ അയച്ചു. അവർ സീരായിലെ കിണറ്റിൽനിന്ന്[a] അവനെ തിരികെ കൊണ്ടുവന്നു. എന്നാൽ ദാവീദ് അത് അറിഞ്ഞിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, എബ്രായപ്രയോഗത്തെ ‘സീരായിലെ കിണർ’ എന്നല്ല ഒരു സ്ഥലനാമമായി എടുത്ത്, ‘ബോർ-സീരായിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ വ്യക്തമായ ചലനാർഥവും തുടർച്ചയായ ആഖ്യാനരീതിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֵעִם דָּוִד
  choice: ദാവീദിന്റെ അടുക്കൽനിന്ന്
  rationale: עִם എന്നതിലെ ‘ഒരാളോടൊപ്പം/അരികിൽ ആയിരിക്കുക’ എന്ന ആശയം ചലനസൂചകമായ מִן സഹിതം വ്യക്തമാക്കുന്നു.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഈ സന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ദൂതന്മാർ’ സന്ദർഭാനുസൃതമായി സ്വാഭാവികമാണ്.
- source_word: אַחֲרֵי אַבְנֵר
  choice: അബ്നേരിന്റെ പിന്നാലെ
  rationale: אַחֲרֵי സൂചിപ്പിക്കുന്ന പിന്തുടരൽ അർഥം, ഉദ്ദേശ്യം അനാവശ്യമായി വിശദീകരിക്കാതെ, സംരക്ഷിക്കുന്നു.
- source_word: וַיָּשִׁבוּ אֹתוֹ
  choice: അവർ അവനെ തിരികെ കൊണ്ടുവന്നു
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: מִבּוֹר הַסִּרָה
  choice: സീരായിലെ കിണറ്റിൽനിന്ന്
  rationale: בּוֹר എന്ന പദത്തിന് കുഴി, ജലസംഭരണി, കിണർ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; ഇവിടെ സ്ഥലസൂചനയിൽ ‘കിണർ’ വായനാസൗകര്യമുള്ള തിരഞ്ഞെടുപ്പാണ്. സ്ഥലനാമമായി കാണുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְדָוִד לֹא יָדָע
  choice: എന്നാൽ ദാവീദ് അത് അറിഞ്ഞിരുന്നില്ല
  rationale: וְ എന്നതിന്റെ സന്ദർഭോചിതമായ വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ട് നൽകുന്നു; ‘അത്’ മുൻവിവരത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ സംക്ഷിപ്തതയും പ്രവർത്തനക്രമവും കാത്തുസൂക്ഷിച്ചു; സ്ഥലനാമസംബന്ധിയായ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
