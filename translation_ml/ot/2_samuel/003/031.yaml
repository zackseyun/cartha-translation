translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ബൈബിൾ ആഖ്യാനശൈലി. ആജ്ഞകൾക്ക് സന്ദർഭോചിതമായ ‘-വിൻ’ രൂപം ഉപയോഗിച്ചു; അപരിചിതമായെങ്കിലും കൃത്യമായ ‘ശവമഞ്ചം’ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
