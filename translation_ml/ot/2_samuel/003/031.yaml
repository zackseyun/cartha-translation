source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל יוֹאָ֜ב וְ/אֶל כָּל הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ קִרְע֤וּ בִגְדֵי/כֶם֙ וְ/חִגְר֣וּ שַׂקִּ֔ים וְ/סִפְד֖וּ לִ/פְנֵ֣י אַבְנֵ֑ר וְ/הַ/מֶּ֣לֶךְ דָּוִ֔ד הֹלֵ֖ךְ אַחֲרֵ֥י הַ/מִּטָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് യോവാബിനോടും അവനോടുകൂടെ ഉണ്ടായിരുന്ന സകല ജനത്തോടും പറഞ്ഞു: “നിങ്ങളുടെ വസ്ത്രങ്ങൾ കീറി, ചാക്കുവസ്ത്രം അരയിൽ കെട്ടി, അബ്നേരിന്റെ മുമ്പിൽ വിലപിക്കുവിൻ.” ദാവീദ് രാജാവ് ശവമഞ്ചത്തിന്റെ[a] പിന്നാലെ നടന്നുകൊണ്ടിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മഞ്ചം,” “ശവശയ്യ,” അല്ലെങ്കിൽ “ശരീരം വഹിക്കുന്ന കട്ടിൽ.” എബ്രായപദത്തിന് സാധാരണയായി “കിടക്ക” എന്നാണ് അർഥം; ഇവിടെ അബ്നേരിന്റെ ശരീരം വഹിച്ചിരുന്ന മഞ്ചത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  choice: നിങ്ങളുടെ വസ്ത്രങ്ങൾ കീറി
  rationale: ദുഃഖാചരണത്തിന്റെ ഭാഗമായി വസ്ത്രം കീറുന്നതിനെ സൂചിപ്പിക്കുന്ന ബഹുവചന ആജ്ഞ; സ്വാഭാവികവും ഉറവിടത്തോട് അടുത്തതുമായ പ്രയോഗം.
- source_word: חִגְרוּ שַׂקִּים
  choice: ചാക്കുവസ്ത്രം അരയിൽ കെട്ടി
  rationale: חגר എന്ന ക്രിയയുടെ ‘അരയിൽ കെട്ടുക/ധരിക്കുക’ എന്ന ദൃശ്യഭാവവും ദുഃഖാചരണരീതിയും നിലനിർത്തുന്നു.
- source_word: וְסִפְדוּ
  choice: വിലപിക്കുവിൻ
  rationale: മരിച്ചവനെച്ചൊല്ലിയുള്ള ഔപചാരിക ദുഃഖപ്രകടനത്തെ സൂചിപ്പിക്കുന്നു; ‘ദുഃഖിക്കുവിൻ’ എന്നതിനെക്കാൾ ספד എന്ന പദത്തിന്റെ പ്രത്യേക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי אַבְנֵר
  choice: അബ്നേരിന്റെ മുമ്പിൽ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥം നിലനിർത്തുന്നു; ശവയാത്രാസന്ദർഭത്തിൽ അബ്നേരിന്റെ ശരീരം വഹിച്ചിരുന്ന മഞ്ചത്തിനു മുമ്പിൽ എന്ന ആശയം തുടർന്നുള്ള വാക്യം വ്യക്തമാക്കുന്നു.
- source_word: הֹלֵךְ אַחֲרֵי
  choice: പിന്നാലെ നടന്നുകൊണ്ടിരുന്നു
  rationale: പങ്ക്തിയുടെ സ്ഥലപരമായ ബന്ധവും കൃതന്തത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവവും പ്രകടമാക്കുന്നു.
- source_word: הַמִּטָּה
  choice: ശവമഞ്ചം
  rationale: מִטָּה സാധാരണയായി കിടക്കയെയോ മഞ്ചത്തെയോ സൂചിപ്പിക്കുമെങ്കിലും ഇവിടെ അബ്നേരിന്റെ ശരീരം വഹിച്ചിരുന്ന ശവസംസ്കാരമഞ്ചമാണ് സന്ദർഭോചിതം.
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവ്
  rationale: ദാവീദിന്റെ രാജകീയ പദവി സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നൽകുന്നു.
