translation:
  language: ml
  text: അവന്റെ രണ്ടാമത്തെ മകൻ, കർമ്മേല്യനായ നാബാലിന്റെ ഭാര്യ അബീഗയിൽനിന്ന് ജനിച്ച കിലെയാബ്; മൂന്നാമത്തെ മകൻ, ഗെശൂരിന്റെ രാജാവായ തൽമയിയുടെ മകൾ മയഖായിൽനിന്ന് ജനിച്ച അബ്ശാലോം.
