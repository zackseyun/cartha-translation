lexical_decisions:
- source_word: כִלְאָב
  choice: കിലെയാബ്
  rationale: എബ്രായനാമമായ Kilʾāb-ന്റെ ശബ്ദരൂപം മലയാളത്തിൽ വ്യക്തമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִי
  choice: കർമ്മേല്യനായ നാബാലിന്റെ ഭാര്യയായിരുന്ന
  rationale: അബീഗയിൽ ദാവീദിൽ മകനെ പ്രസവിച്ച കാലത്തും നാബാലിന്റെ ഭാര്യയായിരുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ, ബന്ധത്തിന്റെ മുൻകാല സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: ഗെശൂർരാജാവ്
  rationale: സ്ഥലനാമവും രാജപദവിയും ചേർത്തുള്ള സ്വാഭാവിക മലയാളപ്രയോഗം.
