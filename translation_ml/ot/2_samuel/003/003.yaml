translation_notes:
  register: വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടന നിലനിർത്തിക്കൊണ്ട് ആധുനികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ‘രണ്ടാമൻ’, ‘മൂന്നാമൻ’ എന്നീ അപൂർണവാക്യരൂപങ്ങൾ മുൻവാക്യത്തോടുള്ള പട്ടികാസംബന്ധം സംരക്ഷിക്കുന്നു; മാതൃത്വബന്ധത്തിന് സ്വാഭാവികമായ ‘ജനിച്ച’ പ്രയോഗം സ്വീകരിച്ചു.
