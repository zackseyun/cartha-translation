base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/032.yaml
  text: They buried Abner in Hebron[a], and the king lifted up his voice and wept at Abner’s grave, and all the people wept.
translation:
  language: ml
  text: അവർ അബ്നേരിനെ ഹെബ്രോനിൽ അടക്കം ചെയ്തു. രാജാവ് ശബ്ദമുയർത്തി അബ്നേരിന്റെ കല്ലറയ്ക്കരികിൽ[a] കരഞ്ഞു; ജനമെല്ലാം കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അബ്നേരിന്റെ കല്ലറയിലേക്കു.” എബ്രായ മുൻപ്രത്യയം ദിശയെ സൂചിപ്പിക്കുന്ന വിധത്തിലും വായിക്കാം; എന്നാൽ ഇവിടെ കല്ലറയ്ക്കരികിൽ നടന്ന വിലാപം എന്ന അർഥമാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: അവർ ... അടക്കം ചെയ്തു
  rationale: קבר എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘അടക്കം ചെയ്യുക’ സ്വീകരിച്ചു; തുടക്കത്തിലെ וַ എന്ന ആഖ്യാനബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: בְּחֶבְרוֹן
  choice: ഹെബ്രോനിൽ
  rationale: בְּ ഇവിടെ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; നഗരത്തിനുള്ളിലെ അടക്കത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഹെബ്രോനിൽ’ എന്നു പറയുന്നു.
- source_word: וַיִּשָּׂא ... אֶת־קוֹלוֹ
  choice: ശബ്ദമുയർത്തി
  rationale: ഉച്ചത്തിലുള്ള വിലാപത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സാഹിത്യസ്വഭാവം നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം.
- source_word: וַיֵּבְךְּ
  choice: കരഞ്ഞു
  rationale: בכה ശോകസന്ദർഭത്തിലെ കരച്ചിലിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ‘കരഞ്ഞു’ തെരഞ്ഞെടുത്തു.
- source_word: אֶל־קֶבֶר אַבְנֵר
  choice: അബ്നേരിന്റെ കല്ലറയ്ക്കരികിൽ[a]
  rationale: אֶל സാധാരണയായി ‘നേരെ/ലേക്ക്’ എന്ന ദിശ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ ശവസംസ്കാരസ്ഥലത്തു നടന്ന വിലാപം എന്ന സന്ദർഭത്തിൽ സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന ‘കല്ലറയ്ക്കരികിൽ’ സ്വാഭാവികമാണ്; ദിശാസൂചനയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיִּבְכּוּ כָּל־הָעָם
  choice: ജനമെല്ലാം കരഞ്ഞു
  rationale: ആവർത്തിക്കുന്ന בכה ഒരേപോലെ ‘കരഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി; כָּל־הָעָם എന്ന സമഗ്രത ‘ജനമെല്ലാം’ എന്നു സ്വാഭാവികമായി നൽകി.
