translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശബ്ദമുയർത്തി’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ വിലാപശൈലി നിലനിർത്തുന്നു; ‘കരഞ്ഞു’ എന്ന ആവർത്തനം എബ്രായ പാഠത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
