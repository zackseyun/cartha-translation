id: 2SA.3.25
reference: 2 Samuel 3:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יָדַ֨עְתָּ֙ אֶת אַבְנֵ֣ר בֶּן נֵ֔ר כִּ֥י לְ/פַתֹּתְ/ךָ֖ בָּ֑א וְ/לָ/דַ֜עַת אֶת מוֹצָֽאֲ/ךָ֙ וְ/אֶת מבוא/ך וְ/לָ/דַ֕עַת אֵ֛ת כָּל אֲשֶׁ֥ר אַתָּ֖ה עֹשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
translation:
  language: ml
  text: നേരിന്റെ മകനായ അബ്നേർ നിന്നെ വഞ്ചിക്കാനും[a] നിന്റെ പോക്കും വരവും[b] മനസ്സിലാക്കാനും നീ ചെയ്യുന്നതെല്ലാം അറിയാനുമാണ് വന്നതെന്ന് നിനക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്നെ വശീകരിക്കാൻ’ എന്നോ ‘നിന്നെ പ്രേരിപ്പിക്കാൻ’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയയ്ക്ക് വശീകരിക്കുക, പ്രേരിപ്പിക്കുക, വഞ്ചിക്കുക എന്നീ അർഥങ്ങളുണ്ടാകാം; ഇവിടെ ശത്രുതാപരമായ സന്ദർഭം ‘വഞ്ചിക്കാൻ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘നിന്റെ പുറത്തേക്കുള്ള പോക്കും അകത്തേക്കുള്ള വരവും.’ ഒരാളുടെ മുഴുവൻ ചലനങ്ങളെയോ പ്രവർത്തനങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.'
    reason: cultural_note
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: നിനക്കറിയാം
  rationale: ידע എന്ന ക്രിയയുടെ ഖാൽ പെർഫെക്റ്റ് രൂപം ഇവിടെ വർത്തമാനകാല അറിവിനെയോ തിരിച്ചറിവിനെയോ സൂചിപ്പിക്കുന്നു; യോവാബ് ദാവീദിന് അബ്നേറിനെക്കുറിച്ച് അറിയേണ്ടതാണെന്ന് ആരോപണഭാവത്തിൽ പറയുന്നു.
- source_word: אַבְנֵר בֶּן נֵר
  choice: നേരിന്റെ മകനായ അബ്നേർ
  rationale: വ്യക്തിനാമങ്ങളും പിതൃബന്ധവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി നൽകി.
- source_word: כִּי
  choice: അർധവിരാമത്തിനു ശേഷമുള്ള ഉദ്ദേശ്യവിവരണം
  rationale: ഇവിടെ כִּי ദാവീദ് അറിയേണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എന്ന്’ ആവർത്തിക്കുന്നതിനെക്കാൾ അർധവിരാമത്തോടെ തുടർന്നുള്ള വിശദീകരണം ആരോപണത്തിന്റെ ഒഴുക്ക് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְפַתֹּתְךָ
  choice: നിന്നെ വഞ്ചിക്കാൻ
  rationale: פתה എന്ന പദത്തിന് വശീകരിക്കുക, പ്രേരിപ്പിക്കുക, വഞ്ചിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. രാഷ്ട്രീയ-സൈനികമായ ഈ ശത്രുതാപര സന്ദർഭത്തിൽ ‘വഞ്ചിക്കുക’ ഏറ്റവും യോജിച്ചെങ്കിലും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בָּא
  choice: അവൻ വന്നത്
  rationale: കഥാസന്ദർഭത്തിലെ പൂർത്തിയായ വരവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לָדַעַת
  choice: മനസ്സിലാക്കാനും / അറിയാനും
  rationale: ഇവിടെ അറിവ് സമ്പാദിക്കുക എന്ന ഉദ്ദേശ്യമാണ്. ആദ്യ സന്ദർഭത്തിൽ ചലനങ്ങൾ രഹസ്യമായി കണ്ടെത്തുക എന്ന ഭാവത്തിന് ‘മനസ്സിലാക്കുക’ എന്നും അവസാനത്തെ വ്യാപക വിവരശേഖരണത്തിന് ‘അറിയുക’ എന്നും നൽകി.
- source_word: מוֹצָאֲךָ וְאֶת מְבוֹאֶךָ
  choice: നിന്റെ പോക്കും വരവും
  rationale: പുറപ്പെടലും പ്രവേശനവും ചേർന്ന് ഒരാളുടെ മുഴുവൻ ചലനങ്ങളെയോ പ്രവർത്തനങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിലെ സമാനമായ സ്വാഭാവിക ദ്വന്ദ്വപ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: നീ ചെയ്യുന്നതെല്ലാം
  rationale: עֹשֶׂה എന്ന പങ്കാളിക്രിയയുടെ തുടരുന്ന പ്രവർത്തനഭാവവും ‘എല്ലാം’ എന്ന സമഗ്രതയും ലളിതമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള ആരോപണശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ‘പോക്കും വരവും’ എന്ന ദ്വന്ദ്വപ്രയോഗം സംരക്ഷിച്ചുകൊണ്ട് അതിന്റെ ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകളോടുതന്നെ ചേർത്തു.
