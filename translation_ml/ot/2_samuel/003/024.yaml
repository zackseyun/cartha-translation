translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. രാജാവിനോടുള്ള യോവാബിന്റെ അഭിസംബോധനയ്ക്ക് ‘അങ്ങ്’ ഉപയോഗിച്ചു; എന്നാൽ ചോദ്യങ്ങളുടെ മൂർച്ചയും കുറ്റപ്പെടുത്തുന്ന സ്വരവും മയപ്പെടുത്തിയിട്ടില്ല.
