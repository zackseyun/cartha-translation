base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/024.yaml
  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
translation:
  language: ml
  text: 'അപ്പോൾ യോവാബ് രാജാവിന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “അങ്ങ് എന്താണ് ചെയ്തിരിക്കുന്നത്? ഇതാ, അബ്നേർ അങ്ങയുടെ അടുക്കൽ വന്നിരിക്കുന്നു. എന്തിനാണ് അങ്ങ് അവനെ വിട്ടയച്ചത്? അവൻ തീർച്ചയായും പോയിക്കഴിഞ്ഞു![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അവൻ പോയി, പോകുകതന്നെ ചെയ്തു” — ‘പോയി’ എന്ന ക്രിയയോടൊപ്പം വരുന്ന ഹീബ്രു ക്രിയാനാമം അവന്റെ പുറപ്പെടൽ തീർച്ചയായും പൂർത്തിയായിരിക്കുന്നു എന്ന് ഊന്നിപ്പറയുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അപ്പോൾ ... വന്ന്
  rationale: വയിഖ്തോൽ ആഖ്യാനത്തെ അടുത്ത സംഭവത്തിലേക്കു നീക്കുന്നു; ആവർത്തിച്ചുള്ള ‘എന്നിട്ട്’ എന്നതിനെക്കാൾ ‘അപ്പോൾ’ സ്വാഭാവികമായ കഥാക്രമം നൽകുന്നു.
- source_word: אֶל הַמֶּלֶךְ
  choice: രാജാവിന്റെ അടുക്കൽ
  rationale: ദിശയും വ്യക്തിസാമീപ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֶה עָשִׂיתָה
  choice: അങ്ങ് എന്താണ് ഈ ചെയ്തത്?
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെക്കുറിച്ചുള്ള യോവാബിന്റെ ആശ്ചര്യവും ശാസനാഭാവവും നിലനിർത്തുന്നു; രാജാവിനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ യോജിച്ച ആദരരൂപമാണ്.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു സൂചകപദത്തിന്റെ ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: בָא אַבְנֵר אֵלֶיךָ
  choice: അബ്നേർ അങ്ങയുടെ അടുക്കൽ വന്നിരുന്നു
  rationale: യോവാബ് എത്തുന്നതിനു മുമ്പ് സംഭവിച്ച അബ്നേരിന്റെ വരവിനെ മലയാളത്തിലെ സന്ദർഭോചിതമായ ഭൂതകാലരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לָמָּה זֶּה
  choice: പിന്നെ എന്തിനാണ്
  rationale: വെറും ‘എന്തിന്’ എന്നതിലുപരി കുറ്റപ്പെടുത്തലോടെയുള്ള ചൂണ്ടിക്കാണിക്കൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שִׁלַּחְתּוֹ
  choice: അവനെ വിട്ടയച്ചത്
  rationale: പീയേൽ രൂപം ഇവിടെ അയച്ചുകളയുക അഥവാ പോകാൻ അനുവദിക്കുക എന്ന അർഥം നൽകുന്നു; ദാവീദിന്റെ പ്രവർത്തകത്വവും നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: അവൻ തീർത്തും പോയിക്കഴിഞ്ഞല്ലോ
  rationale: ക്രിയയോടൊപ്പം വരുന്ന സമ്പൂർണക്രിയാനാമം പുറപ്പെടലിനെ ഊന്നിപ്പറയുന്നു; ‘തീർത്തും’ ആ ഊന്നൽ നൽകുകയും ‘പോയിക്കഴിഞ്ഞല്ലോ’ പൂർത്തിയായ പുറപ്പെടലും യോവാബിന്റെ പ്രതിഷേധസ്വരവും പ്രകടമാക്കുകയും ചെയ്യുന്നു.
