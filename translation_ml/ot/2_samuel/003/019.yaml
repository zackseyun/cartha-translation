  yaml_path: translation/ot/2_samuel/003/019.yaml
  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
translation:
  language: ml
  text: അബ്നേർ ബെന്യാമീന്യരോടും സംസാരിച്ചു.[a] ഇസ്രായേലിന്റെ ദൃഷ്ടിയിലും മുഴുവൻ ബെന്യാമീൻഗൃഹത്തിന്റെ ദൃഷ്ടിയിലും നല്ലതെന്നു തോന്നിയതെല്ലാം ദാവീദിനോടു പറയാൻ അബ്നേർ ഹെബ്രോനിലേക്കും ചെന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥം ‘ബെന്യാമീന്റെ ചെവികളിൽ സംസാരിച്ചു’; അർഥം ‘ബെന്യാമീന്യർ കേൾക്കെ സംസാരിച്ചു’ അഥവാ ‘ബെന്യാമീന്യരോടു സംസാരിച്ചു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഇസ്രായേലിനും മുഴുവൻ ബെന്യാമീൻഗൃഹത്തിനും പ്രസാദകരമായിരുന്നതെല്ലാം.’
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאָזְנֵי
  choice: -നോടു സംസാരിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘ചെവികളിൽ’ എന്നാണെങ്കിലും, ഇത് ഒരാളോടു നേരിട്ട് സംസാരിക്കുക എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്. സ്വാഭാവികമായ മലയാളത്തിനായി ‘-നോടു സംസാരിച്ചു’ എന്നു നൽകി.
- source_word: בִנְיָמִין
  choice: ബെന്യാമീന്യർ
  rationale: ഇവിടെ വ്യക്തിയായ ബെന്യാമീനെയല്ല, ആ ഗോത്രജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുന്ന ബഹുവചനരൂപം ഉപയോഗിച്ചു.
- source_word: בְּחֶבְרוֹן
  choice: ഹെബ്രോനിൽ
  rationale: സംഭാഷണം നടന്ന സ്ഥലത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗം.
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ നല്ലതെന്നു തോന്നിയതെല്ലാം
  rationale: ‘കണ്ണുകളിൽ നല്ലത്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും വിലയിരുത്തൽഭാവവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: כָּל בֵּית בִּנְיָמִן
  choice: ബെന്യാമീൻഗൃഹം മുഴുവൻ
  rationale: കുടുംബ-ഗോത്ര-രാഷ്ട്രീയ കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്ന ‘ഗൃഹം’ എന്ന ഉറവിടരൂപകം നിലനിർത്തി.
- source_word: גַּם ... גַּם
  choice: -ന്യരോടും ... -നോടും
  rationale: രണ്ടു പ്രവൃത്തികളുടെയും കൂട്ടിച്ചേർക്കൽ മലയാളത്തിലെ ‘-ഉം ... -ഉം’ ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി.
