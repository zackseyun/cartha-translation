id: 2SA.3.17
reference: 2 Samuel 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/דְבַר אַבְנֵ֣ר הָיָ֔ה עִם זִקְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר גַּם תְּמוֹל֙ גַּם שִׁלְשֹׁ֔ם הֱיִיתֶ֞ם מְבַקְשִׁ֧ים אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עֲלֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/017.yaml
  text: Abner had spoken with the elders of Israel, saying, “For some time you have been seeking David to be king over you.”
translation:
  language: ml
  text: 'അബ്നേർ ഇസ്രായേലിന്റെ മൂപ്പന്മാരോടു സംസാരിച്ചു: “കുറെക്കാലമായി ദാവീദിനെ നിങ്ങളുടെ രാജാവാക്കാൻ നിങ്ങൾ അന്വേഷിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּדְבַר אַבְנֵר הָיָה עִם
  choice: അബ്നേർ ... സംസാരിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘അബ്നേരിന്റെ വാക്ക് ... കൂടെ ഉണ്ടായിരുന്നു’ എന്ന ഘടന ഇവിടെ സംസാരിക്കുകയോ ആലോചിക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘സംസാരിച്ചു’ എന്നു നൽകി.
- source_word: גַּם תְּמוֹל גַּם שִׁלְשֹׁם
  choice: കുറെക്കാലമായി
  rationale: ‘ഇന്നലെയും അതിനു മുമ്പും’ എന്ന ഹീബ്രു പ്രയോഗം മുൻകാലംമുതൽ/കുറെക്കാലമായി എന്ന അർഥമുള്ള ചൊല്ലാണ്; ഇംഗ്ലീഷ് ഓഡിറ്റ് പാളിയോടും യോജിക്കുന്നു.
- source_word: מְבַקְשִׁים
  choice: ആഗ്രഹിച്ചുവരുന്നു
  rationale: ‘അന്വേഷിക്കുക, തേടുക, ആഗ്രഹിക്കുക’ എന്ന അർഥപരിധിയിൽ, ദാവീദ് രാജാവാകണമെന്ന ജനമൂപ്പന്മാരുടെ തുടർച്ചയായ അഭിലാഷം സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: לְמֶלֶךְ עֲלֵיכֶם
  choice: നിങ്ങളുടെ രാജാവാകണമെന്ന്
  rationale: ‘നിങ്ങളുടെമേൽ രാജാവായി’ എന്ന ആശയം സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രാഖ്യാന ശൈലി. ഹീബ്രു ചൊല്ലിന്റെ അക്ഷരരൂപത്തിനു പകരം അതിന്റെ കാലസൂചന സ്വാഭാവികമായി നൽകി; പ്രത്യേക സഭാപാരമ്പര്യ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
