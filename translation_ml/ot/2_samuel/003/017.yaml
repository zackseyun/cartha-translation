revisions:
- from: 'അബ്നേർ ഇസ്രായേൽ മൂപ്പന്മാരോടു സംസാരിച്ചു: “കുറെക്കാലമായി ദാവീദ് നിങ്ങളുടെ രാജാവാകണമെന്ന് നിങ്ങൾ ആഗ്രഹിച്ചുവരുന്നുവല്ലോ.”'
  to: 'അബ്നേർ ഇസ്രായേലിന്റെ മൂപ്പന്മാരോടു സംസാരിച്ചു: “കുറെക്കാലമായി ദാവീദിനെ നിങ്ങളുടെ രാജാവാക്കാൻ നിങ്ങൾ അന്വേഷിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു.”'
  rationale: The revision preserves the source’s temporal idiom in its contextual sense (‘for some time’) while restoring the active sense of ‘seeking’ and the past ongoing verbal perspective. It remains consistent with the English POB audit trail without subordinating the Hebrew to it.
