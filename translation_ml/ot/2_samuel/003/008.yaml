    issue: ‘ഉടമ്പടിവിശ്വസ്തത’ over-specifies חֶסֶד.
    rationale: Although חֶסֶד can include covenantal loyalty in some contexts, the Hebrew here does not state ‘covenant.’ The political and relational sense is sufficiently conveyed by ‘വിശ്വസ്തത.’
