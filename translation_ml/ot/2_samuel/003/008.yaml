  text: וַ/יִּחַר֩ לְ/אַבְנֵ֨ר מְאֹ֜ד עַל דִּבְרֵ֣י אִֽישׁ בֹּ֗שֶׁת וַ/יֹּ֨אמֶר֙ הֲ/רֹ֨אשׁ כֶּ֥לֶב אָנֹ֘כִי֮ אֲשֶׁ֣ר לִֽ/יהוּדָה֒ הַ/יּ֨וֹם אֶֽעֱשֶׂה חֶ֜סֶד עִם בֵּ֣ית שָׁא֣וּל אָבִ֗י/ךָ אֶל אֶחָי/ו֙ וְ/אֶל מֵ֣רֵעֵ֔/הוּ וְ/לֹ֥א הִמְצִיתִ֖/ךָ בְּ/יַד דָּוִ֑ד וַ/תִּפְקֹ֥ד עָלַ֛/י עֲוֺ֥ן הָ/אִשָּׁ֖ה הַ/יּֽוֹם־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/008.yaml
  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇശ്-ബോശെത്തിന്റെ വാക്കുകൾ നിമിത്തം അബ്നേർ അത്യന്തം കോപിച്ചു. അവൻ പറഞ്ഞു: “ഞാൻ യെഹൂദയ്ക്കുള്ള ഒരു നായത്തലയാണോ?[a] ഇന്നുവരെ നിന്റെ അപ്പനായ ശൗലിന്റെ ഭവനത്തോടും അവന്റെ സഹോദരന്മാരോടും സുഹൃത്തുക്കളോടും ഞാൻ വിശ്വസ്തത പുലർത്തിയിരിക്കുന്നു; നിന്നെ ദാവീദിന്റെ കൈയിൽ ഏല്പിച്ചിട്ടുമില്ല. എന്നിട്ടും ഇന്ന് ഈ സ്ത്രീയെച്ചൊല്ലിയുള്ള കുറ്റം നീ എന്റെമേൽ ചുമത്തുന്നുവല്ലോ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യെഹൂദയ്ക്കുള്ള ഒരു നായത്തല” എന്ന എബ്രായപ്രയോഗം ദുഷ്കരമായ ഒരു അധിക്ഷേപശൈലിയാണ്. “യെഹൂദയുടെ പക്ഷത്തുള്ള നിന്ദ്യനായ ഒരു നായ” എന്നതുപോലൊരു അർഥമായിരിക്കാം; എന്നാൽ രൂപകവും അതിലെ അവ്യക്തതയും മുഖ്യപാഠത്തിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  choice: അബ്നേർ അത്യന്തം കോപിച്ചു
  rationale: חרה എന്ന എബ്രായ പ്രയോഗത്തിലെ ‘കോപം ജ്വലിക്കുക’ എന്ന ആശയവും מְאֹד നൽകുന്ന തീവ്രതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: עַל דִּבְרֵי אִישׁ בֹּשֶׁת
  choice: ഇശ്-ബോശെത്തിന്റെ വാക്കുകൾ നിമിത്തം
  rationale: עַל ഇവിടെ കോപത്തിന്റെ കാരണത്തെയും דִּבְרֵי നേരിട്ട് ‘വാക്കുകൾ’ എന്നതിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  choice: ഞാൻ യെഹൂദയ്ക്കുള്ള ഒരു നായത്തലയാണോ?
  rationale: ദുഷ്കരമായ അധിക്ഷേപപ്രയോഗത്തിലെ ‘നായത്തല’ എന്ന രൂപകവും യെഹൂദയുമായുള്ള ബന്ധത്തിലെ അവ്യക്തതയും വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- source_word: הַיּוֹם אֶעֱשֶׂה חֶסֶד
  choice: ഇന്നുവരെ ... ഞാൻ ഉടമ്പടിവിശ്വസ്തത കാണിക്കുകയും
  rationale: ആദ്യത്തെ הַיּוֹם അബ്നേറിന്റെ ഇതുവരെയുള്ള സേവനത്തെ പിന്നോട്ടുനോക്കി പറയുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു; חֶסֶד ഇവിടെ വെറും ദയയെക്കാൾ ബന്ധപരവും രാഷ്ട്രീയവുമായ വിശ്വസ്തതയാണ്.
- source_word: עִם בֵּית שָׁאוּל אָבִיךָ
  choice: നിന്റെ അപ്പനായ ശൗലിന്റെ ഭവനത്തോടും
  rationale: ‘ശൗലിന്റെ ഭവനം’ എന്നത് രാജവംശപരമായ അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘ഭവനത്തോട്’ എന്ന വിഭക്തി വിശ്വസ്തത കാണിക്കുക എന്നതിനോട് സ്വാഭാവികമായി ചേരുന്നു.
- source_word: אֶל אֶחָיו וְאֶל מֵרֵעֵהוּ
  choice: അവന്റെ സഹോദരന്മാരോടും സുഹൃത്തുക്കളോടും
  rationale: ഉറവിടത്തിലെ സഹോദരന്മാർ/അടുത്ത ബന്ധുക്കൾ, സുഹൃത്തുക്കൾ/സഹചാരികൾ എന്നീ പദങ്ങളുടെ രൂപവും വ്യാപ്തിയും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: וְלֹא הִמְצִיתִךָ בְּיַד דָּוִד
  choice: നിന്നെ ദാവീദിന്റെ കൈയിൽ ഏല്പിക്കാതിരിക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: ഒരാളുടെ കൈയിൽ ഏല്പിക്കുക എന്ന എബ്രായ അധികാരപ്രയോഗം മലയാളത്തിലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה
  choice: ഈ സ്ത്രീയെച്ചൊല്ലിയുള്ള കുറ്റം നീ എന്റെമേൽ ചുമത്തുന്നുവല്ലോ
  rationale: פקד על + עָוֺן എന്നത് കുറ്റം ചുമത്തുക അഥവാ കണക്കു ചോദിക്കുക എന്ന നിയമ-ധാർമിക ഭാവം നൽകുന്നു; സ്ത്രീയുടെ കുറ്റമോ സ്ത്രീയെ സംബന്ധിച്ച കുറ്റമോ എന്ന ബന്ധം അതിയായി നിർണ്ണയിക്കാതെ ‘യെച്ചൊല്ലിയുള്ള’ എന്നു നൽകി.
