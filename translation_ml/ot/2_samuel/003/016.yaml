  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കഥയുടെ വികാരതീവ്രത നിലനിർത്തിക്കൊണ്ട് ഹീബ്രു വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
