source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ אִתָּ֜/הּ אִישָׁ֗/הּ הָל֧וֹךְ וּ/בָכֹ֛ה אַחֲרֶ֖י/הָ עַד בַּֽחֻרִ֑ים וַ/יֹּ֨אמֶר אֵלָ֥י/ו אַבְנֵ֛ר לֵ֥ךְ שׁ֖וּב וַ/יָּשֹֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/016.yaml
  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
translation:
  language: ml
  text: അവളുടെ ഭർത്താവ് അവളോടൊപ്പം പോയി; അവളുടെ പിന്നാലെ[a] നടന്നും കരഞ്ഞും ബഹൂരീംവരെ എത്തി. അപ്പോൾ അബ്നേർ അവനോട്, “പോകൂ, മടങ്ങിപ്പോകൂ[b]” എന്നു പറഞ്ഞു. അങ്ങനെ അവൻ മടങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളെ പിന്തുടർന്ന്” അല്ലെങ്കിൽ “അവളുടെ പിന്നിൽ.”
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥമായി “പോകൂ, മടങ്ങൂ”—ഊന്നൽ നൽകുന്ന ഇരട്ട ആജ്ഞ; “തിരിച്ചുപോകൂ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  choice: അവളുടെ ഭർത്താവ്
  rationale: സന്ദർഭത്തിൽ אִישׁ എന്ന പദം 3fs പ്രത്യയത്തോടെ സ്ത്രീയുടെ ഭർത്താവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ഇതാണ് സ്വാഭാവികവും കൃത്യവും.
- source_word: אִתָּהּ
  choice: അവളോടൊപ്പം
  rationale: സഹഗമനത്തെ നേരിട്ട് വ്യക്തമാക്കുന്നു; എന്നാൽ തുടർന്നുള്ള אַחֲרֶיהָ കാരണം ‘അവളുടെ പിന്നാലെ’ എന്നും മനസ്സിലാക്കാവുന്നതിനാൽ അടിക്കുറിപ്പിൽ പാഠത്തിന്റെ ചലനബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: הָלוֹךְ וּבָכֹה
  choice: നടന്നുകൊണ്ട് കരഞ്ഞു
  rationale: തുടർന്നുനിന്ന ഗമനവും കരച്ചിലും സ്വാഭാവിക മലയാളത്തിൽ ദൈർഘ്യമുള്ള പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു.
- source_word: אַחֲרֶיהָ
  choice: അവളുടെ പിന്നാലെ
  rationale: അവളെ പിന്തുടർന്ന് പിന്നിൽ നടന്നതെന്ന സ്ഥലപരമായ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עַד בַּחֻרִים
  choice: ബഹൂരീംവരെ
  rationale: עַד സ്ഥലനാമത്തോടൊപ്പം സഞ്ചാരത്തിന്റെ അറ്റം സൂചിപ്പിക്കുന്നു; ‘-വരെ’ അതിനെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: בַּחֻרִים
  choice: ബഹൂരീം
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: לֵךְ שׁוּב
  choice: പോകൂ, മടങ്ങിപ്പോകൂ
  rationale: ഹീബ്രുവിലെ രണ്ട് ആജ്ഞാരൂപങ്ങളും നിലനിർത്തി, മലയാളത്തിൽ അവയുടെ ഊന്നൽ വായിക്കാവുന്ന വിധം നൽകി.
- source_word: וַיָּשֹׁב
  choice: അങ്ങനെ അവൻ മടങ്ങിപ്പോയി
  rationale: ആജ്ഞയുടെ ഫലമായി കഥ മുന്നോട്ടുപോകുന്നതിനെ സ്വാഭാവിക മലയാള ആഖ്യാനശൈലിയിൽ വ്യക്തമാക്കുന്നു.
