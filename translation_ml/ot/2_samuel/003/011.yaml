  terminology: ‘അബ്നേർ,’ ‘മറുപടി പറയാൻ,’ and ‘ഭയപ്പെട്ടിരുന്നതിനാൽ’ are appropriate modern-standard Malayalam choices. The footnote's proposed alternative is adjusted to use natural Malayalam recipient/case syntax while explaining the Hebrew wording.
  issues:
