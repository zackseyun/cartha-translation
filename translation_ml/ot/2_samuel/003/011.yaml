  yaml_path: translation/ot/2_samuel/003/011.yaml
  text: And he could no longer answer Abner a word[a], because he feared him.
translation:
  language: ml
  text: അയാൾ അബ്നേരിനെ ഭയപ്പെട്ടിരുന്നതിനാൽ, ഇനി അബ്നേരിനോട് ഒരു വാക്കുപോലും മറുപടി പറയാൻ കഴിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അബ്നേരിനോട് ഒന്നും മറുപടി പറയാൻ കഴിഞ്ഞില്ല.’ എബ്രായ പ്രയോഗത്തിൽ അക്ഷരാർഥമായി, ‘അബ്നേരിന് ഒരു വാക്ക് മറുപടി പറയുക’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכֹל
  choice: കഴിഞ്ഞു
  rationale: കഴിവിനെയോ ശേഷിയെയോ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്; നിഷേധത്തോടൊപ്പം ‘കഴിഞ്ഞില്ല’ എന്നത് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: עוֹד
  choice: പിന്നെ ... പോലും
  rationale: നിഷേധവാക്യത്തിൽ ഇനി തുടരാനായില്ല എന്ന അർഥം നൽകുന്നു; ‘പിന്നെ ഒരു വാക്കുപോലും’ എന്ന ഘടന ആ ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְהָשִׁיב
  choice: മറുപടി പറയാൻ
  rationale: ഇവിടെ ഹിഫ്ഇൽ രൂപം ‘ഉത്തരം നൽകുക/മറുപടി പറയുക’ എന്ന പ്രയോഗാർഥത്തിലാണ്.
- source_word: אֶת־אַבְנֵר
  choice: അബ്നേരിനെ
  rationale: നേരിട്ടുള്ള കർമചിഹ്നത്തോടുകൂടിയ വ്യക്തിനാമം; മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: דָּבָר
  choice: ഒരു വാക്കുപോലും
  rationale: അക്ഷരാർഥത്തിലെ ‘ഒരു വാക്ക്’ നിലനിർത്തിക്കൊണ്ട്, നിഷേധസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘പോലും’ ചേർത്തു.
- source_word: מִיִּרְאָתוֹ
  choice: ഭയപ്പെട്ടിരുന്നതിനാൽ
  rationale: מִן ചേർന്ന ‘ഭയം’ കാരണത്തെ സൂചിപ്പിക്കുന്നു; അബ്നേരോടുള്ള ഭയമാണ് മറുപടി പറയാനാകാത്തതിന്റെ കാരണം.
- source_word: אֹתוֹ
  choice: അവനെ
  rationale: കർമസർവനാമം അബ്നേരിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളവാക്യത്തിൽ ‘അബ്നേരിനെ ഭയപ്പെട്ടിരുന്നതിനാൽ’ എന്നു വ്യക്തമായി നൽകി.
