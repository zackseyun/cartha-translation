  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְ/הַֽעֲבִ֥יר הַ/מַּמְלָכָ֖ה מִ/בֵּ֣ית שָׁא֑וּל וּ/לְ/הָקִ֞ים אֶת כִּסֵּ֣א דָוִ֗ד עַל יִשְׂרָאֵל֙ וְ/עַל יְהוּדָ֔ה מִ/דָּ֖ן וְ/עַד בְּאֵ֥ר שָֽׁבַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/010.yaml
  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
translation:
  language: ml
  text: ശൗലിന്റെ ഭവനത്തിൽനിന്ന് രാജ്യം മാറ്റുകയും, ഇസ്രായേലിന്മേലും യെഹൂദയ്ക്കുമേലും—ദാൻമുതൽ ബേർ-ശേബവരെ[a]—ദാവീദിന്റെ സിംഹാസനം സ്ഥാപിക്കുകയും ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദാൻമുതൽ ബേർ-ശേബവരെ’ എന്നത് ദേശത്തിന്റെ വടക്കേയറ്റംമുതൽ തെക്കേയറ്റംവരെയുള്ള മുഴുവൻ പ്രദേശത്തെയും സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  choice: മാറ്റുക
  rationale: ഹിഫീൽ രൂപം രാജത്വം ഒരാളിൽനിന്നോ ഒരു വംശത്തിൽനിന്നോ മറ്റൊരാളിലേക്കു കൈമാറുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മാറ്റുക’ ഈ രാഷ്ട്രീയ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַמַּמְלָכָה
  choice: രാജത്വം
  rationale: ഇവിടെ രാജാവിന്റെ ഭരണാധികാരവും രാജകീയ ആധിപത്യവുമാണ് മുഖ്യമായി ഉദ്ദേശിക്കുന്നത്. ‘രാജ്യം’ എന്നതിലുണ്ടാകാവുന്ന ഭൂപ്രദേശമാത്രമായ ധാരണ ഒഴിവാക്കിക്കൊണ്ട് ‘രാജത്വം’ മൂലത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: מִבֵּית שָׁאוּל
  choice: ശൗലിന്റെ ഭവനത്തിൽനിന്ന്
  rationale: ‘ഭവനം’ എന്ന വേദപുസ്തകീയ രൂപകം കുടുംബത്തെയും രാജവംശത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; അതിനെ ‘രാജവംശം’ എന്നു വിശദീകരിച്ച് മൂലരൂപകം നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: וּלְהָקִים
  choice: സ്ഥാപിക്കുക
  rationale: ഹിഫീൽ രൂപത്തിന് ഈ രാജകീയ സന്ദർഭത്തിൽ ഉറപ്പിച്ചു നിർത്തുക, സ്ഥാപിക്കുക എന്ന അർഥമാണ്.
- source_word: אֶת כִּסֵּא דָוִד
  choice: ദാവീദിന്റെ സിംഹാസനം
  rationale: മൂലത്തിലെ സിംഹാസനരൂപകം അതേപടി നിലനിർത്തുന്നു; അത് ദാവീദിന്റെ രാജാധികാരത്തെയും ഭരണത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: ഇസ്രായേലിന്മേലും യെഹൂദയ്ക്കുമേലും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന עַל രണ്ടു രാഷ്ട്രീയ സമൂഹങ്ങളിലുമുള്ള അധികാരപരിധിയെ ഊന്നുന്നു; മലയാളത്തിലും ‘-ന്മേലും ... -യ്ക്കുമേലും’ എന്നു ആവർത്തിച്ച് അത് സംരക്ഷിക്കുന്നു.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: ദാൻമുതൽ ബേർ-ശേബവരെ
  rationale: ദേശത്തിന്റെ വടക്കേയറ്റംമുതൽ തെക്കേയറ്റംവരെയുള്ള മുഴുവൻ വ്യാപ്തിയെയും സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: בְּאֵר שָׁבַע
  choice: ബേർ-ശേബ
  rationale: എബ്രായ നാമത്തിന്റെ രണ്ടു ഘടകങ്ങളും കാണിക്കുന്നതോടൊപ്പം മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ള ലിപ്യന്തരണം.
theological_decisions:
- issue: ‘ശൗലിന്റെ ഭവനം’, ‘ദാവീദിന്റെ സിംഹാസനം’ എന്നീ രാജവംശീയ രൂപകങ്ങൾ
  choice: മൂലത്തിലെ ‘ഭവനം’, ‘സിംഹാസനം’ എന്നീ സാക്ഷാൽ രൂപങ്ങൾ നിലനിർത്തി.
  alternative: ‘ശൗലിന്റെ രാജവംശത്തിൽനിന്ന് ദാവീദിന്റെ ഭരണം സ്ഥാപിക്കുക’
  rationale: വാക്യം രാഷ്ട്രീയാധികാരത്തിന്റെ കൈമാറ്റത്തെക്കുറിച്ചാണെങ്കിലും എബ്രായപാഠം അത് കുടുംബ-രാജവംശ, സിംഹാസന രൂപകങ്ങളിലൂടെയാണ് അവതരിപ്പിക്കുന്നത്. അവ നിലനിർത്തുന്നത് പിന്നീടുള്ള പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ പാഠത്തിന്റെ ഉടമ്പടി-രാജകീയ ഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഈ വാക്യം മുൻവാക്യത്തിലെ ശപഥവാക്യവുമായി വ്യാകരണപരമായി തുടരുന്ന അനന്തക്രിയാരൂപമാണെന്നതിനാൽ ‘മാറ്റുകയും ... സ്ഥാപിക്കുകയും ചെയ്യുക’ എന്ന ഘടന ഉപയോഗിച്ചു. ‘ഭവനം’, ‘സിംഹാസനം’ എന്നീ പരിചിതമായ വേദപുസ്തകീയ രൂപകങ്ങൾ വിശദീകരിച്ച് മാറ്റാതെ സൂക്ഷിച്ചു.
