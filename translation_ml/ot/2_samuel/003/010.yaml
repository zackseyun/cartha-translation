- from: ശൗലിന്റെ ഭവനത്തിൽനിന്ന് രാജത്വം മാറ്റുകയും ദാവീദിന്റെ സിംഹാസനം ഇസ്രായേലിന്മേലും യെഹൂദയ്ക്കുമേലും ദാൻമുതൽ ബേർ-ശേബവരെ[a] സ്ഥാപിക്കുകയും ചെയ്യുക.
