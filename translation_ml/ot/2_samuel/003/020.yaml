  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֨א אַבְנֵ֤ר אֶל דָּוִד֙ חֶבְר֔וֹן וְ/אִתּ֖/וֹ עֶשְׂרִ֣ים אֲנָשִׁ֑ים וַ/יַּ֨עַשׂ דָּוִ֧ד לְ/אַבְנֵ֛ר וְ/לַ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
translation:
  language: ml
  text: അബ്നേർ ഇരുപതു പുരുഷന്മാരോടൊപ്പം ഹെബ്രോനിൽ ദാവീദിന്റെ അടുക്കൽ വന്നു. ദാവീദ് അബ്നേറിനും അവനോടുകൂടെ ഉണ്ടായിരുന്ന പുരുഷന്മാർക്കുംവേണ്ടി ഒരു വിരുന്നൊരുക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു വിരുന്നു നടത്തി’ അല്ലെങ്കിൽ ‘ഒരു സദ്യ ഒരുക്കി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘വരുക’, ‘പോകുക’, ‘എത്തുക’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ദാവീദിന്റെ അടുക്കലേക്കുള്ള വരവാണ് ആഖ്യാനത്തിന്റെ ദൃഷ്ടികേന്ദ്രം; അതിനാൽ ‘വന്നു’ സ്വാഭാവികമാണ്.
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: ഹെബ്രോനിൽ ദാവീദിന്റെ അടുക്കൽ
  rationale: സ്ഥലനാമത്തിനു മുമ്പിൽ ഹീബ്രുവിൽ പ്രത്യേക ഉപസർഗമില്ലെങ്കിലും സന്ദർഭത്തിൽ ഹെബ്രോൻ ദാവീദ് ഉണ്ടായിരുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  choice: ഇരുപതു പുരുഷന്മാരോടൊപ്പം
  rationale: ഹീബ്രുവിലെ ക്രിയാരഹിത പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സഹഗമനം സൂചിപ്പിക്കുന്ന ‘ഒപ്പം’കൊണ്ട് സ്വാഭാവികമായി നൽകുന്നു. אֲנָשִׁים ഇവിടെ പ്രായപൂർത്തിയായ പുരുഷസഹചാരികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: ഒരു വിരുന്നൊരുക്കി
  rationale: עשה + משתה എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘വിരുന്നു ഉണ്ടാക്കി/നടത്തി’ എന്നതിനു സമാനമാണ്. സാമൂഹിക വിരുന്ന് സജ്ജമാക്കി നൽകിയെന്ന ആശയം ആധുനിക മലയാളത്തിൽ ‘വിരുന്നൊരുക്കി’ എന്നു സ്വാഭാവികമായി പറയുന്നു.
- source_word: מִשְׁתֶּה
  choice: വിരുന്ന്
  rationale: ഈ പദം ഭക്ഷണപാനീയങ്ങളോടുകൂടിയ വിരുന്നിനെയോ സദ്യയെയോ സൂചിപ്പിക്കുന്നു. മദ്യപാനം ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും അത് ഇവിടെ പ്രത്യേകം വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ ‘വിരുന്ന്’ അനാവശ്യമായ അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: לְאַבְנֵר וְלַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: അബ്നേറിനും അവനോടുകൂടെ ഉണ്ടായിരുന്ന പുരുഷന്മാർക്കുംവേണ്ടി
  rationale: ആവർത്തിച്ച לְ എന്ന ഉപസർഗത്തിന്റെ ഗുണഭോക്തൃബന്ധം ‘...നും ...ക്കുംവേണ്ടി’ എന്ന ഘടനയിൽ നിലനിർത്തുന്നു. ‘അവന്റെ ആളുകൾ’ എന്നു ചുരുക്കാതെ മൂലപാഠത്തിലെ വ്യക്തമായ ബന്ധവാക്യം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ അർഥബന്ധങ്ങൾ വ്യക്തമായി നിലനിർത്തി. ഇംഗ്ലീഷ് പാഠത്തിൽ [a] അടയാളം ‘Hebron’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് וַיַּעַשׂ ... מִשְׁתֶּה എന്ന വിരുന്നുസംബന്ധിയായ പ്രയോഗത്തിനുള്ളതാണ്; അതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ അടയാളം ‘വിരുന്നൊരുക്കി’ എന്നതിനുശേഷം സ്ഥാപിച്ചു.
