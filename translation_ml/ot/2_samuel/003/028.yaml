reference: 2 Samuel 3:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע דָּוִד֙ מֵ/אַ֣חֲרֵי כֵ֔ן וַ/יֹּ֗אמֶר נָקִ֨י אָנֹכִ֧י וּ/מַמְלַכְתִּ֛/י מֵ/עִ֥ם יְהוָ֖ה עַד עוֹלָ֑ם מִ/דְּמֵ֖י אַבְנֵ֥ר בֶּן נֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
translation:
  language: ml
  text: 'അതിനുശേഷം[a] ദാവീദ് അതിനെക്കുറിച്ചു കേട്ടപ്പോൾ പറഞ്ഞു: “നേരിന്റെ മകനായ അബ്നേരിന്റെ രക്തം ചൊരിഞ്ഞതിന്റെ കാര്യത്തിൽ[b] ഞാനും എന്റെ രാജ്യവും യഹ്‌വെയുടെ മുമ്പാകെ എന്നേക്കും കുറ്റമില്ലാത്തവരാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇതിനുശേഷം” അല്ലെങ്കിൽ “പിന്നീട്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം “അബ്നേരിന്റെ രക്തങ്ങളിൽനിന്ന്”; അബ്നേരിന്റെ രക്തം ചൊരിഞ്ഞതിലുള്ള, അഥവാ അവന്റെ മരണത്തിനുള്ള, ഉത്തരവാദിത്വത്തെ സൂചിപ്പിക്കുന്ന ശൈലീപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  choice: അതിനുശേഷം
  rationale: സംഭവക്രമത്തിൽ ‘ഇതിനുശേഷം/പിന്നീട്’ എന്നർഥമുള്ള കാലസൂചക പ്രയോഗം; ആധുനിക മലയാളത്തിൽ ‘അതിനുശേഷം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּשְׁמַע
  choice: ദാവീദ് അതിനെക്കുറിച്ചു കേട്ടപ്പോൾ
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കേട്ടു’ എന്നാണ്. മുൻസന്ദർഭത്തിലെ സംഭവമാണ് ദാവീദ് കേട്ടതെന്ന് വ്യക്തമാക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായ ‘അതിനെക്കുറിച്ചു’ ചേർത്തിരിക്കുന്നു.
- source_word: נָקִי
  choice: കുറ്റമില്ലാത്തവർ
  rationale: നിയമപരവും ധാർമികവുമായ ഉത്തരവാദിത്വത്തിൽനിന്നുള്ള വിമുക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘കുറ്റമില്ലാത്തവർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: אָנֹכִי וּמַמְלַכְתִּי
  choice: ഞാനും എന്റെ രാജ്യവും
  rationale: ദാവീദ് തന്നെയും അവന്റെ ഭരണരാജ്യത്തെയും ഒരുമിച്ച് ഉത്തരവാദിത്വനിഷേധത്തിൽ ഉൾപ്പെടുത്തുന്ന മൂലപാഠത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: מֵעִם יְהוָה
  choice: യഹ്‌വെയുടെ മുമ്പാകെ
  rationale: യഹ്‌വെ സാക്ഷിയും ന്യായാധിപനുമായിരിക്കുന്ന ബന്ധത്തിൽ കുറ്റമില്ലായ്മ പ്രഖ്യാപിക്കുന്ന ന്യായവിധിസംബന്ധമായ ഭാവം ഈ മലയാളപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: പ്രഖ്യാപനത്തിന്റെ ശാശ്വതവും തുടർച്ചയുമായ പ്രാബല്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מִדְּמֵי
  choice: രക്തച്ചൊരിച്ചിലിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘രക്തങ്ങളിൽനിന്ന്’ എന്ന ബഹുവചനരൂപമാണെങ്കിലും, ഇവിടെ കൊലപാതകത്തിന്റെയോ രക്തച്ചൊരിച്ചിലിന്റെയോ ഉത്തരവാദിത്വത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണ്; മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ‘രക്തച്ചൊരിച്ചിലിൽ’ ഉപയോഗിച്ചു.
- source_word: אַבְנֵר בֶּן נֵר
  choice: നേരിന്റെ മകനായ അബ്നേർ
  rationale: ഹീബ്രു പിതൃനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുകയും വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָה-യുടെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: ദാവീദിന്റെയും അവന്റെ രാജ്യത്തിന്റെയും രക്തക്കുറ്റത്തിൽനിന്നുള്ള വിമുക്തി
  choice: ‘യഹ്‌വെയുടെ മുമ്പാകെ എന്നേക്കും കുറ്റമില്ലാത്തവർ’ എന്ന പ്രഖ്യാപനം അതിന്റെ പൂർണ ശക്തിയോടെ നിലനിർത്തി
  alternative: ഇത് ദാവീദിന്റെ ഉദ്ദേശശുദ്ധിയെക്കുറിച്ചുള്ള പരിമിത പ്രസ്താവനയായി വിശദീകരിക്കുക
  rationale: മൂലപാഠം ദാവീദിന്റെ അവകാശവാദത്തെ വിശദീകരിക്കുകയോ വിലയിരുത്തുകയോ ചെയ്യുന്നില്ല; അതിനാൽ അതിലെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. നിയമപരമായ ‘കുറ്റമില്ലായ്മ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിച്ചപ്പോൾ, ദാവീദിന്റെ രാജ്യത്തെ വ്യക്തിവൽക്കരിക്കുന്ന മൂലരൂപവും പ്രഖ്യാപനത്തിന്റെ ദൈവസന്നിധിയിലുള്ള ഗൗരവവും നിലനിർത്തി.
