- from: 'അതിനുശേഷം[a] ദാവീദ് അതിനെക്കുറിച്ചു കേട്ടപ്പോൾ പറഞ്ഞു: “നേരിന്റെ മകനായ അബ്നേരിന്റെ രക്തച്ചൊരിച്ചിലിൽ[b] ഞാനും എന്റെ രാജ്യവും യഹ്‌വെയുടെ മുമ്പാകെ എന്നേക്കും കുറ്റമില്ലാത്തവരാണ്.”'
  to: 'അതിനുശേഷം[a] ദാവീദ് അതിനെക്കുറിച്ചു കേട്ടപ്പോൾ പറഞ്ഞു: “നേരിന്റെ മകനായ അബ്നേരിന്റെ രക്തം ചൊരിഞ്ഞതിന്റെ കാര്യത്തിൽ[b] ഞാനും എന്റെ രാജ്യവും യഹ്‌വെയുടെ മുമ്പാകെ എന്നേക്കും കുറ്റമില്ലാത്തവരാണ്.”'
  rationale: ‘രക്തച്ചൊരിച്ചിൽ’ എന്ന പൊതുപദം അബ്നേരിന്റെ രക്തമാണോ അബ്നേർ നടത്തിയ രക്തച്ചൊരിച്ചിലാണോ എന്ന അവ്യക്തത സൃഷ്ടിക്കാം. പരിഷ്കാരം മൂലപാഠത്തിലെ രക്തക്കുറ്റ/ഉത്തരവാദിത്വസൂചന വ്യക്തമായി നിലനിർത്തുന്നു; ദാവീദിന്റെ അവകാശവാദത്തെ വിലയിരുത്തുകയോ അധിക വ്യാഖ്യാനം ചേർക്കുകയോ ചെയ്യുന്നില്ല.
