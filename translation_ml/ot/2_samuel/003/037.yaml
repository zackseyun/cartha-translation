id: 2SA.3.37
reference: 2 Samuel 3:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּדְע֧וּ כָל הָ/עָ֛ם וְ/כָל יִשְׂרָאֵ֖ל בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י לֹ֤א הָיְתָה֙ מֵֽ/הַ/מֶּ֔לֶךְ לְ/הָמִ֖ית אֶת אַבְנֵ֥ר בֶּן נֵֽר־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
translation:
  language: ml
  text: അങ്ങനെ, അബ്നേർ എന്ന നേരിന്റെ മകനെ കൊന്നത് രാജാവിൽനിന്ന് ഉണ്ടായതല്ലെന്ന് അന്നു സകല ജനവും യിസ്രായേൽ മുഴുവനും അറിഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു വിവർത്തനം: “അബ്നേർ എന്ന നേരിന്റെ മകനെ കൊല്ലാൻ രാജാവ് കല്പിച്ചിരുന്നില്ല.” എബ്രായം കാര്യത്തിന്റെ ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדְעוּ
  choice: അറിഞ്ഞു
  rationale: ידע എന്ന ക്രിയ ഇവിടെ ഒരു വസ്തുത തിരിച്ചറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു; ‘അറിഞ്ഞു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: כָל הָעָם
  choice: സകല ജനവും
  rationale: കൂടിവന്ന പൊതുജനങ്ങളെ കൂട്ടായ നിലയിൽ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וְכָל יִשְׂרָאֵל
  choice: യിസ്രായേൽ മുഴുവനും
  rationale: എബ്രായത്തിലെ ദേശീയ-കൂട്ടായ പ്രയോഗം നിലനിർത്തുന്നു; മുൻപുള്ള ‘സകല ജനവും’ എന്നതിൽനിന്നുള്ള വ്യത്യാസവും സംരക്ഷിക്കുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നു
  rationale: ‘ആ ദിവസം’ എന്ന കാലസൂചനയുടെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: כִּי
  choice: എന്ന്
  rationale: അവർ അറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന പരോക്ഷവാക്യഘടനയ്ക്ക് മലയാളത്തിൽ ‘എന്ന്’ യോജിക്കുന്നു.
- source_word: לֹא הָיְתָה מֵהַמֶּלֶךְ
  choice: രാജാവിൽനിന്ന് ഉണ്ടായതല്ല
  rationale: מן സൂചിപ്പിക്കുന്ന ഉറവിടം/ഉത്ഭവം സംരക്ഷിക്കുന്നു; രാജാവിന്റെ നിരപരാധിത്വമോ കല്പനയുടെ അഭാവമോ എന്ന് വ്യാഖ്യാനിച്ച് കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: לְהָמִית
  choice: കൊന്നത്
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ മരണത്തിന് കാരണമാകുക എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഔപചാരിക വധശിക്ഷ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: אֶת אַבְנֵר בֶּן נֵר
  choice: അബ്നേർ എന്ന നേരിന്റെ മകനെ
  rationale: പേരുകളും പിതൃനാമബന്ധവും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളഘടന.
theological_decisions:
- issue: അബ്നേരിന്റെ മരണത്തിൽ ദാവീദിന്റെ ഉത്തരവാദിത്വത്തെക്കുറിച്ചുള്ള സൂചനയുടെ പരിധി
  choice: കൊല രാജാവിൽനിന്ന് ഉണ്ടായതല്ലെന്ന ഉറവിടസംബന്ധമായ പ്രസ്താവന നിലനിർത്തി.
  alternative: രാജാവ് നിരപരാധിയായിരുന്നു; അല്ലെങ്കിൽ രാജാവ് അതിന് കല്പിച്ചിരുന്നില്ല.
  rationale: എബ്രായവാക്യം നിയമപരമായ നിരപരാധിത്വമോ കല്പനയുടെ അഭാവമോ നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല; സംഭവം രാജാവിൽനിന്ന് ഉത്ഭവിച്ചതല്ലെന്ന പരിമിതമായ അവകാശവാദമാണ് നടത്തുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘രാജാവിൽനിന്ന് ഉണ്ടായതല്ല’ എന്ന പ്രയോഗം എബ്രായത്തിലെ ഉറവിടസൂചനയും അതിലെ യഥാർഥമായ വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തുന്നു.
