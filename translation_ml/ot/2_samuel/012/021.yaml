translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. രാജാവിനോടുള്ള ഭൃത്യന്മാരുടെ ആദരം സൂചിപ്പിക്കാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ ആശ്ചര്യഭരിതമായ ചോദ്യം നിലനിർത്തി.
