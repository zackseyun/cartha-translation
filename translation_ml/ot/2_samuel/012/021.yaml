reference: 2 Samuel 12:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ עֲבָדָי/ו֙ אֵלָ֔י/ו מָֽה הַ/דָּבָ֥ר הַ/זֶּ֖ה אֲשֶׁ֣ר עָשִׂ֑יתָה בַּ/עֲב֞וּר הַ/יֶּ֤לֶד חַי֙ צַ֣מְתָּ וַ/תֵּ֔בְךְּ וְ/כַֽ/אֲשֶׁר֙ מֵ֣ת הַ/יֶּ֔לֶד קַ֖מְתָּ וַ/תֹּ֥אכַל לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ ഭൃത്യന്മാർ അവനോട് പറഞ്ഞു: “അങ്ങ് ചെയ്ത ഈ കാര്യം എന്താണ്? കുഞ്ഞ് ജീവനോടിരുന്നപ്പോൾ അങ്ങ് ഉപവസിച്ചു കരഞ്ഞു; എന്നാൽ കുഞ്ഞ് മരിച്ചപ്പോൾ അങ്ങ് എഴുന്നേറ്റ് അപ്പം കഴിച്ചു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ “അപ്പം കഴിച്ചു”; ഇത് ഭക്ഷണം കഴിക്കുക, അഥവാ ആഹാരം കഴിക്കുക എന്നർഥമുള്ള ഒരു പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ עֲבָדָיו אֵלָיו
  choice: അപ്പോൾ അവന്റെ ഭൃത്യന്മാർ അവനോട് ചോദിച്ചു
  rationale: വാവ് തുടർന്നുള്ള സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമാണ്. രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിൽ עֲבָדִים എന്നതിന് ‘ഭൃത്യന്മാർ’ യോജിക്കുന്നു. തുടർന്നുവരുന്നത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ‘ചോദിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה
  choice: അങ്ങ് ചെയ്ത ഈ കാര്യം എന്താണ്?
  rationale: എബ്രായത്തിലെ മൂർത്തമായ ചോദ്യരൂപവും ഭൃത്യന്മാരുടെ ആശ്ചര്യവും നിലനിർത്തുന്നു. രാജാവിനോടുള്ള അഭിസംബോധനയ്ക്ക് ആധുനികവും ആദരസൂചകവുമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  choice: കുഞ്ഞ് ജീവനോടിരുന്നപ്പോൾ
  rationale: ഇവിടെ בַּעֲבוּר എന്നത് അടുത്ത വിരുദ്ധഘടനയോടൊപ്പം സാഹചര്യപരവും കാലപരവുമായ അർഥം നൽകുന്നു. ശിശുവിന്റെ പശ്ചാത്തലത്തിൽ הַיֶּלֶד എന്നതിന് ‘കുഞ്ഞ്’ യോജിക്കുന്നു.
- source_word: צַמְתָּ וַתֵּבְךְּ
  choice: അങ്ങ് ഉപവസിച്ചു കരഞ്ഞു
  rationale: രണ്ടു ക്രിയകളുടെയും നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: וְכַאֲשֶׁר מֵת הַיֶּלֶד
  choice: എന്നാൽ കുഞ്ഞ് മരിച്ചപ്പോൾ
  rationale: മുൻവാക്യത്തോടുള്ള ശക്തമായ വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; מֵת എന്ന ചലനാത്മക ക്രിയയെ ‘മരിച്ചു’ എന്നു നിലനിർത്തുന്നു.
- source_word: קַמְתָּ וַתֹּאכַל לָחֶם
  choice: അങ്ങ് എഴുന്നേറ്റ് അപ്പം കഴിച്ചു
  rationale: קום എന്നതിന് സന്ദർഭോചിതമായി ‘എഴുന്നേറ്റ്’ എന്നും, എബ്രായത്തിലെ മൂർത്തമായ לֶחֶם എന്ന പദം ‘അപ്പം’ എന്നും പരിഭാഷപ്പെടുത്തി; അതിന്റെ വിശാലമായ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
