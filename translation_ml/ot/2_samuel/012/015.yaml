id: 2SA.12.15
reference: 2 Samuel 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ נָתָ֖ן אֶל בֵּית֑/וֹ וַ/יִּגֹּ֣ף יְהוָ֗ה אֶת הַ/יֶּ֜לֶד אֲשֶׁ֨ר יָלְדָ֧ה אֵֽשֶׁת אוּרִיָּ֛ה לְ/דָוִ֖ד וַ/יֵּאָנַֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/015.yaml
  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
translation:
  language: ml
  text: പിന്നെ നാഥാൻ തന്റെ വീട്ടിലേക്കു പോയി. യാഹ്‌വേ ഊരിയാവിന്റെ ഭാര്യ ദാവീദിനു പ്രസവിച്ച കുഞ്ഞിനെ പ്രഹരിച്ചു; അവൻ രോഗിയായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പിന്നെ ... പോയി
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘പിന്നെ’ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֵּיתוֹ
  choice: തന്റെ വീട്ടിലേക്കു
  rationale: സന്ദർഭത്തിൽ പ്രതിപാദ്യം നാഥാനായതിനാൽ പ്രത്യാവർത്തകമായ ‘തന്റെ’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്; ‘വീട്’ എന്ന മൂർത്തമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: וַיִּגֹּף
  choice: പ്രഹരിച്ചു
  rationale: נָגַף എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന അർഥവും ദോഷകരമായ ഫലവും നിലനിർത്തുന്നു; രോഗത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: הַיֶּלֶד
  choice: കുഞ്ഞ്
  rationale: ഇവിടെ സൂചിപ്പിക്കുന്നത് നവജാതനോ വളരെ ചെറുപ്പമുള്ള കുട്ടിയോ ആയതിനാൽ ‘കുഞ്ഞ്’ സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്.
- source_word: אֲשֶׁר יָלְדָה אֵשֶׁת אוּרִיָּה לְדָוִד
  choice: ഊരിയാവിന്റെ ഭാര്യ ദാവീദിനു പ്രസവിച്ച
  rationale: എബ്രായത്തിലെ ബന്ധവാക്യവും ‘ഊരിയാവിന്റെ ഭാര്യ’ എന്ന ഉദ്ദേശപൂർവമായ വിശേഷണവും നിലനിർത്തുന്നു; ബത്ത്‌ശേബയുടെ പേര് പകരം ചേർക്കുന്നില്ല.
- source_word: וַיֵּאָנַשׁ
  choice: രോഗബാധിതനായി
  rationale: കുഞ്ഞ് രോഗിയായിത്തീർന്നതിനെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ പുരുഷലിംഗ ഏകവചന സൂചന മലയാളത്തിൽ കുഞ്ഞിലേക്കു വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; ‘അതീവ’ അല്ലെങ്കിൽ ‘മാരകമായി’ എന്ന ശക്തീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: കുഞ്ഞിന്റെ രോഗത്തിൽ ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനം
  choice: യഹോവ ... കുഞ്ഞിനെ പ്രഹരിച്ചു
  alternative: യഹോവ കുഞ്ഞിനെ ബാധിച്ചു
  rationale: പ്രവർത്തനം യഹോവയ്ക്കു നേരിട്ട് ആപാദിക്കുന്ന എബ്രായവാക്യം മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു; അതേസമയം പ്രഹാരത്തിന്റെ കൃത്യസ്വഭാവം അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- issue: ബത്ത്‌ശേബയെ സൂചിപ്പിക്കുന്ന രീതി
  choice: ഊരിയാവിന്റെ ഭാര്യ
  alternative: ബത്ത്‌ശേബ
  rationale: ഈ സന്ദർഭത്തിൽ സ്ത്രീയുടെ പേര് പറയാതെ ‘ഊരിയാവിന്റെ ഭാര്യ’ എന്നു വിളിക്കുന്ന ആഖ്യാനത്തിലെ ധാർമിക സംഘർഷവും ഊന്നലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. നീണ്ട എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; പ്രവർത്തനക്രമവും ദൈവിക കർത്തൃത്വവും മാറ്റിയിട്ടില്ല. ‘ഊരിയാവിന്റെ ഭാര്യ’ എന്ന മൂലപാഠത്തിലെ ഉദ്ദേശപൂർവമായ പരാമർശം അതേപടി സംരക്ഷിച്ചു.
