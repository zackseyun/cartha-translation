revisions:
- from: പിന്നെ നാഥാൻ തന്റെ വീട്ടിലേക്കു പോയി. യഹോവ ഊരിയാവിന്റെ ഭാര്യ ദാവീദിനു പ്രസവിച്ച കുഞ്ഞിനെ പ്രഹരിച്ചു; കുഞ്ഞ് രോഗബാധിതനായി.[a]
