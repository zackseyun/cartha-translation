revisions:
- from: അവിടെയുണ്ടായിരുന്ന ജനത്തെ അവൻ പുറത്തുകൊണ്ടുവന്ന്, അവരെ ഈർച്ചവാളുകൾകൊണ്ടും[a] ഇരുമ്പുകൂന്താലികൾകൊണ്ടും ഇരുമ്പുകോടാലികൾകൊണ്ടും പണിയെടുപ്പിച്ചു; ഇഷ്ടികച്ചൂളയിലും അവരെക്കൊണ്ട് വേല ചെയ്യിച്ചു.[b] അമ്മോന്യരുടെ എല്ലാ പട്ടണങ്ങളോടും അവൻ ഇങ്ങനെതന്നെ ചെയ്തു.[c] പിന്നെ ദാവീദും സകലജനവും യെരൂശലേമിലേക്കു മടങ്ങി.
