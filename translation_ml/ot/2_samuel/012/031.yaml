source:
  edition: WLC
  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֣שֶׂם בַּ֠/מְּגֵרָה וּ/בַ/חֲרִצֵ֨י הַ/בַּרְזֶ֜ל וּֽ/בְ/מַגְזְרֹ֣ת הַ/בַּרְזֶ֗ל וְ/הֶעֱבִ֤יר אוֹתָ/ם֙ ב/מלכן וְ/כֵ֣ן יַעֲשֶׂ֔ה לְ/כֹ֖ל עָרֵ֣י בְנֵֽי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛ד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/031.yaml
  text: And he brought out the people who were in it and put them to work with saws[a], iron picks, and iron axes, and made them labor at the brick kiln. Thus he did to all the cities of the Ammonites[c][b]. Then David and all the people returned to Jerusalem.
translation:
  language: ml
  text: അവിടെയുണ്ടായിരുന്ന ജനത്തെ അവൻ പുറത്തുകൊണ്ടുവന്ന്, അവരെ ഈർച്ചവാളുകൾകൊണ്ടും[a] ഇരുമ്പുകൂന്താലികൾകൊണ്ടും ഇരുമ്പുകോടാലികൾകൊണ്ടും നിർബന്ധിതവേല ചെയ്യിച്ചു; ഇഷ്ടികച്ചൂളയിലും അവരെക്കൊണ്ട് വേല ചെയ്യിച്ചു.[b] അമ്മോന്യരുടെ എല്ലാ പട്ടണങ്ങളോടും അവൻ ഇങ്ങനെതന്നെ ചെയ്തു.[c] പിന്നെ ദാവീദും സകലജനവും യെരൂശലേമിലേക്കു മടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവരെ ഈർച്ചവാളിനരികിലും ഇരുമ്പുകൊണ്ടുള്ള മൂർച്ചയേറിയ ഉപകരണങ്ങൾക്കരികിലും ഇരുമ്പുമുറിക്കൽ ഉപകരണങ്ങൾക്കരികിലും നിർത്തി.” ഇവിടെ പറയുന്ന ഉപകരണങ്ങളുടെ കൃത്യമായ പേരുകൾ അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠം ഇവിടെ ദുഷ്കരമാണ്. പരമ്പരാഗതമായി, “അവരെ ഇഷ്ടികച്ചൂളയിലൂടെ കടത്തിച്ചു” എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്; ചിലർ ഇത് നിർബന്ധിതവേലയല്ല, വധശിക്ഷയാണെന്നു മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: സമാനമായി ദുഷ്കരമായ ഭാഷയുള്ള സമാന്തരവിവരണത്തിന് 1 ദിനവൃത്താന്തം 20:3 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: הוֹצִיא
  choice: പുറത്തുകൊണ്ടുവന്ന്
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫ്ഈൽ രൂപം ‘പുറത്തുകൊണ്ടുവരുക/നയിച്ചുകൊണ്ടുവരുക’ എന്ന കാരകാർഥം നൽകുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: וַיָּשֶׂם
  choice: പണിയെടുപ്പിച്ചു
  rationale: പദശഃ ‘വെച്ചു/നിയോഗിച്ചു’ എന്നാണ്. ഉപകരണങ്ങളുടെ പട്ടികയോടുചേർന്ന ഈ സന്ദർഭത്തിൽ കീഴടക്കപ്പെട്ടവരെ നിർബന്ധിതവേലയ്ക്കു നിയോഗിച്ചു എന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; വധമെന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בַּמְּגֵרָה
  choice: ഈർച്ചവാളുകൾകൊണ്ടും
  rationale: מְגֵרָה ഈർച്ചവാളിനെ സൂചിപ്പിക്കുന്നു. ഏകവചനം ഉപകരണവർഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി ഗ്രഹിച്ച് മലയാളത്തിൽ ബഹുവചനമായി നൽകിയിരിക്കുന്നു.
- source_word: בַחֲרִצֵי הַבַּרְזֶל
  choice: ഇരുമ്പുകൂന്താലികൾകൊണ്ടും
  rationale: ഈ ദുഷ്കരപദം മൂർച്ചയുള്ള ഇരുമ്പുപകരണങ്ങളെയോ മെതിവണ്ടികളെയോ സൂചിപ്പിക്കാം. തൊഴിൽസന്ദർഭത്തിൽ ‘ഇരുമ്പുകൂന്താലികൾ’ സാദ്ധ്യവും വായനാസൗകര്യമുള്ളതുമാണ്; കൃത്യമായ ഉപകരണനാമത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְמַגְזְרֹת הַבַּרְזֶל
  choice: ഇരുമ്പുകോടാലികൾകൊണ്ടും
  rationale: മുറിക്കാനുള്ള ഇരുമ്പുപകരണങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദമാണ്. ഉപകരണപ്പട്ടികയിൽ ‘ഇരുമ്പുകോടാലികൾ’ സ്വാഭാവികമായ വ്യക്തമായ പരിഭാഷയാണ്; പദത്തിന്റെ വിശാലാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְהֶעֱבִיר אֹתָם
  choice: അവരെക്കൊണ്ട് വേല ചെയ്യിച്ചു
  rationale: പദശഃ ‘അവരെ കടത്തിച്ചു’ എന്നാകാമെങ്കിലും, തുടർന്നുള്ള ദുഷ്കരപദത്തോടൊപ്പം നിർബന്ധിത തൊഴിൽ ചെയ്യിച്ചു എന്ന സന്ദർഭോചിത വായനയാണ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചത്. മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: במלכן
  choice: ഇഷ്ടികച്ചൂളയിലും
  rationale: വ്യഞ്ജനപാഠം ദുഷ്കരമാണ്. 1 ദിനവൃത്താന്തം 20:3-ലെ സമാന്തരവിവരണവും തൊഴിൽസന്ദർഭവും കണക്കിലെടുത്ത് ഇഷ്ടികനിർമാണവുമായി ബന്ധപ്പെട്ട സ്ഥലമെന്ന വായന സ്വീകരിച്ചു; ‘ഇഷ്ടികച്ചൂളയിലൂടെ കടത്തിച്ചു’ എന്ന പരമ്പരാഗത വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְכֵן יַעֲשֶׂה
  choice: ഇങ്ങനെതന്നെ ചെയ്തു
  rationale: അമ്മോന്യപട്ടണങ്ങളോടുള്ള ദാവീദിന്റെ നടപടിയെ സംഗ്രഹിക്കുന്ന സ്വാഭാവിക മലയാള ആഖ്യാനപ്രയോഗം.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ എല്ലാ പട്ടണങ്ങളോടും
  rationale: בְנֵי עַמּוֹן എന്ന ജനനാമത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം ‘അമ്മോന്യർ’ ആണ്.
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: യെരൂശലേമിലേക്കു മടങ്ങി
  rationale: ലക്ഷ്യസ്ഥാനം ചേർന്ന שוב എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ദാവീദ് അമ്മോന്യ തടവുകാരെ ഉപകരണങ്ങളും ചൂളയും ഉപയോഗിച്ച് വധിച്ചോ, അതോ കഠിനമായ നിർബന്ധിതവേലയ്ക്കു നിയോഗിച്ചോ എന്ന ചോദ്യം
  choice: ഈർച്ചവാളുകളും ഇരുമ്പുപകരണങ്ങളും ഉപയോഗിച്ചും ഇഷ്ടികച്ചൂളയിലും അവരെക്കൊണ്ട് നിർബന്ധിതവേല ചെയ്യിച്ചു
  alternative: അവരെ ഈർച്ചവാളുകൾക്കും ഇരുമ്പുപകരണങ്ങൾക്കും വിധേയരാക്കി, ഇഷ്ടികച്ചൂളയിലൂടെ കടത്തിക്കൊണ്ട് വധിച്ചു
  rationale: וַיָּשֶׂם, וְהֶעֱבִיר, במלכן എന്നീ പ്രയോഗങ്ങൾ വ്യാകരണപരവും പാഠപരവുമായി ദുഷ്കരമാണ്. കീഴടക്കപ്പെട്ട ജനത്തെ അധ്വാനസേവനത്തിനു നിയോഗിക്കുന്ന സന്ദർഭവും 1 ദിനവൃത്താന്തം 20:3-ലെ സമാന്തരവിവരണവും പരിഗണിച്ച് തൊഴിൽവായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു. എന്നാൽ വധത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത വായന യഥാർഥ സാദ്ധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പണിയെടുപ്പിച്ചു’, ‘വേല ചെയ്യിച്ചു’ എന്നീ പ്രയോഗങ്ങൾ നിർബന്ധിത അധ്വാനത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു; എന്നാൽ മൂലപാഠത്തിലെ വധം/വേല എന്ന നിർണായക അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
