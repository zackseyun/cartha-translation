id: 2SA.12.10
reference: 2 Samuel 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹא תָס֥וּר חֶ֛רֶב מִ/בֵּיתְ/ךָ֖ עַד עוֹלָ֑ם עֵ֚קֶב כִּ֣י בְזִתָ֔/נִי וַ/תִּקַּ֗ח אֶת אֵ֨שֶׁת֙ אוּרִיָּ֣ה הַ/חִתִּ֔י לִ/הְי֥וֹת לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
translation:
  language: ml
  text: അതുകൊണ്ട് ഇപ്പോൾ, വാൾ നിന്റെ ഭവനത്തിൽനിന്ന്[a] ഒരിക്കലും വിട്ടുമാറുകയില്ല. കാരണം നീ എന്നെ നിന്ദിക്കുകയും[b] ഹിത്യനായ ഊരിയാവിന്റെ ഭാര്യയെ നിന്റെ ഭാര്യയാക്കാൻ എടുക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ കുടുംബത്തിൽനിന്ന്’ എന്നോ ‘നിന്റെ രാജവംശത്തിൽനിന്ന്’ എന്നോ പരിഭാഷപ്പെടുത്താം; ‘ഭവനം’ എന്ന എബ്രായപ്രയോഗത്തിൽ കുടുംബവും രാജവംശവും ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘നീ എന്നെ നിന്ദിച്ചു.’ ഊരിയാവിനും അവന്റെ ഭാര്യയ്ക്കുമെതിരായ കുറ്റം ദൈവത്തോടുതന്നെയുള്ള അവജ്ഞയായാണ് ഇവിടെ അവതരിപ്പിക്കുന്നത്.'
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: മുൻവിധിയിൽനിന്ന് തുടർന്നുവരുന്ന ന്യായവിധിയുടെ കാലപരവും നിഗമനപരവുമായ ഭാവങ്ങൾ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: לֹא תָסוּר ... עַד עוֹלָם
  choice: ഒരിക്കലും വിട്ടുമാറുകയില്ല
  rationale: סור എന്ന ക്രിയയുടെ ‘വിട്ടുമാറുക’ എന്ന അർഥവും עַד עוֹלָם നൽകുന്ന ദീർഘകാല നിഷേധബലവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חֶרֶב
  choice: വാൾ
  rationale: അക്രമത്തിന്റെയും സംഘർഷത്തിന്റെയും ന്യായവിധിയുടെയും മൂർത്തരൂപമായ ഉറവിടപദം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מִבֵּיתְךָ
  choice: നിന്റെ ഭവനത്തിൽനിന്ന്
  rationale: കുടുംബം, ഗൃഹം, രാജവംശം എന്നിവ ഉൾക്കൊള്ളാവുന്ന ‘ഭവനം’ എന്ന രൂപകം നിലനിർത്തി അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: עֵקֶב כִּי
  choice: കാരണം
  rationale: പ്രഖ്യാപിച്ച ന്യായവിധിയുടെ കാരണം ലളിതവും വ്യക്തവുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: בְזִתָנִי
  choice: നീ എന്നെ നിന്ദിക്കുകയും
  rationale: ദൈവത്തോടുള്ള വ്യക്തിപരമായ അവജ്ഞയെ സൂചിപ്പിക്കുന്ന ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וַתִּקַּח
  choice: എടുക്കുകയും ചെയ്തു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെ മുൻവാക്യത്തിലെ കുറ്റാരോപണത്തോടു സമാന്തരമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: ഹിത്യനായ ഊരിയാവിന്റെ ഭാര്യ
  rationale: അവൾക്ക് ഊരിയാവുമായുണ്ടായിരുന്ന വിവാഹബന്ധത്തിന് ഉറവിടവാക്യം നൽകുന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: לִהְיוֹת לְךָ לְאִשָּׁה
  choice: നിന്റെ ഭാര്യയാക്കാൻ
  rationale: വിവാഹത്തിനായി ഒരാളെ സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യരൂപം.
theological_decisions:
- issue: ‘നീ എന്നെ നിന്ദിച്ചു’ എന്നതിലെ ഒന്നാംപുരുഷ സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ദൈവത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ‘എന്നെ’ നിലനിർത്തി
  alternative: ‘യഹോവയുടെ വചനത്തെ/കല്പനയെ നീ നിന്ദിച്ചു’ എന്ന വ്യാഖ്യാനവികാസം
  rationale: എബ്രായപാഠത്തിൽ ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം നേരിട്ടുണ്ട്. ഊരിയാവിനും അവന്റെ ഭാര്യയ്ക്കുമെതിരായ ദാവീദിന്റെ പാപം ദൈവത്തോടുള്ള അവജ്ഞയായി അവതരിപ്പിക്കുന്ന ദൈവശാസ്ത്രപരമായ ഭാരം വികസിപ്പിക്കാതെയും ലഘൂകരിക്കാതെയും നിലനിർത്തുന്നു.
- issue: ‘നിന്റെ ഭവനം’ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘ഭവനം’ എന്ന വിശാലരൂപകം നിലനിർത്തി
  alternative: ‘കുടുംബം’ അല്ലെങ്കിൽ ‘രാജവംശം’ എന്നു മാത്രമായി നിർവചിക്കൽ
  rationale: ഉറവിടത്തിലെ בַּיִת കുടുംബത്തെയും ഗൃഹത്തെയും രാജവംശത്തെയും ഉൾക്കൊള്ളാം; അവയിൽ ഒന്നിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ യഥാർഥമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഭവനം’, ‘വാൾ’, ‘നിന്ദിക്കുക’ എന്നീ പദങ്ങൾ ഉറവിടത്തിലെ രൂപകവും ദൈവശാസ്ത്രപരമായ തീവ്രതയും നിലനിർത്തുന്നു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ചേർത്തു.
