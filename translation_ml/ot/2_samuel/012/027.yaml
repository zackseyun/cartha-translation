source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח יוֹאָ֛ב מַלְאָכִ֖ים אֶל דָּוִ֑ד וַ/יֹּ֨אמֶר֙ נִלְחַ֣מְתִּי בְ/רַבָּ֔ה גַּם לָכַ֖דְתִּי אֶת עִ֥יר הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/027.yaml
  text: Then Joab sent messengers to David and said[a], “I have fought against Rabbah; I have also captured the city of waters.”
translation:
  language: ml
  text: 'അപ്പോൾ യോവാബ് ദാവീദിന്റെ അടുക്കൽ ദൂതന്മാരെ അയച്ച് പറഞ്ഞു: “ഞാൻ രബ്ബയ്ക്കെതിരെ യുദ്ധം ചെയ്തു; ജലനഗരവും[a] പിടിച്ചെടുത്തു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ജലത്തിന്റെ നഗരം.” ഇത് രബ്ബയുടെ ജലവിതരണം നിയന്ത്രിച്ചിരുന്ന ഭാഗത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അപ്പോൾ ... അയച്ചു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഇവിടെ ദാവീദിന് യുദ്ധവിവരം അറിയിക്കാൻ അയച്ച മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נִלְחַמְתִּי בְרַבָּה
  choice: ഞാൻ രബ്ബയ്ക്കെതിരെ യുദ്ധം ചെയ്തു
  rationale: നഗരത്തിനെതിരായ സൈനികനടപടിയാണ് സന്ദർഭം; പൂർത്തിയായ പ്രവൃത്തിയെ മലയാളത്തിൽ ലളിത ഭൂതകാലം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: רַבָּה
  choice: രബ്ബ
  rationale: സ്ഥലനാമം മൂലഭാഷയോടടുത്ത് ലിപ്യന്തരണം ചെയ്യുന്നു; ‘അമ്മോന്യരുടെ രബ്ബ’ എന്ന വിശദീകരണം സമീപസന്ദർഭത്തിൽ നിന്നു വ്യക്തമാണ്.
- source_word: גַּם
  choice: -വും
  rationale: ആദ്യ സൈനികനേട്ടത്തോടൊപ്പം രണ്ടാമത്തേതും ചേർക്കുന്ന additive അർഥം മലയാളത്തിലെ ‘-വും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָכַדְתִּי
  choice: പിടിച്ചെടുത്തു
  rationale: സൈനികമായി ഒരു നഗരഭാഗം കൈവശപ്പെടുത്തിയെന്ന അർഥം വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാണ്.
- source_word: עִיר הַמָּיִם
  choice: ജലനഗരം
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും സാധ്യതയുള്ള അർഥദ്വയവും നിലനിർത്തുന്നു; ജലവിതരണം നിയന്ത്രിച്ച നഗരഭാഗമെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
