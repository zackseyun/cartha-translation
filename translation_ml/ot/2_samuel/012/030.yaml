  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וּ/מִשְׁקָלָ֨/הּ כִּכַּ֤ר זָהָב֙ וְ/אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑ד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
translation:
  language: ml
  text: അവൻ അവരുടെ രാജാവിന്റെ തലയിൽനിന്ന് കിരീടം എടുത്തു[a]. അതിന്റെ തൂക്കം ഒരു താലന്ത് സ്വർണമായിരുന്നു; അതിൽ ഒരു വിലയേറിയ രത്നവും ഉണ്ടായിരുന്നു. ആ കിരീടം ദാവീദിന്റെ തലയിൽ വെക്കപ്പെട്ടു[b]. നഗരത്തിലെ കൊള്ളമുതൽ അവൻ വളരെ വലിയ അളവിൽ പുറത്തുകൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മിൽക്കോമിന്റെ കിരീടം” (മൽക്കാം എന്നും എഴുതപ്പെടുന്നു). ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം അമ്മോന്യരുടെ ദേവന്റെ പേരായോ “അവരുടെ രാജാവ്” എന്നോ വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: താലന്ത് വളരെ വലിയ ഒരു പുരാതന ഭാരയൂണിറ്റായിരുന്നു. അത് ഏകദേശം 34 കിലോഗ്രാം എന്നു പലപ്പോഴും കണക്കാക്കപ്പെടുന്നു; എങ്കിലും പുരാതനകാലത്തെ കൃത്യമായ അളവുകൾ വ്യത്യസ്തമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: കിരീടം
  rationale: രാജകീയ ശിരോഭൂഷണം എന്ന അർഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: מַלְכָּם
  choice: അവരുടെ രാജാവ്
  rationale: ലഭ്യമായ രൂപവിശകലനവും ‘അവന്റെ തലയിൽനിന്ന്’ എന്ന തുടർന്നുള്ള പ്രയോഗവും സാധാരണനാമ വായനയെ പിന്തുണയ്ക്കുന്നു; ദേവനാമവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מֵעַל רֹאשׁוֹ
  choice: അവന്റെ തലയിൽനിന്ന്
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി ദിശാസൂചന നൽകുന്നു; ‘മേൽനിന്ന്’ ചേർക്കുന്നത് ഇവിടെ അനാവശ്യമായ ആവർത്തനമാകും.
- source_word: כִּכַּר זָהָב
  choice: ഒരു താലന്ത് സ്വർണം
  rationale: പുരാതന ഭാരയൂണിറ്റായ כִּכָּר എന്നത് പരമ്പരാഗതമായി ‘താലന്ത്’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְאֶבֶן יְקָרָה
  choice: അതിൽ ഒരു വിലയേറിയ രത്നവും ഉണ്ടായിരുന്നു
  rationale: ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തമാണെങ്കിലും രത്നത്തിനും കിരീടത്തിനുമിടയിലെ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ഘടിപ്പിച്ച രീതിയെക്കുറിച്ച് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִד
  choice: ആ കിരീടം ദാവീദിന്റെ തലയിൽ വെച്ചു
  rationale: കിരീടം ദാവീദിന്റെ തലയിൽ എത്തിച്ച സംഭവഫലം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: שְׁלַל הָעִיר
  choice: നഗരത്തിലെ കൊള്ളമുതൽ
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുത്ത സമ്പത്തിനെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ പദം.
- source_word: הוֹצִיא הַרְבֵּה מְאֹד
  choice: വളരെ വലിയ അളവിൽ പുറത്തുകൊണ്ടുവന്നു
  rationale: ഹിഫീൽ ക്രിയയുടെ ‘പുറത്തുകൊണ്ടുവരുക’ എന്ന അടിസ്ഥാനാർഥവും അളവിന്റെ ശക്തമായ ഊന്നലും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: מַלְכָּם എന്നത് ‘അവരുടെ രാജാവ്’ എന്നാണോ അമ്മോന്യദേവനായ ‘മിൽക്കോം/മൽക്കാം’ എന്ന പേരായാണോ വായിക്കേണ്ടത്
  choice: അവരുടെ രാജാവ്
  alternative: മിൽക്കോമിന്റെ (മൽക്കാമിന്റെ) കിരീടം
  rationale: മസോററ്റിക് രൂപവിഭജനവും ഉടൻ വരുന്ന ‘അവന്റെ തലയിൽനിന്ന്’ എന്ന വാക്യഘടനയും രാജാവിനെ സൂചിപ്പിക്കുന്ന വായനയ്ക്ക് നേരിട്ടുള്ള പിന്തുണ നൽകുന്നു. എങ്കിലും ദേവനാമവായന പുരാതനപാഠത്തിന്റെ യഥാർഥ സാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ചരിത്രവിവരണശൈലി. ‘കിരീടം,’ ‘രത്നം,’ ‘കൊള്ളമുതൽ’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങളാണ്. ‘താലന്ത്’ സാംസ്കാരിക-ചരിത്രപരമായ പദമായി നിലനിർത്തി അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
