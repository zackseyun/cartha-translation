source:
  edition: WLC
  text: וָ/אֶתְּנָ֨/ה לְ/ךָ֜ אֶת בֵּ֣ית אֲדֹנֶ֗י/ךָ וְ/אֶת נְשֵׁ֤י אֲדֹנֶ֨י/ךָ֙ בְּ/חֵיקֶ֔/ךָ וָ/אֶתְּנָ֣/ה לְ/ךָ֔ אֶת בֵּ֥ית יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וְ/אִ֨ם מְעָ֔ט וְ/אֹסִ֥פָה לְּ/ךָ֖ כָּ/הֵ֥נָּה וְ/כָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
translation:
  language: ml
  text: ഞാൻ നിന്റെ യജമാനന്റെ ഭവനവും നിന്റെ യജമാനന്റെ ഭാര്യമാരെയും നിന്റെ മടിയിൽ തന്നു[a]. ഇസ്രായേലിന്റെയും യെഹൂദയുടെയും ഭവനവും ഞാൻ നിനക്കു തന്നു. ഇതെല്ലാം പോരായിരുന്നെങ്കിൽ, ഇതുപോലെയുള്ളവയും ഇനിയും അധികവും ഞാൻ നിനക്കു നൽകുമായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “നിന്റെ മടിയിൽ.” ഈ എബ്രായ ശൈലി അടുപ്പമുള്ള സ്വീകരണത്തെയോ കൈവശലഭ്യതയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ഇതുപോലെയുള്ളവയും ഇനിയും അധികവും” എന്നത് അതേ തരത്തിലുള്ള കാര്യങ്ങൾ കൂടുതൽ നൽകുമായിരുന്നു എന്നർഥമുള്ള എബ്രായ ശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: ഞാൻ ... തന്നു
  rationale: נתן എന്ന ക്രിയയുടെ ഖാൽ വയിക്തോൽ രൂപം മുൻകാലത്ത് ദൈവം ദാവീദിനു നൽകിയ അനുഗ്രഹങ്ങളെ തുടർച്ചയായി വിവരിക്കുന്നു; മലയാളത്തിൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: בֵּית אֲדֹנֶיךָ
  choice: നിന്റെ യജമാനന്റെ ഭവനം
  rationale: בַּיִת എന്നതിന് വീട്, കുടുംബം, രാജവംശം, സ്വത്ത് എന്നീ വിശാല അർഥങ്ങൾ വരാം. ‘ഭവനം’ എബ്രായത്തിന്റെ ദൃശ്യരൂപവും ശൗലിന്റെ രാജകീയ ഗൃഹം/സ്വത്ത് എന്ന വിശാലസൂചനയും നിലനിർത്തുന്നു.
- source_word: נְשֵׁי אֲדֹנֶיךָ
  choice: നിന്റെ യജമാനന്റെ ഭാര്യമാർ
  rationale: നേരിട്ടുള്ള സംയുക്തപദപ്രയോഗം. ‘യജമാനൻ’ എന്നു നൽകുന്നത് ഇവിടെ മനുഷ്യനായ മുൻരാജാവിനോടുള്ള ബന്ധം വ്യക്തമാക്കുകയും ദൈവിക സംബോധനയുമായുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּחֵיקֶךָ
  choice: നിന്റെ മടിയിൽ
  rationale: חֵיק എന്നത് നെഞ്ച്/മടി എന്ന ശരീരരൂപകമാണ്. ‘മടിയിൽ’ അടുപ്പമുള്ള സ്വീകരണത്തെയോ കൈവശലഭ്യതയെയോ സൂചിപ്പിക്കുമ്പോഴും വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് തീർക്കുന്നില്ല.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: ഇസ്രായേലിന്റെയും യെഹൂദയുടെയും ഭവനം
  rationale: ‘ഭവനം’ നിലനിർത്തുന്നത് മുൻവാക്യഭാഗത്തോടുള്ള സമാന്തരതയും ജനത/രാജ്യം/രാജകീയ അധികാരം എന്ന വിശാലസൂചനയും സംരക്ഷിക്കുന്നു; ‘രാജ്യം’ എന്നു വ്യക്തമാക്കുന്നത് അനാവശ്യമായ വ്യാഖ്യാനമാകും.
- source_word: וְאִם מְעָט
  choice: ഇതെല്ലാം പോരായിരുന്നെങ്കിൽ
  rationale: അളവിൽ കുറവായിരുന്നുവെങ്കിൽ എന്ന സാങ്കൽപ്പിക അപര്യാപ്തത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאֹסִפָה לְּךָ
  choice: ഞാൻ നിനക്കു നൽകുമായിരുന്നു
  rationale: יסף എന്ന ഹിഫീൽ രൂപത്തിന്റെ അടിസ്ഥാനാർഥം ‘കൂട്ടിച്ചേർക്കുക’ എന്നതാണ്. മുൻപ് നൽകിയവയോടൊപ്പം കൂടുതൽ നൽകുക എന്ന ആശയം മലയാളത്തിലെ ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כָּהֵנָּה וְכָהֵנָּה
  choice: ഇതുപോലെയുള്ളവയും ഇനിയും അധികവും
  rationale: ആവർത്തിച്ച demonstrative പ്രയോഗം ഇതേ തരത്തിലുള്ള കാര്യങ്ങൾ കൂടിയും അതിലധികവും എന്ന അനിശ്ചിതവും സഞ്ചയാത്മകവുമായ അർഥം നൽകുന്നു; നിർദിഷ്ട വസ്തുക്കൾ ചേർക്കാതെ ആ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവം ശൗലിന്റെ ഭാര്യമാരെ ദാവീദിനു നൽകിയെന്ന വാക്കുകൾ ദാമ്പത്യബന്ധത്തിനുള്ള വ്യക്തമായ ദൈവിക അംഗീകാരമായി വ്യാഖ്യാനിക്കണമോ എന്നത്
  choice: ‘നിന്റെ യജമാനന്റെ ഭാര്യമാരെയും നിന്റെ മടിയിൽ തന്നു’ എന്ന എബ്രായരൂപകം നിലനിർത്തി; അംഗീകാരമോ ബന്ധത്തിന്റെ കൃത്യസ്വഭാവമോ വിശദീകരിച്ചില്ല.
  alternative: ‘നിന്റെ യജമാനന്റെ അന്തഃപുരം നിനക്കു നൽകി’ എന്നോ ‘അവരെ നിന്റെ സംരക്ഷണത്തിൽ ഏല്പിച്ചു’ എന്നോ വ്യാഖ്യാനാത്മകമായി നൽകുക.
  rationale: മൂലപാഠം രാജകീയ അനന്തരാവകാശത്തോടും കൈവശലഭ്യതയോടും ബന്ധപ്പെട്ട കൈമാറ്റം പ്രസ്താവിക്കുന്നു, എന്നാൽ അതിന്റെ എല്ലാ സാമൂഹികമോ ദാമ്പത്യമോ ആയ വിശദാംശങ്ങളും നിർവചിക്കുന്നില്ല. അതിനാൽ വാചകത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘ഭവനം,’ ‘മടിയിൽ’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ രൂപകവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; ദീർഘവും കൃത്രിമവുമായ വാക്യഘടന ഒഴിവാക്കാൻ എബ്രായവാക്യം മൂന്ന് മലയാളവാക്യങ്ങളാക്കി.
