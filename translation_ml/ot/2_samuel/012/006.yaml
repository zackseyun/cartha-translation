translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ന്യായവിധി-ശൈലി സ്വീകരിച്ചു. നഷ്ടപരിഹാരത്തിന്റെ നിർബന്ധസ്വഭാവവും പെൺകുഞ്ഞാട് എന്ന ലിംഗസൂചനയും നിലനിർത്തി. חמל എന്ന ക്രിയയിലെ ‘കരുണ കാണിക്കുക/ഉപദ്രവിക്കാതെ വിടുക’ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
