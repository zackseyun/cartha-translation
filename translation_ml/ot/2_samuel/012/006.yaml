source:
  edition: WLC
  text: וְ/אֶת הַ/כִּבְשָׂ֖ה יְשַׁלֵּ֣ם אַרְבַּעְתָּ֑יִם עֵ֗קֶב אֲשֶׁ֤ר עָשָׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/עַ֖ל אֲשֶׁ֥ר לֹֽא חָמָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/006.yaml
  text: And he must repay the ewe lamb fourfold[a], because he did this thing and because he had no pity.
translation:
  language: ml
  text: അവൻ ആ പെൺകുഞ്ഞാടിന് നാലിരട്ടി നഷ്ടപരിഹാരം നൽകണം; അവൻ ഈ കാര്യം ചെയ്തതുകൊണ്ടും കരുണ കാണിക്കാതിരുന്നതുകൊണ്ടും[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിനെ വെറുതെ വിടാതിരുന്നതുകൊണ്ടും.” എബ്രായ ക്രിയയ്ക്ക് കരുണനിമിത്തം ഉപദ്രവിക്കാതെയോ എടുത്തുകൊള്ളാതെയോ വിടുക എന്ന ആശയവും കരുണ കാണിക്കുക എന്ന ആശയവും പ്രകടിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכִּבְשָׂה
  choice: ആ പെൺകുഞ്ഞാട്
  rationale: כִּבְשָׂה പെൺലിംഗത്തിലുള്ള കുഞ്ഞാടിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പെൺകുഞ്ഞാട്’ ലിംഗസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְשַׁלֵּם
  choice: പകരം ... കൊടുക്കണം
  rationale: שׁלם എന്ന ക്രിയയുടെ പീയേൽ രൂപം ഇവിടെ നഷ്ടപരിഹാരമായി തിരികെ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ദാവീദിന്റെ ന്യായവിധിയുടെ നിർബന്ധസ്വഭാവം ‘കൊടുക്കണം’ വ്യക്തമാക്കുന്നു.
- source_word: אַרְבַּעְתָּיִם
  choice: നാലിരട്ടി
  rationale: ഈ സംഖ്യാരൂപം നാലുമടങ്ങുള്ള നഷ്ടപരിഹാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നാലിരട്ടി’ ആ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: עֵקֶב אֲשֶׁר
  choice: ചെയ്തതുകൊണ്ടും
  rationale: ഈ പ്രയോഗം വിധിക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ കാരണബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കാൻ ‘-തുകൊണ്ടും’ ഉപയോഗിച്ചു.
- source_word: עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം ചെയ്തു
  rationale: דָּבָר എന്നതിന്റെ ‘കാര്യം’ എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘കൃത്യം’ എന്ന വിവർത്തനം നൽകാവുന്ന അധികമായ നൈതിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: לֹא חָמָל
  choice: കരുണ കാണിക്കാതിരുന്നു
  rationale: חמל കരുണ നിമിത്തം ഉപദ്രവിക്കാതെ വിടുക, ദയ കാണിക്കുക എന്നീ ബന്ധിത ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു. സന്ദർഭത്തിലെ കരുണയില്ലായ്മ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
