id: 2SA.12.13
reference: 2 Samuel 12:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל נָתָ֔ן חָטָ֖אתִי לַֽ/יהוָ֑ה וַ/יֹּ֨אמֶר נָתָ֜ן אֶל דָּוִ֗ד גַּם יְהוָ֛ה הֶעֱבִ֥יר חַטָּאתְ/ךָ֖ לֹ֥א תָמֽוּת־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് നാഥാനോടു പറഞ്ഞു: “ഞാൻ യഹ്‌വെയ്ക്കെതിരായി പാപം ചെയ്തിരിക്കുന്നു.” നാഥാൻ ദാവീദിനോടു പറഞ്ഞു: “യഹ്‌വെയും നിന്റെ പാപം നീക്കിയിരിക്കുന്നു[a]; നീ മരിക്കുകയില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ പാപം അകറ്റിയിരിക്കുന്നു.” എബ്രായക്രിയയുടെ അക്ഷരാർഥം “കടന്നുപോകുമാറാക്കിയിരിക്കുന്നു” എന്നാണ്; ഇവിടെ കുറ്റം നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നീ മരിക്കില്ല.” എബ്രായപാഠം ലളിതമായി “നീ മരിക്കുകയില്ല” എന്നാണ് പറയുന്നത്. സന്ദർഭം മരണശിക്ഷയിൽനിന്നുള്ള വിടുതൽ സൂചിപ്പിക്കാമെങ്കിലും “വധിക്കപ്പെടുക” എന്ന് തുറന്നുപറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: ഞാൻ പാപം ചെയ്തിരിക്കുന്നു
  rationale: חטא എന്ന ക്രിയയുടെ കാൽ പെർഫെക്റ്റ് ഒന്നാംപുരുഷ ഏകവചനരൂപമാണിത്. പൂർത്തിയായ പ്രവൃത്തിക്കും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിക്കും ഊന്നൽ നൽകുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം ദാവീദിന്റെ നേരിട്ടുള്ള കുറ്റസമ്മതം വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്കെതിരായി
  rationale: ל എന്ന മുൻപ്രത്യയം ദിശയെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും חטא-യോടുകൂടിയ ഈ കുറ്റസമ്മതസന്ദർഭത്തിൽ ‘എതിരായി’ എന്നത് സ്വാഭാവികമായി പാപത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നു. יְהוָה എന്ന ഉടമ്പടിനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: גַּם
  choice: യും
  rationale: גַּם നൽകുന്ന കൂട്ടിച്ചേർക്കൽ/പ്രതികരണഭാവം ‘യഹ്‌വെയും’ എന്ന രൂപത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; അതിന്റെ കൃത്യമായ ഊന്നൽ അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: הֶעֱבִיר
  choice: നീക്കിക്കളഞ്ഞിരിക്കുന്നു
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘കടന്നുപോകുമാറാക്കുക’ എന്ന ആശയമുണ്ട്. ഇവിടെ പാപത്തോടൊപ്പം വന്നതിനാൽ അതിനെ അകറ്റുകയോ നീക്കുകയോ ചെയ്യുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: חַטָּאתְךָ
  choice: നിന്റെ പാപം
  rationale: חַטָּאת എന്നതിന് പാപം, കുറ്റം, പാപയാഗം എന്നീ അർഥങ്ങൾ വരാമെങ്കിലും ദാവീദ് ഇപ്പോൾ ഏറ്റുപറഞ്ഞ ലംഘനമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘നിന്റെ പാപം’ ഏറ്റവും നേരിട്ടുള്ള പരിഭാഷയാണ്.
- source_word: לֹא תָמוּת
  choice: നീ മരിക്കുകയില്ല
  rationale: നിഷേധിക്കപ്പെട്ട מות ഇംപെർഫെക്റ്റ് ദാവീദ് മരിക്കില്ലെന്ന് നേരിട്ട് പറയുന്നു. ‘വധിക്കപ്പെടുകയില്ല’ എന്ന് നിയമപരമായ അർഥം കൂട്ടിച്ചേർക്കാതെ എബ്രായവാക്യത്തിന്റെ ലാളിത്യവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുള്ള ആഖ്യാനക്രമം ആദ്യവാക്യത്തിൽ ‘അപ്പോൾ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; രണ്ടാമത്തെ വാക്യത്തിൽ മലയാളത്തിന്റെ ഒഴുക്കിനായി അനാവശ്യമായ ബന്ധകം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയായി മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ മൂലനാമത്തിന്റെ അംഗീകൃത ശബ്ദരൂപത്തോട് അടുത്ത ‘യഹ്‌വെ’ എന്നു നൽകുന്നു.
- issue: הֶעֱבִיר חַטָּאתְךָ സൂചിപ്പിക്കുന്ന പാപനീക്കം
  choice: നിന്റെ പാപം നീക്കിക്കളഞ്ഞിരിക്കുന്നു
  alternative: നിന്റെ പാപം അകറ്റിയിരിക്കുന്നു; നിന്റെ പാപം കടന്നുപോകുമാറാക്കിയിരിക്കുന്നു
  rationale: ദൈവം ദാവീദിന്റെ പാപം നീക്കിയെന്നും അതിനാൽ അവൻ മരിക്കില്ലെന്നും വാക്യം പറയുന്നു; എന്നാൽ അതിന്റെ പ്രായശ്ചിത്തരീതി ഇവിടെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ ക്ഷമയുടെ രീതി സംബന്ധിച്ച പിൽക്കാല ദൈവശാസ്ത്രവിഭാഗങ്ങൾ ചേർക്കാതെ മൂലപാഠത്തിലെ പ്രസ്താവനയും പിരിമുറുക്കവും നിലനിർത്തുന്നു.
- issue: לֹא תָמוּת എന്നതിന്റെ നിയമപരമായ സൂചന
  choice: നീ മരിക്കുകയില്ല
  alternative: നീ വധിക്കപ്പെടുകയില്ല
  rationale: സന്ദർഭം മരണശിക്ഷയിൽനിന്നുള്ള വിടുതൽ സൂചിപ്പിക്കാമെങ്കിലും എബ്രായപാഠം ‘മരിക്കുക’ എന്ന ക്രിയ മാത്രമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ സാധ്യതയുള്ള നിയമസൂചനയെ മുഖ്യപാഠത്തിൽ നിർബന്ധിതമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ദാവീദിന്റെ കുറ്റസമ്മതവും നാഥാന്റെ ദൈവിക പ്രഖ്യാപനവും നേരിട്ടുള്ള വാക്യങ്ങളായി നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ വിഷയങ്ങളോട് പൊരുത്തപ്പെടാത്ത സ്ഥാനങ്ങളിലായിരുന്നതിനാൽ, [a] പാപം നീക്കുന്നതിന് ശേഷവും [b] മരിക്കുകയില്ല എന്നതിന് ശേഷവും മൂലവിഷയങ്ങളോട് യോജിക്കുന്നവിധം സ്ഥാപിച്ചു.
