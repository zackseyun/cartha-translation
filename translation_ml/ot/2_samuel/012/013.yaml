  to: 'അപ്പോൾ ദാവീദ് നാഥാനോടു പറഞ്ഞു: “ഞാൻ യഹ്‌വെയ്ക്കെതിരായി പാപം ചെയ്തിരിക്കുന്നു.” നാഥാൻ ദാവീദിനോടു പറഞ്ഞു: “യഹ്‌വെയും നിന്റെ പാപം നീക്കിയിരിക്കുന്നു[a]; നീ മരിക്കുകയില്ല[b].”'
