id: 2SA.12.2
reference: 2 Samuel 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְ/עָשִׁ֗יר הָיָ֛ה צֹ֥אן וּ/בָקָ֖ר הַרְבֵּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/002.yaml
  text: The rich man had very many sheep and cattle[a].
translation:
  language: ml
  text: ധനികന് വളരെ അധികം ആടുമാടുകൾ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഒരു ധനികന് വളരെയധികം ആടുമാടുകൾ ഉണ്ടായിരുന്നു.’'
    reason: לְעָשִׁיר എന്ന എബ്രായ പ്രയോഗം സന്ദർഭത്തിൽ നിർദിഷ്ടനായ ‘ധനികൻ’ എന്നു വിവർത്തനം ചെയ്യുന്നതാണ് സ്വാഭാവികം; എങ്കിലും ‘ഒരു ധനികൻ’ എന്നും വിവർത്തനം ചെയ്യാം. ഇത് പാഠഭേദമല്ല, വിവർത്തനപരമായ ഒരു ബദലാണ്.
lexical_decisions:
- source_word: לְעָשִׁיר
  choice: ധനികന്
  rationale: לְ + היה എന്ന എബ്രായ ഉടമസ്ഥതാസൂചക ഘടന മലയാളത്തിൽ ‘ധനികന് ... ഉണ്ടായിരുന്നു’ എന്നു സ്വാഭാവികമായി വരുന്നു; സന്ദർഭത്തിലെ ദരിദ്രനോടുള്ള വൈരുധ്യവും ‘ധനികൻ’ നിലനിർത്തുന്നു.
- source_word: הָיָה
  choice: ഉണ്ടായിരുന്നു
  rationale: പദശഃ ‘ആയിരുന്നു’ എന്നാണെങ്കിലും, לְ ചേർന്ന ഈ ഘടന ഉടമസ്ഥതയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ‘ഉണ്ടായിരുന്നു’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: צֹאן
  choice: ആടുകൾ
  rationale: ഈ കൂട്ടനാമം ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലികളെ സൂചിപ്പിക്കാം; ബָּקָר എന്ന പദത്തോടൊപ്പം വരുന്ന പതിവായ മലയാളപ്രയോഗമായ ‘ആടുമാടുകൾ’ എന്നതിൽ ‘ആടുകൾ’ സ്വാഭാവികമായ പ്രതിനിധാനമാണ്.
- source_word: וּבָקָר
  choice: മാടുകൾ
  rationale: בָּקָר പൊതുവേ വലിയ വളർത്തുമൃഗങ്ങളെയോ കന്നുകാലികളെയോ സൂചിപ്പിക്കുന്നു; ‘ആടുമാടുകൾ’ എന്ന മലയാള സംയുക്തപ്രയോഗത്തിൽ ‘മാടുകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַרְבֵּה מְאֹד
  choice: വളരെ അധികം
  rationale: അളവിന്റെ ശക്തമായ വർധന സൂചിപ്പിക്കുന്ന ഈ പദസമുച്ചയം ആധുനിക മലയാളത്തിൽ ലളിതമായും ഊന്നലോടെയും പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. എബ്രായത്തിലെ ഉടമസ്ഥതാസൂചക ഘടന ‘...ന് ... ഉണ്ടായിരുന്നു’ എന്ന സ്വാഭാവിക മലയാളരീതിയിൽ പകർന്നു; ‘ആടുമാടുകൾ’ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ സമാഹാരപ്രയോഗമായി ഉപയോഗിച്ചു.
