  text: וְ/עַתָּ֣ה מֵ֗ת לָ֤/מָּה זֶּה֙ אֲנִ֣י צָ֔ם הַ/אוּכַ֥ל לַ/הֲשִׁיב֖/וֹ ע֑וֹד אֲנִי֙ הֹלֵ֣ךְ אֵלָ֔י/ו וְ/ה֖וּא לֹֽא יָשׁ֥וּב אֵלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ അവൻ മരിച്ചിരിക്കുന്നു. ഇനി ഞാൻ എന്തിന് ഉപവസിക്കണം? അവനെ തിരിച്ചുകൊണ്ടുവരാൻ എനിക്കു കഴിയുമോ? ഞാൻ അവന്റെ അടുക്കലേക്കു പോകുകയാണ്[a]; എന്നാൽ അവൻ എന്റെ അടുക്കലേക്കു മടങ്ങിവരുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ അവന്റെ അടുക്കലേക്കു പോകും.” ഹീബ്രുവിലെ കൃദന്തരൂപത്തിന് ഉറപ്പായ ഭാവിയെ സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: കുഞ്ഞിന്റെ മരണത്തിനു മുമ്പും ശേഷവും ദാവീദിന്റെ പ്രതികരണത്തിലുണ്ടായ മാറ്റം സൂചിപ്പിക്കുന്ന വൈരുധ്യാത്മക വ്യവഹാരചിഹ്നം.
- source_word: מֵת
  choice: അവൻ മരിച്ചിരിക്കുന്നു
  rationale: മരണത്തിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥ വ്യക്തമാക്കുന്ന ഹീബ്രു വിധേയപ്രയോഗം സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לָמָּה זֶּה אֲנִי צָם
  choice: ഇനി ഞാൻ എന്തിന് ഉപവസിക്കണം?
  rationale: അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവിക രൂപത്തിനു പകരം ചോദ്യത്തിന്റെ ആലങ്കാരിക ശക്തിയും സന്ദർഭത്തിലെ തുടർച്ച അവസാനിച്ചതും വ്യക്തമാക്കുന്നു.
- source_word: הַאוּכַל לַהֲשִׁיבוֹ עוֹד
  choice: അവനെ വീണ്ടും തിരികെ കൊണ്ടുവരാൻ എനിക്കു കഴിയുമോ?
  rationale: שוב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപമായ ‘മടങ്ങിവരുത്തുക’ എന്ന കാരകാർഥം നിലനിർത്തുകയും ജീവിപ്പിക്കുന്ന രീതി സംബന്ധിച്ച അധികവ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲנִי הֹלֵךְ אֵלָיו
  choice: ഞാൻ അവന്റെ അടുക്കലേക്കു പോകുകയാണ്
  rationale: הֹלֵךְ എന്ന കൃദന്തരൂപത്തിന്റെ പുരോഗമനഭാവം സൂക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ഉറപ്പായ ഭാവിയെയും സൂചിപ്പിക്കാം എന്നത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְהוּא לֹא יָשׁוּב אֵלָי
  choice: എന്നാൽ അവൻ എന്റെ അടുക്കലേക്കു മടങ്ങിവരുകയില്ല
  rationale: മുൻപത്തെ ‘തിരികെ കൊണ്ടുവരുക’ എന്ന പ്രയോഗവുമായി ധാതുബന്ധം നിലനിർത്തുകയും വ്യക്തമായ ഭാവികാല വൈരുധ്യം പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മരിച്ച കുഞ്ഞുമായി മരണാനന്തരജീവിതത്തിൽ ബോധപൂർവമായ പുനഃസംഗമം ദാവീദിന്റെ വാക്കുകൾ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘ഞാൻ അവന്റെ അടുക്കലേക്കു പോകുകയാണ്’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി, ആ പോകലിന്റെ സ്വഭാവം മരണത്തിനപ്പുറം നിർവചിക്കാതിരിക്കുന്നു.
  alternative: ദാവീദും മരിച്ച് മരിച്ചവരുടെ മണ്ഡലത്തിൽ കുഞ്ഞിനോടു ചേരുമെന്ന ലളിത പ്രസ്താവന; അല്ലെങ്കിൽ മരണശേഷം കുഞ്ഞുമായുള്ള വ്യക്തിപരമായ പുനഃസംഗമത്തിന്റെ സൂചന.
  rationale: ദാവീദ് കുഞ്ഞിന്റെ അടുക്കലേക്കു പോകുമെന്നും കുഞ്ഞ് തന്റെ അടുക്കലേക്കു മടങ്ങിവരുകയില്ലെന്നും മാത്രമാണ് ഹീബ്രു പറയുന്നത്. ഇടക്കാലാവസ്ഥയെയോ ശിശുക്കളുടെ രക്ഷയെയോ കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം പരിഭാഷയിൽ ചേർക്കാതെ പാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അടുക്കലേക്കു’ എന്ന പ്രയോഗം ദിശാബോധം വ്യക്തമായി നൽകുന്നു; മരണാനന്തരാവസ്ഥയെ സംബന്ധിച്ച പാഠാതീത വിശദീകരണം ഒഴിവാക്കിയിരിക്കുന്നു.
