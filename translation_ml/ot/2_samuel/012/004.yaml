  text: וַ/יָּ֣בֹא הֵלֶךְ֮ לְ/אִ֣ישׁ הֶֽ/עָשִׁיר֒ וַ/יַּחְמֹ֗ל לָ/קַ֤חַת מִ/צֹּאנ/וֹ֙ וּ/מִ/בְּקָר֔/וֹ לַ/עֲשׂ֕וֹת לָ/אֹרֵ֖חַ הַ/בָּא ל֑/וֹ וַ/יִּקַּ֗ח אֶת כִּבְשַׂת֙ הָ/אִ֣ישׁ הָ/רָ֔אשׁ וַֽ/יַּעֲשֶׂ֔/הָ לָ/אִ֖ישׁ הַ/בָּ֥א אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: A traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
translation:
  language: ml
  text: ഒരു യാത്രക്കാരൻ[a] ധനികന്റെ അടുക്കൽ വന്നു. തന്റെ അടുക്കൽ വന്ന അതിഥിക്കുവേണ്ടി ഭക്ഷണം ഒരുക്കാൻ സ്വന്തം ആട്ടിൻകൂട്ടത്തിൽനിന്നും കന്നുകാലിക്കൂട്ടത്തിൽനിന്നും എടുക്കാൻ അവൻ മടിച്ചു; പകരം ദരിദ്രന്റെ പെൺകുഞ്ഞാടിനെ എടുത്ത്, തന്റെ അടുക്കൽ വന്ന ആ മനുഷ്യനുവേണ്ടി അതിനെ ഒരുക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യാത്രക്കാരൻ’ എന്നതിനു ‘അതിഥി’ എന്നും പരിഭാഷപ്പെടുത്താം. യാത്രയിലിരിക്കുന്ന ഒരാളെയും ആതിഥ്യം ലഭിക്കുന്ന ഒരാളെയും സൂചിപ്പിക്കാൻ എബ്രായത്തിൽ പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ പദങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵלֶךְ
  choice: വഴിപോക്കൻ
  rationale: യാത്രയിലായിരുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നതിനാൽ, കേവലം സാമൂഹിക അതിഥി എന്നതിനെക്കാൾ ഉറവിടപദത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: וַיַּחְמֹל
  choice: എടുക്കാൻ അവൻ മനസ്സില്ലാതെ
  rationale: ക്രിയ സാധാരണയായി കരുണ കാണിക്കുക/ഒഴിവാക്കുക എന്നർഥമുള്ളതാണെങ്കിലും ഇവിടെ സ്വന്തം മൃഗങ്ങളിൽനിന്ന് എടുക്കാൻ മടിച്ചുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִצֹּאנוֹ וּמִבְּקָרוֹ
  choice: സ്വന്തം ആട്ടിൻകൂട്ടത്തിൽനിന്നോ കന്നുകാലിക്കൂട്ടത്തിൽനിന്നോ
  rationale: രണ്ട് സമുച്ചയനാമങ്ങളും ഉടമസ്ഥതയും നിലനിർത്തുന്നു; നിഷേധാത്മക സന്ദർഭത്തിൽ മലയാളത്തിലെ ‘നിന്നോ...നിന്നോ’ സ്വാഭാവികമാണ്.
- source_word: לַעֲשׂוֹת / וַיַּעֲשֶׂהָ
  choice: ഭക്ഷണം ഒരുക്കാൻ / അതിനെ ഒരുക്കി
  rationale: ഭക്ഷണസന്ദർഭത്തിലെ עשה എന്ന ക്രിയയുടെ പ്രായോഗിക അർഥവും ആവർത്തനവും നിലനിർത്തുന്നു; പാചകരീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: לָאֹרֵחַ
  choice: അതിഥിക്കുവേണ്ടി
  rationale: אָרֵחַ യാത്രക്കാരനെയോ സ്വീകരിക്കപ്പെട്ട അതിഥിയെയോ സൂചിപ്പിക്കാം; ഇവിടെ ആതിഥേയന്റെ അടുക്കൽ എത്തിയ വ്യക്തി എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּבְשַׂת
  choice: പെൺകുഞ്ഞാട്
  rationale: കുഞ്ഞാട് പെണ്ണാണെന്ന എബ്രായത്തിലെ പ്രത്യേകത വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: הָאִישׁ הָרָאשׁ
  choice: ദരിദ്രൻ
  rationale: സാമ്പത്തികമായി ദരിദ്രനായ മനുഷ്യനെ സൂചിപ്പിക്കുകയും ധനികനുമായുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַבָּא לוֹ / הַבָּא אֵלָיו
  choice: തന്റെ അടുക്കൽ വന്ന
  rationale: എത്തിയ സന്ദർശകനെ വിവരിക്കുന്ന participial പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യമായി നൽകുന്നു.
