id: 2SA.12.11
reference: 2 Samuel 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי֩ מֵקִ֨ים עָלֶ֤י/ךָ רָעָה֙ מִ/בֵּיתֶ֔/ךָ וְ/לָקַחְתִּ֤י אֶת נָשֶׁ֨י/ךָ֙ לְ/עֵינֶ֔י/ךָ וְ/נָתַתִּ֖י לְ/רֵעֶ֑י/ךָ וְ/שָׁכַב֙ עִם נָשֶׁ֔י/ךָ לְ/עֵינֵ֖י הַ/שֶּׁ֥מֶשׁ הַ/זֹּֽאת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
translation:
  language: ml
  text: 'യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: “ഇതാ, നിന്റെ സ്വന്തം വീട്ടിൽനിന്നുതന്നെ ഞാൻ നിനക്കെതിരെ വിപത്ത് ഉയർത്തുന്നു. നിന്റെ കൺമുന്നിൽവെച്ച് ഞാൻ നിന്റെ ഭാര്യമാരെ എടുത്ത് നിന്റെ സഹചാരിക്കു[a] കൊടുക്കും; അവൻ ഈ സൂര്യന്റെ കൺമുന്നിൽവെച്ച്[b] നിന്റെ ഭാര്യമാരോടുകൂടെ ശയിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ അയൽക്കാരന്,’ ‘നിന്റെ സഹചാരന്,’ അല്ലെങ്കിൽ ‘നിന്റെ അടുപ്പക്കാരന്’ എന്നും പരിഭാഷപ്പെടുത്താം. רֵעַ എന്ന ഹീബ്രു പദത്തിന് ഈ അർഥവ്യാപ്തിയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘ഈ സൂര്യന്റെ കൺമുന്നിൽ’; അതായത്, പകൽവെളിച്ചത്തിൽ പരസ്യമായി.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തിന്റെ ഹീബ്രു ഉച്ചാരണത്തെ മലയാളത്തിൽ കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകസന്ദേശത്തിന്റെ ഔപചാരിക സൂത്രവാക്യം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു നിപാതത്തിന്റെ ശക്തി ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: מֵקִים ... רָעָה
  choice: വിപത്ത് ഉയർത്തുന്നു
  rationale: רָעָה ഇവിടെ ധാർമിക തിന്മയല്ല, ന്യായവിധിയായ ദുരന്തമാണ്; ‘ഉയർത്തുന്നു’ എന്നത് מֵקִים എന്ന ക്രിയയുടെ ദൃശ്യഭാവവും വർത്തമാന പങ്കാളിത്തരൂപത്തിന്റെ അടിയന്തരതയും സൂക്ഷിക്കുന്നു.
- source_word: מִבֵּיתֶךָ
  choice: നിന്റെ സ്വന്തം വീട്ടിൽനിന്നുതന്നെ
  rationale: ‘വീട്’ എന്ന മൂലരൂപകം നിലനിർത്തിക്കൊണ്ട് വിപത്ത് ദാവീദിന്റെ സ്വന്തം കുടുംബവലയത്തിനുള്ളിൽനിന്നാണ് വരുന്നതെന്ന് ഊന്നിപ്പറയുന്നു.
- source_word: לְעֵינֶיךָ
  choice: നിന്റെ കൺമുന്നിൽവെച്ച്
  rationale: സംഭവം ദാവീദിന്റെ അറിവിലും ദൃഷ്ടിയിലും നടക്കുമെന്ന സജീവമായ ഹീബ്രു പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לְרֵעֶיךָ
  choice: നിന്റെ അടുത്തവന്‍
  rationale: רֵעַ എന്ന പദത്തിന്റെ ‘അയൽക്കാരൻ,’ ‘സഹചാരി,’ ‘അടുപ്പക്കാരൻ’ എന്നീ സാധ്യതകളെ ഒരൊറ്റ പ്രത്യേക വിഭാഗത്തിലേക്ക് ചുരുക്കാതെ, ദാവീദിനോട് അടുത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു.
- source_word: וְשָׁכַב עִם
  choice: കൂടെ ശയിക്കും
  rationale: ലൈംഗിക അർഥമുള്ള ഹീബ്രു ശിഷ്ടോക്തിയുടെ ഗൗരവവും പരോക്ഷതയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  choice: ഈ സൂര്യന്റെ കൺമുന്നിൽവെച്ച്
  rationale: പരസ്യമായി പകൽവെളിച്ചത്തിൽ എന്ന അർഥത്തോടൊപ്പം മൂലപാഠത്തിലെ ശ്രദ്ധേയമായ സൂര്യദൃശ്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയിലെ רָעָה എന്ന പദത്തിന്റെ അർഥം
  choice: വിപത്ത്
  alternative: തിന്മ
  rationale: ഈ സന്ദർഭത്തിൽ പദം ദൈവം ദാവീദിന്മേൽ വരുത്തുന്ന ദോഷകരമായ ന്യായവിധിയെയാണ് സൂചിപ്പിക്കുന്നത്; ദൈവം ധാർമിക തിന്മ പ്രവർത്തിക്കുന്നു എന്ന ആശയം പാഠത്തിൽ അനാവശ്യമായി ചേർക്കാതിരിക്കാനാണ് ‘വിപത്ത്’ തെരഞ്ഞെടുത്തത്.
- issue: ദൈവത്തിന്റെ പ്രവർത്തനവും മനുഷ്യന്റെ ലൈംഗിക അതിക്രമവും തമ്മിലുള്ള പാഠത്തിലെ സംഘർഷം
  choice: ‘ഞാൻ ... കൊടുക്കും; അവൻ ... ശയിക്കും’ എന്ന വ്യാകരണപരമായ വേർതിരിവ് നിലനിർത്തി
  alternative: ദൈവം നേരിട്ട് മുഴുവൻ പ്രവൃത്തിയും ചെയ്യുന്നു എന്നോ വെറും അനുമതി നൽകുന്നു എന്നോ വിശദീകരിച്ച് പരിഹരിക്കൽ
  rationale: മൂലപാഠം ദൈവിക ന്യായവിധിയെയും മനുഷ്യന്റെ പ്രവർത്തനത്തെയും ഒരുമിച്ച് പ്രസ്താവിക്കുന്നു; അതിനെ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനത്തിലൂടെ മൃദൂകരിക്കുകയോ തീർപ്പാക്കുകയോ ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികതയും പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഗൗരവവും സമന്വയിപ്പിച്ചു. ‘അരുളിച്ചെയ്യുന്നു,’ ‘ശയിക്കും’ എന്നീ പദങ്ങൾ മാന്യമായ ബൈബിൾഭാഷയുടെ ഭാവം നൽകുന്നു; അപൂർവമായ പുരാതന രൂപങ്ങൾ ഒഴിവാക്കി. മൂലപാഠത്തിലെ ‘വീട്,’ ‘കൺമുന്നിൽ,’ ‘സൂര്യൻ’ എന്നീ ദൃശ്യരൂപങ്ങൾ സാധ്യമായത്ര നിലനിർത്തി.
