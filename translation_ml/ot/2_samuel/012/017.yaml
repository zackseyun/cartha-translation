source:
  edition: WLC
  text: וַ/יָּקֻ֜מוּ זִקְנֵ֤י בֵית/וֹ֙ עָלָ֔י/ו לַ/הֲקִימ֖/וֹ מִן הָ/אָ֑רֶץ וְ/לֹ֣א אָבָ֔ה וְ/לֹֽא בָרָ֥א אִתָּ֖/ם לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/017.yaml
  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
translation:
  language: ml
  text: അവനെ നിലത്തുനിന്ന് എഴുന്നേല്പിക്കാനായി അവന്റെ ഭവനത്തിലെ മൂപ്പന്മാർ[a] അവന്റെ അരികിൽ നിന്നു. എന്നാൽ അവൻ അതിന് തയ്യാറായില്ല; അവരോടൊപ്പം അപ്പം കഴിക്കാനും തയ്യാറായില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവന്റെ വീട്ടുകാരിലെ മൂപ്പന്മാർ.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവന്റെ ഭവനത്തിന്റെ മൂപ്പന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘അപ്പം കഴിക്കുക’ എന്നത് ഇവിടെ ആഹാരം കഴിക്കുക എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: നിന്നു
  rationale: קום എന്ന ക്രിയ ഇവിടെ മൂപ്പന്മാർ ദാവീദിന്റെ അരികിൽ നിന്നുകൊണ്ട് അവനെ എഴുന്നേല്പിക്കാൻ ശ്രമിക്കുന്ന ദൃശ്യത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘നിന്നു’ സ്വാഭാവികമാണ്.
- source_word: זִקְנֵי בֵיתוֹ
  choice: അവന്റെ ഭവനത്തിലെ മൂപ്പന്മാർ
  rationale: ‘അവന്റെ ഭവനത്തിന്റെ മൂപ്പന്മാർ’ എന്ന അക്ഷരാർഥം നിലനിർത്തിക്കൊണ്ട്, രാജകീയ ഭവനവുമായി ബന്ധപ്പെട്ട മുതിർന്നവരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാവുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: עָלָיו
  choice: അവന്റെ അരികിൽ
  rationale: עַל എന്നതിന് ‘മേൽ/അടുത്ത്’ എന്ന സ്ഥലബന്ധം വരാം. നിലത്തു കിടക്കുന്ന ദാവീദിനെ എഴുന്നേല്പിക്കാൻ അവർ സമീപത്തു നിൽക്കുന്ന ദൃശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകാൻ ‘അരികിൽ’ തെരഞ്ഞെടുത്തു; ‘അവന്റെ മീതെ’ എന്നു പറഞ്ഞാൽ ഉദ്ദേശിക്കാത്ത പ്രതികൂലഭാവം ഉണ്ടാകാം.
- source_word: לַהֲקִימוֹ
  choice: അവനെ … എഴുന്നേല്പിക്കാനായി
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം—‘അവനെ എഴുന്നേൽക്കാൻ ഇടയാക്കുക’—വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מִן הָאָרֶץ
  choice: നിലത്തുനിന്ന്
  rationale: ദാവീദ് നിലത്തു കിടന്നിരുന്ന ഉടനടി സന്ദർഭത്തിൽ אֶרֶץ എന്നത് ‘ഭൂമി’ എന്നതിലുപരി ‘നിലം’ എന്നാണ് സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നത്.
- source_word: וְלֹא אָבָה
  choice: എന്നാൽ അവൻ അതിന് മനസ്സുവെച്ചില്ല
  rationale: אָבָה സമ്മതമോ സന്നദ്ധതയോ ഇല്ലായ്മയെ സൂചിപ്പിക്കുന്നു. ‘നിരസിച്ചു’ എന്ന കൂടുതൽ ശക്തമായ പ്രയോഗം ഒഴിവാക്കി ആ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  choice: അവരോടൊപ്പം അപ്പം കഴിച്ചതുമില്ല
  rationale: ഹീബ്രുവിലെ ‘അപ്പം കഴിക്കുക’ എന്ന സാക്ഷാൽപ്രയോഗം നിലനിർത്തുകയും, സന്ദർഭത്തിൽ അതിന് പൊതുവായി ആഹാരം കഴിക്കുക എന്ന അർഥമുണ്ടെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഭവനം’ രാജകീയ ഗൃഹത്തെയും അതുമായി ബന്ധപ്പെട്ട ആളുകളെയും ഉൾക്കൊള്ളാവുന്നവിധം ഉപയോഗിച്ചു; ‘മനസ്സുവെച്ചില്ല’ സന്നദ്ധതയില്ലായ്മയുടെ സൂക്ഷ്മത സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന വാക്കുകൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
