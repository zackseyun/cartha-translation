  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְבַקֵּ֥שׁ דָּוִ֛ד אֶת הָ/אֱלֹהִ֖ים בְּעַ֣ד הַ/נָּ֑עַר וַ/יָּ֤צָם דָּוִד֙ צ֔וֹם וּ/בָ֥א וְ/לָ֖ן וְ/שָׁכַ֥ב אָֽרְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/016.yaml
  text: And David sought God on behalf of the boy[b][a]. David fasted a fast, and he went in and spent the night and lay on the ground.
translation:
  language: ml
  text: ദാവീദ് ബാലനുവേണ്ടി[a] ദൈവത്തോടു അപേക്ഷിച്ചു. അവൻ ഉപവാസം അനുഷ്ഠിച്ചു[b]; അകത്തു ചെന്നു, രാത്രി അവിടെ ചെലവഴിച്ചു, നിലത്തു കിടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബാലൻ’ എന്നത് 15, 18 വാക്യങ്ങളിൽ രോഗബാധിതനായ ദാവീദിന്റെ കുഞ്ഞിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കുട്ടി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഒരു ഉപവാസം ഉപവസിച്ചു’ എന്ന സമാനധാതുപ്രയോഗമാണ്; അത് ഉപവാസത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: അന്വേഷിച്ചു
  rationale: בקש എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘തേടുക/അന്വേഷിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ദൈവത്തോടുള്ള പ്രാർഥനാപൂർവമായ അഭ്യർഥന വായനക്കാരന് ഗ്രഹിക്കാം. ‘അപേക്ഷിച്ചു’ എന്നത് സാധ്യമെങ്കിലും മൂലക്രിയയെക്കാൾ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: אֶת־הָאֱלֹהִים
  choice: ദൈവത്തെ
  rationale: നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: בְּעַד
  choice: വേണ്ടി
  rationale: മറ്റൊരാളുടെ നന്മയ്ക്കായുള്ള അഭ്യർഥനയെന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: הַנַּעַר
  choice: ബാലൻ
  rationale: נער എന്ന പദത്തിന്റെ ‘ആൺകുട്ടി/ബാലൻ’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഇവിടെ ദാവീദിന്റെ രോഗബാധിതനായ ശിശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיָּצָם ... צוֹם
  choice: ഉപവാസം അനുഷ്ഠിച്ചു
  rationale: ക്രിയയോടൊപ്പം അതേ ധാതുവിൽനിന്നുള്ള നാമം ഉപയോഗിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ, അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനം കൂടാതെ, നാമപ്രയോഗത്തിലൂടെ ഭാഗികമായി നിലനിർത്തുന്നു.
- source_word: וּבָא
  choice: അകത്തു ചെന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ പ്രവേശനദിശ വ്യക്തമാക്കുകയും കഥാഖ്യാനത്തിന് സ്വാഭാവികമായ മലയാളരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: וְלָן
  choice: രാത്രി കഴിച്ചുകൂട്ടുകയും
  rationale: לון എന്നത് രാത്രി തങ്ങുക अथवा രാത്രി ചെലവഴിക്കുക എന്ന അർഥം നൽകുന്നു; ഇവിടെ കാലപരമായ ആശയം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: וְשָׁכַב אָרְצָה
  choice: നിലത്തു കിടക്കുകയും ചെയ്തു
  rationale: ശരീരനിലയും ‘ഭൂമിയിലേക്ക്/നിലത്തേക്ക്’ എന്ന ദിശാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; അകത്തെ സ്ഥലം ‘തറ’ ആയിരുന്നുവെന്ന് മൂലപാഠം നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ദാവീദ് ദൈവത്തെ ‘അന്വേഷിച്ചു’ എന്നതിന്റെ പ്രാർഥനാപരമായ സ്വഭാവം
  choice: അന്വേഷിച്ചു
  alternative: അപേക്ഷിച്ചു / യാചിച്ചു
  rationale: സന്ദർഭം അഭ്യർഥനയെ ശക്തമായി സൂചിപ്പിച്ചാലും, בקש എന്ന ക്രിയ അത്രയ്ക്ക് മാത്രം അർഥം പരിമിതപ്പെടുത്തുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥാഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഉപവാസം ഉപവസിച്ചു’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപം ഒഴിവാക്കി, എബ്രായത്തിലെ ഊന്നൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
