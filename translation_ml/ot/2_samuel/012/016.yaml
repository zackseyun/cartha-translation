    rationale: '“അകത്തു ചെന്ന് രാത്രി കഴിച്ചുകൂട്ടുകയും നിലത്തു കിടക്കുകയും ചെയ്തു” is grammatical, but using distinct verbs more naturally represents the sequential narration: he went in, spent the night, and lay on the ground.'
