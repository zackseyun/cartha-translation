revisions:
- from: 'അപ്പോൾ നാഥാൻ ദാവീദിനോടു പറഞ്ഞു: “ആ മനുഷ്യൻ നീ തന്നെയാണ്![a] ഇസ്രായേലിന്റെ ദൈവമായ യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘ഞാനാണ് നിന്നെ ഇസ്രായേലിനു രാജാവായി അഭിഷേകം ചെയ്തത്; ഞാനാണ് നിന്നെ ശൗലിന്റെ കൈയിൽനിന്നു വിടുവിച്ചത്.’”'
  to: 'അപ്പോൾ നാഥാൻ ദാവീദിനോടു പറഞ്ഞു: “നീയാണ് ആ മനുഷ്യൻ! ഇസ്രായേലിന്റെ ദൈവമായ യാഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘ഞാനാണ് നിന്നെ ഇസ്രായേലിന്മേൽ രാജാവായി അഭിഷേകം ചെയ്തത്; ഞാനാണ് നിന്നെ ശൗലിന്റെ കൈയിൽനിന്ന് വിടുവിച്ചത്.’”'
  rationale: The revision aligns the divine-name rendering with the project’s Yahweh policy, makes the royal authority expressed by עַל explicit, and removes an unnecessary and imprecise footnote. It retains the source’s emphatic repeated first-person pronoun, the royal-anointing terminology, and the ‘hand of Saul’ idiom.
