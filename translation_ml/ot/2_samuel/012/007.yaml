id: 2SA.12.7
reference: 2 Samuel 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר נָתָ֛ן אֶל דָּוִ֖ד אַתָּ֣ה הָ/אִ֑ישׁ כֹּה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י מְשַׁחְתִּ֤י/ךָֽ לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֥י הִצַּלְתִּ֖י/ךָ מִ/יַּ֥ד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
translation:
  language: ml
  text: 'അപ്പോൾ നാഥാൻ ദാവീദിനോടു പറഞ്ഞു: “നീയാണ് ആ മനുഷ്യൻ! ഇസ്രായേലിന്റെ ദൈവമായ യാഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘ഞാനാണ് നിന്നെ ഇസ്രായേലിന്മേൽ രാജാവായി അഭിഷേകം ചെയ്തത്; ഞാനാണ് നിന്നെ ശൗലിന്റെ കൈയിൽനിന്ന് വിടുവിച്ചത്.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: אַתָּה הָאִישׁ
  choice: ആ മനുഷ്യൻ നീ തന്നെയാണ്!
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യം ശക്തമായ ഊന്നലുള്ളതാണ്. ഉപമയിൽ പറഞ്ഞ മനുഷ്യൻ ദാവീദ് തന്നെയാണെന്ന നാഥാന്റെ നിർണായക വെളിപ്പെടുത്തൽ മലയാളത്തിൽ സ്വാഭാവികവും ശക്തവുമായി നൽകുന്നു; നിർദേശകമായ ‘ആ’ സന്ദർഭത്തിൽ നിന്നുള്ളതാണ്.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ ഔപചാരിക സൂത്രവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: എബ്രായ സംയുക്തപദബന്ധം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אָנֹכִי ... וְאָנֹכִי
  choice: ഞാനാണ് ... ഞാനാണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ആവർത്തനവും ഊന്നലും മലയാളത്തിലെ ‘ഞാനാണ്’ എന്ന ആവർത്തനത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: നിന്നെ ... രാജാവായി അഭിഷേകം ചെയ്തത്
  rationale: രാജകീയ സ്ഥാനനിയോഗത്തെ സൂചിപ്പിക്കുന്ന משׁח എന്ന പദത്തിന്റെ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ അർഥം ‘അഭിഷേകം’ നിലനിർത്തുന്നു.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു രാജാവായി
  rationale: ഇവിടെ עַל രാജാധികാരത്തിന്റെ പരിധിയായ ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇസ്രായേലിനു രാജാവായി’ സ്വാഭാവികമായി ആ ഭരണബന്ധം അറിയിക്കുന്നു.
- source_word: הִצַּלְתִּיךָ
  choice: നിന്നെ ... വിടുവിച്ചത്
  rationale: ശത്രുവിന്റെ അധികാരത്തിൽനിന്നോ അപകടത്തിൽനിന്നോ രക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയ്ക്ക് ‘വിടുവിച്ചു’ യോജിക്കുന്നു.
- source_word: מִיַּד שָׁאוּל
  choice: ശൗലിന്റെ കൈയിൽനിന്ന്
  rationale: ‘കൈ’ അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും വ്യക്തമായതിനാൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ, സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: אָנֹכִי എന്ന സർവനാമത്തിന്റെ ആവർത്തിച്ചുള്ള ഊന്നൽ
  choice: ‘ഞാനാണ്’ എന്നു രണ്ടിടത്തും ആവർത്തിച്ചു
  alternative: രണ്ടിടത്തും ലളിതമായ ‘ഞാൻ’
  rationale: അഭിഷേകവും വിടുതലും യഹോവയുടെ പ്രവൃത്തികളാണെന്ന മൂലപാഠത്തിലെ ഊന്നൽ മായാതിരിക്കാൻ ആവർത്തനം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായ കഥനശൈലി ഉപയോഗിച്ചു; പ്രവാചകപ്രഖ്യാപനത്തിൽ മാത്രം ഗൗരവമുള്ള ‘അരുളിച്ചെയ്യുന്നു’ നിലനിർത്തി. ദൈവത്തിന്റെ ആവർത്തിച്ച ‘ഞാനാണ്’ എന്ന ഊന്നലും ‘കൈയിൽനിന്ന്’ എന്ന മൂലരൂപകവും സംരക്ഷിച്ചു.
