reference: 2 Samuel 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
translation:
  language: ml
  text: എന്നാൽ ദരിദ്രന് താൻ വാങ്ങിയ ഒരു ചെറിയ പെൺകുഞ്ഞാട് മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ. അവൻ അതിനെ പോറ്റി; അത് അവനോടും അവന്റെ മക്കളോടുംകൂടെ വളർന്നു. അത് അവന്റെ ഭക്ഷണക്കഷണത്തിൽനിന്ന് തിന്നുമായിരുന്നു, അവന്റെ പാനപാത്രത്തിൽനിന്ന് കുടിക്കുമായിരുന്നു, അവന്റെ മടിയിൽ കിടക്കുമായിരുന്നു; അവന് അത് ഒരു മകളെപ്പോലെയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָשׁ
  choice: ദരിദ്രൻ
  rationale: സമ്പന്നനുമായുള്ള കഥാസന്ദർഭത്തിലെ വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട്, ദരിദ്രനായ പുരുഷനെ സൂചിപ്പിക്കുന്ന എബ്രായ നാമത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: אֵין כֹּל כִּי אִם
  choice: … മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ
  rationale: ഒരൊറ്റ അപവാദം ഒഴികെയുള്ള സമ്പൂർണ അഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  choice: ഒരു ചെറിയ പെൺകുഞ്ഞാട്
  rationale: എണ്ണം, ചെറുപ്പം/ചെറുപ്പമെന്ന സ്നേഹഭാവം, പെൺലിംഗം എന്നിവ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר קָנָה
  choice: താൻ വാങ്ങിയ
  rationale: קנה എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ വാങ്ങുക/സ്വന്തമാക്കുക എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: וַיְחַיֶּהָ
  choice: അതിനെ ജീവനോടെ പരിപാലിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘ജീവൻ നിലനിർത്തുക’ എന്ന അടിസ്ഥാനബലവും തുടർച്ചയായ പരിചരണവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: וַתִּגְדַּל
  choice: വളർന്നു
  rationale: വീട്ടിൽ വളർത്തപ്പെട്ട കുഞ്ഞാടിന്റെ വളർച്ചയെ ലളിതമായ ആധുനിക മലയാളത്തിൽ പറയുന്നു.
- source_word: עִמּוֹ וְעִם בָּנָיו יַחְדָּו
  choice: അവനോടും അവന്റെ മക്കളോടുംകൂടെ
  rationale: בָּנָיו എന്നത് രൂപപരമായി ‘അവന്റെ പുത്രന്മാർ’ ആണെങ്കിലും, കുടുംബസന്ദർഭത്തിൽ ‘മക്കൾ’ സ്വാഭാവികമാണ്; ‘ഒരുമിച്ച്’ എന്ന ആശയം ‘-ഓടുംകൂടെ’യിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: מִפִּתּוֹ
  choice: അവന്റെ ഭക്ഷണത്തിൽനിന്ന്
  rationale: פַּת ഒരു അപ്പക്കഷണം/ഭക്ഷണക്കഷണം സൂചിപ്പിക്കാം; മലയാളത്തിൽ പങ്കിട്ടു ഭക്ഷിക്കുന്ന ഗൃഹാന്തരംഗചിത്രം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִכֹּסוֹ
  choice: അവന്റെ പാനപാത്രത്തിൽനിന്ന്
  rationale: സ്വന്തം പാത്രത്തിൽനിന്നുള്ള അടുപ്പമുള്ള പങ്കിടൽചിത്രം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: בְחֵיקוֹ
  choice: അവന്റെ മടിയിൽ
  rationale: חֵיק നെഞ്ചോട് ചേർന്നിടം, മടി, കൈകളിലെ ചേർത്തുപിടിത്തം എന്നിവ സൂചിപ്പിക്കാം; ഇവിടെ ‘മടിയിൽ’ സ്നേഹപൂർവമായ ഗൃഹാന്തരംഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַתְּהִי לוֹ כְּבַת
  choice: അവന് അത് ഒരു മകളെപ്പോലെയായിരുന്നു
  rationale: വ്യക്തമായ ഉപമയും കുടുംബസ്നേഹത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പെൺകുഞ്ഞാടിനെക്കുറിച്ചുള്ള മനുഷ്യകുടുംബസദൃശമായ ഗൃഹാന്തരംഗചിത്രണം
  choice: സ്നേഹവും കുടുംബബന്ധസദൃശതയും നേരിട്ട് നിലനിർത്തി
  alternative: വികാരതീവ്രത കുറയ്ക്കുന്ന പൊതുവായ വളർത്തുമൃഗഭാഷ ഉപയോഗിക്കുക
  rationale: ഉപമയുടെ ധാർമികവും വികാരപരവുമായ പ്രഹരം ശക്തിപ്പെടുത്താൻ എബ്രായപാഠം കുഞ്ഞാടിനെ പ്രിയപ്പെട്ട കുടുംബാംഗത്തെപ്പോലെ ചിത്രീകരിക്കുന്നു; അത് മൃദൂകരിക്കരുത്.
- issue: בָּנָיו എന്നതിന്റെ വിവർത്തനം
  choice: മക്കൾ
  alternative: പുത്രന്മാർ
  rationale: രൂപപരമായി ‘പുത്രന്മാർ’ സാധ്യമാണെങ്കിലും, ഈ ഗൃഹാന്തരംഗത്തിൽ മലയാളത്തിലെ ‘മക്കൾ’ കുടുംബസമൂഹത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ലിംഗത്തെക്കുറിച്ച് അനാവശ്യമായ അധികനിഗമനം വരുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവവും കഥയുടെ സ്നേഹഭാവവും കാത്തുസൂക്ഷിക്കുന്ന മലയാളം. മുഖ്യപാഠത്തിന് വിശദീകരണം അനിവാര്യമല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
