source:
  edition: WLC
  text: מַדּ֜וּעַ בָּזִ֣יתָ אֶת דְּבַ֣ר יְהוָ֗ה לַ/עֲשׂ֣וֹת הָ/רַע֮ ב/עינ/ו אֵ֣ת אוּרִיָּ֤ה הַֽ/חִתִּי֙ הִכִּ֣יתָ בַ/חֶ֔רֶב וְ/אֶ֨ת אִשְׁתּ֔/וֹ לָקַ֥חְתָּ לְּ/ךָ֖ לְ/אִשָּׁ֑ה וְ/אֹת֣/וֹ הָרַ֔גְתָּ בְּ/חֶ֖רֶב בְּנֵ֥י עַמּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
translation:
  language: ml
  text: എന്തുകൊണ്ടാണ് നീ യാഹ്‌വേയുടെ വചനത്തെ അവജ്ഞിച്ച് അവിടുത്തെ ദൃഷ്ടിയിൽ തിന്മ പ്രവർത്തിച്ചത്? ഹിത്യനായ ഊരീയാവിനെ നീ വാളാൽ പ്രഹരിച്ചു; അവന്റെ ഭാര്യയെ നിനക്കായി ഭാര്യയായി എടുത്തു[a]; അമ്മോന്യരുടെ വാൾകൊണ്ട് അവനെ കൊന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അവന്റെ ഭാര്യയെ നിനക്കായി ഭാര്യയായി എടുത്തു”; ഊരീയാവിന്റെ ഭാര്യയെ ദാവീദ് വ്യക്തിപരമായി സ്വന്തമാക്കിയതിനു ഈ പ്രയോഗം ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ: “അമ്മോന്റെ പുത്രന്മാരുടെ വാൾകൊണ്ട്”; അമ്മോന്യരെ ഉപയോഗിച്ചാണ് ദാവീദ് ഊരീയാവിന്റെ മരണം വരുത്തിയതെന്ന് ഇതു സൂചിപ്പിക്കുന്നു.'
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: എന്തുകൊണ്ടാണ്
  rationale: നാഥാന്റെ കുറ്റാരോപണം ആരംഭിക്കുന്ന നേരിട്ടുള്ള കാരണചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בָּזִיתָ
  choice: നിന്ദിച്ച്
  rationale: בזה എന്ന ക്രിയയിലെ അവജ്ഞയും നിസ്സാരീകരണവും നിലനിർത്തുന്നു; വെറും ‘അനുസരിക്കാതിരിക്കുക’ എന്നതിനെക്കാൾ ശക്തമാണ്.
- source_word: דְּבַר יְהוָה
  choice: യഹോവയുടെ വചനം
  rationale: דבר എന്നതിന്റെ ‘വചനം’ എന്ന രൂപം നിലനിർത്തുകയും, യഹോവ എന്ന ദൈവനാമം നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  choice: അവിടുത്തെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്തത്
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הִכִּיתָ בַחֶרֶב
  choice: വാളാൽ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ‘അടിക്കുക/വീഴ്ത്തുക’ എന്ന ശക്തമായ ക്രിയയെ, പിന്നീടുള്ള הרג ‘കൊന്നു’ എന്നതിൽനിന്ന് വേർതിരിച്ച് നിലനിർത്തുന്നു.
- source_word: לָקַחְתָּ לְּךָ לְאִשָּׁה
  choice: അവന്റെ ഭാര്യയെ നിനക്കായി ഭാര്യയാക്കി എടുത്തു
  rationale: לְךָ എന്ന സ്വാർത്ഥമായ വ്യക്തിപരമായ സ്വന്തമാക്കലും לְאִשָּׁה എന്ന വിവാഹസ്ഥാനവും ഉൾപ്പെടുന്ന എബ്രായ ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തുന്നു.
- source_word: הָרַגְתָּ
  choice: കൊന്നു
  rationale: הרג എന്ന സാധാരണ ‘കൊല്ലുക’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘കൊലപ്പെടുത്തി’ എന്ന് വ്യാഖ്യാനപരമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: בְּחֶרֶב בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ വാൾകൊണ്ട്
  rationale: അമ്മോന്യരുടെ സൈനിക ഇടപെടലിലൂടെ ദാവീദ് ഊരീയാവിന്റെ മരണം വരുത്തിയെന്ന ഉപകരണാർഥം നിലനിർത്തുന്നു.
- source_word: אוּרִיָּה הַחִתִּי
  choice: ഹിത്യനായ ഊരീയാവ്
  rationale: വ്യക്തിനാമവും ജനവിഭാഗപരമായ തിരിച്ചറിയലും സാധാരണ മലയാള ബൈബിൾരീതിയോട് ചേർന്ന് നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണം സ്വീകരിക്കുന്നു; പദവിയായ ‘കർത്താവ്’ എന്നാക്കി മാറ്റുന്നില്ല.
- issue: ദാവീദിന്റെ പരോക്ഷ ഉത്തരവാദിത്വം
  choice: അമ്മോന്യരുടെ വാൾകൊണ്ട് അവനെ കൊന്നു
  alternative: അമ്മോന്യർ അവനെ കൊന്നു
  rationale: എബ്രായ വാക്യം കൊലയുടെ നൈതിക ഉത്തരവാദിത്വം ദാവീദിന്മേൽ നേരിട്ട് ചുമത്തുമ്പോഴും, അമ്മോന്യരുടെ വാൾ ഏജൻസിയായിരുന്നുവെന്ന സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രവാചകീയ കുറ്റാരോപണശൈലി. ‘നിന്ദിച്ച്’, ‘ദൃഷ്ടിയിൽ’, ‘വെട്ടിവീഴ്ത്തി’ എന്നീ പദങ്ങൾ മൂലത്തിലെ ശക്തിയും ആവർത്തനവും സൂക്ഷിക്കുന്നു; അതേസമയം വാക്യം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന രീതിയിൽ ക്രമപ്പെടുത്തി.
