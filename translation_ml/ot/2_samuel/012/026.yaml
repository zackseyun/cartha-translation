    rationale: Although not inaccurate, it can suggest that the capture is merely a consequential participial action. The Hebrew coordinates “fought” and “captured”; coordinated Malayalam finite verbs preserve this more directly.
  - severity: low
    issue: The place name is written “റബ്ബ.”
    rationale: “രബ്ബാ” more clearly represents the conventional biblical place name Rabbah in modern Malayalam.
