source:
  edition: WLC
  text: וַ/יִּלָּ֣חֶם יוֹאָ֔ב בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן וַ/יִּלְכֹּ֖ד אֶת עִ֥יר הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/026.yaml
  text: And Joab fought against Rabbah of the Ammonites and captured the royal city[a].
translation:
  language: ml
  text: യോവാബ് അമ്മോന്യരുടെ രബ്ബായ്ക്കെതിരെ യുദ്ധം ചെയ്യുകയും രാജനഗരം[a] പിടിച്ചടക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തലസ്ഥാനനഗരം.” എബ്രായത്തിൽ അക്ഷരാർഥം “രാജത്വത്തിന്റെ/രാജാധികാരത്തിന്റെ നഗരം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֶם
  choice: യുദ്ധംചെയ്ത്
  rationale: നിഫാൽ രൂപത്തിലുള്ള לחם യുദ്ധത്തിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുവരുന്ന ക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ ക്രിയാവിശേഷണരൂപം ഉപയോഗിച്ചു; ‘എതിരെ’ എന്നത് സന്ദർഭത്തിലെ പ്രതികൂലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ റബ്ബ
  rationale: רַבָּה സ്ഥലനാമമാണ്; בְּנֵי עַמּוֹן അമ്മോൻ ജനതയെ സൂചിപ്പിക്കുന്ന പതിവ് പ്രയോഗമാണ്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രൂപം സ്വീകരിച്ചു.
- source_word: וַיִּלְכֹּד
  choice: പിടിച്ചെടുത്തു
  rationale: לכד എന്ന പദത്തിന് സൈനികസന്ദർഭത്തിൽ ഒരു നഗരമോ പ്രദേശമോ കീഴടക്കി കൈവശമാക്കുക എന്ന അർഥമുണ്ട്. ‘പിടിച്ചെടുത്തു’ ആ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: עִיר הַמְּלוּכָה
  choice: രാജനഗരം
  rationale: എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘രാജത്വത്തിന്റെ/രാജാധികാരത്തിന്റെ നഗരം’ എന്നാണ്. ‘രാജനഗരം’ അതിനോട് ചേർന്നുനിൽക്കുകയും ‘തലസ്ഥാനനഗരം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സ്ഥലനാമവും ജനനാമവും സാധാരണ മലയാള ബൈബിൾ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന രൂപത്തിൽ നൽകി; മൂലപാഠത്തിലെ വാക്യക്രമവും സൈനികസന്ദർഭവും കഴിയുന്നത്ര നിലനിർത്തി.
