source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח בְּ/יַד֙ נָתָ֣ן הַ/נָּבִ֔יא וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יְדִ֣ידְיָ֑הּ בַּ/עֲב֖וּר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
translation:
  language: ml
  text: അവൻ നാഥാൻ പ്രവാചകൻ മുഖേന[a] സന്ദേശം അയച്ചു; അവന് “യെദീദ്യാവ്”[b] എന്നു പേരിട്ടു—യഹോവ നിമിത്തം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നാഥാൻ പ്രവാചകന്റെ കൈയാൽ.”'
    reason: lexical_alternative
  - marker: b
    text: '“യെദീദ്യാവ്” എന്ന പേരിന് സാധ്യതയുള്ള അർഥം: “യഹോവയുടെ പ്രിയൻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: സന്ദേശം അയച്ചു
  rationale: שׁלח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘അയച്ചു’ എന്നാണ്. ഇവിടെ നാഥാൻ മുഖാന്തരമുള്ള ദൈവിക ആശയവിനിമയമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘സന്ദേശം അയച്ചു’ എന്നു നൽകി.
- source_word: בְּיַד נָתָן הַנָּבִיא
  choice: നാഥാൻ പ്രവാചകൻ മുഖാന്തരം
  rationale: ‘നാഥാൻ പ്രവാചകന്റെ കൈയാൽ’ എന്ന അക്ഷരാർഥമുള്ള പ്രയോഗം മധ്യസ്ഥതയെയോ ഏജൻസിയെയോ സൂചിപ്പിക്കുന്നു. ‘മുഖാന്തരം’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: അവന് … എന്നു പേരിട്ടു
  rationale: ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന ഹീബ്രു ശൈലിയുടെ സ്വാഭാവിക മലയാള അർഥം ‘പേരിട്ടു’ എന്നാണ്.
- source_word: יְדִידְיָהּ
  choice: യെദീദ്യാവ്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു. പേരിന്റെ സാധ്യതയുള്ള അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: בַּעֲבוּר יְהוָה
  choice: യഹോവ നിമിത്തം
  rationale: בַּעֲבוּר ഇവിടെ പേരിടലിന്റെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. ‘യഹോവ നിമിത്തം’ എന്നത് അതിന്റെ സംക്ഷിപ്തതയും ചില അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
theological_decisions:
- issue: ‘അയച്ചു’, ‘പേരിട്ടു’ എന്നീ ക്രിയകളുടെ കർത്താവ്
  choice: മൂലപാഠത്തിലെന്നപോലെ കർത്താവിനെ ‘അവൻ’ എന്ന സർവനാമത്തിലൂടെ സൂചിപ്പിക്കുകയും രണ്ടാമത്തെ ക്രിയയിൽ കർത്താവിനെ വീണ്ടും വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്തു.
  alternative: രണ്ടു ക്രിയകളുടെയും കർത്താവായി യഹോവയെ തുറന്നുപറയുക; അല്ലെങ്കിൽ പേരിട്ടത് ദാവീദോ നാഥാനോ ആണെന്ന് വ്യക്തമാക്കുക.
  rationale: മുൻസന്ദർഭം യഹോവയെ കർത്താവായി ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഹീബ്രു വാക്യത്തിലെ സർവനാമപരമായ തുടർച്ച രണ്ടാമത്തെ ക്രിയയുടെ കർത്താവിനെ പേരെടുത്ത് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വിവർത്തനം സാധ്യമായ വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ നിർബന്ധമായി ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. ‘മുഖാന്തരം’, ‘നിമിത്തം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഔപചാരിക പദങ്ങളാണ്. മൂലത്തിലെ കർത്തൃസംബന്ധമായ സൂക്ഷ്മമായ അനിശ്ചിതത്വം അനാവശ്യമായി പരിഹരിച്ചിട്ടില്ല; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
