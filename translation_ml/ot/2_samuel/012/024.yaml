id: 2SA.12.24
reference: 2 Samuel 12:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְנַחֵ֣ם דָּוִ֗ד אֵ֚ת בַּת שֶׁ֣בַע אִשְׁתּ֔/וֹ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/יִּשְׁכַּ֣ב עִמָּ֑/הּ וַ/תֵּ֣לֶד בֵּ֗ן ו/יקרא אֶת שְׁמ/וֹ֙ שְׁלֹמֹ֔ה וַ/יהוָ֖ה אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
translation:
  language: ml
  text: പിന്നെ ദാവീദ് തന്റെ ഭാര്യയായ ബത്ത്-ശേബയെ ആശ്വസിപ്പിച്ചു[a]. അവൻ അവളുടെ അടുക്കൽ ചെന്ന് അവളോടുകൂടെ ശയിച്ചു[b]. അവൾ ഒരു മകനെ പ്രസവിച്ചു; ദാവീദ് അവന് ശലോമോൻ എന്നു പേരിട്ടു. യഹ്‌വെ അവനെ സ്നേഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാന്ത്വനപ്പെടുത്തി.’
    reason: lexical_alternative
  - marker: b
    text: ‘അവളുടെ അടുക്കൽ ചെന്ന് അവളോടുകൂടെ ശയിച്ചു’ എന്നത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְנַחֵם
  choice: ആശ്വസിപ്പിച്ചു
  rationale: കുഞ്ഞിന്റെ മരണത്തെത്തുടർന്നുള്ള ദുഃഖത്തിൽ ബത്ത്-ശേബയ്ക്ക് ആശ്വാസം നൽകിയതിനെ സൂചിപ്പിക്കുന്ന പിയേൽ ക്രിയയുടെ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളരൂപം.
- source_word: בַּת שֶׁבַע
  choice: ബത്ത്-ശേബ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയായ
  rationale: ഈ ഘട്ടത്തിൽ ബത്ത്-ശേബ ദാവീദിന്റെ ഭാര്യയാണെന്ന് എബ്രായപാഠം വ്യക്തമായി പറയുന്നതിനാൽ അത് ഒഴിവാക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיָּבֹא אֵלֶיהָ וַיִּשְׁכַּב עִמָּהּ
  choice: അവളുടെ അടുക്കൽ ചെന്ന് അവളോടുകൂടെ ശയിച്ചു
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന രണ്ട് എബ്രായ പ്രയോഗങ്ങളുടെയും മാന്യമായ ആഖ്യാനശൈലി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: וַתֵּלֶד בֵּן
  choice: അവൾ ഒരു മകനെ പ്രസവിച്ചു
  rationale: എബ്രായവാചകത്തിന്റെ ലളിതവും നേരിട്ടുള്ളതുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ שְׁלֹמֹה
  choice: ദാവീദ് അവന് ശലോമോൻ എന്നു പേരിട്ടു
  rationale: ക്രിയയുടെ കർത്താവ് ഏകവചന പുല്ലിംഗമാണ്; അടുത്ത സ്വാഭാവിക മുൻഗാമിയായ ദാവീദിനെ മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു. ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന എബ്രായ ശൈലിക്ക് സ്വാഭാവിക തുല്യരൂപമാണ് ‘പേരിട്ടു’.
- source_word: שְׁלֹמֹה
  choice: ശലോമോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲהֵבוֹ
  choice: അവനെ സ്നേഹിച്ചു
  rationale: אהב എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘സ്നേഹിക്കുക’ എന്നാണ്; പുരുഷലിംഗ പ്രത്യയം പുതുതായി ജനിച്ച മകനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ശലോമോന് പേരിട്ട വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: ദാവീദ്
  alternative: അവൻ
  rationale: എബ്രായക്രിയ ഏകവചന പുല്ലിംഗമാണെങ്കിലും കർത്താവിന്റെ പേര് വീണ്ടും പറയുന്നില്ല. സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികമായ സൂചന ദാവീദിലേക്കാണ്; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് വ്യക്തമാക്കുന്നു, എന്നാൽ മൂലത്തിലെ വ്യാകരണപരമായ പരോക്ഷത ശ്രദ്ധയിൽ വെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ പരോക്ഷവും ഗൗരവമുള്ളതുമായ ഭാഷ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന വാക്കുകളുടെയോ പ്രയോഗത്തിന്റെയോ പിന്നാലെ ചേർത്തു.
