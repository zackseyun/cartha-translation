source:
  edition: WLC
  text: וַ/יַּ֣רְא דָּוִ֗ד כִּ֤י עֲבָדָי/ו֙ מִֽתְלַחֲשִׁ֔ים וַ/יָּ֥בֶן דָּוִ֖ד כִּ֣י מֵ֣ת הַ/יָּ֑לֶד וַ/יֹּ֨אמֶר דָּוִ֧ד אֶל עֲבָדָ֛י/ו הֲ/מֵ֥ת הַ/יֶּ֖לֶד וַ/יֹּ֥אמְרוּ מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
translation:
  language: ml
  text: ദാവീദ് തന്റെ ഭൃത്യന്മാർ തമ്മിൽ പതുക്കെ സംസാരിക്കുന്നതു കണ്ടപ്പോൾ, കുട്ടി മരിച്ചെന്ന് മനസ്സിലാക്കി. ദാവീദ് തന്റെ ഭൃത്യന്മാരോട്, “കുട്ടി മരിച്ചോ?” എന്നു ചോദിച്ചു. “മരിച്ചു,”[a] എന്ന് അവർ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ഭൃത്യന്മാരുടെ മറുപടി ‘മരിച്ചു’ എന്ന ഒറ്റവാക്കു മാത്രമാണ്.
    reason: മൂലഭാഷയിലെ മറുപടിയുടെ സംക്ഷിപ്തരൂപം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ദൃശ്യഗ്രഹണം നിലനിർത്തുന്നു; ഭൃത്യന്മാരുടെ പെരുമാറ്റം കണ്ടതിൽനിന്നാണ് ദാവീദ് കാര്യം മനസ്സിലാക്കുന്നത്.
- source_word: עֲבָדָיו
  choice: തന്റെ ഭൃത്യന്മാർ
  rationale: രാജഗൃഹത്തിലെ സേവകരെയോ പരിചാരകരെയോ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘ഭൃത്യന്മാർ’ സ്വാഭാവികവും മാന്യവുമായ പദമാണ്; അടിമത്തമെന്ന അർഥം അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: מִתְלַחֲשִׁים
  choice: തമ്മിൽ മന്ത്രിക്കുന്നതു
  rationale: לחש എന്ന മൂലപദത്തിന്റെ ഹിത്പയേൽ രൂപം സൂചിപ്പിക്കുന്ന പതിഞ്ഞ സ്വരത്തിലുള്ള പരസ്പരസംസാരം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיָּבֶן
  choice: മനസ്സിലാക്കി
  rationale: കണ്ട ലക്ഷണങ്ങളിൽനിന്നുള്ള മാനസിക നിഗമനമാണ് בין ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הַיָּלֶד
  choice: കുട്ടി
  rationale: יֶלֶד ആൺകുട്ടിയെയും പൊതുവായി കുട്ടിയെയും സൂചിപ്പിക്കാം; ഇവിടെ ശിശുവായ മകനെക്കുറിച്ചായതിനാൽ ‘കുട്ടി’ സന്ദർഭോചിതമാണ്.
- source_word: הֲמֵת הַיֶּלֶד
  choice: കുട്ടി മരിച്ചോ?
  rationale: മരണാവസ്ഥയെക്കുറിച്ചുള്ള എബ്രായ ചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളസമാനമാണ്; ‘മരിച്ചുപോയോ’ എന്നതിലെ അധിക ഭാവസൂചന ഒഴിവാക്കുന്നു.
- source_word: מֵת
  choice: മരിച്ചു
  rationale: അവസാന മറുപടിയിലെ ഏകപദീയവും സംക്ഷിപ്തവുമായ എബ്രായപ്രയോഗം മലയാളത്തിലും സ്വാഭാവികമായ ഏകപദീയ മറുപടിയായി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: ചോദിച്ചു ... പറഞ്ഞു
  rationale: മൂലത്തിൽ രണ്ടിടത്തും אמר ആണെങ്കിലും, ആദ്യത്തെ വാക്യം വ്യക്തമായ ചോദ്യമായതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക സംഭാഷണക്രമത്തിൽ ‘ചോദിച്ചു’ എന്നും മറുപടിയിൽ ‘പറഞ്ഞു’ എന്നും നൽകിയിരിക്കുന്നു.
