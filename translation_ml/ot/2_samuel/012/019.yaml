translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഭൃത്യന്മാർ’ രാജഗൃഹപരിചാരകരെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ആവർത്തനം മിക്കവാറും നിലനിർത്തിയെങ്കിലും, ചോദ്യം-മറുപടി മലയാളത്തിൽ വ്യക്തമായി ഒഴുകാൻ ആദ്യത്തെ אמר ‘ചോദിച്ചു’ എന്നു വിവർത്തനം ചെയ്തു.
