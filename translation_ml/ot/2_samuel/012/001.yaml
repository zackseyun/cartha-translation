id: 2SA.12.1
reference: 2 Samuel 12:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אֶת נָתָ֖ן אֶל דָּוִ֑ד וַ/יָּבֹ֣א אֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁנֵ֣י אֲנָשִׁ֗ים הָיוּ֙ בְּ/עִ֣יר אֶחָ֔ת אֶחָ֥ד עָשִׁ֖יר וְ/אֶחָ֥ד רָֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
translation:
  language: ml
  text: 'യഹ്‌വേ നാഥാനെ ദാവീദിന്റെ അടുക്കലേക്ക് അയച്ചു. നാഥാൻ അവന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “ഒരു പട്ടണത്തിൽ രണ്ടു പുരുഷന്മാർ ഉണ്ടായിരുന്നു[a]. ഒരാൾ ധനികനും മറ്റേയാൾ ദരിദ്രനും ആയിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഒരു പട്ടണത്തിൽ രണ്ടു പുരുഷന്മാർ പാർത്തിരുന്നു.” ഹീബ്രു അക്ഷരാർഥത്തിൽ: “ഒരു പട്ടണത്തിൽ രണ്ടു പുരുഷന്മാർ ഉണ്ടായിരുന്നു.”'
    reason: הָיוּ എന്ന അസ്തിത്വപ്രയോഗത്തിന് സന്ദർഭാനുസൃതമായി ‘പാർത്തിരുന്നു’ എന്നും സ്വാഭാവികമായി പറയാം; മുഖ്യപാഠം കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയുടെ സ്വാഭാവികമായ ആഖ്യാനരൂപം; ദൗത്യമായി അയച്ചുവെന്ന ആശയം അധികവ്യാഖ്യാനമില്ലാതെ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶת נָתָן
  choice: നാഥാനെ
  rationale: നേരിട്ടുള്ള കർമസൂചകം മലയാളത്തിൽ വിഭക്തിയിലൂടെ പ്രകടമാക്കുകയും വ്യക്തിനാമം പതിവായ മലയാളരൂപത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: אֶל דָּוִד
  choice: ദാവീദിന്റെ അടുക്കലേക്ക്
  rationale: אֶל ഇവിടെ ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; ‘എതിരായി’ എന്നു വിവർത്തനം ചെയ്യുന്നത് സന്ദർഭത്തെ മുൻകൂട്ടി വ്യാഖ്യാനിക്കും.
- source_word: וַיָּבֹא אֵלָיו
  choice: നാഥാൻ അവന്റെ അടുക്കൽ വന്ന്
  rationale: בוא + אֶל എന്നതിന്റെ നേരിട്ടുള്ള ചലനാർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ കർത്താവിനെ ആവർത്തിക്കുന്നത് വ്യക്തത നൽകുന്നു.
- source_word: וַיֹּאמֶר לוֹ
  choice: അവനോടു പറഞ്ഞു
  rationale: ഹീബ്രുവിൽ വ്യക്തമാക്കിയിരിക്കുന്ന പരോക്ഷകർമം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: രണ്ടു പുരുഷന്മാർ
  rationale: ഉപമയിലെ രണ്ട് പുരുഷവ്യക്തികളെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָיוּ
  choice: ഉണ്ടായിരുന്നു
  rationale: היהയുടെ അസ്തിത്വാർഥം നേരിട്ട് നൽകുന്നു; ‘പാർത്തിരുന്നു’ എന്നത് സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും മൂലക്രിയയിൽ വ്യക്തമല്ല.
- source_word: בְּעִיר אֶחָת
  choice: ഒരു പട്ടണത്തിൽ
  rationale: ‘ഒരു പട്ടണത്തിൽ’ എന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അടുത്തായി നിലനിർത്തുന്നു; ‘ഒരേ പട്ടണത്തിൽ’ എന്നു പറഞ്ഞാൽ ബന്ധം കൂടുതൽ വ്യക്തമാക്കപ്പെടും.
- source_word: אֶחָד עָשִׁיר וְאֶחָד רָאשׁ
  choice: ഒരാൾ ധനികനും മറ്റേയാൾ ദരിദ്രനും ആയിരുന്നു
  rationale: ഹീബ്രുവിലെ സംക്ഷിപ്തവും ക്രിയാരഹിതവുമായ വിരുദ്ധജോടിയെ സ്വാഭാവിക മലയാളവാക്യമായി നൽകുന്നു; רָאשׁ എന്നത് ധനികന്റെ വിരുദ്ധമായി ‘ദരിദ്രൻ’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം തന്നെയാണ് ഉള്ളത്. അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, മലയാളത്തിൽ ഉച്ചാരണസമീപമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സർവനാമക്കുഴപ്പം ഒഴിവാക്കാൻ രണ്ടാം വാക്യത്തിൽ ‘നാഥാൻ’ ആവർത്തിച്ചു. ഉപമയുടെ സംക്ഷിപ്തതയും ധനികൻ–ദരിദ്രൻ എന്ന നേരിട്ടുള്ള വൈരുധ്യവും സംരക്ഷിച്ചു.
