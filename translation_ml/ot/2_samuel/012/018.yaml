- from: 'ഏഴാം ദിവസം കുഞ്ഞ് മരിച്ചു. കുഞ്ഞ് മരിച്ചുപോയെന്ന് ദാവീദിനോടു പറയാൻ അവന്റെ ദാസന്മാർ ഭയപ്പെട്ടു.[a] അവർ പറഞ്ഞു: “കുഞ്ഞ് ജീവനോടിരുന്നപ്പോൾ ഞങ്ങൾ അദ്ദേഹത്തോടു സംസാരിച്ചു; എന്നാൽ അദ്ദേഹം ഞങ്ങളുടെ വാക്കു കേട്ടില്ല. പിന്നെ, ‘കുഞ്ഞ് മരിച്ചു’ എന്ന് ഞങ്ങൾ എങ്ങനെ അദ്ദേഹത്തോടു പറയും? അദ്ദേഹം എന്തെങ്കിലും അനർഥം ചെയ്തേക്കാം.”'
  to: 'ഏഴാം ദിവസം കുഞ്ഞ് മരിച്ചു. കുഞ്ഞ് മരിച്ചെന്ന് ദാവീദിനോടു പറയാൻ അവന്റെ ദാസന്മാർ ഭയപ്പെട്ടു. അവർ പറഞ്ഞു: “നോക്കൂ, കുഞ്ഞ് ജീവനോടിരുന്നപ്പോൾ ഞങ്ങൾ അദ്ദേഹത്തോടു സംസാരിച്ചു; എന്നാൽ അദ്ദേഹം ഞങ്ങളുടെ വാക്കു കേട്ടില്ല. പിന്നെ, ‘കുഞ്ഞ് മരിച്ചു’ എന്ന് ഞങ്ങൾ എങ്ങനെ അദ്ദേഹത്തോടു പറയും? അദ്ദേഹം ദോഷകരമായ എന്തെങ്കിലും ചെയ്തേക്കാം.”[a]'
  rationale: The revision explicitly represents הִנֵּה with a natural modern Malayalam discourse marker, clarifies the open-ended harmful-action clause without narrowing its meaning, and moves the footnote anchor to the expression explained by the footnote. All other content and the source’s ambiguity are retained.
