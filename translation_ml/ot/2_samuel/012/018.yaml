base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
translation:
  language: ml
  text: 'ഏഴാം ദിവസം കുഞ്ഞ് മരിച്ചു. കുഞ്ഞ് മരിച്ചെന്ന് ദാവീദിനോടു പറയാൻ അവന്റെ ദാസന്മാർ ഭയപ്പെട്ടു. അവർ പറഞ്ഞു: “നോക്കൂ, കുഞ്ഞ് ജീവനോടിരുന്നപ്പോൾ ഞങ്ങൾ അദ്ദേഹത്തോടു സംസാരിച്ചു; എന്നാൽ അദ്ദേഹം ഞങ്ങളുടെ വാക്കു കേട്ടില്ല. പിന്നെ, ‘കുഞ്ഞ് മരിച്ചു’ എന്ന് ഞങ്ങൾ എങ്ങനെ അദ്ദേഹത്തോടു പറയും? അദ്ദേഹം ദോഷകരമായ എന്തെങ്കിലും ചെയ്തേക്കാം.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അവസാന വാചകം “അദ്ദേഹം തിന്മ ചെയ്തേക്കാം,” “മോശമായി പ്രതികരിച്ചേക്കാം,” അല്ലെങ്കിൽ ഒരുപക്ഷേ “സ്വയം ഉപദ്രവിച്ചേക്കാം” എന്നും മനസ്സിലാക്കാം. ഹീബ്രു പ്രയോഗം ചുരുക്കമാണ്; അവർ ഭയപ്പെട്ട കൃത്യം എന്താണെന്ന് അത് വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: തുടർന്നുണ്ടായ സംഭവത്തിന്റെ സമയത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; וַיְהִי എന്ന ആഖ്യാനസൂത്രം വേർതിരിച്ച് യാന്ത്രികമായി പരിഭാഷപ്പെടുത്തുന്നില്ല.
- source_word: וַיָּמָת הַיָּלֶד
  choice: കുഞ്ഞ് മരിച്ചു
  rationale: സന്ദർഭം ശിശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ יֶלֶד എന്നതിന് പ്രായം കൂടുതലെന്ന ധാരണ നൽകാത്ത ‘കുഞ്ഞ്’ യോജിക്കുന്നു.
- source_word: וַיִּרְאוּ עַבְדֵי דָוִד לְהַגִּיד לוֹ
  choice: ദാവീദിനോടു പറയാൻ അവന്റെ ദാസന്മാർ ഭയപ്പെട്ടു
  rationale: ഇവിടെ ירא ഭക്തിയല്ല, ഭയവും ആശങ്കയുമാണ്; הגיד സാധാരണ വ്യക്തിപരമായ സാഹചര്യത്തിൽ ‘പറയുക’ എന്നാണ്.
- source_word: כִּי מֵת הַיֶּלֶד
  choice: കുഞ്ഞ് മരിച്ചുപോയെന്ന്
  rationale: അവർ അറിയിക്കാൻ ഭയപ്പെട്ട വാർത്തയുടെ ഉള്ളടക്കം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הִנֵּה
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരകണമാണ്; ഉദ്ധരണിയുടെ ആശങ്കാഭരിതമായ ഘടനയിൽ അതിന്റെ പ്രയോഗഫലം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ ‘ഇതാ’ ചേർക്കുന്നത് മലയാളത്തിൽ കൃത്രിമമാകും.
- source_word: בִּהְיוֹת הַיֶּלֶד חַי
  choice: കുഞ്ഞ് ജീവനോടിരുന്നപ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct സൂചിപ്പിക്കുന്ന സമകാലികതയും മരണവാർത്തയുമായുള്ള വൈരുധ്യവും വ്യക്തമായി നൽകുന്നു.
- source_word: דִּבַּרְנוּ אֵלָיו וְלֹא שָׁמַע בְּקוֹלֵנוּ
  choice: ഞങ്ങൾ അദ്ദേഹത്തോടു സംസാരിച്ചു; എന്നാൽ അദ്ദേഹം ഞങ്ങളുടെ വാക്കു കേട്ടില്ല
  rationale: ‘ശബ്ദം കേൾക്കുക’ എന്നതിലുപരി ഇവിടെ അർഥം ഉപദേശം ചെവിക്കൊള്ളാതിരിക്കുക എന്നതാണ്; ‘ഞങ്ങളുടെ വാക്കു കേട്ടില്ല’ ആ ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: וְאֵיךְ נֹאמַר אֵלָיו
  choice: പിന്നെ ... ഞങ്ങൾ എങ്ങനെ അദ്ദേഹത്തോടു പറയും?
  rationale: മുമ്പത്തെ സാഹചര്യത്തിൽനിന്നുള്ള നിഗമനവും ആശങ്കാഭരിതമായ അലങ്കാരചോദ്യവും ‘പിന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: וְעָשָׂה רָעָה
  choice: അദ്ദേഹം എന്തെങ്കിലും അനർഥം ചെയ്തേക്കാം
  rationale: רָעָה ദോഷം, തിന്മ, അനർഥം എന്നിവ സൂചിപ്പിക്കാം; കർമമോ കൃത്യത്തിന്റെ സ്വഭാവമോ വ്യക്തമല്ലാത്തതിനാൽ ‘എന്തെങ്കിലും അനർഥം’ ആ അവ്യക്തത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: וְעָשָׂה רָעָה എന്നതിൽ ദാവീദ് ചെയ്യുമെന്ന് ഭയപ്പെട്ട പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: ‘എന്തെങ്കിലും അനർഥം ചെയ്തേക്കാം’ എന്നു പറഞ്ഞ് പ്രവൃത്തി വ്യക്തമാക്കാതെ നിലനിർത്തി
  alternative: ‘സ്വയം ഉപദ്രവിച്ചേക്കാം,’ ‘തിന്മ ചെയ്തേക്കാം,’ അല്ലെങ്കിൽ ‘മോശമായി പ്രതികരിച്ചേക്കാം’
  rationale: ഹീബ്രുവിൽ കർമവും കൃത്യത്തിന്റെ കൃത്യസ്വഭാവവും നൽകിയിട്ടില്ല. ആത്മഹാനിയോ ധാർമിക തിന്മയോ എന്ന് തീർച്ചപ്പെടുത്തുന്നത് മൂലപാഠത്തിലെ യഥാർഥ അവ്യക്തത ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ആഖ്യാനശൈലി. രാജാവായ ദാവീദിനെ ദാസന്മാർ പരാമർശിക്കുന്ന ഉദ്ധരണിയിൽ ആദരസൂചകമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു; ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ‘അവന്റെ’ നിലനിർത്തി.
