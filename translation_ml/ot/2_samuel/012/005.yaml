reference: 2 Samuel 12:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף דָּוִ֛ד בָּ/אִ֖ישׁ מְאֹ֑ד וַ/יֹּ֨אמֶר֙ אֶל נָתָ֔ן חַי יְהוָ֕ה כִּ֣י בֶן מָ֔וֶת הָ/אִ֖ישׁ הָ/עֹשֶׂ֥ה זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദിന് ആ മനുഷ്യനെതിരെ അത്യന്തം കോപം ജ്വലിച്ചു; അവൻ നാഥാനോടു പറഞ്ഞു: “യഹ്‌വേ ജീവിച്ചിരിക്കുന്നതുപോലെ, ഇത് ചെയ്ത ആ മനുഷ്യൻ മരണത്തിന് അർഹനാണ്[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘മരണത്തിന്റെ മകൻ’; അതായത്, മരിക്കാൻ അർഹനായവൻ.'
    reason: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരരൂപവും അതിന്റെ ഉദ്ദേശിച്ച അർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיִּחַר אַף ... מְאֹד
  choice: കടുത്ത കോപം ജ്വലിച്ചു
  rationale: കോപം ‘ജ്വലിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവവും מְאֹד നൽകുന്ന തീവ്രതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: בָּאִישׁ
  choice: ആ മനുഷ്യനോടു
  rationale: ദാവീദിന്റെ കോപം ആരെ ലക്ഷ്യമാക്കിയെന്നു വ്യക്തമാക്കുന്നു; ഉപമയിലെ മനുഷ്യനെ നിർദ്ദിഷ്ടമായി സൂചിപ്പിക്കാൻ ‘ആ’ ഉപയോഗിച്ചു.
- source_word: חַי יְהוָה
  choice: യഹ്‌വേ ജീവനുള്ളവൻ എന്നാണ
  rationale: ദൈവനാമം ഉൾക്കൊള്ളുന്ന ഗൗരവമുള്ള ശപഥസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בֶן מָוֶת
  choice: മരണയോഗ്യൻ
  rationale: അക്ഷരാർഥത്തിലെ ‘മരണത്തിന്റെ മകൻ’ എന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാം; അതിന്റെ ന്യായവിധിസംബന്ധമായ അർഥമായ ‘മരിക്കാൻ അർഹനായവൻ’ സംക്ഷിപ്തവും ശക്തവുമായി നൽകുന്നു.
- source_word: הָעֹשֶׂה זֹאת
  choice: ഇതു ചെയ്ത
  rationale: കർത്തൃവാചകമായ എബ്രായ പങ്കാളിത്തരൂപത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള ഭൂതകാലബന്ധവാക്യമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ‘യഹ്‌വേ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: בֶן מָוֶת എന്ന പ്രയോഗത്തിന്റെ രൂപം
  choice: മരണയോഗ്യൻ
  alternative: മരണത്തിന്റെ മകൻ; മരിക്കേണ്ടവൻ
  rationale: ഇത് ജന്മബന്ധത്തെക്കുറിച്ചല്ല, മരണശിക്ഷയ്ക്ക് അർഹതയുള്ളവനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. പ്രധാനപാഠത്തിൽ അർഥം വ്യക്തമായി നൽകി, അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കോപം ജ്വലിച്ചു’ എന്ന പ്രയോഗം മൂലഭാഷയുടെ ശക്തി നിലനിർത്തുന്നു; ‘മരണയോഗ്യൻ’ നിയമവിധിയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
