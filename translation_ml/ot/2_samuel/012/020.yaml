base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
translation:
  language: ml
  text: പിന്നെ ദാവീദ് നിലത്തുനിന്ന് എഴുന്നേറ്റ് കുളിച്ചു, എണ്ണ പൂശി, വസ്ത്രം മാറി. അവൻ യഹ്‌വെയുടെ ഭവനത്തിൽ ചെന്ന് കുനിഞ്ഞു വണങ്ങി.[a] പിന്നെ അവൻ തന്റെ വീട്ടിലേക്കു ചെന്നു, ഭക്ഷണം ചോദിച്ചു. അവർ അവന്റെ മുമ്പിൽ അപ്പം വെച്ചു, അവൻ ഭക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആരാധിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായക്രിയ ആദരവോടെയോ ആരാധനയോടെയോ കുനിയുന്നതിനെയോ സാഷ്ടാംഗം വീഴുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם ... מֵהָאָרֶץ
  choice: നിലത്തുനിന്ന് എഴുന്നേറ്റ്
  rationale: മരണദുഃഖത്തിൽ ദാവീദ് നിലത്തു കിടന്നിരുന്ന സന്ദർഭത്തിലെ ദൃശ്യമായ പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּרְחַץ
  choice: കുളിച്ചു
  rationale: רחץ കഴുകുക എന്നോ കുളിക്കുക എന്നോ അർഥമാക്കാം; എണ്ണ പൂശുകയും വസ്ത്രം മാറുകയും ചെയ്യുന്ന ഈ ക്രമത്തിൽ ‘കുളിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: וַיָּסֶךְ
  choice: എണ്ണ പൂശി
  rationale: സ്വയം എണ്ണ പുരട്ടുന്ന ദൈനംദിന ശുചീകരണപ്രവൃത്തിയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ‘അഭിഷേകം ചെയ്തു’ എന്നത് അനാവശ്യമായ ആചാരപരമായ അർഥം നൽകാം.
- source_word: וַיְחַלֵּף שִׂמְלֹתוֹ
  choice: വസ്ത്രം മാറി
  rationale: മലയാളത്തിലെ സ്വാഭാവികമായ കൂട്ടർഥപ്രയോഗം; വിലാപവസ്ത്രത്തിൽനിന്നുള്ള മാറ്റത്തെയും യോജിച്ചുവഹിക്കുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ഭവനം
  rationale: בית എന്ന പദത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട് ദൈവനാമമായ יהוה വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיִּשְׁתָּחוּ
  choice: സാഷ്ടാംഗം നമസ്കരിച്ചു
  rationale: കുനിയുക അഥവാ സാഷ്ടാംഗം വീഴുക എന്ന ദേഹഭാവവും ഭക്തിപൂർവമായ നമസ്കാരവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; ‘ആരാധിച്ചു’ എന്ന വിശാലമായ അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: וַיִּשְׁאַל
  choice: ഭക്ഷണം ആവശ്യപ്പെട്ടു
  rationale: എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും പിന്നാലെ അപ്പം മുന്നിൽ വെക്കുന്നതിൽനിന്ന് അഭ്യർഥനയുടെ ഉള്ളടക്കം സന്ദർഭപരമായി വ്യക്തമാകുന്നു; മലയാളത്തിൽ വെറും ‘ആവശ്യപ്പെട്ടു’ അപൂർണമായി തോന്നും.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഇവിടെ അത് ഭക്ഷണത്തെയും പ്രതിനിധീകരിക്കാം.
- source_word: וַיָּשִׂימוּ לוֹ לֶחֶם וַיֹּאכַל
  choice: അവർ അവന്റെ മുമ്പിൽ അപ്പം വെച്ചു; അവൻ ഭക്ഷിച്ചു
  rationale: അനിർദ്ദിഷ്ട ബഹുവചന കർത്താവിനെയും ലളിതമായ കഥനക്രമത്തെയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവർണ ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: וַיִּשְׁתָּחוּ എന്നതിലെ ദേഹഭാവവും ആരാധനാർഥവും
  choice: സാഷ്ടാംഗം നമസ്കരിച്ചു
  alternative: ആരാധിച്ചു; കുനിഞ്ഞു നമസ്കരിച്ചു
  rationale: ദൈവഭവനത്തിലെ സന്ദർഭം ആരാധന സൂചിപ്പിക്കുന്നുവെങ്കിലും ക്രിയയുടെ അടിസ്ഥാനമായ ശാരീരിക കുനിയൽ/സാഷ്ടാംഗപ്രണാമം നഷ്ടപ്പെടുത്തുന്നില്ല; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘എണ്ണ പൂശി’ എന്നത് സാധാരണ ശുചീകരണപ്രവൃത്തിയെ വ്യക്തമാക്കുകയും അനാവശ്യമായ ആചാരാർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു. മുഖ്യപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട ക്രിയയ്ക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
