  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സൈനികവിവരണശൈലി. അവസാനത്തെ എബ്രായ നാമപ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അതിന്റെ കൂടുതൽ സ്വാഭാവിക മലയാളരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
