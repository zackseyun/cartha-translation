  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
translation:
  language: ml
  text: ഇപ്പോൾ ശേഷിച്ച സൈന്യത്തെ കൂട്ടിവരുത്തി നഗരത്തിനെതിരെ പാളയമിറങ്ങി അതു പിടിച്ചടക്കുക. അല്ലെങ്കിൽ ഞാൻതന്നെ നഗരം പിടിച്ചടക്കും; എന്റെ പേര് അതിന്മേൽ വിളിക്കപ്പെടുകയും ചെയ്യും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ സ്വാഭാവികമായി, “ആ നഗരം എന്റെ പേരിൽ അറിയപ്പെടും.” എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “എന്റെ പേര് അതിന്മേൽ വിളിക്കപ്പെടും” എന്നാണ്. നഗരം കീഴടക്കിയതിന്റെ ബഹുമതി യോവാബിനാണെന്നു കണക്കാക്കപ്പെടുമെന്ന ആശയമാണ് ഈ പ്രയോഗം നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: അടിയന്തരമായി ചെയ്യേണ്ട അടുത്ത നടപടിയിലേക്കു കടക്കുന്ന സംഭാഷണസൂചകമായി സ്വാഭാവികമായ ആധുനിക മലയാളം.
- source_word: אֱסֹף
  choice: കൂട്ടിവരുത്തി
  rationale: സൈനികസന്ദർഭത്തിൽ ശേഷിക്കുന്ന സൈന്യത്തെ ഒരുമിച്ചുകൂട്ടുക എന്ന ആജ്ഞ വ്യക്തമാക്കുന്നു.
- source_word: יֶתֶר הָעָם
  choice: ശേഷിച്ച സൈന്യത്തെ
  rationale: עָם എന്നതിന് സാധാരണയായി ‘ജനം’ എന്നർഥമുണ്ടെങ്കിലും, ഉപരോധസന്ദർഭത്തിൽ ദാവീദിനോടൊപ്പമുള്ള ശേഷിച്ച പോരാളികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַחֲנֵה עַל הָעִיר
  choice: നഗരത്തിനെതിരെ പാളയമിറങ്ങി
  rationale: חנה എന്ന ക്രിയയുടെ ‘പാളയമിറങ്ങുക’ എന്ന അടിസ്ഥാനാർഥവും നഗരത്തിനെതിരായ സൈനികനിലപാടും നിലനിർത്തുന്നു; ‘ഉപരോധിക്കുക’ എന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: וְלָכְדָהּ
  choice: അതു പിടിച്ചടക്കുക
  rationale: യുദ്ധസന്ദർഭത്തിലെ לכד എന്ന ക്രിയയുടെ പിടിക്കുക/കീഴടക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: മുന്നറിയിപ്പോടുകൂടിയ നിഷേധാത്മക ഫലം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֶלְכֹּד אֲנִי
  choice: ഞാൻതന്നെ നഗരം പിടിച്ചടക്കും
  rationale: സ്വതന്ത്ര സർവനാമമായ אֲנִי നൽകുന്ന ഊന്നൽ ‘ഞാൻതന്നെ’ എന്നതിലൂടെ സംരക്ഷിക്കുകയും മുമ്പത്തെ യുദ്ധക്രിയ ആവർത്തിക്കുകയും ചെയ്യുന്നു.
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  choice: എന്റെ പേര് അതിന്മേൽ വിളിക്കപ്പെടുകയും ചെയ്യും
  rationale: ‘എന്റെ പേര് അതിന്മേൽ വിളിക്കപ്പെടുക’ എന്ന എബ്രായ പ്രയോഗം അതിന്റെ ബഹുമതി, അവകാശവാദം, പേരോടുള്ള ബന്ധം എന്നീ അർഥസാധ്യതകൾ ഒറ്റ അർഥത്തിലേക്കു ചുരുക്കാതെ നിലനിർത്തുന്നു.
