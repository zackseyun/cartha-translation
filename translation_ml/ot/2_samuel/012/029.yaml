translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ സംഭവക്രമം സ്വാഭാവികമായ രണ്ട് മലയാളവാക്യങ്ങളായി അവതരിപ്പിച്ചിരിക്കുന്നു; സൈനികസന്ദർഭം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുമ്പോഴും മുഖ്യവാചകത്തിലെ മൂലപാഠത്തിന്റെ പൊതുവായ പദപ്രയോഗം സംരക്ഷിച്ചിട്ടുണ്ട്.
