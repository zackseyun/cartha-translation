  yaml_path: translation/ot/2_samuel/012/029.yaml
  text: Then David gathered all the people and went to Rabbah and fought against it and captured it[a].
translation:
  language: ml
  text: അപ്പോൾ ദാവീദ് ജനത്തെല്ലാം ഒരുമിച്ചുകൂട്ടി രബ്ബായിലേക്കു ചെന്നു. അവൻ അതിനെതിരെ യുദ്ധം ചെയ്ത് അതു പിടിച്ചെടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജനത്തെല്ലാം’ എന്നതിന് ‘സൈന്യത്തെയെല്ലാം’ അല്ലെങ്കിൽ ‘പടയാളികളെയെല്ലാം’ എന്നും അർഥമാകാം; എബ്രായത്തിൽ അക്ഷരാർഥം ‘ജനമെല്ലാം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: ഒരുമിച്ചുകൂട്ടി
  rationale: אסף എന്ന ക്രിയയ്ക്ക് ഇവിടെ ആളുകളെ ഒന്നിച്ചുകൂട്ടുക എന്ന അടിസ്ഥാനാർഥമാണ്. സൈനികസന്ദർഭം ഉണ്ടായിരുന്നാലും ഔപചാരികമായി സൈന്യത്തെ അണിനിരത്തി എന്ന അധികവിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: כָּל הָעָם
  choice: ജനത്തെയെല്ലാം
  rationale: എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ജനമെല്ലാം’ എന്നാണ്. സന്ദർഭത്തിൽ ഇത് യുദ്ധസേനയെ സൂചിപ്പിക്കാമെങ്കിലും പ്രത്യേക സൈനികപദം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ പൊതുവായ അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: רַבָּתָה
  choice: രബ്ബയിലേക്കു
  rationale: രബ്ബ എന്ന സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה നഗരത്തിലേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: അതിനെതിരെ യുദ്ധംചെയ്ത്
  rationale: לחם എന്ന ക്രിയ ב എന്ന ഉപസർഗത്തോടുകൂടെ നഗരത്തിനെതിരെ യുദ്ധത്തിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം നഗരത്തെയാണ് പരാമർശിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അതിനെതിരെ’ എന്നു നൽകുന്നു.
- source_word: וַיִּלְכְּדָהּ
  choice: അതു പിടിച്ചെടുത്തു
  rationale: לכד യുദ്ധസന്ദർഭത്തിൽ ഒരു നഗരത്തെ പിടിച്ചടക്കുക എന്നർഥം നൽകുന്നു. ‘പിടിച്ചെടുത്തു’ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
