id: 2SA.12.22
reference: 2 Samuel 12:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בְּ/עוֹד֙ הַ/יֶּ֣לֶד חַ֔י צַ֖מְתִּי וָֽ/אֶבְכֶּ֑ה כִּ֤י אָמַ֨רְתִּי֙ מִ֣י יוֹדֵ֔עַ יחנ/ני יְהוָ֖ה וְ/חַ֥י הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/022.yaml
  text: He said[a], “While the child was still alive, I fasted and wept, because I said, ‘Who knows? Yahweh may be gracious to me, and the child may live.’”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “കുട്ടി ജീവനോടിരുന്നപ്പോൾ ഞാൻ ഉപവസിക്കുകയും കരയുകയും ചെയ്തു; കാരണം, ‘ആർക്കറിയാം? യാഹ്‌വേ എന്നോടു കൃപ കാണിച്ചേക്കാം; കുട്ടി ജീവിച്ചേക്കാം’ എന്നു ഞാൻ പറഞ്ഞു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעוֹד הַיֶּלֶד חַי
  choice: കുട്ടി ജീവനോടിരുന്നപ്പോൾ
  rationale: בְּעוֹד തുടരുന്ന ഒരു അവസ്ഥയുടെ കാലപരിധി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ജീവനോടിരുന്നപ്പോൾ’ സ്വാഭാവികമായി ആ സമയബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: צַמְתִּי
  choice: ഞാൻ ഉപവസിച്ചു
  rationale: צום എന്ന ക്രിയയുടെ നേരായ അർഥം ഉപവസിക്കുക എന്നാണ്.
- source_word: וָאֶבְכֶּה
  choice: കരഞ്ഞു
  rationale: בכה കരയുക/വിലപിക്കുക എന്ന അർഥം നൽകുന്നു; സന്ദർഭത്തിലെ ദുഃഖഗൗരവത്തിന് ‘കരഞ്ഞു’ യോജിക്കുന്നു.
- source_word: כִּי אָמַרְתִּי
  choice: കാരണം, … എന്നു ഞാൻ വിചാരിച്ചു
  rationale: כִּי ഇവിടെ ഉപവാസത്തിന്റെയും കരച്ചിലിന്റെയും കാരണം അവതരിപ്പിക്കുന്നു. אָמַרְתִּי അക്ഷരാർഥത്തിൽ ‘ഞാൻ പറഞ്ഞു’ എന്നാണെങ്കിലും സ്വയം ഉള്ളിൽ പറഞ്ഞത് എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ഞാൻ വിചാരിച്ചു’ എന്നു നൽകുന്നു.
- source_word: מִי יוֹדֵעַ
  choice: ആർക്കറിയാം?
  rationale: ദൈവം ഇനിയും എന്തു ചെയ്തേക്കുമെന്ന അനിശ്ചിതത്വം പ്രകടിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: יְחָנֵּנִי
  choice: എന്നോടു കൃപ കാണിച്ചേക്കാം
  rationale: חנן കൃപയോ അനുകൂലതയോ കാണിക്കുക എന്ന ആശയം നൽകുന്നു; ഒന്നാംപുരുഷ കർമപ്രത്യയവും സാധ്യതാഭാവവും ഈ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וְחַי הַיָּלֶד
  choice: കുട്ടി ജീവിച്ചേക്കാം
  rationale: ‘ആർക്കറിയാം?’ എന്ന പ്രയോഗത്തിന്റെ പരിധിയിൽ ഇത് ദാവീദിന്റെ പ്രത്യാശയുള്ള സാധ്യതയാണ്, ഉറപ്പല്ല; ‘ജീവിച്ചേക്കാം’ ആ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദനാമംകൊണ്ട് പകരാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: ദൈവത്തിന്റെ പ്രതികരണത്തെക്കുറിച്ചുള്ള ദാവീദിന്റെ പ്രത്യാശ
  choice: കൃപ കാണിച്ചേക്കാം; കുട്ടി ജീവിച്ചേക്കാം
  alternative: കൃപ കാണിക്കും; കുട്ടി ജീവിക്കും
  rationale: מִי יוֹדֵעַ അനിശ്ചിതത്വവും പ്രത്യാശയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു. അതിനാൽ ഉറപ്പായി പ്രസ്താവിക്കാതെ രണ്ടു ഘടകങ്ങളിലും സാധ്യതാഭാവം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. അനിശ്ചിതത്വം മായ്ച്ചുകളയാതിരിക്കാനായി ‘ചെയ്തേക്കാം’ എന്ന സാധ്യതാരൂപം രണ്ടു പ്രത്യാശാവാക്യങ്ങളിലും നിലനിർത്തി.
