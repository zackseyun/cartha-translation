id: 2SA.12.14
reference: 2 Samuel 12:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶ֗פֶס כִּֽי נִאֵ֤ץ נִאַ֨צְתָּ֙ אֶת אֹיְבֵ֣י יְהוָ֔ה בַּ/דָּבָ֖ר הַ/זֶּ֑ה גַּ֗ם הַ/בֵּ֛ן הַ/יִּלּ֥וֹד לְ/ךָ֖ מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/014.yaml
  text: Nevertheless[a], because by this matter you have utterly scorned the enemies of Yahweh, the son born to you will surely die.
translation:
  language: ml
  text: എങ്കിലും[a], ഈ കാര്യംകൊണ്ട് നീ യഹോവയുടെ ശത്രുക്കളെ അങ്ങേയറ്റം നിന്ദിച്ചതിനാൽ, നിനക്കു ജനിച്ച മകൻ തീർച്ചയായും മരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പല പരിഭാഷകളും പ്രയാസമുള്ള ഈ എബ്രായപാഠത്തെ വ്യാഖ്യാനിച്ചോ തിരുത്തിയോ, ‘നീ യഹോവയുടെ ശത്രുക്കൾക്കു നിന്ദിക്കാനോ ദൈവദൂഷണം പറയാനോ അവസരം നൽകി’ എന്ന അർത്ഥത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶפֶס
  choice: എങ്കിലും
  rationale: മുൻവാക്യത്തിലെ ക്ഷമാപ്രഖ്യാപനത്തിനു പിന്നാലെ ശക്തമായ വിരുദ്ധപരിമിതി അവതരിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: …തിനാൽ
  rationale: പ്രഖ്യാപിക്കപ്പെടുന്ന പരിണതിയുടെ കാരണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נִאֵץ נִאַצְתָּ
  choice: അങ്ങേയറ്റം നിന്ദിച്ചതിനാൽ
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും പരിണതക്രിയയും ചേർന്നുള്ള ഊന്നൽ നിലനിർത്തുന്നു; נאץ സൂചിപ്പിക്കുന്ന കടുത്ത അവജ്ഞയും പ്രകടമാക്കുന്നു.
- source_word: אֶת אֹיְבֵי יְהוָה
  choice: യഹോവയുടെ ശത്രുക്കളെ
  rationale: ലഭ്യമായ മസോററ്റിക് പാഠത്തിൽ ഈ പദസമുച്ചയം ക്രിയയുടെ നേരിട്ടുള്ള കർമമായി വരുന്നതിനാൽ അതിനെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: בַּדָּבָר הַזֶּה
  choice: ഈ കാര്യംകൊണ്ട്
  rationale: דבר ഇവിടെ പരാമർശിക്കപ്പെട്ട മുഴുവൻ സംഭവത്തെയോ പ്രവൃത്തിയെയോ സൂചിപ്പിക്കാൻ കഴിയുന്ന വിശാലമായ പദമാണ്.
- source_word: גַּם
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: കൂട്ടിച്ചേർക്കലിന്റെയോ ഊന്നലിന്റെയോ ശക്തി മലയാളവാക്യത്തിന്റെ ഫലപ്രഖ്യാപനത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ‘കൂടാതെ’ ചേർത്താൽ വാക്യം ഭാരമുള്ളതാകും.
- source_word: הַבֵּן הַיִּלּוֹד לְךָ
  choice: നിനക്കു ജനിച്ച മകൻ
  rationale: בֵּן എന്നതിന്റെ പുരുഷലിംഗസൂചനയും നിനക്കു ജനിച്ചവൻ എന്ന നിഷ്ക്രിയ അർത്ഥവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: מוֹת יָמוּת
  choice: തീർച്ചയായും മരിക്കും
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും അപൂർണക്രിയയും ചേർന്നുള്ള ഉറപ്പിന്റെയും ഊന്നലിന്റെയും ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘യഹോവയുടെ ശത്രുക്കൾ’ ഉൾപ്പെടുന്ന വാക്യഭാഗത്തിലെ കർത്തൃ-കർമബന്ധം
  choice: മസോററ്റിക് പാഠത്തെ നേരിട്ട് പിന്തുടർന്ന്, ദാവീദ് ‘യഹോവയുടെ ശത്രുക്കളെ’ നിന്ദിച്ചു എന്ന വായന പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
  alternative: ദാവീദ് യഹോവയുടെ ശത്രുക്കൾക്കു നിന്ദിക്കാനോ ദൈവദൂഷണം പറയാനോ അവസരം നൽകി; അല്ലെങ്കിൽ ദാവീദ് യഹോവയെ നിന്ദിച്ചു.
  rationale: നൽകപ്പെട്ട WLC പാഠത്തിലെ אֵת എന്ന നേരിട്ടുള്ള കർമചിഹ്നം ‘യഹോവയുടെ ശത്രുക്കളെ’ ക്രിയയുടെ കർമമായി അടയാളപ്പെടുത്തുന്നു. സന്ദർഭപരമായി പ്രയാസമുള്ളതായിരുന്നാലും പാഠത്തെ തിരുത്തി അർത്ഥം നിശ്ചയിക്കാതെ, പ്രചാരത്തിലുള്ള വ്യാഖ്യാനവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മസോററ്റിക് പാഠത്തിലെ പ്രയാസമുള്ള വായന പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും സാധാരണക്കാരന് മനസ്സിലാകുന്ന വിധത്തിൽ പരമ്പരാഗത ബദൽവായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
