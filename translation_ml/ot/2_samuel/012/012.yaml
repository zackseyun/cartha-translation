source:
  edition: WLC
  text: כִּ֥י אַתָּ֖ה עָשִׂ֣יתָ בַ/סָּ֑תֶר וַ/אֲנִ֗י אֶעֱשֶׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל וְ/נֶ֥גֶד הַ/שָּֽׁמֶשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/012.yaml
  text: For you did it in secret[a], but I will do this thing before all Israel and before the sun.
translation:
  language: ml
  text: എന്തെന്നാൽ, നീ അതു രഹസ്യമായി ചെയ്തു; എന്നാൽ ഞാൻ ഈ കാര്യം സകല ഇസ്രായേലിന്റെയും മുമ്പാകെയും സൂര്യന്റെ മുമ്പാകെയും[a] ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പട്ടാപ്പകൽ’; അക്ഷരാർഥം, ‘സൂര്യന്റെ മുമ്പിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: '[പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: മുൻവാക്യത്തിൽ പ്രഖ്യാപിച്ച ന്യായവിധിയുടെ കാരണം അവതരിപ്പിക്കുന്ന ഘടകമാണിത്. മലയാളത്തിൽ വാക്യബന്ധവും തുടർന്നുള്ള വൈരുധ്യവും ആ വിശദീകരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ ‘എന്തെന്നാൽ’ ചേർക്കാതെ വിട്ടു.
- source_word: עָשִׂיתָ
  choice: നീ അതു … ചെയ്തു
  rationale: ദാവീദിന്റെ കുറ്റകൃത്യത്തെ വീണ്ടും വിശദീകരിക്കാതെ അതിലേക്കു സൂചിപ്പിക്കുന്ന എബ്രായവാക്യത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: בַסָּתֶר
  choice: രഹസ്യമായി
  rationale: ‘മറഞ്ഞിടത്തിൽ/രഹസ്യത്തിൽ’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുകയും തുടർന്നുള്ള പരസ്യമായ നടപടിയോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַאֲנִי
  choice: എന്നാൽ ഞാൻ
  rationale: വാവ് സംയോജകമായിരിക്കാമെങ്കിലും, ദാവീദിന്റെ രഹസ്യപ്രവൃത്തിയും ദൈവത്തിന്റെ പരസ്യനടപടിയും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം ഇവിടെ ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶעֱשֶׂה
  choice: ചെയ്യും
  rationale: വരാനിരിക്കുന്ന ന്യായവിധിയെക്കുറിച്ചുള്ള പ്രഖ്യാപനത്തിന്റെ ഭാവികാലബോധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: പ്രഖ്യാപിക്കപ്പെട്ട നടപടിയിലേക്കുള്ള നിർദ്ദേശം കാത്തുസൂക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണ്.
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: സകല ഇസ്രായേലിന്റെയും മുമ്പിൽ
  rationale: എല്ലാ ഇസ്രായേലിന്റെയും സാന്നിധ്യത്തിലും കാഴ്ചയിലും പരസ്യമായി നടക്കുമെന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וְנֶגֶד הַשָּׁמֶשׁ
  choice: സൂര്യന്റെ മുമ്പിലും
  rationale: എബ്രായത്തിലെ ദൃശ്യരൂപമായ ‘സൂര്യന്റെ മുമ്പിൽ’ പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; ‘പട്ടാപ്പകൽ’ എന്ന ആശയപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: പ്രഖ്യാപിക്കപ്പെട്ട ന്യായവിധിയിലെ ദൈവിക പ്രവർത്തകത്വം
  choice: ‘ഞാൻ … ചെയ്യും’ എന്ന ഒന്നാംപുരുഷ ദൈവിക പ്രവർത്തകത്വം നിലനിർത്തി.
  alternative: ‘ഞാൻ ഇതു ചെയ്യിപ്പിക്കും’
  rationale: എബ്രായത്തിൽ ലളിതമായ ഒന്നാംപുരുഷ ക്രിയയാണ്. വിശാലമായ ആഖ്യാനത്തിൽ ചരിത്രസംഭവങ്ങളിലൂടെയാണ് വിധി നടപ്പാകുന്നതെങ്കിലും, ഈ വാക്യത്തിലെ നേരിട്ടുള്ള ദൈവിക പ്രവർത്തകത്വം മയപ്പെടുത്തുകയോ കാരണകർത്തൃരൂപമാക്കുകയോ ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സകല ഇസ്രായേൽ’ എന്ന ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ കൂട്ടനാമവും ‘സൂര്യന്റെ മുമ്പിൽ’ എന്ന മൂലഭാഷയിലെ ദൃശ്യരൂപവും നിലനിർത്തി.
