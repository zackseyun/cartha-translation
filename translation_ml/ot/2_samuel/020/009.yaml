  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
translation:
  language: ml
  text: യോവാബ് അമാസയോട്[a], “എന്റെ സഹോദരാ, നിനക്കു സുഖമാണോ?” എന്നു ചോദിച്ചു. പിന്നെ യോവാബ് അവനെ ചുംബിക്കാനായി വലതുകൈകൊണ്ട് അമാസയുടെ താടിയിൽ പിടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: താടിയിൽ പിടിക്കുന്നതും ചുംബിക്കുന്നതും അടുപ്പമുള്ള അഭിവാദനവുമായി ബന്ധപ്പെട്ട ആംഗ്യങ്ങളായിരുന്നു; എന്നാൽ ഈ സന്ദർഭത്തിൽ ഈ പ്രവൃത്തി വഞ്ചനാപരമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם
  choice: നിനക്കു സുഖമാണോ?
  rationale: സമാധാനമോ ക്ഷേമമോ അന്വേഷിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വെറും അഭിവാദ്യമായി ചുരുക്കുന്നില്ല.
- source_word: אָחִי
  choice: എന്റെ സഹോദരാ
  rationale: എബ്രായത്തിലെ ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം നിലനിർത്തുകയും സന്ദർഭത്തിലെ അടുപ്പം നടിക്കുന്ന അഭിസംബോധന പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַתֹּחֶז
  choice: പിടിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ പിടിക്കൽ വ്യക്തമാക്കുന്നു; അടുത്ത വാക്യത്തിലെ ആക്രമണം മുൻകൂട്ടി വ്യാഖ്യാനിച്ച് ഇവിടെ അനാവശ്യമായ ഹിംസാഭാവം ചേർക്കുന്നില്ല.
- source_word: יַד יְמִין יוֹאָב
  choice: യോവാബ് ... വലതുകൈകൊണ്ട്
  rationale: പ്രവർത്തനം ചെയ്തത് യോവാബിന്റെ വലതുകൈയാണെന്ന മൂലപാഠത്തിലെ വിശദാംശം സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בִּזְקַן עֲמָשָׂא
  choice: അമാസയുടെ താടിയിൽ
  rationale: ബന്ധസൂചക ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഇവിടെ זָקָן മുഖത്തെ താടി എന്ന അർഥത്തിലാണ്.
- source_word: לִנְשָׁק לוֹ
  choice: അവനെ ചുംബിക്കാനായി
  rationale: ל ചേർന്ന ക്രിയാനാമരൂപം സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു.
