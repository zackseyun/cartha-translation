source:
  edition: WLC
  text: וְ/שָׁ֨ם נִקְרָ֜א אִ֣ישׁ בְּלִיַּ֗עַל וּ/שְׁמ֛/וֹ שֶׁ֥בַע בֶּן בִּכְרִ֖י אִ֣ישׁ יְמִינִ֑י וַ/יִּתְקַ֣ע בַּ/שֹּׁפָ֗ר וַ֠/יֹּאמֶר אֵֽין לָ֨/נוּ חֵ֜לֶק בְּ/דָוִ֗ד וְ/לֹ֤א נַֽחֲלָה לָ֨/נוּ֙ בְּ/בֶן יִשַׁ֔י אִ֥ישׁ לְ/אֹהָלָ֖י/ו יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: There happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
translation:
  language: ml
  text: 'അവിടെ നീചനായ ഒരു മനുഷ്യൻ[a] ഉണ്ടായിരുന്നു. അവന്റെ പേര് ബിക്രിയുടെ മകനായ ശേബ എന്നായിരുന്നു; അവൻ ഒരു ബെന്യാമീന്യനായിരുന്നു. അവൻ കാഹളം[b] ഊതി പറഞ്ഞു: “ദാവീദിൽ നമുക്കു പങ്കില്ല[c]; യിശ്ശായിയുടെ മകനിൽ നമുക്ക് അവകാശവുമില്ല. ഇസ്രായേലേ, ഓരോരുത്തനും അവനവന്റെ കൂടാരങ്ങളിലേക്ക്![d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദുഷ്ടനായ ഒരു മനുഷ്യൻ,’ ‘ഒരു തെമ്മാടി,’ എന്നിങ്ങനെയും പരിഭാഷപ്പെടുത്താം; കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ബെലിയാലിന്റെ മനുഷ്യൻ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം ശോഫാർ; പൊതുസൂചന നൽകാൻ ഉപയോഗിച്ചിരുന്ന ഒരു കൊമ്പുവാദ്യം. പരമ്പരാഗതമായി ഇത് ആട്ടുകൊമ്പാണെന്ന് മനസ്സിലാക്കപ്പെടുന്നു.
    reason: cultural_note
  - marker: c
    text: ‘ദാവീദിൽ നമുക്ക് ഓഹരിയില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഓരോരുത്തനും അവന്റെ കൂടാരങ്ങളിലേക്ക്.’ ഓരോരുത്തരും സ്വന്തം വീട്ടിലേക്കോ പാളയത്തിലേക്കോ മടങ്ങിപ്പോകണമെന്ന് ആവശ്യപ്പെടുന്ന വിതരണാർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרָא
  choice: ഉണ്ടായിരുന്നു
  rationale: שָׁם എന്നതിനോടൊപ്പമുള്ള ഈ നിഫാൽ പ്രയോഗം ഇവിടെ അസ്തിത്വം സൂചിപ്പിക്കുന്നു. പേരിടപ്പെട്ടു എന്ന അർഥം നൽകാതെ സ്വാഭാവികമായ മലയാളത്തിൽ കഥാപാത്രത്തെ പരിചയപ്പെടുത്തുന്നു.
- source_word: אִישׁ בְּלִיַּעַל
  choice: നീചനായ ഒരു മനുഷ്യൻ
  rationale: ഇവിടെ בְּלִיַּעַל വ്യക്തിനാമമല്ല; അധമത്വമോ ദുഷ്ടതയോ സൂചിപ്പിക്കുന്ന വിവരണമാണ്. ‘നീചനായ’ എന്നത് പിന്നീട് രൂപപ്പെട്ട പൈശാചിക അർഥങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ ധാർമ്മിക വിലയിരുത്തൽ വ്യക്തമാക്കുന്നു.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: ബിക്രിയുടെ മകനായ ശേബ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും പിതൃബന്ധം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אִישׁ יְמִינִי
  choice: ഒരു ബെന്യാമീന്യൻ
  rationale: ഈ പദസമുച്ചയം ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സാധാരണ ഗോത്രനാമരൂപം ഉപയോഗിച്ചു.
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: അവൻ കാഹളം ഊതി
  rationale: ശോഫാർ പൊതുസൂചനയ്ക്കായി ഊതുന്ന കൊമ്പുവാദ്യമാണ്. ‘കാഹളം’ കഥനത്തിൽ സ്വാഭാവികമായ പൊതുപദമാണ്; ഉപകരണത്തിന്റെ പ്രത്യേക സ്വഭാവം അടിക്കുറിപ്പിൽ പറയുന്നു.
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  choice: ദാവീദിൽ നമുക്കു പങ്കില്ല
  rationale: חֵלֶק എന്നത് പങ്ക് അഥവാ ഓഹരി എന്നാണ്. ദാവീദിന്റെ ഭരണത്തിൽ തങ്ങൾക്ക് പങ്കില്ലെന്ന രാഷ്ട്രീയ പ്രഖ്യാപനം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  choice: യിശ്ശായിയുടെ മകനിൽ നമുക്ക് അവകാശവുമില്ല
  rationale: נַחֲלָה-യുടെ അവകാശം, പാരമ്പര്യമായി ലഭിക്കുന്ന വിഹിതം എന്നീ അർഥങ്ങളുടെ പ്രതിധ്വനി ‘അവകാശം’ നിലനിർത്തുന്നു; രാഷ്ട്രീയ മുദ്രാവാക്യത്തിലും ഇത് സ്വാഭാവികമാണ്.
- source_word: בְּבֶן יִשַׁי
  choice: യിശ്ശായിയുടെ മകനിൽ
  rationale: രാജകീയ പദവി ഉപയോഗിക്കാതെ ദാവീദിനെ പിതൃവംശംകൊണ്ട് പരാമർശിക്കുന്ന അവജ്ഞാഭാവം നിലനിർത്തുന്നു.
- source_word: אִישׁ לְאֹהָלָיו
  choice: ഓരോരുത്തനും അവനവന്റെ കൂടാരങ്ങളിലേക്ക്
  rationale: ഏകവചനമായ אִישׁ-ഉം ബഹുവചനമായ ‘അവന്റെ കൂടാരങ്ങൾ’ എന്ന രൂപവും വിതരണാർഥമുള്ള പ്രയോഗമാണ്. മലയാളത്തിലെ ‘ഓരോരുത്തനും അവനവന്റെ’ ആ അർഥവും മുദ്രാവാക്യത്തിന്റെ ചുരുക്കവും നിലനിർത്തുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേലേ
  rationale: ഇത് വടക്കൻ ഗോത്രങ്ങളോടുള്ള നേരിട്ടുള്ള സംബോധനയായതിനാൽ മലയാളത്തിലെ സംബോധനാരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: בְּלִיַּעַל എന്നത് ‘ബെലിയാൽ’ എന്ന വ്യക്തിനാമമായോ വിവരണപദമായോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘നീചനായ’ എന്ന വിവരണപദം
  alternative: ‘ബെലിയാലിന്റെ മനുഷ്യൻ’ അഥവാ ‘ബെലിയാൽ എന്ന മനുഷ്യൻ’
  rationale: ഈ ചരിത്രകഥനത്തിൽ ഈ പദം ശേബയുടെ അധമത്വമോ നിയമരാഹിത്യമോ വിശേഷിപ്പിക്കുന്ന സാധാരണ പ്രയോഗമാണ്; വികസിതമായ പൈശാചിക നാമസങ്കല്പം ഇവിടെ നിർബന്ധിതമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി ഉപയോഗിച്ചു. കലാപാഹ്വാനത്തിന്റെ ചുരുക്കവും താളവും നിലനിർത്താൻ അവസാനവാക്യത്തിൽ ഉറവിടത്തിലുള്ളതുപോലെ വ്യക്തമായ ക്രിയ ചേർത്തിട്ടില്ല. ‘അപ്പോൾ/ഇപ്പോൾ’ പോലുള്ള ഉറവിടത്തിൽ ഇല്ലാത്ത കാലസൂചകപദം ചേർത്തിട്ടില്ല.
