  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘ഇസ്രായേലേ, ഓരോരുത്തനും അവനവന്റെ കൂടാരങ്ങളിലേക്ക്!’ എന്ന ക്രിയാരഹിതമായ ആഹ്വാനം മലയാളത്തിലും ഉറവിടത്തിന്റെ ചുരുക്കമുള്ള മുദ്രാവാക്യശൈലിയിലും ഫലപ്രദമാണ്.
