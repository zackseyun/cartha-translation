  text: הֵ֗ם עִם הָ/אֶ֤בֶן הַ/גְּדוֹלָה֙ אֲשֶׁ֣ר בְּ/גִבְע֔וֹן וַ/עֲמָשָׂ֖א בָּ֣א לִ/פְנֵי/הֶ֑ם וְ/יוֹאָ֞ב חָג֣וּר מִדּ֣/וֹ לְבֻשׁ֗/וּ ו/על/ו חֲג֥וֹר חֶ֨רֶב֙ מְצֻמֶּ֤דֶת עַל מָתְנָי/ו֙ בְּ/תַעְרָ֔/הּ וְ/ה֥וּא יָצָ֖א וַ/תִּפֹּֽל־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
translation:
  language: ml
  text: അവർ ഗിബെയോനിലെ വലിയ കല്ലിനരികെ ആയിരുന്നപ്പോൾ, അമാസാ അവരുടെ മുമ്പിൽ വന്നു.[a] യോവാബ് തന്റെ സൈനികവസ്ത്രം ധരിച്ചിരുന്നു.[b] അതിനുമീതെ, അരയിൽ ഉറയോടുകൂടെ ഉറപ്പിച്ച വാളുള്ള ഒരു കച്ച ഉണ്ടായിരുന്നു. അവൻ പുറപ്പെട്ടപ്പോൾ,[c] വാൾ താഴെ വീണു.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അമാസാ അവരെ എതിരേറ്റു വന്നു.” ഹീബ്രുവിൽ അക്ഷരാർഥം “അവരുടെ മുമ്പിൽ വന്നു” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തന്റെ മേലങ്കി” അല്ലെങ്കിൽ “താൻ ധരിച്ചിരുന്ന വസ്ത്രം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം പ്രത്യേകിച്ച് സൈനികമോ ഔദ്യോഗികമോ ആയ വസ്ത്രത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അവൻ പുറത്തേക്കു വന്നപ്പോൾ” അല്ലെങ്കിൽ “അവൻ പുറപ്പെട്ടപ്പോൾ.” ഹീബ്രുവിലെ ചലനത്തിന്റെ കൃത്യമായ ദിശ സന്ദർഭത്തിൽ പൂർണമായി വ്യക്തമല്ല.
    reason: lexical_alternative
  - marker: d
    text: ഹീബ്രുവിലെ “വീണു” എന്ന ക്രിയ സ്ത്രീലിംഗത്തിലാണ്; അതിനാൽ അതിന്റെ കർത്താവ് വാൾ ആയിരിക്കാനാണ് കൂടുതൽ സാധ്യത. ഹീബ്രുപാഠത്തിൽ “വാൾ” ഇവിടെ വീണ്ടും തുറന്നുപറയുന്നില്ല.
    reason: referent_clarification
lexical_decisions:
- source_word: הֵם עִם הָאֶבֶן הַגְּדוֹלָה אֲשֶׁר בְּגִבְעוֹן
  choice: അവർ ഗിബെയോനിലെ വലിയ കല്ലിനരികെ ആയിരുന്നപ്പോൾ
  rationale: സ്ഥലസൂചനയിൽ עִם എന്നത് ‘അരികെ/സമീപത്ത്’ എന്ന അർഥത്തിൽ സ്വാഭാവികമായി വായിക്കാം. ഹീബ്രു വാക്യത്തിന്റെ നിലാവസ്ഥയും കഥയുടെ സമയബന്ധവും നിലനിർത്തുന്നു.
- source_word: וַעֲמָשָׂא בָּא לִפְנֵיהֶם
  choice: അമാസാ അവരുടെ മുമ്പിലേക്ക് വന്നു
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/മുമ്പിലേക്ക്’ എന്ന ദൃശ്യാർഥം നിലനിർത്തുകയും, ‘അവരെ കാണാൻ വന്നു’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: חָגוּר מִדּוֹ לְבֻשׁוֹ
  choice: യോവാബ് തന്റെ പടയങ്കി ധരിച്ചിരുന്നു
  rationale: מַד എന്ന പദത്തിന് ഔദ്യോഗികമോ സൈനികമോ ആയ പ്രത്യേക വസ്ത്രം എന്ന അർഥപരിധിയുണ്ട്; വാളും ആയുധക്കച്ചയും ഉൾപ്പെടുന്ന സന്ദർഭത്തിൽ ‘പടയങ്കി’ സ്വാഭാവികവും യോജിച്ചതുമാണ്.
- source_word: וְעָלָיו חֲגוֹר חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו בְּתַעְרָהּ
  choice: അതിനുമീതെ, ഉറയിലിട്ട വാൾ അരയിൽ ഉറപ്പിച്ചിരുന്ന ഒരു കച്ചയും ഉണ്ടായിരുന്നു
  rationale: വസ്ത്രത്തിനുമീതെയുള്ള കച്ച, അരയിൽ ഉറപ്പിച്ച വാൾ, അതിന്റെ ഉറ എന്നിവയെ മലയാളത്തിൽ വ്യക്തമായ ഒരൊറ്റ വിവരണമായി നൽകുന്നു.
- source_word: וְהוּא יָצָא
  choice: അവൻ മുന്നോട്ടു വന്നപ്പോൾ
  rationale: יָצָא എന്നത് ‘പുറപ്പെട്ടു/പുറത്തേക്കു വന്നു/മുന്നോട്ടു വന്നു’ എന്ന ചലനത്തെ സൂചിപ്പിക്കുന്നു. ഈ ഏറ്റുമുട്ടൽസന്ദർഭത്തിൽ ‘മുന്നോട്ടു വന്നു’ സ്വാഭാവികമാണ്; കൃത്യമായ ദിശയിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַתִּפֹּל
  choice: വാൾ താഴെ വീണു
  rationale: സ്ത്രീലിംഗ ഏകവചന ക്രിയയായ תִּפֹּל ഏറ്റവും സ്വാഭാവികമായി സ്ത്രീലിംഗ നാമമായ חֶרֶב (‘വാൾ’) എന്നതിലേക്കാണ് മടങ്ങുന്നത്. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ നാമം തുറന്നുപറയുന്നു.
