translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പടയങ്കി’, ‘കച്ച’, ‘ഉറ’ എന്നീ പദങ്ങൾ പുരാതന സൈനികസന്ദർഭം സ്വാഭാവികമായി കൈമാറുന്നു; മൂലത്തിലെ ദിശാസംബന്ധവും സൂചനാപദസംബന്ധവും ആയ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
