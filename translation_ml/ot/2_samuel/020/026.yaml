source:
  edition: WLC
  text: וְ/גַ֗ם עִירָא֙ הַ/יָּ֣אִרִ֔י הָיָ֥ה כֹהֵ֖ן לְ/דָוִֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/026.yaml
  text: And Ira the Jairite also was priest to David[a].
translation:
  language: ml
  text: യായീര്യനായ ഈരാ ദാവീദിന്റെ പുരോഹിതനുമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മുഖ്യ ഉദ്യോഗസ്ഥൻ’ അല്ലെങ്കിൽ ‘രാജോപദേഷ്ടാവ്’; എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘പുരോഹിതൻ’ എന്നാണ്, എന്നാൽ ചില രാജകീയ സന്ദർഭങ്ങളിൽ അത് രാജസഭയിലെ ഒരു ഉന്നത ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: -യും
  rationale: മുൻപുള്ള ഉദ്യോഗസ്ഥപ്പട്ടികയോടുള്ള തുടർച്ചയും ‘കൂടാതെ/also’ എന്ന സങ്കലനഭാവവും മലയാളത്തിലെ സ്വാഭാവികമായ ‘-യും’ സംയോജകപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: עִירָא
  choice: ഈര
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ഉറവിട ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: הַיָּאִרִי
  choice: യായീര്യനായ
  rationale: ഈ ജാതി/വംശസൂചക വിശേഷണം ‘യായീര്യനായ’ എന്നു സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകി; ‘യായീരിന്റെ സന്തതിയിൽപ്പെട്ട’ എന്ന വിപുലീകരണം മൂലത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: הָיָה
  choice: ആയിരുന്നു
  rationale: ഉദ്യോഗസ്ഥരുടെ പട്ടികയിൽ היה സാധാരണ ഭൂതകാല ബന്ധകക്രിയയാണ്; ‘ആയിത്തീർന്നു’ എന്ന ആരംഭഭാവം ഇവിടെ അനാവശ്യമാണ്.
- source_word: כֹהֵן
  choice: പുരോഹിതൻ
  rationale: പദത്തിന്റെ പ്രാഥമിക അർഥം ‘പുരോഹിതൻ’ ആയതിനാൽ അതു മുഖ്യപാഠത്തിൽ നിലനിർത്തി; രാജസഭാസന്ദർഭത്തിലെ ‘മുഖ്യ ഉദ്യോഗസ്ഥൻ/രാജോപദേഷ്ടാവ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: לְדָוִד
  choice: ദാവീദിന്റെ
  rationale: ഇവിടത്തെ לְ ദാവീദുമായുള്ള ഔദ്യോഗിക ബന്ധമോ സേവനമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ദാവീദിന്റെ പുരോഹിതൻ’ സ്വാഭാവികമാണ്; ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: രാജസഭാസന്ദർഭത്തിൽ כֹהֵן എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘പുരോഹിതൻ’ നിലനിർത്തി
  alternative: ‘മുഖ്യ ഉദ്യോഗസ്ഥൻ’ അല്ലെങ്കിൽ ‘രാജോപദേഷ്ടാവ്’
  rationale: ചില രാജകീയ സന്ദർഭങ്ങളിൽ ഈ പദം ഉന്നത രാജസഭാ ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കാമെങ്കിലും അതിന്റെ നേരിട്ടുള്ള സാധാരണ അർഥം ‘പുരോഹിതൻ’ എന്നാണ്. യഥാർഥമായ അർഥസന്ദിഗ്ധത പരിഹരിച്ചുകളയാതെ, ഭരണപരമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭരണപ്പട്ടികാശൈലി. മൂലത്തിലെ ചുരുക്കം നിലനിർത്തുകയും വിവാദമായ ഔദ്യോഗിക പദവിയുടെ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുകയും ചെയ്തു.
