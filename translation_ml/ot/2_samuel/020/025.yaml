  text: ו/שיא סֹפֵ֑ר וְ/צָד֥וֹק וְ/אֶבְיָתָ֖ר כֹּהֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/025.yaml
  text: and Sheva was secretary[a], and Zadok and Abiathar were priests.
translation:
  language: ml
  text: ശേവാ രാജകാര്യലേഖകനായിരുന്നു[a]; സാദോക്കും അബ്യാഥാരും പുരോഹിതന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ലേഖകൻ.’ എബ്രായപദം രാജകീയ ലേഖകനെയോ കാര്യദർശിയെയോ സൂചിപ്പിക്കാം; ഭരണപരമായ പദവി വ്യക്തമാക്കാൻ ‘രാജകാര്യലേഖകൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שיא
  choice: ശേവാ
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് വ്യഞ്ജനരൂപത്തെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്ന വ്യക്തിനാമലിപ്യന്തരണം; സമാന്തര പട്ടികകളിലെ വ്യത്യസ്ത നാമരൂപങ്ങൾ ഇവിടെ പാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: סֹפֵר
  choice: രാജകാര്യലേഖകൻ
  rationale: രാജഭരണത്തിലെ ഔദ്യോഗിക എഴുത്തുകാരൻ/കാര്യദർശി എന്ന പദവിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പൊതുവായ ‘എഴുത്തുകാരൻ’ എന്നതിനെക്കാൾ ഭരണപരമായ സന്ദർഭം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: צָדוֹק
  choice: സാദോക്ക്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֶבְיָתָר
  choice: അബ്യാഥാർ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: כֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: ആരാധനാശുശ്രൂഷയിലെ ഔദ്യോഗിക പുരോഹിതപദവിയെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: וְ
  choice: -ഉം / പിന്നെ
  rationale: പട്ടികയിലെ പേരുകളും പദവികളും ബന്ധിപ്പിക്കുന്ന ആവർത്തിത സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയപ്രത്യയത്തിലൂടെ പ്രകടിപ്പിക്കുന്നു.
