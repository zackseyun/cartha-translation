base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/023.yaml
  text: Joab was over all the army of Israel[a], and Benaiah son of Jehoiada was over the Cherethites and the Pelethites.
translation:
  language: ml
  text: യോവാബ് യിസ്രായേലിന്റെ മുഴുവൻ സൈന്യത്തിന്റെ മേൽ അധികാരിയായിരുന്നു; യെഹോയാദയുടെ മകനായ ബെനായാവ് കാരിയരുടെയും[a] പെലേത്യരുടെയും മേൽ അധികാരിയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു വായന: ‘കെരേത്യർ.’ എബ്രായ വ്യഞ്ജനപാഠത്തിൽ ‘കാരിയർ’ എന്ന രൂപമാണുള്ളത്; പരമ്പരാഗത വായന ‘കെരേത്യർ’ എന്നാണ്.'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: യോവാബ്
  rationale: വാക്യം ഭരണചുമതലകളുടെ പട്ടിക തുടരുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാശൈലിക്കായി തുടക്കത്തിലെ וְ പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: אֶל כָּל הַ/צָּבָא יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ മുഴുവൻ സൈന്യത്തിന്റെയും മേൽ അധികാരിയായിരുന്നു
  rationale: ക്രിയയില്ലാത്ത ഈ ഭരണപദവി-വാക്യത്തിൽ אֶל അധികാരബന്ധം സൂചിപ്പിക്കുന്നതായി ഗ്രഹിച്ച് ആവശ്യമായ ബന്ധകക്രിയ ചേർത്തു. צָבָא ഇവിടെ സംഘടിത സൈന്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; כָּל ‘മുഴുവൻ’ എന്നു നിലനിർത്തി.
- source_word: וּ/בְנָיָה֙ בֶּן יְה֣וֹיָדָ֔ע
  choice: യെഹോയാദയുടെ മകനായ ബെനായാവ്
  rationale: പിതൃനാമബന്ധം സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകി; വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരിച്ചു.
- source_word: עַל ה/כרי
  choice: കാരിയരുടെയും മേൽ അധികാരിയായിരുന്നു
  rationale: ലഭ്യമായ വ്യഞ്ജനപാഠമായ כרי നേരിട്ട് പ്രതിഫലിപ്പിക്കാൻ ‘കാരിയർ’ എന്നു ലിപ്യന്തരിച്ചു. പരമ്പരാഗത ‘കെരേത്യർ’ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וְ/עַל הַ/פְּלֵתִי
  choice: പെലേത്യരുടെയും മേൽ അധികാരിയായിരുന്നു
  rationale: עַל അധികാരമോ മേൽനോട്ടമോ സൂചിപ്പിക്കുന്നു. ഏകവചനരൂപത്തിലുള്ള സമൂഹനാമം മലയാളത്തിൽ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനമായി നൽകി; മുൻപത്തെ പദസമൂഹത്തോടൊപ്പം ഒരേ അധികാരപ്രയോഗത്തിൽ ചേർത്തു.
