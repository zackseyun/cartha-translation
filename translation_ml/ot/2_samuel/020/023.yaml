translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ ഭരണപട്ടികാശൈലി സ്വീകരിച്ചു. ‘അധിപൻ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘മേൽ അധികാരിയായിരുന്നു’ എന്ന പ്രയോഗം ഉപയോഗിച്ചു. പാഠരൂപത്തിലെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും തുറന്നുവെച്ചു.
