translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജകീയ ആജ്ഞയുടെ ഔപചാരികത നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
