source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל עֲמָשָׂ֔א הַזְעֶק לִ֥/י אֶת אִישׁ יְהוּדָ֖ה שְׁלֹ֣שֶׁת יָמִ֑ים וְ/אַתָּ֖ה פֹּ֥ה עֲמֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/004.yaml
  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് അമാസായോടു പറഞ്ഞു: “മൂന്നു ദിവസത്തിനകം യെഹൂദയിലെ പുരുഷന്മാരെ[a] എനിക്കുവേണ്ടി വിളിച്ചുകൂട്ടുക; നീ ഇവിടെത്തന്നെ നിൽക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെഹൂദയിലെ പുരുഷന്മാർ’ എന്ന എബ്രായപ്രയോഗം പുരുഷലിംഗത്തിലുള്ള ഒരു സമൂഹവാചകമാണ്. സന്ദർഭത്തിൽ ഇത് യുദ്ധത്തിനായി വിളിച്ചുകൂട്ടാവുന്ന പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നതാകാം; എന്നാൽ മൂലവാചകം അവരെ ‘യോദ്ധാക്കൾ’ എന്ന് വ്യക്തമായി വിളിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടന ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ പ്രകടമാക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ ദാവീദിനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമം; വ്യക്തിനാമം പകരം ചേർക്കാതെ മൂലരൂപം നിലനിർത്തുന്നു.
- source_word: הַזְעֶק
  choice: വിളിച്ചുകൂട്ടുക
  rationale: זעק എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം ഇവിടെ ആളുകളെ പൊതുവായി വിളിച്ച് ഒരുമിച്ചുകൂട്ടുക എന്ന അർഥത്തിലാണ്.
- source_word: לִי
  choice: എനിക്കുവേണ്ടി
  rationale: രാജാവിന്റെ ആവശ്യത്തിനും അധികാരത്തിനും വേണ്ടി ചെയ്യേണ്ട പ്രവൃത്തിയെന്ന ദാതൃബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: യെഹൂദയിലെ പുരുഷന്മാരെ
  rationale: אִישׁ ഏകവചനരൂപത്തിലാണെങ്കിലും പ്രയോഗം പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന സമൂഹവാചകമാണ്. സൈനികസന്ദർഭം സാധ്യതയുള്ളതെങ്കിലും ‘യോദ്ധാക്കൾ’ എന്നു ചേർത്ത് മൂലത്തെക്കാൾ കൃത്യമാക്കുന്നില്ല.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസത്തിനകം
  rationale: ആജ്ഞാസന്ദർഭത്തിൽ ഇത് പ്രവൃത്തി പൂർത്തിയാക്കേണ്ട സമയപരിധിയാണ്; ദൈർഘ്യമല്ല.
- source_word: וְאַתָּה
  choice: നീയും
  rationale: പ്രകടമായ സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ശക്തമായ വിരോധഭാവം ചേർക്കുന്നില്ല.
- source_word: פֹּה
  choice: ഇവിടെത്തന്നെ
  rationale: സ്ഥലസൂചനയായ ‘ഇവിടെ’യെ സ്വാഭാവികമായി നൽകുകയും നിർദേശത്തിലെ ഊന്നൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: עֲמֹד
  choice: ഉണ്ടായിരിക്കണം
  rationale: പദശഃ ‘നിൽക്കുക’ എന്നാണെങ്കിലും ഇവിടെ രാജാവിന്റെ സന്നിധിയിൽ തുടരുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
