    text: അഥവാ ‘നിർബന്ധിത തൊഴിൽസേവനം’ അല്ലെങ്കിൽ ‘വേലച്ചുമതി’; എബ്രായപദം സാധാരണ നികുതിയെയല്ല, ഭരണകൂടം നിർബന്ധമായി ചുമത്തിയ തൊഴിൽസേവനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹרָם
  choice: അദോരാം
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി എഴുതിയിരിക്കുന്നു.
- source_word: עַל
  choice: മേൽനോട്ടക്കാരനായിരുന്നു
  rationale: രാജകീയ ഭരണസന്ദർഭത്തിൽ ഈ പദം ഒരു വകുപ്പിനെയോ ചുമതലയെയോ നിയന്ത്രിക്കുന്ന അധികാരത്തെ സൂചിപ്പിക്കുന്നു; ക്രിയയില്ലാത്ത എബ്രായ വാക്യത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמַּס
  choice: നിർബന്ധിതവേല
  rationale: ഇവിടെ പണമായ നികുതിയെയല്ല, ഭരണകൂടം നിർബന്ധമായി ചുമത്തിയ തൊഴിൽസേവനത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: יְהוֹשָׁפָט
