  text: അദോരാം നിർബന്ധിത വേലയുടെ മേൽനോട്ടക്കാരനായിരുന്നു[a]; അഹീലൂദിന്റെ മകനായ യെഹോശാഫാത്ത് രേഖാപാലകനായിരുന്നു.
  philosophy: optimal-equivalence
