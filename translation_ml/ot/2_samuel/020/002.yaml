source:
  edition: WLC
  text: וַ/יַּ֜עַל כָּל אִ֤ישׁ יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י דָוִ֔ד אַחֲרֵ֖י שֶׁ֣בַע בֶּן בִּכְרִ֑י וְ/אִ֤ישׁ יְהוּדָה֙ דָּבְק֣וּ בְ/מַלְכָּ֔/ם מִן הַ/יַּרְדֵּ֖ן וְ/עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേലിലെ ഓരോ പുരുഷനും[a] ദാവീദിനെ അനുഗമിക്കുന്നത് വിട്ട് ബിക്രിയുടെ മകനായ ശേബയെ അനുഗമിക്കാൻ പോയി[b]. എന്നാൽ യെഹൂദയിലെ പുരുഷന്മാർ യോർദാൻ മുതൽ യെരൂശലേം വരെ തങ്ങളുടെ രാജാവിനോടു ചേർന്നുനിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേലിലെ പുരുഷന്മാരെല്ലാം.’ എബ്രായത്തിൽ അക്ഷരാർഥം, ‘ഇസ്രായേലിലെ ഓരോ പുരുഷനും’; ഇത് ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘കയറിപ്പോയി.’ ഇവിടെ ദാവീദിനെ വിട്ട് ശേബയുടെ പിന്നാലെ പോകുന്നതിലൂടെ കൂറുമാറുന്നതിനെ ഈ വാക്കുകൾ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: പോയി
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കയറിപ്പോകുക’ എന്നാണെങ്കിലും, ഇവിടെ ദാവീദിനെ വിട്ട് ശേബയെ പിന്തുടരാൻ പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന ആഖ്യാനപ്രയോഗമാണ്. ‘പോയി’ സ്വാഭാവികമായ മലയാളം നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ ഓരോ പുരുഷനും
  rationale: ‘ഇസ്രായേലിലെ ഓരോ പുരുഷനും’ എന്ന എബ്രായ ഏകവചന-സാമൂഹിക പ്രയോഗത്തിന്റെ വിതരണാർഥവും പുരുഷലിംഗസൂചനയും നിലനിർത്തുന്നു.
- source_word: מֵאַחֲרֵי דָוִד
  choice: ദാവീദിനെ അനുഗമിക്കുന്നത് വിട്ട്
  rationale: ദാവീദിന്റെ പിന്നാലെയുണ്ടായിരുന്നതും അവനോടുള്ള കൂറും ഉപേക്ഷിക്കുന്ന ആശയം അതിവ്യാഖ്യാനമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  choice: ബിക്രിയുടെ മകനായ ശേബയെ അനുഗമിക്കാൻ
  rationale: ആവർത്തിച്ചിരിക്കുന്ന אַחֲרֵי, ദാവീദിൽനിന്ന് ശേബയിലേക്കുള്ള അനുഗമനത്തിന്റെയും കൂറിന്റെയും മാറ്റം സൂചിപ്പിക്കുന്നു.
- source_word: וְאִישׁ יְהוּדָה
  choice: എന്നാൽ യെഹൂദാപുരുഷന്മാർ
  rationale: രൂപത്തിൽ ഏകവചനമായിരുന്നാലും ഇത് സാമൂഹികപ്രയോഗമാണ്. മുൻവാക്യത്തോടുള്ള വ്യക്തമായ വൈരുധ്യം ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: דָּבְקוּ בְמַלְכָּם
  choice: തങ്ങളുടെ രാജാവിനോടു ചേർന്നുനിന്നു
  rationale: דבק എന്നതിലെ ‘ചേർന്നുനിൽക്കുക/മുറുകെപ്പിടിക്കുക’ എന്ന ദൃശ്യരൂപവും ഉറച്ച കൂറിന്റെ സൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלָם
  choice: യോർദാൻമുതൽ യെരൂശലേംവരെ
  rationale: യോർദാനിൽനിന്ന് യെരൂശലേംവരെയുള്ള യാത്രയുടെയോ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തിയുടെയോ ഉറവിടപ്രയോഗം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അനുഗമനം രാഷ്ട്രീയ കൂറായി വ്യാഖ്യാനിക്കണമോ
  choice: ‘അനുഗമിക്കുക’, ‘ചേർന്നുനിൽക്കുക’ എന്നീ ദൃശ്യപ്രയോഗങ്ങൾ നിലനിർത്തി
  alternative: ‘കൂറുമാറി’, ‘വിശ്വസ്തരായി തുടർന്നു’ എന്ന് തുറന്നുപറയുക
  rationale: സന്ദർഭത്തിൽ രാഷ്ട്രീയ കൂറിന്റെ ആശയം ശക്തമാണെങ്കിലും, ഉറവിടത്തിലെ ശാരീരിക ചലനവും ബന്ധത്തിന്റെ രൂപകവും ഇല്ലാതാക്കാതിരിക്കാൻ കൂടുതൽ ഔപചാരികമായ പദങ്ങൾ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പരമ്പരാഗത ബൈബിൾ സ്ഥാന-വ്യക്തിനാമരൂപങ്ങൾ ഉപയോഗിച്ചു; അതേസമയം അനാവശ്യമായ പഴഞ്ചൊല്ലുകളും അത്യന്തം സംസ്കൃതഭാരമുള്ള വാക്യഘടനയും ഒഴിവാക്കി.
