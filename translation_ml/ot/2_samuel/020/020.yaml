source:
  edition: WLC
  text: וַ/יַּ֥עַן יוֹאָ֖ב וַ/יֹּאמַ֑ר חָלִ֤ילָ/ה חָלִ֨ילָ/ה֙ לִ֔/י אִם אֲבַלַּ֖ע וְ/אִם אַשְׁחִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/020.yaml
  text: Joab answered and said[a], “Far be it from me, far be it, if I should swallow up or destroy!”
translation:
  language: ml
  text: 'യോവാബ് മറുപടി പറഞ്ഞു: “ഒരിക്കലും അരുതേ, അരുതേ! ഞാൻ വിഴുങ്ങിക്കളയുകയോ നശിപ്പിക്കുകയോ ചെയ്യില്ല!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן יוֹאָב וַיֹּאמַר
  choice: യോവാബ് മറുപടി പറഞ്ഞു
  rationale: രണ്ടു ഹീബ്രായ ആഖ്യാനക്രിയകളുടെയും സംയുക്ത അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; സംഭാഷണത്തിലെ മറുപടി എന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: חָלִילָה חָלִילָה לִי
  choice: അരുതേ, എനിക്ക് അരുതേ
  rationale: ശക്തമായ നിരാകരണം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ ആവർത്തനം നിലനിർത്തുന്നു. ‘എനിക്ക്’ എന്നത് לִיയെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אִם
  choice: ചെയ്യുമെന്നത് എനിക്കുണ്ടാകരുത്
  rationale: חָלִילָהയ്ക്ക് ശേഷമുള്ള אִם അക്ഷരാർഥത്തിൽ വ്യവസ്ഥാസൂചകമായിരിക്കാമെങ്കിലും, ഇവിടെ താൻ ആ പ്രവൃത്തി ചെയ്യുമെന്ന സാധ്യതയെ ശക്തമായി തള്ളുന്നു; മലയാളത്തിൽ നിരാകരണത്തിന്റെ ബന്ധം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: אֲבַלֵּעַ
  choice: ഞാൻ വിഴുങ്ങിക്കളയുക
  rationale: בלע എന്ന ക്രിയയുടെ ‘വിഴുങ്ങുക’ എന്ന സജീവ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഒരു നഗരത്തെ മുഴുവനായി ഇല്ലാതാക്കുക എന്ന രൂപകാലങ്കാരപരമായ അർഥവും വഹിക്കുന്നു.
- source_word: וְאִם אַשְׁחִית
  choice: അല്ലെങ്കിൽ നശിപ്പിക്കുക
  rationale: രണ്ടാമത്തെ നിരസിക്കപ്പെട്ട പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ ആദ്യത്തേതിനോട് ചേർക്കുന്നു; שׁחת എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘നശിപ്പിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു.
