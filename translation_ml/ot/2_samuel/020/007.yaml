id: 2SA.20.7
reference: 2 Samuel 20:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצְא֤וּ אַֽחֲרָי/ו֙ אַנְשֵׁ֣י יוֹאָ֔ב וְ/הַ/כְּרֵתִ֥י וְ/הַ/פְּלֵתִ֖י וְ/כָל הַ/גִּבֹּרִ֑ים וַ/יֵּֽצְאוּ֙ מִ/יר֣וּשָׁלִַ֔ם לִ/רְדֹּ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן בִּכְרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/007.yaml
  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
translation:
  language: ml
  text: യോവാബിന്റെ ആളുകളും കെരേത്യരും[a] പെലേത്യരും എല്ലാ വീരന്മാരും അവന്റെ പിന്നാലെ പുറപ്പെട്ടു. ബിക്രിയുടെ മകനായ ശേബയെ പിന്തുടരാൻ അവർ യെരൂശലേമിൽനിന്നു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില വിവർത്തനങ്ങളിൽ ഈ സംഘനാമം ‘ക്രേത്യർ’ അഥവാ ‘കെരീത്ത്യർ’ എന്നിങ്ങനെയും ലിപ്യന്തരണം ചെയ്തിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ ... אַחֲרָיו
  choice: അവന്റെ പിന്നാലെ പുറപ്പെട്ടു
  rationale: ‘പിന്നാലെ പുറപ്പെടുക’ എന്ന പ്രയോഗം എബ്രായത്തിലെ ചലനവും ക്രമവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘അവൻ’ ആരെന്നത് സന്ദർഭത്തിൽ ഉള്ളതുപോലെ വ്യാഖ്യാനിച്ച് നിർണ്ണയിക്കാതെ വിടുന്നു.
- source_word: אַנְשֵׁי יוֹאָב
  choice: യോവാബിന്റെ ആളുകൾ
  rationale: യോവാബിന്റെ കീഴിലുള്ള ആളുകളെ സൂചിപ്പിക്കുന്ന ബന്ധനപദസമുച്ചയത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: הַכְּרֵתִי
  choice: കെരേത്യർ
  rationale: ദാവീദിന്റെ രാജകീയ സൈന്യവുമായി ബന്ധപ്പെട്ട ഒരു ജനവിഭാഗത്തിന്റെയോ സൈനികസംഘത്തിന്റെയോ പേരായി കണ്ട്, ഊഹാധിഷ്ഠിതമായ അർഥവിവർത്തനത്തിനു പകരം എബ്രായ ഉച്ചാരണത്തോടു ചേർന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: הַפְּלֵתִי
  choice: പെലേത്യർ
  rationale: കെരേത്യരോടൊപ്പം പതിവായി പരാമർശിക്കപ്പെടുന്ന സംഘനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: כָל הַגִּבֹּרִים
  choice: എല്ലാ വീരന്മാർ
  rationale: ഇവിടെ പദത്തിന് യുദ്ധവീരന്മാർ എന്ന സൈനികസൂചനയുണ്ട്; ‘വീരന്മാർ’ അത് ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: מִירוּשָׁלִַם
  choice: യെരൂശലേമിൽനിന്ന്
  rationale: പുറപ്പെട്ട സ്ഥലം നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: പിന്തുടരാൻ
  rationale: പിടിക്കുകയോ നേരിടുകയോ ചെയ്യാനുള്ള ഉദ്ദേശ്യത്തോടെ പിന്നാലെ ചെല്ലുക എന്ന എബ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളസമം.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: ബിക്രിയുടെ മകനായ ശേബ
  rationale: എബ്രായ പിതൃനാമഘടന വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ആദ്യവാക്യത്തിലെ ‘അവന്റെ’ എന്ന സർവനാമത്തിന്റെ സന്ദർഭാധിഷ്ഠിതമായ അനിശ്ചിതത്വം മൂലപാഠംപോലെ നിലനിർത്തി; പട്ടികയിലെ സമന്വയഘടന നേരിട്ട് പുനരാവിഷ്കരിച്ചു.
