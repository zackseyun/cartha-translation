  text: അങ്ങനെ അമാസാ യെഹൂദയിലെ ജനങ്ങളെ വിളിച്ചുകൂട്ടാൻ[a] പോയി. എന്നാൽ ദാവീദ് അവന് നിശ്ചയിച്ച സമയത്തിനപ്പുറം അമാസാ വൈകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യെഹൂദക്കാരെ അണിനിരത്താൻ.” എബ്രായ ക്രിയ അടിയന്തരമായി ആളുകളെ വിളിച്ചുകൂട്ടുന്നതിനെ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ സൈനികസമാഹരണവും ഉൾപ്പെട്ടിരിക്കാം.
