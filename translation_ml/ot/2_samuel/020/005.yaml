lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; അമാസായുടെ പ്രവൃത്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְהַזְעִיק
  choice: വിളിച്ചുകൂട്ടാൻ
  rationale: זעק എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ആളുകളെ അടിയന്തരമായി ഒന്നിച്ചുകൂട്ടുക എന്നർഥം നൽകുന്നു. സൈനികസന്ദർഭം അമിതമായി വ്യക്തമാക്കാതെ ആ അർഥം നിലനിർത്തുന്നു.
- source_word: אֶת יְהוּדָה
  choice: യെഹൂദയെ
  rationale: എബ്രായത്തിൽ യെഹൂദാ സമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ യെഹൂദയിലെ ജനങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാണ്.
- source_word: וייחר
  choice: അവൻ വൈകി
  rationale: ഇവിടെ אחר എന്ന മൂലത്തിന് നിശ്ചിത സമയത്തെ മറികടന്ന് വൈകുക എന്ന അർഥമാണ്.
- source_word: מִן הַמּוֹעֵד
  choice: നിശ്ചയിച്ചുകൊടുത്ത സമയത്തിനപ്പുറം
  rationale: מוֹעֵד നിശ്ചിത സമയത്തെ സൂചിപ്പിക്കുന്നു; מן ചേർന്ന പ്രയോഗം ആ സമയപരിധി കടന്നുവെന്ന ആശയം നൽകുന്നു.
- source_word: אֲשֶׁר יְעָדוֹ
  choice: ദാവീദ് തനിക്കു നിശ്ചയിച്ചുകൊടുത്ത
  rationale: יעד ഒരു സമയം നിശ്ചയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ കർത്താവ് ദാവീദ് ആയതിനാൽ പേര് വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ അവ്യക്തമായ സർവനാമപരാമർശം ഒഴിവാക്കുന്നു; 'തനിക്കു' അമാസായെയാണ് സൂചിപ്പിക്കുന്നത്.
