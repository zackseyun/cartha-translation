  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
translation:
  language: ml
  text: അവനെ പെരുവഴിയിൽനിന്ന് നീക്കിയപ്പോൾ[a], ബിക്രിയുടെ മകനായ ശേബായെ പിന്തുടരാൻ എല്ലാ പുരുഷന്മാരും യോവാബിന്റെ പിന്നാലെ മുന്നോട്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വഴിയിൽനിന്ന്’ / ‘പാതയിൽനിന്ന്.’ എബ്രായത്തിലെ מְסִלָּה എന്ന പദം പെരുവഴിയെയോ പ്രധാന പാതയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: നീക്കിയ ഉടനെ
  rationale: ഇത് ഒരു കാലസൂചക ഉപവാക്യം ആരംഭിക്കുന്നു. തടസ്സം നീങ്ങിയതിനെത്തുടർന്ന് സൈന്യം ഉടൻ മുന്നേറിയെന്ന ആഖ്യാനക്രമം ‘ഉടനെ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הֹגָה
  choice: അവനെ ... നീക്കിയ
  rationale: ഹോഫാൽ രൂപം മറ്റൊരാൾ അവനെ മാറ്റിയെന്ന നിഷ്ക്രിയ അർഥം നൽകുന്നു. മുൻവാക്യത്തിലെ അമാസയുടെ ശരീരത്തെയാണ് ‘അവനെ’ സൂചിപ്പിക്കുന്നത്; മൂലപാഠം ഇവിടെ ‘ശരീരം’ എന്ന് ആവർത്തിക്കാത്തതിനാൽ പരിഭാഷയിലും അത് ചേർത്തിട്ടില്ല.
- source_word: מִן הַמְסִלָּה
  choice: പെരുവഴിയിൽനിന്ന്
  rationale: מְסִלָּה ഉയർത്തിപ്പണിത വഴിയെയോ പ്രധാന പാതയെയോ സൂചിപ്പിക്കാം. ആധുനിക മലയാളത്തിൽ ‘പെരുവഴി’ ഈ സവിശേഷ അർഥവും സൈന്യം സഞ്ചരിച്ച പ്രധാന വഴിയെന്ന സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: עָבַר
  choice: മുന്നോട്ടുപോയി
  rationale: വഴിയിലെ തടസ്സം നീങ്ങിയശേഷം സൈന്യം യാത്ര തുടർന്നതാണിവിടെ ഉദ്ദേശ്യം. ‘കടന്നുപോയി’ എന്നത് ശരീരത്തെ വെറുതെ മറികടന്നെന്ന ധാരണ നൽകാനിടയുള്ളതിനാൽ ‘മുന്നോട്ടുപോയി’ തിരഞ്ഞെടുത്തു.
- source_word: כָּל אִישׁ
  choice: എല്ലാ പുരുഷന്മാരും
  rationale: എബ്രായത്തിലെ ഏകവചന-സമാഹാര പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഓരോ പുരുഷനും’ എന്നാണ്; യോവാബിനെ അനുഗമിച്ച പോരാളികളെയാണ് സൂചിപ്പിക്കുന്നത്. സ്വാഭാവിക മലയാളത്തിനായി ബഹുവചനരൂപം ഉപയോഗിച്ചു.
- source_word: אַחֲרֵי יוֹאָב
  choice: യോവാബിന്റെ പിന്നാലെ
  rationale: യോവാബിനെ അനുഗമിച്ചുള്ള മുന്നേറ്റത്തെ ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നു. ‘പിന്നാലെ’ ദിശയും അനുഗമനവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לִרְדֹּף
  choice: പിന്തുടരാൻ
  rationale: ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്ന അനന്തക്രിയയാണ്. സൈനിക പിന്തുടരലിന്റെ ഗൗരവം സ്വാഭാവിക മലയാളത്തിൽ ‘പിന്തുടരാൻ’ നൽകുന്നു.
- source_word: אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  choice: ബിക്രിയുടെ മകനായ ശേബയെ
  rationale: എബ്രായ പിതൃനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു; വ്യക്തിനാമങ്ങളുടെ തിരിച്ചറിയൽ കൃത്യമായി നിലനിർത്തുന്നു.
