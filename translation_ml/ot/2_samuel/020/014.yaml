  text: וַֽ/יַּעֲבֹ֞ר בְּ/כָל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל אָבֵ֛לָ/ה וּ/בֵ֥ית מַעֲכָ֖ה וְ/כָל הַ/בֵּרִ֑ים ו/יקלהו וַ/יָּבֹ֖אוּ אַף אַחֲרָֽי/ו־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/014.yaml
  text: He passed through all the tribes of Israel to Abel and Beth-maacah[b][a], and all the Berites assembled and also followed after him.
translation:
  language: ml
  text: അവൻ ഇസ്രായേലിലെ എല്ലാ ഗോത്രപ്രദേശങ്ങളിലൂടെയും കടന്ന് ആബേലിലേക്കും ബേത്ത്-മയഖായിലേക്കും ചെന്നു. ബേര്യർ എല്ലാവരും[a] ഒന്നിച്ചുകൂടി, അവരും അവനെ അനുഗമിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘ബേര്യർ എല്ലാവരും.’ സന്ദർഭത്തിലെ ബിക്രിയുടെ മകനായ ശേബയുമായി ഈ വാക്കിനെ ബന്ധപ്പെടുത്തി ചില പരിഭാഷകൾ ‘ബിക്ര്യർ എല്ലാവരും’ എന്നു വായിക്കുന്നു; എന്നാൽ മസോററ്റിക് പാഠം കൂടുതൽ നേരിട്ട് പിന്തുണയ്ക്കുന്നത് ‘ബേര്യർ’ എന്ന വായനയെയാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘അവരും അവന്റെ പിന്നാലെ വന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: കടന്ന് ... ചെന്നു
  rationale: עבר എന്ന ക്രിയ ഇവിടെ വിവിധ ഗോത്രപ്രദേശങ്ങളിലൂടെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കടന്ന് ... ചെന്നു’ എന്നത് ആ ചലനവും ദിശയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ എല്ലാ ഗോത്രപ്രദേശങ്ങളിലൂടെയും
  rationale: בְ ഇവിടെ ഗോത്രജനങ്ങൾക്കിടയിലൂടെ എന്നതിലുപരി അവരുടെ ഭൂപ്രദേശങ്ങളിലൂടെയുള്ള സഞ്ചാരമാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ‘ഗോത്രപ്രദേശങ്ങൾ’ ഈ ഭൂമിശാസ്ത്രപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: אָבֵלָה
  choice: ആബേലിലേക്ക്
  rationale: അവസാനത്തെ ദിശാസൂചകമായ ה ലക്ഷ്യത്തിലേക്കുള്ള ചലനം അടയാളപ്പെടുത്തുന്നു. സ്ഥലനാമം ‘ആബേൽ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וּבֵית מַעֲכָה
  choice: ബേത്ത്-മയഖയിലേക്ക്
  rationale: ഇത് ഇവിടെ ‘മയഖയുടെ ഭവനം’ എന്ന സാധാരണ നാമവാക്യമല്ല, സ്ഥലനാമമാണ്; അതിനാൽ ലിപ്യന്തരണം നിലനിർത്തി.
- source_word: וְכָל הַבֵּרִים
  choice: ബേര്യർ എല്ലാവരും
  rationale: മസോററ്റിക് പാഠം നേരിട്ട് സൂചിപ്പിക്കുന്ന ജനവിഭാഗനാമം ലിപ്യന്തരിച്ചു. സന്ദർഭത്തെ ആശ്രയിച്ച് ‘ബിക്ര്യർ’ എന്നു തിരുത്താതെ പാഠത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיִּקָּהֲלוּ
  choice: ഒന്നിച്ചുകൂടി
  rationale: קהל എന്ന ധാതുവിന്റെ ഇവിടെ ഉദ്ദേശിക്കുന്ന സ്വയം കൂടിവരുക/സംഘടിക്കുക എന്ന അർഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיָּבֹאוּ אַף אַחֲרָיו
  choice: അവനെ അനുഗമിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരും അവന്റെ പിന്നാലെ വന്നു’ എന്നാകാമെങ്കിലും, സന്ദർഭത്തിൽ അവന്റെ നീക്കത്തിൽ ചേരുന്നതാണ് ഉദ്ദേശ്യം. ‘അനുഗമിച്ചു’ ആ പ്രയോഗാർഥം സംക്ഷിപ്തമായി നൽകുന്നു; ‘എല്ലാവരും’ എന്ന ഘടനയോടൊപ്പം കൂട്ടിച്ചേരലിന്റെ ആശയവും നിലനിൽക്കുന്നു.
