translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങളും അനിശ്ചിതമായ ജനവിഭാഗനാമവും മൂലപാഠത്തോട് ചേർന്ന ലിപ്യന്തരണത്തിൽ നിലനിർത്തി; എബ്രായപ്രയോഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
