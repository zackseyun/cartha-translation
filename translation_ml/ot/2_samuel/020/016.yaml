  text: וַ/תִּקְרָ֛א אִשָּׁ֥ה חֲכָמָ֖ה מִן הָ/עִ֑יר שִׁמְע֤וּ שִׁמְעוּ֙ אִמְרוּ נָ֣א אֶל יוֹאָ֔ב קְרַ֣ב עַד הֵ֔נָּה וַ/אֲדַבְּרָ֖ה אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/016.yaml
  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: ml
  text: 'അപ്പോൾ നഗരത്തിൽനിന്ന് ജ്ഞാനിയായ ഒരു സ്ത്രീ വിളിച്ചുപറഞ്ഞു: “കേൾക്കൂ! കേൾക്കൂ! ദയവായി യോവാബിനോട്, ‘ഇങ്ങോട്ടു വരൂ; ഞാൻ നിന്നോടു സംസാരിക്കട്ടെ’ എന്നു പറയൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  choice: ജ്ഞാനിയായ ഒരു സ്ത്രീ
  rationale: ‘wise woman’ എന്ന പദസമുച്ചയത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം; അവളുടെ വിവേകവും പ്രായോഗികജ്ഞാനവും സൂചിപ്പിക്കുന്നു.
- source_word: שִׁמְעוּ שִׁמְעוּ
  choice: കേൾക്കൂ! കേൾക്കൂ!
  rationale: ആവർത്തനവും അടിയന്തരമായ ആഹ്വാനവും അതേപടി നിലനിർത്തുന്നു.
- source_word: אִמְרוּ נָא
  choice: ദയവായി ... പറയൂ
  rationale: נָא നൽകുന്ന വിനയപൂർവമായ അഭ്യർഥനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: קְרַב עַד הֵנָּה
  choice: ഇവിടെ അടുത്തുവരിക
  rationale: ‘ഇവിടംവരെ അടുത്തുവരുക’ എന്ന സ്ഥലസംബന്ധമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: ഞാൻ അങ്ങയോട് സംസാരിക്കേണ്ടതിന്
  rationale: സംസാരിക്കാനുള്ള ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും യോവാബിനോടുള്ള മാന്യമായ ഏകവചന അഭിസംബോധന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണം. സ്ത്രീയുടെ ആവർത്തിച്ചുള്ള വിളിയുടെ അടിയന്തരതയും യോവാബിനോടുള്ള മാന്യമായ അഭിസംബോധനയും സംരക്ഷിച്ചിട്ടുണ്ട്.
