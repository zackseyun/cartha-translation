  to: 'അപ്പോൾ നഗരത്തിൽനിന്ന് ജ്ഞാനിയായ ഒരു സ്ത്രീ വിളിച്ചുപറഞ്ഞു: “കേൾക്കൂ! കേൾക്കൂ! ദയവായി യോവാബിനോട്, ‘ഇങ്ങോട്ടു വരൂ; ഞാൻ നിന്നോടു സംസാരിക്കട്ടെ’ എന്നു പറയൂ.”'
