base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
translation:
  language: ml
  text: ദാവീദ് യെരൂശലേമിലെ തന്റെ വീട്ടിൽ എത്തിയപ്പോൾ, രാജാവ് താൻ വീട് കാക്കാൻ വിട്ടിരുന്ന പത്ത് വെപ്പാട്ടികളെയും കൂട്ടിക്കൊണ്ടുപോയി കാവലോടുകൂടിയ തടങ്കലിൽ പാർപ്പിച്ചു[a]. അവർക്കാവശ്യമായതെല്ലാം അവൻ നൽകിപ്പോന്നു; എന്നാൽ അവൻ അവരുടെ അടുക്കൽ ചെന്നില്ല[b]. അങ്ങനെ അവർ മരിക്കുന്ന ദിവസംവരെ അടച്ചിടപ്പെട്ടവരായി, ജീവിച്ചിരിക്കെ വിധവകളെപ്പോലെ കഴിഞ്ഞു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘കാവലിന്റെ വീട്’ അഥവാ ‘തടങ്കൽവീട്.’ കാവലിലുള്ള ഒറ്റപ്പെടുത്തലാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെ അടുക്കൽ ചെന്നില്ല’ എന്നത് അവരുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടില്ല എന്നർഥമുള്ള എബ്രായ മര്യാദാപ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘ജീവനോടെയുള്ള വിധവത്വം.’ ദാവീദ് ജീവനോടെയിരുന്നെങ്കിലും അവർ വിധവകളെപ്പോലെ ജീവിച്ചു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: തന്റെ വീട്ടിൽ
  rationale: בַּיִת എന്നതിന് വീട്, കൊട്ടാരം, ഭവനം/കുടുംബം എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ദാവീദിന്റെ യെരൂശലേമിലെ രാജവസതിയാണ് സന്ദർഭം; എങ്കിലും ‘വീട്’ എബ്രായ പദത്തിന്റെ ലാളിത്യവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: פִּלַגְשִׁים
  choice: വെപ്പാട്ടികൾ
  rationale: പുരാതന രാജകുടുംബത്തിൽ അംഗീകരിക്കപ്പെട്ടെങ്കിലും ഭാര്യമാരേക്കാൾ താഴ്ന്ന സാമൂഹിക-നിയമ പദവിയുണ്ടായിരുന്ന സ്ത്രീകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ആ പ്രത്യേക പദവി സംക്ഷിപ്തമായി അറിയിക്കുന്ന നിലവിലുള്ള മലയാളപദമാണ് ‘വെപ്പാട്ടികൾ’.
- source_word: הִנִּיחַ לִשְׁמֹר הַבַּיִת
  choice: വീട് കാക്കാൻ വിട്ടിരുന്ന
  rationale: שׁמר എന്ന ക്രിയയിലെ കാക്കുക, നോക്കിക്കൊള്ളുക എന്നീ ഭാവങ്ങൾ നിലനിർത്തുന്നു; സ്ത്രീകളെ രാജവസതിയുടെ ചുമതല ഏൽപ്പിച്ച് പിന്നിൽ വിട്ടിരുന്നുവെന്ന സന്ദർഭവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בֵּית מִשְׁמֶרֶת
  choice: കാവലോടുകൂടിയ തടങ്കൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘കാവലിന്റെ/കസ്റ്റഡിയുടെ വീട്.’ വെറും താമസസ്ഥലമോ സംരക്ഷണമോ അല്ല, കാവലിലുള്ള ഒറ്റപ്പെടുത്തലാണെന്ന ഇരട്ടഭാവം ഈ പ്രയോഗം നൽകുന്നു.
- source_word: וַיְכַלְכְּלֵם
  choice: അവർക്കാവശ്യമായതെല്ലാം അവൻ നൽകിപ്പോന്നു
  rationale: പോറ്റുക, പരിപാലിക്കുക, ആവശ്യങ്ങൾ നൽകുക എന്ന തുടർച്ചയായ ഭൗതിക പരിപാലനഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַאֲלֵיהֶם לֹא בָא
  choice: അവൻ അവരുടെ അടുക്കൽ ചെന്നില്ല
  rationale: എബ്രായത്തിലെ ശാരീരികബന്ധത്തെ സൂചിപ്പിക്കുന്ന മര്യാദാപ്രയോഗം അതേ പരോക്ഷതയോടെ നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: צְרֻרוֹת
  choice: അടച്ചിടപ്പെട്ടവരായി
  rationale: നിഷ്ക്രിയ കൃദന്തരൂപത്തിലെ ഫലാവസ്ഥയും തുടർച്ചയായ ബന്ധനവും നിലനിർത്തുന്നു.
- source_word: עַד יוֹם מֻתָן
  choice: അവർ മരിക്കുന്ന ദിവസംവരെ
  rationale: ‘അവരുടെ മരണദിവസംവരെ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אַלְמְנוּת חַיּוּת
  choice: ജീവിച്ചിരിക്കെ വിധവകളെപ്പോലെ
  rationale: അക്ഷരാർഥത്തിലുള്ള അസാധാരണമായ ‘ജീവനോടെയുള്ള വിധവത്വം’ എന്ന വിരോധാഭാസം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു; ദാവീദ് ജീവനോടെയിരിക്കുമ്പോഴും ദാമ്പത്യബന്ധമില്ലാതെ അവർ വിധവകളെപ്പോലെ കഴിഞ്ഞുവെന്ന ഭാവം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
theological_decisions:
- issue: ദാവീദ് വെപ്പാട്ടികളോടു ചെയ്തതിന്റെ ധാർമികവും സാമൂഹികവുമായ വിലയിരുത്തൽ
  choice: പ്രവൃത്തി ന്യായീകരിക്കാതെയും അധികമായി കുറ്റം ചുമത്താതെയും, തടങ്കൽ, പരിപാലനം, ലൈംഗികബന്ധത്തിന്റെ അവസാനിക്കൽ, വിധവസമാനമായ ജീവിതം എന്നിവ വിവരണാത്മകമായി അവതരിപ്പിച്ചു.
  alternative: ഇത് സംരക്ഷണം മാത്രമായിരുന്നുവെന്നു തോന്നിക്കുന്ന മൃദുവായ ഭാഷ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ മൂലപാഠത്തിൽ തുറന്നു പറയാത്ത ധാർമിക വിധി വിവർത്തനത്തിൽ ചേർക്കുക.
  rationale: എബ്രായ പാഠം സ്ത്രീകളുടെ നിയന്ത്രിതാവസ്ഥയും ദാവീദിന്റെ തുടർപരിപാലനവും ദാമ്പത്യവിരാമവും ഒരുമിച്ച് രേഖപ്പെടുത്തുന്നു. ആ സംഘർഷം പരിഹരിക്കാതെ അതിന്റെ കാഠിന്യം നിലനിർത്തുകയാണ് വിവർത്തനത്തിന്റെ ദൗത്യം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഗദ്യശൈലി. ‘വെപ്പാട്ടികൾ’ സാമൂഹിക-ചരിത്രപരമായ പ്രത്യേക പദവി അറിയിക്കാൻ ഉപയോഗിച്ചു. കാവൽ, തടങ്കൽ, തുടർച്ചയായ പരിപാലനം, ദാമ്പത്യവിരാമം എന്നിവ മൃദൂകരിക്കാതെ അവതരിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ വിശദീകരിക്കുന്ന വാക്യഭാഗങ്ങൾക്കരികിൽ വെച്ചു.
