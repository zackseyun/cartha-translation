  source_fidelity: 'The Malayalam accurately represents the Hebrew sequence and key senses: David returns to his Jerusalem residence, takes the ten concubines previously left to guard the house, places them in guarded confinement, provides for them, has no further sexual relations with them, and leaves them confined until death in a condition compared to widowhood. The euphemism in וַאֲלֵיהֶם לֹא בָא is appropriately retained in the main text and explained in a note.'
