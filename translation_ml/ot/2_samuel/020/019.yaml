id: 2SA.20.19
reference: 2 Samuel 20:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָנֹכִ֕י שְׁלֻמֵ֖י אֱמוּנֵ֣י יִשְׂרָאֵ֑ל אַתָּ֣ה מְבַקֵּ֗שׁ לְ/הָמִ֨ית עִ֤יר וְ/אֵם֙ בְּ/יִשְׂרָאֵ֔ל לָ֥/מָּה תְבַלַּ֖ע נַחֲלַ֥ת יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
translation:
  language: ml
  text: ഞാൻ ഇസ്രായേലിലെ സമാധാനപ്രിയരും വിശ്വസ്തരുമായവരിൽ ഒരാളാണ്. അങ്ങ് ഒരു പട്ടണത്തെയും[a] ഇസ്രായേലിലെ ഒരു മാതാവിനെയും നശിപ്പിക്കാൻ ശ്രമിക്കുകയാണ്. യഹോവയുടെ അവകാശസ്വത്തിനെ അങ്ങ് എന്തിന് വിഴുങ്ങിക്കളയുന്നു?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേലിലെ ഒരു മാതാവായ പട്ടണം’; ഇസ്രായേലിൽ പ്രമുഖസ്ഥാനമോ പരിപോഷകപങ്കോ ഉള്ള ഒരു പട്ടണം എന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֻמֵי
  choice: സമാധാനപ്രിയർ
  rationale: ബഹുവചനത്തിലെ ഈ നാമവിശേഷണരൂപം സമാധാനം ആഗ്രഹിക്കുകയും സമാധാനപരമായി നിലകൊള്ളുകയും ചെയ്യുന്ന ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; സംസാരിക്കുന്ന സ്ത്രീ ആ കൂട്ടത്തിൽ ഒരാളായി സ്വയം തിരിച്ചറിയുന്നു.
- source_word: אֱמוּנֵי
  choice: വിശ്വസ്തർ
  rationale: സ്ഥിരതയും ആശ്രയയോഗ്യതയും വിശ്വസ്തതയും സൂചിപ്പിക്കുന്ന പദമാണിത്; ഇവിടെ സാമൂഹികവും ഉടമ്പടിസംബന്ധവുമായ വിശ്വസ്തതയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: מְבַקֵּשׁ לְהָמִית
  choice: നശിപ്പിക്കാൻ ശ്രമിക്കുകയാണ്
  rationale: കൃദന്തരൂപവും ക്രിയാനാമവും ചേർന്ന് ഇപ്പോഴുള്ള സജീവ ഉദ്ദേശ്യം പ്രകടമാക്കുന്നു. വാക്യത്തിലെ കർമം ഒരു പട്ടണമായതിനാൽ ‘കൊല്ലുക’ എന്ന യാന്ത്രിക പരിഭാഷയെക്കാൾ ‘നശിപ്പിക്കുക’ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  choice: ഒരു പട്ടണത്തെയും ഇസ്രായേലിലെ ഒരു മാതാവിനെയും
  rationale: എബ്രായത്തിലെ ‘പട്ടണവും മാതാവും’ എന്ന രൂപകാത്മകവും വ്യാകരണപരമായി തുറന്നതുമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; പട്ടണം തന്നെയാണ് ‘മാതാവ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: תְבַלַּע
  choice: വിഴുങ്ങിക്കളയുന്നു
  rationale: ‘വിഴുങ്ങുക’ എന്ന മൂലരൂപകം നിലനിർത്തുന്നു; ഉപരോധസന്ദർഭത്തിൽ അത് പൂർണമായി നശിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ശക്തമായ ദൃശ്യഭാഷയാണ്.
- source_word: נַחֲלַת יְהוָה
  choice: യഹോവയുടെ അവകാശം
  rationale: נחלה എന്നത് അവകാശമായി ലഭിച്ച സ്വത്ത്/പൈതൃകം എന്ന ഉടമ്പടിപരമായ ആശയം വഹിക്കുന്നു; ഇവിടെ ഇസ്രായേൽ യഹോവയ്ക്കുള്ളതാണെന്ന അവകാശവാദം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തിന്റെ നാല് എബ്രായ വ്യഞ്ജനാക്ഷരങ്ങളെ മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: ‘ഇസ്രായേലിലെ ഒരു മാതാവ്’ എന്ന രൂപകത്തിന്റെ ബന്ധം
  choice: ‘പട്ടണം’ എന്നും ‘മാതാവ്’ എന്നും ഉള്ള രണ്ടുപദങ്ങളും മുഖ്യപാഠത്തിൽ നിലനിർത്തി അവയുടെ ബന്ധം തുറന്നുവയ്ക്കുന്നു.
  alternative: ‘ഇസ്രായേലിലെ മാതൃസ്ഥാനമുള്ള ഒരു പട്ടണം’ എന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഈ പ്രയോഗം പട്ടണത്തെ ഇസ്രായേലിലെ ഒരു ‘മാതാവ്’ എന്നു വിശേഷിപ്പിക്കുന്ന സമസ്ഥാനീയ ഘടനയായിരിക്കാം; എങ്കിലും എബ്രായത്തിന്റെ ഉപരിതലഘടന അതിനെ പൂർണമായി നിർബന്ധിക്കുന്നില്ല. അതിനാൽ രൂപകവും യഥാർഥമായ അവ്യക്തതയും മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷ ഉപയോഗിച്ചു. സൈനികനേതാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ മാന്യത നിലനിർത്താൻ ‘അങ്ങ്’ സ്വീകരിച്ചു; ‘വിഴുങ്ങിക്കളയുന്നു’ എന്ന ദൃശ്യരൂപകം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
