  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. അക്രമത്തിന്റെ ദൃശ്യത മറച്ചിട്ടില്ലെങ്കിലും അനാവശ്യമായി അസഭ്യമോ അതിനാടകീയമോ ആയ പദങ്ങൾ ഒഴിവാക്കി. ‘യോവാബ്’ എന്ന കർത്താവ് രണ്ടാം വാക്യത്തിൽ വ്യക്തമാക്കിയത് മലയാളത്തിലെ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാനാണ്.
