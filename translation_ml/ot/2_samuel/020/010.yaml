base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
translation:
  language: ml
  text: എന്നാൽ യോവാബിന്റെ കൈയിലുണ്ടായിരുന്ന വാളിനെക്കുറിച്ച് അമാസ ജാഗ്രത പാലിച്ചില്ല. യോവാബ് അതുകൊണ്ട് അവന്റെ വയറ്റിൽ പ്രഹരിച്ചു[a]; അവന്റെ കുടലുകൾ നിലത്തേക്കു ചിതറിവീണു. യോവാബ് വീണ്ടും അവനെ പ്രഹരിച്ചില്ല; അവൻ മരിച്ചു. പിന്നെ യോവാബും അവന്റെ സഹോദരനായ അബീശായിയും ബിക്രിയുടെ മകനായ ശേബയെ പിന്തുടർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അഞ്ചാം വാരിയെല്ലിൽ പ്രഹരിച്ചു.’ പഴയ വിവർത്തനങ്ങളിൽ ഹീബ്രു പ്രയോഗം ഇങ്ങനെ പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്; എന്നാൽ ഈ സന്ദർഭത്തിൽ ആ പദം പൊതുവായി വയറിനെയോ ഉദരഭാഗത്തെയോ സൂചിപ്പിക്കുന്നതിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמַר
  choice: ജാഗ്രത പാലിച്ചില്ല
  rationale: നിഫാൽ രൂപം ഇവിടെ മറ്റൊരാളാൽ സംരക്ഷിക്കപ്പെടുക എന്നതിലുപരി അപകടത്തെക്കുറിച്ച് ജാഗരൂകനായിരിക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: חֶרֶב
  choice: വാൾ
  rationale: ആഖ്യാനസന്ദർഭത്തിന് യോജിക്കുന്ന സാധാരണവും നേരിട്ടുള്ളതുമായ അർഥം.
- source_word: בְּיַד יוֹאָב
  choice: യോവാബിന്റെ കൈയിലുണ്ടായിരുന്ന
  rationale: യോവാബ് ആയുധം കൈയിൽ പിടിച്ചിരുന്നുവെന്ന സ്ഥലപരവും മൂർത്തവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיַּכֵּהוּ בָהּ
  choice: അതുകൊണ്ട് അവന്റെ വയറ്റിൽ കുത്തി
  rationale: נכה എന്ന ക്രിയ പൊതുവിൽ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്നാണ്; എന്നാൽ വാളും വയറ്റിലേറ്റ മാരകമുറിവും ഉള്ള ഈ സന്ദർഭത്തിൽ ‘കുത്തി’ എന്നത് മലയാളത്തിൽ പ്രവൃത്തിയെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: אֶל הַחֹמֶשׁ
  choice: വയറ്റിൽ
  rationale: ശമൂവേലിലെ ഈ യുദ്ധവിവരണങ്ങളിൽ חֹמֶשׁ വയർ അഥവാ ഉദരഭാഗത്തെ സൂചിപ്പിക്കുന്നതാണ് കൂടുതൽ സാധ്യത; ‘അഞ്ചാം വാരിയെല്ലിൽ’ എന്ന പരമ്പരാഗത വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചിട്ടില്ല.
- source_word: וַיִּשְׁפֹּךְ מֵעָיו אַרְצָה
  choice: അവന്റെ കുടലുകൾ നിലത്തേക്കു ചിതറിവീണു
  rationale: ആന്തരാവയവങ്ങൾ പുറത്തേക്കു വീഴുന്ന ദൃശ്യത്തിന്റെ തീവ്രത നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷ ഉപയോഗിക്കുന്നു.
- source_word: וְלֹא שָׁנָה לוֹ
  choice: രണ്ടാമതൊന്നു കുത്തേണ്ടിവന്നില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘അവനോട് ആവർത്തിച്ചില്ല’; സന്ദർഭത്തിൽ രണ്ടാമത്തെ പ്രഹരം ആവശ്യമുണ്ടായില്ല എന്ന സൂചന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: רָדַף אַחֲרֵי
  choice: പിന്തുടർന്നു
  rationale: സൈനിക പിന്തുടരലിനെ സൂചിപ്പിക്കുന്ന ലളിതവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: ബിക്രിയുടെ മകനായ ശേബ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗത്തിന് യോജിച്ച വിധത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും ഹീബ്രു വംശബന്ധം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകുകയും ചെയ്തു.
