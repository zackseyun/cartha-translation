  choice: കാര്യം അങ്ങനെയല്ല
  rationale: മുൻധാരണയെ നിഷേധിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי
  choice: തുടർന്നുള്ള വിശദീകരണത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: നിഷേധത്തിനു പിന്നാലെ തിരുത്തൽ വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിൽ വ്യക്തമാണ്; പ്രത്യേക ബന്ധപദം ചേർക്കുന്നത് അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: מֵהַר אֶפְרַיִם
  choice: എഫ്രയീം മലനാട്ടിൽനിന്നുള്ള
  rationale: ഒരു ഒറ്റ പർവതശിഖരത്തേക്കാൾ എഫ്രയീമിന്റെ മലമ്പ്രദേശത്തെയാണ് ഈ ഭൂമിശാസ്ത്രപ്രയോഗം സാധാരണ സൂചിപ്പിക്കുന്നത്.
- source_word: שֶׁבַע בֶּן בִּכְרִי שְׁמוֹ
  choice: ബിക്രിയുടെ മകൻ ശേബ എന്നു പേരുള്ള
  rationale: പേരും പിതൃനാമവും ഉൾപ്പെടുന്ന എബ്രായ നാമകരണസൂത്രം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָשָׂא יָדוֹ
  choice: കൈ ഉയർത്തിയിരിക്കുന്നു
  rationale: വിരോധമോ കലാപമോ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בַּמֶּלֶךְ בְּדָוִד
  choice: രാജാവിനെതിരെ—ദാവീദിനെതിരെ—
  rationale: ആവർത്തിച്ചുള്ള എബ്രായ ബന്ധപ്രയോഗവും ദാവീദാണ് ആ രാജാവ് എന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  choice: അവനെ മാത്രം ഏല്പിച്ചുതരുക
  rationale: കുറ്റക്കാരനായി ചൂണ്ടിക്കാട്ടപ്പെട്ട ഒരാളെ മാത്രം കൈമാറണമെന്ന ആവശ്യത്തെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְאֵלְכָה מֵעַל הָעִיר
  choice: ഞാൻ നഗരത്തിൽനിന്ന് പിന്മാറാം
  rationale: ഉപരോധസന്ദർഭത്തിൽ നഗരത്തിനെതിരായ സൈനികനടപടിയിൽനിന്ന് പിൻവാങ്ങുന്നതാണ് ഉദ്ദേശ്യമെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും ഉടൻ സംഭവിക്കാനിരിക്കുന്ന കാര്യത്തെ ഉറപ്പോടെ അവതരിപ്പിക്കുകയും ചെയ്യുന്ന പ്രയോഗം.
- source_word: רֹאשׁוֹ מֻשְׁלָךְ אֵלֶיךָ בְּעַד הַחוֹמָה
  choice: അവന്റെ തല മതിലിനു മുകളിലൂടെ നിന്റെ അടുക്കലേക്ക് എറിഞ്ഞുതരും
  rationale: നിഷ്ക്രിയ കൃതന്തത്തിന്റെ ആസന്നഭാവി അർഥവും ഉപരോധമതിലിനു മുകളിലൂടെ തല എറിയുന്ന സാഹചര്യവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
