base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
translation:
  language: ml
  text: '“കാര്യം അങ്ങനെയല്ല. എഫ്രയീം മലനാട്ടിൽനിന്നുള്ള[a], ബിക്രിയുടെ മകൻ ശേബാ എന്നു പേരുള്ള ഒരാൾ രാജാവിനെതിരെ—ദാവീദിനെതിരെ—കൈ ഉയർത്തിയിരിക്കുന്നു[b]. അവനെ മാത്രം ഏല്പിച്ചുതരുക; ഞാൻ നഗരത്തിൽനിന്ന് പിന്മാറാം.” സ്ത്രീ യോവാബിനോടു പറഞ്ഞു: “ഇതാ, അവന്റെ തല മതിലിനു മുകളിലൂടെ നിന്റെ അടുക്കലേക്ക് എറിയപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി “എഫ്രയീം പർവതത്തിൽനിന്നുള്ള” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്; ഇവിടെ എബ്രായപ്രയോഗം എഫ്രയീമിന്റെ മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, അർഥം വ്യക്തമാക്കി: “രാജാവായ ദാവീദിനെതിരെ കലാപം നടത്തിയിരിക്കുന്നു.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “കൈ ഉയർത്തിയിരിക്കുന്നു” എന്നാണ്.'
    reason: lexical_alternative
