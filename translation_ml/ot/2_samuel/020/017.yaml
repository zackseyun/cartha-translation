source:
  edition: WLC
  text: וַ/יִּקְרַ֣ב אֵלֶ֔י/הָ וַ/תֹּ֧אמֶר הָ/אִשָּׁ֛ה הַ/אַתָּ֥ה יוֹאָ֖ב וַ/יֹּ֣אמֶר אָ֑נִי וַ/תֹּ֣אמֶר ל֗/וֹ שְׁמַע֙ דִּבְרֵ֣י אֲמָתֶ֔/ךָ וַ/יֹּ֖אמֶר שֹׁמֵ֥עַ אָנֹֽכִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
translation:
  language: ml
  text: 'അവൻ അവളുടെ അടുത്തേക്കു ചെന്നു. ആ സ്ത്രീ ചോദിച്ചു: “അങ്ങാണോ യോവാബ്?” അവൻ പറഞ്ഞു: “ഞാനാണ്.” അപ്പോൾ അവൾ അവനോടു പറഞ്ഞു: “അങ്ങയുടെ ദാസിയുടെ[a] വാക്കുകൾ കേൾക്കണമേ.” അവൻ പറഞ്ഞു: “ഞാൻ കേൾക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അടിമസ്ത്രീ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഒരു സ്ത്രീയുടെ താഴ്മയും സേവനസ്ഥാനവും പ്രകടിപ്പിക്കുന്ന സ്വയംവിശേഷണമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  choice: അവൻ അവളുടെ അടുത്തേക്കു ചെന്നു
  rationale: קרב എന്ന ക്രിയ ഇവിടെ അവളുടെ ദിശയിലേക്കുള്ള ശാരീരിക സമീപനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അതു പ്രകടിപ്പിക്കുന്നു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: സന്ദർഭത്തിൽ ഇത് ഭാര്യയെയല്ല, സംസാരിക്കുന്ന പ്രായപൂർത്തിയായ സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַאַתָּה יוֹאָב
  choice: അങ്ങാണോ യോവാബ്?
  rationale: തിരിച്ചറിയൽ ചോദ്യം നേരിട്ട് നിലനിർത്തുന്നു; ‘അങ്ങ്’ സംഭാഷണത്തിലെ ആദരസൂചകമായ അഭിസംബോധനയ്ക്കു യോജിക്കുന്നു.
- source_word: אָנִי
  choice: ഞാൻതന്നെ
  rationale: ഒറ്റയ്ക്കുള്ള സർവനാമം ചുരുക്കമായ സ്വയംതിരിച്ചറിയലായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ‘ഞാൻതന്നെ’ സ്വാഭാവികമായ മറുപടിയാണ്.
- source_word: שְׁמַע דִּבְרֵי
  choice: വാക്കുകൾ കേൾക്കണമേ
  rationale: שׁמע എന്ന ആജ്ഞ ശ്രദ്ധയോടെ കേൾക്കാനുള്ള അഭ്യർഥനയാണ്; ദാസിയെന്ന വിനയപ്രയോഗത്തോടൊത്ത മര്യാദാഭാവം ‘ണമേ’ നൽകുന്നു, എന്നാൽ ആജ്ഞയുടെ ഉള്ളടക്കം മായ്ക്കുന്നില്ല.
- source_word: אֲמָתֶךָ
  choice: അങ്ങയുടെ ദാസി
  rationale: אָמָה സ്ത്രീലിംഗത്തിലുള്ള ദാസിയെയോ അടിമപ്പെണ്ണിനെയോ സൂചിപ്പിക്കുകയും ഇവിടെ വിനയപൂർവമായ സ്വയംവിശേഷണമായി വരികയും ചെയ്യുന്നു. ‘ദാസി’ ലിംഗവും സേവന-വിനയഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: שֹׁמֵעַ אָנֹכִי
  choice: ഞാൻ കേൾക്കുന്നു
  rationale: കർത്തൃവാചക കൃദന്തവും സർവനാമവും ചേർന്ന ഘടന ഇപ്പോഴത്തെ ശ്രദ്ധാപൂർവമായ കേൾവിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉറവിടരൂപത്തോട് അടുത്തും സ്വാഭാവികവുമായ അവതരണമാണിത്.
