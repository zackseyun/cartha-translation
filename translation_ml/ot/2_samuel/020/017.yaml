  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. സ്ത്രീ യോവാബിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ എന്ന ആദരരൂപവും വിനയപൂർവമായ അഭ്യർഥനാശൈലിയും സ്വീകരിച്ചു; യോവാബിന്റെ മറുപടികൾ ഉറവിടത്തിലെപ്പോലെ ചുരുക്കമായി നിലനിർത്തി.
