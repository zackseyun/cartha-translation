id: 2SA.20.6
reference: 2 Samuel 20:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל אֲבִישַׁ֔י עַתָּ֗ה יֵ֧רַֽע לָ֛/נוּ שֶׁ֥בַע בֶּן בִּכְרִ֖י מִן אַבְשָׁל֑וֹם אַ֠תָּה קַ֞ח אֶת עַבְדֵ֤י אֲדֹנֶ֨י/ךָ֙ וּ/רְדֹ֣ף אַחֲרָ֔י/ו פֶּן מָ֥צָא ל֛/וֹ עָרִ֥ים בְּצֻר֖וֹת וְ/הִצִּ֥יל עֵינֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് അബീശായിയോടു പറഞ്ഞു: “ഇപ്പോൾ ബിക്രിയുടെ മകനായ ശേബാ അബ്ശാലോമിനെക്കാൾ നമുക്കു കൂടുതൽ ദോഷം വരുത്തും. നീ നിന്റെ യജമാനന്റെ ഭൃത്യന്മാരെ കൂട്ടിക്കൊണ്ട് അവനെ പിന്തുടരുക; അല്ലെങ്കിൽ അവൻ തനിക്കായി കോട്ടകെട്ടിയ പട്ടണങ്ങൾ കണ്ടെത്തി നമ്മുടെ കൺമുന്നിൽനിന്ന് രക്ഷപ്പെട്ടേക്കാം[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ, ‘നമ്മുടെ കണ്ണുകളെ വിടുവിക്കുക’; അർഥം, ‘നമ്മുടെ കൺമുന്നിൽനിന്ന് രക്ഷപ്പെടുക’ അഥവാ ‘നമ്മുടെ കാഴ്ചയിൽനിന്ന് ഒഴിഞ്ഞുപോകുക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרַע לָנוּ ... מִן־אַבְשָׁלוֹם
  choice: അബ്ശാലോമിനെക്കാൾ അധികം നമുക്കു ദോഷം ചെയ്യും
  rationale: רעע ഇവിടെ അമൂർത്തമായ ധാർമ്മിക തിന്മയെയല്ല, ദോഷമോ കഷ്ടമോ വരുത്തുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. מִן സൂചിപ്പിക്കുന്ന താരതമ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שֶׁבַע בֶּן־בִּכְרִי
  choice: ബിക്രിയുടെ മകനായ ശേബ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: אַתָּה קַח אֶת־עַבְדֵי אֲדֹנֶיךָ
  choice: നീ നിന്റെ യജമാനന്റെ ഭൃത്യന്മാരെ കൂട്ടിക്കൊണ്ട്
  rationale: സ്വതന്ത്ര സർവനാമമായ אַתָּה നൽകുന്ന ഊന്നൽ ‘നീ’ എന്നതിലൂടെ നിലനിർത്തുന്നു. קַח എന്നത് ഈ സൈനികസന്ദർഭത്തിൽ ആളുകളെ കൂടെ കൊണ്ടുപോകുക എന്ന സ്വാഭാവിക അർഥത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: וּרְדֹף אַחֲרָיו
  choice: അവനെ പിന്തുടരുക
  rationale: רדף എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ അർഥം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു; אַחֲרָיו-യുടെ ആശയം ‘പിന്തുടരുക’ എന്ന ക്രിയയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ ... രക്ഷപ്പെട്ടേക്കാം
  rationale: פֶּן മുന്നറിയിപ്പോടുകൂടിയ ആശങ്കാസാധ്യതയെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അല്ലെങ്കിൽ ... -േക്കാം’ എന്ന ഘടന ഈ ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: מָצָא לוֹ עָרִים בְּצֻרוֹת
  choice: തനിക്കായി കോട്ടകെട്ടിയ പട്ടണങ്ങൾ കണ്ടെത്തി
  rationale: מָצָא എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘കണ്ടെത്തുക’യും לוֹ എന്ന പ്രയോജനസൂചക ഘടകവും നിലനിർത്തുന്നു. בְּצֻרוֹת എന്നത് പ്രതിരോധസജ്ജമായ പട്ടണങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കോട്ടകെട്ടിയ’ എന്നു നൽകി.
- source_word: וְהִצִּיל עֵינֵינוּ
  choice: നമ്മുടെ കൺമുന്നിൽനിന്ന് രക്ഷപ്പെട്ടേക്കാം
  rationale: അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമായ ‘നമ്മുടെ കണ്ണുകളെ വിടുവിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട്, അതിന്റെ സന്ദർഭാർഥമായ കാഴ്ചയിൽനിന്ന് ഒഴിഞ്ഞുപോകുക എന്നത് സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രാജാവും സൈനികഭൃത്യന്മാരും തമ്മിലുള്ള അധികാരബന്ധം ‘യജമാനൻ’, ‘ഭൃത്യന്മാർ’ എന്നീ പദങ്ങളിലൂടെ നിലനിർത്തി. ഹീബ്രു ശൈലിയുടെ അസ്വാഭാവിക പദാനുപദരൂപം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി, അതിന്റെ ദൃശ്യബിംബം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
