  to: അമാസാ പ്രധാനപാതയുടെ നടുവിൽ രക്തത്തിൽ കിടന്നു പുളയുകയായിരുന്നു[a]. ജനമെല്ലാം അവിടെ നിൽക്കുന്നതു കണ്ടപ്പോൾ ആ മനുഷ്യൻ അമാസയെ പ്രധാനപാതയിൽനിന്ന് വയലിലേക്കു മാറ്റി, അവന്റെ മേൽ ഒരു വസ്ത്രം ഇട്ടു; അവന്റെ അടുത്തെത്തുന്നവരെല്ലാം നിൽക്കുന്നതായി കണ്ടതുകൊണ്ടാണ് അയാൾ അങ്ങനെ ചെയ്തത്.
