  text: Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
translation:
  language: ml
  text: അമാസാ പ്രധാനപാതയുടെ നടുവിൽ രക്തത്തിൽ കിടന്നു പുളയുകയായിരുന്നു[a]. ജനമെല്ലാം അവിടെ നിൽക്കുന്നതു കണ്ടപ്പോൾ ആ മനുഷ്യൻ അമാസയെ പ്രധാനപാതയിൽനിന്ന് വയലിലേക്കു മാറ്റി, അവന്റെ മേൽ ഒരു വസ്ത്രം ഇട്ടു; അവന്റെ അടുത്തെത്തുന്നവരെല്ലാം നിൽക്കുന്നതായി കണ്ടതുകൊണ്ടാണ് അയാൾ അങ്ങനെ ചെയ്തത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രക്തത്തിൽ കിടന്ന് ഉരുളുകയായിരുന്നു.’ എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘സ്വയം ഉരുളുക’ എന്നാണ്; ഇവിടെ മാരകമായി മുറിവേറ്റ അമാസായുടെ വേദനാജനകമായ ദേഹചലനമായിരിക്കാം ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְגֹּלֵל
  choice: കിടന്നു പുളയുകയായിരുന്നു
  rationale: Hitpolel രൂപം മാരകമായി മുറിവേറ്റ അമാസാ രക്തത്തിൽ കിടന്ന് ഉരുളുകയോ ദേഹമിളക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വേദനമൂലമുള്ള ആ ചലനം സ്വാഭാവികമായി അറിയിക്കാൻ ‘കിടന്നു പുളയുകയായിരുന്നു’ എന്നു നൽകി; ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥപരമായ ചിത്രം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בַּדָּם
  choice: രക്തത്തിൽ
  rationale: രക്തത്തിനുള്ളിലോ രക്തം പുരണ്ട നിലയിലോ കിടന്ന ദൃശ്യത്തെ നേരിട്ട് നൽകുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘സ്വന്തം’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: בְּתוֹךְ הַמְסִלָּה
  choice: പ്രധാനപാതയുടെ നടുവിൽ
  rationale: מְסִלָּה പ്രധാനമായതോ ഉയർത്തിയുണ്ടാക്കിയതോ ആയ പൊതുപാതയെ സൂചിപ്പിക്കാം. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ‘പ്രധാനപാത’ തിരഞ്ഞെടുത്തു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: നിശ്ചിത ഉപപദം സന്ദർഭത്തിൽ തിരിച്ചറിയപ്പെടുന്ന ഒരു പ്രത്യേക മനുഷ്യനെ സൂചിപ്പിക്കുന്നതിനാൽ നിശ്ചിതമായ രൂപം ഉപയോഗിച്ചു.
- source_word: כִּי עָמַד כָּל הָעָם
  choice: ജനമെല്ലാം അവിടെ നിൽക്കുന്നതു
  rationale: עמד ഇവിടെ മൃതദേഹത്തെയോ മുറിവേറ്റ അമാസായെയോ കണ്ടു യാത്രക്കാർ മുന്നോട്ടുപോകാതെ നിൽക്കുന്നതാണ്. ‘അവിടെ’ സന്ദർഭം വ്യക്തമാക്കുന്നു, എന്നാൽ കാരണത്തെക്കുറിച്ച് അധികവിവരം ചേർക്കുന്നില്ല.
- source_word: וַיַּסֵּב
  choice: മാറ്റി
  rationale: Hiphil രൂപം അമാസായെ പാതയിൽനിന്ന് വശത്തേക്കു മാറ്റിയതിനെ സൂചിപ്പിക്കുന്നു. എങ്ങനെ മാറ്റിയെന്ന് മൂലപാഠം പറയാത്തതിനാൽ ‘വലിച്ചിഴച്ചു’ പോലുള്ള വിശദീകരണം ഒഴിവാക്കി.
- source_word: מִן הַמְסִלָּה הַשָּׂדֶה
  choice: പ്രധാനപാതയിൽനിന്ന് വയലിലേക്കു
  rationale: പാതയിൽനിന്ന് അതിനോടുചേർന്ന തുറന്ന വയൽപ്രദേശത്തേക്കുള്ള നീക്കം ലക്ഷ്യദിശയോടെ സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: בֶּגֶד
  choice: ഒരു വസ്ത്രം
  rationale: בֶּגֶד വസ്ത്രത്തിനുള്ള പൊതുപദമാണ്. ‘മേലങ്കി’ എന്നു കൂടുതൽ പ്രത്യേകമാക്കാതെയും ‘മൂടി’ എന്നു വസ്ത്രസ്വഭാവം നഷ്ടപ്പെടുത്താതെയും വിവർത്തനം ചെയ്തു.
- source_word: כָּל הַבָּא עָלָיו
  choice: അവന്റെ അടുത്തെത്തുന്നവരെല്ലാം
  rationale: പാതയിലൂടെ വന്ന് അമാസാ കിടക്കുന്നിടത്ത് എത്തുന്നവരെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘അടുത്തെത്തുന്നവർ’ ഈ നേരിടൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְעָמָד
  choice: നിൽക്കുന്നതായി
  rationale: ആളുകൾ അമാസായെ കണ്ടപ്പോൾ യാത്ര നിർത്തുന്നതിനെ മുൻപ്രയോഗത്തോടുള്ള ആവർത്തനം നിലനിർത്തിക്കൊണ്ട് നൽകി.
