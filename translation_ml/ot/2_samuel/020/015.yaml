source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ וַ/יָּצֻ֣רוּ עָלָ֗י/ו בְּ/אָבֵ֨לָ/ה֙ בֵּ֣ית הַֽמַּעֲכָ֔ה וַ/יִּשְׁפְּכ֤וּ סֹֽלְלָה֙ אֶל הָ/עִ֔יר וַֽ/תַּעֲמֹ֖ד בַּ/חֵ֑ל וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אֶת יוֹאָ֔ב מַשְׁחִיתִ֖ם לְ/הַפִּ֥יל הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
translation:
  language: ml
  text: അവർ വന്ന് ആബേൽ-ബേത്ത്-മയഖയിൽ അവനെ ഉപരോധിച്ചു[a]. അവർ നഗരത്തിനെതിരെ ഒരു ഉപരോധച്ചരിവ്[b] പണിതുയർത്തി; അത് പുറംകോട്ടയോടു ചേർന്നുനിന്നു[c]. യോവാബിനോടുകൂടെയുണ്ടായിരുന്ന ജനമെല്ലാം മതിൽ ഇടിച്ചുവീഴ്ത്താൻ തകർക്കുന്ന പ്രവൃത്തിയിലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിനെ ഉപരോധിച്ചു.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവനെതിരെ’ എന്നാണ്; നഗരം ഉപരോധിക്കപ്പെട്ടിരുന്നെങ്കിലും ലക്ഷ്യം ശേബയാണെന്നതിലേക്കായിരിക്കാം ശ്രദ്ധ.
    reason: alternative_reading
  - marker: b
    text: ‘ഉപരോധച്ചരിവ്’ എന്നതിന് ‘മൺതിട്ട’ അഥവാ ‘ഉപരോധമേട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘പുറംകോട്ട’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം പുറത്തെ പ്രതിരോധഭിത്തിയെയോ മറ്റൊരു കോട്ടനിർമിതിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: അവർ വന്നു
  rationale: בוא എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ സ്വാഭാവികമായ മലയാള പരിഭാഷ.
- source_word: וַיָּצֻרוּ עָלָיו
  choice: അവനെ ഉപരോധിച്ചു
  rationale: צור עַל എന്നത് ‘ഉപരോധിക്കുക’ എന്നാണ്; പുല്ലിംഗ ഏകവചന പ്രത്യയം നഗരത്തിനുള്ളിലെ ശേബയെ ലക്ഷ്യമാക്കുന്നതിനാൽ ‘അവനെ’ നിലനിർത്തുന്നു.
- source_word: בְּאָבֵלָה בֵּית הַמַּעֲכָה
  choice: ആബേൽ-ബേത്ത്-മയഖയിൽവെച്ച്
  rationale: നഗരനാമത്തിന്റെ ഘടകങ്ങൾ തിരിച്ചറിയാവുന്ന വിധത്തിൽ മലയാള ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיִּשְׁפְּכוּ סֹלְלָה
  choice: ഒരു ഉപരോധച്ചരിവ് പണിതുയർത്തി
  rationale: ശത്രുനഗരത്തിലേക്കു മണ്ണു കൂട്ടിയുയർത്തുന്ന സൈനിക നിർമാണമാണ് പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം; ‘പണിതുയർത്തി’ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ആ ദൃശ്യം നൽകുന്നു.
- source_word: אֶל הָעִיר
  choice: നഗരത്തിനെതിരെ
  rationale: אֶל ദിശ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഉപരോധസന്ദർഭത്തിലെ ശത്രുതാപരമായ ലക്ഷ്യം ‘എതിരെ’ വ്യക്തമാക്കുന്നു.
- source_word: וַתַּעֲמֹד בַּחֵל
  choice: അത് പുറംകോട്ടയോട് ചേർന്നുനിന്നു
  rationale: സ്ത്രീലിംഗ ക്രിയയുടെ കർത്താവ് മുമ്പുള്ള סֹלְלָה ആണ്; חֵל നഗരത്തിന്റെ പുറം പ്രതിരോധനിർമിതിയെ സൂചിപ്പിക്കാം. ‘ചേർന്നുനിന്നു’ സ്ഥലബന്ധം സ്വാഭാവികമായി നൽകുന്നു, എന്നാൽ പദത്തിന്റെ കൃത്യസ്വഭാവം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: וְכָל הָעָם אֲשֶׁר אֶת יוֹאָב
  choice: യോവാബിനോടുകൂടെയുണ്ടായിരുന്ന ജനമെല്ലാം
  rationale: אֶת ഇവിടെ യോവാബിനോടുള്ള സഹവർത്തിത്വം സൂചിപ്പിക്കുന്ന അപൂർണഘടനയാണ്; സൈനികരെന്ന് പാഠത്തിൽ ഇല്ലാത്തതിനാൽ ‘ജനം’ നിലനിർത്തി.
- source_word: מַשְׁחִיתִם
  choice: അതിനെ തകർത്തുകൊണ്ടിരുന്നു
  rationale: שׁחת-ന്റെ പുരുഷലിംഗ ബഹുവചന പങ്കാളിത്തരൂപം തുടരുന്ന നശീകരണപ്രവർത്തനം സൂചിപ്പിക്കുന്നു. വ്യക്തമല്ലാത്ത കർമത്തെ ‘അതിനെ’ എന്നു നിലനിർത്തി.
- source_word: לְהַפִּיל הַחוֹמָה
  choice: മതിൽ ഇടിച്ചുവീഴ്ത്താൻ
  rationale: נפל ഹിഫീൽ രൂപത്തിന് ‘വീഴാൻ ഇടയാക്കുക’ എന്ന കാരണാർഥമുണ്ട്; ഉപരോധസന്ദർഭത്തിൽ ‘ഇടിച്ചുവീഴ്ത്തുക’ സ്വാഭാവികമാണ്.
