  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. ‘ഉപരോധച്ചരിവ്’, ‘പുറംകോട്ട’ എന്നീ സൈനികപദങ്ങൾ സന്ദർഭവ്യക്തതയ്ക്കായി ഉപയോഗിച്ചു; എബ്രായത്തിലെ സർവനാമസംബന്ധമായ യഥാർഥ അസ്പഷ്ടത പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
