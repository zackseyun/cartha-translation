id: 2SA.20.18
reference: 2 Samuel 20:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֖אמֶר לֵ/אמֹ֑ר דַּבֵּ֨ר יְדַבְּר֤וּ בָ/רִֽאשֹׁנָה֙ לֵ/אמֹ֔ר שָׁאֹ֧ל יְשָׁאֲל֛וּ בְּ/אָבֵ֖ל וְ/כֵ֥ן הֵתַֽמּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/018.yaml
  text: Then she said[a], “They used to say in former times[b], ‘Let them surely ask at Abel,’ and so they ended the matter.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ പറഞ്ഞു[a]: “പണ്ടുകാലത്ത് ആളുകൾ ഇങ്ങനെ പറയുമായിരുന്നു: ‘ആബേലിൽ[b] ചോദിച്ചറിയുകതന്നെ വേണം’; അങ്ങനെ അവർ കാര്യം തീർപ്പാക്കുമായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “പണ്ടുകാലത്ത് ആളുകൾ തീർച്ചയായും ഇങ്ങനെ പറയുമായിരുന്നു: ‘ആബേലിൽ ചോദിച്ചറിയുകതന്നെ വേണം’; അങ്ങനെ അവർ അതു പൂർത്തിയാക്കുമായിരുന്നു.” എബ്രായത്തിൽ ആദ്യത്തെ ‘പറയുക’, ‘ചോദിക്കുക’ എന്നീ ക്രിയകൾക്ക് ഊന്നൽ നൽകുന്ന ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് നിർമാണങ്ങളുണ്ട്; അവസാനത്തെ ക്രിയയെ കൂടുതൽ അക്ഷരാർഥത്തിൽ “അവസാനിപ്പിക്കുക” അല്ലെങ്കിൽ “പൂർത്തിയാക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: “ആബേൽ” എന്നത് ഈ സന്ദർഭത്തിൽ ഉപരോധിക്കപ്പെട്ടിരിക്കുന്ന ആബേൽ-ബേത്ത്-മയഖാ നഗരത്തിന്റെ ചുരുക്കപ്പേരാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ അവൾ പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിന്റെ തുടർച്ചയിൽ സ്ത്രീയുടെ വാക്കുകളെ അവതരിപ്പിക്കുന്നു; ആ പുരോഗതി സ്വാഭാവിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: דַּבֵּר יְדַבְּרוּ
  choice: ആളുകൾ ഇങ്ങനെ പറയുമായിരുന്നു
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ഇംപെർഫെക്റ്റും ചേർന്ന പ്രയോഗം മുൻകാലത്തെ പതിവായ പറച്ചിലിനെ ഊന്നുന്നു. മലയാളത്തിലെ ‘പറയുമായിരുന്നു’ ആ ആചാരപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בָרִאשֹׁנָה
  choice: പണ്ടുകാലത്ത്
  rationale: ഇത് ഒരു ക്രമത്തിലെ ആദ്യഘട്ടത്തേക്കാൾ മുൻകാലത്തെ പതിവിനെയോ സമ്പ്രദായത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: שָׁאֹל יְשָׁאֲלוּ
  choice: ചോദിച്ചറിയുകതന്നെ വേണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ഇംപെർഫെക്റ്റും ചേർന്നത് ചോദിക്കുന്ന പ്രവൃത്തിക്ക് ഊന്നൽ നൽകുന്നു; ‘തന്നെ വേണം’ പഴമൊഴിസദൃശമായ നിർദേശഭാവവും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: בְּאָבֵל
  choice: ഹാബേലിൽ
  rationale: ഇവിടെ ഉപരോധിക്കപ്പെട്ട ഹാബേൽ-ബേത്ത്-മയഖാ നഗരത്തിന്റെ ചുരുക്കപ്പേരാണ്; സ്ഥലത്തിനകത്ത് അന്വേഷിക്കുന്നതെന്ന നേരിട്ടുള്ള അർഥം ‘ഹാബേലിൽ’ നൽകുന്നു.
- source_word: וְכֵן הֵתַמּוּ
  choice: അങ്ങനെ അവർ കാര്യം തീർപ്പാക്കുമായിരുന്നു
  rationale: וְכֵן ഫലമോ രീതിയോ ബന്ധിപ്പിക്കുന്നു; תמם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം കാര്യം പൂർത്തിയിലേക്കോ പരിഹാരത്തിലേക്കോ കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘കാര്യം തീർപ്പാക്കുക’ സ്വാഭാവികവും അർഥസമ്പന്നവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ പഴമൊഴിസദൃശമായ സ്വരം നിലനിർത്തി; എബ്രായത്തിലെ ഊന്നലും അവസാന ക്രിയയുടെ പൂർത്തിയാക്കുക/തീർപ്പാക്കുക എന്ന അർഥവ്യാപ്തിയും മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
