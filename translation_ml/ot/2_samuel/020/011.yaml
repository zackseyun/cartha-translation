  yaml_path: translation/ot/2_samuel/020/011.yaml
  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
translation:
  language: ml
  text: 'യോവാബിന്റെ യുവാക്കളിൽ[a] ഒരാൾ അമാസയുടെ അരികിൽ നിന്നു പറഞ്ഞു: “യോവാബിനെ അനുകൂലിക്കുന്നവനും ദാവീദിന്റെ പക്ഷത്തുള്ളവനും യോവാബിനെ അനുഗമിക്കട്ടെ!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യോവാബിന്റെ യുവാക്കൾ’ എന്നത് ‘യോവാബിന്റെ സേവകർ’ എന്നോ ‘പരിചാരകർ’ എന്നോ പരിഭാഷപ്പെടുത്താം; ഇവിടെ അവന്റെ കീഴിലുള്ള ആളുകളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘യോവാബിന്റെ പിന്നാലെ’ എന്നാണ്; സന്ദർഭത്തിൽ ഇത് അവനെ അനുഗമിക്കാനുള്ള ആഹ്വാനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: ഒരാൾ
  rationale: אִישׁ എന്നതിന്റെ അനിശ്ചിത ഏകവചനബലം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഒരാൾ’ എന്നു നൽകി.
- source_word: עָמַד עָלָיו
  choice: അമാസയുടെ അരികിൽ നിന്നുകൊണ്ട്
  rationale: עָמַד עַל ഇവിടെ വീണുകിടക്കുന്ന അമാസയുടെ സമീപത്ത് നിലയുറപ്പിച്ചതിനെ സൂചിപ്പിക്കാം. ‘മേൽ നിന്നു’ എന്ന മലയാളപ്രയോഗം ശരീരത്തിന്മേൽ കയറി നിന്നുവെന്ന തെറ്റായ ധാരണ നൽകാൻ ഇടയുള്ളതിനാൽ ‘അരികിൽ’ എന്നു നൽകി; ‘അമാസ’ എന്ന പേര് മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കിയതാണ്.
- source_word: מִנַּעֲרֵי יוֹאָב
  choice: യോവാബിന്റെ യുവാക്കളിൽ ഒരാൾ
  rationale: נַעַר എന്നതിന് യുവാവ്, സേവകൻ, പരിചാരകൻ എന്നീ അർഥസാധ്യതകളുണ്ട്. അടിസ്ഥാനാർഥം നിലനിർത്തി ‘യുവാക്കൾ’ എന്നു മുഖ്യവാചകത്തിൽ നൽകി; സന്ദർഭപരമായ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: מִי אֲשֶׁר חָפֵץ בְּיוֹאָב
  choice: യോവാബിനെ അനുകൂലിക്കുന്നവൻ
  rationale: חָפֵץ എന്നതിന്റെ ഇഷ്ടം, താത്പര്യം, അനുകൂലത എന്നീ അർഥങ്ങളിൽ ഇവിടെ രാഷ്ട്രീയ-സൈനിക പിന്തുണയാണ് സന്ദർഭോചിതം.
- source_word: וּמִי אֲשֶׁר לְדָוִד
  choice: ദാവീദിന്റെ പക്ഷത്തുള്ളവൻ
  rationale: לְדָוִד എന്നത് ദാവീദിനോടുള്ള പക്ഷബന്ധമോ കൂറോ സൂചിപ്പിക്കുന്നു; ‘പക്ഷത്തുള്ളവൻ’ ഇത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַחֲרֵי יוֹאָב
  choice: യോവാബിനെ അനുഗമിക്കട്ടെ
  rationale: അക്ഷരാർഥം ‘യോവാബിന്റെ പിന്നാലെ’ എന്നാണ്; ഈ ആഹ്വാനത്തിൽ ഉദ്ദേശ്യം അവനെ പിന്തുടരുക എന്നതിനാൽ മലയാളത്തിൽ ആവശ്യമായ ക്രിയ ചേർത്തു.
