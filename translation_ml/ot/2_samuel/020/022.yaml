  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
translation:
  language: ml
  text: അപ്പോൾ ആ സ്ത്രീ തന്റെ ജ്ഞാനത്തോടെ ജനമെല്ലാവരുടെയും അടുക്കൽ ചെന്നു. അവർ ബിക്രിയുടെ മകനായ ശേബയുടെ തല വെട്ടി യോവാബിന്റെ അടുക്കലേക്ക് എറിഞ്ഞു. യോവാബ് കാഹളം ഊതി; അപ്പോൾ അവർ നഗരത്തിന്റെ നേരെനിന്ന് പിരിഞ്ഞുപോയി, ഓരോരുത്തനും അവനവന്റെ കൂടാരത്തിലേക്ക്[a]. യോവാബോ യെരൂശലേമിലെ രാജാവിന്റെ അടുക്കലേക്ക് മടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഓരോരുത്തനും അവനവന്റെ കൂടാരത്തിലേക്ക്” എന്നത് ഓരോരുത്തരും തങ്ങളുടെ സ്ഥലങ്ങളിലേക്കു പിരിഞ്ഞുപോയി എന്നർഥമുള്ള ഒരു പതിവ് എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּבוֹא
  choice: ചെന്നു
  rationale: בוא എന്ന ക്രിയയ്ക്ക് കാഴ്ചപ്പാടനുസരിച്ച് ‘വന്നു’ എന്നും ‘ചെന്നു’ എന്നും അർഥമാകാം; സ്ത്രീ ജനങ്ങളുടെ അടുക്കലേക്കു നീങ്ങുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ചെന്നു’ എന്നു പറയുന്നു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: മുൻസന്ദർഭത്തിലെ വിവേകശാലിയായ സ്ത്രീയെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമപദം; ഇവിടെ ‘വിവേകശാലി’ വീണ്ടും ചേർക്കാതെ എബ്രായരൂപം നിലനിർത്തുന്നു.
- source_word: אֶל כָּל הָעָם
  choice: ജനമെല്ലാവരുടെയും അടുക്കൽ
  rationale: עָם എന്നത് ഇവിടെ നഗരത്തിന്റെ പ്രതികരണത്തിൽ പങ്കെടുത്ത ജനങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘ജനം’ എന്നത് സൈനികരോ നഗരവാസികളോ എന്നു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: בְּחָכְמָתָהּ
  choice: തന്റെ ജ്ഞാനത്തോടെ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ മാർഗം/ഉപാധി എന്ന ഭാവവും חָכְמָה എന്ന നാമപദത്തിനുള്ള ആഖ്യാനപ്രാധാന്യവും സംരക്ഷിക്കുന്നു.
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁ
  choice: തല വെട്ടി
  rationale: തലയെ കർത്തവ്യമായി സ്വീകരിക്കുന്ന כרת ഇവിടെ ശിരഛേദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിലെ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: ബിക്രിയുടെ മകനായ ശേബ
  rationale: എബ്രായ പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: וַיַּשְׁלִכוּ אֶל יוֹאָב
  choice: യോവാബിന്റെ അടുക്കലേക്ക് എറിഞ്ഞു
  rationale: ക്രിയയുടെ ശക്തിയും אֶל എന്നതിന്റെ ദിശാഭാവവും നിലനിർത്തുന്നു; യോവാബിന് നേരിട്ടു കൈമാറി എന്നതിലുപരി അവന്റെ അടുക്കലേക്ക് എറിഞ്ഞുവെന്ന ദൃശ്യമാണ് മൂലപാഠത്തിൽ.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: യോവാബ് കാഹളം ഊതി
  rationale: ഏകവചന കർത്താവ് സന്ദർഭത്തിൽ യോവാബാണ്; שׁוֹפָר ഒരു കൊമ്പുകാഹളമാണെങ്കിലും ‘കാഹളം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ബൈബിൾ ആഖ്യാനത്തിന് യോജിച്ചതുമാണ്.
- source_word: וַיָּפֻצוּ מֵעַל הָעִיר
  choice: അവർ നഗരത്തെ വിട്ട് പിരിഞ്ഞുപോയി
  rationale: വളഞ്ഞുനിന്ന നഗരത്തിന്മേൽനിന്ന് സൈന്യം പിൻവാങ്ങി ചിതറിപ്പോകുന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഭയന്നോടി എന്ന ധ്വനി ചേർക്കുന്നില്ല.
- source_word: אִישׁ לְאֹהָלָיו
  choice: ഓരോരുത്തനും അവനവന്റെ കൂടാരത്തിലേക്ക്
  rationale: എബ്രായത്തിലെ ഏകവചന വിതരണഘടനയും പരമ്പരാഗത പിരിഞ്ഞുപോകൽ പ്രയോഗവും കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְיוֹאָב שָׁב יְרוּשָׁלִַם אֶל הַמֶּלֶךְ
  choice: യോവാബോ യെരൂശലേമിൽ രാജാവിന്റെ അടുക്കലേക്ക് മടങ്ങി
  rationale: ലക്ഷ്യസ്ഥാനമായ യെരൂശലേമും അവിടെയുള്ള രാജാവിന്റെ അടുക്കലേക്കുള്ള മടങ്ങിവരവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു; വְ എന്നത് സമാപനത്തിലെ കർത്തൃമാറ്റം സൂചിപ്പിക്കാൻ ‘യോവാബോ’ എന്നു നൽകിയിരിക്കുന്നു.
