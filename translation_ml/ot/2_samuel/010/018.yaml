id: 2SA.10.18
reference: 2 Samuel 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣נָס אֲרָם֮ מִ/פְּנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜ד מֵ/אֲרָ֗ם שְׁבַ֤ע מֵאוֹת֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֨ת שׁוֹבַ֧ךְ שַׂר צְבָא֛/וֹ הִכָּ֖ה וַ/יָּ֥מָת שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
translation:
  language: ml
  text: അരാം യിസ്രായേലിന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി. ദാവീദ് അരാമ്യരിൽ എഴുനൂറു രഥയോദ്ധാക്കളെയും[a] നാൽപ്പതിനായിരം കുതിരപ്പടയാളികളെയും കൊന്നു. അവന്റെ സൈന്യാധിപനായ[b] ശോബക്കിനെയും ദാവീദ് അടിച്ചുവീഴ്ത്തി; അവൻ അവിടെവെച്ചു മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘എഴുനൂറു രഥം/രഥസേന’ എന്നാണ്; ഇവിടെ ഉദ്ദേശിക്കുന്നത് രഥസേനയിലെ യോദ്ധാക്കളായിരിക്കാം. 1 ദിനവൃത്താന്തം 19:18-ൽ ‘ഏഴായിരം രഥങ്ങൾ’ എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: ‘അവന്റെ സൈന്യം’ എന്നതിലെ എബ്രായ പ്രത്യയം ഏകവചനമാണ്; സന്ദർഭത്തിൽ അത് അരാമ്യരുടെ സൈന്യത്തെ നയിച്ചിരുന്ന ഒരു ഭരണാധികാരിയുടെ സൈന്യത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  choice: അരാം യിസ്രായേലിന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി
  rationale: അֲרָם എന്ന ദേശനാമത്തിന്റെ കൂട്ടായ ജനസൂചന നിലനിർത്തുന്നു. מִפְּנֵי എന്നത് ശത്രുവിന്റെ മുമ്പിൽനിന്ന് പിന്മാറുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മുമ്പിൽനിന്ന് ഓടിപ്പോയി’ എന്ന സ്വാഭാവിക പ്രയോഗം സ്വീകരിച്ചു.
- source_word: וַיַּהֲרֹג דָּוִד
  choice: ദാവീദ് ... കൊന്നു
  rationale: הרג എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കൊല്ലുക’ എന്നാണ്; വാക്യത്തിന്റെ പിന്നിലുള്ള נכה എന്ന ക്രിയയിൽനിന്നുള്ള പദവ്യത്യാസവും ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  choice: എഴുനൂറു രഥയോദ്ധാക്കൾ
  rationale: רֶכֶב അക്ഷരാർഥത്തിൽ ‘രഥം/രഥസേന’ എന്നാണ്. യുദ്ധത്തിലെ കൊല്ലപ്പെട്ടവരുടെ കണക്കായതിനാൽ മനുഷ്യരെ സൂചിപ്പിക്കുന്ന ‘രഥയോദ്ധാക്കൾ’ വായനാസൗകര്യം നൽകുന്നു; പാഠത്തിലെ പ്രയാസവും ദിനവൃത്താന്തത്തിലെ വ്യത്യസ്ത കണക്കും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  choice: നാല്പതിനായിരം കുതിരപ്പടയാളികൾ
  rationale: פָּרָשִׁים കുതിരപ്പടയെയോ കുതിരപ്പടയാളികളെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സൈനിക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְאֵת שׁוֹבַךְ
  choice: ശോബക്ക്
  rationale: മസോരറ്റിക് സ്വരീകരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שַׂר צְבָאוֹ
  choice: അവന്റെ സൈന്യാധിപൻ
  rationale: ഹീബ്രു പ്രത്യയം ഏകവചനമായ ‘അവന്റെ’ എന്നാണ്. അതിനെ ബഹുവചനമാക്കി തീർപ്പാക്കാതെ മൂലത്തിലെ രൂപം നിലനിർത്തി; അതിന്റെ സൂചിതവ്യക്തിയെക്കുറിച്ചുള്ള സാധ്യത അടിക്കുറിപ്പിൽ പറയുന്നു.
- source_word: הִכָּה
  choice: വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്നത് അടിക്കുക, വീഴ്ത്തുക, പരാജയപ്പെടുത്തുക തുടങ്ങിയ അർഥങ്ങളുള്ളതാണ്. പിന്നാലെ ‘മരിച്ചു’ എന്നു വരുന്നതിനാൽ മാരകമായി വീഴ്ത്തിയെന്ന സന്ദർഭാർഥം നൽകുകയും മുമ്പത്തെ ‘കൊന്നു’ എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיָּמָת שָׁם
  choice: അവൻ അവിടെവെച്ചു മരിച്ചു
  rationale: ഹീബ്രു വാക്യത്തിന്റെ ലളിതവും നേരിട്ടുമായ അർഥം; യുദ്ധസ്ഥലത്തുതന്നെ എന്നതിലപ്പുറം വിശദാംശം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: צְבָאוֹ എന്ന ഏകവചന ഉടമസ്ഥപ്രത്യയത്തിന്റെ സൂചിതവ്യക്തി
  choice: ‘അവന്റെ സൈന്യം’ എന്ന മൂലരൂപം നിലനിർത്തി
  alternative: ‘അവരുടെ സൈന്യം,’ അതായത് അരാമ്യരുടെ സൈന്യം
  rationale: ഹീബ്രു പ്രത്യയം വ്യാകരണപരമായി ഏകവചനമാണ്. അത് ഹദദേസരിനെയോ മറ്റൊരു ഏകവചന മുൻസൂചനയെയോ ഉദ്ദേശിക്കാം; ‘അവരുടെ’ എന്നു മാറ്റുന്നത് ഈ അവ്യക്തതയെ നിശ്ശബ്ദമായി പരിഹരിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. ‘വെട്ടിവീഴ്ത്തി’ എന്നത് സന്ദർഭത്തിലെ മാരക പ്രഹരം പ്രകടമാക്കുന്നു; എന്നാൽ പിന്നാലെയുള്ള ‘മരിച്ചു’ എന്ന സ്വതന്ത്ര പ്രസ്താവന നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
