source:
  edition: WLC
  text: וַ/יֵּֽצְאוּ֙ בְּנֵ֣י עַמּ֔וֹן וַ/יַּעַרְכ֥וּ מִלְחָמָ֖ה פֶּ֣תַח הַ/שָּׁ֑עַר וַ/אֲרַ֨ם צוֹבָ֤א וּ/רְחוֹב֙ וְ/אִֽישׁ ט֣וֹב וּ/מַֽעֲכָ֔ה לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
translation:
  language: ml
  text: അപ്പോൾ അമ്മോന്യർ[a] പുറത്തുവന്ന് കവാടത്തിന്റെ പ്രവേശനത്തിൽ യുദ്ധത്തിനായി അണിനിരന്നു. എന്നാൽ സോബായിലെ അരാമ്യരും രെഹോബുകാരും തോബിലെ ആളുകളും[b] മാഖാക്കാരും വയലിൽ വേറിട്ടുനിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അമ്മോന്റെ പുത്രന്മാർ.’'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം ‘തോബിലെ ആളുകൾ’ എന്നു പരിഭാഷപ്പെടുത്താം; ‘ഈശ്-തോബ്’ എന്ന സ്ഥലനാമമായും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: പുറപ്പെട്ടുവന്നു
  rationale: יצא എന്ന ക്രിയയുടെ പുറപ്പെടുക/പുറത്തുവരുക എന്ന സൈനികസന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: അക്ഷരാർഥത്തിൽ ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും ഇവിടെ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ വ്യക്തമായ ജനനാമം ഉപയോഗിച്ചു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: യുദ്ധത്തിനായി അണിനിരന്നു
  rationale: ערך + מלחמה സൈന്യത്തെ യുദ്ധനിരയിൽ ക്രമീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
- source_word: פֶּתַח הַשָּׁעַר
  choice: കവാടത്തിന്റെ പ്രവേശനത്തിങ്കൽ
  rationale: פתח എന്നതിന്റെ പ്രവേശനം/തുറവ് എന്ന സ്ഥലസൂചന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וַאֲרַם צוֹבָא וּרְחוֹב
  choice: സോബാ-അരാമിൽനിന്നും രെഹോബിൽനിന്നുമുള്ളവർ
  rationale: അരാം എന്ന പുരാതന നാമം ‘സിറിയ’ എന്നു മാറ്റാതെ നിലനിർത്തുകയും സോബാ, രെഹോബ് എന്നീ പ്രദേശങ്ങളിൽനിന്നുള്ള സഖ്യസേനകളെ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְאִישׁ טוֹב
  choice: തോബിലെ ആളുകൾ
  rationale: אִישׁ טוֹב എന്നത് തോബ് പ്രദേശത്തുനിന്നുള്ള ആളുകൾ എന്നു വായിക്കാം; ‘ഈശ്-തോബ്’ എന്ന സ്ഥലനാമവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וּמַעֲכָה
  choice: മയഖയിൽനിന്നുള്ളവർ
  rationale: പട്ടികയിലെ സഖ്യസേനാസന്ദർഭം മലയാളത്തിൽ വ്യക്തമാക്കിക്കൊണ്ട് മയഖ എന്ന സ്ഥലനാമം നിലനിർത്തുന്നു.
- source_word: לְבַדָּם בַּשָּׂדֶה
  choice: അവരിൽനിന്നു വേറിട്ട് വയലിൽ നിലയുറപ്പിച്ചു
  rationale: അമ്മോന്യരുടെ കവാടസ്ഥാനത്തിൽനിന്ന് സഖ്യസേന വേറിട്ടു വയലിലായിരുന്നുവെന്ന തന്ത്രപരമായ വ്യത്യാസം വ്യക്തമാക്കുന്നു; ‘തുറസ്സായ’ എന്ന അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
