  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. പുരാതന സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു; സൈനിക വിന്യാസത്തിലെ രണ്ട് വേറിട്ട സ്ഥാനങ്ങൾ വാക്യഘടനയിൽ വ്യക്തമാക്കി.
