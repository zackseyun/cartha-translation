revisions:
- from: അപ്പോൾ അമ്മോന്യർ[a] പുറപ്പെട്ടുവന്ന് കവാടത്തിന്റെ പ്രവേശനത്തിങ്കൽ യുദ്ധത്തിനായി അണിനിരന്നു. എന്നാൽ സോബാ-അരാമിൽനിന്നും രെഹോബിൽനിന്നുമുള്ളവരും തോബിലെ ആളുകളും[b] മയഖയിൽനിന്നുള്ളവരും അവരിൽനിന്നു വേറിട്ട് വയലിൽ നിലയുറപ്പിച്ചു.
  to: അപ്പോൾ അമ്മോന്യർ[a] പുറത്തുവന്ന് കവാടത്തിന്റെ പ്രവേശനത്തിൽ യുദ്ധത്തിനായി അണിനിരന്നു. എന്നാൽ സോബായിലെ അരാമ്യരും രെഹോബുകാരും തോബിലെ ആളുകളും[b] മാഖാക്കാരും വയലിൽ വേറിട്ടുനിന്നു.
  rationale: The revision preserves the Hebrew military contrast while removing the unexpressed pronoun in “അവരിൽനിന്നു.” It uses more natural modern Malayalam for the gate location, regularizes the allied contingents in the list, and corrects the transliteration of Maacah. Footnote anchors and both source-relevant alternatives are retained.
