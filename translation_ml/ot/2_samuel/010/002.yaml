source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כַּ/אֲשֶׁר֩ עָשָׂ֨ה אָבִ֤י/ו עִמָּדִ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֨ח דָּוִ֧ד לְ/נַחֲמ֛/וֹ בְּ/יַד עֲבָדָ֖י/ו אֶל אָבִ֑י/ו וַ/יָּבֹ֨אוּ֙ עַבְדֵ֣י דָוִ֔ד אֶ֖רֶץ בְּנֵ֥י עַמּֽוֹן־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
translation:
  language: ml
  text: 'ദാവീദ് പറഞ്ഞു: “നാഹാശിന്റെ മകനായ ഹാനൂനോട് ഞാൻ ദയ കാണിക്കും; അവന്റെ അപ്പൻ എന്നോട് ദയ കാണിച്ചതുപോലെതന്നെ.” അതിനാൽ, അവന്റെ അപ്പനെച്ചൊല്ലി അവനെ ആശ്വസിപ്പിക്കാൻ[a] ദാവീദ് തന്റെ ദാസന്മാരെ അയച്ചു. ദാവീദിന്റെ ദാസന്മാർ അമ്മോന്യരുടെ ദേശത്ത് എത്തി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ അപ്പനെച്ചൊല്ലി അനുശോചനം അറിയിക്കാൻ.” ഹീബ്രു പ്രയോഗം അവന്റെ അപ്പന്റെ മരണത്തിൽ അനുശോചനം അറിയിക്കുന്നതിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: ദയ
  rationale: ഈ നയതന്ത്രപരവും പരസ്പരബന്ധപരവുമായ സന്ദർഭത്തിൽ חֶסֶד എന്നത് ഉടമ്പടിസ്നേഹം എന്ന പ്രത്യേക അർഥത്തിലേക്ക് ചുരുക്കാതെ, ഒരാൾ മറ്റൊരാളോട് കാണിക്കുന്ന ഉപകാരപൂർവമായ വിശ്വസ്തതയെയും ദയയെയും സൂചിപ്പിക്കുന്നു. ‘ദയ കാണിക്കുക’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും രണ്ടു പ്രയോഗങ്ങൾക്കും യോജിച്ചതുമാണ്.
- source_word: חָנוּן בֶּן נָחָשׁ
  choice: നാഹാശിന്റെ മകനായ ഹാനൂൻ
  rationale: പുത്രബന്ധം വ്യക്തമായി നിലനിർത്തുകയും പേരുകൾ മലയാളത്തിലെ സാധാരണ ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകുകയും ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: മുമ്പ് ലഭിച്ച ദയയ്ക്കുള്ള പരസ്പരപ്രതികരണമാണെന്ന് താരതമ്യം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: עָשָׂה ... חֶסֶד
  choice: ദയ കാണിച്ചു
  rationale: ഹീബ്രു ക്രിയാസംയോജനത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: לְנַחֲמוֹ
  choice: അവനെ ആശ്വസിപ്പിക്കാൻ
  rationale: വിയോഗസന്ദർഭത്തിൽ ആശ്വാസം നൽകുക, അനുശോചനം അറിയിക്കുക എന്ന അർഥമുള്ള പ്രയോഗമാണിത്; ‘ആശ്വസിപ്പിക്കാൻ’ മൂലപദത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
- source_word: אֶל אָבִיו
  choice: അവന്റെ അപ്പനെച്ചൊല്ലി
  rationale: ഹാനൂന്റെ അപ്പന്റെ മരണവുമായി ബന്ധപ്പെട്ട ആശ്വാസമാണെന്ന ബന്ധം വ്യക്തമാക്കുന്നു; മരണം എന്ന് മുഖ്യവാചകത്തിൽ നേരിട്ട് ചേർത്ത് മൂലത്തേക്കാൾ വിശദീകരിക്കുന്നില്ല.
- source_word: בְּיַד עֲבָדָיו
  choice: തന്റെ ദാസന്മാരെ അയച്ചു
  rationale: ‘ദാസന്മാരുടെ കൈയാൽ’ എന്ന ഹീബ്രു ശൈലി ഇവിടെ അവരുടെ മുഖാന്തരം ദൗത്യം നിർവഹിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ദാസന്മാരെയാണ് അയച്ചതെന്ന് തുടർന്നുള്ള വാക്യം വ്യക്തമാക്കുന്നതിനാൽ ഈ മലയാളരൂപം സ്വാഭാവികമായി അതേ ആശയം നൽകുന്നു.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ ദേശം
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥത്തിനുപകരം ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന മലയാളത്തിലെ പതിവായ രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അപ്പൻ’ എന്ന പദം സന്ദർഭത്തിൽ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് എളുപ്പവുമാണ്. ഹീബ്രുവിലെ ആവർത്തനവും പരസ്പരദയയുടെ ആശയവും നിലനിർത്തി; വിയോഗസന്ദർഭം മുഖ്യവാചകത്തിൽ അനാവശ്യമായി വിശദീകരിക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
