  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗ד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר אֶת הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֖א חֵלָ֑אמָ/ה וַ/יַּעַרְכ֤וּ אֲרָם֙ לִ/קְרַ֣את דָּוִ֔ד וַ/יִּלָּחֲמ֖וּ עִמּֽ/וֹס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
translation:
  language: ml
  text: ദാവീദിന് വിവരം ലഭിച്ചപ്പോൾ, അവൻ ഇസ്രായേലിനെ മുഴുവൻ ഒരുമിച്ചുകൂട്ടി യോർദ്ദാൻ കടന്ന് ഹേലാമിൽ എത്തി. അരാമ്യർ ദാവീദിനെ നേരിടാൻ യുദ്ധനിരയൊരുക്കി അവനോടു യുദ്ധം ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെതിരെ യുദ്ധം ചെയ്തു.’ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവനോടു യുദ്ധം ചെയ്തു’ എന്നാണ്; ഇവിടെ അത് ഒരു എതിരാളിയുമായി യുദ്ധത്തിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: ദാവീദിന് വിവരം ലഭിച്ചപ്പോൾ
  rationale: ആരാണ് വിവരം അറിയിച്ചതെന്ന് വ്യക്തമാക്കാത്ത എബ്രായ നിഷ്ക്രിയപ്രയോഗം നിലനിർത്തുന്നു; തുടക്കത്തിലെ വാവ് സൂചിപ്പിക്കുന്ന ആഖ്യാനബന്ധം ‘ലഭിച്ചപ്പോൾ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: അവൻ ഇസ്രായേലിനെ മുഴുവൻ ഒരുമിച്ചുകൂട്ടി
  rationale: אָסַף എന്നതിന്റെ ‘കൂട്ടിച്ചേർക്കുക/ഒരുമിച്ചുകൂട്ടുക’ എന്ന അർഥം നൽകുന്നു. മൂലപാഠത്തിൽ ‘സൈന്യം’ ഇല്ലാത്തതിനാൽ അത് ചേർക്കാതെ ‘ഇസ്രായേൽ’ എന്ന സമൂഹവാചകത്തെ നിലനിർത്തുന്നു.
- source_word: וַיַּעֲבֹר אֶת הַיַּרְדֵּן
  choice: യോർദ്ദാൻ കടന്ന്
  rationale: നദി കടക്കുക എന്ന עָבַר എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ, സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: וַיָּבֹא חֵלָמָה
  choice: ഹേലാമിൽ എത്തി
  rationale: חֵלָמָה എന്നതിലെ ദിശാസൂചക പ്രത്യയം ഹേലാമിലേക്കുള്ള നീക്കത്തെയും അവിടെയെത്തിയതിനെയും ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּעַרְכוּ אֲרָם
  choice: അരാമ്യർ ... യുദ്ധനിരയൊരുക്കി
  rationale: സൈനികസന്ദർഭത്തിലെ עָרַךְ യുദ്ധത്തിനായി അണിനിരത്തുക എന്നർഥം നൽകുന്നു. എബ്രായത്തിലെ ‘അരാം’ എന്ന സമൂഹവാചകം സ്വാഭാവിക മലയാളത്തിൽ ജനവിഭാഗസൂചക ബഹുവചനമായ ‘അരാമ്യർ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: לִקְרַאת דָּוִד
  choice: ദാവീദിനെ നേരിടാൻ
  rationale: לִקְרַאת എന്നതിന്റെ ‘നേരിടാൻ/എതിരേ ചെന്നുകാണാൻ’ എന്ന ദിശാപരമായ അർഥവും യുദ്ധസന്ദർഭത്തിലെ ശത്രുതാഭാവവും അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ നൽകുന്നു.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: അവനോടു യുദ്ധം ചെയ്തു
  rationale: עִם എന്ന ‘കൂടെ/ഒപ്പം’ ബന്ധപദമുള്ള എബ്രായപ്രയോഗത്തിന്റെ രൂപസാന്നിധ്യം നിലനിർത്തുന്നു; യുദ്ധസന്ദർഭത്തിൽ ഇത് അവനെ എതിരാളിയായി നേരിട്ടു പോരാടിയെന്ന അർഥമാണ് നൽകുന്നത്.
