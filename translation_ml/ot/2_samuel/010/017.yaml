translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമം ‘ഹേലാം’ എന്നും നദിനാമം ‘യോർദ്ദാൻ’ എന്നും ലിപ്യന്തരിച്ചു. ഇംഗ്ലീഷ് പാഠത്തിൽ [a] ദാവീദിന്റെ പേരിനുശേഷം കാണുന്നുവെങ്കിലും അടിക്കുറിപ്പിന്റെ വിഷയം അവസാനത്തെ ‘യുദ്ധം ചെയ്തു’ എന്ന പ്രയോഗമായതിനാൽ, അർഥബന്ധം വ്യക്തമാക്കാൻ ചിഹ്നം അതേ പ്രയോഗത്തിനുശേഷം വെച്ചു.
