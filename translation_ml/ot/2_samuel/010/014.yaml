  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അമ്മോന്റെ മക്കൾ’ എന്ന മൂലഭാഷയിലെ ബന്ധുത്വപ്രയോഗവും ‘അരാം’ എന്ന പുരാതന നാമവും നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദരൂപം ആവുന്നിടത്ത് സൈനികസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കി.
