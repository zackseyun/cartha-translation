source:
  edition: WLC
  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנֻ֨סוּ֙ מִ/פְּנֵ֣י אֲבִישַׁ֔י וַ/יָּבֹ֖אוּ הָ/עִ֑יר וַ/יָּ֣שָׁב יוֹאָ֗ב מֵ/עַל֙ בְּנֵ֣י עַמּ֔וֹן וַ/יָּבֹ֖א יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/014.yaml
  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
translation:
  language: ml
  text: അമ്മോന്റെ മക്കൾ[a] അരാം[b] ഓടിപ്പോയെന്ന് കണ്ടപ്പോൾ, അവർ അബീശായിയുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി നഗരത്തിലേക്കു കടന്നു. തുടർന്ന് യോവാബ് അമ്മോന്റെ മക്കളോടുള്ള പോരാട്ടത്തിൽനിന്ന് പിന്മാറി[c] യെരൂശലേമിലേക്കു വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അമ്മോന്യർ.’ അക്ഷരാർഥത്തിൽ ‘അമ്മോന്റെ മക്കൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അരാമ്യർ’; എബ്രായത്തിൽ ‘അരാം.’
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത് യോവാബ് അമ്മോന്യർക്കെതിരായ പോരാട്ടം അവസാനിപ്പിച്ച് പിന്മാറിയെന്നാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: അമ്മോന്റെ മക്കൾ
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന എബ്രായ ബന്ധുത്വപ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് അമ്മോന്യജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: רָאוּ כִּי נָס
  choice: ഓടിപ്പോയതായി കണ്ടപ്പോൾ
  rationale: അവർ കണ്ടറിഞ്ഞ കാര്യമായി ഉപവാക്യം അവതരിപ്പിക്കുകയും, അരാമിന്റെ പിന്മാറ്റം അതിനു മുമ്പ് സംഭവിച്ചതാണെന്ന ആഖ്യാനക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: എബ്രായത്തിലെ ദേശ/ജനനാമം അതേപടി നിലനിർത്തുന്നു; ഇവിടെ അത് അരാമ്യസൈന്യത്തെ കൂട്ടമായി സൂചിപ്പിക്കാം. കാലവിരുദ്ധമായ ‘സിറിയ’ ഒഴിവാക്കുന്നു.
- source_word: וַיָּנֻסוּ מִפְּנֵי אֲבִישַׁי
  choice: അബീശായിയുടെ മുമ്പിൽനിന്ന് ഓടി
  rationale: מִפְּנֵי എന്നതിന്റെ ‘മുമ്പിൽനിന്ന്/സന്നിധിയിൽനിന്ന്’ എന്ന രൂപവും സൈനിക പിന്മാറ്റത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: നഗരത്തിൽ കടന്നു
  rationale: കോട്ടയുള്ള നഗരത്തിനകത്തേക്കുള്ള ചലനം സ്വാഭാവികമായി നൽകുന്നു; നിർദ്ദിഷ്ടത ‘നഗരം’ എന്ന രൂപത്തിൽ നിലനിൽക്കുന്നു.
- source_word: וַיָּשָׁב יוֹאָב מֵעַל בְּנֵי עַמּוֹן
  choice: യോവാബ് അമ്മോന്റെ മക്കളോടുള്ള പോരാട്ടത്തിൽനിന്ന് പിന്മാറി
  rationale: മֵעַל എന്നതിന്റെ ശത്രുസേനയ്‌ക്കെതിരായ നീക്കത്തിൽനിന്നു മാറുക എന്ന സൈനികസന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവികമായ ‘അവരുടെ മേൽനിന്ന് മടങ്ങി’ ഒഴിവാക്കുന്നു.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: യെരൂശലേമിലേക്കു വന്നു
  rationale: בוא എന്ന സാധാരണ ചലനക്രിയയെ ആഖ്യാനത്തിന്റെ ദൃഷ്ടികോണത്തിന് യോജിച്ചവിധം നൽകുന്നു; രണ്ടാമതും ‘മടങ്ങി’ എന്നു ചേർത്ത് മൂലത്തിൽ ഇല്ലാത്ത ആവർത്തനം സൃഷ്ടിക്കുന്നില്ല.
