id: 2SA.10.10
reference: 2 Samuel 10:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַֽ/יַּעֲרֹ֕ךְ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/010.yaml
  text: And the rest of the people he put under the command of Abishai his brother[c][b][a], and he drew them up to meet the sons of Ammon.
translation:
  language: ml
  text: ശേഷിച്ച ജനത്തെ അവൻ തന്റെ സഹോദരനായ അബീശായിയുടെ കൈയിൽ ഏല്പിച്ചു[b]. അമ്മോന്റെ പുത്രന്മാരെ[a] നേരിടാൻ അവൻ അവരെ യുദ്ധനിരയിൽ അണിനിരത്തി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘അമ്മോന്യർ.’ എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അമ്മോന്റെ പുത്രന്മാർ.’'
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘അബീശായിയുടെ കൈയിൽ കൊടുത്തു’; സൈനികരെ അവന്റെ അധികാരത്തിലും നേതൃത്വത്തിലും ഏല്പിച്ചു എന്നർഥമുള്ള ശൈലിയാണിത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘അവരെ ക്രമപ്പെടുത്തി’ / ‘യുദ്ധനിര ഒരുക്കി.’ എബ്രായക്രിയ സൈനികരെ യുദ്ധക്രമത്തിൽ നിരത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: ശേഷിച്ച ജനം
  rationale: יֶתֶר എന്നത് ശേഷിച്ച ഭാഗത്തെയും הָעָם അക്ഷരാർഥത്തിൽ ജനത്തെയും സൂചിപ്പിക്കുന്നു; സൈനികസന്ദർഭത്തിൽ ഇത് ശേഷിച്ച പോരാളികളാണ്. മൂലഭാഷയുടെ രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന പ്രയോഗമാണിത്.
- source_word: נָתַן בְּיַד
  choice: കൈയിൽ ഏല്പിച്ചു
  rationale: ‘കൈയിൽ കൊടുത്തു’ എന്ന എബ്രായ ശൈലി ഒരാളുടെ അധികാരത്തിലോ ചുമതലയിലോ ഏല്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കൈയിൽ ഏല്പിച്ചു’ എന്നത് ആ രൂപകവും സൈനികനേതൃത്വത്തിന്റെ ആശയവും നിലനിർത്തുന്നു.
- source_word: אַבְשַׁי
  choice: അബീശായി
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സാധാരണ ബൈബിൾ ലിപ്യന്തരണരീതിക്കനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: אָחִיו
  choice: തന്റെ സഹോദരനായ
  rationale: എബ്രായപദത്തിലെ ബന്ധസൂചന വ്യക്തമായി നിലനിർത്തുകയും അബീശായി ആരുടെ സഹോദരനാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּעֲרֹךְ
  choice: യുദ്ധനിരയിൽ അണിനിരത്തി
  rationale: ערך എന്ന ക്രിയ സൈനികസന്ദർഭത്തിൽ സൈന്യത്തെ യുദ്ധത്തിനായി നിരത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘ക്രമപ്പെടുത്തി’ എന്നതിനെക്കാൾ ഈ പരിഭാഷ സന്ദർഭസൂചന കൃത്യമായി നൽകുന്നു.
- source_word: לִקְרַאת
  choice: നേരിടാൻ
  rationale: ലക്ഷ്യമാക്കി ചെന്നുകാണുക അഥവാ അഭിമുഖീകരിക്കുക എന്ന അടിസ്ഥാനാർഥം ഇവിടെ യുദ്ധസന്ദർഭത്തിൽ ശത്രുവിനെ നേരിടുന്നതായി സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്റെ പുത്രന്മാർ
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന മൂലഭാഷയിലെ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ ജനവിഭാഗനാമം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: וַיַּעֲרֹךְ എന്ന ക്രിയയുടെ കർത്താവ്
  choice: ‘അവൻ’ എന്ന സർവനാമം നിലനിർത്തി
  alternative: ‘അബീശായി’ എന്ന് വ്യക്തമായി ചേർക്കുക
  rationale: എബ്രായപാഠത്തിൽ കർത്താവ് സർവനാമരൂപത്തിൽ മാത്രമാണ് സൂചിപ്പിച്ചിരിക്കുന്നത്. സന്ദർഭത്തിൽ അബീശായി ആയിരിക്കാനാണ് കൂടുതൽ സാധ്യതയെങ്കിലും, പേര് ചേർത്ത് മൂലപാഠത്തിലെ ചെറിയ വ്യാകരണാത്മക അവ്യക്തത പരിഹരിക്കാതിരിക്കാൻ ‘അവൻ’ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യം ഉപയോഗിച്ചു. ‘കൈയിൽ ഏല്പിച്ചു’ എന്ന പരിചിതമായ ശൈലി മൂലപാഠത്തിലെ രൂപകത്തെയും അധികാരത്തിന്റെ ആശയത്തെയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു. യുദ്ധസന്ദർഭം വ്യക്തമാക്കാൻ ‘യുദ്ധനിരയിൽ അണിനിരത്തി’ ഉപയോഗിച്ചു; കർത്താവിനെ അനാവശ്യമായി നിർണ്ണയിക്കാതിരിക്കാൻ രണ്ടാമത്തെ വാക്യത്തിൽ ‘അവൻ’ നിലനിർത്തി.
