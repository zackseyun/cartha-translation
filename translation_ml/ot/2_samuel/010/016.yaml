  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി. മൂലത്തിലെ കാരണാർഥവും ‘നദി,’ ‘അവരുടെ മുമ്പിൽ’ എന്നീ യഥാർഥ അസ്പഷ്ടതകളും നിലനിർത്തി.
