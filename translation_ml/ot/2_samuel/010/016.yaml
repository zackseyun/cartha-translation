  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
translation:
  language: ml
  text: ഹദദേസെർ ആളയച്ച് നദിക്കപ്പുറത്തുനിന്നുള്ള[a] അരാമ്യരെ പുറത്തേക്കു കൊണ്ടുവന്നു; അവർ ഹേലാമിൽ എത്തി. ഹദദേസെരിന്റെ സൈന്യാധിപനായ ശോബക്ക്[b] അവരുടെ മുമ്പിൽ[c] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, യൂഫ്രട്ടീസ് നദിക്കപ്പുറത്തുനിന്ന്.
    reason: cultural_note
  - marker: b
    text: ഈ പേര് ‘ശോബാക്ക്’ എന്നും ലിപ്യന്തരണം ചെയ്യാറുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: ‘അവരുടെ മുമ്പിൽ’ എന്നത്, അദ്ദേഹം അവരെ നയിച്ചുകൊണ്ട് അവരുടെ മുൻനിരയിൽ ഉണ്ടായിരുന്നുവെന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ച്
  rationale: שלח എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തുന്നു; തുടർന്നുള്ള പ്രവർത്തനവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וַיֹּצֵא אֶת אֲרָם
  choice: അരാമ്യരെ പുറപ്പെടുവിച്ചു
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം സംരക്ഷിക്കുന്നു; യുദ്ധത്തിനായി അവരെ പുറത്തേക്കു കൊണ്ടുവന്നുവെന്ന ആശയം നൽകുന്നു.
- source_word: אֲרָם
  choice: അരാമ്യർ
  rationale: ഇവിടെ പ്രദേശത്തേക്കാൾ അരാമ്യ ജനത്തെയോ സൈനികരെയോ സൂചിപ്പിക്കുന്നതിനാൽ ജനനാമം ഉപയോഗിച്ചു.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: നദിക്കപ്പുറത്തുണ്ടായിരുന്ന
  rationale: എബ്രായത്തിലെ ‘നദിക്കപ്പുറം’ എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; നദി യൂഫ്രട്ടീസ് ആണെന്ന തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיָּבֹאוּ חֵילָם
  choice: അവർ ഹേലാമിൽ എത്തി
  rationale: חֵילָם സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്യുകയും בוא എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപമായ ‘എത്തി’ ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: וְשׁוֹבַךְ
  choice: ശോബക്ക്
  rationale: മസോററ്റിക് വ്യഞ്ജനരൂപത്തോട് അടുത്ത ലിപ്യന്തരണം; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: שַׂר צְבָא
  choice: സൈന്യാധിപൻ
  rationale: സൈനിക നേതൃത്വത്തെ വ്യക്തവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പിൽ
  rationale: അക്ഷരാർഥത്തിലെ സ്ഥലസംബന്ധമായ അസ്പഷ്ടത നിലനിർത്തുന്നു; സൈനികസന്ദർഭത്തിൽ അതിന്റെ സാധ്യതയുള്ള നേതൃത്വാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
