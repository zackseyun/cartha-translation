source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ שָׂרֵ֨י בְנֵֽי עַמּ֜וֹן אֶל חָנ֣וּן אֲדֹֽנֵי/הֶ֗ם הַֽ/מְכַבֵּ֨ד דָּוִ֤ד אֶת אָבִ֨י/ךָ֙ בְּ/עֵינֶ֔י/ךָ כִּֽי שָׁלַ֥ח לְ/ךָ֖ מְנַֽחֲמִ֑ים הֲ֠/לוֹא בַּ/עֲב֞וּר חֲק֤וֹר אֶת הָ/עִיר֙ וּ/לְ/רַגְּלָ֣/הּ וּ/לְ/הָפְכָ֔/הּ שָׁלַ֥ח דָּוִ֛ד אֶת עֲבָדָ֖י/ו אֵלֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
translation:
  language: ml
  text: 'അമ്മോന്യരുടെ പ്രഭുക്കന്മാർ തങ്ങളുടെ അധിപനായ ഹാനൂനോടു പറഞ്ഞു: “ദാവീദ് നിന്റെ പിതാവിനെ ആദരിക്കുന്നതിനാലാണോ നിന്റെ അടുക്കൽ ആശ്വാസദൂതന്മാരെ അയച്ചതെന്ന് നീ കരുതുന്നത്?[a][b] നഗരം പരിശോധിക്കാനും അതിനെ ഒറ്റുനോക്കാനും അതിനെ മറിച്ചിടാനുമല്ലേ ദാവീദ് തന്റെ സേവകരെ നിന്റെ അടുക്കൽ അയച്ചത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “നിന്റെ കണ്ണുകളിൽ ദാവീദ് നിന്റെ പിതാവിനെ ആദരിക്കുന്നുവോ?”'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ആശ്വാസദൂതന്മാർ” എന്നു പറയുന്നത് പിതാവിന്റെ മരണത്തെത്തുടർന്ന് ഹാനൂനെ അനുശോചനം അറിയിക്കാനും ആശ്വസിപ്പിക്കാനും അയച്ച ദൂതന്മാരെയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ പ്രഭുക്കന്മാർ
  rationale: ശָׂרִים എന്നത് രാജസഭാ-രാഷ്ട്രീയ പശ്ചാത്തലത്തിൽ പ്രഭുക്കന്മാർ, അധികാരികൾ, നേതാക്കൾ എന്നിവരെ സൂചിപ്പിക്കാം; ‘പ്രഭുക്കന്മാർ’ പദവിയും പശ്ചാത്തലവും നിലനിർത്തുന്നു.
- source_word: אֲדֹנֵיהֶם
  choice: തങ്ങളുടെ യജമാനനായ
  rationale: ഇവിടെ אֲדֹנִים ദൈവിക നാമമല്ല, മനുഷ്യാധികാരിയുടെ പദവിയാണ്; ‘യജമാനൻ’ അധീനതയും അധികാരബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: הַמְכַבֵּד ... בְּעֵינֶיךָ
  choice: ആദരിക്കുന്നതുകൊണ്ടാണെന്നാണോ നീ കരുതുന്നത്?
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘നിന്റെ കണ്ണുകളിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം ‘നിന്റെ വിലയിരുത്തലിൽ/നീ കരുതുന്നതുപോലെ’ എന്നാണ്. സ്വാഭാവിക മലയാളത്തിൽ സംശയഭരിതമായ ചോദ്യം നിലനിർത്തുന്നു.
- source_word: מְנַחֲמִים
  choice: ആശ്വസിപ്പിക്കുന്നവരെ
  rationale: പിതാവിന്റെ മരണത്തെത്തുടർന്ന് ഹാനൂനെ ആശ്വസിപ്പിക്കാൻ അയച്ച ആളുകളെയാണ് പങ്കാളിവാചക രൂപം സൂചിപ്പിക്കുന്നത്; പാഠത്തിലെ രൂപം സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: הֲלוֹא
  choice: അല്ലേ
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന ആരോപണാത്മക ആലങ്കാരിക ചോദ്യം മലയാളത്തിലെ ‘അല്ലേ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חֲקוֹר אֶת הָעִיר
  choice: നഗരം പരിശോധിക്കാനും
  rationale: חקר സമഗ്രമായി അന്വേഷിക്കുക, പരിശോധിക്കുക എന്നർഥം നൽകുന്നു; സൈനിക സംശയത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘പരിശോധിക്കുക’ യോജിക്കുന്നു.
- source_word: וּלְרַגְּלָהּ
  choice: അതിനെ ചാരനിരീക്ഷണം നടത്താനും
  rationale: רגל എന്ന പീയേൽ രൂപം രഹസ്യമായി നിരീക്ഷിക്കുക/ചാരപ്രവർത്തനം നടത്തുക എന്ന ആശയം നൽകുന്നു; നഗരത്തെ സംബന്ധിച്ച പ്രത്യയം ‘അതിനെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וּלְהָפְכָהּ
  choice: അതിനെ കീഴടക്കാനും
  rationale: הפך എന്നതിന് മറിച്ചിടുക, തകർക്കുക, അട്ടിമറിക്കുക എന്നീ സാധ്യതകളുണ്ട്; ശത്രുതാപരമായ സൈനിക സന്ദർഭത്തിൽ ‘കീഴടക്കുക’ ഉദ്ദേശിച്ച രാഷ്ട്രീയ-സൈനിക പരാജയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עֲבָדָיו
  choice: തന്റെ സേവകരെ
  rationale: ദാവീദിന്റെ രാജദൂതന്മാരെയാണ് עֲבָדָיו സൂചിപ്പിക്കുന്നത്; ‘സേവകർ’ അടിസ്ഥാനാർഥവും രാജകീയ സേവനബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപദേശകരുടെ രാഷ്ട്രീയ സംശയം സത്യവിവരണമായി തോന്നിപ്പിക്കാതിരിക്കുക
  choice: രണ്ടു ആലങ്കാരിക ചോദ്യങ്ങളായിത്തന്നെ ആരോപണം അവതരിപ്പിച്ചു.
  alternative: ദാവീദ് യഥാർഥത്തിൽ ചാരപ്രവർത്തനത്തിനാണ് ആളുകളെ അയച്ചതെന്ന ഉറച്ച പ്രസ്താവനയായി വിവർത്തനം ചെയ്യുക.
  rationale: ഇത് അമ്മോന്യപ്രഭുക്കന്മാരുടെ ആരോപണമാണ്; ആ ആരോപണം സത്യമാണെന്ന് ആഖ്യാതാവ് അംഗീകരിക്കുന്നില്ല. ചോദ്യരൂപം ഈ വ്യത്യാസവും പാഠത്തിലെ സംഘർഷവും സംരക്ഷിക്കുന്നു.
- issue: בְּעֵינֶיךָ എന്ന പ്രയോഗത്തിലെ അർഥസാധ്യത
  choice: മുഖ്യപാഠത്തിൽ ‘എന്നാണോ നീ കരുതുന്നത്?’ എന്ന് സന്ദർഭാർഥം നൽകി, അക്ഷരസമീപമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
  alternative: ‘നിന്റെ കണ്ണുകളിൽ’ അല്ലെങ്കിൽ ‘നിന്റെ ദൃഷ്ടിയിൽ’ എന്നു നേരിട്ട് നൽകുക.
  rationale: ഹീബ്രു ഭാഷാശൈലിയുടെ അർഥം സാധാരണ മലയാളവായനക്കാരന് വ്യക്തമായി നൽകുമ്പോഴും ഉറവിടരൂപം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പ്രഭുക്കന്മാർ’, ‘യജമാനൻ’, ‘സേവകർ’ എന്നിവ രാജകീയ-രാഷ്ട്രീയ പശ്ചാത്തലം നിലനിർത്തുന്നു. ചോദ്യം ആരോപണാത്മകമാണെങ്കിലും ആഖ്യാതാവിന്റെ വിധിയായി മാറാതിരിക്കാൻ വാക്യഘടന ശ്രദ്ധിച്ചു.
