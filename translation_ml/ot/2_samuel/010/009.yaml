  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֤ה אֵלָי/ו֙ פְּנֵ֣י הַ/מִּלְחָמָ֔ה מִ/פָּנִ֖ים וּ/מֵֽ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כֹּל֙ בְּחוּרֵ֣י ב/ישראל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
translation:
  language: ml
  text: യുദ്ധനിര മുന്നിലും പിന്നിലും തനിക്കെതിരെ നിലയുറപ്പിച്ചിരുന്നതു യോവാബ് കണ്ടപ്പോൾ, ഇസ്രായേലിലെ സകല മികച്ച യോദ്ധാക്കളിൽനിന്നും ചിലരെ തിരഞ്ഞെടുത്ത്[a] അരാമിനെ[b] നേരിടാൻ അണിനിരത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാനുസൃതമായി: ‘ഇസ്രായേലിലെ തിരഞ്ഞെടുക്കപ്പെട്ട സകല യോദ്ധാക്കളിൽനിന്നും തിരഞ്ഞെടുത്തു.’'
    reason: lexical_alternative
  - marker: b
    text: ‘അരാം’ ഇവിടെ അരാമ്യസൈന്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; ഇവിടെ യുദ്ധസാഹചര്യം തിരിച്ചറിഞ്ഞതും സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുന്നു.
- source_word: פְּנֵי הַמִּלְחָמָה
  choice: യുദ്ധനിര
  rationale: അക്ഷരാർഥത്തിൽ ‘യുദ്ധത്തിന്റെ മുഖം’; സൈനികസന്ദർഭത്തിൽ എതിരായി നിലകൊള്ളുന്ന യുദ്ധമുഖത്തെയോ യുദ്ധനിരയെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: הָיְתָה אֵלָיו
  choice: തനിക്കെതിരെ നിലയുറപ്പിച്ചിരിക്കുന്നതു
  rationale: യുദ്ധനിര യോവാബിനെതിരെ സ്ഥാനം പിടിച്ചിരുന്ന സൈനികസാഹചര്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִפָּנִים וּמֵאָחוֹר
  choice: മുന്നിലും പിന്നിലും
  rationale: രണ്ടു വശത്തുനിന്നുള്ള ഭീഷണിയെ സൂചിപ്പിക്കുന്ന എബ്രായത്തിലെ സ്ഥലപരമായ വൈരുധ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ സകല മികച്ച യോദ്ധാക്കളിൽനിന്നും ചിലരെ തിരഞ്ഞെടുത്ത്
  rationale: מִכֹּל എന്ന ‘സകലരിൽനിന്നും’ എന്ന ആശയവും בְּחוּרֵי എന്ന തിരഞ്ഞെടുക്കപ്പെട്ട/മികച്ച പോരാളികൾ എന്ന അർഥവും നിലനിർത്തുന്നു; മലയാളത്തിൽ കർമം വ്യക്തമാകാൻ ‘ചിലരെ’ ചേർത്തിരിക്കുന്നു.
- source_word: וַיַּעֲרֹךְ
  choice: അണിനിരത്തി
  rationale: സൈനികരെ യുദ്ധക്രമത്തിൽ നിരത്തുക എന്ന ערך എന്ന ക്രിയയുടെ സൈനികാർഥം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לִקְרַאת אֲרָם
  choice: അരാമിനെ നേരിടാൻ
  rationale: לקראת എന്നതിന്റെ ‘നേരിടുക/എതിരേ ചെല്ലുക’ എന്ന സൈനികസന്ദർഭത്തിലെ അർഥം നൽകുകയും അരാം എന്ന സ്ഥലനാമം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: പിന്നീടുള്ള ഭൂമിശാസ്ത്രനാമം പകരംവയ്ക്കാതെ എബ്രായത്തിലെ പേരിന്റെ ലിപ്യന്തരണം നിലനിർത്തുന്നു; ഇവിടെ അത് അരാമ്യസൈന്യത്തെ കൂട്ടായ നിലയിൽ സൂചിപ്പിക്കുന്നു.
