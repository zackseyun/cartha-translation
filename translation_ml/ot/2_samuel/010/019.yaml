source:
  edition: WLC
  text: וַ/יִּרְא֨וּ כָֽל הַ/מְּלָכִ֜ים עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥מוּ אֶת יִשְׂרָאֵ֖ל וַ/יַּֽעַבְד֑וּ/ם וַ/יִּֽרְא֣וּ אֲרָ֔ם לְ/הוֹשִׁ֥יעַ ע֖וֹד אֶת בְּנֵ֥י עַמּֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/019.yaml
  text: When all the kings who were servants of Hadadezer saw that they had been defeated before Israel, they made peace with Israel and served them. So Aram was afraid to save the sons of Ammon anymore.
translation:
  language: ml
  text: ഹദദേസെരിന്റെ സേവകരായിരുന്ന സകല രാജാക്കന്മാരും തങ്ങൾ ഇസ്രായേലിന്റെ മുമ്പിൽ തോറ്റുപോയെന്നു കണ്ടപ്പോൾ, അവർ ഇസ്രായേലുമായി സമാധാനം ചെയ്തു ഇസ്രായേലിനെ സേവിച്ചു. അങ്ങനെ അരാം അമ്മോന്യരെ ഇനി രക്ഷിക്കാൻ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי הֲדַדְעֶזֶר
  choice: ഹദദേസെരിന്റെ സേവകരായിരുന്ന
  rationale: രാജാക്കന്മാർ ഹദദേസെരിന് കീഴടങ്ങിയവരോ അധീനരാജാക്കന്മാരോ ആയിരുന്നെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נִגְּפוּ לִפְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മുമ്പിൽ തോറ്റുപോയി
  rationale: യുദ്ധത്തിൽ പരാജയപ്പെട്ടു എന്ന നിഷ്ക്രിയ ക്രിയയുടെ അർഥവും ‘മുമ്പിൽ’ എന്ന ഉറവിടപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: וַיַּשְׁלִמוּ אֶת־יִשְׂרָאֵל
  choice: ഇസ്രായേലുമായി സമാധാനം ചെയ്തു
  rationale: ഹിഫീൽ പ്രയോഗം ഇവിടെ സമാധാനബന്ധം സ്ഥാപിച്ചതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പതിവായ പ്രയോഗമാണിത്.
- source_word: וַיַּעַבְדוּם
  choice: അവരെ സേവിച്ചു
  rationale: പ്രത്യയം ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന ബഹുവചനമായി അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְהוֹשִׁיעַ
  choice: സഹായിക്കാൻ
  rationale: അടിസ്ഥാന അർഥം ‘രക്ഷിക്കുക’ ആണെങ്കിലും സൈനിക സഖ്യസന്ദർഭത്തിൽ അമ്മോന്യരുടെ രക്ഷയ്ക്കെത്തുക/സഹായിക്കുക എന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരെ
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന ജനവിഭാഗനാമം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘അമ്മോന്യർ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: לְהוֹשִׁיעַ എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: സഹായിക്കാൻ
  alternative: രക്ഷിക്കാൻ
  rationale: ഇവിടെ ദൈവിക രക്ഷ എന്ന സാങ്കേതിക ആശയമല്ല, അരാമ്യർ അമ്മോന്യർക്കു നൽകിയ സൈനികസഹായമാണ് സന്ദർഭം; അതിനാൽ ‘സഹായിക്കാൻ’ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു, എന്നാൽ രക്ഷയ്ക്കെത്തുക എന്ന മൂലധ്വനി സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പേരുകൾ ‘ഹദദേസെർ’, ‘ഇസ്രായേൽ’, ‘അരാമ്യർ’, ‘അമ്മോന്യർ’ എന്ന പ്രചാരത്തിലുള്ള ബൈബിൾ രൂപങ്ങളിൽ നൽകി. ഹീബ്രുവിലെ കാരണ/ഫലബന്ധമുള്ള അവസാന വാക്യം ‘അതിനുശേഷം’ എന്ന സ്വാഭാവിക ബന്ധകത്തോടെ അവതരിപ്പിച്ചു.
