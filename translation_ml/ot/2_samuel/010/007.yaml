lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ദാവീദ് അതു കേട്ടപ്പോൾ
  rationale: ശׁמע എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കേൾക്കുക’ എന്നാണ്. തുടർച്ചയായ സംഭവക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘കേട്ടപ്പോൾ’ എന്നു നൽകി. എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻസന്ദർഭത്തിലേക്കുള്ള സൂചന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘അതു’ ചേർത്തു.
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: שׁלח എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള തുല്യപദം.
- source_word: אֶת יוֹאָב
  choice: യോവാബിനെയും
  rationale: നേരിട്ടുള്ള കർമസൂചകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തുന്നില്ല; മലയാളത്തിലെ സംയുക്ത കർമഘടനയ്ക്കനുസരിച്ച് പേരിനോട് ‘-നെയും’ ചേർത്തു.
- source_word: וְאֵת כָּל הַצָּבָא
  choice: മുഴുവൻ സൈന്യത്തെയും
  rationale: צָבָא ഇവിടെ സൈനികസേനയെ സൂചിപ്പിക്കുന്നു; כָּל എന്നതിന് ‘മുഴുവൻ’ സ്വാഭാവികവും സമഗ്രത വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: הַגִּבֹּרִים
  choice: വീരന്മാരടങ്ങിയ
  rationale: גִּבּוֹרִים എന്നത് ശക്തരായ യോദ്ധാക്കളെയോ വീരന്മാരെയോ സൂചിപ്പിക്കുന്നു. ‘വീരന്മാരടങ്ങിയ’ എന്ന പ്രയോഗം സൈന്യത്തോടുള്ള നിർദേശകബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഇത് പ്രത്യേക അഭിജാതസേനയാണെന്ന് അനാവശ്യമായി തീരുമാനിക്കുന്നില്ല.
