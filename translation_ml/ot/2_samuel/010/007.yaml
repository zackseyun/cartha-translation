    text: ‘യോവാബിനെയും മുഴുവൻ സൈന്യത്തെയും—വീരന്മാരെയും—അയച്ചു’ എന്നും വായിക്കാം. എബ്രായത്തിലെ ‘വീരന്മാർ’ ‘സൈന്യം’ എന്നതിന് സമാനാധികരണമായോ (‘സൈന്യം, അതായത് വീരന്മാർ’) അതിന്റെ ബന്ധക-നിർദേശമായോ (‘വീരന്മാരുടെ സൈന്യം’) മനസ്സിലാക്കാം.
