id: 2SA.10.12
reference: 2 Samuel 10:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: חֲזַ֤ק וְ/נִתְחַזַּק֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה יַעֲשֶׂ֥ה הַ/טּ֖וֹב בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: ml
  text: ധൈര്യമായിരിക്കൂ; നമ്മുടെ ജനത്തിനും നമ്മുടെ ദൈവത്തിന്റെ നഗരങ്ങൾക്കുവേണ്ടി നമുക്ക് ശക്തരായി നിൽക്കാം.[a] യഹോവ തന്റെ ദൃഷ്ടിയിൽ നല്ലത് ചെയ്യട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നമുക്ക് നമ്മുടെ കരുത്തു പ്രകടമാക്കാം’ അല്ലെങ്കിൽ ‘നമുക്ക് നമ്മെത്തന്നെ കരുത്തരാക്കാം.’ എബ്രായ ക്രിയയ്ക്ക് സ്വയം കരുത്താർജിക്കുക അഥവാ കരുത്തോടെ നിലകൊള്ളുക എന്ന പ്രതിഫലനഭാവമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘യഹോവ തന്റെ ദൃഷ്ടിയിൽ നല്ലത് ചെയ്യും.’ എബ്രായ ക്രിയാരൂപം ലളിതഭാവികാലമായും വായിക്കാം; ഇവിടെ യഹോവയുടെ ഇഷ്ടത്തിനു കീഴടങ്ങുന്ന ആശംസയായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: ധൈര്യമായിരിക്കുക
  rationale: חזק എന്ന ധാതുവിന്റെ കാൽ ആജ്ഞാരൂപം നേരിട്ടുള്ള പ്രോത്സാഹനമാണ്. യുദ്ധസന്ദർഭത്തിൽ ‘ധൈര്യമായിരിക്കുക’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: וְנִתְחַזַּק
  choice: നമുക്ക് കരുത്തരാകാം
  rationale: ഹിത്പയേൽ പ്രഥമപുരുഷ ബഹുവചന ആഹ്വാനരൂപത്തിലെ സ്വയം കരുത്താർജിക്കുന്ന ഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു; അതേസമയം മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: בְּעַד
  choice: വേണ്ടി
  rationale: ഇവിടെ ജനത്തെയും നഗരങ്ങളെയും സംരക്ഷിക്കുന്നതിനായി, അവരുടെ നന്മയ്ക്കായി പ്രവർത്തിക്കുക എന്ന അർഥമാണ്.
- source_word: עַמֵּנוּ
  choice: നമ്മുടെ ജനം
  rationale: עַם സാധാരണയായി ‘ജനം’ എന്നാണ്; അതിനെ ‘സൈന്യം’ എന്നു ചുരുക്കുന്നത് മൂലപാഠത്തേക്കാൾ നിർദിഷ്ടമാകും.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവത്തിന്റെ നഗരങ്ങൾ
  rationale: എബ്രായ സംയുക്തനാമഘടനയെ വ്യക്തമായും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יהוה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  choice: തന്റെ ദൃഷ്ടിയിൽ നല്ലതായതു ചെയ്യട്ടെ
  rationale: എബ്രായ ഭാഷാശൈലി നിലനിർത്തിക്കൊണ്ട്, ഫലം യഹോവയുടെ ഇഷ്ടത്തിനു സമർപ്പിക്കുന്ന ആശംസാഭാവത്തിൽ yiqtol രൂപം അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അത് പദവിനാമമായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: יַעֲשֶׂה എന്ന yiqtol രൂപത്തിന്റെ ഭാവം
  choice: ചെയ്യട്ടെ
  alternative: ചെയ്യും
  rationale: മുൻപുള്ള ആഹ്വാനങ്ങൾക്കുശേഷം ഇത് യഹോവയുടെ ഇഷ്ടത്തിനു ഫലം സമർപ്പിക്കുന്ന ആശംസയായി മനസ്സിലാക്കാം. എന്നാൽ ലളിതഭാവികാല വായനയും വ്യാകരണപരമായി സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. യുദ്ധസന്ദർഭം അനാവശ്യമായി വിശദീകരിക്കാതെ, ആജ്ഞയും കൂട്ടായ ആഹ്വാനവും തമ്മിലുള്ള വ്യത്യാസം സൂക്ഷിച്ചു. ‘തന്റെ ദൃഷ്ടിയിൽ നല്ലത്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും yiqtol രൂപത്തിന്റെ ഭാവി/ആശംസാ ദ്വയാർഥതയും നിലനിർത്തി.
