id: 2SA.10.13
reference: 2 Samuel 10:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגַּ֣שׁ יוֹאָ֗ב וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ לַ/מִּלְחָמָ֖ה בַּֽ/אֲרָ֑ם וַ/יָּנֻ֖סוּ מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/013.yaml
  text: Then Joab and the people who were with him advanced to battle against Aram[a], and they fled before him.
translation:
  language: ml
  text: അപ്പോൾ യോവാബും അവനോടുകൂടെ ഉണ്ടായിരുന്ന ജനവും അരാമിനെതിരെ[a] യുദ്ധത്തിന് മുന്നേറി; അവർ അവന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘അരാം’; ഇവിടെ ഉദ്ദേശിക്കുന്നത് അരാമ്യസൈന്യത്തെയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: മുന്നേറി
  rationale: നגשׁ എന്നത് അക്ഷരാർഥത്തിൽ ‘അടുത്തുചെന്നു/സമീപിച്ചു’ എന്നാണ്; എന്നാൽ לַמִּלְחָמָה എന്ന സൈനികസന്ദർഭത്തിൽ യുദ്ധത്തിൽ ഏർപ്പെടാൻ മുന്നോട്ടുനീങ്ങുന്നതാണ് ഉദ്ദേശ്യം. ‘മുന്നേറി’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന ജനവും
  rationale: עָם എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘ജനം’ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ അവർ യോവാബിന്റെ പോരാളികളാണെങ്കിലും ‘സൈന്യം’ എന്നു വ്യക്തമാക്കുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാകും.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധത്തിന്
  rationale: ലാമെദ് ഉപസർഗത്തോടുകൂടിയ מִלְחָמָה ഇവിടെ യുദ്ധത്തിലേക്കുള്ള നീക്കമോ യുദ്ധം ചെയ്യാനുള്ള ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു. ‘യുദ്ധത്തിന് മുന്നേറി’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: בַּאֲרָם
  choice: അരാമിനെതിരെ
  rationale: എബ്രായപാഠത്തിലെ സ്ഥല/ജനനാമമായ ‘അരാം’ നേരിട്ട് നിലനിർത്തുന്നു; בְּ എന്നത് ഈ യുദ്ധസന്ദർഭത്തിൽ എതിരാളിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘എതിരെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיָּנֻסוּ
  choice: അവർ ... ഓടിപ്പോയി
  rationale: נוּס എന്ന ക്രിയ ഭയന്നോ പരാജയപ്പെട്ടോ ‘ഓടിപ്പോകുക’ എന്ന ശക്തമായ അർഥം നൽകുന്നു. ‘പിൻവാങ്ങി’ എന്നു പറഞ്ഞാൽ ക്രമബദ്ധമായ സൈനികപിന്മാറ്റം എന്ന അധികസൂചന വരാം.
- source_word: מִפָּנָיו
  choice: അവന്റെ മുമ്പിൽനിന്ന്
  rationale: ‘അവന്റെ മുഖത്തുനിന്ന്/സന്നിധിയിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗത്തെ അടുത്തായി പിന്തുടരുന്നു. ഏകവചന പ്രത്യയം മുഖ്യകർത്താവായ യോവാബിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יוֹאָב
  choice: യോവാബ്
  rationale: പേരിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. എബ്രായത്തിന്റെ വാക്യഘടനയും സൈനികസന്ദർഭവും തമ്മിൽ തുലനം പാലിച്ചു; ‘ജനം’ എന്ന പൊതുപദം നിലനിർത്തുകയും അടിക്കുറിപ്പിലൂടെ ‘അരാം’ എന്നതിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ചെയ്തു.
