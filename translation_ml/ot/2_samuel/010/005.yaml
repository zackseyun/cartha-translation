base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
translation:
  language: ml
  text: 'അവർ ദാവീദിനെ അറിയിച്ചു; അവൻ അവരെ എതിരേൽക്കാൻ അയച്ചുവിട്ടു[a], കാരണം ആ പുരുഷന്മാർ അത്യന്തം അപമാനിതരായിരുന്നു. രാജാവ് പറഞ്ഞു: “നിങ്ങളുടെ താടികൾ വളരുന്നതുവരെ യെരീഹോവിൽ താമസിക്കുക; അതിനുശേഷം മടങ്ങിവരുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ, ‘അവരെ എതിരേൽക്കാൻ അവൻ അയച്ചു’ എന്നാണ്; ആരെയോ എന്തിനെയോ അയച്ചതെന്ന് പ്രത്യേകം പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: അവർ ദാവീദിനെ വിവരം അറിയിച്ചപ്പോൾ
  rationale: ഹിഫിൽ രൂപം ‘അറിയിക്കുക/വിവരം അറിയിക്കുക’ എന്നാണ്; കർത്താവ് എബ്രായത്തിൽ അനിശ്ചിതമായതിനാൽ ‘അവർ’ നിലനിർത്തുന്നു. തുടർന്നുള്ള സംഭവവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ കാലവാക്യരൂപം ഉപയോഗിച്ചു.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: അവൻ അവരെ എതിരേറ്റുകൊള്ളാൻ ആളയച്ചു
  rationale: അക്ഷരാർഥത്തിലെ ‘അവരെ എതിരേൽക്കാൻ അയച്ചു’ എന്ന ആശയം നിലനിർത്തുന്നു. മലയാളത്തിൽ അയയ്ക്കപ്പെട്ട വ്യക്തിയെ പറയാതെ പ്രയോഗം അപൂർണ്ണമായി തോന്നുന്നതിനാൽ ‘ആളയച്ചു’ എന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കി; ‘ദൂതന്മാർ’ എന്നു പ്രത്യേകമായി നിർണ്ണയിച്ചില്ല.
- source_word: כִּי הָיוּ הָאֲנָשִׁים נִכְלָמִים מְאֹד
  choice: കാരണം ആ പുരുഷന്മാർ അത്യന്തം അപമാനിതരായിരുന്നു
  rationale: נכלם എന്ന നിഫാൽ രൂപത്തിലെ പരസ്യമായി നാണംകെടുത്തപ്പെട്ട/അപമാനിക്കപ്പെട്ട അവസ്ഥയും מְאֹד എന്ന തീവ്രതയും പ്രകടമാക്കുന്നു.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: രാജാവ് അവരോട് പറഞ്ഞു
  rationale: ‘രാജാവ്’ എന്ന വ്യക്തമായ വിശേഷണം നിലനിർത്തുന്നു. സംസാരത്തിന്റെ സ്വീകർത്താക്കളെ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘അവരോട്’ എന്ന് വ്യക്തമാക്കി.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: യെരീഹോവിൽ താമസിക്കുക
  rationale: ישׁב ഇവിടെ ഇരിക്കുക എന്നതിലുപരി താൽക്കാലികമായി തങ്ങുക/താമസിക്കുക എന്നാണ്. സ്ഥലനാമത്തോടൊപ്പം ‘-യിൽ’ സ്വാഭാവികമാണ്.
- source_word: עַד יְצַמַּח זְקַנְכֶם
  choice: നിങ്ങളുടെ താടി വളരുന്നതുവരെ
  rationale: צמח എന്നത് വളരുക/മുളയ്ക്കുക. കൂട്ടത്തെ അഭിസംബോധന ചെയ്യുന്ന ബഹുവചന ഉടമസ്ഥപ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിങ്ങളുടെ താടി’ എന്ന് കൂട്ടവാചകമായി നൽകി; മുമ്പ് മുറിച്ചുകളഞ്ഞതിനാൽ വീണ്ടും വളരുക എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു, എന്നാൽ ‘വീണ്ടും’ മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തില്ല.
- source_word: וְשַׁבְתֶּם
  choice: അതിനു ശേഷം മടങ്ങിവരുക
  rationale: שׁוב എന്നതിന്റെ ‘മടങ്ങുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തി. ‘അതിനു ശേഷം’ എന്നത് עד-വാക്യത്തിലെ സമയക്രമം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
