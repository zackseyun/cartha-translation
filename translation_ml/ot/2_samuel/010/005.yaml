translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അത്യന്തം അപമാനിതരായിരുന്നു’ എന്ന പ്രയോഗം വ്യക്തിപരമായ ലജ്ജയോടൊപ്പം പൊതുവായി നാണംകെടുത്തപ്പെട്ട അവസ്ഥയും സൂചിപ്പിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ലെ footnote markers/content തമ്മിലുള്ള പൊരുത്തക്കേട് മൂലം, മൂലപാഠത്തെ അടിസ്ഥാനമാക്കി യഥാർത്ഥ വിവർത്തനവിശദീകരണത്തിനാണ് [a] നൽകിയിരിക്കുന്നത്.
