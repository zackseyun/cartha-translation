    issue: ‘ആളയച്ചു’ specifies an agent not stated in the Hebrew.
    rationale: וַיִּשְׁלַח לִקְרָאתָם means literally ‘he sent to meet them’; although representatives are implied by context, the text does not identify or explicitly state what/who was sent.
  - severity: low
