translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ യുദ്ധസന്ദർഭഭാഷ ഉപയോഗിച്ചു. ‘അരാം’ എന്ന മൂലനാമം നിലനിർത്തി; രക്ഷയെ സൂചിപ്പിക്കുന്ന നാമ-ക്രിയ ബന്ധവും വാക്യത്തിന്റെ സമാന്തരഘടനയും പരമാവധി സംരക്ഷിച്ചു.
