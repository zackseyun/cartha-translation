source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק אֲרָם֙ מִמֶּ֔/נִּי וְ/הָיִ֥תָה לִּ֖/י לִֽ/ישׁוּעָ֑ה וְ/אִם בְּנֵ֤י עַמּוֹן֙ יֶחֱזְק֣וּ מִמְּ/ךָ֔ וְ/הָלַכְתִּ֖י לְ/הוֹשִׁ֥יעַֽ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/011.yaml
  text: He said[a], “If Aram is too strong for me, then you shall help me; but if the Ammonites are too strong for you[b], then I will go to help you.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അരാം എനിക്കെതിരെ പ്രബലപ്പെട്ടാൽ[a], നീ എനിക്കു സഹായമായിരിക്കും[b]; എന്നാൽ അമ്മോന്യർ നിനക്കെതിരെ പ്രബലപ്പെട്ടാൽ, ഞാൻ നിന്നെ സഹായിക്കാൻ പോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അരാം എന്നെക്കാൾ ശക്തമായാൽ”; ഇതുപോലെ തുടർന്ന്, “അമ്മോന്യർ നിന്നെക്കാൾ ശക്തരായാൽ.”
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠത്തിന്റെ കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം: “നീ എനിക്കു രക്ഷ/വിടുതലായിരിക്കും”; തുടർന്ന്, “ഞാൻ പോയി നിന്നെ രക്ഷിക്കും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֱזְקוּ
  choice: പ്രബലപ്പെട്ടാൽ
  rationale: യുദ്ധസന്ദർഭത്തിൽ חזק ശക്തിയാർജിക്കുക, മേൽക്കൈ നേടുക, എതിരാളിയെക്കാൾ ശക്തനാകുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. ‘പ്രബലപ്പെട്ടാൽ’ ഈ സൈനികസന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുകയും മൂലത്തിലെ താരതമ്യാർഥം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: മൂലപാഠം പിന്നീട് നിലവിൽവന്ന ‘സിറിയ’ എന്ന ഭൂരാഷ്ട്രീയനാമമല്ല, അരാം എന്ന ജനത/രാജ്യനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: מִמֶּנִּי / מִמְּךָ
  choice: എനിക്കെതിരെ / നിനക്കെതിരെ
  rationale: חזק എന്ന ക്രിയയോടൊപ്പം מן താരതമ്യമോ മേൽക്കൈയോ സൂചിപ്പിക്കുന്നു. യുദ്ധസന്ദർഭത്തിൽ ‘എനിക്കെതിരെ/നിനക്കെതിരെ പ്രബലപ്പെടുക’ സ്വാഭാവികമായ മലയാളമാണ്; ‘എന്നെക്കാൾ/നിന്നെക്കാൾ ശക്തരാകുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְהָיְתָה לִּי לִישׁוּעָה
  choice: നീ എന്റെ രക്ഷയ്ക്കെത്തണം
  rationale: അക്ഷരാർഥത്തിലെ ‘നീ എനിക്ക് രക്ഷയായിരിക്കണം’ എന്ന ആശയം സൈനികസഹായത്തിന്റെ സാഹചര്യത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לִישׁוּעָה
  choice: രക്ഷ
  rationale: יְשׁוּעָה ഇവിടെ യുദ്ധത്തിലെ വിടുതൽ/രക്ഷയെ സൂചിപ്പിക്കുന്നു. ‘രക്ഷ’ മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; കേവലം ‘സഹായം’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന സെമിറ്റിക് പ്രയോഗത്തിന് മലയാളത്തിലെ സ്വാഭാവിക ജനവിഭാഗനാമമാണ് ‘അമ്മോന്യർ’.
- source_word: וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  choice: ഞാൻ നിന്നെ രക്ഷിക്കാൻ പോകും
  rationale: הלך + ഉദ്ദേശ്യസൂചക infinitive ചലനവും ലക്ഷ്യവും ഒരുമിച്ചു വ്യക്തമാക്കുന്നു. ‘പോകും’ എന്നത് മൂലത്തിലെ ചലനം നിലനിർത്തുന്നു; ‘രക്ഷിക്കാൻ’ എന്നത് ישׁע ധാതുവിന്റെ അർഥവും മുൻവാക്യത്തിലെ ‘രക്ഷ’യുമായുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
