translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അരാം’ എന്ന മൂലനാമവും ‘മുമ്പിൽ’ എന്ന ദൃശ്യരൂപവും നിലനിർത്തിക്കൊണ്ട്, സമൂഹവാചകമായ പേരിനുശേഷം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന സർവനാമം ഉപയോഗിച്ചു.
