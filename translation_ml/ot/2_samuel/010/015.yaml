id: 2SA.10.15
reference: 2 Samuel 10:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣רְא אֲרָ֔ם כִּ֥י נִגַּ֖ף לִ/פְנֵ֣י יִשְׂרָאֵ֑ל וַ/יֵּאָסְפ֖וּ יָֽחַד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/015.yaml
  text: When Aram saw that it had been defeated before Israel[a], they gathered together.
translation:
  language: ml
  text: അരാം ഇസ്രായേലിന്റെ മുമ്പിൽ പരാജയപ്പെട്ടെന്നു കണ്ടപ്പോൾ[a], അവർ ഒരുമിച്ചുകൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അരാം ഇസ്രായേലിന്റെ മുമ്പിൽ പരാജയപ്പെട്ടെന്നു കണ്ടു; അവർ ഒരുമിച്ചുകൂടി.’ എബ്രായത്തിൽ ഏകവചനത്തിലുള്ള ‘അരാം’ എന്ന പേരാണ് അരാമ്യരെ സമൂഹമായി സൂചിപ്പിക്കാൻ ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; പിന്നാലെയുള്ള പ്രവൃത്തിയോടുള്ള കാലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘കണ്ടപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֲרָם
  choice: അരാം
  rationale: എബ്രായത്തിലെ ഏകവചന രൂപത്തിലുള്ള സ്ഥല-ജനനാമം അതേപടി നിലനിർത്തുന്നു; ഇവിടെ അത് അരാമ്യരെ സമൂഹമായി സൂചിപ്പിക്കുന്നതിനാൽ തുടർന്നുള്ള സർവനാമം ബഹുവചനത്തിലാണ്.
- source_word: כִּי
  choice: …എന്നു
  rationale: ഇവിടെ כִּי കാരണമല്ല, അരാം ഗ്രഹിച്ച കാര്യത്തിന്റെ ഉള്ളടക്കമാണ് അവതരിപ്പിക്കുന്നത്; മലയാളത്തിൽ അത് ‘എന്നു’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: נִגַּף
  choice: പരാജയപ്പെട്ട
  rationale: נגף എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ യുദ്ധത്തിൽ തോൽക്കുക എന്ന അർഥം നൽകുന്നു; ‘പരാജയപ്പെട്ട’ എന്നത് പ്രഹാരത്തിന്റെ രീതി അനാവശ്യമായി നിർണ്ണയിക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: യുദ്ധസന്ദർഭത്തിൽ ‘എതിരിൽ’ അഥവാ ‘ശക്തിക്കു മുമ്പിൽ’ എന്ന ആശയം നൽകുന്ന മൂലപദത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: വ്യക്തിനാമം/ജനനാമം മലയാളത്തിലെ പതിവുരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיֵּאָסְפוּ
  choice: ഒരുമിച്ചുകൂടി
  rationale: אָסף എന്നതിന്റെ നിഫാൽ രൂപമായ ‘കൂടിവരുക, സമ്മേളിക്കുക’ എന്ന അടിസ്ഥാനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘വീണ്ടും സൈന്യത്തെ ക്രമീകരിച്ചു’ എന്നതുപോലുള്ള അധിക സൈനിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: יָחַד
  choice: ഒരുമിച്ച്
  rationale: ‘ഒന്നിച്ച്’ എന്ന ക്രിയാവിശേഷണാർഥം ‘കൂടി’ എന്ന ക്രിയയോടു ചേർത്ത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
