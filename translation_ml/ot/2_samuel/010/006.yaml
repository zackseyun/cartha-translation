revisions:
- from: അമ്മോന്യർ തങ്ങൾ ദാവീദിന് വെറുപ്പുളവാക്കിയെന്ന് കണ്ടപ്പോൾ[a], അവർ ആളയച്ച് ബേത്ത്-രെഹോബിലെ അരാമ്യരെയും സോബയിലെ അരാമ്യരെയും—ഇരുപതിനായിരം കാലാൾപ്പടയാളികളെയും—ആയിരം ആളുകളോടുകൂടിയ മയഖാ രാജാവിനെയും തോബിലെ ആളുകളിൽ പന്ത്രണ്ടായിരം പേരെയും കൂലിക്കെടുത്തു.[b][c]
  to: അമ്മോന്യർ തങ്ങൾ ദാവീദിന് അരോചകരായിത്തീർന്നെന്ന് കണ്ടപ്പോൾ[a], അവർ ആളയച്ച് ബേത്ത്-രെഹോബിലെ അരാമ്യരെയും സോബയിലെ അരാമ്യരെയും[b]—ഇരുപതിനായിരം കാലാൾപ്പടയാളികളെ—മയഖായുടെ രാജാവിനെയും അവനോടുകൂടെ ആയിരം ആളുകളെയും, തോബിലെ ആളുകളിൽ പന്ത്രണ്ടായിരം പേരെയും[c] കൂലിക്കെടുത്തു.
  rationale: The revision corrects the nuance of the Hebrew idiom for becoming odious to David, clarifies that Maacah is the kingdom of the named king, and moves each note marker to the expression it documents. “ആളയച്ച്” retains the source’s unspecified sending action in idiomatic Malayalam without specifying that those sent were messengers.
