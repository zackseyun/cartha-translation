  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י נִבְאֲשׁ֖וּ בְּ/דָוִ֑ד וַ/יִּשְׁלְח֣וּ בְנֵֽי עַמּ֡וֹן וַ/יִּשְׂכְּרוּ֩ אֶת אֲרַ֨ם בֵּית רְח֜וֹב וְ/אֶת אֲרַ֣ם צוֹבָ֗א עֶשְׂרִ֥ים אֶ֨לֶף֙ רַגְלִ֔י וְ/אֶת מֶ֤לֶךְ מַֽעֲכָה֙ אֶ֣לֶף אִ֔ישׁ וְ/אִ֣ישׁ ט֔וֹב שְׁנֵים עָשָׂ֥ר אֶ֖לֶף אִֽישׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
translation:
  language: ml
  text: അമ്മോന്യർ തങ്ങൾ ദാവീദിന് അരോചകരായിത്തീർന്നെന്ന് കണ്ടപ്പോൾ[a], അവർ ആളയച്ച് ബേത്ത്-രെഹോബിലെ അരാമ്യരെയും സോബയിലെ അരാമ്യരെയും[b]—ഇരുപതിനായിരം കാലാൾപ്പടയാളികളെ—മയഖായുടെ രാജാവിനെയും അവനോടുകൂടെ ആയിരം ആളുകളെയും, തോബിലെ ആളുകളിൽ പന്ത്രണ്ടായിരം പേരെയും[c] കൂലിക്കെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “തങ്ങൾ ദാവീദിന് ദുർഗന്ധംപോലെ ആയിത്തീർന്നെന്ന്.”'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ “അരാം”; പരമ്പരാഗതമായി “സിറിയ/സിറിയക്കാർ” എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: “ഈശ്-തോബ്” എന്നും വായിക്കാം; അത് ഒരു സ്ഥലത്തിന്റെയോ ജനവിഭാഗത്തിന്റെയോ പേരായിരിക്കാം. ഇവിടെ “തോബിലെ ആളുകൾ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ സ്ഥിതിഗതികൾ തിരിച്ചറിഞ്ഞു എന്ന ആശയവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, ആധുനിക മലയാളത്തിൽ ജനവിഭാഗത്തെ വ്യക്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കാൻ ‘അമ്മോന്യർ’ അനുയോജ്യം.
- source_word: נִבְאֲשׁוּ בְּדָוִד
  choice: തങ്ങൾ ദാവീദിന് വെറുപ്പുളവാക്കിയെന്ന്
  rationale: באשׁ ദുർഗന്ധത്തിന്റെ രൂപകം ഉപയോഗിച്ച് ഒരാൾക്ക് അരോചകമോ വെറുപ്പുളവാക്കുന്നതോ ആയിത്തീരുക എന്നർഥം നൽകുന്നു. മലയാളത്തിലെ മുഖ്യവാചകത്തിൽ അതിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകി, അക്ഷരാർഥരൂപകം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיִּשְׁלְחוּ
  choice: ആളയച്ച്
  rationale: ഹീബ്രുവിൽ അയച്ചതിന്റെ കർമം വ്യക്തമല്ല. മലയാളത്തിൽ തുടർന്നുള്ള കൂലിക്കെടുക്കൽ പ്രവൃത്തിയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ആളയച്ച്’ എന്നു നൽകി; ‘ദൂതന്മാർ’ എന്ന നിർദിഷ്ട പദം ചേർത്തിട്ടില്ല.
- source_word: וַיִּשְׂכְּרוּ
  choice: കൂലിക്കെടുത്തു
  rationale: സൈനികസഹായത്തിനായി പ്രതിഫലം നൽകി ആളുകളെ ഏർപ്പെടുത്തുക എന്ന שׂכר-ന്റെ അർഥം കൃത്യവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: אֲרַם בֵּית רְחוֹב / אֲרַם צוֹבָא
  choice: ബേത്ത്-രെഹോബിലെ അരാമ്യർ / സോബയിലെ അരാമ്യർ
  rationale: אֲרַם എന്ന പുരാതന ജനനാമം ‘സിറിയക്കാർ’ എന്ന പരമ്പരാഗത രൂപത്തിനുപകരം കൂടുതൽ നേരിട്ട് ‘അരാമ്യർ’ എന്നു പരിഭാഷപ്പെടുത്തി; സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു.
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  choice: ഇരുപതിനായിരം കാലാൾപ്പടയാളികൾ
  rationale: רַגְלִי കാൽനടയായി പോരാടുന്ന സൈനികരെ സൂചിപ്പിക്കുന്നു; ‘കാലാൾപ്പടയാളികൾ’ ആ സൈനികവ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: מֶלֶךְ מַעֲכָה
  choice: മയഖാ രാജാവ്
  rationale: നിർമാണബന്ധം മയഖാ പ്രദേശത്തിന്റെ രാജാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ പതിവായ ചുരുക്കരൂപം ഉപയോഗിച്ചു.
- source_word: אִישׁ טוֹב
  choice: തോബിലെ ആളുകൾ
  rationale: സന്ദർഭവും 1 ദിനവൃത്താന്തം 19:6-ലെ സമാന്തരവിവരണവും കണക്കിലെടുത്ത് തോബ് എന്ന സ്ഥലത്തെയോ ജനവിഭാഗത്തെയോ സൂചിപ്പിക്കുന്നതായി മുഖ്യവാചകത്തിൽ നൽകി; ‘ഈശ്-തോബ്’ എന്ന വായനയുടെ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: പന്ത്രണ്ടായിരം പേർ
  rationale: ഹീബ്രു സംഖ്യയും ആളുകളുടെ എണ്ണവും നേരിട്ട്, മലയാളത്തിലെ ആവർത്തനം കുറയ്ക്കുന്ന സ്വാഭാവിക രൂപത്തിൽ നൽകി.
