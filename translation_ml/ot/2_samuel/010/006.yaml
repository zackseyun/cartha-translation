translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രു വാക്യത്തിന്റെ പട്ടികാസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് ദീർഘവാക്യം വായിക്കാൻ സഹായിക്കുന്നതിനായി വിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു. യഥാർഥ പാഠസന്ദിഗ്ധതകൾ മുഖ്യവാചകത്തിൽ പരിഹരിച്ചെന്ന ഭാവം വരാതിരിക്കാൻ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി; എല്ലാ [a], [b], [c] ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
