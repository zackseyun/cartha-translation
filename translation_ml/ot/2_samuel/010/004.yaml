  terminology: ‘ദാവീദിന്റെ സേവകർ’ is suitable for David’s royal servants/emissaries. ‘നിതംബങ്ങൾ’ is an acceptable primary rendering for the uncertain שְׁתוֹתֵיהֶם, provided the lexical uncertainty remains in the footnote.
  issues:
