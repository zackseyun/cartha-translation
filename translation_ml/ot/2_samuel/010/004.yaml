  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח חָנ֜וּן אֶת עַבְדֵ֣י דָוִ֗ד וַ/יְגַלַּח֙ אֶת חֲצִ֣י זְקָנָ֔/ם וַ/יִּכְרֹ֧ת אֶת מַדְוֵי/הֶ֛ם בַּ/חֵ֖צִי עַ֣ד שְׁתֽוֹתֵי/הֶ֑ם וַֽ/יְשַׁלְּחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
translation:
  language: ml
  text: അങ്ങനെ ഹാനൂൻ ദാവീദിന്റെ സേവകരെ എടുത്ത്, ഓരോരുത്തരുടെയും താടിയുടെ പകുതി വടിച്ചു; അവരുടെ വസ്ത്രങ്ങൾ നിതംബങ്ങൾവരെ മാത്രമെത്തുന്നവിധം പകുതിയായി മുറിച്ചുകളഞ്ഞ് അവരെ പറഞ്ഞയച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: പിടിച്ച്
  rationale: לקח എന്ന സാധാരണ ക്രിയയ്ക്ക് ‘എടുത്തു’ എന്നും അർഥമുണ്ടെങ്കിലും, രാജദൂതന്മാരെ അപമാനിക്കാൻ തന്റെ നിയന്ത്രണത്തിലാക്കിയ ഈ സന്ദർഭത്തിൽ ‘പിടിച്ച്’ എന്നത് സ്വാഭാവികമാണ്; ‘പിടിച്ചടക്കി’ എന്നതുപോലെ അമിതബലം സൂചിപ്പിക്കുന്നില്ല.
- source_word: עַבְדֵי דָוִד
  choice: ദാവീദിന്റെ സേവകർ
  rationale: עבד അടിമയെയോ സേവകനെയോ രാജസേവയിലെ ഉദ്യോഗസ്ഥനെയോ സൂചിപ്പിക്കാം. ഇവിടെ ദാവീദിന്റെ പ്രതിനിധികളായ രാജസേവകരാണ് ഉദ്ദേശ്യം; അതിനാൽ ‘സേവകർ’ യോജിക്കുന്നു.
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  choice: അവരുടെ താടിയുടെ പകുതി ക്ഷൗരം ചെയ്തു
  rationale: ഓരോരുത്തന്റെയും താടിയുടെ ഒരു പകുതി മനഃപൂർവം ക്ഷൗരം ചെയ്ത് അപമാനിച്ചതാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּכְרֹת אֶת מַדְוֵיהֶם בַּחֵצִי
  choice: അവരുടെ വസ്ത്രങ്ങൾ നടുവിൽവെച്ച് … മുറിച്ചുകളഞ്ഞു
  rationale: כרת ഭാഗം മുറിച്ചുനീക്കുന്നതും מַדְוֵיהֶם അവരുടെ വസ്ത്രങ്ങളും സൂചിപ്പിക്കുന്നു. ‘നടുവിൽവെച്ച്’ എന്നത് വസ്ത്രം മുറിച്ച സ്ഥാനത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עַד שְׁתוֹתֵיהֶם
  choice: നിതംബങ്ങൾവരെ
  rationale: അപൂർവമായ שְׁתוֹת എന്ന പദം ഇരിപ്പിടഭാഗത്തെയോ നിതംബങ്ങളെയോ സ്വകാര്യഭാഗത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ ലജ്ജാകരമായ അനാവരണം വ്യക്തമാക്കിക്കൊണ്ട് ‘നിതംബങ്ങൾവരെ’ പ്രധാന പാഠത്തിൽ സ്വീകരിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיְשַׁלְּחֵם
  choice: അവരെ പറഞ്ഞയച്ചു
  rationale: അപമാനിച്ചതിനുശേഷം അവരെ വിട്ടയച്ചതോ തിരിച്ചയച്ചതോ ആയ കഥാക്രമം ‘പറഞ്ഞയച്ചു’ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. അപമാനത്തിന്റെ ശാരീരിക സ്വഭാവം മറച്ചുവെക്കാതെ അവതരിപ്പിച്ചെങ്കിലും അപൂർവമായ എബ്രായ ശരീരപദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
