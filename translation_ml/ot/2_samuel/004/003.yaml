source:
  edition: WLC
  text: וַ/יִּבְרְח֥וּ הַ/בְּאֵרֹתִ֖ים גִּתָּ֑יְמָ/ה וַֽ/יִּהְיוּ שָׁ֣ם גָּרִ֔ים עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/003.yaml
  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
translation:
  language: ml
  text: എന്നാൽ ബെയേരോത്തുകാർ ഗിത്തയീമിലേക്കു ഓടിപ്പോയി; അവർ ഇന്നുവരെ അവിടെ പരദേശികളായി താമസിച്ചുവരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇന്നുവരെ അവർ അവിടെ സ്വദേശികളല്ലാത്ത താമസക്കാരായി ജീവിച്ചുവരുന്നു.”'
    reason: גָּרִים എന്ന പദം വെറും താൽക്കാലിക സന്ദർശകരെയല്ല, അന്യദേശത്ത് താമസിക്കുന്ന സ്വദേശിവർഗത്തിൽ പെടാത്തവരെയും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  choice: ഓടിപ്പോയി
  rationale: ברח എന്ന ക്രിയയുടെ ഖാൽ രൂപം ‘പലായനം ചെയ്യുക/ഓടിപ്പോകുക’ എന്നാണ്. ഇവിടെ പശ്ചാത്തലവിവരണം ആണെങ്കിലും, ഹീബ്രു ആഖ്യാനക്രമത്തോട് ചേർന്ന് ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: הַבְּאֵרֹתִים
  choice: ബെയേരോത്തുകാർ
  rationale: ബെയേരോത്ത് സ്വദേശികളെയോ അവിടത്തെ ജനവിഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന ബഹുവചന ജനനാമം; മലയാളത്തിൽ സ്ഥലനാമത്തോടു ‘-കാർ’ ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: גִּתָּיְמָה
  choice: ഗിത്തയീമിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന directional he അവിടേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു; ‘-ലേക്കു’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּהְיוּ שָׁם
  choice: അവർ അവിടെ ... താമസിച്ചുവരുന്നു
  rationale: ‘ഇന്നുവരെ’ എന്ന കാലപ്രയോഗത്തോടൊപ്പം, പണ്ടാരംഭിച്ച് ആഖ്യാതാവിന്റെ കാലംവരെ തുടരുന്ന അവസ്ഥയെ മലയാളത്തിലെ ‘താമസിച്ചുവരുന്നു’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: גָּרִים
  choice: പരദേശികളായി
  rationale: גור എന്നതിന്റെ പങ്കാളിത്തരൂപം സ്വന്തം നാട്ടിന് പുറത്തു, സ്വദേശികളല്ലാത്ത താമസക്കാരായി കഴിയുന്നവരെ സൂചിപ്പിക്കുന്നു. ‘പരദേശികളായി’ സാമൂഹികമായ അന്യത്വം നിലനിർത്തുന്നു; താൽക്കാലികത അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: ആഖ്യാതാവിന്റെ ഇപ്പോഴത്തെ കാലംവരെ സ്ഥിതി തുടരുന്നതു സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַ
  choice: എന്നാൽ
  rationale: മുൻവാക്യവുമായി ബന്ധപ്പെട്ട വിശദീകരണാത്മകമായ നേരിയ വൈരുധ്യം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെറും ‘അപ്പോൾ/ഉം’ എന്നതിനെക്കാൾ സന്ദർഭബന്ധം സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പവും ഗൗരവമുള്ളതുമായ മലയാളം. സ്ഥലനാമങ്ങൾ ഹീബ്രു രൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു. തുടർന്നുനിൽക്കുന്ന താമസം ‘താമസിച്ചുവരുന്നു’ എന്ന പ്രയോഗത്തിലൂടെ പ്രകടിപ്പിച്ചു.
