base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/001.yaml
  text: When Saul’s son heard that Abner had died in Hebron[a], his hands became weak, and all Israel was alarmed.
translation:
  language: ml
  text: ശൗലിന്റെ മകൻ, അബ്നേർ ഹെബ്രോനിൽ മരിച്ചുവെന്നു കേട്ടപ്പോൾ, അവന്റെ കൈകൾ തളർന്നു[a]; ഇസ്രായേൽ മുഴുവനും പരിഭ്രാന്തരായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അവന്റെ കൈകൾ തളർന്നു.’ ശക്തിയോ ധൈര്യമോ നഷ്ടപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  choice: ശൗലിന്റെ മകൻ
  rationale: മൂലപാഠത്തിലെ പരോക്ഷമായ തിരിച്ചറിയൽ അതേപടി നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ഇശ്-ബോശെത്ത് എന്ന പേര് ചേർക്കുന്നില്ല.
- source_word: כִּי מֵת אַבְנֵר בְּחֶבְרוֹן
  choice: അബ്നേർ ഹെബ്രോനിൽ മരിച്ചുവെന്നു
  rationale: כִּי ഇവിടെ കേട്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; מֵת കേൾക്കുന്നതിനു മുമ്പ് പൂർത്തിയായ മരണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മരിച്ചുവെന്നു’ ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּרְפּוּ יָדָיו
  choice: അവന്റെ കൈകൾ തളർന്നു
  rationale: ബലമോ ധൈര്യമോ നഷ്ടപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശരീരരൂപകം സംരക്ഷിക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: כָל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനും
  rationale: വ്യക്തികളെ എണ്ണിപ്പറയുന്നതിനു പകരം ജനതയെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ദേശീയ സംജ്ഞ നിലനിർത്തുന്നു.
- source_word: נִבְהָלוּ
  choice: പരിഭ്രാന്തരായി
  rationale: അസ്വസ്ഥത, ഭീതി, പെട്ടെന്നുള്ള അമ്പരപ്പ് എന്നിവ ഉൾക്കൊള്ളുന്ന ക്രിയയുടെ അർഥം സന്ദർഭോചിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
