  yaml_path: translation/ot/2_samuel/004/006.yaml
  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
translation:
  language: ml
  text: അങ്ങനെ അവർ ഗോതമ്പ് എടുക്കുന്നവരായി വീടിന്റെ അകത്തളത്തിലേക്കു ചെന്നു; അവർ അവന്റെ വയറ്റിൽ[a] അടിച്ചു. പിന്നെ രേഖാബും അവന്റെ സഹോദരൻ ബാനായും രക്ഷപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: ‘അഞ്ചാം വാരിയെല്ലിനടിയിൽ.’ എബ്രായപ്രയോഗം പൊതുവായി ഉദരമേഖലയെയോ വയറിനെയോ സൂചിപ്പിക്കുന്നതാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנָּה
  choice: അങ്ങനെ അവർ
  rationale: കഥയുടെ അടുത്ത പ്രവൃത്തിയിലേക്കു വിരൽചൂണ്ടുന്ന പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘ഇതാ’ എന്നത് ഇവിടെ അനാവശ്യമായ നാടകീയത നൽകാം.
- source_word: בָּאוּ עַד תּוֹךְ הַבַּיִת
  choice: വീടിന്റെ അകത്തളംവരെ ചെന്നു
  rationale: עַד תּוֹךְ സൂചിപ്പിക്കുന്ന വീടിന്റെ ഉള്ളിലേക്കുള്ള ആഴത്തിലുള്ള പ്രവേശനം ‘അകത്തളംവരെ’ എന്ന പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לֹקְחֵי חִטִּים
  choice: ഗോതമ്പ് എടുക്കുന്നവരായി
  rationale: പങ്കാളികപ്രയോഗത്തിന്റെ അർത്ഥവും അതിലെ സൂചനാപരമായ അവ്യക്തതയും നിലനിർത്തുന്നു. ‘ഗോതമ്പ് എടുക്കുന്നതായി നടിച്ച്’ എന്നു പറഞ്ഞാൽ വാചകത്തിൽ വ്യക്തമല്ലാത്ത വഞ്ചന നേരിട്ട് ചേർക്കപ്പെടും.
- source_word: וַיַּכֻּהוּ
  choice: അവർ അവനെ കുത്തി
  rationale: נכה സാധാരണയായി ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്നാണെങ്കിലും ശരീരഭാഗത്തേക്കുള്ള മാരകാക്രമണത്തിന്റെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളമായി ‘കുത്തി’ ഉപയോഗിക്കുന്നു; അടുത്ത വാക്യം മരണാനന്തര നടപടിയെ വിവരിക്കുന്നു.
- source_word: אֶל הַחֹמֶשׁ
  choice: വയറ്റിൽ
  rationale: חֹמֶשׁ ഇവിടെ ഉദരമേഖലയെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ‘വയറ്റിൽ’ എന്ന പദം പരമ്പരാഗതമായെങ്കിലും അനിശ്ചിതമായ ‘അഞ്ചാം വാരിയെല്ലിനടിയിൽ’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: וְרֵכָב וּבַעֲנָה אָחִיו
  choice: പിന്നെ രേഖാബും അവന്റെ സഹോദരൻ ബാനയും
  rationale: וְ കഥാക്രമത്തിൽ ‘പിന്നെ’ എന്നു സ്വാഭാവികമായി വരുന്നു; אָחִיו ആരെ വിശേഷിപ്പിക്കുന്നു എന്നത് ‘അവന്റെ സഹോദരൻ’ എന്നു നിലനിർത്തുന്നു.
- source_word: נִמְלָטוּ
  choice: രക്ഷപ്പെട്ടു
  rationale: മלט എന്ന നിഫാൽ രൂപത്തിന്റെ വിജയകരമായി ഒഴിഞ്ഞുമാറുക എന്ന അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
