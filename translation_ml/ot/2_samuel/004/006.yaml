  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ലֹקְחֵי חִטִּים എന്ന അവ്യക്തമായ പങ്കാളികപ്രയോഗത്തിൽ ‘നടിച്ച്’ എന്ന വ്യാഖ്യാനം ചേർക്കാതെ അതിന്റെ തുറന്ന സ്വഭാവം സംരക്ഷിച്ചു.
