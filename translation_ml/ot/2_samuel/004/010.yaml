  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י הַ/מַּגִּיד֩ לִ֨/י לֵ/אמֹ֜ר הִנֵּה מֵ֣ת שָׁא֗וּל וְ/הֽוּא הָיָ֤ה כִ/מְבַשֵּׂר֙ בְּ/עֵינָ֔י/ו וָ/אֹחֲזָ֣/ה ב֔/וֹ וָ/אֶהְרְגֵ֖/הוּ בְּ/צִֽקְלָ֑ג אֲשֶׁ֥ר לְ/תִתִּ/י ל֖/וֹ בְּשֹׂרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
translation:
  language: ml
  text: ഒരുവൻ, “ഇതാ, ശൗൽ മരിച്ചിരിക്കുന്നു” എന്ന് എന്നെ അറിയിച്ചപ്പോൾ, അവൻ സ്വന്തം കണക്കിൽ സന്തോഷവാർത്ത കൊണ്ടുവരുന്നവനെപ്പോലെയായിരുന്നു.[a] ഞാൻ അവനെ പിടിച്ച് സിക്ലാഗിൽവെച്ച് കൊന്നു; അവന്റെ വാർത്തയ്ക്കുള്ള പ്രതിഫലമായി ഞാൻ അവന് കൊടുത്തത് അതായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “അവൻ സ്വന്തം കണ്ണുകളിൽ സന്തോഷവാർത്ത കൊണ്ടുവരുന്നവനെപ്പോലെയായിരുന്നു.” അതായത്, തന്റെ സന്ദേശം ദാവീദിന് സന്തോഷകരമാണെന്ന് അവൻ തന്നെ കരുതി.'
    reason: lexical_alternative
  - marker: b
    text: അവസാന ഭാഗം എബ്രായത്തിൽ സംക്ഷിപ്തമാണ്; അതിൽ പരിഹാസഭാവമുണ്ട്. ശൗലിന്റെ മരണവാർത്ത അറിയിച്ചതിന് പ്രതിഫലം ലഭിക്കുമെന്ന് ആ ദൂതൻ പ്രതീക്ഷിച്ചെങ്കിലും, അവന് ലഭിച്ച ഏക ‘പ്രതിഫലം’ മരണം തന്നെയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: '[മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ഉദാഹരണമായി പ്രത്യേകം പദമില്ലാതെ വാക്യബന്ധത്തിൽ പ്രകടിപ്പിച്ചു]'
  rationale: ഇവിടെ כִּי മുൻസന്ദർഭത്തിലെ പ്രസ്താവനയെ പിന്തുണയ്ക്കുന്ന ഒരു സംഭവവിവരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കാരണം’ എന്നു ചേർത്താൽ ബന്ധം അതിയായി നിർണയിക്കപ്പെടാം; സ്വാഭാവികമായ തുടർച്ചയിലൂടെ അതിന്റെ വിശദീകരണസ്വഭാവം നിലനിർത്തി.
- source_word: הַמַּגִּיד לִי לֵאמֹר
  choice: “... എന്ന് എന്നെ അറിയിച്ചവൻ”
  rationale: നിശ്ചയാർഥകമായ കൃദന്തരൂപം ‘എന്നെ അറിയിച്ചവൻ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി; לֵאמֹר കൊണ്ടുവരുന്ന ഉദ്ധരണിസംബന്ധം മലയാളത്തിലെ ‘എന്ന്’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: הִנֵּה מֵת שָׁאוּל
  choice: “ഇതാ, ശൗൽ മരിച്ചിരിക്കുന്നു”
  rationale: הִנֵּה ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗമായതിനാൽ ‘ഇതാ’ എന്നും, מֵת സൂചിപ്പിക്കുന്ന മരണത്തിന്റെ നിലവിലെ ഫലം ‘മരിച്ചിരിക്കുന്നു’ എന്നും നൽകി.
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  choice: സ്വന്തം ദൃഷ്ടിയിൽ താൻ സുവാർത്ത അറിയിക്കുന്നവനാണെന്നു കരുതി
  rationale: כִמְבַשֵּׂר എന്നത് ‘സുവാർത്ത അറിയിക്കുന്നവനെപ്പോലെ’ എന്നും בְּעֵינָיו അക്ഷരാർഥത്തിൽ ‘അവന്റെ കണ്ണുകളിൽ’ എന്നും വരുന്നു. മലയാളത്തിൽ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകാൻ ‘സ്വന്തം ദൃഷ്ടിയിൽ ... കരുതി’ എന്നു പരിഭാഷപ്പെടുത്തി; സന്ദേശവാഹകന്റെ ആത്മവിലയിരുത്തൽ നിലനിർത്തി.
- source_word: וָאֹחֲזָה בוֹ
  choice: ഞാൻ അവനെ പിടിച്ച്
  rationale: אָחַז എന്നതിന്റെ പിടിക്കുക/കൈവശപ്പെടുത്തുക എന്ന ശക്തമായ അർഥം ‘പിടിച്ച്’ എന്ന ലളിതവും സ്വാഭാവികവുമായ രൂപത്തിൽ നൽകി.
- source_word: וָאֶהְרְגֵהוּ בְּצִקְלָג
  choice: സിക്ലാഗിൽവെച്ചു കൊന്നു
  rationale: הרג എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ‘കൊല്ലുക’ എന്ന അർഥം നിലനിർത്തി; ന്യായവിധിപരമായ അധിക ആശയം ചേർത്തില്ല. സ്ഥലനാമം ‘സിക്ലാഗ്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֲשֶׁר לְתִתִּי לוֹ בְּשֹׂרָה
  choice: അവന്റെ വാർത്തയ്ക്ക് ഞാൻ കൊടുത്ത പ്രതിഫലം അതായിരുന്നു
  rationale: എബ്രായവാക്യം സംക്ഷിപ്തവും വ്യാകരണപരമായി അപൂർണ്ണതയുള്ളതുമാണ്. בְּשֹׂרָה ഇവിടെ വാർത്ത അറിയിച്ചതിന് പ്രതീക്ഷിച്ച പ്രതിഫലത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു. പരിഹാസഭാവം വ്യക്തമാക്കിക്കൊണ്ട്, ശിക്ഷ തന്നെയായിരുന്നു ലഭിച്ച ‘പ്രതിഫലം’ എന്ന ആശയം നൽകി.
theological_decisions:
- issue: ദാവീദിന്റെ പ്രവൃത്തിയെ ന്യായവിധിയായോ സാധാരണ കൊലപാതകമായോ നിർവചിക്കൽ
  choice: ‘കൊന്നു’ എന്ന മൂലക്രിയയുടെ നേരിട്ടുള്ള അർഥം മാത്രം നൽകി
  alternative: ‘വധശിക്ഷ നൽകി’ / ‘കൊന്നുകളഞ്ഞു’
  rationale: മൂലപാഠത്തിലെ הָרַג കൊല്ലുക എന്നാണ്; അതിൽ നിയമപരമോ വികാരപരമോ ആയ അധിക നിർവചനം ചേർക്കാതെ സംഭവത്തിന്റെ ധാർമ്മിക-ദൈവശാസ്ത്രപരമായ സംഘർഷം വായനക്കാരന് തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സുവാർത്ത’ എന്ന പരിചിതപദം ഇവിടെ പൊതുവായ ‘സന്തോഷവാർത്ത’ എന്ന അർഥത്തിലാണ്; ക്രിസ്തീയ സാങ്കേതിക അർഥം നിർബന്ധിച്ചിട്ടില്ല. മൂലത്തിലെ പരിഹാസവും ‘സ്വന്തം ദൃഷ്ടിയിൽ’ എന്ന ആത്മവിലയിരുത്തലും നിലനിർത്തി.
