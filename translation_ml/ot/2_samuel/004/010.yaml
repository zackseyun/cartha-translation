revisions:
- from: “ഇതാ, ശൗൽ മരിച്ചിരിക്കുന്നു” എന്ന് എന്നെ അറിയിച്ചവൻ, സ്വന്തം ദൃഷ്ടിയിൽ താൻ സുവാർത്ത അറിയിക്കുന്നവനാണെന്നു കരുതി.[a] എന്നാൽ ഞാൻ അവനെ പിടിച്ച് സിക്ലാഗിൽവെച്ചു കൊന്നു. അവന്റെ വാർത്തയ്ക്ക് ഞാൻ കൊടുത്ത പ്രതിഫലം അതായിരുന്നു.[b]
  to: ഒരുവൻ, “ഇതാ, ശൗൽ മരിച്ചിരിക്കുന്നു” എന്ന് എന്നെ അറിയിച്ചപ്പോൾ, അവൻ സ്വന്തം കണക്കിൽ സന്തോഷവാർത്ത കൊണ്ടുവരുന്നവനെപ്പോലെയായിരുന്നു.[a] ഞാൻ അവനെ പിടിച്ച് സിക്ലാഗിൽവെച്ച് കൊന്നു; അവന്റെ വാർത്തയ്ക്കുള്ള പ്രതിഫലമായി ഞാൻ അവന് കൊടുത്തത് അതായിരുന്നു.[b]
  rationale: The revision restores the temporal-circumstantial contribution of כִּי, retains the Hebrew comparison (‘like one bringing good news’) and its self-evaluative idiom, and preserves the final elliptical irony without imposing a legal or theological judgment on David's action. Footnote anchors and their functions are retained.
