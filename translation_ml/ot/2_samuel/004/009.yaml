source:
  edition: WLC
  text: וַ/יַּ֨עַן דָּוִ֜ד אֶת רֵכָ֣ב וְ/אֶת בַּעֲנָ֣ה אָחִ֗י/ו בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֵֽרֹתִ֖י וַ/יֹּ֣אמֶר לָ/הֶ֑ם חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/009.yaml
  text: But David answered Rekab and Baanah his brother[a], the sons of Rimmon the Beerothite, and said to them, “As Yahweh lives, who has redeemed my life out of every distress,
translation:
  language: ml
  text: 'എന്നാൽ ദാവീദ് ബേരോത്തുകാരനായ രിമ്മോന്റെ പുത്രന്മാരായ രേഖാബിനോടും അവന്റെ സഹോദരനായ ബാനായോടും മറുപടിയായി അവരോടു പറഞ്ഞു: “എല്ലാ കഷ്ടതകളിൽനിന്നും എന്റെ ജീവനെ വീണ്ടെടുത്ത യാഹ്‌വെ ജീവിക്കുന്നതുപോലെ,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ ദൈവനാമം: YHWH; ‘യഹോവ’ എന്നും ലിപ്യന്തരണം ചെയ്യാറുണ്ട്.'
    reason: മുഖ്യപാഠത്തിൽ യാഹ്‌വെ എന്ന രൂപം ഉപയോഗിക്കുമ്പോൾ മലയാളത്തിൽ പരിചിതമായ മറ്റൊരു ലിപ്യന്തരണരൂപം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיַּעַן
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണത്തിലെ പ്രതികരണം പരിചയപ്പെടുത്തുന്ന സാധാരണ എബ്രായ ആഖ്യാനപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: רֵכָב וְאֶת־בַּעֲנָה אָחִיו
  choice: രേഖാബിനോടും അവന്റെ സഹോദരനായ ബാനയോടും
  rationale: אָחִיו എന്ന ഏകവചനരൂപം ബാനയെ രേഖാബിന്റെ സഹോദരനായി സൂചിപ്പിക്കുന്നു; ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: ബേരോത്ത്യനായ രിമ്മോന്റെ പുത്രന്മാരായ
  rationale: പിതൃത്വവും ബേരോത്ത് സ്വദേശബന്ധവും സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: חַי יְהוָה
  choice: യഹോവയാണേ
  rationale: ദൈവത്തിന്റെ ജീവനെ സാക്ഷിയാക്കി ചെയ്യുന്ന പ്രതിജ്ഞാസൂത്രത്തിന്റെ ഗൗരവം മലയാളത്തിലെ സ്വാഭാവിക സത്യവാചകപ്രയോഗത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: פָּדָה
  choice: വീണ്ടെടുത്ത
  rationale: വിലകൊടുത്തുള്ള മോചനത്തിന്റെ അർഥനിറം നിലനിർത്തുന്നതിനാൽ പൊതുവായ ‘രക്ഷിച്ച’ എന്നതിനെക്കാൾ ഉറവിടപദത്തോട് അടുത്തതാണ്.
- source_word: נַפְשִׁי
  choice: എന്റെ ജീവനെ
  rationale: ഇവിടെ נֶפֶשׁ അപകടത്തിൽപ്പെട്ട ദാവീദിന്റെ ജീവൻ അഥവാ സ്വയം എന്ന അർഥത്തിലാണ്; ‘ആത്മാവ്’ എന്ന പരിമിത അർഥം ഒഴിവാക്കുന്നു.
- source_word: מִכָּל־צָרָה
  choice: എല്ലാ കഷ്ടതകളിൽനിന്നും
  rationale: צָרָהയുടെ ദുരിതം/ഞെരുക്കം എന്ന ആശയവും כָּל എന്ന സമഗ്രതയും സാധാരണ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു; സാധ്യതയുള്ള ‘യാഹ്‌വെ’ എന്ന ഉച്ചാരണം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: חַי יְהוָה എന്ന പ്രതിജ്ഞാസൂത്രം
  choice: യഹോവയാണേ
  alternative: യഹോവ ജീവിക്കുന്നതുപോലെ
  rationale: അക്ഷരാർഥത്തിലുള്ള രൂപത്തെക്കാൾ മലയാളത്തിൽ പ്രതിജ്ഞയായി ഉടൻ മനസ്സിലാകുന്ന രൂപം തെരഞ്ഞെടുത്തു; അതിന്റെ സത്യവാചകശക്തി നഷ്ടപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന രൂപങ്ങളിൽ ലിപ്യന്തരിച്ചു. വാക്യം തുടർന്നുള്ള പ്രതിജ്ഞാവാക്യത്തിലേക്ക് നീളുന്നതിനാൽ അവസാനത്തിൽ പൂർണ്ണവിരാമം ചേർത്തിട്ടില്ല.
