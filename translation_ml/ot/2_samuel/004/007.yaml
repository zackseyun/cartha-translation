  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ പ്രവർത്തനക്രമവും ഭൂമിശാസ്ത്രനാമവും സൂക്ഷിച്ചപ്പോൾ, മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി രണ്ടാം പ്രാവശ്യമുള്ള ‘അവന്റെ തല’ എന്ന ആവർത്തനം സർവനാമമാക്കി.
