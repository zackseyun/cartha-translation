base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
translation:
  language: ml
  text: അവർ വീട്ടിൽ കടന്നു. അവൻ തന്റെ കിടപ്പുമുറിയിൽ[a] കിടക്കയിൽ കിടക്കുകയായിരുന്നു. അവർ അവനെ അടിച്ചു കൊന്നു. പിന്നെ അവർ അവന്റെ തല നീക്കി[c], അവന്റെ തല എടുത്ത് അരാബാ[b] വഴിയായി രാത്രി മുഴുവൻ യാത്ര ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ ഉറങ്ങുന്ന മുറിയിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അരാബാ എന്നു പറയുന്നത് യോർദ്ദാൻ താഴ്‌വരയും അതിനോടു ചേർന്ന വിള്ളൽത്താഴ്‌വരപ്രദേശവും ഉൾപ്പെടുന്ന ഭൂമിശാസ്ത്രനാമമാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘അവന്റെ തല വെട്ടിമാറ്റി’; ഹീബ്രു ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥം ‘അവന്റെ തല നീക്കി’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ הַבַּיִת
  choice: അവർ വീട്ടിനകത്തു കടന്നപ്പോൾ
  rationale: בואയും ദിശാസൂചകമായ הַבַּיִתയും ചേർന്ന് വീട്ടിൽ പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള സാഹചര്യവാക്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘കടന്നപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: וְהוּא שֹׁכֵב עַל מִטָּתוֹ
  choice: അവൻ ... കിടക്കമേൽ കിടക്കുകയായിരുന്നു
  rationale: ഈ വാക്യഭാഗം അവർ കടന്നുവന്ന സമയത്തെ അവന്റെ അവസ്ഥ വിവരിക്കുന്നു. ആവർത്തനസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘കിടക്കമേൽ’ സ്ഥാനം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  choice: തന്റെ കിടപ്പുമുറിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ കിടക്കുന്നതിന്റെയോ ഉറങ്ങുന്നതിന്റെയോ മുറി; ആധുനിക മലയാളത്തിൽ ‘കിടപ്പുമുറി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וַיַּכֻּהוּ וַיְמִתֻהוּ
  choice: അവർ അവനെ അടിച്ചു കൊന്നു
  rationale: രണ്ട് ഹീബ്രു ക്രിയകളായ ‘അടിക്കുക’ എന്നും ‘മരിപ്പിക്കുക’ എന്നും സംക്ഷിപ്തമായെങ്കിലും വേർതിരിച്ച പ്രവർത്തനക്രമമായി നിലനിർത്തുന്നു.
- source_word: וַיָּסִירוּ אֶת רֹאשׁוֹ
  choice: അവന്റെ തല വേർപെടുത്തി
  rationale: Hiphil രൂപത്തിലുള്ള סור ‘നീക്കുക/വേർപെടുത്തുക’ എന്നാണ്; സാഹചര്യത്തിൽ ശിരഛേദം സൂചിപ്പിച്ചാലും ഹീബ്രുവിലെ താരതമ്യേന പൊതുവായ ക്രിയയ്ക്ക് ചേർന്ന ‘വേർപെടുത്തി’ തെരഞ്ഞെടുത്തു.
- source_word: וַיִּקְחוּ אֶת רֹאשׁוֹ
  choice: അത് എടുത്തുകൊണ്ട്
  rationale: לקח എന്ന സാധാരണ ‘എടുക്കുക’ എന്ന ക്രിയയുടെ അർഥം സൂക്ഷിക്കുന്നു. മലയാളത്തിലെ അനാവശ്യമായ കഠിന ആവർത്തനം ഒഴിവാക്കാൻ ‘അവന്റെ തല’ എന്നതിന് പകരം ‘അത്’ ഉപയോഗിച്ചു.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: അരാബാ വഴിയായി ... യാത്ര ചെയ്തു
  rationale: דֶּרֶךְ സ്ഥലനാമത്തോടൊപ്പം വരുമ്പോൾ ‘വഴിയായി’ എന്ന അർഥം നൽകുന്നു. הָעֲרָבָה ഭൂമിശാസ്ത്രപരമായ പേരായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: כָּל הַלָּיְלָה
  choice: രാത്രി മുഴുവൻ
  rationale: ഹീബ്രു സമയപ്രയോഗത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
