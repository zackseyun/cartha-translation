  text: וַ֠/יָּבִאוּ אֶת רֹ֨אשׁ אִֽישׁ בֹּ֥שֶׁת אֶל דָּוִד֮ חֶבְרוֹן֒ וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּֽה רֹ֣אשׁ אִֽישׁ בֹּ֗שֶׁת בֶּן שָׁאוּל֙ אֹֽיִבְ/ךָ֔ אֲשֶׁ֥ר בִּקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וַ/יִּתֵּ֣ן יְ֠הוָה לַֽ/אדֹנִ֨/י הַ/מֶּ֤לֶךְ נְקָמוֹת֙ הַ/יּ֣וֹם הַ/זֶּ֔ה מִ/שָּׁא֖וּל וּ/מִ/זַּרְעֽ/וֹ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/008.yaml
  text: They brought the head of Ish-bosheth to David at Hebron[a], and said to the king, “Here is the head of Ish-bosheth son of Saul, your enemy, who sought your life. Yahweh has given my lord the king vengeance today on Saul and on his offspring.”
translation:
  language: ml
  text: 'അവർ ഈശ്-ബോശെത്തിന്റെ തല ഹെബ്രോനിൽ ദാവീദിന്റെ അടുക്കൽ കൊണ്ടുവന്ന് രാജാവിനോടു പറഞ്ഞു: “ഇതാ, ശൗലിന്റെ മകനും അങ്ങയുടെ ശത്രുവും അങ്ങയെ കൊല്ലാൻ ശ്രമിച്ചവനുമായ ഈശ്-ബോശെത്തിന്റെ തല! യഹ്വേ ഇന്ന് എന്റെ യജമാനനായ രാജാവിന് ശൗലിനോടും അവന്റെ സന്തതിയോടും പ്രതികാരം നൽകിയിരിക്കുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രതികാരം” എന്നതിന്റെ എബ്രായപദം ഇവിടെ ബഹുവചനത്തിലാണ്; അത് തീവ്രതയെയോ പ്രതികാരപ്രവൃത്തികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: അവർ ... കൊണ്ടുവന്ന്
  rationale: വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന wayyiqtol രൂപം മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാശൃംഖലയായി നൽകി.
- source_word: רֹאשׁ
  choice: തല
  rationale: സന്ദർഭത്തിൽ വെട്ടിമാറ്റിയ ഭൗതിക തല തന്നെയാണ് ഉദ്ദേശിക്കുന്നത്; രൂപകാർഥമില്ല.
- source_word: אִישׁ בֹּשֶׁת
  choice: ഈശ്-ബോശെത്ത്
  rationale: മസോററ്റിക് പാഠത്തിലെ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ഇവിടെ ഇല്ലാത്ത എശ്ബാൽ എന്ന രൂപം പകരം വെച്ചിട്ടില്ല.
- source_word: חֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: സ്ഥലപ്പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: കാണിച്ചുകൊണ്ടുള്ള അവതരണത്തിന്റെ ദൈക്തിക ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֹיִבְךָ
  choice: അങ്ങയുടെ ശത്രു
  rationale: രാജാവിനോടുള്ള ആദരസൂചക അഭിസംബോധനയോടൊപ്പം സാധാരണ നാമത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: בִּקֵּשׁ אֶת נַפְשֶׁךָ
  choice: അങ്ങയുടെ ജീവൻ അപഹരിക്കാൻ ശ്രമിച്ച
  rationale: נפשׁ ഉൾപ്പെടുന്ന എബ്രായ ശൈലി ഇവിടെ ജീവൻ എടുത്തുകളയാൻ ശ്രമിക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: יְהוָה
  choice: യഹ്വേ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവിനു
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും രാജസദസ്സിലെ ആദരസൂചക അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: נְקָמוֹת
  choice: പ്രതികാരം ചെയ്ത് ... നീതി നേടിക്കൊടുത്തിരിക്കുന്നു
  rationale: പ്രതികാരനടപടികളിലൂടെ അവകാശം സ്ഥാപിക്കുക എന്ന വാക്യത്തിന്റെ ഫലാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; മൂലത്തിലെ ബഹുവചനരൂപം അടിക്കുറിപ്പിൽ ചൂണ്ടിക്കാട്ടുന്നു.
- source_word: מִשָּׁאוּל וּמִזַּרְעוֹ
  choice: ശൗലിനോടും അവന്റെ സന്തതിയോടും
  rationale: מן ഇവിടെ പ്രതികാരം ഏവർക്കെതിരെയാണെന്ന് സൂചിപ്പിക്കുന്നു; זרעയുടെ വംശപരമായ കൂട്ടാർഥത്തിന് ‘സന്തതി’ യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നേരിട്ട് സംരക്ഷിക്കുന്നു; പദവിപ്പേര് പകരം വെക്കുന്നില്ല.
- issue: കൊലയാളികൾ ദൈവിക പ്രതികാരം അവകാശപ്പെടുന്നതിന്റെ വിലയിരുത്തൽ
  choice: അവരുടെ അവകാശവാദം വ്യാഖ്യാനപരമായ തിരുത്തലില്ലാതെ നേരിട്ടുള്ള സംഭാഷണമായി നിലനിർത്തി
  alternative: ‘അവരുടെ അഭിപ്രായത്തിൽ’ എന്നോ ‘ദൈവം പ്രതികാരം ചെയ്തുവെന്ന് അവർ കരുതി’ എന്നോ ചേർക്കുക
  rationale: മൂലപാഠം ഈ വാക്കുകൾ കൊലയാളികളുടെ സംഭാഷണമായാണ് നൽകുന്നത്. തുടർന്നുള്ള ദാവീദിന്റെ പ്രതികരണം വായനക്കാരനെ വിലയിരുത്താൻ സഹായിക്കുന്നു; വിവർത്തനം മുൻകൂട്ടി വിധി ചേർക്കരുത്.
- issue: נְקָמוֹת എന്ന ബഹുവചനത്തിന്റെ അർഥം
  choice: പ്രതികാരം ചെയ്ത് ... നീതി നേടിക്കൊടുത്തിരിക്കുന്നു
  alternative: പ്രതികാരങ്ങൾ നൽകി
  rationale: രൂപപരമായ ബഹുവചനം മലയാളത്തിൽ അക്ഷരാർഥമായി നൽകിയാൽ അസ്വാഭാവികമാകും; തീവ്രതയെയോ പ്രതികാരപ്രവൃത്തികളെയോ സൂചിപ്പിക്കുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. രാജാവിനോടുള്ള സംഭാഷണത്തിൽ ‘അങ്ങ്’ എന്ന ആദരരൂപം ഉപയോഗിച്ചു. വാക്യത്തിന്റെ ദീർഘമായ എബ്രായ ഘടന നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ക്രിയാബന്ധങ്ങൾ സ്വാഭാവികമാക്കി; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
