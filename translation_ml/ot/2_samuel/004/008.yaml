  to: 'അവർ ഈശ്-ബോശെത്തിന്റെ തല ഹെബ്രോനിൽ ദാവീദിന്റെ അടുക്കൽ കൊണ്ടുവന്ന് രാജാവിനോടു പറഞ്ഞു: “ഇതാ, ശൗലിന്റെ മകനും അങ്ങയുടെ ശത്രുവും അങ്ങയെ കൊല്ലാൻ ശ്രമിച്ചവനുമായ ഈശ്-ബോശെത്തിന്റെ തല! യഹ്വേ ഇന്ന് എന്റെ യജമാനനായ രാജാവിന് ശൗലിനോടും അവന്റെ സന്തതിയോടും പ്രതികാരം നൽകിയിരിക്കുന്നു.”[a]'
