id: 2SA.4.2
reference: 2 Samuel 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁנֵ֣י אֲנָשִׁ֣ים שָׂרֵֽי גְדוּדִ֣ים הָי֪וּ בֶן שָׁא֟וּל שֵׁם֩ הָ/אֶחָ֨ד בַּֽעֲנָ֜ה וְ/שֵׁ֧ם הַ/שֵּׁנִ֣י רֵכָ֗ב בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֶֽרֹתִ֖י מִ/בְּנֵ֣י בִנְיָמִ֑ן כִּ֚י גַּם בְּאֵר֔וֹת תֵּחָשֵׁ֖ב עַל בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
translation:
  language: ml
  text: ശൗലിന്റെ മകനു കൊള്ളസംഘങ്ങളുടെ നായകന്മാരായ രണ്ടു പുരുഷന്മാർ ഉണ്ടായിരുന്നു. ഒരാളുടെ പേര് ബാനാ എന്നും രണ്ടാമന്റെ പേര് രേഖാബ് എന്നും ആയിരുന്നു. അവർ ബെന്യാമീന്റെ മക്കളിൽപ്പെട്ട ബേരോത്ത്യനായ രിമ്മോന്റെ പുത്രന്മാരായിരുന്നു; ബേരോത്തും ബെന്യാമീനിൽപ്പെട്ടതായി കണക്കാക്കപ്പെട്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബെന്യാമീനോടു ചേർന്നതായി പരിഗണിക്കപ്പെട്ടിരുന്നു.”
    reason: കണക്കാക്കുക/പരിഗണിക്കുക എന്നും ഗോത്രത്തോടുള്ള ചേർച്ച എന്നും വ്യാഖ്യാനിക്കാവുന്ന תֵּחָשֵׁב עַל എന്ന പ്രയോഗത്തിന്റെ പദവികൽപം.
lexical_decisions:
- source_word: שָׂרֵי גְדוּדִים
  choice: കൊള്ളസംഘങ്ങളുടെ നായകന്മാർ
  rationale: שָׂרֵי എന്നത് നേതാക്കളെയോ സേനാനായകരെയോ സൂചിപ്പിക്കുന്നു; גְדוּדִים ഇവിടെ ക്രമബദ്ധമായ സൈനികവിഭാഗങ്ങളെക്കാൾ കൊള്ളയടിക്കുന്ന സംഘങ്ങൾ എന്ന അർഥം നൽകുന്നതിനാൽ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: בֶן שָׁאוּל
  choice: ശൗലിന്റെ മകൻ
  rationale: മുൻവാക്യത്തിലെ ഈശ്-ബോശെത്തിനെ സൂചിപ്പിക്കുന്ന ഏകവചന ബന്ധപദം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: ഒരാളുടെ പേര് ... എന്നും രണ്ടാമന്റെ പേര് ... എന്നും
  rationale: എബ്രായത്തിലെ ആവർത്തനപരമായ നാമകരണരീതിയും ‘രണ്ടാമൻ’ എന്ന കൃത്യമായ വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: בְּנֵי רִמּוֹן
  choice: രിമ്മോന്റെ പുത്രന്മാർ
  rationale: രണ്ടുപേരുടെയും പിതൃബന്ധം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: הַבְּאֶרֹתִי
  choice: ബേരോത്ത്യൻ
  rationale: ബേരോത്ത് സ്വദേശിയെയോ അതിൽപ്പെട്ടയാളെയോ സൂചിപ്പിക്കുന്ന ജനപദവിശേഷണം മലയാളത്തിലെ സ്വാഭാവിക രൂപത്തിൽ നൽകി.
- source_word: מִבְּנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ മക്കളിൽപ്പെട്ട
  rationale: ഗോത്രവംശത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ബന്ധം വ്യക്തമായി അറിയിച്ചു.
- source_word: תֵּחָשֵׁב עַל בִּנְיָמִן
  choice: ബെന്യാമീനിൽപ്പെട്ടതായി കണക്കാക്കപ്പെട്ടിരുന്നു
  rationale: നിഫാൽ രൂപത്തിന്റെ ‘ഉൾപ്പെട്ടതായി/ബന്ധപ്പെട്ടതായി കണക്കാക്കുക’ എന്ന അർഥവും ഗോത്രപരമായ ഉൾപ്പെടുത്തലും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; ബന്ധങ്ങളും വിശദീകരണക്രമവും നിലനിർത്തി.
