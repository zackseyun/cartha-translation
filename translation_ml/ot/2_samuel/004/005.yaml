source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ בְּנֵֽי רִמּ֤וֹן הַ/בְּאֵֽרֹתִי֙ רֵכָ֣ב וּ/בַעֲנָ֔ה וַ/יָּבֹ֨אוּ֙ כְּ/חֹ֣ם הַ/יּ֔וֹם אֶל בֵּ֖ית אִ֣ישׁ בֹּ֑שֶׁת וְ/ה֣וּא שֹׁכֵ֔ב אֵ֖ת מִשְׁכַּ֥ב הַֽ/צָּהֳרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
translation:
  language: ml
  text: ബേരോത്യനായ രിമ്മോന്റെ പുത്രന്മാരായ രേഖാബും ബാനയും പുറപ്പെട്ട്, പകലിന്റെ ചൂടേറിയ സമയത്ത് ഈശ്-ബോശെത്തിന്റെ വീട്ടിലെത്തി. അവൻ ഉച്ചവിശ്രമത്തിനായി കിടക്കുകയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഉച്ചയിലെ കിടപ്പ്.’ അതായത്, ഉച്ചസമയത്തെ വിശ്രമം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: ബെയേരോത്ത്യനായ രിമ്മോന്റെ പുത്രന്മാരായ
  rationale: בְּנֵי എന്നത് ഇവിടെ പിന്നാലെ പേരെടുത്തുപറയുന്ന രേഖാബിനെയും ബാനയെയും രിമ്മോന്റെ യഥാർഥ പുത്രന്മാരായി സൂചിപ്പിക്കുന്നതിനാൽ കുടുംബബന്ധത്തിന്റെ നേരിട്ടുള്ള അർഥം സ്വീകരിച്ചു.
- source_word: רֵכָב וּבַעֲנָה
  choice: രേഖാബും ബാനയും
  rationale: എബ്രായ വ്യക്തിനാമങ്ങളുടെ ശബ്ദരൂപം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: പുറപ്പെട്ട് ... എത്തി
  rationale: രണ്ട് തുടർച്ചയായ ചലനക്രിയകളെയും മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ സൂക്ഷിക്കുന്നു; ആദ്യത്തേത് യാത്ര പുറപ്പെടലും രണ്ടാമത്തേത് ലക്ഷ്യസ്ഥാനത്തെത്തലും വ്യക്തമാക്കുന്നു.
- source_word: כְּחֹם הַיּוֹם
  choice: പകലിന്റെ ചൂടേറിയ സമയത്ത്
  rationale: വാക്യത്തിന്റെ അക്ഷരാർഥത്തോടു ചേർന്നുനിൽക്കുകയും ദിവസത്തിലെ ഉഷ്ണമേറിയ സമയത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ‘ഉച്ചയ്ക്ക്’ എന്ന് മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
- source_word: בֵּית אִישׁ־בֹּשֶׁת
  choice: ഈശ്-ബോശെത്തിന്റെ വീട്ടിൽ
  rationale: എബ്രായ സംയുക്തഘടനയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: וְהוּא שֹׁכֵב אֵת מִשְׁכַּב הַצָּהֳרָיִם
  choice: അപ്പോൾ അവൻ ഉച്ചവിശ്രമത്തിനായി കിടക്കുകയായിരുന്നു
  rationale: സന്ദർഭകാലബന്ധം ‘അപ്പോൾ’ എന്നു വ്യക്തമാക്കി, ‘ഉച്ചയിലെ കിടപ്പ്’ എന്ന അക്ഷരാർഥപ്രയോഗത്തെ സ്വാഭാവികമായി ‘ഉച്ചവിശ്രമം’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പോയി വന്നു’ എന്ന ആശയക്കുഴപ്പമുണ്ടാക്കാവുന്ന അക്ഷരാനുകരണം ഒഴിവാക്കി, എബ്രായത്തിലെ തുടർച്ചയായ യാത്രയും എത്തിച്ചേരലും ‘പുറപ്പെട്ട് ... എത്തി’ എന്നു വ്യക്തമാക്കി. എല്ലാ പേരുകളും എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
