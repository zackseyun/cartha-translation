  text: וַ/יְצַו֩ דָּוִ֨ד אֶת הַ/נְּעָרִ֜ים וַ/יַּהַרְג֗וּ/ם וַֽ/יְקַצְּצ֤וּ אֶת יְדֵי/הֶם֙ וְ/אֶת רַגְלֵי/הֶ֔ם וַ/יִּתְל֥וּ עַל הַ/בְּרֵכָ֖ה בְּ/חֶבְר֑וֹן וְ/אֵ֨ת רֹ֤אשׁ אִֽישׁ בֹּ֨שֶׁת֙ לָקָ֔חוּ וַ/יִּקְבְּר֥וּ בְ/קֶֽבֶר אַבְנֵ֖ר בְּ/חֶבְרֽוֹן־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
translation:
  language: ml
  text: അപ്പോൾ ദാവീദ് യുവാക്കളോടു കല്പിച്ചു; അവർ അവരെ കൊന്നു. അവരുടെ കൈകളും കാലുകളും വെട്ടിമാറ്റി, ഹെബ്രോനിലെ കുളത്തിനരികിൽ അവരെ തൂക്കിയിട്ടു.[a] എന്നാൽ ഈശ്-ബോശെത്തിന്റെ തല അവർ എടുത്ത് ഹെബ്രോനിൽ അബ്നേരിന്റെ കല്ലറയിൽ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുളത്തിങ്കൽ അവരെ തൂക്കിയിട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ ഉപസർഗം ഇവിടെ കൂടുതൽ പൊതുവായി സ്ഥലം സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו דָּוִד אֶת הַנְּעָרִים
  choice: അപ്പോൾ ദാവീദ് യുവാക്കളോടു കല്പിച്ചു
  rationale: വാവ്-തുടർരൂപം ആഖ്യാനത്തിന്റെ അടുത്ത ഘട്ടം സൂചിപ്പിക്കുന്നതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമാണ്. נְעָרִים എന്നതിന് ‘യുവാക്കൾ’ എന്നും ‘ഭൃത്യന്മാർ/പരിചാരകർ’ എന്നും അർഥമാകാം; സന്ദർഭം രണ്ടാമത്തേതിനെ പിന്തുണയ്ക്കുന്നുവെങ്കിലും മൂലത്തിലെ അർഥവ്യാപ്തി നിലനിർത്താൻ ‘യുവാക്കൾ’ തെരഞ്ഞെടുത്തു.
- source_word: וַיַּהַרְגוּם
  choice: അവർ അവരെ കൊന്നു
  rationale: הרג എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘വധശിക്ഷ നടപ്പാക്കി’ എന്ന വ്യാഖ്യാനാത്മകമായ നീതിന്യായഭാഷ ചേർത്തിട്ടില്ല.
- source_word: וַיְקַצְּצוּ אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: അവരുടെ കൈകളും കാലുകളും വെട്ടിമാറ്റി
  rationale: קצץ എന്നത് വെട്ടിക്കളയുക/വെട്ടിമാറ്റുക എന്നാണ്. രണ്ടു ശരീരഭാഗങ്ങളും വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി ചുരുക്കുകയും ചെയ്തു.
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  choice: കുളത്തിനരികിൽ അവരെ തൂക്കിയിട്ടു
  rationale: תלה എന്നതിന് ‘തൂക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം നൽകി. עַל ഇവിടെ കുളത്തോടു ബന്ധപ്പെട്ട സ്ഥലം സൂചിപ്പിക്കാമെങ്കിലും ‘മുകളിൽ’ എന്ന വായനയും സാധ്യമായതിനാൽ പാഠത്തിൽ സ്വാഭാവികമായ സ്ഥലസൂചനയും അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യതയും നൽകി.
- source_word: בְּחֶבְרוֹן
  choice: ഹെബ്രോനിലെ / ഹെബ്രോനിൽ
  rationale: കുളത്തെ വിശേഷിപ്പിക്കുമ്പോൾ ‘ഹെബ്രോനിലെ’ എന്നും ശവസംസ്കാരസ്ഥലം പറയുമ്പോൾ ‘ഹെബ്രോനിൽ’ എന്നും മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യഘടന അനുസരിച്ചു.
- source_word: רֹאשׁ אִישׁ בֹּשֶׁת
  choice: ഈശ്-ബോശെത്തിന്റെ തല
  rationale: എബ്രായത്തിലെ സമാസബന്ധം നേരിട്ട് പുനരാവിഷ്കരിച്ചു; വ്യക്തിനാമം മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: לָקָחוּ
  choice: അവർ എടുത്ത്
  rationale: לקח എന്ന സാധാരണ ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘എടുക്കുക’ നിലനിർത്തി; ‘വീണ്ടെടുത്തു’ പോലുള്ള അധിക ആശയം ചേർത്തിട്ടില്ല.
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  choice: അബ്നേരിന്റെ കല്ലറയിൽ അടക്കം ചെയ്തു
  rationale: קבר എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ അർഥം ‘കല്ലറ’ എന്നും ക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ ‘അടക്കം ചെയ്തു’ എന്നും നൽകി.
theological_decisions:
- issue: ദാവീദിന്റെ നടപടിയുടെ ധാർമികമോ ദൈവശാസ്ത്രപരമോ ആയ വിലയിരുത്തൽ
  choice: സംഭവം മൂലപാഠത്തിലെ കാഠിന്യത്തോടെ വിവരിക്കുക; അധികമായ ധാർമിക വിലയിരുത്തൽ ചേർക്കാതിരിക്കുക.
  alternative: ‘വധശിക്ഷ നടപ്പാക്കി’ തുടങ്ങിയ നീതിന്യായപരമായ പദങ്ങൾ ഉപയോഗിച്ച് നടപടിയെ വ്യക്തമായി ഔദ്യോഗിക ശിക്ഷയായി വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം ദാവീദിന്റെ കല്പനയും കൊലയും ശരീരഭാഗങ്ങൾ വെട്ടിമാറ്റിയതും പൊതുപ്രദർശനവും വിവരിക്കുന്നു; എന്നാൽ ഈ വരിയിൽ അതിനെക്കുറിച്ചുള്ള വ്യക്തമായ ദൈവശാസ്ത്രപരമായ വിധി പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ വിവരണത്തിന്റെ സംഘർഷവും കാഠിന്യവും പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. അക്രമത്തിന്റെ വിവരണം മൃദൂകരിക്കുകയോ കൂടുതൽ രൂക്ഷമാക്കുകയോ ചെയ്തിട്ടില്ല. വ്യക്തിനാമങ്ങൾ ‘ദാവീദ്’, ‘ഹെബ്രോൻ’, ‘ഈശ്-ബോശെത്ത്’, ‘അബ്നേർ’ എന്ന സാധാരണ ബൈബിൾ-മലയാള രൂപങ്ങളിൽ നൽകി.
