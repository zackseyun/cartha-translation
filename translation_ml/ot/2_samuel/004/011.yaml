source:
  edition: WLC
  text: אַ֞ף כִּֽי אֲנָשִׁ֣ים רְשָׁעִ֗ים הָרְג֧וּ אֶת אִישׁ צַדִּ֛יק בְּ/בֵית֖/וֹ עַל מִשְׁכָּב֑/וֹ וְ/עַתָּ֗ה הֲ/ל֨וֹא אֲבַקֵּ֤שׁ אֶת דָּמ/וֹ֙ מִ/יֶּדְ/כֶ֔ם וּ/בִעַרְתִּ֥י אֶתְ/כֶ֖ם מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
translation:
  language: ml
  text: എത്രയോ അധികമായി, ദുഷ്ടന്മാർ നീതിമാനായ ഒരാളെ അവന്റെ സ്വന്തം വീട്ടിൽ, അവന്റെ കിടക്കയിൽവെച്ചു കൊന്നിരിക്കുമ്പോൾ, ഇപ്പോൾ ഞാൻ അവന്റെ രക്തം നിങ്ങളുടെ കൈയിൽനിന്ന് ആവശ്യപ്പെടുകയും[a] നിങ്ങളെ ദേശത്തുനിന്ന് നീക്കിക്കളയുകയും[b] ചെയ്യാതിരിക്കുമോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ രക്തത്തിന് നിങ്ങളെ ഉത്തരവാദികളാക്കുകയും.’ എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘അവന്റെ രക്തം നിങ്ങളുടെ കൈയിൽനിന്ന് ആവശ്യപ്പെടുക’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ദേശത്തുനിന്ന് നീക്കിക്കളയുക’ എന്നത് കൊലയാളികളെ ന്യായവിധിയിലൂടെ ഇല്ലാതാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആചാരപരമായ ശുദ്ധീകരണം മാത്രമല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: എങ്കിൽപ്പിന്നെ
  rationale: മുൻവാക്യത്തിലെ ചെറിയ സംഭവത്തിൽനിന്ന് ഇപ്പോഴത്തെ കൂടുതൽ ഗുരുതരമായ സംഭവത്തിലേക്കുള്ള ന്യായവാദം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֲנָשִׁים רְשָׁעִים
  choice: ദുഷ്ടന്മാർ
  rationale: പ്രയോഗത്തിലെ വ്യക്തമായ ധാർമിക കുറ്റവിധി ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: הָרְגוּ
  choice: കൊന്നിരിക്കെ
  rationale: സാധാരണ ‘കൊല്ലുക’ എന്ന ക്രിയയുടെ അർഥം നിലനിർത്തുന്നു; സന്ദർഭം കൊലപാതകമാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും മൂലപദത്തിൽ ഇല്ലാത്ത പ്രത്യേക നിയമപദം ചേർക്കുന്നില്ല.
- source_word: אִישׁ צַדִּיק
  choice: നീതിമാനായ ഒരാളെ
  rationale: צַדִּיק എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘നീതിമാൻ’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘നിരപരാധി’ എന്ന് വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: בְּבֵיתוֹ עַל מִשְׁכָּבוֹ
  choice: അവന്റെ സ്വന്തം വീട്ടിൽ, അവന്റെ കിടക്കയിൽവെച്ചു
  rationale: ഇരയുടെ സ്വകാര്യവും സുരക്ഷിതവുമായ ഇടത്തുവെച്ചാണ് കൊല നടന്നതെന്ന മൂലവാക്യത്തിന്റെ ഊന്നൽ വ്യക്തമാക്കുന്നു.
- source_word: הֲלוֹא אֲבַקֵּשׁ אֶת דָּמוֹ מִיֶּדְכֶם
  choice: അവന്റെ രക്തം നിങ്ങളുടെ കൈയിൽനിന്ന് ഞാൻ ആവശ്യപ്പെടുകയും ചെയ്യാതിരിക്കുമോ
  rationale: രക്തച്ചൊരിച്ചിലിന് ഉത്തരവാദിത്വം ചോദിക്കുന്ന എബ്രായ നിയമപ്രയോഗത്തിന്റെ ദൃശ്യഭാഷയും വാചകത്തിലെ അലങ്കാരചോദ്യവും നിലനിർത്തുന്നു.
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  choice: നിങ്ങളെ ദേശത്തുനിന്ന് നീക്കിക്കളയുകയും
  rationale: ഇവിടെ בער സൂചിപ്പിക്കുന്ന ന്യായവിധിയിലൂടെയുള്ള സമ്പൂർണ നീക്കം വ്യക്തമായി നൽകുന്നു; ആചാരപരമായ ശുദ്ധീകരണം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: രക്തത്തിന് ഉത്തരവാദിത്വം ചോദിക്കുന്ന നിയമപ്രയോഗം ‘പ്രതികാരം ചെയ്യുക’ എന്നു വ്യാഖ്യാനിക്കണമോ എന്നത്
  choice: ‘അവന്റെ രക്തം നിങ്ങളുടെ കൈയിൽനിന്ന് ആവശ്യപ്പെടുക’ എന്ന മൂലരൂപം പ്രധാനവാചകത്തിൽ നിലനിർത്തി
  alternative: ‘അവന്റെ രക്തത്തിന് നിങ്ങളെ ഉത്തരവാദികളാക്കുക’
  rationale: ഇത് വ്യക്തിപരമായ പ്രതികാരത്തിൽ മാത്രം ഒതുങ്ങാത്ത ന്യായവിധിപരമായ പ്രയോഗമാണ്. ‘രക്തം’, ‘കൈ’ എന്നീ ദൃശ്യങ്ങൾ പഴയനിയമത്തിലെ നിയമഭാഷയുടെ ഗൗരവം സംരക്ഷിക്കുന്നു.
- issue: ‘ദേശത്തുനിന്ന് നീക്കിക്കളയുക’ എന്നതിന്റെ സ്വഭാവം
  choice: കുറ്റവാളികളെ ന്യായവിധിയിലൂടെ ദേശത്തുനിന്ന് ഇല്ലാതാക്കുന്ന അർഥം
  alternative: ആചാരപരമായി ശുദ്ധീകരിക്കുക
  rationale: സന്ദർഭത്തിൽ ദാവീദ് കൊലയാളികൾക്കു വിധി നടപ്പാക്കുകയാണ്; ഇത് ആചാരശുദ്ധീകരണം മാത്രമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘എങ്കിൽപ്പിന്നെ’ മുൻവാക്യത്തിൽനിന്നുള്ള കൂടുതൽ ശക്തമായ നിഗമനം വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു. മൂലത്തിലെ രക്തം-കൈ നിയമപ്രയോഗം അടിക്കുറിപ്പിന്റെ സഹായത്തോടെ പ്രധാനവാചകത്തിൽ സംരക്ഷിച്ചു.
