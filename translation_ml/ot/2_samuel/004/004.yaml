  text: וְ/לִ/יהֽוֹנָתָן֙ בֶּן שָׁא֔וּל בֵּ֖ן נְכֵ֣ה רַגְלָ֑יִם בֶּן חָמֵ֣שׁ שָׁנִ֣ים הָיָ֡ה בְּ/בֹ֣א שְׁמֻעַת֩ שָׁא֨וּל וִ/יהֽוֹנָתָ֜ן מִֽ/יִּזְרְעֶ֗אל וַ/תִּשָּׂאֵ֤/הוּ אֹֽמַנְתּ/וֹ֙ וַ/תָּנֹ֔ס וַ/יְהִ֞י בְּ/חָפְזָ֥/הּ לָ/נ֛וּס וַ/יִּפֹּ֥ל וַ/יִּפָּסֵ֖חַ וּ/שְׁמ֥/וֹ מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
translation:
  language: ml
  text: ശൗലിന്റെ മകനായ യോനാഥാന് കാലുകൾക്ക് വൈകല്യമുള്ള ഒരു മകൻ ഉണ്ടായിരുന്നു.[a] ശൗലിനെയും യോനാഥാനെയും കുറിച്ചുള്ള വാർത്ത യിസ്രെയേലിൽനിന്ന് എത്തിയപ്പോൾ അവന് അഞ്ചു വയസ്സായിരുന്നു. അവന്റെ പരിചാരിക അവനെ എടുത്ത് ഓടിപ്പോയി. അവൾ ഓടിപ്പോകാൻ തിടുക്കപ്പെട്ടപ്പോൾ അവൻ വീണു മുടന്തനായിത്തീർന്നു. അവന്റെ പേര് മെഫീബോശെത്ത് എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രണ്ടു കാലുകൾക്കും മുടന്തുള്ളവൻ.” എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ കാലുകളിൽ ബാധിക്കപ്പെട്ടവനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  choice: കാലുകൾക്ക് വൈകല്യമുള്ള
  rationale: കാലുകളിലെ ശാരീരിക വൈകല്യം മാന്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ദ്വിവചനരൂപം സൂചിപ്പിക്കുന്ന രണ്ടു കാലുകളെന്ന ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֶּן חָמֵשׁ שָׁנִים
  choice: അവന് അഞ്ചു വയസ്സായിരുന്നു
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן
  choice: ശൗലിനെയും യോനാഥാനെയും കുറിച്ചുള്ള വാർത്ത ... എത്തിയപ്പോൾ
  rationale: വാർത്തയുടെ ഉള്ളടക്കം മരണമായിരുന്നുവെന്ന് വാക്യത്തിൽ ചേർക്കാതെ, മൂലപാഠത്തിലെ പൊതുവായ പരാമർശം നിലനിർത്തുന്നു.
- source_word: מִיִּזְרְעֶאל
  choice: യിസ്രെയേലിൽനിന്ന്
  rationale: വാർത്ത വന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഉറവിടാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: אֹמַנְתּוֹ
  choice: അവന്റെ പരിചാരിക
  rationale: കുട്ടിയെ പരിചരിക്കുകയും വളർത്തുകയും ചെയ്ത സ്ത്രീയെ ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമായി മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു; ‘വളർത്തമ്മ’ എന്നതിലുണ്ടാകാവുന്ന നിയമപരമായ ദത്തെടുക്കൽധ്വനി ഒഴിവാക്കുന്നു.
- source_word: וַתִּשָּׂאֵהוּ
  choice: അവനെ എടുത്തുകൊണ്ട്
  rationale: കുട്ടിയെ ഉയർത്തിയെടുത്ത് കൊണ്ടുപോയ പ്രവർത്തനം സന്ദർഭോചിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַתָּנֹס
  choice: ഓടിപ്പോയി
  rationale: അപകടത്തിൽനിന്നുള്ള അടിയന്തര പലായനം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בְּחָפְזָהּ לָנוּס
  choice: ഓടിപ്പോകാനുള്ള തിടുക്കത്തിൽ
  rationale: പലായനത്തിന്റെ ലക്ഷ്യവും അതിലെ തിടുക്കവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיִּפֹּל
  choice: അവൻ വീണു
  rationale: തുടർന്നുള്ള പുല്ലിംഗ ഏകവചന ക്രിയയോടൊത്തു വീണത് കുട്ടിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וַיִּפָּסֵחַ
  choice: മുടന്തനായിത്തീർന്നു
  rationale: വീഴ്ചയുടെ ഫലമായി ആ അവസ്ഥയിലായെന്ന ആരംഭകവും ഫലസൂചകവുമായ അർഥം സംരക്ഷിക്കുന്നു.
