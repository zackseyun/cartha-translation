  naturalness: മലയാളം പൊതുവേ സ്വാഭാവികവും മാന്യവുമാണ്. "അവൾ ഓടിപ്പോകാൻ തിടുക്കപ്പെട്ടപ്പോൾ" എന്നു പറഞ്ഞാൽ തിടുക്കപ്പെട്ടത് പരിചാരികയാണെന്നും വീണത് കുട്ടിയാണെന്നും കൂടുതൽ വ്യക്തമായി, സ്വാഭാവികമായി അറിയാം.
