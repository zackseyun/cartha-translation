  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് യാബേശ്-ഗിലെയാദിലെ പുരുഷന്മാരുടെ അടുക്കലേക്ക് ദൂതന്മാരെ അയച്ചു; അവരോടു പറഞ്ഞു: “നിങ്ങൾ നിങ്ങളുടെ യജമാനനായ ശൗലിനോടു ഈ ദയ[b] കാണിക്കുകയും അദ്ദേഹത്തെ സംസ്കരിക്കുകയും ചെയ്തതിനാൽ, യാഹ്‌വേയാൽ അനുഗ്രഹിക്കപ്പെട്ടവരാണ് നിങ്ങൾ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യാഹ്‌വേ നിങ്ങളെ അനുഗ്രഹിക്കട്ടെ.”'
    reason: എബ്രായ അനുഗ്രഹസൂത്രം പ്രഖ്യാപനമായും അനുഗ്രഹാശംസയായും ഗ്രഹിക്കാവുന്നതാണ്.
  - marker: b
    text: എബ്രായത്തിൽ ഹേസെദ്; ദയ, വിശ്വസ്തത, അചഞ്ചലസ്നേഹം എന്നീ പരസ്പരബന്ധമുള്ള ആശയങ്ങളെ ഈ പദം സൂചിപ്പിക്കാം.
    reason: മൂലപദത്തിന്റെ വിശാലമായ അർഥപരിധി ഒരൊറ്റ മലയാളപദത്തിൽ പൂർണമായി ഉൾക്കൊള്ളാനാവില്ല.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഈ ചരിത്രസന്ദർഭത്തിൽ ദാവീദ് അയച്ച മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; സ്വർഗീയ ദൂതന്മാരെയല്ല.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: ഗിലെയാദിലെ യാബേശിലെ പുരുഷന്മാർ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തിക്കൊണ്ട് സ്ഥലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  choice: യഹോവയാൽ അനുഗ്രഹിക്കപ്പെട്ടവരാണ് നിങ്ങൾ
  rationale: നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ പ്രഖ്യാപനസ്വഭാവം നേരിട്ട് നിലനിർത്തുന്നു; לַיהוָה അനുഗ്രഹത്തിന്റെ ഉറവിടം സൂചിപ്പിക്കുന്നതായി ‘യഹോവയാൽ’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: חֶסֶד
  choice: വിശ്വസ്തദയ
  rationale: ശൗലിനെ സംസ്കരിച്ച പ്രവൃത്തിയിൽ പ്രകടമായ ദയയുടെയും വിശ്വസ്തതയുടെയും സംയുക്തഭാവം ഈ സന്ദർഭത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֲדֹנֵיכֶם
  choice: നിങ്ങളുടെ യജമാനൻ
  rationale: ശൗൽ അവർക്കുള്ള ഭരണാധികാരിയും മേലധികാരിയും ആയിരുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: עִם שָׁאוּל
  choice: ശൗലിനോട്
  rationale: അക്ഷരാർഥത്തിലെ ‘കൂടെ’ എന്നതിനു പകരം, ദയ കാണിക്കുന്നതോടൊപ്പം സ്വാഭാവികമായി ചേരുന്ന മലയാള പ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  choice: അദ്ദേഹത്തെ സംസ്കരിക്കുകയും ചെയ്തു
  rationale: പ്രശംസിക്കപ്പെടുന്ന പൂർത്തിയായ പ്രവൃത്തി വ്യക്തവും ആദരസൂചകവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയായി മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: בְּרֻכִים എന്ന അനുഗ്രഹവാക്യത്തിന്റെ ഭാവം
  choice: അനുഗ്രഹിക്കപ്പെട്ടവരാണ് നിങ്ങൾ
  alternative: യഹോവ നിങ്ങളെ അനുഗ്രഹിക്കട്ടെ
  rationale: എബ്രായ നിഷ്ക്രിയ കൃദന്തം പ്രാഥമികമായി ഒരു പ്രഖ്യാപനമായി വിവർത്തനം ചെയ്തു; അനുഗ്രഹാശംസയായുള്ള വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘അദ്ദേഹം’ ശൗലിനെക്കുറിച്ചുള്ള ആദരസൂചക പരാമർശമാണ്; വാക്യഘടന മൂലപാഠത്തിന്റെ കാരണബന്ധവും അനുഗ്രഹപ്രഖ്യാപനവും നിലനിർത്തുന്നു.
