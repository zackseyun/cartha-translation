  text: וַ/יֹּ֧אמֶר ל֣/וֹ אַבְנֵ֗ר נְטֵ֤ה לְ/ךָ֙ עַל יְמִֽינְ/ךָ֙ א֣וֹ עַל שְׂמֹאלֶ֔/ךָ וֶ/אֱחֹ֣ז לְ/ךָ֗ אֶחָד֙ מֵֽ/הַ/נְּעָרִ֔ים וְ/קַח לְ/ךָ֖ אֶת חֲלִצָת֑/וֹ וְ/לֹֽא אָבָ֣ה עֲשָׂהאֵ֔ל לָ/ס֖וּר מֵ/אַחֲרָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
translation:
  language: ml
  text: 'അബ്നേർ അവനോടു പറഞ്ഞു: “നിന്റെ വലത്തേക്കോ ഇടത്തേക്കോ മാറി, യുവാക്കളിൽ ഒരാളെ പിടിച്ച് അവന്റെ യുദ്ധസാമഗ്രികൾ നിനക്കായി എടുത്തുകൊള്ളുക.”[a] എന്നാൽ അസാഹേൽ അവനെ പിന്തുടരുന്നതിൽനിന്ന് പിന്മാറാൻ തയ്യാറായില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവന്റെ കവചം നിനക്കായി എടുത്തുകൊള്ളുക.” ഹീബ്രു പദം വീണുപോയ ഒരു പോരാളിയിൽനിന്ന് അഴിച്ചെടുക്കുന്ന ഉപകരണങ്ങളെ സൂചിപ്പിക്കുന്നതായിരിക്കാം; കൃത്യമായി ഏത് വസ്തുവാണെന്ന് ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטֵה
  choice: മാറി
  rationale: പിന്തുടരുന്ന ഇപ്പോഴത്തെ വഴിയിൽനിന്ന് വശത്തേക്കു മാറുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל יְמִינְךָ אֹו עַל שְׂמֹאלֶךָ
  choice: നിന്റെ വലത്തോട്ടോ ഇടത്തോട്ടോ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയങ്ങളുള്ള നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: וֶאֱחֹז לְךָ
  choice: പിടിച്ച്
  rationale: אחז എന്നതിന്റെ ‘പിടിക്കുക/കൈവശപ്പെടുത്തുക’ എന്ന ശക്തമായ അർഥം യുദ്ധസന്ദർഭത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; പിന്നാലെയുള്ള ‘നിനക്കായി’ സ്വപ്രയോജനഭാവം വ്യക്തമാക്കുന്നു.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: യുവാക്കളിൽ ഒരാളെ
  rationale: സൈനികൻ, സേവകൻ തുടങ്ങിയ പദവികൾ അനാവശ്യമായി നിർണ്ണയിക്കാതെ נְעָרִים എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു.
- source_word: וְקַח לְךָ אֶת חֲלִצָתוֹ
  choice: അവന്റെ യുദ്ധസാമഗ്രികൾ നിനക്കായി എടുത്തുകൊള്ളുക
  rationale: חֲלִצָה ഇവിടെ വീണ പോരാളിയിൽനിന്ന് അഴിച്ചെടുക്കുന്ന ഉപകരണങ്ങളെയോ കവചത്തെയോ സൂചിപ്പിക്കാം. ‘യുദ്ധസാമഗ്രികൾ’ കൃത്രിമമായ കൃത്യത ഒഴിവാക്കി സൈനികസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא אָבָה
  choice: തയ്യാറായില്ല
  rationale: ഇച്ഛിക്കുകയോ സമ്മതിക്കുകയോ ചെയ്യാതിരിക്കുക എന്ന אבה-യുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לָסוּר מֵאַחֲרָיו
  choice: അവനെ പിന്തുടരുന്നതിൽനിന്നു പിന്മാറാൻ
  rationale: പിന്നാലെ പോകുന്നതു നിർത്തി വഴിമാറുക എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ ആവർത്തിച്ച לְךָ സ്വപ്രയോജനഭാവം ‘നിനക്കായി’ എന്നതിലൂടെ നിലനിർത്തി; എന്നാൽ മലയാളത്തിലെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി. חֲלִצָתוֹ എന്ന പദത്തിന്റെ കൃത്യ വസ്തു അനിശ്ചിതമായതിനാൽ ‘കവചം’ എന്ന ചുരുങ്ങിയ അർഥത്തിനു പകരം വിശാലമായ ‘യുദ്ധസാമഗ്രികൾ’ തെരഞ്ഞെടുത്തു.
