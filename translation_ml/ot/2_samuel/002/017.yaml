    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘ദാവീദിന്റെ സേവകർ’ എന്നാണ്; ഇവിടെ ദാവീദിന്റെ സൈനികരെയോ അനുചരരെയോ സൂചിപ്പിക്കുന്നു.
