- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: ശത്രുസൈന്യത്തിന്റെ മുമ്പിൽ പരാജയപ്പെട്ടു എന്ന എബ്രായ സൈനികപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַבְדֵי דָוִד
  choice: ദാവീദിന്റെ സേവകർ
