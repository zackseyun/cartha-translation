source:
  edition: WLC
  text: וַ/אֲנָשָׁ֧י/ו אֲשֶׁר עִמּ֛/וֹ הֶעֱלָ֥ה דָוִ֖ד אִ֣ישׁ וּ/בֵית֑/וֹ וַ/יֵּשְׁב֖וּ בְּ/עָרֵ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/003.yaml
  text: And David brought up the men who were with him[a], each man with his household, and they settled in the towns of Hebron.
translation:
  language: ml
  text: ദാവീദ് തന്റെ കൂടെയുണ്ടായിരുന്ന പുരുഷന്മാരെ, ഓരോരുത്തനെയും അവനവന്റെ കുടുംബത്തോടുകൂടെ, കയറ്റിക്കൊണ്ടുപോയി. അവർ ഹെബ്രോനിലെ പട്ടണങ്ങളിൽ[a] താമസമുറപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹെബ്രോനിലെ നഗരങ്ങളിൽ.’ എബ്രായപ്രയോഗം ഹെബ്രോൻ നഗരകേന്ദ്രത്തെ മാത്രമല്ല, ഹെബ്രോനുമായി ബന്ധപ്പെട്ട വാസകേന്ദ്രങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשָׁיו אֲשֶׁר עִמּוֹ
  choice: തന്നോടുകൂടെയുണ്ടായിരുന്ന പുരുഷന്മാരെയും
  rationale: אֲנָשָׁיו എന്നത് ദാവീദിന്റെ പുരുഷസഹചാരികളെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള ബന്ധവാക്യം അവരെ ദാവീദിനോടുകൂടെ ഉണ്ടായിരുന്നവരായി തിരിച്ചറിയുന്നു. വ്യക്തമായ പുരുഷസൂചന നിലനിർത്താൻ ‘പുരുഷന്മാർ’ ഉപയോഗിച്ചു.
- source_word: הֶעֱלָה
  choice: കയറ്റിക്കൊണ്ടുചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘മുകളിലേക്കു കൊണ്ടുപോകുക’ എന്ന ദിശാസൂചന നൽകാം. ഹെബ്രോൻ മലമ്പ്രദേശത്തേക്കുള്ള നീക്കത്തിന്റെ ഉയർച്ചാഭാവം നിലനിർത്താൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: אִישׁ וּבֵיתוֹ
  choice: ഓരോരുത്തനെയും അവന്റെ കുടുംബത്തോടൊപ്പം
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തൻ’ എന്നും בֵּיתוֹ ആ വ്യക്തിയുടെ ഗൃഹസമൂഹം അഥവാ കുടുംബം എന്നും സൂചിപ്പിക്കുന്നു. ‘വീട്’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സന്ദർഭോചിതമായി ‘കുടുംബം’ ഉപയോഗിച്ചു.
- source_word: וַיֵּשְׁבוּ
  choice: താമസമാക്കി
  rationale: ישב എന്നതിന് ഇരിക്കുക, പാർക്കുക, താമസിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. സ്ഥലംമാറ്റത്തിനു ശേഷം അവിടെ വാസമുറപ്പിച്ചതാണ് സന്ദർഭം; അതിനാൽ ‘താമസമാക്കി’ സ്വാഭാവികമാണ്.
- source_word: בְּעָרֵי חֶבְרוֹן
  choice: ഹെബ്രോൻ പ്രദേശത്തെ പട്ടണങ്ങളിൽ
  rationale: עָרֵי എന്നത് നഗരങ്ങളെയോ പട്ടണങ്ങളെയോ സൂചിപ്പിക്കാം. ഏക നഗരകേന്ദ്രത്തെക്കാൾ ഹെബ്രോനുമായി ബന്ധപ്പെട്ട ചുറ്റുപാടിലെ വാസകേന്ദ്രങ്ങളാണ് ഉദ്ദേശ്യമാകാൻ സാധ്യതയുള്ളതിനാൽ ‘ഹെബ്രോൻ പ്രദേശത്തെ പട്ടണങ്ങൾ’ എന്നു നൽകി; പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: חֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: എബ്രായ സ്ഥലനാമം മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
