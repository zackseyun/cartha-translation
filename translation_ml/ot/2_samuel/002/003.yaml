  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ഉയർച്ചാഭാവം ‘കയറ്റിക്കൊണ്ടുചെന്നു’ എന്നതിലൂടെ നിലനിർത്തുകയും, ‘വീട്’ എന്ന അക്ഷരാർഥത്തിന് പകരം സന്ദർഭോചിതമായ ‘കുടുംബം’ ഉപയോഗിക്കുകയും ചെയ്തു.
