id: 2SA.2.30
reference: 2 Samuel 2:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יוֹאָ֗ב שָׁ֚ב מֵ/אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּקְבֹּ֖ץ אֶת כָּל הָ/עָ֑ם וַ/יִּפָּ֨קְד֜וּ מֵ/עַבְדֵ֥י דָוִ֛ד תִּשְׁעָֽה עָשָׂ֥ר אִ֖ישׁ וַ/עֲשָׂה אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/030.yaml
  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
translation:
  language: ml
  text: യോവാബ് അബ്നേരിനെ പിന്തുടരുന്നത് അവസാനിപ്പിച്ച് മടങ്ങിവന്നു; അവൻ ജനത്തെയെല്ലാം ഒരുമിച്ചുകൂട്ടി. അവരെ എണ്ണിയപ്പോൾ, ദാവീദിന്റെ ഭൃത്യന്മാരിൽ പത്തൊൻപത് പേരെയും അസാഹേലിനെയും[a] കാണാനില്ലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “പത്തൊൻപത് പുരുഷന്മാരും അസാഹേലും.” അതായത്, അസാഹേൽ പത്തൊൻപത് പേരിനു പുറമേയാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב מֵאַחֲרֵי אַבְנֵר
  choice: അബ്നേരിനെ പിന്തുടരുന്നത് അവസാനിപ്പിച്ച് മടങ്ങിവന്നു
  rationale: ശാബ് എന്ന ക്രിയയുടെ ‘മടങ്ങിവന്നു’ എന്ന അടിസ്ഥാനാർഥവും, യുദ്ധസന്ദർഭത്തിൽ മേഅഹരേ അബ്നേർ സൂചിപ്പിക്കുന്ന പിന്തുടരൽ അവസാനിപ്പിക്കൽ എന്ന ആശയവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וַיִּקְבֹּץ אֶת כָּל הָעָם
  choice: അവൻ ജനത്തെയെല്ലാം ഒരുമിച്ചുകൂട്ടി
  rationale: עָם എന്നതിന് അടിസ്ഥാനപരമായി ‘ജനം’ എന്നർഥമാണ്; ഇവിടെ അത് യോവാബിനോടൊപ്പമുള്ള പോരാളികളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: וַיִּפָּקְדוּ
  choice: അവരെ എണ്ണിയപ്പോൾ
  rationale: നിഫാൽ രൂപം ഇവിടെ സൈനികരെ എണ്ണി തിട്ടപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാള കഥനത്തിൽ ‘എണ്ണിയപ്പോൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מֵעַבְדֵי דָוִד
  choice: ദാവീദിന്റെ ഭൃത്യന്മാരിൽ
  rationale: עבד എന്ന പദത്തിന്റെ സേവകൻ/ഭൃത്യൻ എന്ന അർഥം നിലനിർത്തുകയും രാജകീയ-സൈനിക സേവനത്തിന്റെ സന്ദർഭം ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു.
- source_word: תִּשְׁעָה עָשָׂר אִישׁ וַעֲשָׂה אֵל
  choice: പത്തൊൻപത് പേരെയും അസാഹേലിനെയും
  rationale: ഹീബ്രു വാക്യഘടന നേരിട്ട് ‘പത്തൊൻപത് പുരുഷന്മാരും അസാഹേലും’ എന്നാണ്; അസാഹേൽ പത്തൊൻപതിനു പുറമേയുള്ളയാളാണെന്ന കൂട്ടിച്ചേർക്കൽ നിലനിർത്തുന്നു.
- source_word: וַיִּפָּקְדוּ מֵעַבְדֵי דָוִד
  choice: ദാവീദിന്റെ ഭൃത്യന്മാരിൽ ... കാണാനില്ലായിരുന്നു
  rationale: פקד എന്ന ക്രിയയുടെ സന്ദർഭാനുസൃത ഫലം—എണ്ണിയപ്പോൾ ചിലർ ഹാജരില്ലെന്നു കണ്ടെത്തിയത്—വായനക്കാരന് വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. സൈനികസന്ദർഭം വ്യക്തമാക്കുമ്പോഴും ‘ജനം’, ‘ഭൃത്യന്മാർ’ എന്നീ മൂലപദങ്ങളോട് അടുത്ത പദങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു.
