  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. യാത്രയുടെ ഉയർച്ചാസൂചനയ്ക്കായി ‘കയറിപ്പോയി’ ഉപയോഗിച്ചു. പേരുകൾ മലയാള ബൈബിൾ പ്രയോഗങ്ങളോടു ചേർന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
