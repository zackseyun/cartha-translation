  yaml_path: translation/ot/2_samuel/002/002.yaml
  text: 'So David went up there[a], and also his two wives: Ahinoam the Jezreelite and Abigail, the wife of Nabal the Carmelite.'
translation:
  language: ml
  text: 'ദാവീദും അവന്റെ രണ്ടു ഭാര്യമാരും അവിടേക്കു കയറിപ്പോയി: യിസ്രെയേൽ സ്വദേശിനിയായ അഹീനോവാമും കർമ്മേൽ സ്വദേശിയായ നാബാലിന്റെ ഭാര്യയായ അബീഗയിലും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל שָׁם
  choice: അവിടേക്കു കയറിപ്പോയി
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; שָׁם മുൻസന്ദർഭത്തിൽ പറഞ്ഞ സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְגַם שְׁתֵּי נָשָׁיו
  choice: ദാവീദും അവന്റെ രണ്ടു ഭാര്യമാരും
  rationale: וגם എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവം സ്വാഭാവികമായ മലയാള സംയുക്തകർത്തൃഘടനയിലൂടെ പ്രകടമാക്കുന്നു; ഭാര്യമാരുടെ എണ്ണംയും ദാവീദുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: אֲחִינֹעַם הַיִּזְרְעֵלִית
  choice: യിസ്രെയേൽക്കാരിയായ അഹീനോവാം
  rationale: ജാതിവാചകസ്ത്രീലിംഗരൂപം അഹീനോവാമിന്റെ യിസ്രെയേൽ എന്ന സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: וַאֲבִיגַיִל
  choice: അബീഗയിലും
  rationale: രണ്ടാമത്തെ ഭാര്യയെ പട്ടികയിൽ ചേർക്കുന്ന ഹീബ്രു സംയോജകത്തിന്റെ അർഥം മലയാളത്തിലെ ‘-ഉം’ കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִי
  choice: കർമ്മേൽക്കാരനായ നാബാലിന്റെ ഭാര്യയായ
  rationale: ഹീബ്രു വ്യാകരണപ്രകാരം ‘കർമ്മേൽക്കാരൻ’ എന്ന വിശേഷണം നാബാലിനെയാണ് സൂചിപ്പിക്കുന്നത്; അബീഗയിലിനെ അവളുടെ മുൻവിവാഹബന്ധംകൊണ്ട് തിരിച്ചറിയിക്കുന്ന മൂലപാഠരീതി നിലനിർത്തുന്നു.
