id: 2SA.2.8
reference: 2 Samuel 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַבְנֵ֣ר בֶּן נֵ֔ר שַׂר צָבָ֖א אֲשֶׁ֣ר לְ/שָׁא֑וּל לָקַ֗ח אֶת אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וַ/יַּעֲבִרֵ֖/הוּ מַחֲנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
translation:
  language: ml
  text: എന്നാൽ, ശൗലിന്റെ സൈന്യാധിപനായ നേരിന്റെ മകൻ അബ്നേർ, ശൗലിന്റെ മകനായ ഇശ്-ബോശെത്തിനെ[a] മഹനയീമിലേക്കു കടത്തിക്കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇശ്-ബോശെത്ത് 1 ദിനവൃത്താന്തം 8:33; 9:39 എന്നിവിടങ്ങളിൽ എശ്ബാൽ എന്നു വിളിക്കപ്പെടുന്നു.
    reason: ഒരേ വ്യക്തിയുടെ മറ്റൊരു പേരുരൂപം ദിനവൃത്താന്തത്തിൽ കാണുന്നതിനാൽ വായനക്കാരനെ അറിയിക്കുന്നു.
lexical_decisions:
- source_word: וְ/אַבְנֵר
  choice: എന്നാൽ അബ്നേർ
  rationale: וְ ഇവിടെ മുൻവാക്യത്തിൽ ദാവീദിനെ യെഹൂദാ രാജാവാക്കിയതിനു വിപരീതമായി അബ്നേറിന്റെ നടപടിയെ അവതരിപ്പിക്കുന്നു; അതിനാൽ സന്ദർഭത്തിലെ വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: בֶּן נֵר
  choice: നേരിന്റെ മകൻ
  rationale: ഹീബ്രു പുത്രബന്ധഘടനയെ സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: שַׂר צָבָא אֲשֶׁר לְ/שָׁאוּל
  choice: ശൗലിന്റെ സൈന്യാധിപൻ
  rationale: שַׂר צָבָא സൈന്യത്തിന്റെ തലവനെയോ അധിപനെയോ സൂചിപ്പിക്കുന്നു; ശൗലുമായുള്ള ബന്ധവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לָקַח
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുക്കുക/കൂടെ കൊണ്ടുപോകുക’ എന്നതാണ്. ബലമായി പിടിച്ചുകൊണ്ടുപോയെന്ന ധ്വനി മൂലപാഠം നിർബന്ധിക്കുന്നില്ല; തുടർന്നുള്ള ചലനക്രിയയുമായി ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: אִישׁ בֹּשֶׁת
  choice: ഇശ്-ബോശെത്ത്
  rationale: WLC-യിലെ പേരിന്റെ രൂപം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു; ദിനവൃത്താന്തത്തിലെ ‘എശ്ബാൽ’ എന്ന സമാന്തരരൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַ/יַּעֲבִרֵ/הוּ
  choice: അവനെ … കടന്നു
  rationale: עבר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘കടത്തുക/അക്കരെ കൊണ്ടുപോകുക’ എന്ന കാരകഭാവം വഹിക്കുന്നു. മലയാളത്തിൽ ‘കൂട്ടിക്കൊണ്ട് … കടന്നു’ എന്ന സംയുക്തപ്രയോഗം ആ ചലനവും അബ്നേറിന്റെ പ്രവർത്തകപങ്കും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വ്യക്തമാക്കാത്ത നദിയോ വഴിയോ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: מַחֲנָיִם
  choice: മഹനയീം
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ഉച്ചാരണസമീപമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
