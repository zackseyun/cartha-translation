translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ കഥനവൈരുധ്യം ‘എന്നാൽ’ എന്നതിലൂടെ സൂചിപ്പിക്കുകയും, עבר എന്ന ക്രിയയിലെ കടന്നുപോകൽഭാവം അമിതവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുകയും ചെയ്തു.
