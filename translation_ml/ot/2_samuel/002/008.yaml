  to: എന്നാൽ, ശൗലിന്റെ സൈന്യാധിപനായ നേരിന്റെ മകൻ അബ്നേർ, ശൗലിന്റെ മകനായ ഇശ്-ബോശെത്തിനെ[a] മഹനയീമിലേക്കു കടത്തിക്കൊണ്ടുപോയി.
