  text: וַ/יִּֽתְקַבְּצ֤וּ בְנֵֽי בִנְיָמִן֙ אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּהְי֖וּ לַ/אֲגֻדָּ֣ה אֶחָ֑ת וַ/יַּ֣עַמְד֔וּ עַ֥ל רֹאשׁ גִּבְעָ֖ה אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
translation:
  language: ml
  text: അപ്പോൾ ബെന്യാമീന്റെ പുത്രന്മാർ അബ്നേരിന്റെ പിന്നിൽ[a] ഒരുമിച്ചുകൂടി, ഒറ്റ സംഘമായി[b] തീർന്നു, ഒരു കുന്നിന്റെ മുകളിൽ നിലയുറപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അബ്നേരിനെ പിന്തുടർന്ന്.” എബ്രായപ്രയോഗം സ്ഥലപരമായി “പിന്നിൽ” എന്നോ, ഒരാളോടുള്ള അനുഗമനമോ ക്രമമോ സൂചിപ്പിക്കുന്ന “പിന്തുടർന്ന്” എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഒറ്റ കൂട്ടമായി” അല്ലെങ്കിൽ “ഒറ്റ പടയായി.” എബ്രായപദം ഒന്നിച്ചുചേർന്ന ഐക്യപ്പെട്ട ഒരു സംഘത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: ഒരുമിച്ചുകൂടി
  rationale: ഹിത്പയേൽ രൂപം കൂട്ടമായി ഒന്നിച്ചുകൂടുന്നതിനെ സൂചിപ്പിക്കുന്നു; യുദ്ധസന്ദർഭത്തിലെ പുനഃസംഘടന സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בְנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ബന്ധുത്വപ്രയോഗമായ ‘ബെന്യാമീന്റെ പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിലും വ്യക്തമാണ്.
- source_word: אַחֲרֵי אַבְנֵר
  choice: അബ്നേരിന്റെ പിന്നിൽ
  rationale: אַחֲרֵי എന്നത് സ്ഥലപരമായി ‘പിന്നിൽ’ എന്നും നേതാവിനെ അനുഗമിക്കുന്നതായി ‘പിന്തുടർന്ന്’ എന്നും അർഥമാക്കാം. മുഖ്യവാചകം സ്ഥലപരമായ ചിത്രം നിലനിർത്തുകയും അടിക്കുറിപ്പ് മറ്റർഥം അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: לַאֲגֻדָּה אֶחָת
  choice: ഒറ്റ സംഘമായി
  rationale: אֲגֻדָּה ഒന്നിച്ചുകെട്ടപ്പെട്ട കൂട്ടത്തെയോ സംഘത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ഒറ്റ സംഘം’ ഐക്യപ്പെട്ട യുദ്ധസംഘത്തിന്റെ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיַּעַמְדוּ
  choice: നിലയുറപ്പിച്ചു
  rationale: യുദ്ധവിവരണത്തിൽ עמד വെറുതെ നിൽക്കുന്നതിലുപരി ഒരു സ്ഥാനം സ്വീകരിച്ച് ഉറച്ചുനിൽക്കുന്നതാണ്; ‘നിലയുറപ്പിച്ചു’ ആ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל רֹאשׁ גִּבְעָה אֶחָת
  choice: ഒരു കുന്നിന്റെ മുകളിൽ
  rationale: ഭൂപ്രകൃതിസംബന്ധിയായ പ്രയോഗത്തിൽ רֹאשׁ എന്ന ‘തല’ കുന്നിന്റെ മുകൾഭാഗത്തെയോ ശിഖരത്തെയോ സൂചിപ്പിക്കുന്നു. אֶחָת എന്ന അനിശ്ചിതമായ ‘ഒരു’ എന്ന സംഖ്യാഭാവവും നിലനിർത്തുന്നു.
