  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിന്റെ കഥനഗതി നിലനിർത്താൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു; യുദ്ധസന്ദർഭം വ്യക്തമാക്കാൻ ‘നിലയുറപ്പിച്ചു’ തിരഞ്ഞെടുത്തു. മൂലത്തിലെ യഥാർഥ പദാർഥവൈവിധ്യം [a], [b] അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
