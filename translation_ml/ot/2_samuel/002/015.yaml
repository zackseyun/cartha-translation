id: 2SA.2.15
reference: 2 Samuel 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּקֻ֖מוּ וַ/יַּעַבְר֣וּ בְ/מִסְפָּ֑ר שְׁנֵ֧ים עָשָׂ֣ר לְ/בִנְיָמִ֗ן וּ/לְ/אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וּ/שְׁנֵ֥ים עָשָׂ֖ר מֵ/עַבְדֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
translation:
  language: ml
  text: 'അങ്ങനെ അവർ എഴുന്നേറ്റ്, എണ്ണമനുസരിച്ച് അപ്പുറത്തേക്കു കടന്നു[a]: ബെന്യാമീന്റെയും ശൗലിന്റെ മകൻ ഈശ്-ബോശെത്തിന്റെയും[c] പക്ഷത്ത്[b] പന്ത്രണ്ടുപേർ; ദാവീദിന്റെ സേവകരിൽനിന്ന്[d] പന്ത്രണ്ടുപേർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കടന്നുപോയി’ അല്ലെങ്കിൽ ‘അപ്പുറത്തേക്കു പോയി’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായ ക്രിയ നിശ്ചയിച്ച സ്ഥലത്തേക്കോ മറുവശത്തേക്കോ നീങ്ങുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ബെന്യാമീന്’ എന്നും, ‘ബെന്യാമീനിൽനിന്ന്’ എന്നും ഗ്രഹിക്കാം. ഇവിടെ അവർ ബെന്യാമീനെയും ഈശ്-ബോശെത്തിനെയും പ്രതിനിധീകരിച്ചുവെന്നാണ് സാധ്യത.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപാഠത്തിൽ ‘ഈശ്-ബോശെത്ത്’; പഴയനിയമ പാഠപാരമ്പര്യത്തിലെ മറ്റിടങ്ങളിൽ ഇതുമായി ബന്ധപ്പെട്ട ‘എശ്ബാൽ’ എന്ന രൂപവും കാണപ്പെടുന്നു.
    reason: alternative_reading
  - marker: d
    text: ‘ദാവീദിന്റെ ഭൃത്യന്മാരിൽനിന്ന്’ എന്നും, സന്ദർഭാനുസൃതമായി ‘ദാവീദിന്റെ ആളുകളിൽനിന്ന്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: അവർ എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ തുടർച്ചയായ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അടുത്ത നടപടിയെ സൂചിപ്പിക്കുന്നവിധം വിവർത്തനം ചെയ്തു.
- source_word: וַיַּעַבְרוּ
  choice: അപ്പുറത്തേക്കു കടന്നു
  rationale: עבר ഇവിടെ ഒരു വശത്തുനിന്ന് നിശ്ചയിച്ച സ്ഥലത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘കടന്നു’ എന്നത് അടിസ്ഥാന അർത്ഥം നിലനിർത്തുന്നു, ‘അപ്പുറത്തേക്ക്’ സന്ദർഭത്തിലെ ദിശ വ്യക്തമാക്കുന്നു.
- source_word: בְמִסְפָּר
  choice: എണ്ണമനുസരിച്ച്
  rationale: ഇരുപക്ഷത്തുനിന്നും എണ്ണിത്തിട്ടപ്പെടുത്തിയ തുല്യസംഖ്യയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: שְׁנֵים עָשָׂר
  choice: പന്ത്രണ്ടുപേർ
  rationale: വ്യക്തികളെയാണ് എണ്ണുന്നത് എന്നതിനാൽ മലയാളത്തിൽ വ്യക്തിവാചകമായ ‘പേർ’ ചേർത്തു.
- source_word: לְבִנְיָמִן
  choice: ബെന്യാമീന്റെ പക്ഷത്ത്
  rationale: ל ഇവിടെ കേവലം ഉത്ഭവമല്ല, ബന്ധമോ പ്രതിനിധാനമോ സൂചിപ്പിക്കുന്നു; ‘പക്ഷത്ത്’ സൈനികമത്സരസന്ദർഭത്തിൽ ഈ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: וּלְאִישׁ בֹּשֶׁת
  choice: ഈശ്-ബോശെത്തിന്റെ പക്ഷത്ത്
  rationale: മസോററ്റിക് പാഠത്തിലെ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു; മുൻപിലുള്ള ל സൂചിപ്പിക്കുന്ന പക്ഷബന്ധം സംയുക്തവാക്യത്തിൽ നിലനിർത്തി.
- source_word: בֶּן שָׁאוּל
  choice: ശൗലിന്റെ മകൻ
  rationale: തിരിച്ചറിയലിനുള്ള പിതൃനാമബന്ധം ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകി.
- source_word: מֵעַבְדֵי דָוִד
  choice: ദാവീദിന്റെ സേവകരിൽനിന്ന്
  rationale: עבדים എന്നതിന്റെ അടിസ്ഥാനാർത്ഥമായ ‘സേവകർ’ നിലനിർത്തുന്നു; രാജകീയ-സൈനിക സന്ദർഭത്തിൽ ഇത് ദാവീദിന്റെ സേവനത്തിലുള്ള ആളുകളെ സൂചിപ്പിക്കാം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. എബ്രായ വാക്യത്തിന്റെ തുല്യസംഖ്യാ ഘടന അർദ്ധവിരാമത്തിലൂടെ വ്യക്തമായി നിലനിർത്തി; പക്ഷബന്ധത്തിലും ‘സേവകർ’ എന്ന പദത്തിന്റെ സൈനികസന്ദർഭാർത്ഥത്തിലും ഉള്ള സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ തുറന്നുവച്ചു.
