source:
  edition: WLC
  text: וְ/עַתָּ֕ה יַֽעַשׂ יְהוָ֥ה עִמָּ/כֶ֖ם חֶ֣סֶד וֶ/אֱמֶ֑ת וְ/גַ֣ם אָנֹכִ֗י אֶעֱשֶׂ֤ה אִתְּ/כֶם֙ הַ/טּוֹבָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר עֲשִׂיתֶ֖ם הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
translation:
  language: ml
  text: ഇപ്പോൾ യഹോവ നിങ്ങളോടു അചഞ്ചലമായ സ്നേഹവും വിശ്വസ്തതയും കാണിക്കട്ടെ.[a] നിങ്ങൾ ഈ കാര്യം ചെയ്തതിനാൽ, ഞാനും നിങ്ങൾക്കു ഈ നന്മ ചെയ്യും.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യഹോവ നിങ്ങളോടു അചഞ്ചലമായ സ്നേഹവും വിശ്വസ്തതയും കാണിക്കും.” എബ്രായക്രിയയെ ആശംസയായോ ഭാവിയെക്കുറിച്ചുള്ള പ്രസ്താവനയായോ വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “ഈ കാര്യം” എന്നത് മുൻ വാക്യത്തിൽ (2 ശമൂവേൽ 2:5) പറഞ്ഞ, ശൗലിനെ സംസ്കരിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: “ഈ നന്മ” എന്നതിന് “ഈ ദയ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിൽ അക്ഷരാർഥം “ഈ നന്മ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മുൻവാക്യത്തോടുള്ള തുടർച്ച മലയാളത്തിലെ സ്വാഭാവിക പ്രസംഗസന്ദർഭത്തിൽ നിലനിൽക്കുന്നതിനാൽ അനാവശ്യമായ ‘എന്നും/അതിനാൽ’ ചേർക്കാതെ കാലസൂചകം വ്യക്തമായി നൽകി.
- source_word: יַעַשׂ
  choice: കാണിക്കട്ടെ
  rationale: സന്ദർഭത്തിൽ ഇത് ദാവീദിന്റെ ആശംസയോ അനുഗ്രഹപ്രാർത്ഥനയോ ആയി വായിക്കുന്നത് യോജിക്കുന്നു; ക്രിയയിലെ ഭാവിപ്രസ്താവനാസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: עִמָּכֶם
  choice: നിങ്ങളോടു
  rationale: അക്ഷരാർഥത്തിലെ ‘നിങ്ങളോടുകൂടെ/നിങ്ങളോടു’ എന്ന ബന്ധസൂചനയും മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: חֶסֶד
  choice: അചഞ്ചലമായ സ്നേഹം
  rationale: വിശ്വസ്തവും സ്ഥിരവുമായ ബന്ധസ്നേഹത്തെ സൂചിപ്പിക്കുന്ന חֶסֶד എന്ന പദത്തിന്റെ വ്യാപ്തി, പ്രത്യേകമായൊരു സിദ്ധാന്തപദം അടിച്ചേൽപ്പിക്കാതെ പ്രകടമാക്കുന്നു.
- source_word: וֶאֱמֶת
  choice: വിശ്വസ്തത
  rationale: חֶסֶד എന്നതിനോടൊപ്പമുള്ള ഈ പ്രയോഗത്തിൽ അമൂർത്തമായ ‘സത്യം’ എന്നതിനെക്കാൾ ബന്ധപരമായ വിശ്വാസ്യതയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וְגַם אָנֹכִי
  choice: ഞാനും
  rationale: גם എന്ന കൂട്ടിച്ചേർക്കൽഭാവവും אָנֹכִי എന്ന ഊന്നലുള്ള ഒന്നാംപുരുഷസർവനാമവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: אֶעֱשֶׂה אִתְּכֶם
  choice: നിങ്ങളോടു ... ചെയ്യും
  rationale: ‘നിങ്ങളോടു പ്രവർത്തിക്കുക/നന്മ ചെയ്യുക’ എന്ന ബന്ധപരമായ ദിശ അക്ഷരാർഥത്തോട് ചേർന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: ഈ നന്മ
  rationale: എബ്രായത്തിലെ ‘ഈ നല്ലത്/നന്മ’ എന്ന രൂപം സംരക്ഷിക്കുകയും, മുമ്പുള്ള חֶסֶד എന്ന പദവുമായി ഇതിനെ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר עֲשִׂיתֶם הַדָּבָר הַזֶּה
  choice: നിങ്ങൾ ഈ കാര്യം ചെയ്തതിനാൽ
  rationale: ബന്ധവാക്യത്തിന്റെ കാരണാർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്; ‘ഈ കാര്യം’ മുൻവാക്യത്തിലെ ശൗലിന്റെ സംസ്കാരത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יַעַשׂ എന്ന അപൂർണ്ണക്രിയയുടെ ആശംസാത്മകമോ ഭാവിപ്രസ്താവനാത്മകമോ ആയ വായന
  choice: ‘യഹോവ ... കാണിക്കട്ടെ’ എന്ന ആശംസ/പ്രാർത്ഥന
  alternative: ‘യഹോവ ... കാണിക്കും’ എന്ന ഭാവിപ്രസ്താവന
  rationale: യാബേശ്-ഗിലെയാദുകാരുടെ പ്രവൃത്തിക്ക് മറുപടിയായി ദാവീദ് അവരെ അനുഗ്രഹിക്കുന്ന സന്ദർഭത്തിൽ ആശംസാത്മക വായന യോജിക്കുന്നു; എങ്കിലും എബ്രായരൂപത്തിലെ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അചഞ്ചലമായ സ്നേഹം’, ‘വിശ്വസ്തത’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ എബ്രായ പദജോടിയുടെ ബന്ധപരമായ ഭാരം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
