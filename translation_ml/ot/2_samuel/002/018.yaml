translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ആദ്യ വാക്യത്തിലെ പട്ടിക മലയാളത്തിലെ സംയോജകപ്രത്യയങ്ങളോടെ നൽകിയിരിക്കുന്നു. ഉപമയും ഓട്ടത്തിലെ വേഗത്തെ സൂചിപ്പിക്കുന്ന ശരീരദൃശ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്.
