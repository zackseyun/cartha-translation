id: 2SA.2.18
reference: 2 Samuel 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽהְיוּ שָׁ֗ם שְׁלֹשָׁה֙ בְּנֵ֣י צְרוּיָ֔ה יוֹאָ֥ב וַ/אֲבִישַׁ֖י וַ/עֲשָׂהאֵ֑ל וַ/עֲשָׂהאֵל֙ קַ֣ל בְּ/רַגְלָ֔י/ו כְּ/אַחַ֥ד הַ/צְּבָיִ֖ם אֲשֶׁ֥ר בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/018.yaml
  text: 'The three sons of Zeruiah were there: Joab[a], Abishai, and Asahel. And Asahel was swift on his feet like one of the gazelles that are in the field.'
translation:
  language: ml
  text: സെരൂയയുടെ മൂന്നു പുത്രന്മാരായ യോവാബും അബീശായിയും അസാഹേലും അവിടെ ഉണ്ടായിരുന്നു. അസാഹേൽ വയലിലെ കലമാനുകളിൽ[a] ഒന്നിനെപ്പോലെ കാലുകൾക്ക് വേഗമുള്ളവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വയലിലെ മാനുകളിൽ.’ എബ്രായത്തിലെ צְבִי എന്ന പദം മാൻവർഗത്തിൽപ്പെട്ട ഒരു കാട്ടുമൃഗത്തെ കൂടുതൽ പൊതുവായി സൂചിപ്പിക്കാം; ഇവിടെ ‘കലമാൻ’ എന്നതാണ് കൂടുതൽ കൃത്യമായ വിവർത്തനം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: അവിടെ ഉണ്ടായിരുന്നു
  rationale: രംഗത്തിൽ അവരുടെ സാന്നിധ്യം സൂചിപ്പിക്കുന്ന ലളിതമായ പ്രയോഗം; ഹീബ്രുവിൽ ഇല്ലാത്ത പ്രത്യേക കാലസൂചകം ചേർക്കുന്നില്ല.
- source_word: שְׁלֹשָׁה בְּנֵי צְרוּיָה
  choice: സെരൂയയുടെ മൂന്നു പുത്രന്മാർ
  rationale: അറിയപ്പെടുന്ന മൂവരെയും സ്വാഭാവികമായ മലയാള ഉടമസ്ഥപ്രയോഗത്തിലൂടെ തിരിച്ചറിയിക്കുന്നു.
- source_word: יוֹאָב וַאֲבִישַׁי וַעֲשָׂהאֵל
  choice: യോവാബും അബീശായിയും അസാഹേലും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: קַל בְּרַגְלָיו
  choice: കാലുകൾക്ക് വേഗമുള്ളവൻ
  rationale: ഇവിടെ קַל ഭാരക്കുറവിനെയല്ല, ഓട്ടത്തിലെ വേഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ശരീരാവയവത്തെക്കുറിച്ചുള്ള ഹീബ്രു ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: כְּאַחַד הַצְּבָיִם
  choice: കലമാനുകളിൽ ഒന്നിനെപ്പോലെ
  rationale: צְבִי സാധാരണയായി ഗസെൽ വർഗത്തിലെ കലമാനെ സൂചിപ്പിക്കുന്നു; വേഗത്തെ ആസ്പദമാക്കിയ ഉപമയ്ക്കും ഇത് യോജിക്കുന്നു.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: വയലിലെ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ സ്ഥലസൂചന ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; ‘തുറന്ന’ എന്ന അധിക വിശേഷണം ചേർത്തിട്ടില്ല.
