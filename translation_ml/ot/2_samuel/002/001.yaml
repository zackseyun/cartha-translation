id: 2SA.2.1
reference: 2 Samuel 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וַ/יִּשְׁאַל֩ דָּוִ֨ד בַּֽ/יהוָ֤ה לֵ/אמֹר֙ הַ/אֶעֱלֶ֗ה בְּ/אַחַת֙ עָרֵ֣י יְהוּדָ֔ה וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו עֲלֵ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אָ֥נָה אֶעֱלֶ֖ה וַ/יֹּ֥אמֶר חֶבְרֹֽנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
translation:
  language: ml
  text: 'ഇതിനുശേഷം ദാവീദ് യഹ്‌വേയോട്[a] ചോദിച്ചു: “ഞാൻ യെഹൂദായിലെ നഗരങ്ങളിലൊന്നിലേക്ക് കയറിപ്പോകട്ടെയോ?” യഹ്‌വേ അവനോട്, “കയറിപ്പോകുക,” എന്നു പറഞ്ഞു. അപ്പോൾ ദാവീദ്, “ഞാൻ എവിടേക്കു കയറിപ്പോകണം?” എന്നു പറഞ്ഞു. “ഹെബ്രോനിലേക്ക്,” യഹ്‌വേ പറഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ രൂപവും പരമ്പരാഗത പകരംവായനയും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: ഇതിനുശേഷം
  rationale: സംഭവപരമ്പരയിലെ കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഹീബ്രു ആഖ്യാനസൂത്രത്തിന്റെ കാഠിന്യം അനാവശ്യമായി പകർത്തുന്നില്ല.
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: യഹ്‌വേയോട് ചോദിച്ചു
  rationale: ദൈവിക മാർഗനിർദേശം തേടുന്ന സന്ദർഭം തുടർന്നുള്ള നേരിട്ടുള്ള ചോദ്യത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ, പ്രത്യേക വെളിപ്പാട്-രീതി അനുമാനിക്കാതെ ലളിതവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ഹീബ്രു ദൈവനാമമായ YHWH-നെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ഉച്ചാരണസമീപമായി ലിപ്യന്തരിച്ചു.
- source_word: הַאֶעֱלֶה / עֲלֵה
  choice: കയറിപ്പോകട്ടെയോ / കയറിപ്പോകുക
  rationale: യെഹൂദായിലെ മലനാട്ടിലേക്കുള്ള ഉയർച്ചയുടെ ദിശാസൂചനയും ചോദ്യത്തിലും ഉത്തരത്തിലുമുള്ള ഒരേ ക്രിയയുടെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  choice: യെഹൂദാനഗരങ്ങളിലൊന്നിലേക്കു
  rationale: യെഹൂദായിലെ പല നഗരങ്ങളിൽ ഏതെങ്കിലും ഒന്നിനെ ലക്ഷ്യമാക്കിയുള്ള സഞ്ചാരം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: אָנָה
  choice: എവിടേക്ക്
  rationale: ലക്ഷ്യസ്ഥാനം ചോദിക്കുന്ന ഹീബ്രു ക്രിയാവിശേഷണത്തിന്റെ ദിശാബോധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: חֶבְרֹנָה
  choice: ഹെബ്രോനിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ഹേ പ്രത്യയത്തിന്റെ അർഥം ‘-ലേക്ക്’ എന്ന രൂപത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഒരു പൊതുപദവിയല്ല, ചതുർവർണ ദൈവനാമമാണ് ഉള്ളത്. അതിനാൽ വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കയറിപ്പോകുക’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ഭൂമിശാസ്ത്രപരമായ ദിശയും ശബ്ദാവർത്തനവും സൂക്ഷിക്കുന്നു; ‘അവിടുന്ന്’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആദരസൂചക സർവനാമമായി ഉപയോഗിച്ചു.
