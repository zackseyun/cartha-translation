  naturalness: ‘യെഹൂദാനഗരങ്ങളിലൊന്നിലേക്ക്’ എന്ന ചേർച്ച ആധുനിക നിലവാരമലയാളത്തിൽ അല്പം കൃത്രിമമാണ്. ‘യെഹൂദായിലെ നഗരങ്ങളിലൊന്നിലേക്ക്’ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. അവസാനമായി സംസാരിക്കുന്നയാളെ ‘യഹ്‌വേ’ എന്നു വ്യക്തമായി പറയുന്നതും, ‘അവിടുന്ന്’ എന്ന അനാവശ്യമായ ആദരസൂചക സർവനാമത്തേക്കാൾ ഈ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
  terminology: ‘യഹ്‌വേ’, ‘ദാവീദ്’, ‘യെഹൂദാ’, ‘ഹെബ്രോൻ’ എന്നിവ യോജിച്ചതാണ്. അടിക്കുറിപ്പ് ദൈവനാമത്തിന്റെ ഹീബ്രു രൂപവും പരമ്പരാഗത പകരംപ്രയോഗവും ശരിയായി അറിയിക്കുന്നു.
