  text: וַ/יְמָאֵ֣ן לָ/ס֗וּר וַ/יַּכֵּ֣/הוּ אַבְנֵר֩ בְּ/אַחֲרֵ֨י הַ/חֲנִ֜ית אֶל הַ/חֹ֗מֶשׁ וַ/תֵּצֵ֤א הַֽ/חֲנִית֙ מֵ/אַחֲרָ֔י/ו וַ/יִּפָּל שָׁ֖ם וַ/יָּ֣מָת תחת/ו וַ/יְהִ֡י כָּל הַ/בָּ֣א אֶֽל הַ/מָּקוֹם֩ אֲשֶׁר נָ֨פַל שָׁ֧ם עֲשָׂהאֵ֛ל וַ/יָּמֹ֖ת וַֽ/יַּעֲמֹֽדוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
translation:
  language: ml
  text: എന്നാൽ അവൻ വഴിമാറാൻ വിസമ്മതിച്ചു. അതിനാൽ അബ്നേർ കുന്തത്തിന്റെ പിൻഅറ്റംകൊണ്ട് അവന്റെ വയറ്റിൽ കുത്തി; കുന്തം അവന്റെ പിന്നിലൂടെ പുറത്തുവന്നു. അവൻ അവിടെ വീണ് അവിടെവെച്ചുതന്നെ മരിച്ചു. അസാഹേൽ വീണുമരിച്ച സ്ഥലത്തെത്തിയവരെല്ലാം അവിടെത്തന്നെ നിന്നുപോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  choice: വഴിമാറാൻ വിസമ്മതിച്ചു
  rationale: מאן വ്യക്തമായ നിരസനത്തെയും סור മാറിപ്പോകുന്നതിനെയും സൂചിപ്പിക്കുന്നു; പിന്തുടരൽ ഉപേക്ഷിക്കാൻ വിസമ്മതിച്ചുവെന്ന സന്ദർഭാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּאַחֲרֵי הַחֲנִית
  choice: കുന്തത്തിന്റെ പിൻതണ്ട്
  rationale: കുന്തത്തിന്റെ പിന്നിലെ അറ്റമാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ ആയുധത്തിന്റെ ദണ്ഡിന്റെ പിൻഭാഗം വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: אֶל הַחֹמֶשׁ
  choice: വയറ്റിൽ
  rationale: חֹמֶשׁ എന്ന ദുഷ്കരമായ ശരീരാവയവപദം ഈ യുദ്ധസന്ദർഭങ്ങളിൽ ഉദരഭാഗത്തെ സൂചിപ്പിക്കുന്നതായി സാധ്യതയുണ്ട്; പരമ്പരാഗതമായ ‘അഞ്ചാം വാരിയെല്ല്’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ഉറപ്പിച്ചിട്ടില്ല.
- source_word: וַתֵּצֵא הַחֲנִית מֵאַחֲרָיו
  choice: കുന്തം അവന്റെ പിന്നിലൂടെ പുറത്തുവന്നു
  rationale: കുന്തം ശരീരത്തിലൂടെ കടന്ന് പിന്നിൽ പുറത്തുവന്നതിനെ എബ്രായത്തിന്റെ ദൃശ്യരൂപത്തോട് ചേർന്ന് അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּמָת תַּחְתָּו
  choice: തൽക്ഷണം മരിച്ചു
  rationale: תחתיו അക്ഷരാർഥത്തിൽ ‘അവന്റെ സ്ഥാനത്ത്/അവന്റെ കീഴിൽ’ എന്നാണെങ്കിലും ഇവിടെ വീണിടത്തുവെച്ചുള്ള ഉടൻമരണത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭപ്രയോഗമാണ്.
- source_word: וַיַּעֲמֹדוּ
  choice: അവിടെത്തന്നെ നിന്നുപോയി
  rationale: ശവം കണ്ട് യാത്രക്കാർ നിൽക്കുകയോ മുന്നോട്ടുപോകാതെ നിലയ്ക്കുകയോ ചെയ്തതിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള കഥനമലയാളം. അക്രമസംഭവത്തിന്റെ ദൃശ്യത നിലനിർത്തിയെങ്കിലും അനാവശ്യമായി ഗ്രാഫിക് ഭാഷ ഉപയോഗിച്ചിട്ടില്ല. חֹמֶשׁ എന്ന പദത്തിന്റെ അനിശ്ചിതത്വം ‘വയറ്’ എന്ന പൊതുവായ ശരീരഭാഗപദംകൊണ്ട് കൈകാര്യം ചെയ്തു.
