translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘യെഹൂദാഗൃഹം’ എന്ന ബൈബിൾപരമായ സമുച്ചയപ്രയോഗം മൂലപാഠത്തിന്റെ രൂപവും കോർപ്പറേറ്റ് അർഥവും നിലനിർത്താൻ ഉപയോഗിച്ചു; ദൈർഘ്യസൂചനയ്ക്ക് സ്വാഭാവികമായ ‘കാലയളവ്’ തെരഞ്ഞെടുത്തു.
