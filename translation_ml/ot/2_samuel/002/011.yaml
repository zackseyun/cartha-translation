  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִסְפַּ֣ר הַ/יָּמִ֔ים אֲשֶׁר֩ הָיָ֨ה דָוִ֥ד מֶ֛לֶךְ בְּ/חֶבְר֖וֹן עַל בֵּ֣ית יְהוּדָ֑ה שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֥ה חֳדָשִֽׁים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/011.yaml
  text: The length of time that David was king in Hebron over the house of Judah was seven years and six months[a].
translation:
  language: ml
  text: ദാവീദ് ഹെബ്രോനിൽ യെഹൂദാഗൃഹത്തിന്റെ രാജാവായിരുന്ന കാലയളവ് ഏഴു വർഷവും ആറു മാസവുമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദിവസങ്ങളുടെ എണ്ണം.’ ഈ എബ്രായ ശൈലി ദാവീദ് ഹെബ്രോനിൽ രാജാവായിരുന്ന കാലയളവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: ഇവിടെ היה എന്ന ക്രിയയുടെ രൂപം ഒരു സംഗ്രഹപ്രസ്താവന അവതരിപ്പിക്കുന്നു; പദാനുപദമായ ‘സംഭവിച്ചു’ എന്നതിനെക്കാൾ മലയാളത്തിൽ ‘ആയിരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: מִסְפַּר הַיָּמִים
  choice: കാലയളവ്
  rationale: പദാനുപദമായി ‘ദിവസങ്ങളുടെ എണ്ണം’ എന്നാണെങ്കിലും, ഈ എബ്രായ പ്രയോഗം ഭരണത്തിന്റെ ദൈർഘ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കാലയളവ്’ ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֲשֶׁר הָיָה
  choice: രാജാവായിരുന്ന
  rationale: ദാവീദിന്റെ രാജത്വത്തോടു കാലയളവിനെ ബന്ധിപ്പിക്കുന്ന ആപേക്ഷിക നിർമാണം മലയാളത്തിൽ ക്രിയാവിശേഷണരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: രാജകീയ പദവിക്കുള്ള സാധാരണവും സന്ദർഭോചിതവുമായ പരിഭാഷ.
- source_word: בְּחֶבְרוֹן
  choice: ഹെബ്രോനിൽ
  rationale: בְ എന്ന മുൻപ്രത്യയം ഇവിടെ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; നഗരത്തിനുള്ളിലായിരുന്ന ഭരണകേന്ദ്രം എന്ന അർഥം ‘ഹെബ്രോനിൽ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל בֵּית יְהוּדָה
  choice: യെഹൂദാഗൃഹത്തിന്മേൽ
  rationale: ‘ഗൃഹം’ എന്ന എബ്രായ ഘടകം നിലനിർത്തുകയും യെഹൂദയോടു ചേർന്ന ഗോത്ര-രാഷ്ട്രീയ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന സമുച്ചയാർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: ഏഴു വർഷവും ആറു മാസവും
  rationale: പ്രസ്താവിച്ച കാലദൈർഘ്യത്തിന്റെ നേരിട്ടുള്ളതും മലയാളത്തിൽ സ്വാഭാവികവുമായ പരിഭാഷ.
