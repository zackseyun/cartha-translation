- from: 'യോവാബ് പറഞ്ഞു: “ജീവനുള്ള ദൈവത്തെച്ചൊല്ലി ഞാൻ സത്യം ചെയ്യുന്നു: നീ സംസാരിച്ചിരുന്നില്ലെങ്കിൽ, ജനങ്ങൾ രാവിലെതന്നെ പിന്മാറി, ഓരോരുത്തനും തന്റെ സഹോദരനെ പിന്തുടരുന്നത് അവസാനിപ്പിക്കുമായിരുന്നു.”'
