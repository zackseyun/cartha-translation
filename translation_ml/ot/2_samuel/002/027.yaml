source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֔ב חַ֚י הָֽ/אֱלֹהִ֔ים כִּ֥י לוּלֵ֖א דִּבַּ֑רְתָּ כִּ֣י אָ֤ז מֵֽ/הַ/בֹּ֨קֶר֙ נַעֲלָ֣ה הָ/עָ֔ם אִ֖ישׁ מֵ/אַחֲרֵ֥י אָחִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/027.yaml
  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
translation:
  language: ml
  text: 'യോവാബ് പറഞ്ഞു: “ദൈവം ജീവിച്ചിരിക്കുന്നതുപോലെ സത്യം, നീ സംസാരിച്ചിരുന്നില്ലെങ്കിൽ, ജനങ്ങൾ രാവിലെമുതൽ ഓരോരുത്തനും തന്റെ സഹോദരനെ പിന്തുടരുന്നതിൽനിന്ന് പിന്മാറുമായിരുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  choice: ജീവനുള്ള ദൈവത്തെച്ചൊല്ലി ഞാൻ സത്യം ചെയ്യുന്നു
  rationale: ഇത് ഒരു സാധാരണ എബ്രായ ശപഥസൂത്രമാണ്. വാക്കുതോറുമുള്ള രൂപത്തെക്കാൾ അതിന്റെ ശപഥസ്വഭാവം സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לוּלֵא דִּבַּרְתָּ
  choice: നീ സംസാരിച്ചിരുന്നില്ലെങ്കിൽ
  rationale: പൂർത്തിയായിട്ടില്ലാത്ത ഒരു പ്രതിവാസ്തവിക നിബന്ധനയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ക്രിയയുടെ കർമം എബ്രായത്തിലെപ്പോലെ വ്യക്തമാക്കാതെ വിടുന്നു.
- source_word: כִּי אָז
  choice: അപ്പോൾ എന്ന ആശയം തുടർന്നുള്ള പ്രതിവാസ്തവിക ക്രിയാരൂപത്തിൽ ഉൾപ്പെടുത്തി
  rationale: നിബന്ധനയുടെ ഫലം മലയാളത്തിലെ ‘ചെയ്യുമായിരുന്നു’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ വേറിട്ട് ‘അപ്പോൾ’ ചേർക്കേണ്ടതില്ല.
- source_word: מֵהַבֹּקֶר
  choice: രാവിലെതന്നെ
  rationale: מן ചേർന്ന ‘രാവിലെ’ നടപടി ആരംഭിക്കുമായിരുന്ന സമയത്തെ സൂചിപ്പിക്കുന്നു. ‘രാവിലെതന്നെ’ ആ സമയബോധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: נַעֲלָה
  choice: പിന്മാറി
  rationale: עלה എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘കയറുക/പോകുക’ ആണെങ്കിലും, ഈ സൈനികസന്ദർഭത്തിൽ പിന്തുടരൽ അവസാനിപ്പിച്ച് മാറിപ്പോകുന്നതാണ് ഉദ്ദേശ്യം. ‘പിന്മാറി’ സന്ദർഭാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  choice: ഓരോരുത്തനും തന്റെ സഹോദരനെ പിന്തുടരുന്നത് അവസാനിപ്പിക്കുമായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഓരോരുത്തൻ തന്റെ സഹോദരന്റെ പിന്നാലെനിന്ന്’ എന്നാണ്. സന്ദർഭത്തിൽ സഹഇസ്രായേല്യനെ പിന്തുടരുന്നത് നിർത്തുക എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ശപഥത്തിന്റെ ശക്തിയും വാക്യത്തിലെ പ്രതിവാസ്തവിക ബന്ധവും സംരക്ഷിച്ചിരിക്കുന്നു; യുദ്ധസന്ദർഭത്തിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാവുന്ന അക്ഷരാർഥമായ ‘കയറിപ്പോകുക’ എന്നതിനു പകരം സന്ദർഭോചിതമായ ‘പിന്മാറുക’ ഉപയോഗിച്ചു.
