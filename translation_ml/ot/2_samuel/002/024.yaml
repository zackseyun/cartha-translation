base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/024.yaml
  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
translation:
  language: ml
  text: യോവാബും അബീശായിയും അബ്നേരിനെ പിന്തുടർന്നു. സൂര്യൻ അസ്തമിച്ചു; അവർ ഗിബെയോൻ മരുഭൂമിയിലേക്കുള്ള വഴിയിൽ[b], ഗീയഹിന് എതിരെയുള്ള[a] അമ്മാ കുന്നുവരെ എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഗീയഹിന്റെ മുമ്പിലുള്ള’; ഹീബ്രു പ്രയോഗത്തിന് ഒരു സ്ഥലത്തിന്റെ മുന്നിലുള്ളതോ അതിന് എതിർവശത്തുള്ളതോ ആയ സ്ഥാനം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഗിബെയോൻ മരുഭൂമിയിലേക്കുള്ള പാതയിലൂടെ’; ഹീബ്രു പ്രയോഗം പൊതുവായ സ്ഥാനം എന്നതിലുപരി അവർ സഞ്ചരിച്ച മാർഗത്തിന് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵי אַבְנֵר
  choice: അബ്നേരിനെ പിന്തുടർന്നു
  rationale: רדף എന്ന ക്രിയ ഇവിടെ സൈനികമായ പിന്തുടരലിനെ സൂചിപ്പിക്കുന്നു; אַחֲרֵי എന്നത് മലയാളത്തിൽ കർമപ്രത്യയത്തോടുകൂടി സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
- source_word: וְהַשֶּׁמֶשׁ בָּאָה
  choice: സൂര്യൻ അസ്തമിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘സൂര്യൻ വന്നു’ എന്നായാലും, ഇത് സൂര്യാസ്തമയത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; മലയാളത്തിൽ ‘അസ്തമിച്ചു’ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: וְהֵמָּה בָּאוּ עַד
  choice: അവർ ... കുന്നുവരെ എത്തി
  rationale: עַד സഞ്ചാരത്തിന്റെ അറ്റം സൂചിപ്പിക്കുന്നു; ‘വരെ എത്തി’ എന്നത് ഭൗമസ്ഥാനത്തേക്കുള്ള നീക്കത്തെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גִּבְעַת אַמָּה
  choice: അമ്മാ കുന്ന്
  rationale: സ്ഥലപ്പേരോടുകൂടിയ ഹീബ്രു construct രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ‘അമ്മാ കുന്ന്’ എന്നു നൽകി.
- source_word: אֲשֶׁר עַל־פְּנֵי גִיחַ
  choice: ഗീയഹിന് എതിരെയുള്ള
  rationale: עַל־פְּנֵי ഒരു സ്ഥലത്തിന്റെ മുന്നിലോ എതിർവശത്തോ ഉള്ള സ്ഥാനം സൂചിപ്പിക്കാം; പ്രധാന പാഠത്തിൽ ‘എതിരെയുള്ള’ എന്ന ഭൗമപരമായ അർഥം സ്വീകരിച്ചു, മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  choice: ഗിബെയോൻ മരുഭൂമിയിലേക്കുള്ള വഴിയിൽ
  rationale: דֶּרֶךְ ‘വഴി/പാത’ എന്നും ഈ ഘടന യാത്രാമാർഗമോ ദിശയോ സൂചിപ്പിക്കാമെന്നും കണക്കിലെടുത്ത് വായനാസൗകര്യമുള്ള രൂപം തിരഞ്ഞെടുത്തു.
- source_word: יוֹאָב / אֲבִישַׁי / אַבְנֵר / אַמָּה / גִּיחַ / גִּבְעוֹן
  choice: യോവാബ് / അബീശായി / അബ്നേർ / അമ്മാ / ഗീയഹ് / ഗിബെയോൻ
  rationale: ഹീബ്രു വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും ആധുനിക മലയാളത്തിൽ ഉച്ചാരണസാദൃശ്യം കാത്ത് ലിപ്യന്തരിച്ചു.
