  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְדֹּ֥ף עֲשָׂהאֵ֖ל אַחֲרֵ֣י אַבְנֵ֑ר וְ/לֹֽא נָטָ֣ה לָ/לֶ֗כֶת עַל הַ/יָּמִין֙ וְ/עַֽל הַ/שְּׂמֹ֔אול מֵ/אַחֲרֵ֖י אַבְנֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/019.yaml
  text: Asahel pursued Abner[a], and he did not turn to the right or to the left from following Abner.
translation:
  language: ml
  text: അസാഹേൽ അബ്നേരിനെ പിന്തുടർന്നു; അബ്നേരിന്റെ പിന്നാലെ പോകുമ്പോൾ അവൻ വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിഞ്ഞില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: പിന്തുടർന്നു
  rationale: רדף സജീവവും തുടർച്ചയുള്ളതുമായ പിന്തുടരലിനെ സൂചിപ്പിക്കുന്നു; ‘പിന്തുടർന്നു’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַחֲרֵי אַבְנֵר
  choice: അബ്നേരിനെ
  rationale: ‘പിന്തുടർന്നു’ എന്ന മലയാളക്രിയ നേരിട്ടുള്ള കർമത്തോടൊപ്പം സ്വാഭാവികമാണ്; എബ്രായത്തിലെ ‘അബ്നേരിന്റെ പിന്നാലെ’ എന്ന ബന്ധം ക്രിയയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: וְלֹא נָטָה
  choice: മാറിയില്ല
  rationale: נטה ഇവിടെ സഞ്ചരിച്ചിരുന്ന ദിശയിൽനിന്ന് വശത്തേക്കു തിരിയുകയോ വ്യതിചലിക്കുകയോ ചെയ്യുന്നതാണ്; ‘മാറിയില്ല’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: לָלֶכֶת
  choice: പോകുമ്പോൾ
  rationale: לָלֶכֶת എന്ന അനന്തക്രിയ പിന്തുടരുന്നതിനിടയിലെ സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു; ‘പോകുമ്പോൾ’ മലയാളത്തിൽ ആ അനുബന്ധപ്രവൃത്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל הַיָּמִין וְעַל הַשְּׂמֹאול
  choice: വലത്തോട്ടോ ഇടത്തോട്ടോ
  rationale: ദിശയിൽനിന്ന് ഒട്ടും മാറാതിരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ ഭൗതികചിത്രം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: അബ്നേരിന്റെ പിന്നാലെ
  rationale: മൂലത്തിലെ ‘അബ്നേരിന്റെ പിന്നിൽനിന്ന്/പിന്നാലെനിന്ന്’ എന്ന ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് തുടർന്നുള്ള പിന്തുടരലിനെ വ്യക്തമാക്കുന്നു.
- source_word: עֲשָׂהאֵל / אַבְנֵר
  choice: അസാഹേൽ / അബ്നേർ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും മൂലോച്ചാരണത്തോട് യോജിച്ചതുമായ രൂപങ്ങളിൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആവർത്തനമുള്ള എബ്രായഘടനയുടെ ഊന്നൽ നിലനിർത്താൻ അബ്നേരിന്റെ പേര് രണ്ടു പ്രാവശ്യം ഉപയോഗിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
