  to: അസാഹേൽ അബ്നേരിനെ പിന്തുടർന്നു; അബ്നേരിന്റെ പിന്നാലെ പോകുമ്പോൾ അവൻ വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിഞ്ഞില്ല.
