base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
translation:
  language: ml
  text: അവർ അസാഹേലിനെ എടുത്തുകൊണ്ടുപോയി, ബേത്‌ലെഹേമിലുണ്ടായിരുന്ന അവന്റെ അപ്പന്റെ കല്ലറയിൽ[a] അടക്കം ചെയ്തു. പിന്നെ യോവാബും അവന്റെ ആളുകളും രാത്രി മുഴുവൻ യാത്ര ചെയ്തു; ഹെബ്രോനിൽവെച്ച് അവർക്ക് നേരം പുലർന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ അപ്പന്റെ കുഴിമാടത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ קֶבֶר എന്ന പദം ഒരു കുഴിമാടത്തെയോ കല്ലറയെയോ കുടുംബശവകുടീരത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഹെബ്രോനിൽവെച്ച് അവർക്കു വെളിച്ചമായി’; ‘ഹെബ്രോനിൽവെച്ച് പുലരി തെളിഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: എടുത്തുകൊണ്ടുപോയി
  rationale: ശവസംസ്കാരത്തിനായി അസാഹേലിന്റെ ശരീരം വഹിച്ചുകൊണ്ടുപോയതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: עֲשָׂהאֵל
  choice: അസാഹേൽ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സാധാരണ ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: וַיִּקְבְּרֻהוּ
  choice: അടക്കം ചെയ്തു
  rationale: קבר എന്ന സാധാരണ ക്രിയയുടെ അർഥം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּקֶבֶר אָבִיו
  choice: അവന്റെ അപ്പന്റെ കല്ലറയിൽ
  rationale: קֶבֶר എന്നത് കുഴിമാടത്തെയോ കുടുംബശവകുടീരത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘കല്ലറ’ സ്വീകരിച്ച് അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: אֲשֶׁר בֵּית לָחֶם
  choice: ബേത്‌ലെഹേമിലുണ്ടായിരുന്ന
  rationale: ബന്ധവാക്യം കല്ലറയുടെ സ്ഥാനം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
- source_word: וַיֵּלְכוּ כָל הַלַּיְלָה
  choice: രാത്രി മുഴുവൻ യാത്ര ചെയ്തു
  rationale: הלך എന്ന വ്യാപകമായ ചലനക്രിയയെ സൈനികമായ ‘മാർച്ച്’ എന്നു അതിവ്യക്തമാക്കാതെ തുടർച്ചയായ യാത്രയായി പരിഭാഷപ്പെടുത്തി.
- source_word: יוֹאָב וַאֲנָשָׁיו
  choice: യോവാബും അവന്റെ ആളുകളും
  rationale: അക്ഷരാർഥമായ ‘അവന്റെ ആളുകൾ’ സൈനികസന്ദർഭം നിലനിർത്തുന്നു; ‘പടയാളികൾ’ എന്നു അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: וַיֵּאֹר לָהֶם
  choice: അവർ ഹെബ്രോനിലെത്തിയപ്പോൾ നേരം പുലർന്നു
  rationale: ‘അവർക്കു വെളിച്ചമായി’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ഹെബ്രോനിലെത്തിയ കൃത്യനിമിഷത്തെയോ അവിടെവെച്ച് പുലർച്ച അവരെ അഭിമുഖീകരിച്ചതിനെയോ സൂചിപ്പിക്കാവുന്ന ചെറിയ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בְּחֶבְרוֹן
  choice: ഹെബ്രോനിലെത്തിയപ്പോൾ
  rationale: സ്ഥലസൂചനയ്ക്ക് യാത്രയുടെ ലക്ഷ്യസ്ഥാന/എത്തിച്ചേരൽ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
