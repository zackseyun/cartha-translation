translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അപ്പൻ’, ‘കല്ലറ’, ‘നേരം പുലർന്നു’ എന്നീ സാധാരണക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ ശവകുടീരം/കുഴിമാടം എന്ന അർഥവ്യാപ്തിയും പുലരിയുടെ എബ്രായ പ്രയോഗവും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
