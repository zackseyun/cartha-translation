reference: 2 Samuel 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֣ה תֶּחֱזַ֣קְנָה יְדֵי/כֶ֗ם וִֽ/הְיוּ֙ לִ/בְנֵי חַ֔יִל כִּי מֵ֖ת אֲדֹנֵי/כֶ֣ם שָׁא֑וּל וְ/גַם אֹתִ֗/י מָשְׁח֧וּ בֵית יְהוּדָ֛ה לְ/מֶ֖לֶךְ עֲלֵי/הֶֽם׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
translation:
  language: ml
  text: ഇപ്പോൾ നിങ്ങളുടെ കൈകൾ ശക്തമാകട്ടെ[a]; നിങ്ങൾ ധീരന്മാരായിരിപ്പിൻ. നിങ്ങളുടെ പ്രഭുവായ ശൗൽ മരിച്ചിരിക്കുന്നു; യെഹൂദാഗൃഹം എന്നെയും തങ്ങളുടെ രാജാവായി അഭിഷേകം ചെയ്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ധൈര്യപ്പെടുവിൻ.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ കൈകൾ ശക്തമാകുന്നതിനെക്കുറിച്ചാണ് പറയുന്നത്; അത് ധൈര്യവും പ്രവർത്തനസന്നദ്ധതയും സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള പ്രയോഗം ധൈര്യവും കഴിവും ഉള്ളവരായിരിപ്പാനുള്ള ആഹ്വാനമാണ്; പലപ്പോഴും അതിനു യുദ്ധസന്ദർഭമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: וְעַתָּה എന്ന വ്യക്തമായ കാലസൂചകവും സംഭാഷണത്തിലെ മാറ്റവും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: നിങ്ങളുടെ കൈകൾ ശക്തിപ്പെടട്ടെ
  rationale: ധൈര്യവും പ്രവർത്തനസന്നദ്ധതയും സൂചിപ്പിക്കുന്ന എബ്രായ ശാരീരികരൂപകം നിലനിർത്തുന്നു.
- source_word: וִהְיוּ לִבְנֵי חַיִל
  choice: നിങ്ങൾ ധീരന്മാരായിരിക്കുവിൻ
  rationale: בְּנֵי חַיִל എന്ന പ്രയോഗത്തിലെ പുരുഷലിംഗവും ധൈര്യം, കഴിവ്, യുദ്ധസന്നദ്ധത എന്നീ ആശയങ്ങളും സന്ദർഭാനുസൃതമായി നൽകുന്നു.
- source_word: אֲדֹנֵיכֶם
  choice: നിങ്ങളുടെ യജമാനൻ
  rationale: ഇവിടെ ദൈവിക പദവിയല്ല, ശൗലിനോടുള്ള രാഷ്ട്രീയ വിധേയത്വം സൂചിപ്പിക്കുന്ന മാന്യസംബോധനയാണ്.
- source_word: בֵית יְהוּדָה
  choice: യെഹൂദാഗൃഹം
  rationale: യെഹൂദാ ഗോത്രസമൂഹത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ കൂട്ടായ 'ഗൃഹം' എന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: מָשְׁחוּ ... לְמֶלֶךְ עֲלֵיהֶם
  choice: തങ്ങളുടെ രാജാവായി അഭിഷേകം ചെയ്തിരിക്കുന്നു
  rationale: അഭിഷേകത്തിലൂടെയുള്ള ഔദ്യോഗിക രാജനിയമനവും അതിന്റെ നിലവിലെ പ്രസക്തിയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: לִבְנֵי חַיִל എന്ന പുരുഷലിംഗ പ്രയോഗം
  choice: ധീരന്മാരായിരിക്കുവിൻ
  alternative: ധൈര്യശാലികളായിരിക്കുവിൻ
  rationale: സന്ദർഭത്തിൽ ശൗലിന്റെ പുരുഷ സൈനികപിന്തുണക്കാരോടാണ് ദാവീദ് സംസാരിക്കുന്നത്; അതിനാൽ മൂലത്തിലെ പുരുഷലിംഗം നിലനിർത്തുന്നു.
- issue: אֲדֹנֵיכֶם എന്ന പദത്തിന്റെ പദവിസൂചന
  choice: നിങ്ങളുടെ യജമാനനായ ശൗൽ
  alternative: നിങ്ങളുടെ പ്രഭുവായ ശൗൽ
  rationale: ഇത് ദൈവനാമമോ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന പദവിയോ അല്ല; മനുഷ്യരാജാവായ ശൗലിനോടുള്ള രാഷ്ട്രീയ വിധേയത്വമാണ് ഉദ്ദേശ്യം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മൂലപാഠത്തിലുള്ള וְעַתָּה പരിഭാഷയിൽ ‘ഇപ്പോൾ’ എന്നു നിലനിർത്തി. എബ്രായത്തിലെ കൈകളുടെ രൂപകം പ്രധാനപാഠത്തിൽ സൂക്ഷിച്ച് അതിന്റെ ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
