source:
  edition: WLC
  text: וַֽ/יַּחֲזִ֜קוּ אִ֣ישׁ בְּ/רֹ֣אשׁ רֵעֵ֗/הוּ וְ/חַרְבּ/וֹ֙ בְּ/צַ֣ד רֵעֵ֔/הוּ וַֽ/יִּפְּל֖וּ יַחְדָּ֑ו וַ/יִּקְרָא֙ לַ/מָּק֣וֹם הַ/ה֔וּא חֶלְקַ֥ת הַצֻּרִ֖ים אֲשֶׁ֥ר בְּ/גִבְעֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/016.yaml
  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
translation:
  language: ml
  text: ഓരോരുത്തനും തന്റെ എതിരാളിയുടെ തലയിൽ പിടിമുറുക്കി; അവന്റെ വാൾ എതിരാളിയുടെ പാർശ്വത്തിലായിരുന്നു. അങ്ങനെ അവർ ഒരുമിച്ചു വീണു. അതുകൊണ്ട് ഗിബെയോനിലുള്ള ആ സ്ഥലത്തിന് ഹെൽക്കത്ത്-ഹസ്സൂരീം[a] എന്നു പേരായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹെൽക്കത്ത്-ഹസ്സൂരീം എന്നത് എബ്രായ സ്ഥലനാമത്തിന്റെ ലിപ്യന്തരമാണ്. അതിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; ‘പാർശ്വങ്ങളുടെ വയൽ,’ ‘മൂർച്ചയുള്ള വാളുകളുടെ വയൽ’ തുടങ്ങിയ അർഥങ്ങൾ നിർദേശിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזִקוּ
  choice: പിടിച്ചു
  rationale: യുദ്ധസന്ദർഭത്തിലെ ബലമായ പിടിത്തത്തെയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുമുള്ള പ്രയോഗം.
- source_word: אִישׁ ... רֵעֵהוּ
  choice: ഓരോരുത്തനും തന്റെ എതിരാളിയുടെ
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിലാണ്. רֵעַ സൗഹൃദം സൂചിപ്പിക്കേണ്ടതില്ലാത്തതിനാൽ ഈ ഏറ്റുമുട്ടലിൽ ‘എതിരാളി’യാണ് ആശയം വ്യക്തമായി നൽകുന്നത്.
- source_word: בְּרֹאשׁ
  choice: തലയിൽ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘തല’ നിലനിർത്തുന്നു; പിടിച്ച ശരീരഭാഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  choice: അവന്റെ വാൾ എതിരാളിയുടെ പാർശ്വത്തിൽ തറഞ്ഞു
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിതവും അത്യന്തം ചുരുക്കമുള്ളതുമായ യുദ്ധവിവരണം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം അവതരിപ്പിക്കുന്നു. ‘പാർശ്വം’ צַד എന്ന പദത്തിന്റെ ശരീരസംബന്ധമായ അർഥം നിലനിർത്തുന്നു; ആരാണ് ആദ്യം കുത്തിയതെന്നോ പ്രവൃത്തിയുടെ കൂടുതൽ വിശദാംശങ്ങളോ ചേർക്കുന്നില്ല.
- source_word: וַיִּפְּלוּ יַחְדָּו
  choice: അങ്ങനെ അവർ ഒരുമിച്ചു വീണു
  rationale: തുടർന്നുണ്ടായ ഫലവും ഒരേ സമയത്തെ വീഴ്ചയും പ്രകടമാക്കുന്നു.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: അതുകൊണ്ട് ... ആ സ്ഥലത്തിന് ... എന്നു പേരായി
  rationale: പേര് നൽകിയ വ്യക്തിയെ എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മലയാളത്തിലെ അവ്യക്തകർത്തൃപ്രയോഗം നിലനിർത്തുകയും സംഭവത്തിന്റെ ഫലമായ നാമകരണം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: חֶלְקַת הַצֻּרִים
  choice: ഹെൽക്കത്ത്-ഹസ്സൂരീം
  rationale: പേരിന്റെ വ്യുത്പത്തിയും കൃത്യാർഥവും അനിശ്ചിതമായതിനാൽ അർഥം നിർബന്ധിച്ച് തീരുമാനിക്കാതെ സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: ഗിബെയോനിലുള്ള
  rationale: പേരിട്ട സ്ഥലം ഗിബെയോനിലാണെന്ന് relative clause സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
