  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֤פֶן אַבְנֵר֙ אַֽחֲרָ֔י/ו וַ/יֹּ֕אמֶר הַ/אַתָּ֥ה זֶ֖ה עֲשָׂהאֵ֑ל וַ/יֹּ֖אמֶר אָנֹֽכִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/020.yaml
  text: Abner turned behind him and said[a], “Are you Asahel?” And he said, “I am.”
translation:
  language: ml
  text: അബ്നേർ പിന്നിലേക്കു തിരിഞ്ഞ്, “നീ തന്നെയാണോ അസാഹേൽ?” എന്നു ചോദിച്ചു. “ഞാൻ തന്നെയാണ്,” അവൻ മറുപടി പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: തിരിഞ്ഞ്
  rationale: פנה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘തിരിയുക’ സ്വാഭാവികമായും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: אַחֲרָיו
  choice: പിന്നിലേക്കു
  rationale: അബ്നേർ തന്റെ പിന്നിലേക്കു തിരിയുന്നതെന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു; ‘തിരിഞ്ഞുനോക്കി’ എന്നു നൽകിയാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘നോക്കുക’ എന്ന ആശയം ചേർക്കും.
- source_word: הֲאַתָּה זֶה
  choice: നീ തന്നെയാണോ
  rationale: തിരിച്ചറിയൽ ചോദ്യം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; זֶה നൽകുന്ന ഊന്നൽ ‘തന്നെ’ വഴി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: עֲשָׂהאֵל
  choice: അസാഹേൽ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സാധാരണ ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻ തന്നെയാണ്
  rationale: സ്വതന്ത്ര സർവനാമം ഇവിടെ സ്വയം തിരിച്ചറിയിക്കുന്ന പൂർണ മറുപടിയായി പ്രവർത്തിക്കുന്നു; അതിലെ ഊന്നൽ ‘തന്നെയാണ്’ വഴി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיֹּאמֶר
  choice: ചോദിച്ചു / മറുപടി പറഞ്ഞു
  rationale: ഒരേ എബ്രായ ക്രിയയായ ‘പറഞ്ഞു’ സന്ദർഭാനുസൃതമായി ആദ്യത്തേത് ചോദ്യമായും രണ്ടാമത്തേത് മറുപടിയായും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും കഥനത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ തിരിച്ചറിയൽചോദ്യവും മറുപടിയിലെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
