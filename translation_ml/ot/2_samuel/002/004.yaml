  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദയിലെ പുരുഷന്മാർ വന്നു. അവിടെവെച്ച് അവർ ദാവീദിനെ യെഹൂദാഗൃഹത്തിന്മേൽ രാജാവായി അഭിഷേകം ചെയ്തു. അവർ ദാവീദിനോടു പറഞ്ഞു: “ശൗലിനെ അടക്കംചെയ്തത് യാബേശ്-ഗിലെയാദിലെ പുരുഷന്മാരാണ്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യാബേശ്-ഗിലെയാദിലെ പുരുഷന്മാർ ശൗലിനെ അടക്കംചെയ്തു.”'
    reason: אֲשֶׁר קָבְרוּ എന്ന ബന്ധവാക്യം തിരിച്ചറിയൽ ഊന്നലോടെയോ ലളിതമായ ബന്ധവാക്യമായോ ഗ്രഹിക്കാം.
