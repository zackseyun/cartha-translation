  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. പട്ടികയിലെ ഓരോ പ്രദേശത്തിന്റെയും ജനവിഭാഗത്തിന്റെയും മേലുള്ള രാജാധികാരം വ്യക്തമാക്കാൻ ‘…മേലും’ ആവർത്തിച്ചു; മൂലപാഠത്തിലെ ദുഷ്കരമായ הָאֲשׁוּרִי എന്ന രൂപത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
