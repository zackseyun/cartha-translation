source:
  edition: WLC
  text: וַ/יַּמְלִכֵ֨/הוּ֙ אֶל הַ/גִּלְעָ֔ד וְ/אֶל הָ/אֲשׁוּרִ֖י וְ/אֶֽל יִזְרְעֶ֑אל וְ/עַל אֶפְרַ֨יִם֙ וְ/עַל בִּנְיָמִ֔ן וְ/עַל יִשְׂרָאֵ֖ל כֻּלֹּֽ/ה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/009.yaml
  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
translation:
  language: ml
  text: അവനെ ഗിലെയാദിന്മേലും അശൂര്യരുടെമേലും[a] യിസ്രെയേലിന്മേലും എഫ്രയീമിന്മേലും ബെന്യാമീനിന്മേലും മുഴുവൻ ഇസ്രായേലിന്മേലും രാജാവാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘അശൂര്യർ’ എന്നാണ്. ചിലർ ഇതിനെ ആശേർ ഗോത്രത്തെയോ ആശേർ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്ന ‘ആശേർ’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  choice: അവനെ … രാജാവാക്കി
  rationale: מלך എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും മൂന്നാംപുരുഷ ഏകവചന കർമപ്രത്യയവും ചേർന്ന് ‘അവനെ രാജാവാക്കി/രാജാവായി സ്ഥാപിച്ചു’ എന്ന കാരണാർഥം നൽകുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘രാജാവാക്കി’ അതിനെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל / עַל
  choice: …മേൽ
  rationale: രാജാധികാരം പ്രയോഗിക്കുന്ന പ്രദേശങ്ങളെയും ജനവിഭാഗങ്ങളെയും സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ രണ്ടു ഉപസർഗങ്ങൾക്കും ‘മേൽ’ എന്നത് സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമായ പരിഭാഷയാണ്.
- source_word: הַגִּלְעָד
  choice: ഗിലെയാദ്
  rationale: പ്രദേശനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: הָאֲשׁוּרִי
  choice: അശ്ശൂര്യർ
  rationale: മസോററ്റിക് സ്വരചിഹ്നീകരണം നിർദേശിക്കുന്ന ജനവിഭാഗനാമത്തെ കൂട്ടവാചകമായി പരിഭാഷപ്പെടുത്തി. പാഠരൂപം ദുഷ്കരമായതിനാൽ ‘ആശേർ’ എന്ന മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יִזְרְעֶאל
  choice: യിസ്രെയേൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ‘ഇസ്രായേൽ’ എന്ന പേരിൽനിന്ന് വേർതിരിച്ചറിയാവുന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: אֶפְרַיִם
  choice: എഫ്രയീം
  rationale: ഗോത്രനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: בִּנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: ഗോത്രനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: יִשְׂרָאֵל כֻּלֹּה
  choice: മുഴുവൻ ഇസ്രായേൽ
  rationale: כֻּלֹּה സൂചിപ്പിക്കുന്ന സമഗ്രത ‘മുഴുവൻ’ എന്ന പദം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
