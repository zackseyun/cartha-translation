source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַבְנֵר֙ אֶל יוֹאָ֔ב יָק֤וּמוּ נָא֙ הַ/נְּעָרִ֔ים וִֽ/ישַׂחֲק֖וּ לְ/פָנֵ֑י/נוּ וַ/יֹּ֥אמֶר יוֹאָ֖ב יָקֻֽמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/014.yaml
  text: Then Abner said to Joab, “Please let the young men arise and compete before us.” And Joab said, “Let them arise.”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്നേർ യോവാബിനോടു പറഞ്ഞു: “യുവാക്കൾ എഴുന്നേറ്റ് നമ്മുടെ മുമ്പിൽ ഒന്നു മത്സരിക്കട്ടെ.” യോവാബ് പറഞ്ഞു: “അവർ എഴുന്നേൽക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: യുവാക്കൾ
  rationale: സന്ദർഭത്തിൽ ഏറ്റുമുട്ടലിനായി തിരഞ്ഞെടുത്ത യുവ പോരാളികളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘യുവാക്കൾ’ മൂലപദത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וִישַׂחֲקוּ
  choice: മത്സരിക്കട്ടെ
  rationale: שׂחק എന്ന ക്രിയയ്ക്ക് ‘കളിക്കുക/വിനോദിക്കുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും, പിന്നാലെ നടക്കുന്ന ആയുധധാരികളായ ഏറ്റുമുട്ടൽ ഇവിടെ മാരകമായ മത്സരത്തെ സൂചിപ്പിക്കുന്നു. ‘മത്സരിക്കട്ടെ’ ഈ സന്ദർഭാർഥം നൽകുകയും പരിഹാസാത്മകമായ ഭാഷയുടെ നിഴൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: נָא
  choice: ഒന്നു
  rationale: ഹീബ്രുവിലെ അഭ്യർഥനാസൂചക കണത്തിന്റെ മൃദുത്വം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לְפָנֵינוּ
  choice: നമ്മുടെ മുമ്പിൽ
  rationale: സ്ഥലപരവും സാക്ഷികളുടെ സാന്നിധ്യവും സൂചിപ്പിക്കുന്ന മൂലപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. യുദ്ധസന്ദർഭത്തിലെ വാക്കുകളുടെ കഠിനത നിലനിർത്തിക്കൊണ്ട്, മൂലത്തിലെ അഭ്യർഥനാഭാവവും ആവർത്തനവും സംരക്ഷിച്ചു.
