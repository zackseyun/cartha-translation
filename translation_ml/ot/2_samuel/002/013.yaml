translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ആവർത്തനഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കുമ്പോഴും ഇരുകൂട്ടരും കുളത്തിന്റെ എതിർവശങ്ങളിൽ ഇരുന്ന ദൃശ്യവിന്യാസം സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
