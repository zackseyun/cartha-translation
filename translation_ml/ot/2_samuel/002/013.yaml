source:
  edition: WLC
  text: וְ/יוֹאָ֨ב בֶּן צְרוּיָ֜ה וְ/עַבְדֵ֤י דָוִד֙ יָֽצְא֔וּ וַֽ/יִּפְגְּשׁ֛וּ/ם עַל בְּרֵכַ֥ת גִּבְע֖וֹן יַחְדָּ֑ו וַ/יֵּ֨שְׁב֜וּ אֵ֤לֶּה עַל הַ/בְּרֵכָה֙ מִ/זֶּ֔ה וְ/אֵ֥לֶּה עַל הַ/בְּרֵכָ֖ה מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
translation:
  language: ml
  text: സെരൂയയുടെ മകനായ യോവാബും ദാവീദിന്റെ സേവകരും പുറപ്പെട്ടു; അവർ ഗിബെയോനിലെ കുളത്തിനരികിൽവെച്ച് അവരെ കണ്ടുമുട്ടി. ഒരു കൂട്ടർ കുളത്തിന്റെ ഒരു വശത്തും മറ്റേ കൂട്ടർ മറുവശത്തും ഇരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗിബെയോനിലെ ജലസംഭരണി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം നിർമിതമായ ഒരു കുളത്തെയോ ജലസംഭരണിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב בֶּן צְרוּיָה
  choice: സെരൂയയുടെ മകനായ യോവാബും
  rationale: വാവിന്റെ ആഖ്യാനബന്ധം മലയാളത്തിലെ ‘-ഉം’ വഴി നിലനിർത്തുകയും കുടുംബപരമായ തിരിച്ചറിയൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְ/עַבְדֵי דָוִד
  choice: ദാവീദിന്റെ സേവകരും
  rationale: עבד എന്ന പദത്തിന്റെ ‘സേവകർ’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭം സൈനികമാണെങ്കിലും ‘പടയാളികൾ’ എന്നു അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: יָצְאוּ
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന സാധാരണ ക്രിയയുടെ പുറപ്പെടുക എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַֽ/יִּפְגְּשׁ֛וּ/ם
  choice: അവരെ കണ്ടുമുട്ടി
  rationale: ക്രിയയോടു ചേർന്ന ബഹുവചന കർമപ്രത്യയം സംരക്ഷിക്കുന്നു; ‘അവർ’ മുൻവാക്യത്തിലെ അബ്നേരിനെയും അവന്റെ ആളുകളെയും സൂചിപ്പിക്കുന്നു.
- source_word: עַל בְּרֵכַת גִּבְעוֹן
  choice: ഗിബെയോനിലെ കുളത്തിനരികിൽവെച്ച്
  rationale: בְּרֵכָה എന്നത് കുളം അഥവാ ജലസംഭരണി എന്നാകാം; മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘കുളം’ സ്വീകരിക്കുകയും മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: יַחְדָּו
  choice: കണ്ടുമുട്ടി
  rationale: יַחְדָּו ഇവിടെ ഇരുകൂട്ടരും ഒരേ സ്ഥലത്ത് നേർക്കുനേർ എത്തിയെന്ന ആശയത്തെ ശക്തിപ്പെടുത്തുന്നു; മലയാളത്തിൽ ‘ഒരുമിച്ച് അവരെ കണ്ടുമുട്ടി’ അസ്വാഭാവികവും അർഥഭ്രമകരവുമായതിനാൽ കണ്ടുമുട്ടൽപ്രയോഗത്തിൽ ആശയം ഉൾക്കൊള്ളിക്കുന്നു.
- source_word: וַ/יֵּשְׁבוּ
  choice: ഇരുന്നു
  rationale: ישב എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: אֵלֶּה ... וְ/אֵלֶּה
  choice: ഒരു കൂട്ടർ ... മറ്റേ കൂട്ടർ
  rationale: ഹീബ്രു demonstrative വിരുദ്ധത മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; വെറും ‘ഇവർ...അവർ’ എന്നത് മുൻവാക്യത്തിലെ സർവനാമവുമായി ആശയക്കുഴപ്പം സൃഷ്ടിക്കാം.
- source_word: עַל הַ/בְּרֵכָה מִ/זֶּה ... עַל הַ/בְּרֵכָה מִ/זֶּה
  choice: കുളത്തിന്റെ ഒരു വശത്തും ... മറുവശത്തും
  rationale: ഒരേ കുളത്തിന്റെ എതിർവശങ്ങളെയാണ് ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കുന്നത്; അതിനെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
