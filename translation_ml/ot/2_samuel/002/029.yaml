translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ മലയാളം. യാത്രാവിവരണത്തിന്റെ വേഗത നിലനിർത്താൻ ഒറ്റ സംയുക്തവാക്യം ഉപയോഗിച്ചു; ഭൂമിശാസ്ത്രനാമങ്ങളിലെ അനിശ്ചിതത്വം അമിതമായി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിച്ചു.
