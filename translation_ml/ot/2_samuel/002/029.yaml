  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַבְנֵ֣ר וַֽ/אֲנָשָׁ֗י/ו הָֽלְכוּ֙ בָּֽ/עֲרָבָ֔ה כֹּ֖ל הַ/לַּ֣יְלָה הַ/ה֑וּא וַ/יַּעַבְר֣וּ אֶת הַ/יַּרְדֵּ֗ן וַ/יֵּֽלְכוּ֙ כָּל הַ/בִּתְר֔וֹן וַ/יָּבֹ֖אוּ מַחֲנָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
translation:
  language: ml
  text: അബ്നേരും അവന്റെ ആളുകളും ആ രാത്രി മുഴുവൻ അരാബയിലൂടെ സഞ്ചരിച്ചു; അവർ യോർദ്ദാൻ കടന്ന് ബിത്രോൻ[a] മുഴുവനും കടന്നുപോയി മഹനയീമിൽ എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മുഴുവൻ മലയിടുക്കിലൂടെയും’ അഥവാ ‘മുഴുവൻ പിളർന്ന ഭൂപ്രദേശത്തിലൂടെയും’; ‘ബിത്രോൻ’ എന്ന എബ്രായപദം ഒരു സ്ഥലനാമമോ ഭൂപ്രദേശത്തെ വിവരിക്കുന്ന പദമോ ആയിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה
  choice: അരാബയിലൂടെ
  rationale: യോർദ്ദാൻ താഴ്‌വരയുമായി ബന്ധപ്പെട്ട ഭൂമിശാസ്ത്രനാമമായിരിക്കാനുള്ള സാധ്യത നിലനിർത്താൻ പൊതുവായ ‘സമതലം’ എന്നതിനു പകരം ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: כֹּל הַלַּיְלָה הַהוּא
  choice: ആ രാത്രി മുഴുവൻ
  rationale: രാത്രിയുടെ മുഴുവൻ ദൈർഘ്യവും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: അവർ യോർദ്ദാൻ കടന്ന്
  rationale: עבר എന്ന ക്രിയ ഇവിടെ നദി മുറിച്ചുകടക്കുന്നതിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: כָּל הַבִּתְרוֹן
  choice: ബിത്രോൻ മുഴുവനും
  rationale: പദം സ്ഥലനാമമോ മലയിടുക്ക്/പിളർന്ന ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന വിവരണപദമോ ആകാം; മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണം നൽകി അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: מַחֲנָיִם
  choice: മഹനയീം
  rationale: സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ മലയാള ലിപിയിൽ നൽകി.
- source_word: הָלְכוּ / וַיֵּלְכוּ / וַיָּבֹאוּ
  choice: സഞ്ചരിച്ചു ... പിന്നിട്ട് ... എത്തി
  rationale: യാത്ര, പ്രദേശത്തിലൂടെയുള്ള നീക്കം, ലക്ഷ്യസ്ഥാനത്തെത്തൽ എന്നീ ആഖ്യാനഘട്ടങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: וַאֲנָשָׁיו
  choice: അവന്റെ ആളുകൾ
  rationale: അക്ഷരാർഥത്തോടടുത്തതും സൈനികരെന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമായ സ്വാഭാവിക പ്രയോഗം.
