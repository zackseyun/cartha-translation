  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧סֶף ע֣וֹד אַבְנֵ֗ר לֵ/אמֹר֙ אֶל עֲשָׂהאֵ֔ל ס֥וּר לְ/ךָ֖ מֵ/אַֽחֲרָ֑/י לָ֤/מָּה אַכֶּ֨/כָּה֙ אַ֔רְצָ/ה וְ/אֵיךְ֙ אֶשָּׂ֣א פָנַ֔/י אֶל יוֹאָ֖ב אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
translation:
  language: ml
  text: 'അബ്നേർ വീണ്ടും അസാഹേലിനോടു പറഞ്ഞു: “എന്നെ പിന്തുടരുന്നതിൽനിന്ന് മാറിപ്പോകുക. ഞാൻ നിന്നെ അടിച്ചു നിലത്തുവീഴ്ത്തുന്നത് എന്തിന്? പിന്നെ നിന്റെ സഹോദരനായ യോവാബിന്റെ മുമ്പിൽ എനിക്ക് എങ്ങനെ മുഖമുയർത്താൻ കഴിയും?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിന്റെ സഹോദരനായ യോവാബിന്റെ മുമ്പിൽ എങ്ങനെ ഞാൻ എന്റെ മുഖം ഉയർത്തും?” അഥവാ, “ഞാൻ അവനെ എങ്ങനെ അഭിമുഖീകരിക്കും?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... לֵאמֹר
  choice: വീണ്ടും ... പറഞ്ഞു
  rationale: ‘കൂട്ടിച്ചേർത്തു വീണ്ടും പറയുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആവർത്തനാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: סוּר לְךָ מֵאַחֲרַי
  choice: എന്നെ പിന്തുടരുന്നതിൽനിന്ന് മാറിപ്പോകുക
  rationale: סוּר എന്നതിലെ ‘മാറുക/തിരിഞ്ഞുപോകുക’ എന്ന ആശയവും מֵאַחֲרַי എന്നതിലെ പിന്തുടരൽസന്ദർഭവും സംരക്ഷിക്കുന്നു.
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  choice: ഞാൻ നിന്നെ അടിച്ചു നിലത്തുവീഴ്ത്തേണ്ടിവരുന്നത് എന്തിന്?
  rationale: נכהയെ അതിരുകടന്ന് ‘കൊല്ലുക’ എന്നു വ്യക്തമാക്കാതെ ‘അടിക്കുക’ എന്നും, אַרְצָהയിലെ നിലത്തേക്കുള്ള ചലനം ‘നിലത്തുവീഴ്ത്തുക’ എന്നും അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ മാരകസാധ്യത നിലനിൽക്കുന്നു.
- source_word: וְאֵיךְ אֶשָּׂא פָנַי
  choice: എനിക്ക് എങ്ങനെ തലയുയർത്തിനിൽക്കാൻ കഴിയും?
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘എന്റെ മുഖം ഉയർത്തുക’ എന്ന ദൃശ്യവും ലജ്ജകൂടാതെ ഒരാളെ അഭിമുഖീകരിക്കുക എന്ന പ്രയോഗാർഥവും മലയാളത്തിലെ സ്വാഭാവിക ‘തലയുയർത്തിനിൽക്കുക’ എന്ന ശൈലിയിൽ ചേർക്കുന്നു.
- source_word: אֶל יוֹאָב אָחִיךָ
  choice: നിന്റെ സഹോദരനായ യോവാബിന്റെ മുമ്പിൽ
  rationale: അവൻ അഭിമുഖീകരിക്കേണ്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന אֶל എന്നതിന്റെ സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אַבְנֵר / עֲשָׂהאֵל / יוֹאָב
  choice: അബ്നേർ / അസാഹേൽ / യോവാബ്
  rationale: എബ്രായ വ്യക്തിനാമങ്ങളെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന, മൂലഭാഷയോടു ചേർന്ന ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അസാഹേലിനെ പ്രഹരിക്കുന്നതിന്റെ ഫലം
  choice: ‘അടിച്ചു നിലത്തുവീഴ്ത്തുക’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘കൊല്ലുക’
  rationale: സന്ദർഭം മരണത്തെ ശക്തമായി സൂചിപ്പിച്ചാലും ഈ വാക്യത്തിലെ ക്രിയ നേരിട്ട് ‘കൊല്ലുക’ എന്നു മാത്രം പറയുന്നില്ല; അതിനാൽ മൂലത്തിലെ അർഥവ്യാപ്തി ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. സംഭാഷണത്തിലെ മുന്നറിയിപ്പിന്റെ അടിയന്തരത നിലനിർത്തിയിട്ടുണ്ട്; എബ്രായ മുഖപ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വാഭാവിക മലയാളശൈലിയായും അടിക്കുറിപ്പിൽ അക്ഷരാർഥമായും നൽകിയിട്ടുണ്ട്.
