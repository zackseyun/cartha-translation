translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ രാജഭരണ സൂത്രവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യപാഠത്തിൽ പ്രത്യക്ഷപ്പെടേണ്ടതിനാൽ പേരിനോടു ചേർന്ന് [c] സ്ഥാപിക്കണം; അന്തിമ മുഖ്യപാഠക്രമം: “ശൗലിന്റെ മകനായ ഈശ്-ബോശെത്ത്[c] ഇസ്രായേലിന്മേൽ രാജാവായപ്പോൾ അവന് നാല്പതു വയസ്സായിരുന്നു; അവൻ രണ്ടു വർഷം ഭരിച്ചു. എന്നാൽ യെഹൂദാഗൃഹം[a] ദാവീദിനെ അനുഗമിച്ചു.[b]”'
