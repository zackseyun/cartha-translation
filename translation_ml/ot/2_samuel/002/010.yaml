  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
translation:
  language: ml
  text: ശൗലിന്റെ മകനായ ഈശ്-ബോശെത്ത്[c] ഇസ്രായേലിന്മേൽ രാജാവായപ്പോൾ അവന് നാല്പതു വയസ്സായിരുന്നു; അവൻ രണ്ടു വർഷം ഭരിച്ചു. എന്നാൽ യെഹൂദാഗൃഹം[a] ദാവീദിനെ അനുഗമിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യെഹൂദാഗൃഹം” എന്നത് യെഹൂദാഗോത്രത്തെയോ യെഹൂദയുടെ ജനസമൂഹത്തെയോ കൂട്ടായി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ദാവീദിനെ അനുഗമിച്ചു” എന്നതിന് “ദാവീദിനോട് കൂറുപുലർത്തി” അഥവാ “ദാവീദിന്റെ പക്ഷത്തായിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥം “ദാവീദിന്റെ പിന്നാലെ ആയിരുന്നു” എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: മസോരറ്റിക് പാഠത്തിൽ ഇവിടെ പേര് “ഈശ്-ബോശെത്ത്” എന്നാണ്; ബന്ധപ്പെട്ട മറ്റു പാഠപരമ്പരകളിൽ “എശ്ബാൽ” എന്ന വ്യത്യസ്തരൂപം കാണുക.
