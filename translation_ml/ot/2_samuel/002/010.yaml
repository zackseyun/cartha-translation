- source_word: אִישׁ בֹּשֶׁת
  choice: ഈശ്-ബോശെത്ത്
  rationale: WLCയിലെ മസോരറ്റിക് പാഠത്തിലുള്ള പേരിന്റെ രൂപം നിലനിർത്തുന്നു; ബന്ധപ്പെട്ട പാരമ്പര്യത്തിലെ എശ്ബാൽ എന്ന രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: בְּמָלְכוֹ עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്മേൽ രാജാവായപ്പോൾ
  rationale: בְּ എന്ന കാലസൂചക പ്രയോഗവും രാജകീയ അധികാരം സൂചിപ്പിക്കുന്ന עַל എന്നതും സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭത്തിൽ രാജഭരണത്തിന്റെ ആരംഭമാണ് ഉദ്ദേശ്യം.
- source_word: וּשְׁתַּיִם שָׁנִים מָלָךְ
  choice: അവൻ രണ്ടു വർഷം ഭരിച്ചു
  rationale: രാജഭരണത്തിന്റെ ദൈർഘ്യം വ്യക്തമാക്കുന്ന എബ്രായ സൂത്രവാക്യത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: ഈശ്-ബോശെത്തിൻ കീഴിലുള്ള ഇസ്രായേലിനെയും ദാവീദിനെ പിന്തുടർന്ന യെഹൂദയെയും തമ്മിൽ വൈരുധ്യപ്പെടുത്തുന്നു.
- source_word: בֵּית יְהוּדָה
  choice: യെഹൂദാഗൃഹം
  rationale: ഗോത്രത്തെയോ ജനസമൂഹത്തെയോ ഒരു കൂട്ടായ ഘടകമായി സൂചിപ്പിക്കുന്ന ‘യെഹൂദയുടെ ഭവനം’ എന്ന എബ്രായ രൂപകം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: הָיוּ אַחֲרֵי דָוִד
  choice: ദാവീദിനെ അനുഗമിച്ചു
  rationale: അക്ഷരാർഥത്തിലെ ‘ദാവീദിന്റെ പിന്നാലെ ആയിരുന്നു’ എന്ന രൂപത്തിന്റെ രാഷ്ട്രീയ കൂറും പിന്തുണയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
