translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ യുദ്ധവിവരണശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിൽ പ്രത്യേകം രേഖപ്പെടുത്തിയിരിക്കുന്ന മരണഫലം ആവർത്തനമെന്നു തോന്നിയാലും ഒഴിവാക്കിയിട്ടില്ല. എല്ലാ വ്യക്തിനാമങ്ങളും പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾരൂപങ്ങളിൽ നൽകി.
