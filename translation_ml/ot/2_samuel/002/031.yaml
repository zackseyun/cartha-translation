  yaml_path: translation/ot/2_samuel/002/031.yaml
  text: But David’s servants struck down three hundred and sixty men from Benjamin and from Abner’s men[a].
translation:
  language: ml
  text: എന്നാൽ ദാവീദിന്റെ അനുചരന്മാർ ബെന്യാമീന്യരിലും അബ്നേരിന്റെ ആളുകളിലുംപ്പെട്ട മുന്നൂറ്ററുപത് പേരെ അടിച്ചുവീഴ്ത്തി; അവർ മരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദാവീദിന്റെ അനുചരന്മാർ ...’ ഹീബ്രുവിലെ ബന്ധകപദത്തെ ലളിതമായ തുടർച്ചയായി, ‘കൂടാതെ’ എന്ന അർഥത്തിലും വിവർത്തനം ചെയ്യാം. മുൻവാക്യത്തിലെ മരണസംഖ്യയുമായുള്ള വൈരുധ്യം വ്യക്തമാക്കാനാണ് മുഖ്യപാഠത്തിൽ ‘എന്നാൽ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי דָוִד
  choice: എന്നാൽ ദാവീദിന്റെ ഭൃത്യന്മാർ
  rationale: വാക്യാരംഭത്തിലെ וְ മുൻവാക്യത്തിലെ ദാവീദിന്റെ പക്ഷത്തുണ്ടായ നഷ്ടവുമായി വൈരുധ്യം സൂചിപ്പിക്കുന്നതായി സന്ദർഭത്തിൽ വായിക്കാം; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘എന്നാൽ’ എന്നു നൽകി. עֲבָדִים ഇവിടെ അടിമത്തസ്ഥിതിയെക്കാൾ ദാവീദിന്റെ സേവനത്തിലുള്ള അനുചരന്മാരെയോ പോരാളികളെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭൃത്യന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הִכּוּ
  choice: അടിച്ചുവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും യുദ്ധസന്ദർഭത്തിലെ മാരകമായ വീഴ്ത്തലും ഒരുമിച്ച് പ്രകടമാക്കുന്നു; പിന്നാലെയുള്ള מֵתוּ പ്രത്യേകം നിലനിർത്താനും ഇത് സഹായിക്കുന്നു.
- source_word: מִ/בִּנְיָמִן
  choice: ബെന്യാമീൻ ഗോത്രക്കാരിലുംപ്പെട്ട
  rationale: מִן കൊല്ലപ്പെട്ടവർ ഏതു കൂട്ടത്തിൽനിന്നുള്ളവരാണെന്ന് സൂചിപ്പിക്കുന്നു. ‘ബെന്യാമീൻ’ ഇവിടെ വ്യക്തിയെക്കാൾ ഗോത്രത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘ഗോത്രക്കാർ’ വ്യക്തമാക്കി.
- source_word: וּ/בְ/אַנְשֵׁי אַבְנֵר
  choice: അബ്നേരിന്റെ ആളുകളിലുംപ്പെട്ട
  rationale: അബ്നേരിന്റെ സംഘത്തിൽപ്പെട്ട പോരാളികളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. മുൻപത്തെ ഗോത്രപരാമർശത്തോടൊപ്പം സ്വാഭാവികമായി ചേരാൻ ‘ആളുകളിലുംപ്പെട്ട’ എന്നു നൽകി.
- source_word: שְׁלֹשׁ מֵאוֹת וְ/שִׁשִּׁים אִישׁ
  choice: മുന്നൂറ്ററുപതു പേരെ
  rationale: സംഖ്യയും അതോടൊപ്പമുള്ള אִישׁ എന്ന എണ്ണൽനാമവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: מֵתוּ
  choice: അവർ മരിച്ചു
  rationale: ഹീബ്രു പാഠം הִכּוּ എന്ന ‘അടിച്ചുവീഴ്ത്തി’ എന്ന ക്രിയയ്ക്കു പുറമേ മരണഫലവും വ്യക്തമായി പറയുന്നു. ആവർത്തനസാദൃശ്യം ഉണ്ടായാലും ആ ഉറവിടവിവരം നഷ്ടപ്പെടുത്താതെ സ്വതന്ത്ര ഉപവാക്യമായി നിലനിർത്തി.
