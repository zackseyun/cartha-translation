  terminology: ‘ദാവീദിന്റെ അനുചരന്മാർ’ and ‘അബ്നേരിന്റെ ആളുകൾ’ distinguish David’s retainers from Abner’s men without importing a doctrinal or social-status interpretation. ‘അടിച്ചുവീഴ്ത്തി; അവർ മരിച്ചു’ correctly preserves the Hebrew’s separate striking and dying statements.
