id: 2SA.2.12
reference: 2 Samuel 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ אַבְנֵ֣ר בֶּן נֵ֔ר וְ/עַבְדֵ֖י אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֑וּל מִֽ/מַּחֲנַ֖יִם גִּבְעֽוֹנָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
translation:
  language: ml
  text: അപ്പോൾ നേരിന്റെ മകനായ അബ്നേരും ശൗലിന്റെ മകനായ ഈശ്-ബോശെത്തിന്റെ[a] സേവകരും മഹനയീമിൽനിന്ന് ഗിബെയോനിലേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇതേ വ്യക്തിയെ 1 ദിനവൃത്താന്തം 8:33; 9:39 എന്നിവയിൽ ‘എശ്ബാൽ’ എന്നു വിളിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: അപ്പോൾ ... പുറപ്പെട്ടു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമായ കഥാപ്രവാഹം നൽകുന്നു. എബ്രായ ക്രിയ ഏകവചനമാണെങ്കിലും തുടർന്ന് അബ്നേരും സേവകരും ചേർന്ന കർത്താവായതിനാൽ മലയാളത്തിൽ ബഹുവചനരൂപം ഉപയോഗിച്ചു.
- source_word: אַבְנֵר בֶּן נֵר
  choice: നേരിന്റെ മകനായ അബ്നേർ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണത്തിൽ നൽകി; പിതൃനാമബന്ധം ‘മകനായ’ എന്നു വ്യക്തമാക്കി.
- source_word: וְעַבְדֵי
  choice: സേവകരും
  rationale: עֶבֶד എന്ന പദത്തിന്റെ സേവകൻ/ഭൃത്യൻ/അനുചരൻ എന്നീ അർഥസാധ്യതകളിൽ, രാഷ്ട്രീയ-സൈനിക പശ്ചാത്തലത്തെ അതിരുകടന്ന് നിർവചിക്കാതെ അടിസ്ഥാനമായ സേവനബന്ധം നിലനിർത്താൻ ‘സേവകർ’ തിരഞ്ഞെടുത്തു.
- source_word: אִישׁ בֹּשֶׁת
  choice: ഈശ്-ബോശെത്ത്
  rationale: ഈ വാക്യത്തിലെ മസോരറ്റിക് പാഠരൂപം തന്നെയാണ് ലിപ്യന്തരണം ചെയ്തത്; ദിനവൃത്താന്തത്തിലെ ‘എശ്ബാൽ’ എന്ന സമാന്തര നാമരൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: בֶּן שָׁאוּל
  choice: ശൗലിന്റെ മകനായ
  rationale: തിരിച്ചറിയൽ നൽകുന്ന പിതൃനാമപ്രയോഗം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: מִמַּחֲנַיִם
  choice: മഹനയീമിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ഉറവിടസൂചന ‘-ൽനിന്ന്’ എന്നു നൽകി; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: גִּבְעֹנָה
  choice: ഗിബെയോനിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה ചലനത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘-ലേക്കു’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. പേരുകളുടെ ലിപ്യന്തരണത്തിൽ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത രൂപങ്ങൾ ഉപയോഗിച്ചു; രാഷ്ട്രീയ-സൈനിക പശ്ചാത്തലത്തെ അനാവശ്യമായി വിശദീകരിക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി.
