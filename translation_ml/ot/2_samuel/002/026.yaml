source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אַבְנֵ֜ר אֶל יוֹאָ֗ב וַ/יֹּ֨אמֶר֙ הֲ/לָ/נֶ֨צַח֙ תֹּ֣אכַל חֶ֔רֶב הֲ/ל֣וֹא יָדַ֔עְתָּה כִּֽי מָרָ֥ה תִהְיֶ֖ה בָּ/אַחֲרוֹנָ֑ה וְ/עַד מָתַי֙ לֹֽא תֹאמַ֣ר לָ/עָ֔ם לָ/שׁ֖וּב מֵ/אַחֲרֵ֥י אֲחֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/026.yaml
  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്നേർ യോവാബിനെ വിളിച്ചു പറഞ്ഞു: “വാൾ എന്നേക്കും വിഴുങ്ങിക്കൊണ്ടിരിക്കണമോ? ഒടുവിൽ അതു കയ്പേറിയതായിത്തീരുമെന്ന് നിനക്കറിയില്ലേ? തങ്ങളുടെ സഹോദരന്മാരുടെ പിന്നാലെ പോകുന്നതിൽനിന്ന് മടങ്ങാൻ[a] ജനത്തോടു പറയാതിരിക്കാൻ നീ എത്രകാലം പോകുന്നു?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘തങ്ങളുടെ സഹോദരന്മാരുടെ പിന്നാലെനിന്ന് മടങ്ങാൻ’; അഥവാ, അവരുടെ പിന്നാലെ പോകുന്നത് അവസാനിപ്പിക്കാൻ.'
    reason: מֵאַחֲרֵי എന്നതിന് അക്ഷരാർഥത്തിൽ ‘പിന്നാലെനിന്ന്/പിന്നാലിൽനിന്ന്’ എന്ന ആശയമാണുള്ളത്; ഈ യുദ്ധസന്ദർഭത്തിൽ അത് പിന്തുടരൽ അവസാനിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: הֲלָנֶצַח
  choice: എന്നേക്കും
  rationale: അവസാനമില്ലാത്ത തുടർച്ചയെക്കുറിച്ചുള്ള ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תֹּאכַל חֶרֶב
  choice: വാൾ ... വിഴുങ്ങിക്കൊണ്ടിരിക്കണമോ
  rationale: ‘വാൾ തിന്നുക/വിഴുങ്ങുക’ എന്ന എബ്രായ വ്യക്തിവൽക്കരണവും യുദ്ധത്തിന്റെ ഭീകരതയും ‘കൊല തുടരണമോ’ എന്നു പരത്തിപ്പറയാതെ സംരക്ഷിക്കുന്നു.
- source_word: מָרָה תִהְיֶה בָּאַחֲרוֹנָה
  choice: ഒടുവിൽ അതു കയ്പേറിയതായിത്തീരും
  rationale: തുടർന്നുള്ള പോരാട്ടത്തിന്റെ അന്തിമഫലത്തെ സൂചിപ്പിക്കുന്ന ‘കയ്പ്’ എന്ന രൂപകവും കാലസൂചനയും നിലനിർത്തുന്നു.
- source_word: וְעַד מָתַי לֹא תֹאמַר
  choice: പറയാതെ നീ എത്രകാലം ഇരിക്കും
  rationale: പ്രവർത്തിക്കാൻ ഇനിയും വൈകുന്നതിനെ ചോദ്യം ചെയ്യുന്ന എബ്രായ ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ ആലങ്കാരിക ചോദ്യമായി നൽകുന്നു.
- source_word: לָשׁוּב מֵאַחֲרֵי
  choice: പിന്തുടരുന്നതിൽനിന്ന് മടങ്ങാൻ
  rationale: שׁוּב എന്നതിന്റെ ‘മടങ്ങുക’ എന്ന അടിസ്ഥാനാർഥവും യുദ്ധസന്ദർഭത്തിലെ പിന്തുടരൽ അവസാനിപ്പിക്കുക എന്ന ആശയവും ഒരുമിച്ചു വ്യക്തമാക്കുന്നു.
- source_word: אֲחֵיהֶם
  choice: തങ്ങളുടെ സഹോദരന്മാരെ
  rationale: ഇസ്രായേല്യർ സ്വന്തം ജനത്തോടു പോരാടുന്നതിലെ കുടുംബപരമായ വേദനയും എബ്രായത്തിലെ ‘സഹോദരന്മാർ’ എന്ന നേരിട്ടുള്ള പദപ്രയോഗവും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വാൾ വിഴുങ്ങുക,’ ‘കയ്പേറിയതാകുക’ എന്നീ മൂലരൂപകങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു; സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ ‘പിന്തുടരുക’ ഉപയോഗിച്ചു.
