id: 2SA.15.7
reference: 2 Samuel 15:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ אַרְבָּעִ֣ים שָׁנָ֑ה וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ אֶל הַ/מֶּ֔לֶךְ אֵ֣לֲכָה נָּ֗א וַ/אֲשַׁלֵּ֛ם אֶת נִדְרִ֛/י אֲשֶׁר נָדַ֥רְתִּי לַֽ/יהוָ֖ה בְּ/חֶבְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: ml
  text: 'നാൽപ്പതു[a] വർഷം കഴിഞ്ഞപ്പോൾ അബ്ശാലോം രാജാവിനോടു പറഞ്ഞു: “ദയവായി, എനിക്ക് പോകാനും ഹെബ്രോനിൽവെച്ച് യഹോവയ്ക്കു ഞാൻ നേർന്ന എന്റെ നേർച്ച നിറവേറ്റാനും അനുവദിക്കണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില പുരാതന വിവർത്തനങ്ങളിൽ: നാലു വർഷം.'
    reason: മസോരറ്റിക് പാഠത്തിലെ «നാൽപ്പതു വർഷം» എന്ന വായന നിലനിർത്തിക്കൊണ്ട് പുരാതന സാക്ഷ്യങ്ങളിലെ പ്രധാന സംഖ്യാവ്യത്യാസം സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: നാല്പതു വർഷം കഴിഞ്ഞപ്പോൾ
  rationale: കാലയളവിന്റെ അവസാനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം; പാഠത്തിലെ ‘നാല്പതു’ എന്ന സംഖ്യ തിരുത്താതെ നിലനിർത്തുന്നു.
- source_word: אֵלֲכָה נָּא
  choice: എന്നെ പോകാൻ അനുവദിക്കണമേ
  rationale: നָא നൽകുന്ന വിനീതമായ അഭ്യർഥനാഭാവം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַאֲשַׁלֵּם אֶת־נִדְרִי
  choice: എന്റെ നേർച്ച നിറവേറ്റാൻ
  rationale: ശִׁלֵּם എന്ന ക്രിയയ്ക്ക് നേർച്ചയോടൊപ്പം ‘നിറവേറ്റുക/അടച്ചുതീർക്കുക’ എന്ന അർഥമുണ്ട്; മലയാളത്തിൽ ‘നേർച്ച നിറവേറ്റുക’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത പാലിക്കുന്നതുമാണ്.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിൽ അവതരിപ്പിക്കുന്നു; സാധാരണ ‘കർത്താവ്’ എന്ന പദവിയിൽ ലയിപ്പിക്കുന്നില്ല.
- source_word: בְּחֶבְרוֹן
  choice: ഹെബ്രോനിൽവെച്ച്
  rationale: സ്ഥലസൂചനയായ ‘ഹെബ്രോനിൽ’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; വാക്യഘടനയിൽ ഇത് നേർച്ച നേർന്നതിനോടാണ് സ്വാഭാവികമായി ബന്ധപ്പെടുന്നത്.
theological_decisions:
- issue: മസോരറ്റിക് പാഠത്തിലെ ‘നാല്പതു വർഷം’ എന്ന വായനയും പുരാതന വിവർത്തനങ്ങളിലെ ‘നാലു വർഷം’ എന്ന വ്യത്യസ്ത വായനയും
  choice: പ്രധാനപാഠത്തിൽ ‘നാല്പതു വർഷം’ നിലനിർത്തി
  alternative: ചില പുരാതന സാക്ഷ്യങ്ങളെ പിന്തുടർന്ന് ‘നാലു വർഷം’ എന്നു വായിക്കുക
  rationale: നൽകിയിരിക്കുന്ന WLC പാഠത്തിന്റെ നേരിട്ടുള്ള വായന നാല്പതു എന്നാണ്. ചരിത്രക്രമവുമായി ബന്ധപ്പെട്ട ബുദ്ധിമുട്ട് വിവർത്തനത്തിനുള്ളിൽ നിശ്ശബ്ദമായി പരിഹരിക്കാതെ മൂലപാഠം സംരക്ഷിക്കുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വ്യക്തിനാമത്തിന്റെ സ്വഭാവം മലയാളത്തിൽ തുറന്നുകാട്ടുന്നു; ഇതിലൂടെ പ്രത്യേക സമുദായവ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രാജാവിനോടുള്ള വിനീതമായ അപേക്ഷ ‘അനുവദിക്കണമേ’ എന്ന രൂപത്തിൽ സൂചിപ്പിച്ചിരിക്കുന്നു. ഈ ഒറ്റവാക്യ കരടിൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല; അതിനാൽ പ്രധാനപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുമില്ല.
