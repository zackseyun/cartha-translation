  text: וַ/יֵּצֵ֥א הַ/מֶּ֛לֶךְ וְ/כָל הָ/עָ֖ם בְּ/רַגְלָ֑י/ו וַ/יַּעַמְד֖וּ בֵּ֥ית הַ/מֶּרְחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/017.yaml
  text: The king went out[a], and all the people with him on foot, and they halted at the distant house.
translation:
  language: ml
  text: രാജാവ് പുറപ്പെട്ടു; ജനമെല്ലാം അദ്ദേഹത്തോടൊപ്പം കാൽനടയായി പോയി. അവർ വിദൂര ഭവനത്തിൽ[a] നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ഇതൊരു സ്ഥലനാമമായിരിക്കാം: “ബേത്ത്-മെർഹാക്ക്.” എബ്രായ പ്രയോഗത്തിന് “ദൂരത്തിന്റെ ഭവനം” എന്നർഥം വരാം; പലരും അതിനെ വിവരണാത്മകമായി “അവസാനത്തെ ഭവനം” എന്നും മനസ്സിലാക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ യാത്രാസന്ദർഭത്തിലുള്ള ‘പുറപ്പെടുക/പുറത്തേക്കു പോകുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ ദാവീദിനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമപദത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: וְכָל הָעָם
  choice: ജനമെല്ലാം
  rationale: עָם അനുഗമിച്ച മുഴുവൻ കൂട്ടത്തെയും വിശാലമായി സൂചിപ്പിക്കുന്നു; ‘സൈന്യം’ എന്നു പരിഭാഷപ്പെടുത്തി അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: בְּרַגְלָיו
  choice: അദ്ദേഹത്തോടൊപ്പം കാൽനടയായി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ കാലടിയിൽ/കാലുകളോടുകൂടെ’ എന്നാണെങ്കിലും, ഇവിടെ രാജാവിനെ അനുഗമിച്ചുകൊണ്ടുള്ള യാത്രയെയാണ് സൂചിപ്പിക്കുന്നത്; ബന്ധവും കാൽനടയാത്രയും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: וַיַּעַמְדוּ
  choice: നിന്നു
  rationale: עמד എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘നിൽക്കുക’ യാത്രാസന്ദർഭത്തിൽ ‘അവിടെ നിന്നു/നിർത്തി’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘നിന്നു’ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: בֵּית הַמֶּרְחָק
  choice: ദൂരെയുള്ള വീടിനരികെ
  rationale: ‘ദൂരം/വിദൂരതയുടെ വീട്’ എന്ന എബ്രായ പ്രയോഗത്തെ വിവരണാത്മകമായി നൽകുന്നു; ‘അവസാനത്തെ വീട്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക അർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
