  yaml_path: translation/ot/2_samuel/015/016.yaml
  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
translation:
  language: ml
  text: അങ്ങനെ രാജാവ് പുറപ്പെട്ടു; തന്റെ ഗൃഹത്തിലുള്ള എല്ലാവരും അവന്റെ പിന്നാലെ കാൽനടയായി പോയി.[a] രാജാവ് രാജഭവനം കാത്തുസൂക്ഷിക്കാൻ തന്റെ വെപ്പാട്ടികളായ പത്തു സ്ത്രീകളെ അവിടെ വിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘തന്റെ ഗൃഹത്തിലുള്ള എല്ലാവരും അവന്റെ കാലിങ്കൽ.’ അവർ രാജാവിനെ അനുഗമിച്ച് കാൽനടയായി പോയി എന്ന ആശയമാണ് ഈ എബ്രായപ്രയോഗം നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ യാത്രതിരിക്കൽ എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ നൽകുന്നു; സന്ദർഭത്തിൽ ഇല്ലാത്ത അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: എബ്രായപാഠം ദാവീദ് എന്ന പേര് ഉപയോഗിക്കാതെ സ്ഥാനപ്പേര് ഉപയോഗിക്കുന്നതിനാൽ അതുതന്നെ നിലനിർത്തുന്നു.
- source_word: וְכָל־בֵּיתוֹ
  choice: തന്റെ ഗൃഹത്തിലുള്ള എല്ലാവരും
  rationale: ഇവിടെ בַּיִת ഭൗതികകെട്ടിടത്തെയല്ല, രാജാവിന്റെ ഗൃഹത്തോടു ചേർന്ന ആളുകളെയാകെ സൂചിപ്പിക്കുന്നു. ‘കുടുംബാംഗങ്ങൾ’ എന്നു ചുരുക്കുന്നത് സേവകരും മറ്റു ഗൃഹജനങ്ങളും ഉൾപ്പെടാവുന്ന അർഥപരിധി കുറയ്ക്കും.
- source_word: בְּרַגְלָיו
  choice: അവന്റെ പിന്നാലെ കാൽനടയായി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ കാലിങ്കൽ/കാലടിയിൽ’ എന്നായിരിക്കാമെങ്കിലും, ഈ പ്രയോഗം അവർ രാജാവിനെ അനുഗമിച്ച് കാൽനടയായി പോയെന്ന ആശയം നൽകുന്നു. സ്വാഭാവിക മലയാളത്തിൽ അതു വ്യക്തമാക്കുകയും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּעֲזֹב
  choice: അവിടെ വിട്ടു
  rationale: עזב ഇവിടെ ഉപേക്ഷിച്ചുകളഞ്ഞു എന്ന വികാരഭാരം നിർബന്ധമാക്കാതെ, ഒരു പ്രത്യേക ചുമതലയ്ക്കായി പിന്നിൽ നിർത്തിയതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  choice: തന്റെ വെപ്പാട്ടികളായ പത്തു സ്ത്രീകളെ
  rationale: മൂലത്തിലെ ‘സ്ത്രീകൾ’ എന്നും ‘വെപ്പാട്ടികൾ’ എന്നും ഉള്ള സമാനാധികരണബന്ധം നിലനിർത്തുന്ന, വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: לִשְׁמֹר
  choice: കാത്തുസൂക്ഷിക്കാൻ
  rationale: שׁמר എന്നതിലെ കാവൽ, പരിപാലനം എന്നീ സാധ്യതകളെ ഒരുമിച്ച് ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളം.
- source_word: הַבָּיִת
  choice: രാജഭവനം
  rationale: ഇവിടെ പദം ആളുകളെയല്ല, രാജാവിന്റെ ഭൗതികവസതിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘രാജഭവനം’ സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘കൊട്ടാരം’ എന്നതിനെക്കാൾ മൂലത്തിലെ ‘ഭവനം’ എന്ന ആശയത്തോട് അടുത്തുനിൽക്കുന്നു.
