translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഗൃഹത്തിലുള്ള എല്ലാവരും’ എന്നത് രാജകുടുംബത്തെ മാത്രം സൂചിപ്പിക്കാതെ വിശാലമായ രാജഗൃഹത്തെ ഉൾക്കൊള്ളുന്നു; ‘വെപ്പാട്ടി’ എന്നത് മൂലത്തിലെ പ്രത്യേക സാമൂഹികസ്ഥാനം മറച്ചുവയ്ക്കാതെ നൽകുന്നു.
