  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם מִי יְשִׂמֵ֥/נִי שֹׁפֵ֖ט בָּ/אָ֑רֶץ וְ/עָלַ֗/י יָב֥וֹא כָּל אִ֛ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִ֥יב וּ/מִשְׁפָּ֖ט וְ/הִצְדַּקְתִּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
translation:
  language: ml
  text: 'അബ്ശാലോം ഇങ്ങനെ പറയുമായിരുന്നു[a]: “എന്നെ ദേശത്ത് ന്യായാധിപനായി നിയമിച്ചിരുന്നെങ്കിൽ! അപ്പോൾ തർക്കമോ വ്യവഹാരമോ ഉള്ള ഏതൊരാൾക്കും[b] എന്റെ അടുക്കൽ വരാമായിരുന്നു; ഞാൻ അയാൾക്കു നീതി ലഭ്യമാക്കുമായിരുന്നു[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ആർ എന്നെ ദേശത്ത് ന്യായാധിപനായി നിയമിക്കും?” എബ്രായപ്രയോഗം വെറും വിവരാന്വേഷണമല്ല, ഒരു ആഗ്രഹപ്രകടനമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: “ഏതൊരാൾക്കും” എന്നത് വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനത്തിലുള്ള എബ്രായപ്രയോഗത്തിന്റെ പൊതുവായ അർഥം നൽകുന്നു; നിയമകാര്യമുള്ള ഏതു വ്യക്തിയെയും അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: “ഞാൻ അയാളെ നീതിമാനെന്നു വിധിക്കുമായിരുന്നു” / “ഞാൻ അയാളുടെ ഭാഗം ന്യായമാണെന്നു വിധിക്കുമായിരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ഇങ്ങനെ പറയുമായിരുന്നു
  rationale: സന്ദർഭത്തിൽ ആവർത്തിച്ചുപറഞ്ഞിരുന്ന വാക്കുകളെയാണ് ഇവിടെ വിവരിക്കുന്നത്; അതിനാൽ ലളിതഭൂതകാലത്തേക്കാൾ പതിവായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന രൂപം സ്വാഭാവികമാണ്.
- source_word: מִי יְשִׂמֵנִי
  choice: എന്നെ ... നിയമിച്ചിരുന്നെങ്കിൽ!
  rationale: അക്ഷരാർഥത്തിൽ ‘ആർ എന്നെ നിയമിക്കും?’ എന്നാണെങ്കിലും, ഇവിടെ വിവരമന്വേഷിക്കുന്ന ചോദ്യത്തേക്കാൾ ശക്തമായ ആഗ്രഹപ്രകടനമാണ്; മലയാളത്തിലെ ഈ ആശംസാരൂപം ആ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: שֹׁפֵט
  choice: ന്യായാധിപൻ
  rationale: നിയമവ്യവഹാരങ്ങളിൽ വിധി പറയുന്ന വ്യക്തിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ഔദ്യോഗികവും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ പദമാണിത്.
- source_word: בָּאָרֶץ
  choice: ഈ ദേശത്ത്
  rationale: ഭരണപരമായ ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം; സന്ദർഭത്തിലുള്ള ദേശം നിർദ്ദിഷ്ടമായതിനാൽ ‘ഈ’ ചേർത്തു.
- source_word: וְעָלַי יָבוֹא
  choice: എന്റെ അടുക്കൽ വരാമായിരുന്നു
  rationale: അബ്ശാലോം സങ്കൽപ്പിക്കുന്ന നിയമനത്തിന്റെ ഫലമായി എല്ലാവർക്കും അവനെ സമീപിക്കാനുള്ള അവസരം ലഭിക്കുമെന്ന സോപാധിക അർഥം പ്രകടമാക്കുന്നു.
- source_word: כָּל אִישׁ
  choice: ഏതൊരാൾക്കും
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും ഇവിടെ പൊതുവായി നിയമപ്രശ്നമുള്ള ഏതു വ്യക്തിയെയും ഉൾക്കൊള്ളുന്നു; ആ പ്രതിനിധിക പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: רִיב וּמִשְׁפָּט
  choice: തർക്കമോ വ്യവഹാരമോ
  rationale: ആദ്യപദം തർക്കത്തെയും നിയമപരമായ വാദത്തെയും, രണ്ടാമത്തേത് വിധിനിർണയം ആവശ്യമായ നിയമകാര്യത്തെയും സൂചിപ്പിക്കുന്നു; ഇരട്ട നിയമഭാവം നിലനിർത്തുന്നു.
- source_word: וְהִצְדַּקְתִּיו
  choice: ഞാൻ അയാൾക്കു നീതി ലഭ്യമാക്കുമായിരുന്നു
  rationale: ഹിഫീൽ രൂപത്തിന് ‘നീതിമാനെന്നു വിധിക്കുക’, ‘ന്യായം സ്ഥാപിക്കുക’, ‘നീതി നൽകുക’ എന്നീ സമീപാർഥങ്ങളുണ്ട്; ന്യായാധിപത്യസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ വിവർത്തനമാണിത്, എന്നാൽ കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നിയമപരമായ പദങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ തെരഞ്ഞെടുത്തു; എബ്രായത്തിലെ ആഗ്രഹപ്രകടനവും അവസാന ക്രിയയുടെ ന്യായവിധിസംബന്ധമായ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
