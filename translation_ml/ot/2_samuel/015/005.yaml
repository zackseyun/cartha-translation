id: 2SA.15.5
reference: 2 Samuel 15:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָה֙ בִּ/קְרָב אִ֔ישׁ לְ/הִשְׁתַּחֲוֺ֖ת ל֑/וֹ וְ/שָׁלַ֧ח אֶת יָד֛/וֹ וְ/הֶחֱזִ֥יק ל֖/וֹ וְ/נָ֥שַׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/005.yaml
  text: And whenever a man came near to bow down to him[a], he would reach out his hand, take hold of him, and kiss him.
translation:
  language: ml
  text: ഒരാൾ അവനെ വണങ്ങാൻ[a] അടുത്തുവരുമ്പോഴെല്ലാം, അവൻ കൈ നീട്ടി അയാളെ പിടിച്ചു ചുംബിക്കുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന് ആദരമർപ്പിക്കാൻ.’ എബ്രായക്രിയയ്ക്ക് ബഹുമാനസൂചകമായി കുനിയുക എന്നർഥമാകാം; ഇടുങ്ങിയ മതാർഥത്തിൽ ആരാധിക്കുക എന്നത് നിർബന്ധമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: വരുമ്പോഴെല്ലാം ... ചുംബിക്കുമായിരുന്നു
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ ആവർത്തിച്ചിരുന്ന പതിവിനെ സൂചിപ്പിക്കുന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ പതിവുകാലപ്രയോഗത്തിലൂടെ നൽകി.
- source_word: בִּקְרָב
  choice: അടുത്തുവരുമ്പോൾ
  rationale: അബ്ശാലോമിന്റെ അടുത്തേക്കുള്ള സമീപനചലനം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: ഇവിടെ ഏകവചനത്തിലുള്ള വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ 'ഒരാൾ' സ്വാഭാവികമാണ്.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: അവനെ വണങ്ങാൻ
  rationale: ബഹുമാനസൂചകമായി കുനിയുകയോ സാഷ്ടാംഗം ചെയ്യുകയോ ചെയ്യുന്ന ദേഹഭാവത്തെ സൂചിപ്പിക്കുന്നു; ഇടുങ്ങിയ മതാർഥത്തിലുള്ള ആരാധനയായി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וְשָׁלַח אֶת יָדוֹ
  choice: കൈ നീട്ടി
  rationale: കൈ മുന്നോട്ടു നീട്ടുന്നതിനെ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְהֶחֱזִיק לוֹ
  choice: അയാളെ പിടിച്ചു
  rationale: സാമൂഹിക സൗഹൃദഭാവമുള്ള ഈ സന്ദർഭത്തിൽ കടുപ്പമുള്ള 'പിടിച്ചടക്കി' എന്ന അർഥം ഒഴിവാക്കി, കൈകൊണ്ട് പിടിക്കുന്ന പ്രവൃത്തി നിലനിർത്തുന്നു.
- source_word: וְנָשַׁק לוֹ
  choice: ചുംബിക്കുമായിരുന്നു
  rationale: മൂലത്തിലെ ലളിതമായ 'ചുംബിക്കുക' എന്ന ക്രിയയും പ്രവൃത്തിയുടെ പതിവുസ്വഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: לְהִשְׁתַּחֲוֺת എന്ന ക്രിയയുടെ മതപരമോ സാമൂഹികമോ ആയ അർഥം
  choice: വണങ്ങാൻ
  alternative: അവന് ആദരമർപ്പിക്കാൻ / അവന്റെ മുമ്പിൽ സാഷ്ടാംഗം വീഴാൻ
  rationale: സന്ദർഭം രാജകീയമോ സാമൂഹികമോ ആയ ആദരസൂചക നമസ്കാരമാണ്; 'വണങ്ങുക' ദേഹഭാവം സംരക്ഷിക്കുമ്പോഴും അതിനെ നിർബന്ധമായി ആരാധനയാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ചിരുന്ന പ്രവൃത്തി ‘വരുമ്പോഴെല്ലാം ... ചുംബിക്കുമായിരുന്നു’ എന്ന ഘടനയിൽ വ്യക്തമാക്കി; മൂലത്തിലെ സാമൂഹിക-രാഷ്ട്രീയ ഭാവവും അർഥവൈവിധ്യവും നിലനിർത്തി.
