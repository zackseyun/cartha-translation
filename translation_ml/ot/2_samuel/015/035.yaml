  text: Are not Zadok and Abiathar the priests there with you? And whatever matter you hear from the king’s house, you shall report to Zadok and Abiathar the priests.
translation:
  language: ml
  text: പുരോഹിതന്മാരായ സാദോക്കും അബ്യാഥാരും നിന്നോടുകൂടെ അവിടെയില്ലയോ? രാജകൊട്ടാരത്തിൽനിന്ന് നീ കേൾക്കുന്ന ഏതു കാര്യവും പുരോഹിതന്മാരായ സാദോക്കിനെയും അബ്യാഥാരിനെയും അറിയിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: രാജകൊട്ടാരത്തിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘രാജാവിന്റെ ഭവനത്തിൽനിന്ന്’; സന്ദർഭത്തിൽ രാജാവിന്റെ ഔദ്യോഗിക വസതിയും ഭരണകേന്ദ്രവും സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘രാജകൊട്ടാരം’ എന്നു നൽകി.
- source_word: כָּל הַדָּבָר
  choice: ഏതു കാര്യവും
  rationale: ‘എല്ലാ കാര്യം/വാക്ക്’ എന്ന ഹീബ്രായ പ്രയോഗം ഇവിടെ ലഭിക്കുന്ന ഏതൊരു വിവരത്തെയും സൂചിപ്പിക്കുന്നു; ‘ഏതു കാര്യവും’ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: תַּגִּיד
  choice: അറിയിക്കണം
  rationale: ഹിഫിൽ രൂപത്തിന്റെ ‘അറിയിക്കുക/റിപ്പോർട്ട് ചെയ്യുക’ എന്ന അർഥം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ആദ്യവാക്യത്തിലെ പ്രതീക്ഷിത സമ്മതം സൂചിപ്പിക്കുന്ന ചോദ്യം ‘ഇല്ലയോ?’ എന്ന് നിലനിർത്തി; പുരോഹിതന്മാർ എന്ന പദം ഇരുവിടത്തും മൂലപാഠാനുസരണം ആവർത്തിച്ചു.
