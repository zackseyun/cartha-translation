  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל צָד֣וֹק הַ/כֹּהֵ֔ן הֲ/רוֹאֶ֣ה אַתָּ֔ה שֻׁ֥בָ/ה הָ/עִ֖יר בְּ/שָׁל֑וֹם וַ/אֲחִימַ֨עַץ בִּנְ/ךָ֜ וִ/יהוֹנָתָ֧ן בֶּן אֶבְיָתָ֛ר שְׁנֵ֥י בְנֵי/כֶ֖ם אִתְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് സാദോക്ക് പുരോഹിതനോടു പറഞ്ഞു: “നീ ദർശകനല്ലയോ?[a] സമാധാനത്തോടെ നഗരത്തിലേക്കു മടങ്ങിപ്പോകുക. നിന്റെ മകൻ അഹീമാസും അബ്യാഥാരിന്റെ മകൻ യോനാഥാനും—നിങ്ങളുടെ രണ്ടു പുത്രന്മാരും—നിങ്ങളോടൊപ്പം മടങ്ങട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നീ കാണുന്നില്ലേ?” അഥവാ “നിനക്കു കാര്യം മനസ്സിലാകുന്നില്ലേ?” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ‘ദർശകൻ’ എന്ന നിലയെയോ കാണുക/ഗ്രഹിക്കുക എന്ന പ്രവർത്തിയെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/רוֹאֶה
  choice: നീ ദർശകനല്ലയോ?
  rationale: הֲ എന്ന ചോദ്യകണവും ראה എന്ന ധാതുവിന്റെ നിർദിഷ്ട കർത്തൃവാചക രൂപവും ചേർന്ന പ്രയോഗം ‘നീ ദർശകനല്ലയോ?’ എന്നു ഗ്രഹിക്കാം. ‘ദർശകൻ’ എന്ന പദം നിരീക്ഷിച്ച് വിവരം അറിയിക്കുന്ന ഒരാളെന്ന സന്ദർഭസൂചന നിലനിർത്തുന്നു; കാണുക/ഗ്രഹിക്കുക എന്ന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: שֻׁבָ/ה הָ/עִיר
  choice: നഗരത്തിലേക്കു മടങ്ങിപ്പോകുക
  rationale: שוב എന്ന ക്രിയയുടെ ആജ്ഞാരൂപവും ദിശാസൂചകമായ ה-യും ലക്ഷ്യസ്ഥാനമായ ‘നഗരം’ എന്നതും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּ/שָׁלוֹם
  choice: സമാധാനത്തോടെ
  rationale: ശാലോം എന്ന പദത്തിന്റെ സമാധാനം/സുരക്ഷ എന്ന അർഥവ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു; ഇവിടെ സുരക്ഷിതമായി മടങ്ങുക എന്ന സന്ദർഭാർഥവും ഉൾക്കൊള്ളുന്നു.
- source_word: וַ/אֲחִימַעַץ בִּנְ/ךָ וִ/יהוֹנָתָן בֶּן אֶבְיָתָר
  choice: നിന്റെ മകൻ അഹീമാസും അബ്യാഥാരിന്റെ മകൻ യോനാഥാനും
  rationale: രണ്ടു പുത്രന്മാരുടെയും പേരുകളും അവരുടെ പിതൃബന്ധങ്ങളും എബ്രായത്തിലെ സമാന്തര തിരിച്ചറിയലനുസരിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵי בְנֵי/כֶם אִתְּ/כֶם
  choice: നിങ്ങളുടെ രണ്ടു പുത്രന്മാരും—നിങ്ങളോടൊപ്പം മടങ്ങട്ടെ
  rationale: ബഹുവചന പ്രത്യയങ്ങൾ സാദോക്കിനെയും അബ്യാഥാരിനെയും കൂട്ടമായി അഭിസംബോധന ചെയ്യുന്നു. മലയാളത്തിൽ അപൂർണ്ണമായി തോന്നാതിരിക്കാൻ മുൻ ആജ്ഞയിൽനിന്ന് ‘മടങ്ങട്ടെ’ സ്വാഭാവികമായി പൂരിപ്പിച്ചിരിക്കുന്നു; ഇടയിലുള്ള വിശദീകരണസ്വഭാവം ദീർഘവിരാമംകൊണ്ട് കാണിക്കുന്നു.
- source_word: וַ/יֹּאמֶר הַ/מֶּלֶךְ
  choice: അപ്പോൾ രാജാവ് ... പറഞ്ഞു
  rationale: കഥാഖ്യാനത്തെ മുന്നോട്ടു നയിക്കുന്ന waw-consecutive മലയാളത്തിലെ സ്വാഭാവികമായ ‘അപ്പോൾ’ എന്ന ബന്ധകത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: സാദോക്കിനെ ‘ദർശകൻ’ എന്നു വിളിക്കുന്നതിന്റെ സ്വഭാവം
  choice: ചോദ്യരൂപമായ ‘നീ ദർശകനല്ലയോ?’ നിലനിർത്തി
  alternative: ‘നീ കാണുന്നില്ലേ?’ / ‘നീ കാര്യങ്ങൾ ഗ്രഹിക്കുന്നില്ലേ?’
  rationale: മൂലപാഠം പദവിനാമത്തെയും കാണുക/ഗ്രഹിക്കുക എന്ന ക്രിയാർഥത്തെയും അനുവദിക്കുന്നു. സാദോക്കിന് പ്രത്യേകമായ ഒരു മതപദവി ഉറപ്പിച്ചു നൽകാതെയും അർഥസാധ്യത ഇല്ലാതാക്കാതെയും മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർന്ന് ഈ പിരിമുറുക്ക് സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥാഖ്യാനശൈലി. പേരുകൾ സാധാരണ മലയാള ബൈബിൾ ലിപ്യന്തരണരീതിയോട് ചേർത്ത് നൽകിയിരിക്കുന്നു. ഏകവചനമായ ‘നീ/നിന്റെ’ സാദോക്കിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും ബഹുവചനമായ ‘നിങ്ങളുടെ/നിങ്ങളോടൊപ്പം’ സാദോക്കും അബ്യാഥാരും ഉൾപ്പെടുന്ന കൂട്ടസൂചനയും വേർതിരിച്ചു സൂക്ഷിച്ചിട്ടുണ്ട്.
