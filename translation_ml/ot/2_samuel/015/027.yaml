  source_fidelity: 'മുഖ്യവാചകം എബ്രായവാക്യത്തിന്റെ ഘടനയും അർഥവും വിശ്വസ്തമായി നൽകുന്നു: രാജാവിന്റെ സാദോക്കിനോടുള്ള അഭിസംബോധന, മടങ്ങാനുള്ള ആജ്ഞ, ‘സമാധാനത്തോടെ’ എന്ന בְּשָׁלוֹם-പ്രയോഗം, അഹീമാസ്/യോനാഥാൻ എന്നിവരുടെ തിരിച്ചറിയൽ, ഒടുവിലെ ബഹുവചന ‘നിങ്ങളുടെ രണ്ടു പുത്രന്മാർ ... നിങ്ങളോടൊപ്പം’ എന്നിവ എല്ലാം സൂക്ഷിച്ചിട്ടുണ്ട്. അവസാന ഭാഗത്തിലെ ‘മടങ്ങട്ടെ’ മുൻപുള്ള ആജ്ഞയിൽനിന്ന് സ്വാഭാവികമായി പൂരിപ്പിച്ചതാണ്; അർഥത്തിൽ അനാവശ്യമായ മാറ്റമുണ്ടാക്കുന്നില്ല.'
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ കഥാഖ്യാനം സ്വാഭാവികവും മാന്യവുമാണ്. ‘സാദോക്ക് പുരോഹിതനോടു’യും ‘നഗരത്തിലേക്കു മടങ്ങിപ്പോകുക’യും സുഗമമാണ്. പേരുകൾക്കു പിന്നാലെയുള്ള ദീർഘവിരാമത്തിലുള്ള വിശദീകരണഭാഗം പേരുകൾ തന്നെയാണ് ഇരുവരുടെയും പുത്രന്മാർ എന്നു വ്യക്തമായി കാണിക്കുന്നു.
  terminology: ‘ദർശകൻ’ എബ്രായ הֲרֹאֶה-യുടെ സാധ്യമായ പദവിസൂചന നിലനിർത്തുന്നു; ഇതിനെ വ്യക്തമായ പ്രവാചകപദവിയായി നിർബന്ധിക്കുന്നില്ല. അടിക്കുറിപ്പ് ‘കാണുക/ഗ്രഹിക്കുക’ എന്ന ബദൽ അർഥസാധ്യത ശരിയായി രേഖപ്പെടുത്തുന്നു. ‘സമാധാനത്തോടെ’ ശാലോം എന്ന പദത്തിന്റെ സമാധാനം/സുരക്ഷ എന്ന സന്ദർഭവ്യാപ്തിക്ക് യോജിച്ചതാണ്. സാദോക്ക്, അഹീമാസ്, അബ്യാഥാർ, യോനാഥാൻ എന്നീ പേരുകളും സ്വീകര്യമായ മലയാള ലിപ്യന്തരണങ്ങളാണ്.
