  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם הָ/עִ֣יר תָּשׁ֗וּב וְ/אָמַרְתָּ֤ לְ/אַבְשָׁלוֹם֙ עַבְדְּ/ךָ֨ אֲנִ֤י הַ/מֶּ֨לֶךְ֙ אֶֽהְיֶ֔ה עֶ֣בֶד אָבִ֤י/ךָ וַֽ/אֲנִי֙ מֵ/אָ֔ז וְ/עַתָּ֖ה וַ/אֲנִ֣י עַבְדֶּ֑/ךָ וְ/הֵפַרְתָּ֣ה לִ֔/י אֵ֖ת עֲצַ֥ת אֲחִיתֹֽפֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: ml
  text: എന്നാൽ നീ നഗരത്തിലേക്കു മടങ്ങിച്ചെന്ന് അബ്ശാലോമിനോട്, ‘രാജാവേ, ഞാൻ അങ്ങയുടെ ദാസനായിരിക്കും; മുമ്പ് ഞാൻ അങ്ങയുടെ പിതാവിന്റെ ദാസനായിരുന്നു; ഇപ്പോൾ ഞാൻ അങ്ങയുടെ ദാസനാണ്’ എന്നു പറഞ്ഞാൽ, നീ എനിക്കുവേണ്ടി അഹീഥോഫെലിന്റെ ആലോചന വിഫലമാക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם הָעִיר תָּשׁוּב
  choice: എന്നാൽ നീ നഗരത്തിലേക്കു മടങ്ങിച്ചെന്ന്
  rationale: വ്യവസ്ഥാസൂചകമായ אִם-നെ ‘എന്നാൽ ... പറഞ്ഞാൽ’ എന്ന സ്വാഭാവിക മലയാള ഘടനയിൽ അവതരിപ്പിച്ചു; תָּשׁוּב-ന്റെ മടങ്ങിപ്പോകൽ അർഥം നിലനിർത്തി.
- source_word: עַבְדְּךָ אֲנִי הַמֶּלֶךְ אֶהְיֶה
  choice: രാജാവേ, ഞാൻ അങ്ങയുടെ ദാസനായിരിക്കും
  rationale: മസോറെറ്റിക് ഉച്ചാരണചിഹ്നങ്ങൾ സൂചിപ്പിക്കുന്ന അഭിസംബോധന അനുസരിച്ച് הַמֶּלֶךְ-നെ ‘രാജാവേ’ എന്നു നൽകി; എബ്രായത്തിലെ ആവർത്തനാത്മക വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
- source_word: עֶבֶד אָבִיךָ ... וְעַתָּה ... עַבְדֶּךָ
  choice: മുമ്പ് ഞാൻ അങ്ങയുടെ പിതാവിന്റെ ദാസനായിരുന്നതുപോലെ ഇപ്പോൾ ഞാൻ അങ്ങയുടെ ദാസനായിരിക്കും
  rationale: മുൻകാല സേവനവും ഇപ്പോഴത്തെ സേവനവാഗ്ദാനവും തമ്മിലുള്ള താരതമ്യബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തി.
- source_word: וְהֵפַרְתָּה לִי אֵת עֲצַת אֲחִיתֹפֶל
  choice: നീ എനിക്കുവേണ്ടി അഹീഥോഫെലിന്റെ ആലോചന വിഫലമാക്കും
  rationale: הֵפֵר എന്ന ക്രിയയുടെ ‘തകർക്കുക/ഫലമില്ലാതാക്കുക’ എന്ന ആശയം ‘വിഫലമാക്കുക’ എന്നു നൽകി; לִי-യുടെ ഗുണഭോക്തൃഭാവം ‘എനിക്കുവേണ്ടി’ എന്നു വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രാജാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ബഹുമാനസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; കഥയിലെ വഞ്ചനാതന്ത്രത്തെ വിശദീകരിക്കുകയോ നൈതികമായി മൃദൂകരിക്കുകയോ ചെയ്തിട്ടില്ല.
