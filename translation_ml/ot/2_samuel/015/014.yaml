base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് യെരൂശലേമിൽ തന്നോടുകൂടെ ഉണ്ടായിരുന്ന എല്ലാ സേവകരോടും പറഞ്ഞു: “എഴുന്നേൽക്കൂ, നമുക്ക് ഓടിപ്പോകാം! കാരണം അബ്ശാലോമിൽനിന്ന് രക്ഷപ്പെടാൻ നമുക്ക് ഒരു വഴിയും ഉണ്ടാകില്ല. വേഗം പുറപ്പെടൂ; ഇല്ലെങ്കിൽ അവൻ പെട്ടെന്നു നമ്മെ പിടികൂടി നമ്മുടെമേൽ അനർത്ഥം വരുത്തുകയും നഗരത്തെ വാളിനിരയാക്കുകയും ചെയ്യും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നഗരത്തെ വാളിന്റെ വായാൽ പ്രഹരിക്കുകയും ചെയ്യും.’ ഇത് വാളാൽ കൊല്ലുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ ശൈലീപ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: അവന്റെ സേവകർ
  rationale: രാജകൊട്ടാരസന്ദർഭത്തിൽ ഈ പദം ഉദ്യോഗസ്ഥരെയും പരിചാരകരെയും അനുയായികളെയും ഉൾക്കൊള്ളാം. അടിമസ്ഥിതി അനാവശ്യമായി നിർണയിക്കാതെ ‘സേവകർ’ ഈ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: קוּמוּ וְנִבְרָחָה
  choice: എഴുന്നേൽക്കൂ, നമുക്ക് ഓടിപ്പോകാം
  rationale: ആജ്ഞാരൂപത്തിന്റെയും സംസാരിക്കുന്നവനെയും ഉൾക്കൊള്ളുന്ന പ്രേരണാരൂപത്തിന്റെയും അടിയന്തരതയും കൂട്ടായ പ്രവർത്തനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פְלֵיטָה
  choice: രക്ഷപ്പെടാൻ ഒരു വഴി
  rationale: ഇവിടെ ദൈവിക വിടുതൽ എന്ന പ്രത്യേക അർഥത്തേക്കാൾ അബ്ശാലോമിന്റെ ആക്രമണത്തിൽനിന്നുള്ള രക്ഷപ്പെടലാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ നിഷേധവാക്യത്തോടൊപ്പം ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: מַהֲרוּ לָלֶכֶת
  choice: വേഗം പുറപ്പെടൂ
  rationale: അക്ഷരാർഥത്തിലെ ‘പോകാൻ വേഗപ്പെടുക’ എന്നത് ഈ സന്ദർഭത്തിൽ ഉടൻ സ്ഥലം വിടാനുള്ള ആജ്ഞയാണ്; ‘പുറപ്പെടൂ’ അത് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: וְהִשִּׂגָנוּ
  choice: നമ്മെ പിടികൂടി
  rationale: പിന്തുടർന്ന് എത്തിപ്പിടിക്കുക എന്ന സൈനിക-പലായന സന്ദർഭത്തിലെ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: וְהִדִּיחַ עָלֵינוּ אֶת־הָרָעָה
  choice: നമ്മുടെമേൽ അനർത്ഥം വരുത്തി
  rationale: רָעָה ഇവിടെ ധാർമ്മിക തിന്മയെയല്ല, ദുരന്തത്തെയോ വിപത്തിനെയോ സൂചിപ്പിക്കുന്നു. ‘അനർത്ഥം’ ഈ സന്ദർഭാർഥം നിലനിർത്തുന്നു.
- source_word: וְהִכָּה הָעִיר לְפִי חָרֶב
  choice: നഗരത്തെ വാളിനിരയാക്കുകയും ചെയ്യും
  rationale: ‘വാളിന്റെ വായാൽ നഗരത്തെ പ്രഹരിക്കുക’ എന്ന എബ്രായ പ്രയോഗം നഗരത്തിൽ വാളാൽ കൂട്ടക്കൊല നടത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വാളിനിരയാക്കുക’ മലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ സമാനപ്രയോഗമാണ്.
