translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. രാജകൊട്ടാരസന്ദർഭം നിലനിർത്തിക്കൊണ്ട് അതിപുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി; സംഭാഷണത്തിലെ അടിയന്തരതയ്ക്ക് ചെറുവാക്യങ്ങളും നേരിട്ടുള്ള ആജ്ഞാരൂപങ്ങളും ഉപയോഗിച്ചു.
