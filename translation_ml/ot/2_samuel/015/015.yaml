language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ עַבְדֵֽי הַ/מֶּ֖לֶךְ אֶל הַ/מֶּ֑לֶךְ כְּ/כֹ֧ל אֲשֶׁר יִבְחַ֛ר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הִנֵּ֥ה עֲבָדֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/015.yaml
  text: The king’s servants said to the king[a], “Whatever my lord the king chooses, here are your servants.”
translation:
  language: ml
  text: 'രാജാവിന്റെ ഭൃത്യന്മാർ രാജാവിനോടു പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവ് തിരഞ്ഞെടുക്കുന്നതെന്തായാലും, ഇതാ, അങ്ങയുടെ ഭൃത്യന്മാർ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; നേരിട്ടുള്ള സംഭാഷണത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ ഭൃത്യന്മാർ
  rationale: രാജസദസ്സിലെ ആശ്രിതരെയും സേവകരെയും സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘ഭൃത്യന്മാർ’ ബഹുമാനപൂർവവും യോജിച്ചതുമാണ്; അടിമത്തത്തിന്റെ അർഥം അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: אֶל הַמֶּלֶךְ
  choice: രാജാവിനോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖഗ്രാഹകനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  choice: എന്തു തിരഞ്ഞെടുത്താലും
  rationale: ‘അവൻ തിരഞ്ഞെടുക്കുന്ന എല്ലാറ്റിനും അനുസരിച്ച്’ എന്ന ഹീബ്രു ആശയം സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും പൂർണമായ അനുസരണസന്നദ്ധത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יִבְחַר
  choice: തിരഞ്ഞെടുത്താലും
  rationale: בחר എന്നതിന്റെ ‘തിരഞ്ഞെടുക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ‘തീരുമാനിക്കുക’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: യജമാനനായ രാജാവ്
  rationale: രാജാവിനോടുള്ള ഔപചാരികവും ആദരപൂർവവുമായ അഭിസംബോധനയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: സന്നിധിയും ഉടൻ സേവിക്കാൻ തയ്യാറായ നിലയും ചൂണ്ടിക്കാണിക്കുന്ന ഹീബ്രു അവതരണനിപാതത്തിന്റെ സംക്ഷിപ്തവും മാന്യവുമായ മലയാളസമം.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ഭൃത്യന്മാർ ഇവിടെ ഉണ്ടല്ലോ
  rationale: ആദ്യത്തെ עבד പദവുമായി ആവർത്തനം നിലനിർത്തുന്നു; ‘ഇവിടെ ഉണ്ടല്ലോ’ എന്നത് രാജാവിന്റെ കല്പന അനുസരിക്കാൻ അവർ സന്നദ്ധരായി സന്നിഹിതരാണെന്ന הִנֵּהയുടെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. രാജസദസ്സിലെ ആദരസൂചകമായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. മൂലത്തിലെ עבד എന്ന പദത്തിന്റെ ആവർത്തനം ‘ഭൃത്യന്മാർ’ എന്ന ഒരേ പദത്തിലൂടെ സംരക്ഷിച്ചു.
