  to: 'രാജാവിന്റെ ഭൃത്യന്മാർ രാജാവിനോടു പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവ് തിരഞ്ഞെടുക്കുന്നതെന്തായാലും, ഇതാ, അങ്ങയുടെ ഭൃത്യന്മാർ.”'
