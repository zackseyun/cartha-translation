    text: 'ഹീബ്രുവിലെ ഗൗരവമേറിയ ശപഥസൂത്രം: ‘യാഹ്‌വെ ജീവിച്ചിരിപ്പാണ; എന്റെ യജമാനനായ രാജാവ് ജീവിച്ചിരിപ്പാണ.’'
