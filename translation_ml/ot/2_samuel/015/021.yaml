id: 2SA.15.21
reference: 2 Samuel 15:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֧עַן אִתַּ֛י אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֗ה וְ/חֵי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּ֠י אִם בִּ/מְק֞וֹם אֲשֶׁ֥ר יִֽהְיֶה שָּׁ֣ם אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ אִם לְ/מָ֨וֶת֙ אִם לְ/חַיִּ֔ים כִּי שָׁ֖ם יִהְיֶ֥ה עַבְדֶּֽ/ךָ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇത്തായി രാജാവിനോടു ഉത്തരം പറഞ്ഞു: “യാഹ്‌വെയാണ, എന്റെ യജമാനനായ രാജാവാണ; എന്റെ യജമാനനായ രാജാവ് ഏതു സ്ഥലത്തായിരിക്കുമോ, അവിടെ—മരണമാകട്ടെ ജീവനാകട്ടെ—അങ്ങയുടെ ദാസൻ ഉണ്ടായിരിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: ഉത്തരം പറഞ്ഞു
  rationale: മറുപടിയായുള്ള സംസാരത്തെ സൂചിപ്പിക്കുന്ന ഇരട്ട ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി സംക്ഷിപ്തമാക്കുന്നു.
- source_word: אִתַּי
  choice: ഇത്തായി
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: חַי יְהוָה
  choice: യാഹ്‌വെ ജീവിച്ചിരിക്കുന്നതാണെ
  rationale: ദൈവനാമം നേരിട്ട് നിലനിർത്തിക്കൊണ്ട് ഹീബ്രു ശപഥസൂത്രത്തിന്റെ ഗൗരവവും ഉറപ്പും മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְחֵי אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ് ജീവിച്ചിരിക്കുന്നതാണെ
  rationale: ആദ്യ ശപഥവാക്യത്തോടുള്ള സമാന്തരതയും രാജാവിനോടുള്ള ആദരസൂചകമായ അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: כִּי אִם
  choice: വാക്യത്തിന്റെ ഉറപ്പേറിയ ശപഥഘടനയിലൂടെ പ്രകടമാക്കി
  rationale: ശപഥസന്ദർഭത്തിലെ ഊന്നൽ മലയാളത്തിലെ ആവർത്തിത ശപഥവാക്യവും തുടർന്നുള്ള ദൃഢപ്രഖ്യാപനവും സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ പ്രത്യേകമായി ‘തീർച്ചയായും’ ചേർത്തില്ല.
- source_word: בִּמְקוֹם אֲשֶׁר יִהְיֶה שָּׁם
  choice: എവിടെയായിരുന്നാലും
  rationale: തുറന്ന സ്ഥലസൂചനയെ സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אִם לְמָוֶת אִם לְחַיִּים
  choice: മരണത്തിനായാലും ജീവിതത്തിനായാലും
  rationale: മരണമായാലും ജീവിതമായാലും രാജാവിനൊപ്പമെന്ന സമ്പൂർണ പ്രതിബദ്ധതയും മൂലപാഠത്തിലെ സമാന്തര ഘടനയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജാവിന്റെ മുമ്പിലുള്ള ആദരപൂർവമായ സ്വയംവിശേഷണമാണ്; ഇവിടെ ബന്ധിത അടിമസ്ഥിതിയെക്കാൾ ‘ദാസൻ’ യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ഇത്തായിയുടെ വാക്കുകളുടെ ശപഥസ്വഭാവം
  choice: ‘ജീവിച്ചിരിക്കുന്നതാണെ’ എന്ന ശപഥസൂത്രം നിലനിർത്തി
  alternative: ‘യാഹ്‌വെയാണെ സത്യം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം
  rationale: ഹീബ്രുവിലെ ‘ജീവിക്കുന്നു’ എന്ന ഭാഷാചിത്രവും ദൈവത്തിന്റെയും രാജാവിന്റെയും ജീവനെ സാക്ഷിയാക്കുന്ന അസാധാരണ സമാന്തരതയും മായ്ച്ചുകളയാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. രാജാവിനോടുള്ള ആദരത്തിനായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു; മൂലപാഠത്തിന്റെ ശപഥഗൗരവവും ദൃഢപ്രതിബദ്ധതയും നിലനിർത്തി.
