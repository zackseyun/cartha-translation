  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי נֵ֨דֶר֙ נָדַ֣ר עַבְדְּ/ךָ֔ בְּ/שִׁבְתִּ֥/י בִ/גְשׁ֛וּר בַּ/אֲרָ֖ם לֵ/אמֹ֑ר אִם ישיב יְשִׁיבֵ֤/נִי יְהוָה֙ יְר֣וּשָׁלִַ֔ם וְ/עָבַדְתִּ֖י אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/008.yaml
  text: For your servant made a vow while I was dwelling in Geshur in Aram[a], saying, ‘If Yahweh indeed brings me back to Jerusalem[c][b], then I will serve Yahweh.’
translation:
  language: ml
  text: 'കാരണം, അങ്ങയുടെ ദാസനായ ഞാൻ അരാമിലെ ഗെശൂരിൽ താമസിച്ചിരുന്നപ്പോൾ ഇങ്ങനെ ഒരു നേർച്ച നേർന്നിരുന്നു: ‘യഹ്‌വേ എന്നെ യെരൂശലേമിലേക്കു നിശ്ചയമായും മടക്കിക്കൊണ്ടുവന്നാൽ[a], ഞാൻ യഹ്‌വേയെ സേവിക്കും[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിശ്ചയമായും മടക്കിക്കൊണ്ടുവന്നാൽ’ എന്ന എബ്രായപ്രയോഗത്തിൽ ‘മടങ്ങുക/മടക്കിക്കൊണ്ടുവരുക’ എന്ന ക്രിയ ഊന്നലിനായി ആവർത്തിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഞാൻ യഹ്‌വേയെ ആരാധിക്കും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ ദൈവത്തിന് അർപ്പിക്കുന്ന ആരാധനാപരമായ സേവനത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר נָדַר
  choice: ഒരു നേർച്ച നേർന്നിരുന്നു
  rationale: എബ്രായത്തിലെ സമാനധാതുപദങ്ങളുടെ ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായ ‘നേർച്ച നേർന്നു’ എന്ന പ്രയോഗത്തിലൂടെ രൂപപരമായ അടുപ്പവും അർഥവും നിലനിർത്തുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ ഞാൻ
  rationale: രാജാവിനോടുള്ള ആദരപൂർവമായ സ്വയംപരാമർശമാണിത്; ‘അങ്ങയുടെ ദാസൻ’ രാജസദസ്സിലെ വിനയഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: בְּשִׁבְתִּי
  choice: താമസിച്ചിരുന്നപ്പോൾ
  rationale: കാലസൂചനയും തുടരുന്ന താമസത്തിന്റെ ഭാവവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בִגְשׁוּר בַּאֲרָם
  choice: അരാമിലെ ഗെശൂരിൽ
  rationale: ഗെശൂരിനെ അരാമുമായി ബന്ധപ്പെടുത്തി സ്ഥലം വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ബന്ധത്തെ അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- source_word: אִם ישיב יְשִׁיבֵנִי
  choice: എന്നെ യെരൂശലേമിലേക്കു നിശ്ചയമായും മടക്കിക്കൊണ്ടുവന്നാൽ
  rationale: ശൂബ് എന്ന ക്രിയയുടെ ഊന്നൽപ്രയോഗം ‘നിശ്ചയമായും’ എന്നു പകർത്തുന്നു; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള തിരിച്ചുവരവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְעָבַדְתִּי אֶת יְהוָה
  choice: ഞാൻ യഹ്‌വേയെ സേവിക്കും
  rationale: עבד എന്ന ക്രിയയുടെ വിശാലമായ ‘സേവിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ദൈവത്തോടുള്ള ആരാധനാപരമായ സേവനവും ഇതിൽ ഉൾപ്പെടാം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ അതിനെ ലിപ്യന്തരണം ചെയ്തു.
- issue: עבד എന്ന ക്രിയയുടെ ആരാധനാപരമായ അർഥവ്യാപ്തി
  choice: സേവിക്കും
  alternative: ആരാധിക്കും
  rationale: ‘സേവിക്കും’ എന്നത് മൂലക്രിയയുടെ വിശാല അർഥം സംരക്ഷിക്കുന്നു; ‘ആരാധിക്കും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി, അർഥം അനാവശ്യമായി ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. രാജാവിനോടുള്ള വിനയഭാവം ‘അങ്ങയുടെ ദാസനായ ഞാൻ’ എന്നതിൽ നിലനിർത്തി; നേർച്ചയുടെ ഔപചാരികതയ്ക്കായി നേരിട്ടുള്ള ഉദ്ധരണിയും സംരക്ഷിച്ചു.
