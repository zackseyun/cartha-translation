source:
  edition: WLC
  text: וַ/יָּ֨שֶׁב צָד֧וֹק וְ/אֶבְיָתָ֛ר אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים יְרוּשָׁלִָ֑ם וַ/יֵּשְׁב֖וּ שָֽׁם־׃
