  yaml_path: translation/ot/2_samuel/015/029.yaml
  text: So Zadok and Abiathar returned the ark of God to Jerusalem, and they stayed there.
translation:
  language: ml
  text: അങ്ങനെ സാദോക്കും അബ്യാഥാരും ദൈവത്തിന്റെ പെട്ടകം യെരൂശലേമിലേക്കു തിരികെ കൊണ്ടുപോയി; അവർ അവിടെ താമസിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: തിരികെ കൊണ്ടുപോയി
  rationale: שׁוב എന്ന ധാതുവിന്റെ ഹിഫീൽ കാരണാർത്ഥരൂപമാണ്; പെട്ടകത്തെ യെരൂശലേമിലേക്കു മടക്കിക്കൊണ്ടുപോയ പ്രവൃത്തിയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: צָדוֹק וְאֶבְיָתָר
  choice: സാദോക്കും അബ്യാഥാരും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു; ഹീബ്രു സംയോജകവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֶת אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: മൂലപാഠത്തിലെ ‘ദൈവത്തിന്റെ പെട്ടകം’ എന്ന ലളിതമായ പ്രയോഗം തന്നെയാണ് നിലനിർത്തിയത്; ഇവിടെ ഇല്ലാത്ത ‘നിയമപെട്ടകം’ എന്ന വിപുലീകരണം ചേർത്തിട്ടില്ല.
- source_word: יְרוּשָׁלָם
  choice: യെരൂശലേമിലേക്കു
  rationale: സന്ദർഭത്തിലെ ദിശാസൂചന മലയാളത്തിൽ ‘-ലേക്കു’ എന്ന വിഭക്തിയിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: അവർ അവിടെത്തന്നെ താമസിച്ചു
  rationale: ישׁב എന്ന ക്രിയയുടെ ‘താമസിക്കുക/കഴിയുക’ എന്ന സന്ദർഭോചിത അർത്ഥം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘അവിടെത്തന്നെ’ തുടർന്നുള്ള സാന്നിധ്യത്തിന് ഊന്നൽ നൽകുന്നു.
