  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും പ്രവർത്തനക്രമവും സംരക്ഷിച്ചിരിക്കുന്നു.
