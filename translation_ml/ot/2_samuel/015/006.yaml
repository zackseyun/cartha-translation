  text: וַ/יַּ֨עַשׂ אַבְשָׁל֜וֹם כַּ/דָּבָ֤ר הַ/זֶּה֙ לְ/כָל יִשְׂרָאֵ֔ל אֲשֶׁר יָבֹ֥אוּ לַ/מִּשְׁפָּ֖ט אֶל הַ/מֶּ֑לֶךְ וַ/יְגַנֵּב֙ אַבְשָׁל֔וֹם אֶת לֵ֖ב אַנְשֵׁ֥י יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
translation:
  language: ml
  text: ന്യായവിധിക്കായി രാജാവിന്റെ അടുക്കൽ വന്നിരുന്ന ഇസ്രായേല്യരായ എല്ലാവരോടും അബ്ശാലോം ഇങ്ങനെ ചെയ്തു. അബ്ശാലോം ഇസ്രായേലിലെ പുരുഷന്മാരുടെ ഹൃദയങ്ങൾ കവർന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിലെ പുരുഷന്മാരുടെ മനസ്സ് സ്വന്തമാക്കി.” എബ്രായത്തിൽ അക്ഷരാർഥമായി, “ഹൃദയം മോഷ്ടിച്ചു” എന്നാണ്; രഹസ്യമായോ കൗശലത്താലോ വിശ്വസ്തത നേടിയെന്ന ദൃശ്യരൂപം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אַבְשָׁלוֹם כַּדָּבָר הַזֶּה
  choice: അബ്ശാലോം ഇങ്ങനെ ചെയ്തു
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച പതിവായ പെരുമാറ്റത്തിലേക്കാണ് ഈ പ്രയോഗം വിരൽചൂണ്ടുന്നത്. ‘ഇങ്ങനെ ചെയ്തു’ എന്നത് എബ്രായപ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും സ്വാഭാവികമായ മലയാളവും നിലനിർത്തുന്നു.
- source_word: לְכָל יִשְׂרָאֵל אֲשֶׁר יָבֹאוּ
  choice: വന്നിരുന്ന ഇസ്രായേലിലെ എല്ലാവരോടും
  rationale: ഇംപർഫെക്റ്റ് രൂപം ഭൂതകാലത്തിലെ പതിവായ വരവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വന്നിരുന്ന’ എന്നു നൽകി. ‘എല്ലാ ഇസ്രായേൽ’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപത്തിന് പകരം അർഥം കൃത്യമായി നൽകുന്ന മലയാളപ്രയോഗം സ്വീകരിച്ചു.
- source_word: לַמִּשְׁפָּט אֶל הַמֶּלֶךְ
  choice: ന്യായവിധിക്കായി രാജാവിന്റെ അടുക്കൽ
  rationale: מִשְׁפָּט ഇവിടെ രാജാവിൽനിന്നുള്ള നിയമപരമായ തീർപ്പോ വിചാരണയോ സൂചിപ്പിക്കുന്നു; ‘ന്യായവിധിക്കായി’ ആ ന്യായാധിപത്യസന്ദർഭം നിലനിർത്തുന്നു.
- source_word: וַיְגַנֵּב אֶת לֵב
  choice: ഹൃദയം കവർന്നു
  rationale: גנב എന്ന ക്രിയയുടെ ‘മോഷ്ടിക്കുക’ എന്ന ദൃശ്യരൂപവും രഹസ്യമായോ കൃത്രിമമായോ വിശ്വസ്തത നേടിയെന്ന സൂചനയും ‘കവർന്നു’ നിലനിർത്തുന്നു. അതേസമയം മലയാളത്തിൽ വായനാസൗകര്യവും ഉണ്ട്.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: אַנְשֵׁי എന്ന പുല്ലിംഗപദം മറച്ചുവയ്ക്കാതെ ‘പുരുഷന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി; അത് വിശാലജനവിഭാഗത്തെ പ്രതിനിധീകരിക്കുന്ന പ്രയോഗമായിരിക്കാനുള്ള സാധ്യത വ്യാഖ്യാനത്തിലൂടെ തീർപ്പാക്കിയിട്ടില്ല.
theological_decisions:
- issue: אַנְשֵׁי יִשְׂרָאֵל എന്ന ലിംഗസൂചക പ്രയോഗത്തിന്റെ പരിധി
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  alternative: ഇസ്രായേൽജനത / ഇസ്രായേല്യർ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗനാമം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു. ഇത് മുഴുവൻ ജനത്തെയും പ്രതിനിധീകരിച്ചിരിക്കാമെങ്കിലും, ആ സാധ്യതയുടെ പേരിൽ ലിംഗസൂചനയെ നിശ്ശബ്ദമായി പൊതുവാക്കുന്നില്ല.
- issue: ‘ഹൃദയം മോഷ്ടിച്ചു’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: ഹൃദയം കവർന്നു
  alternative: മനസ്സ് സ്വന്തമാക്കി / തങ്ങളുടെ പക്ഷത്താക്കി
  rationale: അബ്ശാലോം ജനപിന്തുണ നേടിയെന്ന ആശയം വ്യക്തമാണെങ്കിലും, എബ്രായത്തിലെ മോഷണരൂപകം വഞ്ചനയുടെയോ രഹസ്യമായ കൈവശപ്പെടുത്തലിന്റെയോ സൂചന നൽകുന്നു. അതിനാൽ വിശദീകരണപരമായ പരാവർത്തനം ഒഴിവാക്കി രൂപകവും അതിലെ നൈതിക സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. നിയമസന്ദർഭത്തിന് ‘ന്യായവിധി’ എന്നും, രാജസന്നിധിയിലേക്കുള്ള സമീപനത്തിന് ‘രാജാവിന്റെ അടുക്കൽ’ എന്നും നൽകി. ‘ഹൃദയം കവർന്നു’ എന്ന പ്രയോഗം മലയാളത്തിൽ ഗ്രാഹ്യമാകുന്നതിനൊപ്പം മൂലത്തിലെ മോഷണരൂപകവും സംരക്ഷിക്കുന്നു.
