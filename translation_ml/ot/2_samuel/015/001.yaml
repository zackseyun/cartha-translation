  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מֵ/אַ֣חֲרֵי כֵ֔ן וַ/יַּ֤עַשׂ ל/וֹ֙ אַבְשָׁל֔וֹם מֶרְכָּבָ֖ה וְ/סֻסִ֑ים וַ/חֲמִשִּׁ֥ים אִ֖ישׁ רָצִ֥ים לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
translation:
  language: ml
  text: ഇതിനുശേഷം അബ്ശാലോം തനിക്കായി ഒരു രഥവും കുതിരകളും തന്റെ മുമ്പിൽ ഓടുന്ന അമ്പത് പുരുഷന്മാരെയും ഒരുക്കി[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരുക്കി’ എന്നതിന് ‘ഉണ്ടാക്കി’, ‘സമ്പാദിച്ചു’, അല്ലെങ്കിൽ ‘ഏർപ്പെടുത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായക്രിയയ്ക്ക് ഈ അർഥവ്യാപ്തിയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: തന്റെ മുമ്പിൽ ഓടുന്ന അമ്പത് പുരുഷന്മാർ രാജകീയ ശൈലിയിലുള്ള ഒരു അകമ്പടിയായിരുന്നു; അബ്ശാലോം പരസ്യമായി സ്വയം ഉയർത്തിക്കാട്ടുന്നതിനെ ഇത് സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  choice: ഇതിനുശേഷം
  rationale: എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ കാലബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘അപ്പോൾ സംഭവിച്ചതെന്തെന്നാൽ’ എന്ന പദാനുപദരൂപത്തിന്റെ കൃത്രിമത്വം ഒഴിവാക്കുന്നു.
- source_word: וַיַּעַשׂ לוֹ
  choice: തനിക്കായി ... ഒരുക്കി
  rationale: עשה + לוֹ എന്നത് ഇവിടെ സ്വയം ഉണ്ടാക്കുക, സമ്പാദിക്കുക, അല്ലെങ്കിൽ ഏർപ്പെടുത്തുക എന്ന അർഥവ്യാപ്തിയുള്ളതാണ്. രഥം, കുതിരകൾ, ഓട്ടക്കാർ എന്നിവയെല്ലാം ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ് ‘ഒരുക്കി’; പ്രത്യാവർത്തകഭാവം ‘തനിക്കായി’ നിലനിർത്തുന്നു.
- source_word: אַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: പേരിന്റെ എബ്രായരൂപത്തെ മലയാളലിപിയിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מֶרְכָּבָה וְסֻסִים
  choice: ഒരു രഥവും കുതിരകളും
  rationale: പദങ്ങളുടെ സാധാരണ അർഥവും എബ്രായത്തിലെ പട്ടികഘടനയും നേരിട്ട് നിലനിർത്തുന്നു; ‘രാജകീയ രഥം’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וַחֲמִשִּׁים אִישׁ רָצִים לְפָנָיו
  choice: തന്റെ മുമ്പിൽ ഓടുന്ന അമ്പത് പുരുഷന്മാരെയും
  rationale: പങ്കാളിത്തക്രിയയായ רָצִים നൽകുന്ന സജീവദൃശ്യം നിലനിർത്തുകയും לְפָנָיו എന്നതിനെ ‘തന്റെ മുമ്പിൽ’ എന്നു കൃത്യമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അബ്ശാലോമിന്റെ അകമ്പടിയുടെ രാഷ്ട്രീയ-രാജകീയ സൂചന
  choice: സംഭവം വിവരണാത്മകമായി മാത്രം പരിഭാഷപ്പെടുത്തി; രാജാവെന്ന അവകാശവാദം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കിയില്ല.
  alternative: ‘അബ്ശാലോം തനിക്കായി രാജകീയ ഘോഷയാത്ര ഒരുക്കി’
  rationale: രഥവും കുതിരകളും മുമ്പിൽ ഓടുന്ന അമ്പത് പുരുഷന്മാരും രാജകീയ മഹത്ത്വപ്രകടനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, എബ്രായവാചകം ആ ഉദ്ദേശ്യം നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ സൂചന നിലനിർത്തി വ്യാഖ്യാനം അടിക്കുറിപ്പിലാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഒറ്റ എബ്രായക്രിയയുടെ വ്യാപ്തി മുഴുവൻ പട്ടികയിലും നിലനിർത്താൻ വാക്യാവസാനത്തിൽ ‘ഒരുക്കി’ ഉപയോഗിച്ചു; രാഷ്ട്രീയ സൂചന മുഖ്യവാചകത്തിൽ അതിവ്യാഖ്യാനം ചെയ്തിട്ടില്ല.
