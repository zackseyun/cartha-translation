base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
translation:
  language: ml
  text: അബ്ശാലോം അതിരാവിലെ എഴുന്നേറ്റ് കവാടത്തിലേക്കുള്ള വഴിയരികിൽ നിൽക്കുമായിരുന്നു. ആർക്കെങ്കിലും ഒരു തർക്കമുണ്ടായി ന്യായവിധിക്കായി രാജാവിന്റെ അടുക്കൽ വരുമ്പോഴെല്ലാം[a], അബ്ശാലോം അയാളെ വിളിച്ച്, “നീ ഏതു പട്ടണത്തിൽനിന്നുള്ളവനാണ്?” എന്നു ചോദിക്കും. അയാൾ, “അങ്ങയുടെ ദാസൻ ഇസ്രായേലിലെ ഗോത്രങ്ങളിൽ ഒന്നിൽനിന്നുള്ളവനാണ്” എന്നു മറുപടി പറയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു തർക്കമുണ്ടായി” എന്നതിന് “ഒരു നിയമവ്യവഹാരമുണ്ടായി” എന്നും പരിഭാഷപ്പെടുത്താം; രീവ് (רִיב) എന്ന ഹീബ്രുപദത്തിന് നീതിന്യായസന്ദർഭത്തിൽ തർക്കം, പരാതി, നിയമവ്യവഹാരം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכִּים
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം നേരത്തേ എഴുന്നേൽക്കുക എന്നതാണ്. സന്ദർഭത്തിലെ ആവർത്തിത പ്രവർത്തനം ‘നിൽക്കുമായിരുന്നു’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: וְעָמַד
  choice: നിൽക്കുമായിരുന്നു
  rationale: അബ്ശാലോമിന്റെ പതിവായ പ്രവർത്തനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: עַל יַד דֶּרֶךְ הַשָּׁעַר
  choice: നഗരകവാടത്തിലേക്കുള്ള വഴിയരികിൽ
  rationale: עַל יַד എന്നത് ‘അരികിൽ’ എന്നും דֶּרֶךְ הַשַּׁעַר കവാടത്തിലേക്കുള്ള വഴി എന്നും ഗ്രഹിക്കുന്നു. സന്ദർഭവ്യക്തതയ്ക്കായി ‘നഗരകവാടം’ ഉപയോഗിച്ചു.
- source_word: רִיב
  choice: തർക്കം
  rationale: നീതിന്യായസന്ദർഭത്തിൽ ഈ പദത്തിന് തർക്കം, പരാതി, നിയമവ്യവഹാരം എന്നീ അർഥങ്ങൾ വരാം; മുഖ്യപാഠത്തിൽ പൊതുവായ ‘തർക്കം’ നിലനിർത്തി, നിയമപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ לַמִּשְׁפָּט
  choice: ന്യായവിധിക്കായി രാജാവിന്റെ അടുക്കൽ വരുമ്പോൾ
  rationale: מִשְׁפָּט ഇവിടെ രാജാവിൽനിന്നുള്ള നീതിന്യായതീർപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ന്യായവിധി’ നിയമപരമായ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא ... אֵלָיו
  choice: അയാളെ വിളിച്ച്
  rationale: ഔദ്യോഗികമായി വിളിച്ചുവരുത്തുക എന്ന ശക്തമായ ധ്വനി ചേർക്കാതെ സാധാരണ വിളിയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֵי מִזֶּה עִיר אַתָּה
  choice: നീ ഏതു പട്ടണത്തിൽനിന്നുള്ളവനാണ്?
  rationale: ഹീബ്രു ചോദ്യത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: מֵאַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ ഗോത്രങ്ങളിൽ ഒന്നിൽനിന്നുള്ളവനാണ്
  rationale: സംക്ഷിപ്തമായ ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കുന്ന ഗോത്രമൂലം മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു; പട്ടണത്തെക്കുറിച്ചുള്ള ചോദ്യത്തിന് ഗോത്രപരമായ പൊതുമറുപടി തന്നെയെന്ന പാഠത്തിലെ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ഇവിടെ സംസാരിക്കുന്നയാളുടെ വിനയപൂർവമായ സ്വയംപരാമർശമാണ്; അടിമത്തത്തിന്റെ പ്രത്യേക ഊന്നൽ അനാവശ്യമായി ചേർക്കാതെ സാമൂഹിക ബഹുമാനഭാവം സംരക്ഷിക്കുന്നു.
