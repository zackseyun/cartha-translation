  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ശ്രദ്ധ ക്ഷണിക്കുന്ന ആരംഭം നേരിട്ട് നിലനിർത്തി; കൃദന്തരൂപത്തിന്റെ കാല-ഭാവസൂചനയും ‘കടവുകൾ’ എന്ന പദത്തിന്റെ സാധ്യതയുള്ള വിശാലാർഥവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
