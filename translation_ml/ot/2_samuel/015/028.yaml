  text: רְאוּ֙ אָנֹכִ֣י מִתְמַהְמֵ֔הַּ ב/עברות הַ/מִּדְבָּ֑ר עַ֣ד בּ֥וֹא דָבָ֛ר מֵ/עִמָּ/כֶ֖ם לְ/הַגִּ֥יד לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/028.yaml
  text: See[b][a], I will wait at the fords of the wilderness until word comes from you to inform me.
translation:
  language: ml
  text: നോക്കൂ, എനിക്ക് അറിയിച്ചുതരാനുള്ള ഒരു സന്ദേശം നിങ്ങളിൽനിന്ന് വരുന്നതുവരെ ഞാൻ മരുഭൂമിയിലെ കടവുകളിൽ[a] കാത്തിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മരുഭൂമിയിലെ കടക്കാനുള്ള ഇടങ്ങളിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തങ്ങിനിൽക്കും” / “താമസിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: നോക്കൂ
  rationale: ראה എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗമാണ്; ‘നോക്കൂ’ അതിന്റെ നേരിട്ടുള്ള ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന് ഊന്നലുണ്ടെങ്കിലും മലയാളത്തിൽ പ്രത്യേക ആത്മവാചകപ്രയോഗം ചേർക്കാതെ ‘ഞാൻ’ എന്നത് സ്വാഭാവികവും മതിയായതുമാണ്.
- source_word: מִתְמַהְמֵהַּ
  choice: കാത്തിരിക്കും
  rationale: מהה എന്ന ക്രിയയുടെ ഹിത്പയേൽ കൃദന്തരൂപം താമസിക്കുക, തങ്ങിനിൽക്കുക എന്ന ആശയം നൽകുന്നു; സന്ദേശം പ്രതീക്ഷിച്ച് അവിടെ തുടരുക എന്ന സന്ദർഭാർഥം ‘കാത്തിരിക്കും’ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּעַבְרוֹת
  choice: കടവുകളിൽ
  rationale: עברה എന്ന പദത്തിന്റെ ബഹുവചനം കടന്നുപോകാനുള്ള ഇടങ്ങളെ, പ്രത്യേകിച്ച് ജലാശയങ്ങളിലെ കടവുകളെ, സൂചിപ്പിക്കാം; യാത്രാപശ്ചാത്തലത്തിൽ ‘കടവുകളിൽ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: הַמִּדְבָּר
  choice: മരുഭൂമിയിലെ
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ വരണ്ട തുറന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാള ബൈബിൾ ശൈലിയിൽ ‘മരുഭൂമി’ പരിചിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: עַד בּוֹא דָבָר
  choice: ഒരു സന്ദേശം വരുന്നതുവരെ
  rationale: ഇവിടെ דָבָר ഒരു അറിയിപ്പിനെയോ വാർത്തയെയോ സൂചിപ്പിക്കുന്നു; ‘ഒരു സന്ദേശം വരുന്നതുവരെ’ ഹീബ്രുവിലെ സംക്ഷിപ്തതയും സന്ദർഭവും സംരക്ഷിക്കുന്നു.
- source_word: מֵעִמָּכֶם
  choice: നിങ്ങളിൽനിന്ന്
  rationale: സന്ദേശം അവരിൽനിന്ന് വരുന്നു എന്ന ഉറവിടബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְהַגִּיד לִי
  choice: എന്നെ അറിയിക്കാൻ
  rationale: נגד എന്ന ഹിഫിൽ ക്രിയയുടെ അർഥം അറിയിക്കുക, റിപ്പോർട്ട് ചെയ്യുക എന്നതാണ്; ‘എന്നെ അറിയിക്കാൻ’ വാർത്താവാഹകസന്ദർഭത്തിന് അനുയോജ്യമാണ്.
