id: 2SA.15.11
reference: 2 Samuel 15:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת אַבְשָׁל֗וֹם הָלְכ֞וּ מָאתַ֤יִם אִישׁ֙ מִ/יר֣וּשָׁלִַ֔ם קְרֻאִ֖ים וְ/הֹלְכִ֣ים לְ/תֻמָּ֑/ם וְ/לֹ֥א יָדְע֖וּ כָּל דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/011.yaml
  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
translation:
  language: ml
  text: അബ്ശാലോമിനോടൊപ്പം യെരൂശലേമിൽനിന്ന് ക്ഷണിക്കപ്പെട്ട ഇരുനൂറുപേർ പോയി. അവർ നിഷ്കളങ്കരായി[a] പോയി; കാര്യങ്ങളൊന്നും അവർ അറിഞ്ഞിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തങ്ങളുടെ നിഷ്കളങ്കതയിൽ’ അഥവാ ‘സത്യസന്ധതയോടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. അബ്ശാലോമിന്റെ പദ്ധതി അറിയാതെ, യാതൊരു സംശയവുമില്ലാതെയാണ് അവർ പോയതെന്ന് ഈ എബ്രായപ്രയോഗം സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ אֶת־אַבְשָׁלוֹם
  choice: അബ്ശാലോമിനോടൊപ്പം … പോയി
  rationale: הלך എന്നത് ‘പോകുക’ എന്നും אֶת־אַבְשָׁלוֹם ഇവിടെ അബ്ശാലോമിനോടുള്ള സഹഗമനം എന്നും സൂചിപ്പിക്കുന്നു. ‘അബ്ശാലോമിനോടൊപ്പം പോയി’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: מָאתַיִם אִישׁ
  choice: ഇരുനൂറുപേർ
  rationale: സംഖ്യയ്ക്കുശേഷമുള്ള אִישׁ പുരുഷന്മാരെ എണ്ണുന്ന സാധാരണ എബ്രായ പ്രയോഗമാണ്. മലയാളത്തിലെ ‘ഇരുനൂറുപേർ’ മനുഷ്യരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും അനാവശ്യ ആവർത്തനമില്ലാത്തതുമായ രൂപമാണ്.
- source_word: מִירוּשָׁלַםִ
  choice: യെരൂശലേമിൽനിന്ന്
  rationale: מִן ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുന്നു.
- source_word: קְרֻאִים
  choice: ക്ഷണിക്കപ്പെട്ട
  rationale: קרא എന്ന ക്രിയയുടെ കർമണി കൃദന്തരൂപം ഇവിടെ ‘വിളിക്കപ്പെട്ട/ക്ഷണിക്കപ്പെട്ട’ എന്നർത്ഥം നൽകുന്നു. സന്ദർഭത്തിൽ ‘ക്ഷണിക്കപ്പെട്ട’ എന്നത് യോജിക്കുന്നു; ‘അതിഥികൾ’ എന്ന ആശയം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: לְתֻמָּם
  choice: നിഷ്കളങ്കരായി
  rationale: תֹּם/תֻּם നിഷ്കളങ്കത, സത്യസന്ധത, ലാളിത്യം എന്നീ അർത്ഥവ്യാപ്തിയുള്ള പദമാണ്. തുടർന്നുള്ള ‘അവർ അറിഞ്ഞിരുന്നില്ല’ എന്ന വാക്യം ഇവിടെ സംശയമില്ലാതെ, ഗൂഢാലോചന അറിയാതെ പോയതിനെ മുൻനിർത്തുന്നു; എങ്കിലും ‘നിഷ്കളങ്കരായി’ മൂലപദത്തിന്റെ വിശാലത പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- source_word: וְלֹא יָדְעוּ כָּל־דָּבָר
  choice: കാര്യങ്ങളൊന്നും അവർ അറിഞ്ഞിരുന്നില്ല
  rationale: כָּל־דָּבָר ഇവിടെ സംഭവിക്കുന്ന കാര്യം അല്ലെങ്കിൽ പദ്ധതി സംബന്ധിച്ച് ഒന്നും അറിയാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ നിഷേധപ്രയോഗം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള ‘പോയി’ എന്ന വിവരണം നിലനിർത്തിയിട്ടുണ്ട്; രണ്ടാമത്തെ പ്രയോഗം അവരുടെ മനോഭാവത്തെ വിശദീകരിക്കുന്നു. ‘യെരൂശലേം’, ‘അബ്ശാലോം’ എന്നീ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾ നാമരൂപങ്ങൾ സ്വീകരിച്ചു.
