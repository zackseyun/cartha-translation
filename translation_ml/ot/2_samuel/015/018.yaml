  yaml_path: translation/ot/2_samuel/015/018.yaml
  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
translation:
  language: ml
  text: അവന്റെ സകല ദാസന്മാരും അവന്റെ അരികിലൂടെ കടന്നുപോയി. കെരേത്യരും പെലേത്യരും ഗിത്യരും—ഗത്തിൽനിന്ന് അവനോടൊപ്പം കാൽനടയായി വന്ന അറുനൂറുപേർ[a]—രാജാവിന്റെ മുമ്പിലൂടെ കടന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഗത്തിൽനിന്ന് അവനെ അനുഗമിച്ചുവന്ന അറുനൂറുപേർ.” എബ്രായത്തിൽ ‘ഗത്തിൽനിന്ന് അവന്റെ കാലോടെ വന്നവർ’ എന്ന പ്രയോഗമാണുള്ളത്; ഇത് അവനോടൊപ്പം കാൽനടയായി വരുന്നതിനെയോ അവന്റെ അനുചരരായി വരുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: അവന്റെ സകല ദാസന്മാർ
  rationale: עֶבֶד എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; ഇവിടെ രാജസേവകരോ അനുചരരോ ഉൾപ്പെടാമെങ്കിലും പദവിയെ അനാവശ്യമായി കൃത്യമാക്കുന്നില്ല.
- source_word: עֹבְרִים עַל יָדוֹ
  choice: അവന്റെ അരികിലൂടെ കടന്നുപോയി
  rationale: עַל יָד എന്ന പ്രയോഗത്തിലെ ‘അരികിൽ/വശത്ത്’ എന്ന സ്ഥലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַכְּרֵתִי
  choice: കെരേത്യർ
  rationale: ദാവീദിന്റെ സേവനത്തിലുള്ള ഒരു പ്രത്യേക ജനവിഭാഗത്തിന്റെയോ സൈനികസംഘത്തിന്റെയോ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַפְּלֵתִי
  choice: പെലേത്യർ
  rationale: വ്യാഖ്യാനപരമായി വിവർത്തനം ചെയ്യാതെ സംഘനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַגִּתִּים
  choice: ഗിത്യർ
  rationale: ഗത്തിൽനിന്നുള്ളവരെ സൂചിപ്പിക്കുന്ന വംശീയ/പ്രാദേശിക നാമം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: അറുനൂറുപേർ
  rationale: എണ്ണപ്പെടുന്ന പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ‘സൈനികർ’ എന്നു ചേർത്ത് മൂലത്തിൽ വ്യക്തമല്ലാത്ത സൈനികസൂചന ശക്തമാക്കുന്നില്ല.
- source_word: אֲשֶׁר בָּאוּ בְרַגְלוֹ מִגַּת
  choice: ഗത്തിൽനിന്ന് അവനോടൊപ്പം കാൽനടയായി വന്ന
  rationale: ‘അവന്റെ കാലോടുകൂടെ’ എന്ന എബ്രായ ദൃശ്യഭാവം സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു; ഇത് അവനെ അനുഗമിച്ചുവെന്ന അർഥവും വഹിക്കാം.
- source_word: עֹבְרִים עַל פְּנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ മുമ്പിലൂടെ കടന്നുപോയി
  rationale: עַל פְּנֵי എന്നതിന്റെ ‘മുമ്പിൽ/മുമ്പിലൂടെ’ എന്ന സ്ഥലപരമായ അർഥവും ഘോഷയാത്രയുടെ ചലനവും വ്യക്തമാക്കുന്നു.
