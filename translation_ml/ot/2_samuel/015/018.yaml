  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സംഘനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; ആവർത്തിക്കുന്ന ചലനക്രിയകൾ ഘോഷയാത്രാസന്ദർഭം നിലനിർത്താൻ സംരക്ഷിച്ചു.
