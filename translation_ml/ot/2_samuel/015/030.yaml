  text: וְ/דָוִ֡ד עֹלֶה֩ בְ/מַעֲלֵ֨ה הַ/זֵּיתִ֜ים עֹלֶ֣ה וּ/בוֹכֶ֗ה וְ/רֹ֥אשׁ ל/וֹ֙ חָפ֔וּי וְ/ה֖וּא הֹלֵ֣ךְ יָחֵ֑ף וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ חָפוּ֙ אִ֣ישׁ רֹאשׁ֔/וֹ וְ/עָל֥וּ עָלֹ֖ה וּ/בָכֹֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
translation:
  language: ml
  text: ദാവീദ് ഒലിവുമലയുടെ കയറ്റം കയറിക്കൊണ്ടിരുന്നു; കയറിക്കൊണ്ടും കരഞ്ഞുകൊണ്ടും[a]. അവന്റെ തല മൂടിയിരുന്നു; അവൻ ചെരിപ്പില്ലാതെ നടന്നിരുന്നു. അവനോടുകൂടെ ഉണ്ടായിരുന്ന ജനമെല്ലാം ഓരോരുത്തരും തങ്ങളുടെ തല മൂടി[b]. അവർ കയറിക്കൊണ്ടും കരഞ്ഞുകൊണ്ടും മുകളിലേക്കു പോയി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ ഊന്നലിനായി ‘കയറുക’ എന്ന ക്രിയ ആവർത്തിക്കുന്നു: അക്ഷരാർഥത്തിൽ, ‘കയറിക്കൊണ്ടും കരഞ്ഞുകൊണ്ടും.’'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഓരോ പുരുഷനും തന്റെ തല മൂടി’; എബ്രായത്തിൽ വിതരണാർഥമുള്ള ഏകവചനമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘അവർ കയറി, കയറിക്കൊണ്ടും കരഞ്ഞുകൊണ്ടും’; ആവർത്തനം പ്രവൃത്തിക്ക് ഊന്നലും ദൃശ്യസജീവതയും നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  choice: ഒലിവുമലയുടെ കയറ്റം
  rationale: מַעֲלֵה ഒരു കയറ്റത്തെയോ മുകളിലേക്കുള്ള വഴിയെയോ സൂചിപ്പിക്കുന്നു; הַזֵּיתִים ഇവിടെ സ്ഥാപിതമായ സ്ഥലനാമമായ ഒലിവുമലയെ സൂചിപ്പിക്കുന്നു.
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  choice: കയറിക്കൊണ്ടിരുന്നു; കയറിക്കൊണ്ട് അവൻ കരയുകയും ചെയ്തു
  rationale: ആവർത്തിച്ചിരിക്കുന്ന വർത്തമാന കൃ‌ദന്തങ്ങൾ നടന്നുകൊണ്ടിരിക്കുന്ന ദൃശ്യത്തെ സജീവമായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിലും കയറുക എന്ന ക്രിയ ആവർത്തിച്ച് ആ ഊന്നൽ നിലനിർത്തി.
- source_word: בֹּכֶה
  choice: കരയുകയും ചെയ്തു
  rationale: ആചാരപരമായ വിലാപം എന്ന അധിക അർഥം ചേർക്കാതെ കരച്ചിലിന്റെ സാധാരണ അർഥം നൽകുന്നു.
- source_word: וְרֹאשׁ לוֹ חָפוּי
  choice: അവന്റെ തല മൂടിയിരുന്നു
  rationale: എങ്ങനെ മൂടിയെന്നു അനാവശ്യമായി വ്യക്തമാക്കാതെ ദുഃഖാചരണത്തിന്റെ നിലപാട് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יָחֵף
  choice: ചെരിപ്പില്ലാതെ
  rationale: ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന ജനമെല്ലാം
  rationale: הָעָם എന്ന വിശാല പദത്തെ സൈനികർ എന്നു പരിമിതപ്പെടുത്താതെ കൂടെയുണ്ടായിരുന്ന മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: חָפוּ אִישׁ רֹאשׁוֹ
  choice: ഓരോരുത്തരും തല മൂടി
  rationale: אִישׁ ഇവിടെ വിതരണാർഥമുള്ള ഏകവചനമാണ്; മലയാളത്തിലെ ‘ഓരോരുത്തരും’ ആ അർഥം ലിംഗപരമായി അനാവശ്യമായി ചുരുക്കാതെ നൽകുന്നു.
- source_word: וְעָלוּ עָלֹה וּבָכֹה
  choice: അവർ കയറിക്കൊണ്ടും കരഞ്ഞുകൊണ്ടും മുകളിലേക്കു പോയി
  rationale: സമാപികാക്രിയയോടു ചേർന്ന കേവലക്രിയാരൂപം പ്രവൃത്തിയുടെ തുടർച്ചയ്ക്കും ഊന്നലിനും സജീവതയ്ക്കും ഇടയാക്കുന്നു; മലയാളത്തിലെ സമാന്തരമായ തുടർക്രിയാരൂപങ്ങൾ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
