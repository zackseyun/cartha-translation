language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֥א חוּשַׁ֛י רֵעֶ֥ה דָוִ֖ד הָ/עִ֑יר וְ/אַבְשָׁלֹ֔ם יָבֹ֖א יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/037.yaml
  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദിന്റെ സുഹൃത്തായ ഹൂശായി നഗരത്തിൽ എത്തി; അപ്പോൾ അബ്ശാലോം യെരൂശലേമിൽ പ്രവേശിക്കുകയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അബ്ശാലോമും യെരൂശലേമിൽ പ്രവേശിച്ചു.” എബ്രായ ബന്ധകത്തെ ലളിതമായ ‘ഉം/യും’ എന്നു വായിക്കാനും ക്രിയയെ സാധാരണ ഭൂതകാലത്തിൽ പരിഭാഷപ്പെടുത്താനും കഴിയും.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: എത്തി
  rationale: בוא എന്ന ക്രിയയ്ക്ക് ‘വരുക’, ‘എത്തുക’, ‘പ്രവേശിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം. നഗരത്തെ ലക്ഷ്യമാക്കിയ ചലനം സ്വാഭാവിക മലയാളത്തിൽ ‘നഗരത്തിൽ എത്തി’ എന്നു നൽകി.
- source_word: חוּשַׁי
  choice: ഹൂശായി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: רֵעֶה דָוִד
  choice: ദാവീദിന്റെ സുഹൃത്ത്
  rationale: רֵעֶה എന്നത് സുഹൃത്ത്, കൂട്ടുകാരൻ, സഹചാരി എന്നിവ സൂചിപ്പിക്കാം. ഔദ്യോഗിക ഉപദേഷ്ടാവ് എന്ന കൂടുതൽ നിർദിഷ്ട ആശയം ചേർക്കാതെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി.
- source_word: הָעִיר
  choice: നഗരം
  rationale: സന്ദർഭത്തിൽ യെരൂശലേമിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും മൂലപാഠത്തിലെ പൊതുനാമം നിലനിർത്തി.
- source_word: וְאַבְשָׁלֹם
  choice: അപ്പോൾ അബ്ശാലോം
  rationale: ו എന്ന ബന്ധകം സാധാരണ ‘ഉം/യും’ എന്നോ ‘അപ്പോൾ’ എന്നോ നൽകാം. തുടർന്നുള്ള yiqtol ക്രിയയുടെ പശ്ചാത്തലപരമായ സ്വഭാവത്തോടൊപ്പം ഇവിടെ സമകാലികത സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יָבֹא
  choice: പ്രവേശിക്കുകയായിരുന്നു
  rationale: മുമ്പുള്ള wayyiqtol-ൽനിന്ന് വ്യത്യസ്തമായ yiqtol രൂപം ഇവിടെ പുരോഗമിച്ചുകൊണ്ടിരുന്ന, പശ്ചാത്തലത്തിലുള്ള പ്രവൃത്തിയായി വായിക്കാവുന്നതാണ്. അതിനാൽ സമകാലികത സംരക്ഷിക്കുന്ന രൂപം തിരഞ്ഞെടുത്തു.
- source_word: יְרוּשָׁלִָם
  choice: യെരൂശലേം
  rationale: സ്ഥലപ്പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾ രൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: അബ്ശാലോമിന്റെ പ്രവേശനം ഹൂശായിയുടെ വരവിനോടു സമകാലികമാണോ അതോ തുടർന്നുള്ള സംഭവമാണോ
  choice: ‘അപ്പോൾ ... പ്രവേശിക്കുകയായിരുന്നു’ എന്ന സമകാലിക/പശ്ചാത്തല വായന
  alternative: ‘അബ്ശാലോമും യെരൂശലേമിൽ പ്രവേശിച്ചു’ എന്ന ലളിത അനുക്രമ വായന
  rationale: ו ബന്ധകത്തിന് ലളിതമായ അനുക്രമ അർഥം സാധ്യമാണെങ്കിലും, മുൻവാക്യത്തിലെ wayyiqtol-നുശേഷമുള്ള יָבֹא എന്ന yiqtol രൂപവ്യത്യാസം സമകാലികമോ പശ്ചാത്തലപരമോ ആയ പ്രവൃത്തിയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘നഗരം’ എന്ന മൂലപാഠത്തിലെ പൊതുനാമവും ക്രിയാരൂപങ്ങൾക്കിടയിലെ യഥാർഥ വ്യത്യാസവും സംരക്ഷിച്ചു; വ്യാകരണപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
