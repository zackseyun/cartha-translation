reference: 2 Samuel 15:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אַבְשָׁל֔וֹם רְאֵ֥ה דְבָרֶ֖/ךָ טוֹבִ֣ים וּ/נְכֹחִ֑ים וְ/שֹׁמֵ֥עַ אֵין לְ/ךָ֖ מֵ/אֵ֥ת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/003.yaml
  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്ശാലോം അവനോടു പറഞ്ഞു: “നോക്കൂ, നിന്റെ വാദം നല്ലതും ന്യായവുമാണ്[a]. എന്നാൽ നിന്റെ വാദം കേൾക്കാൻ രാജാവിന്റെ ഭാഗത്തുനിന്ന് ആരുമില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ കേസ് നല്ലതും ന്യായവുമാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ דָּבָר എന്ന പദത്തിന് ‘വാക്ക്,’ ‘കാര്യം,’ നിയമസന്ദർഭത്തിൽ ‘കേസ്’ അല്ലെങ്കിൽ ‘വാദം’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “രാജാവിന്റെ ഭാഗത്തുനിന്ന് നിനക്കായി കേൾക്കുന്നവൻ ആരുമില്ല.” അതായത്, കേസ് കേൾക്കാൻ രാജാവിനാൽ അധികാരപ്പെടുത്തപ്പെട്ട ആരുമില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: അപ്പോൾ അബ്ശാലോം അവനോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അവനോടു’ എന്നത് എബ്രായത്തിലെ സർവനാമകർമത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: רְאֵה
  choice: നോക്കൂ
  rationale: ഇവിടെ ראה എന്ന ആജ്ഞാരൂപം ശ്രദ്ധ ക്ഷണിക്കുന്ന സംഭാഷണപ്രയോഗമാണ്. ‘നോക്കൂ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: דְבָרֶךָ
  choice: നിന്റെ വാദങ്ങൾ
  rationale: ന്യായവിധിക്കായി വരുന്നവരുടെ പശ്ചാത്തലത്തിൽ דָּבָר വെറും ‘വാക്ക്’ എന്നതിലുപരി നിയമപരമായ വാദത്തെയോ കേസിലെ അവകാശവാദങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘വാദങ്ങൾ’ ഈ നിയമസന്ദർഭം ലളിതമായി പകർന്നു നൽകുന്നു.
- source_word: טוֹבִים וּנְכֹחִים
  choice: നല്ലതും ന്യായവുമാണ്
  rationale: טוֹבִים എന്നതിന്റെ വിശാലമായ ‘നല്ല’ എന്ന വിലയിരുത്തലും נְכֹחִים എന്നതിലെ നേരായതും ശരിയായതുമായ അർഥവും നിലനിർത്തുന്നു. നിയമസന്ദർഭത്തിൽ ‘ന്യായം’ സ്വാഭാവികമാണ്; എന്നാൽ വാദങ്ങൾ നിയമപരമായി സാധുവാണെന്ന് അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  choice: എന്നാൽ നിന്റെ വാദം കേൾക്കാൻ രാജാവിന്റെ ഭാഗത്തുനിന്ന് ആരുമില്ല
  rationale: שֹׁמֵעַ ഇവിടെ ഒരു നിയമവാദം കേൾക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. מֵאֵת הַמֶּלֶךְ രാജാവിൽനിന്നുള്ള അധികാരമോ നിയോഗമോ സൂചിപ്പിക്കാം. ‘രാജാവിന്റെ ഭാഗത്തുനിന്ന്’ ആ ബന്ധം വ്യക്തമാക്കുമ്പോഴും ഔദ്യോഗിക നിയമനം എന്നു പാഠത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. നിയമസന്ദർഭം വ്യക്തമാക്കാൻ ‘വാദം’ തിരഞ്ഞെടുത്തു; എബ്രായത്തിലെ സംക്ഷിപ്തതയും അബ്ശാലോമിന്റെ പ്രേരണാത്മകമായ നേരിട്ടുള്ള സംഭാഷണഭാവവും നിലനിർത്തി.
