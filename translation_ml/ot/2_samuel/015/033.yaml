id: 2SA.15.33
reference: 2 Samuel 15:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר ל֖/וֹ דָּוִ֑ד אִ֚ם עָבַ֣רְתָּ אִתִּ֔/י וְ/הָיִ֥תָ עָלַ֖/י לְ/מַשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/033.yaml
  text: David said to him[a], “If you pass on with me, you will be a burden to me.”
translation:
  language: ml
  text: 'ദാവീദ് അവനോടു പറഞ്ഞു: “നീ എന്നോടൊപ്പം കടന്നുപോകുന്നെങ്കിൽ[a] നീ എനിക്ക് ഒരു ഭാരമായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ എന്നോടൊപ്പം യാത്ര തുടർന്നാൽ.” എബ്രായ ക്രിയയ്ക്ക് കൂടുതൽ അക്ഷരാർഥത്തിൽ “കടന്നുപോകുക” അല്ലെങ്കിൽ “മറുകരയിലേക്കു കടക്കുക” എന്നർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  choice: ദാവീദ് ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ദാവീദ് ... പറഞ്ഞു’ എന്നത് മതിയാകുന്നു; നിർബന്ധമായി ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘പിന്നെ’ ചേർക്കേണ്ടതില്ല.
- source_word: לוֹ
  choice: അവനോടു
  rationale: എബ്രായമൂലത്തിൽ പുരുഷലിംഗ ഏകവചന സർവനാമം വ്യക്തമാണ്; ഈ വാക്യത്തിൽ പേര് പറയാത്തതിനാൽ സന്ദർഭത്തിലെ ഹൂശായിയുടെ പേര് ചേർക്കാതെ സർവനാമം നിലനിർത്തുന്നു.
- source_word: אִם
  choice: എങ്കിൽ
  rationale: നേരിട്ടുള്ള ഉപാധിവാക്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ വ്യവസ്ഥാസൂചക രൂപമാണിത്.
- source_word: עָבַרְתָּ אִתִּי
  choice: നീ എന്നോടൊപ്പം കടന്നുപോയാൽ
  rationale: עבר എന്ന ക്രിയയ്ക്ക് ‘കടന്നുപോകുക/മറുകരയിലേക്കു കടക്കുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ട്. ദാവീദിനോടൊപ്പം തുടർന്നുള്ള യാത്രയിൽ പോകുന്നതാണ് സന്ദർഭാർഥം; ‘കടന്നുപോയാൽ’ മൂലപദത്തിന്റെ ചലനാർഥം നിലനിർത്തുന്നു.
- source_word: וְהָיִתָ עָלַי
  choice: എനിക്ക് ... ആയിത്തീരും
  rationale: היה + על എന്ന ഘടന ദാവീദിന്മേൽ ഉണ്ടാകുന്ന ഫലമോ ചുമത്തലോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ തുടർന്നുവരുന്ന നാമപൂരകത്തോടൊപ്പം ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: לְמַשָּׂא
  choice: ഒരു ഭാരം
  rationale: מַשָּׂא എന്നത് ചുമക്കേണ്ട ഭാരത്തെയോ ചുമടിനെയോ സൂചിപ്പിക്കുന്നു. വ്യക്തിപരമായ ഈ സന്ദർഭത്തിൽ ‘ഒരു ഭാരം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ സർവനാമവും ഉപാധിവാക്യവും സംരക്ഷിച്ചിരിക്കുന്നു; עבר എന്ന പദത്തിന്റെ സഞ്ചാരസംബന്ധമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
