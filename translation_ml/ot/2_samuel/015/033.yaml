  to: 'ദാവീദ് അവനോടു പറഞ്ഞു: “നീ എന്നോടൊപ്പം കടന്നുപോകുന്നെങ്കിൽ[a] നീ എനിക്ക് ഒരു ഭാരമായിരിക്കും.”'
