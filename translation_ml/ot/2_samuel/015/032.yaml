source:
  edition: WLC
  text: וַ/יְהִ֤י דָוִד֙ בָּ֣א עַד הָ/רֹ֔אשׁ אֲשֶֽׁר יִשְׁתַּחֲוֶ֥ה שָׁ֖ם לֵ/אלֹהִ֑ים וְ/הִנֵּ֤ה לִ/קְרָאת/וֹ֙ חוּשַׁ֣י הָ/אַרְכִּ֔י קָר֨וּעַ֙ כֻּתָּנְתּ֔/וֹ וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
translation:
  language: ml
  text: ദാവീദ് ദൈവത്തെ ആരാധിക്കാറുണ്ടായിരുന്ന കൊടുമുടിയിൽ[a] എത്തിയപ്പോൾ, അതാ,[b] അർക്ക്യനായ ഹൂശായി കീറിയ അങ്കിയോടെയും തലയിൽ മണ്ണോടെയും അവനെ എതിരേൽക്കാൻ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ ക്രിയയെ ‘അവിടെ ദൈവത്തെ ആരാധിച്ച’ എന്നും പരിഭാഷപ്പെടുത്താം; അത് പതിവായിരുന്ന പ്രവൃത്തിയെയോ ഒരിക്കൽ നടന്ന പ്രവൃത്തിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അതാ’ എന്നത് ഹൂശായി പെട്ടെന്നു പ്രത്യക്ഷപ്പെടുന്നതിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഒരു എബ്രായ ആഖ്യാനചിഹ്നത്തെ പരിഭാഷപ്പെടുത്തുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: കൊടുമുടി
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘തല’ എന്നാണെങ്കിലും, ഇവിടെ ഭൂപ്രകൃതിസംബന്ധമായ സന്ദർഭത്തിൽ കയറ്റത്തിന്റെ അഥവാ മലയുടെ മുകളറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  choice: ദൈവത്തെ ആരാധിക്കാറുണ്ടായിരുന്ന
  rationale: יִשְׁתַּחֲוֶה എന്ന അപൂർണക്രിയയ്ക്ക് കഥാസന്ദർഭത്തിൽ പതിവായിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാം. ദൈവത്തോടു ബന്ധപ്പെട്ട് ‘കുമ്പിടുക’ എന്ന അക്ഷരാർഥത്തെക്കാൾ ‘ആരാധിക്കുക’ എന്നത് മലയാളത്തിൽ ആശയം സ്വാഭാവികമായി നൽകുന്നു; ഒറ്റത്തവണ നടന്ന പ്രവൃത്തി എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ഹൂശായിയുടെ പെട്ടെന്നുള്ള പ്രത്യക്ഷതയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ ആഖ്യാനചിഹ്നത്തിന്റെ സജീവത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִקְרָאתוֹ
  choice: അവനെ എതിരേൽക്കാൻ വന്നു
  rationale: ദാവീദിനെ നേരിൽ കാണുന്നതിനായി അടുത്തുവരുന്ന ചലനമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽനിന്ന് ആവശ്യമായ ‘വന്നു’ എന്ന ക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: അർഖ്യനായ ഹൂശായി
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുകയും ജനവിഭാഗമോ സ്വദേശമോ സൂചിപ്പിക്കുന്ന വിശേഷണം മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണരൂപത്തിൽ നൽകുകയും ചെയ്തു.
- source_word: קָרוּעַ כֻּתָּנְתּוֹ
  choice: കീറിയ അങ്കിയോടെ
  rationale: כֻּתֹּנֶת ശരീരത്തിൽ ധരിക്കുന്ന അങ്കിസദൃശ വസ്ത്രമാണ്; קָרוּעַ അതിന്റെ കീറിയ നിലയെ സൂചിപ്പിക്കുന്നു. പ്രവൃത്തി പുതുതായി ചെയ്യുന്നതായി തോന്നാതിരിക്കാൻ നില സൂചിപ്പിക്കുന്ന ഘടന ഉപയോഗിച്ചു.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: തലയിൽ മണ്ണോടെ
  rationale: אֲדָמָה എന്നത് മണ്ണ്/നിലം എന്നാണ്; ദുഃഖാചരണത്തിന്റെ ഈ സന്ദർഭത്തിൽ ‘തലയിൽ മണ്ണ്’ അക്ഷരാർഥവും സാംസ്കാരിക പ്രവൃത്തിയും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ ആരാധന പതിവായിരുന്നോ, ആ അവസരത്തിലെ ഒറ്റ പ്രവൃത്തിയായിരുന്നോ
  choice: പതിവായിരുന്ന ആരാധന എന്ന സാധ്യത പ്രധാനവാചകത്തിൽ നൽകി
  alternative: ‘അവിടെ ദൈവത്തെ ആരാധിച്ച’ എന്ന ഒറ്റത്തവണ നടന്ന പ്രവൃത്തിയായി വായിക്കുക
  rationale: എബ്രായ അപൂർണക്രിയയ്ക്ക് സന്ദർഭത്തിൽ പതിവുപ്രവൃത്തി സൂചിപ്പിക്കാനാകുമെങ്കിലും ലളിതമായ ഭൂതകാലവായനയും സാധ്യമാണ്; അതിനാൽ മറ്റുവായന അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അതാ’ എന്ന അല്പം ഉയർന്ന രജിസ്റ്ററിലുള്ള പദം മൂലഭാഷയിലെ നാടകീയമായ ശ്രദ്ധാകർഷണം നിലനിർത്താൻ ഉപയോഗിച്ചു; വസ്ത്രത്തിനായി പൊതുവായ ‘വസ്ത്രം’ എന്നതിനു പകരം കൂടുതൽ നിർദ്ദിഷ്ടമായ ‘അങ്കി’ തിരഞ്ഞെടുത്തു.
