translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. പേരുകൾ മലയാള ബൈബിൾപ്രയോഗത്തിന് യോജിച്ച രൂപത്തിൽ നൽകിയിരിക്കുന്നു. എബ്രായത്തിലെ നിർദേശസ്വരവും വിവരവിനിമയസന്ദർഭവും നിലനിർത്തി; എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട പദങ്ങളുടെ പിന്നാലെ ചേർത്തിരിക്കുന്നു.
