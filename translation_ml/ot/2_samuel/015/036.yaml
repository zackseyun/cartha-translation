source:
  edition: WLC
  text: הִנֵּה שָׁ֤ם עִמָּ/ם֙ שְׁנֵ֣י בְנֵי/הֶ֔ם אֲחִימַ֣עַץ לְ/צָד֔וֹק וִ/יהוֹנָתָ֖ן לְ/אֶבְיָתָ֑ר וּ/שְׁלַחְתֶּ֤ם בְּ/יָדָ/ם֙ אֵלַ֔/י כָּל דָּבָ֖ר אֲשֶׁ֥ר תִּשְׁמָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
translation:
  language: ml
  text: '“ഇതാ, അവരുടെ രണ്ടു പുത്രന്മാർ അവരോടൊപ്പം അവിടെയുണ്ട്: സാദോക്കിന്റെ മകൻ അഹീമാസും അബ്യാഥാരിന്റെ മകൻ യോനാഥാനും. നിങ്ങൾ കേൾക്കുന്ന ഓരോ വിവരവും[b] അവരുടെ മുഖാന്തരം[a] എനിക്ക് അയച്ചുതരണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അവരുടെ കൈയാൽ’; ഇവിടെ അവരുടെ മുഖാന്തരം വിവരം കൈമാറുക എന്നർഥമുള്ള എബ്രായ ശൈലി.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങൾ കേൾക്കുന്ന ഓരോ കാര്യവും’ അല്ലെങ്കിൽ ‘ഓരോ വാർത്തയും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁם עִמָּם
  choice: അവരോടൊപ്പം അവിടെയുണ്ട്
  rationale: പുത്രന്മാർ പുരോഹിതന്മാരോടൊപ്പം അതേ സ്ഥലത്തുണ്ടെന്ന സ്ഥലസൂചനയും സഹവാസസൂചനയും രണ്ടും നിലനിർത്തുന്നു.
- source_word: שְׁנֵי בְנֵיהֶם
  choice: അവരുടെ രണ്ടു പുത്രന്മാർ
  rationale: സാദോക്കിന്റെയും അബ്യാഥാരിന്റെയും പുത്രന്മാരെയാണ് ഈ ഘടന നേരിട്ട് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲחִימַעַץ לְצָדוֹק וִיהוֹנָתָן לְאֶבְיָתָר
  choice: സാദോക്കിന്റെ മകൻ അഹീമാസും അബ്യാഥാരിന്റെ മകൻ യോനാഥാനും
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ബന്ധം സന്ദർഭത്തിൽ പുത്രബന്ധമാണെന്ന് വ്യക്തമായി, മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וּשְׁלַחְתֶּם
  choice: അയച്ചുതരണം
  rationale: സന്ദർഭത്തിലെ നിർദേശസ്വരം നിലനിർത്തിക്കൊണ്ട് ബഹുവചന അഭിസംബോധനയ്ക്ക് യോജിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: בְּיָדָם
  choice: അവരുടെ മുഖാന്തരം
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ കൈയാൽ’ എന്നാണെങ്കിലും, ഇവിടെ സന്ദേശം കൈമാറുന്ന ഏജൻസിയെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘മുഖാന്തരം’ എന്നു നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כָּל דָּבָר
  choice: ഓരോ വിവരവും
  rationale: דָּבָר എന്ന പദത്തിന് ‘വാക്ക്,’ ‘കാര്യം,’ ‘വിവരം’ എന്നീ അർഥസാധ്യതകളുണ്ട്; ചാരവിവരം കൈമാറുന്ന ഈ സന്ദർഭത്തിൽ ‘വിവരം’ യോജിക്കുന്നു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר תִּשְׁמָעוּ
  choice: നിങ്ങൾ കേൾക്കുന്ന
  rationale: שׁמע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ശ്രവണാർഥം നിലനിർത്തുന്നു; ലഭിക്കുന്ന വിവരങ്ങളെയാണ് ആപേക്ഷിക വാക്യം വിശേഷിപ്പിക്കുന്നത്.
