source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/צָד֔וֹק הָשֵׁ֛ב אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים הָ/עִ֑יר אִם אֶמְצָ֥א חֵן֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֶ/הֱשִׁבַ֕/נִי וְ/הִרְאַ֥/נִי אֹת֖/וֹ וְ/אֶת נָוֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് സാദോക്കിനോടു പറഞ്ഞു: “ദൈവത്തിന്റെ പെട്ടകം നഗരത്തിലേക്കു തിരികെ കൊണ്ടുപോകുക. യഹോവയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചാൽ, അവിടുന്ന് എന്നെ തിരികെ കൊണ്ടുവരുകയും എനിക്കു അതിനെയും അതിന്റെ വാസസ്ഥാനത്തെയും കാണിച്ചുതരുകയും ചെയ്യും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടുത്തെയും അവിടുത്തെ വാസസ്ഥാനത്തെയും എനിക്കു കാണിച്ചുതരുകയും ചെയ്യും.” തൊട്ടുമുമ്പുള്ള പദം ‘ദൈവത്തിന്റെ പെട്ടകം’ ആണെങ്കിലും, എബ്രായവാചകം ദൈവത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിലും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: הָשֵׁב
  choice: തിരികെ കൊണ്ടുപോകുക
  rationale: സാദോക്കിനോടുള്ള שוב എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപമാണിത്. പെട്ടകം നഗരത്തിലേക്കു മടക്കിക്കൊണ്ടുപോകണമെന്ന കാരണാർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: എബ്രായപാഠത്തിൽ ഇവിടെ אֱלֹהִים (‘ദൈവം’) തന്നെയാണ്; പരിചിതമായ മറ്റൊരു പ്രയോഗത്തിലേക്കു സമന്വയിപ്പിക്കാതെ മൂലപാഠം പിന്തുടരുന്നു.
- source_word: הָעִיר
  choice: നഗരത്തിലേക്ക്
  rationale: നിശ്ചിതനാമത്തിന്റെ ദിശാസൂചന ക്രിയാസന്ദർഭത്തിൽനിന്നു ലഭിക്കുന്നു; മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചാൽ
  rationale: ‘കണ്ണുകളിൽ കൃപ കണ്ടെത്തുക’ എന്ന എബ്രായ ശൈലിയുടെ ബന്ധപരമായ അർഥം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וֶהֱשִׁבַנִי
  choice: അവിടുന്ന് എന്നെ തിരികെ കൊണ്ടുവരുകയും
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും സൂചിപ്പിക്കുന്ന കാരണാർത്ഥ മടക്കിവരുത്തൽ കൃത്യമായി നൽകുന്നു.
- source_word: וְהִרְאַנִי
  choice: കാണാൻ എനിക്ക് ഇടയാക്കുകയും ചെയ്യും
  rationale: ראה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപമായ ‘എന്നെ കാണുമാറാക്കുക’ എന്ന അർഥം, ദൈവിക പ്രവർത്തനത്തിന്റെ സൂക്ഷ്മത നഷ്ടപ്പെടുത്താതെ വായനാസൗകര്യമുള്ള മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֹתוֹ
  choice: അതും
  rationale: ഏറ്റവും അടുത്ത പൂർവപദമായ ‘ദൈവത്തിന്റെ പെട്ടകം’ പുരുഷലിംഗമാണെങ്കിലും ജഡവസ്തുവായതിനാൽ മലയാളത്തിൽ ‘അത്’ സ്വാഭാവികമാണ്.
- source_word: נָוֵהוּ
  choice: അതിന്റെ വാസസ്ഥാനവും
  rationale: נָוֶה എന്നത് വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ദേവാലയം അന്നുവരെ പണിതിട്ടില്ലാത്തതിനാൽ അതിലധികം പ്രത്യേകീകരിക്കാതെ പെട്ടകത്തിന്റെ പാർപ്പിടം എന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അതും അതിന്റെ വാസസ്ഥാനവും’ എന്നതിലെ സർവനാമങ്ങളുടെ സൂചിതം
  choice: പെട്ടകത്തെയും അത് വസിക്കുന്ന സ്ഥലത്തെയും സൂചിപ്പിക്കുന്നതായി മുഖ്യവാചകത്തിൽ വിവർത്തനം ചെയ്തു.
  alternative: ദൈവത്തെയും അവിടുത്തെ വാസസ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
  rationale: തൊട്ടുമുമ്പുള്ള പൂർവപദം ‘ദൈവത്തിന്റെ പെട്ടകം’ ആയതിനാൽ അതാണ് ഏറ്റവും സ്വാഭാവികമായ സൂചിതം. എന്നാൽ പെട്ടകം ദൈവസാന്നിധ്യത്തെ പ്രതിനിധീകരിക്കുന്നതിനാലും എബ്രായ സർവനാമങ്ങൾ പുരുഷലിംഗമായതിനാലും ദൈവകേന്ദ്രിതമായ വായനയ്ക്കുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ‘അവിടുന്ന്’ ദൈവത്തെ ആദരസൂചകമായി പരാമർശിക്കുന്നു; ‘പെട്ടകം’ പരമ്പരാഗതവും പൊതുവായി മനസ്സിലാകുന്നതുമായ പദമാണ്. മൂലത്തിലെ സർവനാമസന്ദിഗ്ധത മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
