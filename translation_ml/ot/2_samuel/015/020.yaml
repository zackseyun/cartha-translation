id: 2SA.15.20
reference: 2 Samuel 15:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
translation:
  language: ml
  text: നീ വന്നത് ഇന്നലെ മാത്രമാണ്. ഇന്ന്, ഞാൻ എവിടേക്കാണോ പോകുന്നത് അവിടേക്കു പോകുമ്പോൾ[a], നിന്നെയും ഞങ്ങളോടൊപ്പം അലയാൻ ഇടയാക്കണമോ? മടങ്ങിപ്പോകുക; നിന്റെ സഹോദരന്മാരെയും[b] നിന്നോടൊപ്പം തിരികെ കൊണ്ടുപോകുക. അചഞ്ചലമായ സ്നേഹവും വിശ്വസ്തതയും[c] നിന്നോടുകൂടെ ഉണ്ടായിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് അടുത്തായി: “ഞാൻ പോകുന്നിടത്തേക്കു ഞാൻ പോകുമ്പോൾ.” ദാവീദിന്റെ പലായനത്തിലെ അനിശ്ചിതത്വം ഈ എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരന്മാർ” എന്നത് ഇത്ഥായിയോടൊപ്പം വന്ന ബന്ധുക്കളെയോ കൂട്ടാളികളെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: c
    text: എബ്രായത്തിൽ “അചഞ്ചലമായ സ്നേഹവും വിശ്വസ്തതയും”; ഉറച്ച സ്നേഹത്തെയും വിശ്വാസ്യതയെയും ചേർത്തുപറയുന്ന പതിവുപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  choice: നീ വന്നത് ഇന്നലെ മാത്രമാണ്
  rationale: תְּמוֹל എന്നത് അടിസ്ഥാനമായി ‘ഇന്നലെ’ എന്നാണ്; ഇത്ഥായി വളരെ അടുത്തകാലത്താണ് എത്തിയതെന്ന ദാവീദിന്റെ ഊന്നൽ ‘മാത്രമാണ്’ എന്ന പ്രയോഗം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֲנוּעֲךָ
  choice: നിന്നെയും ... അലയാൻ ഇടയാക്കണമോ
  rationale: נוע എന്ന ധാതുവിന്റെ കാരകഭാവവും സ്ഥിരതയില്ലാതെ അലഞ്ഞുനടക്കേണ്ടിവരുന്ന അവസ്ഥയും നിലനിർത്തുന്നു.
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  choice: ഞാൻ എവിടേക്കാണോ പോകുന്നത് അവിടേക്കു പോകുമ്പോൾ
  rationale: എബ്രായത്തിലെ ആവർത്തനാത്മകവും അല്പം ദുർഗ്രഹവുമായ പ്രയോഗം അനാവശ്യമായി വ്യാഖ്യാനിച്ചു തീർക്കാതെ, ദാവീദിന്റെ യാത്രയുടെ അനിശ്ചിതത്വം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: שׁוּב וְהָשֵׁב
  choice: മടങ്ങിപ്പോകുക; ... തിരികെ കൊണ്ടുപോകുക
  rationale: ആദ്യത്തേത് സാധാരണ ആജ്ഞാരൂപവും രണ്ടാമത്തേത് കാരകമായ ഹിഫീൽ രൂപവുമാണ്; ഈ വ്യത്യാസം മലയാളത്തിൽ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: אַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാർ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള ബന്ധപദം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത്ഥായിയുടെ ബന്ധുക്കളെയോ കൂട്ടാളികളെയോ സൂചിപ്പിക്കാം എന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֶסֶד וֶאֱמֶת
  choice: അചഞ്ചലമായ സ്നേഹവും വിശ്വസ്തതയും
  rationale: חֶסֶד എന്നതിലെ ഉറച്ച, വിശ്വസ്ത സ്നേഹവും אֱמֶת എന്നതിലെ വിശ്വാസ്യതയും ചേർന്ന പ്രയോഗത്തിന്റെ നൈതിക-ദൈവശാസ്ത്രപരമായ ഭാരം സ്വാഭാവിക മലയാളത്തിൽ വഹിക്കുന്നു.
theological_decisions:
- issue: വാക്യാവസാനത്തിലെ ക്രിയയില്ലാത്ത חֶסֶד וֶאֱמֶת എന്ന പ്രയോഗത്തിന്റെ ഭാവം
  choice: അചഞ്ചലമായ സ്നേഹവും വിശ്വസ്തതയും നിന്നോടുകൂടെ ഉണ്ടായിരിക്കട്ടെ
  alternative: അചഞ്ചലമായ സ്നേഹവും വിശ്വസ്തതയും
  rationale: എബ്രായത്തിൽ ക്രിയ വ്യക്തമല്ലെങ്കിലും സംഭാഷണസന്ദർഭം ഇതിനെ ആശംസയോ അനുഗ്രഹവാക്യമോ ആയി വായിക്കാൻ പിന്തുണയ്ക്കുന്നു; ‘ഉണ്ടായിരിക്കട്ടെ’ ചേർക്കുന്നത് അതിനെ സ്വാഭാവിക മലയാളമാക്കുന്നു, എന്നാൽ ആരാണ് അതു നൽകുന്നതെന്ന് പ്രത്യേകം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ദാവീദിന്റെ ചോദ്യത്തിലെ കരുതലും യാത്രയിലെ അനിശ്ചിതത്വവും നിലനിർത്തി; മൂലത്തിലെ അസ്പഷ്ടതകൾ അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
