source:
  edition: WLC
  text: וְ/דָוִד֙ הִגִּ֣יד לֵ/אמֹ֔ר אֲחִיתֹ֥פֶל בַּ/קֹּשְׁרִ֖ים עִם אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר דָּוִ֔ד סַכֶּל נָ֛א אֶת עֲצַ֥ת אֲחִיתֹ֖פֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
translation:
  language: ml
  text: 'ദാവീദിനോട് ഇങ്ങനെ അറിയിച്ചു: “അഹീഥോഫെൽ അബ്ശാലോമിനോടൊപ്പം ഗൂഢാലോചനക്കാരുടെ കൂട്ടത്തിലുണ്ട്.” അപ്പോൾ ദാവീദ് പറഞ്ഞു: “യഹോവേ, അഹീഥോഫെലിന്റെ ആലോചനയെ ഭോഷമാക്കണമേ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അഹീഥോഫെലിന്റെ ആലോചന വിഫലമാക്കണമേ.” എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി, ആ ആലോചനയെ ഭോഷമാക്കണമെന്നാണ് അപേക്ഷ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד
  choice: അറിയിച്ചു
  rationale: ഹിഫ്ഇൽ രൂപം ‘അറിയിക്കുക, റിപ്പോർട്ട് ചെയ്യുക’ എന്നർഥം നൽകുന്നു. കർത്താവിനെ മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിലും അനിശ്ചിത കർത്തൃപ്രയോഗം നിലനിർത്തി.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: എബ്രായത്തിലെ ഉദ്ധരണി-ആമുഖത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; പ്രത്യേകം ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർക്കുന്നത് ഇവിടെ അസ്വാഭാവികമാണ്.
- source_word: בַּקֹּשְׁרִים
  choice: ഗൂഢാലോചനക്കാരുടെ കൂട്ടത്തിൽ
  rationale: ബഹുവചനരൂപം ഗൂഢാലോചനയിൽ ഏർപ്പെട്ട വ്യക്തികളുടെ സംഘത്തെ സൂചിപ്പിക്കുന്നു; വെറും ‘ഗൂഢാലോചനയിൽ’ എന്നതിനെക്കാൾ ഈ വ്യക്തിനിർദേശം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: עִם
  choice: അബ്ശാലോമിനോടൊപ്പം
  rationale: അബ്ശാലോമുമായുള്ള കൂട്ടുകെട്ടും പക്ഷചേരലും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: סַכֶּל
  choice: ഭോഷത്തമാക്കണമേ
  rationale: പീയേൽ ആജ്ഞാരൂപം ആലോചനയെ ഭോഷമായതോ ഫലശൂന്യമായതോ ആക്കണമെന്ന അപേക്ഷയാണ്. ‘പരാജയപ്പെടുത്തണമേ’ എന്ന ഫലകേന്ദ്രിത വ്യാഖ്യാനത്തേക്കാൾ മൂലത്തിലെ ഭോഷത്വസങ്കേതം നിലനിർത്തുന്നു.
- source_word: נָא
  choice: -ണമേ
  rationale: അപേക്ഷയുടെയും പ്രാർഥനയുടെയും വിനയഭാവം മലയാളത്തിലെ അഭ്യർഥനാപ്രത്യയം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: עֲצַת
  choice: ആലോചന
  rationale: രാഷ്ട്രീയ-തന്ത്രപരമായ ഉപദേശം എന്ന ആശയം മലയാളത്തിൽ ഗൗരവത്തോടെ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവേ
  rationale: ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിലും സംബോധനരൂപത്തിലും നൽകുന്നു.
theological_decisions:
- issue: നേരിട്ടുള്ള സംബോധനയിൽ יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവേ
  alternative: കർത്താവേ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുർവർണനാമം ഉള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ദൈവനാമം നിലനിർത്തുന്നു.
- issue: സַכֶּל എന്ന അപേക്ഷയുടെ അർഥവ്യാപ്തി
  choice: ആലോചനയെ ഭോഷത്തമാക്കണമേ
  alternative: ആലോചന പരാജയപ്പെടുത്തണമേ
  rationale: മൂലത്തിലെ ‘ഭോഷമാക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; അതിന്റെ പ്രായോഗിക ഫലം ആലോചനയെ വിഫലമാക്കുക എന്നാകാമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ മാത്രം നിർണ്ണയിച്ച് പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ദാവീദിനോട് വിവരം പറഞ്ഞ വ്യക്തിയെ മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ കർത്താവിനെ ചേർത്തിട്ടില്ല. പ്രാർഥനയിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ സംബോധന നിലനിർത്തി; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തി.
