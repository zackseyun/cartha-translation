  text: וְ/כָל הָ/אָ֗רֶץ בּוֹכִים֙ ק֣וֹל גָּד֔וֹל וְ/כָל הָ/עָ֖ם עֹֽבְרִ֑ים וְ/הַ/מֶּ֗לֶךְ עֹבֵר֙ בְּ/נַ֣חַל קִדְר֔וֹן וְ/כָל הָ/עָם֙ עֹבְרִ֔ים עַל פְּנֵי דֶ֖רֶךְ אֶת הַ/מִּדְבָּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/023.yaml
  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
translation:
  language: ml
  text: ദേശമാകെ ഉച്ചത്തിൽ കരഞ്ഞുകൊണ്ടിരുന്നു; എല്ലാ ജനവും കടന്നുപോകുകയായിരുന്നു. രാജാവും കിദ്രോൻ താഴ്വരയിലൂടെ[a] കടന്നുപോയി; എല്ലാ ജനവും മരുഭൂമിയിലേക്കുള്ള വഴിയിലൂടെ[b] കടന്നുപോകുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘കിദ്രോൻ താഴ്വര’: എബ്രായപദം ഒരു വാടി, മലയിടുക്ക്, അല്ലെങ്കിൽ കാലിക നീരൊഴുക്ക് എന്നും അർഥമാക്കാം; പരമ്പരാഗതമായി ‘കിദ്രോൻ തോട്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: cultural_note
  - marker: b
    text: എബ്രായപ്രയോഗം സങ്കുചിതമാണ്; ‘മരുഭൂമിയുടെ വഴിയിലൂടെ’ അല്ലെങ്കിൽ ‘മരുഭൂമിയിലേക്കുള്ള വഴിയുടെ ദിശയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָאָרֶץ
  choice: ദേശമെല്ലാം
  rationale: ഇവിടെ אָרֶץ ഭൂമി മുഴുവനെയല്ല, ആ ദേശത്തെയും അവിടത്തെ ജനങ്ങളെയും കൂട്ടായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘ദേശമെല്ലാം’ എബ്രായ രൂപകം നിലനിർത്തുന്നു.
- source_word: בּוֹכִים קוֹל גָּדוֹל
  choice: ഉച്ചത്തിൽ കരഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അക്ഷരാർഥത്തിലെ ‘വലിയ ശബ്ദത്തോടെ കരയുക’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വിലാപത്തിന്റെ കേൾക്കാവുന്ന തീവ്രതയും നിലനിർത്തുന്നു.
- source_word: כָל הָעָם
  choice: ജനമെല്ലാം
  rationale: עָם ഇവിടെ സൈനികരെ മാത്രം അല്ല, ദാവീദിനോടൊപ്പം പോയ മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: עֹבְרִים / עֹבֵר
  choice: അക്കരെ കടന്നുകൊണ്ടിരുന്നു / കടന്നു
  rationale: עבר ഇവിടെ അതിർത്തിയോ താഴ്വരയോ കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ജനത്തിന്റെ നീണ്ടുനിൽക്കുന്ന നീക്കത്തിന് പുരോഗമനരൂപവും രാജാവിന്റെ പ്രത്യേക പ്രവൃത്തിക്ക് സമാപ്തരൂപവും ഉപയോഗിച്ചു.
- source_word: בְּנַחַל קִדְרוֹן
  choice: കിദ്രോൻ താഴ്വര
  rationale: נחל ഒരു വാടി, മലയിടുക്ക്, കാലിക നീരൊഴുക്ക്, അല്ലെങ്കിൽ അതു കടന്നുപോകുന്ന താഴ്വര എന്നിവയെ സൂചിപ്പിക്കാം. ‘താഴ്വര’ ആധുനിക വായനക്കാർക്ക് ഭൂപ്രകൃതി വ്യക്തമായി നൽകുന്നു; പദത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  choice: മരുഭൂമിയിലേക്കുള്ള വഴിയിലൂടെ
  rationale: എബ്രായ പ്രയോഗം സങ്കുചിതവും വ്യാകരണപരമായി അല്പം ദുർഗ്രഹവുമാണ്. മരുഭൂമിയിലേക്കു നയിക്കുന്ന പാതയിലൂടെയുള്ള നീക്കം എന്ന സാധ്യതയേറിയ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
