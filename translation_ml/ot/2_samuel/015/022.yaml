  text: Then David said to Ittai, “Go on and cross over.” So Ittai the Gittite crossed over, along with all his men and all the little ones who were with him.
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് ഇത്തായിയോടു പറഞ്ഞു: “പോയി കടക്കുക.” അങ്ങനെ ഗിത്യനായ ഇത്തായിയും അവന്റെ എല്ലാ ആളുകളും അവനോടുകൂടെ ഉണ്ടായിരുന്ന എല്ലാ കുട്ടികളും കടന്നുപോയി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וַעֲבֹר
  choice: മുന്നോട്ടു പോയി കടന്നുകൊള്ളുക
  rationale: ഇരട്ട കല്പനയുടെ ചലനാത്മക ഊന്നൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യാത്ര തുടരാനും നിർദ്ദിഷ്ട സ്ഥലം കടക്കാനുമുള്ള ആജ്ഞയാണ്.
- source_word: הַגִּתִּי
  choice: ഗിത്യനായ
  rationale: ഗത്ത് സ്വദേശിയെയോ ഗത്തുമായി ബന്ധപ്പെട്ടയാളെയോ സൂചിപ്പിക്കുന്ന ജനനാമം സ്വാഭാവികമായ മലയാള ബൈബിൾരീതിയിൽ നൽകുന്നു.
- source_word: אֲנָשָׁיו
  choice: അവന്റെ എല്ലാ ആളുകളും
  rationale: സൈനിക അനുചരന്മാർ എന്ന സാധ്യതയുണ്ടെങ്കിലും ഹീബ്രു പദത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തി അനാവശ്യമായി ‘പടയാളികൾ’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: הַטַּף
  choice: എല്ലാ കുഞ്ഞുങ്ങളും
  rationale: പദം ആശ്രിതരായ ചെറുപ്പക്കാരെ, പ്രത്യേകിച്ച് കുട്ടികളെ, സൂചിപ്പിക്കുന്നു; ഇംഗ്ലീഷ് പരിശോധനാപാളിയോടും സന്ദർഭത്തോടും യോജിക്കുന്ന ലളിതമായ രൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ ആവർത്തിച്ച ‘കടക്കുക’ എന്ന ക്രിയയും ഇത്തായിയുടെ കൂട്ടത്തിലെ കുട്ടികളെ പ്രത്യേകം പറയുന്നതും നിലനിർത്തിയിരിക്കുന്നു.
