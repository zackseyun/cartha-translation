  terminology: «ഇത്തായി», «ഗിത്യനായ», «ആളുകൾ», «കുട്ടികൾ» എന്നിവ സ്വാഭാവികവും സന്ദർഭത്തിനനുയോജ്യവുമാണ്. אֲנָשָׁיו എന്ന പദത്തെ ‘പടയാളികൾ’ എന്നു പരിമിതപ്പെടുത്താതെ ‘ആളുകൾ’ എന്നു നൽകുന്നത് ഉചിതമാണ്.
