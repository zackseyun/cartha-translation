source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אַבְשָׁלוֹם֙ מְרַגְּלִ֔ים בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כְּ/שָׁמְעֲ/כֶם֙ אֶת ק֣וֹל הַ/שֹּׁפָ֔ר וַ/אֲמַרְתֶּ֕ם מָלַ֥ךְ אַבְשָׁל֖וֹם בְּ/חֶבְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/010.yaml
  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്ശാലോം ഇസ്രായേലിലെ സകല ഗോത്രങ്ങളിലേക്കും ചാരന്മാരെ അയച്ചുകൊണ്ട് പറഞ്ഞു: “നിങ്ങൾ കാഹളനാദം കേൾക്കുമ്പോൾ, ‘അബ്ശാലോം ഹെബ്രോനിൽ രാജാവായിരിക്കുന്നു’ എന്നു പറയണം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרַגְּלִים
  choice: ചാരന്മാർ
  rationale: രഹസ്യമായി സന്ദേശം എത്തിക്കുകയും രാഷ്ട്രീയ നീക്കം നടപ്പാക്കുകയും ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മൂലപദത്തോട് അടുത്തതുമായ പ്രയോഗം.
- source_word: כְּשָׁמְעֲכֶם
  choice: നിങ്ങൾ ... കേൾക്കുമ്പോൾ
  rationale: כְּ എന്ന കാലസൂചനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘കേട്ടയുടൻ’ എന്ന കൂടുതൽ ശക്തമായ തൽക്ഷണാർഥം മൂലത്തിൽ നിർബന്ധിതമല്ല.
- source_word: קוֹל הַשֹּׁפָר
  choice: കാഹളനാദം
  rationale: שׁוֹפָר എന്നത് മൃഗക്കൊമ്പിൽനിന്നുള്ള കാഹളമാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ സിഗ്നൽ നൽകുന്ന വാദ്യത്തിന്റെ നാദം എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: מָלַךְ
  choice: രാജാവായിരിക്കുന്നു
  rationale: പൂർണ്ണക്രിയയുടെ പ്രഖ്യാപനസ്വഭാവം നിലനിർത്തുന്നു; ‘ഭരിക്കുന്നു’ എന്നതിനെക്കാൾ രാജത്വം ഏറ്റെടുത്തുവെന്ന അവകാശവാദം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּחֶבְרוֹן
  choice: ഹെബ്രോനിൽ
  rationale: സ്ഥലനാമവും בְּ എന്ന സ്ഥലസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: മָלַךְ എന്ന പ്രഖ്യാപനത്തിന്റെ സ്വഭാവം
  choice: ‘അബ്ശാലോം ഹെബ്രോനിൽ രാജാവായിരിക്കുന്നു’
  alternative: ‘അബ്ശാലോം ഹെബ്രോനിൽ വാഴുന്നു’
  rationale: ഇത് അബ്ശാലോമിന്റെ ഗൂഢാലോചനയിൽ പ്രചരിപ്പിക്കേണ്ട രാജത്വപ്രഖ്യാപനമാണ്. നിയമാനുസൃതത അംഗീകരിക്കാതെ, പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കം മാത്രം വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഉദ്ധരണിക്കുള്ളിലെ നിർദ്ദേശഭാവം ‘പറയണം’ വഴി സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; മൂലത്തിലെ ആവർത്തനാത്മകമായ ‘പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ ഒഴിവാക്കി വാക്യഘടന മലയാളത്തിന് യോജിച്ചാക്കി.
