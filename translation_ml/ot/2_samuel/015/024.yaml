  text: וְ/הִנֵּ֨ה גַם צָד֜וֹק וְ/כָֽל הַ/לְוִיִּ֣ם אִתּ֗/וֹ נֹֽשְׂאִים֙ אֶת אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים וַ/יַּצִּ֨קוּ֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים וַ/יַּ֖עַל אֶבְיָתָ֑ר עַד תֹּ֥ם כָּל הָ/עָ֖ם לַ/עֲב֥וֹר מִן הָ/עִֽיר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
translation:
  language: ml
  text: ഇതാ, സാദോക്കും അവനോടുകൂടെ എല്ലാ ലേവ്യരും ദൈവത്തിന്റെ ഉടമ്പടിയുടെ പെട്ടകം ചുമന്നുകൊണ്ട് വന്നു. അവർ ദൈവത്തിന്റെ പെട്ടകം ഇറക്കിവെച്ചു[b], അബ്യാഥാർ കയറിപ്പോയി[c], നഗരത്തിൽനിന്ന് ജനമെല്ലാം കടന്നുപോകുന്നതുവരെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നഗരം’ എന്നു പറയുന്നത് യെരൂശലേമിനെയാണ്.
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘അവർ ദൈവത്തിന്റെ പെട്ടകം അവിടെ സ്ഥാപിച്ചു.’ ഹീബ്രു ക്രിയയ്ക്ക് താഴെ വെക്കുക, ഒരു സ്ഥലത്ത് സ്ഥാപിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അബ്യാഥാർ മുകളിലേക്കു വന്നു.’ ഹീബ്രുവിൽ അക്ഷരാർഥം ‘കയറിപ്പോയി’ എന്നാണ്; വിവരണത്തിലെ കൃത്യമായ സൂക്ഷ്മഭാവം വ്യക്തമല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: രംഗത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരസൂചകത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: גַם צָדוֹק
  choice: സാദോക്കും
  rationale: גַם എന്ന ചേർക്കൽഭാവം ‘-ഉം’ മുഖേന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָל הַלְוִיִּם אִתּוֹ
  choice: അവനോടുകൂടെ എല്ലാ ലേവ്യരും
  rationale: ‘അവൻ’ എന്നത് സന്ദർഭത്തിൽ സാദോക്കിനെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: נֹשְׂאִים
  choice: ചുമന്നുകൊണ്ട്
  rationale: പങ്കാളിത്തരൂപത്തിന്റെ തുടർച്ചയായ പ്രവൃത്തിഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ഉടമ്പടിപ്പെട്ടകം
  rationale: മുഴുവൻ construct chain ചുരുക്കമില്ലാതെ, മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ പദപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: וַיַּצִּקוּ
  choice: അവർ ... താഴെ വെച്ചു
  rationale: ഈ അപൂർവ ക്രിയയ്ക്ക് സന്ദർഭത്തിൽ പെട്ടകം ഇറക്കിവയ്ക്കുക/സ്ഥാനപ്പെടുത്തുക എന്ന അർഥമാണ് യോജിച്ചത്; അർഥപരിധി കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
- source_word: וַיַּעַל אֶבְיָתָר
  choice: അബ്യാഥാർ കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ മേലോട്ടുള്ള ചലനഭാവം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- source_word: עַד תֹּם כָּל הָעָם לַעֲבוֹר
  choice: ജനമെല്ലാം കടന്നുപോകുന്നതുവരെ
  rationale: പ്രവൃത്തി പൂർത്തിയാകുന്നതുവരെയുള്ള കാലപരിധി ലളിതവും കൃത്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִן הָעִיר
  choice: നഗരത്തിൽനിന്ന്
  rationale: മൂലത്തിലെ പൊതുവായ ‘നഗരം’ നിലനിർത്തുന്നു; യെരൂശലേം എന്ന സന്ദർഭപരമായ തിരിച്ചറിയൽ കുറിപ്പിലാക്കുന്നു.
theological_decisions:
- issue: ‘നഗരം’ എന്നതിന്റെ സൂചിതസ്ഥലം
  choice: പ്രധാനവാചകത്തിൽ ‘നഗരം’ എന്നു തന്നേ നിലനിർത്തി
  alternative: ‘യെരൂശലേമിൽനിന്ന്’
  rationale: ഹീബ്രു വാചകം നഗരത്തെ പേരെടുത്തുപറയുന്നില്ല; സന്ദർഭത്തിലെ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നത് മൂലവും വ്യാഖ്യാനവും വേർതിരിക്കുന്നു.
- issue: וַיַּעַל אֶבְיָתָר എന്നതിന്റെ സൂക്ഷ്മഭാവം
  choice: ‘അബ്യാഥാർ കയറിച്ചെന്നു’
  alternative: ‘അബ്യാഥാർ മുകളിലേക്കു വന്നു’; ‘അബ്യാഥാർ ബലി അർപ്പിച്ചു’
  rationale: עלהയുടെ അടിസ്ഥാന ചലനാർഥം നിലനിർത്തുകയും പുരോഹിതപ്രവർത്തനത്തെ പാഠത്തിൽ അനുമാനിച്ച് ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: അവസാന കാലവാക്യത്തിന്റെ കർത്തൃബന്ധം
  choice: ‘അവർ അവിടെ നിന്നു’ എന്നു വ്യക്തമാക്കി
  alternative: അബ്യാഥാർ കയറിച്ചെന്നു ... ജനമെല്ലാം കടന്നുപോകുന്നതുവരെ
  rationale: ഹീബ്രു പാഠത്തിൽ ഈ വ്യക്തമാക്കൽ നേരിട്ട് ഇല്ല; അതിനാൽ പ്രധാനവാചകത്തിൽ ചേർക്കാതിരിക്കുന്നതാണ് കൂടുതൽ ഔപചാരികമായി വിശ്വസ്തം. പ്രസിദ്ധീകരണ കരടിൽ വായനാസൗകര്യത്തിനായി നൽകിയിട്ടുണ്ടെങ്കിലും ഇത് ഉറവിടാധിഷ്ഠിതമായി ഒഴിവാക്കേണ്ട അധികവിവരമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’ ശ്രദ്ധാകർഷക discourse marker ആയി ഉപയോഗിച്ചു. കുറിപ്പുകളുടെ അടയാളങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തു. എന്നാൽ അവസാനത്തെ ‘അവർ അവിടെ നിന്നു’ എന്ന വാചകം ഹീബ്രുവിൽ ഇല്ലാത്ത വ്യക്തീകരണമാകുന്നതിനാൽ അന്തിമ പരിശോധനയിൽ നീക്കുന്നത് ഉചിതമാണ്.
