  text: וַ/יִּשְׁלַ֣ח אַ֠בְשָׁלוֹם אֶת אֲחִיתֹ֨פֶל הַ/גִּֽילֹנִ֜י יוֹעֵ֣ץ דָּוִ֗ד מֵֽ/עִיר/וֹ֙ מִ/גִּלֹ֔ה בְּ/זָבְח֖/וֹ אֶת הַ/זְּבָחִ֑ים וַ/יְהִ֤י הַ/קֶּ֨שֶׁר֙ אַמִּ֔ץ וְ/הָ/עָ֛ם הוֹלֵ֥ךְ וָ/רָ֖ב אֶת אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
translation:
  language: ml
  text: യാഗങ്ങൾ അർപ്പിക്കുന്ന സമയത്ത്, അബ്ശാലോം ദാവീദിന്റെ ഉപദേഷ്ടാവായ ഗീലോ സ്വദേശിയായ അഹീഥോഫെലിനെ തന്റെ പട്ടണമായ ഗീലോയിൽനിന്ന് ആളയച്ചു വരുത്തി.[a] ഗൂഢാലോചന ശക്തിപ്പെട്ടു;[b] അബ്ശാലോമിന്റെ പക്ഷത്തുള്ള ജനം പെരുകിക്കൊണ്ടിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അഹീഥോഫെലിനെ അയച്ചു.’ എബ്രായക്രിയയെ അക്ഷരാർഥത്തിൽ അങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഈ സന്ദർഭത്തിൽ അബ്ശാലോം അവനെ കലാപത്തിൽ ചേരാൻ വിളിപ്പിച്ചു എന്നാണ് സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഗൂഢപദ്ധതി ശക്തിപ്പെട്ടു.’
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘അബ്ശാലോമിനോടുകൂടെ ജനം പോയിക്കൊണ്ടും പെരുകിക്കൊണ്ടും ഇരുന്നു’; പിന്തുണ തുടർച്ചയായി വർധിച്ചതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ചു വരുത്തി
  rationale: ഒരു വ്യക്തിയെ നേരിട്ടുള്ള കർമമായി ഉപയോഗിക്കുന്ന ഈ സന്ദർഭത്തിൽ, അഹീഥോഫെലിനെ കലാപത്തിൽ ചേരാൻ വിളിപ്പിച്ചു എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘അയച്ചു’ എന്നതിലൊതുങ്ങുന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: הַגִּלֹנִי
  choice: ഗീലോന്യൻ
  rationale: ഗീലോ സ്വദേശിയെന്ന ജന്മദേശസൂചക വിശേഷണം ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: יוֹעֵץ דָּוִד
  choice: ദാവീദിന്റെ ഉപദേഷ്ടാവ്
  rationale: ദാവീദുമായി ബന്ധപ്പെട്ട ഔദ്യോഗിക ഉപദേശകപദവി വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵעִירוֹ מִגִּלֹה
  choice: അവന്റെ പട്ടണമായ ഗീലോയിൽനിന്ന്
  rationale: ‘അവന്റെ പട്ടണം’ എന്ന പൊതുസൂചനയും ഗീലോ എന്ന സ്ഥലനാമവും സ്വാഭാവികമായ മലയാള അപ്പൊസിഷനിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  choice: യാഗങ്ങൾ അർപ്പിക്കുന്നതിനിടയിൽ
  rationale: പ്രധാന സംഭവത്തോടൊപ്പം നടക്കുന്ന യാഗാർപ്പണത്തെ സ്വാഭാവികമായി അറിയിക്കുകയും, എബ്രായത്തിലെ ഒരേ ധാതുവിന്റെ ആവർത്തനം മലയാളത്തിൽ കൃത്രിമമായി പകർത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַקֶּשֶׁר
  choice: ഗൂഢാലോചന
  rationale: അബ്ശാലോമിന്റെ രഹസ്യവും സംഘടിതവുമായ രാഷ്ട്രീയ കലാപത്തെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: אַמִּץ
  choice: ശക്തിപ്പെട്ടു
  rationale: ഗൂഢാലോചന ക്രമേണ കരുത്താർജിച്ചു എന്ന വികാസാത്മക അർഥം നൽകുന്നു.
- source_word: הוֹלֵךְ וָרָב
  choice: പെരുകിക്കൊണ്ടിരുന്നു
  rationale: തുടർച്ചയായി വർധിച്ചുകൊണ്ടിരുന്ന പിന്തുണയെ മലയാളത്തിൽ സ്വാഭാവികമായ പുരോഗമനരൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: הָעָם ... אֶת אַבְשָׁלוֹם
  choice: അബ്ശാലോമിനോടുകൂടെയുള്ള ജനം
  rationale: אֶת ഇവിടെ കർമചിഹ്നമല്ല, സഹവർത്തിത്വവും പക്ഷചേരലും സൂചിപ്പിക്കുന്നു; എബ്രായത്തോട് അടുത്തുനിൽക്കുമ്പോഴും മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യാഗങ്ങൾ അർപ്പിക്കുന്നവന്റെ തിരിച്ചറിയൽ
  choice: ‘അബ്ശാലോം യാഗങ്ങൾ അർപ്പിക്കുന്നതിനിടയിൽ’ എന്ന ഘടനയിലൂടെ പ്രധാന കർത്താവായ അബ്ശാലോമിനോടു ബന്ധിപ്പിച്ചു.
  alternative: അഹീഥോഫെൽ യാഗങ്ങൾ അർപ്പിച്ചുകൊണ്ടിരിക്കുമ്പോൾ എന്നു വായിക്കുക, അല്ലെങ്കിൽ കർത്താവിനെ പൂർണമായി അനിശ്ചിതമായി വിടുക.
  rationale: എബ്രായത്തിലെ മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം വ്യാകരണപരമായി മുൻപുള്ള പുരുഷന്മാരിൽ ഒരാളെ സൂചിപ്പിക്കാമെങ്കിലും, മുഖ്യവാക്യത്തിന്റെ കർത്താവായ അബ്ശാലോമിലേക്കുള്ള ബന്ധമാണ് ഏറ്റവും സ്വാഭാവികം. മലയാളവാക്യക്രമം ഈ സാധ്യത പിന്തുടരുന്നു; പ്രത്യേക മതപാരമ്പര്യ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഗൂഢാലോചന’, ‘ഉപദേഷ്ടാവ്’, ‘യാഗങ്ങൾ അർപ്പിക്കുക’ തുടങ്ങിയ പദങ്ങൾ രാഷ്ട്രീയവും ആരാധനാപരവുമായ സന്ദർഭങ്ങൾ വ്യക്തമാക്കുന്നു; അനാവശ്യമായ പുരാതനശൈലിയും വിഭാഗീയ പദപ്രയോഗവും ഒഴിവാക്കി.
