- from: അബ്ശാലോം യാഗങ്ങൾ അർപ്പിക്കുന്നതിനിടയിൽ, ദാവീദിന്റെ ഉപദേഷ്ടാവായ ഗീലോന്യൻ അഹീഥോഫെലിനെ അവന്റെ പട്ടണമായ ഗീലോയിൽനിന്ന് ആളയച്ചു വരുത്തി.[a] ഗൂഢാലോചന ശക്തിപ്പെട്ടു;[b] അബ്ശാലോമിനോടുകൂടെയുള്ള ജനം പെരുകിക്കൊണ്ടിരുന്നു.[c]
  to: യാഗങ്ങൾ അർപ്പിക്കുന്ന സമയത്ത്, അബ്ശാലോം ദാവീദിന്റെ ഉപദേഷ്ടാവായ ഗീലോ സ്വദേശിയായ അഹീഥോഫെലിനെ തന്റെ പട്ടണമായ ഗീലോയിൽനിന്ന് ആളയച്ചു വരുത്തി.[a] ഗൂഢാലോചന ശക്തിപ്പെട്ടു;[b] അബ്ശാലോമിന്റെ പക്ഷത്തുള്ള ജനം പെരുകിക്കൊണ്ടിരുന്നു.[c]
