id: 2SA.15.26
reference: 2 Samuel 15:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם֙ כֹּ֣ה יֹאמַ֔ר לֹ֥א חָפַ֖צְתִּי בָּ֑/ךְ הִנְ/נִ֕י יַֽעֲשֶׂה לִּ֕/י כַּ/אֲשֶׁ֥ר ט֖וֹב בְּ/עֵינָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/026.yaml
  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
translation:
  language: ml
  text: എന്നാൽ അവൻ, ‘എനിക്ക് നിന്നിൽ പ്രസാദമില്ല’[a] എന്നു പറഞ്ഞാൽ, ഇതാ, ഞാൻ ഇവിടെ ഉണ്ട്; തന്റെ ദൃഷ്ടിയിൽ നല്ലതെന്നു തോന്നുന്നതുപോലെ അവൻ എന്നോടു ചെയ്യട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ നിന്നിൽ ആനന്ദിക്കുന്നില്ല.’
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘തന്റെ കണ്ണുകളിൽ നല്ലതായിരിക്കുന്നതുപോലെ’; അതായത്, തനിക്കു നല്ലതെന്നോ ശരിയെന്നോ തോന്നുന്നതുപോലെ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... പറഞ്ഞാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രത്യാശയ്ക്കു വിരുദ്ധമായ സാധ്യത അവതരിപ്പിക്കുന്നതിനാൽ, വ്യവസ്ഥയും വൈരുധ്യവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: כֹּה יֹאמַר
  choice: '... എന്നു പറഞ്ഞാൽ'
  rationale: כֹּה ഇവിടെ നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന אמר-യോടൊപ്പമുള്ള പ്രയോഗമാണ്; മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ ഉദ്ധരണിയും ‘എന്നു പറഞ്ഞാൽ’ എന്ന ഘടനയും സ്വാഭാവികമാണ്.
- source_word: לֹא חָפַצְתִּי בָּךְ
  choice: എനിക്ക് നിന്നിൽ പ്രസാദമില്ല
  rationale: חפץ എന്നതിലെ ആനന്ദം, പ്രസാദം, അനുകൂലമായ വിലയിരുത്തൽ എന്നീ ബന്ധപരമായ അർഥങ്ങൾ നിലനിർത്തുന്നു; ‘ആഗ്രഹിക്കുന്നില്ല’ എന്നത് നൽകാവുന്ന അനാവശ്യമായ ശാരീരികമോ കേവലം ഇച്ഛാപരമോ ആയ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ ഇവിടെ ഉണ്ട്
  rationale: സന്നദ്ധതയും കീഴടങ്ങലും സൂചിപ്പിക്കുന്ന സ്വയംസമർപ്പണ സൂത്രവാക്യത്തിന്റെ ദൃശ്യതയും സ്വാഭാവിക മലയാളവും നിലനിർത്തുന്നു.
- source_word: יַעֲשֶׂה לִּי
  choice: അവൻ എന്നോടു ചെയ്യട്ടെ
  rationale: ദൈവത്തിന്റെ നടപടിക്കു സ്വയം ഏൽപ്പിക്കുന്ന അനുവാദാത്മക/ആജ്ഞാർഥക ഭാവം ‘ചെയ്യട്ടെ’ കൃത്യമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  choice: തന്റെ ദൃഷ്ടിയിൽ നല്ലതെന്നു തോന്നുന്നതുപോലെ
  rationale: ‘അവന്റെ കണ്ണുകളിൽ നല്ലത്’ എന്ന എബ്രായ ശൈലിയുടെ ദൃശ്യരൂപം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് ‘അവനു ശരിയെന്നു തോന്നുന്നത്’ എന്ന അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
theological_decisions:
- issue: ഏകവചന മൂന്നാംപുരുഷ സർവനാമത്തിന്റെ സൂചിതൻ
  choice: സന്ദർഭത്തിൽ യഹോവയെ സൂചിപ്പിക്കുന്ന ‘അവൻ/തന്റെ’ എന്ന സർവനാമങ്ങൾ നിലനിർത്തി
  alternative: സർവനാമങ്ങൾക്കു പകരം ‘യഹോവ’ എന്നു വ്യക്തമാക്കുക
  rationale: എബ്രായപാഠം ദൈവനാമം ആവർത്തിക്കാതെ സർവനാമരൂപങ്ങളാണ് ഉപയോഗിക്കുന്നത്. മുൻസന്ദർഭം സൂചിതനെ വ്യക്തമാക്കുന്നതിനാൽ മൂലത്തിലെ പരാമർശരീതി നിലനിർത്തുന്നു.
- issue: דָּוִדിന്റെ നിലപാടിന്റെ സ്വഭാവം
  choice: ‘ഇതാ, ഞാൻ ഇവിടെ ഉണ്ട് ... ചെയ്യട്ടെ’ എന്ന സമർപ്പണഭാവം നിലനിർത്തി
  alternative: ഇത് നിരാശയോ നിർബന്ധിത സമ്മതമോ എന്നു വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക
  rationale: വാക്യം സന്നദ്ധമായ കീഴടങ്ങൽ പ്രകടമാക്കുന്നുവെങ്കിലും അതിന്റെ മാനസികമോ ദൈവശാസ്ത്രപരമോ ആയ മുഴുവൻ സ്വഭാവം വിശദീകരിക്കുന്നില്ല; അതിനാൽ അന്തർലീനമായ സംഘർഷം വ്യാഖ്യാനിച്ച് തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ള ശൈലി. ‘പ്രസാദം’, ‘ദൃഷ്ടി’ എന്നീ പദങ്ങൾ ബൈബിൾഭാഷയുടെ മാന്യത നിലനിർത്തുന്നു; വാക്യഘടന അതിരുകടന്ന പുരാതനഭാവം ഒഴിവാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
