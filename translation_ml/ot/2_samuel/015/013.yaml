  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/מַּגִּ֔יד אֶל דָּוִ֖ד לֵ/אמֹ֑ר הָיָ֛ה לֶב אִ֥ישׁ יִשְׂרָאֵ֖ל אַחֲרֵ֥י אַבְשָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/013.yaml
  text: Then a messenger came to David[a], saying, “The hearts of the men of Israel are with Absalom.”
translation:
  language: ml
  text: 'അപ്പോൾ ഒരു സന്ദേശവാഹകൻ ദാവീദിന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഇസ്രായേലിലെ പുരുഷന്മാരുടെ മനസ്സ് അബ്ശാലോമിന്റെ പക്ഷത്താണ്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “ഇസ്രായേലിലെ പുരുഷന്മാരുടെ ഹൃദയം അബ്ശാലോമിന്റെ പിന്നാലെയായിരിക്കുന്നു.” അവരുടെ കൂറോ പിന്തുണയോ അബ്ശാലോമിലേക്കു മാറിയെന്ന് അർഥമാക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലളിതമായ ഭൂതകാലപ്രവൃത്തിയാണ്; മലയാളത്തിൽ ‘വന്നു’ സ്വാഭാവികമാണ്.
- source_word: הַמַּגִּיד
  choice: ഒരു സന്ദേശവാഹകൻ
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ കർത്തൃവാചക രൂപം വാർത്തയോ വിവരമോ അറിയിക്കുന്നയാളെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘ദൂതൻ’ എന്നതിനെക്കാൾ ‘സന്ദേശവാഹകൻ’ രാഷ്ട്രീയവാർത്ത എത്തിക്കുന്ന വ്യക്തിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന എബ്രായ ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനരീതിയിൽ ‘വന്ന് പറഞ്ഞു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: הָיָה לֶב
  choice: മനസ്സ് ... പക്ഷത്തായിരിക്കുന്നു
  rationale: ‘ഹൃദയം ... പിന്നാലെയായി/ആയിരുന്നു’ എന്ന പദാനുപദ ഘടന ഉള്ളിലെ ചായ്‌വും രാഷ്ട്രീയകൂറും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘മനസ്സ് ... പക്ഷത്തായിരിക്കുന്നു’ എന്നത് ഹൃദയത്തിന്റെ രൂപകം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: ഏകവചനരൂപത്തിലുള്ള אִישׁ ഇവിടെ സമൂഹവാചകമായി പ്രവർത്തിക്കുന്നു; രാഷ്ട്രീയമോ സൈനികമോ ആയ പുരുഷസമൂഹത്തെ സൂചിപ്പിക്കാവുന്ന മൂലപാഠത്തിന്റെ ലിംഗസൂചന ‘ഇസ്രായേൽപുരുഷന്മാർ’ നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי
  choice: പക്ഷത്ത്
  rationale: പദാനുപദമായി ‘പിന്നാലെ’ എന്നാണെങ്കിലും ഈ പ്രയോഗത്തിൽ പിന്തുണയും രാഷ്ട്രീയകൂറുമാണ് ഉദ്ദേശ്യം; ‘പക്ഷത്ത്’ അത് സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മനസ്സ്’ എന്ന പദം മൂലത്തിലെ ‘ഹൃദയം’ എന്ന രൂപകത്തിന്റെ ആശയം നിലനിർത്തുന്നു; ‘പക്ഷത്തായിരിക്കുന്നു’ രാഷ്ട്രീയമായ കൂറ് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
