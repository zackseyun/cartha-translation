  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ הַ/מֶּ֖לֶךְ לֵ֣ךְ בְּ/שָׁל֑וֹם וַ/יָּ֖קָם וַ/יֵּ֥לֶךְ חֶבְרֽוֹנָ/ה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/009.yaml
  text: The king said to him, “Go in peace.” So he arose and went to Hebron.
translation:
  language: ml
  text: 'രാജാവ് അവനോട് പറഞ്ഞു: “സമാധാനത്തോടെ പോകുക.” അങ്ങനെ അവൻ എഴുന്നേറ്റ് ഹെബ്രോനിലേക്കു പോയി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; നേരിട്ടുള്ള സംഭാഷണം അവതരിപ്പിക്കാൻ സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ അറിയപ്പെടുന്ന രാജാവായ ദാവീദിനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ടനാമം; പേര് ചേർത്ത് മൂലപാഠത്തെ അതിവ്യക്തമാക്കാതെ എബ്രായപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לֵךְ
  choice: പോകുക
  rationale: הלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം; മാന്യവും സ്വാഭാവികവുമായ മലയാള തുല്യപ്രയോഗം.
- source_word: בְּשָׁלוֹם
  choice: സമാധാനത്തോടെ
  rationale: യാത്രയയപ്പിനോ അനുഗ്രഹത്തിനോ ഉപയോഗിക്കുന്ന എബ്രായ ശൈലി; അർത്ഥവും പ്രയോഗത്തിന്റെ ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം; തുടർന്നുള്ള ചലനത്തിന് മുമ്പുള്ള പ്രവൃത്തിയായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനക്രിയ; ലളിതവും കൃത്യവുമായ മലയാള തുല്യം.
- source_word: חֶבְרוֹנָה
  choice: ഹെബ്രോനിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ഗതി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ലേക്കു’ എന്ന രൂപം അതു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
