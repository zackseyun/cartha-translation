translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. എബ്രായ ആഖ്യാനത്തിന്റെ ക്രമം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പുരാതനശൈലി ഒഴിവാക്കി.
