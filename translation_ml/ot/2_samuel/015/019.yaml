  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל אִתַּ֣י הַ/גִּתִּ֔י לָ֧/מָּה תֵלֵ֛ךְ גַּם אַתָּ֖ה אִתָּ֑/נוּ שׁ֣וּב וְ/שֵׁ֤ב עִם הַ/מֶּ֨לֶךְ֙ כִּֽי נָכְרִ֣י אַ֔תָּה וְ/גַם גֹּלֶ֥ה אַתָּ֖ה לִ/מְקוֹמֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ഗിത്യനായ ഇത്തായിയോടു പറഞ്ഞു: “നീയും ഞങ്ങളോടൊപ്പം പോകുന്നത് എന്തിന്? മടങ്ങിപ്പോയി രാജാവിനോടൊപ്പം താമസിക്കുക.[a] നീ ഒരു വിദേശിയാണ്; നിന്റെ സ്വന്തം നാട്ടിൽനിന്ന് നാടുകടത്തപ്പെട്ടവനുമാണ്.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രാജാവിനോടൊപ്പം’ എന്നു പറയുന്നത് യെരൂശലേമിൽ നിലവിലുള്ള രാജാധികാരത്തിൻ കീഴിൽ തുടരുക എന്നായിരിക്കാം; എബ്രായപാഠം ഏതു രാജാവാണെന്ന് വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ സ്വന്തം സ്ഥലത്തേക്കു പോകുന്ന ഒരു പ്രവാസി’ എന്നും വായിക്കാം. എബ്രായപ്രയോഗം ചുരുക്കമുള്ളതാണ്; ഇത്തായിയുടെ സ്ഥാനഭ്രഷ്ടാവസ്ഥയെയും സ്വന്തം നാടുമായുള്ള ബന്ധത്തെയും അത് ഊന്നിക്കാട്ടിയേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: അപ്പോൾ രാജാവ് ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ ആഖ്യാനപുരോഗതി സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ കൊണ്ട് സൂചിപ്പിക്കുന്നു; എബ്രായത്തിലെ പദവി നിലനിർത്തുന്നു.
- source_word: אִתַּי הַגִּתִּי
  choice: ഗിത്യനായ ഇത്തായി
  rationale: പേര് ലിപ്യന്തരണം ചെയ്യുകയും ഗത്ത് സ്വദേശിയെന്ന ജനനാമം സ്വാഭാവികമായ മലയാള വിശേഷണരൂപത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: לָמָּה תֵלֵךְ גַּם אַתָּה אִתָּנוּ
  choice: നീയും ഞങ്ങളോടൊപ്പം പോകുന്നത് എന്തിന്?
  rationale: അപൂർണക്രിയയുടെ സന്ദർഭോചിതമായ വർത്തമാന/പുരോഗമന ഭാവവും גַּם എന്നതിന്റെ ‘നീയും’ എന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: שׁוּב וְשֵׁב
  choice: മടങ്ങിപ്പോയി ... താമസിക്കുക
  rationale: രണ്ട് ആജ്ഞാരൂപങ്ങളും നിലനിർത്തി, ישׁב-നെ ഇവിടെ അക്ഷരാർഥമായ ‘ഇരിക്കുക’ എന്നതിനു പകരം സന്ദർഭാനുസൃതമായി ‘താമസിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: עִם הַמֶּלֶךְ
  choice: രാജാവിനോടൊപ്പം
  rationale: എബ്രായത്തിലെ പദപ്രയോഗം അതേപടി സൂക്ഷിച്ച് രാജാവ് ആരെന്നത് പ്രധാനപാഠത്തിൽ നിർണയിക്കുന്നില്ല.
- source_word: נָכְרִי
  choice: ഒരു വിദേശി
  rationale: സ്വദേശിയല്ലാത്ത നിലയെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും നിഷ്പക്ഷവുമായി അറിയിക്കുന്നു.
- source_word: וְגַם גֹּלֶה אַתָּה לִמְקוֹמֶךָ
  choice: നിന്റെ സ്വന്തം നാട്ടിൽനിന്ന് നാടുകടത്തപ്പെട്ടവനുമാണ്
  rationale: ചുരുക്കമുള്ളതും വ്യാഖ്യാനസാധ്യതയുള്ളതുമായ എബ്രായപ്രയോഗത്തിന്റെ സന്ദർഭസാധ്യമായ അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; ‘സ്ഥലം’ ഇവിടെ സ്വന്തം നാട്/ദേശബന്ധം സൂചിപ്പിക്കുന്നു, എന്നാൽ ദിശാസംബന്ധിയായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘രാജാവിനോടൊപ്പം താമസിക്കുക’ എന്നതിലെ രാജാവിന്റെ സൂചിതവ്യക്തി
  choice: പ്രധാനപാഠത്തിൽ ‘രാജാവ്’ എന്ന പദവി മാത്രം നിലനിർത്തുക
  alternative: അബ്ശാലോം രാജാവിനോടൊപ്പം / യെരൂശലേമിലെ രാജാവിനോടൊപ്പം / രാജാവായ എന്നോടൊപ്പം
  rationale: എബ്രായം വ്യക്തിപേര് പറയാതെ പദവി ആവർത്തിക്കുന്നു. സൂചിതവ്യക്തിയെ നിർബന്ധമായി തീരുമാനിക്കാതെ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
- issue: גֹּלֶה ... לִמְקוֹמֶךָ എന്ന ചുരുക്കപ്രയോഗത്തിന്റെ ദിശയും ബന്ധവും
  choice: സ്വന്തം നാട്ടിൽനിന്ന് നാടുകടത്തപ്പെട്ടവൻ
  alternative: സ്വന്തം സ്ഥലത്തേക്കു നാടുകടത്തപ്പെട്ടവൻ / സ്വന്തം സ്ഥലവുമായി ബന്ധമുള്ള പ്രവാസി
  rationale: സന്ദർഭത്തിൽ ഇത്തായിയുടെ വിദേശിയും സ്ഥാനഭ്രഷ്ടനുമായ അവസ്ഥ വ്യക്തമാക്കുന്ന സ്വാഭാവിക വായന പ്രധാനപാഠത്തിൽ സ്വീകരിക്കുന്നു; לְ എന്ന ഉപസർഗത്തിന്റെ അസാധാരണ ദിശാസൂചനയും ചുരുക്കവും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വ്യക്തിപേര്, ജനനാമം, രാജപദവി എന്നിവ സുതാര്യമായി നൽകുന്നു; മൂലപാഠത്തിലെ പ്രധാന അവ്യക്തതകൾ അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിക്കുന്നു.
