  to: 'അപ്പോൾ രാജാവ് ഗിത്യനായ ഇത്തായിയോടു പറഞ്ഞു: “നീയും ഞങ്ങളോടൊപ്പം പോകുന്നത് എന്തിന്? മടങ്ങിപ്പോയി രാജാവിനോടൊപ്പം താമസിക്കുക.[a] നീ ഒരു വിദേശിയാണ്; നിന്റെ സ്വന്തം നാട്ടിൽനിന്ന് നാടുകടത്തപ്പെട്ടവനുമാണ്.[b]”'
