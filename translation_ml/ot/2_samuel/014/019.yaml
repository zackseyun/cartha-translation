  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ הֲ/יַ֥ד יוֹאָ֛ב אִתָּ֖/ךְ בְּ/כָל זֹ֑את וַ/תַּ֣עַן הָ/אִשָּׁ֣ה וַ/תֹּ֡אמֶר חֵֽי נַפְשְׁ/ךָ֩ אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אִם אִ֣שׁ לְ/הֵמִ֣ין וּ/לְ/הַשְׂמִ֗יל מִ/כֹּ֤ל אֲשֶׁר דִּבֶּר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי עַבְדְּ/ךָ֤ יוֹאָב֙ ה֣וּא צִוָּ֔/נִי וְ/ה֗וּא שָׂ֚ם בְּ/פִ֣י שִׁפְחָֽתְ/ךָ֔ אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ചോദിച്ചു: “ഇതിലെല്ലാം യോവാബ് നിനക്കൊപ്പമുണ്ടോ?” സ്ത്രീ മറുപടി പറഞ്ഞു: “എന്റെ പ്രഭുവായ രാജാവേ, അങ്ങയുടെ ജീവനെച്ചൊല്ലി,[a] എന്റെ പ്രഭുവായ രാജാവ് പറഞ്ഞതിൽനിന്ന് വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിയാൻ[b] ആർക്കും കഴിയില്ല. അങ്ങയുടെ ദാസനായ യോവാബ് തന്നെയാണ് എന്നോടു കല്പിച്ചത്; അവൻ തന്നെയാണ് ഈ വാക്കുകളെല്ലാം അങ്ങയുടെ ദാസിയുടെ വായിൽ വെച്ചുകൊടുത്തത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അങ്ങയുടെ പ്രാണൻ ജീവിക്കുന്നതുപോലെ.” ഇത് ഉറപ്പോടെ സത്യം പറയുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു ഹീബ്രു സത്യപ്രതിജ്ഞാസൂത്രമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിയുക” എന്നത് ഇവിടെ രാജാവ് പറഞ്ഞതിൽനിന്ന് വ്യതിചലിക്കുക, അതിനെ എതിർക്കുക, അല്ലെങ്കിൽ ഒഴിഞ്ഞുമാറുക എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: הֲיַד יוֹאָב אִתָּךְ
  choice: യോവാബിനു പങ്കുണ്ടോ?
  rationale: ‘കൈ’ ഇവിടെ പ്രവർത്തനപങ്കാളിത്തത്തെയും പിന്നിലുള്ള സ്വാധീനത്തെയും സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘യോവാബിന്റെ കൈ നിനക്കൊപ്പമുണ്ടോ?’ എന്നത് മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּכָל זֹאת
  choice: ഇതിലെല്ലാം
  rationale: സംഭാഷണത്തിൽ വിവരിച്ച മുഴുവൻ പദ്ധതിയെയും സംഭവത്തെയും ചുരുക്കമായി സൂചിപ്പിക്കുന്നു.
- source_word: חֵי נַפְשְׁךָ
  choice: അങ്ങയുടെ ജീവനെച്ചൊല്ലി
  rationale: ഹീബ്രു സത്യപ്രതിജ്ഞാസൂത്രത്തിന്റെ അർഥവും ഗൗരവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אִם אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  choice: വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിയാൻ ആർക്കും കഴിയില്ല
  rationale: രാജാവിന്റെ വാക്കിൽനിന്ന് വ്യതിചലിക്കാനോ അതിനെ മറികടക്കാനോ കഴിയില്ലെന്ന ഹീബ്രു ദിശാരൂപകം നിലനിർത്തുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ
  rationale: രാജസദസ്സിലെ ആദരസൂചകമായ ബന്ധപ്രയോഗം നൽകുകയും യോവാബിന്റെ പുരുഷലിംഗം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: צִוָּנִי
  choice: എന്നോടു കല്പിച്ചത്
  rationale: യോവാബ് അധികാരത്തോടെ നിർദേശം നൽകിയെന്ന ക്രിയയുടെ ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: שָׂם בְּפִי
  choice: വായിൽ വെച്ചുതന്നത്
  rationale: പറയേണ്ട വാക്കുകൾ കൃത്യമായി നൽകുക എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗം മലയാളത്തിലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שִׁפְחָתְךָ
  choice: അങ്ങയുടെ ദാസി
  rationale: സ്ത്രീയുടെ വിനയപൂർവമായ സ്വയംപരാമർശവും മൂലപദത്തിലെ സ്ത്രീലിംഗവും സംരക്ഷിക്കുന്നു.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകളെല്ലാം
  rationale: യോവാബ് അവൾക്കു പറഞ്ഞുകൊടുത്ത പ്രസംഗത്തെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘കാര്യങ്ങൾ’ എന്നതിനെക്കാൾ ‘വാക്കുകൾ’ കൃത്യമാണ്.
