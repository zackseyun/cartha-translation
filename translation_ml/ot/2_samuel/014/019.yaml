translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ രാജസദസ്സിനു യോജിച്ച ആദരസൂചകമായ ‘അങ്ങ്/യജമാനൻ’ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ദൃശ്യരൂപകങ്ങളിൽ മലയാളത്തിൽ വ്യക്തമായ ‘വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിയുക’, ‘വായിൽ വെക്കുക’ എന്നിവ നിലനിർത്തി; എന്നാൽ ‘യോവാബിന്റെ കൈ’ എന്ന അക്ഷരരൂപം അസ്വാഭാവികമായതിനാൽ അതിന്റെ സന്ദർഭാർഥമായ പങ്കാളിത്തം നേരിട്ട് വിവർത്തനം ചെയ്തു.
