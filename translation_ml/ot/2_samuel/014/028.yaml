translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘രാജാവിന്റെ മുഖം’ എന്ന മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം നിലനിർത്തി അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. שְׁנָתַיִם יָמִים എന്ന കാലപ്രയോഗത്തിന്റെ ഊന്നൽ ‘രണ്ടു വർഷം മുഴുവൻ’ എന്നു നൽകി.
