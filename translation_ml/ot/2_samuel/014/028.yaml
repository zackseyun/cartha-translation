id: 2SA.14.28
reference: 2 Samuel 14:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֧שֶׁב אַבְשָׁל֛וֹם בִּ/ירוּשָׁלִַ֖ם שְׁנָתַ֣יִם יָמִ֑ים וּ/פְנֵ֥י הַ/מֶּ֖לֶךְ לֹ֥א רָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/028.yaml
  text: So Absalom lived in Jerusalem for two years[a], and he did not see the king's face.
translation:
  language: ml
  text: അങ്ങനെ അബ്ശാലോം രണ്ടു വർഷം മുഴുവൻ യെരൂശലേമിൽ താമസിച്ചു; രാജാവിന്റെ മുഖം കണ്ടതുമില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രാജാവിന്റെ മുഖം കണ്ടില്ല’ എന്ന എബ്രായ പ്രയോഗം, രാജാവിനെ നേരിൽ കാണാനോ അദ്ദേഹത്തിന്റെ സന്നിധിയിൽ പ്രവേശിക്കാനോ അബ്ശാലോമിന് അനുമതി ലഭിച്ചില്ല എന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ישׁב എന്ന ക്രിയയ്ക്ക് ‘ഇരിക്കുക, വസിക്കുക, തുടരുക’ എന്നീ അർഥങ്ങളുണ്ട്. ഒരു സ്ഥലത്ത് രണ്ടു വർഷം പാർത്തതിനെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘താമസിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בִּירוּשָׁלִַם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപത്തോടൊപ്പം എബ്രായത്തിലെ സ്ഥാനസൂചക ഉപസർഗത്തിന്റെ അർഥവും നൽകുന്നു.
- source_word: שְׁנָתַיִם יָמִים
  choice: രണ്ടു വർഷം മുഴുവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘രണ്ടു വർഷം, ദിവസങ്ങൾ’ എന്ന ഘടന പൂർണമായ കാലയളവിനെ ഊന്നിപ്പറയുന്ന എബ്രായ പ്രയോഗമാണ്. ‘മുഴുവൻ’ അതിന്റെ പ്രയോഗാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: രാജാവിന്റെ മുഖം കണ്ടതുമില്ല
  rationale: മൂലത്തിലെ ‘രാജാവിന്റെ മുഖം അവൻ കണ്ടില്ല’ എന്ന മൂർത്തമായ പ്രയോഗവും മുൻവാക്യത്തോടുള്ള וּ എന്ന ബന്ധവും നിലനിർത്തുന്നു. ഇവിടെ ‘മുഖം കാണുക’ എന്നത് രാജാവിന്റെ സന്നിധിയിൽ പ്രവേശനം ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
