source:
  edition: WLC
  text: וַ/יִּפֹּל֩ יוֹאָ֨ב אֶל פָּנָ֥י/ו אַ֛רְצָ/ה וַ/יִּשְׁתַּ֖חוּ וַ/יְבָ֣רֶךְ אֶת הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר יוֹאָ֡ב הַ/יּוֹם֩ יָדַ֨ע עַבְדְּ/ךָ֜ כִּי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֲשֶׁר עָשָׂ֥ה הַ/מֶּ֖לֶךְ אֶת דְּבַ֥ר עבד/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
translation:
  language: ml
  text: 'അപ്പോൾ യോവാബ് മുഖം നിലത്തോടു ചേർത്ത് വീണു വണങ്ങി രാജാവിനെ ആശീർവദിച്ചു. യോവാബ് പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവേ, രാജാവ് തന്റെ ദാസന്റെ വാക്ക് നടപ്പാക്കിയതിനാൽ[a] അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു കൃപ ലഭിച്ചിരിക്കുന്നുവെന്ന് അങ്ങയുടെ ദാസൻ ഇന്ന് അറിയുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “തന്റെ ദാസന്റെ വാക്ക് ചെയ്തതിനാൽ.”'
    reason: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം രേഖപ്പെടുത്തുകയും മുഖ്യപാഠത്തിൽ അതിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: മുഖം നിലത്തോടു ചേർത്ത് വീണു
  rationale: നിലത്തേക്കു മുഖം കുനിച്ച് വീഴുന്ന ശാരീരിക നിലപാട് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁתַּחוּ
  choice: വണങ്ങി
  rationale: മനുഷ്യനായ രാജാവിനോടുള്ള രാജസഭാപരമായ ആദരവാണ് സന്ദർഭം; ദൈവാരാധനയെ സൂചിപ്പിക്കാതെ കുമ്പിടൽ/പ്രണാമം എന്ന അർഥം നൽകുന്നു.
- source_word: וַיְבָרֶךְ אֶת־הַמֶּלֶךְ
  choice: രാജാവിനെ ആശീർവദിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ‘നന്ദി പറഞ്ഞു’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: יָדַע עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ ഇന്ന് അറിയുന്നു
  rationale: സംഭവത്തിലൂടെ ഇപ്പോൾ ഉറപ്പായ അറിവ് ലഭിച്ചെന്ന പൂർണക്രിയയുടെ സന്ദർഭാർഥം വർത്തമാനരൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജാവിനോടുള്ള വിനയപൂർവമായ സ്വയംപരാമർശമാണ്; അടിമത്തത്തെ അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു കൃപ ലഭിച്ചിരിക്കുന്നു
  rationale: ‘കണ്ണുകളിൽ കൃപ കണ്ടെത്തുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവവും അംഗീകാരം ലഭിക്കുക എന്ന അർഥവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവേ
  rationale: രാജസഭയിലെ ആദരപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֲשֶׁר
  choice: …തിനാൽ
  rationale: താൻ രാജാവിന്റെ കൃപ നേടിയെന്ന് യോവാബ് അറിയുന്നതിനുള്ള കാരണം ഈ ഉപവാക്യം വിശദീകരിക്കുന്നതിനാൽ കാരണാർഥം നൽകുന്നു.
- source_word: עָשָׂה ... אֶת־דְּבַר עַבְדּוֹ
  choice: തന്റെ ദാസന്റെ വാക്കനുസരിച്ചു
  rationale: അക്ഷരാർഥമായ ‘ദാസന്റെ വാക്ക് ചെയ്തു’ എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അപേക്ഷ അനുവദിച്ചു എന്ന ആശയം അതിലധികം വിശദീകരിക്കാതെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യനായ രാജാവിനോടുള്ള വിനയപ്രകടനത്തിന്റെ വിവർത്തനം
  choice: ‘വണങ്ങി’, ‘എന്റെ യജമാനനായ രാജാവേ’ എന്നീ രാജസഭാപരമായ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു
  alternative: ‘ആരാധിച്ചു’ അല്ലെങ്കിൽ ദൈവാരാധനയെ സൂചിപ്പിക്കുന്ന പദപ്രയോഗം
  rationale: ഇവിടെ വിവരിക്കുന്നത് മനുഷ്യനായ രാജാവിനോടുള്ള ആദരവും കീഴ്വണക്കവുമാണ്; ദൈവാരാധനയെന്ന അവകാശവാദം പാഠത്തിൽ ചേർക്കരുത്.
- issue: രാജാവിനെ ‘ആശീർവദിച്ചു’ എന്ന പ്രയോഗം
  choice: എബ്രായത്തിലെ ברך എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി
  alternative: ‘രാജാവിനോടു നന്ദി പറഞ്ഞു’
  rationale: സന്ദർഭത്തിൽ നന്ദിയും ആദരവും ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും, മൂലപാഠം ഉപയോഗിക്കുന്ന ആശീർവാദഭാഷയെ വ്യാഖ്യാനിച്ച് മാറ്റാതിരിക്കാൻ നേരിട്ടുള്ള പദം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. രാജസഭാപരമായ വിനയഭാഷയ്ക്കായി ‘അങ്ങ്’, ‘ദാസൻ’, ‘യജമാനനായ രാജാവ്’ എന്നിവ ഉപയോഗിച്ചു; ഭാഷയെ അതിപുരാതനമാക്കുകയോ ദൈവാരാധനയുടെ ഭാവം ചേർക്കുകയോ ചെയ്തിട്ടില്ല.
