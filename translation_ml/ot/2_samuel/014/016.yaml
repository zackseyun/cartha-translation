  text: כִּ֚י יִשְׁמַ֣ע הַ/מֶּ֔לֶךְ לְ/הַצִּ֥יל אֶת אֲמָת֖/וֹ מִ/כַּ֣ף הָ/אִ֑ישׁ לְ/הַשְׁמִ֨יד אֹתִ֤/י וְ/אֶת בְּנִ/י֙ יַ֔חַד מִֽ/נַּחֲלַ֖ת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
translation:
  language: ml
  text: കാരണം, എന്നെയും എന്റെ മകനെയും ഒരുമിച്ച് ദൈവത്തിന്റെ അവകാശത്തിൽനിന്ന്[b] ഇല്ലാതാക്കാൻ നോക്കുന്ന ആ മനുഷ്യന്റെ കൈയിൽനിന്ന് തന്റെ ദാസിയെ[a] വിടുവിക്കാൻ രാജാവ് കേൾക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദാസി” എന്ന എബ്രായപദം വ്യക്തമായി സ്ത്രീലിംഗമാണ്; സംസാരിക്കുന്ന സ്ത്രീ രാജാവിനോടു തന്നെ വിനയപൂർവം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ദൈവത്തിന്റെ അവകാശം” എന്നത് ദൈവം ഇസ്രായേലിൽ നൽകിയ അവകാശഭാഗത്തെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ ദൈവത്തിന്റേതായ അവകാശം എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് സ്ത്രീ നൽകുന്ന വിശദീകരണമോ ആത്മവിശ്വാസത്തിന്റെ അടിസ്ഥാനമോ ഇതിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: יִשְׁמַע
  choice: എന്റെ അപേക്ഷ കേൾക്കും
  rationale: שׁמע എന്നതിന് കേൾക്കുക, ശ്രദ്ധിക്കുക, അനുസരിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. സന്ദർഭത്തിൽ പ്രതികരണമുള്ള കേൾവിയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ കർമം വ്യക്തമാക്കുന്നത് സ്വാഭാവികത നൽകുന്നു.
- source_word: לְהַצִּיל
  choice: വിടുവിക്കാൻ
  rationale: נצל എന്ന ഹിഫീൽ രൂപം അപകടത്തിലോ അധികാരത്തിലോ നിന്ന് രക്ഷിച്ചെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; 'വിടുവിക്കുക' അതിന്റെ ഗൗരവവും ദിശയും നിലനിർത്തുന്നു.
- source_word: אֲמָתוֹ
  choice: തന്റെ ദാസിയെ
  rationale: എബ്രായ നാമം വ്യക്തമായി സ്ത്രീലിംഗമാണ്; രാജാവിനോടുള്ള വിനയപൂർവമായ സ്വയംപരാമർശം മലയാളത്തിലും സ്ത്രീലിംഗത്തോടെ സംരക്ഷിക്കുന്നു.
- source_word: מִכַּף הָאִישׁ
  choice: ആ മനുഷ്യന്റെ കൈയിൽനിന്ന്
  rationale: '''കൈ'' അധികാരത്തെയോ പിടിയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; മൂലരൂപവും അർഥവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.'
- source_word: לְהַשְׁמִיד
  choice: ഇല്ലാതാക്കാൻ നോക്കുന്ന
  rationale: ഇൻഫിനിറ്റീവ് ആ മനുഷ്യന്റെ നശീകരണലക്ഷ്യം സൂചിപ്പിക്കുന്നു. 'നോക്കുന്ന' ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; 'ഇല്ലാതാക്കുക' കുടുംബരേഖ മായ്ച്ചുകളയുന്ന സന്ദർഭത്തോട് യോജിക്കുന്നു.
- source_word: יַחַד
  choice: ഒരുമിച്ച്
  rationale: അമ്മയും മകനും ഒരേ നശീകരണത്തിന് ഇരകളാകുമെന്ന ഊന്നൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: מִנַּחֲלַת אֱלֹהִים
  choice: ദൈവത്തിന്റെ അവകാശത്തിൽനിന്ന്
  rationale: ദൈവം നൽകിയ അവകാശഭാഗമെന്നോ ദൈവത്തിന്റേതായ അവകാശമെന്നോ വായിക്കാവുന്ന ഘടനയെ ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: “ദൈവത്തിന്റെ അവകാശം” എന്നതിന്റെ അർഥം
  choice: ദൈവം ഇസ്രായേലിൽ നൽകിയ അവകാശഭാഗത്തെ സൂചിപ്പിക്കാവുന്ന വിധത്തിൽ മൂലപദപ്രയോഗം നിലനിർത്തി.
  alternative: ദൈവത്തിന്റെ സ്വന്തം ജനമോ സ്വന്തമായ അവകാശമോ; അല്ലെങ്കിൽ ദൈവിക ക്രമത്തിലുള്ള കുടുംബസ്വത്ത്.
  rationale: സന്ദർഭം കുടുംബവംശം ഇല്ലാതാകുന്നതും ഇസ്രായേലിലെ അവകാശസ്ഥാനം നഷ്ടപ്പെടുന്നതുമാണ്; എന്നാൽ എബ്രായ ഘടന ആരുടെ അവകാശം എന്നത് പൂർണമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ രാജസഭാ ഭാഷ ഉപയോഗിച്ചു. മൂലത്തിലെ വിശദീകരണബന്ധം, സ്ത്രീലിംഗ സ്വയംപരാമർശം, ‘കൈ’ എന്ന അധികാരരൂപകം, ‘ദൈവത്തിന്റെ അവകാശം’ എന്നതിലെ യഥാർഥ അർഥവൈവിധ്യം എന്നിവ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
