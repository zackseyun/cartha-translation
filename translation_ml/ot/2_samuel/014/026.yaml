  edition: WLC
  text: וּֽ/בְ/גַלְּח/וֹ֮ אֶת רֹאשׁ/וֹ֒ וְֽ֠/הָיָה מִ/קֵּ֨ץ יָמִ֤ים לַ/יָּמִים֙ אֲשֶׁ֣ר יְגַלֵּ֔חַ כִּֽי כָבֵ֥ד עָלָ֖י/ו וְ/גִלְּח֑/וֹ וְ/שָׁקַל֙ אֶת שְׂעַ֣ר רֹאשׁ֔/וֹ מָאתַ֥יִם שְׁקָלִ֖ים בְּ/אֶ֥בֶן הַ/מֶּֽלֶךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
translation:
  language: ml
  text: അവൻ തലമുടി മുറിക്കുമ്പോഴൊക്കെയും—ഓരോ വർഷാവസാനത്തിലും അതു തനിക്കു ഭാരമായിരുന്നതിനാൽ അവൻ അതു മുറിക്കുമായിരുന്നു—അവൻ തന്റെ തലമുടി തൂക്കുമായിരുന്നു; രാജാവിന്റെ തൂക്കക്കല്ലിന്റെ മാനദണ്ഡപ്രകാരം അതിന്റെ തൂക്കം ഇരുനൂറ് ശേക്കേൽ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രാജാവിന്റെ തൂക്കക്കല്ല്’ എന്നത് രാജകീയമായി അംഗീകരിച്ചിരുന്ന തൂക്കമാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת־רֹאשׁוֹ
  choice: അവൻ തലമുടി മുറിക്കുമ്പോഴൊക്കെയും
  rationale: കാലസാഹചര്യം സൂചിപ്പിക്കുന്ന infinitive construct-ഉം സന്ദർഭത്തിലെ ആവർത്തനഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. גלח ഇവിടെ പൂർണമായി ക്ഷൗരം ചെയ്യുക എന്നതിനേക്കാൾ ഇടയ്ക്കിടെ മുടി മുറിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മുറിക്കുക’ തെരഞ്ഞെടുത്തു.
- source_word: וְהָיָה מִקֵּץ יָמִים לַיָּמִים אֲשֶׁר יְגַלֵּחַ
  choice: വർഷാവസാനത്തിൽ അവൻ അതു മുറിക്കുമായിരുന്നു
  rationale: ഹീബ്രായ പ്രയോഗം പതിവായ വാർഷിക ഇടവേളയെ സൂചിപ്പിക്കുന്നു; customary imperfect-ന്റെ ആവർത്തനസ്വഭാവം ‘മുറിക്കുമായിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: כִּי־כָבֵד עָלָיו
  choice: തലമുടി തനിക്കു ഭാരമായിരുന്നതിനാൽ
  rationale: כבד על എന്നതിലെ ഭാരത്തിന്റെ ദൃശ്യബിംബം നിലനിർത്തുകയും സർവനാമത്തിന്റെ സൂചന വ്യക്തമായി തലമുടിയിലേക്കു ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְגִלְּחוֹ וְשָׁקַל אֶת־שְׂעַר רֹאשׁוֹ
  choice: മുറിച്ച തലമുടി … ഉണ്ടായിരുന്നു
  rationale: മുറിച്ചതിനു ശേഷം മുടി തൂക്കിയെന്ന അർഥം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; അളവ് തൂക്കിയപ്പോൾ ലഭിച്ച ഭാരമായി അവതരിപ്പിക്കുന്നു.
- source_word: מָאתַיִם שְׁקָלִים
  choice: ഇരുനൂറു ശേക്കേൽ
  rationale: ശേക്കേൽ ഇവിടെ നാണയമല്ല, ഭാരത്തിന്റെ അളവാണ്; പുരാതന അളവുപേര് അതേപടി നിലനിർത്തുന്നു.
- source_word: בְּאֶבֶן הַמֶּלֶךְ
  choice: രാജാവിന്റെ തൂക്കക്കല്ലിന്റെ കണക്കനുസരിച്ച്
  rationale: אֶבֶן എന്ന ‘കല്ല്’ എന്ന പദവും രാജകീയ മാനദണ്ഡഭാരമെന്ന പ്രവർത്തനാർഥവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രായത്തിലെ ആവർത്തനഭാവവും ഭാരത്തിന്റെ ദൃശ്യബിംബവും സംരക്ഷിച്ചു; പുരാതന തൂക്കമാനം വിശദീകരിക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
