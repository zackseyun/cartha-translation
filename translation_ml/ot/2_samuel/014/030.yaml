  text: וַ/יֹּ֨אמֶר אֶל עֲבָדָ֜י/ו רְאוּ֩ חֶלְקַ֨ת יוֹאָ֤ב אֶל יָדִ/י֙ וְ/ל/וֹ שָׁ֣ם שְׂעֹרִ֔ים לְכ֖וּ ו/הוצתי/ה בָ/אֵ֑שׁ וַ/יַּצִּ֜תוּ עַבְדֵ֧י אַבְשָׁל֛וֹם אֶת הַ/חֶלְקָ֖ה בָּ/אֵֽשׁ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
translation:
  language: ml
  text: 'അപ്പോൾ അബ്ശാലോം തന്റെ ദാസന്മാരോടു പറഞ്ഞു: “നോക്കൂ, യോവാബിന്റെ വയൽ എന്റെ സ്ഥലത്തോടു ചേർന്നുകിടക്കുന്നു[a]; അവിടെ അവന് യവമുണ്ട്. പോയി അതിനു തീയിടുക.” അങ്ങനെ അബ്ശാലോമിന്റെ ദാസന്മാർ ആ വയലിനു തീയിട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, “യോവാബിന്റെ വയൽ എന്റെ കൈക്കരികിലാണ്”; അബ്ശാലോമിന്റെ സ്ഥലത്തിനോടു ചേർന്നിരിക്കുന്നുവെന്ന അർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקַת
  choice: വയൽ
  rationale: കൃഷിഭൂമിയെയും അതിൽ വളരുന്ന യവത്തെയും സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാള പദം.
- source_word: אֶל יָדִי
  choice: എന്റെ വയലിനോടു ചേർന്നാണ്
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ കൈക്കരികിൽ’ എന്നുള്ള എബ്രായ പ്രയോഗം ഇവിടെ ഭൂമികളുടെ സമീപസ്ഥിതിയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഉടമസ്ഥതയും ചേർന്നുകിടക്കുന്നതും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׂעֹרִים
  choice: യവം
  rationale: വയലിൽ വളരുന്ന barley എന്ന ധാന്യവിളയ്ക്കുള്ള നിലവാരമുള്ള മലയാള പദം.
- source_word: וְהוּצִיתִהָ / וַיַּצִּתוּ
  choice: അതിനു തീയിടുക / ആ വയലിനു തീയിട്ടു
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ തീ കൊളുത്തുക എന്ന കാരണാർഥവും കല്പനയിലെയും നിർവഹണത്തിലെയും പദസാമ്യവും നിലനിർത്തുന്നു.
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  choice: തന്റെ ദാസന്മാർ / അബ്ശാലോമിന്റെ ദാസന്മാർ
  rationale: രാജധാനിസംബന്ധമായ ഈ ആഖ്യാനത്തിൽ അവരുടെ കൃത്യമായ നിയമ-സാമൂഹിക സ്ഥാനം അമിതമായി നിർണ്ണയിക്കാതെ עבד എന്ന പദത്തെ യോജിച്ച വിധത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: רְאוּ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ബഹുവചന കല്പനയുടെ സ്വാഭാവിക മലയാള രൂപം.
- source_word: לְכוּ
  choice: പോയി
  rationale: തുടർന്നുള്ള പ്രവൃത്തി ചെയ്യാൻ നീങ്ങണമെന്ന കല്പനയെ സ്വാഭാവികമായ മലയാള ക്രിയാശൃംഖലയായി നൽകുന്നു.
