translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. കർത്താവായ അബ്ശാലോമിനെ മുൻവാക്യസന്ദർഭമില്ലാതെയും വ്യക്തമാക്കാൻ ആദ്യ പരാമർശത്തിൽ പേര് ചേർത്തു. പാഠത്തിന്റെ അർഥം നേരിട്ട് വ്യക്തമാകുന്നതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
