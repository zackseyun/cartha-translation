- from: 'അപ്പോൾ തെക്കോവക്കാരിയായ സ്ത്രീ രാജാവിനോടു പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവേ, ആ കുറ്റം[a] എന്റെയും എന്റെ പിതൃഭവനത്തിന്റെയുംമേൽ ഇരിക്കട്ടെ; എന്നാൽ രാജാവും രാജാവിന്റെ സിംഹാസനവും കുറ്റമില്ലാത്തവരായിരിക്കട്ടെ.”'
  to: 'അപ്പോൾ തെക്കോവക്കാരിയായ സ്ത്രീ രാജാവിനോടു പറഞ്ഞു: “എന്റെ പ്രഭുവായ രാജാവേ, ആ കുറ്റം[a] എന്റെമേലും എന്റെ പിതൃഭവനത്തിന്മേലും ഇരിക്കട്ടെ; എന്നാൽ രാജാവും രാജാവിന്റെ സിംഹാസനവും കുറ്റമില്ലാത്തവരായിരിക്കട്ടെ.”'
  rationale: The revision repairs the Malayalam syntax of the twofold assumption of liability and uses a more idiomatic respectful address. It otherwise preserves the source's judicial ambiguity, the contrastive exoneration formula, and the existing lexical footnote.
