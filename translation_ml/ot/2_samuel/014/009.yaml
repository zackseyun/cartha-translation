  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
translation:
  language: ml
  text: 'അപ്പോൾ തെക്കോവക്കാരിയായ സ്ത്രീ രാജാവിനോടു പറഞ്ഞു: “എന്റെ പ്രഭുവായ രാജാവേ, ആ കുറ്റം[a] എന്റെമേലും എന്റെ പിതൃഭവനത്തിന്മേലും ഇരിക്കട്ടെ; എന്നാൽ രാജാവും രാജാവിന്റെ സിംഹാസനവും കുറ്റമില്ലാത്തവരായിരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അകൃത്യം,” “കുറ്റബാധ്യത,” അല്ലെങ്കിൽ “കുറ്റത്തിന്റെ പരിണതി”; ഹീബ്രു പദത്തിന് തെറ്റിനെയോ അതുമൂലമുള്ള ബാധ്യതയെയോ പരിണതിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  choice: തെക്കോവക്കാരിയായ സ്ത്രീ
  rationale: സ്ത്രീയുടെ തെക്കോവയിൽനിന്നുള്ള ഉത്ഭവം സൂചിപ്പിക്കുന്ന gentilic പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָלַי
  choice: എന്റെമേൽ ഇരിക്കട്ടെ
  rationale: മൂലത്തിലെ മുന്നിൽ നിർത്തിയ ഊന്നൽ സംരക്ഷിക്കുകയും ഉത്തരവാദിത്വം സ്വയം ഏറ്റെടുക്കുന്ന ആശയം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവേ
  rationale: രാജസദസ്സിലെ ആദരപൂർവമായ അഭിസംബോധനയും രാജപദവിയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: הֶעָוֺן
  choice: ആ കുറ്റം
  rationale: ഈ ന്യായപരമായ സന്ദർഭത്തിൽ കുറ്റം, കുറ്റബാധ്യത, അതിന്റെ പരിണതി എന്നീ അർഥസാധ്യതകൾ ഉള്ള പദത്തിന് ‘കുറ്റം’ ഉചിതമാണ്; പരിണതിയെന്ന അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: וְעַל בֵּית אָבִי
  choice: എന്റെ പിതൃഭവനത്തിന്റെയുംമേൽ
  rationale: ‘എന്റെ പിതാവിന്റെ വീട്’ എന്ന കുടുംബ-നിയമപരമായ ഹീബ്രു പ്രയോഗത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘പിതൃഭവനം’ കൊണ്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: וְהַמֶּלֶךְ וְכִסְאוֹ
  choice: എന്നാൽ രാജാവും രാജാവിന്റെ സിംഹാസനവും
  rationale: രണ്ടു ഭാഗങ്ങൾക്കിടയിലെ ആശയവൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; സിംഹാസനം രാജാധികാരത്തെയോ രാജവംശത്തെയോ സൂചിപ്പിക്കുന്ന മൂലരൂപകമായി നിലനിർത്തുന്നു.
- source_word: נָקִי
  choice: കുറ്റമില്ലാത്തവരായിരിക്കട്ടെ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് നിയമപരവും ധാർമികവുമായ കുറ്റബാധ്യതയിൽനിന്നുള്ള വിമുക്തിയാണ്; രാജാവിന്റെ സമ്പൂർണ ധാർമിക നിർദോഷതയെക്കുറിച്ചുള്ള വിശാല അവകാശവാദമല്ല.
theological_decisions:
- issue: രാജാവിനെ കുറ്റബാധ്യതയിൽനിന്ന് ഒഴിവാക്കുന്ന പ്രസ്താവന
  choice: രാജാവും രാജാവിന്റെ സിംഹാസനവും കുറ്റമില്ലാത്തവരായിരിക്കട്ടെ
  alternative: രാജാവും രാജാവിന്റെ സിംഹാസനവും നിർദോഷമായിരിക്കട്ടെ
  rationale: വാക്യത്തിന്റെ ന്യായപരമായ പരിധി സംരക്ഷിച്ച്, രാജാവിന്റെ സർവതോമുഖമായ ധാർമിക പൂർണതയെക്കുറിച്ചുള്ള ഉപദേശപരമായ അവകാശവാദം ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രാജസദസ്സിലെ ആദരസൂചക അഭിസംബോധന നിലനിർത്തി; അമിതമായി പഴഞ്ചനായ രൂപങ്ങൾ ഒഴിവാക്കി.
