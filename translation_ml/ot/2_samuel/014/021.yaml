  terminology: “യോവാബ്,” “അബ്ശാലോം,” “രാജാവ്,” “യുവാവ്,” and “തിരികെ കൊണ്ടുവരിക” are suitable. “യുവാവായ അബ്ശാലോം” appropriately retains the Hebrew apposition and its respectful, age-relative sense.
