id: 2SA.14.21
reference: 2 Samuel 14:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל יוֹאָ֔ב הִנֵּה נָ֥א עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֵ֛ךְ הָשֵׁ֥ב אֶת הַ/נַּ֖עַר אֶת אַבְשָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/021.yaml
  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് യോവാബിനോടു പറഞ്ഞു: “നോക്കൂ, ഇപ്പോൾ ഞാൻ ഈ കാര്യം ചെയ്തിരിക്കുന്നു. നീ പോയി ആ യുവാവായ അബ്ശാലോമിനെ തിരികെ കൊണ്ടുവരിക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു നീക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: എബ്രായത്തിലെ നിർദിഷ്ട സ്ഥാനപ്പേര് വ്യക്തിനാമമാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: הִנֵּה נָא
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּה എന്നതിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു; נָא നൽകുന്ന മൃദുത്വമോ തൽക്ഷണതയോ സന്ദർഭത്തിൽ ‘ഇതാ’യോടൊപ്പം ഉൾക്കൊള്ളുന്നു.
- source_word: עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה
  choice: ഞാൻ ഈ കാര്യം ചെയ്തിരിക്കുന്നു
  rationale: സന്ദർഭത്തിൽ അപേക്ഷ അനുവദിച്ചതാണ് ഉദ്ദേശ്യമെങ്കിലും, ‘ഈ കാര്യം ചെയ്തിരിക്കുന്നു’ എന്ന മൂലപാഠത്തിന്റെ വിശാലവും അല്പം അസ്പഷ്ടവുമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: וְלֵךְ
  choice: നീ പോയി
  rationale: ആജ്ഞയുടെ സ്വാഭാവിക മലയാളരൂപം; വാവിന്റെ ബന്ധവും തുടർന്നുള്ള കാരണപ്രയോഗവുമായി ചേർന്ന് പ്രകടമാകുന്നു.
- source_word: הָשֵׁב
  choice: തിരികെ കൊണ്ടുവരിക
  rationale: שׁוב എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണാർഥം—മറ്റൊരാളെ മടങ്ങിവരുത്തുക—വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַנַּעַר
  choice: യുവാവ്
  rationale: അബ്ശാലോം പ്രായപൂർത്തിയായ മകനായതിനാൽ ‘ബാലൻ’ എന്നതിനെക്കാൾ ‘യുവാവ്’ യോജിക്കുന്നു; പിതൃസംബന്ധമായ പ്രായാനുപാതിക ഭാവവും നിലനിർത്തുന്നു.
- source_word: אֶת אַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ ബൈബിൾപ്രയോഗത്തിന് യോജിച്ച വിധം ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യുവാവായ അബ്ശാലോം’ എന്ന സാമാനാധികരണ ഘടന നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ‘ഈ കാര്യം ചെയ്തിരിക്കുന്നു’ എന്ന ഉദ്ദേശ്യപരമായ വിശാലത വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിച്ചു.
