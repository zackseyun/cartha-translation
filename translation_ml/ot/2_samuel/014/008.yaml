source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר הַ/מֶּ֛לֶךְ אֶל הָ/אִשָּׁ֖ה לְכִ֣י לְ/בֵיתֵ֑/ךְ וַ/אֲנִ֖י אֲצַוֶּ֥ה עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/008.yaml
  text: Then the king said to the woman[a], “Go to your house, and I will give orders concerning you.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ആ സ്ത്രീയോടു പറഞ്ഞു: “നിന്റെ വീട്ടിലേക്കു പോകുക; നിന്റെ കാര്യത്തിൽ ഞാൻ കല്പന നൽകും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിനക്കുവേണ്ടി ഞാൻ കല്പിക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ മുൻപ്രത്യയം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം; എന്നാൽ രാജാവ് അവളുടെ കാര്യത്തിൽ നിർദേശങ്ങൾ നൽകുമെന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചയാർഥകമായ എബ്രായ നാമത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: സന്ദർഭത്തിൽ തെക്കോവയിലെ സ്ത്രീയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സ്ത്രീ’ എന്ന അർഥമാണ് യോജിച്ചത്; മലയാളത്തിൽ മുൻപരാമർശിത വ്യക്തിയെ ‘ആ’ വ്യക്തമാക്കുന്നു.
- source_word: לְכִי
  choice: പോകുക
  rationale: സ്ത്രീയോടു പറയുന്ന ഏകവചന ആജ്ഞ; മാന്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: לְבֵיתֵךְ
  choice: നിന്റെ വീട്ടിലേക്കു
  rationale: בַּיִת എന്നതിന്റെ മൂർത്തമായ ‘വീട്’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: וַאֲנִי
  choice: ഞാൻ
  rationale: എബ്രായത്തിലെ പ്രത്യക്ഷ സർവനാമം ഊന്നൽ നൽകുന്നു; മലയാളത്തിൽ ‘ഞാൻ’ അതിനെ മതിയായ വിധം നിലനിർത്തുന്നു.
- source_word: אֲצַוֶּה
  choice: കല്പന നൽകാം
  rationale: צוה എന്ന പദത്തിന്റെ രാജകീയ അധികാരമുള്ള ‘കല്പിക്കുക/ഉത്തരവിടുക’ എന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഭാവികാലത്തെ സന്ദർഭാനുസൃത വാഗ്ദാനഭാവത്തോടെയാണ് അവതരിപ്പിച്ചത്.
- source_word: עָלָיִךְ
  choice: നിന്റെ കാര്യം സംബന്ധിച്ച്
  rationale: צוה എന്ന ക്രിയയോടുകൂടിയ עַל അവളെ സംബന്ധിച്ച വിഷയത്തിൽ രാജാവ് നിർദേശം നൽകുമെന്ന അർഥം സൂചിപ്പിക്കാം; പദത്തിലെ യഥാർഥ വ്യാഖ്യാനവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിന്റെ അധികാരഭാവം ‘കല്പന നൽകാം’ എന്ന പ്രയോഗത്തിൽ സൂക്ഷിച്ചിരിക്കുന്നു; എബ്രായത്തിലെ ബന്ധസൂചകപദത്തിന്റെ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
