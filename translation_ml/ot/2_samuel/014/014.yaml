source:
  edition: WLC
  text: כִּי מ֣וֹת נָמ֔וּת וְ/כַ/מַּ֨יִם֙ הַ/נִּגָּרִ֣ים אַ֔רְצָ/ה אֲשֶׁ֖ר לֹ֣א יֵאָסֵ֑פוּ וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת לְ/בִלְתִּ֛י יִדַּ֥ח מִמֶּ֖/נּוּ נִדָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
translation:
  language: ml
  text: കാരണം നാം തീർച്ചയായും മരിക്കും; നിലത്തു ചൊരിഞ്ഞ് തിരിച്ചുകൂട്ടാനാകാത്ത വെള്ളംപോലെയാണ് നാം. എന്നാൽ ദൈവം ജീവൻ എടുത്തുകളയുന്നില്ല[a]; തന്നിൽനിന്ന് അകറ്റപ്പെട്ടവൻ അകറ്റപ്പെട്ടവനായിത്തന്നെ തുടരാതിരിക്കേണ്ടതിന് ദൈവം പദ്ധതികൾ ആവിഷ്കരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവം ഒരാളോടും പക്ഷപാതം കാണിക്കുന്നില്ല.” ഈ എബ്രായ വാക്യഭാഗം ദുഷ്കരമാണ്; ചിലർ ഇതിനെ വേറിട്ടു മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, “അകറ്റപ്പെട്ട ഒരാൾ തന്നിൽനിന്ന് അകറ്റപ്പെടാതിരിക്കേണ്ടതിന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: നാം
  rationale: ഈ വാക്യം മുൻസന്ദർഭത്തിലെ അപേക്ഷയ്ക്കുള്ള കാരണവിവരണം തുടരുന്നു. മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ തന്നെ ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: מוֹת נָמוּת
  choice: നാം തീർച്ചയായും മരിക്കും
  rationale: ക്രിയാനാമവും അപൂർണ്ണക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗം മരണത്തിന്റെ നിശ്ചിതത്വത്തെ ഊന്നിപ്പറയുന്നു; ‘തീർച്ചയായും’ ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה
  choice: നിലത്തു ചൊരിഞ്ഞ ... വെള്ളംപോലെയാണ് നാം
  rationale: മരണത്തിന്റെ തിരിച്ചെടുക്കാനാവാത്ത സ്വഭാവം വ്യക്തമാക്കുന്ന ഉപമയെ സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֲשֶׁר לֹא יֵאָסֵפוּ
  choice: വീണ്ടും ശേഖരിക്കാനാകാത്തതുമായ
  rationale: ചൊരിഞ്ഞ വെള്ളം തിരിച്ചുകൂട്ടാനാവില്ലെന്ന ആശയം ‘വീണ്ടും’ എന്ന പദത്തോടെ സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: എന്നാൽ ദൈവം ജീവൻ എടുത്തുകളയുന്നില്ല
  rationale: ദുഷ്കരമായ ഈ പ്രയോഗത്തിൽ נֶפֶשׁ ജീവിക്കുന്ന വ്യക്തിയെയോ ജീവനെയോ സൂചിപ്പിക്കുന്നു. മരണവും പുനഃസ്ഥാപനവും സംബന്ധിച്ച സന്ദർഭത്തിൽ ‘ജീവൻ എടുത്തുകളയുന്നില്ല’ എന്ന വായന യോജിക്കുന്നു; വ്യത്യസ്ത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: וְחָשַׁב מַחֲשָׁבוֹת
  choice: മാർഗങ്ങൾ ആലോചിക്കുന്നു
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള എബ്രായ പദങ്ങളുടെ ആവർത്തനം ഉദ്ദേശ്യപൂർവമായ പദ്ധതി രൂപപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്നു. പുനഃസ്ഥാപനത്തിനുള്ള വഴികൾ കണ്ടെത്തുക എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ ‘മാർഗങ്ങൾ ആലോചിക്കുന്നു’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְבִלְתִּי יִדַּח מִמֶּנּוּ נִדָּח
  choice: തന്നിൽനിന്ന് അകറ്റപ്പെട്ടവൻ അകറ്റപ്പെട്ടവനായിത്തന്നെ തുടരാതിരിക്കേണ്ടതിന്
  rationale: נדח എന്ന ധാതുവിന്റെ പുറത്താക്കപ്പെടൽ/അകറ്റപ്പെടൽ എന്ന അർഥവും നിലവിലുള്ള അവസ്ഥയുടെ മാറ്റവും ഈ രൂപം നിലനിർത്തുന്നു. מִמֶּנּוּ എന്നതിലെ സർവനാമബന്ധം ‘തന്നിൽനിന്ന്’ എന്നു സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ എന്ന ദുഷ്കരമായ വാക്യഭാഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ദൈവം ജീവൻ എടുത്തുകളയുന്നില്ല
  alternative: ദൈവം ഒരു വ്യക്തിയോടും പക്ഷപാതം കാണിക്കുന്നില്ല
  rationale: മനുഷ്യന്റെ അനിവാര്യമായ മരണത്തിൽനിന്ന് അകറ്റപ്പെട്ടവനെ തിരികെ കൊണ്ടുവരാനുള്ള ദൈവിക പ്രവർത്തനത്തിലേക്കുള്ള ആശയക്രമത്തിന് ‘ജീവൻ എടുത്തുകളയുന്നില്ല’ എന്ന വായന കൂടുതൽ നന്നായി യോജിക്കുന്നു. എങ്കിലും എബ്രായ പ്രയോഗം ദുഷ്കരമായതിനാൽ പക്ഷപാതത്തെക്കുറിച്ചുള്ള വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: לְבִלְתִּי יִדַּח എന്നതിന്റെ ഫലാർഥം
  choice: അകറ്റപ്പെട്ടവനായിത്തന്നെ തുടരാതിരിക്കേണ്ടതിന്
  alternative: അകറ്റപ്പെട്ട ഒരാൾ തന്നിൽനിന്ന് അകറ്റപ്പെടാതിരിക്കേണ്ടതിന്
  rationale: മുഖ്യവാചകം അകറ്റപ്പെട്ട അവസ്ഥയുടെ തുടർച്ച അവസാനിപ്പിക്കുന്ന പുനഃസ്ഥാപനത്തെ മുൻനിർത്തുന്നു; കൂടുതൽ രൂപാനുസൃതമായ നിഷ്ക്രിയ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവിടന്ന്’ ദൈവത്തെ ആദരസൂചകമായി പരാമർശിക്കുന്നു. മരണത്തിന്റെ ഉപമ ലളിതമായി നിലനിർത്തുകയും ദുഷ്കരമായ എബ്രായ വാക്യഭാഗങ്ങളിലെ വ്യാഖ്യാനഭേദങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
