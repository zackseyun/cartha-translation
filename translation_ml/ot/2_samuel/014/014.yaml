  revision_rationale: പരിഷ്കരണം മൂലപാഠത്തിലെ കാരണബന്ധം തെളിയിക്കുകയും വെള്ളത്തിന്റെ ഉപമയെ സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിന്റെ സാധ്യതയുള്ള അസ്പഷ്ടത ഒഴിവാക്കി, ഉദ്ദേശ്യപൂർവമായ ആസൂത്രണത്തെ ‘പദ്ധതികൾ ആവിഷ്കരിക്കുന്നു’ എന്നു നൽകുന്നു. ദുഷ്കരമായ ദൈവം-ജീവൻ വാക്യഭാഗവും അകറ്റപ്പെട്ടവനെക്കുറിച്ചുള്ള വ്യാഖ്യാനഭേദവും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിരിക്കുന്നു.
