    rationale: ലളിതമായ വിശേഷണഘടനയും ‘പദ്ധതികൾ ആവിഷ്കരിക്കുന്നു’ എന്ന പ്രയോഗവും ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ ഒഴുക്കും חשב מחשבות-ന്റെ ഉദ്ദേശ്യപൂർവമായ ആസൂത്രണവും നൽകുന്നു.
  revised_text: കാരണം നാം തീർച്ചയായും മരിക്കും; നിലത്തു ചൊരിഞ്ഞ് തിരിച്ചുകൂട്ടാനാകാത്ത വെള്ളംപോലെയാണ് നാം. എന്നാൽ ദൈവം ജീവൻ എടുത്തുകളയുന്നില്ല[a]; തന്നിൽനിന്ന് അകറ്റപ്പെട്ടവൻ അകറ്റപ്പെട്ടവനായിത്തന്നെ തുടരാതിരിക്കേണ്ടതിന് ദൈവം പദ്ധതികൾ ആവിഷ്കരിക്കുന്നു.[b]
