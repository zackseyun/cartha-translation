    rationale: മലയാളത്തിൽ ഒഴിവാക്കാവുന്നതാണെങ്കിലും മുൻവാക്യത്തോടുള്ള വാദപരമായ ബന്ധം മൂലപാഠം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു. ‘കാരണം’ ചേർക്കുന്നതു അർഥം കൂട്ടിച്ചേർക്കാതെ ബന്ധം നിലനിർത്തുന്നു.
  - severity: low
