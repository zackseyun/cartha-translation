translation:
  language: ml
  text: അബ്ശാലോമിന് മൂന്ന് പുത്രന്മാരും ഒരു പുത്രിയും ജനിച്ചു. അവളുടെ പേര് താമാർ എന്നായിരുന്നു. അവൾ കാഴ്ചയിൽ സുന്ദരിയായ ഒരു സ്ത്രീയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “അവൾ സുന്ദരിയായിരുന്നു.” എബ്രായത്തിൽ അക്ഷരാർഥം: “കാഴ്ചയിൽ സുന്ദരിയായ ഒരു സ്ത്രീ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  choice: അബ്ശാലോമിന് … ജനിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ നിഫാൽ രൂപവും לְ എന്ന ബന്ധസൂചകവും ചേർന്ന് മക്കൾ അബ്ശാലോമിന് ജനിച്ചു എന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ ഇത് സ്വാഭാവികമായ ജനനപ്രയോഗമാണ്.
- source_word: שְׁלוֹשָׁה בָנִים
  choice: മൂന്ന് പുത്രന്മാർ
  rationale: בָנִים ഇവിടെ പൊതുവായ ‘മക്കൾ’ എന്നതല്ല, ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗസൂചന നിലനിർത്തി.
- source_word: וּבַת אַחַת
  choice: ഒരു പുത്രി
  rationale: സംഖ്യയും പെൺമകൻ എന്ന അർഥവും നേരിട്ട്, സ്വാഭാവികമായ മലയാളത്തിൽ പകർന്നു.
- source_word: וּשְׁמָהּ תָּמָר
  choice: അവളുടെ പേര് താമാർ എന്നായിരുന്നു
  rationale: שְׁמָהּ എന്ന സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം തൊട്ടുമുമ്പ് പറഞ്ഞ പുത്രിയെ സൂചിപ്പിക്കുന്നു; תָּמָר എന്ന പേര് ‘താമാർ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: הִיא הָיְתָה אִשָּׁה
  choice: അവൾ … ഒരു സ്ത്രീയായിരുന്നു
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ സാന്നിധ്യം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന ഉപയോഗിച്ചു.
- source_word: יְפַת מַרְאֶה
  choice: കാഴ്ചയിൽ സുന്ദരിയായ
  rationale: ശാരീരിക രൂപസൗന്ദര്യത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അർഥവും അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
