id: 2SA.14.5
reference: 2 Samuel 14:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּֽאמֶר לָ֥/הּ הַ/מֶּ֖לֶךְ מַה לָּ֑/ךְ וַ/תֹּ֗אמֶר אֲבָ֛ל אִשָּֽׁה אַלְמָנָ֥ה אָ֖נִי וַ/יָּ֥מָת אִישִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/005.yaml
  text: The king said to her[a], “What is the matter?” She said, “Indeed, I am a widow[b], and my husband has died.”
translation:
  language: ml
  text: 'രാജാവ് അവളോട്[a], “നിനക്ക് എന്തു പറ്റി?” എന്നു ചോദിച്ചു. അവൾ പറഞ്ഞു: “വാസ്തവത്തിൽ, ഞാൻ ഒരു വിധവയാണ്[b]; എന്റെ ഭർത്താവ് മരിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിനക്ക് എന്താണ് പ്രശ്നം?”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “അയ്യോ, ഞാൻ ഒരു വിധവയാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּךְ
  choice: നിനക്ക് എന്തു പറ്റി?
  rationale: ‘നിനക്ക് എന്താണ്?’ എന്ന അക്ഷരാർഥമുള്ള ഈ എബ്രായ പ്രയോഗം ഒരാളുടെ പ്രശ്നമോ ദുഃഖമോ എന്താണെന്ന് ചോദിക്കുന്നതാണ്. ‘നിനക്ക് എന്തു പറ്റി?’ എന്നത് ആ അഭിസംബോധനാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲבָל
  choice: വാസ്തവത്തിൽ
  rationale: ഇവിടെ ഈ പദം വിരുദ്ധാർഥകമായ ‘എന്നാൽ’ എന്നതിലുപരി, സ്ത്രീയുടെ പ്രസ്താവനയ്ക്ക് ഊന്നൽ നൽകുന്ന നിശ്ചയസൂചക കണികയായാണ് പ്രവർത്തിക്കുന്നത്. ‘വാസ്തവത്തിൽ’ ആ ഊന്നൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിലാപസൂചനയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אִשָּׁה אַלְמָנָה
  choice: ഞാൻ ഒരു വിധവയാണ്
  rationale: എബ്രായത്തിലെ ‘വിധവയായ സ്ത്രീ’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു വിധവ’ എന്നു ചുരുക്കാം; അർഥനഷ്ടമില്ല.
- source_word: וַיָּמָת אִישִׁי
  choice: എന്റെ ഭർത്താവ് മരിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ אִישִׁי എന്നത് ‘എന്റെ ഭർത്താവ്’ എന്നാണ്. וַיָּמָת ഒരു സംഭവമായി മരണത്തെ വിവരിക്കുന്നതിനാൽ ‘മരിച്ചു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിതത്വമുള്ള എബ്രായ നാമത്തിന് സന്ദർഭാനുസൃതമായ നേരിട്ടുള്ള മലയാള പരിഭാഷ.
- source_word: וַתֹּאמֶר
  choice: അവൾ പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ തുടർച്ചാസൂചകമായ വാവ് മലയാളത്തിൽ വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ പ്രത്യേകമായി ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘എന്നിട്ട്’ ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. രാജാവിന്റെ ചോദ്യം ഔപചാരികമായി കട്ടിയാക്കാതെ എബ്രായ പ്രയോഗത്തിന്റെ വ്യക്തിപരമായ അന്വേഷണഭാവം സൂക്ഷിച്ചു; സ്ത്രീയുടെ മറുപടിയിലെ ഊന്നലും സാധ്യതയുള്ള വിലാപഭാവവും പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും വേർതിരിച്ചു നിലനിർത്തി.
