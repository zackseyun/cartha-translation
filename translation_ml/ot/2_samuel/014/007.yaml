  text: וְ/הִנֵּה֩ קָ֨מָה כָֽל הַ/מִּשְׁפָּחָ֜ה עַל שִׁפְחָתֶ֗/ךָ וַ/יֹּֽאמְרוּ֙ תְּנִ֣י אֶת מַכֵּ֣ה אָחִ֗י/ו וּ/נְמִתֵ֨/הוּ֙ בְּ/נֶ֤פֶשׁ אָחִי/ו֙ אֲשֶׁ֣ר הָרָ֔ג וְ/נַשְׁמִ֖ידָה גַּ֣ם אֶת הַ/יּוֹרֵ֑שׁ וְ/כִבּ֗וּ אֶת גַּֽחַלְתִּ/י֙ אֲשֶׁ֣ר נִשְׁאָ֔רָה לְ/בִלְתִּ֧י שום לְ/אִישִׁ֛/י שֵׁ֥ם וּ/שְׁאֵרִ֖ית עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
translation:
  language: ml
  text: ഇതാ, കുടുംബം മുഴുവനും അങ്ങയുടെ ദാസിക്കെതിരെ എഴുന്നേറ്റ്, ‘സ്വന്തം സഹോദരനെ അടിച്ചവനെ ഏല്പിച്ചുതരുക; അവൻ കൊന്ന സഹോദരന്റെ ജീവനു പകരം ഞങ്ങൾ അവനെ കൊല്ലട്ടെ. അവകാശിയെയും ഞങ്ങൾ നശിപ്പിക്കും’ എന്നു പറയുന്നു. അങ്ങനെ അവർ എന്റെ ശേഷിച്ചിരിക്കുന്ന തീക്കനൽ[a] കെടുത്തിക്കളഞ്ഞ്, എന്റെ ഭർത്താവിന് ഭൂമുഖത്ത് പേരോ സന്തതിയോ[b] അവശേഷിക്കാതെയാക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ അവസാനത്തെ തീക്കനൽ.’ കുടുംബവംശത്തിന്റെ അവസാനത്തെ ജീവനുള്ള പ്രത്യാശയെ സൂചിപ്പിക്കാൻ ഹീബ്രു ശേഷിച്ചിരിക്കുന്ന തീക്കനലിന്റെ ദൃശ്യരൂപം ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പേരോ സന്തതിയോ’ എന്നത് ഒരാളുടെ പ്രശസ്തിയെ മാത്രമല്ല, അയാളുടെ സ്മരണയും നിലനിൽക്കുന്ന വംശപരമ്പരയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു അവതാരകപദത്തിന്റെ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שִׁפְחָתֶךָ
  choice: അങ്ങയുടെ ദാസി
  rationale: രാജാവിനോടു സംസാരിക്കുന്ന സ്ത്രീയുടെ വിനയപൂർവമായ സ്വയംപരാമർശവും സ്ത്രീലിംഗവും നിലനിർത്തുന്നു.
- source_word: כָל הַמִּשְׁפָּחָה
  choice: കുടുംബം മുഴുവനും
  rationale: വിപുലമായ ബന്ധുകൂട്ടത്തെയും അതിന്റെ കൂട്ടായ എതിർപ്പിനെയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: קָמָה ... עַל
  choice: എതിരെ എഴുന്നേറ്റ്
  rationale: വെറും നിൽപ്പല്ല, ശത്രുതാപരമായ നീക്കമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תְּנִי
  choice: ഏല്പിച്ചുതരുക
  rationale: ന്യായവിധിക്കോ പ്രതികാരത്തിനോ വേണ്ടി ഒരാളെ കൈമാറണമെന്ന നിർബന്ധിത ആവശ്യത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מַכֵּה אָחִיו
  choice: സ്വന്തം സഹോദരനെ അടിച്ചവൻ
  rationale: നכה എന്ന പദത്തെ മുൻകൂട്ടി ‘കൊലയാളി’ എന്നു വ്യാഖ്യാനിക്കാതെ, പിന്നാലെയുള്ള ‘കൊന്ന’ എന്ന പ്രസ്താവനയിലേക്കുള്ള ഹീബ്രു പുരോഗതി സംരക്ഷിക്കുന്നു.
- source_word: בְּנֶפֶשׁ אָחִיו
  choice: തന്റെ സഹോദരന്റെ ജീവനു പകരം
  rationale: ജീവനു ജീവൻ എന്ന പ്രതികാരനീതിയുടെ ആശയം മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: וְנַשְׁמִידָה גַּם אֶת הַיּוֹרֵשׁ
  choice: അവകാശിയെയും ഞങ്ങൾ നശിപ്പിക്കും
  rationale: ശേഷിക്കുന്ന മകനെ അവകാശിയെന്ന നിലയിലും ഇല്ലാതാക്കാനുള്ള കുടുംബത്തിന്റെ ഉദ്ദേശം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי אֲשֶׁר נִשְׁאָרָה
  choice: എനിക്കു ശേഷിച്ചിരിക്കുന്ന തീക്കനൽ കെടുത്തിക്കളയും
  rationale: വംശത്തിന്റെ അവസാന പ്രത്യാശയെ സൂചിപ്പിക്കുന്ന തീക്കനൽ എന്ന ദൃശ്യരൂപകം വിശദീകരിച്ച് നിരപ്പാക്കാതെ മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: שֵׁם וּשְׁאֵרִית
  choice: പേരോ പിൻതലമുറയോ
  rationale: ഭർത്താവിന്റെ സ്മരണയും നിലനിൽക്കുന്ന വംശപരമ്പരയും ഉൾക്കൊള്ളുന്ന യുഗ്മപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
