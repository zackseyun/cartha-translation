translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. രാജാവിനോടുള്ള ആദരസൂചകമായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു; സ്ത്രീയുടെ സ്വയംപരാമർശത്തിലെ ലിംഗസൂചന ‘ദാസി’യിൽ നിലനിർത്തി. മൂലത്തിലെ നിയമപരവും കുടുംബവംശപരവുമായ സംഘർഷവും തീക്കനൽരൂപകവും സംരക്ഷിച്ചു.
