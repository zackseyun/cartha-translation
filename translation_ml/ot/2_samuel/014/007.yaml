    rationale: The Hebrew possessive suffix on גַּחַלְתִּי identifies the ember as hers. ‘എന്റെ ശേഷിച്ചിരിക്കുന്ന തീക്കനൽ’ is clearer and preserves the metaphor directly.
  - severity: low
