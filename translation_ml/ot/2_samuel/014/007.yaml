  verdict: revise
  source_fidelity: 'The draft accurately conveys the hostile uprising of the extended family, the demand for the surviving son, life-for-life retaliation, the heir, and the ember metaphor. A small revision improves the ownership and idiomatic force of the final metaphor/result clause: Hebrew has “my remaining ember” and presents its extinguishing as resulting in the husband being left without name or surviving line.'
