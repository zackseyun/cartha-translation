  terminology: ‘അങ്ങയുടെ ദാസി,’ ‘അവകാശി,’ and ‘തീക്കനൽ’ are suitable. ‘സന്തതി’ communicates the surviving family line naturally; the footnote preserves the broader sense of ‘name and remnant.’
