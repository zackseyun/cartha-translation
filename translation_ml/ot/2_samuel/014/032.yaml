  to: 'അബ്ശാലോം യോവാബിനോടു പറഞ്ഞു: “നോക്കൂ, ‘ഇവിടേക്കു വരുക; “ഞാൻ ഗെശൂരിൽനിന്നു വന്നത് എന്തിന്? ഞാൻ ഇപ്പോഴും അവിടെത്തന്നെ ആയിരുന്നെങ്കിൽ എനിക്കു നന്നായേനെ” എന്നു രാജാവിനോടു പറയാൻ ഞാൻ നിന്നെ അയയ്ക്കട്ടെ’ എന്നു പറഞ്ഞ് ഞാൻ നിനക്കു സന്ദേശം അയച്ചിരുന്നല്ലോ. ഇപ്പോൾ ഞാൻ രാജാവിന്റെ മുഖം കാണട്ടെ[a]. എന്നിൽ കുറ്റമുണ്ടെങ്കിൽ അദ്ദേഹം എന്നെ കൊല്ലട്ടെ.”'
