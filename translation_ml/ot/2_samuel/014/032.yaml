  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
translation:
  language: ml
  text: 'അബ്ശാലോം യോവാബിനോടു പറഞ്ഞു: “നോക്കൂ, ‘ഇവിടേക്കു വരുക; “ഞാൻ ഗെശൂരിൽനിന്നു വന്നത് എന്തിന്? ഞാൻ ഇപ്പോഴും അവിടെത്തന്നെ ആയിരുന്നെങ്കിൽ എനിക്കു നന്നായേനെ” എന്നു രാജാവിനോടു പറയാൻ ഞാൻ നിന്നെ അയയ്ക്കട്ടെ’ എന്നു പറഞ്ഞ് ഞാൻ നിനക്കു സന്ദേശം അയച്ചിരുന്നല്ലോ. ഇപ്പോൾ ഞാൻ രാജാവിന്റെ മുഖം കാണട്ടെ[a]. എന്നിൽ കുറ്റമുണ്ടെങ്കിൽ അദ്ദേഹം എന്നെ കൊല്ലട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഞാൻ രാജാവിന്റെ മുഖം കാണട്ടെ.” രാജാവിന്റെ സന്നിധിയിൽ ഹാജരാകുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: അബ്ശാലോം തന്റെ പരാതിയിലേക്കു യോവാബിന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ആധുനികവും സ്വാഭാവികവുമായ വ്യവഹാരസൂചകം.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: ഞാൻ നിനക്കു സന്ദേശം അയച്ചിരുന്നല്ലോ
  rationale: ഇവിടെ שלח എന്നത് ഒരു വസ്തു അയയ്ക്കുന്നതല്ല, സന്ദേശമോ വിളിപ്പോ അയയ്ക്കുന്നതാണ്. മുൻപ് അയച്ച സന്ദേശത്തെ ഓർമ്മിപ്പിക്കുന്ന ഭാവം ‘അയച്ചിരുന്നല്ലോ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֹּא הֵנָּה
  choice: ഇവിടേക്കു വരുക
  rationale: ആജ്ഞയും സ്ഥലസൂചനയും നേരിട്ട്, ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ പകർന്നു.
- source_word: וְאֶשְׁלְחָה אֹתְךָ אֶל הַמֶּלֶךְ
  choice: രാജാവിനോടു പറയാൻ ഞാൻ നിന്നെ അയയ്ക്കട്ടെ
  rationale: സന്ദർഭത്തിൽ യോവാബിനെ രാജാവിന്റെ അടുക്കൽ അയയ്ക്കുന്നതിന്റെ ഉദ്ദേശ്യം തുടർന്നുള്ള വാക്കുകൾ അറിയിക്കലാണ്; ഹീബ്രു cohortative-ന്റെ ഉദ്ദേശ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: לָמָּה בָּאתִי מִגְּשׁוּר
  choice: ഞാൻ ഗെശൂരിൽനിന്നു വന്നത് എന്തിന്?
  rationale: ഹീബ്രുവിലെ ഒന്നാംപുരുഷ കർത്തൃപ്രയോഗം നിലനിർത്തി; ‘എന്നെ കൊണ്ടുവന്നത് എന്തിന്?’ എന്ന കാരണപ്രയോഗം ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- source_word: טוֹב לִי עוֹד אֲנִי שָׁם
  choice: ഞാൻ ഇപ്പോഴും അവിടെത്തന്നെ ആയിരുന്നെങ്കിൽ എനിക്കു നന്നായിരുന്നു
  rationale: ഹീബ്രു വാക്യം സംക്ഷിപ്തവും അല്പം അപൂർണ്ണവുമാണ്. താരതമ്യത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുമ്പോഴും ‘ഇപ്പോഴും അവിടെ’ എന്ന ഘടകം സംരക്ഷിക്കുന്നു.
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: പരാതിയിൽനിന്ന് ആവശ്യത്തിലേക്കുള്ള സമയപരമായ തിരിവ് നൽകുന്നു; കാരണാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  choice: ഞാൻ രാജാവിന്റെ മുഖം കാണട്ടെ
  rationale: ‘രാജാവിന്റെ മുഖം കാണുക’ എന്ന ഹീബ്രു ദൃശ്യരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ രാജസന്നിധിയിൽ ഹാജരാകുക എന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עָוֺן
  choice: കുറ്റം
  rationale: ധാർമ്മിക തെറ്റിനെയും അതിൽനിന്നുള്ള കുറ്റബാധ്യതയെയും ഉൾക്കൊള്ളുന്ന, ഈ ന്യായവിധിസന്ദർഭത്തിനു യോജിച്ച സാധാരണ മലയാളപദം.
- source_word: וֶהֱמִתָנִי
  choice: അദ്ദേഹം എന്നെ കൊല്ലട്ടെ
  rationale: מות എന്ന ക്രിയയുടെ കാരണപ്രയോഗമായ ‘മരണത്തിന് ഇടയാക്കുക/കൊല്ലുക’ എന്ന അർഥം നേരിട്ടും ഗൗരവത്തോടെയും നൽകുന്നു; ഔപചാരിക വധശിക്ഷയെന്ന് അതിവ്യാഖ്യാനിക്കുന്നില്ല.
