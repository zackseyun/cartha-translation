  source_fidelity: 'പ്രധാന അർഥവും വാക്യഘടനയും ഹീബ്രു പാഠത്തോടു വിശ്വസ്തമാണ്: അബ്ശാലോം യോവാബിന് അയച്ച സന്ദേശം, രാജാവിന്റെ അടുക്കലേക്ക് അയക്കാനുള്ള ഉദ്ദേശ്യം, ഗെശൂരിൽനിന്നു വന്നതിനെക്കുറിച്ചുള്ള ചോദ്യം, രാജസന്നിധിയിൽ ഹാജരാകാനുള്ള അഭ്യർഥന, കുറ്റമുണ്ടെങ്കിൽ കൊല്ലണമെന്ന വെല്ലുവിളി എന്നിവയെല്ലാം സംരക്ഷിച്ചിട്ടുണ്ട്. എങ്കിലും ‘എനിക്കു നന്നായിരുന്നു’ എന്നത് ഇപ്പോഴത്തെ സങ്കൽപ്പിത/വിപരീതാവസ്ഥയെ അല്പം അസ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.'
  naturalness: ‘ഞാൻ ഇപ്പോഴും അവിടെത്തന്നെ ആയിരുന്നെങ്കിൽ എനിക്കു നന്നായേനെ’ എന്ന രൂപം ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും, ഗെശൂരിൽ തുടരുന്നതാണ് അഭികാമ്യമായിരുന്നതെന്ന ഹീബ്രു വാക്യത്തിന്റെ സംക്ഷിപ്ത സങ്കൽപ്പാർഥവും കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
  terminology: ‘ഗെശൂർ,’ ‘രാജാവ്,’ ‘കുറ്റം,’ ‘രാജാവിന്റെ മുഖം കാണുക’ എന്നിവ യോജിച്ചതാണ്. ‘മുഖം കാണുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തിയതും അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകിയതും ഉചിതമാണ്.
