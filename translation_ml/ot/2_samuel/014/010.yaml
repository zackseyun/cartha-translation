  text: And the king said[a], “Whoever speaks to you, bring him to me, and he will never touch you again.”
translation:
  language: ml
  text: 'രാജാവ് പറഞ്ഞു: “നിന്നോടു സംസാരിക്കുന്ന ആരെയെങ്കിലും എന്റെ അടുക്കൽ കൊണ്ടുവരുക; ഇനി അവൻ ഒരിക്കലും നിന്നെ തൊടുകയില്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇനി അവൻ നിന്നെ ഉപദ്രവിക്കുകയില്ല.” ഇവിടെ “തൊടുക” എന്ന ഹീബ്രു പ്രയോഗം വെറും ശാരീരിക സ്പർശം എന്നതിലുപരി ശത്രുതാപരമായ സമ്പർക്കമോ ഉപദ്രവമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചയാർഥകത സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘രാജാവ്’ എന്നു നൽകി.
- source_word: הַמְדַבֵּר אֵלַיִךְ
  choice: നിന്നോടു സംസാരിക്കുന്നവനെ
  rationale: നിശ്ചയാർഥക കർത്തൃവാചക കൃദന്തത്തിന്റെ substantival പ്രയോഗം ‘സംസാരിക്കുന്നവൻ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു; ഇവിടെ കുറ്റപ്പെടുത്തുകയോ ഭീഷണിപ്പെടുത്തുകയോ ചെയ്യുന്നവനെ സന്ദർഭം സൂചിപ്പിക്കുന്നുവെങ്കിലും അതു മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וַהֲבֵאתוֹ אֵלַי
  choice: എന്റെ അടുക്കൽ കൊണ്ടുവരുക
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരകാർഥം സ്വാഭാവികമായി ‘കൊണ്ടുവരുക’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: לֹא יֹסִיף עוֹד
  choice: പിന്നെ ... ഇല്ല
  rationale: പ്രവൃത്തി ഇനി ആവർത്തിക്കുകയോ തുടരുകയോ ഇല്ലെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לָגַעַת בָּךְ
  choice: നിന്നെ തൊടുകയില്ല
  rationale: נגע എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘തൊടുക’ സംരക്ഷിച്ചു; ഈ സംരക്ഷണസന്ദർഭത്തിൽ ഉപദ്രവിക്കുകയോ ദ്രോഹിക്കുകയോ ചെയ്യുക എന്ന സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
