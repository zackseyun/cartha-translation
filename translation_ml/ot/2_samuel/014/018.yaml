base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/018.yaml
  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ആ സ്ത്രീയോടു മറുപടിയായി പറഞ്ഞു: “ഞാൻ നിന്നോടു ചോദിക്കുന്ന യാതൊരു കാര്യവും എന്നിൽനിന്ന് മറച്ചുവെക്കരുതേ.” ആ സ്ത്രീ പറഞ്ഞു: “എന്റെ പ്രഭുവായ രാജാവേ, അങ്ങ് പറഞ്ഞാലും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “എന്റെ പ്രഭുവായ രാജാവ് ദയവായി സംസാരിക്കട്ടെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: രണ്ടു ക്രിയകളുടെയും മറുപടി-സംഭാഷണ സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: സന്ദർഭത്തിൽ തെക്കോവക്കാരിയായ സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്; ഭാര്യ എന്ന അർഥമില്ല.
- source_word: אַל נָא תְכַחֲדִי מִמֶּנִּי
  choice: എന്നിൽനിന്നു മറച്ചുവെക്കരുതേ
  rationale: നിഷേധകല്പനയോടൊപ്പമുള്ള അപേക്ഷാഭാവം ‘-രുതേ’ എന്ന രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: דָּבָר
  choice: യാതൊരു കാര്യവും
  rationale: നിഷേധവാക്യത്തിൽ ‘ഒരു കാര്യം’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר אָנֹכִי שֹׁאֵל אֹתָךְ
  choice: ഞാൻ നിന്നോടു ചോദിക്കുന്ന
  rationale: വർത്തമാന പങ്കാളിക്രിയയുടെ തത്സമയ അർഥവും ബന്ധവാക്യഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: יְדַבֶּר נָא
  choice: അരുളിച്ചെയ്താലും
  rationale: രാജാവിനോടുള്ള ആദരപൂർവമായ മൂന്നാംപുരുഷ അഭ്യർഥന മലയാളത്തിലെ രാജസഭാ അഭിസംബോധനയ്ക്ക് യോജിച്ച രീതിയിൽ നൽകുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: അധീനതയും രാജപദവിയും ഉൾക്കൊള്ളുന്ന ആദരസൂത്രം പൂർണമായി നിലനിർത്തുന്നു.
