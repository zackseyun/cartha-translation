reference: 2 Samuel 14:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֖דַע יוֹאָ֣ב בֶּן צְרֻיָ֑ה כִּֽי לֵ֥ב הַ/מֶּ֖לֶךְ עַל אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/001.yaml
  text: Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
translation:
  language: ml
  text: സെരൂയയുടെ മകനായ യോവാബ്, രാജാവിന്റെ ഹൃദയം അബ്ശാലോമിലേക്കാണെന്ന്[a] അറിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രാജാവ് അബ്ശാലോമിനായി വാഞ്ഛിച്ചു.’ ഹീബ്രായ പ്രയോഗം സംക്ഷിപ്തമായതിനാൽ, ‘രാജാവിന്റെ ഹൃദയം അബ്ശാലോമിലേക്കു തിരിഞ്ഞിരുന്നു’ എന്ന പൊതുവായ അർഥത്തിലും മനസ്സിലാക്കാം. ചിലർ ‘അബ്ശാലോമിന് എതിരായിരുന്നു’ എന്നും വ്യാഖ്യാനിച്ചിട്ടുണ്ട്; എന്നാൽ തുടർന്നുള്ള സന്ദർഭം അനുകൂലമായ ചായ്‌വിനെയാണ് കൂടുതൽ പിന്തുണയ്ക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: അറിഞ്ഞു
  rationale: ידע എന്ന ക്രിയയുടെ സാധാരണ അർഥം നിലനിർത്തുന്നു; וַ־യുടെ ആഖ്യാനബന്ധം മലയാളത്തിൽ പ്രത്യേകമായ ‘ഇപ്പോൾ’ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: സെരൂയയുടെ മകനായ യോവാബ്
  rationale: ഹീബ്രായ സംയുക്തപദബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: യോവാബ് അറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായതിനാൽ ‘എന്ന്’ യോജിക്കുന്നു.
- source_word: לֵב הַמֶּלֶךְ
  choice: രാജാവിന്റെ ഹൃദയം
  rationale: לֵב സൂചിപ്പിക്കുന്ന ആന്തരിക മനോഭാവം, ഇച്ഛ, സ്നേഹാഭിമുഖ്യം എന്നിവയെ ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ ഹീബ്രായ രൂപകം നിലനിർത്തുന്നു.
- source_word: עַל
  choice: അബ്ശാലോമിലേക്കാണ്
  rationale: ‘ഹൃദയം ... മേൽ/നേരെ’ എന്ന സംക്ഷിപ്ത ഹീബ്രായ പ്രയോഗത്തിലെ ദിശാഭിമുഖ്യം മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു; സ്നേഹമോ വിരോധമോ എന്ന് മുഖ്യവാചകത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: אַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: വ്യക്തിനാമത്തിന്റെ ഹീബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: അബ്ശാലോമിനോടുള്ള രാജാവിന്റെ മനോഭാവത്തിലെ അവ്യക്തത
  choice: രാജാവിന്റെ ഹൃദയം അബ്ശാലോമിലേക്കാണ്
  alternative: രാജാവ് അബ്ശാലോമിനായി വാഞ്ഛിച്ചു; രാജാവിന്റെ ഹൃദയം അബ്ശാലോമിന് എതിരായിരുന്നു
  rationale: ഹീബ്രായ പ്രയോഗം സംക്ഷിപ്തവും ദിശാഭിമുഖ്യം മാത്രം വ്യക്തമായി സൂചിപ്പിക്കുന്നതുമാണ്. തുടർന്നുള്ള സന്ദർഭം അനുകൂലമായ ചായ്‌വിനെ പിന്തുണയ്ക്കുന്നുവെങ്കിലും, മുഖ്യവാചകം സ്നേഹം, ആകാംക്ഷ, അല്ലെങ്കിൽ വിരോധം എന്നിങ്ങനെ ഒന്നിനെ നിർബന്ധമായി തിരഞ്ഞെടുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഹൃദയം ...ലേക്ക്’ എന്ന രൂപകം മൂലഭാഷയിലെ അർഥവ്യാപ്തിയും അവ്യക്തതയും കാത്തുസൂക്ഷിക്കുന്നു.
