base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/006.yaml
  text: And your servant had two sons[a], and the two of them fought in the field, and there was no one to separate them[b]; then the one struck the other and killed him.
translation:
  language: ml
  text: അങ്ങയുടെ ദാസിയായ എനിക്ക് രണ്ടു പുത്രന്മാർ ഉണ്ടായിരുന്നു[a]. അവർ ഇരുവരും വയലിൽവെച്ച് തമ്മിൽ പൊരുതി. അവർക്കിടയിൽ അവരെ വേർപെടുത്താൻ ആരും ഉണ്ടായിരുന്നില്ല[b]. അപ്പോൾ ഒരുവൻ മറ്റവനെ അടിച്ചുകൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിൽ സ്ത്രീ സംസാരിക്കുന്നതിനാൽ, ‘അങ്ങയുടെ ദാസി’ എന്നും പരിഭാഷപ്പെടുത്താം; രാജാവിനോടുള്ള വിനയപൂർവമായ ആത്മപരാമർശമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അവരുടെ ഇടയിൽ ഒരു വിടുവിക്കുന്നവനും ഉണ്ടായിരുന്നില്ല’; അതായത്, ഇടപെട്ട് അവരെ വേർപെടുത്താൻ ആരുമുണ്ടായിരുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  choice: അങ്ങയുടെ ദാസിയായ എനിക്ക്
  rationale: שִׁפְחָה സ്ത്രീലിംഗത്തിലുള്ള ദാസിയെ സൂചിപ്പിക്കുന്നു; രാജാവിനോടു സംസാരിക്കുന്ന സ്ത്രീയുടെ വിനയപൂർവമായ ആത്മപരാമർശമാണിത്. മലയാളത്തിൽ സ്വാഭാവികമായി ആ അർഥവും സ്ത്രീലിംഗവും നിലനിർത്തുന്നു.
- source_word: שְׁנֵי בָנִים
  choice: രണ്ടു പുത്രന്മാർ
  rationale: בָנִים ഇവിടെ പൊതുവായ മക്കളെയല്ല, ആൺമക്കളെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּנָּצוּ
  choice: തമ്മിൽ പൊരുതി
  rationale: נצה ഇവിടെ ശാരീരികമായ ഏറ്റുമുട്ടലിനെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുണ്ടാകുന്ന മരണവുമായി പൊരുത്തപ്പെടുന്ന ശക്തിയുള്ള പ്രയോഗമാണിത്.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽവെച്ച്
  rationale: സ്ഥലസൂചന നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְאֵין מַצִּיל בֵּינֵיהֶם
  choice: അവരെ വേർപെടുത്താൻ ആരും അവിടെ ഉണ്ടായിരുന്നില്ല
  rationale: מַצִּיל എന്നതിന് അക്ഷരാർഥത്തിൽ വിടുവിക്കുന്നവൻ എന്നാണെങ്കിലും, ഈ സംഘർഷസന്ദർഭത്തിൽ ഇടപെട്ട് ഇരുവരെയും വേർപെടുത്തുന്ന ഒരാളെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וַיַּכּוֹ הָאֶחָד אֶת הָאֶחָד וַיָּמֶת אֹתוֹ
  choice: ഒരുവൻ മറ്റവനെ അടിച്ചുകൊന്നു
  rationale: נכה എന്ന അടിക്കുക എന്ന പ്രവൃത്തിയും מות എന്ന ക്രിയയുടെ കാരണാർഥമായ കൊല്ലുക എന്ന ഫലവും മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും ഒരുമിച്ചു നൽകുന്നു.
