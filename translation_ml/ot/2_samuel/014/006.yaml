  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജാവിനോടുള്ള ആദരസൂചകമായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു; സ്ത്രീലിംഗത്തിലുള്ള വിനയപൂർവമായ ആത്മപരാമർശം വ്യക്തമായി നിലനിർത്തി.
