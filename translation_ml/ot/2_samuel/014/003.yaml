source:
  edition: WLC
  text: וּ/בָאת֙ אֶל הַ/מֶּ֔לֶךְ וְ/דִבַּ֥רְתְּ אֵלָ֖י/ו כַּ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יָּ֧שֶׂם יוֹאָ֛ב אֶת הַ/דְּבָרִ֖ים בְּ/פִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/003.yaml
  text: Then go to the king and speak to him in this way[a]. And Joab put the words in her mouth.
translation:
  language: ml
  text: പിന്നെ രാജാവിന്റെ അടുക്കൽ ചെന്ന് അദ്ദേഹത്തോട് ഇപ്രകാരം സംസാരിക്കുക. യോവാബ് ആ വാക്കുകൾ അവളുടെ വായിൽ വെച്ചുകൊടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വാക്കുകൾ അവളുടെ വായിൽ വെച്ചുകൊടുത്തു” എന്നത്, അവൾ പറയേണ്ട വാക്കുകൾ യോവാബ് പറഞ്ഞുകൊടുത്തു എന്നർഥമുള്ള ഒരു എബ്രായ ശൈലിപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת
  choice: പിന്നെ … ചെന്ന്
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിൽ വരുന്ന രണ്ടാം പുരുഷ സ്ത്രീലിംഗ ക്രിയയുടെ ആജ്ഞാസ്വഭാവവും അടുത്തതായി ചെയ്യേണ്ട പ്രവൃത്തിയെന്ന ക്രമവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֶל־הַמֶּלֶךְ
  choice: രാജാവിന്റെ അടുക്കൽ
  rationale: אֶל സൂചിപ്പിക്കുന്ന രാജാവിന്റെ അടുത്തേക്കുള്ള ഗതി വ്യക്തമായി നൽകുന്നു.
- source_word: וְדִבַּרְתְּ אֵלָיו
  choice: അദ്ദേഹത്തോട് … സംസാരിക്കുക
  rationale: דבר אֶל എന്ന പ്രയോഗത്തിന്റെ ‘ഒരാളോട് സംസാരിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സ്ത്രീയോടുള്ള നിർദേശത്തിന്റെ ആജ്ഞാസ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: כַּדָּבָר הַזֶּה
  choice: ഇപ്രകാരം
  rationale: യോവാബ് നിർദേശിച്ച പ്രസംഗത്തിന്റെ രീതിയും ഉള്ളടക്കവും സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് സംക്ഷിപ്തവും മാന്യവുമായ സ്വാഭാവിക മലയാളം.
- source_word: וַיָּשֶׂם
  choice: വെച്ചുകൊടുത്തു
  rationale: שׂים എന്നതിന്റെ ‘വെക്കുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നതോടൊപ്പം, പറയാനുള്ള വാക്കുകൾ നൽകിക്കൊടുത്തു എന്ന സന്ദർഭാർഥവും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֶת־הַדְּבָרִים
  choice: ആ വാക്കുകൾ
  rationale: നേരത്തെ സൂചിപ്പിച്ച പ്രത്യേക പ്രസംഗവാക്കുകളെയാണ് ബഹുവചനമായ דְּבָרִים ഉദ്ദേശിക്കുന്നത്; ‘ആ’ എന്നത് ഈ തിരിച്ചുസൂചന വ്യക്തമാക്കുന്നു.
- source_word: בְּפִיהָ
  choice: അവളുടെ വായിൽ
  rationale: എന്തു പറയണമെന്ന് ഒരാൾക്കു പറഞ്ഞുകൊടുക്കുക എന്ന എബ്രായ ശൈലിയുടെ ദൃശ്യരൂപം മാറ്റാതെ സൂക്ഷിക്കുന്നു.
