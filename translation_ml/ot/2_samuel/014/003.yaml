  source_fidelity: 'Hebrew instructional perfects are appropriately rendered as directives: “go … speak.” The final clause correctly retains the idiom of Joab putting the words in the woman’s mouth. The demonstrative “ആ വാക്കുകൾ” suitably refers to the speech just introduced.'
