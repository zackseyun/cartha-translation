translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. മൂലത്തിലെ ‘വാക്കുകൾ വായിൽ വെക്കുക’ എന്ന ദൃശ്യമായ ശൈലിപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
