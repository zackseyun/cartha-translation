  terminology: “രാജാവിന്റെ അടുക്കൽ,” “അദ്ദേഹത്തോട്,” and “ഇപ്രകാരം” fit the respectful narrative register. “വായിൽ വെച്ചുകൊടുത്തു” preserves the Hebrew image while remaining intelligible with a note. The note should not add the potentially stronger claim that the wording was “exact”; it is sufficient to say that Joab supplied the words she was to say.
