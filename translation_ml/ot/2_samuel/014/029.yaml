base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
translation:
  language: ml
  text: അബ്ശാലോം തന്നെ രാജാവിന്റെ അടുക്കലേക്കു അയയ്ക്കാൻ യോവാബിന്റെ അടുക്കൽ ആളയച്ചു. എന്നാൽ യോവാബ് അബ്ശാലോമിന്റെ അടുക്കലേക്കു വരാൻ സമ്മതിച്ചില്ല[a]. അബ്ശാലോം വീണ്ടും, രണ്ടാം പ്രാവശ്യം, ആളയച്ചു; എന്നാൽ യോവാബ് അബ്ശാലോമിന്റെ അടുക്കലേക്കു വരാൻ സമ്മതിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “അബ്ശാലോമിന്റെ അടുക്കലേക്കു വരാൻ വിസമ്മതിച്ചു.” അക്ഷരാർഥം: “വരാൻ സമ്മതിച്ചില്ല” അല്ലെങ്കിൽ “വരാൻ മനസ്സായില്ല.”'
    reason: אָבָה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘സമ്മതിക്കുക/മനസ്സാകുക’ എന്നാണ്; സന്ദർഭത്തിൽ ‘വിസമ്മതിക്കുക’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: וַיִּשְׁלַח אַבְשָׁלוֹם אֶל יוֹאָב
  choice: അബ്ശാലോം ... യോവാബിന്റെ അടുക്കൽ ആളയച്ചു
  rationale: שׁלח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തിക്കൊണ്ട്, ഒരാളെ വിളിപ്പിക്കാനോ സന്ദേശം അറിയിക്കാനോ മറ്റൊരാളെ അയയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ് ‘അടുക്കൽ ആളയച്ചു’.
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  choice: തന്നെ രാജാവിന്റെ അടുക്കലേക്ക് അയയ്ക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive ഘടനയും אֹתוֹ എന്ന സർവനാമം അബ്ശാലോമിനെ സൂചിപ്പിക്കുന്നതും നേരിട്ട് നിലനിർത്തുന്നു; യോവാബ് രാജാവിലേക്കുള്ള പ്രവേശനം ഒരുക്കണമെന്ന ആശയം ഉറവിടത്തേക്കാൾ വിശദീകരിച്ചിട്ടില്ല.
- source_word: וְלֹא אָבָה לָבוֹא אֵלָיו
  choice: എന്നാൽ യോവാബിന് അബ്ശാലോമിന്റെ അടുക്കൽ വരാൻ മനസ്സായില്ല
  rationale: אָבָה എന്നത് ‘മനസ്സാകുക/സമ്മതിക്കുക’ എന്ന അർഥമുള്ളതിനാൽ ശക്തമായ ‘നിരസിച്ചു’ എന്നതിനു പകരം ‘മനസ്സായില്ല’ തിരഞ്ഞെടുത്തു. മലയാളത്തിൽ സർവനാമകുഴപ്പം ഒഴിവാക്കാൻ വ്യക്തിനാമങ്ങൾ വ്യക്തമാക്കി.
- source_word: עוֹד שֵׁנִית
  choice: വീണ്ടും രണ്ടാം പ്രാവശ്യവും
  rationale: עוֹד എന്ന ‘വീണ്ടും’ എന്ന ആശയവും שֵׁנִית എന്ന ‘രണ്ടാം പ്രാവശ്യം’ എന്ന ആശയവും ഉറവിടത്തിലെ ആവർത്തന ഊന്നലോടെ നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁלַח ... וְלֹא אָבָה ... וַיִּשְׁלַח ... וְלֹא אָבָה
  choice: ആളയച്ചു ... മനസ്സായില്ല ... വീണ്ടും ... ആളയച്ചു ... മനസ്സായില്ല
  rationale: എബ്രായ വിവരണത്തിലെ ആവർത്തനഘടനയും മുന്നോട്ടുള്ള ഗതിയും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിച്ചു.
