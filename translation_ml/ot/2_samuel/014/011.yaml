source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ יִזְכָּר נָ֨א הַ/מֶּ֜לֶךְ אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ מ/הרבית גֹּאֵ֤ל הַ/דָּם֙ לְ/שַׁחֵ֔ת וְ/לֹ֥א יַשְׁמִ֖ידוּ אֶת בְּנִ֑/י וַ/יֹּ֨אמֶר֙ חַי יְהוָ֔ה אִם יִפֹּ֛ל מִ/שַּׂעֲרַ֥ת בְּנֵ֖/ךְ אָֽרְצָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/011.yaml
  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ പറഞ്ഞു: “രക്തപ്രതികാരകൻ[a] വീണ്ടും വീണ്ടും നാശം വരുത്താതിരിക്കാനും അവർ എന്റെ മകനെ നശിപ്പിക്കാതിരിക്കാനും രാജാവ് അങ്ങയുടെ ദൈവമായ യഹ്‌വെയെ ഓർക്കണമേ.” രാജാവ് പറഞ്ഞു: “യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെ,[b] നിന്റെ മകന്റെ ഒരു മുടിപോലും നിലത്തു വീഴുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രക്തത്തിനുള്ള പ്രതികാരം ചെയ്യുന്ന അടുത്ത ബന്ധു.”
    reason: lexical_alternative
  - marker: b
    text: ഇത് യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതിനെ അടിസ്ഥാനമാക്കി ആണയിടുന്ന ശപഥപ്രയോഗമാണ്. തുടർന്നുള്ള “ഒരു മുടിപോലും നിലത്തു വീഴുകയില്ല” എന്നത് സമ്പൂർണ സംരക്ഷണം ഉറപ്പുനൽകുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: idiom_explanation
lexical_decisions:
- source_word: יִזְכָּר נָא
  choice: രാജാവ് ... ഓർക്കണമേ
  rationale: ജസ്സീവ് രൂപത്തോടുകൂടിയ נָא രാജാവിനോടുള്ള വിനയപൂർവമായ അപേക്ഷയാണ്; ‘ഓർക്കണമേ’ അതിന്റെ ആദരവുള്ള അഭ്യർഥനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: അങ്ങയുടെ ദൈവമായ യഹ്‌വെ
  rationale: ദൈവനാമം പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; രാജാവിനെ അഭിസംബോധന ചെയ്യുന്ന ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
- source_word: מֵהַרְבּוֹת גֹּאֵל הַדָּם לְשַׁחֵת
  choice: രക്തപ്രതികാരകൻ വീണ്ടും വീണ്ടും നാശം വരുത്താതിരിക്കാനും
  rationale: רבה എന്ന ഹിഫീൽ ക്രിയയുടെ വർധനയുടെയോ ആവർത്തനത്തിന്റെയോ ഭാവം ‘വീണ്ടും വീണ്ടും’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; ഗദ്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി മുഴുവൻ പ്രയോഗം നാശപ്രവൃത്തി തുടരാതിരിക്കാനുള്ള അപേക്ഷയായി നൽകി.
- source_word: גֹּאֵל הַדָּם
  choice: രക്തപ്രതികാരകൻ
  rationale: കൊല്ലപ്പെട്ടവന്റെ അടുത്ത ബന്ധുവായി രക്തത്തിന് പ്രതികാരം ചെയ്യുന്ന നിയമ-സാമൂഹിക ചുമതലയുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും മനസ്സിലാകുന്നതുമായ പദം.
- source_word: וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  choice: അവർ എന്റെ മകനെ നശിപ്പിക്കാതിരിക്കാനും
  rationale: എബ്രായത്തിലെ ബഹുവചനക്രിയയെ അവ്യക്തമായ ബഹുവചന കർത്താവായ ‘അവർ’ എന്നു നിലനിർത്തി; പ്രതികാരകന്റെ കൂട്ടരാണെന്ന് പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർത്തില്ല.
- source_word: חַי יְהוָה
  choice: യഹ്‌വെ ജീവിക്കുന്നതാണേ
  rationale: ദൈവത്തിന്റെ ജീവനിൽ ആണയിടുന്ന എബ്രായ ശപഥസൂത്രത്തിന്റെ ഗൗരവവും രൂപകൽപ്പനയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת בְּנֵךְ אָרְצָה
  choice: നിന്റെ മകന്റെ ഒരു മുടിപോലും നിലത്തു വീഴുകയില്ല
  rationale: ശപഥത്തിനു ശേഷമുള്ള אִם ശക്തമായ നിഷേധമായി പ്രവർത്തിക്കുന്നു; ഒരു മുടിപോലും വീഴില്ല എന്ന പ്രയോഗം സമ്പൂർണ സംരക്ഷണത്തിന്റെ എബ്രായ അതിശയോക്തി സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുരക്ഷര ദൈവനാമത്തെ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു; ‘യഹ്‌വെ’ ലഭ്യമായ ഉച്ചാരണസാക്ഷ്യത്തോട് അടുത്ത മലയാളരൂപമാണ്.
- issue: രാജാവിന്റെ വാക്കുകളുടെ ശപഥസ്വഭാവം
  choice: യഹ്‌വെ ജീവിക്കുന്നതാണേ
  alternative: യഹ്‌വെയാണെ
  rationale: חַי יְהוָה ഒരു ഔപചാരിക ശപഥസൂത്രമാണ്. സംക്ഷിപ്തമായ ആണയിടൽ മാത്രം നൽകാതെ ദൈവം ജീവിക്കുന്നു എന്ന മൂലവാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഉള്ളടക്കം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവോടെയും ഗൗരവത്തോടെയും ഉള്ള മലയാളം. സ്ത്രീ രാജാവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങയുടെ’ എന്നും രാജാവ് അവളോട് പറയുമ്പോൾ മൂലത്തിലെ ഏകവചനത്തിന് അനുസരിച്ച് ‘നിന്റെ’ എന്നും ഉപയോഗിച്ചു. നിയമപരമായ גֹּאֵל הַדָּם എന്ന പദം മുഖ്യവാചകത്തിൽ ചുരുക്കി നൽകി, അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
