    rationale: חַי יְהוָה is an oath formula meaning “As Yahweh lives.” The current Malayalam wording is grammatically possible in isolation but does not function naturally as a solemn oath. “യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെ” supplies an idiomatic oath-like formulation without weakening its force.
