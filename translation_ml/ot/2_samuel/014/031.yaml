  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣קָם יוֹאָ֔ב וַ/יָּבֹ֥א אֶל אַבְשָׁל֖וֹם הַ/בָּ֑יְתָ/ה וַ/יֹּ֣אמֶר אֵלָ֔י/ו לָ֣/מָּה הִצִּ֧יתוּ עֲבָדֶ֛/ךָ אֶת הַ/חֶלְקָ֥ה אֲשֶׁר לִ֖/י בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/031.yaml
  text: Then Joab arose and went to Absalom’s house and said to him[a], “Why have your servants set my field on fire?”
translation:
  language: ml
  text: 'അപ്പോൾ യോവാബ് എഴുന്നേറ്റ് അബ്ശാലോമിന്റെ വീട്ടിലേക്കു ചെന്നു. അവൻ അബ്ശാലോമിനോടു പറഞ്ഞു: “നിന്റെ ദാസന്മാർ എന്റെ വയലിന് തീ വെച്ചത് എന്തിന്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “എനിക്കുള്ള ഭൂഭാഗത്തിനു തീകൊണ്ട് തീ പിടിപ്പിച്ചത് എന്തിന്?” ഇവിടെ ‘വയലിന് തീ വെച്ചത്’ എന്നത് സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: അപ്പോൾ യോവാബ് എഴുന്നേറ്റ്
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ക്രമാനുഗതതയും ‘എഴുന്നേറ്റ്’ ക്രിയയുടെ അടിസ്ഥാന അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  choice: അബ്ശാലോമിന്റെ വീട്ടിലേക്കു ചെന്നു
  rationale: ദിശാസൂചകമായ ה־ ഉള്ള הַבָּיְתָה ‘വീട്ടിലേക്കു’ എന്ന ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അത് അബ്ശാലോമിന്റെ വസതിയാണ്.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: അവൻ അബ്ശാലോമിനോടു പറഞ്ഞു
  rationale: മലയാളത്തിൽ സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കിക്കൊണ്ട് ഹീബ്രുവിലെ ‘അവനോടു പറഞ്ഞു’ എന്ന അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הִצִּיתוּ
  choice: തീ കൊളുത്തിയത്
  rationale: יצת എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം എന്തിനെയെങ്കിലും കത്തിക്കുക അഥവാ തീ പിടിപ്പിക്കുക എന്ന കാരണാർഥം നൽകുന്നു; ‘തീ കൊളുത്തുക’ സാധാരണവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: עֲבָדֶךָ
  choice: നിന്റെ ദാസന്മാർ
  rationale: രൂപം ഏകവചനസദൃശമായിരുന്നാലും הִצִּיתוּ എന്ന ക്രിയ ബഹുവചനമാണ്; സന്ദർഭവും വാക്യസമ്മതിയും അനുസരിച്ച് കൂട്ടമായ ദാസന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: הַחֶלְקָה אֲשֶׁר לִי
  choice: എന്റെ നിലത്തിന്
  rationale: ‘എനിക്കുള്ള ഭൂഭാഗം’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്റെ നിലം’ എന്നു ചുരുക്കുന്നു; חֶלְקָה ഒരു ഭൂഖണ്ഡമോ കൃഷിനിലമോ സൂചിപ്പിക്കുന്നു.
- source_word: בָּאֵשׁ
  choice: തീ കൊളുത്തിയത്
  rationale: בְּ ഇവിടെ ഉപാധിയെ, അഥവാ ‘തീകൊണ്ട്’, സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിലത്തിന് തീ കൊളുത്തുക’ എന്നതാണ് സ്വാഭാവിക പ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘യോവാബ്’, ‘അബ്ശാലോം’ എന്നീ പരമ്പരാഗത മലയാള ബൈബിൾ നാമരൂപങ്ങൾ നിലനിർത്തി; പഴഞ്ചൻ വാക്യക്രമവും അനാവശ്യമായ വ്യാഖ്യാനവിസ്താരവും ഒഴിവാക്കി.
