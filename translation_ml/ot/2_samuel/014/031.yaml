  to: 'അപ്പോൾ യോവാബ് എഴുന്നേറ്റ് അബ്ശാലോമിന്റെ വീട്ടിലേക്കു ചെന്നു. അവൻ അബ്ശാലോമിനോടു പറഞ്ഞു: “നിന്റെ ദാസന്മാർ എന്റെ വയലിന് തീ വെച്ചത് എന്തിന്?[a]”'
