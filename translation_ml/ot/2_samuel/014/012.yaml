id: 2SA.14.12
reference: 2 Samuel 14:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה תְּדַבֶּר נָ֧א שִׁפְחָתְ/ךָ֛ אֶל אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֖אמֶר דַּבֵּֽרִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/012.yaml
  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
translation:
  language: ml
  text: 'അപ്പോൾ ആ സ്ത്രീ പറഞ്ഞു: “അങ്ങയുടെ ദാസി എന്റെ യജമാനനായ രാജാവിനോട് ഒരു വാക്ക് പറയാൻ അനുവദിക്കണമേ.” രാജാവ് പറഞ്ഞു: “പറയുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: സന്ദർഭത്തിൽ രാജാവിനോടു സംസാരിക്കുന്ന സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ആ സ്ത്രീ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: תְּדַבֶּר נָא
  choice: പറയാൻ ... അനുവദിക്കണമേ
  rationale: ജസ്സീവ്/ഇംപർഫെക്റ്റിനോടു ചേർന്ന נָא വിനീതമായ അപേക്ഷയാണ്; ഈ പ്രയോഗം രാജാവിനോടുള്ള ആദരപൂർവമായ അനുമതിയാചനം പകർന്നു നൽകുന്നു.
- source_word: שִׁפְחָתְךָ
  choice: അങ്ങയുടെ ദാസിയെ
  rationale: എബ്രായപദം വ്യക്തമായി സ്ത്രീലിംഗമായ ‘ദാസി’യെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അതു സ്വാഭാവികമായി നിലനിർത്താനാകുന്നതിനാൽ പൊതുവായ ‘ദാസൻ/ദാസർ’ എന്നതിലേക്കു മാറ്റേണ്ടതില്ല.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവിനോട്
  rationale: אֲדֹנִי ഇവിടെ ദൈവിക ശീർഷകമല്ല, മനുഷ്യനായ രാജാവിനുള്ള ആദരസംബോധനയാണ്; ‘യജമാനനായ രാജാവ്’ ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: דָּבָר
  choice: ഒരു വാക്ക്
  rationale: ‘വാക്ക്/കാര്യം’ എന്ന അർത്ഥപരിധിയിൽ, ഹീബ്രുവിലെ ചുരുക്കമുള്ള വിനീതപ്രയോഗം ഔപചാരികമായി സംരക്ഷിക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: രാജാവ് പറഞ്ഞു
  rationale: ഹീബ്രുവിൽ കർത്താവ് സർവനാമത്തിലൂടെ സൂചിതമാണെങ്കിലും മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭത്തിലെ കർത്താവായ രാജാവിനെ വ്യക്തമാക്കുന്നു.
- source_word: דַּבֵּרִי
  choice: പറയുക
  rationale: സ്ത്രീയോടുള്ള നേരിട്ടുള്ള ആജ്ഞയാണ്; മലയാളത്തിലെ മാന്യമായ ഏകവചന ആജ്ഞാരൂപം സംക്ഷിപ്തതയും രാജകീയ സംഭാഷണത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ രാജസഭാ സംഭാഷണശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ സ്ത്രീലിംഗ ദാസീപദം മുഖ്യപാഠത്തിൽ തന്നെ സംരക്ഷിച്ചതിനാൽ ഇംഗ്ലീഷ് consultation layer-ലുള്ളപോലെ അടിക്കുറിപ്പ് ആവശ്യമില്ല. ‘അങ്ങയുടെ’ എന്നും ‘അനുവദിക്കണമേ’ എന്നും ഉപയോഗിച്ച് വിനയവും സാമൂഹിക അകലവും സൂചിപ്പിച്ചു.
