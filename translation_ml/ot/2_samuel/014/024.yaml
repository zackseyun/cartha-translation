  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ יִסֹּ֣ב אֶל בֵּית֔/וֹ וּ/פָנַ֖/י לֹ֣א יִרְאֶ֑ה וַ/יִּסֹּ֤ב אַבְשָׁלוֹם֙ אֶל בֵּית֔/וֹ וּ/פְנֵ֥י הַ/מֶּ֖לֶךְ לֹ֥א רָאָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/024.yaml
  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
translation:
  language: ml
  text: 'എന്നാൽ രാജാവ് പറഞ്ഞു: “അവൻ തന്റെ വീട്ടിലേക്കു മടങ്ങിപ്പോകട്ടെ; എന്റെ മുഖം കാണരുത്.[a]” അങ്ങനെ അബ്ശാലോം തന്റെ വീട്ടിലേക്കു മടങ്ങിപ്പോയി; രാജാവിന്റെ മുഖം കണ്ടില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ഇവിടെ “എന്റെ മുഖം കാണുക,” പിന്നീട് “രാജാവിന്റെ മുഖം കാണുക” എന്നാണ്; ഒരാളുടെ സന്നിധിയിൽ ചെല്ലുന്നതിനെയോ അയാളെ അഭിമുഖമായി കാണാൻ അനുമതി ലഭിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסֹּב / וַיִּסֹּב (סבב)
  choice: മടങ്ങിപ്പോകട്ടെ / മടങ്ങിപ്പോയി
  rationale: ഇവിടെ אֶל־בֵּיתוֹ എന്ന ദിശാസൂചനയോടുകൂടിയ סבב, രാജസന്നിധിയിൽനിന്ന് സ്വന്തം വീട്ടിലേക്കു തിരിച്ചുവിടപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഒരേ ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: בֵּיתוֹ
  choice: തന്റെ വീട്
  rationale: בַּיִת എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘വീട്’ നിലനിർത്തുകയും പ്രത്യയം സൂചിപ്പിക്കുന്ന ഉടമസ്ഥത ‘തന്റെ’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וּפָנַי ... לֹא יִרְאֶה
  choice: എന്റെ മുഖം കാണരുത്
  rationale: മുഖം കാണുക എന്ന എബ്രായ പ്രയോഗം നേരിട്ടുള്ള സന്നിധിയെയോ അഭിമുഖാനുമതിയെയോ സൂചിപ്പിക്കുന്നു. വാക്യത്തിലെ ആവർത്തനവും ആജ്ഞാസ്വഭാവവും നിലനിർത്താൻ സാക്ഷാൽ പ്രയോഗം സംരക്ഷിച്ചു.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: രാജാവിന്റെ മുഖം കണ്ടില്ല
  rationale: രാജാവിന്റെ കല്പനയിലെ ‘മുഖം കാണുക’ എന്ന പ്രയോഗം ആഖ്യാനത്തിൽ മനപ്പൂർവം ആവർത്തിക്കുന്നതിനാൽ അതേ രൂപം നിലനിർത്തി.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: מֶלֶךְ എന്ന പദത്തിന്റെ സാധാരണയും സന്ദർഭോചിതവുമായ മലയാളപരിഭാഷ.
- source_word: אַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: എബ്രായ നാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ രാജാവ് പറഞ്ഞു
  rationale: 'വാവ്-തുടർച്ച ഇവിടെ സംഭവക്രമത്തോടൊപ്പം നേരിയ വൈരുധ്യവും സൂചിപ്പിക്കുന്നു: അബ്ശാലോമിനെ മടക്കിക്കൊണ്ടുവരാൻ അനുവദിച്ചെങ്കിലും രാജാവ് അവനെ കാണാൻ വിസമ്മതിക്കുന്നു.'
theological_decisions:
- issue: ‘എന്റെ മുഖം കാണുക / രാജാവിന്റെ മുഖം കാണുക’ എന്ന സാക്ഷാൽ പ്രയോഗമോ, രാജസന്നിധിയിലേക്കുള്ള പ്രവേശനം എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷയോ
  choice: സാക്ഷാൽ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘എന്റെ സന്നിധിയിൽ വരരുത്’ / ‘രാജാവിനെ കാണാൻ അനുമതി ലഭിച്ചില്ല’
  rationale: എബ്രായത്തിലെ ആവർത്തനവും ആഖ്യാനത്തിന്റെ ഊന്നലും സംരക്ഷിക്കാനും, സാമൂഹിക-രാജകീയ അർഥം ആവശ്യത്തിലധികം വ്യാഖ്യാനിക്കാതിരിക്കാനും സാക്ഷാൽ രൂപം നിലനിർത്തി; അടിക്കുറിപ്പ് അതിന്റെ പ്രയോഗാർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ സമാന്തര ആവർത്തനം നിലനിർത്തി; ‘തിരിഞ്ഞുപോകുക’ എന്ന കൃത്രിമമായ സാക്ഷാൽരൂപത്തിനു പകരം സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘മടങ്ങിപ്പോകുക’ ഉപയോഗിച്ചു.
