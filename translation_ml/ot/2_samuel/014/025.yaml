source:
  edition: WLC
  text: וּ/כְ/אַבְשָׁל֗וֹם לֹא הָיָ֧ה אִישׁ יָפֶ֛ה בְּ/כָל יִשְׂרָאֵ֖ל לְ/הַלֵּ֣ל מְאֹ֑ד מִ/כַּ֤ף רַגְל/וֹ֙ וְ/עַ֣ד קָדְקֳד֔/וֹ לֹא הָ֥יָה ב֖/וֹ מֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/025.yaml
  text: In all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
translation:
  language: ml
  text: ഇസ്രായേലിലൊക്കെയും അബ്ശാലോമിനെപ്പോലെ അത്യന്തം പ്രശംസിക്കപ്പെട്ട സൗന്ദര്യമുള്ള ഒരു പുരുഷനും ഉണ്ടായിരുന്നില്ല.[a] ഉള്ളങ്കാൽമുതൽ നെറുകവരെ അവനിൽ ഒരു ശാരീരിക ന്യൂനതയും ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വളരെയധികം പ്രശംസിക്കപ്പെടേണ്ടവൻ.” എബ്രായപ്രയോഗം അബ്ശാലോമിന്റെ രൂപസൗന്ദര്യം അസാധാരണമായി പ്രശംസിക്കപ്പെട്ടിരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם
  choice: അബ്ശാലോമിനെപ്പോലെ
  rationale: כְּ എന്ന താരതമ്യഘടകം നിലനിർത്തി, ഇസ്രായേലിൽ അവനോട് തുല്യനായ ആരുമില്ലെന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഉറവിടത്തിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: לֹא הָיָה אִישׁ יָפֶה בְּכָל יִשְׂרָאֵל
  choice: ഇസ്രായേലിലൊക്കെയും ... സൗന്ദര്യമുള്ള ഒരു പുരുഷനും ഉണ്ടായിരുന്നില്ല
  rationale: അബ്ശാലോമിന്റെ ശാരീരിക സൗന്ദര്യത്തിന് ഇസ്രായേലിൽ തുല്യനായ പുരുഷനില്ലെന്ന അതിശയോക്തിപരമായ താരതമ്യഭാവം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְהַלֵּל מְאֹד
  choice: അവൻ അത്യന്തം പ്രശംസിക്കപ്പെട്ടു
  rationale: അവന്റെ രൂപസൗന്ദര്യം അസാധാരണമായ തോതിൽ പ്രശംസിക്കപ്പെട്ടു എന്ന അർഥം നൽകുന്നു; ഹീബ്രു പ്രയോഗത്തിന്റെ അല്പം സങ്കുചിതമായ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מִכַּף רַגְלוֹ
  choice: ഉള്ളങ്കാൽമുതൽ
  rationale: കാൽ സംബന്ധമായി כַּף എന്നത് പാദത്തിന്റെ അടിവശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഉള്ളങ്കാൽ’ സ്വാഭാവികവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: וְעַד קָדְקֳדוֹ
  choice: നെറുകവരെ
  rationale: קָדְקֹד തലയുടെ മുകൾഭാഗം അഥവാ നെറുക എന്നർഥം നൽകുന്നു; ശരീരത്തിന്റെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെയുള്ള സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: לֹא הָיָה בוֹ מוּם
  choice: അവനിൽ ഒരു ന്യൂനതയും ഉണ്ടായിരുന്നില്ല
  rationale: מוּם ഇവിടെ ശാരീരികമായ കുറവോ വൈകല്യമോ സൂചിപ്പിക്കുന്നു. ‘ന്യൂനത’ വിവരണത്തിന്റെ മാന്യമായ ശൈലി നിലനിർത്തുകയും ധാർമിക കളങ്കമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ‘ഉള്ളങ്കാൽമുതൽ നെറുകവരെ’ എന്ന ശരീരാവയവപരമായ സമഗ്രപ്രയോഗം നിലനിർത്തി; ‘ന്യൂനത’ ഇവിടെ ശാരീരിക കുറവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
