  text: וַ֠/תֹּאמֶר הָ/אִשָּׁ֤ה הַ/תְּקֹעִית֙ אֶל הַ/מֶּ֔לֶךְ וַ/תִּפֹּ֧ל עַל אַפֶּ֛י/הָ אַ֖רְצָ/ה וַ/תִּשְׁתָּ֑חוּ וַ/תֹּ֖אמֶר הוֹשִׁ֥עָ/ה הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/004.yaml
  text: Then the woman from Tekoa spoke to the king[a]. She fell with her face to the ground and bowed down, and she said, “Save me[b], O king!”
translation:
  language: ml
  text: 'അപ്പോൾ തെക്കോവയിൽനിന്നുള്ള സ്ത്രീ രാജാവിനോടു സംസാരിച്ചു.[a] അവൾ മുഖം നിലത്തേക്കു വീണു കുമ്പിട്ടു; പിന്നെ പറഞ്ഞു: “രാജാവേ, എന്നെ രക്ഷിക്കണമേ!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “തെക്കോവക്കാരിയായ സ്ത്രീ.”'
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ: “രക്ഷിക്കണമേ, രാജാവേ”; സന്ദർഭത്തിൽ സൂചിതമായ “എന്നെ” മലയാളത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  choice: തെക്കോവയിൽനിന്നുള്ള സ്ത്രീ
  rationale: സ്ത്രീയെ അവളുടെ സ്വദേശമായ തെക്കോവയുമായി ബന്ധിപ്പിക്കുന്ന വിശേഷണരൂപം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתֹּאמֶר ... אֶל הַמֶּלֶךְ
  choice: രാജാവിനോടു സംസാരിച്ചു
  rationale: ആദ്യത്തെ אָמַר രാജാവിനെ സമീപിച്ച് സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; വാക്യത്തിലെ രണ്ടാമത്തെ ക്രിയ നേരിട്ടുള്ള ഉദ്ധരണിക്ക് മുമ്പ് ‘പറഞ്ഞു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וַתִּפֹּל עַל אַפֶּיהָ אַרְצָה
  choice: മുഖം നിലത്തുവീഴത്തക്കവിധം സാഷ്ടാംഗം വീണു
  rationale: മുഖം നിലത്തേക്കാക്കി വീഴുന്ന ആഴമായ വിനയത്തിന്റെയും അപേക്ഷയുടെയും ശരീരഭാവം മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: וַתִּשְׁתָּחוּ
  choice: വണങ്ങി
  rationale: ആദരവോടെയും അപേക്ഷയോടെയും കുനിയുകയോ പ്രണമിക്കുകയോ ചെയ്യുന്ന അർഥം നൽകുന്നു; ആരാധന എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: הוֹשִׁיעָה
  choice: എന്നെ രക്ഷിക്കണമേ
  rationale: യָשַׁע എന്ന ധാതുവിന്റെ ആജ്ഞാരൂപം രക്ഷയ്ക്കായുള്ള അടിയന്തര അപേക്ഷയാണ്; ഹീബ്രുവിൽ പ്രകടമല്ലാത്ത കർമം സന്ദർഭത്തിൽ അപേക്ഷിക്കുന്ന സ്ത്രീ തന്നെയായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവേ
  rationale: നേരിട്ടുള്ള സംബോധനത്തിന്റെ ഔപചാരികവും അപേക്ഷാപൂർണവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജസന്നിധിയിലെ വിനയവും അപേക്ഷയുടെ അടിയന്തരതയും നിലനിർത്തിയിരിക്കുന്നു.
