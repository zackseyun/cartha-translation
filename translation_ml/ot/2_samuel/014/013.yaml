  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה וְ/לָ֧/מָּה חָשַׁ֛בְתָּה כָּ/זֹ֖את עַל עַ֣ם אֱלֹהִ֑ים וּ/מִ/דַּבֵּ֨ר הַ/מֶּ֜לֶךְ הַ/דָּבָ֤ר הַ/זֶּה֙ כְּ/אָשֵׁ֔ם לְ/בִלְתִּ֛י הָשִׁ֥יב הַ/מֶּ֖לֶךְ אֶֽת נִדְּחֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
translation:
  language: ml
  text: 'അപ്പോൾ ആ സ്ത്രീ പറഞ്ഞു[a]: “പിന്നെ എന്തുകൊണ്ടാണ് ദൈവജനത്തിനെതിരെ ഇങ്ങനെയൊരു കാര്യം ആസൂത്രണം ചെയ്തത്? ഈ വാക്ക് പറഞ്ഞതിലൂടെ രാജാവ് കുറ്റക്കാരനെപ്പോലെയാണ്[b]; എന്തെന്നാൽ, രാജാവ് തന്റെ നാടുകടത്തപ്പെട്ടവനെ തിരികെ കൊണ്ടുവന്നിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദൈവജനത്തിനെതിരെ ഇങ്ങനെയൊരു കാര്യം ചിന്തിച്ചത്/നിരൂപിച്ചത് എന്തുകൊണ്ട്?”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “രാജാവ് കുറ്റക്കാരനെപ്പോലെയാണ്.” അതായത്, തന്റെ നാടുകടത്തപ്പെട്ടവനെ തിരികെ കൊണ്ടുവരാത്തതിനാൽ രാജാവിന്റെ സ്വന്തം വിധിവാക്ക് അവന്റെ കുറ്റത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָשַׁבְתָּה
  choice: ആസൂത്രണം ചെയ്തത്
  rationale: ക്രിയയ്ക്ക് ചിന്തിക്കുക, നിരൂപിക്കുക, ആസൂത്രണം ചെയ്യുക എന്നീ അർഥങ്ങളുണ്ട്. ദാവീദിന്റെ അബ്ശാലോമിനോടുള്ള നയത്തെ ചോദ്യം ചെയ്യുന്ന സന്ദർഭത്തിൽ ഉദ്ദേശ്യപൂർവമായ നടപടിയെന്ന ഭാവം ‘ആസൂത്രണം’ വ്യക്തമാക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כָּזֹאת
  choice: ഇങ്ങനെയൊരു കാര്യം
  rationale: മുമ്പുള്ള ഉപമ സൂചിപ്പിച്ച അതേ തരത്തിലുള്ള നടപടിയിലേക്കാണ് നിർദേശകം വിരൽചൂണ്ടുന്നത്; ആക്ഷേപത്തിന്റെ ശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണിത്.
- source_word: עַל עַם אֱלֹהִים
  choice: ദൈവജനത്തിനെതിരെ
  rationale: חשב എന്ന ക്രിയയോടൊപ്പമുള്ള עַל സന്ദർഭത്തിൽ പ്രതികൂലമായ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു. ‘ദൈവജനം’ എന്ന വിശാല ഉടമ്പടിപദം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  choice: ഈ വാക്ക് പറഞ്ഞതിലൂടെ രാജാവ്
  rationale: 'מִ + infinitive construct ഇവിടെ മാർഗമോ സാഹചര്യഫലമോ സൂചിപ്പിക്കുന്നു: രാജാവ് വിധി പ്രസ്താവിച്ചതിലൂടെ തന്നെത്തന്നെ കുറ്റവിധിക്കു കീഴിലാക്കുന്നു.'
- source_word: כְּאָשֵׁם
  choice: കുറ്റക്കാരനെപ്പോലെയായിരിക്കുന്നു
  rationale: כְּ എന്ന ഉപസർഗത്തിന്റെ താരതമ്യഭാവം നേരിട്ടുള്ള കുറ്റപ്രഖ്യാപനമായി ലയിപ്പിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: לְבִלְתִּי
  choice: എന്തെന്നാൽ ... ഇല്ല
  rationale: രാജാവ് കുറ്റക്കാരനെപ്പോലെയാകുന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ കാരണസൂചകമായി നൽകുന്നു.
- source_word: הָשִׁיב
  choice: തിരികെ കൊണ്ടുവന്നിട്ടില്ല
  rationale: Hiphil രൂപം ഒരാളെ മടക്കിക്കൊണ്ടുവരുക എന്ന കർത്തൃക അർഥത്തിലാണ്; പ്രവാസത്തിലുള്ള വ്യക്തിയെ സംബന്ധിച്ച് ഇതാണ് ഏറ്റവും മൂർത്തമായ വിവർത്തനം.
- source_word: נִדְּחוֹ
  choice: തന്റെ നാടുകടത്തപ്പെട്ടവനെ
  rationale: נדח എന്നതിന്റെ കർമണി കൃദന്തരൂപം അകറ്റപ്പെട്ടതോ നാടുകടത്തപ്പെട്ടതോ ആയ ഏകവചന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ഉടമസ്ഥബന്ധം ‘തന്റെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദൈവജനം’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: മൂലപാഠത്തിലെ വിശാലമായ ‘ദൈവജനം’ എന്ന പ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: ‘ഇസ്രായേലിനെതിരെ’ എന്നോ ‘അബ്ശാലോമിനും രാജകുടുംബത്തിനുമെതിരെ’ എന്നോ ചുരുക്കുക.
  rationale: സന്ദർഭത്തിൽ രാജാവിന്റെ മകനോടുള്ള നടപടി ഉടമ്പടിസമൂഹത്തെ ബാധിക്കുന്നുവെങ്കിലും, എബ്രായപാഠം ഉദ്ദേശപൂർവം വിശാലമായ പ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്; അതിന്റെ വാചാടോപവ്യാപ്തി പരിഭാഷയിൽ ചുരുക്കരുത്.
- issue: כְּאָשֵׁם എന്നതിലെ താരതമ്യവും കുറ്റബോധവും
  choice: ‘കുറ്റക്കാരനെപ്പോലെ’ എന്ന താരതമ്യം നിലനിർത്തി.
  alternative: ‘രാജാവ് കുറ്റക്കാരനാണ്’ അല്ലെങ്കിൽ ‘കുറ്റക്കാരനായി നിൽക്കുന്നു.’
  rationale: സ്ത്രീയുടെ വാക്ക് രാജാവിന്റെ സ്വന്തം വിധിയുടെ നിഗമനം അവനിലേക്കു തിരിക്കുന്നു; כְּ സൂചിപ്പിക്കുന്ന താരതമ്യം മായ്ച്ച് നേരിട്ടുള്ള അന്തിമ കുറ്റവിധിയാക്കുന്നത് പാഠത്തിലെ വാചാടോപസൂക്ഷ്മതയെ അതിരുകടന്ന് തീർപ്പാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജസഭാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവം സൂക്ഷിച്ചെങ്കിലും പഴഞ്ചൻ പദക്രമം ഒഴിവാക്കി. മൂലത്തിലെ താരതമ്യം, ഉടമസ്ഥബന്ധം, ‘ദൈവജനം’ എന്ന വിശാലത എന്നിവ നിലനിർത്തി.
