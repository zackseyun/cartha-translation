  yaml_path: translation/ot/2_samuel/014/023.yaml
  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
translation:
  language: ml
  text: അങ്ങനെ യോവാബ് എഴുന്നേറ്റ് ഗെശൂരിലേക്കു പോയി, അബ്ശാലോമിനെ യെരൂശലേമിലേക്കു കൊണ്ടുവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അബ്ശാലോമിനെ തിരികെ യെരൂശലേമിലേക്കു കൊണ്ടുവന്നു.” സന്ദർഭം പ്രവാസത്തിൽനിന്നുള്ള മടങ്ങിവരവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും “തിരികെ” എന്ന പദം എബ്രായ ക്രിയയിൽ വ്യക്തമായി ഇല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ വിവരണാത്മക തുടർച്ചയും പ്രവർത്തിക്കാൻ എഴുന്നേൽക്കുന്ന ഭാവവും സംരക്ഷിക്കുന്നു; ‘പുറപ്പെട്ടു’ എന്നതുപോലെ യാത്രയുടെ ആശയം അധികമായി ചേർക്കുന്നില്ല.
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന സാധാരണ വിവരണക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: גְּשׁוּרָה
  choice: ഗെശൂരിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה ലക്ഷ്യത്തിലേക്കുള്ള സഞ്ചാരം സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבֵא
  choice: കൊണ്ടുവന്നു
  rationale: ביא എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘വരുത്തുക/കൊണ്ടുവരുക’ എന്ന അർഥം നൽകുന്നു. പ്രവാസത്തിൽനിന്നുള്ള മടങ്ങിവരവ് സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും ‘തിരികെ’ എന്ന ആശയം ക്രിയയിൽ വ്യക്തമായി ഇല്ല.
- source_word: אֶת אַבְשָׁלוֹם
  choice: അബ്ശാലോമിനെ
  rationale: നേരിട്ടുള്ള കർമസൂചകമായ אֶת മലയാളത്തിൽ കർമവിഭക്തിയായ ‘-നെ’കൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പേരിന്റെ എബ്രായരൂപത്തോട് അടുത്ത ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: יְרוּשָׁלִָם
  choice: യെരൂശലേമിലേക്കു
  rationale: ‘കൊണ്ടുവന്നു’ എന്ന ക്രിയയോടൊപ്പം വാക്യഘടന സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനം മലയാളത്തിൽ ‘-ലേക്കു’കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: തുടർച്ചയായ waw-consecutive ഘടനയിലെ സംഭവക്രമവും മുൻസന്ദർഭത്തിൽനിന്നുള്ള ഫലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
