  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘എഴുന്നേറ്റ് … പോയി’ എന്ന ക്രമം മൂലഭാഷയിലെ തുടർച്ചയായ പ്രവർത്തനങ്ങളെ നിലനിർത്തുന്നു. അടിക്കുറിപ്പുസൂചിക [a] മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
