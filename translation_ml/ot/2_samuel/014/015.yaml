source:
  edition: WLC
  text: וְ֠/עַתָּה אֲשֶׁר בָּ֜אתִי לְ/דַבֵּ֨ר אֶל הַ/מֶּ֤לֶךְ אֲדֹנִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּ֥י יֵֽרְאֻ֖/נִי הָ/עָ֑ם וַ/תֹּ֤אמֶר שִׁפְחָֽתְ/ךָ֙ אֲדַבְּרָה נָּ֣א אֶל הַ/מֶּ֔לֶךְ אוּלַ֛י יַעֲשֶׂ֥ה הַ/מֶּ֖לֶךְ אֶת דְּבַ֥ר אֲמָתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
translation:
  language: ml
  text: 'ഇപ്പോൾ, എന്റെ യജമാനനായ രാജാവിനോടു ഈ കാര്യം പറയാൻ ഞാൻ വന്നത് ജനം എന്നെ ഭയപ്പെടുത്തിയതുകൊണ്ടാണ്.[a] അപ്പോൾ അങ്ങയുടെ ദാസി പറഞ്ഞു: ‘ഞാൻ രാജാവിനോടു സംസാരിക്കട്ടെ; ഒരുപക്ഷേ രാജാവ് തന്റെ ദാസിയുടെ അപേക്ഷ നിറവേറ്റും.’[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജനം എന്നെ പേടിപ്പിച്ചതുകൊണ്ടാണ്.” എബ്രായ ക്രിയയ്ക്ക് ഇവിടെ കാരണാർഥമാണ്; “ജനം എന്നെ ഭയപ്പെടുന്നു” എന്നല്ല.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “തന്റെ ദാസിയുടെ വാക്ക് ചെയ്യും.” ഇവിടെ ഉദ്ദേശിക്കുന്നത് അവളുടെ അഭ്യർഥനയോ അപേക്ഷയോ നിറവേറ്റുക എന്നതാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: സംസാരത്തിലെ ഇപ്പോഴത്തെ വിശദീകരണത്തിലേക്കുള്ള മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; വാക്യബന്ധം വിരാമചിഹ്നത്തിലൂടെയും തുടർച്ചയിലൂടെയും നിലനിൽക്കുന്നു.
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר
  choice: പറയാൻ ഞാൻ വന്നത്
  rationale: വരിക + സംസാരിക്കുക എന്ന എബ്രായ ഘടനയും അവളുടെ ഇപ്പോഴത്തെ സാന്നിധ്യത്തിന്റെ ഉദ്ദേശ്യവും സ്വാഭാവികമായി പകരുന്നു.
- source_word: אֶל הַמֶּלֶךְ אֲדֹנִי
  choice: എന്റെ യജമാനനായ രാജാവിനോടു
  rationale: രാജപദവിയും ആദരസൂചകമായ അഭിസംബോധനയും രണ്ടും നിലനിർത്തുന്നു.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דבר ഇവിടെ ഒറ്റ വാക്കിനേക്കാൾ അവൾ അവതരിപ്പിക്കുന്ന വിഷയത്തെയോ കേസിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי יֵרְאֻנִי הָעָם
  choice: ജനം എന്നെ ഭയപ്പെടുത്തിയതുകൊണ്ടാണ്
  rationale: പിയേൽ രൂപത്തിന്റെ കാരണാർഥം നിലനിർത്തി, ‘ജനം എന്നെ ഭയപ്പെടുന്നു’ എന്ന കുറച്ച് സാധ്യതയുള്ള വായന ഒഴിവാക്കുന്നു.
- source_word: וַתֹּאמֶר שִׁפְחָתְךָ
  choice: അപ്പോൾ അങ്ങയുടെ ദാസി വിചാരിച്ചു
  rationale: സ്വയം താഴ്ത്തിപ്പറയുന്ന രാജസദസ്സിലെ ഭാഷ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് അവളുടെ ഉള്ളിലെ തീരുമാനത്തെ അവതരിപ്പിക്കുന്നതിനാൽ ‘വിചാരിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  choice: ഞാൻ രാജാവിനോടു സംസാരിക്കട്ടെ
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിന്റെയും נָאയുടെയും വിനീതമായ തീരുമാന/അഭ്യർഥനാഭാവം പകരുന്നു.
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: സാധ്യതയും അനിശ്ചിതത്വവും മാന്യമായ ആഖ്യാനശൈലിയിൽ നിലനിർത്തുന്നു.
- source_word: יַעֲשֶׂה הַמֶּלֶךְ אֶת דְּבַר אֲמָתוֹ
  choice: രാജാവ് തന്റെ ദാസിയുടെ അപേക്ഷ നിറവേറ്റും
  rationale: ‘ദാസിയുടെ വാക്ക് ചെയ്യും’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, അഭ്യർഥന അംഗീകരിക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമായി പകരുന്നു; אָמָהയുടെ സ്ത്രീലിംഗവും സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ രാജസദസ്സ്-ഭാഷ ഉപയോഗിച്ചു. സ്ത്രീ സംസാരിക്കുന്നതിനാൽ שִׁפְחָה, אָמָה എന്നീ വിനയസൂചക സ്ത്രീലിംഗ പദങ്ങൾ രണ്ടും ‘ദാസി’ എന്നു പരിഭാഷപ്പെടുത്തി. ‘അങ്ങയുടെ’ എന്ന രൂപം രാജാവിനോടുള്ള ആദരം വ്യക്തമാക്കുന്നു.
