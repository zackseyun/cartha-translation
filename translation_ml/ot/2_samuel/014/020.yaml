  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
translation:
  language: ml
  text: കാര്യത്തിന്റെ മുഖം മാറ്റുന്നതിനുവേണ്ടിയാണ്[a] അങ്ങയുടെ ദാസനായ യോവാബ് ഈ കാര്യം ചെയ്തത്. എന്നാൽ, ദേശത്തുള്ളതെല്ലാം[b] അറിയാൻ എന്റെ യജമാനന് ദൈവദൂതന്റേതുപോലെയുള്ള ജ്ഞാനമുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കാര്യം തിരിച്ചുവിടാൻ’ അല്ലെങ്കിൽ ‘കാര്യത്തിന്റെ ഭാവം മാറ്റാൻ.’ ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘കാര്യത്തിന്റെ മുഖം തിരിക്കുക/മാറ്റുക’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഭൂമിയിലുള്ളതെല്ലാം.’ ഈ സന്ദർഭത്തിൽ ‘ദേശം’ എന്നത് ലോകം മുഴുവനെയല്ല, രാജ്യമോ ഭരണപ്രദേശമോ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר
  choice: വേണ്ടിയാണ്
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: סַבֵּב אֶת־פְּנֵי הַדָּבָר
  choice: കാര്യത്തിന്റെ മുഖം മാറ്റുക
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ ‘കാര്യത്തിന്റെ മുഖം തിരിക്കുക/മാറ്റുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עָשָׂה ... אֶת־הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം ചെയ്തത്
  rationale: ക്രിയയെയും അതിന്റെ കർമത്തെയും നേരിട്ട്, സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജസന്നിധിയിലെ ആദരപൂർവമായ അഭിസംബോധനയ്ക്ക് യോജിച്ച പ്രയോഗം.
- source_word: וַאדֹנִי
  choice: എന്നാൽ, എന്റെ യജമാനൻ
  rationale: വിവരണത്തിൽനിന്ന് രാജാവിനെ പ്രശംസിക്കുന്നതിലേക്കുള്ള നേരിയ ഭാവമാറ്റം ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חָכָם
  choice: ജ്ഞാനമുണ്ട്
  rationale: രാജാവിന്റെ വിവേകത്തെയും തിരിച്ചറിവിനെയും സൂചിപ്പിക്കുന്ന חָכָם എന്ന വിശേഷണത്തിന്റെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כְּחָכְמַת מַלְאַךְ הָאֱלֹהִים
  choice: ദൈവദൂതന്റേതുപോലെയുള്ള ജ്ഞാനം
  rationale: താരതമ്യം വ്യക്തമായി നിലനിർത്തുന്നു; ഒരു പ്രത്യേക ദൂതനെ നിർബന്ധമായി തിരിച്ചറിയിക്കുന്നില്ല.
- source_word: לָדַעַת
  choice: അറിയാൻ
  rationale: കഴിവോ ഫലമോ സൂചിപ്പിക്കുന്ന ഹീബ്രു infinitive-നെ സംക്ഷിപ്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: כָּל אֲשֶׁר בָּאָרֶץ
  choice: ദേശത്തുള്ളതെല്ലാം
  rationale: രാജഭരണത്തിന്റെ പശ്ചാത്തലത്തിൽ הָאָרֶץ എന്നത് ലോകമൊട്ടാകെയെന്നതിലുപരി രാജ്യമോ ദേശമോ സൂചിപ്പിക്കുന്നതായാണ് കൂടുതൽ സ്വാഭാവികം; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദൈവദൂതൻ’ എന്ന താരതമ്യത്തിന്റെ സ്വഭാവം
  choice: രാജാവിന്റെ അസാധാരണമായ വിവേകത്തെ പ്രശംസിക്കുന്ന താരതമ്യമായി വിവർത്തനം ചെയ്തു.
  alternative: രാജാവിന് ദൈവസദൃശമായ അറിവുണ്ടെന്ന അതിശയോക്തിപരമായ പ്രസ്താവനയായി വായിക്കാം.
  rationale: വാക്യം രാജസദസ്സിലെ ഉയർന്ന പ്രശംസാഭാഷയാണ്. ദാവീദിന്റെ സ്വഭാവത്തെക്കുറിച്ചോ സർവജ്ഞതയെക്കുറിച്ചോ പാഠം പറയുന്നതിലധികം വിവർത്തനം അവകാശപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ശൈലി. രാജസന്നിധിയിലെ ‘അങ്ങയുടെ ദാസൻ,’ ‘എന്റെ യജമാനൻ’ എന്നീ വിനയപ്രയോഗങ്ങൾ നിലനിർത്തി; അപരിചിതമായ ഹീബ്രു രൂപകം പ്രധാനപാഠത്തിൽ സൂക്ഷിച്ച് അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
