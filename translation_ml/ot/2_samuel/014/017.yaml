source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ שִׁפְחָ֣תְ/ךָ֔ יִֽהְיֶה נָּ֛א דְּבַר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לִ/מְנוּחָ֑ה כִּ֣י כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים כֵּ֣ן אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ לִ/שְׁמֹ֨עַ֙ הַ/טּ֣וֹב וְ/הָ/רָ֔ע וַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ יְהִ֥י עִמָּֽ/ךְ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
translation:
  language: ml
  text: 'അപ്പോൾ അങ്ങയുടെ ദാസി പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവിന്റെ വാക്ക് ആശ്വാസം നൽകുമാറാകട്ടെ. നന്മയും തിന്മയും കേൾക്കാൻ[b] എന്റെ യജമാനനായ രാജാവ് ദൈവത്തിന്റെ ദൂതനെപ്പോലെയാണ്[a]. അങ്ങയുടെ ദൈവമായ യഹോവ അങ്ങയോടുകൂടെ ഇരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൈവത്തിന്റെ മാലാഖയെപ്പോലെ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ പദത്തിന് പൊതുവായി “ദൂതൻ” എന്നും സ്വർഗീയ ദൂതൻ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “നന്മയും തിന്മയും കേൾക്കാൻ” എന്നതാണ് എബ്രായത്തിലെ അക്ഷരാർഥം; നന്മയും തിന്മയും വിവേചിച്ചറിയുക, അഥവാ അവയ്ക്കിടയിൽ ന്യായം വിധിക്കുക, എന്ന ആശയം ഈ പ്രയോഗത്തിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  choice: അങ്ങയുടെ ദാസി
  rationale: സ്ത്രീലിംഗമായ എബ്രായ പദത്തെയും രാജാവിനോടുള്ള വിനീതമായ സ്വയംപരാമർശത്തെയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִהְיֶה נָּא
  choice: നൽകുമാറാകട്ടെ
  rationale: നָא ചേർന്ന ആഗ്രഹപ്രയോഗത്തിന്റെ വിനീതമായ അപേക്ഷാഭാവം മലയാളത്തിലെ ആശംസാ-അപേക്ഷാരൂപത്തിൽ പകരുന്നു.
- source_word: דְּבַר אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവിന്റെ വാക്ക്
  rationale: דבר എന്നതിന്റെ ‘വാക്ക്/തീരുമാനം’ എന്ന അർഥവ്യാപ്തി പൂർണമായി ചുരുക്കാതെ മൂലരൂപം നിലനിർത്തുന്നു.
- source_word: לִמְנוּחָה
  choice: ആശ്വാസം നൽകുമാറാകട്ടെ
  rationale: ഇവിടത്തെ מְנוּחָה സൂചിപ്പിക്കുന്ന സ്വസ്ഥതയും ഉത്കണ്ഠയിൽനിന്നുള്ള ആശ്വാസവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ദൂതനെപ്പോലെ
  rationale: מלאך എന്ന പദത്തിന്റെ ‘ദൂതൻ’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  choice: നന്മയും തിന്മയും കേൾക്കാൻ
  rationale: ‘കേൾക്കുക’ എന്ന മൂലക്രിയയെ നിലനിർത്തി, വിവേചിക്കുക अथവാ ന്യായം വിധിക്കുക എന്ന ന്യായാധിപത്യസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיהוָה אֱלֹהֶיךָ
  choice: അങ്ങയുടെ ദൈവമായ യഹോവ
  rationale: തിരുനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്ത് ഉടമസ്ഥബന്ധം നിലനിർത്തുന്നു.
- source_word: יְהִי עִמָּךְ
  choice: അങ്ങയോടുകൂടെ ഇരിക്കട്ടെ
  rationale: അനുഗ്രഹാശംസയായ ജസ്സീവ് പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക ആശംസാരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ പ്രത്യക്ഷമായ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ പേരായിത്തന്നെ നൽകുന്നു.
- issue: מלאך എന്ന പദത്തിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ ദൂതൻ
  alternative: ദൈവദൂതൻ / ദൈവത്തിന്റെ മാലാഖ
  rationale: ‘ദൂതൻ’ എന്നത് പദത്തിന്റെ അടിസ്ഥാന അർഥം സംരക്ഷിക്കുന്നു; ഇവിടെ അതിന് സ്വർഗീയ ദൂതൻ എന്ന അർഥമുണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് യഥാർഥ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: ‘നന്മയും തിന്മയും കേൾക്കുക’ എന്ന പ്രയോഗം
  choice: മൂലരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുക
  alternative: നന്മയും തിന്മയും വിവേചിച്ചറിയുക
  rationale: എബ്രായത്തിലെ ന്യായാധിപത്യപരമായ പ്രയോഗത്തെ വ്യാഖ്യാനിച്ച് ഒറ്റ അർഥത്തിലാക്കാതെ, അതിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചകമായ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു. രാജസഭയിലെ വിനീതത നിലനിർത്തുന്നതിനൊപ്പം അമിതമായി പുരാതനമോ സഭാപരമോ ആയ ഭാഷ ഒഴിവാക്കി. അടിക്കുറിപ്പ് [a] ബന്ധപ്പെട്ട ദൂതൻ-പ്രയോഗത്തിനും [b] ‘കേൾക്കുക’ എന്ന ഇടിയത്തിനും ചേർത്തിരിക്കുന്നു.
