source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יוֹאָב֙ תְּק֔וֹעָ/ה וַ/יִּקַּ֥ח מִ/שָּׁ֖ם אִשָּׁ֣ה חֲכָמָ֑ה וַ/יֹּ֣אמֶר אֵ֠לֶי/הָ הִֽתְאַבְּלִי נָ֞א וְ/לִבְשִׁי נָ֣א בִגְדֵי אֵ֗בֶל וְ/אַל תָּס֨וּכִי֙ שֶׁ֔מֶן וְ/הָיִ֕ית כְּ/אִשָּׁ֗ה זֶ֚ה יָמִ֣ים רַבִּ֔ים מִתְאַבֶּ֖לֶת עַל מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
translation:
  language: ml
  text: 'യോവാബ് തെക്കോവയിലേക്ക് ആളയച്ച് അവിടെനിന്ന് ജ്ഞാനിയായ ഒരു സ്ത്രീയെ വരുത്തി. അവൻ അവളോടു പറഞ്ഞു: “നീ ദുഃഖാചരണം നടത്തുന്നവളായി നടിക്കൂ[a]; ദുഃഖവസ്ത്രം ധരിക്കൂ[b]; ശരീരത്തിൽ എണ്ണ പുരട്ടരുത്[c]. മരിച്ച ഒരാളെച്ചൊല്ലി ഏറെ നാളായി ദുഃഖാചരണം നടത്തുന്ന സ്ത്രീയെപ്പോലെ ആയിരിക്കൂ[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദുഃഖാചരണം നടത്തൂ” / “ദുഃഖിക്കുന്നവളെപ്പോലെ പെരുമാറൂ.” എബ്രായക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘ദുഃഖാചരണം നടത്തുക’ എന്നാണ്; എന്നാൽ യോവാബ് ആസൂത്രണം ചെയ്ത അവതരണത്തിന്റെ ഭാഗമായാണ് ഈ നിർദേശം നൽകുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, “ദുഃഖാചരണത്തിന്റെ വസ്ത്രങ്ങൾ.”
    reason: lexical_alternative
  - marker: c
    text: ശരീരത്തിൽ എണ്ണ പുരട്ടാതിരിക്കുക സാധാരണ അലങ്കാരവും ഉന്മേഷപരിചരണവും ഒഴിവാക്കി ദുഃഖം പ്രകടിപ്പിക്കുന്ന പതിവായിരുന്നു.
    reason: cultural_note
  - marker: d
    text: അക്ഷരാർഥം, “മരിച്ച ഒരാളെച്ചൊല്ലി ഏറെ നാളായി ദുഃഖാചരണം നടത്തുന്ന ഒരു സ്ത്രീയെപ്പോലെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקוֹעָה
  choice: തെക്കോവയിലേക്ക്
  rationale: സ്ഥലനാമമായ תְּקוֹעַ ‘തെക്കോവ’ എന്നു ലിപ്യന്തരണം ചെയ്തു; അവസാനത്തെ ־ָה ദിശാസൂചകമായതിനാൽ ‘-യിലേക്ക്’ ചേർത്തു.
- source_word: אִשָּׁה חֲכָמָה
  choice: ജ്ഞാനിയായ ഒരു സ്ത്രീ
  rationale: חֲכָמָה എന്നതിന് ജ്ഞാനം, സാമർഥ്യം, വിവേകം എന്നീ അർഥവ്യാപ്തിയുണ്ട്. സന്ദർഭം അവളുടെ സാമർഥ്യം സൂചിപ്പിക്കുന്നുവെങ്കിലും, എബ്രായത്തിലെ വിശാലമായ പ്രയോഗം നിലനിർത്താൻ ‘ജ്ഞാനിയായ’ എന്നു നൽകി.
- source_word: וַיִּקַּח מִשָּׁם
  choice: അവിടെനിന്ന് … വരുത്തി
  rationale: അക്ഷരാർഥം ‘അവിടെനിന്ന് എടുത്തു’ എന്നാണെങ്കിലും, ആളയച്ചതിനു പിന്നാലെയുള്ള സന്ദർഭത്തിൽ ഒരാളെ വിളിച്ചുവരുത്തുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: הִתְאַבְּלִי נָא
  choice: നീ ദുഃഖാചരണം നടത്തുന്നവളായി നടിക്കൂ
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ദുഃഖാചരണം നടത്തുക’ എന്നാണ്. എന്നാൽ ആസൂത്രിതമായ അവതരണത്തിനായി അങ്ങനെ കാണപ്പെടാൻ യോവാബ് നിർദേശിക്കുന്നതിനാൽ ‘നടിക്കൂ’ സന്ദർഭത്തിലെ പ്രായോഗിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בִגְדֵי אֵבֶל
  choice: ദുഃഖവസ്ത്രം
  rationale: മരണദുഃഖം ആചരിക്കുന്നവർ ധരിക്കുന്ന വസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  choice: ശരീരത്തിൽ എണ്ണ പുരട്ടരുത്
  rationale: סוך എന്നത് ശരീരത്തിൽ എണ്ണ പുരട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അഭിഷേകം’ എന്ന മതപരമായ ധ്വനി ഇവിടെ അനാവശ്യമായതിനാൽ സാധാരണ ശരീരപരിചരണത്തെ സൂചിപ്പിക്കുന്ന ഭാഷ ഉപയോഗിച്ചു.
- source_word: זֶה יָמִים רַבִּים מִתְאַבֶּלֶת עַל מֵת
  choice: മരിച്ച ഒരാളെച്ചൊല്ലി ഏറെ നാളായി ദുഃഖാചരണം നടത്തുന്ന
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന അവസ്ഥയും ദീർഘകാലവും വ്യക്തമാക്കുന്നു; מֵת അനിശ്ചിത ഏകവചനമായതിനാൽ ‘മരിച്ച ഒരാൾ’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. പുരാതന ദുഃഖാചരണവുമായി ബന്ധപ്പെട്ട ആശയങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകി; മതവിഭാഗപരമായ പ്രത്യേക പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
