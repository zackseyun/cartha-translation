base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
translation:
  language: ml
  text: അപ്പോൾ യോവാബ് രാജാവിന്റെ അടുക്കൽ ചെന്ന് രാജാവിനോട് വിവരം അറിയിച്ചു. രാജാവ് അബ്ശാലോമിനെ വിളിപ്പിച്ചു[a]. അബ്ശാലോം രാജാവിന്റെ അടുക്കൽ വന്ന്, മുഖം നിലത്തോടു ചേർത്ത് രാജാവിന്റെ മുമ്പിൽ കുമ്പിട്ടു. രാജാവ് അബ്ശാലോമിനെ ചുംബിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അബ്ശാലോമിനെ വിളിച്ചു.”'
    reason: lexical_alternative
  - marker: b
    text: ഈ ചുംബനം അനുരഞ്ജനത്തെയോ വീണ്ടും ലഭിച്ച രാജപ്രീതിയെയോ സൂചിപ്പിച്ചിരിക്കാം; എന്നാൽ രാജാവ് അവനെ ചുംബിച്ചു എന്നു മാത്രമാണ് മൂലപാഠം പറയുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: യോവാബ് രാജാവിന്റെ അടുക്കൽ ചെന്നു
  rationale: בוא എന്ന സാധാരണ ആഖ്യാനക്രിയ രാജാവിന്റെ സന്നിധിയിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘അടുക്കൽ ചെന്നു’ സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: וַיַּגֶּד לוֹ
  choice: വിവരം അറിയിച്ചു
  rationale: נגד എന്ന ഹിഫീൽ രൂപത്തിന് ‘അറിയിക്കുക/വിവരം പറയുക’ എന്ന അർഥമുണ്ട്. എന്താണ് അറിയിച്ചതെന്ന് ഈ വാക്യം വ്യക്തമാക്കാത്തതിനാൽ ഉള്ളടക്കം കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: וַיִּקְרָא אֶל־אַבְשָׁלוֹם
  choice: രാജാവ് അബ്ശാലോമിനെ വിളിപ്പിച്ചു
  rationale: രാജസദസ്സിന്റെ ഈ സന്ദർഭത്തിൽ קרא אל എന്നത് അബ്ശാലോമിനെ രാജസന്നിധിയിലേക്കു വരുത്തിയതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘രാജാവിന്റെ അടുക്കൽ വന്നു’ എന്ന വാക്യവും ഈ അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: וַיִּשְׁתַּחוּ לוֹ עַל־אַפָּיו אַרְצָה
  choice: മുഖം നിലത്തുവെച്ച് ... കുമ്പിട്ടു
  rationale: ശരീരം നിലത്തോളം താഴ്ത്തിയുള്ള ആദരപ്രകടനമാണ് ശബ്ദസമുച്ചയം വിവരിക്കുന്നത്. ‘മുഖം നിലത്തുവെച്ച്’ ഭാവം വ്യക്തമായി നിലനിർത്തുന്നു; ‘കുമ്പിട്ടു’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ മുമ്പിൽ
  rationale: לפני എന്നതിന്റെ ഈ രാജസദസ്സ്-സന്ദർഭത്തിലെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  choice: രാജാവ് അബ്ശാലോമിനെ ചുംബിച്ചു
  rationale: മൂലപാഠം ഒരു ചുംബനപ്രവൃത്തി മാത്രമാണ് നേരിട്ട് പറയുന്നത്; അതിന്റെ ഔപചാരികമോ ബന്ധപരമോ ആയ അർഥം മുഖ്യപാഠത്തിൽ വിശദീകരിച്ചിട്ടില്ല.
theological_decisions:
- issue: രാജാവിന്റെ ചുംബനത്തിന്റെ അർഥം
  choice: ചുംബിച്ചുവെന്ന പ്രവൃത്തി മാത്രം മുഖ്യപാഠത്തിൽ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: പൂർണമായ അനുരഞ്ജനത്തിന്റെയോ രാജകീയപദവി പുനഃസ്ഥാപിച്ചതിന്റെയോ അടയാളമായി വ്യാഖ്യാനിച്ച് എഴുതുക.
  rationale: സന്ദർഭത്തിൽ ഇത് അനുരഞ്ജനമോ വീണ്ടും ലഭിച്ച പ്രീതിയോ സൂചിപ്പിച്ചേക്കാം; എങ്കിലും എബ്രായപാഠം രാജാവ് അബ്ശാലോമിനെ ചുംബിച്ചു എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ സൂചന അടിക്കുറിപ്പിൽ മാത്രം നൽകി വ്യാഖ്യാനപരമായ ഉറപ്പ് ഒഴിവാക്കി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘സാഷ്ടാംഗം പ്രണമിച്ചു’ എന്ന കൂടുതൽ ഔപചാരിക പ്രയോഗത്തിനു പകരം, ശരീരഭാവം വ്യക്തമായി പറഞ്ഞുകൊണ്ട് ‘മുഖം നിലത്തുവെച്ച് ... കുമ്പിട്ടു’ എന്നു നൽകി. ആവർത്തിക്കുന്ന ‘രാജാവ്’ എന്ന നാമം എബ്രായ ആഖ്യാനത്തിന്റെ വ്യക്തത നിലനിർത്താൻ സംരക്ഷിച്ചു.
