  naturalness: പൊതുവേ ആധുനികവും വായനാസൗകര്യമുള്ളതുമാണ്. ‘രാജാവിനോട് വിവരം അറിയിച്ചു’ എന്ന രൂപം അപൂർണമായി നിൽക്കുന്ന നിലവിലെ പ്രയോഗത്തെക്കാൾ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘മുഖം നിലത്തോടു ചേർത്ത് ... കുമ്പിട്ടു’ ആഴത്തിലുള്ള വണക്കത്തിന്റെ ശരീരഭാവം വ്യക്തമായി അറിയിക്കുന്നു.
