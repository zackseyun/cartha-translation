translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. ‘വീണു’ എന്ന യുദ്ധപ്രയോഗവും ‘ഭൃത്യർ’ എന്ന രാജസേവനപദവും മൂലപാഠത്തോടുള്ള സുതാര്യതയ്ക്കായി നിലനിർത്തി; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
