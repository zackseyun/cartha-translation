source:
  edition: WLC
  text: וַ/יֵּ֨צְא֜וּ אַנְשֵׁ֤י הָ/עִיר֙ וַ/יִּלָּחֲמ֣וּ אֶת יוֹאָ֔ב וַ/יִּפֹּ֥ל מִן הָ/עָ֖ם מֵ/עַבְדֵ֣י דָוִ֑ד וַ/יָּ֕מָת גַּ֖ם אוּרִיָּ֥ה הַ/חִתִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
translation:
  language: ml
  text: നഗരത്തിലെ പുരുഷന്മാർ പുറത്തുവന്ന് യോവാബിനെതിരെ യുദ്ധം ചെയ്തു[a], ദാവീദിന്റെ ഭൃത്യരിൽ ചിലർ വീണു[b]; ഹിത്യനായ ഊരീയാവും മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പുറത്തേക്കു പോയി.”'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠത്തിൽ അക്ഷരാർഥം: “ജനത്തിൽനിന്ന്, ദാവീദിന്റെ ഭൃത്യരിൽനിന്ന്.” ദാവീദിന്റെ ആളുകളിൽ ചിലർ വീണു എന്ന ഭാഗികാർഥപ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: പുറത്തുവന്ന്
  rationale: יצא എന്ന ക്രിയയ്ക്ക് ‘പുറത്തേക്കു പോകുക/വരുക’ എന്ന അർഥമുണ്ട്. നഗരത്തിനുള്ളിൽനിന്ന് യോവാബിന്റെ സൈന്യത്തെ നേരിടാൻ ഇറങ്ങിവന്നതെന്ന സന്ദർഭദൃഷ്ടി ‘പുറത്തുവന്ന്’ സ്വാഭാവികമായി നൽകുന്നു; ദിശാസംബന്ധിയായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי הָעִיר
  choice: നഗരത്തിലെ പുരുഷന്മാർ
  rationale: ‘നഗരത്തിലെ പുരുഷന്മാർ’ എന്ന മൂലഘടന നിലനിർത്തുന്നു; യുദ്ധത്തിൽ ഏർപ്പെട്ട പുരുഷന്മാരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  choice: യോവാബിനോടു യുദ്ധം ചെയ്തു
  rationale: ഇവിടെ את ശത്രുതാപരമായ ഏറ്റുമുട്ടലിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-നോടു യുദ്ധം ചെയ്തു’ എന്ന പ്രയോഗം അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּפֹּל
  choice: വീണു
  rationale: യുദ്ധത്തിൽ കൊല്ലപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന എബ്രായ സൈനികപ്രയോഗം മലയാളത്തിലും ‘വീണു’ എന്നു നിലനിർത്തുന്നു.
- source_word: מִן הָעָם מֵעַבְדֵי דָוִד
  choice: ദാവീദിന്റെ ഭൃത്യരായ ജനത്തിൽ ചിലർ
  rationale: ആവർത്തിച്ചുള്ള מן ഇവിടെ സമഗ്രത്തിൽനിന്നുള്ള ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. അക്ഷരഘടന അസ്വാഭാവികമാക്കാതെ, വീണവർ ദാവീദിന്റെ സേവനത്തിലുള്ളവരിൽ ചിലരാണെന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: עַבְדֵי דָוִד
  choice: ദാവീദിന്റെ ഭൃത്യർ
  rationale: עבד എന്നതിന്റെ അടിസ്ഥാനാർഥമായ രാജസേവകരെ ‘ഭൃത്യർ’ എന്നു നൽകുന്നു; സൈനികസന്ദർഭം ഇവർ പോരാളികളാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וַיָּמָת גַּם אוּרִיָּה הַחִתִּי
  choice: ഹിത്യനായ ഊരീയാവും മരിച്ചു
  rationale: גם സൂചിപ്പിക്കുന്ന കൂട്ടിച്ചേർക്കലും ഊന്നലും മലയാളത്തിലെ ‘-വും’ നിലനിർത്തുന്നു.
- source_word: הַחִתִּי
  choice: ഹിത്യനായ
  rationale: ഊരീയാവിന്റെ ജനവിഭാഗപരമായ വിശേഷണം മലയാളത്തിലെ സ്ഥാപിതമായ ബൈബിൾരൂപത്തിൽ നൽകുന്നു.
