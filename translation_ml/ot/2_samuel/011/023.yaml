id: 2SA.11.23
reference: 2 Samuel 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מַּלְאָךְ֙ אֶל דָּוִ֔ד כִּֽי גָבְר֤וּ עָלֵ֨י/נוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּצְא֥וּ אֵלֵ֖י/נוּ הַ/שָּׂדֶ֑ה וַ/נִּהְיֶ֥ה עֲלֵי/הֶ֖ם עַד פֶּ֥תַח הַ/שָּֽׁעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
translation:
  language: ml
  text: 'ദൂതൻ ദാവീദിനോടു പറഞ്ഞു: “ആ ആളുകൾ ഞങ്ങളെക്കാൾ ശക്തരായിരുന്നു. അവർ ഞങ്ങളെ നേരിടാൻ തുറസ്സായ വയലിലേക്കു പുറത്തുവന്നു. എന്നാൽ ഞങ്ങൾ അവരെ കവാടത്തിന്റെ പ്രവേശനത്തോളം പിന്തള്ളിക്കൊണ്ടുപോയി.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: ദൂതൻ
  rationale: ഇവിടെ ദൂതൻ എന്നത് ദൈവദൂതനെയല്ല, യുദ്ധവിവരം എത്തിക്കുന്ന മനുഷ്യസന്ദേശവാഹകനെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: כִּי
  choice: ഉദ്ധരിച്ച റിപ്പോർട്ടിന്റെ തുടക്കത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ ഉൾപ്പെടുത്തി
  rationale: כִּי ഇവിടെ പറഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക ബന്ധപദമില്ലാതെ നേരിട്ടുള്ള ഉദ്ധരണിയായി നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: גָבְרוּ עָלֵינוּ
  choice: ഞങ്ങളെക്കാൾ ശക്തരായി
  rationale: גבר + עַל എന്ന പ്രയോഗത്തിലെ മേൽക്കൈയും താരതമ്യശക്തിയും നിലനിർത്തുന്നു; ‘ഞങ്ങളെ കീഴടക്കി’ എന്നു പറഞ്ഞാൽ സന്ദർഭത്തേക്കാൾ അന്തിമമായ അർഥം വരാം.
- source_word: הָאֲנָשִׁים
  choice: ആ ആളുകൾ
  rationale: എബ്രായത്തിലെ പൊതുവായ ‘ആളുകൾ/പുരുഷന്മാർ’ എന്ന പദത്തോട് അടുത്തുനിൽക്കുന്നു; സന്ദർഭം അവർ ശത്രുസൈനികരാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  choice: അവർ ഞങ്ങൾക്കെതിരെ തുറസ്സായ വയലിലേക്കു പുറപ്പെട്ടുവന്നു
  rationale: നഗരത്തിൽനിന്ന് പുറത്തേക്കുള്ള നീക്കവും אֵלֵינוּ എന്നതിന്റെ ശത്രുതാപരമായ ദിശയും യുദ്ധം നടന്ന തുറസ്സായ സ്ഥലവും വ്യക്തമായി നൽകുന്നു.
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  choice: ഞങ്ങൾ അവരെ ... പിന്തള്ളിക്കൊണ്ടുപോയി
  rationale: അക്ഷരാർഥം ‘ഞങ്ങൾ അവരുടെമേൽ ആയിരുന്നു’ എന്നാണെങ്കിലും, ഇവിടെ പ്രത്യാക്രമണം നടത്തി ശത്രുവിനെ കവാടംവരെ പിന്നോട്ടടിപ്പിച്ച സൈനികസന്ദർഭമാണ് സ്വാഭാവിക അർഥം.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: നഗരകവാടത്തിന്റെ പ്രവേശനംവരെ
  rationale: പിന്തള്ളലിന്റെ സ്ഥലപരമായ പരിധി വ്യക്തമാക്കുകയും פֶּתַח ‘പ്രവേശനം’ എന്നും שַׁעַר ‘കവാടം’ എന്നും വേർതിരിച്ചുള്ള ആശയം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
