translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ യുദ്ധവിവരണശൈലി. ‘ദൂതൻ’ എന്ന പദത്തിന്റെ അർഥം സന്ദർഭം മനുഷ്യസന്ദേശവാഹകനായി നിയന്ത്രിക്കുന്നു. മൂലത്തിലെ സൈനികപ്രയോഗം അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ അർഥസമതുല്യമായി പരിഭാഷപ്പെടുത്തി.
