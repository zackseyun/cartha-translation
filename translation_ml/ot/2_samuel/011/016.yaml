id: 2SA.11.16
reference: 2 Samuel 11:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֕י בִּ/שְׁמ֥וֹר יוֹאָ֖ב אֶל הָ/עִ֑יר וַ/יִּתֵּן֙ אֶת א֣וּרִיָּ֔ה אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר יָדַ֔ע כִּ֥י אַנְשֵׁי חַ֖יִל שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/016.yaml
  text: So when Joab was watching the city[a], he stationed Uriah in the place where he knew the mighty men were.
translation:
  language: ml
  text: യോവാബ് പട്ടണം നിരീക്ഷിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, പ്രബലരായ യോദ്ധാക്കൾ എവിടെയുണ്ടെന്ന് അവന് അറിയാമായിരുന്നു; അവൻ ഊരീയാവിനെ ആ സ്ഥാനത്ത് നിർത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁמֹר ... אֶל־הָעִיר
  choice: പട്ടണം നിരീക്ഷിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct കാലസൂചക ഉപവാക്യം രൂപപ്പെടുത്തുന്നു. ഉപരോധത്തിന്റെ സൈനികസന്ദർഭത്തിൽ שׁמר എന്നത് പട്ടണത്തെ ശ്രദ്ധാപൂർവം നിരീക്ഷിക്കുക എന്ന അർഥത്തിലാണ്; 'നിരീക്ഷിച്ചുകൊണ്ടിരിക്കുമ്പോൾ' ഈ കാലബന്ധവും സൈനികനിരീക്ഷണവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּתֵּן אֶת־אוּרִיָּה
  choice: അവൻ ഊരീയാവിനെ ... നിർത്തി
  rationale: נתן എന്നതിന്റെ അടിസ്ഥാനാർഥം 'വെച്ചു' എന്നാണെങ്കിലും, ഇവിടെ ഒരു സൈനികനെ ഉദ്ദേശപൂർവം അപകടകരമായ സ്ഥാനത്ത് വിന്യസിക്കുന്നതാണ്. 'നിർത്തി' എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ നിയുക്തസ്ഥാനപ്പെടുത്തൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמָּקוֹם
  choice: ആ സ്ഥാനം
  rationale: מקום എന്നത് 'സ്ഥലം/സ്ഥാനം' എന്നാണ്. സൈനിക വിന്യാസസന്ദർഭത്തിൽ 'സ്ഥാനം' കൂടുതൽ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: יָדַע
  choice: അവന് അറിയാമായിരുന്നു
  rationale: ידע എന്ന സാധാരണ 'അറിയുക' എന്ന ക്രിയയുടെ അർഥം നേരിട്ട് നിലനിർത്തുന്നു. തുടർന്നുനിന്ന അറിവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ 'അറിയാമായിരുന്നു' ഉപയോഗിച്ചു.
- source_word: אַנְשֵׁי חַיִל
  choice: പ്രബലരായ യോദ്ധാക്കൾ
  rationale: ഈ പ്രയോഗം കഴിവും കരുത്തും യുദ്ധശേഷിയുമുള്ള ഭയങ്കര പോരാളികളെ സൂചിപ്പിക്കുന്നു. 'പ്രബലരായ യോദ്ധാക്കൾ' എന്നത് ശത്രുപക്ഷത്തെ കരുത്തരായ പോരാളികൾ എന്ന സന്ദർഭാർഥം നൽകുകയും ദാവീദിന്റെ ഒരു പ്രത്യേക സൈനികസംഘത്തിന്റെ സാങ്കേതികനാമമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: שָׁם
  choice: എവിടെയുണ്ടെന്ന്
  rationale: שָׁם എന്ന സ്ഥലസൂചക അർഥം ബന്ധവാക്യത്തിലെ 'എവിടെ' എന്നതിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: וַיְהִי
  choice: '...ഇരിക്കുമ്പോൾ'
  rationale: വാക്യത്തിന്റെ കാലസൂചക ആഖ്യാനമാറ്റം മലയാളത്തിൽ ഉപവാക്യാന്ത്യമായ 'ഇരിക്കുമ്പോൾ' കൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; വേറിട്ടൊരു പദാനുപദ പരിഭാഷ ആവശ്യമില്ല.
