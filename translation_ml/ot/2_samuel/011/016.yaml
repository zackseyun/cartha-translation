  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ സൈനികസന്ദർഭം വ്യക്തമാക്കിയെങ്കിലും യോവാബിന്റെ ഉദ്ദേശത്തെ ഈ വാക്യം പറയുന്നതിലധികം വ്യാഖ്യാനിച്ചിട്ടില്ല.
