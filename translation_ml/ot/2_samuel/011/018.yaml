translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അയച്ചു’ എന്നതിന്റെ വ്യക്തമല്ലാത്ത കർമം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ‘ആളയച്ച്’ എന്നും, എബ്രായ പ്രയോഗമായ ‘യുദ്ധത്തിന്റെ വാക്കുകൾ’ എന്നതിന്റെ സന്ദർഭാർഥം ‘യുദ്ധത്തിന്റെ വിവരങ്ങൾ’ എന്നും നൽകി; അക്ഷരാർഥവും മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
