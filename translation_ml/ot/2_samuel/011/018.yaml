  yaml_path: translation/ot/2_samuel/011/018.yaml
  text: Then Joab sent word and told David all the news of the battle[a].
translation:
  language: ml
  text: അപ്പോൾ യോവാബ് ദാവീദിന് ആളയച്ച് യുദ്ധത്തിന്റെ വിവരങ്ങളെല്ലാം അറിയിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യുദ്ധത്തിന്റെ കാര്യങ്ങളെല്ലാം.” എബ്രായത്തിൽ അക്ഷരാർഥം “യുദ്ധത്തിന്റെ വാക്കുകളെല്ലാം” എന്നാണ്; പോരാട്ടത്തിന്റെ വിശദാംശങ്ങളെയോ അതിനെക്കുറിച്ചുള്ള റിപ്പോർട്ടിനെയോ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ച്
  rationale: שׁלח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘അയച്ചു’ എന്നാണ്. തുടർന്ന് വരുന്ന ‘അറിയിച്ചു’ എന്ന ക്രിയയും ദാവീദ് എന്ന പരോക്ഷ കർമവും പരിഗണിക്കുമ്പോൾ, ഒരു ദൂതനെ അയച്ച് വിവരം അറിയിച്ചുവെന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ആളയച്ച്’ അനുയോജ്യമാണ്.
- source_word: יוֹאָב
  choice: യോവാബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
- source_word: וַיַּגֵּד
  choice: അറിയിച്ചു
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘അറിയിക്കുക, വിവരിക്കുക, റിപ്പോർട്ട് ചെയ്യുക’ എന്നീ അർഥങ്ങളുണ്ട്. ഈ സന്ദർഭത്തിൽ ‘അറിയിച്ചു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לְדָוִד
  choice: ദാവീദിന്
  rationale: לְ എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്ന സ്വീകർത്താവിനെ മലയാളത്തിലെ ദത്തിവിഭക്തിയായ ‘-ന്’ ഉപയോഗിച്ച് പ്രകടിപ്പിച്ചു.
- source_word: אֵת כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: യുദ്ധത്തിന്റെ വിവരങ്ങളെല്ലാം
  rationale: דִּבְרֵי എന്നത് അക്ഷരാർഥത്തിൽ ‘വാക്കുകൾ/കാര്യങ്ങൾ’ എന്നാണെങ്കിലും, യുദ്ധത്തെക്കുറിച്ചുള്ള റിപ്പോർട്ടിന്റെ സന്ദർഭത്തിൽ അതിന്റെ വിശദാംശങ്ങളെയോ വിവരങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘വിവരങ്ങളെല്ലാം’ ഈ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַמִּלְחָמָה
  choice: യുദ്ധം
  rationale: מִלְחָמָה എന്നതിന് ‘യുദ്ധം, പോരാട്ടം’ എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ നടന്നുകൊണ്ടിരിക്കുന്ന സൈനിക നടപടിയെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘യുദ്ധം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
