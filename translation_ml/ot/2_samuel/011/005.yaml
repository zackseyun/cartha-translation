base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/005.yaml
  text: The woman conceived[a], and she sent word and told David[b], “I am pregnant.”
translation:
  language: ml
  text: 'ആ സ്ത്രീ ഗർഭം ധരിച്ചു[a]. അവൾ ദാവീദിന് സന്ദേശം അയച്ച് അറിയിച്ചു[b]: “ഞാൻ ഗർഭിണിയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ആ സ്ത്രീ ഗർഭിണിയായി.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “അയച്ചു” എന്നു മാത്രം; അവൾ ദാവീദിന് ഒരു സന്ദേശം അയച്ചുവെന്നതാണ് സന്ദർഭത്തിലെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: ഗർഭം ധരിച്ചു
  rationale: הרה എന്ന ക്രിയ ഗർഭം ധരിക്കുക, ഗർഭിണിയാകുക എന്ന സംഭവാർഥം നൽകുന്നു. ആധുനിക മലയാളത്തിൽ ‘ഗർഭം ധരിച്ചു’ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: אִשָּׁה എന്നതിന് ‘സ്ത്രീ’ എന്നും സന്ദർഭാനുസരണം ‘ഭാര്യ’ എന്നും അർഥമാകാം. ഇവിടെ ബത്‌ശേബയുടെ വൈവാഹികബന്ധം ഈ വാക്യത്തിൽ നേരിട്ട് മുൻനിർത്താത്തതിനാൽ ‘ആ സ്ത്രീ’ എന്നത് രൂപത്തെയും മുൻസന്ദർഭത്തെയും നന്നായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַתִּשְׁלַח
  choice: ആളയച്ച്
  rationale: שׁלח എന്നത് അക്ഷരാർഥത്തിൽ ‘അയച്ചു’ എന്നാണ്. തുടർന്ന് വരുന്ന അറിയിക്കൽക്രിയയും ദാവീദിലേക്കുള്ള ദിശയും കണക്കിലെടുത്ത്, സന്ദേശവാഹകനെ അയച്ചുവെന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ് ‘ആളയച്ച്’; മൂലപാഠത്തിൽ സന്ദേശവാഹകനെ പ്രത്യേകം പറയുന്നില്ലെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתַּגֵּד לְדָוִד
  choice: ദാവീദിനെ അറിയിച്ചു
  rationale: נגד എന്ന ഹിഫിൽ രൂപത്തിന് അറിയിക്കുക, വിവരിക്കുക, റിപ്പോർട്ട് ചെയ്യുക എന്നീ അർഥങ്ങളുണ്ട്. ‘ദാവീദിനെ അറിയിച്ചു’ വ്യക്തിപരമായ സന്ദേശവിനിമയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָרָה אָנֹכִי
  choice: ഞാൻ ഗർഭിണിയാണ്
  rationale: הָרָה എന്ന വിധേയപദവും אָנֹכִי എന്ന സർവനാമവും ചേർന്ന് ഇപ്പോഴത്തെ അവസ്ഥയാണ് പ്രകടിപ്പിക്കുന്നത്. അതിനാൽ ‘ഞാൻ ഗർഭിണിയാണ്’ ഏറ്റവും സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപമാണ്.
