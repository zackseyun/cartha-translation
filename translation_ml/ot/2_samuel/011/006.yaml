  yaml_path: translation/ot/2_samuel/011/006.yaml
  text: So David sent word to Joab, “Send Uriah the Hittite to me.” And Joab sent Uriah to David.
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് യോവാബിന് സന്ദേശം അയച്ചു: “ഹിത്യനായ ഊരിയാവിനെ എന്റെ അടുക്കലേക്ക് അയയ്ക്കുക.” യോവാബ് ഊരിയാവിനെ ദാവീദിന്റെ അടുക്കലേക്ക് അയച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  choice: ദാവീദ് യോവാബിനോട് ആളയച്ച്
  rationale: שׁלח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘അയയ്ക്കുക’ എന്നാണ്. ഇവിടെ അയയ്ക്കപ്പെട്ട വ്യക്തിയോ സന്ദേശമോ വ്യക്തമാക്കിയിട്ടില്ല; പിന്നാലെ കല്പന നേരിട്ട് വരുന്നതിനാൽ, ദാവീദ് കല്പന അറിയിക്കാൻ ആളയച്ചു എന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שְׁלַח אֵלַי
  choice: എന്റെ അടുക്കൽ അയയ്ക്കുക
  rationale: ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവം നിലനിർത്തുന്നു. אֵלַי എന്നത് ‘എന്റെ അടുക്കൽ/എന്നിലേക്ക്’ എന്നാണ്; ‘തിരികെ’ എന്ന ആശയം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: אֶת אוּרִיָּה הַחִתִּי
  choice: ഹിത്യനായ ഊരിയാവിനെ
  rationale: אֶת കർമസൂചകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തുന്നില്ല. אוּרִיָּה എന്ന പേര് മലയാള ബൈബിൾ ഉപയോഗത്തിന് യോജിച്ച വിധത്തിൽ ‘ഊരിയാവ്’ എന്നും, הַחִתִּי എന്ന ജനവിഭാഗസൂചകം ‘ഹിത്യൻ’ എന്നും നൽകിയിരിക്കുന്നു.
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אוּרִיָּה אֶל דָּוִד
  choice: യോവാബ് ഊരിയാവിനെ ദാവീദിന്റെ അടുക്കൽ അയച്ചു
  rationale: ആഖ്യാനക്രമത്തിലെ ആവർത്തിച്ച ശׁלח ക്രിയയ്ക്ക് വീണ്ടും ‘അയച്ചു’ എന്നു നൽകി. אֶל എന്ന ദിശാസൂചകത്തിന് സ്വാഭാവികമായ ‘അടുക്കൽ’ ഉപയോഗിച്ചു.
