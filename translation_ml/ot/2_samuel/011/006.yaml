translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആദ്യത്തെ וַיִּשְׁלַח-ന്റെ പരോക്ഷ കർമം മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ‘സന്ദേശം അയച്ചു’ എന്നു നിർണ്ണയിക്കാതെ ‘ആളയച്ച്’ എന്നു നൽകിയിരിക്കുന്നു; തുടർന്ന് വരുന്ന നേരിട്ടുള്ള കല്പനയുമായുള്ള ബന്ധവും നിലനിർത്തി.
