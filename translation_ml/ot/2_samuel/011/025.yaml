  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל הַ/מַּלְאָ֗ךְ כֹּֽה תֹאמַ֤ר אֶל יוֹאָב֙ אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּֽי כָ/זֹ֥ה וְ/כָ/זֶ֖ה תֹּאכַ֣ל הֶ/חָ֑רֶב הַחֲזֵ֨ק מִלְחַמְתְּ/ךָ֧ אֶל הָ/עִ֛יר וְ/הָרְסָ֖/הּ וְ/חַזְּקֵֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് ദൂതനോടു പറഞ്ഞു: “യോവാബിനോട് ഇങ്ങനെ പറയുക: ‘ഈ കാര്യം നിന്റെ കണ്ണിൽ ദോഷമായി തോന്നരുത്[a]. വാൾ ഒരാളെയും മറ്റൊരാളെയും ഒരുപോലെ വിഴുങ്ങും[b]. നഗരത്തിനെതിരെയുള്ള നിന്റെ ആക്രമണം ശക്തമാക്കി അതിനെ ഇടിച്ചുകളയുക.’ അവനെ ധൈര്യപ്പെടുത്തുകയും ചെയ്യുക[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഈ കാര്യം നിന്റെ കണ്ണിൽ തിന്മയായിരിക്കരുത്.” അഥവാ, “ഈ കാര്യം നിന്നെ അസന്തുഷ്ടനാക്കരുത്.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ ശൈലി അക്ഷരാർഥത്തിൽ, “വാൾ ഇങ്ങനെയും അങ്ങനെയും വിഴുങ്ങും” എന്നാണ്; വാൾ ഒരാളെപ്പോലെ മറ്റൊരാളെയും കൊല്ലുന്നു എന്നതാണ് ആശയം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അവനെ ശക്തിപ്പെടുത്തുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: ദൂതൻ
  rationale: ഈ യുദ്ധവിവരണത്തിൽ ഇത് ദൈവദൂതനെയല്ല, വാർത്ത കൊണ്ടുവന്ന മനുഷ്യദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദൂതൻ’ സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כֹּה תֹאמַר
  choice: ഇങ്ങനെ പറയുക
  rationale: മറ്റൊരാളോടു കൈമാറേണ്ട വാക്കുകൾ അവതരിപ്പിക്കുന്ന ദൂതസൂത്രവാക്യത്തിന്റെ അർത്ഥം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַל יֵרַע בְּעֵינֶיךָ
  choice: ഈ കാര്യം നിന്റെ കണ്ണിൽ ദോഷമായി തോന്നരുത്
  rationale: ‘കണ്ണിൽ ദോഷമായിരിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിലെ നൈതികനിറം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ മനസ്സിലാകുന്ന രൂപം സ്വീകരിച്ചു.
- source_word: הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: ഊരീയാവിന്റെ മരണം ഉൾപ്പെടുന്ന റിപ്പോർട്ട് ചെയ്ത സംഭവത്തെ അമിതമായി വിശദീകരിക്കാതെ സൂചിപ്പിക്കുന്ന വിശാലമായ പദപ്രയോഗമാണ്.
- source_word: כִּי כָזֹה וְכָזֶה תֹּאכַל הֶחָרֶב
  choice: വാൾ ഒരാളെയും മറ്റൊരാളെയും ഒരുപോലെ വിഴുങ്ങും
  rationale: ‘ഇങ്ങനെയുള്ളവനെയും അങ്ങനെയുള്ളവനെയും’ എന്ന ആവർത്തനാത്മക എബ്രായ പ്രയോഗം യുദ്ധത്തിലെ വാളിന്റെ വിവേചനമില്ലാത്ത നാശത്തെ സൂചിപ്പിക്കുന്നു. ‘വിഴുങ്ങും’ എന്നത് മൂലത്തിലെ സജീവരൂപകം നിലനിർത്തുന്നു.
- source_word: הַחֲזֵק מִלְחַמְתְּךָ אֶל הָעִיר
  choice: നഗരത്തിനെതിരെയുള്ള നിന്റെ ആക്രമണം ശക്തമാക്കുക
  rationale: അക്ഷരാർഥത്തിലെ ‘നിന്റെ യുദ്ധം ശക്തമാക്കുക’ എന്ന ആശയം ഉപരോധസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהָרְסָהּ
  choice: അതിനെ ഇടിച്ചുകളയുക
  rationale: നഗരത്തെ വലിച്ചിടുകയോ തകർക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ദൃശ്യവും സൈനികവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: וְחַזְּקֵהוּ
  choice: അവനെ ധൈര്യപ്പെടുത്തുകയും ചെയ്യുക
  rationale: പുരുഷ ഏകവചന പ്രത്യയം സ്വാഭാവികമായി യോവാബിനെ സൂചിപ്പിക്കുന്നു. ഇവിടെ ‘ശക്തിപ്പെടുത്തുക’ എന്നത് മാനസികമായി ഉറപ്പിക്കുകയോ പ്രോത്സാഹിപ്പിക്കുകയോ ചെയ്യുക എന്ന അർത്ഥത്തിൽ മലയാളത്തിൽ ‘ധൈര്യപ്പെടുത്തുക’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദാവീദിന്റെ വാക്കുകളിലെ തണുത്ത യുദ്ധഭാവവും ‘വാൾ വിഴുങ്ങുന്നു’ എന്ന മൂലരൂപകവും മൃദൂകരിക്കാതെ നിലനിർത്തി; ഉദ്ധരണികളുടെ അതിരുകൾ വ്യക്തമായി സൂക്ഷിച്ചു.
