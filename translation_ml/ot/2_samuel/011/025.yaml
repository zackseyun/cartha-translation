  source_fidelity: എബ്രായ മൂലത്തോടു വിശ്വസ്തമാണ്. הַמַּלְאָךְ മനുഷ്യദൂതനായി ശരിയായി നൽകിയിരിക്കുന്നു; ‘നിന്റെ കണ്ണിൽ ദോഷമായി തോന്നരുത്’ എന്നത് אַל־יֵרַע בְּעֵינֶיךָ എന്ന പ്രയോഗത്തിന്റെ ഭാവം സൂക്ഷിക്കുന്നു. ‘വാൾ ഒരാളെയും മറ്റൊരാളെയും ഒരുപോലെ വിഴുങ്ങും’ എന്നത് כָּזֹה וְכָזֶה תֹּאכַל הֶחָרֶב എന്ന വിവേചനമില്ലാത്ത യുദ്ധമരണത്തിന്റെ രൂപകം വ്യക്തമായി നൽകുന്നു. നഗരത്തിനെതിരായ ആക്രമണം ശക്തമാക്കാനും അതിനെ ഇടിച്ചുകളയാനും ഉള്ള കല്പനയും, അവസാനം യോവാബിനെ ധൈര്യപ്പെടുത്താനുള്ള നിർദേശവും മുഴുവനായി പ്രതിഫലിക്കുന്നു.
  naturalness: 'ആധുനിക പ്രമാണമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലിയാണ്. ഉദ്ധരണികളുടെ ക്രമീകരണം വ്യക്തമാണ്: നഗരത്തെ ആക്രമിക്കാനുള്ള വാക്കുകൾ യോവാബിനുള്ള സന്ദേശമായി വരുന്നു; ‘അവനെ ധൈര്യപ്പെടുത്തുകയും ചെയ്യുക’ ദൂതനോടുള്ള ദാവീദിന്റെ തുടർനിർദേശമായി ശരിയായി നിലകൊള്ളുന്നു.'
