  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָא ל֣/וֹ דָוִ֗ד וַ/יֹּ֧אכַל לְ/פָנָ֛י/ו וַ/יֵּ֖שְׁתְּ וַֽ/יְשַׁכְּרֵ֑/הוּ וַ/יֵּצֵ֣א בָ/עֶ֗רֶב לִ/שְׁכַּ֤ב בְּ/מִשְׁכָּב/וֹ֙ עִם עַבְדֵ֣י אֲדֹנָ֔י/ו וְ/אֶל בֵּית֖/וֹ לֹ֥א יָרָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
translation:
  language: ml
  text: ദാവീദ് അവനെ വിളിപ്പിച്ചു[a]. അവൻ ദാവീദിന്റെ സന്നിധിയിൽ ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തു; ദാവീദ് അവനെ മത്തനാക്കി. സന്ധ്യയായപ്പോൾ അവൻ തന്റെ യജമാനന്റെ സേവകരോടൊപ്പം തന്റെ കിടക്കയിൽ കിടക്കാൻ പുറപ്പെട്ടു; എന്നാൽ തന്റെ വീട്ടിലേക്കു ഇറങ്ങിച്ചെന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദ് അവനെ വിളിച്ചു” അല്ലെങ്കിൽ “ദാവീദ് അവനെ ക്ഷണിച്ചു.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ, “തന്റെ വീട്ടിലേക്കു ഇറങ്ങിച്ചെന്നില്ല.” ചുറ്റുമുള്ള സന്ദർഭത്തിലും വരുന്ന ദിശാസൂചകമായ “ഇറങ്ങിച്ചെല്ലുക” എന്ന ക്രിയ ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: ദാവീദ് അവനെ വിളിപ്പിച്ചു
  rationale: קרא + ל വ്യക്തിയെ വിളിച്ചുവരുത്തുക/വിളിപ്പിക്കുക എന്ന അർഥം നൽകുന്നു. വിരുന്നിലേക്കുള്ള ക്ഷണം സന്ദർഭത്തിൽ ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും, ‘വിളിപ്പിച്ചു’ എന്നത് രാജാവായ ദാവീദിന്റെ മുൻകൈയും മൂലപദത്തിന്റെ വിശാലതയും സംരക്ഷിക്കുന്നു.
- source_word: לְפָנָיו
  choice: ദാവീദിന്റെ സന്നിധിയിൽ
  rationale: അക്ഷരാർഥം ‘അവന്റെ മുമ്പിൽ/സന്നിധിയിൽ.’ മലയാളത്തിൽ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കി, ഊരിയാവ് ദാവീദിന്റെ സാന്നിധ്യത്തിൽ ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തുവെന്ന ബന്ധസൂചന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיְשַׁכְּרֵהוּ
  choice: ദാവീദ് അവനെ മത്തനാക്കി
  rationale: 'שׁכר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം കാരണാർഥകമാണ്: ദാവീദ് ഊരിയാവിനെ മദ്യലഹരിയിലാക്കി. ‘മത്തനാക്കി’ ആ ഉദ്ദേശ്യപൂർവമായ പ്രവർത്തനം നേരിട്ട് നിലനിർത്തുന്നു.'
- source_word: בָעֶרֶב
  choice: സന്ധ്യയായപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ അടുത്ത ഘട്ടത്തെ സൂചിപ്പിക്കുന്ന സമയപ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לִשְׁכַּב
  choice: കിടക്കാൻ
  rationale: ‘കിടക്കുക/കിടന്നുറങ്ങുക’ എന്നതിൽ, ഉറങ്ങിയെന്നു അധികമായി വ്യാഖ്യാനിക്കാതെ ശരീരപ്രവർത്തനം മാത്രം നൽകുന്നു.
- source_word: בְּמִשְׁכָּבוֹ
  choice: തന്റെ കിടക്കയിൽ
  rationale: מִשְׁכָּב കിടക്കയെയോ കിടപ്പിടത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ‘കിടക്കയിൽ’ സ്വാഭാവികവും ദൃശ്യവുമാണ്.
- source_word: עִם עַבְדֵי אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ സേവകരോടൊപ്പം
  rationale: ‘അവന്റെ യജമാനന്റെ സേവകർ’ എന്ന എബ്രായ ഘടന സംരക്ഷിക്കുന്നു; യജമാനൻ ദാവീദാണ്. ‘സേവകർ’ രാജപരിചാരകരെയും ദാസരെയും ഉൾക്കൊള്ളാവുന്ന മാന്യമായ പൊതുപദമാണ്.
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  choice: എന്നാൽ തന്റെ വീട്ടിലേക്കു ഇറങ്ങിച്ചെന്നില്ല
  rationale: സന്ദർഭത്തിലെ വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു. ירד എന്ന ദിശാസൂചക ക്രിയയെ ‘വീട്ടിൽ പോയില്ല’ എന്നു ലഘൂകരിക്കാതെ ‘ഇറങ്ങിച്ചെന്നില്ല’ എന്നു നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ചുള്ള സർവനാമങ്ങൾ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാവുന്നിടത്ത് ‘ദാവീദ്’ എന്നു വ്യക്തമാക്കിയിട്ടുണ്ട്. മൂലത്തിലെ തുടർച്ചയായ ക്രിയകളുടെ വേഗവും ദാവീദിന്റെ കാരണാത്മക ഉത്തരവാദിത്വവും സംരക്ഷിച്ചു.
