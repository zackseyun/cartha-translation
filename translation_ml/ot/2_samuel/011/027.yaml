  text: וַ/יַּעֲבֹ֣ר הָ/אֵ֗בֶל וַ/יִּשְׁלַ֨ח דָּוִ֜ד וַ/יַּאַסְפָ֤/הּ אֶל בֵּית/וֹ֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֥לֶד ל֖/וֹ בֵּ֑ן וַ/יֵּ֧רַע הַ/דָּבָ֛ר אֲשֶׁר עָשָׂ֥ה דָוִ֖ד בְּ/עֵינֵ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
translation:
  language: ml
  text: വിലാപകാലം കഴിഞ്ഞപ്പോൾ, ദാവീദ് ആളയച്ച് അവളെ തന്റെ വീട്ടിലേക്കു കൊണ്ടുവന്നു. അവൾ അവന്റെ ഭാര്യയായി, അവന് ഒരു മകനെ പ്രസവിച്ചു. എന്നാൽ ദാവീദ് ചെയ്ത കാര്യം യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹ്‌വെയ്ക്ക് അനിഷ്ടമായിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രു അക്ഷരാർഥത്തിൽ ‘യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായിരുന്നു’ എന്നാണ്; ഇത് ദാവീദിന്റെ പ്രവൃത്തിയെക്കുറിച്ചുള്ള ദൈവത്തിന്റെ ധാർമിക വിധി പ്രകടിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר הָאֵבֶל
  choice: വിലാപകാലം കഴിഞ്ഞപ്പോൾ
  rationale: ആചാരപരവും സാമൂഹികവുമായ ദുഃഖാചരണകാലം അവസാനിച്ചതിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘വിലാപകാലം’ എന്നത് സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁלַח דָּוִד וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  choice: ദാവീദ് ആളയച്ച് അവളെ തന്റെ വീട്ടിലേക്കു കൊണ്ടുവന്നു
  rationale: שׁלח എന്ന ക്രിയയുടെ ദൂതനെ അയയ്ക്കുന്ന ആശയവും אסף എന്നതിന്റെ വീട്ടിലേക്കു ചേർത്തുകൊണ്ടുവരുന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: അവൾ അവന്റെ ഭാര്യയായി
  rationale: സ്ത്രീയുടെ പദവിയിൽ വന്ന മാറ്റം ഹീബ്രു ഘടന സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭാര്യയായി’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: וַתֵּלֶד לוֹ בֵּן
  choice: അവന് ഒരു മകനെ പ്രസവിച്ചു
  rationale: മൂലപാഠത്തിലെ പരോക്ഷകർമം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: וַיֵּרַע
  choice: തിന്മയായിരുന്നു
  rationale: ദാവീദിന്റെ പ്രവൃത്തിയെക്കുറിച്ചുള്ള ദൈവിക ധാർമിക വിധിയെ ശക്തി കുറയ്ക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: הַדָּבָר אֲשֶׁר עָשָׂה דָוִד
  choice: ദാവീദ് ചെയ്ത കാര്യം
  rationale: דבר എന്നതിന്റെ വിശാലമായ ‘കാര്യം/പ്രവൃത്തി’ എന്ന അർഥം ലളിതമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ഹീബ്രു ചതുരക്ഷരനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ പ്രവൃത്തിയെക്കുറിച്ചുള്ള ആഖ്യാതാവിന്റെ ധാർമിക വിധിയുടെ ശക്തി
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായിരുന്നു
  alternative: യഹ്‌വെയ്ക്ക് അനിഷ്ടമായിരുന്നു
  rationale: ഹീബ്രു וַיֵּרַע ഇവിടെ വെറും അനിഷ്ടത്തെക്കാൾ വ്യക്തമായ ധാർമിക കുറ്റവിധി പ്രകടിപ്പിക്കുന്നു; അതിനാൽ ‘തിന്മയായിരുന്നു’ എന്ന ശക്തമായ ഭാഷ നിലനിർത്തി.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം മറച്ചുവയ്ക്കാതെ മലയാള ലിപിയിൽ ശബ്ദാന്തരം ചെയ്തു; ഒരു സ്ഥാനപ്പേര് ചേർത്ത് അർഥം നിർണ്ണയിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സംഭവക്രമം ചെറുവാക്യങ്ങളിലൂടെ സ്വാഭാവികമാക്കി; അവസാന വാക്യത്തിലെ വിരോധഭാവം ‘എന്നാൽ’ കൊണ്ട് വ്യക്തമാക്കി. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ശബ്ദാന്തരം ചെയ്തു.
