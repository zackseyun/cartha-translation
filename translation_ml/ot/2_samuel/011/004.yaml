source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד מַלְאָכִ֜ים וַ/יִּקָּחֶ֗/הָ וַ/תָּב֤וֹא אֵלָי/ו֙ וַ/יִּשְׁכַּ֣ב עִמָּ֔/הּ וְ/הִ֥יא מִתְקַדֶּ֖שֶׁת מִ/טֻּמְאָתָ֑/הּ וַ/תָּ֖שָׁב אֶל בֵּיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് ദൂതന്മാരെ അയച്ച് അവളെ കൊണ്ടുവരുത്തി[a]. അവൾ അവന്റെ അടുക്കൽ വന്നു; അവൻ അവളോടുകൂടെ ശയിച്ചു. (അവൾ തന്റെ അശുദ്ധിയിൽനിന്ന് ശുദ്ധീകരണം നടത്തുകയായിരുന്നു[b].) പിന്നെ അവൾ തന്റെ വീട്ടിലേക്കു മടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അവളെ എടുത്തു.” സന്ദർഭത്തിൽ, ദാവീദ് അയച്ച ദൂതന്മാർ അവളെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നതിനെ ഇതു സൂചിപ്പിക്കുന്നു.'
    reason: lexical_ambiguity
  - marker: b
    text: 'അല്ലെങ്കിൽ: “അവൾ തന്റെ അശുദ്ധിയിൽനിന്ന് ശുദ്ധീകരിക്കപ്പെട്ടിരുന്നു.” എബ്രായത്തിലെ ഈ പങ്കാളിത്തപ്രയോഗം ആചാരപരമായ ശുദ്ധീകരണത്തെക്കുറിച്ചുള്ള പശ്ചാത്തലക്കുറിപ്പായി മനസ്സിലാക്കാം; മാസികാനന്തര ശുദ്ധീകരണത്തെ ഇതു സൂചിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: שלח എന്ന സാധാരണ ആഖ്യാനക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലരൂപത്തിൽ നൽകുന്നു.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഔദ്യോഗിക പദവി അനാവശ്യമായി നിർണ്ണയിക്കാതെ ‘സന്ദേശവാഹകർ/ദൂതന്മാർ’ എന്ന മൂലാർത്ഥം നിലനിർത്തുന്നു.
- source_word: וַיִּקָּחֶהָ
  choice: അവളെ കൊണ്ടുവന്നു
  rationale: לקח എന്നതിന്റെ അക്ഷരാർഥം ‘എടുക്കുക’ ആണെങ്കിലും, അയച്ച ദൂതന്മാർ മുഖേന അവളെ തന്റെ അടുക്കൽ വരുത്തിയെന്ന സന്ദർഭാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ദാവീദിന്റെ മുൻകൈ മറയ്ക്കുന്നില്ല.
- source_word: וַתָּבֹוא אֵלָיו
  choice: അവൾ അവന്റെ അടുക്കൽ വന്നു
  rationale: ചലനക്രിയയും אֵלָיו എന്ന ദിശാസൂചനയും ലളിതമായി നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത അധിക സൂചന ചേർക്കുന്നില്ല.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: അവൻ അവളോടുകൂടെ ശയിച്ചു
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ബൈബിൾപ്രയോഗത്തിന്റെ സാഹിത്യഗൗരവവും പരോക്ഷതയും സംരക്ഷിക്കുന്നു.
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  choice: അപ്പോൾ അവൾ തന്റെ അശുദ്ധിയിൽനിന്ന് ശുദ്ധീകരിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: Hitpael പങ്കാളിത്തരൂപത്തിന്റെ പശ്ചാത്തല/തുടർച്ചാഭാവം സംരക്ഷിക്കുകയും קדשׁ ഇവിടെ ധാർമിക വിശുദ്ധീകരണമല്ല, ആചാരപരമായ ശുദ്ധീകരണമാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַתָּשָׁב אֶל בֵּיתָהּ
  choice: പിന്നെ അവൾ തന്റെ വീട്ടിലേക്കു മടങ്ങി
  rationale: ആഖ്യാനത്തിന്റെ തുടർച്ചയും בית എന്നതിന്റെ അടിസ്ഥാനാർത്ഥമായ ‘വീട്’ എന്ന പദവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആചാരശുദ്ധീകരണ ഉപവാക്യത്തിന്റെ കാലവും ആഖ്യാനത്തിലെ പ്രവർത്തനവും
  choice: പങ്കാളിത്തരൂപത്തെ പശ്ചാത്തലവിവരമായി ‘ശുദ്ധീകരിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘അവൾ തന്റെ അശുദ്ധിയിൽനിന്ന് ശുദ്ധീകരിക്കപ്പെട്ടിരുന്നു’ എന്ന പൂർവപൂർണ്ണ വായന.
  rationale: מִתְקַדֶּשֶׁת എന്ന പങ്കാളിത്തരൂപം തുടരുന്ന/പശ്ചാത്തല പ്രവർത്തനമായി വായിക്കാം; എന്നാൽ സന്ദർഭത്തിൽ പൂർത്തിയായ മാസികാനന്തര ശുദ്ധീകരണത്തെയും സൂചിപ്പിക്കാമെന്ന യഥാർഥ വ്യാകരണ-സന്ദർഭ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു. ഇത് ബത്‌ശേബയുടെ കുറ്റമോ കുറ്റമില്ലായ്മയോ സംബന്ധിച്ച അധിക നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ലൈംഗികബന്ധത്തിന് ‘ശയിച്ചു’ എന്ന ബൈബിൾസാഹിത്യപ്രയോഗവും ആചാരശുദ്ധിക്ക് ‘അശുദ്ധി/ശുദ്ധീകരിക്കുക’ എന്ന വ്യക്തമായ പദാവലിയും ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ പ്രത്യക്ഷപ്പെടണം; അതിനാൽ ശുദ്ധീകരണവാക്യത്തിന് [b] ചേർക്കേണ്ടതാണ്.
