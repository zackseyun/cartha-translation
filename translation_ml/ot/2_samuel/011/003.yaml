id: 2SA.11.3
reference: 2 Samuel 11:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח דָּוִ֔ד וַ/יִּדְרֹ֖שׁ לָֽ/אִשָּׁ֑ה וַ/יֹּ֗אמֶר הֲ/לוֹא זֹאת֙ בַּת שֶׁ֣בַע בַּת אֱלִיעָ֔ם אֵ֖שֶׁת אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് ആളയച്ച് ആ സ്ത്രീയെക്കുറിച്ച് അന്വേഷിച്ചു. ഒരാൾ പറഞ്ഞു: “ഇവൾ ഏലീയാമിന്റെ മകളും ഹിത്യനായ ഊരീയാവിന്റെ ഭാര്യയുമായ ബത്ത്-ശേബയല്ലേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד
  choice: ദാവീദ് ആളയച്ച്
  rationale: ‘ദാവീദ് അയച്ചു’ എന്ന ഹീബ്രായ പ്രയോഗത്തിൽ അയച്ചത് ദൂതന്മാരെയോ ആളുകളെയോ ആണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ആളയച്ച്’ എന്നു നൽകി.
- source_word: וַיִּדְרֹשׁ לָאִשָּׁה
  choice: ആ സ്ത്രീയെക്കുറിച്ച് അന്വേഷിച്ചു
  rationale: דרשׁ ഇവിടെ വിവരങ്ങൾ അന്വേഷിക്കുക എന്ന അർഥത്തിലാണ്; לָאִשָּׁה എന്നത് സ്ത്രീയെ സംബന്ധിച്ച അന്വേഷണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: ഒരാൾ പറഞ്ഞു
  rationale: ഹീബ്രായ ക്രിയ പുരുഷ ഏകവചനമാണെങ്കിലും കർത്താവ് വ്യക്തമല്ല. ദാവീദ് തന്നെയാണ് പറഞ്ഞതെന്ന് തെറ്റായി ധരിപ്പിക്കാതെയും വ്യക്തിയെ അനാവശ്യമായി നിർണ്ണയിക്കാതെയും അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: הֲלוֹא זֹאת
  choice: ഇവൾ ... അല്ലേ?
  rationale: הֲלוֹא പ്രതീക്ഷിതമായ സമ്മതം സൂചിപ്പിക്കുന്ന ചോദ്യം; മലയാളത്തിലെ ‘അല്ലേ?’ അതിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּת שֶׁבַע
  choice: ബത്ത്-ശേബ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַחִתִּי
  choice: ഹിത്യനായ
  rationale: ഊരീയാവിന്റെ ജനവിഭാഗപരമായ തിരിച്ചറിയൽ വ്യക്തമാക്കുന്ന വിശേഷണം.
theological_decisions:
- issue: וַיֹּאמֶר എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: ഒരാൾ പറഞ്ഞു
  alternative: അവൻ പറഞ്ഞു
  rationale: മസോററ്റിക് പാഠം സംസാരിക്കുന്നയാളെ പേരെടുത്ത് പറയുന്നില്ല. ‘അവൻ’ എന്നു നൽകിയാൽ ദാവീദിനെ സൂചിപ്പിക്കുന്നതായി വായിക്കപ്പെടാം; ‘ഒരാൾ’ മൂലപാഠത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഗദ്യശൈലി. ബന്ധപരിചയങ്ങളുടെ ക്രമവും ചോദ്യത്തിന്റെ ഊന്നലും മൂലപാഠത്തോട് ചേർന്ന് നിലനിർത്തി.
