source:
  edition: WLC
  text: וַ/יְהִי֩ לִ/תְשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מַּלְאֿכִ֗ים וַ/יִּשְׁלַ֣ח דָּוִ֡ד אֶת יוֹאָב֩ וְ/אֶת עֲבָדָ֨י/ו עִמּ֜/וֹ וְ/אֶת כָּל יִשְׂרָאֵ֗ל וַ/יַּשְׁחִ֨תוּ֙ אֶת בְּנֵ֣י עַמּ֔וֹן וַ/יָּצֻ֖רוּ עַל רַבָּ֑ה וְ/דָוִ֖ד יוֹשֵׁ֥ב בִּ/ירוּשָׁלִָֽם׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
translation:
  language: ml
  text: വർഷം തിരിയുന്ന കാലത്ത്[a], ദൂതന്മാർ പുറപ്പെടുന്ന സമയത്ത്[b], ദാവീദ് യോവാബിനെയും അവനോടൊപ്പം തന്റെ ഭൃത്യന്മാരെയും ഇസ്രായേൽ മുഴുവനെയും അയച്ചു. അവർ അമ്മോന്യരെ തകർക്കുകയും റബ്ബയെ ഉപരോധിക്കുകയും ചെയ്തു. എന്നാൽ ദാവീദ് യെരൂശലേമിൽത്തന്നെ കഴിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘വർഷം മടങ്ങിവരുന്ന/തിരിയുന്ന കാലത്ത്’; ഇത് സാധാരണയായി വസന്തകാലത്തെ സൈനികയാത്രാകാലത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കപ്പെടുന്നു.'
    reason: cultural_note
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായരൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘ദൂതന്മാർ’ എന്നാണ്. എന്നാൽ സൈനികസന്ദർഭവും 1 ദിനവൃത്താന്തം 20:1-ലെ സമാന്തരവാക്യവും കണക്കിലെടുത്ത്, ചില വിവർത്തനങ്ങൾ ‘രാജാക്കന്മാർ യുദ്ധത്തിനു പുറപ്പെടുന്ന സമയത്ത്’ എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: വർഷം തിരിയുന്ന കാലത്ത്
  rationale: ‘വർഷത്തിന്റെ മടക്കം/തിരിവ്’ എന്ന എബ്രായ കാലസൂചനയുടെ രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് വസന്തകാലത്തെ യുദ്ധകാലാവധിയെ സൂചിപ്പിക്കാമെങ്കിലും അതിനെ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: לְעֵת צֵאת הַמַּלְאֿכִים
  choice: ദൂതന്മാർ പുറപ്പെടുന്ന സമയത്ത്
  rationale: നൽകിയിരിക്കുന്ന WLC പാഠത്തിലെ הַמַּלְאָכִים എന്ന രൂപം ‘ദൂതന്മാർ’ എന്നാണ്. ‘രാജാക്കന്മാർ’ എന്ന സന്ദർഭോചിതമായ പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ശלח എന്ന സാധാരണ കഥനക്രിയയുടെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: עֲבָדָיו
  choice: തന്റെ ഭൃത്യന്മാരെ
  rationale: രാജസേവനത്തിലുള്ള സേവകരെയോ അനുചരരെയോ സൂചിപ്പിക്കുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘ഉദ്യോഗസ്ഥർ’ അല്ലെങ്കിൽ ‘സൈനികർ’ എന്നു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനെയും
  rationale: എബ്രായത്തിലെ സമൂഹവാചകത്തെ അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേലിന്റെ യുദ്ധസേനയെ സൂചിപ്പിക്കാം.
- source_word: וַיַּשְׁחִתוּ
  choice: തകർക്കുകയും
  rationale: ശחת എന്ന ക്രിയയുടെ വിനാശകരമായ സൈനികപ്രവർത്തനത്തെ അറിയിക്കുന്നു; തുടർന്ന് ഉപരോധം തുടരുന്നതിനാൽ സമ്പൂർണ ഉന്മൂലനം എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരെ
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന വംശനാമത്തിന്റെ സ്വാഭാവികമായ മലയാള ജനനാമരൂപം.
- source_word: וַיָּצֻרוּ עַל רַבָּה
  choice: റബ്ബയെ ഉപരോധിക്കുകയും ചെയ്തു
  rationale: צור על എന്ന പ്രയോഗത്തിന്റെ സൈനിക അർഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: יוֹשֵׁב
  choice: കഴിഞ്ഞു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇരുന്നു/വസിച്ചു’ എന്നാണെങ്കിലും, സൈന്യത്തോടൊപ്പം പോകാതെ ദാവീദ് യെരൂശലേമിൽ തുടരുകയായിരുന്നു എന്ന കഥനവൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽത്തന്നെ
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിക്കുകയും ദാവീദ് അവിടെ തുടരുന്നതിലെ വൈരുധ്യം ‘ത്തന്നെ’കൊണ്ട് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: לְעֵת צֵאת הַמַּלְאֿכִים എന്ന പ്രയോഗത്തിന്റെ പാഠവായന
  choice: ദൂതന്മാർ പുറപ്പെടുന്ന സമയത്ത്
  alternative: രാജാക്കന്മാർ യുദ്ധത്തിനു പുറപ്പെടുന്ന സമയത്ത്
  rationale: നൽകിയ WLC പാഠത്തിലെ അക്ഷരരൂപം ‘ദൂതന്മാർ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ സൈനികസന്ദർഭവും 1 ദിനവൃത്താന്തം 20:1-ലെ സമാന്തരവാക്യവും ‘രാജാക്കന്മാർ’ എന്ന പ്രസിദ്ധമായ പാഠവായനയ്ക്ക് ശക്തമായ പിന്തുണ നൽകുന്നു. മൂലപാഠസാക്ഷ്യത്തിന് മുൻഗണന നൽകി മുഖ്യപാഠത്തിൽ ‘ദൂതന്മാർ’ എന്നും യഥാർഥ പാഠപരമായ സംഘർഷം അടിക്കുറിപ്പിൽ എന്നും നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. അപരിചിതമായ അക്ഷരാർഥപ്രയോഗങ്ങൾ ഒഴിവാക്കിയെങ്കിലും പാഠത്തിലെ കാലസൂചനയും ‘ദൂതന്മാർ/രാജാക്കന്മാർ’ എന്ന യഥാർഥ പാഠസംഘർഷവും മറച്ചിട്ടില്ല.
