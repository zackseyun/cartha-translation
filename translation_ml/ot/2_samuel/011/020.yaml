translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. രാജാവിനെ പരാമർശിക്കുമ്പോൾ ആദരസൂചക ഏകവചനവും, സന്ദേശവാഹകനോടുള്ള യോവാബിന്റെ നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘നിന്നോട്’ എന്ന രൂപവും ഉപയോഗിച്ചു; ഉദ്ധരണിക്കുള്ളിലെ ‘നിങ്ങൾ’ ആക്രമണത്തിൽ പങ്കെടുത്ത സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
