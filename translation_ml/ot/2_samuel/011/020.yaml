  text: וְ/הָיָ֗ה אִֽם תַּעֲלֶה֙ חֲמַ֣ת הַ/מֶּ֔לֶךְ וְ/אָמַ֣ר לְ/ךָ֔ מַדּ֛וּעַ נִגַּשְׁתֶּ֥ם אֶל הָ/עִ֖יר לְ/הִלָּחֵ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יֹר֖וּ מֵ/עַ֥ל הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
translation:
  language: ml
  text: 'രാജാവിന്റെ കോപം ജ്വലിച്ച് അദ്ദേഹം നിന്നോട് ഇങ്ങനെ ചോദിച്ചാൽ: ‘യുദ്ധം ചെയ്യാൻ നിങ്ങൾ പട്ടണത്തോട് ഇത്ര അടുത്തുചെന്നത് എന്തിന്? മതിലിന്മുകളിൽനിന്ന് അവർ എന്ത് എയ്യുമെന്ന്[a] നിങ്ങൾ അറിഞ്ഞിരുന്നില്ലേ?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മതിലിന്മുകളിൽനിന്ന് അവർ എന്ത് എറിയുമെന്ന്.” എബ്രായ ക്രിയയ്ക്ക് വിവിധ പ്രക്ഷേപവസ്തുക്കൾ എറിയുക എന്ന വിശാലമായ അർഥവും വരാം; സൈനികസന്ദർഭത്തിൽ “എയ്യുക” എന്ന അർഥമാണ് പ്രധാനമായി തോന്നുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: …ചോദിച്ചാൽ
  rationale: ഈ പ്രയോഗം യോവാബ് മുന്നിൽക്കാണുന്ന ഒരു സോപാധിക സാഹചര്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യാവസാനത്തിലെ ‘ചോദിച്ചാൽ’ ആ വ്യവസ്ഥാഭാവവും മുൻവിവരണത്തോടുള്ള ബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  choice: രാജാവിന്റെ കോപം ജ്വലിച്ച്
  rationale: חֵמָה കടുത്ത കോപത്തെയോ ഉഗ്രതയെയോ സൂചിപ്പിക്കുന്നു; עלה അതിന്റെ ഉയർച്ചയെ ചിത്രീകരിക്കുന്നു. ‘കോപം ജ്വലിച്ച്’ എന്നത് ആ ദൃശ്യഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: וְאָמַר לְךָ
  choice: അദ്ദേഹം നിന്നോട് ഇങ്ങനെ ചോദിച്ചാൽ
  rationale: സോപാധിക സാഹചര്യത്തിലുള്ള രാജാവിന്റെ ഭാവികാല വാക്കുകളാണ് ഉദ്ദേശിക്കുന്നത്. തുടർന്നുവരുന്ന നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘ഇങ്ങനെ ചോദിച്ചാൽ’ ഉപയോഗിച്ചു.
- source_word: מַדּוּעַ
  choice: എന്തിന്
  rationale: കാരണം ചോദിക്കുന്ന സാധാരണവും നേരിട്ടുമായ മലയാള പദം.
- source_word: נִגַּשְׁתֶּם אֶל הָעִיר
  choice: നിങ്ങൾ പട്ടണത്തോട് ഇത്ര അടുത്തുചെന്നത്
  rationale: נגשׁ എന്നത് സമീപിക്കുക എന്നർഥം നൽകുന്നു. സന്ദർഭത്തിലെ ശാസനാഭാവം—മതിലിനോട് അപകടകരമായി അധികം അടുത്തത്—വ്യക്തമാക്കാൻ ‘ഇത്ര അടുത്തുചെന്നത്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְהִלָּחֵם
  choice: യുദ്ധം ചെയ്യാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ന്റെ അർഥം വ്യക്തവും നിലവാരമുള്ള മലയാളത്തിൽ നൽകുന്നു.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: നിങ്ങൾ അറിഞ്ഞിരുന്നില്ലേ
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ ശാസനാഭാവം മലയാളത്തിലെ ‘ഇല്ലേ’ ഘടന നിലനിർത്തുന്നു.
- source_word: אֵת אֲשֶׁר יֹרוּ
  choice: അവർ എന്ത് എയ്യുമെന്ന്
  rationale: ירה എന്ന ക്രിയയ്ക്ക് എയ്യുക, പ്രക്ഷേപിക്കുക, എറിയുക എന്നീ അർഥങ്ങൾ വരാം. സൈനികസന്ദർഭത്തിൽ ‘എയ്യുക’ പ്രധാന അർഥം നന്നായി നൽകുന്നു; എറിഞ്ഞിടുന്ന മറ്റു പ്രക്ഷേപവസ്തുക്കളുടെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מֵעַל הַחוֹמָה
  choice: മതിലിന്മുകളിൽനിന്ന്
  rationale: מֵעַל എന്നതിലെ ‘മുകളിൽനിന്ന്’ എന്ന സ്ഥലബന്ധം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
