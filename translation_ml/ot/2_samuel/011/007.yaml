translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. വ്യക്തികളുടെ കാര്യത്തിൽ ‘ക്ഷേമം’ നിലനിർത്തിയപ്പോൾ, ‘യുദ്ധത്തിന്റെ ക്ഷേമം’ എന്ന അസ്വാഭാവിക പ്രയോഗത്തിന് പകരം ‘യുദ്ധം എങ്ങനെ പുരോഗമിക്കുന്നു’ എന്നു നൽകി; മൂലത്തിലെ സമാന്തര ആവർത്തനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
