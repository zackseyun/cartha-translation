  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֥א אוּרִיָּ֖ה אֵלָ֑י/ו וַ/יִּשְׁאַ֣ל דָּוִ֗ד לִ/שְׁל֤וֹם יוֹאָב֙ וְ/לִ/שְׁל֣וֹם הָ/עָ֔ם וְ/לִ/שְׁל֖וֹם הַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/007.yaml
  text: When Uriah came to him[a], David asked about Joab's welfare, the welfare of the troops, and the welfare of the war.
translation:
  language: ml
  text: ഊരീയാവ് ദാവീദിന്റെ അടുക്കൽ വന്നപ്പോൾ, ദാവീദ് യോവാബിന്റെ ക്ഷേമവും സൈന്യത്തിന്റെ ക്ഷേമവും യുദ്ധം എങ്ങനെ പുരോഗമിക്കുന്നുവെന്നും ചോദിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ദാവീദ് യോവാബിന്റെയും സൈന്യത്തിന്റെയും യുദ്ധത്തിന്റെയും ക്ഷേമം അഥവാ നിലയെക്കുറിച്ച് ചോദിച്ചു. എബ്രായത്തിൽ ‘ക്ഷേമം/നില’ എന്ന ഒരേ പദം മൂന്നിടത്തും ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നപ്പോൾ
  rationale: בוא എന്ന ക്രിയയ്ക്ക് ഇവിടെ ‘വരുക’ എന്നാണ് സ്വാഭാവിക അർഥം. തുടർന്നുള്ള പ്രവൃത്തിയുമായി ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ ‘വന്നപ്പോൾ’ എന്നു നൽകി.
- source_word: אֵלָיו
  choice: അവന്റെ അടുക്കൽ
  rationale: אֶל എന്ന പൂർവപ്രത്യയം ദാവീദിന്റെ അടുത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു. ‘അവന്റെ അടുക്കൽ’ ഈ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁאַל
  choice: ചോദിച്ചു
  rationale: שׁאל ഇവിടെ യുദ്ധമുഖത്തെ അവസ്ഥയെക്കുറിച്ചുള്ള അന്വേഷണം സൂചിപ്പിക്കുന്നു. ‘ചോദിച്ചു’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: לִשְׁלוֹם
  choice: ക്ഷേമം / എങ്ങനെ പുരോഗമിക്കുന്നു
  rationale: ഈ ഘടനയിൽ שָׁלוֹם വ്യക്തികളുടെ ക്ഷേമത്തെയോ ഒരു കാര്യത്തിന്റെ നിലയെയോ സൂചിപ്പിക്കുന്നു. യോവാബിനും സൈന്യത്തിനും ‘ക്ഷേമം’ എന്നും യുദ്ധത്തിന് സ്വാഭാവിക മലയാളത്തിൽ ‘എങ്ങനെ പുരോഗമിക്കുന്നു’ എന്നും നൽകി; എബ്രായത്തിലെ ആവർത്തനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: יוֹאָב
  choice: യോവാബ്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הָעָם
  choice: സൈന്യം
  rationale: עָם സാധാരണയായി ‘ജനം’ എന്നാണെങ്കിലും ഈ സൈനികസന്ദർഭത്തിൽ യോവാബിനോടൊപ്പമുള്ള പോരാളികളെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘സൈന്യം’ സന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: הַמִּלְחָמָה
  choice: യുദ്ധം
  rationale: מִלְחָמָה യുദ്ധത്തെയോ പോരാട്ടത്തെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ വിശാലമായ സൈനികനടപടിയുടെ സന്ദർഭത്തിന് ‘യുദ്ധം’ യോജിക്കുന്നു.
