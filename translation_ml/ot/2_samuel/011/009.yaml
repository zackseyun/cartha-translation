source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֣ב אוּרִיָּ֗ה פֶּ֚תַח בֵּ֣ית הַ/מֶּ֔לֶךְ אֵ֖ת כָּל עַבְדֵ֣י אֲדֹנָ֑י/ו וְ/לֹ֥א יָרַ֖ד אֶל בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/009.yaml
  text: But Uriah slept at the entrance of the king’s house with all the servants of his lord[d][c][b][a], and did not go down to his house.
translation:
  language: ml
  text: എന്നാൽ ഊരീയാവ് തന്റെ യജമാനന്റെ എല്ലാ ദാസന്മാരോടുംകൂടെ രാജഭവനത്തിന്റെ പ്രവേശനവാതിൽക്കൽ കിടന്നുറങ്ങി[a]; തന്റെ വീട്ടിലേക്കു ഇറങ്ങിപ്പോയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കിടന്നു’ / ‘രാത്രി തങ്ങി.’ എബ്രായ ക്രിയയ്ക്ക് ‘കിടക്കുക,’ ‘ഉറങ്ങുക’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ഊരീയാവ് അവിടെ രാത്രി കഴിച്ചതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, ‘വീട്ടിലേക്കു പോയില്ല.’ അക്ഷരാർഥം: ‘തന്റെ വീട്ടിലേക്കു ഇറങ്ങിപ്പോയില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: കിടന്നുറങ്ങി
  rationale: שׁכב എന്ന ക്രിയയ്ക്ക് ‘കിടക്കുക’ എന്നും ‘ഉറങ്ങുക’ എന്നും അർഥമാകാം. ഊരീയാവ് അവിടെ രാത്രി തങ്ങിയെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുമ്പോഴും മൂലപദത്തിന്റെ ഇരുവശവും ‘കിടന്നുറങ്ങി’ നിലനിർത്തുന്നു.
- source_word: פֶּתַח
  choice: പ്രവേശനവാതിൽക്കൽ
  rationale: פֶּתַח ഒരു തുറവിനെയോ പ്രവേശനസ്ഥാനത്തെയോ വാതിൽക്കലിനെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ സ്ഥലസൂചന വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജഭവനം
  rationale: അക്ഷരാർഥം ‘രാജാവിന്റെ വീട്’ എന്നാണ്; രാജകീയ വസതിയെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘രാജഭവനം’ ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֵת כָּל עַבְדֵי אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ എല്ലാ ദാസന്മാരോടുംകൂടെ
  rationale: אֵת ഇവിടെ സഹവാസമോ കൂട്ടായ്മയോ സൂചിപ്പിക്കുന്നു. עֲבָדִים എന്നതിന് ഈ രാജസഭാ സന്ദർഭത്തിൽ ‘ദാസന്മാർ’ യോജിക്കുന്നു; אֲדֹנָיו ദാവീദിനെ ഊരീയാവിന്റെ മേലധികാരിയായ യജമാനൻ എന്നു സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  choice: തന്റെ വീട്ടിലേക്കു ഇറങ്ങിച്ചെന്നില്ല
  rationale: ירד എന്ന ‘ഇറങ്ങുക’ എന്ന ദിശാസൂചനയും בֵּיתוֹ എന്ന ‘തന്റെ വീട്’ എന്ന മൂർത്തമായ പ്രയോഗവും നിലനിർത്തുന്നു.
