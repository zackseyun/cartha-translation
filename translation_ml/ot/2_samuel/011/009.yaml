translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘രാജഭവനം’ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; ‘യജമാനൻ,’ ‘ദാസന്മാർ’ എന്നിവ രാജസഭയിലെ സാമൂഹികബന്ധം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
