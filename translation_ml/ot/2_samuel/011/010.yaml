  to: 'അവർ ദാവീദിനെ അറിയിച്ചു: “ഊരീയാവ് തന്റെ വീട്ടിലേക്കു ഇറങ്ങിപ്പോയില്ല.” അപ്പോൾ ദാവീദ് ഊരീയാവിനോടു പറഞ്ഞു: “നീ യാത്രയിൽനിന്ന് വന്നതല്ലേ?[a] പിന്നെ എന്തുകൊണ്ടാണ് നിന്റെ വീട്ടിലേക്കു ഇറങ്ങിപ്പോകാതിരുന്നത്?”[b]'
