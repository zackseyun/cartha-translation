  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגִּ֤דוּ לְ/דָוִד֙ לֵ/אמֹ֔ר לֹֽא יָרַ֥ד אוּרִיָּ֖ה אֶל בֵּית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה הֲ/ל֤וֹא מִ/דֶּ֨רֶךְ֙ אַתָּ֣ה בָ֔א מַדּ֖וּעַ לֹֽא יָרַ֥דְתָּ אֶל בֵּיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
translation:
  language: ml
  text: 'അവർ ദാവീദിനെ അറിയിച്ചു: “ഊരീയാവ് തന്റെ വീട്ടിലേക്കു ഇറങ്ങിപ്പോയില്ല.” അപ്പോൾ ദാവീദ് ഊരീയാവിനോടു പറഞ്ഞു: “നീ യാത്രയിൽനിന്ന് വന്നതല്ലേ?[a] പിന്നെ എന്തുകൊണ്ടാണ് നിന്റെ വീട്ടിലേക്കു ഇറങ്ങിപ്പോകാതിരുന്നത്?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “നീ വഴിയിൽനിന്ന് വന്നതല്ലേ?” എന്നാണ്; ഇവിടെ അതിന്റെ അർഥം യാത്രയിൽനിന്ന് വരുക എന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: “വീട്ടിലേക്കു ഇറങ്ങിപ്പോകുക” എന്നത് വീട്ടിലേക്കു പോകുന്നതിനെ സൂചിപ്പിക്കുന്ന അക്ഷരാർഥപ്രയോഗമാണ്; കൊട്ടാരമോ ഔദ്യോഗികമേഖലയോ ഉയർന്ന സ്ഥലത്തായിരുന്നതും ഇതിനു പശ്ചാത്തലമായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: 'അവർ ദാവീദിനെ അറിയിച്ചു:'
  rationale: ഹിഫീൽ രൂപമായ נגד ഇവിടെ അറിയിക്കുക/വിവരം പറയുക എന്നാണ്. לֵאמֹר എന്ന ഉദ്ധരണി-ആമുഖം മലയാളത്തിൽ സ്വാഭാവികമായ ദ്വിബിന്ദുവിലൂടെ പ്രകടമാക്കി.
- source_word: לֹא יָרַד אוּרִיָּה אֶל בֵּיתוֹ
  choice: ഊരീയാവ് തന്റെ വീട്ടിലേക്കു ഇറങ്ങിപ്പോയില്ല
  rationale: ירד എന്നതിന്റെ ‘ഇറങ്ങുക’ എന്ന ദിശാബോധവും തുടർന്നുള്ള ചോദ്യത്തിലെ ആവർത്തനവും നിലനിർത്തി; ‘തന്റെ’ എന്നത് പ്രതിഫലനാത്മക ഉടമസ്ഥത മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ കഥാഗതിയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הֲלוֹא מִדֶּרֶךְ אַתָּה בָא
  choice: നീ യാത്ര കഴിഞ്ഞ് വന്നതല്ലേ?
  rationale: הֲלוֹא സമ്മതാത്മക മറുപടി പ്രതീക്ഷിക്കുന്ന ചോദ്യം ആകയാൽ ‘അല്ലേ?’ ഉപയോഗിച്ചു. מִדֶּרֶךְ എന്നത് അക്ഷരാർഥത്തിൽ ‘വഴിയിൽനിന്ന്’ എങ്കിലും ഇവിടെ യാത്രയിൽനിന്നുള്ള വരവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מַדּוּעַ לֹא יָרַדְתָּ אֶל בֵּיתֶךָ
  choice: പിന്നെ എന്തുകൊണ്ടാണ് നിന്റെ വീട്ടിലേക്കു ഇറങ്ങിപ്പോകാതിരുന്നത്?
  rationale: ‘എന്തുകൊണ്ട്’ കാരണചോദ്യത്തെ നേരിട്ട് നൽകുന്നു; ആദ്യവാക്യത്തിലെ ירד/בית ആവർത്തനം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ഹീബ്രുവിലെ ‘ഇറങ്ങിപ്പോകുക’ എന്ന ആവർത്തനം കഥയിലെ സംഘർഷം നിലനിർത്തുന്നതിനായി സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
