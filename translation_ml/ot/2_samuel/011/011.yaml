reference: 2 Samuel 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
translation:
  language: ml
  text: 'ഊരീയാവ് ദാവീദിനോടു പറഞ്ഞു: “പെട്ടകവും ഇസ്രായേലും യെഹൂദയും താത്കാലിക കുടിലുകളിൽ[a] കഴിയുന്നു; എന്റെ യജമാനനായ യോവാബും എന്റെ യജമാനന്റെ ഭൃത്യന്മാരും തുറസ്സായ വയലിൽ പാളയമടിച്ചിരിക്കുന്നു. എന്നിട്ടും ഞാൻ എന്റെ വീട്ടിൽ ചെന്നു തിന്നുകയും കുടിക്കുകയും എന്റെ ഭാര്യയോടൊപ്പം കിടക്കുകയും ചെയ്യുമോ?[b] അങ്ങ് ജീവിച്ചിരിക്കുന്നതാണേ, അങ്ങയുടെ ജീവൻ തന്നെയാണേ,[c] ഞാൻ ഈ കാര്യം ചെയ്യുകയില്ല!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന് ‘കുടിലുകൾ’ അല്ലെങ്കിൽ ‘താത്കാലിക മറപ്പുരകൾ’ എന്നും അർഥമാകാം; വയലിൽ ഉപയോഗിച്ചിരുന്ന താത്കാലിക പാർപ്പിടങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഇത് ഊരീയാവിന്റെ നിരാകരണം പ്രകടമാക്കുന്ന ആലങ്കാരിക ചോദ്യമാണ്.
    reason: alternative_reading
  - marker: c
    text: 'എബ്രായ ശപഥസൂത്രം: ‘അങ്ങ് ജീവിച്ചിരിക്കുന്നതാണേ, അങ്ങയുടെ ജീവൻ തന്നെയാണേ, ഞാൻ ഈ കാര്യം ചെയ്താൽ….’ ഇവിടെ അപൂർണമായി നിൽക്കുന്ന ‘ചെയ്താൽ’ ശക്തമായ നിഷേധം സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: പെട്ടകം
  rationale: എബ്രായത്തിൽ വിശേഷണവികാസമില്ലാതെ നിർദ്ദിഷ്ടരൂപത്തിൽ ‘പെട്ടകം’ എന്നുമാത്രമാണ്; ‘ദൈവത്തിന്റെ പെട്ടകം’ അല്ലെങ്കിൽ ‘നിയമപെട്ടകം’ എന്നു വികസിപ്പിക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  choice: താത്കാലിക കുടിലുകളിൽ കഴിയുന്നു
  rationale: סֻכּוֹת വയലിൽ ഉപയോഗിക്കുന്ന താത്കാലിക കുടിലുകളെയോ മറപ്പുരകളെയോ സൂചിപ്പിക്കുന്നു; ‘കൂടാരങ്ങൾ’ എന്നതിനെക്കാൾ ഈ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ഇവിടെ ദൈവനാമമല്ല, മനുഷ്യനായ മേലധികാരിയെ ആദരപൂർവം സൂചിപ്പിക്കുന്ന പദമാണ്; യോവാബിനോടുള്ള സൈനിക കീഴ്വഴക്കം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: തുറസ്സായ വയലിൽ
  rationale: ‘വയലിന്റെ മുഖത്ത്’ എന്ന ശാബ്ദിക പ്രയോഗം തുറന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തുറസ്സായ വയലിൽ’ അതിന്റെ സാഹചര്യാർഥം വ്യക്തമാക്കുന്നു.
- source_word: חֹנִים
  choice: പാളയമടിച്ചിരിക്കുന്നു
  rationale: തുടരുന്ന സൈനിക പാളയവാസത്തെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചകമാണ്; യുദ്ധസാഹചര്യത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളം.
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי
  choice: എന്നിട്ടും ഞാൻ എന്റെ വീട്ടിൽ ചെന്നു … ചെയ്യുമോ?
  rationale: മുൻപറഞ്ഞ സാഹചര്യങ്ങളോടുള്ള വൈരുധ്യവും ഊരീയാവിന്റെ പ്രതിഷേധാത്മകമായ ആലങ്കാരിക ചോദ്യവും ‘എന്നിട്ടും … ചെയ്യുമോ?’ എന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  choice: തിന്നുകയും കുടിക്കുകയും എന്റെ ഭാര്യയോടൊപ്പം കിടക്കുകയും
  rationale: മൂലത്തിലെ ആവർത്തിത ക്രിയാശൃംഖലയും ലൈംഗികസൂചനയുള്ള മിതമായ പ്രയോഗവും മാന്യവും വ്യക്തവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  choice: അങ്ങ് ജീവിച്ചിരിക്കുന്നതാണേ, അങ്ങയുടെ ജീവൻ തന്നെയാണേ
  rationale: അഭിസംബോധിതന്റെ ജീവനെച്ചൊല്ലിയുള്ള ഇരട്ട ശപഥസൂത്രത്തിന്റെ ഗൗരവവും ആവർത്തനവും പരമാവധി നിലനിർത്തുന്നു.
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: ഞാൻ ഈ കാര്യം ചെയ്യുകയില്ല
  rationale: ശപഥസൂത്രത്തിനു ശേഷമുള്ള אִם അപൂർണമായ ശാപവാക്യത്തിലൂടെ ശക്തമായ നിഷേധം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ നിഷേധം വ്യക്തമായി പറയുന്നു.
theological_decisions:
- issue: പെട്ടകത്തിന്റെ വിപുലമായ പേര്
  choice: ‘പെട്ടകം’ എന്ന മൂലപാഠത്തിലെ ലളിതരൂപം നിലനിർത്തി
  alternative: ‘ദൈവത്തിന്റെ പെട്ടകം’ / ‘നിയമപെട്ടകം’
  rationale: സന്ദർഭത്തിൽ അതിന്റെ വിശുദ്ധമായ പരിചിതസൂചന നിലനിൽക്കുമ്പോഴും ഈ വാക്യത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രപരമായ വിശേഷണം ചേർക്കുന്നില്ല.
- issue: ശപഥവാക്യത്തിന്റെ അപൂർണ രൂപം
  choice: പ്രധാനപാഠത്തിൽ ശക്തമായ നിഷേധമായി പരിഭാഷപ്പെടുത്തി; രൂപപരമായ പ്രത്യേകത അടിക്കുറിപ്പിൽ അറിയിച്ചു
  alternative: ‘ഞാൻ ഈ കാര്യം ചെയ്താൽ…’ എന്ന് അപൂർണമായി വിടുക
  rationale: എബ്രായ ശപഥരീതിയുടെ ആശയം മലയാളവായനക്കാരന് വ്യക്തമായി നൽകുകയും അതിന്റെ മൂലരൂപം മറച്ചുവെക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദാവീദിനോടുള്ള ആദരസൂചകമായി ‘അങ്ങ്’ ഉപയോഗിച്ചു; യോവാബിന്റെ സൈനിക അധികാരബന്ധത്തിന് ‘യജമാനൻ’, കീഴാളർക്കായി ‘ഭൃത്യന്മാർ’ എന്നിവ തെരഞ്ഞെടുത്തു. ആലങ്കാരിക ചോദ്യവും ശപഥത്തിന്റെ ഇരട്ട ഗൗരവവും നിലനിർത്തി.
