id: 2SA.11.26
reference: 2 Samuel 11:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּשְׁמַע֙ אֵ֣שֶׁת אֽוּרִיָּ֔ה כִּי מֵ֖ת אוּרִיָּ֣ה אִישָׁ֑/הּ וַ/תִּסְפֹּ֖ד עַל בַּעְלָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
translation:
  language: ml
  text: ഊരീയാവിന്റെ ഭാര്യ, തന്റെ ഭർത്താവായ ഊരീയാവ് മരിച്ചുപോയി[a] എന്നു കേട്ടപ്പോൾ, അവൾ തന്റെ ഭർത്താവിനെച്ചൊല്ലി വിലപിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ ഭർത്താവായ ഊരീയാവ് മരിച്ച നിലയിലാണെന്ന്.”
    reason: മֵת എന്ന രൂപം സംഭവിച്ച മരണത്തെ ‘മരിച്ചുപോയി’ എന്നും, മരിച്ച അവസ്ഥയെ ‘മരിച്ച നിലയിലായിരുന്നു/ആണ്’ എന്നും ഗ്രഹിക്കാവുന്നതാണ്.
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: കേട്ടപ്പോൾ
  rationale: שׁמע എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു; തുടർന്നുള്ള כִּי-വാക്യം കേട്ട വിവരത്തിന്റെ ഉള്ളടക്കമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: אֵשֶׁת אוּרִיָּה
  choice: ഊരീയാവിന്റെ ഭാര്യ
  rationale: എബ്രായത്തിലെ construct ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥബന്ധരൂപത്തിൽ നൽകുന്നു.
- source_word: כִּי
  choice: എന്നു
  rationale: ഇവിടെ כִּי കേട്ട വാർത്തയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉദ്ധരണാർഥകമായ ‘എന്നു’ അതിനെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵת
  choice: മരിച്ചുപോയി
  rationale: ഊരീയാവിന്റെ മരണം സംഭവിച്ചുകഴിഞ്ഞതാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘മരിച്ച നിലയിലായിരുന്നു’ എന്ന നിലാവസ്ഥാ വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אוּרִיָּה אִישָׁהּ
  choice: തന്റെ ഭർത്താവായ ഊരീയാവ്
  rationale: ഊരീയാവിനെ അവളുടെ ഭർത്താവായി വ്യക്തമാക്കുന്ന എബ്രായ സമാനാധികരണബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וַתִּסְפֹּד
  choice: വിലപിച്ചു
  rationale: ספד മരിച്ചയാളെച്ചൊല്ലിയുള്ള ആചാരപരമോ പ്രകടമോ ആയ ദുഃഖവിലാപത്തെ സൂചിപ്പിക്കുന്നു; ‘ദുഃഖിച്ചു’ എന്നതിനെക്കാൾ ‘വിലപിച്ചു’ മൂലപദത്തിന്റെ പ്രത്യേകത നന്നായി വഹിക്കുന്നു.
- source_word: עַל בַּעְלָהּ
  choice: തന്റെ ഭർത്താവിനെച്ചൊല്ലി
  rationale: വിലാപത്തിന്റെ വിഷയമായ ഭർത്താവിനെ עַל സൂചിപ്പിക്കുന്നു; ‘-നെച്ചൊല്ലി’ ആ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഒരേ വാക്യത്തിൽ ‘ഭർത്താവ്’ ആവർത്തിക്കുന്നത് മൂലപാഠത്തിലെ אִישָׁהּ / בַּעְלָהּ ആവർത്തനവും ഊരീയാവുമായുള്ള ബന്ധത്തിൽ നൽകിയ ഊന്നലും നിലനിർത്താനാണ്.
