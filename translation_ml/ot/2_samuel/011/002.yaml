  text: וַ/יְהִ֣י לְ/עֵ֣ת הָ/עֶ֗רֶב וַ/יָּ֨קָם דָּוִ֜ד מֵ/עַ֤ל מִשְׁכָּב/וֹ֙ וַ/יִּתְהַלֵּךְ֙ עַל גַּ֣ג בֵּית הַ/מֶּ֔לֶךְ וַ/יַּ֥רְא אִשָּׁ֛ה רֹחֶ֖צֶת מֵ/עַ֣ל הַ/גָּ֑ג וְ/הָ֣/אִשָּׁ֔ה טוֹבַ֥ת מַרְאֶ֖ה מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
translation:
  language: ml
  text: സന്ധ്യാസമയത്ത്[a] ദാവീദ് തന്റെ കിടക്കയിൽനിന്ന് എഴുന്നേറ്റ് രാജമന്ദിരത്തിന്റെ[b] മട്ടുപ്പാവിൽ നടന്നു. മട്ടുപ്പാവിൽനിന്ന് അവൻ കുളിച്ചുകൊണ്ടിരുന്ന ഒരു സ്ത്രീയെ കണ്ടു; ആ സ്ത്രീ കാഴ്ചയിൽ അതിസുന്ദരിയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘സന്ധ്യാസമയത്ത് അങ്ങനെ സംഭവിച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ പദാനുപദമായി ‘രാജാവിന്റെ വീട്’; സന്ദർഭത്തിൽ ‘രാജമന്ദിരം’ എന്നത് സാധ്യമായ വിവർത്തനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  choice: സന്ധ്യാസമയത്ത്
  rationale: സംഭവവിവരണത്തിന്റെ പുരോഗതിയും സമയസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഹീബ്രു അവതരണസൂത്രത്തിന്റെ കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּקָם ... מֵעַל מִשְׁכָּבוֹ
  choice: തന്റെ കിടക്കയിൽനിന്ന് എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയും מִשְׁכָּב എന്ന കിടക്കുന്ന ഇടം/കിടക്ക എന്ന അർഥവും സന്ദർഭോചിതവും സ്വാഭാവികവുമായി പകർത്തുന്നു.
- source_word: וַיִּתְהַלֵּךְ
  choice: നടന്നു
  rationale: ഹിത്പയേൽ രൂപത്തിലുള്ള സഞ്ചാരപ്രവൃത്തിയെ ലളിതമായി അറിയിക്കുന്നു; ഉലാത്തി എന്നതുപോലെ ഉദ്ദേശമോ മനോഭാവമോ അധികമായി സൂചിപ്പിക്കുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  choice: രാജമന്ദിരത്തിന്റെ മട്ടുപ്പാവിലൂടെ
  rationale: പുരാതന സമതല മേൽക്കൂരയെ മട്ടുപ്പാവ് എന്നു വ്യക്തമായി സൂചിപ്പിക്കുന്നു. בֵּית הַמֶּלֶךְ എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം രാജമന്ദിരം; പദാനുപദ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  choice: കുളിച്ചുകൊണ്ടിരുന്ന ഒരു സ്ത്രീയെ അവൻ കണ്ടു
  rationale: רֹחֶצֶת എന്ന വർത്തമാനകൃദന്തത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം ‘കുളിച്ചുകൊണ്ടിരുന്ന’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: מֵעַל הַגָּג
  choice: മട്ടുപ്പാവിൽനിന്ന്
  rationale: ഈ സ്ഥലംസൂചക പ്രയോഗം ദാവീദിന്റെ കാഴ്ചസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിച്ച് വിവർത്തനം ചെയ്യുന്നു.
- source_word: טוֹבַת מַרְאֶה מְאֹד
  choice: കാഴ്ചയിൽ അതിസുന്ദരിയായിരുന്നു
  rationale: מַרְאֶהയിലെ ദൃശ്യരൂപത്തിനുള്ള ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
