translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള കഥനശൈലി. ‘മട്ടുപ്പാവ്’ പുരാതന സമതല മേൽക്കൂരയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ തുടർച്ചയായ ക്രിയാക്രമം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളായി ക്രമപ്പെടുത്തി; ദാവീദിന്റെ ഉദ്ദേശത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
