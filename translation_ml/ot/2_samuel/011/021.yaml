source:
  edition: WLC
  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
translation:
  language: ml
  text: '“യെരുബ്ബേശെത്ത്[a]ന്റെ മകനായ അബീമേലെക്കിനെ കൊന്നത് ആരാണ്? ഒരു സ്ത്രീ മതിലിന്റെ മുകളിൽനിന്ന് തിരികല്ലിന്റെ ഒരു കഷണം[b] അവന്റെമേൽ എറിഞ്ഞതുകൊണ്ടല്ലയോ അവൻ തേബെസിൽ[c] മരിച്ചത്? നിങ്ങൾ എന്തിനാണ് മതിലിനടുത്തേക്കു ചെന്നത്?” എന്നു അവൻ പറഞ്ഞാൽ, നീ ഇങ്ങനെ പറയണം: “അങ്ങയുടെ ദാസനായ ഹിത്യനായ ഊരീയാവും മരിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ന്യായാധിപന്മാർ 9:1-ൽ ഈ പേര് “യെരുബ്ബാൽ” എന്നാണ്; ഇവിടെ എബ്രായപാഠത്തിൽ “യെരുബ്ബേശെത്ത്” എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “മുകളിലെ തിരികല്ല്.” എബ്രായപ്രയോഗം തിരികല്ലിന്റെ ഒരു ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; സാധ്യതയേറിയത് മുകളിലെ കല്ലാണ്.
    reason: lexical_alternative
  - marker: c
    text: ഈ സംഭവവിവരണത്തിന് ന്യായാധിപന്മാർ 9:53 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  choice: കൊന്നത്
  rationale: നכה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘അടിക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ പ്രഹാരം മരണകാരണമാകുന്ന സാഹചര്യത്തിൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘കൊന്നത്’ എന്നു നൽകി.
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבֶּשֶׁת
  choice: യെരുബ്ബേശെത്തിന്റെ മകനായ അബീമേലെക്ക്
  rationale: ന്യായാധിപന്മാർ 9-ലെ പരിചിതമായ ‘യെരുബ്ബാൽ’ എന്ന രൂപത്തിലേക്കു സമന്വയിപ്പിക്കാതെ മസോററ്റിക് പാഠത്തിലെ ‘യെരുബ്ബേശെത്ത്’ നിലനിർത്തി.
- source_word: הֲלוֹא
  choice: അല്ലയോ
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക അലങ്കാരചോദ്യത്തിന്റെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: פֶּלַח רֶכֶב
  choice: തിരികല്ലിന്റെ ഒരു കഷണം
  rationale: പദസമുച്ചയം ഒരു തിരികല്ലിന്റെ ഭാഗത്തെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്; അത് മുകളിലെ തിരികല്ലായിരിക്കാം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി, പാഠത്തിൽ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
- source_word: מֵעַל הַחוֹמָה
  choice: മതിലിന്റെ മുകളിൽനിന്ന്
  rationale: מֵעַל സൂചിപ്പിക്കുന്ന ഉയർന്ന സ്ഥാനത്തുനിന്നുള്ള ചലനം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיָּמָת בְּתֵבֵץ
  choice: അവൻ തേബെസിൽ മരിച്ചത്
  rationale: തുടർസംഭവവും മരണഫലവും സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לָמָּה נִגַּשְׁתֶּם אֶל הַחוֹמָה
  choice: നിങ്ങൾ എന്തിനാണ് മതിലിനടുത്തേക്കു ചെന്നത്?
  rationale: נגשׁ എന്നതിന്റെ ‘അടുത്തുചെല്ലുക’ എന്ന അർഥവും സൈനിക പിഴവിനെക്കുറിച്ചുള്ള ശാസനയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: וְאָמַרְתָּ
  choice: നീ ഇങ്ങനെ പറയണം
  rationale: സന്ദേശവാഹകനോടുള്ള നിർദേശം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജാവിനോടുള്ള ആദരപൂർവമായ കീഴ്വഴക്കഭാഷയ്ക്ക് ‘ദാസൻ’ യോജിക്കുന്നു; ഇവിടെ ‘അടിമ’ എന്ന കൂടുതൽ കഠിനമായ സാമൂഹിക അർഥം നിർബന്ധമല്ല.
- source_word: גַּם
  choice: -വും
  rationale: ഊരീയാവും മറ്റു മരിച്ചവരോടൊപ്പം മരിച്ചുവെന്ന കൂട്ടിച്ചേർക്കൽശക്തി മലയാളത്തിലെ ‘-വും’ സ്വാഭാവികമായി വഹിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. രാജാവിനെ അഭിസംബോധന ചെയ്യുന്നിടത്ത് ‘അങ്ങയുടെ’ എന്ന ആദരരൂപം ഉപയോഗിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ സങ്കൽപ്പിത ചോദ്യവും അതിന് നൽകേണ്ട മറുപടിയും വ്യക്തമായി വേർതിരിച്ചു; മൂലപാഠത്തിലെ ലെക്സിക്കൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
