    issue: The verb introducing the king’s possible speech is translated “ചോദിച്ചാൽ.”
    rationale: וְאָמַרְתָּ is ‘and you shall say,’ and the preceding implied contingency is more broadly ‘if he says.’ “പറഞ്ഞാൽ” is closer while remaining idiomatic.
  - severity: medium
    issue: The combined footnote [b] is anchored after the final report about Uriah rather than at “യെരുബ്ബേശെത്ത്,” and it combines two distinct note functions.
    rationale: The textual-name variant concerns Jerubbesheth and should be anchored there. The Judges 9:53 cross-reference concerns the Abimelech incident and is best presented separately, allowing each note to have a precise anchor.
