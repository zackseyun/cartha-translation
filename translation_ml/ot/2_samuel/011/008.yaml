source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/א֣וּרִיָּ֔ה רֵ֥ד לְ/בֵיתְ/ךָ֖ וּ/רְחַ֣ץ רַגְלֶ֑י/ךָ וַ/יֵּצֵ֤א אֽוּרִיָּה֙ מִ/בֵּ֣ית הַ/מֶּ֔לֶךְ וַ/תֵּצֵ֥א אַחֲרָ֖י/ו מַשְׂאַ֥ת הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/008.yaml
  text: Then David said to Uriah[a], “Go down to your house and wash your feet.” So Uriah went out from the king’s house[b], and a present from the king went out after him.
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് ഊരീയാവിനോട് പറഞ്ഞു: “നിന്റെ വീട്ടിലേക്കു ഇറങ്ങിച്ചെന്ന് കാലുകൾ കഴുകുക.[a]” ഊരീയാവ് രാജാവിന്റെ ഭവനത്തിൽനിന്നു പുറപ്പെട്ടു; രാജാവിന്റെ ഒരു സമ്മാനവും[b] അവന്റെ പിന്നാലെ പുറപ്പെട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കാലുകൾ കഴുകുക” എന്നത് അക്ഷരാർഥത്തിലുള്ള പ്രയോഗമാണ്; യാത്രയ്ക്കുശേഷം ആശ്വാസം നേടുന്നതിനെയോ വീട്ടിൽ ചെന്നു വിശ്രമിക്കുന്നതിനെയോ ഇതു സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: അഥവാ “രാജാവിന്റെ ഒരു വിഹിതം.” എബ്രായപദത്തിന് കൊണ്ടുപോകുകയോ അയയ്ക്കുകയോ ചെയ്യുന്ന ഒരു വിഹിതം, അംശം, അല്ലെങ്കിൽ സമ്മാനം എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵד
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: ירד എന്ന ക്രിയയുടെ ദിശാസൂചനയായ ‘താഴേക്ക് പോകുക/ഇറങ്ങുക’ നിലനിർത്തുന്നു; കൊട്ടാരത്തിൽനിന്ന് വീട്ടിലേക്കുള്ള നീക്കവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְבֵיתְךָ
  choice: നിന്റെ വീട്ടിലേക്ക്
  rationale: בַּיִת എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘വീട്’ ആണ്; ഇവിടെ മലയാളത്തിലും സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וּרְחַץ רַגְלֶיךָ
  choice: കാലുകൾ കഴുകുക
  rationale: എബ്രായത്തിലെ മൂർത്തമായ പ്രയോഗം അതേപടി സംരക്ഷിക്കുന്നു; യാത്രയ്ക്കുശേഷമുള്ള ആശ്വാസത്തെയോ വീട്ടിൽ വിശ്രമിക്കലിനെയോ സൂചിപ്പിക്കാമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ വിശദീകരിച്ചിട്ടില്ല.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: രാജാവിന്റെ ഭവനത്തിൽനിന്ന്
  rationale: അക്ഷരാർഥം ‘രാജാവിന്റെ വീട്ടിൽനിന്ന്’ എന്നാണ്. രാജകീയ വസതി എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകാൻ ‘ഭവനം’ തിരഞ്ഞെടുത്തു; ‘കൊട്ടാരം’ എന്ന വ്യക്തീകരണം നിർബന്ധിച്ചിട്ടില്ല.
- source_word: מַשְׂאַת הַמֶּלֶךְ
  choice: രാജാവിൽനിന്നുള്ള ഒരു സമ്മാനം
  rationale: מַשְׂאֵת കൊണ്ടുപോകുന്നതോ അയയ്ക്കുന്നതോ ആയ സമ്മാനം, വിഹിതം, അംശം എന്നിവയെ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ ‘സമ്മാനം’ സ്വാഭാവികമാണെങ്കിലും പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אַחֲרָיו
  choice: അവന്റെ പിന്നാലെ
  rationale: ഊരീയാവിനെ പിന്തുടർന്ന് അത് കൊണ്ടുപോയെന്ന ക്രമവും ദിശയും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘രാജാവിന്റെ ഭവനം’ എന്നത് മൂലത്തിലെ ‘രാജാവിന്റെ വീട്’ എന്ന രൂപത്തോട് അടുത്തുനിൽക്കുമ്പോഴും രാജകീയ പശ്ചാത്തലത്തിൽ വ്യക്തമാണ്. മൂലത്തിലെ സജീവരൂപമായ ‘സമ്മാനം അവന്റെ പിന്നാലെ പുറപ്പെട്ടു’ മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, അതിലെ അയച്ചുകൊടുത്ത പ്രവൃത്തി ‘അയയ്ക്കപ്പെട്ടു’ എന്നു വ്യക്തമാക്കി; സമ്മാനം/വിഹിതം എന്ന പദാർഥാനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
