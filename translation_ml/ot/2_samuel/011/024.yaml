source:
  edition: WLC
  text: ו/יראו ה/מוראים אֶל עֲבָדֶ֨/ךָ֙ מֵ/עַ֣ל הַ/חוֹמָ֔ה וַ/יָּמ֖וּתוּ מֵ/עַבְדֵ֣י הַ/מֶּ֑לֶךְ וְ/גַ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/024.yaml
  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
translation:
  language: ml
  text: വില്ലാളികൾ മതിലിന്റെ മുകളിൽനിന്ന് അങ്ങയുടെ ഭൃത്യന്മാരെ ലക്ഷ്യമാക്കി അമ്പെയ്തു; രാജാവിന്റെ ഭൃത്യന്മാരിൽ ചിലർ മരിച്ചു[a]. അങ്ങയുടെ ഭൃത്യനായ ഹിത്യനായ ഊരീയാവും മരിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘രാജാവിന്റെ ഭൃത്യന്മാരിൽനിന്ന് മരിച്ചു’ എന്ന ഘടനയിലാണ്; ഇവിടെ ‘-യിൽനിന്ന്’ എന്ന പദം ‘അവരിൽ ചിലർ’ എന്ന ഭാഗിക അർഥത്തിൽ മനസ്സിലാക്കാം. മറ്റൊരു പരിഭാഷ: ‘രാജാവിന്റെ ഭൃത്യന്മാർ മരിച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘മരിച്ചിരിക്കുന്നു.’ എബ്രായരൂപം മരണത്തിന്റെ നിലാവസ്ഥയെ സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַמּוֹרִים
  choice: വില്ലാളികൾ ... അമ്പെയ്തു
  rationale: ירה എന്ന ക്രിയയും הַמּוֹרִים എന്ന കർത്തൃവാചക രൂപവും സൈനികസന്ദർഭത്തിൽ വില്ലാളികൾ അമ്പെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. പദാനുപദമായ ‘എയ്ത്തുകാർ’ എന്നതിനേക്കാൾ സ്വാഭാവികവും വ്യക്തവുമാണ് ഈ പ്രയോഗം.
- source_word: אֶל עֲבָדֶיךָ
  choice: അങ്ങയുടെ ഭൃത്യന്മാരെ ലക്ഷ്യമാക്കി
  rationale: എയ്യുക എന്ന ക്രിയയോടൊപ്പം אֶל ലക്ഷ്യത്തിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്നു. രാജസന്നിധിയിലെ ആദരഭാഷ നിലനിർത്താൻ ‘അങ്ങയുടെ’ എന്നും, עבד എന്ന പദത്തിന്റെ സേവക-അധീനതാഭാവം കാക്കാൻ ‘ഭൃത്യന്മാർ’ എന്നും നൽകി.
- source_word: מֵעַל הַחוֹמָה
  choice: മതിലിന്മുകളിൽനിന്ന്
  rationale: מֵעַל മതിലിന്റെ മുകളിൽനിന്നുള്ള ഉയർന്ന സ്ഥാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഇത് ചുരുക്കവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיָּמֻתוּ מֵעַבְדֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ ഭൃത്യന്മാരിൽ ചിലർ മരിച്ചു
  rationale: מִן ഇവിടെ സമുച്ചയത്തിൽനിന്നുള്ള ഒരു ഭാഗത്തെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം. അതിനാൽ എല്ലാവരുമല്ല, അവരിൽ ചിലരാണ് മരിച്ചതെന്ന അർഥം വ്യക്തമാക്കുന്നു; വ്യാകരണപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְגַם
  choice: -വും
  rationale: ഉരീയാവിന്റെ മരണത്തെ മുൻപറഞ്ഞ മരണങ്ങളോടു ചേർക്കുന്ന സങ്കലനാത്മകവും ഉച്ചകോടിസ്വഭാവമുള്ളതുമായ അർഥം മലയാളത്തിലെ ‘-വും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַבְדְּךָ אוּרִיָּה הַחִתִּי
  choice: അങ്ങയുടെ ഭൃത്യനായ ഹിത്യൻ ഊരീയാവ്
  rationale: രാജാവിനോടുള്ള ആദരസംബോധനയും ‘ഭൃത്യൻ’ എന്ന രാജസഭാ ഭാഷയും നിലനിർത്തുന്നു. ജനവിഭാഗനാമം സ്വാഭാവിക മലയാളരൂപമായ ‘ഹിത്യൻ’ എന്നും പേരിനെ ‘ഊരീയാവ്’ എന്നും നൽകി.
- source_word: מֵת
  choice: മരിച്ചു
  rationale: രൂപം ‘മരിച്ചിരിക്കുന്നു/മരിച്ചവനാണ്’ എന്ന നിലാവസ്ഥയും സൂചിപ്പിക്കാമെങ്കിലും, സംഭവവിവരണം തുടരുന്ന ഈ സന്ദർഭത്തിൽ ‘മരിച്ചു’ എന്നത് സ്വാഭാവികമാണ്. നിലാവസ്ഥാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ രാജസഭാ റിപ്പോർട്ട് ശൈലി ഉപയോഗിച്ചു. ദാവീദിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങയുടെ’ എന്ന ആദരരൂപവും, സൈനിക-രാജകീയ അധീനത സൂചിപ്പിക്കാൻ ‘ഭൃത്യൻ/ഭൃത്യന്മാർ’ എന്ന പദവും തിരഞ്ഞെടുത്തു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് സൂചകങ്ങളുടെ സ്ഥാനവൈരുധ്യം ഉറവിട എബ്രായപാഠത്തിന്റെ യഥാർത്ഥ വിഷയങ്ങളോട് പൊരുത്തപ്പെടുന്നവിധം തിരുത്തി: [a] ഭാഗികമായ מִן-നോടും [b] അവസാനത്തെ מֵת-നോടും ചേർത്തു.'
