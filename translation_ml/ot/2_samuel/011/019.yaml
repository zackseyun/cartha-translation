  yaml_path: translation/ot/2_samuel/011/019.yaml
  text: And he commanded the messenger[a], saying, “When you have finished telling the king all the news of the battle,”
translation:
  language: ml
  text: 'അവൻ ദൂതനോടു കല്പിച്ചു: “യുദ്ധത്തെക്കുറിച്ചുള്ള വിവരങ്ങളെല്ലാം രാജാവിനെ അറിയിച്ചുതീർന്നശേഷം,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ ആധികാരികമായ നിർദേശസ്വഭാവം നിലനിർത്തുന്ന സ്വാഭാവികമായ വിവർത്തനം.
- source_word: הַמַּלְאָךְ
  choice: ദൂതൻ
  rationale: സന്ദർഭത്തിൽ ദൈവദൂതനെയല്ല, യുദ്ധവിവരം എത്തിക്കുന്ന മനുഷ്യസന്ദേശവാഹകനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ദൂതൻ’ ഈ അർഥത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לֵאמֹר
  choice: നേരിട്ടുള്ള ഉദ്ധരണി ആരംഭിക്കുന്ന ‘:’
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ പതിവായ നേരിട്ടുള്ള വാക്കുകളുടെ അവതാരിക മലയാളത്തിൽ പ്രത്യേകമായി ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർക്കാതെ വിരാമചിഹ്നത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: כְּכַלּוֹתְךָ
  choice: അറിയിച്ചുതീർന്നശേഷം
  rationale: כְּ + infinitive construct സൂചിപ്പിക്കുന്ന കാലബന്ധവും പ്രവൃത്തി പൂർത്തിയായതും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; ഉടൻ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: യുദ്ധത്തെക്കുറിച്ചുള്ള വിവരങ്ങളെല്ലാം
  rationale: അക്ഷരാർഥത്തിലെ ‘യുദ്ധത്തിന്റെ എല്ലാ വാക്കുകളും/കാര്യങ്ങളും’ എന്നതിനു പകരം, സൈനിക റിപ്പോർട്ടിന്റെ സന്ദർഭത്തിൽ דְּבָרִים സൂചിപ്പിക്കുന്ന മുഴുവൻ വിവരങ്ങളെയും സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  choice: രാജാവിനെ അറിയിക്കുക
  rationale: രാജാവിനോടു സംസാരിക്കുക എന്ന ഘടന ഇവിടെ യുദ്ധവിവരം കൈമാറുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ആശയവിനിമയപ്രവർത്തനം സ്വാഭാവികമായി പറയുന്നു.
