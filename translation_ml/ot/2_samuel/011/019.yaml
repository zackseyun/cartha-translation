translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ‘ദൂതൻ’ എന്നതിന് ഇവിടെ മനുഷ്യസന്ദേശവാഹകൻ എന്ന സന്ദർഭാർഥമാണ്.
