id: 2SA.11.12
reference: 2 Samuel 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה שֵׁ֥ב בָּ/זֶ֛ה גַּם הַ/יּ֖וֹם וּ/מָחָ֣ר אֲשַׁלְּחֶ֑/ךָּ וַ/יֵּ֨שֶׁב אוּרִיָּ֧ה בִ/ירוּשָׁלִַ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא וּ/מִֽ/מָּחֳרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് ഊരിയാവിനോടു പറഞ്ഞു: “ഇന്നും ഇവിടെ താമസിക്കുക; നാളെ ഞാൻ നിന്നെ അയച്ചുവിടും.” അങ്ങനെ ഊരിയാവ് അന്നും പിറ്റേന്നും യെരൂശലേമിൽ താമസിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടന കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: שֵׁב בָּזֶה
  choice: ഇവിടെ താമസിക്കുക
  rationale: ഈ സന്ദർഭത്തിൽ ישׁב ഇരിക്കുക എന്നതിലുപരി ഒരു സ്ഥലത്ത് താൽക്കാലികമായി തുടരുക എന്നർഥത്തിലാണ്; ‘താമസിക്കുക’ അതു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גַּם הַיּוֹם
  choice: ഇന്നും
  rationale: גַּם നൽകുന്ന ‘കൂടി/also’ എന്ന ഊന്നൽ മലയാളത്തിലെ ‘-ഉം’ എന്ന അനുബന്ധത്തിലൂടെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וּמָחָר אֲשַׁלְּחֶךָּ
  choice: നാളെ ഞാൻ നിന്നെ പറഞ്ഞയയ്ക്കാം
  rationale: שׁלח ഇവിടെ ഊരിയാവിനെ യെരൂശലേമിൽനിന്ന് യാത്രയാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പറഞ്ഞയയ്ക്കുക’ ആ സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיֵּשֶׁב
  choice: അങ്ങനെ ... താമസിച്ചു
  rationale: ദാവീദിന്റെ നിർദേശത്തെ തുടർന്നുണ്ടായ പ്രവൃത്തി ‘അങ്ങനെ’ വ്യക്തമാക്കുന്നു; മുൻപത്തെ ישׁב-നോടുള്ള പദസാമ്യം ‘താമസിച്ചു’ നിലനിർത്തുന്നു.
- source_word: בִירוּשָׁלִַם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമത്തോടുകൂടിയ בְּ എന്ന സ്ഥലസൂചകത്തിന്റെ സാധാരണ മലയാളരൂപം.
- source_word: בַּיּוֹם הַהוּא וּמִמָּחֳרָת
  choice: അന്നും പിറ്റേന്നും
  rationale: രണ്ടു തുടർച്ചയായ ദിവസങ്ങളെയും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ഹീബ്രൂവിലെ ബന്ധനഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥാഖ്യാനശൈലി ഉപയോഗിച്ചു. കർത്താവിന്റെ നിർദേശവും അതിനെ തുടർന്നുള്ള ഊരിയാവിന്റെ പ്രവൃത്തിയും വ്യക്തമായി ബന്ധിപ്പിച്ചു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
