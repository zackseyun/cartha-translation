- from: 'അപ്പോൾ ദാവീദ് ഊരിയാവിനോടു പറഞ്ഞു: “ഇന്നും ഇവിടെ താമസിക്കുക; നാളെ ഞാൻ നിന്നെ പറഞ്ഞയയ്ക്കാം.” അങ്ങനെ ഊരിയാവ് അന്നും പിറ്റേന്നും[a] യെരൂശലേമിൽ താമസിച്ചു.'
