source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּכְתֹּ֥ב דָּוִ֛ד סֵ֖פֶר אֶל יוֹאָ֑ב וַ/יִּשְׁלַ֖ח בְּ/יַ֥ד אוּרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/014.yaml
  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
translation:
  language: ml
  text: രാവിലെ ദാവീദ് യോവാബിന് ഒരു കത്ത് എഴുതി; അത് ഊരീയാവിന്റെ കൈവശം കൊടുത്തയച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഊരീയാവിലൂടെ’ അല്ലെങ്കിൽ ‘ഊരീയാവിന്റെ പക്കൽ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഊരീയാവിന്റെ കൈയാൽ’ എന്നാണ്; ഒരാളിലൂടെ ഒരു കാര്യം അയയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: രാവിലെ
  rationale: ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്ന וַיְהִי എന്ന പ്രയോഗവും സമയസൂചനയായ בַבֹּקֶרയും ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി ‘രാവിലെ’ എന്നു നൽകാം.
- source_word: וַיִּכְתֹּב
  choice: എഴുതി
  rationale: എഴുത്തിനെ സൂചിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനക്രിയ; ഇവിടെ ലളിതമായ ‘എഴുതി’ യോജിക്കുന്നു.
- source_word: סֵפֶר
  choice: ഒരു കത്ത്
  rationale: ഈ പദത്തിന് രേഖ എന്ന വിശാല അർഥമുണ്ടെങ്കിലും, ദാവീദ് യോവാബിന് എഴുതി അയയ്ക്കുന്ന സന്ദർഭത്തിൽ ‘കത്ത്’ എന്ന ആശയമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: אֶל יוֹאָב
  choice: യോവാബിന്
  rationale: אֶל ഇവിടെ എഴുത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ദത്തിവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: וַיִּשְׁלַח
  choice: കൊടുത്തയച്ചു
  rationale: ഊരീയാവിനെ കത്ത് വഹിക്കുന്നവനാക്കി അയച്ചുവെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּיַד אוּרִיָּה
  choice: ഊരീയാവിന്റെ കൈവശം
  rationale: അക്ഷരാർഥത്തിലെ ‘ഊരീയാവിന്റെ കൈയാൽ/കയ്യിൽ’ എന്ന പ്രയോഗം ഇവിടെ കത്ത് അവൻ കൊണ്ടുപോയതിനെ സൂചിപ്പിക്കുന്നു. ‘കൈവശം’ മൂലഭാഷയിലെ കൈ എന്ന ദൃശ്യഭാവവും സന്ദേശവാഹകന്റെ പങ്കും നിലനിർത്തുന്നു.
