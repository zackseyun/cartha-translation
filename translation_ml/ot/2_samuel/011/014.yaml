  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കൈവശം കൊടുത്തയച്ചു’ എന്ന പ്രയോഗം വായനാസൗകര്യവും എബ്രായ ശൈലിയുടെ ദൃശ്യഭാവവും ഒരുമിച്ച് കാത്തുസൂക്ഷിക്കുന്നു.
