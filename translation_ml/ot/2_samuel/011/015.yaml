  text: וַ/יִּכְתֹּ֥ב בַּ/סֵּ֖פֶר לֵ/אמֹ֑ר הָב֣וּ אֶת אֽוּרִיָּ֗ה אֶל מוּל֙ פְּנֵ֤י הַ/מִּלְחָמָה֙ הַֽ/חֲזָקָ֔ה וְ/שַׁבְתֶּ֥ם מֵ/אַחֲרָ֖י/ו וְ/נִכָּ֥ה וָ/מֵֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/015.yaml
  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
translation:
  language: ml
  text: 'അവൻ കത്തിൽ ഇങ്ങനെ എഴുതി: “ഊരീയാവിനെ പോരാട്ടം ഏറ്റവും രൂക്ഷമായിരിക്കുന്ന മുൻനിരയിൽ[a] നിർത്തുക. പിന്നെ അവന്റെ പിന്നിൽനിന്നു പിൻവാങ്ങുക; അങ്ങനെ അവൻ പ്രഹരമേറ്റ് മരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഏറ്റവും രൂക്ഷമായി പോരാട്ടം നടക്കുന്നിടത്ത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב בַּסֵּפֶר לֵאמֹר
  choice: അവൻ കത്തിൽ ഇങ്ങനെ എഴുതി
  rationale: വിവരണത്തിന്റെ തുടർച്ചയായ ഭൂതകാലക്രിയ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ סֵפֶר ഒരു കത്താണ്, לֵאמֹר ഉദ്ധരണിയുടെ ഉള്ളടക്കത്തെ പരിചയപ്പെടുത്തുന്നു.
- source_word: הָבוּ אֶת אוּרִיָּה
  choice: ഊരീയാവിനെ … നിർത്തുക
  rationale: ബഹുവചന ആജ്ഞയായ הָבוּ ഇവിടെ യുദ്ധനിരയിൽ ഒരാളെ നിയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നിർത്തുക’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളമാണ്.
- source_word: אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  choice: പോരാട്ടം ഏറ്റവും രൂക്ഷമായിരിക്കുന്ന മുൻനിരയിൽ
  rationale: מוּל פְּנֵי നേരിട്ടുള്ള മുൻനിരയിലെ തുറന്നുനിൽപ്പിനെയും הַמִּלְחָמָה הַחֲזָקָה അതിതീവ്രമായ പോരാട്ടത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  choice: പിന്നെ അവന്റെ പിന്നിൽനിന്നു പിൻവാങ്ങുക
  rationale: ശത്രുവിനു മുന്നിൽ അവനെ ഒറ്റപ്പെടുത്തുന്ന തന്ത്രപരമായ പിന്മാറ്റം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְנִכָּה וָמֵת
  choice: അങ്ങനെ അവൻ പ്രഹരമേറ്റ് മരിക്കട്ടെ
  rationale: נכה എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലെ ‘പ്രഹരമേൽക്കുക’ എന്ന അർഥവും തുടർന്ന് വരുന്ന ‘മരിക്കുക’ എന്ന വേറിട്ട ക്രിയയും നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ഉദ്ദേശ്യബന്ധം ‘അങ്ങനെ’ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ആജ്ഞകളുടെ ബഹുവചനഭാവം മലയാളക്രിയയിൽ രൂപപരമായി വ്യക്തമാകാത്തതിനാൽ സന്ദർഭം അതു വഹിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ [a] കത്തിനുശേഷം ചേർത്തിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് യുദ്ധം രൂക്ഷമായിരിക്കുന്ന സ്ഥലം സംബന്ധിച്ചതിനാൽ, മലയാള മുഖ്യപാഠത്തിൽ ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനുശേഷം അടയാളം സ്ഥാപിച്ചു.
