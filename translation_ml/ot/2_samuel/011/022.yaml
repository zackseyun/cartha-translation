  text: അങ്ങനെ ദൂതൻ പോയി, വന്ന്, യോവാബ് അവനോട് അറിയിക്കാനായി ഏല്പിച്ച കാര്യങ്ങളെല്ലാം ദാവീദിനെ അറിയിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “യോവാബ് അവനെ അയച്ചതെല്ലാം.” സന്ദർഭത്തിൽ, യോവാബ് ദൂതനെ അറിയിക്കാനായി ഏല്പിച്ച കാര്യങ്ങളെയാണു സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: ദൂതൻ
  rationale: ഇവിടെ യോവാബിൽനിന്ന് ദാവീദിലേക്കുള്ള സൈനികസന്ദേശം എത്തിക്കുന്ന മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്.
- source_word: וַיֵּלֶךְ וַיָּבֹא
  choice: പോയി ... വന്ന്
  rationale: തുടർച്ചയായ എബ്രായ ആഖ്യാനക്രിയകളുടെ ചലനവും താളവും നിലനിർത്തുന്നു.
- source_word: וַיַּגֵּד לְדָוִד
  choice: ദാവീദിനെ അറിയിച്ചു
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള נגד ഇവിടെ അറിയിക്കുക/വിവരം നൽകുക എന്ന അർഥത്തിലാണ്; ആധുനിക മലയാളത്തിൽ ‘അറിയിച്ചു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֵת כָּל אֲשֶׁר
  choice: കാര്യങ്ങളെല്ലാം
  rationale: സന്ദേശത്തിന്റെ മുഴുവൻ ഉള്ളടക്കത്തെയും സൂചിപ്പിക്കുന്ന כָּל എന്ന പദത്തിന്റെ സമഗ്രത വ്യക്തമാക്കുന്നു.
- source_word: שְׁלָחוֹ יוֹאָב
  choice: യോവാബ് തന്നെ അയച്ച കാര്യങ്ങൾ
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥം ‘യോവാബ് അവനെ അയച്ചതെല്ലാം’ എന്നാണ്. ആശയവിനിമയസന്ദർഭത്തിൽ അയച്ചുപറയാൻ ഏല്പിച്ച കാര്യങ്ങളാണ് ഉദ്ദേശ്യം; മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ മലയാളവും അടിക്കുറിപ്പിൽ അക്ഷരാർഥവും നൽകുന്നു.
- source_word: לְדָוִד
  choice: ദാവീദിനെ
  rationale: സ്വീകർത്താവായ ദാവീദിനെ മലയാളത്തിലെ കർമവിഭക്തിയിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
