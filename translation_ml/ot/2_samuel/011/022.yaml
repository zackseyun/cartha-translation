  to: അങ്ങനെ ദൂതൻ പോയി, വന്ന്, യോവാബ് അവനോട് അറിയിക്കാനായി ഏല്പിച്ച കാര്യങ്ങളെല്ലാം ദാവീദിനെ അറിയിച്ചു.[a]
