base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/015.yaml
  text: Then Hushai said to Zadok and to Abiathar the priests[a], “This and that is what Ahithophel advised Absalom and the elders of Israel, and this and that is what I have advised.”
translation:
  language: ml
  text: 'അപ്പോൾ ഹൂശായി പുരോഹിതന്മാരായ സാദോക്കിനോടും അബ്യാഥാരിനോടും പറഞ്ഞു: “അഹീഥോഫെൽ അബ്ശാലോമിനും ഇസ്രായേലിന്റെ മൂപ്പന്മാർക്കും ഇന്നതിന്നത്[a] ഉപദേശിച്ചു; ഞാനാകട്ടെ ഇന്നതിന്നത് ഉപദേശിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ ‘ഇങ്ങനെയും അങ്ങനെയും’ എന്ന പ്രയോഗം, പറഞ്ഞത് വാക്കുതോറും ആവർത്തിക്കാതെ അതിന്റെ ഉള്ളടക്കം സംഗ്രഹിച്ച് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חוּשַׁי
  choice: ഹൂശായി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֶל צָדוֹק וְאֶל אֶבְיָתָר הַכֹּהֲנִים
  choice: പുരോഹിതന്മാരായ സാദോക്കിനോടും അബ്യാഥാരിനോടും
  rationale: ‘പുരോഹിതന്മാർ’ എന്ന വിശേഷണം ഇരുപേരെയും സൂചിപ്പിക്കുന്നതായി വ്യക്തവും സ്വാഭാവികവുമായ മലയാള വാക്യക്രമത്തിൽ നൽകി; ആവർത്തിച്ചിരിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന്റെ ബന്ധവും ‘-നോടും’ എന്ന രൂപങ്ങളിൽ നിലനിർത്തി.
- source_word: כָּזֹאת וְכָזֹאת
  choice: ഇന്നതിന്നതൊക്കെയാണ്
  rationale: പറഞ്ഞ കാര്യങ്ങൾ വാക്കുതോറും ആവർത്തിക്കാതെ അവയുടെ ഉള്ളടക്കം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം. മലയാളത്തിലെ ‘ഇന്നതിന്നത്’ അതിന്റെ അനിശ്ചിത സംഗ്രഹഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יָעַץ
  choice: ഉപദേശിച്ചത്
  rationale: രാഷ്ട്രീയ-തന്ത്രപരമായ ആലോചന നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയ; ‘ഉപദേശിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: אֶת אַבְשָׁלֹם וְאֵת זִקְנֵי יִשְׂרָאֵל
  choice: അബ്ശാലോമിനും ഇസ്രായേലിന്റെ മൂപ്പന്മാർക്കും
  rationale: ഉപദേശം ലഭിച്ചവരെ മലയാളത്തിലെ ദാതൃവിഭക്തിയിലൂടെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേലിന്റെ മൂപ്പന്മാർ’ എബ്രായ ഘടനയെ സുതാര്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יָעַצְתִּי אָנִי
  choice: ഞാനോ ... ഉപദേശിച്ചത്
  rationale: സ്വതന്ത്ര സർവനാമമായ אָנִי നൽകുന്ന ഊന്നൽ ‘ഞാനോ’ എന്ന വിരുദ്ധഊന്നലിലൂടെ നിലനിർത്തുന്നു; ഇത് അഹീഥോഫെലിന്റെ ഉപദേശത്തോടുള്ള താരതമ്യവും വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തിത പ്രയോഗവും ‘ഞാൻ’ എന്നതിലെ ഊന്നലും നിലനിർത്തി; [a] അടിക്കുറിപ്പ് അത് വിശദീകരിക്കുന്ന പ്രയോഗത്തിനരികിൽ ചേർത്തിരിക്കുന്നു.
