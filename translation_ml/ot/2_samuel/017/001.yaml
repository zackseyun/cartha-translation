source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲחִיתֹ֖פֶל אֶל אַבְשָׁלֹ֑ם אֶבְחֲרָ֣ה נָּ֗א שְׁנֵים עָשָׂ֥ר אֶ֨לֶף֙ אִ֔ישׁ וְ/אָק֛וּמָה וְ/אֶרְדְּפָ֥ה אַחֲרֵי דָוִ֖ד הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/001.yaml
  text: Then Ahithophel said to Absalom[a], “Please let me choose twelve thousand men, and let me arise and pursue David tonight.”
translation:
  language: ml
  text: 'അപ്പോൾ അഹീഥോഫെൽ അബ്ശാലോമിനോടു പറഞ്ഞു: “ദയവായി, പന്ത്രണ്ടായിരം പേരെ തിരഞ്ഞെടുക്കാനും ഇന്നുരാത്രി എഴുന്നേറ്റ് ദാവീദിനെ പിന്തുടരാനും എന്നെ അനുവദിക്കണമേ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “ദയവായി, ഞാൻ പന്ത്രണ്ടായിരം പേരെ തിരഞ്ഞെടുക്കട്ടെ; ഞാൻ എഴുന്നേറ്റ് ഈ രാത്രിയിൽ ദാവീദിനെ പിന്തുടരട്ടെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אֲחִיתֹפֶל ... אַבְשָׁלֹם
  choice: അഹീത്തോഫെൽ ... അബ്ശാലോം
  rationale: എബ്രായ വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ ശബ്ദസാമീപ്യം കാത്ത് ലിപ്യന്തരിച്ചു.
- source_word: אֶבְחֲרָה נָּא
  choice: ദയവായി ... തിരഞ്ഞെടുക്കാൻ എന്നെ അനുവദിക്കണമേ
  rationale: കോഹോർട്ടേറ്റീവിനോടു ചേർന്ന נָא വിനീതമായ അഭ്യർഥനയോ നിർദേശമോ സൂചിപ്പിക്കുന്നു; അത് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കി.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: പന്ത്രണ്ടായിരം പേർ
  rationale: സന്ദർഭം സൈനികമാണെങ്കിലും, אִישׁ എന്ന പദത്തിൽ ഇല്ലാത്ത ‘സൈനികർ’ എന്ന അധികവിശദീകരണം ഒഴിവാക്കി.
- source_word: וְאָקוּמָה
  choice: എഴുന്നേറ്റ്
  rationale: קוּם എന്ന ക്രിയയുടെ ‘എഴുന്നേൽക്കുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; ഇവിടെ ഉടനടി പ്രവർത്തനത്തിലേക്കു കടക്കുന്നതും സൂചിപ്പിക്കുന്നു.
- source_word: וְאֶרְדְּפָה אַחֲרֵי דָוִד
  choice: ദാവീദിനെ പിന്തുടരാൻ
  rationale: רדף + אַחֲרֵי എന്ന പ്രയോഗത്തിന്റെ സൈനിക പിന്തുടർച്ചാഭാവം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: הַלָּיְלָה
  choice: ഇന്നുരാത്രി
  rationale: സന്ദർഭത്തിലെ ഇപ്പോഴത്തെ രാത്രിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. മുഖ്യവാക്യത്തിൽ കോഹോർട്ടേറ്റീവ് ക്രിയകളെ അബ്ശാലോമിനോടുള്ള അനുമതിയഭ്യർഥനയായി സ്വാഭാവികമാക്കി; കൂടുതൽ പദാനുസൃതമായ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
