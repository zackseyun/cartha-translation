translation:
  language: ml
  text: കിടക്കകളും[a] തടങ്ങളും[b] മൺപാത്രങ്ങളും[c] ഗോതമ്പും യവവും മാവും വറുത്ത ധാന്യവും പയറും[d] പരിപ്പും വറുത്ത ധാന്യവും കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കിടക്കവിരികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കിണ്ണങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘കുശവന്റെ പാത്രങ്ങൾ.’'
    reason: lexical_alternative
  - marker: d
    text: എബ്രായപദം കൂടുതൽ കൃത്യമായി ഫാവ പയറിനെയോ ബ്രോഡ് ബീനിനെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: കിടക്കകൾ
  rationale: കിടക്കാനുള്ള സ്ഥലത്തെയോ വിരിപ്പുകളെയോ സൂചിപ്പിക്കാവുന്ന പദമാണിത്. സാധനങ്ങളുടെ ഈ പട്ടികയിൽ കൂട്ടമായ അർഥമുള്ള ‘കിടക്കകൾ’ സ്വാഭാവികമാണ്; ‘കിടക്കവിരികൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: סַפּוֹת
  choice: വലിയ പാത്രങ്ങൾ
  rationale: ഗൃഹോപയോഗത്തിനുള്ള കിണ്ണങ്ങളെയോ വലിയ പാത്രങ്ങളെയോ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു. കൃത്യമായ രൂപം അനിശ്ചിതമായതിനാൽ പൊതുവായ സ്വാഭാവിക പദം ഉപയോഗിച്ചു.
- source_word: כְלִי יוֹצֵר
  choice: മൺപാത്രങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘കുശവന്റെ പാത്രങ്ങൾ’; ഉപയോഗാർഥം വ്യക്തമായി നൽകാൻ ‘മൺപാത്രങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: חִטִּים
  choice: ഗോതമ്പ്
  rationale: ഈ ധാന്യത്തിനുള്ള സാധാരണ ആധുനിക മലയാളപദം.
- source_word: שְׂעֹרִים
  choice: യവം
  rationale: ബാർലിയെ സൂചിപ്പിക്കുന്ന നിലവാരമുള്ള മലയാളപദം.
- source_word: קֶמַח
  choice: മാവ്
  rationale: പൊടിച്ച ധാന്യത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പൊതുപദം.
- source_word: קָלִי
  choice: വറുത്ത ധാന്യം
  rationale: ചൂടിൽ വറുത്തോ ഉണക്കിയോ തയ്യാറാക്കിയ ധാന്യമാണ് ഉദ്ദേശ്യം. പദം രണ്ടുതവണ വരുന്നതിനാൽ രണ്ടു പ്രാവശ്യവും ഒരേവിധം നിലനിർത്തി.
- source_word: פּוֹל
  choice: പയർ
  rationale: ഒരു പ്രത്യേക ഇനം പയറിനെ, സാധ്യതയേറിയവിധം ഫാവ/ബ്രോഡ് ബീനിനെ, സൂചിപ്പിക്കുന്നു. മുഖ്യവാക്യത്തിൽ വായനാസൗകര്യത്തിനായി പൊതുപദം നൽകി; കൂടുതൽ കൃത്യത അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: עֲדָשִׁים
  choice: പരിപ്പ്
  rationale: ലെന്റിലിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സാധാരണവുമായ മലയാളപദം.
