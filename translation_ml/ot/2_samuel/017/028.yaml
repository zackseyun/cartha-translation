translation_notes:
  register: ആധുനിക നിലവാരമുള്ളതും ഗൗരവമുള്ളതുമായ മലയാളം. ഇത് മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന ക്രിയയുടെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ വാക്യം സ്വാഭാവികമായി പൂർത്തിയാക്കാൻ ‘കൊണ്ടുവന്നു’ ചേർത്തു. എബ്രായത്തിൽ קָלִי രണ്ടുതവണ ആവർത്തിക്കുന്നതിനാൽ ശൈലിക്കായി വ്യത്യസ്ത പദങ്ങൾ ഉപയോഗിക്കാതെ ആ ആവർത്തനം സംരക്ഷിച്ചു.
