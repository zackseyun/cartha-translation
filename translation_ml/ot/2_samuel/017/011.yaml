  text: כִּ֣י יָעַ֗צְתִּי הֵ֠אָסֹף יֵאָסֵ֨ף עָלֶ֤י/ךָ כָל יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע כַּ/ח֥וֹל אֲשֶׁר עַל הַ/יָּ֖ם לָ/רֹ֑ב וּ/פָנֶ֥י/ךָ הֹלְכִ֖ים בַּ/קְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
translation:
  language: ml
  text: 'എന്നാൽ എന്റെ ഉപദേശം ഇതാണ്: ദാൻമുതൽ ബേർ-ശേബവരെ, കടൽക്കരയിലെ മണൽപോലെ എണ്ണമറ്റ സകല ഇസ്രായേലും തീർച്ചയായും അങ്ങയുടെ അടുക്കൽ ഒന്നിച്ചുകൂടണം; അങ്ങുതന്നെ യുദ്ധത്തിലേക്കു പോകണം.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായഭാഷയിൽ അക്ഷരാർഥം: “അങ്ങയുടെ മുഖം യുദ്ധത്തിലേക്കു പോകുന്നു.” അങ്ങ് വ്യക്തിപരമായി യുദ്ധത്തിലേക്കു പോകണം എന്നർഥമുള്ള പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്നാൽ
  rationale: മുൻപുള്ള അഹീഥോഫെലിന്റെ പദ്ധതിക്കു വിരുദ്ധമായ ഹൂശായിയുടെ പ്രത്യുപദേശം അവതരിപ്പിക്കുന്നതിനാൽ സന്ദർഭത്തിലെ വൈരുധ്യഭാവം വ്യക്തമാക്കുന്നു.
- source_word: יָעַצְתִּי
  choice: ഞാൻ നൽകുന്ന ഉപദേശം ഇതാണ്
  rationale: יעץ എന്ന ക്രിയയുടെ ഉപദേശിക്കുക എന്ന പ്രസംഗപ്രവർത്തനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הֵאָסֹף יֵאָסֵף
  choice: ഒന്നിച്ചുകൂടട്ടെ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും നിർദ്ദിഷ്ട ക്രിയയും ചേർന്നുള്ള ഊന്നൽ, സകല ഇസ്രായേലും എന്ന സമഗ്രപ്രയോഗത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: עָלֶיךָ
  choice: അങ്ങയുടെ അടുക്കൽ
  rationale: അബ്ശാലോമിന്റെ നേതൃത്വത്തിൻ കീഴിൽ അവന്റെ അടുക്കൽ സൈന്യം കൂടിവരുന്നതാണ് ഉദ്ദേശ്യം; ആദരസൂചകമായ അഭിസംബോധന സന്ദർഭോചിതമാണ്.
- source_word: כָל יִשְׂרָאֵל
  choice: സകല ഇസ്രായേലും
  rationale: ജനതയെയോ സൈന്യത്തെയോ സമഗ്രമായി സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ സമാഹാരപ്രയോഗവും അതിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: ദാൻമുതൽ ബേർ-ശേബവരെ
  rationale: ഇസ്രായേലിന്റെ മുഴുവൻ ഭൂവിസ്തൃതിയെയും സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ഭൂമിശാസ്ത്രപരമായ ദ്വയപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: കടൽത്തീരത്തെ മണൽപോലെ അസംഖ്യമായ
  rationale: വലിയ സംഖ്യയെ സൂചിപ്പിക്കുന്ന ഉപമയും കടലോരമണലിന്റെ ദൃശ്യബിംബവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וּפָנֶיךָ הֹלְכִים בַּקְרָב
  choice: അങ്ങുതന്നെ യുദ്ധത്തിനു നേതൃത്വം നൽകണം
  rationale: അക്ഷരാർഥത്തിൽ 'അങ്ങയുടെ മുഖം യുദ്ധത്തിൽ പോകുന്നു' എന്ന ഹീബ്രായ പ്രയോഗം അബ്ശാലോം വ്യക്തിപരമായി യുദ്ധയാത്ര നയിക്കണമെന്ന അർഥം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. രാജകുമാരനായ അബ്ശാലോമിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ പ്രയോഗിച്ചു. സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ അവസാനത്തെ ഹീബ്രായ ശൈലീപ്രയോഗം മുഖ്യപാഠത്തിൽ അർഥാനുസൃതമായി പരിഭാഷപ്പെടുത്തി; അതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
