base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
translation:
  language: ml
  text: 'ഹൂശായി അബ്ശാലോമിന്റെ അടുക്കൽ വന്നപ്പോൾ അബ്ശാലോം അവനോട് പറഞ്ഞു: “അഹീഥോഫെൽ ഇങ്ങനെ പറഞ്ഞു: ‘നാം അവന്റെ വാക്കനുസരിച്ച് ചെയ്യണമോ?[a] അങ്ങനെയല്ലെങ്കിൽ, നീ പറയുക.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാം അവന്റെ വാക്ക് ചെയ്യണമോ?” ഹീബ്രുവിൽ കൂടുതൽ അക്ഷരാർഥമായി “നാം അവന്റെ വാക്ക് ചെയ്യണമോ?” എന്നാണ്; അഹീഥോഫെലിന്റെ ആലോചന നടപ്പാക്കണമോ എന്നതാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നപ്പോൾ
  rationale: בוא എന്ന ക്രിയയുടെ ആഖ്യാനപ്രയോഗവും אֶל־אַבְשָׁלוֹם എന്ന ദിശാസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ ‘അടുക്കൽ വന്നപ്പോൾ’ എന്നു നൽകുന്നു.
- source_word: חוּשַׁי
  choice: ഹൂശായി
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രുവിലെ ആവർത്തിതമായ വാക്യാരംഭരൂപം മലയാളത്തിൽ ഒറ്റ ‘പറഞ്ഞു’കൊണ്ട് സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: כַּדָּבָר הַזֶּה דִּבֶּר
  choice: ഇങ്ങനെയാണ് ഉപദേശിച്ചത്
  rationale: ദാവാർ/ദിബ്ബേർ ഘടന ഇവിടെ മുമ്പ് അവതരിപ്പിച്ച ആലോചനയുടെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘ഉപദേശിച്ചത്’ സന്ദർഭം വ്യക്തമാക്കുമ്പോഴും പുതിയ ഉള്ളടക്കം ചേർക്കുന്നില്ല.
- source_word: הֲנַעֲשֶׂה
  choice: നാം പ്രവർത്തിക്കണമോ?
  rationale: ചോദ്യകണവും ഒന്നാം പുരുഷ ബഹുവചന അപൂർണക്രിയയും ചേർന്ന ആലോചനാത്മക ചോദ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת דְּבָרוֹ
  choice: അവന്റെ വാക്കനുസരിച്ച്
  rationale: അക്ഷരാർഥമായ ‘അവന്റെ വാക്ക്’ എന്നതിന്റെ സന്ദർഭാർഥം, അഹീഥോഫെലിന്റെ നിർദേശം നടപ്പാക്കുക എന്നതാണ്; ‘വാക്കനുസരിച്ച്’ ആ ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אִם אַיִן
  choice: അല്ലെങ്കിൽ
  rationale: ‘അങ്ങനെയല്ലെങ്കിൽ’ എന്ന വ്യവസ്ഥാപരമായ വിരുദ്ധത സംഭാഷണസന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַתָּה דַבֵּר
  choice: നീ പറയുക
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നൽ ‘നീ’ നിലനിർത്തുന്നു; കല്പനാരൂപം ‘പറയുക’കൊണ്ട് പ്രതിനിധീകരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പേരുകൾ ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു. ‘നീ പറയുക’ എന്നതിൽ മൂലപാഠത്തിലെ ഊന്നൽ നിലനിർത്തി.
