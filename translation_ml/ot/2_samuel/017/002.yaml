source:
  edition: WLC
  text: וְ/אָב֣וֹא עָלָ֗י/ו וְ/ה֤וּא יָגֵ֨עַ֙ וּ/רְפֵ֣ה יָדַ֔יִם וְ/הַֽחֲרַדְתִּ֣י אֹת֔/וֹ וְ/נָ֖ס כָּל הָ/עָ֣ם אֲשֶׁר אִתּ֑/וֹ וְ/הִכֵּיתִ֥י אֶת הַ/מֶּ֖לֶךְ לְ/בַדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
translation:
  language: ml
  text: അവൻ ക്ഷീണിതനായും കൈകൾ തളർന്നവനായും ഇരിക്കുമ്പോൾ ഞാൻ അവന്റെമേൽ ചെന്നെത്തും[a]. ഞാൻ അവനെ പരിഭ്രാന്തനാക്കും; അപ്പോൾ അവനോടൊപ്പമുള്ള ജനമെല്ലാം ഓടിപ്പോകും. പിന്നെ രാജാവിനെ മാത്രം ഞാൻ അടിച്ചുവീഴ്ത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘കൈകൾ തളർന്നവൻ’; ശക്തിയോ ധൈര്യമോ കുറഞ്ഞ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוֹא עָלָיו
  choice: ഞാൻ അവന്റെമേൽ ചെന്നെത്തും
  rationale: בוא + עַל ഇവിടെ ശത്രുതാപൂർവം ഒരാളുടെമേൽ ചെന്നെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അവന്റെമേൽ ചെന്നെത്തും’ എന്നത് മൂലത്തിലെ ചലനദൃശ്യം നിലനിർത്തുകയും സൈനികസന്ദർഭത്തിലെ ആക്രമണാർഥം വ്യക്തമാകാൻ ഇടവരുത്തുകയും ചെയ്യുന്നു.
- source_word: יָגֵעַ
  choice: ക്ഷീണിതൻ
  rationale: അധ്വാനംകൊണ്ടോ യാത്രകൊണ്ടോ ഉണ്ടായ തളർച്ചയാണ് ഈ വിശേഷണം സൂചിപ്പിക്കുന്നത്; ‘ക്ഷീണിതൻ’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּרְפֵה יָדַיִם
  choice: കൈകൾ തളർന്നവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘കൈകൾ ദുർബലമായവൻ/തളർന്നവൻ’ എന്ന എബ്രായ പ്രയോഗം ശക്തിയോ ധൈര്യമോ കുറഞ്ഞ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ദൃശ്യരൂപം നിലനിർത്താൻ അത് മലയാളത്തിലും സംരക്ഷിച്ചു; അടിക്കുറിപ്പിൽ പ്രയോഗാർഥം വ്യക്തമാക്കി.
- source_word: וְהַחֲרַדְתִּי אֹתוֹ
  choice: ഞാൻ അവനെ പരിഭ്രാന്തനാക്കും
  rationale: חרד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഭയന്നുവിറയ്ക്കാൻ ഇടയാക്കുക എന്ന കാരണാർഥം നൽകുന്നു. യുദ്ധസന്ദർഭത്തിൽ ‘പരിഭ്രാന്തനാക്കും’ ഇത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְנָס כָּל־הָעָם אֲשֶׁר אִתּוֹ
  choice: അപ്പോൾ അവനോടുകൂടെയുള്ള ജനമെല്ലാം ഓടിപ്പോകും
  rationale: എബ്രായത്തിലെ ലളിതമായ സംയോജനം മുൻപ്രവൃത്തിയുടെ ഫലം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘അപ്പോൾ’ ഉപയോഗിച്ചു. אֲשֶׁר אִתּוֹ എന്ന ബന്ധവാക്യം ‘അവനോടുകൂടെയുള്ള’ എന്നു നിലനിർത്തി.
- source_word: וְהִכֵּיתִי
  choice: ഞാൻ വെട്ടിവീഴ്ത്തും
  rationale: נכה പ്രഹരിക്കുകയോ അടിച്ചുവീഴ്ത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ രാജാവിനെ ഒറ്റപ്പെടുത്തി മാരകമായി ആക്രമിക്കുകയാണ് സന്ദർഭം. ‘വെട്ടിവീഴ്ത്തും’ മാരകസൈനികസൂചന നൽകുമ്പോഴും ‘കൊല്ലും’ എന്ന വിശദീകരണത്തിലേക്ക് പൂർണമായി ചുരുക്കുന്നില്ല.
- source_word: הַמֶּלֶךְ
  choice: രാജാവിനെ
  rationale: മൂലപാഠത്തിലെ നിർദിഷ്ടമായ പദവി 그대로 നിലനിർത്തി; സന്ദർഭത്തിൽ ദാവീദാണെങ്കിലും പേര് ചേർത്തിട്ടില്ല.
- source_word: לְבַדּוֹ
  choice: മാത്രം
  rationale: രാജാവിനെ മറ്റുള്ളവരിൽനിന്ന് വേർതിരിച്ച് ഏക ലക്ഷ്യമാക്കുന്നതാണ് ഈ പദത്തിന്റെ ഊന്നൽ; ‘രാജാവിനെ മാത്രം’ അത് വ്യക്തമായി നൽകുന്നു.
