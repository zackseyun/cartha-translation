translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ സൈനികഭാവവും ‘കൈകൾ തളർന്ന’ എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തി; ബന്ധങ്ങളുടെ ക്രമം വ്യക്തമായി വായിക്കാനായി ‘അപ്പോൾ’, ‘പിന്നെ’ എന്നിവ ഉപയോഗിച്ചു.
