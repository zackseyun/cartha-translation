source:
  edition: WLC
  text: וְ/ה֣וּא גַם בֶּן חַ֗יִל אֲשֶׁ֥ר לִבּ֛/וֹ כְּ/לֵ֥ב הָ/אַרְיֵ֖ה הִמֵּ֣ס יִמָּ֑ס כִּֽי יֹדֵ֤עַ כָּל יִשְׂרָאֵל֙ כִּי גִבּ֣וֹר אָבִ֔י/ךָ וּ/בְנֵי חַ֖יִל אֲשֶׁ֥ר אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
translation:
  language: ml
  text: സിംഹത്തിന്റെ ഹൃദയംപോലെയുള്ള ഹൃദയമുള്ള ഒരു ധീരൻപോലും[a] ധൈര്യം പൂർണമായി ചോർന്നുപോകും.[b] കാരണം, നിന്റെ പിതാവ് ശക്തനായ ഒരു യോദ്ധാവാണെന്നും അവനോടൊപ്പമുള്ളവർ ധീരന്മാരാണെന്നും ഇസ്രായേൽ മുഴുവനും അറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ധീരൻ” എന്നതിനുള്ള എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “വീര്യത്തിന്റെ മകൻ” എന്നാണ്; വാക്യത്തിന്റെ അവസാനത്തിലുള്ള ബഹുവചനപ്രയോഗത്തിനും ഇതേ അർഥമാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഉരുകുക, ഉരുകിപ്പോകും” എന്നാണ്. ക്രിയ ആവർത്തിച്ചുള്ള ഈ ഊന്നൽ “തീർച്ചയായും ഉരുകിപ്പോകും” അല്ലെങ്കിൽ “ധൈര്യം പൂർണമായി ചോർന്നുപോകും” എന്ന അർഥം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חַיִל / בְנֵי חַיִל
  choice: ധീരൻ / ധീരന്മാർ
  rationale: ‘ശക്തിയുടെ/വീര്യത്തിന്റെ മകൻ/മക്കൾ’ എന്ന എബ്രായ പ്രയോഗം ധൈര്യവും യുദ്ധവീര്യവും ഉള്ള ആളുകളെ സൂചിപ്പിക്കുന്നു. ഏകവചനവും ബഹുവചനവും തമ്മിലുള്ള പദബന്ധം ഈ തിരഞ്ഞെടുപ്പ് നിലനിർത്തുന്നു.
- source_word: לִבּוֹ כְּלֵב הָאַרְיֵה
  choice: സിംഹത്തിന്റെ ഹൃദയംപോലെ ഹൃദയമുള്ള
  rationale: സ്രോതസ്സിലെ സിംഹോപമ ചുരുക്കിക്കളയാതെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִמֵּס יִמָּס
  choice: ധൈര്യം പൂർണമായി ചോർന്നുപോകും
  rationale: എബ്രായത്തിലെ ‘ഉരുകുക’ എന്ന രൂപകം ഇവിടെ ഭയംമൂലം ധൈര്യം നഷ്ടപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ക്രിയയുടെ ഊന്നൽ ‘പൂർണമായി’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുമ്പുള്ള പ്രസ്താവനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יֹדֵעַ כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനും അറിയുന്നു
  rationale: പൊതുവായി ഉറപ്പിക്കപ്പെട്ട അറിവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അവതരണം.
- source_word: גִבּוֹר
  choice: ശക്തനായ ഒരു യോദ്ധാവ്
  rationale: ദാവീദിന്റെ ശക്തിയും യുദ്ധപ്രാവീണ്യവും സൂചിപ്പിക്കുന്ന നാമപ്രയോഗം സൈനികസന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר אִתּוֹ
  choice: അവനോടൊപ്പമുള്ളവർ
  rationale: ദാവീദിനോടൊപ്പമുള്ള ആളുകളെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സിംഹത്തിന്റെ ഹൃദയം എന്ന മൂലഭാഷാചിത്രം നിലനിർത്തിയപ്പോൾ, ‘ഉരുകുക’ എന്നത് മലയാളത്തിൽ കരുണയോ ദുഃഖമോ സൂചിപ്പിക്കാനിടയുള്ളതിനാൽ സൈനികസന്ദർഭത്തിലെ ഉദ്ദേശ്യം പ്രധാനവാക്യത്തിൽ ‘ധൈര്യം ചോർന്നുപോകും’ എന്നു വ്യക്തമാക്കി; അക്ഷരാർഥരൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
