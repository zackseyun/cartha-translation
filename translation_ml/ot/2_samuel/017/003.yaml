  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָשִׁ֥יבָה כָל הָ/עָ֖ם אֵלֶ֑י/ךָ כְּ/שׁ֣וּב הַ/כֹּ֔ל הָ/אִישׁ֙ אֲשֶׁ֣ר אַתָּ֣ה מְבַקֵּ֔שׁ כָּל הָ/עָ֖ם יִהְיֶ֥ה שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/003.yaml
  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
translation:
  language: ml
  text: ജനത്തെയെല്ലാം ഞാൻ അങ്ങയുടെ അടുക്കലേക്കു മടക്കിക്കൊണ്ടുവരും.[a] എല്ലാവരുടെയും മടങ്ങിവരവ് അങ്ങ് അന്വേഷിക്കുന്ന ആ മനുഷ്യനിലാണ്; ജനമെല്ലാം സമാധാനത്തിലായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു പാഠം ദുഷ്കരവും അപൂർണവുമാണ്; അക്ഷരാർഥത്തിൽ ഏകദേശം: ‘എല്ലാവരുടെയും മടങ്ങിവരവുപോലെ/മടങ്ങിവരവ്, അങ്ങ് അന്വേഷിക്കുന്ന മനുഷ്യൻ.’ അങ്ങ് അന്വേഷിക്കുന്ന ആ ഒരാളുടെ കാര്യമാണ് മറ്റെല്ലാവരുടെയും മടങ്ങിവരവിനോടു ബന്ധപ്പെട്ടിരിക്കുന്നത് എന്നതാണ് സന്ദർഭത്തിലെ ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: ഞാൻ ... തിരികെ കൊണ്ടുവരും
  rationale: שׁוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം കാരണാർത്ഥകമാണ്; അതിനാൽ ജനത്തെ മടങ്ങിവരുത്തുക എന്ന ആശയം ‘തിരികെ കൊണ്ടുവരും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָל הָעָם
  choice: ജനത്തെയെല്ലാം / ജനമെല്ലാം
  rationale: עָם എന്നതിന്റെ സാധാരണ അർഥമായ ‘ജനം’ നിലനിർത്തുന്നു; സന്ദർഭം സൈനിക-രാഷ്ട്രീയമാണെങ്കിലും ‘സൈന്യം’ എന്ന് അതിവ്യക്തമാക്കുന്നില്ല.
- source_word: אֵלֶיךָ
  choice: അങ്ങയുടെ അടുക്കൽ
  rationale: ദിശ സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവികവും ആദരസൂചകവുമായ ആധുനിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: כְּשׁוּב הַכֹּל
  choice: എല്ലാവരും മടങ്ങിവരുമ്പോൾ
  rationale: ഹീബ്രു പ്രയോഗം വ്യാകരണപരമായി ദുഷ്കരവും അപൂർണവുമാണ്. എല്ലാവരും മടങ്ങിവരുന്നതെന്ന അടിസ്ഥാന ആശയം നിലനിർത്തിക്കൊണ്ട് സന്ദർഭത്തിൽ ഗ്രഹിക്കാവുന്ന മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ
  choice: അങ്ങ് അന്വേഷിക്കുന്ന ആ മനുഷ്യൻ
  rationale: നിർദിഷ്ടനായ ഒരേയൊരു മനുഷ്യനെ—ദാവീദിനെ—സൂചിപ്പിക്കുന്ന ഏകവചനവും ബന്ധവാക്യവും സംരക്ഷിക്കുന്നു.
- source_word: יִהְיֶה שָׁלוֹם
  choice: സമാധാനത്തിലായിരിക്കും
  rationale: ശത്രുത അവസാനിച്ച ശേഷമുള്ള സമാധാനാവസ്ഥയാണ് ഇവിടെ שָׁלוֹם സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: അന്വേഷിക്കപ്പെടുന്ന മനുഷ്യന്റെ വിധി
  choice: ആ മനുഷ്യൻ മാത്രം ഉണ്ടാകില്ല
  alternative: ആ മനുഷ്യൻ കൊല്ലപ്പെടും
  rationale: സന്ദർഭത്തിൽ അഹീഥോഫെലിന്റെ ഉദ്ദേശം ദാവീദിന്റെ മരണമാണ്; എങ്കിലും ഈ വാക്യത്തിലെ ദുഷ്കരമായ ഹീബ്രു അതിനെ നേരിട്ട് ‘കൊല്ലപ്പെടും’ എന്നു പറയുന്നില്ല. അതിനാൽ സൂചന നിലനിർത്തി, വിശദീകരണം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അബ്ശാലോമിനോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ദുഷ്കരമായ മധ്യഖണ്ഡത്തിന്റെ അവ്യക്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
