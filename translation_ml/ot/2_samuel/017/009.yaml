base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
translation:
  language: ml
  text: 'ഇതാ, ഇപ്പോൾ അവൻ ഏതെങ്കിലും ഒരു കുഴിയിലോ മറ്റേതെങ്കിലും സ്ഥലത്തോ മറഞ്ഞിരിക്കുന്നു.[a] ആദ്യ ഏറ്റുമുട്ടലിൽ അവരിൽ ചിലർ വീണാൽ, അതു കേൾക്കുന്നവൻ പറയും: “അബ്ശാലോമിനെ അനുഗമിക്കുന്ന ജനത്തിനിടയിൽ കനത്ത നാശനഷ്ടമുണ്ടായിരിക്കുന്നു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കുഴി” എന്നതിനുള്ള ഹീബ്രു പദം ഭൂപ്രദേശത്തിലെ കുഴിയെയോ താഴ്ചയെയോ സമാനമായ മറ്റൊരു ഒളിസ്ഥലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “കനത്ത നാശനഷ്ടമുണ്ടായിരിക്കുന്നു” എന്നത് “ഒരു പരാജയം സംഭവിച്ചിരിക്കുന്നു” എന്നോ “കനത്ത പ്രഹരമേറ്റിരിക്കുന്നു” എന്നോ പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഹീബ്രു പദം രോഗബാധയെയല്ല, യുദ്ധത്തിൽ ആളുകൾ കഠിനമായി അടിച്ചുവീഴ്ത്തപ്പെടുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה עַתָּה
  choice: ഇതാ, ഇപ്പോൾ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സജീവതയും ഇപ്പോഴത്തെ അടിയന്തര സാഹചര്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נֶחְבָּא
  choice: ഒളിച്ചിരിക്കുകയാണ്
  rationale: നിഫാൽ രൂപത്തിന്റെ അവസ്ഥാസൂചന സ്വാഭാവികമായി നൽകുന്നു; ആരാണ് ഒളിപ്പിച്ചതെന്ന കർത്തൃത്വം വ്യക്തമാക്കുന്നില്ല.
- source_word: בְּאַחַת הַפְּחָתִים
  choice: ഏതെങ്കിലും ഒരു കുഴിയിൽ
  rationale: פְּחָתִים ഭൂപ്രദേശത്തിലെ കുഴികളെയോ താഴ്‌വരകളെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ ലളിതമായ 'കുഴി' സ്വീകരിച്ച് വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּאַחַד הַמְּקוֹמֹת
  choice: മറ്റേതെങ്കിലും സ്ഥലത്ത്
  rationale: אוֹ സൃഷ്ടിക്കുന്ന ബദൽസ്ഥലത്തിന്റെ ആശയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּנְפֹל בָּהֶם בַּתְּחִלָּה
  choice: ആദ്യത്തെ ഏറ്റുമുട്ടലിൽ അവരിൽ ചിലർ വീണാൽ
  rationale: യുദ്ധസന്ദർഭത്തിലെ തുടക്കഘട്ടവും അബ്ശാലോമിന്റെ ആളുകൾക്കിടയിലെ നഷ്ടവും വ്യക്തമാക്കുന്നു; 'വീഴുക' എന്ന മൂലരൂപത്തിന്റെ സൈനിക അർത്ഥം നിലനിർത്തുന്നു.
- source_word: הַשֹּׁמֵעַ
  choice: അതു കേൾക്കുന്നവൻ
  rationale: ഹീബ്രുവിലെ പൊതുവായ ഏകവചന കർത്താവിനെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַגֵּפָה
  choice: ഒരു കൂട്ടക്കൊല
  rationale: ഇവിടെ രോഗബാധയല്ല, യുദ്ധത്തിലെ കഠിനമായ അടിച്ചുവീഴ്ത്തലാണ് ഉദ്ദേശ്യം; 'കൂട്ടക്കൊല' അതിന്റെ തീവ്രത പ്രകടിപ്പിക്കുന്നു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי אַבְשָׁלֹם
  choice: അബ്ശാലോമിനെ അനുഗമിക്കുന്ന ജനം
  rationale: אַחֲרֵי ഇവിടെ സ്ഥലം സൂചിപ്പിക്കുന്നതല്ല, രാഷ്ട്രീയ-സൈനിക അനുഗമനവും പക്ഷചേരലുമാണ് സൂചിപ്പിക്കുന്നത്.
