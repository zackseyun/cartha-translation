  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പേരുകൾ സാധാരണ മലയാള ബൈബിൾ ഉച്ചാരണരീതിയോട് ചേർത്തു. ഹീബ്രുവിലെ അസാധാരണമായ ജലപാതപ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
