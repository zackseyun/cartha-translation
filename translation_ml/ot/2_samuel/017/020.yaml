  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
translation:
  language: ml
  text: അബ്ശാലോമിന്റെ സേവകർ ആ വീട്ടിലുള്ള സ്ത്രീയുടെ അടുക്കൽ വന്ന്, “അഹീമാസും യോനാഥാനും എവിടെ?” എന്നു ചോദിച്ചു. ആ സ്ത്രീ അവരോട്, “അവർ നീർച്ചാലിനപ്പുറത്തേക്കു കടന്നുപോയി[a],” എന്നു പറഞ്ഞു. അവർ അന്വേഷിച്ചെങ്കിലും അവരെ കണ്ടെത്തിയില്ല; അതുകൊണ്ട് അവർ യെരൂശലേമിലേക്കു മടങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തോടിന് അപ്പുറത്തേക്ക്” അല്ലെങ്കിൽ “ജലവാഹിനിക്ക് അപ്പുറത്തേക്ക്” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പ്രയോഗം (מִיכַל הַמָּיִם) അസാധാരണമായതിനാൽ ഏതു തരത്തിലുള്ള ജലപാതയാണ് ഉദ്ദേശിക്കുന്നതെന്നു കൃത്യമായി നിർണയിക്കാൻ കഴിയില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  choice: അബ്ശാലോമിന്റെ സേവകർ
  rationale: עֶבֶד ഇവിടെ അബ്ശാലോമിന്റെ നിർദേശപ്രകാരം പ്രവർത്തിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു. ബന്ധിത അടിമത്തം പ്രത്യേകം മുന്നോട്ടുവയ്ക്കാത്തതിനാൽ ‘സേവകർ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: הָאִשָּׁה הַבַּיְתָה
  choice: ആ വീട്ടിലുള്ള സ്ത്രീയുടെ അടുക്കൽ
  rationale: אִשָּׁה എന്നത് ഇവിടെ ‘സ്ത്രീ’ എന്നാണ്; ‘ഭാര്യ’ എന്നു വ്യക്തമാക്കാൻ സന്ദർഭം നിർബന്ധിക്കുന്നില്ല. הַבַּיְתָה വീട്ടിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ അവർ വീട്ടിലുള്ള സ്ത്രീയുടെ അടുക്കൽ എത്തിയതായി വിവർത്തനം ചെയ്തു.
- source_word: אַיֵּה אֲחִימַעַץ וִיהוֹנָתָן
  choice: അഹീമാസും യോനാഥാനും എവിടെ?
  rationale: രണ്ടുപേരുടെയും സ്ഥാനം ചോദിക്കുന്ന നേരിട്ടുള്ള ചോദ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָבְרוּ
  choice: കടന്നുപോയി
  rationale: עבר എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ഒരു ജലപാത കടന്ന് അപ്പുറത്തേക്കു പോകുക എന്ന അർഥമാണ്.
- source_word: מִיכַל הַמָּיִם
  choice: നീർച്ചാലിനപ്പുറത്തേക്കു
  rationale: ഹീബ്രു പ്രയോഗം അസാധാരണവും അതിന്റെ കൃത്യമായ ഭൂമിശാസ്ത്രപരമായ സൂചന അനിശ്ചിതവുമാണ്. ‘നീർച്ചാൽ’ ചെറിയ ജലപാതയെ അമിതമായി നിർവചിക്കാതെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיְבַקְשׁוּ וְלֹא מָצָאוּ
  choice: അവർ അന്വേഷിച്ചെങ്കിലും അവരെ കണ്ടെത്തിയില്ല
  rationale: בקשׁ ഇവിടെ ആളുകളെ തിരയുന്നതാണ്. ഹീബ്രുവിൽ സൂചിതമായ കർമം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘അവരെ’ എന്നു ചേർത്തു; ഫലവൈരുധ്യം ‘എങ്കിലും’കൊണ്ട് പ്രകടമാക്കി.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: അതുകൊണ്ട് അവർ യെരൂശലേമിലേക്കു മടങ്ങിപ്പോയി
  rationale: തിരച്ചിൽ പരാജയപ്പെട്ടതിനെ തുടർന്നുള്ള മടക്കത്തെ സ്വാഭാവികമായ കഥാക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
