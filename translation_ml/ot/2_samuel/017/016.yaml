  text: וְ/עַתָּ֡ה שִׁלְח֣וּ מְהֵרָה֩ וְ/הַגִּ֨ידוּ לְ/דָוִ֜ד לֵ/אמֹ֗ר אַל תָּ֤לֶן הַ/לַּ֨יְלָה֙ בְּ/עַֽרְב֣וֹת הַ/מִּדְבָּ֔ר וְ/גַ֖ם עָב֣וֹר תַּעֲב֑וֹר פֶּ֚ן יְבֻלַּ֣ע לַ/מֶּ֔לֶךְ וּ/לְ/כָל הָ/עָ֖ם אֲשֶׁ֥ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/016.yaml
  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
translation:
  language: ml
  text: 'ഇപ്പോൾ വേഗം ദൂതന്മാരെ അയച്ച് ദാവീദിനെ അറിയിക്കൂ: “ഇന്നു രാത്രി മരുഭൂമിയിലെ സമതലങ്ങളിൽ[a] തങ്ങരുത്; നിശ്ചയമായും അക്കരെ കടക്കണം. അല്ലെങ്കിൽ രാജാവും അദ്ദേഹത്തോടൊപ്പമുള്ള ജനമെല്ലാം വിഴുങ്ങപ്പെട്ടുപോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മരുഭൂമിയിലെ കടവുകളിൽ.” എബ്രായപദം സാധാരണയായി മരുഭൂമിയിലെ താഴ്ന്ന സമതലങ്ങളെ സൂചിപ്പിക്കുന്നു; എന്നാൽ തൊട്ടുപിന്നാലെയുള്ള ‘അക്കരെ കടക്കണം’ എന്ന കല്പന കാരണം ചിലർ ഇവിടെ നദിക്കടവുകളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: അടിയന്തരമായി ചെയ്യേണ്ട അടുത്ത നടപടിയിലേക്കു നയിക്കുന്ന സംഭാഷണസൂചകം സ്വാഭാവികമായി പകർന്നു.
- source_word: שִׁלְחוּ מְהֵרָה
  choice: വേഗം ആളയച്ച്
  rationale: അയയ്ക്കുക എന്ന കല്പനയും അതിന്റെ അടിയന്തരതയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהַגִּידוּ לְדָוִד לֵאמֹר
  choice: ദാവീദിനോടു പറയുക
  rationale: എബ്രായ ദൂതസന്ദേശസൂത്രത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി.
- source_word: אַל תָּלֶן הַלַּיְלָה
  choice: ഇന്നു രാത്രി ... തങ്ങരുത്
  rationale: לון എന്ന ക്രിയയുടെ ‘രാത്രി പാർക്കുക/തങ്ങുക’ എന്ന അർഥം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: בְּעַרְבוֹת הַמִּדְבָּר
  choice: മരുഭൂമിയിലെ സമതലങ്ങളിൽ
  rationale: വ്യഞ്ജനപാഠത്തിലെ עֲרָבוֹת എന്ന പദത്തിന്റെ സാധാരണ അർഥമായ വരണ്ട താഴ്ന്ന സമതലങ്ങളെ നേരിട്ട് പിന്തുടരുന്നു; സന്ദർഭാധിഷ്ഠിതമായ ‘കടവുകൾ’ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְגַם עָבוֹר תַּעֲבוֹר
  choice: നിശ്ചയമായും അക്കരെ കടക്കണം
  rationale: ക്രിയയുടെ അനന്തധാതുരൂപവും സമാപികാക്രിയയും ചേർന്നുള്ള ഊന്നൽ മലയാളത്തിലെ ‘നിശ്ചയമായും ... കടക്കണം’ എന്ന പ്രയോഗത്തിലൂടെ പകർന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: തുടർന്നുവരുന്ന അപകടഫലത്തെ മുന്നറിയിപ്പായി അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളബന്ധകം.
- source_word: יְבֻלַּע
  choice: വിഴുങ്ങപ്പെട്ടുപോകും
  rationale: ‘വിഴുങ്ങുക’ എന്ന എബ്രായ രൂപകം സംരക്ഷിക്കുകയും സൈനികനാശത്തിന്റെ ഭീഷണി വായനക്കാരന് ഗ്രഹിക്കാവുന്നവിധം അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לַמֶּלֶךְ
  choice: രാജാവ്
  rationale: ദാവീദിന്റെ പേര് ആവർത്തിക്കാതെ മൂലപാഠത്തിലെ രാജകീയ പദവി നിലനിർത്തുന്നു.
- source_word: וּלְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: അദ്ദേഹത്തോടൊപ്പമുള്ള ജനമെല്ലാം
  rationale: עָם എന്ന വിശാലപദത്തെ ‘സൈന്യം’ എന്നു ചുരുക്കാതെ ദാവീദിനൊപ്പമുള്ള മുഴുവൻ സമൂഹത്തെയും സൂചിപ്പിക്കുന്നു.
