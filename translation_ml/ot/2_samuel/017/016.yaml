  register: ആധുനികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. അടിയന്തരതയും കല്പനയുടെ ഊന്നലും നിലനിർത്തി; ‘വിഴുങ്ങുക’ എന്ന ദൃശ്യരൂപകം മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു. സ്ഥലസൂചനയിലെ യഥാർഥ പദാർഥ-സന്ദർഭ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
