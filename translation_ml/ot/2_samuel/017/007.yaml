translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. പദക്രമം മലയാളവാക്യത്തിന് യോജിച്ചവിധം ക്രമീകരിച്ചെങ്കിലും മൂലത്തിലെ വിലയിരുത്തലും സമയസൂചനയും നിലനിർത്തിയിരിക്കുന്നു.
