id: 2SA.17.7
reference: 2 Samuel 17:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר חוּשַׁ֖י אֶל אַבְשָׁל֑וֹם לֹֽא טוֹבָ֧ה הָ/עֵצָ֛ה אֲשֶׁר יָעַ֥ץ אֲחִיתֹ֖פֶל בַּ/פַּ֥עַם הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/007.yaml
  text: Then Hushai said to Absalom[a], “The counsel that Ahithophel has given this time is not good.”
translation:
  language: ml
  text: 'അപ്പോൾ ഹൂശായി അബ്ശാലോമിനോടു പറഞ്ഞു: “ഈ പ്രാവശ്യം[a] അഹീഥോഫെൽ നൽകിയ ആലോചന നല്ലതല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ഈ അവസരത്തിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തിലേക്കു നീങ്ങുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: חוּשַׁי
  choice: ഹൂശായി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֶל־אַבְשָׁלוֹם
  choice: അബ്ശാലോമിനോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖത്തെ മലയാളത്തിലെ സ്വാഭാവിക സംപ്രദാനരൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא טוֹבָה
  choice: നല്ലതല്ല
  rationale: മൂലത്തിലെ പൊതുവായ വിലയിരുത്തലായ ‘നല്ലതല്ല’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘യുക്തമല്ല’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുന്നു.
- source_word: הָעֵצָה
  choice: ആലോചന
  rationale: രാഷ്ട്രീയ-തന്ത്രപരമായ സന്ദർഭത്തിലെ ഉപദേശം/പദ്ധതി എന്നീ അർഥവ്യാപ്തി സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אֲשֶׁר יָעַץ
  choice: നൽകിയ
  rationale: ‘ആലോചന നൽകി’ എന്ന സ്വാഭാവിക മലയാള പ്രയോഗത്തിലൂടെ എബ്രായത്തിലെ സമാനധാതു ആവർത്തനം അനാവശ്യമായി പകർത്താതെ പൂർത്തിയായ പ്രവൃത്തി അവതരിപ്പിക്കുന്നു.
- source_word: אֲחִיתֹפֶל
  choice: അഹീഥോഫെൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בַּפַּעַם הַזֹּאת
  choice: ഈ പ്രാവശ്യം
  rationale: പ്രയോഗത്തിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ അർഥം നൽകുന്നു; ‘ഈ അവസരത്തിൽ’ എന്നതും സാധുവായ മറ്റൊരു പരിഭാഷയാണ്.
