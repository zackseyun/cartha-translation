reference: 2 Samuel 17:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם קְרָ֣א נָ֔א גַּ֖ם לְ/חוּשַׁ֣י הָ/אַרְכִּ֑י וְ/נִשְׁמְעָ֥ה מַה בְּ/פִ֖י/ו גַּם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/005.yaml
  text: Then Absalom said[a], “Please call Hushai the Archite also, and let us hear what he too has to say.”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്ശാലോം പറഞ്ഞു: “ദയവായി അർക്ക്യനായ ഹൂശായിയെയും വിളിക്കൂ. അവനും പറയാനുള്ളത് എന്താണെന്ന്[a] നമുക്ക് കേൾക്കാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘അവന്റെ വായിൽ എന്തുണ്ട്, അവനും.’ ഈ പ്രയോഗം ‘അവൻ പറയാനുള്ളത്’ എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ സംഭവക്രമം വ്യക്തമാക്കുന്നു.
- source_word: קְרָא נָא
  choice: ദയവായി ... വിളിക്കൂ
  rationale: ആജ്ഞാരൂപത്തോടു ചേർന്ന נָא അഭ്യർഥനയുടെയോ വിനയത്തിന്റെയോ ഭാവം നൽകുന്നു; ‘ദയവായി ... വിളിക്കൂ’ അത് സ്വാഭാവികമായി പകരുന്നു.
- source_word: גַּם
  choice: '...യെയും'
  rationale: ആദ്യത്തെ גַּם അഹീഥോഫെലിനു പുറമേ മറ്റൊരാളെയും ഉൾപ്പെടുത്തുന്നതാണ്; മലയാളത്തിലെ ‘-യെയും’ ആ സങ്കലനാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: അർഖ്യനായ ഹൂശായി
  rationale: חוּשַׁי എന്ന വ്യക്തിനാമം ‘ഹൂശായി’ എന്നും הָאַרְכִּי എന്ന വംശ/ദേശ സൂചകം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപമായ ‘അർഖ്യനായ’ എന്നും ലിപ്യന്തരിച്ചു.
- source_word: וְנִשְׁמְעָה
  choice: നമുക്ക് കേൾക്കാം
  rationale: ഒന്നാം പുരുഷ ബഹുവചന കോഹോർട്ടേറ്റീവ് ഒരു കൂട്ടായ നിർദേശമോ സന്നദ്ധതയോ പ്രകടിപ്പിക്കുന്നു; ‘നമുക്ക് കേൾക്കാം’ അതിന്റെ പ്രേരണാഭാവം നിലനിർത്തുന്നു.
- source_word: מַה בְּפִיו
  choice: പറയാനുള്ളത് എന്താണെന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ വായിൽ എന്തുണ്ട്’ എന്ന എബ്രായ പ്രയോഗം ഒരാൾ പറയാനോ നിർദേശിക്കാനോ ഉള്ളതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: גַּם הוּא
  choice: അവനും
  rationale: രണ്ടാമത്തെ גַּם ഹൂശായിയുടെ അഭിപ്രായവും കേൾക്കണമെന്ന ഊന്നൽ നൽകുന്നു; ‘അവനും’ ആ അധിക ഉൾപ്പെടുത്തൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
