  text: וּ/בָ֣אנוּ אֵלָ֗י/ו ב/אחת הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נִמְצָ֣א שָׁ֔ם וְ/נַ֣חְנוּ עָלָ֔י/ו כַּ/אֲשֶׁ֛ר יִפֹּ֥ל הַ/טַּ֖ל עַל הָ/אֲדָמָ֑ה וְ/לֹֽא נ֥וֹתַר בּ֛/וֹ וּ/בְ/כָל הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ גַּם אֶחָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
translation:
  language: ml
  text: അപ്പോൾ അവൻ കാണപ്പെടുന്ന സ്ഥലങ്ങളിലൊന്നിൽ ഞങ്ങൾ അവന്റെ നേരെ ചെന്നെത്തും. നിലത്തിന്മേൽ മഞ്ഞു വീഴുന്നതുപോലെ ഞങ്ങൾ അവന്റെമേൽ വന്നമരും[a]. അവനും അവനോടുകൂടെയുള്ള സകല പുരുഷന്മാരും ഉൾപ്പെടെ ഒരുവൻപോലും ശേഷിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞങ്ങൾ അവന്റെമേൽ ഇറങ്ങിവരും.’ എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘അമരുക/വിശ്രമിക്കുക’ എന്നാണ്; ഇവിടെ ശത്രുവിനെ പൂർണമായി മൂടുന്ന സൈനികാക്രമണത്തിന്റെ ഉപമയിലാണ് അത് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  choice: ഞങ്ങൾ അവന്റെ നേരെ ചെന്നെത്തും
  rationale: בוא എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘വരുക/ചെല്ലുക’ എന്ന അർഥവും ഈ സൈനികസന്ദർഭത്തിലെ ശത്രുതാപരമായ മുന്നേറ്റവും ഒരുമിച്ചു പ്രകടമാക്കുന്നു.
- source_word: בְאַחַת הַמְּקוֹמוֹת אֲשֶׁר נִמְצָא שָׁם
  choice: അവൻ കാണപ്പെടുന്ന സ്ഥലങ്ങളിലൊന്നിൽ
  rationale: נמצא എന്ന നിഷ്ക്രിയരൂപത്തിന്റെ ‘കാണപ്പെടുക’ എന്ന ഭാവം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത സാധ്യതാഭാവം ചേർക്കുന്നില്ല.
- source_word: וְנַחְנוּ עָלָיו
  choice: ഞങ്ങൾ അവന്റെമേൽ വന്നമരും
  rationale: נוח എന്ന ക്രിയയുടെ ‘അമരുക/തങ്ങുക’ എന്ന അർഥം സംരക്ഷിക്കുകയും പിന്നാലെയുള്ള മഞ്ഞിന്റെ ദൃഷ്ടാന്തത്തിൽ പറയുന്ന נפל (‘വീഴുക’) എന്ന വേറിട്ട ക്രിയയുമായി കലർത്താതിരിക്കുകയും ചെയ്യുന്നു. ‘വന്നമരും’ എന്നത് സൈന്യം അവനെ പൂർണമായി മൂടിയമരുന്ന സന്ദർഭഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  choice: നിലത്തിന്മേൽ മഞ്ഞു വീഴുന്നതുപോലെ
  rationale: മഞ്ഞു നിലത്തെ മൂടുന്നതിന്റെ സമ്പൂർണതയും അനിവാര്യതയും അടങ്ങിയ ഉപമ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְלֹא נוֹתַר בּוֹ וּבְכָל הָאֲנָשִׁים אֲשֶׁר אִתּוֹ גַּם אֶחָד
  choice: അവനോ അവനോടുകൂടെയുള്ള സകല പുരുഷന്മാരിൽ ഒരുവൻപോലുമോ ശേഷിക്കുകയില്ല
  rationale: נותר എന്നതിന്റെ ‘ശേഷിക്കുക/ജീവിച്ചിരിക്കുക’ എന്ന അർഥവും גם אחד നൽകുന്ന സമ്പൂർണമായ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ദാവീദിനെയും കൂടെയുള്ള മുഴുവൻ പുരുഷന്മാരെയും ഉൾക്കൊള്ളുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. സൈനികസന്ദർഭം വ്യക്തമാക്കിയെങ്കിലും, נוח (‘അമരുക’) എന്ന ക്രിയയെയും נפל (‘വീഴുക’) എന്ന ഉപമാക്രിയയെയും തമ്മിലുള്ള സാഹിത്യപരമായ വ്യത്യാസം സംരക്ഷിച്ചു.
