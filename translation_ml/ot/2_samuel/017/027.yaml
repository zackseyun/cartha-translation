  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: ml
  text: ദാവീദ് മഹനയീമിൽ എത്തിയപ്പോൾ, അമ്മോന്യരുടെ രബ്ബയിൽനിന്നുള്ള നാഹാശിന്റെ മകൻ ശോബി, ലോ-ദെബാറിൽനിന്നുള്ള അമ്മീയേലിന്റെ മകൻ മാഖീർ, രോഗെലീമിൽനിന്നുള്ള ഗിലെയാദ്യനായ ബർസില്ലായി എന്നിവർ
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: എത്തിയപ്പോൾ
  rationale: היה എന്ന ആഖ്യാനസൂത്രത്തിന്റെ ബന്ധകപ്രവർത്തനം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ പ്രത്യേകം പദമാക്കാതെ, כ + בוא എന്ന കാലസൂചകഘടനയെ ‘എത്തിയപ്പോൾ’ എന്നു നൽകി.
- source_word: מַחֲנָיְמָה
  choice: മഹനയീമിൽ
  rationale: ദിശാസൂചകമായ ה ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; ‘എത്തുക’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ അധികരണവിഭക്തി സ്വാഭാവികമായി അതേ അർഥം നൽകുന്നു.
- source_word: שֹׁבִי בֶן נָחָשׁ
  choice: നാഹാശിന്റെ മകൻ ശോബി
  rationale: വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു; ഹീബ്രു പിതൃനാമഘടന മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകി.
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ രബ്ബയിൽനിന്നുള്ള
  rationale: רבת നഗരമായ രബ്ബയെയും בני עמון അമ്മോന്യരെന്ന ജനവിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു; പുറപ്പെടുന്ന സ്ഥലം ‘യിൽനിന്നുള്ള’ എന്നു വ്യക്തമാക്കി.
- source_word: מָכִיר בֶן עַמִּיאֵל
  choice: അമ്മീയേലിന്റെ മകൻ മാഖീർ
  rationale: വ്യക്തിനാമങ്ങളും പിതൃനാമബന്ധവും ഉറവിടഘടന അനുസരിച്ച് സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: מִלֹּא דְבָר
  choice: ലോ-ദെബാറിൽനിന്നുള്ള
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് מן എന്ന പുറപ്പെടൽസൂചന ‘യിൽനിന്നുള്ള’ എന്നു നൽകി.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: ഗിലെയാദ്യനായ ബർസില്ലായി
  rationale: הגל עדי എന്ന പ്രദേശിക വിശേഷണം ‘ഗിലെയാദ്യനായ’ എന്നു ചുരുക്കമായും വ്യക്തമായും നൽകി.
- source_word: מֵרֹגְלִים
  choice: രോഗെലീമിൽനിന്നുള്ള
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് מן എന്ന പുറപ്പെടൽസൂചന നിലനിർത്തി.
