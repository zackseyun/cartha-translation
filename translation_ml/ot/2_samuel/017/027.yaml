  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്ന പേരുപട്ടികയായതിനാൽ ഉറവിടത്തിലെ അപൂർണ വാക്യഘടന നിലനിർത്തി; അവസാനത്തിൽ പൂർണവിരാമം ചേർത്തിട്ടില്ല.
