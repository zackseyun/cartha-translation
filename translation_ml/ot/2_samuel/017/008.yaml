id: 2SA.17.8
reference: 2 Samuel 17:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חוּשַׁ֗י אַתָּ֣ה יָ֠דַעְתָּ אֶת אָבִ֨י/ךָ וְ/אֶת אֲנָשָׁ֜י/ו כִּ֧י גִבֹּרִ֣ים הֵ֗מָּה וּ/מָרֵ֥י נֶ֨פֶשׁ֙ הֵ֔מָּה כְּ/דֹ֥ב שַׁכּ֖וּל בַּ/שָּׂדֶ֑ה וְ/אָבִ֨י/ךָ֙ אִ֣ישׁ מִלְחָמָ֔ה וְ/לֹ֥א יָלִ֖ין אֶת הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
translation:
  language: ml
  text: 'ഹൂശായി പറഞ്ഞു: “നിന്റെ അപ്പനെയും അവന്റെ ആളുകളെയും നിനക്കറിയാമല്ലോ. അവർ വീരന്മാരും മനസ്സിൽ കയ്പുള്ളവരുമാണ്[a]; വയലിൽ കുഞ്ഞുങ്ങൾ നഷ്ടപ്പെട്ട പെൺകരടിയെപ്പോലെയാണ് അവർ. നിന്റെ അപ്പൻ യുദ്ധവീരനാണ്; അവൻ സൈന്യത്തോടൊപ്പം രാത്രി പാർക്കുകയില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഉഗ്രന്മാർ” അല്ലെങ്കിൽ “പ്രകോപിതർ”; അക്ഷരാർഥത്തിൽ “മനസ്സിൽ കയ്പുള്ളവർ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അവൻ ജനത്തോടൊപ്പം രാത്രി പാർക്കുകയില്ല”; ഇവിടെ “ജനം” എന്നത് ദാവീദിന്റെ പോരാളിസംഘത്തെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִבֹּרִים
  choice: വീരന്മാർ
  rationale: ശക്തിയും ശൗര്യവും, ഇവിടെ പ്രത്യേകിച്ച് യുദ്ധസാമർഥ്യവും, സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מָרֵי נֶפֶשׁ
  choice: മനസ്സിൽ കയ്പേറിയവർ
  rationale: എബ്രായത്തിലെ ‘ആത്മാവിൽ/മനസ്സിൽ കയ്പുള്ളവർ’ എന്ന തീവ്രമായ ദൃശ്യഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഉഗ്രരോ പ്രകോപിതരോ എന്ന അർഥമാകാം.
- source_word: כְּדֹב שַׁכּוּל
  choice: കുഞ്ഞുങ്ങൾ നഷ്ടപ്പെട്ട പെൺകരടിയെപ്പോലെ
  rationale: ശിശുക്കളെ നഷ്ടപ്പെട്ട കരടിയുടെ അപകടകരമായ ഉഗ്രത വ്യക്തമാക്കുകയും ഉപമയിലെ മാതൃഭാവം സ്വാഭാവികമായി പകരുകയും ചെയ്യുന്നു.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽ
  rationale: സ്ഥലസൂചനയുടെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: אִישׁ מִלְחָמָה
  choice: യുദ്ധവീരൻ
  rationale: യുദ്ധത്തിൽ പരിചയവും പ്രാവീണ്യവുമുള്ള മനുഷ്യൻ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള തുല്യം.
- source_word: לֹא יָלִין אֶת־הָעָם
  choice: അവൻ സൈന്യത്തോടൊപ്പം രാത്രി കഴിക്കുകയില്ല
  rationale: לין എന്നതിന്റെ ‘രാത്രി പാർക്കുക/കഴിക്കുക’ എന്ന അർഥവും, സൈനികസന്ദർഭത്തിൽ עָם ദാവീദിന്റെ പോരാളിസംഘത്തെ സൂചിപ്പിക്കുന്നതും പകരുന്നു.
- source_word: יָדַעְתָּ
  choice: നിനക്കറിയാമല്ലോ
  rationale: അബ്ശാലോമിന് ഇതിനകം അറിയാവുന്ന കാര്യം ഊന്നിപ്പറയുന്ന സന്ദർഭോചിതമായ സ്വാഭാവിക മലയാളം.
- source_word: אֲנָשָׁיו
  choice: അവന്റെ ആളുകൾ
  rationale: എബ്രായത്തിലെ പൊതുവായ ‘അവന്റെ ആളുകൾ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭം അവർ പോരാളികളാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായഭാഷയിലെ വികാരതീവ്രത നിലനിർത്താൻ ‘മനസ്സിൽ കയ്പേറിയവർ’ ഉപയോഗിച്ചു; സൈനികസന്ദർഭത്തിലെ അർഥവ്യക്തതയ്ക്കായി മുഖ്യവാചകത്തിൽ ‘സൈന്യം’ സ്വീകരിച്ച് അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
