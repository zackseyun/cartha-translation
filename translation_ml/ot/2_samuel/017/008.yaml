revisions:
- from: 'ഹൂശായി പറഞ്ഞു: “നിന്റെ അപ്പനെയും അവന്റെ ആളുകളെയും നിനക്കറിയാമല്ലോ. അവർ വീരന്മാരും മനസ്സിൽ കയ്പേറിയവരുമാണ്[a]; വയലിൽ കുഞ്ഞുങ്ങൾ നഷ്ടപ്പെട്ട പെൺകരടിയെപ്പോലെയാണ് അവർ. നിന്റെ അപ്പൻ യുദ്ധവീരനാണ്; അവൻ സൈന്യത്തോടൊപ്പം രാത്രി കഴിക്കുകയില്ല[b].”'
  to: 'ഹൂശായി പറഞ്ഞു: “നിന്റെ അപ്പനെയും അവന്റെ ആളുകളെയും നിനക്കറിയാമല്ലോ. അവർ വീരന്മാരും മനസ്സിൽ കയ്പുള്ളവരുമാണ്[a]; വയലിൽ കുഞ്ഞുങ്ങൾ നഷ്ടപ്പെട്ട പെൺകരടിയെപ്പോലെയാണ് അവർ. നിന്റെ അപ്പൻ യുദ്ധവീരനാണ്; അവൻ സൈന്യത്തോടൊപ്പം രാത്രി പാർക്കുകയില്ല[b].”'
  rationale: ലין എന്ന ക്രിയയുടെ പാർപ്പുസംബന്ധിയായ അർഥം അവ്യക്തമാക്കുന്ന ‘രാത്രി കഴിക്കുകയില്ല’ എന്ന പ്രയോഗം ‘രാത്രി പാർക്കുകയില്ല’ എന്നു തിരുത്തി. മָרֵי נֶפֶשׁ-നുള്ള മലയാളം അല്പം സ്വാഭാവികമാക്കി; സ്രോതസിലെ ദൃശ്യഭാവവും സാധ്യമായ സന്ദർഭാർഥങ്ങളും അടിക്കുറിപ്പിൽ തുടർന്നു സംരക്ഷിക്കുന്നു. മറ്റെല്ലാ ഘടകങ്ങളും സ്രോതസിനോടും ഇംഗ്ലീഷ് ഓഡിറ്റ് തീരുമാനങ്ങളോടും യോജിക്കുന്നതിനാൽ മാറ്റിയിട്ടില്ല.
