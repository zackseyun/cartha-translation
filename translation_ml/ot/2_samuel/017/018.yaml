  text: וַ/יַּ֤רְא אֹתָ/ם֙ נַ֔עַר וַ/יַּגֵּ֖ד לְ/אַבְשָׁלֹ֑ם וַ/יֵּלְכוּ֩ שְׁנֵי/הֶ֨ם מְהֵרָ֜ה וַ/יָּבֹ֣אוּ אֶל בֵּֽית אִ֣ישׁ בְּ/בַחוּרִ֗ים וְ/ל֥/וֹ בְאֵ֛ר בַּ/חֲצֵר֖/וֹ וַ/יֵּ֥רְדוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
translation:
  language: ml
  text: എന്നാൽ ഒരു യുവാവ് അവരെ കണ്ടിട്ട് അബ്ശാലോമിനോട് വിവരം അറിയിച്ചു. അതുകൊണ്ട് അവർ രണ്ടുപേരും വേഗം പോയി ബഹൂരീമിലുള്ള ഒരു മനുഷ്യന്റെ വീട്ടിലെത്തി. അയാളുടെ മുറ്റത്ത് ഒരു കിണർ ഉണ്ടായിരുന്നു; അവർ അവിടെ ഇറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ അതിൽ ഇറങ്ങി’; അതായത്, കിണറിനുള്ളിലേക്ക്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: യുവാവ്
  rationale: ഈ പദത്തിന് ബാലൻ, യുവാവ്, ദാസൻ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ സ്വതന്ത്രമായി കണ്ടറിയുകയും വിവരം അറിയിക്കുകയും ചെയ്യുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നതിനാൽ, പ്രായമോ പദവിയോ അതിരുകടന്ന് നിർണയിക്കാത്ത ‘യുവാവ്’ യോജിക്കുന്നു.
- source_word: וַיַּגֵּד
  choice: വിവരം അറിയിച്ചു
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം അറിയിക്കുക, വിവരം നൽകുക എന്ന ആശയം വഹിക്കുന്നു. സന്ദർഭത്തിലെ റിപ്പോർട്ട് ചെയ്യലിന്റെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵיהֶם
  choice: അവർ രണ്ടുപേരും
  rationale: എബ്രായപാഠം വ്യക്തമായി രണ്ടുപേരെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആ കൃത്യത നിലനിർത്തുന്നു.
- source_word: מְהֵרָה
  choice: വേഗം
  rationale: അടിയന്തരതയും തിടുക്കവും സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണാർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בֵּית אִישׁ
  choice: ഒരു മനുഷ്യന്റെ വീട്
  rationale: നിർമാണബന്ധത്തിലുള്ള എബ്രായപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: בְּבַחוּרִים
  choice: ബഹൂരീമിലുള്ള
  rationale: ബഹൂരീം സ്ഥലനാമമാണ്; വീട്ടിന്റെ സ്ഥാനം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: בְאֵר
  choice: കിണർ
  rationale: בְאֵר സാധാരണയായി കിണറിനെയാണ് സൂചിപ്പിക്കുന്നത്. അടുത്ത വാക്യത്തിലെ അതിന്റെ വായ് മൂടുന്നതും ഈ അർഥവുമായി യോജിക്കുന്നു; ‘ജലസംഭരണി’ എന്ന് മാറ്റേണ്ട നിർബന്ധമില്ല.
- source_word: בַּחֲצֵרוֹ
  choice: അയാളുടെ മുറ്റത്ത്
  rationale: חָצֵר വീടിനോടു ചേർന്ന അടച്ചതോ തുറന്നതോ ആയ മുറ്റത്തെ സൂചിപ്പിക്കുന്നു. ‘മുറ്റം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיֵּרְדוּ שָׁם
  choice: അവർ അവിടെ ഇറങ്ങി
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവർ അവിടെ ഇറങ്ങി’ എന്നാണ്. കിണറിലേക്കാണ് ഇറങ്ങിയതെന്ന് സന്ദർഭം സൂചിപ്പിച്ചാലും, മൂലപാഠത്തിന്റെ നേരിയ അവ്യക്തത പ്രധാനവാചകത്തിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. സംഭവങ്ങളുടെ വേഗത നിലനിർത്താൻ വാക്യങ്ങൾ സംക്ഷിപ്തമാക്കി. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട അവസാന പ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
