translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. വ്യക്തിനാമങ്ങളിൽ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾ രൂപങ്ങൾ ഉപയോഗിച്ചു; വാക്യത്തിലെ സങ്കീർണ വംശബന്ധം വ്യക്തതയ്ക്കായി സ്വാഭാവിക മലയാളക്രമത്തിലാക്കി.
