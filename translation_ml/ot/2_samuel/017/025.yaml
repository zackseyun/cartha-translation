  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
translation:
  language: ml
  text: അബ്ശാലോം യോവാബിനു പകരം അമാസയെ സൈന്യാധിപനായി നിയമിച്ചു. അമാസ യിത്രാ എന്നു പേരുള്ള ഒരു യിസ്രായേല്യന്റെ[a] മകനായിരുന്നു. യിത്രാ, നാഹാശിന്റെ മകളും യോവാബിന്റെ അമ്മയായ സെരൂയായുടെ സഹോദരിയുമായ അബീഗയിലോടുകൂടെ ചേർന്നവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം: “യിത്രാ എന്ന യിസ്രായേല്യൻ.” 1 ദിനവൃത്താന്തം 2:17-ൽ “യേത്തെർ എന്ന യിശ്മായേല്യൻ” എന്നാണ്.'
    reason: textual_variant
lexical_decisions:
- source_word: שָׂם ... עַל הַצָּבָא
  choice: സൈന്യാധിപനായി നിയമിച്ചു
  rationale: സൈന്യത്തിന്മേൽ അധികാരസ്ഥാനത്ത് ആക്കിയെന്ന സന്ദർഭാർഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: תַּחַת יוֹאָב
  choice: യോവാബിനു പകരം
  rationale: ഇവിടെ תַּחַת സ്ഥാനപരമല്ല, പകരം നിയമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בֶן אִישׁ וּשְׁמוֹ יִתְרָא
  choice: യിത്രാ എന്നു പേരുള്ള ഒരു ... മകനായിരുന്നു
  rationale: എബ്രായത്തിലെ അനിശ്ചിതമായ אִישׁ എന്ന പ്രയോഗവും തുടർന്നുള്ള പേരറിയിക്കലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַיִּשְׂרְאֵלִי
  choice: യിസ്രായേല്യന്റെ
  rationale: നൽകിയിരിക്കുന്ന മസോററ്റിക് പാഠത്തിലെ ‘യിസ്രായേല്യൻ’ എന്ന വായന പിന്തുടരുന്നു; ദിനവൃത്താന്തത്തിലെ വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲשֶׁר בָּא אֶל
  choice: ശയിച്ചിരുന്നു
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സൗമ്യോക്തിയുടെ അർഥം ആധുനിക മലയാളത്തിൽ മാന്യമായും വ്യക്തമായും നൽകുന്നു.
- source_word: אֲבִיגַל בַּת נָחָשׁ אֲחוֹת צְרוּיָה אֵם יוֹאָב
  choice: യോവാബിന്റെ അമ്മയായ സെരൂയയുടെ സഹോദരിയും നാഹാശിന്റെ മകളുമായ അബീഗയിൽ
  rationale: ബന്ധങ്ങളുടെ പരമ്പര തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്ന സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
