reference: 2 Samuel 17:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/דְבַ֣שׁ וְ/חֶמְאָ֗ה וְ/צֹאן֙ וּ/שְׁפ֣וֹת בָּקָ֔ר הִגִּ֧ישׁוּ לְ/דָוִ֛ד וְ/לָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ לֶ/אֱכ֑וֹל כִּ֣י אָמְר֔וּ הָ/עָ֗ם רָעֵ֛ב וְ/עָיֵ֥ף וְ/צָמֵ֖א בַּ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
translation:
  language: ml
  text: തേനും തൈരും ആടുകളും കന്നുകാലിപ്പാലിൽനിന്നുള്ള പാൽക്കട്ടിയും അവർ ദാവീദിനും കൂടെയുണ്ടായിരുന്ന ജനത്തിനും ഭക്ഷിക്കാനായി കൊണ്ടുവന്നു. കാരണം, “വിജനപ്രദേശത്ത് ജനം വിശന്നും ക്ഷീണിച്ചും ദാഹിച്ചും ഇരിക്കുന്നു” എന്ന് അവർ പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַשׁ
  choice: തേൻ
  rationale: സാധാരണ അർഥമായ ‘തേൻ’ ഈ ഭക്ഷ്യസാധനങ്ങളുടെ പട്ടികയിൽ സ്വാഭാവികമായി യോജിക്കുന്നു; മധുരച്ചാർ എന്ന വിശാല അർഥം ഇവിടെ നിർബന്ധമല്ല.
- source_word: חֶמְאָה
  choice: തൈര്
  rationale: പുരാതന സാഹചര്യത്തിൽ ഇത് ആധുനിക വെണ്ണയെക്കാൾ പുളിപ്പിച്ചോ കട്ടപിടിപ്പിച്ചോ ഉള്ള പാലുൽപ്പന്നത്തെ സൂചിപ്പിക്കാം; സാധാരണ മലയാളത്തിൽ ‘തൈര്’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: צֹאן
  choice: ആടുകൾ
  rationale: ഈ കൂട്ടനാമം ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളാം. മലയാളത്തിലെ ‘ആടുകൾ’ പ്രസക്തിയിൽ ഇരുവിഭാഗത്തെയും പൊതുവായി സൂചിപ്പിക്കാൻ കഴിയുന്നതിനാൽ വിശാലത നിലനിർത്തുന്നു.
- source_word: שְׁפוֹת בָּקָר
  choice: കന്നുകാലികളുടെ പാലിൽനിന്നുള്ള പാൽക്കട്ടി
  rationale: പദപ്രയോഗം കന്നുകാലികളിൽനിന്നുള്ള ഒരു പാലുൽപ്പന്നത്തെ സൂചിപ്പിക്കുന്നു. അതിന്റെ കൃത്യമായ നിർമ്മാണരീതി വ്യക്തമല്ലാത്തതിനാൽ ‘പാലിൽനിന്നുള്ള പാൽക്കട്ടി’ എന്ന് നൽകുന്നത് അർഥം വ്യക്തമാക്കുകയും അതിരുകടന്ന് നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הִגִּישׁוּ
  choice: കൊണ്ടുവന്നു
  rationale: ‘അടുത്തുകൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന ആശയം ഇവിടെ സാധനങ്ങൾ എത്തിച്ചുനൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘കൊണ്ടുവന്നു’ മതിയായ അർഥം നൽകുന്നു.
- source_word: לְדָוִד וְלָעָם אֲשֶׁר אִתּוֹ
  choice: ദാവീദിനും കൂടെയുണ്ടായിരുന്ന ജനത്തിനും
  rationale: ദാവീദിനെയും അവനോടൊപ്പമുള്ള ജനത്തെയും പ്രത്യേകം ലക്ഷ്യഗ്രാഹകരായി കാണിക്കുന്ന എബ്രായ ഘടന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: לֶאֱכֹל
  choice: ഭക്ഷിക്കാനായി
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ക്രിയാനാമരൂപം മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: כִּי אָמְרוּ
  choice: കാരണം ... എന്ന് അവർ പറഞ്ഞു
  rationale: അവർ സാധനങ്ങൾ കൊണ്ടുവന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: רָעֵב וְעָיֵף וְצָמֵא
  choice: വിശന്നും ക്ഷീണിച്ചും ദാഹിച്ചും
  rationale: മൂന്ന് സമാന്തര വിശേഷണങ്ങളുടെ താളവും തീവ്രതയും അതിശയോക്തിയില്ലാതെ നിലനിർത്തുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽവെച്ച്
  rationale: ജനവാസം കുറഞ്ഞ വരണ്ട വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ മലയാള ബൈബിൾ-സാഹിത്യപ്രയോഗമായ ‘മരുഭൂമി’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഭക്ഷ്യവസ്തുക്കളുടെ പട്ടികയ്ക്ക് സ്വാഭാവിക ഒഴുക്ക് നൽകി; മൂലത്തിലെ കാരണബന്ധവും വിശപ്പ്–ക്ഷീണം–ദാഹം എന്ന ത്രയത്തിന്റെ താളവും സംരക്ഷിച്ചു. കന്നുകാലി-പാലുൽപ്പന്നത്തിന്റെ കൃത്യസ്വഭാവം അനിശ്ചിതമായതിനാൽ വ്യാഖ്യാനാതിശയം ഒഴിവാക്കി.
