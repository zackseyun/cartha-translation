translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ തുടർച്ചയായ പ്രവർത്തനക്രമം ചെറുവാക്യങ്ങളായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു; അവസാന വാക്യത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
