source:
  edition: WLC
  text: וַ/תִּקַּ֣ח הָ/אִשָּׁ֗ה וַ/תִּפְרֹ֤שׂ אֶת הַ/מָּסָךְ֙ עַל פְּנֵ֣י הַ/בְּאֵ֔ר וַ/תִּשְׁטַ֥ח עָלָ֖י/ו הָֽ/רִפ֑וֹת וְ/לֹ֥א נוֹדַ֖ע דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/019.yaml
  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
translation:
  language: ml
  text: അപ്പോൾ ആ സ്ത്രീ ഒരു വിരിപ്പ് എടുത്ത് കിണറിന്റെ വായ്ക്കുമീതെ വിരിച്ചു. അതിന്മേൽ ചതച്ച ധാന്യം വിതറി.[a] കാര്യം ആരും അറിഞ്ഞില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചതച്ച ധാന്യം’ എന്നതിനു ‘ഇടിച്ച ധാന്യം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഇടിച്ചോ ചതച്ചോ തയ്യാറാക്കിയ ധാന്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ഒരു കാര്യവും അറിയപ്പെട്ടില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: സന്ദർഭത്തിൽ മുമ്പേ പരാമർശിക്കപ്പെട്ട വീട്ടിലെ സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഭാര്യ’ എന്നു വ്യക്തമാക്കുന്നത് അനാവശ്യമായ വ്യാഖ്യാനമാകും.
- source_word: הַמָּסָךְ
  choice: ഒരു വിരിപ്പ്
  rationale: മൂടുവിരി, തിരശ്ശീല, മറ എന്നിവയെ സൂചിപ്പിക്കാവുന്ന പദമാണിത്. കിണർ മറയ്ക്കാൻ വിരിച്ച വസ്തുവെന്ന സന്ദർഭത്തിൽ ‘വിരിപ്പ്’ സ്വാഭാവികവും വസ്തുവിന്റെ സ്വഭാവം അനാവശ്യമായി നിർണയിക്കാത്തതുമാണ്.
- source_word: עַל פְּנֵי הַבְּאֵר
  choice: കിണറിന്റെ വായ്ക്കുമീതെ
  rationale: അക്ഷരാർഥം ‘കിണറിന്റെ മുഖം/ഉപരിതലംമേൽ’ എന്നാണ്; മലയാളത്തിൽ കിണറിന്റെ തുറന്ന ഭാഗത്തിന് ‘വായ്’ എന്നു പറയുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַתִּשְׁטַח
  choice: വിതറി
  rationale: പരത്തുക എന്ന അടിസ്ഥാനാർഥമുള്ള ക്രിയ, ചതച്ച ധാന്യം വിരിപ്പിന്മേൽ പരത്തി മറച്ചുവെച്ച സന്ദർഭത്തിൽ ‘വിതറി’ എന്ന് സ്വാഭാവികമായി പരിഭാഷപ്പെടുന്നു.
- source_word: הָרִפוֹת
  choice: ചതച്ച ധാന്യം
  rationale: ഇത് ഇടിച്ചോ ചതച്ചോ തയ്യാറാക്കിയ ധാന്യത്തെ സൂചിപ്പിക്കുന്നു; ‘ചതച്ച ധാന്യം’ ആ കാർഷിക വിശദാംശം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְלֹא נוֹדַע דָּבָר
  choice: കാര്യം ആരും അറിഞ്ഞില്ല
  rationale: അക്ഷരാർഥത്തിലുള്ള നിഷേധാത്മക കർമണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും മറച്ചുവെച്ച കാര്യം കണ്ടെത്തപ്പെട്ടില്ലെന്ന സന്ദർഭാർഥം നിലനിർത്തുന്നു.
