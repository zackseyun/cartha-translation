translation_notes:
  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘സകലജനവും’ എന്ന പ്രയോഗം വാക്യത്തിന്റെ തിരുവെഴുത്തുസ്വഭാവമുള്ള ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; അവസാനവാക്യം എബ്രായത്തിലെ നിഷേധഘടനയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
