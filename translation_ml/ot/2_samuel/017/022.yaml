id: 2SA.17.22
reference: 2 Samuel 17:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣קָם דָּוִ֗ד וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּעַבְר֖וּ אֶת הַ/יַּרְדֵּ֑ן עַד א֣וֹר הַ/בֹּ֗קֶר עַד אַחַד֙ לֹ֣א נֶעְדָּ֔ר אֲשֶׁ֥ר לֹא עָבַ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
translation:
  language: ml
  text: അപ്പോൾ ദാവീദും കൂടെയുണ്ടായിരുന്ന സകലജനവും എഴുന്നേറ്റ് യോർദാൻ കടന്നു. പ്രഭാതം വെളുക്കുമ്പോഴേക്കും[a], യോർദാൻ കടക്കാതെ ഒരാൾപോലും ശേഷിച്ചിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രഭാതവെളിച്ചം വരെയും”; എബ്രായപ്രയോഗം പ്രഭാതവെളിച്ചത്തിന്റെ ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട്, കടന്നുകഴിയൽ പൂർത്തിയായ സമയത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘എഴുന്നേൽക്കുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യാത്രയ്ക്കുള്ള പുറപ്പാടും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു, എന്നാൽ ‘പുറപ്പെട്ടു’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: കൂടെയുണ്ടായിരുന്ന സകലജനവും
  rationale: ദാവീദിനൊപ്പമുണ്ടായിരുന്ന മുഴുവൻ സംഘത്തെയും ലിംഗഭേദമില്ലാതെ സൂചിപ്പിക്കുന്ന הָעָם എന്ന പദത്തിന് സ്വാഭാവികവും സമഗ്രവുമായ പരിഭാഷ.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: യോർദാൻ കടന്നു
  rationale: עבר എന്ന ക്രിയയും നേരിട്ടുള്ള കർമമായ യോർദാനും ലളിതമായും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: പ്രഭാതം വെളുക്കുമ്പോഴേക്കും
  rationale: പ്രഭാതവെളിച്ചത്തിന്റെ ദൃശ്യബിംബവും കടന്നുകഴിയൽ പൂർത്തിയായ സമയപരിധിയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു. עַד എന്നതിന് ‘വരെയും’ എന്ന വായനയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַד אַחַד לֹא נֶעְדָּר אֲשֶׁר לֹא עָבַר אֶת הַיַּרְדֵּן
  choice: യോർദാൻ കടക്കാതെ ഒരാൾപോലും ശേഷിച്ചിരുന്നില്ല
  rationale: എല്ലാവരും കടന്നുകഴിഞ്ഞുവെന്ന ഇരട്ടനിഷേധസദൃശമായ എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
