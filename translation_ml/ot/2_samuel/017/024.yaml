id: 2SA.17.24
reference: 2 Samuel 17:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/דָוִ֖ד בָּ֣א מַחֲנָ֑יְמָ/ה וְ/אַבְשָׁלֹ֗ם עָבַר֙ אֶת הַ/יַּרְדֵּ֔ן ה֕וּא וְ/כָל אִ֥ישׁ יִשְׂרָאֵ֖ל עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/024.yaml
  text: Then David came to Mahanaim, and Absalom crossed the Jordan, he and all the men of Israel with him.
translation:
  language: ml
  text: പിന്നെ ദാവീദ് മഹനയീമിൽ എത്തി. അബ്ശാലോമും അവനോടുകൂടെ ഇസ്രായേലിലെ സകല പുരുഷന്മാരും യോർദ്ദാൻ കടന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: എത്തി
  rationale: בוא എന്ന ക്രിയയുടെ ഖാൽ പൂർണരൂപം ഇവിടെ ലക്ഷ്യസ്ഥാനത്തെത്തിയതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാള ആഖ്യാനത്തിൽ ‘എത്തി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מַחֲנָיְמָה
  choice: മഹനയീമിൽ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു. ‘എത്തി’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്ഥാനവിഭക്തിയായ ‘മഹനയീമിൽ’ അതിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  choice: യോർദ്ദാൻ കടന്നു
  rationale: עבר എന്ന ക്രിയയും നേരിട്ടുള്ള കർമമായി ‘യോർദ്ദാൻ’ എന്നതും ചേർന്ന് നദി മുറിച്ചുകടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הוּא
  choice: അബ്ശാലോമും
  rationale: സ്വതന്ത്ര സർവനാമമായ הוּא ‘അവനും…’ എന്ന അനുബന്ധ ഘടനയെ വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പേരിനെ ആവർത്തിച്ച് ‘അബ്ശാലോമും’ എന്നു നൽകി.
- source_word: כָל־אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ സകല പുരുഷന്മാരും
  rationale: כָל + אִישׁ എന്നത് കൂട്ടായ അർഥത്തിൽ ‘എല്ലാ പുരുഷന്മാരും’ എന്നാണ്; സന്ദർഭത്തിൽ അബ്ശാലോമിനൊപ്പമുള്ള പുരുഷസേനയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ജനമെല്ലാം’ എന്നു വിപുലീകരിച്ചിട്ടില്ല.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന
  rationale: עִם + മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം സഹഗമനത്തെ സൂചിപ്പിക്കുന്നു. മലയാള വാക്യക്രമത്തിൽ ‘അവനോടുകൂടെ ഉണ്ടായിരുന്ന’ എന്നു നൽകുന്നത് ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: וְ
  choice: പിന്നെ / -ഉം
  rationale: ആദ്യ waw ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ ‘പിന്നെ’ എന്നും, തുടർന്നുള്ള ഏകോപനം മലയാളത്തിലെ ‘-ഉം’ ഘടനയിലൂടെയും പ്രതിഫലിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി. ‘മഹനയീം’, ‘യോർദ്ദാൻ’, ‘അബ്ശാലോം’ എന്നീ പരമ്പരാഗത ബൈബിൾ പേരുരൂപങ്ങൾ നിലനിർത്തി; യുദ്ധസന്ദർഭത്തിലെ ലിംഗസൂചന സംരക്ഷിക്കാൻ ‘പുരുഷന്മാർ’ ഉപയോഗിച്ചു.
