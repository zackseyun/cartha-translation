  to: പിന്നെ ദാവീദ് മഹനയീമിൽ എത്തി. അബ്ശാലോമും അവനോടുകൂടെ ഇസ്രായേലിലെ സകല പുരുഷന്മാരും യോർദ്ദാൻ കടന്നു.
