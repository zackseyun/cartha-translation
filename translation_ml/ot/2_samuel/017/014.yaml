  source_fidelity: 'മുഖ്യഅർഥം മൂലഎബ്രായത്തോട് വിശ്വസ്തമാണ്: ഹൂശായിയുടെ ആലോചനയെ അഹീഥോഫെലിന്റേതിനേക്കാൾ മികച്ചതെന്ന വിലയിരുത്തലും, അഹീഥോഫെലിന്റെ ഫലപ്രദമായ ആലോചനയെ യഹ്‌വെ പരാജയപ്പെടുത്തുകയും അബ്ശാലോമിന്മേൽ വിപത്ത് വരുത്തുകയും ചെയ്യുന്നതുമായ ഉദ്ദേശ്യബന്ധവും സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ «അർഖ്യനായ» എന്ന ജനവിഭാഗസൂചകം തിരുത്തണം; അവസാനവാക്യത്തിന്റെ മലയാളഘടനയും കൂടുതൽ നേരിട്ടും സ്വാഭാവികവുമായി വേണം.'
