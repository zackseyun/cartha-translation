revisions:
- from: 'അപ്പോൾ അബ്ശാലോമും ഇസ്രായേലിലെ സകല പുരുഷന്മാരും പറഞ്ഞു: “അഹീഥോഫെലിന്റെ ആലോചനയെക്കാൾ അർഖ്യനായ ഹൂശായിയുടെ ആലോചന നല്ലതാണ്.” അഹീഥോഫെലിന്റെ നല്ല ആലോചന ഫലിക്കാതിരിക്കാൻ യഹ്‌വെ നിശ്ചയിച്ചിരുന്നു[a]; യഹ്‌വെ അബ്ശാലോമിന്റെമേൽ അനർത്ഥം വരുത്തേണ്ടതിനായിരുന്നു അത്[b].'
  to: 'അപ്പോൾ അബ്ശാലോമും ഇസ്രായേലിലെ സകല പുരുഷന്മാരും പറഞ്ഞു: “അഹീഥോഫെലിന്റെ ആലോചനയെക്കാൾ അർക്ക്യനായ ഹൂശായിയുടെ ആലോചന നല്ലതാണ്.” അഹീഥോഫെലിന്റെ നല്ല ആലോചന നിഷ്ഫലമാക്കാൻ യഹ്‌വെ നിശ്ചയിച്ചിരുന്നു[a], യഹ്‌വെ അബ്ശാലോമിന്മേൽ അനർത്ഥം വരുത്തേണ്ടതിനായി[b].'
  rationale: ജനവിഭാഗസൂചകത്തിന്റെ ലിപ്യന്തരണം «അർക്ക്യനായ» എന്നു തിരുത്തി. ആലോചനയെ «നിഷ്ഫലമാക്കാൻ» എന്ന പ്രയോഗം לְהָפֵר-യുടെ തന്ത്രപരമായ അർഥം കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു. അവസാന ഭാഗം അനാവശ്യ സൂചകപദം ഒഴിവാക്കി, മൂലത്തിലെ ഉദ്ദേശ്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് പ്രകടമാക്കുന്നു. അടിക്കുറിപ്പ്-ചിഹ്നങ്ങൾ അതത് പദാർഥവ്യത്യാസങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
