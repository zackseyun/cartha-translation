source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל טוֹבָ֗ה עֲצַת֙ חוּשַׁ֣י הָ/אַרְכִּ֔י מֵ/עֲצַ֖ת אֲחִיתֹ֑פֶל וַ/יהוָ֣ה צִוָּ֗ה לְ/הָפֵ֞ר אֶת עֲצַ֤ת אֲחִיתֹ֨פֶל֙ הַ/טּוֹבָ֔ה לְ/בַ/עֲב֗וּר הָבִ֧יא יְהוָ֛ה אֶל אַבְשָׁל֖וֹם אֶת הָ/רָעָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
translation:
  language: ml
  text: 'അപ്പോൾ അബ്ശാലോമും ഇസ്രായേലിലെ സകല പുരുഷന്മാരും പറഞ്ഞു: “അഹീഥോഫെലിന്റെ ആലോചനയെക്കാൾ അർക്ക്യനായ ഹൂശായിയുടെ ആലോചന നല്ലതാണ്.” അഹീഥോഫെലിന്റെ നല്ല ആലോചന നിഷ്ഫലമാക്കാൻ യഹ്‌വെ നിശ്ചയിച്ചിരുന്നു[a], യഹ്‌വെ അബ്ശാലോമിന്മേൽ അനർത്ഥം വരുത്തേണ്ടതിനായി[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിഷ്ഫലമാക്കാൻ യഹ്‌വെ കല്പിച്ചിരുന്നു.” എബ്രായക്രിയയ്ക്ക് സാധാരണയായി ‘കല്പിക്കുക’ എന്നാണ് അർഥം; ഇവിടെ അഹീഥോഫെലിന്റെ ആലോചനയെക്കുറിച്ചുള്ള യഹ്‌വെയുടെ ഫലപ്രദമായ നിർണയത്തെ അത് വിവരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അനർത്ഥം” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് “തിന്മ,” “ദോഷം,” “വിപത്ത്” എന്നീ അർഥങ്ങളും വരാം; ഇവിടെ ന്യായവിധിയായി അബ്ശാലോമിന്മേൽ വരുന്ന നാശത്തെയോ ഹാനിയെയോ ആണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടു നയിക്കുന്നു; ആഖ്യാനക്രമം സ്വാഭാവിക മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ സകല പുരുഷന്മാരും
  rationale: ഏകവചനരൂപത്തിലുള്ള אִישׁ ഇവിടെ സമൂഹവാചകമാണ്; മൂലത്തിലെ ലിംഗസൂചന നിലനിർത്തി ബഹുവചനമായി പരിഭാഷപ്പെടുത്തി.
- source_word: טוֹבָה
  choice: നല്ലതാണ്
  rationale: מִן ചേർന്ന താരതമ്യഘടന ‘...യെക്കാൾ ... നല്ലതാണ്’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകി.
- source_word: עֲצַת
  choice: ആലോചന
  rationale: രാജസഭയിലെ ഉപദേശവും തന്ത്രപരമായ പദ്ധതിയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സാധാരണവും മാന്യവുമായ പദം.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: അർഖ്യനായ ഹൂശായി
  rationale: വ്യക്തിനാമവും ജനവിഭാഗ/ദേശബന്ധ സൂചകവും മലയാളലിപിയിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമം പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: צִוָּה
  choice: നിശ്ചയിച്ചിരുന്നു
  rationale: ക്രിയയ്ക്ക് സാധാരണയായി ‘കല്പിക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ ആലോചന പരാജയപ്പെടുമെന്ന ദൈവിക നിർണയമാണ് സന്ദർഭാർത്ഥം; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְהָפֵר
  choice: ഫലിക്കാതിരിക്കാൻ
  rationale: ആലോചനയെ അസാധുവാക്കുക, പരാജയപ്പെടുത്തുക എന്ന ഹിഫീൽ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: הַטּוֹבָה
  choice: നല്ല
  rationale: അഹീഥോഫെലിന്റെ ആലോചനയെ മൂലപാഠം തന്നെ ‘നല്ലത്’ എന്നു വിലയിരുത്തുന്നതിനാൽ ആ തുറന്ന വിലയിരുത്തൽ നിലനിർത്തി.
- source_word: לְבַעֲבוּר הָבִיא
  choice: വരുത്തേണ്ടതിനായിരുന്നു
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ഘടന മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָרָעָה
  choice: അനർത്ഥം
  rationale: ഇവിടെ ധാർമിക തിന്മയല്ല, അബ്ശാലോമിന്മേൽ വരുന്ന നാശകരമായ വിപത്താണ് ഉദ്ദേശിക്കുന്നത്; ‘അനർത്ഥം’ ആ സന്ദർഭാർത്ഥം നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്താൻ ‘യഹ്‌വെ’ ഉപയോഗിച്ചു.
- issue: צִוָּה לְהָפֵר എന്ന ദൈവിക പ്രവർത്തനവിവരണം
  choice: ഫലിക്കാതിരിക്കാൻ യഹ്‌വെ നിശ്ചയിച്ചിരുന്നു
  alternative: ഫലിക്കാതിരിക്കാൻ യഹ്‌വെ കല്പിച്ചിരുന്നു
  rationale: ദൈവിക നിർണയവും അതിന്റെ ഫലപ്രാപ്തിയും സന്ദർഭത്തിൽ പ്രകടമാക്കുന്നു; എന്നാൽ ‘കല്പിക്കുക’ എന്ന നേരിട്ടുള്ള പദാർത്ഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: הָרָעָה എന്ന പദവും ദൈവത്തിന്റെ പ്രവർത്തനവും
  choice: അനർത്ഥം
  alternative: തിന്മ / വിപത്ത് / ദോഷം
  rationale: അബ്ശാലോമിന്മേൽ വരുന്ന ന്യായവിധിസംബന്ധമായ നാശമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ദൈവം ധാർമിക തിന്മ സൃഷ്ടിക്കുന്നു എന്ന സന്ദർഭാതീത നിർവചനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജസഭാ-തന്ത്രപരമായ ആശയം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘ആലോചന’ എന്ന പദത്തിലൂടെ നൽകി. ദൈവിക നിർണയവും മനുഷ്യരുടെ വിലയിരുത്തലും തമ്മിലുള്ള പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തി.
