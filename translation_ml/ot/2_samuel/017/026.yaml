translation:
  language: ml
  text: ഇസ്രായേലും അബ്ശാലോമും ഗിലെയാദ് ദേശത്ത് പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַן
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്ന ക്രിയ ഇവിടെ സൈന്യം ഒരു സ്ഥലത്ത് താവളമടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാളയമിറങ്ങി’ സൈനികസന്ദർഭം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ഇവിടെ ‘ഇസ്രായേൽ’ അബ്ശാലോമിനോടൊപ്പമുള്ള ഇസ്രായേല്യസേനയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തിലെ ദേശീയനാമം തന്നെയാണ് പരിഭാഷയിൽ നിലനിർത്തിയത്.
- source_word: וְאַבְשָׁלֹם
  choice: അബ്ശാലോമും
  rationale: וְ എന്ന സംയോജകം അബ്ശാലോമിനെയും ഇസ്രായേലിനെയും സംയുക്ത കർത്താക്കളായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ഉം ... -ഉം’ ഘടന ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶרֶץ הַגִּלְעָד
  choice: ഗിലെയാദ് ദേശത്ത്
  rationale: אֶרֶץ കൂടാതെ സ്ഥലനാമം ചേർന്ന പ്രയോഗം ‘ഗിലെയാദ് ദേശം/പ്രദേശം’ എന്നാണ്. ‘ഗിലെയാദ് ദേശത്ത്’ ഭൂമിശാസ്ത്രപരമായ സൂചന വ്യക്തമായും സംക്ഷിപ്തമായും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ഏകവചന ക്രിയയെ മലയാളത്തിൽ സംയുക്ത കർത്താവിനൊത്ത സ്വാഭാവിക രൂപത്തിൽ അവതരിപ്പിച്ചു; ‘ഇസ്രായേൽ’ എന്ന കൂട്ടനാമം വിശദീകരിച്ചു വികസിപ്പിക്കാതെ നിലനിർത്തി.
