translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ കഥനശൈലി ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾ ‘യോനാഥാൻ,’ ‘അഹീമാസ്,’ ‘ദാവീദ്’ എന്നും സ്ഥലനാമം ‘ഏൻ-രോഗേൽ’ എന്നും ലിപ്യന്തരണം ചെയ്തു. വാക്യത്തിന്റെ ക്രമീകരിച്ച, ആവർത്തിത പ്രവർത്തനസ്വഭാവം ‘ചെയ്യുമായിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
