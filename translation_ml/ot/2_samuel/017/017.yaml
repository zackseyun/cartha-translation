    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדִים
  choice: നിലയുറപ്പിച്ചിരുന്നു
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘നിൽക്കുക’ എന്നാണെങ്കിലും, ഒരു സ്ഥലത്തോടൊപ്പം വരുന്ന ഈ സന്ദർഭത്തിൽ അവിടെ തുടർന്നോ നിയോഗിക്കപ്പെട്ടോ ഇരിക്കുക എന്ന ആശയം സൂചിപ്പിക്കുന്നു. ‘നിലയുറപ്പിച്ചിരുന്നു’ ആ നിലനിൽപ്പും ദൗത്യപരമായ കാത്തിരിപ്പും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּעֵין רֹגֵל
  choice: ഏൻ-രോഗേലിൽ
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; בְ എന്ന സ്ഥലസൂചകത്തിന്റെ അർഥം ‘-ഇൽ’ കൊണ്ട് നൽകി.
- source_word: הַשִּׁפְחָה
  choice: ഒരു ദാസി
  rationale: שִׁפְחָה സ്ത്രീലിംഗത്തിലുള്ള സേവികയെയോ അടിമസ്ത്രീയെയോ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ അവളുടെ സേവനപങ്കാണ് മുൻനിരയിൽ; ബന്ധിതാവസ്ഥ നിർബന്ധമായി ഊന്നാതെ ‘ദാസി’ ലിംഗവും സാമൂഹികപങ്കും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְהָלְכָה וְהִגִּידָה לָהֶם
  choice: ചെന്ന് അവരെ വിവരം അറിയിക്കുകയും
  rationale: വിവരവിനിമയത്തിന്റെ പതിവായോ ക്രമീകരിക്കപ്പെട്ടതായോ ഉള്ള നടപടിയെ സന്ദർഭം സൂചിപ്പിക്കുന്നു. ‘ചെന്ന് ... അറിയിക്കുകയും’ ചലനവും സന്ദേശം കൈമാറലും നിലനിർത്തുന്നു.
- source_word: וְהֵם יֵלְכוּ וְהִגִּידוּ
  choice: അവർ ചെന്ന് ... അറിയിക്കുകയും ചെയ്യുമായിരുന്നു
  rationale: ആദ്യ സന്ദേശത്തിനു പിന്നാലെയുള്ള ക്രമീകരിച്ച നടപടിക്രമം വ്യക്തമാക്കാൻ ആവർത്തിതമായ ഭൂതകാലപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവിനെ
  rationale: പദവിയും വ്യക്തിനാമവും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകി; അറിയിക്കുക എന്ന ക്രിയയോടൊപ്പം ലക്ഷ്യവ്യക്തിയെ ‘-നെ’ ഉപയോഗിച്ച് അടയാളപ്പെടുത്തി.
- source_word: לְהֵרָאוֹת לָבוֹא הָעִירָה
  choice: പട്ടണത്തിലേക്കു കടക്കുന്നതായി കാണപ്പെടാൻ
  rationale: Niphal രൂപത്തിലെ ‘കാണപ്പെടുക’ എന്ന നിഷ്ക്രിയഭാവവും പട്ടണത്തിലേക്കുള്ള ദിശയും നിലനിർത്തി. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘കടക്കുന്നതായി കാണപ്പെടുക’ എന്നു ചേർത്തു.
- source_word: כִּי לֹא יוּכְלוּ
  choice: കാരണം ... പാടില്ലായിരുന്നു
  rationale: כִּי കാരണവാക്യം ആരംഭിക്കുന്നു. വാച്യമായ ‘കഴിയുമായിരുന്നില്ല’ മലയാളത്തിൽ ശാരീരിക അശക്തിയായി തെറ്റിദ്ധരിക്കാവുന്നതിനാൽ, രഹസ്യവിവരവിനിമയത്തിന്റെ സന്ദർഭത്തിലുള്ള പ്രായോഗിക അസാധ്യത/അനുവദിക്കാനാവാത്ത അപകടം ‘പാടില്ലായിരുന്നു’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
