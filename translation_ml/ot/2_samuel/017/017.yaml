  text: Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
translation:
  language: ml
  text: യോനാഥാനും അഹീമാസും ഏൻ-രോഗേലിൽ നിലയുറപ്പിച്ചിരുന്നു[a]. ഒരു ദാസി[b] ചെന്ന് അവരെ വിവരം അറിയിക്കുകയും, അവർ ചെന്ന് ദാവീദ് രാജാവിനെ അറിയിക്കുകയും ചെയ്യുമായിരുന്നു; കാരണം, അവർ പട്ടണത്തിലേക്കു കടക്കുന്നതായി കാണപ്പെടാൻ കഴിയുമായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘നിന്നുകൊണ്ടിരുന്നു.’ ഈ സന്ദർഭത്തിൽ അവർ അവിടെ തങ്ങി നിയോഗിക്കപ്പെട്ടിരുന്നു എന്ന അർഥമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
