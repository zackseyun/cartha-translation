  text: וְ/אִם אֶל עִיר֙ יֵֽאָסֵ֔ף וְ/הִשִּׂ֧יאוּ כָֽל יִשְׂרָאֵ֛ל אֶל הָ/עִ֥יר הַ/הִ֖יא חֲבָלִ֑ים וְ/סָחַ֤בְנוּ אֹת/וֹ֙ עַד הַ/נַּ֔חַל עַ֛ד אֲשֶֽׁר לֹא נִמְצָ֥א שָׁ֖ם גַּם צְרֽוֹר־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
translation:
  language: ml
  text: അവൻ ഒരു പട്ടണത്തിലേക്കു പിൻവാങ്ങിയാൽ, ഇസ്രായേൽ മുഴുവനും ആ പട്ടണത്തിലേക്കു കയറുകൾ കൊണ്ടുവരും; അവിടെ ഒരു ചെറുകല്ലുപോലും ശേഷിക്കാത്തതുവരെ ഞങ്ങൾ അതിനെ ആ തോടിലേക്കു വലിച്ചിഴക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തോട്” എന്നതിന് “വാടി,” “അരുവി,” അല്ലെങ്കിൽ “മഴക്കാലത്ത് വെള്ളമൊഴുകുന്ന ചാൽ/താഴ്വര” എന്നും പരിഭാഷപ്പെടുത്താം (എബ്രാ. നഹൽ).
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  choice: പിൻവാങ്ങിയാൽ
  rationale: നിഫാൽ രൂപം ഇവിടെ ദാവീദ് ഒരു പട്ടണത്തിൽ അഭയം തേടി പിൻവാങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; സൈനികസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהִשִּׂיאוּ
  choice: കൊണ്ടുവരും
  rationale: കയറുകൾ പട്ടണത്തിലേക്കു കൊണ്ടുവരുന്നതാണ് സന്ദർഭത്തിലെ അർഥം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: חֲבָלִים
  choice: കയറുകൾ
  rationale: പട്ടണത്തെ വലിച്ചുനീക്കുന്ന അതിശയോക്തിപരമായ ദൃശ്യത്തിന് യോജിക്കുന്ന വ്യക്തമായ മൂർത്തപദം.
- source_word: וְסָחַבְנוּ אֹתוֹ
  choice: ഞങ്ങൾ അതിനെ ... വലിച്ചിഴക്കും
  rationale: סחב എന്ന പദത്തിന്റെ ശക്തമായ ‘വലിച്ചിഴയ്ക്കുക’ എന്ന അർഥവും സമ്പൂർണനാശത്തിന്റെ അതിശയോക്തിയും നിലനിർത്തുന്നു; സർവനാമം പട്ടണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: הַנַּחַל
  choice: നീർച്ചാലിലേക്കു
  rationale: נחל എന്നത് തോടിനെയോ കാലികമായി വെള്ളമൊഴുകുന്ന ചാലിനെയോ താഴ്വരയെയോ സൂചിപ്പിക്കാം; സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ ‘നീർച്ചാൽ’ തിരഞ്ഞെടുത്തു.
- source_word: גַּם צְרוֹר
  choice: ഒരു ചെറുകല്ലുപോലും
  rationale: צרור എന്നതിലെ ചെറിയ കല്ല് എന്ന സൂക്ഷ്മതയും ഒന്നും ശേഷിക്കില്ലെന്ന അതിശയോക്തിയും സംരക്ഷിക്കുന്നു.
