  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ സൈനിക അതിശയോക്തിയും നഹൽ എന്ന ഭൂമിശാസ്ത്രപദത്തിന്റെ അർഥവ്യാപ്തിയും നിലനിർത്തിയിരിക്കുന്നു.
