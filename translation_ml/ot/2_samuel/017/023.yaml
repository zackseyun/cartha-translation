  text: וַ/אֲחִיתֹ֣פֶל רָאָ֗ה כִּ֣י לֹ֣א נֶעֶשְׂתָה֮ עֲצָת/וֹ֒ וַ/יַּחֲבֹ֣שׁ אֶֽת הַ/חֲמ֗וֹר וַ/יָּ֜קָם וַ/יֵּ֤לֶךְ אֶל בֵּית/וֹ֙ אֶל עִיר֔/וֹ וַ/יְצַ֥ו אֶל בֵּית֖/וֹ וַ/יֵּחָנַ֑ק וַ/יָּ֕מָת וַ/יִּקָּבֵ֖ר בְּ/קֶ֥בֶר אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
translation:
  language: ml
  text: അഹീഥോഫെൽ തന്റെ ആലോചന നടപ്പാക്കപ്പെട്ടില്ലെന്നു കണ്ടപ്പോൾ[a], കഴുതയ്ക്കു ജീൻ കെട്ടി എഴുന്നേറ്റ് തന്റെ പട്ടണത്തിലെ വീട്ടിലേക്കു പോയി. അവൻ തന്റെ വീട്ടുകാർക്കു നിർദേശങ്ങൾ നൽകി[b]. പിന്നെ സ്വയം തൂങ്ങിക്കൊണ്ടു മരിച്ചു[c]. അവനെ അവന്റെ പിതാവിന്റെ കല്ലറയിൽ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “തന്റെ ആലോചന അനുസരിക്കപ്പെട്ടില്ല.” ഹീബ്രുവിൽ അക്ഷരാർഥം: “തന്റെ ആലോചന ചെയ്യപ്പെട്ടില്ല.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, “തന്റെ വീട്ടുകാര്യങ്ങൾ ക്രമപ്പെടുത്തി.” ഹീബ്രുവിൽ കൂടുതൽ അക്ഷരാർഥമായി: “തന്റെ വീടിന്/വീട്ടുകാർക്ക് നിർദേശം നൽകി.”'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “സ്വയം കഴുത്തുഞെരിച്ചു.” ഈ ക്രിയയ്ക്ക് തൂങ്ങിമരിക്കുകയോ കഴുത്തുഞെരിഞ്ഞു മരിക്കുകയോ എന്ന അർഥം വരാം; ഇവിടെ അഹീഥോഫെലിന്റെ ആത്മഹത്യയെയാണ് വിവരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ ... לֹא נֶעֶשְׂתָה
  choice: തന്റെ ആലോചന നടപ്പാക്കപ്പെട്ടില്ല
  rationale: עֵצָה എന്നത് ഈ രാഷ്ട്രീയ-തന്ത്രപരമായ സന്ദർഭത്തിൽ ‘ആലോചന’ എന്നായി സ്വാഭാവികമായി വരുന്നു; נֶעֶשְׂתָה എന്നതിന്റെ കർമണിപ്രയോഗവും ‘നടപ്പാക്കപ്പെട്ടില്ല’ സംരക്ഷിക്കുന്നു.
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר
  choice: കഴുതയ്ക്കു ജീൻ കെട്ടി
  rationale: חבש ഇവിടെ യാത്രയ്ക്കായി കഴുതയെ ഒരുക്കുന്നതിനെ, പ്രത്യേകിച്ച് ജീൻ കെട്ടുന്നതിനെ, സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘തന്റെ കഴുത’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: എഴുന്നേറ്റ് ... പോയി
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ അനുക്രമപ്രവർത്തനങ്ങൾ ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: אֶל־בֵּיתוֹ אֶל־עִירוֹ
  choice: തന്റെ പട്ടണത്തിലെ വീട്ടിലേക്കു
  rationale: രണ്ടു ലക്ഷ്യസൂചനകളെയും മലയാളത്തിൽ സ്വാഭാവികമായ സ്ഥലബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיְצַו אֶל־בֵּיתוֹ
  choice: തന്റെ വീട്ടുകാർക്കു നിർദേശങ്ങൾ നൽകി
  rationale: ‘വീടിനോട്/വീട്ടിലേക്കു കല്പിച്ചു’ എന്ന ഹീബ്രു പ്രയോഗത്തെ അടുത്തുനിന്ന് പ്രതിഫലിപ്പിക്കുന്നു; ‘തന്റെ കാര്യങ്ങൾ ക്രമപ്പെടുത്തി’ എന്ന വ്യാഖ്യാനപരമായ അർഥം മുഖ്യവാചകത്തിൽ ഉറപ്പിച്ചിട്ടില്ല.
- source_word: וַיֵּחָנַק וַיָּמָת
  choice: സ്വയം തൂങ്ങിക്കൊണ്ടു മരിച്ചു
  rationale: സന്ദർഭം ആത്മഹത്യയാണെന്ന് വ്യക്തമാക്കുകയും חנק എന്ന ക്രിയയിലെ തൂങ്ങൽ/കഴുത്തുഞെരിയൽ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּקֶבֶר אָבִיו
  choice: അവന്റെ പിതാവിന്റെ കല്ലറയിൽ
  rationale: കുടുംബസംസ്കാരസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന കൃത്യവും ഗൗരവമുള്ള മലയാളപ്രയോഗം.
theological_decisions:
- issue: അഹീഥോഫെലിന്റെ മരണരീതി
  choice: സ്വയം തൂങ്ങിക്കൊണ്ടു മരിച്ചു
  alternative: സ്വയം കഴുത്തുഞെരിച്ചു മരിച്ചു
  rationale: വിവരണം ആത്മഹത്യയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു; എന്നാൽ ക്രിയയുടെ ശാരീരികരീതി സംബന്ധിച്ച അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, ഗൗരവമുള്ള ആഖ്യാനശൈലി. ഹീബ്രുവിലെ അനുക്രമപ്രവർത്തനങ്ങൾ നിലനിർത്തിയെങ്കിലും അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി. വ്യാഖ്യാനസാധ്യതകളെ മുഖ്യവാചകത്തിൽ നിർബന്ധമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
