id: 2SA.17.21
reference: 2 Samuel 17:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י אַחֲרֵ֣י לֶכְתָּ֗/ם וַֽ/יַּעֲלוּ֙ מֵֽ/הַ/בְּאֵ֔ר וַ/יֵּ֣לְכ֔וּ וַ/יַּגִּ֖דוּ לַ/מֶּ֣לֶךְ דָּוִ֑ד וַ/יֹּאמְר֣וּ אֶל דָּוִ֗ד ק֣וּמוּ וְ/עִבְר֤וּ מְהֵרָה֙ אֶת הַ/מַּ֔יִם כִּי כָ֛כָה יָעַ֥ץ עֲלֵי/כֶ֖ם אֲחִיתֹֽפֶל׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/021.yaml
  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: ml
  text: 'അവർ പോയിക്കഴിഞ്ഞപ്പോൾ, ഇവർ കിണറ്റിൽനിന്ന് കയറി ദാവീദ് രാജാവിന്റെ അടുക്കൽ ചെന്ന് വിവരം അറിയിച്ചു. അവർ ദാവീദിനോട് പറഞ്ഞു: “എഴുന്നേറ്റ് വേഗം വെള്ളം കടക്കുക; കാരണം അഹീഥോഫെൽ നിങ്ങൾക്കെതിരെ ഇങ്ങനെയാണ് ഉപദേശിച്ചിരിക്കുന്നത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי לֶכְתָּם
  choice: അവർ പോയിക്കഴിഞ്ഞപ്പോൾ
  rationale: അബ്ശാലോമിന്റെ ദാസന്മാർ പോയശേഷമുള്ള സമയബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵהַבְּאֵר
  choice: കിണറ്റിൽനിന്ന്
  rationale: בְּאֵר എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘കിണർ’ ആണ്; മുൻസന്ദർഭത്തിലെ ഒളിത്താവളത്തെയും ഇത് നിലനിർത്തുന്നു.
- source_word: ק֣וּמוּ
  choice: എഴുന്നേറ്റ്
  rationale: ബഹുവചന കല്പനയുടെ പ്രവർത്തനത്തിലേക്കുള്ള അടിയന്തര ആഹ്വാനം ഔപചാരികവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עִבְרוּ ... אֶת הַמַּיִם
  choice: വെള്ളം കടക്കുക
  rationale: ‘വെള്ളം’ എന്ന പൊതുപദം ഉപയോഗിച്ച് മൂലപാഠത്തിലെ ഭൂമിശാസ്ത്രപരമായ അനിർദിഷ്ടത സംരക്ഷിക്കുന്നു; നദി എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: יָעַץ עֲלֵיכֶם
  choice: നിങ്ങൾക്കെതിരെ ... ഉപദേശിച്ചിരിക്കുന്നു
  rationale: עַל എന്ന ബന്ധപദത്തിന്റെ പ്രതികൂല ദിശയും അഹീഥോഫെലിന്റെ ഉപദേശത്തിന്റെ നിലവിലുള്ള പ്രസക്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അഹീഥോഫെലിന്റെ ഉപദേശത്തിന്റെ ദിശ
  choice: നിങ്ങൾക്കെതിരെ
  alternative: നിങ്ങളെക്കുറിച്ച്
  rationale: സന്ദർഭത്തിലും עֲלֵיכֶם എന്ന രൂപത്തിലും ദാവീദിനെതിരായ ശത്രുതാപരമായ ഉദ്ദേശം വ്യക്തമാണ്; എന്നാൽ ഉപദേശത്തിന്റെ ഉള്ളടക്കം ഈ വാക്യത്തിൽ വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആവർത്തിച്ചിരിക്കുന്ന ‘ചെന്ന് ... അറിയിച്ചു’ എന്ന ആഖ്യാനക്രമം നിലനിർത്തി; ‘വെള്ളം’ എന്ന മൂലപാഠത്തിലെ അനിർദിഷ്ടത സംരക്ഷിച്ചു.
