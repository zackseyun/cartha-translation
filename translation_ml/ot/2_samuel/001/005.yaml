id: 2SA.1.5
reference: 2 Samuel 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד אֶל הַ/נַּ֖עַר הַ/מַּגִּ֣יד ל֑/וֹ אֵ֣יךְ יָדַ֔עְתָּ כִּי מֵ֥ת שָׁא֖וּל וִ/יהֽוֹנָתָ֥ן בְּנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/005.yaml
  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് തന്നോടു വിവരം അറിയിച്ച യുവാവിനോട് ചോദിച്ചു: “ശൗലും അവന്റെ മകൻ യോനാഥാനും മരിച്ചെന്ന് നീ എങ്ങനെ അറിഞ്ഞു?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... ചോദിച്ചു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. തുടർന്ന് നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ‘ചോദിച്ചു’ ഇവിടെ സന്ദർഭസഹജമാണ്.
- source_word: הַנַּעַר
  choice: യുവാവ്
  rationale: נַעַר എന്നത് ഇവിടെ യുദ്ധഭൂമിയിലെ സംഭവങ്ങൾ വിവരിക്കാൻ പ്രായമുള്ള ഒരു യുവാവിനെ സൂചിപ്പിക്കുന്നു; ‘ബാലൻ’ എന്നതിനെക്കാൾ ‘യുവാവ്’ യോജിക്കുന്നു.
- source_word: הַמַּגִּיד לוֹ
  choice: തന്നോടു വിവരം അറിയിച്ച
  rationale: പ്രത്യയത്തോടുകൂടിയ പങ്കാളിവാചകം ദാവീദിനു വിവരം നൽകുന്ന യുവാവിനെ തിരിച്ചറിയിക്കുന്നു. ‘വിവരം അറിയിച്ച’ റിപ്പോർട്ട് ചെയ്തതിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵיךְ
  choice: എങ്ങനെ
  rationale: വിവരം അറിഞ്ഞതിന്റെ മാർഗമോ അടിസ്ഥാനമോ ചോദിക്കുന്ന സാധാരണ ചോദ്യപദമാണ്.
- source_word: יָדַעְתָּ
  choice: നീ ... അറിഞ്ഞു
  rationale: ഹീബ്രു സമാപ്തക്രിയ മുൻപ് നേടിയ അറിവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എങ്ങനെ അറിഞ്ഞു?’ സ്വാഭാവികവും രൂപത്തോട് ചേർന്നതുമാണ്.
- source_word: כִּי
  choice: എന്ന്
  rationale: അറിയപ്പെട്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി כִּי പ്രവർത്തിക്കുന്നു; മലയാളത്തിലെ ഉദ്ധരണിപൂരകമായ ‘എന്ന്’ അതിന് യോജിക്കുന്നു.
- source_word: מֵת
  choice: മരിച്ചു
  rationale: ഹീബ്രുവിൽ സംയുക്ത കർത്താവിനോടൊപ്പം ഏകവചനരൂപം വന്നിട്ടുണ്ടെങ്കിലും അർഥം ശൗലിന്റെയും യോനാഥാന്റെയും മരണത്തെ ഉൾക്കൊള്ളുന്നു. മലയാളത്തിൽ ‘മരിച്ചു’ സംയുക്ത കർത്താവിനോടും സ്വാഭാവികമാണ്.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: സർവനാമപ്രത്യയം ശൗലിനെ സൂചിപ്പിക്കുകയും യോനാഥാനെ അവന്റെ മകനായി തിരിച്ചറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: ശൗലും ... യോനാഥാനും
  rationale: പേരുകൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി; ‘-ഉം’ ഘടന ഇരുവരെയും സംയുക്ത കർത്താക്കളായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ നേരിട്ടുള്ള ചോദ്യം നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യമായ വ്യാഖ്യാനമോ സമുദായവിശേഷ പദപ്രയോഗമോ ചേർത്തിട്ടില്ല.
