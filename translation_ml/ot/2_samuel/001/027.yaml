  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֚יךְ נָפְל֣וּ גִבּוֹרִ֔ים וַ/יֹּאבְד֖וּ כְּלֵ֥י מִלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/027.yaml
  text: How the mighty have fallen[b][a], and the weapons of war have perished!
translation:
  language: ml
  text: വീരന്മാർ എങ്ങനെ വീണുപോയി! യുദ്ധോപകരണങ്ങൾ[a] നശിച്ചുപോയി![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യുദ്ധസാമഗ്രികൾ” അല്ലെങ്കിൽ “യുദ്ധകവചങ്ങൾ.” ഹീബ്രു പ്രയോഗം ആക്രമണായുധങ്ങൾ മാത്രമല്ല, സൈനികോപകരണങ്ങളെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “യുദ്ധോപകരണങ്ങൾ” എന്നത് അക്ഷരാർഥത്തിൽ വായിക്കാം; എന്നാൽ ഇസ്രായേലിന്റെ യുദ്ധശക്തിയായിരുന്ന ശൗലിനെയും യോനാഥാനെയും രൂപകമായി സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: എങ്ങനെ
  rationale: വിവരം ചോദിക്കുന്ന ചോദ്യമായല്ല, വിലാപത്തിന്റെ ആശ്ചര്യോദ്ഗാരമായാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്; ആവർത്തിച്ചുവരുന്ന കാവ്യപ്രയോഗവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: נָפְלוּ
  choice: വീണുപോയി
  rationale: പൂർണമായ സംഭവത്തെയും അതിന്റെ ദുഃഖകരമായ ഫലത്തെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: גִבּוֹרִים
  choice: വീരന്മാർ
  rationale: സന്ദർഭത്തിൽ ശക്തരായ യോദ്ധാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; കാവ്യാത്മകവും അന്തസ്സുള്ളതുമായ പൊതുപദമാണ്.
- source_word: וַיֹּאבְדוּ
  choice: നശിച്ചുപോയല്ലോ
  rationale: אבד എന്ന ക്രിയയുടെ ‘നശിക്കുക/ഇല്ലാതാകുക’ എന്ന അർഥം നൽകുകയും വിലാപഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כְּלֵי מִלְחָמָה
  choice: യുദ്ധോപകരണങ്ങൾ
  rationale: പദസമുച്ചയം അക്ഷരാർഥത്തിൽ യുദ്ധത്തിനുള്ള സാമഗ്രികളെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ആയുധങ്ങളിൽ മാത്രം അർഥം ചുരുക്കുന്നില്ല, രൂപകാലങ്കാരമായ വായനയ്ക്കും ഇടനൽകുന്നു.
theological_decisions:
- issue: כְּלֵי מִלְחָמָה എന്നതിന്റെ രൂപകാലങ്കാരസാധ്യത
  choice: പ്രധാനപാഠത്തിൽ ‘യുദ്ധോപകരണങ്ങൾ’ എന്നു നൽകി അക്ഷരാർഥവും രൂപകാലങ്കാരവും തുറന്നുവെച്ചു.
  alternative: ശൗലിനെയും യോനാഥാനെയും തന്നെയാണ് ഇസ്രായേലിന്റെ യുദ്ധശക്തിയായി ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നതെന്ന് നേരിട്ട് വിവർത്തനം ചെയ്യുക.
  rationale: ഹീബ്രു പ്രയോഗം സൈനികസാമഗ്രികളെ അക്ഷരാർഥത്തിൽ സൂചിപ്പിക്കാം; അതേസമയം സന്ദർഭത്തിൽ ശൗലിനെയും യോനാഥാനെയും രൂപകാലങ്കാരമായി സൂചിപ്പിക്കാനും കഴിയും. പാഠം ഈ ദ്വയാർഥത നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ അന്തസ്സുള്ള കാവ്യവിലാപശൈലി. ‘എങ്ങനെ’ എന്ന ആവർത്തനപദം മൂലത്തിലെ വിലാപധ്വനി നിലനിർത്തുന്നു; ‘ല്ലോ’ ദുഃഖോദ്ഗാരം സ്വാഭാവികമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
