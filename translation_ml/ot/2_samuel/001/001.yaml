id: 2SA.1.1
reference: 2 Samuel 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י אַֽחֲרֵי֙ מ֣וֹת שָׁא֔וּל וְ/דָוִ֣ד שָׁ֔ב מֵ/הַכּ֖וֹת אֶת הָ/עֲמָלֵ֑ק וַ/יֵּ֧שֶׁב דָּוִ֛ד בְּ/צִקְלָ֖ג יָמִ֥ים שְׁנָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/001.yaml
  text: After the death of Saul[a], when David had returned from striking down the Amalekites, David stayed in Ziklag two days.
translation:
  language: ml
  text: ശൗലിന്റെ മരണശേഷം, അമാലേക്യരെ ആക്രമിച്ചു മടങ്ങിവന്ന ദാവീദ് സിക്ലാഗിൽ രണ്ടു ദിവസം താമസിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ഇത് ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന ഘടനയാണ്; മലയാളത്തിൽ വേറൊരു ‘ഇപ്പോൾ’ എന്ന കാലസൂചകപദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ആ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: אַחֲרֵי מוֹת שָׁאוּל
  choice: ശൗലിന്റെ മരണശേഷം
  rationale: എബ്രായത്തിലെ നാമരൂപത്തിലുള്ള കാലസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וְדָוִד שָׁב
  choice: ദാവീദ് ... മടങ്ങിവന്ന്
  rationale: പ്രധാന സംഭവത്തിനു മുമ്പുണ്ടായ മടങ്ങിവരവ് മലയാളത്തിലെ സംയോജക ക്രിയാരൂപം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מֵהַכּוֹת
  choice: തോൽപ്പിച്ച്
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ അർഥം നൽകുന്നു; എല്ലാവരെയും കൊന്നൊടുക്കിയെന്ന അതിശക്തമായ ധ്വനി അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: אֶת הָעֲמָלֵק
  choice: അമാലേക്ക്യരെ
  rationale: ഏകവചന ജനവിഭാഗനാമമായ ‘അമാലേക്ക്’ ഇവിടെ ആ ജനതയെ സമൂഹമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചന ജനനാമം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: രണ്ടു ദിവസത്തെ പരിമിതകാലയളവിന് ‘വസിച്ചു’ എന്നതിനെക്കാൾ ‘താമസിച്ചു’ യോജിക്കുന്നു.
- source_word: בְּצִקְלָג
  choice: സിക്ലാഗിൽ
  rationale: സ്ഥലനാമത്തോടുള്ള എബ്രായ സ്ഥാനസൂചകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: יָמִים שְׁנָיִם
  choice: രണ്ടു ദിവസം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിൽ ഇല്ലാത്ത വ്യക്തീകരണങ്ങളോ മതവിഭാഗപരമായ വ്യാഖ്യാനങ്ങളോ ചേർത്തിട്ടില്ല.
