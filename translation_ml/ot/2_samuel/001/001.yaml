  to: ശൗലിന്റെ മരണശേഷം, അമാലേക്യരെ ആക്രമിച്ചു മടങ്ങിവന്ന ദാവീദ് സിക്ലാഗിൽ രണ്ടു ദിവസം താമസിച്ചു.
