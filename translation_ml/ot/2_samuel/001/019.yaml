source:
  edition: WLC
  text: הַ/צְּבִי֙ יִשְׂרָאֵ֔ל עַל בָּמוֹתֶ֖י/ךָ חָלָ֑ל אֵ֖יךְ נָפְל֥וּ גִבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/019.yaml
  text: Your glory[a], O Israel[b], lies slain on your heights! How the mighty have fallen!
translation:
  language: ml
  text: 'ഇസ്രായേലേ, നിന്റെ മഹത്ത്വം[a] നിന്റെ മലമുകളിൽ[b] കൊല്ലപ്പെട്ടുകിടക്കുന്നു!

    വീരന്മാർ എങ്ങനെ വീണുപോയി!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പദമായ צְבִי എന്നതിന് ‘ഭംഗി,’ ‘ശോഭ’ എന്നും അർഥമാകാം; ചിലർ അതിനെ കൂടുതൽ മൂർത്തമായി ‘മാൻ’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിന്റെ ഉയർന്ന സ്ഥലങ്ങളിൽ.’ ഇവിടെ ആരാധനയുമായി ബന്ധപ്പെട്ട ‘പൂജാഗിരികൾ’ എന്ന ധ്വനി വരാതിരിക്കാനും ഭൂപ്രകൃതിപരമായ അർഥം നിലനിർത്താനും ‘മലമുകളിൽ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּבִי
  choice: നിന്റെ മഹത്ത്വം
  rationale: צְבִי എന്ന പദത്തിന് ‘ഭംഗി,’ ‘ശോഭ,’ ‘മഹത്ത്വം’ എന്നും കൂടുതൽ മൂർത്തമായി ‘മാൻ’ എന്നും അർഥമാകാം. ശൗലിനെയും യോനാഥാനെയും കുറിച്ചുള്ള വിലാപത്തിൽ, ഇസ്രായേലിന്റെ മഹത്ത്വത്തെ സൂചിപ്പിക്കുന്ന രൂപകാലങ്കാരപരമായ അർഥം സന്ദർഭത്തിന് നന്നായി യോജിക്കുന്നു; എന്നാൽ യഥാർഥ പദാർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേലേ
  rationale: നേരിട്ടുള്ള അഭിസംബോധന മലയാളത്തിലെ സംബോധനരൂപമായ ‘ഇസ്രായേലേ’ കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: עַל
  choice: മേൽ
  rationale: കൊല്ലപ്പെട്ടവൻ കിടക്കുന്ന സ്ഥലം സൂചിപ്പിക്കുന്ന ലളിതമായ സ്ഥാനബന്ധം നിലനിർത്തുന്നു.
- source_word: בָּמוֹתֶיךָ
  choice: നിന്റെ മലമുകളിൽ
  rationale: בָּמוֹת എന്നത് ഉയർന്ന സ്ഥലങ്ങളെയോ മലമേടുകളെയോ സൂചിപ്പിക്കാം. ‘മലമുകളിൽ’ ഭൂപ്രകൃതിപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ആരാധനാസ്ഥലങ്ങൾ എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: חָלָל
  choice: കൊല്ലപ്പെട്ടുകിടക്കുന്നു
  rationale: കൊല്ലപ്പെട്ട ഒരാളെയോ കൊല്ലപ്പെട്ട അവസ്ഥയെയോ സൂചിപ്പിക്കുന്ന പദം. മലയാളത്തിൽ വിധേയപ്രയോഗമായി ‘കൊല്ലപ്പെട്ടുകിടക്കുന്നു’ എന്നത് ദൃശ്യവും സ്വാഭാവികവുമാണ്.
- source_word: אֵיךְ
  choice: എങ്ങനെ
  rationale: വിലാപത്തിലെ ആശ്ചര്യോദ്ഗാരപരമായ ചോദ്യം നിലനിർത്തുന്നു.
- source_word: נָפְלוּ
  choice: വീണുപോയി
  rationale: സംഭവിച്ച മരണത്തെ വിലാപഭാവത്തോടെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; കവിതയിലെ ആവർത്തനവാക്യത്തിന്റെ ശക്തിയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: גִבּוֹרִים
  choice: വീരന്മാർ
  rationale: גִבּוֹרִים എന്നതിന് ശക്തന്മാർ, യോദ്ധാക്കൾ, വീരന്മാർ എന്നീ അർഥങ്ങൾ വരാം. ‘വീരന്മാർ’ യുദ്ധസന്ദർഭവും കാവ്യാത്മകമായ വ്യാപ്തിയും ഒരുമിച്ച് നൽകുന്നു.
