  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള വിലാപശൈലി. ആദ്യവരിയിലെ നേരിട്ടുള്ള അഭിസംബോധനയും രണ്ടാം വരിയിലെ ആവർത്തനയോഗ്യമായ കാവ്യാത്മക ഉദ്ഗാരവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
