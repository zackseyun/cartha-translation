source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י עֲמָד נָ֤א עָלַ/י֙ וּ/מֹ֣תְתֵ֔/נִי כִּ֥י אֲחָזַ֖/נִי הַ/שָּׁבָ֑ץ כִּֽי כָל ע֥וֹד נַפְשִׁ֖/י בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/009.yaml
  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
translation:
  language: ml
  text: 'അവൻ എന്നോടു പറഞ്ഞു: “ദയവായി എന്റെ മീതെ നിന്നു എന്നെ കൊന്നുകളയൂ. കാരണം, കൊടിയ വേദന എന്നെ പിടികൂടിയിരിക്കുന്നു[a]; എങ്കിലും എന്റെ ജീവൻ ഇപ്പോഴും എന്നിലുണ്ട്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പേശിവലിവുകൾ/കോച്ചിവലിപ്പുകൾ എന്നെ പിടികൂടിയിരിക്കുന്നു.” ‘കൊടിയ വേദന’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രായപദം അപൂർവമാണ്; അതിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “എന്റെ ജീവൻ/പ്രാണൻ മുഴുവനും ഇപ്പോഴും എന്നിലുണ്ട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָד נָא עָלַי
  choice: ദയവായി എന്റെ അടുത്തുവന്ന് എന്റെമേൽ നിന്നുകൊണ്ട്
  rationale: עָמַד എന്നതിന്റെ ‘നിൽക്കുക’ എന്ന അർഥവും עַל സൂചിപ്പിക്കുന്ന, വീണുകിടക്കുന്ന ഒരാളുടെ മേൽ ചാഞ്ഞുനിൽക്കുന്ന സ്ഥാനവും നിലനിർത്തുന്നു; נָא വിനയപൂർവമായ അപേക്ഷയായി ‘ദയവായി’ എന്നു നൽകി.
- source_word: וּמֹתְתֵנִי
  choice: എന്നെ കൊന്നുകളയൂ
  rationale: מות എന്ന ധാതുവിന്റെ കാരണാർഥരൂപം ഇവിടെ നേരിട്ട് ‘മരണത്തിന് ഇടയാക്കുക/കൊല്ലുക’ എന്നാണ്. യുദ്ധഭൂമിയിലെ അടിയന്തര അപേക്ഷ സ്വാഭാവികവും മറയില്ലാത്തതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲחָזַנִי
  choice: എന്നെ പിടികൂടിയിരിക്കുന്നു
  rationale: אָחַז എന്നതിലെ ശക്തമായി പിടിക്കുക, കീഴടക്കുക എന്ന ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַשָּׁבָץ
  choice: കൊടിയ വേദന
  rationale: അപൂർവവും കൃത്യാർഥം അനിശ്ചിതവുമായ പദമാണിത്. സന്ദർഭത്തിന് യോജിക്കുന്ന പൊതുവായ അർഥം മുഖ്യവാചകത്തിൽ നൽകി, കൂടുതൽ ശാരീരികമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  choice: എങ്കിലും എന്റെ ജീവൻ ഇപ്പോഴും എന്നിലുണ്ട്
  rationale: נֶפֶשׁ ഇവിടെ സാങ്കേതികമായി വേർപെട്ട ‘ആത്മാവ്’ എന്നതിലുപരി ജീവനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ വൈരുധ്യഭാവം ‘എങ്കിലും’ എന്നു പ്രകടമാക്കുന്നു; ഹീബ്രായിയുടെ അക്ഷരാർഥഘടന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיֹּאמֶר אֵלַי
  choice: അവൻ എന്നോടു പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനക്രമം ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സ്വാഭാവികവുമായ ആഖ്യാനശൈലി. മരണത്തിനുള്ള അപേക്ഷയെ മൂലപാഠംപോലെ നേരിട്ട് അവതരിപ്പിക്കുന്നു. അപൂർവപദത്തിന്റെ അനിശ്ചിതത്വവും അവസാന ഉപവാക്യത്തിലെ കാരണാർഥം/വൈരുധ്യാർഥം തമ്മിലുള്ള പിരിമുറുക്കവും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
