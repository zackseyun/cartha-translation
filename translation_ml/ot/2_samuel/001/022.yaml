source:
  edition: WLC
  text: מִ/דַּ֣ם חֲלָלִ֗ים מֵ/חֵ֨לֶב֙ גִּבּוֹרִ֔ים קֶ֚שֶׁת יְה֣וֹנָתָ֔ן לֹ֥א נָשׂ֖וֹג אָח֑וֹר וְ/חֶ֣רֶב שָׁא֔וּל לֹ֥א תָשׁ֖וּב רֵיקָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
translation:
  language: ml
  text: 'കൊല്ലപ്പെട്ടവരുടെ രക്തത്തിൽനിന്നും,

    വീരന്മാരുടെ മേദസ്സിൽനിന്നും[a]

    യോനാഥാന്റെ വില്ല് പിന്മാറിയില്ല[b];

    ശൗലിന്റെ വാൾ വെറുതെ മടങ്ങിയതുമില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മേദസ്സ്’ എന്നത് ഏറ്റവും വിശിഷ്ടമായതോ സമൃദ്ധമായതോ ആയ ഭാഗത്തെയും സൂചിപ്പിക്കാം; ഇവിടെ അത് യുദ്ധവിജയത്തിന്റെ ചിത്രം കൂടുതൽ തീവ്രമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പിന്തിരിഞ്ഞില്ല.’ എബ്രായ ക്രിയയ്ക്ക് പിൻവാങ്ങുക, പിന്തിരിയുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם חֲלָלִים
  choice: കൊല്ലപ്പെട്ടവരുടെ രക്തത്തിൽനിന്നും
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ഉറവിടം/അകന്നുപോകൽ സൂചിപ്പിക്കുന്ന അർഥവും യുദ്ധത്തിൽ കൊല്ലപ്പെട്ടവരുടെ രക്തം എന്ന ശക്തമായ കാവ്യചിത്രവും നിലനിർത്തുന്നു.
- source_word: מֵחֵלֶב גִּבּוֹרִים
  choice: വീരന്മാരുടെ മേദസ്സിൽനിന്നും
  rationale: חֵלֶב എന്നതിന്റെ അക്ഷരാർഥമായ ‘മേദസ്സ്’ നിലനിർത്തി, ഗִּבּוֹרִים എന്നതിന് വിലാപഗീതത്തിന്റെ ഉന്നതമായ കാവ്യഭാവത്തിന് യോജിച്ച ‘വീരന്മാർ’ ഉപയോഗിക്കുന്നു.
- source_word: קֶשֶׁת יְהוֹנָתָן
  choice: യോനാഥാന്റെ വില്ല്
  rationale: എബ്രായ construct ബന്ധം സ്വാഭാവികമായ മലയാള ഉടമസ്ഥരൂപത്തിൽ നൽകുന്നു.
- source_word: לֹא נָשׂוֹג אָחוֹר
  choice: പിന്മാറിയില്ല
  rationale: נסוג കൂടെ אָחוֹר എന്ന പ്രയോഗം പിൻവാങ്ങൽ അഥവാ പിന്തിരിയൽ സൂചിപ്പിക്കുന്നു; വില്ലിന്റെ കാവ്യാത്മക വ്യക്തിവൽക്കരണം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְחֶרֶב שָׁאוּל
  choice: ശൗലിന്റെ വാൾ
  rationale: യോനാഥാന്റെ വില്ല് എന്ന സമാന്തര പ്രയോഗത്തോട് ഒത്തുനിൽക്കുന്ന സ്വാഭാവിക മലയാള ഉടമസ്ഥരൂപം.
- source_word: לֹא תָשׁוּב רֵיקָם
  choice: വെറുതെ മടങ്ങിയതുമില്ല
  rationale: ലക്ഷ്യം സാധിക്കാതെ ശൂന്യമായി മടങ്ങിയില്ല എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുകയും വാളിന്റെ വ്യക്തിവൽക്കരണം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
