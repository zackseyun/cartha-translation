  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയ കാവ്യഭാഷ ഉപയോഗിച്ചു. എബ്രായ സമാന്തരഘടനയും ആയുധങ്ങളുടെ വ്യക്തിവൽക്കരണവും നിലനിർത്തി; അർഥം വിശദീകരിച്ച് കാവ്യത്തിലെ യുദ്ധചിത്രം മൃദൂകരിച്ചിട്ടില്ല.
