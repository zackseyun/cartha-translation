  language: ml
  text: അവൻ പിന്നിലേക്കു തിരിഞ്ഞ് എന്നെ കണ്ടു[a], എന്നെ വിളിച്ചു; ഞാൻ, “ഇതാ, ഞാൻ ഇവിടെ ഉണ്ട്!” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായഭാഷയിൽ അക്ഷരാർഥം: “അവൻ തന്റെ പിന്നിലേക്കു തിരിഞ്ഞു.” അതായത്, അവൻ തിരിഞ്ഞ് തന്റെ പിന്നിലേക്കു നോക്കി.'
