lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: അവൻ പിന്നിലേക്കു തിരിഞ്ഞ്
  rationale: പנה എന്ന ക്രിയയുടെ ‘തിരിയുക’ എന്ന അർഥവും אַחֲרָיו എന്നതിന്റെ പിന്നിലേക്കുള്ള സ്ഥലസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּרְאֵנִי
  choice: എന്നെ കണ്ടു
  rationale: ראה എന്ന ക്രിയയും ഒന്നാംപുരുഷ ഏകവചന കർമപ്രത്യയവും നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וַיִּקְרָא אֵלָי
  choice: അവൻ എന്നെ വിളിച്ചു
  rationale: קרא אֶל എന്ന പ്രയോഗത്തിന്റെ ‘ഒരാളെ വിളിക്കുക’ എന്ന സാധാരണ അർഥം നൽകുന്നു; ‘ആജ്ഞാപിച്ചു വരുത്തി’ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: וָאֹמַר
  choice: ഞാൻ … എന്നു പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ പ്രസ്താവനാക്രിയയോട് ചേർന്ന ഔപചാരിക-സമീപമായ പരിഭാഷയാണ്; സന്ദർഭത്തിൽ മറുപടിയാണെങ്കിലും ‘മറുപടി പറഞ്ഞു’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: הִנֵּנִי
  choice: ഇതാ, ഞാൻ!
  rationale: സ്വയം സന്നിഹിതനായി സമർപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യതയും സന്നദ്ധതയുടെ സൂചനയും നിലനിർത്തുന്നു; ‘ഞാൻ ഇവിടെയുണ്ട്’ എന്ന സ്ഥലപരമായ അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
