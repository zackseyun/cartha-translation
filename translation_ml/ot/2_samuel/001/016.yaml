id: 2SA.1.16
reference: 2 Samuel 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ דָּוִ֔ד דמי/ך עַל רֹאשֶׁ֑/ךָ כִּ֣י פִ֗י/ךָ עָנָ֤ה בְ/ךָ֙ לֵ/אמֹ֔ר אָנֹכִ֥י מֹתַ֖תִּי אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/016.yaml
  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് അവനോട് പറഞ്ഞു: “നിന്റെ രക്തം നിന്റെ തലമേലാണ്[a]; കാരണം, ‘യഹ്‌വെയുടെ അഭിഷിക്തനെ കൊന്നത് ഞാൻ തന്നെയാണ്’ എന്നു നിന്റെ വായ് നിനക്കെതിരെ സാക്ഷ്യം പറഞ്ഞിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിന്റെ രക്തം നിന്റെ തലമേൽത്തന്നെ ഇരിക്കട്ടെ.” സ്വന്തം മരണത്തിന്റെ ഉത്തരവാദിത്വം അവനുതന്നെയാണെന്ന് ചുമത്തുന്ന എബ്രായ ന്യായവിധിശൈലിയാണിത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “നിന്റെ വായ് നിനക്കെതിരെ സാക്ഷ്യം വഹിച്ചിരിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: അപ്പോൾ ദാവീദ് അവനോട് പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമത്തിൽ ‘അപ്പോൾ’ ഉപയോഗിച്ചു; אֵלָיו വ്യക്തമായി ‘അവനോട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: നിന്റെ രക്തം നിന്റെ തലമേൽത്തന്നെ ഇരിക്കട്ടെ
  rationale: സ്വന്തം മരണത്തിന്റെ ഉത്തരവാദിത്വം ആ വ്യക്തിക്കുതന്നെയാണെന്നു ചുമത്തുന്ന എബ്രായ ന്യായവിധിസൂത്രത്തിന്റെ രക്തം–തല ദൃശ്യരൂപം നിലനിർത്തുന്നു. ക്രിയ വ്യക്തമല്ലാത്തതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ശാപ/വിധി പ്രയോഗമായ ‘ഇരിക്കട്ടെ’ സ്വീകരിച്ചു.
- source_word: כִּי
  choice: —വല്ലോ
  rationale: ദാവീദിന്റെ വിധിക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ഘടകമാണ്. മലയാളത്തിൽ മുൻവാക്യത്തെ ന്യായീകരിക്കുന്ന സ്വാഭാവിക സമാപനരൂപമായ ‘പറഞ്ഞുവല്ലോ’ വഴി കാരണബന്ധം പ്രകടമാക്കി.
- source_word: פִּיךָ
  choice: നിന്റെ സ്വന്തം വായ്
  rationale: വാക്കുകളിലൂടെ സ്വയം കുറ്റം തെളിയിച്ചതിലുള്ള ഊന്നൽ നിലനിർത്താൻ ശരീരാവയവത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠരൂപം ഒഴിവാക്കാതെ ‘സ്വന്തം’ ചേർത്തു.
- source_word: עָנָה בְךָ
  choice: നിനക്കു വിരോധമായി സാക്ഷ്യം പറഞ്ഞു
  rationale: നിയമപരമായ സന്ദർഭത്തിൽ ഈ പദസമുച്ചയം ഒരാൾക്കെതിരെ സാക്ഷ്യം നൽകുക എന്ന അർത്ഥം വഹിക്കുന്നു; ‘ഉത്തരം പറഞ്ഞു’ എന്ന പദാനുപദരൂപത്തേക്കാൾ ഇത് സന്ദർഭാർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: എന്നു പറഞ്ഞുകൊണ്ട്
  rationale: സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകം സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ ചേർത്തു.
- source_word: אָנֹכִי
  choice: ഞാൻ തന്നെയാണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ ‘തന്നെയാണ്’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
- source_word: מֹתַתִּי
  choice: കൊന്നത്
  rationale: കാരണവാചകമായ ‘മരിപ്പിച്ചു/കൊന്നു’ എന്ന നേരിട്ടുള്ള അർത്ഥം ഈ കുറ്റസമ്മതത്തിൽ ലളിതവും ശക്തവുമായി നൽകുന്നു.
- source_word: מְשִׁיחַ יְהוָה
  choice: യഹ്‌വെയുടെ അഭിഷിക്തൻ
  rationale: ശൗലിനെ ദൈവം രാജാവായി അഭിഷേകം ചെയ്തതിനെ സൂചിപ്പിക്കുന്ന രാജകീയ പദവിയായതിനാൽ ‘മശീഹ’ എന്നു ലിപ്യന്തരണം ചെയ്യാതെ അർത്ഥം പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു പൊതുപദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ ടെട്രാഗ്രാമറ്റൺ നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: מְשִׁיחַ എന്ന പദത്തിന്റെ രാജകീയ സന്ദർഭാർത്ഥം
  choice: അഭിഷിക്തൻ
  alternative: മശീഹ
  rationale: ഇവിടെ പദം ശൗലിന്റെ രാജകീയ അഭിഷേകത്തെ സൂചിപ്പിക്കുന്നു. പിന്നീടുള്ള സാങ്കേതിക ക്രിസ്തുശാസ്ത്ര അർത്ഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ അർത്ഥപരിഭാഷ സ്വീകരിച്ചു.
- issue: דָּמֶיךָ עַל רֹאשֶׁךָ എന്ന വിധിസൂത്രത്തിന്റെ ഭാവം
  choice: നിന്റെ രക്തം നിന്റെ തലമേൽത്തന്നെ ഇരിക്കട്ടെ
  alternative: നിന്റെ രക്തം നിന്റെ തലമേലാണ്
  rationale: ഹീബ്രുവിൽ വ്യക്തമായ ബന്ധകക്രിയ ഇല്ലാത്തതിനാൽ പ്രസ്താവനയോ വിധി/ശാപപ്രയോഗമോ എന്ന സൂക്ഷ്മമായ അനിശ്ചിതത്വമുണ്ട്. മുഖ്യപാഠത്തിൽ സന്ദർഭോചിതമായ വിധിഭാവം നൽകി, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ന്യായവിധിസ്വരം നിലനിർത്തി. മൂലപാഠത്തിലെ ‘രക്തം–തല’ ദൃശ്യപ്രയോഗവും ‘വായ്’ എന്ന സ്വയംകുറ്റപ്പെടുത്തുന്ന രൂപകവും സംരക്ഷിച്ചു; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിയമപരമായ ‘സാക്ഷ്യം’ എന്ന പദം ഉപയോഗിച്ചു.
