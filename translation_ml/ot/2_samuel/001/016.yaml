revisions:
- from: 'അപ്പോൾ ദാവീദ് അവനോട് പറഞ്ഞു: “നിന്റെ രക്തം നിന്റെ തലമേൽത്തന്നെ ഇരിക്കട്ടെ[a]; ‘യഹ്‌വെയുടെ അഭിഷിക്തനെ കൊന്നത് ഞാൻ തന്നെയാണ്’ എന്നു പറഞ്ഞുകൊണ്ട് നിന്റെ സ്വന്തം വായ് നിനക്കു വിരോധമായി സാക്ഷ്യം പറഞ്ഞുവല്ലോ[b].”'
  to: 'അപ്പോൾ ദാവീദ് അവനോട് പറഞ്ഞു: “നിന്റെ രക്തം നിന്റെ തലമേലാണ്[a]; കാരണം, ‘യഹ്‌വെയുടെ അഭിഷിക്തനെ കൊന്നത് ഞാൻ തന്നെയാണ്’ എന്നു നിന്റെ വായ് നിനക്കെതിരെ സാക്ഷ്യം പറഞ്ഞിരിക്കുന്നു[b].”'
  rationale: The revision retains every source element and the formal judicial register while using the indicative form of the ambiguous Hebrew nominal clause in the main text. The footnote preserves the optative alternative. It also makes the causal relationship explicit, streamlines the quoted self-testimony, and supplies a substantive alternative for the testimony idiom.
