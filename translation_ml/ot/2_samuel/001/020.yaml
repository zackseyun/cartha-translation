id: 2SA.1.20
reference: 2 Samuel 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
translation:
  language: ml
  text: 'ഗത്തിൽ അത് അറിയിക്കരുത്;


    അശ്കെലോന്റെ തെരുവുകളിൽ ആ വാർത്ത വിളംബരം ചെയ്യരുത്[a].


    ഫെലിസ്ത്യരുടെ പുത്രിമാർ സന്തോഷിക്കാതിരിക്കാനും,


    പരിച്ഛേദനം ചെയ്യാത്തവരുടെ പുത്രിമാർ ഉല്ലസിക്കാതിരിക്കാനും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ വാർത്ത അറിയിക്കരുത്’ അല്ലെങ്കിൽ ‘ആ വാർത്ത കൊണ്ടുചെല്ലരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘പരിച്ഛേദനം ചെയ്യാത്തവരുടെ പുത്രിമാർ’ എന്നത് ഫെലിസ്ത്യരെക്കുറിച്ച് ഉപയോഗിച്ചിരിക്കുന്ന ഉടമ്പടിസംബന്ധമായ ഒരു നിന്ദാസൂചക പ്രയോഗത്തിന്റെ അക്ഷരാർഥപരമായ പരിഭാഷയാണ്; ‘അഗ്രചർമികളായവരുടെ പുത്രിമാർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּגִּידוּ
  choice: അത് അറിയിക്കരുത്
  rationale: נגד എന്ന ധാതുവിന്റെ ‘അറിയിക്കുക/പറയുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. ശൗലിന്റെയും യോനാഥാന്റെയും വീഴ്ചയെക്കുറിച്ചുള്ള വാർത്തയാണ് സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന സൂചിത കർമം; അതിനാൽ ‘അത്’ ചേർത്തിരിക്കുന്നു.
- source_word: בְגַת
  choice: ഗത്തിൽ
  rationale: നഗരനാമമായ ‘ഗത്ത്’ സ്ഥലസൂചക വിഭക്തിയോടെ നൽകിയിരിക്കുന്നു.
- source_word: תְּבַשְּׂרוּ
  choice: ആ വാർത്ത ഘോഷിക്കരുത്
  rationale: പീയേൽ രൂപത്തിലുള്ള בשר പൊതുവായി വാർത്ത അറിയിക്കുകയോ വിളംബരം ചെയ്യുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഘോഷിക്കുക’ തെരുവുകളിലെ പരസ്യപ്രഖ്യാപനത്തിന്റെ ഭാവവും ആദ്യവരിയോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: בְּחוּצֹת אַשְׁקְלוֹן
  choice: അശ്കെലോന്റെ തെരുവുകളിൽ
  rationale: חוּצוֹת നഗരത്തിലെ തെരുവുകളെയോ തുറസ്സായ പൊതുസ്ഥലങ്ങളെയോ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘തെരുവുകളിൽ’ തിരഞ്ഞെടുത്തു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: അനിഷ്ടഫലം സംഭവിക്കാതിരിക്കാനുള്ള മുന്നറിയിപ്പ് സൂചിപ്പിക്കുന്നു. ആവർത്തിച്ചിരിക്കുന്ന ഇബ്രായഘടന നിലനിർത്താൻ രണ്ടു അർധവരികളിലും ‘അല്ലെങ്കിൽ’ ആവർത്തിച്ചു.
- source_word: תִּשְׂמַחְנָה
  choice: സന്തോഷിക്കും
  rationale: שמח എന്ന ധാതുവിന്റെ സന്തോഷം/ആനന്ദം എന്ന അടിസ്ഥാനാർഥം ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പുത്രിമാർ
  rationale: ‘പുത്രിമാർ’ എന്ന അക്ഷരാർഥം നിലനിർത്തി, ഫെലിസ്ത്യ നഗരങ്ങളിലെ ആഘോഷിക്കുന്ന സ്ത്രീകളെ അവതരിപ്പിക്കുന്ന കാവ്യഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: תַּעֲלֹזְנָה
  choice: ഉല്ലസിക്കും
  rationale: עלז മുൻവരിയിലെ സന്തോഷത്തേക്കാൾ പ്രകടവും ആവേശഭരിതവുമായ ആനന്ദത്തെ സൂചിപ്പിക്കുന്നു; ‘ഉല്ലസിക്കും’ ഈ തീവ്രതാഭേദം നിലനിർത്തുന്നു.
- source_word: בְּנוֹת הָעֲרֵלִים
  choice: അഗ്രചർമികളായവരുടെ പുത്രിമാർ
  rationale: עֲרֵלִים എന്നത് അക്ഷരാർഥത്തിൽ ‘പരിച്ഛേദനം ചെയ്യാത്തവർ/അഗ്രചർമികൾ’ എന്നാണ്. പൊതുവായ നിന്ദാപദം ഉപയോഗിക്കാതെ ഉടമ്പടിചിഹ്നവുമായി ബന്ധപ്പെട്ട മൂലപദത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: עֲרֵלִים എന്ന ഉടമ്പടിസംബന്ധമായ നിന്ദാസൂചക പദത്തിന്റെ പരിഭാഷ
  choice: അഗ്രചർമികളായവർ
  alternative: വിജാതീയർ / അശുദ്ധർ
  rationale: മൂലപദം പരിച്ഛേദനവുമായി നേരിട്ട് ബന്ധപ്പെട്ടതിനാൽ, പൊതുവായ ‘വിജാതീയർ’ അല്ലെങ്കിൽ വ്യാഖ്യാനാത്മകമായ ‘അശുദ്ധർ’ എന്നതിനു പകരം അക്ഷരാർഥത്തോടടുത്ത രൂപം സ്വീകരിച്ചു. ഇതിലൂടെ വാക്യത്തിന്റെ വംശീയ-മതപരവും ഉടമ്പടിസംബന്ധവുമായ വാഗ്‌ശക്തി മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വിലാപകാവ്യത്തിന്റെ ഗൗരവവും സമാന്തരവാക്യഘടനയും നിലനിർത്തി. ‘അറിയിക്കരുത്/ഘോഷിക്കരുത്’, ‘സന്തോഷിക്കും/ഉല്ലസിക്കും’ എന്നീ പദജോടികൾ ഇബ്രായത്തിലെ അർഥതീവ്രതാഭേദം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. സ്ഥലനാമങ്ങൾ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾരൂപങ്ങൾക്ക് അടുത്തായി നൽകിയിരിക്കുന്നു.
