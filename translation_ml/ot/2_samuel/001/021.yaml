source:
  edition: WLC
  text: הָרֵ֣י בַ/גִּלְבֹּ֗עַ אַל טַ֧ל וְ/אַל מָטָ֛ר עֲלֵי/כֶ֖ם וּ/שְׂדֵ֣י תְרוּמֹ֑ת כִּ֣י שָׁ֤ם נִגְעַל֙ מָגֵ֣ן גִּבּוֹרִ֔ים מָגֵ֣ן שָׁא֔וּל בְּלִ֖י מָשִׁ֥יחַ בַּ/שָּֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
translation:
  language: ml
  text: 'ഗിൽബോവ പർവതങ്ങളേ,


    നിങ്ങളുടെമേൽ മഞ്ഞുതുള്ളിയോ മഴയോ ഉണ്ടാകാതിരിക്കട്ടെ;


    വഴിപാടുകളുടെ വയലുകളും ഉണ്ടാകാതിരിക്കട്ടെ.[a]


    അവിടെയല്ലോ വീരന്മാരുടെ പരിച മലിനമാക്കപ്പെട്ടത്—


    ശൗലിന്റെ പരിച, എണ്ണ പൂശപ്പെടാത്തത്.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്. ‘സമൃദ്ധമായ വയലുകൾ,’ ‘ആദ്യഫലങ്ങളുടെ വയലുകൾ,’ അല്ലെങ്കിൽ ‘ഉയർത്തിവെക്കുന്ന വഴിപാടുകളുടെ വയലുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. תְּרוּמוֹת എന്ന പദം പലപ്പോഴും ദൈവത്തിനായി വേർതിരിച്ച വഴിപാടുകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: യുദ്ധത്തിനായി പരിച ഒരുക്കുന്നതിന്റെ ഭാഗമായി അതിൽ എണ്ണ പുരട്ടുന്ന പതിവിനെയാണ് ഈ വാക്കുകൾ സൂചിപ്പിച്ചേക്കുക. അങ്ങനെ വായിച്ചാൽ, ‘എണ്ണ പൂശപ്പെടാത്തത്’ ശൗലിനെയല്ല, അവന്റെ പരിചയെയാണ് വിശേഷിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי בַגִּלְבֹּעַ
  choice: ഗിൽബോവ പർവതങ്ങളേ
  rationale: നിർമാണരൂപത്തിലുള്ള ഈ പദസമുച്ചയം ഗിൽബോവയിലെ പർവതപ്രദേശത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നു; മലയാളത്തിലെ സംബോധനപ്രത്യയം കവിതയുടെ നേരിട്ടുള്ള വിളി വ്യക്തമാക്കുന്നു.
- source_word: אַל טַל וְאַל מָטָר עֲלֵיכֶם
  choice: നിങ്ങളുടെമേൽ മഞ്ഞോ മഴയോ ഉണ്ടാകാതിരിക്കട്ടെ
  rationale: אַל ഇവിടെ ശാപസദൃശമായ ആശംസയെ സൂചിപ്പിക്കുന്നു. ‘ഉണ്ടാകാതിരിക്കട്ടെ’ ആ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘നിങ്ങളുടെമേൽ’ പർവതങ്ങളോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: וּשְׂדֵי תְרוּמוֹת
  choice: വഴിപാടുകളുടെ വയലുകളും
  rationale: ഈ എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്. תְרוּמוֹת സാധാരണയായി ദൈവത്തിനായി വേർതിരിച്ച വഴിപാടുകളെയോ സംഭാവനകളെയോ സൂചിപ്പിക്കുന്നതിനാൽ വ്യാഖ്യാനിച്ച് മിനുക്കാതെ അതിന്റെ ആരാധനാസംബന്ധമായ അർത്ഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּי שָׁם
  choice: അവിടെയല്ലോ
  rationale: പർവതങ്ങൾക്കു മേലുള്ള ശാപസദൃശമായ ആശംസയുടെ കാരണം അവതരിപ്പിക്കുകയും വിലാപത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: נִגְעַל
  choice: മലിനമാക്കപ്പെട്ടത്
  rationale: Niphal രൂപം മലിനമാക്കപ്പെടുക, അശുദ്ധമാക്കപ്പെടുക, അപമാനിതമാകുക എന്നീ അർത്ഥങ്ങൾ വഹിക്കുന്നു. യുദ്ധഭൂമിയിൽ വീണ പരിചയുടെ അപമാനകരമായ അവസ്ഥയെ ‘മലിനമാക്കപ്പെട്ടത്’ വ്യക്തമായി പകർന്നുനൽകുന്നു.
- source_word: מָגֵן גִּבּוֹרִים
  choice: വീരന്മാരുടെ പരിച
  rationale: גִּבּוֹרִים ശക്തരായ യോദ്ധാക്കളെ സൂചിപ്പിക്കുന്നു. ‘വീരന്മാർ’ വിലാപകാവ്യത്തിന് യോജിച്ച, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദമാണ്.
- source_word: מָגֵן שָׁאוּל
  choice: ശൗലിന്റെ പരിച
  rationale: ആദ്യം പൊതുവായി ‘വീരന്മാരുടെ പരിച’ എന്നും തുടർന്ന് പ്രത്യേകമായി ‘ശൗലിന്റെ പരിച’ എന്നും പറയുന്ന എബ്രായ കാവ്യപരമായ ആവർത്തനം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  choice: എണ്ണ പൂശപ്പെടാതെ കിടന്നത്
  rationale: מָשִׁיחַ ഇവിടെ എണ്ണ പുരട്ടുക എന്ന സാധാരണ ക്രിയാഭാവത്തിലാണ്. ‘കിടന്നത്’ യുദ്ധഭൂമിയിൽ മലിനമായി കിടക്കുന്ന പരിചയോടാണ് ഈ വിശേഷണം ചേരുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; എങ്കിലും എണ്ണ പൂശലിന്റെ സാംസ്കാരിക പശ്ചാത്തലം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
theological_decisions:
- issue: מָשִׁיחַ എന്ന പദത്തെ ‘അഭിഷിക്തൻ’ എന്ന ദൈവശാസ്ത്രപരമായ സ്ഥാനപ്പേരായി തെറ്റിദ്ധരിക്കാനുള്ള സാധ്യത
  choice: ‘എണ്ണ പൂശപ്പെടാതെ’ എന്ന് പരിചയുടെ അവസ്ഥയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘എണ്ണയാൽ അഭിഷിക്തനായ ശൗലിന്റെ പരിച’ അല്ലെങ്കിൽ ‘അഭിഷിക്തന്റേതല്ലാത്ത പരിച’ എന്ന് ശൗലിനോടു ബന്ധിപ്പിച്ചു വായിക്കുക.
  rationale: בַּשָּׁמֶן (‘എണ്ണകൊണ്ട്’) എന്ന തുടർന്നുള്ള പ്രയോഗവും യുദ്ധപരിചയുടെ അവസ്ഥയെക്കുറിച്ചുള്ള സന്ദർഭവും പരിചയിൽ എണ്ണ പൂശുന്നതാണ് ഉദ്ദേശ്യമെന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. അതിനാൽ പാഠത്തിൽ ഇല്ലാത്ത മിശിഹാസംബന്ധമോ രാജാഭിഷേകസംബന്ധമോ ആയ അവകാശവാദം ചേർക്കുന്നില്ല; വ്യാകരണപരമായ ബന്ധത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള വിലാപകാവ്യശൈലി സ്വീകരിച്ചു. സംബോധനവും വരികളുടെ സമാന്തരഘടനയും ആവർത്തനവും നിലനിർത്തി. ദുഷ്കരമായ ആരാധനാസംബന്ധ പദസമുച്ചയം അമിതമായി വ്യാഖ്യാനിക്കാതെ മുഖ്യവാചകത്തിൽ സൂക്ഷിക്കുകയും പ്രധാന പര്യായങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
