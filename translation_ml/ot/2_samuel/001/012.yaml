id: 2SA.1.12
reference: 2 Samuel 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּסְפְּדוּ֙ וַ/יִּבְכּ֔וּ וַ/יָּצֻ֖מוּ עַד הָ/עָ֑רֶב עַל שָׁא֞וּל וְ/עַל יְהוֹנָתָ֣ן בְּנ֗/וֹ וְ/עַל עַ֤ם יְהוָה֙ וְ/עַל בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֥י נָפְל֖וּ בֶּ/חָֽרֶב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
translation:
  language: ml
  text: അവർ ശൗലിനെയും അവന്റെ മകനായ യോനാഥാനെയും[a] യാഹ്‌വേയുടെ ജനത്തെയും ഇസ്രായേൽഗൃഹത്തെയും[b] ഓർത്തു വിലപിക്കുകയും കരയുകയും സന്ധ്യവരെ ഉപവസിക്കുകയും ചെയ്തു; കാരണം, അവർ വാളാൽ വീണുപോയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘അവന്റെ’ എന്നത് ശൗലിനെ സൂചിപ്പിക്കുന്നു; എബ്രായത്തിൽ അക്ഷരാർഥം: ‘യോനാഥാൻ, അവന്റെ മകൻ.’'
    reason: ബന്ധസൂചന വ്യക്തമാക്കൽ
  - marker: b
    text: ‘ഇസ്രായേൽഗൃഹം’ എന്നത് ഇസ്രായേൽജനതയെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: എബ്രായ ശൈലീപ്രയോഗത്തിന്റെ വിശദീകരണം
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  choice: വിലപിക്കുകയും
  rationale: ספד മരിച്ചവരെച്ചൊല്ലിയുള്ള ഔപചാരികമായ ദുഃഖാചരണത്തെയും വിലാപത്തെയും സൂചിപ്പിക്കുന്നു. ‘വിലപിക്കുക’ ഈ അർഥം സ്വാഭാവികമായി നൽകുകയും തുടർന്നുള്ള ‘കരയുക’ എന്ന ക്രിയയിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּבְכּוּ
  choice: കരയുകയും
  rationale: בכה എന്നത് നേരിട്ട് ‘കരയുക’ എന്നാണ്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: וַיָּצֻמוּ
  choice: ഉപവസിക്കുകയും
  rationale: צום ഭക്ഷണം വർജിച്ച് ഉപവസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായക്രിയയാണ്.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: ദുഃഖാചരണത്തിന്റെ കാലപരിധി സ്വാഭാവികമായ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: עַל
  choice: ഓർത്തു
  rationale: ആവർത്തിക്കുന്ന עַל ഇവിടെ ആരെച്ചൊല്ലിയാണ് ദുഃഖിച്ചതെന്ന് കാണിക്കുന്നു. മലയാളത്തിൽ പട്ടികയ്ക്കു ശേഷം ഒരിക്കൽ വരുന്ന ‘ഓർത്തു’ സ്വാഭാവികമാണ്; ‘വേണ്ടി’ എന്നത് ലക്ഷ്യാർഥമായി തെറ്റിദ്ധരിക്കപ്പെടാം.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: അവന്റെ മകനായ യോനാഥാൻ
  rationale: എബ്രായത്തിലെ അനുബന്ധപ്രയോഗം യോനാഥാനെ ശൗലിന്റെ മകനായി തിരിച്ചറിയിക്കുന്നു. മലയാളവാക്യക്രമത്തിൽ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עַם יְהוָה
  choice: യഹോവയുടെ ജനം
  rationale: ഉടമസ്ഥബന്ധവും ഉടമ്പടിജനമെന്ന കൂട്ടായ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹം
  rationale: ഈ സ്ഥിരമായ കൂട്ടായ അഭിധാനം ‘ഇസ്രായേൽ’ എന്നു മാത്രം ലഘൂകരിക്കാതെ അതിലെ ‘ഗൃഹം’ എന്ന രൂപകവും സമൂഹാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപറഞ്ഞ ദുഃഖാചരണത്തിന്റെ കാരണം വ്യക്തമാക്കുന്ന ബന്ധപദമായി പ്രവർത്തിക്കുന്നു.
- source_word: נָפְלוּ
  choice: വീണുപോയിരുന്നു
  rationale: נפל എന്ന ‘വീഴുക’ എന്ന യുദ്ധമരണപ്രയോഗം നിലനിർത്തുന്നു; വിലാപത്തിനു മുമ്പേ സംഭവിച്ച മരണത്തെ മലയാളത്തിലെ പൂർവകാലരൂപം വ്യക്തമാക്കുന്നു.
- source_word: בֶּחָרֶב
  choice: വാളാൽ
  rationale: യുദ്ധത്തിലെ ഹിംസാത്മകമരണത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ വാൾ-ദൃശ്യം പരാവർത്തനം ചെയ്യാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുവായ ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ പ്രത്യേക നാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ നാമത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്ത് വ്യക്തിനാമസ്വഭാവം സംരക്ഷിക്കുന്നു.
- issue: עַם יְהוָה എന്ന പ്രയോഗത്തിലെ കൂട്ടായ ഉടമ്പടിബന്ധം
  choice: യഹോവയുടെ ജനം
  alternative: കർത്താവിന്റെ ജനം
  rationale: ‘ജനം’ എന്ന കൂട്ടായ അർഥവും ദൈവനാമവുമായുള്ള ഉടമസ്ഥ/ബന്ധസൂചനയും ഒരുപോലെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വിലപിക്കുക/കരയുക’ എന്ന ക്രിയാജോടി മൂലപാഠത്തിലെ വ്യത്യസ്ത ദുഃഖപ്രകടനങ്ങൾ നിലനിർത്തുന്നു; ‘വാളാൽ വീണുപോയിരുന്നു’ എന്നത് യുദ്ധമരണത്തിന്റെ മൂലദൃശ്യം സംരക്ഷിക്കുന്നു.
