  text: וַ/יֹּ֜אמֶר הַ/נַּ֣עַר הַ/מַּגִּ֣יד ל֗/וֹ נִקְרֹ֤א נִקְרֵ֨יתִי֙ בְּ/הַ֣ר הַ/גִּלְבֹּ֔עַ וְ/הִנֵּ֥ה שָׁא֖וּל נִשְׁעָ֣ן עַל חֲנִית֑/וֹ וְ/הִנֵּ֥ה הָ/רֶ֛כֶב וּ/בַעֲלֵ֥י הַ/פָּרָשִׁ֖ים הִדְבִּקֻֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
translation:
  language: ml
  text: 'വിവരം അറിയിച്ച ആ യുവാവ് ദാവീദിനോടു പറഞ്ഞു: “ഞാൻ യാദൃച്ഛികമായി ഗിൽബോവ പർവതത്തിൽ ഉണ്ടായിരുന്നു.[a] ഇതാ, ശൗൽ തന്റെ കുന്തത്തിന്മേൽ ചാരിനിൽക്കുകയായിരുന്നു; ഇതാ, രഥങ്ങളും കുതിരപ്പടയാളികളും[b] അദ്ദേഹത്തിന്മേൽ അടുക്കിക്കൊണ്ടിരുന്നു.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞാൻ യാദൃച്ഛികമായി ഗിൽബോവ പർവതത്തിൽ ഉണ്ടാകാനിടയായി.” ഹീബ്രു പ്രയോഗം അവിടെ ഉണ്ടായിരുന്നത് തികച്ചും ആകസ്മികമായിരുന്നുവെന്ന ആശയം ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “രഥസേനയും കുതിരസവാരിക്കാരും” അല്ലെങ്കിൽ “രഥങ്ങളും കുതിരസേനയും.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “അദ്ദേഹത്തെ മറികടന്നിരുന്നു” / “അദ്ദേഹത്തിന്റെ പിന്നാലെ ശക്തമായി സമ്മർദം ചെലുത്തിക്കൊണ്ടിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: ആ യുവാവ്
  rationale: നַעַר ഇവിടെ അമാലേക്യനായ സന്ദേശവാഹകനെ സൂചിപ്പിക്കുന്നു; ‘യുവാവ്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും പദവിയോ സേവകസ്ഥാനമോ അനാവശ്യമായി സൂചിപ്പിക്കാത്തതുമാണ്.
- source_word: הַמַּגִּיד לוֹ
  choice: വിവരം അറിയിച്ച ... അവനോടു
  rationale: נגד എന്ന ക്രിയയുടെ പങ്കാളിത്തരൂപം ദാവീദിനോടു വിവരം അറിയിക്കുന്ന യുവാവിനെ വിശേഷിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യമായി നൽകി.
- source_word: נִקְרֹא נִקְרֵיתִי
  choice: യാദൃച്ഛികമായി ... എത്തിപ്പെട്ടു
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന ഈ പ്രയോഗം സംഭവത്തിന്റെ ആകസ്മികത ഊന്നിപ്പറയുന്നു; ‘എത്തിപ്പെട്ടു’ സ്ഥലത്തെത്തിയതും യാദൃച്ഛികതയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: ഗിൽബോവ പർവതത്തിൽ
  rationale: പേരുള്ള പർവതത്തെ സൂചിപ്പിക്കുന്ന הַר എന്ന പദത്തിന് വ്യക്തവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ഭൂമിശാസ്ത്രപരമായ പരിഭാഷ.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: הִנֵּה ദൃശ്യത്തിലേക്ക് സജീവമായി ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഖ്യാനചിഹ്നമാണ്; ‘ഇതാ’ അതിന്റെ ദൃശ്യതയും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: נִשְׁעָן עַל חֲנִיתוֹ
  choice: തന്റെ കുന്തത്തിന്മേൽ ചാരിനിൽക്കുന്നു
  rationale: שען എന്നതിന്റെ നിഫാൽ രൂപം ശരീരഭാരം നൽകി ആശ്രയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ചാരിനിൽക്കുന്നു’ ദൃശ്യത്തെ വ്യക്തമായി പകരുന്നു.
- source_word: הָרֶכֶב
  choice: രഥങ്ങൾ
  rationale: רֶכֶב കൂട്ടായ സൈനികഘടകമായ രഥസേനയെയും രഥങ്ങളെയും സൂചിപ്പിക്കാം; മുഖ്യവാചകത്തിൽ ലളിതവും ദൃശ്യവുമായ ‘രഥങ്ങൾ’ സ്വീകരിച്ചു.
- source_word: בַעֲלֵי הַפָּרָשִׁים
  choice: കുതിരപ്പടയാളികൾ
  rationale: അക്ഷരാർഥത്തിൽ കുതിരകളുടെ ഉടമകൾ/നിയന്ത്രകർ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ കുതിരപ്പുറത്തു പോരാടുന്നവരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തമായ സൈനികസന്ദർഭം നൽകുന്നു.
- source_word: הִדְבִּקֻהוּ
  choice: പിന്തുടർന്ന് തൊട്ടടുത്തെത്തിയിരുന്നു
  rationale: דבק എന്നതിന്റെ ഹിഫീൽ രൂപത്തിന് പിന്തുടർന്ന് അടുത്തെത്തുക, പിടികൂടുക, മറികടക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്; പൂർത്തിയായ പിടികൂടൽ നിർബന്ധമാക്കാതെ കടുത്ത പിന്തുടർച്ചയും സമീപ്യവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ചുള്ള הִנֵּה മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ഒരിക്കൽ വ്യക്തമായി ‘ഇതാ’ എന്നു നൽകി; രണ്ടാമത്തേതിന്റെ ദൃശ്യാവതരണശക്തി അർധവിരാമത്തിലൂടെയും നേരിട്ടുള്ള വിവരണത്തിലൂടെയും നിലനിർത്തി. ആദരസൂചകമായ ‘അദ്ദേഹത്തെ’ സന്ദർഭത്തിൽ ശൗലിനെ വ്യക്തമായി തിരിച്ചറിയാൻ ഉപയോഗിച്ചു.
