id: 2SA.1.8
reference: 2 Samuel 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לִ֖/י מִי אָ֑תָּה ו/יאמר אֵלָ֔י/ו עֲמָלֵקִ֖י אָנֹֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/008.yaml
  text: He said to me[a], ‘Who are you?’ And I said to him, ‘I am an Amalekite.’
translation:
  language: ml
  text: അവൻ എന്നോട്[a], “നീ ആരാണ്?” എന്നു ചോദിച്ചു. ഞാൻ അവനോട്, “ഞാൻ ഒരു അമാലേക്യനാണ്” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: രണ്ടാമത്തെ വാക്യഭാഗത്തിൽ എബ്രായപാഠം പദശഃ ‘അവൻ പറഞ്ഞു’ എന്നാണ്. എന്നാൽ സന്ദർഭത്തിൽ, സംസാരിക്കുന്നയാൾ ശൗലിനോടു താൻ നൽകിയ മറുപടി വിവരിക്കുന്നതിനാൽ അർഥം ‘ഞാൻ പറഞ്ഞു’ എന്നതാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: അവൻ എന്നോട് … എന്നു ചോദിച്ചു
  rationale: പദശഃ ‘അവൻ എന്നോട് പറഞ്ഞു’ എന്നാണെങ്കിലും പിന്നാലെ നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു നൽകി; לִי എന്നത് ‘എന്നോട്’ എന്നു കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִי אַתָּה
  choice: നീ ആരാണ്?
  rationale: מִי എന്ന ചോദ്യംചെയ്യുന്ന സർവനാമവും אַתָּה എന്ന രണ്ടാംപുരുഷ ഏകവചന സർവനാമവും ചേർന്ന എബ്രായ നാമവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: ഞാൻ അവനോട് … എന്നു പറഞ്ഞു
  rationale: മസോററ്റിക് പാഠത്തിലെ ക്രിയാരൂപം പദശഃ ‘അവൻ പറഞ്ഞു’ എന്നാണ്; എന്നാൽ אֵלָיו (‘അവനോട്’) എന്നതും സംഭാഷണസന്ദർഭവും അമാലേക്യൻ ശൗലിനോടു സ്വന്തം മറുപടി വിവരിക്കുകയാണെന്ന് വ്യക്തമാക്കുന്നു. അതിനാൽ സന്ദർഭാർഥം മുഖ്യപാഠത്തിൽ നൽകി, രൂപഭേദം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: עֲמָלֵקִי אָנֹכִי
  choice: ഞാൻ ഒരു അമാലേക്യനാണ്
  rationale: ജാതി/ജനവിഭാഗപരമായ തിരിച്ചറിയൽ സൂചിപ്പിക്കുന്ന עֲמָלֵקִי എന്ന പദത്തിന് ‘അമാലേക്യൻ’ എന്നും, ഊന്നിയ സ്വയംതിരിച്ചറിയലായ אָנֹכִיയ്ക്ക് ‘ഞാൻ … ആണ്’ എന്നും സ്വാഭാവികമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമാക്കാൻ ആദ്യത്തെ ‘പറഞ്ഞു’ എന്ന ക്രിയ ചോദ്യസന്ദർഭത്തിന് യോജിച്ച ‘ചോദിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി. പാഠത്തിലെ വ്യാകരണപരമായ സംഘർഷം മായ്ച്ചുകളയാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
