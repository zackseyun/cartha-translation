id: 2SA.1.3
reference: 2 Samuel 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ דָּוִ֔ד אֵ֥י מִ/זֶּ֖ה תָּב֑וֹא וַ/יֹּ֣אמֶר אֵלָ֔י/ו מִ/מַּחֲנֵ֥ה יִשְׂרָאֵ֖ל נִמְלָֽטְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/003.yaml
  text: David said to him[a], “Where have you come from?” He said to him, “I have escaped from the camp of Israel.”
translation:
  language: ml
  text: 'ദാവീദ് അവനോട് ചോദിച്ചു: “നീ എവിടെനിന്നാണ് വരുന്നത്?” അവൻ മറുപടി പറഞ്ഞു: “ഞാൻ യിസ്രായേലിന്റെ പാളയത്തിൽനിന്ന് രക്ഷപ്പെട്ടതാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי מִזֶּה
  choice: എവിടെനിന്ന്
  rationale: ഈ പ്രയോഗം വന്ന സ്ഥലമോ ഉറവിടമോ ചോദിക്കുന്നു. ‘എവിടെനിന്ന്’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തിന്റെ അർഥം കൃത്യമായി നൽകുന്നതുമാണ്.
- source_word: תָּבוֹא
  choice: വരുന്നത്
  rationale: രൂപത്തിൽ അപൂർണ്ണകാല ക്രിയയായിരുന്നാലും, സന്ദർഭത്തിൽ അടുത്തിടെ പൂർത്തിയായ യാത്രയുടെ ഉറവിടം ചോദിക്കുന്ന പ്രയോഗമാണിത്. ‘നീ എവിടെനിന്നാണ് വരുന്നത്?’ എന്ന മലയാളചോദ്യം സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ പാളയത്തിൽനിന്ന്
  rationale: מַחֲנֶה സൈനിക പാളയത്തെ സൂചിപ്പിക്കുന്നു; ഈ പരിഭാഷ എബ്രായ ഘടനയും സൈനിക സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: נִמְלָטְתִּי
  choice: രക്ഷപ്പെട്ടുവന്നതാണ്
  rationale: מלט എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം അപകടത്തിൽനിന്നുള്ള വിജയകരമായ രക്ഷപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ യാത്രയും ഇപ്പോഴത്തെ എത്തിച്ചേരലും സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘രക്ഷപ്പെട്ടുവന്നതാണ്’ എന്നു നൽകി.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: ചോദിച്ചു ... മറുപടി പറഞ്ഞു
  rationale: മൂലത്തിൽ രണ്ടിടത്തും പൊതുവായ ‘പറഞ്ഞു’ എന്ന ക്രിയയാണെങ്കിലും, ആദ്യവാക്യം ചോദ്യവും രണ്ടാമത്തേത് അതിന്റെ മറുപടിയുമാകുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക സംഭാഷണശൈലി സ്വീകരിച്ചു; ഉള്ളടക്കത്തിൽ വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ വരുത്തുന്നില്ല.
- source_word: דָּוִד
  choice: ദാവീദ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ വ്യാപകമായി പരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സൈനികസന്ദർഭത്തിന് ‘പാളയം’ നിലനിർത്തി. സാധാരണ വായനക്കാർക്ക് കൃത്രിമമായി തോന്നാവുന്ന പദാനുപദ ആവർത്തനത്തിനുപകരം സംഭാഷണത്തിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുന്ന ‘ചോദിച്ചു ... മറുപടി പറഞ്ഞു’ എന്ന രൂപം ഉപയോഗിച്ചു.
