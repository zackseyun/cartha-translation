  source_fidelity: 'The lexical choices broadly reflect the Hebrew: the vocative “Daughters of Israel,” lament over Saul, scarlet, luxurious adornment, and gold ornaments placed on clothing are all retained. However, the two Hebrew participles refer back to Saul and need to be syntactically connected to “Saul” in Malayalam.'
