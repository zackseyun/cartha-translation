source:
  edition: WLC
  text: בְּנוֹת֙ יִשְׂרָאֵ֔ל אֶל שָׁא֖וּל בְּכֶ֑ינָה הַ/מַּלְבִּֽשְׁ/כֶ֤ם שָׁנִי֙ עִם עֲדָנִ֔ים הַֽ/מַּעֲלֶה֙ עֲדִ֣י זָהָ֔ב עַ֖ל לְבוּשְׁ/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/024.yaml
  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
translation:
  language: ml
  text: 'ഇസ്രായേൽ പുത്രിമാരേ,

    ആഡംബരങ്ങളോടുകൂടെ[a] കടുംചുവപ്പുവസ്ത്രം നിങ്ങളെ ധരിപ്പിക്കുകയും,

    നിങ്ങളുടെ വസ്ത്രത്തിന്മേൽ പൊന്നാഭരണങ്ങൾ[b] അണിയിക്കുകയും ചെയ്ത ശൗലിനെച്ചൊല്ലി വിലപിക്കുവിൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സുഖവസ്തുക്കളോടുകൂടെ,” “മോടിയോടുകൂടെ,” അല്ലെങ്കിൽ “അലങ്കാരങ്ങളോടുകൂടെ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “പൊന്നുകൊണ്ടുള്ള ആഭരണങ്ങൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: ഇസ്രായേൽ പുത്രിമാരേ
  rationale: നേരിട്ടുള്ള സംബോധനയും എബ്രായ കവിതയിലെ കുടുംബരൂപകവും നിലനിർത്തുന്നു; ‘ഇസ്രായേൽ സ്ത്രീകളേ’ എന്നതിനെക്കാൾ മൂലരൂപത്തോട് അടുത്തതാണ്.
- source_word: אֶל שָׁאוּל בְּכֶינָה
  choice: ശൗലിനെച്ചൊല്ലി കരയുവിൻ
  rationale: വിലാപത്തിന്റെ വിഷയത്തെ אֶל സൂചിപ്പിക്കുന്നു. ‘കരയുവിൻ’ സ്ത്രീലിംഗ ബഹുവചന ആഹ്വാനത്തിന്റെ വിലാപഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായി നൽകുന്നു.
- source_word: הַמַּלְבִּשְׁכֶם
  choice: നിങ്ങളെ ... വസ്ത്രം ധരിപ്പിച്ചവനെ
  rationale: നിശ്ചയാർഥക ഉപസർഗത്തോടുകൂടിയ പങ്കാളിത്തക്രിയാരൂപം ശൗലിനെ സൂചിപ്പിക്കുന്ന വിശേഷണവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: שָׁנִי
  choice: കടുംചുവപ്പു വസ്ത്രം
  rationale: നിറത്തെയും ആ നിറത്തിൽ ചായംപിടിപ്പിച്ച വിലയേറിയ വസ്ത്രത്തെയും സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: עִם עֲדָנִים
  choice: ആഡംബരങ്ങളോടുകൂടെ
  rationale: സുഖവസ്തുക്കൾ, മോടി, അലങ്കാരം എന്നീ അർഥസാധ്യതകളുള്ള അപൂർവപ്രയോഗത്തിന്റെ പൊതുവായ സമൃദ്ധിഭാവം നിലനിർത്തുന്നു; പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הַמַּעֲלֶה
  choice: അണിയിച്ചവനെ
  rationale: ഇവിടെ ‘മേൽ വെക്കുക’ എന്ന സന്ദർഭാർഥം ആഭരണങ്ങളോടു ചേർന്ന് സ്വാഭാവികമായ മലയാളത്തിൽ ‘അണിയിക്കുക’ എന്നു നൽകി.
- source_word: עֲדִי זָהָב
  choice: പൊന്നാഭരണങ്ങൾ
  rationale: പൊന്നുകൊണ്ടുള്ള അലങ്കാരവസ്തുക്കൾ എന്ന നിർമാണബന്ധം സംക്ഷിപ്തവും കവിതാത്മകവുമായി പകർന്നു.
- source_word: עַל לְבוּשְׁכֶן
  choice: നിങ്ങളുടെ വസ്ത്രത്തിന്മേൽ
  rationale: മൂലത്തിലെ ‘മേൽ’ എന്ന സ്ഥലബന്ധവും ‘വസ്ത്രം’ എന്ന ഏകവചന സമാഹാരപ്രയോഗവും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വിലാപഗീതത്തിന് യോജിച്ച ഗൗരവമുള്ള കവിതാശൈലി സ്വീകരിച്ചു. ‘കരയുവിൻ’ എന്ന രൂപം സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ ബഹുവചന ആഹ്വാനത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു. മൂലത്തിലെ വരിസമാന്തരത്വം മൂന്ന് വരികളായി സൂക്ഷിച്ചു.
