translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ദുഃഖാചാരമെന്ന ആശയം വാക്യത്തിലേക്ക് വിശദീകരണമായി ചേർക്കാതെ, വസ്ത്രം പിടിച്ചുകീറുന്ന പ്രവൃത്തി മാത്രമാണ് മൂലപാഠംപോലെ അവതരിപ്പിച്ചത്.
