source:
  edition: WLC
  text: וַ/יַּחֲזֵ֥ק דָּוִ֛ד ב/בגד/ו וַ/יִּקְרָעֵ֑/ם וְ/גַ֥ם כָּל הָ/אֲנָשִׁ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/011.yaml
  text: Then David took hold of his clothes and tore them[a], and so did all the men who were with him.
translation:
  language: ml
  text: അപ്പോൾ ദാവീദ് തന്റെ വസ്ത്രങ്ങൾ പിടിച്ചുകീറി[a]; അവനോടുകൂടെ ഉണ്ടായിരുന്ന എല്ലാ പുരുഷന്മാരും അങ്ങനെതന്നെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘തന്റെ വസ്ത്രം’ എന്നു ഏകവചനമാണുള്ളത്; എന്നാൽ ‘കീറി’ എന്ന ക്രിയയോടു ചേർന്നിരിക്കുന്ന കർമപ്രത്യയം ബഹുവചനമാണ്.
    reason: textual_grammar
lexical_decisions:
- source_word: וַיַּחֲזֵק
  choice: പിടിച്ചുകീറി
  rationale: חזק എന്ന ക്രിയ വസ്ത്രം കീറുന്നതിനുമുമ്പ് അതിൽ പിടിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വസ്ത്രം പിടിച്ചുകീറി’ എന്നു ചേർത്തുപറയുന്നത് ആ ശാരീരിക പ്രവൃത്തി സ്വാഭാവികമായും സംക്ഷിപ്തമായും നിലനിർത്തുന്നു.
- source_word: בבגדו
  choice: തന്റെ വസ്ത്രം
  rationale: എബ്രായപദം ഏകവചനമായതിനാൽ ‘വസ്ത്രം’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘തന്റെ’ എന്നത് ദാവീദിനെയാണ് ഉടമസ്ഥസർവനാമം സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְרָעֵם
  choice: കീറി
  rationale: קרע എന്നത് വസ്ത്രം കീറുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ ക്രിയയാണ്. എബ്രായത്തിലെ പ്രത്യയം രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും മുൻപുള്ള ‘വസ്ത്രം’ ഏകവചനമായതിനാൽ മലയാളത്തിൽ അസ്വാഭാവികമായ പൊരുത്തക്കേട് സൃഷ്ടിക്കാതെ ക്രിയ ഉപയോഗിച്ചു; പാഠരൂപത്തിലെ ഈ വ്യത്യാസം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: וְגַם
  choice: അങ്ങനെതന്നെ ചെയ്തു
  rationale: ദാവീദിന്റെ പ്രവൃത്തി കൂടെയുണ്ടായിരുന്ന പുരുഷന്മാരിലേക്കും വ്യാപിപ്പിക്കുന്ന എബ്രായത്തിലെ സംക്ഷിപ്തപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പൂരിപ്പിക്കുന്നു.
- source_word: כָּל הָאֲנָשִׁים
  choice: പുരുഷന്മാരെല്ലാവരും
  rationale: האנשים ഇവിടെ പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗസൂചന കൃത്യമായി നിലനിർത്തി.
- source_word: אֲשֶׁר אִתּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന
  rationale: ദാവീദിനോടൊപ്പം ഉണ്ടായിരുന്നവരെ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തി.
