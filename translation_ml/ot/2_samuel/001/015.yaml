reference: 2 Samuel 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א דָוִ֗ד לְ/אַחַד֙ מֵֽ/הַ/נְּעָרִ֔ים וַ/יֹּ֖אמֶר גַּ֣שׁ פְּגַע בּ֑/וֹ וַ/יַּכֵּ֖/הוּ וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/015.yaml
  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് യുവാക്കളിൽ ഒരാളെ വിളിച്ച് അവനോടു പറഞ്ഞു: “അടുത്തുചെന്ന് അവനെ പ്രഹരിക്കുക[a].” അവൻ അവനെ പ്രഹരിച്ചു; അവൻ മരിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവനെ ആക്രമിക്കുക” അല്ലെങ്കിൽ “അവന്റെമേൽ ചാടിവീഴുക” എന്നും പരിഭാഷപ്പെടുത്താം. פְּגַע בּוֹ എന്ന എബ്രായ പ്രയോഗത്തിന് പൊതുവേ അക്രമാസക്തമായി ആക്രമിക്കുക എന്ന അർഥം വരാം; ഇവിടെ അതിന്റെ ഫലം മരണമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ച്
  rationale: കרא എന്ന ക്രിയ ഇവിടെ ഒരാളെ അടുത്തേക്ക് വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആഖ്യാനശൈലിയിൽ ‘വിളിച്ച്’ സ്വാഭാവികവും നേരിട്ടതുമാണ്.
- source_word: לְאַחַד מֵהַנְּעָרִים
  choice: യുവാക്കളിൽ ഒരാളെ
  rationale: נְעָרִים എന്നത് സന്ദർഭമനുസരിച്ച് യുവാക്കൾ, സേവകർ, പരിചാരകർ എന്നിവരെ സൂചിപ്പിക്കാം. ഇവിടെ പദത്തിന്റെ പ്രായ/പദവി സംബന്ധമായ അടിസ്ഥാന അർത്ഥം നിലനിർത്താൻ ‘യുവാക്കൾ’ സ്വീകരിച്ചു.
- source_word: גַּשׁ
  choice: അടുത്തുവന്ന്
  rationale: נגשׁ എന്ന ആജ്ഞാരൂപത്തിന് ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്നാണ് അർത്ഥം. തുടർന്നുള്ള ആജ്ഞയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘അടുത്തുവന്ന്’ എന്നു നൽകി.
- source_word: פְּגַע בּוֹ
  choice: അവനെ വെട്ടിവീഴ്ത്തുക
  rationale: פגע ב എന്ന പ്രയോഗം ആക്രമിക്കുക, പ്രഹരിക്കുക, ഒരാളുടെമേൽ ചാടിവീഴുക എന്നീ അർത്ഥങ്ങൾ നൽകാം. സന്ദർഭത്തിൽ മാരകമായ ഉദ്ദേശ്യം വ്യക്തമാണ്; എങ്കിലും മൂലപദം നേരിട്ട് ‘കൊല്ലുക’ എന്ന സാധാരണ ക്രിയയല്ല. അതിനാൽ അക്രമവും ഉദ്ദേശിച്ച ഫലവും സൂചിപ്പിക്കുന്ന ‘വെട്ടിവീഴ്ത്തുക’ തെരഞ്ഞെടുത്തു.
- source_word: וַיַּכֵּהוּ
  choice: അവൻ അവനെ വെട്ടി
  rationale: נכה എന്നത് സാധാരണയായി അടിക്കുക/പ്രഹരിക്കുക എന്ന ക്രിയയാണ്. അടുത്ത വാക്യഭാഗം മരണം പ്രത്യേകം പറയുന്നതിനാൽ പ്രവർത്തനവും ഫലവും ഒന്നാക്കി ‘കൊന്നു’ എന്നു വിവർത്തനം ചെയ്തില്ല.
- source_word: וַיָּמֹת
  choice: അവൻ മരിച്ചു
  rationale: מות എന്നത് ‘മരിക്കുക’ എന്ന സാധാരണ ക്രിയയാണ്. ഹീബ്രു ആഖ്യാനത്തിലെ തുടർച്ച നിലനിർത്തിക്കൊണ്ട് ഫലം പ്രത്യേകം പ്രസ്താവിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. മൂലത്തിലെ ഹ്രസ്വമായ ആജ്ഞയും പ്രവർത്തനം–ഫലം എന്ന ക്രമവും നിലനിർത്തി; ‘യുവാക്കൾ’ എന്നത് സാങ്കേതിക പദവിയായി വ്യാഖ്യാനിക്കാതെ തുറന്നുവച്ചു.
