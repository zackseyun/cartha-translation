    issue: “വെട്ടിവീഴ്ത്തുക” and “വെട്ടി” add an implication of cutting or slashing.
    rationale: פָּגַע בּוֹ denotes attacking/striking/falling upon, and נכה denotes striking; neither identifies a cutting implement or action. A weapon-neutral Malayalam verb better preserves source fidelity.
