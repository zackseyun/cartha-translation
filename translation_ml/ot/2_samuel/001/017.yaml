translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിലാപം ചൊല്ലി’ എന്ന പ്രയോഗം എബ്രായത്തിലെ ക്രിയ–നാമ പദാവർത്തനത്തിന്റെ അർഥം അസ്വാഭാവികമായി ആവർത്തിക്കാതെ നൽകുന്നു. തുടർന്നുവരുന്ന വിലാപത്തിലേക്കുള്ള അവതാരകവാക്യമെന്ന നിലയിൽ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
