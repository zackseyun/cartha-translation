  yaml_path: translation/ot/2_samuel/001/017.yaml
  text: Then David sang this lament over Saul and over Jonathan his son,[a]
translation:
  language: ml
  text: അപ്പോൾ ദാവീദ് ശൗലിനെയും അവന്റെ മകനായ യോനാഥാനെയുംകുറിച്ച് ഈ വിലാപം ചൊല്ലി:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാനുവാദമായി: ‘ഈ വിലാപത്താൽ വിലപിച്ചു.’ എബ്രായത്തിലെ ക്രിയയും നാമവും ഒരേ പദമൂലത്തിൽനിന്നുള്ളവയാണ്; അവ ചേർന്ന് ഔപചാരികമായ ഒരു മരണവിലാപം എടുത്തുചൊല്ലുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: വിലാപം ചൊല്ലി
  rationale: קונן എന്ന ക്രിയ ഒരു ഔപചാരിക വിലാപം എടുത്തുചൊല്ലുകയോ ഉരുവിടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വിലാപം ചൊല്ലി’ എന്നത് പ്രകടനാത്മകമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘പാടി’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: הַקִּינָה
  choice: വിലാപം
  rationale: קִינָה മരിച്ചവരെക്കുറിച്ചുള്ള ഔപചാരിക ദുഃഖകാവ്യമോ വിലാപമോ ആണ്. ‘വിലാപം’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവും സന്ദർഭോചിതവുമാണ്.
- source_word: הַזֹּאת
  choice: ഈ
  rationale: സൂചകപദം ‘വിലാപം’ എന്ന നാമത്തെ നേരിട്ട് വിശേഷിപ്പിക്കുന്നു.
- source_word: עַל
  choice: കുറിച്ച്
  rationale: ഇവിടെ עַל വിലാപത്തിന്റെ വിഷയമായ വ്യക്തികളെ അടയാളപ്പെടുത്തുന്നു. ‘കുറിച്ച്’ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു; ‘ഓർത്ത്’ എന്നു വിവർത്തനം ചെയ്താൽ മൂലത്തിൽ നേരിട്ട് പറയാത്ത ഓർമപ്പെടുത്തൽ എന്ന ഭാവം വരാം.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: בְּנוֹ
  choice: അവന്റെ മകനായ
  rationale: പ്രത്യയം ശൗലിനെ സൂചിപ്പിച്ച് യോനാഥാനെ അവന്റെ മകനായി തിരിച്ചറിയിക്കുന്നു; അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: വാവ് ചേർന്ന wayyiqtol ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ക്രമബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
