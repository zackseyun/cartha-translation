id: 2SA.1.4
reference: 2 Samuel 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֥י/ו דָּוִ֛ד מֶה הָיָ֥ה הַ/דָּבָ֖ר הַגֶּד נָ֣א לִ֑/י וַ֠/יֹּאמֶר אֲשֶׁר נָ֨ס הָ/עָ֜ם מִן הַ/מִּלְחָמָ֗ה וְ/גַם הַרְבֵּ֞ה נָפַ֤ל מִן הָ/עָם֙ וַ/יָּמֻ֔תוּ וְ/גַ֗ם שָׁא֛וּל וִ/יהוֹנָתָ֥ן בְּנ֖/וֹ מֵֽתוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
translation:
  language: ml
  text: 'ദാവീദ് അവനോട് ചോദിച്ചു: “എന്താണ് സംഭവിച്ചത്?[a] ദയവായി എന്നോടു പറയൂ.” അവൻ പറഞ്ഞു: “ജനങ്ങൾ യുദ്ധത്തിൽനിന്ന് ഓടിപ്പോയി; ജനങ്ങളിൽ അനേകർ വീണു മരിക്കുകയും ചെയ്തു.[b] ശൗലും അവന്റെ മകനായ യോനാഥാനും മരിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാര്യം എന്തായിരുന്നു?” അക്ഷരാർഥത്തിൽ, “ആ കാര്യം എന്തായിരുന്നു?”
    reason: lexical_alternative
  - marker: b
    text: യുദ്ധസന്ദർഭത്തിൽ ‘വീണു’ എന്നത് വെട്ടിവീഴ്ത്തപ്പെടുകയോ കൊല്ലപ്പെടുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പ്രയോഗമാണ്; തുടർന്ന് വരുന്ന ‘മരിച്ചു’ ഫലം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  choice: എന്താണ് സംഭവിച്ചത്?
  rationale: അക്ഷരാർഥത്തിൽ ‘കാര്യം എന്തായിരുന്നു?’ എന്ന ചോദ്യമാണെങ്കിലും, സന്ദർഭത്തിൽ യുദ്ധത്തിൽ നടന്നതെന്തെന്ന് ദാവീദ് ചോദിക്കുന്നു. അതിനാൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘എന്താണ് സംഭവിച്ചത്?’ എന്നു നൽകി.
- source_word: הַגֶּד נָא לִי
  choice: ദയവായി എന്നോടു പറയൂ
  rationale: הַגֶּד എന്ന ആജ്ഞയുടെ ‘പറയുക/അറിയിക്കുക’ എന്ന അർഥവും נָא നൽകുന്ന വിനയപൂർവമായ അഭ്യർഥനയോ അടിയന്തരതയോ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נָס הָעָם מִן הַמִּלְחָמָה
  choice: ജനങ്ങൾ യുദ്ധത്തിൽനിന്ന് ഓടിപ്പോയി
  rationale: נָס എന്നത് ‘ഓടിപ്പോയി’ എന്നാണ്. הָעָם ഇവിടെ സൈനികരായ ജനസമൂഹത്തെ സൂചിപ്പിക്കാമെങ്കിലും, മൂലത്തിലെ പൊതുവായ പ്രയോഗം നിലനിർത്താൻ ‘ജനങ്ങൾ’ എന്നു നൽകി.
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם וַיָּמֻתוּ
  choice: ജനങ്ങളിൽ അനേകർ വീണു മരിക്കുകയും ചെയ്തു
  rationale: യുദ്ധസന്ദർഭത്തിലെ נפל എന്ന ‘വീഴുക’ എന്ന ദൃശ്യരൂപവും തുടർന്ന് വരുന്ന ‘മരിച്ചു’ എന്ന വ്യക്തമായ ഫലവും രണ്ടും നിലനിർത്തുന്നു. മലയാളത്തിൽ ഒരേ സംഭവത്തിന്റെ തുടർച്ച സ്വാഭാവികമായി പ്രകടമാക്കാൻ ‘വീണു മരിക്കുകയും ചെയ്തു’ എന്നു ചേർത്തു.
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  choice: ശൗലും അവന്റെ മകനായ യോനാഥാനും മരിച്ചു
  rationale: ഹീബ്രു ക്രിയയുടെ ഭൂതകാല സംഭവവിവരണം നേരിട്ട് നിലനിർത്തുന്നു; בְּנוֹ എന്ന ബന്ധവും വ്യക്തമായി ഉൾപ്പെടുത്തി. גַם എന്ന ‘ഉം/കൂടി’ ഇരട്ട ‘ഉം’ ഘടനയിലൂടെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ചോദ്യം–മറുപടി ഘടനയും യുദ്ധവിവരണത്തിന്റെ ക്രമവും സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലെ [c] കുറിപ്പ് മൂലവാക്യത്തിൽ പ്രത്യേകമായൊരു പാഠഭേദമോ അർഥവികല്പമോ നൽകാത്തതിനാൽ ഉൾപ്പെടുത്തിയില്ല; എല്ലാ ഉൾപ്പെടുത്തിയ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
