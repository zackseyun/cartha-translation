source:
  edition: WLC
  text: צַר לִ֣/י עָלֶ֗י/ךָ אָחִ/י֙ יְה֣וֹנָתָ֔ן נָעַ֥מְתָּ לִּ֖/י מְאֹ֑ד נִפְלְאַ֤תָה אַהֲבָֽתְ/ךָ֙ לִ֔/י מֵ/אַהֲבַ֖ת נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
translation:
  language: ml
  text: യോനാഥാനേ, എന്റെ സഹോദരാ, നിന്നെച്ചൊല്ലി ഞാൻ അതീവ ദുഃഖിക്കുന്നു; നീ എനിക്ക് ഏറെ പ്രിയങ്കരനായിരുന്നു. എന്നോടുള്ള നിന്റെ സ്നേഹം അത്ഭുതകരമായിരുന്നു—സ്ത്രീകളുടെ സ്നേഹത്തെക്കാൾ ശ്രേഷ്ഠം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്ത്രീകളുടെ സ്നേഹത്തെ മറികടക്കുന്നതായിരുന്നു,” “സ്ത്രീകളോടുള്ള സ്നേഹത്തെക്കാൾ ശ്രേഷ്ഠമായിരുന്നു,” അല്ലെങ്കിൽ “സ്ത്രീകൾ നൽകുന്ന സ്നേഹത്തെക്കാൾ ശ്രേഷ്ഠമായിരുന്നു.” എബ്രായത്തിലെ ഈ കാവ്യാത്മക താരതമ്യം ഏത് അർഥമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് കൃത്യമായി വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  choice: നിന്നെച്ചൊല്ലി ഞാൻ അതീവ ദുഃഖിക്കുന്നു
  rationale: צַר לִי വ്യക്തിപരമായ കടുത്ത ദുഃഖം സൂചിപ്പിക്കുന്നു; עָלֶיךָ വിലാപസന്ദർഭത്തിൽ ‘നിന്നെച്ചൊല്ലി’ എന്നു സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אָחִי
  choice: എന്റെ സഹോദരാ
  rationale: മൂലത്തിലെ ബന്ധസംബോധന അതേപടി നിലനിർത്തുന്നു; സൗഹൃദത്തിന്റെ സ്വഭാവം അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാനേ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ പേരുരൂപം, ഇവിടെ സംബോധനാവിഭക്തിയിൽ.
- source_word: נָעַמְתָּ לִּי מְאֹד
  choice: നീ എനിക്ക് ഏറെ പ്രിയങ്കരനായിരുന്നു
  rationale: נעם സൂചിപ്പിക്കുന്ന ആനന്ദകരതയും മനോഹാരിതയും വ്യക്തിയോടുള്ള ബന്ധത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘സുഖകരൻ’ പോലുള്ള അസ്വാഭാവിക പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: נִפְלְאָתָה
  choice: അത്ഭുതകരമായിരുന്നു
  rationale: അസാധാരണവും വിസ്മയകരവുമായ ഗുണത്തെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: אַהֲבָתְךָ לִי
  choice: എന്നോടുള്ള നിന്റെ സ്നേഹം
  rationale: לִי എന്ന ബന്ധസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്നോടുള്ള’ എന്നു നൽകുന്നു.
- source_word: מֵאַהֲבַת נָשִׁים
  choice: സ്ത്രീകളുടെ സ്നേഹത്തെക്കാൾ ശ്രേഷ്ഠം
  rationale: מִן സൂചിപ്പിക്കുന്ന താരതമ്യം നിലനിർത്തുന്നു; ‘സ്ത്രീകളുടെ സ്നേഹം’ എന്നത് സ്ത്രീകളോടുള്ള സ്നേഹമോ സ്ത്രീകൾ നൽകുന്ന സ്നേഹമോ എന്നു നിർബന്ധമായി തീരുമാനിക്കാതെ മൂലത്തിലെ കാവ്യാത്മകമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘സ്ത്രീകളുടെ സ്നേഹം’ എന്ന താരതമ്യത്തിന്റെ കൃത്യമായ സ്വഭാവം
  choice: ആ താരതമ്യം പ്രധാനവാക്യത്തിൽ അക്ഷരാർഥത്തിന് അടുത്തായി നിലനിർത്തി, അതിനെ ലൈംഗികമോ പ്രണയപരമോ സൗഹൃദപരമോ ആയി പ്രത്യേകം നിർവചിക്കാതിരിക്കുന്നു.
  alternative: ‘സ്ത്രീകളോടുള്ള സ്നേഹത്തെക്കാൾ’ എന്നോ ‘സ്ത്രീകൾ നൽകുന്ന സ്നേഹത്തെക്കാൾ’ എന്നോ വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: מֵאַהֲבַת נָשִׁים എന്ന എബ്രായ പ്രയോഗം താരതമ്യം വ്യക്തമാക്കുന്നുവെങ്കിലും അതിന്റെ ദിശയോ ആധുനിക ബന്ധവിഭാഗമോ സ്വയം നിശ്ചയിക്കുന്നില്ല. അതിനാൽ യഥാർഥ വ്യാഖ്യാനപിരിമുറുക്ക് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും വിലാപകാവ്യത്തിന് യോജിച്ചതുമായ മലയാളം. ‘പ്രിയങ്കരൻ’ നയം എന്ന ക്രിയയുടെ ബന്ധസന്ദർഭത്തിലുള്ള സ്വാഭാവിക തുല്യപ്രയോഗമായി തെരഞ്ഞെടുത്തു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട താരതമ്യവാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
