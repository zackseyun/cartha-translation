  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶל הַ/נַּ֨עַר֙ הַ/מַּגִּ֣יד ל֔/וֹ אֵ֥י מִ/זֶּ֖ה אָ֑תָּה וַ/יֹּ֕אמֶר בֶּן אִ֛ישׁ גֵּ֥ר עֲמָלֵקִ֖י אָנֹֽכִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/013.yaml
  text: David said to the young man who told him[a], “Where are you from?” And he said, “I am the son of an Amalekite sojourner.”
translation:
  language: ml
  text: 'ദാവീദ് ദാവീദിനെ വിവരം അറിയിച്ച യുവാവിനോട് ചോദിച്ചു: “നീ എവിടെനിന്നാണ്?” അവൻ പറഞ്ഞു: “ഞാൻ അമാലേക്യനായ ഒരു പരദേശിയുടെ മകനാണ്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ദേശത്തു പാർക്കുന്ന ഒരു പരദേശിയുടെ മകനാണ്—ഒരു അമാലേക്യൻ.” എബ്രായ പ്രയോഗം പിതാവിനെ അമാലേക്യനായ പരദേശിയായി തിരിച്ചറിയുന്നതായോ, പരദേശിയായി പാർത്തിരുന്ന ഒരു അമാലേക്യന്റെ വംശജനായി സംസാരിക്കുന്നവനെ ബന്ധിപ്പ Jennings?
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: യുവാവ്
  rationale: נַעַר എന്നത് ഇവിടെ അടിമസ്ഥാനം നിർബന്ധമായി സൂചിപ്പിക്കാതെ ഒരു ചെറുപ്പക്കാരനെ കുറിക്കുന്നു; ‘യുവാവ്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הַמַּגִּיד לוֹ
  choice: തന്നെ വിവരം അറിയിച്ച
  rationale: נגד എന്ന ക്രിയയുടെ കർത്തൃവാചക രൂപം ദാവീദിന് വാർത്ത അറിയിച്ചയാളെ തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֵי מִזֶּה
  choice: നീ എവിടെനിന്നാണ്?
  rationale: ഈ എബ്രായ ചോദ്യപ്രയോഗം ഒരാളുടെ ദേശമോ ഉത്ഭവസ്ഥാനമോ ചോദിക്കുന്നു.
- source_word: בֶּן אִישׁ
  choice: ഒരു … പരദേശിയുടെ മകൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു പുരുഷന്റെ മകൻ’ എന്നാണെങ്കിലും, ഇവിടെ പിതൃബന്ധത്തിലൂടെയുള്ള കുടുംബപരമായ തിരിച്ചറിയലാണ് ഉദ്ദേശ്യം; അനാവശ്യമായ ‘പുരുഷൻ’ ഒഴിവാക്കുന്നത് സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: גֵּר
  choice: പരദേശി
  rationale: സ്വദേശിയല്ലെങ്കിലും ആ ദേശത്ത് താമസിക്കുന്ന വ്യക്തിയെയാണ് גֵּר സൂചിപ്പിക്കുന്നത്. ‘പരദേശി’ ഈ പദത്തിന്റെ വിദേശീയതയും താമസസ്ഥിതിയും മാന്യമായ ബൈബിൾ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֲמָלֵקִי
  choice: അമാലേക്യൻ
  rationale: അമാലേക്കിൽനിന്നുള്ള ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവ് മലയാള രൂപം.
- source_word: אָנֹכִי
  choice: ഞാൻ … ആണ്
  rationale: ഊന്നലോടെയുള്ള സ്വയംപരിചയപ്പെടുത്തൽ മലയാളത്തിൽ സ്വതന്ത്ര സർവനാമവും ബന്ധകക്രിയയും ഉപയോഗിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ഗֵּר എന്ന സാമൂഹിക പദത്തിന്റെ അർഥം അതിയായി ആധുനികവൽക്കരിക്കാതെ ‘പരദേശി’ എന്നു നൽകി; എബ്രായ പദക്രമത്തിലെ യഥാർഥ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
