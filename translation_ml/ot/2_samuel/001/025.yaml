  text: How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights[a].
translation:
  language: ml
  text: യുദ്ധത്തിന്റെ നടുവിൽ വീരന്മാർ എങ്ങനെ വീണുപോയി! യോനാഥാൻ, നിന്റെ മലമേടുകളിൽ[a] കൊല്ലപ്പെട്ടുകിടക്കുന്നു!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ഉയർന്ന സ്ഥലങ്ങളിൽ.” ഹീബ്രുപദത്തിന് ഉയർന്ന ഭൂപ്രദേശങ്ങളെ സൂചിപ്പിക്കാം; ഇവിടെ വിലാപത്തിൽ കാവ്യാത്മകമായി അഭിസംബോധന ചെയ്യുന്ന ദേശത്തിന്റെ മലമേടുകളായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: എങ്ങനെ
  rationale: വിവരം ചോദിക്കുന്ന ചോദ്യമായല്ല, വിലാപത്തിന്റെ ആശ്ചര്യോദ്ഗാരമായാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്; ആവർത്തിക്കുന്ന കാവ്യപ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: נָפְלוּ
  choice: വീണുപോയി
  rationale: സംഭവം പൂർത്തിയായെന്ന ഭാവവും വിലാപത്തിലെ തീവ്രതയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: גִבֹּרִים
  choice: വീരന്മാർ
  rationale: ശക്തരും പരാക്രമശാലികളുമായ പോരാളികളെ സൂചിപ്പിക്കുന്നു; സൈനികപദവി അനാവശ്യമായി നിർണ്ണയിക്കാതെ കാവ്യഭാവം കാക്കുന്നു.
- source_word: בְּתוֹךְ הַמִּלְחָמָה
  choice: യുദ്ധത്തിന്റെ നടുവിൽ
  rationale: സംഘർഷത്തിന്റെ മധ്യത്തിൽ എന്ന בְּתוֹךְ എന്ന പദത്തിന്റെ ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: עַל
  choice: -യിൽ
  rationale: സ്ഥലസൂചകമായ 'മേൽ/മുകളിൽ' എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവിക വിഭക്തിപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: בָּמוֹתֶיךָ
  choice: നിന്റെ മലമേടുകളിൽ
  rationale: ഉയർന്ന ഭൂപ്രദേശങ്ങൾ എന്ന അർഥം നൽകുകയും ആരാധനാസ്ഥലങ്ങൾ എന്ന സാങ്കേതിക അർഥം മുഖ്യവാചകത്തിൽ അനാവശ്യമായി ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു; പകരം വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: חָלָל
  choice: കൊല്ലപ്പെട്ടുകിടക്കുന്നു
