theological_decisions:
- issue: בָּמוֹתֶיךָ എന്നതിലെ രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയത്തിന്റെ സൂചിതവിഷയം
  choice: വിലാപത്തിൽ കാവ്യാത്മകമായി അഭിസംബോധന ചെയ്യപ്പെടുന്ന ദേശം/ഇസ്രായേലിന്റെ ഭൂപ്രദേശം
  alternative: യോനാഥാന്റെ സ്വന്തം മലമേടുകൾ എന്ന നേരിട്ടുള്ള അഭിസംബോധന
  rationale: സന്ദർഭത്തിൽ ഭൂപ്രദേശം വ്യക്തിവൽക്കരിച്ച് അഭിസംബോധന ചെയ്യുന്നതാണ് കൂടുതൽ യോജിച്ചത്. എങ്കിലും ഹീബ്രുവിലെ വ്യാകരണപരമായ സൂചന മുഖ്യവാചകത്തിലെ 'നിന്റെ' എന്ന രൂപത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
