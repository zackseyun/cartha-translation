id: 2SA.1.10
reference: 2 Samuel 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֶעֱמֹ֤ד עָלָי/ו֙ וַ/אֲמֹ֣תְתֵ֔/הוּ כִּ֣י יָדַ֔עְתִּי כִּ֛י לֹ֥א יִֽחְיֶ֖ה אַחֲרֵ֣י נִפְל֑/וֹ וָ/אֶקַּ֞ח הַ/נֵּ֣זֶר אֲשֶׁ֣ר עַל רֹאשׁ֗/וֹ וְ/אֶצְעָדָה֙ אֲשֶׁ֣ר עַל זְרֹע֔/וֹ וָ/אֲבִיאֵ֥/ם אֶל אֲדֹנִ֖/י הֵֽנָּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
translation:
  language: ml
  text: അങ്ങനെ ഞാൻ അവന്റെ അടുത്ത് നിന്നുകൊണ്ട് അവനെ കൊന്നു[a]. കാരണം, വീണുകഴിഞ്ഞശേഷം അവൻ ജീവനോടെ ശേഷിക്കുകയില്ലെന്ന് എനിക്ക് അറിയാമായിരുന്നു. പിന്നെ അവന്റെ തലയിലുണ്ടായിരുന്ന കിരീടവും ഭുജത്തിലുണ്ടായിരുന്ന ഭുജവളയും[b] എടുത്ത് ഇവിടെ എന്റെ യജമാനന്റെ അടുക്കൽ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് അമാലേക്യൻ ദാവീദിനോടു പറയുന്ന റിപ്പോർട്ടാണ്. ശൗലിന്റെ മരണത്തെക്കുറിച്ചുള്ള മുമ്പത്തെ വിവരണത്തിന് 1 ശമൂവേൽ 31:4–5 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
  - marker: b
    text: അഥവാ ‘കൈവള.’ എബ്രായപദം കൈയിലോ ഭുജത്തിലോ ധരിക്കുന്ന ഒരു ആഭരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  choice: ഞാൻ അവന്റെ അടുത്ത് നിന്നുകൊണ്ട്
  rationale: עמד על എന്ന പ്രയോഗം ഇവിടെ വീണുകിടക്കുന്ന ശൗലിന്റെ അടുത്ത്/മേൽ നിന്ന നിലയെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘അവന്റെ മീതെ നിന്നു’ മലയാളത്തിൽ അവന്റെ ശരീരത്തിന്മേൽ കയറി നിന്നുവെന്ന തെറ്റായ ധാരണ നൽകാം; അതിനാൽ സന്ദർഭസഹജമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: וַאֲמֹתְתֵהוּ
  choice: അവനെ കൊന്നു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ മരണത്തിനു കാരണമായി എന്നത് വ്യക്തമായി പറയുന്നു. സാധാരണ വായനക്കാർക്ക് നേരിട്ടും ഗൗരവത്തോടെയും മനസ്സിലാകുന്ന മലയാളപ്രയോഗമാണിത്.
- source_word: כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה
  choice: അവൻ ജീവനോടെ ശേഷിക്കുകയില്ലെന്ന് എനിക്ക് അറിയാമായിരുന്നു
  rationale: സംസാരിക്കുന്നവൻ നൽകുന്ന കാരണം വ്യക്തമായി നിലനിർത്തുകയും לא יחיה എന്നതിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: אַחֲרֵי נִפְלוֹ
  choice: വീണുകഴിഞ്ഞശേഷം
  rationale: נפל-ൽനിന്നുള്ള ഈ നിർവചനക്രിയാരൂപം കൊലപ്പെടുത്തലിനു മുമ്പ് പൂർത്തിയായ വീഴ്ചയെ കാലസൂചനയായി അവതരിപ്പിക്കുന്നു.
- source_word: הַנֵּזֶר
  choice: കിരീടം
  rationale: ഇവിടെ രാജാവിന്റെ ശിരോഭൂഷണമാണ് ഉദ്ദേശിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ഏറ്റവും വ്യക്തവും സാധാരണവുമായ പദം ‘കിരീടം’ ആണ്.
- source_word: וְאֶצְעָדָה
  choice: ഭുജവള
  rationale: ആഭരണം זרוע, അഥവാ ഭുജത്തിൽ ധരിച്ചിരുന്നതായി വാക്യം തന്നെ വ്യക്തമാക്കുന്നതിനാൽ കൈമണിയിലെ വളയെ സൂചിപ്പിക്കാവുന്ന ‘കൈവള’യെക്കാൾ ‘ഭുജവള’ കൃത്യമാണ്.
- source_word: זְרֹעוֹ
  choice: അവന്റെ ഭുജത്തിൽ
  rationale: זרוע സാധാരണയായി ഭുജം/കൈ എന്ന വിശാല അർഥമുള്ള പദമാണ്; ഇവിടെ ആഭരണം ധരിച്ച സ്ഥാനം സ്വാഭാവികമായി പറയാൻ ‘ഭുജം’ ഉപയോഗിച്ചു.
- source_word: וָאֲבִיאֵם ... הֵנָּה
  choice: അവ ഇവിടെ ... കൊണ്ടുവന്നു
  rationale: ഹീബ്രു കഥനക്രമത്തിലെ ഭൂതകാലം മലയാളത്തിൽ ലളിതഭൂതകാലമായി നൽകി; הֵנָּה എന്ന സ്ഥലസൂചകം ‘ഇവിടെ’ എന്നു നിലനിർത്തി.
- source_word: אֶל אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ അടുക്കൽ
  rationale: אֲדֹנִי ഇവിടെ ദൈവനാമമല്ല, ദാവീദിനോടുള്ള ആദരസൂചകമായ മനുഷ്യസംബോധനയാണ്. ‘എന്റെ യജമാനൻ’ ആ കീഴ്വഴക്കബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ മരണത്തെക്കുറിച്ചുള്ള അമാലേക്യന്റെ അവകാശവാദം
  choice: അമാലേക്യൻ താൻ ശൗലിനെ കൊന്നുവെന്ന് പറയുന്നതുപോലെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: 1 ശമൂവേൽ 31:4–5-നോട് പൊരുത്തപ്പെടുത്താൻ ഇത് പൊങ്ങച്ചമോ വ്യാജവാദമോ ആണെന്ന വ്യാഖ്യാനം വാക്യത്തിൽതന്നെ ചേർക്കുക.
  rationale: ഈ വാക്യം അമാലേക്യന്റെ നേരിട്ടുള്ള റിപ്പോർട്ടാണ്. വിശാലമായ കഥനത്തിലെ സംഘർഷം പരിഭാഷയിൽ നിശ്ശബ്ദമായി പരിഹരിക്കാതെ, സംസാരിക്കുന്നവന്റെ അവകാശവാദം അതേപടി സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി ഉപയോഗിച്ചു. രാജസഭാസംബന്ധമായ ആദരം ‘എന്റെ യജമാനൻ’ എന്നതിലൂടെ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കം തെറ്റായ മാർക്കറുകളോടു ചേർന്നതായി തോന്നിയതിനാൽ, മരണവിവരണത്തിനുശേഷം ക്രോസ്-റഫറൻസും ‘ഭുജവള’യ്ക്കുശേഷം പദവികൽപ്പവും യുക്തമായ സ്ഥാനങ്ങളിൽ ചേർത്തു.
