id: 2SA.1.14
reference: 2 Samuel 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו דָּוִ֑ד אֵ֚יךְ לֹ֣א יָרֵ֔אתָ לִ/שְׁלֹ֨חַ֙ יָֽדְ/ךָ֔ לְ/שַׁחֵ֖ת אֶת מְשִׁ֥יחַ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/014.yaml
  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് അവനോടു പറഞ്ഞു: “യാഹ്‌വേയുടെ അഭിഷിക്തനെ[b] നശിപ്പിക്കാൻ നിന്റെ കൈ നീട്ടാൻ നീ ഭയപ്പെടാതിരുന്നത് എങ്ങനെ[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “എന്തുകൊണ്ടാണ് നീ ഭയപ്പെടാതിരുന്നത്...?” എബ്രായത്തിലെ אֵיךְ എന്ന പദത്തിന്റെ അക്ഷരാർഥം “എങ്ങനെ?” എന്നാണ്; ഇവിടെ അത് ഞെട്ടലോടുകൂടിയ ശാസന പ്രകടിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: അതായത്, യാഹ്‌വേ രാജാവായി അഭിഷേകം ചെയ്ത വ്യക്തി.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തിലേക്ക് നീങ്ങുന്നു; ‘അപ്പോൾ’ ആ ക്രമബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵלָיו
  choice: അവനോട്
  rationale: അമാലേക്യ ദൂതനെ സൂചിപ്പിക്കുന്ന സർവനാമസഹിതമായ വിഭക്തിപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: אֵיךְ
  choice: എങ്ങനെ
  rationale: അക്ഷരാർഥം ‘എങ്ങനെ?’ എന്നാണ്; ഇവിടെ അതിശയവും കടുത്ത ശാസനയും പ്രകടിപ്പിക്കുന്ന ചോദ്യം. കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘എന്തുകൊണ്ട്’ എന്നതിനു പകരം മൂലഭാഷയിലെ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יָרֵאתָ
  choice: നീ ഭയപ്പെടാതിരുന്നത്
  rationale: ירא ഭയം അഥവാ ഭക്തിയോടുകൂടിയ ഭയം സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ ശാസനാത്മക ചോദ്യത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: לִשְׁלֹחַ יָדְךָ
  choice: കൈ നീട്ടാൻ
  rationale: ഒരാൾക്കെതിരെ, പ്രത്യേകിച്ച് അക്രമപരമായി, പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി. മലയാളത്തിലും മനസ്സിലാകുന്ന വിധത്തിൽ അതേ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: לְשַׁחֵת
  choice: നശിപ്പിക്കാൻ
  rationale: שׁחת എന്ന പദത്തിന്റെ വിശാലമായ ‘നശിപ്പിക്കുക/നാശം വരുത്തുക’ എന്ന അർഥപരിധി നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അത് മരണത്തിലേക്കുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: מְשִׁיחַ
  choice: അഭിഷിക്തൻ
  rationale: ഇവിടെ ശൗലിന്റെ രാജകീയ അഭിഷേകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പിൽക്കാല മശീഹാസംബന്ധമായ അർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതെ എബ്രായപദത്തിന്റെ അടിസ്ഥാന അർഥം നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ, അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റാതെ ദൈവനാമമായി നിലനിർത്തുന്നു.
- issue: ശൗലിനെക്കുറിച്ചുള്ള מְשִׁיחַ എന്ന പദം
  choice: യഹോവയുടെ അഭിഷിക്തൻ
  alternative: യഹോവയുടെ മശീഹാ
  rationale: ചരിത്രസന്ദർഭത്തിൽ ഇത് രാജാവായി അഭിഷേകം ചെയ്യപ്പെട്ട ശൗലിനെ സൂചിപ്പിക്കുന്നു; വികസിതമായ മശീഹാ പദവിയെന്ന ആശയം ഇവിടെ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- issue: אֵיךְ എന്ന ശാസനാത്മക ചോദ്യത്തിന്റെ സ്വഭാവം
  choice: എങ്ങനെ
  alternative: എന്തുകൊണ്ട്
  rationale: ‘എങ്ങനെ’ എന്നത് മൂലപദത്തിന്റെ രൂപവും ദാവീദിന്റെ ഞെട്ടലോടുകൂടിയ ശാസനയും നിലനിർത്തുന്നു; ‘എന്തുകൊണ്ട്’ സാധ്യമായ അർഥവ്യാഖ്യാനമാണെന്ന് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘കൈ നീട്ടുക’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതായതിനാൽ നിലനിർത്തി; ചോദ്യത്തിലെ ഞെട്ടലും ശാസനയും മൃദൂകരിച്ചിട്ടില്ല.
