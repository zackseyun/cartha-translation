source:
  edition: WLC
  text: שָׁא֣וּל וִ/יהוֹנָתָ֗ן הַ/נֶּאֱהָבִ֤ים וְ/הַ/נְּעִימִם֙ בְּ/חַיֵּי/הֶ֔ם וּ/בְ/מוֹתָ֖/ם לֹ֣א נִפְרָ֑דוּ מִ/נְּשָׁרִ֣ים קַ֔לּוּ מֵ/אֲרָי֖וֹת גָּבֵֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
translation:
  language: ml
  text: ജീവിതത്തിൽ പ്രിയപ്പെട്ടവരും ഹൃദ്യരുമായിരുന്ന[a] ശൗലും യോനാഥാനും മരണത്തിലും വേർപിരിഞ്ഞില്ല. അവർ കഴുകന്മാരെക്കാൾ[b] വേഗമേറിയവരും സിംഹങ്ങളെക്കാൾ ശക്തരായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഹൃദ്യർ’ എന്നതിന് ‘മനോഹരർ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വൾച്ചറുകളെക്കാൾ’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായപദം വിശാലമായി ഒരു വലിയ ഇരപിടിയൻ പക്ഷിയെ സൂചിപ്പിക്കാം. എങ്കിലും ഇവിടെ ‘കഴുകന്മാർ’ എന്നതാണ് പരമ്പരാഗതവും ഏറ്റവും സ്വാഭാവികവുമായ പരിഭാഷ.
    reason: lexical_alternative
  - marker: c
    text: ‘ശക്തർ’ എന്നതിന് ‘കരുത്തർ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: ശൗലും യോനാഥാനും
  rationale: മലയാള ബൈബിൾനാമങ്ങളുടെ പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: הַנֶּאֱהָבִים
  choice: പ്രിയപ്പെട്ടവർ
  rationale: אהב എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ/വിശേഷണാർഥം നിലനിർത്തുകയും വിലാപത്തിന്റെ ആദരപൂർണമായ ഭാവത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהַנְּעִימִם
  choice: ഹൃദ്യർ
  rationale: നൈതികഗുണമോ ദേഹസൗന്ദര്യമോ നിർബന്ധമായി സൂചിപ്പിക്കാതെ, נעימിന്റെ പ്രസാദകരതയും പ്രിയങ്കരതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בְּחַיֵּיהֶם ... וּבְמוֹתָם
  choice: ജീവിതത്തിൽ ... മരണത്തിലും
  rationale: ജീവിതവും മരണവും തമ്മിലുള്ള എബ്രായ കാവ്യസമാന്തര്യം മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לֹא נִפְרָדוּ
  choice: വേർപിരിഞ്ഞില്ല
  rationale: נפרדו സൂചിപ്പിക്കുന്ന വേർപെടാതിരിക്കൽ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִנְּשָׁרִים קַלּוּ
  choice: കഴുകന്മാരെക്കാൾ വേഗമേറിയവർ
  rationale: താരതമ്യസന്ദർഭത്തിൽ קלל വേഗത്തെ സൂചിപ്പിക്കുന്നു; נשר എന്ന വലിയ ഇരപിടിയൻ പക്ഷിക്ക് പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ തർജമയായി ‘കഴുകൻ’ സ്വീകരിക്കുന്നു.
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  choice: സിംഹങ്ങളെക്കാൾ ശക്തർ
  rationale: גבר സൂചിപ്പിക്കുന്ന ശക്തിയെയും മേൽക്കോയ്മയെയും അതിവ്യാഖ്യാനമില്ലാതെ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ശൗലിനെയും യോനാഥാനെയും കുറിച്ചുള്ള ദാവീദിന്റെ വിലാപത്തിന്റെ ഭാവം
  choice: ശൗലിന്റെ മുൻകാല പരാജയങ്ങൾ കാരണം പ്രശംസ മയപ്പെടുത്താതെയും അവരെ നിർദോഷരായ മാതൃകാപുരുഷന്മാരാക്കി ഉയർത്താതെയും, ഇരുവരെയും ചേർത്തുള്ള ആദരപൂർണമായ കാവ്യപ്രശംസ നിലനിർത്തി.
  alternative: ശൗലിന്റെ മുൻവൃത്താന്തം കണക്കിലെടുത്ത് പ്രശംസ കുറയ്ക്കുക, അല്ലെങ്കിൽ ഈ വിലാപത്തെ സമ്പൂർണ ധാർമിക അംഗീകാരമായി വായിക്കുക.
  rationale: മൂലപാഠം ശവവിലാപത്തിന്റെ ഉയർന്ന ഭാഷയിൽ ശൗലിനെയും യോനാഥാനെയും ഒരുമിച്ച് ആദരിക്കുന്നു; വിശാലമായ ആഖ്യാനത്തിലെ പിരിമുറുക്കം വിവർത്തനം സ്വമേധയാ പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ വിലാപകാവ്യത്തിന് യോജിച്ച ആദരപൂർണമായ മലയാളം. എബ്രായത്തിലെ ജീവിതം/മരണം, കഴുകൻ/സിംഹം എന്നീ സമാന്തര ഘടനകൾ സംരക്ഷിച്ചു; മലയാളത്തിന്റെ സ്വാഭാവിക പദക്രമത്തിനായി ആദ്യ രണ്ട് ഘടകങ്ങൾ ഒരൊറ്റ വാക്യമായി ക്രമപ്പെടുത്തി.
