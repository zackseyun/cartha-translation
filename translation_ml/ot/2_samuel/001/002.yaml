  text: On the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
translation:
  language: ml
  text: മൂന്നാം ദിവസം, ഇതാ, ശൗലിന്റെ അടുക്കലുള്ള പാളയത്തിൽനിന്ന് ഒരു മനുഷ്യൻ വന്നു.[a] അവന്റെ വസ്ത്രങ്ങൾ കീറിയിരുന്നു; തലയിൽ മണ്ണുമുണ്ടായിരുന്നു.[b] അവൻ ദാവീദിന്റെ അടുക്കൽ എത്തിയപ്പോൾ നിലത്തുവീണ് വണങ്ങി.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശൗലിന്റെ അടുക്കൽനിന്ന്” അല്ലെങ്കിൽ “ശൗലിന്റെ പക്ഷത്തുനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ശൗലുമായുള്ള ബന്ധമോ സഹവാസമോ സൂചിപ്പിക്കുന്നു; ശൗൽ നേരിട്ട് അയച്ചുവെന്ന് നിർബന്ധമായും അർഥമില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അവന്റെ തലയിൽ മണ്ണ്.” വസ്ത്രം കീറുന്നതും തലയിൽ മണ്ണിടുന്നതും ദുഃഖത്തിന്റെയോ വിലാപത്തിന്റെയോ പതിവ് അടയാളങ്ങളായിരുന്നു.
    reason: cultural_note
  - marker: c
    text: “സാഷ്ടാംഗം പ്രണമിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. സന്ദർഭമനുസരിച്ച് ഈ ക്രിയ ആഴമായ ആദരം, കീഴടങ്ങൽ, അല്ലെങ്കിൽ വണക്കം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
