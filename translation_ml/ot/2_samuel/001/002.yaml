  rationale: מֵעִם എന്നത് ശൗലുമായുള്ള സഹവാസമോ പക്ഷബന്ധമോ സൂചിപ്പിക്കുന്നു; ശൗൽ നേരിട്ട് അയച്ചുവെന്ന ധ്വനി ഒഴിവാക്കി പാളയം ശൗലിന്റെ ഭാഗത്തേതാണെന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וּבְגָדָיו קְרֻעִים
  choice: അവന്റെ വസ്ത്രങ്ങൾ കീറിയിരുന്നു
  rationale: വിലാപാവസ്ഥ വിവരിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളം.
- source_word: וַאֲדָמָה עַל־רֹאשׁוֹ
  choice: തലയിൽ മണ്ണുമുണ്ടായിരുന്നു
  rationale: אֲדָמָה എന്നതിന്റെ അടിസ്ഥാനാർഥമായ മണ്ണ് നിലനിർത്തുകയും ദുഃഖാചാരത്തെ വ്യാഖ്യാനിച്ച് മുഖ്യവാക്യത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּפֹּל אַרְצָה
  choice: നിലത്തുവീണ്
  rationale: താഴേക്ക് നിലത്തേക്കുള്ള ചലനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיִּשְׁתָּחוּ
  choice: കുമ്പിട്ടു
  rationale: ആദരവോ കീഴടങ്ങലോ സൂചിപ്പിക്കാവുന്ന ശരീരഭാവം നൽകുന്നു; ആരാധനയെന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: וַיִּשְׁתָּחוּ എന്ന ക്രിയ ആരാധനയെയാണോ സാധാരണ ആദരവിനെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: കുമ്പിട്ടു
  alternative: സാഷ്ടാംഗം പ്രണമിച്ചു / ആരാധിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ദാവീദിനോടുള്ള ആഴമായ ആദരമോ കീഴടങ്ങലോ ആണ് സാധ്യത; 'ആരാധിച്ചു' എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ദൈവാരാധനയുടെ അർഥം അനാവശ്യമായി ചുമത്തും. അതേസമയം കുമ്പിടലിന്റെ ശക്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ ആഖ്യാനത്തിലെ ശ്രദ്ധാകർഷകമായ “ഇതാ” നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്യഘടകങ്ങൾക്കു പിന്നാലെ ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
