id: 2SA.1.18
reference: 2 Samuel 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לְ/לַמֵּ֥ד בְּנֵֽי יְהוּדָ֖ה קָ֑שֶׁת הִנֵּ֥ה כְתוּבָ֖ה עַל סֵ֥פֶר הַ/יָּשָֽׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/018.yaml
  text: 'and said that the sons of Judah should be taught “The Bow.” Behold, it is written in the Book of Jashar:'
translation:
  language: ml
  text: 'യൂദാപുത്രന്മാരെ “വില്ല്” പഠിപ്പിക്കണമെന്ന് അവൻ പറഞ്ഞു. ഇതാ, അത് യാശാരിന്റെ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്നു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְלַמֵּד
  choice: പഠിപ്പിക്കണമെന്ന്
  rationale: പിയേൽ ധാതുരൂപത്തിന്റെ ‘പഠിപ്പിക്കുക/പരിശീലിപ്പിക്കുക’ എന്ന കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי יְהוּדָה
  choice: യൂദാപുത്രന്മാരെ
  rationale: ‘യൂദായുടെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥം നിലനിർത്തിക്കൊണ്ട് ഗോത്രാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന ബൈബിൾശൈലി സംരക്ഷിക്കുന്നു.
- source_word: קָשֶׁת
  choice: “വില്ല്”
  rationale: ഇവിടെ ഇത് തുടർന്നുവരുന്ന വിലാപത്തിന്റെ ശീർഷകമായിരിക്കാമെന്ന ഇംഗ്ലീഷ് POB-യുടെ വായന പിന്തുടരുന്നു; എന്നാൽ മൂലത്തിലെ സംക്ഷിപ്തതയും അർഥസാധ്യതയും നിലനിർത്തുന്നു.
- source_word: סֵפֶר הַיָּשָׁר
  choice: യാശാരിന്റെ പുസ്തകം
  rationale: പേരിനെ ലിപ്യന്തരം ചെയ്യുന്നു; ‘നീതിമാന്റെ പുസ്തകം’ എന്നു വിവർത്തനം ചെയ്ത് ഉറപ്പില്ലാത്ത വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: קָשֶׁת എന്ന പദം ശീർഷകമാണോ ആയുധപരിശീലനമാണോ
  choice: ഉദ്ധരണിച്ചിഹ്നങ്ങളോടെ “വില്ല്” എന്ന ശീർഷകസാദ്ധ്യത മുൻനിർത്തി
  alternative: ‘വില്ലുവിദ്യ പഠിപ്പിക്കണമെന്ന്’ അല്ലെങ്കിൽ ‘വില്ല് ഉപയോഗിക്കാൻ പഠിപ്പിക്കണമെന്ന്’
  rationale: സന്ദർഭം ദാവീദിന്റെ വിലാപത്തിലേക്കാണ് നയിക്കുന്നത്; എങ്കിലും എബ്രായത്തിൽ ‘ശീർഷകം’ എന്നു വ്യക്തമല്ല. അതിനാൽ അധിക വിശദീകരണമില്ലാതെ ഒറ്റപ്പദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള വാക്യഘടന. ‘ഇതാ’ എന്നത് הִנֵּה-യുടെ ദൃശ്യ/ശ്രദ്ധാകർഷക സ്വഭാവം നിലനിർത്തുന്നു.
