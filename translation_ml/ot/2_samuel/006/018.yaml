id: 2SA.6.18
reference: 2 Samuel 6:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔ד מֵ/הַעֲל֥וֹת הָ/עוֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֣רֶךְ אֶת הָ/עָ֔ם בְּ/שֵׁ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/018.yaml
  text: When David had finished offering the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh of hosts.
translation:
  language: ml
  text: ദാവീദ് ഹോമയാഗവും സമാധാനയാഗങ്ങളും അർപ്പിച്ചു തീർന്നപ്പോൾ, അവൻ സൈന്യങ്ങളുടെ യഹ്‌വെയുടെ[a] നാമത്തിൽ ജനത്തെ അനുഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൈന്യങ്ങളുടെ യഹ്‌വെ’ എന്നത് ‘സേനകളുടെ യഹ്‌വെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: צְבָאוֹת എന്ന എബ്രായപദത്തിന് ‘സൈന്യങ്ങൾ’, ‘സേനകൾ’ എന്നീ സാധുവായ അർത്ഥരൂപങ്ങൾ ഉള്ളതിനാൽ മറ്റൊരു പരിഭാഷ അറിയിക്കുന്നു.
lexical_decisions:
- source_word: וַיְכַל ... מֵהַעֲלוֹת
  choice: അർപ്പിച്ചുതീർന്നപ്പോൾ
  rationale: כלה എന്ന പൂർത്തീകരണക്രിയയും עלה എന്ന ഹിഫീൽ ക്രിയാനാമവും ചേർന്ന് മുൻപുള്ള യാഗാർപ്പണം പൂർത്തിയായതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അർപ്പിച്ചുതീർന്നപ്പോൾ’ ഈ ക്രമവും പൂർത്തീകരണവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: עֹלָה എന്നത് പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള സ്ഥിരമായ ബലിപദമാണ്. എബ്രായത്തിലെ ഏകവചനം നിലനിർത്തുന്നു.
- source_word: וְהַשְּׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: שְׁלָמִים കൂട്ടായ്മ, ക്ഷേമം, സമാധാനം എന്നിവയുമായി ബന്ധപ്പെട്ട യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘സമാധാനയാഗങ്ങൾ’ പരിചിതവും അർത്ഥസാധുതയുള്ളതുമായ രൂപമാണ്; എബ്രായത്തിലെ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: וַיְבָרֶךְ אֶת־הָעָם
  choice: അവൻ ജനത്തെ അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർത്ഥമായ ‘അനുഗ്രഹിച്ചു’ ഉപയോഗിക്കുകയും עָם എന്നതിനെ പൊതുവായ ‘ജനം’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു. മലയാളവാക്യത്തിൽ കർത്താവ് വ്യക്തമായിരിക്കാനായി ‘അവൻ’ ചേർത്തിരിക്കുന്നു.
- source_word: בְּשֵׁם
  choice: നാമത്തിൽ
  rationale: ഈ പ്രയോഗം ആ നാമത്തിന്റെ അധികാരത്തിലും ആഹ്വാനത്തിലും അനുഗ്രഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നാമത്തിൽ’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: יְהוָה צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ യഹ്‌വെ
  rationale: יְהוָה എന്ന ദൈവനാമം സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു. צְבָאוֹת എന്ന ബഹുവചനപദത്തിന്റെ വിശാലമായ സൈനിക അർത്ഥം ‘സൈന്യങ്ങൾ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: צְבָאוֹת ഉൾപ്പെടുന്ന ദൈവിക വിശേഷണം
  choice: സൈന്യങ്ങളുടെ യഹ്‌വെ
  alternative: സേനകളുടെ യഹ്‌വെ
  rationale: צְבָאוֹת എന്നത് സൈന്യങ്ങളെയോ സേനകളെയോ സൂചിപ്പിക്കാം. ‘സൈന്യങ്ങൾ’ അർത്ഥവ്യാപ്തിയും ദൈവിക പരമാധികാരത്തിന്റെ സൈനിക ഭാവവും നിലനിർത്തുന്നു; പദം ആരെല്ലാം ഉൾക്കൊള്ളുന്നു എന്ന് വാക്യം സ്വയം നിർണ്ണയിക്കാത്തതിനാൽ അതിനെ കൂടുതൽ വിശദീകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യാഗസംബന്ധമായ പരിചിത പദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്. മൂലപാഠത്തിന്റെ വാക്യക്രമം മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ പുനഃക്രമീകരിച്ചെങ്കിലും യാഗാർപ്പണം പൂർത്തിയായതിന് ശേഷമാണ് അനുഗ്രഹം എന്ന സംഭവക്രമം കാത്തുസൂക്ഷിച്ചു.
