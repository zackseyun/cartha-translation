id: 2SA.6.13
reference: 2 Samuel 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ֧י צָעֲד֛וּ נֹשְׂאֵ֥י אֲרוֹן יְהוָ֖ה שִׁשָּׁ֣ה צְעָדִ֑ים וַ/יִּזְבַּ֥ח שׁ֖וֹר וּ/מְרִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/013.yaml
  text: And when those carrying the ark of Yahweh had gone six steps[b][a], he sacrificed an ox and a fattened calf.
translation:
  language: ml
  text: യഹ്‌വെയുടെ പെട്ടകം വഹിക്കുന്നവർ ആറു ചുവടുകൾ[a] നടന്നപ്പോൾ, അവൻ ഒരു കാളയെയും കൊഴുപ്പിച്ച ഒരു മൃഗത്തെയും[b] ബലിയർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആറ് കാൽവയ്പുകൾ.’
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി ‘കൊഴുപ്പിച്ച ഒരു കിടാവ്’ എന്നും മനസ്സിലാക്കിയിട്ടുണ്ട്; എബ്രായപദം പൊതുവേ ‘കൊഴുപ്പിച്ച ഒരു മൃഗം’ എന്നാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: യഹ്‌വെയുടെ പെട്ടകം
  rationale: אֲרוֹן എന്നത് ഉടമ്പടിപ്പെട്ടകത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ ‘പെട്ടകം’ എന്നും ദൈവനാമമായ יְהוָה നേരിട്ട് ‘യഹ്‌വെ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: כִּי
  choice: നടന്നപ്പോൾ
  rationale: ויהי כי എന്ന ആഖ്യാനഘടനയിലെ temporal ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ ‘...പ്പോൾ’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: צָעֲדוּ
  choice: നടന്നു
  rationale: മുന്നോട്ടു ചുവടുവയ്ക്കുന്ന ചലനത്തെ സൂചിപ്പിക്കുന്നു; ‘ആറു ചുവടുകൾ നടന്നു’ എന്നത് അർഥവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: נֹשְׂאֵי
  choice: വഹിച്ചവർ
  rationale: പെട്ടകം ചുമന്നുകൊണ്ടുപോയ ആളുകളെ സൂചിപ്പിക്കുന്ന participle-ന് വായനാസൗകര്യമുള്ള സമകാലിക പ്രയോഗം.
- source_word: שִׁשָּׁה צְעָדִים
  choice: ആറു ചുവടുകൾ
  rationale: സംഖ്യയും ചുവടുകളുടെ അളവും നേരിട്ട് നിലനിർത്തുന്നു; ‘ആറടി’ എന്ന് പറഞ്ഞാൽ ദൂരത്തിന്റെ കൃത്യമായ അളവെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാകാം.
- source_word: וַיִּזְבַּח
  choice: അവൻ ... ബലിയർപ്പിച്ചു
  rationale: എബ്രായത്തിലെ ഏകവചന ക്രിയയെ നിലനിർത്തി; സന്ദർഭത്തിൽ കർത്താവ് ദാവീദാണെന്ന സൂചനയുണ്ടെങ്കിലും മൂലപാഠത്തിൽ പേര് ഇവിടെ ആവർത്തിക്കുന്നില്ല.
- source_word: שׁוֹר
  choice: ഒരു കാള
  rationale: വലിയ കന്നുകാലിയെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാള പദം; ഇവിടെ ബലിമൃഗം എന്ന സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: מְרִיא
  choice: കൊഴുപ്പിച്ച ഒരു മൃഗം
  rationale: എബ്രായപദം നിർബന്ധമായും കിടാവിനെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; അതിന്റെ വിശാലത സംരക്ഷിക്കാൻ പൊതുവായ അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: ബലിയർപ്പിച്ച വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: അവൻ
  alternative: ദാവീദ്
  rationale: ക്രിയ ഏകവചനമാണെന്നും സന്ദർഭം ദാവീദിനെ സൂചിപ്പിക്കുന്നുവെന്നും അംഗീകരിക്കുമ്പോഴും, ഈ വാക്യത്തിൽ മൂലപാഠം പേര് വ്യക്തമാക്കാത്തതിനാൽ അതേ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അവൻ’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ ഏകവചനത്തെയും സന്ദർഭപരമായ കർത്തൃസൂചനയെയും സംരക്ഷിക്കുന്നു; מְרִיאയുടെ വർഗനിർണ്ണയത്തിലെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
