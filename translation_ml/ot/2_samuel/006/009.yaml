  terminology: ‘യഹ്‌വെ’ consistently represents יהוה, and ‘യഹ്‌വെയുടെ പെട്ടകം’ transparently renders the construct phrase אֲרוֹן יְהוָה. The terminology is consistent within the verse and does not impose an interpretive theological gloss.
