id: 2SA.6.9
reference: 2 Samuel 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרָ֥א דָוִ֛ד אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֕אמֶר אֵ֛יךְ יָב֥וֹא אֵלַ֖/י אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/009.yaml
  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
translation:
  language: ml
  text: 'ആ ദിവസം ദാവീദ് യഹ്‌വെയെ ഭയപ്പെട്ടു. അവൻ പറഞ്ഞു: “യഹ്‌വെയുടെ പെട്ടകം എങ്ങനെ എന്റെ അടുക്കൽ വരും?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “യഹ്‌വെയുടെ പെട്ടകം എങ്ങനെ എന്റെ അടുക്കൽ വരും?” ഉസ്സയുടെ മരണശേഷം ഈ വാക്കുകൾ പ്രായോഗികമായ അനിശ്ചിതത്വമോ ഭയം കലർന്ന അയോഗ്യതാബോധമോ പ്രകടിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: ഭയപ്പെട്ടു
  rationale: ഉസ്സയുടെ മരണത്തിനു പിന്നാലെയുള്ള ദാവീദിന്റെ പ്രതികരണത്തിൽ യഥാർത്ഥ ഭയം പ്രകടമാണ്. അതേസമയം, ദൈവത്തോടുള്ള ഭയഭക്തിയുടെ സാധ്യത പൂർണമായി ഇല്ലാതാക്കാത്ത സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: നാലക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: കാലസൂചന കൃത്യമായും സ്വാഭാവികമായും നൽകുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: אֵיךְ
  choice: എങ്ങനെ
  rationale: ചോദ്യം പ്രായോഗികമായ അനിശ്ചിതത്വമോ ഭയം കലർന്ന അയോഗ്യതാബോധമോ സൂചിപ്പിക്കാം; ‘എങ്ങനെ’ ഈ തുറന്ന അർഥപരിധി നിലനിർത്തുന്നു.
- source_word: יָבֹא
  choice: വരും
  rationale: בוא എന്ന ക്രിയയുടെ സജീവമായ ‘വരുക’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; മൂലപാഠത്തിലില്ലാത്ത കർമണിപ്രയോഗമായ ‘കൊണ്ടുവരപ്പെടും’ ഒഴിവാക്കുന്നു.
- source_word: אֵלַי
  choice: എന്റെ അടുക്കൽ
  rationale: ‘എന്റെ വീട്ടിലേക്ക്’ അല്ലെങ്കിൽ ‘എന്റെ സ്ഥലത്തേക്ക്’ എന്നതുപോലെ മൂലപാഠത്തേക്കാൾ പ്രത്യേകമായ അർഥം ചേർക്കാതെ ദിശയും വ്യക്തിബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: אֲרוֹן יְהוָה
  choice: യഹ്‌വെയുടെ പെട്ടകം
  rationale: സംബന്ധഘടന സുതാര്യമായി നിലനിർത്തുകയും വിശുദ്ധ പെട്ടകത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ മലയാളപദം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: ദാവീദിന്റെ ചോദ്യത്തിന്റെ ഭാവം
  choice: ‘എങ്ങനെ ... വരും?’ എന്ന തുറന്ന ചോദ്യം
  alternative: ‘എങ്ങനെ ... വരാൻ കഴിയും?’
  rationale: ഉസ്സയുടെ മരണശേഷം ഈ ചോദ്യം പ്രായോഗിക അനിശ്ചിതത്വമോ ഭയം/അയോഗ്യതാബോധമോ പ്രകടിപ്പിക്കാം. സാധ്യതയില്ലായ്മയെന്ന് മാത്രം വ്യാഖ്യാനിക്കാതെ ഈ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ലളിതവും ഗൗരവമുള്ളതുമായ ആധുനിക നിലവാരമലയാളം. ദൈവനാമം ‘യഹ്‌വെ’ എന്നും sacred object ‘പെട്ടകം’ എന്നും നൽകി; ചോദ്യത്തിന്റെ അർഥസന്ദിഗ്ധത സംരക്ഷിച്ചു.
