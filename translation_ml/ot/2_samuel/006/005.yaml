    issue: വാദ്യപ്പട്ടികയിലെ വ്യാകരണ-ഏകോപന പ്രശ്നം
    rationale: ‘സകലവിധ ... വാദ്യങ്ങളോടും കിന്നരങ്ങൾ, വീണകൾ ... എന്നിവയോടുംകൂടെ’ എന്നതിൽ ആദ്യപദവും തുടർന്നുള്ള പട്ടികയും സമാന്തരമല്ല. മൂലത്തിലെ എല്ലാ בְּ (‘കൊണ്ട്/ഉപയോഗിച്ച്’) ബന്ധങ്ങളെയും മലയാളത്തിൽ വ്യക്തമായി ഉൾക്കൊള്ളാൻ പട്ടികയ്ക്കുശേഷം ‘ഉപയോഗിച്ച്’ എന്ന പ്രയോഗം വേണം.
