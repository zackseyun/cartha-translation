  text: וְ/דָוִ֣ד וְ/כָל בֵּ֣ית יִשְׂרָאֵ֗ל מְשַֽׂחֲקִים֙ לִ/פְנֵ֣י יְהוָ֔ה בְּ/כֹ֖ל עֲצֵ֣י בְרוֹשִׁ֑ים וּ/בְ/כִנֹּר֤וֹת וּ/בִ/נְבָלִים֙ וּ/בְ/תֻפִּ֔ים וּ/בִ/מְנַֽעַנְעִ֖ים וּֽ/בְ/צֶלְצֶלִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
translation:
  language: ml
  text: ദാവീദും ഇസ്രായേൽഗൃഹം മുഴുവനും യഹ്‌വേയുടെ സന്നിധിയിൽ സകലവിധ സരളമരക്കൊണ്ടുള്ള വാദ്യങ്ങൾ[a], ലൈറുകൾ, ഹാർപ്പുകൾ, തപ്പുകൾ, കുലുക്കിവായിക്കുന്ന വാദ്യങ്ങൾ[b], കൈത്താളങ്ങൾ എന്നിവ ഉപയോഗിച്ച് ആഘോഷിക്കുകയായിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘സരളമരങ്ങളുടെ സകല മരങ്ങളോടും’ എന്നു വായിക്കാം. സരളമരക്കൊണ്ടുണ്ടാക്കിയ പലതരം വാദ്യങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെന്നു സാധ്യത; മരത്തിന്റെ കൃത്യമായ ഇനവും അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഈ അപൂർവ എബ്രായപദം കുലുക്കി ശബ്ദമുണ്ടാക്കുന്ന വാദ്യങ്ങളെ സൂചിപ്പിക്കുന്നു; ഒരുപക്ഷേ സിസ്ട്രങ്ങൾ പോലുള്ള വാദ്യങ്ങൾ.
    reason: lexical_alternative
  - marker: c
    text: ‘ആഘോഷിക്കുകയായിരുന്നു’ എന്നതിന് ‘കളിക്കുകയായിരുന്നു’ അല്ലെങ്കിൽ ‘ആനന്ദിക്കുകയായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായക്രിയ ഉത്സവഭാവമുള്ള കളിയും ആനന്ദപ്രകടനവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: ആഘോഷിക്കുകയായിരുന്നു
  rationale: പീയേൽ രൂപത്തിലുള്ള ക്രിയ ഇവിടെ കളിയോടും ആനന്ദത്തോടും കൂടിയ ഉത്സവപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. വാദ്യഘോഷമുള്ള ഘോഷയാത്രയുടെ സന്ദർഭത്തിൽ ‘ആഘോഷിക്കുകയായിരുന്നു’ എന്നത് സ്വാഭാവികവും അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: പ്രവൃത്തി യഹ്‌വേയുടെ സാന്നിധ്യത്തിൽ നടക്കുന്നു എന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ദൈവനാമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹം മുഴുവനും
  rationale: ദേശീയ സമൂഹത്തെ ഒരു കൂട്ടായ ഭവനമായി സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം ലളിതമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: בְּכֹל עֲצֵי בְרוֹשִׁים
  choice: സകലവിധ സരളമരക്കൊണ്ടുള്ള വാദ്യങ്ങളോടും
  rationale: അക്ഷരാർഥത്തിൽ ദുഷ്കരമായ ‘സരളമരങ്ങളുടെ സകല മരങ്ങളോടും’ എന്ന പ്രയോഗത്തിൽ വാദ്യങ്ങൾ സൂചിതമാണെന്ന സാധ്യത സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: כִנֹּרוֹת
  choice: കിന്നരങ്ങൾ
  rationale: പുരാതന ലൈർ-വർഗത്തിലുള്ള തന്ത്രിവാദ്യത്തെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ സാഹിത്യഭാഷയിലും പരിചിതമായ പദം.
- source_word: נְבָלִים
  choice: വീണകൾ
  rationale: כִנּוֹר എന്നതിൽനിന്നു വ്യത്യസ്തമായ മറ്റൊരു തന്ത്രിവാദ്യത്തിന് വായനക്കാർക്ക് ഗ്രാഹ്യമായ പൊതുപദം; കൃത്യമായ രൂപം അനിശ്ചിതമാണ്.
- source_word: תֻפִּים
  choice: തപ്പുകൾ
  rationale: കൈകൊണ്ട് വായിക്കുന്ന ഫ്രെയിം ഡ്രം അഥവാ തമ്പുരിൻ വർഗത്തെ സ്വാഭാവികവും നിലവിലുള്ളതുമായ മലയാളപദത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מְנַעַנְעִים
  choice: കുലുക്കിവായിക്കുന്ന വാദ്യങ്ങൾ
  rationale: അപൂർവപദം കുലുക്കി ശബ്ദമുണ്ടാക്കുന്ന വാദ്യത്തെ സൂചിപ്പിക്കുന്നു; ‘സിസ്ട്രം’ പോലുള്ള കൃത്യതയില്ലാത്ത സാങ്കേതിക തിരിച്ചറിയൽ ഒഴിവാക്കി പ്രവർത്തനരീതി വ്യക്തമാക്കുന്നു.
- source_word: צֶלְצֶלִים
  choice: കൈത്താളങ്ങൾ
  rationale: തമ്മിൽ കൂട്ടിയടിച്ച് ശബ്ദമുണ്ടാക്കുന്ന ലോഹവാദ്യങ്ങളെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപദം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: מְשַׂחֲקִים എന്ന ക്രിയയുടെ ആരാധനാസന്ദർഭത്തിലുള്ള ഭാവം
  choice: ആഘോഷിക്കുകയായിരുന്നു
  alternative: കളിക്കുകയായിരുന്നു / ആനന്ദിക്കുകയായിരുന്നു
  rationale: വാചകം ഇതിനെ ഔപചാരിക ആരാധനയായി മാത്രം നിർവചിക്കുന്നില്ല; അതേസമയം ബാലിശമായ കളിയെന്ന ധാരണയും നൽകേണ്ടതില്ല. ഘോഷയാത്രയിലെ ഉത്സവാനന്ദം പ്രകടമാക്കുന്ന പരിഭാഷയാണ് തിരഞ്ഞെടുത്തത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽഗൃഹം’ എന്ന കൂട്ടായ പ്രയോഗവും ‘യഹ്‌വേ’ എന്ന ദൈവനാമവും നിലനിർത്തി. പുരാതന വാദ്യങ്ങളുടെ കൃത്യമായ തിരിച്ചറിയലിലുള്ള അനിശ്ചിതത്വം പ്രധാനവാചകം ഭാരപ്പെടുത്താതെ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
