    rationale: ഇത് ചില വായനക്കാർക്ക് പുരാണജീവി എന്ന അർഥം ആദ്യം ഉണർത്താം. כִנּוֹר എന്ന ലൈർ-വർഗ വാദ്യത്തിന് ‘ലൈറുകൾ’ കൂടുതൽ വ്യക്തവും നിഷ്പക്ഷവുമാണ്.
  revised_text: ദാവീദും ഇസ്രായേൽഗൃഹം മുഴുവനും യഹ്‌വേയുടെ സന്നിധിയിൽ സകലവിധ സരളമരക്കൊണ്ടുള്ള വാദ്യങ്ങൾ[a], ലൈറുകൾ, ഹാർപ്പുകൾ, തപ്പുകൾ, കുലുക്കിവായിക്കുന്ന വാദ്യങ്ങൾ[b], കൈത്താളങ്ങൾ എന്നിവ ഉപയോഗിച്ച് ആഘോഷിക്കുകയായിരുന്നു.[c]
