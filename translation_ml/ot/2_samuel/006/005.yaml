  revision_rationale: ഉപകരണപ്പട്ടികയുടെ മലയാള വ്യാകരണഘടന തിരുത്തി, മൂലത്തിലെ ഉപകരണസൂചന സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു. כִנּוֹר-നുള്ള ‘കിന്നരങ്ങൾ’ ‘ലൈറുകൾ’ ആക്കിയും, അതിൽനിന്നു വ്യത്യസ്തമായ נְבָלִים-ന് ‘ഹാർപ്പുകൾ’ ഉപയോഗിച്ചും രണ്ടു വാദ്യങ്ങളുടെ വ്യത്യാസം വ്യക്തമാക്കി. ദുഷ്കരമായ സരളമരപ്രയോഗത്തെയും അപൂർവമായ കുലുക്കിവായിക്കുന്ന വാദ്യത്തെയും സംബന്ധിച്ച അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ മാറ്റമില്ലാതെ സംരക്ഷിച്ചു.
