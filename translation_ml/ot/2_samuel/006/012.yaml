  text: וַ/יֻּגַּ֗ד לַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ בֵּרַ֣ךְ יְהוָ֗ה אֶת בֵּ֨ית עֹבֵ֤ד אֱדֹם֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ בַּ/עֲב֖וּר אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יַּעַל֩ אֶת אֲר֨וֹן הָ/אֱלֹהִ֜ים מִ/בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם עִ֥יר דָּוִ֖ד בְּ/שִׂמְחָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
translation:
  language: ml
  text: 'ദാവീദ് രാജാവിനോടു ഇങ്ങനെ വിവരം അറിയിച്ചു: “ദൈവത്തിന്റെ പെട്ടകം നിമിത്തം യഹ്‌വെ[a] ഓബേദ്-ഏദോമിന്റെ ഭവനത്തെയും അവനുള്ള സകലത്തെയും അനുഗ്രഹിച്ചിരിക്കുന്നു.” അപ്പോൾ ദാവീദ് ചെന്നു ദൈവത്തിന്റെ പെട്ടകം ഓബേദ്-ഏദോമിന്റെ വീട്ടിൽനിന്ന് സന്തോഷത്തോടെ ദാവീദിന്റെ നഗരത്തിലേക്കു കയറ്റിക്കൊണ്ടുപോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: YHWH (יהוה). ഇവിടെ ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു; അതിന്റെ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ല. പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നും ‘യഹോവ’ എന്നും നൽകാറുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ വായനയും വിവർത്തനപരമ്പരയും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: അറിയിച്ചു
  rationale: ഹൊഫാൽ രൂപത്തിന്റെ കർമണി അർഥം നിലനിർത്തിക്കൊണ്ട്, വിവരം അറിയിച്ച വ്യക്തിയെ പറയാതെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവിനെ
  rationale: പദവിയും പേരും ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകുന്നു.
- source_word: בֵּרַךְ יְהוָה
  choice: യഹ്‌വെ അനുഗ്രഹിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ പൂർത്തികാലരൂപംകൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ഓബേദ്-ഏദോമിന്റെ ഭവനം
  rationale: בֵּית എന്നത് ഇവിടെ കുടുംബത്തെയും വീട്ടുസംബന്ധമായ സമ്പത്തിനെയും ഉൾക്കൊള്ളുന്നതിനാൽ ‘ഭവനം’ എന്ന വിശാലപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: അവനുള്ള സകലത്തെയും
  rationale: സ്വത്തുക്കളും അവന്റെ അധികാരപരിധിയിലുള്ളതെല്ലാം ഉൾക്കൊള്ളുന്ന ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בַּעֲבוּר
  choice: നിമിത്തം
  rationale: പെട്ടകത്തിന്റെ സാന്നിധ്യമാണ് അനുഗ്രഹത്തിന്റെ കാരണമെന്ന് വ്യക്തമാക്കുന്ന കാരണാർഥം നൽകുന്നു.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: വിശുദ്ധ പെട്ടകത്തിനുള്ള നേരിട്ടുള്ളതും മലയാള വായനക്കാർക്ക് പരിചിതവുമായ വിവർത്തനം.
- source_word: וַיַּעַל
  choice: കയറ്റിക്കൊണ്ടുവന്നു
  rationale: യെരൂശലേമിലേക്കുള്ള ഉയർച്ച സൂചിപ്പിക്കുന്ന עלה എന്ന ക്രിയയുടെ ദിശാബോധവും വസ്തുവിനെ കൊണ്ടുപോകുന്ന കാരണകർത്തൃഭാവവും നിലനിർത്തുന്നു.
- source_word: בְּשִׂמְחָה
  choice: സന്തോഷത്തോടെ
  rationale: പ്രവൃത്തിയോടൊപ്പമുള്ള ആഹ്ലാദഭാവം നേരിട്ട് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു; പുനർനിർമിത ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: പെട്ടകം അനുഗ്രഹത്തിന്റെ കാരണമായി പറയുന്നത്
  choice: ദൈവത്തിന്റെ പെട്ടകം നിമിത്തം
  alternative: ദൈവത്തിന്റെ പെട്ടകത്തിനുവേണ്ടി
  rationale: בַּעֲבוּר ഇവിടെ ലക്ഷ്യത്തേക്കാൾ കാരണബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; പെട്ടകത്തിനുതന്നെ സ്വതന്ത്രശക്തിയുണ്ടെന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ മലയാളം. ആദ്യവാക്യത്തിൽ വാർത്ത അറിയിച്ച വ്യക്തിയെ വ്യക്തമാക്കാതെ മൂലത്തിലെ കർമണി ഘടന സംരക്ഷിച്ചു. ആവർത്തനത്തിലുള്ള ‘ഭവനം/വീട്’ തിരഞ്ഞെടുപ്പ് ആദ്യസ്ഥലത്ത് കുടുംബ-സ്വത്ത് വ്യാപ്തിയും രണ്ടാമത്തെ സ്ഥലത്ത് ഭൗതിക പുറപ്പെടൽസ്ഥാനവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
