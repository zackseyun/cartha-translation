source:
  edition: WLC
  text: וַ/יִּשָּׂאֻ֗/הוּ מִ/בֵּ֤ית אֲבִֽינָדָב֙ אֲשֶׁ֣ר בַּ/גִּבְעָ֔ה עִ֖ם אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/אַחְי֕וֹ הֹלֵ֖ךְ לִ/פְנֵ֥י הָ/אָרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/004.yaml
  text: They carried it from the house of Abinadab[a], which was on the hill, with the ark of God, and Ahio was walking before the ark.
translation:
  language: ml
  text: അവർ കുന്നിന്മേലുണ്ടായിരുന്ന[a] അബീനാദാബിന്റെ വീട്ടിൽനിന്ന് ദൈവത്തിന്റെ പെട്ടകത്തോടുകൂടെ അതിനെ കൊണ്ടുപോയി. അഹ്യോ പെട്ടകത്തിന്റെ മുമ്പിൽ നടന്നുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഗിബെയയിൽ ഉണ്ടായിരുന്ന.” גִּבְעָה എന്ന ഹീബ്രു പദം “കുന്ന്” എന്ന പൊതുനാമമായോ “ഗിബെയ” എന്ന സ്ഥലനാമമായോ വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: അവർ അതിനെ കൊണ്ടുപോയി
  rationale: נשׂא എന്ന ക്രിയയുടെ ബഹുവചനരൂപവും പുരുഷലിംഗ ഏകവചന കർമപ്രത്യയവും ഇവിടെ പെട്ടകം അവിടെനിന്ന് നീക്കിക്കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. കൊണ്ടുപോയി എന്നത് ചുമന്നുവെന്ന രീതി അനാവശ്യമായി നിർണ്ണയിക്കാതെ ഗതാഗതത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִבֵּית אֲבִינָדָב
  choice: അബീനാദാബിന്റെ വീട്ടിൽനിന്ന്
  rationale: מִן ഉറവിടസ്ഥാനത്തെയും בֵּית എന്നത് അബീനാദാബിന്റെ വീടിനെയും നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: കുന്നിന്മേലുണ്ടായിരുന്ന
  rationale: ഗൃഹത്തെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യമായി വായിച്ച് גִּבְעָה എന്നതിന് പൊതുനാമമായ കുന്ന് എന്ന അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു. സ്ഥലനാമമായ ഗിബെയ എന്ന വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകത്തോടുകൂടെ
  rationale: עִם കൂടെയുണ്ടായിരിക്കുക എന്ന ആശയം നൽകുന്നു; אֲרוֹן הָאֱלֹהִים എന്നത് മലയാളത്തിലെ സ്ഥാപിതവും സുതാര്യവുമായ പ്രയോഗത്തിൽ ദൈവത്തിന്റെ പെട്ടകം എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְאַחְיוֹ
  choice: അഹ്യോ
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളത്തിൽ ഉച്ചാരണസമീപമായി ലിപ്യന്തരിച്ചു.
- source_word: הֹלֵךְ
  choice: നടന്നുകൊണ്ടിരുന്നു
  rationale: കർത്തൃവാചക രൂപം പെട്ടകം കൊണ്ടുപോകുന്നതിനോടൊപ്പം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; നടന്നുകൊണ്ടിരുന്നു ആ ദൈർഘ്യഭാവം വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי הָאָרוֹן
  choice: പെട്ടകത്തിന്റെ മുമ്പിൽ
  rationale: לִפְנֵי ഇവിടെ സ്ഥലബന്ധമായി പെട്ടകത്തിന് മുന്നിലുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; മുമ്പിൽ എന്നത് സ്വാഭാവികവും ഘോഷയാത്രാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. തുടർച്ചയായ പ്രവൃത്തിക്ക് നടന്നുകൊണ്ടിരുന്നു എന്നും, ഗതാഗതരീതി അനാവശ്യമായി നിർണ്ണയിക്കാതിരിക്കാൻ കൊണ്ടുപോയി എന്നും നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ദ്വയാർഥമുള്ള സ്ഥലവാക്യത്തിന് പിന്നാലെ ചേർത്തു.
