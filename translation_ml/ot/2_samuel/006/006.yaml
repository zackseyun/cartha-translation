source:
  edition: WLC
  text: וַ/יָּבֹ֖אוּ עַד גֹּ֣רֶן נָכ֑וֹן וַ/יִּשְׁלַ֨ח עֻזָּ֜א אֶל אֲר֤וֹן הָֽ/אֱלֹהִים֙ וַ/יֹּ֣אחֶז בּ֔/וֹ כִּ֥י שָׁמְט֖וּ הַ/בָּקָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
translation:
  language: ml
  text: അവർ നാഖോന്റെ മെതിക്കളത്തിൽ[a] എത്തിയപ്പോൾ, കാളകൾ കാൽതെറ്റിയതിനാൽ[b] ഉസ്സാ ദൈവത്തിന്റെ പെട്ടകത്തിലേക്കു കൈ നീട്ടി അതിനെ പിടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാഖോൻ എന്ന സ്ഥലത്തെ മെതിക്കളം’; സാധ്യത കുറവായി, ‘ഉറപ്പുള്ള/സ്ഥിരമായ മെതിക്കളം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കാളകൾ വഴുതി’; ഈ ക്രിയയ്ക്ക് ‘കാളകൾ പെട്ടകം മറിച്ചിടാൻ ഇടയായി’ എന്ന അർഥവും ഇവിടെ സാധ്യമായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: മെതിക്കളം
  rationale: ധാന്യം മെതിക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ നാമത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും കൃത്യവുമായ തുല്യപദം.
- source_word: נָכוֹן
  choice: നാഖോന്റെ
  rationale: ഇവിടെ ഇത് സ്ഥലവുമായി ബന്ധപ്പെട്ട വ്യക്തിനാമമായി മനസ്സിലാക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം; പദത്തിന്റെ വിശേഷണാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁלַח
  choice: കൈ നീട്ടി
  rationale: കൈ എന്നത് മൂലപാഠത്തിൽ പരോക്ഷമായി ഉൾക്കൊള്ളപ്പെട്ടിരിക്കുന്നു; ഒരു വസ്തുവിലേക്കു നീളുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: മൂലപാഠത്തിലെ പൂർണ്ണ നിർമാണപ്രയോഗവും പെട്ടകത്തിന്റെ വിശുദ്ധമായ തിരിച്ചറിയലും നിലനിർത്തുന്നു.
- source_word: וַיֹּאחֶז בּוֹ
  choice: അതിനെ പിടിച്ചു
  rationale: പിടിക്കുക, മുറുകെപ്പിടിക്കുക എന്ന ആശയം നൽകുന്നു; മൂലപാഠത്തിലില്ലാത്ത അക്രമഭാവം ചേർക്കുന്നില്ല.
- source_word: כִּי
  choice: ആയതിനാൽ
  rationale: ഉസ്സയുടെ പ്രവൃത്തിക്കുള്ള കാരണം വ്യക്തമാക്കുന്ന causal ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שָׁמְטוּ
  choice: കാൽതെറ്റി
  rationale: ക്രിയയ്ക്ക് വഴുതുക, നിയന്ത്രണം നഷ്ടപ്പെടുക, വീഴാനിടയാകുക തുടങ്ങിയ അർഥസാധ്യതകളുണ്ട്; കാളകളാണ് കർത്താവ് എന്ന സാഹചര്യത്തിൽ ‘കാൽതെറ്റി’ യാന്ത്രികവിശദാംശം അമിതമായി നിർണ്ണയിക്കാതെ സംഭവം വ്യക്തമാക്കുന്നു.
- source_word: הַבָּקָר
  choice: കാളകൾ
  rationale: വണ്ടി വലിക്കുന്ന മൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന ഈ സാഹചര്യത്തിൽ പൊതുവായ ‘കന്നുകാലികൾ’ എന്നതിനെക്കാൾ കൃത്യവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ഉസ്സയുടെ പ്രവൃത്തിയുടെ കാരണം
  choice: കാളകൾ കാൽതെറ്റിയതിനാലാണ് ഉസ്സ പെട്ടകം പിടിച്ചത്.
  alternative: കാളകൾ പെട്ടകത്തെ മറിച്ചുകളയുകയോ അത് വഴുതിപ്പോകാൻ ഇടയാക്കുകയോ ചെയ്തതിനാൽ ഉസ്സ പിടിച്ചു.
  rationale: എബ്രായപാഠം കാളകളെ കർത്താവാക്കി വഴുതൽ/കൈവിടൽ സൂചിപ്പിക്കുന്ന ഒരു ക്രിയ മാത്രമാണ് ഉപയോഗിക്കുന്നത്. പെട്ടകം യഥാർത്ഥത്തിൽ മറിഞ്ഞുവെന്നോ വഴുതിയെന്നോ ഉറപ്പിക്കുന്നില്ല; അതിനാൽ സംഭവത്തിന്റെ സംഘർഷം നിലനിർത്തിക്കൊണ്ട് യാന്ത്രികവിശദാംശം ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘മെതിക്കളം’, ‘പെട്ടകം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി, എന്നാൽ മൂലപാഠത്തിലെ കാരണബന്ധവും അർഥവ്യക്തതയില്ലായ്മയും സംരക്ഷിച്ചു.
