reference: 2 Samuel 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָה֙ אֲר֣וֹן יְהוָ֔ה בָּ֖א עִ֣יר דָּוִ֑ד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִד֙ מְפַזֵּ֤ז וּ/מְכַרְכֵּר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
translation:
  language: ml
  text: യഹ്‌വേയുടെ പെട്ടകം ദാവീദിന്റെ നഗരത്തിലേക്കു വന്നുകൊണ്ടിരിക്കുമ്പോൾ, ശൗലിന്റെ മകളായ മീഖൾ ജനാലയിലൂടെ പുറത്തേക്കു നോക്കി, യഹ്‌വേയുടെ സന്നിധിയിൽ തുള്ളിച്ചാടുകയും ചുറ്റിത്തിരിയുകയും ചെയ്യുന്ന രാജാവായ ദാവീദിനെ കണ്ടു[a]; അവൾ ഹൃദയത്തിൽ അവനെ നിന്ദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“തുള്ളിച്ചാടുകയും ചുറ്റിത്തിരിയുകയും”: എബ്രായ ക്രിയകൾ യഹ്‌വേയുടെ സന്നിധിയിലെ അത്യുത്സാഹപൂർണമായ ആഘോഷചലനങ്ങളെ ചിത്രീകരിക്കുന്നു.'
    reason: അപൂർവമായ രണ്ടു എബ്രായ ക്രിയകളുടെ ദൃശ്യവും ആഘോഷപരവുമായ അർഥവ്യാപ്തി വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וְהָיָה ... בָּא
  choice: വന്നുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: പെട്ടകം നഗരത്തിലേക്കു വരുന്നതിനിടെ മീഖൾ കാണുന്ന സാഹചര്യം അവതരിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനഘടനയെ സ്വാഭാവികമായ മലയാള കാലവാക്യമായി നൽകുന്നു.
- source_word: אֲרוֹן יְהוָה
  choice: യഹ്‌വേയുടെ പെട്ടകം
  rationale: നിർമാണബന്ധം നേരിട്ട് നിലനിർത്തുകയും ദൈവനാമമായ יהוהയെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: עִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരം
  rationale: സ്ഥിരമായ സ്ഥലനാമത്തിന്റെ നിർമാണബന്ധം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: ജനാലയിലൂടെ പുറത്തേക്കു നോക്കി
  rationale: അകത്തുനിന്നോ ഉയർന്ന സ്ഥാനത്തുനിന്നോ ജനാലവഴി നോക്കുന്നതെന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; താഴേക്കാണെന്നത് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: מְפַזֵּז
  choice: തുള്ളിച്ചാടുകയും
  rationale: അപൂർവമായ ക്രിയ സൂചിപ്പിക്കുന്ന ഉത്സാഹപൂർണവും കുതിച്ചുയരുന്നതുമായ ശരീരചലനം സജീവമായി നൽകുന്നു.
- source_word: וּמְכַרְכֵּר
  choice: ചുറ്റിത്തിരിയുകയും
  rationale: ആദ്യ ക്രിയയുമായി ലയിപ്പിക്കാതെ തിരിയുന്ന ചലനത്തിന്റെ പ്രത്യേക ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: ഹൃദയത്തിൽ അവനെ നിന്ദിച്ചു
  rationale: അവളുടെ ഉള്ളിലെ അവജ്ഞയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം ഔപചാരികവും വ്യക്തവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יהוהയുടെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ, അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: മീഖളുടെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ഹൃദയത്തിൽ അവനെ നിന്ദിച്ചു
  alternative: അവൾക്ക് അവനോട് വെറുപ്പു തോന്നി
  rationale: בזה എന്ന ക്രിയയിലെ അവജ്ഞ/നിസ്സാരീകരണ ഭാവവും בְּלִבָּהּ എന്ന ആന്തരിക വിലയിരുത്തലും നിലനിർത്തുന്നു; വികാരത്തെ വെറും വെറുപ്പായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ദൃശ്യത്തിന്റെ ചലനാത്മകതയ്ക്കായി ക്രിയകൾ വേർതിരിച്ചു നിലനിർത്തി; മൂലത്തിലെ സംഭവക്രമവും മീഖളുടെ ആന്തരിക അവജ്ഞയും വ്യക്തമായി പ്രകടമാക്കി.
