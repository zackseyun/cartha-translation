- from: യഹ്‌വെയുടെ പെട്ടകം ഗത്ത്യനായ[a] ഓബേദ്-ഏദോമിന്റെ വീട്ടിൽ മൂന്നു മാസം ഇരുന്നു. യഹ്‌വെ ഓബേദ്-ഏദോമിനെയും അവന്റെ മുഴുവൻ വീട്ടാരെയും[b] അനുഗ്രഹിച്ചു.
