language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן יְהוָ֜ה בֵּ֣ית עֹבֵ֥ד אֱדֹ֛ם הַ/גִּתִּ֖י שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת עֹבֵ֥ד אֱדֹ֖ם וְ/אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
translation:
  language: ml
  text: യഹ്‌വെയുടെ പെട്ടകം ഗത്തിൽ നിന്നുള്ള[a] ഓബേദ്-ഏദോമിന്റെ വീട്ടിൽ മൂന്നു മാസം തുടർന്നു. യഹ്‌വെ ഓബേദ്-ഏദോമിനെയും അവന്റെ മുഴുവൻ വീട്ടുകാരെയും[b] അനുഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഗത്ത്യൻ’; അതായത് ഗത്ത് പട്ടണവുമായി ബന്ധമുള്ള ഒരാൾ.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘അവന്റെ വീട് മുഴുവൻ.’ ഹീബ്രു പദത്തിന് കുടുംബത്തെയോ വിശാലമായ ഗാർഹികസമൂഹത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ഇരുന്നു
  rationale: ישׁב എന്ന ക്രിയയ്ക്ക് ‘ഇരിക്കുക, വസിക്കുക, നിലനിൽക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. പെട്ടകം കർത്താവായും കാലദൈർഘ്യം പിന്നാലെ വരുന്നതുമായ ഈ സന്ദർഭത്തിൽ, അതു അവിടെ തുടർന്നിരുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്ന ലളിതമായ പ്രയോഗമാണ് ‘ഇരുന്നു’.
- source_word: אֲרוֹן יְהוָה
  choice: യഹ്‌വെയുടെ പെട്ടകം
  rationale: അർഥബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; אֲרוֹן എന്നതിന് ഈ സന്ദർഭത്തിൽ സ്ഥാപിതവും മനസ്സിലാക്കാൻ എളുപ്പവുമായ പദമാണ് ‘പെട്ടകം’.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ഓബേദ്-ഏദോമിന്റെ വീട്ടിൽ
  rationale: ഇവിടെ בֵּית എന്നത് പെട്ടകം പാർത്ത ഭൗതികമായ വീടിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വീട്ടിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עֹבֵד אֱדֹם
  choice: ഓബേദ്-ഏദോം
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി വായിക്കാവുന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַגִּתִּי
  choice: ഗത്ത്യനായ
  rationale: ഗത്തുമായി ബന്ധമുള്ള ഒരാളെ സൂചിപ്പിക്കുന്ന ജനപദവിശേഷണം മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: മൂന്നു മാസം
  rationale: ഹീബ്രു കാലദൈർഘ്യപ്രയോഗം മലയാളത്തിൽ അധിക അവ്യയം കൂടാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיְבָרֶךְ
  choice: അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ പതിവും സന്ദർഭോചിതവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְאֶת כָּל בֵּיתוֹ
  choice: അവന്റെ മുഴുവൻ വീട്ടാരെയും
  rationale: ഇവിടെയുള്ള בֵּיתוֹ കുടുംബത്തെയും ഗാർഹികസമൂഹത്തെയും വിശാലമായി സൂചിപ്പിക്കാൻ കഴിയുന്നതിനാൽ ‘വീട്ടാർ’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം സ്വീകരിച്ചു; ‘വീട്’ എന്ന അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിനാമംകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്തു. ‘യഹ്‌വെ’ എന്ന രൂപം സാധാരണ പണ്ഡിതസമ്മതമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ അടുത്തായി പ്രതിനിധീകരിക്കുന്നു.
- issue: כָּל בֵּיתוֹ എന്നതിന്റെ പരിധി
  choice: അവന്റെ മുഴുവൻ വീട്ടാർ
  alternative: അവന്റെ വീട് മുഴുവൻ
  rationale: അനുഗ്രഹത്തിന്റെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ കുടുംബവും ഗാർഹികസമൂഹവും ഉൾപ്പെടുന്ന അർഥമാണ് സന്ദർഭത്തിൽ കൂടുതൽ സ്വാഭാവികം. എങ്കിലും ഹീബ്രുവിലെ ‘വീട്’ എന്ന വിശാലത അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഇരുന്നു’ എന്നത് പെട്ടകത്തിന്റെ തുടർന്നുള്ള സാന്നിധ്യം സ്വാഭാവികമായി അറിയിക്കുന്നു. ‘വീട്ടാർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലത്തിലെ സാമൂഹികവ്യാപ്തിയും പരമാവധി നിലനിർത്തുന്നു.
