base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/003.yaml
  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
translation:
  language: ml
  text: അവർ ദൈവത്തിന്റെ പെട്ടകം ഒരു പുതിയ വണ്ടിയിൽ കയറ്റി, കുന്നിൻമുകളിലുണ്ടായിരുന്ന അബീനാദാബിന്റെ വീട്ടിൽനിന്ന് അതു കൊണ്ടുവന്നു[a]. അബീനാദാബിന്റെ പുത്രന്മാരായ ഉസ്സയും അഹ്യോയും ആ പുതിയ വണ്ടി നയിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഗിബെയയിൽ ഉണ്ടായിരുന്ന അബീനാദാബിന്റെ വീട്ടിൽനിന്ന്’; ഈ പ്രയോഗം കുന്നിനെക്കുറിച്ചുള്ള വിവരണമെന്നതിനു പകരം ഒരു സ്ഥലനാമമായി വായിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: വണ്ടിയിൽ കയറ്റി
  rationale: רכב എന്ന ധാതുവിന്റെ കാരണാർത്ഥം ഇവിടെ പെട്ടകം വണ്ടിയുടെ മുകളിൽ വെക്കുകയോ കയറ്റുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘വണ്ടിയിൽ കയറ്റി’ എന്നു നൽകി.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: ഈ സന്ദർഭത്തിലെ വിശുദ്ധ പെട്ടകത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: עֲגָלָה חֲדָשָׁה
  choice: പുതിയ വണ്ടി
  rationale: עֲגָלָה എന്നത് ചരക്കു കൊണ്ടുപോകുന്ന വണ്ടിയാണ്; മലയാളത്തിൽ പൊതുവായി ഗ്രഹിക്കാവുന്ന ‘വണ്ടി’ യോജിക്കുന്നു. ആവർത്തനം മൂലപാഠംപോലെ നിലനിർത്തി.
- source_word: וַיִּשָּׂאֻהוּ
  choice: അതു കൊണ്ടുവന്നു
  rationale: נשא എന്നതിന് ഉയർത്തുക, ചുമക്കുക, കൊണ്ടുപോകുക എന്നീ അർത്ഥങ്ങളുണ്ട്. പെട്ടകം വണ്ടിയിലായതിനാൽ കൈകൊണ്ട് ചുമന്നു എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കാൻ സന്ദർഭാനുസൃതമായി ‘കൊണ്ടുവന്നു’ എന്നു നൽകി.
- source_word: מִבֵּית אֲבִינָדָב
  choice: അബീനാദാബിന്റെ വീട്ടിൽനിന്ന്
  rationale: ഹീബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: കുന്നിൻമുകളിലുണ്ടായിരുന്ന
  rationale: നിർദ്ദിഷ്ട ഉപപദത്തോടുകൂടിയ גִּבְעָהയെ പ്രധാന പാഠത്തിൽ ഭൂപ്രകൃതിവിവരണമായി എടുത്തു; സ്ഥലനാമമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וְעֻזָּא וְאַחְיוֹ
  choice: ഉസ്സയും അഹ്യോയും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ശബ്ദരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְּנֵי אֲבִינָדָב
  choice: അബീനാദാബിന്റെ പുത്രന്മാർ
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ בְּנֵי എന്നതിന് നേരിട്ടുള്ള ‘പുത്രന്മാർ’ എന്ന അർത്ഥമാണ് സ്വാഭാവികം.
- source_word: נֹהֲגִים
  choice: നയിക്കുകയായിരുന്നു
  rationale: נהג വണ്ടിയെയോ അതു വലിക്കുന്ന മൃഗങ്ങളെയോ നയിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ഓടിക്കുകയായിരുന്നു’ എന്നത് യന്ത്രവാഹനത്തിന്റെ ഭാവം നൽകാവുന്നതിനാൽ ‘നയിക്കുകയായിരുന്നു’ തിരഞ്ഞെടുത്തു.
