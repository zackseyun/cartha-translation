  edition: WLC
  text: וַ/יָּ֣קָם וַ/יֵּ֣לֶךְ דָּוִ֗ד וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ מִֽ/בַּעֲלֵ֖י יְהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵ֚ת אֲר֣וֹן הָ/אֱלֹהִ֔ים אֲשֶׁר נִקְרָ֣א שֵׁ֗ם שֵׁ֣ם יְהוָ֧ה צְבָא֛וֹת יֹשֵׁ֥ב הַ/כְּרֻבִ֖ים עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
translation:
  language: ml
  text: ദാവീദ് എഴുന്നേറ്റ്, തന്നോടുകൂടെയുണ്ടായിരുന്ന സകലജനത്തോടുംകൂടെ, യെഹൂദയിലെ ബാലെയിൽനിന്ന്[a] പുറപ്പെട്ടു; കെരൂബുകൾക്കു മീതെ സിംഹാസനസ്ഥനായ[d] സൈന്യങ്ങളുടെ യഹ്‌വേയുടെ നാമത്താൽ[b][c] വിളിക്കപ്പെടുന്ന ദൈവത്തിന്റെ പെട്ടകം അവിടെനിന്ന് കൊണ്ടുവരാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദയിലെ ബാലായിൽനിന്ന്.” ഇവിടെ ഹീബ്രുരൂപം അസാധാരണമാണ്; അത് കിര്യത്ത്-യെയാരീമുമായി ബന്ധപ്പെട്ട ഒരു സ്ഥലനാമത്തെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അതിന്റെമേൽ സൈന്യങ്ങളുടെ യഹ്‌വേയുടെ നാമം വിളിക്കപ്പെട്ടിരിക്കുന്നു.” ഹീബ്രു നാമകരണസൂത്രം വളരെ ചുരുക്കിയ രൂപത്തിലാണ്.'
    reason: lexical_alternative
  - marker: c
    text: 'പരമ്പരാഗതമായി: “സൈന്യങ്ങളുടെ കർത്താവ്” അല്ലെങ്കിൽ “ഗണങ്ങളുടെ യഹ്‌വേ.”'
    reason: lexical_alternative
  - marker: d
    text: അഥവാ “കെരൂബുകളുടെ ഇടയിൽ വസിക്കുന്ന.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: എഴുന്നേറ്റ് ... പോയി
  rationale: രണ്ട് ഹീബ്രു ക്രിയകളും നിലനിർത്തി കഥയുടെ തുടർച്ചയും പ്രവർത്തനാരംഭവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: തന്നോടുകൂടെയുണ്ടായിരുന്ന സകലജനത്തോടുമൊപ്പം
  rationale: ദാവീദിനൊപ്പം പോയ സമൂഹത്തിന്റെ പൂർണതയും അനുഗമനബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מִבַּעֲלֵי יְהוּדָה
  choice: യെഹൂദയിലെ ബാലെയിൽനിന്ന്
  rationale: മുൻപ്രത്യയമായ מִן (‘നിന്ന്’) ഔപചാരികമായി നിലനിർത്തുകയും അസാധാരണമായ രൂപത്തെ സ്ഥലനാമമായി വായിക്കുകയും ചെയ്യുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: പെട്ടകം അവിടെനിന്ന് കൊണ്ടുവരാൻ
  rationale: ഹിഫിൽ രൂപത്തിന്റെ ‘മുകളിലേക്കു കൊണ്ടുവരുക’ എന്ന അടിസ്ഥാനഭാവം സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘കൊണ്ടുവരുക’ എന്നു നൽകി, מִשָּׁם എന്നത് ‘അവിടെനിന്ന്’ എന്നു വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകം
  rationale: വിവരണാത്മക കഥാഭാഗത്തിലെ സ്ഥിരമായ പദപ്രയോഗം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: നാമത്താൽ ... വിളിക്കപ്പെടുന്ന
  rationale: ചുരുക്കിയിരിക്കുന്ന ഹീബ്രു നാമകരണസൂത്രത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; അതിനെ വെറും ഉടമസ്ഥതയായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: שֵׁם יְהוָה צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ യഹ്‌വേയുടെ നാമം
  rationale: יהוה എന്ന ഉടമ്പടിനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; צְבָאוֹת എന്നത് ആധുനിക വായനക്കാർക്ക് സുതാര്യമായ ‘സൈന്യങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יֹשֵׁב הַכְּרֻבִים עָלָיו
  choice: കെരൂബുകളുടെ മീതെ സിംഹാസനസ്ഥനായ
  rationale: പെട്ടകസംബന്ധമായ രാജസിംഹാസനചിത്രം പ്രകടമാക്കുന്നു; അവസാന സർവനാമത്തിന്റെ സൂചനയെ അമിതമായി നിർണ്ണയിക്കാതെ ‘മീതെ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് മറയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ശബ്ദരൂപത്തിൽ നൽകുന്നു.
- issue: צְבָאוֹת എന്ന ദൈവിക വിശേഷണം
  choice: സൈന്യങ്ങളുടെ
  alternative: സൈന്യാധിപനായ; ഗണങ്ങളുടെ
  rationale: ദൈവികമോ ഭൗമികമോ ആയ സൈന്യഗണങ്ങളെ ഉൾക്കൊള്ളാവുന്ന മൂലപദത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു; ‘സൈന്യാധിപൻ’ എന്ന അർത്ഥവികാസം പാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: പെട്ടകവുമായി ബന്ധപ്പെട്ട നാമകരണസൂത്രം
  choice: നാമത്താൽ—... യഹ്‌വേയുടെ നാമത്താൽ—വിളിക്കപ്പെടുന്ന
  alternative: അതിന്റെമേൽ യഹ്‌വേയുടെ നാമം വിളിക്കപ്പെട്ടിരിക്കുന്ന; യഹ്‌വേയുടെ നാമം വഹിക്കുന്ന
  rationale: שֵׁם എന്ന ആവർത്തനവും ഉടമ്പടിനാമവുമായി പെട്ടകത്തിനുള്ള ബന്ധവും സംരക്ഷിക്കുമ്പോൾ, ദൈവം പെട്ടകത്തിനുള്ളിൽ അടങ്ങിയിരിക്കുന്നു എന്ന ധാരണ സൃഷ്ടിക്കുന്നില്ല.
- issue: יֹשֵׁב എന്നതിലെ വാസം/സിംഹാസനസ്ഥത്വം
  choice: സിംഹാസനസ്ഥനായ
  alternative: വസിക്കുന്ന
  rationale: കെരൂബുകളോടും പെട്ടകത്തോടും ബന്ധപ്പെട്ട രാജകീയ സിംഹാസനചിത്രത്തിന് മുൻഗണന നൽകുന്നു; ‘വസിക്കുന്ന’ എന്ന സാധുവായ മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥാശൈലി ഉപയോഗിച്ചു. ‘സകലജനവും’, ‘നാമം’, ‘സിംഹാസനസ്ഥൻ’ തുടങ്ങിയ പദങ്ങൾ വാക്യത്തിന്റെ ഔന്നത്യം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. മൂലപാഠത്തിലെ സ്ഥലനാമപ്രശ്നവും നാമകരണസൂത്രത്തിലെ വ്യാകരണസാന്ദ്രതയും അടിക്കുറിപ്പുകളിലൂടെ തുറന്നുവെച്ചു.
