base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
translation:
  language: ml
  text: യാഹ്‌വെയുടെ പെട്ടകം ദാവീദിന്റെ നഗരത്തിലേക്കു[a] തന്റെ അടുക്കൽ കൊണ്ടുവരാൻ ദാവീദിനു മനസ്സുണ്ടായില്ല. ദാവീദ് അതിനെ വഴിതിരിച്ച് ഗിത്യനായ[b] ഓബേദ്-എദോമിന്റെ വീട്ടിലേക്കു തിരിച്ചുവിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദാവീദിന്റെ നഗരത്തിലേക്കു കയറ്റിക്കൊണ്ടുവരാൻ.’ എബ്രായ മുൻപ്രത്യയം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനത്തോടൊപ്പം മുകളിലേക്കുള്ള ചലനവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഗത്തിൽനിന്നുള്ളവനായ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: മനസ്സില്ലായിരുന്നു
  rationale: സമ്മതമോ സന്നദ്ധതയോ ഇല്ലായ്മയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘നിരസിച്ചു’ എന്നതിനെക്കാൾ മൃദുവായ ഈ പ്രയോഗം ദാവീദിന്റെ മടിയും തീരുമാനവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לְהָסִיר אֵלָיו
  choice: തന്റെ അടുക്കൽ ... കൊണ്ടുവരാൻ
  rationale: הֵסִיר എന്നതിന് അക്ഷരാർഥത്തിൽ ‘നീക്കുക/വഴിതിരിക്കുക’ എന്നാണെങ്കിലും, പെട്ടകം ദാവീദിന്റെ കേന്ദ്രത്തിലേക്കു മാറ്റുന്ന ഈ സന്ദർഭത്തിൽ ‘തന്റെ അടുക്കൽ കൊണ്ടുവരാൻ’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֲרוֹן יְהוָה
  choice: യാഹ്‌വെയുടെ പെട്ടകം
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; אֲרוֹן എന്നത് ഉടമ്പടിപ്പെട്ടകത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ ‘പെട്ടകം’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമത്തെ ഒരു സ്ഥാനപദംകൊണ്ട് മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עַל עִיר דָוִד
  choice: ദാവീദിന്റെ നഗരത്തിലേക്കു
  rationale: עַל ഇവിടെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. ഉയരത്തിലേക്കുള്ള ചലനത്തിന്റെ സൂചനയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיַּטֵּהוּ
  choice: അതിനെ വഴിതിരിച്ച് ... കൊണ്ടുപോയി
  rationale: נטה എന്ന ക്രിയയുടെ ‘മറ്റൊരു ദിശയിലേക്കു തിരിക്കുക’ എന്ന ദൃശ്യാർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന നൽകി.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ഓബേദ്-എദോമിന്റെ വീട്ടിലേക്ക്
  rationale: בֵּית എന്നത് വീടിനെയോ കുടുംബത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും, പെട്ടകം പാർപ്പിച്ച ഭൗതിക വസതിയാണ് ഈ സന്ദർഭത്തിലെ പ്രാഥമിക അർഥം.
- source_word: הַגִּתִּי
  choice: ഗിത്യനായ
  rationale: ഗത്ത് ദേശക്കാരനെ സൂചിപ്പിക്കുന്ന എബ്രായ ജനവിശേഷണം സംക്ഷിപ്തമായ പരമ്പരാഗത രൂപത്തിൽ നിലനിർത്തുന്നു; ഭൂമിശാസ്ത്രപരമായ വ്യക്തീകരണം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പൊതുവായ സ്ഥാനപദമായി മാറ്റാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘പെട്ടകം,’ ‘ദാവീദിന്റെ നഗരം’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അപരിചിതമായ ജനവിശേഷണത്തിന് അടിക്കുറിപ്പിൽ വ്യക്തീകരണം നൽകി.
