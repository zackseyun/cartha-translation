  text: וַ/יָּ֥שָׁב דָּוִ֖ד לְ/בָרֵ֣ךְ אֶת בֵּית֑/וֹ וַ/תֵּצֵ֞א מִיכַ֤ל בַּת שָׁאוּל֙ לִ/קְרַ֣את דָּוִ֔ד וַ/תֹּ֗אמֶר מַה נִּכְבַּ֨ד הַ/יּ֜וֹם מֶ֣לֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נִגְלָ֤ה הַ/יּוֹם֙ לְ/עֵינֵ֨י אַמְה֣וֹת עֲבָדָ֔י/ו כְּ/הִגָּל֥וֹת נִגְל֖וֹת אַחַ֥ד הָ/רֵקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the servant girls of his servants[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
translation:
  language: ml
  text: 'പിന്നെ ദാവീദ് തന്റെ വീട്ടുകാരെ അനുഗ്രഹിക്കാൻ മടങ്ങിവന്നു. എന്നാൽ ശൗലിന്റെ മകൾ മീഖൾ ദാവീദിനെ എതിരേൽക്കാൻ പുറത്തുവന്ന് പറഞ്ഞു: “ഇസ്രായേലിന്റെ രാജാവ് ഇന്ന് എത്ര മാന്യനായിരുന്നല്ലോ![a] ഇന്ന് തന്റെ അടിമകളുടെ അടിമസ്ത്രീകളുടെ[b] കൺമുന്നിൽ സ്വയം അനാവൃതനായി, തരംകെട്ടവരിൽ ഒരുവൻ നാണമില്ലാതെ തന്നെത്തന്നെ തുറന്നുകാട്ടുന്നതുപോലെ![c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇസ്രായേലിന്റെ രാജാവ് ഇന്ന് എത്ര മഹത്ത്വമുള്ളവനായിരുന്നല്ലോ!” സന്ദർഭത്തിൽ ഈ വാക്കുകൾ വ്യക്തമായ പരിഹാസമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ദാസിമാരുടെ.” എബ്രായപദം താഴ്ന്ന പദവിയിലുള്ള വീട്ടിലെ ബന്ധിത സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “വിലകെട്ടവരിൽ ഒരുവൻ ലജ്ജയില്ലാതെ സ്വയം വെളിപ്പെടുത്തുന്നതുപോലെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבָרֵךְ אֶת־בֵּיתוֹ
  choice: തന്റെ വീട്ടുകാരെ അനുഗ്രഹിക്കാൻ
  rationale: ‘വീട്’ എന്ന പദം ഇവിടെ വാസസ്ഥലത്തെക്കാൾ കുടുംബത്തെയും വീട്ടിലുള്ളവരെയും സൂചിപ്പിക്കുന്നു; അനുഗ്രഹത്തിന്റെ ലക്ഷ്യം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘വീട്ടുകാർ’ ഉപയോഗിച്ചു.
- source_word: מִיכַל בַּת־שָׁאוּל
  choice: ശൗലിന്റെ മകൾ മീഖൾ
  rationale: ശൗലുമായുള്ള മീഖളുടെ ബന്ധത്തിന് ആഖ്യാനം നൽകുന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: מַה־נִּכְבַּד הַיּוֹם
  choice: ഇന്ന് എത്ര മാന്യനായിരുന്നല്ലോ
  rationale: כבד എന്നതിന്റെ മാനം/ബഹുമതി എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും, മലയാളത്തിലെ ‘-ല്ലോ’ എന്ന പ്രയോഗത്തിലൂടെ സന്ദർഭത്തിലെ പരിഹാസസ്വരം സ്വാഭാവികമായി കേൾപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: נִגְלָה
  choice: സ്വയം അനാവൃതനായി
  rationale: Niphal രൂപം സ്വയം മറനീക്കപ്പെട്ടതായി/തുറന്നുകാട്ടിയതായി സൂചിപ്പിക്കുന്നു. ശരീരത്തിന്റെ ഏത് ഭാഗമെന്നു മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അത് കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: לְעֵינֵי
  choice: കൺമുന്നിൽ
  rationale: ‘കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ പൊതുവായും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אַמְהוֹת עֲבָדָיו
  choice: സ്വന്തം ദാസന്മാരുടെ അടിമസ്ത്രീകൾ
  rationale: אמה സൂചിപ്പിക്കുന്ന കീഴ്നിലയിലുള്ള ബന്ധിത സ്ത്രീകളുടെ സാമൂഹികപദവി ‘അടിമസ്ത്രീകൾ’ എന്നു നിലനിർത്തി; עבדיו എന്ന ബന്ധം ‘ദാസന്മാരുടെ’ എന്നും സംരക്ഷിച്ചു.
- source_word: כְּהִגָּלוֹת נִגְלוֹת
  choice: നാണമില്ലാതെ തന്നെത്തന്നെ തുറന്നുകാട്ടുന്നതുപോലെ
  rationale: ആവർത്തിത ക്രിയാരൂപത്തിന്റെ തീവ്രതയും മീഖളുടെ അപമാനകരമായ വിലയിരുത്തലും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אַחַד הָרֵקִים
  choice: തരംകെട്ടവരിൽ ഒരുവൻ
  rationale: ריקים എന്നത് ശൂന്യരും വിലകെട്ടവരുമായ സാമൂഹികമായി നിന്ദ്യരായ ആളുകളെ സൂചിപ്പിക്കുന്നു; അതിന്റെ അധിക്ഷേപഭാവം സമകാലികവും മാന്യവുമായ മലയാളത്തിൽ പകർത്തുന്നു.
theological_decisions:
- issue: אַמְהוֹת എന്നതിലെ സാമൂഹികപദവി
  choice: അടിമസ്ത്രീകൾ
  alternative: ദാസിമാർ / വേലക്കാരികൾ
  rationale: സന്ദർഭത്തിലെ അപമാനം താഴ്ന്ന സാമൂഹികപദവിയിലുള്ള സ്ത്രീകളുടെ മുമ്പിൽ രാജാവ് അനാവൃതനായെന്ന ആരോപണത്തെ ആശ്രയിക്കുന്നു. അതിനാൽ ബന്ധിതപദവി മൃദൂകരിക്കാതെ നിലനിർത്തി.
- issue: ദാവീദിന്റെ ‘അനാവൃതനാകൽ’ എത്രത്തോളം ആയിരുന്നു
  choice: സ്വയം അനാവൃതനായി / തന്നെത്തന്നെ തുറന്നുകാട്ടി
  alternative: വസ്ത്രം അഴിച്ച് നഗ്നനായി
  rationale: മൂലപാഠം തുറന്നുകാട്ടലിനെ ശക്തമായി വിശേഷിപ്പിക്കുന്നുവെങ്കിലും പൂർണനഗ്നതയോ പ്രത്യേക ശരീരഭാഗമോ നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ ആ അവ്യക്തത സംരക്ഷിച്ചു.
- issue: മീഖളുടെ വാക്കുകളിലെ പരിഹാസം
  choice: ‘എത്ര മാന്യനായിരുന്നല്ലോ!’ എന്ന പരിഹാസസ്വരം
  alternative: ‘എത്ര മഹത്ത്വമുള്ളവനായിരുന്നു!’
  rationale: כבד എന്ന പദത്തിന്റെ ബഹുമതി/മഹത്ത്വ അർഥം നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭം ആവശ്യപ്പെടുന്ന പരിഹാസം മലയാളവാക്യഘടനയിലൂടെ വ്യക്തമാക്കി; അവളുടെ വിലയിരുത്തലിനെ വസ്തുതാപരമായ പ്രസ്താവനയാക്കി മാറ്റിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. രാജസദസ്സിന്റെ പഴമ സൂചിപ്പിക്കാൻ അത്യന്തം പുരാതന പദങ്ങൾ ഉപയോഗിച്ചില്ല. മീഖളുടെ പരിഹാസവും സാമൂഹിക അവഹേളനവും വ്യക്തമായി നിലനിർത്തി; എന്നാൽ മൂലപാഠം പറയാത്ത പൂർണനഗ്നത പോലുള്ള വിശദാംശങ്ങൾ ചേർത്തില്ല.
