revisions:
- from: 'പിന്നെ ദാവീദ് തന്റെ വീട്ടുകാരെ അനുഗ്രഹിക്കാൻ മടങ്ങിവന്നു. എന്നാൽ ശൗലിന്റെ മകൾ മീഖൾ ദാവീദിനെ എതിരേൽക്കാൻ പുറത്തുവന്ന് പറഞ്ഞു: “ഇസ്രായേൽരാജാവ് ഇന്ന് എത്ര മാന്യനായിരുന്നല്ലോ![a] തരംകെട്ടവരിൽ ഒരുവൻ നാണമില്ലാതെ തന്നെത്തന്നെ തുറന്നുകാട്ടുന്നതുപോലെ, അങ്ങ് ഇന്ന് സ്വന്തം ദാസന്മാരുടെ അടിമസ്ത്രീകളുടെ[b] കൺമുന്നിൽ സ്വയം അനാവൃതനായല്ലോ![c]”'
  to: 'പിന്നെ ദാവീദ് തന്റെ വീട്ടുകാരെ അനുഗ്രഹിക്കാൻ മടങ്ങിവന്നു. എന്നാൽ ശൗലിന്റെ മകൾ മീഖൾ ദാവീദിനെ എതിരേൽക്കാൻ പുറത്തുവന്ന് പറഞ്ഞു: “ഇസ്രായേലിന്റെ രാജാവ് ഇന്ന് എത്ര മാന്യനായിരുന്നല്ലോ![a] ഇന്ന് തന്റെ അടിമകളുടെ അടിമസ്ത്രീകളുടെ[b] കൺമുന്നിൽ സ്വയം അനാവൃതനായി, തരംകെട്ടവരിൽ ഒരുവൻ നാണമില്ലാതെ തന്നെത്തന്നെ തുറന്നുകാട്ടുന്നതുപോലെ![c]”'
