source:
  edition: WLC
  text: וַ/יָּבִ֜אוּ אֶת אֲר֣וֹן יְהוָ֗ה וַ/יַּצִּ֤גוּ אֹת/וֹ֙ בִּ/מְקוֹמ֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָטָה ל֖/וֹ דָּוִ֑ד וַ/יַּ֨עַל דָּוִ֥ד עֹל֛וֹת לִ/פְנֵ֥י יְהוָ֖ה וּ/שְׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
translation:
  language: ml
  text: അവർ യഹ്‌വേയുടെ പെട്ടകം കൊണ്ടുവന്ന്, ദാവീദ് അതിനായി അടിച്ചിരുന്ന കൂടാരത്തിനകത്ത് അതിന്റെ സ്ഥാനത്ത് വെച്ചു. പിന്നെ ദാവീദ് യഹ്‌വേയുടെ സന്നിധിയിൽ ഹോമയാഗങ്ങളും സമാധാനയാഗങ്ങളും[a] അർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘കൂട്ടായ്മയാഗങ്ങൾ’; മറ്റൊരു സാധ്യത: ‘ക്ഷേമയാഗങ്ങൾ.’ എബ്രായം: שְׁלָמִים.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: യഹ്‌വെയുടെ പെട്ടകം
  rationale: אֲרוֹן എന്നത് വിശുദ്ധ പെട്ടകത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘നിയമം’ എന്ന പദം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല. יְהוָה വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיָּבִאוּ
  choice: കൊണ്ടുവന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം പെട്ടകത്തെ നിശ്ചിത സ്ഥലത്തേക്ക് കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള പ്രവൃത്തിയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘കൊണ്ടുവന്ന്’ ഉപയോഗിച്ചു.
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  choice: അതിന്റെ സ്ഥാനത്ത് വെച്ചു
  rationale: יצג ഇവിടെ ഒരു വസ്തുവിനെ നിശ്ചിത സ്ഥാനത്ത് സ്ഥാപിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: בְּתוֹךְ הָאֹהֶל אֲשֶׁר נָטָה לוֹ דָּוִד
  choice: ദാവീദ് അതിനായി അടിച്ചിരുന്ന കൂടാരത്തിനകത്ത്
  rationale: נטה കൂടാരവുമായി ഉപയോഗിക്കുമ്പോൾ കൂടാരം അടിക്കുക അഥവാ നിവർത്തുക എന്നാണ്. പെട്ടകം എത്തിക്കുന്നതിന് മുമ്പേ കൂടാരം അടിച്ചിരുന്നു എന്ന കാലബന്ധം ‘അടിച്ചിരുന്ന’ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעַל דָּוִד עֹלוֹת
  choice: ദാവീദ് … ഹോമയാഗങ്ങൾ … അർപ്പിച്ചു
  rationale: עלה ബലിസന്ദർഭത്തിൽ യാഗം അർപ്പിക്കുക എന്ന അർഥം നൽകുന്നു; עֹלוֹת പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗങ്ങളുടെ അംഗീകൃത മലയാളപദമായ ‘ഹോമയാഗങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וּשְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: שְׁלָמִים സമാധാനം, ക്ഷേമം, ദൈവസന്നിധിയിലെ കൂട്ടായ്മ എന്നിവയുമായി ബന്ധപ്പെട്ട യാഗവർഗമാണ്. പരിചിതമായ ‘സമാധാനയാഗങ്ങൾ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന സ്ഥല-ആരാധനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘സന്നിധിയിൽ’ എന്നു നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കാൻ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: שְׁלָמִים എന്ന യാഗനാമത്തിന്റെ അർഥവ്യാപ്തി
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ; ക്ഷേമയാഗങ്ങൾ
  rationale: ഈ പദത്തിന്റെ സമാധാനം, സമഗ്രക്ഷേമം, ദൈവസന്നിധിയിലെ പങ്കാളിത്തം എന്നീ അർഥസാധ്യതകളിൽ ഒന്നിനെ മാത്രം അന്തിമമായി നിർണയിക്കാതെ, പരിചിതമായ പദം മുഖ്യപാഠത്തിലും മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘കൂടാരം അടിക്കുക,’ ‘യാഗം അർപ്പിക്കുക,’ ‘സന്നിധിയിൽ’ എന്നീ സ്വാഭാവിക പ്രയോഗങ്ങൾ സ്വീകരിച്ചു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘നിയമ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
