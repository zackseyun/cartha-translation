  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മുപ്പതിനായിരം എന്ന സംഖ്യ മുമ്പുള്ള മുഴുവൻ സംഘത്തെയും വിശദീകരിക്കുന്നതായി വ്യക്തമാക്കാൻ ഇടവരകൾ ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
