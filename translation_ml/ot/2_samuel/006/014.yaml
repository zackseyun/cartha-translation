id: 2SA.6.14
reference: 2 Samuel 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/דָוִ֛ד מְכַרְכֵּ֥ר בְּ/כָל עֹ֖ז לִ/פְנֵ֣י יְהוָ֑ה וְ/דָוִ֕ד חָג֖וּר אֵפ֥וֹד בָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
translation:
  language: ml
  text: ദാവീദ് യഹ്‌വേയുടെ സന്നിധിയിൽ തന്റെ മുഴുവൻ ശക്തിയോടെ നൃത്തം ചെയ്യുകയായിരുന്നു[a]; ദാവീദ് ചണനൂൽകൊണ്ടുള്ള ഒരു ഏഫോദ് ധരിച്ചിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചുറ്റിത്തിരിഞ്ഞ് നൃത്തം ചെയ്യുകയായിരുന്നു’ അല്ലെങ്കിൽ ‘ആവേശത്തോടെ ചാടിക്കളിക്കുകയായിരുന്നു’; എബ്രായപദം ആഘോഷപൂർവമായ ഊർജസ്വല ചലനത്തെ ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഏഫോദ് വ്യതിരിക്തമായ ഒരു പുരോഹിതസംബന്ധമായ അഥവാ ആരാധനാസംബന്ധമായ വസ്ത്രമായിരുന്നു; ഇവിടെ ദാവീദ് ധരിച്ചിരുന്നത് ചണനൂൽകൊണ്ടുള്ള ഏഫോദാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  choice: നൃത്തം ചെയ്യുകയായിരുന്നു
  rationale: ഈ പങ്കാളിത്തരൂപം ആഘോഷപൂർവമായ ഊർജസ്വലമായ ശരീരചലനത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘നൃത്തം ചെയ്യുകയായിരുന്നു’ സ്വാഭാവികവും വ്യക്തവുമാണ്; കൂടുതൽ നിർദിഷ്ടമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּכָל עֹז
  choice: സർവശക്തിയോടുംകൂടെ
  rationale: പൂർണമായ ശക്തിപ്രയോഗവും തീവ്രതയും പ്രകടിപ്പിക്കുന്ന പ്രയോഗം; മൂലപാഠത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സാന്നിധ്യത്തിൽ’ എന്ന അർഥം ഇവിടെ സ്വാഭാവികമായി നൽകുകയും ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തിന്റെ വ്യക്തിനാമസ്വഭാവം സംരക്ഷിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: חָגוּר
  choice: ധരിച്ചിരുന്നു
  rationale: വസ്ത്രം ചുറ്റിക്കെട്ടിയതോ അണിഞ്ഞതോ ആയ അവസ്ഥയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֵפוֹד
  choice: ഏഫോദ്
  rationale: കൃത്യമായ മലയാള സമാനപദമില്ലാത്ത പ്രത്യേക ഇസ്രായേല്യ ആരാധനാവസ്ത്രത്തിന്റെ സാങ്കേതികനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בָּד
  choice: ചണനൂൽ
  rationale: ഇവിടെ വസ്ത്രത്തിന്റെ ലിനൻ വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; ഗുണമേന്മയെക്കുറിച്ച് മൂലപാഠത്തിലില്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: ഏഫോദിന്റെ സ്വഭാവം
  choice: സാങ്കേതിക പദം നിലനിർത്തി, വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി
  alternative: പുരോഹിതവസ്ത്രം
  rationale: ‘പുരോഹിതവസ്ത്രം’ എന്നു മുഖ്യപാഠത്തിൽ പറയുന്നത് വസ്ത്രത്തിന്റെ കൃത്യരൂപവും ഈ സന്ദർഭത്തിലെ ദാവീദിന്റെ പങ്കും അനാവശ്യമായി നിർവചിച്ചേക്കാം; ‘ഏഫോദ്’ മൂലപദത്തിന്റെ സാംസ്കാരിക പ്രത്യേകതയും വ്യാഖ്യാനതീവ്രതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ക്രിയയുടെ ഊർജസ്വലതയും ദൈവനാമത്തിന്റെ വ്യക്തിനാമസ്വഭാവവും സാംസ്കാരിക സാങ്കേതികപദമായ ‘ഏഫോദ്’ എന്നതും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
