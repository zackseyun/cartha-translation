reference: 2 Samuel 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/דָוִד֙ וְ/כָל בֵּ֣ית יִשְׂרָאֵ֔ל מַעֲלִ֖ים אֶת אֲר֣וֹן יְהוָ֑ה בִּ/תְרוּעָ֖ה וּ/בְ/ק֥וֹל שׁוֹפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/015.yaml
  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
translation:
  language: ml
  text: അങ്ങനെ ദാവീദും ഇസ്രായേൽഗൃഹം മുഴുവനും ആർപ്പുവിളികളോടെയും[a] കൊമ്പിന്റെ നാദത്തോടെയും[b] യഹ്‌വെയുടെ പെട്ടകം കയറ്റിക്കൊണ്ടുവരികയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആഹ്ലാദഘോഷത്തോടെ’; എബ്രായപദത്തിന് സന്തോഷപൂർവമായ ഉച്ചത്തിലുള്ള ഘോഷം എന്ന അർത്ഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കാഹളനാദത്തോടെ’; എബ്രായത്തിലെ ശോഫാർ കൊമ്പുകൊണ്ടുള്ള വാദ്യമാണ്, സാധാരണയായി ചെമ്മരിയാടിന്റെ കൊമ്പ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: കയറ്റിക്കൊണ്ടുവരികയായിരുന്നു
  rationale: ഹിഫീൽ വർത്തമാനകൃത്ത് ആഖ്യാനത്തിലെ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കയറ്റിക്കൊണ്ടുവരികയായിരുന്നു’ എന്നത് ആ പുരോഗമനഭാവവും ഉയർന്ന സ്ഥലത്തേക്കുള്ള നീക്കവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹം
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ ഗൃഹം’ എന്ന കുടുംബപരവും സമൂഹപരവുമായ പ്രയോഗം ‘ഇസ്രായേൽഗൃഹം’ എന്നു നിലനിർത്തി; ‘മുഴുവനും’ എന്നത് כָל എന്ന പദത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֲרוֹן יְהוָה
  choice: യഹ്‌വെയുടെ പെട്ടകം
  rationale: אֲרוֹן എന്നതിന് സന്ദർഭോചിതമായ പരമ്പരാഗത മലയാളപദം ‘പെട്ടകം’ ആണ്; ദൈവനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുനാമമോ സ്ഥാനനാമമോ ആക്കാതെ, അതിന്റെ ഉടമ്പടിനാമസ്വഭാവം കാത്തുസൂക്ഷിക്കുന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: תְרוּעָה
  choice: ആർപ്പുവിളികൾ
  rationale: ഈ പദത്തിന് ഉച്ചത്തിലുള്ള വിളി, ആഹ്ലാദഘോഷം, ജയഘോഷം എന്നീ അർത്ഥസാധ്യതകളുണ്ട്. പിന്നാലെ ശോഫാറിന്റെ ശബ്ദം പ്രത്യേകം പറയുന്നതിനാൽ ഇവിടെ മനുഷ്യരുടെ ശബ്ദഘോഷം സൂചിപ്പിക്കുന്ന ‘ആർപ്പുവിളികൾ’ തെരഞ്ഞെടുത്തു.
- source_word: קוֹל שׁוֹפָר
  choice: കൊമ്പിന്റെ നാദം
  rationale: קוֹל എന്നത് ‘ശബ്ദം/നാദം’ എന്നും שׁוֹפָר കൊമ്പുകൊണ്ടുള്ള വാദ്യം—പലപ്പോഴും ആട്ടുകൊമ്പ്—എന്നും സൂചിപ്പിക്കുന്നു. ആധുനിക ലോഹവാദ്യം എന്നു തെറ്റിദ്ധരിക്കാവുന്ന ‘കാഹളം’ എന്നതിനെക്കാൾ ‘കൊമ്പ്’ ഉറവിടത്തോട് അടുത്തതാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ സ്ഥാനനാമമായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, വ്യക്തിനാമത്തിന്റെ സ്വഭാവം നിലനിർത്താൻ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; ‘യഹോവ’ എന്ന രൂപം പിന്നീടുണ്ടായ സംയുക്ത ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഇസ്രായേൽഗൃഹം’ മൂലത്തിലെ സമൂഹ-കുടുംബ രൂപകം നിലനിർത്തുന്നു; ‘ആർപ്പുവിളികൾ’, ‘കൊമ്പിന്റെ നാദം’ എന്നിവ ഉത്സവഘോഷത്തിന്റെ ദൃശ്യവും ശബ്ദവും സ്വാഭാവികമായി പകരുന്നു.
