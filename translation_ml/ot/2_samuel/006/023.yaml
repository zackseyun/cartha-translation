id: 2SA.6.23
reference: 2 Samuel 6:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/מִיכַל֙ בַּת שָׁא֔וּל לֹֽא הָ֥יָה לָ֖/הּ יָ֑לֶד עַ֖ד י֥וֹם מוֹתָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/023.yaml
  text: And Michal the daughter of Saul had no child until the day of her death[a].
translation:
  language: ml
  text: ശൗലിന്റെ മകളായ മീഖളിന് ഒരു കുട്ടിയും[a] മരണദിവസംവരെ ഉണ്ടായില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സന്തതി’; എബ്രായപദം ആൺകുഞ്ഞിനെ മാത്രം അല്ല, പൊതുവായി ഒരു കുട്ടിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  choice: മീഖളിന്
  rationale: לְ ചേർന്നുള്ള എബ്രായ അസ്തിത്വപ്രയോഗം ഉടമസ്ഥതയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ദാതൃവിഭക്തിയോടുകൂടിയ ‘മീഖളിന് ... ഉണ്ടായില്ല’ സ്വാഭാവികവും കൃത്യവുമാണ്. വാക്യത്തിന്റെ തുടക്കത്തിലെ וּ കഥാസംബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും ഒറ്റവാക്യമായ മലയാള പരിഭാഷയിൽ നിർബന്ധമായി ‘എന്നാൽ/അങ്ങനെ’ ചേർക്കേണ്ടതില്ല.
- source_word: בַּת שָׁאוּל
  choice: ശൗലിന്റെ മകളായ
  rationale: വംശബന്ധം വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ മീഖളിനെ സ്വാഭാവികമായി വിശേഷിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לֹא הָיָה לָהּ
  choice: ഉണ്ടായില്ല
  rationale: ‘അവൾക്കു ഉണ്ടായിരുന്നില്ല’ എന്ന എബ്രായ ഉടമസ്ഥതാപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: יָלֶד
  choice: ഒരു കുട്ടിയും
  rationale: ഇവിടെയുള്ള ഏകവചനനാമം ആൺകുഞ്ഞിനെ മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല; ‘കുട്ടി’ ലിംഗനിരപേക്ഷമായ പൊതുവായ അർഥം സംരക്ഷിക്കുന്നു. നിഷേധവാക്യത്തിൽ ‘ഒരു കുട്ടിയും’ സ്വാഭാവികമാണ്.
- source_word: עַד יוֹם מוֹתָהּ
  choice: മരിക്കുന്ന ദിവസംവരെ
  rationale: മരണദിവസംവരെയുള്ള ജീവിതകാലമൊട്ടാകെയുള്ള സന്താനരാഹിത്യം വ്യക്തമാക്കുന്ന, മൂലപാഠത്തോട് അടുത്തും സ്വാഭാവികവുമായ കാലപ്രയോഗം.
theological_decisions:
- issue: ‘മരിക്കുന്ന ദിവസംവരെ’ എന്ന കാലപ്രയോഗത്തിന്റെ സൂചന
  choice: ജീവിതകാലം മുഴുവൻ കുട്ടിയില്ലായിരുന്നു എന്ന പ്രസ്താവനയായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ജീവപര്യന്തം’ എന്നു ചുരുക്കി വ്യാഖ്യാനാത്മകമായി നൽകുക.
  rationale: മൂലപാഠത്തിലെ ‘മരണദിവസംവരെ’ എന്ന രൂപം നിലനിർത്തുന്നു; മരണശേഷം എന്തെങ്കിലും സംഭവിക്കുമെന്ന അസംബന്ധസൂചനയോ അതിലുപരി ദൈവശാസ്ത്രപരമായ നിഗമനമോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പരമ്പരാഗത ബൈബിൾനാമരൂപങ്ങളോട് പൊരുത്തപ്പെടുന്ന ‘ശൗൽ’, ‘മീഖൾ’ എന്നിവയിൽ, ഇവിടെ സാധാരണ ഉച്ചാരണസൗകര്യത്തിനായി ‘മീഖൾ’ എന്നതിന്റെ ദാതൃരൂപം ‘മീഖളിന്’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
