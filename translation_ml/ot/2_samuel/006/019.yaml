base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
translation:
  language: ml
  text: അവൻ സകല ജനത്തിനും, ഇസ്രായേലിന്റെ മുഴുവൻ ജനസമൂഹത്തിനും—പുരുഷന്മാർക്കും സ്ത്രീകൾക്കും—ഓരോരുത്തർക്കും ഒരു അപ്പം, ഇറച്ചിയുടെ ഒരു പങ്ക്[a], ഒരു ഉണക്കമുന്തിരിയട എന്നിവ വിതരണം ചെയ്തു. പിന്നെ ജനമെല്ലാം അവരവരുടെ വീടുകളിലേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒരു അളവ്/വിഹിതം.’ എബ്രായയിലെ אֶשְׁפָּר എന്ന പദം അപൂർവമാണ്. പ്രത്യേകിച്ച് 1 ദിനവൃത്താന്തം 16:3-ലെ സമാന്തരവിവരണത്തിന്റെ അടിസ്ഥാനത്തിൽ, പലരും ഇവിടെ അതിനെ ഇറച്ചിയുടെ ഒരു പങ്കായി മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: വിതരണം ചെയ്തു
  rationale: പീയേൽ രൂപം ജനക്കൂട്ടത്തിലെ ഓരോരുത്തർക്കും വിഹിതങ്ങൾ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  choice: സകല ജനത്തിനും, ഇസ്രായേലിന്റെ മുഴുവൻ ജനസമൂഹത്തിനും
  rationale: പരസ്പരം വിശദീകരിക്കുകയും ഊന്നൽ നൽകുകയും ചെയ്യുന്ന രണ്ട് എബ്രായ പ്രയോഗങ്ങളും ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: പുരുഷന്മാർക്കും സ്ത്രീകൾക്കും
  rationale: അക്ഷരാർഥം ‘പുരുഷൻമുതൽ സ്ത്രീവരെ’; കൂടിവന്ന ജനത്തിൽ ഇരുകൂട്ടരും ഉൾപ്പെട്ടുവെന്ന സമഗ്രമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְאִישׁ
  choice: ഓരോരുത്തർക്കും
  rationale: മുൻവാക്യത്തിൽ പുരുഷന്മാരും സ്ത്രീകളും ഉൾപ്പെട്ടതിനാൽ, വിതരണാർഥമുള്ള ഏകവചനത്തിന്റെ ആശയം ലിംഗപരമായി പരിമിതപ്പെടുത്താതെ വ്യക്തമാക്കുന്നു.
- source_word: חַלַּת לֶחֶם אַחַת
  choice: ഓരോ അപ്പവും
  rationale: חַלָּה ഇവിടെ ഒരു അപ്പം അഥവാ അപ്പക്കട്ടയെ സൂചിപ്പിക്കുന്നു; ‘അപ്പം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֶשְׁפָּר אֶחָד
  choice: ഒരു പങ്ക് ഇറച്ചി
  rationale: അപൂർവവും അർഥവിവാദമുള്ളതുമായ പദമാണിത്. 1 ദിനവൃത്താന്തം 16:3-ലെ സമാന്തരവിവരണത്തിന്റെ വെളിച്ചത്തിൽ ഇറച്ചിയുടെ ഒരു വിഹിതം എന്നത് സാദ്ധ്യമായ അർഥമാണ്; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲשִׁישָׁה אֶחָת
  choice: ഓരോ ഉണക്കമുന്തിരിയടയും
  rationale: ഞെക്കിയുണ്ടാക്കിയ, സാധാരണ ഉണക്കമുന്തിരികൊണ്ടുള്ള അടയെ ഈ പദം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഭക്ഷ്യവസ്തുവിന്റെ രൂപം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וַיֵּלֶךְ כָּל הָעָם אִישׁ לְבֵיתוֹ
  choice: പിന്നെ ജനമെല്ലാം അവരവരുടെ വീടുകളിലേക്കു പോയി
  rationale: ജനക്കൂട്ടം പിരിഞ്ഞ് ഓരോരുത്തരും സ്വന്തം വീട്ടിലേക്കു മടങ്ങിയെന്ന വിതരണ ഏകവചനത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
