reference: 2 Samuel 6:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/נְקַלֹּ֤תִי עוֹד֙ מִ/זֹּ֔את וְ/הָיִ֥יתִי שָׁפָ֖ל בְּ/עֵינָ֑/י וְ/עִם הָֽ/אֲמָהוֹת֙ אֲשֶׁ֣ר אָמַ֔רְתְּ עִמָּ֖/ם אִכָּבֵֽדָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/022.yaml
  text: And I will make myself even more contemptible than this[a], and I will be lowly in my own eyes; but with the servant girls of whom you have spoken, with them I will be honored.
translation:
  language: ml
  text: ഞാൻ എന്നെത്തന്നെ ഇതിലും അധികം നിസ്സാരനാക്കും; എന്റെ സ്വന്തം ദൃഷ്ടിയിൽ ഞാൻ താഴ്ന്നവനായിരിക്കും. എന്നാൽ നീ പറഞ്ഞ ആ അടിമസ്ത്രീകളോടൊപ്പം[a] തന്നെയാണ് ഞാൻ ബഹുമാനിക്കപ്പെടുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദാസിമാർ’ / ‘സ്ത്രീപരിചാരികമാർ.’ എബ്രായപദം താഴ്ന്ന ഗൃഹപദവിയിലുള്ള സ്ത്രീ അടിമകളെയോ ദാസിമാരെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְקַלֹּתִי
  choice: ഞാൻ എന്നെത്തന്നെ … നിസ്സാരനാക്കും
  rationale: קלל എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം നിസ്സാരനായി കണക്കാക്കപ്പെടുക, വിലകുറഞ്ഞവനാകുക എന്ന ആശയം നൽകുന്നു. സന്ദർഭത്തിൽ ദാവീദ് മനഃപൂർവമായ സ്വയംതാഴ്ത്തലിനെ സ്വീകരിക്കുന്നതിനാൽ, സ്വാഭാവിക മലയാളത്തിൽ കർത്താവിലേക്കുതന്നെ മടങ്ങുന്ന അർഥം പ്രകടമാക്കി.
- source_word: עוֹד מִזֹּאת
  choice: ഇതിലും അധികം
  rationale: עוֹד തീവ്രത വർധിപ്പിക്കുകയും מִזֹּאת മുൻവാക്യത്തിൽ മീഖാൽ പറഞ്ഞതുമായുള്ള താരതമ്യം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהָיִיתִי שָׁפָל בְּעֵינָי
  choice: എന്റെ സ്വന്തം കണ്ണിൽ ഞാൻ താണവനായിരിക്കും
  rationale: שָׁפָל എന്നത് താഴ്ന്നവൻ/എളിയവൻ എന്ന സാമൂഹിക-മാനമാന്യതാ ഭാവം വഹിക്കുന്നു. ‘എന്റെ കണ്ണിൽ’ എന്ന എബ്രായ പ്രയോഗം സ്വന്തം വിലയിരുത്തലിൽ എന്ന അർഥത്തിൽ നിലനിർത്തി.
- source_word: הָאֲמָהוֹת
  choice: അടിമസ്ത്രീകൾ
  rationale: אָמָה താഴ്ന്ന ഗൃഹപദവിയിലുള്ള സ്ത്രീ അടിമയെയോ ദാസിയെയോ സൂചിപ്പിക്കുന്നു. പ്രായം സൂചിപ്പിക്കുന്ന പദം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ‘പെൺകുട്ടികൾ’ എന്നതിനു പകരം ‘സ്ത്രീകൾ’ ഉപയോഗിച്ചു; സാമൂഹിക പദവിയുടെ ശക്തമായ ഭാവം സംരക്ഷിക്കാൻ ‘അടിമ’ നിലനിർത്തി.
- source_word: אֲשֶׁר אָמַרְתְּ
  choice: നീ പറഞ്ഞ
  rationale: മുൻവാക്യത്തിൽ മീഖാൽ പരാമർശിച്ച സ്ത്രീകളിലേക്കു മടങ്ങുന്ന ലളിതവും സ്വാഭാവികവുമായ ബന്ധവാക്യം.
- source_word: עִמָּם
  choice: അവരോടൊപ്പം
  rationale: עִם എന്ന ബന്ധപദത്തിന്റെ ‘കൂടെ/ഒപ്പം’ എന്ന അർഥം സംരക്ഷിക്കുന്നു. ബഹുമാനത്തിന്റെ കർത്താക്കളായി അവരെ നിർബന്ധമായി വ്യാഖ്യാനിക്കാതെ, അവരുടെ സാമൂഹിക വലയത്തിൽ എന്ന സാധ്യത നിലനിർത്തുന്നു.
- source_word: אִכָּבֵדָה
  choice: ഞാൻ ബഹുമാനിക്കപ്പെടുക
  rationale: כבד എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ബഹുമാനം ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നിസ്സാരനാക്കും’ എന്നതിനോടുള്ള മാന-അപമാന വൈരുധ്യം ഇതിലൂടെ വ്യക്തമായി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: אָמָהוֹת എന്ന പദത്തിലെ സാമൂഹിക പദവി
  choice: പ്രധാനപാഠത്തിൽ ‘അടിമസ്ത്രീകൾ’
  alternative: ‘ദാസിമാർ’ അല്ലെങ്കിൽ ‘സ്ത്രീപരിചാരകർ’
  rationale: വാക്യത്തിലെ താഴ്ന്ന സാമൂഹിക പദവിയും മാന-അപമാന വൈരുധ്യവും മൃദൂകരിക്കാതിരിക്കാൻ ശക്തമായ പദം ഉപയോഗിച്ചു. എന്നാൽ മലയാളത്തിൽ ഉപയോഗിക്കാവുന്ന മൃദുവായ പര്യായങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
- issue: עִמָּם സൂചിപ്പിക്കുന്ന ബന്ധം
  choice: ‘അവരോടൊപ്പം’ എന്ന സാമൂഹിക-ബന്ധപരമായ വായന
  alternative: ‘അവരാൽ’ എന്ന കർത്തൃവാചക വായന
  rationale: എബ്രായത്തിൽ ‘കൂടെ/ഒപ്പം’ എന്ന സാധാരണ ബന്ധപദമാണ് ഉള്ളത്. അതിനെ ‘അവരാൽ’ എന്നു മാറ്റി ബഹുമാനം നൽകുന്ന കർത്താക്കളെ വ്യക്തമാക്കുന്നത് മൂലത്തിലെ സാധ്യതയെ അനാവശ്യമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘എന്റെ സ്വന്തം കണ്ണിൽ’ എന്ന മൂലഭാഷാ രൂപകം അർഥവ്യക്തത നഷ്ടപ്പെടാതെ നിലനിർത്തി; മാന-അപമാന വൈരുധ്യം പ്രകടമാക്കാൻ ‘നിസ്സാരനാക്കും’ എന്നും ‘ബഹുമാനിക്കപ്പെടുക’ എന്നും ഉപയോഗിച്ചു.
