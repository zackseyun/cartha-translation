    rationale: ‘അവന്റെ ഭവനം മുഴുവനെയുമകാളും’ should be corrected to ‘അവന്റെ മുഴുവൻ ഭവനത്തെക്കാളും.’ This restores standard Malayalam morphology while retaining the source sense, ‘above/preferentially to all his house.’
