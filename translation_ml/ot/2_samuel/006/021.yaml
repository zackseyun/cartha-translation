source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִד֮ אֶל מִיכַל֒ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֨ר בָּֽחַר בִּ֤/י מֵֽ/אָבִי/ךְ֙ וּ/מִ/כָּל בֵּית֔/וֹ לְ/צַוֺּ֨ת אֹתִ֥/י נָגִ֛יד עַל עַ֥ם יְהוָ֖ה עַל יִשְׂרָאֵ֑ל וְ/שִׂחַקְתִּ֖י לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/021.yaml
  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
translation:
  language: ml
  text: 'ദാവീദ് മീഖളിനോടു പറഞ്ഞു: “യഹ്‌വെയുടെ സന്നിധിയിലായിരുന്നു അത്. നിന്റെ അപ്പനെക്കാളും അവന്റെ മുഴുവൻ ഭവനത്തെക്കാളും എന്നെ തിരഞ്ഞെടുത്ത്, യഹ്‌വെയുടെ ജനത്തിനുമേൽ, ഇസ്രായേലിനുമേൽ, ഭരണാധികാരിയായി എന്നെ നിയമിച്ച യഹ്‌വെയുടെ സന്നിധിയിൽ ഞാൻ ആനന്ദത്തോടെ ആഘോഷിക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞാൻ യഹ്‌വെയുടെ സന്നിധിയിൽ നൃത്തം ചെയ്യും” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ നൃത്തത്തെ മാത്രം സൂചിപ്പിക്കുന്ന പദത്തേക്കാൾ വിശാലമാണ്; സന്തോഷപൂർവമായ ആഘോഷമോ കളിയോടുകൂടിയ പ്രവൃത്തിയോ അതിന് അർഥമാകാം. ക്രിയാരൂപത്തെ “ഞാൻ ആഘോഷിച്ചു” എന്നും മനസ്സിലാക്കാം.
    reason: ക്രിയയുടെ പ്രവൃത്തിവ്യാപ്തിയിലും കാലസൂചനയിലും ഉള്ള യഥാർഥ ഭാഷാപരമായ സാധ്യതകൾ സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധിയിൽ ചെയ്യുന്ന പ്രവൃത്തി എന്ന സ്ഥലപരവും ബന്ധപരവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֲשֶׁר בָּחַר בִּי מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  choice: നിന്റെ അപ്പനെക്കാളും അവന്റെ ഭവനം മുഴുവനെയുമകാളും എന്നെ തിരഞ്ഞെടുത്ത്
  rationale: בחר എന്നതിന്റെ സാധാരണ അർഥമായ ‘തിരഞ്ഞെടുക്കുക’ നിലനിർത്തുകയും מן സൂചിപ്പിക്കുന്ന താരതമ്യ/വേർതിരിവ് ശക്തി സംരക്ഷിക്കുകയും ചെയ്യുന്നു. ‘ഭവനം’ കുടുംബത്തെയും രാജവംശത്തെയും ഉൾക്കൊള്ളുന്ന സ്രോതസ്സിലെ വ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: לְצַוֹּת אֹתִי
  choice: എന്നെ നിയമിച്ച
  rationale: തുടർന്ന് വരുന്ന ഔദ്യോഗിക സ്ഥാനത്തിന്റെ പശ്ചാത്തലത്തിൽ צוה ഇവിടെ ഒരു ചുമതലയിലേക്കു നിയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: נָגִיד
  choice: ഭരണാധികാരി
  rationale: ഭരണചുമതലയും അധികാരവും വ്യക്തമായി അറിയിക്കുന്നു; ‘രാജകുമാരൻ’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: עַל עַם יְהוָה עַל יִשְׂרָאֵל
  choice: യഹ്‌വെയുടെ ജനത്തിനുമേൽ, ഇസ്രായേലിനുമേൽ
  rationale: സ്രോതസ്സിലെ ഇരട്ട עַל ഉം ‘യഹ്‌വെയുടെ ജനം’ എന്ന ഉടമ്പടിസംബന്ധിയായ വിശേഷണവും ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְשִׂחַקְתִּי
  choice: ഞാൻ ആനന്ദത്തോടെ ആഘോഷിക്കും
  rationale: שׂחק സന്തോഷപൂർവമായ, കളിയോടുകൂടിയ ആഘോഷപ്രവൃത്തിയെ സൂചിപ്പിക്കാം; മുമ്പുള്ള നൃത്തസൂചക ക്രിയകളുമായി ഇതിനെ അനാവശ്യമായി ഒന്നാക്കാതെ വിശാലമായ അർഥം നൽകുന്നു. സന്ദർഭത്തിൽ ദാവീദിന്റെ തുടർന്നുള്ള ദൃഢനിശ്ചയം പ്രകടമാക്കുന്നതിനാൽ ഭാവിരൂപം സ്വീകരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: വ്യക്തിനാമത്തെ പദവിയാക്കി മാറ്റാതെ ഹീബ്രു ദൈവനാമത്തിന്റെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: അവസാന ക്രിയയെ പ്രത്യേകമായി ‘നൃത്തം ചെയ്യുക’ എന്നു പറയണമോ
  choice: ആനന്ദത്തോടെ ആഘോഷിക്കും
  alternative: നൃത്തം ചെയ്യും
  rationale: ഇവിടത്തെ שׂחק എന്ന ക്രിയ ആഘോഷപരമോ കളിയോടുകൂടിയതോ ആയ പ്രവൃത്തിയെ വിശാലമായി സൂചിപ്പിക്കുന്നു; മുൻവാക്യങ്ങളിലെ കൂടുതൽ നൃത്തവിശേഷമായ ക്രിയകളോട് അതിനെ ഒത്തുചേർക്കുന്നില്ല. നൃത്തം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: וְשִׂחַקְתִּי എന്ന ക്രിയയുടെ കാലസൂചന
  choice: ആഘോഷിക്കും
  alternative: ആഘോഷിച്ചു / ആഘോഷിച്ചിട്ടുണ്ട്
  rationale: വാവ് ചേർന്ന പൂർണക്രിയാരൂപം ഈ പ്രസംഗസന്ദർഭത്തിൽ ദാവീദിന്റെ തുടർന്നുള്ള ഉദ്ദേശമോ ദൃഢനിശ്ചയമോ സൂചിപ്പിക്കുന്നതായി വായിക്കാം. മുൻപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന വായന വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജവംശപരമായ അർഥം നിലനിർത്താൻ ‘ഭവനം’ എന്നും അധികാരസ്ഥാനം വ്യക്തമാക്കാൻ ‘ഭരണാധികാരി’ എന്നും ഉപയോഗിച്ചു. സ്രോതസ്സിലെ യഹ്‌വെ-സന്നിധി ആവർത്തനവും ‘ജനത്തിനുമേൽ, ഇസ്രായേലിനുമേൽ’ എന്ന ഊന്നലും മനപ്പൂർവം നിലനിർത്തി.
