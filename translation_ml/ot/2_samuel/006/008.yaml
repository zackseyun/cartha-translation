  text: וַ/יִּ֣חַר לְ/דָוִ֔ד עַל֩ אֲשֶׁ֨ר פָּרַ֧ץ יְהוָ֛ה פֶּ֖רֶץ בְּ/עֻזָּ֑ה וַ/יִּקְרָ֞א לַ/מָּק֤וֹם הַ/הוּא֙ פֶּ֣רֶץ עֻזָּ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/008.yaml
  text: And David was angry because Yahweh had broken out against Uzzah[a], and he called that place Perez-uzzah to this day.
translation:
  language: ml
  text: യഹോവ ഉസ്സായ്ക്കെതിരെ പൊട്ടിപ്പുറപ്പെട്ടതിനാൽ ദാവീദ് കോപിച്ചു; അവൻ ആ സ്ഥലത്തിന് പേരെസ്-ഉസ്സാ[a] എന്നു പേരിട്ടു. ഇന്നുവരെയും അതാണ് അതിന്റെ പേര്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പേരെസ്-ഉസ്സാ” എന്ന പേര് “ഉസ്സായ്ക്കെതിരായ പൊട്ടിപ്പുറപ്പെടൽ” എന്ന ആശയം കേൾപ്പിക്കുന്നു; “യഹോവ ഉസ്സായ്ക്കെതിരെ പൊട്ടിപ്പുറപ്പെട്ടു” എന്ന വാക്യത്തിലെ എബ്രായ പദപ്രയോഗത്തെ ഇത് പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְדָוִד
  choice: ദാവീദ് കോപിച്ചു
  rationale: חרה ל എന്ന എബ്രായ പ്രയോഗം കോപത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ രൂപം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: פָּרַץ יְהוָה פֶּרֶץ בְּעֻזָּה
  choice: യഹോവ ഉസ്സായ്ക്കെതിരെ പൊട്ടിപ്പുറപ്പെട്ടു
  rationale: פרץ എന്ന ധാതുവിന്റെ പെട്ടെന്നുള്ള വിനാശകരമായ പൊട്ടിപ്പുറപ്പെടൽ എന്ന ശക്തി നിലനിർത്തുന്നു. ധാതുവും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന എബ്രായ പദപ്രയോഗം മലയാളത്തിൽ അതേപടി ആവർത്തിച്ചാൽ അസ്വാഭാവികമാകുന്നതിനാൽ, അതിന്റെ പ്രതിധ്വനി സ്ഥലനാമത്തിലും അടിക്കുറിപ്പിലും വ്യക്തമാക്കി.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: അവൻ ആ സ്ഥലത്തിന് ... എന്നു പേരിട്ടു
  rationale: സ്ഥലനാമകരണം സൂചിപ്പിക്കുന്ന എബ്രായ സൂത്രവാക്യത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: פֶּרֶץ עֻזָּה
  choice: പേരെസ്-ഉസ്സാ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; അതിലെ פרץ എന്ന പദത്തിന്റെ ശബ്ദ-അർഥബന്ധം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും അതാണ് അതിന്റെ പേര്
  rationale: എബ്രായത്തിലെ കാലസൂത്രവാക്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സ്ഥലനാമം തുടർന്നുനിന്നുവെന്ന ആശയം പ്രസക്തമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഉസ്സായ്ക്കെതിരായ ദൈവിക ന്യായവിധിയുടെ നേരിട്ടുള്ള പ്രവർത്തനം മൃദൂകരിക്കാതിരിക്കുക
  choice: യഹോവ ഉസ്സായ്ക്കെതിരെ പൊട്ടിപ്പുറപ്പെട്ടു
  alternative: ഉസ്സായ്ക്ക് സംഭവിച്ച ദുരന്തം കാരണം
  rationale: എബ്രായപാഠം സംഭവത്തെ യഹോവയുടെ നേരിട്ടുള്ള പ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു. അതിനെ ഒരു നിർവ്യക്തമായ അപകടമോ ഫലമോ ആക്കി മാറ്റാതെ ആ ശക്തി സംരക്ഷിച്ചു.
- issue: ദാവീദിന്റെ വികാരത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കാതെ പാഠത്തിലെ സംഘർഷം നിലനിർത്തുക
  choice: ദാവീദ് കോപിച്ചു
  alternative: ദാവീദ് യഹോവയോട് കോപിച്ചു
  rationale: לְדָוִד എന്ന പ്രയോഗം ദാവീദ് കോപിച്ചു എന്നു വ്യക്തമാക്കുന്നു; എന്നാൽ അവൻ ആരോടാണ് കോപിച്ചതെന്ന് വാക്യം വ്യാകരണപരമായി തുറന്നുപറയുന്നില്ല. അതിനാൽ ലക്ഷ്യം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവനാമത്തിന് “യഹോവ”യും പേരുകൾക്ക് “ദാവീദ്,” “ഉസ്സാ,” “പേരെസ്-ഉസ്സാ” എന്നീ മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ രൂപങ്ങളും ഉപയോഗിച്ചു.
