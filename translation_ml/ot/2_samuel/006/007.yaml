id: 2SA.6.7
reference: 2 Samuel 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔ה וַ/יַּכֵּ֥/הוּ שָׁ֛ם הָ/אֱלֹהִ֖ים עַל הַ/שַּׁ֑ל וַ/יָּ֣מָת שָׁ֔ם עִ֖ם אֲר֥וֹן הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
translation:
  language: ml
  text: യഹോവയുടെ കോപം ഉസ്സായുടെ നേരെ ജ്വലിച്ചു; ആ തെറ്റുനിമിത്തം[a] ദൈവം അവിടെവെച്ച് അവനെ പ്രഹരിച്ചു. ദൈവത്തിന്റെ പെട്ടകത്തിനരികെ അവൻ അവിടെവെച്ച് മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആ അനാദരവുനിമിത്തം,” “അവന്റെ അവിവേകപ്രവൃത്തിനിമിത്തം,” അല്ലെങ്കിൽ ഒരുപക്ഷേ “അവൻ കൈ നീട്ടിയതുനിമിത്തം” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടത്തെ എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; അതിനെ പലവിധത്തിൽ മനസ്സിലാക്കിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: കോപം ... ജ്വലിച്ചു
  rationale: കോപം കത്തുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּעֻזָּה
  choice: ഉസ്സായുടെ നേരെ
  rationale: חרה אף എന്ന കോപപ്രയോഗത്തോടൊപ്പം בְּ കോപത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּכֵּהוּ
  choice: അവനെ പ്രഹരിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; മരണഫലം അടുത്ത വാക്യത്തിൽ പ്രത്യേകം പറയുന്നു.
- source_word: שָׁם
  choice: അവിടെവെച്ച്
  rationale: മൂലപാഠത്തിലെ ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തി സംഭവസ്ഥലത്തിനുള്ള ഊന്നൽ പ്രകടമാക്കുന്നു.
- source_word: הָאֱלֹהִים
  choice: ദൈവം
  rationale: മൂലപാഠം ഇവിടെ യഹോവ എന്ന നാമത്തിനു പകരം എലോഹീം ഉപയോഗിക്കുന്നതിനാൽ ആ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- source_word: עַל הַשַּׁל
  choice: ആ തെറ്റുനിമിത്തം
  rationale: അപൂർവവും ദുഷ്കരവുമായ שַׁל എന്ന പദത്തെ അമിതമായി വ്യാഖ്യാനിക്കാതെ പൊതുവായ അർഥത്തിൽ നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיָּמָת
  choice: അവൻ ... മരിച്ചു
  rationale: ലളിതമായ എബ്രായ ആഖ്യാനക്രമം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പെട്ടകത്തിനരികെ
  rationale: עִם എന്നത് ഇവിടെ സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ 'കൂടെ' എന്നതിനെക്കാൾ 'അരികെ' സ്വാഭാവികവും വ്യക്തവുമാണ്.
theological_decisions:
- issue: עַל הַשַּׁל എന്ന ദുഷ്കരമായ പ്രയോഗത്തിൽ ഉസ്സായുടെ മരണകാരണം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: ആ തെറ്റുനിമിത്തം
  alternative: ആ അനാദരവുനിമിത്തം; അവന്റെ അവിവേകപ്രവൃത്തിനിമിത്തം; അവൻ കൈ നീട്ടിയതുനിമിത്തം
  rationale: ഈ അപൂർവ എബ്രായപദത്തിന്റെ കൃത്യമായ സൂചന വിവാദവിധേയമാണ്. മുഖ്യപാഠത്തിൽ പൊതുവായ അർഥം നൽകി, പ്രത്യേക വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നത് പാഠത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വവും ദൈവിക ന്യായവിധിയെക്കുറിച്ചുള്ള സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ആഖ്യാനശൈലി. ദുഷ്കരമായ കാരണപ്രയോഗം മുഖ്യപാഠത്തിൽ അമിതമായി വിശദീകരിക്കാതെ അടിക്കുറിപ്പിലൂടെ സുതാര്യമാക്കി.
