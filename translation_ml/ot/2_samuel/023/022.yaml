  yaml_path: translation/ot/2_samuel/023/022.yaml
  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
translation:
  language: ml
  text: ഈ കാര്യങ്ങൾ യെഹോയാദയുടെ മകനായ ബെനായാവ് ചെയ്തു; മൂന്നു വീരന്മാരുടെ ഇടയിൽ അവൻ കീർത്തി നേടി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അവന് ഒരു പേര് ഉണ്ടായിരുന്നു”; അതായത്, മൂന്നു വീരന്മാരുടെ ഇടയിൽ അവൻ പ്രശസ്തനായിരുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ദാവീദിന്റെ യോദ്ധാക്കളുടെ വിപുലമായ പട്ടികയുടെ വെളിച്ചത്തിൽ ചിലർ ഇവിടെ “മുപ്പത്” എന്ന വായനയുമായി താരതമ്യം ചെയ്യുന്നു; എന്നാൽ ഇവിടെയുള്ള ഹീബ്രു പാഠം “മൂന്ന്” എന്നാണ് വായിക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: ഈ കാര്യങ്ങൾ ... ചെയ്തു
  rationale: മുമ്പ് വിവരിച്ച വീരകൃത്യങ്ങളിലേക്കാണ് സൂചകസർവനാമം വിരൽചൂണ്ടുന്നത്. ഹീബ്രു വാക്യഘടനയും സംഗ്രഹസ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: യെഹോയാദയുടെ മകനായ ബെനായാവ്
  rationale: നാമങ്ങൾ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; പിതൃപുത്രബന്ധം സ്വാഭാവികമായ മലയാള ഷഷ്ഠീപ്രയോഗത്തിൽ നൽകി.
- source_word: וְלוֹ שֵׁם
  choice: അവൻ കീർത്തി നേടി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന് ഒരു പേര് ഉണ്ടായിരുന്നു’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ പ്രശസ്തി അല്ലെങ്കിൽ കീർത്തി സൂചിപ്പിക്കുന്നു. ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  choice: മൂന്നു വീരന്മാരുടെ ഇടയിൽ
  rationale: ലഭ്യമായ ഹീബ്രു പാഠം ‘മൂന്ന്’ എന്നാണ് വായിക്കുന്നത്. גִּבֹּרִים എന്നത് സന്ദർഭത്തിൽ ദാവീദിന്റെ പ്രമുഖ യോദ്ധാക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വീരന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
