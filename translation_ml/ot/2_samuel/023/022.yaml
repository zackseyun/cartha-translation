translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു പാഠത്തിലെ ‘മൂന്ന്’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും പാഠഭേദചർച്ച അടിക്കുറിപ്പിലാക്കുകയും ചെയ്തു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
