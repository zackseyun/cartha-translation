  - marker: a
    text: ചില വിവർത്തനപാരമ്പര്യങ്ങളിൽ ‘പെലോന്യനായ’ എന്നും കാണുന്നു; എന്നാൽ ഇവിടത്തെ എബ്രായപാഠം ഏറ്റവും സ്വാഭാവികമായി ‘പൽത്യനായ’ എന്നാണ് വായിക്കപ്പെടുന്നത്.
