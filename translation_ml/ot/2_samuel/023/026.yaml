lexical_decisions:
- source_word: חֶלֶץ
  choice: ഹേലെസ്
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַפַּלְטִי
  choice: പൽത്യനായ
  rationale: വംശമോ സ്ഥലബന്ധമോ സൂചിപ്പിക്കുന്ന നിർദേശകപദം. ഈ വാക്യത്തിലെ എബ്രായരൂപം സ്വാഭാവികമായി ‘പൽത്യൻ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു.
- source_word: עִירָא
  choice: ഈരാ
  rationale: വ്യക്തിനാമം; എബ്രായ സ്വരദൈർഘ്യം സ്വാഭാവിക മലയാള ലിപ്യന്തരണത്തിൽ നിലനിർത്തി.
- source_word: בֶן
  choice: മകൻ
  rationale: വംശപരമായ തിരിച്ചറിയലിൽ പിതൃപുത്രബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായപദത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: עִקֵּשׁ
  choice: ഇക്കേശ്
  rationale: വ്യക്തിനാമം; എബ്രായത്തിലെ ഇരട്ട വ്യഞ്ജനധ്വനി മലയാളത്തിൽ ‘ക്ക’ ഉപയോഗിച്ച് പ്രതിഫലിപ്പിച്ചു.
- source_word: הַתְּקוֹעִי
  choice: തെക്കോവ്യനായ
  rationale: തെക്കോവയിൽ നിന്നുള്ളവൻ എന്ന സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന നിർദേശകപദം; എബ്രായത്തിലെ സംക്ഷിപ്ത വിശേഷണരൂപം മലയാളത്തിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും മാന്യവുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ പേരുകളും സ്ഥല/വംശബന്ധ വിശേഷണങ്ങളും ലിപ്യന്തരണം ചെയ്തു; വാക്യാവസാനത്തിലെ അർദ്ധവിരാമം പട്ടിക തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
