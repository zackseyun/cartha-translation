id: 2SA.23.29
reference: 2 Samuel 23:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: חֵ֥לֶב בֶּֽן בַּעֲנָ֖ה הַ/נְּטֹפָתִ֑י אִתַּי֙ בֶּן רִיבַ֔י מִ/גִּבְעַ֖ת בְּנֵ֥י בִנְיָמִֽן־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/029.yaml
  text: Heleb son of Baanah the Netophathite[a], Ittai son of Ribai from Gibeah of the sons of Benjamin;
translation:
  language: ml
  text: നെതോഫാത്ത്യനായ ബാനായുടെ മകൻ ഹേലെബ്; ബെന്യാമീന്റെ പുത്രന്മാരുടെ ഗിബെയയിൽനിന്നുള്ള റീബായുടെ മകൻ ഇത്തായി[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബെന്യാമീന്യരുടെ ഗിബെയയിൽനിന്നുള്ള.” എബ്രായത്തിൽ അക്ഷരാർഥം “ബെന്യാമീന്റെ പുത്രന്മാരുടെ ഗിബെയയിൽനിന്നുള്ള” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: ഹേലെബ്
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ, എബ്രായരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: בֶּן
  choice: മകൻ
  rationale: പിതൃപുത്രബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായപദം; പേരുകളുടെ പട്ടികയിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: בַּעֲנָה
  choice: ബാനാ
  rationale: വ്യക്തിനാമത്തിന്റെ എബ്രായ ഉച്ചാരണരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
- source_word: הַנְּטֹפָתִי
  choice: നെതോഫാത്ത്യനായ
  rationale: നെതോഫാ എന്ന സ്ഥലത്തോടോ അവിടത്തെ ജനവിഭാഗത്തോടോ ഉള്ള ബന്ധം സൂചിപ്പിക്കുന്ന നിവാസിവാചകം; മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ രൂപം.
- source_word: אִתַּי
  choice: ഇത്തായി
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
- source_word: רִיבַי
  choice: റീബായി
  rationale: വ്യക്തിനാമത്തിന്റെ ദീർഘസ്വരവും അവസാന ദ്വിസ്വരവും പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מִגִּבְעַת
  choice: ഗിബെയയിൽനിന്നുള്ള
  rationale: മִן എന്ന ഉപസർഗം ഉത്ഭവസ്ഥലം സൂചിപ്പിക്കുന്നതിനാൽ ‘യിൽനിന്നുള്ള’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാരുടെ
  rationale: അക്ഷരാർഥമായ ‘ബെന്യാമീന്റെ പുത്രന്മാർ’ എന്ന ഗോത്രപരമായ പ്രയോഗം നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ ഗോത്രനാമരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
