translation_notes:
  register: പേരുകളുടെ പട്ടികയ്ക്ക് യോജിച്ച സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ആധുനിക നിലവാരമലയാളം ഉപയോഗിച്ചു. എബ്രായത്തിലെ രണ്ടു പേരുഘടകങ്ങളും അർദ്ധവിരാമംകൊണ്ട് വേർതിരിച്ചു; ഗോത്രബന്ധത്തിന്റെ അക്ഷരാർഥപ്രയോഗം മുഖ്യവാചകത്തിൽ സൂക്ഷിച്ചു.
