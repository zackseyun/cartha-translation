  text: וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חי רַב פְּעָלִ֖ים מִֽ/קַּבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת ה/אריה בְּ/ת֥וֹךְ הַ/בֹּ֖אר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
translation:
  language: ml
  text: യെഹോയാദയുടെ മകനായ, വീരനായ ഒരു മനുഷ്യന്റെ മകനും കബ്സേലിൽനിന്നുള്ളവനും മഹത്തായ പ്രവൃത്തികൾ ചെയ്തവനുമായ ബെനായാവ് മോവാബിലെ രണ്ട് അരിയേലുകളെ[a] വധിച്ചു. മഞ്ഞുവീണ ഒരു ദിവസം അവൻ ഒരു കുഴിയിലിറങ്ങി അതിന്റെ നടുവിൽ സിംഹത്തെ വധിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ אֲרִאֵל (അരിയേൽ) എന്ന പദത്തിന്റെ അർഥം ഇവിടെ അനിശ്ചിതമാണ്. ഇതിന് ‘സിംഹസദൃശരായ മനുഷ്യർ’ അല്ലെങ്കിൽ ‘വീരന്മാർ’ എന്നു അർഥമാകാം; അല്ലെങ്കിൽ ഇതൊരു പദവിയോ പേരോ ആയിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חַי
  choice: വീരനായ ഒരു മനുഷ്യൻ
  rationale: ഇവിടെ ഈ പ്രയോഗം കേവലം ‘ജീവിച്ചിരിക്കുന്ന മനുഷ്യൻ’ എന്നതിലുപരി ശക്തിയും ധൈര്യവുമുള്ള മനുഷ്യനെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു.
- source_word: רַב פְּעָלִים
  choice: മഹത്തായ പ്രവൃത്തികൾ ചെയ്തവൻ
  rationale: പ്രശംസനീയവും ശ്രദ്ധേയവുമായ അനേകം സാഹസിക പ്രവൃത്തികൾ ചെയ്ത വ്യക്തി എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִקַּבְצְאֵל
  choice: കബ്സേലിൽനിന്നുള്ള
  rationale: മുൻപ്രത്യയമായ מִן ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിന്നുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הִכָּה
  choice: വധിച്ചു
  rationale: ഇവിടെ യുദ്ധപരവും മാരകവുമായ നേട്ടങ്ങളാണ് വിവരിക്കുന്നത്; മലയാളത്തിൽ ‘വധിച്ചു’ എന്നത് പ്രവർത്തിയുടെ ഫലം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  choice: മോവാബിലെ രണ്ട് അരിയേലുകൾ
  rationale: אֲרִאֵל എന്ന പദത്തിന്റെ അർഥം അനിശ്ചിതമാണ്. ഒരു വ്യാഖ്യാനം നിർബന്ധിക്കാതെ എബ്രായരൂപം മലയാളലിപിയിൽ നിലനിർത്തി, വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: יָרַד
  choice: ഇറങ്ങി
  rationale: കുഴിയിലേക്കുള്ള താഴോട്ടുള്ള ചലനം ലളിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: הָאֲרִי
  choice: സിംഹം
  rationale: ഈ നാമം വ്യക്തമായി സിംഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: ഒരു കുഴിയുടെ നടുവിൽവെച്ച്
  rationale: בּוֹר എന്നതിന് കുഴി അല്ലെങ്കിൽ ജലസംഭരണിക്കുഴി എന്നർഥമാകാം; സന്ദർഭത്തിൽ വിശാലവും സ്വാഭാവികവുമായ ‘കുഴി’ സ്വീകരിച്ചു, בְּתוֹךְ എന്നത് ‘നടുവിൽവെച്ച്’ എന്നു പ്രതിഫലിപ്പിച്ചു.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: മഞ്ഞുവീണ ഒരു ദിവസം
  rationale: മഞ്ഞിനാൽ പ്രത്യേകതയുള്ള ദിവസമെന്ന കാലസൂചനയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
