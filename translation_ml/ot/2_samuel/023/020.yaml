translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി ഉപയോഗിച്ചു. ദുഷ്കരമായ אֲרִאֵל എന്ന പദത്തിന്റെ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ ലിപ്യന്തരണം ചെയ്തും അടിക്കുറിപ്പിൽ സാധ്യതകൾ നൽകിയുമാണ് സംരക്ഷിച്ചത്. വാക്യഘടനയിൽ യെഹോയാദയുടെ പിതാവിനെ ‘വീരനായ മനുഷ്യൻ’ എന്നും ബെനായാവിനെ ‘മഹത്തായ പ്രവൃത്തികൾ ചെയ്തവൻ’ എന്നും വായിക്കാവുന്ന എബ്രായക്രമം കഴിയുന്നത്ര നിലനിർത്തി.
