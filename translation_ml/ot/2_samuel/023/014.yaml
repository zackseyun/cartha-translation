  yaml_path: translation/ot/2_samuel/023/014.yaml
  text: David was then in the stronghold[a], and the garrison of the Philistines was then at Bethlehem.
translation:
  language: ml
  text: ദാവീദ് അന്ന് കോട്ടയിൽ ആയിരുന്നു; ഫെലിസ്ത്യരുടെ കാവൽപ്പട അന്ന് ബേത്‌ലഹേമിൽ ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: അന്ന് … അന്ന്
  rationale: എബ്രായപാഠത്തിൽ രണ്ടുതവണ വരുന്ന കാലസൂചകത്തെ മലയാളത്തിലും ആവർത്തിച്ച്, വാക്യത്തിന്റെ കാലപരമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: מְצוּדָה
  choice: കോട്ട
  rationale: ദാവീദ് ഉണ്ടായിരുന്ന പ്രതിരോധസജ്ജമായ സുരക്ഷിതസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സൈനികസന്ദർഭത്തിന് യോജിച്ചതുമായ പദം.
- source_word: מַצַּב
  choice: കാവൽപ്പട
  rationale: ഈ സൈനികസന്ദർഭത്തിൽ ഒരു സ്ഥലത്ത് നിലയുറപ്പിച്ച സൈനികസംഘത്തെയോ സൈനികകാവൽനിലയത്തെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ സംഘത്തെ മുൻനിർത്തി ‘കാവൽപ്പട’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള പേരുരൂപം.
- source_word: בֵּית לָחֶם
  choice: ബേത്‌ലഹേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: וְ
  choice: ;
  rationale: എബ്രായത്തിലെ ഏകോപനബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട്, അടുത്ത ബന്ധമുള്ള രണ്ടു സ്വതന്ത്ര ഉപവാക്യങ്ങളെ അർദ്ധവിരാമംകൊണ്ട് ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണം. എബ്രായത്തിലെ אָז എന്ന പദത്തിന്റെ ആവർത്തനം ഒഴിവാക്കാതെ നിലനിർത്തിയതിനാൽ വിശദീകരണ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
