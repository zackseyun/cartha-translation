    rationale: “Adino the Eznite” reflects the Masoretic pointing as a name/title, whereas “wielded/brandished his spear” is an alternative interpretation of the difficult Hebrew. Retaining both presents the alternative as though it were explicit alongside the name and adds “തന്റെ” and “കുന്തം” where the Masoretic wording is disputed.
