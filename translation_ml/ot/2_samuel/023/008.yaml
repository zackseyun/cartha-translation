translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദുഷ്കരമായ മസോരറ്റിക് വായനകൾ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച്, പാഠഭേദങ്ങളും സാധ്യതയുള്ള വ്യാഖ്യാനങ്ങളും അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
