base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
translation:
  language: ml
  text: 'ദാവീദിനോടു ചേർന്നിരുന്ന വീരന്മാരുടെ പേരുകൾ ഇവയാണ്: തഹ്കെമോന്യനായ യോശേബ്-ബശ്ശേബെത്ത്[a]; അവൻ മൂവരിൽ തലവനായിരുന്നു.[b] അവൻ എസ്ന്യനായ അദീനോ[c] ആയിരുന്നു; ഒരൊറ്റ അവസരത്തിൽ അവൻ എട്ടുനൂറുപേരെ കൊന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലെ ഹീബ്രു പാഠം ദുഷ്കരമാണ്. ‘യോശേബ്-ബശ്ശേബെത്ത്’ എന്നത് മസോരറ്റിക് പാഠത്തെ പിന്തുടരുന്നു; 1 ദിനവൃത്താന്തം 11:11-ലെ സമാന്തരഭാഗം ‘ഹഖ്മോന്യനായ യാശൊബെയാം’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: ചില പുരാതന പാഠസാക്ഷ്യങ്ങളും വ്യാഖ്യാനങ്ങളും അനുസരിച്ച്, ‘മുപ്പതുപേരുടെ തലവൻ’ എന്നും വായിക്കാം; മസോരറ്റിക് പാഠം ‘മൂവരിൽ തലവൻ’ എന്നാണ്.
    reason: alternative_reading
  - marker: c
    text: ഹീബ്രുവിൽ ‘എസ്ന്യനായ അദീനോ’ എന്നുള്ളത് വളരെ ദുഷ്കരമായ പ്രയോഗമാണ്. പലരും ഇതിനെ ‘അവൻ തന്റെ കുന്തം പ്രയോഗിച്ചു’ അല്ലെങ്കിൽ ‘അവൻ തന്റെ കുന്തം വീശി’ എന്നതുപോലെ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּבֹּרִים
  choice: വീരന്മാർ
  rationale: യുദ്ധവീരന്മാരെയും പരാക്രമശാലികളെയും സൂചിപ്പിക്കുന്ന പദം; പട്ടികയുടെ സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികവും മാന്യവുമായ മലയാളം.
- source_word: אֲשֶׁר לְדָוִד
  choice: ദാവീദിനോടു ചേർന്നിരുന്ന
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ബന്ധം/കൂട്ടായ്മ വ്യക്തമാക്കുന്നു; ഉടമസ്ഥതയായി അതിരുകടന്ന് അവതരിപ്പിക്കുന്നില്ല.
- source_word: יֹשֵׁב בַּשֶּׁבֶת
  choice: യോശേബ്-ബശ്ശേബെത്ത്
  rationale: മസോരറ്റിക് പാഠത്തിലെ ദുഷ്കരമായ രൂപം തിരുത്താതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു; ദിനവൃത്താന്തങ്ങളിലെ സമാന്തരവായന അടിക്കുറിപ്പിൽ നൽകി.
- source_word: תַּחְכְּמֹנִי
  choice: തഹ്കെമോന്യൻ
  rationale: ഹീബ്രു രൂപത്തിന്റെ ജനവിഭാഗ/കുടുംബസൂചകമായ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു.
- source_word: רֹאשׁ הַשָּׁלִשִׁי
  choice: മൂവരിൽ തലവൻ
  rationale: മസോരറ്റിക് സ്വരീകരണത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘മുപ്പതുപേരുടെ തലവൻ’ എന്ന പുരാതന ബദൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: עֲדִינוֹ הָעֶצְנוֹ
  choice: എസ്ന്യനായ അദീനോ
  rationale: വളരെ ദുഷ്കരമായ പദസമുച്ചയം മസോരറ്റിക് പാഠപ്രകാരം പേരും വിശേഷണവുമായി നിലനിർത്തി; കുന്തം പ്രയോഗിച്ചതിനെക്കുറിച്ചുള്ള ബദൽ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: עַל שְׁמֹנֶה מֵאוֹת חָלָל
  choice: കൊല്ലപ്പെട്ട എണ്ണൂറുപേർക്കെതിരെ
  rationale: חָלָל എന്നതിന്റെ ‘കൊല്ലപ്പെട്ടവർ’ എന്ന അർഥവും עַל എന്നതിന്റെ യുദ്ധസന്ദർഭത്തിലെ എതിരിടൽഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: בְּפַעַם אֶחָד
  choice: ഒരൊറ്റ അവസരത്തിൽ
  rationale: ഒരു സമയം/ഒരു ഏറ്റുമുട്ടൽ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הוּא
  choice: അവൻ ... ആയിരുന്നു
  rationale: സ്വതന്ത്ര സർവനാമം തുടർന്നുള്ള തിരിച്ചറിയൽവാക്യവുമായി വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
