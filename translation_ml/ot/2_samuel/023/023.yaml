id: 2SA.23.23
reference: 2 Samuel 23:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִן הַ/שְּׁלֹשִׁ֣ים נִכְבָּ֔ד וְ/אֶל הַ/שְּׁלֹשָׁ֖ה לֹא בָ֑א וַ/יְשִׂמֵ֥/הוּ דָוִ֖ד אֶל מִשְׁמַעְתּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/023.yaml
  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
translation:
  language: ml
  text: അവൻ മുപ്പതുപേരുടെ ഇടയിൽ മാനിക്കപ്പെട്ടവനായിരുന്നു[a]; എങ്കിലും ആ മൂന്നുപേരുടെ നിലവാരത്തിലെത്തിയില്ല[b]. ദാവീദ് അവനെ തന്റെ അംഗരക്ഷകസേനയുടെ ചുമതലക്കാരനായി നിയമിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മുപ്പതുപേരെക്കാൾ അധികം മാനിക്കപ്പെട്ടവനായിരുന്നു.” ഇവിടെ എബ്രായപ്രയോഗം സംഘത്തിനുള്ളിലെ സ്ഥാനത്തെയോ അവരുമായുള്ള താരതമ്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “എന്നാൽ ആ മൂന്നുപേരിലേക്കു വന്നില്ല”; അതായത്, ശ്രേഷ്ഠരായ ആ മൂന്നു യോദ്ധാക്കളുടെ നിലവാരത്തിലെത്തിയില്ല.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ, “തന്റെ മിഷ്മാഅത്തിലേക്ക്.” ഇതിന് “തന്റെ കല്പനയിലേക്കു/അധികാരപരിധിയിലേക്കു” എന്നോ “തന്റെ കാവൽസേനയുടെ മേൽ” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים נִכְבָּד
  choice: മുപ്പതുപേരിൽ ആദരിക്കപ്പെട്ടവനായിരുന്നു
  rationale: נִכְבָּד എന്ന നിഫാൽ രൂപത്തിന്റെ ‘ആദരിക്കപ്പെട്ട/മാനിക്കപ്പെട്ട’ എന്ന നിഷ്ക്രിയഭാവം നിലനിർത്തുന്നു. מִן ഇവിടെ സംഘത്തിനുള്ളിലെ സ്ഥാനം സൂചിപ്പിക്കാമെങ്കിലും താരതമ്യാർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  choice: എങ്കിലും ആ മൂന്നുപേരുടെ പദവിയിലെത്തിയില്ല
  rationale: അക്ഷരാർഥമായ ‘ആ മൂന്നുപേരിലേക്കു വന്നില്ല’ എന്ന പ്രയോഗം ഇവിടെ ശ്രേണിയിലോ സ്ഥാനത്തിലോ എത്താതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ അർഥം വ്യക്തമാക്കിക്കൊണ്ട് യഥാർത്ഥ രൂപകം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיְשִׂמֵהוּ דָוִד
  choice: ദാവീദ് അവനെ ... നിയമിച്ചു
  rationale: שׂים എന്നത് അക്ഷരാർഥത്തിൽ ‘വെച്ചു’ എന്നാണെങ്കിലും അധികാരപരമായ ഈ സന്ദർഭത്തിൽ ‘നിയമിച്ചു’ എന്നതാണ് സ്വാഭാവികവും കൃത്യവും.
- source_word: אֶל מִשְׁמַעְתּוֹ
  choice: തന്റെ അംഗരക്ഷകസേനയുടെ മേൽനോട്ടക്കാരനായി
  rationale: מִשְׁמַעַת എന്ന അപൂർവപദത്തിന് ‘കല്പന/അധികാരപരിധി’ എന്നും അധികാരത്തിനു കീഴിലുള്ള സംഘം, സാധ്യതയോടെ കാവൽസേന, എന്നും അർഥമാകാം. സൈനിക-രാജധാനി സന്ദർഭത്തിൽ അംഗരക്ഷകസേന സാദ്ധ്യതയേറിയതാണ്; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി. ‘മുപ്പതുപേർ’, ‘മൂന്നുപേർ’ എന്നീ സന്ദർഭപരമായ യോദ്ധാസംഘനാമങ്ങൾ നിലനിർത്തി. അപൂർവമായ מִשְׁמַעַת എന്ന പദത്തിന്റെ സൈനികസന്ദർഭത്തിലുള്ള സാധ്യത പ്രധാനവാചകത്തിൽ സ്വീകരിച്ചെങ്കിലും പദാർഥപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
