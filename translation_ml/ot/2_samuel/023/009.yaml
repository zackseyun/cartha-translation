  text: ו/אחר/ו אֶלְעָזָ֥ר בֶּן דדי בֶּן אֲחֹחִ֑י בִּ/שְׁלֹשָׁ֨ה גברים עִם דָּוִ֗ד בְּ/חָֽרְפָ֤/ם בַּ/פְּלִשְׁתִּים נֶאֶסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
translation:
  language: ml
  text: അവനു ശേഷം അഹോഹിയുടെ മകനായ ദോദോയുടെ മകൻ എലെയാസാർ[a] ഉണ്ടായിരുന്നു. ദാവീദിനോടുകൂടെ ഉണ്ടായിരുന്ന മൂന്നു വീരന്മാരിൽ ഒരാളായിരുന്നു അവൻ. യുദ്ധത്തിനായി അവിടെ ഒരുമിച്ചുകൂടിയ ഫെലിസ്ത്യരെ അവർ നിന്ദിച്ചപ്പോൾ[b], ഇസ്രായേല്യർ കയറിപ്പോയി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അഹോഹ്യന്റെ മകനായ ദോദായിയുടെ മകൻ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഫെലിസ്ത്യരെ അവർ വെല്ലുവിളിച്ചപ്പോൾ.”
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “ഇസ്രായേല്യർ കയറിപ്പോയി”; ഈ സന്ദർഭത്തിൽ ഇതിന് അവർ പിന്മാറിപ്പോയി എന്നർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/אחר/ו
  choice: അവനു ശേഷം ... ഉണ്ടായിരുന്നു
  rationale: മുൻപു പറഞ്ഞ വീരനുശേഷം അടുത്തയാളെ പരിചയപ്പെടുത്തുന്ന ക്രമസൂചന; മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ നാമവാക്യത്തിൽ ‘ഉണ്ടായിരുന്നു’ ചേർത്തു.
- source_word: אֶלְעָזָר
  choice: എലെയാസാർ
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן דדי בֶּן אֲחֹחִי
  choice: അഹോഹിയുടെ മകനായ ദോദോയുടെ മകൻ
  rationale: വ്യഞ്ജനപാഠത്തെ വ്യക്തിനാമങ്ങളുടെ വംശാവലിയായി സ്വീകരിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בִּ/שְׁלֹשָׁה גברים
  choice: മൂന്നു വീരന്മാരിൽ ഒരാൾ
  rationale: גברים എന്നതിന് ഈ സൈനിക-വീരസന്ദർഭത്തിലുള്ള അർഥവും בְּ എന്നതിന്റെ അംഗത്വസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עִם דָּוִד
  choice: ദാവീദിനോടുകൂടെ ഉണ്ടായിരുന്ന
  rationale: ദാവീദുമായുള്ള സഹവർത്തിത്വവും കൂട്ടായ്മയും വ്യക്തമാക്കുന്നു.
- source_word: בְּ/חָֽרְפָם
  choice: അവർ ... നിന്ദിച്ചപ്പോൾ
  rationale: חרף എന്ന ധാതുവിലെ അധിക്ഷേപം/നിന്ദ എന്ന അടിസ്ഥാനഭാവം സംരക്ഷിക്കുന്നു; സൈനികസന്ദർഭത്തിൽ ‘വെല്ലുവിളിച്ചു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בַּ/פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരെ
  rationale: ജനവിഭാഗനാമത്തിന്റെ സാധാരണ മലയാളരൂപം.
- source_word: נֶאֶסְפוּ שָׁם לַ/מִּלְחָמָה
  choice: യുദ്ധത്തിനായി അവിടെ ഒരുമിച്ചുകൂടിയ
  rationale: നിഫാൽ ക്രിയയുടെ സ്വയം ഒത്തുകൂടുക എന്ന ആശയവും യുദ്ധലക്ഷ്യവും വ്യക്തമായി നൽകുന്നു.
- source_word: וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל
  choice: ഇസ്രായേൽപുരുഷന്മാർ കയറിപ്പോയിരുന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറിപ്പോകുക’ എന്ന നേരിട്ടുള്ള അർഥം മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുന്നു; സന്ദർഭപരമായി ‘പിന്മാറി’ എന്നാകാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേൽപുരുഷന്മാരുടെ നീക്കത്തിന്റെ സ്വഭാവം
  choice: കയറിപ്പോയിരുന്നു
  alternative: പിന്മാറിപ്പോയിരുന്നു
  rationale: യുദ്ധസന്ദർഭം പിന്മാറ്റം സൂചിപ്പിക്കാമെങ്കിലും, ഹീബ്രു ക്രിയയുടെ നേരിട്ടുള്ള അർഥം അതിനെ നിർബന്ധിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ തീർപ്പ് മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ ബദൽ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ഗൗരവമുള്ള ചരിത്രവിവരണശൈലി സ്വീകരിച്ചു. പേരുകൾ മലയാള ബൈബിൾപരമ്പരയോട് ചേർന്ന ലിപ്യന്തരണത്തിൽ നൽകി; ഹീബ്രു പാഠത്തിലെ യഥാർഥ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
