  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָמַר֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לִ֥/י דִבֶּ֖ר צ֣וּר יִשְׂרָאֵ֑ל מוֹשֵׁל֙ בָּ/אָדָ֔ם צַדִּ֕יק מוֹשֵׁ֖ל יִרְאַ֥ת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
translation:
  language: ml
  text: 'ഇസ്രായേലിന്റെ ദൈവം അരുളിച്ചെയ്തു;


    ഇസ്രായേലിന്റെ പാറ എന്നോടു അരുളിച്ചെയ്തു:


    “മനുഷ്യരുടെമേൽ[a] നീതിയോടെ ഭരിക്കുന്നവൻ,


    ദൈവഭയത്തിൽ ഭരിക്കുന്നവൻ[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘മനുഷ്യന്റെമേൽ.’ എബ്രായത്തിലെ אָדָם എന്ന പദം ഇവിടെ മനുഷ്യവർഗത്തെ പ്രതിനിധീകരിക്കുന്ന കൂട്ടാർഥത്തിൽ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ വരിയെ മാതൃകാഭരണാധികാരിയുടെ പൊതുവിവരണമായി വായിക്കാം. മശീഹാപരമായ ഒരു വായനയിൽ, മശീഹയിൽ നിറവേറുന്ന ആദർശരാജത്വത്തിന്റെ വിവരണമായും ഇതിനെ കാണുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക അരുളപ്പാടിനെ പരിചയപ്പെടുത്തുന്ന പൂർണക്രിയയാണ്. സാധാരണ ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ‘അരുളിച്ചെയ്തു’ പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഗൗരവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: യിസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന സംയുക്തനാമപ്രയോഗം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: לִי
  choice: എന്നോടു
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ പൂർവപ്രത്യയം ഇവിടെ ദാവീദിനോടാണ് വാക്ക് പറയപ്പെട്ടതെന്ന് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘എന്നെക്കുറിച്ച്’ എന്ന സാധ്യത സന്ദർഭത്തിൽ കുറവാണ്.
- source_word: דִבֶּר
  choice: സംസാരിച്ചു
  rationale: אָמַר എന്നതിനോടുള്ള സമാന്തരത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്ന സ്വാഭാവിക ക്രിയ.
- source_word: צוּר יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പാറ
  rationale: സ്ഥിരതയും സംരക്ഷണവും സൂചിപ്പിക്കുന്ന ദൈവിക രൂപകനാമമായ ‘പാറ’ പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തി.
- source_word: מוֹשֵׁל
  choice: ഭരിക്കുന്നവൻ
  rationale: സാമാന്യവും സിദ്ധാന്തപരവുമായ പങ്കാളിത്തക്രിയയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: בָּאָדָם
  choice: മനുഷ്യരെ
  rationale: אָדָם ഇവിടെ മനുഷ്യവർഗത്തെ കൂട്ടമായി പ്രതിനിധീകരിക്കുന്നു; ഭരണം മനുഷ്യരുടെമേലാണെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘മനുഷ്യരെ ഭരിക്കുക’ എന്നു നൽകി.
- source_word: צַדִּיק
  choice: നീതിയോടെ
  rationale: രൂപപരമായി വിശേഷണമാണെങ്കിലും ഈ സംക്ഷിപ്ത കാവ്യവാക്യത്തിൽ ഭരണം എങ്ങനെയായിരിക്കണം എന്ന ക്രിയാവിശേഷണാത്മക അർഥമാണ് സന്ദർഭോചിതം.
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  choice: ദൈവഭയത്തിൽ ഭരിക്കുന്നവൻ
  rationale: രണ്ടാമത്തെ പങ്കാളിത്തപ്രയോഗം മാതൃകാഭരണാധികാരിയെ കൂടുതൽ വിശേഷിപ്പിക്കുന്നു. ‘ദൈവഭയത്തിൽ’ എന്നത് ദൈവത്തോടുള്ള ഭക്ത്യാദരവും അവിടുത്തെ മുമ്പിലുള്ള ഉത്തരവാദിത്വവും നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ബഹുവചനരൂപമുള്ള എബ്രായപദം ഇവിടെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമായതിനാൽ മലയാളത്തിൽ ഏകവചനമായി നൽകി.
theological_decisions:
- issue: മശീഹാപരമായ വായനയോ പൊതുവായ രാജഭരണതത്ത്വമോ
  choice: മാതൃകാഭരണാധികാരിയെക്കുറിച്ചുള്ള പൊതുതത്ത്വമായി പ്രധാനപാഠം പരിഭാഷപ്പെടുത്തി; മശീഹയെ നേരിട്ട് ചേർത്തിട്ടില്ല.
  alternative: മാതൃകാരാജാവിനെക്കുറിച്ചുള്ള ഈ വിവരണം മശീഹയിൽ ആത്യന്തികമായി നിറവേറുന്നതായി വായിക്കാം.
  rationale: എബ്രായപാഠം മശീഹയെ വ്യക്തമായി നാമകരണം ചെയ്യുന്നില്ല. എന്നാൽ ദാവീദിന്റെ ‘അവസാനവാക്കുകൾ’ എന്ന പശ്ചാത്തലം മശീഹാപരമായ പ്രസക്തിക്ക് ഇടനൽകുന്നു; അതിനാൽ പ്രധാനപാഠത്തിൽ പൊതുതത്ത്വവും അടിക്കുറിപ്പിൽ ആ വായനാസാധ്യതയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യ-പ്രവാചക ശൈലി ഉപയോഗിച്ചു. ‘അരുളിച്ചെയ്തു,’ ‘പാറ,’ ‘ദൈവഭയത്തിൽ’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ മതപരവും രൂപകാത്മകവുമായ ഭാരം നിലനിർത്തുന്നു; വാക്യത്തിന്റെ അപൂർണമായി തുടരുന്ന കാവ്യഘടന സൂചിപ്പിക്കാൻ അവസാനത്തിൽ കോമ നിലനിർത്തി.
