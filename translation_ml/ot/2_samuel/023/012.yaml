  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְיַצֵּ֤ב בְּ/תוֹךְ הַֽ/חֶלְקָה֙ וַ/יַּצִּילֶ֔/הָ וַ/יַּ֖ךְ אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֥עַשׂ יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
translation:
  language: ml
  text: എന്നാൽ അവൻ ആ വയലിന്റെ നടുവിൽ നിലയുറപ്പിച്ച് അതിനെ രക്ഷിച്ചു; ഫെലിസ്ത്യരെ തോൽപ്പിച്ചു. യഹ്‌വെ വലിയ വിജയം[a] നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വലിയൊരു വിടുതൽ’ അല്ലെങ്കിൽ ‘വലിയൊരു രക്ഷ.’ എബ്രായപദത്തിന് ഈ അർഥങ്ങളും വരാം; ഇവിടെ അത് യുദ്ധത്തിൽ യഹ്‌വെ നൽകിയ രക്ഷയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  choice: നിലയുറപ്പിച്ച്
  rationale: התיצב എന്ന ഹിത്പയേൽ രൂപം ഒരാൾ ബോധപൂർവം തന്റെ സ്ഥാനത്ത് ഉറച്ചുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; യുദ്ധസന്ദർഭത്തിൽ ‘നിലയുറപ്പിച്ചു’ സ്വാഭാവികവും ശക്തവുമാണ്.
- source_word: בְּתוֹךְ הַחֶלְקָה
  choice: ആ നിലത്തിന്റെ നടുവിൽ
  rationale: חֶלְקָה ഒരു നിലത്തെയോ ഭൂമിയുടെ ഒരു ഭാഗത്തെയോ സൂചിപ്പിക്കാം. മുൻസന്ദർഭത്തിലെ നിർദ്ദിഷ്ട കൃഷിയിടത്തെയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘ആ നിലം’ എന്നു നൽകി.
- source_word: וַיַּצִּילֶהָ
  choice: അതിനെ രക്ഷിച്ചു
  rationale: נצל എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘രക്ഷിക്കുക/വിടുവിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം നിലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരെ വെട്ടിവീഴ്ത്തി
  rationale: נכה യുദ്ധസന്ദർഭത്തിൽ ശത്രുക്കളെ പ്രഹരിച്ച് വീഴ്ത്തുകയോ തോൽപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വെട്ടിവീഴ്ത്തി’ അതിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיַּעַשׂ יְהוָה
  choice: യഹ്‌വെ … വരുത്തി
  rationale: עשה എന്ന ക്രിയയ്ക്ക് תְּשׁוּעָה പോലുള്ള ഫലസൂചക നാമത്തോടൊപ്പം ‘സംഭവിപ്പിച്ചു/വരുത്തി’ എന്ന അർഥമാണ്; ദൈവിക പ്രവർത്തകത്വം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ വ്യഞ്ജനനാമമായ יהוהയെ ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: വലിയൊരു വിജയം
  rationale: תְּשׁוּעָהയ്ക്ക് രക്ഷ, വിടുതൽ, വിജയം എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ഈ യുദ്ധസന്ദർഭത്തിൽ ‘വിജയം’ ഏറ്റവും നേരിട്ടുള്ള അർഥം നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ചതുർവ്യഞ്ജന ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പേര് എന്ന സ്വഭാവം നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: യുദ്ധസന്ദർഭത്തിലെ תְּשׁוּעָה
  choice: വിജയം
  alternative: വിടുതൽ; രക്ഷ
  rationale: ഇവിടെ ദൈവം യുദ്ധത്തിലൂടെ നൽകിയ ഫലമാണ് മുഖ്യമായി സൂചിപ്പിക്കുന്നത്. ‘വിജയം’ സന്ദർഭത്തിന് യോജിച്ചെങ്കിലും പദത്തിന്റെ വിശാലമായ രക്ഷാർഥം ഇല്ലാതാക്കാതിരിക്കാൻ മറ്റു വായനകൾ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ക്രിയകളുടെ ദ്രുതമായ തുടർച്ച യുദ്ധവിവരണത്തിന്റെ ചലനം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം അർഥവൈവിധ്യമുള്ള ‘വിജയം’ എന്ന പദത്തോടാണ് ചേർത്തിരിക്കുന്നത്.
