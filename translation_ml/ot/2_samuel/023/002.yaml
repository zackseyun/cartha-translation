source:
  edition: WLC
  text: ר֥וּחַ יְהוָ֖ה דִּבֶּר בִּ֑/י וּ/מִלָּת֖/וֹ עַל לְשׁוֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/002.yaml
  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
translation:
  language: ml
  text: യഹ്‌വേയുടെ ആത്മാവ് എന്നിലൂടെ സംസാരിച്ചു[a]; അവിടുത്തെ വചനം എന്റെ നാവിന്മേൽ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നിൽ സംസാരിച്ചു.’ ഇവിടെ എബ്രായ ഉപസർഗം മാധ്യമത്തെ സൂചിപ്പിച്ച് ‘എന്നിലൂടെ’ എന്ന അർഥത്തിലും സ്ഥലാർഥത്തിൽ ‘എന്നിൽ’ എന്ന അർഥത്തിലും ഗ്രഹിക്കാവുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  choice: യഹ്‌വേയുടെ ആത്മാവ്
  rationale: പ്രവാചകവചനത്തിന്റെ ഈ സന്ദർഭത്തിൽ רוּחַ എന്നതിന് ‘കാറ്റ്’ അല്ലെങ്കിൽ ‘ശ്വാസം’ എന്നതിനെക്കാൾ ദൈവിക വെളിപ്പെടുത്തലിന്റെ പ്രവർത്തകത്വം സൂചിപ്പിക്കുന്ന ‘ആത്മാവ്’ യോജിക്കുന്നു. יְהוָה എന്ന ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: דִּבֶּר בִּי
  choice: എന്നിലൂടെ സംസാരിച്ചു
  rationale: דִּבֶּר എന്നത് ‘സംസാരിച്ചു’ എന്നും בִּי ഇവിടെ മാധ്യമത്തെ അഥവാ ഉപകരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നിലൂടെ’ എന്നും പരിഭാഷപ്പെടുത്തി. ‘എന്നിൽ സംസാരിച്ചു’ എന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּמִלָּתוֹ
  choice: അവിടുത്തെ വചനം
  rationale: מִלָּה എന്നത് ‘വാക്ക്/ഉച്ചാരണം’ എന്നാണ്; ‘സന്ദേശം’ എന്ന വിശദീകരണപരമായ പദത്തേക്കാൾ ‘വചനം’ ദൈവിക അരുളപ്പാടിന്റെ ഭാരവും മലയാള ബൈബിൾഭാഷയിലെ സ്വാഭാവിക ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: עַל לְשׁוֹנִי
  choice: എന്റെ നാവിന്മേൽ ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ ‘എന്റെ നാവിന്മേൽ’ എന്ന ദൃശ്യരൂപം കാത്തുസൂക്ഷിച്ചുകൊണ്ട്, היה എന്ന ക്രിയ വാക്യത്തിൽ അന്തർനിഹിതമായതിനാൽ ‘ഉണ്ടായിരുന്നു’ ചേർത്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- issue: רוּחַ വ്യക്തിപരമായ ‘ആത്മാവ്’ ആണോ ‘കാറ്റ്/ശ്വാസം’ ആണോ
  choice: ആത്മാവ്
  alternative: ശ്വാസം; കാറ്റ്
  rationale: ദൈവം ദാവീദിലൂടെ സംസാരിക്കുന്ന പ്രവാചകസന്ദർഭം ‘ആത്മാവ്’ എന്ന അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; അതേസമയം വാക്യം പറയുന്നതിലപ്പുറം ത്രിത്വശാസ്ത്രപരമായ വിശദീകരണം ചേർത്തിട്ടില്ല.
- issue: בִּי എന്നതിലെ മാധ്യമാർഥം
  choice: എന്നിലൂടെ
  alternative: എന്നിൽ
  rationale: തുടർന്നുള്ള ‘അവിടുത്തെ വചനം എന്റെ നാവിന്മേൽ’ എന്ന സമാന്തരവാക്യം ദാവീദ് ദൈവവചനത്തിന്റെ മാധ്യമമാണെന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും എബ്രായ ഉപസർഗത്തിന്റെ സ്ഥലാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമമായി ആദരസൂചകമായ ‘അവിടുത്തെ’ ഉപയോഗിച്ചു. എബ്രായ കാവ്യദൃശ്യമായ ‘നാവിന്മേൽ’ നിലനിർത്തി; അസ്വാഭാവികമായ അതിപദാനുപദത ഒഴിവാക്കി.
