lexical_decisions:
- source_word: חצרו
  choice: ഹെസ്രോ
  rationale: ദാവീദിന്റെ വീരന്മാരുടെ പട്ടികയിലെ വ്യക്തിനാമമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: הַכַּרְמְלִי
  choice: കർമ്മേൽക്കാരനായ
  rationale: കർമ്മേൽ എന്ന സ്ഥലത്തുനിന്നുള്ളവൻ എന്ന ജനപദസൂചക അർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; പിൽക്കാലത്തെ കർമ്മലീത്താ സന്യാസസമൂഹവുമായി തെറ്റിദ്ധരിക്കപ്പെടുന്നത് ഒഴിവാക്കുന്നു.
- source_word: פַּעֲרַי
  choice: പയരായി
  rationale: വ്യക്തിനാമമായതിനാൽ ഹീബ്രു വ്യഞ്ജന-സ്വരരൂപം കഴിയുന്നത്ര നിലനിർത്തി ലിപ്യന്തരിച്ചു.
- source_word: הָאַרְבִּי
  choice: അരബ്‌ക്കാരനായ
  rationale: അരബ് എന്ന സ്ഥലത്തുനിന്നുള്ളവനെ സൂചിപ്പിക്കുന്ന ജനപദനാമമായി ഗ്രഹിച്ചു; പട്ടികയുടെ സംക്ഷിപ്തശൈലി നിലനിർത്തി.
