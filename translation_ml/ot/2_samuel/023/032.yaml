  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും മാന്യവുമായ പട്ടികാശൈലി. മൂലപാഠത്തിലെ അസ്വാഭാവികത നീക്കി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിച്ചിരിക്കുന്നു; അതിന്റെ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്.
