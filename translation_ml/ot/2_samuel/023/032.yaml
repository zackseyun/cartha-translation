  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇവിടത്തെ എബ്രായപാഠം സംക്ഷിപ്തവും ദുഷ്കരവുമാണ്; അക്ഷരാർഥത്തിൽ: “എല്യഹ്ബാ, ശാൽബോന്യൻ, യാശേന്റെ പുത്രന്മാർ, യോനാഥാൻ.” പാഠത്തിൽ ക്രമക്കേടുണ്ടെന്നു കരുതി, “യോനാഥാൻ” ‘യാശേന്റെ പുത്രന്മാരിൽ’ ഒരാളാണെന്നതുപോലെ ചിലർ പട്ടിക പുനർനിർമിക്കുന്നു. എന്നാൽ ഈ പരിഭാഷ പാഠം തിരുത്താതെ ലഭിച്ചിരിക്കുന്ന എബ്രായവാചകം അതേപടി നിലനിർത്തുന്നു.'
    reason: textual_variant
lexical_decisions:
- source_word: אֶלְיַחְבָּא
  choice: എല്യഹ്ബാ
  rationale: എബ്രായ വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַשַּׁעַלְבֹנִי
  choice: ശാൽബോന്യനായ
  rationale: ശാൽബോൻ/ശാൽബീം സ്വദേശിയെ സൂചിപ്പിക്കുന്ന നിവാസിവാചക രൂപം; മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: ഇത് ‘പുത്രൻ’ എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപമാണ്. പിന്നാലെ ഏകവചന വ്യക്തിനാമം വരുന്നതിനാൽ വാക്യം ദുഷ്കരമാണെങ്കിലും, മൂലപാഠത്തിലെ ബഹുവചനം അതേപടി നിലനിർത്തി.
- source_word: יָשֵׁן
  choice: യാശേൻ
  rationale: ‘യാശേന്റെ പുത്രന്മാർ’ എന്ന സംയുക്തപദബന്ധത്തിലെ വ്യക്തിനാമമായി കണ്ട് ലിപ്യന്തരണം ചെയ്തു; പാഠം ഭേദഗതി ചെയ്തിട്ടില്ല.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ രൂപത്തിൽ നൽകി.
