source:
  edition: WLC
  text: צֶ֖לֶק הָ/עַמֹּנִ֑י נַחְרַי֙ הַ/בְּאֵ֣רֹתִ֔י נשאי כְּלֵ֖י יוֹאָ֥ב בֶּן צְרֻיָֽהס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/037.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, armor-bearer of Joab son of Zeruiah;
translation:
  language: ml
  text: അമ്മോന്യനായ സെലെക്ക്; ബെരോത്തുകാരനായ നഹരായി, സെരൂയയുടെ മകനായ യോവാബിന്റെ ആയുധവാഹകൻ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶלֶק
  choice: സെലെക്ക്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ശബ്ദലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: הָעַמֹּנִי
  choice: അമ്മോന്യനായ
  rationale: അമ്മോനിൽനിന്നുള്ള വംശീയ-ദേശീയ തിരിച്ചറിയൽ സൂചിപ്പിക്കുന്ന വിശേഷണം; പട്ടികാശൈലിക്ക് യോജിച്ച സംക്ഷിപ്ത രൂപം.
- source_word: נַחְרַי
  choice: നഹരായി
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങളിലെ Naḥray എന്ന ഉച്ചാരണത്തോട് അടുത്ത മലയാളലിപ്യന്തരണം.
- source_word: הַבְּאֵרֹתִי
  choice: ബെരോത്യനായ
  rationale: ബെരോത്ത് സ്വദേശിയെന്ന ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയൽ മലയാളത്തിൽ സ്വാഭാവികമായ ജനവിഭാഗ/ദേശനാമവിശേഷണമായി നൽകിയിരിക്കുന്നു.
- source_word: נשאי כְּלֵי
  choice: ആയുധവാഹകൻ
  rationale: എഴുത്തുരൂപം נשאי ആണെങ്കിലും സന്ദർഭം ഏകവചനത്തിലുള്ള സൈനികപദവിയെ സൂചിപ്പിക്കുന്നു; כְּלֵי എന്ന പൊതുവായ ‘ഉപകരണങ്ങൾ/ആയുധങ്ങൾ’ എന്ന പദം സൈനികസന്ദർഭത്തിൽ ചേർന്ന് ആയുധങ്ങൾ വഹിക്കുന്ന ചുമതലയെ സൂചിപ്പിക്കുന്നു.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: സെരൂയയുടെ മകനായ യോവാബ്
  rationale: ബന്ധസൂചന പൂർണമായി നിലനിർത്തി, മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സംക്ഷിപ്തവുമായ പട്ടികാശൈലി. മൂലപാഠത്തിലെ തുടർച്ച സൂചിപ്പിക്കാൻ അർദ്ധവിരാമങ്ങൾ നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് നഹരായി എന്ന പേരിന്റെ ഇംഗ്ലീഷ് ലിപ്യന്തരണഭേദത്തെക്കുറിച്ചുള്ളതുമാത്രമായതിനാൽ മലയാളവായനയിൽ പ്രസക്തമായ പാഠഭേദമല്ല; അതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
