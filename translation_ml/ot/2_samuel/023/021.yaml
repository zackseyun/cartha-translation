  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
translation:
  language: ml
  text: അവൻ കാഴ്ചയിൽ ശ്രദ്ധേയനായ ഒരു ഈജിപ്തുകാരനെയും[a] വീഴ്ത്തി. ആ ഈജിപ്തുകാരന്റെ കൈയിൽ ഒരു കുന്തമുണ്ടായിരുന്നു. അവൻ ഒരു വടിയുമായി[b] ആ ഈജിപ്തുകാരന്റെ നേരെ ഇറങ്ങിച്ചെന്ന്, ഈജിപ്തുകാരന്റെ കൈയിൽനിന്ന് കുന്തം പിടിച്ചുപറിച്ച്, അയാളുടെതന്നെ കുന്തംകൊണ്ട് അയാളെ കൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സുന്ദരനായ ഒരാൾ’ അല്ലെങ്കിൽ ‘ശ്രദ്ധേയമായ രൂപമുള്ള ഒരാൾ.’ എബ്രായപ്രയോഗം ഈജിപ്തുകാരന്റെ ബാഹ്യരൂപത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു. 1 ദിനവൃത്താന്തം 11:23-ലെ സമാന്തരവിവരണത്തിന്റെ അടിസ്ഥാനത്തിൽ ചിലർ ഇതിനെ അസാധാരണമായ ഉയരത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കുറുവടിയുമായി’ അല്ലെങ്കിൽ ‘ദണ്ഡുമായി.’ എബ്രായത്തിലെ שֵׁבֶט എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് വടി, ദണ്ഡ്, ചെങ്കോൽ, കുറുവടി എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא הִכָּה
  choice: അവൻ ... വീഴ്ത്തി
  rationale: പട്ടികയിലെ മറ്റൊരു വീരകൃത്യം കൂട്ടിച്ചേർക്കുന്ന വാക്യബന്ധവും נכה എന്ന ക്രിയയുടെ ‘അടിച്ചുവീഴ്ത്തുക/വീഴ്ത്തുക’ എന്ന യുദ്ധസന്ദർഭാർഥവും നൽകുന്നു; അവസാനത്തെ ‘കൊന്നു’ എന്ന വിശദാംശം മുൻകൂട്ടി ലയിപ്പിക്കുന്നില്ല.
- source_word: אִישׁ מִצְרִי
  choice: ഒരു ഈജിപ്തുകാരൻ
  rationale: ജാതീയ തിരിച്ചറിയൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: אשר מַרְאֶה
  choice: കാഴ്ചയിൽ പ്രഭാവമുള്ള
  rationale: മസോര പാഠത്തിലെ പ്രയോഗം ദൃശ്യരൂപത്തെയോ ഭാവത്തെയോ പൊതുവായി സൂചിപ്പിക്കുന്നു; സൗന്ദര്യമോ അസാധാരണമായ ഉയരമോ മാത്രം എന്ന് നിശ്ചയിക്കുന്നില്ല.
- source_word: וּבְיַד הַמִּצְרִי חֲנִית
  choice: ആ ഈജിപ്തുകാരന്റെ കൈയിൽ ഒരു കുന്തമുണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ ഉടമസ്ഥതാസംവിധാനവും ദൃശ്യചിത്രവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּרֶד אֵלָיו
  choice: അയാളുടെ നേരെ ഇറങ്ങിച്ചെന്ന്
  rationale: ירד എന്നതിലെ താഴേക്കുള്ള ചലനാർഥം സൂക്ഷിക്കുകയും ഇവിടെ എതിരാളിയിലേക്കുള്ള നീക്കമാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בַּשָּׁבֶט
  choice: ഒരു വടിയുമായി
  rationale: שֵׁבֶט എന്ന പദത്തിന്റെ staff/rod/club അർഥപരിധിയിൽ, ആയുധത്തിന്റെ സ്വഭാവം അനാവശ്യമായി പ്രത്യേകീകരിക്കാത്ത പൊതുവായ മലയാളപദമാണ്.
- source_word: וַיִּגְזֹל
  choice: പിടിച്ചുപറിച്ച്
  rationale: גזל സൂചിപ്പിക്കുന്ന ബലപ്രയോഗത്തിലൂടെയുള്ള കവർച്ചയെ യുദ്ധസന്ദർഭത്തിൽ സജീവമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּהַרְגֵהוּ
  choice: അയാളെ കൊന്നു
  rationale: הרג എന്ന സാധാരണ കൊലക്രിയയുടെ നേരിട്ടുള്ള, ആധുനിക മലയാളരൂപം.
- source_word: בַּחֲנִיתוֹ
  choice: അയാളുടെതന്നെ കുന്തംകൊണ്ട്
  rationale: പ്രത്യയം ഈജിപ്തുകാരനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ആയുധം അവനിൽനിന്ന് പിടിച്ചുപറിച്ചതെന്ന മുൻവിവരത്തോട് ചേർന്ന് സംഭവത്തിലെ മറിച്ചിടൽ വ്യക്തമാക്കുന്നു.
