id: 2SA.23.10
reference: 2 Samuel 23:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ה֣וּא קָם֩ וַ/יַּ֨ךְ בַּ/פְּלִשְׁתִּ֜ים עַ֣ד כִּֽי יָגְעָ֣ה יָד֗/וֹ וַ/תִּדְבַּ֤ק יָד/וֹ֙ אֶל הַ/חֶ֔רֶב וַ/יַּ֧עַשׂ יְהוָ֛ה תְּשׁוּעָ֥ה גְדוֹלָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/הָ/עָ֛ם יָשֻׁ֥בוּ אַחֲרָ֖י/ו אַךְ לְ/פַשֵּֽׁט׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
translation:
  language: ml
  text: അവൻ എഴുന്നേറ്റ്, അവന്റെ കൈ തളരുന്നതുവരെ ഫെലിസ്ത്യരെ അടിച്ചുവീഴ്ത്തി; അവന്റെ കൈ വാളിൽ ഒട്ടിപ്പിടിച്ചു. അന്നു യഹ്‌വെ വലിയൊരു വിജയം[a] വരുത്തി. ജനമാകട്ടെ, കൊല്ലപ്പെട്ടവരിൽനിന്ന് ആയുധങ്ങളും കൊള്ളവസ്തുക്കളും ഊരിയെടുക്കാൻ മാത്രം അവന്റെ പിന്നാലെ മടങ്ങിവന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വലിയൊരു വിടുതൽ” അഥവാ “വലിയൊരു രക്ഷ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് വിശാലമായി രക്ഷയെയോ വിടുതലിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ യുദ്ധത്തിൽ യഹ്‌വെ വരുത്തിയ നിർണായക വിജയമാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “ഊരിയെടുക്കാൻ മാത്രം”; അതായത്, യുദ്ധത്തിൽ വീണവരിൽനിന്ന് ആയുധങ്ങളും കൊള്ളവസ്തുക്കളും എടുത്തുകൊള്ളാൻ.
    reason: cultural_note
lexical_decisions:
- source_word: קָם
  choice: എഴുന്നേറ്റ്
  rationale: യുദ്ധത്തിൽ നിർണായകമായി പ്രവർത്തിക്കാൻ മുന്നിട്ടിറങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗം.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരെ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ ശക്തിയും മാരകമായ പ്രഹരവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: עַד כִּי יָגְעָה יָדוֹ
  choice: ഒടുവിൽ അവന്റെ കൈ തളർന്നു
  rationale: യുദ്ധം തുടരുന്നതിനിടെ കൈ ക്ഷീണിച്ച ഫലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  choice: കൈ വാളിനോടു പറ്റിപ്പിടിച്ചു
  rationale: דבק എന്നതിന്റെ ‘പറ്റുക/ചേർന്നുനിൽക്കുക’ എന്ന ദൃശ്യത നിലനിർത്തുന്നു; പേശിവലിവാണോ അതിശയോക്തിയാണോ എന്ന് നിർബന്ധിച്ച് തീരുമാനിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ יהוהയെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: വലിയൊരു വിജയം
  rationale: തെഷൂആ എന്ന പദത്തിന് വിടുതൽ/രക്ഷ എന്ന വിശാല അർഥവ്യാപ്തിയുണ്ടെങ്കിലും ഈ യുദ്ധസന്ദർഭത്തിൽ ‘വിജയം’ ഉടൻ ഗ്രഹിക്കാവുന്ന അർഥമാണ്; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהָעָם יָשֻׁבוּ אַחֲרָיו
  choice: ജനമാകട്ടെ ... അവന്റെ പിന്നാലെ മടങ്ങിവന്നു
  rationale: അവൻ നിർണായക പോരാട്ടം നടത്തിയശേഷം ജനം അവന്റെ പിന്നാലെ തിരിച്ചെത്തിയെന്ന എബ്രായ വാക്യക്രമം പരമാവധി നിലനിർത്തുന്നു.
- source_word: אַךְ לְפַשֵּׁט
  choice: കൊല്ലപ്പെട്ടവരുടെ ആയുധങ്ങളും കൊള്ളവസ്തുക്കളും ഊരിയെടുക്കാൻ മാത്രം
  rationale: യുദ്ധാനന്തരം വീണവരിൽനിന്ന് ആയുധങ്ങളും കൊള്ളയും ഊരിയെടുക്കുന്നതാണ് פשט എന്നതിന്റെ സന്ദർഭാർഥം; മലയാളവായനക്കാരന് പ്രവൃത്തി വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയായി മാറ്റാതെ സംരക്ഷിക്കുന്നു; പ്രത്യേക സമുദായപരമായ പകരപ്പദം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: תְּשׁוּעָה എന്നതിന്റെ യുദ്ധസന്ദർഭാർഥം
  choice: വിജയം
  alternative: വിടുതൽ; രക്ഷ
  rationale: ഇവിടെ യുദ്ധത്തിലെ നിർണായക ഫലമാണ് മുൻനിരയിൽ; എന്നാൽ പദത്തിന്റെ വിശാലമായ രക്ഷാ/വിടുതൽ അർഥം അടിക്കുറിപ്പിലൂടെ തുറന്നുവയ്ക്കുന്നു.
- issue: വിജയത്തിലെ ദൈവിക പ്രവർത്തനം
  choice: യഹ്‌വെ ... നൽകി
  alternative: യഹ്‌വെ ... വരുത്തി; യഹ്‌വെ ... പ്രവർത്തിച്ചു
  rationale: וַיַּעַשׂ יְהוָה എന്നത് വിജയത്തിന്റെ കർത്താവ് യഹ്‌വെയാണെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘നൽകി’ സ്വാഭാവികമായിരിക്കെ ദൈവിക പ്രവർത്തനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പറ്റിപ്പിടിച്ചു’ എന്ന ദൃശ്യപ്രയോഗം മൂലപാഠത്തിന്റെ സജീവതയും വ്യാഖ്യാനതുറപ്പില്ലായ്മയും സംരക്ഷിക്കുന്നു. മുഖ്യപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
