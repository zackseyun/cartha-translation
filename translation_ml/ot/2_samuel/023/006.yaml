  text: וּ/בְלִיַּ֕עַל כְּ/ק֥וֹץ מֻנָ֖ד כֻּלָּ֑/הַם כִּֽי לֹ֥א בְ/יָ֖ד יִקָּֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/006.yaml
  text: But worthless men are all like thorns cast aside[a], for they cannot be taken with the hand.
translation:
  language: ml
  text: എന്നാൽ നികൃഷ്ടന്മാരെല്ലാം തള്ളിക്കളയപ്പെട്ട മുള്ളുകൾപോലെയാണ്[a]; കാരണം, അവയെ കൈകൊണ്ട് എടുക്കാനാവില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള എബ്രായപദമായ ‘ബെലിയാൽ’ എന്നതിന് ‘വിലയില്ലാത്തവർ’ അല്ലെങ്കിൽ ‘ദുഷ്ടർ’ എന്നാണ് സാധ്യതയുള്ള അർഥം; പിൽക്കാലത്ത് ഉപയോഗിച്ച വ്യക്തിനാമമായ ‘ബെലിയാൽ’ അല്ല ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלִיַּעַל
  choice: എന്നാൽ നീചന്മാർ
  rationale: ഇവിടെ ഈ നാമം പിൽക്കാലത്തെ ‘ബെലിയാൽ’ എന്ന വ്യക്തിനാമത്തെയല്ല, ദുഷ്ടരും വിലകെട്ടവരുമായ ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്. തുടർന്നുള്ള ബഹുവചനരൂപങ്ങൾക്ക് അനുസരിച്ച് വ്യക്തികളെ സൂചിപ്പിക്കുന്ന മലയാള ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: כְּקוֹץ
  choice: മുള്ളുകൾപോലെ
  rationale: എബ്രായത്തിൽ ഏകവചനരൂപമാണെങ്കിലും ഉപമയ്ക്ക് സമൂഹവാചക അർഥമുണ്ട്; ബഹുവചനമായ ആളുകളോടുള്ള താരതമ്യം സ്വാഭാവികമാക്കാൻ ‘മുള്ളുകൾ’ എന്നു നൽകി.
- source_word: מֻנָד
  choice: വലിച്ചെറിയപ്പെട്ട
  rationale: അകറ്റിക്കളയുകയോ തള്ളിക്കളയുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ കൃദന്തരൂപം മുള്ളുകളുടെ ദൃശ്യബിംബത്തോടും അടുത്ത വരിയിലെ കൈകാര്യം ചെയ്യാനാവാത്ത അവസ്ഥയോടും ചേരുന്നു.
- source_word: כֻּלָּהַם
  choice: എല്ലാം
  rationale: ആ കൂട്ടത്തിലെ ആരും ഒഴിവല്ലെന്ന സമഗ്രത നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന അർധവിരാമബന്ധം
  rationale: രണ്ടാം ഭാഗം ആദ്യത്തെ ഉപമയുടെ കാരണം വിശദീകരിക്കുന്നു; മലയാളത്തിൽ ‘കാരണം’ ചേർക്കാതെ അർധവിരാമത്തിലൂടെ ഈ വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: לֹא בְיָד יִקָּחוּ
  choice: അവയെ കൈകൊണ്ട് എടുക്കാനാവില്ല
  rationale: മുള്ളുകളെ നേരിട്ട് കൈകൊണ്ട് പിടിക്കുകയോ എടുക്കുകയോ ചെയ്യാത്ത പ്രായോഗിക അസാധ്യത വ്യക്തമാക്കുന്നു; നിഷ്ക്രിയ ആശയം മലയാളത്തിലെ ശേഷിയില്ലായ്മയുടെ സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നിലനിർത്തി.
theological_decisions:
- issue: בְלִיַּעַל എന്ന പദം വ്യക്തിനാമമാണോ ഗുണവാചകമാണോ
  choice: നീചന്മാർ
  alternative: ബെലിയാലിന്റെ ആളുകൾ / ബെലിയാൽ
  rationale: ഈ പുരാതന സന്ദർഭത്തിൽ പദം ദുഷ്ടരെയോ വിലകെട്ടവരെയോ സൂചിപ്പിക്കുന്ന പൊതുനാമമാണ്; പിൽക്കാലത്തെ വ്യക്തിവൽക്കരിച്ച ‘ബെലിയാൽ’ എന്ന ആശയം ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നത് കാലവിരുദ്ധവും തെറ്റിദ്ധരിപ്പിക്കുന്നതുമായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നീചന്മാർ’ ദുഷ്ടതയും വിലകെട്ട സ്വഭാവവും സംക്ഷിപ്തമായി നൽകുന്നു. മുള്ളുകളുടെ ഉപമയും കൈകൊണ്ട് എടുക്കാനാവാത്തതെന്ന കാരണവിവരണവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
