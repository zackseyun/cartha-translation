translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പേരുപട്ടികാശൈലി ഉപയോഗിച്ചു. ആദ്യ പേരിലെ ബന്ധക്രമത്തെക്കുറിച്ചുള്ള യഥാർഥ വ്യാകരണസന്ദിഗ്ധത മുഖ്യവായനയിലും അടിക്കുറിപ്പിലെ മറ്റൊരു വായനയിലും സംരക്ഷിച്ചു.
