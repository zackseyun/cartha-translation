  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְאַוֶּ֥ה דָוִ֖ד וַ/יֹּאמַ֑ר מִ֚י יַשְׁקֵ֣/נִי מַ֔יִם מִ/בֹּ֥אר בֵּֽית לֶ֖חֶם אֲשֶׁ֥ר בַּ/שָּֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/015.yaml
  text: And David longed and said[a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: ml
  text: 'ദാവീദിന് അതിയായ ആഗ്രഹം തോന്നി; അദ്ദേഹം പറഞ്ഞു[a]: “കവാടത്തിനരികെയുള്ള ബേത്‌ലഹേമിലെ കിണറ്റിൽനിന്ന് ആരാണ് എനിക്ക് വെള്ളം കുടിക്കാൻ തരുക?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഭാവാത്മകമായി: “കവാടത്തിനരികെയുള്ള ബേത്‌ലഹേമിലെ കിണറ്റിൽനിന്ന് ആരെങ്കിലും എനിക്ക് വെള്ളം കുടിക്കാൻ തന്നിരുന്നെങ്കിൽ!” ആഗ്രഹം പ്രകടിപ്പിക്കാൻ ഹീബ്രു ഇവിടെ “ആരാണ്...?” എന്ന ചോദ്യരൂപം ഉപയോഗിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  choice: അതിയായ ആഗ്രഹം തോന്നി
  rationale: אוה എന്ന ക്രിയയുടെ ഹിത്പാഎൽ രൂപം ശക്തമായ ആഗ്രഹത്തെയോ കൊതിയെയോ സൂചിപ്പിക്കുന്നു. ആ വൈകാരിക തീവ്രത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וַיֹּאמַר
  choice: അദ്ദേഹം പറഞ്ഞു
  rationale: ഇത് സാധാരണയായി ‘പറഞ്ഞു’ എന്നർഥമുള്ള ക്രിയയാണ്. മൂലപാഠം ‘സ്വയം പറഞ്ഞു’ എന്നോ ‘വിളിച്ചുപറഞ്ഞു’ എന്നോ വ്യക്തമാക്കാത്തതിനാൽ അത്തരം ആശയങ്ങൾ ചേർത്തിട്ടില്ല.
- source_word: מִי
  choice: ആരാണ്
  rationale: ഹീബ്രുവിലെ ചോദ്യരൂപം അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഒരു ആഗ്രഹപ്രകടനമായും പ്രവർത്തിക്കുന്നു.
- source_word: יַשְׁקֵנִי
  choice: എനിക്ക് വെള്ളം കുടിക്കാൻ തരുക
  rationale: שקה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘കുടിപ്പിക്കുക’ അഥവാ ‘കുടിക്കാൻ കൊടുക്കുക’ എന്നർഥം നൽകുന്നു. പിന്നാലെ ‘വെള്ളം’ വരുന്നതിനാൽ ഈ രൂപം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מַיִם
  choice: വെള്ളം
  rationale: പദത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: מִבֹּאר
  choice: കിണറ്റിൽനിന്ന്
  rationale: בְּאֵר സാധാരണയായി ജലസംഭരണിയേക്കാൾ കിണറിനെയാണ് സൂചിപ്പിക്കുന്നത്; מן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: בֵּית לֶחֶם
  choice: ബേത്‌ലഹേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲשֶׁר בַּשָּׁעַר
  choice: കവാടത്തിനരികെയുള്ള
  rationale: ഈ വാക്യഭാഗം പട്ടണകവാടത്തോട് ബന്ധപ്പെട്ട പ്രത്യേക കിണറിനെ തിരിച്ചറിയിക്കുന്നു. ‘അരികെയുള്ള’ എന്നത് ഹീബ്രുവിലെ സ്ഥാനബന്ധം വ്യക്തമായി അറിയിക്കുന്നു; കിണർ കവാടത്തിനുള്ളിലാണെന്ന അനാവശ്യ ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ഹീബ്രുവിലെ ചോദ്യരൂപവും അതിനുള്ളിലെ ആഗ്രഹഭാവവും പ്രധാനവാക്യത്തിൽ നിലനിർത്തി; കൂടുതൽ ഭാവാത്മകമായ ആശയപരിഭാഷ അടിക്കുറിപ്പിൽ നൽകി.
