  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה דִּבְרֵ֥י דָוִ֖ד הָ/אַֽחֲרֹנִ֑ים נְאֻ֧ם דָּוִ֣ד בֶּן יִשַׁ֗י וּ/נְאֻ֤ם הַ/גֶּ֨בֶר֙ הֻ֣קַם עָ֔ל מְשִׁ֨יחַ֙ אֱלֹהֵ֣י יַֽעֲקֹ֔ב וּ/נְעִ֖ים זְמִר֥וֹת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'These are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
translation:
  language: ml
  text: 'ദാവീദിന്റെ അവസാന വചനങ്ങൾ ഇവയാണ്:


    യിശ്ശായിയുടെ മകനായ ദാവീദിന്റെ അരുളപ്പാട്[a]:


    ഉന്നതസ്ഥാനത്ത് ഉയർത്തപ്പെട്ട പുരുഷന്റെ അരുളപ്പാട്,


    യാക്കോബിന്റെ ദൈവത്തിന്റെ അഭിഷിക്തൻ[b],


    ഇസ്രായേലിന്റെ മധുരഗായകൻ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അരുളപ്പാട്” എന്നതിന് “ഉച്ചാരണം” അല്ലെങ്കിൽ “ഗൗരവപ്രഖ്യാപനം” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായപദം ഔപചാരികവും പലപ്പോഴും പ്രവചനാത്മകവുമായ പ്രസ്താവനയെ പരിചയപ്പെടുത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “യാക്കോബിന്റെ ദൈവത്താൽ അഭിഷിക്തനായവൻ.” അക്ഷരാർഥത്തിൽ “യാക്കോബിന്റെ ദൈവത്തിന്റെ അഭിഷിക്തൻ.” ഇവിടെ ഈ പ്രയോഗം നേരിട്ട് ദാവീദിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന് രാജകീയവും മശീഹീയവുമായ പ്രതിധ്വനിയുണ്ട്.
    reason: alternative_reading
  - marker: c
    text: “ഇസ്രായേലിന്റെ ഗാനങ്ങളുടെ മധുരഗായകൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי ... הָאַחֲרֹנִים
  choice: അവസാന വചനങ്ങൾ
  rationale: ‘വാക്കുകൾ’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തിക്കൊണ്ട്, ഈ ഗൗരവമേറിയ സമാപനപ്രസ്താവനയ്ക്ക് യോജിച്ച സ്വാഭാവിക മലയാളമായി ‘വചനങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: נְאֻם
  choice: അരുളപ്പാട്
  rationale: ഗൗരവപൂർണവും പ്രവചനാത്മകവുമായ ഔദ്യോഗിക ഉച്ചാരണത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ഉയർന്ന ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֶּן יִשַׁי
  choice: യിശ്ശായിയുടെ മകൻ
  rationale: ഹീബ്രായ പിതൃനാമഘടനയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: הַגֶּבֶר
  choice: പുരുഷൻ
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥവും ഗൗരവമുള്ള കാവ്യഭാവവും നിലനിർത്തുന്നു; ‘വീരൻ’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: הֻקַם עָל
  choice: ഉന്നതസ്ഥാനത്തേക്ക് ഉയർത്തപ്പെട്ട
  rationale: ദൈവത്താൽ ലഭിച്ച ഉയർച്ചയുടെയും സ്ഥാനമാനത്തിന്റെയും ഭാവം പ്രകടമാക്കുന്നു; കർത്താവ് ആരെന്നത് മൂലപാഠം പറയാത്തതിനാൽ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: מְשִׁיחַ אֱלֹהֵי יַעֲקֹב
  choice: യാക്കോബിന്റെ ദൈവത്താൽ അഭിഷിക്തനായവൻ
  rationale: മൂലത്തിലെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഇവിടെ നേരിട്ട് ദാവീദിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്ന പദവി മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ചിട്ടില്ല.
- source_word: נְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മധുരഗായകൻ
  rationale: ഹീബ്രായ ഘടനയിലെ സാധ്യതയുള്ള ‘ഇസ്രായേലിന്റെ ഗാനങ്ങൾ’ എന്ന ബന്ധം കുറിപ്പിൽ സൂക്ഷിച്ചുകൊണ്ട്, വ്യക്തിയെ വിശേഷിപ്പിക്കുന്ന സ്വാഭാവികവും കാവ്യാത്മകവുമായ വായന മുഖ്യവാചകത്തിൽ നൽകി.
theological_decisions:
- issue: מְשִׁיחַ ഇവിടെ മശീഹാപദവിയായി പരിഭാഷപ്പെടുത്തണമോ
  choice: അഭിഷിക്തനായവൻ
  alternative: യാക്കോബിന്റെ ദൈവത്തിന്റെ മശീഹാ
  rationale: തത്സന്ദർഭത്തിൽ ദാവീദാണ് പരാമർശിക്കപ്പെടുന്നത്. ‘അഭിഷിക്തനായവൻ’ രാജകീയ-മശീഹീയ പ്രതിധ്വനി നിലനിർത്തുന്നു, എന്നാൽ ദാവീദിനെയും ഭാവിയിലെ മശീഹയെയും മുഖ്യവാചകത്തിൽ നേരിട്ട് ഒന്നാക്കുന്നില്ല.
- issue: הֻקַם עָל എന്നതിലെ പ്രവർത്തകനെ വ്യക്തമാക്കണമോ
  choice: ഉയർത്തപ്പെട്ട
  alternative: ദൈവം ഉയർത്തിയ
  rationale: നിഷ്ക്രിയരൂപം മൂലപാഠത്തിലെ പരോക്ഷത നിലനിർത്തുന്നു; പ്രവർത്തകൻ ദൈവമാണെന്ന സ്വാഭാവിക ധാരണ പരിഭാഷയിൽ തുറന്നുപറഞ്ഞ് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഗദ്യം. ആവർത്തിക്കുന്ന נְאֻם എന്ന ഔപചാരിക സൂത്രവാക്യം മൂന്ന് സമാന്തര വിശേഷണഘടകങ്ങളിലുമായി കേൾക്കത്തക്കവിധം നിലനിർത്തി. അപൂർവമായോ മതവിഭാഗവിശേഷമായോ ഉള്ള പദാവലി ഒഴിവാക്കി.
