source:
  edition: WLC
  text: וַ/יֵּרְד֨וּ שלשים מֵ/הַ/שְּׁלֹשִׁ֣ים רֹ֗אשׁ וַ/יָּבֹ֤אוּ אֶל קָצִיר֙ אֶל דָּוִ֔ד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וְ/חַיַּ֣ת פְּלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
translation:
  language: ml
  text: അപ്പോൾ മുപ്പതിൽനിന്ന് മുപ്പതു പ്രമുഖർ[a] കൊയ്ത്തുകാലത്ത്[b] ദാവീദിന്റെ അടുക്കലേക്കും അദുല്ലാമിലെ ഗുഹയിലേക്കും ഇറങ്ങിവന്നു. ആ സമയത്ത് ഫെലിസ്ത്യരുടെ ഒരു സൈനികസംഘം[c] രെഫായീം താഴ്‌വരയിൽ പാളയമടിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘മുപ്പതിൽനിന്ന് മുപ്പത്, പ്രമുഖൻ/പ്രധാനി’ എന്ന ദുഷ്കരമായ പ്രയോഗമാണുള്ളത്. ഇതിന് ‘പ്രമുഖരായ മുപ്പതുപേർ’ എന്നോ, ദാവീദിന്റെ ശ്രേഷ്ഠയോദ്ധാക്കളായ ‘മുപ്പതുപേർ’ എന്ന സംഘത്തിലെ അംഗങ്ങൾ എന്നോ അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘കൊയ്ത്തിനിടെ.’
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രു חַיַּת פְּלִשְׁתִּים എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ഫെലിസ്ത്യരുടെ ജീവി/മൃഗം’ എന്നാണ്; ഇവിടെ അത് സൈനികസംഘത്തെയോ പടക്കൂട്ടത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: ירד എന്ന ക്രിയയുടെ താഴോട്ടുള്ള ദിശാഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലി നൽകുന്നു.
- source_word: שלשים מֵהַשְּׁלֹשִׁים רֹאשׁ
  choice: മുപ്പതുപേരിൽ പ്രധാനികളായ മുപ്പതുപേർ
  rationale: ഹീബ്രു പ്രയോഗം ദുഷ്കരവും ചുരുക്കമുള്ളതുമാണ്. സംഖ്യയും പ്രധാനസ്ഥാനം സൂചിപ്പിക്കുന്ന רֹאשׁ എന്ന പദവും നിലനിർത്തുന്നു; കൃത്യമായ ഘടനയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶל קָצִיר
  choice: കൊയ്ത്തുകാലത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘കൊയ്ത്തിലേക്കു’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ കാലസൂചനയായാണ് ഏറ്റവും സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നത്.
- source_word: אֶל דָּוִד אֶל מְעָרַת עֲדֻלָּם
  choice: ദാവീദിന്റെ അടുക്കൽ അദുല്ലാം ഗുഹയിലേക്കു
  rationale: ആവർത്തിച്ചുള്ള אֶל ദാവീദിനെയും ഗുഹയെയും ലക്ഷ്യസ്ഥാനമായി ചൂണ്ടിക്കാണിക്കുന്നു; രണ്ടും വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
- source_word: חַיַּת פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ ഒരു സൈനികസംഘം
  rationale: חַיָּה എന്നതിന് സാധാരണയായി ‘ജീവി/മൃഗം’ എന്നർഥമുണ്ടെങ്കിലും ഇവിടെ സൈനികസന്ദർഭത്തിൽ സംഘം അല്ലെങ്കിൽ പടക്കൂട്ടം എന്ന പ്രയോഗാർഥമാണ്.
- source_word: חֹנָה
  choice: പാളയമടിച്ചിരുന്നു
  rationale: വർത്തമാന കൃദന്തം പശ്ചാത്തലത്തിൽ തുടരുന്ന പാളയവാസത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּעֵמֶק רְפָאִים
  choice: രെഫായീം താഴ്‌വരയിൽ
  rationale: സ്ഥലനാമം ശബ്ദാന്തരണം ചെയ്ത് താഴ്‌വര എന്ന ഭൗമവിശേഷണം വ്യക്തമായി നൽകുന്നു.
