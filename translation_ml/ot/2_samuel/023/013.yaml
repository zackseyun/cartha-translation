translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദുഷ്കരമായ ഹീബ്രു സംഖ്യാ-ഘടന മുഖ്യപാഠത്തിൽ അതിയായി വ്യാഖ്യാനിക്കാതെ അടിക്കുറിപ്പിലൂടെ അതിന്റെ അനിശ്ചിതത്വം സംരക്ഷിച്ചിരിക്കുന്നു.
