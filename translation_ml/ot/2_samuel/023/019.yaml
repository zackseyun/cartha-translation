source:
  edition: WLC
  text: מִן הַ/שְּׁלֹשָׁה֙ הֲ/כִ֣י נִכְבָּ֔ד וַ/יְהִ֥י לָ/הֶ֖ם לְ/שָׂ֑ר וְ/עַד הַ/שְּׁלֹשָׁ֖ה לֹא בָֽא־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/019.yaml
  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
translation:
  language: ml
  text: മൂവരെക്കാൾ അവൻ ആദരിക്കപ്പെട്ടവനായിരുന്നില്ലയോ?[a] അങ്ങനെ അവൻ അവർക്ക് തലവനായി; എങ്കിലും ആ മൂവരുടെ പദവിയിലേക്ക് അവൻ എത്തിയില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൂവരിൽ അവൻ ആദരിക്കപ്പെട്ടവനായിരുന്നില്ലയോ?” എബ്രായപ്രയോഗം താരതമ്യാർഥമല്ലാതെ ഉൾപ്പെടൽഅർഥത്തിലും മനസ്സിലാക്കാം; എങ്കിലും വാക്യഘടനയും സമീപസന്ദർഭത്തിലെ സമാന്തരപ്രയോഗവും “മൂവരെക്കാൾ” എന്ന താരതമ്യാർഥത്തെയാണ് കൂടുതൽ പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ദാവീദിന്റെ വീരന്മാരിൽ ഏറ്റവും ഉന്നതനിലയിലുണ്ടായിരുന്ന “മൂവർ” എന്ന സംഘത്തിന്റെ പദവിയോ സ്ഥാനമോ അവൻ കൈവരിച്ചില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: מִן הַשְּׁלֹשָׁה
  choice: മൂവരെക്കാൾ
  rationale: נִכְבָּד എന്ന പദത്തോടുകൂടിയ מִן താരതമ്യാർഥത്തിൽ സ്വാഭാവികമായി വായിക്കാം. അറിയപ്പെടുന്ന ‘മൂവർ’ എന്ന സംഘത്തോടുള്ള താരതമ്യം ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: הֲכִי
  choice: ആയിരുന്നില്ലയോ?
  rationale: സ്ഥിരീകരണാത്മകമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ് ഇവിടെ. ആ ചോദ്യഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נִכְבָּד
  choice: കൂടുതൽ ആദരിക്കപ്പെട്ടവൻ
  rationale: כבד എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ആദരിക്കപ്പെടുക, ഉന്നതമായി കണക്കാക്കപ്പെടുക എന്ന ആശയം നൽകുന്നു; താരതമ്യഘടന കാരണം ‘കൂടുതൽ’ ചേർത്തിരിക്കുന്നു.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: അങ്ങനെ അവൻ അവരുടെ സേനാനായകനായി
  rationale: שַׂר എന്നത് തലവൻ, പ്രമാണി, സേനാനായകൻ എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. വീരന്മാരുടെ സൈനികസന്ദർഭത്തിൽ ‘സേനാനായകൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְעַד הַשְּׁלֹשָׁה לֹא בָא
  choice: എങ്കിലും ആ മൂവരുടെ പദവിയിലേക്ക് അവൻ എത്തിയില്ല
  rationale: പദാനുപദമായി ‘മൂവരോളം വന്നില്ല’ എന്നതിനു പകരം, ഇവിടെ സൂചിപ്പിക്കുന്ന പദവിയോ നിലവാരമോ കൈവരിക്കാതിരുന്നതിനെ വ്യക്തമായ മലയാളത്തിൽ പറയുന്നു.
- source_word: בָא
  choice: എത്തിയില്ല
  rationale: അടിസ്ഥാനാർഥമായ ‘വരുക’ ഇവിടെ ഒരു സംഘത്തിന്റെ നിലയിലേക്കോ പദവിയിലേക്കോ എത്തുക എന്ന വിപുലാർഥത്തിലാണ്; ‘എത്തുക’ ആ രൂപകപ്രയോഗം നിലനിർത്തുന്നു.
