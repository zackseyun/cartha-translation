translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘മൂവർ’ എന്ന അറിയപ്പെടുന്ന സംഘനാമം നിലനിർത്തുകയും, താരതമ്യവായനയും പര്യായവായനയും തമ്മിലുള്ള എബ്രായത്തിലെ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
