reference: 2 Samuel 23:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִישׁ֙ יִגַּ֣ע בָּ/הֶ֔ם יִמָּלֵ֥א בַרְזֶ֖ל וְ/עֵ֣ץ חֲנִ֑ית וּ/בָ/אֵ֕שׁ שָׂר֥וֹף יִשָּׂרְפ֖וּ בַּ/שָּֽׁבֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/007.yaml
  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
translation:
  language: ml
  text: എന്നാൽ അവരെ തൊടുന്നവൻ ഇരുമ്പും കുന്തത്തിന്റെ തണ്ടുംകൊണ്ട് സ്വയം സജ്ജമാകണം[a][c]; അവരെ അവർ ഉള്ളിടത്തുവെച്ചുതന്നെ തീയിൽ നിശ്ശേഷം ചുട്ടുകളയണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഇരുമ്പും കുന്തത്തണ്ടും കൈവശമാക്കി സജ്ജമാകണം’; അക്ഷരാർഥം: ‘ഇരുമ്പും കുന്തത്തിന്റെ മരവുംകൊണ്ട് നിറയണം.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘അവരെ അവിടത്തുവെച്ചുതന്നെ തീയിൽ തീർച്ചയായും ചുട്ടുകളയണം.’ എബ്രായത്തിൽ ഊന്നലിനായി ക്രിയാനാമത്തോടൊപ്പം അതേ ധാതുവിൽനിന്നുള്ള ക്രിയയും ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: ‘അവരെ’ എന്നത് മുൻവാക്യത്തിൽ മുള്ളുകളോടുപമിക്കപ്പെട്ട ‘നീചന്മാരെ’ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישׁ יִגַּע בָּהֶם
  choice: എന്നാൽ അവരെ തൊടുന്നവൻ
  rationale: ആരംഭത്തിലെ וְ സന്ദർഭത്തിലെ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി. אִישׁ ഏകവചന പുല്ലിംഗവും പൊതുവായ പ്രയോഗവുമാണ്; ‘തൊടുന്നവൻ’ ആ രൂപവും മുള്ളുകളുടെ അപകടകരമായ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: יִמָּלֵא
  choice: സ്വയം സജ്ജനാകണം
  rationale: നിഫാൽ രൂപത്തിന്റെ അക്ഷരാർഥം ‘നിറയുക’ എന്നാണെങ്കിലും, ഇരുമ്പും കുന്തത്തണ്ടും പോലുള്ള ഉപകരണങ്ങളോടുകൂടിയ ഈ ഘടനയിൽ അവ കൈവശമാക്കി സജ്ജനാകുക എന്ന പ്രായോഗിക അർഥമാണ്.
- source_word: בַרְזֶל וְעֵץ חֲנִית
  choice: ഇരുമ്പും കുന്തത്തിന്റെ തണ്ടുംകൊണ്ട്
  rationale: בַרְזֶל എന്നത് പൊതുവായി ‘ഇരുമ്പ്’ എന്നാണ്; ഏത് ഇരുമ്പുപകരണമെന്നു പാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു നിർണ്ണയിച്ചില്ല. עֵץ חֲנִית അക്ഷരാർഥത്തിൽ ‘കുന്തത്തിന്റെ മരം’ എന്നതായതിനാൽ സ്വാഭാവികമായി ‘കുന്തത്തിന്റെ തണ്ട്’ എന്നു നൽകി.
- source_word: שָׂרוֹף יִשָּׂרְפוּ
  choice: നിശ്ശേഷം ചുട്ടുകളയും
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ ഘടന പ്രവൃത്തിക്ക് ഊന്നൽ നൽകുന്നു. ‘നിശ്ശേഷം’ ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ബഹുവചന കർത്താവ് വ്യക്തമല്ലാത്തതിനാൽ മലയാളത്തിലും നിർണ്ണയിച്ചിട്ടില്ല.
- source_word: בַּשָּׁבֶת
  choice: അവർ കിടക്കുന്നിടത്തുവെച്ചുതന്നെ
  rationale: അപൂർവമായ ഈ രൂപം സന്ദർഭത്തിൽ ‘അവിടത്തുവെച്ച്/അവർ ഉള്ള സ്ഥലത്ത്’ എന്ന സ്ഥലസൂചനയായി മനസ്സിലാക്കുന്നു. മുള്ളുകളോട് ഉപമിക്കപ്പെട്ട മനുഷ്യരാണ് സൂചിതർ എന്നതിനാൽ മലയാളത്തിൽ ‘അവർ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ‘അവർ/അവരെ’ എന്ന സർവനാമത്തിന്റെ സൂചിതർ
  choice: മുൻവാക്യത്തിലെ മുള്ളുകളോടുപമിക്കപ്പെട്ട നീചന്മാരെ സൂചിപ്പിക്കുന്ന മനുഷ്യസർവനാമം നിലനിർത്തി.
  alternative: മുള്ളുകളെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ‘അവ’ ഉപയോഗിക്കുക.
  rationale: വാക്യത്തിലെ ദൃശ്യം മുള്ളുകളുടേതാണെങ്കിലും വ്യാകരണപരമായ സൂചിതർ മുൻവാക്യത്തിലെ മനുഷ്യരാണ്. ഉപമയെ യഥാർഥ സസ്യങ്ങളായി മാറ്റാതെ ഈ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മുള്ളുകളുടെ ഉപമയും മനുഷ്യരെ സൂചിപ്പിക്കുന്ന സർവനാമവും ഒരുമിച്ച് നിലനിർത്തി; അപൂർവമായ സ്ഥലപദത്തിലും വ്യക്തമല്ലാത്ത ബഹുവചന കർത്താവിലും അതിരുകടന്ന വ്യാഖ്യാനം ഒഴിവാക്കി.
