reference: 2 Samuel 23:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י יְהוָ֜ה מֵ/עֲשֹׂ֣תִ/י זֹ֗את הֲ/דַ֤ם הָֽ/אֲנָשִׁים֙ הַ/הֹלְכִ֣ים בְּ/נַפְשׁוֹתָ֔/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבֹּרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “യഹ്‌വേ, ഞാൻ ഇതു ചെയ്യുന്നത് എനിക്കു ഒരിക്കലും പാടില്ല! ജീവൻ പണയംവെച്ചു പോയ ആ മനുഷ്യരുടെ രക്തമല്ലേ ഇത്?” അവൻ അത് കുടിക്കാൻ തയ്യാറായില്ല. ഈ പ്രവൃത്തിയാണ് ആ മൂന്നു വീരന്മാർ ചെയ്തത്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  choice: യഹ്‌വേ, ഞാൻ ഇതു ചെയ്യുന്നത് എനിക്ക് ചിന്തിക്കാനുപോലും കഴിയാത്ത കാര്യമാണ്
  rationale: חָלִילָה എന്ന ശക്തമായ അറപ്പും നിരാകരണവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; יְהוָהയെ സംബോധനയായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מֵעֲשֹׂתִי זֹאת
  choice: ഞാൻ ഇതു ചെയ്യുന്നത്
  rationale: מִן സഹിതമുള്ള ക്രിയാനാമം ഇവിടെ പ്രവൃത്തി ചെയ്യുന്നതിനെ ശക്തമായി തള്ളിപ്പറയുന്നതിന്റെ ഭാഗമാണ്.
- source_word: הֲדַם הָאֲנָשִׁים
  choice: ആ മനുഷ്യരുടെ രക്തമല്ലേ ഇത്?
  rationale: ചോദ്യചിഹ്നമായ הֲയുടെ വാചാടോപചോദ്യസ്വഭാവവും വെള്ളത്തെ അവരുടെ രക്തമായി കണക്കാക്കുന്ന ദാവീദിന്റെ ധാർമിക പ്രതികരണവും സംരക്ഷിക്കുന്നു.
- source_word: הַהֹלְכִים בְּנַפְשׁוֹתָם
  choice: ജീവൻ പണയംവെച്ചു പോയ
  rationale: അക്ഷരാർഥത്തിൽ ‘തങ്ങളുടെ ജീവൻകൊണ്ട്/ജീവനുകളോടെ പോയ’; മരണസാധ്യത ഏറ്റെടുത്തുവെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: അതുകൊണ്ട് അവൻ അതു കുടിക്കാൻ വിസമ്മതിച്ചു
  rationale: אָבָהയുടെ സമ്മതിക്കാതിരിക്കുക/മനസ്സാകാതിരിക്കുക എന്ന ആശയം വ്യക്തമാക്കുന്നു; പ്രത്യയം സന്ദർഭത്തിലെ വെള്ളത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ഏകവചനമായ ‘അതു’ ഉപയോഗിക്കുന്നു.
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: ഈ പ്രവൃത്തിയാണ് ആ മൂന്നു വീരന്മാർ ചെയ്തത്
  rationale: אֵלֶּה മുമ്പു വിവരിച്ച ധീരകൃത്യത്തിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; ഗിബ്ബോരീം എന്ന സൈനികസന്ദർഭപദത്തിന് ‘വീരന്മാർ’ സ്വാഭാവികവും മാന്യവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദപദംകൊണ്ട് പകരാതെ സംരക്ഷിക്കുന്നു.
- issue: വെള്ളത്തെ ‘രക്തം’ എന്നു വിളിക്കുന്ന വാചാടോപചോദ്യം
  choice: “ആ മനുഷ്യരുടെ രക്തമല്ലേ ഇത്?”
  alternative: “ഇതു കുടിക്കുന്നത് ആ മനുഷ്യരുടെ രക്തം കുടിക്കുന്നതുപോലെയല്ലേ?”
  rationale: ദാവീദിന്റെ ഉപമാപരമായ ധാർമിക വിലയിരുത്തൽ വിശദീകരിച്ച് തീർക്കാതെ, മൂലത്തിലെ ശക്തിയും അർഥസമ്മർദവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ശക്തമായ നിരാകരണം പദാനുപദമായ അസ്വാഭാവിക രൂപത്തിനു പകരം സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകി; വാചാടോപചോദ്യവും ദൈവനാമവും സംരക്ഷിച്ചു.
