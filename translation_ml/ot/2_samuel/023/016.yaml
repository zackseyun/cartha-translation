source:
  edition: WLC
  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
translation:
  language: ml
  text: അപ്പോൾ ആ മൂന്നു വീരന്മാർ ഫെലിസ്ത്യരുടെ പാളയം ഭേദിച്ച്, കവാടത്തിനരികിലുള്ള ബേത്‌ലഹേമിലെ കിണറ്റിൽനിന്ന് വെള്ളം കോരി, അത് ചുമന്നുകൊണ്ടുവന്ന് ദാവീദിന്റെ അടുക്കൽ എത്തിച്ചു. എന്നാൽ അത് കുടിക്കാൻ[a] അവൻ വിസമ്മതിച്ചു; പകരം, അത് യഹോവയ്ക്ക് ഒഴിച്ചുകൊടുത്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവയെ കുടിക്കാൻ’ എന്നും പിന്നീട് ‘അവയെ ഒഴിച്ചുകൊടുത്തു’ എന്നും വരാം; എബ്രായത്തിൽ ബഹുവചന പ്രത്യയമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. ഇത് ‘വെള്ളം’ എന്നതിനെ ബഹുവചനരൂപത്തിൽ സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, യഹോവയ്ക്കുള്ള ഒരു അർപ്പണംപോലെ അവൻ വെള്ളം ഒഴിച്ചുകൊടുത്തു; ഈ ക്രിയയ്ക്ക് പാനീയാർപ്പണത്തെ അനുസ്മരിപ്പിക്കുന്ന ഭാവമുണ്ട്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: വഴി വെട്ടിത്തുറന്ന്
  rationale: എതിർസൈന്യത്തിന്റെ നിലയിലൂടെ ബലം പ്രയോഗിച്ച് കടന്നുകയറുക എന്ന സൈനികസന്ദർഭത്തിലെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: ആ മൂന്നു വീരന്മാർ
  rationale: ദാവീദിന്റെ വിശിഷ്ട പോരാളികളെ സൂചിപ്പിക്കുന്ന ഗִּבּוֹרִים എന്ന പദത്തിന്റെ ബലവും അർധസാങ്കേതിക സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പാളയത്തിലൂടെ
  rationale: പാളയത്തെ ഭേദിച്ചുകടന്ന പ്രവൃത്തിയുമായി ചേർന്നിരിക്കുന്ന ബְּ എന്ന ഉപസർഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: വെള്ളം കോരി
  rationale: കിണറ്റിൽനിന്ന് വെള്ളമെടുക്കുന്ന പ്രവൃത്തിക്ക് സാധാരണ മലയാളത്തിൽ ഉപയോഗിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: കവാടത്തിനരികിലുള്ള ബേത്‌ലെഹേമിലെ കിണറ്റിൽനിന്ന്
  rationale: കിണർ ബേത്‌ലെഹേമിനോടു ബന്ധപ്പെട്ടതും കവാടത്തിങ്കൽ സ്ഥിതിചെയ്തതുമാണെന്ന എബ്രായ വാക്യഘടന വ്യക്തമായി പകരുന്നു.
- source_word: וַיִּשְׂאוּ וַיָּבִאוּ אֶל דָּוִד
  choice: അത് ചുമന്നുകൊണ്ടുവന്ന് ദാവീദിന് കൊടുത്തു
  rationale: വെള്ളം എടുത്തുകൊണ്ടുപോയി ദാവീദിന്റെ അടുക്കൽ എത്തിച്ച പ്രവൃത്തികളുടെ അനുക്രമം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അവസാനത്തെ ‘കൊടുത്തു’ എത്തിച്ചുകൊടുത്തതിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: അത് കുടിക്കാൻ അവന് മനസ്സായില്ല
  rationale: אָבָה എന്ന ക്രിയയിലെ മനസ്സോ സമ്മതമോ ഇല്ലായ്മയുടെ സൂക്ഷ്മത വെറും ‘കുടിച്ചില്ല’ എന്നതിലുപരി നിലനിർത്തുന്നു. വെള്ളത്തെ മലയാളത്തിൽ ഏകവചനസമാഹാരമായി പരാമർശിക്കുന്നു.
- source_word: וַיַּסֵּךְ אֹתָם
  choice: അവൻ അത് ... ഒഴിച്ചുകളഞ്ഞു
  rationale: പ്രധാനപാഠത്തിൽ ദൃശ്യമായ പ്രവൃത്തി നിലനിർത്തുകയും נסך എന്ന ക്രിയയുടെ അർപ്പണസദൃശമായ ആചാരപരമായ ഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: ലക്ഷ്യമോ സമർപ്പണമോ സൂചിപ്പിക്കുന്ന לְ എന്ന ഘടകത്തെ ‘യ്ക്കായി’ എന്നു പകരുകയും ദൈവനാമമായ יהוהയെ വ്യക്തിനാമമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദാവീദ് വെള്ളം ഒഴിച്ചുകളഞ്ഞ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: യഹോവയ്ക്കായി നടത്തിയ, പാനീയാർപ്പണത്തെ അനുസ്മരിപ്പിക്കുന്ന സമർപ്പണപ്രവൃത്തി
  alternative: ആരാധനാപരമായ അർഥമില്ലാതെ വെള്ളം കുടിക്കാതിരുന്നതിന്റെ വെറും പ്രതീകാത്മക പ്രകടനം
  rationale: נסך എന്ന ക്രിയയ്ക്ക് സാധാരണയായി ആചാരപരമായ ഒഴിക്കൽ എന്ന ഭാവമുണ്ട്; ‘യഹോവയ്ക്കായി’ എന്ന പ്രയോഗം സമർപ്പണസ്വഭാവം ശക്തമാക്കുന്നു. എങ്കിലും ഇത് ഔപചാരിക പാനീയാർപ്പണമായിരുന്നു എന്നു പ്രധാനപാഠം നിർണയിക്കാതെ, ആ സൂചന അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘വീരന്മാർ’, ‘പാളയം’, ‘കവാടം’ തുടങ്ങിയ പദങ്ങൾ ഗൗരവമുള്ള ചരിത്രവിവരണത്തിന് യോജിച്ചവയെങ്കിലും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. ഉറവിടത്തിലെ ബഹുവചനപ്രത്യയവും ദാവീദിന്റെ പ്രവൃത്തിയിലെ ആരാധനാപരമായ സൂചനയും അടിക്കുറിപ്പുകളിലൂടെ നിലനിർത്തി.
