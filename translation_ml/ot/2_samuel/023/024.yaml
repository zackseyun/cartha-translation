lexical_decisions:
- source_word: עֲשָׂה אֵל
  choice: അസാഹേൽ
  rationale: വ്യഞ്ജനപാഠത്തിൽ വേർതിരിച്ചെഴുതിയിട്ടുണ്ടെങ്കിലും, അറിയപ്പെടുന്ന വ്യക്തിനാമമായ עֲשָׂהאֵל എന്ന നിലയിൽ മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾ നാമരൂപം സ്വീകരിച്ചു.
- source_word: אֲחִי יוֹאָב
  choice: യോവാബിന്റെ സഹോദരനായ
  rationale: കുടുംബബന്ധം വ്യക്തമാക്കുകയും മലയാളവാക്യത്തിൽ അസാഹേലിനെ സ്വാഭാവികമായി വിശേഷിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בַּשְּׁלֹשִׁים
  choice: മുപ്പതുപേരിൽ ഒരാളായിരുന്നു
  rationale: ദാവീദിന്റെ ‘മുപ്പതുപേർ’ എന്ന യോദ്ധൃസംഘത്തിലെ അംഗത്വമാണ് ב എന്ന ഉപസർഗം ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: אֶלְחָנָן
  choice: എൽഹാനാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן דֹּדֹו
  choice: ദോദോയുടെ മകൻ
  rationale: മസോററ്റിക് പാഠത്തിലെ דֹּדֹו എന്ന വ്യക്തിനാമം അതേപടി നിലനിർത്തി; സമാന്തരപാഠത്തിലെ ‘ദോദായി’ എന്ന രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: בֵּית לָחֶם
  choice: ബേത്‌ലഹേമിൽനിന്നുള്ള
  rationale: സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന ഈ അനുബന്ധപ്രയോഗം മലയാളത്തിൽ സുതാര്യമായി അവതരിപ്പിക്കുന്നു; ‘ബേത്‌ലഹേമ്യൻ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് എളുപ്പം.
