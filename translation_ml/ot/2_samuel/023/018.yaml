  rationale: മുഖ്യവാക്യത്തിന്റെ വിവർത്തനം നിലനിർത്തി. അടിക്കുറിപ്പ് b-യിൽ മാത്രം നിഷ്ക്രിയമായ ‘അവർ കൊല്ലപ്പെട്ടു’ എന്നത് ‘അവരെ കൊന്നു’ എന്നു മാറ്റി, വൈകല്പിക വായനയിലെ കർത്താവിനെയും യുദ്ധപ്രവൃത്തിയെയും വ്യക്തമായി സൂചിപ്പിച്ചു. അടിക്കുറിപ്പ് a-യിൽ ‘പാഠവ്യത്യാസം’ എന്നതിനെ ‘പാഠപരമായ അനിശ്ചിതത്വം’ എന്നു വ്യക്തമാക്കി; ഇതിലൂടെ വിവാദമായ വായനയെ അതിരുകടന്ന് ഉറപ്പിക്കുന്നില്ല.
