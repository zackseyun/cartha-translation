  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲבִישַׁ֞י אֲחִ֣י יוֹאָ֣ב בֶּן צְרוּיָ֗ה ה֚וּא רֹ֣אשׁ ה/שלשי וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל וְ/ל/וֹ שֵׁ֖ם בַּ/שְּׁלֹשָֽׁה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/018.yaml
  text: Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: ml
  text: സെരൂയയുടെ മകനായ യോവാബിന്റെ സഹോദരൻ അബീശായി മൂവരുടെ തലവനായിരുന്നു.[a] അവൻ മുന്നൂറുപേർക്കെതിരെ തന്റെ കുന്തം പ്രയോഗിച്ച് അവരെ കൊന്നു.[b] മൂവരുടെ ഇടയിൽ അവനു പേരുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: “മൂവരുടെ തലവൻ.” 1 ദിനവൃത്താന്തം 11:20-ലെ സമാന്തരഭാഗവും ഈ ഭാഗത്തിലെ പാഠപരമായ അനിശ്ചിതത്വവും പരിഗണിച്ച് ചില വ്യാഖ്യാതാക്കൾ ഇവിടെ പറയുന്ന സംഘത്തെ “മുപ്പതുപേർ” എന്നു മനസ്സിലാക്കുന്നു.'
    reason: textual_variant
  - marker: b
    text: അഥവാ, “മുന്നൂറുപേർക്കെതിരെ തന്റെ കുന്തം ഉയർത്തി (അല്ലെങ്കിൽ വീശി), അവരെ കൊന്നു.” ഹീബ്രു പ്രയോഗം വളരെ സംക്ഷിപ്തമാണ്; പദശഃ, “കൊല്ലപ്പെട്ട മുന്നൂറുപേർക്കെതിരെ തന്റെ കുന്തം ഉണർത്തി/ഉയർത്തി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַשְּׁלֹשִׁי
  choice: മൂവരുടെ തലവൻ
  rationale: רֹאשׁ എന്നത് ‘തലവൻ/പ്രധാനൻ’ എന്നാണ്. മസോരറ്റിക് പാഠവും വാക്യത്തിന്റെ അവസാനത്തിലെ בַּשְּׁלֹשָׁה എന്ന പ്രയോഗവും പരിഗണിച്ച് ‘മൂവർ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ‘മുപ്പത്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: തന്റെ കുന്തം പ്രയോഗിച്ചു
  rationale: עוֹרֵר എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ഉണർത്തുക/ഉയർത്തുക’ എന്നാണെങ്കിലും, ആയുധത്തെ കർമമായി സ്വീകരിക്കുന്ന ഈ യുദ്ധസന്ദർഭത്തിൽ ‘കുന്തം പ്രയോഗിച്ചു’ എന്നത് സ്വാഭാവികവും അർഥസമീപവുമാണ്.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: മുന്നൂറുപേർക്കെതിരെ ... അവരെ കൊന്നു
  rationale: חָלָל ‘കൊല്ലപ്പെട്ടവൻ/കുത്തേറ്റു വീണവൻ’ എന്നർഥമുള്ളതാണ്. ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തമാണെങ്കിലും, മുന്നൂറുപേർ അവന്റെ കുന്തപ്രയോഗത്തിൽ കൊല്ലപ്പെട്ടു എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְלוֹ שֵׁם
  choice: അവനു പേരുണ്ടായിരുന്നു
  rationale: ‘അവന് ഒരു പേര് ഉണ്ടായിരുന്നു’ എന്ന ഹീബ്രു പ്രയോഗശൈലി പ്രശസ്തിയെയോ കീർത്തിയെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലും ‘പേരുണ്ടായിരുന്നു’ എന്നത് അർഥഗ്രാഹ്യമായ സമാന പ്രയോഗമാണ്.
- source_word: בַּשְּׁלֹשָׁה
  choice: മൂവരുടെ ഇടയിൽ
  rationale: בְּ എന്ന ഉപസർഗം ഇവിടെ കൂട്ടത്തിനുള്ളിലെ ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘മൂവരുടെ ഇടയിൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: אֲבִישַׁי ... יוֹאָב ... צְרוּיָה
  choice: അബീശായി ... യോവാബ് ... സെരൂയ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ‘മൂവർ’ എന്നതും ‘മുപ്പത്’ എന്നതും തമ്മിലുള്ള പാഠപ്രശ്നം
  choice: മുഖ്യപാഠത്തിൽ ‘മൂവർ’
  alternative: ‘മുപ്പതുപേർ’ അഥവാ ‘മുപ്പതുപേരുടെ സംഘം’
  rationale: ഈ വാക്യത്തിലെ മസോരറ്റിക് പാഠവും അവസാനത്തെ בַּשְּׁלֹשָׁה എന്ന രൂപവും ‘മൂവർ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ 1 ദിനവൃത്താന്തം 11:20-ലെ സമാന്തരഭാഗവും ഈ വിഭാഗത്തിലെ പാഠവ്യത്യാസങ്ങളും ‘മുപ്പത്’ എന്ന വ്യാഖ്യാനത്തിന് ഇടനൽകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അവനു പേരുണ്ടായിരുന്നു’ എന്ന ഹീബ്രു പ്രയോഗശൈലി മലയാളത്തിലും ഗ്രാഹ്യമാകുന്നതിനാൽ നിലനിർത്തി. മൂലത്തിൽ വ്യക്തമായ കാലസൂചകപദമില്ലാത്തതിനാൽ തുടക്കത്തിൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
