  naturalness: ‘കുന്തം പ്രയോഗിച്ച്’ എന്നും ‘മൂവരുടെ ഇടയിൽ അവനു പേരുണ്ടായിരുന്നു’ എന്നും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ള ആഖ്യാനരജിസ്റ്ററിനു യോജിച്ചതുമാണ്. അടിക്കുറിപ്പിലെ വൈകല്പികം കൂടുതൽ നേരിട്ടും സ്വാഭാവികമായും പുനരാഖ്യാനം ചെയ്തിരിക്കുന്നു.
  terminology: അബീശായി, യോവാബ്, സെരൂയ എന്നീ പേരുകളും ‘മൂവർ,’ ‘മുപ്പതുപേർ,’ ‘കുന്തം’ എന്നീ പ്രയോഗങ്ങളും സ്ഥിരവും ഉചിതവുമാണ്. പാഠപരമായ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ പരിഹരിച്ചെന്നു നടിക്കാതെ അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
  issues:
