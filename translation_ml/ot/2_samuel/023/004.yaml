  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/כְ/א֥וֹר בֹּ֖קֶר יִזְרַח שָׁ֑מֶשׁ בֹּ֚קֶר לֹ֣א עָב֔וֹת מִ/נֹּ֥גַהּ מִ/מָּטָ֖ר דֶּ֥שֶׁא מֵ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/004.yaml
  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
translation:
  language: ml
  text: അവൻ സൂര്യൻ ഉദിക്കുമ്പോഴുള്ള പ്രഭാതവെളിച്ചംപോലെയാണ്[a], മേഘങ്ങളില്ലാത്ത ഒരു പ്രഭാതംപോലെ; തെളിച്ചത്തിൽനിന്നും മഴയിൽനിന്നും[b] ഭൂമിയിൽനിന്ന് പൊന്തിവരുന്ന പച്ചപ്പ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘പ്രഭാതവെളിച്ചംപോലെയും.’ ഹീബ്രു വരി അപൂർണവാക്യരൂപത്തിലാണ്; മുൻവാക്യത്തിലെ ഭരണാധികാരിയുടെ വിവരണം അത് തുടരുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു: ‘തെളിച്ചത്തിൽനിന്നും, മഴയിൽനിന്നും, ഭൂമിയിൽനിന്നുള്ള പച്ചപ്പ്.’ മഴയ്ക്കുശേഷം പുതുവളർച്ച പൊന്തിവരുന്നതിന്റെ ചുരുക്കിയ കവിതാചിത്രമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאוֹר
  choice: അവൻ ... വെളിച്ചംപോലെയാണ്
  rationale: വാക്യം മുൻവാക്യത്തിലെ നീതിമാനായ ഭരണാധികാരിയുടെ വിവരണം തുടരുന്നു. ഹീബ്രുവിൽ ക്രിയയും കർത്താവും പരോക്ഷമായതിനാൽ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘അവൻ’ എന്നും ‘പോലെയാണ്’ എന്നും ചേർത്തു.
- source_word: בֹּקֶר
  choice: പ്രഭാതം
  rationale: രണ്ടിടത്തും കവിതാപരമായ ആവർത്തനം നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദം.
- source_word: יִזְרַח שָׁמֶשׁ
  choice: സൂര്യൻ ഉദിക്കുമ്പോൾ
  rationale: ക്രിയയ്ക്ക് പ്രകാശിക്കുക/ഉദിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്; സൂര്യനെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ‘ഉദിക്കുമ്പോൾ’ സ്വാഭാവികവും ചിത്രാത്മകവുമാണ്.
- source_word: בֹּקֶר לֹא עָבוֹת
  choice: മേഘങ്ങളില്ലാത്ത ഒരു പ്രഭാതം
  rationale: ഹീബ്രു ദൃശ്യബിംബം നേരായും സ്വാഭാവികമായ മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: מִנֹּגַהּ
  choice: തെളിച്ചത്തിൽനിന്നും
  rationale: נֹגַהּ എന്നത് പ്രകാശം/തെളിച്ചം സൂചിപ്പിക്കുന്നു; מן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന രൂപം കവിതയിലെ സംക്ഷിപ്ത ബന്ധം തുറന്നുവെക്കുന്നു.
- source_word: מִמָּטָר
  choice: മഴയിൽനിന്നും
  rationale: ‘മഴയ്ക്കുശേഷം’ എന്ന വ്യാഖ്യാനസാധ്യത ഉണ്ടായാലും, ആവർത്തിക്കുന്ന מן ഉപസർഗത്തെ നിലനിർത്തി മൂലത്തിലെ സംക്ഷിപ്തവും അസ്പഷ്ടവുമായ കവിതാബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: דֶּשֶׁא
  choice: മുളയ്ക്കുന്ന പച്ചപ്പ്
  rationale: പുതുതായി പൊന്തുന്ന പുല്ലിനെയോ സസ്യവളർച്ചയെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സജീവ ദൃശ്യബിംബം സാധാരണ മലയാളത്തിൽ പകരുന്നു.
- source_word: מֵאָרֶץ
  choice: ഭൂമിയിൽ ... മുളയ്ക്കുന്ന
  rationale: ഭൂമിയിൽനിന്ന് പച്ചപ്പ് പൊന്തിവരുന്ന അർഥം സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഉപമയുടെ പരോക്ഷ കർത്താവ്
  choice: മുൻവാക്യത്തിലെ ഭരണാധികാരിയെ സൂചിപ്പിച്ച് ‘അവൻ’ എന്നു വ്യക്തമാക്കി.
  alternative: ‘പ്രഭാതവെളിച്ചംപോലെ...’ എന്ന അപൂർണ കവിതാഭാഗമായി വിടുക.
  rationale: സന്ദർഭം കർത്താവിനെ വ്യക്തമായി നൽകുന്നു; മലയാളത്തിൽ അത് വ്യക്തമാക്കുന്നത് പുതിയ ദൈവശാസ്ത്രപരമായ ആശയം ചേർക്കാതെ അർഥഗ്രഹണം എളുപ്പമാക്കുന്നു.
- issue: അവസാന വരിയിലെ മുൻവ്യയങ്ങളുടെ ബന്ധം
  choice: ‘തെളിച്ചത്തിൽനിന്നും മഴയിൽനിന്നും ... പച്ചപ്പ്’ എന്ന മൂലത്തിലെ സംക്ഷിപ്ത ബന്ധം നിലനിർത്തി.
  alternative: ‘മഴയ്ക്കുശേഷമുള്ള തെളിച്ചത്തിൽ ഭൂമിയിൽനിന്ന് മുളയ്ക്കുന്ന പച്ചപ്പ്’ എന്ന് ബന്ധം വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഹീബ്രു കവിതയിലെ ബന്ധം വ്യാകരണപരമായി ചുരുക്കപ്പെട്ടതും ഒരളവുവരെ അസ്പഷ്ടവുമാണ്. ഒരു പ്രത്യേക കാരണകാല വ്യാഖ്യാനം നിർബന്ധിക്കാതെ ദൃശ്യബിംബവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ കവിതാഭാവം സ്വീകരിച്ചു. അപൂർവമോ അതിപുരാതനമോ ആയ പദങ്ങൾ ഒഴിവാക്കി; മൂലത്തിലെ സമാന്തരതയും അവസാന വരിയിലെ യഥാർഥ അസ്പഷ്ടതയും സാധ്യമായത്ര നിലനിർത്തി.
