id: 2SA.23.5
reference: 2 Samuel 23:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי לֹא כֵ֥ן בֵּיתִ֖/י עִם אֵ֑ל כִּי֩ בְרִ֨ית עוֹלָ֜ם שָׂ֣ם לִ֗/י עֲרוּכָ֤ה בַ/כֹּל֙ וּ/שְׁמֻרָ֔ה כִּֽי כָל יִשְׁעִ֥/י וְ/כָל חֵ֖פֶץ כִּֽי לֹ֥א יַצְמִֽיחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
translation:
  language: ml
  text: എന്തെന്നാൽ, എന്റെ ഭവനം ദൈവത്തോടുകൂടെ അങ്ങനെയല്ല; എങ്കിലും അവിടുന്ന് എന്നോടു ശാശ്വതമായ ഒരു ഉടമ്പടി ചെയ്തിരിക്കുന്നു—എല്ലാ കാര്യത്തിലും ക്രമീകരിക്കപ്പെട്ടതും സുരക്ഷിതമായി കാത്തുസൂക്ഷിക്കപ്പെട്ടതുമായ ഉടമ്പടി. അതാണ് എന്റെ സകല രക്ഷയും എന്റെ സകല ആഗ്രഹവും; അവിടുന്ന് അതിനെ വളർത്താതിരിക്കുമോ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'അല്ലെങ്കിൽ: “അവിടുന്ന് തീർച്ചയായും അതിനെ മുളപ്പിച്ചു വളർത്തും.” ഹീബ്രുവിലെ അവസാനവാക്യം ദുഷ്കരമാണ്; അതിനെ വാചാടോപചോദ്യമായോ ശക്തമായ ഉറപ്പായോ വായിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא כֵן
  choice: അങ്ങനെയല്ലല്ലോ
  rationale: ചൂണ്ടിക്കാണിക്കുന്ന ‘അങ്ങനെ’ എന്ന ആശയവും നിഷേധവും നിലനിർത്തുന്നു; വാക്യത്തിന്റെ ദുഷ്കരത വ്യാഖ്യാനിച്ച് നീക്കുന്നില്ല.
- source_word: בֵּיתִי
  choice: എന്റെ ഭവനം
  rationale: കുടുംബം, രാജവംശം എന്നീ രണ്ടർത്ഥസാധ്യതകളും വഹിക്കാവുന്ന ‘ഭവനം’ ഉടമ്പടി-സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: עִם אֵל
  choice: ദൈവത്തോടുകൂടെ
  rationale: עִם എന്നതിന്റെ ബന്ധസൂചകമായ ‘കൂടെ/ഒപ്പം’ എന്ന അടിസ്ഥാനബലം സംരക്ഷിക്കുന്നു.
- source_word: בְרִית עוֹלָם
  choice: ശാശ്വതമായൊരു ഉടമ്പടി
  rationale: עוֹלָם സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന ദൈർഘ്യവും ഉടമ്പടി എന്ന സാങ്കേതിക ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שָׂם לִי
  choice: എന്നോടു ... ചെയ്തിരിക്കുന്നു
  rationale: അക്ഷരാർഥം ‘എനിക്കായി വെച്ചു’ എന്നാണെങ്കിലും ഉടമ്പടി സ്ഥാപിക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עֲרוּכָה בַכֹּל
  choice: എല്ലാ കാര്യത്തിലും ക്രമപ്പെടുത്തിയത്
  rationale: ഉടമ്പടി സമഗ്രമായി ക്രമീകരിക്കപ്പെട്ടിരിക്കുന്നു എന്ന ഫലം വ്യക്തമാക്കുന്നു.
- source_word: וּשְׁמֻרָה
  choice: സുരക്ഷിതമായി കാത്തുസൂക്ഷിച്ചത്
  rationale: സംരക്ഷിക്കപ്പെട്ട നിലയെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയവും ഫലസൂചകവുമായ ബലം നിലനിർത്തുന്നു.
- source_word: כָל יִשְׁעִי
  choice: എന്റെ സകല രക്ഷയും
  rationale: יֵשַׁע എന്നതിന്റെ രക്ഷയും വിടുതലും ഉൾക്കൊള്ളുന്ന വിശാലത ‘രക്ഷ’യിൽ നിലനിൽക്കുന്നു.
- source_word: וְכָל חֵפֶץ
  choice: എന്റെ സകല ആഗ്രഹവും
  rationale: חֵפֶץ എന്നതിന്റെ ആഗ്രഹം/അഭിലാഷം എന്ന അർത്ഥം സമാന്തരഘടനയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּי לֹא יַצְמִיחַ
  choice: അവിടുന്ന് അതിനെ വളർത്താതിരിക്കുമോ?
  rationale: צמח എന്ന ധാതുവിന്റെ മുളപ്പിക്കുക/വളർത്തുക എന്ന കാരണാർത്ഥം നൽകുകയും ദുഷ്കരമായ അവസാനവാക്യം അനുകൂലമായ വാചാടോപചോദ്യമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: כִּי לֹא כֵן בֵּיתִי עִם אֵל എന്ന ആരംഭവാക്യത്തിന്റെ ഭാവം
  choice: ‘എന്റെ ഭവനം ദൈവത്തോടുകൂടെ അങ്ങനെയല്ലല്ലോ’ എന്ന നിഷേധപ്രസ്താവന
  alternative: ‘എന്റെ ഭവനം ദൈവത്തോടുകൂടെ അങ്ങനെയല്ലയോ?’ എന്ന അനുകൂല വാചാടോപചോദ്യം
  rationale: മസോററ്റിക് പാഠത്തിലെ വ്യക്തമായ നിഷേധം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു. തുടർന്ന് വരുന്ന ഉടമ്പടി-പ്രസ്താവനയോടുള്ള സംഘർഷം പരിഹരിച്ച് കളയാതെ മറ്റൊരു പ്രധാന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: יַצְמִיחַ എന്ന ക്രിയയുടെ കർത്താവും സൂചിത കർമവും
  choice: ദൈവം രക്ഷയെയും ആഗ്രഹത്തെയും, ഉടമ്പടിയിൽ ഉൾപ്പെട്ട യാഥാർഥ്യമായി, വളർച്ചയിലേക്കോ പൂർത്തീകരണത്തിലേക്കോ കൊണ്ടുവരുന്നു
  alternative: ‘അവിടുന്ന് അതിനെ വളർത്തുകയില്ല’ എന്ന നേരിട്ടുള്ള നിഷേധപ്രസ്താവന
  rationale: ഹീബ്രു വാക്യം സംക്ഷിപ്തവും ദുഷ്കരവുമാണ്. അനുകൂല വാചാടോപചോദ്യം ഉടമ്പടി-സന്ദർഭത്തോട് യോജിക്കുന്നു; ‘അതിനെ’ എന്ന സർവനാമം കർമത്തിന്റെ കൃത്യമായ പരിധി നിർണയിക്കാതെ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. ‘ഭവനം’ എന്ന പദം കുടുംബം/രാജവംശം എന്ന ദ്വയസാധ്യത സംരക്ഷിക്കുന്നു; പാഠത്തിലെ രണ്ട് പ്രധാന വ്യാഖ്യാനദുഷ്കരതകളും അടിക്കുറിപ്പുകളോടെ നിലനിർത്തി.
