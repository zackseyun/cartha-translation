base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
translation:
  language: ml
  text: അവന്റെ പിന്നാലെ ഹരാര്യനായ ആഗേയുടെ മകൻ ശമ്മാ ഉണ്ടായിരുന്നു. ഫെലിസ്ത്യർ യുദ്ധത്തിനായി[a] ഒന്നിച്ചുകൂടി. അവിടെ പരിപ്പുചെടികൾ നിറഞ്ഞ ഒരു വയൽത്തുണ്ട് ഉണ്ടായിരുന്നു; ജനം ഫെലിസ്ത്യരുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: לַחַיָּה എന്ന ഹീബ്രു പദപ്രയോഗം ദുഷ്കരമാണ്. ഇവിടെ അത് ‘യുദ്ധത്തിനായി’ എന്നു ഗ്രഹിച്ചിരിക്കുന്നു. ‘ഒരു സൈനികസംഘമായി’ എന്നോ സമാനമായോ അർഥമാകാനും സാധ്യതയുണ്ട്; ചിലർ ഇതിനെ ‘ലേഹിയിൽ’ എന്ന സ്ഥലനാമമായും വായിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: അവന്റെ പിന്നാലെ
  rationale: വീരന്മാരുടെ പട്ടികയിലെ ക്രമബന്ധം ഹീബ്രുവിലെ സംക്ഷിപ്തതയോടെ നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ക്രിയ ചേർക്കുന്നില്ല.
- source_word: שַׁמָּא בֶן־אָגֵא הָרָרִי
  choice: ഹാരാര്യനായ ആഗേയുടെ മകൻ ശമ്മാ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; הָרָרִי എന്ന വംശീയമോ പ്രദേശികമോ ആയ വിശേഷണം വിവർത്തനം ചെയ്ത് അനിശ്ചിതത്വം ഇല്ലാതാക്കാതെ ‘ഹാരാര്യൻ’ എന്നു നിലനിർത്തി.
- source_word: וַיֵּאָסְפוּ פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ ... ഒന്നിച്ചുകൂടി
  rationale: אסף എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ കൂടിച്ചേരൽ എന്ന സാധാരണ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַחַיָּה
  choice: യുദ്ധത്തിനായി[a]
  rationale: ദുഷ്കരമായ ഈ പദപ്രയോഗത്തിന് സൈനികസന്ദർഭത്തോടും 1 ദിനവൃത്താന്തം 11:13-ലെ സമാന്തരവിവരണത്തോടും യോജിക്കുന്ന പ്രവർത്തനാർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: ഒരു വയൽത്തുണ്ട്
  rationale: ഒരു വയലിലെ നിർദിഷ്ട ഭാഗം എന്ന വ്യക്തമായ ദൃശ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מְלֵאָה עֲדָשִׁים
  choice: പരിപ്പുചെടികൾ നിറഞ്ഞ
  rationale: עֲדָשִׁים എന്നത് lentils ആണെന്ന അർഥം സൂചിപ്പിക്കുമ്പോൾ, വയലിൽ വളരുന്ന വിളയെ ഉദ്ദേശിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘പരിപ്പുചെടികൾ’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്; ‘നട്ടിരുന്ന’ എന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: וְהָעָם
  choice: ജനം
  rationale: സന്ദർഭത്തിൽ സൈനികരെ സൂചിപ്പിക്കാമെങ്കിലും עם എന്ന പൊതുപദത്തെ കൂടുതൽ നിർദിഷ്ടമാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: נָס מִפְּנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി
  rationale: מִפְּנֵי എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപവും പലായനത്തിന്റെ അർഥവും വ്യക്തമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
