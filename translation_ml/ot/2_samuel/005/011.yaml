reference: 2 Samuel 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח חִירָ֨ם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י עֵ֔ץ וְ/חָֽרָשֵׁ֖י אֶ֣בֶן קִ֑יר וַ/יִּבְנֽוּ בַ֖יִת לְ/דָוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
translation:
  language: ml
  text: സോരിന്റെ രാജാവായ ഹീരാം ദാവീദിന്റെ അടുക്കൽ ദൂതന്മാരെയും ദേവദാരുത്തടികളെയും മരപ്പണിക്കാരെയും കൽമതിൽ പണിക്കാരെയും[a] അയച്ചു. അവർ ദാവീദിനുവേണ്ടി ഒരു ഭവനം[b] പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൽപ്പണിക്കാരെയും.” എബ്രായപ്രയോഗത്തിൽ “കല്ല്,” “മതിൽ” എന്നീ രണ്ടു പദങ്ങളും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഒരു കൊട്ടാരം.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഒരു ഭവനം” എന്നാണ്; രാജകീയ സന്ദർഭത്തിൽ ഈ പദം കൊട്ടാരത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സാധാരണ ക്രിയയ്ക്ക് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാള തുല്യം.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: സോർരാജാവായ ഹീരാം
  rationale: പേരും രാജപദവിയും മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തു; צֹר എന്ന സ്ഥലനാമത്തിന് പ്രചാരത്തിലുള്ള രൂപം ‘സോർ’ സ്വീകരിച്ചു.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: സാധാരണ സന്ദേശവാഹകരെയും രാജതന്ത്രപ്രതിനിധികളെയും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ പദം; സന്ദർഭം നിർബന്ധിക്കാത്ത ‘പ്രതിനിധികൾ’ എന്ന പ്രത്യേക അർഥം ചേർത്തിട്ടില്ല.
- source_word: וַעֲצֵי אֲרָזִים
  choice: ദേവദാരുത്തടികൾ
  rationale: അക്ഷരാർഥത്തിലെ ‘ദേവദാരുമരങ്ങൾ/മരം’ ഇവിടെ നിർമ്മാണത്തിനുള്ള തടികളെ സൂചിപ്പിക്കുന്നു; മൂർത്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: חָרָשֵׁי עֵץ
  choice: മരപ്പണിക്കാർ
  rationale: മരത്തിൽ തൊഴിൽ ചെയ്യുന്ന ശില്പികളെ വ്യക്തമാക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളം; ‘ആശാരിമാർ’ എന്നത് ചില പ്രദേശങ്ങളിൽ കൂടുതൽ ചുരുങ്ങിയതോ ജാതിസൂചനയുള്ളതോ ആയി കേൾക്കാം.
- source_word: חָרָשֵׁי אֶבֶן קִיר
  choice: കൽമതിൽപ്പണിക്കാർ
  rationale: പ്രയാസമുള്ള എബ്രായപ്രയോഗത്തിലെ ‘കല്ല്’ എന്നും ‘മതിൽ’ എന്നും ഉള്ള രണ്ടു ഘടകങ്ങളും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന സംയുക്തരൂപം.
- source_word: וַיִּבְנוּ
  choice: അവർ ... പണിതു
  rationale: ബഹുവചന കർത്താവ് അയക്കപ്പെട്ട പണിക്കാരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: בַיִת לְדָוִד
  choice: ദാവീദിനുവേണ്ടി ഒരു ഭവനം
  rationale: בַיִת എന്നതിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; രാജകീയ സന്ദർഭത്തിൽ ‘കൊട്ടാരം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: בַיִת എന്ന പദം രാജകീയ വസതിയെയാണോ സാധാരണ ഭവനത്തെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ഭവനം
  alternative: കൊട്ടാരം
  rationale: എബ്രായപദത്തിന്റെ അടിസ്ഥാനാർഥം പ്രധാനവാചകത്തിൽ നിലനിർത്തി; രാജകീയ സന്ദർഭം അനുവദിക്കുന്ന കൂടുതൽ പ്രത്യേകമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി. ഇതിലൂടെ വാചകത്തിലെ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കൽമതിൽപ്പണിക്കാർ’ എന്ന രൂപം അപൂർവമെങ്കിലും മൂലത്തിലെ אֶבֶן, קִיר എന്നീ രണ്ടു ഘടകങ്ങളും സുതാര്യമായി നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
