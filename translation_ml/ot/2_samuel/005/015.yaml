  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നാമപ്പട്ടികാശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ആവർത്തിത സംയോജകം മുഖ്യവാക്യത്തിൽ സ്വാഭാവിക വിരാമചിഹ്നങ്ങളാക്കി, അതിന്റെ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
