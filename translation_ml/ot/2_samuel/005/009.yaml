translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സാങ്കേതിക ഭൂപ്രകൃതി പദമായ ‘മില്ലോ’യുടെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണത്തിലൂടെയും അടിക്കുറിപ്പിൽ വിശദീകരണത്തിലൂടെയും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട അനിശ്ചിത വാക്യഘടകത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
