  to: അങ്ങനെ ദാവീദ് ആ കോട്ടയിൽ താമസിച്ചു; അതിനെ ദാവീദിന്റെ നഗരം എന്നു വിളിച്ചു. ദാവീദ് മില്ലോ മുതൽ ഉൾഭാഗത്തേക്കു[a] ചുറ്റുമായി പണിതു.
  rationale: മുഖ്യപാഠത്തിന്റെ അർഥം മാറ്റാതെ, പ്രവൃത്തികളുടെ ആഖ്യാനക്രമം കൂടുതൽ വ്യക്തവും സ്വാഭാവികവുമാക്കി. മില്ലോയെക്കുറിച്ചും അതിൽനിന്ന് ഉൾഭാഗത്തേക്കുള്ള നിർമാണപരിധിയെക്കുറിച്ചുമുള്ള വാക്യഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വിശ്വസ്തമായി നിലനിർത്തി; തെറ്റിദ്ധരിപ്പിക്കുന്ന ബദൽ നീക്കി.
