  naturalness: ‘ആ കോട്ടയിൽ’ എന്നത് മുൻസന്ദർഭത്തെ ആശ്രയിച്ചുള്ള സ്വാഭാവിക പ്രയോഗമാണ്. ‘ചുറ്റുമായി പണിതു’ എന്ന ക്രമം ‘ചുറ്റും പണിതു’ എന്നതിനെക്കാൾ മിനുസമായി വാചകത്തിൽ ചേരുന്നു. ‘താമസിച്ചു; അതിനെ’ എന്ന ക്രമം രണ്ടു തുടർച്ചയായ പ്രവൃത്തികളെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
