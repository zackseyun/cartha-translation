base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/009.yaml
  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് ആ കോട്ടയിൽ താമസിച്ചു; അതിനെ ദാവീദിന്റെ നഗരം എന്നു വിളിച്ചു. ദാവീദ് മില്ലോ മുതൽ ഉൾഭാഗത്തേക്കു[a] ചുറ്റുമായി പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മില്ലോ മുതൽ ഉൾഭാഗത്തേക്കു’ എന്നതിനു ‘മില്ലോയിൽനിന്ന് അകത്തേക്കു’ എന്നും പരിഭാഷപ്പെടുത്താം. മൂലവാക്യഘടനയെ ‘മില്ലോ മുതൽ, അകത്തേക്കും’ എന്നും മനസ്സിലാക്കാൻ സാധ്യതയുണ്ട്. ‘മില്ലോ’ യെരൂശലേമിലെ അറിയപ്പെട്ടിരുന്ന ഒരു നിർമിതിയെയോ പടിപ്പുരൂപത്തിൽ മണ്ണിട്ട് നികത്തിയ ഭാഗത്തെയോ സൂചിപ്പിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ച്
  rationale: ישב എന്ന ക്രിയയുടെ ‘വസിക്കുക/താമസിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; കോട്ട പിടിച്ചശേഷം ദാവീദ് അവിടെ വസിച്ചതാണ് സന്ദർഭം.
- source_word: בַּמְּצֻדָה
  choice: ആ കോട്ടയിൽ
  rationale: מְצֻדָה ഉറപ്പുള്ള പ്രതിരോധസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭത്തിലെ അറിയപ്പെടുന്ന കോട്ടയായതിനാൽ ‘ആ കോട്ട’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּקְרָא לָהּ
  choice: അതിനെ ... എന്നു വിളിച്ചു
  rationale: קרא + ל എന്ന നാമകരണപ്രയോഗത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ‘പേരിട്ടു’ എന്നും സാധ്യമെങ്കിലും ‘വിളിച്ചു’ മൂലരൂപത്തോട് അടുത്തതാണ്.
- source_word: עִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരം
  rationale: ഈ സ്ഥലനാമത്തിന്റെ അർഥം സുതാര്യമായി നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം.
- source_word: וַיִּבֶן
  choice: പണിതു
  rationale: בנהയുടെ അടിസ്ഥാന അർഥമായ ‘പണിയുക’ നിലനിർത്തുന്നു; മൂലപാഠം വ്യക്തമായി പറയാത്ത ‘കോട്ട ഉറപ്പിച്ചു’ അല്ലെങ്കിൽ ‘പുനർനിർമിച്ചു’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: ചുറ്റുമുള്ള വ്യാപ്തിയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִן הַמִּלּוֹא
  choice: മില്ലോ മുതൽ
  rationale: מִלּוֹאയുടെ കൃത്യമായ വാസ്തുവിദ്യാ/ഭൂപ്രകൃതി സൂചന അനിശ്ചിതമായതിനാൽ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്താതെ അറിയപ്പെടുന്ന നാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וָבָיְתָה
  choice: അകത്തേക്കു
  rationale: ദിശാസൂചകമായ രൂപത്തിന്റെ സാധ്യതയേറിയ ‘ഉൾഭാഗത്തേക്ക്’ എന്ന സ്ഥലപരമായ അർഥം നൽകുന്നു; ഒരു പ്രത്യേക ‘വീടിനെ’ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
