  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി-പട്ടികാ ശൈലി. മൂലപാഠത്തിലെ കർമണി കൃദന്തരൂപത്തിന്റെ വിശാലത പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും ‘മക്കൾ’ എന്ന സന്ദർഭസഹജമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
