base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/014.yaml
  text: 'These are the names of those born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: ml
  text: 'യെരൂശലേമിൽ അവനു ജനിച്ചവരുടെ[a] പേരുകൾ ഇവയാണ്: ശമ്മൂവ, ശോബാബ്, നാഥാൻ, ശലോമോൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെരൂശലേമിൽ അവനു ജനിച്ച മക്കൾ.’ ഹീബ്രു കൃദന്തരൂപത്തിന്റെ അക്ഷരാർഥം ‘ജനിച്ചവർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവയാണ്
  rationale: പട്ടിക അവതരിപ്പിക്കുന്ന സംയോജകവും ചൂണ്ടുപദവും ചേർന്ന പ്രയോഗം. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘ഇവയാണ്’ അതിന്റെ അവതരണഭാവം സ്വാഭാവികമായി നൽകുന്നു; ‘എന്നാൽ/പിന്നെ’ പോലൊരു അധിക സംയോജകം ആവശ്യമില്ല.
- source_word: שְׁמוֹת
  choice: പേരുകൾ
  rationale: ‘പേര്’ എന്ന പദത്തിന്റെ ബഹുവചന നിർമാണരൂപം; തുടർന്നുവരുന്ന പേരുകളുടെ പട്ടികയെ നേരിട്ട് പരിചയപ്പെടുത്തുന്നു.
- source_word: הַיִּלֹּדִים
  choice: ജനിച്ചവർ
  rationale: ילד എന്ന ധാതുവിന്റെ നിർദിഷ്ട കർമണി കൃദന്തരൂപം അക്ഷരാർഥത്തിൽ ‘ജനിച്ചവർ’ എന്നാണ്. ‘മക്കൾ’ എന്നത് സന്ദർഭസഹജമായിരിക്കുമെങ്കിലും മൂലരൂപത്തിൽ ഇല്ലാത്ത ബന്ധസൂചന കൂടുതൽ വ്യക്തമാക്കുന്നതിനാൽ പ്രധാനപാഠത്തിൽ വിശാലമായ രൂപം നിലനിർത്തി.
- source_word: לוֹ
  choice: അവനു
  rationale: ഇവിടെ לְ മാതാപിതൃത്വബന്ധം സൂചിപ്പിക്കുന്നു. ‘അവനു ജനിച്ചവർ’ എന്നത് മലയാളത്തിലെ സ്വാഭാവിക വംശാവലി പ്രയോഗമാണ്.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: ജനനസ്ഥലം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള സ്ഥലസൂചക പ്രയോഗം.
- source_word: שַׁמּוּעַ
  choice: ശമ്മൂവ
  rationale: ഹീബ്രു പേരിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שׁוֹבָב
  choice: ശോബാബ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: נָתָן
  choice: നാഥാൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ വ്യക്തമായി പ്രതിനിധീകരിക്കുന്ന ലിപ്യന്തരണം.
- source_word: שְׁלֹמֹה
  choice: ശലോമോൻ
  rationale: ഹീബ്രു ശബ്ദരൂപത്തോട് അടുത്തതും മലയാള ബൈബിൾ വായനയിൽ തിരിച്ചറിയാവുന്നതുമായ രൂപം.
