source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אֶֽעֱלֶה֙ אֶל פְּלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יָדִ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל דָּוִד֙ עֲלֵ֔ה כִּֽי נָתֹ֥ן אֶתֵּ֛ן אֶת הַ/פְּלִשְׁתִּ֖ים בְּ/יָדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
translation:
  language: ml
  text: 'ദാവീദ് യഹോവയോടു ചോദിച്ചു: “ഞാൻ ഫെലിസ്ത്യർക്കെതിരെ പുറപ്പെടണമോ? അവരെ എന്റെ കൈയിൽ ഏൽപ്പിക്കുമോ?” യഹോവ ദാവീദിനോടു പറഞ്ഞു: “പുറപ്പെടുക; ഞാൻ തീർച്ചയായും ഫെലിസ്ത്യരെ നിന്റെ കൈയിൽ ഏൽപ്പിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: യഹോവയോട് അരുളപ്പാട് ചോദിച്ചു
  rationale: ഇവിടെ שׁאל ദൈവിക മാർഗനിർദേശം തേടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആചാരരീതി അനാവശ്യമായി നിർണയിക്കാതെ ഈ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: הַאֶעֱלֶה / עֲלֵה
  choice: പുറപ്പെടണമോ / പുറപ്പെടുക
  rationale: עלה എന്ന പദത്തിന്റെ ആവർത്തനം സാധ്യമായത്ര നിലനിർത്തുന്നു; സൈനികസന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘പുറപ്പെടുക’ ഉപയോഗിച്ച്, മൂലത്തിൽ നേരിട്ട് പറയാത്ത ‘ആക്രമിക്കുക’ എന്ന പ്രത്യേകത ചേർക്കുന്നില്ല.
- source_word: אֶל פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർക്കെതിരെ
  rationale: אֶל അക്ഷരാർഥത്തിൽ ‘അടുക്കലേക്ക്’ എന്നായാലും, ശത്രുസൈന്യത്തിലേക്കുള്ള നീക്കമെന്ന സന്ദർഭാർഥം മലയാളത്തിൽ ‘എതിരെ’ എന്നു സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: הֲתִתְּנֵם ... בְּיָדִי
  choice: അവരെ എന്റെ കൈയിൽ ഏല്പിച്ചുതരുമോ
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗം ശത്രുവിന്മേൽ വിജയം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. കൈ എന്ന ദൃശ്യരൂപവും ചോദ്യത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: כִּי נָתוֹן אֶתֵּן
  choice: ഞാൻ തീർച്ചയായും ... ഏല്പിച്ചുതരും
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും പരിമിതക്രിയയും ചേർന്നുള്ള ഊന്നൽ ‘തീർച്ചയായും’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּיָדֶךָ
  choice: നിന്റെ കൈയിൽ
  rationale: ദാവീദിന്റെ ചോദ്യത്തിലെ അതേ വിജയപ്രയോഗം ഉത്തരത്തിലും നിലനിർത്തി മൂലത്തിലെ സമാന്തരത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ പദവിയാക്കി മാറ്റാതെ, മലയാള വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: ദൈവത്തോട് ചോദിച്ചതിന്റെ രീതി
  choice: അരുളപ്പാട് ചോദിച്ചു
  alternative: ചോദിച്ചു; ആലോചന ചോദിച്ചു
  rationale: ദാവീദ് ദൈവിക മാർഗനിർദേശം തേടിയെന്ന സന്ദർഭം വ്യക്തമാക്കുന്നു; എന്നാൽ പുരോഹിതൻ, ഏഫോദ്, ചീട്ട് തുടങ്ങിയ മൂലത്തിൽ പറയാത്ത മാർഗം നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ ദൈവവചനത്തിന് യോജിച്ച ആദരസൂചകപ്രയോഗമാണ്; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചു.
