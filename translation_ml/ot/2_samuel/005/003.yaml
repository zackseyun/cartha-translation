id: 2SA.5.3
reference: 2 Samuel 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹ֣ת לָ/הֶם֩ הַ/מֶּ֨לֶךְ דָּוִ֥ד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֧וּ אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേലിന്റെ എല്ലാ മൂപ്പന്മാരും ഹെബ്രോനിൽ രാജാവിന്റെ അടുക്കൽ വന്നു. ദാവീദ് രാജാവ് ഹെബ്രോനിൽ യഹോവയുടെ സന്നിധിയിൽ അവരുമായി ഒരു ഉടമ്പടി ചെയ്തു; അവർ ദാവീദിനെ ഇസ്രായേലിന്റെ രാജാവായി അഭിഷേകം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ കഥാഖ്യാനരൂപം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള വരവിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള സ്ഥലസൂചനയോടൊപ്പം ‘വന്നു’ സ്വാഭാവികമാണ്.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ എല്ലാ മൂപ്പന്മാരും
  rationale: כָּל എന്നതിന്റെ സമഗ്രതയും זְקֵנִים എന്നതിന്റെ സമൂഹനേതൃത്വ അർഥവും നിലനിർത്തുന്നു.
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  choice: ഹെബ്രോനിൽ രാജാവിന്റെ അടുക്കൽ
  rationale: חֶבְרוֹנָהയിലെ ദിശാസൂചക പ്രത്യയം ഹെബ്രോനിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു; രാജാവ് അവിടെ ഉണ്ടായിരുന്നുവെന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: ഒരു ഉടമ്പടി ചെയ്തു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിച്ചു’ എന്ന എബ്രായ ശൈലിയാണെങ്കിലും മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്തു’ അതിന്റെ ഗൗരവവും ബന്ധപരമായ അർഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: לָהֶם
  choice: അവരുമായി
  rationale: כרת ברית എന്ന പ്രയോഗത്തിൽ ബന്ധപരമായ അർഥം ‘അവരുമായി ഉടമ്പടി ചെയ്തു’ എന്നാണ്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ഇവിടെ ദൈവസാന്നിധ്യത്തിൽ നടന്ന ഔപചാരിക ഉടമ്പടിയെ സൂചിപ്പിക്കുന്നു; ‘സന്നിധിയിൽ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: וַיִּמְשְׁחוּ
  choice: അഭിഷേകം ചെയ്തു
  rationale: രാജകീയ പശ്ചാത്തലത്തിൽ משׁח എണ്ണയാൽ അഭിഷേകം ചെയ്ത് രാജസ്ഥാനത്തേക്ക് നിയമിക്കുന്ന ചടങ്ങിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ രാജാവായി
  rationale: ദാവീദിന്റെ രാജനിയമനവും ഇസ്രായേലിന്മേലുള്ള രാജാധികാരവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവ്
  rationale: എബ്രായത്തിലെ പദവിയും പേരും ചേർന്ന ഘടനയെ മലയാളത്തിലെ സ്വാഭാവിക പേര്–പദവി ക്രമത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വ്യക്തിനാമത്തെ പൊതുവായ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന രൂപം ഉപയോഗിക്കുന്നു.
- issue: בְּרִית എന്ന ഉടമ്പടിപദത്തിന്റെ അർഥഭാരം
  choice: ഉടമ്പടി
  alternative: കരാർ
  rationale: രാജകീയവും ദൈവസാക്ഷ്യത്തിലുള്ളതുമായ ഈ ബന്ധത്തിന്റെ ഗൗരവം ‘ഉടമ്പടി’ നിലനിർത്തുന്നു; ‘കരാർ’ നിയമപരമോ വ്യാപാരപരമോ ആയ അർഥത്തിലേക്ക് ചുരുങ്ങാൻ സാധ്യതയുണ്ട്.
- issue: לִפְנֵי יְהוָהയുടെ സാന്നിധ്യഭാഷ
  choice: യഹോവയുടെ സന്നിധിയിൽ
  alternative: യഹോവയുടെ മുമ്പാകെ
  rationale: ഇരുവരും സാധുവാണെങ്കിലും ‘സന്നിധിയിൽ’ ദൈവസാന്നിധ്യത്തിൽ നടന്ന solemn covenantal act എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ദൈവത്തിന്റെ സ്ഥാനപരമായ സാന്നിധ്യം എങ്ങനെ മനസ്സിലാക്കണമെന്നത് അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായ കഥാഖ്യാനത്തിലെ രണ്ടു പ്രധാന പ്രവർത്തനങ്ങളും ക്രമത്തിൽ നിലനിർത്തി. മൂലപാഠത്തിലെ അർഥം മലയാളത്തിൽ നേരിട്ട് വ്യക്തമായതിനാൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
