source:
  edition: WLC
  text: וִ֠/יהִי ב/שמע/ך אֶת ק֧וֹל צְעָדָ֛ה בְּ/רָאשֵׁ֥י הַ/בְּכָאִ֖ים אָ֣ז תֶּחֱרָ֑ץ כִּ֣י אָ֗ז יָצָ֤א יְהוָה֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת בְּ/מַחֲנֵ֥ה פְלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
translation:
  language: ml
  text: ബാൽസം മരങ്ങളുടെ[a] തലപ്പുകളിൽ ചുവടൊച്ച കേൾക്കുമ്പോൾ നീ നിർണായകമായി നടപടി എടുക്കണം; കാരണം അപ്പോൾ ഫെലിസ്ത്യരുടെ പാളയത്തെ പ്രഹരിക്കാൻ യഹോവ നിനക്കു മുമ്പായി പുറപ്പെട്ടിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബാക്കാ മരങ്ങൾ’; എബ്രായപദം സൂചിപ്പിക്കുന്ന കൃത്യമായ വൃക്ഷയിനം അനിശ്ചിതമാണ്. പഴയ ഇംഗ്ലീഷ് പരിഭാഷകളിൽ പലപ്പോഴും ‘മൾബറി മരങ്ങൾ’ എന്നു കാണുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי בְשָׁמְעֲךָ
  choice: കേൾക്കുമ്പോൾ
  rationale: היהയും ב + infinitive construct-ഉം ചേർന്ന് ഭാവിയിലെ സമയസാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘കേൾക്കുമ്പോൾ’ എന്നു നൽകി.
- source_word: קוֹל צְעָדָה
  choice: പടനീക്കത്തിന്റെ ശബ്ദം
  rationale: צְעָדָה ചുവടുവെപ്പിനെയോ നീക്കത്തെയോ സൂചിപ്പിക്കുന്നു; സൈനികസന്ദർഭത്തിൽ ‘പടനീക്കം’ അർഥം വ്യക്തമായി നൽകുന്നു, എന്നാൽ ശബ്ദത്തിന്റെ ഉറവിടത്തെ അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: ബാൽസംമരങ്ങളുടെ മുകളറ്റങ്ങളിൽ
  rationale: רָאשֵׁי എന്നത് മരങ്ങളുടെ മുകൾഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു. הַבְּכָאִים എന്ന വൃക്ഷനാമത്തിന്റെ കൃത്യമായ ഇനം അനിശ്ചിതമായതിനാൽ പ്രചാരത്തിലുള്ള ‘ബാൽസംമരങ്ങൾ’ മുഖ്യപാഠത്തിൽ നൽകി, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אָז תֶּחֱרָץ
  choice: അപ്പോൾ നീ നിർണായകമായി പ്രവർത്തിക്കണം
  rationale: חרץ ഇവിടെ വേഗം മാത്രമല്ല, ഉറച്ചും ഊർജസ്വലമായും നടപടി സ്വീകരിക്കാനുള്ള ആഹ്വാനമാണ്; ‘നിർണായകമായി പ്രവർത്തിക്കുക’ ഈ വ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: יָצָא יְהוָה לְפָנֶיךָ
  choice: യഹോവ നിനക്കു മുമ്പായി പുറപ്പെട്ടിരിക്കും
  rationale: Perfect രൂപം അടയാളം കേൾക്കുന്ന സമയത്ത് ദൈവത്തിന്റെ മുൻനടപ്പ് ആരംഭിച്ചിട്ടുണ്ടെന്ന ആശയം നൽകുന്നു. ‘നിനക്കു മുമ്പായി’ യുദ്ധത്തിൽ ദൈവം മുന്നേ പോകുന്നതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְהַכּוֹת בְּמַחֲנֵה פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ പാളയത്തെ പ്രഹരിക്കാൻ
  rationale: נכה സൈനികസന്ദർഭത്തിൽ പ്രഹരിക്കുകയോ തോൽപ്പിക്കുകയോ ചെയ്യുക എന്നാണ്; מַחֲנֶה എന്ന ‘പാളയം’ എന്ന മൂർത്തമായ പദം നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: എബ്രായമൂലത്തിൽ നിയമനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ അത് മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി; പദത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റിയില്ല.
- issue: ദൈവം ദാവീദിനു മുമ്പായി പുറപ്പെടുന്നതിന്റെ കാലസൂചന
  choice: പുറപ്പെട്ടിരിക്കും
  alternative: പുറപ്പെടും
  rationale: יָצָא എന്ന perfect രൂപം, ശബ്ദം കേൾക്കുന്ന ഘട്ടത്തിൽ യഹോവയുടെ നടപടി ഇതിനകം ആരംഭിച്ചിരിക്കുന്നതായി വായിക്കാവുന്നതാണ്. ഭാവിസാഹചര്യത്തിനുള്ളിലെ പൂർത്തിയായ മുൻനടപ്പ് മലയാളത്തിൽ ‘പുറപ്പെട്ടിരിക്കും’ എന്നു നൽകി; ദൈവനടപടിയുടെ കൃത്യകാലബന്ധം അമിതമായി വ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ ‘പടനീക്കം’, അടിയന്തരവും ഉറച്ചതുമായ പ്രതികരണത്തിന് ‘നിർണായകമായി പ്രവർത്തിക്കുക’ എന്നിവ ഉപയോഗിച്ചു. വൃക്ഷയിനത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
