translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ശത്രുതാപരമായ ഉദ്ദേശ്യം സന്ദർഭത്തിൽ ഉണ്ടായിരുന്നാലും, മൂലത്തിലെ ‘തേടുക’ എന്ന വിശാലത നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നം തെറ്റായ സ്ഥാനത്ത് കാണപ്പെട്ടതിനാൽ, അതിന്റെ ഉള്ളടക്കത്തിന് യോജിച്ചവിധം ‘കോട്ട’ എന്ന പദത്തിനു ശേഷമാണ് [a] നൽകിയിരിക്കുന്നത്.
