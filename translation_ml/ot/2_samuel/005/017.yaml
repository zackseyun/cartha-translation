base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/017.yaml
  text: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
translation:
  language: ml
  text: ഫെലിസ്ത്യർ ദാവീദിനെ ഇസ്രായേലിന്മേൽ രാജാവായി അഭിഷേകം ചെയ്തുവെന്നു കേട്ടപ്പോൾ, എല്ലാ ഫെലിസ്ത്യരും ദാവീദിനെ തേടി കയറിവന്നു. ദാവീദ് അതു കേട്ടപ്പോൾ കോട്ടയിലേക്കു ഇറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദുർഗം.” എബ്രായ പദം ഉറപ്പുള്ള ഒരു സംരക്ഷിത സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ജനവിഭാഗത്തിന്റെ പേരിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: כִּי
  choice: എന്നു
  rationale: ഫെലിസ്ത്യർ കേട്ട വാർത്തയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.
- source_word: מָשְׁחוּ
  choice: അഭിഷേകം ചെയ്തുവെന്നു
  rationale: മൂലക്രിയയിലെ ‘അഭിഷേകം ചെയ്യുക’ എന്ന അർഥം നിലനിർത്തുകയും, കേൾക്കുന്നതിനു മുമ്പേ നടന്ന പ്രവൃത്തി സന്ദർഭത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു രാജാവായി
  rationale: ദാവീദിന്റെ രാജനിയമനവും ഇസ്രായേലിന്മേലുള്ള ഭരണബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַיַּעֲלוּ כָל־פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരെല്ലാവരും ... കയറിവന്നു
  rationale: כָל എന്ന സമഗ്രതയും עלה എന്ന ഉയർന്നിടത്തേക്കുള്ള ചലനവും നിലനിർത്തുന്നു; ‘പടയെടുത്തു’ എന്ന അധിക സൈനിക സൂചന ചേർക്കുന്നില്ല.
- source_word: לְבַקֵּשׁ אֶת־דָּוִד
  choice: ദാവീദിനെ തേടി
  rationale: בקש എന്ന പദത്തിന്റെ വിശാലമായ ‘തേടുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; പിടിക്കാനോ കൊല്ലാനോ എന്നു വ്യക്തമാക്കി അതിവിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: ദാവീദ് അതു കേട്ടപ്പോൾ
  rationale: സന്ദർഭത്തിൽ നിഗൂഢമായിരിക്കുന്ന കർമത്തെ ‘അതു’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിപ്പോയി
  rationale: ירד എന്ന ക്രിയയുടെ ദിശാസൂചനയായ ‘താഴേക്കു പോകുക’ നിലനിർത്തുന്നു.
- source_word: הַמְּצוּדָה
  choice: കോട്ട
  rationale: ഉറപ്പിച്ച സംരക്ഷണസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളം.
