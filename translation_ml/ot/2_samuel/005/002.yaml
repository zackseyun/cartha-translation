id: 2SA.5.2
reference: 2 Samuel 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: גַּם אֶתְמ֣וֹל גַּם שִׁלְשׁ֗וֹם בִּ/הְי֨וֹת שָׁא֥וּל מֶ֨לֶךְ֙ עָלֵ֔י/נוּ אַתָּ֗ה הייתה מוציא ו/ה/מבי אֶת יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר יְהוָ֜ה לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּ֛ה תִּהְיֶ֥ה לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
translation:
  language: ml
  text: 'മുമ്പും[a], ശൗൽ ഞങ്ങളുടെ രാജാവായിരുന്നപ്പോൾ, ഇസ്രായേലിനെ പുറത്തേക്കു നയിക്കുകയും അകത്തേക്കു കൊണ്ടുവരികയും ചെയ്തിരുന്നത് അങ്ങായിരുന്നു[b]. യാഹ്‌വേ അങ്ങയോടു പറഞ്ഞു: ‘എന്റെ ജനമായ ഇസ്രായേലിനു നീ ഇടയനായിരിക്കും; നീ ഇസ്രായേലിന്റെ അധിപനായിരിക്കും[c].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഇന്നലെയും അതിനു മുമ്പത്തെ ദിവസവും’; ‘മുമ്പ്’ അല്ലെങ്കിൽ ‘കുറെക്കാലമായി’ എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇസ്രായേലിനെ പുറത്തേക്കു കൊണ്ടുപോകുകയും അകത്തേക്കു കൊണ്ടുവരികയും ചെയ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. ജനത്തിന്റെ കാര്യങ്ങളിൽ, വിശേഷിച്ച് യുദ്ധത്തിൽ, അവരെ നയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: ‘നേതാവ്’ അല്ലെങ്കിൽ ‘ഭരണാധികാരി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം സാധാരണ ‘രാജാവ്’ എന്ന പദത്തിൽനിന്നു വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  choice: മുമ്പും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇന്നലെയും അതിനു മുമ്പത്തെ ദിവസവും’ എന്നായിരുന്നാലും, ഇവിടെ ദാവീദ് നേരത്തേ മുതൽ നേതൃത്വം നൽകിയിരുന്ന കാലത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. ‘മുമ്പും’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ
  choice: ശൗൽ ഞങ്ങളുടെ രാജാവായിരുന്നപ്പോൾ
  rationale: בְ ചേർന്ന infinitive construct കാലസൂചക ഉപവാക്യമാണ്; ഈ പരിഭാഷ ബന്ധവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: אַתָּה
  choice: അങ്ങായിരുന്നു
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ ‘അങ്ങായിരുന്നു’ എന്ന രൂപം പ്രകടമാക്കുന്നു; രാജാവിനെ അഭിസംബോധന ചെയ്യുന്ന സാഹചര്യത്തിന് ‘അങ്ങ്’ യോജിക്കുന്നു.
- source_word: מוציא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ പുറപ്പെടുവിച്ചതും തിരികെ കൊണ്ടുവന്നതും
  rationale: ജനത്തെ, വിശേഷിച്ച് യുദ്ധത്തിൽ, നയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു. ‘തിരികെ’ ചേർക്കുന്നത് മലയാളത്തിൽ ‘കൊണ്ടുവരുക’ എന്നതിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: תִרְעֶה
  choice: മേയ്ക്കും
  rationale: രാജകീയ ഭരണത്തെ ഇടയന്റെ പ്രവൃത്തിയായി ചിത്രീകരിക്കുന്ന മൂലരൂപകം നിലനിർത്തുന്നു.
- source_word: נָגִיד
  choice: അധിപൻ
  rationale: സാധാരണ ‘രാജാവ്’ എന്ന പദത്തിൽനിന്നു വ്യത്യസ്തമായ, നിയമിക്കപ്പെട്ട നേതാവിനെയോ ഭരണാധികാരിയെയോ സൂചിപ്പിക്കുന്ന പദം. ‘അധിപൻ’ ഈ വ്യത്യാസം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അത് ഒരു ബിരുദമായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു നൽകുന്നു.
- issue: תִרְעֶה എന്ന രാജകീയ ഇടയരൂപകം
  choice: എന്റെ ജനമായ ഇസ്രായേലിനെ നീ മേയ്ക്കും
  alternative: എന്റെ ജനമായ ഇസ്രായേലിനെ നീ ഭരിക്കും; പരിപാലിക്കും
  rationale: ഭരണാധികാരത്തെ ഇടയവൃത്തിയിലൂടെ അവതരിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ രൂപകം പരന്ന ‘ഭരിക്കുക’ എന്ന പദത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: נָגִיד എന്ന പദവും ‘രാജാവ്’ എന്ന പദവും തമ്മിലുള്ള വ്യത്യാസം
  choice: അധിപൻ
  alternative: ഭരണാധികാരി; നേതാവ്; പ്രഭു
  rationale: ഈ വാക്യത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നത് സാധാരണ ഹീബ്രു ‘രാജാവ്’ എന്ന പദമല്ല. അതിനാൽ ദൈവനിയോഗമുള്ള നേതൃത്വത്തിന്റെ ആശയം സൂക്ഷിച്ചുകൊണ്ട് വ്യത്യസ്ത പദം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദാവീദിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ബഹുമാനസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; ദൈവവചനത്തിൽ മൂലത്തിലെ ഏകവചന രണ്ടാംപുരുഷരൂപം ‘നീ’യായി നിലനിർത്തി. ഹീബ്രു ദൃശ്യപ്രയോഗങ്ങളും രാജകീയ ഇടയരൂപകവും പരമാവധി സ്വാഭാവികമായി സംരക്ഷിച്ചു.
