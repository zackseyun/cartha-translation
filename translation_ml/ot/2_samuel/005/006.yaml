  terminology: ‘യെരൂശലേം,’ ‘യെബൂസ്യർ,’ ‘ദാവീദ്,’ ‘അന്ധർ,’ and ‘മുടന്തർ’ are suitable. ‘അവന്റെ ആളുകൾ’ properly preserves the breadth of ‘his men.’
