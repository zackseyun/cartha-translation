base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/006.yaml
  text: And the king and his men went to Jerusalem[a], to the Jebusites, the inhabitants of the land. And they said to David, “You will not come in here, for even the blind and the lame will turn you away,” saying[b], “David will not come in here.”
translation:
  language: ml
  text: രാജാവും അവന്റെ ആളുകളും യെരൂശലേമിലെ ദേശനിവാസികളായ യെബൂസ്യരുടെ അടുക്കലേക്കു ചെന്നു. അവർ ദാവീദിനോടു പറഞ്ഞു:[a] “നീ ഇവിടെ കടക്കുകയില്ല; അന്ധരും മുടന്തരുംപോലും നിന്നെ പിന്തിരിപ്പിക്കും.”[b] “ദാവീദ് ഇവിടെ കടക്കുകയില്ല” എന്നായിരുന്നു അവരുടെ വെല്ലുവിളി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥമായി ‘അവൻ ദാവീദിനോടു പറഞ്ഞു’ എന്നാണ്; ഇവിടെ ഏകവചനം യെബൂസ്യനിവാസികളെ ഒരു കൂട്ടമായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: textual_variant
  - marker: b
    text: ‘അന്ധരെയും മുടന്തരെയും നീ നീക്കിക്കളയാതെ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഘടന ദുഷ്കരമാണ്. നഗരം അത്ര സുരക്ഷിതമാണെന്നും അന്ധരും മുടന്തരുംപോലും ദാവീദിനെ തടയാമെന്നുമുള്ള യെബൂസ്യരുടെ പരിഹാസമാണ് ഉദ്ദേശ്യമെന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ചെന്നു
  rationale: വാവ്-തുടർച്ചയുള്ള ആഖ്യാനരൂപത്തിൽ הלך കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന സാധാരണ ഭൂതകാലക്രിയയാണ്; ‘പടനീക്കം നടത്തി’ എന്നു പറഞ്ഞാൽ മൂലക്രിയയിൽ വ്യക്തമല്ലാത്ത സൈനികഭാവം അധികമായി വരും.
- source_word: הַמֶּלֶךְ וַאֲנָשָׁיו
  choice: രാജാവും അവന്റെ ആളുകളും
  rationale: אֲנָשָׁיו എന്നതിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സൈനികർ ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും അതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: אֶל הַיְבֻסִי יוֹשֵׁב הָאָרֶץ
  choice: ദേശനിവാസികളായ യെബൂസ്യരുടെ അടുക്കൽ
  rationale: ഏകവചന ജാതിനാമവും പങ്കാളിത്തരൂപവും ഇവിടെ കൂട്ടായ അർഥത്തിലാണ്. אֶל എന്നതിന്റെ അടിസ്ഥാന ദിശാസൂചന നിലനിർത്തി, വൈരഭാവം സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാനിടവരുത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അവർ ... പറഞ്ഞു
  rationale: ഹീബ്രു രൂപം ഏകവചനമാണെങ്കിലും യെബൂസ്യരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതാകാം; സ്വാഭാവിക മലയാളത്തിൽ സന്ദർഭസൂചിതമായ ബഹുവചനം ഉപയോഗിച്ചു, മൂലരൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: നീ ഇവിടെ കടക്കുകയില്ല
  rationale: കോട്ടനഗരത്തിലേക്കുള്ള പ്രവേശനത്തെക്കുറിച്ചുള്ള പരിഹാസഭരിതവും ഉറപ്പുള്ളതുമായ പ്രസ്താവനയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הֱסִירְךָ הַעִוְרִים וְהַפִּסְחִים
  choice: അന്ധരും മുടന്തരുംപോലും നിന്നെ പിന്തിരിപ്പിക്കും
  rationale: വാചകഘടന ദുഷ്കരമാണെങ്കിലും യെബൂസ്യരുടെ വെല്ലുവിളിയുടെ ഉദ്ദേശ്യം—നഗരം അത്ര സുരക്ഷിതമാകയാൽ ഇവർപോലും ദാവീദിനെ തടയും—വ്യക്തമാക്കുന്ന optimal-equivalence പരിഭാഷ.
- source_word: לֵאמֹר לֹא יָבוֹא דָוִד הֵנָּה
  choice: “ദാവീദ് ഇവിടെ കടക്കുകയില്ല” എന്നായിരുന്നു അവരുടെ വെല്ലുവിളി
  rationale: രണ്ടാമത്തെ לֵאמֹר ആദ്യ പരിഹാസത്തിന്റെ സാരമോ ആവർത്തനമോ അവതരിപ്പിക്കുന്നു; ഹീബ്രുവിലെ ആവർത്തനം സൂക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വൈകല്യത്തെ സൂചിപ്പിക്കുന്ന പദങ്ങൾ പരിഹാസത്തിൽ ഉപയോഗിക്കുന്നത്
  choice: ‘അന്ധരും മുടന്തരും’ എന്ന മൂലത്തിലെ സാക്ഷാത് പദങ്ങൾ നിലനിർത്തി
  alternative: ‘ഞങ്ങളിലെ ഏറ്റവും ദുർബലർപോലും’ എന്ന രൂപകപരമായ പരാവർത്തനം
  rationale: ഇത് യെബൂസ്യരുടെ ശത്രുതാപരമായ പരിഹാസത്തിന്റെ റിപ്പോർട്ടാണ്; മൂലത്തിലെ വ്യക്തമായ പദങ്ങളെ മൃദൂകരിക്കുകയോ രൂപകമാക്കി മാറ്റുകയോ ചെയ്യുന്നത് വാചകത്തിന്റെ ചരിത്ര-വാചിക സ്വഭാവം മറയ്ക്കും.
- issue: ദുഷ്കരമായ വ്യവസ്ഥാവാക്യത്തിന്റെ വ്യാഖ്യാനം
  choice: അന്ധരും മുടന്തരുംപോലും ദാവീദിനെ പിന്തിരിപ്പിക്കുമെന്ന പരിഹാസാർഥം മുഖ്യവാചകത്തിൽ നൽകി
  alternative: ‘അന്ധരെയും മുടന്തരെയും നീ നീക്കിക്കളയാതെ’ എന്ന കൂടുതൽ പദാനുപദ രൂപം
  rationale: כִּי אִם הֱסִירְךָ എന്ന ഘടന അസാധാരണവും അനിശ്ചിതവുമാണ്. സന്ദർഭത്തിലെ പരിഹാസഭാവം വ്യക്തമായി നൽകുമ്പോഴും പദാനുപദ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അവന്റെ ആളുകൾ’, ‘കടക്കുക’, ‘പിന്തിരിപ്പിക്കുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ഹീബ്രുവിലെ ദുഷ്കരതയും കൂട്ടായ ഏകവചനവും അടിക്കുറിപ്പുകളിൽ സുതാര്യമായി സൂക്ഷിച്ചു.
