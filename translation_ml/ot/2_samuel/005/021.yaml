id: 2SA.5.21
reference: 2 Samuel 5:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעַזְבוּ שָׁ֖ם אֶת עֲצַבֵּי/הֶ֑ם וַ/יִּשָּׂאֵ֥/ם דָּוִ֖ד וַ/אֲנָשָֽׁי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/021.yaml
  text: And they left their idols there[b][a], and David and his men carried them away.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ വിഗ്രഹങ്ങളെ[a] അവിടെ ഉപേക്ഷിച്ചു; ദാവീദും അവന്റെ ആളുകളും അവയെ എടുത്തുകൊണ്ടുപോയി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രതിമകളെ.” എബ്രായപദം ആരാധനയ്ക്കുള്ള രൂപങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; “വിഗ്രഹങ്ങൾ” എന്നത് സന്ദർഭത്തിലെ അർഥം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 1 ദിനവൃത്താന്തം 14:12-ൽ, അവ കത്തിച്ചുകളയാൻ ദാവീദ് കല്പിച്ചതായി കൂടി പറയുന്നു. ഇവിടെ ശമൂവേലിന്റെ എബ്രായപാഠം ദാവീദും അവന്റെ ആളുകളും അവയെ എടുത്തുകൊണ്ടുപോയി എന്നു മാത്രമാണ് പറയുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: ഉപേക്ഷിച്ചു
  rationale: עזב എന്ന ക്രിയയ്ക്ക് ‘വിട്ടുപോകുക/ഉപേക്ഷിക്കുക’ എന്നർഥമുണ്ട്. പിന്മാറിയവർ ആരാധനാവസ്തുക്കൾ അവിടെ വിട്ടുകളഞ്ഞുവെന്ന സന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: സ്ഥാനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ലളിതമായ ക്രിയാവിശേഷണം.
- source_word: עֲצַבֵּיהֶם
  choice: തങ്ങളുടെ വിഗ്രഹങ്ങളെ
  rationale: ഈ പദം രൂപങ്ങളെയോ ആരാധനയ്ക്കുള്ള പ്രതിമകളെയോ സൂചിപ്പിക്കാം. ഫെലിസ്ത്യരുടെ ആരാധനാവസ്തുക്കളാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് എന്നതിനാൽ ‘വിഗ്രഹങ്ങൾ’ അർഥം വ്യക്തമായി നൽകുന്നു; പകരമായ ‘പ്രതിമകൾ’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּשָּׂאֵם
  choice: അവയെ എടുത്തുകൊണ്ടുപോയി
  rationale: נשא എന്നതിന് ‘എടുക്കുക, ചുമക്കുക, കൊണ്ടുപോകുക’ തുടങ്ങിയ അർഥങ്ങളുണ്ട്. വസ്തുക്കളെ അവിടെനിന്ന് കൊണ്ടുപോയ ഭൗതികപ്രവൃത്തി വ്യക്തമാക്കുകയും അവയോട് പിന്നീടു ചെയ്തത് വാക്യത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: דָּוִד וַאֲנָשָׁיו
  choice: ദാവീദും അവന്റെ ആളുകളും
  rationale: അക്ഷരാർഥത്തിൽ ‘ദാവീദും അവന്റെ പുരുഷന്മാരും’ എന്നാണ്. യുദ്ധസന്ദർഭത്തിലെ ദാവീദിന്റെ കൂട്ടാളികളെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അവന്റെ ആളുകൾ’ എന്നു നൽകുന്നു; ‘സൈനികർ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: വിഗ്രഹങ്ങൾ എടുത്തുകൊണ്ടുപോയി എന്നു പറയുന്ന 2 ശമൂവേൽ 5:21-ഉം അവ കത്തിച്ചുകളയാൻ ദാവീദ് കല്പിച്ചു എന്നു പറയുന്ന 1 ദിനവൃത്താന്തം 14:12-ഉം തമ്മിലുള്ള ബന്ധം
  choice: 2 ശമൂവേലിലെ മസോരറ്റിക് പാഠം അനുസരിച്ച് ‘എടുത്തുകൊണ്ടുപോയി’ എന്നു പരിഭാഷപ്പെടുത്തി; കത്തിച്ചുകളഞ്ഞുവെന്ന വിവരം മുഖ്യവാക്യത്തിൽ ചേർത്തില്ല.
  alternative: ദിനവൃത്താന്തത്തിലെ സമാന്തരവിവരണവുമായി സമന്വയിപ്പിച്ച് അവ ഉടൻ കത്തിച്ചുകളഞ്ഞതായി മുഖ്യവാക്യത്തിൽ സൂചിപ്പിക്കുക.
  rationale: ശമൂവേലിലെ എബ്രായപാഠം ഇവിടെ ദാവീദും ആളുകളും അവയെ എടുത്തുകൊണ്ടുപോയി എന്നു മാത്രമാണ് പറയുന്നത്. ദിനവൃത്താന്തം നൽകുന്ന അധികവിവരം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നത് മൂലപാഠത്തിന്റെ പ്രത്യേകതയും ഇരുവിവരണങ്ങളുടെയും വ്യത്യാസവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അവന്റെ ആളുകൾ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; ‘എടുത്തുകൊണ്ടുപോയി’ മൂലത്തിലെ പ്രവർത്തി വ്യക്തമാക്കുമ്പോഴും ദിനവൃത്താന്തത്തിലെ ദഹിപ്പിക്കൽവിവരം മുൻകൂട്ടി ചേർക്കുന്നില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
