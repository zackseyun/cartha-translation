reference: 2 Samuel 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד ע֜וֹד פִּֽלַגְשִׁ֤ים וְ/נָשִׁים֙ מִ/יר֣וּשָׁלִַ֔ם אַחֲרֵ֖י בֹּא֣/וֹ מֵ/חֶבְר֑וֹן וַ/יִּוָּ֥לְדּוּ ע֛וֹד לְ/דָוִ֖ד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/013.yaml
  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
translation:
  language: ml
  text: ദാവീദ് ഹെബ്രോനിൽനിന്ന് വന്നശേഷം യെരൂശലേമിൽനിന്ന് കൂടുതൽ വെപ്പാട്ടികളെയും ഭാര്യമാരെയും സ്വീകരിച്ചു[a]. ദാവീദിന് പിന്നെയും പുത്രന്മാരും പുത്രിമാരും ജനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘യെരൂശലേമിൽ.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘യെരൂശലേമിൽനിന്ന്’ എന്നാണ്; ദാവീദ് അവിടേക്കു താമസം മാറ്റിയശേഷം അവിടെനിന്ന് അവരെ സ്വീകരിച്ചു എന്നായിരിക്കാം ഉദ്ദേശ്യം.'
    reason: സ്ഥലസൂചക മുൻപ്രത്യയത്തിന്റെ അക്ഷരാർഥവും സന്ദർഭത്തിൽ സാധ്യമായ മറ്റൊരു വായനയും നിലനിർത്താൻ.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: സ്വീകരിച്ചു
  rationale: לקח ഇവിടെ സ്ത്രീകളെ വിവാഹബന്ധത്തിലോ വെപ്പാട്ടിബന്ധത്തിലോ എടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വെറും ‘എടുത്തു’ എന്നതിനെക്കാൾ ‘സ്വീകരിച്ചു’ സ്വാഭാവികവും ബന്ധത്തിന്റെ ആശയം അനാവശ്യമായി വികസിപ്പിക്കാത്തതുമാണ്.
- source_word: עוֹד
  choice: കൂടുതൽ / പിന്നെയും
  rationale: രണ്ടിടത്തും കൂട്ടിച്ചേർക്കലാണ് സൂചന. ആദ്യ സന്ദർഭത്തിൽ ‘കൂടുതൽ’ എന്നും ജനനത്തെക്കുറിച്ചുള്ള രണ്ടാമത്തെ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘പിന്നെയും’ എന്നും നൽകി.
- source_word: פִּלַגְשִׁים
  choice: വെപ്പാട്ടികൾ
  rationale: ഭാര്യമാരിൽനിന്ന് വേർതിരിച്ചിരിക്കുന്ന രാജകുടുംബത്തിലെ ഉപപത്നിമാരെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ മലയാളപദം.
- source_word: וְנָשִׁים
  choice: ഭാര്യമാർ
  rationale: ‘വെപ്പാട്ടികൾ’ എന്ന പദത്തോടുള്ള കൂട്ടുപ്രയോഗത്തിലും രാജകുടുംബസന്ദർഭത്തിലും נָשִׁים എന്നത് പൊതുവായ ‘സ്ത്രീകൾ’ എന്നതിലുപരി ഭാര്യമാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִירוּשָׁלִַם
  choice: യെരൂശലേമിൽനിന്ന്
  rationale: מִן എന്ന എബ്രായ മുൻപ്രത്യയത്തിന്റെ സാധാരണ അർഥമായ ‘നിന്ന്’ നിലനിർത്തുന്നു. വാക്യഘടനയിൽ സ്ഥലം സംബന്ധിച്ച ചില അസ്വാഭാവികത ഉള്ളതിനാൽ ‘യെരൂശലേമിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: אַחֲרֵי בֹּאוֹ מֵחֶבְרוֹן
  choice: ഹെബ്രോനിൽനിന്ന് വന്നശേഷം
  rationale: ദാവീദ് ഹെബ്രോനിൽനിന്ന് വന്നതിനു ശേഷമുള്ള സംഭവമായി പ്രവർത്തിയെ സമയക്രമത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּוָּלְדוּ
  choice: ജനിച്ചു
  rationale: ילד എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തിന് സ്വാഭാവികമായ മലയാള നിർവചനം; കർത്തരി അർഥം ചേർക്കാതെ ജനനത്തെ നേരിട്ട് പറയുന്നു.
- source_word: לְדָוִד
  choice: ദാവീദിന്
  rationale: ജനനസൂത്രത്തിലെ לְ ബന്ധം/ഉടമസ്ഥത സൂചിപ്പിക്കുന്നു; ‘ദാവീദിന് ... ജനിച്ചു’ എന്നത് സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരും പുത്രിമാരും
  rationale: മൂലപാഠം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പറയുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ആ വ്യത്യാസം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ ബഹുഭാര്യത്വത്തെക്കുറിച്ചുള്ള വിവരണാത്മക പ്രസ്താവന
  choice: ധാർമിക വിലയിരുത്തൽ ചേർക്കാതെ സംഭവമായി മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: അംഗീകാരമോ അപലപനമോ സൂചിപ്പിക്കുന്ന വാക്കുകൾ ചേർക്കുക.
  rationale: ഈ വാക്യം ദാവീദിന്റെ പ്രവൃത്തിയും തുടർന്ന് ഉണ്ടായ ജനനങ്ങളും വിവരിക്കുന്നുവെങ്കിലും അവയെക്കുറിച്ച് വ്യക്തമായ ധാർമിക വിധി പ്രസ്താവിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പേരുകൾക്ക് പ്രചാരത്തിലുള്ള ബൈബിൾ രൂപങ്ങളായ ‘ദാവീദ്,’ ‘ഹെബ്രോൻ,’ ‘യെരൂശലേം’ ഉപയോഗിച്ചു. ‘വെപ്പാട്ടികൾ’ എന്നത് വ്യത്യസ്ത ഗൃഹബന്ധവിഭാഗം കൃത്യമായി നിലനിർത്തുന്നു.
