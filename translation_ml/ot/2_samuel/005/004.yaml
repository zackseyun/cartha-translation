translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ രാജവാഴ്ചാസംഗ്രഹശൈലി. എബ്രായത്തിലെ പ്രായസൂചക ഇടിയം സ്വാഭാവിക മലയാളത്തിലാക്കി; בְּמָלְכוֹ എന്നതിലെ പ്രവേശനകാല/ഭരണാരംഭ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
