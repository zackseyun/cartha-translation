id: 2SA.5.4
reference: 2 Samuel 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בֶּן שְׁלֹשִׁ֥ים שָׁנָ֛ה דָּוִ֖ד בְּ/מָלְכ֑/וֹ אַרְבָּעִ֥ים שָׁנָ֖ה מָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/004.yaml
  text: David was thirty years old when he began to reign[b][a], and he reigned forty years.
translation:
  language: ml
  text: ദാവീദ് രാജാവായപ്പോൾ[a] മുപ്പതു വയസ്സായിരുന്നു; അദ്ദേഹം നാല്പതു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭരിക്കാൻ തുടങ്ങിയപ്പോൾ.”
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: മുപ്പതു വയസ്സായിരുന്നു
  rationale: ‘മുപ്പതു വർഷത്തിന്റെ മകൻ’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം പ്രായം സൂചിപ്പിക്കുന്ന സാധാരണ ശൈലിയാണ്; അതിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: בְּ ചേർന്ന מלך എന്ന ക്രിയയുടെ infinitive construct രൂപവും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും ദാവീദിന്റെ രാജത്വാരംഭകാലത്തെ സൂചിപ്പിക്കുന്നു. ‘രാജാവായപ്പോൾ’ എന്നത് ഈ കാലസൂചന സ്വാഭാവികമായി നൽകുകയും ‘ഭരിക്കാൻ തുടങ്ങിയപ്പോൾ’ എന്ന സാധ്യതയും ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു.
- source_word: מָלָךְ
  choice: ഭരിച്ചു
  rationale: מלך ഇവിടെ രാജാധികാരം പ്രയോഗിച്ചതിനെയും രാജാവായി വാണതിനെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ രാജഭരണസംഗ്രഹങ്ങളിൽ ‘ഭരിച്ചു’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: אַרְבָּעִים שָׁנָה
  choice: നാല്പതു വർഷം
  rationale: ദാവീദിന്റെ ഭരണകാലദൈർഘ്യം നേരിട്ട് സൂചിപ്പിക്കുന്ന സംഖ്യാനാമപ്രയോഗം.
- source_word: דָּוִד
  choice: ദാവീദ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ പേരുരൂപം നിലനിർത്തുന്നു.
