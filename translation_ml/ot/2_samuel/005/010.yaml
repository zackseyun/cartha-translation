  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ דָּוִ֖ד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֛ה אֱלֹהֵ֥י צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/010.yaml
  text: And David went on[a], growing greater, and Yahweh, the God of hosts, was with him.
translation:
  language: ml
  text: ദാവീദ് മേൽക്കുമേൽ പ്രബലനായിത്തീർന്നു[a]; സൈന്യങ്ങളുടെ ദൈവമായ യാഹ്‌വെ അവനോടുകൂടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദ് കൂടുതൽ കൂടുതൽ പ്രബലനായിക്കൊണ്ടിരുന്നു.” പരിമിതക്രിയയോടു ചേർന്ന ഹീബ്രു ക്രിയാനാമരൂപം തുടർച്ചയായ വർധനയെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... הָלוֹךְ וְגָדוֹל
  choice: മേൽക്കുമേൽ പ്രബലനായിത്തീർന്നു
  rationale: പരിമിതക്രിയയോടൊപ്പം ആവർത്തിച്ചിരിക്കുന്ന ക്രിയാനാമരൂപം തുടർച്ചയായ വർധനയെ ഊന്നിപ്പറയുന്നു. സന്ദർഭത്തിൽ ഇത് ദാവീദിന്റെ അധികാരവും ശക്തിയും വളർന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: דָּוִד
  choice: ദാവീദ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ രൂപം.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ ദൈവം
  rationale: צְבָאוֹת എന്നതിന്റെ സൈന്യങ്ങൾ/സേനകൾ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; അവ ഭൗമികമോ സ്വർഗീയമോ എന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: ദൈവിക സാന്നിധ്യം ദാവീദിനോടൊപ്പം ഉണ്ടായിരുന്നുവെന്ന ഹീബ്രു പ്രയോഗത്തെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം മറയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: צְבָאוֹת എന്ന ദൈവിക വിശേഷണത്തിന്റെ വ്യാപ്തി
  choice: സൈന്യങ്ങൾ
  alternative: സ്വർഗീയ സൈന്യങ്ങൾ
  rationale: ഭൗമികമോ സ്വർഗീയമോ ആയ സൈന്യങ്ങൾ എന്ന് പരിമിതപ്പെടുത്താതെ ഹീബ്രുവിലെ അർഥവ്യാപ്തിയും സാധ്യതയുള്ള ദൈവശാസ്ത്രപരമായ ഭാവവും സംരക്ഷിക്കുന്നു.
- issue: ദാവീദിന്റെ വളർച്ചയുടെ സ്വഭാവം
  choice: പ്രബലനായിത്തീർന്നു
  alternative: മഹാനായിക്കൊണ്ടിരുന്നു
  rationale: സന്ദർഭത്തിലെ രാജകീയ ശക്തിവർധനയെ വ്യക്തമാക്കുന്നു; 'മഹാൻ' എന്നത് നൈതിക മഹത്വമായി തെറ്റിദ്ധരിക്കപ്പെടാനുള്ള സാധ്യത ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. 'മേൽക്കുമേൽ' തുടർച്ചയായ വർധന സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു; 'സൈന്യങ്ങളുടെ ദൈവം' മൂലപദത്തിന്റെ മനപ്പൂർവമായ അനിശ്ചിത വ്യാപ്തി നിലനിർത്തുന്നു.
