  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ כָּל שִׁבְטֵ֧י יִשְׂרָאֵ֛ל אֶל דָּוִ֖ד חֶבְר֑וֹנָ/ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר הִנְ/נ֛וּ עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
translation:
  language: ml
  text: 'പിന്നെ ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളും ഹെബ്രോനിൽ[a] ദാവീദിന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഇതാ, ഞങ്ങൾ നിന്റെ അസ്ഥിയും നിന്റെ മാംസവും ആകുന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഹെബ്രോനിലേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം; ‘ഹെബ്രോൻ’ എന്ന എബ്രായ സ്ഥലനാമരൂപത്തിന് ദിശ സൂചിപ്പിക്കുന്ന ഒരു അവസാനം ചേർന്നിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിന്റെ അസ്ഥിയും നിന്റെ മാംസവും.’ അടുത്ത രക്തബന്ധമോ ഒരേ കുടുംബസ്വത്വമോ സൂചിപ്പിക്കുന്ന ബന്ധുത്വപ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: പിന്നെ ... വന്നു
  rationale: വാവ്-ക്രമരൂപം ആഖ്യാനത്തെ അടുത്ത സംഭവത്തിലേക്കു നീക്കുന്നു. ‘പിന്നെ’ സംഭവക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വന്നു’ എന്നത് בוא എന്ന ക്രിയയുടെ നേരായ അർഥമാണ്.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളും
  rationale: ദേശീയസമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൂട്ടായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל דָּוִד
  choice: ദാവീദിന്റെ അടുക്കൽ
  rationale: אֶל ഒരു വ്യക്തിയിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. ‘അടുക്കൽ’ ലക്ഷ്യമായ വ്യക്തിയെ വ്യക്തമായി കാണിക്കുന്നു.
- source_word: חֶבְרֹנָה
  choice: ഹെബ്രോനിൽ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ -ה ‘ഹെബ്രോനിലേക്ക്’ എന്ന ചലനം സൂചിപ്പിക്കാമെങ്കിലും, ദാവീദിന്റെ അടുക്കലേക്കുള്ള വരവ് വാക്യത്തിൽ ഇതിനകം പ്രകടമാണ്. അതിനാൽ ‘ഹെബ്രോനിൽ’ ലക്ഷ്യസ്ഥലത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ദിശാസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: പറഞ്ഞു
  rationale: ‘പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന യാന്ത്രിക ആവർത്തനം ഒഴിവാക്കി, സാധാരണ എബ്രായ സംഭാഷണസൂത്രത്തെ സ്വാഭാവിക മലയാളത്തിൽ ഒറ്റ ക്രിയയായി നൽകുന്നു.
- source_word: הִנּוּ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഈ നിപാതത്തിന്റെ ഊന്നൽ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: നിന്റെ അസ്ഥിയും നിന്റെ മാംസവും
  rationale: രക്തബന്ധവും പൊതുവായ കുടുംബസ്വത്വവും സൂചിപ്പിക്കുന്ന രൂപകം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ, എബ്രായ പദക്രമവും രണ്ട് ഉടമസ്ഥപ്രത്യയങ്ങളും നിലനിർത്തുന്നു.
- source_word: אֲנָחְנוּ
  choice: ഞങ്ങൾ ... ആകുന്നു
  rationale: ക്രിയയില്ലാത്ത എബ്രായ നാമവാക്യത്തെ പൂർണവും സ്വാഭാവികവുമായ മലയാളവാക്യമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ബന്ധുത്വസൂത്രത്തിന്റെ രാഷ്ട്രീയ-ദൈവശാസ്ത്ര പ്രാധാന്യം
  choice: ‘ഞങ്ങൾ നിന്റെ അസ്ഥിയും നിന്റെ മാംസവും ആകുന്നു’ എന്ന രൂപകം നേരിട്ട് നിലനിർത്തുക
  alternative: ‘ഞങ്ങൾ നിന്റെ സ്വന്തം ജനമാണ്’ അല്ലെങ്കിൽ ‘ഞങ്ങൾ നിന്റെ ബന്ധുക്കളാണ്’
  rationale: ഇസ്രായേൽഗോത്രങ്ങൾ ദാവീദുമായുള്ള പങ്കിട്ട ബന്ധുത്വത്തെ രാജത്വത്തിനുള്ള അടിസ്ഥാനമായി ഉന്നയിക്കുന്നു. രൂപകം നിലനിർത്തുന്നത് കുടുംബബന്ധവും ദേശീയ-രാഷ്ട്രീയ ഐക്യവും ഒരുപോലെ സംരക്ഷിക്കുന്നു; പ്രത്യേകമായ ഒരു വ്യാഖ്യാനം വാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ഇതാ’ എന്നത് ശ്രദ്ധക്ഷണത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ‘അസ്ഥിയും മാംസവും’ എന്ന മൂലരൂപകം വായനാസൗകര്യത്തിനായി പരാവർത്തനം ചെയ്യാതെ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് അടയാളങ്ങൾ വാചകത്തിൽ വരുന്ന ക്രമത്തിന് അനുസരിച്ച് [a], [b] ആയി ക്രമപ്പെടുത്തി.
