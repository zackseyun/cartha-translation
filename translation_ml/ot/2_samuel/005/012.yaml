revisions:
- from: യഹോവ തന്നെ ഇസ്രായേലിന്മേൽ രാജാവായി ഉറപ്പിച്ചിരിക്കുന്നുവെന്നും തന്റെ ജനമായ ഇസ്രായേലിനുവേണ്ടി അവിടുന്ന് തന്റെ രാജ്യം ഉന്നതമാക്കിയിരിക്കുന്നുവെന്നും ദാവീദ് അറിഞ്ഞു.[a]
  to: യഹോവ തന്നെ ഇസ്രായേലിന്മേൽ രാജാവായി സ്ഥാപിച്ചെന്നും, തന്റെ ജനമായ ഇസ്രായേലിനുവേണ്ടി[a] ദാവീദിന്റെ രാജ്യം ഉന്നതപ്പെടുത്തിയെന്നും ദാവീദ് അറിഞ്ഞു.
  rationale: The revision explicitly renders the kingdom as David's, preventing the Malayalam reflexive pronoun from being read as referring to Yahweh. It replaces awkward present-perfect forms with completed past forms and moves the footnote anchor to the disputed possessive phrase. The main reading and the alternative reading remain those supported by the Hebrew and the English audit trail.
