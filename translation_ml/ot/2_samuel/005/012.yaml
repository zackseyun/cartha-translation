reference: 2 Samuel 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/כִי֙ נִשֵּׂ֣א מַמְלַכְתּ֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/012.yaml
  text: And David knew that Yahweh had established him as king over Israel[a], and that he had exalted his kingdom for the sake of his people Israel.
translation:
  language: ml
  text: യഹോവ തന്നെ ഇസ്രായേലിന്മേൽ രാജാവായി സ്ഥാപിച്ചെന്നും, തന്റെ ജനമായ ഇസ്രായേലിനുവേണ്ടി[a] ദാവീദിന്റെ രാജ്യം ഉന്നതപ്പെടുത്തിയെന്നും ദാവീദ് അറിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ ജനമായ ഇസ്രായേൽ’ എന്നതിലെ ‘തന്റെ’ ദാവീദിനെ സൂചിപ്പിക്കുന്നതായി എടുത്താൽ, ‘ദാവീദിന്റെ ജനമായ ഇസ്രായേലിനുവേണ്ടി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: അറിഞ്ഞു
  rationale: ידע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ആഖ്യാനപരമായ അർഥം ‘അറിഞ്ഞു’ എന്നാണ്; ‘മനസ്സിലാക്കി’ എന്നതിനെക്കാൾ വ്യാഖ്യാനഭാരം കുറവാണ്.
- source_word: הֱכִינוֹ
  choice: തന്നെ ... ഉറപ്പിച്ചിരിക്കുന്നുവെന്ന്
  rationale: כון എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം സ്ഥാപിക്കുക, ഉറപ്പിക്കുക എന്ന ആശയം നൽകുന്നു; രാജത്വത്തിൽ ദൈവം ദാവീദിനെ സ്ഥിരപ്പെടുത്തിയതിനെ ‘ഉറപ്പിച്ചു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: לְמֶלֶךְ
  choice: രാജാവായി
  rationale: לְ ഇവിടെ പദവിയോ ചുമതലയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘രാജാവായി’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്മേൽ
  rationale: രാജാധികാരത്തിന്റെ പരിധി സൂചിപ്പിക്കുന്ന עַל എന്നതിന് ‘ഇസ്രായേലിന്മേൽ’ യോജിക്കുന്നു.
- source_word: נִשֵּׂא
  choice: ഉന്നതമാക്കിയിരിക്കുന്നു
  rationale: נשׂא ഇവിടെ ഉയർത്തുക അഥവാ ഉന്നതമാക്കുക എന്ന അർഥത്തിലാണ്; രാജ്യം മഹത്ത്വത്തിലും നിലയിലും ഉയർത്തിയതിനെ ഇത് സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַמְלַכְתּוֹ
  choice: തന്റെ രാജ്യം
  rationale: ממלכה രാജ്യം, രാജാധികാരം, വാഴ്ച എന്നിവ സൂചിപ്പിക്കാം; ‘രാജ്യം’ അതിന്റെ വിശാലതയും എബ്രായത്തിലെ സർവനാമസംബന്ധവും നിലനിർത്തുന്നു.
- source_word: בַּעֲבוּר
  choice: വേണ്ടി
  rationale: ഇവിടെ ഉദ്ദേശ്യവും ഗുണഭോക്തൃത്വവും സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് മലയാളത്തിലെ സ്വാഭാവികമായ ‘വേണ്ടി’ യോജിക്കുന്നു.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: തന്റെ ജനമായ ഇസ്രായേൽ
  rationale: ഇസ്രായേലിനെ ‘തന്റെ ജനം’ എന്ന് തിരിച്ചറിയിക്കുന്ന സമാനാധികരണഘടന മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു; സർവനാമത്തിന്റെ പ്രധാന വായന യഹോവയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: עַמּוֹ (‘തന്റെ ജനം’) എന്നതിലെ സർവനാമപ്രത്യയത്തിന്റെ പൂർവപദം
  choice: ‘തന്റെ ജനമായ ഇസ്രായേൽ’ എന്നതിലെ ‘തന്റെ’ യഹോവയെ സൂചിപ്പിക്കുന്നതായി മുഖ്യവാചകത്തിൽ അവതരിപ്പിച്ചു.
  alternative: സർവനാമം ദാവീദിനെ സൂചിപ്പിച്ച് ‘ദാവീദിന്റെ ജനമായ ഇസ്രായേൽ’ എന്നും മനസ്സിലാക്കാം.
  rationale: സമീപസന്ദർഭത്തിൽ ദാവീദിനെ ഉറപ്പിക്കുകയും അവന്റെ രാജ്യം ഉന്നതമാക്കുകയും ചെയ്യുന്ന കർത്താവ് യഹോവയാണ്; ‘യഹോവയുടെ ജനം’ എന്ന വേദപുസ്തകപ്രയോഗവും ഈ വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ എബ്രായ സർവനാമം വ്യാകരണപരമായി ദാവീദിലേക്കും മടങ്ങാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: מַמְלַכְתּוֹ (‘തന്റെ രാജ്യം’) എന്നതിലെ സർവനാമത്തിന്റെ പൂർവപദം
  choice: ദാവീദിന്റെ രാജ്യം എന്ന സ്വാഭാവിക സന്ദർഭവായന നിലനിർത്തി; മലയാളത്തിൽ ‘തന്റെ’ എന്ന പ്രതിഫല സർവനാമം ദാവീദിലേക്കാണ് മടങ്ങുന്നത്.
  alternative: ‘അവന്റെ രാജ്യം/രാജാധികാരം’ എന്ന കൂടുതൽ വാക്കുതോറ്റമുള്ള രൂപം ഉപയോഗിക്കാമായിരുന്നു.
  rationale: വാക്യത്തിന്റെ മുഖ്യവിഷയം ദാവീദായതിനാൽ മലയാളത്തിലെ ‘തന്റെ രാജ്യം’ ദാവീദിന്റെ രാജ്യം എന്നു വ്യക്തവും സ്വാഭാവികവുമാണ്; യഹോവയെ പ്രവർത്തനകർത്താവായി ‘അവിടുന്ന്’ എന്നു വേർതിരിച്ചതും ആശയക്കുഴപ്പം കുറയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്’ എന്നും ദാവീദിലേക്കു മടങ്ങുന്ന പ്രതിഫലബന്ധത്തിന് ‘തന്റെ’ എന്നും ഉപയോഗിച്ച് രണ്ടു സർവനാമബന്ധങ്ങളും വായനാസൗകര്യത്തോടെ വേർതിരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
