id: 2SA.5.20
reference: 2 Samuel 5:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֨א דָוִ֥ד בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִד֒ וַ/יֹּ֕אמֶר פָּרַ֨ץ יְהוָ֧ה אֶת אֹיְבַ֛/י לְ/פָנַ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
translation:
  language: ml
  text: 'ദാവീദ് ബാൽ-പെരാസീമിൽ[a] എത്തി; അവിടെവെച്ച് അവരെ വീഴ്ത്തി. അപ്പോൾ ദാവീദ് പറഞ്ഞു: “വെള്ളപ്പൊക്കത്തിന്റെ കുത്തൊഴുക്കുപോലെ യഹ്‌വേ എന്റെ മുമ്പിൽ എന്റെ ശത്രുക്കളെ തകർത്തുകടന്നിരിക്കുന്നു.”[b] അതുകൊണ്ട് അവൻ ആ സ്ഥലത്തിന് ബാൽ-പെരാസീം എന്നു പേരിട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബാൽ-പെരാസീം” എന്ന പേരിന് “ഭേദിച്ചുകടക്കലുകളുടെ അധിപൻ” എന്നോ “ഭേദിച്ചുകടക്കലുകളുടെ സ്ഥലം” എന്നോ ഉള്ള ആശയം സൂചിപ്പിക്കാം. യഹ്‌വേ ശത്രുക്കളെ “തകർത്തുകടന്നു” എന്ന ദാവീദിന്റെ വാക്കുകളോടുള്ള പദപ്രയോഗബന്ധമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “വെള്ളം കുത്തിപ്പൊട്ടുന്നതുപോലെ.” “തകർത്തുകടന്നിരിക്കുന്നു,” വെള്ളത്തിന്റെ കുത്തൊഴുക്ക്, “ബാൽ-പെരാസീം” എന്നിവയ്ക്കിടയിൽ എബ്രായത്തിൽ ഒരേ പദമൂലത്തെ ആശ്രയിച്ചുള്ള വാക്കുകളിയുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: ബാൽ-പെരാസീം
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; അടിക്കുറിപ്പിലൂടെ പേരിനും ദാവീദിന്റെ പ്രസ്താവനയ്ക്കുമിടയിലെ പദപ്രയോഗബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וַיַּכֵּם
  choice: അവരെ വീഴ്ത്തി
  rationale: യുദ്ധസന്ദർഭത്തിലെ נכה എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുന്ന, എന്നാൽ ഉപയോഗിച്ച ആയുധമോ എല്ലാവരും കൊല്ലപ്പെട്ടുവെന്നോ അനാവശ്യമായി സൂചിപ്പിക്കാത്ത സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: פָּרַץ
  choice: തകർത്തുകടന്നിരിക്കുന്നു
  rationale: തടസ്സം ഭേദിച്ച് ശക്തിയായി കടക്കുക എന്ന ക്രിയയുടെ അർഥവും തുടർന്നുള്ള വെള്ളത്തിന്റെ ഉപമയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֹיְבַי
  choice: എന്റെ ശത്രുക്കളെ
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ നാമത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക വിവർത്തനം.
- source_word: לְפָנַי
  choice: എന്റെ മുമ്പിൽ
  rationale: ദാവീദിന്റെ സാന്നിധ്യത്തിലും അവന്റെ മുന്നിലുമായി യഹ്‌വേ പ്രവർത്തിച്ചു എന്ന എബ്രായ പ്രയോഗം അടുത്തായി നിലനിർത്തുന്നു.
- source_word: כְּפֶרֶץ מָיִם
  choice: വെള്ളം അണപൊട്ടിയൊഴുകുന്നതുപോലെ
  rationale: ജലത്തിന്റെ തടയാനാകാത്ത ശക്തമായ പൊട്ടിയൊഴുക്ക് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; פָּרַץ/פֶּרֶץ എന്ന പദപ്രയോഗബന്ധം ‘തകർത്തുകടക്കുക/അണപൊട്ടിയൊഴുകുക’ എന്ന സമാന്തരപ്രയോഗത്തിലൂടെ ഭാഗികമായി നിലനിർത്തുന്നു.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: അവൻ ആ സ്ഥലത്തിന് ... എന്നു പേരിട്ടു
  rationale: എബ്രായ നാമകരണസൂത്രത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വേ’ എന്ന രൂപം സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: വിജയം ആരുടെ പ്രവൃത്തിയായി അവതരിപ്പിക്കപ്പെടുന്നു
  choice: യഹ്‌വേ ശത്രുക്കളെ തകർത്തുകടന്നു
  alternative: ദാവീദ് യഹ്‌വേയുടെ സഹായത്തോടെ ശത്രുക്കളെ തോൽപ്പിച്ചു
  rationale: ആദ്യ വാക്യത്തിൽ ദാവീദ് അവരെ വീഴ്ത്തിയെന്ന് പറയുമ്പോഴും, ദാവീദിന്റെ വാക്കുകൾ വിജയം നേരിട്ട് യഹ്‌വേയുടെ പ്രവൃത്തിയായി പറയുന്നു. ഈ ദൈവിക-മാനുഷിക പ്രവർത്തനതലങ്ങളിലെ പിരിമുറുക്ക് വിശദീകരിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും ഗൗരവമുള്ളതുമായ മലയാളം. യുദ്ധത്തിന്റെ ശക്തി ‘വീഴ്ത്തി’ എന്നതിലൂടെ നിലനിർത്തി; ‘വെട്ടിക്കൊന്നു’ പോലുള്ള മൂലപാഠം വ്യക്തമാക്കാത്ത വിശദാംശങ്ങൾ ഒഴിവാക്കി. വെള്ളത്തിന്റെ ഉപമ സ്വാഭാവികമാക്കുന്നതിനൊപ്പം എബ്രായത്തിലെ പദപ്രയോഗബന്ധം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും പരമാവധി സംരക്ഷിച്ചു.
