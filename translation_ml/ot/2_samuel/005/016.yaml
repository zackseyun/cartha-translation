translation:
  language: ml
  text: എലീശാമ, എല്യാദാ, എലീഫെലെത്ത് എന്നിവരും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: എലീശാമാ
  rationale: വ്യക്തിനാമം അതിന്റെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു. മുമ്പത്തെ വാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ ആദ്യത്തെ ו ഇവിടെ വേറിട്ട് ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്താതെ പട്ടികാസംയോജനത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: וְ/אֶלְיָדָע
  choice: എല്യാദാ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ഉച്ചരിക്കാവുന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ו സൂചിപ്പിക്കുന്ന സംയോജനം അവസാനത്തിലെ ‘എന്നിവർ’ എന്ന പട്ടികാരൂപത്തിൽ പ്രകടമാകുന്നു.
- source_word: וֶ/אֱלִיפָלֶט
  choice: എലീഫേലെത്ത്
  rationale: אֱלִיפָלֶט എന്ന പേരിലെ വ്യഞ്ജന-സ്വരക്രമം പരമാവധി നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു; വാക്യാവസാനത്തിലെ പട്ടികാഭാവം ‘എന്നിവർ’ വഴി സ്വാഭാവികമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പേരുകളുടെ പട്ടികയാണെന്നതു വ്യക്തമായി കാണിക്കുന്ന സംക്ഷിപ്തവും മാന്യവുമായ രൂപം. ഇംഗ്ലീഷ് കുറിപ്പ് ഇംഗ്ലീഷ് അക്ഷരവിന്യാസപരമ്പരകളിലെ വ്യത്യാസത്തെ മാത്രം സംബന്ധിക്കുന്നതും മലയാള പരിഭാഷയ്ക്ക് പ്രസക്തമല്ലാത്തതുമായതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
