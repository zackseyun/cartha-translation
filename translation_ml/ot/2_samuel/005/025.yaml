id: 2SA.5.25
reference: 2 Samuel 5:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ דָּוִד֙ כֵּ֔ן כַּ/אֲשֶׁ֥ר צִוָּ֖/הוּ יְהוָ֑ה וַ/יַּךְ֙ אֶת פְּלִשְׁתִּ֔ים מִ/גֶּ֖בַע עַד בֹּאֲ/ךָ֥ גָֽזֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/025.yaml
  text: And David did so[a], just as Yahweh had commanded him[b], and he struck down the Philistines from Geba as far as Gezer.
translation:
  language: ml
  text: യഹ്‌വെ തന്നോടു കല്പിച്ചതുപോലെതന്നെ ദാവീദ് ചെയ്തു. അവൻ ഫെലിസ്ത്യരെ ഗേബയിൽനിന്ന്[a] ഗേസെർവരെ[b] പരാജയപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം: ‘ഗേബയിൽനിന്ന്.’ പാഠഭേദമോ സമാന്തരവിവരണത്തിന്റെ സ്വാധീനമോ കാരണം ചില പരിഭാഷകളിൽ ഇവിടെ മറ്റൊരു സ്ഥലനാമം കാണാം.'
    reason: textual_variant
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നീ ഗേസെരിലേക്കു വരുന്നിടംവരെ’; അതായത്, ഗേസെരിലേക്കുള്ള പ്രവേശനമോ സമീപപ്രദേശമോ വരെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כֵּן
  choice: അങ്ങനെതന്നെ ... ചെയ്തു
  rationale: മുൻവാക്യത്തിൽ ലഭിച്ച നിർദേശം ദാവീദ് അതേപടി അനുസരിച്ചതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: തന്നോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: കല്പനയോടുള്ള കൃത്യമായ അനുസരണം സൂചിപ്പിക്കുന്ന כַּאֲשֶׁר എന്ന പദത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיַּךְ
  choice: പരാജയപ്പെടുത്തി
  rationale: സൈനികസന്ദർഭത്തിൽ נכה നിർണായകമായി പ്രഹരിക്കുകയോ തോൽപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പരാജയപ്പെടുത്തി’ സ്വാഭാവികമായ മലയാളത്തിൽ യുദ്ധഫലം വ്യക്തമാക്കുന്നു, എന്നാൽ എല്ലാവരെയും കൊന്നു എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിനുള്ള സ്ഥാപിതവും എളുപ്പം തിരിച്ചറിയാവുന്നതുമായ മലയാളനാമം.
- source_word: מִגֶּבַע
  choice: ഗേബയിൽനിന്ന്
  rationale: മസോററ്റിക് പാഠത്തിലെ גבע എന്ന സ്ഥലനാമത്തെ നേരിട്ട് പിന്തുടരുന്നു.
- source_word: עַד בֹּאֲךָ גָזֶר
  choice: ഗേസെർവരെ
  rationale: ‘ഗേസെരിലേക്കുള്ള നിന്റെ വരവുവരെ’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ സ്ഥലപരിധിപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്; കൂടുതൽ അക്ഷരാർഥസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു ബിരുദമായി മാറ്റാതെ നിലനിർത്തുന്നു; ‘യഹ്‌വെ’ എന്നത് Yahweh എന്ന പുനർനിർമിത ഉച്ചാരണത്തിന്റെ സ്വാഭാവിക മലയാളലിപ്യന്തരമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. നീണ്ട ഏകവാക്യം ഒഴിവാക്കി രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും സംഭവക്രമവും കാരണബന്ധവും മാറ്റിയിട്ടില്ല. നൽകിയ ഇംഗ്ലീഷ് പാളിയിൽ അടിക്കുറിപ്പുകളുടെ സ്ഥാനങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, [a] ഗേബയോടും [b] ഗേസെരോടും ചേർത്ത് മൂലപാഠസാക്ഷ്യത്തിന് അനുസൃതമായി സ്ഥാപിച്ചു.
