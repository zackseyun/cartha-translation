id: 2SA.5.5
reference: 2 Samuel 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/חֶבְרוֹן֙ מָלַ֣ךְ עַל יְהוּדָ֔ה שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֣ה חֳדָשִׁ֑ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֗ךְ שְׁלֹשִׁ֤ים וְ/שָׁלֹשׁ֙ שָׁנָ֔ה עַ֥ל כָּל יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/005.yaml
  text: In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
translation:
  language: ml
  text: ഹെബ്രോനിൽ അദ്ദേഹം യെഹൂദയുടെമേൽ ഏഴു വർഷവും ആറു മാസവും ഭരിച്ചു; യെരൂശലേമിൽ അദ്ദേഹം മുഴുവൻ ഇസ്രായേലിന്റെയും യെഹൂദയുടെയുംമേൽ മുപ്പത്തിമൂന്നു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֶבְרוֹן
  choice: ഹെബ്രോനിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗവും חֶבְרוֹן എന്ന സ്ഥലനാമവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ പ്രതിഫലിക്കുന്നു.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: ഇവിടെയുള്ള ഖത്തൽ രൂപം രാജാവായിത്തീർന്ന നിമിഷത്തെയല്ല, ഭരണകാലത്തിന്റെ ദൈർഘ്യത്തെയാണ് സംഗ്രഹിക്കുന്നത്.
- source_word: עַל יְהוּדָה
  choice: യെഹൂദയുടെമേൽ
  rationale: מלך എന്ന ക്രിയയോടുകൂടിയ עַל ഭരണാധികാരത്തിന് വിധേയമായ ജനവിഭാഗത്തെയോ രാജ്യത്തെയോ സൂചിപ്പിക്കുന്നു; ‘യുടെമേൽ’ മൂലഭാഷയുടെ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: ഏഴു വർഷവും ആറു മാസവും
  rationale: കാലദൈർഘ്യം പറയുന്ന എബ്രായ ക്രമം സ്വാഭാവികമായ മലയാളരീതിയിൽ നേരിട്ട് പകർന്നു.
- source_word: וּבִירוּשָׁלַם
  choice: യെരൂശലേമിൽ
  rationale: രണ്ടാമത്തെ ഭരണകേന്ദ്രം സൂചിപ്പിക്കുന്ന സ്ഥലപ്രയോഗം; വാക്യബന്ധം മലയാളത്തിലെ അർദ്ധവിരാമം കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ וְ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  choice: മുപ്പത്തിമൂന്നു വർഷം
  rationale: എബ്രായ സംഖ്യാവാക്യം സമകാലിക മലയാളത്തിലെ സാധാരണ സംയുക്തസംഖ്യയായി നൽകി.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: മുഴുവൻ ഇസ്രായേലിന്റെയും യെഹൂദയുടെയുംമേൽ
  rationale: כָּל എന്നതിന്റെ സമഗ്രതയും ഇസ്രായേൽ, യെഹൂദ എന്നീ രണ്ടു രാഷ്ട്രീയ ഘടകങ്ങളുടെ പരാമർശവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അദ്ദേഹം’ എന്ന സർവനാമം മുൻസന്ദർഭത്തിലെ ദാവീദിനെ സൂചിപ്പിക്കുന്നു. സ്ഥലനാമങ്ങൾക്ക് പ്രചാരത്തിലുള്ള ബൈബിൾ രൂപങ്ങളായ ‘ഹെബ്രോൻ’, ‘യെരൂശലേം’ എന്നിവ ഉപയോഗിച്ചു; മൂലവാക്യത്തിലെ ആവർത്തനവും ഇസ്രായേൽ–യെഹൂദ വേർതിരിവും സംരക്ഷിച്ചു.
