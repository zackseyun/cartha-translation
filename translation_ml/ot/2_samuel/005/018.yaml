translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. സൈനികസന്ദർഭം വ്യക്തമാക്കിയെങ്കിലും മൂലത്തിലെ ക്രിയയ്ക്ക് അതിലധികം സാങ്കേതികമായ അർഥം നിർബന്ധിച്ചിട്ടില്ല.
