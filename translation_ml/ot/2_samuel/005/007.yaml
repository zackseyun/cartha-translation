base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/007.yaml
  text: But David captured the stronghold of Zion[a], that is, the City of David.
translation:
  language: ml
  text: എന്നാൽ ദാവീദ് സീയോനിലെ കോട്ട[a] പിടിച്ചടക്കി; അതാണ് ദാവീദിന്റെ നഗരം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സീയോന്റെ ദുർഗം.’ എബ്രായപദം ശക്തമായി ഉറപ്പിച്ച ഒരു സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: പിടിച്ചടക്കി
  rationale: לכד എന്ന ക്രിയ സൈനികസന്ദർഭത്തിൽ ഒരു സ്ഥലത്തെ കീഴടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പിടിച്ചടക്കി’ എന്നത് ഈ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ യെബൂസ്യരുടെ വെല്ലുവിളിക്കു വിരുദ്ധമായി ദാവീദിന്റെ വിജയം അവതരിപ്പിക്കുന്ന സന്ദർഭബന്ധം ഈ സംയോജകത്തിൽ ഉണ്ട്; അതിനാൽ വെറും ‘അപ്പോൾ’ എന്നതിനെക്കാൾ ‘എന്നാൽ’ യോജിക്കുന്നു.
- source_word: מְצֻדַת
  choice: കോട്ട
  rationale: מצודה ഉറപ്പുള്ള പ്രതിരോധസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. ‘കോട്ട’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സൈനിക അർഥം വ്യക്തമായി നൽകുന്നതുമാണ്; ‘ദുർഗം’ എന്നതും സാധ്യമാണ്.
- source_word: צִיּוֹן
  choice: സീയോൻ
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: הִיא
  choice: അതാണു്
  rationale: സ്വതന്ത്ര സർവനാമം മുൻപറഞ്ഞ സീയോൻ കോട്ടയെ തുടർന്നുള്ള ‘ദാവീദിന്റെ നഗരം’ എന്ന പേരുമായി സമാനാധികരണമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: עִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരം
  rationale: ഹീബ്രു സമാസബന്ധം നേരെയും സ്വാഭാവികമായും നിലനിർത്തുന്ന, മലയാളത്തിൽ സുതാര്യമായ സ്ഥലനാമപ്രയോഗമാണിത്.
