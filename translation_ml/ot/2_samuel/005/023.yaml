id: 2SA.5.23
reference: 2 Samuel 5:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל דָּוִד֙ בַּֽ/יהוָ֔ה וַ/יֹּ֖אמֶר לֹ֣א תַעֲלֶ֑ה הָסֵב֙ אֶל אַ֣חֲרֵי/הֶ֔ם וּ/בָ֥אתָ לָ/הֶ֖ם מִ/מּ֥וּל בְּכָאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/023.yaml
  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് യഹോവയോടു ചോദിച്ചു. യഹോവ പറഞ്ഞു: “നീ കയറിച്ചെല്ലരുത്; അവരുടെ പിന്നിലൂടെ ചുറ്റിച്ചെന്ന്, ബാൽസം മരങ്ങൾക്ക് എതിർവശത്തുനിന്ന് അവർക്കെതിരെ ചെല്ലുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: യഹോവയോട് അരുളപ്പാട് ചോദിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ശׁאל + ביהוה എന്നത് ഒരു സാധാരണ ചോദ്യം ചോദിക്കുന്നതല്ല, ദൈവിക മാർഗനിർദേശം തേടുന്നതാണ്. ‘അരുളപ്പാട് ചോദിച്ചു’ എന്ന പ്രയോഗം ആ ആശയം സ്വാഭാവികമായും സംക്ഷിപ്തമായും അറിയിക്കുന്നു.
- source_word: לֹא תַעֲלֶה
  choice: നീ നേരെ കയറിച്ചെല്ലരുത്
  rationale: עלה എന്നതിന് അടിസ്ഥാനമായി ‘കയറുക/ചെല്ലുക’ എന്ന അർഥമുണ്ട്; സൈനികസന്ദർഭത്തിൽ മുന്നേറുന്നതിനെയും സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ചുറ്റിപ്പോകാനുള്ള നിർദേശം കണക്കിലെടുത്ത് ‘നേരെ’ എന്നു ചേർത്തത് നിർദേശത്തിന്റെ തന്ത്രപരമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: הָסֵב אֶל אַחֲרֵיהֶם
  choice: അവരുടെ പിന്നിലേക്ക് ചുറ്റിച്ചെന്ന്
  rationale: കല്പന ശത്രുവിന്റെ പിന്നിലേക്കു ചുറ്റിപ്പോകുന്ന സൈനികനീക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികവും ദിശ വ്യക്തവുമാണ്.
- source_word: וּבָאתָ לָהֶם
  choice: അവരെ നേരിടുക
  rationale: בוא + ל എന്നത് ഇവിടെ ശത്രുവിനെതിരെ നീങ്ങുക എന്ന സൈനിക അർഥം വഹിക്കുന്നു. ‘നേരിടുക’ അനാവശ്യ വിശദീകരണമില്ലാതെ ആ പ്രതികൂലസന്ദർഭം നൽകുന്നു.
- source_word: מִמּוּל
  choice: എതിർവശത്തുനിന്ന്
  rationale: നേരെ എതിർവശത്തുള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּכָאִים
  choice: ബക്കാ മരങ്ങൾ
  rationale: സസ്യയിനത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ ഒരു നിർദിഷ്ട ഇനമെന്നു തീർപ്പാക്കാതെ എബ്രായപദത്തിന്റെ ലിപ്യന്തരണം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יהוה
  choice: യഹോവ
  rationale: എബ്രായത്തിലെ ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അത് ഒരു പദവിയായി മാറ്റാതെ നാമരൂപത്തിൽ നിലനിർത്തി. മലയാളവായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ രൂപമാണ് ‘യഹോവ’; ഉച്ചാരണത്തിന്റെ കൃത്യമായ പുനർനിർമാണത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം ഇതിലൂടെ സിദ്ധാന്തപരമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. സൈനികനീക്കത്തിന്റെ ദിശ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും വൃക്ഷയിനത്തെക്കുറിച്ചുള്ള യഥാർഥ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിക്കുകയും ചെയ്തു.
