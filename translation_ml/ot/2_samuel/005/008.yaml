reference: 2 Samuel 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד בַּ/יּ֣וֹם הַ/ה֗וּא כָּל מַכֵּ֤ה יְבֻסִי֙ וְ/יִגַּ֣ע בַּ/צִּנּ֔וֹר וְ/אֶת הַ/פִּסְחִים֙ וְ/אֶת הַ֣/עִוְרִ֔ים שנאו נֶ֣פֶשׁ דָּוִ֑ד עַל כֵּן֙ יֹֽאמְר֔וּ עִוֵּ֣ר וּ/פִסֵּ֔חַ לֹ֥א יָב֖וֹא אֶל הַ/בָּֽיִת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
translation:
  language: ml
  text: 'അന്നു ദാവീദ് പറഞ്ഞു: “യെബൂസ്യരെ ആക്രമിച്ച് ജലമാർഗത്തിൽ[a] എത്തുന്നവൻ, ദാവീദിന്റെ ഉള്ളം വെറുക്കുന്ന മുടന്തരെയും അന്ധരെയും.”[b] അതുകൊണ്ടാണ് ആളുകൾ, “അന്ധരും മുടന്തരും ആ ഭവനത്തിൽ[c] പ്രവേശിക്കുകയില്ല” എന്നു പറയുന്നത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജലച്ചാൽ,’ ‘വെള്ളം ഒഴുകുന്ന കുഴൽ,’ അല്ലെങ്കിൽ ‘തുരങ്കം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദം ഒരു ജലസംവിധാനത്തെയോ ജലകൂപത്തെയോ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഈ ഉപവാക്യത്തിന്റെ ഹീബ്രു വാക്യഘടന ദുഷ്കരമാണ്. ‘മുടന്തരെയും അന്ധരെയും’ എന്ന വാക്കുകൾ ദാവീദിന്റെ വെല്ലുവിളിയുടെ കർമമെന്നതിനുപകരം മുൻവാക്യത്തിലെ യെബൂസ്യരുടെ പരിഹാസത്തിന്റെ ഭാഗമാണെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: ‘വീട്ടിൽ’ അല്ലെങ്കിൽ ‘രാജഭവനത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; സന്ദർഭത്തിൽ ‘ഭവനം’ രാജാവിന്റെ വസതിയെ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  choice: യെബൂസ്യരെ ആക്രമിക്കുന്നവൻ
  rationale: כָּל എന്ന പദവും participle-ഉം ചേർന്ന പ്രയോഗം അനിശ്ചിതമായ വെല്ലുവിളിയെ സൂചിപ്പിക്കുന്നു. gentilic ഏകവചനമായ יְבֻסִי ഇവിടെ സമൂഹവാചകമായതിനാൽ മലയാളത്തിൽ ബഹുവചനമായി നൽകി.
- source_word: וְיִגַּע בַּצִּנּוֹר
  choice: ജലമാർഗത്തിലൂടെ എത്തി
  rationale: נגע ഇവിടെ ‘എത്തുക’ എന്ന സന്ദർഭാർഥത്തിൽ എടുത്തു. צִנּוֹר നഗരത്തിന്റെ ജലസംവിധാനവുമായി ബന്ധപ്പെട്ടിരിക്കാമെങ്കിലും കൃത്യമായ അർഥം അനിശ്ചിതമായതിനാൽ പൊതുവായ ‘ജലമാർഗം’ തിരഞ്ഞെടുത്തു.
- source_word: וְאֶת הַפִּסְחִים וְאֶת הָעִוְרִים
  choice: മുടന്തരെയും അന്ധരെയും
  rationale: വിശേഷണങ്ങളുടെ നാമവാചക ബഹുവചനസ്വഭാവം നേരിട്ട് നിലനിർത്തി. വാക്യഘടനയിലെ ദുഷ്കരത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: שנאו נֶפֶשׁ דָּוִד
  choice: ദാവീദിന്റെ ഉള്ളം വെറുക്കുന്ന
  rationale: נֶפֶשׁ דָּוִד എന്ന തീവ്രമായ ഹീബ്രു പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘ദാവീദിന്റെ ഉള്ളം’ എന്നു നൽകി; വിവാദകരമായ വെറുപ്പിന്റെ പരാമർശം മയപ്പെടുത്തിയില്ല.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: അതുകൊണ്ടാണ് ആളുകൾ ... എന്നു പറയുന്നത്
  rationale: അനിശ്ചിത കർത്താവോടുകൂടിയ ഒരു പ്രചാരവാക്യത്തിന്റെ ഉത്ഭവം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: അന്ധരും മുടന്തരും
  rationale: ഹീബ്രുവിൽ ഏകവചനരൂപങ്ങളാണെങ്കിലും ഇവ പൊതുവായ വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന പഴഞ്ചൊല്ലുസ്വഭാവമുള്ള പ്രയോഗമായതിനാൽ മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: לֹא יָבֹא אֶל הַבָּיִת
  choice: ആ ഭവനത്തിൽ പ്രവേശിക്കുകയില്ല
  rationale: בַּיִת എന്നതിന് ‘വീട്’ എന്നും സന്ദർഭത്തിൽ ‘രാജഭവനം’ എന്നും അർഥമാകാം. രണ്ടും ഉൾക്കൊള്ളാവുന്ന dignified പദമായി ‘ഭവനം’ ഉപയോഗിച്ചു; ‘കൊട്ടാരം’ എന്ന് അതിവ്യക്തമാക്കിയില്ല.
theological_decisions:
- issue: ‘മുടന്തരെയും അന്ധരെയും’ കുറിച്ചുള്ള ദാവീദിന്റെ വെറുപ്പിന്റെ വ്യാഖ്യാനം
  choice: മസോററ്റിക് പാഠത്തിലെ ദുഷ്കരമായ പരാമർശം മയപ്പെടുത്താതെ നിലനിർത്തി.
  alternative: ഈ വാക്കുകൾ മുൻവാക്യത്തിലെ യെബൂസ്യരുടെ പരിഹാസത്തിന്റെ ഭാഗമാണെന്നു വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ ദാവീദിന് വെറുപ്പ് ആരോപിക്കാതിരിക്കാൻ പരാവർത്തനം ചെയ്യുക.
  rationale: ഹീബ്രു വാക്യഘടന ദുഷ്കരവും ഒന്നിലധികം വ്യാഖ്യാനങ്ങൾക്ക് വഴിയൊരുക്കുന്നതുമാണ്. അതിനാൽ പ്രധാനപാഠത്തിൽ MT-യുടെ കടുപ്പം സൂക്ഷിച്ച്, വൈകല്യത്തെക്കുറിച്ചോ ആരാധനാലയപ്രവേശനത്തെക്കുറിച്ചോ ഈ വാക്യത്തിനപ്പുറമുള്ള സിദ്ധാന്തനിഗമനം ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ഹീബ്രുവിലെ അത്യന്തം ചുരുങ്ങിയ വെല്ലുവിളിവാക്യം മലയാളത്തിൽ പൂർത്തിയാക്കാൻ മുൻക്രിയയായ ‘ആക്രമിക്കുക’ സന്ദർഭാനുസൃതമായി ആവർത്തിച്ചു; ഇതുമൂലം ഉണ്ടാകാവുന്ന വ്യാഖ്യാനപരമായ നിർണ്ണയം [b] അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
