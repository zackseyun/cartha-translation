id: 2SA.16.14
reference: 2 Samuel 16:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֥א הַ/מֶּ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ עֲיֵפִ֑ים וַ/יִּנָּפֵ֖שׁ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/014.yaml
  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
translation:
  language: ml
  text: രാജാവും കൂടെയുണ്ടായിരുന്ന സകല ജനവും ക്ഷീണിതരായി എത്തി; അവൻ അവിടെ ഉന്മേഷം വീണ്ടെടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ ക്രിയ ഏകവചനത്തിലാണ്: ‘അവൻ ഉന്മേഷം വീണ്ടെടുത്തു.’ എന്നാൽ രാജാവിനെയും കൂടെയുണ്ടായിരുന്ന ജനത്തെയും കൂട്ടമായി ഉദ്ദേശിച്ച്, ‘അവർ അവിടെ ഉന്മേഷം വീണ്ടെടുത്തു’ എന്നും മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: എത്തി
  rationale: בוא എന്ന ക്രിയയ്ക്ക് ‘വന്നു’ എന്നും അർഥമുണ്ടെങ്കിലും, യാത്രയുടെ ലക്ഷ്യസ്ഥാനത്ത് എത്തിച്ചേരുന്നതാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ആധുനിക മലയാളത്തിൽ ‘എത്തി’ സ്വാഭാവികമാണ്.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: എബ്രായ പാഠം ദാവീദ് എന്ന പേര് ഉപയോഗിക്കാതെ പദവി തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതു നിലനിർത്തുന്നു.
- source_word: וְכָל הָעָם אֲשֶׁר אִּתּוֹ
  choice: കൂടെയുണ്ടായിരുന്ന സകല ജനവും
  rationale: മൂലപാഠത്തിലെ ബന്ധവാക്യം വ്യക്തമായി സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עֲיֵפִים
  choice: ക്ഷീണിതരായി
  rationale: ശാരീരികമായ തളർച്ചയെയും യാത്രാക്ഷീണത്തെയും സൂചിപ്പിക്കുന്ന ബഹുവചന വിശേഷണത്തിന്റെ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: וַיִּנָּפֵשׁ
  choice: അവൻ ... വിശ്രമിച്ച് ഉന്മേഷം വീണ്ടെടുത്തു
  rationale: ക്രിയയുടെ ഏകവചനം നിലനിർത്തുന്നതിനൊപ്പം, ശ്വാസം വീണ്ടെടുത്ത് പുതുക്കപ്പെടുക എന്ന נפשׁ ക്രിയയുടെ ഭാവവും മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: സംഭവം നടന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ സ്ഥലക്രിയാവിശേഷണം.
theological_decisions:
- issue: וַיִּנָּפֵשׁ എന്ന ഏകവചന ക്രിയയുടെ കർത്താവ്
  choice: ‘അവൻ’ എന്നു നൽകി രാജാവിനെ വ്യാകരണപരമായ കർത്താവായി നിലനിർത്തി.
  alternative: മുൻപുള്ള രാജാവിനെയും ജനത്തെയും കൂട്ടമായി ഉദ്ദേശിച്ച് ‘അവർ അവിടെ വിശ്രമിച്ച് ഉന്മേഷം വീണ്ടെടുത്തു’ എന്നു വായിക്കാം.
  rationale: എബ്രായ ക്രിയ വ്യക്തമായി ഏകവചനമാണ്; എന്നാൽ കൂട്ടത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനമായി ചിലർ മനസ്സിലാക്കുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു. ഇതിൽ പ്രത്യേക ദൈവശാസ്ത്രനിലപാട് അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വിശ്രമിച്ച് ഉന്മേഷം വീണ്ടെടുത്തു’ എന്ന പ്രയോഗം വെറും വിശ്രമത്തേക്കാൾ വിശാലമായ, ക്ഷീണത്തിൽനിന്നുള്ള പുതുക്കലിന്റെ മൂലപാഠഭാവം നൽകുന്നു; ഏകവചനത്തിലെ യഥാർഥ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
