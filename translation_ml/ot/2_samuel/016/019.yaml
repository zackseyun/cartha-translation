base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/019.yaml
  text: And secondly[a], whom should I serve? Should it not be before his son? As I served before your father, so I will be before you.
translation:
  language: ml
  text: രണ്ടാമതായി, ഞാൻ ആരെ സേവിക്കണം? അവന്റെ മകന്റെ സന്നിധിയിലല്ലയോ?[a] അങ്ങയുടെ പിതാവിന്റെ സന്നിധിയിൽ ഞാൻ സേവിച്ചതുപോലെ, അങ്ങയുടെ സന്നിധിയിലും ഞാൻ ഉണ്ടായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ മകന്റെ സന്നിധിയിൽ … അങ്ങയുടെ പിതാവിന്റെ സന്നിധിയിൽ … അങ്ങയുടെ സന്നിധിയിൽ’ എന്നാണ് എബ്രായപാഠത്തിന്റെ അക്ഷരാർഥം. ഒരു രാജാവിന്റെ സന്നിധിയിലോ അദ്ദേഹത്തിന്റെ കീഴിലോ സേവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന രാജസദസ്സിലെ പ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  choice: രണ്ടാമതായി
  rationale: ഹൂശായി തന്റെ രണ്ടാമത്തെ വാദം അവതരിപ്പിക്കുന്ന വ്യവഹാരസൂചകമായി ഈ പ്രയോഗം പ്രവർത്തിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘രണ്ടാമതായി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְמִי אֲנִי אֶעֱבֹד
  choice: ഞാൻ ആരെ സേവിക്കണം?
  rationale: രാജസദസ്സിലെ വിശ്വസ്തസേവനത്തെയാണ് עבד ഇവിടെ സൂചിപ്പിക്കുന്നത്. പ്രതീക്ഷിത ഉത്തരമുള്ള ചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം നിലനിർത്തുന്നു.
- source_word: הֲלוֹא לִפְנֵי בְנוֹ
  choice: അവന്റെ മകന്റെ സന്നിധിയിലല്ലയോ?
  rationale: הֲלוֹא പ്രതീക്ഷിതമായ സമ്മതോത്തരത്തെ സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന לִפְנֵי എന്ന രാജസദസ്സുസംബന്ധിയായ പ്രയോഗം ഒഴിവാക്കാതെ ‘സന്നിധിയിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כַּאֲשֶׁר עָבַדְתִּי לִפְנֵי אָבִיךָ
  choice: അങ്ങയുടെ പിതാവിന്റെ സന്നിധിയിൽ ഞാൻ സേവിച്ചതുപോലെ
  rationale: അബ്ശാലോമിനോടുള്ള നേരിട്ടുള്ള ആദരപൂർവ അഭിസംബോധനയും സദസ്സിൽ സേവിക്കുന്നതെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  choice: അങ്ങയുടെ സന്നിധിയിലും ഞാൻ ഉണ്ടായിരിക്കും
  rationale: മൂലഭാഷ ഇവിടെ עבד വീണ്ടും ഉപയോഗിക്കാതെ היה (‘ആയിരിക്കുക’) ഉപയോഗിക്കുന്നതിനാൽ ‘സേവിക്കും’ എന്നു പൂരിപ്പിക്കാതെ ക്രിയാമാറ്റവും സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു.
