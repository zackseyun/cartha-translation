translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. രാജസദസ്സിലെ ആദരപൂർവ അഭിസംബോധനയ്ക്കായി ‘അങ്ങ്’ സ്വീകരിച്ചു; ‘അവന്റെ മകൻ’ എന്ന മൂന്നാംപുരുഷത്തിൽനിന്ന് ‘അങ്ങയുടെ പിതാവ്/അങ്ങ്’ എന്ന രണ്ടാംപുരുഷത്തിലേക്കുള്ള മൂലപാഠത്തിലെ മാറ്റം നിലനിർത്തി.
