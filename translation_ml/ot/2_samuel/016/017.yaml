id: 2SA.16.17
reference: 2 Samuel 16:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ אֶל חוּשַׁ֔י זֶ֥ה חַסְדְּ/ךָ֖ אֶת רֵעֶ֑/ךָ לָ֥/מָּה לֹֽא הָלַ֖כְתָּ אֶת רֵעֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/017.yaml
  text: Absalom said to Hushai[a], “Is this your loyalty to your friend? Why did you not go with your friend?”
translation:
  language: ml
  text: 'അബ്ശാലോം ഹൂശായിയോടു പറഞ്ഞു: “നിന്റെ സുഹൃത്തിനോടുള്ള വിശ്വസ്തത ഇതാണോ? നീ നിന്റെ സുഹൃത്തിനോടൊപ്പം പോകാതിരുന്നത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: നിന്റെ വിശ്വസ്തത
  rationale: חֶסֶד എന്ന പദത്തിന് ദയ, അചഞ്ചലസ്നേഹം, വിശ്വസ്തത എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ ദാവീദിനോടുള്ള ഹൂശായിയുടെ കൂറിനെ അബ്ശാലോം ചോദ്യം ചെയ്യുന്നതിനാൽ ‘വിശ്വസ്തത’ രാഷ്ട്രീയവും ബന്ധപരവുമായ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: רֵעֶךָ
  choice: നിന്റെ സുഹൃത്ത്
  rationale: רֵעַ എന്നത് സുഹൃത്ത്, കൂട്ടുകാരൻ, സഹചാരി എന്നിവയെ സൂചിപ്പിക്കാം. ഇവിടെ ദാവീദിനെ പരാമർശിക്കുന്ന ആവർത്തിത പ്രയോഗത്തിന് ‘സുഹൃത്ത്’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  choice: നീ നിന്റെ സുഹൃത്തിനോടൊപ്പം പോകാതിരുന്നത് എന്തുകൊണ്ട്?
  rationale: הלך എന്ന ക്രിയയോടുകൂടിയ אֶת ഇവിടെ ഒരാളോടൊപ്പം പോകുക എന്ന ആശയമാണ് നൽകുന്നത്. ലളിതമായ എബ്രായ പ്രയോഗവും കുറ്റപ്പെടുത്തുന്ന ചോദ്യഭാവവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: זֶה חַסְדְּךָ אֶת רֵעֶךָ
  choice: നിന്റെ സുഹൃത്തിനോടുള്ള വിശ്വസ്തത ഇതാണോ?
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിത വാക്യം സന്ദർഭത്തിൽ അവിശ്വാസം പ്രകടിപ്പിക്കുന്ന അലങ്കാരചോദ്യമാണ്. മലയാളത്തിൽ ‘ഇതാണോ?’ എന്നു ചേർക്കുന്നത് അതിന്റെ സ്വാഭാവിക ചോദ്യരൂപം വ്യക്തമാക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഉദ്ധരണി ചോദ്യങ്ങളായിരുന്നാലും ഇത് സാധാരണ ആഖ്യാനക്രിയയായ ‘പറഞ്ഞു’ എന്നാണ്; ‘ചോദിച്ചു’ എന്നു വ്യാഖ്യാനപരമായി മാറ്റേണ്ടതില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വിശ്വസ്തത’ എന്നത് സന്ദർഭത്തിലെ കൂറിന്റെ അർഥം നൽകുന്നു; ദൈവശാസ്ത്രപരമായ ഉടമ്പടി-ഭാഷ അനാവശ്യമായി ചേർത്തിട്ടില്ല.
