id: 2SA.16.22
reference: 2 Samuel 16:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּטּ֧וּ לְ/אַבְשָׁל֛וֹם הָ/אֹ֖הֶל עַל הַ/גָּ֑ג וַ/יָּבֹ֤א אַבְשָׁלוֹם֙ אֶל פִּֽלַגְשֵׁ֣י אָבִ֔י/ו לְ/עֵינֵ֖י כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
translation:
  language: ml
  text: അങ്ങനെ അവർ അബ്ശാലോമിനുവേണ്ടി മേൽക്കൂരയിൽ കൂടാരം കെട്ടി. അബ്ശാലോം സകല ഇസ്രായേലും കാൺകെ[a] തന്റെ അപ്പന്റെ വെപ്പാട്ടികളുടെ അടുക്കൽ ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സകല ഇസ്രായേലിന്റെയും മുമ്പാകെ” അല്ലെങ്കിൽ “സകല ഇസ്രായേലിന്റെയും കൺമുമ്പിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּטּוּ
  choice: കൂടാരം കെട്ടി
  rationale: נטה എന്ന ക്രിയയ്ക്ക് ഇവിടെ കൂടാരം നിവർത്തി സ്ഥാപിക്കുക എന്ന അർഥമാണ്. ‘കൂടാരം കെട്ടി’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: הָאֹהֶל
  choice: കൂടാരം
  rationale: എബ്രായത്തിൽ നാമം നിർദിഷ്ടമാണെങ്കിലും, മലയാളത്തിൽ ഈ സന്ദർഭത്തിൽ നിർദിഷ്ടത പ്രത്യേക സൂചകപദമില്ലാതെയും സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: עַל הַגָּג
  choice: മേൽക്കൂരയിൽ
  rationale: പുരാതന വീടിന്റെ പരന്ന മേൽക്കൂരയിലുള്ള സ്ഥാനം നേരിട്ട് സൂചിപ്പിക്കുകയും പ്രവൃത്തിയുടെ പരസ്യസ്വഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיָּבֹא ... אֶל
  choice: അടുക്കൽ ചെന്നു
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലീപ്രയോഗത്തിന്റെ മാന്യമായ പരോക്ഷത നിലനിർത്തുന്നു; വെറും സ്ഥലമാറ്റമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സന്ദർഭം മതിയായ സൂചന നൽകുന്നു.
- source_word: פִּלַגְשֵׁי אָבִיו
  choice: തന്റെ അപ്പന്റെ വെപ്പാട്ടികൾ
  rationale: കുടുംബബന്ധവും രാജകീയ പശ്ചാത്തലവും നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: സകല ഇസ്രായേലും കാൺകെ
  rationale: അക്ഷരാർഥമായ ‘എല്ലാ ഇസ്രായേലിന്റെയും കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന ആശയം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; പ്രവൃത്തിയുടെ പരസ്യവും സാക്ഷ്യപ്പെട്ടതുമായ സ്വഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: രാജാധികാരം കവർന്നെടുക്കുന്ന ധാർമ്മികമായി ഗുരുതരമായ സന്ദർഭത്തിലെ ലൈംഗിക ശൈലീപ്രയോഗം
  choice: ‘തന്റെ അപ്പന്റെ വെപ്പാട്ടികളുടെ അടുക്കൽ ചെന്നു’ എന്ന പരോക്ഷപ്രയോഗം നിലനിർത്തി.
  alternative: ‘അവരുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടു’ അല്ലെങ്കിൽ ‘അവരോടൊപ്പം ശയിച്ചു.’
  rationale: മൂലപാഠത്തിലെ പരോക്ഷതയും ഗൗരവവും നിലനിർത്തിക്കൊണ്ട് സംഭവത്തിന്റെ അർഥം സന്ദർഭത്തിലൂടെ വ്യക്തമാക്കുന്നു; കൂടുതൽ തുറന്ന ആധുനിക പദപ്രയോഗം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അപ്പൻ,’ ‘വെപ്പാട്ടി,’ ‘അടുക്കൽ ചെന്നു’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിലെ കുടുംബബന്ധവും രാജകീയ പശ്ചാത്തലവും ലൈംഗിക പരോക്ഷപ്രയോഗവും നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന പ്രയോഗത്തോടു ചേർന്നാണ് [a] നൽകിയിരിക്കുന്നത്.
