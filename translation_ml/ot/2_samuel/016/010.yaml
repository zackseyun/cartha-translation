id: 2SA.16.10
reference: 2 Samuel 16:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַה לִּ֥/י וְ/לָ/כֶ֖ם בְּנֵ֣י צְרֻיָ֑ה כי יְקַלֵּ֗ל ו/כי יְהוָה֙ אָ֤מַר ל/וֹ֙ קַלֵּ֣ל אֶת דָּוִ֔ד וּ/מִ֣י יֹאמַ֔ר מַדּ֖וּעַ עָשִׂ֥יתָה כֵּֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
translation:
  language: ml
  text: 'എന്നാൽ രാജാവ് പറഞ്ഞു: “സെരൂയയുടെ പുത്രന്മാരേ, നിങ്ങളുമായി എനിക്ക് എന്തു കാര്യം? യഹോവ അവനോട്, ‘ദാവീദിനെ ശപിക്കൂ’ എന്നു പറഞ്ഞതുകൊണ്ടാണ് അവൻ ശപിക്കുന്നതെങ്കിൽ,[a] ‘നീ എന്തിന് ഇങ്ങനെ ചെയ്തു?’ എന്ന് ആർക്കാണ് പറയാനാകുക?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കാരണം, യഹോവ അവനോട്, ‘ദാവീദിനെ ശപിക്കൂ’ എന്നു പറഞ്ഞതുകൊണ്ട് അവൻ ശപിക്കുകയാണ്.” എബ്രായത്തിലെ കണങ്ങളെ വ്യവസ്ഥാപരമായതിനേക്കാൾ വിശദീകരണാത്മകമായി ഗ്രഹിക്കാനും കഴിയും.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: എനിക്കും നിങ്ങൾക്കും തമ്മിൽ എന്ത് കാര്യം?
  rationale: അക്ഷരാർഥത്തിലുള്ള ഉടമസ്ഥതയെക്കുറിച്ചുള്ള ചോദ്യമല്ല, മറിച്ച് അകലം പാലിക്കുന്ന ശാസനയാണ് ഈ എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അതിന്റെ പ്രയോഗശക്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי צְרֻיָה
  choice: സെരൂയയുടെ പുത്രന്മാരേ
  rationale: യോവാബിനെയും അബീശായിയെയും അവരുടെ അമ്മയുടെ പേരിൽ അഭിസംബോധന ചെയ്യുന്ന നിർമാണപ്രയോഗം; മലയാളത്തിലെ സ്ഥാപിതമായ നാമരൂപവും സംബോധനയും ഉപയോഗിച്ചു.
- source_word: יְקַלֵּל / קַלֵּל
  choice: ശപിക്കുന്നതെങ്കിൽ / ശപിക്കൂ
  rationale: പരിമിതക്രിയയിലും ഉദ്ധരിച്ച കല്പനയിലും ഒരേ ധാതുവിന്റെ ബന്ധം നിലനിർത്തുകയും ദാവീദിനെതിരായ ശാപവാക്കുകളുടെ അർഥം നേരിട്ട് പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי ... וְכִי
  choice: '... പറഞ്ഞതുകൊണ്ടാണ് ... എങ്കിൽ'
  rationale: കണങ്ങളുടെ സങ്കീർണമായ ബന്ധം വ്യവസ്ഥാപരമായി ഗ്രഹിച്ച്, യഹോവയുടെ വാക്ക് ഇപ്പോഴത്തെ ശപിക്കലിന്റെ കാരണമാകാമെന്ന ദാവീദിന്റെ വാദം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; വിശദീകരണാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אָמַר לוֹ
  choice: അവനോട് ... പറഞ്ഞതുകൊണ്ടാണ്
  rationale: മുൻപ് പറഞ്ഞ ദൈവിക വാക്കും ഇപ്പോഴത്തെ പ്രവൃത്തിയും തമ്മിലുള്ള കാരണബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּמִי יֹאמַר
  choice: ആർക്ക് ചോദിക്കാനാകും?
  rationale: വെറും ഭാവികാലസൂചനയല്ല, അങ്ങനെ ചോദ്യംചെയ്യാൻ ആർക്കാണ് അധികാരമോ സ്ഥാനമോ ഉള്ളത് എന്ന വാചാടോപചോദ്യത്തിന്റെ ശക്തി നൽകുന്നു.
- source_word: מַדּוּעַ עָשִׂיתָה כֵּן
  choice: നീ എന്തിന് ഇങ്ങനെ ചെയ്തു?
  rationale: മൂലത്തിലെ നേരിട്ടുള്ള വാചാടോപചോദ്യത്തെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിമെയിയുടെ ശാപവാക്കുകളിൽ ദൈവത്തിന്റെ പങ്ക്
  choice: യഹോവ ശപിക്കാൻ പറഞ്ഞിരിക്കാമെന്ന വ്യവസ്ഥാപരമായ വായന നിലനിർത്തി.
  alternative: ‘യഹോവ അവനോട് പറഞ്ഞതുകൊണ്ടാണ് അവൻ ശപിക്കുന്നത്’ എന്ന വിശദീകരണാത്മകവും കൂടുതൽ നിശ്ചിതവുമായ വായന.
  rationale: ദൈവിക നിർദേശം, അനുമതി, ധാർമിക അംഗീകാരം എന്നിവ തമ്മിലുള്ള ബന്ധം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല. യഹോവ തന്നോട് പറഞ്ഞുവെന്ന ദാവീദിന്റെ കടുത്ത പ്രസ്താവനയും അതിന്റെ വാചാടോപപരമായ ചട്ടക്കൂടും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. രാജാവിന്റെ ശാസനയുടെ മൂർച്ചയും വാചാടോപചോദ്യവും നിലനിർത്തിയിട്ടുണ്ട്; അപൂർവമായ ശബ്ദാനുകരണം ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു.
