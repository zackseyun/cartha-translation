  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ וְ/אַיֵּ֖ה בֶּן אֲדֹנֶ֑י/ךָ וַ/יֹּ֨אמֶר צִיבָ֜א אֶל הַ/מֶּ֗לֶךְ הִנֵּה֙ יוֹשֵׁ֣ב בִּ/ירוּשָׁלִַ֔ם כִּ֣י אָמַ֔ר הַ/יּ֗וֹם יָשִׁ֤יבוּ לִ/י֙ בֵּ֣ית יִשְׂרָאֵ֔ל אֵ֖ת מַמְלְכ֥וּת אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് പറഞ്ഞു: “നിന്റെ യജമാനന്റെ മകൻ എവിടെയാണ്?” സീബാ രാജാവിനോടു പറഞ്ഞു: “ഇതാ, അവൻ യെരൂശലേമിൽ താമസിക്കുകയാണ്[a], കാരണം, ‘ഇന്ന് ഇസ്രായേൽഗൃഹം എന്റെ പിതാവിന്റെ രാജ്യം എനിക്കു തിരികെ നൽകും’ എന്ന് അവൻ പറഞ്ഞു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെരൂശലേമിൽത്തന്നെ തുടരുകയാണ്.’ ഹീബ്രുവിലെ കർത്തൃവാചക വർത്തമാനരൂപം അക്ഷരാർഥത്തിലുള്ള ഇരിപ്പിനെ മാത്രമല്ല, ഒരു സ്ഥലത്ത് തുടർന്നുള്ള താമസത്തെയോ അവിടെത്തന്നെ നിൽക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: അപ്പോൾ രാജാവ് പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ക്രമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ചോദ്യം പിന്നാലെയുണ്ടെങ്കിലും, മൂലത്തിലെ സാധാരണ വാക്കായ ‘പറഞ്ഞു’ നിലനിർത്തുന്നു.
- source_word: וְאַיֵּה בֶּן אֲדֹנֶיךָ
  choice: നിന്റെ യജമാനന്റെ മകൻ എവിടെയാണ്?
  rationale: സ്ഥലത്തെക്കുറിച്ചുള്ള ചോദ്യം വ്യക്തമായി നൽകുന്നു. ഇവിടെ אֲדֹנֶיךָ ദൈവിക അഭിസംബോധനയല്ല; സീബായുടെ യജമാനനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: മറുപടിയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരകണത്തിന്റെ പ്രഭാവം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יוֹשֵׁב
  choice: താമസിക്കുകയാണ്
  rationale: ישׁב എന്ന ക്രിയയുടെ കർത്തൃവാചക വർത്തമാനരൂപം ഇവിടെ അക്ഷരാർഥത്തിൽ ‘ഇരിക്കുന്നു’ എന്നതിലുപരി ഒരു സ്ഥലത്ത് താമസിക്കുകയോ അവിടെത്തന്നെ തുടരുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי אָמַר
  choice: കാരണം, … എന്ന് അവൻ പറഞ്ഞിരിക്കുന്നു
  rationale: സീബാ നൽകിയ കാരണവും അതിനുള്ളിൽ വരുന്ന ഉദ്ധരിച്ച വാക്കുകളും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: יָשִׁיבוּ לִי
  choice: എനിക്കു തിരികെ നൽകും
  rationale: שׁוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘തിരികെ വരുത്തുക/പുനഃസ്ഥാപിക്കുക’ എന്നാണ്; രാജ്യം വസ്തുവായതിനാൽ ‘തിരികെ നൽകും’ സ്വാഭാവികമാണ്.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹം
  rationale: ഹീബ്രുവിലെ സമൂഹ-ദേശീയ പ്രയോഗമായ ‘ഇസ്രായേലിന്റെ ഗൃഹം’ ചുരുക്കി ‘ഇസ്രായേൽ’ എന്ന് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: מַמְלְכוּת אָבִי
  choice: എന്റെ പിതാവിന്റെ രാജ്യം
  rationale: മൂലത്തിലെ ബന്ധപ്രയോഗം അടുത്തായി സംരക്ഷിക്കുന്നു; ‘രാജ്യം’ ഇവിടെ രാജാധികാരവും ഭരണരാജ്യവും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദമാണ്.
theological_decisions:
- issue: മെഫീബോശെത്തിന്റെ ഉദ്ദേശ്യത്തെക്കുറിച്ചുള്ള സീബായുടെ റിപ്പോർട്ട്
  choice: സീബായുടെ ആരോപണം മൂലപാഠത്തിലുള്ളതുപോലെ നേരിട്ടുള്ള റിപ്പോർട്ടായി പരിഭാഷപ്പെടുത്തി; അതിന്റെ സത്യാവസ്ഥ വിവർത്തനം സ്ഥിരീകരിക്കുന്നില്ല.
  alternative: ‘അവൻ അവകാശപ്പെട്ടു’ അല്ലെങ്കിൽ ‘അവൻ അങ്ങനെ പറഞ്ഞതായി സീബാ ആരോപിച്ചു’ എന്നിങ്ങനെ സംശയം പ്രകടമാക്കുക.
  rationale: ഈ വാക്യം സീബാ പറഞ്ഞത് മാത്രം രേഖപ്പെടുത്തുന്നു. പിന്നീട് വരുന്ന ആഖ്യാനത്തിന്റെ അടിസ്ഥാനത്തിൽ ഇവിടെ സംശയസൂചന ചേർക്കുന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനവിധി ഇറക്കുമതി ചെയ്യുന്നതായിരിക്കും.
- issue: מַמְלְכוּת എന്ന പദത്തിലെ രാജ്യം/രാജാധികാരം എന്ന അർഥവ്യാപ്തി
  choice: ‘രാജ്യം’ എന്ന് നൽകി അർഥവ്യാപ്തി തുറന്നുവച്ചു.
  alternative: ‘രാജാധികാരം’ എന്ന് നൽകി ഭരണാവകാശത്തെ മാത്രം മുൻനിറുത്തുക.
  rationale: സന്ദർഭത്തിൽ രാജാധികാരം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, ‘രാജ്യം’ ഭരണവും രാജകീയ അവകാശവും ഒരുമിച്ച് സൂചിപ്പിക്കാൻ കഴിയും; അതിനാൽ മൂലത്തിലെ അർഥസാന്ദ്രത അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ഇതാ’, ‘യജമാനൻ’, ‘ഇസ്രായേൽഗൃഹം’ തുടങ്ങിയ ബൈബിൾപരിസരത്തിന് യോജിച്ച പദങ്ങൾ നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. ഉദ്ധരണിക്കുള്ളിലെ ഉദ്ധരണി വ്യക്തമായി അടയാളപ്പെടുത്തി.
