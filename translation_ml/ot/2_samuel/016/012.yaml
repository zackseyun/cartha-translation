lexical_decisions:
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: ദാവീദിന്റെ പ്രത്യാശയോടുകൂടിയ അനിശ്ചിതത്വം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יִרְאֶה
  choice: കാണുകയും
  rationale: ראה എന്ന ക്രിയയുടെ ദൃശ്യരൂപകം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ കഷ്ടത ശ്രദ്ധയിൽ എടുക്കുക എന്ന അർഥവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: ב/עונ/י
  choice: എന്റെ കഷ്ടത
  rationale: വായനാപാരമ്പര്യവും ഉടൻമുമ്പുള്ള സന്ദർഭവും ദാവീദിന്റെ ഇപ്പോഴത്തെ ദുരിതത്തെ സൂചിപ്പിക്കുന്നു; എഴുത്തുരൂപം സൂചിപ്പിക്കാവുന്ന മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהֵשִׁיב ... לִי טוֹבָה
  choice: എനിക്കു നന്മ നൽകുകയും ചെയ്യും
  rationale: ശാപത്തിനു പകരമായി ദാവീദിന് ലഭിക്കുന്ന നന്മ എന്ന പ്രതിഫലാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: תַּחַת
  choice: പകരം
  rationale: മാറ്റിവെക്കൽ അഥവാ പ്രത്യുപകാരം എന്ന ബന്ധം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: קִלְלָתוֹ
  choice: അവന്റെ ശാപവാക്കുകൾ
  rationale: ശിമെയിയുടെ തുടരുന്ന നിന്ദാഭാഷണത്തെ ഒരു നിശ്ചലമായ ‘ശാപം’ എന്നതിലുപരി സംസാരപ്രവൃത്തിയായി വ്യക്തമാക്കുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്നത്തെ
  rationale: ആ ദിവസം നടന്നുകൊണ്ടിരിക്കുന്ന ശാപപ്രവൃത്തിയോടുള്ള കാലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു.
theological_decisions:
- issue: ב/עונ/י എന്നതിലെ കെതീബ്–കെരേ വ്യത്യാസം
  choice: എന്റെ കഷ്ടത
  alternative: എന്റെ അകൃത്യം
  rationale: സന്ദർഭവും പരമ്പരാഗത വായനയും ദാവീദിന്റെ അപമാനവും ദുരിതവും മുൻനിർത്തുന്നു. എന്നാൽ വ്യഞ്ജനാക്ഷരങ്ങളിലുള്ള എഴുത്തുരൂപം ‘എന്റെ അകൃത്യം’ എന്നു മനസ്സിലാക്കാൻ ഇടയുള്ളതിനാൽ ആ പാഠസാക്ഷ്യം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവർത്തനം. ‘ഒരുപക്ഷേ’ ദാവീദിന്റെ അനിശ്ചിത പ്രത്യാശ നിലനിർത്തുന്നു; ‘യഹ്‌വേ’ ദൈവനാമമായി ഉപയോഗിക്കുന്നു. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
