translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ആവർത്തിത ‘പുറത്തുവരൽ’ അനാവശ്യമായി മിനുക്കിക്കളയാതെ നിലനിർത്തി; അതിന്റെ ദൈർഘ്യ/ആവർത്തന ദ്വയാർഥത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു. സ്ഥലപ്പേരുകളും വ്യക്തിനാമങ്ങളും മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകി.
