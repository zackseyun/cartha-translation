base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
translation:
  language: ml
  text: രാജാവായ ദാവീദ് ബഹൂരീമിൽ എത്തിയപ്പോൾ, അതാ, ശൗലിന്റെ ഭവനത്തിലെ ഒരു കുലത്തിൽനിന്ന് ഒരാൾ അവിടെനിന്ന് പുറത്തുവന്നു. ഗേരയുടെ മകനായ ശിമെയി എന്നായിരുന്നു അവന്റെ പേര്. അവൻ ശപിച്ചുകൊണ്ട് പുറത്തേക്കു വന്നുകൊണ്ടേയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ വീണ്ടും വീണ്ടും പുറത്തുവന്ന് ശപിച്ചുകൊണ്ടിരുന്നു.’ ‘പുറത്തുവരുക’ എന്ന ക്രിയയെ ഹീബ്രു തീവ്രമാക്കുന്നു (കൃതന്തം + ക്രിയാനാമത്തിന്റെ ഊന്നൽരൂപം); ഇത് ആവർത്തിച്ചോ തുടർച്ചയായോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַמֶּלֶךְ דָּוִד עַד בַּחוּרִים
  choice: ദാവീദ് രാജാവ് ബഹൂരീമിൽ എത്തിയപ്പോൾ
  rationale: വാവ് ചേർന്ന സമാപ്തക്രിയ ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുകയും തുടർന്നുള്ള സംഭവത്തിന് സമയപശ്ചാത്തലം ഒരുക്കുകയും ചെയ്യുന്നു. עַד ഇവിടെ ലക്ഷ്യസ്ഥാനത്ത് എത്തിച്ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ബഹൂരീമിൽ എത്തിയപ്പോൾ’ എന്നു നൽകി.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്ന് ശ്രദ്ധയിൽപ്പെടുന്ന പുതിയ സംഭവവികാസത്തെ സജീവമായി അവതരിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യവും ആഖ്യാനപരവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: מִשָּׁם אִישׁ יוֹצֵא
  choice: ഒരാൾ അവിടെനിന്ന് പുറത്തുവന്നു
  rationale: יוֹצֵא എന്ന കൃതന്തം രംഗത്തിൽ നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാമെങ്കിലും, മലയാള ആഖ്യാനത്തിൽ ലളിതമായ ഭൂതകാലപ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  choice: ശൗലിന്റെ ഗൃഹത്തിലെ ഒരു കുലത്തിൽപ്പെട്ട
  rationale: מִשְׁפָּחָה എന്നത് വിശാലമായ ബന്ധുഗണമോ കുലമോ സൂചിപ്പിക്കുന്നു; בֵּית എന്നതിന്റെ കുടുംബ-രാജവംശ ആശയം ‘ഗൃഹം’ നിലനിർത്തുന്നു.
- source_word: וּשְׁמוֹ שִׁמְעִי בֶן גֵּרָא
  choice: ഗേരയുടെ മകനായ ശിമെയി എന്നായിരുന്നു അവന്റെ പേര്
  rationale: തിരിച്ചറിയൽസൂത്രത്തിന്റെ മുഴുവൻ വിവരവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിൽ നൽകുന്നു.
- source_word: יֹצֵא יָצוֹא
  choice: പുറത്തേക്കു വന്നുകൊണ്ടേയിരുന്നു
  rationale: കൃതന്തത്തോടൊപ്പം infinitive absolute ആവർത്തിക്കുന്നത് പ്രവൃത്തിയുടെ ദൈർഘ്യമോ ആവർത്തനമോ ഊന്നിപ്പറയുന്നു. ‘വന്നുകൊണ്ടേയിരുന്നു’ ഈ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וּמְקַלֵּל
  choice: ശപിച്ചുകൊണ്ട്
  rationale: ഈ കൃതന്തം പുറത്തുവരുന്ന പ്രവൃത്തിയോടൊപ്പം തുടരുന്ന ശാപവാക്കുകളെ സൂചിപ്പിക്കുന്നു; ‘ശപിച്ചുകൊണ്ട്’ രണ്ടിന്റെയും സമകാലികത വ്യക്തമാക്കുന്നു.
