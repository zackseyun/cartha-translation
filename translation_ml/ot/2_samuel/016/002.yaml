source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר הַ/מֶּ֛לֶךְ אֶל צִיבָ֖א מָה אֵ֣לֶּה לָּ֑/ךְ וַ/יֹּ֣אמֶר צִ֠יבָא הַ/חֲמוֹרִ֨ים לְ/בֵית הַ/מֶּ֜לֶךְ לִ/רְכֹּ֗ב ו/ל/ה/לחם וְ/הַ/קַּ֨יִץ֙ לֶ/אֱכ֣וֹל הַ/נְּעָרִ֔ים וְ/הַ/יַּ֕יִן לִ/שְׁתּ֥וֹת הַ/יָּעֵ֖ף בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് സീബയോട്, “ഇവയെല്ലാം എന്തിനാണ്?”[a] എന്നു ചോദിച്ചു. സീബ പറഞ്ഞു: “കഴുതകൾ രാജാവിന്റെ വീട്ടുകാർക്ക് കഴുതപ്പുറത്തു സഞ്ചരിക്കാനും, അപ്പവും വേനൽക്കാല ഫലങ്ങളും[b] യുവാക്കൾക്ക്[c] കഴിക്കാനും, വീഞ്ഞ് വിജനപ്രദേശത്ത് ക്ഷീണിതർക്കു കുടിക്കാനുമുള്ളതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവകൊണ്ട് നീ എന്താണ് ഉദ്ദേശിക്കുന്നത്?” എബ്രായ ശൈലി അക്ഷരാർഥത്തിൽ, “ഇവ നിനക്ക് എന്ത്?” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വേനൽക്കാല വിളവ്.” എബ്രായപദം വേനൽക്കാലത്ത് ശേഖരിക്കുന്ന ഫലങ്ങളെയോ മറ്റു വിളവിനങ്ങളെയോ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “പരിചാരകർ” അല്ലെങ്കിൽ “സേവകർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  choice: ഇവയെല്ലാം എന്തിനാണ്?
  rationale: ‘ഇവ നിനക്ക് എന്ത്?’ എന്ന എബ്രായ ശൈലി സന്ദർഭത്തിൽ കൊണ്ടുവന്ന സാധനങ്ങളുടെ ഉദ്ദേശ്യം ചോദിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം നൽകുമ്പോഴും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַחֲמוֹרִים
  choice: കഴുതകൾ
  rationale: മൃഗത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും സമകാലികവുമായ മലയാളപദം.
- source_word: לְבֵית הַמֶּלֶךְ
  choice: രാജാവിന്റെ വീട്ടുകാർക്ക്
  rationale: בַּיִת ഇവിടെ കെട്ടിടത്തെയല്ല, രാജാവിനോടൊപ്പമുള്ള കുടുംബത്തെയും ഗൃഹസംഘത്തെയും സൂചിപ്പിക്കുന്നു. ‘വീട്ടുകാർ’ ഈ കൂട്ടായ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: לִרְכֹּב
  choice: കയറിപ്പോകാനും
  rationale: കഴുതപ്പുറത്ത് സഞ്ചരിക്കുക എന്ന ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַלֶּחֶם
  choice: അപ്പം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; പിന്നാലെ മറ്റു ഭക്ഷ്യവസ്തുക്കൾ പ്രത്യേകം പറയുന്നതിനാൽ പൊതുവായ ‘ഭക്ഷണം’ എന്നു മാറ്റുന്നില്ല.
- source_word: הַקַּיִץ
  choice: വേനൽക്കാല ഫലങ്ങൾ
  rationale: വേനലിൽ ശേഖരിക്കുന്ന ഫലങ്ങളെയോ വിളവിനെയോ പൊതുവായി സൂചിപ്പിക്കാവുന്ന പദമാണിത്. ഏത് ഫലമെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പ്രത്യേക ഫലം ചേർക്കുന്നില്ല.
- source_word: הַנְּעָרִים
  choice: യുവാക്കൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പരിചാരകരെയോ സേവകരെയോ സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הַיָּעֵף
  choice: ക്ഷീണിതനായവന്
  rationale: എബ്രായത്തിലെ ഏകവചന വിശേഷണം പൊതുവായ അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു. മലയാളത്തിലെ പൊതുവാചക ഏകവചനം ആ രൂപവും അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: בַּמִּדְבָּר
  choice: വിജനപ്രദേശത്ത്
  rationale: מִדְבָּר എന്നത് മണൽമരുഭൂമി മാത്രമല്ല, ജനവാസം കുറഞ്ഞ വന്യപ്രദേശത്തെയും സൂചിപ്പിക്കാം. ‘വിജനപ്രദേശം’ ഈ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
