translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പട്ടികയുടെ സമാന്തരഘടനയും എബ്രായത്തിലെ പൊതുവാചക ഏകവചനവും പരമാവധി നിലനിർത്തി; സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
