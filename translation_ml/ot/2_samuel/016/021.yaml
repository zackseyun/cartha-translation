reference: 2 Samuel 16:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲחִיתֹ֨פֶל֙ אֶל אַבְשָׁלֹ֔ם בּ֚וֹא אֶל פִּלַגְשֵׁ֣י אָבִ֔י/ךָ אֲשֶׁ֥ר הִנִּ֖יחַ לִ/שְׁמ֣וֹר הַ/בָּ֑יִת וְ/שָׁמַ֤ע כָּל יִשְׂרָאֵל֙ כִּֽי נִבְאַ֣שְׁתָּ אֶת אָבִ֔י/ךָ וְ/חָ֣זְק֔וּ יְדֵ֖י כָּל אֲשֶׁ֥ר אִתָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
translation:
  language: ml
  text: 'അഹീഥോഫെൽ അബ്ശാലോമിനോടു പറഞ്ഞു: “നിന്റെ അപ്പൻ അരമന കാക്കാൻ വിട്ടേച്ചുപോയ വെപ്പാട്ടികളുടെ അടുക്കൽ ചെല്ലുക[a]. അപ്പോൾ നീ നിന്റെ അപ്പന് അറപ്പുളവാക്കുന്നവനായിത്തീർന്നെന്ന്[b] ഇസ്രായേൽ മുഴുവൻ കേൾക്കും; നിന്നോടൊപ്പമുള്ളവരെല്ലാം ധൈര്യപ്പെടുകയും ചെയ്യും[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അടുക്കൽ ചെല്ലുക” എന്നത് ഇവിടെ ലൈംഗികബന്ധത്തിലേർപ്പെടുക എന്നർഥമുള്ള എബ്രായ ശിഷ്ടോക്തിയാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം അക്ഷരാർഥത്തിൽ ദുർഗന്ധമുള്ളവനോ അറപ്പുളവാക്കുന്നവനോ ആയിത്തീരുക എന്ന ചിത്രം ഉണർത്തുന്നു; “നിന്റെ അപ്പന് വെറുപ്പുള്ളവനായിത്തീർന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “നിന്നോടൊപ്പമുള്ളവരുടെയെല്ലാം കൈകൾ ശക്തിപ്പെടും”; അതായത് അവർ ധൈര്യപ്പെടുകയോ കൂടുതൽ ദൃഢനിശ്ചയമുള്ളവരാകുകയോ ചെയ്യും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  choice: അടുക്കൽ ചെല്ലുക
  rationale: സന്ദർഭത്തിൽ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശിഷ്ടോക്തിയാണ്. മലയാളത്തിൽ അശ്ലീലമാകാതെ ആ ശിഷ്ടോക്തി നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: פִּלַגְשֵׁי
  choice: വെപ്പാട്ടികൾ
  rationale: പുരാതന രാജകുടുംബത്തിൽ അംഗീകൃതമായിരുന്നെങ്കിലും ഭാര്യയെക്കാൾ താഴ്ന്ന പദവിയിലുള്ള സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ മലയാള ബൈബിൾപ്രയോഗം.
- source_word: הִנִּיחַ לִשְׁמֹר הַבָּיִת
  choice: അരമന കാക്കാൻ ... വിട്ടിട്ടുപോയ
  rationale: ശമർ എന്ന ക്രിയയുടെ കാക്കുക/പരിപാലിക്കുക എന്ന ആശയം നിലനിർത്തുന്നു; രാജകീയ പശ്ചാത്തലത്തിൽ הבית എന്നത് അരമനയായി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְשָׁמַע כָּל יִשְׂרָאֵל
  choice: അപ്പോൾ ... ഇസ്രായേൽ മുഴുവൻ കേൾക്കും
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള പ്രതീക്ഷിത ഫലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഇസ്രായേൽ എന്നത് ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: നീ നിന്റെ അപ്പന് അറപ്പുളവാക്കുന്നവനായിത്തീർന്നു
  rationale: നിഫാൽ രൂപത്തിന്റെ ‘ദുർഗന്ധമുള്ളത്/വെറുപ്പുളവാക്കുന്നത് ആയിത്തീരുക’ എന്ന ശക്തമായ രൂപകവും പിതാവുമായുള്ള ബന്ധഭംഗവും നിലനിർത്തുന്നു.
- source_word: וְחָזְקוּ יְדֵי
  choice: ധൈര്യപ്പെടും
  rationale: ‘കൈകൾ ശക്തിപ്പെടും’ എന്ന എബ്രായ ശൈലിയുടെ സന്ദർഭാർഥം, അതായത് മനോധൈര്യവും ദൃഢനിശ്ചയവും ലഭിക്കുക, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അടിക്കുറിപ്പിൽ മൂലചിത്രം സൂക്ഷിക്കുന്നു.
- source_word: כָּל אֲשֶׁר אִתָּךְ
  choice: നിന്നോടുകൂടെയുള്ള എല്ലാവരും
  rationale: രാഷ്ട്രീയ അനുയായികൾ എന്ന ആശയം സന്ദർഭത്തിൽ ഉണ്ടായിരുന്നാലും എബ്രായത്തിലെ ബന്ധസൂചകമായ വിശാല പ്രയോഗം അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: രാജകീയ-രാഷ്ട്രീയ ഉപദേശത്തിലെ ലൈംഗിക ശിഷ്ടോക്തി
  choice: ‘വെപ്പാട്ടികളുടെ അടുക്കൽ ചെല്ലുക’ എന്ന മാന്യമായ ശിഷ്ടോക്തി
  alternative: ‘വെപ്പാട്ടികളുമായി ലൈംഗികബന്ധത്തിലേർപ്പെടുക’
  rationale: ദാവീദുമായുള്ള മാറ്റാനാകാത്ത പരസ്യബന്ധഭംഗം സൂചിപ്പിക്കുന്ന ലൈംഗികപ്രവൃത്തിയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. എബ്രായത്തിന്റെ ശിഷ്ടോക്തിയും സംഭവത്തിന്റെ ഗൗരവവും നിലനിർത്തി, അർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
- issue: נִבְאַשְׁתָּ എന്നതിലെ രൂപകശക്തി
  choice: ‘അറപ്പുളവാക്കുന്നവനായിത്തീർന്നു’
  alternative: ‘വെറുക്കപ്പെട്ടവനായിത്തീർന്നു’
  rationale: മൂലത്തിലെ ദുർഗന്ധം/അസഹ്യത ഉണർത്തുന്ന ശക്തമായ രൂപകത്തെ പൂർണമായി മൃദൂകരിക്കാതെ സാമൂഹികവും ബന്ധപരവുമായ വിരോധം പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും നേരിട്ടുള്ളതുമായ ആഖ്യാനശൈലി. ‘അപ്പൻ’ സംഭാഷണത്തിന് സ്വാഭാവികത നൽകുന്നു; ‘വെപ്പാട്ടികൾ’ ചരിത്രപരമായ കുടുംബപദവി വ്യക്തമാക്കുന്നു. ലൈംഗിക ഉള്ളടക്കം ശിഷ്ടോക്തിയായി നിലനിർത്തിയിട്ടും അടിക്കുറിപ്പിലൂടെ വായനക്കാരന് വ്യക്തത നൽകുന്നു.
