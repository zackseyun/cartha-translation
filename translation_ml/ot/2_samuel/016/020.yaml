base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/020.yaml
  text: Then Absalom said to Ahithophel, “Give your advice. What should we do?”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്ശാലോം അഹീതോഫെലിനോടു പറഞ്ഞു: “നിങ്ങളുടെ ആലോചന പറയൂ. നാം എന്തു ചെയ്യണം?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ לָכֶם עֵצָה
  choice: നിങ്ങളുടെ ആലോചന പറയൂ
  rationale: ‘ആലോചന നൽകുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു. ബഹുവചന ആജ്ഞാരൂപവും לָכֶם എന്ന ബഹുവചന ഘടകവും മാന്യമായ ‘നിങ്ങളുടെ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַה נַּעֲשֶׂה
  choice: നാം എന്തു ചെയ്യണം?
  rationale: ഒന്നാംപുരുഷ ബഹുവചനമായ ‘നാം ചെയ്യുക’ എന്ന ആശയവും, തുടർനടപടിയെക്കുറിച്ചുള്ള ആലോചനാപരമായ ചോദ്യത്തിന്റെ ഭാവവും കൃത്യമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ ചുരുക്കവും രാജസഭാ സാഹചര്യത്തിലെ ഗൗരവവും സംരക്ഷിച്ചു.
