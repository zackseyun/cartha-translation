source:
  edition: WLC
  text: וְ/כֹֽה אָמַ֥ר שִׁמְעִ֖י בְּ/קַֽלְל֑/וֹ צֵ֥א צֵ֛א אִ֥ישׁ הַ/דָּמִ֖ים וְ/אִ֥ישׁ הַ/בְּלִיָּֽעַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
translation:
  language: ml
  text: 'ശിമെയി അവനെ ശപിച്ചുകൊണ്ട് ഇങ്ങനെ പറഞ്ഞു: “പുറത്തുപോ! പുറത്തുപോ! രക്തക്കുറ്റമുള്ള മനുഷ്യാ[a], നീചനായ മനുഷ്യാ![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “രക്തങ്ങളുടെ മനുഷ്യൻ.” ഈ എബ്രായ ശൈലി രക്തച്ചൊരിച്ചിലിനെയോ രക്തക്കുറ്റത്തെയോ സൂചിപ്പിക്കുന്നു. “രക്തപാതകിയായ മനുഷ്യാ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: “ദുഷ്ടനായ മനുഷ്യാ” എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ എബ്രായത്തിലെ “ബെലിയാൽ” എന്ന പദം സാധാരണയായി നീചനോ കൊള്ളരുതാത്തവനോ ആയ ഒരാളെ സൂചിപ്പിക്കുന്ന ശൈലിയാണ്; അത് നിർബന്ധമായും ‘ബെലിയാൽ’ എന്ന വ്യക്തിനാമമല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֹה אָמַר
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: തുടർന്നുവരുന്ന വാക്കുകളുടെ രീതിയും ഉള്ളടക്കവും അവതരിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാള പ്രയോഗം.
- source_word: שִׁמְעִי
  choice: ശിമെയി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בְּקַלְלוֹ
  choice: അവനെ ശപിച്ചുകൊണ്ട്
  rationale: ഇൻഫിനിറ്റീവ് കൺസ്ട്രക്ടിനോടു ചേർന്ന മുൻപ്രത്യയം ഒരേസമയം നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയത്തിന്റെ കർമം സന്ദർഭത്തിൽ ദാവീദാണ്.
- source_word: צֵא צֵא
  choice: പുറത്തുപോ! പുറത്തുപോ!
  rationale: ആവർത്തിച്ച ആജ്ഞ പുറത്താക്കലിന്റെയും തിരസ്കാരത്തിന്റെയും തീവ്രത നിലനിർത്തുന്നു.
- source_word: אִישׁ הַדָּמִים
  choice: രക്തപാതകിയായ മനുഷ്യാ
  rationale: ‘രക്തങ്ങൾ’ എന്ന എബ്രായ ബഹുവചനം രക്തച്ചൊരിച്ചിലിനെയോ അതിന്റെ കുറ്റബാധ്യതയെയോ സൂചിപ്പിക്കുന്ന ശൈലിയാണ്; കൊലചെയ്യാനുള്ള ആഗ്രഹം അനുമാനിക്കാതെ കുറ്റാരോപണത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: וְאִישׁ הַבְּלִיָּעַל
  choice: നീചനായ മനുഷ്യാ
  rationale: ഇവിടെ בְּלִיַּעַל ഒരു വ്യക്തിനാമമല്ല, ധാർമികമായി അധമനും കൊള്ളരുതാത്തവനുമായ ഒരാളെ അധിക്ഷേപിക്കുന്ന സാധാരണനാമപ്രയോഗമാണ്; ‘മനുഷ്യാ’ ആവർത്തിക്കുന്നത് എബ്രായ സമാന്തരഘടന നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּלִיַּעַל എന്നതിന്റെ അർഥം
  choice: ‘നീചനായ മനുഷ്യൻ’ എന്ന സാധാരണനാമ അധിക്ഷേപം
  alternative: ‘ദുഷ്ടനായ മനുഷ്യൻ’ അല്ലെങ്കിൽ ‘ബെലിയാലിന്റെ മനുഷ്യൻ’
  rationale: പഴയനിയമത്തിലെ ഈ സന്ദർഭത്തിൽ പദം ധാർമിക അധമത്വത്തെ സൂചിപ്പിക്കുന്നു. ‘ബെലിയാൽ’ എന്ന വ്യക്തിനാമം ഉപയോഗിക്കുന്നത് പിൽക്കാലത്ത് രൂപപ്പെട്ട ദുഷ്ടാത്മസംബന്ധമായ ആശയങ്ങൾ അനാവശ്യമായി വാക്യത്തിലേക്ക് കൊണ്ടുവരാം.
- issue: אִישׁ הַדָּמִים എന്ന കുറ്റാരോപണം
  choice: രക്തപാതകിയായ മനുഷ്യൻ
  alternative: രക്തത്തിന്റെ മനുഷ്യൻ; രക്തദാഹിയായ മനുഷ്യൻ
  rationale: വാചകം രക്തച്ചൊരിച്ചിലോ രക്തക്കുറ്റമോ ആരോപിക്കുന്നു; ‘രക്തദാഹി’ എന്നു പറഞ്ഞാൽ കൊലചെയ്യാനുള്ള മനോഭാവം കൂടി വ്യാഖ്യാനിച്ച് ചേർക്കുന്നതാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള അധിക്ഷേപത്തിന്റെ കാഠിന്യവും ആവർത്തിച്ച ആജ്ഞയുടെ ഊന്നലും നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദ ഘടനകൾ ഒഴിവാക്കി.
