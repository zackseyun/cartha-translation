reference: 2 Samuel 16:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חוּשַׁי֮ אֶל אַבְשָׁלֹם֒ לֹ֕א כִּי֩ אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה וְ/הָ/עָ֥ם הַ/זֶּ֖ה וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֑ל לא אֶהְיֶ֖ה וְ/אִתּ֥/וֹ אֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
translation:
  language: ml
  text: 'ഹൂശായി അബ്ശാലോമിനോടു പറഞ്ഞു: “അല്ല; യാഹ്‌വെയും ഈ ജനവും ഇസ്രായേലിലെ എല്ലാ പുരുഷന്മാരും തിരഞ്ഞെടുത്തവന്റെ പക്ഷത്തായിരിക്കും ഞാൻ[a]; അവനോടുകൂടെ ഞാൻ തുടരും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പാഠത്തിൽ ഇവിടെ ‘അല്ല’ എന്നെഴുതിയിരിക്കുന്നു; പരമ്പരാഗത വായന ‘അവന്റേത്/അവന്റെ പക്ഷത്ത്’ എന്നാണ്. സന്ദർഭം ഈ വായനയെയാണ് പിന്തുണയ്ക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: לֹא כִּי
  choice: അല്ല;
  rationale: ശക്തമായ നിഷേധവും തുടർന്ന് വരുന്ന തിരുത്തൽ/വിശദീകരണവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; കാരണം സൂചിപ്പിക്കുന്ന ബന്ധം തുടർന്നുള്ള വാക്യഘടനയിൽ വ്യക്തമാണ്.
- source_word: אֲשֶׁר בָּחַר
  choice: തിരഞ്ഞെടുത്തവൻ
  rationale: ഇതിനകം പരിഗണനയിലുള്ള ഒരു നിർദിഷ്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യത്തിന്റെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וְהָעָם הַזֶּה
  choice: ഈ ജനവും
  rationale: എബ്രായത്തിലെ ഏകവചന കൂട്ടനാമവും സമീപസൂചകവും നിലനിർത്തുന്നു.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേൽപുരുഷന്മാരും
  rationale: പദശഃ ‘ഇസ്രായേലിലെ ഓരോ പുരുഷനും’ എന്ന വിതരണാർഥം മലയാളത്തിൽ വായനാസൗകര്യമുള്ള കൂട്ടപ്രയോഗമായി നൽകുന്നു.
- source_word: לא אֶהְיֶה
  choice: അവന്റേതായിരിക്കും ഞാൻ
  rationale: മസോററ്റിക് പാഠത്തിലെ לא ഇവിടെ സന്ദർഭത്തിൽ לו എന്ന അർഥത്തിൽ മനസ്സിലാക്കപ്പെടുന്ന എഴുത്തുരൂപമാണ്; ഹൂശായിയുടെ കൂറും ചേർന്നുനിൽപ്പും സൂചിപ്പിക്കുന്ന അപൂർണ്ണ പ്രയോഗം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאִתּוֹ אֵשֵׁב
  choice: അവനോടുകൂടെ ഞാൻ താമസിക്കും
  rationale: ישׁב എന്ന ക്രിയയുടെ ‘ഇരിക്കുക/വസിക്കുക/തുടരുക’ എന്ന അർഥപരിധിയിൽ, രാജസന്നിധിയിൽ തുടർന്നുള്ള സഹവാസത്തെ സൂചിപ്പിക്കുന്ന അടുത്ത രൂപം തിരഞ്ഞെടുക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: പേരിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; ആധുനിക മലയാള ബൈബിൾ വായനയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപമാണ് ‘യഹോവ’.
- issue: וְכָל אִישׁ יִשְׂרָאֵל എന്ന ലിംഗസൂചക പ്രയോഗം
  choice: എല്ലാ ഇസ്രായേൽപുരുഷന്മാരും
  alternative: എല്ലാ ഇസ്രായേല്യരും
  rationale: אִישׁ എന്ന പദത്തിലെ പുരുഷലിംഗസൂചന നീക്കാതെ, അതിന്റെ കൂട്ടായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- issue: לא אֶהְיֶה എന്ന കെതീവ് രൂപം
  choice: അവന്റേതായിരിക്കും ഞാൻ
  alternative: ഞാൻ ആയിരിക്കുകയില്ല
  rationale: സന്ദർഭവും പരമ്പരാഗത വായനയും לו (‘അവന്/അവന്റേത്’) എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു; പദശഃ നിഷേധമായി എടുത്താൽ ഹൂശായിയുടെ തുടർന്നുള്ള ‘അവനോടുകൂടെ താമസിക്കും’ എന്ന പ്രഖ്യാപനവുമായി വാക്യം പൊരുത്തക്കേടിലാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. ‘അവന്റേതായിരിക്കും ഞാൻ’ എന്ന ക്രമം ഹൂശായിയുടെ കൂറുപ്രഖ്യാപനത്തിന് ഊന്നൽ നൽകുകയും എബ്രായത്തിലെ അപൂർണ്ണമായ ‘ഞാൻ അവന്റേതായിരിക്കും’ എന്ന ആശയം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
