translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും അതേസമയം ഗൗരവമുള്ളതുമായ വിവർത്തനം. എബ്രായത്തിലെ ചലനത്തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമാക്കി; സ്ഥലബന്ധവും ശത്രുതാപരമായ പ്രവൃത്തികളും വ്യക്തമായി നിലനിർത്തി.
