  yaml_path: translation/ot/2_samuel/016/013.yaml
  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
translation:
  language: ml
  text: അങ്ങനെ ദാവീദും അവന്റെ ആളുകളും വഴിയിലൂടെ പോയി. ശിമെയി അവന് എതിരെയുള്ള മലഞ്ചരിവിലൂടെ നടന്നുകൊണ്ട് ശപിക്കുകയും അവന്റെ നേരെ കല്ലെറിയുകയും പൊടി വാരിയെറിയുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിൽ ശിമെയിയുടെ തുടർച്ചയായ നീക്കം ഊന്നിപ്പറയുന്ന ആവർത്തനമുണ്ട്: ‘നടന്നുപോകുകയും ശപിക്കുകയും ചെയ്തു’ എന്ന ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדָּרֶךְ
  choice: വഴിയിലൂടെ
  rationale: דֶּרֶךְ എന്നത് ഇവിടെ ദാവീദിന്റെ യാത്രാമാർഗമായ വഴി സൂചിപ്പിക്കുന്നു; ‘വഴിയിലൂടെ’ സ്വാഭാവികവും ദൃശ്യസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: בְּצֵלַע הָהָר
  choice: മലഞ്ചരിവിലൂടെ
  rationale: צֵלַע എന്നതിന്റെ ‘വശം/പാർശ്വം’ എന്ന അടിസ്ഥാനാർഥം മലയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘മലഞ്ചരിവ്’ എന്നു നൽകാം.
- source_word: לְעֻמָּתוֹ
  choice: അവന് എതിരെയുള്ള … അവന്റെ നേരെ
  rationale: ആദ്യപ്രയോഗം ശിമെയിയുടെ സമാന്തരവും എതിർവശത്തുമായ സ്ഥാനം സൂചിപ്പിക്കുന്നു. ആവർത്തിച്ച രണ്ടാം പ്രയോഗം കല്ലെറിയുന്ന ദിശയായി മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവന്റെ നേരെ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: הֹלֵךְ ... הָלוֹךְ
  choice: നടന്നുകൊണ്ട്
  rationale: ആവർത്തിത ഗതിയുടെ തുടർച്ചാഭാവം മലയാളത്തിലെ ‘നടന്നുകൊണ്ട്’ എന്ന പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיְקַלֵּל
  choice: ശപിക്കുകയും
  rationale: Piel രൂപത്തിലുള്ള קלל ഇവിടെ ‘ശപിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥത്തിലാണ്.
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: കല്ലെറിയുകയും
  rationale: ഇത് ഔപചാരിക കല്ലെറിഞ്ഞുകൊലപ്പെടുത്തലല്ല, വഴിയിലൂടെ പോകുന്ന ദാവീദിനെ ഉപദ്രവിക്കാൻ കല്ലുകൾ എറിയുന്നതാണ്; അതിനാൽ ‘കല്ലെറിയുക’ കൃത്യമാണ്.
- source_word: וְעִפַּר בֶּעָפָר
  choice: പൊടി വാരിയെറിയുകയും
  rationale: പൊടി/മണ്ണ് ശത്രുതാഭാവത്തോടെ എറിയുന്ന ദൃശ്യത്തെ ‘പൊടി വാരിയെറിയുക’ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַאֲנָשָׁיו
  choice: അവന്റെ ആളുകളും
  rationale: ദാവീദിനൊപ്പമുള്ള പുരുഷാനുയായികളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അവന്റെ ആളുകൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
