  yaml_path: translation/ot/2_samuel/016/004.yaml
  text: Then the king said to Ziba, “Look, all that belongs to Mephibosheth is yours.” And Ziba said, “I bow down; may I find favor in your eyes, my lord the king.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് സീബയോടു പറഞ്ഞു: “നോക്കൂ, മെഫീബോശെത്തിനുള്ളതെല്ലാം നിനക്കുള്ളതാണ്.” സീബ പറഞ്ഞു: “ഞാൻ കുമ്പിടുന്നു. എന്റെ യജമാനനായ രാജാവേ, അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരത്തെ ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: הִשְׁתַּחֲוֵיתִי
  choice: ഞാൻ അങ്ങയുടെ മുമ്പിൽ കുമ്പിടുന്നു
  rationale: രാജാവിനോടുള്ള ആദരപൂർവമായ നമസ്കാരത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം വ്യക്തമാക്കുന്നു; ആരാധന എന്ന പ്രത്യേക ദൈവശാസ്ത്രാർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിക്കട്ടെ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും വിനയപൂർവമായ ആശംസാഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: യജമാനനായ രാജാവേ
  rationale: രാജാവിനെ അഭിസംബോധന ചെയ്യുന്ന ആദരസൂചക പദവിയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
