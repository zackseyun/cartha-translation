  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രാജാവിന്റെ പ്രഖ്യാപനവും സീബയുടെ അത്യന്തം ആദരപൂർവമായ മറുപടിയും തമ്മിലുള്ള ശൈലിവ്യത്യാസം സംരക്ഷിച്ചിരിക്കുന്നു.
