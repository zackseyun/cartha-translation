source:
  edition: WLC
  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר בָּ֞א חוּשַׁ֧י הָ/אַרְכִּ֛י רֵעֶ֥ה דָוִ֖ד אֶל אַבְשָׁל֑וֹם וַ/יֹּ֤אמֶר חוּשַׁי֙ אֶל אַבְשָׁלֹ֔ם יְחִ֥י הַ/מֶּ֖לֶךְ יְחִ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/016.yaml
  text: And when Hushai the Archite[a], David’s friend, came to Absalom, Hushai said to Absalom, “Long live the king! Long live the king!”
translation:
  language: ml
  text: 'ദാവീദിന്റെ സുഹൃത്തായ അർക്ക്യനായ ഹൂശായി അബ്ശാലോമിന്റെ അടുക്കൽ വന്നപ്പോൾ, ഹൂശായി അബ്ശാലോമിനോട് പറഞ്ഞു: “രാജാവ് നീണാൾ വാഴട്ടെ! രാജാവ് നീണാൾ വാഴട്ടെ!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജാവ് ജീവിക്കട്ടെ!” എബ്രായത്തിൽ ഇത് ഒരു രാജകീയ ജയഘോഷമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: വന്നപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സംഭവക്രമം മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യഘടനയിലൂടെ വ്യക്തമാക്കുന്നു; ‘സംഭവിച്ചു’ എന്ന പദാനുപദ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: בָּא
  choice: വന്നു
  rationale: ഹൂശായി അബ്ശാലോമിന്റെ സന്നിധിയിലേക്കെത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ ഗതിക്രിയ.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: അർഖ്യനായ ഹൂശായി
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ലിപ്യന്തരം ചെയ്യുകയും הָאַרְכִּי എന്ന ജനവിഭാഗ/ദേശബന്ധ സൂചന വിശേഷണരൂപത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: רֵעֶה דָוִד
  choice: ദാവീദിന്റെ സുഹൃത്ത്
  rationale: ബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സംയുക്തപ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל אַבְשָׁלוֹם
  choice: അബ്ശാലോമിന്റെ അടുക്കൽ / അബ്ശാലോമിനോട്
  rationale: ആദ്യ സന്ദർഭത്തിൽ ചലനത്തിന്റെ ലക്ഷ്യവും രണ്ടാമത്തേതിൽ അഭിസംബോധനയുടെ ലക്ഷ്യവും ഒരേ എബ്രായ ഉപസർഗത്തിന്റെ സന്ദർഭാനുസൃത അർഥമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന אמר എന്ന സാധാരണ ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: יְחִי הַמֶּלֶךְ
  choice: രാജാവ് നീണാൾ വാഴട്ടെ!
  rationale: രാജകീയ ജയഘോഷമായ ജസ്സീവ് പ്രയോഗത്തിന്റെ ശക്തിയും സ്വാഭാവികതയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְחִי הַמֶּלֶךְ (repeated)
  choice: രാജാവ് നീണാൾ വാഴട്ടെ!
  rationale: ഊന്നലും പൊതുജയഘോഷത്തിന്റെ ഭാവവും ഹൂശായിയുടെ വിശ്വസ്തതയെക്കുറിച്ചുള്ള ആഖ്യാനപരമായ സന്ദിഗ്ധതയും നിലനിർത്താൻ ആവർത്തനം അതേപടി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: അബ്ശാലോമിനോടുള്ള ഹൂശായിയുടെ ജയഘോഷത്തിലെ സന്ദിഗ്ധത
  choice: വഞ്ചനയോ പരിഹാസമോ വ്യക്തമാക്കുന്ന അധികവാക്കുകൾ ചേർക്കാതെ സാധാരണ രാജകീയ ജയഘോഷമായി വിവർത്തനം ചെയ്തു.
  alternative: പരിഹാസമോ മറഞ്ഞ ഉദ്ദേശ്യമോ നേരിട്ട് സൂചിപ്പിക്കുന്ന വിധത്തിൽ വികസിപ്പിക്കുക.
  rationale: ഈ വാക്യം ഹൂശായിയുടെ വാക്കുകളെ സാധാരണ രാജകീയ അഭിവാദ്യമായാണ് അവതരിപ്പിക്കുന്നത്. വിശാലമായ സന്ദർഭത്തിലെ തന്ത്രപരമായ ഇരട്ടാർഥം വിവർത്തനം മുൻകൂട്ടി പരിഹരിക്കാതെ നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങൾ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരരീതിയോട് ചേർത്ത് നൽകിയിരിക്കുന്നു; രാജകീയ ജയഘോഷം സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന ഭാഷയിൽ അവതരിപ്പിച്ചിരിക്കുന്നു.
