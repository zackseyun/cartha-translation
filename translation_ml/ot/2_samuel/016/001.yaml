id: 2SA.16.1
reference: 2 Samuel 16:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/דָוִ֗ד עָבַ֤ר מְעַט֙ מֵֽ/הָ/רֹ֔אשׁ וְ/הִנֵּ֥ה צִיבָ֛א נַ֥עַר מְפִי בֹ֖שֶׁת לִ/קְרָאת֑/וֹ וְ/צֶ֨מֶד חֲמֹרִ֜ים חֲבֻשִׁ֗ים וַ/עֲלֵי/הֶם֩ מָאתַ֨יִם לֶ֜חֶם וּ/מֵאָ֧ה צִמּוּקִ֛ים וּ/מֵ֥אָה קַ֖יִץ וְ/נֵ֥בֶל יָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
translation:
  language: ml
  text: ദാവീദ് മലയുടെ മുകൾഭാഗം അല്പം പിന്നിട്ടപ്പോൾ[a], അതാ, മെഫീബോശെത്തിന്റെ ദാസനായ[b] സീബ അവനെ എതിരേൽക്കാൻ അവിടെ നിന്നിരുന്നു. ജീനിയിട്ട രണ്ടു കഴുതകളുമായി അവൻ വന്നിരുന്നു; അവയുടെമേൽ ഇരുനൂറ് അപ്പവും നൂറ് ഉണക്കമുന്തിരിക്കുലകളും നൂറ് വേനൽപ്പഴങ്ങളും വീഞ്ഞുനിറച്ച ഒരു തുകൽക്കുടവും ഉണ്ടായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “മലയുടെ മുകളിൽനിന്ന് അല്പദൂരം മുന്നോട്ടുപോയപ്പോൾ.” എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “തലയിൽനിന്ന് അല്പം” എന്നാണ്; ഇവിടെ “തല” മലയുടെ മുകൾഭാഗത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “ദാസൻ” എന്നത് “യുവാവ്” എന്നോ “പരിചാരകൻ” എന്നോ പരിഭാഷപ്പെടുത്താം. ഇവിടെ മെഫീബോശെത്തിനോടുള്ള സീബയുടെ സേവകബന്ധമാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: “വേനൽപ്പഴം” എന്നത് ഇവിടെ കൂടുതൽ പ്രത്യേകമായി അത്തിപ്പഴത്തെ സൂചിപ്പിച്ചേക്കാം; എന്നാൽ എബ്രായപദത്തിന് അതിലും വിശാലമായ അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  choice: മലയുടെ മുകൾഭാഗം അല്പം പിന്നിട്ടപ്പോൾ
  rationale: רֹאשׁ എന്നത് അക്ഷരാർഥത്തിൽ ‘തല’ എന്നാണെങ്കിലും ഇവിടെ ഭൂപ്രകൃതിപരമായി മലയുടെ മുകൾഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ദാവീദ് അതു കടന്ന് അല്പദൂരം മുന്നോട്ടുപോയെന്ന സ്ഥലബോധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള ദൃശ്യാവിഷ്കാരവും ആഖ്യാനത്തിലെ ശ്രദ്ധാകേന്ദ്രമാറ്റവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: נַעַר מְפִי בֹשֶׁת
  choice: മെഫീബോശെത്തിന്റെ ദാസനായ
  rationale: נַעַר എന്നതിന് ‘യുവാവ്,’ ‘പരിചാരകൻ,’ ‘ദാസൻ’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഈ സന്ദർഭത്തിൽ മെഫീബോശെത്തിനോടുള്ള സീബയുടെ സേവകബന്ധം പ്രധാനമായതിനാൽ ‘ദാസൻ’ തിരഞ്ഞെടുത്തു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: צֶמֶד חֲמֹרִים
  choice: രണ്ടു കഴുതകൾ
  rationale: צֶמֶד ഒരു ജോഡിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘രണ്ടു കഴുതകൾ’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്; അവ നുകത്തിൽ ബന്ധിക്കപ്പെട്ടിരുന്നുവെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: חֲבֻשִׁים
  choice: ജീനിയിട്ട
  rationale: സവാരിക്കോ ചുമടേറ്റാനോ ഒരുക്കിയ കഴുതകളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ‘ജീനിയിട്ട’ എന്നത് പ്രസക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מָאתַיִם לֶחֶם
  choice: ഇരുനൂറ് അപ്പം
  rationale: എണ്ണാവുന്ന അപ്പങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ പ്രത്യേക അളവുപദം ചേർക്കാതെയും അർഥം വ്യക്തമാണ്.
- source_word: צִמּוּקִים
  choice: ഉണക്കമുന്തിരിക്കുല
  rationale: ഉണക്കിയ മുന്തിരിയുടെ കൂട്ടങ്ങളെയോ അമർത്തിച്ചേർത്ത കുലകളെയോ സൂചിപ്പിക്കുന്ന പദം. ‘കുല’ എന്നത് ‘കേക്ക്’ എന്നു അമിതമായി നിർവചിക്കാതെ കൂട്ടരൂപം നിലനിർത്തുന്നു.
- source_word: קַיִץ
  choice: വേനൽപ്പഴം
  rationale: പദം പൊതുവായി വേനൽക്കാലപ്പഴത്തെ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ അത്തിപ്പഴം ആയിരിക്കാമെങ്കിലും മൂലപാഠത്തേക്കാൾ ചുരുക്കി നിർവചിക്കാതിരിക്കാൻ വിശാലമായ പദം സ്വീകരിച്ചു.
- source_word: נֵבֶל יָיִן
  choice: ഒരു തുകൽക്കുടം വീഞ്ഞ്
  rationale: נֵבֶל ഇവിടെ വീഞ്ഞു സൂക്ഷിക്കുന്ന മൃഗത്തോൽകൊണ്ടുള്ള പാത്രത്തെ സൂചിപ്പിക്കുന്നു. ‘തുകൽക്കുടം’ വസ്തുവും ഉപയോഗവും സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
