  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. וְהִנֵּה എന്നതിന്റെ ദൃശ്യതീവ്രത ‘അതാ’ എന്നതിലൂടെ നിലനിർത്തി. മൂലപാഠത്തിലെ അർഥസാധ്യതകൾ ചുരുക്കാതെ ആവശ്യമായിടത്ത് അടിക്കുറിപ്പുകൾ നൽകി.
