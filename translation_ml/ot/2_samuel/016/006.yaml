  yaml_path: translation/ot/2_samuel/016/006.yaml
  text: And he threw stones at David and at all the servants of King David[a], while all the people and all the mighty men were at his right hand and at his left.
translation:
  language: ml
  text: അവൻ ദാവീദിനുനേരെയും ദാവീദ് രാജാവിന്റെ സകല സേവകർക്കുനേരെയും കല്ലുകൾ എറിഞ്ഞു[a]. എല്ലാ ജനവും എല്ലാ വീരന്മാരും ദാവീദിന്റെ വലതുവശത്തും ഇടതുവശത്തും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ദാവീദിനെയും ദാവീദ് രാജാവിന്റെ സകല സേവകരെയും കല്ലെറിഞ്ഞു.” എബ്രായ ക്രിയയെ ഇങ്ങനെയും വിവർത്തനം ചെയ്യാം; എന്നാൽ മലയാളത്തിൽ അത് ഔപചാരികമായ കല്ലെറിഞ്ഞുള്ള വധശിക്ഷയെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: കല്ലെറിഞ്ഞു
  rationale: പീയേൽ ക്രിയയും ഉപകരണാർഥമുള്ള ‘കല്ലുകൾകൊണ്ട്’ എന്ന ഘടകവും ചേർന്ന്, വധശിക്ഷ നടപ്പാക്കിയെന്നല്ല മറിച്ച് ശത്രുതയോടെ കല്ലുകൾ എറിഞ്ഞെന്ന പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַבְדֵי
  choice: സേവകർ
  rationale: രാജാവിന്റെ സേവനത്തിലുള്ളവരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അടിമസ്ഥിതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവ്
  rationale: രാജകീയ പദവിയും വ്യക്തിനാമവും സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הָעָם
  choice: ജനമെല്ലാം
  rationale: ദാവീദിനോടൊപ്പമുണ്ടായിരുന്ന മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; സൈനികരായി മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: הַגִּבֹּרִים
  choice: വീരന്മാർ
  rationale: ശക്തരും ധീരരുമായ പോരാളികൾ എന്ന സൈനിക സൂചന നിലനിർത്തുന്ന, ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമായ പദം.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: ദാവീദിന്റെ വലത്തും ഇടത്തുമായി
  rationale: സന്ദർഭത്തിൽ സർവനാമപ്രത്യയം ഏറ്റവും സ്വാഭാവികമായി ദാവീദിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കി ചുറ്റുമുള്ള സംരക്ഷണസ്ഥാനത്തെ വ്യക്തമാക്കുന്നു.
