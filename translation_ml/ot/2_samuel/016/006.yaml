translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കല്ലെറിഞ്ഞു’ എന്നത് ഔപചാരിക കല്ലെറിഞ്ഞുള്ള വധശിക്ഷയെ നിർബന്ധമായി സൂചിപ്പിക്കാതെ ശത്രുതാപരമായ കല്ലേറ് വ്യക്തമാക്കുന്നു. എബ്രായത്തിലെ നീണ്ട ഏകവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചു.
