base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/015.yaml
  text: Absalom and all the people[a], the men of Israel, came to Jerusalem, and Ahithophel was with him.
translation:
  language: ml
  text: അബ്ശാലോമും ജനമെല്ലാം[a]—ഇസ്രായേല്യരായ പുരുഷന്മാർ—യെരൂശലേമിൽ എത്തി; അഹീഥോഫെലും അവനോടുകൂടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “ജനമെല്ലാം, ഇസ്രായേലിലെ ഓരോ പുരുഷനും” അല്ലെങ്കിൽ “ജനമെല്ലാം, ഇസ്രായേല്യരായ പുരുഷന്മാർ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁל֗וֹם
  choice: അബ്ശാലോമും
  rationale: വാക്യത്തിലെ സംയോജകമായ ו-യെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ഉം’ കൊണ്ട് പ്രതിഫലിപ്പിച്ചു; പേരിനെ പതിവായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְ/כָל הָ/עָם֙
  choice: ജനമെല്ലാം
  rationale: עָם ഇവിടെ അബ്ശാലോമിനോടൊപ്പം വന്ന ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സൈന്യം’ എന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
- source_word: אִ֣ישׁ יִשְׂרָאֵ֔ל
  choice: ഇസ്രായേൽപുരുഷന്മാർ
  rationale: മൂലത്തിലെ ഏകവചന-സമൂഹപ്രയോഗവും പുരുഷസൂചനയും കഴിയുന്നത്ര നിലനിർത്തി; മുൻപുള്ള ‘ജനമെല്ലാം’ എന്നതിന്റെ വിശദീകരണമായി ഡാഷുകൾക്കിടയിൽ നൽകി.
- source_word: בָּ֖אוּ יְרוּשָׁלִָ֑ם
  choice: യെരൂശലേമിൽ എത്തി
  rationale: בוא എന്ന ക്രിയയുടെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള വരവ് മലയാളത്തിൽ സ്വാഭാവികമായി ‘എത്തി’ എന്നു നൽകി; സ്ഥലനാമത്തോടു ലക്ഷ്യസ്ഥാനസൂചകമായ ‘-യിൽ’ ചേർത്തു.
- source_word: וַ/אֲחִיתֹ֖פֶל אִתּֽ/וֹ
  choice: അഹീഥോഫെലും അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിത ഘടന മലയാളത്തിൽ പൂർണ്ണമാക്കാൻ ‘ഉണ്ടായിരുന്നു’ ചേർത്തു; സന്ദർഭത്തിൽ സർവനാമം അബ്ശാലോമിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ജനമെല്ലാം’ എന്നതും ‘ഇസ്രായേൽപുരുഷന്മാർ’ എന്നതും തമ്മിലുള്ള മൂലപാഠത്തിലെ സമാനാധികരണബന്ധവും സാധ്യതയുള്ള വിതരണാർഥവും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
