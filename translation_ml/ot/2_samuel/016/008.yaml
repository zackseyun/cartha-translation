  revised_text: നീ പകരം രാജാവായിത്തീർന്ന ശൗലിന്റെ കുടുംബത്തിന്റെ സകല രക്തച്ചൊരിച്ചിലും യഹ്‌വെ നിന്റെമേൽ തിരികെ വരുത്തിയിരിക്കുന്നു[a]. യഹ്‌വെ രാജ്യം നിന്റെ മകനായ അബ്ശാലോമിന്റെ കയ്യിൽ ഏൽപ്പിച്ചിരിക്കുന്നു. ഇതാ, നീ നിന്റെ ദുരന്തത്തിലായിരിക്കുന്നു[b], കാരണം നീ ഒരു രക്തപാതകക്കാരനാണ്[c].
