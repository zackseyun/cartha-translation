  revision_rationale: ആദ്യവാക്യത്തിന്റെ ബന്ധഘടന പുനർക്രമീകരിച്ച് ശൗലിന്റെ സ്ഥാനത്ത് ദാവീദ് രാജാവായെന്ന മൂലപാഠബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കി. דָּמִים എന്ന പ്രയോഗത്തിന് മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘രക്തച്ചൊരിച്ചിൽ’ നൽകിയെങ്കിലും, ശാബ്ദികമായ ‘രക്തം’ എന്നും ‘രക്തപാതകക്കുറ്റം’ എന്നും ഉള്ള സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി. אִישׁ דָּמִים എന്നതിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ ‘രക്തപാതകക്കാരൻ’ പ്രയോഗം ഉപയോഗിച്ചു. ദുരന്തം എന്ന സന്ദർഭാർഥം നിലനിർത്തുന്നു; ഇത് ശിമെയിയുടെ ആരോപണം ആഖ്യാതാവിന്റെ നേരിട്ടുള്ള വിധിയായി മാറ്റുന്നില്ല.
