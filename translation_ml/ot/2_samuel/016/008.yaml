reference: 2 Samuel 16:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֵשִׁיב֩ עָלֶ֨י/ךָ יְהוָ֜ה כֹּ֣ל דְּמֵ֣י בֵית שָׁא֗וּל אֲשֶׁ֤ר מָלַ֨כְתָּ֙ תחת/ו וַ/יִּתֵּ֤ן יְהוָה֙ אֶת הַ/מְּלוּכָ֔ה בְּ/יַ֖ד אַבְשָׁל֣וֹם בְּנֶ֑/ךָ וְ/הִנְּ/ךָ֙ בְּ/רָ֣עָתֶ֔/ךָ כִּ֛י אִ֥ישׁ דָּמִ֖ים אָֽתָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
translation:
  language: ml
  text: നീ പകരം രാജാവായിത്തീർന്ന ശൗലിന്റെ കുടുംബത്തിന്റെ സകല രക്തച്ചൊരിച്ചിലും യഹ്‌വെ നിന്റെമേൽ തിരികെ വരുത്തിയിരിക്കുന്നു[a]. യഹ്‌വെ രാജ്യം നിന്റെ മകനായ അബ്ശാലോമിന്റെ കയ്യിൽ ഏൽപ്പിച്ചിരിക്കുന്നു. ഇതാ, നീ നിന്റെ ദുരന്തത്തിലായിരിക്കുന്നു[b], കാരണം നീ ഒരു രക്തപാതകക്കാരനാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശൗലിന്റെ കുടുംബത്തിന്റെ സകല രക്തവും” അല്ലെങ്കിൽ “ശൗലിന്റെ കുടുംബത്തിന്റെ സകല രക്തപാതകക്കുറ്റവും.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “ശൗലിന്റെ കുടുംബത്തിന്റെ സകല രക്തങ്ങൾ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിന്റെ തിന്മയിൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് ധാർമ്മിക തിന്മയെയോ ദുരന്തത്തെയോ അനർത്ഥത്തെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ ദാവീദിന്മേൽ വന്ന ദുരന്തമാണ് സാധ്യതയേറിയ അർത്ഥം.
    reason: lexical_alternative
  - marker: c
    text: “രക്തപാതകക്കാരൻ” എന്നത് “രക്തത്തിന്റെ മനുഷ്യൻ” അഥവാ “രക്തച്ചൊരിച്ചിലിന്റെ മനുഷ്യൻ” എന്നും വിവർത്തനം ചെയ്യാം; രക്തപാതകക്കുറ്റമോ അക്രമമോ കൊണ്ട് അടയാളപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב עָלֶיךָ
  choice: നിന്റെമേൽ തിരികെ വരുത്തിയിരിക്കുന്നു
  rationale: שׁוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘തിരികെ വരുത്തുക’ എന്ന കാരണാർത്ഥവും עַל സൂചിപ്പിക്കുന്ന ‘മേൽ’ എന്ന നീതിന്യായഭാരവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כָּל דְּמֵי בֵית שָׁאוּל
  choice: ശൗലിന്റെ ഭവനത്തിലെ സകല രക്തവും
  rationale: ‘രക്തങ്ങൾ’ എന്ന എബ്രായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുകയും രക്തച്ചൊരിച്ചിൽ, രക്തപാതകക്കുറ്റം എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר מָלַכְתָּ תַּחְתָּיו
  choice: നീ ആരുടെ സ്ഥാനത്ത് രാജാവായോ
  rationale: תחתיו എന്നത് ഇവിടെ ശൗലിന്റെ സ്ഥാനത്ത് അഥവാ അവനു പകരം എന്ന രാജകീയ പിൻഗാമിത്വം സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתֵּן ... אֶת־הַמְּלוּכָה בְּיַד
  choice: രാജ്യം ... കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: അധികാരത്തിന്റെ കൈമാറ്റം സൂചിപ്പിക്കുന്ന എബ്രായ ‘കയ്യിൽ കൊടുക്കുക’ എന്ന രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהִנְּךָ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּה എന്ന വ്യവഹാരകണത്തിന് ആധുനികവും മാന്യവുമായ മലയാളസമാനപദം.
- source_word: בְּרָעָתֶךָ
  choice: നിന്റെ ദുരന്തത്തിൽ അകപ്പെട്ടിരിക്കുന്നു
  rationale: רָעָה എന്നതിന് ധാർമ്മിക തിന്മയും അനുഭവിക്കുന്ന ദുരന്തവും അർത്ഥങ്ങളാകാം; അബ്ശാലോമിന്റെ കലാപം മൂലമുള്ള ദാവീദിന്റെ ഇപ്പോഴത്തെ അനർത്ഥമാണ് സന്ദർഭത്തിൽ മുഖ്യമായത്.
- source_word: אִישׁ דָּמִים
  choice: രക്തച്ചൊരിച്ചിലിന്റെ മനുഷ്യൻ
  rationale: രക്തപാതകമോ അക്രമമോ കൊണ്ട് അടയാളപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בְּרָעָתֶךָ എന്നതിന്റെ അർത്ഥം
  choice: നിന്റെ ദുരന്തത്തിൽ
  alternative: നിന്റെ തിന്മയിൽ
  rationale: പദത്തിന്റെ ധാർമ്മിക തിന്മ/അനുഭവിക്കുന്ന അനർത്ഥം എന്ന ദ്വയാർത്ഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു; മുഖ്യപാഠത്തിൽ ഇപ്പോൾ ദാവീദിനെ ബാധിച്ച ദുരന്തം തിരഞ്ഞെടുക്കുന്നു. ഇതിലൂടെ ശിമെയിയുടെ ആരോപണം ആഖ്യാതാവിന്റെ അംഗീകൃത വിധിയായി അവതരിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ നീതിന്യായഭാരവും ശ്രദ്ധാകർഷകമായ ‘ഇതാ’യും നിലനിർത്തി; വിവാദസാധ്യതയുള്ള അർത്ഥങ്ങൾ മുഖ്യപാഠത്തിൽ ഏകപക്ഷീയമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
