  revised_text: 'അപ്പോൾ ദാവീദ് അബീശായിയോടും തന്റെ സകല ദാസന്മാരോടും പറഞ്ഞു: “നോക്കൂ, എന്റെ ശരീരത്തിൽനിന്നു ജനിച്ച മകൻ എന്റെ ജീവൻ തേടുന്നു; ഇപ്പോൾ ഈ ബെന്യാമീന്യൻ എത്രയധികം! അവനെ വിട്ടേക്കൂ; അവൻ ശപിക്കട്ടെ; യഹോവ അവനോടു പറഞ്ഞിരിക്കുന്നു[a].”'
