revisions:
- from: 'അപ്പോൾ ദാവീദ് അബീശായിയോടും തന്റെ സകല ദാസന്മാരോടും പറഞ്ഞു: “നോക്കൂ, എന്റെ സ്വന്തം ശരീരത്തിൽനിന്നു ജനിച്ച എന്റെ മകൻതന്നെ എന്റെ ജീവൻ തേടുന്നു; അങ്ങനെയെങ്കിൽ ഇപ്പോൾ ഈ ബെന്യാമീന്യന്റെ കാര്യം പറയാനുണ്ടോ! അവനെ വിട്ടേക്കൂ; അവൻ ശപിക്കട്ടെ. യഹോവ അവനോടു പറഞ്ഞിരിക്കുന്നു[a].”'
  to: 'അപ്പോൾ ദാവീദ് അബീശായിയോടും തന്റെ സകല ദാസന്മാരോടും പറഞ്ഞു: “നോക്കൂ, എന്റെ ശരീരത്തിൽനിന്നു ജനിച്ച മകൻ എന്റെ ജീവൻ തേടുന്നു; ഇപ്പോൾ ഈ ബെന്യാമീന്യൻ എത്രയധികം! അവനെ വിട്ടേക്കൂ; അവൻ ശപിക്കട്ടെ; യഹോവ അവനോടു പറഞ്ഞിരിക്കുന്നു[a].”'
  rationale: താരതമ്യത്തിന്റെ മൂലഘടന വ്യക്തമായി പുനഃസ്ഥാപിക്കുകയും, മലയാളത്തിലെ ഭാരമുള്ള ആവർത്തനം കുറയ്ക്കുകയും ചെയ്തു. യഹോവയുടെ വാക്കിന്റെ ഉള്ളടക്കം മുഖ്യവാക്യത്തിൽ ചേർത്തുപറയാതെ മൂലപാഠത്തിലെ അർഥതുറപ്പില്ലായ്മയും ദൈവിക നിയോഗം/അനുമതി സംബന്ധിച്ച സംഘർഷവും നിലനിർത്തി.
