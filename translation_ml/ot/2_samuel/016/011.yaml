id: 2SA.16.11
reference: 2 Samuel 16:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֤ד אֶל אֲבִישַׁי֙ וְ/אֶל כָּל עֲבָדָ֔י/ו הִנֵּ֥ה בְנִ֛/י אֲשֶׁר יָצָ֥א מִ/מֵּעַ֖/י מְבַקֵּ֣שׁ אֶת נַפְשִׁ֑/י וְ/אַ֨ף כִּֽי עַתָּ֜ה בֶּן הַ/יְמִינִ֗י הַנִּ֤חוּ ל/וֹ֙ וִֽ/יקַלֵּ֔ל כִּ֥י אָֽמַר ל֖/וֹ יְהוָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് അബീശായിയോടും തന്റെ സകല ദാസന്മാരോടും പറഞ്ഞു: “നോക്കൂ, എന്റെ ശരീരത്തിൽനിന്നു ജനിച്ച മകൻ എന്റെ ജീവൻ തേടുന്നു; ഇപ്പോൾ ഈ ബെന്യാമീന്യൻ എത്രയധികം! അവനെ വിട്ടേക്കൂ; അവൻ ശപിക്കട്ടെ; യഹോവ അവനോടു പറഞ്ഞിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യഹോവ അവനോടു പറഞ്ഞിരിക്കുന്നു.” എന്താണ് പറഞ്ഞതെന്ന് എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല; സന്ദർഭം ശപിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: മൂലപാഠത്തിൽ പറഞ്ഞതിന്റെ ഉള്ളടക്കം വ്യക്തമല്ലെന്ന കാര്യം വായനക്കാരനെ അറിയിക്കുകയും സന്ദർഭസൂചന നൽകുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: തുടർന്നുവരുന്ന താരതമ്യത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  choice: എന്റെ സ്വന്തം ശരീരത്തിൽനിന്നു ജനിച്ച എന്റെ മകൻ
  rationale: സ്വാഭാവിക സന്തതിയെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ശക്തമായ ശാരീരിക ദൃശ്യത്തെ നിലനിർത്തുന്നു; പുരുഷനായ ദാവീദിനെക്കുറിച്ച് ‘എന്റെ ഗർഭത്തിൽനിന്ന്’ എന്നു പറയുന്നതിലെ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  choice: എന്റെ ജീവൻ തേടുന്നു
  rationale: കൊല്ലാൻ ശ്രമിക്കുന്നു എന്ന അർഥമുള്ള എബ്രായ പ്രയോഗത്തെ വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അതിന്റെ രൂപകസാന്നിധ്യത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: וְאַף כִּי עַתָּה
  choice: അങ്ങനെയെങ്കിൽ ഇപ്പോൾ ... കാര്യം പറയാനുണ്ടോ!
  rationale: സ്വന്തം മകൻപോലും ജീവൻ തേടുമ്പോൾ ഒരു ബെന്യാമീന്യൻ ഇങ്ങനെ ചെയ്യുന്നത് അതിലേറെ പ്രതീക്ഷിക്കാവുന്നതാണെന്ന ശക്തമായ താരതമ്യത്തിന്റെ വാചാടോപബലം സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: בֶּן הַיְמִינִי
  choice: ഈ ബെന്യാമീന്യൻ
  rationale: ബെന്യാമീൻ ഗോത്രത്തിൽപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സാധാരണവുമായ മലയാളരൂപം.
- source_word: הַנִּחוּ לוֹ
  choice: അവനെ വിട്ടേക്കൂ
  rationale: ദാവീദ് തന്റെ ആളുകളോടു ബഹുവചനത്തിൽ നൽകുന്ന, ഇടപെടരുതെന്ന കൽപ്പന സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וִיקַלֵּל
  choice: അവൻ ശപിക്കട്ടെ
  rationale: മുൻ കൽപ്പനയ്ക്കു പിന്നാലെയുള്ള അനുവദനീയത സൂചിപ്പിക്കുന്ന ക്രിയാഭാവം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כִּי אָמַר לוֹ יְהוָה
  choice: യഹോവ അവനോടു പറഞ്ഞിരിക്കുന്നു
  rationale: എന്താണ് പറഞ്ഞതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അത് മുഖ്യവാക്യത്തിൽ പൂരിപ്പിക്കാതെ എബ്രായത്തിലെ ഘടനയും അർഥതുറപ്പില്ലായ്മയും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ശിമെയിയുടെ ശാപത്തെ ദൈവത്തിന്റെ നേരിട്ടുള്ള വാക്കിനോടോ വെറും അനുമതിയോടോ ബന്ധിപ്പിക്കണമോ
  choice: “യഹോവ അവനോടു പറഞ്ഞിരിക്കുന്നു” എന്നു ദാവീദിന്റെ പ്രസ്താവന നേരിട്ട് നിലനിർത്തി.
  alternative: “യഹോവ അവനെ അനുവദിച്ചിരിക്കുന്നു” അല്ലെങ്കിൽ “യഹോവ അവനോട് ദാവീദിനെ ശപിക്കാൻ പറഞ്ഞിരിക്കുന്നു.”
  rationale: മൂലപാഠം ദാവീദിന്റെ വാക്കുകളിൽ പ്രവൃത്തിയെ യഹോവയുടെ അരുളപ്പാടുമായി ബന്ധിപ്പിക്കുന്നു; അതിനെ വെറും ദൈവാനുമതിയായി മൃദൂകരിക്കുന്നില്ല. അതേസമയം, പറഞ്ഞ വാക്കുകളുടെ ഉള്ളടക്കം എബ്രായത്തിൽ രേഖപ്പെടുത്തിയിട്ടില്ലാത്തതിനാൽ വ്യക്തമായ ഒരു ഉദ്ധരണി ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദാവീദിന്റെ വാചാടോപപരമായ താരതമ്യം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം അവതരിപ്പിച്ചിട്ടും, ദൈവിക നിർദേശം/പരിപാലനം സംബന്ധിച്ച മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിച്ചിട്ടില്ല.
