  naturalness: The overall register is clear, modern, and appropriately respectful. ‘മാനഭംഗപ്പെടുത്തിയ’ is understandable but can sound dated and euphemistic in modern Malayalam. ‘ലൈംഗികമായി അപമാനിച്ച’ retains the lexical breadth of the Hebrew while being clearer; the footnote can preserve the more explicit contextual rendering.
