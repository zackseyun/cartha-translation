  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദിന്റെ സഹോദരനായ ശിമെയയുടെ മകൻ യോനാദാബ് മറുപടി പറഞ്ഞു: “എന്റെ യജമാനൻ, ‘രാജാവിന്റെ പുത്രന്മാരായ യുവാക്കളെയെല്ലാം അവർ കൊന്നുകളഞ്ഞു’ എന്നു പറയരുതേ. അമ്നോൻ മാത്രമേ മരിച്ചിട്ടുള്ളൂ. അമ്നോൻ അബ്ശാലോമിന്റെ സഹോദരിയായ താമാറിനെ ലൈംഗികമായി അപമാനിച്ച ദിവസംമുതൽ ഇത് അബ്ശാലോമിന്റെ വാക്കനുസരിച്ച് നിശ്ചയിക്കപ്പെട്ടിരുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അബ്ശാലോമിന്റെ കല്പനപ്രകാരം ഇത് ഉറപ്പിക്കപ്പെട്ടിരുന്നു”; എബ്രായ പ്രയോഗം അബ്ശാലോമിന്റെ വാക്കിനെയോ കല്പനയെയോ ഉറച്ച തീരുമാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
