  rationale: ഒരു കാര്യം മുമ്പേ ഉറപ്പിക്കപ്പെട്ടിരുന്നു എന്ന ഫലാവസ്ഥയും ഭൂതകാലപൂർവതയും പ്രകടമാക്കുന്നു.
- source_word: מִיּוֹם עַנֹּתוֹ
  choice: അവൻ മാനഭംഗപ്പെടുത്തിയ ദിവസംമുതൽ
  rationale: ענה എന്ന ക്രിയയുടെ അപമാനിക്കൽ/ലൈംഗിക അതിക്രമം എന്നീ അർഥവ്യാപ്തികളെ സന്ദർഭോചിതവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു; കൂടുതൽ വ്യക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
