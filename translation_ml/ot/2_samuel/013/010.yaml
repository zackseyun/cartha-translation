  yaml_path: translation/ot/2_samuel/013/010.yaml
  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
translation:
  language: ml
  text: അപ്പോൾ അമ്നോൻ താമാറിനോട്[a], “ഭക്ഷണം അകത്തെ മുറിയിലേക്കു കൊണ്ടുവരിക; ഞാൻ നിന്റെ കൈയിൽനിന്ന് ഭക്ഷിക്കട്ടെ” എന്നു പറഞ്ഞു. താമാർ താൻ ഉണ്ടാക്കിയ പലഹാരങ്ങൾ എടുത്ത് അമ്നോൻ എന്ന തന്റെ സഹോദരന്റെ അടുക്കൽ അകത്തെ മുറിയിലേക്കു കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മുറിയിലേക്ക്.” എബ്രായപദമായ חֶדֶר ഒരു ഉൾമുറിയെയോ സ്വകാര്യ മുറിയെയോ സൂചിപ്പിക്കാം; സംഭവസ്ഥലത്തിന്റെ ഏകാന്തസ്വഭാവം വ്യക്തമാക്കാൻ ഇവിടെ “അകത്തെ മുറി” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאִי
  choice: കൊണ്ടുവരിക
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപം; താമാർ ഭക്ഷണം അമ്നോൻ ഇരിക്കുന്ന സ്ഥലത്തേക്കു കൊണ്ടുവരണമെന്ന നിർദേശം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַבִּרְיָה
  choice: ഭക്ഷണം
  rationale: കഴിക്കാനായി തയ്യാറാക്കിയ ആഹാരത്തെ സൂചിപ്പിക്കുന്ന പൊതുപദം; തുടർന്ന് വരുന്ന പ്രത്യേക വിഭവമായ לְבִבוֹת എന്ന പദത്തെ മുൻകൂട്ടി അതിവിശദമാക്കുന്നില്ല.
- source_word: הַחֶדֶר / הֶחָדְרָה
  choice: അകത്തെ മുറി / അകത്തെ മുറിയിലേക്ക്
  rationale: חֶדֶר ഒരു ഉൾമുറിയെയോ സ്വകാര്യ മുറിയെയോ സൂചിപ്പിക്കുന്നു; രണ്ട് പ്രയോഗങ്ങളിലും ഒരേ പരിഭാഷ നിലനിർത്തുന്നത് സ്ഥലത്തിന്റെ ഏകാന്തസ്വഭാവവും പാഠത്തിലെ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: וְאֶבְרֶה
  choice: ഞാൻ ... ഭക്ഷിക്കട്ടെ
  rationale: ברה എന്ന ക്രിയയുടെ കോഹോർട്ടേറ്റീവ് ഭാവം ലക്ഷ്യമോ ആഗ്രഹമോ പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഭക്ഷിക്കട്ടെ’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִיָּדֵךְ
  choice: നിന്റെ കൈയിൽനിന്നു
  rationale: എബ്രായയിലെ ഏകവചന ‘കൈ’ നേരിട്ട് നിലനിർത്തി അമ്നോന്റെ അഭ്യർഥനയിലെ വ്യക്തിപരമായ അടുപ്പം സംരക്ഷിക്കുന്നു.
- source_word: הַלְּבִבוֹת
  choice: പലഹാരങ്ങൾ
  rationale: മുൻസന്ദർഭത്തിൽ താമാർ തയ്യാറാക്കിയ പ്രത്യേക ഭക്ഷ്യവസ്തുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; അവയുടെ കൃത്യരൂപം അനിശ്ചിതമായതിനാൽ ‘പലഹാരങ്ങൾ’ സ്വാഭാവികവും ആവശ്യത്തിന് പൊതുവുമായ പദമാണ്.
- source_word: אָחִיהָ
  choice: തന്റെ സഹോദരനായ
  rationale: ബന്ധപദം തുറന്നുപറയുന്നത് മൂലപാഠത്തിലെ കുടുംബബന്ധവും ആഖ്യാനത്തിന്റെ ധാർമിക ഗൗരവവും നിലനിർത്തുന്നു.
