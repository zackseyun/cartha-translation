source:
  edition: WLC
  text: וְ/לֹֽא דִבֶּ֧ר אַבְשָׁל֛וֹם עִם אַמְנ֖וֹן לְ/מֵ/רָ֣ע וְ/עַד ט֑וֹב כִּֽי שָׂנֵ֤א אַבְשָׁלוֹם֙ אֶת אַמְנ֔וֹן עַל דְּבַר֙ אֲשֶׁ֣ר עִנָּ֔ה אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
translation:
  language: ml
  text: അബ്ശാലോം അമ്നോനോട് ചീത്തയോ നല്ലതോ ഒന്നും സംസാരിച്ചില്ല[a]. അമ്നോൻ അബ്ശാലോമിന്റെ സഹോദരിയായ താമാറിനെ ലൈംഗികമായി അപമാനിച്ചതിനാൽ[b] അബ്ശാലോം അവനെ വെറുത്തിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ചീത്തമുതൽ നല്ലതുവരെ’; അബ്ശാലോം അമ്നോനോട് യാതൊന്നും സംസാരിച്ചില്ല എന്നർഥമുള്ള ധ്രുവപ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ‘താഴ്ത്തിയതിനാൽ’ അഥവാ ‘അപമാനിച്ചതിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ സന്ദർഭത്തിൽ എബ്രായക്രിയ താമാറിനോടു ചെയ്ത ലൈംഗിക ലംഘനത്തെയും അപമാനത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... עִם
  choice: അമ്നോനോട് ... സംസാരിച്ചില്ല
  rationale: דבר עם എന്ന പ്രയോഗം ഒരാളോടു സംസാരിക്കുക എന്ന സാധാരണ അർഥത്തിലാണ്. മലയാളത്തിൽ ‘-ഓട് സംസാരിക്കുക’ സ്വാഭാവികവും ബന്ധസൂചകവുമാണ്.
- source_word: לְמֵרָע וְעַד טוֹב
  choice: നല്ലതോ ചീത്തയോ ഒന്നും
  rationale: വാക്കിന് വാക്കായി ‘ചീത്തമുതൽ നല്ലതുവരെ’ എന്ന ധ്രുവപ്രയോഗം ഇവിടെ യാതൊന്നും സംസാരിച്ചില്ല എന്ന സമഗ്രമായ അർഥം നൽകുന്നു. മലയാളത്തിലെ ഈ രൂപം ധ്രുവങ്ങൾ നിലനിർത്തിക്കൊണ്ട് ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כִּי
  choice: '... നടത്തിയതിനാൽ'
  rationale: ഇവിടെ כִּי അബ്ശാലോമിന്റെ മൗനത്തിനും വെറുപ്പിനുമുള്ള കാരണം അവതരിപ്പിക്കുന്നു; ‘-തിനാൽ’ വ്യക്തമായ കാരണബന്ധം നൽകുന്നു.
- source_word: שָׂנֵא
  choice: വെറുത്തിരുന്നു
  rationale: ക്രിയയുടെ ശക്തമായ നേരാർഥമായ വെറുപ്പ് നിലനിർത്തുന്നു; കഥാസന്ദർഭത്തിലെ തുടരുന്ന മനോഭാവം ‘വെറുത്തിരുന്നു’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל דְּבַר אֲשֶׁר
  choice: '... നടത്തിയതിനാൽ'
  rationale: വാച്യമായി ‘ആ കാര്യത്തെച്ചൊല്ലി’ എന്ന നാമപ്രയോഗമാണെങ്കിലും, മലയാളത്തിൽ കാരണബന്ധമായി നൽകുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്; ഉറവിടത്തിലെ കാരണം മാറ്റുന്നില്ല.
- source_word: עִנָּה
  choice: ലൈംഗിക അതിക്രമം നടത്തി
  rationale: ענה എന്ന ക്രിയയ്ക്ക് താഴ്ത്തുക, പീഡിപ്പിക്കുക എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും ഈ സന്ദർഭത്തിൽ അത് താമാറിനോടു ചെയ്ത ലൈംഗിക ലംഘനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. തിരഞ്ഞെടുപ്പ് സംഭവത്തിന്റെ സ്വഭാവം മറച്ചുവയ്ക്കാതെ അറിയിക്കുന്നു; ക്രിയയ്ക്കുള്ള എല്ലാ നിയമപരമായ സൂക്ഷ്മതകളും അതിലേർപ്പെടുത്തുന്നില്ല.
- source_word: אֲחֹתוֹ
  choice: തന്റെ സഹോദരിയായ
  rationale: പ്രത്യയം അബ്ശാലോമിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തന്റെ’ എന്നത് മലയാളത്തിൽ ആ ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ענה എന്ന ക്രിയയുടെ ലൈംഗികസന്ദർഭത്തിലുള്ള വിവർത്തനം
  choice: ലൈംഗിക അതിക്രമം നടത്തി
  alternative: അപമാനിച്ചു / താഴ്ത്തി / ബലാത്സംഗം ചെയ്തു
  rationale: ‘അപമാനിച്ചു’ എന്നത് സംഭവത്തിന്റെ ലൈംഗിക സ്വഭാവം മറയ്ക്കാം; ‘ബലാത്സംഗം ചെയ്തു’ സന്ദർഭപരമായി ശരിയായിരുന്നാലും ഈ വാക്യത്തിലെ ക്രിയയ്ക്ക് ഒരു നിർദിഷ്ട നിയമപദം മാത്രം ചുമത്താം. ‘ലൈംഗിക അതിക്രമം നടത്തി’ അക്രമത്തിന്റെ സ്വഭാവവും ഗൗരവവും വ്യക്തമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. ഹീബ്രു ധ്രുവപ്രയോഗം സ്വാഭാവിക മലയാളത്തിലാക്കി, അതിന്റെ കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. പേരുകൾ ‘അബ്ശാലോം’, ‘അമ്നോൻ’, ‘താമാർ’ എന്ന സാധാരണ ബൈബിൾ-മലയാള രൂപങ്ങളിൽ നൽകി.
