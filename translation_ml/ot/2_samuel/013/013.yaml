source:
  edition: WLC
  text: וַ/אֲנִ֗י אָ֤נָה אוֹלִיךְ֙ אֶת חֶרְפָּתִ֔/י וְ/אַתָּ֗ה תִּהְיֶ֛ה כְּ/אַחַ֥ד הַ/נְּבָלִ֖ים בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּה֙ דַּבֶּר נָ֣א אֶל הַ/מֶּ֔לֶךְ כִּ֛י לֹ֥א יִמְנָעֵ֖/נִי מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
translation:
  language: ml
  text: ഞാനോ, എന്റെ അപമാനം എവിടേക്കു കൊണ്ടുപോകും?[a] നീയോ ഇസ്രായേലിലെ നീചന്മാരിൽ ഒരാളെപ്പോലെയാകും.[b] ഇപ്പോൾ, ദയവായി രാജാവിനോടു സംസാരിക്കൂ; അദ്ദേഹം എന്നെ നിനക്കു നൽകുന്നതിൽ വിസമ്മതിക്കുകയില്ല.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അപമാനം” എന്നതിന് “ലജ്ജ” അല്ലെങ്കിൽ “നിന്ദ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം ധാർമികമായി അധമനും ലജ്ജയില്ലാത്തവനുമായ ഒരാളെ സൂചിപ്പിക്കാം; വെറും ബുദ്ധിയില്ലാത്ത ഒരാളെ മാത്രമല്ല. “ഇസ്രായേലിലെ മൂഢന്മാരിൽ ഒരാളെപ്പോലെ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'അർഥം: “എന്നെ നിനക്കു നൽകാൻ അദ്ദേഹം വിസമ്മതിക്കുകയില്ല.” താമാർ ഇത് യഥാർഥമായ ഒരു അഭ്യർഥനയായി പറഞ്ഞതാണോ, അതോ അമ്നോനെ പിന്തിരിപ്പിക്കാനോ സമയം നേടാനോ ഉള്ള നിരാശാഭരിതമായ ശ്രമമായിരുന്നോ എന്നു വ്യക്തമല്ല.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָנָה אוֹלִיךְ אֶת־חֶרְפָּתִי
  choice: എന്റെ അപമാനം എവിടെ കൊണ്ടുപോകും?
  rationale: ചലനക്രിയയും ആലങ്കാരികമായ ചോദ്യവും നിലനിർത്തുന്നു. חֶרְפָּה ഇവിടെ പൊതുവായ നിന്ദയും സാമൂഹിക അപമാനവും സൂചിപ്പിക്കുന്നു.
- source_word: כְּאַחַד הַנְּבָלִים
  choice: നീചന്മാരിൽ ഒരാളെപ്പോലെ
  rationale: נָבָל വെറും ബുദ്ധിക്കുറവുള്ളവനെയല്ല, ധാർമികമായി അധമനും ലജ്ജയില്ലാത്തവനുമായ ആളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘നീചൻ’ ആ ധാർമിക അപലപനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: דַּבֶּר־נָא
  choice: ദയവായി ... സംസാരിക്കൂ
  rationale: ആജ്ഞാരൂപത്തോടു ചേർന്ന അപേക്ഷാസൂചകമായ נָאയുടെ അടിയന്തരമായ അഭ്യർഥനാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֹא יִמְנָעֵנִי מִמֶּךָּ
  choice: അദ്ദേഹം എന്നെ നിനക്കു തരാതിരിക്കുകയില്ല
  rationale: അക്ഷരാർഥമായ ‘എന്നെ നിന്നിൽനിന്ന് തടഞ്ഞുവെക്കുകയില്ല’ എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം, രാജാവ് അവളെ അവന് നൽകാൻ വിസമ്മതിക്കില്ല എന്നതാണ്. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രീതിയിൽ അത് നൽകുന്നു.
theological_decisions:
- issue: രാജാവിനോടുള്ള താമാറിന്റെ അഭ്യർഥനയുടെ ഉദ്ദേശ്യം
  choice: അവളെ അമ്നോന് നൽകാൻ രാജാവ് വിസമ്മതിക്കില്ലെന്ന താമാറിന്റെ വാക്കുകൾ നേരിട്ടുതന്നെ പരിഭാഷപ്പെടുത്തി; അവളുടെ ഉദ്ദേശ്യം തീർപ്പാക്കിയില്ല.
  alternative: താമാർ വിവാഹം യഥാർഥത്തിൽ സാധ്യമാണെന്ന് വിശ്വസിച്ചു; അല്ലെങ്കിൽ ആക്രമണം വൈകിപ്പിക്കാൻ തന്ത്രപരമായി സംസാരിച്ചു.
  rationale: ഈ നിർദേശം നിയമപരമായി സാധ്യമായിരുന്നോ, രാഷ്ട്രീയമായി യാഥാർഥ്യമുള്ളതായിരുന്നോ, സമയം നേടാനുള്ള ശ്രമമായിരുന്നോ എന്നു വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഈ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. മൂലത്തിലെ ആലങ്കാരിക ചോദ്യം നിലനിർത്തി; ‘നീചന്മാർ’ എന്ന പ്രയോഗം ധാർമിക അധമത്വം വ്യക്തമാക്കുന്നു. അവസാന പ്രയോഗം അക്ഷരാർഥമായ മലയാളത്തിലെ അസ്വാഭാവികത ഒഴിവാക്കി സന്ദർഭോചിതമായി നൽകിയിരിക്കുന്നു.
