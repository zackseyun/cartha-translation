  to: എന്നാൽ അബ്ശാലോം ഓടിപ്പോയി, ഗെശൂർരാജാവായ അമ്മീഹൂരിന്റെ മകൻ തൽമായിയുടെ അടുക്കലേക്കു പോയി. അവൻ[a] തന്റെ മകനെച്ചൊല്ലി എല്ലാ നാളും ദുഃഖിച്ചു.
