  edition: WLC
  text: וְ/אַבְשָׁל֣וֹם בָּרַ֔ח וַ/יֵּ֛לֶךְ אֶל תַּלְמַ֥י בֶּן עמיחור מֶ֣לֶךְ גְּשׁ֑וּר וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
translation:
  language: ml
  text: എന്നാൽ അബ്ശാലോം ഓടിപ്പോയി, ഗെശൂർരാജാവായ അമ്മീഹൂരിന്റെ മകൻ തൽമായിയുടെ അടുക്കലേക്കു പോയി. അവൻ[a] തന്റെ മകനെച്ചൊല്ലി എല്ലാ നാളും ദുഃഖിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൻ ദുഃഖിച്ചു’ എന്നതിലെ കർത്താവിനെ എബ്രായപാഠം പേരെടുത്തു പറയുന്നില്ല; സന്ദർഭത്തിൽ അത് ദാവീദാണെന്ന് മനസ്സിലാകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁל֣וֹם
  choice: എന്നാൽ അബ്ശാലോം
  rationale: വാക്യാരംഭത്തിലെ וְ ആഖ്യാനത്തിലെ വൈരുധ്യബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്നാൽ’ എന്നു നൽകി; വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: בָּרַ֔ח
  choice: ഓടിപ്പോയി
  rationale: ഒളിച്ചോടുക, രക്ഷപ്പെടാൻ പോകുക എന്ന അർഥമുള്ള ക്രിയയെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ രീതിയിൽ നൽകി.
- source_word: וַ/יֵּ֛לֶךְ אֶל
  choice: അടുക്കൽ ചെന്നു
  rationale: ഒരു വ്യക്തിയുടെ സന്നിധിയിലേക്കു പോയതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תַּלְמַ֥י בֶּן עמיחור
  choice: അമ്മീഹൂരിന്റെ മകൻ തല്മായി
  rationale: എബ്രായ പിതൃനാമഘടന മലയാളത്തിന്റെ സ്വാഭാവിക പദക്രമത്തിലാക്കി; പേരുകൾ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מֶ֣לֶךְ גְּשׁ֑וּר
  choice: ഗെശൂർരാജാവായ
  rationale: തല്മായിയെ വിശേഷിപ്പിക്കുന്ന എബ്രായ സംയുക്തഘടന മലയാളത്തിൽ ചുരുക്കവും വ്യക്തവുമായി പുനഃസൃഷ്ടിച്ചു.
- source_word: וַ/יִּתְאַבֵּ֥ל
  choice: ദുഃഖാചരണം നടത്തി
  rationale: אבל എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം മരണത്തെത്തുടർന്നുള്ള വിലാപവും ദുഃഖാചരണവും സൂചിപ്പിക്കുന്നു; വെറും മാനസികദുഃഖത്തേക്കാൾ ഈ പ്രയോഗം ആ അർഥം നന്നായി നിലനിർത്തുന്നു.
- source_word: עַל בְּנ֖/וֹ
  choice: തന്റെ മകനെച്ചൊല്ലി
  rationale: ദുഃഖാചരണത്തിന്റെ കാരണമായ മകനെ സൂചിപ്പിക്കുന്ന עַל സ്വാഭാവികമായ മലയാളത്തിൽ ‘-നെച്ചൊല്ലി’ എന്നു നൽകി.
- source_word: כָּל הַ/יָּמִֽים
  choice: ദിവസങ്ങളൊക്കെയും
  rationale: എബ്രായത്തിലെ കാലദൈർഘ്യപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികവും, അത് ജീവിതകാലം മുഴുവൻ എന്നായി അതിവ്യാഖ്യാനിക്കാത്തതുമായ രൂപം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: וַיִּתְאַבֵּל എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: അവൻ[a]
  alternative: ദാവീദ്
  rationale: എബ്രായത്തിൽ കർത്താവ് പ്രത്യക്ഷമായി പേരെടുത്തിട്ടില്ല. സന്ദർഭം ദാവീദിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, മൂലപാഠത്തിലെ സർവനാമപരമായ അനിശ്ചിതത്വം പ്രധാനവാചകത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ സന്ദർഭവിവരം നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങൾ സാധാരണ മലയാള ലിപ്യന്തരരീതിയിൽ നൽകി. മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത കർത്താവിനെ പ്രധാനവാചകത്തിൽ അനാവശ്യമായി വ്യക്തമാക്കാതെ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
