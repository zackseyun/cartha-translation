revisions:
- from: ഇപ്പോൾ എന്റെ യജമാനനായ രാജാവ്, ‘രാജാവിന്റെ പുത്രന്മാരെല്ലാം മരിച്ചുപോയി’ എന്ന കാര്യം മനസ്സിൽ വെക്കരുതേ[a]. അമ്നോൻ മാത്രമാണ് മരിച്ചത്.
  to: ഇപ്പോൾ എന്റെ പ്രഭുവായ രാജാവേ, ‘രാജാവിന്റെ പുത്രന്മാരെല്ലാം മരിച്ചിരിക്കുന്നു’ എന്നു മനസ്സിൽ വെക്കരുത്[a]; അമ്നോൻ മാത്രമാണ് മരിച്ചിരിക്കുന്നത്.
  rationale: The revision retains the Hebrew corrective force and ambiguity of דָּבָר (‘word/matter’), improves the direct courtly address, and makes the quoted report the explicit content of what David must not take to heart. Parallel stative Malayalam forms preserve the contrast between the false report and the fact that only Amnon is dead.
