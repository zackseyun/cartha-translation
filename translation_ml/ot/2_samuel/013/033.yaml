  text: וְ/עַתָּ֡ה אַל יָשֵׂם֩ אֲדֹנִ֨/י הַ/מֶּ֤לֶךְ אֶל לִבּ/וֹ֙ דָּבָ֣ר לֵ/אמֹ֔ר כָּל בְּנֵ֥י הַ/מֶּ֖לֶךְ מֵ֑תוּ כִּֽי אִם אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵֽת־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/033.yaml
  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
translation:
  language: ml
  text: ഇപ്പോൾ എന്റെ പ്രഭുവായ രാജാവേ, ‘രാജാവിന്റെ പുത്രന്മാരെല്ലാം മരിച്ചിരിക്കുന്നു’ എന്നു മനസ്സിൽ വെക്കരുത്[a]; അമ്നോൻ മാത്രമാണ് മരിച്ചിരിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായയിൽ അക്ഷരാർഥം: ‘ഈ വാക്ക്/കാര്യം തന്റെ ഹൃദയത്തിൽ വെക്കരുത്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: യോനാദാബിന്റെ തിരുത്തൽ പ്രസ്താവനയിലേക്കുള്ള സംഭാഷണപരമായ മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אַל יָשֵׂם ... אֶל לִבּוֹ
  choice: മനസ്സിൽ വെക്കരുതേ
  rationale: ‘ഹൃദയത്തിൽ വെക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആദരസൂചകവുമായ അഭ്യർഥന നൽകുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: രാജസദസ്സിലെ ആദരപൂർവമായ അഭിസംബോധന മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: דָּבָר
  choice: കാര്യം
  rationale: തുടർന്ന് ഉദ്ധരിക്കുന്ന റിപ്പോർട്ടിനെയോ അവകാശവാദത്തെയോ സൂചിപ്പിക്കാൻ വിശാലവും സന്ദർഭോചിതവുമായ പദം.
- source_word: לֵאמֹר
  choice: ‘…’ എന്ന
  rationale: തുടർന്നുള്ള വാക്കുകളെ പ്രസ്താവനയുടെ ഉള്ളടക്കമായി സ്വാഭാവിക മലയാളരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ പുത്രന്മാരെല്ലാം
  rationale: രാജാവിന്റെ ആൺമക്കളെയാണ് സന്ദർഭം നിർദിഷ്ടമായി സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗനിരപേക്ഷമായി പൊതുവാക്കാതെ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു.
- source_word: מֵתוּ
  choice: മരിച്ചുപോയി
  rationale: റിപ്പോർട്ടായി ലഭിച്ച മരണവാർത്തയുടെ പൂർത്തിയായ സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כִּי אִם ... לְבַדּוֹ
  choice: മാത്രമാണ്
  rationale: എല്ലാവരും മരിച്ചെന്ന റിപ്പോർട്ടിനെ തിരുത്തി അമ്നോന്റെ മരണം മാത്രം സംഭവിച്ചുവെന്ന വ്യതിരിക്തത വ്യക്തമാക്കുന്നു.
- source_word: מֵת
  choice: മരിച്ചത്
  rationale: അമ്നോന്റെ മരണത്തെ മുൻവാക്യത്തിലെ തെറ്റായ പൊതുവായ റിപ്പോർട്ടിനോട് സംക്ഷിപ്തമായി വിരുദ്ധമാക്കുന്നു.
