translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രാജസദസ്സിലെ ആദരഭാവം ‘എന്റെ യജമാനനായ രാജാവ്’ എന്നും അഭ്യർഥനാരൂപം ‘വെക്കരുതേ’ എന്നും ഉപയോഗിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
