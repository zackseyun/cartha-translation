  text: וַ/תִּקַּ֤ח אֶת הַ/מַּשְׂרֵת֙ וַ/תִּצֹ֣ק לְ/פָנָ֔י/ו וַ/יְמָאֵ֖ן לֶ/אֱכ֑וֹל וַ/יֹּ֣אמֶר אַמְנ֗וֹן הוֹצִ֤יאוּ כָל אִישׁ֙ מֵֽ/עָלַ֔/י וַ/יֵּצְא֥וּ כָל אִ֖ישׁ מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ പാത്രമെടുത്ത് പലഹാരങ്ങൾ അവന്റെ മുമ്പിൽ വിളമ്പി[a]. എന്നാൽ അവൻ ഭക്ഷിക്കാൻ വിസമ്മതിച്ചു. അമ്നോൻ പറഞ്ഞു: “എല്ലാവരെയും എന്റെ അടുക്കൽനിന്ന് പുറത്താക്കൂ.” അങ്ങനെ എല്ലാവരും അവന്റെ അടുക്കൽനിന്ന് പുറത്തുപോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “അവന്റെ മുമ്പിൽ ഒഴിച്ചു.” ഇവിടെ ഭക്ഷണം പാത്രത്തിൽനിന്ന് എടുത്ത് വിളമ്പുന്നതിനെയാണ് ഹീബ്രു ക്രിയ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  choice: പാത്രം
  rationale: ഈ സന്ദർഭത്തിൽ ഭക്ഷണം പാകം ചെയ്യാനോ വിളമ്പാനോ ഉപയോഗിച്ച പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പാത്രത്തിന്റെ കൃത്യരൂപം വ്യക്തമല്ലാത്തതിനാൽ പൊതുവായ ‘പാത്രം’ സ്വാഭാവികവും സൂക്ഷ്മവുമാണ്.
- source_word: וַתִּצֹק לְפָנָיו
  choice: പലഹാരങ്ങൾ അവന്റെ മുമ്പിൽ വിളമ്പി
  rationale: יצק എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘ഒഴിക്കുക’ എന്നാണ്; എന്നാൽ ഇവിടെ മുമ്പ് തയ്യാറാക്കിയ പലഹാരങ്ങൾ പാത്രത്തിൽനിന്ന് അമ്നോന്റെ മുമ്പിൽ വിളമ്പുന്നതാണ് സന്ദർഭം. ‘വിളമ്പി’ സ്വാഭാവിക മലയാളത്തിൽ പ്രവർത്തിയുടെ സന്ദർഭാർഥം നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיְמָאֵן לֶאֱכֹל
  choice: അവൻ ഭക്ഷിക്കാൻ വിസമ്മതിച്ചു
  rationale: מָאֵן വെറും താത്പര്യമില്ലായ്മയല്ല, മനഃപൂർവമായ നിരസനമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הוֹצִיאוּ כָל אִישׁ
  choice: എല്ലാവരെയും ... പുറത്താക്കൂ
  rationale: ഹിഫിൽ ആജ്ഞാരൂപം മറ്റുള്ളവരെ പുറത്തുപോകാൻ ഇടയാക്കുക എന്ന causative അർഥം നൽകുന്നു. כָל אִישׁ ഇവിടെ സന്നിഹിതരായ എല്ലാവരെയും കൂട്ടായി സൂചിപ്പിക്കുന്നു.
- source_word: מֵעָלַי / מֵעָלָיו
  choice: എന്റെ അടുക്കൽനിന്ന് / അവന്റെ അടുക്കൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിലെ ‘മേൽനിന്ന്’ എന്ന പ്രയോഗം ഇവിടെ ഒരാളുടെ സമീപത്തുനിന്നോ സാന്നിധ്യത്തിൽനിന്നോ മാറിപ്പോകുക എന്ന ഹീബ്രു ഭാഷാശൈലിയാണ്. മലയാളത്തിൽ ‘അടുക്കൽനിന്ന്’ ആ അർഥവും കല്പന-വിവരണ സമാന്തരതയും നിലനിർത്തുന്നു.
