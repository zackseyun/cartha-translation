translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും കഥനത്തിന് യോജിച്ചതുമായ മലയാളം. ‘പലഹാരങ്ങൾ’ എന്നത് മുൻസന്ദർഭത്തിലെ തയ്യാറാക്കിയ ഭക്ഷണവസ്തുക്കളെ വ്യക്തമാക്കുന്നു. ഉറവിടത്തിലെ ആവർത്തനവും അമ്നോന്റെ മനഃപൂർവമായ നിരസനവും നിലനിർത്തിയിരിക്കുന്നു.
