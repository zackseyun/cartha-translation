  text: וַ/תֹּ֣אמֶר ל֗/וֹ אַל אָחִ/י֙ אַל תְּעַנֵּ֔/נִי כִּ֛י לֹא יֵֽעָשֶׂ֥ה כֵ֖ן בְּ/יִשְׂרָאֵ֑ל אַֽל תַּעֲשֵׂ֖ה אֶת הַ/נְּבָלָ֥ה הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/012.yaml
  text: She said to him[a], “No, my brother, do not violate me, for such a thing is not done in Israel[b]. Do not do this disgraceful thing.”
translation:
  language: ml
  text: 'അവൾ അവനോടു പറഞ്ഞു: “അരുത്, എന്റെ സഹോദരാ! എന്നെ മാനഭംഗപ്പെടുത്തരുത്[a]. ഇങ്ങനെയൊരു കാര്യം ഇസ്രായേലിൽ ചെയ്യാറില്ല. ഈ നീചകൃത്യം ചെയ്യരുത്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നെ അപമാനിക്കരുത്” അല്ലെങ്കിൽ “എന്നെ ബലാത്സംഗം ചെയ്യരുത്” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ ലൈംഗിക അതിക്രമത്തെയും അതുമൂലമുള്ള അപമാനത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ഈ ലജ്ജാകരമായ പ്രവൃത്തി” അല്ലെങ്കിൽ “ഈ അതിനീചമായ പ്രവൃത്തി” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദം വെറും വിഡ്ഢിത്തത്തെയല്ല, ധാർമികമായി ഞെട്ടിപ്പിക്കുന്ന ദുഷ്പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לוֹ
  choice: അവൾ അവനോടു പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്ന സാധാരണ പ്രയോഗം. മലയാളത്തിലെ സ്വാഭാവികമായ കഥനശൈലിയിൽ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: אַל ... אַל
  choice: അരുത് ... ചെയ്യരുത്
  rationale: ആദ്യത്തെ אַל വികാരതീവ്രമായ നിഷേധവിളിയായും രണ്ടാമത്തേത് നേരിട്ടുള്ള വിലക്കായും വരുന്നു. ഈ വ്യത്യാസം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אָחִי
  choice: എന്റെ സഹോദരാ
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള രക്തബന്ധപദം അക്ഷരാർഥത്തിൽ നിലനിർത്തി; സംഭവത്തിന്റെ ഭീകരതയിൽ ഈ കുടുംബബന്ധം നിർണായകമാണ്.
- source_word: תְּעַנֵּנִי
  choice: എന്നെ മാനഭംഗപ്പെടുത്തരുത്
  rationale: ענה എന്ന ധാതുവിന്റെ പീയേൽ രൂപം ഈ സന്ദർഭത്തിൽ ലൈംഗിക അതിക്രമത്തോടൊപ്പം അപമാനവും അവഹേളനവും സൂചിപ്പിക്കുന്നു. ‘മാനഭംഗപ്പെടുത്തുക’ ഈ രണ്ടുവശങ്ങളും മലയാളത്തിൽ സംക്ഷിപ്തമായി ഉൾക്കൊള്ളുന്നു; എന്നാൽ പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  choice: ഇങ്ങനെയൊരു കാര്യം ഇസ്രായേലിൽ ചെയ്യാറില്ല
  rationale: עשה എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഒരു സമൂഹത്തിലെ അംഗീകൃത ധാർമികനടപ്പിനെക്കുറിച്ചുള്ള പൊതുപ്രസ്താവനയാണ്. മലയാളത്തിലെ ‘ചെയ്യാറില്ല’ ആ സാമൂഹിക-ധാർമിക വിലക്കിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: ഈ നീചകൃത്യം
  rationale: נְבָלָה വെറും ബുദ്ധിഹീനതയല്ല, സമൂഹത്തിന്റെയും ധാർമികക്രമത്തിന്റെയും അതിരുകൾ ലംഘിക്കുന്ന ലജ്ജാകരവും അധമവുമായ പ്രവൃത്തിയാണ്. ‘നീചകൃത്യം’ അതിന്റെ ശക്തമായ നൈതികഭാരം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിൽ ഇങ്ങനെയൊരു കാര്യം ‘ചെയ്യാറില്ല’ എന്ന പ്രസ്താവനയുടെ സ്വഭാവം
  choice: സമൂഹത്തിന്റെ ധാർമികമാനദണ്ഡത്തിലേക്കുള്ള അഭ്യർഥനയായി പരിഭാഷപ്പെടുത്തി
  alternative: ഇസ്രായേലിൽ ഇത് ഒരിക്കലും സംഭവിക്കുന്നില്ല എന്ന വസ്തുതാപരമായ അവകാശവാദമായി പരിഭാഷപ്പെടുത്തുക
  rationale: ഹീബ്രുവിലെ കർമണിപ്രയോഗം ഇവിടെ സംഭവസാധ്യത നിഷേധിക്കുന്നതിനെക്കാൾ, ഇസ്രായേലിൽ അനുവദനീയമല്ലാത്തതും ചെയ്യാൻ പാടില്ലാത്തതുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. താമാറിന്റെ അടിയന്തരമായ അപേക്ഷയുടെ വികാരതീവ്രത ‘അരുത്’ എന്നതിലൂടെ നിലനിർത്തി. ലൈംഗിക അതിക്രമം മറച്ചുവയ്ക്കാതെയും ഹീബ്രുപദത്തിലെ അപമാനാർഥം നഷ്ടപ്പെടുത്താതെയും ‘മാനഭംഗപ്പെടുത്തരുത്’ തെരഞ്ഞെടുത്തു.
