  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ദുഃഖത്തിന്റെ പ്രവൃത്തികൾ വ്യക്തമായി നിലനിർത്തി; അനിശ്ചിതമായ വസ്ത്രപദം മുഖ്യവാചകത്തിൽ അതിവിശദമാക്കാതെ അടിക്കുറിപ്പിൽ പ്രധാന സാധ്യതകൾ നൽകി.
