source:
  edition: WLC
  text: וַ/תִּקַּ֨ח תָּמָ֥ר אֵ֨פֶר֙ עַל רֹאשָׁ֔/הּ וּ/כְתֹ֧נֶת הַ/פַּסִּ֛ים אֲשֶׁ֥ר עָלֶ֖י/הָ קָרָ֑עָה וַ/תָּ֤שֶׂם יָדָ/הּ֙ עַל רֹאשָׁ֔/הּ וַ/תֵּ֥לֶךְ הָל֖וֹךְ וְ/זָעָֽקָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/019.yaml
  text: Then Tamar put ashes on her head[a], tore the robe of many colors that was on her, put her hand on her head, and went away, going and crying out.
translation:
  language: ml
  text: അപ്പോൾ താമാർ തലയിൽ ചാരം വാരിയിട്ടു; താൻ ധരിച്ചിരുന്ന പ്രത്യേക വസ്ത്രം[a] കീറി; തന്റെ കൈ തലയിൽ വെച്ചുകൊണ്ട് ഉറക്കെ നിലവിളിച്ചുകൊണ്ട് നടന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “നീളൻ കൈയുള്ള വസ്ത്രം,” “അലങ്കരിച്ച വസ്ത്രം,” അഥവാ “പല നിറങ്ങളുള്ള വസ്ത്രം.” എബ്രായപ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; ഈ സന്ദർഭത്തിൽ രാജാവിന്റെ കന്യകമാരായ പുത്രിമാർ ധരിച്ചിരുന്ന പ്രത്യേക വസ്ത്രത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵפֶר
  choice: ചാരം
  rationale: ദുഃഖാചരണത്തിന്റെ അടയാളമായി തലയിൽ ഇടുന്ന ചാരത്തെയാണ് ഈ ഏകവചന നാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ചാരം’ സ്വാഭാവികമാണ്.
- source_word: וַתִּקַּח ... עַל רֹאשָׁהּ
  choice: തലയിൽ ചാരം വാരിയിട്ടു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ചാരം എടുത്തു തലയിൽ’ എന്ന പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ദുഃഖസൂചകമായ മൂർത്തപ്രവൃത്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כְתֹנֶת הַפַּסִּים
  choice: വിശേഷവസ്ത്രം
  rationale: വസ്ത്രത്തിന്റെ കൃത്യമായ രൂപം സംബന്ധിച്ച് എബ്രായപ്രയോഗം അനിശ്ചിതമാണ്. കൈകാലറ്റംവരെ നീളുന്ന വസ്ത്രം, അലങ്കരിച്ച വസ്ത്രം, പല നിറങ്ങളുള്ള വസ്ത്രം എന്നീ സാധ്യതകളിൽ ഒന്നിനെ മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കാതെ, സന്ദർഭത്തിൽ രാജാവിന്റെ കന്യകമാരായ പുത്രിമാരെ തിരിച്ചറിയിച്ചിരുന്ന പ്രത്യേക വസ്ത്രം എന്ന ആശയം നൽകുന്നു.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: താൻ ധരിച്ചിരുന്ന
  rationale: ‘അവളുടെമേൽ ഉണ്ടായിരുന്ന’ എന്ന ബന്ധവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: קָרָעָה
  choice: കീറി
  rationale: ദുഃഖാചരണത്തിൽ വസ്ത്രം കീറുന്ന പ്രവൃത്തിക്കുള്ള സാധാരണവും നേരിട്ടുമുള്ള പദം.
- source_word: וַתָּשֶׂם יָדָהּ עַל רֹאשָׁהּ
  choice: കൈ തലയിൽ വെച്ചുകൊണ്ട്
  rationale: ദുഃഖത്തിന്റെയും അപമാനത്തിന്റെയും ശരീരഭാവം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  choice: ഉറക്കെ നിലവിളിച്ചുകൊണ്ട് നടന്നുപോയി
  rationale: നടന്നുകൊണ്ടിരിക്കെ തുടർച്ചയായി ഉറക്കെ കരഞ്ഞുവിളിച്ചെന്ന ദൈർഘ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: זָעָקָה
  choice: ഉറക്കെ നിലവിളിച്ചു
  rationale: ശബ്ദമുയർത്തിയുള്ള കരച്ചിലോ വിളിയോ സൂചിപ്പിക്കുന്നു; അത് വിലാപമോ പ്രതിഷേധമോ നിലവിളിയോ എന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
