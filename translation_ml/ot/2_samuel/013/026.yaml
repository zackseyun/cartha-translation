source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם וָ/לֹ֕א יֵֽלֶךְ נָ֥א אִתָּ֖/נוּ אַמְנ֣וֹן אָחִ֑/י וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֥/מָּה יֵלֵ֖ךְ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/026.yaml
  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്ശാലോം പറഞ്ഞു[a]: “ഇല്ലെങ്കിൽ, ദയവായി എന്റെ സഹോദരനായ അമ്നോൻ ഞങ്ങളോടൊപ്പം പോകട്ടെ.” എന്നാൽ രാജാവ് അവനോടു ചോദിച്ചു: “അവൻ നിന്നോടൊപ്പം പോകേണ്ടത് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “അങ്ങ് പോകുന്നില്ലെങ്കിൽ, ദയവായി എന്റെ സഹോദരനായ അമ്നോൻ ഞങ്ങളോടൊപ്പം പോകട്ടെ.” എബ്രായപ്രയോഗം അപൂർണമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു / എന്നാൽ ... ചോദിച്ചു
  rationale: ആദ്യ വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമാണ്; രാജാവിന്റെ എതിർചോദ്യം സൂചിപ്പിക്കാൻ രണ്ടാമത്തെ സന്ദർഭത്തിൽ ‘എന്നാൽ’ ഉപയോഗിച്ചു. ചോദ്യം വരുന്നതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികമായി അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וָלֹא
  choice: അങ്ങനെയെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ രാജാവിന്റെ വിസമ്മതത്തെ ആശ്രയിക്കുന്ന അപൂർണപ്രയോഗമാണിത്. മലയാളത്തിൽ ‘അങ്ങനെയെങ്കിൽ’ ആ സന്ദർഭബന്ധം സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ വ്യക്തമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: נָא
  choice: ദയവായി
  rationale: വിനീതമായ അഭ്യർഥന സൂചിപ്പിക്കുന്ന കണികയ്ക്ക് ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവിക തുല്യം.
- source_word: יֵלֶךְ
  choice: വരട്ടെ / വരേണ്ടത്
  rationale: അബ്ശാലോമിന്റെ അഭ്യർഥനയിലെ ജസ്സീവ് ഭാവം ‘വരട്ടെ’ എന്നു നൽകി. രാജാവിന്റെ ആലങ്കാരിക ചോദ്യത്തിലെ അപൂർണക്രിയ ‘വരേണ്ടത്’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി. ലക്ഷ്യസ്ഥാനത്തെ സംഘത്തോടൊപ്പം ചേരുന്നതിനെക്കുറിച്ചുള്ള മലയാളപ്രയോഗത്തിൽ ‘വരുക’ യോജിക്കുന്നു.
- source_word: אִתָּנוּ
  choice: ഞങ്ങളോടൊപ്പം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന സഹവർത്തിത്വം നേരിട്ട് നൽകുന്നു.
- source_word: אַמְנוֹן אָחִי
  choice: എന്റെ സഹോദരനായ അമ്നോൻ
  rationale: ബന്ധം വ്യക്തമായി സൂക്ഷിച്ചുകൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിച്ചു.
- source_word: לָמָה
  choice: എന്തിന്
  rationale: കാരണത്തെ ചോദിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: עִמָּךְ
  choice: നിന്നോടൊപ്പം
  rationale: അബ്ശാലോമിനെ അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷ ഏകവചന സഹവർത്തിത്വം കൃത്യമായി നൽകുന്നു.
