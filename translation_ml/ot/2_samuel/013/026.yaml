  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ അപൂർണപ്രയോഗം പ്രധാനപാഠത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുകയും അതിന്റെ സന്ദർഭപൂർണ രൂപം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
