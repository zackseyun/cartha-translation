translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. തെറ്റായതായി പിന്നീട് തെളിയുന്ന സന്ദേശത്തെ വാക്യം തന്നെയൊരു വസ്തുതയായി ഉറപ്പിക്കുന്നില്ലെന്ന് വ്യക്തമാക്കാൻ ‘എന്നൊരു വാർത്ത’ എന്നു രൂപപ്പെടുത്തി.
