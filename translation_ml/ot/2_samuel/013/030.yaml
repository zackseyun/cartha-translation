source:
  edition: WLC
  text: וַֽ/יְהִי֙ הֵ֣מָּה בַ/דֶּ֔רֶךְ וְ/הַ/שְּׁמֻעָ֣ה בָ֔אָה אֶל דָּוִ֖ד לֵ/אמֹ֑ר הִכָּ֤ה אַבְשָׁלוֹם֙ אֶת כָּל בְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/לֹֽא נוֹתַ֥ר מֵ/הֶ֖ם אֶחָֽד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
translation:
  language: ml
  text: അവർ വഴിയിലായിരിക്കുമ്പോൾ, “അബ്ശാലോം രാജാവിന്റെ പുത്രന്മാരെയെല്ലാം കൊന്നുകളഞ്ഞു; അവരിൽ ഒരാൾപോലും ശേഷിച്ചിട്ടില്ല” എന്നൊരു വാർത്ത[a] ദാവീദിന് ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വാർത്ത’ എന്നതിന് ‘കേൾവി’ അഥവാ ‘സ്ഥിരീകരിക്കപ്പെടാത്ത വിവരം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രായപദത്തിന് അത്തരം അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  choice: അവർ വഴിയിലായിരിക്കുമ്പോൾ
  rationale: ഹീബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ സാഹചര്യകാലാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַשְּׁמֻעָה
  choice: എന്നൊരു വാർത്ത
  rationale: ഈ പദത്തിന് വാർത്ത, വിവരം, സ്ഥിരീകരിക്കപ്പെടാത്ത കേൾവി എന്നീ അർഥങ്ങൾ വരാം. പിന്നാലെ തെറ്റാണെന്ന് വ്യക്തമാകുന്ന സന്ദേശമായതിനാൽ, മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘വാർത്ത’ ഉപയോഗിച്ച് അതിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בָאָה אֶל דָּוִד
  choice: ദാവീദിന് ലഭിച്ചു
  rationale: ‘ദാവീദിന്റെ അടുക്കൽ വന്നു’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לֵאמֹר
  choice: എന്നൊരു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിയെ വാർത്തയുടെ ഉള്ളടക്കമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: הִכָּה
  choice: കൊന്നുകളഞ്ഞു
  rationale: נכה എന്ന ക്രിയയ്ക്ക് അടിക്കുക, അടിച്ചുവീഴ്ത്തുക എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും ഇവിടെ പറയപ്പെടുന്ന ഫലം മരണമാണ്; അതിനാൽ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ പുത്രന്മാരെയെല്ലാം
  rationale: ഹീബ്രായത്തിലെ സമഗ്രതയും പുരുഷസന്താനങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രത്യേകതയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְלֹא נוֹתַר מֵהֶם אֶחָד
  choice: അവരിൽ ഒരാൾപോലും ശേഷിച്ചിട്ടില്ല
  rationale: ഒരാളും ബാക്കിയില്ലെന്ന ഹീബ്രായ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
