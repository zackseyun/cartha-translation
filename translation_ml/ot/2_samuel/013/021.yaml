lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവ് ...പ്പോൾ
  rationale: വിവരണത്തിലെ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ബന്ധിപ്പിക്കാൻ וְ എന്ന സംയോജകത്തെ കാലസൂചകമായ ‘പ്പോൾ’ ഘടനയിൽ അവതരിപ്പിച്ചു; ‘ദാവീദ് രാജാവ്’ എന്നത് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പദക്രമമാണ്.
- source_word: שָׁמַע
  choice: കേട്ടു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ നടന്ന കാര്യങ്ങളെക്കുറിച്ചുള്ള വിവരം ലഭിച്ചതിനെയും ഇത് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  choice: ഈ കാര്യങ്ങളെല്ലാം
  rationale: דברים എന്നതിന് ‘വാക്കുകൾ,’ ‘കാര്യങ്ങൾ,’ ‘സംഭവങ്ങൾ’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ താമാറിനും അമ്നോനും സംബന്ധിച്ച് നടന്നതും അറിയിക്കപ്പെട്ടതുമായ എല്ലാം ഉൾക്കൊള്ളാൻ ‘കാര്യങ്ങൾ’ വിശാലവും സ്വാഭാവികവുമാണ്.
- source_word: וַ/יִּחַר ל֖/וֹ
  choice: കോപിച്ചു
  rationale: ‘അവന് കത്തിപ്പിടിച്ചു’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം കടുത്ത കോപത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അതിന്റെ സ്വാഭാവിക അർഥം ‘കോപിച്ചു’ എന്നാണ്; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: מְאֹד
  choice: അത്യന്തം
  rationale: ശക്തമായ തീവ്രത വ്യക്തമാക്കുന്ന, മാന്യവും ആധുനികവുമായ മലയാള പ്രയോഗം.
