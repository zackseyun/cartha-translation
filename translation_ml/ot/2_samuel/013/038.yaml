  text: וְ/אַבְשָׁל֥וֹם בָּרַ֖ח וַ/יֵּ֣לֶךְ גְּשׁ֑וּר וַ/יְהִי שָׁ֖ם שָׁלֹ֥שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/038.yaml
  text: But Absalom fled and went to Geshur[b][a], and he was there three years.
translation:
  language: ml
  text: എന്നാൽ അബ്ശാലോം ഓടിപ്പോയി ഗെശൂരിലേക്കു ചെന്നു[a]; അവൻ അവിടെ മൂന്നു വർഷം കഴിഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അബ്ശാലോം ഓടിപ്പോയി ഗെശൂരിലേക്കു ചെന്നു.” എബ്രായത്തിലെ ബന്ധകപദം സന്ദർഭത്തിൽ “എന്നാൽ” എന്നോ “അങ്ങനെ/പിന്നെ” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, “അവൻ അവിടെ മൂന്നു വർഷം ആയിരുന്നു”; അഥവാ, “അവൻ അവിടെ മൂന്നു വർഷം താമസിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: എന്നാൽ അബ്ശാലോം
  rationale: വിവരണത്തിന്റെ ഈ ഘട്ടത്തിൽ ו മുൻസന്ദർഭത്തോടുള്ള നേരിയ വൈരുധ്യവും കഥയുടെ പുനരാരംഭവും സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി; ‘അബ്ശാലോം’ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണമാണ്.
- source_word: בָּרַח
  choice: ഓടിപ്പോയി
  rationale: ברח എന്നത് അപകടത്തിൽനിന്നോ ശിക്ഷയിൽനിന്നോ ഓടി രക്ഷപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഓടിപ്പോയി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וַ/יֵּלֶךְ
  choice: ചെന്നു
  rationale: הלך ഇവിടെ തുടർച്ചയായ ആഖ്യാനക്രിയയായി ലക്ഷ്യസ്ഥാനത്തേക്കു പോയതിനെ സൂചിപ്പിക്കുന്നു; ‘ഗെശൂരിലേക്കു ചെന്നു’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: גְּשׁוּר
  choice: ഗെശൂർ
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത രീതിയിൽ മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു.
- source_word: וַ/יְהִי שָׁם
  choice: അവൻ അവിടെ ... കഴിഞ്ഞു
  rationale: അക്ഷരാർഥം ‘അവൻ അവിടെ ആയിരുന്നു’ എന്നാണെങ്കിലും, സമയദൈർഘ്യത്തോടൊപ്പം മലയാളത്തിൽ ‘അവിടെ ... കഴിഞ്ഞു’ എന്നത് സ്വാഭാവികമായി അവിടെ താമസിച്ച കാലത്തെ അറിയിക്കുന്നു.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: മൂന്നു വർഷം
  rationale: സംഖ്യയും കാലനാമവും ചേർന്ന ദൈർഘ്യപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള മലയാള പരിഭാഷ.
