translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. എബ്രായ ആഖ്യാനത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട് സമയദൈർഘ്യപ്രയോഗം സ്വാഭാവിക മലയാളത്തിലാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
