  source_fidelity: മൂലപാഠത്തിലെ അമ്നോന്റെ വിഷമം, താമാരുമായുള്ള സഹോദരബന്ധം, അവളുടെ കന്യകാത്വം, അവളോടു എന്തെങ്കിലും ചെയ്യുന്നതിനെക്കുറിച്ചുള്ള അവന്റെ അസാധ്യതാബോധം എന്നിവ കരടിൽ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു. എന്നാൽ ആദ്യവാക്യത്തിലെ രണ്ടു ക്രിയകൾ കൂട്ടിച്ചേർത്ത രീതി ഹീബ്രുവിലെ ‘രോഗിയായിത്തീരത്തക്കവണ്ണം വിഷമിച്ചു’ എന്ന ബന്ധത്തെ മലയാളത്തിൽ അല്പം അസ്വാഭാവികമാക്കുന്നു.
  naturalness: ‘അത്യന്തം മനോവിഷമത്തിലായി രോഗിയായിത്തീർന്നു’ എന്ന തുടർച്ചയ്ക്ക് സ്വാഭാവികമായ ബന്ധകം ഇല്ല. ‘രോഗിയായിത്തീരത്തക്കവണ്ണം അമ്നോൻ വിഷമിച്ചു’ എന്ന പ്രയോഗം ആധുനിക മാനക മലയാളത്തിൽ കൂടുതൽ സുഗമവും മൂലത്തിന്റെ പുരോഗതിയോടു കൂടുതൽ അടുത്തതുമാണ്. ‘അമ്നോന്റെ ദൃഷ്ടിയിൽ’ എന്നത് സ്വാഭാവികമാണ്.
