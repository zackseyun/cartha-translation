reference: 2 Samuel 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֨צֶר לְ/אַמְנ֜וֹן לְ/הִתְחַלּ֗וֹת בַּֽ/עֲבוּר֙ תָּמָ֣ר אֲחֹת֔/וֹ כִּ֥י בְתוּלָ֖ה הִ֑יא וַ/יִּפָּלֵא֙ בְּ/עֵינֵ֣י אַמְנ֔וֹן לַ/עֲשׂ֥וֹת לָ֖/הּ מְאֽוּמָה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
translation:
  language: ml
  text: തന്റെ സഹോദരിയായ താമാർ നിമിത്തം രോഗിയായിത്തീരത്തക്കവണ്ണം അമ്നോൻ വിഷമിച്ചു[a]. അവൾ കന്യകയായിരുന്നതിനാൽ, അവളോട് എന്തെങ്കിലും ചെയ്യുക അമ്നോന്റെ ദൃഷ്ടിയിൽ അസാധ്യമെന്നു തോന്നി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തന്റെ സഹോദരിയായ താമാർ നിമിത്തം അമ്നോൻ സ്വയം രോഗിയാകുന്നത്ര വിഷമിച്ചു.” ഹീബ്രുവിലെ രൂപം ‘രോഗിയായിത്തീരുക’ എന്ന ഫലമായോ, പ്രതിഫലനഭാവത്തോടെ ‘സ്വയം രോഗിയാക്കുക’ എന്നോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “അമ്നോന്റെ ദൃഷ്ടിയിൽ അസാധ്യമെന്നു തോന്നി” എന്നത്, പ്രവർത്തിക്കാൻ പ്രായോഗികമായ ഒരു വഴിയും അമ്നോൻ കണ്ടില്ല എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  choice: അത്യന്തം മനോവിഷമത്തിലായി
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ അമ്നോന്റെ ഉള്ളിലെ കടുത്ത ഞെരുക്കത്തെയും വിഷമത്തെയും സൂചിപ്പിക്കുന്നു; രോഗാവസ്ഥയിലേക്കു നയിച്ച തീവ്രതയും ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לְהִתְחַלּוֹת
  choice: രോഗിയായിത്തീർന്നു
  rationale: ഹിത്പയേൽ രൂപത്തിന് ‘രോഗിയായിത്തീരുക’ എന്നും ‘സ്വയം രോഗിയാക്കുക’ എന്നും അർഥമാകാം. മുഖ്യപാഠത്തിൽ ഫലാവസ്ഥ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: בַּעֲבוּר
  choice: നിമിത്തം
  rationale: ഇവിടെ ഈ പദം പ്രയോജനമല്ല, കാരണം സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ ആ കാരണബന്ധം സംക്ഷിപ്തവും മാന്യവുമായി നൽകുന്നു.
- source_word: אֲחֹתוֹ
  choice: തന്റെ സഹോദരിയായ
  rationale: ബന്ധത്തിന്റെ സ്വഭാവം കഥയുടെ ധാർമിക ഭീകരതയ്ക്കു കേന്ദ്രമായതിനാൽ വ്യക്തമായി നിലനിർത്തി.
- source_word: בְתוּלָה
  choice: കന്യക
  rationale: ഹീബ്രു പദം ഇവിടെ കന്യകാത്വം നേരിട്ട് സൂചിപ്പിക്കുന്നു; ആധുനിക മാനക മലയാളത്തിൽ ‘കന്യക’ വ്യക്തവും സംക്ഷിപ്തവുമാണ്.
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  choice: അമ്നോന്റെ ദൃഷ്ടിയിൽ അസാധ്യമെന്നു തോന്നി
  rationale: അമ്നോന്റെ കാഴ്ചപ്പാടിൽ കാര്യം കൈവരിക്കാനാകാത്തതോ അത്യന്തം പ്രയാസമുള്ളതോ ആയിരുന്നുവെന്ന ഹീബ്രു ശൈലി സംരക്ഷിക്കുന്നു.
- source_word: לַעֲשׂוֹת לָהּ מְאוּמָה
  choice: അവളോട് എന്തെങ്കിലും ചെയ്യുക
  rationale: ‘എന്തെങ്കിലും/ഏറ്റവും ചെറിയ കാര്യം’ എന്ന വിശാലത നിലനിർത്തുന്നു; പിന്നാലെ സംഭവിക്കാനിരിക്കുന്ന കുറ്റത്തെ ഈ ഘട്ടത്തിൽ അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘മനോവിഷമം,’ ‘കന്യക,’ ‘ദൃഷ്ടിയിൽ’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമാകുന്നതോടൊപ്പം മൂലപാഠത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു. രോഗത്തെക്കുറിച്ചുള്ള ഹീബ്രു രൂപത്തിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
