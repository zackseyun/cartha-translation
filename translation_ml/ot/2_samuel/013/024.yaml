- from: 'അപ്പോൾ അബ്ശാലോം രാജാവിന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഇതാ, അങ്ങയുടെ ദാസന് ആടുകളെ രോമം കത്രിക്കുന്നവർ ഉണ്ട്. രാജാവും രാജാവിന്റെ ദാസന്മാരും അങ്ങയുടെ ദാസനോടൊപ്പം വരണമേ.”'
  to: 'അപ്പോൾ അബ്ശാലോം രാജാവിന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഇതാ, അങ്ങയുടെ ദാസനായ എനിക്ക് ആടുകളുടെ രോമം കത്രിക്കുന്നവർ ഉണ്ട്. രാജാവും രാജാവിന്റെ ദാസന്മാരും എന്നോടൊപ്പം വരണമേ.”'
