language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֤א אַבְשָׁלוֹם֙ אֶל הַ/מֶּ֔לֶךְ וַ/יֹּ֕אמֶר הִנֵּה נָ֥א גֹזְזִ֖ים לְ/עַבְדֶּ֑/ךָ יֵֽלֶךְ נָ֥א הַ/מֶּ֛לֶךְ וַ/עֲבָדָ֖י/ו עִם עַבְדֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/024.yaml
  text: Then Absalom came to the king and said, “Look, your servant has shearers. Please let the king and his servants go with your servant.”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്ശാലോം രാജാവിന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഇതാ, അങ്ങയുടെ ദാസനായ എനിക്ക് ആടുകളുടെ രോമം കത്രിക്കുന്നവർ ഉണ്ട്. രാജാവും രാജാവിന്റെ ദാസന്മാരും എന്നോടൊപ്പം വരണമേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ ചുരുക്കമായി നിലനിർത്തുന്നു; נָאയുടെ അപേക്ഷാഭാവം തുടർന്നുള്ള വരണമേ എന്ന ക്രിയയിലും പ്രകടമാണ്.
- source_word: גֹזְזִים
  choice: ആടുകളെ രോമം കത്രിക്കുന്നവർ
  rationale: സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് ആടുകളുടെ രോമം കത്രിക്കുന്ന തൊഴിലാളികളാണ്; മലയാളത്തിൽ വെറും ‘കത്രിക്കുന്നവർ’ എന്നു പറഞ്ഞാൽ അവ്യക്തമാകുന്നതിനാൽ കർമ്മം വ്യക്തമാക്കി.
- source_word: עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജാവിനോടുള്ള അബ്ശാലോമിന്റെ ആദരപൂർവമായ സ്വയംപരാമർശം മൂന്നാംപുരുഷരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יֵלֶךְ נָא
  choice: വരണമേ
  rationale: വക്താവിന്റെ സ്ഥലത്തേക്കുള്ള ക്ഷണം മലയാളത്തിൽ ‘വരിക’ എന്ന ദിശാപദം ആവശ്യപ്പെടുന്നു; נָאയുടെ വിനീത അപേക്ഷാഭാവം ‘-ണമേ’യിൽ പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, കഥാഖ്യാനത്തിന് യോജിച്ച മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രാജാവിനെ അഭിസംബോധന ചെയ്യുന്ന ബഹുമാനഭാവവും ‘ദാസൻ’ എന്ന രാജസഭാ സ്വയംപരാമർശവും നിലനിർത്തിയിരിക്കുന്നു.
