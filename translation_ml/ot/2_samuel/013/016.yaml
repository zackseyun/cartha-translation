  text: וַ/תֹּ֣אמֶר ל֗/וֹ אַל אוֹדֹ֞ת הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את מֵ/אַחֶ֛רֶת אֲשֶׁר עָשִׂ֥יתָ עִמִּ֖/י לְ/שַׁלְּחֵ֑/נִי וְ/לֹ֥א אָבָ֖ה לִ/שְׁמֹ֥עַֽ לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/016.yaml
  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
translation:
  language: ml
  text: 'എന്നാൽ അവൾ അവനോട് പറഞ്ഞു[a]: “വേണ്ടാ! എന്നെ പറഞ്ഞയയ്ക്കുന്ന ഈ വലിയ അന്യായം നീ എന്നോട് ചെയ്ത മറ്റേ അന്യായത്തെക്കാൾ വലുതാണ്.” എന്നാൽ അവൻ അവളുടെ വാക്കു കേൾക്കാൻ വിസമ്മതിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അരുത്; എന്നെ പറഞ്ഞയയ്ക്കുന്ന ഈ വലിയ അന്യായം നീ എന്നോട് ചെയ്ത മറ്റേ അന്യായത്തെക്കാൾ വലുതാണ്.” എബ്രായ വാക്യം ചുരുക്കമുള്ളതും വ്യാകരണപരമായി ദുഷ്കരവുമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: വേണ്ടാ!
  rationale: സാധാരണയായി നിരോധനം സൂചിപ്പിക്കുന്ന പദമാണെങ്കിലും, ഇവിടെ ചുരുക്കിപ്പറഞ്ഞ ശക്തമായ എതിർപ്പായി വരുന്നു. ‘വേണ്ടാ!’ താമാറിന്റെ അടിയന്തരമായ പ്രതിഷേധം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אוֹדֹת
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്യാതെ തുടർന്നുള്ള വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: ഇവിടെ പ്രതിഷേധത്തിന്റെ വിഷയത്തെ അവതരിപ്പിക്കുന്ന ഈ പദത്തിന്റെ ബന്ധം മലയാളത്തിലെ നേരിട്ടുള്ള വാക്യഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: ഈ വലിയ അന്യായം
  rationale: רָעָה ഇവിടെ വ്യക്തിക്കെതിരായ ധാർമികവും സാമൂഹികവുമായ തെറ്റിനെ സൂചിപ്പിക്കുന്നു. ‘അന്യായം’ പ്രസക്തമായ അർഥം വ്യക്തമായി നൽകുന്നു; גְּדוֹלָה ‘വലിയ’യായി നിലനിർത്തുന്നു.
- source_word: מֵאַחֶרֶת אֲשֶׁר עָשִׂיתָ עִמִּי
  choice: നീ എന്നോട് ചെയ്ത മറ്റേതിനെക്കാൾ
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ אַחֶרֶת മുമ്പത്തെ ‘അന്യായം’ എന്ന ആശയത്തെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ പരാമർശം കൂടുതൽ വ്യക്തമാക്കാതെ താരതമ്യം അതേപടി നിലനിർത്തുന്നു.
- source_word: לְשַׁלְּחֵנִי
  choice: എന്നെ പറഞ്ഞയയ്ക്കുന്ന
  rationale: അവളെ അവിടെനിന്ന് അയച്ചുകളയുന്ന പ്രവൃത്തിയാണ് ചർച്ചാവിഷയം. ‘പറഞ്ഞയയ്ക്കുക’ എന്നത് സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണ്.
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  choice: എന്നാൽ അവൻ അവളുടെ വാക്കു കേൾക്കാൻ തയ്യാറായില്ല
  rationale: אָבָה മനസ്സോ സന്നദ്ധതയോ ഇല്ലായ്മ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ വെറും കേൾവിയല്ല, അവളുടെ അപേക്ഷ അംഗീകരിക്കാൻ അവൻ വിസമ്മതിച്ചതും വ്യക്തമാക്കുന്നു.
- source_word: לּוֹ
  choice: അവനോട്
  rationale: സംഭാഷണത്തിന്റെ പരോക്ഷ കർമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി രേഖപ്പെടുത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. താമാറിന്റെ ശക്തമായ പ്രതിഷേധം നിലനിർത്തിക്കൊണ്ട് എബ്രായത്തിലെ ചുരുക്കവും താരതമ്യത്തിലെ പരാമർശത്തിന്റെ അസ്പഷ്ടതയും അനാവശ്യമായി പരിഹരിച്ചിട്ടില്ല.
