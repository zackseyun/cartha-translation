source:
  edition: WLC
  text: וַ/יִּבְרַ֖ח אַבְשָׁל֑וֹם וַ/יִּשָּׂ֞א הַ/נַּ֤עַר הַ/צֹּפֶה֙ אֶת עינ/ו וַ/יַּ֗רְא וְ/הִנֵּ֨ה עַם רַ֜ב הֹלְכִ֥ים מִ/דֶּ֛רֶךְ אַחֲרָ֖י/ו מִ/צַּ֥ד הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/034.yaml
  text: But Absalom fled[a]. And the young man who was watching lifted up his eyes and saw, and behold, many people were coming by the road behind him[c][b], from the side of the mountain.
translation:
  language: ml
  text: എന്നാൽ അബ്ശാലോം ഓടിപ്പോയി. കാവൽ നോക്കിക്കൊണ്ടിരുന്ന യുവാവ് കണ്ണുകളുയർത്തി നോക്കി; അതാ, അനേകം ആളുകൾ അവന്റെ പിന്നിലുള്ള വഴിയിലൂടെ മലയുടെ വശത്തുനിന്ന് വരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അവന്റെ പിന്നിലുള്ള വഴിയുടെ ഭാഗത്തുകൂടെ, മലയുടെ വശത്തുനിന്ന്.’ എബ്രായത്തിലെ കൃത്യമായ സ്ഥാനബന്ധം സംക്ഷിപ്തവും അല്പം അവ്യക്തവുമാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח אַבְשָׁלוֹם
  choice: അബ്ശാലോം ഓടിപ്പോയി
  rationale: ברח ഓടി രക്ഷപ്പെടുന്നതിനെയോ പലായനം ചെയ്യുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. ‘ഓടിപ്പോയി’ ആഖ്യാനത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַנַּעַר הַצֹּפֶה
  choice: കാവൽ നോക്കിക്കൊണ്ടിരുന്ന യുവാവ്
  rationale: נַעַר എന്ന ‘യുവാവ്/പരിചാരകൻ’ എന്ന ഘടകവും צֹפֶה എന്ന ‘നിരീക്ഷിക്കുന്നവൻ/കാവൽക്കാരൻ’ എന്ന ഘടകവും ഒരുപോലെ നിലനിർത്തുന്നു; ഔദ്യോഗിക കാവൽക്കാരനായിരുന്നു എന്ന് അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  choice: കണ്ണുകളുയർത്തി നോക്കി
  rationale: എബ്രായ ശൈലിയിലെ ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന പ്രയോഗമാണിത്.
- source_word: וַיַּרְא וְהִנֵּה
  choice: നോക്കി; അതാ
  rationale: הִנֵּה നൽകുന്ന പെട്ടെന്നുള്ള ശ്രദ്ധാകർഷണവും കണ്ടെത്തലിന്റെ ഭാവവും ‘അതാ’ നിലനിർത്തുന്നു.
- source_word: עַם רַב
  choice: അനേകം ആളുകൾ
  rationale: കൂട്ടത്തിന്റെ വലിപ്പം വ്യക്തമാക്കുന്നു; എന്നാൽ ഔപചാരികമായി ഒത്തുകൂടിയ ജനക്കൂട്ടമാണെന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: הֹלְכִים
  choice: വരുന്നു
  rationale: הלך അടിസ്ഥാനമായി പോകുക/നടക്കുക എന്നാണ്; ഇവിടെ കാവൽ നോക്കുന്നവന്റെ ദൃഷ്ടികോണത്തിൽ സംഘം സമീപിക്കുന്നതിനാൽ ‘വരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: מִדֶּרֶךְ אַחֲרָיו מִצַּד הָהָר
  choice: അവന്റെ പിന്നിലുള്ള വഴിയിലൂടെ മലയുടെ വശത്തുനിന്ന്
  rationale: സംക്ഷിപ്തവും സ്ഥാനബന്ധത്തിൽ അവ്യക്തവുമായ എബ്രായ ഘടനയെ സാധ്യമായത്ര അടുത്ത് പിന്തുടരുന്നു; אַחֲרָיו എന്ന സർവനാമത്തിന്റെ സൂചന നിർബന്ധമായി പരിഹരിക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആഖ്യാനത്തിന്റെ വേഗവും ‘അതാ’ എന്ന ശ്രദ്ധാകർഷക പദവും നിലനിർത്തി; സ്ഥാനവിവരണത്തിലെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
