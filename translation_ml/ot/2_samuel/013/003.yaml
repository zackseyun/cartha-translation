  text: Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
translation:
  language: ml
  text: അമ്നോന് ഒരു സുഹൃത്ത് ഉണ്ടായിരുന്നു. അവന്റെ പേര് യോനാദാബ് എന്നായിരുന്നു; അവൻ ദാവീദിന്റെ സഹോദരനായ ശിമെയായുടെ മകനായിരുന്നു. യോനാദാബ് വളരെ ബുദ്ധിശാലിയായ മനുഷ്യനായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വളരെ ജ്ഞാനിയായ മനുഷ്യൻ’ എന്നും ‘വളരെ കൗശലക്കാരനായ മനുഷ്യൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ പദം പൊതുവേ ജ്ഞാനത്തെയോ ബുദ്ധിയെയോ സാമർഥ്യത്തെയോ സൂചിപ്പിക്കാം; തുടർന്നുള്ള വിവരണത്തിൽ യോനാദാബിന്റെ ഈ കഴിവ് ധാർമികമായി സംശയാസ്പദമായ ഉപദേശത്തിൽ പ്രകടമാകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַמְנוֹן רֵעַ
  choice: അമ്നോന് ഒരു സുഹൃത്ത് ഉണ്ടായിരുന്നു
  rationale: ഹീബ്രായയിലെ ‘അമ്നോന് ഒരു സുഹൃത്ത് ഉണ്ടായിരുന്നു’ എന്ന ഉടമസ്ഥതാസൂചക പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. רֵעַ എന്നത് ഇവിടെ ‘സുഹൃത്ത്’ എന്നാണ് ഏറ്റവും യോജിച്ചത്.
- source_word: וּשְׁמוֹ יוֹנָדָב
  choice: അവന്റെ പേര് യോനാദാബ് എന്നായിരുന്നു
  rationale: ഹീബ്രായ നാമകരണസൂത്രത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: בֶּן שִׁמְעָה אֲחִי דָוִד
  choice: ദാവീദിന്റെ സഹോദരനായ ശിമെയായുടെ മകൻ
  rationale: ‘ദാവീദിന്റെ സഹോദരൻ’ എന്ന വിശേഷണം ശിമെയായെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ അവ്യക്തതയില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ חָכָם מְאֹד
  choice: വളരെ ബുദ്ധികൂർമതയുള്ള മനുഷ്യൻ
  rationale: חָכָם എന്ന പദം ജ്ഞാനം, ബുദ്ധിസാമർഥ്യം, കൗശലം എന്നിവ സൂചിപ്പിക്കാം. തുടർന്നുള്ള സംഭവത്തിൽ ആ കഴിവ് ധാർമികമായി ദുഷ്ടമായ ഉപദേശത്തിൽ പ്രകടമാകുന്നതിനാൽ, അനുകൂലമായ ധാർമിക അംഗീകാരം മുൻകൂട്ടി നൽകാതെ മാനസിക കൂർമതയെ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: യോനാദാബിന്റെ חָכָם എന്ന വിശേഷണത്തിന്റെ ധാർമിക വിലയിരുത്തൽ
  choice: വളരെ ബുദ്ധികൂർമതയുള്ള മനുഷ്യൻ
  alternative: വളരെ ജ്ഞാനിയായ മനുഷ്യൻ / വളരെ കൗശലക്കാരനായ മനുഷ്യൻ
  rationale: മൂലപദം സ്വതവേ അനുകൂലമായ ‘ജ്ഞാനി’ എന്ന അർഥവും സാഹചര്യത്തിൽ തന്ത്രബുദ്ധിയുള്ളവൻ എന്ന അർഥവും വഹിക്കാം. വിവർത്തനം ഈ പദത്തിന്റെ കഴിവുസൂചക അർഥം നിലനിർത്തുന്നു; എന്നാൽ യോനാദാബിനെ ധാർമികമായി ജ്ഞാനിയെന്നോ ദുഷ്ടനെന്നോ ഈ വാക്യത്തിൽ മാത്രം നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ കഥനശൈലി. ദീർഘമായ ഹീബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; ബന്ധങ്ങളും ആശയക്രമവും അതേപടി നിലനിർത്തി.
