  yaml_path: translation/ot/2_samuel/013/027.yaml
  text: But Absalom pressed him[a], so he sent Amnon and all the king’s sons with him.
translation:
  language: ml
  text: എന്നാൽ അബ്ശാലോം ദാവീദിനോട് വിട്ടുവീഴ്ചയില്ലാതെ നിർബന്ധിച്ചു[a]. അപ്പോൾ ദാവീദ് അമ്നോനെയും രാജാവിന്റെ എല്ലാ പുത്രന്മാരെയും അബ്ശാലോമിനോടൊപ്പം അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അബ്ശാലോം ദാവീദിനോട് ശക്തമായി ആവശ്യപ്പെട്ടു’ / ‘അബ്ശാലോം ദാവീദിനെ സമ്മതിപ്പിച്ചു.’ എബ്രായ പ്രയോഗം ഒരു സാധാരണ അഭ്യർഥനയെക്കാൾ ശക്തമായ, തുടർച്ചയായ സമ്മർദത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרָץ בּוֹ
  choice: അവനെ നിർബന്ധിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇവിടെ פרץ + בְ എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘തുളച്ചുകയറുക’ എന്നല്ല, ദാവീദിന്റെ ആദിമ നിരസനത്തിനുശേഷം അബ്ശാലോം ശക്തമായും തുടർച്ചയായും സമ്മർദം ചെലുത്തിയെന്ന് സൂചിപ്പിക്കുന്നു. ‘നിർബന്ധിച്ചുകൊണ്ടിരുന്നു’ ആ ആവർത്തിത ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: സന്ദർഭത്തിൽ ദാവീദ് അഭ്യർഥനയ്ക്ക് വഴങ്ങി തന്റെ പുത്രന്മാരെ അബ്ശാലോമിനോടൊപ്പം അയക്കുന്നതാണ്; അതിനാൽ ‘അയച്ചു’ സ്വാഭാവികവും അർഥസൂക്ഷ്മവുമാണ്.
- source_word: אִתּוֹ
  choice: അവനോടൊപ്പം
  rationale: എബ്രായത്തിലെ സർവനാമരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് അബ്ശാലോമിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶת אַמְנוֹן
  choice: അമ്നോനെ
  rationale: നേരിട്ടുള്ള കർമത്തെ മലയാള വിഭക്തിയാൽ വ്യക്തമാക്കുന്നു; വ്യക്തിനാമം മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ എല്ലാ പുത്രന്മാരെയും
  rationale: രാജകീയവും കുടുംബപരവുമായ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക ആധുനിക മലയാളം.
