translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘അപ്പൻ’ എന്നത് നേരിട്ടുള്ള കുടുംബസംഭാഷണത്തിന് യോജിച്ചതാണ്. ‘ഭക്ഷണം’ എന്ന തിരഞ്ഞെടുപ്പ് לֶחֶם എന്ന പദത്തിന്റെ സന്ദർഭപരമായ വിശാലാർഥം പാഠത്തിൽത്തന്നെ നൽകുന്നതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല; രോഗിക്കായി പ്രത്യേകം ഒരുക്കുന്ന ആഹാരം എന്ന הַבִּרְיָהയുടെ സാധ്യത വിവർത്തനത്തിൽ അമിതമായി നിർണ്ണയിക്കാതെ പൊതുവായ ‘ആ ഭക്ഷണം’ എന്നു നിലനിർത്തി.
