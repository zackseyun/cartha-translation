  terminology: “രോഗിയാണെന്നു നടിക്കുക,” “ഭക്ഷണം,” and “അവളുടെ കൈയിൽനിന്ന്” are suitable modern-standard Malayalam choices. “യോനാദാബ്” correctly represents Jehonadab. The retained note adequately explains the pretensive sense of the Hebrew verb.
