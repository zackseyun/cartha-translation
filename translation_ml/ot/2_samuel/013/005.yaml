  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יְה֣וֹנָדָ֔ב שְׁכַ֥ב עַל מִשְׁכָּבְ/ךָ֖ וְ/הִתְחָ֑ל וּ/בָ֧א אָבִ֣י/ךָ לִ/רְאוֹתֶ֗/ךָ וְ/אָמַרְתָּ֣ אֵלָ֡י/ו תָּ֣בֹא נָא֩ תָמָ֨ר אֲחוֹתִ֜/י וְ/תַבְרֵ֣/נִי לֶ֗חֶם וְ/עָשְׂתָ֤ה לְ/עֵינַ/י֙ אֶת הַ/בִּרְיָ֔ה לְמַ֨עַן֙ אֲשֶׁ֣ר אֶרְאֶ֔ה וְ/אָכַלְתִּ֖י מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/005.yaml
  text: Jehonadab said to him[a], “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let Tamar my sister come and give me food, and let her prepare the meal in my sight[c][b], so that I may watch and eat from her hand.’”
translation:
  language: ml
  text: 'യോനാദാബ് അവനോടു പറഞ്ഞു: “നിന്റെ കിടക്കയിൽ കിടന്ന് രോഗിയാണെന്നു നടിക്കുക.[a] നിന്റെ അപ്പൻ നിന്നെ കാണാൻ വരുമ്പോൾ, അവനോട് ഇങ്ങനെ പറയുക: ‘എന്റെ സഹോദരി താമാർ വന്ന് എനിക്ക് ഭക്ഷണം തരാൻ ദയവായി അനുവദിക്കണമേ. എന്റെ കൺമുന്നിൽ അവൾ ആ ഭക്ഷണം തയ്യാറാക്കട്ടെ; അങ്ങനെ എനിക്ക് കാണാനും അവളുടെ കൈയിൽനിന്ന് കഴിക്കാനും ഇടയാകട്ടെ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രോഗം നടിക്കുക.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയ രോഗിയാണെന്നു തോന്നിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁכַב עַל מִשְׁכָּבְךָ
  choice: നിന്റെ കിടക്കയിൽ കിടന്ന്
  rationale: ശׁכב + עַל + מִשְׁכָּב എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം സ്വന്തം കിടക്കയിൽ കിടക്കുക എന്നതാണ്.
- source_word: וְהִתְחָל
  choice: രോഗിയാണെന്നു നടിക്കുക
  rationale: സന്ദർഭത്തിൽ ഹിത്പയേൽ രൂപം യഥാർഥത്തിൽ രോഗിയാകുക എന്നതല്ല, രോഗിയായി കാണപ്പെടാൻ നടിക്കുക എന്ന അർഥമാണ് നൽകുന്നത്.
- source_word: וּבָא אָבִיךָ לִרְאוֹתֶךָ
  choice: നിന്റെ അപ്പൻ നിന്നെ കാണാൻ വരുമ്പോൾ
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: תָּבֹא נָא
  choice: വന്ന് ... ദയവായി അനുവദിക്കണമേ
  rationale: נָא സൂചിപ്പിക്കുന്ന വിനീതമായ അപേക്ഷയും, താമാർ വരാൻ പിതാവിന്റെ അനുമതി അഭ്യർഥിക്കുന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: וְתַבְרֵנִי לֶחֶם
  choice: എനിക്ക് ഭക്ഷണം തരാൻ
  rationale: ברה ഇവിടെ രോഗിക്ക് ആഹാരം നൽകി പോഷിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; לֶחֶם സന്ദർഭത്തിൽ അപ്പം മാത്രമല്ല, പൊതുവായി ഭക്ഷണത്തെയും സൂചിപ്പിക്കാം. തുടർന്നുള്ള עשה എന്ന ‘തയ്യാറാക്കുക’ എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസവും സംരക്ഷിക്കുന്നു.
- source_word: וְעָשְׂתָה לְעֵינַי אֶת הַבִּרְיָה
  choice: ഞാൻ കണ്ടുകൊണ്ടിരിക്കെ അവൾ ആ ഭക്ഷണം തയ്യാറാക്കട്ടെ
  rationale: לְעֵינַי എന്ന ദൃശ്യഘടകവും עשה എന്ന തയ്യാറാക്കൽക്രിയയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; הַבִּרְיָה രോഗിക്കായി ഒരുക്കുന്ന ഭക്ഷണത്തെ സൂചിപ്പിക്കാം.
- source_word: לְמַעַן אֲשֶׁר אֶרְאֶה
  choice: അങ്ങനെ ഞാൻ അതു കണ്ടിട്ട്
  rationale: ראה എന്ന കാണുക എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ദൃശ്യാർഥം നിലനിർത്തുന്നു; ഹീബ്രുവിൽ പ്രത്യേകമായി രേഖപ്പെടുത്തിയ കർമപദമില്ലെങ്കിലും മലയാളത്തിലെ ‘അതു’ മുൻപറഞ്ഞ ഒരുക്കൽ/ഭക്ഷണത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְאָכַלְתִּי מִיָּדָהּ
  choice: അവളുടെ കൈയിൽനിന്ന് കഴിക്കാം
  rationale: താമാർ നേരിട്ട് ഭക്ഷണം നൽകണമെന്ന കഥാപരമായ സൂക്ഷ്മത സംരക്ഷിക്കുന്ന, ഹീബ്രുവിനോട് അടുത്ത സ്വാഭാവിക പ്രയോഗം.
