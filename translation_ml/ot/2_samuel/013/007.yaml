base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/007.yaml
  text: Then David sent word to Tamar at home[a], saying, “Please go to the house of your brother Amnon and prepare the food for him.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് താമാറിന്റെ വീട്ടിലേക്കു സന്ദേശമയച്ചു: “ദയവായി നിന്റെ സഹോദരനായ അമ്നോന്റെ വീട്ടിൽ ചെന്ന് അവനുവേണ്ടി പോഷകഭക്ഷണം[a] തയ്യാറാക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശക്തിപകരുന്ന വിഭവം” അല്ലെങ്കിൽ “ഭക്ഷണം.” എബ്രായപദം രോഗിക്കോ സുഖംപ്രാപിച്ചുവരുന്നയാൾക്കോ വേണ്ടി തയ്യാറാക്കുന്ന ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל תָּמָר ... לֵאמֹר
  choice: ദാവീദ് താമാറിന്റെ അടുക്കൽ ... ആളയച്ചു പറഞ്ഞു
  rationale: שלח എന്നത് അടിസ്ഥാനമായി ‘അയയ്ക്കുക’ എന്നാണ്. ഒരു വ്യക്തിയോടുള്ള സന്ദേശം പിന്നാലെ ഉദ്ധരിക്കപ്പെടുന്നതിനാൽ, മലയാളത്തിൽ ‘ആളയച്ചു പറഞ്ഞു’ എന്നു നൽകുന്നത് ദൂതനെയോ സന്ദേശവാഹകനെയോ അയച്ചതെന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַבַּיְתָה
  choice: വീട്ടിലേക്കു
  rationale: ദിശാസൂചകമായ ־ה ഉള്ളതിനാൽ പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘വീട്ടിലേക്കു’ എന്നാണ്. ഏത് വീടാണെന്നത് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അതിനെ നിർബന്ധമായി ‘അവളുടെ വീട്ടിൽ’ എന്നു വ്യാഖ്യാനിച്ചില്ല.
- source_word: לְכִי נָא
  choice: ദയവായി ... ചെന്ന്
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞയോടു ചേർന്ന נָא അഭ്യർഥനയുടെ മൃദുത്വം നൽകുന്നു; ‘ദയവായി’ അത് സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: בֵּית אַמְנוֹן אָחִיךְ
  choice: നിന്റെ സഹോദരനായ അമ്നോന്റെ വീട്ടിൽ
  rationale: ‘നിന്റെ സഹോദരൻ അമ്നോന്റെ വീട്’ എന്ന ഘടനയുടെ ബന്ധവും വ്യക്തതയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַעֲשִׂי לוֹ
  choice: അവനുവേണ്ടി ... തയ്യാറാക്കുക
  rationale: עשה എന്നതിന് വിശാലമായി ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും ഭക്ഷണസന്ദർഭത്തിൽ ‘തയ്യാറാക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַבִּרְיָה
  choice: രോഗിക്കുള്ള ഭക്ഷണം
  rationale: ഈ അപൂർവ നാമം രോഗിയോ സുഖംപ്രാപിക്കുന്നയാളോ കഴിക്കാനായി ഒരുക്കുന്ന പോഷകമോ ശക്തിപകരുന്നതോ ആയ ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു. വെറും ‘ഭക്ഷണം’ എന്നു നൽകിയാൽ ഉറവിടപദത്തിന്റെ പ്രത്യേക രോഗസന്ദർഭം നഷ്ടപ്പെടും; കൂടുതൽ കൃത്യമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
