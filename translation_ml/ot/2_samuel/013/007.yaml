translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. הַבַּיְתָה എന്നതിലെ ദിശാഭാവം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; הַבִּרְיָהയുടെ പ്രത്യേക അർഥപരിധി മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും അറിയിച്ചു.
