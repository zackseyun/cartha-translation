    rationale: The Hebrew has David sending to Tamar, with a houseward/directional phrase. Malayalam should not stack “അടുക്കൽ” and “വീട്ടിലേക്കു” in this construction. Rendering the action as sending a message to Tamar’s house is idiomatic and preserves the contextual sense.
