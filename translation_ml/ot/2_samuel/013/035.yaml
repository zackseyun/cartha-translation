  source_fidelity: എബ്രായ വാക്യത്തിലെ ആഖ്യാനപുരോഗതി (וַיֹּאמֶר), യോനാദാബിന്റെ രാജാവിനോടുള്ള പ്രസ്താവന, הִנֵּהയുടെ ശ്രദ്ധക്ഷണിക്കൽ, ‘രാജാവിന്റെ പുത്രന്മാർ’ എന്ന ബഹുവചനം, ഇപ്പോൾ സ്ഥിരീകരിക്കപ്പെട്ട വരവ്, ‘അങ്ങയുടെ ദാസൻ’ എന്ന കൊട്ടാരസ്വയംപരാമർശം, അവസാനത്തെ ‘പറഞ്ഞതുപോലെതന്നെ … സംഭവിച്ചിരിക്കുന്നു’ എന്ന സ്ഥിരീകരണം എന്നിവ വിശ്വസ്തമായി പകരുന്നു. ‘വന്നിരിക്കുന്നു’യും ‘സംഭവിച്ചിരിക്കുന്നു’യും സന്ദർഭോചിതമായ സമാപ്തി/നിലവിലെ പ്രസക്തി സൂചിപ്പിക്കുന്നു.
