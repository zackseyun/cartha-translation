  terminology: ‘യോനാദാബ്,’ ‘രാജാവ്,’ ‘പുത്രന്മാർ,’ ‘അങ്ങയുടെ ദാസൻ’ എന്നീ നാമ-പദപ്രയോഗങ്ങൾ സ്ഥിരതയുള്ളതും ഉചിതവുമാണ്. ‘അങ്ങയുടെ ദാസൻ’ എബ്രായത്തിലെ വിനയപൂർവമായ രാജസന്നിധി-സ്വയംപരാമർശം നിലനിർത്തുന്നു.
