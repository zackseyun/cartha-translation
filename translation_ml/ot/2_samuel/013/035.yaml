language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יֽוֹנָדָב֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּ֥ה בְנֵֽי הַ/מֶּ֖לֶךְ בָּ֑אוּ כִּ/דְבַ֥ר עַבְדְּ/ךָ֖ כֵּ֥ן הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/035.yaml
  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
translation:
  language: ml
  text: 'അപ്പോൾ യോനാദാബ് രാജാവിനോടു പറഞ്ഞു: “നോക്കൂ[a], രാജാവിന്റെ പുത്രന്മാർ വന്നിരിക്കുന്നു; അങ്ങയുടെ ദാസൻ പറഞ്ഞതുപോലെതന്നെ സംഭവിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇതാ, രാജാവിന്റെ പുത്രന്മാർ വന്നിരിക്കുന്നു; അങ്ങയുടെ ദാസൻ പറഞ്ഞതുപോലെതന്നെ ആയിരിക്കുന്നു.”'
    reason: הִנֵּה, כֵּן הָיָה എന്നീ പ്രയോഗങ്ങളുടെ കൂടുതൽ അക്ഷരാർഥപരമായ പകരംവിവർത്തനം.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമാനുഗതത്വം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יֽוֹנָדָב
  choice: യോനാദാബ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ ബൈബിൾ നാമലിപ്യന്തരണരീതിക്കനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: אֶל הַמֶּלֶךְ
  choice: രാജാവിനോടു
  rationale: മനുഷ്യരാജാവായ ദാവീദിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അഭിസംബോധനയുടെ ലക്ഷ്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന രൂപമാണിത്.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും മുന്നിലുള്ള സംഭവത്തിന്റെ അടിയന്തരത പ്രകടമാക്കുകയും ചെയ്യുന്ന ദെയ്ക്റ്റിക് കണികയുടെ പ്രവർത്തനം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ പുത്രന്മാർ
  rationale: നിർമാണബന്ധം സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിൽ നൽകിയിരിക്കുന്നു; സന്ദർഭത്തിൽ എല്ലാവരും കൊല്ലപ്പെട്ടിട്ടില്ലെന്ന തിരുത്തലിന് പുരുഷസന്തതിയെ സൂചിപ്പിക്കുന്ന ബഹുവചനം നിർണായകമാണ്.
- source_word: בָּאוּ
  choice: വന്നിരിക്കുന്നു
  rationale: ഇപ്പോൾ സ്ഥിരീകരിക്കപ്പെട്ടെത്തിച്ചേരലിനെ എബ്രായ സമാപ്തക്രിയ സൂചിപ്പിക്കുന്നു; ‘വന്നിരിക്കുന്നു’ ഈ ദൃശ്യത്തിലെ തൽക്ഷണ പ്രസക്തി നിലനിർത്തുന്നു.
- source_word: כִּדְבַר עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ പറഞ്ഞതുപോലെതന്നെ
  rationale: דבר ഇവിടെ പറഞ്ഞ വാക്കിനെയോ പ്രസ്താവനയെയോ സൂചിപ്പിക്കുന്നു. ‘അങ്ങയുടെ ദാസൻ’ എന്നത് യോനാദാബിന്റെ കൊട്ടാരമര്യാദയുള്ള സ്വയംപരാമർശം നിലനിർത്തുന്നു.
- source_word: כֵּן הָיָה
  choice: സംഭവിച്ചിരിക്കുന്നു
  rationale: യോനാദാബിന്റെ മുൻപ്രസ്താവന ശരിയായി നിറവേറിയെന്ന സ്ഥിരീകരണം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; മുൻപുള്ള ‘പോലെതന്നെ’ എന്നതോടൊപ്പം എബ്രായത്തിലെ പരസ്പരബന്ധവും നിലനിൽക്കുന്നു.
