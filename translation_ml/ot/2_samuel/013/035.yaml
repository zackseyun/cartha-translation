translation_notes:
  register: ആധുനികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. രാജസന്നിധിയിലെ സാമൂഹിക അകലം സൂചിപ്പിക്കാൻ ‘അങ്ങയുടെ ദാസൻ’ ഉപയോഗിച്ചു; അതേസമയം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകാത്ത പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
