source:
  edition: WLC
  text: וַ/תְּכַל֙ דָּוִ֣ד הַ/מֶּ֔לֶךְ לָ/צֵ֖את אֶל אַבְשָׁל֑וֹם כִּֽי נִחַ֥ם עַל אַמְנ֖וֹן כִּֽי מֵֽת־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/039.yaml
  text: And King David longed to go out to Absalom, for he was comforted concerning Amnon, since he was dead.
translation:
  language: ml
  text: അബ്ശാലോമിന്റെ അടുക്കൽ പോകാൻ ദാവീദ് രാജാവിന്റെ മനം വെമ്പി.[a] കാരണം, അമ്നോൻ മരിച്ചുപോയതിനെച്ചൊല്ലിയുള്ള ദുഃഖത്തിൽനിന്ന് അദ്ദേഹം ആശ്വാസം പ്രാപിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഈ വാക്യത്തിലെ എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്. മറ്റൊരു സാധ്യത: “ദാവീദ് രാജാവ് അബ്ശാലോമിന്റെ അടുക്കലേക്കു പോകുന്നത് അവസാനിപ്പിച്ചു.”'
    reason: വַתְּכַל എന്ന സ്ത്രീലിംഗ ക്രിയാരൂപത്തിന്റെയും לָצֵאת אֶל എന്ന പ്രയോഗത്തിന്റെയും വ്യാഖ്യാനത്തിൽ നിലനിൽക്കുന്ന യഥാർഥ പാഠാർഥ-അവ്യക്തത സംരക്ഷിക്കാൻ; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ശത്രുത ബദൽവായനയിൽ ചേർക്കാതിരിക്കാൻ.
lexical_decisions:
- source_word: וַתְּכַל
  choice: മനം വെമ്പി
  rationale: ഈ ദുഷ്കരമായ എബ്രായ പ്രയോഗത്തിൽ ‘ആഗ്രഹംകൊണ്ട് ക്ഷയിച്ചു/വെമ്പി’ എന്ന അർഥമാണ് സന്ദർഭത്തിനും പ്രധാന പുരാതന വ്യാഖ്യാനപാരമ്പര്യത്തിനും യോജിക്കുന്നത്. സ്വാഭാവികവും വികാരതീവ്രതയുള്ളതുമായ മലയാളത്തിനായി ‘മനം വെമ്പി’ ഉപയോഗിച്ചു.
- source_word: לָצֵאת אֶל־אַבְשָׁלוֹם
  choice: അബ്ശാലോമിന്റെ അടുക്കൽ പോകാൻ
  rationale: לצאת എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘പുറപ്പെട്ടു പോകുക’ മലയാളത്തിൽ സന്ദർഭോചിതമായി ‘പോകുക’ എന്നു നൽകി; אֶל എന്നത് ഇവിടെ ലക്ഷ്യദിശ സൂചിപ്പിക്കുന്നതിനാൽ ‘അടുക്കൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: נִחַם עַל־אַמְנוֹן
  choice: അമ്നോൻ മരിച്ചുപോയതിനെച്ചൊല്ലിയുള്ള ദുഃഖത്തിൽനിന്ന് അദ്ദേഹം ആശ്വാസം പ്രാപിച്ചിരുന്നു
  rationale: נחם എന്ന നിഫാൽ രൂപത്തിന്റെ ‘ആശ്വാസം പ്രാപിക്കുക’ എന്ന അർഥം നിലനിർത്തി. ‘അമ്നോനെക്കുറിച്ച് ആശ്വസിച്ചു’ എന്ന അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമായ മലയാളം ഒഴിവാക്കി, ദുഃഖത്തിൽനിന്നുള്ള ആശ്വാസം വ്യക്തമാക്കി.
theological_decisions:
- issue: ദാവീദിന്റെ അബ്ശാലോമിനോടുള്ള നിലപാട്
  choice: അബ്ശാലോമിന്റെ അടുക്കൽ പോകാൻ ദാവീദിന്റെ മനം വെമ്പി
  alternative: അബ്ശാലോമിനെതിരെ പുറപ്പെടുന്നത് ദാവീദ് അവസാനിപ്പിച്ചു
  rationale: മസോററ്റിക് വാക്യഘടന ദുഷ്കരമായതിനാൽ ഇരുവായനകളും നിലനിൽക്കുന്നു. മുഖ്യപാഠത്തിൽ ആഗ്രഹം എന്ന പരമ്പരാഗത വായന സ്വീകരിച്ചെങ്കിലും, ദാവീദ് അബ്ശാലോമിനെ ക്ഷമിച്ചുവെന്നോ പൂർണമായി അനുരഞ്ജിതനായെന്നോ അതിലധികം വ്യാഖ്യാനം ചേർത്തിട്ടില്ല; മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മനം വെമ്പി’ വികാരതീവ്രത സ്വാഭാവികമായി നൽകുന്നു; അതേസമയം അടിക്കുറിപ്പ് എബ്രായ പാഠത്തിലെ അനിശ്ചിതത്വം തുറന്നുവയ്ക്കുന്നു.
