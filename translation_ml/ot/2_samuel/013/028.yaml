  terminology: അബ്ശാലോം, അമ്നോൻ എന്നീ പേരുകൾ സ്ഥിരതയുള്ള മലയാള ബൈബിൾരൂപങ്ങളാണ്. ‘യുവാക്കൾ’ נְעָרָיו-യുടെ നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ പരിഭാഷയാണ്; ‘വീരന്മാർ’ בני חיל-ന്റെ പുരുഷസൂചനയും ധീരത/യോദ്ധൃഭാവവും സംരക്ഷിക്കുന്നു.
