  text: וַ/יְצַו֩ אַבְשָׁל֨וֹם אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר רְא֣וּ נָ֠א כְּ/ט֨וֹב לֵב אַמְנ֤וֹן בַּ/יַּ֨יִן֙ וְ/אָמַרְתִּ֣י אֲלֵי/כֶ֔ם הַכּ֧וּ אֶת אַמְנ֛וֹן וַ/הֲמִתֶּ֥ם אֹת֖/וֹ אַל תִּירָ֑אוּ הֲ/ל֗וֹא כִּ֤י אָֽנֹכִי֙ צִוִּ֣יתִי אֶתְ/כֶ֔ם חִזְק֖וּ וִ/הְי֥וּ לִ/בְנֵי חָֽיִל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
translation:
  language: ml
  text: 'അപ്പോൾ അബ്ശാലോം തന്റെ യുവാക്കളോടു കല്പിച്ചു: “ശ്രദ്ധിച്ചുകൊള്ളുക: വീഞ്ഞിനാൽ അമ്നോന്റെ ഹൃദയം ഉല്ലസിക്കുമ്പോൾ[a], ‘അമ്നോനെ അടിക്കുവിൻ’ എന്നു ഞാൻ നിങ്ങളോടു പറയുന്ന ഉടനെ അവനെ കൊന്നുകളയുവിൻ. ഭയപ്പെടരുത്. ഞാൻ തന്നെയല്ലയോ നിങ്ങളോടു കല്പിച്ചത്? ശക്തരായിരിക്കുവിൻ; വീരന്മാരായിരിക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വീഞ്ഞ് കുടിച്ച് അമ്നോൻ ഉല്ലാസവാനാകുമ്പോൾ.” എബ്രായ ശൈലി അക്ഷരാർഥത്തിൽ അവന്റെ ഹൃദയം വീഞ്ഞുകൊണ്ട് ‘നല്ലതാകുന്നതിനെ’ക്കുറിച്ചാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָרָיו
  choice: തന്റെ യുവാക്കൾ
  rationale: נַעַר എന്ന പദത്തിന് യുവാവ്, ഭൃത്യൻ, പരിചാരകൻ, അനുചരൻ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ അക്രമം നടപ്പാക്കാൻ കല്പന ലഭിക്കുന്ന അബ്ശാലോമിന്റെ പുരുഷാനുചരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘യുവാക്കൾ’ മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥവും സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: רְאוּ נָא
  choice: ശ്രദ്ധിച്ചുകൊള്ളുക
  rationale: ראה എന്ന കല്പനാരൂപവും נָא എന്ന നിപാതവും ചേർന്ന് ജാഗ്രതയോടെ ശ്രദ്ധിക്കാൻ ആവശ്യപ്പെടുന്നു. ആധുനിക മലയാളത്തിൽ കല്പനയുടെ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  choice: വീഞ്ഞിനാൽ അമ്നോന്റെ ഹൃദയം ഉല്ലസിക്കുമ്പോൾ
  rationale: ‘ഹൃദയം വീഞ്ഞുകൊണ്ട് നല്ലതാകുക’ എന്ന എബ്രായ ശൈലി വീഞ്ഞിന്റെ സ്വാധീനത്താൽ സന്തോഷവും അയവും വന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; പൂർണ മദ്യലഹരി നിർബന്ധമായി അർഥമാക്കുന്നില്ല. ‘ഹൃദയം ഉല്ലസിക്കുക’ എന്നത് മൂലരൂപത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: הַכּוּ אֶת אַמְנוֹן
  choice: അമ്നോനെ അടിക്കുവിൻ
  rationale: נכה അടിക്കുക, പ്രഹരിക്കുക, ആക്രമിക്കുക എന്നിവ സൂചിപ്പിക്കുന്ന വിശാലമായ ക്രിയയാണ്. തുടർന്ന് വരുന്ന മരണപ്പെടുത്തൽ വേറിട്ട് നിലനിർത്താൻ ‘അടിക്കുവിൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַהֲמִתֶּם אֹתוֹ
  choice: അവനെ കൊന്നുകളയുവിൻ
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘മരിപ്പിക്കുക, കൊല്ലുക’ എന്നാണ്. സന്ദർഭത്തിലെ വ്യക്തമായ മാരക ഉദ്ദേശം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: אַל תִּירָאוּ
  choice: ഭയപ്പെടരുത്
  rationale: നേരിട്ടുള്ള നിരോധനകല്പനയാണ്; സ്വാഭാവികവും ശക്തവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: הֲלוֹא כִּי אָנֹכִי צִוִּיתִי אֶתְכֶם
  choice: ഞാൻ തന്നെയല്ലയോ നിങ്ങളോടു കല്പിച്ചത്?
  rationale: אָנֹכִי എന്ന ഊന്നലും അവരുടെ ഭയം മാറ്റാൻ അബ്ശാലോം സ്വന്തം അധികാരം ചൂണ്ടിക്കാണിക്കുന്ന വാചാടോപചോദ്യവും നിലനിർത്തുന്നു.
- source_word: חִזְקוּ
  choice: ശക്തരായിരിക്കുവിൻ
  rationale: חזק എന്ന കല്പന ശക്തിയും ധൈര്യവും കൈക്കൊള്ളാൻ ആഹ്വാനം ചെയ്യുന്നു. ‘ശക്തരായിരിക്കുവിൻ’ ഏറ്റവും നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: וִהְיוּ לִבְנֵי חָיִל
  choice: വീരന്മാരായിരിക്കുവിൻ
  rationale: בני חיל ധീരരും പ്രാപ്തരുമായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന, പലപ്പോഴും യുദ്ധഭാവമുള്ള ശൈലിയാണ്. ‘വീരന്മാർ’ അതിന്റെ പുരുഷലിംഗരൂപവും ധീരതയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: לִבְנֵי חָיִל എന്ന പ്രയോഗത്തിലെ പുരുഷലിംഗസൂചന
  choice: വീരന്മാരായിരിക്കുവിൻ
  alternative: ധൈര്യമുള്ളവരായിരിക്കുവിൻ
  rationale: മൂലഭാഷയിലെ പ്രയോഗം പുരുഷലിംഗത്തിലുള്ളതും ഈ രാജകീയ-അക്രമസന്ദർഭത്തിലെ പുരുഷാനുചരന്മാരെ അഭിസംബോധന ചെയ്യുന്നതുമാണ്. ലിംഗനിരപേക്ഷമായ പരിഭാഷ മൂലത്തിന്റെ സാമൂഹികസന്ദർഭവും രൂപവും മങ്ങിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. കൂട്ടത്തോടുള്ള കല്പനകൾക്ക് ‘-വിൻ’ രൂപം ഉപയോഗിച്ച് രാജകീയവും സൈനികവുമായ സ്വരം നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം വിശദീകരിക്കുന്ന വീഞ്ഞുസംബന്ധമായ ശൈലിക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
