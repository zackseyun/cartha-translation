  source_fidelity: 'മൂലഎബ്രായത്തിലെ കല്പനകളുടെ ക്രമവും അർഥവ്യാപ്തിയും കൃത്യമായി നിലനിർത്തിയിരിക്കുന്നു: അബ്ശാലോം തന്റെ യുവാനുചരന്മാരെ ജാഗ്രതയോടെ നോക്കാൻ പറഞ്ഞ്, അമ്നോൻ വീഞ്ഞുമൂലം ഉല്ലാസാവസ്ഥയിലായിരിക്കുമ്പോൾ തന്റെ സൂചനപ്രകാരം അവനെ ആക്രമിച്ചു കൊല്ലാൻ കല്പിക്കുന്നു. ‘ഞാൻ തന്നെയല്ലയോ’ എന്ന പ്രയോഗം אָנֹכִי-യുടെ ഊന്നലും വാചാടോപചോദ്യത്തിന്റെ സ്വരവും നൽകുന്നു.'
