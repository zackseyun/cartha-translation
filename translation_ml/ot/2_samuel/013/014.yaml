  yaml_path: translation/ot/2_samuel/013/014.yaml
  text: But he would not listen to her[a], and he was stronger than she was[c][b], and he violated her and lay with her.
translation:
  language: ml
  text: എന്നാൽ അവളുടെ വാക്കു കേൾക്കാൻ അവന് മനസ്സില്ലായിരുന്നു[a]. അവൻ അവളെക്കാൾ ശക്തനായിരുന്നു[b]; അവളെ ബലാൽക്കാരം ചെയ്തു[c], അവളോടുകൂടെ ശയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: ‘അവൻ അവളുടെ ശബ്ദം കേട്ടില്ല.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘അവൻ അവളെ കീഴടക്കി.’'
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രു ക്രിയയ്ക്ക് ‘അപമാനിച്ചു’ അല്ലെങ്കിൽ ‘അതിക്രമിച്ചു’ എന്നും അർഥമാകാം; ഇവിടെ അത് ലൈംഗിക അതിക്രമത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: മനസ്സില്ലായിരുന്നു
  rationale: നിഷേധത്തോടുകൂടിയ ഈ ക്രിയ സന്നദ്ധതയുടെ അഭാവവും മനഃപൂർവമായ നിരസനവും സൂചിപ്പിക്കുന്നു. ആ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִשְׁמֹעַ בְּקוֹלָהּ
  choice: അവളുടെ വാക്കു കേൾക്കാൻ
  rationale: അക്ഷരാർഥം ‘അവളുടെ ശബ്ദം കേൾക്കുക’ എന്നാണെങ്കിലും ഇവിടെ അവളുടെ അപേക്ഷ ചെവിക്കൊള്ളുക എന്ന അർഥമാണ്. ‘വാക്കു കേൾക്കുക’ ഹീബ്രു പ്രയോഗത്തിന്റെ ഭാവവും മലയാളത്തിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: וַיֶּחֱזַק מִמֶּנָּה
  choice: അവൻ അവളെക്കാൾ ശക്തനായിരുന്നതിനാൽ
  rationale: חזק എന്ന ക്രിയ מן സഹിതം ഒരാളെക്കാൾ ശക്തിപ്രാപിച്ച് മേൽക്കൈ നേടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ താരതമ്യഭാവം നിലനിർത്തുകയും തുടർന്നുള്ള അതിക്രമത്തിന്റെ സാഹചര്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְעַנֶּהָ
  choice: അവളെ ബലാൽക്കാരം ചെയ്ത്
  rationale: ലൈംഗിക അതിക്രമത്തിന്റെ ഈ സന്ദർഭത്തിൽ ענה അപമാനിക്കൽ/പീഡിപ്പിക്കൽ എന്നതിലുപരി ബലപ്രയോഗത്തിലൂടെയുള്ള ലൈംഗിക ലംഘനത്തെ സൂചിപ്പിക്കുന്നു. ‘ബലാൽക്കാരം’ സംഭവത്തിന്റെ നിർബന്ധിതവും ക്രൂരവുമായ സ്വഭാവം സാധാരണ വായനക്കാർക്ക് മറച്ചുവയ്ക്കാതെ അറിയിക്കുന്നു.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: അവളോടുകൂടെ ശയിച്ചു
  rationale: ഇത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ഹീബ്രു പ്രയോഗമാണ്. ‘ശയിച്ചു’ എന്നത് ഗൗരവമുള്ളതും സന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളപ്രയോഗമാണ്; മുൻപുള്ള ‘ബലാൽക്കാരം’ സമ്മതത്തിന്റെ അഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും നേരിട്ടുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ലൈംഗിക അതിക്രമം മയപ്പെടുത്താതെയും അനാവശ്യമായി വൈദ്യശാസ്ത്രപരമോ അശ്ലീലമോ ആക്കാതെയും അവതരിപ്പിച്ചു. ‘മാനഭംഗം’ പോലുള്ള ഇരയുടെ മാനത്തെ കേന്ദ്രീകരിക്കുന്ന പഴയ പ്രയോഗം ഒഴിവാക്കി.
