  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וּ/לְ/אַבְשָׁל֧וֹם בֶּן דָּוִ֛ד אָח֥וֹת יָפָ֖ה וּ/שְׁמָ֣/הּ תָּמָ֑ר וַ/יֶּאֱהָבֶ֖/הָ אַמְנ֥וֹן בֶּן דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/001.yaml
  text: After this[a], Absalom son of David had a beautiful sister whose name was Tamar, and Amnon son of David loved her.
translation:
  language: ml
  text: അതിനുശേഷം, ദാവീദിന്റെ മകനായ അബ്ശാലോമിന് താമാർ എന്നു പേരുള്ള സുന്ദരിയായ ഒരു സഹോദരി ഉണ്ടായിരുന്നു. ദാവീദിന്റെ മകനായ അമ്നോൻ അവളെ സ്നേഹിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളോടു ഭ്രമം തോന്നി’ അല്ലെങ്കിൽ ‘അവളെ മോഹിച്ചു.’ ഹീബ്രായത്തിൽ ‘സ്നേഹിക്കുക’ എന്ന സാധാരണ ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എന്നാൽ തുടർന്നുള്ള വിവരണം അമ്നോന്റെ വികാരം ദുഷിച്ചതായിരുന്നുവെന്ന് കാണിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: അതിനുശേഷം
  rationale: വിവരണത്തിന്റെ തുടക്കത്തിലുള്ള וַיְהִי എന്ന പ്രയോഗത്തെയും സമയക്രമം സൂചിപ്പിക്കുന്ന אַחֲרֵי כֵן എന്നതിനെയും സ്വാഭാവികമായ ഒറ്റ മലയാളപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וּלְאַבְשָׁלוֹם בֶּן דָּוִד
  choice: ദാവീദിന്റെ മകനായ അബ്ശാലോമിന് ... ഉണ്ടായിരുന്നു
  rationale: ഹീബ്രായ ഉടമസ്ഥതാഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ‘അബ്ശാലോമിന് ... ഉണ്ടായിരുന്നു’ എന്ന രൂപത്തിൽ നൽകി; രാജകുടുംബബന്ധത്തിന് വാക്യം നൽകുന്ന ഊന്നൽ നിലനിർത്താൻ ‘ദാവീദിന്റെ മകൻ’ സംരക്ഷിച്ചു.
- source_word: אָחוֹת יָפָה
  choice: സുന്ദരിയായ ഒരു സഹോദരി
  rationale: יָפָה ഇവിടെ ശാരീരികസൗന്ദര്യത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണക്രമം ഉപയോഗിച്ചു.
- source_word: וּשְׁמָהּ תָּמָר
  choice: താമാർ എന്നു പേരുള്ള
  rationale: ലളിതമായ നാമകരണവാക്യം ആധുനിക മലയാളത്തിൽ ഒഴുക്കോടെ ചേർത്തിരിക്കുന്നു.
- source_word: וַיֶּאֱהָבֶהָ
  choice: അവളെ സ്നേഹിച്ചു
  rationale: אהב എന്നത് ‘സ്നേഹിക്കുക’ എന്ന സാധാരണ ഹീബ്രായ ക്രിയയാണ്. തുടർന്നുള്ള കഥയിലെ ദുഷിച്ച ആഗ്രഹം ഈ വാക്യത്തിലേക്ക് മുൻകൂട്ടി ചേർക്കാതെ മൂലപദത്തിന്റെ അർത്ഥവും സാഹിത്യപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: אַמְנוֹן בֶּן דָּוִד
  choice: ദാവീദിന്റെ മകനായ അമ്നോൻ
  rationale: വാക്യത്തിൽ ആവർത്തിക്കുന്ന രാജകുടുംബപരമായ തിരിച്ചറിയൽ ഒഴിവാക്കാതെ സംരക്ഷിച്ചു.
theological_decisions:
- issue: ധാർമ്മികമായി കലുഷിതമായ സന്ദർഭത്തിൽ אהב എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: സ്നേഹിച്ചു
  alternative: അവളെ മോഹിച്ചു / അവളോടു ഭ്രമം തോന്നി
  rationale: പിന്നീടുള്ള വിവരണം അമ്നോന്റെ ‘സ്നേഹം’ ദുഷിച്ചതും അക്രമാസക്തവുമാണെന്ന് വെളിപ്പെടുത്തുന്നു. എന്നാൽ ഈ വാക്യം സാധാരണ ‘സ്നേഹിക്കുക’ എന്ന ക്രിയ തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കാതെ മുഖ്യപാഠത്തിൽ അതേ അർത്ഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. പേരുകൾ ‘അബ്ശാലോം,’ ‘താമാർ,’ ‘അമ്നോൻ’ എന്നിങ്ങനെ മൂലഭാഷയോട് അടുത്ത രൂപത്തിൽ നൽകി. മുഖ്യപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
