translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. വസ്ത്രപദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം പ്രധാന പാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു; ഉറവിടത്തിൽ ഇല്ലാത്ത ഒരു ആരംഭകാലസൂചകം ചേർത്തിട്ടില്ല.
