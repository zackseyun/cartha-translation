id: 2SA.13.18
reference: 2 Samuel 13:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָלֶ֨י/הָ֙ כְּתֹ֣נֶת פַּסִּ֔ים כִּי֩ כֵ֨ן תִּלְבַּ֧שְׁןָ בְנוֹת הַ/מֶּ֛לֶךְ הַ/בְּתוּלֹ֖ת מְעִילִ֑ים וַ/יֹּצֵ֨א אוֹתָ֤/הּ מְשָֽׁרְת/וֹ֙ הַ/ח֔וּץ וְ/נָעַ֥ל הַ/דֶּ֖לֶת אַחֲרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/018.yaml
  text: She was wearing a richly ornamented robe[a], for this is how the virgin daughters of the king used to dress. Then his attendant put her outside and bolted the door behind her.
translation:
  language: ml
  text: അവൾ അലങ്കാരപ്പണികളുള്ള ഒരു അങ്കി ധരിച്ചിരുന്നു[a]. കന്യകകളായ രാജകുമാരിമാർ പതിവായി ഇങ്ങനെയുള്ള മേലങ്കികളാണ് ധരിച്ചിരുന്നത്. പിന്നെ അവന്റെ പരിചാരകൻ അവളെ പുറത്താക്കി, അവളുടെ പിന്നിൽ വാതിൽ പൂട്ടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സവിശേഷമായി അലങ്കരിച്ച അങ്കി,’ ‘പല നിറങ്ങളുള്ള അങ്കി,’ അല്ലെങ്കിൽ ‘നീളമുള്ള കൈകളോടുകൂടിയ അങ്കി’; ഈ വസ്ത്രപ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת פַּסִּים
  choice: അലങ്കാരപ്പണികളുള്ള ഒരു അങ്കി
  rationale: ഈ പ്രയോഗം സവിശേഷമായ ഒരു വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു; פַּסִּים എന്ന പദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്. പ്രധാന പാഠത്തിലെ ഈ രൂപം സ്വാഭാവികവും മാന്യവുമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כִּי כֵן תִּלְבַּשְׁןָ
  choice: പതിവായി ഇങ്ങനെയുള്ള ... ധരിച്ചിരുന്നത്
  rationale: ഈ ഘടന രാജകുമാരിമാരുടെ പതിവായ വസ്ത്രധാരണരീതിയെ വിശദീകരിക്കുന്നു; മലയാളത്തിൽ ആവർത്തിച്ചിരുന്ന ആചാരം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: בְנוֹת הַמֶּלֶךְ הַבְּתוּלֹת
  choice: കന്യകകളായ രാജകുമാരിമാർ
  rationale: രാജാവിന്റെ പുത്രിമാർ എന്ന പദവിയും അവരുടെ കന്യകാത്വവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു സംരക്ഷിക്കുന്നു.
- source_word: מְעִילִים
  choice: മേലങ്കികൾ
  rationale: ഈ നാമം മേൽവസ്ത്രങ്ങളെയോ അങ്കികളെയോ സൂചിപ്പിക്കുന്നു. വിശദീകരണവാക്യത്തിൽ 'മേലങ്കികൾ' എന്നു നൽകുന്നത് വസ്ത്രത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: מְשָׁרְתוֹ
  choice: അവന്റെ പരിചാരകൻ
  rationale: സന്ദർഭത്തിൽ അമ്നോനെ വ്യക്തിപരമായി സേവിക്കുന്ന ആളെയാണ് ഉദ്ദേശിക്കുന്നത്; 'പരിചാരകൻ' ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיֹּצֵא אוֹתָהּ הַחוּץ
  choice: അവളെ പുറത്താക്കി
  rationale: ഹീബ്രു കാരണരൂപം അവളെ പുറത്തേക്കു പോകുമാറാക്കി എന്നർഥം നൽകുന്നു. 'പുറത്താക്കി' സംക്ഷിപ്തവും സന്ദർഭത്തിലെ കാഠിന്യം അതിശയിപ്പിക്കാതെയും പ്രകടമാക്കുന്നു.
- source_word: וְנָעַל הַדֶּלֶת אַחֲרֶיהָ
  choice: അവളുടെ പിന്നിൽ വാതിൽ പൂട്ടി
  rationale: נעל എന്നത് വാതിൽ അടയ്ക്കുക എന്നതിലുപരി പൂട്ടുക എന്നർഥം നൽകുന്നു; אַחֲרֶיהָയിലെ സ്ഥലം/തുടർച്ചയുടെ ഭാവവും ഈ രൂപം സംരക്ഷിക്കുന്നു.
