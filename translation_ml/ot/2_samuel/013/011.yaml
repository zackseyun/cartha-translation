source:
  edition: WLC
  text: וַ/תַּגֵּ֥שׁ אֵלָ֖י/ו לֶֽ/אֱכֹ֑ל וַ/יַּֽחֲזֶק בָּ/הּ֙ וַ/יֹּ֣אמֶר לָ֔/הּ בּ֛וֹאִי שִׁכְבִ֥י עִמִּ֖/י אֲחוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/011.yaml
  text: When she brought it near to him to eat[a], he seized her and said to her, “Come, lie with me, my sister.”
translation:
  language: ml
  text: 'അവൻ ഭക്ഷിക്കാനായി അവൾ അത് അവന്റെ അടുക്കലേക്കു കൊണ്ടുവന്നപ്പോൾ[a], അവൻ അവളെ ബലമായി പിടിച്ച് അവളോടു പറഞ്ഞു: “എന്റെ സഹോദരീ, വാ, എന്നോടുകൂടെ കിടക്ക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവൾ ഭക്ഷിക്കാനായി അവന്റെ അടുത്തേക്കു വന്നപ്പോൾ”; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് താമാർ അടുത്തുവന്നു എന്നോ അവൾ ഭക്ഷണം അവന്റെ അടുത്തേക്കു കൊണ്ടുവന്നു എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: അവൾ ... അത് അടുത്തുകൊണ്ടുവന്നപ്പോൾ
  rationale: נגשׁ എന്ന ക്രിയയ്ക്ക് ‘അടുത്തുവരുക’ എന്നും ‘അടുത്തുകൊണ്ടുവരുക’ എന്നും അർഥമാകാം. താമാർ ഭക്ഷണം വിളമ്പുന്ന സന്ദർഭമായതിനാൽ മുഖ്യപാഠത്തിൽ ഭക്ഷണം അടുത്തുകൊണ്ടുവന്നു എന്ന അർഥം സ്വീകരിച്ചു; യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֵלָיו לֶאֱכֹל
  choice: അവന് ഭക്ഷിക്കാനായി
  rationale: ദിശാസൂചകമായ ‘അവന്റെ അടുക്കലേക്ക്’ എന്ന ആശയവും ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ഉം സ്വാഭാവികമായ മലയാളത്തിൽ ചേർത്ത് അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּחֲזֶק בָּהּ
  choice: അവളെ ബലമായി പിടിച്ച്
  rationale: חזק + ב എന്ന പ്രയോഗം ഉറച്ചും ബലപ്രയോഗത്തോടെയും പിടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ബലമായി പിടിച്ചു’ എന്നത് സന്ദർഭത്തിലെ നിർബന്ധസ്വഭാവം മയപ്പെടുത്താതെ വ്യക്തമാക്കുന്നു.
- source_word: בּוֹאִי
  choice: വരൂ
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞയുടെ നേരിട്ടുള്ള സ്വഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שִׁכְבִי עִמִּי
  choice: എന്നോടുകൂടെ കിടക്കൂ
  rationale: ഇത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. മലയാളത്തിലും അതിന്റെ നേരിട്ടുള്ളതും ഗൗരവവും നിലനിർത്തുന്ന രൂപമാണിത്.
- source_word: אֲחוֹתִי
  choice: എന്റെ സഹോദരീ
  rationale: കുടുംബബന്ധം ഈ സംഭവത്തിന്റെ ധാർമിക ഭീകരത ശക്തമാക്കുന്നതിനാൽ അഭിസംബോധന വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ലൈംഗിക ആജ്ഞയെ മയപ്പെടുത്താതെ പരിഭാഷപ്പെടുത്തൽ
  choice: എന്നോടുകൂടെ കിടക്കൂ
  alternative: എന്നോടൊപ്പം ഉറങ്ങൂ
  rationale: മൂലഭാഷയിലെ അംഗീകൃത ലൈംഗിക പ്രയോഗം മറച്ചുവയ്ക്കാതെയും അതിനെ അമിതമായി സംസാരഭാഷാപരമാക്കാതെയും അവതരിപ്പിക്കുന്നു.
- issue: സഹോദരബന്ധത്തിന്റെ അഭിസംബോധന നിലനിർത്തൽ
  choice: എന്റെ സഹോദരീ
  alternative: സഹോദരീ
  rationale: ‘എന്റെ’ എന്ന ഉടമസ്ഥസൂചന ഉൾപ്പെടെയുള്ള ബന്ധപദം സംഭവത്തിലെ ലംഘനത്തിന്റെ ഗൗരവത്തിന് കേന്ദ്രമാണ്; അതിനാൽ പൂർണമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അതിക്രമത്തിന്റെ ബലപ്രയോഗസ്വഭാവവും ലൈംഗിക ആവശ്യത്തിന്റെ വ്യക്തതയും മയപ്പെടുത്താതെ, അനാവശ്യമായ വിശദീകരണമോ വിഭാഗീയ ഭാഷയോ ഒഴിവാക്കി.
