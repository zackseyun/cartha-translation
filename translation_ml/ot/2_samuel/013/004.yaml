base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
translation:
  language: ml
  text: 'അവൻ അവനോടു ചോദിച്ചു: “രാജാവിന്റെ മകനായ നീ പ്രഭാതംതോറും[a] ഇങ്ങനെ ക്ഷീണിച്ചിരിക്കുന്നത് എന്തുകൊണ്ടാണ്? എന്നോടു പറയില്ലേ?” അമ്നോൻ അവനോടു പറഞ്ഞു: “എന്റെ സഹോദരനായ അബ്ശാലോമിന്റെ സഹോദരി താമാറിനെ ഞാൻ സ്നേഹിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എല്ലാ പ്രഭാതത്തിലും”; കൂടുതൽ പദാനുപദമായി, “പ്രഭാതം പ്രഭാതമായി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “എനിക്ക് താമാറിനോട് പ്രണയമാണ്.” എബ്രായത്തിൽ കൂടുതൽ പദാനുപദമായി, “ഞാൻ താമാറിനെ സ്നേഹിക്കുന്നു” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: എന്തുകൊണ്ടാണ്
  rationale: കാരണത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: כָּכָה דַּל
  choice: ഇങ്ങനെ ക്ഷീണിച്ചുകാണപ്പെടുന്നത്
  rationale: דַּל ഇവിടെ ദാരിദ്ര്യമല്ല, അമ്നോന്റെ മുഖത്തും ശരീരത്തും പ്രകടമായ ക്ഷയാവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്; ‘ക്ഷീണിച്ചുകാണപ്പെടുന്നത്’ ആ ദൃശ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֶּן הַמֶּלֶךְ
  choice: രാജാവിന്റെ മകനായ നീ
  rationale: ‘രാജകുമാരൻ’ എന്ന പദവി ഉപയോഗിക്കാതെ എബ്രായത്തിലെ ബന്ധസൂചനയും അഭിസംബോധനയുടെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: പ്രഭാതംതോറും
  rationale: ആവർത്തിച്ചുവരുന്ന ഓരോ പ്രഭാതത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ ആവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הֲלוֹא תַּגִּיד לִי
  choice: എന്നോടു പറയില്ലേ?
  rationale: ഉത്തരം പ്രതീക്ഷിച്ചുകൊണ്ടുള്ള പ്രേരണാഭാവമുള്ള ചോദ്യത്തെ മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  choice: എന്റെ സഹോദരനായ അബ്ശാലോമിന്റെ സഹോദരി
  rationale: എബ്രായത്തിലെ ബന്ധപരമായ ഘടനയും അബ്ശാലോമിനോടുള്ള ‘എന്റെ സഹോദരൻ’ എന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: אֲנִי אֹהֵב
  choice: ഞാൻ സ്നേഹിക്കുന്നു
  rationale: אָהֵב എന്ന സാധാരണ ‘സ്നേഹിക്കുക’ ക്രിയയുടെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള കഥയിൽ വെളിപ്പെടുന്ന വികൃതമായ മോഹം ഈ വാക്യത്തിലേക്ക് മുൻകൂട്ടി ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: താമാറിനോടുള്ള അമ്നോന്റെ വികാരം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: താമാറിനെ ഞാൻ സ്നേഹിക്കുന്നു
  alternative: എനിക്ക് താമാറിനോട് പ്രണയമാണ് / ഞാൻ താമാറിനെ മോഹിക്കുന്നു
  rationale: മൂലപാഠം സാധാരണ ‘സ്നേഹിക്കുക’ എന്ന അർഥമുള്ള אָהֵב ഉപയോഗിക്കുന്നു. കഥാസന്ദർഭം അമ്നോന്റെ ആഗ്രഹത്തിന്റെ പാപകരമായ സ്വഭാവം പിന്നീട് വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും, ഈ വാക്യത്തിൽ ഇല്ലാത്ത നൈതികമോ മാനസികമോ ആയ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ പാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവൻ അവനോട്’ എന്ന ആവർത്തനം സന്ദർഭത്തിൽ വ്യക്തിനാമങ്ങൾ ചേർക്കാതെ മൂലപാഠത്തിന്റെ സർവനാമഘടന സംരക്ഷിക്കുന്നു; ഉദ്ധരണികളിലെ ഭാഷ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതാണ്.
