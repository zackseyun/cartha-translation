  text: וַֽ/יְהִי֙ לִ/שְׁנָתַ֣יִם יָמִ֔ים וַ/יִּהְי֤וּ גֹֽזְזִים֙ לְ/אַבְשָׁל֔וֹם בְּ/בַ֥עַל חָצ֖וֹר אֲשֶׁ֣ר עִם אֶפְרָ֑יִם וַ/יִּקְרָ֥א אַבְשָׁל֖וֹם לְ/כָל בְּנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: It happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
translation:
  language: ml
  text: രണ്ടു പൂർണ വർഷം[a] കഴിഞ്ഞപ്പോൾ, എഫ്രയീമിന് സമീപമുള്ള ബാൽ-ഹാസോറിൽ അബ്ശാലോമിന് ആടുകളുടെ രോമം കത്രിക്കുന്നവർ ഉണ്ടായിരുന്നു. അബ്ശാലോം രാജാവിന്റെ പുത്രന്മാരെല്ലാവരെയും ക്ഷണിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘രണ്ടു വർഷം ദിവസങ്ങൾ’; പൂർണമായ രണ്ടു വർഷക്കാലത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנָתַיִם יָמִים
  choice: രണ്ടു പൂർണവർഷം കഴിഞ്ഞപ്പോൾ
  rationale: ‘രണ്ടു വർഷം ദിവസങ്ങൾ’ എന്ന എബ്രായ പ്രയോഗം പൂർത്തിയായ രണ്ടു വർഷക്കാലത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സമയബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാണ് ഈ രൂപം.
- source_word: גֹזְזִים
  choice: ആടുകളുടെ രോമം കത്രിക്കുന്നവർ
  rationale: പദം കത്രിക്കുന്ന ആളുകളെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്ന മൃഗം ആടാണെന്നത് മലയാളവായനക്കാരന് വ്യക്തമായി നൽകുന്നു.
- source_word: בְּבַעַל חָצוֹר
  choice: ബാൽ-ഹാസോറിൽ
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; സ്ഥലസൂചകമായ בְ മലയാളത്തിലെ ‘-യിൽ’ കൊണ്ട് നൽകി.
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  choice: എഫ്രയീമിന് സമീപമുള്ള
  rationale: ഇവിടെയുള്ള עִם ഭൂമിശാസ്ത്രപരമായ സാമീപ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘സമീപമുള്ള’ എന്ന് സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: וַיִּקְרָא
  choice: ക്ഷണിച്ചു
  rationale: അക്ഷരാർഥം ‘വിളിച്ചു’ എന്നാണെങ്കിലും വിരുന്നുമായി ബന്ധപ്പെട്ട ഈ സന്ദർഭത്തിൽ ക്ഷണിക്കുക എന്ന പ്രയോഗാർഥമാണ് ഉചിതം.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ പുത്രന്മാരെല്ലാവരെയും
  rationale: മുഴുവൻ വിഭാഗത്തെയും ഉൾക്കൊള്ളുന്ന כָל എന്നതും രാജകുടുംബബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיְהִי
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സംഭവക്രമം മലയാളത്തിലെ കാലവാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന കാലപ്രയോഗത്തിനു പിന്നാലെ [a] ചേർത്തിരിക്കുന്നു.
