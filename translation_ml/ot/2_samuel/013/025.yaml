source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל אַבְשָׁל֗וֹם אַל בְּנִ/י֙ אַל נָ֤א נֵלֵךְ֙ כֻּלָּ֔/נוּ וְ/לֹ֥א נִכְבַּ֖ד עָלֶ֑י/ךָ וַ/יִּפְרָץ בּ֛/וֹ וְ/לֹֽא אָבָ֥ה לָ/לֶ֖כֶת וַֽ/יְבָרֲכֵֽ/הוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: ml
  text: 'എന്നാൽ രാജാവ് അബ്ശാലോമിനോടു പറഞ്ഞു: “വേണ്ടാ, മകനേ, ദയവായി ഞങ്ങളെല്ലാവരും പോകേണ്ട; ഞങ്ങൾ നിനക്കു ഭാരമാകേണ്ടല്ലോ.” അബ്ശാലോം രാജാവിനോട് വളരെ നിർബന്ധിച്ചെങ്കിലും, രാജാവ് പോകാൻ സമ്മതിച്ചില്ല; അങ്ങനെ രാജാവ് അവനെ അനുഗ്രഹിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל־נָא נֵלֵךְ כֻּלָּנוּ
  choice: ഞങ്ങൾ എല്ലാവരും വരേണ്ട
  rationale: നിഷേധാത്മക അഭ്യർഥനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; നָאയുടെ വിനയഭാവം മുൻപുള്ള “വേണ്ടാ, മകനേ!” എന്നതിൽ പ്രതിഫലിക്കുന്നു.
- source_word: וְלֹא נִכְבַּד עָלֶיךָ
  choice: നിനക്കു ഭാരമായേക്കും
  rationale: כבד എന്ന ധാതുവിന്റെ ‘ഭാരമാകുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ സാധ്യത/ഉദ്ദേശ്യഭാവം മലയാളത്തിലെ “ആയേക്കും” കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: וַיִּפְרָץ בּוֹ
  choice: അബ്ശാലോം നിർബന്ധിച്ചെങ്കിലും
  rationale: פרץ ב എന്ന പ്രയോഗം ഇവിടെ ഒരാളെ ശക്തമായി പ്രേരിപ്പിക്കുക/നിർബന്ധിക്കുക എന്ന അർഥത്തിലാണ്; സർവനാമത്തിന്റെ സൂചിത വ്യക്തി ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേരുപയോഗിച്ചു.
- source_word: וְלֹא אָבָה לָלֶכֶת
  choice: രാജാവ് പോകാൻ സമ്മതിച്ചില്ല
  rationale: אבהയുടെ ‘മനസ്സാകുക/സമ്മതിക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; കർത്താവിനെ വ്യക്തമായി പറയുന്നു.
- source_word: וַיְבָרֲכֵהוּ
  choice: അവൻ അബ്ശാലോമിനെ അനുഗ്രഹിച്ചു
  rationale: ഹീബ്രു സർവനാമങ്ങളെ സന്ദർഭാനുസൃതമായി രാജാവ്–അബ്ശാലോം എന്നു വ്യക്തമാക്കുന്നു; ‘അനുഗ്രഹിച്ചു’ എന്ന പദം മതപരവും വിടപറയൽപരവുമായ സാധ്യത തുറന്നുവയ്ക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. രാജാവിന്റെ പിതൃസ്നേഹമുള്ള അഭിസംബോധനയും അബ്ശാലോമിന്റെ ശക്തമായ നിർബന്ധവും നിലനിർത്തിയിരിക്കുന്നു. മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ പ്രത്യേക വിവാദമൊന്നുമില്ല; ‘അനുഗ്രഹിച്ചു’ എന്നത് വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതേപടി സൂക്ഷിച്ചു.
