  text: וַ/יִּקְרָ֗א אֶֽת נַעֲר/וֹ֙ מְשָׁ֣רְת֔/וֹ וַ/יֹּ֕אמֶר שִׁלְחוּ נָ֥א אֶת זֹ֛את מֵ/עָלַ֖/י הַ/ח֑וּצָ/ה וּ/נְעֹ֥ל הַ/דֶּ֖לֶת אַחֲרֶֽי/הָ־־־׃
