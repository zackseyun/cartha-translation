  yaml_path: translation/ot/2_samuel/013/017.yaml
  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ തന്റെ ശുശ്രൂഷകനായ യുവാവിനെ വിളിച്ച് പറഞ്ഞു: “ഇവളെ എന്റെ അടുക്കൽനിന്ന് പുറത്തേക്ക് അയയ്ക്കുക; അവളുടെ പിന്നാലെ വാതിലിന് ഓടാമ്പലിടുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവളുടെ പിന്നാലെ വാതിൽ പൂട്ടുക.” എബ്രായ ക്രിയയ്ക്ക് വാതിൽ ഓടാമ്പലിട്ട് ഉറപ്പിക്കുക, തടയിടുക, പൂട്ടുക എന്നീ അർഥങ്ങൾ വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ מְשָׁרְתוֹ
  choice: തന്നെ ശുശ്രൂഷിച്ചിരുന്ന യുവാവ്
  rationale: נַעַר എന്നതിലെ ‘യുവാവ്’ എന്ന അർഥവും מְשָׁרֵת എന്നതിലെ വ്യക്തിപരമായ സേവനവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് അമ്നോന്റെ പുരുഷപരിചാരകനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: שִׁלְחוּ נָא
  choice: പുറത്താക്കുക
  rationale: ഇവിടെ שלח എന്ന കല്പനയുടെ സന്ദർഭാർഥം ‘പുറത്തേക്ക് അയയ്ക്കുക/പുറത്താക്കുക’ എന്നാണ്. נָא കല്പനയുടെ അടിയന്തരമായ അഭ്യർഥനാഭാവം നൽകാമെങ്കിലും, അമ്നോന്റെ പരിചാരകനോടുള്ള ഈ നേരിട്ടുള്ള കല്പനയിൽ മലയാളത്തിൽ ‘ദയവായി’ ചേർക്കുന്നത് അനാവശ്യമായി വിനീതമായ ഭാവം സൃഷ്ടിക്കാം.
- source_word: זֹאת
  choice: ഇവളെ
  rationale: സ്ത്രീലിംഗ ഏകവചന സൂചകസർവനാമത്തെ നാമം കൂട്ടിച്ചേർക്കാതെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. താമാറിന്റെ പേര് ഒഴിവാക്കി അവളെ അകറ്റിനിർത്തിയും അവഹേളിച്ചും പറയുന്ന ഭാവം ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: מֵעָלַי הַחוּצָה
  choice: എന്റെ അടുക്കൽനിന്ന് പുറത്താക്കുക
  rationale: പദശഃ ‘എന്റെ മേൽനിന്ന് പുറത്തേക്ക്’ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക സന്ദർഭാർഥം അവളെ തന്റെ സന്നിധിയിൽനിന്ന് പുറത്തേക്ക് നീക്കുക എന്നതാണ്.
- source_word: וּנְעֹל הַדֶּלֶת
  choice: വാതിൽ ഓടാമ്പലിടുക
  rationale: נעל എന്ന ക്രിയയ്ക്ക് വാതിൽ അടച്ച് ഉറപ്പിക്കുക, പൂട്ടുക, തടയിടുക എന്നീ അർഥങ്ങളുണ്ട്. പുരാതന വാതിലിന്റെ സാഹചര്യത്തിൽ ‘ഓടാമ്പലിടുക’ ബോൾട്ട്/ബാർ ഉപയോഗിച്ച് ഉറപ്പിക്കുന്ന പ്രവൃത്തിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אַחֲרֶיהָ
  choice: അവളുടെ പിന്നാലെ
  rationale: പദശഃ ‘അവളുടെ ശേഷം/പിന്നിൽ’ എന്നത്, അവൾ പുറത്തുപോയശേഷം വാതിൽ ഉറപ്പിക്കുക എന്ന അർഥത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. ‘ഇവളെ’ എന്ന പ്രയോഗം താമാറിനെ പേരുപറയാതെ അവഹേളനപരമായി അകറ്റിനിർത്തുന്ന മൂലഭാഷയുടെ സ്വരം നിലനിർത്തുന്നു. ‘ഓടാമ്പലിടുക’ പുരാതന വാതിൽ ഉറപ്പിക്കുന്ന രീതിക്ക് യോജിച്ചതാണ്; കൂടുതൽ പൊതുവായ ‘പൂട്ടുക’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
