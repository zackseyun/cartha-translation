translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. അപൂർവമായ ഭക്ഷണപദങ്ങളുടെ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ അമിതമായി നിർണയിക്കാതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
