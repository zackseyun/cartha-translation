source:
  edition: WLC
  text: וַ/תֵּ֣לֶךְ תָּמָ֗ר בֵּ֛ית אַמְנ֥וֹן אָחִ֖י/הָ וְ/ה֣וּא שֹׁכֵ֑ב וַ/תִּקַּ֨ח אֶת הַ/בָּצֵ֤ק ו/תלוש וַ/תְּלַבֵּ֣ב לְ/עֵינָ֔י/ו וַ/תְּבַשֵּׁ֖ל אֶת הַ/לְּבִבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
translation:
  language: ml
  text: അങ്ങനെ താമാർ തന്റെ സഹോദരനായ അമ്നോന്റെ വീട്ടിലേക്കു ചെന്നു; അവൻ കിടക്കുകയായിരുന്നു. അവൾ മാവ് എടുത്ത് കുഴച്ച്, അവന്റെ കൺമുന്നിൽ അപ്പങ്ങൾ ഉണ്ടാക്കി[a], അപ്പങ്ങൾ പാകം ചെയ്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹൃദയാകൃതിയിലുള്ള അപ്പങ്ങൾ ഉണ്ടാക്കി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയും നാമവും അപൂർവമാണ്; അവ ‘ഹൃദയം’ എന്ന പദവുമായി ബന്ധപ്പെട്ട ഒരു ആകൃതിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അപ്പങ്ങൾ വേവിച്ചു.’ എബ്രായ ക്രിയയ്ക്ക് പ്രത്യേകമായി വെള്ളത്തിൽ വേവിക്കുക എന്ന അർഥമുണ്ടാകാമെങ്കിലും, ഇവിടെ പൊതുവായി പാകം ചെയ്യുക എന്ന അർഥവും സാധ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: അങ്ങനെ ... ചെന്നു
  rationale: വാവ്-തുടർച്ച മുൻ നിർദേശത്തെ തുടർന്നുള്ള സംഭവക്രമവും അതിന്റെ ഫലവും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനബന്ധമായി ‘അങ്ങനെ’ ഉപയോഗിച്ചു.
- source_word: בֵּית אַמְנוֹן אָחִיהָ
  choice: തന്റെ സഹോദരനായ അമ്നോന്റെ വീട്ടിലേക്കു
  rationale: ചലനദിശയും ബന്ധസൂചനയും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְהוּא שֹׁכֵב
  choice: അവൻ കിടക്കുകയായിരുന്നു
  rationale: അമ്നോന്റെ അന്നത്തെ അവസ്ഥ വിവരിക്കുന്ന സാഹചര്യവാക്യം; ‘കിടപ്പിലായിരുന്നു’ എന്ന രോഗസൂചന കൂടുതലുള്ള വ്യാഖ്യാനം ഒഴിവാക്കി.
- source_word: הַבָּצֵק ... וְתָלֹשׁ
  choice: മാവ് എടുത്തു കുഴച്ച്
  rationale: בצק ഭക്ഷണം തയ്യാറാക്കാനുള്ള മാവിനെയും לוש മാവ് കുഴയ്ക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: וַתְּלַבֵּב
  choice: അതുകൊണ്ട് അപ്പങ്ങൾ രൂപപ്പെടുത്തി
  rationale: അപൂർവമായ ഈ ക്രിയ അടുത്തുള്ള לְבִבוֹת എന്ന ഭക്ഷണനാമവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു. രൂപപ്പെടുത്തുന്ന പ്രവൃത്തി വ്യക്തമാക്കുമ്പോഴും ‘ഹൃദയാകൃതിയിലുള്ളത്’ എന്ന അനിശ്ചിത വ്യുത്പത്തിയെ മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കുന്നില്ല.
- source_word: לְעֵינָיו
  choice: അവന്റെ കൺമുന്നിൽ
  rationale: അവൻ കാണുന്നിടത്ത്, അവന്റെ സാന്നിധ്യത്തിൽ എന്ന ആശയം സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַתְּבַשֵּׁל
  choice: പാകം ചെയ്തു
  rationale: ക്രിയയ്ക്ക് പ്രത്യേകിച്ച് ‘വേവിക്കുക/തിളപ്പിക്കുക’ എന്ന അർഥമുണ്ടാകാമെങ്കിലും, ഇവിടെ പാചകരീതി നിർണയിക്കാതെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: הַלְּבִבוֹת
  choice: അപ്പങ്ങൾ
  rationale: താമാർ മാവുകൊണ്ട് ഉണ്ടാക്കിയ ഭക്ഷണവസ്തുവിനെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദത്തിൽ നൽകുന്നു; അപൂർവ നാമത്തിന്റെ ആകൃതിസംബന്ധമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
