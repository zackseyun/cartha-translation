  terminology: “രാജാവിന്റെ പുത്രന്മാർ,” “ശബ്ദമുയർത്തി,” and “ദാസന്മാർ” are appropriate for the narrative and register. “അതാ” suitably conveys the vivid attention-directing force of וְהִנֵּה.
