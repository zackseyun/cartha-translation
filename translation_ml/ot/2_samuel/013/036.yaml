  text: וַ/יְהִ֣י כְּ/כַלֹּת֣/וֹ לְ/דַבֵּ֗ר וְ/הִנֵּ֤ה בְנֵֽי הַ/מֶּ֨לֶךְ֙ בָּ֔אוּ וַ/יִּשְׂא֥וּ קוֹלָ֖/ם וַ/יִּבְכּ֑וּ וְ/גַם הַ/מֶּ֨לֶךְ֙ וְ/כָל עֲבָדָ֔י/ו בָּכ֕וּ בְּכִ֖י גָּד֥וֹל מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/036.yaml
  text: And as soon as he finished speaking[a], behold, the king’s sons came, and they raised their voices and wept. The king also, and all his servants, wept with very great weeping.
translation:
  language: ml
  text: അവൻ സംസാരിച്ചു തീർന്ന ഉടനെ, അതാ, രാജാവിന്റെ പുത്രന്മാർ വന്നു. അവർ ശബ്ദമുയർത്തി കരഞ്ഞു. രാജാവും അവന്റെ സകല ദാസന്മാരും അത്യന്തം കരഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ, “വളരെ വലിയൊരു കരച്ചിൽ കരഞ്ഞു”; തീവ്രമായ വിലാപത്തെ ഊന്നിപ്പറയുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: അവൻ സംസാരിച്ചു തീർന്ന ഉടനെ
  rationale: വַיְהִי എന്ന ആഖ്യാനസൂത്രവും കാലസൂചക ഉപവാക്യവും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സംഭവങ്ങളുടെ തൊട്ടടുത്ത ക്രമം ‘ഉടനെ’ വ്യക്തമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും രാജപുത്രന്മാരുടെ വരവ് ദൃശ്യസജീവതയോടെ അവതരിപ്പിക്കുകയും ചെയ്യുന്ന എബ്രായ വ്യവഹാരചിഹ്നത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ പുത്രന്മാർ
  rationale: രാജകുടുംബസന്ദർഭത്തിന് യോജിച്ച, വ്യക്തവും മാന്യവുമായ പരിഭാഷ.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: അവർ ശബ്ദമുയർത്തി
  rationale: ഉച്ചത്തിലുള്ള വിലാപത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: וַיִּבְכּוּ
  choice: കരഞ്ഞു
  rationale: സന്ദർഭത്തിലെ വിലാപവും കണ്ണീരും സ്വാഭാവികമായി അറിയിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: וְכָל עֲבָדָיו
  choice: അവന്റെ സകല ദാസന്മാരും
  rationale: עֲבָדָיו എന്നതിന്റെ വിശാല അർഥം നിലനിർത്തുന്നു; ഉദ്യോഗസ്ഥർ എന്ന പ്രത്യേക പദവി അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: בָּכוּ בְּכִי גָּדוֹל מְאֹד
  choice: അത്യന്തം ദുഃഖത്തോടെ കരഞ്ഞു
  rationale: സമമൂലധാതുപ്രയോഗത്തിലൂടെയുള്ള ശക്തമായ ഊന്നൽ സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ പകരുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതാ’ മൂലപാഠത്തിന്റെ ശ്രദ്ധാകർഷക സ്വഭാവം നിലനിർത്തുന്നു. അവസാനത്തെ എബ്രായ ഊന്നൽ വായനാസൗകര്യത്തിനായി അർഥപരമായി പരിഭാഷപ്പെടുത്തി, അതിന്റെ ഘടന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
