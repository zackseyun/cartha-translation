  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֞וּ נַעֲרֵ֤י אַבְשָׁלוֹם֙ לְ/אַמְנ֔וֹן כַּ/אֲשֶׁ֥ר צִוָּ֖ה אַבְשָׁל֑וֹם וַ/יָּקֻ֣מוּ כָּל בְּנֵ֣י הַ/מֶּ֗לֶךְ וַֽ/יִּרְכְּב֛וּ אִ֥ישׁ עַל פִּרְדּ֖/וֹ וַ/יָּנֻֽסוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
translation:
  language: ml
  text: അങ്ങനെ, അബ്ശാലോമിന്റെ യുവാക്കൾ[b] അബ്ശാലോം കല്പിച്ചതുപോലെ അമ്നോനോടു ചെയ്തു[a]. അപ്പോൾ രാജാവിന്റെ പുത്രന്മാരെല്ലാം എഴുന്നേറ്റ്, ഓരോരുത്തനും തന്റെ കോവർകഴുതപ്പുറത്തു കയറി ഓടിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ, ‘അബ്ശാലോം കല്പിച്ചതുപോലെ അമ്നോനോടു ചെയ്തു.’ മുൻവാക്യത്തിൽ കല്പന വ്യക്തമായി പറഞ്ഞിരിക്കുന്നു: വീഞ്ഞുകൊണ്ട് അമ്നോന്റെ മനസ്സ് ഉല്ലസിച്ചിരിക്കുമ്പോൾ അവനെ അടിച്ചുകൊല്ലുക.'
    reason: cross_reference
  - marker: b
    text: ‘അബ്ശാലോമിന്റെ ഭൃത്യന്മാർ’ അല്ലെങ്കിൽ ‘അബ്ശാലോമിന്റെ പരിചാരകർ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം സേവനത്തിലുള്ള യുവാക്കളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  choice: അബ്ശാലോമിന്റെ യുവാക്കൾ
  rationale: נַעַר എന്ന പദത്തിന് യുവാവ്, ഭൃത്യൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ സന്ദർഭാനുസരണം വരാം. ഇവിടെ അവർ അബ്ശാലോമിന്റെ കല്പന നടപ്പാക്കുന്നവരാണ്; എങ്കിലും അവരുടെ ഔദ്യോഗിക നില അനാവശ്യമായി നിർണയിക്കാതെ മൂലപദത്തിന്റെ രൂപം നിലനിർത്താൻ ‘യുവാക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן
  choice: അമ്നോനോടു ചെയ്തു
  rationale: മുൻവാക്യത്തിൽ അമ്നോനെ അടിച്ചുകൊല്ലാനുള്ള കല്പന വ്യക്തമാക്കിയിട്ടുണ്ട്. ഈ വാക്യത്തിലെ എബ്രായപ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും സന്ദർഭാശ്രിതത്വവും നിലനിർത്താൻ അക്രമത്തിന്റെ വിശദാംശം ഇവിടെ കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: കല്പിച്ചതുപോലെ
  rationale: അബ്ശാലോം മുമ്പു നൽകിയ കല്പനയോട് പ്രവൃത്തി കൃത്യമായി ഒത്തിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וַיָּקֻמוּ
  choice: എഴുന്നേറ്റ്
  rationale: പെട്ടെന്നുണ്ടായ പ്രതികരണത്തെ സൂചിപ്പിക്കുകയും കഥനശൈലിക്ക് യോജിക്കുകയും ചെയ്യുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ പുത്രന്മാരെല്ലാം
  rationale: ദാവീദിന്റെ അവിടെ സന്നിഹിതരായ ആൺമക്കളെ സൂചിപ്പിക്കുന്ന നിർമ്മിതിയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  choice: ഓരോരുത്തനും തന്റെ കോവർകഴുതപ്പുറത്തു കയറി
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തൻ’ എന്നും פֶּרֶד ‘കോവർകഴുത’ എന്നും അർഥമാക്കുന്നു. സവാരിക്കായി മൃഗത്തിന്റെ പുറത്തു കയറുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּנֻסוּ
  choice: ഓടിപ്പോയി
  rationale: נוּס സൂചിപ്പിക്കുന്ന ഭയത്തോടെയുള്ള അടിയന്തര പലായനം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
