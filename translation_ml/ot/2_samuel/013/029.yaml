translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘അമ്നോനോടു ചെയ്തു’ എന്ന മൂലത്തിലെ ഉദ്ദേശപൂർവമായ സംക്ഷിപ്തത നിലനിർത്തി; മുൻസന്ദർഭം കൊലപാതകത്തെ വ്യക്തമാക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ [b] ‘arose’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം נַעֲרֵי אַבְשָׁלוֹם എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ബന്ധപ്പെട്ട ‘യുവാക്കൾ’ എന്ന പദത്തിനുശേഷം ചേർത്തു.
