  text: וַ/יִּשְׁכַּ֥ב אַמְנ֖וֹן וַ/יִּתְחָ֑ל וַ/יָּבֹ֨א הַ/מֶּ֜לֶךְ לִ/רְאֹת֗/וֹ וַ/יֹּ֨אמֶר אַמְנ֤וֹן אֶל הַ/מֶּ֨לֶךְ֙ תָּֽבוֹא נָ֞א תָּמָ֣ר אֲחֹתִ֗/י וּ/תְלַבֵּ֤ב לְ/עֵינַ/י֙ שְׁתֵּ֣י לְבִב֔וֹת וְ/אֶבְרֶ֖ה מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/006.yaml
  text: So Amnon lay down and pretended to be sick. When the king came to see him[a], Amnon said to the king, “Please let Tamar my sister come and make two cakes before my eyes, so that I may eat from her hand.”
translation:
  language: ml
  text: 'അങ്ങനെ അമ്നോൻ കിടന്നിട്ട് രോഗിയാണെന്നു നടിച്ചു. രാജാവ് അവനെ കാണാൻ വന്നപ്പോൾ അമ്നോൻ രാജാവിനോട് പറഞ്ഞു: “ദയവായി എന്റെ സഹോദരി താമാർ വന്ന്, എന്റെ കൺമുന്നിൽവെച്ച് രണ്ട് പലഹാരങ്ങൾ[a] ഉണ്ടാക്കട്ടെ; അങ്ങനെ അവളുടെ കൈയിൽനിന്ന് എനിക്കു ഭക്ഷിക്കാനായി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “രണ്ട് അടകൾ” അഥവാ “രണ്ട് കേക്കുകൾ”; എബ്രായപദം സൂചിപ്പിക്കുന്ന ഭക്ഷണത്തിന്റെ കൃത്യമായ ഇനം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: കിടക്കയിൽ കിടന്ന്
  rationale: വഞ്ചനയുടെ ഭാഗമായി അമ്നോൻ കിടപ്പിലായതിനെ സന്ദർഭാനുസൃതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּתְחָל
  choice: രോഗിയാണെന്നു നടിച്ചു
  rationale: ഹിത്പയേൽ രൂപം ഇവിടെ രോഗം നടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; യഥാർഥത്തിൽ രോഗിയായി എന്ന അർഥം വരാതിരിക്കാൻ ഈ പ്രയോഗം സ്വീകരിച്ചു.
- source_word: לִרְאֹתוֹ
  choice: അവനെ കാണാൻ
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സന്ദർശനമാണെന്നത് സ്വാഭാവികമായി മനസ്സിലാകും.
- source_word: תָּבוֹא נָא
  choice: ദയവായി ... വന്ന് ... ഉണ്ടാക്കട്ടെ
  rationale: נָא നൽകുന്ന വിനീതമായ അഭ്യർഥനാഭാവവും രാജാവിനോടുള്ള അപേക്ഷയും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: תָּמָר אֲחֹתִי
  choice: എന്റെ സഹോദരി താമാർ
  rationale: ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിക്കുന്നു.
- source_word: וּתְלַבֵּב
  choice: ഉണ്ടാക്കട്ടെ
  rationale: അപൂർവമായ ഈ പാചകക്രിയയുടെ കൃത്യസ്വഭാവം അനിശ്ചിതമായതിനാൽ കൂടുതൽ പ്രത്യേകത ചുമത്താത്ത പൊതുവായ ക്രിയ ഉപയോഗിക്കുന്നു.
- source_word: לְעֵינַי
  choice: എന്റെ കൺമുന്നിൽവെച്ച്
  rationale: ‘എന്റെ കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന ദൃശ്യവും വ്യക്തിപരവുമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שְׁתֵּי לְבִבוֹת
  choice: രണ്ട് പലഹാരങ്ങൾ[a]
  rationale: לְבִבוֹת സൂചിപ്പിക്കുന്ന ഭക്ഷണത്തിന്റെ കൃത്യരൂപം അനിശ്ചിതമാണ്. ‘ഹൃദയാകൃതിയിലുള്ളത്’ എന്ന് പാഠം വ്യക്തമാക്കാത്തതിനാൽ അത് പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וְאֶבְרֶה
  choice: എനിക്കു കഴിക്കാമല്ലോ
  rationale: ഭക്ഷിക്കുകയോ ആഹാരം സ്വീകരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയെ ഉദ്ദേശ്യഫലമുള്ള സ്വാഭാവിക മലയാളമായി നൽകുന്നു.
- source_word: מִיָּדָהּ
  choice: അവളുടെ കൈയിൽനിന്ന്
  rationale: വ്യക്തിപരമായി അവൾ തന്നെ നൽകണമെന്ന അഭ്യർഥനയും എബ്രായത്തിലെ ഏകവചനമായ ‘കൈ’യും നിലനിർത്തുന്നു.
