  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. അമ്നോന്റെ കപടത വ്യക്തമായി പ്രകടമാക്കുമ്പോഴും ഭക്ഷണത്തിന്റെ രൂപത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിച്ചിരിക്കുന്നു.
