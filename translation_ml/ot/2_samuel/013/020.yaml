theological_decisions:
- issue: ലൈംഗിക അതിക്രമത്തെ സൂചിപ്പിക്കുന്ന ആഖ്യാനപരമായ പരോക്ഷപ്രയോഗം
  choice: പ്രധാനപാഠത്തിൽ ‘നിന്നോടുകൂടെ ഉണ്ടായിരുന്നോ?’ എന്ന പരോക്ഷഭാഷ നിലനിർത്തി.
  alternative: ‘നിന്റെ സഹോദരനായ അമ്നോൻ നിന്നെ ബലാത്സംഗം ചെയ്തോ?’ അല്ലെങ്കിൽ ‘നിന്നോടുകൂടെ ശയിച്ചോ?’
  rationale: മൂലപാഠം ആഘാതകരമായ സംഭവത്തെ പരോക്ഷമായാണ് പരാമർശിക്കുന്നത്. സന്ദർഭം അർഥം വ്യക്തമാക്കുന്നതിനാൽ, കൂടുതൽ തുറന്ന ഭാഷ ചേർത്ത് വ്യാഖ്യാനം നടത്താതെ മൂലത്തിന്റെ നിയന്ത്രിതമായ ശൈലി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ആഘാതത്തിന്റെ ഗൗരവം മയപ്പെടുത്താതെ, എബ്രായമൂലത്തിലെ പരോക്ഷതയും അസ്വസ്ഥമാക്കുന്ന കുടുംബബന്ധവാദവും സംരക്ഷിച്ചു.
