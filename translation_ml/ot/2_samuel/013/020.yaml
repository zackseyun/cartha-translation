  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
translation:
  language: ml
  text: 'അപ്പോൾ അവളുടെ സഹോദരനായ അബ്ശാലോം അവളോടു പറഞ്ഞു[a]: “നിന്റെ സഹോദരനായ അമ്നോൻ നിന്നോടുകൂടെ ഉണ്ടായിരുന്നോ? ഇപ്പോൾ, എന്റെ സഹോദരീ, മിണ്ടാതിരിക്കുക; അവൻ നിന്റെ സഹോദരനാണ്. ഈ കാര്യം നിന്റെ മനസ്സിൽ വെക്കരുത്.” അങ്ങനെ താമാർ തകർന്നവളായി[b] തന്റെ സഹോദരനായ അബ്ശാലോമിന്റെ വീട്ടിൽ കഴിഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്റെ സഹോദരനായ അമ്നോൻ നിന്നോടുകൂടെ ഉണ്ടായിരുന്നോ?” എന്ന എബ്രായപ്രയോഗം ലൈംഗിക അതിക്രമത്തെ പരോക്ഷമായി സൂചിപ്പിക്കുന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വിജനയായവളായി” അല്ലെങ്കിൽ “നശിച്ചവളായി.” എബ്രായപദം തകർച്ച, നാശം, ഞെട്ടലോടുകൂടിയ ശൂന്യത എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
