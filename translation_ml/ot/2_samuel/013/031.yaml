translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ക്രിയാക്രമവും ദുഃഖാചാരത്തിന്റെ ദൃശ്യഭാവവും നിലനിർത്തി; രാജസദസ്സിലെ ആളുകളുടെ കൃത്യമായ ഔദ്യോഗിക പദവി അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല.
