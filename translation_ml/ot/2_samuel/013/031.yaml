id: 2SA.13.31
reference: 2 Samuel 13:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֧קָם הַ/מֶּ֛לֶךְ וַ/יִּקְרַ֥ע אֶת בְּגָדָ֖י/ו וַ/יִּשְׁכַּ֣ב אָ֑רְצָ/ה וְ/כָל עֲבָדָ֥י/ו נִצָּבִ֖ים קְרֻעֵ֥י בְגָדִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/031.yaml
  text: Then the king arose[a], tore his garments, and lay on the ground, and all his servants were standing with their garments torn.
translation:
  language: ml
  text: അപ്പോൾ രാജാവ് എഴുന്നേറ്റ് തന്റെ വസ്ത്രങ്ങൾ കീറി[a] നിലത്തു കിടന്നു. അവന്റെ സകല ദാസന്മാരും വസ്ത്രങ്ങൾ കീറിയവരായി നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വസ്ത്രങ്ങൾ കീറുന്നത് ദുഃഖം, ഭീതി, അല്ലെങ്കിൽ വിലാപം പ്രകടിപ്പിക്കുന്നതിനുള്ള എബ്രായരുടെ പതിവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം രാജാവിന്റെ പെട്ടെന്നുള്ള പ്രതികരണത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ അറിയപ്പെടുന്ന ദാവീദിനെ വ്യക്തിനാമത്തിനു പകരം മൂലപാഠത്തിലെ പദവിനാമംകൊണ്ടുതന്നെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ കീറി
  rationale: ദുഃഖമോ ഞെട്ടലോ പ്രകടിപ്പിക്കുന്ന എബ്രായ ആചാരപരമായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ‘വസ്ത്രങ്ങൾ’ dignified modern Malayalam ആണ്.
- source_word: וַיִּשְׁכַּב אַרְצָה
  choice: നിലത്തു കിടന്നു
  rationale: שכבയും ദിശാസൂചകമായ אַרְצָהയും ചേർന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ദുഃഖത്തിൽ നിലത്തേക്കു വീണുകിടക്കുന്ന ഭാവം അനാവശ്യ വിശദീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: וְכָל־עֲבָדָיו
  choice: അവന്റെ സകല ദാസന്മാരും
  rationale: עבדים എന്നത് രാജസേവകരെയോ പരിചാരകരെയോ ഉൾക്കൊള്ളാം; ‘ദാസന്മാർ’ നേരിട്ടുള്ളതും പദവിയെ അതിയായി നിർണ്ണയിക്കാത്തതുമായ പരിഭാഷയാണ്.
- source_word: נִצָּבִים
  choice: നിന്നു
  rationale: നിഫാൽ കൃതന്തത്തിന്റെ നിലനിൽക്കുന്ന ഭാവം മലയാളത്തിലെ സന്ദർഭസഹജമായ ഭൂതകാലക്രിയയിലൂടെ വ്യക്തമാകുന്നു.
- source_word: קְרֻעֵי בְגָדִים
  choice: വസ്ത്രങ്ങൾ കീറിയവരായി
  rationale: കീറപ്പെട്ട വസ്ത്രങ്ങളോടുകൂടിയ അവരുടെ അവസ്ഥയെ ഫലാവസ്ഥയായി വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
