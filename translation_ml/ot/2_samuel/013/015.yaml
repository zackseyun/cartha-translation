translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ശക്തമായ ആവർത്തനം പൂർണമായി മിനുക്കിക്കളയാതെ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടനയിൽ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ഹ്രസ്വ ആജ്ഞയ്ക്കു പിന്നാലെ വെച്ചു.
