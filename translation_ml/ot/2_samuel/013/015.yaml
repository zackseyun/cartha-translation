  source_fidelity: 'കരട് മൂലവാക്യത്തിന്റെ പ്രധാന അർഥം കൃത്യമായി നൽകുന്നു: അമ്നോന്റെ അത്യന്തം വലിയ വെറുപ്പ്, മുമ്പുണ്ടായിരുന്ന സ്നേഹത്തെ അതിക്രമിച്ചതും, താമാറോടുള്ള രണ്ടു ഹ്രസ്വ സ്ത്രീലിംഗ ആജ്ഞകളും സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു. എങ്കിലും כִּי-യുടെ വ്യക്തമായ കാരണബന്ധം വിവർത്തനത്തിൽ പ്രകടമാക്കുന്നതു നല്ലതാണ്.'
  naturalness: ‘അവൻ അവളെ സ്നേഹിച്ചിരുന്ന സ്നേഹത്തെക്കാൾ അവളെ വെറുത്ത വെറുപ്പ്’ എന്ന പ്രയോഗം മൂലത്തിലെ ആവർത്തനം പ്രതിഫലിപ്പിക്കുന്നുവെങ്കിലും ആധുനിക നിലവാരമലയാളത്തിൽ ഭാരമുള്ളതും അസ്വാഭാവികവുമാണ്. ‘അവളോടുള്ള അവന്റെ വെറുപ്പ്’ / ‘അവളോട് ഉണ്ടായിരുന്ന സ്നേഹം’ എന്ന ഘടന കൂടുതൽ സ്വാഭാവികമാണ്.
  terminology: ‘അമ്നോൻ,’ ‘വെറുപ്പ്,’ ‘സ്നേഹം,’ ‘എഴുന്നേൽക്കൂ, പോകൂ’ എന്നിവ യോജിച്ചതാണ്. ‘അതികഠിനമായ വെറുപ്പ്’ എന്നതിനെക്കാൾ ‘വളരെ വലിയ വെറുപ്പ്’ എബ്രായത്തിലെ גְּדוֹלָה מְאֹד-ന്റെ അളവുതീവ്രതയെ കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
  issues:
