    issue: കാരണസൂചകമായ כִּי വിവർത്തനത്തിൽ ഒഴിവാക്കിയിരിക്കുന്നു.
    rationale: രണ്ടാം വാക്യം വിശദീകരണമായി മനസ്സിലാക്കാനാകുമെങ്കിലും, മൂലപാഠം വെറുപ്പിന്റെ തീവ്രതയ്ക്കുള്ള കാരണം/വിശദീകരണം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു. ‘കാരണം’ ചേർക്കുന്നത് ഇതു സംരക്ഷിക്കും.
