  yaml_path: translation/ot/2_samuel/013/015.yaml
  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
translation:
  language: ml
  text: പിന്നെ അമ്നോൻ അവളെ വളരെ വലിയ വെറുപ്പോടെ വെറുത്തു. കാരണം, അവളോടുള്ള അവന്റെ വെറുപ്പ് അവൻ അവളോട് ഉണ്ടായിരുന്ന സ്നേഹത്തെക്കാൾ വലുതായിരുന്നു. അമ്നോൻ അവളോട്, “എഴുന്നേൽക്കൂ, പോകൂ”[a] എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ രണ്ടു ഹ്രസ്വ ആജ്ഞകൾ മാത്രമാണ്: ‘എഴുന്നേൽക്കൂ, പോകൂ.’ അമ്നോന്റെ പരുഷമായ പുറത്താക്കൽ അവയുടെ പൊടുന്നനെയുള്ള ചുരുക്കത്തിൽ പ്രകടമാണ്; ‘ഇവിടെനിന്ന് പോകൂ’ എന്നത് അർഥം വ്യക്തമാക്കുന്ന മറ്റൊരു വിവർത്തനസാധ്യതയാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ
  choice: പിന്നെ അമ്നോൻ അവളെ ... വെറുത്തു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടു നീക്കുന്നതിനാൽ ‘പിന്നെ’ എന്നു നൽകി; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം താമാറിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവളെ’ എന്നു വ്യക്തമാക്കി.
- source_word: שִׂנְאָה גְּדוֹלָה מְאֹד
  choice: അതികഠിനമായ വെറുപ്പോടെ
  rationale: ക്രിയയുടെ തീവ്രത ഊന്നിപ്പറയുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ അതിന്റെ ശക്തിയും ആവർത്തനഭാവവും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: വാക്യക്രമത്തിലൂടെ കാരണവിശദീകരണം
  rationale: ഈ പദം മുൻപ്രസ്താവനയുടെ കാരണം വിശദീകരിക്കുന്നു. മലയാളത്തിൽ വേറൊരു ബന്ധപദം ചേർക്കാതെയും രണ്ടാമത്തെ വാക്യം സ്വാഭാവികമായി ആ വിശദീകരണമായി വായിക്കപ്പെടുന്നു.
- source_word: גְדוֹלָה הַשִּׂנְאָה ... מֵאַהֲבָה
  choice: സ്നേഹിച്ചിരുന്ന സ്നേഹത്തെക്കാൾ ... വെറുത്ത വെറുപ്പ് വലുതായിരുന്നു
  rationale: מִן സൂചിപ്പിക്കുന്ന താരതമ്യം ‘-യെക്കാൾ’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കി; മൂലത്തിലെ ‘സ്നേഹം/സ്നേഹിച്ചു’, ‘വെറുപ്പ്/വെറുത്തു’ എന്നീ ഉദ്ദേശ്യപൂർവമായ ആവർത്തനങ്ങൾ സംരക്ഷിച്ചു.
- source_word: אֲשֶׁר אֲהֵבָהּ
  choice: അവൻ അവളെ സ്നേഹിച്ചിരുന്ന
  rationale: പുതിയ വെറുപ്പിനു മുമ്പുണ്ടായിരുന്ന സ്നേഹത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മുൻകാലബന്ധം ‘സ്നേഹിച്ചിരുന്ന’ എന്ന രൂപത്തിൽ പ്രകടമാക്കി.
- source_word: קוּמִי לֵכִי
  choice: എഴുന്നേൽക്കൂ, പോകൂ
  rationale: സ്ത്രീലിംഗ ഏകവചനത്തിലുള്ള രണ്ടു ഹ്രസ്വ ആജ്ഞകളും വികസിപ്പിക്കാതെ നേരിട്ടും പരുഷമായും നിലനിർത്തി.
