source:
  edition: WLC
  text: יִגְמְלֵ֥/נִי יְהוָ֖ה כְּ/צִדְקָתִ֑/י כְּ/בֹ֥ר יָדַ֖/י יָשִׁ֥יב לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/021.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: ml
  text: 'എന്റെ നീതിക്കനുസരിച്ച് യഹോവ എനിക്കു പ്രതിഫലം നൽകുന്നു[a];

    എന്റെ കൈകളുടെ നിർമ്മലതയ്ക്കനുസരിച്ച്[b] അവൻ എനിക്കു പ്രതിഫലം നൽകുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്നോടു പെരുമാറുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയയ്ക്ക് ഒരാളുടെ നടത്തത്തിനനുസരിച്ച് അയാളോടു പെരുമാറുക അഥവാ പ്രതിഫലം നൽകുക എന്നർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘കൈകളുടെ നിർമ്മലത’ എന്നത് ഒരാളുടെ പ്രവൃത്തികളിലെ നിഷ്കളങ്കതയെയോ ശുദ്ധിയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: എന്നോടു പെരുമാറിയിരിക്കുന്നു
  rationale: גמל എന്ന ക്രിയ ഒരാളുടെ പ്രവൃത്തിക്കനുസരിച്ച് അയാളോടു പെരുമാറുക, പ്രതിഫലം നൽകുക എന്ന വിശാലമായ അർഥം വഹിക്കുന്നു. സമാന്തരവാക്യം അനുകൂലമായ പ്രതിഫലത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ തിരഞ്ഞെടുപ്പ് മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: כְּצִדְקָתִי
  choice: എന്റെ നീതിക്കൊത്തവണ്ണം
  rationale: צדקה ഇവിടെ സന്ദർഭത്തിലെ നേരായ നടത്തത്തെയോ നീതിയെയോ സൂചിപ്പിക്കുന്നു; כְּ എന്ന ഉപസർഗത്തിന്റെ മാനദണ്ഡാർഥം ‘ഒത്തവണ്ണം’ വ്യക്തമാക്കുന്നു.
- source_word: כְּבֹר יָדַי
  choice: എന്റെ കൈകളുടെ നിർമ്മലതയ്ക്കൊത്തവണ്ണം
  rationale: בֹּר എന്നതിന്റെ നിർമ്മലത/ശുദ്ധി എന്ന ദൃശ്യരൂപവും ‘കൈകൾ’ എന്ന എബ്രായ രൂപകവും വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: יָשִׁיב לִי
  choice: അവൻ എനിക്കു പ്രതിഫലം നൽകിയിരിക്കുന്നു
  rationale: שוב-ന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളുടെ നടത്തത്തിന് അനുസരിച്ച് തിരികെ നൽകുക അഥവാ പ്രതിഫലം നൽകുക എന്നാണ്. സ്വാഭാവികമായ മലയാളത്തിൽ പ്രതിഫലനത്തിന്റെ ആശയം ഇതു വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: വാക്യം പാപരഹിതമായ പൂർണതയെയോ ദൈവസന്നിധിയിലെ സമ്പൂർണ അർഹതയെയോ സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കണമോ എന്നത്
  choice: ദാവീദിന്റെ നീതിക്കും പ്രവൃത്തികളിലെ നിർമ്മലതയ്ക്കും അനുസരിച്ച് യഹോവ അവനോടു പെരുമാറിയെന്ന അവകാശവാദം മൂലപാഠത്തിലുള്ളതുപോലെ നേരിട്ട് നിലനിർത്തുന്നു.
  alternative: ‘എന്റെ നീതി’ എന്ന ഭാഷ മയപ്പെടുത്തുക, അല്ലെങ്കിൽ അതിനെ സമ്പൂർണ പാപരാഹിത്യത്തിന്റെയോ രക്ഷ നേടുന്ന അർഹതയുടെയോ പ്രസ്താവനയായി വികസിപ്പിക്കുക.
  rationale: എബ്രായപാഠം ഒന്നാംപുരുഷത്തിൽ ‘എന്റെ നീതി’, ‘എന്റെ കൈകളുടെ നിർമ്മലത’ എന്നു വ്യക്തമായി പറയുന്നു. പരിഭാഷ ആ ഭാഷ നിലനിർത്തുന്നു; എന്നാൽ വാക്യത്തിൽ ഇല്ലാത്ത സമ്പൂർണ പാപരാഹിത്യത്തെയോ അർഹതയാൽ ലഭിക്കുന്ന രക്ഷയെയോ അതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ കാവ്യഗൗരവം നിലനിർത്തി രണ്ടു സമാന്തര വരികളായി നൽകിയിരിക്കുന്നു. ‘നീതി’, ‘കൈകളുടെ നിർമ്മലത’ എന്നീ മൂലപാഠരൂപങ്ങൾ വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഭാഷയാണ് ഉപയോഗിച്ചത്.
