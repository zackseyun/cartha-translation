source:
  edition: WLC
  text: יִשְׁלַ֥ח מִ/מָּר֖וֹם יִקָּחֵ֑/נִי יַֽמְשֵׁ֖/נִי מִ/מַּ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/017.yaml
  text: He sent from on high[a]; he took me[b]; he drew me out of many waters.
translation:
  language: ml
  text: അവൻ ഉയരത്തിൽനിന്ന് കൈനീട്ടി[a]; എന്നെ എടുത്തു; അനവധി വെള്ളങ്ങളിൽനിന്ന്[b] എന്നെ വലിച്ചെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവൻ ഉയരത്തിൽനിന്ന് അയച്ചു’ അല്ലെങ്കിൽ ‘ഉയരത്തിൽനിന്ന് (കൈ) നീട്ടി.’ എബ്രായക്രിയയ്ക്ക് ‘അയയ്ക്കുക’ എന്നും ‘നീട്ടുക’ എന്നും അർഥമാകാം. മുഖ്യവാക്യത്തിലെ ‘കൈ’ എബ്രായത്തിൽ വ്യക്തമല്ല; രക്ഷയുടെ സന്ദർഭത്തിൽ സൂചിതമായ ഘടകമായി അത് ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പെരുവെള്ളങ്ങളിൽനിന്ന്’ അല്ലെങ്കിൽ ‘ശക്തമായ വെള്ളങ്ങളിൽനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: കൈനീട്ടി
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘അയയ്ക്കുക/നീട്ടുക’ എന്നതാണ്. ഇവിടെ കർമം വ്യക്തമാക്കാതെ നിൽക്കുന്ന രക്ഷാസന്ദർഭത്തിൽ, മുകളിൽനിന്നുള്ള ഇടപെടൽ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ‘കൈനീട്ടി’ ഉപയോഗിച്ചു; ‘കൈ’ എബ്രായത്തിൽ പ്രകടമായി ഇല്ലാത്തതിനാൽ പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מִמָּרוֹם
  choice: ഉയരത്തിൽനിന്ന്
  rationale: ‘ഉയർന്ന സ്ഥലം/ഉയരം’ എന്ന കാവ്യാത്മക അർഥം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘സ്വർഗം’ എന്ന് വ്യക്തമായി നിർവചിക്കുന്നില്ല.
- source_word: יִקָּחֵנִי
  choice: എന്നെ പിടിച്ചെടുത്തു
  rationale: לקח എന്നതിന്റെ സാധാരണ അർഥമായ ‘എടുക്കുക’ രക്ഷയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പിടിച്ചെടുത്തു’ എന്നത് തുടർന്നുള്ള വെള്ളത്തിൽനിന്നുള്ള രക്ഷാചിത്രവുമായി ചേരുന്നു.
- source_word: יַמְשֵׁנִי
  choice: എന്നെ വലിച്ചെടുത്തു
  rationale: הפעיל രൂപത്തിലുള്ള משה വെള്ളത്തിൽനിന്ന് പുറത്തെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വലിച്ചെടുത്തു’ ഈ പ്രവർത്തനം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: מִמַּיִם רַבִּים
  choice: അനവധി വെള്ളങ്ങളിൽനിന്ന്
  rationale: ‘പല/അനവധി വെള്ളങ്ങൾ’ എന്ന എബ്രായ ദൃശ്യരൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു. ‘പെരുവെള്ളം’ അഥവാ ‘ശക്തമായ വെള്ളങ്ങൾ’ എന്നും സന്ദർഭാനുസൃതമായി മനസ്സിലാക്കാം.
theological_decisions:
- issue: മുകളിൽനിന്നുള്ള ദൈവിക രക്ഷയുടെ ദൃശ്യരൂപം
  choice: ‘ഉയരത്തിൽനിന്ന്’ എന്ന കാവ്യാത്മക സ്ഥലഭാഷ നിലനിർത്തി.
  alternative: ‘സ്വർഗത്തിൽനിന്ന്’
  rationale: ദൈവിക ഇടപെടലാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; എങ്കിലും മָרוֹם എന്ന പദത്തെ മൂലപാഠത്തേക്കാൾ നിർദിഷ്ടമായി ‘സ്വർഗം’ എന്നു പരിഭാഷപ്പെടുത്താതിരുന്നത് അർഥവ്യാപ്തിയും കാവ്യാത്മകതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ കാവ്യാത്മക ഗൗരവം നിലനിർത്തി. ആവർത്തിച്ചുള്ള ‘എന്നെ’ മൂലപാഠത്തിലെ വ്യക്തിപരമായ രക്ഷാഭാവവും സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു.
