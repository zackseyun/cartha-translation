reference: 2 Samuel 22:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֥ט שָׁמַ֖יִם וַ/יֵּרַ֑ד וַ/עֲרָפֶ֖ל תַּ֥חַת רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/010.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: ml
  text: അവൻ ആകാശങ്ങളെ കുനിച്ചു താഴേക്കിറങ്ങി; കൂരിരുട്ട് അവന്റെ പാദങ്ങൾക്കു കീഴിലുണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൂരിരുട്ട്’ എന്നതിന് ‘ഇരുണ്ട മേഘം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദമായ עֲרָפֶל ദൈവിക പ്രത്യക്ഷതയോടു ബന്ധപ്പെട്ട സാന്ദ്രമായ അന്ധകാരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: കുനിച്ചു
  rationale: נטה എന്ന ക്രിയ ഇവിടെ ആകാശങ്ങളെ താഴേക്ക് വളയ്ക്കുകയോ കുനിക്കുകയോ ചെയ്യുന്ന സജീവമായ കാവ്യചിത്രം നൽകുന്നു; ‘കുനിച്ചു’ അത് സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁמַיִם
  choice: ആകാശങ്ങളെ
  rationale: എബ്രായ ബഹുവചനത്തിന്റെ വിശാലവും പ്രപഞ്ചാത്മകവുമായ ഭാവം നിലനിർത്താൻ ബഹുവചനരൂപം സ്വീകരിച്ചു.
- source_word: וַיֵּרַד
  choice: താഴേക്കിറങ്ങി
  rationale: ירד എന്നതിന്റെ ദിശാപരമായ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַעֲרָפֶל
  choice: കൂരിരുട്ട്
  rationale: עֲרָפֶל സൂചിപ്പിക്കുന്ന സാന്ദ്രമായ അന്ധകാരവും ദൈവപ്രത്യക്ഷത്തിന്റെ ഗൗരവഭാവവും ‘കൂരിരുട്ട്’ സംക്ഷിപ്തമായി പകർന്നു നൽകുന്നു; ‘ഇരുണ്ട മേഘം’ എന്നും ഗ്രഹിക്കാം.
- source_word: תַּחַת
  choice: കാൽക്കീഴിൽ
  rationale: സ്ഥലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന രൂപം.
- source_word: רַגְלָיו
  choice: അവന്റെ കാൽ
  rationale: മൂലത്തിലെ ശരീരാവയവചിത്രം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ നേരിട്ട് നിലനിർത്തുന്നു; ‘കാൽക്കീഴിൽ’ എന്ന മലയാളപ്രയോഗത്തിൽ ഏകവചനം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ദൈവത്തെക്കുറിച്ചുള്ള മനുഷ്യരൂപപരവും സ്ഥലപരവുമായ ദൈവപ്രത്യക്ഷചിത്രണം
  choice: ‘താഴേക്കിറങ്ങി’, ‘അവന്റെ കാൽക്കീഴിൽ’ എന്നീ ചിത്രങ്ങൾ നേരിട്ട് നിലനിർത്തി.
  alternative: ‘സ്വർഗത്തിൽനിന്ന് പ്രത്യക്ഷനായി’ എന്നതുപോലെ ശരീരരഹിതമായി വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായ കാവ്യം ദൈവത്തിന്റെ അതീതതയെ മനുഷ്യരൂപപരമായ ദൃശ്യഭാഷയിലൂടെ അവതരിപ്പിക്കുന്നു. ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ പരിഭാഷയിൽ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ പ്രപഞ്ചാത്മക കാവ്യചിത്രവും ദൈവപ്രത്യക്ഷത്തിന്റെ സാന്ദ്രതയും സംരക്ഷിച്ചു.
