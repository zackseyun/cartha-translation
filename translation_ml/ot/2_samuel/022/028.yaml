source:
  edition: WLC
  text: וְ/אֶת עַ֥ם עָנִ֖י תּוֹשִׁ֑יעַ וְ/עֵינֶ֖י/ךָ עַל רָמִ֥ים תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/028.yaml
  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
translation:
  language: ml
  text: കഷ്ടമനുഭവിക്കുന്ന ജനത്തെ[a] നീ രക്ഷിക്കുന്നു; അഹങ്കാരികളുടെമേൽ നിന്റെ കണ്ണുകളുണ്ട്; നീ അവരെ താഴ്ത്തുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദരിദ്രരായ ജനത്തെ.’ എബ്രായ വിശേഷണം ദരിദ്രർ, കഷ്ടമനുഭവിക്കുന്നവർ, അല്ലെങ്കിൽ പീഡിതർ എന്ന അർഥങ്ങൾ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഗർവിഷ്ഠരെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: ജനം
  rationale: ഏകവചനത്തിലുള്ള സമൂഹവാചിയായ പദം ഒരു ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ജനം’ സ്വാഭാവികവും കാവ്യസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: עָנִי
  choice: കഷ്ടമനുഭവിക്കുന്ന
  rationale: ഈ വിശേഷണം ദരിദ്രർ, പീഡിതർ, ദുരിതമനുഭവിക്കുന്നവർ, താഴ്ത്തപ്പെട്ടവർ എന്നീ അർഥവ്യാപ്തി ഉൾക്കൊള്ളുന്നു. സാമ്പത്തിക ദാരിദ്ര്യത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കാതെ അനുഭവപരവും സാമൂഹികവുമായ താഴ്മ നിലനിർത്തുന്നു.
- source_word: תּוֹשִׁיעַ
  choice: നീ രക്ഷിക്കുന്നു
  rationale: ישׁע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം രക്ഷിക്കുക, വിടുവിക്കുക എന്ന വിശാലമായ അർഥം വഹിക്കുന്നു; ‘രക്ഷിക്കുന്നു’ അത് സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: עֵינֶיךָ
  choice: നിന്റെ കണ്ണുകൾ
  rationale: എബ്രായത്തിലെ ദൃശ്യവും സാക്ഷാൽക്കൃതവുമായ പ്രയോഗം മലയാളത്തിലും വ്യക്തമായതിനാൽ അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: רָמִים
  choice: അഹങ്കാരികൾ
  rationale: רום എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം സന്ദർഭത്തിൽ സ്വയം ഉയർത്തുന്നവരെയോ ഗർവിഷ്ഠരെയോ സൂചിപ്പിക്കുന്നു. കഷ്ടമനുഭവിക്കുന്ന ജനത്തോടുള്ള നൈതിക വൈരുധ്യം ‘അഹങ്കാരികൾ’ വ്യക്തമാക്കുന്നു.
- source_word: תַּשְׁפִּיל
  choice: താഴ്ത്താൻ
  rationale: שׁפל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം താഴെയാക്കുക, താഴ്ത്തുക, വിനയപ്പെടുത്തുക എന്നതാണ്. ‘നിന്റെ കണ്ണുകൾ ... അവരുടെമേൽ’ എന്ന മുൻപ്രയോഗവുമായി ചേർത്ത് ലക്ഷ്യസൂചകമായി നൽകുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וְאֶת
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: אֵת ഇവിടെ നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്നു; മലയാളവാക്യഘടനയിൽ അതിന് വേറെ പദം ആവശ്യമില്ല.
- source_word: וְ
  choice: എന്നാൽ
  rationale: രൂപപരമായി ‘ഉം/കൂടാതെ’ എന്നാണെങ്കിലും, പീഡിതരെ രക്ഷിക്കുന്നതും അഹങ്കാരികളെ താഴ്ത്തുന്നതും തമ്മിലുള്ള കാവ്യാത്മക വൈരുധ്യം മലയാളത്തിൽ ‘എന്നാൽ’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: സാമൂഹിക-സാമ്പത്തിക വൈരുധ്യമോ നൈതിക വൈരുധ്യമോ
  choice: കഷ്ടമനുഭവിക്കുന്നവരെ ദൈവം രക്ഷിക്കുകയും അഹങ്കാരികളെ താഴ്ത്തുകയും ചെയ്യുന്നു എന്ന വൈരുധ്യം
  alternative: സാമ്പത്തികമായി ദരിദ്രരെയും സാമൂഹികമായി ഉന്നതരായവരെയും മാത്രം തമ്മിൽ വൈരുധ്യപ്പെടുത്തുന്നു
  rationale: עָנִי എന്ന പദത്തിന് ദാരിദ്ര്യവും പീഡനവും താഴ്മയും സൂചിപ്പിക്കാനാകുന്നു; רָמִים സന്ദർഭത്തിൽ അഹങ്കാരത്തിന്റെ നൈതികഭാവം വഹിക്കുന്നു. മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർന്ന് സാമൂഹിക അർഥസാധ്യത ഒഴിവാക്കാതെ നൈതിക വൈരുധ്യവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ. ‘നിന്റെ കണ്ണുകൾ അവരുടെമേൽ ഇരിക്കുന്നു’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം അല്പം സാക്ഷാൽക്കൃതമായി സംരക്ഷിച്ചിരിക്കുന്നു; ‘താഴ്ത്താൻ’ ചേർത്ത് അതിന്റെ ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
