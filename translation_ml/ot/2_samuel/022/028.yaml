revisions:
- from: കഷ്ടമനുഭവിക്കുന്ന ജനത്തെ[a] നീ രക്ഷിക്കുന്നു; എന്നാൽ അഹങ്കാരികളെ[b] താഴ്ത്താൻ നിന്റെ കണ്ണുകൾ അവരുടെമേൽ ഇരിക്കുന്നു.
  to: കഷ്ടമനുഭവിക്കുന്ന ജനത്തെ[a] നീ രക്ഷിക്കുന്നു; അഹങ്കാരികളുടെമേൽ നിന്റെ കണ്ണുകളുണ്ട്; നീ അവരെ താഴ്ത്തുന്നു[b].
  rationale: 'The revision preserves the Hebrew sequence and force: God saves the afflicted people; his eyes are upon the haughty; he brings them low. It replaces an awkward literalized Malayalam idiom with natural modern Malayalam, restores the finite force of the final verb, and keeps the lexical alternatives appropriately limited to the relevant ambiguous terms.'
