source:
  edition: WLC
  text: כִּ֥י בְ/כָ֖ה אָר֣וּץ גְּד֑וּד בֵּ/אלֹהַ֖/י אֲדַלֶּג שֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/030.yaml
  text: For by you I can run against a troop[c][b][a]; by my God I can leap over a wall.
translation:
  language: ml
  text: 'എന്തെന്നാൽ, അങ്ങയാൽ[a] ഒരു പടയ്‌ക്കെതിരെ[b] ഓടിച്ചെല്ലാൻ എനിക്കു കഴിയും;

    എന്റെ ദൈവത്താൽ ഒരു മതിൽ ചാടിക്കടക്കാൻ എനിക്കു കഴിയും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അങ്ങയോടൊപ്പം’ അല്ലെങ്കിൽ ‘അങ്ങയിലൂടെ’. ഹീബ്രു ഉപസർഗത്തിന് കൂട്ടായ്മയെയോ മാർഗത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ ദൈവം പ്രവർത്തനത്തിന് പ്രാപ്തനാക്കുന്നു എന്ന അർഥത്തിലാണ് ‘അങ്ങയാൽ’ എന്ന് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഒരു കൊള്ളസംഘത്തിനെതിരെ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: അങ്ങയാൽ
  rationale: ഈ വാക്യം മുൻപുള്ള സ്തുതിയുടെ അടിസ്ഥാനമോ വിശദീകരണമോ നൽകുന്നു. എന്നാൽ മലയാളത്തിൽ ‘എന്തെന്നാൽ’ ചേർത്താൽ കവിതാഭാവം ഭാരപ്പെടുന്നതിനാൽ, കാരണബന്ധം സന്ദർഭത്തിൽ നിലനിൽക്കുമെന്ന നിലയിൽ വ്യക്തമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: בְכָה
  choice: അങ്ങയാൽ
  rationale: בְּ എന്ന ഉപസർഗം ഇവിടെ മാർഗമോ പ്രാപ്തിയേകുന്ന കാരണമോ സൂചിപ്പിക്കുന്നു. ദൈവം പ്രവർത്തനത്തിന് പ്രാപ്തനാക്കുന്നു എന്ന അർഥം ചുരുക്കമായി നൽകുന്നു; ‘അങ്ങയോടൊപ്പം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אָרוּץ
  choice: ഓടിച്ചെല്ലും
  rationale: רוץ എന്ന ക്രിയയുടെ ഖാൽ അപൂർണരൂപം കവിതയിൽ ദൈവം നൽകുന്ന കഴിവോ അനുഭവസിദ്ധമായ പ്രവർത്തനമോ പ്രകടിപ്പിക്കുന്നു. ‘ഓടിച്ചെല്ലും’ സൈനിക മുന്നേറ്റത്തിന്റെ ചലനാത്മകത നിലനിർത്തുന്നു.
- source_word: גְּדוּד
  choice: ഒരു സൈന്യനിരയെ
  rationale: גדוד സൈന്യസംഘത്തെയോ ആക്രമണസംഘത്തെയോ സൂചിപ്പിക്കാം. ‘സൈന്യനിര’ ഇവിടെ യുദ്ധചിത്രം സ്വാഭാവികമായി നൽകുന്നു; ‘കൊള്ളസംഘം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בֵּאלֹהַי
  choice: എന്റെ ദൈവത്താൽ
  rationale: ആദ്യ വരിയിലെ മാർഗസൂചകമായ ഉപസർഗം ആവർത്തിച്ച് കവിതാസമാന്തര്യം പാലിക്കുന്നു; ‘എന്റെ ദൈവം’ എന്ന വ്യക്തിപരമായ ബന്ധഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: אֲדַלֶּג
  choice: ചാടിക്കടക്കും
  rationale: דלג എന്ന പിയേൽ ക്രിയ ചാടുക, കുതിച്ചുകടക്കുക എന്നർഥം നൽകുന്നു. മതിൽ മറികടക്കുന്നതിന് സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗമാണിത്.
- source_word: שׁוּר
  choice: ഒരു മതിൽ
  rationale: שׁוּר കോട്ടമതിലിനെയോ പ്രതിരോധമതിലിനെയോ സൂചിപ്പിക്കുന്നു. ‘മതിൽ’ ഏറ്റവും നേരിട്ടും വായനാസൗകര്യമുള്ളതുമായ പരിഭാഷയാണ്.
theological_decisions:
- issue: യുദ്ധചിത്രത്തിലെ ദൈവിക പ്രാപ്തീകരണം
  choice: ‘അങ്ങയാൽ... ഓടിച്ചെല്ലും; എന്റെ ദൈവത്താൽ... ചാടിക്കടക്കും’ എന്ന് നൽകി, വിജയം ദൈവത്താൽ സാധ്യമാകുന്നു എന്ന ആശയം പ്രകടമാക്കി.
  alternative: കഴിവിന്റെ ഭാവം വ്യക്തമാക്കാതെ ‘ഞാൻ ഓടുന്നു... ഞാൻ ചാടുന്നു’ എന്ന ലളിത പ്രവർത്തനവിവരണം.
  rationale: ഹീബ്രു അപൂർണക്രിയാരൂപങ്ങൾ ഈ കവിതാസന്ദർഭത്തിൽ ദൈവം നൽകുന്ന കഴിവിനെയോ ആവർത്തിച്ച അനുഭവത്തെയോ സൂചിപ്പിക്കാം. ‘കഴിയും’ എന്ന് രണ്ടുതവണ ചേർക്കാതെ ഭാവികാലസദൃശമായ മലയാളക്രിയകൾ ഉപയോഗിക്കുന്നത് അർഥവും കവിതയുടെ ഊർജവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ കവിതാഭാഷ. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു. സൈനികചിത്രം വ്യക്തമായി നിലനിർത്തിയെങ്കിലും അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി. ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് c-യിലെ ‘rampart’ സാധ്യത שׁוּר എന്ന പദത്തിന്റേതാണ്; എന്നാൽ അതിന്റെ marker ഇംഗ്ലീഷ് മുഖ്യവാചകത്തിൽ ‘troop’ എന്നതോടു ചേർന്നതായി തോന്നുന്നു. മലയാളത്തിൽ ‘മതിൽ’ നേരിട്ടുള്ളതും മതിയായതുമായതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
