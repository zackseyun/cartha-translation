source:
  edition: WLC
  text: הָ/אֵ֕ל הַ/נֹּתֵ֥ן נְקָמֹ֖ת לִ֑/י וּ/מוֹרִ֥יד עַמִּ֖ים תַּחְתֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/048.yaml
  text: the God who gives vengeance to me and brings peoples down under me.
translation:
  language: ml
  text: എനിക്കു പ്രതികാരം നൽകുകയും ജനതകളെ എന്റെ കീഴിൽ താഴ്ത്തുകയും ചെയ്യുന്ന ദൈവം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: ദൈവം
  rationale: നിശ്ചയാർഥകതയും വിശേഷണവാക്യവുമായുള്ള ബന്ധവും മലയാളത്തിലെ സ്വാഭാവിക ഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: הַנֹּתֵן נְקָמֹת לִי
  choice: എനിക്കു പ്രതികാരം നൽകുകയും
  rationale: לִי എന്നത് അക്ഷരാർഥത്തിൽ ‘എനിക്ക്/എനിക്കു’ എന്നാണ്; ദൈവം പ്രതികാരം ചെയ്യുന്നു എന്നു വ്യാഖ്യാനിച്ച് ‘എനിക്കുവേണ്ടി’ എന്ന് മാറ്റാതെ മൂലപാഠത്തിലെ അസാധാരണമായ പ്രയോഗവും ആശയസംഘർഷവും നിലനിർത്തുന്നു. נְקָמֹת ബഹുവചനമാണെങ്കിലും മലയാളത്തിൽ ‘പ്രതികാരം’ എന്ന സമൂഹാർഥ ഏകവചനം സ്വാഭാവികമാണ്.
- source_word: וּמוֹרִיד עַמִּים תַּחְתֵּנִי
  choice: ജനതകളെ എന്റെ കീഴിൽ താഴ്ത്തുകയും
  rationale: מוֹרִיד എന്ന causative ആശയം ‘താഴ്ത്തുന്നു’ എന്നും תַּחְתֵּנִי എന്നത് ‘എന്റെ കീഴിൽ’ എന്നും നേരിട്ട് സംരക്ഷിക്കുന്നു; עַמִּים എന്ന ബഹുവചനം ‘ജനതകൾ’ ആയി നൽകുന്നു.
theological_decisions:
- issue: പ്രതികാരം ലഭിക്കുന്നവനോ അതിന്റെ ഗുണഭോക്താവോ എന്ന לִי-യുടെ ബന്ധം
  choice: എനിക്കു പ്രതികാരം നൽകുന്നു
  alternative: എനിക്കുവേണ്ടി പ്രതികാരം ചെയ്യുന്നു
  rationale: ഹീബ്രു പാഠത്തിലെ לִי ദത്തിവ് ബന്ധത്തെ വ്യാഖ്യാനപരമായി ‘വേണ്ടി’ എന്നു തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു; നൽകിയ ഇംഗ്ലീഷ് പരിശോധനാപാളിയുടെ ഏറ്റവും പുതിയ വിധിയോടും ഇത് യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പ്രതികാരം നൽകുക’ എന്ന അസാധാരണത മൂലഹീബ്രുവിലെ രൂപം സംരക്ഷിക്കാനായി ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
