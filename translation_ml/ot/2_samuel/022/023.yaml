id: 2SA.22.23
reference: 2 Samuel 22:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֥י כָל משפט/ו לְ/נֶגְדִּ֑/י וְ/חֻקֹּתָ֖י/ו לֹא אָס֥וּר מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/023.yaml
  text: For all his judgments were before me[a], and I did not turn away from his statutes.
translation:
  language: ml
  text: എന്തെന്നാൽ, അവിടുത്തെ ന്യായവിധികളെല്ലാം എന്റെ മുമ്പിലുണ്ടായിരുന്നു; അവിടുത്തെ ചട്ടങ്ങളിൽനിന്ന്[a] ഞാൻ വ്യതിചലിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘അതിൽനിന്ന്’ എന്ന ഏകവചനരൂപമാണ്; ഇവിടെ അത് ‘ചട്ടങ്ങൾ’ എന്നതിനെ ഒരു സമാഹാരമായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം. അല്ലെങ്കിൽ: ‘അവയിൽനിന്ന്.’'
    reason: മൂലപാഠത്തിലെ സർവനാമത്തിന്റെ രൂപപരമായ അസ്പഷ്ടത സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ഹേതുവാചകശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָל מִשְׁפָּטָיו
  choice: അവിടുത്തെ ന്യായവിധികളെല്ലാം
  rationale: כָל എന്നതിന്റെ സമഗ്രതയും מִשְׁפָּט എന്ന നിയമ-ന്യായ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: לְנֶגְדִּי
  choice: എന്റെ മുമ്പിലുണ്ടായിരുന്നു
  rationale: ദൈവത്തിന്റെ ന്യായവിധികൾ നിരന്തരം ദൃഷ്ടിയിലും ബോധത്തിലും ഉണ്ടായിരുന്നുവെന്ന രൂപകം അമിതമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְחֻקֹּתָיו
  choice: അവിടുത്തെ ചട്ടങ്ങൾ
  rationale: സ്ഥിരമായി നിശ്ചയിക്കപ്പെട്ട നിയമവ്യവസ്ഥകളെ സൂചിപ്പിക്കുന്ന חֻקּוֹת എന്ന പദത്തെ ‘ന്യായവിധികൾ’ എന്നതിൽനിന്ന് വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: לֹא אָסוּר
  choice: ഞാൻ വ്യതിചലിച്ചില്ല
  rationale: סוּר എന്നതിന്റെ ‘വഴിമാറുക/അകന്നുപോകുക’ എന്ന ധാർമികവും ദിശാസൂചകവുമായ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִמֶּנָּה
  choice: ചട്ടങ്ങളിൽനിന്ന്
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമരൂപം കവിതാഭാഷയിൽ മുൻപുള്ള ചട്ടങ്ങളെ ഒരു സമാഹാരമായി സൂചിപ്പിക്കുന്നതായി സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; രൂപപരമായ അസാധാരണത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-നിയമ പദങ്ങളിലെ വ്യത്യാസം നിലനിർത്തൽ
  choice: מִשְׁפָּטָיו എന്നത് ‘ന്യായവിധികൾ’ എന്നും חֻקֹּתָיו എന്നത് ‘ചട്ടങ്ങൾ’ എന്നും വ്യത്യസ്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടിനെയും പൊതുവായി ‘നിയമങ്ങൾ’ അല്ലെങ്കിൽ ‘കല്പനകൾ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായ കവിതയിൽ സമാന്തരമായി വരുന്ന രണ്ടു വ്യത്യസ്ത നിയമപദങ്ങളെ ഒരേ പൊതുപദത്തിൽ ലയിപ്പിക്കാതിരിക്കുന്നത് മൂലപാഠത്തിന്റെ സൂക്ഷ്മതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും കവിതാസ്വഭാവമുള്ളതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുത്തെ’ ഉപയോഗിച്ചു; നിയമപരമായ രണ്ടു എബ്രായ പദങ്ങളും വേർതിരിച്ചു.
