id: 2SA.22.9
reference: 2 Samuel 22:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עָלָ֤ה עָשָׁן֙ בְּ/אַפּ֔/וֹ וְ/אֵ֥שׁ מִ/פִּ֖י/ו תֹּאכֵ֑ל גֶּחָלִ֖ים בָּעֲר֥וּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/009.yaml
  text: Smoke went up from his nostrils[a], and consuming fire from his mouth; coals blazed from him.
translation:
  language: ml
  text: അവന്റെ മൂക്കുതുളകളിൽനിന്ന്[a] പുക ഉയർന്നു; അവന്റെ വായിൽനിന്ന് ദഹിപ്പിക്കുന്ന തീ പുറപ്പെട്ടു; അവനിൽനിന്ന് തീക്കനലുകൾ ജ്വലിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവന്റെ മൂക്കിൽനിന്ന്.’ ‘മൂക്ക്/മൂക്കുതുള’ എന്നർഥമുള്ള ഹീബ്രുപദം വ്യവഹാരാർത്ഥത്തിൽ ‘കോപം’ എന്നും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: പുക ഉയർന്നു
  rationale: עָלָה സൂചിപ്പിക്കുന്ന മുകളിലേക്കുള്ള ചലനവും עָשָׁן എന്നതിന്റെ സാധാരണ അർത്ഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּאַפּוֹ
  choice: അവന്റെ മൂക്കുതുളകളിൽനിന്ന്
  rationale: אַף എന്ന പദത്തിന് ‘മൂക്ക്/മൂക്കുതുള’ എന്നും വ്യവഹാരാർത്ഥത്തിൽ ‘കോപം’ എന്നും വരാം. എന്നാൽ ‘അവന്റെ വായിൽനിന്ന്’ എന്ന സമാന്തരപ്രയോഗം ഇവിടെ മൂക്കുതുളകളുടെ ദൃശ്യബിംബത്തെ പിന്തുണയ്ക്കുന്നു; പുറപ്പെടുന്ന പുകയെ സൂചിപ്പിക്കാൻ בְ മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിന്ന്’ എന്നു നൽകി.
- source_word: וְאֵשׁ מִפִּיו תֹּאכֵל
  choice: അവന്റെ വായിൽനിന്ന് ദഹിപ്പിക്കുന്ന തീ പുറപ്പെട്ടു
  rationale: תֹּאכֵל അക്ഷരാർഥത്തിൽ ‘തിന്നുന്നു/വിഴുങ്ങുന്നു’ എന്ന സജീവ ആശയം നൽകുന്നു; തീയുടെ നശിപ്പിക്കുന്ന പ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കാൻ ‘ദഹിപ്പിക്കുന്ന’ എന്നു നൽകി. ഹീബ്രുവിൽ വ്യക്തമായ പുറപ്പെടൽക്രിയ ഇല്ലെങ്കിലും מן സൂചിപ്പിക്കുന്ന ഉറവിടബന്ധവും സമാന്തരവാക്യവും മലയാളത്തിൽ പൂർത്തിയാക്കാൻ ‘പുറപ്പെട്ടു’ ചേർത്തു.
- source_word: גֶּחָלִים בָּעֲרוּ
  choice: തീക്കനലുകൾ ജ്വലിച്ചു
  rationale: גֶּחָלִים എന്നത് കനലുകളെയും בָּעֲרוּ അവ കത്തിയുയരുന്നതിനെയും സൂചിപ്പിക്കുന്നു. ‘തീക്കനലുകൾ ജ്വലിച്ചു’ എന്നത് ആവർത്തനമില്ലാതെ കാവ്യദൃശ്യത്തിന്റെ തീവ്രത കൈമാറുന്നു.
- source_word: מִמֶּנּוּ
  choice: അവനിൽനിന്ന്
  rationale: מן ഇവിടെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നതായി എടുത്ത് ദൈവിക യോദ്ധാവിൽനിന്ന് തീ പുറപ്പെടുന്ന ദൃശ്യബിംബം സംരക്ഷിച്ചു.
theological_decisions:
- issue: ദൈവത്തെ മനുഷ്യശരീരാവയവങ്ങളോടുകൂടി ചിത്രീകരിക്കുന്ന ദൈവപ്രത്യക്ഷഭാഷ
  choice: ‘മൂക്കുതുളകൾ,’ ‘വായ്,’ അവനിൽനിന്നു പുറപ്പെടുന്ന പുക, തീ, കനൽ എന്നീ മൂർത്ത ദൃശ്യങ്ങൾ നിലനിർത്തി.
  alternative: ‘മൂക്ക്’ എന്ന പദത്തെ ‘കോപം’ എന്ന വ്യവഹാരാർത്ഥത്തിൽ എടുത്ത് ദൃശ്യബിംബം അമൂർത്തമാക്കുക.
  rationale: ഈ കാവ്യാത്മക ദൈവപ്രത്യക്ഷവിവരണം ദൈവിക കോപവും ശക്തിയും മനുഷ്യരൂപകങ്ങളിലൂടെ ചിത്രീകരിക്കുന്നു. മൂർത്തഭാഷ നിലനിർത്തുന്നത് ഹീബ്രു സമാന്തരതയും വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ തീവ്രതയും സംരക്ഷിക്കുന്നു; അതിനെ ‘കോപം’ എന്നു മാത്രം വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യശൈലി. ദൈവപ്രത്യക്ഷത്തിന്റെ ശക്തമായ ശരീരരൂപകങ്ങൾ ലളിതവും ഗ്രഹിക്കാവുന്നതുമായ പദങ്ങളിൽ സംരക്ഷിച്ചു; വായനാസൗകര്യത്തിനായി അർധവിരാമങ്ങൾ ഉപയോഗിച്ചു.
