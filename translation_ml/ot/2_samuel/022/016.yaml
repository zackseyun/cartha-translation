source:
  edition: WLC
  text: וַ/יֵּֽרָאוּ֙ אֲפִ֣קֵי יָ֔ם יִגָּל֖וּ מֹסְד֣וֹת תֵּבֵ֑ל בְּ/גַעֲרַ֣ת יְהוָ֔ה מִ/נִּשְׁמַ֖ת ר֥וּחַ אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
translation:
  language: ml
  text: അപ്പോൾ സമുദ്രത്തിന്റെ ചാലുകൾ കാണപ്പെട്ടു; യഹ്‌വേയുടെ ശാസനയാൽ, അവന്റെ നാസാരന്ധ്രശ്വാസത്തിന്റെ പ്രചണ്ഡമായ ഊതലാൽ, ഭൂലോകത്തിന്റെ അടിസ്ഥാനങ്ങൾ[a] വെളിപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭൂലോകം’ എന്നതിന് ‘ജനവാസമുള്ള ലോകം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: ദൃശ്യമായി
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തിലെ നിഷ്ക്രിയഭാവം നിലനിർത്തിക്കൊണ്ട്, കവിതയിലെ പെട്ടെന്നുള്ള വെളിപ്പെടൽ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֲפִקֵי יָם
  choice: സമുദ്രത്തിന്റെ ചാലുകൾ
  rationale: אֲפִיקִים എന്നത് ചാലുകൾ, ജലപാതകൾ, നീർച്ചാലുകളുടെ അടിത്തടങ്ങൾ എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ സമുദ്രജലം മാറിയപ്പോൾ വെളിപ്പെട്ട ചാലുകൾ എന്ന വിശാലമായ ദൃശ്യമാണ് നിലനിർത്തുന്നത്.
- source_word: יִגָּלוּ
  choice: അനാവൃതമായി
  rationale: גלה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ‘മറനീങ്ങി വെളിപ്പെടുക’ എന്നർഥം നൽകുന്നു; സമാന്തരമായ ആദ്യവാക്യത്തോടൊപ്പം കവിതാഭംഗിയും നിഷ്ക്രിയഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: מֹסְדוֹת תֵּבֵל
  choice: ഭൂലോകത്തിന്റെ അടിസ്ഥാനങ്ങൾ
  rationale: מוֹסְדוֹת എന്നത് അടിസ്ഥാനങ്ങളെയും תֵּבֵל സാധാരണയായി മനുഷ്യവാസമുള്ള ലോകത്തെയോ ഭൂലോകത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ഭൂലോകം’ കവിതയിലെ വിശ്വവ്യാപകതയും വാസലോകസൂചനയും ഒരുമിച്ച് കൈവിടാതെ സൂക്ഷിക്കുന്നു.
- source_word: בְּגַעֲרַת
  choice: ശാസനയാൽ
  rationale: גְּעָרָה ദൈവികമായ ശാസനയെയോ ഭർത്സനയെയോ സൂചിപ്പിക്കുന്നു; בְּ ഇവിടെ കാരണ/കരണഭാവത്തിലാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ച് വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  choice: അവന്റെ നാസാരന്ധ്രങ്ങളിൽനിന്നുള്ള ശ്വാസത്തിന്റെ ഊതിനാൽ
  rationale: נִשְׁמָהയും רוּחַയും ചേർന്ന് ശക്തമായ ശ്വാസഊതലിന്റെ ചിത്രം നൽകുന്നു; אַף എന്നതിന്റെ ദേഹരൂപകമായ ‘മൂക്ക്/നാസാരന്ധ്രം’ നിലനിർത്തുന്നു, അതിനെ വെറും ‘കോപം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായ ദൈവനാമം തന്നെയായതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരാതെ പേര് സംരക്ഷിച്ചു. മലയാളത്തിലെ സാധാരണവും തിരിച്ചറിയാവുന്നതുമായ രൂപം ‘യഹോവ’യാണ്.
- issue: אַף എന്ന പദത്തിലെ ദേഹരൂപകവും കോപസൂചനയും
  choice: നാസാരന്ധ്രങ്ങൾ
  alternative: കോപം
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ശക്തമായ ശ്വാസം മൂലം സൃഷ്ടി അനാവൃതമാകുന്ന ദൃശ്യരൂപമാണ് മുൻനിൽക്കുന്നത്. ‘കോപം’ സാധ്യമായ ആശയസൂചനയായിരുന്നാലും അത് മാത്രം സ്വീകരിക്കുന്നത് ഹീബ്രു കവിതയിലെ ദേഹരൂപകം ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കവിതാശൈലി. ദൃശ്യമായി, അനാവൃതമായി എന്നീ സമാന്തര ക്രിയകൾ ഹീബ്രു വരികളുടെ ഘടന നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദസമുച്ചയത്തിനു ശേഷം പ്രധാന പാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
