  text: He sent arrows and scattered them; lightning[a], and threw them into confusion.
translation:
  language: ml
  text: 'അവൻ അമ്പുകൾ അയച്ച് അവരെ ചിതറിച്ചു;

    മിന്നൽ അയച്ച് അവരെ പരിഭ്രാന്തരാക്കി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരെ ചിതറിച്ചു’ എന്നും ‘അവരെ പരിഭ്രാന്തരാക്കി’ എന്നും ഉള്ളതിന് ‘അവരെ പിരിച്ചോടിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം; അമ്പുകളുടെയും മിന്നലിന്റെയും ശത്രുക്കളിലുള്ള ഫലമാണ് ഈ രണ്ടു ക്രിയകളും വിവരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ച്
  rationale: שלח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തുന്നു; അമ്പുകളുടെ കാര്യത്തിൽ ‘എയ്തു’ സ്വാഭാവികമാണെങ്കിലും, എബ്രായ കാവ്യത്തിലെ ദൈവികമായി അയയ്ക്കുന്ന ദൃശ്യത്തെ അതിലൂടെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: חִצִּים
  choice: അമ്പുകൾ
  rationale: മൂലപാഠത്തിലെ മൂർത്തമായ യുദ്ധദൃശ്യം നേരിട്ട് നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: וַיְפִיצֵם
  choice: അവരെ ചിതറിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘ചിതറിക്കുക/പിരിച്ചോടിക്കുക’ എന്ന കാരണാർഥം പ്രകടമാക്കുന്നു. പുരുഷലിംഗ ബഹുവചന പ്രത്യയം സന്ദർഭത്തിൽ ശത്രുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בָּרָק
  choice: മിന്നൽ
  rationale: ברק എന്ന ഏകവചന നാമത്തിന്റെ ‘മിന്നൽ’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കാവ്യത്തിന്റെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: וַיְהֻמֵּם
  choice: അവരെ പരിഭ്രാന്തരാക്കി
  rationale: המם എന്ന ക്രിയയുടെ ‘ആശയക്കുഴപ്പത്തിലാക്കുക, സംഭ്രമിപ്പിക്കുക, തോൽപ്പിച്ചോടിക്കുക’ എന്ന അർഥവ്യാപ്തിയിൽ, കാരണാർഥവും ദൈവികാക്രമണത്തിന്റെ ഫലവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സൈനികഫലത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘ചിതറിച്ചു’, ‘പരിഭ്രാന്തരാക്കി’ എന്നീ ക്രിയകളിലെ കർമപ്രത്യയങ്ങളുടെ സൂചിതർ
  choice: സന്ദർഭത്തിൽ ദാവീദിന്റെ ശത്രുക്കളെ സൂചിപ്പിക്കുന്ന ‘അവരെ’ എന്ന് വ്യക്തമാക്കുന്നു.
  alternative: കർമത്തെ സന്ദർഭത്തിൽനിന്ന് മാത്രം ഗ്രഹിക്കാവുന്ന വിധം കൂടുതൽ പരോക്ഷമായി വിടുക.
  rationale: എബ്രായത്തിലെ മൂന്നാംപുരുഷ ബഹുവചന കർമപ്രത്യയങ്ങൾക്ക് ഒരു സൂചിതവിഷയം ആവശ്യമാണ്; ചുറ്റുപാടിലുള്ള ദൈവികയുദ്ധസന്ദർഭം ശത്രുക്കളെയാണ് ഏറ്റവും സ്വാഭാവികമായ സൂചിതരാക്കുന്നത്.
- issue: രണ്ടാം അർധവാക്യത്തിൽ ‘അയച്ചു’ എന്ന ക്രിയയുടെ അഭാവം
  choice: മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘മിന്നൽ അയച്ച്’ എന്ന് മുൻക്രിയയെ പൂരിപ്പിക്കുന്നു.
  alternative: ‘മിന്നൽ; അവരെ പരിഭ്രാന്തരാക്കി’ എന്നിങ്ങനെ എബ്രായത്തിലെ സംക്ഷിപ്ത ഘടന അതേപടി നിലനിർത്തുക.
  rationale: മൂലപാഠം കാവ്യാത്മകമായി ക്രിയയെ ലോപിപ്പിക്കുന്നു. മലയാളത്തിൽ മുൻവരിയിലെ ‘അയച്ച്’ ആവർത്തിച്ച് മനസ്സിലാക്കുന്നത് സ്വാഭാവികവും അർഥവിശ്വസ്തവുമാണ്; പുതിയ ദൈവശാസ്ത്രവിവരം ചേർക്കുന്നില്ല.
