reference: 2 Samuel 22:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּזְרֵ֥/נִי חַ֖יִל לַ/מִּלְחָמָ֑ה תַּכְרִ֥יעַ קָמַ֖/י תַּחְתֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/040.yaml
  text: You armed me with strength for battle[b][a]; you caused those who rose against me to bow beneath me.
translation:
  language: ml
  text: യുദ്ധത്തിനായി നീ എന്നെ ശക്തിയാൽ സജ്ജമാക്കി[a]; എന്നെ എതിർത്ത് എഴുന്നേറ്റവരെ നീ എനിക്കു കീഴിൽ കുനിയിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്തതായി: ‘യുദ്ധത്തിനായി നീ ശക്തികൊണ്ട് എന്നെ അരമുറുക്കി.’ എബ്രായക്രിയയിൽ അരകെട്ടി സജ്ജമാക്കുന്ന ദൃശ്യഭാവമുണ്ട്.'
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ എതിരാളികളെ നീ എനിക്കു കീഴിൽ മുട്ടുകുത്തിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ എതിരാളികളെ കുനിയിക്കുകയോ മുട്ടുകുത്തിക്കുകയോ ചെയ്യുന്ന ആശയം പ്രകടിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּזְרֵנִי
  choice: നീ എന്നെ ... സജ്ജനാക്കി
  rationale: ക്രിയയുടെ ‘അരകെട്ടുക, സജ്ജമാക്കുക’ എന്ന യുദ്ധസന്നാഹഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു; മൂലത്തിലെ ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: חַיִל
  choice: ശക്തിയാൽ
  rationale: ഈ സന്ദർഭത്തിൽ യുദ്ധത്തിനായി ലഭിക്കുന്ന ബലം അഥവാ പ്രാപ്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ശക്തി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധത്തിനായി
  rationale: ഉദ്ദേശ്യാർഥമുള്ള לְ ഉപസർഗവും מִלְחָמָה എന്നതിന്റെ യുദ്ധസന്ദർഭവും നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: תַּכְרִיעַ
  choice: കുനിയിച്ചു
  rationale: כָּרַע എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപം ‘കുനിയാൻ/മുട്ടുകുത്താൻ ഇടയാക്കുക’ എന്നാണ്; എതിരാളികളെ ബലമായി കീഴ്പ്പെടുത്തുന്ന ദൃശ്യരൂപം ‘കുനിയിച്ചു’ നിലനിർത്തുന്നു.
- source_word: קָמַי
  choice: എനിക്കെതിരെ എഴുന്നേറ്റവരെ
  rationale: קוּם എന്ന ധാതുവിലെ ‘എതിരെ എഴുന്നേൽക്കുക’ എന്ന പങ്കാളിത്തരൂപം പൊതുവായ ‘ശത്രുക്കൾ’ എന്നു ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: תַּחְתֵּנִי
  choice: എന്റെ കീഴിൽ
  rationale: ‘എന്റെ താഴെ/കീഴിൽ’ എന്ന സ്ഥലപരവും അധീനതാസൂചകവുമായ അർഥങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
