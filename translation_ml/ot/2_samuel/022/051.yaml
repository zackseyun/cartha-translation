- from: അവിടുന്ന് തന്റെ രാജാവിന് മഹത്തായ രക്ഷകൾ നൽകുന്നു[a]; തന്റെ അഭിഷിക്തനോടു—ദാവീദിനോടും അവന്റെ സന്തതിയോടും—എന്നേക്കും ഉടമ്പടിവിശ്വസ്തത കാണിക്കുന്നു[b][c].
