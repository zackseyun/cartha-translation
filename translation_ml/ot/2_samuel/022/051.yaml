reference: 2 Samuel 22:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מגדיל יְשׁוּע֣וֹת מַלְכּ֑/וֹ וְ/עֹֽשֶׂה חֶ֧סֶד לִ/מְשִׁיח֛/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֖/וֹ עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: ml
  text: അവിടുന്ന് തന്റെ രാജാവിന് മഹത്തായ രക്ഷകൾ നൽകുന്നു[a]; തന്റെ അഭിഷിക്തനായ[c] ദാവീദിനും അവന്റെ സന്തതിക്കും എന്നേക്കും ഉടമ്പടിയോടുള്ള വിശ്വസ്തത കാണിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തന്റെ രാജാവിന് മഹത്തായ വിടുതലുകൾ നൽകുന്നു” അല്ലെങ്കിൽ “മഹത്തായ വിജയങ്ങൾ നൽകുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അചഞ്ചലസ്നേഹം കാണിക്കുന്നു” അല്ലെങ്കിൽ “വിശ്വസ്തസ്നേഹം കാണിക്കുന്നു.” എബ്രായപദം വിശ്വസ്തമായ സ്നേഹത്തെയും ഉടമ്പടിയോടുള്ള കൂറിനെയും സൂചിപ്പിക്കാറുണ്ട്.'
    reason: lexical_alternative
  - marker: c
    text: “തന്റെ അഭിഷിക്തൻ” എന്നത് “തന്റെ മശീഹാ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ അത് ആദ്യം ദാവീദിനെയും ദാവീദീയ രാജാവിനെയും സൂചിപ്പിക്കുമ്പോഴും വിശാലമായ മശീഹാപ്രതിജ്ഞയുടെ അനുരണനവും വഹിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: מגדיל יְשׁוּעוֹת
  choice: മഹത്തായ രക്ഷകൾ നൽകുന്നു
  rationale: מגדיל എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘മഹത്തരമാക്കുന്നു’ എന്ന കാരണാർത്ഥവും יְשׁוּעוֹת എന്ന ബഹുവചനത്തിന്റെ ആവർത്തിത രക്ഷാപ്രവൃത്തികൾ എന്ന ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: מַלְכּוֹ
  choice: തന്റെ രാജാവിന്
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ പദത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം; യഹോവയും ദാവീദീയ രാജാവും തമ്മിലുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: ഉടമ്പടിവിശ്വസ്തത കാണിക്കുന്നു
  rationale: חֶסֶד സൂചിപ്പിക്കുന്ന ഉറച്ച സ്നേഹം, വിശ്വസ്തത, ഉടമ്പടിയോടുള്ള കൂറ് എന്നിവ ഈ രാജകീയ-ഉടമ്പടി സന്ദർഭത്തിൽ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: לִמְשִׁיחוֹ
  choice: തന്റെ അഭിഷിക്തനോടു
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർത്ഥമായ ‘അഭിഷേകം ചെയ്യപ്പെട്ടവൻ’ സംരക്ഷിക്കുകയും ഇവിടെ ആദ്യം ദാവീദീയ രാജാവിനെ സൂചിപ്പിക്കുന്ന ചരിത്രസന്ദർഭം മായ്ച്ചുകളയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לְדָוִד וּלְזַרְעוֹ
  choice: ദാവീദിനോടും അവന്റെ സന്തതിയോടും
  rationale: זֶרַע എന്ന ഏകവചന-സമൂഹനാമത്തിന്റെ ഉടമ്പടിപരമായ അനുരണനം ‘സന്തതി’ നിലനിർത്തുന്നു; ദാവീദിനെയും അവന്റെ രാജവംശപരമ്പരയെയും ഉൾക്കൊള്ളുന്നു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: തുടർച്ചയായ ശാശ്വതകാലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ദാവീദീയ ഉടമ്പടി സന്ദർഭത്തിലെ חֶסֶד എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഉടമ്പടിവിശ്വസ്തത
  alternative: അചഞ്ചലസ്നേഹം; വിശ്വസ്തസ്നേഹം
  rationale: വികാരം മാത്രമല്ല, ബന്ധപരവും വാഗ്ദാനാധിഷ്ഠിതവുമായ ദൈവിക കൂറും ഈ പദത്തിൽ ഉൾപ്പെടുന്നു. പകരംവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: מְשִׁיחוֹ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: തന്റെ അഭിഷിക്തൻ
  alternative: തന്റെ മശീഹാ
  rationale: ഉടൻസന്ദർഭത്തിൽ ഇത് ദാവീദിനെയും ദാവീദീയ രാജാവിനെയും ആദ്യം സൂചിപ്പിക്കുന്നു. ‘മശീഹാ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുന്നത് പിന്നീടുള്ള പദവിയെ ചരിത്രപരമായ സൂചനയിൽ മുൻകൂട്ടി ചുമത്താം; എന്നാൽ മശീഹാപരമായ അനുരണനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. മൂലത്തിലെ രക്ഷകളുടെ ബഹുവചനം നിലനിർത്തി; ദാവീദിനെയും സന്തതിയെയും ‘അഭിഷിക്തൻ’ എന്നതിനോടു വിശദീകരണബന്ധത്തിൽ കാണിക്കാൻ ദീർഘവിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
