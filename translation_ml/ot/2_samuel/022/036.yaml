id: 2SA.22.36
reference: 2 Samuel 22:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּתֶּן לִ֖/י מָגֵ֣ן יִשְׁעֶ֑/ךָ וַ/עֲנֹתְ/ךָ֖ תַּרְבֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/036.yaml
  text: You gave me the shield of your salvation[a], and your gentleness made me great.
translation:
  language: ml
  text: അങ്ങ് എനിക്ക് അങ്ങയുടെ രക്ഷയുടെ പരിച നൽകി; അങ്ങയുടെ താഴ്മ[a] എന്നെ മഹാനാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അങ്ങയുടെ സൗമ്യത’ അല്ലെങ്കിൽ ‘അങ്ങ് കൃപയോടെ താഴ്ന്നുവന്നത്.’ എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; പ്രസംഗകനെ ഉയർത്തേണ്ടതിന് ദൈവം കൃപയോടെ താഴ്ന്നുവന്നതിനെ ഇത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: നൽകി
  rationale: נתן എന്ന ധാതുവിന്റെ ഖാൽ വയ്‌യിഖ്തോൽ രൂപം; ദൈവത്തോടു നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ഭൂതകാല പ്രവൃത്തിയായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לִי
  choice: എനിക്ക്
  rationale: പരോക്ഷ കർമത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: מָגֵן
  choice: പരിച
  rationale: മൂലത്തിലെ മൂർത്തമായ യുദ്ധചിത്രം സംരക്ഷിക്കുന്നു; ‘സംരക്ഷണം’ എന്ന അമൂർത്തീകരണം ഒഴിവാക്കുന്നു.
- source_word: יִשְׁעֶךָ
  choice: അങ്ങയുടെ രക്ഷ
  rationale: ദൈവം നൽകുന്ന വിടുതൽ/രക്ഷ എന്ന അർഥവും മൂലത്തിലെ ബന്ധഘടനയും നിലനിർത്തുന്നു.
- source_word: וַעֲנֹתְךָ
  choice: അങ്ങയുടെ താഴ്മ
  rationale: ദുഷ്കരമായ ഈ എബ്രായരൂപത്തിൽ ദൈവം കൃപയോടെ താഴ്ന്നുവരുന്നു എന്ന വിസ്മയകരമായ ആശയം നേരിട്ട് നിലനിർത്തുന്നു; സാധ്യമായ മറ്റു അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: תַּרְבֵּנִי
  choice: എന്നെ മഹാനാക്കി
  rationale: רבה എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപത്തിന്റെ കാരണാർത്ഥം സ്വാഭാവികമായി നൽകുകയും ദൈവം പ്രസംഗകനെ ഉയർത്തിയെന്ന സന്ദർഭാർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവത്തെക്കുറിച്ചുള്ള וַעֲנֹתְךָ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: അങ്ങയുടെ താഴ്മ
  alternative: അങ്ങയുടെ സൗമ്യത; അങ്ങ് താഴ്ന്നുവന്നത്; അങ്ങയുടെ സഹായം
  rationale: ‘താഴ്മ’ എന്ന പരിഭാഷ ദൈവം തന്റെ ദാസനെ ഉയർത്താൻ കൃപയോടെ താഴ്ന്നുവരുന്നു എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം മായ്ച്ചുകളയാതെ സംരക്ഷിക്കുന്നു. എബ്രായപദം ദുഷ്കരവും പലവിധം വ്യാഖ്യാനിക്കപ്പെട്ടതുമായതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ ദൈവാഭിസംബോധനയ്ക്ക് ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. മൂലത്തിലെ കാവ്യാത്മക യുദ്ധരൂപകവും ‘താഴ്മ’ എന്ന അമ്പരപ്പിക്കുന്ന ദൈവശാസ്ത്രഭാഷയും ലളിതമാക്കാതെ നിലനിർത്തി.
