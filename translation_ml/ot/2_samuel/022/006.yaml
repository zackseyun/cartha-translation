source:
  edition: WLC
  text: חֶבְלֵ֥י שְׁא֖וֹל סַבֻּ֑/נִי קִדְּמֻ֖/נִי מֹֽקְשֵׁי מָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/006.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: ml
  text: ഷെയോലിന്റെ കയറുകൾ എന്നെ ചുറ്റിവളഞ്ഞു; മരണത്തിന്റെ കെണികൾ എന്നെ നേരിട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നെ എതിരേറ്റു” എന്നോ “എന്റെ മുമ്പിൽ വന്നെത്തി” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: കയറുകൾ
  rationale: കെട്ടിയിടുകയോ കുടുക്കുകയോ ചെയ്യുന്ന കയറുകളുടെ കാവ്യരൂപകം നിലനിർത്തുന്നു; സമാന്തരമായ ‘കെണികൾ’ എന്ന പ്രയോഗത്തോടും സ്വാഭാവികമായി ചേരുന്നു.
- source_word: שְׁאוֹל
  choice: ഷെയോൽ
  rationale: മരിച്ചവരുടെ അധോലോകം/മരണലോകം സൂചിപ്പിക്കുന്ന എബ്രായപദം ലിപ്യന്തരണം ചെയ്ത് അതിന്റെ കാവ്യപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: סַבֻּנִי
  choice: എന്നെ ചുറ്റിവളഞ്ഞു
  rationale: סבב എന്ന ക്രിയയുടെ ചുറ്റുക, വലയംചെയ്യുക എന്ന അടിസ്ഥാനാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: קִדְּמֻנִי
  choice: എന്നെ നേരിട്ടു
  rationale: കാണാൻ വരുക, മുന്നിൽ എത്തുക, എതിരിടുക എന്നീ സാധ്യതകൾ ഉൾക്കൊള്ളുന്ന സന്ദർഭോചിതവും ചുരുക്കവുമായ പ്രയോഗം.
- source_word: מֹקְשֵׁי
  choice: കെണികൾ
  rationale: מוקש സൂചിപ്പിക്കുന്ന പിടിക്കാനുള്ള കെണി എന്ന ദൃശ്യരൂപം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מָוֶת
  choice: മരണം
  rationale: മൂലനാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ; ഇവിടെ വ്യാഖ്യാനപരമായ വിപുലീകരണം ആവശ്യമില്ല.
theological_decisions:
- issue: שְׁאוֹל എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഷെയോൽ
  alternative: ശവക്കുഴി; മരിച്ചവരുടെ ലോകം
  rationale: മൂലത്തിലെ പദം ലിപ്യന്തരണം ചെയ്യുന്നത് ശവക്കുഴി, മരണം, മരിച്ചവരുടെ ലോകം എന്നിവയ്ക്കിടയിലെ അർഥവ്യാപ്തി മുൻകൂട്ടി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: קִדְּמֻנִי എന്ന ക്രിയയുടെ അർഥം
  choice: എന്നെ നേരിട്ടു
  alternative: എന്നെ എതിരേറ്റു; എന്റെ മുമ്പിൽ വന്നെത്തി
  rationale: ശത്രുതാപരമായ കാവ്യസന്ദർഭം വ്യക്തമാക്കുമ്പോഴും ‘മുന്നിൽ വരുക/കണ്ടുമുട്ടുക’ എന്ന മൂലാർഥസാധ്യത പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ. ‘ഷെയോൽ’ എന്ന അപരിചിതമായ മൂലപദം അർഥവ്യാപ്തി സംരക്ഷിക്കാൻ നിലനിർത്തി. അടിക്കുറിപ്പുകുറി ബന്ധപ്പെട്ട ‘നേരിട്ടു’ എന്ന പദത്തിനു ശേഷമാണ് നൽകിയിരിക്കുന്നത്.
