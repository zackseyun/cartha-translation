source:
  edition: WLC
  text: בְּנֵ֥י נֵכָ֖ר יִבֹּ֑לוּ וְ/יַחְגְּר֖וּ מִ/מִּסְגְּרוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/046.yaml
  text: Foreigners lose heart and come trembling out of their strongholds[a][b][c].
translation:
  language: ml
  text: വിദേശികൾ ധൈര്യംകെട്ട് തങ്ങളുടെ കോട്ടകളിൽനിന്ന് വിറച്ചുകൊണ്ട് പുറത്തുവരുന്നു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “വിദേശികൾ വാടിപ്പോകുന്നു.” എബ്രായക്രിയയ്ക്ക് കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘വാടുക’ അഥവാ ‘മങ്ങിപ്പോകുക’ എന്നു വരാം.'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ എബ്രായക്രിയയുടെ അർഥം ദുഷ്കരമാണ്. “ഭയന്ന് പതുങ്ങിവരുന്നു,” “മുടന്തിവരുന്നു,” അല്ലെങ്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ “അരകെട്ടുന്നു” എന്നിങ്ങനെയും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: “തങ്ങളുടെ ദുർഗങ്ങളിൽനിന്ന്”; സാധ്യത കുറവാണെങ്കിലും “തങ്ങളുടെ തടവറകളിൽനിന്ന്” അഥവാ “അടച്ചുകെട്ടിയ ഇടങ്ങളിൽനിന്ന്” എന്നും വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: വിദേശികൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അന്യരുടെ മക്കൾ’ എന്നാണെങ്കിലും, ഈ എബ്രായ പ്രയോഗം വിദേശജനങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘വിദേശികൾ’ ആ കൂട്ടായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִבֹּלוּ
  choice: ധൈര്യംകെട്ട്
  rationale: נבל എന്ന ധാതുവിന്റെ അടിസ്ഥാനാർഥം ‘വാടുക, മങ്ങിപ്പോകുക’ എന്നാണ്. യുദ്ധവിജയത്തെക്കുറിച്ചുള്ള ഈ കാവ്യസന്ദർഭത്തിൽ ശത്രുക്കളുടെ ധൈര്യവും ശക്തിയും തകർന്നുപോകുന്നതാണ് സൂചന; അതിനാൽ ‘ധൈര്യംകെട്ട്’ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു, കൂടുതൽ അക്ഷരാർഥമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְיַחְגְּרוּ
  choice: വിറച്ചുകൊണ്ട് പുറത്തുവരുന്നു
  rationale: ഈ ക്രിയ ഇവിടെ ദുഷ്കരമാണ്. חגר സാധാരണയായി ‘അരകെട്ടുക’ എന്നാണ്; എന്നാൽ സമാന്തരസന്ദർഭവും കീഴടങ്ങിയ ശത്രുക്കൾ പ്രതിരോധസ്ഥാനങ്ങളിൽനിന്ന് പുറത്തുവരുന്നതും പരിഗണിക്കുമ്പോൾ ഭയത്തോടെയുള്ള പുറപ്പെടലാണ് സന്ദർഭത്തിന് യോജിച്ചത്. പാഠത്തിലെ ‘പുറത്തുവരുന്നു’ എന്ന ആശയം ഈ ക്രിയയും തുടർന്നുള്ള ‘നിന്ന്’ എന്ന പ്രയോഗവും ചേർന്നാണ് വ്യക്തമാകുന്നത്.
- source_word: מִמִּסְגְּרוֹתָם
  choice: തങ്ങളുടെ കോട്ടകളിൽനിന്ന്
  rationale: מִסְגְּרוֹת എന്നത് അടച്ചിടുന്ന സ്ഥലങ്ങളെയോ ചുറ്റുമതിലുള്ള ഇടങ്ങളെയോ സൂചിപ്പിക്കാം. സൈനിക വിജയഗീതത്തിന്റെ പശ്ചാത്തലത്തിൽ ശത്രുക്കളുടെ പ്രതിരോധസ്ഥാനങ്ങളായ ‘കോട്ടകൾ’ ഏറ്റവും സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷയാണ് ഉപയോഗിച്ചത്. എബ്രായത്തിലെ രണ്ടു ദുഷ്കര ക്രിയകളുടെ സന്ദർഭാർഥം മുഖ്യപാഠത്തിൽ വായനാസൗകര്യത്തോടെ നൽകിയപ്പോൾ, അവയുടെ അക്ഷരാർഥവും പ്രധാന പാഠഭേദസാധ്യതകളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
