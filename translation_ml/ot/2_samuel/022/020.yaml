source:
  edition: WLC
  text: וַ/יֹּצֵ֥א לַ/מֶּרְחָ֖ב אֹתִ֑/י יְחַלְּצֵ֖/נִי כִּי חָ֥פֵֽץ בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/020.yaml
  text: He brought me out into a broad place[a]; he rescued me[b], because he delighted in me.
translation:
  language: ml
  text: അവിടുന്ന് എന്നെ വിശാലമായ സ്ഥലത്തേക്കു കൊണ്ടുവന്നു[a]; എന്നെ രക്ഷിച്ചു; കാരണം, അവിടുന്ന് എന്നിൽ പ്രസാദിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘തുറസ്സായ സ്ഥലത്തേക്ക്.’ എബ്രായ ദൃശ്യരൂപം ഞെരുക്കത്തിനും ദുരിതത്തിനും വിപരീതമായ സ്വാതന്ത്ര്യത്തെയും ആശ്വാസത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘അവിടുന്ന് എന്നിൽ ആനന്ദിച്ചു’ / ‘എന്നെക്കുറിച്ച് സന്തോഷിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: അവിടുന്ന് എന്നെ ... കൊണ്ടുവന്നു
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘പുറത്തേക്കു കൊണ്ടുവരുക’ എന്ന കാരകാർഥം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ഈ വിടുതൽചിത്രം നിലനിർത്തുന്നു.
- source_word: לַמֶּרְחָב
  choice: വിശാലമായ സ്ഥലത്തേക്ക്
  rationale: מֶרְחָב ഞെരുക്കത്തിനും ദുരിതത്തിനും വിപരീതമായ വിശാലവും തുറസ്സുമായ ഇടത്തെ സൂചിപ്പിക്കുന്നു; എബ്രായ ദൃശ്യരൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: יְחַלְּצֵנִי
  choice: എന്നെ രക്ഷിച്ചു
  rationale: חלץ എന്ന പീയേൽ രൂപത്തിന് ‘പുറത്തെടുക്കുക, വിടുവിക്കുക, രക്ഷിക്കുക’ എന്ന അർഥമുണ്ട്. സന്ദർഭത്തിലും സമാന്തരവാക്യത്തിലും ‘രക്ഷിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: രക്ഷയുടെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകപദമാണിത്; ആ കാരണബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חָפֵץ בִּי
  choice: എന്നിൽ പ്രസാദിച്ചു
  rationale: חפץ + ב ഒരാളിൽ പ്രീതി തോന്നുക, പ്രസാദിക്കുക, ആനന്ദിക്കുക എന്ന ബന്ധപരമായ അനുകൂലഭാവം പ്രകടിപ്പിക്കുന്നു. ‘എന്നിൽ പ്രസാദിച്ചു’ ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: ദൈവിക വിടുതലിന്റെ കാരണം
  choice: കാരണം, അവിടുന്ന് എന്നിൽ പ്രസാദിച്ചു
  alternative: കാരണം, അവിടുന്ന് എന്നിൽ ആനന്ദിച്ചു / എന്നെക്കുറിച്ച് സന്തോഷിച്ചു
  rationale: ദാവീദിന്റെ രക്ഷയ്ക്ക് ദൈവത്തിന്റെ അനുകൂലമായ പ്രസാദമാണ് വാക്യം കാരണമായി പറയുന്നത്. ഇതിനെ യോഗ്യതയെക്കുറിച്ചുള്ള വിപുലമായ സിദ്ധാന്തമായി വ്യാഖ്യാനിക്കാതെ, മൂലപാഠത്തിലെ ബന്ധപരമായ ഭാഷയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. എബ്രായ കവിതയിലെ വിശാലസ്ഥലത്തിന്റെ രൂപകവും രണ്ടു സമാന്തര വിടുതൽപ്രസ്താവനകളും നിലനിർത്തി.
