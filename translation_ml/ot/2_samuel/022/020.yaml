  source_fidelity: വിവർത്തനം എബ്രായ പാഠത്തിലെ കാരണബന്ധവും സമാന്തര വിടുതൽപ്രസ്താവനകളും വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു. וַיּוֹצֵא-യുടെ ഹിഫീൽ കാരകാർഥം ‘കൊണ്ടുവന്നു’ എന്നതിലും, לַמֶּרְחָב-യുടെ രൂപകപരമായ വിശാല/തുറസ്സായ ഇടം ‘വിശാലമായ സ്ഥലത്തേക്ക്’ എന്നതിലും, יְחַלְּצֵנִי-യുടെ വിടുവിക്കൽ അർഥം ‘രക്ഷിച്ചു’ എന്നതിലും സൂക്ഷിച്ചിരിക്കുന്നു. כִּי-യുടെ ‘കാരണം’ ശരിയായ കാരണവാചകമാണ്; חָפֵץ בִּי-യുടെ അനുകൂലവും വ്യക്തിപരവുമായ ഭാവം ‘എന്നിൽ പ്രസാദിച്ചു’ എന്നതിൽ യോജ്യമായി ലഭിക്കുന്നു.
