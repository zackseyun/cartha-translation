  text: They confronted me in the day of my calamity[b][a], but Yahweh was my support.
translation:
  language: ml
  text: എന്റെ ദുരന്തദിവസത്തിൽ അവർ എന്നെ എതിരിട്ടു[a]; എന്നാൽ യഹ്‌വെ എനിക്ക് താങ്ങായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവർ എന്റെമേൽ വന്നു” അല്ലെങ്കിൽ “അവർ എന്നെ നേരിട്ടു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  choice: അവർ എന്നെ എതിരിട്ടു
  rationale: קדמ എന്ന ധാതുവിന്റെ പീയേൽ രൂപം ഇവിടെ ശത്രുതാപരമായ പശ്ചാത്തലത്തിൽ ഒരാളെ നേരിടുക അഥവാ എതിർത്തുനിൽക്കുക എന്ന അർഥം നൽകുന്നു. ‘എതിരിട്ടു’ ആ വൈരഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘എന്നെ സമീപിച്ചു/കണ്ടുമുട്ടി’ എന്ന നിഷ്പക്ഷ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּיוֹם אֵידִי
  choice: എന്റെ ദുരന്തദിവസത്തിൽ
  rationale: אֵיד എന്നത് ആപത്ത്, വിനാശം, ദുരന്തം എന്നിവയെ സൂചിപ്പിക്കുന്നു. ‘ദുരന്തദിവസം’ കഠിനമായ വിപത്തിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം ചുരുക്കമായും സ്വാഭാവികമായും പകരുന്നു.
- source_word: וַיְהִי
  choice: എന്നാൽ ... ആയി
  rationale: രൂപപരമായി ‘ആയി/ഉണ്ടായിരുന്നു’ എന്ന തുടർച്ചയാണെങ്കിലും, ശത്രുക്കളുടെ എതിർപ്പിനും യഹ്‌വെയുടെ സഹായത്തിനും ഇടയിലെ സന്ദർഭപരമായ വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു വ്യഞ്ജനരൂപമായ YHWH-നെ ഒരു പൊതുപദവിയാൽ മാറ്റാതെ ദൈവനാമമായി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מִשְׁעָן לִי
  choice: എനിക്ക് താങ്ങായി
  rationale: מִשְׁעָן എന്നത് ചാരിനിൽക്കാവുന്ന താങ്ങിനെയോ ആശ്രയത്തെയോ സൂചിപ്പിക്കുന്നു. ‘എനിക്ക് താങ്ങായി’ എന്നത് לִי എന്ന ബന്ധവും രൂപകത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഒരു പദവിയല്ല, ചതുർവ്യഞ്ജന ദൈവനാമമാണ് ഉള്ളത്. അതിനാൽ അത് ‘കർത്താവ്’ എന്നു പകരാതെ ദൈവനാമമായി ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എതിരിട്ടു’ ശത്രുതാപരമായ സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘താങ്ങായി’ മִשְׁעָן എന്ന രൂപകത്തെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി എത്തിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ക്രിയയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
