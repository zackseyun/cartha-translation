revisions:
- from: എന്റെ ദൈവമേ, എന്റെ പാറയേ, അങ്ങയിൽ ഞാൻ അഭയം പ്രാപിക്കുന്നു; എന്റെ പരിചയും എന്റെ രക്ഷയുടെ കൊമ്പും[a], എന്റെ സുരക്ഷിതകോട്ടയും എന്റെ അഭയസ്ഥാനവും, എന്റെ രക്ഷകനും അങ്ങുതന്നെ—അക്രമത്തിൽനിന്ന് അങ്ങ് എന്നെ രക്ഷിക്കുന്നു.
