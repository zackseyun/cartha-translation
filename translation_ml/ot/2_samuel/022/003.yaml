  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֱלֹהֵ֥י צוּרִ֖/י אֶחֱסֶה בּ֑/וֹ מָגִנִּ֞/י וְ/קֶ֣רֶן יִשְׁעִ֗/י מִשְׂגַּבִּ/י֙ וּ/מְנוּסִ֔/י מֹשִׁעִ֕/י מֵ/חָמָ֖ס תֹּשִׁעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
translation:
  language: ml
  text: എന്റെ ദൈവമേ, എന്റെ പാറേ, അങ്ങയിൽ ഞാൻ അഭയം പ്രാപിക്കുന്നു; എന്റെ പരിചയും എന്റെ രക്ഷയുടെ കൊമ്പും, എന്റെ ദുർഗവും എന്റെ അഭയസ്ഥാനവും, എന്റെ രക്ഷകനും—അക്രമത്തിൽ നിന്ന് അങ്ങ് എന്നെ രക്ഷിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  choice: എന്റെ ദൈവമേ, എന്റെ പാറയേ
  rationale: എബ്രായത്തിലെ സംയുക്തപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘എന്റെ പാറയുടെ ദൈവം’ എന്നു വരാമെങ്കിലും, ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന കാവ്യാത്മക സമാന്തര വിശേഷണനിരയായി വായിക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവും ആണ്.
- source_word: אֶחֱסֶה בּוֹ
  choice: അങ്ങയിൽ ഞാൻ അഭയം പ്രാപിക്കുന്നു
  rationale: חסה എന്ന ക്രിയയുടെ ‘അഭയം തേടുക/പ്രാപിക്കുക’ എന്ന അർഥവും בּוֹയിലെ ‘അവനിൽ’ എന്ന ബന്ധവും നിലനിർത്തുന്നു; ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്കായി ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
- source_word: מָגִנִּי
  choice: എന്റെ പരിച
  rationale: സംരക്ഷണത്തിന്റെ മൂർത്തമായ രൂപകം നേരിട്ട് നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: קֶרֶן יִשְׁעִי
  choice: എന്റെ രക്ഷയുടെ കൊമ്പ്
  rationale: ശക്തിയുടെയും വിജയശേഷിയുടെയും എബ്രായരൂപകമായ ‘കൊമ്പ്’ വിശദീകരിച്ച് പരത്താതെ സംരക്ഷിക്കുകയും construct ബന്ധം ‘രക്ഷയുടെ’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִשְׂגַּבִּי
  choice: എന്റെ സുരക്ഷിതകോട്ട
  rationale: ഉയർന്നതും സുരക്ഷിതവുമായ പ്രതിരോധസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וּמְנוּסִי
  choice: എന്റെ അഭയസ്ഥാനം
  rationale: അപകടത്തിൽനിന്ന് ഓടിച്ചെന്ന് സുരക്ഷ നേടുന്ന ഇടം എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു; മുൻപുള്ള ക്രിയാപ്രയോഗവുമായി കാവ്യാത്മക ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: מֹשִׁעִי
  choice: എന്റെ രക്ഷകൻ
  rationale: ישׁע ധാതുവിലെ രക്ഷിക്കുക/വിടുവിക്കുക എന്ന അർഥമുള്ള കർത്തൃരൂപം നേരിട്ട് നൽകുന്നു; പിന്നീട് വരുന്ന ‘രക്ഷിക്കുന്നു’ എന്ന ക്രിയയുമായുള്ള മൂലപദബന്ധവും മലയാളത്തിൽ പ്രതിഫലിക്കുന്നു.
- source_word: מֵחָמָס
  choice: അക്രമത്തിൽനിന്ന്
  rationale: חָמָס സൂചിപ്പിക്കുന്ന അക്രമവും ഹിംസാത്മക അനീതിയും ഒരു പ്രത്യേക മനുഷ്യസംഘത്തെ കൂട്ടിച്ചേർക്കാതെ അമൂർത്തനാമമായി നിലനിർത്തുന്നു.
- source_word: תֹּשִׁעֵנִי
  choice: അങ്ങ് എന്നെ രക്ഷിക്കുന്നു
  rationale: രണ്ടാംപുരുഷ ഏകവചന കർത്താവിനെയും ഒന്നാംപുരുഷ ഏകവചന കർമത്തെയും വ്യക്തമായി നൽകുന്നു; കാവ്യത്തിൽ ദൈവത്തിന്റെ പ്രവർത്തിയെ ഇപ്പോഴത്തെ യാഥാർഥ്യമായി അവതരിപ്പിക്കുന്ന അപൂർണ്ണക്രിയയുടെ തുറന്ന കാലഭാവം വർത്തമാനകാലത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തെ വിശേഷിപ്പിക്കുന്ന മൂർത്തമായ കാവ്യരൂപകങ്ങൾ
  choice: ‘പാറ’, ‘പരിച’, ‘കൊമ്പ്’, ‘സുരക്ഷിതകോട്ട’, ‘അഭയസ്ഥാനം’ എന്നീ രൂപകങ്ങൾ നിലനിർത്തി.
  alternative: ‘സംരക്ഷകൻ’, ‘ശക്തിയുടെ ഉറവിടം’ തുടങ്ങിയ അമൂർത്ത വിശദീകരണങ്ങളാക്കി മാറ്റുക.
  rationale: മൂലപാഠത്തിലെ സാന്ദ്രമായ സംരക്ഷണ-യുദ്ധരൂപകങ്ങളും അവയുടെ ദൈവശാസ്ത്രപരമായ കാവ്യശക്തിയും വ്യാഖ്യാനിച്ച് പരത്താതെ സംരക്ഷിക്കുന്നു.
- issue: מֹשִׁעִי എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: എന്റെ രക്ഷകൻ
  alternative: എന്റെ വിടുവിക്കുന്നവൻ
  rationale: ദൈവം രക്ഷിക്കുന്നവനാണെന്ന വാക്യത്തിന്റെ നേരിട്ടുള്ള അവകാശവാദം നൽകുന്നു; പദത്തിന് ഇല്ലാത്ത പിൽക്കാല സിദ്ധാന്തവിശദാംശങ്ങൾ ചേർക്കുന്നില്ല.
- issue: אֱלֹהֵי צוּרִי എന്ന ഘടനയിലെ അസ്പഷ്ടത
  choice: മുഖ്യപാഠത്തിൽ കാവ്യാത്മക അഭിസംബോധനയായി ‘എന്റെ ദൈവമേ, എന്റെ പാറയേ’ എന്നു നൽകി.
  alternative: ‘എന്റെ പാറയുടെ ദൈവമേ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ ഘടന.
  rationale: വിശേഷണനിരയും നേരിട്ടുള്ള അഭിസംബോധനയും മലയാളത്തിൽ സ്വാഭാവികമാക്കുമ്പോഴും യഥാർഥ ഘടനാപരമായ ബദൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തേണ്ടതുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഭാഷ. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലത്തിലെ വിശേഷണനിരയും മൂർത്തരൂപകങ്ങളും നിലനിർത്തിയപ്പോൾ അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി.
