id: 2SA.22.43
reference: 2 Samuel 22:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶשְׁחָקֵ֖/ם כַּ/עֲפַר אָ֑רֶץ כְּ/טִיט חוּצ֥וֹת אֲדִקֵּ֖/ם אֶרְקָעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/043.yaml
  text: I crushed them like the dust of the earth[a]; like the mud of the streets I pounded them and trampled them down.
translation:
  language: ml
  text: ഞാൻ അവരെ നിലത്തെ പൊടിപോലെ പൊടിച്ചുകളഞ്ഞു; തെരുവുകളിലെ ചെളിപോലെ അവരെ ഇടിച്ചുനുറുക്കി ചവിട്ടിത്താഴ്ത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവരെ അടിച്ചുപരത്തി.” അവസാനത്തെ എബ്രായക്രിയയ്ക്ക് അടിച്ചുപരത്തുക അഥവാ പരത്തിവിടുക എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: ഞാൻ അവരെ... പൊടിച്ചുകളഞ്ഞു
  rationale: שׁחק എന്ന ക്രിയ ഇവിടെ ശത്രുക്കളെ പൊടിപോലെ അതിസൂക്ഷ്മമായി തകർക്കുന്ന ശക്തമായ ദൃശ്യം നൽകുന്നു. ‘പൊടിച്ചുകളഞ്ഞു’ എന്നത് ഉപമയോടു സ്വാഭാവികമായി ചേരുകയും ക്രിയയുടെ തീവ്രത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כַּעֲפַר אָרֶץ
  choice: നിലത്തെ പൊടിപോലെ
  rationale: עפר എന്നത് പൊടി അഥവാ അയഞ്ഞ മണ്ണ് എന്നും ארץ ഇവിടെ നിലം/ഭൂമി എന്നും സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ദൃശ്യം വ്യക്തമായി ലഭിക്കാൻ ‘നിലത്തെ പൊടി’ എന്നു നൽകി.
- source_word: כְּטִיט חוּצוֹת
  choice: തെരുവുകളിലെ ചെളിപോലെ
  rationale: טיט എന്നത് ചെളി എന്നും חוצות നഗരത്തിലെ തെരുവുകൾ അഥവാ പൊതുവിടങ്ങൾ എന്നും അർഥമാക്കുന്നു. ‘തെരുവുകളിലെ ചെളി’ മൂലപാഠത്തിലെ ചവിട്ടിമെതിക്കപ്പെടുന്ന ദൃശ്യം സ്വാഭാവികമായി പകരുന്നു.
- source_word: אֲדִקֵּם
  choice: അവരെ ഇടിച്ചുനുറുക്കി
  rationale: דקק എന്ന ക്രിയ ചെറുതായി തകർക്കുക, ഇടിച്ചുനുറുക്കുക എന്ന ആശയം നൽകുന്നു. ആദ്യ ക്രിയയുടെ ആവർത്തനമാകാതെ സമാന്തരവാക്യത്തിലെ ശക്തിയും പുരോഗതിയും നിലനിർത്താൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: אֶרְקָעֵם
  choice: ചവിട്ടിത്താഴ്ത്തി
  rationale: רקע എന്ന ക്രിയയ്ക്ക് അടിച്ചുപരത്തുക, ചവിട്ടുക, പരത്തുക എന്നീ ബന്ധമുള്ള അർഥങ്ങൾ വരാം. യുദ്ധസന്ദർഭത്തിലും തെരുവിലെ ചെളിയുടെ ഉപമയിലും ‘ചവിട്ടിത്താഴ്ത്തി’ ഏറ്റവും സ്വാഭാവികമായി ചേരുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. എബ്രായ സമാന്തരഘടനയും ശക്തമായ യുദ്ധദൃശ്യവും നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പദാവർത്തനം ഒഴിവാക്കി.
