  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר דָּוִד֙ לַֽ/יהוָ֔ה אֶת דִּבְרֵ֖י הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/יוֹם֩ הִצִּ֨יל יְהוָ֥ה אֹת֛/וֹ מִ/כַּ֥ף כָּל אֹיְבָ֖י/ו וּ/מִ/כַּ֥ף שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/001.yaml
  text: And David spoke to Yahweh the words of this song on the day when Yahweh delivered him from the hand of all his enemies and from the hand of Saul[a].
translation:
  language: ml
  text: 'യഹ്‌വെ ദാവീദിനെ അവന്റെ സകല ശത്രുക്കളുടെ കൈയിൽനിന്നും ശൗലിന്റെ കൈയിൽനിന്നും വിടുവിച്ച ദിവസം, ദാവീദ് ഈ പാട്ടിന്റെ വാക്കുകൾ യഹ്‌വെയോടു പറഞ്ഞു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘ഈ പാട്ടിന്റെ വാക്കുകൾ’; ഈ രചന ഒരു പാട്ടാണെന്ന് മൂലവാചകം വ്യക്തമായി പരിചയപ്പെടുത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പറഞ്ഞു
  rationale: דבר എന്ന ക്രിയയുടെ സാധാരണ അർഥം ‘സംസാരിക്കുക/പറയുക’ എന്നാണ്. ഉള്ളടക്കം പാട്ടാണെങ്കിലും ‘പാടി’ എന്നു ലളിതമാക്കാതെ എബ്രായവാചകത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: לַיהוָה / יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ പൊതുവേ അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: ഈ പാട്ടിന്റെ വാക്കുകൾ
  rationale: മൂലത്തിലെ ‘വാക്കുകൾ’ എന്നും ‘പാട്ട്’ എന്നും ഉള്ള രണ്ടു ഘടകങ്ങളും സംരക്ഷിക്കുന്ന ഔപചാരികവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: בְּיוֹם
  choice: ദിവസം
  rationale: പാട്ട് പറഞ്ഞ അവസരം സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം; മലയാളത്തിൽ ഉപവാക്യത്തോടു ചേർന്ന ‘ദിവസം’ സ്വാഭാവികമാണ്.
- source_word: הִצִּיל
  choice: വിടുവിച്ചു
  rationale: ശത്രുക്കളുടെ അധികാരത്തിൽനിന്നോ പിടിയിൽനിന്നോ രക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന נצל എന്ന ക്രിയയുടെ സൈനിക-അപകടസന്ദർഭം പ്രകടമാക്കുന്നു.
- source_word: מִכַּף
  choice: കൈയിൽനിന്ന്
  rationale: അക്ഷരാർഥമായ ‘കൈ/ഉള്ളംകൈ’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് അധികാരമോ പിടിയോ എന്ന ആശയം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം നൽകുന്നു.
- source_word: כָּל אֹיְבָיו
  choice: അവന്റെ സകല ശത്രുക്കളുടെയും
  rationale: സമൂഹവാചകത്തിന്റെ പൂർണത സംരക്ഷിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പതിവായ ലിപ്യന്തരണം.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: വാക്യം ഉടമ്പടിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യഹ്‌വെ’ എബ്രായനാമത്തിന്റെ പുനർനിർമിത ഉച്ചാരണത്തോട് അടുത്തതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘പാടി’ എന്നു വ്യാഖ്യാനപരമായി ലളിതമാക്കാതെ ‘പാട്ടിന്റെ വാക്കുകൾ ... പറഞ്ഞു’ എന്ന എബ്രായപ്രയോഗം സംരക്ഷിച്ചിട്ടുണ്ട്; ‘കൈയിൽനിന്ന്’ എന്ന രൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
