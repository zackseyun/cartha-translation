  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യശൈലി. മൂലത്തിലെ ‘ചുവടുകൾ വിശാലമാക്കുക’ എന്ന അസാധാരണമായെങ്കിലും അർഥസമ്പന്നമായ ദൃശ്യപ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; അതിന്റെ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
