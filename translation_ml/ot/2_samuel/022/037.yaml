  text: You widen my steps beneath me[b][a], and my ankles have not given way.
translation:
  language: ml
  text: എനിക്കു കീഴിൽ നീ എന്റെ ചുവടുകൾ വിശാലമാക്കി[a]; എന്റെ കണങ്കാലുകൾ വഴുതിയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ കാവ്യപ്രയോഗം: ഉറപ്പോടെയും തടസ്സമില്ലാതെയും നീങ്ങാൻ വിശാലമായ ഇടം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “എന്റെ കണങ്കാലുകൾ ഇടറിയില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: വിശാലമാക്കി
  rationale: רחב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘വിശാലമാക്കുക’ എന്ന കാരകാർഥം നൽകുന്നു; ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും കാവ്യചിത്രവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: צַעֲדַי
  choice: എന്റെ ചുവടുകൾ
  rationale: צעד എന്ന നാമത്തിന്റെ പ്രാഥമിക അർഥം ‘ചുവട്/കാലടി’ എന്നാണ്. ‘നിലം’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റാതെ എബ്രായത്തിലെ ശരീരചലനചിത്രം സംരക്ഷിക്കുന്നു.
- source_word: תַּחְתֵּנִי
  choice: എനിക്കു കീഴിൽ
  rationale: ‘എന്റെ കീഴിൽ’ എന്ന സ്ഥലബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; ചുവടുകൾക്കായി ഉറപ്പും വിശാലതയും നൽകുന്ന കാവ്യപ്രയോഗമാണിത്.
- source_word: וְלֹא
  choice: ; ... ഇല്ല
  rationale: വാവ് conjunction-ന്റെ സമാന്തരവും സംയോജകവുമായ ബന്ധം അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഉദ്ദേശ്യാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: מָעֲדוּ
  choice: വഴുതിയില്ല
  rationale: מעד എന്ന ക്രിയയുടെ ‘വഴുതുക, ഇടറുക, ആടിപ്പോകുക’ എന്ന അർഥപരിധിയിൽ, കണങ്കാലുകളോടൊപ്പം ‘വഴുതിയില്ല’ സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളമാണ്.
- source_word: קַרְסֻלַּי
  choice: എന്റെ കണങ്കാലുകൾ
  rationale: ഈ നാമം പൊതുവായി കാലുകളെയല്ല, പ്രത്യേകിച്ച് കണങ്കാൽപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ശരീരചിത്രത്തിന്റെ കൃത്യത സംരക്ഷിക്കുന്നു.
