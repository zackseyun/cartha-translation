id: 2SA.22.42
reference: 2 Samuel 22:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יִשְׁע֖וּ וְ/אֵ֣ין מֹשִׁ֑יעַ אֶל יְהוָ֖ה וְ/לֹ֥א עָנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/042.yaml
  text: They cried for help[a], but there was no one to save; they cried to Yahweh, but he did not answer them.
translation:
  language: ml
  text: അവർ സഹായത്തിനായി നിലവിളിച്ചു[a]; എന്നാൽ രക്ഷിക്കാൻ ആരുമുണ്ടായിരുന്നില്ല. അവർ യഹ്‌വേയോടു നിലവിളിച്ചു; എന്നാൽ അവൻ അവർക്കു മറുപടി നൽകിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആദ്യത്തെ എബ്രായക്രിയയുടെ രൂപവും വ്യാഖ്യാനവും ദുഷ്കരമാണ്; ‘അവർ [സഹായത്തിനായി] നോക്കി’ എന്നും മനസ്സിലാക്കാം.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: יִשְׁעוּ
  choice: സഹായത്തിനായി നിലവിളിച്ചു
  rationale: സന്ദർഭവും തുടർന്നുള്ള ‘രക്ഷിക്കാൻ ആരുമുണ്ടായിരുന്നില്ല’ എന്ന സമാന്തരവാക്യവും ഇത് വിടുതലിനായുള്ള വ്യാകുലമായ അപേക്ഷയാണെന്നു സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘സഹായത്തിനായി’ ചേർത്തു.
- source_word: וְאֵין
  choice: എന്നാൽ ... ആരുമുണ്ടായിരുന്നില്ല
  rationale: വാവ് സംയോജകമാണെങ്കിലും അപേക്ഷ പരാജയപ്പെട്ടതിലുള്ള വിരോധഭാവം മലയാളത്തിൽ ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מֹשִׁיעַ
  choice: രക്ഷിക്കാൻ ആരും
  rationale: ഇവിടെയുള്ള കർത്തൃവാചക കൃദ്‌രൂപം രക്ഷിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു. ‘രക്ഷകൻ’ എന്ന സ്ഥാനപ്പേരിനെക്കാൾ സന്ദർഭോചിതവും അനാവശ്യമായ ദൈവശാസ്ത്രാർഥം ഒഴിവാക്കുന്നതുമാണ് ഈ പ്രയോഗം.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വേയോട്
  rationale: אֶל അപേക്ഷ ആരിലേക്കാണ് തിരിഞ്ഞതെന്നു സൂചിപ്പിക്കുന്നു; יְהוָה എന്ന ദൈവനാമം പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וְלֹא עָנָם
  choice: എന്നാൽ അവൻ അവർക്കു മറുപടി നൽകിയില്ല
  rationale: ענה ഇവിടെ മറുപടി നൽകുക എന്നർഥത്തിലാണ്. മുൻപറഞ്ഞ യഹ്‌വേയാണ് ഏകവചന കർത്താവ്; 3-ാം പുരുഷ ബഹുവചന പ്രത്യയം ‘അവർക്ക്’ എന്നു നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാദ്ധ്യമായ ഉച്ചാരണത്തെ ആധാരമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: രണ്ടാം അർധവാക്യത്തിലെ ലുപ്തക്രിയ
  choice: ‘നിലവിളിച്ചു’ എന്നു ആവർത്തിച്ചു
  alternative: ‘യഹ്‌വേയോട്; എന്നാൽ...’ എന്ന അക്ഷരാർഥപരമായ അപൂർണഘടന
  rationale: എബ്രായത്തിൽ ആദ്യക്രിയ രണ്ടാം അഭ്യർഥനയിലും മനസ്സിലാക്കപ്പെടുന്നു. അർഥം മാറ്റാതെ സ്വാഭാവികവും പൂർണവുമായ മലയാളത്തിനായി ക്രിയ ആവർത്തിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സമാന്തരഘടന നിലനിർത്തിക്കൊണ്ട്, എബ്രായത്തിൽ രണ്ടാം ഭാഗത്ത് സൂചിതമായിരിക്കുന്ന ക്രിയ മലയാളത്തിൽ വ്യക്തമാക്കി.
