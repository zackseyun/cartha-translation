id: 2SA.22.29
reference: 2 Samuel 22:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי אַתָּ֥ה נֵירִ֖/י יְהוָ֑ה וַ/יהוָ֖ה יַגִּ֥יהַּ חָשְׁכִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/029.yaml
  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
translation:
  language: ml
  text: എന്തെന്നാൽ, യഹ്‌വേ, അങ്ങാണ് എന്റെ വിളക്ക്[a]; യഹ്‌വേ എന്റെ ഇരുട്ടിനെ പ്രകാശിപ്പിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘എന്റെ വിളക്ക്’; ‘എന്റെ വെളിച്ചം’ എന്നും അർഥമാക്കാം. എന്നാൽ എബ്രായപ്രതീകം അമൂർത്തമായ വെളിച്ചത്തേക്കാൾ മൂർത്തമായ വിളക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘യഹ്‌വേ എന്റെ ഇരുട്ടിനു വെളിച്ചം നൽകുന്നു.’
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിന് അടിസ്ഥാനമോ വിശദീകരണമോ നൽകുന്ന ബന്ധകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; അതിനെ കർശനമായി കാരണവാചകമെന്നോ ഊന്നൽവാചകമെന്നോ മാത്രം നിർണയിക്കുന്നില്ല.
- source_word: אַתָּה
  choice: അങ്ങാണ്
  rationale: ദൈവത്തോടുള്ള ഏകവചന നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവികവും ആദരസൂചകവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; പ്രയോഗത്തിലെ ഊന്നൽ ‘ആണ്’ വഴി പ്രകടമാകുന്നു.
- source_word: נֵירִי
  choice: എന്റെ വിളക്ക്
  rationale: നֵיר എന്നത് അമൂർത്തമായ ‘വെളിച്ചം’ എന്നതിലുപരി മൂർത്തമായ വിളക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്; എബ്രായ രൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുർക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיהוָה
  choice: യഹ്‌വേ
  rationale: രണ്ടാം ഉപവാക്യത്തിലും ദൈവനാമത്തിന്റെ ആവർത്തനം നിലനിർത്തി എബ്രായ സമാന്തരഘടന സംരക്ഷിക്കുന്നു; മലയാളത്തിലെ അർധവിരാമം ബന്ധകത്തിന്റെ പ്രവാഹം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: יַגִּיהַּ
  choice: പ്രകാശിപ്പിക്കുന്നു
  rationale: നגה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘വെളിച്ചമുണ്ടാക്കുക/വെളിച്ചം നൽകുക’ എന്ന കാരണാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: חָשְׁכִּי
  choice: എന്റെ ഇരുട്ടിനെ
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ‘ഇരുട്ട്’ എന്ന നാമത്തിന്റെ വ്യക്തിപരവും രൂപകാത്മകവുമായ ശക്തി നിലനിർത്തുന്നു; അത് കഷ്ടതയോ അപകടമോ വിഷാദമോ ആണെന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുർക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ‘എന്റെ ഇരുട്ട്’ എന്ന രൂപകത്തിന്റെ വ്യാഖ്യാനം
  choice: എന്റെ ഇരുട്ട്
  alternative: എന്റെ കഷ്ടത / എന്നെ ചുറ്റിയ ഇരുട്ട്
  rationale: ഇരുട്ട് എന്തിനെ സൂചിപ്പിക്കുന്നു എന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അതിന്റെ ദൈവശാസ്ത്രപരവും അനുഭവപരവുമായ വ്യാപ്തി ചുരുക്കാതെ മൂലരൂപകം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കാവ്യഭാഷയാണ് സ്വീകരിച്ചത്. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലത്തിലെ മൂർത്തമായ ‘വിളക്ക്’ എന്ന പ്രതീകവും ‘എന്റെ ഇരുട്ട്’ എന്ന നിർവചിക്കാത്ത രൂപകവും നിലനിർത്തി; രണ്ട് ഉപവാക്യങ്ങളിലും ദൈവനാമത്തിന്റെ ആവർത്തനവും സംരക്ഷിച്ചു.
