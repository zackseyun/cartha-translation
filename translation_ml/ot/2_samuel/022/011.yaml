id: 2SA.22.11
reference: 2 Samuel 22:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְכַּ֥ב עַל כְּר֖וּב וַ/יָּעֹ֑ף וַ/יֵּרָ֖א עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
translation:
  language: ml
  text: അവൻ ഒരു കെരൂബിന്മേൽ കയറി പറന്നു; കാറ്റിന്റെ ചിറകുകളിന്മേൽ അവൻ പ്രത്യക്ഷനായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാറ്റിന്റെ ചിറകുകളിന്മേൽ അവൻ കാണപ്പെട്ടു.” എബ്രായ ക്രിയയെ “കാണപ്പെട്ടു” എന്നും “പ്രത്യക്ഷനായി” എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: കയറി
  rationale: רכב എന്ന ക്രിയയുടെ ‘കയറുക/സവാരി ചെയ്യുക’ എന്ന അർഥം നൽകുന്നു; കെരൂബിനോടൊപ്പം ‘കയറി’ എന്നത് സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: עַל
  choice: മേൽ
  rationale: സ്ഥാനമോ ആധാരമോ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: כְּרוּב
  choice: കെരൂബ്
  rationale: എബ്രായ ബൈബിളിലെ അറിയപ്പെടുന്ന സ്വർഗീയ സിംഹാസനജീവിയെ സൂചിപ്പിക്കുന്ന പദം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുന്നു.
- source_word: וַיָּעֹף
  choice: പറന്നു
  rationale: עוף എന്നതിന്റെ ലളിതമായ അർഥം; ‘കുതിച്ചുപറന്നു’ തുടങ്ങിയ അധികഭാവം ചേർക്കുന്നില്ല.
- source_word: וַיֵּרָא
  choice: പ്രത്യക്ഷനായി
  rationale: ראה എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിന് ഇവിടെ ‘കാണപ്പെട്ടു/പ്രത്യക്ഷനായി’ എന്ന അർഥസാധ്യതയുണ്ട്; ദൈവപ്രത്യക്ഷതയുടെ കവിതാത്മക സന്ദർഭത്തിൽ ‘പ്രത്യക്ഷനായി’ സ്വാഭാവികമാണ്, എന്നാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כַּנְפֵי
  choice: ചിറകുകളിന്മേൽ
  rationale: כָּנָף എന്നതിന്റെ ബഹുവചന സംയുക്തരൂപമായ ‘ചിറകുകൾ’ എന്ന ദൃശ്യബിംബം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: רוּחַ
  choice: കാറ്റ്
  rationale: ഈ ദൈവപ്രത്യക്ഷതാസംബന്ധിയായ കവിതാസന്ദർഭത്തിൽ רוּחַ എന്നത് ‘ആത്മാവ്’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ‘കാറ്റ്’ എന്നാണ്.
theological_decisions:
- issue: ദൈവിക യോദ്ധാവിന്റെയും ദൈവപ്രത്യക്ഷതയുടെയും കവിതാത്മക ദൃശ്യഭാഷ
  choice: കെരൂബിന്മേൽ കയറുകയും കാറ്റിന്റെ ചിറകുകളിന്മേൽ പ്രത്യക്ഷനാകുകയും ചെയ്യുന്ന മൂർത്തമായ ദൃശ്യബിംബം നിലനിർത്തി.
  alternative: ദൈവത്തിന്റെ വേഗത്തിലുള്ള വരവിനെ അമൂർത്തമായി വിശദീകരിക്കുക.
  rationale: മൂലപാഠം ദൈവപ്രത്യക്ഷതയെ കവിതാത്മകവും മൂർത്തവുമായ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു; അതിനെ വ്യാഖ്യാനപരമായി ലഘൂകരിക്കാതെ അതേ പിരിമുറുക്കത്തോടെ നിലനിർത്തുന്നു.
- issue: וַיֵּרָא എന്ന ക്രിയയുടെ അർഥം
  choice: പ്രത്യക്ഷനായി
  alternative: കാണപ്പെട്ടു
  rationale: നിഫാൽ രൂപം ഇരു അർഥങ്ങൾക്കും ഇടനൽകുന്നു. പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ ‘പ്രത്യക്ഷനായി’ സ്വീകരിക്കുകയും യഥാർത്ഥ അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘കെരൂബ്’ എന്ന സ്ഥാപിത ബൈബിൾപദവും മൂലത്തിലെ കവിതാത്മക ദൃശ്യവും നിലനിർത്തിയിരിക്കുന്നു.
