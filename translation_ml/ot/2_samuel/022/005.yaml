reference: 2 Samuel 22:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֥י אֲפָפֻ֖/נִי מִשְׁבְּרֵי מָ֑וֶת נַחֲלֵ֥י בְלִיַּ֖עַל יְבַעֲתֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/005.yaml
  text: For the waves of death surrounded me[b][a]; the torrents of worthlessness terrified me.
translation:
  language: ml
  text: എന്തെന്നാൽ, മരണത്തിന്റെ തിരമാലകൾ[b] എന്നെ ചുറ്റിവളഞ്ഞു; ദുഷ്ടതയുടെ പ്രളയപ്രവാഹങ്ങൾ എന്നെ ഭയപ്പെടുത്തി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബെലിയാലിന്റെ പ്രളയപ്രവാഹങ്ങൾ”; בְלִיַּעַל എന്ന പദത്തെ പൊതുനാമത്തിനു പകരം വ്യക്തിനാമമായി എടുത്താൽ.
    reason: alternative_reading
  - marker: b
    text: “തിരമാലകൾ” എന്നത് “പൊട്ടിയടിക്കുന്ന തിരകൾ” അഥവാ “വൻതിരകൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഈ പദ്യത്തിൽ ഇത് മുൻവാക്യത്തിന്റെ വിശദീകരണമോ ഗാനത്തിലെ സംഭവവിവരണമോ അവതരിപ്പിക്കാം. ഒറ്റപ്പെട്ട വാക്യത്തിൽ ‘എന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് അസ്വാഭാവികമായതിനാൽ ബന്ധത്തിന്റെ അർഥം വാക്യക്രമത്തിലൂടെ സൂചിപ്പിച്ചു.
- source_word: אֲפָפֻנִי
  choice: എന്നെ ചുറ്റിവളഞ്ഞു
  rationale: വെറും ചുറ്റിനിൽക്കുന്നതിനെക്കാൾ, എല്ലാഭാഗത്തുനിന്നും വലയംചെയ്ത് ഞെരുക്കുന്ന ഭീഷണി ഈ പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִשְׁבְּרֵי
  choice: തിരമാലകൾ
  rationale: പൊട്ടിയടിക്കുന്ന കടൽത്തിരകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘തിരമാലകൾ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് കൂടുതൽ കൃത്യമായ ഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מָוֶת
  choice: മരണം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി; മരണത്തെ ആഞ്ഞടിക്കുന്ന ജലമായി ചിത്രീകരിക്കുന്ന കാവ്യരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: נַחֲלֵי
  choice: പ്രളയപ്രവാഹങ്ങൾ
  rationale: തോടുകൾ, വാടികൾ, മലവെള്ളപ്പാച്ചിലുകൾ എന്നിവ സൂചിപ്പിക്കാവുന്ന പദമാണിത്. സമാന്തരമായ ഭീഷണിജലത്തിന്റെ ദൃശ്യവും അതിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְלִיַּעַל
  choice: നിഷ്ഫലത
  rationale: ഇവിടെ വ്യക്തിനാമമെന്ന് നിർബന്ധമില്ലാത്ത പൊതുനാമാർഥം നിലനിർത്തുന്നു. ദുഷ്ടതയോ വിനാശമോ നിറഞ്ഞ ശക്തികളെ സൂചിപ്പിക്കുന്ന കാവ്യപരമായ വ്യാപ്തി പൂർണമായി ചുരുക്കുന്നില്ല.
- source_word: יְבַעֲתֻנִי
  choice: എന്നെ ഭയപ്പെടുത്തി
  rationale: പെട്ടെന്നുള്ള കടുത്ത ഭീതിയെ സൂചിപ്പിക്കുന്നു. ‘ഭയപ്പെടുത്തി’ ആധുനികവും വ്യക്തവുമാണ്; സന്ദർഭം അതിന്റെ തീവ്രത വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: בְלִיַּעַל എന്നത് പൊതുനാമമാണോ വ്യക്തിനാമമാണോ
  choice: മുഖ്യപാഠത്തിൽ ‘നിഷ്ഫലത’ എന്ന പൊതുനാമമായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘ബെലിയാൽ’ എന്ന വ്യക്തിനാമം; അല്ലെങ്കിൽ ‘വിനാശം’, ‘ദുഷ്ടത’
  rationale: ഈ പുരാതന കാവ്യസന്ദർഭത്തിൽ പദം നിഷ്ഫലതയെയും ദുഷ്ടതയെയും വിനാശകരമായ ശക്തിയെയും സൂചിപ്പിക്കാം. ‘ബെലിയാൽ’ എന്ന പിൽക്കാല വ്യക്തിവൽക്കരിച്ച അർഥം നിർബന്ധിച്ച് ചേർക്കാതിരിക്കാനും യഥാർഥമായ ദ്വയാർഥസാധ്യത നിലനിർത്താനും വ്യക്തിനാമവായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി. ജലപ്രളയത്തിന്റെ സമാന്തരരൂപകം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
