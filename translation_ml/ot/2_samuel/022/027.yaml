id: 2SA.22.27
reference: 2 Samuel 22:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עִם נָבָ֖ר תִּתָּבָ֑ר וְ/עִם עִקֵּ֖שׁ תִּתַּפָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/027.yaml
  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
translation:
  language: ml
  text: 'നിർമ്മലനോടു നീ നിർമ്മലനായി വെളിപ്പെടുന്നു;

    വക്രനോടോ നീ വളഞ്ഞവനായി വെളിപ്പെടുന്നു[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വക്രനോടു നീ കൗശലത്തോടെ ഇടപെടുന്നു’ അല്ലെങ്കിൽ ‘നീ അവനോട് എതിർത്തുനിൽക്കുന്നു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ അപൂർവവും അർഥനിർണയം ദുഷ്കരവുമാണ്; വക്രനായവനോടു ദൈവം അവന്റെ വക്രതയ്ക്കൊത്തവിധം പ്രതികരിക്കുന്നു എന്ന ആശയമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: നിർമ്മലൻ
  rationale: ഈ വിശേഷണം ശുദ്ധിയെയും കളങ്കമില്ലായ്മയെയും സൂചിപ്പിക്കുന്നു. അതേ ധാതുവിൽനിന്നുള്ള തുടർക്രിയയുമായുള്ള കാവ്യാത്മക പദാവർത്തനം നിലനിർത്താൻ ‘നിർമ്മലൻ’ തിരഞ്ഞെടുത്തു.
- source_word: תִּתָּבָר
  choice: നീ നിർമ്മലനായി വെളിപ്പെടുന്നു
  rationale: ഹിത്പാഎൽ രൂപത്തിന്റെ ആത്മനിർദ്ദേശക ഭാവവും ‘നിർമ്മലൻ’ എന്ന മുൻപദവുമായുള്ള പദാവർത്തനവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: עִקֵּשׁ
  choice: വക്രൻ
  rationale: ധാർമ്മികമായി വളഞ്ഞതും കപടവുമായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘നിർമ്മലൻ’ എന്നതിനോടുള്ള വിരുദ്ധസമാന്തരതയും നിലനിൽക്കുന്നു.
- source_word: תִּתַּפָּל
  choice: നീ വളഞ്ഞവനായി വെളിപ്പെടുന്നു
  rationale: അപൂർവവും അർഥനിർണയം ദുഷ്കരവുമായ ഈ ക്രിയയുടെ നിഷേധാത്മകവും പ്രത്യുത്തരാത്മകവുമായ കാവ്യഭാവം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു. മലയാളത്തിൽ അസാധാരണമായി കേൾക്കുന്നുവെങ്കിലും എബ്രായത്തിലെ ഉദ്ദേശ്യപൂർവമായ ദൈവശാസ്ത്ര സംഘർഷം സംരക്ഷിക്കുന്നു.
- source_word: עִם
  choice: -നോടു
  rationale: ബന്ധപരമായ ‘കൂടെ/അവനോടുള്ള ഇടപാടിൽ’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന വിഭക്തിരൂപം.
theological_decisions:
- issue: വക്രനോടുള്ള ദൈവത്തിന്റെ പ്രതികരണം ദൈവത്തിനുതന്നെ ധാർമ്മിക വക്രത ആരോപിക്കാതെ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: വക്രനോടോ നീ വളഞ്ഞവനായി വെളിപ്പെടുന്നു
  alternative: വക്രനോടു നീ കൗശലത്തോടെ ഇടപെടുന്നു / നീ അവനോട് എതിർത്തുനിൽക്കുന്നു
  rationale: മൂലപാഠത്തിലെ അപൂർവക്രിയയും ഞെട്ടിക്കുന്ന പ്രതിസമാന്തരതയും നേരിട്ട് നിലനിർത്തി, അർഥം ‘കൗശലം’ എന്നു വ്യാഖ്യാനിച്ച് ദൈവശാസ്ത്ര സംഘർഷം നിശ്ശബ്ദമായി പരിഹരിക്കുന്നതു ഒഴിവാക്കി. സാധ്യതയുള്ള വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യശൈലി. രണ്ട് വരികളിലെ സമാന്തരഘടനയും ‘നിർമ്മലൻ/നിർമ്മലനായി’, ‘വക്രൻ/വളഞ്ഞവനായി’ എന്ന പദബന്ധവും സംരക്ഷിച്ചു; അപൂർവക്രിയയിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
