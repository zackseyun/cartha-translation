  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
translation:
  language: ml
  text: ദൈവത്തിന്റെ വഴി കുറ്റമറ്റതാണ്; യഹ്‌വേയുടെ വചനം ശുദ്ധീകരിക്കപ്പെട്ടതാണ്[a]; അവിടുത്തിൽ അഭയം പ്രാപിക്കുന്ന ഏവർക്കും അവിടുന്ന് ഒരു പരിചയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരീക്ഷിക്കപ്പെട്ടതാണ്” അല്ലെങ്കിൽ “തെളിയിക്കപ്പെട്ടതാണ്.” എബ്രായപദം തീയിൽ ലോഹം ശുദ്ധീകരിക്കുന്നതിന്റെ രൂപകം ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: ദൈവത്തെ സംബന്ധിച്ചിടത്തോളം
  rationale: വാക്യാരംഭത്തിലെ വിഷയപ്രാധാന്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘ദൈവം’ നിലനിർത്തുന്നു.
- source_word: תָּמִים
  choice: കുറ്റമറ്റതാണ്
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനരീതി ന്യൂനതയോ ദോഷമോ ഇല്ലാത്തതാണെന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: דַּרְכּוֹ
  choice: അവിടുത്തെ വഴി
  rationale: ‘വഴി’ എന്ന ദൃശ്യരൂപവും ദൈവത്തിന്റെ പ്രവർത്തനരീതി എന്ന സന്ദർഭാർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: אִמְרַת יְהוָה
  choice: യഹ്‌വേയുടെ വചനം
  rationale: אִמְרָה എന്നതിന്റെ ‘വാക്ക്/അരുളപ്പാട്’ എന്ന വിശാലമായ അർഥപരിധി ‘വചനം’ സ്വാഭാവികമായി വഹിക്കുന്നു; ദൈവനാമം ശീർഷകമായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: צְרוּפָה
  choice: ഉരകഴിക്കപ്പെട്ടതാണ്
  rationale: ലോഹം തീയിൽ ശുദ്ധീകരിച്ച് അതിന്റെ ഗുണം തെളിയിക്കുന്ന മൂലഭാഷയിലെ രൂപകം നിലനിർത്തുന്നു; വിശ്വാസ്യത തെളിയിക്കപ്പെട്ടിരിക്കുന്നു എന്ന ഫലാർഥവും സൂചിപ്പിക്കുന്നു.
- source_word: מָגֵן הוּא
  choice: അവിടുന്ന് ഒരു പരിചയാണ്
  rationale: സംരക്ഷണത്തിന്റെ മൂർത്തമായ രൂപകം നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള വിധേയവാക്യം.
- source_word: לְכֹל הַחֹסִים בּוֹ
  choice: അവിടുത്തെ ശരണം പ്രാപിക്കുന്ന ഏവർക്കും
  rationale: חסה എന്ന ക്രിയയിലെ അഭയം തേടുന്ന സംരക്ഷണചിത്രം ‘ശരണം പ്രാപിക്കുക’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; പ്രത്യേക ഉച്ചാരണപരമ്പരയെ അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- issue: צְרוּפָה എന്ന ലോഹശുദ്ധീകരണ രൂപകം
  choice: ഉരകഴിക്കപ്പെട്ടതാണ്
  alternative: പരിശോധിച്ചു തെളിഞ്ഞതാണ് / ശുദ്ധീകരിക്കപ്പെട്ടതാണ്
  rationale: മൂലരൂപകം ദൃശ്യമാക്കി നിലനിർത്തുകയും, വചനം പരീക്ഷയിൽ വിശ്വസനീയമെന്നു തെളിഞ്ഞതെന്ന അർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു; രൂപകത്തെ വെറും അമൂർത്തമായ ‘തെളിയിക്കപ്പെട്ടത്’ എന്നാക്കി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും കവിതാത്മകവുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കുന്നിടത്ത് ആദരസൂചക ഏകവചനരൂപങ്ങൾ ഉപയോഗിച്ചു. സമാന്തരവാക്യഘടനയും പരിച, ശരണം, ലോഹശുദ്ധീകരണം എന്നീ മൂലചിത്രങ്ങളും നിലനിർത്തി.
