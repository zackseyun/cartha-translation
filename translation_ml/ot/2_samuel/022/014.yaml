  yaml_path: translation/ot/2_samuel/022/014.yaml
  text: Yahweh thundered from heaven[a], and the Most High gave his voice.
translation:
  language: ml
  text: യാഹ്‌വെ ആകാശത്തുനിന്ന് ഇടിമുഴക്കി; അത്യുന്നതൻ തന്റെ സ്വരം പുറപ്പെടുവിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
