id: 2SA.22.2
reference: 2 Samuel 22:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר יְהוָ֛ה סַֽלְעִ֥/י וּ/מְצֻדָתִ֖/י וּ/מְפַלְטִ/י לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/002.yaml
  text: 'And he said: “The LORD is my rock and my fortress and my deliverer for me.”'
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “യഹോവ എന്റെ പാറയും എന്റെ കോട്ടയും എനിക്കു വിടുതൽ നൽകുന്നവനുമാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַלְעִי
  choice: എന്റെ പാറ
  rationale: സֶלַע എന്ന പദത്തിന്റെ ഉറച്ച പാറ/പാറക്കെട്ട് എന്ന സംരക്ഷണരൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מְצֻדָתִי
  choice: എന്റെ കോട്ട
  rationale: അഭയവും പ്രതിരോധവും നൽകുന്ന ഉറപ്പുള്ള കോട്ട എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מְפַלְטִי
  choice: എന്റെ വിമോചകൻ
  rationale: അപകടത്തിൽനിന്ന് വിടുവിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപം വ്യക്തിനാമപ്രയോഗമായി നിലനിർത്തുന്നു.
- source_word: לִי
  choice: എനിക്കായുള്ള
  rationale: വാക്യാവസാനത്തിലെ ഹീബ്രു לִי എന്ന ഘടകം ഒഴിവാക്കാതെ, വിമോചകൻ ദാവീദിനുവേണ്ടിയുള്ളവൻ എന്ന ഊന്നൽ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുർവ്യഞ്ജനനാമത്തെ പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുപദവിയായ אֲדֹנָי അല്ല, വ്യക്തിനാമമായ יהוה ആണ്; അതിനാൽ ആ വ്യത്യാസം നിലനിർത്തുന്നു.
- issue: വാക്യാവസാനത്തിലെ לִי യുടെ ഊന്നൽ
  choice: എനിക്കായുള്ള എന്റെ വിമോചകൻ
  alternative: എന്റെ വിമോചകൻ
  rationale: לִי ആവർത്തനപരമായി തോന്നാമെങ്കിലും, അതിനെ ഒഴിവാക്കാതെ മൂലത്തിലെ വ്യക്തിപരമായ ഊന്നലും ചെറിയ അസാധാരണതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ ത്രിതല സംരക്ഷണരൂപകവും അവസാനത്തെ വ്യക്തിപരമായ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
