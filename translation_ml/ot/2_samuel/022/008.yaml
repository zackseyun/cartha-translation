id: 2SA.22.8
reference: 2 Samuel 22:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ו/תגעש וַ/תִּרְעַשׁ֙ הָ/אָ֔רֶץ מוֹסְד֥וֹת הַ/שָּׁמַ֖יִם יִרְגָּ֑זוּ וַ/יִּֽתְגָּעֲשׁ֖וּ כִּֽי חָ֥רָה לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/008.yaml
  text: Then the earth reeled and quaked; the foundations of the heavens trembled and shook, because he was angry.
translation:
  language: ml
  text: അപ്പോൾ ഭൂമി ആടിയുലഞ്ഞു വിറച്ചു; ആകാശത്തിന്റെ അടിസ്ഥാനങ്ങൾ നടുങ്ങി കുലുങ്ങി, കാരണം അവന്റെ കോപം ജ്വലിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּגְעַשׁ
  choice: ആടിയുലഞ്ഞു
  rationale: געש സൂചിപ്പിക്കുന്ന ശക്തമായ ഇളക്കത്തെയും ചാഞ്ചാട്ടത്തെയും സ്വാഭാവികമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: וַתִּרְעַשׁ
  choice: വിറച്ചു
  rationale: רעש എന്ന ഭൂകമ്പസദൃശമായ കുലുക്കത്തെ ആദ്യ ക്രിയയിൽനിന്ന് വേർതിരിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: מוֹסְדוֹת הַשָּׁמַיִם
  choice: ആകാശത്തിന്റെ അടിസ്ഥാനങ്ങൾ
  rationale: ബഹുവചനമായ מוֹסְדוֹת എന്നതും പുരാതന കാവ്യപ്രപഞ്ചചിത്രവും വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: יִרְגָּזוּ וַיִּתְגָּעֲשׁוּ
  choice: നടുങ്ങി കുലുങ്ങി
  rationale: രണ്ട് സമാന്തര ചലനക്രിയകളെയും ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי חָרָה לוֹ
  choice: കാരണം അവന്റെ കോപം ജ്വലിച്ചു
  rationale: חרה എന്നതിലെ ‘ജ്വലിക്കുക’ എന്ന രൂപകം സംരക്ഷിച്ചുകൊണ്ട് കോപത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: കോപത്തിന്റെ കർത്താവ്
  choice: അവന്റെ കോപം ജ്വലിച്ചു
  alternative: അവൻ കോപിച്ചു
  rationale: സന്ദർഭത്തിൽ ദൈവമാണ് സൂചിതനെങ്കിലും, ഈ വാക്യത്തിൽ ദൈവനാമം ചേർക്കാതെ എബ്രായത്തിലെ സർവനാമപരമായ പരാമർശവും കോപം ‘ജ്വലിക്കുന്നു’ എന്ന രൂപകവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ; ആവർത്തിച്ച ചലനക്രിയകളിലൂടെ മൂലത്തിലെ സമാന്തരതയും തീവ്രതയും സംരക്ഷിച്ചു.
