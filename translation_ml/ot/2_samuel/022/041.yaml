id: 2SA.22.41
reference: 2 Samuel 22:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֹ֣יְבַ֔/י תַּ֥תָּה לִּ֖/י עֹ֑רֶף מְשַׂנְאַ֖/י וָ/אַצְמִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/041.yaml
  text: You gave me the necks of my enemies[a]; I destroyed those who hated me.
translation:
  language: ml
  text: എന്റെ ശത്രുക്കളുടെ പിൻകഴുത്ത് നീ എനിക്കു തന്നു[a]; എന്നെ വെറുത്തവരെ ഞാൻ നശിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “എന്റെ ശത്രുക്കളുടെ പിൻകഴുത്ത് നീ എനിക്കു തന്നു.” ശത്രുക്കൾ പിന്തിരിഞ്ഞോടുമാറാക്കിയതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: എന്റെ ശത്രുക്കൾ
  rationale: אֹיֵב എന്ന നാമവും ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും ചേർന്ന് ‘എന്റെ ശത്രുക്കൾ’ എന്നു വ്യക്തമായി അർഥമാക്കുന്നു.
- source_word: תַּתָּה לִּי עֹרֶף
  choice: പിൻകഴുത്ത് നീ എനിക്കു തന്നു
  rationale: עֹרֶף എന്നത് പിൻകഴുത്തിനെയോ കഴുത്തിന്റെ പിൻഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. ശത്രുക്കളെ പിന്തിരിഞ്ഞോടുമാറാക്കുക എന്ന ദൃശ്യാത്മക പ്രയോഗം നിലനിർത്താൻ മൂലഭാഷയോടടുത്ത പരിഭാഷ സ്വീകരിച്ചു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: מְשַׂנְאַי
  choice: എന്നെ വെറുത്തവർ
  rationale: שׂנא എന്ന ക്രിയയുടെ കർത്തൃവാചക രൂപവും ഒന്നാംപുരുഷ പ്രത്യയവും ചേർന്ന് ‘എന്നെ വെറുത്തവർ’ എന്ന അർഥം നൽകുന്നു.
- source_word: וָאַצְמִיתֵם
  choice: ഞാൻ നശിപ്പിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള צמת ഇവിടെ ഇല്ലാതാക്കുക, നാശം വരുത്തുക എന്ന ശക്തമായ അർഥം നൽകുന്നു; ‘നശിപ്പിച്ചു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തുല്യപദമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം. കാവ്യാത്മകമായ മൂലദൃശ്യം നിലനിർത്തിയിരിക്കെ അതിന്റെ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
