  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֶהְיֶ֥ה תָמִ֖ים ל֑/וֹ וָ/אֶשְׁתַּמְּרָ֖/ה מֵ/עֲוֺנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/024.yaml
  text: I was blameless before him[b][a], and I kept myself from my iniquity.
translation:
  language: ml
  text: ഞാൻ അവന്റെ മുമ്പിൽ കുറ്റമറ്റവനായിരുന്നു[a]; എന്റെ അകൃത്യത്തിൽനിന്ന് ഞാൻ എന്നെത്തന്നെ കാത്തുസൂക്ഷിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ അവനോടു സമഗ്രനായിരുന്നു.” എബ്രായ വിശേഷണം കുറ്റാരോപണത്തിൽനിന്നുള്ള മോചനം മാത്രമല്ല, സമഗ്രതയെയോ പൂർണതയെയോ ഊന്നിപ്പറയാം. “അവന്റെ മുമ്പിൽ” എന്നത് ഇവിടെ സന്ദർഭാനുസൃതമായ പ്രയോഗമാണ്; അക്ഷരാർഥത്തിൽ “അവനോടു/അവന്നു” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എന്റെ പാപത്തിൽനിന്ന്/കുറ്റബാധ്യതയിൽനിന്ന് ഞാൻ എന്നെത്തന്നെ കാത്തു.” സന്ദർഭമനുസരിച്ച് എബ്രായ പദത്തിന് അകൃത്യം, പാപം, അല്ലെങ്കിൽ കുറ്റബാധ്യത എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: ഞാൻ … ആയിരുന്നു
  rationale: היה എന്ന ക്രിയയുടെ Qal wayyiqtol രൂപം ഈ കാവ്യവിവരണത്തിൽ ഭൂതകാലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. തുടക്കത്തിലെ ബന്ധകത്തിന്റെ അർഥം മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: תָמִים
  choice: കുറ്റമറ്റവൻ
  rationale: ഈ പദം ധാർമികവും ഉടമ്പടിസംബന്ധവുമായ സന്ദർഭത്തിൽ സമഗ്രത, നിഷ്കളങ്കത, നേരായ നില എന്നിവ സൂചിപ്പിക്കാം. ‘കുറ്റമറ്റവൻ’ ശക്തമായ അവകാശവാദം നിലനിർത്തുന്നു; എന്നാൽ അതിനെ നിർബന്ധമായി സമ്പൂർണ പാപരാഹിത്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: לוֹ
  choice: അവന്റെ മുമ്പിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവനോട്/അവനുവേണ്ടി’ എന്നാകാമെങ്കിലും, ഇവിടെ ദൈവത്തിന്റെ ദൃഷ്ടിയിലെ ബന്ധപരവും വിലയിരുത്തലാത്മകവുമായ നിലയാണ് ഉദ്ദേശിക്കുന്നത്. ‘അവന്റെ മുമ്പിൽ’ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וָאֶשְׁתַּמְּרָה
  choice: ഞാൻ എന്നെത്തന്നെ കാത്തുസൂക്ഷിച്ചു
  rationale: שׁמר എന്ന ക്രിയയുടെ reflexive രൂപം സ്വയം ജാഗ്രതയോടെ കാത്തുകൊള്ളുന്നതിനെ വ്യക്തമാക്കുന്നു. ‘എന്നെത്തന്നെ’ ആ reflexive ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: מֵעֲוֺנִי
  choice: എന്റെ അകൃത്യത്തിൽനിന്ന്
  rationale: עָוֹן എന്ന പദത്തിന് അകൃത്യം, പാപം, കുറ്റബാധ്യത എന്നിവ സൂചിപ്പിക്കാം. ‘അകൃത്യം’ അതിന്റെ ധാർമിക ഗൗരവവും ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ വാക്കുകൾ സമ്പൂർണ പാപരാഹിത്യത്തെ അവകാശപ്പെടുന്നുണ്ടോ
  choice: ദൈവത്തിന്റെ മുമ്പിലുള്ള സമഗ്രതയുടെയും കുറ്റമറ്റ നടപ്പിന്റെയും ശക്തമായ അവകാശവാദമായി പരിഭാഷപ്പെടുത്തി; സമ്പൂർണ പാപരാഹിത്യം എന്ന് വ്യക്തമാക്കിയില്ല
  alternative: സമ്പൂർണ ധാർമിക പരിപൂർണതയുടെ അവകാശവാദമായി വ്യാഖ്യാനിക്കുക
  rationale: תָמִים എന്ന പദം സമഗ്രതയെയും കുറ്റമറ്റ നിലയെയും സൂചിപ്പിക്കാമെങ്കിലും, നിർബന്ധമായി ഒരിക്കലും പാപം ചെയ്തിട്ടില്ലെന്ന അർഥം ആവശ്യപ്പെടുന്നില്ല. മൂലപാഠത്തിലെ ശക്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും ഒരുപോലെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. കാവ്യത്തിന്റെ സംക്ഷിപ്തതയും ഒന്നാംപുരുഷ സാക്ഷ്യത്തിന്റെ ശക്തിയും reflexive ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
