source:
  edition: WLC
  text: מְהֻלָּ֖ל אֶקְרָ֣א יְהוָ֑ה וּ/מֵ/אֹיְבַ֖/י אִוָּשֵֽׁעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/004.yaml
  text: I call on Yahweh[a], who is worthy of praise, and I am saved from my enemies.
translation:
  language: ml
  text: സ്തുതിക്ക് അർഹനായ യഹ്‌വേയെ[a] ഞാൻ വിളിച്ചപേക്ഷിക്കുന്നു; എന്റെ ശത്രുക്കളിൽനിന്ന് ഞാൻ രക്ഷിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സ്തുതിക്കപ്പെട്ടവനായ’ അല്ലെങ്കിൽ ‘സ്തുതിക്കപ്പെടേണ്ടവനായ.’ ഹീബ്രു കർമണി കൃത്ത് യഹ്‌വെയെ സ്തുതിക്കപ്പെടുന്നവനായോ സ്തുതിക്ക് അർഹനായോ വിശേഷിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: സ്തുതിക്കപ്പെടേണ്ടവനായ
  rationale: הלל എന്ന ധാതുവിന്റെ പുഅൽ കർമണി വർത്തമാനകൃത്ത് ഇവിടെ യഹ്‌വെയെ വിശേഷിപ്പിക്കുന്നു. ‘സ്തുതിക്കപ്പെടേണ്ടവനായ’ എന്നത് കർമണിരൂപവും ‘സ്തുതിക്ക് അർഹൻ’ എന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶקְרָא
  choice: ഞാൻ വിളിച്ചപേക്ഷിക്കുന്നു
  rationale: ദൈവനാമത്തോടൊപ്പം קרא എന്ന ക്രിയയ്ക്ക് പ്രാർത്ഥനാപൂർവം വിളിക്കുക, സഹായത്തിനായി അഭയം തേടുക എന്ന അർഥമുണ്ട്. ‘വിളിച്ചപേക്ഷിക്കുന്നു’ ഈ സന്ദർഭത്തിലെ ആഹ്വാനഭാവം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ മലയാള ലിപ്യന്തരണമായി ‘യഹ്‌വെ’ ഉപയോഗിക്കുന്നു.
- source_word: וּמֵאֹיְבַי
  choice: എന്റെ ശത്രുക്കളിൽനിന്ന്
  rationale: מִן വേർപാടിന്റെയോ വിടുതലിന്റെ ഉറവിടത്തിന്റെയോ അർഥം നൽകുന്നു; മൂലപാഠത്തിലില്ലാത്ത ‘കൈയിൽനിന്ന്’ പോലുള്ള വിപുലീകരണം ചേർക്കുന്നില്ല.
- source_word: אִוָּשֵׁעַ
  choice: ഞാൻ രക്ഷിക്കപ്പെടുന്നു
  rationale: ישׁע എന്ന ധാതുവിന്റെ നിഫാൽ അപൂർണക്രിയാരൂപം രക്ഷിക്കപ്പെടുക എന്ന കർമണി അർഥം നൽകുന്നു. സ്തോത്രത്തിലെ ആവർത്തിതമോ പൊതുസത്യപരമോ ആയ പ്രസ്താവനയായി വർത്തമാനകാലം യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു; ‘യഹോവ’ എന്ന പാരമ്പര്യ സംയോജിത ഉച്ചാരണത്തിന് പകരം ഹീബ്രു നാമത്തിന്റെ അംഗീകൃത രൂപത്തോട് അടുത്ത ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: אִוָּשֵׁעַ എന്ന അപൂർണക്രിയയുടെ കാലഭാവം
  choice: ഞാൻ രക്ഷിക്കപ്പെടുന്നു
  alternative: ഞാൻ രക്ഷിക്കപ്പെടും
  rationale: ഹീബ്രു അപൂർണക്രിയയ്ക്ക് ഇവിടെ ആവർത്തിത വർത്തമാനമോ പ്രതീക്ഷിത ഭാവിയോ സൂചിപ്പിക്കാനാകും. ഗാനത്തിന്റെ സാക്ഷ്യസ്വഭാവവും സമാന്തരമായ ആഹ്വാനവും പരിഗണിച്ച് ആവർത്തിത വർത്തമാനം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ഭാവികാലസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കവിതാസാന്ദ്രത നിലനിർത്താൻ രണ്ടു സമാന്തര ഉപവാക്യങ്ങൾ അർധവിരാമത്തോടെ ബന്ധിപ്പിച്ചു. ഈ ചെറുവാക്യത്തിൽ അനിവാര്യമായ വിശദീകരണ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
