id: 2SA.22.13
reference: 2 Samuel 22:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/נֹּ֖גַהּ נֶגְדּ֑/וֹ בָּעֲר֖וּ גַּחֲלֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/013.yaml
  text: From the brightness before him[a], coals of fire blazed forth.
translation:
  language: ml
  text: അവന്റെ മുമ്പിലെ പ്രഭയിൽനിന്ന്[a] തീക്കനലുകൾ ജ്വലിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവന്റെ മുമ്പിലെ തേജസ്സിൽനിന്ന് ജ്വലിക്കുന്ന കനലുകൾ ആളിക്കത്തി.’'
    reason: נֹגַהּ എന്നതിന് ‘പ്രഭ’ എന്നതിനുപകരം ‘തേജസ്സ്’ എന്നും, בָּעֲרוּ എന്നതിന് ‘ആളിക്കത്തി’ എന്നും നൽകാവുന്ന പദപരമായ മറ്റൊരു സാധ്യത രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: പ്രഭയിൽനിന്ന്
  rationale: נֹגַהּ എന്നത് പ്രഭ, തേജസ്സ്, പ്രകാശം എന്നിവയെ സൂചിപ്പിക്കുന്നു; മִן ഉറവിടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യിൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി. ദൈവപ്രത്യക്ഷത്തിന്റെ കാവ്യാത്മക ദൃശ്യത്തിന് ‘പ്രഭ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: נֶגְדּוֹ
  choice: അവന്റെ മുമ്പിലെ
  rationale: נֶגֶד + മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം ‘അവന്റെ മുമ്പിൽ/മുന്നിൽ’ എന്ന സ്ഥലപരമായ ആശയം നൽകുന്നു. മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിനായി ‘അവന്റെ മുമ്പിലെ പ്രഭ’ എന്നു ചേർത്തു.
- source_word: בָּעֲרוּ
  choice: ജ്വലിച്ചുയർന്നു
  rationale: בער എന്ന ക്രിയ കത്തുക, ജ്വലിക്കുക എന്നർത്ഥം നൽകുന്നു. സന്ദർഭത്തിലെ സജീവമായ കാവ്യചിത്രവും ഉറവിടത്തിൽനിന്നുള്ള പ്രത്യക്ഷപ്പെടലിന്റെ സൂചനയും സ്വാഭാവികമായി പകർത്താൻ ‘ജ്വലിച്ചുയർന്നു’ തിരഞ്ഞെടുത്തു; വ്യക്തമായ അധിക കാരണകർത്താവിനെ ചേർത്തിട്ടില്ല.
- source_word: גַּחֲלֵי אֵשׁ
  choice: തീക്കനലുകൾ
  rationale: ‘തീയുടെ കനലുകൾ’ എന്ന ഘടനയുടെ അർത്ഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്ന മലയാളപ്രയോഗമാണ് ‘തീക്കനലുകൾ’; അഗ്നിമയമായ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവപ്രത്യക്ഷത്തിന്റെ ദൃശ്യവും സൂചിതമായ കർത്താവും
  choice: പ്രഭയിൽനിന്ന് തീക്കനലുകൾ ജ്വലിച്ചുയരുന്നതായി അവതരിപ്പിച്ചു; ദൈവം അവയെ കത്തിച്ചു എന്ന അധിക കാരണവാചകം ചേർത്തില്ല.
  alternative: ‘അവന്റെ പ്രഭ തീക്കനലുകളെ ജ്വലിപ്പിച്ചു’ എന്ന കാരണാത്മക വായന.
  rationale: എബ്രായവാക്യം കാവ്യാത്മകവും സങ്കുചിതവുമാണ്. അതിൽ വ്യക്തമല്ലാത്ത കാരണബന്ധം കൂട്ടിച്ചേർക്കാതെ ദൈവപ്രത്യക്ഷത്തിന്റെ ദൃശ്യം അതിന്റെ നിലയിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി. മൂലത്തിലെ സ്ഥലബന്ധവും ദൈവപ്രത്യക്ഷത്തിന്റെ ശക്തമായ അഗ്നിദൃശ്യവും സംരക്ഷിച്ചിരിക്കുന്നു.
