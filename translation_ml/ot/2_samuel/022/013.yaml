    issue: ‘ജ്വലിച്ചുയർന്നു’ introduces upward movement.
    rationale: The verb בָּעֲרוּ means ‘burned’ or ‘blazed.’ While English ‘blazed forth’ can poetically suggest emergence, Malayalam ‘ഉയർന്നു’ specifically means ‘rose,’ adding an image absent from the Hebrew.
  revised_text: അവന്റെ മുമ്പിലെ പ്രഭയിൽനിന്ന്[a] തീക്കനലുകൾ ജ്വലിച്ചു.
