id: 2SA.22.50
reference: 2 Samuel 22:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַל כֵּ֛ן אוֹדְ/ךָ֥ יְהוָ֖ה בַּ/גּוֹיִ֑ם וּ/לְ/שִׁמְ/ךָ֖ אֲזַמֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/050.yaml
  text: Therefore I will praise you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: ml
  text: അതുകൊണ്ട്, യഹ്‌വേ, ജനതകളുടെ മധ്യേ ഞാൻ അങ്ങയെ സ്തുതിക്കും[a]; അങ്ങയുടെ നാമത്തിനു ഞാൻ സ്തുതിഗാനം പാടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങേക്കു നന്ദി പറയും.”
    reason: എബ്രായ ക്രിയയ്ക്ക് ‘സ്തുതിക്കുക’ എന്നും ‘നന്ദി പറയുക’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരിച്ച വിടുതലിൽനിന്നുള്ള നിഗമനമോ ഫലമോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: אוֹדְךָ
  choice: ഞാൻ അങ്ങയെ സ്തുതിക്കും
  rationale: ידה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ഈ സന്ദർഭത്തിൽ ‘സ്തുതിക്കുക’, ‘നന്ദി പറയുക’ എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥങ്ങളുണ്ട്. അടുത്ത വരിയിലെ ‘സ്തുതിപാടും’ എന്ന സമാന്തരപ്രയോഗത്തോട് ‘സ്തുതിക്കും’ നന്നായി യോജിക്കുന്നു; ‘നന്ദി പറയും’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ പ്രചാരത്തിലുള്ള ശബ്ദലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בַּגּוֹיִם
  choice: ജനതകളുടെ മധ്യേ
  rationale: גּוֹיִם ഇവിടെ ഇസ്രായേലിനു പുറത്തുള്ള ജനസമൂഹങ്ങളുൾപ്പെടെയുള്ള ജനതകളെ വിശാലമായി സൂചിപ്പിക്കുന്നു. ‘വിജാതീയർ’ എന്നത് ആവശ്യത്തിലധികം സാങ്കേതികമോ പിന്നീടുള്ള മതപരമായ അർഥഭാരമുള്ളതോ ആകാം.
- source_word: וּלְשִׁמְךָ
  choice: അങ്ങയുടെ നാമത്തിനു
  rationale: לְ എന്ന ബന്ധസൂചകത്തിന്റെ ദിശാബോധവും ‘നാമം’ എന്ന എബ്രായപ്രയോഗവും നിലനിർത്തി, ദൈവത്തിന്റെ വെളിപ്പെട്ട വ്യക്തിത്വവും കീർത്തിയും ഉൾക്കൊള്ളുന്ന ഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: אֲזַמֵּר
  choice: ഞാൻ സ്തുതിപാടും
  rationale: זמר എന്ന ധാതുവിന്റെ പീയേൽ രൂപം സംഗീതത്തോടെ പാടുകയോ സ്തുതിപാടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സ്തുതിപാടും’ എന്നത് ആരാധനാപരമായ അർഥവും കാവ്യസമാന്തരതയും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു. ഇതിലൂടെ വാക്യത്തിലെ അഭിസംബോധനയുടെ വ്യക്തിപരവും ഉടമ്പടിസംബന്ധവുമായ സ്വഭാവം നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും കാവ്യാത്മകവുമായ മലയാളം. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാവിഭാഗ-സവിശേഷ പദങ്ങൾ ഒഴിവാക്കി.
