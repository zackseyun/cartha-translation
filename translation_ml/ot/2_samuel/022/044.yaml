id: 2SA.22.44
reference: 2 Samuel 22:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/תְּפַלְּטֵ֔/נִי מֵ/רִיבֵ֖י עַמִּ֑/י תִּשְׁמְרֵ֨/נִי֙ לְ/רֹ֣אשׁ גּוֹיִ֔ם עַ֥ם לֹא יָדַ֖עְתִּי יַעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
translation:
  language: ml
  text: എന്റെ ജനത്തിന്റെ കലഹങ്ങളിൽനിന്ന് നീ എന്നെ വിടുവിച്ചു[a]; ജനതകളുടെ തലവനായി നീ എന്നെ നിലനിർത്തി[b]; ഞാൻ അറിയാതിരുന്ന ഒരു ജനം എന്നെ സേവിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ ജനത്തിന്റെ തർക്കങ്ങളിൽനിന്ന്.’ സ്വന്തം ജനത്തിനുള്ളിലെ കലഹങ്ങളെയോ അവരുമായി ബന്ധപ്പെട്ട സംഘർഷങ്ങളെയോ ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ജനതകളുടെ മേൽ അധിപനായി നീ എന്നെ കാത്തു.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഞാൻ അറിയാതിരുന്ന ഒരു ജനം എന്നെ സേവിക്കും.’ കാവ്യസന്ദർഭത്തിൽ ഹീബ്രു അപൂർണ്ണക്രിയാരൂപത്തിന് ഭാവികാലസൂചന ഉണ്ടാകാം.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  choice: നീ എന്നെ വിടുവിച്ചു
  rationale: פלט എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഒരാളെ അപകടത്തിൽനിന്നോ എതിർപ്പിൽനിന്നോ രക്ഷപ്പെടുത്തി പുറത്തുകൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. സങ്കീർത്തനാത്മകമായ ദൈവിക രക്ഷയുടെ ആശയം സ്വാഭാവികമായി നൽകാൻ ‘വിടുവിച്ചു’ അനുയോജ്യമാണ്.
- source_word: מֵרִיבֵי עַמִּי
  choice: എന്റെ ജനത്തിന്റെ കലഹങ്ങളിൽനിന്ന്
  rationale: רִיב എന്ന പദത്തിന് കലഹം, തർക്കം, വ്യവഹാരം എന്നീ വിശാല അർഥങ്ങളുണ്ട്. ഈ ഘടന ദാവീദിന്റെ സ്വന്തം ജനത്തിനുള്ളിലെ കലഹങ്ങളെയോ അവരുമായി ബന്ധപ്പെട്ട സംഘർഷങ്ങളെയോ സൂചിപ്പിക്കാം; അതിനാൽ അർഥം അനാവശ്യമായി ചുരുക്കാത്ത ‘കലഹങ്ങൾ’ തെരഞ്ഞെടുത്തു.
- source_word: תִּשְׁמְרֵנִי
  choice: നീ എന്നെ കാത്തുസൂക്ഷിച്ചു
  rationale: שׁמר എന്നത് കാക്കുക, സൂക്ഷിക്കുക, നിലനിർത്തുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. ഇവിടെ രാജാവിനെ ജനതകളുടെ തലവനെന്ന നിലയിൽ ദൈവം നിലനിർത്തിയതിനെ ‘കാത്തുസൂക്ഷിച്ചു’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: ജനതകളുടെ തലവനായി
  rationale: רֹאשׁ എന്ന ‘തല’ എന്ന പദം ഇവിടെ അധികാരസ്ഥാനത്തുള്ള തലവൻ എന്ന രൂപകാലങ്കാരപരമായ അർഥത്തിലാണ്. ‘ജനതകളുടെ തലവനായി’ ആ രൂപകത്തിന്റെ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: גּוֹיִם
  choice: ജനതകൾ
  rationale: ഈ രാജകീയ സന്ദർഭത്തിൽ גּוֹיִם ഇസ്രായേലിനു പുറത്തുള്ള രാജ്യജനതകളെയാണ് സൂചിപ്പിക്കുന്നത്. പിൽക്കാല മതപരമായ അർഥഭാരം വരുത്താതെ ‘ജനതകൾ’ അതിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: עַם לֹא יָדַעְתִּי
  choice: ഞാൻ അറിഞ്ഞിട്ടില്ലാത്ത ഒരു ജനം
  rationale: ഏകവചന സമൂഹനാമമായ עַם ‘ഒരു ജനം’ എന്നു പരിഭാഷപ്പെടുത്തി. ידע എന്ന ക്രിയ ഇവിടെ മുൻപരിചയമോ ബന്ധമോ ഇല്ലായ്മയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അറിഞ്ഞിട്ടില്ലാത്ത’ എന്നു നൽകി.
- source_word: יַעַבְדֻנִי
  choice: എന്നെ സേവിച്ചു
  rationale: עבד ഇവിടെ രാജാവിനോടുള്ള രാഷ്ട്രീയ സേവനമോ വിധേയത്വമോ സൂചിപ്പിക്കുന്നു. ഗാനത്തിന്റെ പിന്നോട്ടുനോക്കുന്ന പശ്ചാത്തലത്തിൽ ഭൂതകാലരൂപം യോജിക്കുന്നു; അതേസമയം ഹീബ്രു അപൂർണ്ണക്രിയാരൂപത്തിന്റെ ഭാവികാല സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിദേശജനതകളിന്മേലുള്ള രാജകീയ അധികാരം
  choice: ദാവീദിന്റെ ചരിത്രപരമായ രാജത്വത്തെയും ജനതകളിന്മേലുള്ള ഭരണത്തെയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന ഭാഷ നിലനിർത്തി.
  alternative: പ്രധാനവാക്യത്തിൽ ഇതിനെ നേരിട്ടുള്ള മിശിഹാ പ്രവചനമായി വികസിപ്പിക്കുക.
  rationale: സന്ദർഭത്തിൽ ഇത് ദാവീദിന്റെ വിടുതലിന്റെയും രാജത്വത്തിന്റെയും ഗാനമാണ്. വിശാലമായ കാനോനിക വായനയിൽ മാതൃകാപരമോ മിശിഹാസംബന്ധമോ ആയ പ്രാധാന്യം കാണാമെങ്കിലും, വിവർത്തനം ഹീബ്രു വാക്യത്തിന്റെ അടിയന്തരമായ ചരിത്രസന്ദർഭത്തിൽ വ്യാഖ്യാനം ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യഗദ്യം ഉപയോഗിച്ചു. ‘കലഹങ്ങൾ,’ ‘തലവൻ,’ ‘സേവിച്ചു’ എന്നീ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ തെരഞ്ഞെടുത്തു; നിയമപരമായ തർക്കം, രാഷ്ട്രീയ വിധേയത്വം, ക്രിയാകാലം എന്നിവയിലെ യഥാർഥ ഹീബ്രു അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
