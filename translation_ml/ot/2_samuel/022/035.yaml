reference: 2 Samuel 22:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מְלַמֵּ֥ד יָדַ֖/י לַ/מִּלְחָמָ֑ה וְ/נִחַ֥ת קֶֽשֶׁת נְחוּשָׁ֖ה זְרֹעֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/035.yaml
  text: He trains my hands for battle[b][a], and my arms can bend a bow of bronze.
translation:
  language: ml
  text: അവൻ എന്റെ കൈകളെ യുദ്ധത്തിന്[a] പരിശീലിപ്പിക്കുന്നു; എന്റെ ഭുജങ്ങളാൽ വെങ്കലവില്ലു വളയുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പോരാട്ടത്തിന്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്റെ ഭുജങ്ങൾ വെങ്കലവില്ലു വളയ്ക്കുന്നു.’ ഹീബ്രായിൽ വെങ്കലവില്ല് എന്റെ ഭുജങ്ങളാൽ, അഥവാ അവയ്ക്കു കീഴിൽ, വളയുന്നതായാണ് പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלַמֵּד
  choice: പരിശീലിപ്പിക്കുന്നു
  rationale: למד എന്ന ധാതുവിന്റെ പങ്കാളിത്തരൂപം പഠിപ്പിക്കൽ/പരിശീലിപ്പിക്കൽ എന്ന ആശയം നൽകുന്നു; യുദ്ധസന്ദർഭത്തിൽ പ്രായോഗികമായ ആയുധപരിശീലനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത് ‘പരിശീലിപ്പിക്കുന്നു’ എന്നതാണ്.
- source_word: יָדַי
  choice: എന്റെ കൈകളെ
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; ശരീരസംബന്ധമായ ദൃശ്യബിംബം പൊതുവായ ‘എന്നെ’ എന്നാക്കി മാറ്റുന്നില്ല.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധത്തിന്
  rationale: מִלְחָמָה യുദ്ധം, പോരാട്ടം എന്നീ അർഥങ്ങൾക്കു വരാം. ആധുനിക മലയാളത്തിൽ ഈ സാഹചര്യത്തിന് ‘യുദ്ധത്തിന്’ സ്വാഭാവികവും വിശാലവുമായ പദമാണ്.
- source_word: וְנִחַת
  choice: വളയ്ക്കുന്നു
  rationale: ദൈവം നൽകുന്ന ശക്തിയിൽ വില്ല് ഭുജങ്ങൾക്കു കീഴിൽ വളയുന്നതാണ് പ്രയോഗത്തിന്റെ ഫലം. മലയാളത്തിൽ സജീവരൂപം സ്വാഭാവികമായതിനാൽ ‘എന്റെ ഭുജങ്ങൾ ... വളയ്ക്കുന്നു’ എന്നു നൽകി; ഹീബ്രായിയിലെ രൂപസംബന്ധമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: קֶשֶׁת
  choice: വില്ലു
  rationale: ആയുധത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം; ചേർന്ന പ്രയോഗത്തിൽ ‘വെങ്കലവില്ലു’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: נְחוּשָׁה
  choice: വെങ്കല
  rationale: נְחוּשָׁה ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം; ശക്തമായ ലോഹവില്ലിന്റെ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ ധാരണ ‘വെങ്കലം’ നിലനിർത്തുന്നു.
- source_word: זְרֹעֹתַי
  choice: എന്റെ ഭുജങ്ങൾ
  rationale: ‘കൈകൾ’ എന്ന ആദ്യപാദത്തിലെ ശരീരബിംബത്തോടു സമാന്തരമായി നിൽക്കുന്ന ബഹുവചനം നിലനിർത്തുന്നു; ശക്തിയുടെ കേന്ദ്രമെന്ന ഭാവവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യുദ്ധശേഷിയിലെ ദൈവിക പ്രവർത്തനം
  choice: പ്രസംഗകൻ തന്റെ യുദ്ധപരിശീലനവും ശാരീരികശക്തിയും ദൈവത്തിൽനിന്നുള്ളതാണെന്നു സമ്മതിക്കുന്ന ചരിത്രസന്ദർഭം നിലനിർത്തി.
  alternative: ഇത് എല്ലാ വിശ്വാസികളുടെയും ആത്മീയപോരാട്ടത്തെക്കുറിച്ചുള്ള പൊതുപ്രസ്താവനയായി വ്യാഖ്യാനിക്കുക.
  rationale: സമീപസന്ദർഭം ദാവീദിന്റെ യഥാർഥ ശത്രുക്കളിൽനിന്നുള്ള വിടുതലിനെയും യുദ്ധത്തിലെ ശക്തീകരണത്തെയും കുറിച്ചുള്ള രാജകീയ സ്തോത്രമാണ്; പരിഭാഷ പാഠത്തെ രൂപകവൽക്കരിക്കുകയോ യുദ്ധത്തെക്കുറിച്ചുള്ള വിശാലമായ സിദ്ധാന്തമായി വികസിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: וְנִחַת എന്ന ക്രിയാരൂപത്തിലെ കർത്തൃത്വവും ഭാവവും
  choice: ‘എന്റെ ഭുജങ്ങൾ വെങ്കലവില്ലു വളയ്ക്കുന്നു’ എന്ന സജീവവും സ്വാഭാവികവുമായ വായന മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ‘എന്റെ ഭുജങ്ങളാൽ വെങ്കലവില്ലു വളയ്ക്കപ്പെടുന്നു’ എന്ന കർമണിവായന.
  rationale: ഹീബ്രായിപ്രയോഗം വില്ല് പ്രസംഗകന്റെ ദൈവദത്തമായ ശക്തിക്കു കീഴിൽ വളയുന്ന ഫലത്തെ മുൻനിർത്തുന്നു. മലയാളത്തിലെ സജീവരൂപം അർഥം വ്യക്തമായി നൽകുമ്പോഴും, സാധ്യതയുള്ള കർമണിനിറം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൈകൾ—ഭുജങ്ങൾ’ എന്ന സമാന്തര ശരീരബിംബവും യഥാർഥ യുദ്ധസന്ദർഭവും നിലനിർത്തിയിരിക്കുന്നു; അസ്വാഭാവികമായ കർമണിപ്രയോഗം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി അതിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
