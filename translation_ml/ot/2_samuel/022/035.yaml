  rationale: രണ്ടാംപാദത്തിൽ ഹീബ്രായത്തിലെ നിഫാൽ പ്രയോഗം സംരക്ഷിക്കാൻ വെങ്കലവില്ലിനെ വളയുന്ന വസ്തുവായി മുഖ്യപാഠത്തിൽ നിലനിർത്തി. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘എന്റെ ഭുജങ്ങളാൽ ... വളയുന്നു’ എന്ന ഉപകരണപ്രയോഗം ഉപയോഗിച്ചു. സജീവവായന ഒരു യഥാർഥ വിവർത്തനസാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ നൽകി; പാഠത്തിൽ നേരിട്ട് പറയാത്ത വിശദീകരണം ഒഴിവാക്കി.
