source:
  edition: WLC
  text: כִּ֥י שָׁמַ֖רְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹ֥א רָשַׁ֖עְתִּי מֵ/אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/022.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞാൻ യാഹ്‌വെയുടെ വഴികൾ പാലിച്ചിരിക്കുന്നു; എന്റെ ദൈവത്തിൽനിന്ന് ദുഷ്ടമായി അകന്നുപോയിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ ദൈവത്തോടു ദുഷ്ടത പ്രവർത്തിച്ചിട്ടില്ല.”
    reason: רשע എന്ന ക്രിയയോടുകൂടിയ מִן വേർപാടിനെ (‘നിന്ന്’) സൂചിപ്പിക്കാമെങ്കിലും, ബന്ധപരമായി എതിർപ്പ് (‘എതിരായി/ത്തോട്’) എന്ന അർഥവും നൽകാൻ സാധ്യതയുണ്ട്.
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന കാവ്യാത്മക ബന്ധകമായി സ്വാഭാവികമാണ്.
- source_word: שָׁמַרְתִּי
  choice: ഞാൻ ... പാലിച്ചിരിക്കുന്നു
  rationale: שׁמר എന്നതിന്റെ ‘പാലിക്കുക, പ്രമാണിക്കുക’ എന്ന അർഥവും, പൂർത്തിയായെങ്കിലും ഇപ്പോഴും പ്രസക്തമായ പ്രവർത്തനരീതിയും പ്രകടമാക്കുന്നു.
- source_word: דַּרְכֵי
  choice: വഴികൾ
  rationale: ജീവിതനടപ്പിനെയോ ദൈവം നിർദേശിച്ച പെരുമാറ്റരീതികളെയോ സൂചിപ്പിക്കുന്ന ബഹുവചന രൂപകം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְלֹא רָשַׁעְתִּי
  choice: ദുഷ്ടമായി ... അകന്നുപോയിട്ടില്ല
  rationale: നിഷേധത്തോടൊപ്പം רשע എന്ന ക്രിയയിലെ ധാർമിക കുറ്റത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: מֵאֱלֹהָי
  choice: എന്റെ ദൈവത്തിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ അടിസ്ഥാനമായ വേർപാട്/അകൽച്ചയുടെ അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: רָשַׁעְתִּי מֵאֱלֹהָי എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: എന്റെ ദൈവത്തിൽനിന്ന് ദുഷ്ടമായി അകന്നുപോയിട്ടില്ല
  alternative: എന്റെ ദൈവത്തോടു ദുഷ്ടത പ്രവർത്തിച്ചിട്ടില്ല
  rationale: ക്രിയയിലെ ദുഷ്ടതയുടെ ധാർമിക ഭാവവും מִן സൂചിപ്പിക്കുന്ന അകൽച്ചയും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘ദൈവത്തിനെതിരെ ദുഷ്ടത ചെയ്യുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കാവ്യഗദ്യം. ‘വഴികൾ’ എന്ന മൂലരൂപകവും രണ്ടു സമാന്തര പ്രസ്താവനകളുടെ താളവും നിലനിർത്തിയിരിക്കുന്നു.
