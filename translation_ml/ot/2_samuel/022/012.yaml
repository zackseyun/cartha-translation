  text: וַ/יָּ֥שֶׁת חֹ֛שֶׁךְ סְבִיבֹתָ֖י/ו סֻכּ֑וֹת חַֽשְׁרַת מַ֖יִם עָבֵ֥י שְׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/012.yaml
  text: He made darkness a shelter around him[a], a massing of waters, thick clouds of the skies.
translation:
  language: ml
  text: അവിടുന്ന് അന്ധകാരത്തെ തനിക്കു ചുറ്റുമുള്ള മറകളാക്കി[a]—ജലസഞ്ചയവും ആകാശത്തിലെ കനത്ത മേഘങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവിടുന്ന് തനിക്കു ചുറ്റും അന്ധകാരത്തെ ഒരു മറയാക്കി—ജലത്തിന്റെ കൂടിച്ചേരലും ആകാശത്തിലെ കനത്ത മേഘങ്ങളും.” എബ്രായപാഠം അത്യന്തം കാവ്യാത്മകമാണ്. “ജലസഞ്ചയം” എന്നു പരിഭാഷപ്പെടുത്തിയ അപൂർവപ്രയോഗത്തിന് “ജലത്തിന്റെ കൂടിച്ചേരൽ” എന്നും, കൂടുതൽ വ്യാഖ്യാനാത്മകമായി “ഇരുണ്ട മഴമേഘങ്ങൾ” എന്നും അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁת
  choice: മറയാക്കി
  rationale: שׁית എന്ന ക്രിയയുടെ ‘വെക്കുക/ആക്കുക’ എന്ന അർഥം തുടർന്നുള്ള കാവ്യരൂപകത്തോടു ചേർത്ത് സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: חֹשֶׁךְ
  choice: അന്ധകാരം
  rationale: ദൈവപ്രത്യക്ഷതയെ ചുറ്റിയുള്ള ഇരുളിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: סְבִיבֹתָיו
  choice: തനിക്കു ചുറ്റും
  rationale: ചുറ്റിവളയുന്ന സ്ഥലബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: סֻכּוֹת
  choice: മറ
  rationale: മൂലത്തിൽ ബഹുവചനമായ ‘കുടിലുകൾ/മറകൾ’ എന്നാണ്; ഇവിടെ അന്ധകാരം മറയാകുന്ന രൂപകം സ്വാഭാവികമായി നൽകാൻ ഏകവചന കൂട്ടാർഥം ഉപയോഗിച്ചു.
- source_word: חַשְׁרַת מַיִם
  choice: ജലസഞ്ചയം
  rationale: അപൂർവവും അർഥനിർണയം ദുഷ്കരവുമായ പ്രയോഗത്തിലെ ജലത്തിന്റെ കൂടിച്ചേരൽ/കനത്ത പിണ്ഡം എന്ന കൊടുങ്കാറ്റുചിത്രം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: עָבֵי שְׁחָקִים
  choice: ആകാശത്തിലെ കനത്ത മേഘങ്ങൾ
  rationale: עָבֵי എന്നതിലെ കനത്ത മേഘങ്ങളെയും שְׁחָקִים എന്നതിലെ ആകാശവിതാനത്തെയും വ്യക്തവും കാവ്യാത്മകവുമായ മലയാളത്തിൽ നൽകുന്നു.
