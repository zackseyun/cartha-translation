    issue: The main text uses singular “മറയാക്കി” for plural סֻכּוֹת.
    rationale: Although a collective singular can be defended, the Hebrew explicitly uses a plural, and “മറകളാക്കി” is natural Malayalam that preserves the source form without sacrificing the poetic sense.
