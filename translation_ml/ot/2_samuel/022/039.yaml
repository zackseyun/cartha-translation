  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֲכַלֵּ֥/ם וָ/אֶמְחָצֵ֖/ם וְ/לֹ֣א יְקוּמ֑וּ/ן וַֽ/יִּפְּל֖וּ תַּ֥חַת רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/039.yaml
  text: I consumed them and shattered them[a], and they did not rise[b]; they fell under my feet.
translation:
  language: ml
  text: ഞാൻ അവരെ സംഹരിച്ചു, തകർത്തുകളഞ്ഞു[a]; അവർ എഴുന്നേറ്റില്ല[b]. അവർ എന്റെ കാൽക്കീഴിൽ വീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചതച്ചുകളഞ്ഞു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവർക്ക് എഴുന്നേൽക്കാനായില്ല.’ ഹീബ്രു നേരിട്ട് പറയുന്നത് ‘അവർ എഴുന്നേറ്റില്ല’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲכַלֵּם
  choice: ഞാൻ അവരെ സംഹരിച്ചു
  rationale: אכל എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘തിന്നുക/വിഴുങ്ങുക’ എന്നാണെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ അത് ‘സംഹരിക്കുക, നശിപ്പിക്കുക’ എന്ന വിപുലാർഥം വഹിക്കുന്നു. മലയാളത്തിൽ ‘അവരെ വിഴുങ്ങി’ എന്നത് ഇവിടെ അനാവശ്യമായി അസ്വാഭാവികമാകുന്നതിനാൽ, ശക്തമായ യുദ്ധചിത്രവും സമ്പൂർണ പരാജയവും നിലനിർത്തുന്ന ‘സംഹരിച്ചു’ സ്വീകരിച്ചു.
- source_word: וָאֶמְחָצֵם
  choice: തകർത്തുകളഞ്ഞു
  rationale: מחץ എന്നതിന് ‘തകർക്കുക, ചതയ്ക്കുക, പ്രഹരിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ‘തകർത്തുകളഞ്ഞു’ നിർണായകവും അക്രമാസക്തവുമായ പരാജയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְלֹא יְקוּמוּן
  choice: അവർ എഴുന്നേറ്റില്ല
  rationale: ഹീബ്രു വാചകം കഴിവില്ലായ്മയെക്കാൾ സംഭവഫലമാണ് നേരിട്ട് പ്രസ്താവിക്കുന്നത്. അതിനാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘എഴുന്നേൽക്കാൻ കഴിഞ്ഞില്ല’ എന്ന സാമർഥ്യാർഥം ചേർക്കാതെ ലളിതമായ ഭൂതകാലം നിലനിർത്തി.
- source_word: וַיִּפְּלוּ
  choice: അവർ വീണു
  rationale: נפל എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും കവിതയിലെ ചുരുങ്ങിയ ചലനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: תַּחַת רַגְלָי
  choice: എന്റെ കാൽക്കീഴിൽ
  rationale: പരാജയവും കീഴടക്കലും സൂചിപ്പിക്കുന്ന ദൃശ്യപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ‘കാൽക്കീഴിൽ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: ദാവീദിന്റെ വിജയഗീതത്തിലെ അക്രമാസക്തമായ യുദ്ധചിത്രണം
  choice: സമ്പൂർണ സംഹാരവും കീഴടക്കലും സൂചിപ്പിക്കുന്ന പ്രഥമപുരുഷ ഭാഷ മയപ്പെടുത്താതെ നിലനിർത്തി
  alternative: ‘ഞാൻ അവരെ പൂർണമായി തോൽപ്പിച്ചു’ എന്ന മൃദുവാക്കിയ പരാവർത്തനം
  rationale: ഹീബ്രു പാഠം നാശത്തെയും തകർച്ചയെയും കാൽക്കീഴിലായ പരാജയത്തെയും ശക്തമായ കവിതാഭാഷയിൽ അവതരിപ്പിക്കുന്നു. ആ തീവ്രത ആധുനിക വായനക്കാർക്കായി മയപ്പെടുത്തുന്നത് മൂലപാഠത്തിന്റെ സാക്ഷ്യം ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കവിതാഭാഷയാണ് ഉപയോഗിച്ചത്. വാക്യഘടന ചുരുക്കി യുദ്ധഗീതത്തിന്റെ ശക്തിയും താളവും നിലനിർത്തി; അപൂർവമോ അത്യന്തം സംസ്കൃതവൽക്കരിച്ചതോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
