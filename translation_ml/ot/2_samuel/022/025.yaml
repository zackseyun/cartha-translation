id: 2SA.22.25
reference: 2 Samuel 22:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֧שֶׁב יְהוָ֛ה לִ֖/י כְּ/צִדְקָתִ֑/י כְּ/בֹרִ֖/י לְ/נֶ֥גֶד עֵינָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/025.yaml
  text: And Yahweh repaid me according to my righteousness[b][a], according to my cleanness before his eyes.
translation:
  language: ml
  text: യഹോവ എന്റെ നീതിക്കനുസരിച്ച് എനിക്കു പ്രതിഫലം നൽകി; അവന്റെ കൺമുമ്പിലുള്ള[b] എന്റെ നിർമലതയ്ക്കനുസരിച്ചും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ ശുദ്ധിക്കനുസരിച്ചും.’ എബ്രായപദം നിർമലതയെയോ ശുദ്ധിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ‘അവന്റെ ദൃഷ്ടിയിലുള്ള.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: പ്രതിഫലം നൽകി
  rationale: ഇവിടെ שוב എന്ന ക്രിയ ദൈവം ഒരാളുടെ പ്രവൃത്തിക്കനുസരിച്ച് തിരികെ നൽകുന്നതിനെ, അഥവാ പ്രതിഫലം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തിരികെ നൽകി’ എന്ന അക്ഷരാർഥ പ്രയോഗം മലയാളത്തിൽ എന്താണ് നൽകിയതെന്ന് വ്യക്തമാക്കാതെ വരുന്നതിനാൽ, സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘പ്രതിഫലം നൽകി’ തെരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകി.
- source_word: לִי
  choice: എനിക്ക്
  rationale: ക്രിയയുടെ പരോക്ഷ കർമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כְּצִדְקָתִי
  choice: എന്റെ നീതിക്കനുസരിച്ച്
  rationale: צדקה ഇവിടെ നീതി, നേരായ നില, ധാർമിക സമഗ്രത എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു; כְּ എന്നതിന്റെ മാനദണ്ഡാർഥം ‘അനുസരിച്ച്’ നിലനിർത്തുന്നു.
- source_word: כְּבֹרִי
  choice: എന്റെ നിർമലതയ്ക്കനുസരിച്ച്
  rationale: בֹּר ശുദ്ധിയെയോ നിർമലതയെയോ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ ‘കൈകൾ’ ഇല്ലാത്തതിനാൽ സമാന്തര സങ്കീർത്തനത്തിൽനിന്ന് ആ പദം ചേർത്തിട്ടില്ല.
- source_word: לְנֶגֶד עֵינָיו
  choice: അവന്റെ കൺമുമ്പിലുള്ള
  rationale: ‘അവന്റെ കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന എബ്രായ ദൃശ്യബിംബം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ആശയം ‘അവന്റെ ദൃഷ്ടിയിൽ’ എന്നതാണ്.
theological_decisions:
- issue: ദാവീദിന്റെ നീതിയെയും നിർമലതയെയും കുറിച്ചുള്ള അവകാശവാദം
  choice: ആദ്യപുരുഷത്തിലുള്ള നേരിട്ടുള്ള അവകാശവാദം മയപ്പെടുത്താതെ നിലനിർത്തി.
  alternative: ഇത് ആപേക്ഷികമായ ഉടമ്പടി-വിശ്വസ്തതയാണെന്നോ സമ്പൂർണ പാപരാഹിത്യമല്ലെന്നോ മുഖ്യവാചകത്തിൽ വിശദീകരിക്കുക.
  rationale: എബ്രായ പാഠം ദാവീദിന്റെ നീതിക്കും നിർമലതയ്ക്കും അനുസരിച്ചുള്ള ദൈവിക പ്രതിഫലത്തെ നേരിട്ട് പ്രസ്താവിക്കുന്നു. ദാവീദിന്റെ അറിയപ്പെടുന്ന പാപങ്ങളുമായുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനം തന്നെ പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, എന്നാൽ കാവ്യഗൗരവം നിലനിർത്തുന്ന ശൈലി. ആവർത്തിച്ചുള്ള ‘അനുസരിച്ച്’ എന്ന ഘടനയും ‘കൺമുമ്പിൽ’ എന്ന ദൃശ്യബിംബവും സംരക്ഷിച്ചു.
