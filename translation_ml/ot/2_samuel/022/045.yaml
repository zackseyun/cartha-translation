  text: בְּנֵ֥י נֵכָ֖ר יִתְכַּֽחֲשׁוּ לִ֑/י לִ/שְׁמ֥וֹעַ אֹ֖זֶן יִשָּׁ֥מְעוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/045.yaml
  text: The sons of foreigners come cringing to me[b][a]; at the hearing of the ear they obey me.
translation:
  language: ml
  text: വിദേശികൾ എനിക്കു കപടമായി കീഴടങ്ങുന്നു[a]; അവർ കേട്ടയുടനെ എന്നെ അനുസരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനസ്സില്ലാതെ എനിക്കു കീഴടങ്ങുന്നു.” എബ്രായ ക്രിയയിൽ കപടമോ നിർബന്ധിതമോ ആയ അനുസരണത്തിന്റെ അർഥനിഴലുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: പദശഃ, “ചെവിയുടെ കേൾവിയിൽ”; അതായത്, “കേൾക്കുന്ന ഉടനെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: വിദേശികൾ
  rationale: പദശഃ ‘അന്യദേശത്തിന്റെ മക്കൾ’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ വിദേശജനങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായി ‘വിദേശികൾ’ എന്നു നൽകി.
- source_word: יִתְכַּחֲשׁוּ לִי
  choice: എനിക്കു മുമ്പിൽ കപടമായി കീഴടങ്ങുന്നു
  rationale: כחש എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം നിർബന്ധിതമോ ആത്മാർഥമല്ലാത്തതോ ആയ കീഴടങ്ങൽ/അനുസരണം സൂചിപ്പിക്കാം. ‘കപടമായി’ എന്നത് ആ അർഥനിഴൽ നിലനിർത്തുന്നു; സാധാരണ സ്വമേധയായുള്ള കീഴടങ്ങലായി ഇതിനെ ലഘൂകരിക്കുന്നില്ല.
- source_word: לִשְׁמֹעַ אֹזֶן
  choice: കേട്ടയുടനെ
  rationale: പദശഃ ‘ചെവിയുടെ കേൾവിയിൽ’ എന്ന എബ്രായ പ്രയോഗം കേൾക്കുന്ന ഉടനെ എന്ന അർഥത്തിലാണ്. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: יִשָּׁמְעוּ לִי
  choice: അവർ എന്നെ അനുസരിക്കുന്നു
  rationale: שׁמע എന്ന ക്രിയ לִי-യോടൊപ്പം വരുമ്പോൾ വെറും കേൾവിയല്ല, ശ്രദ്ധിച്ചു അനുസരിക്കൽ എന്ന അർഥം വഹിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. എബ്രായ ശൈലി പദശഃ പകർത്തുന്നതിനേക്കാൾ അതിന്റെ അർഥം സ്വാഭാവികമായി നൽകിയെങ്കിലും, ആത്മാർഥമല്ലാത്ത കീഴടങ്ങലെന്ന പ്രധാന അനിശ്ചിതത്വം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
