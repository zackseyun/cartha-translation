- source_word: עַד כַּלּוֹתָם
  choice: അവർ ഒടുങ്ങുന്നതുവരെ
  rationale: כלה എന്നതിലെ പൂർത്തിയാകുക, തീരുക, നിശ്ശേഷമാകുക എന്നീ അർഥങ്ങൾ സംക്ഷിപ്തമായി ഉൾക്കൊള്ളുന്നു. പ്രത്യയം ക്രിയയുടെ കർത്താവാണോ കർമമാണോ എന്ന സാദ്ധ്യമായ വ്യാകരണദ്വയാർഥത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
