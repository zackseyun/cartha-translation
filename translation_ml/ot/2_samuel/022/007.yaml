  text: בַּ/צַּר לִ/י֙ אֶקְרָ֣א יְהוָ֔ה וְ/אֶל אֱלֹהַ֖/י אֶקְרָ֑א וַ/יִּשְׁמַ֤ע מֵ/הֵֽיכָל/וֹ֙ קוֹלִ֔/י וְ/שַׁוְעָתִ֖/י בְּ/אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
translation:
  language: ml
  text: എന്റെ കഷ്ടതയിൽ ഞാൻ യഹ്‌വെയെ വിളിച്ചു; എന്റെ ദൈവത്തോടു ഞാൻ നിലവിളിച്ചു. അവൻ തന്റെ ആലയത്തിൽനിന്ന്[b] എന്റെ ശബ്ദം കേട്ടു[a]; സഹായത്തിനായുള്ള എന്റെ നിലവിളി അവന്റെ ചെവികളിലെത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ ക്രിയയെ വർത്തമാനകാലത്തിൽ ‘അവൻ കേൾക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം; ഇവിടെ അതിന്റെ ഔപചാരിക വിവരണഭൂതകാലം നൽകിയിരിക്കുന്നു.
    reason: tense_alternative
  - marker: b
    text: ‘ആലയം’ എന്നതിനുള്ള എബ്രായപദം ‘അരമന’ അല്ലെങ്കിൽ ‘വിശുദ്ധമന്ദിരം’ എന്നും അർത്ഥമാക്കാം; ഇവിടെ ദൈവത്തിന്റെ സ്വർഗീയ വാസസ്ഥലം ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: എന്റെ ഞെരുക്കത്തിൽ
  rationale: צַר എന്ന പദത്തിന്റെ ഞെരുക്കം, കഷ്ടത, പ്രതികൂലാവസ്ഥ എന്നീ ആശയങ്ങൾ കവിതാസാന്ദ്രമായി നിലനിർത്തുന്നു.
- source_word: אֶקְרָא ... אֶקְרָא
  choice: ഞാൻ ... വിളിച്ചു; ... ഞാൻ നിലവിളിച്ചു
  rationale: ഒരേ എബ്രായ ക്രിയയുടെ ആവർത്തനം നിലനിർത്തിക്കൊണ്ട്, വ്യത്യസ്ത പൂരകങ്ങളോടുകൂടിയ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהַי
  choice: എന്റെ ദൈവം
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁמַע
  choice: അവൻ ... കേട്ടു
  rationale: എബ്രായ വിവരണക്രിയയുടെ ഔപചാരിക ഭൂതകാലബലം സംരക്ഷിക്കുന്നു.
- source_word: מֵהֵיכָלוֹ
  choice: തന്റെ ആലയത്തിൽനിന്ന്
  rationale: הֵיכָל എന്നത് ആലയം, അരമന, വിശുദ്ധമന്ദിരം എന്നിവയെ സൂചിപ്പിക്കാം; ദൈവത്തിന്റെ വാസസ്ഥാനമെന്ന സന്ദർഭത്തിൽ ‘ആലയം’ സ്വാഭാവികവും അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: קוֹלִי
  choice: എന്റെ ശബ്ദം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שַׁוְעָתִי
  choice: സഹായത്തിനായുള്ള എന്റെ നിലവിളി
  rationale: ദുരിതത്തിൽ സഹായം തേടുന്ന നിലവിളിയെന്ന പദത്തിന്റെ പ്രയോഗബലം വ്യക്തമാക്കുന്നു.
- source_word: בְּאָזְנָיו
  choice: അവന്റെ ചെവികളിലെത്തി
  rationale: ‘അവന്റെ ചെവികളിൽ’ എന്ന എബ്രായ ദൃശ്യബിംബം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: הֵיכָל സൂചിപ്പിക്കുന്ന ദൈവിക വാസസ്ഥലം
  choice: ആലയം
  alternative: അരമന / വിശുദ്ധമന്ദിരം
  rationale: പദത്തിന്റെ ആരാധനാസംബന്ധമായ അനുരണനം നിലനിർത്തുന്നു; അതേസമയം സ്വർഗീയ അരമനയെന്ന സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും കവിതാസ്വഭാവമുള്ളതുമായ ശൈലി. സമാന്തരഘടനയും ദൈവം കേൾക്കുന്നതിന്റെ ദൃശ്യബിംബവും സംരക്ഷിച്ചു.
