source:
  edition: WLC
  text: חַי יְהוָ֖ה וּ/בָר֣וּךְ צוּרִ֑/י וְ/יָרֻ֕ם אֱלֹהֵ֖י צ֥וּר יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/047.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be God, the rock of my salvation.
translation:
  language: ml
  text: 'യഹ്‌വെ ജീവിക്കുന്നു!


    എന്റെ പാറ വാഴ്ത്തപ്പെടട്ടെ!


    എന്റെ രക്ഷയുടെ പാറയായ ദൈവം[a]


    ഉയർത്തപ്പെടട്ടെ!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്നെ രക്ഷിക്കുന്ന പാറയായ ദൈവം’ എന്നും ‘എന്റെ വിടുതലിന്റെ പാറയായ ദൈവം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: יֶשַׁע എന്ന പദത്തിന്റെയും മുഴുവൻ പദബന്ധത്തിന്റെയും സാധുവായ അർത്ഥവ്യത്യാസങ്ങൾ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: യഹ്‌വെ ജീവിക്കുന്നു
  rationale: ക്രിയയില്ലാത്ത എബ്രായ പ്രസ്താവന ഇവിടെ സ്തുതിപൂർവമായ പ്രഖ്യാപനമാണ്; മലയാളത്തിൽ ‘ജീവിക്കുന്നു’ എന്നു നൽകുന്നത് ആ പ്രഖ്യാപനത്തിന്റെ സ്വാഭാവികവും ശക്തവുമായ രൂപമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ, എബ്രായ ഉച്ചാരണത്തെ അടുത്തായി പ്രതിനിധീകരിക്കുന്ന മലയാളലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וּבָרוּךְ
  choice: വാഴ്ത്തപ്പെടട്ടെ
  rationale: സ്തുതിഗീതസന്ദർഭത്തിലെ ആശംസാപൂർവമായ പുകഴ്ത്തൽഭാവം നിലനിർത്തുന്നു; വെറും ‘വാഴ്ത്തപ്പെട്ടവൻ’ എന്ന വിവരണത്തേക്കാൾ സജീവമായ സ്തുതിഘോഷമാണിത്.
- source_word: צוּרִי
  choice: എന്റെ പാറ
  rationale: ദൈവത്തിന്റെ ഉറപ്പും സംരക്ഷണവും സൂചിപ്പിക്കുന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ചു മാറ്റാതെ അതേപടി നിലനിർത്തി.
- source_word: וְיָרֻם
  choice: ഉന്നതനായി വാഴട്ടെ
  rationale: ജസ്സീവ് രൂപത്തിലെ ആശംസയും സ്തുതിഘോഷവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֱלֹהֵי צוּר יִשְׁעִי
  choice: എന്റെ രക്ഷയുടെ പാറയായ ദൈവം
  rationale: കാവ്യസമാന്തര്യം പരിഗണിച്ച് ‘ദൈവം’ എന്നും ‘എന്റെ രക്ഷയുടെ പാറ’ എന്നും സമാനാധികരണമായി വായിച്ചു; രക്ഷ, പാറ എന്നീ പ്രധാന മൂലപദങ്ങളും രൂപകവും നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുവായ പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- issue: צוּר എന്ന ദൈവരൂപകം
  choice: പാറ
  alternative: അഭയം; കോട്ട
  rationale: ദൈവത്തിന്റെ സ്ഥിരതയും സംരക്ഷണവും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ളതിനാൽ വ്യാഖ്യാനപദം പകരംവയ്ക്കാതെ സംരക്ഷിച്ചു.
- issue: אֱלֹהֵי צוּר יִשְׁעִי എന്ന പദബന്ധത്തിന്റെ ബന്ധം
  choice: ‘ദൈവം’ എന്നതിനു സമാനാധികരണമായി ‘എന്റെ രക്ഷയുടെ പാറ’
  alternative: ‘എന്റെ രക്ഷയുടെ പാറയുടെ ദൈവം’ എന്ന കർശന ഘടനാവായന
  rationale: എബ്രായ ഘടനയ്ക്ക് ഔപചാരികമായി ഒന്നിലധികം വായനകൾ സാധ്യമെങ്കിലും, മുൻവരിയിലെ ‘എന്റെ പാറ’ എന്ന സമാന്തരപ്രയോഗവും കാവ്യസന്ദർഭവും സമാനാധികരണവായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; അസ്വാഭാവികമായ മറ്റുവായന പാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ സ്തുതിഗീതത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. എബ്രായത്തിലെ മൂന്ന് സമാന്തര സ്തുതിഘോഷങ്ങൾ വരിവിഭജനത്തിലൂടെ വ്യക്തമാക്കി; ആശംസാഭാവത്തിന് ‘വാഴ്ത്തപ്പെടട്ടെ’, ‘ഉന്നതനായി വാഴട്ടെ’ എന്നീ സ്വാഭാവിക രൂപങ്ങൾ ഉപയോഗിച്ചു.
