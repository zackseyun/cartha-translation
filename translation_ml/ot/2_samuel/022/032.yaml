  rationale: The revision supplies the source connective כִּי and makes the Malayalam wording of the second rhetorical question unambiguously predicative. It preserves the direct metaphor ‘rock,’ the divine name, and the footnoted possibility that ‘Rock’ functions title-like, without deciding that issue in the main text.
