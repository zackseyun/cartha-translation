id: 2SA.22.32
reference: 2 Samuel 22:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֥י מִי אֵ֖ל מִ/בַּלְעֲדֵ֣י יְהוָ֑ה וּ/מִ֥י צ֖וּר מִֽ/בַּלְעֲדֵ֥י אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/032.yaml
  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
translation:
  language: ml
  text: എന്തെന്നാൽ, യഹ്‌വെയല്ലാതെ ദൈവം ആരാണ്? നമ്മുടെ ദൈവമല്ലാതെ പാറയായവൻ ആരാണ്?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മുടെ ദൈവമല്ലാതെ പാറ ആരാണ്?” എബ്രായത്തിൽ “പാറ” ദൈവത്തെക്കുറിച്ച് പതിവായി ഉപയോഗിക്കുന്ന ഒരു രൂപകമാണ്; ചില സന്ദർഭങ്ങളിൽ അത് ഏതാണ്ട് ഒരു സ്ഥാനപ്പേരുപോലെയും പ്രവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: വിവർത്തനത്തിൽ പ്രത്യേകം പദമായി ചേർത്തിട്ടില്ല
  rationale: ഇവിടെ മുൻവാക്യത്തിനുള്ള വിശദീകരണപരമായ ബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. ഒറ്റവാക്യമായി മലയാളത്തിൽ ‘എന്തെന്നാൽ’ എന്നു തുടങ്ങുന്നത് അസ്വാഭാവികമായതിനാൽ, പ്രസംഗസന്ദർഭത്തിൽ ബന്ധം പരോക്ഷമായി നിലനിർത്തുന്നു.
- source_word: מִי
  choice: ആരാണ്
  rationale: വാചാടോപപരമായ ചോദ്യത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אֵל
  choice: ദൈവം
  rationale: ഏകസത്യദൈവത്തെക്കുറിച്ചുള്ള ഈ വാചാടോപപരമായ സന്ദർഭത്തിൽ സാധാരണയും വ്യക്തവുമായ പദം.
- source_word: מִבַּלְעֲדֵי
  choice: അല്ലാതെ
  rationale: ഒഴിവാക്കലും അനന്യതയും മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וּמִי
  choice: ആരാണ്
  rationale: രണ്ടാം സമാന്തരചോദ്യത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘ഉം/കൂടാതെ’ നിർബന്ധമല്ല.
- source_word: צוּר
  choice: പാറ
  rationale: സ്ഥിരത, സുരക്ഷ, സംരക്ഷണം എന്നിവ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന പ്രത്യയം ഉൾപ്പെടെയുള്ള സമൂഹപരവും ഉടമ്പടിപരവുമായ ഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: צוּר സാധാരണ രൂപകമോ ദൈവിക സ്ഥാനപ്പേരോ
  choice: പാറ
  alternative: പാറയായവൻ; പാറ (സ്ഥാനപ്പേരായി)
  rationale: എബ്രായ സമാന്തരഘടനയെയും രൂപകത്തെയും നേരിട്ട് സംരക്ഷിക്കുന്നു; അത് ഔപചാരിക സ്ഥാനപ്പേരാണോ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ. രണ്ട് സമാന്തര വാചാടോപചോദ്യങ്ങളും പാറ എന്ന മൂലരൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
