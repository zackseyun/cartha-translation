reference: 2 Samuel 22:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עִם חָסִ֖יד תִּתְחַסָּ֑ד עִם גִּבּ֥וֹר תָּמִ֖ים תִּתַּמָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/026.yaml
  text: With the faithful you show yourself faithful; with the blameless warrior you show yourself blameless.
translation:
  language: ml
  text: വിശ്വസ്തനോട് അങ്ങ് വിശ്വസ്തത കാണിക്കുന്നു; കുറ്റമറ്റ യോദ്ധാവിനോട് അങ്ങ് കുറ്റമറ്റവനായി പെരുമാറുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד / תִּתְחַסָּד
  choice: വിശ്വസ്തൻ / വിശ്വസ്തത കാണിക്കുന്നു
  rationale: חסד എന്ന പദകുടുംബത്തിലെ ഉടമ്പടി-വിശ്വസ്തതയും ദൃഢമായ ഭക്തിയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; മൂലത്തിലെ പദപ്രയോഗബന്ധവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: גִּבּוֹר
  choice: യോദ്ധാവ്
  rationale: ഇവിടെ പദം ശക്തനായ പുരുഷനെയോ വീരനെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിനും ഇംഗ്ലീഷ് പരിശോധനാപാഠത്തിനും യോജിച്ച സ്വാഭാവികമായ തിരഞ്ഞെടുപ്പാണ് ‘യോദ്ധാവ്’.
- source_word: תָּמִים / תִּתַּמָּם
  choice: കുറ്റമറ്റ / കുറ്റമറ്റവനായി പെരുമാറുന്നു
  rationale: സമഗ്രത, നിഷ്കളങ്കത, കുറ്റമില്ലായ്മ എന്നീ അർത്ഥവ്യാപ്തി ഉൾക്കൊള്ളുന്നു; ഒരേ ഹീബ്രു ധാതുവിലുള്ള നാമവിശേഷണ-ക്രിയ ബന്ധം മലയാളത്തിലും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ പ്രതികരണം മനുഷ്യന്റെ സ്വഭാവത്തോട് സമാന്തരമായി വിവരിക്കുന്നത്
  choice: ‘അങ്ങ് ... കാണിക്കുന്നു/പെരുമാറുന്നു’ എന്ന നേരിട്ടുള്ള സമാന്തരഘടന നിലനിർത്തി
  alternative: ദൈവം മനുഷ്യനു പ്രതിഫലം നൽകുന്നു എന്ന വ്യാഖ്യാനാത്മക പരിഭാഷ
  rationale: മൂലപാഠം ദൈവിക പ്രതികരണത്തെ കാവ്യാത്മകമായി അവതരിപ്പിക്കുന്നു; അതിനെ പ്രതിഫലസിദ്ധാന്തമായി വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമായ സംഘർഷം തീർക്കാതിരിക്കാൻ നേരിട്ടുള്ള ഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവമുള്ള കാവ്യഭാഷ. ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; രണ്ട് സമാന്തര പാദങ്ങളുടെയും ഘടന സംരക്ഷിച്ചു.
