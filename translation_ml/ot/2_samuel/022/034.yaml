  rationale: സ്ത്രീലിംഗ ബഹുവചനം പെൺമാനുകളെ സൂചിപ്പിക്കുന്നു. ഉപമ കാലുകളെ സംബന്ധിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘കാലുകൾ’ ആവർത്തിക്കുന്നത് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בָּמוֹתַי
