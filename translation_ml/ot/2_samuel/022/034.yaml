  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പ്രധാനവായനയിൽ ‘തന്റെ/അവന്റെ കാലുകളെ’ എന്നാണ്. സമാന്തരമായ സങ്കീർത്തനം 18:33-ൽ ‘എന്റെ കാലുകളെ’ എന്നാണ്. ‘പെൺമാനുകൾ’ ചടുലതയുടെയും ഉറച്ച കാൽവയ്പ്പിന്റെയും ഒരു സാധാരണ ചിത്രമാണ്.
    reason: textual_and_lexical_alternative
