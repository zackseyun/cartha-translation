  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘നിൽക്കുമാറാക്കുക/നിർത്തുക’ എന്ന കാരക അർഥം നേരിട്ട് നൽകുന്നു. സുരക്ഷിതത്വം സന്ദർഭത്തിൽ സൂചിതമായിരിക്കാമെങ്കിലും മൂലപദത്തിൽ ഇല്ലാത്ത ആശയം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ആദ്യ പാദത്തിലെ മൂന്നാംപുരുഷ ഉടമസ്ഥപ്രത്യയവും രണ്ടാം പാദത്തിലെ ഒന്നാംപുരുഷ പ്രയോഗവും തമ്മിലുള്ള പിരിമുറുക്ക്
