  rationale: നൽകിയിരിക്കുന്ന WLC സാക്ഷ്യം മൂന്നാംപുരുഷ പ്രത്യയം കാണിക്കുന്നതിനാൽ യഥാർഥ പാഠഭേദമോ വ്യാകരണപിരിമുറുക്കമോ നിശ്ശബ്ദമായി പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. കവിതാഭാവം നിലനിർത്തിക്കൊണ്ട് ലളിതമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘അവന്റെ കാലുകൾ’ എന്ന അസാധാരണത മൂലപാഠസാക്ഷ്യത്തെ മാനിച്ച് നിലനിർത്തുകയും അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്തു.
