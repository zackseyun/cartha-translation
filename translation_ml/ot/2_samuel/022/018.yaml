  language: en
  yaml_path: translation/ot/2_samuel/022/018.yaml
  text: He rescued me from my strong enemy, from those who hated me, for they were too mighty for me.
translation:
  language: ml
  text: ശക്തനായ എന്റെ ശത്രുവിൽനിന്നും എന്നെ വെറുത്തവരിൽനിന്നും അവൻ എന്നെ വിടുവിച്ചു; കാരണം, അവർ എന്നെക്കാൾ ശക്തരായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: അവൻ എന്നെ വിടുവിച്ചു
  rationale: കാവ്യത്തിലെ ഭൂതകാല രക്ഷാപ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵאֹיְבִי עָז
  choice: ശക്തനായ എന്റെ ശത്രുവിൽനിന്നും
  rationale: ഏകവചനമായ ‘എന്റെ ശത്രു’ എന്നതും עָז എന്ന വിശേഷണത്തിന്റെ ‘ശക്തനായ’ എന്ന അടിസ്ഥാന അർഥവും നിലനിർത്തുന്നു.
- source_word: מִשֹּׂנְאַי
  choice: എന്നെ വെറുത്തവരിൽനിന്നും
  rationale: ബഹുവചന കർത്തൃവാചക പങ്കാളിത്തരൂപത്തെ വ്യക്തികളും പ്രവൃത്തിയും പ്രകടമാകുന്ന സ്വാഭാവിക മലയാളമായി നൽകുന്നു.
- source_word: כִּי אָמְצוּ מִמֶּנִּי
  choice: കാരണം, അവർ എന്നെക്കാൾ ശക്തരായിരുന്നു
  rationale: כִּי എന്ന കാരണബന്ധവും താരതമ്യാർഥമുള്ള מִמֶּנִּי എന്നതും നേരിട്ട് സംരക്ഷിക്കുന്നു; ‘എനിക്ക് അതിശക്തരായിരുന്നു’ എന്ന ആശയത്തെ അമിതമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ കാവ്യഗദ്യം. മൂലത്തിലെ ഏകവചന ‘ശത്രു’യും ബഹുവചന ‘വെറുത്തവർ’ എന്ന വ്യത്യാസവും സംരക്ഷിച്ചിരിക്കുന്നു.
