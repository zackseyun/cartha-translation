id: 2SA.24.18
reference: 2 Samuel 24:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֣אמֶר ל֗/וֹ עֲלֵה֙ הָקֵ֤ם לַֽ/יהוָה֙ מִזְבֵּ֔חַ בְּ/גֹ֖רֶן ארניה הַ/יְבֻסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
translation:
  language: ml
  text: 'അന്നു ഗാദ് ദാവീദിന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “നീ കയറിച്ചെന്ന് യെബൂസ്യനായ അരവ്നായുടെ മെതിക്കളത്തിൽ യഹ്‌വേക്കായി ഒരു യാഗപീഠം സ്ഥാപിക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘വരുക’ സ്വാഭാവികമായി പകരുന്നു; ‘പ്രവേശിച്ചു’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ ഇല്ലാത്ത വിശദാംശം ചേരും.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നുതന്നെ
  rationale: ‘ആ ദിവസം’ എന്ന സമയസൂചനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പകരുന്നു.
- source_word: עֲלֵה
  choice: കയറിച്ചെന്ന്
  rationale: עלה എന്ന ആജ്ഞയുടെ മുകളിലേക്കുള്ള ദിശാഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: הָקֵם
  choice: സ്ഥാപിക്കുക
  rationale: קום എന്ന ഹിഫീൽ ആജ്ഞയുടെ ‘നിലനിറുത്തുക/സ്ഥാപിക്കുക’ എന്ന ആശയം യാഗപീഠത്തിന്റെ സന്ദർഭത്തിൽ കൃത്യമായി നൽകുന്നു; ‘പണിയുക’ എന്നതിനെക്കാൾ ക്രിയയുടെ രൂപത്തോട് അടുത്തതാണ്.
- source_word: מִזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയും ആരാധനയും അർപ്പിക്കുന്ന പീഠത്തിനുള്ള പ്രചാരമുള്ളതും വ്യക്തവുമായ മലയാളപദം.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കായി
  rationale: ל എന്ന ഉപസർഗത്തിലെ സമർപ്പണ/ഉദ്ദേശ്യഭാവം ഇവിടെ ‘ക്കായി’ എന്ന് സ്വാഭാവികമായി പകരുന്നു.
- source_word: בְּגֹרֶן
  choice: മെതിക്കളത്തിൽ
  rationale: ധാന്യം മെതിക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന גֹּרֶן എന്ന പദത്തിന് സ്വാഭാവികമായ മലയാളസമം; ב ഇവിടെ സ്ഥലസൂചനയാണ്.
- source_word: ארניה
  choice: അരവ്ന
  rationale: ശമൂവേലിലെ മസോററ്റിക് രൂപത്തെ മലയാളലിപിയിൽ പ്രതിനിധീകരിക്കുന്നു; ദിനവൃത്താന്തത്തിലെ ‘ഒർന്നാൻ’ എന്ന സമാന്തരരൂപം ഇവിടെ പകരുന്നില്ല.
- source_word: הַיְבֻסִי
  choice: യെബൂസ്യനായ
  rationale: അരവ്നയുടെ ജനവിഭാഗപരമായ തിരിച്ചറിയൽ സ്വാഭാവിക മലയാള വിശേഷണരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: לַיהוָה എന്നതിലെ ל ഉപസർഗം
  choice: യഹ്‌വേക്കായി
  alternative: യഹ്‌വേക്കു
  rationale: യാഗപീഠം ദൈവത്തിനായി സമർപ്പിച്ച് സ്ഥാപിക്കുന്നതെന്ന ഉദ്ദേശ്യഭാവം സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നു; ‘യഹ്‌വേക്കു’ എന്ന ദിശാ/സ്വീകർത്തൃഭാവവും വ്യാകരണപരമായി സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കയറിച്ചെന്ന്’ മൂലത്തിലെ ദിശാഭാവം കാത്തുസൂക്ഷിക്കുന്നു; ദൈവനാമം ‘യഹ്‌വേ’ എന്ന വ്യക്തിനാമമായി നൽകുന്നു.
