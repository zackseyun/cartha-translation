revisions:
- from: 'അന്നുതന്നെ ഗാദ് ദാവീദിന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “നീ കയറിച്ചെന്ന് യെബൂസ്യനായ അരവ്നയുടെ മെതിക്കളത്തിൽ യഹ്‌വേക്കായി ഒരു യാഗപീഠം സ്ഥാപിക്കുക.”'
  to: 'അന്നു ഗാദ് ദാവീദിന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “നീ കയറിച്ചെന്ന് യെബൂസ്യനായ അരവ്നായുടെ മെതിക്കളത്തിൽ യഹ്‌വേക്കായി ഒരു യാഗപീഠം സ്ഥാപിക്കുക.”'
  rationale: The revision removes unwarranted temporal emphasis and regularizes the rendering of Araunah's name, while preserving the source's wording, command structure, register, and directional nuance.
