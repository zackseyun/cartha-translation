base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
translation:
  language: ml
  text: 'ജനത്തെ എണ്ണിക്കഴിഞ്ഞപ്പോൾ[a], ദാവീദിന്റെ ഹൃദയം അവനെ പ്രഹരിച്ചു.[b] ദാവീദ് യഹ്‌വേയോടു പറഞ്ഞു: “ഞാൻ വലിയ പാപം ചെയ്തിരിക്കുന്നു. ഇപ്പോൾ, യഹ്‌വേ, അങ്ങയുടെ ദാസന്റെ കുറ്റം[c] ദയവായി നീക്കിക്കളയണമേ; ഞാൻ അത്യന്തം മൂഢമായി പ്രവർത്തിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജനത്തെ കണക്കെടുത്തു കഴിഞ്ഞപ്പോൾ” അല്ലെങ്കിൽ “ജനസംഖ്യാ കണക്കെടുപ്പ് നടത്തിയശേഷം.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായയിൽ അക്ഷരാർഥത്തിൽ “ദാവീദിന്റെ ഹൃദയം അവനെ പ്രഹരിച്ചു”; മനസ്സാക്ഷി അവനെ കുറ്റപ്പെടുത്തിയെന്ന ആശയം പ്രകടിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: cultural_note
  - marker: c
    text: അഥവാ “അങ്ങയുടെ ദാസന്റെ അകൃത്യം.” എബ്രായപദത്തിന് അകൃത്യം, കുറ്റം, ചിലപ്പോൾ പാപത്തിന്റെ ഫലമായ ശിക്ഷ എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: ദാവീദിന്റെ ഹൃദയം അവനെ പ്രഹരിച്ചു
  rationale: ‘ഹൃദയം അവനെ പ്രഹരിച്ചു’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മനസ്സാക്ഷിയുടെ കുറ്റബോധം സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: סָפַר אֶת־הָעָם
  choice: ജനത്തെ എണ്ണിക്കഴിഞ്ഞപ്പോൾ
  rationale: סָפַר എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘എണ്ണുക’ നിലനിർത്തുകയും പ്രവൃത്തിക്കുശേഷമാണ് ഹൃദയം പ്രഹരിച്ചതെന്ന എബ്രായ ക്രമം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ / യഹ്‌വേയ്
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; വിഭക്തിസന്ധിയിൽ ‘യഹ്‌വേയോടു’, സംബോധനയിൽ ‘യഹ്‌വേ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: חָטָאתִי מְאֹד
  choice: ഞാൻ അത്യന്തം പാപം ചെയ്തിരിക്കുന്നു
  rationale: പാപസമ്മതവും מְאֹד എന്ന തീവ്രതാസൂചകവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: הַעֲבֶר נָא
  choice: ദയവായി നീക്കിക്കളയണമേ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ സന്ദർഭോചിതമായ ‘അകറ്റുക/നീക്കുക’ എന്ന അർഥവും נָא സൂചിപ്പിക്കുന്ന വിനീതമായ അപേക്ഷയും വ്യക്തമാക്കുന്നു.
- source_word: עֲוֺן עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസന്റെ കുറ്റം
  rationale: עָוֹן എന്ന പദത്തിന്റെ പാപം, കുറ്റബാധ്യത, ശിക്ഷ എന്നീ ബന്ധമുള്ള അർഥങ്ങളിൽ, ക്ഷമയ്ക്കായുള്ള ഈ അപേക്ഷയിൽ ‘കുറ്റം’ സ്വാഭാവികവും അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: כִּי נִסְכַּלְתִּי מְאֹד
  choice: ഞാൻ അത്യന്തം മൂഢമായി പ്രവർത്തിച്ചിരിക്കുന്നു
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന മൂഢമായ പെരുമാറ്റവും מְאֹד എന്ന തീവ്രതയും ഒരുപോലെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: עָוֹן എന്ന പദത്തിന്റെ സന്ദർഭോചിത അർഥം
  choice: കുറ്റം
  alternative: അകൃത്യം / ശിക്ഷ
  rationale: ദാവീദ് പാപം സമ്മതിച്ച് അത് നീക്കണമെന്നു പ്രാർഥിക്കുന്നതിനാൽ ‘കുറ്റം’ ധാർമ്മിക കുറ്റബാധ്യതയെ പ്രകടമാക്കുന്നു; ശിക്ഷ എന്ന കൂടുതൽ പരിമിതമായ അർഥം പാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ആദരപൂർവവും ഗൗരവമുള്ളതുമായ മലയാളം. ദൈവത്തോടുള്ള സംബോധനയിൽ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു. എബ്രായ ഹൃദയപ്രയോഗം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അതിന്റെ ആശയം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
