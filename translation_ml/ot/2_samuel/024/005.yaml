translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ യാത്രാവിവരണശൈലി. ‘പാളയമിറങ്ങി’ എന്ന പ്രയോഗം സ്വാഭാവികമായ ബൈബിൾ-ഭൂമിശാസ്ത്ര രജിസ്റ്റർ നിലനിർത്തുന്നു. മൂലപാഠത്തിലെ സ്ഥലസംബന്ധിയായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
