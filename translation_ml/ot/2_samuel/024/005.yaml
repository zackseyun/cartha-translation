  text: וַ/יַּעַבְר֖וּ אֶת הַ/יַּרְדֵּ֑ן וַ/יַּחֲנ֣וּ בַ/עֲרוֹעֵ֗ר יְמִ֥ין הָ/עִ֛יר אֲשֶׁ֛ר בְּ/תוֹךְ הַ/נַּ֥חַל הַ/גָּ֖ד וְ/אֶל יַעְזֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
translation:
  language: ml
  text: അവർ യോർദ്ദാൻ കടന്ന്, ഗാദിന്റെ താഴ്‌വരയുടെ[a] നടുവിലുള്ള പട്ടണത്തിന്റെ വലതുവശത്തുള്ള അരോവേരിൽ പാളയമിറങ്ങി; യാസേരിന്റെ ദിശയിലേക്കു[c] പോയി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗാദിന്റെ മലയിടുക്കിന്റെ’ അല്ലെങ്കിൽ ‘ഗാദിന്റെ കാലികതോടിന്റെ തടത്തിന്റെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘പട്ടണത്തിന്റെ വലതുവശത്ത്.’ ചിലർ ഇതിനെ ഭൂമിശാസ്ത്രപരമായി ‘പട്ടണത്തിന്റെ തെക്കുഭാഗത്ത്’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘യാസേരിലേക്കു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പദം ഒരു സ്ഥലത്തേക്കുള്ള ദിശയെയോ അവിടേക്കുള്ള യാത്രയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: അവർ യോർദ്ദാൻ കടന്ന്
  rationale: עבר എന്ന ക്രിയയും നേരിട്ടുള്ള കർമമായ ‘യോർദ്ദാൻ’ എന്ന പേരും ചേർന്നതിനാൽ നദി കടക്കുന്നതാണ് അർത്ഥം. മലയാളത്തിൽ ‘യോർദ്ദാൻ കടന്ന്’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: וַיַּחֲנוּ בַעֲרוֹעֵר
  choice: അരോവേറിൽ പാളയമിറങ്ങി
  rationale: חנה എന്നത് യാത്രാവിവരണത്തിൽ പാളയമടിക്കുക എന്നർത്ഥം നൽകുന്നു; സ്ഥലനാമത്തോടുള്ള ב ഇവിടെ നിൽപ്പിടത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: יְמִין הָעִיר
  choice: പട്ടണത്തിന്റെ വലതുവശത്ത്
  rationale: ימין എന്നതിന്റെ നേരിട്ടുള്ള സ്ഥലസംബന്ധിയായ അർത്ഥം ‘വലതുവശം’ എന്നാണ്. ‘തെക്ക്’ എന്നു വ്യാഖ്യാനിച്ച് ദിശ നിശ്ചയിക്കാതെ മൂലപാഠത്തിന്റെ ഭാഷ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בְּתוֹךְ הַנַּחַל הַגָּד
  choice: ഗാദിന്റെ താഴ്‌വരയുടെ നടുവിലുള്ള പട്ടണം
  rationale: ബന്ധവാക്യം ‘പട്ടണം’ എന്നതിനെ വിശേഷിപ്പിക്കുന്നതായി എടുത്തു. נחל താഴ്‌വര, മലയിടുക്ക്, കാലിക നീരൊഴുക്കിന്റെ ചാൽ എന്നിവ സൂചിപ്പിക്കാം; പ്രധാന പാഠത്തിൽ വായനാസൗകര്യത്തിനായി ‘താഴ്‌വര’ ഉപയോഗിച്ചു.
- source_word: וְאֶל יַעְזֵר
  choice: യാസേരിലേക്കു നീങ്ങി
  rationale: אל ലക്ഷ്യത്തിലേക്കുള്ള ദിശയെയോ ലക്ഷ്യസ്ഥാനത്തെത്തുന്ന ചലനത്തെയോ സൂചിപ്പിക്കാം. അപൂർണ്ണമായി തോന്നുന്ന ഹീബ്രു യാത്രാവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘നീങ്ങി’ ചേർത്തു; എത്തിച്ചേർന്നുവെന്ന് ഉറപ്പിക്കുന്നില്ല.
