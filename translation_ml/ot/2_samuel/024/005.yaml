  to: അവർ യോർദ്ദാൻ കടന്ന്, ഗാദിന്റെ താഴ്‌വരയുടെ[a] നടുവിലുള്ള പട്ടണത്തിന്റെ വലതുവശത്തുള്ള അരോവേരിൽ പാളയമിറങ്ങി; യാസേരിന്റെ ദിശയിലേക്കു[c] പോയി.[b]
