id: 2SA.24.15
reference: 2 Samuel 24:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֥ה דֶּ֨בֶר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/הַ/בֹּ֖קֶר וְ/עַד עֵ֣ת מוֹעֵ֑ד וַ/יָּ֣מָת מִן הָ/עָ֗ם מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/015.yaml
  text: So Yahweh sent a plague on Israel from the morning until the appointed time[a], and seventy thousand men of the people died, from Dan to Beersheba.
translation:
  language: ml
  text: അങ്ങനെ യഹോവ ഇസ്രായേലിന്റെമേൽ രാവിലെ മുതൽ നിയമിക്കപ്പെട്ട സമയം വരെ[a] ഒരു മഹാമാരി അയച്ചു; ദാൻ മുതൽ ബേർ-ശേബ വരെ ജനത്തിൽപ്പെട്ട എഴുപതിനായിരം പുരുഷന്മാർ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിശ്ചിത സമയം വരെ.’ ഈ ഹീബ്രു പ്രയോഗത്തിന് നിയമിക്കപ്പെട്ടതോ നിശ്ചിതമായതോ ആയ സമയം എന്നർത്ഥം വരാം; ‘സഭചേരുന്ന സമയം വരെ’ എന്ന അർത്ഥം ഇവിടെ സാധ്യത കുറഞ്ഞതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: അയച്ചു
  rationale: പദശഃ ‘കൊടുത്തു’ എന്നാണെങ്കിലും, דֶּבֶר എന്നതോടൊപ്പം ദൈവിക ന്യായവിധിയുടെ സാഹചര്യത്തിൽ ‘മഹാമാരി അയച്ചു’ എന്നത് സ്വാഭാവികവും അർത്ഥകൃത്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: דֶּבֶר
  choice: മഹാമാരി
  rationale: മാരകമായി പടരുന്ന രോഗബാധയെ സൂചിപ്പിക്കുന്ന വ്യക്തവും ആധുനികവുമായ മലയാളപദമാണിത്.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: ബേത് ഉപസർഗത്തിന്റെ സ്ഥലപരവും ജനസമൂഹത്തെ ബാധിക്കുന്നതുമായ അർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ന്യായവിധിയുടെ ആശയം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: מֵהַבֹּקֶר
  choice: രാവിലെമുതൽ
  rationale: സംഭവത്തിന്റെ കാലപരമായ ആരംഭബിന്ദു സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְעַד עֵת מוֹעֵד
  choice: നിശ്ചയിക്കപ്പെട്ട സമയംവരെ
  rationale: מוֹעֵד എന്ന പദത്തിന്റെ ‘നിയമിക്കപ്പെട്ട/നിശ്ചിത സമയം’ എന്ന പ്രധാന കാലാർഥം നിലനിർത്തുന്നു; ‘സഭചേരുന്ന സമയം’ എന്ന അപൂർവസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: തുടർന്നുള്ള സംഖ്യാവാക്യത്തെ കർത്താവാക്കി, ഹീബ്രുവിലെ ഏകവചന ക്രിയയുടെ സമാഹാരാർഥം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִן הָעָם
  choice: ജനത്തിൽ
  rationale: മരിച്ചവർ ജനസമൂഹത്തിൽപ്പെട്ടവരാണെന്ന അർത്ഥം മലയാളത്തിൽ ലളിതമായി നൽകുന്നു.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: ദാൻമുതൽ ബേർഷേബവരെ
  rationale: ഇസ്രായേൽദേശത്തിന്റെ മുഴുവൻ വ്യാപ്തിയെയും സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: എഴുപതിനായിരം പുരുഷന്മാർ
  rationale: സംഖ്യയ്ക്കു ശേഷം വിഭജനാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന אִישׁ എന്ന പുല്ലിംഗപദത്തെ ലിംഗസൂചന നഷ്ടപ്പെടുത്താതെ പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ന്യായവിധിയിലെ ദൈവിക പ്രവർത്തകത്വം
  choice: യഹോവ ... ഒരു മഹാമാരി അയച്ചു
  alternative: യഹോവ ഒരു മഹാമാരി അനുവദിച്ചു
  rationale: ഹീബ്രു വാക്യം പ്രവർത്തിയെ നേരിട്ട് യഹോവയോട് ബന്ധിപ്പിക്കുന്നു; ‘അനുവദിച്ചു’ എന്നു മൃദൂകരിക്കാൻ മൂലപാഠത്തിൽ അടിസ്ഥാനമില്ല.
- issue: עֵת מוֹעֵד എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: നിശ്ചയിക്കപ്പെട്ട സമയംവരെ
  alternative: നിശ്ചിത സമയംവരെ; സഭചേരുന്ന സമയംവരെ
  rationale: ഈ സന്ദർഭത്തിൽ ഒരു കാലപരമായ അന്ത്യബിന്ദുവാണ് ഏറ്റവും സാധ്യതയുള്ളത്. എന്നാൽ പ്രയോഗത്തിലെ യഥാർഥ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദൈവിക പ്രവർത്തകത്വം മൃദൂകരിക്കാതെയും കാലപ്രയോഗത്തിലെ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചും പരിഭാഷപ്പെടുത്തി.
