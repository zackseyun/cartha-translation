revisions:
- from: അങ്ങനെ യഹോവ രാവിലെമുതൽ നിശ്ചയിക്കപ്പെട്ട സമയംവരെ[a] ഇസ്രായേലിൽ ഒരു മഹാമാരി അയച്ചു; ദാൻമുതൽ ബേർഷേബവരെ ജനത്തിൽ എഴുപതിനായിരം പുരുഷന്മാർ മരിച്ചു.
  to: അങ്ങനെ യഹോവ ഇസ്രായേലിന്റെമേൽ രാവിലെ മുതൽ നിയമിക്കപ്പെട്ട സമയം വരെ[a] ഒരു മഹാമാരി അയച്ചു; ദാൻ മുതൽ ബേർ-ശേബ വരെ ജനത്തിൽപ്പെട്ട എഴുപതിനായിരം പുരുഷന്മാർ മരിച്ചു.
  rationale: പരിഷ്കരണം അർത്ഥം മാറ്റുന്നില്ല. ഹീബ്രു മുൻപ്രത്യയത്തിന്റെ സന്ദർഭാനുസൃതമായ ബാധകാർഥം ‘ഇസ്രായേലിന്റെമേൽ’ എന്നതിലൂടെ വ്യക്തമാക്കി; പദവിഭജനം, സ്ഥലനാമലിപി, ‘ജനത്തിൽപ്പെട്ട’ എന്ന ബന്ധസൂചന എന്നിവയിലൂടെ ആധുനിക മലയാളത്തിന്റെ സ്വാഭാവികതയും വ്യക്തതയും മെച്ചപ്പെടുത്തി. עֵת מוֹעֵד-ന്റെ പരിമിതമായ അർത്ഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
