source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן יוֹאָ֛ב אֶת מִסְפַּ֥ר מִפְקַד הָ/עָ֖ם אֶל הַ/מֶּ֑לֶךְ וַ/תְּהִ֣י יִשְׂרָאֵ֡ל שְׁמֹנֶה֩ מֵא֨וֹת אֶ֤לֶף אִֽישׁ חַ֨יִל֙ שֹׁ֣לֵֽף חֶ֔רֶב וְ/אִ֣ישׁ יְהוּדָ֔ה חֲמֵשׁ מֵא֥וֹת אֶ֖לֶף אִֽישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
translation:
  language: ml
  text: 'യോവാബ് ജനത്തിന്റെ കണക്കെടുപ്പിന്റെ സംഖ്യ രാജാവിനെ അറിയിച്ചു: ഇസ്രായേലിൽ വാൾ ഊരുന്ന എട്ടുലക്ഷം യോദ്ധാക്കൾ[a] ഉണ്ടായിരുന്നു; യെഹൂദയിൽ അഞ്ചുലക്ഷം പുരുഷന്മാരും ഉണ്ടായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '1 ദിനവൃത്താന്തം 21:5-ലെ സമാന്തരവിവരണത്തിൽ കണക്കുകൾ വ്യത്യസ്തമാണ്: ഇസ്രായേലിന് 11,00,000 പേരും യെഹൂദയ്ക്ക് 4,70,000 പേരും. സംഖ്യകളെ സമന്വയിപ്പിക്കാതെ, ഇവിടെ 2 ശമൂവേലിന്റെ എബ്രായപാഠമാണ് പിന്തുടരുന്നത്.'
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: ജനസംഖ്യയെടുപ്പിൽ എണ്ണപ്പെട്ട ജനത്തിന്റെ എണ്ണം
  rationale: ‘എണ്ണം—കണക്കെടുപ്പ്/രജിസ്ട്രേഷൻ—ജനം’ എന്ന എബ്രായ ഘടനയുടെ ആശയം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു. സന്ദർഭം ജനസംഖ്യയെടുപ്പായതിനാൽ സൈനികപരിശോധന എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: וַתְּהִי יִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ ... ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ ഫലസൂചകമായ കണക്കവതരണം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שְׁמֹנֶה מֵאוֹת אֶלֶף
  choice: എട്ടുലക്ഷം
  rationale: 8,00,000 എന്ന സംഖ്യയുടെ സാധാരണ മലയാളപ്രയോഗം.
- source_word: אִישׁ חַיִל
  choice: വീരന്മാർ
  rationale: ശക്തിയും യുദ്ധശേഷിയും സൂചിപ്പിക്കുന്ന പദം; തുടർന്നുള്ള ‘വാളൂരാൻ പ്രാപ്തരായ’ എന്ന വിശേഷണം സൈനികസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: שֹׁלֵף חֶרֶב
  choice: വാളൂരാൻ പ്രാപ്തരായ
  rationale: അക്ഷരാർഥത്തിൽ ‘വാൾ ഊരുന്നവർ’; ഇവിടെ യുദ്ധത്തിനു യോഗ്യരായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന സൈനികപ്രയോഗം. മൂലത്തിലെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് ഉദ്ദേശ്യവും വ്യക്തമാക്കുന്നു.
- source_word: וְאִישׁ יְהוּדָה
  choice: യെഹൂദയിൽ ... പുരുഷന്മാർ
  rationale: ഏകവചനരൂപത്തിലുള്ള אִישׁ ഇവിടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനമായി നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף אִישׁ
  choice: അഞ്ചുലക്ഷം പുരുഷന്മാർ
  rationale: 5,00,000 എന്ന സംഖ്യയും ഒടുവിലെ ‘പുരുഷൻ’ എന്ന പദവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: 1 ദിനവൃത്താന്തം 21:5-ലെ സമാന്തരവിവരണവുമായി സംഖ്യകളിലുള്ള വ്യത്യാസം
  choice: 2 ശമൂവേലിലെ മസോററ്റിക് പാഠത്തിലുള്ള ഇസ്രായേലിന്റെ എട്ടുലക്ഷവും യെഹൂദയുടെ അഞ്ചുലക്ഷവും അതേപടി വിവർത്തനം ചെയ്തു.
  alternative: ദിനവൃത്താന്തത്തിലെ സംഖ്യകളോട് പൊരുത്തപ്പെടുത്തുക, അല്ലെങ്കിൽ സ്ഥിരസൈന്യത്തെയും കരുതൽസേനയെയും ഉൾപ്പെടുത്തിയതിലോ ഒഴിവാക്കിയതിലോ ഉള്ള വ്യത്യാസമായി വ്യാഖ്യാനിക്കുക.
  rationale: വിവർത്തനം മൂലപാഠത്തിലെ കണക്കുകളെ സിദ്ധാന്തപരമായി സമന്വയിപ്പിക്കരുത്. വ്യത്യാസം കുറിപ്പിൽ തുറന്നുപറയുന്നു; പ്രത്യേക പരിഹാരസിദ്ധാന്തം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വാളൂരാൻ’ മൂലത്തിലെ സൈനിക ദൃശ്യരൂപം കാത്തുസൂക്ഷിക്കുന്നു; ‘പ്രാപ്തരായ’ എന്നത് സന്ദർഭത്തിലെ യുദ്ധയോഗ്യത വ്യക്തമാക്കുന്നു. പരമ്പരാഗത ബൈബിൾ നാമരൂപങ്ങളായ ‘യോവാബ്’, ‘യെഹൂദ’ എന്നിവ ഉപയോഗിച്ചു.
