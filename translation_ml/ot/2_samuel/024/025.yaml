id: 2SA.24.25
reference: 2 Samuel 24:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤ד מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יֵּעָתֵ֤ר יְהוָה֙ לָ/אָ֔רֶץ וַ/תֵּעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
translation:
  language: ml
  text: അവിടെ ദാവീദ് യഹോവയ്ക്ക് ഒരു യാഗപീഠം പണിത് ഹോമയാഗങ്ങളും സമാധാനയാഗങ്ങളും[a] അർപ്പിച്ചു. അപ്പോൾ യഹോവ ദേശത്തിനുവേണ്ടിയുള്ള അപേക്ഷയ്ക്ക് അനുകൂലമായി ഉത്തരം നൽകി[b], ഇസ്രായേലിന്മേലുള്ള മഹാമാരി തടയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൂട്ടായ്മയാഗങ്ങൾ.”
    reason: שְׁלָמִים എന്ന യാഗപദത്തിന് സമാധാനം, ക്ഷേമം, കൂട്ടായ്മ എന്നിവയുമായി ബന്ധപ്പെട്ട അർഥവ്യാപ്തിയുണ്ട്.
  - marker: b
    text: എബ്രായപ്രയോഗം “യഹോവ ദേശത്തിനുവേണ്ടി അപേക്ഷിക്കപ്പെട്ടപ്പോൾ അനുകൂലമായി പ്രതികരിച്ചു” എന്ന ആശയം നൽകുന്നു; “ദേശത്തിനുവേണ്ടിയുള്ള പ്രാർഥന കേട്ടു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: עתר എന്ന നിഫാൽ ക്രിയ അപേക്ഷയോടുള്ള അനുകൂല പ്രതികരണം ഉൾക്കൊള്ളുന്നു; לָאָרֶץ എന്ന ഘടകത്തിന്റെ ബന്ധം മലയാളത്തിൽ പലവിധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִד מִזְבֵּחַ
  choice: അവിടെ ദാവീദ് ഒരു യാഗപീഠം പണിത്
  rationale: ആഖ്യാനത്തിലെ സ്ഥലസൂചനയും בנה എന്ന ക്രിയയുടെ സാധാരണ അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ലക്ഷ്യം/സമർപ്പണം സൂചിപ്പിക്കുന്ന לְ നിലനിർത്തുകയും യְהוָה എന്ന ദൈവനാമം ‘യഹോവ’യായി നൽകുകയും ചെയ്യുന്നു.
- source_word: וַיַּעַל עֹלוֹת
  choice: ഹോമയാഗങ്ങൾ അർപ്പിച്ചു
  rationale: עלה എന്ന യാഗസംബന്ധിയായ പ്രയോഗത്തെയും עֹלוֹת എന്ന സ്ഥാപിത യാഗവിഭാഗത്തെയും സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וּשְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: ശെലാമീം എന്ന യാഗവിഭാഗത്തിന്റെ പരമ്പരാഗതവും മലയാള വായനക്കാർക്ക് പരിചിതവുമായ പദം; ‘കൂട്ടായ്മയാഗങ്ങൾ’ എന്ന വ്യാഖ്യാനാത്മക സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: യഹോവ ദേശത്തിനുവേണ്ടിയുള്ള അപേക്ഷയ്ക്ക് അനുകൂലമായി ഉത്തരം നൽകി
  rationale: עתר നിഫാൽ രൂപത്തിൽ അടങ്ങിയിരിക്കുന്ന അപേക്ഷയോടുള്ള അനുകൂല പ്രതികരണം വ്യക്തമാക്കുന്നു; לָאָרֶץ ദേശത്തെ സംബന്ധിച്ചോ ദേശത്തിനുവേണ്ടിയോ ഉള്ള പ്രതികരണമെന്ന നിലയിൽ നൽകുന്നു.
- source_word: וַתֵּעָצַר הַמַּגֵּפָה מֵעַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്മേലുള്ള മഹാമാരി തടയപ്പെട്ടു
  rationale: ക്രിയയുടെ നിഷ്ക്രിയഭാവവും מֵעַל എന്ന ‘മേൽനിന്ന് നീക്കപ്പെടുക/തടയപ്പെടുക’ എന്ന ആശയവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മലയാളത്തിലെ പൊതുവായ ബൈബിൾ പ്രയോഗത്തിൽ തിരിച്ചറിയാവുന്ന വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു; ‘കർത്താവ്’ എന്നു മാറ്റി ദൈവനാമത്തെ മറയ്ക്കുന്നില്ല.
- issue: וַיֵּעָתֵר יְהוָה לָאָרֶץ എന്നതിലെ ദൈവിക പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ദേശത്തിനുവേണ്ടിയുള്ള അപേക്ഷയ്ക്ക് അനുകൂലമായി ഉത്തരം നൽകി
  alternative: ദേശത്തോടു അനുകൂലമായി പ്രതികരിച്ചു; ദേശത്തിനുവേണ്ടിയുള്ള പ്രാർഥന കേട്ടു
  rationale: ക്രിയ അപേക്ഷയോടുള്ള അനുകൂല പ്രതികരണം സൂചിപ്പിച്ചാലും വാക്യം അപേക്ഷകനെയോ അപേക്ഷയുടെ വാക്കുകളെയോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പ്രാർഥനയെ കൂടുതൽ വിശദീകരിക്കാതെ ക്രിയയിലെ അർഥഘടകം മാത്രം പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സ്ഥാപിത ബൈബിൾ പദങ്ങളായ ‘യാഗപീഠം’, ‘ഹോമയാഗം’, ‘സമാധാനയാഗം’ എന്നിവ നിലനിർത്തി; അപൂർവമായ പദാർഥസാധ്യതകൾ അടിക്കുറിപ്പിലാക്കി.
