  terminology: ‘ഗിലെയാദ്,’ ‘തഹ്തീം-ഹൊദ്ശി,’ ‘ദാൻ-യാൻ,’ and ‘സീദോൻ’ are suitable forms. The footnotes correctly retain the uncertainty of the two difficult names without importing a conjectural reading into the text.
