language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ הַ/גִּלְעָ֔דָ/ה וְ/אֶל אֶ֥רֶץ תַּחְתִּ֖ים חָדְשִׁ֑י וַ/יָּבֹ֨אוּ֙ דָּ֣נָ/ה יַּ֔עַן וְ/סָבִ֖יב אֶל צִידֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
translation:
  language: ml
  text: അവർ ഗിലെയാദിലേക്കും തഹ്തീം-ഹൊദ്ശി ദേശത്തേക്കും[a] ചെന്നു. പിന്നെ അവർ ദാൻ-യാനിലേക്കും[b] ചുറ്റി സീദോനിലേക്കും ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തഹ്തീം-ഹൊദ്ശി’ എന്ന എബ്രായപ്രയോഗം അവ്യക്തമാണ്. ചിലർ പാഠം തിരുത്തുകയോ വ്യാഖ്യാനിക്കുകയോ ചെയ്ത് ‘കാദേശിലെ ഹിത്യരുടെ ദേശം’ എന്നോ അതിനോടു സാമ്യമുള്ളവിധത്തിലോ വായിക്കുന്നു; എന്നാൽ അടിസ്ഥാന സ്ഥലനാമം അനിശ്ചിതമാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘ദാൻ-യാൻ’ മിക്കവാറും ഒരു സ്ഥലനാമമാണ്; അത് കൃത്യമായി ഏതു സ്ഥലമാണെന്നത് അനിശ്ചിതമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: അവർ ചെന്നു
  rationale: בוא എന്ന ക്രിയയുടെ തുടർച്ചയായ ആഖ്യാനരൂപമാണിത്. യാത്രാവിവരണത്തിൽ ‘ചെന്നു’ എന്നത് സ്വാഭാവികമാണ്; ആവർത്തനം എബ്രായപാഠത്തിലെ ഘട്ടംഘട്ടമായ സഞ്ചാരത്തെ നിലനിർത്തുന്നു.
- source_word: הַגִּלְעָדָה
  choice: ഗിലെയാദിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה, ഗിലെയാദിലേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶרֶץ
  choice: ദേശം
  rationale: ഇവിടെ אֶרֶץ ഭൂമി മുഴുവനെയല്ല, ഒരു ഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תַּחְתִּים חָדְשִׁי
  choice: തഹ്തീം-ഹൊദ്ശി
  rationale: ഈ പ്രയോഗത്തിന്റെ പാഠവും ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയലും അവ്യക്തമാണ്. ഊഹാപോഹപരമായ തിരുത്തൽ മുഖ്യപാഠത്തിൽ കൊണ്ടുവരാതെ സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: דָּנָה יַּעַן
  choice: ദാൻ-യാൻ
  rationale: ഇത് മിക്കവാറും ഒരു സ്ഥലനാമമാണ്. דנה-യിലെ ദിശാസൂചക രൂപം മലയാളത്തിൽ ‘-ലേക്ക്’ എന്നതിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: וְסָבִיב אֶל צִידוֹן
  choice: അവിടെനിന്ന് സീദോന്റെ ചുറ്റുപാടുകളിലേക്ക്
  rationale: סָבִיב ചുറ്റുമുള്ള പ്രദേശത്തെയോ ചുറ്റിയുള്ള സഞ്ചാരത്തെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ യാത്രയുടെ പുരോഗതി സ്വാഭാവികമാക്കുന്നതിനൊപ്പം സീദോനു ചുറ്റുമുള്ള പ്രദേശം എന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ യാത്രാവിവരണശൈലി. അവ്യക്തമായ രണ്ടു സ്ഥലനാമങ്ങളും ഊഹാപോഹപരമായി പരിഹരിക്കാതെ ലിപ്യന്തരണം ചെയ്തു; എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
