revisions:
- from: 'അപ്പോൾ രാജാവ് തന്നോടൊപ്പമുണ്ടായിരുന്ന സൈന്യാധിപനായ യോവാബിനോടു പറഞ്ഞു: “ദാൻ മുതൽ ബേർ-ശേബ വരെ ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിലൂടെയും സഞ്ചരിച്ച് ജനത്തെ എണ്ണുക[a]. അങ്ങനെ ജനത്തിന്റെ എണ്ണം എനിക്ക് അറിയാം.”'
  to: 'അപ്പോൾ രാജാവ് തന്നോടൊപ്പമുണ്ടായിരുന്ന സൈന്യാധിപനായ യോവാബിനോടു പറഞ്ഞു: “ദാൻ മുതൽ ബേർ-ശേബ വരെ ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിലൂടെയും പോയി സഞ്ചരിച്ച് ജനത്തെ എണ്ണുക[a], ജനത്തിന്റെ എണ്ണം എനിക്ക് അറിയേണ്ടതിന്.”'
  rationale: അവസാനവാക്യത്തെ ഉദ്ദേശ്യവാക്യമായി തിരുത്തി, രാജാവിന്റെ കൽപ്പനയുടെ ലക്ഷ്യം മൂലപാഠത്തോട് ഒത്താക്കുന്നു. യാത്രാസൂചന കൂടുതൽ പ്രകടമാക്കാൻ ‘പോയി’ ചേർത്തു. പാഠത്തിന്റെ അർഥവ്യാപ്തി, സൈനികസന്ദർഭവുമായി ബന്ധപ്പെട്ട പക്ഷേ നിർണായകമല്ലാത്ത പദസാധ്യത, അടിക്കുറിപ്പ്-ചിഹ്നത്തിന്റെ സ്ഥാനം എന്നിവ സംരക്ഷിച്ചിരിക്കുന്നു.
