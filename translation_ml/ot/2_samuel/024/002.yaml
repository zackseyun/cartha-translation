  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל יוֹאָ֣ב שַׂר הַ/חַ֣יִל אֲשֶׁר אִתּ֗/וֹ שֽׁוּט נָ֞א בְּ/כָל שִׁבְטֵ֤י יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וּ/פִקְד֖וּ אֶת הָ/עָ֑ם וְ/יָ֣דַעְתִּ֔י אֵ֖ת מִסְפַּ֥ר הָ/עָֽם־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് തന്നോടൊപ്പമുണ്ടായിരുന്ന സൈന്യാധിപനായ യോവാബിനോടു പറഞ്ഞു: “ദാൻ മുതൽ ബേർ-ശേബ വരെ ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിലൂടെയും പോയി സഞ്ചരിച്ച് ജനത്തെ എണ്ണുക[a], ജനത്തിന്റെ എണ്ണം എനിക്ക് അറിയേണ്ടതിന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജനത്തെ രജിസ്റ്റർ ചെയ്യുക.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയാപദം ആളുകളെ എണ്ണുന്നതിനെയോ പട്ടികപ്പെടുത്തുന്നതിനെയോ സൂചിപ്പിക്കാം; ചില സന്ദർഭങ്ങളിൽ അതിന് സൈനികമായ പശ്ചാത്തലവുമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത സംഭവത്തിലേക്കു നീങ്ങുന്നു; ആഖ്യാനക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: എബ്രായപാഠം ഇവിടെ ദാവീദ് എന്ന പേരിനു പകരം പദവി ഉപയോഗിക്കുന്നതിനാൽ അതുതന്നെ നിലനിർത്തുന്നു.
- source_word: שַׂר הַחַיִל
  choice: സൈന്യാധിപൻ
  rationale: ശാരും ഹയിലും ചേർന്ന പ്രയോഗം ഇവിടെ സൈന്യത്തിന്റെ അധിപനെയാണ് സൂചിപ്പിക്കുന്നത്; സംക്ഷിപ്തവും നിലവാരമുള്ളതുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: אֲשֶׁר אִתּוֹ
  choice: തന്നോടൊപ്പമുണ്ടായിരുന്ന
  rationale: യോവാബ് രാജാവിനോടൊപ്പമുണ്ടായിരുന്നു എന്ന ബന്ധവാക്യം സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: שׁוּט נָא
  choice: സഞ്ചരിച്ച്
  rationale: ശൂത് ഒരു പ്രദേശമാകെ ചുറ്റിനടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. נא കല്പനയെ മയപ്പെടുത്തുന്ന കണികയാണ്; മലയാളത്തിൽ കൃത്രിമമായ ‘ദയവായി’ ചേർക്കാതെ കല്പനയുടെ മുഴുവൻ വാക്യഘടനയിൽ മൃദുത്വം നിലനിർത്തുന്നു.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിലൂടെയും
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയോടൊപ്പം ‘ഗോത്രങ്ങളിലൂടെയും’ എന്നത് പ്രദേശമാകെയുള്ള സഞ്ചാരം വ്യക്തമാക്കുന്നു.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: ദാൻ മുതൽ ബേർ-ശേബ വരെ
  rationale: ദേശത്തിന്റെ മുഴുവൻ വ്യാപ്തിയും സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ഭൂമിശാസ്ത്രപരമായ ദ്വന്ദപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּפִקְדוּ
  choice: എണ്ണുക
  rationale: ഈ സന്ദർഭത്തിൽ פקד ജനസംഖ്യ കണക്കെടുക്കുകയോ രജിസ്റ്റർ ചെയ്യുകയോ എന്നർഥം വഹിക്കുന്നു. ‘എണ്ണുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; സമീപസ്ഥമായ രജിസ്ട്രേഷൻ/സൈനിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֶת הָעָם
  choice: ജനത്തെ
  rationale: עָם എന്ന വിശാലമായ പദത്തെ സൈനികർ എന്നാക്കി ചുരുക്കാതെ അതിന്റെ സാധാരണ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: וְיָדַעְתִּי
  choice: അങ്ങനെ ... എനിക്ക് അറിയാം
  rationale: കല്പനയുടെ ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; രാജാവിന്റെ അറിവിലേക്കുള്ള ഉദ്ദേശ്യം നിലനിർത്തുന്നു.
- source_word: מִסְפַּר הָעָם
  choice: ജനത്തിന്റെ എണ്ണം
  rationale: നിർമാണബന്ധത്തിന്റെ നേരിട്ടുള്ളതും സുതാര്യവുമായ പരിഭാഷയാണ്.
theological_decisions:
- issue: സൈനിക-ഭരണപരമായ പശ്ചാത്തലത്തിൽ הָעָם എന്നതിന്റെ വ്യാപ്തി
  choice: ജനം
  alternative: പോരാളികൾ / സൈനികർ
  rationale: യോവാബ് സൈന്യാധിപനായതും കണക്കെടുപ്പിന് സൈനിക പ്രസക്തിയുള്ളതുമായിരുന്നാലും മൂലപാഠം പോരാളികൾക്കുള്ള പ്രത്യേക പദമല്ല, ‘ജനം’ എന്ന വിശാലാർഥമുള്ള עָם ആണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പരിഭാഷ അതിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ ‘ദാൻ’, ‘ബേർ-ശേബ’ എന്നും പദവി ‘സൈന്യാധിപൻ’ എന്നും നൽകിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാട്ടുന്ന [a] പ്രധാനപാഠത്തിലെ ബന്ധപ്പെട്ട ക്രിയയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
