revisions:
- from: 'അരവ്നാ ചോദിച്ചു: “എന്റെ യജമാനനായ രാജാവ് തന്റെ ദാസന്റെ അടുക്കൽ വന്നത് എന്തിനാണ്[a]?” ദാവീദ് പറഞ്ഞു: “ജനത്തിന്റെമേൽനിന്ന് മഹാമാരി നീങ്ങേണ്ടതിന് യഹോവയ്ക്കായി ഒരു യാഗപീഠം പണിയാൻ, നിന്നിൽനിന്ന് ഈ മെതിക്കളം വാങ്ങാനാണ്.”'
  to: 'അരൗനാ ചോദിച്ചു: “എന്റെ യജമാനനായ രാജാവ് തന്റെ ദാസന്റെ അടുക്കൽ വന്നത് എന്തിനാണ്[a]?” ദാവീദ് പറഞ്ഞു: “നിന്നിൽനിന്ന് മെതിക്കളം വാങ്ങി യഹോവയ്ക്കായി ഒരു യാഗപീഠം പണിയാനും, ജനത്തിന്റെമേൽനിന്ന് മഹാമാരി നീങ്ങേണ്ടതിനുമാണ്.”'
  rationale: 'മൂലപാഠത്തിലെ പ്രവർത്തന-ഉദ്ദേശ്യക്രമം പുനഃസ്ഥാപിച്ചു: മെതിക്കളം വാങ്ങൽ, യഹോവയ്ക്കായി യാഗപീഠം പണിയൽ, ജനത്തിന്റെമേൽനിന്ന് മഹാമാരി നീങ്ങൽ. മഹാമാരി നീങ്ങുന്നതിനെ ഉറപ്പായ പ്രവചനമായി മാറ്റാതെ ‘നീങ്ങേണ്ടതിന്’ എന്ന ഉദ്ദേശ്യരൂപം നിലനിർത്തി. രാജസഭാ സ്വയംസൂചനയും അതിന്റെ അടിക്കുറിപ്പും മാറ്റിയിട്ടില്ല.'
