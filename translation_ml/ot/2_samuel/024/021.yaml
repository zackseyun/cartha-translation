base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
translation:
  language: ml
  text: 'അരൗനാ ചോദിച്ചു: “എന്റെ യജമാനനായ രാജാവ് തന്റെ ദാസന്റെ അടുക്കൽ വന്നത് എന്തിനാണ്[a]?” ദാവീദ് പറഞ്ഞു: “നിന്നിൽനിന്ന് മെതിക്കളം വാങ്ങി യഹോവയ്ക്കായി ഒരു യാഗപീഠം പണിയാനും, ജനത്തിന്റെമേൽനിന്ന് മഹാമാരി നീങ്ങേണ്ടതിനുമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “തന്റെ ദാസന്റെ അടുക്കൽ.” രാജസഭയിലെ വിനയപൂർവമായ ആത്മപരാമർശമാണിത്; അർഥം “അങ്ങയുടെ ദാസന്റെ അടുക്കൽ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: എന്തിനാണ്
  rationale: രാജാവിന്റെ വരവിന്റെ ഉദ്ദേശ്യം ചോദിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാളം.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: ആദരസൂചകമായ ‘എന്റെ യജമാനൻ’ എന്ന ആശയവും രാജപദവിയും നിലനിർത്തുന്നു.
- source_word: עַבְדּוֹ
  choice: തന്റെ ദാസൻ
  rationale: എബ്രായത്തിലെ മൂന്നാംപുരുഷ രാജസഭാ വിനയപ്രയോഗം ഔപചാരികമായി സംരക്ഷിക്കുന്നു; പ്രായോഗിക അർഥം ‘അങ്ങയുടെ ദാസൻ’ എന്നാണ്.
- source_word: לִקְנוֹת מֵעִמְּךָ אֶת הַגֹּרֶן
  choice: നിന്നിൽനിന്ന് ഈ മെതിക്കളം വാങ്ങാൻ
  rationale: വാങ്ങൽ ഇടപാടും നിർദിഷ്ടമായ കാർഷിക സ്ഥലവും വ്യക്തമായി നൽകുന്നു; സന്ദർഭത്തിൽ നിർദിഷ്ടത വ്യക്തമാക്കാൻ ‘ഈ’ ഉപയോഗിച്ചു.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: ഒരു യാഗപീഠം പണിയാൻ
  rationale: ഉദ്ദേശ്യാർഥമുള്ള infinitive സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത്, യാഗപീഠത്തിന്റെ സമർപ്പണം സൂചിപ്പിക്കാൻ ദാതൃവിഭക്തി ഉപയോഗിക്കുന്നു.
- source_word: וְתֵעָצַר הַמַּגֵּפָה מֵעַל הָעָם
  choice: ജനത്തിന്റെമേൽനിന്ന് മഹാമാരി നീങ്ങേണ്ടതിന്
  rationale: Niphal രൂപത്തിന്റെ നിർജ്ജീവവും ഉദ്ദേശ്യ/ഫലസൂചനയും സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ ‘മേൽനിന്ന് നീങ്ങുക’ എന്നത് ബാധ പിൻവലിക്കപ്പെടുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു.
- issue: മഹാമാരി അവസാനിക്കുന്നതിലെ ഉദ്ദേശ്യവും ഉറപ്പും
  choice: നീങ്ങേണ്ടതിന്
  alternative: നീങ്ങുംവിധം; നീങ്ങുകയും ചെയ്യും
  rationale: וְתֵעָצַר ഇവിടെ ദാവീദിന്റെ ലക്ഷ്യം/പ്രതീക്ഷ സൂചിപ്പിക്കുന്നു; ഫലം നിർബന്ധമായും സംഭവിക്കുമെന്ന അധിക ഉറപ്പ് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അരവ്നായുടെ രാജസഭാ വിനയഭാഷ മൂലരൂപത്തോട് അടുത്തുവെച്ച് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
