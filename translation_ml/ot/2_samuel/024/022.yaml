source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל דָּוִ֔ד יִקַּ֥ח וְ/יַ֛עַל אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הַ/טּ֣וֹב ב/עינ/ו רְאֵה֙ הַ/בָּקָ֣ר לָ/עֹלָ֔ה וְ/הַ/מֹּרִגִּ֛ים וּ/כְלֵ֥י הַ/בָּקָ֖ר לָ/עֵצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
translation:
  language: ml
  text: 'അപ്പോൾ അരവ്നാ ദാവീദിനോടു പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവ് തനിക്കു നല്ലതായി തോന്നുന്നതു എടുത്ത് അർപ്പിക്കട്ടെ.[a] ഇതാ, ഹോമയാഗത്തിനായി കാളകളും വിറകായി മെതിവണ്ടികളും കാളകളുടെ ഉപകരണങ്ങളും[b] ഉണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘തന്റെ കണ്ണുകളിൽ നല്ലത്.’ ‘തനിക്കു നന്നെന്നു തോന്നുന്നതെന്തോ അത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കാളകളുടെ സാമഗ്രികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗം വിശാലമാണ്; വിറകായി ഉപയോഗിക്കാവുന്ന നുകംപോലുള്ള കാളകളുടെ മരസാമഗ്രികളെ പൊതുവായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח וְיַעַל
  choice: എടുത്ത് അർപ്പിച്ചാലും
  rationale: നേരിട്ടുള്ള സംഭാഷണത്തിലെ അനുമതിയും ആദരപൂർവമായ ക്ഷണവും പ്രകടമാക്കുന്നു; യാഗസന്ദർഭത്തിലെ עלה എന്ന ക്രിയയ്ക്ക് ‘അർപ്പിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: രാജാവിനോടുള്ള അരവ്നായുടെ ആദരപൂർവമായ അഭിസംബോധന ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: തനിക്കു നല്ലതായി തോന്നുന്നത്
  rationale: ‘അവന്റെ കണ്ണുകളിൽ നല്ലത്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; രാജാവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്തശേഷം മൂന്നാംപുരുഷത്തിൽ പരാമർശിക്കുന്ന എബ്രായരീതിയും ‘തനിക്ക്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: רְאֵה
  choice: ഇതാ
  rationale: അരവ്നാ ഒരുക്കിയിരിക്കുന്ന വസ്തുക്കളിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന സംഭാഷണസൂചകമായി ഗൗരവമുള്ളതും പരിചിതവുമായ പ്രയോഗം.
- source_word: הַבָּקָר
  choice: കാളകൾ
  rationale: മെതിക്കൽ ഉപകരണങ്ങളോടൊപ്പം ഉപയോഗിക്കുന്നതും യാഗത്തിന് യോജിച്ചതുമായ തൊഴിൽമൃഗങ്ങളാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: לָעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה എന്നത് മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘ഹോമയാഗം’ വ്യക്തവും സ്ഥാപിതവുമാണ്.
- source_word: הַמֹּרִגִּים
  choice: മെതിവണ്ടികൾ
  rationale: ധാന്യം മെതിക്കാൻ ഉപയോഗിച്ചിരുന്ന പലകയോ വണ്ടിപോലുള്ള ഉപകരണത്തെയാണ് מורג സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ വിറകായി ഉപയോഗിക്കാവുന്ന ഉപകരണമെന്ന ആശയവും നിലനിൽക്കുന്നു.
- source_word: כְלֵי הַבָּקָר
  choice: കാളകളുടെ ഉപകരണങ്ങൾ
  rationale: כְּלִי എന്ന പദം നുകം മാത്രമെന്നതിലുപരി ഉപകരണം/സാമഗ്രി എന്ന വിശാല അർഥമുള്ളതിനാൽ അമിതമായ പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു.
- source_word: לָעֵצִים
  choice: വിറകായി
  rationale: മെതിവണ്ടികളും കാളകളുടെ മരസാമഗ്രികളും യാഗത്തിനുള്ള ഇന്ധനമായി ഉപയോഗിക്കാമെന്ന ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
