translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, രാജസന്നിധിയിലെ ആദരഭാവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. എബ്രായത്തിലെ ആദരപൂർവമായ മൂന്നാംപുരുഷപ്രയോഗവും כְלֵי എന്ന പദത്തിന്റെ വിശാലതയും അനാവശ്യമായി ചുരുക്കിയിട്ടില്ല.
