  text: וַ/יָּבֹ֨אוּ֙ מִבְצַר צֹ֔ר וְ/כָל עָרֵ֥י הַ/חִוִּ֖י וְ/הַֽ/כְּנַעֲנִ֑י וַ/יֵּֽצְא֛וּ אֶל נֶ֥גֶב יְהוּדָ֖ה בְּאֵ֥ר שָֽׁבַע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/007.yaml
  text: They came to the fortified city of Tyre and to all the cities of the Hivites and the Canaanites[a], and they went out to the Negev of Judah, to Beersheba.
translation:
  language: ml
  text: അവർ കോട്ടകെട്ടിയ സോർ നഗരത്തിലും ഹിവ്യരുടെയും കനാന്യരുടെയും എല്ലാ നഗരങ്ങളിലും എത്തി; പിന്നെ അവർ യെഹൂദയുടെ നെഗെബിലേക്കു[a], ബേർ-ശേബയിലേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദയുടെ തെക്കൻ പ്രദേശത്തേക്ക്.’ എബ്രായത്തിലെ നെഗെബ് എന്ന പദം നെഗെബ് എന്ന പ്രത്യേക പ്രദേശത്തെയോ പൊതുവായി തെക്കൻ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  choice: കോട്ടകെട്ടിയ സോർ നഗരം
  rationale: מִבְצַר ഒരു കോട്ടയെയോ ഉറപ്പുള്ള സ്ഥലത്തെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ צֹר-നോടു ചേർന്നുള്ള പ്രയോഗം സോർ എന്ന കോട്ടകെട്ടിയ നഗരത്തെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: וְכָל עָרֵי הַחִוִּי וְהַכְּנַעֲנִי
  choice: ഹിവ്യരുടെയും കനാന്യരുടെയും എല്ലാ നഗരങ്ങൾ
  rationale: ജനവിഭാഗങ്ങളുടെ പേരുകൾ മലയാളത്തിലെ പതിവ് ബഹുവചനരൂപത്തിൽ നൽകി; മുൻപുള്ള ചലനക്രിയയുടെ ദിശ ഈ ലക്ഷ്യസ്ഥാനങ്ങൾക്കും ബാധകമാക്കി.
- source_word: וַיֵּצְאוּ
  choice: അവിടെനിന്ന് അവർ ... പോയി
  rationale: יצא എന്ന ക്രിയയുടെ ‘പുറപ്പെട്ടു/പോയി’ എന്ന യാത്രാസന്ദർഭത്തിലെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘അവിടെനിന്ന്’ യാത്രയുടെ അടുത്ത ഘട്ടം വ്യക്തമാക്കുന്നു.
- source_word: אֶל נֶגֶב יְהוּדָה
  choice: യെഹൂദയുടെ നെഗെബിലേക്ക്
  rationale: ഭൂമിശാസ്ത്രപരമായ യാത്രാവിവരണത്തിൽ נֶגֶב പ്രദേശനാമമായ ‘നെഗെബ്’ എന്നു നിലനിർത്തുന്നു; പൊതുവായ ‘തെക്കൻ പ്രദേശം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּאֵר שָׁבַע
  choice: ബേർ-ശേബ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ഘടകങ്ങൾ തിരിച്ചറിയാവുന്ന വിധത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ യാത്രാവിവരണശൈലി. സ്ഥലനാമങ്ങളും ജനവിഭാഗനാമങ്ങളും ലിപ്യന്തരിച്ചു; മൂലപാഠത്തിലെ ഭൂമിശാസ്ത്രപരമായ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
