source:
  edition: WLC
  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד וַ/יַּגֶּד ל֑/וֹ וַ/יֹּ֣אמֶר ל֡/וֹ הֲ/תָב֣וֹא לְ/ךָ֣ שֶֽׁבַע שָׁנִ֣ים רָעָ֣ב בְּ/אַרְצֶ֡/ךָ אִם שְׁלֹשָׁ֣ה חֳ֠דָשִׁים נֻסְ/ךָ֨ לִ/פְנֵֽי צָרֶ֜י/ךָ וְ/ה֣וּא רֹדְפֶ֗/ךָ וְ/אִם הֱ֠יוֹת שְׁלֹ֨שֶׁת יָמִ֥ים דֶּ֨בֶר֙ בְּ/אַרְצֶ֔/ךָ עַתָּה֙ דַּ֣ע וּ/רְאֵ֔ה מָה אָשִׁ֥יב שֹׁלְחִ֖/י דָּבָֽר־־־׀׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
translation:
  language: ml
  text: 'അങ്ങനെ ഗാദ് ദാവീദിന്റെ അടുക്കൽ വന്ന് അവനെ അറിയിച്ചു; അവനോടു പറഞ്ഞു: “നിന്റെ ദേശത്ത് ഏഴു വർഷം ക്ഷാമം വരണമോ?[a] അല്ലെങ്കിൽ നിന്റെ ശത്രുക്കൾ നിന്നെ പിന്തുടരുമ്പോൾ മൂന്നു മാസം നീ അവരുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോകണമോ?[b] അതുമല്ലെങ്കിൽ നിന്റെ ദേശത്ത് മൂന്നു ദിവസം മഹാമാരി ഉണ്ടാകണമോ?[c] ഇപ്പോൾ ആലോചിച്ചു നോക്കുക; എന്നെ അയച്ചവന് ഞാൻ എന്തു മറുപടി നൽകണമെന്നു കാണുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 ദിനവൃത്താന്തം 21:12-ലെ സമാന്തരപാഠത്തിൽ ‘ഏഴു വർഷം’ എന്നതിനുപകരം ‘മൂന്നു വർഷം ക്ഷാമം’ എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: ‘ശത്രുക്കൾ’ എന്നതിന് ‘എതിരാളികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘മഹാമാരി’ എന്നതിന് ‘ബാധ’ അഥവാ ‘പ്ലേഗ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അടുക്കൽ വന്നു
  rationale: בוא എന്ന സാധാരണ ചലനക്രിയ ഗാദ് ദാവീദിനെ സമീപിച്ചതായി സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അടുക്കൽ വന്നു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וַיַּגֶּד
  choice: അറിയിച്ചു
  rationale: Hiphil രൂപത്തിലുള്ള נגד അറിയിക്കുക/റിപ്പോർട്ട് ചെയ്യുക എന്ന അർഥം നൽകുന്നു; ‘അറിയിച്ചു’ നേരിട്ടുള്ള ആശയവിനിമയം നിലനിർത്തുന്നു.
- source_word: שֶׁבַע שָׁנִים רָעָב
  choice: ഏഴു വർഷം ക്ഷാമം
  rationale: רָעָב വ്യക്തിപരമായ വിശപ്പിനേക്കാൾ ദേശവ്യാപകമായ ക്ഷാമത്തെ സൂചിപ്പിക്കുന്നു. മസോററ്റിക് പാഠത്തിലെ ‘ഏഴു വർഷം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּאַרְצֶךָ
  choice: നിന്റെ ദേശത്ത്
  rationale: ഇവിടെ אֶרֶץ ദാവീദിന്റെ ഭരണപ്രദേശത്തെയോ ദേശത്തെയോ സൂചിപ്പിക്കുന്നു; ‘നിന്റെ ദേശത്ത്’ നേരിട്ടുള്ള പരിഭാഷയാണ്.
- source_word: אִם שְׁלֹשָׁה חֳדָשִׁים נֻסְךָ לִפְנֵי צָרֶיךָ
  choice: നിന്റെ ശത്രുക്കൾ നിന്നെ പിന്തുടരുമ്പോൾ മൂന്നു മാസം നീ അവരുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോകണമോ
  rationale: എബ്രായ വാക്യം സംക്ഷിപ്തവും അല്പം ദീർഘലോപമുള്ളതുമാണ്. נוס ഓടിപ്പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം തെളിയിക്കാൻ പിന്തുടരുന്ന ഉപവാക്യവുമായി ചേർത്തിരിക്കുന്നു.
- source_word: צָרֶיךָ
  choice: നിന്റെ ശത്രുക്കൾ
  rationale: צַר എതിരാളി, വൈരി, ശത്രു എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് ‘ശത്രുക്കൾ’ സ്വാഭാവികമാണ്; ‘എതിരാളികൾ’ സാധ്യമായ മറ്റൊരു പരിഭാഷയാണ്.
- source_word: וְהוּא רֹדְפֶךָ
  choice: നിന്നെ പിന്തുടരുമ്പോൾ
  rationale: എബ്രായത്തിൽ സർവനാമം ഏകവചനമാണെങ്കിലും മുൻപുള്ള ബഹുവചനമായ ശത്രുക്കളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം. മലയാളത്തിൽ കർത്താവ് ബഹുവചനമായി സ്വാഭാവികമാക്കി.
- source_word: דֶּבֶר
  choice: മഹാമാരി
  rationale: דֶּבֶר വ്യാപകമായി പടരുന്ന മാരകവ്യാധിയെയോ ബാധയെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘മഹാമാരി’ ഗൗരവവും വ്യാപ്തിയും വ്യക്തമായി നൽകുന്നു.
- source_word: עַתָּה דַּע וּרְאֵה
  choice: ഇപ്പോൾ ആലോചിച്ചു നോക്കുക
  rationale: ‘അറിയുക, കാണുക’ എന്ന അക്ഷരാർഥമുള്ള ഇരട്ട കല്പന ഇവിടെ വിചാരിച്ച് തീരുമാനിക്കാനുള്ള ആഹ്വാനമാണ്; മലയാളത്തിലെ ഈ പ്രയോഗം ആ പ്രവർത്തനാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  choice: എന്നെ അയച്ചവനോട് ഞാൻ എന്തു മറുപടി പറയണമെന്ന് തീരുമാനിക്കുക
  rationale: השיב דבר മറുപടി തിരികെ അറിയിക്കുക എന്ന പ്രയോഗമാണ്. അവസാന കല്പനയുടെ തീരുമാനാത്മക ഭാവം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘തീരുമാനിക്കുക’ ചേർത്തിരിക്കുന്നു; മറുപടിയുടെ ഉള്ളടക്കം ദാവീദ് നിശ്ചയിക്കണമെന്ന സന്ദർഭാർഥം ഇതിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: 1 ദിനവൃത്താന്തം 21:12-ലെ സമാന്തര വിവരണവുമായി വർഷങ്ങളുടെ എണ്ണത്തിലുള്ള വ്യത്യാസം
  choice: മസോററ്റിക് പാഠത്തിലുള്ള ‘ഏഴു വർഷം ക്ഷാമം’ മുഖ്യപാഠത്തിൽ പരിഭാഷപ്പെടുത്തി
  alternative: ‘മൂന്നു വർഷം ക്ഷാമം’—1 ദിനവൃത്താന്തം 21:12-ലെ സമാന്തരപാഠം
  rationale: നൽകിയിരിക്കുന്ന WLC പാഠം ‘ഏഴു വർഷം’ എന്നാണ് വായിക്കുന്നത്. സമാന്തരപാഠത്തിലെ ‘മൂന്നു വർഷം’ മുഖ്യപാഠത്തിൽ ഒത്തുതീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ തുറന്നുപറയുന്നത് പാഠസാക്ഷ്യവും നിലനിൽക്കുന്ന സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. കല്പനകളുടെയും മൂന്ന് ദുരന്തവികല്പങ്ങളുടെയും ഔപചാരിക ഭാവം നിലനിർത്തിക്കൊണ്ട് അത്യന്തം അക്ഷരാർഥപരമായ അസ്വാഭാവിക പ്രയോഗങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനങ്ങളിൽ നൽകിയിരിക്കുന്നു.
