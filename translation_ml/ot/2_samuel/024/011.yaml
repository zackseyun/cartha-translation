id: 2SA.24.11
reference: 2 Samuel 24:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֥קָם דָּוִ֖ד בַּ/בֹּ֑קֶר וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל גָּ֣ד הַ/נָּבִ֔יא חֹזֵ֥ה דָוִ֖ד לֵ/אמֹֽרפ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
translation:
  language: ml
  text: 'ദാവീദ് രാവിലെ എഴുന്നേറ്റു; യഹോവയുടെ അരുളപ്പാട് ദാവീദിന്റെ ദർശകനായ ഗാദ് പ്രവാചകന്റെ അടുക്കൽ ഉണ്ടായിരുന്നതു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “യഹോവയുടെ അരുളപ്പാട് ഗാദ് പ്രവാചകന്റെ അടുക്കലേക്ക്/അടുക്കൽ ഉണ്ടായിരുന്നു.” സന്ദർഭത്തിൽ, ഗാദിന് അരുളപ്പാട് ലഭിച്ചിരുന്നു എന്നും മനസ്സിലാക്കാം.
    reason: הָיָה אֶל എന്ന പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും, സന്ദർഭത്തിൽ സാധ്യമായ മുൻകാലവായനയും നിർബന്ധിക്കാതെ സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റപ്പോൾ
  rationale: വിവരണത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാരൂപം. തുടർന്നുള്ള സമയബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കാൻ ബַּבֹּקֶר എന്ന പദത്തോടൊപ്പം ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: בַּבֹּקֶר
  choice: രാവിലെ
  rationale: ദാവീദ് എഴുന്നേറ്റ സമയത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: וּדְבַר יְהוָה
  choice: യഹോവയുടെ അരുളപ്പാട്
  rationale: דָּבָר എന്നത് ഇവിടെ ദൈവത്തിൽനിന്നുള്ള പ്രവാചകസന്ദേശമാണ്. ‘അരുളപ്പാട്’ അതിന്റെ വെളിപ്പെടുത്തൽസ്വഭാവം നിലനിർത്തുന്നു; יְהוָה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: הָיָה אֶל
  choice: ലഭിച്ചിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ അടുക്കൽ ഉണ്ടായിരുന്നു’ എന്ന ഘടനയാണെങ്കിലും പ്രവാചകസന്ദർഭത്തിൽ ദൈവിക അരുളപ്പാട് ഒരാൾക്കു ലഭിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ദാവീദ് എഴുന്നേൽക്കുന്നതിനു മുമ്പേ ഇത് സംഭവിച്ചിരിക്കാമെന്ന സന്ദർഭസൂചന ‘ലഭിച്ചിരുന്നു’ നിലനിർത്തുന്നു.
- source_word: גָּד
  choice: ഗാദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: הַנָּבִיא
  choice: പ്രവാചകൻ
  rationale: נָבִיא സൂചിപ്പിക്കുന്ന അംഗീകൃത ദൈവിക ദൂതന്റെ പദവി നേരിട്ട് നൽകുന്നു.
- source_word: חֹזֵה דָוִד
  choice: ദാവീദിന്റെ ദർശകൻ
  rationale: ഗാദിന് ദാവീദുമായുള്ള ഔദ്യോഗികബന്ധം വ്യക്തമാക്കുന്ന നിർമാണം. חֹזֶה എന്ന പദത്തെ ‘പ്രവാചകൻ’ എന്നതിൽ ലയിപ്പിക്കാതെ അതിന്റെ വ്യത്യസ്ത പദവി ‘ദർശകൻ’ എന്നു നിലനിർത്തി.
- source_word: לֵאמֹר
  choice: ':'
  rationale: അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളിലേക്കുള്ള അവതാരിക മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുർവർണ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ഉടമ്പടിനാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: הָיָה אֶל എന്നതിന്റെ കാലബന്ധം
  choice: ലഭിച്ചിരുന്നു
  alternative: ലഭിച്ചു / ഉണ്ടായിരുന്നു
  rationale: ദാവീദ് രാവിലെ എഴുന്നേറ്റപ്പോൾ അരുളപ്പാട് ഇതിനകം ഗാദിനു ലഭിച്ചിരുന്നുവെന്ന സാധ്യത സന്ദർഭം നൽകുന്നു. എന്നാൽ എബ്രായഘടനയുടെ കൂടുതൽ അക്ഷരാർഥപരമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘പ്രവാചകൻ’ എന്നും ‘ദർശകൻ’ എന്നും ഉള്ള വ്യത്യസ്ത എബ്രായ പദവികൾ രണ്ടും നിലനിർത്തി. വാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ചേർത്തു.
