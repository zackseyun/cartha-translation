revisions:
- from: 'ദാവീദ് രാവിലെ എഴുന്നേറ്റപ്പോൾ, യഹോവയുടെ അരുളപ്പാട് ദാവീദിന്റെ ദർശകനായ ഗാദ് പ്രവാചകനു ലഭിച്ചിരുന്നു[a]:'
  to: 'ദാവീദ് രാവിലെ എഴുന്നേറ്റു; യഹോവയുടെ അരുളപ്പാട് ദാവീദിന്റെ ദർശകനായ ഗാദ് പ്രവാചകന്റെ അടുക്കൽ ഉണ്ടായിരുന്നതു[a]:'
  rationale: Main-clause coordination preserves the Hebrew narrative form, while ‘ഉണ്ടായിരുന്നതു’ and the revised note retain the source expression’s temporal openness. The revision maintains the divine name and the distinct offices of Gad as prophet and David's seer.
