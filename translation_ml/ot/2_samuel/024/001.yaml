  text: וַ/יֹּ֨סֶף֙ אַף יְהוָ֔ה לַ/חֲר֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת אֶת דָּוִ֤ד בָּ/הֶם֙ לֵ/אמֹ֔ר לֵ֛ךְ מְנֵ֥ה אֶת יִשְׂרָאֵ֖ל וְ/אֶת יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
translation:
  language: ml
  text: 'യഹോവയുടെ കോപം വീണ്ടും ഇസ്രായേലിനെതിരെ ജ്വലിച്ചു[a]. അവൻ ദാവീദിനെ അവർക്കെതിരെ പ്രേരിപ്പിച്ചു: “പോയി[b] ഇസ്രായേലിനെയും യെഹൂദയെയും എണ്ണുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 ദിനവൃത്താന്തം 21:1-ൽ സാത്താൻ ഇസ്രായേലിനെതിരെ എഴുന്നേറ്റ് ദാവീദിനെ പ്രേരിപ്പിച്ചതായി പറയുന്നു. ഇവിടെ മുഖ്യപാഠം 2 ശമൂവേലിലെ ഹീബ്രു പാഠത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ കർത്താവിനെ പിന്തുടരുകയും, രണ്ടു വിവരണങ്ങൾക്കിടയിലെ സംഘർഷം സമന്വയിപ്പിക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
    reason: cross_reference
  - marker: b
    text: അഥവാ “സംഖ്യപ്പെടുത്തുക” അല്ലെങ്കിൽ “ജനസംഖ്യ കണക്കെടുക്കുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... לַחֲרוֹת
  choice: വീണ്ടും ... ജ്വലിച്ചു
  rationale: പുതുക്കപ്പെട്ട പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന וַיֹּסֶף എന്നതും കോപം കത്തുന്നതിന്റെ രൂപകം നിലനിർത്തുന്ന חרה אף എന്ന പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പകർത്തുന്നു.
- source_word: אַף
  choice: കോപം
  rationale: അക്ഷരാർഥത്തിൽ ‘മൂക്ക്’ എന്നാകാമെങ്കിലും ഇവിടെ കോപത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ഭാഷാശൈലിയാണ്; ‘കോപം’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെ
  rationale: കോപത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന בְ എന്ന ഉപസർഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം ‘എതിരെ’ എന്നതാണ്.
- source_word: וַיָּסֶת
  choice: പ്രേരിപ്പിച്ചു
  rationale: סות എന്ന ക്രിയയുടെ കാരകഭാവമായ പ്രചോദിപ്പിക്കുക, ഇളക്കിവിടുക എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ദൈവിക പ്രവർത്തകത്വവും നിലനിർത്തുന്നു.
- source_word: בָּהֶם
  choice: അവർക്കെതിരെ
  rationale: ദുഷ്കരമായ ഈ പദബന്ധത്തെ ദാവീദ് ജനത്തിനെതിരെ പ്രവർത്തിക്കാൻ പ്രേരിപ്പിക്കപ്പെട്ടു എന്ന സന്ദർഭപരമായ അർഥത്തിൽ നൽകുന്നു; ‘അവരുടെ ഇടയിൽ’ എന്നതും വ്യാകരണപരമായി പരിഗണിക്കാവുന്നതാണെങ്കിലും ഇവിടെ കുറച്ച് സ്വാഭാവികമാണ്.
- source_word: לֵאמֹר
  choice: അരുളിച്ചെയ്തു
  rationale: നേരിട്ടുള്ള വാക്കുകളെ അവതരിപ്പിക്കുന്നു; ദൈവം സംസാരിക്കുന്ന ഈ സന്ദർഭത്തിൽ മാന്യവും സ്വാഭാവികവുമായ മലയാള പ്രയോഗമാണിത്.
- source_word: לֵךְ
  choice: പോയി
  rationale: ആജ്ഞാരൂപത്തിന്റെ ലളിതമായ അർഥം നൽകുന്നു; തുടർന്നുള്ള ‘എണ്ണുക’ എന്ന ആജ്ഞയുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: מְנֵה
  choice: എണ്ണുക
  rationale: מנה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘എണ്ണുക’ നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ജനസംഖ്യ കണക്കെടുക്കുക എന്ന അർഥമുണ്ട്.
- source_word: יִשְׂרָאֵל וְאֶת יְהוּדָה
  choice: ഇസ്രായേലിനെയും യെഹൂദയെയും
  rationale: വടക്കൻ-തെക്കൻ ജനസമൂഹങ്ങളെ വേർതിരിക്കുന്ന മൂലപാഠത്തിലെ പേരുകൾ വിശദീകരണവികാസമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: 1 ദിനവൃത്താന്തം 21:1-ലെ സമാന്തരവിവരണവുമായി താരതമ്യപ്പെടുത്തുമ്പോൾ ദാവീദിനെ പ്രേരിപ്പിച്ചതിലെ ദൈവിക പ്രവർത്തകത്വം
  choice: അവൻ ദാവീദിനെ ... പ്രേരിപ്പിച്ചു
  alternative: ആരോ ദാവീദിനെ പ്രേരിപ്പിച്ചു; അല്ലെങ്കിൽ ദിനവൃത്താന്തവുമായി സമന്വയപ്പെടുത്തി ‘സാത്താൻ ദാവീദിനെ പ്രേരിപ്പിച്ചു’
  rationale: וַיָּסֶת എന്ന ക്രിയയുടെ ഏറ്റവും സ്വാഭാവികമായ കർത്താവ് തൊട്ടുമുമ്പുള്ള ‘യഹോവ’ തന്നെയാണ്. അതിനാൽ 1 ദിനവൃത്താന്തം 21:1-നോടുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം വ്യാഖ്യാനത്തിലൂടെ നീക്കാതെ മൂലപാഠത്തിലുള്ളതുപോലെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി. ‘ജ്വലിച്ചു’ എന്നത് ഹീബ്രു രൂപകം നിലനിർത്തുന്നു; ‘അരുളിച്ചെയ്തു’ ദൈവവചനത്തിന് യോജിച്ച ഗൗരവം നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
