source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל יְהוָ֜ה בִּ/רְאֹת֣/וֹ אֶֽת הַ/מַּלְאָ֣ךְ הַ/מַּכֶּ֣ה בָ/עָ֗ם וַ/יֹּ֨אמֶר֙ הִנֵּ֨ה אָנֹכִ֤י חָטָ֨אתִי֙ וְ/אָנֹכִ֣י הֶעֱוֵ֔יתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ תְּהִ֨י נָ֥א יָדְ/ךָ֛ בִּ֖/י וּ/בְ/בֵ֥ית אָבִֽ/י־׀־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: ml
  text: 'ജനത്തെ പ്രഹരിച്ചുകൊണ്ടിരുന്ന ദൂതനെ കണ്ടപ്പോൾ ദാവീദ് യഹോവയോടു പറഞ്ഞു: “ഇതാ, ഞാനാണ് പാപം ചെയ്തത്; ഞാനാണ് തെറ്റു ചെയ്തത്. എന്നാൽ ഈ ആടുകൾ എന്തു ചെയ്തു? അങ്ങയുടെ കൈ എനിക്കും എന്റെ പിതാവിന്റെ കുടുംബത്തിനും എതിരായി വരണമേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്നു പ്രതിനിധീകരിക്കുന്നു.
- source_word: הַמַּלְאָךְ הַמַּכֶּה בָעָם
  choice: ജനത്തെ സംഹരിച്ചുകൊണ്ടിരുന്ന ദൂതൻ
  rationale: מכה എന്ന പങ്കാളിത്തരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തിയും സന്ദർഭത്തിലെ മാരകമായ ബാധയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ദാവീദിന്റെ ഊന്നലോടെയുള്ള കുറ്റസമ്മതം നിലനിർത്തുന്ന ഔപചാരികവും പരിചിതവുമായ പ്രയോഗം.
- source_word: הֶעֱוֵיתִי
  choice: തെറ്റു ചെയ്തു
  rationale: ‘വക്രമായി പ്രവർത്തിച്ചു/അന്യായം ചെയ്തു’ എന്ന ആശയം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; മുൻപുള്ള ‘പാപം ചെയ്തു’ എന്നതിനോടുള്ള സമാന്തരതയും സൂക്ഷിക്കുന്നു.
- source_word: הַצֹּאן
  choice: ഈ ആടുകൾ
  rationale: ജനത്തെ ഇടയന്റെ ആടുകളായി ചിത്രീകരിക്കുന്ന മൂലരൂപകം വിവർത്തനത്തിൽ അതേപടി നിലനിർത്തുന്നു.
- source_word: יָדְךָ
  choice: അങ്ങയുടെ കൈ
  rationale: ദൈവത്തിന്റെ ശിക്ഷാപരമായ ശക്തിയെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: בֵית אָבִי
  choice: എന്റെ പിതൃഭവനം
  rationale: വ്യക്തിയുടെ അപ്പന്റെ ഭൗതികവീടിനേക്കാൾ പിതൃകുടുംബത്തെയും വംശഗൃഹത്തെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ കുറ്റസമ്മതവും ജനത്തിന്റെ നിരപരാധിത്വത്തെക്കുറിച്ചുള്ള അപേക്ഷയും
  choice: “പാപം ചെയ്തതും തെറ്റു ചെയ്തതും ഞാനാണ്. എന്നാൽ ഈ ആടുകൾ എന്തു ചെയ്തു?”
  alternative: ജനത്തെ പൂർണമായി നിരപരാധികളെന്നു വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക
  rationale: വാക്യം ദാവീദിന്റെ ചോദ്യം മാത്രമാണ് രേഖപ്പെടുത്തുന്നത്; ജനത്തിന്റെ സമഗ്രമായ ധാർമിക നിലയെക്കുറിച്ചുള്ള നിഗമനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: “അങ്ങയുടെ കൈ” എന്ന ദൈവിക പ്രവർത്തനരൂപകം
  choice: രൂപകം നിലനിർത്തി
  alternative: “അങ്ങയുടെ ശിക്ഷ” എന്നു വിശദീകരിക്കുക
  rationale: മൂലപാഠത്തിലെ ദൈവിക പ്രവർത്തനത്തിന്റെ ശക്തമായെങ്കിലും വ്യാഖ്യാനസാധ്യതയുള്ള രൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു; ഹീബ്രു കവിതാത്മക രൂപകങ്ങൾ അനാവശ്യമായി വിശദീകരിക്കാതെ സൂക്ഷിച്ചു.
