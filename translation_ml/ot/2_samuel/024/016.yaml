source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יָד֨/וֹ הַ/מַּלְאָ֥ךְ יְרֽוּשָׁלִַם֮ לְ/שַׁחֲתָ/הּ֒ וַ/יִּנָּ֤חֶם יְהוָה֙ אֶל הָ֣/רָעָ֔ה וַ֠/יֹּאמֶר לַ/מַּלְאָ֞ךְ הַ/מַּשְׁחִ֤ית בָּ/עָם֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ הָיָ֔ה עִם גֹּ֖רֶן ה/אורנה הַ/יְבֻסִֽי׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
translation:
  language: ml
  text: 'ദൂതൻ യെരൂശലേമിനെ നശിപ്പിക്കാൻ അതിന്റെ നേരെ കൈ നീട്ടിയപ്പോൾ, യഹോവ ആ ദുരന്തത്തെക്കുറിച്ച് മനസ്സുമാറ്റി[a]. ജനത്തെ നശിപ്പിച്ചുകൊണ്ടിരുന്ന ദൂതനോട് അവിടന്ന് പറഞ്ഞു: “മതി! ഇപ്പോൾ നിന്റെ കൈ പിൻവലിക്കൂ.” യഹോവയുടെ ദൂതൻ യെബൂസ്യനായ അരൗനായുടെ[b] മെതിക്കളത്തിനടുത്ത് ഉണ്ടായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവ ആ ദുരന്തത്തിൽനിന്ന് പിന്മാറി.” എബ്രായപാഠം പദശഃ “ദുരന്തത്തെക്കുറിച്ച് മനസ്സുമാറ്റി” എന്നാണ്; ഇവിടെ רָעָה എന്നത് ധാർമിക തിന്മയെയല്ല, ദുരന്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 1 ദിനവൃത്താന്തം 21:15-ലെ സമാന്തരവിവരണത്തിൽ അരൗനാ ‘ഓർന്നാൻ’ എന്നു വിളിക്കപ്പെടുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: കൈ നീട്ടി
  rationale: ശׁלח + יד എന്ന പ്രയോഗം പ്രവർത്തിക്കാനായി കൈ നീട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിലെ ദൃശ്യബിംബം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמַּלְאָךְ
  choice: ദൂതൻ
  rationale: ഈ സന്ദർഭത്തിൽ ബാധയും ന്യായവിധിയും നടപ്പാക്കുന്ന സ്വർഗീയ ദൂതനാണ് ഉദ്ദേശ്യം.
- source_word: לְשַׁחֲתָהּ
  choice: അതിനെ നശിപ്പിക്കാൻ
  rationale: സ്ത്രീലിംഗ പ്രത്യയം യെരൂശലേമിനെ സൂചിപ്പിക്കുന്നു; שׁחת എന്ന പദത്തിന്റെ വിനാശകരമായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: യഹോവ ആ ദുരന്തത്തിൽനിന്ന് പിന്മാറി
  rationale: നിഫാൽ രൂപത്തിലുള്ള נחם ഇവിടെ പ്രഖ്യാപിച്ച വിനാശനടപടിയിൽനിന്നുള്ള പിന്മാറ്റത്തെ സൂചിപ്പിക്കുന്നു. רָעָה ധാർമിക തിന്മയല്ല, ദുരന്തമാണ്. സ്വാഭാവിക മലയാളത്തിനായി ബന്ധം ‘ദുരന്തത്തിൽനിന്ന്’ എന്നു നൽകി; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: הַמַּשְׁחִית בָּעָם
  choice: ജനത്തെ നശിപ്പിച്ചുകൊണ്ടിരുന്ന
  rationale: വർത്തമാന കൃതന്തം തുടരുന്ന പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ആ സജീവത നിലനിർത്തി.
- source_word: רַב
  choice: മതി!
  rationale: ഇവിടെ ‘മതി’ എന്ന ശക്തമായ ഇടപെടൽവാക്കാണ്; ചുരുക്കത്തിലുള്ള ആജ്ഞാസ്വരം സംരക്ഷിക്കുന്നു.
- source_word: עַתָּה הֶרֶף יָדֶךָ
  choice: ഇപ്പോൾ നിന്റെ കൈ പിൻവലിക്കൂ
  rationale: നടന്നുകൊണ്ടിരിക്കുന്ന നാശപ്രവർത്തനം നിർത്താനുള്ള കല്പനയും കൈയുടെ ദൃശ്യബിംബവും നിലനിർത്തുന്നു.
- source_word: וּמַלְאַךְ יְהוָה
  choice: അപ്പോൾ യഹോവയുടെ ദൂതൻ
  rationale: വാക്യബന്ധം കഥയിലെ അന്നത്തെ സ്ഥിതിയിലേക്കു നീങ്ങുന്നു; ‘യഹോവയുടെ ദൂതൻ’ എന്ന മൂലപാഠത്തിലെ വിശേഷണം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: הָיָה עִם
  choice: അരികിലായിരുന്നു
  rationale: ഈ സ്ഥലസന്ദർഭത്തിൽ עִם സാമീപ്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: גֹּרֶן
  choice: മെതിക്കളം
  rationale: ധാന്യം മെതിക്കുന്ന സ്ഥലത്തിനുള്ള സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം.
- source_word: הָאֹרְנָה
  choice: അരവ്നാ
  rationale: ശമൂവേൽപുസ്തകത്തിലെ പേരുരൂപം ലിപ്യന്തരിച്ചു; ദിനവൃത്താന്തത്തിലെ വ്യത്യസ്ത രൂപം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: וַיִּנָּחֶם יְהוָה എന്ന ദൈവത്തെ മാനുഷികഭാവത്തിൽ വിവരിക്കുന്ന ഭാഷ
  choice: യഹോവ ആ ദുരന്തത്തിൽനിന്ന് പിന്മാറി
  alternative: യഹോവ ആ ദുരന്തത്തെക്കുറിച്ച് മനസ്സുമാറ്റി / അനുതപിച്ചു
  rationale: ന്യായവിധി തുടരുന്നതിൽനിന്നുള്ള യഹോവയുടെ തിരിഞ്ഞുനിൽപ്പാണ് വാക്യം വിവരിക്കുന്നത്. ‘പിന്മാറി’ എന്നത് ദൈവത്തിന് ധാർമിക തെറ്റോ കുറ്റബോധമോ ആരോപിക്കാതെ ആ പ്രവർത്തനപരമായ മാറ്റം വ്യക്തമാക്കുന്നു; അതേസമയം മൂലത്തിലെ മറ്റൊരു പദശഃ വായന അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: מַלְאַךְ יְהוָה എന്ന വ്യക്തിയുടെ തിരിച്ചറിവ്
  choice: യഹോവയുടെ ദൂതൻ
  alternative: ദൈവത്തിന്റെ പ്രത്യക്ഷീകരണം / സൃഷ്ടിക്കപ്പെട്ട സ്വർഗീയ ദൂതൻ
  rationale: വാക്യം നൽകുന്ന പദവി മാത്രം വിവർത്തനം ചെയ്യുന്നു; ആ ദൂതന്റെ കൂടുതൽ കൃത്യമായ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിവ് തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അവിടന്ന്’ യഹോവയെ ആദരപൂർവം സൂചിപ്പിക്കുന്നു. ‘മെതിക്കളം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പരമ്പരാഗത കാർഷികപദമാണ്.
