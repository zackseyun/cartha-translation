id: 2SA.24.8
reference: 2 Samuel 24:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּשֻׁ֖טוּ בְּ/כָל הָ/אָ֑רֶץ וַ/יָּבֹ֜אוּ מִ/קְצֵ֨ה תִשְׁעָ֧ה חֳדָשִׁ֛ים וְ/עֶשְׂרִ֥ים י֖וֹם יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/008.yaml
  text: They traveled throughout all the land, and at the end of nine months and twenty days they came to Jerusalem.
translation:
  language: ml
  text: അവർ ദേശമെങ്ങും സഞ്ചരിച്ച്, ഒൻപത് മാസവും ഇരുപത് ദിവസവും കഴിഞ്ഞ് യെരൂശലേമിലെത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  choice: അവർ ... സഞ്ചരിച്ച്
  rationale: ശׁוּט എന്ന ക്രിയ ഒരു പ്രദേശമാകെ ചുറ്റിസഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ജനസംഖ്യ എടുക്കുന്നതിനായുള്ള യാത്രയുടെ സന്ദർഭത്തിൽ ‘സഞ്ചരിച്ച്’ സ്വാഭാവികവും ലക്ഷ്യരഹിതമായ അലച്ചിൽ എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നതുമാണ്.
- source_word: בְּכָל הָאָרֶץ
  choice: ദേശമെങ്ങും
  rationale: ב + כל + הארץ പ്രദേശത്തിന്റെ മുഴുവൻ വ്യാപ്തിയിലൂടെയുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. ഇവിടെ הארץ ഭൂമിയെയാകെ അല്ല, കണക്കെടുപ്പ് നടത്തിയ ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיָּבֹאוּ ... יְרוּשָׁלִָם
  choice: യെരൂശലേമിൽ മടങ്ങിയെത്തി
  rationale: בוא എന്ന ക്രിയയ്ക്ക് ‘വരുക/എത്തുക’ എന്നർഥമുണ്ട്. മുൻസന്ദർഭത്തിൽ സംഘം യെരൂശലേമിൽനിന്നു പുറപ്പെട്ടതിനാൽ, ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള തിരിച്ചുവരവ് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘മടങ്ങിയെത്തി’ എന്നു നൽകി.
- source_word: מִקְצֵה
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: കാലയളവിന്റെ സമാപനബിന്ദുവാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘കഴിഞ്ഞപ്പോൾ’ എന്നത് ‘അവസാനത്തിൽ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  choice: ഒൻപത് മാസവും ഇരുപത് ദിവസവും
  rationale: എബ്രായത്തിലെ കാലദൈർഘ്യപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יְרוּשָׁלִָם
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
