translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ സംഭവക്രമവും ദേശമാകെയുള്ള സഞ്ചാരത്തിന്റെ സമഗ്രതയും സംരക്ഷിച്ചു; വിശദീകരണപരമായ ദൈവശാസ്ത്ര വ്യാഖ്യാനങ്ങളൊന്നും ചേർത്തിട്ടില്ല.
