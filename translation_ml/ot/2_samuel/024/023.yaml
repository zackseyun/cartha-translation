reference: 2 Samuel 24:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/כֹּ֗ל נָתַ֛ן אֲרַ֥וְנָה הַ/מֶּ֖לֶךְ לַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל הַ/מֶּ֔לֶךְ יְהוָ֥ה אֱלֹהֶ֖י/ךָ יִרְצֶֽ/ךָס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/023.yaml
  text: Araunah the king gave all this to the king[a]. And Araunah said to the king[b], “May Yahweh your God accept you.”
translation:
  language: ml
  text: 'രാജാവായ അരൗന ഇതെല്ലാം രാജാവിനു കൊടുത്തു.[a] അരൗന രാജാവിനോടു പറഞ്ഞു: “നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ സ്വീകരിക്കുമാറാകട്ടെ.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘രാജാവായ അരൗന’ എന്നാണ്. അരൗനയ്ക്ക് രാജപദവി ഉണ്ടായിരുന്നെന്ന ധാരണ ഒഴിവാക്കാൻ ചില പരിഭാഷകൾ ഈ പദം ഒഴിവാക്കുകയോ വേറിട്ടു വ്യാഖ്യാനിക്കുകയോ ചെയ്യുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘നിന്നിൽ പ്രസാദിക്കുമാറാകട്ടെ’ അല്ലെങ്കിൽ ‘നിനക്കു കൃപ കാണിക്കുമാറാകട്ടെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: ഇതെല്ലാം
  rationale: തൊട്ടുമുമ്പ് യാഗത്തിനായി വാഗ്ദാനം ചെയ്ത വസ്തുക്കളുടെ മുഴുവൻ സമുച്ചയത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: נָתַן
  choice: കൊടുത്തു
  rationale: ആഖ്യാനത്തിലെ ഖാതൽ രൂപത്തെ ലളിതമായ ഭൂതകാലമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֲרַוְנָה
  choice: അരൗന
  rationale: ശമൂവേൽപുസ്തകത്തിലെ എബ്രായ പേരിന്റെ മലയാള ലിപ്യന്തരണം; ദിനവൃത്താന്തത്തിലെ ‘ഒർന്നാൻ’ ഇവിടെ കൊണ്ടുവരുന്നില്ല.
- source_word: הַמֶּלֶךְ
  choice: രാജാവായ
  rationale: അരൗനയോടു ചേർന്നുള്ള അസാധാരണമായ രാജപദവി മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַמֶּלֶךְ
  choice: രാജാവിനു
  rationale: ל ഇവിടെ ദാവീദിനെ സാധനങ്ങളുടെ സ്വീകർത്താവായി അടയാളപ്പെടുത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം ദാവീദിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയായി നിലനിർത്തുന്നു.
- source_word: יִרְצֶךָ
  choice: നിന്നെ പ്രസാദത്തോടെ സ്വീകരിക്കുമാറാകട്ടെ
  rationale: רצה സൂചിപ്പിക്കുന്ന അനുകൂലമായ അംഗീകാരവും പ്രസാദവും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ആശംസാത്മകമായ യിക്തോൽ ഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ലിപ്യന്തരം ചെയ്തു.
- issue: അരൗനയ്ക്കു ചേർന്ന ‘രാജാവ്’ എന്ന പദവി നിലനിർത്തണമോ
  choice: ‘രാജാവായ അരൗന’ എന്നു മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘അരൗന’ എന്നു മാത്രം; ‘രാജാവേ, അരൗന...’
  rationale: എബ്രായ വ്യഞ്ജനപാഠം ‘അരൗന രാജാവ്’ എന്നാണ് വായിക്കുന്നത്. സന്ദർഭത്തിൽ അസാധാരണമായാലും അത് മിനുക്കിമാറ്റാതെ പാഠത്തിലെ സംഘർഷം സംരക്ഷിച്ചു.
- issue: יִרְצֶךָ എന്നതിലെ അനുകൂലസ്വീകാര്യതയുടെ പരിധി
  choice: ‘നിന്നെ പ്രസാദത്തോടെ സ്വീകരിക്കുമാറാകട്ടെ’
  alternative: ‘നിന്നിൽ പ്രസാദിക്കുമാറാകട്ടെ’; ‘നിനക്കു കൃപ കാണിക്കുമാറാകട്ടെ’
  rationale: വ്യക്തിയോടുള്ള ദൈവിക പ്രസാദവും അംഗീകാരവും ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ അർത്ഥപരിധി അനാവശ്യമായി ചുരുക്കാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ‘രാജാവായ അരൗന’ എന്ന അസാധാരണ പ്രയോഗം മൂലപാഠനിഷ്ഠയ്ക്കായി നിലനിർത്തി; יִרְצֶךָ എന്നതിന്റെ പ്രസാദവും സ്വീകരണവും ഉൾപ്പെടുന്ന അർത്ഥം വ്യക്തമായ ആശംസാവാക്യമായി നൽകി.
