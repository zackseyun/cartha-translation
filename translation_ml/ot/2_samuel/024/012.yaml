review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the imperative to go and speak, the prophetic formula, the bare Hebrew numeral with a minimally supplied noun, David's selection of one, and the adverse outcome. However, the final phrase “ഞാൻ അതു നിന്നോടു ചെയ്യും” is not idiomatic Malayalam and does not clearly communicate that the chosen judgment will be brought upon David.
  naturalness: “നിന്നോടു ചെയ്യും” is structurally possible only in highly unnatural calqued usage. “അത് നിന്റെമേൽ വരുത്തും” is standard Malayalam for the adverse force required by the context. “ചുമത്തുന്നു” is also more idiomatic and weightier than bare “വെക്കുന്നു” for placing impending punitive matters upon someone.
  terminology: “യഹോവ” appropriately retains the divine name, and “കാര്യങ്ങൾ” properly avoids deciding whether the implied noun should be options or punishments. “ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു” retains an appropriately formal prophetic register.
  issues:
  - severity: medium
    issue: The closing clause is unnatural and unclear in Malayalam.
    rationale: “ഞാൻ അതു നിന്നോടു ചെയ്യും” is a close formal imitation of English “do it to you,” but modern Malayalam would naturally express the adverse result as bringing it upon the person. This is necessary for readable and unambiguous target-language meaning.
  - severity: low
    issue: The wording for laying the three matters upon David is somewhat flat.
    rationale: “വെക്കുന്നു” is understandable, but “ചുമത്തുന്നു” more naturally conveys the force of placing an impending burden/judgment upon someone while preserving the Hebrew imagery.
