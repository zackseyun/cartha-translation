source:
  edition: WLC
  text: הָל֞וֹךְ וְ/דִבַּרְתָּ֣ אֶל דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁלֹ֕שׁ אָנֹכִ֖י נוֹטֵ֣ל עָלֶ֑י/ךָ בְּחַר לְ/ךָ֥ אַֽחַת מֵ/הֶ֖ם וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: ml
  text: 'നീ ചെന്ന് ദാവീദിനോടു പറയുക: “യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ഞാൻ നിന്റെമേൽ മൂന്ന് കാര്യങ്ങൾ ചുമത്തുന്നു.[a] അവയിൽ ഒന്ന് നീതന്നെ തിരഞ്ഞെടുക്കുക; ഞാൻ അത് നിന്റെമേൽ വരുത്തും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘മൂന്ന്’ എന്നു മാത്രമേ ഉള്ളൂ; ഉദ്ദേശിക്കുന്ന നാമം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ടതാണ്. ‘മൂന്ന് കാര്യങ്ങൾ’ എന്നും ‘മൂന്ന് തിരഞ്ഞെടുപ്പുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ
  choice: നീ ചെന്ന് ... പറയുക
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും പൂർണ്ണക്രിയയും ചേർന്ന കല്പനയെ സ്വാഭാവികമായ മലയാള കല്പനാക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ ഔപചാരിക സന്ദേശസൂത്രം നിലനിർത്തുകയും ദൈവനാമം ശീർഷകമായി മാറ്റാതെ നൽകുകയും ചെയ്യുന്നു.
- source_word: שָׁלֹשׁ
  choice: മൂന്നു കാര്യങ്ങൾ
  rationale: എബ്രായത്തിൽ നാമമില്ലാതെ ‘മൂന്ന്’ എന്നു മാത്രമാണുള്ളത്; മലയാളത്തിൽ അർഥം സ്വാഭാവികമാക്കാൻ സന്ദർഭത്തിൽ സൂചിതമായ പൊതുനാമം ചേർത്തു.
- source_word: אָנֹכִי נוֹטֵל עָלֶיךָ
  choice: ഞാൻ നിന്റെമേൽ ... വെക്കുന്നു
  rationale: נטל עם על എന്ന പ്രയോഗത്തിലെ ‘മേൽ വെക്കുക/ചുമത്തുക’ എന്ന ഭാരമുള്ള ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു; വെറും നിർവീര്യമായ തിരഞ്ഞെടുപ്പുകൾ മുന്നിൽ അവതരിപ്പിക്കുന്നു എന്നാക്കി മൃദൂകരിക്കുന്നില്ല.
- source_word: בְּחַר לְךָ אַחַת מֵהֶם
  choice: അവയിൽ ഒന്ന് നീതന്നെ തിരഞ്ഞെടുക്കുക
  rationale: ഭാഗികപ്രയോഗമായ ‘അവയിൽ ഒന്ന്’ എന്നതും לְךָ സൂചിപ്പിക്കുന്ന ദാവീദിന്റെ വ്യക്തിപരമായ ഉത്തരവാദിത്വവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: ഞാൻ അതു നിന്നോടു ചെയ്യും
  rationale: ന്യായവിധിയുടെ പ്രതികൂല സന്ദർഭത്തിൽ לְךְ എന്നത് ‘നിനക്കുവേണ്ടി’ എന്നു തെറ്റിദ്ധരിപ്പിക്കാതിരിക്കാനും മൂലത്തിലെ പൊതുവായ עשׂה എന്ന ക്രിയയെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘വരുത്തും’ എന്നു മാറ്റാതിരിക്കാനും ഈ രൂപം തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- issue: മൂന്ന് എന്നത് തിരഞ്ഞെടുപ്പുകളോ ശിക്ഷകളോ എന്നു വ്യക്തമാക്കൽ
  choice: പൊതുവായ ‘കാര്യങ്ങൾ’
  alternative: ‘തിരഞ്ഞെടുപ്പുകൾ’ അല്ലെങ്കിൽ ‘ശിക്ഷകൾ’
  rationale: സന്ദർഭം ന്യായവിധികളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ നാമം തുറന്നുപറയുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ അർഥം മുൻകൂട്ടി നിർണ്ണയിക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രവാചകസന്ദേശശൈലി ഉപയോഗിച്ചു. ‘അരുളിച്ചെയ്യുന്നു’ എന്നത് ഔപചാരിക ദൈവവചനസൂത്രത്തിന് യോജിച്ചെങ്കിലും സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പദമാണ്; ശേഷിക്കുന്ന വാക്യം ലളിതമായി സൂക്ഷിച്ചു.
