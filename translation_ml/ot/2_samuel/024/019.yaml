id: 2SA.24.19
reference: 2 Samuel 24:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַל דָּוִד֙ כִּ/דְבַר גָּ֔ד כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/019.yaml
  text: So David went up according to the word of Gad, just as Yahweh had commanded.
translation:
  language: ml
  text: യാഹ്‌വേ കൽപിച്ചതുപോലെ, ഗാദിന്റെ വാക്കനുസരിച്ച് ദാവീദ് കയറിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയിലെ മുകളിലേക്കുള്ള ദിശാസൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ ആഖ്യാനഭാഷയുമാണ്.
- source_word: דָּוִד
  choice: ദാവീദ്
  rationale: മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: כִּדְבַר
  choice: വാക്കനുസരിച്ച്
  rationale: כ + דבר എന്ന ഘടനയിലെ ‘വാക്ക്’ എന്ന ഘടകം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് ‘പറഞ്ഞതനുസരിച്ച്’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גָּד
  choice: ഗാദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: כַּאֲשֶׁר
  choice: പോലെ
  rationale: ഗാദിന്റെ വാക്കും യഹോവയുടെ കല്പനയും തമ്മിലുള്ള അനുരൂപത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചതുപോലെ
  rationale: ‘കല്പിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; പൂർത്തികൃതരൂപം ദാവീദിന്റെ പ്രവൃത്തിക്കു മുമ്പുള്ള കല്പനയെ സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു. മലയാള വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണമാണ് ‘യഹോവ’; ‘യാഹ്‌വേ’ സാധ്യതയുള്ള മറ്റൊരു ഉച്ചാരണാധിഷ്ഠിത രൂപമാണ്.
translation_notes:
  register: ആധുനികവും മാന്യവും ലളിതവുമായ ആഖ്യാനശൈലി. ‘കയറിച്ചെന്നു’ എന്ന രൂപം മൂലത്തിലെ ദിശാസൂചന കാത്തുസൂക്ഷിക്കുന്നു; വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ഇടവാക്യം കോമകളാൽ വേർതിരിച്ചു.
