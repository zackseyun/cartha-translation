  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛ד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד נִפְּלָה נָּ֤א בְ/יַד יְהוָה֙ כִּֽי רַבִּ֣ים רחמ/ו וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് ഗാദിനോടു പറഞ്ഞു: “ഞാൻ അത്യന്തം വിഷമത്തിലാണ്. നാം, ദയവായി, യഹ്‌വേയുടെ കൈയിൽ വീഴട്ടെ; കാരണം, അവിടുത്തെ കരുണകൾ അനവധിയാണ്.[a] എന്നാൽ മനുഷ്യന്റെ കൈയിൽ[b] ഞാൻ വീഴാതിരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, “അവിടുത്തെ കരുണ സമൃദ്ധമാണ്.” എബ്രായത്തിൽ അക്ഷരാർഥം: “അവിടുത്തെ കരുണകൾ അനവധിയാണ്.”'
    reason: lexical_alternative
  - marker: b
    text: “മനുഷ്യന്റെ കൈയിൽ” എന്നത് മനുഷ്യരുടെ അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിൽ എന്നർഥം.
    reason: idiom_explanation
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: ഞാൻ അത്യന്തം വിഷമത്തിലായിരിക്കുന്നു
  rationale: לִי സഹിതമുള്ള צַר വ്യക്തിപരമായ കടുത്ത വിഷമവും പ്രതിസന്ധിയും പ്രകടിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അതിന്റെ വികാരതീവ്രത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נִפְּלָה נָּא
  choice: നാം ... കൈയിൽത്തന്നെ വീഴട്ടെ
  rationale: ഒന്നാം പുരുഷ ബഹുവചന cohortative ആയ נִפְּלָה ദാവീദ് ജനത്തോടൊപ്പം തന്നെ വിധിക്കു വിധേയനായി കാണുന്നതു നിലനിർത്തുന്നു. נָאയുടെ അഭ്യർഥനാഭാവം മലയാളത്തിലെ ആശംസാ-അനുവാദരൂപത്തിലും ‘തന്നെ’ എന്ന ഊന്നലിലും സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: בְיַד יְהוָה
  choice: യഹോവയുടെ കൈയിൽ
  rationale: ‘കൈയിൽ വീഴുക’ എന്ന രൂപകം ഒരാളുടെ അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിലാകുക എന്ന എബ്രായ ആശയം മലയാളത്തിലും വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകവും സ്വാഭാവികവുമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: כִּי רַבִּים רחמיו
  choice: കാരണം, അവിടുത്തെ കരുണകൾ അനവധിയാണ്
  rationale: ‘അവന്റെ കരുണകൾ അനവധിയാണ്’ എന്ന എബ്രായ ബഹുവചനഘടന നിലനിർത്തിക്കൊണ്ട്, ദൈവത്തെ സൂചിപ്പിക്കാൻ മാന്യമായ മലയാള സർവനാമം ഉപയോഗിക്കുന്നു.
- source_word: וּבְיַד אָדָם
  choice: എന്നാൽ മനുഷ്യന്റെ കൈയിൽ
  rationale: אָדָם ഇവിടെ മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഏകവചനമാണ്; ‘മനുഷ്യന്റെ’ എന്നത് ദൈവത്തിന്റെ കൈയും മനുഷ്യാധികാരവും തമ്മിലുള്ള വിരോധം നിലനിർത്തുന്നു.
- source_word: אַל אֶפֹּלָה
  choice: ഞാൻ വീഴാതിരിക്കട്ടെ
  rationale: നിഷേധകണത്തോടുകൂടിയ ഒന്നാം പുരുഷ ക്രിയാരൂപം ദാവീദിന്റെ ആഗ്രഹവും അപേക്ഷയും പ്രകടിപ്പിക്കുന്നു; ‘വീഴാതിരിക്കട്ടെ’ അതിന്റെ volitional ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ദൈവനാമം നിലനിർത്തുന്നു. മലയാളത്തിലെ പ്രസിദ്ധമായ രൂപം ‘യഹോവ’യാണ്.
- issue: אָדָם എന്നതിന്റെ പൊതുവായ അർഥം
  choice: മനുഷ്യൻ
  alternative: മനുഷ്യർ / മനുഷ്യരുടെ കൈകൾ
  rationale: എബ്രായത്തിലെ പൊതുവാചക ഏകവചനവും യഹോവയോടുള്ള നേരിട്ടുള്ള അലങ്കാരപരമായ വിരോധവും ‘മനുഷ്യൻ’ നിലനിർത്തുന്നു; ഇത് ഒരു പ്രത്യേക പുരുഷനെ മാത്രമല്ല, മനുഷ്യാധികാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: നാം വീഴട്ടെ / ഞാൻ വീഴട്ടെ എന്ന സംഖ്യാവ്യത്യാസം
  choice: ആദ്യഭാഗത്ത് ‘നാം’, അവസാനഭാഗത്ത് ‘ഞാൻ’
  alternative: രണ്ടിടത്തും ‘ഞാൻ’
  rationale: മൂലപാഠത്തിലെ ആദ്യക്രിയ ഒന്നാം പുരുഷ ബഹുവചനവും അവസാനക്രിയ ഒന്നാം പുരുഷ ഏകവചനവുമാണ്. ഈ അസമത്വം വ്യാഖ്യാനിച്ച് ഒത്താക്കാതെ അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവിടുത്തെ’ എന്ന മാന്യസർവനാമം ദൈവത്തെ സൂചിപ്പിക്കുന്നു. ആദ്യത്തെ ബഹുവചനവും അവസാനത്തെ ഏകവചനവും മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരവും വാചകപരവുമായ പിരിമുറുക്കം പരിഹരിക്കാതെ സംരക്ഷിച്ചിരിക്കുന്നു.
