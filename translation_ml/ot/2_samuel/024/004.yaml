  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֶּחֱזַ֤ק דְּבַר הַ/מֶּ֨לֶךְ֙ אֶל יוֹאָ֔ב וְ/עַ֖ל שָׂרֵ֣י הֶ/חָ֑יִל וַ/יֵּצֵ֨א יוֹאָ֜ב וְ/שָׂרֵ֤י הַ/חַ֨יִל֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ לִ/פְקֹ֥ד אֶת הָ/עָ֖ם אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/004.yaml
  text: But the king’s word prevailed against Joab and against the commanders of the army, so Joab and the commanders of the army went out from before the king to count the people of Israel.
translation:
  language: ml
  text: എന്നാൽ രാജാവിന്റെ വാക്ക് യോവാബിനും സൈന്യാധിപന്മാർക്കും എതിരായി പ്രാബല്യം നേടി. അതുകൊണ്ട് യോവാബും സൈന്യാധിപന്മാരും ഇസ്രായേൽജനത്തെ എണ്ണിത്തിട്ടപ്പെടുത്താൻ രാജസന്നിധിയിൽനിന്ന് പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק דְּבַר הַמֶּלֶךְ
  choice: രാജാവിന്റെ വാക്ക് ... എതിരായി പ്രാബല്യം നേടി
  rationale: חזק എന്ന ക്രിയയുടെ ‘മേൽക്കൈ നേടുക/പ്രാബല്യം നേടുക’ എന്ന ആശയവും, തുടർന്നുള്ള אֶל/עַל ഘടനയിലെ എതിർപ്പിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: שָׂרֵי הֶחָיִל
  choice: സൈന്യാധിപന്മാർ
  rationale: ഇവിടെ חַיִל സൈന്യത്തെയും שָׂרִים അതിന്റെ മേലധികാരികളെയും സൂചിപ്പിക്കുന്നു; സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: מִלִּפְנֵי הַמֶּלֶךְ
  choice: രാജസന്നിധിയിൽനിന്ന്
  rationale: ‘രാജാവിന്റെ മുമ്പിൽനിന്ന്’ എന്ന സ്ഥലസംബന്ധിയായ അർഥം dignified Malayalam-ൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לִפְקֹד אֶת־הָעָם אֶת־יִשְׂרָאֵל
  choice: ഇസ്രായേൽജനത്തെ എണ്ണിത്തിട്ടപ്പെടുത്താൻ
  rationale: פקד എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ ജനസംഖ്യാ/സൈനിക കണക്കെടുപ്പ് അർഥം വ്യക്തമാക്കുന്നു; ‘ഇസ്രായേൽ’ എന്നത് ‘ജനത്തെ’ വിശദീകരിക്കുന്നതായി ചേർത്ത് നൽകുന്നു.
theological_decisions:
- issue: രാജകൽപ്പന യോവാബിന്റെയും സൈന്യാധിപന്മാരുടെയും എതിർപ്പിനെ മറികടന്നത്
  choice: എതിരായി പ്രാബല്യം നേടി
  alternative: മേൽ പ്രബലപ്പെട്ടു
  rationale: മൂലപാഠത്തിലെ ബലപ്രയോഗാത്മകമായ സംഘർഷഭാവം മായ്ച്ചുകളയാതെ, രാജാവിന്റെ വാക്കാണ് ഒടുവിൽ മേൽക്കൈ നേടിയതെന്ന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ഹീബ്രുവിലെ ആവർത്തനം ആവശ്യമായത്ര നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ അമിതഭാരം ഒഴിവാക്കി. വാക്യങ്ങൾ രണ്ടായി വിഭജിച്ച് ഫലബന്ധം ‘അതുകൊണ്ട്’ എന്നു വ്യക്തമാക്കി.
