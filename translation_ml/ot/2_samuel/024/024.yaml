  revision_rationale: മൂലപാഠത്തിന്റെ അർഥത്തിൽ മാറ്റം വരുത്താതെ, അരൗനാ എന്ന വ്യക്തിനാമത്തിന്റെ അവസാന സ്വരം പുനഃസ്ഥാപിച്ചു. חִנָּם സംബന്ധിച്ച അടിക്കുറിപ്പ് മലയാളത്തിൽ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘വെറുതെയുള്ള’ ഒഴിവാക്കി, സൗജന്യമായി/വിലകൊടുക്കാതെ എന്ന പ്രസക്തമായ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് അടയാളങ്ങൾ അവ സൂചിപ്പിക്കുന്ന പദങ്ങളോടു ശരിയായി ചേർന്നിരിക്കുന്നു.
