source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל אֲרַ֗וְנָה לֹ֚א כִּֽי קָנ֨וֹ אֶקְנֶ֤ה מֵ/אֽוֹתְ/ךָ֙ בִּ/מְחִ֔יר וְ/לֹ֧א אַעֲלֶ֛ה לַ/יהוָ֥ה אֱלֹהַ֖/י עֹל֣וֹת חִנָּ֑ם וַ/יִּ֨קֶן דָּוִ֤ד אֶת הַ/גֹּ֨רֶן֙ וְ/אֶת הַ/בָּקָ֔ר בְּ/כֶ֖סֶף שְׁקָלִ֥ים חֲמִשִּֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
translation:
  language: ml
  text: 'എന്നാൽ രാജാവ് അരൗനായോടു പറഞ്ഞു: “അല്ല; നിന്നിൽനിന്ന് ഞാൻ അതു വിലകൊടുത്തുതന്നെ വാങ്ങും. വിലയൊന്നും കൊടുക്കാതെ കിട്ടിയ ഹോമയാഗങ്ങൾ[a] എന്റെ ദൈവമായ യഹ്വേക്കു ഞാൻ അർപ്പിക്കുകയില്ല.” അങ്ങനെ ദാവീദ് മെതിക്കളവും കന്നുകാലികളെയും[b] അമ്പത് ശേക്കെൽ വെള്ളിക്കു വാങ്ങി.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “വിലകൊടുക്കാതെയുള്ള ഹോമയാഗങ്ങൾ” അഥവാ “സൗജന്യമായി കിട്ടിയ ഹോമയാഗങ്ങൾ.”'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “കാളകളെയും.” എബ്രായപദം കന്നുകാലികളെ കൂട്ടമായി സൂചിപ്പിക്കാം; പണിക്കും യാഗത്തിനും ഉപയോഗിച്ചിരുന്ന കാളകളെ കൂടുതൽ പ്രത്യേകമായും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 1 ദിനവൃത്താന്തം 21:25-ൽ ദാവീദ് ആ സ്ഥലത്തിനായി അറുനൂറ് ശേക്കെൽ സ്വർണം കൊടുക്കുന്നു; ഇവിടെ മെതിക്കളത്തിനും കന്നുകാലികൾക്കും അമ്പത് ശേക്കെൽ വെള്ളി കൊടുത്തതായി പ്രത്യേകം പറയുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: אֲרַוְנָה
  choice: അരവ്ന
  rationale: ഈ വാക്യത്തിലെ എബ്രായ പേരിന്റെ രൂപം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു; ദിനവൃത്താന്തങ്ങളിലെ സമാന്തരഭാഗത്തുള്ള ‘ഒർനാൻ’ എന്ന രൂപം ഇവിടെ കൊണ്ടുവന്നിട്ടില്ല.
- source_word: קָנוֹ אֶקְנֶה
  choice: ഞാൻ അതു വിലകൊടുത്തുതന്നെ വാങ്ങും
  rationale: ക്രിയയോടൊപ്പം വരുന്ന infinitive absolute വാങ്ങാനുള്ള ദാവീദിന്റെ ഉറച്ച തീരുമാനം ഊന്നിപ്പറയുന്നു. ‘തന്നെ’ ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘അതു’ സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചതാണ്.
- source_word: מֵאֹתְךָ בִּמְחִיר
  choice: നിന്നിൽനിന്ന് ... വിലകൊടുത്ത്
  rationale: വാങ്ങൽ അരവ്നയിൽനിന്നാണെന്നും അത് പ്രതിഫലം നൽകി നടത്തുന്ന ഇടപാടാണെന്നും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: אַעֲלֶה
  choice: അർപ്പിക്കുകയില്ല
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗങ്ങളോടൊപ്പം വരുമ്പോൾ യാഗം അർപ്പിക്കുക എന്ന അർഥമാണ്; ആചാരപരമായ അർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: לַיהוָה אֱלֹהַי
  choice: എന്റെ ദൈവമായ യഹ്വേക്കു
  rationale: ദൈവനാമം ലിപ്യന്തരണം ചെയ്തും ഒന്നാംപുരുഷ ഉടമസ്ഥപ്രത്യയം സംരക്ഷിച്ചും നൽകിയിരിക്കുന്നു.
- source_word: עֹלוֹת
  choice: ഹോമയാഗങ്ങൾ
  rationale: യാഗപീഠത്തിൽ പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും മനസ്സിലാകുന്നതുമായ മലയാള പദം.
- source_word: חִנָּם
  choice: വിലയൊന്നും കൊടുക്കാതെ കിട്ടിയ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘വെറുതെ/സൗജന്യമായി’ എന്നാണ്. ഈ സന്ദർഭത്തിൽ തനിക്കു ചെലവില്ലാതെ ലഭിച്ച യാഗവസ്തുക്കൾ എന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הַגֹּרֶן
  choice: മെതിക്കളം
  rationale: ധാന്യം മെതിക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന കൃത്യവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ കാർഷികപദം.
- source_word: הַבָּקָר
  choice: കന്നുകാലികൾ
  rationale: എബ്രായ കൂട്ടനാമത്തിന്റെ വിശാലമായ അർഥം സംരക്ഷിക്കുന്നു; ‘കാളകൾ’ എന്ന കൂടുതൽ പ്രത്യേകമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  choice: അമ്പത് ശേക്കെൽ വെള്ളിക്കു
  rationale: വാങ്ങൽവിലയും വെള്ളിയുടെ തൂക്കമൂല്യവും സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അതിനെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: חִנָּם എന്നതിലെ വ്യക്തിപരമായ ചെലവിന്റെ സൂചന
  choice: വിലയൊന്നും കൊടുക്കാതെ കിട്ടിയ
  alternative: വെറുതെയുള്ള; സൗജന്യമായ
  rationale: ദാവീദ് യാഗം അർപ്പിക്കുന്നതിനുമുമ്പ് വസ്തുക്കൾ വാങ്ങണമെന്നു പറയുന്ന തൽസന്ദർഭം വ്യക്തിപരമായ ചെലവിനെ സൂചിപ്പിക്കുന്നു. എന്നിരുന്നാലും പദത്തിന്റെ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ഊന്നൽ ‘തന്നെ’ കൊണ്ടും, യാഗസംബന്ധിയായ സാങ്കേതികപദങ്ങൾ ‘ഹോമയാഗം’, ‘മെതിക്കളം’ എന്നിവ കൊണ്ടും സംരക്ഷിച്ചു. മൂലപാഠത്തിലെ അർഥവ്യാപ്തി ചുരുക്കാതെ ആവശ്യമായ പകരവായനകൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
