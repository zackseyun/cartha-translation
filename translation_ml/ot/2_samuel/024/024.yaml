  source_fidelity: 'വാക്യത്തിന്റെ മുഖ്യാർഥം എബ്രായപാഠത്തോടു വിശ്വസ്തമാണ്: രാജാവിന്റെ ഊന്നിപ്പറഞ്ഞ വാങ്ങൽ, വിലനൽകൽ, ചെലവില്ലാതെ ലഭിച്ച വസ്തുക്കളിൽനിന്ന് ഹോമയാഗം അർപ്പിക്കില്ലെന്ന പ്രഖ്യാപനം, മെതിക്കളവും കന്നുകാലികളും, അമ്പതു ശേക്കെൽ വെള്ളി എന്നിവയെല്ലാം സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ אֲרַוְנָה എന്ന പേരിന്റെ അവസാനം വരുന്ന സ്വരധ്വനി നിലവിലെ ‘അരവ്ന’യിൽ നഷ്ടമായിരിക്കുന്നു.'
  naturalness: ശൈലി ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘വിലകൊടുത്തുതന്നെ’, ‘മെതിക്കളം’, ‘ഹോമയാഗങ്ങൾ’ എന്നിവ സന്ദർഭോചിതമാണ്. പേര് ‘അരൗനാ’ എന്ന് നൽകുന്നത് മലയാള ഉച്ചാരണത്തിനും മൂലരൂപത്തിനും കൂടുതൽ യോജിക്കും.
  terminology: ‘യഹ്വേ’, ‘എന്റെ ദൈവമായ’, ‘ഹോമയാഗങ്ങൾ’, ‘മെതിക്കളം’, ‘കന്നുകാലികൾ’, ‘ശേക്കെൽ വെള്ളി’ എന്നീ തിരഞ്ഞെടുപ്പുകൾ ഉചിതമാണ്. חִנָּם-ന്റെ സന്ദർഭാർഥം പ്രധാനപാഠത്തിൽ നന്നായി നൽകിയിട്ടുണ്ട്; അടിക്കുറിപ്പിൽ ‘വെറുതെയുള്ള’ എന്ന പദത്തിന് ‘നിഷ്ഫലമായ’ എന്ന അനാവശ്യ നിഴലർഥം വരാവുന്നതിനാൽ അത് കൂടുതൽ കൃത്യമായി തിരുത്തിയിരിക്കുന്നു.
  issues:
  - severity: low
    issue: അരവ്ന എന്ന പേരിലെ അവസാന സ്വരധ്വനി നഷ്ടപ്പെട്ടിരിക്കുന്നു.
    rationale: എബ്രായ אֲרַוְנָה (Araunah) യുടെ അവസാനം -āh ധ്വനിയുണ്ട്. ‘അരൗനാ’ അതിനെ സ്വാഭാവിക മലയാളലിപ്യന്തരണത്തിൽ സംരക്ഷിക്കുന്നു.
  - severity: low
    issue: അടിക്കുറിപ്പിലെ ‘വെറുതെയുള്ള ഹോമയാഗങ്ങൾ’ എന്ന പദപ്രയോഗം അസ്പഷ്ടമാണ്.
    rationale: മലയാളത്തിൽ ‘വെറുതെയുള്ള’ എന്നതിന് ‘നിഷ്ഫലമായ’ എന്ന അർഥനിഴലും വരാം. ഇവിടെ חִנָּם എന്നത് സൗജന്യമായി/വിലകൊടുക്കാതെ ലഭിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
  revised_text: 'എന്നാൽ രാജാവ് അരൗനായോടു പറഞ്ഞു: “അല്ല; നിന്നിൽനിന്ന് ഞാൻ അതു വിലകൊടുത്തുതന്നെ വാങ്ങും. വിലയൊന്നും കൊടുക്കാതെ കിട്ടിയ ഹോമയാഗങ്ങൾ[a] എന്റെ ദൈവമായ യഹ്വേക്കു ഞാൻ അർപ്പിക്കുകയില്ല.” അങ്ങനെ ദാവീദ് മെതിക്കളവും കന്നുകാലികളെയും[b] അമ്പത് ശേക്കെൽ വെള്ളിക്കു വാങ്ങി.[c]'
  revised_footnotes:
