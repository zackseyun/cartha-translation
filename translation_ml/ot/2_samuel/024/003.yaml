revisions:
- from: 'എന്നാൽ യോവാബ് രാജാവിനോടു പറഞ്ഞു: “നിന്റെ ദൈവമായ യഹോവ ഇപ്പോഴുള്ളതിനെക്കാൾ നൂറിരട്ടിയായി ജനത്തെ വർധിപ്പിക്കട്ടെ; എന്റെ യജമാനനായ രാജാവിന്റെ കണ്ണുകൾ അതു കാണുകയും ചെയ്യട്ടെ.[a] എന്നാൽ എന്റെ യജമാനനായ രാജാവ് ഈ കാര്യത്തിൽ ആനന്ദിക്കുന്നത് എന്തിന്?”'
  to: 'എന്നാൽ യോവാബ് രാജാവിനോടു പറഞ്ഞു: “നിന്റെ ദൈവമായ യഹ്‌വേ ഇപ്പോഴുള്ളതിനെക്കാൾ നൂറിരട്ടിയായി ജനത്തെ വർധിപ്പിക്കട്ടെ; എന്റെ യജമാനനായ രാജാവിന്റെ കണ്ണുകൾ അതു കാണുകയും ചെയ്യട്ടെ.[a] എന്നാൽ എന്റെ യജമാനനായ രാജാവ് ഈ കാര്യം ആഗ്രഹിക്കുന്നത് എന്തിനാണ്?”'
