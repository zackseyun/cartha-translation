source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יוֹאָ֜ב אֶל הַ/מֶּ֗לֶךְ וְ/יוֹסֵ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֶל הָ/עָ֜ם כָּ/הֵ֤ם וְ/כָ/הֵם֙ מֵאָ֣ה פְעָמִ֔ים וְ/עֵינֵ֥י אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ רֹא֑וֹת וַ/אדֹנִ֣/י הַ/מֶּ֔לֶךְ לָ֥/מָּה חָפֵ֖ץ בַּ/דָּבָ֥ר הַ/זֶּֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
translation:
  language: ml
  text: 'എന്നാൽ യോവാബ് രാജാവിനോടു പറഞ്ഞു: “നിന്റെ ദൈവമായ യഹ്‌വേ ഇപ്പോഴുള്ളതിനെക്കാൾ നൂറിരട്ടിയായി ജനത്തെ വർധിപ്പിക്കട്ടെ; എന്റെ യജമാനനായ രാജാവിന്റെ കണ്ണുകൾ അതു കാണുകയും ചെയ്യട്ടെ.[a] എന്നാൽ എന്റെ യജമാനനായ രാജാവ് ഈ കാര്യം ആഗ്രഹിക്കുന്നത് എന്തിനാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “എന്റെ യജമാനനായ രാജാവിന്റെ കണ്ണുകൾ കാണട്ടെ.” ഹീബ്രുവിൽ എന്താണ് കാണുന്നതെന്ന കർമം വ്യക്തമാക്കിയിട്ടില്ല; ജനത്തിന്റെ ഈ വർധന രാജാവ് ജീവിച്ചിരിക്കെ കാണട്ടെ എന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; സന്ദർഭത്തിൽ യോവാബിന്റെ വാക്കുകൾ രാജകല്പനയോടുള്ള എതിർപ്രതികരണമായതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וְיוֹסֵף
  choice: വർധിപ്പിക്കട്ടെ
  rationale: ഇവിടെ ക്രിയ ആശംസയോ അനുഗ്രഹപ്രാർത്ഥനയോ സൂചിപ്പിക്കുന്ന ജസ്സീവ് ഭാവത്തിലാണ്.
- source_word: אֶל הָעָם
  choice: ജനത്തെ
  rationale: עָם എന്ന വിശാലമായ പദം ജനതയെയോ ജനങ്ങളെയോ സൂചിപ്പിക്കുന്നു; സൈന്യം എന്നു ചുരുക്കി നിർവചിക്കുന്നില്ല.
- source_word: כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  choice: ഇപ്പോഴുള്ളതിനെക്കാൾ നൂറിരട്ടിയായി
  rationale: നിലവിലുള്ള ജനസംഖ്യയുടെ നൂറിരട്ടി എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: രാജസദസ്സിലെ ആദരസൂചക അഭിസംബോധന മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: חָפֵץ
  choice: ആനന്ദിക്കുന്നത്
  rationale: ആഗ്രഹിക്കുക, പ്രസാദിക്കുക, താത്പര്യപ്പെടുക എന്നീ അർഥസാധ്യതകളുള്ള പദത്തിന്റെ ശക്തമായ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: രാജാവ് കാണേണ്ടതിന്റെ പരോക്ഷ കർമം
  choice: അതു
  alternative: അവരെ / കർമം പറയാതിരിക്കുക
  rationale: ഹീബ്രുവിൽ കർമം പരോക്ഷമാണ്. വർധിച്ച ജനത്തെ രാജാവ് നേരിൽ കാണണമെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘അതു’ ചേർക്കുന്നു; കുറിപ്പിൽ മൂലത്തിലെ പരോക്ഷത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജസദസ്സിലെ ആദരഭാഷ നിലനിർത്തിയിട്ടും അനാവശ്യമായി പുരാതനശൈലി സ്വീകരിച്ചിട്ടില്ല.
