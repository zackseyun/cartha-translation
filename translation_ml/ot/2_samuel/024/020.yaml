source:
  edition: WLC
  text: וַ/יַּשְׁקֵ֣ף אֲרַ֗וְנָה וַ/יַּ֤רְא אֶת הַ/מֶּ֨לֶךְ֙ וְ/אֶת עֲבָדָ֔י/ו עֹבְרִ֖ים עָלָ֑י/ו וַ/יֵּצֵ֣א אֲרַ֔וְנָה וַ/יִּשְׁתַּ֧חוּ לַ/מֶּ֛לֶךְ אַפָּ֖י/ו אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/020.yaml
  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
translation:
  language: ml
  text: അരവ്നാ പുറത്തേക്കു നോക്കിയപ്പോൾ രാജാവും അവന്റെ സേവകരും തന്റെ നേരെ വരുന്നതു കണ്ടു.[a] അപ്പോൾ അരവ്നാ പുറത്തേക്കു ചെന്ന്, മുഖം നിലത്തുതൊടുമാറ് രാജാവിന്റെ മുമ്പിൽ കുനിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ അരികിലൂടെ കടന്നുപോകുന്നത്” എന്നും “തന്നെ സമീപിക്കുന്നത്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം രാജാവും സേവകരും അരവ്നായുമായി ബന്ധപ്പെട്ട് നീങ്ങുന്നതിനെ അക്ഷരാർഥത്തിൽ വിവരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: പുറത്തേക്കു നോക്കിയപ്പോൾ
  rationale: ഒരു സ്ഥാനത്തുനിന്നോ തുറസ്സിലൂടെയോ പുറത്തേക്കു നോക്കുക എന്ന ക്രിയയുടെ പ്രത്യേക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: മുൻക്രിയയ്ക്കു പിന്നാലെയുള്ള എബ്രായ ആഖ്യാനക്രമം ‘നോക്കിയപ്പോൾ ... കണ്ടു’ എന്ന രൂപത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: עֲבָדָיו
  choice: അവന്റെ സേവകർ
  rationale: രാജകീയ സന്ദർഭത്തിൽ രാജാവിനെ അനുഗമിക്കുന്ന സേവകരെയും പരിചാരകരെയും ഉൾക്കൊള്ളാവുന്ന നേരിട്ടുള്ള പദപ്രയോഗമാണിത്.
- source_word: עֹבְרִים עָלָיו
  choice: തന്റെ നേരെ വരുന്നത്
  rationale: עבר എന്ന പങ്കാളിക്രിയയും על എന്ന പൂർവപ്രത്യയവും ചേർന്ന പ്രയോഗം അരവ്നായുമായി ബന്ധപ്പെടുത്തി നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അവർ അവന്റെ മെതിക്കളത്തിലേക്കു വരുന്നതിനാൽ ഈ വായന സ്വാഭാവികമാണ്. പ്രയോഗത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וַיֵּצֵא
  choice: പുറത്തേക്കു ചെന്ന്
  rationale: יצא എന്ന ക്രിയയുടെ സാധാരണ അർഥം നൽകുകയും അരവ്നാ അകത്തുനിന്നോ തന്റെ സ്ഥലത്തുനിന്നോ പുറത്തുവരുന്നതായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּשְׁתַּחוּ
  choice: കുനിഞ്ഞു
  rationale: മനുഷ്യരാജാവിനോടുള്ള ആദരസൂചകമായ നമസ്കാരത്തിന്റെ ശരീരചലനം വ്യക്തമാക്കുന്നു; ദൈവാരാധന എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: אַפָּיו אָרְצָה
  choice: മുഖം നിലത്തുതൊടുമാറ്
  rationale: മുഖം ഭൂമിയിലേക്കാക്കി പൂർണമായി കുനിയുന്ന ഭാവം സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אֲרַוְנָה
  choice: അരവ്നാ
  rationale: ശമൂവേലിലെ എബ്രായ നാമരൂപത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു; ദിനവൃത്താന്തങ്ങളിലെ സമാന്തരനാമമായ ‘ഒർന്നാൻ’ ഇവിടെ കൊണ്ടുവരുന്നില്ല.
theological_decisions:
- issue: രാജാവിന്റെ മുമ്പിലുള്ള അരവ്നായുടെ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: മനുഷ്യരാജാവിനോടുള്ള ആദരസൂചകമായ കുനിയൽ
  alternative: രാജാവിനെ ആരാധിച്ചു
  rationale: וַיִּשְׁתַּחוּ എന്ന ക്രിയയ്ക്ക് ആരാധനയെയും ആദരപൂർവമായ സാഷ്ടാംഗനമസ്കാരത്തെയും സൂചിപ്പിക്കാനാകും. ഇവിടെ കർമം മനുഷ്യരാജാവായ ദാവീദായതിനാൽ ശാരീരിക പ്രവൃത്തി മാത്രം വ്യക്തമാക്കുന്ന ‘കുനിഞ്ഞു’ എന്ന പരിഭാഷ ദൈവാരാധനയെ സൂചിപ്പിക്കാതെ അർഥം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘മുഖം നിലത്തുതൊടുമാറ്’ എന്ന പ്രയോഗം കുനിയലിന്റെ പൂർണത വ്യക്തമാക്കുന്നു; [a] മുഖ്യവാക്യത്തിൽ നിർബന്ധമായി ഉൾപ്പെടുത്തി.
