base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
translation:
  language: ml
  text: അങ്ങയുടെ ദാസൻ മടങ്ങിപ്പോകാൻ ദയവായി അനുവദിക്കണമേ; ഞാൻ എന്റെ സ്വന്തം പട്ടണത്തിൽ, എന്റെ അപ്പന്റെയും അമ്മയുടെയും കല്ലറയ്ക്കരികെ മരിക്കട്ടെ.[a] എന്നാൽ ഇതാ, അങ്ങയുടെ ദാസനായ കിംഹാം; അവൻ എന്റെ യജമാനനായ രാജാവിനോടൊപ്പം അക്കരെ കടക്കട്ടെ. അങ്ങയുടെ ദൃഷ്ടിയിൽ നല്ലതെന്നു തോന്നുന്നതു അവനുവേണ്ടി ചെയ്യണമേ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘എന്റെ അപ്പന്റെയും അമ്മയുടെയും കല്ലറയോടുകൂടെ’ എന്നാണ്; കുടുംബത്തിന്റെ സംസ്കാരസ്ഥലത്തിനരികെ മരിച്ച് അടക്കപ്പെടുക എന്നതായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അങ്ങേക്കു നല്ലതെന്നു തോന്നുന്നതെന്തോ അത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁב נָא
  choice: മടങ്ങിപ്പോകാൻ ദയവായി അനുവദിക്കണമേ
  rationale: שׁוּב എന്ന ക്രിയയുടെ മടങ്ങുക എന്ന അർഥവും נָא നൽകുന്ന വിനീതമായ അപേക്ഷാഭാവവും സ്വാഭാവികവും ആദരസൂചകവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജാവിനോടുള്ള ബർസില്ലായിയുടെ വിനയപൂർവമായ ആത്മനിർദ്ദേശമാണിത്; ഇവിടെ അടിമത്തത്തെ മുൻനിർത്തുന്നതിനെക്കാൾ ‘ദാസൻ’ എന്ന രാജസദസ്സിലെ ആദരഭാഷ യോജിക്കുന്നു.
- source_word: וְאָמֻת
  choice: ഞാൻ ... മരിക്കട്ടെ
  rationale: മടങ്ങാനുള്ള അപേക്ഷയെത്തുടർന്നുള്ള ഉദ്ദേശ്യം/ആഗ്രഹം മലയാളത്തിലെ വിധിലിംഗരൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּעִירִי
  choice: എന്റെ സ്വന്തം പട്ടണത്തിൽ
  rationale: ഒന്നാംപുരുഷ ഉടമസ്ഥപ്രത്യയം സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ ബന്ധം ‘സ്വന്തം’ എന്ന പദം വ്യക്തമാക്കുന്നു.
- source_word: עִם קֶבֶר אָבִי וְאִמִּי
  choice: എന്റെ അപ്പന്റെയും അമ്മയുടെയും കല്ലറയ്ക്കരികെ
  rationale: עִם അക്ഷരാർഥത്തിൽ ‘കൂടെ’ എന്നാണെങ്കിലും, ശവസംസ്കാരസന്ദർഭത്തിൽ കുടുംബകല്ലറയുടെ സമീപത്ത് മരിക്കുകയോ അടക്കപ്പെടുകയോ ചെയ്യാനുള്ള ആഗ്രഹമാണ് സ്വാഭാവിക അർഥം; ‘കല്ലറയ്ക്കരികെ’ അതിനെ അമിതവ്യാഖ്യാനം കൂടാതെ നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: എന്നാൽ ഇതാ
  rationale: ബർസില്ലായിയുടെ മടങ്ങിപ്പോകാനുള്ള അപേക്ഷയിൽനിന്ന് കിംഹാമിനെ അവതരിപ്പിക്കുന്നതിലേക്കുള്ള വൈരുധ്യവും ഹാജരാക്കുന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: כִמְהָם
  choice: കിംഹാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יַעֲבֹר עִם
  choice: അവൻ ... ഒപ്പം അക്കരെ കടക്കട്ടെ
  rationale: സന്ദർഭത്തിലെ അപേക്ഷാത്മകമായ jussive ഭാവവും യോർദ്ദാൻ കടക്കുന്നതിന്റെ ആവർത്തിത പ്രമേയവും നിലനിർത്തുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: യജമാനനായ രാജാവ്
  rationale: രാജാവിനോടുള്ള ഔപചാരികവും ആദരസൂചകവുമായ അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַעֲשֵׂה לוֹ
  choice: അവനുവേണ്ടി ചെയ്താലും
  rationale: לֹו ഇവിടെ പ്രയോജനാർഥം സൂചിപ്പിക്കുന്നതിനാൽ ‘അവനുവേണ്ടി’ എന്നത് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ നല്ലതെന്നു തോന്നുന്നത്
  rationale: ‘കണ്ണുകളിൽ നല്ലത്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് അതിന്റെ നിർണയാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
