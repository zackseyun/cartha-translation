  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ഗൗരവമുള്ള രാജസദസ്സ്-രജിസ്റ്റർ സ്വീകരിച്ചു. രാജാവിനോടുള്ള ആദരത്തിന് ‘അങ്ങ്/അങ്ങയുടെ’, അപേക്ഷയ്ക്ക് ‘അനുവദിക്കണമേ’, ‘ചെയ്താലും’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു; അതേസമയം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന സ്വാഭാവിക വാക്യഘടന പാലിച്ചു.
