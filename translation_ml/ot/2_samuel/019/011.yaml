source:
  edition: WLC
  text: וְ/אַבְשָׁלוֹם֙ אֲשֶׁ֣ר מָשַׁ֣חְנוּ עָלֵ֔י/נוּ מֵ֖ת בַּ/מִּלְחָמָ֑ה וְ/עַתָּ֗ה לָ/מָ֥ה אַתֶּ֛ם מַחֲרִשִׁ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/011.yaml
  text: And Absalom[a], whom we anointed over us, died in battle. So now why are you silent about bringing the king back?
translation:
  language: ml
  text: നമ്മുടെമേൽ രാജാവായി നാം അഭിഷേകം ചെയ്ത അബ്ശാലോം യുദ്ധത്തിൽ മരിച്ചു. ഇപ്പോൾ രാജാവിനെ തിരികെ കൊണ്ടുവരുന്ന[a] കാര്യത്തിൽ നിങ്ങൾ മൗനം പാലിക്കുന്നത് എന്തിന്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജാവിനെ പുനഃസ്ഥാപിക്കുന്ന കാര്യത്തിൽ.”
    reason: לְהָשִׁיב എന്ന ഹിഫീൽ പ്രയോഗം സാക്ഷാൽ ‘തിരികെ കൊണ്ടുവരുക’ എന്നാണ്; ഈ രാജകീയ സന്ദർഭത്തിൽ രാജാവിനെ പുനഃസ്ഥാപിക്കുക എന്ന അർഥവും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: വാവ് മുൻവാക്യത്തോടുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യാരംഭത്തിലെ പ്രത്യേക സംയോജകം ചേർക്കാതെയും ആ തുടർച്ച സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: מָשַׁחְנוּ עָלֵינוּ
  choice: നാം നമുക്കു രാജാവായി അഭിഷേകം ചെയ്ത
  rationale: מָשַׁח എന്ന രാജകീയ സ്ഥാനാരോഹണപദത്തിന്റെ ‘അഭിഷേകം ചെയ്യുക’ എന്ന അർഥം നിലനിർത്തുന്നു; עָלֵינוּ എന്നത് ഈ സാഹചര്യത്തിൽ സ്വാഭാവിക മലയാളത്തിനായി ‘നമുക്കു രാജാവായി’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: מֵת בַּמִּלְחָמָה
  choice: യുദ്ധത്തിൽ മരിച്ചു
  rationale: പൂർത്തിയായ സംഭവത്തെ ലളിതവും സ്വാഭാവികവുമായ മലയാള ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മുൻപ്രസ്താവനയിൽനിന്നുള്ള പ്രായോഗിക നിഗമനത്തിലേക്കുള്ള നീക്കം സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ അധിക കാരണസൂചകപദം ചേർക്കാതെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מַחֲרִשִׁים
  choice: മൗനം പാലിക്കുന്നത്
  rationale: സംസാരിക്കാതെയോ പ്രതികരിക്കാതെയോ ഇരിക്കുക എന്ന മൂലപദത്തിന്റെ ആശയം നിലനിർത്തുന്നു; ‘മടിക്കുന്നത്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക അർഥം ഒഴിവാക്കുന്നു.
- source_word: לְהָשִׁיב אֶת־הַמֶּלֶךְ
  choice: രാജാവിനെ തിരികെ കൊണ്ടുവരുന്ന കാര്യത്തിൽ
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘മടങ്ങിവരുത്തുക/തിരികെ കൊണ്ടുവരുക’ എന്ന സാക്ഷാൽ അർഥം നിലനിർത്തുന്നു; ‘മൗനം പാലിക്കുക’ എന്നതിനോടു സ്വാഭാവികമായി ചേരാൻ ‘കാര്യത്തിൽ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: അബ്ശാലോമിന്റെ രാജകീയ സ്ഥാനാരോഹണത്തിന് ഉപയോഗിച്ച מָשַׁח എന്ന പദം
  choice: അഭിഷേകം ചെയ്ത
  alternative: രാജാവാക്കിയ
  rationale: അബ്ശാലോം അധികാരം പിടിച്ചെടുത്തവനായിരുന്നെങ്കിലും മൂലപാഠം സാധാരണ രാജാഭിഷേകപദമാണ് ഉപയോഗിക്കുന്നത്. അതിനെ നിലനിർത്തുന്നത് പാഠത്തിന്റെ രാഷ്ട്രീയ-മതപരമായ ഭാരം സംരക്ഷിക്കുകയും വിവരണത്തിൽ അധിക വിലയിരുത്തൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: രാജാവിനെ ‘തിരികെ കൊണ്ടുവരുക’ എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: തിരികെ കൊണ്ടുവരുന്ന
  alternative: വീണ്ടും അധികാരത്തിൽ സ്ഥാപിക്കുന്ന
  rationale: മൂലപദം ശാരീരികമായ മടങ്ങിവരവും രാജസ്ഥാനത്തിന്റെ പുനഃസ്ഥാപനവും ഉൾക്കൊള്ളാൻ കഴിയും. മുഖ്യപാഠത്തിൽ കൂടുതൽ സാക്ഷാൽ രൂപം നൽകി, രാഷ്ട്രീയമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. രാജകീയ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘നമുക്കു രാജാവായി’ ഉപയോഗിച്ചെങ്കിലും മൂലത്തിലെ ‘അഭിഷേകം’ എന്ന പ്രധാന പദം സംരക്ഷിച്ചു. അഭിസംബോധനയിലെ ബഹുവചനം ‘നിങ്ങൾ’ എന്നതിൽ നിലനിൽക്കുന്നു.
