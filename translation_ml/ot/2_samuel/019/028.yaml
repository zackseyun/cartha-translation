id: 2SA.19.28
reference: 2 Samuel 19:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְרַגֵּ֣ל בְּ/עַבְדְּ/ךָ֔ אֶל אֲדֹנִ֖/י הַ/מֶּ֑לֶךְ וַ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים וַ/עֲשֵׂ֥ה הַ/טּ֖וֹב בְּ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/028.yaml
  text: He slandered your servant to my lord the king, but my lord the king is like the angel of God; so do what is good in your eyes.
translation:
  language: ml
  text: അവൻ അങ്ങയുടെ ദാസനായ എന്നെക്കുറിച്ച് എന്റെ യജമാനനായ രാജാവിനോട് അപവാദം പറഞ്ഞു. എന്നാൽ എന്റെ യജമാനനായ രാജാവ് ദൈവത്തിന്റെ ദൂതനെപ്പോലെയാണ്. അതുകൊണ്ട് അങ്ങേക്കു നല്ലതെന്നു തോന്നുന്നതു ചെയ്തുകൊള്ളുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְרַגֵּל
  choice: അപവാദം പറഞ്ഞു
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയയ്ക്ക് ഒരാളെക്കുറിച്ച് ദോഷകരമായ വ്യാജാരോപണം ഉന്നയിക്കുക എന്ന അർഥമാണ്; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: בְּעַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ എന്നെക്കുറിച്ച്
  rationale: മൂന്നാംപുരുഷ പരാമർശമല്ല, സംസാരിക്കുന്ന മെഫീബോശെത്ത് തന്നെ വിനയത്തോടെ ‘അങ്ങയുടെ ദാസൻ’ എന്നു വിളിക്കുന്നതാണ്; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘എന്നെക്കുറിച്ച്’ വ്യക്തമാക്കി.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ദൂതനെപ്പോലെയാണ്
  rationale: מַלְאָךְ എന്നത് ‘ദൂതൻ’ എന്നും ‘ദൈവദൂതൻ’ എന്നും ഗ്രഹിക്കാം; മൂലപദത്തിന്റെ രൂപവും താരതമ്യത്തിന്റെ തുറന്ന സ്വഭാവവും നിലനിർത്താൻ ‘ദൈവത്തിന്റെ ദൂതൻ’ സ്വീകരിച്ചു.
- source_word: וַעֲשֵׂה הַטּוֹב בְּעֵינֶיךָ
  choice: അതുകൊണ്ട് അങ്ങേക്കു നല്ലതെന്നു തോന്നുന്നതു ചെയ്തുകൊള്ളുക
  rationale: ‘നിന്റെ കണ്ണുകളിൽ നല്ലത്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകുന്നു; וַ എന്ന ബന്ധകത്തെ സന്ദർഭാനുസൃതമായ നിഗമനമായി ‘അതുകൊണ്ട്’ എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: രാജാവിനെ ‘ദൈവത്തിന്റെ ദൂതൻ’ എന്നു താരതമ്യം ചെയ്യുന്നതിന്റെ അർഥം
  choice: 'താരതമ്യം മാത്രം നിലനിർത്തി: ‘ദൈവത്തിന്റെ ദൂതനെപ്പോലെയാണ്’'
  alternative: ‘ദൈവദൂതനെപ്പോലെ എല്ലാം വിവേചിച്ചറിയുന്നവനാണ്’ എന്ന വ്യാഖ്യാനവിപുലീകരണം
  rationale: വാക്യം വിവേചനശക്തിയോ അധികാരമോ പോലുള്ള പ്രത്യേക ഗുണം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ദൈവികത രാജാവിനു ചാർത്താതെയും നിർദിഷ്ട വ്യാഖ്യാനം ചേർക്കാതെയും മൂലത്തിലെ താരതമ്യം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. രാജസഭാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവവും സംസാരഭാഷയിലെ വ്യക്തതയും സംരക്ഷിച്ചു; അനാവശ്യമായ പഴഞ്ചൻ രൂപങ്ങൾ ഒഴിവാക്കി.
