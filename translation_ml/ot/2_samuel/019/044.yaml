translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. ഗോത്രപ്രതിനിധികളെ സൂചിപ്പിക്കുന്ന ഏകവചനം സംഭാഷണത്തിൽ നിലനിർത്തുകയും സമൂഹങ്ങളെക്കുറിച്ചുള്ള അവസാന സംഗ്രഹത്തിൽ ബഹുവചനം ഉപയോഗിക്കുകയും ചെയ്തു. മൂലത്തിലെ അപൂർണ്ണോക്തിയും താരതമ്യത്തിന്റെ അനിശ്ചിതത്വവും ആവശ്യമായിടത്ത് അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
