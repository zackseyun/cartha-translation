source:
  edition: WLC
  text: וַ/יַּ֣עַן אִֽישׁ יִשְׂרָאֵל֩ אֶת אִ֨ישׁ יְהוּדָ֜ה וַ/יֹּ֗אמֶר עֶֽשֶׂר יָד֨וֹת לִ֣/י בַ/מֶּלֶךְ֮ וְ/גַם בְּ/דָוִד֮ אֲנִ֣י מִמְּ/ךָ֒ וּ/מַדּ֨וּעַ֙ הֱקִלֹּתַ֔/נִי וְ/לֹא הָיָ֨ה דְבָרִ֥/י רִאשׁ֛וֹן לִ֖/י לְ/הָשִׁ֣יב אֶת מַלְכִּ֑/י וַ/יִּ֨קֶשׁ֙ דְּבַר אִ֣ישׁ יְהוּדָ֔ה מִ/דְּבַ֖ר אִ֥ישׁ יִשְׂרָאֵֽל־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽക്കാരൻ യെഹൂദക്കാരനോടു മറുപടി പറഞ്ഞു: “രാജാവിൽ എനിക്ക് പത്ത് ഓഹരികളുണ്ട്[a]; ദാവീദിലും നിന്നെക്കാൾ വലിയ അവകാശം എനിക്കുണ്ട്[b]. പിന്നെ നീ എന്നെ നിസ്സാരനായി കരുതിയത് എന്തിന്? എന്റെ രാജാവിനെ തിരികെ കൊണ്ടുവരണമെന്ന എന്റെ നിർദേശമായിരുന്നില്ലേ ആദ്യം?[c]” എന്നാൽ യെഹൂദക്കാരുടെ വാക്കുകൾ ഇസ്രായേൽക്കാരുടെ വാക്കുകളെക്കാൾ കടുപ്പമേറിയതായിരുന്നു.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “രാജാവിൽ എനിക്ക് പത്ത് കൈകളുണ്ട്.” ഇവിടെ ‘കൈകൾ’ എന്നത് വിഹിതങ്ങളെയോ ഓഹരികളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; യെഹൂദയെ അപേക്ഷിച്ച് വടക്കൻ പത്ത് ഗോത്രങ്ങൾ ഉന്നയിച്ച അവകാശവാദമായിരിക്കാം ഇത്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “ദാവീദിലും നിന്നെക്കാൾ വലിയ പങ്ക് എനിക്കുണ്ട്.” എബ്രായ വാക്യം അപൂർണ്ണോക്തിപരമാണെങ്കിലും താരതമ്യത്തിലുള്ള പങ്കോ അവകാശമോ ആണ് പ്രകടിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “എന്റെ രാജാവിനെ തിരികെ കൊണ്ടുവരുന്നതിനെക്കുറിച്ച് ആദ്യം പറഞ്ഞത് ഞാനായിരുന്നില്ലേ?”
    reason: alternative_reading
  - marker: d
    text: അഥവാ, “യെഹൂദക്കാർ ഇസ്രായേൽക്കാരെക്കാൾ രൂക്ഷമായി സംസാരിച്ചു.” ‘കടുപ്പമേറിയത്’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് ‘കൂടുതൽ ശക്തമായത്’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  choice: ഇസ്രായേൽക്കാരൻ / യെഹൂദക്കാരൻ; അവസാന വാക്യത്തിൽ ഇസ്രായേൽക്കാർ / യെഹൂദക്കാർ
  rationale: സംഭാഷണത്തിൽ എബ്രായ ഏകവചനം ഓരോ വിഭാഗത്തിന്റെയും പ്രതിനിധിയെ സൂചിപ്പിക്കുന്നതിനാൽ ഏകവചനം നിലനിർത്തി. അവസാനത്തെ സംഗ്രഹവാക്യത്തിൽ സമൂഹത്തെ ഉദ്ദേശിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാള ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  choice: രാജാവിൽ എനിക്ക് പത്ത് ഓഹരികളുണ്ട്
  rationale: יָדוֹת എന്നതിന്റെ അക്ഷരാർഥം ‘കൈകൾ’ എന്നാണെങ്കിലും ഇവിടെ വിഹിതങ്ങളെയോ പങ്കിന്മേലുള്ള അവകാശത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘പത്ത് ഓഹരികൾ’ ഗോത്രങ്ങളുടെ അവകാശവാദം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  choice: ദാവീദിലും നിന്നെക്കാൾ വലിയ അവകാശം എനിക്കുണ്ട്
  rationale: എബ്രായ വാക്യം അപൂർണ്ണോക്തിപരമാണ്. പൊതുവായ വ്യക്തിമഹത്ത്വമല്ല, ദാവീദിന്മേലുള്ള താരതമ്യാവകാശമാണ് സന്ദർഭത്തിലെ ആശയം; അത് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: הֱקִלֹּתַנִי
  choice: നീ എന്നെ നിസ്സാരനായി കരുതി
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള ക്രിയ ഒരാളെ പ്രാധാന്യമില്ലാത്തവനായി കാണുക, അവഗണിക്കുക, വിലകുറച്ചു കാണുക എന്നീ ആശയങ്ങൾ നൽകുന്നു. അതിശക്തമായ ‘നിന്ദിച്ചു’ എന്നതിനെക്കാൾ മൂലത്തിലെ രൂപകം സൂക്ഷിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: וְלֹא הָיָה דְבָרִי רִאשׁוֹן לִי לְהָשִׁיב אֶת מַלְכִּי
  choice: എന്റെ രാജാവിനെ തിരികെ കൊണ്ടുവരണമെന്ന എന്റെ നിർദേശമായിരുന്നില്ലേ ആദ്യം?
  rationale: ദുഷ്കരവും അപൂർണ്ണോക്തിപരവുമായ ഈ വാക്യത്തിൽ דָבָר എന്നത് വാക്ക്, കാര്യം, നിർദേശം എന്നിവ സൂചിപ്പിക്കാം. രാജാവിന്റെ മടങ്ങിവരവിന് ആദ്യം മുൻകൈ എടുത്തുവെന്ന അവകാശവാദം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിച്ചു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מַלְכִּי
  choice: എന്റെ രാജാവ്
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം മൂലത്തിൽ വ്യക്തമാണ്; അത് വ്യക്തിപരമായ കൂറും അവകാശവാദവും പ്രകടമാക്കുന്നതിനാൽ ഒഴിവാക്കിയില്ല.
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  choice: യെഹൂദക്കാരുടെ വാക്കുകൾ ഇസ്രായേൽക്കാരുടെ വാക്കുകളെക്കാൾ കടുപ്പമേറിയതായിരുന്നു
  rationale: קשׁה ഇവിടെ സംസാരത്തിന്റെ കാഠിന്യമോ രൂക്ഷതയോ സൂചിപ്പിക്കുന്നു. സമൂഹപരമായ അർഥം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു.
