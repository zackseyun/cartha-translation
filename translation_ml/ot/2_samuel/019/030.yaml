id: 2SA.19.30
reference: 2 Samuel 19:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֛/מָּה תְּדַבֵּ֥ר ע֖וֹד דְּבָרֶ֑י/ךָ אָמַ֕רְתִּי אַתָּ֣ה וְ/צִיבָ֔א תַּחְלְק֖וּ אֶת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് അവനോടു പറഞ്ഞു: “നിന്റെ കാര്യങ്ങളെക്കുറിച്ച് ഇനിയും എന്തിന് സംസാരിക്കുന്നു? ഞാൻ തീരുമാനിച്ചിരിക്കുന്നു[a]: നീയും സീബയും ആ നിലം[b] പങ്കിടണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദശഃ: “ഞാൻ പറഞ്ഞു.”'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വയൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  choice: അപ്പോൾ രാജാവ് ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: לָמָּה
  choice: എന്തിന്
  rationale: നേരിട്ടുള്ള കാരണചോദ്യം ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: תְּדַבֵּר עוֹד
  choice: ഇനിയും സംസാരിക്കുന്നത്
  rationale: עוֹד സൂചിപ്പിക്കുന്ന തുടർന്നുള്ള അഥവാ കൂടുതൽ സംസാരിക്കൽ നിലനിർത്തുന്നു; രാജാവിന്റെ അസഹിഷ്ണുത സന്ദർഭത്തിൽ സ്വാഭാവികമായി കേൾക്കുന്നു.
- source_word: דְּבָרֶיךָ
  choice: നിന്റെ കാര്യങ്ങളെക്കുറിച്ച്
  rationale: דבר എന്നതിന്റെ ‘വാക്കുകൾ/കാര്യങ്ങൾ’ എന്ന അർഥവ്യാപ്തിയിൽ, തർക്കവിഷയമായ സ്വന്തം കാര്യം ഉന്നയിക്കുന്ന ഈ സന്ദർഭത്തിന് ‘കാര്യങ്ങൾ’ യോജിക്കുന്നു; ‘വ്യവഹാരം’ എന്ന നിയമവൽക്കരിച്ച വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: אָמַרְתִּי
  choice: ഞാൻ തീരുമാനിച്ചിരിക്കുന്നു
  rationale: പദശഃ ‘ഞാൻ പറഞ്ഞു’ എന്നാണെങ്കിലും, ഇവിടെ രാജാവിന്റെ തീർപ്പുകൽപ്പനയാണ് പ്രയോഗശക്തി. കൂടുതൽ പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אַתָּה וְצִיבָא
  choice: നീയും സീബയും
  rationale: അഭിസംബോധനയിലെ സർവനാമം വ്യക്തമായി നിലനിർത്തുകയും പേരിന് പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: תַּחְלְקוּ
  choice: പങ്കിട്ടുകൊള്ളണം
  rationale: അപൂർണക്രിയ ഇവിടെ രാജാവിന്റെ അധികാരപൂർവമായ നിർദേശം അഥവാ വിധി പ്രകടിപ്പിക്കുന്നു; ‘വേണം’ അതിന്റെ നിർബന്ധശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַשָּׂדֶה
  choice: ആ നിലം
  rationale: שׂדה പദശഃ ‘വയൽ/നിലം’ എന്നതാണെങ്കിലും, സ്വത്തുതർക്കത്തിന്റെ സന്ദർഭത്തിൽ ഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്നു. ‘നിലം’ മൂലപദത്തോട് അടുത്തും സന്ദർഭത്തിന് മതിയായ വിശാലതയുള്ളതുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിന്റെ ചോദ്യത്തിലെ അസഹിഷ്ണുതയും വിധിയിലെ അധികാരസ്വരവും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
