  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
translation:
  language: ml
  text: 'ദാവീദ് രാജാവ് പുരോഹിതന്മാരായ സാദോക്കിനും അബ്യാഥാരിനും സന്ദേശമയച്ചു: “യെഹൂദയുടെ മൂപ്പന്മാരോടു പറയുക: ‘രാജാവിനെ അവന്റെ ഭവനത്തിലേക്കു തിരികെ കൊണ്ടുവരുന്നതിൽ നിങ്ങൾ അവസാനക്കാരായിരിക്കേണ്ടത് എന്തിന്? എല്ലാ യിസ്രായേലിന്റെയും വാക്ക്[a] രാജാവിന്റെ അടുക്കലേക്കു, അവന്റെ ഭവനത്തിലേക്കു, എത്തിയിരിക്കുന്നു.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാ യിസ്രായേലിന്റെയും നിർദേശം/വാർത്ത.” “എല്ലാ യിസ്രായേലിന്റെയും വാക്ക്” എന്ന ഹീബ്രു പ്രയോഗം വിശാലമാണ്; ദാവീദിനെ തിരികെ കൊണ്ടുവരുന്നതിനെക്കുറിച്ചുള്ള ഗോത്രങ്ങളുടെ വാർത്തയെയോ നിർദേശത്തെയോ അഭ്യർഥനയെയോ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
