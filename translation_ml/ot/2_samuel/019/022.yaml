id: 2SA.19.22
reference: 2 Samuel 19:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן אֲבִישַׁ֤י בֶּן צְרוּיָה֙ וַ/יֹּ֔אמֶר הֲ/תַ֣חַת זֹ֔את לֹ֥א יוּמַ֖ת שִׁמְעִ֑י כִּ֥י קִלֵּ֖ל אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
translation:
  language: ml
  text: 'എന്നാൽ സെരൂയയുടെ മകൻ അബീശായി മറുപടി പറഞ്ഞു: “ഇതിന്[a] ശിമെയിയെ വധിക്കേണ്ടതല്ലയോ? കാരണം അവൻ യഹ്‌വേയുടെ അഭിഷിക്തനെ ശപിച്ചല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇക്കാരണത്താൽ” / “ഇതിന് പ്രതിഫലമായി.” ഈ പ്രവൃത്തിയുടെ പേരിൽ ശിമെയിയെ വധിക്കണമോ എന്നാണ് എബ്രായ പ്രയോഗം ചോദിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടി പറഞ്ഞു
  rationale: രണ്ട് എബ്രായ ക്രിയകളും മറുപടിയായുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്ന ഒറ്റ സ്വാഭാവിക പ്രയോഗം അവയുടെ സംവാദപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: സെരൂയയുടെ മകൻ അബീശായി
  rationale: വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുകയും എബ്രായത്തിലെ ബന്ധസൂചന അതേപടി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הֲתַחַת זֹאת
  choice: ഇതിന്
  rationale: ഈ എബ്രായ പ്രയോഗം പ്രസ്തുത പ്രവൃത്തിയുടെ പേരിൽ ശിക്ഷ ഉണ്ടാകണമോ എന്ന ചോദ്യം ഉന്നയിക്കുന്നു. ‘ഇതിന്’ സംക്ഷിപ്തവും സ്വാഭാവികവും ആകുമ്പോൾ പ്രയോഗത്തിന്റെ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לֹא יוּמַת
  choice: വധിക്കേണ്ടതല്ലയോ?
  rationale: מות എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം വെറും മരണമല്ല, ഒരാളെ കൊല്ലുകയോ നിയമപരമായി മരണശിക്ഷ നടപ്പാക്കുകയോ ചെയ്യുന്നതാണ് സൂചിപ്പിക്കുന്നത്. ചോദ്യം പ്രതീക്ഷിക്കുന്ന സമ്മതഭാവവും ‘-അല്ലയോ’ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ശിമെയിയെ വധിക്കണമെന്ന നിർദേശത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ വ്യക്തമായ കാരണബന്ധം പ്രകടിപ്പിക്കുന്നു.
- source_word: קִלֵּל
  choice: ശപിച്ചു
  rationale: ശിമെയി ദാവീദിനെതിരെ നടത്തിയ ഗൗരവമുള്ള വാക്കാലുള്ള ശാപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מְשִׁיחַ יְהוָה
  choice: യഹ്‌വേയുടെ അഭിഷിക്തൻ
  rationale: യഹ്‌വേ അഭിഷേകം ചെയ്ത രാജാവെന്ന പദവിയുടെ ദൈവശാസ്ത്രപരമായ പ്രാധാന്യം നിലനിർത്തുകയും ദൈവനാമം വ്യക്തിനാമമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: מְשִׁיחַ എന്ന രാജകീയ പദവി
  choice: അഭിഷിക്തൻ
  alternative: അഭിഷേകം ചെയ്യപ്പെട്ടവൻ
  rationale: ദാവീദിന്റെ രാജകീയ പദവിയും യഹ്‌വേയാൽ നിയമിക്കപ്പെട്ടവൻ എന്ന ആശയവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഇവിടെ അതിനെ പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക മശീഹാ വ്യാഖ്യാനമായി വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും മാന്യവുമായ മലയാളം. ചോദ്യം ഉന്നയിക്കുന്ന ശക്തി ‘വധിക്കേണ്ടതല്ലയോ?’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചിരിക്കുന്നു; ‘ശപിച്ചല്ലോ’ കാരണം വ്യക്തമാക്കുന്നതിനൊപ്പം അബീശായിയുടെ വാദഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
