  text: בֶּן שְׁמֹנִ֣ים שָׁנָה֩ אָנֹכִ֨י הַ/יּ֜וֹם הַ/אֵדַ֣ע בֵּין ט֣וֹב לְ/רָ֗ע אִם יִטְעַ֤ם עַבְדְּ/ךָ֙ אֶת אֲשֶׁ֤ר אֹכַל֙ וְ/אֶת אֲשֶׁ֣ר אֶשְׁתֶּ֔ה אִם אֶשְׁמַ֣ע ע֔וֹד בְּ/ק֖וֹל שָׁרִ֣ים וְ/שָׁר֑וֹת וְ/לָ/מָּה֩ יִֽהְיֶ֨ה עַבְדְּ/ךָ֥ עוֹד֙ לְ/מַשָּׂ֔א אֶל אֲדֹנִ֖/י הַ/מֶּֽלֶךְ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
translation:
  language: ml
  text: എനിക്ക് ഇന്ന് എൺപത് വയസ്സുണ്ട്. നന്മയും തിന്മയും തമ്മിൽ തിരിച്ചറിയാൻ എനിക്ക് കഴിയുമോ?[a] അങ്ങയുടെ ദാസന് താൻ കഴിക്കുന്നതിന്റെയും കുടിക്കുന്നതിന്റെയും രുചി അറിയാൻ കഴിയുമോ? ഗായകരുടെയും ഗായികമാരുടെയും സ്വരം ഇനിയും എനിക്ക് കേൾക്കാൻ കഴിയുമോ? പിന്നെ അങ്ങയുടെ ദാസൻ എന്റെ യജമാനനായ രാജാവിന് ഇനിയും ഒരു ഭാരമായിരിക്കേണ്ടത് എന്തിന്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നല്ലതും ചീത്തയും തമ്മിൽ വിവേചിക്കാൻ എനിക്ക് കഴിയുമോ?” എബ്രായ പ്രയോഗം നൈതികമോ പ്രായോഗികമോ ആയ വിവേചനത്തെ സൂചിപ്പിക്കാം; ഇവിടെ വാർധക്യവും ക്ഷയിച്ച ഇന്ദ്രിയശേഷികളും സംബന്ധിച്ച സന്ദർഭം പൊതുവായ തിരിച്ചറിയൽശേഷി കുറഞ്ഞതിലേക്കും വിരൽചൂണ്ടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: ഇന്ന് എനിക്ക് എൺപതു വയസ്സായി
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയെ സ്വാഭാവികവും ആധുനികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  choice: നന്മയും തിന്മയും തമ്മിൽ തിരിച്ചറിയാൻ എനിക്ക് കഴിയുമോ?
  rationale: ידע בין എന്നത് വേർതിരിച്ചറിയലിനെയോ വിവേചനശേഷിയെയോ സൂചിപ്പിക്കുന്നു. טוֹב/רָע എന്ന പദജോടിയുടെ നൈതികവും പ്രായോഗികവുമായ വ്യാപ്തി ‘നന്മയും തിന്മയും’ നിലനിർത്തുന്നു.
- source_word: אִם יִטְעַם עַבְדְּךָ אֶת אֲשֶׁר אֹכַל וְאֶת אֲשֶׁר אֶשְׁתֶּה
  choice: അങ്ങയുടെ ദാസന് താൻ കഴിക്കുന്നതിന്റെയും കുടിക്കുന്നതിന്റെയും രുചി അറിയാൻ കഴിയുമോ?
  rationale: טעם എന്ന ക്രിയയുടെ രുചിഗ്രഹണാർഥം വ്യക്തമാക്കുകയും മൂന്നാംപുരുഷ രാജസദസ്യ സ്വയംപരാമർശമായ ‘അങ്ങയുടെ ദാസൻ’ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֶשְׁמַע עוֹד בְּקוֹל שָׁרִים וְשָׁרוֹת
  choice: ഗായകരുടെയും ഗായികമാരുടെയും സ്വരം ഇനിയും എനിക്ക് കേൾക്കാൻ കഴിയുമോ?
  rationale: പുരുഷ-സ്ത്രീ രൂപങ്ങളെ വേർതിരിച്ചു നിലനിർത്തുകയും קול എന്നതിനെ സ്വാഭാവികമായി ‘സ്വരം’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: לְמַשָּׂא
  choice: ഒരു ഭാരമായിത്തീരേണ്ടത്
  rationale: അക്ഷരാർഥത്തിലുള്ള ചുമടല്ല, രാജാവിന് അസൗകര്യമോ ബാധ്യതയോ ആകുന്ന രൂപകാലങ്കാരാർഥം നൽകുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: മനുഷ്യരാജാവിനോടുള്ള ആദരപൂർവമായ രാജസദസ്യ അഭിസംബോധന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: טוֹב לְרָע എന്ന പദജോടിയുടെ അർഥവ്യാപ്തി
  choice: നന്മയും തിന്മയും
  alternative: നല്ലതും ചീത്തയും
  rationale: എബ്രായത്തിലെ സ്ഥിരമായ പദജോടിയോട് അടുത്തുനിൽക്കുന്നു; എന്നാൽ സന്ദർഭത്തിൽ ഇത് നൈതിക വിവേചനം മാത്രം അല്ല, വാർധക്യംമൂലമുള്ള പൊതുവായ തിരിച്ചറിയൽശേഷിയും സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ രാജസദസ്യ ഭാഷ ഉപയോഗിച്ചു. ‘അങ്ങ്/അങ്ങയുടെ’ എന്ന ആദരരൂപവും ‘ദാസൻ’, ‘യജമാനനായ രാജാവ്’ എന്നീ courtly expressions-ഉം നിലനിർത്തി; അനാവശ്യമായ പഴമൊഴിശൈലി ഒഴിവാക്കി.
