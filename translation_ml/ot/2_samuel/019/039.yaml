translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിന്റെ വാഗ്ദാനത്തിലെ ഔപചാരികത നിലനിർത്തിക്കൊണ്ട് അപൂർവമോ അത്യന്തം സംസ്കൃതവത്കൃതമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
