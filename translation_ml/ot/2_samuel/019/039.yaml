  text: וַ/יֹּ֣אמֶר הַ/מֶּ֗לֶךְ אִתִּ/י֙ יַעֲבֹ֣ר כִּמְהָ֔ם וַ/אֲנִי֙ אֶעֱשֶׂה לּ֔/וֹ אֶת הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ וְ/כֹ֛ל אֲשֶׁר תִּבְחַ֥ר עָלַ֖/י אֶֽעֱשֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/039.yaml
  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് പറഞ്ഞു: “കിംഹാം എന്നോടൊപ്പം അക്കരെ കടക്കട്ടെ. നിന്റെ ദൃഷ്ടിയിൽ നല്ലതെന്നു തോന്നുന്നതു ഞാൻ അവനുവേണ്ടി ചെയ്യും. നീ എന്റെമേൽ ഏൽപ്പിക്കാൻ തിരഞ്ഞെടുക്കുന്നതെല്ലാം[a] ഞാൻ നിനക്കുവേണ്ടി ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ എന്നോട് ആവശ്യപ്പെടുന്നതെന്തും.” ഹീബ്രു പ്രയോഗം അല്പം സംക്ഷിപ്തമാണ്; അക്ഷരാർഥത്തിൽ, “നീ എന്റെമേൽ തിരഞ്ഞെടുക്കുന്നതെന്തും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: അപ്പോൾ രാജാവ് പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אִתִּי יַעֲבֹר כִּמְהָם
  choice: കിംഹാം എന്നോടൊപ്പം അക്കരെ കടക്കട്ടെ
  rationale: ഇവിടത്തെ അപൂർണക്രിയ ആജ്ഞാർഥ/അനുവാദാർഥ ഭാവത്തിലാണ്. സന്ദർഭത്തിലെ യോർദാൻ കടക്കലിനെ ‘അക്കരെ കടക്കുക’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: כִּמְהָם
  choice: കിംഹാം
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത രീതിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַאֲנִי אֶעֱשֶׂה לּוֹ
  choice: ഞാൻ അവനുവേണ്ടി ചെയ്യും
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയെ സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികം പ്രത്യേകമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֶת הַטּוֹב בְּעֵינֶיךָ
  choice: നിന്റെ ദൃഷ്ടിയിൽ നല്ലതെന്നു തോന്നുന്നതു
  rationale: അഭിസംബോധിതൻ നല്ലതോ ഉചിതമോ എന്നു വിധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ദൃശ്യപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְכֹל אֲשֶׁר תִּבְחַר עָלַי
  choice: നീ എന്റെമേൽ ഏൽപ്പിക്കാൻ തിരഞ്ഞെടുക്കുന്നതെന്തും[a]
  rationale: ‘എന്റെമേൽ’ എന്ന മൂലപാഠത്തിലെ ഉപസർഗ്ഗചിത്രവും രാജാവ് ഒരു ബാധ്യത ഏറ്റെടുക്കുന്ന ആശയവും നിലനിർത്തുന്നു; ഹീബ്രു പ്രയോഗത്തിന്റെ സംക്ഷിപ്തത കാരണം അടിക്കുറിപ്പിൽ സ്വാഭാവിക അർഥവികൽപം നൽകുന്നു.
- source_word: אֶעֱשֶׂה לָּךְ
  choice: ഞാൻ നിനക്കുവേണ്ടി ചെയ്യും
  rationale: ബർസില്ലായിയോടുള്ള രാജാവിന്റെ വ്യക്തിപരമായ വാഗ്ദാനം മൂലപാഠത്തോട് ചേർന്ന് അവതരിപ്പിക്കുന്നു.
