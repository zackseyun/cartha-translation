  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സ്വാഭാവികവുമായ രാജസദസ്സ്-സംഭാഷണശൈലി ഉപയോഗിച്ചു. രാജാവിനെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും സ്വയം സൂചിപ്പിക്കാൻ ‘ഈ ദാസൻ’ എന്നും ഉപയോഗിച്ചു; എബ്രായത്തിലെ നിയമപരവും ബന്ധപരവുമായ അസ്പഷ്ടതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
