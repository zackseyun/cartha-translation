source:
  edition: WLC
  text: כִּי֩ לֹ֨א הָיָ֜ה כָּל בֵּ֣ית אָבִ֗/י כִּ֤י אִם אַנְשֵׁי מָ֨וֶת֙ לַ/אדֹנִ֣/י הַ/מֶּ֔לֶךְ וַ/תָּ֨שֶׁת֙ אֶֽת עַבְדְּ/ךָ֔ בְּ/אֹכְלֵ֖י שֻׁלְחָנֶ֑/ךָ וּ/מַה יֶּשׁ לִ֥/י עוֹד֙ צְדָקָ֔ה וְ/לִ/זְעֹ֥ק ע֖וֹד אֶל הַ/מֶּֽלֶךְ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
translation:
  language: ml
  text: എന്റെ പിതാവിന്റെ കുടുംബത്തിലുള്ളവർ എല്ലാവരും രാജാവായ എന്റെ യജമാനന്റെ മുമ്പിൽ മരണത്തിന് അർഹരായവർ മാത്രമായിരുന്നു[a]. എന്നിട്ടും അങ്ങ് ഈ ദാസനെ അങ്ങയുടെ മേശയിൽ ഭക്ഷിക്കുന്നവരുടെ കൂട്ടത്തിൽ ചേർത്തു. ഇനിയും രാജാവിനോടു നിലവിളിച്ചു അപേക്ഷിക്കാൻ എനിക്ക് എന്ത് അവകാശമാണ് ശേഷിക്കുന്നത്[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘മരണത്തിന്റെ ആളുകൾ’; അതായത്, മരണശിക്ഷയ്ക്ക് വിധേയരോ വധിക്കപ്പെടാൻ അർഹരോ ആയവർ.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘അവകാശം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം ‘ത്സെദാഖാ’ ആണ്. ഈ സന്ദർഭത്തിൽ അത് പ്രധാനമായും വ്യക്തിപരമായ നീതിയെയല്ല, ന്യായമായ അവകാശവാദത്തെയോ അർഹതയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  choice: മുഴുവനും ... മാത്രമായിരുന്നു
  rationale: ഊന്നലോടെയുള്ള പരിമിതി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כָּל בֵּית אָבִי
  choice: എന്റെ പിതൃഭവനം മുഴുവനും
  rationale: വിപുലമായ പിതൃകുടുംബത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധുത്വപ്രയോഗത്തിലെ ‘ഭവനം’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי מָוֶת
  choice: മരണത്തിന് അർഹരായവർ
  rationale: ഇതിനർഥം ഇതിനകം മരിച്ചവർ എന്നല്ല, വധശിക്ഷയ്ക്ക് വിധേയരോ മരണാർഹരോ ആയവർ എന്നാണ്.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: യജമാനനായ രാജാവിന്റെ മുമ്പിൽ
  rationale: രാജാവിന്റെ വിധിയിലും പരിഗണനയിലും അവരുടെ നില എന്തായിരുന്നു എന്ന ബന്ധപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וַתָּשֶׁת
  choice: എന്നിട്ടും ... ഇരുത്തി
  rationale: മേശയിൽ ഭക്ഷിക്കുന്നവരുടെ കൂട്ടത്തിൽ ഉൾപ്പെടുത്തിയതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു; മുൻവാക്യവുമായുള്ള വൈരുധ്യവും വ്യക്തമാക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: ഈ ദാസനെ
  rationale: രാജാവിനോടുള്ള വിനയപൂർവമായ കൊട്ടാരഭാഷയിലെ സ്വയംവിശേഷണം നിലനിർത്തുന്നു.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: അങ്ങയുടെ മേശയിൽ ഭക്ഷിക്കുന്നവരുടെ കൂട്ടത്തിൽ
  rationale: രാജാവിന്റെ സംരക്ഷണവും പ്രത്യേക പരിഗണനയും ലഭിക്കുന്നവരിൽ ഉൾപ്പെട്ടതെന്ന സാമൂഹികചിത്രം സംരക്ഷിക്കുന്നു.
- source_word: וּמַה יֶּשׁ לִי עוֹד צְדָקָה
  choice: എനിക്ക് എന്ത് അവകാശമാണുള്ളത്
  rationale: צְדָקָה ഇവിടെ വ്യക്തിപരമായ ധാർമികനീതിയെക്കാൾ ന്യായമായ അവകാശവാദം അഥവാ അവകാശം എന്ന ബന്ധപരമായ അർഥത്തിലാണ്.
- source_word: וְלִזְעֹק עוֹד אֶל הַמֶּלֶךְ
  choice: രാജാവിനോട് ഇനിയും നിലവിളിച്ചു പറയാൻ
  rationale: זעק എന്നതിലെ ശക്തമായ അപേക്ഷയുടെയോ പരാതിയുടെയോ ‘നിലവിളിക്കുക’ എന്ന ഭാവം നിലനിർത്തുന്നു.
