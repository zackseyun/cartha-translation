id: 2SA.19.32
reference: 2 Samuel 19:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַרְזִלַּי֙ הַ/גִּלְעָדִ֔י יָרַ֖ד מֵ/רֹגְלִ֑ים וַ/יַּעֲבֹ֤ר אֶת הַ/מֶּ֨לֶךְ֙ הַ/יַּרְדֵּ֔ן לְ/שַׁלְּח֖/וֹ אֶת ב/ירדן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/032.yaml
  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
translation:
  language: ml
  text: ഗിലെയാദ്യനായ ബർസില്ലായി റോഗെലീമിൽനിന്ന് ഇറങ്ങിവന്നു; രാജാവിനെ യോർദ്ദാനിൽവെച്ച് യാത്രയയക്കാനായി അവൻ രാജാവിനോടൊപ്പം യോർദ്ദാൻ കടന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “റോഗെലീമിൽനിന്ന് ഇറങ്ങിവന്ന്, രാജാവിനെ അനുഗമിക്കാനായി അവനോടൊപ്പം യോർദ്ദാൻ കടന്നു.” നദിക്കരയിൽ ബർസില്ലായി രാജാവിനെ അനുഗമിച്ചതിനെ എങ്ങനെ പ്രകടിപ്പിക്കണമെന്ന കാര്യത്തിൽ എബ്രായവാക്യം അല്പം വ്യത്യസ്തമായ വിവർത്തനങ്ങൾക്ക് ഇടനൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזִלַּי
  choice: ബർസില്ലായി
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: הַגִּלְעָדִי
  choice: ഗിലെയാദ്യനായ
  rationale: ഗിലെയാദ് പ്രദേശത്തുനിന്നുള്ളവൻ എന്ന വംശസ്ഥലസൂചക വിശേഷണം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: יָרַד מֵרֹגְלִים
  choice: റോഗെലീമിൽനിന്ന് ഇറങ്ങിവന്നു
  rationale: יָרַד എന്ന ചലനക്രിയയുടെ ‘ഇറങ്ങുക’ എന്ന ദിശാബോധവും മֵ എന്ന ഉറവിടസൂചനയും നിലനിർത്തുന്നു.
- source_word: וַיַּעֲבֹר אֶת הַמֶּלֶךְ הַיַּרְדֵּן
  choice: അവൻ രാജാവിനോടൊപ്പം യോർദ്ദാൻ കടന്നു
  rationale: עבר എന്നത് കടക്കുക എന്നാണ്; അസാധാരണമായ വാക്യഘടനയിൽ אֶת הַמֶּלֶךְ രാജാവിനൊപ്പമുള്ള അനുഗമനത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭാനുസൃതമായി അവതരിപ്പിച്ചു.
- source_word: לְשַׁלְּחוֹ
  choice: യാത്രയയക്കാനായി
  rationale: שלח എന്ന ക്രിയയുടെ ഉദ്ദേശ്യാർഥം ഇവിടെ രാജാവിനെ യാത്രയാക്കുക/വഴിയയക്കുക എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ നൽകി.
- source_word: אֶת ב/ירדן
  choice: യോർദ്ദാനിൽവെച്ച്
  rationale: കേടുപറ്റിയതോ അസാധാരണമായതോ ആയ മസോററ്റിക് രൂപത്തിന്റെ സന്ദർഭസാധ്യമായ സ്ഥലാർഥം നൽകി; പാഠത്തിലെ പ്രകടനവ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. സ്ഥലനാമങ്ങൾ ബർസില്ലായി, ഗിലെയാദ്, റോഗെലീം, യോർദ്ദാൻ എന്ന പൊതുവേ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി; മൂലത്തിലെ വാക്യഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
