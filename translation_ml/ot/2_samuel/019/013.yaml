  edition: WLC
  text: אַחַ֣/י אַתֶּ֔ם עַצְמִ֥/י וּ/בְשָׂרִ֖/י אַתֶּ֑ם וְ/לָ֧/מָּה תִהְי֛וּ אַחֲרֹנִ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/013.yaml
  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
translation:
  language: ml
  text: നിങ്ങൾ എന്റെ സഹോദരന്മാരല്ലോ[a]; നിങ്ങൾ എന്റെ അസ്ഥിയും മാംസവുമല്ലോ[b]. പിന്നെ രാജാവിനെ[c] തിരികെ കൊണ്ടുവരുന്നതിൽ നിങ്ങൾ എന്തിന് ഏറ്റവും പിന്നിലാകണം?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘എന്റെ സഹോദരന്മാർ’; ഇവിടെ അടുത്ത ബന്ധുക്കൾ എന്ന അർഥവും ഉൾക്കൊള്ളുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ അസ്ഥിയും മാംസവും’ എന്നത് അടുത്ത രക്തബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: ദാവീദ് ഇവിടെ തന്നെക്കുറിച്ച് മൂന്നാംപുരുഷനിൽ ‘രാജാവ്’ എന്നു പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: എന്റെ സഹോദരന്മാർ
  rationale: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘എന്റെ സഹോദരന്മാർ’ എന്നാണ്; ഇവിടെ ദാവീദ് യെഹൂദാഗോത്രക്കാരോടുള്ള അടുത്ത രക്തബന്ധം ഊന്നിപ്പറയുന്നു. ആ ബന്ധസൂചന അടുത്ത വാക്യഭാഗം കൂടുതൽ വ്യക്തമാക്കുന്നു.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: എന്റെ അസ്ഥിയും മാംസവും
  rationale: അടുത്ത രക്തബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിലെ ദൃശ്യബിംബം മാറ്റാതെ നിലനിർത്തുന്നു; മലയാളത്തിലും ഇത് മനസ്സിലാക്കാവുന്ന ബന്ധപ്രയോഗമാണ്.
- source_word: וְלָמָה
  choice: പിന്നെ ... എന്തിന്
  rationale: മുൻപറഞ്ഞ ബന്ധത്തെ അടിസ്ഥാനമാക്കിയുള്ള ദാവീദിന്റെ അഭ്യർഥനാപരമായ ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: תִהְיוּ אַחֲרֹנִים
  choice: നിങ്ങൾ ... ഏറ്റവും പിന്നിലാകണം
  rationale: ഇവിടത്തെ അപൂർണക്രിയ വെറും ഭാവിപ്രവചനമല്ല, പ്രേരണ നിറഞ്ഞ ആലങ്കാരിക ചോദ്യമാണ്. ‘ഏറ്റവും പിന്നിൽ’ മറ്റുള്ളവരെക്കാൾ വൈകി പ്രവർത്തിക്കുന്നതെന്ന താരതമ്യഭാവം നിലനിർത്തുന്നു.
- source_word: לְהָשִׁיב
  choice: തിരികെ കൊണ്ടുവരുന്നതിൽ
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘മടങ്ങിവരുത്തുക/തിരികെ കൊണ്ടുവരുക’ എന്ന കാരണാർഥമുണ്ട്; രാജാവിനെ കർത്തവ്യസ്ഥാനത്തേക്ക് തിരിച്ചുകൊണ്ടുവരുന്ന പ്രവൃത്തിയെ വ്യക്തമായി പറയുന്നു.
- source_word: אֶת־הַמֶּלֶךְ
  choice: രാജാവിനെ
  rationale: ദാവീദ് തന്നെക്കുറിച്ച് മൂന്നാംപുരുഷനിൽ ‘രാജാവ്’ എന്നു പറയുന്ന മൂലപാഠത്തിന്റെ രാജകീയ സ്വയംപരാമർശം അതേപടി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ മൂന്നാംപുരുഷ സ്വയംപരാമർശം
  choice: ‘രാജാവിനെ’ എന്ന മൂലരൂപം നിലനിർത്തി
  alternative: ‘രാജാവായ എന്നെ’
  rationale: ആരാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുമ്പോഴും, മൂലപാഠത്തിലെ മൂന്നാംപുരുഷ രാജകീയ പ്രയോഗം ഒന്നാംപുരുഷനാക്കി വ്യാഖ്യാനിച്ച് മാറ്റാതിരിക്കാൻ.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘അസ്ഥിയും മാംസവും’ എന്ന മൂലഭാഷയിലെ സജീവമായ ബന്ധബിംബവും ‘രാജാവ്’ എന്ന മൂന്നാംപുരുഷ സ്വയംപരാമർശവും നിലനിർത്തി; ആലങ്കാരിക ചോദ്യത്തിന്റെ പ്രേരണാഭാവം ‘എന്തിന് ... ആകണം?’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിച്ചു.
