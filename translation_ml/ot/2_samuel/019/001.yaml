base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് അത്യന്തം വികാരാധീനനായി; കവാടത്തിനുമുകളിലുള്ള മുറിയിലേക്കു കയറിച്ചെന്ന് കരഞ്ഞു. പോകുമ്പോൾ അദ്ദേഹം ഇങ്ങനെ പറഞ്ഞു: “എന്റെ മകനേ, അബ്ശാലോമേ! എന്റെ മകനേ, എന്റെ മകനേ, അബ്ശാലോമേ! നിനക്കു പകരം ഞാൻ മരിച്ചിരുന്നെങ്കിൽ![a] അബ്ശാലോമേ, എന്റെ മകനേ, എന്റെ മകനേ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ: “ആർ അനുവദിച്ചുതരും, ഞാൻ നിനക്കു പകരം മരിക്കാൻ?” ശക്തമായ ആഗ്രഹം പ്രകടിപ്പിക്കുന്ന ഒരു പ്രയോഗം; അർഥം: “ഞാൻ നിനക്കു പകരം മരിച്ചിരുന്നെങ്കിൽ!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְגַּז
  choice: അത്യന്തം വികാരാധീനനായി
  rationale: רגז വിറയൽ, കലക്കം, ശക്തമായ വൈകാരിക ക്ഷോഭം എന്നിവ സൂചിപ്പിക്കാം. പുത്രന്റെ മരണവാർത്തയോടുള്ള രാജാവിന്റെ ആഴമുള്ള പ്രതികരണമാണ് സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്.
- source_word: עֲלִיַּת הַשַּׁעַר
  choice: കവാടത്തിനുമുകളിലുള്ള മുറി
  rationale: עֲלִיָּה മുകളിലത്തെ മുറിയെയും הַשַּׁעַר കവാടത്തെയും സൂചിപ്പിക്കുന്നു; കവാടനിർമിതിയുടെ മുകളിലുള്ള മുറി എന്ന വാസ്തുഅർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּבְךְּ
  choice: കരഞ്ഞു
  rationale: בכהയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ; വിലാപസന്ദർഭത്തിനും യോജിക്കുന്നു.
- source_word: וְכֹה אָמַר בְּלֶכְתּוֹ
  choice: പോകുമ്പോൾ അദ്ദേഹം ഇങ്ങനെ പറഞ്ഞു
  rationale: בְּלֶכְתּוֹ നൽകുന്ന സമകാലിക ചലനവും כֹה നൽകുന്ന തുടർന്നുവരുന്ന വാക്കുകളുടെ അവതരണവും സംരക്ഷിക്കുന്നു.
- source_word: בְּנִי
  choice: എന്റെ മകനേ
  rationale: നേരിട്ടുള്ള സംബോധനയായതിനാൽ ‘മകനേ’ ഉപയോഗിക്കുകയും ഹീബ്രുവിലെ എല്ലാ ആവർത്തനങ്ങളും പൂർണമായി നിലനിർത്തുകയും ചെയ്തു.
- source_word: מִי יִתֵּן
  choice: …മരിച്ചിരുന്നെങ്കിൽ!
  rationale: അക്ഷരാർഥത്തിൽ ‘ആർ തരും?’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ അസാധ്യമായ ഒരു ആഗ്രഹം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യവസ്ഥാരൂപം അതിന്റെ വിലാപഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מוּתִי אֲנִי תַחְתֶּיךָ
  choice: നിനക്കു പകരം ഞാൻ മരിച്ചിരുന്നെങ്കിൽ
  rationale: ദാവീദ് അബ്ശാലോമിന്റെ സ്ഥാനത്ത് താൻ മരിച്ചിരിക്കണമെന്ന പ്രത്യസ്തിത ആഗ്രഹം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
