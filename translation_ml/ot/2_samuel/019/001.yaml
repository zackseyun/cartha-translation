  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വിലാപത്തിന്റെ ആവർത്തനഭാവവും നിലനിർത്തി. ‘എന്റെ മകനേ’ എന്ന ആവർത്തനം ചുരുക്കാതെ മൂലപാഠത്തിന്റെ വികാരതീവ്രത സംരക്ഷിച്ചു. മുഖ്യപാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
