  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
translation:
  language: ml
  text: 'രാജാവ് ശിമെയിയോടു പറഞ്ഞു: “നീ മരിക്കുകയില്ല.[a]” രാജാവ് അവനോടു ശപഥം ചെയ്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: “നിന്നെ കൊല്ലുകയില്ല.” ഹീബ്രായത്തിൽ അക്ഷരാർഥം “നീ മരിക്കുകയില്ല” എന്നാണ്; ഇവിടെ അത് വധശിക്ഷയിൽനിന്നുള്ള ഒഴിവാക്കൽ ഉറപ്പുനൽകുന്ന രാജകീയ വാഗ്ദാനത്തെ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ തുടർനടപടി സ്വാഭാവികമായ മലയാള കഥനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്ന രാജാവിനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമം; മലയാളത്തിൽ സ്വാഭാവികമായി ‘രാജാവ്’ എന്നു നൽകുന്നു.
- source_word: אֶל שִׁמְעִי
  choice: ശിമെയിയോടു
  rationale: സംസാരത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയബന്ധം മലയാളത്തിലെ ‘-യോടു’ ഉപയോഗിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא תָמוּת
  choice: നീ മരിക്കുകയില്ല
  rationale: നിഷേധിക്കപ്പെട്ട അപൂർണ്ണക്രിയ ഇവിടെ രാജകീയമായ ഉറപ്പോ വിധിയോ പ്രകടിപ്പിക്കാം. ‘നീ മരിക്കുകയില്ല’ എന്നത് ഹീബ്രായത്തിന്റെ നേരിട്ടുള്ള രൂപവും, വധശിക്ഷയിൽനിന്നുള്ള മാപ്പ് എന്ന സന്ദർഭസൂചനയും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: וַיִּשָּׁבַע
  choice: സത്യംചെയ്യുകയും ചെയ്തു
  rationale: שׁבע എന്ന നിഫാൽ രൂപം സത്യം ചെയ്യുക അഥവാ ശപഥം ചെയ്യുക എന്നർത്ഥം നൽകുന്നു; ഈ പ്രയോഗം ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: לוֹ
  choice: അവനോടു
  rationale: പ്രത്യയസർവനാമം ശിമെയിയെ തിരിച്ചുസൂചിപ്പിക്കുന്നു; പേര് അനാവശ്യമായി ആവർത്തിക്കാതെ പരോക്ഷകർമബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലֹא תָמוּת എന്ന രാജകീയ പ്രസ്താവനയുടെ പരിധി
  choice: ‘നീ മരിക്കുകയില്ല’ എന്ന അക്ഷരസമീപമായ ഉറപ്പ്
  alternative: ‘നിന്നെ കൊല്ലുകയില്ല’ / ‘നിനക്കു വധശിക്ഷ നൽകുകയില്ല’
  rationale: സന്ദർഭത്തിൽ വധശിക്ഷയിൽനിന്നുള്ള രാജകീയ മാപ്പായിരിക്കാമെങ്കിലും, ഹീബ്രായം നേരിട്ട് ‘നീ മരിക്കുകയില്ല’ എന്നാണ് പറയുന്നത്. മുഖ്യപാഠം ആ വിശാലതയും സംഘർഷവും നിലനിർത്തുന്നു; വ്യാഖ്യാനാത്മകമായ വധശിക്ഷാ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘മരിക്കുകയില്ല’ മൂലഭാഷയുടെ രൂപം കാത്തുസൂക്ഷിക്കുന്നു; ‘സത്യംചെയ്യുകയും ചെയ്തു’ ശപഥത്തിന്റെ ഔപചാരികഭാവം വ്യക്തമാക്കുന്നു.
