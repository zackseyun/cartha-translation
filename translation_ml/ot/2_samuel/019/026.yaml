reference: 2 Samuel 19:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֛י כִּי בָ֥א יְרוּשָׁלִַ֖ם לִ/קְרַ֣את הַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֛/מָּה לֹא הָלַ֥כְתָּ עִמִּ֖/י מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
translation:
  language: ml
  text: 'അവൻ രാജാവിനെ കാണാൻ യെരൂശലേമിൽ എത്തിയപ്പോൾ രാജാവ് അവനോട് ചോദിച്ചു: “മെഫീബോശെത്തേ, നീ എന്തുകൊണ്ട് എന്നോടൊപ്പം പോയില്ല?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: അവൻ ... എത്തിയപ്പോൾ
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ കാലസൂചകമായ ഈ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ഉപവാക്യത്തിലെ ‘എത്തിയപ്പോൾ’ എന്ന രൂപത്തിൽ പ്രകടമാക്കുന്നു; പ്രത്യേകം ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമായിരിക്കും.
- source_word: בָא
  choice: എത്തി
  rationale: בוא എന്ന ക്രിയയുടെ ‘വരുക/എത്തുക’ എന്ന അർഥത്തിൽ, യെരൂശലേമിലേക്കുള്ള വരവ് സൂചിപ്പിക്കാൻ ‘എത്തി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יְרוּשָׁלִַם
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം നിലനിർത്തുന്നു.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: രാജാവിനെ കാണാൻ
  rationale: לִקְרַאת എന്നത് ഒരാളെ എതിരേറ്റു കാണാൻ/സന്ധിക്കാൻ ചെല്ലുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘രാജാവിനെ കാണാൻ’ സാധാരണ മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: രാജാവ് അവനോട് ചോദിച്ചു
  rationale: പിന്നാലെയുള്ള വാക്കുകൾ ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികമാണ്; രാജാവെന്ന കർത്താവും ‘അവനോട്’ എന്ന പരാമർശവും മൂലപാഠപ്രകാരം നിലനിർത്തുന്നു.
- source_word: לָמָּה
  choice: എന്തുകൊണ്ട്
  rationale: കാരണം അന്വേഷിക്കുന്ന ചോദ്യത്തിന് ആധുനിക നിലവാരമുള്ള മലയാളത്തിലെ നേരിട്ടുള്ള തുല്യപ്രയോഗം.
- source_word: לֹא הָלַכְתָּ עִמִּי
  choice: നീ ... എന്നോടൊപ്പം പോയില്ല
  rationale: הלך എന്ന ക്രിയയുടെ അടിസ്ഥാന ചലനാർഥമായ ‘പോകുക’ സംരക്ഷിക്കുന്നു; ‘എന്നോടൊപ്പം വന്നില്ല’ എന്ന കൂടുതൽ സന്ദർഭോചിതമായ മലയാളത്തിലേക്ക് വീക്ഷണകോണം മാറ്റുന്നില്ല.
- source_word: מְפִיבֹשֶׁת
  choice: മെഫീബോശേത്ത്
  rationale: വ്യക്തിനാമത്തിന്റെ ഹീബ്രായ രൂപത്തെ സമീപിക്കുന്നതും മലയാളത്തിൽ വായിക്കാവുന്നതുമായ ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ‘പോയില്ല’ എന്ന ചലനവീക്ഷണം നിലനിർത്തിയതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല; മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
