  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל בַּרְזִלָּ֑י אַתָּה֙ עֲבֹ֣ר אִתִּ֔/י וְ/כִלְכַּלְתִּ֥י אֹתְ/ךָ֛ עִמָּדִ֖/י בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/034.yaml
  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
translation:
  language: ml
  text: 'രാജാവ് ബർസില്ലായിയോടു പറഞ്ഞു: “നീ എന്നോടൊപ്പം അക്കരെ കടക്കുക; യെരൂശലേമിൽ എന്നോടുകൂടെ ഞാൻ നിന്നെ പരിപാലിക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ആവശ്യങ്ങൾ നിറവേറ്റും” അല്ലെങ്കിൽ “നിന്നെ പോറ്റിപ്പുലർത്തും.” ഹീബ്രായ ക്രിയ ഒരാളുടെ ആവശ്യങ്ങൾക്കായി കരുതുകയും അയാളെ നിലനിർത്തുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ wayyiqtol തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; വാക്യക്രമം തന്നെ സംഭവത്തുടർച്ച വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേക സംയോജകം ചേർത്തിട്ടില്ല.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിതപദമായ ഈ നാമം സന്ദർഭത്തിൽ ദാവീദിനെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിലുള്ള പദവി അതേപടി നിലനിർത്തുന്നു.
- source_word: בַּרְזִלָּי
  choice: ബർസില്ലായി
  rationale: വ്യക്തിനാമത്തിന്റെ ഹീബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: אַתָּה עֲבֹר
  choice: നീ ... കടക്കുക
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നൽ ‘നീ’ എന്നു വ്യക്തമാക്കി നിലനിർത്തുന്നു; ആജ്ഞാരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: אִתִּי
  choice: എന്നോടൊപ്പം
  rationale: രാജാവിനൊപ്പമുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന സഹവർത്തിത്വപ്രയോഗം.
- source_word: עֲבֹר
  choice: അക്കരെ കടക്കുക
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിലെ യോർദ്ദാൻ കടക്കലിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘അക്കരെ’ എന്നത് ലക്ഷ്യദിശയെ സൂചിപ്പിക്കുന്നതെങ്കിലും നദിയുടെ പേര് പാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: ഞാൻ നിന്നെ പോറ്റിപ്പുലർത്താം
  rationale: כלכל എന്ന ക്രിയയുടെ ഒരാളുടെ ആവശ്യങ്ങൾ നിറവേറ്റി നിലനിർത്തുക എന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עִמָּדִי
  choice: എന്റെ അടുക്കൽ
  rationale: രാജാവിന്റെ സാന്നിധ്യത്തിലും പരിചരണവലയത്തിലും ഇരിക്കുക എന്ന ആശയം അമിതമായി വ്യാഖ്യാനിക്കാതെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമവും ב എന്ന സ്ഥലസൂചക ഉപസർഗവും പതിവായ മലയാളരൂപത്തിൽ നൽകുന്നു.
