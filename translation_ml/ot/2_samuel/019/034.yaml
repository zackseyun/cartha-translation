translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. രാജാവിന്റെ ക്ഷണത്തിലെ നേരിട്ടുള്ള ഭാവവും ‘നീ’ എന്ന സർവനാമത്തിന്റെ ഊന്നലും നിലനിർത്തി. അർഥവ്യക്തതയ്ക്കായി ‘അക്കരെ’ ഉപയോഗിച്ചെങ്കിലും യോർദ്ദാൻ എന്ന പേര് മൂലവാക്യത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
