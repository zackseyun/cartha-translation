revisions:
- from: 'രാജാവ് ബർസില്ലായിയോടു പറഞ്ഞു: “നീ എന്നോടൊപ്പം അക്കരെ കടക്കുക; യെരൂശലേമിൽ എന്റെ അടുക്കൽ ഞാൻ നിന്നെ പോറ്റിപ്പുലർത്താം[a].”'
  to: 'രാജാവ് ബർസില്ലായിയോടു പറഞ്ഞു: “നീ എന്നോടൊപ്പം അക്കരെ കടക്കുക; യെരൂശലേമിൽ എന്നോടുകൂടെ ഞാൻ നിന്നെ പരിപാലിക്കും[a].”'
  rationale: The revision replaces 'എന്റെ അടുക്കൽ' with 'എന്നോടുകൂടെ' to preserve the explicit Hebrew phrase עִמָּדִי ('with me'). It also uses 'പരിപാലിക്കും' for the king's promised provision, retaining the broad sense of the Hebrew verb while avoiding connotations of child-rearing. The footnote remains anchored to the provision verb and supplies viable lexical alternatives.
