translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ അവസാന ക്രിയയുടെ കർത്താവിലുള്ള യഥാർഥ സൂചനാഭാവം മുഖ്യവാക്യത്തിൽ ‘അവൻ’ എന്നു നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
