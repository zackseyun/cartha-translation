source:
  edition: WLC
  text: וַ/יַּעֲבֹ֧ר כָּל הָ/עָ֛ם אֶת הַ/יַּרְדֵּ֖ן וְ/הַ/מֶּ֣לֶךְ עָבָ֑ר וַ/יִּשַּׁ֨ק הַ/מֶּ֤לֶךְ לְ/בַרְזִלַּי֙ וַ/יְבָ֣רֲכֵ֔/הוּ וַ/יָּ֖שָׁב לִ/מְקֹמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
translation:
  language: ml
  text: ജനമെല്ലാം യോർദ്ദാൻ കടന്നു; രാജാവും അക്കരെ കടന്നു. പിന്നെ രാജാവ് ബർസില്ലായിയെ ചുംബിച്ച് അനുഗ്രഹിച്ചു; അവൻ തന്റെ സ്ഥലത്തേക്കു മടങ്ങിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൻ’ എന്നത് സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികമായി ബർസില്ലായിയെ സൂചിപ്പിക്കുന്നു; എന്നാൽ എബ്രായവാക്യത്തിൽ കർത്താവിന്റെ പേര് വീണ്ടും വ്യക്തമാക്കിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: കടന്നു
  rationale: עבר എന്ന ക്രിയ ഇവിടെ യോർദ്ദാൻ നദി മുറിച്ചുകടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കടന്നു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כָּל הָעָם
  choice: ജനമെല്ലാം
  rationale: עָם എന്നത് വിശാലമായി ‘ജനം’ എന്നാണ്; ഇവിടെ സൈനികർ മാത്രമാണെന്ന് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: אֶת הַיַּרְדֵּן
  choice: യോർദ്ദാൻ
  rationale: നദിയുടെ പേര് മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകിയിരിക്കുന്നു; സന്ദർഭത്തിൽ ‘നദി’ ചേർക്കേണ്ടതില്ല.
- source_word: וְהַמֶּלֶךְ עָבָר
  choice: രാജാവും അക്കരെ കടന്നു
  rationale: അതേ עבר ക്രിയയുടെ ആവർത്തനം നിലനിർത്തുകയും ‘അക്കരെ’ എന്നത് മലയാളത്തിൽ സഞ്ചാരദിശ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּשַּׁק
  choice: ചുംബിച്ച്
  rationale: נשק ഇവിടെ സ്നേഹവും യാത്രയയപ്പും പ്രകടിപ്പിക്കുന്ന ചുംബനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: לְבַרְזִלַּי
  choice: ബർസില്ലായിയെ
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരം ചെയ്തിരിക്കുന്നു.
- source_word: וַיְבָרֲכֵהוּ
  choice: അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ വ്യക്തമായ അർഥമായ ‘അനുഗ്രഹിക്കുക’ നിലനിർത്തുന്നു; യാത്രയയപ്പ് എന്ന ആശയം മാത്രം പകരംവയ്ക്കുന്നില്ല.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: അവൻ തന്റെ സ്ഥലത്തേക്കു മടങ്ങിപ്പോയി
  rationale: എബ്രായത്തിലെ ഏകവചന സർവനാമസൂചനയും מָקוֹם എന്നതിന്റെ പൊതുവായ ‘സ്ഥലം’ എന്ന അർഥവും നിലനിർത്തുന്നു; ‘വീട്ടിലേക്ക്’ എന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
