source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל הַ/מֶּ֗לֶךְ אַל יַחֲשָׁב לִ֣/י אֲדֹנִ/י֮ עָוֺן֒ וְ/אַל תִּזְכֹּ֗ר אֵ֚ת אֲשֶׁ֣ר הֶעֱוָ֣ה עַבְדְּ/ךָ֔ בַּ/יּ֕וֹם אֲשֶׁר יָׄצָ֥ׄאׄ אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ מִ/ירֽוּשָׁלִָ֑ם לָ/שׂ֥וּם הַ/מֶּ֖לֶךְ אֶל לִבּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
translation:
  language: ml
  text: 'അവൻ രാജാവിനോടു പറഞ്ഞു: “എന്റെ പ്രഭു എനിക്കു കുറ്റം കണക്കാക്കരുതേ[a]. എന്റെ പ്രഭുവായ രാജാവ് യെരൂശലേമിൽനിന്നു പുറപ്പെട്ട ദിവസം അങ്ങയുടെ ദാസൻ ചെയ്ത തെറ്റ് ഓർക്കരുതേ; രാജാവ് അത് മനസ്സിൽ വെക്കാതിരിക്കട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്ക് അകൃത്യം കണക്കാക്കരുതേ.” എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ ന്യായവിധിസംബന്ധമായ രൂപത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായയിൽ അക്ഷരാർഥം “തന്റെ ഹൃദയത്തിൽ വെക്കുക.” ഒരു കാര്യം ഗൗരവമായി എടുക്കുക, അല്ലെങ്കിൽ ഒരാൾക്കെതിരെ മനസ്സിൽ സൂക്ഷിക്കുക എന്നർഥമുള്ള പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲשָׁב לִי עָוֺן
  choice: എന്റെ കുറ്റം എനിക്കെതിരെ കണക്കാക്കരുതേ
  rationale: ‘എനിക്ക് കുറ്റം/അകൃത്യം കണക്കാക്കുക’ എന്ന ന്യായവിധിസംബന്ധമായ എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും, ചെയ്ത കുറ്റം തന്റെ കണക്കിൽ ചേർക്കരുതെന്ന അപേക്ഷയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָוֺן
  choice: കുറ്റം
  rationale: ഈ സന്ദർഭത്തിൽ പാപകരമായ പ്രവൃത്തിയെയും അതിൽനിന്നുള്ള കുറ്റബാധ്യതയെയും സൂചിപ്പിക്കാം. ‘കുറ്റം’ എന്നത് ഈ രണ്ടിനുമിടയിലെ അർത്ഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: תִּזְכֹּר
  choice: ഓർക്കരുതേ
  rationale: പ്രതികാരനടപടിക്കായി മനസ്സിൽ സൂക്ഷിക്കുക എന്ന സന്ദർഭസൂചന ഉണ്ടായാലും, മൂലപാഠത്തിലെ ലളിതമായ ‘ഓർക്കുക’ എന്ന ക്രിയ അതേപടി നിലനിർത്തുന്നു.
- source_word: הֶעֱוָה
  choice: ചെയ്ത തെറ്റ്
  rationale: വക്രമായോ തെറ്റായോ പ്രവർത്തിച്ചതിനെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജാവിന്റെ മുമ്പിലുള്ള വിനയപൂർവമായ സ്വയംപരാമർശമാണ് ഇവിടെ മുഖ്യം; അതിനാൽ ‘അടിമ’ എന്നതിനെക്കാൾ രാജസദസ്സിന്റെ ഭാവത്തിന് ‘ദാസൻ’ യോജിക്കുന്നു.
- source_word: יָצָא ... מִירוּשָׁלָם
  choice: യെരൂശലേമിൽനിന്നു പുറപ്പെട്ട
  rationale: ദാവീദ് നഗരം വിട്ടുപോയ സംഭവത്തെയും ‘പുറപ്പെടുക’ എന്ന എബ്രായ ക്രിയയെയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לָשׂוּם ... אֶל לִבּוֹ
  choice: മനസ്സിൽ വെക്കുക
  rationale: ഒരു കാര്യം ഗൗരവമായി കണക്കിലെടുക്കുകയോ വിരോധമായി മനസ്സിൽ സൂക്ഷിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിക്ക് സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: മൂലപാഠത്തിലെ രാജകീയ പദവിയുടെ ആവർത്തനം നിലനിർത്തുന്നു; ‘ദാവീദ്’ എന്ന പേര് ചേർക്കുന്നില്ല.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ഇത് ദൈവനാമമല്ല, രാജാവിനോടുള്ള ആദരസംബോധനയാണ്; ഒന്നാംപുരുഷ ഉടമസ്ഥരൂപവും വിനയഭാവവും നിലനിർത്തുന്നു.
