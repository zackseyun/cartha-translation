translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, രാജാവിനോടുള്ള വിനയവും രാജസദസ്സിലെ മൂന്നാംപുരുഷ സ്വയംസംബോധനയും നിലനിർത്തിയിരിക്കുന്നു. വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടായി തിരിച്ചെങ്കിലും അപേക്ഷകളുടെ ബന്ധവും ആവർത്തനവും സംരക്ഷിച്ചിട്ടുണ്ട്.
