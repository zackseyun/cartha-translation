source:
  edition: WLC
  text: וְ/עַתָּה֙ ק֣וּם צֵ֔א וְ/דַבֵּ֖ר עַל לֵ֣ב עֲבָדֶ֑י/ךָ כִּי֩ בַ/יהוָ֨ה נִשְׁבַּ֜עְתִּי כִּי אֵינְ/ךָ֣ יוֹצֵ֗א אִם יָלִ֨ין אִ֤ישׁ אִתְּ/ךָ֙ הַ/לַּ֔יְלָה וְ/רָעָ֧ה לְ/ךָ֣ זֹ֗את מִ/כָּל הָ/רָעָה֙ אֲשֶׁר בָּ֣אָה עָלֶ֔י/ךָ מִ/נְּעֻרֶ֖י/ךָ עַד עָֽתָּה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/008.yaml
  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
translation:
  language: ml
  text: ഇപ്പോൾ എഴുന്നേറ്റ് പുറത്തേക്കു ചെല്ലുക; നിന്റെ ഭൃത്യന്മാരോടു അനുനയത്തോടെ സംസാരിക്കുക.[a] കാരണം, നീ പുറത്തേക്കു ചെല്ലുന്നില്ലെങ്കിൽ, ഇന്ന് രാത്രി ഒരാൾപോലും നിന്നോടൊപ്പം തങ്ങുകയില്ലെന്ന് യഹോവയുടെ നാമത്തിൽ ഞാൻ സത്യം ചെയ്യുന്നു. അങ്ങനെ സംഭവിച്ചാൽ, നിന്റെ യൗവനം മുതൽ ഇന്നുവരെ നിനക്കു വന്നിട്ടുള്ള എല്ലാ അനർഥങ്ങളെക്കാളും ഇത് നിനക്കു കൂടുതൽ ദോഷകരമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിന്റെ ഭൃത്യന്മാരുടെ ഹൃദയത്തോടു സംസാരിക്കുക.” ദയയോടെയും ആശ്വസിപ്പിച്ചും അനുനയിപ്പിച്ചും സംസാരിക്കുക എന്നർഥമുള്ള എബ്രായ ശൈലിയാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: അടിയന്തരമായ പുതിയ നടപടിയിലേക്കുള്ള സംഭാഷണപരിവർത്തനം ലളിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: קוּם צֵא
  choice: എഴുന്നേറ്റ് പുറത്തേക്കു ചെല്ലുക
  rationale: രണ്ട് ആജ്ഞകളും നിലനിർത്തുകയും צֵא സൂചിപ്പിക്കുന്ന പുറത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְדַבֵּר עַל־לֵב
  choice: ഹൃദയത്തോട് സംസാരിക്കുക
  rationale: ആശ്വസിപ്പിച്ചോ അനുനയിപ്പിച്ചോ സംസാരിക്കുക എന്ന അർഥമുള്ള എബ്രായ ശൈലി മുഖ്യപാഠത്തിൽ സുതാര്യമായി നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֲבָדֶיךָ
  choice: നിന്റെ ഭൃത്യന്മാർ
  rationale: രാജകീയ-രാഷ്ട്രീയ പശ്ചാത്തലത്തിൽ രാജാവിന്റെ കീഴിലുള്ള സേവകരെയും അനുയായികളെയും സൂചിപ്പിക്കുന്ന മാന്യമായ പദം; അടിമത്തത്തിന്റെ അർഥം അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: כִּי בַיהוָה נִשְׁבַּעְתִּי
  choice: യഹോവയെക്കൊണ്ട് ഞാൻ സത്യം ചെയ്യുന്നു
  rationale: നേരിട്ടുള്ള ശപഥപ്രഖ്യാപനത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദൈവനാമം വ്യക്തിപരമായ നാമമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֵינְךָ יוֹצֵא אִם
  choice: നീ പുറത്തേക്കു ചെല്ലുന്നില്ലെങ്കിൽ
  rationale: ശപഥത്തോടു ചേർന്ന നിബന്ധന മലയാളത്തിൽ നേരായ വ്യവസ്ഥാവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: יָלִין אִישׁ אִתְּךָ הַלַּיְלָה
  choice: ഇന്ന് രാത്രി ഒരാൾപോലും നിന്നോടൊപ്പം തങ്ങുകയില്ല
  rationale: לין എന്നതിന്റെ രാത്രിയിൽ തങ്ങുക/താമസിക്കുക എന്ന അർഥവും איש എന്ന ഏകവചനത്തിന്റെ സമ്പൂർണ ഉപേക്ഷണത്തെ ഊന്നുന്ന ശക്തിയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְרָעָה לְךָ זֹאת מִכָּל־הָרָעָה
  choice: എല്ലാ അനർഥങ്ങളെക്കാളും ഇത് നിനക്കു വലിയ ദോഷമായിരിക്കും
  rationale: רעה ഇവിടെ ധാർമിക തിന്മയെക്കാൾ ദുരന്തം, കഷ്ടം, ദോഷം എന്നിവ സൂചിപ്പിക്കുന്നു; מן ഘടനയിലെ താരതമ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מִנְּעֻרֶיךָ עַד עָתָּה
  choice: നിന്റെ യൗവനംമുതൽ ഇന്നുവരെ
  rationale: ദാവീദിന്റെ യൗവനം മുതൽ ഇപ്പോഴത്തെ പ്രതിസന്ധിവരെയുള്ള മുഴുവൻ കാലപരിധിയും കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർക്ഷര ദൈവനാമത്തെ ഒരു പൊതുവായ സ്ഥാനനാമമായി മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: רעה എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: അനർഥം / ദോഷം
  alternative: തിന്മ
  rationale: ഈ ചരിത്രസന്ദർഭത്തിൽ പദം ധാർമിക തിന്മയല്ല, ദാവീദിന് സംഭവിച്ച ദുരന്തവും വരാനിരിക്കുന്ന ദോഷഫലവുമാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. രാജസഭാ പശ്ചാത്തലത്തിന് യോജിച്ച് ‘ഭൃത്യന്മാർ’ തിരഞ്ഞെടുത്തു. എബ്രായത്തിലെ ഹൃദയത്തോട് സംസാരിക്കുക എന്ന രൂപകം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ച് അതിന്റെ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
