    rationale: The Hebrew says that Judah “stole you away” but does not explicitly say “from us.” The political implication may be explained in a note, but the added phrase narrows and expands the source beyond its wording.
  - severity: medium
    issue: The Malayalam rendering of the final phrase does not explicitly express עִמּוֹ (“with him”).
