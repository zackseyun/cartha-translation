  text: וְ/הִנֵּ֛ה כָּל אִ֥ישׁ יִשְׂרָאֵ֖ל בָּאִ֣ים אֶל הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֣וּ אֶל הַ/מֶּ֡לֶךְ מַדּוּעַ֩ גְּנָב֨וּ/ךָ אַחֵ֜י/נוּ אִ֣ישׁ יְהוּדָ֗ה וַ/יַּעֲבִ֨רוּ אֶת הַ/מֶּ֤לֶךְ וְ/אֶת בֵּית/וֹ֙ אֶת הַ/יַּרְדֵּ֔ן וְ/כָל אַנְשֵׁ֥י דָוִ֖ד עִמּֽ/וֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
translation:
  language: ml
  text: 'ഇതാ, ഇസ്രായേലിലെ സകല പുരുഷന്മാരും[b] രാജാവിന്റെ അടുക്കൽ വന്ന് രാജാവിനോടു പറഞ്ഞു: “ഞങ്ങളുടെ സഹോദരന്മാരായ യെഹൂദാപുരുഷന്മാർ അങ്ങയെ മോഷ്ടിച്ചുകൊണ്ടുപോയി[a], അങ്ങയെയും അവിടുത്തെ ഗൃഹപരിവാരത്തെയും അങ്ങയോടുകൂടെ ദാവീദിന്റെ സകല പുരുഷന്മാരെയും യോർദ്ദാൻ കടത്തിക്കൊണ്ടുപോയത് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അങ്ങയെ രഹസ്യമായി കൊണ്ടുപോയി.” എബ്രായപാഠം സാധാരണയായി ‘മോഷ്ടിക്കുക’ എന്നർഥമുള്ള ക്രിയയെ രൂപകമായി ഉപയോഗിക്കുന്നു; മറ്റു ഇസ്രായേല്യരെ പങ്കെടുപ്പിക്കാതെ യെഹൂദാപുരുഷന്മാർ പ്രവർത്തിച്ചുവെന്നതാണ് കുറ്റാരോപണം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠം ഇസ്രായേലിനെയും യെഹൂദയെയും പ്രതിനിധീകരിച്ച കൂട്ടങ്ങളെ പുരുഷലിംഗ കൂട്ടായ പദങ്ങൾകൊണ്ടാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: הִנֵּה എന്ന ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഖ്യാനസൂചകത്തിന്റെ സജീവത നിലനിർത്തുന്നു; മലയാളത്തിൽ സംഭവമാറ്റവും ഊന്നലും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ പുരുഷന്മാരെല്ലാം
  rationale: אִישׁ ഏകവചനരൂപത്തിലാണെങ്കിലും ഇവിടെ പുരുഷസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ഉറവിടത്തിലെ ലിംഗസൂചനയും പ്രതിനിധിസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: בָּאִים
  choice: വന്ന്
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ participle മലയാളത്തിൽ തുടർക്രിയയായി സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מַדּוּעַ
  choice: എന്തിന്
  rationale: കാരണത്തെ ചോദിക്കുന്ന നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: גְּנָבוּךָ
  choice: അങ്ങയെ ഞങ്ങളിൽനിന്ന് മോഷ്ടിച്ചുകൊണ്ടുപോയി
  rationale: גנב എന്ന ‘മോഷ്ടിക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; യെഹൂദാ മറ്റുള്ള ഇസ്രായേല്യരെ പങ്കെടുപ്പിക്കാതെ രാജാവിനെ സ്വന്തമാക്കിയെന്ന കുറ്റാരോപണം ‘ഞങ്ങളിൽനിന്ന്’ എന്ന ആശയവ്യക്തീകരണത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: אַחֵינוּ אִישׁ יְהוּדָה
  choice: ഞങ്ങളുടെ സഹോദരന്മാരായ യെഹൂദാപുരുഷന്മാർ
  rationale: ഇസ്രായേലിനകത്തെ ബന്ധത്തെ സൂചിപ്പിക്കുന്ന ‘സഹോദരന്മാർ’ എന്ന കുടുംബഭാഷയും אִישׁ יְהוּדָה എന്ന കൂട്ടായ പുരുഷസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: וַיַּעֲבִרוּ
  choice: കടത്തിയത്
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ causative അർഥമായ ‘കടക്കാൻ ഇടയാക്കുക/കടത്തുക’ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: בֵּיתוֹ
  choice: അവിടുത്തെ കുടുംബം
  rationale: ഇവിടെ ‘വീട്’ എന്ന കെട്ടിടത്തേക്കാൾ രാജാവിന്റെ കുടുംബം/ഗൃഹസംഘം ഉദ്ദേശിക്കപ്പെടുന്നു; രാജാവിനോടുള്ള ആദരസൂചക സർവനാമം മലയാളസംഭാഷണത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הַיַּרְדֵּן
  choice: യോർദ്ദാൻ
  rationale: എബ്രായത്തിലെ നദിനാമത്തിന്റെ സ്ഥാപിത മലയാളരൂപം; ‘നദി’ എന്ന് മൂലത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  choice: ദാവീദിന്റെ സകല പുരുഷന്മാരെയും കൂട്ടി
  rationale: വാക്യാന്ത്യത്തിലെ ‘അവനോടുകൂടെ’ എന്ന അനുഗമനാർഥം മലയാളത്തിൽ ‘കൂട്ടി’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; ദാവീദിന്റെ അനുചരരും കടന്നവരിൽ ഉൾപ്പെട്ടുവെന്ന ബന്ധം നിലനിർത്തുന്നു.
