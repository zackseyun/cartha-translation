  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്/അവിടുത്തെ’ ഉപയോഗിച്ചു. ഉറവിടത്തിലെ ‘മോഷ്ടിക്കുക’ എന്ന രാഷ്ട്രീയ രൂപകവും പുരുഷകൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്ന ഭാഷയും അടിക്കുറിപ്പുകളോടെ നിലനിർത്തി.
