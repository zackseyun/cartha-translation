    rationale: The Hebrew asks whether a person is to be put to death in Israel that day. Malayalam 'വധിക്കാമോ?' is active and may be understood as asking whether killing is permissible. 'ഒരാൾ വധിക്കപ്പെടുമോ?' retains the passive sense and the question's rhetorical force.
