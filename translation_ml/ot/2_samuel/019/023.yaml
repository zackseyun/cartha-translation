source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד מַה לִּ֤/י וְ/לָ/כֶם֙ בְּנֵ֣י צְרוּיָ֔ה כִּי תִֽהְיוּ לִ֥/י הַ/יּ֖וֹם לְ/שָׂטָ֑ן הַ/יּ֗וֹם י֤וּמַת אִישׁ֙ בְּ/יִשְׂרָאֵ֔ל כִּ֚י הֲ/ל֣וֹא יָדַ֔עְתִּי כִּ֥י הַ/יּ֖וֹם אֲנִי מֶ֥לֶךְ עַל יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
translation:
  language: ml
  text: 'ദാവീദ് പറഞ്ഞു: “സെരൂയയുടെ പുത്രന്മാരേ, എനിക്കും നിങ്ങൾക്കും തമ്മിൽ എന്താണ്? ഇന്ന് നിങ്ങൾ എനിക്ക് എതിരാളികളാകുന്നത് എന്തിന്?[a] ഇന്ന് ഇസ്രായേലിൽ ഒരാൾ വധിക്കപ്പെടുമോ? ഇന്ന് ഞാൻ ഇസ്രായേലിന്റെ രാജാവാണെന്ന് എനിക്കറിയില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “എനിക്ക് ഒരു സാത്താനായി,” അതായത് “എനിക്ക് ഒരു എതിരാളിയായി” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: എനിക്കും നിങ്ങൾക്കും തമ്മിൽ എന്താണ്?
  rationale: അകൽച്ചയും ശാസനയും പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי צְרוּיָה
  choice: സെരൂയയുടെ പുത്രന്മാരേ
  rationale: യോവാബിനെയും അബീശായിയെയും നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന കുടുംബപരമായ വിശേഷണം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: כִּי תִהְיוּ לִי הַיּוֹם לְשָׂטָן
  choice: ഇന്ന് നിങ്ങൾ എനിക്ക് എതിരാളികളാകുന്നത് എന്തിന്?
  rationale: כִּי ഇവിടെ മുൻചോദ്യത്തിന്റെ വിശദീകരണമായി വരുന്നു; שָׂטָן എന്ന സാധാരണ നാമത്തിന്റെ ‘എതിരാളി/പ്രതിബന്ധം സൃഷ്ടിക്കുന്നവൻ’ എന്ന അർഥം പിൽക്കാല ദുഷ്ടാത്മസംബന്ധമായ ധാരണ ഇറക്കുമതി ചെയ്യാതെ നൽകുന്നു.
- source_word: יּוּמַת אִישׁ
  choice: ആരെയെങ്കിലും വധിക്കാമോ?
  rationale: ഹിഫ്ഇൽ ഹോഫ്അൽ രൂപത്തിന്റെ ന്യായവിധിപരമായ ‘വധിക്കപ്പെടുക/വധശിക്ഷ നൽകുക’ എന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; אִישׁ ഇവിടെ പൊതുവ്യാപകമാണ്.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: എനിക്കറിയില്ലേ?
  rationale: സ്ഥിരീകരണം പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക വാചകചോദ്യത്തിന്റെ രൂപവും ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ രാജാവ്
  rationale: മലയാളത്തിലെ സ്വാഭാവിക രാജപദവി പ്രയോഗം; עַל സൂചിപ്പിക്കുന്ന ഭരണാധികാരം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: שָׂטָן എന്ന പദത്തിന്റെ അർഥം
  choice: സാധാരണ നാമമായ ‘എതിരാളി’
  alternative: ‘സാത്താൻ’ എന്ന വ്യക്തിനാമം
  rationale: ഈ ചരിത്രവിവരണത്തിൽ പദം സെരൂയയുടെ പുത്രന്മാരുടെ എതിർപ്പിനെയോ തടസ്സപ്പെടുത്തലിനെയോ സൂചിപ്പിക്കുന്നു; വ്യക്തിനാമമാക്കുന്നത് സന്ദർഭം ആവശ്യപ്പെടാത്ത പിൽക്കാല ദുഷ്ടാത്മസംബന്ധമായ ആശയം ചേർക്കും.
translation_notes:
  register: ആധുനിക മാനക മലയാളം; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിക്കുന്ന ‘ഇന്ന്’ എന്ന പദം മൂലപാഠത്തിലെ ഊന്നലനുസരിച്ച് നിലനിർത്തി.
