revisions:
- from: കാരണം, അങ്ങയുടെ ഈ ദാസന് അറിയാം—ഞാൻ പാപം ചെയ്തിരിക്കുന്നുവെന്ന്. ഇതാ, എന്റെ യജമാനനായ രാജാവിനെ എതിരേൽക്കാൻ ഇറങ്ങിവരുന്നതിന് യോസേഫിന്റെ മുഴുവൻ ഭവനത്തിലുംവെച്ച്[a][b] ആദ്യനായി ഞാൻ ഇന്ന് വന്നിരിക്കുന്നു.
  to: കാരണം, അങ്ങയുടെ ദാസന് അറിയാം—ഞാൻ പാപം ചെയ്തിരിക്കുന്നുവെന്ന്. ഇതാ, എന്റെ പ്രഭുവായ രാജാവിനെ എതിരേൽക്കാൻ യോസേഫിന്റെ മുഴുവൻ ഭവനത്തിൽ ആദ്യനായി ഞാൻ ഇന്ന് ഇറങ്ങിവന്നിരിക്കുന്നു.[a][b]
