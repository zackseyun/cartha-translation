  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ രാജസദസ്സ്-രജിസ്റ്റർ ഉപയോഗിച്ചു. “ഇതാ” എന്ന പ്രയോഗം ശ്രദ്ധാകർഷകത നിലനിർത്തുന്നു; “ഭവനം” എന്ന കൂട്ടായ ഗോത്രനാമം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
