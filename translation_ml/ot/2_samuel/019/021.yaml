source:
  edition: WLC
  text: כִּ֚י יָדַ֣ע עַבְדְּ/ךָ֔ כִּ֖י אֲנִ֣י חָטָ֑אתִי וְ/הִנֵּֽה בָ֣אתִי הַ/יּ֗וֹם רִאשׁוֹן֙ לְ/כָל בֵּ֣ית יוֹסֵ֔ף לָ/רֶ֕דֶת לִ/קְרַ֖את אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/021.yaml
  text: For your servant knows that I have sinned[a]. And look, I have come today as the first of all the house of Joseph[b] to come down to meet my lord the king.
translation:
  language: ml
  text: കാരണം, അങ്ങയുടെ ദാസന് അറിയാം—ഞാൻ പാപം ചെയ്തിരിക്കുന്നുവെന്ന്. ഇതാ, എന്റെ പ്രഭുവായ രാജാവിനെ എതിരേൽക്കാൻ യോസേഫിന്റെ മുഴുവൻ ഭവനത്തിൽ ആദ്യനായി ഞാൻ ഇന്ന് ഇറങ്ങിവന്നിരിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യോസേഫിന്റെ ഭവനം” എന്നത് യോസേഫിൽനിന്നുള്ള ഗോത്രങ്ങളെ, പ്രത്യേകിച്ച് എഫ്രയീം, മനശ്ശെ എന്നിവയുമായി ബന്ധപ്പെട്ട വടക്കൻ ഗോത്രസമൂഹങ്ങളെ, സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “യോസേഫിന്റെ മുഴുവൻ ഭവനത്തിൽനിന്നും ആദ്യനായി.” യോസേഫിന്റെ മുഴുവൻ ഗോത്രസമൂഹത്തിൽനിന്ന് രാജാവിനെ എതിരേൽക്കാൻ ആദ്യം ഇറങ്ങിവന്നത് താനാണെന്ന അർഥത്തിലും ഹീബ്രു പ്രയോഗം മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തിലെ അപേക്ഷയ്ക്കുള്ള വിശദീകരണമോ കാരണമോ അവതരിപ്പിക്കുന്ന ബന്ധപദമായി സ്വാഭാവികമാണ്.
- source_word: יָדַע עַבְדְּךָ
  choice: അങ്ങയുടെ ഈ ദാസന് അറിയാം
  rationale: രാജാവിനോടുള്ള വിനയപൂർവമായ ആത്മനിർദ്ദേശം നിലനിർത്തുകയും, സമ്പൂർണക്രിയ സൂചിപ്പിക്കുന്ന ഇപ്പോഴത്തെ ബോധാവസ്ഥ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: חָטָאתִי
  choice: ഞാൻ പാപം ചെയ്തിരിക്കുന്നു
  rationale: חטא എന്ന പദത്തിന്റെ ധാർമിക ഭാരം സംരക്ഷിക്കുന്നു; കഴിഞ്ഞ പ്രവൃത്തിയെ ഇപ്പോൾ സമ്മതിക്കുന്ന ഭാവവും നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ശക്തി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: רִאשׁוֹן לְכָל בֵּית יוֹסֵף
  choice: യോസേഫിന്റെ മുഴുവൻ ഭവനത്തിലുംവെച്ച് ആദ്യനായി
  rationale: യോസേഫുമായി ബന്ധപ്പെട്ട സമൂഹത്തിലെ ആദ്യനായാണ് ശിമെയി എത്തിയതെന്ന മുഖ്യവായന നൽകുന്നു; לְ എന്ന ബന്ധത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לָרֶדֶת לִקְרַאת
  choice: എതിരേൽക്കാൻ ഇറങ്ങിവരുന്നതിന്
  rationale: ഭൂപ്രദേശപരമായ താഴോട്ടുള്ള ചലനവും രാജാവിനെ സമീപിച്ചു കാണാനുള്ള ഉദ്ദേശ്യവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: രാജസദസ്സിലെ ആദരസൂചക അഭിസംബോധനയുടെ ഔപചാരികത നിലനിർത്തുന്നു.
