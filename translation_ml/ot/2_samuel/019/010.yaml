  naturalness: ‘ഇസ്രായേലിലെ എല്ലാ ഗോത്രങ്ങളിലും ജനമെല്ലാം’ സ്വാഭാവികമാണ്. ‘ഇങ്ങനെ വാദപ്രതിവാദം നടത്തിക്കൊണ്ടിരുന്നു:’ എന്ന രൂപം പൊതുസംവാദത്തിന്റെ തുടർച്ചയും ഉദ്ധരണിയുടെ ആമുഖവും ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ കൂടുതൽ സുഗമമായി പ്രകടിപ്പിക്കുന്നു.
