  revised_text: 'ഇസ്രായേലിലെ എല്ലാ ഗോത്രങ്ങളിലും ജനമെല്ലാം ഇങ്ങനെ വാദപ്രതിവാദം നടത്തിക്കൊണ്ടിരുന്നു[a]: “രാജാവ് നമ്മുടെ ശത്രുക്കളുടെ കൈയിൽനിന്ന്[b] നമ്മെ വിടുവിച്ചു; ഫെലിസ്ത്യരുടെ കൈയിൽനിന്നും നമ്മെ രക്ഷിച്ചു. എന്നാൽ ഇപ്പോൾ അബ്ശാലോം നിമിത്തം[c] അദ്ദേഹം ദേശത്തുനിന്ന് ഓടിപ്പോയിരിക്കുന്നു.”'
