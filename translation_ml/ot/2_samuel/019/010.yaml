id: 2SA.19.10
reference: 2 Samuel 19:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֤י כָל הָ/עָם֙ נָד֔וֹן בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מֶּ֜לֶךְ הִצִּילָ֣/נוּ מִ/כַּ֣ף אֹיְבֵ֗י/נוּ וְ/ה֤וּא מִלְּטָ֨/נוּ֙ מִ/כַּ֣ף פְּלִשְׁתִּ֔ים וְ/עַתָּ֛ה בָּרַ֥ח מִן הָ/אָ֖רֶץ מֵ/עַ֥ל אַבְשָׁלֽוֹם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
translation:
  language: ml
  text: 'ഇസ്രായേലിലെ എല്ലാ ഗോത്രങ്ങളിലും ജനമെല്ലാം ഇങ്ങനെ വാദപ്രതിവാദം നടത്തിക്കൊണ്ടിരുന്നു[a]: “രാജാവ് നമ്മുടെ ശത്രുക്കളുടെ കൈയിൽനിന്ന്[b] നമ്മെ വിടുവിച്ചു; ഫെലിസ്ത്യരുടെ കൈയിൽനിന്നും നമ്മെ രക്ഷിച്ചു. എന്നാൽ ഇപ്പോൾ അബ്ശാലോം നിമിത്തം[c] അദ്ദേഹം ദേശത്തുനിന്ന് ഓടിപ്പോയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വാദിച്ചുകൊണ്ടിരുന്നു,” “ഭിന്നാഭിപ്രായത്തിലായിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം വെറും സാധാരണ സംഭാഷണമല്ല, ഗോത്രങ്ങളിലാകെ നടന്ന വാദപ്രതിവാദമാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “കൈയിൽനിന്ന്” എന്നത് ഒരാളുടെ അധികാരത്തിൽനിന്നോ നിയന്ത്രണത്തിൽനിന്നോ എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “അബ്ശാലോമിന്റെ മുമ്പിൽനിന്ന്” അഥവാ “അബ്ശാലോമിൽനിന്ന് അകന്ന്.” അവൻ കാരണമായോ അവന്റെ സമ്മർദത്താലോ ഓടിപ്പോയി എന്ന ആശയമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדוֹן
  choice: തർക്കിച്ചുകൊണ്ട്
  rationale: ദין എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ ജനങ്ങൾക്കിടയിലെ വ്യാപകമായ വാദപ്രതിവാദത്തെയോ ഭിന്നാഭിപ്രായത്തെയോ സൂചിപ്പിക്കുന്നു; വെറും സംസാരത്തേക്കാൾ ശക്തമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ എല്ലാ ഗോത്രങ്ങളിലും
  rationale: ചർച്ച ഇസ്രായേലിന്റെ ഗോത്രങ്ങളിലാകെ വ്യാപിച്ചിരുന്നുവെന്ന പരിധി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִצִּילָנוּ
  choice: നമ്മെ വിടുവിച്ചു
  rationale: അപകടത്തിൽനിന്നോ ശത്രുവിന്റെ അധികാരത്തിൽനിന്നോ മോചിപ്പിക്കുക എന്ന נצל-ന്റെ സൈനിക-രാഷ്ട്രീയ അർഥം നൽകുന്നു.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: നമ്മുടെ ശത്രുക്കളുടെ കൈയിൽനിന്ന്
  rationale: ‘കൈ’ അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; മലയാളത്തിലും മനസ്സിലാകുന്നതിനാൽ രൂപകം നിലനിർത്തുന്നു.
- source_word: מִלְּטָנוּ
  choice: നമ്മെ രക്ഷിച്ചു
  rationale: മുൻപത്തെ ‘വിടുവിച്ചു’ എന്നതിൽനിന്ന് ക്രിയാഭേദം കാത്തുകൊണ്ട്, അപകടത്തിൽനിന്നുള്ള രക്ഷ എന്ന സമാനാർഥം നൽകുന്നു.
- source_word: מִכַּף פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ കൈയിൽനിന്നും
  rationale: മൂലത്തിലെ സമാന്തരഘടനയും ‘കൈ’ എന്ന അധികാരരൂപകവും നിലനിർത്തുന്നു.
- source_word: וְעַתָּה
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: രാജാവിന്റെ മുൻകാല വിടുതൽപ്രവർത്തനത്തിനും ഇപ്പോഴത്തെ പലായനത്തിനുമിടയിലെ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בָּרַח
  choice: ഓടിപ്പോയിരിക്കുന്നു
  rationale: പലായനം നടന്നതും അതിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നതും മലയാളത്തിലെ പൂർത്തികൃത്യരൂപം വ്യക്തമാക്കുന്നു.
- source_word: מִן הָאָרֶץ
  choice: ദേശത്തുനിന്ന്
  rationale: ഇവിടെ אֶרֶץ പൊതുവായ ഭൂമിയെയല്ല, രാജ്യത്തെയോ ദേശപരിധിയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: מֵעַל אַבְשָׁלוֹם
  choice: അബ്ശാലോം നിമിത്തം
  rationale: പലായനക്രിയയോടൊപ്പമുള്ള ഈ ഉപസർഗപ്രയോഗം അബ്ശാലോമിൽനിന്ന് അകന്നോടിയതോ അവൻ കാരണമായതോ സൂചിപ്പിക്കാം; പ്രധാന പാഠത്തിൽ കാരണാർഥം സ്വാഭാവികമായി നൽകിയിട്ട് മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മֵעַל אַבְשָׁלוֹם എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: അബ്ശാലോം നിമിത്തം
  alternative: അബ്ശാലോമിന്റെ മുമ്പിൽനിന്ന് / അബ്ശാലോമിൽനിന്ന് അകന്ന്
  rationale: ഇത് പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കാതെ, അബ്ശാലോമിന്റെ സമ്മർദം മൂലമുള്ള പലായനം എന്ന സന്ദർഭാർഥം നൽകുന്നു; സ്ഥലപരമോ കാരണപരമോ ആയ മൂലത്തിലെ സൂക്ഷ്മ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. സൈനിക-രാഷ്ട്രീയ പശ്ചാത്തലത്തിന് യോജിച്ച് ‘വിടുവിച്ചു’, ‘രക്ഷിച്ചു’ എന്നീ വ്യത്യസ്ത ക്രിയകൾ ഉപയോഗിച്ചു; മൂലത്തിലെ ‘കൈ’ രൂപകവും വാക്യത്തിലെ വൈരുധ്യവും സംരക്ഷിച്ചു.
