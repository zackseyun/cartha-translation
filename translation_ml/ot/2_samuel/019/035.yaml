id: 2SA.19.35
reference: 2 Samuel 19:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר בַּרְזִלַּ֖י אֶל הַ/מֶּ֑לֶךְ כַּ/מָּ֗ה יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י כִּי אֶעֱלֶ֥ה אֶת הַ/מֶּ֖לֶךְ יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/035.yaml
  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
translation:
  language: ml
  text: 'ബർസില്ലായി രാജാവിനോടു പറഞ്ഞു: “രാജാവിനോടൊപ്പം യെരൂശലേമിലേക്കു കയറിച്ചെല്ലാൻ എന്റെ ജീവിതവർഷങ്ങളുടെ ദിവസങ്ങൾ എത്രയുണ്ട്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ אמר എന്ന ക്രിയയുടെ സാധാരണവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: בַּרְזִלַּי
  choice: ബർസില്ലായി
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്കനുസരിച്ച് നൽകി.
- source_word: אֶל הַמֶּלֶךְ
  choice: രാജാവിനോടു
  rationale: മൂലപാഠം ദാവീദ് എന്ന പേര് ചേർക്കാതെ നിർദ്ദിഷ്ട സാധാരണനാമമായ ‘രാജാവ്’ എന്നാണ് പറയുന്നത്.
- source_word: כַּמָּה
  choice: എത്രയുണ്ട്
  rationale: എണ്ണത്തെക്കുറിച്ചുള്ള ചോദ്യരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ശേഷിക്കുന്ന ആയുസ്സിനെക്കുറിച്ചുള്ള ആലങ്കാരിക ചോദ്യമാണെന്നത് പൂർണ്ണവാക്യത്തിൽ വ്യക്തമാകുന്നു.
- source_word: יְמֵי שְׁנֵי חַיַּי
  choice: എന്റെ ആയുഷ്കാലത്തിലെ വർഷങ്ങളുടെ ദിവസങ്ങൾ
  rationale: ‘എന്റെ ജീവിതത്തിന്റെ വർഷങ്ങളുടെ ദിവസങ്ങൾ’ എന്ന പദശഃക്രമത്തേക്കാൾ സ്വാഭാവികമായിരിക്കെ, ഹീബ്രായത്തിലെ പാളികളുള്ളതും ഊന്നലുള്ളതുമായ പ്രയോഗം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: …ആൻ
  rationale: ആലങ്കാരിക ചോദ്യത്തിന്റെ ഫല/സാധ്യതാഭാവം മലയാളത്തിലെ ക്രിയാന്ത്യഘടനയിലൂടെ സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: אֶעֱלֶה
  choice: കയറിപ്പോകാൻ
  rationale: യെരൂശലേമിലേക്കുള്ള യാത്രയെ ‘കയറുക’ എന്നു വിവരിക്കുന്ന עלה എന്ന ക്രിയയുടെ ഭൗമികവും പരമ്പരാഗതവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: אֶת הַמֶּלֶךְ
  choice: രാജാവിനോടൊപ്പം
  rationale: ഈ സന്ദർഭത്തിൽ אֶת രാജാവിനെ അനുഗമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സഹഗമനം വ്യക്തമായി അറിയിച്ചു.
- source_word: יְרוּשָׁלִָם
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം.
