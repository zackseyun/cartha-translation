base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/041.yaml
  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
translation:
  language: ml
  text: അപ്പോൾ രാജാവ് ഗിൽഗാലിലേക്കു കടന്നു; കിംഹാമും അദ്ദേഹത്തോടൊപ്പം കടന്നു. യെഹൂദാജനം മുഴുവനും രാജാവിനെ അക്കരെ കടത്തി[a]; യിസ്രായേൽജനത്തിൽ പകുതിയും അങ്ങനെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രാജാവിനെ അക്കരെ അനുഗമിച്ചുകൊണ്ടുപോയി.’ നേരിട്ടുള്ള കർമമുള്ള എബ്രായക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ കാരണാർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: കടന്നു
  rationale: עבר എന്ന ക്രിയ ഇവിടെ യോർദ്ദാൻ കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ നദി വ്യക്തമായതിനാൽ ‘കടന്നു’ സ്വാഭാവികവും അർത്ഥസമ്പന്നവുമാണ്.
- source_word: הַגִּלְגָּלָה
  choice: ഗിൽഗാലിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה, ഗിൽഗാലിലേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്നു.
- source_word: וְכִמְהָן
  choice: കിംഹാമും
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു; וְ എന്ന സംയോജകവും വിഷയചിഹ്നമായ ‘ഉം’ മുഖേന പ്രകടമാക്കി.
- source_word: עָבַר עִמּוֹ
  choice: അദ്ദേഹത്തോടൊപ്പം കടന്നു
  rationale: ആദ്യ ക്രിയയുടെ ആവർത്തനം നിലനിർത്തി കിംഹാം രാജാവിനോടൊപ്പം അതേ കടക്കൽ നടത്തിയെന്ന് വ്യക്തമാക്കി.
- source_word: וְכָל עַם יְהוּדָה
  choice: യെഹൂദാജനം മുഴുവനും
  rationale: עַם ഇവിടെ യെഹൂദയിലെ ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; രാഷ്ട്രീയ-ഗോത്രപരമായ വേർതിരിവ് അമിതവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ
  choice: രാജാവിനെ അക്കരെ കടത്തി
  rationale: നേരിട്ടുള്ള കർമത്തോടുകൂടിയ עבר ഇവിടെ കാരണാർഥമോ കൈപിടിച്ചുകടത്തുന്ന അർത്ഥമോ വഹിക്കുന്നു. ‘അക്കരെ കടത്തി’ അത് ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְגַם חֲצִי עַם יִשְׂרָאֵל
  choice: യിസ്രായേൽജനത്തിൽ പകുതിയും അവരോടൊപ്പം ഉണ്ടായിരുന്നു
  rationale: യെഹൂദാജനത്തോടൊപ്പം പങ്കെടുത്ത മറ്റൊരു കൂട്ടത്തെ ചേർക്കുന്ന וְגַם എന്ന ആശയം ‘ഉം’ മുഖേന നിലനിർത്തുന്നു; മലയാളത്തിൽ അപൂർണ്ണവാക്യം ഒഴിവാക്കാൻ പങ്കാളിത്തം സ്വാഭാവികമായി വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. യെഹൂദയും യിസ്രായേലും തമ്മിലുള്ള വാചകത്തിലെ രാഷ്ട്രീയ-ജനവിഭാഗ വ്യത്യാസം അതേപടി സൂക്ഷിച്ചു; യോർദ്ദാൻ എന്ന പേര് ഈ വാക്യത്തിൽ ഇല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
