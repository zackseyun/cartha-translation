translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ഗോത്രങ്ങളെ പ്രതിനിധീകരിക്കുന്ന എബ്രായ ഏകവചനങ്ങൾ സ്വാഭാവിക മലയാള സമൂഹബഹുവചനമായി നൽകി. മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അനുബന്ധ കുറിപ്പുകളോട് പൊരുത്തപ്പെടേണ്ടതിനാൽ അവസാന പ്രയാസമുള്ള വാക്യഭാഗത്തിന് [c] ചേർക്കേണ്ടതാണ്.
