  to: 'അപ്പോൾ യെഹൂദയിലെ പുരുഷന്മാരെല്ലാം ഇസ്രായേലിലെ പുരുഷന്മാരോട്[a] ഉത്തരം പറഞ്ഞു: “രാജാവ് ഞങ്ങൾക്ക് അടുത്ത ബന്ധുവായതുകൊണ്ടാണ്[b]. ഈ കാര്യത്തെച്ചൊല്ലി നിങ്ങൾ കോപിക്കുന്നത് എന്തിന്? ഞങ്ങൾ രാജാവിന്റെ ചെലവിൽ വല്ലതും ഭക്ഷിച്ചിട്ടുണ്ടോ? അല്ലെങ്കിൽ രാജാവ് ഞങ്ങൾക്ക് എന്തെങ്കിലും തന്നിട്ടുണ്ടോ[c]?”'
