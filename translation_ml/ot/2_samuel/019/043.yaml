source:
  edition: WLC
  text: וַ/יַּעַן֩ כָּל אִ֨ישׁ יְהוּדָ֜ה עַל אִ֣ישׁ יִשְׂרָאֵ֗ל כִּֽי קָר֤וֹב הַ/מֶּ֨לֶךְ֙ אֵלַ֔/י וְ/לָ֤/מָּה זֶּה֙ חָרָ֣ה לְ/ךָ֔ עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה הֶ/אָכ֤וֹל אָכַ֨לְנוּ֙ מִן הַ/מֶּ֔לֶךְ אִם נִשֵּׂ֥את נִשָּׂ֖א לָֽ/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദയിലെ പുരുഷന്മാരെല്ലാം ഇസ്രായേലിലെ പുരുഷന്മാരോട്[a] ഉത്തരം പറഞ്ഞു: “രാജാവ് ഞങ്ങൾക്ക് അടുത്ത ബന്ധുവായതുകൊണ്ടാണ്[b]. ഈ കാര്യത്തെച്ചൊല്ലി നിങ്ങൾ കോപിക്കുന്നത് എന്തിന്? ഞങ്ങൾ രാജാവിന്റെ ചെലവിൽ വല്ലതും ഭക്ഷിച്ചിട്ടുണ്ടോ? അല്ലെങ്കിൽ രാജാവ് ഞങ്ങൾക്ക് എന്തെങ്കിലും തന്നിട്ടുണ്ടോ[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായമൂലത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേൽപുരുഷനോട്’; ഇവിടെ അത് ഇസ്രായേലിലെ പുരുഷന്മാരെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
    reason: collective_singular
  - marker: b
    text: എബ്രായമൂലത്തിൽ അക്ഷരാർഥം ‘രാജാവ് എനിക്ക് അടുത്തവനാണ്’; ഇവിടെ ഉദ്ദേശിക്കുന്നത് കുടുംബപരമോ ഗോത്രപരമോ ആയ അടുപ്പമായിരിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിലെ അവസാന വാക്യഭാഗം പ്രയാസമുള്ളതാണ്. അക്ഷരാർഥത്തിൽ ‘ഞങ്ങൾക്കായി എന്തെങ്കിലും വഹിക്കപ്പെട്ടിട്ടുണ്ടോ?’ എന്നതുപോലെയാണ്; സന്ദർഭത്തിൽ രാജാവിൽനിന്ന് എന്തെങ്കിലും സമ്മാനമോ ആനുകൂല്യമോ ലഭിച്ചതിനെ ഇത് സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: അപ്പോൾ ... ഉത്തരം പറഞ്ഞു
  rationale: വയ്യിഖ്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെയും മറുപടിയുടെ സ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം നിലനിർത്തുന്നു.
- source_word: כָּל אִישׁ יְהוּדָה
  choice: യെഹൂദാപുരുഷന്മാരെല്ലാം
  rationale: അക്ഷരാർഥത്തിലുള്ള ഏകവചനത്തിന് ഇവിടെ സമൂഹത്തെ പ്രതിനിധീകരിക്കുന്ന വിതരണാത്മക അർഥമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹബഹുവചനം ഉപയോഗിച്ചു.
- source_word: עַל אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുരുഷന്മാരോട്
  rationale: തർക്കസന്ദർഭത്തിൽ עַל അഭിസംബോധന ചെയ്യപ്പെടുന്ന പക്ഷത്തെ സൂചിപ്പിക്കുന്നു; സമൂഹത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനം മലയാളത്തിൽ സ്വാഭാവിക ബഹുവചനമായി നൽകി.
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  choice: രാജാവ് ഞങ്ങൾക്ക് അടുത്ത ബന്ധുവായതുകൊണ്ടാണ്
  rationale: קָרוֹב ഇവിടെ ഭൂമിശാസ്ത്രപരമായ സമീപ്യതയെക്കാൾ ഗോത്രപരമോ കുടുംബപരമോ ആയ ബന്ധസാമീപ്യം സൂചിപ്പിക്കുന്നു.
- source_word: וְלָמָּה זֶּה חָרָה לְךָ עַל הַדָּבָר הַזֶּה
  choice: ഈ കാര്യത്തെച്ചൊല്ലി നിങ്ങൾ കോപിക്കുന്നത് എന്തിന്?
  rationale: חָרָה എന്ന 'കത്തുക' എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം 'കോപിക്കുക' ആണ്; דָּבָר ഇവിടെ തർക്കവിഷയമായ കാര്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ
  choice: ഞങ്ങൾ രാജാവിന്റെ ചെലവിൽ വല്ലതും ഭക്ഷിച്ചിട്ടുണ്ടോ?
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന ഘടനയുടെ ഊന്നൽ 'വല്ലതും' എന്നതിലൂടെ അറിയിച്ചു; מִן־הַמֶּלֶךְ സന്ദർഭത്തിൽ രാജാവിൽനിന്നുള്ള ഭൗതിക ആനുകൂല്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אִם נִשֵּׂאת נִשָּׂא לָנוּ
  choice: അല്ലെങ്കിൽ ഞങ്ങൾക്കായി വല്ല സമ്മാനവും കൊണ്ടുവന്നിട്ടുണ്ടോ?
  rationale: പ്രയാസമുള്ള എബ്രായ വാചകത്തിന്റെ נשׂא എന്ന 'വഹിക്കുക/കൊണ്ടുവരുക' ധ്വനി നിലനിർത്തി; സന്ദർഭം ആവശ്യപ്പെടുന്ന പരോക്ഷ വസ്തുവായി 'സമ്മാനം' ചേർത്തുവെങ്കിലും അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
