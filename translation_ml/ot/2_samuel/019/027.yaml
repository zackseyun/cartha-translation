translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള രാജസദസ്സ്-ശൈലി സ്വീകരിച്ചു. നൽകിയിരിക്കുന്ന എബ്രായ സ്രോതസ്സിലെ ‘അവൻ പറഞ്ഞു’ എന്ന ഘടകവും ‘എന്റെ ദാസൻ എന്നെ വഞ്ചിച്ചു’ എന്ന വാക്യഘടനയും ഇംഗ്ലീഷ് പരിശോധനാപാഠത്തിൽനിന്ന് വ്യത്യസ്തമായിരുന്നാലും സ്രോതസ്സനുസരിച്ച് നിലനിർത്തി. ‘അങ്ങ്/അങ്ങയുടെ’ എന്ന ആദരരൂപം രാജാവിനോടുള്ള അഭിസംബോധനയിൽ ഉപയോഗിച്ചു.
