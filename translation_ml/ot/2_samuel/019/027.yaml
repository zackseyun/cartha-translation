  yaml_path: translation/ot/2_samuel/019/027.yaml
  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “എന്റെ പ്രഭുവായ രാജാവേ, എന്റെ ദാസൻ എന്നെ വഞ്ചിച്ചു.[a] ‘ഞാൻ എനിക്കായി കഴുതയ്ക്കു ജീനി കെട്ടും, അതിന്മേൽ കയറും, രാജാവിനോടൊപ്പം പോകും’ എന്ന് അങ്ങയുടെ ദാസനായ ഞാൻ പറഞ്ഞിരുന്നു; കാരണം, അങ്ങയുടെ ദാസൻ മുടന്തനായതിനാൽ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നെ തെറ്റിദ്ധരിപ്പിച്ചു” അല്ലെങ്കിൽ “എന്നോടു ദ്രോഹം ചെയ്തു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയയ്ക്ക് വഞ്ചനാപരമായി തെറ്റിദ്ധരിപ്പിക്കുക, ദ്രോഹപരമായി പെരുമാറുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: അവൻ പറഞ്ഞു
  rationale: നൽകിയിരിക്കുന്ന എബ്രായ സ്രോതസ്സിലെ ആഖ്യാനക്രിയ വ്യക്തമായി നിലനിർത്തുന്നു; ഉദ്ധരണിയുടെ ആരംഭം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: യജമാനനായ രാജാവേ
  rationale: രാജാവിനോടുള്ള ആദരപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധന ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: עַבְדִּי
  choice: എന്റെ ദാസൻ
  rationale: രാജകീയ ഗൃഹത്തിലെ വ്യക്തിപരമായ സേവകനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദാസൻ’ യോജിക്കുന്നു; അടിമത്തത്തിന്റെ നിയമപദവി അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: רִמָּנִי
  choice: എന്നെ വഞ്ചിച്ചു
  rationale: പിയേൽ ക്രിയാരൂപം തെറ്റിദ്ധരിപ്പിക്കൽ, വഞ്ചിക്കൽ, ദ്രോഹപരമായി പെരുമാറൽ എന്നീ അർഥങ്ങൾ വഹിക്കാം. നൽകിയിരിക്കുന്ന സ്രോതസ്സിലെ നേരിട്ടുള്ള കർമപ്രത്യയം അനുസരിച്ച് ‘എന്നെ വഞ്ചിച്ചു’ എന്ന വിശാലവും സ്വാഭാവികവുമായ പ്രയോഗം സ്വീകരിച്ചു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ ഞാൻ
  rationale: രാജാവിന്റെ മുമ്പിലുള്ള വിനയപൂർവമായ സ്വയംപരാമർശം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  choice: ഞാൻ എനിക്കായി കഴുതയ്ക്കു ജീനി കെട്ടി
  rationale: ആദ്യപുരുഷ ഉദ്ദേശ്യഭാവവും לִי എന്ന സ്വപ്രയോജനസൂചനയും നിലനിർത്തുന്നു; חבש ഇവിടെ സവാരിക്കായി മൃഗത്തിന് ജീനി കെട്ടുന്നതാണ്.
- source_word: וְאֶרְכַּב עָלֶיהָ וְאֵלֵךְ אֶת־הַמֶּלֶךְ
  choice: അതിന്മേൽ കയറി രാജാവിനോടൊപ്പം പോകും
  rationale: തുടർച്ചയായ ഉദ്ദേശ്യപ്രവർത്തനങ്ങളും אֶת മുഖേനയുള്ള അനുഗമനാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: פִסֵּחַ
  choice: മുടന്തുണ്ട്
  rationale: ശാരീരികമായ നടക്കൽവൈകല്യം വ്യക്തമായി സൂചിപ്പിക്കുന്ന, അപമാനകരമല്ലാത്ത ആധുനിക മലയാളപ്രയോഗം.
