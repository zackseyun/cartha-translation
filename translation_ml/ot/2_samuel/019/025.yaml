revisions:
- from: ശൗലിന്റെ മകനായ മെഫീബോശെത്ത് രാജാവിനെ എതിരേൽക്കാൻ ഇറങ്ങിവന്നു. രാജാവ് പോയ ദിവസംമുതൽ സമാധാനത്തോടെ മടങ്ങിവന്ന ദിവസംവരെ അവൻ കാലുകൾ പരിചരിക്കുകയോ[a], മീശ വെട്ടിയൊതുക്കുകയോ[b], വസ്ത്രങ്ങൾ അലക്കുകയോ ചെയ്തിരുന്നില്ല[c].
  to: ശൗലിന്റെ മകനായ മെഫീബോശെത്ത് രാജാവിനെ എതിരേൽക്കാൻ ഇറങ്ങിവന്നു. രാജാവ് പോയ ദിവസം മുതൽ സമാധാനത്തോടെ വന്ന ദിവസം വരെ അവൻ തന്റെ കാലുകൾ പരിചരിക്കുകയോ[a], മീശ വെട്ടിയൊതുക്കുകയോ[b], വസ്ത്രങ്ങൾ അലക്കുകയോ ചെയ്തിരുന്നില്ല[c].
  rationale: മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘മടങ്ങി’ ഒഴിവാക്കി בָּא בְּשָׁלוֹם എന്നതിന്റെ ‘സമാധാനത്തോടെ വന്നു/സുരക്ഷിതനായി വന്നു’ എന്ന അർഥവ്യാപ്തി മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി. മറ്റ് മാറ്റങ്ങൾ വായനാസൗകര്യത്തിനുള്ള വിരാമ-ഉടമസൂചന ക്രമീകരണങ്ങളാണ്; അർഥത്തിൽ മാറ്റമില്ല.
