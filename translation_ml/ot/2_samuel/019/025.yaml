reference: 2 Samuel 19:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מְפִבֹ֨שֶׁת֙ בֶּן שָׁא֔וּל יָרַ֖ד לִ/קְרַ֣את הַ/מֶּ֑לֶךְ וְ/לֹא עָשָׂ֨ה רַגְלָ֜י/ו וְ/לֹא עָשָׂ֣ה שְׂפָמ֗/וֹ וְ/אֶת בְּגָדָי/ו֙ לֹ֣א כִבֵּ֔ס לְ/מִן הַ/יּוֹם֙ לֶ֣כֶת הַ/מֶּ֔לֶךְ עַד הַ/יּ֖וֹם אֲשֶׁר בָּ֥א בְ/שָׁלֽוֹם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
translation:
  language: ml
  text: ശൗലിന്റെ മകനായ മെഫീബോശെത്ത് രാജാവിനെ എതിരേൽക്കാൻ ഇറങ്ങിവന്നു. രാജാവ് പോയ ദിവസം മുതൽ സമാധാനത്തോടെ വന്ന ദിവസം വരെ അവൻ തന്റെ കാലുകൾ പരിചരിക്കുകയോ[a], മീശ വെട്ടിയൊതുക്കുകയോ[b], വസ്ത്രങ്ങൾ അലക്കുകയോ ചെയ്തിരുന്നില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘തന്റെ കാലുകൾ ചെയ്തില്ല.’ സാധാരണ കാല്പരിചരണമോ ശുചീകരണമോ അവഗണിച്ചതിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപദം പ്രത്യേകിച്ച് മേൽച്ചുണ്ടിലെ രോമഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മറ്റൊരു പരിഭാഷ: ‘മീശ പരിചരിക്കുകയോ.’'
    reason: lexical_alternative
  - marker: c
    text: ‘സമാധാനത്തോടെ വന്ന’ എന്നത് ‘സുരക്ഷിതനായി വന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: ഇറങ്ങിവന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘താഴേക്ക് വരുക/പോകുക’ നിലനിർത്തുകയും, രാജാവിനെ സമീപിക്കുന്ന ആഖ്യാനവീക്ഷണത്തിന് ‘വന്നു’ യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: രാജാവിനെ എതിരേൽക്കാൻ
  rationale: ഒരാളെ ചെന്നുകാണുക/സ്വീകരിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: וְלֹא עָשָׂה רַגְלָיו
  choice: കാലുകൾ പരിചരിക്കുകയോ ചെയ്തിരുന്നില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ കാലുകൾ ചെയ്തില്ല’ എന്ന അനിശ്ചിത പ്രയോഗമാണിത്. കൃത്യമായ ശുശ്രൂഷാക്രമം വ്യക്തമല്ലാത്തതിനാൽ പൊതുവായ പരിചരണാർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְלֹא עָשָׂה שְׂפָמוֹ
  choice: മീശ വെട്ടിയൊതുക്കുകയോ
  rationale: שָׂפָם മേൽച്ചുണ്ടിലെ രോമം/മീശയെ സൂചിപ്പിക്കുന്നു. ദുഃഖാചരണസദൃശമായ അവഗണനയുടെ പശ്ചാത്തലത്തിൽ ‘വെട്ടിയൊതുക്കുക’ സ്വാഭാവികമാണ്; മുഴുവൻ താടിയെന്ന അർഥം ചേർക്കുന്നില്ല.
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  choice: വസ്ത്രങ്ങൾ അലക്കുകയോ ചെയ്തിരുന്നില്ല
  rationale: כִבֵּס വസ്ത്രം കഴുകുകയോ അലക്കുകയോ ചെയ്യുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അലക്കുക’ സ്വാഭാവികമാണ്.
- source_word: לְמִן הַיּוֹם לֶכֶת הַמֶּלֶךְ
  choice: രാജാവ് പോയ ദിവസംമുതൽ
  rationale: הלך ഇവിടെ ഉയർന്ന രജിസ്റ്ററോ പ്രത്യേക യാത്രാഭാവമോ കൂടാതെ രാജാവിന്റെ പോകലിനെ സൂചിപ്പിക്കുന്നു; ‘പോയ’ ലളിതവും കൃത്യവുമാണ്.
- source_word: עַד הַיּוֹם אֲשֶׁר בָּא בְשָׁלוֹם
  choice: സമാധാനത്തോടെ മടങ്ങിവന്ന ദിവസംവരെ
  rationale: בְשָׁלוֹם സമാധാനത്തോടെയും സുരക്ഷിതമായും വരുന്നതിനെ സൂചിപ്പിക്കാം. മുൻപ് പോയ രാജാവിനെക്കുറിച്ചായതിനാൽ ‘മടങ്ങിവന്നു’ സന്ദർഭസൂചിതമാണ്; ‘വീട്ടിൽ’ എന്ന ഉറവിടത്തിലില്ലാത്ത ആശയം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: בְשָׁלוֹם എന്നതിലെ അർഥവ്യാപ്തി
  choice: സമാധാനത്തോടെ മടങ്ങിവന്നു
  alternative: സുരക്ഷിതനായി മടങ്ങിവന്നു
  rationale: ‘ശാലോം’ എന്ന പദത്തിലെ സമാധാന/ക്ഷേമഭാവം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; സുരക്ഷിതമായെത്തുക എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു. ഇവിടെ പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ഏർപ്പെടുത്തിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ കാല്പരിചരണപ്രയോഗത്തിന്റെ അനിശ്ചിതത്വവും בְשָׁלוֹם എന്നതിലെ ‘സമാധാനം/സുരക്ഷ’ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
