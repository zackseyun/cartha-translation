  terminology: ‘വിജയം,’ ‘വിലാപം,’ ‘ജനം,’ and ‘ദുഃഖിച്ചിരിക്കുന്നു’ are appropriate, modern-standard Malayalam choices. ‘തന്റെ മകനെച്ചൊല്ലി’ naturally expresses the occasion of the king’s grief.
