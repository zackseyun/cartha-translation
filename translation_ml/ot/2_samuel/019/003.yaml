source:
  edition: WLC
  text: וַ/תְּהִ֨י הַ/תְּשֻׁעָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא לְ/אֵ֖בֶל לְ/כָל הָ/עָ֑ם כִּֽי שָׁמַ֣ע הָ/עָ֗ם בַּ/יּ֤וֹם הַ/הוּא֙ לֵ/אמֹ֔ר נֶעֱצַ֥ב הַ/מֶּ֖לֶךְ עַל בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
translation:
  language: ml
  text: അങ്ങനെ, അന്നത്തെ വിജയം ജനമെല്ലാവർക്കും വിലാപമായി മാറി[a]. കാരണം, “രാജാവ് തന്റെ മകനെച്ചൊല്ലി ദുഃഖിച്ചിരിക്കുന്നു” എന്ന് അന്നു ജനം കേട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അന്നത്തെ വിടുതൽ വിലാപമായി മാറി.’'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ജനം കേട്ടു—പറഞ്ഞുകൊണ്ട്’; ഒരു വാർത്ത കേൾക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  choice: വിജയം
  rationale: യുദ്ധാനന്തരസന്ദർഭത്തിൽ ഈ പദം യുദ്ധത്തിൽ നേടിയ വിജയകരമായ ഫലത്തെയോ വിടുതലിനെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഇവിടെ ‘വിജയം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וַתְּהִי ... לְאֵבֶל
  choice: വിലാപമായി മാറി
  rationale: എബ്രായപ്രയോഗത്തിന്റെ ഫലസൂചക അർഥവും വിജയത്തിൽനിന്ന് ദുഃഖത്തിലേക്കുള്ള ശക്തമായ തിരിച്ചുമാറ്റവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵבֶל
  choice: വിലാപം
  rationale: ഇത് വ്യക്തിയുടെ ഉള്ളിലെ ദുഃഖം മാത്രമല്ല, സമൂഹത്തിൽ പ്രകടമാകുന്ന ശോകാചരണത്തെയും സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘വിലാപം’ ഈ പശ്ചാത്തലത്തിന് യോജിക്കുന്നു.
- source_word: הָעָם
  choice: ജനം / ജനമെല്ലാവരും
  rationale: മൂലപാഠത്തിലെ പൊതുവായ ‘ജനം’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ദാവീദിനോടൊപ്പമുള്ള പോരാളികളും അനുയായികളും ഇതിൽ ഉൾപ്പെടാം.
- source_word: כִּי שָׁמַע ... לֵאמֹר
  choice: എന്ന് ... കേട്ടിരുന്നു
  rationale: ‘കേട്ടു, പറഞ്ഞുകൊണ്ട്’ എന്ന അക്ഷരാർഥപ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ഒരു വാർത്ത കേട്ടുവെന്ന എബ്രായ ശൈലി റിപ്പോർട്ട് ചെയ്ത വാക്കുകളോടുകൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נֶעֱצַב
  choice: ദുഃഖിച്ചിരിക്കുന്നു
  rationale: Niphal രൂപം രാജാവ് വേദനയും ദുഃഖവും അനുഭവിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘ദുഃഖിച്ചിരിക്കുന്നു’ ഗൗരവവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: עַל בְּנוֹ
  choice: തന്റെ മകനെച്ചൊല്ലി
  rationale: ദുഃഖത്തിന്റെ കാരണമോ വിഷയമോ സൂചിപ്പിക്കുന്ന עַל എന്ന പദത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
