translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സൈനികസന്ദർഭത്തിൽ ‘വിജയം’ തിരഞ്ഞെടുത്തു; പൊതുവായ הָעָם എന്ന പദം ചുരുക്കി ‘സൈന്യം’ എന്നു വ്യാഖ്യാനിക്കാതെ ‘ജനം’ ആയി നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
