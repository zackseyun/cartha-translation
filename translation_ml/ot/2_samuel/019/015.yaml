language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֛ט אֶת לְבַ֥ב כָּל אִישׁ יְהוּדָ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וַֽ/יִּשְׁלְחוּ֙ אֶל הַ/מֶּ֔לֶךְ שׁ֥וּב אַתָּ֖ה וְ/כָל עֲבָדֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/015.yaml
  text: And he swayed the heart of every man of Judah as one man, and they sent word to the king, “Return, you and all your servants.”
translation:
  language: ml
  text: 'അവൻ യെഹൂദായിലെ സകല പുരുഷന്മാരുടെയും മനസ്സ് ഒരേ മനസ്സാക്കി ചായിച്ചു. അപ്പോൾ അവർ രാജാവിന് സന്ദേശം അയച്ചു: “അങ്ങും അങ്ങയുടെ സകല സേവകരും മടങ്ങിവരിക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט אֶת־לְבַב
  choice: മനസ്സ് ... തനിക്കനുകൂലമാക്കി
  rationale: ഈ സന്ദർഭത്തിൽ ‘ഹൃദയം ചായിച്ചു/തിരിച്ചു’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ബലപ്രയോഗമല്ല, അനുകൂല നിലപാടിലേക്കുള്ള സ്വാധീനമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כְּאִישׁ אֶחָד
  choice: ഒരേ മനസ്സുപോലെ
  rationale: അക്ഷരാർഥമായ ‘ഒരു മനുഷ്യനെപ്പോലെ’ എന്നതിന്റെ ഐക്യവും ഏകാഭിപ്രായവും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁלְחוּ אֶל־הַמֶּלֶךְ
  choice: രാജാവിന്റെ അടുക്കൽ ആളയച്ച്
  rationale: ഹീബ്രുവിൽ അയച്ച വസ്തു വ്യക്തമാക്കിയിട്ടില്ല; സന്ദേശവാഹകരെ അയച്ചെന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ... സേവകർ
  rationale: രാജാവിന്റെ അനുചരന്മാരെ സൂചിപ്പിക്കുന്ന മാന്യവും ആധുനികവുമായ പൊതുപദം.
theological_decisions:
- issue: ഹൃദയം തിരിച്ചതിന്റെ പ്രവർത്തകനെ തിരിച്ചറിയിക്കൽ
  choice: ഉറവിടത്തിലെ സർവനാമം പിന്തുടർന്ന് ‘അവൻ’ നിലനിർത്തി
  alternative: ‘ദാവീദ്’ എന്ന് പേരെടുത്തു പറയുക
  rationale: സന്ദർഭത്തിൽ ദാവീദാണ് സൂചനയെങ്കിലും, ഹീബ്രു വാചകത്തിലെ സർവനാമത്തെ പേരാക്കി വ്യാഖ്യാനിച്ച് മാറ്റാതിരിക്കാൻ.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
