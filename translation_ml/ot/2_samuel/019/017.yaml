  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഭൂപ്രകൃതിസൂചകമായ ‘ഇറങ്ങുക’ നിലനിർത്തുകയും സമൂഹവാചകമായ ഏകവചനത്തിന് അടിക്കുറിപ്പ് നൽകുകയും ചെയ്തു.
