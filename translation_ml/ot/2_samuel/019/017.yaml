source:
  edition: WLC
  text: וַ/יְמַהֵ֗ר שִׁמְעִ֤י בֶן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אֲשֶׁ֖ר מִ/בַּֽחוּרִ֑ים וַ/יֵּ֨רֶד֙ עִם אִ֣ישׁ יְהוּדָ֔ה לִ/קְרַ֖את הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/017.yaml
  text: Shimei son of Gera[a], the Benjaminite from Bahurim, hurried and went down with the men of Judah to meet King David.
translation:
  language: ml
  text: ബഹൂരീമിൽനിന്നുള്ള ബെന്യാമീന്യനായ ഗേരയുടെ മകൻ ശിമെയി വേഗത്തിൽ യെഹൂദാപുരുഷന്മാരോടൊപ്പം ദാവീദ് രാജാവിനെ എതിരേൽക്കാൻ ഇറങ്ങിച്ചെന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘യെഹൂദാപുരുഷനോടൊപ്പം’; ഇവിടെ ഈ പ്രയോഗം സമൂഹവാചകമായി ‘യെഹൂദാപുരുഷന്മാരോടൊപ്പം’ എന്നു മനസ്സിലാക്കിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: വേഗം പുറപ്പെട്ടു
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന തിടുക്കവും അടിയന്തരതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שִׁמְעִי בֶן־גֵּרָא
  choice: ഗേരയുടെ മകൻ ശിമെയി
  rationale: വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുകയും എബ്രായ പിതൃനാമഘടന വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בֶּן־הַיְמִינִי
  choice: ബെന്യാമീന്യനായ
  rationale: സന്ദർഭത്തിൽ ഇത് മറ്റൊരു പിതൃനാമമല്ല, ബെന്യാമീൻ ഗോത്രബന്ധം സൂചിപ്പിക്കുന്ന ജനവിഭാഗനാമമാണ്.
- source_word: אֲשֶׁר מִבַּחוּרִים
  choice: ബഹൂരീമിൽനിന്നുള്ള
  rationale: ശിമെയിയുടെ സ്വദേശം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: എബ്രായത്തിലെ ഭൂപ്രകൃതിസംബന്ധിയായ ‘താഴേക്ക് പോകുക’ എന്ന ചലനാർത്ഥം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עִם אִישׁ יְהוּדָה
  choice: യെഹൂദാപുരുഷന്മാരോടൊപ്പം
  rationale: אִישׁ ഏകവചനരൂപത്തിലാണെങ്കിലും ഇവിടെ സമൂഹവാചകമായി മനസ്സിലാക്കുന്നത് സന്ദർഭത്തിന് യോജിക്കുന്നു; രൂപപരമായ വ്യത്യാസം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: לִקְרַאת
  choice: എതിരേൽക്കാൻ
  rationale: ഒരാളെ നേരിൽ ചെന്നു കാണുന്നതിനായുള്ള ഗതിയെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവ്
  rationale: പദവിയും പേരും നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാള പദക്രമം ഉപയോഗിക്കുന്നു.
