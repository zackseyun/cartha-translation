id: 2SA.19.31
reference: 2 Samuel 19:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מְפִיבֹ֨שֶׁת֙ אֶל הַ/מֶּ֔לֶךְ גַּ֥ם אֶת הַ/כֹּ֖ל יִקָּ֑ח אַ֠חֲרֵי אֲשֶׁר בָּ֞א אֲדֹנִ֥/י הַ/מֶּ֛לֶך בְּ/שָׁל֖וֹם אֶל בֵּיתֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/031.yaml
  text: Mephibosheth said to the king[a], “Let him even take it all, since my lord the king has come safely to his own house.”
translation:
  language: ml
  text: 'മെഫീബോശെത്ത് രാജാവിനോടു പറഞ്ഞു: “അവൻ അതെല്ലാംതന്നെ എടുത്തുകൊള്ളട്ടെ; എന്റെ പ്രഭുവായ രാജാവ് സ്വന്തം ഭവനത്തിലേക്ക് സുരക്ഷിതനായി[a] എത്തിയിരിക്കുന്നതിനാൽ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “സമാധാനത്തോടെ.”
    reason: בְּשָׁלוֹם എന്നതിന് ‘സുരക്ഷിതനായി’ എന്ന സന്ദർഭാർഥത്തോടൊപ്പം ‘സമാധാനത്തോടെ’ എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ള വിവർത്തനവും സാധ്യമാണ്.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സാധാരണ പ്രസ്താവനാക്രിയയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מְפִיבֹשֶׁת
  choice: മെഫീബോശെത്ത്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֶל הַמֶּלֶךְ
  choice: രാജാവിനോടു
  rationale: മൂലപാഠത്തിലെ പദവിനാമം മാത്രം നിലനിർത്തുന്നു; ദാവീദ് എന്ന പേര് ചേർക്കുന്നില്ല.
- source_word: גַּם אֶת הַכֹּל יִקָּח
  choice: അവൻ അതെല്ലാംതന്നെ എടുത്തുകൊള്ളട്ടെ
  rationale: יִקָּח എന്നതിന്റെ അനുവാദാത്മകമായ ആശയവും גַּם, הַכֹּל എന്നിവയുടെ സമ്പൂർണതയ്ക്കുള്ള ഊന്നലും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: എത്തിയിരിക്കുന്നല്ലോ
  rationale: ഇവിടെ ഈ പ്രയോഗത്തിനുള്ള കാലപരവും കാരണസൂചകവുമായ ഭാവം മലയാളത്തിലെ ‘-ല്ലോ’ എന്ന പ്രസക്തിസൂചക രൂപത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: രാജസദസ്സിലെ ആദരപൂർവമായ അഭിസംബോധനയും ഒന്നാംപുരുഷ ഉടമസ്ഥതയും സംരക്ഷിക്കുന്നു.
- source_word: בְּשָׁלוֹם
  choice: സുരക്ഷിതനായി
  rationale: രാജാവ് അപകടമില്ലാതെ മടങ്ങിയെത്തിയെന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ രൂപം അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
- source_word: אֶל בֵּיתוֹ
  choice: സ്വന്തം ഭവനത്തിൽ
  rationale: ഉടമസ്ഥതയ്ക്കുള്ള ഊന്നൽ നിലനിർത്തുന്നു; ‘അരമന’ പോലുള്ള മൂലപാഠത്തിലില്ലാത്ത പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മെഫീബോശെത്തിന്റെ സ്വത്തുസംബന്ധമായ പൂർണ വിട്ടുകൊടുക്കലിനുള്ള ഊന്നൽ ‘അതെല്ലാംതന്നെ’ എന്നതിലൂടെ നിലനിർത്തി; രാജാവിനോടുള്ള ആദരഭാഷയും സംരക്ഷിച്ചു.
