id: 2SA.19.2
reference: 2 Samuel 19:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֻּגַּ֖ד לְ/יוֹאָ֑ב הִנֵּ֨ה הַ/מֶּ֧לֶךְ בֹּכֶ֛ה וַ/יִּתְאַבֵּ֖ל עַל אַבְשָׁלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/002.yaml
  text: And it was reported to Joab, “Look, the king is weeping and mourning over Absalom.”
translation:
  language: ml
  text: 'യോവാബിന് ഇങ്ങനെ വിവരം ലഭിച്ചു: “ഇതാ, രാജാവ് അബ്ശാലോമിനെ ഓർത്ത് കരയുകയും ദുഃഖിക്കുകയും ചെയ്യുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: അറിയിച്ചു
  rationale: נגד എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപം വിവരം യോവാബിനെ അറിയിക്കപ്പെട്ടുവെന്ന അർഥം നൽകുന്നു. മലയാളത്തിലെ കർത്താവില്ലാത്ത പ്രയോഗം, അറിയിച്ച വ്യക്തിയെ വ്യക്തമാക്കാതെ മൂലപാഠത്തിലെ നിർവ്യക്തത നിലനിർത്തുന്നു.
- source_word: לְיוֹאָב
  choice: യോവാബിനെ
  rationale: മലയാളത്തിൽ ‘അറിയിക്കുക’ എന്ന ക്രിയയോടൊപ്പം വിവരം ലഭിക്കുന്ന വ്യക്തിയെ ദ്വിതീയാവിഭക്തിയിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: റിപ്പോർട്ടിന്റെ ഉള്ളടക്കത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു നിപാതത്തിന്റെ തത്സമയഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ ദാവീദിനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട സ്ഥാനപ്പേരാണിത്; മൂലപാഠം പേര് ഉപയോഗിക്കാത്തതിനാൽ സ്ഥാനപ്പേര് തന്നെയാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
- source_word: בֹּכֶה
  choice: കരയുകയും
  rationale: വർത്തമാന കൃദന്തരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ചെയ്യുന്നു’ എന്ന സംയുക്തക്രിയയോടു ചേർന്ന ഈ രൂപം ആ ദൈർഘ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּתְאַבֵּל
  choice: വിലപിക്കുകയും ചെയ്യുന്നു
  rationale: אבל എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം മരണദുഃഖത്തിലുള്ള വിലാപത്തെ സൂചിപ്പിക്കുന്നു. മുൻപുള്ള കൃദന്തരൂപത്തോടൊപ്പം രാജാവിന്റെ തുടരുന്ന അവസ്ഥയായി ഇതിനെ അവതരിപ്പിക്കുന്നു.
- source_word: עַל אַבְשָׁלֹם
  choice: അബ്ശാലോമിനെച്ചൊല്ലി
  rationale: വിലാപക്രിയയോടു ചേർന്ന עַל ദുഃഖത്തിന്റെ വിഷയത്തെയോ കാരണത്തെയോ അടയാളപ്പെടുത്തുന്നു. ‘അബ്ശാലോമിനെച്ചൊല്ലി’ ഈ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; മരണം മൂലമുള്ള ദുഃഖമെന്ന ആശയവും സന്ദർഭാനുസൃതമായി നിലനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. ഹീബ്രുവിലെ റിപ്പോർട്ട്-ഘടനയും ‘ഇതാ’ നൽകുന്ന ശ്രദ്ധാകർഷണവും നിലനിർത്തി; അറിയിച്ച വ്യക്തിയെ ചേർത്തിട്ടില്ല.
