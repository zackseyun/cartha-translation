source:
  edition: WLC
  text: וַ/יָּ֥קָם הַ/מֶּ֖לֶךְ וַ/יֵּ֣שֶׁב בַּ/שָּׁ֑עַר וּֽ/לְ/כָל הָ/עָ֞ם הִגִּ֣ידוּ לֵ/אמֹ֗ר הִנֵּ֤ה הַ/מֶּ֨לֶךְ֙ יוֹשֵׁ֣ב בַּ/שַּׁ֔עַר וַ/יָּבֹ֤א כָל הָ/עָם֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/יִשְׂרָאֵ֔ל נָ֖ס אִ֥ישׁ לְ/אֹהָלָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
translation:
  language: ml
  text: അപ്പോൾ രാജാവ് എഴുന്നേറ്റ് കവാടത്തിൽ ഇരുന്നു. “ഇതാ, രാജാവ് കവാടത്തിൽ ഇരിക്കുന്നു” എന്ന് ജനമെല്ലാവരോടും അറിയിച്ചു. ജനമെല്ലാം രാജാവിന്റെ സന്നിധിയിൽ വന്നു. എന്നാൽ ഇസ്രായേൽ ഓടിപ്പോയിരുന്നു—ഓരോ പുരുഷനും അവനവന്റെ കൂടാരത്തിലേക്ക്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഓരോ പുരുഷനും അവനവന്റെ കൂടാരത്തിലേക്ക്” എന്നത് ഓരോരുത്തരും സ്വന്തം വാസസ്ഥലത്തേക്കോ ഗോത്രപ്രദേശത്തേക്കോ പിരിഞ്ഞുപോയി എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: “ഇസ്രായേൽ ഓടിപ്പോയി—ഓരോ പുരുഷനും അവനവന്റെ കൂടാരത്തിലേക്ക്.” ഹീബ്രു ബന്ധകം ലളിതമായി തുടർച്ച സൂചിപ്പിക്കുന്നതായും വായിക്കാം; സന്ദർഭത്തിലെ വൈരുധ്യം വ്യക്തമാക്കാൻ പ്രധാനവാചകത്തിൽ “എന്നാൽ” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: അപ്പോൾ രാജാവ് എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ഖാൽ വയ്യക്ഷോൽ രൂപം കഥയിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ ... എഴുന്നേറ്റ്’ എന്നത് ആ തുടർച്ച സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  choice: കവാടത്തിൽ ഇരുന്നു
  rationale: ישב ഇവിടെ രാജാവ് പൊതുജനങ്ങൾക്കു മുന്നിൽ തന്റെ സ്ഥാനം ഏറ്റെടുത്തതിനെ സൂചിപ്പിക്കുന്നു. ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥാനാർഥവും നഗരകവാടത്തിന്റെ പൊതുസ്ഥലസ്വഭാവവും ‘കവാടത്തിൽ’ നിലനിർത്തുന്നു.
- source_word: הִגִּידוּ לֵאמֹר
  choice: എന്ന് ജനമെല്ലാം അറിയിച്ചു
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘അറിയിക്കുക/വിവരം നൽകുക’ എന്ന അർഥമുണ്ട്. ഹീബ്രുവിലെ അനിശ്ചിത ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ കർമണി പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു നിപാതത്തിന്റെ ദൈക്തിക ശക്തി ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ ‘ഇതാ’ നന്നായി വഹിക്കുന്നു.
- source_word: יוֹשֵׁב
  choice: ഇരിക്കുന്നു
  rationale: വർത്തമാനത്തിൽ തുടരുന്ന, ദൃശ്യമായ അവസ്ഥയാണ് കർത്തൃവാചക രൂപം സൂചിപ്പിക്കുന്നത്; ‘ഇരിക്കുന്നു’ അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיָּבֹא כָל הָעָם לִפְנֵי הַמֶּלֶךְ
  choice: ജനമെല്ലാം രാജാവിന്റെ സന്നിധിയിൽ വന്നു
  rationale: בוא + לפני എന്ന ഘടന രാജാവിന്റെ മുമ്പിലേക്കോ സാന്നിധ്യത്തിലേക്കോ വരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സന്നിധിയിൽ വന്നു’ പൊതുദർശനത്തിന്റെ ഭാവം അതിരുകടക്കാതെ പകരുന്നു.
- source_word: וְיִשְׂרָאֵל נָס
  choice: എന്നാൽ ഇസ്രായേല്യർ ഓടിപ്പോയിരുന്നു
  rationale: ഖാതൽ രൂപം ഉടനെയുള്ള സംഭവങ്ങൾക്ക് മുമ്പുണ്ടായ പശ്ചാത്തലാവസ്ഥയായി വായിക്കാം; അതിനാൽ ‘ഓടിപ്പോയിരുന്നു’ ഉപയോഗിച്ചു. וְ എന്ന ബന്ധകത്തിന്റെ സന്ദർഭപരമായ വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ לְאֹהָלָיו
  choice: ഓരോ പുരുഷനും അവനവന്റെ കൂടാരത്തിലേക്ക്
  rationale: വാച്യമായി ‘ഓരോ പുരുഷനും തന്റെ കൂടാരങ്ങളിലേക്ക്/കൂടാരത്തിലേക്ക്’ എന്ന വിതരണപ്രയോഗമാണിത്. ഉറവിടത്തിലെ പുരുഷലിംഗസൂചനയും കൂടാരത്തിന്റെ ദൃശ്യബിംബവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: אִישׁ എന്ന പുരുഷലിംഗ വിതരണപ്രയോഗം
  choice: ഓരോ പുരുഷനും
  alternative: ഓരോരുത്തനും / എല്ലാവരും
  rationale: അർഥം പൊതുവായി ‘ഓരോരുത്തൻ’ എന്നാകാമെങ്കിലും ഹീബ്രു പദം വ്യക്തമായി പുരുഷലിംഗ ഏകവചനമാണ്; സൈനിക-ദേശീയ സന്ദർഭത്തിലും അതു യോജിക്കുന്നതിനാൽ ലിംഗസൂചന നിലനിർത്തി.
- issue: וְיִשְׂרָאֵל נָס എന്ന വാക്യത്തിലെ ബന്ധവും കാലബന്ധവും
  choice: എന്നാൽ ഇസ്രായേല്യർ ഓടിപ്പോയിരുന്നു
  alternative: ഇസ്രായേല്യർ ഓടിപ്പോയി
  rationale: וְ ലളിതമായി ‘യും/അപ്പോൾ’ എന്നാകാം; എന്നാൽ സന്ദർഭത്തിലെ വൈരുധ്യവും נָס എന്ന ഖാതൽ രൂപത്തിന്റെ പശ്ചാത്തലസ്വഭാവവും പ്രധാനവാചകത്തിൽ പ്രകടമാക്കി. മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘കവാടം’, ‘ഇതാ’, ‘സന്നിധി’ എന്നിവ പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ബൈബിൾ-കഥന പദങ്ങളാണ്. ഹീബ്രുവിലെ ‘കൂടാരം’ എന്ന സാംസ്കാരിക പ്രയോഗം പരന്ന അർഥത്തിലേക്ക് മാറ്റാതെ അടിക്കുറിപ്പോടെ നിലനിർത്തി.
