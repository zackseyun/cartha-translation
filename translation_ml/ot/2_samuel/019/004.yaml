  text: അങ്ങനെ, അന്നു ജനം നഗരത്തിലേക്ക് ഒളിച്ചുകടന്നു; യുദ്ധത്തിൽ ഓടിപ്പോകുമ്പോൾ ലജ്ജിതരായവർ ഒളിച്ചുകടക്കുന്നതുപോലെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְגַּנֵּב / יִתְגַּנֵּב
  choice: ഒളിച്ചുകടന്നു / ഒളിച്ചുകടക്കുന്നതുപോലെ
  rationale: התפעל രൂപത്തിലുള്ള גנב ഇവിടെ മോഷണത്തെയല്ല, ആരും ശ്രദ്ധിക്കാതെ ലജ്ജയോടെ രഹസ്യമായി കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി.
- source_word: הַנִּכְלָמִים
  choice: ലജ്ജിക്കുന്നവർ
  rationale: യുദ്ധത്തിൽനിന്ന് ഓടിപ്പോയതുമൂലം അപമാനവും ലജ്ജയും അനുഭവിക്കുന്നവരെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּנוּסָם בַּמִּלְחָמָה
  choice: യുദ്ധത്തിൽനിന്ന് ഓടിപ്പോയതിൽ
  rationale: בְּנוּסָם എന്നതിലെ ഓടിപ്പോകൽ എന്ന ആശയവും അതിന്റെ യുദ്ധസന്ദർഭവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
