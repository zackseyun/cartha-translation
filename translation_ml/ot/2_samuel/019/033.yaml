translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഹീബ്രായത്തിലെ ആരംഭവാവ് പ്രത്യേകമായ കാലസൂചകപദമല്ലാത്തതിനാൽ ‘ഇപ്പോൾ’ എന്നത് ചേർത്തിട്ടില്ല. നീണ്ട മൂലവാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; കാരണബന്ധവും സർവനാമസൂചനയും വ്യക്തമായി നിലനിർത്തി.
