base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
translation:
  language: ml
  text: ബർസില്ലായി വളരെ വൃദ്ധനായിരുന്നു; അവന് എൺപത് വയസ്സായിരുന്നു. രാജാവ് മഹനയീമിൽ താമസിച്ചിരുന്നപ്പോൾ ബർസില്ലായി അദ്ദേഹത്തിനുവേണ്ടതെല്ലാം നൽകിയിരുന്നു. കാരണം, ബർസില്ലായി വളരെ ധനികനായ ഒരാളായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അവൻ വളരെ വലിയ മനുഷ്യനായിരുന്നു.’ ഈ ഹീബ്രായ പ്രയോഗം വലിയ സമ്പത്തുള്ളവൻ, പ്രമുഖൻ, അല്ലെങ്കിൽ ഏറെ സ്വാധീനമുള്ളവൻ എന്നിങ്ങനെ അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: വളരെ വൃദ്ധനായിരുന്നു
  rationale: ഈ പ്രയോഗത്തിൽ זָקֵן ആഖ്യാതസ്വഭാവത്തിൽ വരുന്നു; מְאֹד അതിന്റെ തീവ്രത കൂട്ടുന്നു. ‘വളരെ വൃദ്ധനായിരുന്നു’ എന്നത് സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളമാണ്.
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  choice: അവന് എൺപത് വയസ്സായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘എൺപത് വർഷങ്ങളുടെ മകൻ’ എന്ന ഹീബ്രായ പ്രയോഗത്തെ സ്വാഭാവിക മലയാള പ്രായപ്രയോഗമായി നൽകുന്നു.
- source_word: כִלְכַּל אֶת הַמֶּלֶךְ
  choice: രാജാവിന് വേണ്ടതെല്ലാം നൽകിയിരുന്നു
  rationale: כלכל ഇവിടെ ഒരാളുടെ ഭൗതിക ആവശ്യങ്ങൾ നിറവേറ്റി പരിപാലിക്കുക എന്ന അർഥത്തിലാണ്. ഭക്ഷണം മാത്രമായി ചുരുക്കാതെ പ്രായോഗിക സഹായത്തിന്റെ വിശാലത ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: בְּשִׁיבָתוֹ
  choice: താമസിച്ചിരുന്നപ്പോൾ
  rationale: ישב ഇവിടെ രാജാവിന്റെ താമസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സിംഹാസനാരോഹണത്തെയല്ല. സർവനാമബന്ധം അടുത്തുള്ള ‘രാജാവ്’ എന്ന പദത്തോടാണ് സ്വാഭാവികമായി ചേരുന്നത്.
- source_word: בְמַחֲנַיִם
  choice: മഹനയീമിൽ
  rationale: സ്ഥലനാമം മലയാള ബൈബിൾനാമരീതിക്ക് യോജിച്ചവിധം ലിപ്യന്തരിച്ചു.
- source_word: כִּי
  choice: കാരണം
  rationale: രാജാവിനെ പരിപാലിക്കാൻ ബർസില്ലായിക്ക് കഴിഞ്ഞതിന്റെ വിശദീകരണം അവതരിപ്പിക്കുന്ന കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  choice: ബർസില്ലായി വളരെ ധനികനായ ഒരാളായിരുന്നു
  rationale: സന്ദർഭത്തിൽ രാജാവിന്റെ ആവശ്യങ്ങൾ നിറവേറ്റാനുള്ള ബർസില്ലായിയുടെ വലിയ സാമ്പത്തികശേഷിയാണ് മുൻനിരയിൽ. എങ്കിലും ഹീബ്രായ പ്രയോഗം സമ്പത്ത്, പദവി, സ്വാധീനം എന്നിവയെ വിശാലമായി സൂചിപ്പിക്കാമെന്നതിനാൽ ആ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
