  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. എബ്രായ ആഖ്യാനത്തിന്റെ ക്രമവും ‘യെഹൂദാ’ എന്ന കൂട്ടായ പ്രയോഗവും സംരക്ഷിച്ചിരിക്കുന്നു; ഉദ്ദേശ്യവാക്യങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിലാക്കി.
