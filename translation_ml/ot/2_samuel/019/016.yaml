  yaml_path: translation/ot/2_samuel/019/016.yaml
  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
translation:
  language: ml
  text: അപ്പോൾ രാജാവ് മടങ്ങിവന്ന് യോർദ്ദാൻവരെ എത്തി. യെഹൂദാ[a] രാജാവിനെ എതിരേറ്റുചെന്ന് രാജാവിനെ യോർദ്ദാൻ കടത്താൻ ഗിൽഗാലിൽ എത്തിയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദാഗോത്രക്കാർ.’ എബ്രായത്തിൽ ‘യെഹൂദാ’ എന്നത് ഗോത്രജനത്തെ കൂട്ടായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിവന്നു
  rationale: שוב എന്ന ക്രിയയുടെ ഖാൽ ആഖ്യാനരൂപം ദാവീദ് തന്റെ പലായനത്തിനുശേഷം തിരിച്ചുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  choice: യോർദ്ദാൻവരെ എത്തി
  rationale: עַד ചലനത്തിന്റെ അതിരായ സ്ഥലത്തെ അടയാളപ്പെടുത്തുന്നു; ഈ ഘട്ടത്തിൽ നദി കടന്നുവെന്ന് പറയാതെ അതുവരെ എത്തിയെന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: וִיהוּדָה
  choice: യെഹൂദാ
  rationale: എബ്രായത്തിൽ സ്ഥലനാമം/ഗോത്രനാമം തന്നെയാണ് കൂട്ടായ അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നത്; വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ അത് മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּא
  choice: എത്തിയിരുന്നു
  rationale: മുൻപുള്ള ആഖ്യാനക്രിയകൾക്കുശേഷമുള്ള ഖാതൽ രൂപത്തെ പശ്ചാത്തലത്തിലുള്ള മുൻകാല വരവായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַגִּלְגָּלָה
  choice: ഗിൽഗാലിൽ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה അവിടേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു; മലയാള വാക്യഘടനയിൽ ‘ഗിൽഗാലിൽ എത്തിയിരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: לָלֶכֶת לִקְרַאת
  choice: എതിരേറ്റുചെന്ന്
  rationale: പോകുക, എതിരേൽക്കുക എന്നീ രണ്ടു ആശയങ്ങളും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: לְהַעֲבִיר אֶת הַמֶּלֶךְ אֶת הַיַּרְדֵּן
  choice: രാജാവിനെ യോർദ്ദാനക്കരെ കടത്താൻ
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം വ്യക്തമാക്കുന്നു; വള്ളമോ ചങ്ങാടമോ പോലുള്ള പ്രത്യേക മാർഗം പാഠത്തിൽ ചേർക്കുന്നില്ല.
