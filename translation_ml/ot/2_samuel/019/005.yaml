  text: וְ/הַ/מֶּ֨לֶךְ֙ לָאַ֣ט אֶת פָּנָ֔י/ו וַ/יִּזְעַ֥ק הַ/מֶּ֖לֶךְ ק֣וֹל גָּד֑וֹל בְּנִ/י֙ אַבְשָׁל֔וֹם אַבְשָׁל֖וֹם בְּנִ֥/י בְנִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/005.yaml
  text: And the king covered his face[a], and the king cried out with a loud voice, “My son Absalom! Absalom, my son, my son!”
translation:
  language: ml
  text: 'രാജാവ് തന്റെ മുഖം മൂടി[a]; രാജാവ് ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു: “എന്റെ മകനേ, അബ്ശാലോമേ! അബ്ശാലോമേ, എന്റെ മകനേ, എന്റെ മകനേ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ മുഖം പൊതിഞ്ഞു” അല്ലെങ്കിൽ “തന്റെ മുഖം മറച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ ദുഃഖത്തിൽ മുഖം മൂടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאַט
  choice: മൂടി
  rationale: ഇവിടെ ക്രിയ മുഖം മറയ്ക്കുകയോ മൂടുകയോ ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ദുഃഖത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികവും രീതി അനാവശ്യമായി നിർവചിക്കാത്തതുമായ പദമാണ് ‘മൂടി’.
- source_word: פָּנָיו
  choice: തന്റെ മുഖം
  rationale: നേരിട്ടുള്ള കർമ്മസൂചകത്തോടും ദുഃഖാചരണത്തിന്റെ സന്ദർഭത്തോടും കൂടിയതിനാൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഭൗതികമായ മുഖമാണ്; ‘സാന്നിധ്യം’ എന്ന വിപുലാർഥമല്ല.
- source_word: וַיִּזְעַק
  choice: നിലവിളിച്ചു
  rationale: ഈ ക്രിയ ഉച്ചത്തിലുള്ള വികാരതീവ്രമായ വിളിയെ സൂചിപ്പിക്കുന്നു. ദുഃഖസന്ദർഭത്തിന് ‘നിലവിളിച്ചു’ സ്വാഭാവികമാണ്; കോപത്തിന്റെ സൂചന നൽകാവുന്ന ‘ആർത്തുവിളിച്ചു’ പോലുള്ള രൂപങ്ങളെക്കാൾ യോജിക്കുന്നു.
- source_word: קוֹל גָּדוֹל
  choice: ഉറക്കെ
  rationale: അക്ഷരാർഥത്തിൽ ‘വലിയ ശബ്ദത്തോടെ’ എന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഉറക്കെ’ എന്നു നൽകുന്നു; വിളിയുടെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: בְּנִי
  choice: എന്റെ മകനേ
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയമുള്ള പുല്ലിംഗ ഏകവചന നാമമാണിത്. നേരിട്ടുള്ള വിലാപവിളിയായതിനാൽ സംബോധനരൂപമായ ‘എന്റെ മകനേ’ കൃത്യവും വികാരശക്തിയുള്ളതുമാണ്.
- source_word: אַבְשָׁלוֹם
  choice: അബ്ശാലോം
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ ഉപയോഗത്തിന് യോജിച്ച രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു; സംബോധനത്തിൽ ‘അബ്ശാലോമേ’ എന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: repetition of אַבְשָׁלוֹם / בְּנִי
  choice: “എന്റെ മകനേ, അബ്ശാലോമേ! അബ്ശാലോമേ, എന്റെ മകനേ, എന്റെ മകനേ!”
  rationale: ആവർത്തനം ദാവീദിന്റെ തീവ്രദുഃഖം പ്രകടമാക്കുന്നതിനാൽ മിനുക്കിക്കുറയ്ക്കാതെ മുഴുവനായി നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തനവും വിലാപത്തിന്റെ തീവ്രതയും സംരക്ഷിച്ചു; ‘വലിയ ശബ്ദത്തോടെ’ എന്ന യാന്ത്രിക രൂപത്തിനു പകരം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഉറക്കെ’ ഉപയോഗിച്ചു.
