  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. യോവാബിന്റെ കടുത്ത ശാസനാഭാവവും സ്നേഹം–വെറുപ്പ് എന്ന സമാന്തര വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു; പ്രതിവാസ്തവ ആരോപണം വ്യവസ്ഥാരൂപത്തിൽ സ്വാഭാവികമാക്കി.
