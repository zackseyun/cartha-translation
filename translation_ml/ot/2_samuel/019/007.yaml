source:
  edition: WLC
  text: לְ/אַֽהֲבָה֙ אֶת שֹׂ֣נְאֶ֔י/ךָ וְ/לִ/שְׂנֹ֖א אֶת אֹהֲבֶ֑י/ךָ כִּ֣י הִגַּ֣דְתָּ הַ/יּ֗וֹם כִּ֣י אֵ֤ין לְ/ךָ֙ שָׂרִ֣ים וַ/עֲבָדִ֔ים כִּ֣י יָדַ֣עְתִּי הַ/יּ֗וֹם כִּ֠י לא אַבְשָׁל֥וֹם חַי֙ וְ/כֻלָּ֤/נוּ הַ/יּוֹם֙ מֵתִ֔ים כִּי אָ֖ז יָשָׁ֥ר בְּ/עֵינֶֽי/ךָ־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/007.yaml
  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: ml
  text: നിന്നെ വെറുക്കുന്നവരെ നീ സ്നേഹിക്കുകയും നിന്നെ സ്നേഹിക്കുന്നവരെ വെറുക്കുകയും ചെയ്യുന്നു. സേനാനായകരും സേവകരും നിനക്കു യാതൊരു പ്രാധാന്യവുമില്ലെന്ന് നീ ഇന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു[a]. കാരണം, അബ്ശാലോം ജീവനോടിരിക്കുകയും ഞങ്ങളെല്ലാവരും ഇന്ന് മരിച്ചിരിക്കുകയും ചെയ്തിരുന്നെങ്കിൽ[b], അതു നിന്റെ ദൃഷ്ടിയിൽ ശരിയായിരിക്കുമായിരുന്നു എന്ന് ഇന്ന് എനിക്കു വ്യക്തമായിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിനക്കു സേനാനായകരും സേവകരും ഇല്ലെന്ന് നീ ഇന്ന് പ്രഖ്യാപിച്ചിരിക്കുന്നു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം, നിന്റെ വിലയിരുത്തലിൽ അവർക്ക് യാതൊരു പ്രാധാന്യവുമില്ല എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അബ്ശാലോം മാത്രം ജീവനോടിരിക്കുകയും ഞങ്ങളെല്ലാവരും ഇന്ന് മരിച്ചിരിക്കുകയും ചെയ്തിരുന്നെങ്കിൽ.” യോവാബിന്റെ വാക്കുകൾ ദാവീദ് അക്ഷരാർഥത്തിൽ പറഞ്ഞതിന്റെ റിപ്പോർട്ടല്ല, മറിച്ച് മൂർച്ചയുള്ള ഒരു പ്രതിവാസ്തവ ആരോപണമാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְאַהֲבָה אֶת שֹׂנְאֶיךָ
  choice: നിന്നെ വെറുക്കുന്നവരെ സ്നേഹിക്കുകയും
  rationale: ക്രിയാവിശേഷണസ്വഭാവമുള്ള അനന്തരൂപവും substantival participle-ഉം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; ‘ശത്രുക്കൾ’ എന്ന വ്യാഖ്യാനത്തേക്കാൾ മൂലപദത്തിന്റെ ക്രിയാത്മക വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: וְלִשְׂנֹא אֶת אֹהֲבֶיךָ
  choice: നിന്നെ സ്നേഹിക്കുന്നവരെ വെറുക്കുകയും
  rationale: ആദ്യ ഘടകത്തോടുള്ള സമാന്തരതയും സ്നേഹം–വെറുപ്പ് എന്ന മൂലഭാഷയിലെ ശക്തമായ വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: הִגַּדְתָּ הַיּוֹם
  choice: നീ ഇന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു
  rationale: ദാവീദ് വാക്കാൽ പറഞ്ഞുവെന്നതിലുപരി അവന്റെ പെരുമാറ്റം കാര്യം വെളിപ്പെടുത്തിയെന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: שָׂרִים וַעֲבָדִים
  choice: സേനാനായകരും ദാസന്മാരും
  rationale: യുദ്ധസന്ദർഭത്തിൽ שָׂרִים എന്നത് സൈനിക നേതാക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സേനാനായകർ’; עֲבָדִים രാജസേവനത്തിലുള്ളവരെ വ്യാപകമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ദാസന്മാർ’.
- source_word: אֵין לְךָ שָׂרִים וַעֲבָדִים
  choice: സേനാനായകരും ദാസന്മാരും നിനക്ക് ഒന്നുമല്ലെന്ന്
  rationale: അവർ നിലവിലില്ല എന്ന അക്ഷരാർഥമല്ല, ദാവീദിന്റെ വിലയിരുത്തലിൽ അവർക്ക് യാതൊരു പ്രാധാന്യവുമില്ലെന്ന ശാസനാത്മക പ്രയോഗാർഥമാണ് സ്വാഭാവികമായി നൽകുന്നത്.
- source_word: יָדַעְתִּי הַיּוֹם
  choice: എനിക്ക് ഇന്ന് മനസ്സിലായി
  rationale: ഇന്നത്തെ സംഭവങ്ങളിൽനിന്ന് യോവാബ് എത്തിയ നിഗമനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ഞാൻ അറിയുന്നു’ എന്നതിനെക്കാൾ സന്ദർഭത്തിലെ ബോധ്യപ്പെടൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא אַבְשָׁלוֹם חַי וְכֻלָּנוּ הַיּוֹם מֵתִים
  choice: അബ്ശാലോം ജീവനോടിരിക്കുകയും ഞങ്ങളെല്ലാവരും ഇന്ന് മരിച്ചിരിക്കുകയും ചെയ്തിരുന്നെങ്കിൽ
  rationale: മൂലവാക്യത്തിലെ മൂർച്ചയുള്ള പ്രതിവാസ്തവ ആരോപണം മലയാളത്തിലെ വ്യവസ്ഥാരൂപത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: יָשָׁר בְּעֵינֶיךָ
  choice: അതു നിന്റെ ദൃഷ്ടിയിൽ ശരിയായിരിക്കുമായിരുന്നു
  rationale: ‘കണ്ണുകളിൽ നേരായത്/ശരിയായത്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ നൈതിക നിറവും പ്രതിവാസ്തവ ഭാവവും നിലനിർത്തുന്നു.
