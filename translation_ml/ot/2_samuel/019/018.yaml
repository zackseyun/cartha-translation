translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ശൗൽഗൃഹം’ എന്ന സംക്ഷിപ്ത പ്രയോഗം ഗൃഹം, കുടുംബം, രാജവംശം എന്നീ ഭാവങ്ങൾ നിലനിർത്തുന്നു. തുടക്കത്തിലെ ബന്ധകത്തിന്റെ കഥാസന്ദർഭബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിലൂടെ അവതരിപ്പിച്ചു.
