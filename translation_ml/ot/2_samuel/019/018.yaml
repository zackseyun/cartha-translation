  yaml_path: translation/ot/2_samuel/019/018.yaml
  text: and a thousand men from Benjamin with him[a], and Ziba, the servant of Saul’s house, with his fifteen sons and his twenty servants; they crossed the Jordan before the king.
translation:
  language: ml
  text: ബെന്യാമീൻ ഗോത്രത്തിൽനിന്നുള്ള ആയിരം പുരുഷന്മാരും അവനോടുകൂടെ ഉണ്ടായിരുന്നു. ശൗലിന്റെ ഭവനത്തിലെ ദാസനായ സീബയും അവന്റെ പതിനഞ്ച് പുത്രന്മാരും ഇരുപത് ദാസന്മാരും അവനോടുകൂടെ ഉണ്ടായിരുന്നു. അവർ രാജാവിന്റെ മുമ്പിൽ[a] യോർദാൻ കടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “രാജാവിനു മുന്നേ.” എബ്രായപ്രയോഗത്തിന് രാജാവിന്റെ സന്നിധിയിൽ എന്നും അദ്ദേഹത്തിനു മുമ്പായി എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אִישׁ
  choice: ആയിരം പുരുഷന്മാർ
  rationale: സംഖ്യയോടുകൂടിയ אִישׁ ഇവിടെ പ്രായപൂർത്തിയായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന സാധാരണ പ്രയോഗമാണ്; ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: מִבִּנְיָמִן
  choice: ബെന്യാമീനിൽനിന്നുള്ള
  rationale: ഗോത്രബന്ധമോ ഉത്ഭവമോ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘ബെന്യാമീൻഗോത്രത്തിൽനിന്നുള്ള’ എന്ന് അധികമായി വിശദീകരിക്കുന്നില്ല.
- source_word: צִיבָא
  choice: സീബ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: נַעַר בֵּית שָׁאוּל
  choice: ശൗൽഗൃഹത്തിലെ ദാസൻ
  rationale: נַעַר എന്നതിന് യുവാവ്, പരിചാരകൻ, ദാസൻ എന്നീ അർഥങ്ങൾ വരാം; സീബയുടെ ഈ സന്ദർഭത്തിലെ ഗൃഹസേവനപങ്കിന് ‘ദാസൻ’ യോജിക്കുന്നു. ‘ശൗൽഗൃഹം’ കുടുംബ-രാജവംശീയ ഭാവം നിലനിർത്തുന്നു.
- source_word: וַחֲמֵשֶׁת עָשָׂר בָּנָיו
  choice: അവന്റെ പതിനഞ്ച് പുത്രന്മാർ
  rationale: സീബയോടൊപ്പമുള്ള സംഘത്തിലെ അംഗങ്ങളെന്ന ബന്ധം വാക്യഘടനയിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְעֶשְׂרִים עֲבָדָיו
  choice: ഇരുപത് ദാസന്മാർ
  rationale: עֶבֶד ദാസനെയോ അടിമയെയോ സൂചിപ്പിക്കാം; ഇവിടെ സീബയുടെ ഗൃഹപരിചാരകരുടെ പട്ടികയായതിനാൽ ‘ദാസന്മാർ’ സന്ദർഭോചിതവും നിലയെ അനാവശ്യമായി നിർണയിക്കാത്തതുമാണ്.
- source_word: וְצָלְחוּ
  choice: അവർ ... കടന്നു
  rationale: യോർദാനോടൊപ്പം ഉപയോഗിക്കുമ്പോൾ ക്രിയയുടെ സന്ദർഭാർഥം നദി കടക്കുക എന്നതാണ്.
- source_word: הַיַּרְדֵּן
  choice: യോർദാൻ
  rationale: പ്രസിദ്ധമായ നദിനാമമായതിനാൽ ‘നദി’ എന്ന് ചേർക്കാതെ തന്നെ സൂചന വ്യക്തമാണ്.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ മുമ്പിലൂടെ
  rationale: לִפְנֵי എന്നത് രാജാവിന്റെ സന്നിധിയിലോ അദ്ദേഹത്തിനു മുന്നിലായോ എന്ന ഇരുവിധ സ്ഥലബന്ധവും അനുവദിക്കുന്നു; മുഖ്യപാഠം അതിനെ ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
