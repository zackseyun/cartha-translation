  text: כִּ/מְעַ֞ט יַעֲבֹ֧ר עַבְדְּ/ךָ֛ אֶת הַ/יַּרְדֵּ֖ן אֶת הַ/מֶּ֑לֶךְ וְ/לָ֨/מָּה֙ יִגְמְלֵ֣/נִי הַ/מֶּ֔לֶךְ הַ/גְּמוּלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/037.yaml
  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
translation:
  language: ml
  text: കാരണം, അങ്ങയുടെ ദാസനായ ഞാൻ രാജാവിനോടൊപ്പം യോർദ്ദാൻ കടക്കാൻ അൽപ്പം ദൂരം മാത്രമേ പോകുകയുള്ളൂ. ഈ പ്രതിഫലം നൽകി രാജാവ് എനിക്ക് പ്രതിഫലം നൽകേണ്ടത് എന്തിന്?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജാവ് എനിക്ക് ഈ പ്രതിഫലംകൊണ്ട് പ്രതിഫലം നൽകേണ്ടത് എന്തിന്?” ഹീബ്രുവിൽ ഒരേ പദമൂലത്തിൽനിന്നുള്ള ക്രിയയും നാമവും ഉപയോഗിച്ചിരിക്കുന്നു; ഇത് പ്രതിഫലം നൽകുക എന്ന ആശയത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/מְעַט
  choice: അൽപ്പം ദൂരം മാത്രമേ
  rationale: כִּי സന്ദർഭത്തിൽ ബർസില്ലായിയുടെ നിരസനത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്നു; מְעַט യാത്രയുടെ പരിമിത ദൂരത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി കാരണം മുൻവാക്യത്തിന്റെ പ്രസംഗസന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ ‘അൽപ്പം ദൂരം മാത്രമേ’ എന്നു നൽകി.
- source_word: יַעֲבֹר
  choice: കടന്ന് ... വരുകയുള്ളൂ
  rationale: ഇവിടത്തെ അപൂർണ്ണക്രിയ ഉദ്ദേശിക്കപ്പെടുന്ന പരിമിതമായ അനുഗമനത്തെ സൂചിപ്പിക്കുന്നു; ‘വരുകയുള്ളൂ’ വിനയപൂർവമായ സാദ്ധ്യതാഭാവവും യാത്രാസന്ദർഭവും നൽകുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ ഞാൻ
  rationale: രാജാവിനോടുള്ള വിനയപൂർവമായ സ്വയംപരാമർശമാണിത്; അടിമത്തത്തിന്റെ നിയമപരമായ അർഥമല്ല ഇവിടെ മുൻനിൽക്കുന്നത്.
- source_word: אֶת הַיַּרְדֵּן
  choice: യോർദ്ദാൻ കടന്ന്
  rationale: עבר എന്ന ക്രിയയോടൊപ്പം നദി മുറിച്ചുകടക്കുന്നതാണ് അർഥം; മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: אֶת הַמֶּלֶךְ
  choice: രാജാവിനോടൊപ്പം
  rationale: ഇവിടെ אֶת കർമചിഹ്നമല്ല, ‘കൂടെ’ എന്ന അനുഗമനാർഥമുള്ള പൂർവപ്രത്യയമാണ്.
- source_word: וְלָמָּה
  choice: എന്തിന്?
  rationale: രാജാവിന്റെ പ്രതിഫലം വിനയത്തോടെ നിരസിക്കുന്ന വാചാടോപചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: יִגְמְלֵנִי ... הַגְּמוּלָה הַזֹּאת
  choice: ഈ പ്രതിഫലം നൽകി ... എനിക്ക് പ്രത്യുപകാരം ചെയ്യേണ്ടത്
  rationale: גמל എന്ന ഒരേ മൂലത്തിൽനിന്നുള്ള ക്രിയയും നാമവും ഹീബ്രുവിൽ ആവർത്തിച്ച് പ്രത്യുപകാരത്തിന്റെ ആശയം ഊന്നുന്നു. മലയാളത്തിൽ ‘പ്രതിഫലം’–‘പ്രത്യുപകാരം’ എന്ന ബന്ധിത പദങ്ങൾ ഉപയോഗിച്ച് അർഥവും ഊന്നലും സ്വാഭാവികമായി സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ രാജസദസ്സ്-സംഭാഷണ ശൈലി. ‘അങ്ങയുടെ’ എന്നത് വിനയപൂർവമായ അഭിസംബോധനയും ‘ദാസനായ ഞാൻ’ പരമ്പരാഗത രാജസഭാ സ്വയംപരാമർശവും വ്യക്തമാക്കുന്നു.
