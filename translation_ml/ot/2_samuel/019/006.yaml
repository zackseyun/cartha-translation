source:
  edition: WLC
  text: וַ/יָּבֹ֥א יוֹאָ֛ב אֶל הַ/מֶּ֖לֶךְ הַ/בָּ֑יִת וַ/יֹּאמֶר֩ הֹבַ֨שְׁתָּ הַ/יּ֜וֹם אֶת פְּנֵ֣י כָל עֲבָדֶ֗י/ךָ הַֽ/מְמַלְּטִ֤ים אֶֽת נַפְשְׁ/ךָ֙ הַ/יּ֔וֹם וְ/אֵ֨ת נֶ֤פֶשׁ בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ וְ/נֶ֣פֶשׁ נָשֶׁ֔י/ךָ וְ/נֶ֖פֶשׁ פִּלַגְשֶֽׁי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
translation:
  language: ml
  text: 'അപ്പോൾ യോവാബ് വീട്ടിനുള്ളിൽ[a] രാജാവിന്റെ അടുക്കൽ ചെന്നു പറഞ്ഞു: “അങ്ങയുടെ ജീവനും[c] അങ്ങയുടെ പുത്രന്മാരുടെയും പുത്രിമാരുടെയും ജീവനും അങ്ങയുടെ ഭാര്യമാരുടെയും വെപ്പാട്ടികളുടെയും ജീവനും ഇന്ന് രക്ഷിച്ച അങ്ങയുടെ സകല ദാസന്മാരെയും അങ്ങ് ഇന്ന് അപമാനിച്ചിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വീട്” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന പദം ഇവിടെ രാജകീയ വസതിയെയോ കൊട്ടാരത്തെയോ സൂചിപ്പിച്ചിരിക്കാം.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അങ്ങയുടെ സകല ദാസന്മാരുടെയും മുഖങ്ങൾ ലജ്ജിപ്പിച്ചിരിക്കുന്നു.” പരസ്യമായി അപമാനിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെയും തുടർന്ന് കുടുംബാംഗങ്ങളെക്കുറിച്ചും ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം നെഫെഷ് ആണ്; ഈ സന്ദർഭത്തിൽ അതിന്റെ അർഥം “ആത്മാവ്” എന്നതല്ല, ശാരീരിക “ജീവൻ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּיִת
  choice: വീട്ടിനുള്ളിൽ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘വീട്’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് രാജകീയ വസതിയെയോ കൊട്ടാരത്തെയോ സൂചിപ്പിക്കാം, എന്നാൽ മുഖ്യപാഠത്തിൽ അതിനെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: הֹבַשְׁתָּ אֶת־פְּנֵי
  choice: അപമാനിച്ചിരിക്കുന്നു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘ലജ്ജിപ്പിക്കുക/അപമാനിക്കുക’ എന്ന കാരകാർഥവും പരസ്യമായ മാനഹാനിയുടെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘മുഖങ്ങൾ’ എന്ന മൂർത്തമായ എബ്രായ പ്രയോഗം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ സകല ദാസന്മാർ
  rationale: രാജാവിനോടുള്ള സേവക-വിധേയ ബന്ധം നിലനിർത്തുന്നു; ‘സൈനികർ’ അല്ലെങ്കിൽ ‘ഉദ്യോഗസ്ഥർ’ എന്നു ചുരുക്കി നിർവചിക്കുന്നില്ല.
- source_word: הַמְמַלְּטִים
  choice: രക്ഷിച്ച
  rationale: അപകടത്തിൽനിന്നും മരണത്തിൽനിന്നും വിടുവിച്ചതിനെ സൂചിപ്പിക്കുന്ന പങ്കാളിവിശേഷണത്തിന്റെ സന്ദർഭാർഥം ലളിതമായി നൽകുന്നു.
- source_word: נֶפֶשׁ
  choice: ജീവൻ
  rationale: ഇവിടെ പദം അമൂർത്തമായ ‘ആത്മാവ്’ എന്നതല്ല, മരണത്തിൽനിന്നു സംരക്ഷിക്കപ്പെട്ട ശാരീരികജീവനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: פִּלַגְשֶׁיךָ
  choice: അങ്ങയുടെ വെപ്പാട്ടികൾ
  rationale: അംഗീകൃതമായിരുന്നെങ്കിലും ഭാര്യമാരെക്കാൾ താഴ്ന്ന സാമൂഹികപദവിയുള്ള ബന്ധത്തിലെ സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന ചരിത്രപരമായ വിഭാഗം ധാർമ്മിക വിലയിരുത്തൽ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיָּבֹא ... וַיֹּאמֶר
  choice: അപ്പോൾ ... ചെന്നു പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ ക്രിയാശൃംഖലയുടെ തുടർച്ചയായ ആഖ്യാനഗതി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: കുടുംബ-സാമൂഹിക പദങ്ങൾ വിവർത്തനം ചെയ്യുമ്പോൾ ധാർമ്മിക വിലയിരുത്തൽ ചേർക്കാതിരിക്കുക
  choice: ഭാര്യമാരും വെപ്പാട്ടികളും
  alternative: ഭാര്യമാരും രണ്ടാംനില ഭാര്യമാരും
  rationale: എബ്രായപാഠത്തിലെ വ്യത്യസ്ത സാമൂഹിക വിഭാഗങ്ങൾ അതേപടി നിലനിർത്തുന്നു; ‘രണ്ടാംനില ഭാര്യമാർ’ എന്നത് ബന്ധത്തിന്റെ സ്വഭാവം വിശദീകരിക്കുന്നുവെങ്കിലും മൂലപദത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാണ്.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: ഈ വാക്യത്തിൽ മരണഭീഷണിയിൽനിന്നുള്ള രക്ഷയാണ് വിഷയം; അതിനാൽ ‘ജീവൻ’ യോജിക്കുന്നു, ‘ആത്മാവ്’ എന്നത് അനാവശ്യമായ ദേഹാതീത അർഥം ഇറക്കുമതി ചെയ്യും.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യോവാബ് രാജാവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ബഹുമാനസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു; എങ്കിലും കുറ്റപ്പെടുത്തലിന്റെ മൂർച്ച വാക്യഘടനയിൽ നിലനിർത്തി. കുടുംബാംഗങ്ങളുടെ പട്ടികയിലെ ആവർത്തനം മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കുള്ളിൽ പരമാവധി സംരക്ഷിച്ചു.
