  terminology: «കടത്തുവള്ളം» is a suitable rendering of הָעֲבָרָה. «യോർദ്ദാൻ» and «ഗേരയുടെ മകനായ ശിമെയി» are appropriate. Footnote anchors are moved to the terms or phrase they actually explain.
