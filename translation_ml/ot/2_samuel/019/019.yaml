  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രു വാക്യക്രമം മലയാളവായനയ്ക്ക് അനുയോജ്യമായി വിഭജിച്ചു. ‘സാഷ്ടാംഗം’ അപേക്ഷാപൂർവമായ കീഴടങ്ങലിന്റെ ഭാവം വ്യക്തമാക്കുന്നു.
