source:
  edition: WLC
  text: וְ/עָבְרָ֣ה הָ/עֲבָרָ֗ה לַֽ/עֲבִיר֙ אֶת בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/לַ/עֲשׂ֥וֹת הַ/טּ֖וֹב ב/עינ/ו וְ/שִׁמְעִ֣י בֶן גֵּרָ֗א נָפַל֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ בְּ/עָבְר֖/וֹ בַּ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
translation:
  language: ml
  text: രാജാവിന്റെ കുടുംബത്തെയും പരിവാരത്തെയും[a] മറുകരയിലെത്തിക്കാനും രാജാവിന് ഇഷ്ടമുള്ളതു ചെയ്യാനും[b] കടത്തുവള്ളം[c] കടന്നുപോയി. രാജാവ് യോർദ്ദാൻ കടക്കുമ്പോൾ, ഗേരയുടെ മകനായ ശിമെയി രാജാവിന്റെ മുമ്പിൽ വീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിലെ ‘രാജാവിന്റെ ഭവനം’ എന്ന പ്രയോഗം രാജഭവനം എന്ന കെട്ടിടത്തെ അല്ല, രാജാവിന്റെ കുടുംബത്തെയും പരിവാരത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: 'എബ്രായയിൽ അക്ഷരാർഥം: ‘അവന്റെ കണ്ണുകളിൽ നന്മയായതു ചെയ്യാൻ’; അതായത് രാജാവിന് ഇഷ്ടമുള്ളതു ചെയ്യാൻ.'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘കടത്തുബോട്ട്’; എബ്രായപദം നദി കടക്കാനുള്ള വാഹനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲבָרָה
  choice: കടത്തുവള്ളം
  rationale: നദി കടക്കാനുള്ള വാഹനത്തെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്; യോർദ്ദാന്റെ പശ്ചാത്തലത്തിൽ ‘കടത്തുവള്ളം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְעָבְרָה
  choice: അക്കരേക്കു കടന്നു
  rationale: സ്ത്രീലിംഗ ഏകവചന കർത്താവായ കടത്തുവള്ളത്തോടു യോജിക്കുന്ന പൂർത്തിയായ പ്രവൃത്തിയെ ലളിതമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לַעֲבִיר אֶת־בֵּית הַמֶּלֶךְ
  choice: രാജകുടുംബത്തെ മറുകരയിലെത്തിക്കാനും
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരകാർഥം ‘മറുകരയിലെത്തിക്കുക’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; ഇവിടെ രാജാവിന്റെ ഭവനം എന്ന കെട്ടിടമല്ല, അദ്ദേഹത്തോടു ബന്ധപ്പെട്ട ആളുകളാണ് ഉദ്ദേശ്യം.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജകുടുംബം
  rationale: സന്ദർഭത്തിൽ രാജഭവനമല്ല, രാജാവിന്റെ കുടുംബവും കൂടെയുള്ളവരും ഉൾപ്പെടുന്ന കൂട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  choice: രാജാവിന് ഇഷ്ടമുള്ളതു ചെയ്യാനും
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ കണ്ണുകളിൽ നന്മയായതു ചെയ്യുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകുന്നു; സർവനാമത്തിന്റെ സൂചനയും വ്യക്തമാക്കുന്നു.
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ മുമ്പിൽ സാഷ്ടാംഗം വീണു
  rationale: കേവലം വീഴ്ചയല്ല, കീഴടങ്ങലും അപേക്ഷയും പ്രകടിപ്പിക്കുന്ന ശരീരഭാവമാണെന്നത് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  choice: രാജാവ് യോർദ്ദാൻ കടക്കുമ്പോൾ
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം ഏറ്റവും സ്വാഭാവികമായി രാജാവിനെ സൂചിപ്പിക്കുന്നു; കാലബന്ധം ‘കടക്കുമ്പോൾ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
