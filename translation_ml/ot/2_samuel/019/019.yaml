  source_fidelity: The core sense is retained, but «രാജകുടുംബം» in current Malayalam normally denotes only the royal family and can exclude the wider royal household/retinue denoted by בֵּית הַמֶּלֶךְ. «സാഷ്ടാംഗം വീണു» over-specifies the posture; נָפַל לִפְנֵי may indicate falling down in submission without requiring full prostration.
