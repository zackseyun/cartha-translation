source:
  edition: WLC
  text: וְ/לַֽ/עֲמָשָׂא֙ תֹּֽמְר֔וּ הֲ/ל֛וֹא עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם לֹ֠א שַׂר צָבָ֞א תִּהְיֶ֧ה לְ/פָנַ֛/י כָּל הַ/יָּמִ֖ים תַּ֥חַת יוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/014.yaml
  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
translation:
  language: ml
  text: 'അമാസയോടു പറയുക: “നീ എന്റെ അസ്ഥിയും മാംസവും അല്ലയോ? യോവാബിനു പകരം നീ എന്റെ മുമ്പാകെ എല്ലാകാലവും[a] സൈന്യാധിപനായിരിക്കാതിരുന്നാൽ ദൈവം എന്നോട് ഇങ്ങനെയും ഇതിലധികവും ചെയ്യട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “എല്ലാ ദിവസങ്ങളും”; ഇവിടെ തുടർച്ചയായ പദവിക്കാലത്തെയോ സേവനത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַעֲמָשָׂא תֹּמְרוּ
  choice: അമാസയോടു പറയുക
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള നിർദേശത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הֲלוֹא
  choice: അല്ലയോ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന ആലങ്കാരിക ചോദ്യരൂപം അതേപടി നിലനിർത്തുന്നു.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: എന്റെ അസ്ഥിയും മാംസവും
  rationale: ബന്ധുത്വം സൂചിപ്പിക്കുന്ന സജീവമായ എബ്രായ പ്രയോഗം ‘ബന്ധു’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അക്ഷരസമീപമായി സംരക്ഷിക്കുന്നു.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: ദൈവം എന്നോട് ഇങ്ങനെയും ഇതിലധികവും ചെയ്യട്ടെ
  rationale: വ്യക്തമാക്കാത്ത ശിക്ഷയെ സ്വമേധയാ വിശദീകരിക്കാതെ ശപഥസൂത്രത്തിന്റെ ഗൗരവവും തുറന്ന സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: אִם לֹא
  choice: ആയിരിക്കാതിരുന്നാൽ
  rationale: ശപഥത്തിന്റെ നിബന്ധനാരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു; ‘തീർച്ചയായും’ എന്നു മാറ്റി എബ്രായ ഘടന പരത്തുന്നില്ല.
- source_word: שַׂר צָבָא
  choice: സൈന്യാധിപൻ
  rationale: മുഖ്യ സൈനികാധികാരിയെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും മാന്യവുമായ സാധാരണ മലയാളപദം.
- source_word: תִּהְיֶה לְפָנַי
  choice: നീ എന്റെ മുമ്പാകെ ... ആയിരിക്കുക
  rationale: രാജാവിന്റെ സന്നിധിയിലും അധികാരത്തിൻ കീഴിലും സേവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ‘എന്റെ മുമ്പാകെ’ എന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: כָּל הַיָּמִים
  choice: എല്ലാകാലവും
  rationale: അക്ഷരാർഥമായ ‘എല്ലാ ദിവസങ്ങളും’ എന്നതിന്റെ ഈ നിയമനസന്ദർഭത്തിലെ തുടർച്ചയായ സേവനകാലം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: תַּחַת יוֹאָב
  choice: യോവാബിനു പകരം
  rationale: കീഴിലുള്ള സ്ഥാനം അല്ല, യോവാബിനെ മാറ്റി ആ സ്ഥാനത്ത് നിയമിക്കുന്നതാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശപഥസൂത്രത്തിലെ אֱלֹהִים എന്ന പദത്തിന്റെ വചനം
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും ഇവിടെ ഇസ്രായേലിന്റെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ ശപഥപ്രയോഗമാണിത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ബന്ധുത്വപ്രയോഗവും ശപഥത്തിന്റെ ഉദ്ദേശപൂർവമായ അവ്യക്തതയും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘എല്ലാകാലവും’ എന്ന പ്രയോഗത്തിനു ശേഷം വാക്യാവസാനത്ത് ചേർത്തിരിക്കുന്നു.
