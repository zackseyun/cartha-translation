id: LEV.12.7
reference: Leviticus 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרִיב֞/וֹ לִ/פְנֵ֤י יְהוָה֙ וְ/כִפֶּ֣ר עָלֶ֔י/הָ וְ/טָהֲרָ֖ה מִ/מְּקֹ֣ר דָּמֶ֑י/הָ זֹ֤את תּוֹרַת֙ הַ/יֹּלֶ֔דֶת לַ/זָּכָ֖ר א֥וֹ לַ/נְּקֵבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: ml
  text: അവൻ അത് യഹ്‌വേയുടെ സന്നിധിയിൽ അർപ്പിക്കണം; അവൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം; അങ്ങനെ അവൾ തന്റെ രക്തത്തിന്റെ ഉറവിൽനിന്ന് ശുദ്ധയാകും.[a] ആൺകുഞ്ഞിനെയോ പെൺകുഞ്ഞിനെയോ പ്രസവിക്കുന്ന സ്ത്രീയെക്കുറിച്ചുള്ള നിയമം ഇതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “തന്റെ രക്തത്തിന്റെ ഉറവിൽനിന്ന്.” “തന്റെ രക്തസ്രാവത്തിൽനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: അവൻ അത് ... അർപ്പിച്ച്
  rationale: ഹിഫീൽ രൂപവും ഏകവചന പുല്ലിംഗ കർമപ്രത്യയവും മുൻവാക്യത്തിലെ യാഗവസ്തുവിനെ പുരോഹിതൻ യഹ്‌വേയുടെ സന്നിധിയിൽ അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അർപ്പിക്കുക’ സ്വാഭാവികവും ആരാധനാക്രമസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: ആരാധനാക്രമത്തിൽ ‘യഹ്‌വേയുടെ മുമ്പിൽ/സാന്നിധ്യത്തിൽ’ എന്നർഥമുള്ള പ്രയോഗം. ദൈവനാമം യഹ്‌വേ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: അവൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ כפר-ന് ‘പ്രായശ്ചിത്തം ചെയ്യുക’ എന്നത് സുലഭവും സിദ്ധാന്തപരമായ ഒരു പ്രത്യേക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാത്തതുമായ തുല്യപദമാണ്.
- source_word: וְטָהֲרָה
  choice: അപ്പോൾ അവൾ ... ശുദ്ധയാകും
  rationale: വാവ്-ക്രമത്തിലുള്ള ഖാൽ സമ്പൂർണ്ണക്രിയ പുരോഹിതന്റെ നടപടിയുടെ ഫലമായി സ്ത്രീ ആചാരപരമായി ശുദ്ധയാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രു രൂപം സജീവമാണ്; അതിനാൽ നിർബന്ധമായും കർമണി അർഥം നൽകാതെ ഫലം സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: തന്റെ രക്തസ്രാവത്തിന്റെ ഉറവിൽനിന്ന്
  rationale: מָקוֹר എന്നതിന്റെ ‘ഉറവ്/സ്രോതസ്സ്’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും പ്രസവാനന്തര രക്തസ്രാവസന്ദർഭം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: זֹאת תּוֹרַת
  choice: '... നിയമം ഇതാണ്'
  rationale: ലേവ്യപുസ്തകത്തിലെ ഈ സൂത്രവാക്യത്തിൽ תּוֹרָה നിർദേശിക്കപ്പെട്ട ആചാരനിയമത്തെ സൂചിപ്പിക്കുന്നു; ‘നിയമം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: הַיֹּלֶדֶת
  choice: പ്രസവിക്കുന്ന സ്ത്രീ
  rationale: പങ്കാളികാരൂപം പ്രസവവുമായി ബന്ധപ്പെട്ട സ്ത്രീയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘അമ്മ’ എന്നതിനെക്കാൾ മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: ആൺകുഞ്ഞിനെയോ പെൺകുഞ്ഞിനെയോ
  rationale: മൂലത്തിലെ ‘ആൺ/പെൺ’ വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട്, പ്രസവത്തെക്കുറിച്ചുള്ള മലയാളവാക്യത്തിൽ സ്വാഭാവികമാകാൻ ‘കുഞ്ഞ്’ ചേർത്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: כפר എന്ന ക്രിയയുടെ അർഥം
  choice: പ്രായശ്ചിത്തം ചെയ്യുക
  alternative: പരിഹാരം വരുത്തുക; ശുദ്ധീകരണകർമം നടത്തുക
  rationale: യാഗപരമായ അർഥവ്യാപ്തി നിലനിർത്തുകയും പ്രായശ്ചിത്തത്തിന്റെ പ്രവർത്തനരീതിയെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തം വാക്യത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: സ്ത്രീയുടെ ശുദ്ധീകരണത്തിന്റെ സ്വഭാവം
  choice: ശുദ്ധയാകും
  alternative: ശുദ്ധീകരിക്കപ്പെടും
  rationale: ലേവ്യപുസ്തകത്തിന്റെ സന്ദർഭം ആചാരപരമായ ശുദ്ധിയെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ഖാൽ രൂപത്തെ മാനിച്ച് അവസ്ഥാമാറ്റം പ്രസ്താവിച്ചു; നൈതിക കുറ്റബോധം എന്ന് വ്യാഖ്യാനിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാക്രമ ഭാഷ. ‘അർപ്പിക്കുക’, ‘പ്രായശ്ചിത്തം’, ‘ശുദ്ധയാകുക’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന ലളിതമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ദുഷ്കരപ്രയോഗത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
