  naturalness: പരിഷ്കരിച്ച വാക്യഘടന ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഔപചാരികമായ ആചാരനിയമ-രജിസ്റ്ററിന് യോജിച്ചതുമാണ്. ‘രക്തത്തിന്റെ ഉറവ്’ അല്പം അക്ഷരാനുസൃതമായതിനാൽ വായനാസഹായമായി അടിക്കുറിപ്പിൽ ‘രക്തസ്രാവം’ എന്ന വ്യാഖ്യാനപരമായ ബദൽ നൽകിയിരിക്കുന്നു.
