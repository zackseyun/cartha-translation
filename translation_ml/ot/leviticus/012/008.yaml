id: LEV.12.8
reference: Leviticus 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: ml
  text: എന്നാൽ ഒരു കുഞ്ഞാടിനെ വാങ്ങാൻ അവൾക്ക് കഴിവില്ലെങ്കിൽ, അവൾ രണ്ടു ചെങ്ങാലിപ്പ്രാവുകളെയോ രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങളെയോ കൊണ്ടുവരണം—ഒന്ന് ഹോമയാഗമായും മറ്റൊന്ന് പാപയാഗമായും[a]. പുരോഹിതൻ അവൾക്കുവേണ്ടി പ്രായശ്ചിത്തം നടത്തും; അപ്പോൾ അവൾ ശുദ്ധയാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാപയാഗം’ എന്നതിന് ‘ശുദ്ധീകരണയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ സന്ദർഭത്തിൽ പ്രസവാനന്തര ആചാരപരമായ അശുദ്ധിയെയാണ് യാഗം അഭിസംബോധന ചെയ്യുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: ഒരു കുഞ്ഞാടിനെ വാങ്ങാൻ അവൾക്കു കഴിവില്ലെങ്കിൽ
  rationale: ‘അവളുടെ കൈ ഒരു കുഞ്ഞാടിനാവശ്യമായതു കണ്ടെത്തുന്നില്ല’ എന്ന എബ്രായ പ്രയോഗം സാമ്പത്തികശേഷിയില്ലായ്മയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം വ്യക്തമാക്കുന്നു.
- source_word: שֶׂה
  choice: കുഞ്ഞാട്
  rationale: മുൻവാക്യത്തിലെ യാഗമൃഗത്തെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും നിർദിഷ്ടവുമായ പദം.
- source_word: שְׁתֵּי תֹרִים
  choice: രണ്ടു ചെങ്ങാലിപ്പ്രാവുകൾ
  rationale: תֹרִים പൊതുവായ പ്രാവുകളെയല്ല, പ്രത്യേകമായി turtledoves-നെ സൂചിപ്പിക്കുന്നു; അതിന്റെ നിർദിഷ്ടത നിലനിർത്തുന്നു.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങൾ
  rationale: ‘പ്രാവിന്റെ കുഞ്ഞുങ്ങൾ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ സാങ്കേതികപദം.
- source_word: חַטָּאת
  choice: പാപയാഗം
  rationale: എബ്രായ യാഗപദത്തിന്റെ സ്ഥിരതയുള്ള പരമ്പരാഗത പരിഭാഷ; പ്രസവാനന്തര ആചാരശുദ്ധീകരണസന്ദർഭത്തിലെ ‘ശുദ്ധീകരണയാഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: പുരോഹിതൻ അവൾക്കുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ ആരാധനാപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം അനാവശ്യമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְטָהֵרָה
  choice: അവൾ ശുദ്ധയാകും
  rationale: ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള പുനഃസ്ഥാപനം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പ്രസവാനന്തര ശുദ്ധീകരണസന്ദർഭത്തിൽ חַטָּאת എന്നതിന്റെ പരിഭാഷ
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: മുഖ്യപാഠത്തിൽ പ്രധാന യാഗപദത്തിന്റെ സ്ഥിരത നിലനിർത്തുന്നു; എന്നാൽ ഇവിടെ വിഷയം വ്യക്തിപരമായ ധാർമിക കുറ്റത്തേക്കാൾ ആചാരപരമായ അശുദ്ധിയാണെന്നതിനാൽ സന്ദർഭോചിതമായ മറ്റൊരു പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യാഗസംബന്ധിയായ സ്ഥിരപദങ്ങളായ ‘ഹോമയാഗം’, ‘പാപയാഗം’, ‘പ്രായശ്ചിത്തം’ എന്നിവ നിലനിർത്തി; സാമ്പത്തികശേഷിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അവതരിപ്പിച്ചു.
