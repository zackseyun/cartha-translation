  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വേ[a] മോശെയോടു അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: “YHWH”; “യഹോവ” എന്നും ലിപ്യന്തരണം ചെയ്യാറുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഈ പതിവു സൂത്രവാക്യത്തിൽ דִּבֵּר എന്നതിന്റെ ഔപചാരിക ഭാവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായത്തിലെ ദൈവനാമമായ ചതുരക്ഷരി YHWH ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന വിഭക്തിബന്ധം സ്വാഭാവിക മലയാളത്തിലെ ‘-യോടു’ രൂപത്തിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തു:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന לֵאמֹר മലയാളത്തിൽ വേറൊരു ‘പറഞ്ഞുകൊണ്ട്’ ചേർക്കാതെ കോളൻ മുഖേന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഇതിലൂടെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠം YHWH എന്ന വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരായി മാറ്റാതെ, സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് ചേർന്ന ‘യഹ്‌വേ’ എന്നു നൽകുന്നു; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി. എബ്രായ വാക്യഘടനയിലെ തുടർച്ചാബോധം പ്രസംഗസന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ ആദ്യത്തിൽ നിർബന്ധിതമായി ‘അപ്പോൾ/പിന്നെ’ ചേർത്തിട്ടില്ല. ‘അരുളിച്ചെയ്തു’ ദൈവിക വചനസൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു.
