  naturalness: ‘മുപ്പത്തിമൂന്നു ദിവസം ശുദ്ധീകരണരക്തത്തിൽ കഴിയണം’ എന്നത് നിയമശൈലിയിൽ സ്വാഭാവികമാണ്; അസാധാരണമായ ആചാരപ്രയോഗത്തിന്റെ അർഥസഹായം അടിക്കുറിപ്പ് നൽകുന്നു. ശേഷിക്കുന്ന നിരോധനവാക്യങ്ങൾ വ്യക്തവും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
