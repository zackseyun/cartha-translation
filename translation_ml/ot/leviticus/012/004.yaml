id: LEV.12.4
reference: Leviticus 12:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁלֹשִׁ֥ים יוֹם֙ וּ/שְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּ/דְמֵ֣י טָהֳרָ֑ה בְּ/כָל קֹ֣דֶשׁ לֹֽא תִגָּ֗ע וְ/אֶל הַ/מִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד מְלֹ֖את יְמֵ֥י טָהֳרָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: ml
  text: പിന്നെ അവൾ മുപ്പത്തിമൂന്നു ദിവസം ശുദ്ധീകരണരക്തത്തിൽ കഴിയണം.[a] അവൾ വിശുദ്ധമായ യാതൊന്നും തൊടരുത്; അവളുടെ ശുദ്ധീകരണദിവസങ്ങൾ പൂർത്തിയാകുന്നതുവരെ വിശുദ്ധമന്ദിരത്തിൽ പ്രവേശിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ശുദ്ധീകരണത്തിന്റെ രക്തത്തിൽ’ (എബ്രായത്തിൽ ‘രക്തങ്ങളിൽ’ എന്നും വായിക്കാം). പ്രസവശേഷമുള്ള രക്തസ്രാവത്തോടും ആചാരപരമായ ശുദ്ധീകരണത്തോടും ബന്ധപ്പെട്ട കാലത്തെയാണ് ഈ എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: ദുഷ്കരമായ എബ്രായപ്രയോഗത്തിന്റെ സാക്ഷാൽ രക്തഭാവവും അതിന്റെ സന്ദർഭാർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: മുപ്പത്തിമൂന്നു ദിവസം
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘മുപ്പതു ദിവസവും മൂന്നു ദിവസവും’ എന്നാണെങ്കിലും, മലയാളത്തിൽ സംഖ്യ സ്വാഭാവികമായി ‘മുപ്പത്തിമൂന്നു ദിവസം’ എന്ന് പറയുന്നു.
- source_word: תֵּשֵׁב
  choice: കഴിയണം
  rationale: ഇവിടെ യָשַׁב എന്നത് ഇരിക്കുക എന്ന ശാരീരിക പ്രവൃത്തിയല്ല, നിർദിഷ്ടമായ അവസ്ഥയിലും കാലയളവിലും തുടരുക എന്ന അർഥമാണ്.
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: തന്റെ ശുദ്ധീകരണരക്തത്തിന്റെ കാലയളവിൽ
  rationale: ‘ശുദ്ധീകരണത്തിന്റെ രക്തത്തിൽ/രക്തങ്ങളിൽ’ എന്ന ദുഷ്കരമായ എബ്രായ പ്രയോഗത്തിലെ രക്തത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുകയും, പ്രസവാനന്തര ആചാരപരമായ ശുദ്ധീകരണകാലത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നവിധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּ/כָל קֹדֶשׁ לֹא תִגָּע
  choice: വിശുദ്ധമായ യാതൊന്നും തൊടരുത്
  rationale: קֹדֶשׁ എന്നതിന്റെ വിശുദ്ധ/വിശുദ്ധവസ്തു എന്ന വിശാലത സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാള നിയമപ്രയോഗം.
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: വിശുദ്ധമന്ദിരത്തിൽ പ്രവേശിക്കരുത്
  rationale: מִקְדָּשׁ ആരാധനാസംബന്ധമായ വിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രവേശിക്കരുത്’ എന്നത് എബ്രായത്തിലെ സ്ഥലദിശാസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַד מְלֹאת יְמֵי טָהֳרָהּ
  choice: അവളുടെ ശുദ്ധീകരണദിവസങ്ങൾ പൂർത്തിയാകുന്നതുവരെ
  rationale: കാലപരിധിയും സ്ത്രീലിംഗ ഏകവചന ഉടമസ്ഥപ്രത്യയവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആചാരപരമായ ശുദ്ധിയുടെ പദാവലി ധാർമിക കുറ്റബോധമായി അവതരിപ്പിക്കാതിരിക്കുക
  choice: ശുദ്ധീകരണം
  alternative: ശുദ്ധിയാക്കൽ / ശുദ്ധീകരിച്ച നില
  rationale: പ്രസവാനന്തര ആചാരപരമായ നിലയാണ് വാക്യത്തിന്റെ വിഷയം; സ്ത്രീയുടെ ധാർമിക പാപം വാക്യം പ്രസ്താവിക്കുന്നില്ല.
- issue: ദുഷ്കരമായ ‘ശുദ്ധീകരണരക്തം’ എന്ന പ്രയോഗം
  choice: രക്തത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തി അതിനെ ഒരു കാലയളവായി വായിക്കുക
  alternative: ശുദ്ധീകരണരക്തത്തിൽ
  rationale: പ്രയോഗത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം പൂർണമായി നീക്കാതെ, ഈ സന്ദർഭത്തിൽ തുടരേണ്ട പ്രസവാനന്തര കാലമാണ് ഉദ്ദേശ്യമെന്നത് വായനാസൗകര്യത്തോടെ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘വിശുദ്ധമന്ദിരം’, ‘ശുദ്ധീകരണം’ എന്നീ പദങ്ങൾ ആചാരപരമായ പശ്ചാത്തലം കാത്തുസൂക്ഷിക്കുന്നു; ധാർമിക അശുദ്ധി അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
