id: LEV.12.5
reference: Leviticus 12:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם נְקֵבָ֣ה תֵלֵ֔ד וְ/טָמְאָ֥ה שְׁבֻעַ֖יִם כְּ/נִדָּתָ֑/הּ וְ/שִׁשִּׁ֥ים יוֹם֙ וְ/שֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל דְּמֵ֥י טָהֳרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: ml
  text: എന്നാൽ അവൾ ഒരു പെൺകുഞ്ഞിനെ പ്രസവിച്ചാൽ, അവളുടെ ആർത്തവ അശുദ്ധിക്കാലത്തെപ്പോലെ[a] അവൾ രണ്ടാഴ്ച അശുദ്ധയായിരിക്കും; ശുദ്ധീകരണരക്തസ്രാവത്തിന്റെ കാലത്ത് അവൾ അറുപത്താറു ദിവസം തുടരണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ഇവിടെ പ്രസവാനന്തര അശുദ്ധാവസ്ഥയെ ആർത്തവവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധാവസ്ഥയോടാണ് താരതമ്യം ചെയ്യുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “ശുദ്ധീകരണരക്തസ്രാവം” എന്നത് പ്രസവശേഷമുള്ള നിയമാനുസൃത ശുദ്ധീകരണകാലവുമായി ബന്ധപ്പെട്ട രക്തസ്രാവത്തെ സൂചിപ്പിക്കുന്നു; അത് ധാർമിക കുറ്റത്തെയോ പാപത്തെയോ സൂചിപ്പിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ ആൺകുഞ്ഞിന്റെ സാഹചര്യത്തോട് വ്യത്യസ്തമായ മറ്റൊരു സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ, ഹീബ്രു സംയോജകത്തിന്റെയും നിബന്ധനയുടെയും സന്ദർഭബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נְקֵבָה תֵלֵד
  choice: ഒരു പെൺകുഞ്ഞിനെ പ്രസവിച്ചാൽ
  rationale: נְקֵבָה എന്നത് ഇവിടെ ലിംഗസൂചനയായ ‘പെൺ’ എന്നും ילד പ്രസവസന്ദർഭത്തിൽ ‘പ്രസവിക്കുക’ എന്നും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְטָמְאָה
  choice: അവൾ അശുദ്ധയായിരിക്കും
  rationale: നിയമപരമായ പ്രസ്താവനയുടെ ഭാവം നിലനിർത്തുന്നു; ഇവിടെ ‘അശുദ്ധ’ എന്നത് ധാർമിക കുറ്റമല്ല, ആചാരപരമായ നിലയാണ്.
- source_word: שְׁבֻעַיִם
  choice: രണ്ടാഴ്ച
  rationale: ദ്വിവചനരൂപം ഈ സന്ദർഭത്തിൽ രണ്ടു ആഴ്ചകളെ സൂചിപ്പിക്കുന്നു.
- source_word: כְּנִדָּתָהּ
  choice: അവളുടെ ആർത്തവകാലത്തെപ്പോലെ
  rationale: നִדָּה ആർത്തവത്തോടു ബന്ധപ്പെട്ട കാലത്തെയും ആചാരപരമായ അശുദ്ധാവസ്ഥയെയും സൂചിപ്പിക്കാം; പ്രധാനപാഠത്തിൽ താരതമ്യം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: അറുപത്താറു ദിവസം
  rationale: ഹീബ്രുവിലെ ‘അറുപതു ദിവസവും ആറു ദിവസവും’ എന്ന സംഖ്യാവിന്യാസം അളവ് മാറ്റാതെ സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: תֵּשֵׁב
  choice: കഴിയണം
  rationale: പദശഃ ‘ഇരിക്കുക/വസിക്കുക’ എന്നാണെങ്കിലും ഇവിടെ ഒരു നിർദ്ദിഷ്ട അവസ്ഥയിലോ കാലയളവിലോ തുടരുക എന്ന നിയമസന്ദർഭത്തിലെ അർഥം നൽകുന്നു.
- source_word: עַל דְּמֵי טָהֳרָה
  choice: ശുദ്ധീകരണരക്തവുമായി ബന്ധപ്പെട്ട കാലയളവിൽ
  rationale: പദപ്രയോഗം പദശഃ ‘ശുദ്ധീകരണത്തിന്റെ രക്തങ്ങളിൽ’ എന്നതിനു സമീപമാണെങ്കിലും, ഹീബ്രുവിലെ ആശയപരമായ ബഹുവചനവും עַל എന്നതിന്റെ സന്ദർഭപ്രയോഗവും മലയാളത്തിൽ അർഥവത്താക്കാൻ പ്രസവാനന്തര ശുദ്ധീകരണകാലത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ പ്രസവാനന്തര അശുദ്ധി
  choice: ‘അശുദ്ധ’ എന്ന പദം നിലനിർത്തി അതിനെ ആചാരപരമായ നിലയായി മനസ്സിലാക്കുക
  alternative: ‘ആചാരപരമായി അശുദ്ധ’ എന്ന് പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുക
  rationale: טמא എന്ന മൂലപദം നിലനിർത്തുന്നത് ഉറവിടത്തോടുള്ള സുതാര്യത കാക്കുന്നു. എന്നാൽ ഈ വാക്യം ധാർമിക പാപമോ വ്യക്തിപരമായ കുറ്റമോ പ്രസ്താവിക്കുന്നില്ല; പ്രസവാനന്തര ആരാധനാ-ആചാരപരമായ നിലയെക്കുറിച്ചാണ്.
- issue: דְּמֵי טָהֳרָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രസവാനന്തര ശുദ്ധീകരണവുമായി ബന്ധപ്പെട്ട രക്തസ്രാവകാലം എന്ന നിലയിൽ നൽകുക
  alternative: പദശഃ ‘ശുദ്ധീകരണത്തിന്റെ രക്തം’ എന്ന് നൽകുക
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപകം പൂർണമായി ഇല്ലാതാക്കാതെ, ഇത് ധാർമിക കുറ്റശുദ്ധീകരണമല്ലെന്നും നിയമത്തിൽ നിർദ്ദേശിച്ച പ്രസവാനന്തര കാലമാണെന്നും മലയാളവായനക്കാരന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘അശുദ്ധ’ എന്ന പരമ്പരാഗത ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും തെറ്റായ ധാർമിക അർഥം വരാതിരിക്കാൻ അടിക്കുറിപ്പിൽ ആചാരപരമായ പശ്ചാത്തലം വ്യക്തമാക്കി. ഹീബ്രുവിലെ അപരിചിതമായ ‘ശുദ്ധീകരണത്തിന്റെ രക്തങ്ങളിൽ കഴിയുക’ എന്ന ഘടന അർഥസുതാര്യതയ്ക്കായി മിതമായി സ്വാഭാവികമാക്കി.
