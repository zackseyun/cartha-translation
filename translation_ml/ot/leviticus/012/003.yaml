  text: And on the eighth day the flesh of his foreskin shall be circumcised[a].
translation:
  language: ml
  text: എട്ടാം ദിവസം അവന്റെ അഗ്രചർമ്മത്തിലെ മാംസം പരിച്ഛേദനം ചെയ്യപ്പെടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: ‘എട്ടാം ദിവസം അവനെ പരിച്ഛേദനം ചെയ്യണം.’ എബ്രായ മൂലത്തിൽ ക്രിയ കർമണിരൂപത്തിലാണ്; മുഖ്യപാഠം ആ രൂപം നിലനിർത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: ദിവസം
  rationale: വാവ് സംയോജകവും ബേത് കാലസൂചക ഉപസർഗവും ചേർന്ന പ്രയോഗം നിയമനിർദേശത്തിന്റെ തുടർച്ചയിൽ സ്വാഭാവികമായി ‘ദിവസം’ എന്ന കാലസൂചനയായി പരിഭാഷപ്പെടുത്തി; മലയാളത്തിൽ ഇവിടെ പ്രത്യേകം ‘പിന്നെ’ ചേർക്കാതെ തന്നെ ക്രമം വ്യക്തമാണ്.
- source_word: הַ/שְּׁמִינִי
  choice: എട്ടാം
  rationale: ‘ദിവസം’ എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന ക്രമസംഖ്യയുടെ നേരിട്ടുള്ള ആധുനിക മലയാളരൂപം.
- source_word: יִמּוֹל
  choice: പരിച്ഛേദനം ചെയ്യപ്പെടണം
  rationale: മൂൽ എന്ന ക്രിയയുടെ നിഫാൽ അപൂർണ്ണരൂപത്തിലുള്ള കർമണിപ്രയോഗവും നിയമപരമായ നിർബന്ധാർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: בְּשַׂר
  choice: മാംസം
  rationale: എബ്രായത്തിലെ ‘മാംസം’ എന്ന നാമത്തിന്റെ നേരിട്ടുള്ള തുല്യം; തുടർന്നുള്ള പദവുമായി ചേർന്ന ബന്ധപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: עָרְלָתוֹ
  choice: അവന്റെ അഗ്രചർമത്തിന്റെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന പുരുഷലിംഗ പ്രത്യയം ‘അവന്റെ’ എന്നും עָרְלָה എന്നത് ശരീരഘടനാപരമായി വ്യക്തമായ ‘അഗ്രചർമം’ എന്നും പരിഭാഷപ്പെടുത്തി.
