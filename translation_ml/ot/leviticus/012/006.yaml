  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: ml
  text: 'അവളുടെ ശുദ്ധീകരണകാലം—ആൺകുഞ്ഞിനുവേണ്ടിയായാലും പെൺകുഞ്ഞിനുവേണ്ടിയായാലും—പൂർത്തിയാകുമ്പോൾ, അവൾ ഒരു വയസ്സുള്ള ഒരു ആട്ടിൻകുട്ടിയെ ഹോമയാഗത്തിനായും ഒരു പ്രാവിൻകുഞ്ഞിനെയോ ഒരു കുറുപ്രാവിനെയോ പാപപരിഹാരയാഗത്തിനായും[a] സമാഗമകൂടാരത്തിന്റെ പ്രവേശനവാതിൽക്കൽ പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം.


    [a] അഥവാ: “ശുദ്ധീകരണയാഗത്തിനായി.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ധാർമികമായ പാപത്തിനുള്ള യാഗത്തെ മാത്രമല്ല, ആചാരപരമായ അശുദ്ധി നീക്കുന്നതിനുള്ള യാഗത്തെയും സൂചിപ്പിക്കാം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ശുദ്ധീകരണയാഗത്തിനായി.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ധാർമികമായ പാപത്തിനുള്ള യാഗത്തെ മാത്രമല്ല, ആചാരപരമായ അശുദ്ധി നീക്കുന്നതിനുള്ള യാഗത്തെയും സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאת יְמֵי טָהֳרָהּ
  choice: അവളുടെ ശുദ്ധീകരണകാലം ... പൂർത്തിയാകുമ്പോൾ
  rationale: מלא എന്ന ക്രിയയുടെ പൂർത്തീകരണാർഥവും יְמֵי טָהֳרָהּ എന്നതിന്റെ ആചാരപരമായ ശുദ്ധീകരണസന്ദർഭവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְבֵן אוֹ לְבַת
  choice: ആൺകുഞ്ഞിനുവേണ്ടിയായാലും പെൺകുഞ്ഞിനുവേണ്ടിയായാലും
  rationale: രണ്ടു പ്രസവസാഹചര്യങ്ങൾക്കും നിയമം ബാധകമാണെന്ന ഉൾക്കൊള്ളുന്ന ബദൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תָּבִיא
  choice: കൊണ്ടുവരണം
  rationale: നിയമവാക്യത്തിലെ നിർദേശാത്മക ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; അതിരുകടന്ന നിർബന്ധഭാവം ചേർക്കുന്നില്ല.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള ഒരു ആട്ടിൻകുട്ടി
  rationale: മൃഗത്തിന്റെ പ്രായം വ്യക്തമാക്കുന്ന എബ്രായപ്രയോഗം നേരിട്ടും വായനാസൗകര്യത്തോടെയും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה എന്ന സ്ഥാപിതമായ യാഗസാങ്കേതികപദത്തിന് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും കൃത്യവുമായ തുല്യപദം ഉപയോഗിക്കുന്നു.
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: ഒരു പ്രാവിൻകുഞ്ഞിനെയോ ഒരു കുറുപ്രാവിനെയോ
  rationale: בֶּן־יוֹנָהയുടെ ചെറുപ്രായസൂചനയും תֹר എന്ന പ്രത്യേക പക്ഷിനാമവും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: לְחַטָּאת
  choice: പാപപരിഹാരയാഗത്തിനായി
  rationale: ലേവ്യപുസ്തകത്തിലെ സാങ്കേതിക യാഗനാമത്തിന് പരിചിതമായ രൂപം മുഖ്യവാക്യത്തിൽ നിലനിർത്തുന്നു; ‘ശുദ്ധീകരണയാഗം’ എന്ന സന്ദർഭോചിത ബദൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനവാതിൽക്കൽ പുരോഹിതന്റെ അടുക്കൽ
  rationale: യാഗം എത്തിക്കേണ്ട സ്ഥലവും സ്വീകരിക്കുന്ന പുരോഹിതനും എന്ന എബ്രായക്രമബന്ധം കഴിയുന്നത്ര വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രസവശുദ്ധീകരണസന്ദർഭത്തിലെ חַטָּאת എന്ന യാഗനാമം
  choice: പാപപരിഹാരയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: חַטָּאת എന്നത് പരമ്പരാഗതമായി പാപപരിഹാരയാഗം എന്നു വിവർത്തനം ചെയ്യപ്പെടുന്ന സാങ്കേതികപദമാണ്; എന്നാൽ ഇവിടെ ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള പുനഃസ്ഥാപനമാണ് സന്ദർഭം, പ്രസവം ധാർമികപാപമാണെന്ന സൂചനയല്ല. അതിനാൽ മുഖ്യവാക്യത്തിൽ പരമ്പരാഗത പദവും അടിക്കുറിപ്പിൽ സന്ദർഭോചിതമായ ബദലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘ശുദ്ധീകരണം’, ‘ഹോമയാഗം’, ‘പാപപരിഹാരയാഗം’, ‘സമാഗമകൂടാരം’ തുടങ്ങിയ പരിചിത സാങ്കേതികപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി.
