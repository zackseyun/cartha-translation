id: LEV.12.2
reference: Leviticus 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കളോടു[a] പറയുക: ഒരു സ്ത്രീ ഗർഭം ധരിച്ച് ഒരു ആൺകുഞ്ഞിനെ പ്രസവിച്ചാൽ[b], അവൾ ഏഴു ദിവസം അശുദ്ധയായിരിക്കും[c]. അവളുടെ ആർത്തവ അശുദ്ധിയുടെ ദിവസങ്ങളിലെന്നപോലെ അവൾ അശുദ്ധയായിരിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേൽപുത്രന്മാർ’; ഇവിടെ ഈ പ്രയോഗം ഇസ്രായേൽജനത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രസവിച്ചാൽ’ എന്നതിനു പകരം സന്ദർഭത്തിൽ ‘പ്രസവിക്കുമ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ നിയമവാക്യത്തിലെ കണം ‘എങ്കിൽ’ എന്നും ‘എപ്പോൾ/അപ്പോൾ’ എന്നും ഗ്രഹിക്കാവുന്നതാണ്.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ പറയുന്നത് ആർത്തവവുമായി താരതമ്യപ്പെടുത്തിയ ആചാരപരമായ അശുദ്ധിനിലയെക്കുറിച്ചാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായ ദേശീയ-ഉടമ്പടി സംജ്ഞയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന സമൂഹനാമവുമായ രൂപം ഉപയോഗിച്ചു; അക്ഷരാർഥത്തിലുള്ള ‘ഇസ്രായേൽപുത്രന്മാർ’ മലയാളത്തിൽ അനാവശ്യമായി പുരുഷന്മാരിൽ മാത്രം പരിമിതമാണെന്ന ധാരണ സൃഷ്ടിക്കാം.
- source_word: אִשָּׁה
  choice: ഒരു സ്ത്രീ
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പൊതുവായ ‘സ്ത്രീ’ എന്ന അർഥമാണ് യോജിക്കുന്നത്; ‘ഭാര്യ’ എന്നു നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: כִּי
  choice: -ച്ചാൽ
  rationale: ഇവിടെ כִּי ഒരു നിയമപരമായ സാഹചര്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ സോപാധിക രൂപമായ ‘പ്രസവിച്ചാൽ’ സ്വാഭാവികമാണ്; സന്ദർഭത്തിൽ ‘പ്രസവിക്കുമ്പോൾ’ എന്നും ഗ്രഹിക്കാം.
- source_word: תַזְרִיעַ
  choice: ഗർഭം ധരിച്ച്
  rationale: זרע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് അക്ഷരാർഥത്തിൽ വിത്തുമായി ബന്ധമുണ്ടെങ്കിലും, പ്രസവസന്ദർഭത്തിലെ പ്രയോഗാർഥം ഗർഭധാരണമാണ്.
- source_word: וְיָלְדָה זָכָר
  choice: ഒരു ആൺകുഞ്ഞിനെ പ്രസവിച്ചാൽ
  rationale: זָכָר സൂചിപ്പിക്കുന്ന കുഞ്ഞിന്റെ പുരുഷലിംഗം വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി പറയുകയും ചെയ്യുന്നു.
- source_word: וְטָמְאָה / תִּטְמָא
  choice: അശുദ്ധയായിരിക്കും
  rationale: നിയമപരമായ നിലയെ സൂചിപ്പിക്കുന്ന ആവർത്തനം നിലനിർത്തി. മൂലപാഠത്തിൽ ‘ആചാരപരമായി’ എന്ന വിശേഷണം നേരിട്ട് ഇല്ലാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം നേരായും വ്യക്തമായും പരിഭാഷപ്പെടുത്തി.
- source_word: נִדַּת דְּוֺתָהּ
  choice: അവളുടെ ആർത്തവ അശുദ്ധി
  rationale: ആർത്തവവുമായി ബന്ധപ്പെട്ട അശുദ്ധിനിലയാണ് ഈ സംയുക്തപ്രയോഗം സൂചിപ്പിക്കുന്നത്; പഴഞ്ചനോ രോഗസൂചന അധികമുള്ളതോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
- source_word: כִּימֵי
  choice: ദിവസങ്ങളിലെന്നപോലെ
  rationale: താരതമ്യം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗവും ‘ദിവസങ്ങൾ’ എന്ന കാലപരാമർശവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: טמא എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: അശുദ്ധ
  alternative: ആചാരപരമായി അശുദ്ധ / അനുഷ്ഠാനപരമായി അശുദ്ധ
  rationale: ലേവ്യപുസ്തകത്തിലെ സന്ദർഭം ആചാരപരമായ ശുദ്ധിനിലയെ സംബന്ധിക്കുന്നുവെങ്കിലും, എബ്രായപദം തന്നെ വിശദീകരണവിശേഷണം ചേർക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ ലളിതമായ പദം നിലനിർത്തി, ആചാരപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയ സംജ്ഞയുടെ ലിംഗരൂപം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽപുത്രന്മാർ
  rationale: എബ്രായപ്രയോഗം വ്യാകരണപരമായി പുരുഷലിംഗ ബഹുവചനമാണെങ്കിലും, ഇവിടെ അത് ഉടമ്പടിസമൂഹത്തെ പൊതുവായി അഭിസംബോധന ചെയ്യുന്ന സ്ഥിരസംജ്ഞയാണ്. മലയാളത്തിലെ ‘മക്കൾ’ ഉറവിടത്തിന്റെ കുടുംബ-ദേശീയ ഭാവം സംരക്ഷിക്കുകയും പുരുഷന്മാരിൽ മാത്രം പരിമിതമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമവാക്യശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ‘അശുദ്ധ’ എന്ന പദത്തിന്റെ ആവർത്തനം നിലനിർത്തി; വിശദീകരണപരമായ ‘ആചാരപരമായി’ എന്നത് മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
