source:
  edition: WLC
  text: עַל כֵּ֤ן אָמַ֨רְתִּי֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל כָּל נֶ֥פֶשׁ מִ/כֶּ֖ם לֹא תֹ֣אכַל דָּ֑ם וְ/הַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶ֖ם לֹא יֹ֥אכַל דָּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞാൻ ഇസ്രായേൽമക്കളോടു[a] പറഞ്ഞു: ‘നിങ്ങളിൽ ആരും രക്തം ഭക്ഷിക്കരുത്; നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന പരദേശിയും[b] രക്തം ഭക്ഷിക്കരുത്.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഇസ്രായേൽപുത്രന്മാരോടു”; “ഇസ്രായേല്യരോടു” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: “പരദേശി” എന്നത് ഇസ്രായേല്യനല്ലെങ്കിലും ഇസ്രായേലിന്റെ ഇടയിൽ താമസിച്ച് അവിടത്തെ സമൂഹനിയമങ്ങൾക്ക് വിധേയനായ ഒരാളെ സൂചിപ്പിക്കുന്നു; “പ്രവാസി” അല്ലെങ്കിൽ “വിദേശതാമസക്കാരൻ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ രക്തത്തെക്കുറിച്ചു നൽകിയ കാരണത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָמַרְתִּי
  choice: ഞാൻ ... പറഞ്ഞു
  rationale: അടിസ്ഥാന ക്രിയയായ ‘പറയുക’ എന്ന അർഥവും ഭൂതകാല നിയമപ്രസംഗസന്ദർഭവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോടു
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന എബ്രായ പ്രയോഗം മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ കൂട്ടനാമത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: നിങ്ങളിൽ ആരും
  rationale: נֶפֶשׁ ഇവിടെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; നിഷേധത്തോടുകൂടെ വരുന്ന വിതരണാത്മക നിയമബലം ‘നിങ്ങളിൽ ആരും’ വ്യക്തമായി നൽകുന്നു.
- source_word: לֹא תֹאכַל דָּם
  choice: രക്തം ഭക്ഷിക്കരുത്
  rationale: നിരോധനത്തിന്റെ നിയമബലവും ‘രക്തം ഭക്ഷിക്കുക’ എന്ന മൂലപ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: הַגֵּר
  choice: പരദേശി
  rationale: ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുകയും സമൂഹനിയമങ്ങൾക്ക് വിധേയനാകുകയും ചെയ്യുന്ന ഇസ്രായേല്യനല്ലാത്ത താമസക്കാരനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; വെറും പുറത്തുനിന്നുള്ള ഒരാൾ എന്നതിലധികമുള്ള അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന
  rationale: പങ്കാളിക രൂപത്തിന്റെ തുടർച്ചയായ താമസബോധവും ‘നിങ്ങളുടെ നടുവിൽ’ എന്ന സ്ഥാനബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֹא יֹאכַל דָּם
  choice: രക്തം ഭക്ഷിക്കരുത്
  rationale: പരദേശിക്കും അതേ നിരോധനം ബാധകമാണെന്ന ആവർത്തനം സമാന്തരമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസമൂഹനാമത്തിലെ ലിംഗസൂചന
  choice: ഇസ്രായേൽമക്കളോടു
  alternative: ഇസ്രായേല്യരോടു; ഇസ്രായേൽപുത്രന്മാരോടു
  rationale: ‘മക്കൾ’ എന്നത് ബഹുവചന കൂട്ടസംബോധനയായി മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘പുത്രന്മാർ’ എന്ന കൂടുതൽ പദാനുപദ രൂപം സാധ്യമാണെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് മൂലത്തിലെ പുരുഷലിംഗരൂപം മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമപ്രസംഗശൈലി. ‘ഭക്ഷിക്കരുത്’ എന്ന സമാന്തര നിരോധനം രണ്ടിടത്തും നിലനിർത്തി. അടിക്കുറിപ്പുകളുടെ [a], [b] ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
