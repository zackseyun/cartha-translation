  text: וְ/זָרַ֨ק הַ/כֹּהֵ֤ן אֶת הַ/דָּם֙ עַל מִזְבַּ֣ח יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הִקְטִ֣יר הַ/חֵ֔לֶב לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: ml
  text: പുരോഹിതൻ ആ രക്തം സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിലുള്ള യഹ്വേയുടെ യാഗപീഠത്തിന്മേൽ ചീറ്റണം[a]. പിന്നെ കൊഴുപ്പ് യഹ്വേക്കു പ്രസാദകരമായ സൗരഭ്യമായി[b] ദഹിപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യാഗപീഠത്തിന്മേൽ തളിക്കണം’ അല്ലെങ്കിൽ ‘യാഗപീഠത്തിനെതിരെ ചീറ്റണം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ പുരോഹിതൻ രക്തം ആചാരപരമായി യാഗപീഠത്തിൽ പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘പ്രസാദകരമായ ഗന്ധമായി’; ‘ശാന്തിപ്പിക്കുന്ന സൗരഭ്യമായി’ അല്ലെങ്കിൽ ‘മധുരസൗരഭ്യമായി’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: ചീറ്റണം
  rationale: യാഗകർമസന്ദർഭത്തിൽ זָרַק രക്തം യാഗപീഠത്തിലേക്കു ശക്തിയായി പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തളിക്കണം’ എന്നതിനെക്കാൾ ‘ചീറ്റണം’ ഈ ചലനം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; എന്നാൽ ക്രിയയുടെ കൃത്യരീതി സംബന്ധിച്ച സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: כֹּהֵן എന്ന പദത്തിന്റെ സ്വാഭാവികവും അംഗീകൃതവുമായ മലയാളരൂപം; നിശ്ചയാർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: הַדָּם
  choice: ആ രക്തം
  rationale: മുൻപു പരാമർശിച്ച യാഗമൃഗത്തിന്റെ രക്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ആ’ ചേർക്കുന്നത് ഈ നിർദ്ദിഷ്ടത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל מִזְבַּח יְהוָה
  choice: യഹ്വേയുടെ യാഗപീഠത്തിന്മേൽ
  rationale: עַל എന്നത് രക്തം യാഗപീഠത്തിന്മേൽ/അതിനെതിരെ പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കാം. ‘യാഗപീഠത്തിന്മേൽ’ സ്വാഭാവിക മലയാളമാണ്; ചലനത്തിന്റെ ശക്തി ‘ചീറ്റണം’ എന്ന ക്രിയയിൽ പ്രകടമാകുന്നു.
- source_word: יְהוָה
  choice: യഹ്വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പൊതുപദവിയാൽ പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: פֶּתַח പ്രവേശനസ്ഥലത്തെയും אֹהֶל מוֹעֵד ദൈവസന്നിധിയിൽ കൂടിവരാനുള്ള കൂടാരത്തെയും സൂചിപ്പിക്കുന്നു. ഈ രൂപം വ്യക്തവും നിലവാരമുള്ള മലയാളവുമാണ്.
- source_word: וְהִקְטִיר
  choice: ദഹിപ്പിക്കണം
  rationale: പുരോഹിതഭാഷയിൽ ഈ ക്രിയ യാഗപീഠത്തിൽ കത്തിച്ച് പുകയായി ഉയർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ദഹിപ്പിക്കണം’ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണ്.
- source_word: הַחֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗത്തിനായി വേർതിരിച്ച മൃഗക്കൊഴുപ്പിന്റെ ഭാഗങ്ങളെയാണ് חֵלֶב സൂചിപ്പിക്കുന്നത്.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യമായി
  rationale: ഈ സ്ഥിരയാഗപ്രയോഗം യഹ്വേക്കു സ്വീകാര്യവും പ്രസാദകരവുമായ ഗന്ധത്തെ സൂചിപ്പിക്കുന്നു; ദൈവത്തെ ശാന്തമാക്കുന്നു എന്ന വ്യാഖ്യാനം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: לַיהוָה
  choice: യഹ്വേക്കു
  rationale: לְ യാഗത്തിന്റെ ദിശയും സ്വീകർത്താവുമായ യഹ്വേയെ സൂചിപ്പിക്കുന്നു; ദാതൃവിഭക്തി മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിയായി മാറ്റാതെ ‘യഹ്വേ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: רֵיחַ נִיחֹחַ എന്ന യാഗപ്രയോഗത്തിന്റെ അർത്ഥം
  choice: പ്രസാദകരമായ സൗരഭ്യം
  alternative: ശാന്തിപ്പിക്കുന്ന സൗരഭ്യം; മധുരസൗരഭ്യം
  rationale: സ്വീകാര്യതയും പ്രസാദവും സൂചിപ്പിക്കുന്ന അർത്ഥം നിലനിർത്തുന്നു; ദൈവിക വികാരമാറ്റത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. നിയമവാക്യത്തിന്റെ നിർദ്ദേശഭാവം ‘-ണം’ രൂപങ്ങളിലൂടെ നിലനിർത്തി. സാങ്കേതിക യാഗപദങ്ങൾക്ക് അത്യധികം പുരാതനമോ വിഭാഗീയമോ ആയ ശൈലി ഒഴിവാക്കി.
