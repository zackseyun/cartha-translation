source:
  edition: WLC
  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: ml
  text: അവർ ഇനി തങ്ങളുടെ ബലികൾ കോലാട്ടുരൂപമുള്ള ഭൂതങ്ങൾക്ക്[a] അർപ്പിക്കരുത്; അവരുടെ പിന്നാലെ അവർ പരസംഗം ചെയ്യുന്നു.[b] ഇത് അവരുടെ തലമുറകളിലുടനീളം അവർക്കുള്ള സ്ഥിരമായ ചട്ടമായിരിക്കും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കോലാട്ടുവിഗ്രഹങ്ങൾക്ക്’ അല്ലെങ്കിൽ ‘സാറ്റിറുകൾക്ക്’. എബ്രായപദം അനധികൃത ആരാധനയുമായി ബന്ധപ്പെട്ട കോലാട്ടുരൂപമുള്ള സത്തകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അവരുടെ പിന്നാലെ അവർ പരസംഗം ചെയ്യുന്നു’; മതപരമായ അവിശ്വസ്തതയെയോ വിഗ്രഹാരാധനയെയോ സൂചിപ്പിക്കുന്ന രൂപകം.'
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘എന്നേക്കുമുള്ള ചട്ടം’ അല്ലെങ്കിൽ ‘നിരന്തരമായ ചട്ടം’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ ... זִבְחֵיהֶם
  choice: തങ്ങളുടെ ബലികൾ ... അർപ്പിക്കരുത്
  rationale: നിഷേധത്തോടുകൂടിയ നിയമപ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള വിലക്കായി അവതരിപ്പിക്കുന്നു. ക്രിയയും നാമവും ഒരേ ധാതുവിൽനിന്നുള്ളതാണെങ്കിലും ‘ബലികൾ ബലിയർപ്പിക്കുക’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കി.
- source_word: עוֹד
  choice: ഇനി
  rationale: മുമ്പുണ്ടായിരുന്നോ തുടരുന്നോ ആയ ആചാരം അവസാനിപ്പിക്കുന്ന ‘ഇനിമുതൽ അരുത്’ എന്ന അർഥം സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לַשְּׂעִירִם
  choice: കോലാട്ടുരൂപമുള്ള ഭൂതങ്ങൾക്ക്
  rationale: പദത്തിന്റെ അടിസ്ഥാനത്തിലുള്ള കോലാട്ടിൻ/രോമാവൃത രൂപസൂചനയും ആരാധനാസന്ദർഭത്തിലെ അമാനുഷിക ദുഷ്ടശക്തികളെന്ന സാധ്യതയേറിയ അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ഗ്രീക്കോ-റോമൻ ‘സാറ്റിർ’ ആശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: അവയുടെ പിന്നാലെ പരസംഗം ചെയ്യുന്നതുപോലെ അവർ പോകുന്നു
  rationale: വിഗ്രഹാരാധനയോടുള്ള മതപരമായ അവിശ്വസ്തതയെ ലൈംഗിക അവിശ്വസ്തതയായി ചിത്രീകരിക്കുന്ന എബ്രായ രൂപകം മായ്ച്ചുകളയാതെ, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന ഉപമാസൂചനയോടെ നിലനിർത്തുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: സ്ഥിരമായ ചട്ടം
  rationale: നിയമസൂത്രത്തിലെ ദീർഘകാല, തുടർച്ചയായ പ്രാബല്യം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘നിത്യമായ’ എന്ന് പറഞ്ഞ് സന്ദർഭപരിധിക്കപ്പുറം നിർബന്ധമായി വിപുലീകരിക്കുന്നില്ല.
- source_word: לְדֹרֹתָם
  choice: തലമുറതലമുറയായി
  rationale: തുടർച്ചയായ തലമുറകളിലേക്കുള്ള പ്രാബല്യം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: שְּׂעִירִם എന്നതിന്റെ ആരാധനാസംബന്ധിയായ സൂചന
  choice: കോലാട്ടുരൂപമുള്ള ഭൂതങ്ങൾ
  alternative: കോലാട്ടുവിഗ്രഹങ്ങൾ; സാറ്റിറുകൾ; കോലാടുകൾ
  rationale: ബലിയർപ്പണവും തുടർന്ന് വരുന്ന മതപരമായ പരസംഗരൂപകവും സാധാരണ കോലാടുകളെക്കാൾ അമാനുഷികമോ വിഗ്രഹാരാധനാപരമോ ആയ സത്തകളിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. രൂപസൂചന ഉൾപ്പെടുത്തി സാധ്യതയേറിയ അർഥം നൽകുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
- issue: זֹנִים എന്ന ഉടമ്പടി/ആരാധനാ അവിശ്വസ്തതയുടെ രൂപകം
  choice: പരസംഗം ചെയ്യുന്നതുപോലെ അവർ പോകുന്നു
  alternative: അവർ അവിശ്വസ്തരാകുന്നു; അവർ വിഗ്രഹാരാധന ചെയ്യുന്നു
  rationale: മൂലത്തിലെ ലൈംഗിക അവിശ്വസ്തതാരൂപകം നിലനിർത്തുന്നു; അതിനെ വെറും ‘വിഗ്രഹാരാധന’ എന്ന വ്യാഖ്യാനപരമായ സംഗ്രഹമാക്കി ചുരുക്കുന്നില്ല. ‘പോലെ’ എന്നത് ഇത് ആരാധനാസംബന്ധിയായ രൂപകമാണെന്ന് മലയാളവായനക്കാരന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ നിയമശൈലി. അനാവശ്യ സംസ്കൃതഭാരം ഒഴിവാക്കി; എന്നാൽ ആരാധനാ-നിയമസന്ദർഭത്തിന് യോജിച്ച ‘ബലി’, ‘ചട്ടം’, ‘പരസംഗം’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തി.
