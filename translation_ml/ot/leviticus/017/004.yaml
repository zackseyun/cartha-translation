  text: וְ/אֶל פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיא/וֹ֒ לְ/הַקְרִ֤יב קָרְבָּן֙ לַֽ/יהוָ֔ה לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָ/אִ֤ישׁ הַ/הוּא֙ דָּ֣ם שָׁפָ֔ךְ וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מִ/קֶּ֥רֶב עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: ml
  text: അവൻ അതിനെ യഹോവയുടെ തിരുനിവാസത്തിന്റെ മുമ്പിൽ യഹോവയ്ക്കുള്ള വഴിപാടായി അർപ്പിക്കാൻ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിലേക്കു കൊണ്ടുവന്നില്ലെങ്കിൽ, ആ മനുഷ്യന്റെമേൽ രക്തം ചുമത്തപ്പെടും[a]; അവൻ രക്തം ചൊരിഞ്ഞിരിക്കുന്നു. ആ മനുഷ്യൻ തന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ആ മനുഷ്യന് രക്തം കണക്കാക്കപ്പെടും.’ ഇത് രക്തം ചൊരിഞ്ഞതിനുള്ള കുറ്റബാധ്യതയെ സൂചിപ്പിക്കുന്ന നിയമപ്രയോഗമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ‘ഛേദിക്കപ്പെടും’ എന്നത് ഇവിടെ വധശിക്ഷയെയോ, സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലിനെയോ, മറ്റൊരു വിധത്തിലുള്ള ഉടമ്പടിസംബന്ധമായ നീക്കത്തെയോ കൃത്യമായി നിർണ്ണയിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടം
  rationale: פֶּתַח എന്നത് പ്രവേശനസ്ഥലം/കവാടം എന്നും אֹהֶל מוֹעֵד വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരനാമമായി ‘സമാഗമകൂടാരം’ എന്നും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הֱבִיאוֹ
  choice: അതിനെ ... കൊണ്ടുവന്നില്ലെങ്കിൽ
  rationale: ഹിഫിൽ രൂപം ‘കൊണ്ടുവരുക’ എന്നാണ്; പ്രത്യയത്തിലെ കർമം മുൻവാക്യത്തിലെ അറുക്കപ്പെട്ട മൃഗത്തെ സൂചിപ്പിക്കുന്നു. നിയമവ്യവസ്ഥയുടെ തുടർച്ച വ്യക്തമാക്കാൻ സോപാധിക രൂപം ഉപയോഗിച്ചു.
- source_word: לְהַקְרִיב קָרְבָּן
  choice: വഴിപാടായി അർപ്പിക്കാൻ
  rationale: הקריב യാഗസന്ദർഭത്തിൽ അടുത്തുകൊണ്ടുവരുക/അർപ്പിക്കുക എന്നും קָרְבָּן വഴിപാട് എന്നും അർത്ഥമാക്കുന്നു; മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി ബലിസംബന്ധമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: ദൈവനാമമായ יהוה ശബ്ദലിപ്യന്തരണമായി ‘യഹോവ’ എന്നു നൽകി; ഇംഗ്ലീഷ് consultation layer-ലെ Yahweh-നോടും നേരിട്ടുള്ള എബ്രായ സാക്ഷ്യത്തോടും യോജിക്കുന്നു.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: യഹോവയുടെ തിരുനിവാസത്തിന്റെ മുമ്പിൽ
  rationale: מִשְׁכָּן എന്നതിന്റെ അടിസ്ഥാനധാരണ ‘വാസസ്ഥലം’ ആണ്; ആരാധനാസന്ദർഭവും മാന്യമായ ആധുനിക മലയാളവും നിലനിർത്താൻ ‘തിരുനിവാസം’ തെരഞ്ഞെടുത്തു. לִפְנֵי സ്ഥലം സൂചിപ്പിച്ച് ‘മുമ്പിൽ’ എന്നു നൽകി.
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: ആ മനുഷ്യന്റെമേൽ രക്തം ചുമത്തപ്പെടും
  rationale: എബ്രായത്തിലെ ‘ആ മനുഷ്യന് രക്തം കണക്കാക്കപ്പെടും’ എന്ന നിയമപരമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി; ‘രക്തപാതകക്കുറ്റം’ എന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ മൂലത്തിലെ രൂപകവും ന്യായവിധിയുടെ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: דָּם שָׁפָךְ
  choice: അവൻ രക്തം ചൊരിഞ്ഞിരിക്കുന്നു
  rationale: ‘രക്തം ചൊരിയുക’ എന്ന സ്ഥിരപ്രയോഗം മൂലത്തിന്റെ അക്ഷരാർഥവും നിയമ-ധാർമിക ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: וְנִכְרַת
  choice: ഛേദിക്കപ്പെടണം
  rationale: നിഫാൽ രൂപത്തിലെ covenantal/legal പ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു; മരണം, പുറത്താക്കൽ, മറ്റൊരു ഉടമ്പടിസംബന്ധമായ നീക്കം എന്നിവയിൽ ഒന്നായി അർത്ഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: തന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന്
  rationale: ജനസമൂഹത്തിൽനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരസൂത്രവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: דָּם יֵחָשֵׁב എന്ന നിയമപ്രയോഗം
  choice: ആ മനുഷ്യന്റെമേൽ രക്തം ചുമത്തപ്പെടും
  alternative: ആ മനുഷ്യന് രക്തപാതകക്കുറ്റം കണക്കാക്കപ്പെടും
  rationale: നിയമപരമായ കുറ്റബാധ്യത ഉദ്ദേശിക്കുന്നുവെങ്കിലും ‘രക്തം’ എന്ന മൂലപദം മുഖ്യവാചകത്തിൽ നിലനിർത്തി. തുടർന്നുള്ള ‘അവൻ രക്തം ചൊരിഞ്ഞിരിക്കുന്നു’ എന്ന വാക്യം അതിന്റെ കുറ്റപരമായ അർത്ഥം വ്യക്തമാക്കുന്നു.
- issue: וְנִכְרַת എന്ന ശിക്ഷയുടെ സ്വഭാവം
  choice: ഛേദിക്കപ്പെടണം
  alternative: വധിക്കപ്പെടണം / പുറത്താക്കപ്പെടണം
  rationale: ഈ വാക്യം ശിക്ഷ നടപ്പാക്കുന്ന കൃത്യമായ രീതി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മരണമോ പുറത്താക്കലോ എന്നു തീരുമാനിക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്ര-നിയമപരമായ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ലേവ്യപുസ്തകത്തിലെ ആരാധനാ-നിയമപരമായ ഭാവം നിലനിർത്താൻ ‘സമാഗമകൂടാരം’, ‘തിരുനിവാസം’, ‘വഴിപാട്’, ‘ഛേദിക്കപ്പെടണം’ എന്നീ ഔപചാരിക പദങ്ങൾ ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിന്റെ സോപാധിക തുടർച്ചയായതിനാൽ ‘ഇല്ലെങ്കിൽ’ ചേർത്തു.
