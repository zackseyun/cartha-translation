source:
  edition: WLC
  text: אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל אֲשֶׁ֨ר יִשְׁחַ֜ט שׁ֥וֹר אוֹ כֶ֛שֶׂב אוֹ עֵ֖ז בַּֽ/מַּחֲנֶ֑ה א֚וֹ אֲשֶׁ֣ר יִשְׁחַ֔ט מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: ml
  text: ഇസ്രായേൽഗൃഹത്തിൽനിന്നുള്ള ഏതൊരു പുരുഷനും ഒരു കാളയെയോ ചെമ്മരിയാടിനെയോ കോലാടിനെയോ പാളയത്തിൽ അറുക്കുകയോ പാളയത്തിനു പുറത്ത് അറുക്കുകയോ ചെയ്യുന്നെങ്കിൽ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: ആരെങ്കിലും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന എബ്രായ നാമം വിതരണാർഥത്തിൽ ‘ഏതൊരാൾ’ എന്ന പൊതുവായ നിയമപ്രയോഗമാണ്. മലയാളത്തിൽ ‘ആരെങ്കിലും’ ഈ വ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹത്തിൽപ്പെട്ട
  rationale: ‘ഇസ്രായേൽഗൃഹത്തിൽനിന്നുള്ള’ എന്ന ഉടമ്പടി-ദേശീയ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: יִשְׁחַט
  choice: അറുക്കുന്നെങ്കിൽ
  rationale: שׁחט മൃഗത്തെ അറുക്കുന്നതിനെ, ഇവിടെ യാഗനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ, സൂചിപ്പിക്കുന്നു. ‘അറുക്കുക’ സാധാരണ മലയാളത്തിലും ആചാരപരമായ സന്ദർഭത്തിലും യോജിക്കുന്നു.
- source_word: שׁוֹר
  choice: കാള
  rationale: ഒറ്റ മാടിനെ സൂചിപ്പിക്കുന്ന പൊതുവായ പദം; എബ്രായത്തിൽ നിർബന്ധമില്ലാത്ത പ്രായമോ കൂടുതൽ പ്രത്യേകതയോ ചേർക്കുന്നില്ല.
- source_word: כֶשֶׂב
  choice: ചെമ്മരിയാട്
  rationale: ഇത് ആട്ടിൻവർഗത്തിലെ ചെമ്മരിയാടിനെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘കുഞ്ഞാട്’ എന്ന പ്രായപരിമിതി മൂലത്തിൽ ഇല്ല.
- source_word: עֵז
  choice: കോലാട്
  rationale: ചെമ്മരിയാടിൽനിന്ന് വ്യക്തമായി വേർതിരിക്കാൻ ആടുവർഗത്തിലെ goat എന്ന അർഥം നൽകുന്ന സാധാരണ മലയാളപദം.
- source_word: בַּמַּחֲנֶה
  choice: പാളയത്തിനകത്തുവെച്ച്
  rationale: പാളയത്തിന്റെ പരിധിക്കുള്ളിലെ സ്ഥലം വ്യക്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തുവെച്ച്
  rationale: അറുക്കൽ നടക്കുന്ന സ്ഥലം പാളയപരിധിക്ക് പുറത്താണെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: …വെച്ചോ …വെച്ചോ അറുക്കുന്നെങ്കിൽ
  rationale: എബ്രായത്തിലെ സമാന്തര സാപേക്ഷഘടന മലയാളത്തിൽ സംയോജിതമായ ഐച്ഛിക നിയമവാക്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: '[implicit object after second יִשְׁחַט]'
  choice: പങ്കിട്ട മൃഗകർമപദം
  rationale: മലയാളത്തിൽ കാള/ചെമ്മരിയാട്/കോലാട് എന്ന കർമപട്ടിക രണ്ടിടസാധ്യതകൾക്കും പൊതുവാക്കി വെക്കുന്നത് ആവർത്തനം ഒഴിവാക്കുകയും എബ്രായത്തിലെ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി. പൊതുവ്യാപ്തി പ്രധാനവാചകത്തിൽ തന്നെ വ്യക്തമായതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
