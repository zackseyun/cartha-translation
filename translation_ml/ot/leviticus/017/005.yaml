source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ തുറസ്സായ വയലിൽ അർപ്പിച്ചുകൊണ്ടിരിക്കുന്ന തങ്ങളുടെ യാഗങ്ങളെ യഹോവയുടെ സന്നിധിയിലേക്ക്, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കലുള്ള പുരോഹിതന്റെ അടുക്കലേക്ക് കൊണ്ടുവന്ന്, അവയെ യഹോവയ്ക്കു സമാധാനയാഗങ്ങളായി[a] അർപ്പിക്കേണ്ടതിനായിട്ടാണ് ഇത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൂട്ടായ്മയാഗങ്ങൾ” അഥവാ “ക്ഷേമയാഗങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: שְׁלָמִים എന്ന യാഗനാമത്തിന്റെ സമാധാനം, ക്ഷേമം, കൂട്ടായ്മ എന്നീ അർത്ഥസാധ്യതകൾ വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: അർപ്പിക്കേണ്ടതിനാണിത്
  rationale: മുൻവാക്യത്തിലെ കല്പനയുടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യഘടനയായി നൽകി.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധപരമായ പ്രയോഗം നിലനിർത്തുകയും മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: זִבְחֵיהֶם אֲשֶׁר הֵם זֹבְחִים
  choice: അർപ്പിച്ചുകൊണ്ടിരിക്കുന്ന യാഗങ്ങളെ
  rationale: זבח എന്ന പദത്തിന്റെ യാഗാർപ്പണാർത്ഥവും പങ്കാളിക്രിയയുടെ തുടരുന്ന അഥവാ പതിവായ പ്രവർത്തനഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: വെളിമ്പ്രദേശത്ത്
  rationale: വിശുദ്ധമന്ദിരത്തിനു പുറത്തുള്ള തുറന്ന വയൽപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לַיהוָה
  choice: യഹോവയുടെ അടുക്കൽ / യഹോവയ്ക്കു
  rationale: നിയമനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത്, വാക്യത്തിലെ ദിശയും സമർപ്പണവും അനുസരിച്ച് മലയാള വിഭക്തികൾ ചേർത്തു.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: ആരാധനാസ്ഥലത്തിന്റെ നിർദിഷ്ട പ്രവേശനസ്ഥാനം കൃത്യവും വായനാസൗകര്യമുള്ളതുമായ രീതിയിൽ നൽകി.
- source_word: אֶל הַכֹּהֵן
  choice: പുരോഹിതന്റെ അടുക്കൽ
  rationale: ഹീബ്രുവിലെ നിർദിഷ്ടത നിലനിർത്തി, അവിടെ ശുശ്രൂഷിക്കുന്ന പുരോഹിതനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: זִבְחֵי שְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: ഈ പ്രത്യേക യാഗവിഭാഗത്തിന്റെ പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ മലയാളപദം; ശാലോം/പൂർണക്ഷേമം എന്ന പദബന്ധവും ഭാഗികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള നിയമനാമം പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: നിയമജനത്തെ സൂചിപ്പിക്കുന്ന കുടുംബബന്ധപരമായ ഹീബ്രു രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- issue: זִבְחֵי שְׁלָמִים എന്ന യാഗവിഭാഗം
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ; ക്ഷേമയാഗങ്ങൾ
  rationale: പദത്തിന്റെ സമാധാനം, പൂർണത, ക്ഷേമം, കൂട്ടായ്മ എന്നീ അർത്ഥവലയങ്ങളെ ഒരൊറ്റ മലയാളപദം പൂർണമായി ഉൾക്കൊള്ളുന്നില്ല; പ്രധാന പരമ്പരാഗത രൂപം പാഠത്തിൽ നൽകി മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ഒത്തുചേർത്തു. വാക്യം മുൻസന്ദർഭത്തെ ആശ്രയിക്കുന്ന ഉദ്ദേശ്യവാക്യമാണെന്നത് അവസാനത്തിലെ “അർപ്പിക്കേണ്ടതിനാണിത്” എന്ന ഘടനയിലൂടെ നിലനിർത്തി; യാഗസംബന്ധിയായ സാങ്കേതിക പദങ്ങൾ അനാവശ്യമായി ലളിതമാക്കിയിട്ടില്ല.
