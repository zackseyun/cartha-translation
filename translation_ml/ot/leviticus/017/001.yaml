  yaml_path: translation/ot/leviticus/017/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വേ[a] മോശെയോടു ഇപ്രകാരം അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: YHWH; ദൈവനാമം ഇവിടെ ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു. പാരമ്പര്യമായി ഇതിനു പകരം ‘കർത്താവ്’ എന്നു നൽകാറുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ wayyiqtol രൂപം പുതിയൊരു വചനസംഭവം ആരംഭിക്കുന്നു; തുടർന്നുള്ള לֵאמֹר-നോടുള്ള അനാവശ്യ ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് സൂത്രവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി മലയാളത്തിലെ സുപരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു; ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവെക്കുന്നില്ല.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל മലയാളത്തിൽ സ്വാഭാവികമായി ‘-യോടു’ എന്ന വിഭക്തിയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: അവിടുന്ന് അരുളിച്ചെയ്തത്
  rationale: തുടർന്നുവരുന്ന ദൈവവചനത്തിന്റെ ആമുഖമായി പ്രവർത്തിക്കുന്ന ഹീബ്രു സൂത്രപ്രയോഗം സ്വാഭാവികവും ആദരസൂചകവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ നിലനിർത്തുന്നു. സ്വരീകരണത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. നേരിട്ടുള്ള ഉദ്ധരണി അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
