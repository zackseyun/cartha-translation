revisions:
- from: മാംസത്തിന്റെ ജീവൻ രക്തത്തിലാണല്ലോ; നിങ്ങളുടെ ജീവനുകൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാൻ ഞാൻ അതു നിങ്ങൾക്കായി യാഗപീഠത്തിന്മേൽ നൽകിയിരിക്കുന്നു. എന്തെന്നാൽ, ജീവൻ മുഖാന്തരം പ്രായശ്ചിത്തം ചെയ്യുന്നത് രക്തമാണ്.[a]
  to: ശരീരത്തിന്റെ ജീവൻ രക്തത്തിലാണ്; നിങ്ങളുടെ ജീവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാൻ ഞാൻ അതു നിങ്ങൾക്കു യാഗപീഠത്തിന്മേൽ നൽകിയിരിക്കുന്നു. കാരണം, ജീവൻ മുഖാന്തരം പ്രായശ്ചിത്തം ചെയ്യുന്നത് രക്തമാണ്.[a]
  rationale: The revision improves idiomatic modern Malayalam while preserving the Hebrew’s lexical and syntactic links. It keeps ‘ജീവൻ’ for נֶפֶשׁ throughout, avoids over-interpreting the difficult final prepositional phrase, and preserves the alternative clarification at the existing footnote anchor.
