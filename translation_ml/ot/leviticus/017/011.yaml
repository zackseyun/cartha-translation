id: LEV.17.11
reference: Leviticus 17:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: ml
  text: ശരീരത്തിന്റെ ജീവൻ രക്തത്തിലാണ്; നിങ്ങളുടെ ജീവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാൻ ഞാൻ അതു നിങ്ങൾക്കു യാഗപീഠത്തിന്മേൽ നൽകിയിരിക്കുന്നു. കാരണം, ജീവൻ മുഖാന്തരം പ്രായശ്ചിത്തം ചെയ്യുന്നത് രക്തമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അതിലുള്ള ജീവൻ മുഖാന്തരമാണ് രക്തം പ്രായശ്ചിത്തം ചെയ്യുന്നത്.”'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ജീവൻ
  rationale: രക്തവുമായി ബന്ധപ്പെട്ടു നിൽക്കുന്ന ജീവശക്തിയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘ആത്മാവ്’ എന്നു വിവർത്തനം ചെയ്താൽ എബ്രായത്തിൽ നിർബന്ധമല്ലാത്ത ശരീരം–ആത്മാവ് ദ്വൈതധാരണ വരാം.
- source_word: הַבָּשָׂר
  choice: മാംസം
  rationale: ജീവിയുടെ സൃഷ്ടിജന്യമായ ശരീരമാംസത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ളതും ലേവ്യപുസ്തകത്തിന്റെ സന്ദർഭത്തിന് യോജിച്ചതുമായ പദം.
- source_word: בַּדָּם
  choice: രക്തത്തിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥാനാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נְתַתִּיו לָכֶם
  choice: ഞാൻ അതു നിങ്ങൾക്കായി നൽകിയിരിക്കുന്നു
  rationale: ദൈവം ഏർപ്പെടുത്തിയ ബലിവ്യവസ്ഥയുടെ ഇപ്പോഴും പ്രസക്തമായ ദാനസ്വഭാവം പ്രകടമാക്കുന്നു; לָכֶם എന്നത് ഈ സന്ദർഭത്തിൽ ‘നിങ്ങൾക്കായി’ എന്നു സ്വാഭാവികമാണ്.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ആരാധനാക്രമപരമായ പശ്ചാത്തലം വ്യക്തമായി നിലനിർത്തുന്ന സാധാരണ മലയാള പ്രയോഗം.
- source_word: לְכַפֵּר / יְכַפֵּר
  choice: പ്രായശ്ചിത്തം ചെയ്യാൻ / പ്രായശ്ചിത്തം ചെയ്യുന്നത്
  rationale: ലേവ്യപുസ്തകത്തിലെ כפר എന്ന ക്രിയയുടെ ആരാധനാക്രമപരമായ അർഥം നിലനിർത്തുന്നു; പ്രായശ്ചിത്തത്തിന്റെ ഒരു പ്രത്യേക സിദ്ധാന്തം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: നിങ്ങളുടെ ജീവനുകൾക്കുവേണ്ടി
  rationale: ഈ വാക്യത്തിലെ נֶפֶשׁ എന്ന പദത്തിന്റെ ‘ജീവൻ’ എന്ന അർഥവും ആവർത്തനബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: בַּנֶּפֶשׁ
  choice: ജീവൻ മുഖാന്തരം
  rationale: ב എന്നതിനെ ഉപകരണാർഥത്തിൽ ഗ്രഹിച്ചുള്ള വിവർത്തനം; എബ്രായവാക്യത്തിന്റെ സംക്ഷിപ്തതയും രക്തം–ജീവൻ ബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബലിനിയമസന്ദർഭത്തിലെ נֶפֶשׁ എന്ന പദത്തിന്റെ അർഥം
  choice: വാക്യത്തിലുടനീളം ‘ജീവൻ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ആത്മാവ്; വ്യക്തി; സ്വയം
  rationale: രക്തത്തിന്റെ പ്രായശ്ചിത്തപരമായ പ്രവർത്തനം അതുമായി ബന്ധപ്പെട്ട ജീവനിൽ അധിഷ്ഠിതമാണെന്നതാണ് വാക്യത്തിന്റെ ന്യായം; ‘ആത്മാവ്’ എന്നത് മൂലപാഠം ആവശ്യപ്പെടാത്ത പിന്നീടുള്ള മനുഷ്യശാസ്ത്രപരമായ വേർതിരിവ് സൂചിപ്പിച്ചേക്കാം.
- issue: അവസാന ഭാഗത്തിലെ בַּנֶּפֶשׁ എന്നതിന്റെ വ്യാകരണബലം
  choice: ‘ജീവൻ മുഖാന്തരം’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ജീവൻ നിമിത്തം; അതിലുള്ള ജീവൻ മുഖാന്തരം; ജീവൻകൊണ്ട്
  rationale: എബ്രായപ്രയോഗം സംക്ഷിപ്തവും വ്യാഖ്യാനഭേദത്തിന് ഇടയുള്ളതുമാണ്. ഉപകരണാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, ‘അതിലുള്ള ജീവൻ’ എന്ന വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു; ഇതുവഴി ആശയത്തെ അതിരുകടന്ന് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘പ്രായശ്ചിത്തം’, ‘യാഗപീഠം’ എന്നീ സ്ഥാപിത ആരാധനാക്രമപദങ്ങൾ സൂക്ഷിച്ചു. എബ്രായത്തിലെ נֶפֶשׁ എന്ന പദത്തിന്റെ ആവർത്തനം ‘ജീവൻ/ജീവനുകൾ’ എന്ന രൂപത്തിൽ കഴിയുന്നത്ര നിലനിർത്തി.
