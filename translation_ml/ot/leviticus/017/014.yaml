id: LEV.17.14
reference: Leviticus 17:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: ml
  text: 'എല്ലാ ജഡത്തിന്റെയും ജീവൻ അതിന്റെ രക്തമാണ്; അതിന്റെ ജീവനിലാണ് അതിന്റെ രക്തം[a]. അതുകൊണ്ട് ഞാൻ ഇസ്രായേൽമക്കളോട്[b] പറഞ്ഞു: ‘യാതൊരു ജഡത്തിന്റെയും രക്തം നിങ്ങൾ ഭക്ഷിക്കരുത്; എല്ലാ ജഡത്തിന്റെയും ജീവൻ അതിന്റെ രക്തമാണ്.’ അതു ഭക്ഷിക്കുന്ന ഏവനും ഛേദിക്കപ്പെടും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യാഖ്യാനപരമായി: ‘അതിന്റെ രക്തം തന്നെയാണ് അതിന്റെ ജീവൻ.’'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാരോട്’; അതായത്, ഇസ്രായേൽജനത്തോട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ജീവൻ
  rationale: ഈ ഭക്ഷണ-യാഗസന്ദർഭത്തിൽ ജീവിയെ സജീവമാക്കുന്ന ജീവനെ സൂചിപ്പിക്കുന്നു; ശരീരത്തിൽനിന്നു വേറിട്ട ഒരു അമൂർത്ത ‘ആത്മാവ്’ എന്ന ആശയം ഇവിടെ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: בָּשָׂר
  choice: ജഡം
  rationale: ആവർത്തിക്കുന്ന ‘എല്ലാ ജഡവും’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും നിയമഭാഷയുടെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: דָּם / דָּמוֹ
  choice: രക്തം / അതിന്റെ രക്തം
  rationale: വാക്യത്തിലെ നിരോധനത്തിന്റെയും അതിന്റെ കാരണത്തിന്റെയും കേന്ദ്രപദമായതിനാൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: בְנַפְשׁוֹ
  choice: അതിന്റെ ജീവനിൽത്തന്നെ
  rationale: בְ എന്ന ഉപസർഗത്തിന്റെ ചുരുക്കമുള്ളതും അർത്ഥസാധ്യതയുള്ളതുമായ ഘടന പരമാവധി നിലനിർത്തുന്നു; രക്തവും ജീവനും തമ്മിലുള്ള ബന്ധം കൂടുതൽ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കുന്നില്ല.
- source_word: וָאֹמַר
  choice: അതുകൊണ്ട് ഞാൻ ... പറഞ്ഞു
  rationale: ജീവൻ-രക്ത ബന്ധത്തിൽനിന്ന് നിരോധനത്തിലേക്കുള്ള നിഗമനപരമായ നീക്കം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോട്
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ രൂപത്തിന്റെ ബന്ധം നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: לֹא תֹאכֵלוּ
  choice: നിങ്ങൾ ഭക്ഷിക്കരുത്
  rationale: നിയമപരമായ നേരിട്ടുള്ള നിരോധനം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֹכְלָיו
  choice: അതു ഭക്ഷിക്കുന്ന ഏവനും
  rationale: പങ്കാളിവാചകത്തിന്റെ പൊതുവായ, ഓരോ വ്യക്തിക്കും ബാധകമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: יִכָּרֵת
  choice: ഛേദിക്കപ്പെടും
  rationale: ശിക്ഷയുടെ രീതി മരണമോ സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലോ ദൈവിക ന്യായവിധിയോ എന്നു മുൻകൂട്ടി നിർണയിക്കാതെ ഉടമ്പടി-ശിക്ഷാസൂത്രത്തിന്റെ രൂപവും ഭാരവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: രക്തവുമായി ബന്ധപ്പെട്ട נֶפֶשׁ എന്ന പദത്തിന്റെ അർത്ഥം
  choice: ‘ജീവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി; ജീവിയുടെ ജീവനും രക്തവും തമ്മിലുള്ള അടുപ്പമുള്ള ബന്ധം പ്രകടമാക്കുന്നു.
  alternative: കൂടുതൽ അധിഭൗതിക അർത്ഥത്തിലുള്ള ‘ആത്മാവ്’
  rationale: വാക്യത്തിന്റെ വാദം രക്തനിരോധനത്തെ ജീവൻ-രക്ത ബന്ധത്തിൽ ആധാരപ്പെടുത്തുന്നു; വികസിതമായ ആത്മശരീര സിദ്ധാന്തം ഇവിടെ ഇറക്കുമതി ചെയ്യരുത്.
- issue: יִכָּרֵת എന്ന ശിക്ഷാസൂത്രത്തിന്റെ വ്യാപ്തി
  choice: ‘ഛേദിക്കപ്പെടും’ എന്ന തുറന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: കൊല്ലപ്പെടും; സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടും; നീക്കിക്കളയപ്പെടും
  rationale: എബ്രായ സൂത്രവാക്യം വിവിധ സന്ദർഭങ്ങളിൽ ഉടമ്പടി ന്യായവിധിയുടെ വ്യത്യസ്ത രീതികളെ ഉൾക്കൊള്ളാം; ഈ വാക്യം വ്യക്തമാക്കാത്ത രീതി പരിഭാഷ നിർണയിക്കുന്നില്ല.
- issue: דָּמוֹ בְנַפְשׁוֹ הוּא എന്ന ആദ്യവാക്യഭാഗത്തിന്റെ ബന്ധം
  choice: ‘അതിന്റെ രക്തമാണ്; അതിന്റെ ജീവനിൽത്തന്നെയാണ് അത്’ എന്ന് ആവർത്തനവും മുറുക്കമുള്ള ഘടനയും സൂക്ഷിച്ചു.
  alternative: ‘അതിന്റെ രക്തം തന്നെയാണ് അതിന്റെ ജീവൻ’ എന്ന് പൂർണമായി മിനുക്കിയ വ്യാഖ്യാനപരമായ രൂപം
  rationale: മൂലപാഠത്തിലെ അസാധാരണമായ ആവർത്തനവും בְ എന്ന ഉപസർഗത്തിന്റെ അർത്ഥസാധ്യതയും ഇല്ലാതാക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമഭാഷ ഉപയോഗിച്ചു. ‘ജഡം’, ‘ഛേദിക്കപ്പെടും’ എന്നീ പദങ്ങൾ മൂലത്തിലെ ആവർത്തനവും ഉടമ്പടി-ശിക്ഷാസൂത്രവും സംരക്ഷിക്കുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
