  terminology: “സ്വദേശി,” “അവിടെ പാർക്കുന്ന വിദേശി,” “അശുദ്ധൻ,” and “ശുദ്ധൻ” are suitable. The footnote accurately explains the resident sense of גֵּר. The purity terms retain their ritual sense in this legal context without importing moral guilt.
  issues:
