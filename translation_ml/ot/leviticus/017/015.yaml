id: LEV.17.15
reference: Leviticus 17:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: ml
  text: ചത്തുകിടന്ന മൃഗത്തിന്റെയോ മൃഗം കീറിപ്പറിച്ച മൃഗത്തിന്റെയോ മാംസം തിന്നുന്ന ഏതൊരാളും—അയാൾ സ്വദേശിയായാലും അവിടെ പാർക്കുന്ന വിദേശിയായാലും[a]—തന്റെ വസ്ത്രങ്ങൾ അലക്കി വെള്ളത്തിൽ കുളിക്കണം. അയാൾ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും; അതിനുശേഷം ശുദ്ധനാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“അവിടെ പാർക്കുന്ന വിദേശി”: എബ്രായപദം ഇസ്രായേല്യരുടെ ഇടയിൽ സ്ഥിരമായി താമസിക്കുന്ന അന്യദേശക്കാരനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ഏതൊരാൾ
  rationale: നിയമസന്ദർഭത്തിൽ ഈ പദം ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘ആത്മാവ്’ എന്ന വിവർത്തനം ഇവിടെ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കും.
- source_word: נְבֵלָה
  choice: ചത്തുകിടന്ന മൃഗത്തിന്റെ മാംസം
  rationale: ശരിയായ അറവിലൂടെയല്ലാതെ സ്വയം ചത്ത മൃഗത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ഭക്ഷിക്കുന്നതിനെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ‘മാംസം’ ചേർക്കുന്നത് ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: טְרֵפָה
  choice: കാട്ടുമൃഗം കടിച്ചുകീറിയ മൃഗത്തിന്റെ മാംസം
  rationale: ഇരപിടിയൻ മൃഗം ആക്രമിച്ചു കീറിയ മൃഗം എന്ന മൂലപദത്തിന്റെ ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בָּאֶזְרָח
  choice: സ്വദേശി
  rationale: ഇസ്രായേൽ സമൂഹത്തിലെ തദ്ദേശാംഗത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: בַגֵּר
  choice: അവിടെ പാർക്കുന്ന വിദേശി
  rationale: വഴിപോക്കനെയല്ല, സമൂഹത്തിനിടയിൽ താമസിക്കുന്ന അന്യദേശക്കാരനെയാണ് גֵּר സൂചിപ്പിക്കുന്നത്.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ അലക്കണം
  rationale: ആചാരപരമായ ശുദ്ധീകരണത്തിനുള്ള നിർദേശം ആധുനിക മലയാളത്തിൽ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: וְרָחַץ בַּמַּיִם
  choice: വെള്ളത്തിൽ കുളിക്കണം
  rationale: ശരീരം വെള്ളത്തിൽ കഴുകുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: സന്ധ്യവരെ അശുദ്ധനായിരിക്കും
  rationale: ധാർമിക കുറ്റത്തെക്കാൾ ആചാരപരമായ അശുദ്ധാവസ്ഥയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: וְטָהֵר
  choice: അതിനുശേഷം ശുദ്ധനാകും
  rationale: കഴുകലിനും നിശ്ചിത സമയത്തിനും ശേഷമുള്ള ആചാരപരമായ നിലമാറ്റത്തിന്റെ ക്രമം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധി-അശുദ്ധിയുടെ സ്വഭാവം
  choice: טָמֵא/טָהֵר എന്നിവയെ ‘അശുദ്ധൻ/ശുദ്ധൻ’ എന്ന് ആചാരപരമായ അർഥത്തിൽ വിവർത്തനം ചെയ്തു.
  alternative: ‘മലിനൻ/പരിശുദ്ധൻ’ അല്ലെങ്കിൽ ധാർമിക കുറ്റബോധം സൂചിപ്പിക്കുന്ന ഭാഷ
  rationale: ഈ വാക്യം ഭക്ഷണത്തെ തുടർന്നുണ്ടാകുന്ന താൽക്കാലിക ആചാരപരമായ നിലയെക്കുറിച്ചാണ്; വ്യക്തിയുടെ ധാർമിക ദുഷ്ടതയെക്കുറിച്ചുള്ള പ്രസ്താവനയല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള നിയമശൈലി. ദീർഘമായ എബ്രായ വ്യവസ്ഥാവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; വ്യവസ്ഥയും നിർദേശവും ഫലവും മാറ്റമില്ലാതെ നിലനിർത്തി.
