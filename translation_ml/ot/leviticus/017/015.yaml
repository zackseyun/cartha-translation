    issue: “കാട്ടുമൃഗം” adds a restriction to טְרֵפָה.
    rationale: The source term concerns an animal that has been torn; while tearing by beasts is the customary sense, “wild animal” is more specific than the Hebrew wording. Replacing it with “മൃഗം കീറിപ്പറിച്ച” preserves the sense without that added limitation.
