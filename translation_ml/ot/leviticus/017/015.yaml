  source_fidelity: The draft correctly represents the legal subject, the two animal categories, the inclusion of both the native and the resident outsider, the required washing, and the temporary ritual-impurity sequence. However, “കാട്ടുമൃഗം” narrows טְרֵפָה by specifying a wild animal; the Hebrew denotes an animal torn, conventionally understood as torn by beasts, without requiring that added qualification.
