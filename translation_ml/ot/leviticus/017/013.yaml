  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളിൽ ആരെങ്കിലും, അല്ലെങ്കിൽ അവരുടെ ഇടയിൽ പാർക്കുന്ന പരദേശി[a], ഭക്ഷിക്കാവുന്ന വന്യമൃഗത്തെയോ പക്ഷിയെയോ വേട്ടയാടിപ്പിടിച്ചാൽ, അവൻ അതിന്റെ രക്തം ഒഴുക്കിക്കളഞ്ഞ് ആ രക്തം മണ്ണുകൊണ്ട് മൂടണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവരുടെ ഇടയിൽ വസിക്കുന്ന വിദേശി.” എബ്രായത്തിലെ ഗേർ സമൂഹത്തിനുള്ളിൽ താമസിക്കുന്ന ഇസ്രായേലേതരനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, “അതിനെ മണ്ണുകൊണ്ട് മൂടണം.” സർവനാമം ഏറ്റവും സ്വാഭാവികമായി മുമ്പ് പറഞ്ഞ രക്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: ഒരുവൻ
  rationale: ആവർത്തിച്ച אִישׁ നൽകുന്ന വിതരണാർഥം (‘ആരെങ്കിലും/ഓരോരുത്തനും’) നിയമവാക്യത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽ
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബ-ഉടമ്പടി പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ശൈലിയിൽ പരിചിതമായ വിവർത്തനം.
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: അവരുടെ ഇടയിൽ പാർക്കുന്ന പരദേശി
  rationale: גֵּר സൂചിപ്പിക്കുന്ന സമൂഹത്തിനുള്ളിൽ താമസിക്കുന്ന ഇസ്രായേലേതരനെ ‘പരദേശി’ എന്നു നൽകുകയും അനുബന്ധ ക്രിയയുടെ താമസാർഥം ‘പാർക്കുന്ന’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יָצוּד צֵיד
  choice: വേട്ടയാടിപ്പിടിച്ചാൽ
  rationale: സജാതീയ ക്രിയ-നാമ ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും വേട്ടയും പിടിത്തവും ഉൾക്കൊള്ളുന്ന അർഥം സൂക്ഷിക്കുന്നു.
- source_word: חַיָּה אוֹ עוֹף
  choice: വന്യമൃഗത്തെയോ പക്ഷിയെയോ
  rationale: വേട്ടയുടെ സന്ദർഭത്തിൽ חַיָּה വന്യമൃഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; עוֹף സ്വാഭാവികമായി ‘പക്ഷി’ എന്നാണ്.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: ഭക്ഷിക്കാവുന്ന
  rationale: നിഫാൽ രൂപത്തിന്റെ അനുവദനീയത/ഭക്ഷ്യയോഗ്യത എന്ന സന്ദർഭാർഥം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: וְשָׁפַךְ אֶת־דָּמוֹ
  choice: അതിന്റെ രക്തം ഒഴുക്കിക്കളഞ്ഞ്
  rationale: നിയമപരമായ നിർദേശം മലയാളത്തിലെ ‘മൂടണം’ എന്ന മുഖ്യ നിർദേശത്തോടു ചേർത്ത് ക്രിയാശൃംഖലയായി നൽകുന്നു; പ്രത്യയം വേട്ടമൃഗത്തെയോ പക്ഷിയെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിന്റെ രക്തം’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: മണ്ണുകൊണ്ട് മൂടണം
  rationale: עָפָר എന്നത് ഇവിടെ പൊടി/അയഞ്ഞ മണ്ണ് എന്ന പരിധിയുള്ളതാണ്; ആചാരപ്രവൃത്തിയുടെ സന്ദർഭത്തിൽ ‘മണ്ണ്’ സ്വാഭാവികമാണ്. മലയാളത്തിൽ അടുത്തുള്ള ‘രക്തം’ തന്നെയാണ് മറഞ്ഞ കർമമായി ഏറ്റവും സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നത്.
theological_decisions:
- issue: וְכִסָּהוּ എന്നതിലെ പ്രത്യയത്തിന്റെ സൂചിതവസ്തു
  choice: മൂടേണ്ടത് രക്തം
  alternative: മൃഗത്തെയോ പക്ഷിയെയോ മൂടുക/കുഴിച്ചിടുക
  rationale: ഏറ്റവും അടുത്ത മുൻപദം ‘അതിന്റെ രക്തം’ ആണ്; ലേവ്യപുസ്തകം 17-ലെ രക്തകേന്ദ്രിത സന്ദർഭവും ഈ വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും മൂലത്തിലെ സർവനാമരൂപം പോലെ മലയാളത്തിലും കർമം വീണ്ടും പേരെടുത്തുപറയാതെ വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും നിയമഗ്രന്ഥത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. അനാവശ്യ സംസ്കൃതഭാരം ഒഴിവാക്കി; ‘ഇസ്രായേൽമക്കൾ’, ‘പരദേശി’ എന്നീ ബൈബിൾ-നിയമപരമായി പരിചിതമായ പദങ്ങൾ നിലനിർത്തി.
