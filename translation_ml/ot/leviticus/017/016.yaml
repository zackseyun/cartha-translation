review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the conditional contrast, the implied laundering of garments, bodily washing, and the unresolved legal sense of bearing one's עָוֹן. A small revision better reflects the implied plural garment object and the Hebrew's consequence clause.
  naturalness: ‘തന്റെ ശരീരം കുളിക്കുക’ is not idiomatic modern Malayalam, since one normally bathes oneself rather than ‘bathing one’s body.’ ‘ശരീരം കഴുകുക’ is natural and accurate in this ritual context. The plural ‘വസ്ത്രങ്ങൾ’ is also preferable for the contextually supplied object.
  terminology: ‘അലക്കുക’ appropriately renders laundering garments. ‘ശരീരം കഴുകുക’ accurately renders washing one’s flesh/body. ‘തന്റെ കുറ്റം വഹിക്കേണ്ടിവരും’ retains the legal ambiguity of עָוֹן while expressing the stated consequence without specifying a penalty.
  issues:
  - severity: medium
    issue: ‘തന്റെ ശരീരം കുളിക്കുകയും’ is idiomatically awkward.
    rationale: Malayalam uses ‘കുളിക്കുക’ chiefly intransitively for a person; with ‘ശരീരം’ as the object, ‘കഴുകുക’ is the natural formulation and directly reflects רחץ.
  - severity: low
    issue: The supplied garment object is singular (‘വസ്ത്രം’).
    rationale: Although the object is ellipsed in this verse, the immediately preceding context supplies plural garments; ‘വസ്ത്രങ്ങൾ’ better conveys that contextual implication.
  revised_text: എന്നാൽ അവൻ തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും ശരീരം കഴുകുകയും ചെയ്യാതിരുന്നാൽ, അവൻ തന്റെ കുറ്റം വഹിക്കേണ്ടിവരും.[a]
  revised_footnotes:
