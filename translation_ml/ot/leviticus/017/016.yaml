reference: Leviticus 17:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א יְכַבֵּ֔ס וּ/בְשָׂר֖/וֹ לֹ֣א יִרְחָ֑ץ וְ/נָשָׂ֖א עֲוֺנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/016.yaml
  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: ml
  text: എന്നാൽ അവൻ തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും ശരീരം കഴുകുകയും ചെയ്യാതിരുന്നാൽ, അവൻ തന്റെ കുറ്റം വഹിക്കേണ്ടിവരും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ കുറ്റം വഹിക്കേണ്ടിവരും’ എന്ന ഹീബ്രു നിയമപ്രയോഗത്തിന് ‘തന്റെ അകൃത്യം വഹിക്കേണ്ടിവരും’ എന്നോ ‘തന്റെ കുറ്റത്തിനുള്ള ശിക്ഷ വഹിക്കേണ്ടിവരും’ എന്നോ അർഥമാകാം; അത് കുറ്റത്തെയും അതിന്റെ പരിണതഫലത്തെയും ഉൾക്കൊള്ളാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ ശുദ്ധീകരണനടപടിക്കു വിരുദ്ധമായ സാഹചര്യം ഈ സംയോജക-വ്യവസ്ഥ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എന്നാൽ ... എങ്കിൽ’ ആ വ്യത്യാസവും വ്യവസ്ഥയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְכַבֵּס
  choice: തന്റെ വസ്ത്രം അലക്കുക
  rationale: כּבס എന്ന ക്രിയയുടെ പിയേൽ രൂപം സാധാരണയായി വസ്ത്രം അലക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ കർമം ഒഴിവാക്കിയിട്ടുണ്ടെങ്കിലും മുൻവാക്യവും ക്രിയയുടെ പ്രയോഗവും ‘തന്റെ വസ്ത്രം’ എന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וּבְשָׂרוֹ
  choice: തന്റെ ശരീരം
  rationale: בשר അക്ഷരാർഥത്തിൽ ‘മാംസം’ ആണെങ്കിലും ആചാരപരമായ കഴുകൽസന്ദർഭത്തിൽ വ്യക്തിയുടെ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘ശരീരം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יִרְחָץ
  choice: കുളിക്കുക
  rationale: רחץ ഇവിടെ ശരീരം വെള്ളത്തിൽ കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കുളിക്കുക’ എന്നത് വസ്ത്രം അലക്കുന്നതിൽനിന്ന് ഈ പ്രവൃത്തിയെ വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: וְנָשָׂא
  choice: വഹിക്കണം
  rationale: വ്യവസ്ഥ പാലിക്കാതിരിക്കുന്നതിന്റെ നിയമപരമായ പരിണതഫലമാണ് വാവ് + ഖാതൽ ഇവിടെ അറിയിക്കുന്നത്; ‘വഹിക്കണം’ നിയമഭാഷയുടെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: עֲוֹנוֹ
  choice: തന്റെ കുറ്റം
  rationale: עון കുറ്റം, കുറ്റബാധ്യത, അതിന്റെ ശിക്ഷാഫലം എന്നിവ ഉൾക്കൊള്ളാൻ കഴിയും. ‘തന്റെ കുറ്റം വഹിക്കണം’ എന്നത് അർഥവ്യാപ്തി ചുരുക്കാതെ ഹീബ്രു നിയമപ്രയോഗത്തെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘തന്റെ עון വഹിക്കുക’ എന്ന നിയമപ്രയോഗത്തിന്റെ അർഥം
  choice: ‘തന്റെ കുറ്റം വഹിക്കണം’ എന്ന് പരിഭാഷപ്പെടുത്തി, കൃത്യമായ ശിക്ഷ വ്യക്തമാക്കിയിട്ടില്ല.
  alternative: ‘തന്റെ അകൃത്യം വഹിക്കണം’ അല്ലെങ്കിൽ ‘തന്റെ കുറ്റത്തിനുള്ള ശിക്ഷ വഹിക്കണം’
  rationale: ഹീബ്രു പ്രയോഗത്തിന് കുറ്റാവസ്ഥയെയും അതിന്റെ പരിണതഫലത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കാനാകും. പരിഭാഷ അതിനെ ധാർമ്മിക കുറ്റം മാത്രമായോ വ്യക്തമായ ശിക്ഷ മാത്രമായോ പരിമിതപ്പെടുത്താതെ ആ അർഥപിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. വസ്ത്രം അലക്കുന്നതും ശരീരം കുളിക്കുന്നതും സമാന്തരമായി അവതരിപ്പിക്കുന്നു; നിയമപ്രയോഗത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
