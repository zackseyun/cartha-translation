revisions:
- from: എന്നാൽ അവൻ തന്റെ വസ്ത്രം അലക്കുകയും തന്റെ ശരീരം കുളിക്കുകയും ചെയ്യാതിരുന്നാൽ, അവൻ തന്റെ കുറ്റം വഹിക്കണം.[a]
  to: എന്നാൽ അവൻ തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും ശരീരം കഴുകുകയും ചെയ്യാതിരുന്നാൽ, അവൻ തന്റെ കുറ്റം വഹിക്കേണ്ടിവരും.[a]
  rationale: The revision replaces an awkward bodily-bathing construction with idiomatic ‘ശരീരം കഴുകുക,’ uses the contextually implied plural ‘വസ്ത്രങ്ങൾ,’ and uses a consequence-oriented Malayalam form for the legal result. The footnote continues to preserve the ambiguity between guilt/iniquity and its penal consequence.
