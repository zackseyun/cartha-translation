id: LEV.17.2
reference: Leviticus 17:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵי/הֶ֑ם זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: ml
  text: 'അഹരോനോടും അവന്റെ പുത്രന്മാരോടും ഇസ്രായേൽമക്കളായ എല്ലാവരോടും സംസാരിക്ക; അവരോടു പറയുക: ‘യാഹ്‌വേ കൽപിച്ച കാര്യം ഇതാണ്:’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: സംസാരിച്ച്
  rationale: പീയേൽ ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള കല്പന നിലനിർത്തുന്നു; തുടർന്നുള്ള וְאָמַרְתָּയുമായി സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: അഹരോന്റെ പുരുഷസന്തതികളായ പുരോഹിതപുത്രന്മാരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘മക്കൾ’ എന്ന വിശാല അർഥം ഒഴിവാക്കുന്നു.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേൽമക്കൾ
  rationale: പരമ്പരാഗത ജനവിഭാഗനാമത്തിന്റെ കുടുംബബന്ധ സൂചന സംരക്ഷിക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: അവരോടു പറയുക
  rationale: തുടർച്ചയായ കല്പനയുടെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു.
- source_word: זֶה הַדָּבָר
  choice: കാര്യം ഇതാണ്
  rationale: דָּבָר എന്നതിന് ‘വാക്ക്,’ ‘കാര്യം’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; ഇവിടെ തുടർന്ന് വരുന്ന നിയമകല്പനയെ പരിചയപ്പെടുത്തുന്നതിനാൽ ‘കാര്യം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: צִוָּה
  choice: കല്പിച്ച
  rationale: പൂർണ്ണക്രിയയുടെ അർഥം മലയാളത്തിലെ ഭൂതകാല വിശേഷണരൂപത്തിലൂടെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: ഉദ്ധരണി ആരംഭിക്കുന്ന വിരാമചിഹ്നത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഹീബ്രു സൂത്രവാക്യത്തിലെ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടകം മലയാളത്തിൽ അക്ഷരാർഥമായി ചേർത്താൽ അസ്വാഭാവികമാകും; തുടർന്നുള്ള നേരിട്ടുള്ള വചനത്തെ ഉദ്ധരണി സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ സംരക്ഷിക്കുന്നു.
- issue: בני ישראל എന്ന കുടുംബബന്ധമുള്ള ജനവിഭാഗനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധ സൂചന നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപം ഉപയോഗിക്കുന്നു.
- issue: זה הדבר എന്ന പ്രയോഗത്തിലെ דבר
  choice: കാര്യം
  alternative: വചനം
  rationale: നിയമനിർദേശം പരിചയപ്പെടുത്തുന്ന സന്ദർഭത്തിൽ ‘കാര്യം’ സ്വാഭാവികമാണ്; എങ്കിലും ‘വചനം’ എന്ന ശാബ്ദിക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രുവിലെ ഇരട്ട സംസാരസൂത്രം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ‘സംസാരിച്ച് ... പറയുക’ എന്നു ചേർത്തു; לֵאמֹר ഉദ്ധരണിവിരാമത്തിലൂടെ പ്രകടമാക്കി.
