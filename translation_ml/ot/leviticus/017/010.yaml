source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֥ר יֹאכַ֖ל כָּל דָּ֑ם וְ/נָתַתִּ֣י פָנַ֗/י בַּ/נֶּ֨פֶשׁ֙ הָ/אֹכֶ֣לֶת אֶת הַ/דָּ֔ם וְ/הִכְרַתִּ֥י אֹתָ֖/הּ מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: ml
  text: “ഇസ്രായേൽഗൃഹത്തിൽപ്പെട്ട ഒരാളോ അവരുടെ ഇടയിൽ വസിക്കുന്ന ഒരു പരദേശിയോ ഏതെങ്കിലും രക്തം കഴിച്ചാൽ, രക്തം കഴിക്കുന്ന ആ വ്യക്തിക്കെതിരെ ഞാൻ എന്റെ മുഖം തിരിക്കും; അവനെ അവന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിച്ചുകളയും.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിച്ചുകളയും” എന്നത് ഉടമ്പടി-ശിക്ഷയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ഇത് മരണമോ, സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലോ, മറ്റൊരു തരത്തിലുള്ള ദൈവിക ന്യായവിധിയോ ആണെന്ന് ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: ആരായാലും
  rationale: ആവർത്തിച്ചുള്ള אִישׁ אִישׁ എന്ന നിയമപ്രയോഗത്തിന്റെ വിതരണാത്മകമായ ‘ആരെങ്കിലും/ആരായാലും’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹത്തിൽപ്പെട്ടവർ
  rationale: ‘ഇസ്രായേൽഗൃഹം’ എന്ന ഉടമ്പടി-നിയമപരമായ ഹീബ്രു പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: അവരുടെ ഇടയിൽ വസിക്കുന്ന പരദേശികൾ
  rationale: גֵּר താൽക്കാലിക സന്ദർശകനെയല്ല, സമൂഹത്തിനുള്ളിൽ താമസിക്കുന്ന അന്യദേശക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വസിക്കുന്ന’ എന്നത് സമാനധാതുപ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: ഏതെങ്കിലും രക്തം ഭക്ഷിച്ചാൽ
  rationale: כָּל דָּם എന്ന സമ്പൂർണ നിരോധനം ‘ഏതെങ്കിലും രക്തം’ എന്ന് നൽകുന്നു; יֹאכַל എന്ന സാധാരണ ക്രിയയ്ക്ക് ‘ഭക്ഷിക്കുക’ നിലനിർത്തുന്നു.
- source_word: וְנָתַתִּי פָנַי
  choice: ഞാൻ എന്റെ മുഖം തിരിക്കും
  rationale: ദൈവിക എതിർപ്പിനെയും ന്യായവിധിയെയും സൂചിപ്പിക്കുന്ന മാനവരൂപക ഹീബ്രു പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; ‘എതിരെ’ എന്ന ഘടകം ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת
  choice: രക്തം ഭക്ഷിക്കുന്ന ആ വ്യക്തിക്കെതിരെ
  rationale: ഇവിടെ נֶפֶשׁ ശരീരത്തിൽനിന്ന് വേറിട്ട ‘ആത്മാവ്’ എന്നതല്ല, കുറ്റം ചെയ്യുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהִכְרַתִּי אֹתָהּ מִקֶּרֶב עַמָּהּ
  choice: അവനെ അവന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിച്ചുകളയും
  rationale: כרת എന്ന ഉടമ്പടി-ശിക്ഷാപ്രയോഗത്തിന്റെ രൂപകം സംരക്ഷിക്കുന്നു; മരണം, പുറത്താക്കൽ, അല്ലെങ്കിൽ നേരിട്ടുള്ള ദൈവിക ന്യായവിധി എന്നിങ്ങനെ അതിന്റെ കൃത്യമായ വിധം വാക്യം നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ‘ഛേദിച്ചുകളയും’ എന്ന ശിക്ഷാപ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം
  choice: വിധം നിർവചിക്കാതെ ‘ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിച്ചുകളയും’ എന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ‘കൊന്നുകളയും’, ‘സമൂഹത്തിൽനിന്ന് പുറത്താക്കും’, അല്ലെങ്കിൽ ‘ദൈവിക ന്യായവിധിയാൽ നീക്കും’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം കടുത്ത ഉടമ്പടി-ന്യായവിധി പ്രഖ്യാപിക്കുന്നുവെങ്കിലും അതിന്റെ പ്രാവർത്തികരൂപം ഇവിടെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനവിവാദം പരിഭാഷയിൽ തീർപ്പാക്കാതെ യഥാർഥമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ഹീബ്രുവിലെ ഉടമ്പടി-പ്രയോഗങ്ങളായ ‘ഇസ്രായേൽഗൃഹം’, ‘മുഖം തിരിക്കുക’, ‘ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കുക’ എന്നിവ വായനാസൗകര്യം നഷ്ടപ്പെടാതെ സംരക്ഷിച്ചു.
