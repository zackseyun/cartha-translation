  terminology: ‘ഇസ്രായേൽഗൃഹം,’ ‘പരദേശി,’ ‘മുഖം ...ക്കെതിരെ തിരിക്കുക,’ and ‘ഛേദിച്ചുകളയുക’ appropriately preserve the covenantal/legal register. The footnote properly avoids defining the disputed force of the cut-off formula.
