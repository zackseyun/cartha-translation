  - severity: low
    issue: ‘രക്തം ഭക്ഷിക്കുക’ is less idiomatic than ‘രക്തം കഴിക്കുക’ in contemporary Malayalam.
    rationale: The Hebrew verb is the ordinary verb for eating; ‘കഴിക്കുക’ is the normal modern Malayalam equivalent and does not weaken the prohibition.
