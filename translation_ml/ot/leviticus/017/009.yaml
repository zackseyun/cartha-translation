revisions:
- from: അത് യഹ്‌വേക്കു വഴിപാടായി അർപ്പിക്കാൻ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിലേക്കു കൊണ്ടുവരാതിരുന്നാൽ, ആ മനുഷ്യൻ തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടണം.[a][b]
  to: അത് യഹ്‌വേക്കു അർപ്പിക്കുന്നതിനായി സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കലേക്ക് കൊണ്ടുവരാതിരുന്നാൽ, ആ മനുഷ്യൻ തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും.[a][b]
