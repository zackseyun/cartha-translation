  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: ml
  text: അത് യഹ്‌വേക്കു അർപ്പിക്കുന്നതിനായി സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കലേക്ക് കൊണ്ടുവരാതിരുന്നാൽ, ആ മനുഷ്യൻ തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അത് യഹ്‌വേക്കായി ചെയ്യാൻ/ഉണ്ടാക്കാൻ’; ഇവിടെ ഈ എബ്രായ ശൈലി യാഗം അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘ഛേദിക്കപ്പെടും’ എന്നത് ഒരു നിയമസൂത്രമാണ്. ഇവിടെ ശിക്ഷയുടെ കൃത്യമായ രൂപം വ്യക്തമാക്കിയിട്ടില്ല; അത് ഉടമ്പടിസമൂഹത്തിൽനിന്നുള്ള നീക്കമോ നേരിട്ടുള്ള ദൈവികവിധിയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: പ്രവേശനകവാടം
  rationale: സമാഗമകൂടാരത്തിലേക്കുള്ള പ്രവേശനസ്ഥലം വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ മരുഭൂമിയിലെ വിശുദ്ധകൂടാരത്തിനുള്ള മലയാളത്തിൽ പരിചിതവും അർഥസുതാര്യവുമായ പ്രയോഗം.
- source_word: יְבִיאֶנּוּ
  choice: അത് ... കൊണ്ടുവരാതിരുന്നാൽ
  rationale: പ്രത്യയം മുൻസന്ദർഭത്തിലെ യാഗമൃഗത്തെ സൂചിപ്പിക്കുന്നു; വസ്തുവിനെക്കുറിച്ചുള്ള നിർദ്ദേശം നിലനിർത്തുന്നു.
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: യഹ്‌വേക്കു വഴിപാടായി അർപ്പിക്കാൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹ്‌വേക്കായി അതിനെ ചെയ്യാൻ/ഉണ്ടാക്കാൻ’ എന്നാണെങ്കിലും, യാഗസന്ദർഭത്തിൽ യാഗം അർപ്പിക്കുക എന്ന ആചാരപരമായ അർഥമാണ്; ‘വഴിപാടായി’ എന്നത് ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְנִכְרַת
  choice: ഛേദിക്കപ്പെടണം
  rationale: നിയമപരമായ ‘cut off’ സൂത്രവാക്യത്തിന്റെ രൂപകവും നിർവചിക്കപ്പെടാത്ത ശിക്ഷാസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: הָאִישׁ הַהוּא
  choice: ആ മനുഷ്യൻ
  rationale: എബ്രായത്തിലെ നിർദിഷ്ടമായ പുല്ലിംഗ ഏകവചന നിയമപ്രയോഗം കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מֵעַמָּיו
  choice: തന്റെ ജനത്തിൽനിന്ന്
  rationale: കുറ്റക്കാരൻ ഉൾപ്പെട്ട ജനസമൂഹത്തിൽനിന്നുള്ള വേർപെടുത്തൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ഛേദിക്കപ്പെടണം’ എന്ന ശിക്ഷയുടെ അർഥം
  choice: ശിക്ഷയുടെ കൃത്യമായ രീതി വ്യക്തമാക്കാതെ നിയമസൂത്രമായ ‘ഛേദിക്കപ്പെടണം’ നിലനിർത്തി.
  alternative: കൊല്ലപ്പെടണം; സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടണം; നശിപ്പിക്കപ്പെടണം
  rationale: ഈ വാക്യത്തിലെ എബ്രായപ്രയോഗം ശിക്ഷയുടെ പ്രവർത്തനരീതി നിർവചിക്കുന്നില്ല; അതിനാൽ മരണം, സമൂഹഭ്രഷ്ട്, അല്ലെങ്കിൽ നേരിട്ടുള്ള ദൈവികവിധി എന്നിവയിൽ ഒന്നായി ചുരുക്കുന്നില്ല.
- issue: הָאִישׁ എന്നതിന്റെ ലിംഗപ്രകടനം
  choice: ആ മനുഷ്യൻ
  alternative: ആ വ്യക്തി; അങ്ങനെ ചെയ്യുന്നവൻ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചന നിയമഭാഷ മറച്ചുവയ്ക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആചാര ശൈലി. ‘സമാഗമകൂടാരം’ പോലുള്ള പരിചിത ബൈബിൾ പദാവലി നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സുഗമമാക്കി; ദൈവനാമം ‘യഹ്‌വേ’ എന്നു നൽകി.
