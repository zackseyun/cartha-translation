    text: എബ്രായത്തിൽ ‘പുരുഷൻ, പുരുഷൻ’ എന്ന ആവർത്തിച്ച പുരുഷലിംഗ നിയമപ്രയോഗമാണ്; ഓരോ വ്യക്തിഗത സംഭവത്തെയും ഉൾക്കൊള്ളുന്ന ‘ഏതൊരു പുരുഷനും’ എന്ന അർഥം അതിനുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘താമസക്കാരനായ വിദേശി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇസ്രായേല്യരുടെ ഇടയിൽ താമസിക്കുന്ന ഇസ്രായേല്യനല്ലാത്ത ഒരാളെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
