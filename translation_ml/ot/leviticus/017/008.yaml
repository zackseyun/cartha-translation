source:
  edition: WLC
  text: וַ/אֲלֵ/הֶ֣ם תֹּאמַ֔ר אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל וּ/מִן הַ/גֵּ֖ר אֲשֶׁר יָג֣וּר בְּ/תוֹכָ֑/ם אֲשֶׁר יַעֲלֶ֥ה עֹלָ֖ה אוֹ זָֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: ml
  text: 'നീ അവരോടു പറയുക: ഇസ്രായേൽഗൃഹത്തിൽപ്പെട്ടവരിലോ അവരുടെ ഇടയിൽ പാർക്കുന്ന പരദേശികളിലോ ഉള്ള ഏതൊരു പുരുഷൻ ഹോമയാഗമോ യാഗമോ അർപ്പിക്കുന്നുവെങ്കിൽ—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: നീ അവരോടു പറയേണ്ടത്
  rationale: സംയോജകത്തിന്റെ തുടർച്ചയും മോശെയോടുള്ള നിർദേശത്തിന്റെ ബലവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ אִישׁ
  choice: ഏതൊരു പുരുഷനോ
  rationale: ആവർത്തിച്ചിരിക്കുന്ന പുരുഷലിംഗ ഏകവചന നിയമപ്രയോഗത്തിന്റെ വിതരണാർഥം ‘ഏതൊരു’ കൊണ്ടും അതിന്റെ ലിംഗസൂചന ‘പുരുഷൻ’ കൊണ്ടും സംരക്ഷിക്കുന്നു.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹത്തിൽപ്പെട്ട
  rationale: ‘ഇസ്രായേൽഗൃഹം’ എന്ന ഉടമ്പടിസംബന്ധമായ പ്രയോഗം ചുരുക്കാതെ നിലനിർത്തുകയും מִן എന്ന അംഗത്വ/ഉത്ഭവബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: അവരുടെ ഇടയിൽ പാർക്കുന്ന പരദേശിയോ
  rationale: גֵּר എന്നത് ഇസ്രായേല്യരല്ലാത്ത, എന്നാൽ അവരുടെ സമൂഹത്തിൽ താമസിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘പരദേശി’ നിയമ-സാമൂഹിക വ്യത്യാസം നിലനിർത്തുന്നു, ബന്ധവാക്യം സ്ഥിരതാമസത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יַעֲלֶה
  choice: അർപ്പിച്ചിട്ട്
  rationale: യാഗസന്ദർഭത്തിൽ ഹിഫ്ഈൽ രൂപം ‘യാഗമായി അർപ്പിക്കുക’ എന്നാണ്; വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ മലയാളത്തിലെ അപൂർണ്ണ തുടർച്ചയും ഡാഷും ഉപയോഗിച്ചു.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: പൂർണമായി ദഹിപ്പിക്കപ്പെടുന്ന യാഗത്തിനുള്ള സ്ഥാപിതവും വ്യക്തവുമായ മലയാള പദമാണ്.
- source_word: אוֹ זָבַח
  choice: മറ്റൊരു യാഗമോ
  rationale: עֹלָהയുമായി വൈരുധ്യത്തിൽ ഇവിടെ זֶבַח പൊതുവായ അറുക്കപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘മറ്റൊരു’ എന്നത് ഹോമയാഗവും വിശാലാർഥത്തിൽ യാഗമാണെന്ന മലയാളത്തിലെ അനാവശ്യ ആവർത്തനഭ്രമം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: אִישׁ אִישׁ എന്ന പുരുഷലിംഗ വിതരണപ്രയോഗം
  choice: ഏതൊരു പുരുഷനോ
  alternative: ആരെങ്കിലുമോ / ഏതൊരു വ്യക്തിയോ
  rationale: എബ്രായ നിയമശൈലിയിലെ വിതരണാർഥവും വ്യാകരണപരമായ പുരുഷലിംഗ സൂചനയും ഒരുപോലെ നിലനിർത്തുന്നു; അതിനെ ലിംഗനിരപേക്ഷമാക്കി മൗനമായി മാറ്റുന്നില്ല.
- issue: גֵּר എന്ന സാമൂഹിക-നിയമ വിഭാഗം
  choice: പരദേശി
  alternative: താമസക്കാരനായ വിദേശി / അന്യൻ
  rationale: ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുകയും അതിന്റെ ആരാധനാനിയമങ്ങൾക്ക് വിധേയനാകുകയും ചെയ്യുന്ന ഇസ്രായേല്യനല്ലാത്ത ആളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘പരദേശി’ ആ വ്യത്യാസം സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിയമ-ആരാധനാഭാഷ ഉപയോഗിച്ചു. മൂലവാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ഡാഷ് നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
