source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּ֣גַע בְּ/עֽוֹר הַ֠/בָּשָׂר וְ/שֵׂעָ֨ר בַּ/נֶּ֜גַע הָפַ֣ךְ לָבָ֗ן וּ/מַרְאֵ֤ה הַ/נֶּ֨גַע֙ עָמֹק֙ מֵ/ע֣וֹר בְּשָׂר֔/וֹ נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן וְ/טִמֵּ֥א אֹתֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: ml
  text: പുരോഹിതൻ ശരീരത്തിന്റെ ത്വക്കിലുള്ള രോഗബാധിതമായ പാട് പരിശോധിക്കണം. ആ പാടിലെ രോമം വെളുത്തതായി മാറുകയും പാട് ശരീരത്തിന്റെ ത്വക്കിനെക്കാൾ ആഴത്തിലേക്ക് ഇറങ്ങിയതായി കാണപ്പെടുകയും ചെയ്താൽ, അത് ത്വഗ്രോഗത്തിന്റെ പാടാണ്[a]. പുരോഹിതൻ അത് പരിശോധിച്ച് അയാളെ അശുദ്ധനാണെന്ന് പ്രഖ്യാപിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: “കുഷ്ഠരോഗത്തിന്റെ പാട്” അല്ലെങ്കിൽ “കുഷ്ഠബാധ.” എബ്രായത്തിലെ צָרַעַת എന്ന പദം ആധുനിക കുഷ്ഠരോഗത്തെ (ഹാൻസൻ രോഗം) മാത്രം സൂചിപ്പിക്കുന്നതല്ല; അതിനേക്കാൾ വിശാലമായ ഒരു വിഭാഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: രോഗബാധിതമായ പാട്
  rationale: പുരോഹിതൻ പരിശോധിക്കുന്ന, ത്വക്കിൽ ദൃശ്യമായ ബാധിത പ്രദേശത്തെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ‘ബാധ’ എന്നതിനെക്കാൾ ‘രോഗബാധിതമായ പാട്’ ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: בְּעוֹר הַבָּשָׂר
  choice: ശരീരത്തിന്റെ ത്വക്കിലുള്ള
  rationale: עוֹר എന്നത് ‘ത്വക്ക്’, בָּשָׂר ഇവിടെ ശരീരം എന്ന ശാരീരിക അർഥം നൽകുന്നു; സ്വാഭാവിക മലയാളക്രമത്തിൽ സ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: שֵׂעָר
  choice: രോമം
  rationale: ത്വക്കിലെ രോമത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മുടി’ എന്നതിനെക്കാൾ ‘രോമം’ കൃത്യമാണ്.
- source_word: הָפַךְ לָבָן
  choice: വെളുത്തതായി മാറുക
  rationale: നിറമാറ്റം സംഭവിച്ച് ഇപ്പോൾ കാണപ്പെടുന്ന ഫലാവസ്ഥയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַרְאֵה
  choice: രൂപം
  rationale: പരിശോധനയിൽ കാണുന്ന ദൃശ്യാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘കാഴ്ച’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: ശരീരത്തിന്റെ ത്വക്കിനെക്കാൾ ആഴമുള്ളതായി കാണപ്പെടുക
  rationale: മൂലത്തിലെ താരതമ്യവും ദൃശ്യപ്രതീതിയും നിലനിർത്തുന്നു; പാട് ചുറ്റുമുള്ള ത്വക്കിന്റെ നിലയേക്കാൾ താഴ്ന്നതായി തോന്നുന്നതാണ് വിവരണം.
- source_word: נֶגַע צָרַעַת
  choice: ത്വഗ്രോഗത്തിന്റെ പാട്
  rationale: രണ്ടു നാമങ്ങളെയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രതിനിധീകരിക്കുന്നു; צָרַעַת-നെ ആധുനിക ഹാൻസൻ രോഗവുമായി മാത്രം സമീകരിക്കുന്നില്ല.
- source_word: וְרָאָהוּ
  choice: പുരോഹിതൻ അയാളെ പരിശോധിച്ചശേഷം
  rationale: സന്ദർഭത്തിൽ പ്രത്യയം പരിശോധനയ്ക്കു വിധേയനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; പരിശോധനയ്ക്കു പിന്നാലെയുള്ള വിധിപ്രഖ്യാപനത്തിന്റെ ക്രമവും വ്യക്തമാക്കുന്നു.
- source_word: וְטִמֵּא אֹתוֹ
  choice: അയാൾ അശുദ്ധനാണെന്ന് പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതൻ അശുദ്ധി സൃഷ്ടിക്കുന്നു എന്നതല്ല, ആചാരപരമായ നില ഔദ്യോഗികമായി വിധിച്ചു പ്രഖ്യാപിക്കുന്നു എന്ന നിയമപരമായ ബലം നൽകുന്നു.
theological_decisions:
- issue: ലേവ്യ ശുദ്ധിനിയമത്തിൽ צָרַעַת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ത്വഗ്രോഗം
  alternative: കുഷ്ഠരോഗം
  rationale: ഈ എബ്രായപദം ആധുനിക ഹാൻസൻ രോഗത്തേക്കാൾ വിശാലമായ പുരാതന ആചാരപരിശോധനാവർഗത്തെ സൂചിപ്പിക്കുന്നു. അതിനാൽ തെറ്റായ വൈദ്യശാസ്ത്രപരമായ കൃത്യത ഒഴിവാക്കുന്നു; പരമ്പരാഗത പരിഭാഷ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: וְטִמֵּא אֹתוֹ എന്നതിലെ പുരോഹിതന്റെ പ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: അശുദ്ധനാണെന്ന് പ്രഖ്യാപിക്കുക
  alternative: അശുദ്ധനാക്കുക
  rationale: പുരോഹിതൻ വ്യക്തിയിൽ അശുദ്ധി ഉണ്ടാക്കുന്നു എന്ന ധ്വനി ഒഴിവാക്കി, പരിശോധനയെ അടിസ്ഥാനമാക്കി ആചാരപരമായ നില വിധിച്ചു പ്രസ്താവിക്കുന്നതായി അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമ-വിവരണ ശൈലി. ‘ത്വഗ്രോഗം’ പുരാതന രോഗവർഗത്തിന്റെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു; ‘അശുദ്ധനാണെന്ന് പ്രഖ്യാപിക്കുക’ ആചാരപരമായ വിധിയെ വ്യക്തമാക്കുന്നു.
