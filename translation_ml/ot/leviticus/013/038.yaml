  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: ml
  text: ഒരു പുരുഷന്റെയോ സ്ത്രീയുടെയോ ശരീരത്തിന്റെ ത്വക്കിൽ തിളക്കമുള്ള പാടുകൾ—വെളുത്ത തിളക്കമുള്ള പാടുകൾ[a]—ഉണ്ടായാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തിളങ്ങുന്ന വെളുത്ത പാടുകൾ.’
    reason: בֶּהָרֹת לְבָנֹת എന്ന പദസമുച്ചയത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു മലയാള പദക്രമം നൽകുന്നു.
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: ഒരു പുരുഷന്റെയോ സ്ത്രീയുടെയോ
  rationale: രണ്ടു ലിംഗങ്ങളെയും മൂലപാഠം വ്യക്തമായി പരാമർശിക്കുന്നു. ലേവ്യപുസ്തകത്തിലെ വ്യവസ്ഥാപരമായ ശൈലിക്ക് യോജിക്കുന്ന വിധത്തിൽ അനിശ്ചിത ഏകവചനരൂപം നിലനിർത്തുന്നു.
- source_word: כִּי יִהְיֶה
  choice: ഉണ്ടായാൽ
  rationale: രോഗനിർണയപരമായ ഈ നിയമസന്ദർഭത്തിൽ כִּי ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ വ്യവസ്ഥാസൂചകമായ ‘ഉണ്ടായാൽ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בְּעוֹר בְּשָׂרָם
  choice: ശരീരത്തിന്റെ ത്വക്കിൽ
  rationale: עוֹר എന്നത് ‘ത്വക്ക്’ എന്നും בָּשָׂר ഇവിടെ വ്യക്തിയുടെ ശരീരം എന്നും സൂചിപ്പിക്കുന്നു. ശരീരത്തിലെ സ്ഥാനം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בֶּהָרֹת
  choice: തിളക്കമുള്ള പാടുകൾ
  rationale: ഈ ത്വക്ക്‌രോഗനിർണയസന്ദർഭത്തിൽ ഇളംനിറമുള്ളതോ തിളക്കമുള്ളതോ ആയ അടയാളങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
- source_word: בֶּהָרֹת לְבָנֹת
  choice: വെളുത്ത തിളക്കമുള്ള പാടുകൾ
  rationale: לְבָנֹת പാടുകളുടെ നിറം വെളുപ്പാണെന്ന് വ്യക്തമാക്കുന്നു. ആവർത്തിച്ചിരിക്കുന്ന בֶּהָרֹת എന്ന പദവും രോഗനിർണയത്തിലെ സൂക്ഷ്മതയും പരിഭാഷയിൽ നിലനിർത്തുന്നു.
