  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമ-രോഗനിർണയ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തനം ഡാഷുകൾ ഉപയോഗിച്ച് നിലനിർത്തിയിരിക്കുന്നു; വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ ചേർത്തിരിക്കുന്നു.
