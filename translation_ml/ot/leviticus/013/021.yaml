  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമപരവും വൈദികവുമായ നടപടിക്രമത്തിന്റെ കൃത്യത നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കി.
