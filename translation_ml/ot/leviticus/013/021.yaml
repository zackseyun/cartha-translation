  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בָּ/הּ֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣יא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: ml
  text: എന്നാൽ പുരോഹിതൻ അതു പരിശോധിക്കുമ്പോൾ[a], അതിൽ വെളുത്ത രോമമില്ലെന്നും, അതു ത്വക്കിനേക്കാൾ കുഴിഞ്ഞതല്ലെന്നും, അതു മങ്ങിയതുമാണെന്നും കണ്ടാൽ, പുരോഹിതൻ ആ വ്യക്തിയെ ഏഴു ദിവസത്തേക്ക് വേർതിരിച്ചു പാർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുരോഹിതൻ അതു നോക്കുമ്പോൾ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കാണുക’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് പരിശോധനയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... കണ്ടാൽ
  rationale: മുൻപുള്ള രോഗനിർണയസാഹചര്യത്തോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്ന സോപാധിക പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִרְאֶנָּה
  choice: അതു പരിശോധിക്കുമ്പോൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘കാണുക’ എന്നാണെങ്കിലും, പുരോഹിതന്റെ ഔദ്യോഗിക നിരീക്ഷണസന്ദർഭത്തിൽ ‘പരിശോധിക്കുക’ എന്നത് ഉദ്ദേശ്യം കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ ഔദ്യോഗിക പരിശോധന നടത്തുന്ന വ്യക്തിക്കുള്ള പതിവും വ്യക്തവുമായ പരിഭാഷ.
- source_word: וְהִנֵּה
  choice: '...എന്നും ...എന്നും ...എന്നും കണ്ടാൽ'
  rationale: ഹീബ്രു നിരീക്ഷണസൂത്രത്തിന്റെ ശ്രദ്ധക്ഷണിക്കുന്ന ഭാവം മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ ഉൾക്കൊള്ളിക്കുന്നു; പ്രത്യേകം ‘ഇതാ’ എന്നു ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമായി തോന്നും.
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: അതിൽ വെളുത്ത രോമം ഇല്ലെന്നും
  rationale: ബാധിതമായ അടയാളത്തിനുള്ളിൽ വെളുത്ത രോമമില്ലെന്ന രോഗനിർണയമാനദണ്ഡം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: അതു ത്വക്കിനെക്കാൾ കുഴിഞ്ഞിട്ടില്ലെന്നും
  rationale: ശബ്ദാർഥമായ ‘താഴ്ന്നത്’ ഈ ത്വക്‌പരിശോധനാസന്ദർഭത്തിൽ ഉപരിതലത്തേക്കാൾ കുഴിഞ്ഞോ താഴ്ന്നോ കാണപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְהִיא כֵהָה
  choice: അതിന്റെ നിറം മങ്ങിയിരിക്കുന്നെന്നും
  rationale: כֵהָה സൂചിപ്പിക്കുന്ന മങ്ങിയതോ തെളിച്ചം കുറഞ്ഞതോ ആയ ദൃശ്യാവസ്ഥ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהִסְגִּירוֹ
  choice: ആ വ്യക്തിയെ ... വേർതിരിച്ചു പാർപ്പിക്കണം
  rationale: പുരുഷ ഏകവചന പ്രത്യയം പാടിനെയല്ല, പരിശോധിക്കപ്പെടുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ക്രിയ നിരീക്ഷണത്തിനായി ഒറ്റപ്പെടുത്തി പാർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ക്വാറന്റൈനിൽ ഇടുക’ എന്നതിലധികം പൊതുവായ അർഥം ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസത്തേക്ക്
  rationale: കാലദൈർഘ്യം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
