- from: പുരോഹിതൻ അതു പരിശോധിക്കണം[a]. ഇതാ, ബാധിതമായ പാട് വെളുത്തതായി മാറിയിരിക്കുന്നുവെങ്കിൽ, പുരോഹിതൻ ആ പാട് ശുദ്ധമെന്നു പ്രഖ്യാപിക്കണം[b]. അത് ശുദ്ധമാണ്.[c]
  to: പുരോഹിതൻ അവനെ പരിശോധിക്കണം[a]. ഇതാ, ബാധിതമായ പാട് വെളുത്തതായി മാറിയിരിക്കുന്നു; പുരോഹിതൻ ആ പാട് ശുദ്ധമാണെന്ന് പ്രഖ്യാപിക്കണം[b]; അത് ശുദ്ധമാണ്[c].
