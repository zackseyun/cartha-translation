  text: וְ/רָאָ֨/הוּ֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נֶהְפַּ֥ךְ הַ/נֶּ֖גַע לְ/לָבָ֑ן וְ/טִהַ֧ר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע טָה֥וֹר הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/017.yaml
  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: ml
  text: പുരോഹിതൻ അവനെ പരിശോധിക്കണം[a]. ഇതാ, ബാധിതമായ പാട് വെളുത്തതായി മാറിയിരിക്കുന്നു; പുരോഹിതൻ ആ പാട് ശുദ്ധമാണെന്ന് പ്രഖ്യാപിക്കണം[b]; അത് ശുദ്ധമാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവനെ നോക്കണം.’ ഇവിടെ ഹീബ്രു ക്രിയ വെറും കാഴ്ചയെയല്ല, പുരോഹിതന്റെ ഔദ്യോഗിക പരിശോധനയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ആ പാട് ശുദ്ധമാണെന്ന് വിധിക്കണം.’ പുരോഹിതൻ അതിനെ സുഖപ്പെടുത്തുകയല്ല, പരിശോധനയ്ക്കുശേഷം ആചാരപരമായ ശുദ്ധിസ്ഥിതി പ്രഖ്യാപിക്കുകയാണ്.
    reason: lexical_alternative
  - marker: c
    text: 'ഹീബ്രു അക്ഷരാർഥം: ‘ശുദ്ധം അത്/അവൻ.’ സർവനാമം പുരുഷലിംഗ ഏകവചനമാണ്; ഇവിടെ വിവർത്തനത്തിൽ അത് സമീപസ്ഥമായ ‘പാട്’ എന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: അതു പരിശോധിക്കണം
  rationale: ראה എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘കാണുക’ എന്നാണെങ്കിലും, ലേവ്യപുസ്തകം 13-ലെ പുരോഹിതപരിശോധനയുടെ പശ്ചാത്തലത്തിൽ ഉദ്ദേശിക്കുന്നത് ശ്രദ്ധാപൂർവമായ പരിശോധനയാണ്.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ സ്വാഭാവികവും സ്ഥിരവുമായ മലയാളപരിഭാഷ.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പരിശോധനയിൽ കണ്ടെത്തിയ കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരസൂചകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: נֶהְפַּךְ
  choice: മാറിയിരിക്കുന്നു
  rationale: നിഫാൽ രൂപം അവസ്ഥാമാറ്റത്തെ സൂചിപ്പിക്കുന്നു; നിറം മാറിയതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַנֶּגַע
  choice: ബാധിതമായ പാട്
  rationale: נֶגַע ഇവിടെ പുരോഹിതൻ പരിശോധിക്കുന്ന ദൃശ്യമായ ബാധിതപ്രദേശമാണ്; ഒരു ആധുനിക വൈദ്യനിർണയം അനാവശ്യമായി നിർദേശിക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לְלָבָן
  choice: വെളുത്തതായി
  rationale: ദൃശ്യമായ നിറമാറ്റത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: וְטִהַר
  choice: ശുദ്ധമെന്നു പ്രഖ്യാപിക്കണം
  rationale: ഈ സന്ദർഭത്തിൽ പുരോഹിതൻ രോഗം സുഖപ്പെടുത്തുകയോ പാട് ശുദ്ധീകരിക്കുകയോ ചെയ്യുന്നില്ല; പരിശോധനയ്ക്കുശേഷം ആചാരപരമായ ശുദ്ധിസ്ഥിതി വിധിച്ചുപറയുന്നു.
- source_word: טָהוֹר הוּא
  choice: അത് ശുദ്ധമാണ്
  rationale: ഹീബ്രുവിലെ പുരുഷലിംഗ ഏകവചന സർവനാമത്തിന്റെ സൂചന മലയാളത്തിൽ ‘അത്’ എന്നു നിലനിർത്തുന്നു; അന്തിമമായ ശുദ്ധിവിധിയും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ശുദ്ധിനിയമത്തിൽ പുരോഹിതന്റെ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: പുരോഹിതൻ പാട് ശുദ്ധമെന്നു പ്രഖ്യാപിക്കുന്നു
  alternative: പുരോഹിതൻ പാടിനെ ശുദ്ധീകരിക്കുന്നു
  rationale: טהר എന്ന ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘ശുദ്ധീകരിക്കുക’ എന്നും ‘ശുദ്ധമെന്നു വിധിക്കുക’ എന്നും അർഥമാകാം. ലേവ്യപുസ്തകം 13-ൽ പുരോഹിതൻ പരിശോധിച്ച് ആചാരപരമായ സ്ഥിതി പ്രഖ്യാപിക്കുകയാണ്; ചികിത്സയോ ശുദ്ധീകരണപ്രവൃത്തിയോ ഇവിടെ പ്രസ്താവിച്ചിട്ടില്ല.
- issue: അന്തിമ വാക്യത്തിലെ സർവനാമത്തിന്റെ സൂചന
  choice: ‘അത് ശുദ്ധമാണ്’ എന്നു നൽകി പാടിനോടുള്ള വ്യാകരണബന്ധം തുറന്നുവയ്ക്കുന്നു
  alternative: ‘അവൻ ശുദ്ധനാണ്’ എന്നു വ്യക്തിയെ സൂചിപ്പിക്കുക
  rationale: טָהוֹר הוּא എന്നതിലെ הוּא പുരുഷലിംഗ ഏകവചനമാണ്; സമീപസ്ഥമായ נֶגַע എന്ന പദവും പുരുഷലിംഗമായതിനാൽ പാടിനെയാണ് നേരിട്ട് സൂചിപ്പിക്കാനാവുക. വ്യക്തിയെ നിർബന്ധമായി സൂചിപ്പിക്കാതെ മൂലപാഠത്തിലെ ബന്ധം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. നിയമപരമായ നിർദേശഭാവത്തിന് ‘പരിശോധിക്കണം’, ‘പ്രഖ്യാപിക്കണം’ എന്നിവ ഉപയോഗിച്ചു. ‘ബാധിതമായ പാട്’ എന്ന പ്രയോഗം ദൃശ്യമായ അവസ്ഥ വ്യക്തമാക്കുമ്പോഴും നിർദിഷ്ടമായ ആധുനിക രോഗനാമം അടിച്ചേൽപ്പിക്കുന്നില്ല.
