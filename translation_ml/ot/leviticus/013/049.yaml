  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: ml
  text: വസ്ത്രത്തിലോ തുകലിലോ പാവിലോ ഊടിലോ[a] ഏതെങ്കിലും തുകൽവസ്തുവിലോ ഉള്ള പാട് പച്ചകലർന്നതോ ചുവപ്പുകലർന്നതോ ആണെങ്കിൽ, അത് സാറാത്ത് ബാധയുടെ പാടാണ്[b]; അതു പുരോഹിതനു കാണിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പാവ് എന്നത് നെയ്ത്തിലെ നീളദിശയിലുള്ള നൂലുകളും ഊട് എന്നത് അവയ്ക്കു കുറുകെയുള്ള നൂലുകളുമാണ്.
    reason: സാങ്കേതിക നെയ്ത്തുപദങ്ങൾ സാധാരണ വായനക്കാർക്കായി വിശദീകരിക്കുന്നു.
  - marker: b
    text: പരമ്പരാഗതമായി ‘കുഷ്ഠബാധയുടെ പാട്’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. എന്നാൽ എബ്രായപദമായ സാറാത്ത് ആധുനിക കുഷ്ഠരോഗത്തെക്കാൾ വിശാലമായ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് വസ്ത്രത്തെയും തുകലിനെയും ബാധിക്കുന്നു.
    reason: പരമ്പരാഗത പരിഭാഷയുടെ പരിമിതിയും മൂലപദത്തിന്റെ വിശാല അർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: הַנֶּגַע
  choice: പാട്
  rationale: വസ്ത്രത്തിലോ തുകലിലോ ദൃശ്യമായി കാണപ്പെടുന്ന ബാധിതഭാഗത്തെ സൂചിപ്പിക്കാൻ സ്വാഭാവികവും വസ്തുസന്ദർഭത്തിന് യോജിച്ചതുമായ പദം.
- source_word: יְרַקְרַק
  choice: പച്ചകലർന്ന
  rationale: ആവർത്തിത രൂപം സൂചിപ്പിക്കുന്ന ഏകദേശ പച്ചനിറം അമിതമായി നിർവചിക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲדַמְדָּם
  choice: ചുവപ്പുകലർന്ന
  rationale: ശുദ്ധമായ കടുംചുവപ്പിനേക്കാൾ ചുവപ്പിന്റെ ഛായയുള്ള നിറമെന്ന രൂപഭാവം നിലനിർത്തുന്നു.
- source_word: בֶּגֶד
  choice: വസ്ത്രം
  rationale: ധരിക്കാവുന്ന നെയ്ത വസ്തുവിനുള്ള സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: עוֹר
  choice: തുകൽ
  rationale: ഇവിടെ ജീവനുള്ള ചർമമല്ല, സംസ്കരിച്ച് വസ്തുക്കൾ നിർമിക്കാൻ ഉപയോഗിക്കുന്ന വസ്തുവാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: שְׁתִי
  choice: പാവ്
  rationale: നെയ്ത്തിലെ നീളദിശയിലുള്ള നൂലുകളെ സൂചിപ്പിക്കുന്ന മലയാള സാങ്കേതികപദം.
- source_word: עֵרֶב
  choice: ഊട്
  rationale: പാവിനു കുറുകെ കടന്നുപോകുന്ന നൂലുകളെ സൂചിപ്പിക്കുന്ന മലയാള നെയ്ത്തുപദം.
- source_word: כְּלִי עוֹר
  choice: തുകൽവസ്തു
  rationale: തുകൽകൊണ്ടുണ്ടാക്കിയ ഏതു ഉപകരണമോ സാധനമോ ഉൾക്കൊള്ളുന്ന വിശാലവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: נֶגַע צָרַעַת
  choice: സാറാത്ത് ബാധയുടെ പാട്
  rationale: ഈ എബ്രായ വിഭാഗം മനുഷ്യചർമത്തിൽ മാത്രമല്ല വസ്ത്രത്തിലും തുകലിലും ബാധിക്കുന്നതായി അധ്യായം വിവരിക്കുന്നതിനാൽ ആധുനിക കുഷ്ഠരോഗവുമായി തെറ്റായി സമീകരിക്കാതെ മൂലപദത്തിന്റെ പ്രത്യേക വിഭാഗം നിലനിർത്തുന്നു.
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: അതു പുരോഹിതനു കാണിച്ചുകൊടുക്കണം
  rationale: മൂലത്തിലെ കർമണിപ്രയോഗവും പ്രവർത്തകനെ പറയാതിരിക്കുന്നതും മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: צָרַעַת എന്ന പുരോഹിതപരിശോധനാ വിഭാഗത്തിന്റെ പരിഭാഷ
  choice: സാറാത്ത് ബാധ
  alternative: കുഷ്ഠരോഗം / ചർമരോഗം
  rationale: ലേവ്യപുസ്തകം 13-ൽ ഈ അവസ്ഥ മനുഷ്യചർമത്തിനു പുറമേ വസ്ത്രത്തെയും തുകലിനെയും ബാധിക്കുന്നതിനാൽ ‘കുഷ്ഠരോഗം’ വളരെ ഇടുങ്ങിയ ആധുനിക രോഗനിർണയമാണ്; ‘ചർമരോഗം’ വസ്തുക്കളുടെ സന്ദർഭത്തിൽ അസ്വാഭാവികമാണ്. ലിപ്യന്തരണം മൂലത്തിലെ വിശാലവും നിർവചിക്കപ്പെടാത്തതുമായ ആചാര-ശാരീരിക വിഭാഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നെയ്ത്തിലെ കൃത്യമായ വ്യത്യാസം നിലനിർത്താൻ ‘പാവ്/ഊട്’ ഉപയോഗിച്ച് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. തെറ്റായ ആധുനിക വൈദ്യപരമായ സമീകരണം ഒഴിവാക്കാൻ צָרַעַת ‘സാറാത്ത്’ എന്നു ലിപ്യന്തരിച്ചു.
