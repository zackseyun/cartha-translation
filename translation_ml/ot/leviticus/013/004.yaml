id: LEV.13.4
reference: Leviticus 13:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם בַּהֶרֶת֩ לְבָנָ֨ה הִ֜וא בְּ/ע֣וֹר בְּשָׂר֗/וֹ וְ/עָמֹק֙ אֵין מַרְאֶ֣/הָ מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/ה לֹא הָפַ֣ךְ לָבָ֑ן וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: ml
  text: എന്നാൽ അവന്റെ ശരീരത്തിന്റെ ത്വക്കിലുള്ള തിളക്കമുള്ള പാട്[a] വെളുത്തതായിരിക്കുകയും, അതിന്റെ രൂപം ത്വക്കിനെക്കാൾ ആഴമുള്ളതായി കാണപ്പെടാതിരിക്കുകയും, അതിലെ രോമം വെളുത്തതായി മാറാതിരിക്കുകയും ചെയ്താൽ, പുരോഹിതൻ ബാധിതഭാഗത്തെ[c] ഏഴു ദിവസത്തേക്ക് വേർതിരിച്ചുനിർത്തണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തിളങ്ങുന്ന പാട്’ അല്ലെങ്കിൽ ‘തെളിഞ്ഞ പാട്’; ഇവിടെ വിവരിക്കുന്ന ത്വക്കിലെ അടയാളം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിരീക്ഷണത്തിനായി ഒറ്റപ്പെടുത്തണം’; ഹീബ്രു പദം താൽക്കാലികമായി വേർതിരിച്ചുനിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ ‘ബാധ’ അല്ലെങ്കിൽ ‘വ്രണം’; പുരോഹിതൻ പരിശോധിക്കുന്ന ബാധിതമായ പാടിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: തിളക്കമുള്ള പാട്
  rationale: ത്വക്കിൽ തെളിഞ്ഞോ തിളക്കമുള്ളതായോ കാണപ്പെടുന്ന അടയാളത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. മുൻവാക്യത്തിലെ വീക്കത്തിൽനിന്ന് ഇതിനെ വേർതിരിക്കുകയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לְבָנָה
  choice: വെളുത്തത്
  rationale: പാടിന്റെ നിറത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ലളിതമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: അവന്റെ ശരീരത്തിന്റെ ത്വക്കിൽ
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ ശരീരസംബന്ധമായ പ്രത്യേകത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഇവിടെ בשר എന്നത് മാംസത്തെയല്ല, ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  choice: അതിന്റെ രൂപം ത്വക്കിനെക്കാൾ ആഴമുള്ളതായി കാണപ്പെടാതിരിക്കുക
  rationale: ചുറ്റുമുള്ള ത്വക്കിനോടു താരതമ്യപ്പെടുത്തി കാഴ്ചയിൽ തോന്നുന്ന ആഴമാണ് രോഗനിർണയത്തിനുള്ള മാനദണ്ഡം; 'കാണപ്പെടുക' നിരീക്ഷണസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: וּשְׂעָרָהּ
  choice: അതിലെ രോമം
  rationale: പാടിനുള്ളിലോ അതിന്മേലോ ഉള്ള രോമത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לֹא הָפַךְ לָבָן
  choice: വെളുത്തതായി മാറാതിരിക്കുക
  rationale: הפך സൂചിപ്പിക്കുന്ന അവസ്ഥാമാറ്റം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְהִסְגִּיר
  choice: വേർതിരിച്ചുനിർത്തണം
  rationale: പരിശോധനയ്ക്കായി താൽക്കാലികമായി ഒറ്റപ്പെടുത്തുന്ന നടപടിയെ സൂചിപ്പിക്കുന്നു; പഴഞ്ചൻ അഥവാ ശിക്ഷാത്മകമായ ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: אֶת הַנֶּגַע
  choice: ബാധിതഭാഗം
  rationale: നിർണയം തീർച്ചപ്പെടുത്തിയ രോഗമെന്നതിനേക്കാൾ പുരോഹിതൻ പരിശോധിക്കുന്ന ബാധിതമായ പാടോ ഭാഗമോ എന്ന മൂർത്തമായ അർഥം നൽകുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസത്തേക്ക്
  rationale: വേർതിരിച്ചുനിർത്തേണ്ട കാലാവധി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
