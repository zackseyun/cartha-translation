translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. നിയമപരവും നിരീക്ഷണാത്മകവുമായ സ്വരം നിലനിർത്തി; ആധുനിക വൈദ്യശാസ്ത്രപരമായ നിർണയം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദബന്ധങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
