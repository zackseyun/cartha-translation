source:
  edition: WLC
  text: וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י אִם פָּשֹׂ֤ה תִפְשֶׂה֙ בָּ/ע֔וֹר וְ/טִמֵּ֤א הַ/כֹּהֵן֙ אֹת֔/וֹ נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: ml
  text: ഏഴാം ദിവസം പുരോഹിതൻ അയാളെ പരിശോധിക്കണം. അത് തൊലിയിൽ ശരിക്കും പടർന്നിട്ടുണ്ടെങ്കിൽ, പുരോഹിതൻ അയാളെ അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം; അത് ചർമ്മരോഗബാധയാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘കുഷ്ഠരോഗബാധ’ എന്നു വിവർത്തനം ചെയ്യാറുണ്ട്. എന്നാൽ എബ്രായപദം ഇസ്രായേലിന്റെ ആചാരശുദ്ധിനിയമങ്ങളിൽ പലതരം ഗുരുതരമായ ചർമ്മാവസ്ഥകളെ സൂചിപ്പിക്കുന്നു; അത് ആധുനിക കുഷ്ഠരോഗം (ഹാൻസൻ രോഗം) മാത്രമായിരിക്കണമെന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: അയാളെ പരിശോധിക്കണം
  rationale: רָאָה എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘കാണുക’ എന്നാണെങ്കിലും, ഇവിടെ പുരോഹിതന്റെ രോഗനിർണയപരമായ പരിശോധനയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: കാലസൂചന മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായി നൽകുന്നു.
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: ശരിക്കും പടർന്നിട്ടുണ്ടെങ്കിൽ
  rationale: ക്രിയയോടൊപ്പമുള്ള infinitive absolute നൽകുന്ന ഊന്നൽ ‘ശരിക്കും’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: בָּעוֹר
  choice: തൊലിയിൽ
  rationale: עוֹר എന്നത് ഇവിടെ മനുഷ്യന്റെ തൊലിയെയാണ് സൂചിപ്പിക്കുന്നത്; രോഗബാധ അതിൽ പടരുന്നതെന്ന ആശയം നേരിട്ട് നൽകുന്നു.
- source_word: וְטִמֵּא ... אֹתוֹ
  choice: അയാളെ അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതൻ ആ വ്യക്തിയെ അശുദ്ധനാക്കുന്നു എന്നല്ല, ആചാരപരമായ നില ഔദ്യോഗികമായി വിധിച്ചു പ്രഖ്യാപിക്കുന്നു എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: נֶגַע צָרַעַת
  choice: ചർമ്മരോഗബാധ
  rationale: נֶגַע രോഗബാധയെയോ ദൃശ്യമായ ക്ഷതത്തെയോ സൂചിപ്പിക്കുന്നു; צָרַעַת ആധുനിക ഹാൻസൻ രോഗത്തിൽ മാത്രം ഒതുങ്ങാത്ത വിശാലമായ ചർമ്മരോഗവിഭാഗമാണ്.
theological_decisions:
- issue: ആചാരശുദ്ധിനിയമങ്ങളിൽ צָרַעַת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ചർമ്മരോഗം
  alternative: കുഷ്ഠരോഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ ഈ എബ്രായപദം ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ കുഷ്ഠരോഗം/ഹാൻസൻ രോഗം മാത്രമല്ല, കൂടുതൽ വിശാലമായ രോഗാവസ്ഥകളെയും ഉൾക്കൊള്ളുന്നു. അതിനാൽ കാലവിരുദ്ധമായ വൈദ്യശാസ്ത്രപരമായ നിർണയം ഒഴിവാക്കിക്കൊണ്ട് പരമ്പരാഗത വിവർത്തനം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. നിയമപരവും ആചാരപരവുമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യ വൈദ്യശാസ്ത്രസാങ്കേതികത ഒഴിവാക്കി.
