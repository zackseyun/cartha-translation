source:
  edition: WLC
  text: וְ/אִם בְּ/עֵינָי/ו֩ עָמַ֨ד הַ/נֶּ֜תֶק וְ/שֵׂעָ֨ר שָׁחֹ֧ר צָֽמַח בּ֛/וֹ נִרְפָּ֥א הַ/נֶּ֖תֶק טָה֣וֹר ה֑וּא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: ml
  text: എന്നാൽ പുരോഹിതന്റെ കാഴ്ചയിൽ ആ തൊലിപ്പാട് മാറ്റമില്ലാതെ നിൽക്കുകയും അതിൽ കറുത്ത രോമം വളരുകയും ചെയ്തിട്ടുണ്ടെങ്കിൽ, ആ തൊലിപ്പാട് സുഖപ്പെട്ടിരിക്കുന്നു; അവൻ ശുദ്ധനാണ്. പുരോഹിതൻ അവനെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുരോഹിതൻ അവനെ ശുദ്ധീകരിക്കണം.” ഹീബ്രു ക്രിയയെ അങ്ങനെ പരിഭാഷപ്പെടുത്താനാകുമെങ്കിലും, ഇവിടെ രോഗബാധ സുഖപ്പെട്ടശേഷമുള്ള പുരോഹിതന്റെ ഔദ്യോഗിക വിധിയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: അവന്റെ കാഴ്ചയിൽ
  rationale: പരിശോധിക്കുന്നവന്റെ വിലയിരുത്തലിൽ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യപരിശോധനാഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് പുരോഹിതന്റെ കാഴ്ചയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עָמַד
  choice: മാറ്റമില്ലാതെ നിൽക്കുകയും
  rationale: രോഗബാധിത പാട് പടരാതെയും രൂപം മാറാതെയും പഴയ നിലയിൽ തുടരുന്നതാണ് പരിശോധനാസന്ദർഭത്തിലെ അർഥം.
- source_word: הַנֶּתֶק
  choice: ചൊറിപ്പാട്
  rationale: തലയിലോ താടിയിലോ ഉണ്ടാകുന്ന പ്രത്യേക ചർമ്മബാധയെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു; വെറും ചൊറിച്ചിൽ എന്ന ലക്ഷണമായി ചുരുക്കുന്നില്ല.
- source_word: שֵׂעָר שָׁחֹר
  choice: കറുത്ത രോമം
  rationale: ഹീബ്രു വിശേഷണവും പരിശോധനയിലെ വർണവ്യത്യാസവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: צָמַח בּוֹ
  choice: അതിൽ ... വളരുകയും
  rationale: ബാധിത പാടിനുള്ളിൽ രോമം വളർന്നുവന്നതെന്ന ഹീബ്രു ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
- source_word: נִרְפָּא
  choice: സുഖപ്പെട്ടിരിക്കുന്നു
  rationale: ബാധ ഭേദമായിക്കഴിഞ്ഞ അവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: טָהוֹר הוּא
  choice: അവൻ ശുദ്ധനാണ്
  rationale: ശുദ്ധി എന്ന വിധി പാടിനെക്കാൾ പരിശോധനയ്ക്കു വിധേയനായ വ്യക്തിയെക്കുറിച്ചാണെന്ന് വ്യാകരണവും ലേവ്യപുസ്തകത്തിലെ ശുദ്ധി-അശുദ്ധി ഭാഷയും സൂചിപ്പിക്കുന്നു.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: പുരോഹിതൻ അവനെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  rationale: രോഗം സുഖപ്പെട്ടതിനു പിന്നാലെയുള്ള പുരോഹിതന്റെ ഔദ്യോഗിക ശുദ്ധിവിധിയാണിത്; പുരോഹിതൻ രോഗം ഭേദമാക്കുന്നു എന്ന ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ശുദ്ധിയെക്കുറിച്ചുള്ള പുരോഹിതന്റെ നടപടിയുടെ സ്വഭാവം
  choice: പുരോഹിതൻ അവനെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  alternative: പുരോഹിതൻ അവനെ ശുദ്ധീകരിക്കണം
  rationale: രോഗബാധ സുഖപ്പെട്ടതായി ആദ്യം പറഞ്ഞശേഷമാണ് പുരോഹിതന്റെ നടപടി വരുന്നത്. അതിനാൽ ഇവിടെ ക്രിയ ഔദ്യോഗികമായ ശുദ്ധിവിധിയെ സൂചിപ്പിക്കുന്നു; ശാരീരികമായോ കർമ്മപരമായോ രോഗശാന്തി വരുത്തുന്നതിനെ അല്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരവും ആചാരപരവുമായ ‘ശുദ്ധൻ’ എന്ന പദപ്രയോഗം നിലനിർത്തിയിരിക്കുന്നു; സാങ്കേതിക രോഗനാമം അനാവശ്യമായി നിർണയിക്കാതെ ‘ചൊറിപ്പാട്’ എന്നു നൽകിയിരിക്കുന്നു.
