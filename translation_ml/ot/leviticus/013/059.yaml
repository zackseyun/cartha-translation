id: LEV.13.59
reference: Leviticus 13:59
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: ml
  text: കമ്പിളിവസ്ത്രത്തിലോ ചണനൂൽവസ്ത്രത്തിലോ, നീളനൂലിലോ കുറുകെനൂലിലോ, തോൽകൊണ്ടുള്ള ഏതെങ്കിലും വസ്തുവിലോ ഉണ്ടാകുന്ന സാറാത്ത് ബാധയെ[a] ശുദ്ധമെന്നോ അശുദ്ധമെന്നോ വിധിക്കുന്നതിനുള്ള നിയമം ഇതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സാറാത്ത്” എന്ന എബ്രായപദം ആധുനിക കുഷ്ഠരോഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; ഈ അധ്യായത്തിൽ മനുഷ്യരിലും വസ്ത്രം, തോൽ തുടങ്ങിയ വസ്തുക്കളിലും കാണപ്പെടുന്ന വിവിധതരം ബാധകൾക്കു ഈ പദം ഉപയോഗിക്കുന്നു.
    reason: മൂലപദത്തിന്റെ വിശാലമായ ആചാരപരമായ അർഥം സംരക്ഷിക്കാനും ആധുനിക വൈദ്യശാസ്ത്രപരമായ തെറ്റായ തിരിച്ചറിയൽ ഒഴിവാക്കാനും.
lexical_decisions:
- source_word: תּוֹרַת
  choice: നിയമം
  rationale: ഈ ഭാഗത്ത് തുടർന്നുവന്ന കേസുകളെ നിയന്ത്രിക്കുന്ന ചട്ടത്തെയും നടപടിക്രമത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികവും പരമ്പരാഗതവുമായ പദം.
- source_word: נֶגַע צָרַעַת
  choice: സാറാത്ത് ബാധ
  rationale: צָרַעַת മനുഷ്യരിൽ മാത്രം കാണുന്ന ആധുനിക കുഷ്ഠരോഗത്തിന് തുല്യമല്ല; ഇവിടെ വസ്ത്രത്തിലും തോൽവസ്തുക്കളിലും ബാധിക്കുന്നതായി പറയുന്നു. അതിനാൽ തെറ്റായ വൈദ്യശാസ്ത്രപരമായ നിർവചനം ഒഴിവാക്കാൻ എബ്രായ വിഭാഗനാമം ലിപ്യന്തരം ചെയ്ത് ‘ബാധ’ ചേർത്തു.
- source_word: בֶּגֶד הַצֶּמֶר
  choice: കമ്പിളിവസ്ത്രം
  rationale: കമ്പിളിനൂൽകൊണ്ടുള്ള വസ്ത്രം എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: הַפִּשְׁתִּים
  choice: ചണവസ്ത്രം
  rationale: പദം അക്ഷരാർഥത്തിൽ ചണം/ലിനൻ ആണെങ്കിലും ‘കമ്പിളിവസ്ത്രം’ എന്ന സമാന്തരപ്രയോഗവും സന്ദർഭവും വസ്ത്രം എന്ന ആശയം ഇവിടെ ഉൾക്കൊള്ളുന്നു.
- source_word: הַשְּׁתִי
  choice: നീളനൂൽ
  rationale: നെയ്ത്തിലെ warp എന്ന സാങ്കേതിക ആശയം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָעֵרֶב
  choice: കുറുകെനൂൽ
  rationale: നെയ്ത്തിലെ weft/woof, അഥവാ നീളനൂലുകൾക്ക് കുറുകെ പോകുന്ന നൂൽ, ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: כָּל כְּלִי עוֹר
  choice: തോൽകൊണ്ടുള്ള ഏതെങ്കിലും വസ്തു
  rationale: כְּלִי എന്ന വിശാലാർഥമുള്ള പദത്തെ ഒരു പ്രത്യേക പാത്രത്തിലോ ഉപകരണത്തിലോ പരിമിതപ്പെടുത്താതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְטַהֲרוֹ א֥וֹ לְטַמְּאוֹ
  choice: ശുദ്ധമെന്നോ അശുദ്ധമെന്നോ വിധിക്കുന്നതിന്
  rationale: ഇത് ഭൗതികമായി വൃത്തിയാക്കുന്നതോ മലിനമാക്കുന്നതോ അല്ല, ആചാരപരമായ നില നിർണയിക്കുന്നതാണെന്ന പുരോഹിതനിയമസന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വസ്ത്രങ്ങളെയും തോൽവസ്തുക്കളെയും സംബന്ധിക്കുന്നിടത്ത് צָרַעַת എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: സാറാത്ത് ബാധ
  alternative: കുഷ്ഠബാധ / കുഷ്ഠരോഗസദൃശമായ ബാധ
  rationale: എബ്രായ പദം ആധുനിക ഹാൻസൻസ് രോഗത്തെക്കാൾ വിശാലമായ ആചാരശുദ്ധി വിഭാഗമാണ്; ജഡവസ്തുക്കൾക്കും ഇത് പ്രയോഗിക്കുന്നു. ലിപ്യന്തരണം മൂലപാഠത്തിന്റെ പ്രത്യേക വിഭാഗവും അതിലെ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് വായനക്കാരന് ആവശ്യമായ വിശദീകരണം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നീളനൂൽ/കുറുകെനൂൽ’ എന്ന വിശദമായ പദങ്ങൾ അപരിചിതമായ നെയ്ത്തുസാങ്കേതിക പദങ്ങളെക്കാൾ വായനാസൗകര്യം നൽകുന്നു; വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക സംഗ്രഹപ്രസ്താവനയായി ക്രമീകരിച്ചു.
