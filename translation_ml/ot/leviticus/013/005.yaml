- from: ഏഴാം ദിവസം പുരോഹിതൻ അയാളെ പരിശോധിക്കണം. അപ്പോൾ, ആ പാട് അയാളുടെ കാഴ്ചയിൽ മാറ്റമില്ലാതെ നിൽക്കുകയും ചർമത്തിൽ പടരാതിരിക്കുകയും ചെയ്തിട്ടുണ്ടെങ്കിൽ, പുരോഹിതൻ അയാളെ വീണ്ടും ഏഴു ദിവസത്തേക്ക് മാറ്റിപ്പാർപ്പിക്കണം.[a][b][c]
  to: ഏഴാം ദിവസം പുരോഹിതൻ അയാളെ പരിശോധിക്കണം. അപ്പോൾ, ആ പാട് പുരോഹിതന്റെ കാഴ്ചയിൽ മാറ്റമില്ലാതെ നിൽക്കുകയും ചർമത്തിൽ പടർന്നിട്ടില്ലാതിരിക്കുകയും ചെയ്തിട്ടുണ്ടെങ്കിൽ, പുരോഹിതൻ അയാളെ വീണ്ടും ഏഴു ദിവസത്തേക്ക് വേർതിരിച്ചു വയ്ക്കണം.[a][b][c]
  rationale: മൂലപാഠത്തിലെ പുരോഹിതന്റെ നിരീക്ഷണദൃഷ്ടി വ്യക്തമായി അടയാളപ്പെടുത്തുന്നതിനും, രണ്ടാം ഏഴുദിവസത്തെ നിയന്ത്രിത വേർതിരിക്കൽ എന്ന הִסְגִּירוֹയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നതിനും പാഠം പരിഷ്കരിച്ചു. നגעയുടെ രോഗനിർണയപരമായി അനിശ്ചിതമായ അർഥം ‘പാട്’ എന്നും അതിന്റെ അടിക്കുറിപ്പിലൂടെയും നിലനിർത്തിയിട്ടുണ്ട്.
