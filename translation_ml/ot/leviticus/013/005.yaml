  edition: WLC
  text: וְ/רָאָ֣/הוּ הַ/כֹּהֵן֮ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֒ וְ/הִנֵּ֤ה הַ/נֶּ֨גַע֙ עָמַ֣ד בְּ/עֵינָ֔י/ו לֹֽא פָשָׂ֥ה הַ/נֶּ֖גַע בָּ/ע֑וֹר וְ/הִסְגִּיר֧/וֹ הַ/כֹּהֵ֛ן שִׁבְעַ֥ת יָמִ֖ים שֵׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: ml
  text: ഏഴാം ദിവസം പുരോഹിതൻ അയാളെ പരിശോധിക്കണം. അപ്പോൾ, ആ പാട് പുരോഹിതന്റെ കാഴ്ചയിൽ മാറ്റമില്ലാതെ നിൽക്കുകയും ചർമത്തിൽ പടർന്നിട്ടില്ലാതിരിക്കുകയും ചെയ്തിട്ടുണ്ടെങ്കിൽ, പുരോഹിതൻ അയാളെ വീണ്ടും ഏഴു ദിവസത്തേക്ക് വേർതിരിച്ചു വയ്ക്കണം.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പാട്” എന്നതിന് “ബാധ,” “അടയാളം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ നെഗാ എന്ന പദം പുരോഹിതൻ പരിശോധിക്കുന്ന ദൃശ്യമായ ചർമവികാരത്തെ സൂചിപ്പിക്കുന്നു; അത് ആധുനിക വൈദ്യശാസ്ത്രം നിർവചിക്കുന്ന ഒരു പ്രത്യേക രോഗമായിരിക്കണമെന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ആ പാട് അവന്റെ കണ്ണുകളിൽ നിലച്ചിരിക്കുന്നു”; അതായത്, പുരോഹിതന്റെ കാഴ്ചയിൽ അതിനു മാറ്റമുണ്ടായിരുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: “വേർതിരിച്ചു വയ്ക്കണം” എന്നതിന് “അടച്ചുവയ്ക്കണം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: അയാളെ പരിശോധിക്കണം
  rationale: ראה എന്നത് അക്ഷരാർഥത്തിൽ ‘കാണുക’ എന്നാണെങ്കിലും, ഇവിടെ പുരോഹിതന്റെ ഔപചാരിക പരിശോധനയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പരിശോധിക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הַנֶּגַע
  choice: ആ പാട്
  rationale: נגע ഇവിടെ ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ നിർവചിത രോഗമെന്നതിലുപരി പുരോഹിതൻ പരിശോധിക്കുന്ന ദൃശ്യമായ ചർമവികാരത്തെയോ അടയാളത്തെയോ സൂചിപ്പിക്കുന്നു; ‘പാട്’ ഈ വിശാലത നിലനിർത്തുന്നു.
- source_word: עָמַד בְּעֵינָיו
  choice: അയാളുടെ കാഴ്ചയിൽ മാറ്റമില്ലാതെ നിൽക്കുക
  rationale: '‘അവന്റെ കണ്ണുകളിൽ നിന്നു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിലയിരുത്തൽപരമായ അർഥം നിലനിർത്തുന്നു: പുരോഹിതനു കാണപ്പെട്ടതനുസരിച്ച് പാടിന് മാറ്റമില്ല.'
- source_word: לֹא פָשָׂה ... בָּעוֹר
  choice: ചർമത്തിൽ പടരാതിരിക്കുക
  rationale: פשׂה എന്ന ക്രിയ രോഗലക്ഷണം വ്യാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; עור എന്നത് ‘ചർമം’ ആണ്.
- source_word: וְהִסְגִּירוֹ
  choice: അയാളെ മാറ്റിപ്പാർപ്പിക്കണം
  rationale: סגר എന്ന causative രൂപം അടച്ചിടുകയോ വേർതിരിച്ചുവയ്ക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘മാറ്റിപ്പാർപ്പിക്കുക’ അനാവശ്യമായ ആധുനിക വൈദ്യപരമായ ‘ക്വാറന്റീൻ’ ധ്വനി ഒഴിവാക്കി വേർതിരിക്കൽ വ്യക്തമാക്കുന്നു.
- source_word: שֵׁנִית
  choice: വീണ്ടും
  rationale: രണ്ടാമത്തെ ഏഴുദിവസത്തെ വേർതിരിക്കൽ ആണെന്ന ആവർത്തനാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. നിയമപരവും അനുഷ്ഠാനപരവുമായ ഭാവം നിലനിർത്തി; ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ നിർവചനങ്ങൾ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു ചേർന്ന് മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
