  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: ml
  text: പുരോഹിതൻ അതു പരിശോധിക്കണം. അപ്പോൾ, അതിന്റെ രൂപം തൊലിയുടെ നിരപ്പിനെക്കാൾ താഴ്ന്നതായും അതിലെ രോമം വെളുത്തതായി മാറിയതായും കണ്ടാൽ, പുരോഹിതൻ അയാളെ അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം. അതു ചർമരോഗബാധയാണ്[a]; പരുവിൽ അതു പൊട്ടിപ്പുറപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള ഹീബ്രുപദം צָרַעַת (ത്സാരാഅത്ത്) പരമ്പരാഗതമായി ‘കുഷ്ഠം’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. എന്നാൽ ലേവ്യപുസ്തകത്തിൽ അത് ആധുനിക ഹാൻസൻ രോഗത്തെ മാത്രം അല്ല, പലതരം ഗുരുതരമായ ത്വക്കുബാധകളെയും സൂചിപ്പിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: പരിശോധിക്കണം
  rationale: പുരോഹിതൻ നടത്തുന്ന ഔദ്യോഗിക രോഗനിർണയപരമായ നിരീക്ഷണമാണ് സന്ദർഭം; വെറുതെ ‘കാണുക’ എന്നതിനെക്കാൾ ‘പരിശോധിക്കുക’ അതു വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ … കണ്ടാൽ
  rationale: നിർണായക ലക്ഷണങ്ങളിലേക്കു ശ്രദ്ധ തിരിക്കുന്ന ഹീബ്രു വ്യവഹാരചിഹ്നത്തിന്റെ പ്രവർത്തനം സ്വാഭാവികമായ മലയാള നിയമവാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  choice: അതിന്റെ രൂപം തൊലിയുടെ നിരപ്പിനെക്കാൾ താഴ്ന്നത്
  rationale: ബാധിതഭാഗം ചുറ്റുമുള്ള തൊലിയെക്കാൾ കുഴിഞ്ഞതായി കാണപ്പെടുന്നു എന്ന ദൃശ്യാർഥം വ്യക്തമായി നൽകുന്നു; യഥാർഥ ആഴം നിർബന്ധമായി അവകാശപ്പെടുന്നില്ല.
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: അതിലെ രോമം വെളുത്തതായി മാറിയിരിക്കുന്നു
  rationale: സ്ത്രീലിംഗ പ്രത്യയം ബാധിതഭാഗത്തോടു ബന്ധപ്പെടുത്തി, രോമത്തിൽ സംഭവിച്ച മാറ്റം മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: וְטִמְּאוֹ
  choice: അയാളെ അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതൻ അശുദ്ധി ഉണ്ടാക്കുന്നു എന്നല്ല, ആചാരപരമായ നില ഔദ്യോഗികമായി നിർണയിച്ചു പ്രഖ്യാപിക്കുന്നു എന്നാണ് സന്ദർഭാർഥം.
- source_word: נֶגַע צָרַעַת
  choice: ചർമരോഗബാധ
  rationale: צָרַעַת ആധുനിക ഹാൻസൻ രോഗത്തോടു മാത്രം തുല്യമല്ല; נֶגַע എന്ന ബാധ/പൊട്ടിപ്പുറപ്പെടൽ ആശയവും ഉൾക്കൊള്ളുന്ന, പൊതുവായെങ്കിലും സന്ദർഭോചിതമായ പ്രയോഗമാണിത്.
- source_word: בַּשְּׁחִין
  choice: പരുവിൽ
  rationale: שְׁחִין സൂചിപ്പിക്കുന്ന വീക്കമുള്ള വ്രണം അഥവാ boil എന്നതിന് സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: פָּרָחָה
  choice: പൊട്ടിപ്പുറപ്പെട്ടിരിക്കുന്നു
  rationale: രോഗബാധ പരുവിൽ പ്രത്യക്ഷപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു; ശരീരമാകെ പടർന്നു എന്ന അനാവശ്യ നിഗമനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ צָרַעַת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ചർമരോഗബാധ
  alternative: കുഷ്ഠബാധ
  rationale: ഈ ഹീബ്രുപദം ആധുനിക ഹാൻസൻ രോഗത്തെക്കാൾ വിശാലമായ പല ത്വക്കുബാധകളെയും ഉൾക്കൊള്ളാനിടയുണ്ട്. അതിനാൽ അനാകാലികമായ വൈദ്യശാസ്ത്രപരമായ സമീകരണം ഒഴിവാക്കി, ആചാരശുദ്ധിനിയമത്തിന്റെ രോഗനിർണയസന്ദർഭം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ നിയമ-നിർണയ ശൈലി. ‘അശുദ്ധൻ’ എന്നത് വൈദ്യപരമായ മലിനതയല്ല, ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ നിലയാണ്. വാക്യഘടന ഹീബ്രുവിലെ നിരീക്ഷണം–ലക്ഷണം–പ്രഖ്യാപനം എന്ന ക്രമം നിലനിർത്തുന്നു.
