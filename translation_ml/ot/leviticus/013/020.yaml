  source_fidelity: 'The draft accurately preserves the diagnostic sequence: priestly examination, the lesion appearing lower than the skin, whitening of hair in the affected area, declaration of ritual uncleanness, and the condition’s emergence in a boil. The rendering of צָרַעַת as a broad skin-disease term, qualified by a footnote, appropriately avoids equating it directly with modern Hansen’s disease.'
