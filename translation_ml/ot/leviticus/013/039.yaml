source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֧ה בְ/עוֹר בְּשָׂרָ֛/ם בֶּהָרֹ֖ת כֵּה֣וֹת לְבָנֹ֑ת בֹּ֥הַק ה֛וּא פָּרַ֥ח בָּ/ע֖וֹר טָה֥וֹר הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/039.yaml
  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: ml
  text: പുരോഹിതൻ പരിശോധിച്ചു നോക്കിയപ്പോൾ, അവരുടെ ശരീരത്തിന്റെ തൊലിയിൽ മങ്ങിയ വെളുത്ത പാടുകൾ കണ്ടാൽ, അത് തൊലിയിൽ പൊട്ടിപ്പുറപ്പെട്ട ഒരു പാടാണ്[a]; ആ വ്യക്തി ശുദ്ധനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ത്വക്കിലെ ഒരു പൊട്ടിപ്പുറപ്പെടൽ’ അഥവാ ‘പുള്ളിപോലുള്ള പാട്.’ അശുദ്ധിയുണ്ടാക്കുന്ന ഗുരുതരമായ ചർമാവസ്ഥയിൽനിന്ന് വ്യത്യസ്തമായ ഒരു ചർമസ്ഥിതിയെയാണ് ഈ അപൂർവ ഹീബ്രു പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: പരിശോധിക്കുമ്പോൾ
  rationale: പുരോഹിതൻ ചർമസ്ഥിതി നിർണയിക്കുന്ന ഈ നിയമസന്ദർഭത്തിൽ ക്രിയയ്ക്ക് വെറുതെ ‘കാണുക’ എന്നതിലുപരി പരിശോധിക്കുക എന്ന അർഥമാണുള്ളത്.
- source_word: בְעוֹר בְּשָׂרָם
  choice: അവരുടെ ശരീരത്തിന്റെ തൊലിയിൽ
  rationale: ഹീബ്രുവിലെ മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയവും തൊലി/ശരീരം എന്ന സാക്ഷാൽ പദപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: בֶּהָרֹת כֵּהוֹת לְבָנֹת
  choice: മങ്ങിയ വെളുത്ത പാടുകൾ
  rationale: തിളക്കമുള്ള വെളുപ്പല്ല, മന്ദമോ മങ്ങിയതോ ആയ വെളുത്ത അടയാളങ്ങളാണ് ഇവിടെ വിവരിക്കുന്നത്.
- source_word: בֹּהַק
  choice: നിരുപദ്രവമായ ഒരു ചർമപ്പാട്
  rationale: അപൂർവമായ ഈ പദം അധ്യായത്തിൽ ചർച്ചചെയ്യുന്ന അശുദ്ധിയുണ്ടാക്കുന്ന ഗുരുതര ചർമാവസ്ഥയിൽനിന്നു വേറിട്ട, അശുദ്ധിവിധി ബാധകമല്ലാത്ത ഒരു ചർമാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. കൃത്യമായ ആധുനിക രോഗനാമം ചുമത്താതെ സന്ദർഭത്തിലെ നിർണയഫലം വ്യക്തമാക്കുന്നു.
- source_word: פָּרַח
  choice: പൊട്ടിപ്പുറപ്പെട്ട
  rationale: ചർമാവസ്ഥയെക്കുറിച്ച് ഉപയോഗിക്കുമ്പോൾ ഈ ക്രിയ പൊട്ടിപ്പുറപ്പെടുക അഥവാ പ്രത്യക്ഷപ്പെടുക എന്ന ആശയം നൽകുന്നു.
- source_word: טָהוֹר הוּא
  choice: ആ വ്യക്തി ശുദ്ധനാണ്
  rationale: ലേവ്യപുസ്തകം 13-ലെ ആവർത്തിത നിർണയസൂത്രമനുസരിച്ച് ഇത് വ്യക്തിയുടെ ആചാരപരമായ ശുദ്ധസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു; ധാർമിക നിർമലതയോ വൈദ്യശാസ്ത്രപരമായ രോഗമുക്തിയോ ഇതിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പുരോഹിതന്റെ ശുദ്ധിവിധിയുടെ സ്വഭാവം
  choice: ‘ആ വ്യക്തി ശുദ്ധനാണ്’ എന്ന് ആചാര-നിയമപരമായ വിധിയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അത് ശുദ്ധമാണ്’ അല്ലെങ്കിൽ ‘ആ വ്യക്തി ആചാരപരമായി ശുദ്ധനാണ്.’
  rationale: הוּא വ്യാകരണപരമായി പുരുഷലിംഗമായ בֹּהַק-നെ സൂചിപ്പിക്കാൻ കഴിയുമെങ്കിലും, ഈ അധ്യായത്തിലെ നിർണയസൂത്രം സാധാരണയായി പരിശോധിക്കപ്പെടുന്ന വ്യക്തിയുടെ ശുദ്ധസ്ഥിതിയാണ് പ്രഖ്യാപിക്കുന്നത്. ‘ആചാരപരമായി’ എന്നു മുഖ്യപാഠത്തിൽ കൂട്ടിച്ചേർക്കാതെ സന്ദർഭം അർഥം നിർണ്ണയിക്കാൻ അനുവദിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. നിയമപരമായ പരിശോധനാഭാവം സ്വാഭാവികമായ നിബന്ധനാവാക്യത്തിലൂടെ അവതരിപ്പിച്ചു; ആധുനിക വൈദ്യരോഗനാമം ഒഴിവാക്കി.
