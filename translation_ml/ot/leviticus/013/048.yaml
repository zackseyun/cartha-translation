id: LEV.13.48
reference: Leviticus 13:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: א֤וֹ בִֽ/שְׁתִי֙ א֣וֹ בְ/עֵ֔רֶב לַ/פִּשְׁתִּ֖ים וְ/לַ/צָּ֑מֶר א֣וֹ בְ/ע֔וֹר א֖וֹ בְּ/כָל מְלֶ֥אכֶת עֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/048.yaml
  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: ml
  text: അല്ലെങ്കിൽ ചണനൂലിന്റെയോ കമ്പിളിനൂലിന്റെയോ പാവിലോ ഊടിലോ[a], അല്ലെങ്കിൽ തോലിലോ തോൽകൊണ്ടുണ്ടാക്കിയ ഏതെങ്കിലും വസ്തുവിലോ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പാവ്” നെയ്ത്തിലെ നീളദിശയിലുള്ള നൂലുകളും “ഊട്” അവയ്ക്കു കുറുകെ നെയ്യുന്ന നൂലുകളുമാണ്.
    reason: lexical_clarification
lexical_decisions:
- source_word: שְׁתִי
  choice: പാവ്
  rationale: നെയ്ത്തിലെ നീളദിശയിലുള്ള നൂലുകളെ സൂചിപ്പിക്കുന്ന പ്രമാണിക മലയാള സാങ്കേതികപദം; עֵרֶב എന്നതിനോടുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: עֵרֶב
  choice: ഊട്
  rationale: പാവിന് കുറുകെ നെയ്യുന്ന നൂലുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള നെയ്ത്തുപദം.
- source_word: לַפִּשְׁתִּים
  choice: ചണനൂലിന്റെ
  rationale: പദം ചണച്ചെടിയെയും അതിൽനിന്നുള്ള നാരിനെയും സൂചിപ്പിക്കാം; ഇവിടെ പാവും ഊടും പറയുന്നതിനാൽ നെയ്ത്തിനുപയോഗിക്കുന്ന ചണനൂൽ ഉദ്ദേശിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: וְלַצָּמֶר
  choice: കമ്പിളിനൂലിന്റെ
  rationale: צֶמֶר ആട്ടിൻരോമം/കമ്പിളി എന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; നെയ്ത്തുസന്ദർഭത്തിൽ 'കമ്പിളിനൂൽ' സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: עוֹר
  choice: തോൽ
  rationale: ഉപയോഗവസ്തുക്കളുടെ പശ്ചാത്തലത്തിൽ സംസ്കരിച്ച മൃഗത്തോൽ ഉദ്ദേശിക്കുന്നു; മലയാളത്തിൽ 'തോൽ' സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: തോൽകൊണ്ടുണ്ടാക്കിയ ഏതെങ്കിലും വസ്തുവിൽ
  rationale: מְלָאכָה ഇവിടെ അധ്വാനമെന്നതിലുപരി നിർമ്മിച്ച ഉൽപ്പന്നത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഈ വിവർത്തനം അർത്ഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: אוֹ ... אוֹ
  choice: അല്ലെങ്കിൽ ... അല്ലെങ്കിൽ
  rationale: വ്യത്യസ്ത സാധ്യതകളുടെ പട്ടിക അടയാളപ്പെടുത്തുന്ന ആവർത്തനഘടന മലയാളത്തിലും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണിക മലയാളത്തിൽ, നിയമഗ്രന്ഥത്തിന് യോജിച്ച ഗൗരവവും വ്യക്തതയും പാലിച്ചു. നെയ്ത്തിലെ സാങ്കേതിക വ്യത്യാസം സംരക്ഷിക്കാൻ ‘പാവ്’, ‘ഊട്’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; അപൂർവമായതിനാൽ അടിക്കുറിപ്പിൽ ചുരുക്കവിവരണം നൽകി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിലെ ദീർഘരേഖ നിലനിർത്തി.
