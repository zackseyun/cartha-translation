  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל יְמֵ֞י אֲשֶׁ֨ר הַ/נֶּ֥גַע בּ֛/וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה מוֹשָׁבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: ml
  text: അവനിൽ രോഗബാധയുള്ള നാളുകളിലെല്ലാം അവൻ അശുദ്ധനായിരിക്കും[b]. അവൻ അശുദ്ധനാണ്. അവൻ തനിച്ചു താമസിക്കണം; അവന്റെ വാസസ്ഥലം പാളയത്തിനു പുറത്തായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ഇവിടെയുള്ള ‘അശുദ്ധൻ’ എന്നത് ലേവ്യനിയമത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള അശുദ്ധിനിലയെ സൂചിപ്പിക്കുന്നു; അത് നിർബന്ധമായും ധാർമിക കുറ്റബോധത്തെ സൂചിപ്പിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: രോഗബാധ
  rationale: נֶגַע എന്നത് പ്രഹരം, ബാധ, രോഗാവസ്ഥ എന്നിവയെ സൂചിപ്പിക്കാവുന്ന വിശാലപദമാണ്. ലേവ്യപുസ്തകം 13-ലെ പരിശോധനയ്ക്കു വിധേയമായ അവസ്ഥയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘രോഗബാധ’ തിരഞ്ഞെടുത്തു; നിർദിഷ്ടമായ ഒരു രോഗനാമം ഇതിൽ ചുമത്തുന്നില്ല.
- source_word: בּוֹ
  choice: അവനിലുള്ള
  rationale: בּוֹ എന്നതിന് ‘അവനിൽ/അവന്റെമേൽ’ എന്ന ഇരട്ട സാധ്യതയുണ്ട്. ‘രോഗബാധ’യോടൊപ്പം ‘അവനിലുള്ള’ എന്നത് സ്വാഭാവികമാണ്; എങ്കിലും മൂലപദത്തിന്റെ സ്ഥലബന്ധത്തിലെ ചെറിയ അസ്പഷ്ടത പ്രധാന ആശയത്തെ മാറ്റുന്നില്ല.
- source_word: יִטְמָא
  choice: അശുദ്ധനായിരിക്കും
  rationale: Qal imperfect ഇവിടെ നിയമപരമായി തുടരുന്ന നിലയെ സൂചിപ്പിക്കുന്നു. ‘അശുദ്ധനായിരിക്കും’ നിയമവാക്യത്തിന്റെ ഭാവവും തുടർച്ചയും നിലനിർത്തുന്നു.
- source_word: טָמֵא הוּא
  choice: അവൻ അശുദ്ധനാണ്
  rationale: ക്രിയയില്ലാത്ത ഈ എബ്രായ വാക്യം വ്യക്തിയുടെ നില ഊന്നിപ്പറയുന്നു. വേറിട്ട വാക്യമായി നിലനിർത്തി ആവർത്തനത്തിന്റെ ഊന്നൽ സംരക്ഷിച്ചു.
- source_word: בָּדָד
  choice: തനിച്ചു
  rationale: בָּדָד വേർപെട്ട് ഒറ്റയ്ക്കായിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തനിച്ചു’ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളമാണ്; ‘ഒറ്റപ്പെടുത്തലിൽ’ എന്നത് അനാവശ്യമായി സാങ്കേതികമാകും.
- source_word: יֵשֵׁב
  choice: താമസിക്കണം
  rationale: ישב എന്നതിന് ഇരിക്കുക, പാർക്കുക, താമസിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. വാസസ്ഥലത്തെക്കുറിച്ചുള്ള ഈ നിയമസന്ദർഭത്തിൽ ‘താമസിക്കണം’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്ത്
  rationale: മരുഭൂമിയിലെ സമൂഹവാസപരിധിക്കു പുറത്തുള്ള സ്ഥലം നേരിട്ട് സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: מוֹשָׁבוֹ
  choice: അവന്റെ വാസസ്ഥലം
  rationale: מוֹשָׁב താമസിക്കുന്ന സ്ഥലം അല്ലെങ്കിൽ പാർപ്പിടം എന്നർഥം നൽകുന്നു. ‘വാസസ്ഥലം’ മൂലത്തിലെ സ്ഥലസൂചന കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകം 13-ലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: טמא എന്നത് മുഖ്യപാഠത്തിൽ ‘അശുദ്ധൻ’ എന്നു മാത്രം വിവർത്തനം ചെയ്തു.
  alternative: ‘ആചാരപരമായി അശുദ്ധൻ’ അല്ലെങ്കിൽ ‘കർമപരമായി അശുദ്ധൻ’
  rationale: വാക്യം ലേവ്യനിയമത്തിലെ അശുദ്ധിനിലയെക്കുറിച്ചാണ്; അത് വ്യക്തിപരമായ ധാർമിക കുറ്റത്തെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല. എന്നാൽ എബ്രായപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണവിശേഷണം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ, കുറിപ്പിൽ പശ്ചാത്തലം വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമവാക്യശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തനഊന്നൽ വേറിട്ട വാക്യമായി സംരക്ഷിച്ചു. ‘പാളയം’, ‘അശുദ്ധൻ’, ‘വാസസ്ഥലം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും ഭാഷ അനാവശ്യമായി പുരാതനമാക്കിയിട്ടില്ല.
