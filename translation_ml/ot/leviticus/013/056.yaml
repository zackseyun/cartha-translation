id: LEV.13.56
reference: Leviticus 13:56
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם֮ רָאָ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע אַחֲרֵ֖י הֻכַּבֵּ֣ס אֹת֑/וֹ וְ/קָרַ֣ע אֹת֗/וֹ מִן הַ/בֶּ֨גֶד֙ א֣וֹ מִן הָ/ע֔וֹר א֥וֹ מִן הַ/שְּׁתִ֖י א֥וֹ מִן הָ/עֵֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: ml
  text: എന്നാൽ പുരോഹിതൻ പരിശോധിച്ച്, കഴുകിയശേഷം അതിൽ പാട് മങ്ങിയിരിക്കുന്നതായി കണ്ടാൽ, വസ്ത്രത്തിൽനിന്നോ തോലിൽനിന്നോ നെയ്ത്തിലെ നീളനൂലുകളിൽനിന്നോ കുറുകെനൂലുകളിൽനിന്നോ ആ ഭാഗം കീറിയെടുത്തുകളയണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... കണ്ടാൽ
  rationale: മുൻ നടപടിയുടെ തുടർച്ചയായ വ്യവസ്ഥയും നേരിയ വൈരുധ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: רָאָה הַכֹּהֵן
  choice: പുരോഹിതൻ അതു പരിശോധിക്കുമ്പോൾ ... കണ്ടാൽ
  rationale: മൂലക്രിയയുടെ ‘കാണുക’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, നിയമപരമായ പരിശോധനാസന്ദർഭവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: '...തായി കണ്ടാൽ'
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഊന്നൽ മലയാളവാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; കൃത്രിമമായ ‘ഇതാ’ ഒഴിവാക്കുന്നു.
- source_word: כֵּהָה הַנֶּגַע
  choice: പാട് മങ്ങിയിരിക്കുന്നതായി
  rationale: ബാധിതമായ അടയാളത്തിന്റെ തീവ്രത കുറഞ്ഞെന്ന വസ്ത്രസന്ദർഭത്തിലെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: കഴുകിയശേഷം
  rationale: കഴുകലിനു ശേഷമുള്ള അവസ്ഥയാണ് നിർണായകമെന്ന അർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְקָרַע אֹתוֹ
  choice: ആ ഭാഗം കീറിയെടുത്തുകളയണം
  rationale: മുഴുവൻ വസ്തുവല്ല, പാടുള്ള ഭാഗമാണ് നീക്കേണ്ടതെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: מִן הַבֶּגֶד
  choice: വസ്ത്രത്തിൽനിന്ന്
  rationale: בגד എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ സാധാരണവും വിശാലവുമായ മലയാള സമാനപദം.
- source_word: מִן הָעוֹר
  choice: തോലിൽനിന്ന്
  rationale: ഇവിടെ മനുഷ്യചർമ്മമല്ല, തോൽവസ്തുവാണ് ഉദ്ദേശിക്കുന്നത്; ‘തോൽ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִן הַשְּׁתִי
  choice: നെയ്ത്തിലെ നീളനൂലുകളിൽനിന്ന്
  rationale: warp എന്ന സാങ്കേതിക ആശയം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിവരണാത്മക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִן הָעֵרֶב
  choice: കുറുകെനൂലുകളിൽനിന്ന്
  rationale: weft/woof എന്നത് നെയ്ത്തിലെ കുറുകെയുള്ള നൂലുകളാണെന്ന് വ്യക്തമായി പ്രകടമാക്കുകയും നീളനൂലുകളോടുള്ള ജോടി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമനടപടി ശൈലി. സാങ്കേതിക നെയ്ത്തുപദങ്ങൾ അപരിചിതമായ കടംപദങ്ങളായി നൽകാതെ ‘നീളനൂലുകൾ’, ‘കുറുകെനൂലുകൾ’ എന്നു വിശദീകരിച്ചു. മൂലത്തിലെ വസ്ത്രം/തോൽ/നൂൽഘടനകളുടെ പര്യായപരമ്പര നിലനിർത്തി.
