  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ഒരാളുടെ ശരീരത്തിലെ ത്വക്കിൽ തീകൊണ്ടുണ്ടായ ഒരു പൊള്ളൽ ഉണ്ടാകുകയും, ആ പൊള്ളലിലെ പച്ചമാംസം[b] ചുവപ്പുകലർന്ന വെളുത്തതോ വെളുത്തതോ ആയ ഒരു തിളക്കമുള്ള പാടായിത്തീരുകയും ചെയ്താൽ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശരീരം’ എന്നിടത്ത് ‘മാംസം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദമായ בָשָׂר സാധാരണയായി ‘മാംസം’ എന്നാണ് അർഥമാക്കുന്നത്, എന്നാൽ ഇവിടെ ത്വക്‌രോഗനിയമത്തിൽ അത് മനുഷ്യശരീരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പച്ചമാംസം’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപ്രയോഗം പൊള്ളലേറ്റ ഭാഗത്ത് കാണപ്പെടുന്ന ജീവനുള്ള മാംസകലയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: אוֹ
  choice: അല്ലെങ്കിൽ ... ചെയ്താൽ
  rationale: നിയമനിർദേശത്തിലെ മറ്റൊരു സാഹചര്യം അവതരിപ്പിക്കുന്ന വിഭജനാർത്ഥവും വ്യവസ്ഥാഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָשָׂר
  choice: ഒരാളുടെ ശരീരം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘മാംസം’ ആണെങ്കിലും, ഇവിടെ രോഗനിർണയനിയമത്തിൽ മനുഷ്യശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ഒരാളുടെ ശരീരം’ എന്നു നൽകി.
- source_word: בְּעֹרוֹ
  choice: ശരീരത്തിലെ ത്വക്കിൽ
  rationale: ബാധിതനായ വ്യക്തിയുടെ ത്വക്കിനെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘ത്വക്കിൽ’ എന്നത് ഈ സാഹചര്യത്തിൽ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: מִכְוַת אֵשׁ
  choice: തീകൊണ്ടുള്ള പൊള്ളൽ
  rationale: തീ മൂലമുണ്ടായ പൊള്ളലെന്ന കാരണബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: וְהָיְתָה
  choice: മാറുകയും ചെയ്താൽ
  rationale: നടപടിക്രമപരമായ വിവരണത്തിൽ തുടർന്നുണ്ടാകുന്ന അവസ്ഥയെ മലയാള വ്യവസ്ഥാവാക്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִחְיַת הַמִּכְוָה
  choice: പൊള്ളലിലെ പച്ചമാംസം
  rationale: പൊള്ളലേറ്റ ഭാഗത്ത് കാണപ്പെടുന്ന ജീവനുള്ളതും മുറിവിൽ വെളിപ്പെട്ടതുമായ മാംസകലകളെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ മലയാളത്തിൽ ‘പച്ചമാംസം’ ഈ ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: בַּהֶרֶת
  choice: തിളക്കമുള്ള പാട്
  rationale: ലേവ്യപുസ്തകം 13-ലെ രോഗനിർണയ പദാവലിയിൽ ത്വക്കിൽ പ്രകടമായി കാണുന്ന തെളിഞ്ഞ പാടിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: ചുവപ്പുകലർന്ന വെളുത്തത്
  rationale: വെളുപ്പിൽ ചുവപ്പു കലർന്ന സംയുക്തവർണം എന്ന എബ്രായ വിവരണം അനാവശ്യമായി നിർണയിക്കാതെ നിലനിർത്തുന്നു.
- source_word: אוֹ לְבָנָה
  choice: അല്ലെങ്കിൽ വെളുത്തത്
  rationale: മറ്റൊരു വർണസാധ്യതയെ ലളിതമായി അതേപടി നിലനിർത്തുന്നു.
