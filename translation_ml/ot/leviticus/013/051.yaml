id: LEV.13.51
reference: Leviticus 13:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/רָאָ֨ה אֶת הַ/נֶּ֜גַע בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י כִּֽי פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בָ/ע֔וֹר לְ/כֹ֛ל אֲשֶׁר יֵעָשֶׂ֥ה הָ/ע֖וֹר לִ/מְלָאכָ֑ה צָרַ֧עַת מַמְאֶ֛רֶת הַ/נֶּ֖גַע טָמֵ֥א הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: ml
  text: ഏഴാം ദിവസം അവൻ ആ ബാധ[a] പരിശോധിക്കണം. വസ്ത്രത്തിലോ പാവുനൂലിലോ ഊടുനൂലിലോ[b] തോലിലോ, തോൽകൊണ്ടുണ്ടാക്കിയ ഏതെങ്കിലും വസ്തുവിലോ[c] ബാധ പടർന്നിട്ടുണ്ടെങ്കിൽ, അത് വിനാശകരമായ സാരാത്ത് ബാധയാണ്[d]; അത് അശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബാധ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം നെഗാ ആണ്; ഇവിടെ അത് വസ്ത്രത്തിലോ തോലിലോ കാണുന്ന ദോഷബാധയെയോ ബാധിത പാടിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: പാവുനൂൽ നെയ്ത്തിലെ നീളനൂലും ഊടുനൂൽ കുറുകെ നെയ്യുന്ന നൂലുമാണ്.
    reason: clarification
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: ‘തോൽ ഏതൊരു പണിക്കായി ഉപയോഗിക്കപ്പെടുന്നുവോ അതിലെല്ലാം.’'
    reason: lexical_alternative
  - marker: d
    text: എബ്രായത്തിൽ സാരാത്ത്. പരമ്പരാഗതമായി ഇത് ‘കുഷ്ഠം’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ടെങ്കിലും, ലേവ്യപുസ്തകത്തിൽ മനുഷ്യരിലെ വിവിധ ബാധകൾക്കും വസ്ത്രത്തിലും തോലിലും കാണുന്ന ബാധകൾക്കും ഈ പദം ഉപയോഗിക്കുന്നു; അതിനാൽ ഇത് ആധുനിക കുഷ്ഠരോഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: പരിശോധിക്കണം
  rationale: പുരോഹിതൻ നടത്തുന്ന ഔപചാരിക നിരീക്ഷണമാണ് സന്ദർഭം; അതിനാൽ വെറും ‘കാണുക’ എന്നതിനെക്കാൾ ‘പരിശോധിക്കുക’ യോജിക്കുന്നു.
- source_word: הַנֶּגַע
  choice: ബാധ
  rationale: വസ്ത്രത്തിലും തോലിലും കാണപ്പെടുകയും പടരുകയും ചെയ്യുന്ന ദോഷബാധയെ സൂചിപ്പിക്കാൻ സ്വാഭാവികവും വൈദ്യശാസ്ത്രപരമായി അതിരുകടക്കാത്തതുമായ പദം.
- source_word: פָשָׂה
  choice: പടർന്നിട്ടുണ്ടെങ്കിൽ
  rationale: ബാധ വ്യാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: בֶּגֶד
  choice: വസ്ത്രം
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ പൊതുവായ വസ്ത്രവസ്തുവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: שְׁתִי / עֵרֶב
  choice: പാവുനൂൽ / ഊടുനൂൽ
  rationale: നെയ്ത്തിലെ നീളദിശയിലുള്ള നൂലിനെയും കുറുകെയുള്ള നൂലിനെയും സൂചിപ്പിക്കുന്ന മലയാള സാങ്കേതിക പദങ്ങൾ.
- source_word: עוֹר
  choice: തോൽ
  rationale: പണിക്കായി ഉപയോഗിക്കുന്ന മൃഗത്തോൽ അഥവാ സംസ്കരിച്ച തോൽ എന്ന വിശാല അർഥം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: തോൽകൊണ്ടുണ്ടാക്കിയ ഏതെങ്കിലും വസ്തു
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ നിയമപരമായ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: നശിപ്പിക്കുന്ന തരത്തിലുള്ള സാരാത്ത് ബാധ
  rationale: מַמְאֶרֶת എന്നതിലെ ദോഷകരവും ക്ഷയിപ്പിക്കുന്നതുമായ ഭാവം നൽകുന്നു; צָרַעַת-നെ ആധുനിക കുഷ്ഠരോഗവുമായി തെറ്റായി സമീകരിക്കാതെ സാങ്കേതിക നാമമായി നിലനിർത്തുന്നു.
- source_word: טָמֵא הוּא
  choice: അത് അശുദ്ധമാണ്
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ അശുദ്ധസ്ഥിതി സംക്ഷിപ്തമായി പ്രസ്താവിക്കുന്നു.
theological_decisions:
- issue: צָרַעַת എന്ന ശുദ്ധിനിയമസംബന്ധിയായ പദത്തിന്റെ വിവർത്തനം
  choice: സാരാത്ത്
  alternative: കുഷ്ഠരോഗം; ത്വഗ്രോഗം; അശുദ്ധമാക്കുന്ന രോഗബാധ
  rationale: ഈ അധ്യായത്തിൽ ഈ പദം മനുഷ്യചർമ്മത്തിനു മാത്രമല്ല, വസ്ത്രത്തിനും തോലിനും ബാധകമാണ്. അതിനാൽ ഒരു പ്രത്യേക ആധുനിക രോഗനിർണയം ചുമത്താതെ എബ്രായ സാങ്കേതിക പദം ലിപ്യന്തരം ചെയ്ത് അടിക്കുറിപ്പിൽ അതിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- issue: טָמֵא എന്നതിന്റെ സ്വഭാവം
  choice: അശുദ്ധം
  alternative: ആചാരപരമായി അശുദ്ധം
  rationale: മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു; ലേവ്യപുസ്തകത്തിന്റെ സന്ദർഭം ഇത് ശുദ്ധി-അശുദ്ധി നിലയാണെന്ന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമശൈലി. നെയ്ത്തുസംബന്ധിയായ കൃത്യപദങ്ങൾ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. വൈദ്യശാസ്ത്രപരമായി തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘കുഷ്ഠം’ ഒഴിവാക്കി, മൂലത്തിലെ ശുദ്ധിനിയമസംബന്ധിയായ സാങ്കേതികതയും അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
