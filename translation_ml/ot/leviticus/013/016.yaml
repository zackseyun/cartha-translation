  yaml_path: translation/ot/leviticus/013/016.yaml
  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: ml
  text: അല്ലെങ്കിൽ പച്ചമാംസം[a] വീണ്ടും വെളുത്തതായാൽ, അയാൾ പുരോഹിതന്റെ അടുക്കൽ ചെല്ലണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, ‘ജീവനുള്ള മാംസം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ כִ֥י
  choice: അല്ലെങ്കിൽ ... ആയാൽ
  rationale: אוֹ ബദൽ സാഹചര്യം അവതരിപ്പിക്കുകയും כִּי നിബന്ധന സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; മലയാളത്തിൽ ഈ സംയോജനം സ്വാഭാവികമായി നിബന്ധനാപരമായ ബദൽ വ്യക്തമാക്കുന്നു.
- source_word: יָשׁ֛וּב
  choice: വീണ്ടും
  rationale: שוב മുൻ അവസ്ഥയിലേക്കുള്ള മടങ്ങിവരവ് സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള നിലമാറ്റക്രിയയോടൊപ്പം ‘വീണ്ടും’ എന്നത് ഈ തിരിച്ചുമാറ്റം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַבָּשָׂר הַחַי
  choice: പച്ചമാംസം
  rationale: പദശഃ ‘ജീവനുള്ള മാംസം’ എന്നാണ്. ഈ രോഗനിർണയസന്ദർഭത്തിൽ തൊലി പൊട്ടി വെളിപ്പെട്ടിരിക്കുന്ന ജീവനുള്ള മാംസകോശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പച്ചമാംസം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്. പദശഃ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְנֶהְפַּךְ לְלָבָן
  choice: മാറി വീണ്ടും വെളുത്തതായാൽ
  rationale: הפך എന്ന നിഫാൽ രൂപം അവസ്ഥാമാറ്റം സൂചിപ്പിക്കുന്നു; לְלָבָן അതിന്റെ ഫലമായ വെളുത്ത അവസ്ഥ വ്യക്തമാക്കുന്നു. שוב-ന്റെ തിരിച്ചുമാറ്റഭാവവും ചേർത്ത് മലയാളത്തിൽ സുതാര്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: וּבָא אֶל הַכֹּהֵן
  choice: അയാൾ പുരോഹിതന്റെ അടുക്കൽ ചെല്ലണം
  rationale: നിയമപരമായ നടപടിക്രമത്തിലെ അടുത്ത പടിയാണ് ഇത്. ‘ചെല്ലണം’ ആവശ്യകത വ്യക്തമാക്കുന്നു; ‘അടുക്കൽ’ പുരോഹിതനെ സമീപിക്കുന്ന ചലനം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമ-നടപടിക്രമ ശൈലി. ‘പച്ചമാംസം’ വൈദ്യസന്ദർഭത്തിലെ raw/live tissue എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; പദശഃ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
