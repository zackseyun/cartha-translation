id: LEV.13.29
reference: Leviticus 13:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִישׁ֙ א֣וֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה ב֖/וֹ נָ֑גַע בְּ/רֹ֖אשׁ א֥וֹ בְ/זָקָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/029.yaml
  text: When a man or a woman has an infection on the head or on the beard[b][a],
translation:
  language: ml
  text: ഒരു പുരുഷന്റെയോ സ്ത്രീയുടെയോ തലയിലോ[a] താടിയിലോ ഒരു ബാധ[b] ഉണ്ടായാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘തല’; ഈ സന്ദർഭത്തിൽ കൂടുതൽ പ്രത്യേകമായി തലയോട്ടിയിലെ ചർമം ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘രോഗബാധ,’ ‘ക്ഷതം,’ അല്ലെങ്കിൽ ‘പാട്’ എന്നും പരിഭാഷപ്പെടുത്താം; ലേവ്യപുസ്തകത്തിൽ എബ്രായത്തിലെ നെഗാ എന്നത് പുരോഹിതൻ പരിശോധിക്കുന്ന ദൃശ്യമായ ക്ഷതമോ രോഗപ്രകടനമോ സൂചിപ്പിക്കുന്ന വിശാലപദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: ഒരു പുരുഷന്റെയോ സ്ത്രീയുടെയോ
  rationale: എബ്രായമൂലം പുരുഷനെയും സ്ത്രീയെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ ഇരുവരെയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: ഉണ്ടായാൽ
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ ഒരു വ്യവസ്ഥാപിത സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാരൂപം ഉപയോഗിക്കുന്നു.
- source_word: יִהְיֶה בּוֹ
  choice: ഉണ്ടായാൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘അവനിൽ/അവൾക്കു ഉണ്ടായിരിക്കുക’ എന്ന ആശയം രോഗനിർണയസന്ദർഭത്തിന് ചേരുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: נָגַע
  choice: ബാധ
  rationale: ലേവ്യപുസ്തകം 13-ൽ പുരോഹിതൻ പരിശോധിക്കുന്ന ദൃശ്യമായ പാട്, ക്ഷതം, അല്ലെങ്കിൽ രോഗപ്രകടനം എന്നിവയെ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണിത്; ഒരു നിർദിഷ്ട ആധുനിക രോഗനിർണയം സൂചിപ്പിക്കാത്തതിനാൽ ‘ബാധ’ തിരഞ്ഞെടുത്തു.
- source_word: בְּ/רֹאשׁ
  choice: തലയിൽ
  rationale: മൂലത്തിലെ വിശാലമായ ‘തല’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ തലയോട്ടിയിലെ ചർമം ഉദ്ദേശിച്ചിരിക്കാം.
- source_word: בְ/זָקָן
  choice: താടിയിൽ
  rationale: זָקָן എന്നത് താടി അഥവാ താടിരോമമുള്ള ഭാഗം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്ഥലസൂചനയായി ‘താടിയിൽ’ സ്വാഭാവികമാണ്.
