translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ വാക്യത്തിന്റെ വ്യവസ്ഥാപിത നിയമശൈലി നിലനിർത്തിയിരിക്കുന്നു. ‘ബാധ’ എന്നത് ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ ഒരു നിർദിഷ്ട രോഗനിർണയം അനാവശ്യമായി ചുമത്തുന്നത് ഒഴിവാക്കുന്നു.
