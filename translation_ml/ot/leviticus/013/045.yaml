    rationale: ‘ഒരാളിൽ ആ ബാധ ഉണ്ടായിരിക്കുമ്പോൾ’ is less idiomatic because the same noun is repeated without specifying the bodily locus. ‘ഒരാളുടെ ശരീരത്തിൽ ആ ബാധയുണ്ടെങ്കിൽ’ is clearer and naturally conveys the condition ‘in whom the affliction is.’
  revised_text: ചർമരോഗബാധയുള്ള ഒരാളുടെ ശരീരത്തിൽ ആ ബാധയുണ്ടെങ്കിൽ, അയാളുടെ വസ്ത്രങ്ങൾ കീറിയിരിക്കണം; തലമുടി അഴിച്ചിട്ടിരിക്കണം; മേൽച്ചുണ്ട് മൂടണം[a]; ‘അശുദ്ധൻ, അശുദ്ധൻ!’ എന്ന് അയാൾ വിളിച്ചുപറയണം.
