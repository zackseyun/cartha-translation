  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: ml
  text: ചർമരോഗബാധയുള്ള ഒരാളുടെ ശരീരത്തിൽ ആ ബാധയുണ്ടെങ്കിൽ, അയാളുടെ വസ്ത്രങ്ങൾ കീറിയിരിക്കണം; തലമുടി അഴിച്ചിട്ടിരിക്കണം; മേൽച്ചുണ്ട് മൂടണം[a]; ‘അശുദ്ധൻ, അശുദ്ധൻ!’ എന്ന് അയാൾ വിളിച്ചുപറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മീശ മൂടണം.” എബ്രായപ്രയോഗം മേൽച്ചുണ്ടിന്റെയോ മീശയുടെയോ ഭാഗം മൂടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇത് ദുഃഖത്തിന്റെയും പൊതുമുന്നറിയിപ്പിന്റെയും അടയാളമായിരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: ചർമരോഗബാധയുള്ള ഒരാൾ
  rationale: ഇത് ഹാൻസൻസ് രോഗത്തെ മാത്രം സൂചിപ്പിക്കുന്ന പദമല്ല; ലേവ്യപുസ്തകത്തിലെ വിശാലമായ ചർമരോഗവിഭാഗത്തെ ആധുനിക വായനക്കാരന് തെറ്റിദ്ധാരണയില്ലാതെ അറിയിക്കുന്നു.
- source_word: הַנֶּגַע
  choice: ആ ബാധ
  rationale: ഇവിടെ נגע രോഗബാധയെയോ പ്രത്യക്ഷമായ രോഗലക്ഷണത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അണുബാധ’ എന്നു പറഞ്ഞാൽ ആധുനിക രോഗാണുസിദ്ധാന്തം അനാവശ്യമായി കടന്നുവരാം.
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: അയാളുടെ വസ്ത്രങ്ങൾ കീറിയിരിക്കണം
  rationale: പൊതുവായ ദുഃഖത്തിന്റെയും ദുരവസ്ഥയുടെയും അടയാളമായ കീറിയ വസ്ത്രങ്ങളെ നേരായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: തലമുടി അഴിച്ചിട്ടിരിക്കണം
  rationale: פָרוּעַ തല മുണ്ഡനം ചെയ്തതെന്നതിലുപരി മുടി കെട്ടാതെ അഴിച്ചിട്ടതോ ക്രമപ്പെടുത്താതെ വിട്ടതോ എന്ന ആശയം നൽകുന്നു.
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: മേൽച്ചുണ്ട് മൂടണം
  rationale: שָׂפָם മേൽച്ചുണ്ടിനെയോ മീശയുള്ള ഭാഗത്തെയോ സൂചിപ്പിക്കാം. മുഖത്തിന്റെ ആ ഭാഗം മൂടുന്ന പ്രവൃത്തിയെ ഈ പരിഭാഷ വ്യക്തമാക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: ‘അശുദ്ധൻ, അശുദ്ധൻ!’ എന്ന് അയാൾ വിളിച്ചുപറയണം
  rationale: ഇരട്ടിച്ചുപറയുന്ന טָמֵא ആചാരപരമായ അശുദ്ധാവസ്ഥയുടെ പരസ്യവും ഊന്നലുള്ളതുമായ അറിയിപ്പാണ്; ‘വിളിച്ചുപറയണം’ അതിന്റെ പൊതുമുന്നറിയിപ്പ് സ്വഭാവം പകർത്തുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകം 13-ലെ അശുദ്ധതാഭാഷയുടെ സ്വഭാവം
  choice: טָמֵא എന്നത് ധാർമിക കുറ്റബോധമല്ല, ആചാരപരവും സാമൂഹികവുമായ നില സൂചിപ്പിക്കുന്ന ‘അശുദ്ധൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മലിനൻ’ അല്ലെങ്കിൽ ‘തീണ്ടലുള്ളവൻ’
  rationale: ഇവിടെ പറയുന്നത് വ്യക്തിപരമായ പാപക്കുറ്റമോ ആധുനിക വൈദ്യശാസ്ത്രപരമായ രോഗനിർണയമോ നിർബന്ധമായും അല്ല. ‘അശുദ്ധൻ’ ലേവ്യനിയമത്തിലെ ആചാരപരമായ നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും എന്നാൽ നിയമഗ്രന്ഥത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘അയാൾ’ എന്ന രൂപം ആവർത്തനത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു; രോഗത്തെ ഹാൻസൻസ് രോഗമായി മാത്രം ചുരുക്കുന്ന പരമ്പരാഗത പദപ്രയോഗം ഒഴിവാക്കി.
