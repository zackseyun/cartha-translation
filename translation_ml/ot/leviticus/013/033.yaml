  text: וְ/הִ֨תְגַּלָּ֔ח וְ/אֶת הַ/נֶּ֖תֶק לֹ֣א יְגַלֵּ֑חַ וְ/הִסְגִּ֨יר הַ/כֹּהֵ֧ן אֶת הַ/נֶּ֛תֶק שִׁבְעַ֥ת יָמִ֖ים שֵׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/033.yaml
  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: ml
  text: അപ്പോൾ അയാൾ മുണ്ഡനം ചെയ്യണം; എന്നാൽ രോഗബാധിതഭാഗം[a] മുണ്ഡനം ചെയ്യരുത്.[b] പുരോഹിതൻ ആ രോഗബാധിതഭാഗം വീണ്ടും ഏഴു ദിവസത്തേക്ക് വേർതിരിച്ചു നിരീക്ഷണത്തിൽ വയ്ക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം ശിരസ്സിലോ താടിയിലോ ഉണ്ടാകുന്ന, സാധാരണയായി മുടികൊഴിച്ചിലുമായി ബന്ധപ്പെട്ട ഒരു പ്രത്യേക ബാധയെ സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ ആധുനിക രോഗനിർണയം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘രോഗബാധിതഭാഗം മുണ്ഡനം ചെയ്യരുത്’ എന്നാണ്. ചുറ്റുമുള്ള മുടി നീക്കിയശേഷം തുടർപരിശോധനയ്ക്കായി ബാധിതഭാഗം മുണ്ഡനം ചെയ്യാതെ വിടുക എന്നതാകാം ഉദ്ദേശ്യം.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: അപ്പോൾ അയാൾ തല മുണ്ഡനം ചെയ്യണം
  rationale: גלח എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ബാധിതനായ വ്യക്തി സ്വയം മുണ്ഡനം ചെയ്യുകയോ ചെയ്യിപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. രോഗം ശിരസ്സിലോ താടിയിലോ ഉള്ളതായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ നടപടിക്രമഭാഷയായി ‘തല മുണ്ഡനം ചെയ്യണം’ ഉപയോഗിച്ചു.
- source_word: הַנֶּתֶק
  choice: ശിരസ്സിലോ താടിയിലോ ഉള്ള രോഗബാധിതഭാഗം
  rationale: נֶתֶק സാധാരണ ചൊറിച്ചിലല്ല; ശിരസ്സിലോ താടിയിലോ മുടികൊഴിച്ചിലുമായി ബന്ധപ്പെട്ട ഒരു പ്രത്യേക ബാധയാണ്. അതിന്റെ കൃത്യമായ ആധുനിക രോഗനിർണയം ഉറപ്പില്ലാത്തതിനാൽ പൊതുവായെങ്കിലും സന്ദർഭസൂചകമായ പദപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: לֹא יְגַלֵּחַ
  choice: മുണ്ഡനം ചെയ്യരുത്
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണക്രിയ നിയമനിർദേശത്തിൽ നിരോധനം പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: എന്നാൽ ശിരസ്സിലോ താടിയിലോ ഉള്ള രോഗബാധിതഭാഗം മുണ്ഡനം ചെയ്യരുത്
  rationale: എബ്രായത്തിൽ נתק നേരിട്ടുള്ള കർമമായതിനാൽ ബാധിതഭാഗം തന്നെയാണ് മുണ്ഡനം ചെയ്യാതിരിക്കേണ്ടത്. ‘ചുറ്റും’ എന്ന ആശയം മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וְהִסְגִּיר
  choice: മാറ്റിപ്പാർപ്പിക്കണം
  rationale: ലേവ്യപുസ്തകം 13-ലെ ഈ ക്രിയ പുരോഹിതൻ പരിശോധനയ്ക്കായി വ്യക്തിയെ താൽക്കാലികമായി വേർതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ക്വാറന്റൈൻ’ എന്ന ആധുനിക വൈദ്യപദം ഒഴിവാക്കി സ്വാഭാവികമായ മലയാളപ്രയോഗം സ്വീകരിച്ചു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യനിയമങ്ങളിലെ כהן എന്ന പദത്തിന്റെ പ്രമാണികവും സ്വാഭാവികവുമായ മലയാളപരിഭാഷ.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസത്തേക്ക്
  rationale: കാലദൈർഘ്യം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: שֵׁנִית
  choice: വീണ്ടും
  rationale: ഇത് രണ്ടാമത്തെ ഏഴുദിവസത്തെ വേർതിരിക്കൽ ആണെന്ന് സന്ദർഭത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
