translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ഗൗരവമുള്ള നിയമനടപടി ശൈലി ഉപയോഗിച്ചു. സാങ്കേതിക രോഗനാമം അനുമാനിക്കാതെ മൂലപാഠത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി. മുഖ്യവാക്യത്തിലെ ‘രോഗബാധിതഭാഗമുള്ളയാളെ’ എന്ന പ്രയോഗം וְהִסְגִּיר אֶת־הַנֶּתֶק എന്ന സംക്ഷിപ്ത എബ്രായ നടപടിഭാഷയുടെ പ്രായോഗിക അർഥം വ്യക്തമാക്കുന്നു.
