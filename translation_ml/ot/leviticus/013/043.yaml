translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമവിവരണശൈലി സ്വീകരിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന വ്യവസ്ഥാവാക്യമായതിനാൽ അവസാനത്തിൽ അർധവിരാമസദൃശമായ തുടർച്ചാഭാവം നൽകാൻ കോമ നിലനിർത്തി. സാങ്കേതിക വൈദ്യപരമായ അതിനിർണ്ണയം ഒഴിവാക്കി, ഹീബ്രുവിലെ ദൃശ്യപരിശോധനാഭാഷയും വർണവിവരണത്തിലെ തുറന്ന സ്വഭാവവും സംരക്ഷിച്ചു.
