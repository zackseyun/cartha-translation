translation:
  language: ml
  text: പുരോഹിതൻ അവനെ പരിശോധിക്കുന്നു; ഇതാ, രോഗബാധയുടെ വീക്കം അവന്റെ തലയുടെ പിൻഭാഗത്തെ കഷണ്ടിയിലോ മുൻഭാഗത്തെ കഷണ്ടിയിലോ[b] വെളുപ്പും ചുവപ്പും കലർന്നതായി, ശരീരചർമത്തിലെ ത്വഗ്രോഗത്തിന്റെ[a] രൂപംപോലെയുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ צָרַעַת (ത്സാരാത്ത്) എന്ന പദം പരമ്പരാഗതമായി ‘കുഷ്ഠം’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ടെങ്കിലും, ലേവ്യപുസ്തകത്തിൽ അത് ഹാൻസൻ രോഗം മാത്രമല്ല, വിവിധ ഗുരുതരമായ ത്വഗ്രോഗാവസ്ഥകളെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: കഷണ്ടിയെ സൂചിപ്പിക്കുന്ന ഈ രണ്ടു എബ്രായപദങ്ങൾ തലയുടെ പിൻഭാഗത്തെയും മുൻഭാഗത്തെയും വേർതിരിക്കുന്നതായി തോന്നുന്നു; ആ വ്യത്യാസം ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְרָאָה אֹתוֹ הַכֹּהֵן
  choice: പുരോഹിതൻ അവനെ പരിശോധിക്കുമ്പോൾ
  rationale: ראה എന്നതിന് അടിസ്ഥാനമായി ‘കാണുക’ എന്നർഥമുണ്ടെങ്കിലും, ലേവ്യപുസ്തകം 13-ലെ പുരോഹിതപരിശോധനാസന്ദർഭത്തിൽ ‘പരിശോധിക്കുക’ എന്നതാണ് സ്വാഭാവികവും സന്ദർഭോചിതവും. തുടർന്നുവരുന്ന നിയമവാക്യവുമായി ബന്ധിപ്പിക്കാൻ ‘പരിശോധിക്കുമ്പോൾ’ എന്നു നൽകി.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പരിശോധനയിൽ കണ്ടെത്തിയ കാര്യം ശ്രദ്ധയിൽപ്പെടുത്തുന്ന ഹീബ്രു സൂചനാപദത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: שְׂאֵת הַנֶּגַע
  choice: രോഗബാധയുടെ വീക്കം
  rationale: שְׂאֵת ഉയർന്ന പാടിനെയോ വീക്കത്തെയോ സൂചിപ്പിക്കുന്നു; נֶגַע ഇവിടെ പരിശോധിക്കപ്പെടുന്ന രോഗബാധയാണ്. ‘രോഗബാധയുടെ വീക്കം’ രണ്ടിന്റെയും ആശയം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: വെളുപ്പിൽ ചുവപ്പുകലർന്നത്
  rationale: ആദ്യം വരുന്ന ‘വെളുപ്പ്’ എന്ന വർണഘടകവും അതിൽ കലർന്ന ചുവപ്പുനിറവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; നിറത്തിന്റെ കൃത്യമായ അനുപാതം നിർണ്ണയിക്കുന്നില്ല.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: അവന്റെ തലയുടെ പിൻഭാഗത്തെ കഷണ്ടിയിലോ മുൻഭാഗത്തെ കഷണ്ടിയിലോ
  rationale: രണ്ടു വ്യത്യസ്ത കഷണ്ടിസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്ന പദവ്യത്യാസം നിലനിർത്തുന്നു. അവ സാധാരണയായി തലയുടെ പിൻഭാഗവും മുൻഭാഗവും എന്ന് മനസ്സിലാക്കപ്പെടുന്നു.
- source_word: כְּמַרְאֵה
  choice: കാഴ്ചപോലെയുള്ളത്
  rationale: രോഗനിർണയപരമായ ദൃശ്യസാദൃശ്യം വ്യക്തമാക്കുന്ന താരതമ്യപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: צָרַעַת
  choice: ത്വഗ്രോഗം
  rationale: ഈ ഹീബ്രുപദം ഹാൻസൻ രോഗം മാത്രമല്ല, ലേവ്യപുസ്തകത്തിൽ വിശാലമായ രോഗാവസ്ഥകളെ സൂചിപ്പിക്കുന്നു; അതിനാൽ പരമ്പരാഗതമായ ‘കുഷ്ഠം’ എന്നതിനു പകരം വിശാലമായ ‘ത്വഗ്രോഗം’ ഉപയോഗിച്ചു.
- source_word: עוֹר בָּשָׂר
  choice: ശരീരചർമത്തിലെ
  rationale: ‘മാംസത്തിന്റെ ചർമം’ എന്ന അക്ഷരാർഥത്തെ അസ്വാഭാവികമാക്കാതെ ശരീരത്തിലെ ചർമം എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
