  language: ml
  text: ഒരു വ്യക്തിക്ക് കുഷ്ഠരോഗബാധ ഉണ്ടാകുമ്പോൾ[a], ആ വ്യക്തിയെ പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ צָרַעַת (ത്സാരാഅത്ത്) എന്ന പദം പരമ്പരാഗതമായി ‘കുഷ്ഠരോഗം’ എന്നു വിവർത്തനം ചെയ്യപ്പെടുന്നു. എന്നാൽ അത് ആധുനിക ഹാൻസൻ രോഗത്തെ മാത്രം സൂചിപ്പിക്കാതെ, പലതരം ചർമ്മരോഗങ്ങളെയോ ചർമ്മാവസ്ഥകളെയോ ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: രോഗബാധ
  rationale: ലേവ്യപുസ്തകം 13-ലെ പരിശോധനാസന്ദർഭത്തിൽ കാണാവുന്ന രോഗാവസ്ഥയെയോ ബാധയെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: צָרַעַת
  choice: കുഷ്ഠരോഗം
  rationale: പരമ്പരാഗതവും വായനക്കാർക്ക് പരിചിതവുമായ പദം നിലനിർത്തുന്നു; എന്നാൽ ആധുനിക ഹാൻസൻ രോഗത്തിൽ മാത്രം ഇതിനെ ഒതുക്കരുതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: כִּי תִהְיֶה
  choice: ഉണ്ടാകുമ്പോൾ
  rationale: കേസുനിയമത്തിലെ സാഹചര്യം അവതരിപ്പിക്കുന്ന כִּי-യെ ‘എപ്പോൾ/ഉണ്ടാകുമ്പോൾ’ എന്നർഥത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; תִהְיֶה എന്ന ‘ഉണ്ടായിരിക്കുക’ എന്ന ക്രിയയുടെ ലാളിത്യവും നിലനിർത്തുന്നു.
- source_word: בְּאָדָם
  choice: ഒരാളിൽ
  rationale: אָדָם ഇവിടെ ഒരു മനുഷ്യവ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ഒരാളിൽ’ ലിംഗം അനാവശ്യമായി നിർണ്ണയിക്കാതെ ഏകവചനവും നിയമപരമായ പൊതുപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: וְהוּבָא
  choice: അയാളെ ... കൊണ്ടുവരണം
  rationale: ഹീബ്രുവിലെ കർമണിപ്രയോഗവും തുടർന്നുള്ള നടപടിക്രമവും സ്വാഭാവിക മലയാളത്തിൽ നിർബന്ധാത്മക നിയമഭാഷയായി നൽകുന്നു.
- source_word: אֶל הַכֹּהֵן
  choice: പുരോഹിതന്റെ അടുക്കൽ
  rationale: നിർദ്ദിഷ്ട പരിശോധന നിർവഹിക്കുന്ന പുരോഹിതനെയാണ് നിർദ്ദേശകപ്രത്യയമുള്ള ഹീബ്രു സൂചിപ്പിക്കുന്നത്; ‘അടുക്കൽ’ ലക്ഷ്യസ്ഥാനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: צָרַעַת എന്ന പദത്തിന്റെ രോഗപരമായ പരിധി
  choice: മുഖ്യവാക്യത്തിൽ ‘കുഷ്ഠരോഗം’, അടിക്കുറിപ്പിൽ വിശാലമായ അർഥപരിധി
  alternative: ത്വഗ്രോഗം
  rationale: പരമ്പരാഗത ബൈബിൾ പദപ്രയോഗം തിരിച്ചറിയാവുന്നവിധം നിലനിർത്തുമ്പോഴും, പദം ആധുനിക ഹാൻസൻ രോഗത്തെക്കാൾ വിശാലമായ ഗുരുതര ചർമ്മാവസ്ഥകൾ ഉൾക്കൊള്ളാമെന്ന യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: אָדָם എന്ന പൊതുവാചക ഏകവചനത്തിന്റെ വിവർത്തനം
  choice: ഒരാൾ
  alternative: മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ രോഗബാധയുള്ള ഏതൊരു മനുഷ്യവ്യക്തിയെയും ഉദ്ദേശിക്കുന്നു. ‘ഒരാൾ’ ഏകവചന പൊതുസൂചന സ്വാഭാവികമായി നൽകുന്നു; വാചകം പുരുഷന്മാർക്കു മാത്രമാണെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ സാഹചര്യവും നടപടിക്രമവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
