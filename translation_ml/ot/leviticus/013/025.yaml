  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: ml
  text: പുരോഹിതൻ അതു പരിശോധിക്കണം. ഇതാ, ആ തിളക്കമുള്ള പാടിലെ രോമം വെളുത്തതായി മാറിയിരിക്കുന്നു; അതിന്റെ രൂപം തൊലിയെക്കാൾ ആഴമുള്ളതായി കാണപ്പെടുന്നു. അതു പൊള്ളലേറ്റ ഭാഗത്ത് പൊട്ടിപ്പുറപ്പെട്ട ത്വഗ്രോഗമാണ്[a]. പുരോഹിതൻ അയാളെ അശുദ്ധനെന്ന് പ്രഖ്യാപിക്കണം. അതു ത്വഗ്രോഗബാധയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ ‘ത്സാരാഅത്ത്’ എന്നത് ഗുരുതരമായ ത്വക്‌ബാധകളെ സൂചിപ്പിക്കുന്ന വിശാലമായ പദമാണ്; പരമ്പരാഗതമായി ഇതിനെ ‘കുഷ്ഠം’ എന്നു വിവർത്തനം ചെയ്തിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: പരിശോധിക്കണം
  rationale: പുരോഹിതന്റെ ഔദ്യോഗിക രോഗനിർണയപരമായ നിരീക്ഷണമാണ് സന്ദർഭം; വെറുമൊരു ‘കാണൽ’ എന്നതിനെക്കാൾ ‘പരിശോധിക്കൽ’ അതു വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בַּהֶרֶת
  choice: തിളങ്ങുന്ന പാട്
  rationale: ചർമ്മത്തിൽ കാണുന്ന പ്രകാശമുള്ളതോ തിളക്കമുള്ളതോ ആയ പാടിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക വൈദ്യശാസ്ത്രപരമായ നിർണയം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: രോമം വെളുത്തതായി മാറിയിരിക്കുന്നു
  rationale: രോമത്തിനുണ്ടായ മാറ്റത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ക്രിയാരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: അതു തൊലിയെക്കാൾ ആഴമുള്ളതായി കാണപ്പെടുന്നു
  rationale: യഥാർത്ഥ ശാരീരിക ആഴമാണോ കാഴ്ചയിലെ താഴ്‌ച്ചയാണോ എന്ന് അമിതമായി നിർണയിക്കാതെ ദൃശ്യരൂപത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: צָרַעַת
  choice: ത്വഗ്രോഗം
  rationale: ഈ എബ്രായപദം ആധുനിക ഹാൻസൻ രോഗത്തേക്കാൾ വിശാലമായ ആചാരപരവും ചർമ്മസംബന്ധവുമായ ബാധാവർഗത്തെ സൂചിപ്പിക്കുന്നു; ‘ത്വഗ്രോഗം’ അനാവശ്യമായ വൈദ്യശാസ്ത്രപരമായ പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു.
- source_word: מִכְוָה
  choice: പൊള്ളലിന്റെ പാട്
  rationale: മുൻപ് പൊള്ളലേറ്റ ഭാഗത്തെയോ അതിന്റെ ശേഷിപ്പായ പാടിനെയോ സന്ദർഭം സൂചിപ്പിക്കുന്നു.
- source_word: פָּרָחָה
  choice: പൊട്ടിപ്പുറപ്പെട്ട
  rationale: ചർമ്മബാധയുടെ ഉദ്ഭവത്തെയോ വികാസത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളസമാനതയാണ്.
- source_word: טִמֵּא אֹתוֹ
  choice: അയാളെ അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതൻ അശുദ്ധി സൃഷ്ടിക്കുന്നു എന്നതല്ല, ആചാരപരമായ വിധി ഔദ്യോഗികമായി പ്രഖ്യാപിക്കുന്നു എന്നതാണ് ക്രിയയുടെ സന്ദർഭാർഥം.
- source_word: נֶגַע צָרַעַת
  choice: ത്വഗ്രോഗബാധ
  rationale: נֶגַע സൂചിപ്പിക്കുന്ന ബാധയെയോ ക്ഷതത്തെയോ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുകയും צָרַעַת എന്ന വിശാലവർഗവുമായുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധിനിയമത്തിൽ צָרַעַת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ത്വഗ്രോഗം
  alternative: കുഷ്ഠം
  rationale: צָרַעַת ആധുനികമായി നിർവചിക്കുന്ന കുഷ്ഠരോഗത്തിൽ മാത്രം ഒതുങ്ങുന്നില്ല. ‘ത്വഗ്രോഗം’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുകയും കാലാനുചിതമായ രോഗനിർണയം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ പുരോഹിതനിയമത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. וְהִנֵּה എന്ന ശ്രദ്ധാകർഷക കണം ‘ഇതാ’ എന്നു പ്രകടമാക്കി; രോഗാവസ്ഥയെ ആധുനിക വൈദ്യശാസ്ത്രവിഭാഗവുമായി സമീകരിച്ചിട്ടില്ല.
