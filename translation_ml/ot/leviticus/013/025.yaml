review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the priest's formal examination, the white hair, the visibly deeper lesion, the outbreak, and the ritual declaration of uncleanness. However, מִכְוָה denotes the burned area/wound and does not specifically require a healed 'scar'; 'പൊള്ളലേറ്റ ഭാഗം' is more source-neutral than 'പൊള്ളലിന്റെ പാട്.'
  naturalness: The Malayalam is generally clear and modern. 'തിളക്കമുള്ള പാട്' is slightly more idiomatic for a visible bright lesion than 'തിളങ്ങുന്ന പാട്,' while retaining the concrete diagnostic sense.
  terminology: '''ത്വഗ്രോഗം'' appropriately avoids identifying צָרַעַת with modern Hansen''s disease. The footnote correctly preserves the traditional rendering as an alternative without making it the main text. ''അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം'' properly conveys the priestly ritual verdict.'
  issues:
