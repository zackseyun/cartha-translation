    issue: മִכְוָה is rendered as 'പൊള്ളലിന്റെ പാട്.'
    rationale: '''Scar'' narrows the Hebrew, which refers more broadly to the site or wound of a burn. ''പൊള്ളലേറ്റ ഭാഗം'' preserves the source''s scope and remains natural Malayalam.'
  - severity: low
    issue: The rendering of בַּהֶרֶת can be made more idiomatic.
    rationale: '''തിളക്കമുള്ള പാട്'' naturally describes a bright skin patch in Malayalam without adding medical specificity.'
