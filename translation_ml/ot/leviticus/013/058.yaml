source:
  edition: WLC
  text: וְ/הַ/בֶּ֡גֶד אֽוֹ הַ/שְּׁתִ֨י אוֹ הָ/עֵ֜רֶב אֽוֹ כָל כְּלִ֤י הָ/עוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְ/סָ֥ר מֵ/הֶ֖ם הַ/נָּ֑גַע וְ/כֻבַּ֥ס שֵׁנִ֖ית וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: ml
  text: നിങ്ങൾ കഴുകുന്ന വസ്ത്രമോ നെടുനൂലോ കുറുക്കുനൂലോ[a] തുകൽകൊണ്ടുള്ള ഏതെങ്കിലും സാധനമോ—അവയിൽനിന്ന് ബാധ നീങ്ങിപ്പോയാൽ—രണ്ടാം പ്രാവശ്യം കഴുകണം; അപ്പോൾ അത് ശുദ്ധമാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, നെടുനൂലുകൾക്കു കുറുകെ നെയ്യുന്ന നൂൽ; ഇതിനെ ‘ഊടുനൂൽ’ എന്നും പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: വസ്ത്രം
  rationale: בגד എന്ന പൊതുപദത്തിന് സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളപദം; ഉടുപ്പിനെയും വസ്ത്രവസ്തുവിനെയും സൂചിപ്പിക്കാൻ കഴിയും.
- source_word: הַשְּׁתִי
  choice: നെടുനൂൽ
  rationale: നെയ്ത്തിൽ നീളത്തിൽ ക്രമീകരിക്കുന്ന warp നൂലുകളെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הָעֵרֶב
  choice: കുറുക്കുനൂൽ
  rationale: നെടുനൂലുകൾക്കു കുറുകെ നെയ്യുന്ന weft നൂലുകളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; സാങ്കേതികമായ 'ഊടുനൂൽ' എന്ന പദം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כָל כְּלִי הָעוֹר
  choice: തുകൽകൊണ്ടുള്ള ഏതെങ്കിലും സാധനം
  rationale: כְּלִי എന്ന വിശാലമായ അർഥം 'പാത്രം' എന്നതിലേക്കു ചുരുക്കാതെ, തുകൽകൊണ്ടുള്ള ഏതു വസ്തുവിനെയും ഉൾക്കൊള്ളുന്നു.
- source_word: תְּכַבֵּס
  choice: നിങ്ങൾ കഴുകിയ
  rationale: വസ്ത്രാദികൾ കഴുകുക എന്ന כבס-ന്റെ പീയേൽ അർഥവും ഏകവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: הַנָּגַע
  choice: ബാധ
  rationale: വസ്തുവിൽ കാണപ്പെടുന്ന ദൂഷിത അടയാളത്തെയോ പടർച്ചയെയോ സൂചിപ്പിക്കുന്ന വിശാലപദം; ആധുനിക വൈദ്യശാസ്ത്രപരമായ കൃത്യനിർണയം അനാവശ്യമായി ആരോപിക്കുന്നില്ല.
- source_word: וְסָר מֵהֶם
  choice: അവയിൽനിന്ന് ബാധ നീങ്ങിപ്പോയാൽ
  rationale: ബന്ധവാക്യത്തിലെ സംഭവത്തെ തുടർന്നുള്ള നടപടിയുടെ വ്യവസ്ഥയായി സന്ദർഭം വ്യക്തമാക്കുന്നു; 'അവയിൽനിന്ന്' എന്ന ബഹുവചന സൂചനയും നിലനിർത്തുന്നു.
- source_word: וְכֻבַּס שֵׁנִית
  choice: രണ്ടാം പ്രാവശ്യം കഴുകണം
  rationale: ആവർത്തിച്ചുള്ള കഴുകലും നടപടിക്രമപരമായ നിർബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְטָהֵר
  choice: അപ്പോൾ അത് ശുദ്ധമാകും
  rationale: ആചാരപരമായ ശുദ്ധസ്ഥിതി സൂചിപ്പിക്കുന്ന טהר-ന്റെ ഫലപ്രാപ്തി വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: וְסָר എന്ന സംയോജകപ്രയോഗത്തിന്റെ വ്യവസ്ഥാത്മക സ്വഭാവം
  choice: അവയിൽനിന്ന് ബാധ നീങ്ങിപ്പോയാൽ
  alternative: അവയിൽനിന്ന് ബാധ നീങ്ങിപ്പോകുകയും ചെയ്താൽ
  rationale: ഹീബ്രുവിൽ നേരിട്ടുള്ള വ്യവസ്ഥാസൂചകപദമില്ലെങ്കിലും, ബാധ നീങ്ങിയ വസ്തുവിന് തുടർന്ന് എന്തു ചെയ്യണമെന്ന നടപടിക്രമമാണ് സന്ദർഭം വിവരിക്കുന്നത്. അതിനാൽ മലയാളത്തിൽ വ്യവസ്ഥാസംബന്ധം വ്യക്തമാക്കുന്നു; ഇതിലൂടെ ആചാരശുദ്ധിയുടെ അർഥം അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നടപടിക്രമശൈലി ഉപയോഗിച്ചു. സാങ്കേതിക നെയ്ത്തുപദങ്ങൾ സാധാരണ വായനക്കാർക്കായി 'നെടുനൂൽ', 'കുറുക്കുനൂൽ' എന്നു വ്യക്തമാക്കി; പരമ്പരാഗത സാങ്കേതിക പര്യായം അടിക്കുറിപ്പിൽ നൽകി.
