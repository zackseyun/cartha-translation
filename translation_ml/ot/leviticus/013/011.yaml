source:
  edition: WLC
  text: צָרַ֨עַת נוֹשֶׁ֤נֶת הִוא֙ בְּ/ע֣וֹר בְּשָׂר֔/וֹ וְ/טִמְּא֖/וֹ הַ/כֹּהֵ֑ן לֹ֣א יַסְגִּרֶ֔/נּוּ כִּ֥י טָמֵ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: ml
  text: അത് അവന്റെ ശരീരത്തിന്റെ ചർമ്മത്തിലുള്ള ദീർഘകാലമായി നിലനിൽക്കുന്ന ചർമ്മരോഗമാണ്[a]. പുരോഹിതൻ അവനെ അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം. അവൻ അശുദ്ധനായതിനാൽ പുരോഹിതൻ അവനെ വേർതിരിച്ചു പാർപ്പിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദീർഘകാലമായി നിലനിൽക്കുന്ന ചർമ്മരോഗം.” പരമ്പരാഗത പരിഭാഷകൾ צָרַעַת എന്ന പദത്തെ പലപ്പോഴും “കുഷ്ഠരോഗം” എന്നു പരിഭാഷപ്പെടുത്തുന്നു. എന്നാൽ ലേവ്യപുസ്തകത്തിൽ ഈ എബ്രായപദം ആധുനിക കുഷ്ഠരോഗത്തെക്കാൾ വിശാലമായ പലതരം ചർമ്മാവസ്ഥകളെ ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: ത്വഗ്രോഗം
  rationale: ലേവ്യപുസ്തകത്തിൽ ഈ എബ്രായപദം ആധുനിക കുഷ്ഠരോഗം (ഹാൻസൻസ് രോഗം) മാത്രമല്ല, പലതരം ഗുരുതര ത്വക്ക് ബാധകളെ സൂചിപ്പിക്കുന്നു. അതിനാൽ തെറ്റായ വൈദ്യശാസ്ത്രപരമായ കൃത്യത ഒഴിവാക്കാൻ പൊതുവായ ‘ത്വഗ്രോഗം’ ഉപയോഗിച്ചു.
- source_word: נוֹשֶׁנֶת
  choice: പഴക്കംചെന്ന
  rationale: ഈ രൂപം പഴയതോ ഏറെക്കാലമായി നിലനിൽക്കുന്നതോ ആയ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘പഴക്കംചെന്ന’ എന്നത് രോഗം നേരത്തേ മുതൽ നിലനിൽക്കുന്നു എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും ‘വിട്ടുമാറാത്ത’ എന്നു പറഞ്ഞ് മൂലത്തിൽ ഇല്ലാത്ത സ്ഥിരത നിർബന്ധമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: അവന്റെ ശരീരത്തിന്റെ ത്വക്കിലുള്ള
  rationale: പദസമുച്ചയത്തിന്റെ ശാരീരിക അർഥം വ്യക്തമായി നിലനിർത്തുന്നു; ഇവിടെ ‘മാംസം’ എന്നതിനെക്കാൾ ആധുനിക മലയാളത്തിൽ ‘ശരീരം’ സ്വാഭാവികമാണ്.
- source_word: וְטִמְּאוֹ
  choice: അവനെ അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതൻ ആ വ്യക്തിയെ അശുദ്ധനാക്കുന്നു എന്നല്ല, ആചാരപരമായ അവസ്ഥ ഔദ്യോഗികമായി നിർണയിച്ചു പ്രഖ്യാപിക്കുന്നു എന്ന പുരോഹിത-നിയമപരമായ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാസംബന്ധിയായ പദവിയുടെ നേരിട്ടുള്ള സാധാരണ മലയാളരൂപം.
- source_word: לֹא יַסְגִּירֶנּוּ
  choice: അവനെ നിരീക്ഷണത്തിനായി മാറ്റിപ്പാർപ്പിക്കേണ്ടതില്ല
  rationale: സന്ദർഭത്തിൽ രോഗനിർണയം ഉറപ്പാക്കാൻ ഒരാളെ വേർതിരിച്ചു പാർപ്പിക്കുന്നതാണ് ഉദ്ദേശ്യം. ‘ക്വാറന്റൈൻ’ പോലുള്ള ആധുനിക വൈദ്യപദം ഒഴിവാക്കി നടപടിയുടെ ഉദ്ദേശ്യം വ്യക്തമായി പറഞ്ഞു.
- source_word: כִּי טָמֵא הוּא
  choice: കാരണം അവൻ അശുദ്ധനാണ്
  rationale: കൂടുതൽ നിരീക്ഷണകാലം ആവശ്യമില്ലാത്തതിന്റെ കാരണം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്ന טמא എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അശുദ്ധൻ
  alternative: അശുചിയായവൻ
  rationale: ഇവിടെ വ്യക്തിപരമായ ധാർമ്മിക കുറ്റമല്ല, ആചാര-നിയമപരമായ നിലയാണ് ഉദ്ദേശിക്കുന്നത്. ‘അശുദ്ധൻ’ സ്ഥാപിതമായ ബൈബിൾ പദപ്രയോഗം നിലനിർത്തുന്നു.
- issue: צָרַעַת എന്നതിനെ കുഷ്ഠരോഗമായി പ്രത്യേകീകരിക്കണമോ എന്നത്
  choice: ത്വഗ്രോഗം
  alternative: കുഷ്ഠരോഗം
  rationale: മൂലപദം ആധുനിക ഹാൻസൻസ് രോഗത്തേക്കാൾ വിശാലമായ ത്വക്ക് അവസ്ഥകളെ ഉൾക്കൊള്ളുന്നു; അതിനാൽ ഒരു നിർദിഷ്ട രോഗവുമായി തെറ്റായി സമീകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രോഗനിർണയസന്ദർഭത്തിന്റെ ഔദ്യോഗിക സ്വരം നിലനിർത്തി; അതേസമയം ആധുനിക വൈദ്യശാസ്ത്രപരമായ അതിനിർദിഷ്ടത ഒഴിവാക്കി.
