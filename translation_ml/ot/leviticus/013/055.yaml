  terminology: ‘അശുദ്ധം’ appropriately preserves Levitical ritual terminology. ‘രോഗബാധിതമായ ഭാഗം’ is understandable, but the context is a material affliction rather than necessarily a human disease; ‘ബാധിതമായ ഭാഗം’ avoids over-specifying it. ‘നശിപ്പിക്കുന്ന കേട്’ communicates the destructive sense of פְּחֶתֶת without claiming a modern diagnosis.
  issues:
