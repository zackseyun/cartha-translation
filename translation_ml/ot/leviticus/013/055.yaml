  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: ml
  text: ബാധിതമായ ഭാഗം കഴുകിയശേഷം പുരോഹിതൻ അതു പരിശോധിക്കണം. ബാധിതമായ ഭാഗത്തിന്റെ രൂപഭാവം മാറാതിരിക്കുകയും അതു പടരാതിരിക്കുകയും ചെയ്താൽ, അത് അശുദ്ധമാണ്. അതു തീയിൽ ഇട്ട് ചുട്ടുകളയണം; അത് വസ്തുവിനെ നശിപ്പിക്കുന്ന കേടാണ്—അതിന്റെ ഒരു വശത്തോ മറുവശത്തോ ആയാലും[c].[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിറം.” ഹീബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “അതിന്റെ കണ്ണ്” എന്നാണ്; അത് ദൃശ്യമായ രൂപത്തെയോ നിറത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കാർന്നുതിന്നുന്ന ബാധ.” ഹീബ്രായ പദം വസ്തുവിനെ നശിപ്പിക്കുന്ന ക്ഷയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അവസാന പ്രയോഗം ദുഷ്കരമാണ്. അക്ഷരാർഥത്തിൽ അത് “അതിന്റെ കഷണ്ടിയിലോ അതിന്റെ നെറ്റിയിലോ” എന്നാണ്. ഈ സന്ദർഭത്തിൽ ബാധിച്ച വസ്തുവിന്റെ ഒരു പ്രതലത്തെയോ മറുപ്രതലത്തെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: textual_or_semantic_ambiguity
