  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ ദൃശ്യരൂപവും അവസാന പ്രയോഗത്തിലെ അനിശ്ചിതത്വവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു; പഴഞ്ചൻ സാങ്കേതിക പദങ്ങളും അമിതമായി നിർദിഷ്ടമായ രോഗനാമങ്ങളും ഒഴിവാക്കി.
