  rationale: അക്ഷരാർഥത്തിലെ ‘കഷണ്ടി/നെറ്റി’ രൂപകങ്ങൾ വസ്തുവിന്റെ രണ്ട് പ്രതലങ്ങളെയോ വശങ്ങളെയോ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു; കൃത്യമായ പ്രതലവ്യത്യാസം അനിശ്ചിതമായതിനാൽ പൊതുവായ വിവർത്തനം നൽകി കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
