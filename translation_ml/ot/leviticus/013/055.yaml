- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: അതു തീയിൽ ഇട്ടു ചുട്ടുകളയണം
  rationale: രണ്ടാം പുരുഷ ഏകവചന നിർദേശം മലയാളത്തിലെ സ്വാഭാവിക നിയമഭാഷയിൽ നൽകുന്നു.
- source_word: פְּחֶתֶת
