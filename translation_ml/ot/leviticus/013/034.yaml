  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֶת הַ/נֶּ֜תֶק בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨תֶק֙ בָּ/ע֔וֹר וּ/מַרְאֵ֕/הוּ אֵינֶ֥/נּוּ עָמֹ֖ק מִן הָ/ע֑וֹר וְ/טִהַ֤ר אֹת/וֹ֙ הַ/כֹּהֵ֔ן וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: ml
  text: ഏഴാം ദിവസം പുരോഹിതൻ ആ ചെതുമ്പൽരോഗം പരിശോധിക്കണം.[a] ആ ചെതുമ്പൽരോഗം ത്വക്കിൽ പടർന്നിട്ടില്ലെന്നും, അതു ത്വക്കിനെക്കാൾ ആഴമുള്ളതായി കാണപ്പെടുന്നില്ലെന്നും കണ്ടാൽ,[b] പുരോഹിതൻ അയാളെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം.[c] അയാൾ തന്റെ വസ്ത്രങ്ങൾ കഴുകണം; അപ്പോൾ അയാൾ ശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചെതുമ്പൽരോഗം” എബ്രായത്തിലെ നെതെഖ് എന്ന പദത്തിന്റെ ഒരു പരിഭാഷയാണ്. ലേവ്യപുസ്തകം 13-ലെ സന്ദർഭത്തിൽ ഇതു തലമുടിയിലോ താടിയിലോ കാണപ്പെടുന്ന ഒരു പ്രത്യേക ത്വക്കുരോഗാവസ്ഥയുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു; അതിന്റെ കൃത്യമായ ആധുനിക വൈദ്യനാമം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ത്വക്കിനെക്കാൾ ആഴമുള്ളതല്ല.” ബാധിതഭാഗം ചുറ്റുമുള്ള ത്വക്കിന്റെ നിരപ്പിൽനിന്ന് താഴ്ന്നതായി കാണുന്നില്ല എന്നത് പുരോഹിതപരിശോധനയിലെ ഒരു മാനദണ്ഡമായിരുന്നു.
    reason: cultural_note
  - marker: c
    text: “ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം” എന്നത് ആ വ്യക്തിയുടെ ആചാരപരമായ ശുദ്ധസ്ഥിതിയെക്കുറിച്ചുള്ള പുരോഹിതന്റെ ഔദ്യോഗിക വിധിയാണ്; പുരോഹിതൻ രോഗം സുഖപ്പെടുത്തുന്നു എന്നല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: ശിരോ-താടിരോഗം
  rationale: തലയിലോ താടിയിലോ ഉണ്ടാകുന്ന, പുരോഹിതൻ പരിശോധിക്കേണ്ട പ്രത്യേക ത്വക്കുരോഗാവസ്ഥയെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. ഒരു കൃത്യമായ ആധുനിക രോഗനിർണയം അടിച്ചേൽപ്പിക്കാതെ ശരീരഭാഗവും രോഗസ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: פָשָׂה
  choice: പടർന്നിട്ടില്ല
  rationale: പരിശോധിക്കപ്പെടുന്ന രോഗാവസ്ഥ ത്വക്കിൽ വ്യാപിച്ചോ എന്ന നിർണയമാനദണ്ഡം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בָּעוֹר
  choice: ത്വക്കിൽ
  rationale: രോഗാവസ്ഥയുടെ വ്യാപനം ത്വക്കിൽ സംഭവിക്കുന്നതായി എബ്രായ പ്രയോഗത്തെ അടുത്തായി പിന്തുടരുന്നു.
- source_word: מַרְאֵהוּ
  choice: അതിന്റെ രൂപം
  rationale: ബാധിതഭാഗത്തിന്റെ ദൃശ്യരൂപമാണ് ഉദ്ദേശിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ പ്രയോഗം.
- source_word: עָמֹק מִן הָעוֹר
  choice: ത്വക്കിനെക്കാൾ ആഴമുള്ളതായി
  rationale: ബാധിതഭാഗം ചുറ്റുമുള്ള ത്വക്കിന്റെ നിരപ്പിൽനിന്ന് താഴ്ന്നതായി തോന്നുന്നുണ്ടോ എന്ന പുരോഹിതപരിശോധനാ മാനദണ്ഡം സംരക്ഷിക്കുന്നു.
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: പുരോഹിതൻ അയാളെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതൻ രോഗം സുഖപ്പെടുത്തുന്നു എന്നല്ല, ആചാരപരമായ ശുദ്ധസ്ഥിതി ഔദ്യോഗികമായി വിധിക്കുന്നു എന്ന നിയമപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: അയാൾ തന്റെ വസ്ത്രങ്ങൾ കഴുകണം
  rationale: ആചാരപരമായ നിർദേശത്തെ ലളിതവും നേരിട്ടുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְטָהֵר
  choice: അപ്പോൾ അയാൾ ശുദ്ധനായിരിക്കും
  rationale: വസ്ത്രം കഴുകിയതിനുശേഷം ലഭിക്കുന്ന ശുദ്ധസ്ഥിതിയെ ഫലമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: എന്നും കണ്ടാൽ
  rationale: അക്ഷരാർഥമായ ശ്രദ്ധാകർഷക പദത്തെ പരിശോധനയിൽ കണ്ടെത്തുന്ന വ്യവസ്ഥയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְרָאָה
  choice: പരിശോധിക്കണം
  rationale: വെറുതെ കാണുക എന്നതിലുപരി പുരോഹിതൻ നടത്തുന്ന ഔദ്യോഗിക നിരീക്ഷണപ്രക്രിയയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശുദ്ധീകരണനിയമത്തിൽ പുരോഹിതന്റെ പ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: പുരോഹിതൻ അയാളെ ശുദ്ധനെന്നു ഔദ്യോഗികമായി പ്രഖ്യാപിക്കുന്നു
  alternative: പുരോഹിതൻ അയാളെ ശുദ്ധീകരിക്കുന്നു
  rationale: ഈ നിയമസന്ദർഭത്തിൽ טהר ആചാരപരമായ നിലയെക്കുറിച്ചുള്ള വിധിയെ സൂചിപ്പിക്കുന്നു. പുരോഹിതൻ വൈദ്യപരമായി സുഖപ്പെടുത്തുകയോ സ്വയം ശുദ്ധി ഉളവാക്കുകയോ ചെയ്യുന്നു എന്ന ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. നിയമപരവും ആചാരപരവുമായ സ്വരം നിലനിർത്തി; അനിശ്ചിതമായ പുരാതന രോഗാവസ്ഥയ്ക്ക് കൃത്യമായ ആധുനിക രോഗനിർണയം നൽകിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
