  to: ഏഴാം ദിവസം പുരോഹിതൻ ആ ചെതുമ്പൽരോഗം പരിശോധിക്കണം.[a] ആ ചെതുമ്പൽരോഗം ത്വക്കിൽ പടർന്നിട്ടില്ലെന്നും, അതു ത്വക്കിനെക്കാൾ ആഴമുള്ളതായി കാണപ്പെടുന്നില്ലെന്നും കണ്ടാൽ,[b] പുരോഹിതൻ അയാളെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം.[c] അയാൾ തന്റെ വസ്ത്രങ്ങൾ കഴുകണം; അപ്പോൾ അയാൾ ശുദ്ധനായിരിക്കും.
