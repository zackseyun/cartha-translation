id: LEV.13.50
reference: Leviticus 13:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/רָאָ֥ה הַ/כֹּהֵ֖ן אֶת הַ/נָּ֑גַע וְ/הִסְגִּ֥יר אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/050.yaml
  text: And the priest shall examine the diseased area[b][a], and he shall isolate the diseased area for seven days.
translation:
  language: ml
  text: പുരോഹിതൻ ബാധിതസ്ഥലം പരിശോധിക്കണം; തുടർന്ന് ആ ബാധിതസ്ഥലം ഏഴു ദിവസത്തേക്ക് വേർതിരിച്ചുവെക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָאָה
  choice: പരിശോധിക്കണം
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കാണുക’ എന്നാണെങ്കിലും, ഇവിടെ പുരോഹിതൻ ഔദ്യോഗികമായി നിരീക്ഷിച്ചു വിലയിരുത്തുന്ന നടപടിയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘പരിശോധിക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ പതിവായ, വ്യക്തമായ മലയാള പരിഭാഷ.
- source_word: הַנָּגַע / הַנֶּגַע
  choice: ബാധിതസ്ഥലം
  rationale: נגע ഇവിടെ ഏതെങ്കിലും നിശ്ചിത ആധുനിക രോഗനിർണയത്തെയല്ല, പരിശോധനയ്ക്കു വിധേയമായ ബാധയുടെ അടയാളത്തെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു. രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പദം നിലനിർത്തി.
- source_word: וְהִסְגִּיר
  choice: വേർതിരിച്ചുവെക്കണം
  rationale: סגר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ നിരീക്ഷണത്തിനായി അടച്ചിടുകയോ ഒറ്റപ്പെടുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. വസ്ത്രം/തോൽവസ്തു സംബന്ധിച്ച ഈ സന്ദർഭത്തിൽ ‘വേർതിരിച്ചുവെക്കുക’ എന്നത് ‘ക്വാറന്റീൻ ചെയ്യുക’ എന്നതിനെക്കാൾ യോജിച്ചതാണ്.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസത്തേക്ക്
  rationale: കാലദൈർഘ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനടപടി ശൈലി. മൂലത്തിലെ രണ്ടു തുടർച്ചയായ וְ ഘടനകൾ മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിനായി അർധവിരാമവും ‘തുടർന്ന്’ എന്ന ബന്ധകവും ഉപയോഗിച്ച് അവതരിപ്പിച്ചു. ഈ വാക്യത്തിന്റെ സമീപസന്ദർഭം വസ്ത്രത്തിലോ തോൽവസ്തുവിലോ ഉള്ള ബാധയെക്കുറിച്ചാകയാൽ ‘ബാധിതസ്ഥലം’ എന്നത് മനുഷ്യശരീരത്തിലെ രോഗഭാഗമെന്നായി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
