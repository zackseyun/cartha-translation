- from: എന്നാൽ ചർമരോഗം ചർമത്തിലാകെ പടർന്നുപിടിക്കുകയും[a], രോഗബാധിതന്റെ തലമുതൽ കാലുവരെ പുരോഹിതന്റെ കണ്ണിനു കാണാവുന്നിടത്തെല്ലാം അതു ചർമം മുഴുവൻ മൂടുകയും ചെയ്താൽ[b],
  to: എന്നാൽ ചർമരോഗം ചർമത്തിലാകെ പടർന്നുപിടിച്ച്, രോഗബാധിതന്റെ തലമുതൽ കാലുവരെ, പുരോഹിതന് കാണാവുന്നത്രയും ചർമം മുഴുവൻ അതു മൂടിയാൽ,
  rationale: വ്യക്തതയ്ക്കും സ്വാഭാവിക വാക്യപ്രവാഹത്തിനുമായി ദൃശ്യപരിധി സൂചിപ്പിക്കുന്ന ഭാഗം പുനഃക്രമീകരിച്ചു. പടരുക, മൂടുക, തലമുതൽ കാലുവരെ എന്ന സമഗ്രപരിധി, പുരോഹിതന്റെ കാഴ്ചയെ അടിസ്ഥാനമാക്കിയ പരിശോധനാപരിധി എന്നിവയെല്ലാം നിലനിർത്തിയിരിക്കുന്നു. നിലവിലെ ഘടനയിൽ അടിക്കുറിപ്പ് a ആദ്യ ‘ചർമരോഗം’ എന്ന പദത്തിലും b ‘ചർമം മുഴുവൻ’ എന്ന പ്രയോഗത്തിലും യഥാക്രമം നങ്കൂരമിടാം.
