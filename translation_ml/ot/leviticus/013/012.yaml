id: LEV.13.12
reference: Leviticus 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם פָּר֨וֹחַ תִּפְרַ֤ח הַ/צָּרַ֨עַת֙ בָּ/ע֔וֹר וְ/כִסְּתָ֣ה הַ/צָּרַ֗עַת אֵ֚ת כָּל ע֣וֹר הַ/נֶּ֔גַע מֵ/רֹאשׁ֖/וֹ וְ/עַד רַגְלָ֑י/ו לְ/כָל מַרְאֵ֖ה עֵינֵ֥י הַ/כֹּהֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: ml
  text: എന്നാൽ ചർമരോഗം ചർമത്തിലാകെ പടർന്നുപിടിച്ച്, രോഗബാധിതന്റെ തലമുതൽ കാലുവരെ, പുരോഹിതന് കാണാവുന്നത്രയും ചർമം മുഴുവൻ അതു മൂടിയാൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: പടർന്നുപിടിക്കുകയും
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്നുള്ള എബ്രായ പ്രയോഗം വ്യാപനത്തെ ഊന്നിപ്പറയുന്നു. സന്ദർഭത്തിൽ ‘പടർന്നുപിടിക്കുക’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַצָּרַעַת
  choice: ചർമരോഗം
  rationale: צָרַעַת എന്ന പദം ആധുനിക ഹാൻസൻ രോഗത്തോട് മാത്രം തുല്യമല്ല; ലേവ്യപുസ്തകത്തിലെ വിവിധ ആചാരപരമായ ചർമബാധകളെ സൂചിപ്പിക്കാം. ‘ചർമരോഗം’ അനാവശ്യമായ വൈദ്യശാസ്ത്രപരമായ പരിമിതി ഒഴിവാക്കുന്നു.
- source_word: בָּעוֹר
  choice: ചർമത്തിലാകെ
  rationale: בְּ ഇവിടെ ബാധ ചർമത്തിന്റെ ഉപരിതലത്തിൽ വ്യാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. തീവ്രതയുള്ള ക്രിയാരൂപവും ശരീരം മുഴുവനായുള്ള വ്യാപനവും പരിഗണിച്ച് ‘ചർമത്തിലാകെ’ എന്നു നൽകി.
- source_word: וְכִסְּתָה
  choice: മൂടുകയും
  rationale: നിബന്ധനാവാക്യത്തിലെ തുടർച്ചയായ പ്രവൃത്തിയായി ഈ ക്രിയയെ മലയാളത്തിൽ ‘മൂടുകയും’ എന്നു സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: രോഗബാധിതന്റെ ... ചർമം മുഴുവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘ബാധയുടെ/വ്രണത്തിന്റെ ചർമം മുഴുവൻ’ എന്ന ദുഷ്കരമായ പ്രയോഗമാണിത്. സന്ദർഭോചിതമായ വ്യക്തതയ്ക്കായി രോഗബാധിതനായ വ്യക്തിയുടെ ചർമമെന്ന അർഥം മുഖ്യപാഠത്തിൽ നൽകി; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: തലമുതൽ കാലുവരെ
  rationale: ശരീരം മുഴുവനും എന്ന അർഥം നൽകുന്ന എബ്രായ മെറിസത്തെ സ്വാഭാവികമായ മലയാളപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: പുരോഹിതന്റെ കണ്ണിനു കാണാവുന്നിടത്തെല്ലാം
  rationale: പുരോഹിതന്റെ പരിശോധനയിൽ ദൃശ്യമാകുന്ന മുഴുവൻ പരിധിയെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായി പകർത്തുന്നു; കാഴ്ചയുടെ പരിമിതി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. അടുത്ത വാക്യത്തിലേക്കു തുടരുന്ന നിബന്ധനാവാക്യമാണെന്നതിനാൽ അവസാനം അർധവിരാമമല്ല, കോമ നിലനിർത്തി. ‘പുരോഹിതൻ’ എന്നത് כֹּהֵן എന്ന പദത്തിന്റെ സ്ഥാപിതവും സഭാവിഭാഗനിരപേക്ഷവുമായ പരിഭാഷയാണ്.
