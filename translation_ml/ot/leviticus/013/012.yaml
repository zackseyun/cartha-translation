  source_fidelity: 'മുഖ്യാർത്ഥം ശരിയായി പിടിച്ചിരിക്കുന്നു: צָרַעַת-നെ ആധുനിക കുഷ്ഠരോഗമായി ചുരുക്കുന്നില്ല; അതിന്റെ വ്യാപനവും, തലമുതൽ കാലുവരെയുള്ള പരിധിയും, പുരോഹിതന്റെ പരിശോധനയിൽ ദൃശ്യമാകുന്ന പരിധിയും നിലനിർത്തുന്നു. എന്നാൽ നിലവിലെ വാക്യക്രമത്തിൽ ‘പുരോഹിതന്റെ കണ്ണിനു കാണാവുന്നിടത്തെല്ലാം’ എന്ന വിശേഷണം ‘ചർമം മുഴുവൻ’ എന്നതോടു ചേർന്ന് അൽപം അസ്വാഭാവികവും പരിധിയിൽ അവ്യക്തവുമാകുന്നു.'
  naturalness: ‘പുരോഹിതന് കാണാവുന്നത്രയും’ ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്. ‘പടർന്നുപിടിച്ച് … മൂടിയാൽ’ എന്ന സമാന്തര നിബന്ധനാരൂപം എബ്രായ വാക്യഘടനയും അടുത്ത വാക്യത്തിലേക്കുള്ള തുടർച്ചയും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
  terminology: ‘ചർമരോഗം’യും ‘പുരോഹിതൻ’യും ഉചിതമാണ്. അടിക്കുറിപ്പ് a-യിലെ ‘ആചാരപരമായി പരിഗണിക്കപ്പെട്ടിരുന്ന’ എന്ന വിശദീകരണം ഉറവിടപദത്തിന്റെ ആചാരപരമായ വർഗ്ഗീകരണസ്വഭാവം യുക്തമായി അറിയിക്കുന്നു. അടിക്കുറിപ്പ് b-യിൽ അക്ഷരാർഥസാധ്യത നിലനിർത്തിയിരിക്കുന്നു.
