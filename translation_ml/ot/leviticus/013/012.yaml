    rationale: ‘പുരോഹിതന്റെ കണ്ണിനു കാണാവുന്നിടത്തെല്ലാം അതു ചർമം മുഴുവൻ മൂടുകയും’ എന്ന ക്രമം മലയാളത്തിൽ അല്പം ഭാരമുള്ളതും ‘കാണാവുന്നിടം’ ചർമത്തെയോ മൂടലിന്റെ പരിധിയെയോ വിശേഷിപ്പിക്കുന്നുവോ എന്നതിൽ ചെറു അവ്യക്തത സൃഷ്ടിക്കുന്നതുമാണ്. ‘പുരോഹിതന് കാണാവുന്നത്രയും’ എന്ന പ്രയോഗം എബ്രായ പ്രയോഗത്തിന്റെ നിരീക്ഷണപരമായ പരിമിതി കൂടുതൽ നേരിട്ട് നൽകുന്നു.
