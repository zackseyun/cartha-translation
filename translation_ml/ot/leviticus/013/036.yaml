  text: וְ/רָאָ֨/הוּ֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖תֶק בָּ/ע֑וֹר לֹֽא יְבַקֵּ֧ר הַ/כֹּהֵ֛ן לַ/שֵּׂעָ֥ר הַ/צָּהֹ֖ב טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: ml
  text: പുരോഹിതൻ അവനെ പരിശോധിക്കുമ്പോൾ, ചെതുമ്പൽരോഗം[a] ത്വക്കിൽ പടർന്നിട്ടുണ്ടെന്നു കണ്ടാൽ, മഞ്ഞനിറമുള്ള രോമമുണ്ടോ എന്നു പുരോഹിതൻ പരിശോധിക്കേണ്ടതില്ല; അവൻ അശുദ്ധനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം പ്രത്യേകിച്ച് ശിരസ്സിലോ താടിയിലോ ഉണ്ടാകുന്ന ചെതുമ്പലോടുകൂടിയ ത്വക്ക് അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘ചൊറി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ הַכֹּהֵן
  choice: പുരോഹിതൻ അവനെ പരിശോധിക്കുമ്പോൾ
  rationale: പുരോഹിത പരിശോധനയുടെ സന്ദർഭത്തിൽ ראה വെറും ‘കാണുക’ എന്നതിലുപരി വിലയിരുത്തി പരിശോധിക്കുക എന്ന അർഥം നൽകുന്നു. മുൻസന്ദർഭം മൂലം വാക്യത്തിന് നിബന്ധനാത്മക ഭാവമുണ്ട്.
- source_word: וְהִנֵּה
  choice: കണ്ടാൽ
  rationale: പരിശോധനയിൽ കണ്ടെത്തുന്ന അവസ്ഥയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാള നിബന്ധനാരൂപത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: פָּשָׂה
  choice: പടർന്നിരിക്കുന്നതായി
  rationale: രോഗബാധിത ഭാഗം വ്യാപിച്ചതിനെ സൂചിപ്പിക്കുന്ന പുരോഹിതനിയമത്തിലെ സാങ്കേതിക ഉപയോഗം വ്യക്തമാക്കുന്നു.
- source_word: הַנֶּתֶק
  choice: ശിരസ്സിലെയോ താടിയിലെയോ ചെതുമ്പൽരോഗം
  rationale: נתק ശിരസ്സിലോ താടിയിലോ ഉണ്ടാകുന്ന പ്രത്യേക ത്വക്ക് അവസ്ഥയാണ്; ‘ചൊറി’ എന്നു മാത്രം പറയുന്നത് അതിന്റെ പ്രത്യേകത നഷ്ടപ്പെടുത്താം. സന്ദർഭപരമായ സ്ഥാനം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: בָּעוֹר
  choice: ത്വക്കിൽ
  rationale: ഹീബ്രുവിലെ ‘ത്വക്കിൽ’ എന്ന സ്ഥാനബന്ധം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: לֹא יְבַקֵּר
  choice: പരിശോധിക്കേണ്ടതില്ല
  rationale: രോഗം പടർന്നതായി ഉറപ്പായാൽ മറ്റൊരു അടയാളത്തിനായി കൂടുതൽ പരിശോധന ആവശ്യമില്ലെന്ന അർഥം നൽകുന്നു.
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: മഞ്ഞനിറമുള്ള രോമമുണ്ടോ എന്നു
  rationale: മുൻവാക്യങ്ങളിൽ പറയുന്ന രോഗനിർണയ അടയാളത്തെ വ്യക്തമായി പ്രതിപാദിക്കുന്നു.
- source_word: טָמֵא הוּא
  choice: അവൻ അശുദ്ധനാണ്
  rationale: അശുദ്ധത രോഗബാധിത ഭാഗത്തിനല്ല, പരിശോധിക്കപ്പെട്ട വ്യക്തിക്കുള്ള പുരോഹിതനിയമപരമായ നിലയാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ലേവ്യശുദ്ധിനിയമത്തിൽ טָמֵא എന്നതിന്റെ സ്വഭാവം
  choice: അശുദ്ധൻ
  alternative: മലിനൻ; അശുദ്ധമായവൻ
  rationale: ഇവിടെ പദം ധാർമ്മിക കുറ്റത്തെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല; ആരാധനാ-സാമൂഹിക ശുദ്ധിനിയമപ്രകാരമുള്ള വ്യക്തിയുടെ നിലയാണ്. ‘അശുദ്ധൻ’ ഈ വ്യത്യാസം പരമ്പരാഗതവും വ്യക്തവുമായ രീതിയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ ഗൗരവമുള്ള മലയാളം. രോഗാവസ്ഥയ്ക്ക് ആധുനിക വൈദ്യശാസ്ത്രപരമായ കൃത്യനാമം നിർബന്ധിച്ച് നൽകാതെ മൂലപാഠത്തിന്റെ വിവരണാത്മക സ്വഭാവം സംരക്ഷിച്ചു.
