review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys priestly examination, spread of the condition, the unnecessary further check for yellow hair, and the affected person's status as unclean. However, it introduces “on the head or beard” into the verse itself, though those locations are contextual information about נתק rather than wording present in this verse. This should remain in the footnote.
  naturalness: The Malayalam is generally clear and suitably formal. Removing the imported location phrase also makes the sentence more direct. “ചെതുമ്പൽരോഗം” is understandable in modern Malayalam for the descriptive, non-diagnostic rendering required here.
  terminology: “പുരോഹിതൻ,” “മഞ്ഞനിറമുള്ള രോമം,” and “അശുദ്ധനാണ്” are appropriate. “അശുദ്ധൻ” preserves the Levitical ritual-status term without implying moral guilt. The footnote appropriately supplies “ചൊറി” as a lexical alternative while explaining the more specific contextual sense.
  issues:
  - severity: medium
    issue: The main text adds “ശിരസ്സിലെയോ താടിയിലെയോ” (“on the head or beard”).
    rationale: Hebrew Leviticus 13:36 says only that the נתק has spread “in/on the skin.” The head/beard association is established by the surrounding diagnostic context and can be explained in a footnote, but it should not be inserted into the verse’s main text.
  revised_text: പുരോഹിതൻ അവനെ പരിശോധിക്കുമ്പോൾ, ചെതുമ്പൽരോഗം[a] ത്വക്കിൽ പടർന്നിട്ടുണ്ടെന്നു കണ്ടാൽ, മഞ്ഞനിറമുള്ള രോമമുണ്ടോ എന്നു പുരോഹിതൻ പരിശോധിക്കേണ്ടതില്ല; അവൻ അശുദ്ധനാണ്.
