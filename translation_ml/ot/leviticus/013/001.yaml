id: LEV.13.1
reference: Leviticus 13:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വെ[a] മോശെയോടും അഹരോനോടും സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’ (יהוה). മലയാള പരിഭാഷകളിൽ പരമ്പരാഗതമായി ‘യഹോവ’ അല്ലെങ്കിൽ ‘കർത്താവ്’ എന്നും നൽകാറുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപവും പരമ്പരാഗത പകരംവായനകളും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക അഭിസംബോധനയുടെ ആവർത്തിത സൂത്രവാക്യത്തിൽ דִּבֵּר സൂചിപ്പിക്കുന്ന സംസാരസംഭവം മാന്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; സാധാരണ ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിന് യോജിച്ച ഔപചാരികതയുണ്ട്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: יהוה എന്ന ചതുർവർണ ദൈവനാമം ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: സംസാരത്തിന്റെ രണ്ട് അഭിസംബോധിതരെയും എബ്രായത്തിലെ സമന്വയഘടന അനുസരിച്ച് വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘-ഓടും … -ഓടും’ സ്വാഭാവികമാണ്.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തു:'
  rationale: തുടർന്നുവരുന്ന വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രപ്രയോഗത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ കോളൺ വഴി സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; വേറിട്ട് ‘പറഞ്ഞുകൊണ്ട്’ എന്നു കൊടുത്താൽ ഉണ്ടാകാവുന്ന കൃത്രിമത്വം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ സംരക്ഷിക്കുന്നു. ‘യഹ്‌വെ’ ലഭ്യമായ ഭാഷാശാസ്ത്രസാക്ഷ്യത്തെ അടിസ്ഥാനമാക്കിയ ആധുനിക ലിപ്യന്തരണമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അടുത്ത വാക്യത്തിൽ ആരംഭിക്കുന്ന ദൈവവചനം പരിചയപ്പെടുത്താൻ അവസാനത്തിൽ കോളൺ ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം ദൈവനാമത്തിനുപിന്നാലെ ചേർത്തു.
