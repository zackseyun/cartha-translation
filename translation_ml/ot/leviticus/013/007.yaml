  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: ml
  text: എന്നാൽ തന്റെ ശുദ്ധീകരണത്തിനായി[a] പുരോഹിതന്റെ മുമ്പാകെ തന്നെ കാണിച്ചതിനുശേഷം ആ ചർമപ്പാട്[b] ത്വക്കിൽ തീർച്ചയായും പടരുന്നെങ്കിൽ[c], അയാൾ വീണ്ടും പുരോഹിതന്റെ മുമ്പാകെ ഹാജരാകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘തന്റെ ശുദ്ധീകരണത്തിനായി.’ ഇവിടെ പുരോഹിതന്റെ പരിശോധനയിലൂടെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കപ്പെടുന്നതുമായി ബന്ധപ്പെട്ട നടപടിക്രമമോ ലക്ഷ്യമോ ഉദ്ദേശിക്കാം.
    reason: cultural_note
  - marker: b
    text: ‘ചർമപ്പാട്’ എന്നതിന് ‘ത്വക്കിലെ പൊട്ടിപ്പ്’, ‘ചുണങ്ങ്’ എന്നിങ്ങനെയും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം പരിശോധനയ്ക്കു വിധേയമായ ഉപരിതല ചർമാവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായത്തിൽ ക്രിയയ്ക്ക് ഊന്നൽ നൽകിയിരിക്കുന്നു: ‘തീർച്ചയായും പടരുന്നെങ്കിൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: തീർച്ചയായും പടരുന്നെങ്കിൽ
  rationale: ക്രിയയുടെ ആവർത്തിത എബ്രായ ഘടന പടരുന്നതിന് ഊന്നൽ നൽകുന്നു; ‘തീർച്ചയായും’ ആ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמִּסְפַּחַת
  choice: ആ ചർമപ്പാട്
  rationale: പുരോഹിതൻ പരിശോധിക്കുന്ന ഉപരിതല ചർമാവസ്ഥയെ പൊതുവായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു; മുറിവുണങ്ങുമ്പോഴുള്ള പൊറ്റ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: בָּעוֹר
  choice: ത്വക്കിൽ
  rationale: അവസ്ഥ പടരുന്ന സ്ഥാനം സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ഉടമസ്ഥസർവനാമം വ്യക്തമല്ല.
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: തന്നെ കാണിച്ചതിനുശേഷം
  rationale: പരിശോധനയ്ക്കായി ഒരാൾ സ്വയം പുരോഹിതന്റെ മുമ്പാകെ അവതരിപ്പിക്കുന്ന നടപടിക്രമം പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לְטָהֳרָתוֹ
  choice: ശുദ്ധനെന്നു വിധിക്കപ്പെടുന്നതിനായി
  rationale: ഈ സന്ദർഭത്തിൽ പുരോഹിതപരിശോധനയിലൂടെ ആചാരപരമായി ശുദ്ധനാണെന്ന വിധി ലഭിക്കുന്ന ലക്ഷ്യം വ്യക്തമാക്കുന്നു; യാന്ത്രികമായ ശുദ്ധീകരണം എന്നു മാത്രം അർഥമാക്കുന്നില്ല.
- source_word: וְנִרְאָה שֵׁנִית אֶל הַכֹּהֵן
  choice: അയാൾ വീണ്ടും പുരോഹിതന്റെ മുമ്പാകെ ഹാജരാകണം
  rationale: നിയമനിർദേശത്തിന്റെ ഫലബോധവും രണ്ടാമത്തെ പരിശോധനയ്ക്കുള്ള പുനഃസമർപ്പണവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: לְטָהֳרָתוֹ എന്നതിലെ ശുദ്ധീകരണത്തിന്റെ സ്വഭാവം
  choice: ശുദ്ധനെന്നു വിധിക്കപ്പെടുന്നതിനായി
  alternative: തന്റെ ശുദ്ധീകരണത്തിനായി
  rationale: ലേവ്യപുസ്തകം 13-ലെ സന്ദർഭം പുരോഹിതൻ പരിശോധിച്ച് ശുദ്ധനെന്നു പ്രഖ്യാപിക്കുന്ന നടപടിയാണ്; വിവർത്തനം ആ പ്രഖ്യാപനാത്മക വശം വ്യക്തമാക്കുന്നു, എന്നാൽ വിപുലമായ ആചാരപരമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമനിർദേശ ശൈലി. ‘ചർമപ്പാട്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും വൈദ്യപരമായി അതിരുകടന്ന് നിർവചിക്കാത്തതുമാണ്. മൂലപാഠത്തിലെ ഊന്നലും പുരോഹിതപരിശോധനയുടെ നടപടിക്രമവും നിലനിർത്തിയിരിക്കുന്നു.
