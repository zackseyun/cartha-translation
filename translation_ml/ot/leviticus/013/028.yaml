reference: Leviticus 13:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּי/הָ֩ תַעֲמֹ֨ד הַ/בַּהֶ֜רֶת לֹא פָשְׂתָ֤ה בָ/עוֹר֙ וְ/הִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַ/מִּכְוָ֖ה הִ֑וא וְ/טִֽהֲר/וֹ֙ הַ/כֹּהֵ֔ן כִּֽי צָרֶ֥בֶת הַ/מִּכְוָ֖ה הִֽוא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: ml
  text: എന്നാൽ തെളിച്ചമുള്ള പാട് അതേ സ്ഥാനത്തുതന്നെ[a] നിൽക്കുകയും ത്വക്കിൽ പടരാതിരിക്കുകയും മങ്ങിയിരിക്കുകയും ചെയ്താൽ, അത് പൊള്ളലിൽനിന്നുള്ള വീക്കമാണ്. പുരോഹിതൻ അയാളെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം; അത് പൊള്ളലിന്റെ വടുവാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അതിന്റെ കീഴിൽ.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ പാട് “അതിന്റെ കീഴിൽ നിൽക്കുന്നു” എന്നാണ് പറയുന്നത്; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് പടരാതെ അതേ സ്ഥാനത്ത് തുടരുന്നു എന്നതാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: അതേ സ്ഥാനത്തുതന്നെ നിൽക്കുകയും
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ കീഴിൽ നിൽക്കുക’ എന്നാണെങ്കിലും, പാട് പടരാതെ അതേ നിലയിൽ തുടരുന്നു എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַבַּהֶרֶת
  choice: വെളുത്ത പാട്
  rationale: ത്വക്കിൽ ദൃശ്യമാകുന്ന തെളിഞ്ഞ നിറവ്യത്യാസത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വൈദ്യപരിശോധനാഭാഷയാണ് ഇത്.
- source_word: פָשְׂתָה בָעוֹר
  choice: ത്വക്കിൽ പടരാതിരിക്കുകയും
  rationale: ത്വക്ക്‌രോഗനിർണയത്തിന്റെ ഈ ഭാഗത്ത് ക്രിയ രോഗലക്ഷണം വ്യാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ב എന്ന ഉപസർഗത്തിന്റെ ‘ത്വക്കിൽ’ എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: כֵהָה
  choice: മങ്ങിപ്പോകുകയും
  rationale: പാടിന്റെ തെളിച്ചമോ തീവ്രതയോ കുറഞ്ഞിരിക്കുന്ന അവസ്ഥയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׂאֵת הַמִּכְוָה
  choice: പൊള്ളലിൽനിന്നുണ്ടായ വീക്കം
  rationale: שְׂאֵת ഉയർന്ന ഭാഗമോ വീക്കമോ എന്നും מִכְוָה പൊള്ളൽ എന്നും സൂചിപ്പിക്കുന്നു; അവയുടെ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: പുരോഹിതൻ അയാളെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  rationale: ഇവിടെ ക്രിയ നേരിട്ട് ശുദ്ധീകരിക്കുന്ന പ്രവൃത്തിയെയല്ല, പുരോഹിതന്റെ പരിശോധനയെ തുടർന്നുള്ള ആചാരപരമായ വിധിപ്രഖ്യാപനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: പൊള്ളലിന്റെ വടുക്ക്
  rationale: പൊള്ളലിനുശേഷം ശേഷിക്കുന്ന അടയാളമോ മുറിപ്പാടോ ആണ് ഉദ്ദേശ്യം; ‘വടുക്ക്’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: טהר എന്ന ക്രിയയുടെ ആചാരപരമായ അർഥം
  choice: ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  alternative: ശുദ്ധീകരിക്കണം
  rationale: പുരോഹിതൻ രോഗിയെ ചികിത്സിച്ചോ ആന്തരികമായി ശുദ്ധീകരിച്ചോ എന്നല്ല, പരിശോധനയ്ക്കുശേഷം ആചാരപരമായി ശുദ്ധനെന്ന നില വിധിക്കുന്നതാണ് സന്ദർഭം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. രോഗനിർണയപരമായ നിയമഭാഷ വ്യക്തമായി നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
