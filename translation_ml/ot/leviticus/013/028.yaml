revisions:
- from: എന്നാൽ വെളുത്ത പാട് അതേ സ്ഥാനത്തുതന്നെ നിൽക്കുകയും ത്വക്കിൽ പടരാതിരിക്കുകയും മങ്ങിപ്പോകുകയും ചെയ്താൽ, അത് പൊള്ളലിൽനിന്നുണ്ടായ വീക്കമാണ്. പുരോഹിതൻ അയാളെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം; അത് പൊള്ളലിന്റെ വടുക്കു മാത്രമാണ്.
  to: എന്നാൽ തെളിച്ചമുള്ള പാട് അതേ സ്ഥാനത്തുതന്നെ[a] നിൽക്കുകയും ത്വക്കിൽ പടരാതിരിക്കുകയും മങ്ങിയിരിക്കുകയും ചെയ്താൽ, അത് പൊള്ളലിൽനിന്നുള്ള വീക്കമാണ്. പുരോഹിതൻ അയാളെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം; അത് പൊള്ളലിന്റെ വടുവാണ്.
  rationale: The revision avoids over-specifying the bright mark as white, renders its dimmed state without implying disappearance, removes an added restrictive particle, and supplies a footnote for the literal alternative underlying “അതേ സ്ഥാനത്തുതന്നെ.”
