    text: അല്ലെങ്കിൽ, “അതിന്റെ കീഴിൽ.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ പാട് “അതിന്റെ കീഴിൽ നിൽക്കുന്നു” എന്നാണ് പറയുന്നത്; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് പടരാതെ അതേ സ്ഥാനത്ത് തുടരുന്നു എന്നതാണ് അർഥം.
