id: LEV.13.41
reference: Leviticus 13:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם֙ מִ/פְּאַ֣ת פָּנָ֔י/ו יִמָּרֵ֖ט רֹאשׁ֑/וֹ גִּבֵּ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: ml
  text: എന്നാൽ അവന്റെ തലയുടെ മുൻഭാഗത്തെ മുടി കൊഴിഞ്ഞുപോയാൽ[a], അവൻ നെറ്റിഭാഗത്ത് കഷണ്ടിയുള്ളവനാണ്; അവൻ ശുദ്ധനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തലയുടെ മുൻഭാഗത്ത് കഷണ്ടിയായാൽ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം മുൻവാക്യത്തിലെ തലയുടെ പിൻഭാഗത്തെയോ ഉച്ചിയെയോ ബാധിക്കുന്ന കഷണ്ടിയിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: അവന്റെ തലയുടെ മുൻഭാഗത്തെ
  rationale: പദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവന്റെ മുഖത്തിന്റെ അരികിൽനിന്ന്’ എന്ന ആശയം നൽകുന്നുവെങ്കിലും, തലയോട്ടിയിലെ മുടികൊഴിച്ചിലിനെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ തലയുടെ മുൻഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יִמָּרֵט רֹאשׁוֹ
  choice: മുടി കൊഴിഞ്ഞുപോയാൽ
  rationale: നിഫാൽ ക്രിയാരൂപം തല മുടിയില്ലാതാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ‘മുടി കൊഴിഞ്ഞുപോകുക’ ഈ ശാരീരിക അവസ്ഥ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: גִּבֵּחַ
  choice: നെറ്റിക്കഷണ്ടി
  rationale: മുൻവാക്യത്തിലെ തലയുടെ പിൻഭാഗത്തെയോ ഉച്ചിയെയോ ബാധിക്കുന്ന കഷണ്ടിയിൽനിന്ന് വ്യത്യസ്തമായി, ഈ പദം തലയുടെ മുൻഭാഗത്തെ കഷണ്ടിയെ സൂചിപ്പിക്കുന്നു.
- source_word: טָהוֹר
  choice: ശുദ്ധൻ
  rationale: ലേവ്യപുസ്തകം 13-ലെ പുരോഹിതപരിശോധനയുടെയും ആചാരപരമായ നിലയുടെയും സാങ്കേതിക പദമാണ്; ധാർമിക നിർമലതയല്ല ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
theological_decisions:
- issue: ശുദ്ധിവിധികളിലെ ആചാരപരമായ നില
  choice: ശുദ്ധനാണ്
  alternative: നിർമലനാണ്
  rationale: ഈ വാക്യം ഒരു ശാരീരിക അവസ്ഥയുടെ പുരോഹിതപരമായ നിർണയവും അതിന്റെ ആചാരപരമായ നിലയും സംബന്ധിച്ചതാണ്. അതിനാൽ ധാർമിക അർഥം വരുത്താവുന്ന ‘നിർമലൻ’ എന്നതിനെക്കാൾ ‘ശുദ്ധൻ’ യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘നെറ്റിക്കഷണ്ടി’ എന്ന പ്രയോഗം എബ്രായത്തിലെ മുൻഭാഗത്തെ കഷണ്ടിയും മുൻവാക്യത്തിലെ മറ്റൊരു തരത്തിലുള്ള കഷണ്ടിയും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
