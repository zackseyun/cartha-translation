  source_fidelity: ‘ചൊറിയൻപാട്’ സാധാരണയായി ചൊറി/സ്കേബീസ് എന്ന നിർദിഷ്ട രോഗത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ נֶתֶק എന്ന അനിശ്ചിതമായ പ്രത്യേക ത്വക്/തലച്ചർമ്മാവസ്ഥയ്ക്ക് അമിതനിർവചനം വരുത്തുന്നു. ‘മാറ്റിപ്പാർപ്പിക്കണം’ എന്നത് സ്ഥലംമാറ്റം സൂചിപ്പിക്കുന്നു; וְהִסְגִּיר എന്ന താൽക്കാലിക വേർതിരിവ്/നിരീക്ഷണനടപടിക്ക് യോജിച്ചതല്ല.
