    rationale: നֶתֶק ഒരു പ്രത്യേകമായെങ്കിലും കൃത്യമായി തിരിച്ചറിയപ്പെടാത്ത ത്വക് അല്ലെങ്കിൽ തലച്ചർമ്മാവസ്ഥയാണ്; ‘ചെതുമ്പൽപ്പാട്’ ദൃശ്യവിവരണം നൽകുകയും രോഗനിർണയ അനിശ്ചിതത്വം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
