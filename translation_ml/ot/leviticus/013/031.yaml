source:
  edition: WLC
  text: וְ/כִֽי יִרְאֶ֨ה הַ/כֹּהֵ֜ן אֶת נֶ֣גַע הַ/נֶּ֗תֶק וְ/הִנֵּ֤ה אֵין מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וְ/שֵׂעָ֥ר שָׁחֹ֖ר אֵ֣ין בּ֑/וֹ וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת נֶ֥גַע הַ/נֶּ֖תֶק שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: ml
  text: പുരോഹിതൻ ചെതുമ്പൽപ്പാടിന്റെ[a] ബാധിതപ്രദേശം പരിശോധിക്കുമ്പോൾ, അത് തൊലിയെക്കാൾ ആഴമുള്ളതായി കാണപ്പെടുന്നില്ലെന്നും അതിൽ കറുത്ത രോമമില്ലെന്നും കണ്ടാൽ, പുരോഹിതൻ ആ ചെതുമ്പൽപ്പാടിന്റെ ബാധിതപ്രദേശം ഏഴു ദിവസത്തേക്ക് വേർതിരിച്ചു നിരീക്ഷണത്തിൽ പാർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ചൊറിച്ചിൽ’; പരമ്പരാഗതമായി ‘സ്കോൾ’. ‘ചെതുമ്പൽപ്പാട്’ എന്നത് נֶתֶק എന്ന പദത്തിന്റെ വിവർത്തനമാണ്; ഈ അധ്യായത്തിൽ ഇത് തലയിലോ താടിയിലോ ഉണ്ടാകാവുന്ന ഒരു പ്രത്യേക ത്വക്‌സ്ഥിതിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: ബാധിതപ്രദേശം
  rationale: പരിശോധനയ്ക്കു വിധേയമായ രോഗബാധിതമായ പാടിനെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്ന, ആധുനികവും വൈദ്യശാസ്ത്രപരമായി അമിതനിർവചനമില്ലാത്തതുമായ പ്രയോഗം.
- source_word: נֶתֶק
  choice: ചൊറിയൻപാട്
  rationale: തലയിലോ താടിയിലോ രോമനഷ്ടവുമായി ബന്ധപ്പെട്ട ഈ അധ്യായത്തിലെ പ്രത്യേക ത്വക്‌സ്ഥിതിയെ സൂചിപ്പിക്കാൻ സ്വാഭാവികമായ മലയാളപദം; കൃത്യമായ രോഗനിർണയം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: מַרְאֵהוּ
  choice: അതിന്റെ കാഴ്ച
  rationale: കാഴ്ചയിൽ എങ്ങനെ തോന്നുന്നു എന്ന പരിശോധനാഭാഷ നിലനിർത്തുന്നു.
- source_word: עָמֹק מִן־הָעוֹר
  choice: തൊലിയെക്കാൾ ആഴമുള്ളതല്ല
  rationale: എബ്രായത്തിലെ താരതമ്യഘടന നേരിട്ട് നിലനിർത്തുന്നു; പാട് തൊലിയുടെ അടിയിലേക്കു താഴ്ന്നതായി കാണപ്പെടുന്നുണ്ടോ എന്ന പരിശോധനാസൂചന സംരക്ഷിക്കുന്നു.
- source_word: שֵׂעָר שָׁחֹר
  choice: കറുത്ത രോമം
  rationale: നിറത്തെ പൊതുവാക്കാതെ എബ്രായത്തിലെ കൃത്യമായ 'കറുത്ത' എന്ന നിർദേശം നിലനിർത്തുന്നു.
- source_word: וְהִסְגִּיר
  choice: മാറ്റിപ്പാർപ്പിക്കണം
  rationale: നിരീക്ഷണത്തിനായി താൽക്കാലികമായി വേർതിരിക്കുന്ന നടപടിയെ സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആധുനിക പൊതുജനാരോഗ്യ അർത്ഥമുള്ള 'ക്വാറന്റീൻ' ഒഴിവാക്കുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസത്തേക്ക്
  rationale: താൽക്കാലിക വേർതിരിവിന്റെ കാലാവധി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְכִי
  choice: പരിശോധിക്കുമ്പോൾ
  rationale: മുൻനിയമത്തോടു ബന്ധപ്പെട്ടു വരുന്ന വ്യവസ്ഥാപരമായ കേസിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יִרְאֶה
  choice: പരിശോധിക്കുക
  rationale: അക്ഷരാർഥമായ 'കാണുക' എന്നതിലുപരി പുരോഹിതൻ നടത്തുന്ന ഔപചാരിക ദൃശ്യപരിശോധനയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
