translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. വസ്തുവിനെക്കുറിച്ചുള്ള എബ്രായത്തിലെ വിശാല പരാമർശം നിലനിർത്തിയിരിക്കുന്നു; നിർദ്ദിഷ്ടമല്ലാത്ത കഴുകുന്നവരെ പ്രത്യേകം ചേർത്തിട്ടില്ല.
