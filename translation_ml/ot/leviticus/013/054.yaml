  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: ml
  text: അപ്പോൾ പുരോഹിതൻ ബാധയുള്ള വസ്തു കഴുകാൻ കൽപ്പിക്കണം; പിന്നെ അതിനെ രണ്ടാമതും ഏഴു ദിവസത്തേക്ക് വേർതിരിച്ചുവെക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അതിനെ രണ്ടാമതും ഏഴു ദിവസത്തേക്ക് അടച്ചുവെക്കണം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: അപ്പോൾ പുരോഹിതൻ ... കല്പിക്കണം
  rationale: നിയമനിർദേശങ്ങളുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന waw + perfect ഘടനയെ സ്വാഭാവികമായ മലയാള നടപടിക്രമഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְכִבְּסוּ
  choice: കഴുകാൻ കല്പിക്കണം
  rationale: മൂന്നാം പുരുഷ ബഹുവചന ക്രിയയിലെ നിർദ്ദിഷ്ടമല്ലാത്ത പ്രവർത്തകരെ മലയാളത്തിൽ വേർതിരിച്ച് പറയാതെ, പുരോഹിതന്റെ കല്പനയുടെ പൂരണമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: ബാധയുള്ള വസ്തു
  rationale: വസ്ത്രം, തോൽ, നെയ്ത വസ്തു തുടങ്ങിയ സന്ദർഭത്തിലെ പരിശോധനാവസ്തുവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: הַנֶּגַע
  choice: ബാധ
  rationale: ജഡവസ്തുവിലെ പാട്, ദോഷബാധ, അശുദ്ധീകരിക്കുന്ന അവസ്ഥ എന്നിവയെ ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവികവും വിശാലവുമായ പദം; 'രോഗം' എന്നു പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וְהִסְגִּירוֹ
  choice: അതിനെ ... മാറ്റിവെക്കണം
  rationale: പരിശോധനയ്ക്കായി വസ്തുവിനെ വേർതിരിച്ചു സൂക്ഷിക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പദശഃ 'അടച്ചിടുക' എന്നതിന്റെ കാഠിന്യം ഒഴിവാക്കുന്നു.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: വീണ്ടും ഏഴു ദിവസത്തേക്ക്
  rationale: രണ്ടാമത്തെ ഏഴുദിവസത്തെ വേർതിരിച്ചുവെക്കൽ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
