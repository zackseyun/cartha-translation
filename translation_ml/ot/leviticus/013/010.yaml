translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമപര-രോഗനിർണയ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ തുടർവാക്യഘടന നിലനിർത്താൻ വാക്യം വ്യവസ്ഥാസൂചകമായ ‘കണ്ടാൽ,’ എന്ന രൂപത്തിൽ അവസാനിപ്പിച്ചു. സാങ്കേതിക പദങ്ങളുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
