  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה שְׂאֵת לְבָנָה֙ בָּ/ע֔וֹר וְ/הִ֕יא הָפְכָ֖ה שֵׂעָ֣ר לָבָ֑ן וּ/מִֽחְיַ֛ת בָּשָׂ֥ר חַ֖י בַּ/שְׂאֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/010.yaml
  text: and the priest examines him[a], and behold, there is a white swelling in the skin, and it has turned the hair white, and there is raw flesh in the swelling[b],
translation:
  language: ml
  text: പുരോഹിതൻ പരിശോധിക്കുമ്പോൾ, ഇതാ, തൊലിയിൽ വെളുത്ത ഒരു വീക്കം[a] ഉണ്ടെന്നും അത് രോമം വെളുപ്പിച്ചിട്ടുണ്ടെന്നും വീക്കത്തിനുള്ളിൽ പച്ചമാംസം[b] ഉണ്ടെന്നും കണ്ടാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉയർന്ന പാട്.” എബ്രായപദമായ שְׂאֵת ഈ അധ്യായത്തിൽ തൊലിയിൽ ഉയർന്നുനിൽക്കുന്ന ക്ഷതത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതികപദമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ജീവനുള്ള മാംസം”; ക്ഷതത്തിനുള്ളിൽ കാണപ്പെടുന്ന ജീവനുള്ള പച്ചമാംസകലയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: പരിശോധിക്കുമ്പോൾ ... കണ്ടാൽ
  rationale: ഈ രോഗനിർണയനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ראה വെറുതെ കാണുക എന്നതിലുപരി സൂക്ഷ്മമായി പരിശോധിച്ച് കണ്ടെത്തുക എന്നർഥം നൽകുന്നു. എബ്രായ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ മലയാളത്തിൽ വ്യവസ്ഥാസൂചകമായ രൂപം സ്വാഭാവികമാണ്.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യശുദ്ധിനിയമങ്ങളിൽ പരിശോധന നടത്താൻ അധികാരപ്പെട്ട כֹּהֵן എന്ന പദത്തിന്റെ സ്ഥിരവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പരിശോധനയിൽ ശ്രദ്ധയിൽപ്പെടുന്ന ലക്ഷണത്തിലേക്ക് വായനക്കാരന്റെ ശ്രദ്ധ തിരിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: שְׂאֵת לְבָנָה
  choice: വെളുത്ത ഒരു വീക്കം
  rationale: שְׂאֵת ഈ അധ്യായത്തിൽ തൊലിയിൽ ഉയർന്നുനിൽക്കുന്ന ക്ഷതത്തെയോ വീക്കത്തെയോ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്; സാധാരണ വായനക്കാർക്ക് 'വീക്കം' വ്യക്തമാണ്.
- source_word: בָּעוֹר
  choice: തൊലിയിൽ
  rationale: עוֹר എന്നത് തൊലി എന്നാണ്; בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: അത് രോമം വെളുപ്പിച്ചിട്ടുണ്ടെന്നും
  rationale: സ്ത്രീലിംഗ സർവനാമം വീക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ക്ഷതം മൂലം അവിടത്തെ രോമം വെളുത്തുവെന്ന കാരണഫലബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: പച്ചമാംസം
  rationale: ക്ഷതത്തിനുള്ളിൽ പ്രത്യക്ഷപ്പെടുന്ന ജീവനുള്ളതും ഭേദമാകാത്തതുമായ മാംസകലയുടെ രോഗനിർണയലക്ഷണമാണ് ഈ പ്രയോഗം. 'പച്ചമാംസം' മലയാളത്തിൽ തുറന്നുകാണുന്ന അസംസ്കൃത മാംസകലയെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בַּשְׂאֵת
  choice: വീക്കത്തിനുള്ളിൽ
  rationale: മാംസകല ക്ഷതത്തിന്റെ ഉള്ളിലാണ് കാണപ്പെടുന്നതെന്ന സ്ഥാനബന്ധം വ്യക്തമാക്കുകയും שְׂאֵת എന്ന പദത്തിന് ഒരേ പരിഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
