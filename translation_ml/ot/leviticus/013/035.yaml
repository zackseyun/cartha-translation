source:
  edition: WLC
  text: וְ/אִם פָּשֹׂ֥ה יִפְשֶׂ֛ה הַ/נֶּ֖תֶק בָּ/ע֑וֹר אַחֲרֵ֖י טָהֳרָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/035.yaml
  text: But if the scaly eruption does spread in the skin after his cleansing,[a]
translation:
  language: ml
  text: എന്നാൽ, അവൻ ശുദ്ധനെന്നു വിധിക്കപ്പെട്ട ശേഷം ശൽക്കമുള്ള ആ പാട്[a] ത്വക്കിൽ തീർച്ചയായും പടരുന്നുവെങ്കിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചൊറിയുള്ള പാട്’ എന്നും വിവർത്തനം ചെയ്യാം. ഈ എബ്രായപദം ഈ അധ്യായത്തിൽ വിവരിക്കുന്ന, സാധാരണയായി ശൽക്കങ്ങളും രോമനഷ്ടവും കാണപ്പെടുന്ന ഒരു പ്രത്യേക ത്വക്കുബാധയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … എങ്കിൽ
  rationale: തുടർന്നുവരുന്ന പരിശോധനാനടപടിയിലെ വിപരീതസാധ്യതയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുകയും വ്യവസ്ഥാസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: പടർന്നുപോകുന്നെങ്കിൽ
  rationale: ഒരേ ധാതുവിന്റെ infinitive absolute-ഉം finite verb-ഉം ചേർന്ന പ്രയോഗം പടരൽ യഥാർഥമായി സംഭവിക്കുന്നതിനെ ഊന്നുന്നു. മലയാളത്തിലെ ക്രിയാരൂപം ആ ഊന്നൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ‘തീർച്ചയായും’ ചേർക്കുന്നത് അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: הַנֶּתֶק
  choice: ശൽക്കങ്ങളുള്ള ആ വ്രണം
  rationale: തലയിലോ താടിയിലോ ബാധിച്ച രോമത്തോടുകൂടി കാണപ്പെടുന്ന ഈ അധ്യായത്തിലെ പ്രത്യേക ത്വക്കുബാധയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. വെറും ചൊറിച്ചിൽ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി ദൃശ്യമായ ബാധയെ വ്യക്തമാക്കുന്ന, എന്നാൽ കൃത്യമായ ആധുനിക രോഗനിർണയം അടിച്ചേൽപ്പിക്കാത്ത വിവർത്തനം.
- source_word: בָּעוֹר
  choice: ത്വക്കിൽ
  rationale: עוֹר എന്നത് ‘ത്വക്ക്’ എന്നാണ്; ഇവിടെ ‘മാംസം’ എന്നതിനെക്കാൾ കൃത്യമാണ്. בְ എന്ന സ്ഥലസൂചകത്തിന് ‘-ൽ’ സ്വാഭാവികമാണ്.
- source_word: אַחֲרֵי
  choice: ശേഷം
  rationale: കാലക്രമം സൂചിപ്പിക്കുന്ന സാധാരണ അർഥം.
- source_word: טָהֳרָתוֹ
  choice: അവൻ ശുദ്ധനെന്നു വിധിക്കപ്പെട്ടശേഷം
  rationale: അടുത്തുള്ള 13:34-ലെ പുരോഹിതന്റെ ശുദ്ധപ്രഖ്യാപനമാണ് സന്ദർഭം. ഇത് ധാർമികപാപശുദ്ധീകരണമെന്ന ആശയം വരുത്താതെ ആചാരപരമായ പരിശോധനാഫലം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: טָהֳרָתוֹ എന്നതിലെ ശുദ്ധി ആചാരപരമോ ധാർമികമോ
  choice: ശുദ്ധനെന്നു വിധിക്കപ്പെട്ടശേഷം
  alternative: അവന്റെ ശുദ്ധീകരണത്തിനുശേഷം
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പുരോഹിതൻ പരിശോധനയ്ക്കുശേഷം വ്യക്തിയെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കുന്നതാണ് ഉദ്ദേശ്യം; ധാർമികമോ ആത്മീയമോ ആയ പാപശുദ്ധീകരണം ഇതിൽ സൂചിപ്പിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ആദരവാർന്ന മലയാളം. നിയമനടപടിയുടെ വ്യവസ്ഥാരൂപവും വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതും നിലനിർത്താൻ അവസാനം കോമ ഉപയോഗിച്ചു. പ്രത്യേക രോഗത്തിന് ആധുനിക വൈദ്യനാമം നിർബന്ധമായി നൽകുന്നത് ഒഴിവാക്കി.
