  terminology: “സാറാത്ത്” is a sound non-anachronistic rendering of צָרַעַת in a context involving textiles and leather. “നശിപ്പിക്കുന്ന” suitably represents מַמְאֶרֶת without importing a modern medical diagnosis. “ചണനൂൽ” is retained as the accessible textile-material expression for linen in this context.
