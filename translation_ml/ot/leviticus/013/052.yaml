  source_fidelity: The draft accurately conveys the required burning, the textile terms, leather articles, and the special Levitical category צָרַעַת. However, it places “രോഗബാധയുള്ള” before “വസ്ത്രം,” whereas the Hebrew relative clause “in which the affected mark is” immediately modifies the final “any article of leather.” The revised wording preserves the Hebrew sequence and attachment without making an unnecessary diagnostic claim.
