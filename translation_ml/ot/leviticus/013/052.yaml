  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׂרַ֨ף אֶת הַ/בֶּ֜גֶד א֥וֹ אֶֽת הַ/שְּׁתִ֣י א֣וֹ אֶת הָ/עֵ֗רֶב בַּ/צֶּ֨מֶר֙ א֣וֹ בַ/פִּשְׁתִּ֔ים א֚וֹ אֶת כָּל כְּלִ֣י הָ/ע֔וֹר אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ הַ/נָּ֑גַע כִּֽי צָרַ֤עַת מַמְאֶ֨רֶת֙ הִ֔וא בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: ml
  text: വസ്ത്രമോ, കമ്പിളിയിലോ ചണനൂലിലോ ഉള്ള പാവുനൂലോ ഊടുനൂലോ, അല്ലെങ്കിൽ അതിൽ ബാധയുള്ള ഏതെങ്കിലും തോൽവസ്തുവോ അവൻ ചുട്ടുകളയണം; കാരണം, അത് നശിപ്പിക്കുന്ന സാറാത്ത്[a] ആകുന്നു. അത് തീയിൽ ചുട്ടുകളയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദമായ צָרַעַת (സാറാത്ത്) പരമ്പരാഗതമായി പലപ്പോഴും ‘കുഷ്ഠരോഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. എന്നാൽ ലേവ്യപുസ്തകത്തിൽ അത് ആധുനിക കുഷ്ഠരോഗത്തേക്കാൾ വിശാലമായ ആചാരപരമായ അശുദ്ധിയുടെ ഒരു വിഭാഗമാണ്; വസ്ത്രങ്ങളിലെയും വീടുകളിലെയും ബാധയ്ക്കും ഈ പദം ഉപയോഗിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂרַף
  choice: അവൻ ചുട്ടുകളയണം
  rationale: നിയമനടപടികളുടെ തുടർച്ചയിൽ വന്ന ഖാൽ ക്രിയയെ ആജ്ഞാസ്വഭാവമുള്ള നിർബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַבֶּגֶד
  choice: വസ്ത്രം
  rationale: בגד എന്ന പൊതുപദത്തിന് ഔപചാരികവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ തുല്യപദം.
- source_word: הַשְּׁתִי / הָעֵרֶב
  choice: പാവുനൂൽ / ഊടുനൂൽ
  rationale: നെയ്ത്തിലെ നീളദിശയിലുള്ള നൂലിനും കുറുകെ കടത്തുന്ന നൂലിനുമുള്ള സാങ്കേതിക മലയാളപദങ്ങൾ; എബ്രായത്തിലെ കൂട്ടുപദങ്ങളുടെ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: בַּצֶּמֶר / בַפִּשְׁתִּים
  choice: കമ്പിളിയിലോ ചണനൂലിലോ ഉള്ള
  rationale: צמר കമ്പിളിയെയും פשתים ചണം/ചണനാരിൽനിന്നുള്ള നൂലിനെയും സൂചിപ്പിക്കുന്നു; നെയ്ത്തുനൂലുകളുടെ വസ്തു വ്യക്തമാക്കുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: כָּל כְּלִי הָעוֹר
  choice: ഏതെങ്കിലും തോൽവസ്തു
  rationale: כלי എന്ന വിശാലമായ ‘ഉപകരണം/വസ്തു’ എന്ന അർഥം പാത്രമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יִהְיֶה בוֹ הַנָּגַע
  choice: രോഗബാധയുള്ള
  rationale: נגע ഇവിടെ ബാധിതമായ അടയാളത്തെയോ അവസ്ഥയെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക രോഗനിർണയം അനാവശ്യമായി ചുമത്താതെ വസ്തുവിലുള്ള ബാധ വ്യക്തമാക്കുന്നു.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: നശിപ്പിക്കുന്ന സാറാത്ത്
  rationale: മനുഷ്യരിൽ മാത്രമല്ല വസ്ത്രങ്ങളിലും വീടുകളിലും ബാധകമായ ലേവ്യശുദ്ധിനിയമത്തിലെ പ്രത്യേക വിഭാഗത്തെ ലിപ്യന്തരണം ചെയ്ത് സംരക്ഷിക്കുന്നു; ממארתയുടെ വിനാശകരമായ സ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: അത് തീയിൽ ചുട്ടുകളയണം
  rationale: നിഫാൽ രൂപത്തിന്റെ നിർബന്ധിതമായ നിഷ്ക്രിയ ഫലം മലയാളത്തിൽ വ്യക്തമായ നിയമനിർദേശമായി നൽകുന്നു.
theological_decisions:
- issue: צָרַעַת എന്ന ലേവ്യശുദ്ധിനിയമ പദത്തിന്റെ പരിഭാഷ
  choice: സാറാത്ത്
  alternative: കുഷ്ഠരോഗം; ത്വക്‌രോഗം; അശുദ്ധിയുണ്ടാക്കുന്ന രോഗം
  rationale: ഈ വാക്യത്തിൽ ഈ അവസ്ഥ വസ്ത്രത്തിനും തോൽവസ്തുവിനുമാണ് ബാധകമാകുന്നത്. അതിനാൽ അതിനെ ആധുനിക കുഷ്ഠരോഗമായോ മനുഷ്യചർമരോഗമായോ തിരിച്ചറിയുന്നത് തെറ്റിദ്ധരിപ്പിക്കും. ലിപ്യന്തരണം മൂലപദത്തിന്റെ വിശാലവും പ്രത്യേകവുമായ ആചാരശുദ്ധി അർഥം സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അത് വിശദീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമഭാഷ. അപരിചിതമായ സാങ്കേതിക നെയ്ത്തുപദങ്ങൾ സന്ദർഭസഹായത്തോടെ ഉപയോഗിച്ചു. തെറ്റായ വൈദ്യശാസ്ത്രസമീകരണം ഒഴിവാക്കാൻ צָרַעַת ലിപ്യന്തരിച്ചു; പ്രധാനവാചകത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
