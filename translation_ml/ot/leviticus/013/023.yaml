  verdict: approve
  source_fidelity: 'The Malayalam accurately represents the conditional diagnostic statement: the visible white/bright mark remains in place and does not spread; it is identified as the residual mark of the boil; and the priest declares the affected person ritually clean. “ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം” correctly preserves the declarative ritual sense of וטהרו rather than suggesting medical treatment.'
