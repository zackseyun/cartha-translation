  terminology: “വെളുത്ത പാട്” is an appropriate accessible rendering of בהרת in this context without imposing a modern diagnosis. “പരുവിന്റെ പാട്” suitably conveys the scar/residual mark associated with the boil. “പുരോഹിതൻ” and “ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം” maintain the required cultic-legal register.
