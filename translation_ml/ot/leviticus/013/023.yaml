id: LEV.13.23
reference: Leviticus 13:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּ֜י/הָ תַּעֲמֹ֤ד הַ/בַּהֶ֨רֶת֙ לֹ֣א פָשָׂ֔תָה צָרֶ֥בֶת הַ/שְּׁחִ֖ין הִ֑וא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: ml
  text: എന്നാൽ ആ വെളുത്ത പാട് അതേ സ്ഥാനത്തുതന്നെ നിൽക്കുകയും പടരാതിരിക്കുകയും ചെയ്താൽ[a], അത് പരുവിന്റെ പാടാണ്; പുരോഹിതൻ അയാളെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ കീഴിൽ’; വെളുത്ത പാട് പടരാതെ ഉണ്ടായിരുന്ന സ്ഥാനത്തുതന്നെ തുടരുന്നു എന്നതാണ് എബ്രായ പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ചെയ്താൽ
  rationale: മുൻവാക്യത്തിലെ സാഹചര്യത്തോടുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്ന സോപാധിക പ്രയോഗം.
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: അതേ സ്ഥാനത്തുതന്നെ നിൽക്കുകയും
  rationale: അക്ഷരാർഥം ‘അതിന്റെ കീഴിൽ നിൽക്കുക’ എന്നാണെങ്കിലും, രോഗനിർണയസന്ദർഭത്തിൽ പാട് പടരാതെ ഉണ്ടായിരുന്നിടത്തുതന്നെ തുടരുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: הַבַּהֶרֶת
  choice: ആ വെളുത്ത പാട്
  rationale: ചർമത്തിൽ ദൃശ്യമാകുന്ന പ്രകാശമുള്ളതോ വെളുത്തതോ ആയ അടയാളത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു; പ്രത്യേക രോഗനിർണയം ചേർക്കുന്നില്ല.
- source_word: לֹא פָשָׂתָה
  choice: പടരാതിരിക്കുകയും
  rationale: ലേവ്യപുസ്തകം 13-ൽ ചർമത്തിലെ ബാധ വ്യാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: പരുവിന്റെ പാട്
  rationale: വീക്കം/പരുവ് ഭേദമായശേഷം ശേഷിക്കുന്ന അടയാളം എന്ന ആശയം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: പുരോഹിതൻ അയാളെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതൻ ശാരീരികമായി സുഖപ്പെടുത്തുന്നു എന്നല്ല, ആചാരപരമായ ശുദ്ധസ്ഥിതി ഔദ്യോഗികമായി നിർണയിക്കുന്നു എന്ന അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആചാരശുദ്ധിയും വൈദ്യസൗഖ്യവും തമ്മിലുള്ള വ്യത്യാസം
  choice: ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  alternative: അയാളെ ശുദ്ധീകരിക്കണം
  rationale: טהר ഇവിടെ പുരോഹിതന്റെ പരിശോധനയെ തുടർന്നുള്ള ആചാരപരമായ നിലപ്രഖ്യാപനമാണ്; പുരോഹിതൻ രോഗം സുഖപ്പെടുത്തുന്നു എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നിയമപരവും ആചാരപരവുമായ സന്ദർഭം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു.
