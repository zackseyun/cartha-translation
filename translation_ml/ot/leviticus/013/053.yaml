translation:
  language: ml
  text: എന്നാൽ പുരോഹിതൻ പരിശോധിച്ചുനോക്കുമ്പോൾ, ഇതാ, ബാധ വസ്ത്രത്തിലോ നീളനൂലിലോ കുറുകെനൂലിലോ[a] തോൽകൊണ്ടുള്ള ഏതെങ്കിലും വസ്തുവിലോ പടർന്നിട്ടില്ലെങ്കിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുറുകെനൂൽ’ എന്നതിന് ‘ഊടുനൂൽ’ എന്നും പറയാം; രണ്ടും നെയ്ത തുണിയിൽ കുറുകെ പോകുന്ന നൂലുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … എങ്കിൽ
  rationale: മുൻ നടപടിയുടെ തുടർച്ചയായ വ്യവസ്ഥയും നേരിയ വൈരുധ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יִרְאֶה
  choice: പരിശോധിച്ചുനോക്കുമ്പോൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘കാണുക’ എന്നാണെങ്കിലും, ഇവിടെ പുരോഹിതൻ നടത്തുന്ന ഔദ്യോഗിക പരിശോധനയാണ് സന്ദർഭം.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ പരിശോധന നടത്തുന്ന വ്യക്തിക്കുള്ള സ്ഥിരവും സ്വാഭാവികവുമായ പദം.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പരിശോധനയിൽ കണ്ട ഫലത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരസൂചകം നിലനിർത്തുന്നു.
- source_word: לֹא פָשָׂה
  choice: പടർന്നിട്ടില്ല
  rationale: ബാധ കൂടുതൽ വ്യാപിച്ചിട്ടില്ലെന്ന പരിശോധനാഫലം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הַנֶּגַע
  choice: ബാധ
  rationale: ആധുനിക വൈദ്യശാസ്ത്രപരമായ പ്രത്യേക രോഗനിർണയം ചുമത്താതെ, ബാധിച്ച അവസ്ഥയെയോ പാടിനെയോ സൂചിപ്പിക്കുന്ന വിശാലമായ പദം.
- source_word: בַּבֶּגֶד
  choice: വസ്ത്രത്തിൽ
  rationale: ഈ ഭാഗത്തിലെ നെയ്ത വസ്തുവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בַשְּׁתִי
  choice: നീളനൂലിൽ
  rationale: നെയ്ത്തിലെ നീളദിശയിലുള്ള warp നൂലുകളെ സാധാരണ വായനക്കാർക്കും മനസ്സിലാകുന്ന വിധത്തിൽ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: בָעֵרֶב
  choice: കുറുകെനൂലിൽ
  rationale: നെയ്ത്തിലെ കുറുകെ പോകുന്ന weft/woof നൂലുകളെ സുതാര്യമായി സൂചിപ്പിക്കുന്നു; സാങ്കേതിക പര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּכָל כְּלִי עוֹר
  choice: തോൽകൊണ്ടുള്ള ഏതെങ്കിലും വസ്തുവിൽ
  rationale: כְּלִי എന്ന പൊതുവായ ‘ഉപകരണം/വസ്തു’ എന്ന അർഥം അനാവശ്യമായി ചുരുക്കാതെ, നിർമ്മിത തോൽവസ്തുവിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
