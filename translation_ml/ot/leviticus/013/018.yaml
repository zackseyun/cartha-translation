source:
  edition: WLC
  text: וּ/בָשָׂ֕ר כִּֽי יִהְיֶ֥ה בֽ/וֹ בְ/עֹר֖/וֹ שְׁחִ֑ין וְ/נִרְפָּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/018.yaml
  text: And when the body has a boil in its skin[a], and it heals[c][b],
translation:
  language: ml
  text: ഒരാളുടെ ശരീരത്തിലെ[a] തൊലിയിൽ ഒരു പരുവുണ്ടായി അതു സുഖം പ്രാപിക്കുമ്പോൾ[c],[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാംസത്തിലെ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഒരാളുടെ ശരീരത്തിലെ തൊലിയിൽ ഒരു പരുവുണ്ടായി അതു സുഖം പ്രാപിച്ചാൽ.’
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘അതു സുഖപ്പെട്ടിരിക്കുമ്പോൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָשָׂר
  choice: ഒരാളുടെ ശരീരം
  rationale: בָשָׂר എന്നത് അക്ഷരാർഥത്തിൽ ‘മാംസം’ എന്നായിരിക്കാമെങ്കിലും, രോഗനിർണയവുമായി ബന്ധപ്പെട്ട ഈ നിയമസന്ദർഭത്തിൽ മുഴുവൻ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ഒരാളുടെ ശരീരം’ എന്നു പറയുന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്; ‘മാംസം’ എന്ന ഔപചാരിക ബദൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: ചെയ്യുമ്പോൾ
  rationale: ഇവിടെ כִּי ഒരു നിയമപരമായ സാഹചര്യം അവതരിപ്പിക്കുന്നു. നടപടിക്രമപരമായ ശൈലിയിൽ ‘ചെയ്യുമ്പോൾ’ സ്വാഭാവികമാണ്; സോപാധികമായ ‘ചെയ്താൽ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יִהְיֶה
  choice: ഉണ്ടാകുക
  rationale: ഹീബ്രു ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ആയിരിക്കുക/ഉണ്ടായിരിക്കുക’ എന്നതാണ്. പരുവിനെക്കുറിച്ച് മലയാളത്തിൽ ‘ഉണ്ടാകുക’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: בּוֹ בְעֹרוֹ
  choice: ശരീരത്തിലെ തൊലിയിൽ
  rationale: ‘അതിൽ, അതിന്റെ തൊലിയിൽ’ എന്ന ഇരട്ട സ്ഥാനസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി ‘ശരീരത്തിലെ തൊലിയിൽ’ എന്നു സംയോജിപ്പിച്ചിരിക്കുന്നു.
- source_word: שְׁחִין
  choice: പരുവ്
  rationale: שְׁחִין ഒരു പരുവിനെയോ വീക്കവും പഴുപ്പുമുള്ള ത്വക്കുവ്രണത്തെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഈ സന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണ് ‘പരുവ്’.
- source_word: וְנִרְפָּא
  choice: അതു സുഖപ്പെടുക
  rationale: רפא എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ സ്വയം സുഖപ്പെടുന്ന അവസ്ഥയെയോ സുഖം പ്രാപിച്ചതിനെയോ സൂചിപ്പിക്കാം. ‘അതു സുഖപ്പെടുക’ ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്; നിഷ്ക്രിയരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. നിയമപരമായ സാഹചര്യം അവതരിപ്പിക്കുന്ന ഹീബ്രു ഘടന സ്വാഭാവിക മലയാളത്തിലെ ‘ചെയ്യുമ്പോൾ’ എന്ന രൂപത്തിൽ നൽകി; പ്രധാന പദവികല്പങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
