  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֹת֜/וֹ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֮ שֵׁנִית֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע וְ/לֹא פָשָׂ֥ה הַ/נֶּ֖גַע בָּ/ע֑וֹר וְ/טִהֲר֤/וֹ הַ/כֹּהֵן֙ מִסְפַּ֣חַת הִ֔יא וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: ml
  text: ഏഴാം ദിവസം പുരോഹിതൻ അവനെ വീണ്ടും പരിശോധിക്കണം. ബാധ മങ്ങിയിരിക്കുകയും തൊലിയിൽ പടരാതിരിക്കുകയും ചെയ്തിട്ടുണ്ടെങ്കിൽ, പുരോഹിതൻ അവനെ ശുദ്ധനെന്ന് പ്രഖ്യാപിക്കണം. അത് ചെതുമ്പലോടുകൂടിയ ഒരു ചർമതിണർപ്പാണ്[a]. അവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകണം; അപ്പോൾ അവൻ ശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചർമത്തിലെ തിണർപ്പ്.’ എബ്രായപദം ഗുരുതരമായി പടരുന്ന അവസ്ഥയിൽനിന്ന് വ്യത്യസ്തമായ, താരതമ്യേന ലഘുവായ ഒരു ചർമവിസ്ഫോടനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: പരിശോധിക്കണം
  rationale: പുരോഹിതന്റെ ഔദ്യോഗിക നിരീക്ഷണമാണ് സന്ദർഭം; വെറുതെ ‘കാണുക’ എന്നതിലുപരി ‘പരിശോധിക്കുക’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שֵׁנִית
  choice: വീണ്ടും
  rationale: പരിശോധന ആവർത്തിക്കുന്നതിനെ ആധുനിക മലയാളത്തിൽ ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: כֵּהָה
  choice: മങ്ങിയിരിക്കുക
  rationale: ചർമബാധയുടെ നിറമോ തീവ്രതയോ കുറഞ്ഞതായി കാണപ്പെടുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַנֶּגַע
  choice: ബാധ
  rationale: ഇത് പരിശോധിക്കപ്പെടുന്ന ദൃശ്യമായ ചർമാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ഒരു പ്രത്യേക ആധുനിക വൈദ്യനിർണയം അനാവശ്യമായി ചുമത്താതിരിക്കാൻ പൊതുവായ ‘ബാധ’ തെരഞ്ഞെടുത്തു.
- source_word: פָשָׂה
  choice: പടരാതിരിക്കുക
  rationale: ചർമത്തിൽ അവസ്ഥ വ്യാപിക്കാത്തതിനെ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
- source_word: בָּעוֹר
  choice: തൊലിയിൽ
  rationale: עור എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘തൊലി’യാണ്; ഇവിടെ ബാധ വ്യാപിക്കുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: പുരോഹിതൻ അവനെ ശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതൻ ശാരീരികമായി സുഖപ്പെടുത്തുന്നതല്ല, ആചാരപരമായ ശുദ്ധിയുടെ ഔദ്യോഗിക വിധി പ്രസ്താവിക്കുന്നതാണ്.
- source_word: מִסְפַּחַת
  choice: ചർമപ്പൊരിച്ചിൽ
  rationale: ഗുരുതരമായി പടരുന്ന അവസ്ഥയിൽനിന്നു വ്യത്യസ്തമായ, താരതമ്യേന ലഘുവായ ചർമവിസ്ഫോടനത്തെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: അവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകണം
  rationale: വസ്ത്രങ്ങൾ കഴുകാനുള്ള നിർദേശം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְטָהֵר
  choice: അപ്പോൾ അവൻ ശുദ്ധനായിരിക്കും
  rationale: വസ്ത്രങ്ങൾ കഴുകിയതിന് ശേഷമുള്ള ആചാരപരമായ ശുദ്ധസ്ഥിതി വ്യക്തമാക്കുന്നു; ശാരീരിക രോഗശാന്തി എന്ന ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ആചാരപരമായ ശുദ്ധിവിധിയോ ശാരീരിക സൗഖ്യമോ
  choice: പുരോഹിതൻ ‘ശുദ്ധനെന്നു പ്രഖ്യാപിക്കുന്നു’; അവസാനം ആ വ്യക്തി ‘ശുദ്ധനായിരിക്കും.’
  alternative: പുരോഹിതൻ അവനെ ശുദ്ധീകരിക്കുന്നു; അവൻ സൗഖ്യം പ്രാപിക്കുന്നു.
  rationale: ഈ നിയമഭാഗം പുരോഹിതന്റെ ആചാരപരവും നിയമപരവുമായ വിലയിരുത്തലിനെക്കുറിച്ചാണ്. ശാരീരിക രോഗശാന്തിയോ പ്രത്യേക വൈദ്യനിർണയമോ പാഠം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരവും ആചാരപരവുമായ ഭാവം നിലനിർത്തിയിട്ടുണ്ട്. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘ഏഴാം ദിവസം’ എന്നതിനു പിന്നാലെ വന്നിരുന്നെങ്കിലും, അടിക്കുറിപ്പ് מִסְפַּחַת എന്ന ചർമാവസ്ഥയെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ബന്ധപ്പെട്ട പദത്തിനരികെ ചിഹ്നം സ്ഥാപിച്ചു.
