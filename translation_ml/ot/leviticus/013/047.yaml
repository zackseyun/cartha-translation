  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ത്സാരാഅത്ത്’. പരമ്പരാഗതമായി ‘കുഷ്ഠം’ എന്നു വിവർത്തനം ചെയ്യുന്ന ഈ പദം ആധുനിക ഹാൻസൻ രോഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; ഇവിടെ വസ്ത്രങ്ങളിൽ കാണപ്പെടുന്ന ബാധയോ മലിനമായ അവസ്ഥയോ ഉൾപ്പെടുന്ന വിശാലമായ ഒരു വിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: ഒരു വസ്ത്രത്തിൽ
  rationale: എബ്രായത്തിലെ നിർദിഷ്ടരൂപം നിയമപരമായ പൊതുസാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ അനിർദിഷ്ട ഏകവചനം സ്വാഭാവികമാണ്. തുടർന്നുള്ള בּוֹ എന്ന സ്ഥലസൂചനയോടു ചേർത്ത് ‘വസ്ത്രത്തിൽ’ എന്നു നൽകി.
- source_word: כִּי יִהְיֶה בוֹ
  choice: ഉണ്ടായാൽ
  rationale: നിയമസാഹചര്യം അവതരിപ്പിക്കുന്ന כִּיയും അപൂർണ്ണക്രിയയും മലയാളത്തിൽ ‘ഉണ്ടായാൽ’ എന്നു സ്വാഭാവികമായി വരുന്നു; ‘വസ്ത്രത്തിൽ’ എന്നതിലൂടെ בּוֹയുടെ സ്ഥലാർഥം നിലനിർത്തി.
- source_word: נֶגַע צָרָעַת
  choice: കുഷ്ഠബാധയുടെ പാട്[a]
  rationale: נֶגַע പരിശോധനയ്ക്കു വിധേയമായ ദൃശ്യമായ പാട്/ബാധയെ സൂചിപ്പിക്കുന്നു. പരമ്പരാഗതമായി പരിചിതമായ ‘കുഷ്ഠ’ നിലനിർത്തിയെങ്കിലും צָרָעַת ആധുനിക ഹാൻസൻ രോഗത്തിൽ ഒതുങ്ങുന്നില്ലെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: בְּבֶגֶד צֶמֶר
  choice: കമ്പിളിവസ്ത്രത്തിലോ
  rationale: צֶמֶר ആട്ടിൻരോമം/കമ്പിളി സൂചിപ്പിക്കുന്നു; വസ്ത്രത്തിന്റെ വസ്തു വ്യക്തമാക്കാൻ ‘കമ്പിളിവസ്ത്രം’ സ്വാഭാവികമാണ്. בְּ എന്ന സ്ഥലസൂചന ‘-ത്തിൽ’ വഴി നിലനിർത്തി.
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: ചണവസ്ത്രത്തിലോ
  rationale: פִּשְׁתִּים ചണനാരിൽനിന്നുള്ള ലിനൻ തുണിയാണ്. സാധാരണ മലയാളത്തിൽ മനസ്സിലാകുന്ന ‘ചണവസ്ത്രം’ തെരഞ്ഞെടുത്തു; ആവർത്തിക്കുന്ന בְּയുടെ സ്ഥലാർഥവും നിലനിർത്തി.
theological_decisions:
- issue: צָרָעַת എന്ന പദത്തിന്റെ പരിധി
  choice: മുഖ്യവാക്യത്തിൽ പരമ്പരാഗതമായ ‘കുഷ്ഠബാധ’ നിലനിർത്തി, വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘മലിനമാക്കുന്ന ബാധ’ അല്ലെങ്കിൽ ‘പടരുന്ന പൂപ്പൽബാധ’ എന്നു നിർവചിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: ഇവിടെ ബാധ വസ്ത്രത്തിനാണ്; അതിനാൽ ഇത് ആധുനിക ഹാൻസൻ രോഗം മാത്രമാകാനാവില്ല. എന്നാൽ മൂലപദത്തിന്റെ കൃത്യസ്വഭാവം നിർണ്ണയിച്ച് പറയാനാകാത്തതിനാൽ ഒരു പ്രത്യേക രോഗമോ പൂപ്പലോ ആയി ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യങ്ങളിലേക്കു വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ‘ആയിരിക്കട്ടെ’ എന്നത് രണ്ട് വസ്ത്രവിഭാഗങ്ങളിലേതായാലും എന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുമ്പോഴും ‘-ത്തിൽ’ രൂപങ്ങളിലൂടെ എബ്രായത്തിലെ ആവർത്തിച്ച സ്ഥലസൂചന സംരക്ഷിക്കുന്നു.
