  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമ-പരിശോധനാശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ നിരീക്ഷണക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ലക്ഷണങ്ങളെ ‘എന്നും … എന്നും കണ്ടാൽ’ എന്ന ഘടനയിൽ ചേർത്തു; അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന നിബന്ധന നിലനിർത്താൻ ഒടുവിൽ കോമ ഉപയോഗിച്ചു.
