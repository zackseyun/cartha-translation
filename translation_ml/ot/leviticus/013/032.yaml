  text: וְ/רָאָ֨ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּגַע֮ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔תֶק וְ/לֹא הָ֥יָה ב֖/וֹ שֵׂעָ֣ר צָהֹ֑ב וּ/מַרְאֵ֣ה הַ/נֶּ֔תֶק אֵ֥ין עָמֹ֖ק מִן הָ/עֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: ml
  text: ഏഴാം ദിവസം പുരോഹിതൻ ബാധിതമായ ഭാഗം പരിശോധിക്കണം. ചെതുമ്പൽപ്പാട്[a] പടർന്നിട്ടില്ലെന്നും അതിൽ മഞ്ഞനിറമുള്ള രോമം ഇല്ലെന്നും ആ പാട് ത്വക്കിനെക്കാൾ കുഴിഞ്ഞതായി കാണപ്പെടുന്നില്ലെന്നും കണ്ടാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടത്തെ എബ്രായപദം נֶתֶק (നെതെഖ്) ശിരസ്സിലോ താടിയിലോ ഉണ്ടാകുന്ന ഒരു പ്രത്യേകതരം ചെതുമ്പലോടുകൂടിയ ബാധയെ സൂചിപ്പിക്കുന്നു; ഇതിനെ ‘ചൊറി’ എന്നും പഴയ പ്രയോഗത്തിൽ മറ്റൊരു പ്രത്യേക രോഗനാമത്താലും വിവർത്തനം ചെയ്തിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: പരിശോധിക്കണം
  rationale: പുരോഹിതൻ നടത്തുന്ന ഔദ്യോഗിക രോഗലക്ഷണനിർണയത്തിന്റെ പശ്ചാത്തലത്തിൽ വെറും ‘കാണുക’ എന്നതിലുപരി സൂക്ഷ്മമായി പരിശോധിക്കുക എന്ന നടപടിക്രമപരമായ അർഥം നൽകുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ വിശുദ്ധി-ശുദ്ധി നിയമങ്ങളിൽ പരിശോധന നടത്താൻ അധികാരപ്പെടുത്തിയ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാള പദം.
- source_word: הַנֶּגַע
  choice: ബാധിതമായ ഭാഗം
  rationale: נֶגַע എന്നത് ഒരു പ്രത്യേക ആധുനിക രോഗനാമമല്ല; ബാധയേറ്റ സ്ഥലത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം യോജിക്കുന്നു.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: വീണ്ടും പരിശോധന നടത്തേണ്ട നിശ്ചിത ദിവസത്തെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: എന്നും കണ്ടാൽ
  rationale: പരിശോധനയിൽ തെളിയുന്ന ലക്ഷണങ്ങളിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു സൂചനയെ, തുടർന്നുള്ള നിബന്ധനാപരമായ വാക്യഘടനയോട് ചേർന്ന് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לֹא פָשָׂה
  choice: പടർന്നിട്ടില്ല
  rationale: ത്വക്കിലെ ബാധ വ്യാപിച്ചിട്ടില്ല എന്ന രോഗനിർണയസന്ദർഭത്തിലെ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: הַנֶּתֶק
  choice: ചെതുമ്പൽപ്പാട്
  rationale: ശിരസ്സിലോ താടിയിലോ ഉണ്ടാകുന്ന പ്രത്യേകതരം ചെതുമ്പലോടുകൂടിയ ബാധയെ സൂചിപ്പിക്കുന്നു; അനിശ്ചിതമായ ഒരു ആധുനിക രോഗനാമം ചുമത്താതെ ദൃശ്യസ്വഭാവം അറിയിക്കുന്നു.
- source_word: וְלֹא הָיָה בוֹ שֵׂעָר צָהֹב
  choice: അതിൽ മഞ്ഞനിറമുള്ള രോമം ഇല്ലെന്നും
  rationale: ബാധിതസ്ഥാനത്തിനുള്ളിൽ ഈ നിർണായക ലക്ഷണം ഇല്ലെന്ന സ്ഥാനസൂചനയും അർഥവും നിലനിർത്തുന്നു.
- source_word: שֵׂעָר צָהֹב
  choice: മഞ്ഞനിറമുള്ള രോമം
  rationale: צָהֹב സൂചിപ്പിക്കുന്ന മഞ്ഞകലർന്ന നിറം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: וּמַרְאֵה הַנֶּתֶק אֵין עָמֹק מִן הָעוֹר
  choice: ആ പാട് ത്വക്കിനെക്കാൾ കുഴിഞ്ഞതായി കാണപ്പെടുന്നില്ലെന്നും
  rationale: ബാധിതഭാഗം ചുറ്റുമുള്ള ത്വക്കിന്റെ നിരപ്പിനേക്കാൾ താഴ്ന്നോ ആഴമുള്ളതായോ ദൃശ്യമാകുന്നുണ്ടോ എന്ന പരിശോധനാമാനദണ്ഡം കൃത്യമായി വ്യക്തമാക്കുന്നു.
