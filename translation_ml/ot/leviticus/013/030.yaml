id: LEV.13.30
reference: Leviticus 13:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וּ/ב֛/וֹ שֵׂעָ֥ר צָהֹ֖ב דָּ֑ק וְ/טִמֵּ֨א אֹת֤/וֹ הַ/כֹּהֵן֙ נֶ֣תֶק ה֔וּא צָרַ֧עַת הָ/רֹ֛אשׁ א֥וֹ הַ/זָּקָ֖ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: ml
  text: പുരോഹിതൻ രോഗബാധിതമായ ഭാഗം പരിശോധിക്കണം. അതിന്റെ രൂപം തൊലിയെക്കാൾ ആഴത്തിലുള്ളതായും അതിൽ നേർത്ത മഞ്ഞനിറമുള്ള രോമം ഉള്ളതായും കണ്ടാൽ, പുരോഹിതൻ അയാളെ അശുദ്ധനെന്ന് പ്രഖ്യാപിക്കണം. അത് നെതെക്[a] ആണ്; ശിരസ്സിന്റെയോ താടിയുടെയോ ചർമ്മരോഗമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ נֶתֶק ശിരസ്സിലോ താടിയിലോ ഉണ്ടാകുന്ന ഒരു പ്രത്യേക രോഗബാധയെ സൂചിപ്പിക്കുന്നു. ഇതിന്റെ കൃത്യമായ ആധുനിക വൈദ്യശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്; പരമ്പരാഗതമായി ഇതിനെ ‘സ്കാൾ’ എന്നു വിവർത്തനം ചെയ്തിട്ടുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ צָרַעַת ഗുരുതരമായ പലതരം ചർമ്മരോഗങ്ങളെ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്; അത് ആധുനിക കുഷ്ഠരോഗത്തെ (ഹാൻസൻസ് രോഗം) മാത്രം സൂചിപ്പിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: രോഗബാധിത ഭാഗം
  rationale: ലേവ്യപുസ്തകം 13-ലെ പുരോഹിതപരിശോധനയ്ക്ക് വിധേയമായ ദൃശ്യമായ ബാധിത പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ബാധ’ എന്നതിനെക്കാൾ വ്യക്തവും ‘വ്യാധി’ എന്നതിനെക്കാൾ സ്ഥലസൂചകവുമാണ്.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: അതിന്റെ രൂപം തൊലിയെക്കാൾ ആഴത്തിലുള്ളതായി കാണുക
  rationale: ബാധിത ഭാഗം താഴ്ന്നതായോ തൊലിയുടെ അടിയിലേക്ക് വ്യാപിച്ചതായോ തോന്നുന്ന രോഗനിർണയലക്ഷണം വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
- source_word: שֵׂעָר צָהֹב דַּק
  choice: നേർത്ത മഞ്ഞ രോമം
  rationale: צָהֹב എന്ന നിറസൂചനയും דַּק എന്ന നേർമസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְטִמֵּא אֹתוֹ
  choice: അയാളെ അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതൻ അശുദ്ധി സൃഷ്ടിക്കുന്നതല്ല, ആചാരപരമായ വിധി പ്രസ്താവിക്കുന്നതാണ് എന്ന നിയമപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: נֶתֶק
  choice: രോമം കൊഴിയുന്ന രോഗം
  rationale: ശിരസ്സിലോ താടിയിലോ വരുന്ന, രോമം വേർപെടുകയോ കൊഴിയുകയോ ചെയ്യുന്ന പ്രത്യേക ബാധയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; കൃത്യമായ ആധുനിക രോഗനാമം അനിശ്ചിതമായതിനാൽ വിവരണാത്മക പദം ഉപയോഗിക്കുന്നു.
- source_word: צָרַעַת
  choice: ചർമരോഗം
  rationale: ഈ എബ്രായപദം ആധുനിക ഹാൻസൻസ് രോഗത്തേക്കാൾ വിശാലമായ രോഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുഷ്ഠം’ എന്ന തെറ്റിദ്ധരിപ്പിക്കാവുന്ന നിർദിഷ്ടത ഒഴിവാക്കുന്നു.
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: ശിരസ്സിലോ താടിയിലോ
  rationale: ബാധയുടെ സ്ഥാനം അടുത്തും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘തലയോട്ടി’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: അശുദ്ധതയുടെ സ്വഭാവം
  choice: ‘അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം’ എന്ന ന്യായവിധിസ്വഭാവമുള്ള ഭാഷ
  alternative: ‘അശുദ്ധനാക്കണം’
  rationale: ഇവിടെ പുരോഹിതൻ ആചാരപരമായ നില നിർണയിക്കുകയാണ്; അയാൾ അശുദ്ധതയ്ക്ക് കാരണമാകുന്നു എന്ന അർഥം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആചാര ശൈലി. സാങ്കേതിക രോഗനാമങ്ങൾ നിർബന്ധിച്ച് ചേർക്കാതെ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിവരണാത്മക ഭാഷ ഉപയോഗിച്ചു. וְהִנֵּה വേറിട്ട് ‘ഇതാ’ എന്നു പരിഭാഷപ്പെടുത്താതെ, നിരീക്ഷണഫലത്തെ സൂചിപ്പിക്കുന്ന ‘കാണുകയും’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
