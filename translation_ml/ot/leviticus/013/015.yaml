- source_word: צָרַעַת
  choice: ത്വഗ്രോഗം
  rationale: ഈ എബ്രായപദം ആധുനിക കുഷ്ഠരോഗത്തോട് കൃത്യമായി ഒത്തുപോകുന്നില്ല; അതിനാൽ തെറ്റായ വൈദ്യനിർണയം ഒഴിവാക്കുന്ന വിശാലമായ പദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ലേവ്യശുദ്ധിനിയമത്തിൽ צָרַעַת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ത്വഗ്രോഗം
