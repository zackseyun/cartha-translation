translation:
  language: ml
  text: പുരോഹിതൻ ജീവനുള്ള മാംസം[a] കാണുമ്പോൾ, അവൻ അവനെ അശുദ്ധനെന്ന് പ്രഖ്യാപിക്കണം[b]. ജീവനുള്ള മാംസം അശുദ്ധമാണ്; അതു ത്വഗ്രോഗമാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ജീവനുള്ള മാംസം’; സന്ദർഭത്തിൽ വെളിപ്പെട്ട ജീവനുള്ള ശരീരകലയെ സൂചിപ്പിക്കുന്നു. ‘പച്ചമാംസം’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അശുദ്ധനെന്ന് വിധിക്കണം.’ പുരോഹിതൻ ഇവിടെ ശുദ്ധി-അശുദ്ധിയെക്കുറിച്ചുള്ള ഔദ്യോഗിക വിധി പ്രസ്താവിക്കുകയാണ്.
    reason: lexical_alternative
  - marker: c
    text: പരമ്പരാഗതമായി ‘കുഷ്ഠരോഗം.’ എന്നാൽ എബ്രായപദം ആധുനിക കുഷ്ഠരോഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; പലതരം ത്വഗ്രോഗങ്ങളെയോ ത്വക്ക്‌സ്ഥിതികളെയോ ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
