id: LEV.13.44
reference: Leviticus 13:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִישׁ צָר֥וּעַ ה֖וּא טָמֵ֣א ה֑וּא טַמֵּ֧א יְטַמְּאֶ֛/נּוּ הַ/כֹּהֵ֖ן בְּ/רֹאשׁ֥/וֹ נִגְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: ml
  text: അവൻ ചർമരോഗം ബാധിച്ച പുരുഷനാണ്; അവൻ അശുദ്ധനാണ്.[a] പുരോഹിതൻ അവനെ അശുദ്ധനെന്ന് തീർച്ചയായും പ്രഖ്യാപിക്കണം; അവന്റെ ബാധ അവന്റെ തലയിലാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി, “കുഷ്ഠരോഗിയായ പുരുഷൻ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഈ അധ്യായത്തിൽ പരിഗണിക്കുന്ന ചർമാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; അത് ആധുനിക കുഷ്ഠരോഗത്തോട് (ഹാൻസൻ രോഗം) നിർബന്ധമായും സമാനമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: പുരുഷൻ
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ ഏകവചന പുല്ലിംഗത്തിലുള്ള ഒരു വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: צָרוּעַ
  choice: ചർമരോഗം ബാധിച്ച
  rationale: ഈ അധ്യായത്തിൽ പരിശോധിക്കുന്ന ചർമാവസ്ഥ ബാധിച്ചയാളെ സൂചിപ്പിക്കുന്നു. ആധുനിക ഹാൻസൻ രോഗം മാത്രമാണെന്ന് തെറ്റിദ്ധരിപ്പിക്കാതിരിക്കാനും രോഗനിർണയപരമായ അർഥം നിലനിർത്താനും ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: טָמֵא הוּא
  choice: അവൻ അശുദ്ധനാണ്
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ അശുദ്ധിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും സ്വാഭാവികവുമായ സമാനപദം ‘അശുദ്ധൻ’ ആണ്.
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: അവനെ അശുദ്ധനെന്ന് തീർച്ചയായും പ്രഖ്യാപിക്കണം
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും അപൂർണക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗം ഊന്നൽ നൽകുന്നു. പുരോഹിതൻ അശുദ്ധനാക്കുകയല്ല, ആ നില ഔദ്യോഗികമായി പ്രഖ്യാപിക്കുകയാണ്; ‘തീർച്ചയായും’ ആ ഊന്നൽ അറിയിക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: പരിശോധനയും ഔദ്യോഗിക പ്രഖ്യാപനവും നടത്തുന്ന ആരാധനാശുശ്രൂഷകന്റെ പതിവായ മലയാള വിവർത്തനം.
- source_word: בְּרֹאשׁוֹ
  choice: അവന്റെ തലയിലാണ്
  rationale: എബ്രായം നേരിട്ട് തല എന്ന സ്ഥലസൂചന നൽകുന്നു; സമീപസന്ദർഭം ശിരോചർമത്തെക്കുറിച്ചാണെങ്കിലും മൂലപാഠത്തേക്കാൾ പ്രത്യേകമാക്കുന്നില്ല.
- source_word: נִגְעוֹ
  choice: അവന്റെ ബാധ
  rationale: לേവ്യപുസ്തകം 13-ൽ נגע പരിശോധനയ്ക്കു വിധേയമായ രോഗബാധയെയോ ക്ഷതത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ബാധ’ അതിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കാതെ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം മാന്യവും നിയമപരവുമായ ശൈലി പാലിച്ചു. ആചാരപരമായ അശുദ്ധിയും പുരോഹിതന്റെ ഔദ്യോഗിക പ്രഖ്യാപനവും വ്യക്തമായി വേർതിരിച്ചിരിക്കുന്നു.
