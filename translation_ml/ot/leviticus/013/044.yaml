  source_fidelity: 'The Malayalam accurately represents the Hebrew clauses: a male individual affected by the chapter''s skin condition, his ritual uncleanness, the priest''s emphatic declarative action, and the location of the affliction on his head. “അശുദ്ധനെന്ന് ... പ്രഖ്യാപിക്കണം” appropriately conveys a formal pronouncement rather than the priest causing uncleanness.'
  naturalness: The text is clear, idiomatic modern standard Malayalam, with a suitably formal legal-ritual register. “ചർമരോഗം ബാധിച്ച പുരുഷൻ” and “അവന്റെ ബാധ അവന്റെ തലയിലാണ്” are readily understandable without adding medical specificity absent from the source.
  terminology: “അശുദ്ധൻ” is the established Malayalam biblical term for ritual uncleanness. “പുരോഹിതൻ” is appropriate for הכהן. The lexical footnote responsibly preserves the traditional ‘leprous’ rendering while clarifying that the Hebrew category is not necessarily Hansen’s disease.
