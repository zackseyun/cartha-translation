id: LEV.13.57
reference: Leviticus 13:57
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם תֵּרָאֶ֨ה ע֜וֹד בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּ/אֵ֣שׁ תִּשְׂרְפֶ֔/נּוּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּֽגַע־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: ml
  text: എന്നാൽ വസ്ത്രത്തിലോ പാവിലോ ഊടിലോ തോൽകൊണ്ടുള്ള ഏതെങ്കിലും വസ്തുവിലോ ആ ബാധ വീണ്ടും കാണപ്പെട്ടാൽ, അതു പടർന്നുകൊണ്ടിരിക്കുന്ന ബാധയാണ്; ബാധയുള്ള വസ്തു തീയിൽ ചുട്ടുകളയണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: വീണ്ടും കാണപ്പെട്ടാൽ
  rationale: നിഫാൽ രൂപത്തിന്റെ ദൃശ്യമായി പ്രത്യക്ഷപ്പെടുക എന്ന നിരീക്ഷണാർഥവും עוֹד-ന്റെ ആവർത്തനാർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֶּגֶד
  choice: വസ്ത്രം
  rationale: ഈ അധ്യായത്തിലെ വസ്ത്രമോ തുണിവസ്തുവോ സൂചിപ്പിക്കുന്ന സാധാരണ പദം; സന്ദർഭത്തിൽ വേണ്ടത്ര വിശാലമാണ്.
- source_word: שְׁתִי
  choice: പാവ്
  rationale: നെയ്ത്തിലെ നീളത്തിലുള്ള നൂലുകളെ സൂചിപ്പിക്കുന്ന മലയാള സാങ്കേതികപദം.
- source_word: עֵרֶב
  choice: ഊട്
  rationale: പാവിന് കുറുകെ നെയ്യുന്ന നൂലുകളെ സൂചിപ്പിക്കുന്ന മലയാള സാങ്കേതികപദം.
- source_word: כְּלִי עוֹר
  choice: തോൽകൊണ്ടുള്ള ഏതെങ്കിലും വസ്തു
  rationale: തോൽകൊണ്ട് നിർമിച്ച ഉപകരണമോ സാധനമോ ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിശാലത കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: פֹּרַחַת הִוא
  choice: അതു പടർന്നുകൊണ്ടിരിക്കുന്ന ബാധയാണ്
  rationale: פרח എന്ന പദത്തിന്റെ മുളയ്ക്കുക/വ്യാപിക്കുക എന്ന രൂപകാർഥം ഈ മലിനബാധയുടെ സജീവമായ പടർച്ചയായി നൽകുന്നു.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: തീയിൽ ചുട്ടുകളയണം
  rationale: നിയമനിർദേശത്തിന്റെ നിർബന്ധസ്വരം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַנָּגַע
  choice: ബാധ
  rationale: ആധുനിക വൈദ്യനിർണയം അനാവശ്യമായി ചുമത്താതെ, ലേവ്യപുസ്തകം 13-ലെ ബാധിതമോ മലിനമോ ആയ പാടിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതികപ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പാവ്/ഊട് എന്നീ സ്ഥാപിത നെയ്ത്തുപദങ്ങൾ ഉപയോഗിച്ചു; പുരാതന വസ്ത്രമലിനതയെ ആധുനിക രോഗനാമമായി നിർവചിക്കുന്നത് ഒഴിവാക്കി.
