id: LEV.13.40
reference: Leviticus 13:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֥י יִמָּרֵ֖ט רֹאשׁ֑/וֹ קֵרֵ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/040.yaml
  text: If a man loses the hair of his head[a], he is bald; he is clean.
translation:
  language: ml
  text: ഒരു പുരുഷന്റെ തലയിലെ മുടി കൊഴിഞ്ഞുപോയാൽ[a], അവൻ കഷണ്ടിയുള്ളവനാണ്; അവൻ ശുദ്ധനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു പുരുഷന്റെ തല കഷണ്ടിയായാൽ.” എബ്രായ ക്രിയയ്ക്ക് തലമുടി നീങ്ങിപ്പോകുകയോ നഷ്ടപ്പെടുകയോ ചെയ്യുക എന്ന അർഥം വരാം; മുഖ്യപാഠം ഈ ക്രിയയും തുടർന്നുള്ള “കഷണ്ടിയുള്ളവൻ” എന്ന അവസ്ഥാവിവരണവും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായ ഈ പദം ശരീരപരിശോധനയെക്കുറിച്ചുള്ള ഒരു നിയമസാഹചര്യം അവതരിപ്പിക്കുന്നു; അതിനാൽ ലിംഗഭേദം വ്യക്തമാക്കുന്ന പരിഭാഷയാണ് യോജിച്ചത്.
- source_word: כִּי
  choice: -പോയാൽ
  rationale: നിയമപരവും രോഗനിർണയപരവുമായ ഈ സാഹചര്യത്തിൽ ഉപാധി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക സോപാധിക രൂപം ഉപയോഗിച്ചു.
- source_word: יִמָּרֵט
  choice: മുടി കൊഴിഞ്ഞുപോയാൽ
  rationale: מרט എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം രോമം നീങ്ങി ഭാഗം വെളിവാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. കാരണം വ്യക്തമാക്കാതെ മുടിനഷ്ടം പ്രകടിപ്പിക്കുകയും തുടർന്നുള്ള קֵרֵחַ എന്ന അവസ്ഥാവാചകത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: רֹאשׁוֹ
  choice: തലയിലെ
  rationale: മുടിനഷ്ടം തലയിൽ സംഭവിക്കുന്നതാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധരൂപത്തിൽ വ്യക്തമാക്കി.
- source_word: קֵרֵחַ
  choice: കഷണ്ടിയുള്ളവൻ
  rationale: മുടി നഷ്ടപ്പെട്ടതിന്റെ ഫലമായ അവസ്ഥയെ വ്യക്തവും സാധാരണവുമായ ആധുനിക മലയാളത്തിൽ പറയുന്നു.
- source_word: טָהוֹר
  choice: ശുദ്ധിയുള്ളവൻ
  rationale: ലേവ്യപുസ്തകം 13-ലെ ആചാരപരമായ ശുദ്ധസ്ഥിതിയാണ് ഉദ്ദേശിക്കുന്നത്; ധാർമിക നിരപരാധിത്വമല്ല.
- source_word: הוּא ... הוּא
  choice: അവൻ ... അവൻ
  rationale: ആവർത്തിച്ചുള്ള എബ്രായ സർവനാമം നൽകുന്ന ഊന്നൽ രണ്ട് സ്വതന്ത്ര വിധിവാക്യങ്ങളായി നിലനിർത്തി.
theological_decisions:
- issue: ലേവ്യ അശുദ്ധിനിയമത്തിലെ ആചാരപരമായ നില
  choice: ശുദ്ധിയുള്ളവൻ
  alternative: നിർമലൻ / വിശുദ്ധൻ
  rationale: വാക്യം ധാർമിക നിർമലതയെയോ വിശുദ്ധിയെയോ അല്ല, പരിശോധനയെത്തുടർന്നുള്ള ആചാരപരമായ ശുദ്ധസ്ഥിതിയെയാണ് പ്രഖ്യാപിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമവിവരണശൈലി. ‘കഷണ്ടി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ശുദ്ധിയുള്ളവൻ’ ആചാരപരമായ സാങ്കേതിക അർഥം സംരക്ഷിക്കുന്നു.
