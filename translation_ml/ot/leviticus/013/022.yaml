id: LEV.13.22
reference: Leviticus 13:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם פָּשֹׂ֥ה תִפְשֶׂ֖ה בָּ/ע֑וֹר וְ/טִמֵּ֧א הַ/כֹּהֵ֛ן אֹת֖/וֹ נֶ֥גַע הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/022.yaml
  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: ml
  text: എന്നാൽ അതു തൊലിയിൽ കൂടുതൽ പടർന്നാൽ, പുരോഹിതൻ അയാളെ അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം; അത് ഒരു ബാധയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബാധ’ എന്നതിന് ‘രോഗബാധ,’ ‘വ്യാധി,’ അല്ലെങ്കിൽ ‘ബാധിതമായ പാട്’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദം വിശാലമായ അർഥമുള്ളതിനാൽ അതിനെ ഒരു നിർദിഷ്ട ആധുനിക രോഗവിഭാഗവുമായി കൃത്യമായി ഒത്തുനോക്കാനാവില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … എങ്കിൽ/പടർന്നാൽ
  rationale: മുൻവിവരിച്ച സാഹചര്യത്തോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്ന വ്യവസ്ഥയായി വാവ് + אִם ഇവിടെ പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ‘എന്നാൽ … പടർന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: കൂടുതൽ പടർന്നാൽ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് + ഇംപെർഫെക്റ്റ് ഘടന പടരുക എന്ന ക്രിയയ്ക്ക് ഊന്നൽ നൽകുന്നു; ‘കൂടുതൽ പടർന്നാൽ’ ആ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു, അതിരുകടന്ന വ്യാപനം അനാവശ്യമായി സൂചിപ്പിക്കാതെ.
- source_word: בָּעוֹר
  choice: തൊലിയിൽ
  rationale: עוֹר എന്നത് ഇവിടെ ശരീരത്തിന്റെ തൊലിയെയാണ് സൂചിപ്പിക്കുന്നത്; בְ പ്രയോഗം ‘തൊലിയിൽ’ എന്നായി നിലനിർത്തുന്നു.
- source_word: וְטִמֵּא
  choice: അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതനിയമപരമായ ഈ സന്ദർഭത്തിൽ പീയേൽ രൂപം അശുദ്ധി ഉണ്ടാക്കുന്നതിനെക്കാൾ ആചാരപരമായ നില ഔദ്യോഗികമായി വിധിച്ചുപറയുന്നതാണ്.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണവും പ്രസക്തവുമായ മലയാളരൂപം.
- source_word: אֹתוֹ
  choice: അയാളെ
  rationale: നേരിട്ടുള്ള കർമം പരിശോധിക്കപ്പെടുന്ന പുരുഷവ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്, പാടിനെ മാത്രമല്ല.
- source_word: נֶגַע
  choice: ബാധ
  rationale: נֶגַע ഇവിടെ പാട്, രോഗബാധ, ബാധിതാവസ്ഥ എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാലപദമാണ്. ‘ബാധ’ ആ വ്യാപ്തി നിലനിർത്തുകയും നിർദിഷ്ടമായ ആധുനിക രോഗനിർണയം ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הִוא
  choice: അത് … ആണ്
  rationale: മുമ്പ് വിവരിച്ച അവസ്ഥയെ തിരിച്ചറിയിക്കുന്ന നാമവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതന്റെ അശുദ്ധപ്രഖ്യാപനത്തിന്റെ സ്വഭാവം
  choice: പുരോഹിതൻ അയാളെ അശുദ്ധനെന്നു ഔദ്യോഗികമായി പ്രഖ്യാപിക്കുന്നു.
  alternative: പുരോഹിതൻ അയാളെ അശുദ്ധനാക്കുന്നു.
  rationale: പുരോഹിതനിയമപരമായ സന്ദർഭം രോഗലക്ഷണം പരിശോധിച്ച് ആചാരപരമായ നില വിധിച്ചുപറയുന്നതിനെ സൂചിപ്പിക്കുന്നു; പുരോഹിതന്റെ വാക്ക് അശുദ്ധി സൃഷ്ടിക്കുന്നു എന്ന ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നിയമപരവും ആചാരപരവുമായ ആശയം വ്യക്തമായി സൂചിപ്പിക്കുമ്പോൾ വൈദ്യശാസ്ത്രപരമായ അമിതകൃത്യത ഒഴിവാക്കി. പ്രധാനപാഠത്തിലെ [a] അടയാളം ‘ബാധ’ എന്ന പദത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്.
