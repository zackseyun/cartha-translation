id: LEV.13.42
reference: Leviticus 13:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֤ה בַ/קָּרַ֨חַת֙ א֣וֹ בַ/גַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֨חַת֙ הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: ml
  text: എന്നാൽ തലയുടെ പിൻഭാഗത്തെ കഷണ്ടിയിലോ മുൻഭാഗത്തെ കഷണ്ടിയിലോ വെളുപ്പും ചുവപ്പും കലർന്ന രോഗപ്പാട്[b] ഉണ്ടായാൽ, അത് അവന്റെ തലയുടെ പിൻഭാഗത്തെ കഷണ്ടിയിലോ മുൻഭാഗത്തെ കഷണ്ടിയിലോ പടർന്നുവരുന്ന ചർമരോഗമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: “കുഷ്ഠം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം വിവിധ ചർമരോഗങ്ങളെയോ ചർമാവസ്ഥകളെയോ വിശാലമായി സൂചിപ്പിക്കുന്നു; അതിനെ ആധുനിക ഹാൻസൻ രോഗത്തോടു മാത്രം തുല്യമാക്കരുത്.'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള രണ്ട് എബ്രായപദങ്ങൾ തലയുടെ പിൻഭാഗത്തെ കഷണ്ടിയെയും മുൻഭാഗത്തെ കഷണ്ടിയെയും വേർതിരിച്ചുകാണിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: എന്നാൽ ... ഉണ്ടായാൽ
  rationale: നിയമപരമായ തുടർച്ചയിലെ വ്യവസ്ഥയും മുൻവാക്യത്തോടുള്ള വൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קָרַחַת / גַּבַּחַת
  choice: തലയുടെ പിൻഭാഗത്തെ കഷണ്ടി / മുൻഭാഗത്തെ കഷണ്ടി
  rationale: രണ്ടു വ്യത്യസ്ത എബ്രായ പദങ്ങൾ സൂചിപ്പിക്കുന്ന പിൻ-മുൻ ഭാഗവ്യത്യാസം മുഖ്യവാചകത്തിൽ തന്നെ നിലനിർത്തുന്നു.
- source_word: נֶגַע
  choice: രോഗപ്പാട്
  rationale: പരിശോധിക്കാവുന്ന ദൃശ്യമായ ബാധിതപാടിനെ സൂചിപ്പിക്കുന്നു; അത്യാധുനിക വൈദ്യശാസ്ത്രപരമായ കൃത്യത അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: לָבָן אֲדַמְדָּם
  choice: വെളുപ്പും ചുവപ്പും കലർന്ന
  rationale: പാടിന്റെ സംയുക്ത വർണവിവരണം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൃത്യമായ നിറഭേദം അമിതമായി നിർണയിക്കുന്നില്ല.
- source_word: צָרַעַת
  choice: ചർമരോഗം
  rationale: ഈ എബ്രായ പദത്തിന്റെ വിശാലമായ അർഥപരിധി നിലനിർത്തുകയും അതിനെ ആധുനിക ഹാൻസൻ രോഗത്തോട് മാത്രം തുല്യമാക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: פֹּרַחַת
  choice: പടർന്നുവരുന്ന
  rationale: രോഗാവസ്ഥ പൊട്ടിപ്പുറപ്പെടുകയോ വ്യാപിക്കുകയോ ചെയ്യുന്നുവെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; പ്രവൃത്തിയുടെ തുടരുന്ന സ്വഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: צָרַעַת എന്ന പദത്തെ പരമ്പരാഗതമായി ‘കുഷ്ഠം’ എന്നു വിവർത്തനം ചെയ്യുന്നത്
  choice: മുഖ്യവാചകത്തിൽ ‘ചർമരോഗം’
  alternative: ‘കുഷ്ഠം’
  rationale: പുരാതന എബ്രായ പദം ആധുനിക ഹാൻസൻ രോഗത്തേക്കാൾ വിശാലമായ പല ചർമാവസ്ഥകളെയും ഉൾക്കൊള്ളാം. അതിനാൽ തെറ്റായ വൈദ്യശാസ്ത്രസമീകരണം ഒഴിവാക്കി പരമ്പരാഗത പദം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമവിവരണ ശൈലി. അപൂർവമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി, എബ്രായത്തിലെ പിൻഭാഗം–മുൻഭാഗം വ്യത്യാസവും രോഗനിർണയത്തിലെ സൂക്ഷ്മതയും വ്യക്തമായി നിലനിർത്തി.
