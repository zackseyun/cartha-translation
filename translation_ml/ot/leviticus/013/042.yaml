  terminology: ‘ചർമരോഗം’ and its explanatory footnote appropriately avoid a misleading one-to-one identification with modern Hansen’s disease. ‘രോഗപ്പാട്’ is suitably neutral for נֶגַע. The footnote on the rear/front distinction is accurate and useful.
