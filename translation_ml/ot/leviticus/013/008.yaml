  edition: WLC
  text: וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשְׂתָ֥ה הַ/מִּסְפַּ֖חַת בָּ/ע֑וֹר וְ/טִמְּא֥/וֹ הַ/כֹּהֵ֖ן צָרַ֥עַת הִֽוא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: ml
  text: പുരോഹിതൻ അയാളെ പരിശോധിക്കണം; ചർമ്മത്തിലെ ആ പുറപ്പാട് പടർന്നിട്ടുണ്ടെങ്കിൽ, പുരോഹിതൻ അയാളെ അശുദ്ധനെന്ന് പ്രഖ്യാപിക്കണം; അത് സരാഅത്ത്[a] ആണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ സരാഅത്ത്. പരമ്പരാഗതമായി ‘കുഷ്ഠം’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ടെങ്കിലും, ലേവ്യപുസ്തകത്തിൽ ഈ പദം ആധുനിക കുഷ്ഠരോഗം (ഹാൻസൻസ് രോഗം) മാത്രമല്ല, കൂടുതൽ വിശാലമായ ഗുരുതര ചർമാവസ്ഥകളെയും ഉൾക്കൊള്ളുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: പരിശോധിക്കണം
  rationale: പുരോഹിതന്റെ ഔദ്യോഗിക രോഗനിർണയപരമായ നിരീക്ഷണമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; വെറുതെ ‘കാണുക’ എന്നതിനെക്കാൾ ‘പരിശോധിക്കുക’ യോജിക്കുന്നു.
- source_word: הַמִּסְפַּחַת
  choice: പൊറ്റൽ
  rationale: ചർമത്തിൽ കാണപ്പെടുന്ന ഉപരിതല പാട്/പൊട്ടിപ്പുറപ്പെടൽ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം; നിർദിഷ്ടമായ ഒരു ആധുനിക രോഗനാമം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: פָּשְׂתָה ... בָּעוֹר
  choice: ചർമത്തിൽ പടർന്നിട്ടുണ്ടെങ്കിൽ
  rationale: പരിശോധനയിൽ കണ്ടെത്തുന്ന വ്യവസ്ഥയും വ്യാപനമെന്ന പ്രധാന നിർണയലക്ഷണവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְטִמְּאוֹ
  choice: അയാളെ അശുദ്ധനെന്നു പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതൻ അശുദ്ധി ഉണ്ടാക്കുകയല്ല, ആചാരപരമായ നില ഔദ്യോഗികമായി പ്രഖ്യാപിക്കുകയാണ്.
- source_word: צָרַעַת
  choice: സരാഅത്ത്
  rationale: ഈ എബ്രായപദം ആധുനിക ഹാൻസൻസ് രോഗത്തോട് മാത്രം തുല്യമല്ല; അതിന്റെ വിശാലവും അനിശ്ചിതവുമായ പുരാതന അർഥപരിധി ലിപ്യന്തരണം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: צָרַעַת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: സരാഅത്ത്
  alternative: കുഷ്ഠം / ചർമരോഗം
  rationale: ‘കുഷ്ഠം’ എന്നത് ആധുനിക ഹാൻസൻസ് രോഗവുമായി തെറ്റായി സമീകരിക്കപ്പെടാം; ‘ചർമരോഗം’ മൂലപദത്തിന്റെ പ്രത്യേക ആചാര-നിയമപരമായ വർഗ്ഗത്തെ അതിയായി പൊതുവാക്കും. ലിപ്യന്തരണവും അടിക്കുറിപ്പും യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനടപടി ശൈലി. וְהִנֵּהയുടെ പരിശോധനാഫലസൂചകമായ പ്രയോഗം ‘ഉണ്ടെങ്കിൽ’ എന്ന വ്യവസ്ഥാരൂപത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
