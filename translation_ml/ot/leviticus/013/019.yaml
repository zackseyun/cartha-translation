revisions:
- from: പരുവുണ്ടായിരുന്ന സ്ഥലത്ത് വെളുത്ത ഒരു വീക്കമോ ചുവപ്പുകലർന്ന വെളുത്ത തിളക്കമുള്ള പാടോ ഉണ്ടായാൽ, അത് പുരോഹിതനെ കാണിക്കണം.[a]
  to: പരുവുണ്ടായിരുന്ന സ്ഥലത്ത് വെളുത്ത ഒരു വീക്കമോ ചുവപ്പുകലർന്ന വെളുത്ത തിളക്കമുള്ള പാടോ ഉണ്ടായാൽ, അത് പുരോഹിതന്റെ മുമ്പാകെ കാണപ്പെടണം.[a]
  rationale: The revision corrects the Malayalam case-role ambiguity in the final clause and uses a passive formulation that closely reflects וְנִרְאָה while preserving the source text’s ambiguity. The footnote now supplies the procedural ‘shown to the priest’ interpretation as an alternative rather than making it the primary text.
