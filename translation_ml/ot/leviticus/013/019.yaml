translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം ഉപയോഗിച്ചു. നിയമപരവും ആചാരപരവുമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് വാക്യം സ്വാഭാവികമായ സോപാധിക രൂപത്തിൽ അവതരിപ്പിച്ചു.
