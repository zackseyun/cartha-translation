  yaml_path: translation/ot/leviticus/013/019.yaml
  text: and in the place of the boil there develops a white swelling or a reddish-white bright spot[a], then it shall be shown to the priest.
translation:
  language: ml
  text: പരുവുണ്ടായിരുന്ന സ്ഥലത്ത് വെളുത്ത ഒരു വീക്കമോ ചുവപ്പുകലർന്ന വെളുത്ത തിളക്കമുള്ള പാടോ ഉണ്ടായാൽ, അത് പുരോഹിതന്റെ മുമ്പാകെ കാണപ്പെടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അത് പുരോഹിതന് കാണിക്കണം.’ എബ്രായപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘കാണപ്പെടണം’ അല്ലെങ്കിൽ ‘പ്രത്യക്ഷപ്പെടണം’ എന്നാണ്. ഇവിടെ പുരോഹിതന്റെ പരിശോധനയ്ക്കായി അതിനെ ഹാജരാക്കുന്നതാണ് സാധ്യതയേറിയ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ഉണ്ടായാൽ
  rationale: മുമ്പുണ്ടായിരുന്ന പരുവിന്റെ സ്ഥലത്ത് ഒരു ലക്ഷണം പ്രത്യക്ഷപ്പെടുന്നതിനെ രോഗനിർണയനിയമത്തിന്റെ സോപാധിക ഘടനയിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בִּמְקוֹם הַשְּׁחִין
  choice: പരുവുണ്ടായിരുന്ന സ്ഥലത്ത്
  rationale: שְׁחִין എന്നത് ഇവിടെ വീക്കവും വ്രണസ്വഭാവവുമുള്ള പരുവിനെ സൂചിപ്പിക്കുന്നു; പ്രസക്തമായ സ്ഥലം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: שְׂאֵת לְבָנָה
  choice: വെളുത്ത ഒരു വീക്കം
  rationale: שְׂאֵת ചർമത്തിൽ ഉയർന്നുനിൽക്കുന്ന വീക്കത്തെയോ തടിപ്പിനെയോ സൂചിപ്പിക്കുന്നു; ലളിതവും രോഗനിർണയസന്ദർഭത്തിന് യോജിച്ചതുമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: בַהֶרֶת לְבָנָה אֲדַמְדָּמֶת
  choice: ചുവപ്പുകലർന്ന വെളുത്ത തിളക്കമുള്ള പാട്
  rationale: בַהֶרֶת എന്ന തിളക്കമുള്ള ചർമപ്പാടിനെയും അതിന്റെ വെളുത്തതും ചുവപ്പുകലർന്നതുമായ വർണവിവരണത്തെയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וְנִרְאָה אֶל הַכֹּהֵן
  choice: അത് പുരോഹിതനെ കാണിക്കണം
  rationale: ראה എന്ന ക്രിയയുടെ നിഫാൽ രൂപം അക്ഷരാർഥത്തിൽ ‘കാണപ്പെടുക’ എന്നാകാമെങ്കിലും, ഈ നിയമസന്ദർഭത്തിൽ പുരോഹിതന്റെ പരിശോധനയ്ക്കായി ബാധിതസ്ഥലം കാണിക്കുന്ന നടപടിയാണ് ഉദ്ദേശിക്കുന്നത്.
