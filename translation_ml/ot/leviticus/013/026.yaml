reference: Leviticus 13:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: ml
  text: എന്നാൽ പുരോഹിതൻ അതു പരിശോധിക്കുമ്പോൾ, ആ തിളക്കമുള്ള പാടിൽ വെളുത്ത രോമമില്ലെന്നും അതു തൊലിയുടെ നിരപ്പിനെക്കാൾ താഴ്ന്നതല്ലെന്നും[a] അതിന്റെ നിറം മങ്ങിയിരിക്കുന്നെന്നും കണ്ടാൽ, പുരോഹിതൻ അയാളെ ഏഴു ദിവസത്തേക്ക് വേർതിരിച്ചിടണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതു തൊലിയെക്കാൾ ആഴമുള്ളതല്ല’; അതായത്, ചുറ്റുമുള്ള തൊലിയിൽനിന്ന് കുഴിഞ്ഞതായി കാണപ്പെടുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അയാളെ ഒറ്റപ്പെടുത്തണം’ അല്ലെങ്കിൽ ‘അടച്ചിടണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶנָּה
  choice: അതു പരിശോധിക്കുമ്പോൾ
  rationale: മൂലപദത്തിന്റെ അടിസ്ഥാന അർഥം ‘കാണുക’ എന്നാണെങ്കിലും, ലേവ്യപുസ്തകം 13-ലെ പുരോഹിതപരിശോധനയുടെ ഔദ്യോഗിക പശ്ചാത്തലത്തിൽ ‘പരിശോധിക്കുക’ പ്രവർത്തിയുടെ സ്വഭാവം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בַּבֶּהֶרֶת
  choice: ആ തിളക്കമുള്ള പാടിൽ
  rationale: בַּהֶרֶת തൊലിയിലെ വെളുത്തതോ തിളക്കമുള്ളതോ ആയ അടയാളത്തെ സൂചിപ്പിക്കുന്നു. നിർദിഷ്ടമായ ഒരു ആധുനിക രോഗനിർണയം ചുമത്താതെ അതിന്റെ ദൃശ്യസ്വഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: שֵׂעָר לָבָן
  choice: വെളുത്ത രോമം
  rationale: എബ്രായ ഏകവചനരൂപം ഇവിടെ സാമാന്യ/സമാഹാര അർഥത്തിൽ വരുന്നു; മലയാളത്തിൽ ‘വെളുത്ത രോമം’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: അതു തൊലിയുടെ നിരപ്പിനെക്കാൾ താഴ്ന്നതല്ല
  rationale: שׁפל എന്ന പദത്തിന്റെ ‘താഴ്ന്ന, കുഴിഞ്ഞ’ എന്ന ദൃശ്യാർഥം സംരക്ഷിക്കുകയും പാട് ചുറ്റുമുള്ള തൊലിയുടെ നിരപ്പിൽനിന്ന് താഴ്ന്നതായി കാണപ്പെടുന്നില്ലെന്ന പരിശോധനാമാനദണ്ഡം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כֵהָה
  choice: അതിന്റെ നിറം മങ്ങിയിരിക്കുന്നു
  rationale: പാടിന്റെ ദൃശ്യതീവ്രത കുറഞ്ഞതോ മങ്ങിപ്പോയതോ ആണെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വിളറിയത്’ എന്നത് അനാവശ്യമായി നിറത്തെ കൂടുതൽ നിർദിഷ്ടമാക്കാം.
- source_word: וְהִסְגִּירוֹ
  choice: പുരോഹിതൻ അയാളെ ... വേർതിരിച്ചിടണം
  rationale: ക്രിയയുടെ അടിസ്ഥാന ആശയം അടച്ചിടുക/ഒറ്റപ്പെടുത്തുക എന്നതാണ്. ആധുനിക പൊതുജനാരോഗ്യസാങ്കേതികത ശക്തമായി ചുമത്തുന്ന ‘ക്വാറന്റീൻ’ എന്നതിനുപകരം, നിരീക്ഷണത്തിനായുള്ള വേർതിരിക്കൽ ഈ പ്രയോഗം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസത്തേക്ക്
  rationale: കാലദൈർഘ്യം നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וְהִנֵּה
  choice: കണ്ടാൽ
  rationale: പരിശോധനയിൽ കണ്ടെത്തുന്ന കാര്യങ്ങളിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരചിഹ്നത്തിന്റെ പ്രവർത്തനം മലയാള വാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; പ്രത്യേകമായി ‘ഇതാ’ ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമായി തോന്നാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. വൈദ്യശാസ്ത്രപരമായി നിർദിഷ്ടമായ രോഗനാമം ഒഴിവാക്കി, മൂലപാഠത്തിലെ ദൃശ്യപരിശോധനാ ഭാഷ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പുകളുടെ സ്ഥാനങ്ങൾ അവ വിശദീകരിക്കുന്ന യഥാർത്ഥ പ്രയോഗങ്ങളോടു ചേർത്ത് ക്രമപ്പെടുത്തി.
