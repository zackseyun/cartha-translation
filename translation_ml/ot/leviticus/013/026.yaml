    issue: അടിക്കുറിപ്പ് b-യുടെ ആങ്കർ വാക്യാവസാനത്താണ്.
    rationale: അടിക്കുറിപ്പ് ‘വേർതിരിച്ചിടണം’ എന്ന ക്രിയയ്ക്കുള്ള ബദലുകളാണ് നൽകുന്നത്. അതിനാൽ ആങ്കർ ആ പദത്തിനു തൊട്ടുപിന്നാലെ വരണം; വാക്യാവസാനത്ത് വെച്ചാൽ അത് ‘ഏഴു ദിവസത്തേക്ക്’ എന്ന കാലപ്രയോഗത്തെയും സൂചിപ്പിക്കുന്നതുപോലെ തോന്നാം.
  - severity: low
