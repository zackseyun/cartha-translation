id: LEV.13.2
reference: Leviticus 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: ml
  text: ഒരാളുടെ ദേഹചർമ്മത്തിൽ ഒരു വീക്കമോ ഒരു പൊട്ടോ തെളിഞ്ഞ പാടോ ഉണ്ടാകുകയും അത് ദേഹചർമ്മത്തിൽ ചർമ്മരോഗത്തിന്റെ ബാധയായിത്തീരുകയും ചെയ്താൽ, അയാളെ പുരോഹിതനായ അഹരോന്റെ അടുക്കലേക്കോ അവന്റെ പുത്രന്മാരായ പുരോഹിതന്മാരിൽ ഒരാളുടെ അടുക്കലേക്കോ കൊണ്ടുവരണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: “കുഷ്ഠരോഗത്തിന്റെ ബാധ” അല്ലെങ്കിൽ “കുഷ്ഠബാധ.” എബ്രായത്തിലെ צָרָעַת (ത്സാരാഅത്ത്) വിവിധതരം ചർമ്മബാധകളെ ഉൾക്കൊള്ളുന്ന പദമാണ്; അതിനെ ആധുനിക ഹാൻസൻസ് രോഗത്തോട് നിർബന്ധമായി തുല്യമാക്കരുത്.'
    reason: പരമ്പരാഗത വിവർത്തനവും മൂലപദത്തിന്റെ വിശാലമായ അർഥപരിധിയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: אָדָם
  choice: ഒരാൾ
  rationale: നിയമപരമായ സാങ്കൽപ്പിക സാഹചര്യത്തിലെ ഏകവചന പൊതുപദമാണ്; മലയാളത്തിൽ ലിംഗഭേദമില്ലാതെ സ്വാഭാവികമായി വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: ദേഹചർമ്മത്തിൽ
  rationale: ‘അവന്റെ മാംസത്തിന്റെ ത്വക്കിൽ’ എന്ന പദാനുപദരൂപത്തേക്കാൾ സ്വാഭാവികമാണ്; ആവർത്തിച്ചിരിക്കുന്ന ശാരീരിക സൂചനയും നിലനിർത്തുന്നു.
- source_word: שְׂאֵת
  choice: ഒരു വീക്കം
  rationale: ചർമ്മത്തിലെ ഉയർന്ന ഭാഗത്തെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: סַפַּחַת
  choice: ചൊറി
  rationale: കൃത്യമായ ത്വക്കുരോഗസൂചന അനിശ്ചിതമായതിനാൽ അതിനെ അതിരുകടന്ന് നിർണയിക്കാതെ ദൃശ്യമായ ചർമ്മക്ഷതത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ പദം തിരഞ്ഞെടുത്തു.
- source_word: בַּהֶרֶת
  choice: തിളങ്ങുന്ന പാട്
  rationale: വെളുത്ത പാട് എന്ന കൂടുതൽ സങ്കുചിത വ്യാഖ്യാനം നിർബന്ധിക്കാതെ പ്രകാശമുള്ളതോ വിളറിയതോ ആയ അടയാളത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: לְנֶגַע צָרָעַת
  choice: ചർമ്മരോഗത്തിന്റെ വ്രണം
  rationale: נֶגַע എന്നത് ബാധിത പാടോ ക്ഷതമോ സൂചിപ്പിക്കുന്നു; צָרָעַת ആധുനിക ഹാൻസൻസ് രോഗത്തോട് നിർബന്ധമായി തുല്യമല്ലാത്ത വിപുലമായ ബൈബിൾകാല ചർമ്മബാധാവർഗമാണ്.
- source_word: וְהוּבָא
  choice: കൊണ്ടുവരണം
  rationale: എബ്രായത്തിലെ കർമണിപ്രയോഗത്തിന്റെ നടപടിക്രമപരമായ നിർബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോൻ
  rationale: പേരും പദവിയും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകുന്നു.
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: പുരോഹിതന്മാരായ അവന്റെ പുത്രന്മാരിൽ ഒരാൾ
  rationale: കുടുംബബന്ധവും പുരോഹിതപദവിയും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: צָרָעַת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ചർമ്മരോഗം
  alternative: കുഷ്ഠരോഗം; സരാഅത്ത്
  rationale: ഈ എബ്രായപദം ആധുനിക ഹാൻസൻസ് രോഗത്തേക്കാൾ വിപുലമായ ആചാരപരവും നിർണയപരവുമായ രോഗവർഗത്തെ സൂചിപ്പിക്കുന്നു. അതിനാൽ പ്രത്യേക ആധുനിക രോഗനിർണയം വചനത്തിൽ ഇറക്കുമതി ചെയ്യാതെ പൊതുവായ അർഥം മുഖ്യപാഠത്തിൽ നൽകി, പരമ്പരാഗത വിവർത്തനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. രോഗാവസ്ഥയെ ആധുനിക വൈദ്യനിർണയമായി ചുരുക്കാതെ, മൂലത്തിലെ ദൃശ്യലക്ഷണങ്ങളും പുരോഹിതപരിശോധനയ്ക്കുള്ള നടപടിയും നിലനിർത്തിയിരിക്കുന്നു.
