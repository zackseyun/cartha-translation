review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the priestly inspection, the complete covering of the flesh by צָרַעַת, the priest's declarative purity ruling, and the concluding verdict. However, ‘അതു മുഴുവനും’ leaves the referent less clear than the Hebrew context, where כֻּלּוֹ resumes the affected person's flesh/body and states that it has become white.
