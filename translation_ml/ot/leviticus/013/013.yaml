source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֨ה כִסְּתָ֤ה הַ/צָּרַ֨עַת֙ אֶת כָּל בְּשָׂר֔/וֹ וְ/טִהַ֖ר אֶת הַ/נָּ֑גַע כֻּלּ֛/וֹ הָפַ֥ךְ לָבָ֖ן טָה֥וֹר הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: ml
  text: പുരോഹിതൻ അയാളെ പരിശോധിക്കുമ്പോൾ, ഇതാ, ത്വഗ്രോഗം[a] അയാളുടെ ശരീരം മുഴുവൻ മൂടിയിരിക്കുന്നുവെങ്കിൽ, രോഗബാധിതനെ ശുദ്ധനെന്ന് പ്രഖ്യാപിക്കണം[b]. അയാളുടെ ശരീരം മുഴുവൻ വെളുത്തതായി മാറിയിരിക്കുന്നു; അയാൾ ശുദ്ധനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടത്തെ എബ്രായപദമായ צָרַעַת (പരമ്പരാഗതമായി ‘കുഷ്ഠം’ എന്നു വിവർത്തനം ചെയ്യപ്പെട്ടത്) ലേവ്യപുസ്തകത്തിൽ വിവിധതരം ത്വക്ക്‌ബാധകളെ സൂചിപ്പിക്കുന്നു; അത് ആധുനിക ഹാൻസൺസ് രോഗം മാത്രമെന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ബാധയെ/അടയാളത്തെ ശുദ്ധമെന്ന് പ്രഖ്യാപിക്കണം.’ എന്നാൽ ഈ ശുദ്ധിവിധി ബാധയുള്ള വ്യക്തിക്കാണ് ബാധകമാകുന്നത്.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְרָאָה
  choice: പരിശോധിക്കുമ്പോൾ
  rationale: പൗരോഹിത്യ പരിശോധനയുടെ പശ്ചാത്തലത്തിൽ ראה വെറും ‘കാണുക’ എന്നതിലുപരി സൂക്ഷ്മമായി പരിശോധിക്കുക എന്ന അർഥം നൽകുന്നു; നിയമവ്യവസ്ഥയുടെ സോപാധിക ഘടനയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാപരമായ ശുദ്ധി നിർണയിക്കുന്ന ഔദ്യോഗിക വ്യക്തിക്കുള്ള സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പരിശോധനയിൽ കണ്ടെത്തിയ അവസ്ഥയിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൈക്തിക ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: הַצָּרַעַת
  choice: ത്വഗ്രോഗം
  rationale: צָרַעַת ആധുനിക ഹാൻസൺസ് രോഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; ചർമ്മത്തെ ബാധിക്കുന്ന വിശാലമായ അവസ്ഥകളെ ഉൾക്കൊള്ളുന്നതിനാൽ തെറ്റായ വൈദ്യശാസ്ത്ര കൃത്യത ഒഴിവാക്കുന്നു.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: അയാളുടെ ശരീരം മുഴുവൻ
  rationale: בשר എന്നതിന്റെ അക്ഷരാർഥം ‘മാംസം’ ആണെങ്കിലും ഇവിടെ ശരീരത്തിന്റെ പുറംഭാഗം മുഴുവൻ ഉദ്ദേശിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ ‘ശരീരം മുഴുവൻ’ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וְטִהַר אֶת הַנָּגַע
  choice: രോഗബാധിതനെ ശുദ്ധനെന്ന് പ്രഖ്യാപിക്കണം
  rationale: പീയേൽ രൂപത്തിലുള്ള טהר ചികിത്സയിലൂടെ ശുദ്ധീകരിക്കുക എന്നല്ല, പൗരോഹിത്യപരമായ ശുദ്ധിവിധി പ്രസ്താവിക്കുക എന്നാണ്. നേരിട്ടുള്ള കർമം അക്ഷരാർഥത്തിൽ ‘ബാധ/അടയാളം’ ആണെങ്കിലും വിധി ബാധിതനായ വ്യക്തിക്കു ബാധകമായതിനാൽ മുഖ്യവാചകം സ്വാഭാവികമായി വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ഉറവിടരൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: അതു മുഴുവനും വെളുത്തതായി മാറിയിരിക്കുന്നു
  rationale: സൂചിതാവസ്ഥ പൂർണമായി വെളുത്തതായെന്ന നിർണായക നിരീക്ഷണം നിലനിർത്തുന്നു; ‘അതു’ എന്ന സർവനാമം ഹീബ്രുവിലെ സൂചനയുടെ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: טָהוֹר הוּא
  choice: അയാൾ ശുദ്ധനാണ്
  rationale: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധി-അശുദ്ധി പദാവലിക്കനുസരിച്ചുള്ള നേരിട്ടുള്ള വിവർത്തനം; ‘ആചാരപരമായി’ എന്ന വ്യാഖ്യാനപദം കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ צָרַעַת എന്ന പദത്തിന്റെ പരിധി
  choice: ത്വഗ്രോഗം
  alternative: കുഷ്ഠം; അശുദ്ധമാക്കുന്ന ത്വഗ്രോഗം; സാരാത്ത്
  rationale: ഈ ഹീബ്രു വിഭാഗത്തെ ആധുനിക കുഷ്ഠം/ഹാൻസൺസ് രോഗവുമായി മാത്രം സമീകരിക്കാതെ അതിന്റെ വിശാലമായ നിയമ-ആരാധനാപരമായ അർഥപരിധി സംരക്ഷിക്കുന്നു.
- issue: וְטִהַר എന്നതിലെ പൗരോഹിത്യവിധിയുടെ സ്വഭാവം
  choice: ശുദ്ധനെന്ന് പ്രഖ്യാപിക്കണം
  alternative: ശുദ്ധീകരിക്കണം; ബാധ ശുദ്ധമാണെന്ന് പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതൻ ചികിത്സയോ ആന്തരിക പരിവർത്തനമോ വരുത്തുന്നില്ല; പരിശോധനയുടെ അടിസ്ഥാനത്തിൽ ശുദ്ധിസ്ഥിതി ഔദ്യോഗികമായി വിധിക്കുന്നു.
- issue: אֶת הַנָּגַע എന്ന നേരിട്ടുള്ള കർമത്തിന്റെ സൂചന
  choice: മുഖ്യവാചകത്തിൽ രോഗബാധിതനായ വ്യക്തി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ
  alternative: ബാധയെ/അടയാളത്തെ ശുദ്ധമെന്ന് പ്രഖ്യാപിക്കണം
  rationale: ഹീബ്രുവിലെ വ്യാകരണപരമായ അസാധാരണത മറയ്ക്കാതെ, മലയാളത്തിൽ വിധി ആരെ സംബന്ധിക്കുന്നുവെന്ന് വ്യക്തമായി പറയുന്നു; അക്ഷരാർഥത്തിലുള്ള വസ്തുസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ നിയമ-ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘ഇതാ’ ഉറവിടത്തിലെ ശ്രദ്ധാകർഷക പ്രയോഗം സംരക്ഷിക്കുന്നു; ‘ശുദ്ധൻ’ ലേവ്യപുസ്തകത്തിലെ സാങ്കേതിക ശുദ്ധിപദാവലിയുമായി പൊരുത്തപ്പെടുന്നു.
