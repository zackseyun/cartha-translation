source:
  edition: WLC
  text: וּ/בְ/י֨וֹם הֵרָא֥וֹת בּ֛/וֹ בָּשָׂ֥ר חַ֖י יִטְמָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/014.yaml
  text: But on the day living flesh appears in it, he shall be unclean.
translation:
  language: ml
  text: എന്നാൽ ജീവനുള്ള മാംസം അവനിൽ കാണപ്പെടുന്ന ദിവസം അവൻ അശുദ്ധനാകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּשָׂר חַי
  choice: ജീവനുള്ള മാംസം
  rationale: ശരീരത്തിലെ രോഗബാധിത ഭാഗത്തിനിടയിൽ പ്രത്യക്ഷപ്പെടുന്ന ജീവസ്സുള്ള പച്ചമാംസത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: הֵרָאוֹת
  choice: കാണപ്പെടുന്ന
  rationale: നിഫ്അൽ രൂപത്തിന്റെ ‘പ്രത്യക്ഷപ്പെടുക/കാണപ്പെടുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בּוֹ
  choice: അതിൽ
  rationale: സന്ദർഭത്തിലെ ത്വക്കുരോഗാവസ്ഥയെയോ ബാധിതസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നതായി എടുത്ത്, ഏറ്റവും അടുത്ത ഇംഗ്ലീഷ് പരിശോധനാപാഠത്തോടും ഒത്തുപോകുന്നു; വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ‘അവനിൽ’ എന്ന് നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: יִטְמָא
  choice: അവൻ അശുദ്ധനാകും
  rationale: ആചാരപരമായ അശുദ്ധാവസ്ഥയിലാകുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയെ ഭാവാർഥത്തോടെ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: അശുദ്ധതയുടെ സ്വഭാവം
  choice: അശുദ്ധനാകും
  alternative: മലിനനാകും
  rationale: ഇവിടെ ധാർമ്മിക കുറ്റബോധമല്ല, ലേവ്യനിയമത്തിലെ ആചാരപരമായ അശുദ്ധാവസ്ഥയാണ് ഉദ്ദേശിക്കുന്നത്; ‘അശുദ്ധൻ’ ഈ വ്യത്യാസം കൂടുതൽ കൃത്യമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തതയും ‘എന്നാൽ’ എന്ന വൈരുധ്യബന്ധവും സംരക്ഷിച്ചു.
