reference: Leviticus 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: ml
  text: ഇവയിൽനിന്ന് ഉണ്ടാക്കുന്ന ധാന്യയാഗം നീ യഹോവയ്ക്കായി[a] കൊണ്ടുവരണം. നീ അത് പുരോഹിതന്റെ അടുക്കൽ എത്തിക്കണം; പിന്നെ അത് യാഗപീഠത്തിന്റെ അടുക്കലേക്കു അടുപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയുടെ അടുക്കലേക്ക്.’ എബ്രായ ഉപസർഗത്തിന് സമർപ്പണലക്ഷ്യവും ദിശയും സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: നീ കൊണ്ടുവരണം
  rationale: നിയമപരമായ നിർദേശശൈലിയിലുള്ള ഹിഫീൽ രൂപം ബാധ്യതയുള്ള നിർദേശം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘കൊണ്ടുവരണം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַמִּנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകം 2-ലെ സന്ദർഭത്തിൽ מִנְחָה പൊതുവായ വഴിപാടല്ല, ധാന്യത്തിൽനിന്നുള്ള യാഗമാണ്.
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: ഇവയിൽനിന്ന് ഉണ്ടാക്കുന്ന
  rationale: עשה എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലെ കർമണിയർഥവും מֵאֵלֶּה എന്നതിലെ ഉറവിട/ഘടകബന്ധവും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: ל എന്ന ഉപസർഗം ദിശയെയോ സമർപ്പണത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ യാഗത്തിന്റെ സമർപ്പണലക്ഷ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ദിശാസൂചന മറ്റൊരു സാധ്യതയായി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהִקְרִיבָהּ אֶל הַכֹּהֵן
  choice: അത് പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം
  rationale: קרב എന്ന ഹിഫീൽ ക്രിയയുടെ ‘അടുത്തേക്കു കൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു. എബ്രായത്തിലെ ക്രിയാരൂപം 3ms അല്ല, 2ms ആണ്; അതിനാൽ ഈ പ്രവൃത്തിയുടെ വിഷയം യാഗം കൊണ്ടുവരുന്ന ‘നീ’ തന്നെയാണ്.
- source_word: וְהִגִּישָׁהּ אֶל הַמִּזְבֵּחַ
  choice: അവൻ അത് യാഗപീഠത്തിന്റെ അടുത്തേക്കു കൊണ്ടുചെല്ലണം
  rationale: נגשׁ എന്ന ഹിഫീൽ ക്രിയ യാഗപീഠത്തോട് അടുത്തേക്കു കൊണ്ടുചെല്ലുന്നതിനെ സൂചിപ്പിക്കുന്നു. പുരോഹിതനെ പരാമർശിച്ചതിനു ശേഷമുള്ള 3ms രൂപമായതിനാൽ ‘അവൻ’ പുരോഹിതനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പേരായിത്തന്നെ നിലനിർത്തുന്നു; പൊതുപദവിയായ ‘കർത്താവ്’ ഉപയോഗിച്ച് അതിനെ മറയ്ക്കുന്നില്ല.
- issue: לַיהוָה എന്നതിലെ ל ഉപസർഗത്തിന്റെ അർഥം
  choice: യഹോവയ്ക്കായി
  alternative: യഹോവയുടെ അടുക്കൽ
  rationale: യാഗം ദൈവത്തിനു സമർപ്പിതമാണെന്ന ലക്ഷ്യാർഥം സന്ദർഭത്തിൽ ശക്തമാണ്; എങ്കിലും ഉപസർഗത്തിന് ദിശാർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരവുറ്റതുമായ നിയമനിർദേശശൈലി. ഒരേപോലെ തോന്നാവുന്ന קרב, נגשׁ എന്നീ ക്രിയകളുടെ ക്രമവ്യത്യാസം ‘പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം’ എന്നും ‘യാഗപീഠത്തിന്റെ അടുത്തേക്കു കൊണ്ടുചെല്ലണം’ എന്നും വേർതിരിച്ചു. എബ്രായ ക്രിയകളിലെ വ്യക്തിവ്യത്യാസവും കൃത്യമായി പാലിച്ചു.
