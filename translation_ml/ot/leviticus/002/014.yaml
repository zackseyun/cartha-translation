id: LEV.2.14
reference: Leviticus 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם תַּקְרִ֛יב מִנְחַ֥ת בִּכּוּרִ֖ים לַ/יהוָ֑ה אָבִ֞יב קָל֤וּי בָּ/אֵשׁ֙ גֶּ֣רֶשׂ כַּרְמֶ֔ל תַּקְרִ֕יב אֵ֖ת מִנְחַ֥ת בִּכּוּרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: ml
  text: നീ യഹ്‌വേക്കു ആദ്യഫലങ്ങളുടെ ധാന്യയാഗം അർപ്പിക്കുന്നെങ്കിൽ, തീയിൽ വറുത്ത ഇളം ധാന്യക്കതിരുകൾ, പുതുധാന്യത്തിൽനിന്നുള്ള ചതച്ച ധാന്യം നിന്റെ ആദ്യഫലങ്ങളുടെ ധാന്യയാഗമായി അർപ്പിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחַת
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകം 2-ന്റെ സന്ദർഭത്തിൽ מִנְחָה ധാന്യത്തിൽനിന്നുള്ള യാഗത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്; അതിനാൽ പൊതുവായ ‘വഴിപാട്’ എന്നതിനെക്കാൾ ‘ധാന്യയാഗം’ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: ആദ്യഫലങ്ങൾ / നിന്റെ ആദ്യഫലങ്ങൾ
  rationale: വിളവിന്റെ ആദ്യം പാകമായ ഭാഗം ദൈവത്തിനു സമർപ്പിക്കുന്ന ആരാധനാപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: ഹീബ്രു പാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരം ചെയ്തു.
- source_word: אָבִיב
  choice: ഇളം ധാന്യക്കതിരുകൾ
  rationale: ഇനിയും പൂർണമായി ഉണങ്ങാത്ത, പുതുതായി വളർന്ന ധാന്യക്കതിരുകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ കൃഷിചിത്രം വ്യക്തമായി നൽകുന്ന പ്രയോഗമാണിത്.
- source_word: קָלוּי בָּאֵשׁ
  choice: തീയിൽ വറുത്ത
  rationale: തീ ഉപയോഗിച്ചുള്ള തയ്യാറാക്കൽരീതി നേരായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: גֶּרֶשׂ כַּרְמֶל
  choice: പുതുധാന്യത്തിൽനിന്നു ചതച്ച ധാന്യമണികൾ
  rationale: גֶּרֶשׂ ചതച്ചതോ പൊട്ടിച്ചതോ ആയ ധാന്യത്തെയും כַּרְמֶל ഈ സന്ദർഭത്തിൽ പുതിയ വിളയിലെ പുതുധാന്യത്തെയും സൂചിപ്പിക്കുന്നു. അപൂർവമായ ഹീബ്രു പദസമുച്ചയത്തിന്റെ അടിസ്ഥാനചിത്രം വിവർത്തനം നിലനിർത്തുന്നു.
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: അർപ്പിക്കുന്നെങ്കിൽ ... അർപ്പിക്കണം
  rationale: קרב എന്ന ക്രിയയുടെ ആരാധനാപരമായ ‘സമീപത്തേക്കു കൊണ്ടുവന്ന് സമർപ്പിക്കുക’ എന്ന ആശയം ‘അർപ്പിക്കുക’ സ്വാഭാവികമായി നൽകുന്നു; ഹീബ്രുവിലെ ആവർത്തനവും നിലനിർത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ നിയമനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി അവതരിപ്പിക്കുന്നു; പ്രത്യേക മതവിഭാഗത്തിന്റെ പതിവിലേക്കു ചുരുക്കുന്നില്ല.
- issue: מִנְחָה എന്ന പദത്തിന്റെ യാഗപരമായ വ്യാപ്തി
  choice: ധാന്യയാഗം
  alternative: വഴിപാട് / അർപ്പണം
  rationale: ഈ അധ്യായത്തിൽ യാഗവസ്തു ധാന്യമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ‘ധാന്യയാഗം’ തിരഞ്ഞെടുക്കുന്നു; ഇതിലൂടെ അധികമായ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആരാധനാപര ഭാഷ ഉപയോഗിച്ചു. വാക്യത്തിലെ ഹീബ്രു ആവർത്തനം സ്വാഭാവികത നഷ്ടപ്പെടാതെ സംരക്ഷിച്ചു; അപൂർവ കാർഷികപദങ്ങളുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
