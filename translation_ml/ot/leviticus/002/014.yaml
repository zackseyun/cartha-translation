revisions:
- from: നീ യഹ്‌വേക്കു ആദ്യഫലങ്ങളുടെ ധാന്യയാഗം അർപ്പിക്കുന്നെങ്കിൽ, തീയിൽ വറുത്ത ഇളം ധാന്യക്കതിരുകളും പുതുധാന്യത്തിൽനിന്നു ചതച്ച ധാന്യമണികളും[a] നിന്റെ ആദ്യഫലങ്ങളുടെ ധാന്യയാഗമായി അർപ്പിക്കണം.
