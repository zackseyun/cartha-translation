source:
  edition: WLC
  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ ധാന്യയാഗത്തിൽനിന്ന് അതിന്റെ സ്മാരകഭാഗം എടുത്ത് യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം. അത് യഹോവയ്ക്ക് പ്രസാദകരമായ സൗരഭ്യമായ അഗ്നിയർപ്പണമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹോവയ്ക്ക് പ്രസാദകരമായ സൗരഭ്യമുള്ള അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗം.”'
    reason: אִשֶּׁה എന്ന പദം അക്ഷരാർഥത്തോടടുത്ത് ‘അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וְהֵרִים
  choice: എടുത്ത്
  rationale: ഹിഫിൽ രൂപം യാഗത്തിൽനിന്ന് ഒരു ഭാഗം എടുത്തുമാറ്റുന്ന പുരോഹിതന്റെ ആചാരപരമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എടുത്ത്’ സ്വാഭാവികവും സന്ദർഭസൂക്ഷ്മവുമാണ്.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാക്രമസന്ദർഭത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണ മലയാളപരിഭാഷ.
- source_word: מִן הַמִּנְחָה
  choice: ധാന്യയാഗത്തിൽനിന്ന്
  rationale: ലേവ്യപുസ്തകം 2-ൽ מִנְחָה ധാന്യത്തിൽനിന്നുള്ള യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אַזְכָּרָתָהּ
  choice: അതിന്റെ സ്മാരകഭാഗം
  rationale: മുഴുവൻ യാഗമല്ല, ദൈവസന്നിധിയിൽ സ്മാരകമായി ദഹിപ്പിക്കുന്ന പ്രതിനിധിഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וְהִקְטִיר
  choice: ദഹിപ്പിക്കണം
  rationale: യാഗപീഠത്തിൽ അർപ്പണം കത്തിച്ച് പുകയാക്കുന്ന ബലികർമത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശാസൂചക രൂപം ഇവിടെ യാഗപീഠത്തിന്മേൽ നടത്തുന്ന പ്രവൃത്തിയായി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִשֵּׁה
  choice: ദഹനയാഗം
  rationale: അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗം എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘ഭോജനയാഗം’ എന്ന വ്യാഖ്യാനപരമായ രൂപത്തേക്കാൾ ഹീബ്രു പദത്തിന്റെ അഗ്നിസംബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യം
  rationale: ഗന്ധത്തിന്റെ രൂപകം നിലനിർത്തിക്കൊണ്ട് ദൈവിക പ്രസാദത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ഹീബ്രു വ്യക്തിനാമമായ יהוה-യെ മലയാളത്തിലെ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ സുതാര്യമായി നൽകുന്നു.
theological_decisions:
- issue: אִשֵּׁה רֵיחַ נִיחֹחַ എന്ന ബലിയർപ്പണസൂത്രത്തിന്റെ പരിഭാഷ
  choice: യഹോവയ്ക്ക് പ്രസാദകരമായ സൗരഭ്യമുള്ള ദഹനയാഗം
  alternative: യഹോവയ്ക്ക് പ്രസാദകരമായ സൗരഭ്യമുള്ള അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗം
  rationale: അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗവും ദൈവിക പ്രസാദം സൂചിപ്പിക്കുന്ന സൗരഭ്യരൂപകവും നിലനിർത്തുന്നു; ‘ദൈവത്തിനുള്ള ഭക്ഷണം’ എന്ന വിവാദാർഥം പ്രധാന പാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ആചാരപരമായ പദങ്ങൾ കൃത്യമായി സൂക്ഷിച്ചിരിക്കുന്നു; ഹീബ്രുവിലെ അഗ്നിയർപ്പണവും സൗരഭ്യരൂപകവും വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കിയിട്ടില്ല.
