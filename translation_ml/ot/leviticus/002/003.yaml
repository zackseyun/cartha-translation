id: LEV.2.3
reference: Leviticus 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: ml
  text: ധാന്യയാഗത്തിൽ ശേഷിക്കുന്നതു അഹരോനും അവന്റെ പുത്രന്മാർക്കും ഉള്ളതാണ്; അത് യഹോവയുടെ അഗ്നിയർപ്പണങ്ങളിൽനിന്നുള്ള[a] അതിവിശുദ്ധമായ ഒരു ഓഹരിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണങ്ങളിൽനിന്നുള്ള.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: ശേഷിക്കുന്നത്
  rationale: നിശ്ചയാർഥക ഘടകത്തോടുകൂടിയ കർത്തൃവാചക രൂപം ഇവിടെ നാമസദൃശമായി പ്രവർത്തിച്ച് യാഗത്തിന്റെ ശേഷിച്ച ഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מִן הַמִּנְחָה
  choice: ധാന്യയാഗത്തിൽ
  rationale: ലേവ്യപുസ്തകം 2-ന്റെ സന്ദർഭത്തിൽ מִנְחָה ധാന്യത്തിൽനിന്നുള്ള യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ വിഭക്തിബന്ധം ഉപയോഗിച്ചു.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: അഹരോനും അവന്റെ പുത്രന്മാർക്കും ഉള്ളതായിരിക്കണം
  rationale: לְ ഇവിടെ അനുവദിച്ചുകൊടുക്കൽ/അവകാശം സൂചിപ്പിക്കുന്നു; ഈ മലയാളരൂപം പുരോഹിതർക്കുള്ള ഓഹരി വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധമായ ഒരു ഓഹരി
  rationale: ഹീബ്രു അതിശയോക്തിപരമായ ഘടന വിശുദ്ധിയുടെ പരമോന്നത വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. സ്ഥലനാമമായി തെറ്റിദ്ധരിക്കാവുന്ന അക്ഷരാർഥരൂപം ഒഴിവാക്കി, വാക്യത്തിലെ ശേഷിപ്പാണ് ഉദ്ദേശ്യമെന്ന് ‘ഓഹരി’ വ്യക്തമാക്കുന്നു.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: യഹോവയുടെ അഗ്നിയർപ്പണങ്ങളിൽനിന്നുള്ള
  rationale: אִשֶּׁה തീയിൽ അർപ്പിക്കുന്ന യാഗങ്ങൾക്കുള്ള സാങ്കേതിക പദമാണ്. ‘അഗ്നിയർപ്പണം’ അതിലെ അഗ്നിസംബന്ധമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു; מִן-ന്റെ വർഗ്ഗീകരണ/ഉത്ഭവബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים എന്ന ആരാധനാക്രമപരമായ വർഗ്ഗീകരണം
  choice: അതിവിശുദ്ധമായ ഒരു ഓഹരി
  alternative: അതിവിശുദ്ധം; വിശുദ്ധങ്ങളിൽ വിശുദ്ധം
  rationale: ഇത് വിശുദ്ധിയുടെ ഏറ്റവും ഉയർന്ന യാഗക്രമവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ഓഹരി’ എന്ന പദം ശേഷിച്ച ഭാഗത്തെയാണ് വിശേഷിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; വിശുദ്ധമന്ദിരത്തിലെ ഒരു സ്ഥലത്തെ സൂചിപ്പിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- issue: אִשֵּׁי יְהוָה എന്ന യാഗസാങ്കേതിക പദത്തിന്റെ വിവർത്തനം
  choice: യഹോവയുടെ അഗ്നിയർപ്പണങ്ങൾ
  alternative: യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണങ്ങൾ; യഹോവയുടെ ഭോജനയാഗങ്ങൾ
  rationale: പദത്തിന്റെ അഗ്നിസംബന്ധമായ അടിസ്ഥാനാർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു. ബന്ധസൂചകത്തിന്റെ ദിശയിൽ ഉള്ള യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യാഗക്രമത്തിലെ സാങ്കേതിക അർഥങ്ങൾ നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു.
