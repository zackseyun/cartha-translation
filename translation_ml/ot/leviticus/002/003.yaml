  terminology: ‘ധാന്യയാഗം,’ ‘അതിവിശുദ്ധമായ ഒരു ഓഹരി,’ ‘അഗ്നിയർപ്പണങ്ങൾ,’ and ‘യഹോവ’ are suitable and consistent technical renderings. The footnote appropriately records the possible directional sense of the relationship to Yahweh.
  issues:
