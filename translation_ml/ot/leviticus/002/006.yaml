id: LEV.2.6
reference: Leviticus 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: פָּת֤וֹת אֹתָ/הּ֙ פִּתִּ֔ים וְ/יָצַקְתָּ֥ עָלֶ֖י/הָ שָׁ֑מֶן מִנְחָ֖ה הִֽוא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/006.yaml
  text: Break it into pieces and pour oil on it[a]; it is a grain offering.
translation:
  language: ml
  text: അതിനെ പൊട്ടിച്ച് കഷണങ്ങളാക്കുക; അതിന്മേൽ എണ്ണ ഒഴിക്കുക[a]. അത് ഒരു ധാന്യയാഗമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചെറിയ കഷണങ്ങളായി വിഭജിക്കുക” അല്ലെങ്കിൽ “ചെറിയ തുണ്ടുകളാക്കുക.” എണ്ണ ഒഴിക്കുന്നതിനുമുമ്പ് യാഗവസ്തുവിനെ കഷണങ്ങളാക്കുന്നതിനാണ് എബ്രായപാഠം ഊന്നൽ നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּת֤וֹת
  choice: നുറുക്കി
  rationale: פתת എന്ന ക്രിയ ഇവിടെ നിർദേശാത്മകമായി ഉപയോഗിച്ചിരിക്കുന്നു. ചുട്ട യാഗവസ്തുവിനെ ചെറിയ ഭാഗങ്ങളാക്കുന്ന പ്രവൃത്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘നുറുക്കുക’ എന്ന് വ്യക്തമാക്കാം.
- source_word: אֹתָ/הּ
  choice: അതിനെ
  rationale: മൂന്നാം പുരുഷ ഏകവചന സ്ത്രീലിംഗ പ്രത്യയം മുമ്പ് പറഞ്ഞ യാഗവസ്തുവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ജഡവസ്തുവിന് ‘അതിനെ’ സ്വാഭാവികമാണ്.
- source_word: פִּתִּים
  choice: കഷണങ്ങളായി
  rationale: ബഹുവചന നാമം നുറുക്കിയുണ്ടാകുന്ന ചെറിയ ഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘കഷണങ്ങളായി’ ഫലാവസ്ഥ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְ/יָצַקְתָּ
  choice: ഒഴിക്കണം
  rationale: വാവ് ചേർന്ന രണ്ടാം പുരുഷ ഏകവചന ക്രിയ യാഗനിർദേശങ്ങളുടെ തുടർച്ചയിൽ നിർദേശാത്മക ബലം വഹിക്കുന്നു. ‘ഒഴിക്കണം’ ആ നടപടിക്രമം വ്യക്തമായി നൽകുന്നു.
- source_word: עָלֶ֖י/הָ
  choice: അതിന്മേൽ
  rationale: על എന്ന പൂർവപ്രത്യയം എണ്ണ യാഗവസ്തുവിന്റെ മുകളിൽ ഒഴിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അതിന്മേൽ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: שָׁמֶן
  choice: എണ്ണ
  rationale: എബ്രായപാഠം പൊതുവായി ‘എണ്ണ’ എന്നാണ് പറയുന്നത്. സാംസ്കാരികമായി ഒലിവെണ്ണയായിരിക്കാമെങ്കിലും പാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേകീകരണം ചേർത്തിട്ടില്ല.
- source_word: מִנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകം 2-ന്റെ യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യത്തിൽനിന്നുള്ള യാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ധാന്യയാഗം’ സംക്ഷിപ്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: הִוא
  choice: അത് ... ആണ്
  rationale: സ്വതന്ത്ര സർവനാമം ഇപ്പോൾ വിവരിച്ച വസ്തുവിനെ ധാന്യയാഗമായി തിരിച്ചറിയുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വിധിവാക്യഘടന പിന്തുടരുന്നു.
