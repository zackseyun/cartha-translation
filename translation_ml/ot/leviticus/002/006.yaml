  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. യാഗനിർദേശത്തിന്റെ നേരിട്ടുള്ള സ്വരം നിലനിർത്തി; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ഒലിവ്’ എന്ന പ്രത്യേകീകരണം ചേർത്തിട്ടില്ല.
