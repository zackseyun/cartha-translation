  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാഗനിർദേശശൈലി. സാങ്കേതിക അർഥം നിലനിർത്താൻ ‘ധാന്യവഴിപാട്’ ഉപയോഗിച്ചു; പാത്രത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
