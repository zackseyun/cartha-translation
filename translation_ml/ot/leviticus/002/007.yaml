language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם מִנְחַ֥ת מַרְחֶ֖שֶׁת קָרְבָּנֶ֑/ךָ סֹ֥לֶת בַּ/שֶּׁ֖מֶן תֵּעָשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/007.yaml
  text: And if your offering is a grain offering from a pan[a], it shall be made of fine flour with oil.
translation:
  language: ml
  text: നിന്റെ വഴിപാട് ചട്ടിയിൽ തയ്യാറാക്കുന്ന ധാന്യവഴിപാടാണെങ്കിൽ, അത് എണ്ണയോടുകൂടിയ നന്നായി പൊടിച്ച മാവുകൊണ്ട് ഉണ്ടാക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: ആണെങ്കിൽ
  rationale: മറ്റൊരു യാഗസാഹചര്യം അവതരിപ്പിക്കുന്ന നിബന്ധനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാക്യത്തിന്റെ തുടർച്ച സന്ദർഭംകൊണ്ട് നിലനിൽക്കുന്നതിനാൽ പ്രത്യേകമായി ‘പിന്നെ’ ചേർക്കേണ്ടതില്ല.
- source_word: מִנְחַת
  choice: ധാന്യവഴിപാട്
  rationale: ലേവ്യപുസ്തകം 2-ലെ ധാന്യാധിഷ്ഠിത വഴിപാടിനെ പൊതുവായ ‘വഴിപാട്’ എന്നതിൽനിന്ന് വേർതിരിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: מַרְחֶשֶׁת
  choice: ചട്ടി
  rationale: പാചകത്തിനുള്ള ഒരു പാത്രമാണ് ഉദ്ദേശിക്കുന്നത്; അതിന്റെ കൃത്യമായ ആകൃതി അനിശ്ചിതമായതിനാൽ വിശാലവും സാധാരണവുമായ പദം തെരഞ്ഞെടുത്തു.
- source_word: קָרְבָּנְךָ
  choice: നിന്റെ വഴിപാട്
  rationale: ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന അർപ്പണം എന്ന പൊതുവായ അർഥവും രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും നിലനിർത്തുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: നന്നായി അരിച്ചോ പൊടിച്ചോ തയ്യാറാക്കിയ ഉന്നതഗുണമുള്ള മാവിനെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മലയാളപ്രയോഗം.
- source_word: בַּשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: തയ്യാറാക്കലിൽ എണ്ണയുടെ സാന്നിധ്യം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘കലർത്തിയ’ എന്നു പറഞ്ഞ് പ്രക്രിയയെ അനാവശ്യമായി കൃത്യമാക്കുന്നില്ല.
- source_word: תֵּעָשֶׂה
  choice: ഉണ്ടാക്കണം
  rationale: എബ്രായത്തിലെ നിഷ്ക്രിയ നിർദേശഭാവം മലയാളത്തിലെ സ്വാഭാവിക നിയമനിർദേശരീതിയിൽ അവതരിപ്പിക്കുന്നു.
