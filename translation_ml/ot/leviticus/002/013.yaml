    issue: Opening phrase conflates קָרְבַּן and מִנְחָה
    rationale: “നിന്റെ ഓരോ ധാന്യയാഗവും” means every one of your grain offerings, whereas the Hebrew says every offering of your grain offering. “നിന്റെ ധാന്യയാഗത്തിലെ ഓരോ വഴിപാടും” preserves the construct relationship and the distinction between the terms.
  - severity: low
    issue: Added intensifier “ഒരിക്കലും”
    rationale: The Hebrew prohibits causing the salt to be absent but does not add an equivalent of “ever.” Removing it avoids unnecessary emphasis.
