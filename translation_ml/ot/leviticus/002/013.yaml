source:
  edition: WLC
  text: וְ/כָל קָרְבַּ֣ן מִנְחָתְ/ךָ֮ בַּ/מֶּ֣לַח תִּמְלָח֒ וְ/לֹ֣א תַשְׁבִּ֗ית מֶ֚לַח בְּרִ֣ית אֱלֹהֶ֔י/ךָ מֵ/עַ֖ל מִנְחָתֶ֑/ךָ עַ֥ל כָּל קָרְבָּנְ/ךָ֖ תַּקְרִ֥יב מֶֽלַח־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: ml
  text: നിന്റെ ധാന്യയാഗത്തിലെ ഓരോ വഴിപാടും ഉപ്പുചേർത്ത് അർപ്പിക്കണം.[a] നിന്റെ ദൈവത്തിന്റെ ഉടമ്പടിയുടെ ഉപ്പ് നിന്റെ ധാന്യയാഗത്തിൽനിന്ന് ഒഴിവാക്കരുത്.[b] നിന്റെ എല്ലാ വഴിപാടുകളോടുമൊപ്പം ഉപ്പ് അർപ്പിക്കണം.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഉപ്പുകൊണ്ട് ഉപ്പിടണം.’'
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ ദൈവത്തിന്റെ ഉടമ്പടിയുടെ ഉപ്പ്’ എന്നത് ഉടമ്പടിയുമായി ബന്ധപ്പെട്ട എബ്രായപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷയാണ്; അതിന്റെ പ്രതീകാർഥം ഈ വാക്യം വിശദീകരിക്കുന്നില്ല.
    reason: cultural_note
  - marker: c
    text: 'മറ്റൊരു പരിഭാഷ: ‘നിന്റെ എല്ലാ വഴിപാടുകളിന്മേലും ഉപ്പ് അർപ്പിക്കണം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן
  choice: വഴിപാട് / അർപ്പിക്കുക
  rationale: ബലിസന്ദർഭത്തിലെ പൊതുവായ സമർപ്പണപദമാണ്. മലയാളത്തിൽ നാമരൂപമായി ‘വഴിപാട്’ എന്നും ക്രിയാസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘അർപ്പിക്കുക’ എന്നും നൽകി.
- source_word: מִנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകം 2-ലെ ധാന്യത്തിൽനിന്നുള്ള പ്രത്യേക യാഗത്തെ പൊതുവായ ‘വഴിപാട്’ എന്നതിൽനിന്ന് വേർതിരിച്ചറിയിക്കുന്നു.
- source_word: בַּמֶּלַח תִּמְלָח
  choice: ഉപ്പുചേർത്ത്
  rationale: എബ്രായത്തിൽ ‘ഉപ്പുകൊണ്ട് ഉപ്പിടുക’ എന്ന നാമ-ക്രിയ ആവർത്തനമുണ്ട്. അതിന്റെ നിർബന്ധസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: תַשְׁבִּית
  choice: ഒഴിവാക്കരുത്
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ഇല്ലാതാക്കുക, മുടക്കുക, വിട്ടുകളയുക എന്ന ആശയം നൽകുന്നു; യാഗത്തിൽ ഉപ്പ് ചേർക്കാതിരിക്കരുതെന്ന വിലക്ക് വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവത്തിന്റെ ഉടമ്പടിയുടെ ഉപ്പ്
  rationale: പ്രതീകത്തിന്റെ അർഥം വിശദീകരിച്ച് തീർപ്പാക്കാതെ എബ്രായത്തിലെ ഉടമ്പടി-പ്രയോഗവും ദൈവശാസ്ത്രപരമായ ദൃശ്യവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: מֵעַל
  choice: നിന്റെ ധാന്യയാഗത്തിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘മേൽനിന്ന്’ എന്ന ആശയമുണ്ടെങ്കിലും ‘ഒഴിവാക്കുക’ എന്ന മലയാളക്രിയയോടൊപ്പം ‘യിൽനിന്ന്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: നിന്റെ എല്ലാ വഴിപാടുകളോടുമൊപ്പം
  rationale: עַל എന്നതിന് ‘മേൽ’ എന്നും നൽകാം; ഇവിടെ ഓരോ വഴിപാടിലും ഉപ്പ് അനുഗമിക്കണമെന്ന ആചാരപരമായ ആശയം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: תַּקְרִיב
  choice: അർപ്പിക്കണം
  rationale: യാഗസന്ദർഭത്തിൽ קרב-ന്റെ ഹിഫീൽ രൂപം കൊണ്ടുവരുക/സമർപ്പിക്കുക എന്നർഥമാണ്; ‘അർപ്പിക്കുക’ സാധാരണവും ഗൗരവമുള്ളതുമായ യാഗപദമാണ്.
theological_decisions:
- issue: ‘നിന്റെ ദൈവത്തിന്റെ ഉടമ്പടിയുടെ ഉപ്പ്’ എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ നിലനിർത്തണോ അതിന്റെ പ്രതീകാർഥം വ്യാഖ്യാനിക്കണോ
  choice: പ്രയോഗം മുഖ്യപാഠത്തിൽ നേരിട്ട് നിലനിർത്തി
  alternative: ‘നിന്റെ ദൈവത്തിന്റെ ഉടമ്പടിയെ സൂചിപ്പിക്കുന്ന ഉപ്പ്’
  rationale: വാക്യം തന്നെ ഉപ്പിന്റെ പ്രതീകാർഥം വിശദീകരിക്കുന്നില്ല. അതിനാൽ വിശ്വസ്തത, സ്ഥിരത തുടങ്ങിയ സാധ്യമായ ആശയങ്ങളിൽ ഒന്ന് മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ യഥാർഥ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. ‘ധാന്യയാഗം’ പ്രത്യേക യാഗവർഗം സൂചിപ്പിക്കുന്നു; ‘വഴിപാട്’ പൊതുവായ קָרְבַּן എന്ന പദത്തെ വേർതിരിക്കുന്നു. ഏകവചന രണ്ടാംപുരുഷ നിർദേശഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി ‘-ണം/രുത്’ രൂപങ്ങളിൽ നൽകി.
