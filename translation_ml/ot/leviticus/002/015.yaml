  yaml_path: translation/ot/leviticus/002/015.yaml
  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: ml
  text: അതിന്റെമേൽ എണ്ണ ഇടണം, അതിന്റെമേൽ കുന്തിരിക്കം വെക്കണം; അത് ഒരു ധാന്യയാഗമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: ഒഴിക്കണം
  rationale: נתן എന്നതിന് ‘കൊടുക്കുക, ഇടുക, വെക്കുക’ എന്നിങ്ങനെ വിശാലമായ അർഥങ്ങളുണ്ട്. എണ്ണ ഒരു യാഗവസ്തുവിന്മേൽ പ്രയോഗിക്കുന്ന ഈ ആചാരസന്ദർഭത്തിൽ ‘ഒഴിക്കണം’ എന്നത് സ്വാഭാവികമായ മലയാളമാണ്; എങ്കിലും മൂലപദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עָלֶיהָ
  choice: അതിന്റെമേൽ / അതിന്മേൽ
  rationale: על എന്ന പദവും സ്ത്രീലിംഗ ഏകവചന പ്രത്യയവും മുമ്പ് വിവരിച്ച യാഗവസ്തുവിന്മേലുള്ള പ്രയോഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: שֶׁמֶן
  choice: എണ്ണ
  rationale: മൂലപാഠത്തിൽ ‘ഒലിവെണ്ണ’ എന്ന് പ്രത്യേകം പറയാത്തതിനാൽ പൊതുവായ ‘എണ്ണ’ നിലനിർത്തുന്നു.
- source_word: וְשַׂמְתָּ
  choice: വെക്കണം
  rationale: שׂים എന്നത് ‘വെക്കുക, സ്ഥാപിക്കുക’ എന്ന സാധാരണ ക്രിയയാണ്; കുന്തിരിക്കം യാഗവസ്തുവിന്മേൽ ഇടുന്നതിനെ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לְבֹנָה
  choice: കുന്തിരിക്കം
  rationale: לבנה പൊതുവായ ധൂപവർഗത്തെയല്ല, frankincense-നെയാണ് സൂചിപ്പിക്കുന്നത്; അതിന്റെ പതിവായ കൃത്യമായ മലയാളപദമാണ് ‘കുന്തിരിക്കം’.
- source_word: מִנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ מנחה ഒരു പൊതുവായ വഴിപാടല്ല, ധാന്യത്തിൽനിന്നുള്ള യാഗമാണ്.
- source_word: הִוא
  choice: അത് ... ആണ്
  rationale: മുമ്പ് വിവരിച്ച വസ്തുവിനെ ലളിതമായി തിരിച്ചറിയിക്കുന്ന എബ്രായ വിധേയവാക്യഘടന നിലനിർത്തുന്നു.
