  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: ml
  text: പുരോഹിതൻ അതിന്റെ ചതച്ച ധാന്യത്തിൽനിന്നും എണ്ണയിൽനിന്നും സ്മാരകാംശം, അതിന്റെ കുന്തുരുക്കം മുഴുവനോടുകൂടെ, യഹ്‌വേക്കുള്ള അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗമായി ദഹിപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചതച്ച ധാന്യം” എന്നതിന് “പരുക്കനായി പൊടിച്ച ധാന്യം” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ധാന്യയാഗത്തിനായി ഒരുക്കിയ ചതച്ച ധാന്യമണികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: യാഗപീഠത്തിൽ ദഹിപ്പിക്കണം
  rationale: ഹിഫ്ഇൽ രൂപത്തിലുള്ള קטר യാഗസന്ദർഭത്തിൽ യാഗപീഠത്തിൽ കത്തിച്ച് പുകയുയർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ചടങ്ങിന്റെ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘യാഗപീഠത്തിൽ ദഹിപ്പിക്കണം’ എന്നു നൽകി.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ ആരാധനാനിയമങ്ങളിൽ כהן എന്നതിന് സ്വാഭാവികവും നിലവാരമുള്ളതുമായ മലയാളപദം.
- source_word: אַזְכָּרָתָהּ
  choice: സ്മാരകാംശം
  rationale: ധാന്യയാഗത്തിൽനിന്ന് പ്രതിനിധിയായി യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന പ്രത്യേക അംശത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദത്തിന്റെ ‘സ്മാരക’ ഭാവവും ‘portion’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: מִגִּרְשָׂהּ
  choice: അതിന്റെ ചതച്ച ധാന്യത്തിൽനിന്നും
  rationale: גרש ചതച്ചതോ പരുക്കനായി പൊടിച്ചതോ ആയ ധാന്യമണികളെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ‘ചതച്ച ധാന്യം’ എന്നു നൽകി; കൃത്യമായ പകരങ്ങൾ അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: וּמִשַּׁמְנָהּ
  choice: എണ്ണയിൽനിന്നും
  rationale: מן എന്ന ഉപസർഗം സ്മാരകാംശം ധാന്യത്തിൽനിന്നും എണ്ണയിൽനിന്നും എടുക്കപ്പെടുന്നു എന്ന എബ്രായഘടന നിലനിർത്തുന്നു.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: അതിന്റെ കുന്തുരുക്കം മുഴുവനോടുംകൂടെ
  rationale: 'ഈ യാഗനിർദേശത്തിൽ על സഹവർത്തിത്വത്തെ സൂചിപ്പിക്കുന്നു: സ്മാരകാംശം മുഴുവൻ കുന്തുരുക്കത്തോടൊപ്പം ദഹിപ്പിക്കുന്നു.'
- source_word: אִשֶּׁה
  choice: ദഹനയാഗം
  rationale: അഗ്നിയിൽ അർപ്പിക്കപ്പെടുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന ആരാധനാസാങ്കേതിക പദം. ‘അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗം’ എന്നതിനെക്കാൾ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്; എന്നാൽ സാധാരണ ഹോമയാഗത്തിനുള്ള പ്രത്യേക പദവുമായി പൂർണമായി ഒത്തുചേരാതിരിക്കാൻ വാക്യത്തിൽ ദഹിപ്പിക്കൽ വ്യക്തമാക്കിയിട്ടുണ്ട്.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: ലാമെദ് സമർപ്പണത്തിന്റെ ദിശ/ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה ശീർഷകമാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ ആധുനികമായി അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- issue: אַזְכָּרָה എന്ന ആരാധനാസാങ്കേതിക പദത്തിന്റെ അർഥം
  choice: സ്മാരകാംശം
  alternative: സ്മരണയാഗം; ഓർമിപ്പിക്കുന്ന അംശം
  rationale: ഇത് ആരെ ആരാണ് ഓർക്കുന്നത് എന്ന വ്യാഖ്യാനപ്രശ്നം വാക്യത്തിൽ തീർപ്പാക്കാതെ, യാഗത്തിൽനിന്ന് ദഹിപ്പിക്കുന്ന പ്രതിനിധിഭാഗം എന്ന ചടങ്ങുസംബന്ധമായ അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമനിർദേശത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ ‘അതിന്റെ’ എന്ന ആവർത്തനബന്ധം ആവശ്യമായത്ര നിലനിർത്തി; ചടങ്ങിന്റെ പ്രവർത്തനം വ്യക്തമാക്കാൻ ‘യാഗപീഠത്തിൽ’ സന്ദർഭസൂചനയായി ചേർത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
