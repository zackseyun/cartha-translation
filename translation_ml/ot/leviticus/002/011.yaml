id: LEV.2.11
reference: Leviticus 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: ml
  text: നിങ്ങൾ യഹോവയ്ക്ക് അർപ്പിക്കുന്ന ഒരു ധാന്യയാഗവും പുളിപ്പുള്ളതാക്കി ഒരുക്കരുത്; കാരണം അതിൽനിന്ന് പുളിമാവോ തേനോ[a] ഒന്നും യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണമായി[b] കത്തിച്ചർപ്പിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പുരാതന പ്രയോഗത്തിൽ ‘തേൻ’ എന്ന പദം തേനീച്ചത്തേൻ മാത്രമല്ല, പഴങ്ങളിൽനിന്നുള്ള മധുരസിറപ്പും ഉൾക്കൊള്ളാം.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗം’; ബലിപീഠത്തിൽ കത്തിച്ച് അർപ്പിക്കുന്ന യാഗത്തെയാണ് ഈ എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകം 2-ന്റെ പശ്ചാത്തലത്തിൽ ഇത് ധാന്യമോ മാവോ അടിസ്ഥാനമാക്കിയ പ്രത്യേക യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘യാഗം’ എന്നതിനെക്കാൾ ‘ധാന്യയാഗം’ വ്യക്തമാണ്.
- source_word: תַּקְרִיבוּ
  choice: അർപ്പിക്കുന്ന
  rationale: ബലിയർപ്പണസന്ദർഭത്തിലെ ഹിഫിൽ രൂപം ദൈവസന്നിധിയിൽ കൊണ്ടുവന്ന് അർപ്പിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה നേരിട്ട് ‘യഹോവ’ എന്നു നൽകുകയും לְ എന്ന ഉപസർഗത്തിന്റെ ദിശാസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: תֵעָשֶׂה חָמֵץ
  choice: പുളിപ്പുള്ളതായി തയ്യാറാക്കരുത്
  rationale: യാഗവസ്തു പുളിപ്പിച്ച നിലയിൽ ഉണ്ടാക്കരുതെന്ന നിരോധനം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׂאֹר
  choice: പുളിമാവ്
  rationale: ഇത് പുളിപ്പിക്കുന്ന വസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക വാണിജ്യ ഈസ്റ്റിലേക്കു മാത്രം അർത്ഥം ചുരുക്കാതെ പരമ്പരാഗത പുളിപ്പിക്കൽ ഘടകത്തെ വ്യക്തമാക്കുന്നു.
- source_word: דְּבַשׁ
  choice: തേൻ
  rationale: പദത്തിന്റെ സാധാരണ അർത്ഥം ‘തേൻ’ ആണ്; പുരാതന പ്രയോഗത്തിലെ വിശാലമായ അർത്ഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לֹא תַקְטִירוּ
  choice: കത്തിച്ചർപ്പിക്കരുത്
  rationale: ബലിപീഠത്തിൽ കത്തിച്ച് പുകയായി ഉയർത്തുന്ന ആരാധനാക്രിയയെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אִשֶּׁה
  choice: അഗ്നിയർപ്പണം
  rationale: അഗ്നിയിൽ കത്തിച്ച് ബലിപീഠത്തിൽ അർപ്പിക്കുന്ന സാങ്കേതിക യാഗവിഭാഗത്തെ ‘ദഹനയാഗം’ എന്ന പ്രത്യേക യാഗവുമായി കലരാതെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു.
- issue: אִשֶּׁה എന്ന ആരാധനാസാങ്കേതിക പദം
  choice: അഗ്നിയർപ്പണം
  alternative: ഭോജനയാഗം / അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗം
  rationale: ‘ഭോജനയാഗം’ മലയാളത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാം; ‘അഗ്നിയർപ്പണം’ ബലിപീഠത്തിൽ കത്തിച്ചർപ്പിക്കുന്ന ക്രിയയെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു, വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘ദഹനയാഗം’ എന്നത് വേറൊരു പ്രത്യേക ബലിവിഭാഗമായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ ഒഴിവാക്കി; രണ്ട് നിരോധനഘടകങ്ങളും വ്യക്തമായി നിലനിർത്തി.
