id: LEV.2.12
reference: Leviticus 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: קָרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖/ם לַ/יהוָ֑ה וְ/אֶל הַ/מִּזְבֵּ֥חַ לֹא יַעֲל֖וּ לְ/רֵ֥יחַ נִיחֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: ml
  text: ആദ്യഫലങ്ങളുടെ വഴിപാടായി നിങ്ങൾ അവയെ യഹ്‌വേക്കു സമർപ്പിക്കാം[a]; എന്നാൽ പ്രസാദകരമായ സൗരഭ്യത്തിനായി അവ യാഗപീഠത്തിന്മേൽ അർപ്പിക്കപ്പെടരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ആദ്യഫലവഴിപാടായി.’'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘പ്രസാദകരമായ സൗരഭ്യത്തിനായി അവ യാഗപീഠത്തിലേക്കു കയറരുത്.’ യാഗപീഠത്തിന്മേൽ കയറ്റി ദഹിപ്പിച്ച് അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: ആദ്യഫലങ്ങളുടെ വഴിപാടായി
  rationale: എബ്രായത്തിലെ സംയുക്തപ്രയോഗം ആദ്യവിളവിൽനിന്നുള്ള വഴിപാടിനെ സൂചിപ്പിക്കുന്നു. ‘ആദ്യഫലങ്ങളുടെ വഴിപാട്’ എന്നത് ബന്ധം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: תַּקְרִיבוּ
  choice: നിങ്ങൾ ... സമർപ്പിക്കാം
  rationale: ബലിസന്ദർഭത്തിൽ ഹിഫിൽ രൂപം കൊണ്ടുവന്ന് ദൈവത്തിനു സമർപ്പിക്കുക എന്നർഥം നൽകുന്നു. മുൻവാക്യത്തിലെ നിരോധനവും തുടർന്നുള്ള വ്യത്യാസവും കണക്കിലെടുത്ത് സന്ദർഭജന്യമായ അനുവാദഭാവം ‘സമർപ്പിക്കാം’ എന്നു പ്രകടമാക്കി.
- source_word: אֹתָם
  choice: അവയെ
  rationale: പുരുഷലിംഗ ബഹുവചന സർവനാമം മുൻവാക്യത്തിലെ പുളിപ്പും തേനും ചേർന്ന വസ്തുക്കളിലേക്കു മടങ്ങുന്നു; മലയാളത്തിൽ ‘അവയെ’ സ്വാഭാവികമാണ്.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: ചതുരക്ഷര ദൈവനാമം വ്യക്തിനാമമായി ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; לְ സമർപ്പണത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നതിനാൽ ദത്തിവിഭക്തി ഉപയോഗിച്ചു.
- source_word: וְאֶל־הַמִּזְבֵּחַ לֹא יַעֲלוּ
  choice: എന്നാൽ ... അവ യാഗപീഠത്തിന്മേൽ അർപ്പിക്കപ്പെടരുത്
  rationale: עלה എന്നതിന്റെ അക്ഷരാർഥം ‘കയറുക/മുകളിലേക്കു പോകുക’ ആണെങ്കിലും ഇവിടെ യാഗപീഠത്തിൽ കയറ്റി ദഹിപ്പിക്കുന്ന ആരാധനാക്രിയയാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ അക്ഷരാർഥം അസ്വാഭാവികവും തെറ്റിദ്ധാരണാജനകവുമായതിനാൽ ക്രിയയുടെ യാഗസന്ദർഭാർഥം മുഖ്യപാഠത്തിൽ നൽകി.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യമായി
  rationale: ദൈവത്തിനു സ്വീകാര്യമായ യാഗത്തെ വിവരിക്കുന്ന സ്ഥിരപ്രയോഗത്തിലെ സൗരഭ്യരൂപകം നിലനിർത്തുന്നു; ‘പ്രസാദകരമായ’ എന്നത് സന്തോഷം/സ്വീകാര്യതയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം നിയമനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ അടുപ്പമുള്ള ലിപ്യന്തരണമായ ‘യഹ്‌വേ’ ഉപയോഗിച്ചു.
- issue: תַּקְרִיבוּ എന്ന ക്രിയയിലെ വിധി/അനുവാദഭാവം
  choice: സമർപ്പിക്കാം
  alternative: സമർപ്പിക്കണം; സമർപ്പിക്കും
  rationale: എബ്രായി രൂപം സ്വതവേ അപൂർണ്ണകാല ക്രിയയായിരിക്കെ, സന്ദർഭം ഇവയെ യഹ്‌വേക്കു ആദ്യഫലമായി കൊണ്ടുവരാൻ അനുവദിക്കുകയും യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്നത് നിരോധിക്കുകയും ചെയ്യുന്നു. ആ സന്ദർഭവ്യത്യാസം മലയാളത്തിൽ അനുവാദരൂപത്തിൽ പ്രകടമാക്കി.
- issue: לֹא יַעֲלוּ എന്നതിലെ ഉയരുന്ന രൂപകം
  choice: അർപ്പിക്കപ്പെടരുത്
  alternative: കയറരുത്; കയറ്റപ്പെടരുത്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കയറുക’ എന്ന രൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചുകൊണ്ട്, മുഖ്യപാഠത്തിൽ യാഗപീഠത്തിൽ ദഹിപ്പിച്ച് അർപ്പിക്കുന്ന പ്രവൃത്തിയെ വ്യക്തമായി അറിയിച്ചു. അതിന്റെ സ്വീകാര്യതയെക്കുറിച്ചുള്ള സൂക്ഷ്മത ‘പ്രസാദകരമായ സൗരഭ്യമായി’ എന്ന തുടർവാക്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. ‘വഴിപാട്’, ‘സമർപ്പിക്കുക’, ‘യാഗപീഠം’, ‘സൗരഭ്യം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും ലേവ്യപുസ്തകത്തിന്റെ യാഗസന്ദർഭത്തിന് യോജിച്ചതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
