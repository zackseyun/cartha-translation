id: LEV.2.1
reference: Leviticus 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: ml
  text: ഒരു വ്യക്തി യഹോവയ്ക്കു ധാന്യവഴിപാട് അർപ്പിക്കുമ്പോൾ, അവന്റെ വഴിപാട് നന്നായി അരിച്ച മാവായിരിക്കണം. അവൻ അതിന്മേൽ എണ്ണ ഒഴിക്കണം; അതിന്മേൽ കുന്തിരിക്കവും ഇടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ധാന്യവഴിപാട്’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന മിൻഹാ എന്ന ഹീബ്രുപദം പൊതുവേ ഒരു സമ്മാനത്തെയോ വഴിപാടിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ അത് നന്നായി അരിച്ച മാവുകൊണ്ടുള്ള ധാന്യവഴിപാടിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ഒരാൾ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘ജീവൻ/ആത്മാവ്’ എന്നാണെങ്കിലും, ഈ നിയമപരവും ആരാധനാക്രമപരവുമായ സന്ദർഭത്തിൽ അത് ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: תַקְרִיב
  choice: അർപ്പിക്കുമ്പോൾ
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗമായി അടുത്തുകൊണ്ടുവരുക/സമർപ്പിക്കുക എന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ ‘അർപ്പിക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: קָרְבַּן מִנְחָה
  choice: ധാന്യയാഗം
  rationale: കാർഷിക ഉൽപ്പന്നത്തിൽനിന്നുള്ള ഈ പ്രത്യേക വഴിപാടിനെ പൊതുവായ ‘വഴിപാട്’ എന്നതിൽനിന്ന് വേർതിരിച്ചറിയിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ഹീബ്രു ചതുർവർണ ദിവ്യനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ, ഉടമ്പടിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: നന്നായി അരിച്ചോ പൊടിച്ചോ തയ്യാറാക്കിയ ഉന്നത നിലവാരമുള്ള മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നേരിയ മാവ്’ സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: יִהְיֶה קָרְבָּנוֹ
  choice: അയാളുടെ വഴിപാട് ... ആയിരിക്കണം
  rationale: ഹീബ്രുവിലെ പ്രതിനിധാനപരമായ ഏകവചനവും 3-ാം പുരുഷ പുല്ലിംഗ പ്രത്യയവും നിലനിർത്തുന്നു; നിർദേശാത്മക ബലം ‘ആയിരിക്കണം’ വ്യക്തമാക്കുന്നു.
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: അതിന്മേൽ എണ്ണ ഒഴിച്ച്
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുൻപറഞ്ഞ മിൻഹാ വഴിപാടിലേക്കാണ് തിരിച്ചുപോകുന്നത്; മലയാളത്തിൽ ക്രിയാശൃംഖല സ്വാഭാവികമായി നൽകി.
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: കുന്തിരിക്കവും വെക്കണം
  rationale: לְבֹנָה ആരാധനയിൽ ഉപയോഗിക്കുന്ന സുഗന്ധമുള്ള frankincense resin ആണ്; അതിന്റെ നിലവാരമുള്ള മലയാളപദം ‘കുന്തിരിക്കം’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുർവർണനാമം നേരിട്ട് വരുന്നതിനാൽ, പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ നാമരൂപം നിലനിർത്തി.
- issue: നിയമനിർദേശത്തിലെ പുല്ലിംഗ ഏകവചന രൂപങ്ങൾ
  choice: അയാളുടെ ... അയാൾ
  alternative: അവരുടെ ... അവർ
  rationale: മൂലഹീബ്രുവിലെ പ്രതിനിധാനപരമായ ഏകവചനവും 3-ാം പുരുഷ പുല്ലിംഗരൂപങ്ങളും മറച്ചുവയ്ക്കാതെ നിലനിർത്തി; ഇത് സ്ത്രീകളെ ഒഴിവാക്കുന്നുവെന്ന അധികവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാക്രമഭാഷ ഉപയോഗിച്ചു. ‘യാഗം’ എന്ന പ്രത്യേക പദവും ‘വഴിപാട്’ എന്ന പൊതുപദവും ചേർത്ത് ഹീബ്രുവിലെ מִנְחָה / קָרְבָּן വ്യത്യാസം സാധ്യമായത്ര പ്രകടമാക്കി. നിർദേശത്തിന്റെ നിയമപരമായ ബലം ‘ആയിരിക്കണം/വെക്കണം’ രൂപങ്ങളിൽ നിലനിർത്തി.
