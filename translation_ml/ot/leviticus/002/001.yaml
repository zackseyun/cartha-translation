- from: ഒരാൾ യഹോവയ്ക്ക് ഒരു ധാന്യയാഗം അർപ്പിക്കുമ്പോൾ, അയാളുടെ വഴിപാട് നേരിയ മാവുകൊണ്ടുള്ളതായിരിക്കണം. അയാൾ അതിന്മേൽ എണ്ണ ഒഴിച്ച് കുന്തിരിക്കവും വെക്കണം.[a]
  to: ഒരു വ്യക്തി യഹോവയ്ക്കു ധാന്യവഴിപാട് അർപ്പിക്കുമ്പോൾ, അവന്റെ വഴിപാട് നന്നായി അരിച്ച മാവായിരിക്കണം. അവൻ അതിന്മേൽ എണ്ണ ഒഴിക്കണം; അതിന്മേൽ കുന്തിരിക്കവും ഇടണം.[a]
