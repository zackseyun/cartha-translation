source:
  edition: WLC
  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: ml
  text: അവൻ അത് അഹരോന്റെ പുത്രന്മാരായ പുരോഹിതന്മാരുടെ അടുക്കൽ കൊണ്ടുവരണം. അവിടെനിന്ന് അവൻ അതിലെ നേർമാവിൽനിന്ന് ഒരു കൈപ്പിടി നിറയെ, അതിന്റെ എണ്ണയിൽനിന്ന് കുറെ, അതിന്റെ കുന്തുരുക്കം മുഴുവനോടുംകൂടെ എടുക്കണം. പിന്നെ പുരോഹിതൻ അതിന്റെ സ്മാരകഭാഗം യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം—യഹ്‌വേക്കു പ്രസാദകരമായ സുഗന്ധമായ, തീയിൽ അർപ്പിക്കുന്ന യാഗമായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തീയിൽ അർപ്പിക്കുന്ന യാഗം” എന്നതിനു പകരം “ഭോജനയാഗം” എന്നും വിവർത്തനം ചെയ്യാം; ഹീബ്രു പദത്തിന്റെ കൃത്യമായ വ്യുത്പത്തിയും അർഥവ്യാപ്തിയും അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: അവൻ അത് ... കൊണ്ടുവരണം
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘കൊണ്ടുവരുക’ എന്ന അർഥവും നിയമനിർദേശത്തിന്റെ ഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: അഹരോന്റെ പുത്രന്മാരായ പുരോഹിതന്മാർ
  rationale: കുടുംബബന്ധവും പുരോഹിതപദവിയും രണ്ടും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: ഒരു കൈക്കുമ്പിൾ നിറയെ എടുത്ത്
  rationale: അടച്ച കൈയിൽ കൊള്ളുന്ന പൂർണ അളവിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ആരാണ് എടുക്കുന്നതെന്ന ഹീബ്രു വാക്യത്തിലെ സാധ്യതയുള്ള അവ്യക്തത ‘അവൻ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: מִסָּלְתָּהּ וּמִשַּׁמְנָהּ
  choice: അതിലെ നേരിയ മാവും എണ്ണയും ചേർന്നതിൽനിന്ന്
  rationale: കൈക്കുമ്പിൾ അളവ് മാവും എണ്ണയും ഉൾപ്പെട്ട മിശ്രിതത്തിൽനിന്നാണെന്ന വാക്യബന്ധം വ്യക്തമാക്കുന്നു; എണ്ണ മുഴുവനുമെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: അതിന്റെ കുന്തുരുക്കം മുഴുവനും അതോടൊപ്പം
  rationale: കുന്തുരുക്കത്തിന്റെ മുഴുവൻ അളവും കൈക്കുമ്പിൾ ഭാഗത്തോടൊപ്പം അർപ്പിക്കപ്പെടുന്നു എന്ന ആശയം സൂക്ഷിക്കുന്നു.
- source_word: וְהִקְטִיר
  choice: ദഹിപ്പിക്കണം
  rationale: യാഗപീഠത്തിൽ പുകയായി ഉയർത്തുന്ന യാഗക്രിയയെ സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אַזְכָּרָתָהּ
  choice: അതിന്റെ സ്മാരകഭാഗം
  rationale: മുഴുവൻ ധാന്യയാഗത്തെ പ്രതിനിധീകരിച്ച് യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന സാങ്കേതിക യാഗഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אִשֵּׁה
  choice: തീയിൽ അർപ്പിക്കുന്ന യാഗം
  rationale: തീയുമായി ബന്ധപ്പെട്ട യാഗാർപ്പണം എന്ന പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥം നൽകുന്നു; പൂർണദഹനയാഗം എന്ന പ്രത്യേക യാഗവിഭാഗവുമായി കലരാതിരിക്കാൻ ‘ദഹനയാഗം’ ഒഴിവാക്കുന്നു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധം
  rationale: ദൈവസ്വീകാര്യത സൂചിപ്പിക്കുന്ന യാഗഭാഷയിലെ രൂപകം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יהוה
  choice: യഹ്‌വേ
  rationale: ഹീബ്രു ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർവർണ ദൈവനാമം മറയ്ക്കാതെ പേരായി നിലനിർത്തുന്നു.
- issue: אִשֵּׁה എന്ന യാഗസാങ്കേതിക പദത്തിന്റെ അർഥം
  choice: തീയിൽ അർപ്പിക്കുന്ന യാഗം
  alternative: ഭോജനയാഗം / തീയ്യാഗം
  rationale: പദത്തിന്റെ വ്യുത്പത്തിയും യാഗസന്ദർഭത്തിലെ ഭക്ഷണസങ്കൽപ്പവും സംബന്ധിച്ച അനിശ്ചിതത്വം കണക്കിലെടുത്ത് പ്രധാന പാഠത്തിൽ തീയിൽ അർപ്പിക്കുന്നതെന്ന ഉറച്ച സന്ദർഭസൂചന സ്വീകരിക്കുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ നിയമനിർദേശശൈലി സ്വീകരിച്ചു. യാഗസാങ്കേതികത നിലനിർത്തിക്കൊണ്ട് അപരിചിതമായ സംസ്കൃതഭാരമുള്ള പദങ്ങൾ പരമാവധി ഒഴിവാക്കി; ‘കുന്തുരുക്കം’, ‘യാഗപീഠം’, ‘സ്മാരകഭാഗം’ എന്നിവ സന്ദർഭത്തിന് ആവശ്യമായ സാങ്കേതിക പദങ്ങളായി ഉപയോഗിച്ചു.
