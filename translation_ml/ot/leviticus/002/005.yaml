base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/005.yaml
  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: ml
  text: നിന്റെ വഴിപാട് പരന്ന ചട്ടിയിൽ[a] തയ്യാറാക്കുന്ന ധാന്യവഴിപാടാണെങ്കിൽ, അത് എണ്ണ ചേർത്തു കലക്കിയ നന്നായി പൊടിച്ച മാവുകൊണ്ടുള്ളതും പുളിപ്പില്ലാത്തതുമായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരന്ന പാത്രത്തിൽ.’ എബ്രായപദം ഈ ധാന്യവഴിപാട് തയ്യാറാക്കാൻ ഉപയോഗിച്ചിരുന്ന പരന്ന പാചകോപരിതലത്തെയോ പാത്രത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: ധാന്യവഴിപാട്
  rationale: ലേവ്യപുസ്തകം 2-ലെ സന്ദർഭത്തിൽ ധാന്യമോ മാവോ ഉപയോഗിച്ചുള്ള പ്രത്യേക വഴിപാടിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘വഴിപാട്’ എന്നതിനെക്കാൾ ഇത് വ്യക്തമാണ്.
- source_word: עַל הַמַּחֲבַת
  choice: ചുട്ടെടുക്കാനുള്ള പരന്ന പാത്രത്തിൽ
  rationale: מַחֲבַת ഒരു പരന്ന പാചകോപരിതലത്തെയോ പാത്രത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും ഉപകരണത്തിന്റെ സാധ്യതയുള്ള രൂപം വ്യക്തമാക്കുന്നതുമായ വിവർത്തനം.
- source_word: קָרְבָּנְךָ
  choice: നിന്റെ വഴിപാട്
  rationale: രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധന നിലനിർത്തുന്നു; מִנְחָהയോടുള്ള ആശയബന്ധവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: നന്നായി പൊടിച്ച, ഉയർന്ന നിലവാരമുള്ള മാവിനെ സൂചിപ്പിക്കുന്ന യാഗസന്ദർഭത്തിലെ സാങ്കേതിക പദത്തിന് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപം.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയിരിക്കണം എന്ന തയ്യാറാക്കൽരീതി വ്യക്തമാക്കുന്നു; കുഴയ്ക്കുക തുടങ്ങിയ കൂടുതൽ നിർദിഷ്ടമായ രീതി അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: מַצָּה
  choice: പുളിപ്പില്ലാത്തത്
  rationale: ഇവിടെ സ്വതന്ത്രമായ ‘പുളിപ്പില്ലാത്ത അപ്പം’ എന്ന നാമമല്ല, വഴിപാടിന്റെ ആവശ്യമായ അവസ്ഥയെ വിവരിക്കുന്ന വിശേഷണമാണ്.
- source_word: תִהְיֶה
  choice: ആയിരിക്കണം
  rationale: നിയമപരമായ നിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
