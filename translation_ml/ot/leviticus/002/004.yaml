  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: ml
  text: 'നിങ്ങൾ അടുപ്പിൽ ചുട്ട ധാന്യയാഗം അർപ്പിക്കുന്നുവെങ്കിൽ, അത് നന്നായി അരിച്ച മാവുകൊണ്ടുള്ളതായിരിക്കണം: എണ്ണ ചേർത്ത പുളിപ്പില്ലാത്ത അപ്പങ്ങളോ, എണ്ണ പുരട്ടിയ പുളിപ്പില്ലാത്ത നേർത്ത അപ്പങ്ങളോ[a] ആയിരിക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എണ്ണ ചേർത്ത പുളിപ്പില്ലാത്ത അപ്പങ്ങളും എണ്ണ പുരട്ടിയ പുളിപ്പില്ലാത്ത നേർത്ത അപ്പങ്ങളും.” ഹീബ്രുവിൽ ഇവിടെ അക്ഷരാർഥത്തിൽ “ഉം” എന്നാണ്; എന്നാൽ അടുപ്പിൽ ചുട്ട ധാന്യയാഗത്തിന്റെ മറ്റൊരു രൂപമാണ് രണ്ടാമത്തേത് എന്നു സന്ദർഭം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
