  choice: നിങ്ങൾ ... അർപ്പിക്കുന്നുവെങ്കിൽ
  rationale: നിയമനിർദേശത്തിലെ വ്യവസ്ഥാസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു. ഹിഫിൽ രൂപത്തിന്റെ ‘അടുത്തുകൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന ആശയം യാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക’ എന്നതിൽ വ്യക്തമായി പ്രതിഫലിക്കുന്നു.
- source_word: קָרְבַּן מִנְחָה
  choice: ധാന്യയാഗം
  rationale: ഇവിടെ מִנְחָה പൊതുവായ സമ്മാനമല്ല, മാവും എണ്ണയുംകൊണ്ടുള്ള പ്രത്യേക യാഗവിഭാഗമാണ്. ആവർത്തനഭാരം ഒഴിവാക്കി ആചാരപരമായ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: מַאֲפֵה תַנּוּר
  choice: അടുപ്പിൽ ചുട്ട
  rationale: തന്നൂരിൽ/ചൂളയിൽ ചുട്ടുണ്ടാക്കുന്ന തയ്യാറാക്കൽരീതിയെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: סֹלֶת
  choice: നേർത്ത മാവ്
  rationale: യാഗത്തിനുപയോഗിച്ച നന്നായി അരിച്ച ഉന്നതഗുണമുള്ള മാവിനെ ലളിതവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: חַלּוֹת מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പങ്ങൾ
  rationale: חַלּוֹת എന്നത് അപ്പത്തിന്റെ കട്ടിയുള്ള രൂപങ്ങളെയും מַצּוֹת പുളിപ്പില്ലായ്മയെയും സൂചിപ്പിക്കുന്നു.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: എണ്ണ മാവിൽ കലർത്തിയതാണെന്ന തയ്യാറാക്കൽരീതി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: അല്ലെങ്കിൽ ... പുളിപ്പില്ലാത്ത നേർത്ത അപ്പങ്ങൾ
  rationale: רְקִיקִים നേർത്ത അപ്പങ്ങളാണ്. ഹീബ്രു സംയോജകം അക്ഷരാർഥത്തിൽ ‘കൂടാതെ/ഉം’ ആണെങ്കിലും, സന്ദർഭത്തിൽ മറ്റൊരു അനുവദനീയ രൂപം പട്ടികപ്പെടുത്തുന്നതായി തോന്നുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘അല്ലെങ്കിൽ’ ഉപയോഗിക്കുകയും യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: എണ്ണ പുരട്ടിയ
  rationale: ഭക്ഷണതയ്യാറാക്കൽസന്ദർഭത്തിലെ משׁח എന്ന ക്രിയയുടെ പ്രായോഗിക അർഥം നൽകുന്നു; ‘അഭിഷേകം ചെയ്ത’ എന്ന മതസാങ്കേതിക ധ്വനി അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: മִנְחָה എന്ന പദത്തിന്റെ യാഗസന്ദർഭത്തിലുള്ള അർഥം
  choice: ധാന്യയാഗം
  alternative: സമ്മാനയാഗം / കാഴ്ച
  rationale: ലേവ്യപുസ്തകം 2-ൽ മാവും എണ്ണയുംകൊണ്ടുള്ള പ്രത്യേക യാഗവിഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ വിശാലമായ ‘സമ്മാനം’ എന്ന അർഥത്തേക്കാൾ ‘ധാന്യയാഗം’ സന്ദർഭോചിതമാണ്.
- issue: וּרְקִיקֵי എന്നതിലെ സംയോജകത്തിന്റെ ബന്ധം
  choice: അല്ലെങ്കിൽ
  alternative: കൂടാതെ / ഉം
  rationale: രണ്ട് തയ്യാറാക്കൽരൂപങ്ങൾക്കിടയിലെ വൈകല്പികബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; എന്നാൽ ഹീബ്രുവിലെ അക്ഷരാർഥമായ ‘ഉം’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള നിയമനിർദേശശൈലി പാലിച്ചു. ‘അഭിഷേകം’ എന്ന സാങ്കേതിക മതപദത്തിനു പകരം ഭക്ഷണത്തിൽ എണ്ണ പുരട്ടുന്നതിനെ വ്യക്തമാക്കുന്ന പദം ഉപയോഗിച്ചു; ഹീബ്രു സംയോജകത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
