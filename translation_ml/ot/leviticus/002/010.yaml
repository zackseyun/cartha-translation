id: LEV.2.10
reference: Leviticus 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: ml
  text: ധാന്യയാഗത്തിൽ ശേഷിക്കുന്നത് അഹരോനും അവന്റെ പുത്രന്മാർക്കും ഉള്ളതായിരിക്കണം. യഹോവയ്ക്ക് അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗങ്ങളിൽനിന്നുള്ള അതിവിശുദ്ധമായ ഒന്നാണത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയുടെ ഭോജനാർപ്പണങ്ങളിൽനിന്നുള്ള അതിവിശുദ്ധമായ ഒന്നാണത്.”
    reason: אִשֶּׁה എന്ന പദം അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗത്തെയോ ദൈവത്തിനു സമർപ്പിക്കുന്ന ‘ഭോജനാർപ്പണത്തെയോ’ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִן הַמִּנְחָה
  choice: ധാന്യയാഗത്തിൽ ശേഷിക്കുന്നത്
  rationale: മִנְחָה ഇവിടെ ലേവ്യപുസ്തകം 2-ലെ ധാന്യയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന הַנּוֹתֶרֶת ‘ശേഷിക്കുന്നത്’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: അഹരോനും അവന്റെ പുത്രന്മാർക്കും ഉള്ളതായിരിക്കണം
  rationale: לְ എന്ന ഉപസർഗം ഇവിടെ വിഹിതം അല്ലെങ്കിൽ അവകാശം സൂചിപ്പിക്കുന്നു; നിയമപരമായ പ്രസ്താവനയുടെ ഭാവം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഉള്ളതായിരിക്കണം’ ഉപയോഗിച്ചു.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധമായ ഒന്ന്
  rationale: ഹീബ്രായിയിലെ ആവർത്തനാധിഷ്ഠിത അതിശയോക്തി ഏറ്റവും ഉയർന്ന വിശുദ്ധിനിലയെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ഓഹരി’ എന്ന നാമം ചേർക്കാതെ, ശേഷിക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: מֵאִשֵּׁי
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗങ്ങളിൽനിന്നുള്ള
  rationale: אִשֶּׁה യാഗസന്ദർഭത്തിൽ അഗ്നിമുഖേന ദൈവത്തിനു സമർപ്പിക്കുന്ന അർപ്പണത്തെ സൂചിപ്പിക്കുന്നു. ‘ദഹനയാഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയാൽ പ്രത്യേക യാഗമായ עֹלָהയുമായി തെറ്റിദ്ധരിക്കപ്പെടാം; അതിനാൽ വിവരണാത്മകമായ രൂപം സ്വീകരിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים എന്ന പ്രയോഗം ശേഷിച്ച ഭാഗത്തെ എങ്ങനെ വിശേഷിപ്പിക്കുന്നു
  choice: അതിവിശുദ്ധമായ ഒന്ന്
  alternative: അതിവിശുദ്ധമായ ഓഹരി
  rationale: മൂലപാഠം ‘ഓഹരി’ എന്ന നാമം വ്യക്തമാക്കുന്നില്ല. സൂചിപ്പിക്കപ്പെടുന്ന ഭാഗം വ്യക്തമാകുന്നതിനൊപ്പം ഈ സംക്ഷിപ്തതയും നിലനിർത്തി.
- issue: אִשֵּׁי יְהוָה എന്ന യാഗസാങ്കേതിക പ്രയോഗം
  choice: യഹോവയ്ക്ക് അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗങ്ങൾ
  alternative: യഹോവയുടെ ഭോജനാർപ്പണങ്ങൾ
  rationale: പദത്തിന് ‘ഭോജനം’ എന്ന ആരാധനാസംബന്ധിയായ രൂപകം ഉൾക്കൊള്ളാനാകുമെങ്കിലും, അഗ്നിയിലൂടെ അർപ്പിക്കുന്ന യാഗങ്ങൾ എന്ന അർത്ഥം സന്ദർഭത്തിൽ കൂടുതൽ നേരിട്ടതും വായനക്കാർക്ക് വ്യക്തവുമാണ്. മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. പ്രത്യേക യാഗനാമമായ ‘ദഹനയാഗം’ എന്നതുമായ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗങ്ങൾ’ എന്ന വ്യക്തമായ പ്രയോഗം സ്വീകരിച്ചു.
