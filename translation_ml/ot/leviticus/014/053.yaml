id: LEV.14.53
reference: Leviticus 14:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שִׁלַּ֞ח אֶת הַ/צִּפֹּ֧ר הַֽ/חַיָּ֛ה אֶל מִ/ח֥וּץ לָ/עִ֖יר אֶל פְּנֵ֣י הַ/שָּׂדֶ֑ה וְ/כִפֶּ֥ר עַל הַ/בַּ֖יִת וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: ml
  text: പിന്നെ അവൻ ജീവനുള്ള പക്ഷിയെ നഗരത്തിനു പുറത്തേക്ക് തുറസ്സായ വയലിലേക്കു വിട്ടയക്കണം. ഇങ്ങനെ അവൻ വീടിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം[a]; അപ്പോൾ ആ വീട് ശുദ്ധമാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വീടിനെ ശുദ്ധീകരിക്കണം’ അല്ലെങ്കിൽ ‘വീടിനുവേണ്ടി പരിഹാരകർമം നടത്തണം.’ ആചാരപരമായ ശുദ്ധീകരണത്തിന്റെ ഈ സന്ദർഭത്തിൽ ഹീബ്രു പുരോഹിതപരമായ പ്രായശ്ചിത്തഭാഷയാണ് ഉപയോഗിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: പിന്നെ അവൻ ... വിട്ടയക്കണം
  rationale: പീയേൽ രൂപം ഇവിടെ പക്ഷിയെ ആചാരപരമായി സ്വതന്ത്രമാക്കി വിടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ക്രമാനുഗതമായ വാവിനെ സ്വാഭാവിക മലയാളത്തിൽ ‘പിന്നെ’ എന്നു പ്രകടിപ്പിച്ചു.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: ജീവനുള്ള പക്ഷിയെ
  rationale: നേരത്തെ കൊല്ലപ്പെട്ട പക്ഷിയോടുള്ള വ്യക്തമായ വൈരുധ്യം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אֶל מִחוּץ לָעִיר
  choice: നഗരത്തിനു പുറത്തേക്ക്
  rationale: നഗരപരിധിക്കപ്പുറമുള്ള സ്ഥലത്തേക്കുള്ള ചലനം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֶל פְּנֵי הַשָּׂדֶה
  choice: തുറസ്സായ വയലിലേക്ക്
  rationale: ‘വയലിന്റെ മുഖത്തേക്ക്’ എന്ന ഹീബ്രു പ്രയോഗം തുറന്ന പ്രദേശത്തേക്കുള്ള നീക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പദാനുപദമായ അസ്വാഭാവികത ഒഴിവാക്കി അർത്ഥം സംരക്ഷിക്കുന്നു.
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: അവൻ വീടിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: പുരോഹിതാചാരഭാഷയിലെ כפר എന്ന പദത്തിന്റെ പ്രായശ്ചിത്തപരമായ ഭാരം നിലനിർത്തുന്നു; അതിനെ വെറും ശുചീകരണമെന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: וְטָהֵר
  choice: അപ്പോൾ ആ വീട് ശുദ്ധമാകും
  rationale: ആചാരത്തിനു ശേഷമുള്ള വീടിന്റെ ശുദ്ധസ്ഥിതി വ്യക്തമാക്കുന്നു. ഹീബ്രുവിൽ സൂചിതമായ കർത്താവിനെ മലയാളത്തിൽ ‘ആ വീട്’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
theological_decisions:
- issue: ഒരു വീടുമായി ബന്ധപ്പെട്ട ആചാരശുദ്ധിയുടെ പശ്ചാത്തലത്തിൽ כפר എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വീടിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം
  alternative: വീടിനെ ശുദ്ധീകരിക്കണം; വീടിനുവേണ്ടി പരിഹാരകർമം നടത്തണം
  rationale: ഒരു വീടിനെക്കുറിച്ചുപോലും മൂലപാഠം പുരോഹിതപരമായ പ്രായശ്ചിത്തഭാഷ ഉപയോഗിക്കുന്നു. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു; എന്നാൽ പ്രായശ്ചിത്തത്തെക്കുറിച്ചുള്ള പിൽക്കാലത്തെ ഏതെങ്കിലും പ്രത്യേക സിദ്ധാന്തം പാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നിയമവാക്യത്തിന്റെ നിർദേശസ്വരം ‘ചെയ്യണം’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തി; ആചാരശുദ്ധിയും പ്രായശ്ചിത്തവും തമ്മിലുള്ള മൂലപാഠത്തിലെ ബന്ധം വിശദീകരിച്ച് തീർപ്പാക്കാതെ സംരക്ഷിച്ചു.
