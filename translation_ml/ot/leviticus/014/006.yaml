source:
  edition: WLC
  text: אֶת הַ/צִּפֹּ֤ר הַֽ/חַיָּה֙ יִקַּ֣ח אֹתָ֔/הּ וְ/אֶת עֵ֥ץ הָ/אֶ֛רֶז וְ/אֶת שְׁנִ֥י הַ/תּוֹלַ֖עַת וְ/אֶת הָ/אֵזֹ֑ב וְ/טָבַ֨ל אוֹתָ֜/ם וְ/אֵ֣ת הַ/צִּפֹּ֣ר הַֽ/חַיָּ֗ה בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחֻטָ֔ה עַ֖ל הַ/מַּ֥יִם הַֽ/חַיִּֽים־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: ml
  text: ജീവനുള്ള പക്ഷിയെ ദേവദാരുക്കഷണം, ചെമന്നൂൽ, ഈസോപ്പ് എന്നിവയോടൊപ്പം അവൻ എടുക്കണം. എന്നിട്ട് ആ വസ്തുക്കളെയും ജീവനുള്ള പക്ഷിയെയും ഒഴുകുന്ന വെള്ളത്തിനുമീതെ അറുത്ത പക്ഷിയുടെ രക്തത്തിൽ മുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ജീവനുള്ള വെള്ളം”; അതായത് ഉറവുള്ളതോ ഒഴുകുന്നതോ ആയ വെള്ളം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: ജീവനുള്ള പക്ഷി
  rationale: ചടങ്ങിൽ അറുത്ത പക്ഷിയോടുള്ള വ്യക്തമായ വൈരുധ്യം നിലനിർത്തുകയും എബ്രായ വിശേഷണത്തിന്റെ അർഥം നേരിട്ട് നൽകുകയും ചെയ്യുന്നു.
- source_word: יִקַּח
  choice: എടുക്കണം
  rationale: ചടങ്ങുസംബന്ധമായ നിയമനിർദേശത്തിന്റെ നിർബന്ധാത്മക സ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: עֵץ הָאֶרֶז
  choice: ദേവദാരുക്കഷണം
  rationale: ചടങ്ങിൽ ഉപയോഗിക്കുന്ന ദേവദാരുമരത്തിന്റെ ഒരു കഷണം/വസ്തു എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: ചെമന്നൂൽ
  rationale: കൃമിയിൽനിന്നുള്ള ചായംകൊണ്ട് നിറം നൽകിയ ചെമന്ന നൂൽവസ്തുവിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് ലളിതവും മനസ്സിലാകുന്നതുമായ തുല്യപദമാണ്.
- source_word: הָאֵזֹב
  choice: ഈസോപ്പ്
  rationale: സസ്യത്തിന്റെ കൃത്യമായ സസ്യശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ പരമ്പരാഗതമായ സുതാര്യ നാമം നിലനിർത്തുന്നു.
- source_word: וְטָבַל
  choice: മുക്കണം
  rationale: ചടങ്ങിൽ വസ്തുക്കളെ ദ്രവത്തിൽ മുക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אוֹתָם וְאֵת הַצִּפֹּר הַחַיָּה
  choice: അവയും ജീവനുള്ള പക്ഷിയും
  rationale: ബഹുവചന സർവനാമം മുമ്പു പറഞ്ഞ മൂന്ന് ചടങ്ങുവസ്തുക്കളെ സൂചിപ്പിക്കുന്നതും പക്ഷി അതോടൊപ്പം വേറൊരു കർമമായി ചേർക്കപ്പെടുന്നതും സംരക്ഷിക്കുന്നു.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחֻטָה
  choice: അറുത്ത പക്ഷിയുടെ രക്തത്തിൽ
  rationale: שׁחט എന്ന ചടങ്ങുസംബന്ധമായ അറുക്കൽക്രിയയുടെ പ്രത്യേകത പൊതുവായ ‘കൊന്നു’ എന്നതിനെക്കാൾ നന്നായി നിലനിർത്തുന്നു.
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: ഒഴുകുന്ന വെള്ളത്തിനുമീതെ
  rationale: ‘ജീവനുള്ള വെള്ളം’ എന്ന പദാനുപദ രൂപത്തിന്റെ സന്ദർഭാർഥമായ ഉറവുള്ളതോ ഒഴുകുന്നതോ ആയ വെള്ളത്തെ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ചടങ്ങുസംബന്ധമായ מַיִם חַיִּים എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ഒഴുകുന്ന വെള്ളം
  alternative: ജീവനുള്ള വെള്ളം; ശുദ്ധജലം
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥം ‘ജീവനുള്ള വെള്ളം’ എന്നാണെങ്കിലും ഇവിടെ നിശ്ചലമല്ലാത്ത, ഉറവുള്ളതോ ഒഴുകുന്നതോ ആയ വെള്ളമാണ് ഉദ്ദേശ്യം. പ്രധാനപാഠത്തിൽ അർഥം വ്യക്തമാക്കുകയും അടിക്കുറിപ്പിൽ യഥാർഥ രൂപവും പരിധിയും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. നീണ്ട എബ്രായവാക്യം വായനാസൗകര്യത്തിന് രണ്ട് മലയാളവാക്യങ്ങളാക്കി; കർത്താവായ പുരോഹിതനെ സന്ദർഭാനുസൃതമായി ‘അവൻ’ എന്നു നിലനിർത്തി.
