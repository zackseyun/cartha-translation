  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֶעֱמִ֞יד הַ/כֹּהֵ֣ן הַֽ/מְטַהֵ֗ר אֵ֛ת הָ/אִ֥ישׁ הַ/מִּטַּהֵ֖ר וְ/אֹתָ֑/ם לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: ml
  text: ശുദ്ധീകരണകർമം നടത്തുന്ന പുരോഹിതൻ, ശുദ്ധീകരണം പ്രാപിക്കുന്ന ആ മനുഷ്യനെയും ആ വസ്തുക്കളെയും യഹോവയുടെ സന്നിധിയിൽ, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽ ഹാജരാക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: ഹാജരാക്കണം
  rationale: עמד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെയും സാമഗ്രികളെയും യഹോവയുടെ മുമ്പിൽ ആചാരപരമായി നിർത്തുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഹാജരാക്കണം’ ഈ ഔപചാരിക അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: ശുദ്ധീകരണകർമം നിർവഹിക്കുന്ന പുരോഹിതൻ
  rationale: טהר എന്ന കൃല്ലന്തം പുരോഹിതന്റെ ആചാരപരമായ ചുമതലയെ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ ധാർമികശുദ്ധി പുരോഹിതൻ സൃഷ്ടിക്കുന്നു എന്ന സൂചന ഒഴിവാക്കി, ശുദ്ധീകരണക്രമത്തിലെ അദ്ദേഹത്തിന്റെ ഔദ്യോഗിക പങ്ക് വ്യക്തമാക്കുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: എബ്രായമൂലത്തിൽ വ്യക്തമായി പുല്ലിംഗ ഏകവചനമായ ‘മനുഷ്യൻ/പുരുഷൻ’ എന്നാണ്; അതിനാൽ ലിംഗനിഷ്പക്ഷമാക്കാതെ ‘മനുഷ്യൻ’ എന്നു നിലനിർത്തുന്നു.
- source_word: הַמִּטַּהֵר
  choice: ശുദ്ധീകരിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്ന
  rationale: ഹിത്പയേൽ രൂപം ഇവിടെ ആചാരപരമായ ശുദ്ധീകരണത്തിന് വിധേയനാകുന്ന മനുഷ്യനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ കർമണി തുടർച്ചാരൂപം ആ പ്രക്രിയാസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: וְאֹתָם
  choice: ആ വസ്തുക്കളെയും
  rationale: ബഹുവചന സർവനാമം മുൻവാക്യത്തിൽ പറഞ്ഞ സാമഗ്രികളെയാണ് സൂചിപ്പിക്കുന്നത്, ആളുകളെയല്ല. ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സൂചിത നാമം മലയാളത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധിയിലെ ആചാരപരമായ ഹാജരാകലിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്; വെളിപ്പെടുത്തപ്പെട്ട ഉടമ്പടിനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിങ്കൽ
  rationale: വിശുദ്ധമന്ദിരകൂടാരത്തിന്റെ പ്രവേശനസ്ഥാനം കൃത്യമായി സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ പ്രയോഗവുമായി പരിചിതബന്ധമുള്ള സ്വാഭാവിക പരിഭാഷ.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദിവ്യനാമം നേരിട്ട് വരുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ഉടമ്പടിനാമം മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: പുരോഹിതന്റെ ശുദ്ധീകരണപങ്കിന്റെ സ്വഭാവം
  choice: ശുദ്ധീകരണകർമം നിർവഹിക്കുന്ന
  alternative: ശുദ്ധനാക്കുന്ന
  rationale: പുരോഹിതൻ ആചാരക്രമത്തിൽ ഔദ്യോഗികമായി പ്രവർത്തിക്കുന്നു എന്നത് വ്യക്തമാക്കുകയും, മനുഷ്യന്റെ ധാർമികമോ അന്തർഗതമോ ആയ ശുദ്ധി അദ്ദേഹം സ്വയം സൃഷ്ടിക്കുന്നു എന്ന അനാവശ്യ ദൈവശാസ്ത്രനിഗമനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ആചാരപരമായ ഭാഷ. ‘ശുദ്ധീകരണം’, ‘സന്നിധി’, ‘സമാഗമകൂടാരം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
