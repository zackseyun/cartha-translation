revisions:
- from: ശുദ്ധീകരണകർമം നിർവഹിക്കുന്ന പുരോഹിതൻ, ശുദ്ധീകരിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്ന ആ മനുഷ്യനെയും ആ വസ്തുക്കളെയും യഹോവയുടെ സന്നിധിയിൽ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിങ്കൽ ഹാജരാക്കണം.
