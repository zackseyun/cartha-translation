lexical_decisions:
- source_word: וְלָקַח
  choice: പിന്നെ അവൻ ... എടുത്ത്
  rationale: ചടങ്ങിനുള്ള നിർദേശങ്ങളുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന വാവോടുകൂടിയ ഖാൽ പെർഫെക്റ്റിനെ സ്വാഭാവികമായ മലയാള ക്രമവാക്യമായി അവതരിപ്പിക്കുന്നു; അവസാനത്തെ ‘തളിക്കണം’ നിർദേശഭാവം വ്യക്തമാക്കുന്നു.
- source_word: עֵץ הָאֶרֶז
  choice: ദേവദാരുമരക്കഷണം
  rationale: ചടങ്ങിൽ ഉപയോഗിക്കുന്ന ദേവദാരുമരത്തിന്റെ ഒരു കഷണമെന്ന അർഥം സാധാരണ വായനക്കാരന് വ്യക്തമായി നൽകുന്നു.
- source_word: הָאֵזֹב
  choice: ഈസോപ്പ്
  rationale: സസ്യനാമമായ אֵזוֹב എന്നതിന്റെ പതിവായ ലിപ്യന്തരണം നിലനിർത്തുന്നു; സസ്യത്തെ കൂടുതൽ കൃത്യമായി തിരിച്ചറിയുന്നതിലെ അനിശ്ചിതത്വം പരിഭാഷയിൽ മറച്ചുവയ്ക്കുന്നില്ല.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: കടുംചുവപ്പുനൂൽ[a]
  rationale: കടുംചുവപ്പിൽ ചായംതേച്ച നൂൽ എന്ന പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥം നൽകുന്നു; എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: ജീവനുള്ള പക്ഷി
  rationale: അറുക്കപ്പെട്ട പക്ഷിയിൽനിന്ന് ഇതിനെ വ്യക്തമായി വേർതിരിക്കുന്ന חַיָּה എന്ന വിശേഷണം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְטָבַל אֹתָם
  choice: അവയെ മുക്കി
  rationale: טבל എന്നതിന്റെ മുക്കുക/ആഴ്ത്തുക എന്ന ചടങ്ങുസംബന്ധിയായ അർഥം സ്വാഭാവികമായി നൽകുകയും ബഹുവചന പ്രത്യയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: അറുത്ത പക്ഷിയുടെ രക്തത്തിൽ
  rationale: שׁחט എന്ന ചടങ്ങുസംബന്ധിയായ അറുക്കൽ എന്ന ഭാവം വെറും ‘കൊന്ന’ എന്നതിനെക്കാൾ കൃത്യമായി നൽകുന്നു.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: ഉറവജലത്തിൽ[b]
  rationale: ‘ജീവനുള്ള വെള്ളം’ എന്ന എബ്രായ പ്രയോഗം കെട്ടിക്കിടക്കാത്ത, പുതുതായുള്ള ഉറവിലെയോ ഒഴുക്കിലെയോ ജലത്തെ സൂചിപ്പിക്കുന്നു. ‘ഉറവജലം’ ഈ ചടങ്ങുസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; അക്ഷരാർഥവും മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: വീടിന്മേൽ ... തളിക്കണം
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള נזה ചടങ്ങുപരമായ തളിക്കൽ സൂചിപ്പിക്കുന്നു. אֶל എന്നതിന്റെ ദിശാഭാവം മലയാളത്തിൽ ‘വീടിന്മേൽ’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: സംഖ്യയും ആവർത്തനവും നേരിട്ട്, വ്യക്തമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ചടങ്ങുനിയമത്തിലെ מַיִם חַיִּים എന്ന പ്രയോഗം
  choice: ഉറവജലം
  alternative: ജീവജലം; ഒഴുകുന്ന വെള്ളം; ശുദ്ധജലം
  rationale: അക്ഷരാർഥമായ ‘ജീവജലം’ പിന്നീട് രൂപപ്പെട്ട ദൈവശാസ്ത്രപരമായ അർഥബന്ധങ്ങൾ അനാവശ്യമായി മുൻനിരയിൽ കൊണ്ടുവരാം. ഇവിടെ ഉറവിലെയോ ഒഴുക്കിലെയോ പുതുജലമാണ് ഉദ്ദേശ്യം; ‘ഉറവജലം’ സന്ദർഭത്തിന് യോജിക്കുന്നു, എന്നാൽ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ചടങ്ങുനിയമ ശൈലി. വാക്യത്തിലെ ഘടകങ്ങളുടെ എബ്രായ ക്രമം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക നിർദേശഘടനയ്ക്കായി മുഖ്യക്രിയ അവസാനം വച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
