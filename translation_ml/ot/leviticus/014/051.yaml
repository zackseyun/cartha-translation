  text: പിന്നെ അവൻ ദേവദാരുമരക്കഷണവും ഈസോപ്പും കടുംചുവപ്പുനൂലും[a] ജീവനുള്ള പക്ഷിയും എടുത്ത്, അറുത്ത പക്ഷിയുടെ രക്തത്തിലും ഒഴുകുന്ന വെള്ളത്തിലും[b] അവയെ മുക്കി, വീടിന്മേൽ ഏഴു പ്രാവശ്യം തളിക്കണം.
