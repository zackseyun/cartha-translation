id: LEV.14.34
reference: Leviticus 14:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י תָבֹ֨אוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָ/כֶ֖ם לַ/אֲחֻזָּ֑ה וְ/נָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּ/בֵ֖ית אֶ֥רֶץ אֲחֻזַּתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: ml
  text: ഞാൻ നിങ്ങൾക്ക് അവകാശമായി നൽകുന്ന കനാൻദേശത്തേക്കു നിങ്ങൾ പ്രവേശിക്കുകയും നിങ്ങളുടെ അവകാശഭൂമിയിലെ ഒരു വീട്ടിൽ ഞാൻ ത്സാരാഅത്ത് ബാധ[a] വരുത്തുകയും ചെയ്യുമ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ത്സാരാഅത്ത്’ എന്ന എബ്രായപദം ആധുനിക അർഥത്തിലുള്ള കുഷ്ഠരോഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല. മനുഷ്യരിലും വസ്ത്രങ്ങളിലും വീടുകളിലും കാണുന്ന വിവിധ ബാധകളെയോ മലിനീകരണലക്ഷണങ്ങളെയോ ഇതിൽ ഉൾപ്പെടുത്തുന്നു.
    reason: צָרַעַת എന്ന പദത്തിന്റെ വിശാലമായ അർഥപരിധി വ്യക്തമാക്കാനും വീടിനെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘കുഷ്ഠം’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാനും.
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: നിങ്ങൾ പ്രവേശിക്കുമ്പോൾ
  rationale: כִּי ഇവിടെ ഭാവിയിലെ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന കാലവാക്യം ആരംഭിക്കുന്നു; നിയമസന്ദർഭത്തിൽ ‘പ്രവേശിക്കുമ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: אֶרֶץ כְּנַעַן
  choice: കനാൻദേശം
  rationale: ഭൂപ്രദേശനാമം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: ഞാൻ നിങ്ങൾക്ക് നൽകുന്ന
  rationale: നֹתֵן എന്ന കൃദന്തരൂപത്തിലെ പുരോഗമിക്കുന്നതോ ആസന്നമായതോ ആയ ദൈവിക പ്രവൃത്തി നിലനിർത്തുന്നു.
- source_word: לַאֲחֻזָּה
  choice: അവകാശമായി
  rationale: אֲחֻזָּה ഭൂമിയിലുള്ള സ്ഥിരമായ കൈവശാവകാശത്തെയോ സ്വത്തവകാശത്തെയോ സൂചിപ്പിക്കുന്നു; ‘അവകാശമായി’ മലയാള ബൈബിൾഭാഷയിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְנָתַתִּי
  choice: ഞാൻ … വരുത്തുകയും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഞാൻ നൽകുകയും/വെക്കുകയും’ എന്നാണെങ്കിലും ഒരു വീട്ടിൽ ബാധ ഉണ്ടാക്കുന്ന പ്രവൃത്തിക്ക് ‘വരുത്തുക’ സ്വാഭാവികമാണ്; ഒന്നാംപുരുഷ ദൈവിക പ്രവർത്തനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: נֶגַע צָרַעַת
  choice: സാരാത്ത് ബാധ
  rationale: צָרַעַת മനുഷ്യശരീരത്തിനു പുറമേ വസ്ത്രങ്ങളെയും വീടുകളെയും സംബന്ധിക്കുന്നതിനാൽ ‘കുഷ്ഠം’ അല്ലെങ്കിൽ ‘ത്വഗ്രോഗം’ എന്നു മാത്രം പറയുന്നത് തെറ്റിദ്ധരിപ്പിക്കും. മൂലപദം ലിപ്യന്തരണം ചെയ്ത് ‘ബാധ’യോടു ചേർക്കുകയും അടിക്കുറിപ്പിൽ അർഥപരിധി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּבֵית
  choice: ഒരു വീട്ടിൽ
  rationale: בְּ എന്ന സ്ഥാനസൂചക ഉപസർഗത്തിനും അനിശ്ചിതമായ בֵית എന്ന നാമത്തിനും സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: നിങ്ങളുടെ അവകാശദേശത്തിലെ
  rationale: മുമ്പുള്ള אֲחֻזָּהയുമായുള്ള പദബന്ധം ‘അവകാശം’ ആവർത്തിച്ച് നിലനിർത്തുന്നു; ഭൂമിയുടെ ഉടമ്പടിപരമായ കൈവശസ്വഭാവവും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: വീട്ടിലെ ബാധയിൽ ദൈവത്തിന്റെ പ്രവർത്തനം
  choice: ‘ഞാൻ … സാരാത്ത് ബാധ വരുത്തുകയും’ എന്ന് ഒന്നാംപുരുഷ ദൈവിക പ്രവർത്തനം തുറന്നുവെച്ചു.
  alternative: ‘ഒരു ബാധ പ്രത്യക്ഷപ്പെടുമ്പോൾ’ എന്ന ദൈവിക പ്രവർത്തനം മറയ്ക്കുന്ന നിർവ്യക്ത പ്രയോഗം.
  rationale: וְנָתַתִּי എന്ന എബ്രായരൂപം സംഭവം ദൈവത്തിന്റെ പ്രവൃത്തിയായി വ്യക്തമായി അവതരിപ്പിക്കുന്നു. അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്താതെ നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. സാങ്കേതികവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമായ രോഗനാമത്തിനു പകരം മൂലപദത്തിന്റെ ലിപ്യന്തരണവും വിശദീകരണ അടിക്കുറിപ്പും ഉപയോഗിച്ചു.
