  terminology: צָרַעַת-നെ ആധുനിക കുഷ്ഠരോഗവുമായി തുല്യമാക്കാതിരിക്കാൻ ലിപ്യന്തരണവും അടിക്കുറിപ്പും സ്വീകരിക്കുന്നത് സുരക്ഷിതമാണ്. അതിന്റെ കൂടുതൽ കൃത്യമായ മലയാള ലിപ്യന്തരണം ‘ത്സാരാഅത്ത്’ ആണ്. נֶגַע-നായി ‘ബാധ’ യോജിക്കുന്നു.
