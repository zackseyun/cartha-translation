id: LEV.14.10
reference: Leviticus 14:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: ml
  text: എട്ടാം ദിവസം അവൻ ഊനമില്ലാത്ത രണ്ട് ആൺകുഞ്ഞാടുകളെയും, ഒരു വയസ്സുള്ള ഊനമില്ലാത്ത ഒരു പെൺകുഞ്ഞാടിനെയും, എണ്ണയിൽ കലക്കിയ ധാന്യയാഗത്തിനുള്ള നേർത്ത മാവിന്റെ ഏഫയുടെ പത്തിലൊന്നു വീതമുള്ള മൂന്ന് അളവുകളും, ഒരു ലോഗ്[a] എണ്ണയും എടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലോഗ്’ ഇസ്രായേലിലെ ആചാരാനുഷ്ഠാനങ്ങളിൽ ഉപയോഗിച്ചിരുന്ന ഒരു ചെറിയ ദ്രവയളവാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: എട്ടാം ദിവസം
  rationale: നിയമനിർദേശങ്ങളുടെ തുടർച്ച സന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ, മലയാളത്തിൽ അസ്വാഭാവികമായ ബന്ധകപദം ചേർക്കാതെ കാലസൂചന നേരിട്ട് നൽകി.
- source_word: יִקַּח
  choice: എടുക്കണം
  rationale: നിയമഭാഗത്തിലെ നിർദേശാത്മക അപൂർണക്രിയയുടെ ബാധ്യതയും ആധുനിക മലയാളത്തിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: שְׁנֵי כְבָשִׂים
  choice: രണ്ട് ആൺകുഞ്ഞാടുകൾ
  rationale: തുടർന്നുള്ള സ്ത്രീലിംഗരൂപമായ כַבְשָׂהയോടുള്ള വ്യത്യാസം വ്യക്തമാക്കാൻ മൃഗങ്ങളുടെ ആൺലിംഗം തുറന്നുപറഞ്ഞു.
- source_word: תְּמִימִים / תְּמִימָה
  choice: ഊനമില്ലാത്ത
  rationale: ബലിയർപ്പണസന്ദർഭത്തിൽ ശാരീരിക ദോഷമോ വൈകല്യമോ ഇല്ലാത്ത മൃഗം എന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ
  choice: ഒരു വയസ്സുള്ള ഒരു പെൺകുഞ്ഞാട്
  rationale: മൂലത്തിലെ സ്ത്രീലിംഗവും പ്രായനിബന്ധനയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ഏഫയുടെ പത്തിൽ മൂന്ന് അളവ്
  rationale: עִשָּׂרוֹן എന്ന പത്തിലൊന്ന് അളവിനെ അതിന്റെ പതിവായ ഏഫാ-അടിസ്ഥാനത്തിൽ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം അവതരിപ്പിക്കുന്നു.
- source_word: סֹלֶת מִנְחָה בְּלוּלָה בַשֶּׁמֶן
  choice: ധാന്യയാഗമായി എണ്ണ ചേർത്ത ... നേർത്ത മാവ്
  rationale: സൂക്ഷ്മമായി അരച്ച മാവ്, അതിന്റെ യാഗപരമായ ഉപയോഗം, എണ്ണയുമായുള്ള കലർത്തൽ എന്നിവയെ ഒരൊറ്റ സ്വാഭാവിക മലയാളഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: ഒരു ലോഗ് എണ്ണ
  rationale: കൃത്യമായ ആധുനിക മലയാളസമമില്ലാത്ത പ്രത്യേക ഇസ്രായേല്യ ദ്രവയളവ് ലിപ്യന്തരണം ചെയ്ത്, വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ലേവ്യപുസ്തകത്തിലെ ആചാരനിയമങ്ങൾക്ക് യോജിച്ച മാന്യവും കൃത്യവുമായ ശൈലി. അടിക്കുറിപ്പ് സൂചകം അത് വിശദീകരിക്കുന്ന ‘ലോഗ്’ എന്ന പദത്തിനോടു ചേർത്തിരിക്കുന്നു.
