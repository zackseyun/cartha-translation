translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമസംഗ്രഹ ശൈലി. സാങ്കേതികമായി അനിശ്ചിതമായ രോഗനാമത്തിന്റെ പരിധി മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
