  language: ml
  text: ഇത് കുഷ്ഠബാധയുടെ ഓരോ കേസിനും ചൊറിച്ചിൽബാധയ്ക്കും[a] ഉള്ള നിയമമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശൽക്കബാധയ്ക്ക്.’ എബ്രായപദം ശിരസ്സിലോ താടിയിലോ പ്രത്യേകിച്ച് കാണപ്പെടുന്ന ഒരു ചർമ്മാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ ആധുനിക വൈദ്യസമാനത അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: ഇത് ... ഉള്ള നിയമമാണ്
  rationale: സംഗ്രഹവാക്യമായി വരുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ വിധിവാക്യമായി നൽകി; תּוֹרָה ഇവിടെ പരിശോധനയും നടപടിക്രമവും സംബന്ധിച്ച നിയമത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לְכָל נֶגַע הַצָּרַעַת
  choice: എല്ലാത്തരം കുഷ്ഠബാധകൾക്കും
  rationale: נֶגַע എന്നത് ഇവിടെ പരിശോധനയ്ക്കു വിധേയമായ ഓരോ ബാധയെയോ കേസിനെയോ സൂചിപ്പിക്കുന്നു. צָרַעַת ആധുനിക ഹാൻസൻ രോഗത്തോട് കൃത്യമായി തുല്യമല്ലെങ്കിലും, ലേവ്യപുസ്തകത്തിലെ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ വർഗനാമമായി ‘കുഷ്ഠബാധ’ നിലനിർത്തി; ‘എല്ലാത്തരം’ എന്നത് לְכָל എന്ന വ്യാപ്തി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְלַנָּתֶק
  choice: ശിരസ്സിലോ താടിയിലോ ഉണ്ടാകുന്ന ചൊറിച്ചിൽബാധയ്ക്കും
  rationale: נֶתֶק ലേവ്യപുസ്തകം 13-ൽ ശിരസ്സിലോ താടിയിലോ കാണപ്പെടുന്ന പ്രത്യേക ചർമ്മാവസ്ഥയാണ്. കൃത്യമായ ആധുനിക വൈദ്യസമാനത അനിശ്ചിതമായതിനാൽ സ്ഥാനം വ്യക്തമാക്കുന്ന വായനാസൗഹൃദ പദപ്രയോഗം ഉപയോഗിച്ചു.
