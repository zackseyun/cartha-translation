id: LEV.14.9
reference: Leviticus 14:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: ml
  text: ഏഴാം ദിവസം അവൻ തന്റെ മുടി മുഴുവനും ക്ഷൗരം ചെയ്യണം—തലയിലെ മുടിയും താടിയും പുരികങ്ങളും; തന്റെ മുടി മുഴുവനും അവൻ ക്ഷൗരം ചെയ്യണം. പിന്നെ അവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകുകയും തന്റെ ശരീരം വെള്ളത്തിൽ കഴുകുകയും വേണം; അപ്പോൾ അവൻ ശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: അനുഷ്ഠാനക്രമത്തിലെ അടുത്ത ഘട്ടം സ്വാഭാവികമായ മലയാള കാലപ്രയോഗത്തിലൂടെ അവതരിപ്പിക്കുന്നു; ഹീബ്രു വാക്യരീതിയിലെ ക്രമാനുഗത ഭാവം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: יְגַלַּח / יְגַלֵּחַ
  choice: ക്ഷൗരം ചെയ്യണം
  rationale: പീലിൽ രൂപം ഇവിടെ രോമം പൂർണമായി നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ക്ഷൗരം ചെയ്യുക’ മാന്യവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ അനുഷ്ഠാനസന്ദർഭോചിത പ്രയോഗമാണ്.
- source_word: כָּל שְׂעָרוֹ
  choice: തന്റെ മുടി മുഴുവനും
  rationale: ശരീരത്തിലെ രോമം സമഗ്രമായി നീക്കണമെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പിന്നാലെയുള്ള ആവർത്തനവും ഊന്നലിനായി നിലനിർത്തുന്നു.
- source_word: רֹאשׁוֹ
  choice: തലയിലെ മുടി
  rationale: അക്ഷരാർഥമായ ‘തല’യെക്കാൾ ക്ഷൗരം ചെയ്യപ്പെടുന്നത് തലയിലെ മുടിയാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: זְקָנוֹ
  choice: താടി
  rationale: זָקָן എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ സാധാരണ അർഥം.
- source_word: גַּבֹּת עֵינָיו
  choice: പുരികങ്ങൾ
  rationale: ഹീബ്രുവിലെ ‘കണ്ണുകളുടെ മേൽവരമ്പുകൾ’ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: വസ്ത്രങ്ങൾ കഴുകുകയും
  rationale: כבס വസ്ത്രം കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ലളിതവും ആധുനികവുമായ മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  choice: ശരീരം വെള്ളത്തിൽ കുളിപ്പിക്കുകയും
  rationale: בשר അക്ഷരാർഥത്തിൽ ‘മാംസം’ ആണെങ്കിലും ഈ ശുദ്ധീകരണസന്ദർഭത്തിൽ വ്യക്തിയുടെ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വെള്ളത്തിൽ’ എന്ന ഹീബ്രു പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: וְטָהֵר
  choice: അപ്പോൾ അവൻ ശുദ്ധനായിരിക്കും
  rationale: പ്രവൃത്തികൾക്കു ശേഷമുള്ള അനുഷ്ഠാനപരമായ ശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ധാർമിക കുറ്റമില്ലായ്മ എന്ന ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: അനുഷ്ഠാനപരമായ ശുദ്ധിയുടെ പദപ്രയോഗം
  choice: ശുദ്ധനായിരിക്കും
  alternative: ശുദ്ധീകരിക്കപ്പെടും
  rationale: ഹീബ്രു ക്രിയ ഇവിടെ പ്രക്രിയയെക്കാൾ ലഭിക്കുന്ന ശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ലേവ്യപുസ്തകത്തിലെ അനുഷ്ഠാനപരമായ വിഭാഗം സംരക്ഷിച്ചുകൊണ്ട് ധാർമിക നിർദോഷത്വം ഇറക്കുമതി ചെയ്യാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും അനുഷ്ഠാനനിയമത്തിന്റെ ഗൗരവത്തിനു യോജിച്ചതുമായ ഭാഷ. ഹീബ്രുവിലെ ‘മുടി മുഴുവനും ക്ഷൗരം ചെയ്യണം’ എന്ന ആവർത്തനം സമഗ്രതയുടെ ഊന്നൽ സംരക്ഷിക്കാൻ നിലനിർത്തി.
