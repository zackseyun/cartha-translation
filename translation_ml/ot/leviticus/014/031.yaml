source:
  edition: WLC
  text: אֵ֣ת אֲשֶׁר תַּשִּׂ֞יג יָד֗/וֹ אֶת הָ/אֶחָ֥ד חַטָּ֛את וְ/אֶת הָ/אֶחָ֥ד עֹלָ֖ה עַל הַ/מִּנְחָ֑ה וְ/כִפֶּ֧ר הַ/כֹּהֵ֛ן עַ֥ל הַ/מִּטַּהֵ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: ml
  text: അവന്റെ സാമ്പത്തികശേഷിക്കു താങ്ങാവുന്നത്ര, ഒന്നിനെ പാപയാഗമായും[b] മറ്റൊന്നിനെ ഹോമയാഗമായും ധാന്യയാഗത്തോടൊപ്പം അർപ്പിക്കണം. ഇങ്ങനെ പുരോഹിതൻ ശുദ്ധീകരണം പ്രാപിക്കുന്നവനുവേണ്ടി യഹോവയുടെ സന്നിധിയിൽ പ്രായശ്ചിത്തം ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, ‘ശുദ്ധീകരണയാഗം.’
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: തന്റെ കഴിവിനു താങ്ങാവുന്നവയിൽ
  rationale: ‘അവന്റെ കൈ എത്തുന്നത്’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം ഒരാളുടെ സാമ്പത്തികശേഷിക്കുള്ളിൽ ലഭ്യമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി അതേ ആശയം നൽകുന്നു.
- source_word: חַטָּאת
  choice: പാപയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസന്ദർഭത്തിൽ ഇത് പാപവും ആചാരപരമായ ശുദ്ധീകരണവും സംബന്ധിച്ച യാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവുപദമാണ്. പരിചിതമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി ‘ശുദ്ധീകരണയാഗം’ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: തീയിൽ പൂർണമായി ദഹിപ്പിച്ച് പുക ഉയരുന്ന യാഗത്തിനുള്ള സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: עַל הַמִּנְחָה
  choice: ധാന്യയാഗത്തോടൊപ്പം
  rationale: ഇവിടെ עַל സ്ഥലം സൂചിപ്പിക്കുന്ന ‘മേൽ’ എന്നതിലുപരി യാഗത്തോടുള്ള അനുബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: וְכִפֶּר
  choice: പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ כפר എന്ന ക്രിയയുടെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ ശക്തി നിലനിർത്തുന്നു; പ്രായശ്ചിത്തത്തിന്റെ രീതി സംബന്ധിച്ച ഒരു പ്രത്യേക സിദ്ധാന്തം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: הַמִּטַּהֵר
  choice: ശുദ്ധീകരണം പ്രാപിക്കുന്നവൻ
  rationale: ശുദ്ധീകരണപ്രക്രിയയിലൂടെ കടന്നുപോകുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയുടെ തുടർച്ചാഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥവും ദൈവനാമവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
theological_decisions:
- issue: യാഗസംബന്ധമായ പദങ്ങൾ വിവർത്തനം ചെയ്യുമ്പോൾ പ്രായശ്ചിത്തത്തിന്റെ അർഥം അതിരുകടന്ന് നിർണയിക്കൽ
  choice: ‘പാപയാഗം,’ ‘ഹോമയാഗം,’ ‘പ്രായശ്ചിത്തം ചെയ്യണം’ എന്നീ പരമ്പരാഗത ആചാരപദങ്ങൾ ഉപയോഗിച്ചു
  alternative: ‘ശുദ്ധീകരണയാഗം,’ ‘ശുദ്ധീകരിക്കണം’
  rationale: എബ്രായ പാഠത്തിലെ യാഗപരവും പ്രായശ്ചിത്തപരവുമായ ഭാഷ നിലനിർത്തുന്നു; എന്നാൽ ഈ വാക്യം പറയുന്നതിലപ്പുറം ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: חַטָּאת എന്ന പദത്തിലെ പാപയാഗം/ശുദ്ധീകരണയാഗം എന്ന അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘പാപയാഗം’; അടിക്കുറിപ്പിൽ ‘ശുദ്ധീകരണയാഗം’
  alternative: മുഖ്യപാഠത്തിൽ ‘ശുദ്ധീകരണയാഗം’
  rationale: പരിചിതമായ യാഗനാമം നിലനിർത്തിക്കൊണ്ട് ആചാരപരമായ ശുദ്ധീകരണത്തെ മുൻനിർത്തുന്ന സാധുവായ വായനയും മറച്ചുവയ്ക്കാതെ നൽകുന്നു.
- issue: ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: יהוה എന്ന വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. മുൻവാക്യത്തിൽ ആരംഭിച്ച യാഗനിർദേശത്തിന്റെ തുടർച്ചയാണെന്ന സ്വഭാവം നിലനിർത്താൻ ആദ്യഭാഗം ‘തന്റെ കഴിവിനു താങ്ങാവുന്നവയിൽ’ എന്നു രൂപപ്പെടുത്തി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ [b] ധാന്യയാഗത്തിനു ശേഷം പ്രത്യക്ഷപ്പെട്ടിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം חַטָּאת എന്ന പദത്തിന്റെ പര്യായവായനയായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ [b] ‘പാപയാഗം’ എന്നതിനോടു ചേർത്തു.
