reference: Leviticus 14:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִזָּ֗ה עַ֧ל הַ/מִּטַּהֵ֛ר מִן הַ/צָּרַ֖עַת שֶׁ֣בַע פְּעָמִ֑ים וְ/טִ֣הֲר֔/וֹ וְ/שִׁלַּ֛ח אֶת הַ/צִּפֹּ֥ר הַֽ/חַיָּ֖ה עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: ml
  text: ത്വഗ്രോഗത്തിൽനിന്ന് ശുദ്ധീകരണം പ്രാപിക്കുന്നയാളുടെമേൽ അവൻ അത് ഏഴു പ്രാവശ്യം തളിക്കണം[a]; അയാളെ ശുദ്ധനെന്ന് പ്രഖ്യാപിക്കണം[b]; ജീവനുള്ള പക്ഷിയെ തുറസ്സായ വയലിലേക്കു വിട്ടയക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി, ‘കുഷ്ഠരോഗം.’ ലേവ്യപുസ്തകത്തിൽ ഉപയോഗിക്കുന്ന ഹീബ്രു പദം ആധുനിക കുഷ്ഠരോഗം മാത്രമല്ല, വിവിധ ത്വക്കുസംബന്ധമായ അവസ്ഥകളെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അയാളെ ശുദ്ധനായി വിധിക്കണം.’ ഇവിടെ പുരോഹിതന്റെ നടപടി വെറും വൈദ്യപരമായ നടപടിയല്ല; ആചാരപരവും വിധിനിർണയപരവുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: അവൻ അത് ... തളിക്കണം
  rationale: നזה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ആചാരപരമായ സന്ദർഭത്തിൽ ദ്രാവകം തളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിൽ ഈ വാക്യത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻസന്ദർഭത്തിലെ മിശ്രിതമാണ് ഉദ്ദേശിക്കുന്നത്; സ്വാഭാവിക മലയാളത്തിനായി ‘അത്’ ചേർത്തു.
- source_word: הַמִּטַּהֵר
  choice: ശുദ്ധീകരിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നയാൾ
  rationale: טהר എന്ന ധാതുവിന്റെ ഹിത്പയേൽ വർത്തമാനകൃദന്തരൂപം ശുദ്ധീകരണപ്രക്രിയയ്ക്ക് വിധേയനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; പൂർത്തിയായ അവസ്ഥയെന്നതിലുപരി നടന്നുകൊണ്ടിരിക്കുന്ന ആചാരപ്രക്രിയ നിലനിർത്തുന്നു.
- source_word: מִן הַצָּרַעַת
  choice: ത്വഗ്രോഗത്തിൽനിന്ന്
  rationale: ലേവ്യപുസ്തകത്തിലെ צָרַעַת ആധുനിക ഹാൻസൻസ് രോഗത്തോട് മാത്രം തുല്യമല്ല; വിവിധ ചർമസംബന്ധമായ അവസ്ഥകളെ ഉൾക്കൊള്ളുന്ന വിശാലമായ ആചാരാശുദ്ധി വിഭാഗമാണിത്. ‘ത്വഗ്രോഗം’ തെറ്റായ വൈദ്യശാസ്ത്രപരമായ നിർദ്ദിഷ്ടത ഒഴിവാക്കുന്നു.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: സംഖ്യയും ആവർത്തനവും നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְטִהֲרוֹ
  choice: അയാളെ ശുദ്ധനെന്ന് പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിത-നിയമപരമായ സന്ദർഭത്തിൽ ഈ രൂപം ഒരാളെ ആചാരപരമായി ശുദ്ധനായി വിധിക്കുകയോ പ്രഖ്യാപിക്കുകയോ ചെയ്യുന്നതാണ്; ശരീരസൗഖ്യം വരുത്തുക എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: וְשִׁלַּח
  choice: പറത്തിവിടണം
  rationale: שׁלח അയയ്ക്കുക അഥവാ വിട്ടയയ്ക്കുക എന്നാണ്. ജീവനുള്ള പക്ഷിയെ മോചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘പറത്തിവിടണം’ മലയാളത്തിൽ സ്വാഭാവികവും ദൃശ്യവുമായ പ്രയോഗമാണ്.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: ജീവനുള്ള പക്ഷി
  rationale: മുൻവാക്യത്തിൽ അറുക്കപ്പെട്ട പക്ഷിയിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്ന വിശേഷണം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: തുറസ്സായ വയലിലേക്ക്
  rationale: പദശഃ ‘വയലിന്റെ മുഖത്തിനുമീതെ’ എന്ന സ്ഥലചിത്രം തുറന്ന പ്രദേശത്തേക്കുള്ള വിടുതലിനെ സൂചിപ്പിക്കുന്നു. ലക്ഷ്യദിശ മലയാളത്തിൽ സ്വാഭാവികമായി ‘വയലിലേക്ക്’ എന്നു നൽകി; ‘തുറസ്സായ’ തുറന്ന വിസ്തൃതിയുടെ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: צָרַעַת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ത്വഗ്രോഗം
  alternative: കുഷ്ഠരോഗം
  rationale: ഈ ലേവ്യപദം ആധുനിക കുഷ്ഠരോഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല. അതിനാൽ കാലവിരുദ്ധമായ വൈദ്യശാസ്ത്രപരമായ തിരിച്ചറിവ് ഒഴിവാക്കി വിശാലമായ ചർമസംബന്ധ അർഥം സ്വീകരിച്ചു.
- issue: וְטִהֲרוֹ എന്ന പുരോഹിതക്രിയയുടെ സ്വഭാവം
  choice: ശുദ്ധനെന്ന് പ്രഖ്യാപിക്കണം
  alternative: ശുദ്ധീകരിക്കണം
  rationale: ഇവിടെ പുരോഹിതന്റെ നടപടി വൈദ്യചികിത്സയെന്നതിലുപരി ആചാരപരവും വിധിനിർണയപരവുമാണ്. ‘പ്രഖ്യാപിക്കുക’ അതിനെ വ്യക്തമാക്കുമ്പോഴും ശുദ്ധതയുടെ ദൈവശാസ്ത്രപരമായ യാഥാർഥ്യം നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ള ആചാര-നിയമഭാഷ ഉപയോഗിച്ചു. ‘ത്വഗ്രോഗം’ എന്നത് കുഷ്ഠരോഗമെന്ന അതിനിർദ്ദിഷ്ട പരമ്പരാഗത ധാരണ ഒഴിവാക്കുന്നു. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പ് ‘പ്രഖ്യാപിക്കുക’ എന്നതിന്റെ ആചാര-വിധിനിർണയ ഭാവം വിശദീകരിക്കുന്നു.
