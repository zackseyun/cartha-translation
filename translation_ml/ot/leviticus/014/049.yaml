source:
  edition: WLC
  text: וְ/לָקַ֛ח לְ/חַטֵּ֥א אֶת הַ/בַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: ml
  text: വീടിനെ ശുദ്ധീകരിക്കാൻ[a] അവൻ രണ്ടു പക്ഷികളെയും ദേവദാരുമരക്കഷണവും കടുംചുവപ്പുനൂലും[b] ഈസോപ്പും എടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വീടിന്റെ അശുദ്ധി നീക്കാൻ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ ആചാരപരമായി ശുദ്ധീകരിക്കുക എന്ന അർഥത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കടുംചുവപ്പുനൂൽച്ചരട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: അവൻ ... എടുക്കണം
  rationale: ചടങ്ങുസംബന്ധമായ നിർദേശങ്ങളുടെ ക്രമത്തിൽ ഈ ക്രിയാരൂപം ബാധ്യതയെയോ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘എടുക്കണം’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: വീടിനെ ശുദ്ധീകരിക്കാൻ
  rationale: പീയേൽ രൂപത്തിലുള്ള חטא ഇവിടെ ധാർമിക ക്ഷമയെയല്ല, ആചാരപരമായ അശുദ്ധി നീക്കിയുള്ള ശുദ്ധീകരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മൂലപാഠത്തിൽ പ്രത്യേകം ഇല്ലാത്ത ‘പാപത്തിൽനിന്ന്’ എന്ന ആശയം മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: രണ്ടു പക്ഷികളെ
  rationale: ഈ വാക്യത്തിൽ പറഞ്ഞിരിക്കുന്നത് ‘രണ്ടു പക്ഷികൾ’ എന്നു മാത്രമാണ്; സമീപസന്ദർഭത്തിൽ കാണുന്ന ‘ജീവനുള്ള’ എന്ന വിശേഷണം ഇവിടെ കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: וְעֵץ אֶרֶז
  choice: ദേവദാരുമരക്കഷണം
  rationale: ചടങ്ങിൽ ഉപയോഗിക്കുന്ന ദേവദാരുമരത്തിൽനിന്നുള്ള ഒരു വസ്തുവിനെ സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וּשְׁנִי תוֹלַעַת
  choice: കടുംചുവപ്പുനൂൽ
  rationale: ചടങ്ങിൽ ഉപയോഗിക്കുന്ന കടുംചുവപ്പുനിറം നൽകിയ നൂൽവസ്തുവിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘നൂൽച്ചരട്’ എന്നതും സാധ്യമാണ്.
- source_word: וְאֵזֹב
  choice: ഈസോപ്പ്
  rationale: സസ്യത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമായിരുന്നാലും, אֵזוֹב എന്നതിനുള്ള പരമ്പരാഗതവും പൊതുവേ തിരിച്ചറിയപ്പെടുന്നതുമായ പേരാണ് ‘ഈസോപ്പ്’.
theological_decisions:
- issue: വീടിനെ കർമമായി എടുത്തുള്ള לְחַטֵּא എന്ന ക്രിയയുടെ ആചാരപരമായ അർഥം
  choice: വീടിനെ ശുദ്ധീകരിക്കാൻ
  alternative: വീടിന്റെ പാപം നീക്കി ശുദ്ധീകരിക്കാൻ; വീടിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാൻ
  rationale: ഈ ഭാഗം ബാധിക്കപ്പെട്ട ഒരു ഭൗതിക വീടിന്റെ ശുദ്ധീകരണച്ചടങ്ങിനെക്കുറിച്ചാണ്. അതിനാൽ ധാർമിക കുറ്റമോ പ്രായശ്ചിത്തത്തിന്റെ പൂർണ ദൈവശാസ്ത്രപരമായ ആശയമോ വാക്യത്തിൽ കുത്തിച്ചേർക്കാതെ, ആചാരപരമായ ശുദ്ധീകരണം എന്ന അർഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും വിശുദ്ധഗ്രന്ഥത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. പട്ടികയുടെ സ്വാഭാവികതയ്ക്കായി വിഭക്തിപ്രത്യയം അവസാന ഇനത്തിൽ പൂർണമായി പ്രകടിപ്പിക്കുകയും മുൻ ഇനങ്ങളിൽ ഏകോപിതരൂപം ഉപയോഗിക്കുകയും ചെയ്തു.
