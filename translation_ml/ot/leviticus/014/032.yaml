  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֔ת אֲשֶׁר בּ֖/וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא תַשִּׂ֥יג יָד֖/וֹ בְּ/טָהֳרָתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: ml
  text: ചർമരോഗബാധ[a] ഉള്ളവനും തന്റെ ശുദ്ധീകരണത്തിന് ആവശ്യമായതു നൽകാൻ സാമ്പത്തികശേഷിയില്ലാത്തവനുമായ ഒരാൾക്കുള്ള നിയമം ഇതാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ צָרָעַת എന്ന പദം പരമ്പരാഗതമായി ‘കുഷ്ഠരോഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ടെങ്കിലും, ലേവ്യപുസ്തകത്തിൽ അത് വിവിധ ചർമാവസ്ഥകളെയും അവയോടു ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധിയെയും വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘തന്റെ ശുദ്ധീകരണത്തിൽ അവന്റെ കൈ എത്തുന്നില്ല.’ ശുദ്ധീകരണത്തിനുള്ള വഴിപാടുകൾ നൽകാൻ മതിയായ സാമ്പത്തികശേഷിയില്ലെന്നർഥമുള്ള എബ്രായ ശൈലിയാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: നിയമം
  rationale: പുരോഹിതനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ תּוֹרָה നിർദേശിക്കപ്പെട്ട നിയമക്രമത്തെ സൂചിപ്പിക്കുന്നു; ‘നിയമം’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: בּוֹ
  choice: ഉള്ളവൻ
  rationale: ബാധ ആ വ്യക്തിയിൽ ഉണ്ടെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: נֶגַע צָרָעַת
  choice: ചർമരോഗബാധ
  rationale: צָרָעַת ആധുനിക ഹാൻസൻസ് രോഗത്തിനു മാത്രം തുല്യമല്ല; ലേവ്യപുസ്തകത്തിൽ വിവിധ ഗുരുതര ചർമാവസ്ഥകൾ ഉൾപ്പെടുന്ന ആചാരപരമായ വിഭാഗമാണിത്. נֶגַע എന്ന ഘടകവും ‘ബാധ’ എന്നു പ്രതിനിധീകരിക്കുന്നു.
- source_word: לֹא תַשִּׂיג יָדוֹ
  choice: സാമ്പത്തികശേഷിയില്ലാത്തവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ കൈ എത്തുന്നില്ല’; ഇവിടെ ശുദ്ധീകരണച്ചടങ്ങിനാവശ്യമായത് നൽകാൻ വിഭവങ്ങൾ തികയാത്തതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
- source_word: בְּטָהֳרָתוֹ
  choice: തന്റെ ശുദ്ധീകരണത്തിനാവശ്യമായത്
  rationale: മുൻവാക്യങ്ങളിൽ വിവരിച്ച ശുദ്ധീകരണക്രമത്തിന് ആവശ്യമായ വഴിപാടുകൾ വഹിക്കുന്നതിനെ സന്ദർഭം സൂചിപ്പിക്കുന്നു; ‘ശുദ്ധീകരണം’ ആചാരപരമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: צָרָעַת എന്ന പദത്തിന്റെ രോഗപരമായ തിരിച്ചറിയൽ
  choice: ചർമരോഗം
  alternative: കുഷ്ഠരോഗം
  rationale: ഇത് ആധുനിക ഹാൻസൻസ് രോഗത്തെ മാത്രം നിർണയിക്കുന്ന പദമല്ല; അതിനാൽ തെറ്റായ രോഗനിർണയവും അനാവശ്യമായ മതവ്യാഖ്യാനവും ഒഴിവാക്കി വിശാലമായ അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ നിയമഗ്രന്ഥത്തിന് യോജിച്ച ഗൗരവമുള്ള ഭാഷ. ‘ചർമരോഗബാധ’ സാങ്കേതിക കൃത്യതയും വായനാസൗകര്യവും സമന്വയിപ്പിക്കുന്നു; സാമ്പത്തിക അഭാവം സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമാക്കി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
