  terminology: “നിയമം,” “ചർമരോഗബാധ,” and “ശുദ്ധീകരണം” are suitable modern-standard Malayalam choices. The explanatory note appropriately distinguishes צָרָעַת from the traditional, potentially misleading identification “കുഷ്ഠരോഗം.”
  issues:
