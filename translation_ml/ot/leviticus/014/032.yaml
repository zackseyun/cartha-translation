  source_fidelity: 'The verse is rendered faithfully overall: it identifies this as the prescribed law for a person affected by צָרָעַת and whose resources are insufficient for the purification process. The Malayalam retains the non-specific skin-affliction sense rather than wrongly equating it solely with Hansen’s disease. The financial idiom is correctly explained in the footnote.'
