translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള ഹീബ്രു ക്രിയാമാറ്റം കർത്താവില്ലാത്ത മലയാള നിർദേശരൂപത്തിൽ സ്വാഭാവികമായി സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
