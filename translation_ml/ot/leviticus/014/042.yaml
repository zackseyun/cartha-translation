  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקְחוּ֙ אֲבָנִ֣ים אֲחֵר֔וֹת וְ/הֵבִ֖יאוּ אֶל תַּ֣חַת הָ/אֲבָנִ֑ים וְ/עָפָ֥ר אַחֵ֛ר יִקַּ֖ח וְ/טָ֥ח אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/042.yaml
  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: ml
  text: പിന്നെ അവർ മറ്റു കല്ലുകൾ എടുത്ത് കല്ലുകൾക്കു പകരം അവ കൊണ്ടുവരണം[b]. അവൻ വേറെ മണ്ണ്[a] എടുത്ത് വീടു പൂശണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വേറെ മൺകൂട്ട്’; അക്ഷരാർഥത്തിൽ ‘വേറെ പൊടി/മണ്ണ്.’ കല്ലുകൾ മാറ്റിയശേഷം വീടിനു വീണ്ടും പൂശാൻ ഉപയോഗിക്കുന്ന വസ്തുവാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘കല്ലുകളുടെ അടിയിൽ’; ഇവിടെ അതിന്റെ അർഥം ‘കല്ലുകൾക്കു പകരം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: പിന്നെ അവർ ... എടുത്ത്
  rationale: ചടങ്ങുസംബന്ധമായ നിർദേശക്രമത്തിൽ വാവ് സൂചിപ്പിക്കുന്ന തുടർച്ച ‘പിന്നെ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ബഹുവചന കർത്താവും നിലനിർത്തുന്നു.
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: വേറെ കല്ലുകൾ
  rationale: മുമ്പ് നീക്കിയ കല്ലുകൾക്കു പകരമുള്ള കല്ലുകളെന്ന ലളിതമായ അർഥം ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: നീക്കിയ കല്ലുകൾക്കു പകരം അവ കൊണ്ടുവരണം
  rationale: תַּחַת ഇവിടെ ഭൗതികമായി ‘അടിയിൽ’ എന്നല്ല, പ്രതിസ്ഥാപനം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. സന്ദർഭവ്യക്തതയ്ക്കായി ‘നീക്കിയ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְעָפָר אַחֵר
  choice: വേറെ മൺകൂട്ട്
  rationale: עָפָר അടിസ്ഥാനമായി മണ്ണ്/പൊടി എന്നാണ്; ഇവിടെ വീടിന് വീണ്ടും പൂശാൻ ഉപയോഗിക്കുന്ന മണ്ണുചേർന്ന നിർമ്മാണമിശ്രിതത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മൺകൂട്ട്’ വസ്തുവിനെയും പ്രവർത്തനസന്ദർഭത്തെയും ഒരുപോലെ വ്യക്തമാക്കുന്നു.
- source_word: יִקַּח
  choice: എടുത്ത് ... പൂശണം
  rationale: ഹീബ്രുവിലെ 3-ാം പുരുഷ ഏകവചനത്തിലേക്കുള്ള മാറ്റം മലയാളത്തിൽ കർത്താവില്ലാത്ത നിർദേശരൂപത്തിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു; മുൻപത്തെ ‘അവർ’ എന്ന ബഹുവചനവുമായി അനാവശ്യമായി സമന്വയിപ്പിക്കുന്നില്ല.
- source_word: וְטָח אֶת הַבָּיִת
  choice: വീടിനു കുമ്മായം പൂശണം
  rationale: טוח വീടിന്റെ ഉപരിതലത്തിൽ പൂശുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സാധാരണ നിർമാണഭാഷയിൽ ‘കുമ്മായം പൂശുക’ സ്വാഭാവികമായ പ്രവർത്തനപ്രയോഗമാണ്.
