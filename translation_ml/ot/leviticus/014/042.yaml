- from: പിന്നെ അവർ വേറെ കല്ലുകൾ എടുത്ത്, നീക്കിയ കല്ലുകൾക്കു പകരം അവ കൊണ്ടുവരണം[b]. വേറെ മൺകൂട്ട്[a] എടുത്ത് വീടിനു കുമ്മായം പൂശണം.
  to: പിന്നെ അവർ മറ്റു കല്ലുകൾ എടുത്ത് കല്ലുകൾക്കു പകരം അവ കൊണ്ടുവരണം[b]. അവൻ വേറെ മണ്ണ്[a] എടുത്ത് വീടു പൂശണം.
