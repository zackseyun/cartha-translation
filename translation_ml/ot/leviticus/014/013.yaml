  to: പാപയാഗവും[a] ഹോമയാഗവും അറുക്കുന്ന വിശുദ്ധസ്ഥലത്ത് അവൻ ആ ആട്ടിൻകുട്ടിയെ അറുക്കണം. പാപയാഗംപോലെതന്നെ കുറ്റയാഗവും[b] പുരോഹിതനുള്ളതാണ്; അത് അതിവിശുദ്ധമാണ്.
