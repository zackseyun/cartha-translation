source:
  edition: WLC
  text: וְ/שָׁחַ֣ט אֶת הַ/כֶּ֗בֶשׂ בִּ֠/מְקוֹם אֲשֶׁ֨ר יִשְׁחַ֧ט אֶת הַֽ/חַטָּ֛את וְ/אֶת הָ/עֹלָ֖ה בִּ/מְק֣וֹם הַ/קֹּ֑דֶשׁ כִּ֡י כַּ֠/חַטָּאת הָ/אָשָׁ֥ם הוּא֙ לַ/כֹּהֵ֔ן קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: ml
  text: പാപയാഗവും[a] ഹോമയാഗവും അറുക്കുന്ന വിശുദ്ധസ്ഥലത്ത് അവൻ ആ ആട്ടിൻകുട്ടിയെ അറുക്കണം. പാപയാഗംപോലെതന്നെ കുറ്റയാഗവും[b] പുരോഹിതനുള്ളതാണ്; അത് അതിവിശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പാപയാഗം” എന്നതിന് “ശുദ്ധീകരണയാഗം” എന്നും പരിഭാഷപ്പെടുത്താം; പുരോഹിതനിയമത്തിലെ ഈ യാഗത്തിന്റെ ശുദ്ധീകരണധർമ്മത്തിന് ആ പരിഭാഷ ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “കുറ്റയാഗം” എന്നതിന് “പരിഹാരയാഗം” എന്നും പരിഭാഷപ്പെടുത്താം; ഈ യാഗവുമായി ബന്ധപ്പെട്ട പരിഹാരത്തിന്റെയും നഷ്ടപരിഹാരത്തിന്റെയും വശത്തിന് ആ പരിഭാഷ ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: അവൻ ... അറുക്കണം
  rationale: യാഗസന്ദർഭത്തിലെ ആചാരപരമായ അറുക്കലിനെ സൂചിപ്പിക്കുന്ന שׁחט എന്ന ക്രിയയ്ക്ക് ‘അറുക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്; നിയമനിർദേശത്തിന്റെ ഭാവം ‘അറുക്കണം’ എന്നു നൽകുന്നു.
- source_word: הַכֶּבֶשׂ
  choice: ആ ആട്ടിൻകുട്ടി
  rationale: כֶּבֶשׂ സാധാരണയായി യാഗത്തിനുള്ള ചെമ്മരിയാട്ടിൻകുട്ടിയെ സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭത്തിൽ നിർദേശിച്ച പ്രത്യേക മൃഗത്തെ നിർദേശകമായ ‘ആ’ വ്യക്തമാക്കുന്നു.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: അറുക്കുന്ന സ്ഥലത്തുവെച്ച്
  rationale: יִשְׁחַט ഇവിടെ പൊതുവായ/അനിശ്ചിത കർത്താവുള്ള നിയമപ്രയോഗമാണ്. മലയാളത്തിലെ കർത്താവില്ലാത്ത ‘അറുക്കുന്ന’ എന്ന രൂപം ഈ പൊതുവായ ആചാരനിർദേശം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַחַטָּאת
  choice: പാപയാഗം
  rationale: ലേവ്യയാഗക്രമത്തിലെ חַטָּאת എന്ന സാങ്കേതിക യാഗവിഭാഗത്തിന് പരിചിതവും അർത്ഥവത്തുമായ പദം; ശുദ്ധീകരണവശം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: עֹלָה എന്ന പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗവിഭാഗത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്വാഭാവികമായ സാങ്കേതിക പദം.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലത്ത്
  rationale: നിശ്ചിതമായ യാഗസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്രോതസ്സിലെ നിർദിഷ്ടതയും വിശുദ്ധസ്വഭാവവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: പാപയാഗംപോലെതന്നെ അകൃത്യയാഗവും പുരോഹിതനുള്ളതാണ്
  rationale: സ്രോതസ്സിലെ ഉപമയും לַכֹּהֵן സൂചിപ്പിക്കുന്ന പുരോഹിതാവകാശവും വ്യക്തമായി നിലനിർത്തുന്നു. אָשָׁם-ന് ‘അകൃത്യയാഗം’ യാഗവിഭാഗത്തിന്റെ കുറ്റപരിഹാര സ്വഭാവം പ്രകടമാക്കുന്നു.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: അത് അതിവിശുദ്ധമാണ്
  rationale: ഹീബ്രു അതിശയോക്തിസംയുക്തമായ ‘വിശുദ്ധങ്ങളിൽ വിശുദ്ധം’ എന്ന സാങ്കേതിക വിശുദ്ധതാവിഭാഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘അതിവിശുദ്ധം’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: പുരോഹിതയാഗനിയമത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ പദം പാപത്തെയും ആചാരപരമായ ശുദ്ധീകരണത്തെയും ബന്ധിപ്പിക്കാം. പതിവായ യാഗവിഭാഗനാമം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, ശുദ്ധീകരണപ്രാധാന്യം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: אָשָׁם എന്ന യാഗപദത്തിന്റെ പരിഭാഷ
  choice: അകൃത്യയാഗം
  alternative: പരിഹാരയാഗം
  rationale: പദം കുറ്റം/ബാധ്യതയുമായി ബന്ധപ്പെട്ട യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ചില സാഹചര്യങ്ങളിൽ നഷ്ടപരിഹാരവും ഉൾപ്പെടുന്നു. ആ വ്യത്യസ്ത ഊന്നൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: לַכֹּהֵן സൂചിപ്പിക്കുന്ന ബന്ധം
  choice: പുരോഹിതനുള്ളതാണ്
  alternative: പുരോഹിതന്റേതാണ്
  rationale: യാഗത്തിൽ പുരോഹിതനുള്ള നിയമപരമായ അവകാശത്തെ വ്യക്തമാക്കുന്നു; സമ്പൂർണ സ്വകാര്യ ഉടമസ്ഥത എന്നതിലേക്കു വാചകത്തെ അതിരുകടന്ന് നയിക്കാതിരിക്കാൻ സ്വാഭാവികമായ അവകാശപ്രയോഗം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമ-ആചാര ശൈലി. ‘പാപയാഗം’, ‘ഹോമയാഗം’, ‘അകൃത്യയാഗം’, ‘അതിവിശുദ്ധം’ എന്നീ പദങ്ങൾ യാഗവിഭാഗങ്ങളുടെ സാങ്കേതിക വ്യത്യാസം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട യാഗപദങ്ങൾക്കു പിന്നാലെ വയ്ക്കുന്നതാണ് പ്രസിദ്ധീകരണത്തിൽ അഭികാമ്യം; സമർപ്പിച്ച വാചകത്തിൽ അവ വാക്യാവസാനത്ത് ചേർത്തിട്ടുണ്ടെങ്കിലും രണ്ടും മുഖ്യവാചകത്തിൽ സന്നിഹിതമാണ്.
