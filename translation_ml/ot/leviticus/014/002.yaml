reference: Leviticus 14:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֹ֤את תִּֽהְיֶה֙ תּוֹרַ֣ת הַ/מְּצֹרָ֔ע בְּ/י֖וֹם טָהֳרָת֑/וֹ וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: ml
  text: 'കുഷ്ഠബാധിതനായ വ്യക്തിക്കുള്ള നിയമം ഇതാണ്: അവന്റെ ശുദ്ധീകരണദിവസത്തിൽ അവനെ പുരോഹിതന്റെ അടുക്കലേക്കു കൊണ്ടുവരണം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: ഇതാണ്
  rationale: നിയമനിർദേശത്തിന്റെ ആമുഖമായ എബ്രായ പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ വർത്തമാനകാല നിയമശൈലിയിൽ അവതരിപ്പിക്കുന്നു; ഭാവികാലത്തിന്റെ നിർബന്ധാർഥം തുടർന്നുള്ള ‘പാലിക്കേണ്ട’ എന്നതിൽ വ്യക്തമാകുന്നു.
- source_word: תּוֹרַת
  choice: പാലിക്കേണ്ട നിയമം
  rationale: ഇവിടെ תּוֹרָה അമൂർത്തമായ ഉപദേശത്തെയല്ല, നിർദേശിക്കപ്പെട്ട ആചാരനടപടിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പാലിക്കേണ്ട നിയമം’ നിയമപരവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: הַמְּצֹרָע
  choice: കുഷ്ഠസദൃശമായ രോഗാവസ്ഥ ബാധിച്ച വ്യക്തി
  rationale: מְצֹרָע എന്നത് צָרַעַת ബാധിച്ച വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ഇത് ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ കുഷ്ഠരോഗത്തോട് കൃത്യമായി സമാനമല്ല. ‘കുഷ്ഠസദൃശമായ’ എന്നത് പരമ്പരാഗത ബന്ധം നിലനിർത്തുകയും കൃത്യമായ ആധുനിക രോഗനിർണയം ഒഴിവാക്കുകയും ചെയ്യുന്നു; ‘വ്യക്തി’ എന്നത് ആളിനെ രോഗാവസ്ഥയിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: അയാളെ ശുദ്ധീകരിക്കുന്ന ദിവസത്തിൽ
  rationale: טהר ഇവിടെ ആചാരപരമായ ശുദ്ധീകരണവും സമൂഹത്തിലേക്കുള്ള പുനഃസ്ഥാപനവും സൂചിപ്പിക്കുന്നു. ‘ശുദ്ധീകരിക്കുന്ന ദിവസത്തിൽ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭത്തിന് അനുയോജ്യവുമാണ്.
- source_word: וְהוּבָא
  choice: അവനെ കൊണ്ടുവരണം
  rationale: ഹോഫാൽ രൂപത്തിലെ കർമണിപ്രയോഗം നിയമപരമായ മലയാളത്തിൽ നിർബന്ധം വ്യക്തമാക്കുന്ന ‘കൊണ്ടുവരണം’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; ആ വ്യക്തി സ്വയം വരുന്നു എന്ന അർഥം ഇതിൽ വരില്ല.
- source_word: אֶל הַכֹּהֵן
  choice: പുരോഹിതന്റെ അടുക്കൽ
  rationale: എബ്രായത്തിലെ നിർദിഷ്ട ഉപപദം സന്ദർഭത്തിലെ ചുമതലപ്പെട്ട പുരോഹിതനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പുരോഹിതന്റെ അടുക്കൽ’ ആ നിർദിഷ്ടത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: מְצֹרָע എന്ന പദവും ആധുനിക ‘കുഷ്ഠരോഗം’ എന്ന രോഗനിർണയവും തമ്മിലുള്ള ബന്ധം
  choice: കുഷ്ഠസദൃശമായ രോഗാവസ്ഥ ബാധിച്ച വ്യക്തി
  alternative: കുഷ്ഠരോഗി; ചർമരോഗം ബാധിച്ച വ്യക്തി; സാരാത്ത് ബാധിച്ച വ്യക്തി
  rationale: ഈ എബ്രായ പദം ആചാരപരമായ അശുദ്ധിയുമായി ബന്ധപ്പെട്ട צָרַעַת എന്ന അവസ്ഥ ബാധിച്ചയാളെ സൂചിപ്പിക്കുന്നു; അതിനെ ആധുനിക ഹാൻസൻസ് രോഗമായി മാത്രം നിർവചിക്കുന്നത് തെളിവിനപ്പുറമാണ്. തിരഞ്ഞെടുത്ത രൂപം പരമ്പരാഗത ‘കുഷ്ഠ’ ബന്ധം നിലനിർത്തുമ്പോഴും വൈദ്യശാസ്ത്രപരമായ തെറ്റായ തുല്യത ഒഴിവാക്കുന്നു.
- issue: טָהֳרָתוֹ എന്നതിലെ ശുദ്ധീകരണത്തിന്റെ സ്വഭാവം
  choice: ശുദ്ധീകരിക്കുന്ന
  alternative: രോഗമുക്തനാകുന്ന; നിർമലനാകുന്ന
  rationale: സന്ദർഭം വൈദ്യപരമായ സൗഖ്യം മാത്രം അല്ല, ആചാരപരമായ ശുദ്ധീകരണനടപടിയാണ്. അതിനാൽ ‘ശുദ്ധീകരിക്കുന്ന’ എന്നത് ഈ വ്യത്യാസം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശശൈലി സ്വീകരിച്ചു. വൈദ്യശാസ്ത്രപരമായി തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘കുഷ്ഠരോഗി’ എന്ന ഒറ്റപ്പദം ഒഴിവാക്കി, വ്യക്തിയെ മുൻനിർത്തുന്ന പ്രയോഗം ഉപയോഗിച്ചു.
