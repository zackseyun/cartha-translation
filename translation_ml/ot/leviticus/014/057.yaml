  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: ml
  text: എപ്പോൾ അശുദ്ധമാണെന്നും എപ്പോൾ ശുദ്ധമാണെന്നും നിർദേശം നൽകാൻ. അശുദ്ധിയുണ്ടാക്കുന്ന അവസ്ഥയെക്കുറിച്ചുള്ള നിയമം ഇതാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘കുഷ്ഠരോഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. എബ്രായപദം മനുഷ്യരെയും വസ്ത്രങ്ങളെയും വീടുകളെയും ബാധിക്കുന്ന അശുദ്ധിയുണ്ടാക്കുന്ന അവസ്ഥകളെ സൂചിപ്പിക്കാം; അത് ആധുനിക ഹാൻസൻസ് രോഗത്തിൽ മാത്രം ഒതുങ്ങുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: നിർദേശം നൽകേണ്ടതിന്
  rationale: ഹിഫീൽ രൂപം, മുമ്പുള്ള നിയമങ്ങൾക്കു കീഴിൽ ശുദ്ധ-അശുദ്ധ നില തിരിച്ചറിയുന്നതിനെക്കുറിച്ചുള്ള ആധികാരിക നിർദേശം സൂചിപ്പിക്കുന്നു.
- source_word: בְּיוֹם
  choice: എപ്പോൾ
  rationale: ഇവിടെ ‘ദിവസത്തിൽ’ എന്ന അക്ഷരാർഥമല്ല, ഒരു അവസ്ഥ നിലവിലുള്ള സമയം സൂചിപ്പിക്കുന്ന കാലസംബന്ധിയായ പ്രയോഗമാണ്.
- source_word: הַטָּמֵא
  choice: അശുദ്ധമാണെന്ന്
  rationale: ആചാരപരമായി അശുദ്ധമായ നിലയാണ് വിശേഷണം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഉപവാക്യരൂപം ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּבְיוֹם הַטָּהֹר
  choice: എപ്പോൾ ശുദ്ധമാണെന്ന്
  rationale: സമാന്തരമായ കാലപ്രയോഗം അശുദ്ധനിലയ്ക്ക് വിപരീതമായ ശുദ്ധനിലയെ സൂചിപ്പിക്കുന്നു.
- source_word: תּוֹרַת
  choice: നിയമം
  rationale: ഈ നിർദിഷ്ട വിഷയത്തെ നിയന്ത്രിക്കുന്ന നിയമപരമായ ഉപദേശത്തെ സൂചിപ്പിക്കുന്ന സംഗ്രഹസൂത്രമാണിത്.
- source_word: הַצָּרָעַת
  choice: അശുദ്ധമാക്കുന്ന ബാധ
  rationale: ഈ എബ്രായ പദം മനുഷ്യരിലെ ത്വക്ക്‌ബാധയ്ക്ക് മാത്രമല്ല, വസ്ത്രങ്ങളെയും വീടുകളെയും ബാധിക്കുന്ന ആചാരപരമായ അശുദ്ധിയുടെ വിഭാഗത്തിനും ഉപയോഗിക്കുന്നു; അതിനാൽ ഒരു പ്രത്യേക ആധുനിക രോഗനാമം ഒഴിവാക്കി പൊതുവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ צָרַעַת എന്ന ആചാരപരമായ വിഭാഗത്തിന്റെ പരിഭാഷ
  choice: അശുദ്ധമാക്കുന്ന ബാധ
  alternative: കുഷ്ഠരോഗം
  rationale: മൂലപദം ആധുനിക ഹാൻസൻസ് രോഗത്തിൽ ഒതുങ്ങുന്നില്ല; മനുഷ്യർ, വസ്ത്രങ്ങൾ, വീടുകൾ എന്നിവയെ ബാധിക്കുന്ന അവസ്ഥകൾക്കും ഇത് ഉപയോഗിക്കുന്നു. അതിനാൽ പാഠത്തിൽ വിശാലമായ ആചാരപരമായ അർഥം നിലനിർത്തുകയും പരമ്പരാഗത പരിഭാഷ അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘ദിവസം’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിനു പകരം സന്ദർഭോചിതമായി ‘എപ്പോൾ’ ഉപയോഗിച്ചു; ആചാരപരമായ ശുദ്ധി-അശുദ്ധി ഭാഷ നിലനിർത്തി.
