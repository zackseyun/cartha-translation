revisions:
- from: എപ്പോൾ അശുദ്ധമാണെന്നും എപ്പോൾ ശുദ്ധമാണെന്നും നിർദേശം നൽകേണ്ടതിന്. അശുദ്ധമാക്കുന്ന ബാധയെക്കുറിച്ചുള്ള നിയമം ഇതാണ്[a].
  to: എപ്പോൾ അശുദ്ധമാണെന്നും എപ്പോൾ ശുദ്ധമാണെന്നും നിർദേശം നൽകാൻ. അശുദ്ധിയുണ്ടാക്കുന്ന അവസ്ഥയെക്കുറിച്ചുള്ള നിയമം ഇതാണ്[a].
