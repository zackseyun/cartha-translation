  yaml_path: translation/ot/leviticus/014/026.yaml
  text: And from the oil the priest shall pour onto the palm of his own left hand[a].
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ എണ്ണയിൽനിന്ന് തന്റെ ഇടത്തെ കൈപ്പത്തിയിലേക്ക് ഒഴിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִן
  choice: പിന്നെ ... എണ്ണയിൽനിന്ന് കുറച്ച്
  rationale: വാവ് ആചാരക്രമത്തിന്റെ തുടർച്ചയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പിന്നെ’ എന്നും, מִן ഉറവിടം/അംശം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘എണ്ണയിൽനിന്ന് കുറച്ച്’ എന്നും നൽകി. ‘കുറച്ച്’ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന അളവിനെ വ്യക്തമാക്കുന്നു.
- source_word: הַ/שֶּׁמֶן
  choice: എണ്ണ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ എണ്ണയെയാണ് നിർദ്ദിഷ്ട പദം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭം നിർണ്ണയം വ്യക്തമാക്കുന്നതിനാൽ വേറെ നിർദ്ദേശകപദം ആവശ്യമില്ല.
- source_word: יִצֹק
  choice: ഒഴിക്കണം
  rationale: ആചാരനിർദേശത്തിലെ യിഖ്തോൽ രൂപം മലയാളത്തിൽ നിർബന്ധാത്മകമായ ‘ഒഴിക്കണം’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: הַ/כֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ ആരാധനാക്രമസന്ദർഭത്തിൽ כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: עַל כַּף
  choice: കൈപ്പത്തിയിൽ
  rationale: כַּף കൈയുടെ ഉള്ളം/കൈപ്പത്തി എന്നാണ്; ഒഴിക്കുന്ന പ്രവൃത്തിയുടെ ലക്ഷ്യസ്ഥലം മലയാളത്തിൽ സ്ഥാനവിഭക്തിയോടെ സ്വാഭാവികമായി നൽകി.
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: തന്റെ ഇടത്തെ കൈപ്പത്തി
  rationale: അക്ഷരാർഥത്തിൽ ‘പുരോഹിതന്റെ കൈപ്പത്തി, ഇടത്തേത്’ എന്നാണ്. ഒരേ പുരോഹിതനെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് മലയാളത്തിൽ ആവർത്തനമില്ലാതെ ‘തന്റെ’ വ്യക്തമാക്കുന്നു.
