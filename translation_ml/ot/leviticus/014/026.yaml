translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആചാരനിർദേശശൈലി. ‘ഇടത്തെ കൈപ്പത്തി’ എന്നത് മൂലഭാഷയിലെ ശരീരഭാഗത്തെ കൃത്യമായി നിലനിർത്തുന്നു.
