id: LEV.14.28
reference: Leviticus 14:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: ml
  text: പുരോഹിതൻ തന്റെ ഉള്ളംകൈയിലുള്ള എണ്ണയിൽനിന്ന് കുറച്ച് ശുദ്ധീകരിക്കപ്പെടുന്നവന്റെ വലതുചെവിമടലിലും അവന്റെ വലതുകൈയിലെ തള്ളവിരലിലും അവന്റെ വലതുകാലിലെ പെരുവിരലിലും, അകൃത്യയാഗത്തിന്റെ രക്തം പുരട്ടിയ സ്ഥാനങ്ങളിൽ, പുരട്ടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അകൃത്യയാഗത്തിന്റെ രക്തത്തിന്റെ സ്ഥലത്ത്”; മുമ്പുള്ള അനുഷ്ഠാനത്തിൽ രക്തം പുരട്ടിയ അതേ ശരീരസ്ഥാനങ്ങളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: The Hebrew uses the singular expression ‘place of the guilt-offering blood,’ while the context identifies the corresponding locations on the ear, hand, and foot.
lexical_decisions:
- source_word: וְנָתַן
  choice: പുരട്ടണം
  rationale: ഈ അനുഷ്ഠാനസന്ദർഭത്തിൽ എണ്ണ ശരീരഭാഗങ്ങളിൽ ഇടുന്നതിനെ സ്വാഭാവികവും കൃത്യവുമായി അറിയിക്കുന്നു; נתן എന്നതിന്റെ ‘വയ്ക്കുക/ഇടുക’ എന്ന വ്യാപക അർഥം സന്ദർഭാനുസൃതമായി നൽകുന്നു.
- source_word: מִן הַשֶּׁמֶן
  choice: എണ്ണയിൽ കുറച്ച് എടുത്ത്
  rationale: ഭാഗികത സൂചിപ്പിക്കുന്ന מִן മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: തന്റെ ഉള്ളംകൈയിലുള്ള
  rationale: כַּף ഇവിടെ പുരോഹിതന്റെ ഉള്ളംകൈയെ സൂചിപ്പിക്കുന്നു; കൈ ആരുടേതാണെന്നതും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: תְּנוּךְ אֹזֶן
  choice: ചെവിയുടെ താഴത്തെ മൃദുഭാഗം
  rationale: അനുഷ്ഠാനസന്ദർഭത്തിലെ ചെവിയുടെ ലോബ് എന്ന ശരീരഭാഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പറയുന്നു.
- source_word: הַמִּטַּהֵר
  choice: ശുദ്ധീകരിക്കപ്പെടുന്നവൻ
  rationale: ഹിത്പയേൽ വർത്തമാനകൃദന്തത്തിന്റെ പ്രക്രിയാത്മക അർഥം നിലനിർത്തുന്നു; പൂർത്തിയായ അവസ്ഥയായി മാറ്റുന്നില്ല.
- source_word: בֹּהֶן יָדוֹ
  choice: കൈയുടെ തള്ളവിരൽ
  rationale: കൈയെ സംബന്ധിച്ച בֹּהֶן എന്നതിന് കൃത്യമായ സാധാരണ മലയാള പദം.
- source_word: בֹּהֶן רַגְלוֹ
  choice: കാലിന്റെ പെരുവിരൽ
  rationale: കാലിനെ സംബന്ധിച്ച בֹּהֶן എന്നതിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാള പദം.
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: അകൃത്യയാഗത്തിന്റെ രക്തം ഉണ്ടായിരുന്ന സ്ഥലത്തിന്മേൽ
  rationale: ‘രക്തത്തിന്റെ സ്ഥലം’ എന്ന എബ്രായ ഘടനയുടെ അർഥം നിലനിർത്തുകയും, മുൻ അനുഷ്ഠാനത്തിൽ രക്തം പുരട്ടിയ അതേ സ്ഥലം സൂചിപ്പിക്കുന്നതായി വായിക്കാനാകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: אָשָׁם എന്ന യാഗനാമത്തിന്റെ പരിഭാഷ
  choice: അകൃത്യയാഗം
  alternative: കുറ്റപരിഹാരയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ പ്രത്യേക യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ മലയാള ബൈബിൾപദം ഉപയോഗിക്കുന്നു; ‘പരിഹാരം/നഷ്ടപരിഹാരം’ എന്നൊരു വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, അനുഷ്ഠാനപരമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ശരീരഭാഗപദങ്ങൾ ഉപയോഗിച്ചു. വാക്യത്തിന്റെ അവസാനഭാഗം മുൻപറഞ്ഞ മൂന്ന് ശരീരസ്ഥാനങ്ങളെയെല്ലാം വിശേഷിപ്പിക്കുന്നതായി ഡാഷുകൾകൊണ്ട് വ്യക്തമാക്കി.
