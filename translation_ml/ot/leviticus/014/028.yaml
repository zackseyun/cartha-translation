revisions:
- from: പുരോഹിതൻ തന്റെ ഉള്ളംകൈയിലുള്ള എണ്ണയിൽ കുറച്ച് എടുത്ത്, ശുദ്ധീകരിക്കപ്പെടുന്നവന്റെ വലതുചെവിയുടെ താഴത്തെ മൃദുഭാഗത്തും വലതുകൈയുടെ തള്ളവിരലിലും വലതുകാലിന്റെ പെരുവിരലിലും—അകൃത്യയാഗത്തിന്റെ രക്തം ഉണ്ടായിരുന്ന സ്ഥലത്തിന്മേൽ[a]—പുരട്ടണം.
  to: പുരോഹിതൻ തന്റെ ഉള്ളംകൈയിലുള്ള എണ്ണയിൽനിന്ന് കുറച്ച് ശുദ്ധീകരിക്കപ്പെടുന്നവന്റെ വലതുചെവിമടലിലും അവന്റെ വലതുകൈയിലെ തള്ളവിരലിലും അവന്റെ വലതുകാലിലെ പെരുവിരലിലും, അകൃത്യയാഗത്തിന്റെ രക്തം പുരട്ടിയ സ്ഥാനങ്ങളിൽ, പുരട്ടണം.[a]
  rationale: The revision removes the added ‘taking’ action, uses idiomatic modern Malayalam for ‘earlobe,’ makes the cleansed person’s hand and foot explicit, and renders the final ritual correspondence as the locations where the guilt-offering blood was applied. The footnote supplies the compact Hebrew wording and explains the contextual plural sense without imposing a theological interpretation.
