id: LEV.14.41
reference: Leviticus 14:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַ/בַּ֛יִת יַקְצִ֥עַ מִ/בַּ֖יִת סָבִ֑יב וְ/שָׁפְכ֗וּ אֶת הֶֽ/עָפָר֙ אֲשֶׁ֣ר הִקְצ֔וּ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: ml
  text: അവൻ വീടിന്റെ ഉൾഭാഗം ചുറ്റും ചുരണ്ടിക്കളയിക്കണം; അവർ ചുരണ്ടിക്കളഞ്ഞ പൊടി നഗരത്തിനു പുറത്തുള്ള അശുദ്ധമായ ഒരു സ്ഥലത്ത് ഒഴിച്ചുകളയണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַקְצִעַ
  choice: ചുരണ്ടിക്കളയിക്കണം
  rationale: 'ഹിഫീൽ രൂപത്തിന്റെ കാരണാർത്ഥം നിലനിർത്തുന്നു: പുരോഹിതൻ പ്രവൃത്തി സ്വയം മുഴുവൻ ചെയ്യുന്നതല്ല, അത് ചെയ്യിക്കുന്നു.'
- source_word: מִבַּיִת סָבִיב
  choice: വീടിന്റെ അകം ചുറ്റും
  rationale: വീടിന്റെ അകത്തെ ഉപരിതലം മുഴുവനും ചുറ്റുമായി എന്ന സ്ഥലാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְשָׁפְכוּ
  choice: കൊണ്ടുപോയി തള്ളണം
  rationale: പൊടി നഗരത്തിനു പുറത്തുള്ള സ്ഥലത്ത് നീക്കംചെയ്യുന്ന സന്ദർഭത്തിൽ שׁפך എന്നതിന്റെ ഒഴിച്ചുകളയുക എന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הֶעָפָר
  choice: പൊടി
  rationale: പദത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘കുമ്മായം’ പോലുള്ള പ്രത്യേകത ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר הִקְצוּ
  choice: അവർ ചുരണ്ടിക്കളഞ്ഞ
  rationale: ചുവരുകളിൽനിന്ന് ചുരണ്ടി നീക്കിയ വസ്തുവിനെയാണ് ഈ ബന്ധവാക്യം സൂചിപ്പിക്കുന്നത്.
- source_word: אֶל מִחוּץ לָעִיר
  choice: നഗരത്തിനു പുറത്തുള്ള
  rationale: നഗരപരിധിക്കു പുറത്തേക്കുള്ള നീക്കവും ലക്ഷ്യസ്ഥാനവും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֶל מָקוֹם טָמֵא
  choice: അശുദ്ധമായ ഒരു സ്ഥലത്ത്
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ ശുദ്ധി-അശുദ്ധി വിഭാഗത്തെ ധാർമ്മിക കുറ്റമായി മാറ്റാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ טָמֵא എന്ന ശുദ്ധിവിധിസംബന്ധിയായ പദത്തിന്റെ പരിഭാഷ
  choice: അശുദ്ധമായ
  alternative: മലിനമായ
  rationale: ‘അശുദ്ധം’ ആചാരപരമായ നിലയെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും പരിചിതവുമാണ്; ‘മലിനം’ ഭൗതിക അഴുക്കിനെയോ നൈതിക ദൂഷ്യത്തെയോ കൂടുതൽ സൂചിപ്പിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കാരണാർത്ഥ ക്രിയയും ആചാരപരമായ ‘അശുദ്ധം’ എന്ന സാങ്കേതിക അർഥവും സംരക്ഷിച്ചിട്ടുണ്ട്.
