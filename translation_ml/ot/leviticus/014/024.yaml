source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ കുറ്റയാഗത്തിനുള്ള ആട്ടിൻകുട്ടിയെയും[a] ഒരു ലോഗ് എണ്ണയെയും[b] എടുക്കണം; പുരോഹിതൻ അവയെ യാഹ്‌വേയുടെ സന്നിധിയിൽ ആട്ടുന്ന യാഗമായി ആട്ടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുറ്റയാഗത്തിനുള്ള ആട്ടിൻകുട്ടി’ എന്നതിന് ‘കുറ്റയാഗത്തിന്റെ ആട്ടിൻകുട്ടി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ലോഗ്’ ഇസ്രായേലിന്റെ ആചാരക്രമത്തിൽ ഉപയോഗിച്ചിരുന്ന ചെറിയൊരു ദ്രവ അളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: പിന്നെ ... എടുക്കണം
  rationale: വാവ് സഹിതമുള്ള ക്രിയ ആചാരക്രമത്തിലെ അടുത്ത ഘട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘പിന്നെ’ നടപടിക്രമത്തിന്റെ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാകർമപരവും നിയമപരവുമായ സന്ദർഭത്തിൽ כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണ മലയാള പരിഭാഷ. എബ്രായത്തിലെ ആവർത്തനം വാക്യത്തിന്റെ രണ്ടാം ഭാഗത്തും നിലനിർത്തി.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: അകൃത്യയാഗത്തിനുള്ള കുഞ്ഞാട്
  rationale: אָשָׁם കുറ്റബാധ്യതയുമായി ബന്ധപ്പെട്ട പ്രത്യേക യാഗവിഭാഗമാണ്; ‘അകൃത്യയാഗം’ ആ വിഭാഗത്തെ വ്യക്തമായി സൂചിപ്പിക്കുകയും സന്ധിബന്ധത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לֹג הַשָּׁמֶן
  choice: ഒരു ലോഗ് എണ്ണ
  rationale: לֹג ഒരു നിർദിഷ്ട ദ്രവ അളവാണ്. പൊതുവായ ‘അളവ്’ എന്നതിനെക്കാൾ സാങ്കേതിക പദം ലിപ്യന്തരണം ചെയ്ത് അളവിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- source_word: וְהֵנִיף
  choice: നീരാജനം ചെയ്യണം
  rationale: נוּף എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഹ്‌വേയുടെ സന്നിധിയിൽ വസ്തുക്കൾ ആചാരപരമായി ചലിപ്പിച്ച് അർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ-ആരാധനാഭാഷയിലെ ‘നീരാജനം ചെയ്യുക’ ആ സാങ്കേതിക കർമത്തെ സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: אֹתָם
  choice: അവയെ
  rationale: ബഹുവചന സർവനാമം കുഞ്ഞാടിനെയും എണ്ണയുടെ ലോഗിനെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നതിനാൽ ബഹുവചന കർമരൂപം നിലനിർത്തി.
- source_word: תְּנוּפָה
  choice: നീരാജനയാഗമായി
  rationale: ക്രിയയോടു ബന്ധമുള്ള ഈ നാമം ആചാരപരമായ നീരാജനത്തിന്റെ യാഗവിഭാഗത്തെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സാങ്കേതിക യാഗപദമായി അവതരിപ്പിച്ചു.
- source_word: לִפְנֵי יְהוָה
  choice: യാഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ദൈവസന്നിധിയിലെ ആചാരപരമായ അവതരണത്തെ സൂചിപ്പിക്കുന്നു; ദൈവനാമം യാഹ്‌വേ എന്നു നേരിട്ട് നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നു. അതിനെ ഒരു സ്ഥാനനാമത്തിലൂടെ മറയ്ക്കാതെ ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: אָשָׁם എന്ന യാഗവിഭാഗത്തിന്റെ പരിഭാഷ
  choice: അകൃത്യയാഗം
  alternative: കുറ്റയാഗം; പ്രായശ്ചിത്തയാഗം
  rationale: ഇത് കുറ്റവും അതിൽനിന്നുള്ള ബാധ്യതയും സംബന്ധിച്ച പ്രത്യേക യാഗമാണ്. പൊതുവായ പ്രായശ്ചിത്തയാഗവുമായി കലരാതിരിക്കാനും പരമ്പരാഗത യാഗവിഭാഗം തിരിച്ചറിയാനുമായി ‘അകൃത്യയാഗം’ തിരഞ്ഞെടുത്തു.
- issue: נוּף / תְּנוּפָה എന്ന ആചാരപ്രവൃത്തിയുടെ അവതരണം
  choice: നീരാജനം ചെയ്യുക / നീരാജനയാഗം
  alternative: ആട്ടുക / ചലനയാഗം; ഉയർത്തി അർപ്പിക്കുക
  rationale: മൂലക്രിയയുടെ കൃത്യമായ ചലനരീതി പൂർണമായി വ്യക്തമല്ല; അത് വെറും സാധാരണ ‘ആട്ടൽ’ ആയി ചുരുക്കാതെ, ആചാരപരമായ അവതരണത്തിന്റെ സ്വഭാവം സംരക്ഷിക്കുന്ന സാങ്കേതിക പദം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ലേവ്യപുസ്തകത്തിലെ യാഗക്രമത്തിന് യോജിച്ച ഗൗരവമുള്ള നിർദ്ദേശശൈലി ഉപയോഗിച്ചു. ‘ലോഗ്’, ‘അകൃത്യയാഗം’, ‘നീരാജനയാഗം’ എന്നീ സാങ്കേതിക പദങ്ങൾ ആവശ്യമായിടത്ത് അടിക്കുറിപ്പോടെ നിലനിർത്തി; വാക്യം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ക്രമത്തിൽ രൂപപ്പെടുത്തി.
