id: LEV.14.16
reference: Leviticus 14:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/טָבַ֤ל הַ/כֹּהֵן֙ אֶת אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית וְ/הִזָּ֨ה מִן הַ/שֶּׁ֧מֶן בְּ/אֶצְבָּע֛/וֹ שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: ml
  text: പുരോഹിതൻ തന്റെ ഇടത്തെ ഉള്ളംകൈയിലുള്ള എണ്ണയിൽ തന്റെ വലതുകൈയിലെ വിരൽ മുക്കി, ആ എണ്ണയിൽനിന്ന് കുറെ വിരൽകൊണ്ട് യഹ്‌വെയുടെ സന്നിധിയിൽ ഏഴു പ്രാവശ്യം തളിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבַל
  choice: മുക്കി
  rationale: ദ്രാവകത്തിൽ വിരൽ മുക്കുന്ന ആചാരക്രിയയെ സ്വാഭാവികവും കൃത്യവുമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: തന്റെ വലതുകൈയിലെ വിരൽ
  rationale: വലതുവശത്തെ വിരൽ എന്ന ശരീരസംബന്ധമായ നിർദേശം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מִן הַשֶּׁמֶן אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: തന്റെ ഇടത്തെ ഉള്ളംകൈയിലുള്ള എണ്ണയിൽ
  rationale: כף എന്നത് ഇവിടെ കൈ മുഴുവനെയല്ല, ഉള്ളംകൈയെയാണ് സൂചിപ്പിക്കുന്നത്; טבל എന്ന ക്രിയയോടുകൂടെ מן ദ്രാവകത്തിൽ മുക്കുന്നതായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുന്നു.
- source_word: הִזָּה
  choice: തളിക്കണം
  rationale: പുരോഹിതാചാരത്തിൽ ദ്രാവകം നിശ്ചിതവിധം തളിക്കുന്ന പ്രവൃത്തിക്ക് പ്രചാരമുള്ളതും വ്യക്തവുമായ പദം.
- source_word: בְּאֶצְבָּעוֹ
  choice: വിരൽകൊണ്ട്
  rationale: בְּ ഇവിടെ പ്രവൃത്തിയുടെ ഉപകരണം സൂചിപ്പിക്കുന്നു.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: ആചാരപരമായി പ്രാധാന്യമുള്ള സംഖ്യ യഥാരൂപം നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധിയിൽ എന്ന ആരാധനാപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദിവ്യനാമം നേരിട്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഹീബ്രു പാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തോട് അടുത്ത മലയാളലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആചാരനിയമത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന, എന്നാൽ സാധാരണ ആധുനിക മലയാളവായനക്കാർക്ക് വ്യക്തമായ നിർദേശാത്മക ശൈലി. ഹീബ്രുവിലെ പ്രവൃത്തിക്രമവും ശരീരസംബന്ധമായ വിശദാംശങ്ങളും സംരക്ഷിച്ചിട്ടുണ്ട്.
