id: LEV.14.21
reference: Leviticus 14:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם דַּ֣ל ה֗וּא וְ/אֵ֣ין יָד/וֹ֮ מַשֶּׂגֶת֒ וְ֠/לָקַח כֶּ֣בֶשׂ אֶחָ֥ד אָשָׁ֛ם לִ/תְנוּפָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו וְ/עִשָּׂר֨וֹן סֹ֜לֶת אֶחָ֨ד בָּל֥וּל בַּ/שֶּׁ֛מֶן לְ/מִנְחָ֖ה וְ/לֹ֥ג שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: ml
  text: എന്നാൽ അവൻ ദരിദ്രനും അവന്റെ സാമ്പത്തികശേഷി മതിയാകാത്തവനുമാണെങ്കിൽ[a], അവന്നുവേണ്ടിയുള്ള പ്രായശ്ചിത്തത്തിനായി നീരാജനം ചെയ്യേണ്ട അകൃത്യയാഗമായി ഒരു ആൺകുഞ്ഞാടിനെയും, ധാന്യയാഗത്തിനായി എണ്ണ ചേർത്ത ഒരു ഏഫയുടെ പത്തിലൊന്നു നേരിയ മാവിനെയും, ഒരു ലോഗ്[b] എണ്ണയും അവൻ കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അവന്റെ കൈ എത്തുന്നില്ല”; അതായത്, ആവശ്യമായ സാമ്പത്തികശേഷി അവനില്ല.'
    reason: lexical_alternative
  - marker: b
    text: “ലോഗ്” ഇസ്രായേല്യരുടെ യാഗനിയമത്തിൽ ഉപയോഗിച്ചിരുന്ന ഒരു ചെറിയ ദ്രവ അളവാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: ദരിദ്രൻ
  rationale: സാമ്പത്തികമായി ശേഷി കുറഞ്ഞ ഒരാളെ നിയമപരമായ ഈ സന്ദർഭത്തിൽ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: അവന്റെ കഴിവിന് അതു താങ്ങാനാകാത്തവൻ
  rationale: ‘അവന്റെ കൈ എത്തുന്നില്ല’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സാമ്പത്തിക അർഥം വ്യക്തമാക്കുകയും മൂലത്തിലെ ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ഒരു ആൺകുഞ്ഞാട്
  rationale: כֶּבֶשׂ ആൺകുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നതിനാൽ യാഗനിയമത്തിലെ ലിംഗനിർണ്ണയം സംരക്ഷിക്കുന്നു.
- source_word: אָשָׁם
  choice: അകൃത്യയാഗം
  rationale: കുറ്റവും അതിനോടനുബന്ധിച്ച പരിഹാരവും ഉൾക്കൊള്ളുന്ന ഈ പ്രത്യേക യാഗവിഭാഗത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ സാങ്കേതിക പദം.
- source_word: לִתְנוּפָה
  choice: നീരാജനം ചെയ്യേണ്ട
  rationale: കുഞ്ഞാട് മറ്റൊരു പ്രത്യേക യാഗമല്ല; അകൃത്യയാഗമായ കുഞ്ഞാടിന്മേൽ നടത്തുന്ന ആചാരപരമായ ചലനമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: לְכַפֵּר עָלָיו
  choice: തനിക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുന്നതിനായി
  rationale: പുരോഹിതനിയമത്തിലെ כפר എന്ന പദത്തിന്റെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ ബലം നിലനിർത്തുന്നു; അതിന്റെ രീതി സംബന്ധിച്ച പ്രത്യേക സിദ്ധാന്തം ചേർക്കുന്നില്ല.
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: ഒരു ഏഫയുടെ പത്തിലൊന്നു നേരിയ മാവ്
  rationale: עִשָּׂרוֹן എന്ന അളവ് യാഗനിയമങ്ങളിൽ ഏഫയുടെ പത്തിലൊന്നായി മനസ്സിലാക്കപ്പെടുന്നു; סֹלֶת നന്നായി അരിച്ച നേരിയ മാവാണ്.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയെന്ന ആചാരനിർദേശം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְמִנְחָה
  choice: ഭോജനയാഗമായി
  rationale: ലേവ്യപുസ്തകത്തിലെ പ്രത്യേക ധാന്യയാഗവിഭാഗം തിരിച്ചറിയുന്ന പതിവ് മലയാള സാങ്കേതിക പദം.
- source_word: לֹג שָׁמֶן
  choice: ഒരു ലോഗ് എണ്ണ
  rationale: ലോഗ് ഒരു നിർദ്ദിഷ്ട പുരാതന ദ്രവ അളവായതിനാൽ അനിശ്ചിതമായ ആധുനിക തുല്യമായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിലെ യാഗസാങ്കേതിക പദങ്ങൾ
  choice: ‘അകൃത്യയാഗം’, ‘നീരാജനം’, ‘പ്രായശ്ചിത്തം’, ‘ഭോജനയാഗം’ എന്നീ വ്യത്യസ്ത ആചാരപദങ്ങൾ നിലനിർത്തി.
  alternative: ‘പരിഹാരയാഗം’, ‘ആചാരപരമായി സമർപ്പിക്കൽ’, ‘പാപപരിഹാരം’, ‘ധാന്യയാഗം’ എന്നിങ്ങനെ കൂടുതൽ വിശദീകരണാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠത്തിലെ വ്യത്യസ്ത യാഗവിഭാഗങ്ങളും പ്രവൃത്തികളും തമ്മിലുള്ള ഭേദം സംരക്ഷിക്കുമ്പോൾ, പ്രായശ്ചിത്തത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: לִתְנוּפָה എന്നതിന്റെ ബന്ധം
  choice: അകൃത്യയാഗമായ കുഞ്ഞാടിനെ ‘നീരാജനം ചെയ്യേണ്ടത്’ എന്നു നൽകി.
  alternative: കുഞ്ഞാടിനെ ‘നീരാജനയാഗമായി’ നൽകുക.
  rationale: ഇവിടെ വേറൊരു യാഗവിഭാഗം കൂട്ടിച്ചേർക്കുന്നതിലുപരി, അകൃത്യയാഗമായ കുഞ്ഞാടിന് നടത്തേണ്ട നീരാജനക്രിയയെയാണ് വ്യാകരണം സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമ-യാഗസന്ദർഭത്തിന്റെ കൃത്യതയ്ക്കായി പരിചിതമായ ബൈബിൾ സാങ്കേതിക പദങ്ങൾ നിലനിർത്തി; അളവുകൾക്ക് ആവശ്യമായിടത്ത് അടിക്കുറിപ്പ് നൽകി.
