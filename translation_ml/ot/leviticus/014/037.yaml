  text: וְ/רָאָ֣ה אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה הַ/נֶּ֨גַע֙ בְּ/קִירֹ֣ת הַ/בַּ֔יִת שְׁקַֽעֲרוּרֹת֙ יְרַקְרַקֹּ֔ת א֖וֹ אֲדַמְדַּמֹּ֑ת וּ/מַרְאֵי/הֶ֥ן שָׁפָ֖ל מִן הַ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/037.yaml
  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: ml
  text: അവൻ ബാധ പരിശോധിക്കണം. വീടിന്റെ ചുവരുകളിൽ പച്ചകലർന്നതോ ചുവപ്പുകലർന്നതോ ആയ കുഴിഞ്ഞ പാടുകളായി[a] ബാധ കാണപ്പെടുകയും അവ കാഴ്ചയിൽ ചുവരിനേക്കാൾ താഴ്ന്നവയായി കാണപ്പെടുകയും ചെയ്താൽ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “താഴ്ന്ന ഭാഗങ്ങൾ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, “ചുവരിനെക്കാൾ താഴ്ന്നവ”; അതായത്, ചുവരിന്റെ ഉപരിതലത്തിൽനിന്ന് ഉള്ളിലേക്കു കുഴിഞ്ഞതായി കാണപ്പെടുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: അവൻ ... പരിശോധിക്കണം
  rationale: പുരോഹിതൻ രോഗലക്ഷണം നിർണയിക്കുന്ന നടപടിക്രമസന്ദർഭമായതിനാൽ, വെറുതെ ‘കാണുക’ എന്നതിനെക്കാൾ ‘പരിശോധിക്കുക’ എന്ന അർഥം യോജിക്കുന്നു.
- source_word: הַנֶּגַע
  choice: ബാധ
  rationale: ലേവ്യർ 13–14-ൽ മനുഷ്യരിലും വസ്തുക്കളിലും വീടുകളിലും കാണുന്ന അസാധാരണമായ ബാധിതാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ബാധ’ വൈദ്യശാസ്ത്രപരമായി അതിരുകടന്ന് നിർവചിക്കാതെ മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: '... കാണപ്പെടുകയും ... ചെയ്താൽ'
  rationale: നിയമപരമായ പരിശോധനാവിവരണത്തിൽ പരിശോധനയിൽ കണ്ടെത്തുന്ന അവസ്ഥയെ നിബന്ധനയായി അവതരിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּקִירֹת הַבַּיִת
  choice: വീടിന്റെ ചുവരുകളിൽ
  rationale: ബാധ ചുവരിന്റെ ഉള്ളിലോ ഉപരിതലത്തിലോ ദൃശ്യമാകുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള കുഴിഞ്ഞ രൂപവിവരണത്തോടും പൊരുത്തപ്പെടുന്നു.
- source_word: שְׁקַעֲרוּרֹת
  choice: കുഴിഞ്ഞ പാടുകൾ
  rationale: അപൂർവമായ ഈ പദം പൊള്ളയായോ താഴ്ന്നോ കാണപ്പെടുന്ന ഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘കുഴിഞ്ഞ പാടുകൾ’ സാധാരണ വായനക്കാർക്ക് ദൃശ്യരൂപം വ്യക്തമായി നൽകുന്നു.
- source_word: יְרַקְרַקֹּת
  choice: പച്ചകലർന്ന
  rationale: പൂർണമായ പച്ചനിറമെന്നതിലുപരി പച്ചച്ചായയുള്ള നിറത്തെ ആവർത്തിത രൂപം സൂചിപ്പിക്കുന്നു.
- source_word: אֲדַמְדַּמֹּת
  choice: ചുവപ്പുകലർന്ന
  rationale: കടുത്ത ശുദ്ധചുവപ്പല്ല, ചുവപ്പുചായയുള്ള നിറമാണ് ആവർത്തിത വിശേഷണരൂപം സൂചിപ്പിക്കുന്നത്.
- source_word: וּמַרְאֵיהֶן
  choice: അവയുടെ കാഴ്ച
  rationale: കണ്ണിൽ ദൃശ്യമാകുന്ന ഭാവത്തെയാണ് מַרְאֶה സൂചിപ്പിക്കുന്നത്; ‘കാഴ്ച’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: שָׁפָל מִן הַקִּיר
  choice: ചുവരിന്റെ ഉപരിതലത്തേക്കാൾ താഴ്ന്നതായി തോന്നുക
  rationale: അക്ഷരാർഥം ‘ചുവരിനെക്കാൾ താഴ്ന്നത്’ എന്നാണ്. ഇവിടെ പാടുകൾ ചുവരിന്റെ നിരപ്പിൽനിന്ന് ഉള്ളിലേക്കു കുഴിഞ്ഞതായി കാണപ്പെടുന്നതാണ് ആശയം; ‘തോന്നുക’ ദൃശ്യപരിശോധനയുടെ സ്വഭാവം നിലനിർത്തുന്നു.
