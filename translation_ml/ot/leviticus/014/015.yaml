    text: ‘ലോഗ്’ പുരാതനകാലത്തെ ഒരു ദ്രാവക അളവായിരുന്നു.
    reason: cultural_note
  revision_rationale: The revision clarifies that ‘log’ is an ancient measure without substituting an uncertain modern equivalent, improves Malayalam idiom, and removes unwarranted emphatic force. It preserves the ritual sequence and all source details.
