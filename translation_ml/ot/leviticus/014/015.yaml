translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള നിർദേശാത്മക ശൈലി. ആവർത്തിച്ചിരിക്കുന്ന പുരോഹിതസൂചനയിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘തന്റെതന്നെ’ ഉപയോഗിച്ചു; പുരാതന അളവുപദം വിശദീകരണ അടിക്കുറിപ്പോടെ നിലനിർത്തി.
