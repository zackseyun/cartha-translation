  to: പിന്നെ പുരോഹിതൻ എണ്ണയുടെ ഒരു ലോഗ് അളവിൽനിന്ന് കുറച്ച് എടുത്ത് തന്റെ ഇടത്തെ ഉള്ളംകൈയിലേക്ക് ഒഴിക്കണം.[a]
