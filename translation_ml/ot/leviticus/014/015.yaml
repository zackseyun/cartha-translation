source:
  edition: WLC
  text: וְ/לָקַ֥ח הַ/כֹּהֵ֖ן מִ/לֹּ֣ג הַ/שָּׁ֑מֶן וְ/יָצַ֛ק עַל כַּ֥ף הַ/כֹּהֵ֖ן הַ/שְּׂמָאלִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/015.yaml
  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ എണ്ണയുടെ ഒരു ലോഗ് അളവിൽനിന്ന് കുറച്ച് എടുത്ത് തന്റെ ഇടത്തെ ഉള്ളംകൈയിലേക്ക് ഒഴിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലോഗ്’ പുരാതനകാലത്തെ ഒരു ദ്രാവക അളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: പിന്നെ ... എടുത്ത്
  rationale: വാവ് ചേർന്ന ഖാതൽ രൂപം ആചാരക്രമത്തിലെ അടുത്ത നടപടിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പിന്നെ ... എടുത്ത്’ എന്നത് ആ ക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാക്രമസന്ദർഭത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ പരിഭാഷ.
- source_word: מִלֹּג הַשָּׁמֶן
  choice: ആ എണ്ണയുടെ ഒരു ലോഗിൽനിന്ന് കുറച്ച്
  rationale: מִן ഇവിടെ ഉറവിടത്തെയും ഭാഗിക അളവിനെയും സൂചിപ്പിക്കുന്നു; മുഴുവൻ അളവും എടുക്കുന്നു എന്ന ധാരണ ഒഴിവാക്കി, ലോഗ് അളവിലുള്ള എണ്ണയിൽനിന്ന് കുറച്ച് എടുക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: לֹג
  choice: ലോഗ്
  rationale: ഇത് പുരാതന ദ്രാവക അളവാണ്; അനിശ്ചിതമായ ആധുനിക തുല്യഅളവ് നൽകാതെ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: וְיָצַק
  choice: ഒഴിക്കണം
  rationale: ആചാരനിയമത്തിലെ നിർദേശാത്മക ശക്തി മലയാളത്തിൽ ‘ഒഴിക്കണം’ എന്ന രൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל כַּף
  choice: ഉള്ളംകൈയിലേക്ക്
  rationale: עַל അക്ഷരാർഥത്തിൽ ‘മേൽ’ എന്നാണെങ്കിലും, കുഴിഞ്ഞ കൈയിൽ ദ്രാവകം ഒഴിക്കുന്ന പ്രവൃത്തി മലയാളത്തിൽ ‘ഉള്ളംകൈയിലേക്ക്’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം.
- source_word: כַּף
  choice: ഉള്ളംകൈ
  rationale: כַּף കൈയെ പൊതുവായി അല്ല, പ്രത്യേകിച്ച് കൈപ്പത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ഉള്ളംകൈ’ ആ ദൃശ്യമായ ആചാരവിശദാംശം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: הַשְּׂמָאלִית
  choice: ഇടത്തെ
  rationale: പുരോഹിതന്റെ ഇടതുകൈപ്പത്തിയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണരൂപം ഉപയോഗിച്ചു.
