  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘരേഖ നിലനിർത്തി; അടിക്കുറിപ്പിന്റെ സൂചകം ബന്ധപ്പെട്ട പ്രയോഗത്തിനു പിന്നാലെ ചേർത്തു.
