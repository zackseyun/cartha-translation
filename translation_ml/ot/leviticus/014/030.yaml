source:
  edition: WLC
  text: וְ/עָשָׂ֤ה אֶת הָֽ/אֶחָד֙ מִן הַ/תֹּרִ֔ים א֖וֹ מִן בְּנֵ֣י הַ/יּוֹנָ֑ה מֵ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: ml
  text: അവൻ തന്റെ കഴിവിനനുസരിച്ച്[a] ഒരു കുറുപ്രാവിനെയോ ഒരു പ്രാവിൻകുഞ്ഞിനെയോ അർപ്പിക്കണം—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അവന്റെ കൈ എത്തുന്നതിൽനിന്ന്’; ‘അവനു വഹിക്കാനാകുന്ന ചെലവിനനുസരിച്ച്’ എന്നർഥമുള്ള എബ്രായ പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: അർപ്പിക്കണം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, യാഗസന്ദർഭത്തിൽ ബലി അർപ്പിക്കുന്ന പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶת־הָאֶחָד
  choice: ഒരു
  rationale: തുടർന്ന് പറയുന്ന രണ്ട് പക്ഷിവർഗങ്ങളിൽനിന്ന് ഒരെണ്ണം എന്ന വിതരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִן־הַתֹּרִים
  choice: ഒരു കുറുപ്രാവിനെ
  rationale: תֹּר എന്നത് യാഗനിയമങ്ങളിൽ പൊതുവായ ‘പ്രാവ്’ എന്നതിലുപരി പ്രത്യേകമായി turtledove-നെ സൂചിപ്പിക്കുന്നു; അതിന് മലയാളത്തിൽ ‘കുറുപ്രാവ്’ ഉപയോഗിച്ചു.
- source_word: אוֹ מִן־בְּנֵי הַיּוֹנָה
  choice: അല്ലെങ്കിൽ ഒരു പ്രാവിൻകുഞ്ഞിനെ
  rationale: בְּנֵי הַיּוֹנָה എന്ന സ്ഥിരപ്രയോഗം ഇളം പ്രാവുകളെ, അഥവാ പ്രാവിൻകുഞ്ഞുങ്ങളെ, സൂചിപ്പിക്കുന്നു.
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: തന്റെ കഴിവിനനുസരിച്ച്
  rationale: അക്ഷരാർഥം ‘അവന്റെ കൈ എത്തുന്നതിൽനിന്ന്’ എന്നാണ്; സാമ്പത്തികശേഷിയെ സൂചിപ്പിക്കുന്ന ഈ എബ്രായ പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
