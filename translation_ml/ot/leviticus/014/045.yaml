source:
  edition: WLC
  text: וְ/נָתַ֣ץ אֶת הַ/בַּ֗יִת אֶת אֲבָנָי/ו֙ וְ/אֶת עֵצָ֔י/ו וְ/אֵ֖ת כָּל עֲפַ֣ר הַ/בָּ֑יִת וְ/הוֹצִיא֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: ml
  text: പിന്നെ അവൻ ആ വീടും അതിന്റെ കല്ലുകളും മരഭാഗങ്ങളും വീടിന്റെ തേപ്പ് മുഴുവനും[a] ഇടിച്ചുകളഞ്ഞ് അവയെ നഗരത്തിനു പുറത്തുള്ള അശുദ്ധമായ ഒരു സ്ഥലത്തേക്കു കൊണ്ടുപോകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘വീടിന്റെ പൊടി മുഴുവനും.’ ഈ നിർമാണസന്ദർഭത്തിൽ ചുരണ്ടിയെടുത്ത മൺതേപ്പോ കുമ്മായമോ പോലുള്ള ചുവർപദാർഥത്തെയാകാം ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ
  choice: പിന്നെ അവൻ ... ഇടിച്ചുകളയണം
  rationale: נתץ ഇവിടെ മലിനമായ വീട് പൊളിച്ചുനീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ ക്രമാനുഗതമായ waw-നെ ‘പിന്നെ’ എന്നും പ്രവൃത്തിയുടെ ശക്തിയെ ‘ഇടിച്ചുകളയണം’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַבַּיִת
  choice: ആ വീട്
  rationale: בית ഇവിടെ താമസസ്ഥലത്തിന്റെ ഭൗതിക ഘടനയാണ്; മലയാളത്തിൽ ‘വീട്’ കൃത്യവും സാധാരണവുമായ പദമാണ്. നിർദ്ദിഷ്ടമായ പരിശോധനയിലുള്ള വീടിനെ ‘ആ’ സൂചിപ്പിക്കുന്നു.
- source_word: אֲבָנָיו
  choice: അതിന്റെ കല്ലുകൾ
  rationale: എബ്രായ ബഹുവചനം അക്ഷരാർഥത്തിൽ വീടിന്റെ കല്ലുകളെയാണ് സൂചിപ്പിക്കുന്നത്; പൊളിക്കൽ നടപടിയിലെ ദൃശ്യമായ ഘടകം നിലനിർത്തുന്നു.
- source_word: עֵצָיו
  choice: അതിന്റെ മരസാമഗ്രികൾ
  rationale: പദം വീടിലെ മരം/മരഘടകങ്ങൾ എന്ന വിശാല അർഥം വഹിക്കുന്നു. ‘മരസാമഗ്രികൾ’ എന്നത് കൃത്യമായി കിടാത്ത ‘തടികൾ’ എന്ന പരിമിതീകരണം ഒഴിവാക്കി ഘടനയിലെ മരഭാഗങ്ങളെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: כָּל עֲפַר הַבָּיִת
  choice: വീടിന്റെ തേപ്പുമുഴുവനും
  rationale: עפר അക്ഷരാർഥത്തിൽ ‘പൊടി/മണ്ണ്’ ആണെങ്കിലും, ചുവരുകൾ ചുരണ്ടുന്ന ഈ നിർമാണസന്ദർഭത്തിൽ ചുവരിലെ മൺതേപ്പോ കുമ്മായമോ പോലുള്ള പാളിയെയാണ് സൂചിപ്പിക്കാൻ സാധ്യത. ‘തേപ്പ്’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന നിർമാണപദമാണ്; അക്ഷരാർഥത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהוֹצִיא
  choice: കൊണ്ടുപോകണം
  rationale: ഹിഫീൽ രൂപം വസ്തുക്കളെ പുറത്തേക്കു നീക്കുന്നതാണ്. പൊളിച്ച സാമഗ്രികളുടെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം മലയാളത്തിൽ ‘കൊണ്ടുപോകണം’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֶל מִחוּץ לָעִיר
  choice: നഗരത്തിനു പുറത്തുള്ള
  rationale: നഗരപരിധിക്കപ്പുറത്തേക്കുള്ള ദിശയും സ്ഥാനവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל מָקוֹם טָמֵא
  choice: അശുദ്ധമായ ഒരു സ്ഥലത്തേക്ക്
  rationale: טמא ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ ശുദ്ധി-അശുദ്ധി വ്യവസ്ഥയിലെ മുഖ്യപദമാണ്. ‘അശുദ്ധമായ’ ഈ നിയമപരവും ആചാരപരവുമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആചാരപരമായ ശുദ്ധി-അശുദ്ധി പദപ്രയോഗം
  choice: അശുദ്ധമായ
  alternative: മലിനമായ
  rationale: טמא ഇവിടെ സാധാരണ ഭൗതിക അഴുക്കിനേക്കാൾ ആചാരപരവും നിയമപരവുമായ നിലയെ സൂചിപ്പിക്കുന്നു. ‘അശുദ്ധമായ’ എന്നത് ആ വ്യത്യാസം നിലനിർത്തുകയും അനാവശ്യമായ പിൽക്കാല ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, നിയമനിർദേശത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ ക്രമം em dash ഉപയോഗിച്ച് വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പ് ചർച്ച ചെയ്യുന്ന പദത്തിനുതന്നെ [a] അടയാളം ചേർത്തിരിക്കുന്നു.
