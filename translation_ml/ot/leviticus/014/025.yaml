source:
  edition: WLC
  text: וְ/שָׁחַט֮ אֶת כֶּ֣בֶשׂ הָֽ/אָשָׁם֒ וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/דַּ֣ם הָֽ/אָשָׁ֔ם וְ/נָתַ֛ן עַל תְּנ֥וּךְ אֹֽזֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: ml
  text: പിന്നെ അവൻ അകൃത്യയാഗത്തിനുള്ള ആട്ടിൻകുട്ടിയെ അറുക്കണം. പുരോഹിതൻ അകൃത്യയാഗത്തിന്റെ രക്തത്തിൽനിന്ന് കുറച്ചെടുത്ത് ശുദ്ധീകരിക്കപ്പെടുന്നവന്റെ വലതു ചെവിയുടെ അറ്റത്തും[a] അവന്റെ വലതുകൈയിലെ പെരുവിരലിലും വലതുകാലിലെ പെരുവിരലിലും പുരട്ടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വലതു ചെവിയുടെ പുറത്തെ അഗ്രഭാഗത്ത്.’ എബ്രായപദം ചെവിയുടെ പുറത്തെ അറ്റഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: അറുക്കണം
  rationale: യാഗസന്ദർഭത്തിലെ സാങ്കേതിക ക്രിയാഭാവം നിലനിർത്തുന്നു; പൊതുവായ ‘കൊല്ലണം’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: അകൃത്യയാഗത്തിനുള്ള ആട്ടിൻകുട്ടി
  rationale: ആട്ടിൻകുട്ടി אָשָׁם എന്ന പ്രത്യേക യാഗത്തിനായി നിയോഗിക്കപ്പെട്ടതാണ് എന്ന ഘടനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָשָׁם
  choice: അകൃത്യയാഗം
  rationale: അമൂർത്തമായ കുറ്റബോധമല്ല, ലേവ്യപുസ്തകത്തിലെ പ്രത്യേക യാഗവിഭാഗമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ പദപ്രയോഗവുമായി ചേർന്നുനിൽക്കുന്ന സാങ്കേതിക സംജ്ഞയാണ്.
- source_word: מִדַּם הָאָשָׁם
  choice: അകൃത്യയാഗത്തിന്റെ രക്തത്തിൽനിന്ന് കുറച്ച്
  rationale: מִן എന്നതിന്റെ അംശസൂചക അർഥം വ്യക്തമാക്കുന്നു; മുഴുവൻ രക്തമല്ല, അതിൽ ഒരു ഭാഗമാണ് ഉപയോഗിക്കുന്നത്.
- source_word: תְּנוּךְ אֹזֶן
  choice: ചെവിയുടെ അറ്റം
  rationale: ചെവിയുടെ പുറത്തെ അഗ്രഭാഗം എന്ന മൂലപദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘ചെവിക്കുട’ എന്നു പറഞ്ഞ് അനിശ്ചിതമായ ശരീരഭാഗം അതിയായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: הַמִּטַּהֵר
  choice: ശുദ്ധീകരിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നവൻ
  rationale: ഹിത്പയേൽ വർത്തമാനകൃദന്തത്തിന്റെ പുരോഗമിക്കുന്ന ശുദ്ധീകരണപ്രക്രിയ സംരക്ഷിക്കുന്നു.
- source_word: בֹּהֶן יָדוֹ
  choice: കൈയുടെ പെരുവിരൽ
  rationale: കൈയോടൊപ്പം വരുമ്പോൾ בֹּהֶן വിരലുകളിൽ പെരുവിരലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בֹּהֶן רַגְלוֹ
  choice: കാലിന്റെ പെരുവിരൽ
  rationale: കാലിനോടൊപ്പം വരുമ്പോൾ בֹּהֶן വലിയ കാൽവിരലിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘കാലിന്റെ പെരുവിരൽ’ സ്വാഭാവികമാണ്.
- source_word: וְנָתַן
  choice: പുരട്ടണം
  rationale: രക്തം നിർദ്ദിഷ്ട ശരീരഭാഗങ്ങളിൽ ഇടുന്ന ആചാരപ്രവർത്തി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אָשָׁם എന്ന യാഗസംജ്ഞയുടെ പരിഭാഷ
  choice: അകൃത്യയാഗം
  alternative: കുറ്റയാഗം; പ്രായശ്ചിത്തപരിഹാരയാഗം
  rationale: വാക്യം ഒരു പ്രത്യേക ലേവ്യയാഗത്തെക്കുറിച്ചാണ്. ‘അകൃത്യയാഗം’ സാങ്കേതിക യാഗസംജ്ഞയായി ഉപയോഗിച്ച്, പിൽക്കാല സിദ്ധാന്തപരമായ വിശദീകരണങ്ങൾ വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ആചാരനിർദ്ദേശ ശൈലി. ആവർത്തിക്കുന്ന ‘വലതു’ എന്ന നിർദ്ദേശം മൂലവാചകത്തിന്റെ കൃത്യതയ്ക്കായി നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളുടെ മാർക്കറുകൾ ഉള്ളടക്കവുമായി പൊരുത്തമില്ലാത്തതായി തോന്നുന്നതിനാൽ, എബ്രായത്തിലെ യഥാർത്ഥ ശാബ്ദിക അനിശ്ചിതത്വമായ ചെവിയുടെ അറ്റഭാഗത്തോട് മാത്രം [a] ചേർത്തിരിക്കുന്നു.
