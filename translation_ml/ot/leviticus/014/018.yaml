  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: ml
  text: പുരോഹിതന്റെ ഉള്ളംകൈയിൽ ശേഷിച്ചിരിക്കുന്ന എണ്ണ അവൻ ശുദ്ധീകരിക്കപ്പെടുന്നവന്റെ തലയിൽ ഇടണം. യഹ്‌വെയുടെ സന്നിധിയിൽ പുരോഹിതൻ അവനുവേണ്ടി പ്രായശ്ചിത്തം നടത്തണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: എണ്ണയിൽ ശേഷിക്കുന്നത്
  rationale: נותר എന്ന പദത്തിന്റെ ‘ശേഷിക്കുന്നത്’ എന്ന അർഥവും בַּשֶּׁמֶן എന്നതിന്റെ സന്ദർഭോചിതമായ ഭാഗികബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: പുരോഹിതന്റെ ഉള്ളംകൈയിലുള്ള
  rationale: כַּף ഇവിടെ കൈയുടെ ഉള്ളംഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. എണ്ണ കൈയിൽ പിടിച്ചിരിക്കുന്ന സന്ദർഭത്തിൽ ‘ഉള്ളംകൈയിലുള്ള’ എന്നത് עַל എന്ന ബന്ധത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: തലയിൽ അവൻ ഇടണം
  rationale: נתן എന്ന പൊതുവായ ‘വയ്ക്കുക/ഇടുക’ എന്ന ക്രിയയെ അനാവശ്യമായി ‘പുരട്ടുക’ എന്നു പ്രത്യേകീകരിക്കാതെ, ആചാരനടപടിയുടെ രൂപം നിലനിർത്തുന്നു.
- source_word: הַמִּטַּהֵר
  choice: ശുദ്ധീകരിക്കപ്പെടുന്നവൻ
  rationale: טהר എന്ന ക്രിയയുടെ ഹിത്പയേൽ വർത്തമാന കൃദന്തരൂപം ആചാരപരമായ ശുദ്ധീകരണപ്രക്രിയയിൽ കഴിയുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രക്രിയ മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: וְכִפֶּר עָלָיו
  choice: അവനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പുരോഹിതാചാരസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ സ്ഥാപിതമായ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി കാത്തുസൂക്ഷിക്കുമ്പോൾ, עליו എന്നത് ‘അവനുവേണ്ടി’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘സന്നിധിയിൽ’ എന്ന അർഥവും יהוה എന്ന ഉടമ്പടിനാമത്തിന്റെ വ്യക്തിനാമസ്വഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ ചതുരക്ഷരനാമം നേരിട്ട് ഉള്ളതിനാൽ അത് ഒരു ബിരുദമായി മാറ്റാതെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: പുരോഹിതാചാരത്തിലെ כפר
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  alternative: പരിഹാരം വരുത്തുക / ശുദ്ധീകരണം നടത്തുക
  rationale: ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തത്തിലേക്ക് അർഥം ചുരുക്കാതെ ലേവ്യപുസ്തകത്തിലെ ആചാര-ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യാപ്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. രണ്ടു സ്വതന്ത്ര പ്രവർത്തനങ്ങളെ വ്യക്തമായി കാണിക്കാൻ വാക്യം രണ്ടായി വിഭജിച്ചു; ആദ്യവാക്യത്തിലെ ‘അവൻ’ പുരോഹിതനെയാണ് സൂചിപ്പിക്കുന്നത്.
