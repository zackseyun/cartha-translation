  yaml_path: translation/ot/leviticus/014/055.yaml
  text: and for a skin disease in a garment or in a house,[a]
translation:
  language: ml
  text: വസ്ത്രത്തിന്റെയും വീട്ടിന്റെയും സാരാത്തിനെക്കുറിച്ചും[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദമായ ‘സാരാത്ത്’ പരമ്പരാഗതമായി ‘കുഷ്ഠം’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. എന്നാൽ ലേവ്യപുസ്തകത്തിൽ ഇത് മനുഷ്യരെ മാത്രമല്ല, വസ്ത്രങ്ങളെയും വീടുകളെയും ബാധിക്കുന്ന വിവിധതരം ബാധകളെയോ മലിനതകളെയോ ഉൾക്കൊള്ളുന്ന വിശാലമായ പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְ
  choice: എന്നതിനെക്കുറിച്ചും
  rationale: മുൻവാക്യങ്ങളിൽ ആരംഭിച്ച, നിയമം ബാധകമായ വിഷയങ്ങളുടെ പട്ടിക ഇതു തുടരുന്നു. മലയാളത്തിലെ ‘-ക്കുറിച്ചും’ പട്ടികാസംബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: צָרַעַת
  choice: സാരാത്ത്
  rationale: ഈ എബ്രായപദം മനുഷ്യരുടെ ചർമത്തെ മാത്രമല്ല, വസ്ത്രങ്ങളെയും വീടുകളെയും ബാധിക്കുന്ന പ്രതിഭാസങ്ങൾക്കും ഉപയോഗിക്കുന്നു. അതിനാൽ ‘കുഷ്ഠം’ അല്ലെങ്കിൽ ‘ചർമരോഗം’ എന്നു ചുരുക്കാതെ ലിപ്യന്തരണം ചെയ്ത് അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַבֶּגֶד
  choice: വസ്ത്രത്തിൽ
  rationale: നിശ്ചയാർഥക പ്രത്യയമുള്ള ഏകവചന നാമം ഇവിടെ ഒരു വിഭാഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വസ്ത്രത്തിൽ’ എന്ന രൂപം സ്വാഭാവികമാണ്.
- source_word: וְלַבָּיִת
  choice: വീട്ടിലോ
  rationale: സന്ദർഭത്തിൽ ഒരേ പ്രതിഭാസം കാണപ്പെടാവുന്ന മറ്റൊരു ഇടത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ലോ ... -ലോ’ ഘടന വസ്ത്രം/വീട് എന്ന വിതരണാത്മക വികൽപബന്ധം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഇത് മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ അവസാന ഘടകമായതിനാൽ പൂർണ്ണവാക്യമെന്നതിലുപരി തുടർച്ച സൂചിപ്പിക്കുന്ന ഖണ്ഡവാക്യരൂപവും അവസാനത്തിൽ ദീർഘവിരാമവും നിലനിർത്തി.
