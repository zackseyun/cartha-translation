  yaml_path: translation/ot/leviticus/014/050.yaml
  text: Then he shall slaughter the one bird into an earthenware vessel over living water[a].
translation:
  language: ml
  text: പിന്നെ അവൻ ആ പക്ഷികളിൽ ഒന്നിനെ ഒരു മൺപാത്രത്തിലേക്ക്, ഒഴുകുന്ന വെള്ളത്തിനുമീതെ, അറുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ജീവനുള്ള വെള്ളം”; അതായത്, കെട്ടിക്കിടക്കാത്ത പുതുവെള്ളമോ ഒഴുകുന്ന വെള്ളമോ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: പിന്നെ അവൻ ... അറുക്കണം
  rationale: ക്രമമായി നടക്കുന്ന ശുദ്ധീകരണച്ചടങ്ങിലെ അടുത്ത നിർദേശം എന്ന നിലയിൽ വാവ്-തുടർച്ചയുടെ ആശയം ‘പിന്നെ’ എന്നും നിർദേശാത്മകത ‘അറുക്കണം’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַצִּפֹּר הָאֶחָת
  choice: ഒരു പക്ഷിയെ
  rationale: മുമ്പ് പറഞ്ഞ രണ്ടു പക്ഷികളിൽ ഒന്നിനെ വേർതിരിച്ചുകാണിക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ആദ്യത്തെ’ എന്ന ക്രമസൂചന ചേർക്കുന്നില്ല.
- source_word: אֶל
  choice: മൺപാത്രത്തിലേക്കു
  rationale: അറുക്കുമ്പോൾ രക്തം പാത്രത്തിലേക്കു വീഴുന്ന ചടങ്ങിന്റെ ദിശയും ഫലവും സൂചിപ്പിക്കുന്നു.
- source_word: כְּלִי חֶרֶשׂ
  choice: ഒരു മൺപാത്രം
  rationale: കളിമണ്ണുകൊണ്ടുള്ള പാത്രം എന്ന വസ്തുസ്വഭാവം ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל
  choice: ശുദ്ധജലത്തിനുമീതെ
  rationale: പാത്രത്തിലുള്ള വെള്ളത്തിനുമീതെ പക്ഷിയെ അറുക്കുന്ന ചടങ്ങിന്റെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: מַיִם חַיִּים
  choice: ശുദ്ധജലം
  rationale: അക്ഷരാർഥം ‘ജീവനുള്ള വെള്ളം’ ആണെങ്കിലും ഇവിടെ കെട്ടിക്കിടക്കാത്ത പുതുതോ ഒഴുകുന്നതോ ആയ വെള്ളമാണ് ചടങ്ങിൽ ഉദ്ദേശിക്കുന്നത്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മַיִם חַיִּים എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ശുദ്ധജലം
  alternative: ജീവനുള്ള വെള്ളം; ഒഴുകുന്ന വെള്ളം
  rationale: ചടങ്ങിലെ പ്രായോഗിക നിർദേശം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; അതേസമയം പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും വിശാലമായ ബൈബിൾ പ്രതിധ്വനിയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ‘അറുക്കണം’ ചടങ്ങുസംബന്ധമായ കൊല്ലലിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ‘മൺപാത്രം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
