  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: ml
  text: 'അപ്പോൾ പുരോഹിതൻ കല്പിക്കണം: ശുദ്ധീകരിക്കപ്പെടുന്നവനുവേണ്ടി ജീവനുള്ള ശുദ്ധമായ രണ്ടു പക്ഷികൾ, ദേവദാരുത്തടി, കടുംചുവപ്പുനൂൽ[a], ഈസോപ്പ്[b] എന്നിവ എടുക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘കടുംചുവപ്പുനൂൽച്ചരട്.’ שְׁנִי תוֹלַעַת എന്ന എബ്രായ പ്രയോഗം കടുംചുവപ്പു ചായം പിടിപ്പിച്ച വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; അത് ഏതു രൂപത്തിലുള്ള വസ്തുവായിരുന്നു എന്നത് കൃത്യമായി വ്യക്തമല്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘ഈസോപ്പ്’ എന്നു വിളിക്കുന്ന സസ്യം കൃത്യമായി ഏതാണെന്നത് അനിശ്ചിതമാണ്; പരമ്പരാഗത പരിഭാഷ ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: അപ്പോൾ പുരോഹിതൻ കല്പിക്കണം
  rationale: ക്രമാനുസൃതമായ ആചാരനിർദേശത്തിൽ waw തുടർന്നുള്ള ഘട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ പുരോഗതി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ക്രിയയുടെ നിർദേശാത്മക ഭാവം ‘കല്പിക്കണം’ എന്നതിൽ നിലനിർത്തുന്നു.
- source_word: וְלָקַח
  choice: എടുക്കണം
  rationale: രൂപപരമായി മൂന്നാം പുരുഷ ഏകവചനമായിരുന്നാലും, പുരോഹിതന്റെ കല്പനയ്ക്കു പിന്നാലെയുള്ള ഈ പ്രയോഗം ആവശ്യമായ സാധനങ്ങൾ എടുക്കണമെന്ന ആചാരനിർദേശമായി മനസ്സിലാക്കാം. വ്യക്തമായി പറയാത്ത നിർവാഹകനെ മലയാളത്തിൽ ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: לַמִּטַּהֵר
  choice: ശുദ്ധീകരിക്കപ്പെടുന്നവനുവേണ്ടി
  rationale: Hitpael വർത്തമാന കൃദന്തം ആചാരപരമായ ശുദ്ധീകരണപ്രക്രിയയിൽ ഉള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; പൂർത്തിയായ അവസ്ഥയെന്നതിലുപരി തുടരുന്ന പ്രക്രിയ ഈ പരിഭാഷയിൽ നിലനിൽക്കുന്നു.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: രണ്ടു പക്ഷികൾ
  rationale: צִפּוֹר പൊതുവായ ‘പക്ഷി’ എന്ന പദമാണ്; ‘കുരുവി’ പോലുള്ള കൂടുതൽ നിർദിഷ്ടമായ തിരിച്ചറിയൽ മൂലത്തിൽ ഇല്ല.
- source_word: חַיּוֹת
  choice: ജീവനുള്ള
  rationale: പക്ഷികൾ ചത്തവയല്ല, ജീവനുള്ളവയായിരിക്കണമെന്ന വ്യത്യാസം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: טְהֹרוֹת
  choice: ശുദ്ധമായ
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ പശ്ചാത്തലത്തിൽ טהור എന്നതിന്റെ സാധാരണ അർഥം ‘ശുദ്ധമായ’ എന്നാണ്; മുഖ്യവാചകത്തിൽ ‘ആചാരപരമായി’ എന്നു വിശദീകരിച്ച് അർഥം അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: עֵץ אֶרֶז
  choice: ദേവദാരുത്തടി
  rationale: ദേവദാരുവിൽനിന്നുള്ള മരവസ്തുവിനെയാണ് construct phrase സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ രൂപമാണിത്.
- source_word: שְׁנִי תוֹלַעַת
  choice: കടുംചുവപ്പുനൂൽ
  rationale: ഈ പ്രയോഗം കടുംചുവപ്പു ചായം പിടിപ്പിച്ച വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ആചാരത്തിൽ ഉപയോഗിക്കുന്ന വസ്തുവെന്ന നിലയിൽ ‘നൂൽ’ വ്യക്തവും സ്വാഭാവികവുമാണ്; കൃത്യമായ രൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֵזֹב
  choice: ഈസോപ്പ്
  rationale: സസ്യത്തിന്റെ കൃത്യമായ സസ്യശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ, ബൈബിൾ ആചാരസന്ദർഭങ്ങളിൽ പതിവായ പരമ്പരാഗത നാമം നിലനിർത്തുന്നു.
