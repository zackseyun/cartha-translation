translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആചാരനിയമത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. പട്ടികയിലെ എല്ലാ വസ്തുക്കളും പുരോഹിതന്റെ കല്പനയ്ക്കു കീഴിൽ വരുന്നതായി വാക്യഘടന വ്യക്തമാക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനഭ്രംശം തിരുത്തി: [a] കടുംചുവപ്പുനൂലിനോടും [b] ഈസോപ്പിനോടും ചേർത്തിരിക്കുന്നു.'
