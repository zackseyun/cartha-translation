  text: וְ/הֶעֱלָ֧ה הַ/כֹּהֵ֛ן אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה הַ/מִּזְבֵּ֑חָ/ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/טָהֵֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: ml
  text: പുരോഹിതൻ ഹോമയാഗവും ധാന്യയാഗവും യാഗപീഠത്തിന്മേൽ അർപ്പിക്കും. പുരോഹിതൻ അവനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കും; അവൻ ശുദ്ധനായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, “അവൻ ശുദ്ധീകരിക്കപ്പെടും.” എബ്രായം കൂടുതൽ അക്ഷരാർത്ഥത്തിൽ ഫലമായുള്ള നിലയെ പ്രസ്താവിക്കുന്നു: “അവൻ ശുദ്ധനായിരിക്കും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: അർപ്പിക്കണം
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ വെറുതെ മുകളിലേക്കു കൊണ്ടുവരുക എന്നതല്ല, യാഗപീഠത്തിന്മേൽ അർപ്പിക്കുക എന്നാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ അനുഷ്ഠാനനിർദേശ ശൈലിക്ക് ‘അർപ്പിക്കണം’ സ്വാഭാവികമാണ്.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗനിയമങ്ങളിൽ עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപദമാണ്; മലയാള ബൈബിൾ ഭാഷയിലും പൊതുവായി മനസ്സിലാകുന്ന ‘ഹോമയാഗം’ അതിന്റെ സ്ഥാപിത തത്തുല്യമാണ്.
- source_word: הַמִּנְחָה
  choice: ധാന്യയാഗം
  rationale: ഈ പുരോഹിതീയ യാഗസന്ദർഭത്തിൽ מִנְחָה പൊതുവായ സമ്മാനമോ കാഴ്ചയോ അല്ല, ധാന്യംകൊണ്ടുള്ള യാഗമാണ്.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: מזבח എന്ന പദത്തോടു ചേർന്ന ദിശാസൂചകാന്ത്യം ഇവിടെ യാഗം യാഗപീഠത്തിന്മേൽ അർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְכִפֶּר עָלָיו
  choice: അവനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പുരോഹിതീയ യാഗസന്ദർഭത്തിൽ כפר എന്നത് പ്രായശ്ചിത്തം നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; עָלָיו ഇവിടെ ശുദ്ധീകരിക്കപ്പെടുന്ന വ്യക്തിക്കുവേണ്ടി എന്ന ഗുണഭോക്തൃബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וְטָהֵר
  choice: അവൻ ശുദ്ധനായിരിക്കും
  rationale: Qal രൂപം അനുഷ്ഠാനത്തിനു ശേഷമുള്ള ഫലസ്ഥിതിയാണ് നേരിട്ട് പ്രസ്താവിക്കുന്നത്. ‘ശുദ്ധീകരിക്കപ്പെടും’ എന്ന പ്രക്രിയാഭാവം ചേർക്കാതെ ‘ശുദ്ധനായിരിക്കും’ എബ്രായത്തിന്റെ രൂപവും ആശയവും കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതീയ നിയമത്തിലെ ശുദ്ധിയുടെ സ്വഭാവം
  choice: അനുഷ്ഠാനപരമായ ശുദ്ധസ്ഥിതി സൂചിപ്പിക്കുന്ന ‘ശുദ്ധനായിരിക്കും’
  alternative: ധാർമിക വിശുദ്ധി അല്ലെങ്കിൽ ആന്തരിക നൈതിക പരിവർത്തനം സൂചിപ്പിക്കുന്ന ഭാഷ
  rationale: ലേവ്യപുസ്തകം 14-ലെ സന്ദർഭം ത്വഗ്രോഗവുമായി ബന്ധപ്പെട്ട അശുദ്ധിക്കുശേഷമുള്ള അനുഷ്ഠാനപരമായ പുനഃസ്ഥാപനമാണ്. അതിനാൽ മൂലപാഠത്തിലെ ലളിതമായ ശുദ്ധി-പദം നിലനിർത്തുകയും നൈതിക പരിവർത്തനം എന്ന ആശയം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ അനുഷ്ഠാനനിയമ ശൈലി സ്വീകരിച്ചു. ‘ഹോമയാഗം,’ ‘ധാന്യയാഗം,’ ‘യാഗപീഠം,’ ‘പ്രായശ്ചിത്തം’ എന്നീ പരിചിതമായ ആരാധനാപദങ്ങൾ നിലനിർത്തി. എബ്രായത്തിലെ ക്രമാനുസൃത പ്രവൃത്തികളെ മലയാളത്തിൽ വ്യക്തമായ രണ്ടു വാക്യങ്ങളായി അവതരിപ്പിച്ചു; ‘അപ്പോൾ’ ഫലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
