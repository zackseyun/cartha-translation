  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ പാപയാഗം[a] അർപ്പിക്കണം; സ്വന്തം അശുദ്ധിയിൽനിന്ന് ശുദ്ധീകരണം പ്രാപിക്കുന്നവന്നുവേണ്ടി പ്രായശ്ചിത്തം നടത്തണം. അതിനുശേഷം അവൻ ഹോമയാഗത്തെ അറുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ശുദ്ധീകരണയാഗം.’ ലേവ്യ ആചാരസന്ദർഭങ്ങളിൽ എബ്രായപദമായ חַטָּאת ശുദ്ധീകരണത്തിനായി ഉപയോഗിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: അർപ്പിച്ച്
  rationale: പദശഃ ‘ചെയ്യുക’ എന്നാണെങ്കിലും, യാഗസന്ദർഭത്തിൽ ഒരു യാഗം അനുഷ്ഠിക്കുകയോ അർപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യ ആചാരസന്ദർഭത്തിലെ നിർദിഷ്ട പുരോഹിതനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַחַטָּאת
  choice: പാപയാഗം
  rationale: ഇവിടെ യാഗക്രിയയുടെ കർമമായതിനാൽ ‘പാപം’ എന്നതിലുപരി യാഗത്തിന്റെ സാങ്കേതികനാമമാണ്; പരിചിതമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְכִפֶּר עַל
  choice: വേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ כפר എന്ന ക്രിയയുടെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു; עַל ഗുണഭോക്താവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַמִּטַּהֵר
  choice: ശുദ്ധീകരിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നവൻ
  rationale: ഹിത്പയേൽ പങ്കാളിക്രിയയുടെ പ്രക്രിയാത്മകവും മധ്യ/പ്രതിഫലനസാധ്യതയുള്ളതുമായ അർത്ഥം അതിയായി നിർണയിക്കാതെ, ആ വ്യക്തി ആചാരപരമായ ശുദ്ധീകരണപ്രക്രിയയിൽ ആണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: מִטֻּמְאָתוֹ
  choice: തന്റെ അശുദ്ധിയിൽനിന്ന്
  rationale: טֻמְאָה ലേവ്യപുസ്തകത്തിൽ ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു; മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായ പ്രതിഫലനരൂപമായ ‘തന്റെ’ കൊണ്ട് സംരക്ഷിക്കുന്നു.
- source_word: וְאַחַר
  choice: അതിനുശേഷം
  rationale: ആചാരക്രമത്തിലെ തുടർന്നുള്ള ഘട്ടം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: יִשְׁחַט
  choice: അറുക്കണം
  rationale: യാഗമൃഗത്തെ ആചാരപരമായി അറുക്കുന്നതിന് മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: הָעֹלָה
  choice: ഹോമയാഗമൃഗം
  rationale: עלה എന്ന യാഗനാമത്തെ ‘ഹോമയാഗം’ എന്നു നിലനിർത്തുകയും, അറുക്കപ്പെടുന്നത് യാഗമൃഗമാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ലേവ്യ യാഗസന്ദർഭത്തിൽ חַטָּאת എന്നതിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: חַטָּאת ഇവിടെ ഒരു സാങ്കേതിക യാഗനാമമാണ്. ‘പാപയാഗം’ വ്യാപകമായി പരിചിതമായ പദമായതിനാൽ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണമാണ് സന്ദർഭമെന്നതിനാൽ ‘ശുദ്ധീകരണയാഗം’ എന്ന യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: כפר എന്ന ക്രിയയുടെ ദൈവശാസ്ത്രപരമായ പരിധി
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  alternative: ശുദ്ധീകരണം വരുത്തുക
  rationale: ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം അടിച്ചേൽപ്പിക്കാതെ, പുരോഹിതയാഗഭാഷയുടെ പരമ്പരാഗതവും വിശാലവുമായ ആചാര-ദൈവശാസ്ത്ര അർത്ഥം നിലനിർത്തുന്നു.
- issue: מִטֻּמְאָתוֹയിലെ ഏകവചന പുല്ലിംഗ സൂചന
  choice: തന്റെ അശുദ്ധി
  alternative: അവരുടെ അശുദ്ധി
  rationale: എബ്രായത്തിലെ ഏകവചനസൂചന സംരക്ഷിക്കുന്നു; മലയാളത്തിലെ ‘തന്റെ’ സന്ദർഭത്തിലുള്ള വ്യക്തിയിലേക്കു വ്യക്തമായി മടങ്ങുകയും അനാവശ്യമായ ബഹുവചന നിഷ്പക്ഷീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ‘പാപയാഗം,’ ‘പ്രായശ്ചിത്തം,’ ‘ഹോമയാഗം’ എന്നീ സ്ഥാപിത ആചാരപദങ്ങൾ നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
