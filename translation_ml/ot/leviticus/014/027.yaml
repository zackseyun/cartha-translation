source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/כֹּהֵן֙ בְּ/אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ തന്റെ ഇടങ്കൈയിലെ ഉള്ളങ്കൈയിൽ ഉള്ള എണ്ണയിൽനിന്ന് കുറച്ച് തന്റെ വലതുകൈയിലെ വിരൽകൊണ്ട് യാഹ്‌വെയുടെ സന്നിധിയിൽ ഏഴു പ്രാവശ്യം തളിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: പിന്നെ ... തളിക്കണം
  rationale: ഹിഫീൽ രൂപം ആചാരപരമായ സന്ദർഭത്തിൽ ‘തളിക്കുക’ എന്നാണ്. തുടക്കത്തിലെ וְ നടപടിക്രമത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘പിന്നെ’ എന്നു നൽകി.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാക്രമത്തിൽ സേവിക്കുന്ന כֹּהֵן എന്ന പദത്തിന്റെ പ്രചാരത്തിലുള്ള, വ്യക്തമായ മലയാളരൂപം.
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: തന്റെ വലത്തെ വിരൽകൊണ്ട്
  rationale: ഏത് വിരലെന്ന് മൂലപാഠം വ്യക്തമാക്കുന്നില്ല; ഏകവചനവും വലതുവശത്തിനുള്ള ഊന്നലും അതേപടി നിലനിർത്തുന്നു.
- source_word: מִן הַשֶּׁמֶן
  choice: എണ്ണയിൽനിന്ന് കുറച്ച്
  rationale: 'מִן ഇവിടെ അംശസൂചകമാണ്: ഉള്ളംകൈയിലെ എണ്ണ മുഴുവനുമല്ല, അതിൽനിന്ന് ഒരു ഭാഗമാണ് തളിക്കുന്നത്.'
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: തന്റെ ഇടത്തെ ഉള്ളംകൈയിലുള്ള
  rationale: כַּף ഇവിടെ പൊതുവായ ‘കൈ’ എന്നതിനെക്കാൾ എണ്ണ വച്ചിരിക്കുന്ന ‘ഉള്ളംകൈ’യെ സൂചിപ്പിക്കുന്നു.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: എണ്ണത്തിന്റെ ആവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי ദൈവസാന്നിധ്യത്തിൽ നടക്കുന്ന ആചാരപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; യഹോവ എന്ന നിയമനാമം വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ദീർഘകാലമായി പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു. ഇതിലൂടെ പാഠത്തിലുള്ള നിയമനാമത്തിന്റെ സ്വഭാവം നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ആചാരനിയമത്തിന് യോജിച്ച ഗൗരവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ നടപടിക്രമഭാഷയും ഉപയോഗിച്ചു. ‘തളിക്കണം’ എന്ന രൂപം നിയമപരമായ നിർദേശം സ്വാഭാവികമായി നൽകുന്നു.
