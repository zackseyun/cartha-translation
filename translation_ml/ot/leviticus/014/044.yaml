review_pass:
  verdict: revise
  source_fidelity: The procedural force, priestly inspection, spread of the nega, and final ritual status are conveyed accurately. However, «ക്ഷയബാധ» normally suggests wasting disease/decay and introduces a more specific sense than צָרַעַת warrants in this context. The Hebrew names a house-affecting ritual impurity category, not a diagnosed physical process.
  naturalness: The Malayalam is clear and appropriately formal. Replacing «ക്ഷയബാധ» with «അശുദ്ധിബാധ» avoids the misleading clinical/structural-decay association while retaining readable modern usage.
  terminology: «പുരോഹിതൻ», «പരിശോധിക്കണം», «ബാധ», and «അശുദ്ധമാണ്» are suitable. «അശുദ്ധിബാധ» is a safer contextual rendering of צָרַעַת for a house than «ക്ഷയബാധ», «ചർമ്മരോഗം», or «പൂപ്പൽ».
  issues:
  - severity: medium
    issue: «ക്ഷയബാധ» for צָרַעַת
    rationale: In modern Malayalam, «ക്ഷയബാധ» can imply a wasting illness or material deterioration. The Hebrew does not identify the house condition as decay, nor as a specific disease; it designates the broader ritual-impurity category called צָרַעַת.
