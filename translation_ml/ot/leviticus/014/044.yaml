  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ വന്ന് പരിശോധിക്കണം; ആ ബാധ വീട്ടിൽ പടർന്നിട്ടുണ്ടെങ്കിൽ, അത് വീട്ടിലെ നാശകാരിയായ അശുദ്ധിബാധയാണ്[a]; ആ വീട് അശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ צָרַעַת എന്ന പദം പരമ്പരാഗതമായി ‘കുഷ്ഠം’ എന്നു വിവർത്തനം ചെയ്യപ്പെട്ടിട്ടുണ്ടെങ്കിലും, അത് ആധുനിക കുഷ്ഠരോഗത്തെ സൂചിപ്പിക്കുന്നില്ല. വ്യക്തികൾക്കും വസ്ത്രങ്ങൾക്കും വീടുകൾക്കും പ്രയോഗിക്കുന്ന വിശാലമായ ആചാരപരമായ അശുദ്ധിവർഗമാണ് അത്. ‘നാശകാരിയായ’ എന്നതിന് ‘മാരകമായ’ അല്ലെങ്കിൽ ‘ദ്രവിപ്പിക്കുന്ന’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַכֹּהֵן
  choice: പിന്നെ പുരോഹിതൻ വന്ന്
  rationale: നിയമനടപടികളുടെ ക്രമം സൂചിപ്പിക്കുന്ന വാവ് + ഖാതൽ രൂപത്തിന് സ്വാഭാവികമായ മലയാള നടപടിക്രമഭാഷ നൽകി; നിർദിഷ്ട പുരോഹിതനെ സൂചിപ്പിക്കുന്ന ഭാവവും നിലനിർത്തി.
- source_word: וְרָאָה
  choice: പരിശോധിക്കണം
  rationale: അക്ഷരാർഥത്തിൽ ‘കാണുക’ എന്നാണെങ്കിലും ഇവിടെ പുരോഹിതന്റെ ഔദ്യോഗിക പരിശോധനയാണ് ഉദ്ദേശ്യം.
- source_word: וְהִנֵּה פָּשָׂה
  choice: പടർന്നിട്ടുണ്ടെങ്കിൽ
  rationale: പരിശോധനയിൽ കണ്ടെത്തുന്ന വ്യവസ്ഥയും ബാധയുടെ വ്യാപനവും സ്വാഭാവികമായ നിയമനടപടി ശൈലിയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: הַנֶּגַע
  choice: ബാധ
  rationale: വീടിനെ ബാധിച്ച അടയാളം/ദോഷം എന്ന വിശാല അർഥം നൽകുന്നു; ആധുനിക വൈദ്യശാസ്ത്രപരമായ ‘അണുബാധ’ എന്ന അനാവശ്യ കൃത്യത ഒഴിവാക്കുന്നു.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: വിനാശകരമായ ക്ഷയബാധ
  rationale: צָרַעַת ഇവിടെ മനുഷ്യചർമ്മരോഗമല്ല, വീടിനും പ്രയോഗിക്കുന്ന ആചാരപരമായ അശുദ്ധിബാധാവർഗമാണ്. ‘ക്ഷയബാധ’ ഘടനയെ നശിപ്പിക്കുന്ന ദോഷത്തെ സൂചിപ്പിക്കുന്നു; מַמְאֶרֶת എന്നതിന്റെ ഗുരുതരവും നശിപ്പിക്കുന്നതുമായ ഭാവം ‘വിനാശകരമായ’ എന്ന് നൽകുന്നു.
- source_word: טָמֵא הוּא
  choice: ആ വീട് അശുദ്ധമാണ്
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ നിലയെ സൂചിപ്പിക്കുന്ന טמא എന്ന പദത്തിന് സ്ഥിരവും വ്യക്തവുമായ ‘അശുദ്ധം’ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ പുല്ലിംഗ സർവനാമത്തിന്റെ സൂചിതപദമായ വീടിനെ മലയാളത്തിൽ തുറന്നുപറഞ്ഞു.
theological_decisions:
- issue: വീടിനെക്കുറിച്ച് ഉപയോഗിച്ച צָרַעַת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ക്ഷയബാധ
  alternative: കുഷ്ഠം; പൂപ്പൽ; ചർമ്മരോഗം
  rationale: ഈ പദം ആധുനിക ഹാൻസൻസ് രോഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; വ്യക്തികൾക്കും വസ്ത്രങ്ങൾക്കും വീടുകൾക്കും ബാധകമായ ആചാരപരമായ അശുദ്ധിവർഗമാണ്. ‘കുഷ്ഠം’യും ‘ചർമ്മരോഗം’യും വീടിന്റെ സാഹചര്യത്തിൽ തെറ്റിദ്ധരിപ്പിക്കും; ‘പൂപ്പൽ’ ഹീബ്രു പദം നിർണ്ണയിക്കാത്ത പ്രത്യേക ഭൗതിക കാരണം ചേർക്കും. അതിനാൽ വിശാലവും സാഹചര്യോചിതവുമായ ‘ക്ഷയബാധ’ തിരഞ്ഞെടുത്തു.
- issue: അശുദ്ധിയുടെ വിഷയം
  choice: ആ വീട് അശുദ്ധമാണ്
  alternative: അത് അശുദ്ധമാണ്
  rationale: അവസാനത്തെ הוּא വ്യാകരണപരമായി ‘വീട്’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്. മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കാൻ സൂചിതപദം വ്യക്തമാക്കി; ബാധയെക്കാൾ വീടിന്റെ ആചാരപരമായ നിലയാണ് വാക്യം പ്രഖ്യാപിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ലേവ്യനിയമങ്ങളുടെ നടപടിക്രമശൈലി നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ഭാഷ ഉപയോഗിച്ചു. ആധുനിക വൈദ്യനിർണയമോ പൂപ്പലെന്ന പ്രത്യേക ശാസ്ത്രീയ തിരിച്ചറിയലോ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
