translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആചാരപരമായ അശുദ്ധിയെ ‘അശുദ്ധൻ’ എന്നു നിലനിർത്തി; ആധുനിക വൈദ്യക്വാറന്റീൻ എന്ന പരിമിത അർഥം വരാതിരിക്കാൻ ‘വേർതിരിച്ചിടപ്പെട്ടിരിക്കുന്ന’ എന്നു തിരഞ്ഞെടുത്തു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
