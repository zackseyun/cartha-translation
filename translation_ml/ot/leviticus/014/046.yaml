  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: ml
  text: വീട് വേർതിരിച്ചു വെച്ചിരിക്കുന്ന എല്ലാ ദിവസങ്ങളിലും അതിനകത്ത് കടക്കുന്നവൻ വൈകുന്നേരം വരെ അശുദ്ധനായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അടച്ചുവെച്ചിരിക്കുന്ന” അല്ലെങ്കിൽ “നിയന്ത്രണത്തിൽ വെച്ചിരിക്കുന്ന.” പുരോഹിതന്റെ പരിശോധനയ്ക്കായി വീടിനെ വേർതിരിച്ചു നിയന്ത്രണത്തിൽ വെക്കുന്നതിനെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: കടക്കുന്നവൻ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ കൃദന്തം പൊതുവായ നിയമപ്രസ്താവനയിൽ ‘കടക്കുന്ന ഏതൊരാളും’ എന്ന അർഥത്തിൽ നാമവാചകമായി പ്രവർത്തിക്കുന്നു; ‘കടക്കുന്നവൻ’ മലയാളത്തിൽ സ്വാഭാവികവും നിയമപരമായ പൊതുവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: אֶל הַ/בַּיִת
  choice: വീടിനകത്തു
  rationale: בוא എന്ന ക്രിയയോടുകൂടിയ אֶל വീടിന്റെ ഉള്ളിലേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു; ‘വീടിനകത്തു കടക്കുക’ ലക്ഷ്യവും ചലനവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כָּל יְמֵי
  choice: ദിവസങ്ങളിലെല്ലാം
  rationale: വേർതിരിച്ചിടൽ നിലനിൽക്കുന്ന മുഴുവൻ കാലയളവും ഈ നിയമം ബാധകമാണെന്ന കാലപരിധി ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: הִסְגִּיר אֹתוֹ
  choice: വീട് വേർതിരിച്ചിടപ്പെട്ടിരിക്കുന്ന
  rationale: ലേവ്യർ 13–14-ലെ סגר പുരോഹിതപരിശോധനയ്ക്കായി നിയന്ത്രണത്തിൽ വേർതിരിച്ചിടുന്നതിനെ സൂചിപ്പിക്കുന്നു. കർത്താവ് ഹീബ്രുവിൽ വ്യക്തമായി പറയാത്തതിനാൽ കർമണിപ്രയോഗം ആ അവ്യക്തത കാത്തുസൂക്ഷിക്കുന്നു; ‘ക്വാറന്റീൻ’ എന്ന ആധുനിക വൈദ്യശാസ്ത്രസൂചനയും ഒഴിവാക്കുന്നു.
- source_word: יִטְמָא
  choice: അശുദ്ധനായിരിക്കും
  rationale: ആചാരപരമായ അശുദ്ധാവസ്ഥയിലാകുന്നതോ അതിൽ ഇരിക്കുന്നതോ ആണ് അർഥം; ഭാവികാലരൂപം നിയമപ്രസ്താവനയുടെ ഫലം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עַד הָעָרֶב
  choice: വൈകുന്നേരംവരെ
  rationale: താൽക്കാലികമായ ആചാരാശുദ്ധിയുടെ കാലാവധി വൈകുന്നേരംവരെയാണെന്ന പതിവ് ലേവ്യപ്രയോഗം സംക്ഷിപ്തമായി പകർന്നു നൽകുന്നു.
