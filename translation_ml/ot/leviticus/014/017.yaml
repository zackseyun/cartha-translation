id: LEV.14.17
reference: Leviticus 14:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/יֶּ֨תֶר הַ/שֶּׁ֜מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ יִתֵּ֤ן הַ/כֹּהֵן֙ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַ֖ל דַּ֥ם הָ/אָשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: ml
  text: പുരോഹിതന്റെ ഉള്ളങ്കൈയിൽ ശേഷിച്ചിരിക്കുന്ന എണ്ണയിൽനിന്ന് കുറച്ച്, ശുദ്ധീകരിക്കപ്പെടുന്നവന്റെ വലതുചെവിയുടെ മടലിലും[a] വലതുകൈയുടെ പെരുവിരലിലും വലതുകാലിന്റെ പെരുവിരലിലും, അകൃത്യയാഗത്തിന്റെ രക്തത്തിന്മേൽ[b] പുരോഹിതൻ പുരട്ടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വലതുചെവിയുടെ അറ്റത്ത്.’ എബ്രായപദം ചെവിയുടെ പുറത്തെ അറ്റഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ഈ ആചാരസന്ദർഭത്തിൽ ‘ചെവിയുടെ മടൽ’ എന്നാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അകൃത്യയാഗത്തിന്റെ രക്തമുള്ള അതേ സ്ഥാനത്ത്.’ മുമ്പേ രക്തം പുരട്ടിയ സ്ഥാനത്താണ് എണ്ണയും പുരട്ടുന്നത് എന്നാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיֶּתֶר הַשֶּׁמֶן
  choice: ശേഷിച്ചിരിക്കുന്ന എണ്ണയിൽനിന്ന് കുറച്ച്
  rationale: מִן ചേർന്ന יֶתֶר ശേഷിപ്പിൽനിന്നുള്ള ഒരു ഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘കുറച്ച്’ എന്നു ചേർക്കുന്നത് മുഴുവൻ ശേഷിപ്പും ഇവിടെ ഉപയോഗിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: עַל כַּפּוֹ
  choice: പുരോഹിതന്റെ ഉള്ളങ്കൈയിൽ
  rationale: כַּף കൈയുടെ ഉള്ളങ്കൈയെയോ കുഴിഞ്ഞ ഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സർവനാമം പുരോഹിതനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ നാമം വ്യക്തമാക്കി.
- source_word: יִתֵּן
  choice: പുരട്ടണം
  rationale: נתן അടിസ്ഥാനമായി ‘വയ്ക്കുക/ഇടുക’ എന്നാണ്. എണ്ണ ശരീരത്തിലെ നിർദ്ദിഷ്ട ഭാഗങ്ങളിൽ പ്രയോഗിക്കുന്ന ഈ ആചാരസന്ദർഭത്തിൽ ‘പുരട്ടണം’ സ്വാഭാവികവും പ്രവൃത്തിയെ കൃത്യമായി വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: תְּנוּךְ אֹזֶן
  choice: ചെവിത്തുമ്പ്
  rationale: ഈ അപൂർവ പദം ചെവിയുടെ പുറത്തെ അറ്റഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ആചാരസന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന സ്വാഭാവിക പദമാണ് ‘ചെവിത്തുമ്പ്’.
- source_word: הַמִּטַּהֵר
  choice: ശുദ്ധീകരിക്കപ്പെടുന്നവൻ
  rationale: ഹിത്പയേൽ വർത്തമാന കൃദന്തം ആചാരപരമായ ശുദ്ധീകരണപ്രക്രിയയ്ക്ക് വിധേയനാകുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; പ്രക്രിയാഭാവം നിലനിർത്തി.
- source_word: בֹּהֶן יָדוֹ / בֹּהֶן רַגְלוֹ
  choice: കൈയുടെ പെരുവിരൽ / കാലിന്റെ പെരുവിരൽ
  rationale: בֹּהֶן കൈയെ സംബന്ധിക്കുമ്പോൾ thumb-ഉം കാലിനെ സംബന്ധിക്കുമ്പോൾ big toe-ഉം ആണ്. മലയാളത്തിൽ രണ്ടിനും സന്ദർഭാനുസൃതമായി ‘പെരുവിരൽ’ സ്വാഭാവികമാണ്.
- source_word: עַל דַּם הָאָשָׁם
  choice: അകൃത്യയാഗത്തിന്റെ രക്തത്തിന്മേൽ
  rationale: അവയവങ്ങളിൽ മുമ്പേ പുരട്ടിയ അകൃത്യയാഗരക്തത്തിന്റെ അതേ സ്ഥാനത്തിന്മേൽ എണ്ണ പുരട്ടുന്നതാണ് עַל സൂചിപ്പിക്കുന്നത്. ‘രക്തത്തിന്മേൽ’ ഈ സ്ഥലബന്ധം നിലനിർത്തുന്നു.
- source_word: הָאָשָׁם
  choice: അകൃത്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ പ്രത്യേക യാഗവിഭാഗമായ אָשָׁם-ന് മലയാളത്തിൽ പരിചിതമായ സാങ്കേതിക പദം; കുറ്റബാധ്യതയുമായി ബന്ധം നിലനിർത്തുന്നു, എന്നാൽ വ്യാഖ്യാനപരമായ അധിക ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: אָשָׁם എന്ന യാഗസാങ്കേതിക പദത്തിന്റെ പരിഭാഷ
  choice: അകൃത്യയാഗം
  alternative: കുറ്റപരിഹാരയാഗം / നഷ്ടപരിഹാരയാഗം
  rationale: אָשָׁם കുറ്റമോ ബാധ്യതയോ സംബന്ധിച്ച ഒരു നിർദ്ദിഷ്ട ലേവ്യയാഗമാണ്. ‘അകൃത്യയാഗം’ പരിചിതമായ സാങ്കേതിക പദമായി ആ യാഗവിഭാഗത്തെ തിരിച്ചറിയിക്കുന്നു; ‘പരിഹാരം’ അല്ലെങ്കിൽ ‘നഷ്ടപരിഹാരം’ എന്നു ചേർത്ത് അർത്ഥത്തെ ഒരേയൊരു ദിശയിൽ പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: അവസാനത്തെ עַל സൂചിപ്പിക്കുന്ന എണ്ണയും രക്തവും തമ്മിലുള്ള ബന്ധം
  choice: രക്തത്തിന്മേൽ
  alternative: രക്തമുള്ള അതേ സ്ഥാനത്ത്
  rationale: എണ്ണ മുമ്പ് പുരട്ടിയ രക്തത്തിന്മേലാണോ അതേ സ്ഥാനത്താണോ എന്ന സൂക്ഷ്മ വ്യത്യാസം പൂർണമായി തീർപ്പാക്കാതെ എബ്രായത്തിലെ സ്ഥലബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ആചാരസന്ദർഭം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ആചാരഭാഷ ഉപയോഗിച്ചു. നീണ്ട എബ്രായവാക്യത്തിന്റെ ബന്ധങ്ങൾ നിലനിർത്തിക്കൊണ്ട്, അവസാനത്തെ ‘രക്തത്തിന്മേൽ’ എന്ന ഘടകം മൂന്നു അവയവങ്ങളിലെയും പ്രയോഗവുമായി ബന്ധപ്പെടുന്നതായി ഡാഷുകൾകൊണ്ട് വ്യക്തമാക്കി. സാങ്കേതിക യാഗപദമായി ‘അകൃത്യയാഗം’ സ്ഥിരതയ്ക്കായി നിലനിർത്തി.
