translation:
  language: ml
  text: അപ്പോൾ പുരോഹിതൻ ബാധയുള്ള കല്ലുകൾ[a] നീക്കംചെയ്ത് നഗരത്തിനു പുറത്തുള്ള അശുദ്ധമായ ഒരു സ്ഥലത്തേക്ക് എറിഞ്ഞുകളയാൻ കൽപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബാധ അവയിൽ ഉള്ള കല്ലുകൾ.’ എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ബാധ അവയിൽ ഉള്ള കല്ലുകൾ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: അപ്പോൾ ... കല്പിക്കണം
  rationale: വാവ് ചേർന്ന പൂർണ്ണക്രിയ ആചാരനടപടിയുടെ അടുത്ത ഘട്ടത്തെ നിർദേശാത്മകമായി തുടരുന്നു; ‘അപ്പോൾ’ ക്രമാനുഗതതയും ‘കല്പിക്കണം’ നിയമപരമായ നിർദേശബലവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യ ആചാരസന്ദർഭത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: וְחִלְּצוּ
  choice: എടുത്തുമാറ്റി
  rationale: ഭിത്തിയിൽനിന്ന് കല്ലുകൾ ഊരി നീക്കുന്നതാണ് സന്ദർഭം; പ്രവർത്തനരീതി അനാവശ്യമായി വിശദീകരിക്കാതെ നീക്കം ചെയ്യൽ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָאֲבָנִים
  choice: കല്ലുകൾ
  rationale: അവ വീടിന്റെ നിർമാണക്കല്ലുകളാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ലളിതവും മൂലത്തോട് അടുത്തതുമായ പദം മതി.
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: ബാധയുള്ള കല്ലുകൾ
  rationale: נֶגַע ഇവിടെ ആധുനിക വൈദ്യനിർണയം ഉറപ്പിക്കാത്ത, വീടിനെ ബാധിക്കുന്ന അശുദ്ധീകരണലക്ഷണമാണ്. സ്വാഭാവിക മലയാളത്തിനായി ബന്ധവാക്യം ചുരുക്കിയെങ്കിലും എബ്രായത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: എറിഞ്ഞുകളയാൻ
  rationale: കല്ലുകളെ പുറത്തേക്ക് കൊണ്ടുപോയി ഉപേക്ഷിക്കുന്ന പ്രവൃത്തി സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶל מִחוּץ לָעִיר
  choice: നഗരത്തിനു പുറത്ത്
  rationale: പട്ടണപരിധിക്ക് പുറത്തേക്കുള്ള ചലനവും ലക്ഷ്യസ്ഥാനവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל מָקוֹם טָמֵא
  choice: അശുദ്ധമായ ഒരു സ്ഥലത്ത്
  rationale: טָמֵא എന്ന ലേവ്യശുദ്ധിവ്യവസ്ഥയിലെ സാങ്കേതിക ആശയം ‘അശുദ്ധമായ’ എന്ന സ്ഥിരവും ഗ്രാഹ്യവുമായ പദംകൊണ്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധി-അശുദ്ധി പദാവലി
  choice: טָמֵא എന്നതിന് ‘അശുദ്ധമായ’, נֶגַע എന്നതിന് ‘ബാധ’
  alternative: ‘മലിനമായ/അശുദ്ധിയുള്ള’; ‘പൂപ്പൽ/കുഷ്ഠബാധ/രോഗബാധിത ഭാഗം’
  rationale: വാക്യം ആചാരപരമായ അശുദ്ധിയെക്കുറിച്ചാണ്; നിർദിഷ്ടമായ ആധുനിക രോഗമോ പൂപ്പലോ എന്നു മൂലപാഠം തീർച്ചപ്പെടുത്തുന്നില്ല. അതിനാൽ ‘ബാധ’ ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; ‘അശുദ്ധമായ’ ആചാരപരമായ വിഭാഗത്തെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമ-ആചാര ശൈലി. ദീർഘവും കൃത്രിമവുമായ ബന്ധവാക്യം ഒഴിവാക്കി, മൂലത്തിലെ അക്ഷരാർഥഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
