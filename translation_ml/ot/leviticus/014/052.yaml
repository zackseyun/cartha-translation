source:
  edition: WLC
  text: וְ/חִטֵּ֣א אֶת הַ/בַּ֔יִת בְּ/דַם֙ הַ/צִּפּ֔וֹר וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וּ/בַ/צִּפֹּ֣ר הַ/חַיָּ֗ה וּ/בְ/עֵ֥ץ הָ/אֶ֛רֶז וּ/בָ/אֵזֹ֖ב וּ/בִ/שְׁנִ֥י הַ/תּוֹלָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: ml
  text: ഇങ്ങനെ അവൻ പക്ഷിയുടെ രക്തത്താലും ജീവജലത്താലും[a] ജീവനുള്ള പക്ഷിയാലും ദേവദാരുമരക്കഷണത്താലും ഈസോപ്പുചെടിയാലും കടുംചുവപ്പുനൂലിനാലും[b] ആ വീടിനെ ശുദ്ധീകരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശുദ്ധജലം’ അല്ലെങ്കിൽ ‘ഒഴുകുന്ന വെള്ളം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘ജീവജലം’ എന്നാണ്; ഒഴുകുന്ന ശുദ്ധമായ ഉറവുവെള്ളത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘കടുംചുവപ്പുനിറം കൊടുത്ത നൂൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ശുദ്ധീകരണച്ചടങ്ങിൽ ഉപയോഗിച്ച കടുംചുവപ്പുനിറം കൊടുത്ത വസ്തുവിനെയാണ് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: ഇങ്ങനെ അവൻ ... ശുദ്ധീകരിക്കണം
  rationale: חטא എന്ന ധാതുവിന്റെ പീയേൽ രൂപം ഇവിടെ പാപം ചെയ്യിക്കുക എന്നല്ല, ആചാരപരമായി ശുദ്ധീകരിക്കുക എന്ന അർഥത്തിലാണ്. മുൻവാക്യത്തിലെ നടപടിയുമായി ബന്ധിപ്പിക്കാൻ וְ എന്ന ബന്ധകത്തിന്റെ സന്ദർഭബലം ‘ഇങ്ങനെ’ എന്നു നൽകി.
- source_word: הַבַּיִת
  choice: ആ വീടിനെ
  rationale: ഇവിടെ בַּיִת പൂപ്പൽപോലുള്ള ബാധയിൽനിന്ന് ആചാരപരമായി ശുദ്ധീകരിക്കപ്പെടുന്ന ഭൗതിക വീടിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּדַם הַצִּפּוֹר
  choice: പക്ഷിയുടെ രക്തത്താൽ
  rationale: בְ ഇവിടെ ശുദ്ധീകരണത്തിനുള്ള മാർഗമോ ഉപകരണമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ത്താൽ’ സ്വാഭാവികമാണ്.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: ജീവജലത്താൽ
  rationale: מַיִם חַיִּים എന്നത് അക്ഷരാർഥത്തിൽ ‘ജീവജലം’ എന്നും പ്രയോഗത്തിൽ പുതുതായി ഒഴുകുന്ന ഉറവുജലം എന്നും അർഥമാക്കാം. ആചാരപരമായ പദപ്രയോഗവും അന്തർപാഠബന്ധവും നിലനിർത്താൻ അക്ഷരാർഥരൂപം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ചു.
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: ജീവനുള്ള പക്ഷിയാൽ
  rationale: കൊല്ലപ്പെട്ട പക്ഷിയിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്ന חַיָּה എന്ന വിശേഷണം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וּבְעֵץ הָאֶרֶז
  choice: ദേവദാരുമരത്താൽ
  rationale: עֵץ הָאֶרֶז ആചാരത്തിൽ ഉപയോഗിച്ച ദേവദാരുവിന്റെ മരക്കഷണത്തെയോ മരവസ്തുവെയോ സൂചിപ്പിക്കുന്നു; ‘ദേവദാരുമരം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: וּבָאֵזֹב
  choice: ഈസോപ്പുചെടിയാൽ
  rationale: אֵזֹב എന്ന സസ്യത്തിന്റെ കൃത്യമായ സസ്യശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണെങ്കിലും, ബൈബിൾ ആചാരപരമായ പരമ്പരാഗത പദം നിലനിർത്താൻ ‘ഈസോപ്പ്’ ഉപയോഗിച്ചു; ‘ചെടി’ ചേർത്തത് അർഥവ്യക്തതയ്ക്കാണ്.
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: ചുവപ്പുനൂലിനാൽ
  rationale: ഈ പ്രയോഗം കടുംചുവപ്പുനിറം കൊടുത്ത നൂൽപോലുള്ള വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ‘ചുവപ്പുനൂൽ’ ആചാരോപകരണങ്ങളുടെ പട്ടികയിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
