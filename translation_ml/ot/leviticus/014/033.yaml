id: LEV.14.33
reference: Leviticus 14:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/033.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വെ[a] മോശയോടും അഹരോനോടും അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവം സംസാരിക്കുന്ന പുതിയ വചനഭാഗത്തെ പരിചയപ്പെടുത്തുന്ന സാധാരണ എബ്രായ ആഖ്യാനരൂപമാണിത്. ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ ‘അരുളിച്ചെയ്തു’ ഈ സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം (YHWH) ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതരായി മോശയെയും അഹരോനെയും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രവാക്യം മലയാളത്തിൽ കോളൺകൊണ്ട് സ്വാഭാവികമായി സൂചിപ്പിച്ചു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, YHWH എന്ന വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ‘യഹ്‌വെ’ എന്ന് ലിപ്യന്തരണം ചെയ്ത് മൂലത്തിലെ പ്രത്യേകത നിലനിർത്തി; പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. എബ്രായത്തിലെ വചനാരംഭസൂത്രത്തിന്റെ പ്രവർത്തനം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി.
