  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ ഒരു പക്ഷിയെ പുതുവെള്ളം നിറച്ച ഒരു മൺപാത്രത്തിനുമീതെ അറുക്കാൻ കൽപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജീവജലം”; അതായത്, ഒഴുകുന്നതോ പുതുതായി ലഭിച്ചതോ ആയ വെള്ളം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: പിന്നെ ... കല്പിക്കണം
  rationale: ക്രമാനുസൃതമായ ആചാരനിർദേശത്തിൽ വാവ് ചേർന്ന പൂർണക്രിയയ്ക്ക് തുടർനടപടിയുടെ നിർദേശാത്മക ഭാവമുണ്ട്; ‘പിന്നെ’ ക്രമവും ‘കല്പിക്കണം’ പുരോഹിതന്റെ അധികാരപരമായ നിർദേശവും വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാചാര-നിയമസന്ദർഭത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ സ്വാഭാവികവും സ്ഥിരവുമായ മലയാളപരിഭാഷ.
- source_word: וְשָׁחַט
  choice: അറുക്കാൻ
  rationale: രൂപത്തിൽ സകർമകക്രിയയായ ഇത് ‘കല്പിക്കണം’ എന്ന ക്രിയയോടു ചേർന്ന് കല്പിക്കപ്പെടുന്ന പ്രവൃത്തിയായി സ്വാഭാവിക മലയാളത്തിൽ infinitive രൂപത്തിൽ നൽകിയിരിക്കുന്നു; ആചാരപരമായ മൃഗവധത്തിന് ‘അറുക്കുക’ കൃത്യമാണ്.
- source_word: אֶת־הַצִּפּוֹר הָאֶחָת
  choice: ഒരു പക്ഷിയെ
  rationale: മുൻസന്ദർഭത്തിലെ രണ്ട് പക്ഷികളിൽ ഒന്നിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഒരു പക്ഷിയെ’ സ്വാഭാവികമായി ആ പ്രത്യേകീകരണശക്തി നിലനിർത്തുന്നു.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: ഒരു മൺപാത്രത്തിനുമീതെ
  rationale: രക്തം പാത്രത്തിലേക്കു വീഴുന്ന വിധത്തിൽ പക്ഷിയെ പാത്രത്തിനുമീതെ അറുക്കുന്നതാണ് സന്ദർഭസൂചന. ‘മൺപാത്രം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആചാരസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: עַל מַיִם חַיִּים
  choice: ശുദ്ധജലം നിറച്ച
  rationale: അക്ഷരാർഥം ‘ജീവജലം’; ഇവിടെ കെട്ടിക്കിടക്കാത്ത, പുതുതായി ലഭിച്ച ജലമാണ് ഉദ്ദേശ്യം. പാത്രത്തിൽ അത്തരം ജലം ഉള്ളതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥവും മറ്റു സാധ്യതയും അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: מַיִם חַיִּים എന്ന പ്രയോഗത്തിന്റെ ആചാരസന്ദർഭത്തിലുള്ള അർഥം
  choice: ശുദ്ധജലം
  alternative: ‘ജീവജലം’; അഥവാ ഒഴുകുന്ന വെള്ളം, പുതുവെള്ളം
  rationale: ഈ സന്ദർഭത്തിൽ പ്രയോഗം ശുദ്ധീകരണച്ചടങ്ങിൽ ഉപയോഗിക്കുന്ന കെട്ടിക്കിടക്കാത്ത പുതുജലത്തെ സൂചിപ്പിക്കുന്നു; പിന്നീടുള്ള ദൈവശാസ്ത്രപ്രതീകം മുഖ്യവാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല. എന്നാൽ മൂലത്തിലെ രൂപകസ്വഭാവവും അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിയമ-ആചാരഭാഷ ഉപയോഗിച്ചു. ‘അറുക്കാൻ കല്പിക്കണം’ മലയാളത്തിലെ സ്വാഭാവിക നിർദേശഘടനയാണ്; ‘മൺപാത്രം’ സാധാരണ വായനക്കാർക്ക് ‘കളിമൺപാത്രം’ എന്നതിനെക്കാൾ സുതാര്യമാണ്.
