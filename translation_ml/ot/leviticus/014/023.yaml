  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: ml
  text: എട്ടാം ദിവസം, തന്റെ ശുദ്ധീകരണത്തിനായി അവൻ അവയെ പുരോഹിതന്റെ അടുക്കലേക്കും സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിലേക്കും യാഹ്‌വേയുടെ സന്നിധിയിൽ കൊണ്ടുവരണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ ശുദ്ധിക്കായി.” ഇവിടെ എബ്രായപദം ആചാരപരമായ ശുദ്ധീകരണപ്രക്രിയയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: കൊണ്ടുവരണം
  rationale: നിയമപരമായ നിർദേശസന്ദർഭത്തിൽ ഈ ക്രിയയ്ക്ക് നിർദേശാത്മകമായ ഭാവികാലബലം ഉണ്ട്; ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘കൊണ്ടുവരണം’ വ്യക്തമാക്കുന്നു.
- source_word: אֹתָם
  choice: അവയെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ യാഗവസ്തുക്കളിലേക്കാണ് ബഹുവചന കർമസർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: എട്ടാം ദിവസം
  rationale: കാലസൂചനയായ എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לְטָהֳרָתוֹ
  choice: തന്റെ ശുദ്ധീകരണത്തിനായി
  rationale: ഈ സന്ദർഭത്തിൽ טהר എന്ന മൂലത്തിൽനിന്നുള്ള നാമം ആചാരപരമായ ശുദ്ധീകരണപ്രക്രിയയെ സൂചിപ്പിക്കുന്നു; ‘തന്റെ’ എന്നത് പുരുഷ ഏകവചന പ്രത്യയത്തെ നിലനിർത്തുന്നു.
- source_word: אֶל הַכֹּהֵן
  choice: പുരോഹിതന്റെ അടുക്കൽ
  rationale: ദിശ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാള പരിഭാഷ.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിങ്കൽ
  rationale: വസ്തുക്കൾ കൊണ്ടുവരേണ്ട സ്ഥലത്തെ വ്യക്തമാക്കുന്നു; אֹהֶל מוֹעֵד എന്ന സ്ഥാപിത ആശയം ‘സമാഗമകൂടാരം’ എന്ന് മാന്യവും മനസ്സിലാകുന്നതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസാന്നിധ്യത്തിലുള്ള ആരാധനാപരമായ സ്ഥാനം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദിവ്യനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം സംരക്ഷിക്കുമ്പോൾ മലയാള വായനക്കാർക്കിടയിൽ വ്യാപകമായി പരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു; ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റുന്നില്ല.
- issue: לְטָהֳרָתוֹ എന്ന ആചാരശുദ്ധിയുമായി ബന്ധപ്പെട്ട പദം
  choice: തന്റെ ശുദ്ധീകരണത്തിനായി
  alternative: തന്റെ ശുദ്ധിയാകലിനായി
  rationale: ത്വഗ്രോഗാനന്തര ആചാരപരമായ പുനഃസ്ഥാപനമാണ് സന്ദർഭം. ‘ശുദ്ധീകരണം’ ആ പ്രക്രിയയെ വ്യക്തമാക്കുന്നു; നൈതിക കുറ്റശുദ്ധി എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ലേവ്യപുസ്തകത്തിലെ നിയമനിർദേശത്തിന് യോജിച്ച മാന്യവും നേരിട്ടുള്ളതുമായ ശൈലി. വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയിട്ടുണ്ടെങ്കിലും മൂലത്തിലെ സമയം, ഉദ്ദേശ്യം, ദിശ, സ്ഥലം, ദൈവസാന്നിധ്യം എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
