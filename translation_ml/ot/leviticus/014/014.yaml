  source_fidelity: The draft accurately represents the priest’s prescribed actions, the partitive sense of מִדַּם, the guilt offering, the person undergoing cleansing, and the three right-side body parts. However, the possessive suffixes on ‘his right hand’ and ‘his right foot’ should be explicit in Malayalam, as they are for the ear.
