base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ അകൃത്യയാഗത്തിന്റെ രക്തത്തിൽനിന്ന് കുറെ എടുത്ത്[a], ശുദ്ധീകരിക്കപ്പെടുന്നവന്റെ വലതുചെവിയുടെ മടലിലും[b] അവന്റെ വലതുകൈയുടെ പെരുവിരലിലും അവന്റെ വലതുകാലിന്റെ പെരുവിരലിലും പുരട്ടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അകൃത്യയാഗത്തിന്റെ രക്തത്തിൽനിന്ന് എടുത്ത്.’ ആചാരത്തിനായി അതിൽനിന്ന് കുറെ എടുക്കുന്നതാണ് അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘വലത്തെ ചെവിയുടെ അറ്റത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם
  choice: രക്തത്തിൽനിന്ന് കുറെ
  rationale: מִן ഇവിടെ ഭാഗികത സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘രക്തത്തിൽനിന്ന് കുറെ എടുത്ത്’ എന്നു പറയുന്നത് രക്തം മുഴുവനുമല്ല, ആചാരത്തിനായി അതിൽനിന്ന് ഒരു ഭാഗമാണ് എടുക്കുന്നതെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הָאָשָׁם
  choice: അകൃത്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ ബലിവ്യവസ്ഥയിൽ אָשָׁם ഒരു പ്രത്യേക യാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘അകൃത്യയാഗം’ മലയാള ക്രൈസ്തവ വായനക്കാർക്ക് പരിചിതവും ഈ പ്രത്യേക യാഗത്തെ മറ്റു യാഗങ്ങളിൽനിന്ന് വേർതിരിക്കുന്നതുമായ പദമാണ്.
- source_word: תְּנוּךְ אֹזֶן
  choice: ചെവിയുടെ മടൽ
  rationale: ആചാരസന്ദർഭത്തിൽ תְּנוּךְ ചെവിയുടെ അറ്റത്തെയോ മൃദുഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ചെവിയുടെ മടൽ’ സാധ്യമായ ശരീരഭാഗത്തെ വ്യക്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു; പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַמִּטַּהֵר
  choice: ശുദ്ധീകരിക്കപ്പെടുന്നവൻ
  rationale: טהר എന്ന ധാതുവിന്റെ ഹിത്പയേൽ കൃദന്തം ഇവിടെ ശുദ്ധീകരണച്ചടങ്ങിന് വിധേയനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം നടന്നുകൊണ്ടിരിക്കുന്ന പ്രക്രിയയും സ്വീകരണഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: הַיְמָנִית
  choice: വലത്തെ
  rationale: ഓരോ ശരീരാവയവത്തിന്റെയും വലതുവശത്തേതാണ് ഉദ്ദേശിക്കുന്നത്. ‘വലത്തെ ചെവി/കൈ/കാൽ’ എന്നത് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: בֹּהֶן יָדוֹ
  choice: കൈയുടെ പെരുവിരൽ
  rationale: കൈയോടൊപ്പം വരുമ്പോൾ בֹּהֶן പെരുവിരലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בֹּהֶן רַגְלוֹ
  choice: കാലിന്റെ പെരുവിരൽ
  rationale: കാലിനോടൊപ്പം വരുമ്പോൾ בֹּהֶן വലിയ വിരലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കാലിന്റെ പെരുവിരൽ’ എന്നതാണ് സ്വാഭാവികം.
- source_word: וְלָקַח ... וְנָתַן
  choice: എടുത്ത് ... പുരട്ടണം
  rationale: ഈ നിയമനിർദേശസന്ദർഭത്തിൽ ക്രിയാരൂപങ്ങൾ ആചാരപരമായ നിർദേശം നൽകുന്നു. രക്തം ശരീരഭാഗങ്ങളിൽ വെക്കുന്നതിനെ മലയാളത്തിൽ ‘പുരട്ടണം’ എന്നു പറയുന്നത് സ്വാഭാവികവും പ്രവൃത്തിയുടെ സ്വഭാവം വ്യക്തമാക്കുന്നതുമാണ്.
theological_decisions:
- issue: ശുദ്ധീകരണച്ചടങ്ങിന് വിധേയനായ വ്യക്തിയുടെ പങ്ക്
  choice: ‘ശുദ്ധീകരിക്കപ്പെടുന്നവൻ’—പുരോഹിതന്റെ ആചാരനടപടിക്ക് വിധേയനായ വ്യക്തി
  alternative: ‘സ്വയം ശുദ്ധീകരിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘ശുദ്ധനായവൻ’
  rationale: സന്ദർഭത്തിൽ ഈ വ്യക്തി സ്വയം ശുദ്ധീകരിക്കുന്നു എന്നതിലുപരി പുരോഹിതൻ നിർവഹിക്കുന്ന ശുദ്ധീകരണച്ചടങ്ങിന് വിധേയനാകുന്നു. കൃദന്തരൂപത്തിലെ പ്രക്രിയാഭാവവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശശൈലി ഉപയോഗിച്ചു. ആചാരപരമായ സാങ്കേതികപദമായ ‘അകൃത്യയാഗം’ നിലനിർത്തി; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പുകളുടെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, എബ്രായ സ്രോതസ്സനുസരിച്ച് [a] രക്തത്തിന്റെ ഭാഗികപ്രയോഗത്തോടും [b] ചെവിയുടെ മടലോടും ചേർത്തു.
