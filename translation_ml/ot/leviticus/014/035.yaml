  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָא֙ אֲשֶׁר ל֣/וֹ הַ/בַּ֔יִת וְ/הִגִּ֥יד לַ/כֹּהֵ֖ן לֵ/אמֹ֑ר כְּ/נֶ֕גַע נִרְאָ֥ה לִ֖/י בַּ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/035.yaml
  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: ml
  text: 'അപ്പോൾ വീടിന്റെ ഉടമ വന്ന് പുരോഹിതനോട് ഇങ്ങനെ അറിയിക്കണം: “വീട്ടിൽ ബാധപോലൊന്ന് എനിക്കു കാണപ്പെട്ടിരിക്കുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം: “ഒരു ബാധപോലെ.” വീട്ടുടമ കാണപ്പെട്ട അവസ്ഥ മാത്രമാണ് അറിയിക്കുന്നത്; അത് ബാധയാണെന്ന് അന്തിമമായി നിർണയിക്കുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: അപ്പോൾ ... വന്ന്
  rationale: നിയമപരമായ നടപടിക്രമത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്ന ഘടനയായതിനാൽ ‘അപ്പോൾ’ ക്രമം വ്യക്തമാക്കുന്നു; ‘വന്ന്’ അടുത്ത ക്രിയയുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: വീടിന്റെ ഉടമ
  rationale: അക്ഷരാർഥത്തിൽ ‘വീട് ആരുടേതാണോ അവൻ’; ആധുനിക മലയാളത്തിൽ ഉടമസ്ഥത സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: പുരോഹിതനോട് ... അറിയിക്കണം
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘അറിയിക്കുക/റിപ്പോർട്ട് ചെയ്യുക’ എന്നാണ്; ഔദ്യോഗികമായി വിവരം അറിയിക്കുന്ന സന്ദർഭത്തിന് ‘അറിയിക്കണം’ യോജിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ഉദ്ധരണിയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: כְּנֶגַע
  choice: ബാധപോലൊന്ന്
  rationale: כְּ എന്ന ഉപസർഗം സാദൃശ്യമോ അനിശ്ചിതത്വമോ സൂചിപ്പിക്കുന്നു; נגע ലേവ്യപുസ്തകത്തിലെ അശുദ്ധിസംബന്ധമായ സാഹചര്യത്തിൽ ബാധിത പാട്/ബാധ എന്ന വിശാല അർഥം വഹിക്കുന്നു. ‘ബാധപോലൊന്ന്’ അന്തിമ രോഗനിർണയം ഒഴിവാക്കുന്നു.
- source_word: נִרְאָה לִי
  choice: എനിക്കു കാണപ്പെട്ടിരിക്കുന്നു
  rationale: ראהയുടെ നിഫാൽ രൂപത്തിലെ ‘കാണപ്പെടുക/പ്രത്യക്ഷപ്പെടുക’ എന്ന അർഥവും നിരീക്ഷകന്റെ പരിമിതമായ അവകാശവാദവും നിലനിർത്തുന്നു.
- source_word: בַּבָּיִת
  choice: വീട്ടിൽ
  rationale: בְּ ഇവിടെ ബാധ വീടെന്ന ഘടനയിൽ ഉള്ളതായി പൊതുവായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: വീട്ടുടമയുടെ പ്രസ്താവന അന്തിമ നിർണയമാണോ എന്നത്
  choice: ‘ബാധപോലൊന്ന്’ എന്ന് അനിശ്ചിതമായി റിപ്പോർട്ട് ചെയ്യുന്നു
  alternative: ‘ബാധ വീട്ടിൽ പ്രത്യക്ഷപ്പെട്ടിരിക്കുന്നു’ എന്ന നിർണായക പ്രസ്താവന
  rationale: മൂലത്തിലെ כְּ സാദൃശ്യം സൂചിപ്പിക്കുന്നു; പരിശോധനയും നിർണയവും പുരോഹിതന്റെ ചുമതലയായതിനാൽ ഉടമയുടെ വാക്കുകൾ അന്തിമ വിധിയായി മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നടപടിക്രമത്തിന്റെ നിയമപരമായ ഭാവം ‘അറിയിക്കണം’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തി; ‘ബാധപോലൊന്ന്’ മൂലത്തിലെ ഉദ്ദേശപൂർവമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
