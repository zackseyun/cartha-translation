  source_fidelity: 'മുഖ്യമായ ആശയം കൃത്യമാണ്: പുരോഹിതൻ ഒരു ആൺകുഞ്ഞാടിനെയും എണ്ണയുടെ ഒരു ലോഗിനെയും എടുക്കുന്നു; കുഞ്ഞാടിനെ אָשָׁם യാഗമായി സമർപ്പിച്ച് ഇരുവരെയും യഹോവയുടെ മുമ്പാകെ ത്നൂഫാ-ചടങ്ങിൽ ആട്ടിക്കാണിക്കുന്നു. എന്നാൽ ‘ആൺകുഞ്ഞാടുകളിൽ ഒന്നിനെയും’ എന്ന പ്രയോഗം എബ്രായത്തിലെ ഏകവചനവും നിർദിഷ്ടമായ ‘ആ ഒരു’ എന്ന സൂചനയും തെറ്റായി ബഹുവചനമാക്കുന്നു.'
  naturalness: ‘ആൺകുഞ്ഞാടുകളിൽ ഒന്നിനെയും’ ആധുനിക മലയാളത്തിൽ വ്യാകരണപരമായും സന്ദർഭപരമായും യോജിച്ചതല്ല. ‘ആ ഒരു ആൺകുഞ്ഞാടിനെയും’ സ്വാഭാവികവും കൃത്യവുമാണ്. ‘ആട്ടിക്കാണിക്കൽ വഴിപാടായി ആട്ടിക്കാണിക്കണം’ എന്ന സ്രോതസ്സിലെ സഹജാത ക്രിയ-നാമഘടന നിലനിർത്താവുന്നതാണ്; ഹൈഫൻ ചേർത്ത് സാങ്കേതിക യാഗനാമമായി വായിക്കാൻ എളുപ്പമാക്കുന്നു.
