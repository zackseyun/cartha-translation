id: LEV.14.12
reference: Leviticus 14:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ ആ ഒരു ആൺകുഞ്ഞാടിനെയും ഒരു ലോഗ് എണ്ണയും[b] എടുത്ത്, കുഞ്ഞാടിനെ കുറ്റയാഗമായി[a] സമർപ്പിക്കണം; അവ രണ്ടിനെയും യഹോവയുടെ മുമ്പാകെ ആട്ടിക്കാണിക്കൽ-വഴിപാടായി ആട്ടിക്കാണിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുറ്റയാഗം’ എന്നതിന് ‘പരിഹാരയാഗം’ അഥവാ ‘നഷ്ടപരിഹാരയാഗം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ലോഗ്’ പുരാതന ഇസ്രായേലിലെ ആചാരക്രമത്തിൽ ഉപയോഗിച്ചിരുന്ന ചെറിയൊരു ദ്രവയളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: പിന്നെ ... എടുത്ത്
  rationale: വാവ് ചേർന്ന ക്രിയ ആചാരക്രമത്തിലെ അടുത്ത ഘട്ടം സൂചിപ്പിക്കുന്നു; ‘പിന്നെ’ നടപടിക്രമത്തിന്റെ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: യാഗാരാധനാസന്ദർഭത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: ആൺകുഞ്ഞാടുകളിൽ ഒന്ന്
  rationale: כֶּבֶשׂ കുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു; ഈ ആചാരത്തിന്റെ വിശാലസന്ദർഭം ആൺമൃഗമാണെന്ന് വ്യക്തമാക്കുന്നു. നിർദിഷ്ട കൂട്ടത്തിൽനിന്നുള്ള ഒന്നിനെ ലേഖനവും സംഖ്യാവാചകവും വേർതിരിക്കുന്നു.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: കുഞ്ഞാടിനെ ... സമർപ്പിക്കണം
  rationale: הקריב യാഗത്തിനായി അടുത്തുകൊണ്ടുവന്ന് സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; യാഗനടപടിയുടെ കൂടുതൽ വിശദാംശങ്ങൾ അനാവശ്യമായി ചേർക്കാതെ ‘സമർപ്പിക്കുക’ അർഥം നൽകുന്നു.
- source_word: לְאָשָׁם
  choice: കുറ്റയാഗമായി
  rationale: אָשָׁם ലേവ്യപുസ്തകത്തിലെ സാങ്കേതിക യാഗപദമാണ്. ‘കുറ്റയാഗം’ ചുരുക്കവും വ്യക്തവുമാണ്; പരിഹാരം/നഷ്ടപരിഹാരം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לֹג הַשָּׁמֶן
  choice: ഒരു ലോഗ് എണ്ണ
  rationale: לֹג ഒരു നിർദിഷ്ട ദ്രവയളവാണ്; ഏകദേശ ആധുനിക അളവാക്കി മാറ്റാതെ സ്രോതസ്സിലെ സാങ്കേതിക അളവ് നിലനിർത്തുന്നു.
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: അവ രണ്ടും ... ആട്ടിക്കാണിക്കൽ വഴിപാടായി ആട്ടിക്കാണിക്കണം
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള സാങ്കേതിക നാമവും ഒരുമിച്ചുള്ള എബ്രായപ്രയോഗം പ്രതിഫലിപ്പിക്കുന്നു. ‘അവ രണ്ടും’ എന്നത് കുഞ്ഞാടും എണ്ണയും ഈ ആചാരത്തിൽ ഉൾപ്പെടുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ആരാധനാസന്ദർഭത്തിൽ ‘സന്നിധിയിൽ’ സ്വാഭാവികമാണ്; ദൈവനാമമായ יהוה ശീർഷകമായി മാറ്റാതെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: אָשָׁם എന്ന യാഗപദത്തിന്റെ അർഥം
  choice: കുറ്റയാഗം
  alternative: പരിഹാരയാഗം / നഷ്ടപരിഹാരയാഗം
  rationale: ഈ പദം കുറ്റവുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുമ്പോഴും പരിഹാരത്തിന്റെയും നഷ്ടപരിഹാരത്തിന്റെയും ആശയങ്ങൾ ഉൾക്കൊള്ളാം. മുഖ്യപാഠത്തിൽ പരിചിതമായ സാങ്കേതിക രൂപവും അടിക്കുറിപ്പിൽ അർഥവികൽപ്പവും നൽകുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: സ്രോതസ്സിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപം ഉപയോഗിച്ചു.
translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാഗക്രമത്തിലെ സാങ്കേതികത നിലനിർത്തിക്കൊണ്ട് ‘ആട്ടിക്കാണിക്കൽ വഴിപാട്’ എന്ന സുതാര്യമായ പ്രയോഗം ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് സൂചകങ്ങളും അവയുടെ ഉള്ളടക്കവും തമ്മിലുണ്ടായിരുന്ന മറിച്ചിടൽ തിരുത്തി: [a] കുറ്റയാഗത്തിന്റെ അർഥവികൽപ്പത്തിനും [b] ലോഗ് എന്ന അളവിന്റെ വിശദീകരണത്തിനുമാണ്.'
