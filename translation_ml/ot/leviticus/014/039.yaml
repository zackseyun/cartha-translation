id: LEV.14.39
reference: Leviticus 14:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁ֥ב הַ/כֹּהֵ֖ן בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/רָאָ֕ה וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖גַע בְּ/קִירֹ֥ת הַ/בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/039.yaml
  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: ml
  text: ഏഴാം ദിവസം പുരോഹിതൻ മടങ്ങിവന്ന് പരിശോധിക്കണം. ബാധ വീടിന്റെ ചുവരുകളിൽ പടർന്നിട്ടുണ്ടെങ്കിൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁב
  choice: മടങ്ങിവന്ന്
  rationale: പുരോഹിതൻ മുമ്പ് വീട് അടച്ചശേഷം വീണ്ടും വരുന്നതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְרָאָה
  choice: പരിശോധിക്കണം
  rationale: അക്ഷരാർഥമായ ‘കാണണം’ എന്നതിലുപരി, ആചാരപരമായ പരിശോധനയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: הַנֶּגַע
  choice: ബാധ
  rationale: വീട്ടിലെ അസാധാരണമായ പൂപ്പൽ/ക്ഷയംപോലുള്ള അവസ്ഥയെ സൂചിപ്പിക്കുന്ന വിശാലപദം; ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ നിർദിഷ്ട രോഗനിർണയം ഇതിൽ ചുമത്തുന്നില്ല.
- source_word: פָשָׂה
  choice: പടർന്നിട്ടുണ്ടെങ്കിൽ
  rationale: ബാധ വിസ്തരിച്ചുവെന്ന അർഥം കൃത്യമായി നൽകുന്നു; ഹീബ്രു വാക്യഘടനയിലെ നിരീക്ഷണഫലം മലയാളത്തിൽ വ്യവസ്ഥാരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּקִירֹת הַבָּיִת
  choice: വീടിന്റെ ചുവരുകളിൽ
  rationale: സ്ഥലസൂചനയും ബഹുവചനവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: וְהִנֵּה എന്ന നിരീക്ഷണസൂചകത്തിന്റെ അവതരണം
  choice: പ്രത്യേകമായി ‘ഇതാ’ എന്നു വിവർത്തനം ചെയ്യാതെ, ‘ബാധ ... പടർന്നിട്ടുണ്ടെങ്കിൽ’ എന്ന നിരീക്ഷണഫലത്തിൽ ഉൾപ്പെടുത്തി
  alternative: ‘ഇതാ, ബാധ വീടിന്റെ ചുവരുകളിൽ പടർന്നിരിക്കുന്നു എങ്കിൽ’
  rationale: ഇവിടെ וְהִנֵּה പുരോഹിതന്റെ പരിശോധനയിൽ കണ്ടെത്തുന്ന അവസ്ഥയെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഇതാ’ ചേർക്കുന്നത് അസ്വാഭാവികമാകാം; എന്നാൽ വ്യവസ്ഥയുടെ അർഥവും തുടർവാക്യത്തിലേക്കുള്ള ബന്ധവും നിലനിർത്തിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
