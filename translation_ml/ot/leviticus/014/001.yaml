  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ മോശെയോടു അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: ദൈവിക അരുളപ്പാടിനെ പരിചയപ്പെടുത്തുന്ന പതിവ് എബ്രായ ആഖ്യാനപ്രയോഗമാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തുല്യപദം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ YHWH-നെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദത്തിവ് രൂപം.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള അരുളപ്പാടിനെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രവാക്യം മലയാളത്തിൽ കോളൺകൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; 'പറഞ്ഞത്' എന്നു ചേർക്കുന്നത് അനാവശ്യ ആവർത്തനമാകും.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. മലയാള വായനക്കാർക്ക് പരിചിതമായ 'യഹോവ' ആ പേരിനെ പദവിയാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ഉച്ചാരണത്തിന്റെ പുനർനിർമാണം ഉറപ്പില്ലാത്തതിനാൽ അടിക്കുറിപ്പിൽ YHWH വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തനാത്മകമായ എബ്രായ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന മലയാളത്തിൽ കോളൺ ഉപയോഗിച്ച് സ്വാഭാവികമാക്കി; വാക്യത്തിലെ എല്ലാ അർത്ഥഘടകങ്ങളും നിലനിർത്തി.
