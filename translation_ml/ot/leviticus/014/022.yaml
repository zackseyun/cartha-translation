id: LEV.14.22
reference: Leviticus 14:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: ml
  text: അവന്റെ കഴിവിനൊത്തവിധം രണ്ടു കുറുപ്രാവുകളെയോ രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങളെയോ കൊണ്ടുവരണം. അവയിൽ ഒന്ന് പാപയാഗവും[a] മറ്റൊന്ന് ഹോമയാഗവും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ശുദ്ധീകരണയാഗം.” ആചാരപരമായ ശുദ്ധീകരണത്തിനായി അർപ്പിക്കുന്ന യാഗത്തെയും ഹീബ്രുപദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי תֹרִים
  choice: രണ്ടു കുറുപ്രാവുകൾ
  rationale: תֹרִים എന്നത് യാഗത്തിനുപയോഗിച്ചിരുന്ന പ്രത്യേക ഇനമായ turtledoves-നെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അതിനെ ‘കുറുപ്രാവുകൾ’ എന്നു വ്യക്തമായി നൽകുന്നു.
- source_word: אוֹ
  choice: അല്ലെങ്കിൽ / -യോ
  rationale: അനുവദിക്കപ്പെട്ട രണ്ടു പക്ഷിവർഗങ്ങൾക്കിടയിലെ ലളിതമായ വികൽപ്പം മലയാളത്തിലെ ‘-യോ ... -യോ’ ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘പ്രാവിന്റെ രണ്ടു മക്കൾ’ എന്ന ഹീബ്രു പ്രയോഗം ഇളംപ്രാവുകളെ സൂചിപ്പിക്കുന്നു; ‘പ്രാവിൻകുഞ്ഞുങ്ങൾ’ പ്രായസൂചന നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: അവന്റെ കഴിവിനൊത്തവിധം
  rationale: ‘അവന്റെ കൈ എത്തുന്നത്’ എന്ന ഹീബ്രു ശൈലി സാമ്പത്തികശേഷിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന രൂപമാണിത്.
- source_word: וְהָיָה אֶחָד
  choice: അവയിൽ ഒന്ന് ... ആയിരിക്കണം
  rationale: ജോഡിയിലെ ഓരോ പക്ഷിക്കും വ്യത്യസ്ത യാഗചുമതല നൽകുന്ന വിതരണാർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חַטָּאת
  choice: പാപയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ ഈ യാഗത്തിനുള്ള പരിചിതമായ മലയാള സാങ്കേതികപദമാണ്; ശുദ്ധീകരണസംബന്ധിയായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהָאֶחָד
  choice: മറ്റൊന്ന്
  rationale: ആദ്യത്തെ പക്ഷിയിൽനിന്ന് ശേഷിക്കുന്ന പക്ഷിയെ വ്യത്യസ്തമായി ചൂണ്ടിക്കാണിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കപ്പെടുന്ന ഈ യാഗത്തിനുള്ള സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ മലയാള ബൈബിൾപദം.
theological_decisions:
- issue: ലേവ്യയാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ നാമം പാപത്തെയും ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണവുമായി ബന്ധപ്പെട്ട യാഗത്തെയും സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിൽ പരിചിതമായ ‘പാപയാഗം’ നിലനിർത്തുകയും ഈ ശുദ്ധീകരണനിറം നഷ്ടപ്പെടാതിരിക്കാൻ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സാമ്പത്തികശേഷിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലി സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു; യാഗസാങ്കേതികപദങ്ങൾ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തി.
