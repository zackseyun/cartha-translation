translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനടപടി ശൈലി. മൂലവാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന നിബന്ധനയായതിനാൽ അവസാനത്തിൽ അർധവിരാമമോ പൂർണ്ണവിരാമമോ ചേർക്കാതെ കോമ നിലനിർത്തി. ആവർത്തിച്ചുള്ള ‘ശേഷവും’ എന്ന പ്രയോഗം മൂന്ന് നടപടികൾക്കു ശേഷവും ബാധ മടങ്ങിവരുന്നു എന്ന ഊന്നൽ വ്യക്തമാക്കുന്നു.
