- source_word: הַנֶּגַע
  choice: ആ ബാധ[a]
  rationale: נגע മനുഷ്യരെയും വസ്ത്രങ്ങളെയും വീടുകളെയും ബാധിക്കുന്ന അടയാളപ്പെടുത്തിയ ദോഷാവസ്ഥയ്ക്കുള്ള ലേവ്യപുസ്തകത്തിലെ സാങ്കേതിക പദമാണ്. ‘ബാധ’ രോഗം മാത്രമായി അർഥം ചുരുക്കാതെ ഈ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וּפָרַח
  choice: പടർന്നാൽ
  rationale: പദത്തിന്റെ അടിസ്ഥാനരൂപകം മുളയ്ക്കുക/പൊട്ടിപ്പുറപ്പെടുക എന്നതാണെങ്കിലും, വീട്ടിലെ ബാധ വീണ്ടും വ്യാപിക്കുന്നതു മലയാളത്തിൽ ‘പടരുക’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בַּבַּיִת
  choice: വീട്ടിൽ
  rationale: ב എന്ന സ്ഥലസൂചക അവ്യയത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: אַחַר חִלֵּץ אֶת־הָאֲבָנִים
