lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … എങ്കിൽ/പടർന്നാൽ
  rationale: നിയമനടപടിയിലെ തുടർസാഹചര്യം അവതരിപ്പിക്കുന്ന നിബന്ധനയാണ്; ‘എന്നാൽ’ മുൻവിവരണത്തോടുള്ള ബന്ധവും പുതിയ സാധ്യതയിലേക്കുള്ള തിരിവും വ്യക്തമാക്കുന്നു.
- source_word: יָשׁוּב
  choice: വീണ്ടും വന്ന്
