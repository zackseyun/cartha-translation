id: LEV.14.48
reference: Leviticus 14:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם בֹּ֨א יָבֹ֜א הַ/כֹּהֵ֗ן וְ/רָאָה֙ וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ/בַּ֔יִת אַחֲרֵ֖י הִטֹּ֣חַ אֶת הַ/בָּ֑יִת וְ/טִהַ֤ר הַ/כֹּהֵן֙ אֶת הַ/בַּ֔יִת כִּ֥י נִרְפָּ֖א הַ/נָּֽגַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: ml
  text: എന്നാൽ പുരോഹിതൻ അകത്തു വന്നു നോക്കുമ്പോൾ, ഇതാ, വീട് കുമ്മായം പൂശിയശേഷം ബാധ[a] വീട്ടിൽ പടർന്നിട്ടില്ലെങ്കിൽ, ബാധ ഭേദമായതിനാൽ പുരോഹിതൻ ആ വീട് ശുദ്ധമെന്നു പ്രഖ്യാപിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗത പരിഭാഷകളിൽ ഇവിടെ ‘ബാധ’ എന്നതിനു പകരം ‘പ്ലേഗ്’ അല്ലെങ്കിൽ ‘വ്യാധി’ എന്നു കാണാം. ഹീബ്രായ പദം വീടിനെ ബാധിച്ച ദോഷാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; അത് ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ ഒരു നിർദിഷ്ട രോഗനാമമല്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആ വീട് ശുദ്ധീകരിക്കണം.’ സന്ദർഭത്തിൽ ഹീബ്രായ ക്രിയയ്ക്ക് ആചാരപരമായി ശുദ്ധമാക്കുക എന്നോ ശുദ്ധമാണെന്നു പുരോഹിതൻ പ്രഖ്യാപിക്കുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … എങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ സാഹചര്യത്തിനു വിപരീതമായ ഒരു നിബന്ധനാപരമായ തുടർച്ചയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֹּא יָבֹא
  choice: അകത്തു വന്നു
  rationale: പുരോഹിതൻ പരിശോധനയ്ക്കായി വീട്ടിൽ പ്രവേശിക്കുന്ന നടപടിക്രമമാണ് സന്ദർഭം. ഹീബ്രായയിലെ ഊന്നൽ മലയാളത്തിൽ കൃത്രിമമായി ആവർത്തിക്കാതെ സ്വാഭാവികമായി നൽകി.
- source_word: וְרָאָה
  choice: നോക്കുമ്പോൾ
  rationale: അടിസ്ഥാനമായ ‘കാണുക/നോക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘പരിശോധിക്കുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പരിശോധനയുടെ ഫലത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രായ വ്യവഹാരസൂചകം നിലനിർത്തുന്നു.
- source_word: לֹא פָשָׂה
  choice: പടർന്നിട്ടില്ല
  rationale: വീട്ടിനെ ബാധിച്ച അവസ്ഥ കൂടുതൽ വ്യാപിച്ചിട്ടില്ലെന്ന നടപടിക്രമപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: הַנֶּגַע
  choice: ബാധ
  rationale: נגע എന്നത് ഇവിടെ വീടിനെ ബാധിക്കുന്ന ദോഷാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘മഹാമാരി’ എന്ന തെറ്റിദ്ധരിപ്പിക്കാവുന്ന പരമ്പരാഗത പദത്തേക്കാൾ ‘ബാധ’ വിശാലവും സന്ദർഭോചിതവുമാണ്.
- source_word: בַּבַּיִת
  choice: വീട്ടിൽ
  rationale: ഹീബ്രായ മുൻപ്രത്യയത്തിന്റെ സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: വീട് കുമ്മായം പൂശിയശേഷം
  rationale: טוח വീടിന്റെ ഉപരിതലത്തിൽ കുമ്മായമോ സമാനമായ പൂശലോ ഇടുന്നതിനെ സൂചിപ്പിക്കുന്നു; പ്രവർത്തകനെ ഊന്നാത്ത ഹീബ്രായ ഘടനയും നിലനിർത്തുന്നു.
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבָּיִת
  choice: പുരോഹിതൻ ആ വീട് ശുദ്ധമെന്നു പ്രഖ്യാപിക്കണം
  rationale: പുരോഹിതശുദ്ധിനിയമത്തിന്റെ സന്ദർഭത്തിൽ טהר ശുദ്ധസ്ഥിതി ഔദ്യോഗികമായി വിധിക്കുന്നതിനെ സൂചിപ്പിക്കാം. പുരോഹിതൻ തന്നെ വീട് ഭൗതികമായി വൃത്തിയാക്കുന്നു എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: ബാധ ഭേദമായതിനാൽ
  rationale: רפא എന്ന ക്രിയയിലെ ‘ഭേദമാകുക/സൗഖ്യം പ്രാപിക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; ബാധ വെറും അപ്രത്യക്ഷമായി എന്നു മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: וְטִהַר എന്നതിൽ ആചാരപരമായ ശുദ്ധീകരണമോ ശുദ്ധനിലയുടെ പുരോഹിതപ്രഖ്യാപനമോ
  choice: പുരോഹിതൻ ആ വീട് ശുദ്ധമെന്നു പ്രഖ്യാപിക്കണം
  alternative: പുരോഹിതൻ ആ വീട് ശുദ്ധീകരിക്കണം
  rationale: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധിനിയമസന്ദർഭത്തിൽ പുരോഹിതൻ ശുദ്ധസ്ഥിതി നിർണയിച്ച് പ്രഖ്യാപിക്കുന്നതാണ് പ്രധാന്യം. എങ്കിലും ഹീബ്രായ ക്രിയയ്ക്ക് ‘ശുദ്ധീകരിക്കുക’ എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനടപടി ശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്ന അല്പം ഔപചാരികമായ പദം മൂലപാഠത്തിലെ ശ്രദ്ധാകർഷക സൂചകം സംരക്ഷിക്കാൻ നിലനിർത്തി. ‘കുമ്മായം പൂശുക’ സാധാരണ വായനക്കാർക്ക് നിർമാണസന്ദർഭം വ്യക്തമായി മനസ്സിലാകുന്ന പ്രയോഗമാണ്.
