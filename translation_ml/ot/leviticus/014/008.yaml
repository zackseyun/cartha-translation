id: LEV.14.8
reference: Leviticus 14:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִבֶּס֩ הַ/מִּטַּהֵ֨ר אֶת בְּגָדָ֜י/ו וְ/גִלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ וְ/רָחַ֤ץ בַּ/מַּ֨יִם֙ וְ/טָהֵ֔ר וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/יָשַׁ֛ב מִ/ח֥וּץ לְ/אָהֳל֖/וֹ שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: ml
  text: ശുദ്ധീകരിക്കപ്പെടുന്നവൻ[a] തന്റെ വസ്ത്രങ്ങൾ കഴുകുകയും തന്റെ എല്ലാ മുടിയും രോമവും ക്ഷൗരം ചെയ്യുകയും വെള്ളത്തിൽ കുളിക്കുകയും വേണം; അപ്പോൾ അവൻ ശുദ്ധനാകും. അതിനുശേഷം അവന് പാളയത്തിനകത്ത് പ്രവേശിക്കാം[b]; എങ്കിലും ഏഴു ദിവസം അവൻ തന്റെ കൂടാരത്തിനു പുറത്തു താമസിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുദ്ധീകരണം സ്വീകരിക്കുന്നവൻ.” ഹീബ്രു പദം നിർദിഷ്ട ആചാരപരമായ ശുദ്ധീകരണപ്രക്രിയയ്ക്ക് വിധേയനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവൻ പാളയത്തിനകത്ത് പ്രവേശിക്കും.” ഹീബ്രു ക്രിയാരൂപം ലളിതഭാവിയായോ അനുമതിയായോ മനസ്സിലാക്കാം; തുടർന്നുള്ള നിയന്ത്രണം ഇവിടെ അനുമതിയെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് തോന്നിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: ശുദ്ധീകരിക്കപ്പെടുന്നവൻ
  rationale: ഹിത്പയേൽ കർത്തൃവാചക പങ്കാളിത്തരൂപം നിർദിഷ്ട ആചാരപരമായ ശുദ്ധീകരണപ്രക്രിയയ്ക്ക് വിധേയനാകുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രക്രിയാത്മക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: כִבֶּס ... בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ കഴുകുകയും
  rationale: כִּבֵּס വസ്ത്രങ്ങൾ കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: തന്റെ രോമമെല്ലാം വടിച്ചുകളയുകയും
  rationale: כָּל പൂർണതയെ ഊന്നുന്നു; שֵׂעָר ശരീരത്തിലെ മുടിയും രോമവും ഉൾക്കൊള്ളാവുന്നതിനാൽ 'രോമമെല്ലാം' എന്ന് നൽകി, גִּלַּח സൂചിപ്പിക്കുന്ന പൂർണ നീക്കം 'വടിച്ചുകളയുക' എന്നതിലൂടെ വ്യക്തമാക്കി.
- source_word: רָחַץ בַּמַּיִם
  choice: വെള്ളത്തിൽ കുളിക്കുകയും
  rationale: ഇവിടെ ശരീരം വെള്ളത്തിൽ കഴുകുന്നതാണ് ഉദ്ദേശ്യം; മുമ്പുള്ള വസ്ത്രം കഴുകലിൽനിന്ന് വേർതിരിച്ചുകാട്ടാൻ 'കുളിക്കുക' സ്വാഭാവികമാണ്.
- source_word: וְטָהֵר
  choice: അപ്പോൾ അവൻ ശുദ്ധനാകും
  rationale: മുൻപറഞ്ഞ പ്രവൃത്തികൾക്കു ശേഷമുള്ള ആചാരപരമായ ശുദ്ധസ്ഥിതിയിലേക്കുള്ള ഫലക്രമം 'അപ്പോൾ' വ്യക്തമാക്കുന്നു.
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: അവന് പാളയത്തിനകത്ത് പ്രവേശിക്കാം
  rationale: ഹീബ്രു അപൂർണക്രിയ സാധാരണ ഭാവിയായോ അനുമതിയായോ ഗ്രഹിക്കാം; തുടർന്നുള്ള നിയന്ത്രണം കണക്കിലെടുത്ത് മുഖ്യവാചകത്തിൽ അനുമതിസൂചന സ്വീകരിച്ചു, മറുവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: എങ്കിലും ... തന്റെ കൂടാരത്തിനു പുറത്തു താമസിക്കണം
  rationale: יָשַׁב ഇവിടെ താൽക്കാലികമായി കഴിയുക/താമസിക്കുക എന്നർഥം നൽകുന്നു. പാളയത്തിലേക്കുള്ള പ്രവേശനവും കൂടാരത്തിനു പുറത്തുള്ള നിയന്ത്രണവും തമ്മിലുള്ള വൈരുധ്യം 'എങ്കിലും' വ്യക്തമാക്കുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: ആചാരപരമായ ശുദ്ധിയുടെ ഭാഷ
  choice: '''ശുദ്ധീകരിക്കപ്പെടുന്നവൻ'', ''ശുദ്ധനാകും'''
  alternative: '''പരിശുദ്ധീകരിക്കപ്പെടുന്നവൻ'', ''നിർമലനാകും'''
  rationale: ഈ സന്ദർഭം ധാർമിക കുറ്റമോ ആന്തരിക വിശുദ്ധീകരണമോ പ്രധാനമായി പ്രതിപാദിക്കുന്നില്ല; ലേവ്യ ആചാരപ്രകാരമുള്ള നിലമാറ്റമാണ്. അതിനാൽ അനാവശ്യമായ നൈതികമോ മതവിഭാഗീയമോ ആയ അർഥം ചേർക്കാതെ 'ശുദ്ധി' എന്ന ഭാഷ നിലനിർത്തി.
- issue: പാളയത്തിലേക്കുള്ള പ്രവേശനം—ഭാവിയോ അനുമതിയോ
  choice: അവന് ... പ്രവേശിക്കാം
  alternative: അവൻ ... പ്രവേശിക്കും / പ്രവേശിക്കണം
  rationale: יָבֹא രൂപം സ്വതവേ ലളിതഭാവിയും അനുമതിയും അനുവദിക്കുന്നു. തുടർന്ന് കൂടാരത്തിനു പുറത്തു കഴിയണമെന്ന നിയന്ത്രണം വരുന്നതിനാൽ അനുമതിയായ വായന സന്ദർഭോചിതമാണ്; യഥാർഥ വ്യാകരണപരമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ നിർദേശം 'വേണം' എന്നതിലൂടെ സ്വാഭാവികമായി നൽകി. പാളയം, കൂടാരം, ആചാരപരമായ ശുദ്ധി എന്നീ പുരാതന സാംസ്കാരിക ആശയങ്ങൾ ലളിതമാക്കാതെ നിലനിർത്തി.
