source:
  edition: WLC
  text: וְ/צִוָּ֨ה הַ/כֹּהֵ֜ן וּ/פִנּ֣וּ אֶת הַ/בַּ֗יִת בְּ/טֶ֨רֶם יָבֹ֤א הַ/כֹּהֵן֙ לִ/רְא֣וֹת אֶת הַ/נֶּ֔גַע וְ/לֹ֥א יִטְמָ֖א כָּל אֲשֶׁ֣ר בַּ/בָּ֑יִת וְ/אַ֥חַר כֵּ֛ן יָבֹ֥א הַ/כֹּהֵ֖ן לִ/רְא֥וֹת אֶת הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: ml
  text: പുരോഹിതൻ ബാധിതസ്ഥലം[a] പരിശോധിക്കാൻ വീട്ടിൽ പ്രവേശിക്കുന്നതിനുമുമ്പ്, വീട്ടിലുള്ളതെല്ലാം അശുദ്ധമാകാതിരിക്കേണ്ടതിന് വീട്ടിലുള്ള സാധനങ്ങൾ പുറത്തെടുക്കാൻ കൽപ്പിക്കണം. അതിനുശേഷം പുരോഹിതൻ വീട് പരിശോധിക്കാൻ അകത്തു ചെല്ലണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘അടയാളം,’ ‘ബാധ,’ അഥവാ പരമ്പരാഗതമായി ‘വ്യാധി.’ എബ്രായത്തിലെ നെഗാ എന്ന പദം പുരോഹിതൻ പരിശോധിക്കുന്ന ബാധിത ഭാഗത്തെയോ അവസ്ഥയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: കല്പിക്കണം
  rationale: ക്രമാനുസൃതമായ നിയമനിർദേശം സൂചിപ്പിക്കുന്ന രൂപം; മലയാളത്തിൽ തുടർന്നുള്ള നടപടിയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וּפִנּוּ אֶת־הַבַּיִת
  choice: വീട് ഒഴിപ്പിക്കാൻ
  rationale: ബഹുവചനക്രിയയുടെ അനിശ്ചിത കർത്താവിനെ പ്രത്യേകം ചേർക്കാതെ, പുരോഹിതന്റെ കല്പനയുടെ ഉള്ളടക്കമായി സ്വാഭാവികമായി നൽകുന്നു; വീട്ടിലെ സാധനങ്ങൾ നീക്കുക എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: לִרְאוֹת
  choice: പരിശോധിക്കാൻ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘കാണുക’ എന്നാണെങ്കിലും, ഇവിടെ ഔദ്യോഗികമായ പുരോഹിതപരിശോധനയാണ് സന്ദർഭം.
- source_word: הַנֶּגַע
  choice: ബാധിതസ്ഥലം
  rationale: കാണപ്പെടുന്ന ബാധിത ഭാഗത്തെയോ അവസ്ഥയെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക വൈദ്യശാസ്ത്രപരമായ നിർണയം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: וְלֹא יִטְמָא
  choice: അശുദ്ധമാകാതിരിക്കേണ്ടതിന്
  rationale: വീട് മുൻകൂട്ടി ഒഴിപ്പിക്കുന്നതിന്റെ പ്രതിരോധപരമായ ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ അശുദ്ധി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל־אֲשֶׁר בַּבָּיִת
  choice: വീട്ടിലുള്ളതെല്ലാം
  rationale: വീട്ടിലെ മുഴുവൻ ഉള്ളടക്കത്തെയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְאַחַר כֵּן
  choice: അതിനുശേഷം
  rationale: നിയമനടപടിയിലെ അടുത്ത ഘട്ടം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: טמא എന്ന ആചാരപരമായ അശുദ്ധിയുടെ പദപ്രയോഗം
  choice: അശുദ്ധമാകുക
  alternative: മലിനമാകുക / അശുദ്ധീകരിക്കപ്പെടുക
  rationale: ഇവിടെ ധാർമിക കുറ്റമല്ല, പുരോഹിതനിയമത്തിലെ ആചാരപരമായ അശുദ്ധിയാണ് ഉദ്ദേശിക്കുന്നത്; ‘അശുദ്ധമാകുക’ ഈ വ്യത്യാസം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമനടപടി ശൈലി. ‘അകത്തു ചെല്ലുക’ എന്നത് മൂലപാഠത്തിലെ യָבֹא എന്ന ചലനസൂചന നിലനിർത്തുന്നു; ആദ്യ ഘട്ടത്തിൽ ബാധിതസ്ഥലവും അവസാന ഘട്ടത്തിൽ മുഴുവൻ വീടും പരിശോധനാവിഷയമാകുന്ന വ്യത്യാസവും സംരക്ഷിച്ചിരിക്കുന്നു.
