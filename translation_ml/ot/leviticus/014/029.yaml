id: LEV.14.29
reference: Leviticus 14:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: ml
  text: പുരോഹിതന്റെ ഉള്ളംകൈയിലുള്ള എണ്ണയിൽ ശേഷിച്ചിരിക്കുന്നത് പുരോഹിതൻ ശുദ്ധീകരണം പ്രാപിച്ചുകൊണ്ടിരിക്കുന്നവന്റെ തലയിൽ പുരട്ടണം; യഹ്‌വെയുടെ സന്നിധിയിൽ അവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן הַשֶּׁמֶן
  choice: എണ്ണയിൽ ശേഷിച്ചത്
  rationale: נותר എന്ന പ്രയോഗത്തിന്റെ ‘ശേഷിക്കുന്നത്’ എന്ന അർഥവും מן എന്നതിന്റെ ഭാഗസൂചകഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: പുരോഹിതന്റെ ഉള്ളംകൈയിലുള്ള
  rationale: כף കൈയുടെ ഉള്ളം അഥവാ കുഴിഞ്ഞ ഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ദ്രാവകം കൈയിൽ വഹിക്കുന്ന സന്ദർഭത്തിൽ ‘ഉള്ളംകൈയിലുള്ള’ എന്നത് സ്വാഭാവികവും ദൃശ്യവുമാണ്.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: തലയിൽ പുരട്ടണം
  rationale: נתן അടിസ്ഥാനമായി ‘വെക്കുക’ എന്നാണെങ്കിലും എണ്ണ ശരീരത്തിൽ പ്രയോഗിക്കുന്ന ഈ ആചാരസന്ദർഭത്തിൽ ‘പുരട്ടുക’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: הַמִּטַּהֵר
  choice: ശുദ്ധീകരിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നവൻ
  rationale: Hitpael കൃതന്തം ആചാരപരമായ ശുദ്ധീകരണപ്രക്രിയയ്ക്ക് വിധേയനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; പൂർത്തിയായ അവസ്ഥയായി മാറ്റാതെ പ്രക്രിയാഭാവം സംരക്ഷിക്കുന്നു.
- source_word: לְכַפֵּר עָלָיו
  choice: അവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാൻ
  rationale: כפר എന്ന പ്രധാന ആരാധനാക്രമപദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം ‘പ്രായശ്ചിത്തം ചെയ്യുക’ നിലനിർത്തുന്നു; עליו ഗുണഭോക്താവിനെ ‘അവനുവേണ്ടി’ എന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לפני ദൈവസന്നിധിയെ സൂചിപ്പിക്കുന്നു; יהוה എന്ന നിയമനാമം വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി പ്രതിനിധീകരിക്കുന്നു; ‘യഹ്‌വെ’ എന്ന രൂപം ആധുനിക പണ്ഡിതസമ്മത ഉച്ചാരണത്തോട് അടുത്തതാണ്.
- issue: כפר എന്ന ആരാധനാക്രമപദം
  choice: പ്രായശ്ചിത്തം ചെയ്യുക
  alternative: പരിഹാരം വരുത്തുക / പാപപരിഹാരം ചെയ്യുക
  rationale: സന്ദർഭത്തിൽ പാപം മാത്രം പ്രത്യേകം പറയാത്തതിനാൽ ‘പാപപരിഹാരം’ എന്ന് ചുരുക്കാതെ, വിശാലമായ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ലേവ്യപുസ്തകത്തിലെ ആചാരഭാഷയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ ദീർഘവാക്യം മലയാളത്തിൽ സെമിക്കോളൻ ഉപയോഗിച്ച് വ്യക്തമായി ക്രമപ്പെടുത്തി.
