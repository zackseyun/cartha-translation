- from: പുരോഹിതന്റെ ഉള്ളംകൈയിലുള്ള എണ്ണയിൽ ശേഷിച്ചത് അവൻ ശുദ്ധീകരിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നവന്റെ തലയിൽ പുരട്ടണം; യഹ്‌വെയുടെ സന്നിധിയിൽ അവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാനാണിത്.
