source:
  edition: WLC
  text: וְ/הַ/שֹּׁכֵ֣ב בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָ֑י/ו וְ/הָ/אֹכֵ֣ל בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: ml
  text: വീട്ടിൽ കിടക്കുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകണം[a]; വീട്ടിൽ ഭക്ഷണം കഴിക്കുന്നവനും തന്റെ വസ്ത്രങ്ങൾ കഴുകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വീട്ടിൽ ഉറങ്ങുന്നവൻ.’ ഹീബ്രു ക്രിയയ്ക്ക് ‘കിടക്കുക’ എന്നും ‘ഉറങ്ങുക’ എന്നും അർഥമാകാം; നിയമസന്ദർഭത്തിൽ കൂടുതൽ വിശാലമായ അർഥമുള്ള ‘കിടക്കുക’ ആണ് മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: വീട്ടിൽ കിടക്കുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപസർഗത്തോടുകൂടിയ കർത്തൃവാചക കൃദന്തം പൊതുവായ നിയമവിഷയത്തെ സൂചിപ്പിക്കുന്നു. שׁכב എന്ന ക്രിയയ്ക്ക് ‘കിടക്കുക’ എന്നും ‘ഉറങ്ങുക’ എന്നും അർഥമാകാം; നിയമത്തിന്റെ വ്യാപ്തി ചുരുക്കാതിരിക്കാൻ ‘കിടക്കുന്നവൻ’ സ്വീകരിച്ചു.
- source_word: בַּבַּיִת
  choice: വീട്ടിൽ
  rationale: സ്ഥലസൂചകമായ ഈ പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: יְכַבֵּס
  choice: കഴുകണം
  rationale: പുരോഹിതനിയമസന്ദർഭത്തിലെ അപൂർണക്രിയ നിർബന്ധിത കർത്തവ്യം പ്രകടിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘കഴുകണം’ അത് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: אֶת־בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ
  rationale: בֶּגֶד വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു. കർത്താവിലേക്കു മടങ്ങുന്ന ഏകവചന പുരുഷലിംഗ പ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായി ‘തന്റെ’ എന്നു നൽകി.
- source_word: וְהָאֹכֵל
  choice: വീട്ടിൽ ഭക്ഷണം കഴിക്കുന്നവനും
  rationale: ഇതും പൊതുവായ നിയമവിഷയത്തെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചക കൃദന്തമാണ്. ഹീബ്രുവിലെ ബന്ധകത്തെ മലയാളത്തിൽ ‘-ഉം’ ചേർത്ത് സമാന്തര നിയമവാക്യം സ്വാഭാവികമാക്കി.
theological_decisions:
- issue: നിയമപ്രയോഗത്തിലെ പൊതുവായ പുരുഷലിംഗ ഏകവചനം
  choice: ‘കിടക്കുന്നവൻ ... തന്റെ വസ്ത്രങ്ങൾ’; ‘ഭക്ഷണം കഴിക്കുന്നവനും തന്റെ വസ്ത്രങ്ങൾ’
  alternative: ‘ആരെങ്കിലും ... അവരുടെ വസ്ത്രങ്ങൾ’
  rationale: ഹീബ്രു വ്യാകരണപരമായി പുരുഷലിംഗ ഏകവചനം ഉപയോഗിച്ചെങ്കിലും നിയമം പൊതുവായി ബാധകമാണ്. മലയാളത്തിലെ ഏകവചന രൂപവും ‘തന്റെ’ എന്ന പ്രതിഫലനസർവനാമവും ഉറവിടത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു; ഇത് പുരുഷന്മാർക്ക് മാത്രമുള്ള നിയന്ത്രണമെന്നു സൂചിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി. ഹീബ്രുവിലെ രണ്ട് സമാന്തര വ്യവസ്ഥകളും നിലനിർത്തി; ‘shall wash’ എന്ന നിയമബാധ്യത ‘കഴുകണം’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
