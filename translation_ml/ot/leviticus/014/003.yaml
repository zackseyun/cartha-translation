  to: പുരോഹിതൻ പാളയത്തിനു പുറത്തേക്കു ചെല്ലണം. പുരോഹിതൻ അയാളെ പരിശോധിക്കണം. ത്വഗ്രോഗബാധ ആ വ്യക്തിയിൽനിന്ന് മാറിയിരിക്കുന്നതായി കണ്ടാൽ,[a]
