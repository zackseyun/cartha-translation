  text: וְ/יָצָא֙ הַ/כֹּהֵ֔ן אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נִרְפָּ֥א נֶֽגַע הַ/צָּרַ֖עַת מִן הַ/צָּרֽוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: ml
  text: പുരോഹിതൻ പാളയത്തിനു പുറത്തേക്കു ചെല്ലണം. പുരോഹിതൻ അയാളെ പരിശോധിക്കണം. ത്വഗ്രോഗബാധ ആ വ്യക്തിയിൽനിന്ന് മാറിയിരിക്കുന്നതായി കണ്ടാൽ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗത പരിഭാഷ: “കുഷ്ഠരോഗിയുടെ കുഷ്ഠരോഗബാധ മാറിയിരിക്കുന്നു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദങ്ങൾ ആധുനിക കുഷ്ഠരോഗത്തെ (ഹാൻസൻ രോഗം) മാത്രമല്ല, കൂടുതൽ വിശാലമായ ത്വക്ക്‌ബാധകളെയും സൂചിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא
  choice: ചെല്ലണം
  rationale: നടപടിക്രമം നിർദേശിക്കുന്ന നിയമസന്ദർഭത്തിലെ ക്രിയയ്ക്ക് നിർബന്ധാത്മകമായ ഭാവം നൽകുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാ-നിയമസന്ദർഭത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ സ്വാഭാവികവും സ്ഥിരവുമായ മലയാളപരിഭാഷ; എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്തി.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തേക്ക്
  rationale: אֶל സൂചിപ്പിക്കുന്ന ദിശയും מִחוּץ לַמַּחֲנֶה എന്നതിന്റെ ‘പാളയത്തിന് പുറത്ത്’ എന്ന സ്ഥാനാർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു.
- source_word: וְרָאָה
  choice: പരിശോധിക്കണം
  rationale: അക്ഷരാർഥം ‘കാണുക’ എന്നാണെങ്കിലും ഈ പരിശോധനാനിയമത്തിൽ സൂക്ഷ്മമായി പരിശോധിക്കുക എന്ന പ്രവർത്തനാർത്ഥമാണ്.
- source_word: וְהִנֵּה
  choice: കണ്ടാൽ
  rationale: ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷക അർഥം ഇവിടെ പരിശോധനയിൽ കണ്ടെത്തുന്ന സ്ഥിതി അവതരിപ്പിക്കുന്നു; മലയാള നടപടിക്രമഭാഷയിൽ ‘കണ്ടാൽ’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נִרְפָּא
  choice: സൗഖ്യമായിരിക്കുന്നു
  rationale: നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയ/ഫലസ്ഥിതി സൂക്ഷിച്ച്, പരിശോധനാസമയത്ത് സൗഖ്യം വന്നുകഴിഞ്ഞ നില വ്യക്തമാക്കുന്നു.
- source_word: נֶגַע הַצָּרַעַת
  choice: ത്വഗ്രോഗബാധ
  rationale: נֶגַע എന്ന ബാധ/രോഗലക്ഷണവും צָרַעַת എന്ന വിശാലമായ ചർമ്മാവസ്ഥയും ചേർത്ത്, ആധുനിക ഹാൻസൻ രോഗത്തോട് തെറ്റായി സമീകരിക്കാതെ സംക്ഷിപ്തമായി നൽകി.
- source_word: מִן הַצָּרוּעַ
  choice: അയാളിൽനിന്ന്
  rationale: מִן സൂചിപ്പിക്കുന്ന വേർപാട് നിലനിർത്തുന്നു; പ്രസക്തനായ രോഗബാധിതനെ മലയാളത്തിൽ സ്വാഭാവികമായി തിരിച്ചുസൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: צָרַעַת / צָרוּעַ എന്നതിന്റെ പരിഭാഷ
  choice: ത്വഗ്രോഗബാധ / അയാൾ
  alternative: കുഷ്ഠരോഗം / കുഷ്ഠരോഗി
  rationale: എബ്രായപദം ആധുനിക ഹാൻസൻ രോഗത്തിൽ മാത്രം ഒതുങ്ങാത്ത വിവിധ ത്വക്ക്‌ബാധകളെ സൂചിപ്പിക്കാം. അതിനാൽ അനാകാലികമായ വൈദ്യശാസ്ത്രസമീകരണം ഒഴിവാക്കി വിശാലമായ പദം ഉപയോഗിച്ചു; പരമ്പരാഗത വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള നിയമ-നടപടിക്രമ ശൈലി. മൂലത്തിലെ ‘പുരോഹിതൻ’ എന്ന ആവർത്തനം നിലനിർത്തി; വാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി മൂന്ന് ചെറുവാക്യങ്ങളാക്കി.
