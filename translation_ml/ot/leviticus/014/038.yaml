  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: ml
  text: പുരോഹിതൻ വീട്ടിൽനിന്ന് പുറത്തുകടന്ന് വീടിന്റെ പ്രവേശനകവാടത്തിങ്കലേക്കു പോകണം; അദ്ദേഹം ആ വീട് ഏഴു ദിവസത്തേക്ക് അടച്ചിടണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏഴു ദിവസത്തേക്ക് വീട്ടിലേക്കുള്ള പ്രവേശനം തടയണം.’ എബ്രായ ക്രിയ പരിശോധനാകാലത്ത് പ്രവേശനം തടഞ്ഞ് അടച്ചിടുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: അപ്പോൾ ... പുറത്തുപോയി
  rationale: നടപടിക്രമപരമായ നിയമസന്ദർഭത്തിൽ waw + qatal അടുത്ത ഘട്ടത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യനിയമസന്ദർഭത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണവും മാന്യവുമായ മലയാളരൂപം.
- source_word: מִן הַבַּיִת
  choice: വീട്ടിൽനിന്ന് ... പുറത്തുപോയി
  rationale: יָצָא എന്ന ക്രിയയോടൊപ്പം ഉറവിടസ്ഥാനവും പുറത്തേക്കുള്ള ചലനവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: വീടിന്റെ പ്രവേശനകവാടത്തിലേക്ക്
  rationale: פֶּתַח ഒരു പ്രവേശനസ്ഥലത്തെയോ തുറവിനെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രവേശനകവാടം’ വാതില്പാളി ഉണ്ടെന്നു അനാവശ്യമായി നിർണ്ണയിക്കാതെ സ്ഥലം വ്യക്തമാക്കുന്നു.
- source_word: וְהִסְגִּיר
  choice: അടച്ചിടണം
  rationale: സന്ദർഭത്തിൽ Hiphil രൂപം ഒരു നിശ്ചിത കാലത്തേക്ക് പ്രവേശനം തടഞ്ഞ് വീട് അടച്ചിടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ക്വാറന്റീനിലാക്കണം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: אֶת הַבַּיִת
  choice: വീട്
  rationale: നിശ്ചിതമായ കർമ്മപദം നേരിട്ട് മലയാളത്തിൽ നൽകിയിരിക്കുന്നു; എബ്രായ കർമ്മസൂചകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തുന്നില്ല.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസത്തേക്ക്
  rationale: കാലദൈർഘ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
