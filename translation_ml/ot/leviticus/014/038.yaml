  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമനടപടിയുടെ ക്രമവും നിർദ്ദേശാത്മക ഭാവവും കാത്തുസൂക്ഷിച്ചുള്ള ഗൗരവമുള്ള സാധാരണഭാഷ. ‘പ്രവേശനകവാടം’ എന്നത് ഭൗതികമായ വാതില്പാളി ഉണ്ടെന്നു അനാവശ്യമായി സൂചിപ്പിക്കാതെ פֶּתַח എന്നതിന്റെ സ്ഥലാർത്ഥം നൽകുന്നു.
