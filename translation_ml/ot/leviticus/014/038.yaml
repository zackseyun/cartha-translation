  source_fidelity: The draft accurately identifies the priest, the house, the entrance/doorway, and the seven-day closure. However, it uses a completed past form ("പുറത്തുപോയി") for the first procedural action while rendering the following action as a directive ("അടച്ചിടണം"). In this legal-procedural context, Malayalam should express both coordinated actions consistently as requirements.
  naturalness: '"വീട്ടിൽനിന്ന് വീടിന്റെ പ്രവേശനകവാടത്തിലേക്കു പുറത്തുപോയി" is syntactically awkward: "പുറത്തുപോയി" is separated from its source phrase and can sound as though the priest went outside toward the doorway in an imprecise way. A direct procedural construction is clearer and natural in modern standard Malayalam.'
  terminology: '"പുരോഹിതൻ," "വീടിന്റെ പ്രവേശനകവാടം," and "അടച്ചിടണം" are appropriate. "അടച്ചിടണം" suitably retains the non-technical sense of closing off the house, without importing "quarantine."'
