    rationale: The phrase "വീട്ടിൽനിന്ന് വീടിന്റെ പ്രവേശനകവാടത്തിലേക്കു പുറത്തുപോയി" is less idiomatic than expressing first that the priest exits the house and then goes to its entrance.
