id: LEV.8.18
reference: Leviticus 8:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת אֵ֣יל הָ/עֹלָ֑ה וַֽ/יִּסְמְכ֞וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: ml
  text: പിന്നെ അവൻ ഹോമയാഗത്തിനുള്ള ആട്ടുകൊറ്റനെ സമർപ്പിച്ചു[a]. അഹരോനും അവന്റെ പുത്രന്മാരും ആട്ടുകൊറ്റന്റെ തലയിൽ തങ്ങളുടെ കൈകൾ വെച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടുത്തേക്കു കൊണ്ടുവന്നു’ എന്നോ ‘മുന്നോട്ടു കൊണ്ടുവന്നു’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് ‘കൈകൾ ചാരിവെച്ചു’ എന്നോ ‘അമർത്തിവെച്ചു’ എന്നോ അർഥമാകാം; യാഗമൃഗത്തിന്മേൽ നടത്തുന്ന ആചാരപരമായ പ്രവൃത്തിയെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: പിന്നെ അവൻ ... അടുത്തേക്കു കൊണ്ടുവന്നു
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അടുത്തേക്കു കൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്നർഥം നൽകുന്നു. ‘അടുത്തേക്കു കൊണ്ടുവന്നു’ എന്നത് ഹീബ്രുവിലെ യാഗകർമസംബന്ധിയായ ഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘അവൻ’ മോശെയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֵיל
  choice: ആട്ടുകൊറ്റൻ
  rationale: യാഗമൃഗമായി പറയുന്ന പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനുള്ള വ്യക്തവും സാധാരണവുമായ മലയാളപദം.
- source_word: הָעֹלָה
  choice: ഹോമയാഗത്തിനുള്ള
  rationale: עֹלָה എന്ന സ്ഥിരമായ യാഗപദത്തിന് ‘ഹോമയാഗം’ ഉപയോഗിച്ചു. ഈ ആട്ടുകൊറ്റൻ ആ യാഗത്തിനായി നിശ്ചയിക്കപ്പെട്ടതാണെന്ന് ‘-ത്തിനുള്ള’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּסְמְכוּ
  choice: വെച്ചു
  rationale: യാഗമൃഗത്തിന്റെ തലയിൽ കൈകൾ വയ്ക്കുന്ന ആചാരപരമായ പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു. ധാതുവിൽ ഉൾക്കൊള്ളാവുന്ന ‘ചാരിവെക്കുക/അമർത്തിവെക്കുക’ എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יְדֵיהֶם
  choice: തങ്ങളുടെ കൈകൾ
  rationale: ഹീബ്രുവിലെ ബഹുവചനം നിലനിർത്തുകയും കൈകൾ അഹരോന്റെയും പുത്രന്മാരുടെയും തന്നെയാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: ആട്ടുകൊറ്റന്റെ തലയിൽ
  rationale: ഹീബ്രു പൂർവപ്രത്യയപ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ കൈവയ്ക്കൽ
  choice: ആട്ടുകൊറ്റന്റെ തലയിൽ തങ്ങളുടെ കൈകൾ വെച്ചു
  alternative: ആട്ടുകൊറ്റന്റെ തലയിൽ തങ്ങളുടെ കൈകൾ ചാരിവെച്ചു / അമർത്തിവെച്ചു
  rationale: വാക്യം വിവരിക്കുന്ന ആചാരപരമായ പ്രവൃത്തി മാത്രം പരിഭാഷയിൽ പറയുന്നു. കുറ്റം കൈമാറൽ, താദാത്മ്യപ്പെടൽ തുടങ്ങിയ ദൈവശാസ്ത്രവ്യാഖ്യാനങ്ങൾ ഈ വാക്യം വ്യക്തമായി പ്രസ്താവിക്കാത്തതിനാൽ അവ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘ഹോമയാഗം’, ‘ആട്ടുകൊറ്റൻ’ എന്നീ പരിചിതമായ ബൈബിൾ-യാഗപദങ്ങൾ നിലനിർത്തി; അനാവശ്യമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
