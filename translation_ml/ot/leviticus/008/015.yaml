source:
  edition: WLC
  text: וַ/יִּשְׁחָ֗ט וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֶת הַ/דָּם֙ וַ֠/יִּתֵּן עַל קַרְנ֨וֹת הַ/מִּזְבֵּ֤חַ סָבִיב֙ בְּ/אֶצְבָּע֔/וֹ וַ/יְחַטֵּ֖א אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֗ם יָצַק֙ אֶל יְס֣וֹד הַ/מִּזְבֵּ֔חַ וַֽ/יְקַדְּשֵׁ֖/הוּ לְ/כַפֵּ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: ml
  text: അവൻ അതിനെ അറുത്തു. മോശെ രക്തം എടുത്ത് തന്റെ വിരൽകൊണ്ട് യാഗപീഠത്തിന്റെ ചുറ്റുമുള്ള കൊമ്പുകളിൽ പുരട്ടി, യാഗപീഠത്തെ ശുദ്ധീകരിച്ചു.[a] രക്തം യാഗപീഠത്തിന്റെ ചുവട്ടിൽ ഒഴിച്ചു; അതിൽ പ്രായശ്ചിത്തം നടത്തേണ്ടതിന് യാഗപീഠത്തെ വിശുദ്ധമാക്കി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വെടിപ്പാക്കി” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായ ക്രിയയ്ക്ക് ‘പാപം ചെയ്യിച്ചു’ എന്നല്ല, ആചാരപരമായ അശുദ്ധിയിൽനിന്ന് ശുദ്ധീകരിച്ചു എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: “അതിനെ ശുദ്ധീകരിക്കുന്ന ആചാരം നടത്തേണ്ടതിന്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് യാഗത്തിലൂടെയുള്ള പ്രായശ്ചിത്തം, പരിഹാരം, ശുദ്ധീകരണം എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: അവൻ അതിനെ അറുത്തു
  rationale: യാഗസന്ദർഭത്തിലെ שׁחט സാധാരണ കൊല്ലലല്ല, യാഗമൃഗത്തെ ആചാരപരമായി അറുക്കുന്നതാണ്; മുൻസന്ദർഭത്തിൽനിന്നുള്ള കർമം മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ ചുറ്റും
  rationale: കൊമ്പുകൾ എന്നത് യാഗപീഠത്തിലെ കൊമ്പുപോലുള്ള projections-നെ സൂചിപ്പിക്കുന്ന ആചാരപരമായ പദമാണ്; סָבִיב രക്തം ചുറ്റുമുള്ള കൊമ്പുകളിൽ പുരട്ടിയതിനെ വ്യക്തമാക്കുന്നു.
- source_word: בְּאֶצְבָּעוֹ
  choice: വിരൽകൊണ്ട്
  rationale: ഏകവചനമായ എബ്രായരൂപത്തിന്റെ ഉപകരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തെ ശുദ്ധീകരിച്ചു
  rationale: പുരോഹിതാചാരസന്ദർഭത്തിലെ חטא പിയേൽ രൂപം പാപം ചെയ്യിക്കുക എന്നല്ല, ആചാരപരമായ അശുദ്ധിയിൽനിന്ന് ശുദ്ധീകരിക്കുക എന്നാണ്.
- source_word: יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: ശേഷിച്ച രക്തം യാഗപീഠത്തിന്റെ ചുവട്ടിൽ ഒഴിച്ചു
  rationale: יְסוֹד അക്ഷരാർഥത്തിൽ അടിസ്ഥാനം എന്നാണെങ്കിലും യാഗപീഠസന്ദർഭത്തിൽ ചുവട് സ്വാഭാവികവും കൃത്യവുമാണ്; രണ്ടാമത്തെ הַדָּם സന്ദർഭത്തിൽ ശേഷിച്ച രക്തത്തെ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: അതിനെ വിശുദ്ധീകരിച്ചു
  rationale: യാഗപീഠത്തെ വിശുദ്ധമായ ഉപയോഗത്തിനായി വേർതിരിക്കുന്ന പ്രവൃത്തിയെ നേരായും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: לְכַפֵּר עָלָיו
  choice: യാഗപീഠത്തിനുവേണ്ടി പ്രായശ്ചിത്തം കഴിച്ച്
  rationale: כפר എന്ന കേന്ദ്ര യാഗപദത്തിന്റെ ഭാരം പ്രായശ്ചിത്തം കഴിക്കുക എന്ന സ്ഥാപിത മലയാളപ്രയോഗം നിലനിർത്തുന്നു; עָלָיו ഇവിടെ യാഗപീഠത്തെ ആചാരത്തിന്റെ ലക്ഷ്യവസ്തുവായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതീയ ശുദ്ധീകരണസന്ദർഭത്തിലെ חטא
  choice: യാഗപീഠത്തെ ശുദ്ധീകരിച്ചു
  alternative: യാഗപീഠത്തെ വെടിപ്പാക്കി
  rationale: യാഗപീഠം പാപം ചെയ്തുവെന്ന ധാരണ വരാതിരിക്കാനും രക്താചാരത്തിലൂടെയുള്ള ആചാരപരമായ ശുദ്ധീകരണം വ്യക്തമാക്കാനും ഈ രൂപം തിരഞ്ഞെടുത്തു.
- issue: യാഗസന്ദർഭത്തിലെ כפרയും עַל-ഉം
  choice: യാഗപീഠത്തിനുവേണ്ടി പ്രായശ്ചിത്തം കഴിച്ച്
  alternative: യാഗപീഠത്തെ ശുദ്ധീകരിക്കുന്ന ആചാരം നടത്തി; യാഗപീഠത്തിന്മേൽ പ്രായശ്ചിത്തം കഴിച്ച്
  rationale: പ്രായശ്ചിത്തം എന്ന പദം എബ്രായപദത്തിന്റെ ദൈവശാസ്ത്രഭാരം സംരക്ഷിക്കുന്നു. വാക്യത്തിലെ യാഗപീഠം തന്നെയാണ് ആചാരത്തിന്റെ ലക്ഷ്യം; സ്ഥലാർഥമായ 'മേൽ' മാത്രം ഉപയോഗിക്കുന്നത് മലയാളത്തിൽ തെറ്റിദ്ധരിപ്പിക്കാം.
- issue: പ്രവൃത്തികളുടെ ഉദ്ദേശ്യബന്ധം
  choice: പ്രായശ്ചിത്തം കഴിച്ച് അതിനെ വിശുദ്ധീകരിച്ചു
  alternative: അതിനെ വിശുദ്ധീകരിച്ചു, അതിനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കേണ്ടതിന്
  rationale: എബ്രായ infinitive לְכַפֵּר-നെ ഫലം/മാർഗം എന്ന സ്വാഭാവിക ബന്ധത്തിൽ അവതരിപ്പിക്കുന്നു; പ്രായശ്ചിത്തവും വിശുദ്ധീകരണവും തമ്മിലുള്ള യഥാർത്ഥ ആചാരപരമായ ബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. യാഗപീഠം, കൊമ്പുകൾ, പ്രായശ്ചിത്തം, വിശുദ്ധീകരണം എന്നീ സ്ഥാപിത ആചാരപദങ്ങൾ നിലനിർത്തി. ദീർഘമായ എബ്രായ ശൃംഖല വായനാസൗകര്യത്തിനായി നാല് മലയാളവാക്യങ്ങളാക്കി; അർഥക്രമം സംരക്ഷിച്ചു.
