id: LEV.8.9
reference: Leviticus 8:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: ml
  text: അവൻ അഹരോന്റെ തലയിൽ തലപ്പാവ് വെച്ചു; തലപ്പാവിന്റെ മുൻവശത്ത് സ്വർണത്തകിട്, അതായത് വിശുദ്ധ കിരീടം,[a] സ്ഥാപിച്ചു. യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധ ശിരോഭൂഷണം.’
    reason: നֵזֶר എന്ന പദത്തിന് കിരീടം, രാജമുടി, അല്ലെങ്കിൽ സമർപ്പണചിഹ്നമായ ശിരോഭൂഷണം എന്ന അർഥസാധ്യതയുണ്ട്.
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: തലപ്പാവ്
  rationale: പ്രധാനപുരോഹിതന്റെ പ്രത്യേക ശിരോവസ്ത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദമാണ് ‘തലപ്പാവ്’.
- source_word: אֶל מוּל פָּנָיו
  choice: മുൻവശത്ത്
  rationale: അഹരോന്റെ മുഖത്തിനു മുമ്പിലുള്ള സ്ഥലം എന്നതിലുപരി, തലപ്പാവിന്റെ മുന്നോട്ടു നോക്കുന്ന ഭാഗത്തുള്ള ഘടിപ്പിക്കൽസ്ഥാനമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: צִיץ
  choice: സ്വർണത്തകിട്
  rationale: മറ്റു സന്ദർഭങ്ങളിൽ ഈ പദത്തിന് ‘പൂവ്’ എന്നർഥമുണ്ടാകാമെങ്കിലും, ഇവിടെ പുറപ്പാട് 28:36-ലെ പുരോഹിതവസ്ത്രസന്ദർഭം സ്വർണത്തിൽ നിർമിച്ച അലങ്കാരത്തകിടിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: വിശുദ്ധ കിരീടം
  rationale: സ്വർണത്തകിടിനെ കൂടുതൽ വിശദീകരിക്കുന്ന സമാനാധികരണപ്രയോഗമാണിത്. ‘വിശുദ്ധ കിരീടം’ എബ്രായരൂപത്തോട് അടുത്തതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: വെച്ചു ... സ്ഥാപിച്ചു
  rationale: എബ്രായത്തിൽ ഒരേ ക്രിയ രണ്ടുതവണ വരുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ചെറിയ പദവ്യത്യാസം വരുത്തിയെങ്കിലും, രണ്ടിടത്തും വെക്കുക/ഘടിപ്പിക്കുക എന്ന അടിസ്ഥാനപ്രവൃത്തി നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: ദൈവകല്പനയോടുള്ള കൃത്യമായ അനുസരണം כַּאֲשֶׁר എന്ന പ്രയോഗത്തിൽ ഊന്നിപ്പറയുന്നതിനാൽ ‘പോലെതന്നെ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു; ഉച്ചാരണത്തിന്റെ അനിശ്ചിതത്വം കണക്കിലെടുത്ത് മലയാളത്തിൽ പ്രചാരമുള്ള അക്കാദമികരൂപമായ ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: נֵזֶר הַקֹּדֶשׁ എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: സ്വർണത്തകിടിനെ വിശദീകരിക്കുന്ന ‘വിശുദ്ധ കിരീടം’
  alternative: സ്വർണത്തകിടിൽനിന്നു വേറിട്ട മറ്റൊരു കിരീടം
  rationale: എബ്രായത്തിലെ സമാനാധികരണഘടന സ്വർണത്തകിടിനെയാണ് ‘വിശുദ്ധ കിരീടം’ എന്നു തിരിച്ചറിയിക്കുന്നത്; വേറൊരു വസ്തുവാണെന്ന ധാരണ ഒഴിവാക്കാൻ ‘അതായത്’ ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ സർവനാമമായ ‘അവന്റെ’ എന്നതിന് പകരം ‘അഹരോന്റെ’ എന്നു വ്യക്തമാക്കി; അവസാനക്രിയ മലയാളത്തിൽ പൂർണവാക്യമാക്കാൻ ‘അവൻ ചെയ്തു’ എന്നു സ്വാഭാവികമായി പൂരിപ്പിച്ചു. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘വിശുദ്ധ കിരീടം’ എന്ന പ്രയോഗത്തിനു പിന്നാലെ വെച്ചു.
