  text: וַ/יִּתֵּ֨ן עָלָ֜י/ו אֶת הַ/כֻּתֹּ֗נֶת וַ/יַּחְגֹּ֤ר אֹת/וֹ֙ בָּֽ/אַבְנֵ֔ט וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ אֶֽת הַ/מְּעִ֔יל וַ/יִּתֵּ֥ן עָלָ֖י/ו אֶת הָ/אֵפֹ֑ד וַ/יַּחְגֹּ֣ר אֹת֗/וֹ בְּ/חֵ֨שֶׁב֙ הָֽ/אֵפֹ֔ד וַ/יֶּאְפֹּ֥ד ל֖/וֹ בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: ml
  text: അവൻ അവനെ അങ്കി ധരിപ്പിച്ചു, അരപ്പട്ടകൊണ്ട് അവന്റെ അര മുറുക്കിക്കെട്ടി, അവനെ മേലങ്കി ധരിപ്പിച്ചു, അവനെ ഏഫോദ് അണിയിച്ചു, പിന്നെ ഏഫോദിന്റെ നെയ്ത അരപ്പട്ടകൊണ്ട് അത് അവന്റെ മേൽ മുറുക്കിക്കെട്ടി[a], അതുകൊണ്ട് ഏഫോദ് അവനോടു ചേർത്തുകെട്ടി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഏഫോദിന്റെ അലങ്കാരപ്പട്ട’ എന്നോ ‘ഏഫോദിന്റെ നടുക്കെട്ട്’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള അപൂർവ ഹീബ്രു ക്രിയ, ഏഫോദിന്റെ നെയ്ത അരപ്പട്ട ഉപയോഗിച്ച് അത് അഹരോന്റെ ശരീരത്തിൽ ഉറപ്പിച്ചു എന്നായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: അങ്കി
  rationale: ശരീരത്തോട് ചേർന്ന് ധരിക്കുന്ന അടിസ്ഥാന പുരോഹിതവസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പൊതുപദമാണ് ‘അങ്കി’; ‘ഉള്ളങ്കി’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ പ്രകടമല്ലാത്ത വിശദീകരണം ചേർന്നേക്കാം.
- source_word: אַבְנֵט
  choice: അരപ്പട്ട
  rationale: അരയ്ക്കു ചുറ്റിക്കെട്ടുന്ന തുണിപ്പട്ടയാണ് ഉദ്ദേശിക്കുന്നത്. ‘അരപ്പട്ട’ ആ പ്രവർത്തനം വ്യക്തമായി അറിയിക്കുകയും പുരോഹിതവസ്ത്രസന്ദർഭത്തിന് ചേരുകയും ചെയ്യുന്നു.
- source_word: מְעִיל
  choice: മേലങ്കി
  rationale: അങ്കിയുടെ മുകളിൽ ധരിക്കുന്ന പുറംവസ്ത്രം. ‘മേലങ്കി’ വസ്ത്രങ്ങളുടെ ക്രമവും വ്യത്യാസവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֵפֹד
  choice: ഏഫോദ്
  rationale: കൃത്യമായ മലയാള തുല്യപദമില്ലാത്ത പ്രത്യേക പുരോഹിതവസ്ത്രമായതിനാൽ സാങ്കേതിക നാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: ഏഫോദിന്റെ നെയ്ത അരപ്പട്ട
  rationale: ഏഫോദിനോടു ചേർന്നുണ്ടായിരുന്ന കലാപരമായി നെയ്ത അരപ്പട്ടയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘നെയ്ത’ അതിന്റെ നിർമ്മിതസ്വഭാവവും ‘അരപ്പട്ട’ അതിന്റെ ഉപയോഗവും അറിയിക്കുന്നു; പദത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
- source_word: וַיַּחְגֹּר אֹתוֹ
  choice: അരപ്പട്ടകൊണ്ട് അവന്റെ അര മുറുക്കി
  rationale: חגר എന്ന ക്രിയയുടെ അരയ്ക്കു ചുറ്റിക്കെട്ടുക എന്ന ദൃശ്യപ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: അതുകൊണ്ട് ഏഫോദ് അവനോടു ചേർത്തുകെട്ടി
  rationale: אֵפֹד എന്ന നാമത്തിൽനിന്നുള്ള അപൂർവ ക്രിയ ഏഫോദിനെ അതിന്റെ പട്ട ഉപയോഗിച്ചു ശരീരത്തിൽ ഉറപ്പിക്കുന്ന പ്രവൃത്തിയാണ് സൂചിപ്പിക്കുന്നത്. സർവനാമങ്ങളുടെ ബന്ധം മലയാളത്തിൽ അവ്യക്തമാകാതിരിക്കാൻ ഏഫോദ് വീണ്ടും വ്യക്തമാക്കി.
- source_word: וַיִּתֵּן עָלָיו
  choice: ധരിപ്പിച്ചു / അണിയിച്ചു
  rationale: വസ്ത്രം ഒരാളുടെ മേൽ വെക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന് സന്ദർഭോചിതമായ സ്വാഭാവിക മലയാളം. സാധാരണ വസ്ത്രങ്ങൾക്ക് ‘ധരിപ്പിച്ചു’ എന്നും സവിശേഷ പുരോഹിതവസ്ത്രമായ ഏഫോദിന് ‘അണിയിച്ചു’ എന്നും ഉപയോഗിച്ചു.
theological_decisions:
- issue: പുരോഹിതവസ്ത്രങ്ങളുടെ സാങ്കേതിക പദപ്രയോഗം
  choice: സാധാരണ വസ്ത്രനാമങ്ങൾ മലയാളത്തിലാക്കി, אֵפֹד എന്ന പ്രത്യേക ആരാധനാസംബന്ധിയായ പദം ‘ഏഫോദ്’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
  alternative: ‘ഏഫോദ്’ എന്നതിനെ ‘ഏപ്രൺപോലുള്ള പുരോഹിതവസ്ത്രം’ എന്നു വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം മുഖ്യമായി വസ്ത്രധാരണക്രമം വിവരിക്കുന്നതാണെങ്കിലും ഏഫോദിന്റെ ആരാധനാസംബന്ധിയായ പ്രത്യേകത നഷ്ടപ്പെടുത്തരുത്. വിവരണാത്മക പരിഭാഷ അതിന്റെ രൂപത്തെ അനാവശ്യമായി നിശ്ചയിച്ചേക്കാം.
- issue: അവസാന ക്രിയയുടെ അപൂർവതയും ഉപകരണബന്ധവും
  choice: നെയ്ത അരപ്പട്ടകൊണ്ട് ഏഫോദ് അഹരോനോടു ചേർത്തുകെട്ടിയതായി പ്രകടമാക്കി.
  alternative: ‘അതുകൊണ്ട് അവനെ ഏഫോദ് ധരിപ്പിച്ചു’ എന്ന കൂടുതൽ പദാനുപദ രൂപം.
  rationale: അപൂർവമായ denominative ക്രിയയുടെ കൃത്യമായ നിഴലർഥം അനിശ്ചിതമാണെങ്കിലും, അവസാനത്തെ בּוֹ പട്ടയെ സൂചിപ്പിക്കുകയും ഏഫോദ് ശരീരത്തിൽ ഉറപ്പിക്കുന്ന പ്രവൃത്തിയാണ് സന്ദർഭം ആവശ്യപ്പെടുകയും ചെയ്യുന്നു. അടിക്കുറിപ്പ് ഈ വ്യാഖ്യാനപരമായ പരിധി തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ആരാധനാവായനയ്ക്ക് യോജിച്ച മാന്യവും വ്യക്തവുമായ ശൈലി. ആവർത്തിച്ചുള്ള ഹീബ്രു ക്രിയാശൃംഖല വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; പ്രവൃത്തികളുടെ ക്രമം മാറ്റിയിട്ടില്ല. മൂലവാക്യത്തിൽ പേര് ആവർത്തിക്കാത്തതിനാൽ പ്രധാനപാഠത്തിൽ ‘അവൻ/അവനെ’ നിലനിർത്തി; അടിക്കുറിപ്പിൽ സന്ദർഭപരമായ തിരിച്ചറിയലായി അഹരോന്റെ പേര് ഉപയോഗിച്ചു.
