source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת הַ/חֵ֣לֶב וְ/אֶת הָֽ/אַלְיָ֗ה וְ/אֶֽת כָּל הַ/חֵלֶב֮ אֲשֶׁ֣ר עַל הַ/קֶּרֶב֒ וְ/אֵת֙ יֹתֶ֣רֶת הַ/כָּבֵ֔ד וְ/אֶת שְׁתֵּ֥י הַ/כְּלָיֹ֖ת וְ/אֶֽת חֶלְבְּ/הֶ֑ן וְ/אֵ֖ת שׁ֥וֹק הַ/יָּמִֽין־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: ml
  text: പിന്നെ അവൻ കൊഴുപ്പും കൊഴുപ്പേറിയ വാലും ഉള്ളവയവങ്ങളുടെ മേലുള്ള കൊഴുപ്പൊക്കെയും കരളിന്റെ മടലും[a] രണ്ടു വൃക്കകളും അവയുടെ കൊഴുപ്പും വലതു തുടയും എടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കരളിന്റെ അനുബന്ധഭാഗം.” യാഗക്രമത്തിൽ നീക്കം ചെയ്തിരുന്ന കരളിനോടു ചേർന്ന ഒരു പ്രത്യേക ഭാഗത്തെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: പിന്നെ അവൻ ... എടുത്തു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘പിന്നെ’ എന്നു നൽകി.
- source_word: הַחֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗസന്ദർഭത്തിൽ വേർതിരിച്ചെടുക്കുന്ന കൊഴുപ്പുള്ള ഭാഗങ്ങൾക്കുള്ള സാധാരണ പദം.
- source_word: הָאַלְיָה
  choice: തടിച്ച വാൽ
  rationale: കൊഴുപ്പേറിയ പ്രത്യേകതരം ചെമ്മരിയാടിന്റെ വാലിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; വെറും ‘വാൽ’ എന്നതിനെക്കാൾ കൃത്യം.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: കുടലുകളുടെ മേലുള്ള കൊഴുപ്പൊക്കെയും
  rationale: യാഗത്തിനായി മൃഗത്തെ വിഭജിക്കുന്ന സന്ദർഭത്തിൽ קֶרֶב ആന്തരിക അവയവങ്ങളെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷയായി ‘കുടലുകൾ’ തെരഞ്ഞെടുത്തു.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: കരളിന്റെ അനുബന്ധഭാഗം
  rationale: യാഗക്രമത്തിൽ നീക്കം ചെയ്യുന്ന കരളിനോടു ചേർന്ന പ്രത്യേക ഭാഗത്തെയാണ് അപൂർവമായ ഈ ശരീരശാസ്ത്രപദം സൂചിപ്പിക്കുന്നത്; ‘അനുബന്ധഭാഗം’ മൂലത്തിലെ അനിശ്ചിതത്വം അമിതമായി പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: രണ്ടു വൃക്കകൾ
  rationale: ദ്വിവചനത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ ശരീരശാസ്ത്രസമാനം.
- source_word: חֶלְבְּהֶן
  choice: അവയുടെ കൊഴുപ്പ്
  rationale: വൃക്കകളോടു ചേർന്ന കൊഴുപ്പുമായുള്ള ഉടമസ്ഥബന്ധം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: שׁוֹק הַיָּמִין
  choice: വലതു തുട
  rationale: שׁוֹק യാഗത്തിനായി വിഭജിച്ച മൃഗത്തിന്റെ കാലിലെ മുകളിലെ മാംസഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘തുട’ ഇവിടെ കൃത്യവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. യാഗശരീരശാസ്ത്രത്തിലെ പട്ടികയുടെ ഘടന സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു.
