  to: 'മോശെ അഹരോനോടും അവന്റെ പുത്രന്മാരോടും പറഞ്ഞു: “സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിങ്കൽ മാംസം പുഴുങ്ങുക. അവിടെവെച്ച് അതും പൗരോഹിത്യപ്രതിഷ്ഠാവഴിപാടുകളുടെ[a] കൊട്ടയിൽ ഉള്ള അപ്പവും ഭക്ഷിക്കുക. ‘അഹരോനും അവന്റെ പുത്രന്മാരും അതു ഭക്ഷിക്കണം’ എന്നു ഞാൻ കല്പിച്ചതുപോലെ.”'
