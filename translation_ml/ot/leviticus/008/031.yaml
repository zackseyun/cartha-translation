base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: ml
  text: 'മോശെ അഹരോനോടും അവന്റെ പുത്രന്മാരോടും പറഞ്ഞു: “സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിങ്കൽ മാംസം പുഴുങ്ങുക. അവിടെവെച്ച് അതും പൗരോഹിത്യപ്രതിഷ്ഠാവഴിപാടുകളുടെ[a] കൊട്ടയിൽ ഉള്ള അപ്പവും ഭക്ഷിക്കുക. ‘അഹരോനും അവന്റെ പുത്രന്മാരും അതു ഭക്ഷിക്കണം’ എന്നു ഞാൻ കല്പിച്ചതുപോലെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പൗരോഹിത്യപ്രതിഷ്ഠാവഴിപാടുകൾ” എന്നതിന് “സമർപ്പണച്ചടങ്ങിലെ വഴിപാടുകൾ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം പുരോഹിതന്മാരെ അവരുടെ ശുശ്രൂഷയിൽ സ്ഥാപിക്കുന്ന ചടങ്ങുമായി ബന്ധപ്പെട്ടതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: പുഴുങ്ങുക
  rationale: യാഗസംബന്ധമായ ഈ പാചകസന്ദർഭത്തിൽ ക്രിയയ്ക്ക് ‘വേവിക്കുക’ എന്ന പൊതുവായ അർഥത്തേക്കാൾ ‘പുഴുങ്ങുക’ എന്ന നിർദിഷ്ട അർഥം യോജിക്കുന്നു.
- source_word: הַבָּשָׂר
  choice: മാംസം
  rationale: ഭക്ഷിക്കാവുന്ന യാഗമാംസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പദം.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽവെച്ച്
  rationale: פֶּתַח എന്നതിന്റെ സ്ഥലസൂചനയും ആചാരപരമായ നിർദിഷ്ട സ്ഥാനവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: അവിടെവെച്ച് അതും ... ഭക്ഷിക്കുക
  rationale: שָׁם നൽകുന്ന സ്ഥലഊന്നൽ ‘അവിടെവെച്ച്’ എന്നതിലൂടെ സംരക്ഷിക്കുകയും തുടർന്നുള്ള അപ്പവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הַלֶּחֶם
  choice: അപ്പം
  rationale: പ്രതിഷ്ഠാകർമത്തോടൊപ്പമുള്ള അപ്പത്തെയാണ് ഇവിടെ നേരിട്ട് സൂചിപ്പിക്കുന്നത്.
- source_word: סַל הַמִּלֻּאִים
  choice: പൗരോഹിത്യപ്രതിഷ്ഠയ്ക്കുള്ള വഴിപാടുകളുടെ കുട്ട
  rationale: מִלֻּאִים അഹരോന്റെയും പുത്രന്മാരുടെയും പുരോഹിതസ്ഥാനാരോഹണച്ചടങ്ങിനെ സൂചിപ്പിക്കുന്നു. ‘പൗരോഹിത്യപ്രതിഷ്ഠ’ സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘വഴിപാടുകൾ’ കുട്ടയുടെ ആചാരപരമായ ഉള്ളടക്കബന്ധം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: ‘...’ എന്നു ഞാൻ കല്പിച്ചതുപോലെതന്നെ ചെയ്യുക
  rationale: ഹീബ്രുവിലെ ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ഘടന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ കല്പനാവാക്യമാക്കുന്നു.
- source_word: יֹאכְלֻהוּ
  choice: അതു ഭക്ഷിക്കണം
  rationale: ഇവിടത്തെ അപൂർണക്രിയയുടെ നിർദേശാത്മക/ബാധ്യതാസൂചന ‘ഭക്ഷിക്കണം’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; വെറും ഭാവികാലമായി മാറ്റുന്നില്ല.
theological_decisions:
- issue: പുരോഹിതസ്ഥാപനസന്ദർഭത്തിലെ מִלֻּאִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പൗരോഹിത്യപ്രതിഷ്ഠയ്ക്കുള്ള വഴിപാടുകൾ
  alternative: സമർപ്പണച്ചടങ്ങിനുള്ള വഴിപാടുകൾ
  rationale: പദം അഹരോനെയും പുത്രന്മാരെയും പുരോഹിതശുശ്രൂഷയിൽ സ്ഥാപിക്കുന്ന ആചാരത്തോടു ബന്ധപ്പെട്ടതാണ്. ‘പൗരോഹിത്യപ്രതിഷ്ഠ’ ഈ പ്രത്യേക സന്ദർഭം വ്യക്തമാക്കുന്നു; എന്നാൽ പിന്നീട് രൂപപ്പെട്ട സഭാപദവികളുടെ ആശയം ഇതിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല. സാധുവായ മറ്റൊരു അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചു. ‘സമാഗമകൂടാരം’ എന്ന പരിചിതമായ തിരുവെഴുത്തുപദം നിലനിർത്തി; അപരിചിതമായ സാങ്കേതിക പദസമുച്ചയങ്ങൾ പരമാവധി ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘പൗരോഹിത്യപ്രതിഷ്ഠയ്ക്കുള്ള വഴിപാടുകൾ’ ഉൾപ്പെടുന്ന വാക്യത്തിന്റെ അവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
