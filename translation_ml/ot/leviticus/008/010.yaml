source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וַ/יִּמְשַׁ֥ח אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וַ/יְקַדֵּ֖שׁ אֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: ml
  text: പിന്നെ മോശ അഭിഷേകതൈലം എടുത്ത് തിരുനിവാസത്തെയും അതിലുള്ള സകലത്തെയും അഭിഷേകം ചെയ്ത് അവയെ വിശുദ്ധീകരിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രതിഷ്ഠിച്ചു’ അല്ലെങ്കിൽ ‘വിശുദ്ധമാക്കി.’
    reason: קדשׁ എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ പരിഭാഷാവികല്പങ്ങൾ.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: പിന്നെ മോശ ... എടുത്ത്
  rationale: വയ്യിഖ്തോൽ രൂപം കഥയിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘പിന്നെ’ ആ തുടർച്ച സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലം
  rationale: അഭിഷേകത്തിനായി ഉപയോഗിക്കുന്ന എണ്ണയെ സൂചിപ്പിക്കുന്ന സംയുക്തപദം; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘വിശുദ്ധ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: וַיִּמְשַׁח
  choice: അഭിഷേകംചെയ്ത്
  rationale: എണ്ണ പുരട്ടി ദൈവിക ശുശ്രൂഷയ്ക്കായി വേർതിരിക്കുന്ന ആചാരപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: പുറപ്പാട്–ലേവ്യപുസ്തക പശ്ചാത്തലത്തിലെ ദൈവസാന്നിധ്യത്തിന്റെ വിശുദ്ധ കൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ സാങ്കേതിക പ്രയോഗം.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: അതിലുള്ള സകലത്തെയും
  rationale: തിരുനിവാസത്തിനുള്ളിലെ ഉപകരണങ്ങളും വസ്തുക്കളും മുഴുവനായി ഉൾപ്പെടുന്നു; എബ്രായപ്രയോഗത്തിന്റെ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: അവയെ വിശുദ്ധീകരിച്ചു
  rationale: പുരോഹിതാചാര പശ്ചാത്തലത്തിൽ വിശുദ്ധമായി വേർതിരിക്കുക എന്ന קדשׁ-ന്റെ അർഥം നൽകുന്നു; ബഹുവചന സർവനാമം തിരുനിവാസത്തെയും അതിലുള്ള സകലത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതാചാര പശ്ചാത്തലത്തിൽ קדשׁ എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: വിശുദ്ധീകരിച്ചു
  alternative: പ്രതിഷ്ഠിച്ചു; വിശുദ്ധമാക്കി
  rationale: ഈ സന്ദർഭം തിരുനിവാസത്തെയും അതിലെ വസ്തുക്കളെയും ദൈവിക ഉപയോഗത്തിനായി വിശുദ്ധമായി വേർതിരിക്കുന്നതിനെ വിവരിക്കുന്നു. ‘വിശുദ്ധീകരിച്ചു’ ആചാരപരമായ ശക്തി നിലനിർത്തുകയും പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക സിദ്ധാന്താർത്ഥങ്ങൾ നിർബന്ധമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾശൈലി. ‘തിരുനിവാസം,’ ‘അഭിഷേകതൈലം,’ ‘വിശുദ്ധീകരിച്ചു’ എന്നീ പദങ്ങൾ ആചാരപരമായ കൃത്യതയും സാധാരണ വായനക്കാർക്കുള്ള ഗ്രാഹ്യതയും തുലനം ചെയ്യുന്നു.
