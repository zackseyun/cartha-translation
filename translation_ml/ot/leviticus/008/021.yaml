- from: 'അന്തരാവയവങ്ങളും കാലുകളും അവൻ വെള്ളത്തിൽ കഴുകി. മോശെ ആട്ടുകൊറ്റനെ മുഴുവനും യാഗപീഠത്തിന്മേൽ ദഹിപ്പിച്ചു. അത് ഹൃദ്യസുഗന്ധമായ ഒരു ദഹനയാഗമായിരുന്നു—യഹ്‌വെക്കുള്ള അഗ്നിയർപ്പണം[a]—യഹ്‌വെ മോശെയോടു കല്പിച്ചതുപോലെതന്നെ.


