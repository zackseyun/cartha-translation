id: LEV.8.21
reference: Leviticus 8:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַ/קֶּ֥רֶב וְ/אֶת הַ/כְּרָעַ֖יִם רָחַ֣ץ בַּ/מָּ֑יִם וַ/יַּקְטֵר֩ מֹשֶׁ֨ה אֶת כָּל הָ/אַ֜יִל הַ/מִּזְבֵּ֗חָ/ה עֹלָ֨ה ה֤וּא לְ/רֵֽיחַ נִיחֹ֨חַ֙ אִשֶּׁ֥ה הוּא֙ לַ/יהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: ml
  text: അന്തരാവയവങ്ങളും കാലുകളും അവൻ വെള്ളത്തിൽ കഴുകി. മോശെ ആട്ടുകൊറ്റനെ മുഴുവനും യാഗപീഠത്തിന്മേൽ ദഹിപ്പിച്ചു. അത് യഹ്‌വെക്കു ഹൃദ്യസുഗന്ധമായ ദഹനയാഗവും അഗ്നിയർപ്പണവും[a] ആയിരുന്നു—യഹ്‌വെ മോശെയോടു കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെക്കുള്ള ഭക്ഷ്യയാഗം.”
    reason: אִשֶּׁה എന്ന പദം അടിസ്ഥാനമായി അഗ്നിയിലൂടെ അർപ്പിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്നു; യാഗപീഠത്തിലെ ദൈവിക ‘ഭക്ഷണം’ എന്ന ആശയവുമായി ബന്ധപ്പെടുത്തി ‘ഭക്ഷ്യയാഗം’ എന്നും വിവർത്തനം ചെയ്യപ്പെടാം.
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: അന്തരാവയവങ്ങൾ
  rationale: യാഗമൃഗത്തിന്റെ ഉള്ളിലുള്ള അവയവങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ പ്രയോഗമാണിത്.
- source_word: הַכְּרָעַיִם
  choice: കാലുകൾ
  rationale: യാഗനിർദേശങ്ങളിൽ മൃഗത്തിന്റെ കാലുകൾ, പ്രത്യേകിച്ച് താഴത്തെ കാലുകൾ, എന്ന അർഥം; ‘കാലുകൾ’ സാധാരണ വായനക്കാർക്ക് ഏറ്റവും സ്വാഭാവികം.
- source_word: רָחַץ בַּמָּיִם
  choice: വെള്ളത്തിൽ കഴുകി
  rationale: ക്രിയയുടെ സാധാരണ അർഥവും ഹീബ്രുവിൽ വ്യക്തമായി പറഞ്ഞിരിക്കുന്ന വെള്ളവും നിലനിർത്തുന്നു.
- source_word: וַיַּקְטֵר
  choice: ദഹിപ്പിച്ചു
  rationale: യാഗപീഠത്തിൽ യാഗവസ്തു പുകയായി ഉയരുന്നവിധം കത്തിക്കുന്ന ആരാധനാപരമായ പ്രവൃത്തിയാണ്; മലയാളത്തിലെ യാഗസന്ദർഭത്തിൽ ‘ദഹിപ്പിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כָּל הָאַיִל
  choice: ആട്ടുകൊറ്റനെ മുഴുവനും
  rationale: כָּל സൂചിപ്പിക്കുന്ന സമ്പൂർണത വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עֹלָה
  choice: ദഹനയാഗം
  rationale: മുഴുവൻ യാഗവസ്തുവും യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന ഈ യാഗവിഭാഗത്തിന് മലയാളത്തിൽ വ്യക്തമായ പരമ്പരാഗത പദം.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ഹൃദ്യസുഗന്ധമായ
  rationale: ദൈവത്തിനു സ്വീകാര്യവും പ്രസാദകരവുമായ സുഗന്ധം എന്ന യാഗരൂപകം, അതിനെ വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ, സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִשֶּׁה
  choice: അഗ്നിയർപ്പണം
  rationale: അഗ്നിയിലൂടെ അർപ്പിക്കുന്ന യാഗം എന്ന പദത്തിന്റെ നേരിട്ടുള്ള ആരാധനാപരമായ അർഥം നൽകുന്നു; ‘ഭക്ഷ്യയാഗം’ എന്ന യാഗപീഠ-ഭക്ഷണ സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ഹീബ്രു ദൈവനാമത്തിന്റെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹ്‌വെ മോശെയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: ദൈവകല്പനയോടുള്ള കൃത്യമായ അനുരൂപത כַּאֲשֶׁר എന്ന പദം ഊന്നിപ്പറയുന്നത് ‘പോലെതന്നെ’ വഴി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു; അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തി.
- issue: לְרֵיחַ נִיחֹחַ എന്ന യാഗപ്രയോഗം
  choice: ഹൃദ്യസുഗന്ധമായ
  alternative: പ്രസാദകരമായ സുഗന്ധത്തിനായുള്ള
  rationale: ദൈവസ്വീകാര്യത സൂചിപ്പിക്കുന്ന ഇന്ദ്രിയരൂപകം നിലനിർത്തുന്നു; അതേസമയം അതിനെ അസ്വാഭാവികമായ വിശദീകരണവാക്യമാക്കി മാറ്റുന്നില്ല.
- issue: אִשֶּׁה എന്ന പദത്തിന്റെ ആരാധനാപരമായ അർഥം
  choice: അഗ്നിയർപ്പണം
  alternative: ഭക്ഷ്യയാഗം
  rationale: അഗ്നിയിലൂടെ അർപ്പിക്കുന്ന യാഗം എന്ന നേരിട്ടുള്ള അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ദൈവത്തിന്റെ യാഗപീഠ-ഭക്ഷണം എന്ന സാദ്ധ്യമായ ആശയസൂചന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ യാഗസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘ദഹനയാഗം’, ‘യാഗപീഠം’, ‘അഗ്നിയർപ്പണം’ തുടങ്ങിയ ആരാധനാപദങ്ങൾ വ്യക്തതയ്ക്കായി നിലനിർത്തി; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
