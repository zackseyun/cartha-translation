  text: כַּ/אֲשֶׁ֥ר עָשָׂ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה צִוָּ֧ה יְהוָ֛ה לַ/עֲשֹׂ֖ת לְ/כַפֵּ֥ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: ml
  text: ഇന്ന് ചെയ്തതുപോലെതന്നെ[a], നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം നിർവഹിക്കാൻ യഹോവ ഇങ്ങനെ ചെയ്യാൻ കല്പിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇന്ന് ചെയ്തതുപോലെ, നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം നിർവഹിക്കേണ്ടതിന് യഹോവ ഇങ്ങനെ ചെയ്യാൻ കല്പിച്ചിരിക്കുന്നു.”'
    reason: ഹീബ്രു വാക്യത്തിലെ താരതമ്യഘടനയും ഉദ്ദേശ്യസൂചകമായ ക്രിയാപ്രയോഗവും മലയാളത്തിൽ അല്പം വ്യത്യസ്തമായി ക്രമീകരിക്കാം.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ചെയ്തതുപോലെതന്നെ
  rationale: മുമ്പ് നിർവഹിച്ച അനുഷ്ഠാനങ്ങളോടുള്ള താരതമ്യബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָשָׂה
  choice: ചെയ്തത്
  rationale: രൂപത്തിൽ മൂന്നാംപുരുഷ ഏകവചനമാണെങ്കിലും ഇവിടെ കർത്താവ് വ്യക്തമാക്കാത്ത അനുഷ്ഠാനപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ നപുംസക ക്രിയാനാമപ്രയോഗം അനാവശ്യമായി കർത്താവിനെ ചേർക്കാതെ അർത്ഥം നൽകുന്നു.
- source_word: בַּיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: ഇപ്പോൾ നടന്നുകൊണ്ടിരിക്കുന്ന അനുഷ്ഠാനദിവസത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: צִוָּה
  choice: കല്പിച്ചിരിക്കുന്നു
  rationale: നൽകപ്പെട്ട കല്പനയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രസക്തി മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לַעֲשֹׂת
  choice: ചെയ്യണമെന്ന്
  rationale: മുൻ ക്രിയയെ പ്രതിധ്വനിപ്പിക്കുകയും, കർത്താവിനെ നിർബന്ധമായി വ്യക്തമാക്കാതെ കല്പിക്കപ്പെട്ട പ്രവൃത്തി നിർവഹിക്കപ്പെടണം എന്ന ആശയം നൽകുകയും ചെയ്യുന്നു.
- source_word: לְכַפֵּר
  choice: പ്രായശ്ചിത്തം കഴിക്കാൻ
  rationale: പുരോഹിത-യാഗസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ സ്ഥാപിതമായ അർത്ഥം സംരക്ഷിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളപ്രയോഗം.
- source_word: עֲלֵיכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: כפר-നോടൊപ്പമുള്ള על ഇവിടെ ‘നിങ്ങൾക്കായി/നിങ്ങളുടെ പേരിൽ’ എന്ന അർത്ഥം നൽകുന്നു; ‘നിങ്ങൾക്കുവേണ്ടി’ അത് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കാൻ
  alternative: നിങ്ങൾക്കുവേണ്ടി പാപപരിഹാരം വരുത്താൻ
  rationale: ‘പ്രായശ്ചിത്തം കഴിക്കുക’ പുരോഹിതാനുഷ്ഠാനത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു. ‘പാപപരിഹാരം’ എന്നത് അർത്ഥത്തെ ഒരു പ്രത്യേക ഫലത്തിലേക്ക് ചുരുക്കാൻ ഇടയുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ അനുഷ്ഠാനഭാഷ ഉപയോഗിച്ചു. കർത്താവിനെ വ്യക്തമാക്കാത്ത ഹീബ്രു പ്രയോഗം മലയാളത്തിലും അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല; വാക്യത്തിലെ താരതമ്യഘടനയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
