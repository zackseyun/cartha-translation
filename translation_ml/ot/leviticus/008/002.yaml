id: LEV.8.2
reference: Leviticus 8:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: ml
  text: അഹരോനെയും അവനോടൊപ്പം അവന്റെ പുത്രന്മാരെയും, വസ്ത്രങ്ങളെയും, അഭിഷേകതൈലത്തെയും, പാപയാഗത്തിനുള്ള കാളയെയും[a], രണ്ട് ആട്ടുകൊറ്റന്മാരെയും, പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ കൊട്ടയെയും എടുക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുദ്ധീകരണയാഗത്തിനുള്ള കാള.” എബ്രായപദം പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയും ആചാരപരമായ ശുദ്ധീകരണത്തിനുള്ള യാഗത്തെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: എടുക്കുക
  rationale: לקח എന്ന ക്രിയയുടെ ഏകവചന പുരുഷലിംഗ ആജ്ഞാരൂപം. ആളുകളെയും ആചാരോപകരണങ്ങളെയും ഒരുമിച്ച് ഉൾക്കൊള്ളുന്ന ഈ പട്ടികയിൽ, ചലനത്തിന്റെ ദിശ അനാവശ്യമായി വ്യക്തമാക്കാതെ കല്പനയുടെ നേരിട്ടുള്ള സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ നാമരൂപം ഉപയോഗിച്ചു.
- source_word: בָּנָיו אִתּוֹ
  choice: അവനോടൊപ്പം അവന്റെ പുത്രന്മാർ
  rationale: אִתּוֹ എന്ന ‘അവനോടൊപ്പം’ എന്ന ഘടകം ഒഴിവാക്കാതെ, അതിന്റെ സൂചന അഹരോനിലേക്കാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַבְּגָדִים
  choice: വസ്ത്രങ്ങൾ
  rationale: പുരോഹിതസന്ദർഭം ഉണ്ടായിരുന്നാലും, എബ്രായപദത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തി സാങ്കേതികമായ അധികവിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലം
  rationale: ‘അഭിഷേകത്തിനുള്ള എണ്ണ’ എന്ന ബന്ധത്തെ മലയാളത്തിൽ സ്വാഭാവികവും ആചാരപരമായി വ്യക്തവുമായ സംയുക്തപദമായി നൽകുന്നു.
- source_word: פַּר הַחַטָּאת
  choice: പാപയാഗത്തിനുള്ള കാള
  rationale: פַּר എന്നത് ‘കാള’; חַטָּאת ഇവിടെ യാഗത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ‘പാപയാഗത്തിനുള്ള’ എന്നു നൽകി; ശുദ്ധീകരണപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: שְׁנֵי הָאֵילִים
  choice: രണ്ട് ആട്ടുകൊറ്റന്മാർ
  rationale: സംഖ്യയും മൃഗനാമവും നേരിട്ട്, സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: סַל הַמַּצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ കൊട്ട
  rationale: מַצּוֹת എന്നത് പുളിപ്പിക്കാത്ത അപ്പത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ഈ വാക്യം മാത്രം ആവശ്യപ്പെടാത്ത ‘അടകൾ’ അല്ലെങ്കിൽ ‘അപ്പക്കഷണങ്ങൾ’ പോലുള്ള രൂപവിശദീകരണം ഒഴിവാക്കി.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഇവിടെ പദം യാഗമൃഗവുമായി ബന്ധപ്പെട്ടതിനാൽ ഒരു യാഗത്തെ സൂചിപ്പിക്കുന്ന പരിഭാഷ ആവശ്യമാണ്. ‘പാപയാഗം’ പരിചിതവും അടിസ്ഥാനാർഥത്തോട് അടുത്തതുമാണ്; എന്നാൽ ആചാരപരമായ ശുദ്ധീകരണവശം മുന്നിൽ കൊണ്ടുവരുന്ന ‘ശുദ്ധീകരണയാഗം’ എന്ന സാധുവായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള ബന്ധകങ്ങൾ മലയാളപ്പട്ടികയുടെ സ്വാഭാവികതയ്ക്കനുസരിച്ച് ചിഹ്നവിരാമങ്ങളാലും അവസാനത്തെ ‘-യും’ ഘടനയാലും അവതരിപ്പിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം അത് വിശദീകരിക്കുന്ന ‘പാപയാഗം’ എന്ന പദബന്ധത്തിനുശേഷം സ്ഥാപിച്ചു.
