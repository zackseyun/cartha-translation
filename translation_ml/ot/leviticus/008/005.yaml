id: LEV.8.5
reference: Leviticus 8:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: ml
  text: 'മോശെ സഭയോടു പറഞ്ഞു: “യാഹ്‌വേ ചെയ്യാൻ കല്പിച്ച കാര്യം ഇതാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ മുൻവാക്യത്തോടുള്ള ബന്ധം സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ നിർബന്ധമായി ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘എന്നിട്ട്’ ചേർക്കാതെ സ്വാഭാവികമായി ‘പറഞ്ഞു’ എന്നു നൽകി.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: אֶל־הָעֵדָה
  choice: സഭയോടു
  rationale: עֵדָה ഇവിടെ ഒത്തുകൂടിയ ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ആരാധനാസന്ദർഭത്തിലെ കൂട്ടായ അർത്ഥം സ്വാഭാവികമായി നൽകുന്ന പദമാണ് ‘സഭ’.
- source_word: זֶה הַדָּבָר
  choice: കാര്യം ഇതാണ്
  rationale: പ്രദർശകസർവനാമവും നാമവും നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമം ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר צִוָּה
  choice: കല്പിച്ച
  rationale: ബന്ധവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല കൃതന്തരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; മുമ്പ് നൽകിയ കല്പനയുടെ ഇപ്പോഴത്തെ പ്രസക്തി സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകി.
- source_word: לַעֲשׂוֹת
  choice: ചെയ്യാൻ
  rationale: ഹീബ്രു ക്രിയാനാമം രൂപപരമായി സജീവമാണ്, ‘ചെയ്യാൻ’ എന്നതാണ് അതിന്റെ നേരിട്ടുള്ള മലയാളരൂപം. ആരാണ് ചെയ്യേണ്ടത് എന്നത് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയായി മാറ്റാതെ നിലനിർത്തി. ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും മാന്യവുമായ രൂപമായി ‘യഹോവ’ തെരഞ്ഞെടുത്തു.
- issue: לַעֲשׂוֹת എന്ന ക്രിയാനാമത്തിന്റെ കർത്തൃഭാവമോ കർമണിഭാവമോ
  choice: ചെയ്യാൻ
  alternative: ചെയ്യപ്പെടാൻ
  rationale: ഹീബ്രു രൂപം സജീവ ക്രിയാനാമമാണ്; എന്നാൽ പ്രവർത്തകനെ വ്യക്തമാക്കാത്തതിനാൽ ആശയത്തിൽ പൊതുവായ/അനിർദ്ദിഷ്ട ഭാവമുണ്ട്. മലയാളത്തിലെ ‘ചെയ്യാൻ’ ഈ രൂപപരമായ സജീവതയും സന്ദർഭത്തിലെ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു; ‘ചെയ്യപ്പെടാൻ’ എന്നു നൽകിയാൽ കർമണിഭാവം കൂടുതൽ വ്യക്തമായി വ്യാഖ്യാനിച്ചുപോകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമായ ശൈലി. അനാവശ്യ പുരാതനപ്രയോഗങ്ങൾ ഒഴിവാക്കി; ഹീബ്രുവിലെ സംക്ഷിപ്തതയും കല്പനയുടെ ഔപചാരിക സ്വരവും നിലനിർത്തി.
