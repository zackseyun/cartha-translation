id: LEV.8.3
reference: Leviticus 8:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל הָ/עֵדָ֖ה הַקְהֵ֑ל אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/003.yaml
  text: And assemble all the congregation at the entrance of the tent of meeting[a].
translation:
  language: ml
  text: സഭയെ മുഴുവനും സമാഗമനകൂടാരത്തിന്റെ പ്രവേശനവാതിൽക്കൽ വിളിച്ചുകൂട്ടുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സമൂഹത്തെ മുഴുവനും വിളിച്ചുകൂട്ടുക.’ എബ്രായത്തിലെ עֵדָה എന്ന പദം സന്ദർഭമനുസരിച്ച് ‘സഭ’, ‘സമ്മേളനം’, ‘സമൂഹം’ എന്നിങ്ങനെ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: '[വാക്യക്രമത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി]'
  rationale: וְ തുടർന്നുള്ള കല്പനയെ മുൻവാക്യത്തോടു ബന്ധിപ്പിക്കുന്നു; אֵת നിർദിഷ്ട കർമത്തെ അടയാളപ്പെടുത്തുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ കല്പന സ്വാഭാവികമായി നൽകാം.
- source_word: כָּל הָעֵדָה
  choice: സഭയെ മുഴുവനും
  rationale: כָּל സമൂഹത്തിന്റെ സമഗ്രത ഊന്നിപ്പറയുന്നു. עֵדָה ഇവിടെ ഇസ്രായേൽ സമൂഹത്തെ കൂട്ടായ ഘടകമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘സഭ’ യോജിക്കുന്നു; ‘മുഴുവനും’ ആകെപ്പാടുള്ള അർഥം വ്യക്തമാക്കുന്നു.
- source_word: הַקְהֵל
  choice: വിളിച്ചുകൂട്ടുക
  rationale: קהל എന്ന ധാതുവിന്റെ ഹിഫീൽ ആജ്ഞാരൂപം ആളുകളെ ഒന്നിച്ചുകൂട്ടുക എന്ന കാരണാർത്ഥം നൽകുന്നു. ‘വിളിച്ചുകൂട്ടുക’ ആജ്ഞയുടെ സജീവത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל פֶּתַח
  choice: പ്രവേശനവാതിൽക്കൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘പ്രവേശനത്തിലേക്ക്’ എന്നാകാമെങ്കിലും, കൂട്ടം ചേരേണ്ട സ്ഥാനം സൂചിപ്പിക്കുന്ന സാഹചര്യത്തിൽ മലയാളത്തിലെ സ്ഥാനവാചകമായ ‘പ്രവേശനവാതിൽക്കൽ’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമനകൂടാരം
  rationale: നിയമിതമായ കൂടിക്കാഴ്ചയുടെ കൂടാരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പദസമുച്ചയമാണിത്. ‘സമാഗമനകൂടാരം’ അർഥവും പുരോഹിതസന്ദർഭത്തിലെ ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം. പുരോഹിതസന്ദർഭത്തിന് യോജിച്ച ‘സമാഗമനകൂടാരം’ നിലനിർത്തി; עֵדָהയുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
