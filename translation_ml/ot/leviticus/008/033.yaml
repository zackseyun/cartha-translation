id: LEV.8.33
reference: Leviticus 8:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵי/כֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: ml
  text: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽനിന്ന് ഏഴു ദിവസം നിങ്ങൾ പുറത്തുപോകരുത്—നിങ്ങളുടെ പുരോഹിതനിയമനചടങ്ങിന്റെ ദിവസങ്ങൾ പൂർത്തിയാകുന്ന ദിവസംവരെ. കാരണം, ഏഴു ദിവസം അവൻ നിങ്ങളുടെ കൈ നിറയ്ക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിങ്ങളുടെ കൈ നിറയ്ക്കും.” ഒരാളെ പുരോഹിതശുശ്രൂഷയിൽ നിയമിക്കുകയോ സ്ഥാപിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: പ്രവേശനകവാടത്തിൽനിന്ന്
  rationale: פֶּתַח ഒരു തുറവിനെയോ പ്രവേശനസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രവേശനകവാടം’ സ്ഥലസൂചന വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവസന്നിധിയിൽ കൂടിവരുന്നതിനുള്ള വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന ഈ സ്ഥിരപ്രയോഗം മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും എബ്രായപദങ്ങളുടെ അർഥത്തോട് അടുത്തതുമാണ്.
- source_word: לֹא תֵצְאוּ
  choice: നിങ്ങൾ പുറത്തുപോകരുത്
  rationale: നിഷേധത്തോടുകൂടിയ ക്രിയയുടെ നിർദേശാത്മക ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഈ പദസമുച്ചയം വാക്യത്തിൽ രണ്ടിടത്തും ആവർത്തിക്കുന്നതും നിലനിർത്തുന്നു.
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: നിങ്ങളുടെ സ്ഥാനാരോഹണദിവസങ്ങൾ പൂർത്തിയാകുന്ന ദിവസംവരെ
  rationale: מִלֻּאִים പുരോഹിതശുശ്രൂഷയിലേക്കുള്ള ഔദ്യോഗിക സ്ഥാപനം സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. ‘സ്ഥാനാരോഹണം’ ആ ചടങ്ങിന്റെ സ്വഭാവം ചുരുക്കമായും മനസ്സിലാകുന്ന വിധത്തിലും നൽകുന്നു; എബ്രായത്തിലെ കാലപരിധിയും വാക്യഘടനയും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻനിർദേശത്തിന് കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: יְמַלֵּא אֶת־יֶדְכֶם
  choice: അവൻ നിങ്ങളുടെ കൈകൾ നിറയ്ക്കും
  rationale: പുരോഹിതസ്ഥാനത്ത് നിയമിക്കുക എന്ന അർഥമുള്ള എബ്രായ സാങ്കേതിക പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു. ഒന്നിലധികം അഭിസംബോധിതർ ഉള്ളതിനാൽ വിതരണം സൂചിപ്പിക്കുന്ന എബ്രായ ഏകവചനത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘കൈകൾ’ എന്നു നൽകി; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: מלא את־יד എന്ന പുരോഹിതസ്ഥാനാരോഹണ പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: മുഖ്യവാചകത്തിൽ ‘നിങ്ങളുടെ കൈകൾ നിറയ്ക്കും’ എന്ന എബ്രായ പ്രയോഗം നിലനിർത്തി അടിക്കുറിപ്പിൽ അതിന്റെ സാങ്കേതിക അർഥം വ്യക്തമാക്കുക.
  alternative: ‘നിങ്ങളെ പുരോഹിതന്മാരായി നിയമിക്കും’ അല്ലെങ്കിൽ ‘നിങ്ങളെ സ്ഥാനാരോഹണം ചെയ്യിക്കും’ എന്നു മുഖ്യവാചകത്തിൽ അർഥവിവർത്തനം ചെയ്യുക.
  rationale: ഈ രൂപകം അതേ വാക്യത്തിലെ מִלֻּאִים എന്ന സ്ഥാനാരോഹണപദവുമായി ഉദ്ദേശ്യപൂർവമായ ശാബ്ദികബന്ധം പുലർത്തുന്നു. അതിനെ നിലനിർത്തുന്നത് ആചാരപരമായ ഭാഷയും ആവർത്തനവും വായനക്കാരന് കാണാൻ സഹായിക്കുന്നു; അടിക്കുറിപ്പ് അവ്യക്തത ഒഴിവാക്കുന്നു.
- issue: יְמַלֵּא എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: എബ്രായത്തിലുള്ള മൂന്നാംപുരുഷ ഏകവചനത്തെ പിന്തുടർന്ന് ‘അവൻ’ എന്നു നൽകുക.
  alternative: സന്ദർഭത്തിന്റെ അടിസ്ഥാനത്തിൽ ‘മോശെ’ എന്നു വ്യക്തമായി ചേർക്കുക.
  rationale: ഈ വാക്യം കർത്താവിന്റെ പേര് ആവർത്തിക്കുന്നില്ല. ‘അവൻ’ എന്നു നൽകുന്നത് മൂലപാഠത്തിന്റെ പരാമർശരീതിയും സന്ദർഭം നിർണ്ണയിക്കേണ്ട ചെറിയ അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി സ്വീകരിച്ചു. ‘സമാഗമകൂടാരം’ പോലുള്ള പരിചിതമായ വിശുദ്ധാലയപദം നിലനിർത്തിയപ്പോൾ, അപരിചിതമായ എബ്രായ പുരോഹിതപ്രയോഗം അർഥം ചുരുക്കാതെ അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
