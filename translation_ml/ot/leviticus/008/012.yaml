id: LEV.8.12
reference: Leviticus 8:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּצֹק֙ מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֔ה עַ֖ל רֹ֣אשׁ אַהֲרֹ֑ן וַ/יִּמְשַׁ֥ח אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/012.yaml
  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: ml
  text: പിന്നെ അവൻ അഭിഷേകതൈലത്തിൽനിന്ന് കുറച്ച് അഹരോന്റെ തലയിൽ ഒഴിച്ച്, അവനെ വിശുദ്ധീകരിക്കാനായി അഭിഷേകം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: ഒഴിച്ചു
  rationale: יצק ഒരു ദ്രാവകം ഒഴിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലത്തിൽനിന്ന് കുറച്ച്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ അംശസൂചക അർഥം ‘കുറച്ച്’ എന്നു വ്യക്തമാക്കുന്നു; שֶׁמֶן הַמִּשְׁחָה എന്നത് സ്വാഭാവികമായി ‘അഭിഷേകതൈലം’ എന്നാണ്.
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: അഹരോന്റെ തലയിൽ
  rationale: സ്ഥലസൂചകമായ എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַיִּמְשַׁח
  choice: അഭിഷേകം ചെയ്തു
  rationale: പുരോഹിതപ്രതിഷ്ഠയുടെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ പ്രാധാന്യം നിലനിർത്തുന്ന സ്ഥിരപ്രയോഗം.
- source_word: לְקַדְּשׁוֹ
  choice: അവനെ വിശുദ്ധശുശ്രൂഷയ്ക്കായി വേർതിരിക്കാൻ
  rationale: ഈ പുരോഹിതപ്രതിഷ്ഠാ സന്ദർഭത്തിൽ קדשׁ എന്നത് വിശുദ്ധമായ സേവനത്തിനായി ഒരാളെ വേർതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് അർഥം വ്യക്തമായി ലഭിക്കുന്ന രൂപമാണിത്.
- source_word: וַ
  choice: പിന്നെ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘പിന്നെ’ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതപ്രതിഷ്ഠാ സന്ദർഭത്തിലെ קדשׁ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശുദ്ധശുശ്രൂഷയ്ക്കായി വേർതിരിക്കാൻ
  alternative: വിശുദ്ധീകരിക്കാൻ; പ്രതിഷ്ഠിക്കാൻ
  rationale: അഹരോനെ പുരോഹിതശുശ്രൂഷയ്ക്കായി ആചാരപരമായി വേർതിരിക്കുന്നതാണ് സന്ദർഭം. തിരുവെഴുത്തിലെ ‘വിശുദ്ധം/വിശുദ്ധീകരണം’ എന്ന ആശയബന്ധം നിലനിർത്തിക്കൊണ്ട്, പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക സഭാപരമായ അർഥങ്ങൾ അടിച്ചേൽപ്പിക്കാതെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആചാരപരമായ ‘അഭിഷേകം’ നിലനിർത്തുകയും ‘വിശുദ്ധശുശ്രൂഷയ്ക്കായി വേർതിരിക്കുക’ എന്നതിലൂടെ പുരോഹിതപ്രതിഷ്ഠയുടെ സന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്തു.
