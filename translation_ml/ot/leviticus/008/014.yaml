reference: Leviticus 8:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגֵּ֕שׁ אֵ֖ת פַּ֣ר הַֽ/חַטָּ֑את וַ/יִּסְמֹ֨ךְ אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת יְדֵי/הֶ֔ם עַל רֹ֖אשׁ פַּ֥ר הַֽ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: ml
  text: പിന്നെ അവൻ പാപയാഗത്തിനുള്ള കാളയെ അടുത്തേക്കു കൊണ്ടുവന്നു[a]. അഹരോനും അവന്റെ പുത്രന്മാരും പാപയാഗത്തിനുള്ള കാളയുടെ തലയിൽ തങ്ങളുടെ കൈകൾ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹാജരാക്കി’ അല്ലെങ്കിൽ ‘മുന്നോട്ടു കൊണ്ടുവന്നു.’
    reason: נגשׁ എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപത്തിന് ഈ ആചാരസന്ദർഭത്തിൽ ‘അടുത്തേക്കു കൊണ്ടുവരുക,’ ‘ഹാജരാക്കുക/സമർപ്പിക്കുക,’ ‘മുന്നോട്ടു കൊണ്ടുവരുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: അടുത്തുകൊണ്ടുവന്നു
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള נגשׁ ഇവിടെ യാഗമൃഗത്തെ ആചാരപരമായി അടുത്തേക്ക് കൊണ്ടുവരുകയോ സമർപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അടുത്തുകൊണ്ടുവന്നു’ മൂലപദത്തിന്റെ സമീപനഭാവം നിലനിർത്തുന്നു; മറ്റു സാധ്യമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: פַּר
  choice: കാള
  rationale: യാഗസന്ദർഭത്തിൽ פַּר ഒരു ആൺകാളയെ സൂചിപ്പിക്കുന്നു. ഈ വാക്യം മാത്രം അതിനെ ‘ഇളംകാള’ എന്നു വ്യക്തമാക്കേണ്ടതില്ല.
- source_word: הַחַטָּאת
  choice: പാപയാഗം
  rationale: חַטָּאת എന്നതിന് ‘പാപം’ എന്നും ‘പാപയാഗം’ എന്നും അർഥമാകാം; ഇവിടെ യാഗമൃഗത്തെക്കുറിച്ചായതിനാൽ യാഗാർഥമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וַיִּסְמֹךְ
  choice: വെച്ചു
  rationale: യാഗാചാരത്തിൽ סמך മൃഗത്തിന്റെ തലയിൽ കൈ വയ്ക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സമ്മർദത്തിന്റെ അളവ് അനാവശ്യമായി നിർണയിക്കാതെ ‘വെച്ചു’ പ്രവൃത്തിയെ സ്വാഭാവികമായി വിവരിക്കുന്നു.
- source_word: יְדֵיהֶם
  choice: തങ്ങളുടെ കൈകൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനമായ ‘കൈകൾ’ നിലനിർത്തുകയും അഹരോനും പുത്രന്മാരും ചെയ്ത കൂട്ടായ ആചാരപ്രവൃത്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַל רֹאשׁ
  choice: തലയിൽ
  rationale: ആചാരപ്രവൃത്തിയുടെ സ്ഥാനം വ്യക്തമാക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: യാഗമൃഗത്തിന്മേൽ കൈവയ്ക്കുന്നതിന്റെ അർഥം
  choice: പ്രവൃത്തിയെ മാത്രം വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി; അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനം വിശദീകരിച്ചില്ല.
  alternative: ഈ പ്രവൃത്തി യാഗവുമായി താദാത്മ്യപ്പെടൽ, കുറ്റമോ ബാധ്യതയോ കൈമാറൽ, അല്ലെങ്കിൽ മൃഗത്തെ യാഗത്തിനായി നിയോഗിക്കൽ എന്നിവയിൽ ഒന്നിനെ സൂചിപ്പിക്കുന്നു എന്നു പരിഭാഷയിൽ വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം ആചാരപ്രവൃത്തിയെ വിവരിക്കുന്നുവെങ്കിലും അതിന്റെ ദൈവശാസ്ത്രപരമായ സംവിധാനം വിശദീകരിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ യാഗാചാരത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ഭാഷ ഉപയോഗിച്ചു. മുൻസന്ദർഭത്തിലെ മോശെയെ മൂലപാഠംപോലെ ‘അവൻ’ എന്നു തന്നെയാണ് സൂചിപ്പിച്ചത്; പേര് വ്യാഖ്യാനമായി ചേർത്തില്ല.
