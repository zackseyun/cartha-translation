source:
  edition: WLC
  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: ml
  text: നിങ്ങൾ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനവാതിൽക്കൽ ഏഴു ദിവസം രാവും പകലും കഴിയുകയും യഹോവയുടെ ചുമതല പാലിക്കുകയും വേണം; അങ്ങനെ നിങ്ങൾ മരിക്കാതിരിക്കും[a]. എനിക്കു ഇപ്രകാരം കൽപന ലഭിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ മരിക്കുകയുമില്ല”; അല്ലെങ്കിൽ, “നിങ്ങൾ മരിക്കാതിരിക്കേണ്ടതിന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֶתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിൽ
  rationale: פֶתַח എന്നത് പ്രവേശനം/തുറവ് എന്നർഥം നൽകുന്നു; സ്ഥലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി ‘പ്രവേശനത്തിൽ’ എന്നു വരുന്നു. אֹהֶל מוֹעֵד എന്ന വിശുദ്ധമന്ദിരനാമത്തിന് ‘സമാഗമകൂടാരം’ വ്യക്തവും പ്രചാരമുള്ളതുമായ രൂപമാണ്.
- source_word: תֵּשְׁבוּ
  choice: താമസിച്ച്
  rationale: ישב എന്നതിന് ഇരിക്കുക, പാർക്കുക, തുടരുക എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ഏഴു ദിവസം അവിടെത്തന്നെ തുടരണമെന്ന ആചാരപരമായ നിർദേശം ‘താമസിച്ച്’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം രാവും പകലും
  rationale: ‘രാവും പകലും’ തുടർച്ചയായ കാലയളവിനെ സൂചിപ്പിക്കുന്ന ദ്വന്ദപ്രയോഗമാണ്; ഏഴു ദിവസമെന്ന ദൈർഘ്യവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּ/שְׁמַרְתֶּם אֶת מִשְׁמֶרֶת יְהוָה
  choice: യഹോവയുടെ ചുമതല പാലിക്കണം
  rationale: שמר + משמרת നിർദേശിക്കപ്പെട്ട കാവൽ, കടമ, ചുമതല എന്നിവ പാലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ചുമതല പാലിക്കുക’ ആചാരപരമായ ബാധ്യതയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ, മലയാളത്തിൽ ദീർഘകാലമായി പ്രചാരത്തിലുള്ള ‘യഹോവ’ എന്ന നാമരൂപത്തിൽ നൽകുന്നു.
- source_word: וְ/לֹא תָמֻתוּ
  choice: അങ്ങനെ നിങ്ങൾ മരിക്കാതിരിക്കും
  rationale: മുൻകല്പന അനുസരിക്കുന്നതിലൂടെ ഒഴിവാകുന്ന ഫലം/അപകടം എന്ന ബന്ധം ഈ രൂപം വ്യക്തമാക്കുന്നു; എന്നാൽ സമന്വയവാക്യമായോ മുന്നറിയിപ്പായോ വായിക്കാവുന്ന ഹീബ്രു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: എനിക്ക് ലഭിച്ച കല്പന അങ്ങനെയാണ്
  rationale: നിഷ്ക്രിയ ക്രിയാരൂപം മോശയ്ക്ക് കല്പന ലഭിച്ചതാണെന്ന് സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക രൂപം ഉപയോഗിക്കുമ്പോഴും കല്പനയുടെ ദൈവിക ഉറവിടം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ഒരു പദവിയായി മാറ്റാതെ മലയാളവായനയിൽ പരിചിതമായ നാമരൂപം നിലനിർത്തി.
- issue: മരണത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിന്റെ വ്യാകരണബലം
  choice: 'അനുസരണത്തിലൂടെ മരണം ഒഴിവാകുന്ന ഫലം: ‘അങ്ങനെ നിങ്ങൾ മരിക്കാതിരിക്കും’'
  alternative: ‘നിങ്ങൾ മരിക്കുകയുമില്ല’; ‘അല്ലെങ്കിൽ നിങ്ങൾ മരിക്കും’
  rationale: וְלֹא תָמֻתוּ മുൻകല്പനയോട് ചേർന്ന് ഒഴിവാക്കപ്പെടുന്ന ഫലം സൂചിപ്പിക്കാം. ഹീബ്രുവിലെ ഏകോപനവും മുന്നറിയിപ്പിന്റെ സാധ്യതയും അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ആചാരപരമായ ഭാവം നിലനിർത്തിയെങ്കിലും അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി.
