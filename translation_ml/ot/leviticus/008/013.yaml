  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: ml
  text: പിന്നെ മോശെ അഹരോന്റെ പുത്രന്മാരെ അടുത്തുകൊണ്ടുവന്ന്[a] അവരെ അങ്കികൾ ധരിപ്പിച്ചു; അവരുടെ അരയിൽ അരപ്പട്ടകൾ കെട്ടി[b]; അവരുടെ തലയിൽ തൊപ്പികൾ കെട്ടിവെച്ചു, യാഹ്‌വേ[c] മോശെയോടു കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അഹരോന്റെ പുത്രന്മാരെ ഹാജരാക്കി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് ആചാരപരമായ സാഹചര്യത്തിൽ ‘അടുത്തുകൊണ്ടുവരുക’ എന്നും ‘ഹാജരാക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ‘അരപ്പട്ട’ ഏകവചനത്തിലാണ്; ഓരോ പുത്രനും ഓരോ അരപ്പട്ട എന്ന വിതരണാർഥത്തിലാണ് ഇത്.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രു ദൈവനാമം YHWH ആണ്; പരമ്പരാഗതമായി ഇത് ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: അടുത്തുകൊണ്ടുവന്ന്
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അടുത്തുകൊണ്ടുവരുക’ എന്നും ആചാരപരമായ സാഹചര്യത്തിൽ ‘സന്നിധിയിൽ ഹാജരാക്കുക’ എന്നും അർഥമാക്കാം. മുഖ്യപാഠം അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ആചാരപരമായ മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രു സമാസഘടനയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: അവരെ അങ്കികൾ ധരിപ്പിച്ചു
  rationale: לבשׁ എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം മറ്റൊരാളെ വസ്ത്രം ധരിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. כֻּתֳּנֹת നീളമുള്ള അടിസ്ഥാനവസ്ത്രങ്ങളായതിനാൽ ‘അങ്കികൾ’ അനുയോജ്യം.
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: അവരുടെ അരയിൽ അരപ്പട്ടകൾ കെട്ടി
  rationale: חגר അരയ്ക്കുചുറ്റി കെട്ടുന്നതും אַבְנֵט പുരോഹിതവസ്ത്രത്തിലെ തുണിപ്പട്ടയും സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിൽ നാമം ഏകവചനത്തിലാണെങ്കിലും ബഹുവചനത്തിലുള്ള വ്യക്തികളിൽ ഓരോരുത്തർക്കും ഓരോ പട്ട എന്ന വിതരണാർഥം മലയാള ബഹുവചനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: അവരുടെ തലയിൽ തൊപ്പികൾ കെട്ടിവെച്ചു
  rationale: חבשׁ വെറുതെ ഇടുന്നതിലുപരി കെട്ടിവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. מִגְבָּעוֹת സാധാരണ പുരോഹിതരുടെ പ്രത്യേക ശിരോവസ്ത്രങ്ങളാണ്; മലയാളത്തിൽ വ്യക്തവും ലളിതവുമായ ‘തൊപ്പികൾ’ തെരഞ്ഞെടുത്തു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹോവ മോശെയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: ആജ്ഞയോടുള്ള കൃത്യമായ അനുസരണം അടയാളപ്പെടുത്തുന്ന ആവർത്തിത സൂത്രവാക്യം ‘പോലെതന്നെ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ പേരായി നിലനിർത്തി. പരമ്പരാഗത സ്ഥാനപ്പേരിനെ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: וַיַּקְרֵב എന്നതിന്റെ ആചാരപരമായ ഭാവം
  choice: അടുത്തുകൊണ്ടുവന്നു
  alternative: ഹാജരാക്കി / സമർപ്പിച്ചു
  rationale: ‘അടുത്തുകൊണ്ടുവരുക’ എന്ന അടിസ്ഥാനാർഥവും പുരോഹിതപ്രതിഷ്ഠയുടെ ആചാരസന്ദർഭവും ഒരുമിച്ച് തുറന്നുവെക്കുന്നു; ‘സമർപ്പിച്ചു’ എന്നു മാത്രം പറഞ്ഞ് കർമ്മത്തിന്റെ സ്വഭാവം അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരോഹിതവസ്ത്രങ്ങളുടെ സവിശേഷത വ്യക്തമാക്കാൻ ‘അങ്കികൾ’, ‘അരപ്പട്ടകൾ’, ‘തൊപ്പികൾ’ എന്നീ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. അവസാനത്തെ അനുസരണസൂത്രം മലയാളത്തിൽ പൂർണ്ണവാക്യമാകാൻ ‘അവൻ ചെയ്തു’ എന്നു സ്വാഭാവികമായി പൂരിപ്പിച്ചിരിക്കുന്നു; ഇത് ഹീബ്രു വാക്യത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നതേയുള്ളൂ.
