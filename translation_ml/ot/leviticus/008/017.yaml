id: LEV.8.17
reference: Leviticus 8:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַ/פָּ֤ר וְ/אֶת עֹר/וֹ֙ וְ/אֶת בְּשָׂר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: ml
  text: എന്നാൽ കാളയെയും അതിന്റെ തോലും[a] മാംസവും ചാണകവും[b] പാളയത്തിനു പുറത്തുവെച്ച് തീയിൽ ചുട്ടുകളഞ്ഞു; യഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചർമം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മലവിസർജ്യം’; എബ്രായപദം പൊതുവായ മാലിന്യമല്ല, പ്രത്യേകിച്ച് വിസർജ്യമാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּר
  choice: കാള
  rationale: פַּר എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘കാള’ അഥവാ ‘ഇളംകാള’ എന്നാണ്. ഈ വാക്യത്തിൽ ‘പാപയാഗത്തിനുള്ള കാള’ എന്നു പ്രത്യേകം പറയാത്തതിനാൽ സന്ദർഭവിവരം മുഖ്യപാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- source_word: עֹרוֹ
  choice: അതിന്റെ തോൽ
  rationale: עוֹר മൃഗത്തിന്റെ തൊലി/തോൽ സൂചിപ്പിക്കുന്നു. യാഗസന്ദർഭത്തിൽ ‘തോൽ’ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: בְּשָׂרוֹ
  choice: മാംസം
  rationale: בָּשָׂר എന്നത് ഇവിടെ കാളയുടെ മാംസത്തെ സൂചിപ്പിക്കുന്നു. ‘മാംസം’ ആധുനിക മലയാളത്തിൽ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: פִּרְשׁוֹ
  choice: ചാണകം
  rationale: פֶּרֶשׁ പൊതുവായ മാലിന്യമല്ല, പ്രത്യേകിച്ച് മലവിസർജ്യമാണ് സൂചിപ്പിക്കുന്നത്. ‘ചാണകം’ മൃഗത്തിന്റെ വിസർജ്യത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: שָׂרַף בָּאֵשׁ
  choice: തീയിൽ ചുട്ടുകളഞ്ഞു
  rationale: ശരף എന്ന ക്രിയയും בָאֵשׁ എന്ന പ്രയോഗവും ചേർന്ന് തീകൊണ്ടു ദഹിപ്പിക്കുന്ന പ്രവൃത്തി വ്യക്തമാക്കുന്നു. ‘തീയിൽ ചുട്ടുകളഞ്ഞു’ എന്നത് ഹീബ്രു ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തുവെച്ച്
  rationale: മരുഭൂമിയിലെ ഇസ്രായേൽ സമൂഹത്തിന്റെ പാളയത്തിനു പുറത്തുള്ള സ്ഥലം എന്ന അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: കല്പനയോടുള്ള കൃത്യമായ അനുരൂപത സൂചിപ്പിക്കുന്ന כַּאֲשֶׁר എന്നതിന്റെ ബലം ‘പോലെതന്നെ’ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ധ്വന്യന്തരണമായ ‘യഹ്‌വെ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: കാളയെയും അതിന്റെ തോലും മാംസവും ചാണകവും
  rationale: ആവർത്തിക്കുന്ന സംയോജകങ്ങളും നേരിട്ടുള്ള കർമചിഹ്നങ്ങളും സൃഷ്ടിക്കുന്ന സമാഹാരപ്പട്ടിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു ബിരുദമാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്ന് ധ്വന്യന്തരണം ചെയ്യുന്നത് മൂലരൂപത്തോടു കൂടുതൽ ചേർന്നുനിൽക്കുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ യാഗവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പുചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട മലയാളപദങ്ങളോടു ചേർത്തു: [a] ‘തോൽ’ എന്നതിനും [b] ‘ചാണകം’ എന്നതിനും.'
