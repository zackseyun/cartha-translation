source:
  edition: WLC
  text: וּ/מִ/סַּ֨ל הַ/מַּצּ֜וֹת אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד וַ/יָּ֨שֶׂם֙ עַל הַ֣/חֲלָבִ֔ים וְ/עַ֖ל שׁ֥וֹק הַ/יָּמִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: ml
  text: യഹ്‌വേയുടെ സന്നിധിയിലുണ്ടായിരുന്ന പുളിപ്പില്ലാത്ത അപ്പങ്ങളുടെ കൊട്ടയിൽനിന്ന് അവൻ പുളിപ്പില്ലാത്ത ഒരു അപ്പവും, എണ്ണയോടുകൂടിയ ഒരു അപ്പവും[a], ഒരു നേർത്ത അപ്പവും എടുത്ത്, അവയെ കൊഴുപ്പുള്ള ഭാഗങ്ങളുടെയും വലത്തെ തുടയുടെയും മുകളിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എണ്ണ ചേർത്ത ഒരു അപ്പം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം എണ്ണ ഉപയോഗിച്ച് തയ്യാറാക്കിയ അപ്പത്തെ സൂചിപ്പിക്കാം; എന്നാൽ എണ്ണ എങ്ങനെ ഉപയോഗിച്ചുവെന്ന് കൃത്യമായി വ്യക്തമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסַּל הַמַּצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പങ്ങളുടെ കൊട്ടയിൽനിന്ന്
  rationale: מִן ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; מַצּוֹת ഇവിടെ കൊട്ടയിലുള്ള വിവിധ പുളിപ്പില്ലാത്ത അപ്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികവും ആചാരപരമായ ദൃശ്യവിവരം നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ദൈവസന്നിധിയിൽ സമർപ്പിച്ചുവെച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; യഹ്‌വേ എന്ന രൂപം ദൈവനാമത്തെ പേരായിത്തന്നെ നിലനിർത്തുന്നു.
- source_word: חַלַּת מַצָּה אַחַת
  choice: പുളിപ്പില്ലാത്ത ഒരു അപ്പം
  rationale: חַלָּה ഒരു അപ്പം അല്ലെങ്കിൽ അപ്പക്കഷണം പോലുള്ള വഴിപാടുവസ്തുവാണ്; ലളിതമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പം’ വ്യക്തവും യോജിച്ചതുമാണ്.
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: എണ്ണയോടുകൂടിയ ഒരു അപ്പം
  rationale: എബ്രായപ്രയോഗം അപ്പവും എണ്ണയും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നുവെങ്കിലും എണ്ണ കലർത്തിയതോ പുരട്ടിയതോ എന്ന് കൃത്യമായി പറയുന്നില്ല. ‘എണ്ണയോടുകൂടിയ’ ആ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: רָקִיק אֶחָד
  choice: ഒരു നേർത്ത അപ്പം
  rationale: רָקִיק നേർത്ത പരന്ന അപ്പമാണ്. ‘നേർത്ത അപ്പം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും യാഗസന്ദർഭത്തിന് അനുയോജ്യവുമാണ്.
- source_word: הַחֲלָבִים
  choice: കൊഴുപ്പുള്ള ഭാഗങ്ങൾ
  rationale: യാഗത്തിൽ വേർതിരിച്ചുവെക്കുന്ന നിർദിഷ്ട കൊഴുപ്പുഭാഗങ്ങളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്; പൊതുവായ കൊഴുപ്പ് എന്നതിനേക്കാൾ ഈ വിവർത്തനം കൃത്യമാണ്.
- source_word: שׁוֹק הַיָּמִין
  choice: വലത്തെ തുട
  rationale: שׁוֹק യാഗമൃഗത്തിന്റെ കാൽ അല്ലെങ്കിൽ തുടഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ ‘വലത്തെ തുട’ സ്ഥാപിതവും കൃത്യവുമായ വിവർത്തനമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പൊതുവായ സ്ഥാനനാമമാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. യാഗാചാരത്തിന്റെ വസ്തുനിഷ്ഠമായ വിശദാംശങ്ങൾ നിലനിർത്തിക്കൊണ്ട്, എണ്ണ ഉപയോഗിച്ച തയ്യാറാക്കൽരീതിയെക്കുറിച്ചുള്ള മൂലപാഠത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
