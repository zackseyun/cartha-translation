id: LEV.8.1
reference: Leviticus 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: അപ്പോൾ യാഹ്‌വേ മോശെയോടു പറഞ്ഞു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘YHWH’ എന്ന ദൈവനാമം; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു. ‘യഹോവ’ എന്നും ലിപ്യന്തരപ്പെടുത്താം.
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പരമ്പരാഗത പരിഭാഷയും മറ്റൊരു ലിപ്യന്തരണസാധ്യതയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു നൽകി. ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികവും മാന്യവുമായ ‘അരുളിച്ചെയ്തു’ തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ രൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന ദാതൃപ്രയോഗം.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തു:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രപ്രയോഗത്തിന്റെ പ്രവർത്തനം ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിച്ചു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരം നേരിട്ട് വരുന്നതിനാൽ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് പകരംവെച്ചില്ല. കൃത്യമായ പുരാതന ഉച്ചാരണം ഉറപ്പില്ലാത്തതിനാൽ മലയാള വായനക്കാർക്കു സുപരിചിതമായ ലിപ്യന്തരണരൂപം ഉപയോഗിക്കുകയും മറ്റു രൂപങ്ങൾ അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. തുടർന്നുള്ള നേരിട്ടുള്ള വചനത്തെ സൂചിപ്പിക്കാൻ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
