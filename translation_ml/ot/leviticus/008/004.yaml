reference: Leviticus 8:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: ml
  text: യാഹ്‌വേ മോശെയോടു കൽപ്പിച്ചതുപോലെ മോശെ ചെയ്തു; സമൂഹം സമാഗമകൂടാരത്തിന്റെ പ്രവേശനവാതിൽക്കൽ ഒരുമിച്ചുകൂടി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സമൂഹം ഒരുമിച്ചുകൂടി’ അല്ലെങ്കിൽ ‘സമൂഹം കൂട്ടിച്ചേർക്കപ്പെട്ടു.’ എബ്രായ ക്രിയയെ സജീവ അകർമകമായോ കർമണിരൂപത്തിലോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയ ഇവിടെ ഒരു കല്പന അനുസരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ ‘ചെയ്തു’ യോജിക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: ദൈവകല്പനയോടുള്ള കൃത്യമായ അനുരൂപത വ്യക്തമാക്കാൻ ‘പോലെതന്നെ’ ഉപയോഗിച്ചു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: צוה അധികാരപൂർവമായ ആജ്ഞയെ സൂചിപ്പിക്കുന്നതിനാൽ മൃദുവായ ‘നിർദേശിച്ചു’ എന്നതിനു പകരം ‘കല്പിച്ചു’ സ്വീകരിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֹתוֹ
  choice: മോശയോടു
  rationale: എബ്രായത്തിൽ നേരിട്ടുള്ള കർമപ്രത്യയം ‘അവനെ’ എന്നാണ്; എന്നാൽ മലയാളത്തിൽ ‘കല്പിക്കുക’ എന്ന ക്രിയയോടൊപ്പം കല്പന സ്വീകരിക്കുന്ന വ്യക്തിയെ ‘-ഓട്’ രൂപത്തിൽ പറയുന്നതാണ് സ്വാഭാവികം. പരാമർശം മോശയിലേക്കാണെന്നത് വ്യക്തമായി ആവർത്തിച്ചു.
- source_word: וַתִּקָּהֵל
  choice: ഒരുമിച്ചുകൂടി
  rationale: קהל എന്ന ക്രിയയുടെ നിഫാൽ രൂപം സമൂഹം ഒന്നിച്ചുകൂടിയ സംഭവത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സജീവ അകർമകമായ ‘ഒരുമിച്ചുകൂടി’ സ്വാഭാവികമാണ്; കർമണി വായനയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: הָעֵדָה
  choice: സമൂഹം
  rationale: עֵדָה ഇവിടെ യിസ്രായേലിന്റെ കൂട്ടായ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സഭാസ്ഥാപനപരമായ അധികനിറം കുറഞ്ഞതുമായ പദമാണ് ‘സമൂഹം’.
- source_word: אֶל פֶּתַח
  choice: പ്രവേശനത്തിങ്കൽ
  rationale: אֶל ദിശയെയോ ലക്ഷ്യസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; കൂടിവരവിന്റെ ഫലസ്ഥാനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘പ്രവേശനത്തിങ്കൽ’ എന്നു നൽകി.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: നിയമാവലിയിലെ ഈ സ്ഥിരസംജ്ഞയിൽ ഭൗതിക കൂടാരവും കൂടിവരവിന്റെ പ്രവർത്തനവും സംക്ഷിപ്തമായി നിലനിർത്തുന്ന പരിചിതമായ മലയാളരൂപമാണിത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു ബിരുദംകൊണ്ട് മാറ്റാതെ സംരക്ഷിച്ചു. ആധുനിക മലയാള ബൈബിൾ വായനയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ലിപ്യന്തരണമായ ‘യഹോവ’ സ്വീകരിച്ചു; ശാസ്ത്രീയ പുനർനിർമാണമായ ‘യാഹ്‌വേ’ മറ്റൊരു സാധുവായ രൂപമാണ്.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘കല്പിച്ചതുപോലെതന്നെ’ അനുസരണത്തിന്റെ കൃത്യത നിലനിർത്തുന്നു. ‘സമൂഹം,’ ‘പ്രവേശനത്തിങ്കൽ,’ ‘സമാഗമകൂടാരം’ എന്നീ പദങ്ങൾ പഞ്ചഗ്രന്ഥസന്ദർഭത്തിന് യോജിച്ചും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിലും തെരഞ്ഞെടുത്തു.
