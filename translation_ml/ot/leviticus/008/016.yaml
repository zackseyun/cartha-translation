source:
  edition: WLC
  text: וַ/יִּקַּ֗ח אֶֽת כָּל הַ/חֵלֶב֮ אֲשֶׁ֣ר עַל הַ/קֶּרֶב֒ וְ/אֵת֙ יֹתֶ֣רֶת הַ/כָּבֵ֔ד וְ/אֶת שְׁתֵּ֥י הַ/כְּלָיֹ֖ת וְ/אֶֽת חֶלְבְּ/הֶ֑ן וַ/יַּקְטֵ֥ר מֹשֶׁ֖ה הַ/מִּזְבֵּֽחָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: ml
  text: അവൻ ആന്തരാവയവങ്ങളുടെ മേലുള്ള കൊഴുപ്പ് മുഴുവനും, കരളിന്റെ അനുബന്ധഭാഗവും[a], രണ്ടു വൃക്കകളും അവയുടെ കൊഴുപ്പും എടുത്തു; മോശ അവയെ യാഗപീഠത്തിന്മേൽ കത്തിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കരളിന്റെ ലോബ്.” യാഗത്തിനായി നീക്കം ചെയ്ത കരളിന്റെ ഒരു പ്രത്യേക ഭാഗത്തെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായക്രിയയ്ക്ക് യാഗസന്ദർഭത്തിൽ “കത്തിച്ചു” എന്നോ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, “പുകയാക്കി” അല്ലെങ്കിൽ “പുകയായി ഉയർത്തി” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: അവൻ ... എടുത്തു
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനഭൂതകാല അർഥം നൽകുന്നു; തുടക്കത്തിലെ വാവ് മലയാളത്തിലെ സ്വാഭാവികമായ വാക്യക്രമത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: ആന്തരാവയവങ്ങളുടെ മേലുള്ള കൊഴുപ്പ് മുഴുവനും
  rationale: കֶרֶב ഇവിടെ മൃഗത്തിന്റെ ഉള്ളവയവങ്ങളെ സൂചിപ്പിക്കുന്നു; യാഗസന്ദർഭത്തിലെ ശരീരഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി മനസ്സിലാകുന്ന വിധത്തിലാണ് പരിഭാഷ.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: കരളിന്റെ അനുബന്ധഭാഗം
  rationale: യാഗത്തിനായി നീക്കം ചെയ്ത കരളിന്റെ ഒരു പ്രത്യേക ഭാഗത്തെയാണ് ഈ എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. കൃത്യമായ ശരീരഘടനയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം കണക്കിലെടുത്ത് അതിനെ നിർബന്ധമായി ‘ലോബ്’ എന്നു തിരിച്ചറിയാതെ വിശാലമായ പദം ഉപയോഗിച്ചു.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: രണ്ടു വൃക്കകൾ
  rationale: ദ്വിവചനത്തിലുള്ള ശരീരാവയവപരാമർശത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: חֶלְבְּהֶן
  choice: അവയുടെ കൊഴുപ്പ്
  rationale: സ്ത്രീലിംഗ ബഹുവചന പ്രത്യയം മുമ്പുള്ള വൃക്കകളിലേക്കാണ് മടങ്ങിച്ചൂണ്ടുന്നത്; എബ്രായ വാക്യഘടന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיַּקְטֵר
  choice: പുകയാക്കി അർപ്പിച്ചു
  rationale: קטר എന്ന ക്രിയ യാഗസന്ദർഭത്തിൽ വെറുതെ കത്തിക്കുക എന്നതിലുപരി യാഗപീഠത്തിൽ കത്തിച്ച് പുകയായി അർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശ/സ്ഥാനം സൂചിപ്പിക്കുന്ന രൂപം കത്തിക്കൽ നടന്ന ഇടമായി യാഗപീഠത്തെ അടയാളപ്പെടുത്തുന്നു.
