translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യാഗസാങ്കേതികത വ്യക്തമാക്കാൻ ‘പുകയാക്കി അർപ്പിച്ചു’ എന്നു നൽകിയിരിക്കുന്നു; എന്നാൽ മൂലത്തിലെ ശരീരഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
