source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הֶ֣/חָזֶ֔ה וַ/יְנִיפֵ֥/הוּ תְנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה מֵ/אֵ֣יל הַ/מִּלֻּאִ֗ים לְ/מֹשֶׁ֤ה הָיָה֙ לְ/מָנָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: ml
  text: പിന്നെ മോശെ നെഞ്ചുഭാഗം എടുത്ത് യഹോവയുടെ സന്നിധിയിൽ ആടുന്ന വഴിപാടായി അതിനെ ആട്ടിക്കാണിച്ചു. പ്രതിഷ്ഠയുടെ ആട്ടുകൊറ്റനിൽനിന്നുള്ള അത് മോശെയുടെ ഓഹരിയായിരുന്നു; യഹോവ മോശെയോടു കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: പിന്നെ മോശെ ... എടുത്ത്
  rationale: Wayyiqtol ആഖ്യാനക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘പിന്നെ’ സ്വാഭാവികമായ അനുക്രമം വ്യക്തമാക്കുന്നു.
- source_word: הֶחָזֶה
  choice: നെഞ്ചിൻഭാഗം
  rationale: യാഗസന്ദർഭത്തിൽ חָזֶה മൃഗത്തിന്റെ പ്രത്യേക നെഞ്ചുഭാഗത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാരന് ‘നെഞ്ചിൻഭാഗം’ വ്യക്തമാണ്.
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: നീരാജനയാഗമായി നീരാജനം ചെയ്തു
  rationale: נוּף എന്ന ക്രിയയുടെയും תְּנוּפָה എന്ന സമാനമൂല നാമത്തിന്റെയും ആവർത്തിത ഊന്നൽ നിലനിർത്തുകയും യാഗസാങ്കേതിക പ്രയോഗം പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധിയിൽ ആചാരപരമായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: പൗരോഹിത്യാഭിഷേകത്തിനുള്ള ആട്ടുകൊറ്റനിൽനിന്ന്
  rationale: אֵיל ‘ആട്ടുകൊറ്റൻ’ എന്നും מִלֻּאִים ഈ സന്ദർഭത്തിൽ പുരോഹിതസ്ഥാനത്തേക്കുള്ള പ്രതിഷ്ഠാ/അഭിഷേകച്ചടങ്ങ് എന്നും സൂചിപ്പിക്കുന്നു.
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: അത് മോശെയുടെ ഓഹരിയായിരുന്നു
  rationale: מָנָה നിശ്ചയിക്കപ്പെട്ട പങ്ക് അഥവാ ഓഹരി എന്ന അർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹോവ മോശെയോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: മുമ്പുണ്ടായ ദൈവകല്പനയോടുള്ള കൃത്യമായ അനുസരണം സൂചിപ്പിക്കുന്ന സൂത്രവാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഹീബ്രൂ പാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- issue: മִלֻּאִים എന്ന പൗരോഹിത്യസ്ഥാപന പദം
  choice: പൗരോഹിത്യാഭിഷേകം
  alternative: പ്രതിഷ്ഠ
  rationale: ലേവ്യപുസ്തകം 8-ലെ പുരോഹിതസ്ഥാനാരോഹണസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘പ്രതിഷ്ഠ’യും സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യാഗസാങ്കേതിക പദമായ ‘നീരാജനം’ സന്ദർഭത്തിന്റെ പ്രത്യേകത കാത്തുസൂക്ഷിക്കാൻ ഉപയോഗിച്ചു; ദൈവനാമം ‘യഹോവ’യായി നിലനിർത്തി.
