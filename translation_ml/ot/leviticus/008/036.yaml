  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: ml
  text: അഹരോനും അവന്റെ പുത്രന്മാരും യാഹ്‌വെ മോശയിലൂടെ കൽപ്പിച്ച എല്ലാ കാര്യങ്ങളും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “മോശയുടെ കൈയാൽ”; “മോശയിലൂടെ” അല്ലെങ്കിൽ “മോശ മുഖാന്തരം” എന്നർഥമുള്ള പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: ആജ്ഞകളോടുള്ള അനുസരണത്തെ സംഗ്രഹിക്കുന്ന സാധാരണ ആഖ്യാനക്രിയയാണ്; മലയാളത്തിൽ സ്വാഭാവികവും എബ്രായഘടനയോട് അടുത്തതുമാണ്.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: וּבָנָיו
  choice: അവന്റെ പുത്രന്മാരും
  rationale: പുരോഹിതസന്ദർഭത്തിൽ אַהֲרֹן എന്ന പുരുഷ ഏകവചന മുൻപദത്തോട് ചേർന്ന בנים പുരുഷസന്തതിയെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: സകല കാര്യങ്ങളും
  rationale: דברים എന്നതിന് വാക്കുകൾ, കാര്യങ്ങൾ, സംഗതികൾ എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും, ഇവിടെ അനുഷ്ഠിക്കപ്പെട്ട നിർദേശങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്; ‘സകല കാര്യങ്ങളും’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ച
  rationale: മുൻപ് നൽകിയ ദൈവിക ആജ്ഞയെ ബന്ധവാക്യത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ יהוה-യെ ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശയിലൂടെ
  rationale: അക്ഷരാർഥമായ ‘മോശയുടെ കൈയാൽ’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ ഏജൻസിയെയോ മധ്യസ്ഥതയെയോ സൂചിപ്പിക്കുന്നു; ‘മോശയിലൂടെ’ എന്നത് അത് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ / കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. പദവിയായ ‘കർത്താവ്’ എന്ന് മാറ്റാതെ നാമം നിലനിർത്തുകയും, സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ രൂപം സ്വീകരിക്കുകയും ചെയ്തു.
- issue: בְּיַד מֹשֶׁה എന്നതിലെ മധ്യസ്ഥത
  choice: മോശയിലൂടെ
  alternative: മോശയുടെ കൈയാൽ / മോശ മുഖാന്തരം
  rationale: മോശ ദൈവിക കല്പനയുടെ ഉറവിടമല്ല, അതു കൈമാറുന്ന ഏജന്റാണെന്ന വ്യത്യാസം നിലനിർത്തുന്നു; അതിലധികമായ ദൈവശാസ്ത്രപരമായ ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പരമ്പരാഗതമായി പരിചിതമായ ‘അഹരോൻ’, ‘മോശ’, ‘യഹോവ’ എന്നീ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു; എബ്രായ ശൈലിപ്രയോഗം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാക്കി അടിക്കുറിപ്പിൽ അക്ഷരാർഥം നൽകി.
