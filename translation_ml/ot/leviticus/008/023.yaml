id: LEV.8.23
reference: Leviticus 8:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁחָ֓ט וַ/יִּקַּ֤ח מֹשֶׁה֙ מִ/דָּמ֔/וֹ וַ/יִּתֵּ֛ן עַל תְּנ֥וּךְ אֹֽזֶן אַהֲרֹ֖ן הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: ml
  text: അവൻ അതിനെ അറുത്തു; മോശെ അതിന്റെ രക്തത്തിൽനിന്ന് കുറച്ചെടുത്ത് അഹരോന്റെ വലതുചെവിയുടെ മടലിൽ[a], വലതുകൈയിലെ പെരുവിരലിൽ, വലതുകാലിലെ പെരുവിരലിൽ പുരട്ടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അഹരോന്റെ വലതുചെവിയുടെ അറ്റത്ത്.’
    reason: תְּנוּךְ אֹזֶן എന്ന പ്രയോഗത്തിന് ‘ചെവിയുടെ മടൽ’ എന്ന പ്രധാന അർത്ഥത്തോടൊപ്പം ‘ചെവിയുടെ അറ്റം’ എന്ന പദാർത്ഥപരമായ സാധ്യതയും ഉള്ളതിനാൽ.
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: അവൻ അതിനെ അറുത്തു
  rationale: യാഗസന്ദർഭത്തിലെ ആചാരപരമായ അറുക്കലിനെയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; ‘കൊന്നു’ എന്ന പൊതുപദത്തേക്കാൾ ‘അറുത്തു’ കൃത്യമാണ്. സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന കർമം മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘അതിനെ’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: מִדָּמוֹ
  choice: അതിന്റെ രക്തത്തിൽനിന്ന് കുറച്ചെടുത്ത്
  rationale: מִן എന്ന ഉപസർഗം രക്തത്തിന്റെ ഒരു ഭാഗം എടുത്തതിനെ സൂചിപ്പിക്കുന്നതിനാൽ, മുഴുവൻ രക്തവും എടുത്തുവെന്ന ധാരണ ഒഴിവാക്കി സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ നൽകി.
- source_word: תְּנוּךְ אֹזֶן
  choice: ചെവിയുടെ കീഴറ്റം
  rationale: പുരോഹിതാഭിഷേകച്ചടങ്ങിലെ ഈ പ്രയോഗം ചെവിയുടെ പുറത്തെ അറ്റഭാഗത്തെയോ കീഴറ്റത്തെയോ സൂചിപ്പിക്കുന്നു. പ്രധാന പാഠത്തിൽ വ്യക്തമായ ശരീരഭാഗമായി ‘കീഴറ്റം’ സ്വീകരിക്കുകയും പദത്തിന്റെ സാദ്ധ്യമായ വിശാല അർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: הַיְמָנִית
  choice: വലതു-
  rationale: ചെവി, കൈ, കാൽ എന്നിവയുടെ വലതുവശത്തെ അവയവങ്ങളെയാണ് വിശേഷണം വ്യക്തമാക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം അനുസരിച്ചു ‘വലതുചെവി/വലതുകൈ/വലതുകാൽ’ എന്നു നൽകി.
- source_word: בֹּהֶן יָדוֹ
  choice: കൈയുടെ പെരുവിരൽ
  rationale: കൈയെ സംബന്ധിക്കുമ്പോൾ בֹּהֶן തള്ളവിരലിനെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ‘പെരുവിരൽ’ ഉപയോഗിച്ചു.
- source_word: בֹּהֶן רַגְלוֹ
  choice: കാലിന്റെ പെരുവിരൽ
  rationale: കാലിനെ സംബന്ധിക്കുമ്പോൾ בֹּהֶן വലിയ കാൽവിരലിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; ‘കാലിന്റെ പെരുവിരൽ’ ഈ ശരീരഘടനാപരമായ കൃത്യത നിലനിർത്തുന്നു.
- source_word: וַיִּתֵּן עַל
  choice: പുരട്ടി
  rationale: രക്തം ശരീരഭാഗങ്ങളിൽ വെക്കുന്നതിനെ ആചാരസന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘പുരട്ടി’ എന്നു പറയാം; മൂലപാഠത്തിലെ പ്രവൃത്തി അതിലധികം വ്യാഖ്യാനിക്കാതെ ഇതു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യാഗരക്തം അഹരോന്റെ ശരീരത്തിന്റെ അറ്റഭാഗങ്ങളിൽ പുരട്ടുന്ന ആചാരം
  choice: പ്രവൃത്തിയെ മാത്രം വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി
  alternative: സമർപ്പണം, ശുദ്ധീകരണം, കേൾവി-പ്രവൃത്തി-നടപ്പ് എന്നിവയുടെ പ്രതീകാത്മക അർത്ഥം പ്രധാന പാഠത്തിൽ ചേർക്കുക
  rationale: എബ്രായ പാഠം ഇവിടെ ആചാരപ്രവൃത്തി വിവരിക്കുന്നതേയുള്ളൂ; അതിന്റെ പ്രതീകാത്മകമോ സിദ്ധാന്തപരമോ ആയ അർത്ഥം ഈ വാക്യം നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ അത്തരം വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. യാഗസന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കി. ആവർത്തിക്കുന്ന ‘വലതു’ എന്ന നിർദേശം മൂലപാഠത്തിന്റെ ശരീരഘടനാപരമായ കൃത്യതയ്ക്കായി നിലനിർത്തി.
