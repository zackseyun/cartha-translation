    rationale: In contemporary Malayalam, സ്ഥാനാരോഹണം commonly refers to accession/assumption of a high office, especially enthronement, rather than the ritual installation or ordination of priests. ‘പുരോഹിതനിയമനം’ more clearly conveys the source-contextual priestly installation.
