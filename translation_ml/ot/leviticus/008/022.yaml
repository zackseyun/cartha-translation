source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֶת הָ/אַ֣יִל הַ/שֵּׁנִ֔י אֵ֖יל הַ/מִּלֻּאִ֑ים וַֽ/יִּסְמְכ֞וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: ml
  text: പിന്നെ അവൻ രണ്ടാമത്തെ ആട്ടുകൊറ്റനെ—പുരോഹിതനിയമനത്തിനുള്ള ആട്ടുകൊറ്റനെ[a]—അടുത്തേക്കു കൊണ്ടുവന്നു. അഹരോനും അവന്റെ പുത്രന്മാരും ആ ആട്ടുകൊറ്റന്റെ തലയിൽ തങ്ങളുടെ കൈകൾ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രതിഷ്ഠയ്ക്കുള്ള ആട്ടുകൊറ്റൻ.’ എബ്രായപ്രയോഗം പുരോഹിതന്മാരെ അവരുടെ സ്ഥാനത്തേക്ക് നിയമിക്കുന്ന ചടങ്ങിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: പിന്നെ അവൻ ... അടുത്തുകൊണ്ടുവന്നു
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘അടുത്തുകൊണ്ടുവരുക/സമർപ്പണത്തിനായി കൊണ്ടുവരുക’ എന്ന ആചാരപരമായ അർഥമുണ്ട്. ‘അടുത്തുകൊണ്ടുവന്നു’ എന്നത് ആ അർഥവും തുടർച്ച സൂചിപ്പിക്കുന്ന വാവ് രൂപവും നിലനിർത്തുന്നു.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: രണ്ടാമത്തെ ആട്ടുകൊറ്റനെ
  rationale: אַיִל എന്നത് ആട്ടുകൊറ്റൻ എന്നും הַשֵּׁנִי എന്നത് ക്രമസംഖ്യയായ ‘രണ്ടാമത്തെ’ എന്നും നേരിട്ട് അർഥമാക്കുന്നു.
- source_word: אֵיל הַמִּלֻּאִים
  choice: സ്ഥാനാരോഹണത്തിനുള്ള ആട്ടുകൊറ്റനെ
  rationale: מִלֻּאִים പുരോഹിതസ്ഥാനത്ത് ഔദ്യോഗികമായി സ്ഥാപിക്കുന്ന ആചാരത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. ‘സ്ഥാനാരോഹണം’ ആ സ്ഥാനപ്രവേശത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּסְמְכוּ
  choice: വെച്ചു
  rationale: സമർപ്പണമൃഗത്തിന്റെ തലയിൽ കൈ വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ആചാരപരമായ പ്രയോഗമാണിത്; മലയാളത്തിൽ ‘കൈകൾ വെച്ചു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֶת יְדֵיהֶם
  choice: തങ്ങളുടെ കൈകൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനം നിലനിർത്തുകയും കൈകൾ അഹരോന്റെയും പുത്രന്മാരുടെയുംതാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: ആ ആട്ടുകൊറ്റന്റെ തലയിൽ
  rationale: മൂലപാഠത്തിലെ സ്ഥാനബന്ധം നേരിട്ടും സ്വാഭാവികമായും പകർന്നു നൽകുന്നു.
- source_word: אַהֲרֹן וּבָנָיו
  choice: അഹരോനും അവന്റെ പുത്രന്മാരും
  rationale: בָּנִים ഇവിടെ പുരോഹിതസ്ഥാനാരോഹണത്തിൽ പങ്കെടുക്കുന്ന അഹരോന്റെ ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പുത്രന്മാർ’ സന്ദർഭത്തിന് കൃത്യമാണ്.
theological_decisions:
- issue: പുരോഹിതസ്ഥാനപ്രവേശത്തിന്റെ സാങ്കേതിക പദമായ מִלֻּאִים എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: സ്ഥാനാരോഹണത്തിനുള്ള ആട്ടുകൊറ്റൻ
  alternative: പ്രതിഷ്ഠയ്ക്കുള്ള ആട്ടുകൊറ്റൻ
  rationale: ഇരുവിധവും സാധുവാണെങ്കിലും ലേവ്യപുസ്തകം 8-ൽ അഹരോനെയും പുത്രന്മാരെയും പുരോഹിതസ്ഥാനത്ത് സ്ഥാപിക്കുന്ന ചടങ്ങാണ് മുഖ്യം. ‘സ്ഥാനാരോഹണം’ ഔദ്യോഗിക സ്ഥാനപ്രവേശം വ്യക്തമാക്കുന്നു; ‘പ്രതിഷ്ഠ’ എന്ന സാധുവായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യാഗചടങ്ങിന്റെ ആവർത്തിത സൂത്രഭാഷ നിലനിർത്തിക്കൊണ്ട് സാങ്കേതിക പദത്തിന്റെ മറ്റൊരു സാധുവായ അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
