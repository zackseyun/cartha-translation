  source_fidelity: The draft correctly retains the sequence of bringing Aaron’s sons near, applying blood to the specified right-side body parts, and throwing blood around the altar. However, “ശേഷിച്ച രക്തം” (“the remaining blood”) introduces information not stated in the Hebrew, which simply says “the blood.”
