source:
  edition: WLC
  text: וַ/יַּקְרֵ֞ב אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יִּתֵּ֨ן מֹשֶׁ֤ה מִן הַ/דָּם֙ עַל תְּנ֤וּךְ אָזְנָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָדָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְלָ֖/ם הַ/יְמָנִ֑ית וַ/יִּזְרֹ֨ק מֹשֶׁ֧ה אֶת הַ/דָּ֛ם עַל הַֽ/מִּזְבֵּ֖חַ סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: ml
  text: പിന്നെ അവൻ അഹരോന്റെ പുത്രന്മാരെ അടുത്തുകൊണ്ടുവന്നു. മോശെ രക്തത്തിൽനിന്ന് കുറച്ച് അവരുടെ വലതുചെവിയുടെ മടലിലും വലതുകൈയുടെ പെരുവിരലിലും വലതുകാലിന്റെ പെരുവിരലിലും പുരട്ടി. തുടർന്ന് മോശെ രക്തം യാഗപീഠത്തിന്റെ ചുറ്റും എറിഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: അടുത്തുകൊണ്ടുവന്നു
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഇവിടെ കർത്താവ് മുൻസന്ദർഭത്തിലെ മോശെയാണ്.
- source_word: תְּנוּךְ אָזְנָם הַיְמָנִית
  choice: അവരുടെ വലതുചെവിയുടെ മടൽ
  rationale: תנוך എന്നത് ചെവിയുടെ അറ്റമോ മടലോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ശരീരഭാഗം വ്യക്തമായി തിരിച്ചറിയാൻ 'ചെവിയുടെ മടൽ' അനുയോജ്യം.
- source_word: בֹּהֶן יָדָם הַיְמָנִית
  choice: വലതുകൈയുടെ പെരുവിരൽ
  rationale: കൈയോടൊപ്പം בֹּהֶן കൈയിലെ പെരുവിരലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בֹּהֶן רַגְלָם הַיְמָנִית
  choice: വലതുകാലിന്റെ പെരുവിരൽ
  rationale: കാലിനോടൊപ്പം בֹּהֶן വലിയ കാൽവിരലിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സാധാരണ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיִּזְרֹק
  choice: എറിഞ്ഞു
  rationale: זרק എന്ന ക്രിയയുടെ അടിസ്ഥാന ചലനം നിലനിർത്തുന്നു; യാഗക്രമത്തിൽ രക്തം യാഗപീഠത്തിലേക്ക് എറിയുന്നതാണ് സൂചന.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: രക്തം യാഗപീഠത്തിന്റെ എല്ലാ വശങ്ങളിലേക്കും പ്രയോഗിച്ചതെന്ന സ്ഥലാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: അവയവങ്ങളിൽ രക്തം പുരട്ടുന്നതിന്റെ പ്രതീകാർഥം
  choice: വാക്യത്തിൽ വ്യാഖ്യാനം ചേർക്കാതെ ചടങ്ങിന്റെ പ്രവൃത്തികൾ മാത്രം വിവർത്തനം ചെയ്തു
  alternative: കേൾവി, പ്രവൃത്തി, നടത്തം എന്നിവയുടെ സമർപ്പണമെന്ന പ്രതീകവ്യാഖ്യാനം വാചകത്തിൽ ഉൾപ്പെടുത്തുക
  rationale: എബ്രായ വാചകം പ്രതീകാർഥം വിശദീകരിക്കുന്നില്ല; അതിനാൽ പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- issue: രക്തം യാഗപീഠത്തിൽ പ്രയോഗിച്ച രീതി
  choice: '''എറിഞ്ഞു'' എന്ന നേരിട്ടുള്ള വിവർത്തനം'
  alternative: '''തളിച്ചു'' അല്ലെങ്കിൽ ''തെറിപ്പിച്ചു'''
  rationale: മൂലക്രിയയുടെ ശക്തമായ ചലനം സംരക്ഷിക്കുകയും പ്രത്യേക ആചാരരീതി അനാവശ്യമായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആവർത്തനങ്ങൾ മൂലവാക്യത്തിന്റെ ചടങ്ങുസംബന്ധിയായ കൃത്യത കാത്തുകൊണ്ട് സ്വാഭാവികമായി ക്രമപ്പെടുത്തി.
