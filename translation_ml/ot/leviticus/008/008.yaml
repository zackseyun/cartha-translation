source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם עָלָ֖י/ו אֶת הַ/חֹ֑שֶׁן וַ/יִּתֵּן֙ אֶל הַ/חֹ֔שֶׁן אֶת הָ/אוּרִ֖ים וְ/אֶת הַ/תֻּמִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/008.yaml
  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: ml
  text: അവൻ അഹരോന്റെ മേൽ നെഞ്ചലങ്കാരം[a] അണിയിച്ചു; നെഞ്ചലങ്കാരത്തിനുള്ളിൽ ഊരീമും തുമ്മീമും[b] വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നെഞ്ചുകവചം.’ എബ്രായപദം മഹാപുരോഹിതൻ നെഞ്ചിൽ ധരിച്ചിരുന്ന പ്രത്യേക വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; ‘നെഞ്ചലങ്കാരം’ എന്നത് യുദ്ധകവചമാണെന്ന ധാരണ ഒഴിവാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഊരീം,’ ‘തുമ്മീം’ എന്നിവ എബ്രായ ആചാരപദങ്ങളാണ്. അവയുടെ കൃത്യമായ രൂപവും ഉപയോഗരീതിയും വ്യക്തമല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם עָלָיו
  choice: അവൻ അഹരോന്റെ മേൽ ... അണിയിച്ചു
  rationale: שׂוּם എന്നതിന് ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നർഥമുണ്ടെങ്കിലും, ഇവിടെ മഹാപുരോഹിതനെ ഔദ്യോഗിക വസ്ത്രം അണിയിക്കുന്ന സന്ദർഭമായതിനാൽ ‘അണിയിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്. עָלָיוയിലെ സർവനാമത്തിന്റെ സൂചിതനായ അഹരോനെ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പേരെടുത്തു പറയുന്നു.
- source_word: הַחֹשֶׁן
  choice: നെഞ്ചലങ്കാരം
  rationale: ഇത് മഹാപുരോഹിതന്റെ നെഞ്ചിൽ ധരിച്ചിരുന്ന പ്രത്യേക വസ്തുവാണ്; ‘നെഞ്ചുകവചം’ എന്നു പറഞ്ഞാൽ യുദ്ധകവചം എന്ന തെറ്റിദ്ധാരണ വരാം. ‘നെഞ്ചലങ്കാരം’ അതിന്റെ ധാരണസ്ഥാനവും ആചാരപരമായ സ്വഭാവവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתֵּן אֶל הַחֹשֶׁן
  choice: നെഞ്ചലങ്കാരത്തിനുള്ളിൽ ... വെച്ചു
  rationale: נָתַן ഇവിടെ ‘വെച്ചു’ എന്നാണ്; אֶל സന്ദർഭത്തിൽ വസ്തുവിന്റെ ഉള്ളിലേക്കുള്ള നിക്ഷേപത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉള്ളിൽ’ എന്ന പ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: ഊരീമും തുമ്മീമും
  rationale: ഇവയുടെ കൃത്യമായ രൂപവും ഉപയോഗരീതിയും അനിശ്ചിതമായതിനാൽ അർഥം അനുമാനിച്ച് വിവർത്തനം ചെയ്യാതെ എബ്രായ ആചാരനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: אוּרִים וְתֻמִּים എന്ന പുരോഹിതീയ വസ്തുക്കളുടെ വിവർത്തനം
  choice: ‘ഊരീമും തുമ്മീമും’ എന്നു ലിപ്യന്തരണം ചെയ്യുക
  alternative: ‘വെളിച്ചങ്ങളും പൂർണതകളും’ അല്ലെങ്കിൽ ‘വിശുദ്ധ ചീട്ടുകൾ’ എന്നു വിവർത്തനം ചെയ്യുക
  rationale: ഇവ പുരോഹിതീയമായി ദൈവഹിതം തിരിച്ചറിയുന്നതുമായി ബന്ധപ്പെട്ടിരുന്നെങ്കിലും അവയുടെ കൃത്യസ്വഭാവം ഉറപ്പില്ല. ലിപ്യന്തരണം മൂലപാഠത്തിന്റെ പ്രത്യേകതയും യഥാർഥ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. വസ്ത്രധാരണസന്ദർഭത്തിൽ ‘അണിയിച്ചു’ ഉപയോഗിച്ചു; സാങ്കേതിക ആചാരപദങ്ങൾ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ ലിപ്യന്തരണം ചെയ്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
