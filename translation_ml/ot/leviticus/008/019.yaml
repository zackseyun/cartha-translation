translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ തുടർച്ചയായ പ്രവൃത്തികൾ അർദ്ധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചു; ആദ്യക്രിയയിലെ പരോക്ഷ കർത്താവിനെയും സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ച കർമത്തെയും നിലനിർത്തി.
