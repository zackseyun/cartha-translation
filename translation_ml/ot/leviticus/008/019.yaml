translation:
  language: ml
  text: അവൻ അതിനെ അറുത്തു; മോശെ രക്തം യാഗപീഠത്തിന്മേൽ ചുറ്റുമായി എറിഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാഗപീഠത്തിന്മേൽ ചുറ്റുമായി രക്തം ശക്തിയായി ചീറ്റിച്ചു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയ യാഗരക്തം ശക്തിയായി പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ലഘുവായി തളിക്കുന്നതിനെയല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: അവൻ അതിനെ അറുത്തു
  rationale: ശָׁחַט യാഗസന്ദർഭത്തിൽ മൃഗത്തെ അറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻവാക്യത്തിലെ യാഗമൃഗത്തെ ഉദ്ദേശിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘അതിനെ’ ചേർത്തു.
- source_word: וַיִּזְרֹק
  choice: എറിഞ്ഞു
  rationale: זָרַק ഇവിടെ യാഗരക്തം യാഗപീഠത്തിലേക്ക് ശക്തിയായി പ്രയോഗിക്കുന്ന ക്രിയയാണ്. ‘തളിച്ചു’ എന്നത് ലഘുവായ തളിക്കലെന്ന തെറ്റായ ധാരണ നൽകാമെന്നതിനാൽ നേരിട്ടുള്ള ‘എറിഞ്ഞു’ തിരഞ്ഞെടുത്തു.
- source_word: הַדָּם
  choice: രക്തം
  rationale: നിശ്ചിതമായ യാഗരക്തത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ നാമം; മലയാളത്തിൽ സന്ദർഭം നിർവചിതത്വം വ്യക്തമാക്കുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പണസന്ദർഭത്തിലെ מִזְבֵּחַ എന്ന പദത്തിന്റെ സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: סָבִיב
  choice: എല്ലാ വശങ്ങളിലേക്കും
  rationale: യാഗപീഠത്തിന്റെ ചുറ്റുമുള്ള വശങ്ങളിലാകെ രക്തം പ്രയോഗിച്ചതെന്ന വിതരണാർഥം വ്യക്തമായി നൽകുന്നു; ‘ചുറ്റും’ മാത്രം ഉപയോഗിച്ചാൽ പീഠത്തിനു സമീപമുള്ള നിലത്തേക്കെന്ന ആശയക്കുഴപ്പം ഉണ്ടാകാം.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: ആധുനിക മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
