source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: ml
  text: അവൻ അവയെല്ലാം അഹരോന്റെ ഉള്ളങ്കൈകളിലും അവന്റെ പുത്രന്മാരുടെ ഉള്ളങ്കൈകളിലും വെച്ചു[a]. പിന്നെ അവയെ യഹ്‌വെയുടെ സന്നിധിയിൽ ആട്ടൽവഴിപാടായി ആട്ടിക്കാണിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അഹരോന്റെ ഉള്ളങ്കൈകളുടെ മേലും അവന്റെ പുത്രന്മാരുടെ ഉള്ളങ്കൈകളുടെ മേലും.” ഇവിടെ യാഗഭാഗങ്ങൾ കുമ്പിളാക്കിയ കൈകളിൽ വെച്ചതാണെന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: വെച്ചു
  rationale: נתן എന്ന ക്രിയയ്ക്ക് ‘കൊടുക്കുക’, ‘വെക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ യാഗഭാഗങ്ങൾ കൈകളിൽ സ്ഥാപിക്കുന്ന ശാരീരിക പ്രവൃത്തിയായതിനാൽ ‘വെച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֶת הַכֹּל
  choice: അവയെല്ലാം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ യാഗഭാഗങ്ങളെ മുഴുവനായി സൂചിപ്പിക്കുന്നു; ബഹുവചനസൂചനയും സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: עַל כַּפֵּי
  choice: ഉള്ളങ്കൈകളിൽ
  rationale: כַּף ഇവിടെ ഉള്ളങ്കൈയെ സൂചിപ്പിക്കുന്നു. עַל അക്ഷരാർഥത്തിൽ ‘മേൽ’ ആണെങ്കിലും, സാധനങ്ങൾ കുമ്പിളാക്കിയ കൈകളിൽ വെക്കുന്ന ആചാരസന്ദർഭത്തിൽ മലയാളത്തിലെ ‘ഉള്ളങ്കൈകളിൽ’ സ്വാഭാവികമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיָּנֶף אֹתָם תְּנוּפָה
  choice: അവയെ ... നീരാജനാർപ്പണമായി ആട്ടിക്കാണിച്ചു
  rationale: נוף എന്ന ക്രിയയുടെയും תְּנוּפָה എന്ന ആചാരസാങ്കേതിക നാമത്തിന്റെയും ആവർത്തിത ആശയം സംരക്ഷിക്കുന്നു. ‘ആട്ടിക്കാണിച്ചു’ പ്രവൃത്തിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുകയും ‘നീരാജനാർപ്പണം’ ആചാരപരമായ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് സാന്നിധ്യത്തിൽ നടത്തുന്ന ആചാരപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ദൈവനാമം יְהוָה ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: എബ്രായ ചതുരക്ഷരനാമത്തെ വ്യക്തിനാമമായി സുതാര്യമായി പ്രതിനിധീകരിക്കാൻ ‘യഹ്‌വെ’ ഉപയോഗിച്ചു; പകരം പദവിനാമം ചേർത്ത് മൂലത്തിലെ വ്യക്തിനാമം മറച്ചിട്ടില്ല.
- issue: בָנָיו എന്ന ബന്ധപദത്തിന്റെ ലിംഗസൂചന
  choice: അവന്റെ പുത്രന്മാർ
  alternative: അവന്റെ മക്കൾ
  rationale: ഈ പുരോഹിതാഭിഷേകസന്ദർഭത്തിൽ എബ്രായപദം ആരോന്റെ ആൺമക്കളെ പ്രത്യേകം സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗസൂചന നിലനിർത്തി.
- issue: תְּנוּפָה എന്ന യാഗസാങ്കേതിക പദം
  choice: നീരാജനാർപ്പണം
  alternative: ആട്ടുന്ന വഴിപാട്; നീരാജനയാഗം
  rationale: ആചാരപരമായ സാങ്കേതിക അർഥം നിലനിർത്തുന്നതിനൊപ്പം, അനുബന്ധക്രിയയായ ‘ആട്ടിക്കാണിച്ചു’ വഴി പ്രവൃത്തി വ്യക്തമാക്കുന്നു; ഇത് യാഗത്തിന്റെ കൃത്യമായ ചലനരീതി സംബന്ധിച്ച് മൂലപാഠം പറയുന്നതിലധികം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘നീരാജനാർപ്പണം’ എന്ന ആചാരസാങ്കേതിക പദത്തോടൊപ്പം ‘ആട്ടിക്കാണിച്ചു’ ചേർത്ത് അർഥം വ്യക്തമാക്കിയിരിക്കുന്നു. എല്ലാ സർവനാമങ്ങളുടെയും പൂർവപദം വ്യക്തമായി നിലനിർത്തി.
