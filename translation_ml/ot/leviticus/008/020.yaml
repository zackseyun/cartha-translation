  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הָ/אַ֔יִל נִתַּ֖ח לִ/נְתָחָ֑י/ו וַ/יַּקְטֵ֤ר מֹשֶׁה֙ אֶת הָ/רֹ֔אשׁ וְ/אֶת הַ/נְּתָחִ֖ים וְ/אֶת הַ/פָּֽדֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/020.yaml
  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
translation:
  language: ml
  text: പിന്നെ അവൻ ആൺചെമ്മരിയാടിനെ കഷണങ്ങളായി മുറിച്ചു; മോശെ അതിന്റെ തലയും കഷണങ്ങളും കൊഴുപ്പും[a] ദഹിപ്പിച്ച് പുകയായി ഉയർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൊഴുപ്പേറിയ ഭാഗം’; ചിലർ ‘കൊഴുത്ത വാൽ’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: פָּדֶר എന്ന എബ്രായപദം യാഗമൃഗത്തിലെ കൊഴുപ്പേറിയ ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; അത് പ്രത്യേകിച്ച് വാലാണോ എന്നത് അനിശ്ചിതമാണ്.
lexical_decisions:
- source_word: הָאַיִל
  choice: ആൺചെമ്മരിയാട്
  rationale: യാഗസന്ദർഭത്തിൽ אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: נִתַּח לִנְתָחָיו
  choice: കഷണങ്ങളായി മുറിച്ചു
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന് മൃഗത്തെ ഭാഗങ്ങളായി മുറിക്കുന്ന പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: וַיַּקְטֵר
  choice: യാഗപീഠത്തിൽ ദഹിപ്പിച്ച് പുകയായി ഉയർത്തി
  rationale: കത്ര് എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗവസ്തു പുകയായി ഉയരുന്നവിധം യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന സാങ്കേതിക യാഗാർഥം വഹിക്കുന്നു. സന്ദർഭത്തിൽ വ്യക്തമായ യാഗപീഠം മലയാളത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: הָרֹאשׁ
  choice: തല
  rationale: നേരിട്ടുള്ള ശരീരഭാഗനാമം.
- source_word: הַנְּתָחִים
  choice: കഷണങ്ങൾ
  rationale: മുൻവാക്യഭാഗത്തിലെ സമാനധാതുനാമം ആവർത്തിച്ച് മുറിച്ചെടുത്ത ഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: הַפָּדֶר
  choice: കൊഴുപ്പ്
  rationale: פָּדֶר യാഗമൃഗത്തിലെ കൊഴുപ്പേറിയ ഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘കൊഴുപ്പ്’ മൂലപദത്തിന്റെ ഉറപ്പുള്ള അർഥം നിലനിർത്തുന്നു; ‘കൊഴുത്ത വാൽ’ എന്ന കൂടുതൽ സവിശേഷ തിരിച്ചറിവ് നിർബന്ധമാക്കുന്നില്ല.
