translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ യാഗപരിഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ യാഗസാങ്കേതിക ക്രിയയുടെ പുകയായി ഉയർത്തുന്ന ഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കി; פָּדֶר എന്ന പദത്തിന്റെ സവിശേഷ തിരിച്ചറിവിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
