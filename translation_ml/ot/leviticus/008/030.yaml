  source_fidelity: 'ഹീബ്രു മൂലത്തിലെ ക്രമവും ഘടകങ്ങളും കരടിൽ നന്നായി നിലനിർത്തിയിട്ടുണ്ട്: അഭിഷേകതൈലവും യാഗപീഠത്തിലെ രക്തവും ഭാഗികമായി എടുക്കൽ, അഹരോൻ, അവന്റെ വസ്ത്രങ്ങൾ, പുത്രന്മാർ, പുത്രന്മാരുടെ വസ്ത്രങ്ങൾ എന്ന പട്ടിക, ഒടുവിലെ വിശുദ്ധീകരണം എന്നിവയെല്ലാം ഉൾപ്പെട്ടിരിക്കുന്നു. എന്നാൽ മോശെയുടെ സ്ഥിരമായ മലയാള നാമരൂപം ‘മോശെ’ ആയിരിക്കണം; ‘മോശ’ എന്ന രൂപം തിരുത്തേണ്ടതാണ്.'
  naturalness: വാക്യം പൊതുവേ ആധുനിക മാനക മലയാളത്തിൽ വ്യക്തമാണ്. ‘മേൽ ഉണ്ടായിരുന്നു’, ‘കുറച്ച് എടുത്ത്’ എന്നീ വേർതിരിച്ചെഴുത്തുകൾ വായനാസൗകര്യം മെച്ചപ്പെടുത്തുന്നു. ‘അവനോടുകൂടെ ഉണ്ടായിരുന്ന അവന്റെ പുത്രന്മാരുടെ വസ്ത്രങ്ങൾ’ എന്ന ക്രമം ‘അവരുടെ വസ്ത്രങ്ങൾ’ എന്ന സർവനാമത്തിന്റെ ചെറിയ സന്ദിഗ്ധത ഒഴിവാക്കുന്നു.
  terminology: ‘അഭിഷേകതൈലം,’ ‘യാഗപീഠം,’ ‘പുത്രന്മാർ,’ ‘വിശുദ്ധീകരിച്ചു’ എന്നിവ സന്ദർഭോചിതവും മൂലത്തോടു വിശ്വസ്തവുമാണ്. קדשׁ-ന് ‘വിശുദ്ധീകരിച്ചു’ സുരക്ഷിതമായ പരിഭാഷയാണ്; ‘പ്രതിഷ്ഠിച്ചു’ എന്ന വ്യാഖ്യാനപരമായ പരിമിതി അതിൽ വരില്ല.
