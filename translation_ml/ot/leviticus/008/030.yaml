  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: ml
  text: പിന്നെ മോശെ അഭിഷേകതൈലത്തിൽനിന്നും യാഗപീഠത്തിന്മേൽ ഉണ്ടായിരുന്ന രക്തത്തിൽനിന്നും കുറച്ച് എടുത്ത് അഹരോന്റെ മേലും അവന്റെ വസ്ത്രങ്ങളുടെ മേലും അവന്റെ പുത്രന്മാരുടെ മേലും അവനോടുകൂടെ ഉണ്ടായിരുന്ന അവന്റെ പുത്രന്മാരുടെ വസ്ത്രങ്ങളുടെ മേലും തളിച്ചു. അങ്ങനെ അവൻ അഹരോനെയും അവന്റെ വസ്ത്രങ്ങളെയും അവന്റെ പുത്രന്മാരെയും അവനോടുകൂടെ ഉണ്ടായിരുന്ന അവന്റെ പുത്രന്മാരുടെ വസ്ത്രങ്ങളെയും വിശുദ്ധീകരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח ... מִן
  choice: കുറച്ചെടുത്തു
  rationale: לקח എന്നത് ‘എടുത്തു’ എന്നും ആവർത്തിച്ചുള്ള מן ഇവിടെ രണ്ടു ദ്രവ്യങ്ങളിൽനിന്നുള്ള ഒരു ഭാഗം എന്നും സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘കുറച്ചെടുത്തു’ അത് വ്യക്തമാക്കുന്നു.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലത്തിൽനിന്നും
  rationale: שֶׁמֶן ‘എണ്ണ/തൈലം,’ מִשְׁחָה ‘അഭിഷേകം’; ആരാധനാക്രമത്തിന്റെ ഗൗരവമുള്ള സന്ദർഭത്തിൽ ‘അഭിഷേകതൈലം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וּמִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേലുണ്ടായിരുന്ന രക്തത്തിൽനിന്നും
  rationale: מן ഭാഗികമായി എടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; אֲשֶׁר עַל הַמִּזְבֵּחַ എന്ന ബന്ധവാക്യം രക്തത്തിന്റെ സ്ഥാനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיַּז
  choice: തളിച്ചു
  rationale: נזה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം പുരോഹിതാചാരത്തിൽ ദ്രവം തളിക്കുന്ന പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘തളിച്ചു’ വ്യക്തവും പതിവുള്ളതുമാണ്.
- source_word: בְּגָדָיו
  choice: അവന്റെ വസ്ത്രങ്ങൾ
  rationale: בֶּגֶד എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘വസ്ത്രം’; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘പുരോഹിതവസ്ത്രം’ ചേർക്കാതെ മൂലത്തിന്റെ വ്യാപ്തി കാക്കുന്നു.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രു പദം പുരുഷലിംഗ ബഹുവചനവും ഇവിടെ അഹരോന്റെ പുരോഹിതസ്ഥാനമേൽക്കുന്ന പുത്രന്മാരെ സൂചിപ്പിക്കുന്നതുമാണ്.
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: അവനോടുകൂടെയുണ്ടായിരുന്ന അവരുടെ വസ്ത്രങ്ങൾ
  rationale: אִתּוֹ വസ്ത്രങ്ങളെയല്ല, അഹരോനോടുകൂടെയുണ്ടായിരുന്ന പുത്രന്മാരെയാണ് സ്വാഭാവികമായി വിശേഷിപ്പിക്കുന്നത്; മലയാളവാക്യം ആ ബന്ധം അവ്യക്തമാകാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיְקַדֵּשׁ
  choice: വിശുദ്ധീകരിച്ചു
  rationale: קדשׁ ഇവിടെ വിശുദ്ധകാര്യത്തിനായി വേർതിരിക്കുന്ന ആചാരപ്രവൃത്തിയാണ്; ‘വിശുദ്ധീകരിച്ചു’ മൂലത്തിലെ വിശുദ്ധതാഭാവവും പ്രവൃത്തിയുടെ ഫലവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുരോഹിതപ്രതിഷ്ഠാസന്ദർഭത്തിലെ קדשׁ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശുദ്ധീകരിച്ചു
  alternative: പ്രതിഷ്ഠിച്ചു / വിശുദ്ധമായി വേർതിരിച്ചു
  rationale: വാക്യം അഹരോനെയും പുത്രന്മാരെയും അവരുടെ വസ്ത്രങ്ങളെയും വിശുദ്ധകാര്യത്തിനായി വേർതിരിക്കുന്നതിനെ വിവരിക്കുന്നു. ‘വിശുദ്ധീകരിച്ചു’ പദത്തിന്റെ അടിസ്ഥാനമായ വിശുദ്ധതാഭാവം സംരക്ഷിക്കുന്നു; ‘പ്രതിഷ്ഠിച്ചു’ സന്ദർഭപരമായി സാധ്യമെങ്കിലും വസ്ത്രങ്ങളെയും നേരിട്ടുള്ള കർമമായി ഉൾക്കൊള്ളുമ്പോൾ കൂടുതൽ വ്യാഖ്യാനാത്മകമാകാം.
- issue: അഹരോന്റെ സന്തതിയെ ലിംഗനിർണ്ണയത്തോടെ സൂചിപ്പിക്കൽ
  choice: പുത്രന്മാർ
  alternative: മക്കൾ
  rationale: בָּנָיו വ്യക്തമായി പുരുഷലിംഗ ബഹുവചനമാണ്; പുരോഹിതാഭിഷേകത്തിൽ പങ്കെടുത്ത അഹരോന്റെ പുത്രന്മാരാണ് ഉദ്ദേശ്യം, അതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആരാധനാക്രമഭാഷ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ആവർത്തിച്ച പട്ടിക നിലനിർത്തിയെങ്കിലും ‘അവനോടുകൂടെയുണ്ടായിരുന്ന’ എന്നത് പുത്രന്മാരെ വിശേഷിപ്പിക്കുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് വാക്യത്തിന്റെ അവസാനഭാഗവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ മൂലഹീബ്രുവിൽ അടിസ്ഥാനമില്ലാത്ത അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
