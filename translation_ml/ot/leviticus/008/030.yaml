    rationale: ‘അവനോടുകൂടെയുണ്ടായിരുന്ന അവരുടെ വസ്ത്രങ്ങൾ’ വ്യാകരണപരമായി ഗ്രഹിക്കാമെങ്കിലും ‘അവരുടെ’ എന്നത് ക്ഷണികമായി അവ്യക്തമാണ്. ‘അവനോടുകൂടെ ഉണ്ടായിരുന്ന അവന്റെ പുത്രന്മാരുടെ വസ്ത്രങ്ങൾ’ മൂലത്തിലെ ബന്ധം കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
  revised_text: പിന്നെ മോശെ അഭിഷേകതൈലത്തിൽനിന്നും യാഗപീഠത്തിന്മേൽ ഉണ്ടായിരുന്ന രക്തത്തിൽനിന്നും കുറച്ച് എടുത്ത് അഹരോന്റെ മേലും അവന്റെ വസ്ത്രങ്ങളുടെ മേലും അവന്റെ പുത്രന്മാരുടെ മേലും അവനോടുകൂടെ ഉണ്ടായിരുന്ന അവന്റെ പുത്രന്മാരുടെ വസ്ത്രങ്ങളുടെ മേലും തളിച്ചു. അങ്ങനെ അവൻ അഹരോനെയും അവന്റെ വസ്ത്രങ്ങളെയും അവന്റെ പുത്രന്മാരെയും അവനോടുകൂടെ ഉണ്ടായിരുന്ന അവന്റെ പുത്രന്മാരുടെ വസ്ത്രങ്ങളെയും വിശുദ്ധീകരിച്ചു.
