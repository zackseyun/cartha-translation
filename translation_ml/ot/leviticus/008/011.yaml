id: LEV.8.11
reference: Leviticus 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥ז מִמֶּ֛/נּוּ עַל הַ/מִּזְבֵּ֖חַ שֶׁ֣בַע פְּעָמִ֑ים וַ/יִּמְשַׁ֨ח אֶת הַ/מִּזְבֵּ֜חַ וְ/אֶת כָּל כֵּלָ֗י/ו וְ/אֶת הַ/כִּיֹּ֛ר וְ/אֶת כַּנּ֖/וֹ לְ/קַדְּשָֽׁ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: ml
  text: അവൻ അതിൽനിന്ന് കുറച്ച് യാഗപീഠത്തിന്മേൽ ഏഴു പ്രാവശ്യം തളിച്ചു[a]; യാഗപീഠത്തിനും അതിന്റെ എല്ലാ ഉപകരണങ്ങൾക്കും കഴുകാനുള്ള തൊട്ടിക്കും അതിന്റെ താങ്ങിനും അഭിഷേകം ചെയ്തു[b], അവയെ വിശുദ്ധീകരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിൽനിന്ന്’ എന്നത് സന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന അഭിഷേകതൈലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: സർവനാമത്തിന്റെ സന്ദർഭസൂചന വ്യക്തമാക്കൽ
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അതിന്റെ അടിത്തറ.’
    reason: כַּנּוֹ എന്ന പദത്തിന്റെ സാധ്യമായ ബദൽ പരിഭാഷ
lexical_decisions:
- source_word: וַיַּז מִמֶּנּוּ
  choice: അവൻ അതിൽനിന്ന് കുറച്ച് ... തളിച്ചു
  rationale: נזה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ആചാരപരമായി ദ്രാവകം തളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. מִמֶּנּוּ അക്ഷരാർഥത്തിൽ ‘അതിൽനിന്ന്’ എന്നാണ്; സന്ദർഭത്തിലെ അഭിഷേകതൈലത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്. ‘കുറച്ച്’ എന്നത് മലയാളത്തിൽ ക്രിയയുടെ സ്വാഭാവിക കർമം വ്യക്തമാക്കുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പണത്തിന്റെ പീഠത്തെ സൂചിപ്പിക്കുന്ന മִזְבֵּחַ എന്ന പദത്തിന്റെ വ്യക്തവും സ്ഥാപിതവുമായ മലയാള പരിഭാഷ.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: ആചാരപ്രവൃത്തി ഏഴുതവണ ആവർത്തിച്ചതിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּמְשַׁח
  choice: അഭിഷേകതൈലം പുരട്ടി
  rationale: משׁח ഇവിടെ വിശുദ്ധീകരണത്തിനായി എണ്ണ പുരട്ടുന്ന ആചാരപ്രവൃത്തിയാണ്. സന്ദർഭത്തിൽ തൈലം വ്യക്തമായതിനാൽ ഈ പരിഭാഷ ആചാരാർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כָּל כֵּלָיו
  choice: അതിന്റെ ഉപകരണങ്ങളെല്ലാം
  rationale: כְּלִי എന്ന വിശാലപദം യാഗപീഠത്തോടനുബന്ധിച്ച സാമഗ്രികളെയോ ഉപകരണങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘ഉപകരണങ്ങൾ’ ആധുനികവും സ്വാഭാവികവുമാണ്.
- source_word: הַכִּיֹּר
  choice: കഴുകാനുള്ള തൊട്ടി
  rationale: കൂടാരമുറ്റത്ത് ശുദ്ധീകരണത്തിനായി ഉപയോഗിച്ച ജലപാത്രമാണ് כִּיּוֹר. ‘കഴുകാനുള്ള തൊട്ടി’ അതിന്റെ ഉപയോഗം വ്യക്തമായി അറിയിക്കുന്ന, പുരാതനമല്ലാത്ത പരിഭാഷയാണ്.
- source_word: כַּנּוֹ
  choice: അതിന്റെ താങ്ങ്
  rationale: כֵּן ഇവിടെ തൊട്ടിയെ താങ്ങിനിർത്തുന്ന ഘടനയെ സൂചിപ്പിക്കുന്നു; ‘താങ്ങ്’ എന്നത് ‘അടിത്തറ’ എന്ന സാധ്യതയും ഉൾക്കൊള്ളുന്ന വായനാസൗകര്യമുള്ള പദമാണ്.
- source_word: לְקַדְּשָׁם
  choice: അവയെ വിശുദ്ധീകരിക്കേണ്ടതിന്
  rationale: קדשׁ എന്നത് ഈ വസ്തുക്കളെ വിശുദ്ധമായ ഉപയോഗത്തിനായി വേർതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധീകരിക്കുക’ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശുദ്ധവസ്തുക്കളെയും ആചാരപ്രവൃത്തികളെയും കുറിച്ചുള്ള പദപ്രയോഗം
  choice: ‘അഭിഷേകതൈലം പുരട്ടി’, ‘വിശുദ്ധീകരിക്കേണ്ടതിന്’ എന്നീ വായനാസൗകര്യമുള്ള ആചാരപദങ്ങൾ ഉപയോഗിച്ചു.
  alternative: ‘അഭിഷേകം ചെയ്തു’, ‘പ്രതിഷ്ഠിക്കേണ്ടതിന്’ എന്നിങ്ങനെ പരിഭാഷപ്പെടുത്താം.
  rationale: മൂലപാഠം വസ്തുക്കളിൽ എണ്ണ പുരട്ടി അവയെ വിശുദ്ധോപയോഗത്തിനായി വേർതിരിക്കുന്ന പ്രവൃത്തിയെ വിവരിക്കുന്നു. തിരുവെഴുത്തിലെ ആചാരഗൗരവം നിലനിർത്തിക്കൊണ്ട് പിൽക്കാല സഭാപരമായ പ്രത്യേക അർഥങ്ങൾ അനാവശ്യമായി ചേർക്കാതിരിക്കാനാണ് ഈ തിരഞ്ഞെടുപ്പ്.
- issue: לְקַדְּשָׁם എന്ന ലക്ഷ്യപ്രയോഗത്തിന്റെ പരിധി
  choice: യാഗപീഠം, ഉപകരണങ്ങൾ, തൊട്ടി, താങ്ങ് എന്നിവയെല്ലാം ഉൾപ്പെടുന്ന വിധത്തിൽ ‘അവയെ വിശുദ്ധീകരിക്കേണ്ടതിന്’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: അവസാനം പരാമർശിച്ച തൊട്ടിയെയും താങ്ങിനെയും മാത്രം സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
  rationale: ബഹുവചന കർമപ്രത്യയവും വാക്യത്തിലെ സമാന്തര ഘടനയും പട്ടികപ്പെടുത്തിയ എല്ലാ വസ്തുക്കളെയും ഉൾക്കൊള്ളുന്നതാണ് ഏറ്റവും സ്വാഭാവികം; അതേസമയം വാക്യഘടന മാറ്റി വ്യാഖ്യാനം അതിരുകടന്ന് ഉറപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘ലാവർ’ പോലുള്ള അപരിചിതമായ പരമ്പരാഗത പദങ്ങൾ ഒഴിവാക്കി; എന്നാൽ ‘യാഗപീഠം’, ‘അഭിഷേകതൈലം’, ‘വിശുദ്ധീകരിക്കുക’ എന്നീ ആചാരഗൗരവമുള്ള പദങ്ങൾ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
