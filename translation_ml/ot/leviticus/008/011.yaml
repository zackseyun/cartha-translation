revisions:
- from: അവൻ അതിൽനിന്ന് കുറച്ച് യാഗപീഠത്തിന്മേൽ ഏഴു പ്രാവശ്യം തളിച്ചു[a]. യാഗപീഠവും അതിന്റെ ഉപകരണങ്ങളെല്ലാം കഴുകാനുള്ള തൊട്ടിയും അതിന്റെ താങ്ങും വിശുദ്ധീകരിക്കേണ്ടതിന് അവൻ അവയിൽ അഭിഷേകതൈലം പുരട്ടി[b].
  to: അവൻ അതിൽനിന്ന് കുറച്ച് യാഗപീഠത്തിന്മേൽ ഏഴു പ്രാവശ്യം തളിച്ചു[a]; യാഗപീഠത്തിനും അതിന്റെ എല്ലാ ഉപകരണങ്ങൾക്കും കഴുകാനുള്ള തൊട്ടിക്കും അതിന്റെ താങ്ങിനും അഭിഷേകം ചെയ്തു[b], അവയെ വിശുദ്ധീകരിക്കേണ്ടതിന്.
  rationale: The revision preserves the Hebrew list and purpose clause while removing Malayalam syntactic ambiguity. It also replaces the misleading second footnote with the supported lexical alternative for the basin’s supporting structure. No disputed textual or theological interpretation has been introduced.
