lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: ശേഷിക്കുന്നത്
  rationale: נותר എന്ന നിഫാൽ കൃദന്തം ശേഷിച്ചിരിക്കുന്നതിനെ വസ്തുവാചകമായി സൂചിപ്പിക്കുന്നു; ‘ശേഷിക്കുന്നത്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בַּבָּשָׂר
  choice: മാംസത്തിൽ
  rationale: בשר എന്നത് അക്ഷരാർഥത്തിൽ ‘ജഡം/മാംസം’ എന്നാണ്; ഇവിടെ യാഗമൃഗത്തിന്റെ ഭക്ഷ്യമായ മാംസത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മാംസം’ സന്ദർഭോചിതമാണ്.
- source_word: וּבַלָּחֶם
  choice: അപ്പത്തിലും
  rationale: לחם എന്ന സാധാരണ പദത്തിന് ‘അപ്പം’ എന്നതാണ് സ്വാഭാവിക മലയാള തർജമ; മുൻപുള്ള സമാന്തര ഘടനയും ‘-ലും’ നിലനിർത്തുന്നു.
- source_word: בָּאֵשׁ
  choice: തീയിൽ
  rationale: ב എന്ന ഉപസർഗം ഇവിടെ ദഹനം നടക്കുന്ന മാധ്യമമോ മേഖലയോ സൂചിപ്പിക്കുന്നു; ‘തീയിൽ’ എബ്രായ പ്രയോഗത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: תִּשְׂרֹפוּ
  choice: നിങ്ങൾ ചുട്ടുകളയണം
  rationale: രണ്ടാം പുരുഷ ബഹുവചന അപൂർണ്ണക്രിയ നിയമപരമായ നിർദേശബലം വഹിക്കുന്നു; ‘ചുട്ടുകളയണം’ നിർബന്ധസ്വഭാവവും പൂർണമായി ദഹിപ്പിക്കണമെന്ന സന്ദർഭാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
