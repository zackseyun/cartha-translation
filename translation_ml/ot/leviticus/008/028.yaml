  to: പിന്നെ മോശെ അവ അവരുടെ കൈപ്പത്തികളിൽനിന്ന് എടുത്ത് യാഗപീഠത്തിൽ, ഹോമയാഗത്തിന്മേൽ ദഹിപ്പിച്ചു. അവ പുരോഹിതപ്രതിഷ്ഠാവഴിപാടുകളായിരുന്നു[a], പ്രസാദകരമായ സൗരഭ്യമായി; അത് യഹോവയ്ക്കുള്ള അഗ്നിവഴിപാടായിരുന്നു[b].
