source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֹתָ/ם֙ מֵ/עַ֣ל כַּפֵּי/הֶ֔ם וַ/יַּקְטֵ֥ר הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה מִלֻּאִ֥ים הֵם֙ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ml
  text: പിന്നെ മോശെ അവ അവരുടെ കൈപ്പത്തികളിൽനിന്ന് എടുത്ത് യാഗപീഠത്തിൽ, ഹോമയാഗത്തിന്മേൽ ദഹിപ്പിച്ചു. അവ പുരോഹിതപ്രതിഷ്ഠാവഴിപാടുകളായിരുന്നു[a], പ്രസാദകരമായ സൗരഭ്യമായി; അത് യഹോവയ്ക്കുള്ള അഗ്നിവഴിപാടായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സമർപ്പണവഴിപാട്.’ പുരോഹിതരെ സ്ഥാനമേൽപ്പിക്കുന്ന ആചാരത്തിൽ ഉപയോഗിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതികപദമാണ് എബ്രായത്തിലെ מִלֻּאִים.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യഹോവയ്ക്ക് അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന സാധാരണ ക്രിയയുടെ ആഖ്യാനരൂപം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: מֵעַל כַּפֵּיהֶם
  choice: അവരുടെ കൈപ്പത്തികളിൽനിന്ന്
  rationale: כַּפַּיִם എന്ന പദത്തിന്റെ ‘കൈപ്പത്തികൾ’ എന്ന കൃത്യമായ അർഥം ആചാരപരമായ പ്രവൃത്തിയുടെ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: וַיַּקְטֵר הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിൽ ദഹിപ്പിച്ചു
  rationale: ബലിവസ്തു പുകയായി ഉയരത്തക്കവിധം യാഗപീഠത്തിൽ കത്തിക്കുന്ന ആചാരപ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: עַל הָעֹלָה
  choice: ഹോമയാഗത്തിന്മേൽ
  rationale: עַל എന്നതിന്റെ സാധാരണ ‘മേൽ’ എന്ന ബന്ധവും עֹלָה എന്ന സാങ്കേതിക ബലിപദവും നിലനിർത്തുന്നു.
- source_word: מִלֻּאִים
  choice: പുരോഹിതപ്രതിഷ്ഠാവഴിപാട്
  rationale: പുരോഹിതരെ സ്ഥാനമേൽപ്പിക്കുന്ന ‘കൈ നിറയ്ക്കൽ’ ആചാരവുമായി ബന്ധപ്പെട്ട സാങ്കേതിക പദത്തിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുന്നു; പിന്നീട് രൂപപ്പെട്ട സഭാപദവികൾ ഇതിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യത്തിനായി
  rationale: ദൈവിക അംഗീകാരത്തെ സൂചിപ്പിക്കുന്ന ബലിസംബന്ധിയായ സ്ഥിരപ്രയോഗം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִשֶּׁה
  choice: അഗ്നിവഴിപാട്
  rationale: അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട് എന്ന സാങ്കേതിക അർഥം സംക്ഷിപ്തമായി നൽകുകയും עֹלָה എന്ന ‘ഹോമയാഗം’ എന്ന പദവുമായി കലരാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: വ്യക്തിനാമമായ יהוהയെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: מִלֻּאִים എന്ന പുരോഹിതാചാര സാങ്കേതികപദത്തിന്റെ വിവർത്തനം
  choice: പുരോഹിതപ്രതിഷ്ഠാവഴിപാട്
  alternative: സമർപ്പണവഴിപാട്
  rationale: സന്ദർഭം അഹരോനെയും പുത്രന്മാരെയും പുരോഹിതസ്ഥാനത്ത് പ്രതിഷ്ഠിക്കുന്ന ആചാരമാണ്. ‘പുരോഹിതപ്രതിഷ്ഠ’ ആ പ്രത്യേക പ്രവർത്തനം വ്യക്തമാക്കുന്നു; ‘സമർപ്പണം’ വിശാലമായ മറ്റൊരു സാധുവായ വായനയായി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: אִשֶּׁה എന്ന ബലിസാങ്കേതികപദത്തിന്റെ വിവർത്തനം
  choice: അഗ്നിവഴിപാട്
  alternative: അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട്
  rationale: ‘അഗ്നിവഴിപാട്’ മൂലപദത്തിന്റെ അഗ്നിസംബന്ധം കാത്തുസൂക്ഷിക്കുന്നു. അതിനെ ‘ഹോമയാഗം’ എന്നു പരിഭാഷപ്പെടുത്താത്തത് ഈ വാക്യത്തിൽ വേറിട്ടു വരുന്ന עֹלָהയുമായുള്ള പദവ്യത്യാസം നിലനിർത്താനാണ്.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു; ഒരു സ്ഥാനനാമംകൊണ്ട് അതിനെ മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ ശൈലി. ‘കൈപ്പത്തികൾ’ മൂലപാഠത്തിന്റെ ദൃശ്യകൃത്യതയും ‘അഗ്നിവഴിപാട്’ אִשֶּׁה-യും עֹלָה-യും തമ്മിലുള്ള സാങ്കേതിക വ്യത്യാസവും നിലനിർത്തുന്നു. അടിക്കുറിപ്പുസൂചകങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
