id: LEV.20.24
reference: Leviticus 20:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറഞ്ഞു: “നിങ്ങൾ അവരുടെ ദേശം കൈവശമാക്കും; അത് കൈവശമാക്കേണ്ടതിന് ഞാൻ തന്നെ നിങ്ങൾക്കു തരും”[a]—പാലും തേനും ഒഴുകുന്ന ദേശം.[b] ജനതകളിൽനിന്ന് നിങ്ങളെ വേർതിരിച്ച നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ[c] ഞാൻ ആകുന്നു.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങൾ അവരുടെ ദേശം അവകാശമാക്കും; അത് അവകാശമാക്കേണ്ടതിന് ഞാൻ തന്നെ നിങ്ങൾക്കു തരും.” എബ്രായത്തിലെ יָרַשׁ എന്ന ക്രിയയ്ക്ക് ‘അവകാശമാക്കുക’ എന്നും ‘കൈവശമാക്കുക’ എന്നും അർഥമാകാം.'
    reason: lexical_alternative
  - marker: b
    text: “പാലും തേനും ഒഴുകുന്ന ദേശം” എന്നത് സമൃദ്ധിയും ഫലഭൂയിഷ്ഠതയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: എബ്രായത്തിൽ YHWH; പരമ്പരാഗതമായി “കർത്താവ്” എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
  - marker: d
    text: 'അഥവാ: “ജനതകളിൽനിന്ന് നിങ്ങളെ വേറിട്ടുനിർത്തിയ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: എന്നാൽ ഞാൻ ... പറഞ്ഞു
  rationale: വാവ് ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നുവെങ്കിലും സന്ദർഭത്തിലെ വിലക്കുകളോടും വേർതിരിവുകളോടുമുള്ള വൈരുധ്യം ‘എന്നാൽ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: תִּירְשׁוּ / לָרֶשֶׁת
  choice: കൈവശമാക്കും / കൈവശമാക്കേണ്ടതിന്
  rationale: ירשׁ എന്ന ക്രിയയ്ക്ക് അവകാശമായി ലഭിക്കുക എന്നും കൈവശപ്പെടുത്തുക എന്നും അർഥമാകാം. ഭൂമിയോടുള്ള ഈ സന്ദർഭത്തിൽ ‘കൈവശമാക്കുക’ സജീവമായ ഉടമസ്ഥതയും ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: אַדְמָתָם
  choice: അവരുടെ ദേശം
  rationale: അക്ഷരാർഥത്തിൽ ‘നിലം/മണ്ണ്’ എന്നായാലും പ്രദേശം കൈവശമാക്കുന്ന സന്ദർഭത്തിൽ ‘ദേശം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וַאֲנִי
  choice: ഞാൻതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നൽ മലയാളത്തിൽ ‘ഞാൻതന്നെ’ എന്നു സംരക്ഷിക്കുന്നു.
- source_word: אֶתְּנֶנָּה
  choice: അതു നിങ്ങൾക്കു തരും
  rationale: പ്രത്യയത്തോടെ വന്ന נתן ദേശത്തെ ദൈവം നൽകുന്ന ദാനമായി അവതരിപ്പിക്കുന്നു; വാഗ്ദാനസന്ദർഭത്തിന് ഭാവികാലം യോജിക്കുന്നു.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: പാലും തേനും ഒഴുകുന്ന ദേശം
  rationale: സമൃദ്ധിയും ഫലഭൂയിഷ്ഠതയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള നാമരൂപത്തിൽ നൽകുന്നു.
- source_word: הִבְדַּלְתִּי
  choice: വേർതിരിച്ച
  rationale: בדל എന്നതിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുകയും അധ്യായത്തിലെ വിശുദ്ധി/വേർതിരിവ് പ്രമേയവുമായി ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הָעַמִּים
  choice: ജനതകൾ
  rationale: രാഷ്ട്രീയ രാഷ്ട്രങ്ങൾ എന്നതിലുപരി മനുഷ്യസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്ന עמים എന്ന ബഹുവചനത്തിന് ‘ജനതകൾ’ യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ നാമരൂപം നിലനിർത്തുന്നു.
- issue: മറ്റു ജനതകളിൽനിന്നുള്ള ഇസ്രായേലിന്റെ വ്യത്യസ്തത
  choice: ജനതകളിൽനിന്ന് നിങ്ങളെ വേർതിരിച്ച
  alternative: ജനതകളിൽനിന്ന് നിങ്ങളെ വേറിട്ടുനിർത്തിയ
  rationale: ദൈവം വരുത്തിയ വേർതിരിവ് മാത്രം പ്രസ്താവിച്ച് അതിനെ പിൽക്കാല സിദ്ധാന്തവിഭാഗങ്ങളിലൂടെ വികസിപ്പിക്കാതെ പാഠത്തിലെ ആശയസംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തിന്റെ ഊന്നൽ ‘ഞാൻതന്നെ’ എന്നു നിലനിർത്തി; ירשׁ എന്നതിലെ ‘അവകാശം/കൈവശം’ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യവാചകഭാഗത്തോടു ചേർത്തിരിക്കുന്നു.
