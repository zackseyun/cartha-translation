revisions:
- from: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറഞ്ഞു: “നിങ്ങൾ അവരുടെ ദേശം കൈവശമാക്കും; അതു കൈവശമാക്കേണ്ടതിന് ഞാൻതന്നെ അതു നിങ്ങൾക്കു തരും”[a]—പാലും തേനും ഒഴുകുന്ന ദേശം.[b] ജനതകളിൽനിന്ന് നിങ്ങളെ വേർതിരിച്ച യഹോവ[c] നിങ്ങളുടെ ദൈവം ഞാൻ ആകുന്നു.[d]'
  to: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറഞ്ഞു: “നിങ്ങൾ അവരുടെ ദേശം കൈവശമാക്കും; അത് കൈവശമാക്കേണ്ടതിന് ഞാൻ തന്നെ നിങ്ങൾക്കു തരും”[a]—പാലും തേനും ഒഴുകുന്ന ദേശം.[b] ജനതകളിൽനിന്ന് നിങ്ങളെ വേർതിരിച്ച നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ[c] ഞാൻ ആകുന്നു.[d]'
  rationale: ദൈവനാമം POBയുടെ നിശ്ചിത ‘Yahweh’ രൂപത്തിന് അനുസരിച്ച് ‘യാഹ്‌വേ’ എന്നു തിരുത്തി. ആവർത്തിച്ച കർമസൂചനയും ‘ഞാൻതന്നെ’ എന്ന സംയുക്തരൂപവും സ്വാഭാവിക ആധുനിക മലയാളത്തിനായി മിനുക്കി. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങളോടുതന്നെ ചേർത്ത്, എല്ലാ അർഥപരമായ വ്യത്യാസങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
