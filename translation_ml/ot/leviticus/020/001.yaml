  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വേ മോശയോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ דבר എന്ന ക്രിയയുടെ പീയേൽ രൂപം പുതിയ ദൈവിക പ്രസംഗഘടകത്തെ പരിചയപ്പെടുത്തുന്നു. ഈ സൂത്രവാക്യത്തിൽ ‘സംസാരിച്ചു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל
  choice: -ഓടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പൂർവപ്രത്യയം മലയാളത്തിൽ ‘മോശയോടു’ എന്ന ബന്ധപ്രത്യയരൂപത്തിൽ സ്വാഭാവികമായി വരുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ഈ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന വാക്കുകൾ അവതരിപ്പിക്കുന്ന ദ്വിബിന്ദു
  rationale: എബ്രായത്തിലെ പതിവ് പ്രസംഗപരിചയപ്പെടുത്തൽ പദം അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്നു നൽകാമെങ്കിലും, ആധുനിക മലയാളത്തിൽ ദ്വിബിന്ദു അതിന്റെ പ്രവർത്തനം കൂടുതൽ സ്വാഭാവികമായി നിർവഹിക്കുകയും അടുത്ത വാക്യത്തിൽ പ്രസംഗം തുടരുന്നതു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ, സാധാരണ പണ്ഡിതീയ പുനർനിർമാണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. എബ്രായ സൂത്രവാക്യത്തിന്റെ പ്രസംഗപരിചയപ്പെടുത്തൽ പ്രവർത്തനം നിലനിർത്തിക്കൊണ്ട്, לֵאמֹר എന്നത് അസ്വാഭാവികമായി ആവർത്തിക്കാതെ ദ്വിബിന്ദുവിലൂടെ പ്രകടിപ്പിച്ചു.
