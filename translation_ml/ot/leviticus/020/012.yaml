  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת כַּלָּת֔/וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵי/הֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: ml
  text: ഒരു പുരുഷൻ തന്റെ മരുമകളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടാൽ, അവർ ഇരുവരും തീർച്ചയായും വധിക്കപ്പെടണം. അവർ നിന്ദ്യമായ ഒരു പ്രവൃത്തി ചെയ്തിരിക്കുന്നു[a]; അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കലക്കം,’ ‘ക്രമവിരുദ്ധമായ പ്രവൃത്തി,’ അല്ലെങ്കിൽ ‘അതിക്രമം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന תֶּבֶל (തേവെൽ) എന്ന എബ്രായപദം ഈ നിയമസന്ദർഭത്തിൽ ധാർമികമായി ക്രമം തെറ്റിയതോ നിന്ദ്യമായതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെ രക്തക്കുറ്റം അവരുടെമേലാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം. അവരുടെ മരണത്തിനുള്ള ഉത്തരവാദിത്വം അവർക്കുതന്നെയാണെന്ന് ഈ എബ്രായ ശൈലി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ഒരു പുരുഷൻ … എങ്കിൽ
  rationale: നിയമപരമായ സോപാധിക വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; אִישׁ എന്ന പുല്ലിംഗ ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: יִשְׁכַּב אֶת
  choice: ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടാൽ
  rationale: ഈ സന്ദർഭത്തിൽ שׁכב אֶת ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്. അക്ഷരാർഥത്തിലുള്ള ‘കൂടെ കിടക്കുക’ എന്നതിലുണ്ടാകാവുന്ന അവ്യക്തത ഒഴിവാക്കി അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כַּלָּתוֹ
  choice: തന്റെ മരുമകളുമായി
  rationale: כַּלָּה ഇവിടെ മകന്റെ ഭാര്യയെയാണ് സൂചിപ്പിക്കുന്നത്; ആ ബന്ധത്തിന് സാധാരണ ആധുനിക മലയാളത്തിലുള്ള പദം ‘മരുമകൾ’ ആണ്.
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: അവർ ഇരുവരും തീർച്ചയായും വധിക്കപ്പെടണം
  rationale: ക്രിയയുടെ ഊന്നൽ നൽകുന്ന infinitive absolute + finite verb ഘടനയും ശിക്ഷാവിധിയുടെ നിഷ്ക്രിയരൂപവും ‘തീർച്ചയായും വധിക്കപ്പെടണം’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: תֶּבֶל עָשׂוּ
  choice: അവർ ചെയ്തത് ഒരു വികൃതമായ പ്രവൃത്തിയാണ്
  rationale: תֶּבֶל സൂചിപ്പിക്കുന്ന ധാർമികമായി ക്രമവിരുദ്ധവും നിന്ദ്യവുമായ പ്രവൃത്തിയെ വായനാസൗകര്യമുള്ള മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; പദത്തിന്റെ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: דְּמֵיהֶם בָּם
  choice: അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്
  rationale: കുറ്റക്കാർ സ്വന്തം മരണത്തിന് ഉത്തരവാദികളാണെന്ന് സൂചിപ്പിക്കുന്ന എബ്രായ നിയമപ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിയമത്തിലെ ലിംഗനിർദ്ദേശം
  choice: אִישׁ എന്നത് ‘ഒരു പുരുഷൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഒരാൾ’
  rationale: ഈ നിയമത്തിൽ പരാമർശിക്കപ്പെടുന്ന ആദ്യ വ്യക്തി പുരുഷനാണ്; ഉറവിടത്തിലെ ലിംഗനിർദ്ദേശം പൊതുവാക്കാതെ നിലനിർത്തുന്നു.
- issue: תֶּבֶל എന്ന പദത്തിന്റെ ധാർമിക വിലയിരുത്തൽ
  choice: ‘വികൃതമായ പ്രവൃത്തി’
  alternative: ‘കലക്കം’, ‘നിന്ദ്യമായ പ്രവൃത്തി’, ‘അതിക്രമം’
  rationale: മൂലപാഠം തന്നെയുള്ള ശക്തമായ ധാർമിക അപലപനം നിലനിർത്തുന്നു; എന്നാൽ ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക പദാവലി ചേർക്കുന്നില്ല.
- issue: דְּמֵיהֶם בָּם എന്ന രക്തപ്രയോഗം
  choice: ‘അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘സ്വന്തം മരണത്തിന്റെ കുറ്റം അവർക്കുതന്നെയാണ്’
  rationale: മരണശിക്ഷയുടെ ഉത്തരവാദിത്വം കുറ്റക്കാരിൽ തന്നെയാണെന്ന ആശയം ഉൾക്കൊള്ളുന്നുവെങ്കിലും, രൂപകത്തെ വിശദീകരണമായി മാത്രം മാറ്റാതെ മൂലത്തിലെ ദൈവശാസ്ത്ര-നിയമപരമായ ഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ലൈംഗികക്രിയയെക്കുറിച്ചുള്ള എബ്രായ പ്രയോഗം തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ വ്യക്തമായി പരിഭാഷപ്പെടുത്തി; ശിക്ഷാവിധിയുടെ ഊന്നലും രക്തത്തെക്കുറിച്ചുള്ള മൂലരൂപകവും നിലനിർത്തി.
