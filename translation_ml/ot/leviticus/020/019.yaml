source:
  edition: WLC
  text: וְ/עֶרְוַ֨ת אֲח֧וֹת אִמְּ/ךָ֛ וַ/אֲח֥וֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה כִּ֧י אֶת שְׁאֵר֛/וֹ הֶעֱרָ֖ה עֲוֺנָ֥/ם יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: ml
  text: നിന്റെ അമ്മയുടെ സഹോദരിയുടെയോ അപ്പന്റെ സഹോദരിയുടെയോ നഗ്നത നീ അനാവൃതമാക്കരുത്; കാരണം, അവൻ തന്റെ അടുത്ത രക്തബന്ധുവിന്റെ നഗ്നത അനാവൃതമാക്കിയിരിക്കുന്നു[a]. അവർ തങ്ങളുടെ അകൃത്യം വഹിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ തന്റെ അടുത്ത രക്തബന്ധുവിനെ അനാവൃതമാക്കിയിരിക്കുന്നു” അല്ലെങ്കിൽ “തന്റെ ബന്ധുവിനെ നഗ്നമാക്കിയിരിക്കുന്നു.” ഹീബ്രുവിലെ പദം അക്ഷരാർഥത്തിൽ “അവന്റെ മാംസം” എന്നാണ്; ഇവിടെ അത് അടുത്ത രക്തബന്ധുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “തങ്ങളുടെ അകൃത്യം വഹിക്കും” എന്നതിന് “തങ്ങളുടെ കുറ്റബാധ്യത വഹിക്കും” എന്നോ “തങ്ങളുടെ അകൃത്യത്തിനുള്ള ശിക്ഷ അനുഭവിക്കും” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: നഗ്നത നീ അനാവൃതമാക്കരുത്
  rationale: ലേവ്യപുസ്തകത്തിലെ ലൈംഗിക വിലക്കുകളിൽ കാണുന്ന ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന നിയമപരമായ പ്രയോഗശൈലി നിലനിർത്തുന്നു; അതിനെ നേരിട്ട് ‘ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുക’ എന്നു വ്യാഖ്യാനിച്ച് മൂലത്തിലെ രൂപകം ഇല്ലാതാക്കുന്നില്ല.
- source_word: אֲחוֹת אִמְּךָ וַאֲחוֹת אָבִיךָ
  choice: നിന്റെ അമ്മയുടെ സഹോദരിയുടെയോ അപ്പന്റെ സഹോദരിയുടെയോ
  rationale: മൂലത്തിലെ ബന്ധുത്വപദങ്ങൾ നേരിട്ട് അവതരിപ്പിക്കുന്നു. നിഷേധവാക്യത്തിന്റെ പരിധിയിൽ രണ്ടു ബന്ധങ്ങളെയും വേർതിരിച്ചു വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘-യുടെയോ ... -യുടെയോ’ സ്വാഭാവികമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: വിലക്കിനുള്ള വിശദീകരണകാരണം അവതരിപ്പിക്കുന്ന ഹീബ്രു ബന്ധകത്തിന്റെ ശക്തി വ്യക്തമായി നൽകുന്നു.
- source_word: שְׁאֵרוֹ
  choice: തന്റെ സ്വന്തം മാംസത്തെ
  rationale: അടുത്ത രക്തബന്ധുവിനെ സൂചിപ്പിക്കുന്ന ‘മാംസം’ എന്ന ഹീബ്രു ബന്ധുത്വരൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; അർത്ഥവ്യക്തതയ്ക്കായി അടിക്കുറിപ്പ് നൽകുന്നു.
- source_word: הֶעֱרָה
  choice: തുറന്നുകാട്ടിയിരിക്കുന്നു
  rationale: ‘നഗ്നമാക്കുക/വെളിപ്പെടുത്തുക’ എന്ന അർത്ഥം നൽകുന്നു; മുമ്പുള്ള ‘അനാവൃതമാക്കുക’ എന്ന പദം അനാവശ്യമായി ആവർത്തിക്കാതെയും ലൈംഗിക-നിയമപരമായ സന്ദർഭം നിലനിർത്തിയും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: അവർ തങ്ങളുടെ അകൃത്യം വഹിക്കണം
  rationale: പാപം, കുറ്റബാധ്യത, അതിന്റെ പരിണതി എന്നിവ ഉൾക്കൊള്ളാവുന്ന ഹീബ്രു സംക്ഷിപ്തപ്രയോഗം അതേ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിശദീകരണഭാഗത്തിലെ ഏകവചനത്തിൽനിന്ന് ശിക്ഷാവാക്യത്തിലെ ബഹുവചനത്തിലേക്കുള്ള മാറ്റം
  choice: ‘അവൻ ... തുറന്നുകാട്ടിയിരിക്കുന്നു; അവർ ... വഹിക്കണം’ എന്ന മാറ്റം നിലനിർത്തി.
  alternative: എല്ലാം ബഹുവചനമാക്കി ‘അവർ തങ്ങളുടെ സ്വന്തം മാംസത്തെ തുറന്നുകാട്ടിയിരിക്കുന്നു’ എന്നു സമീകരിക്കുക.
  rationale: שְׁאֵרוֹ/הֶעֱרָה എന്ന ഏകവചനത്തിനും עֲוֺנָם יִשָּׂאוּ എന്ന ബഹുവചനത്തിനും ഇടയിലെ മൂലപാഠത്തിന്റെ യഥാർഥ സംഘർഷം മറച്ചുവയ്ക്കുന്നില്ല; പ്രവൃത്തിയെ പുരുഷകർത്താവിന്റെ ദൃഷ്ടിയിൽ വിവരിച്ചശേഷം ഇരുവരുടെയും ബാധ്യത പറയുന്നതായിരിക്കാം.
- issue: ലൈംഗികമായ പരോക്ഷപ്രയോഗം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ എന്നത്
  choice: ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന മൂലപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്’ എന്നു തുറന്നുപറയുക.
  rationale: വിശുദ്ധിനിയമത്തിലെ ആവർത്തിത നിയമഭാഷയും അന്തർപാഠബന്ധവും സംരക്ഷിക്കുന്നു; വ്യാഖ്യാനപരമായ വികസനം മൂലപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. ‘അമ്മ’, ‘അപ്പൻ’ എന്നീ സാധാരണ ബന്ധുത്വപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന ഔപചാരികമായി നിലനിർത്തി. മൂലത്തിലെ പരോക്ഷ ലൈംഗികപ്രയോഗവും ഏകവചന-ബഹുവചന മാറ്റവും സംരക്ഷിച്ചു.
