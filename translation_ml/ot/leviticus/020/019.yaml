revisions:
- from: നിന്റെ അമ്മയുടെ സഹോദരിയുടെയോ അപ്പന്റെ സഹോദരിയുടെയോ നഗ്നത നീ അനാവൃതമാക്കരുത്; കാരണം, അവൻ തന്റെ സ്വന്തം മാംസത്തെ തുറന്നുകാട്ടിയിരിക്കുന്നു[a]. അവർ തങ്ങളുടെ അകൃത്യം വഹിക്കണം[b].
