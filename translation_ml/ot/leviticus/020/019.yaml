review_pass:
  verdict: revise
  source_fidelity: The draft preserves the Hebrew legal idiom in the prohibition and correctly retains the source text’s singular-to-plural shift. However, «തന്റെ സ്വന്തം മാംസത്തെ തുറന്നുകാട്ടിയിരിക്കുന്നു» is liable in Malayalam to mean exposing one’s own physical body, whereas שְׁאֵרוֹ here denotes one’s close blood relative/kin. The revised wording supplies the necessary kinship sense without specifying a mode of sexual conduct beyond the Hebrew legal idiom.
  naturalness: The opening legal formulation is clear and suitably formal. The revised explanatory clause is more idiomatic and semantically intelligible in modern standard Malayalam. «വഹിക്കും» better reflects the Hebrew legal imperfect than the modal «വഹിക്കണം».
  terminology: «നഗ്നത ... അനാവൃതമാക്കുക» appropriately preserves the recurring Levitical euphemism. «അടുത്ത രക്തബന്ധു» accurately conveys שְׁאֵר in context. «അകൃത്യം വഹിക്കും» retains the deliberate breadth of עָוֹן/נשא, with penal liability left to the footnote.
  issues:
  - severity: medium
    issue: The explanatory clause translates «his own flesh» in a way that Malayalam normally understands as the offender’s own body.
    rationale: In this context שְׁאֵרוֹ means his close kin or blood relative, not his literal body. The present wording obscures the rationale and can suggest that he exposed himself.
  - severity: low
    issue: The penalty is rendered with «വഹിക്കണം» (‘must bear’) rather than a legal future.
    rationale: יִשָּׂאוּ is a Hebrew imperfect in a penalty formula. «വഹിക്കും» is more natural in Malayalam legal-prophetic register while preserving the source’s unstated mode of consequence.
  revised_text: നിന്റെ അമ്മയുടെ സഹോദരിയുടെയോ അപ്പന്റെ സഹോദരിയുടെയോ നഗ്നത നീ അനാവൃതമാക്കരുത്; കാരണം, അവൻ തന്റെ അടുത്ത രക്തബന്ധുവിന്റെ നഗ്നത അനാവൃതമാക്കിയിരിക്കുന്നു[a]. അവർ തങ്ങളുടെ അകൃത്യം വഹിക്കും[b].
