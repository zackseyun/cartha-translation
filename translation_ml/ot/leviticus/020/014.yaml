language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: ml
  text: ഒരു പുരുഷൻ ഒരു സ്ത്രീയെയും അവളുടെ അമ്മയെയും സ്വീകരിച്ചാൽ[a], അത് നീചകൃത്യമാണ്[c]. അവർ അവനെയും ആ രണ്ടു സ്ത്രീകളെയും തീയിൽ ചുട്ടുകളയണം[b]; അങ്ങനെ നിങ്ങളുടെ ഇടയിൽ നീചകൃത്യം ഉണ്ടാകാതിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു സ്ത്രീയെയും അവളുടെ അമ്മയെയും വിവാഹം ചെയ്താൽ.’ ‘സ്വീകരിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായക്രിയ നിയമസന്ദർഭങ്ങളിൽ വിവാഹത്തെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ വിവാഹം എന്നത് വ്യക്തമായി പറഞ്ഞിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘ആ രണ്ടു സ്ത്രീകളെയും’ എന്നത് ആ സ്ത്രീയെയും അവളുടെ അമ്മയെയും സൂചിപ്പിക്കുന്നു.
    reason: referent_clarification
  - marker: c
    text: ‘നീചകൃത്യം’ എന്നതിനുള്ള എബ്രായപദം കടുത്ത ലൈംഗികകുറ്റത്തെ സൂചിപ്പിക്കുന്നു; ‘ദുഷ്കൃത്യം,’ ‘അശ്ലീലകൃത്യം,’ ‘വെറുപ്പുളവാക്കുന്ന പ്രവൃത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: എബ്രായപദം വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണ്; ഈ നിയമത്തിൽ കുറ്റം ചെയ്യുന്ന പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יִקַּח
  choice: സ്വീകരിച്ചാൽ
  rationale: לקח എന്നതിന് അടിസ്ഥാനമായി ‘എടുക്കുക/സ്വീകരിക്കുക’ എന്നാണ് അർഥം; ഈ നിയമസന്ദർഭത്തിൽ വിവാഹമോ ലൈംഗികബന്ധമോ സൂചിപ്പിക്കാമെങ്കിലും വിവാഹം എന്ന് മാത്രം നിർണ്ണയിക്കാതെ മൂലപാഠത്തിലെ വിശാലത നിലനിർത്തുന്നു.
- source_word: אִשָּׁה
  choice: ഒരു സ്ത്രീ
  rationale: ഈ പദത്തിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. വിവാഹസ്ഥിതി മൂലപാഠം വ്യക്തമായി നിർണ്ണയിക്കാത്തതിനാൽ കൂടുതൽ വിശാലമായ ‘സ്ത്രീ’ സ്വീകരിച്ചു.
- source_word: אִמָּהּ
  choice: അവളുടെ അമ്മ
  rationale: മുമ്പ് പറഞ്ഞ സ്ത്രീയോടുള്ള അമ്മയുടെ ബന്ധം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള ഉടമസ്ഥരൂപമാണിത്.
- source_word: זִמָּה
  choice: നീചകൃത്യം
  rationale: ലേവ്യപുസ്തകത്തിലെ ലൈംഗികനിയമങ്ങളിൽ ഈ പദം കടുത്ത ധാർമികവികൃതിയോ വെറുപ്പുളവാക്കുന്ന ലൈംഗികകുറ്റമോ സൂചിപ്പിക്കുന്നു. ‘നീചകൃത്യം’ അതിന്റെ പ്രവൃത്തിസ്വഭാവവും ഗുരുത്വവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בָּאֵשׁ
  choice: തീയിൽ
  rationale: ശിക്ഷ നടപ്പാക്കുന്ന മാധ്യമം തീയാണെന്ന് ലളിതമായും മൂലപാഠത്തോട് അടുത്തും വ്യക്തമാക്കുന്നു.
- source_word: יִשְׂרְפוּ אֹתוֹ וְאֶתְהֶן
  choice: അവനെയും അവരിരുവരെയും തീയിൽ ചുട്ടുകളയണം
  rationale: എബ്രായത്തിലെ ബഹുവചന കർത്തൃപ്രയോഗവും വ്യക്തമായ കർമങ്ങളും നിലനിർത്തുന്നു. ‘അവരിരുവരെയും’ എന്നത് സ്ത്രീയെയും അവളുടെ അമ്മയെയും വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: അങ്ങനെ നിങ്ങളുടെ ഇടയിൽ നീചകൃത്യം ഉണ്ടാകാതിരിക്കട്ടെ
  rationale: ശിക്ഷയുടെ ലക്ഷ്യഫലം വ്യക്തമാക്കുകയും בְּתוֹכְכֶם എന്നതിനെ സ്വാഭാവികമായി ‘നിങ്ങളുടെ ഇടയിൽ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഒരു സ്ത്രീയെയും അവളുടെ അമ്മയെയും സ്വീകരിക്കുക’ എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: വിവാഹം എന്ന് നിർണ്ണയിക്കാതെ ‘സ്വീകരിച്ചാൽ’ എന്നു വിശാലമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഒരു സ്ത്രീയെയും അവളുടെ അമ്മയെയും വിവാഹം ചെയ്താൽ’ അല്ലെങ്കിൽ ‘ഭാര്യമാരായി സ്വീകരിച്ചാൽ’.
  rationale: לקח നിയമസന്ദർഭങ്ങളിൽ വിവാഹത്തെ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ പ്രത്യേക വിവാഹപദം ഇല്ല. അതിനാൽ ബന്ധത്തെ അനാവശ്യമായി ചുരുക്കാതെ മൂലപാഠത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തി.
- issue: ശിക്ഷാവാക്യത്തിന്റെ വ്യാകരണരൂപം
  choice: ‘അവനെയും അവരിരുവരെയും തീയിൽ ചുട്ടുകളയണം’ എന്ന സജീവ നിയമനിർദേശം.
  alternative: ‘അവനും അവരിരുവരും തീയിൽ ചുട്ടുകളയപ്പെടണം’ എന്ന കർമണിപ്രയോഗം.
  rationale: മൂലപാഠത്തിലെ ക്രിയ സജീവ ബഹുവചനത്തിലാണ്. ശിക്ഷ നടപ്പാക്കുന്നവരെ പ്രത്യേകം തിരിച്ചറിയിക്കാതെ ആ നിയമരൂപം കഴിയുന്നത്ര നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ‘പരിഗ്രഹിക്കുക’ പോലുള്ള പഴയതും വിവാഹാർഥം മുൻകൂട്ടി നിർണ്ണയിക്കുന്നതുമായ പദം ഒഴിവാക്കി; ‘സ്വീകരിക്കുക’ എന്നതിലൂടെ മൂലപാഠത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തി. ശിക്ഷയുടെ കാഠിന്യം മയപ്പെടുത്താതെയും മൂലപാഠം പറയാത്ത നടപടിക്രമവിശദാംശങ്ങൾ ചേർക്കാതെയും പരിഭാഷപ്പെടുത്തി.
