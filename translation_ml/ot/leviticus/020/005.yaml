  text: וְ/שַׂמְתִּ֨י אֲנִ֧י אֶת פָּנַ֛/י בָּ/אִ֥ישׁ הַ/ה֖וּא וּ/בְ/מִשְׁפַּחְתּ֑/וֹ וְ/הִכְרַתִּ֨י אֹת֜/וֹ וְ/אֵ֣ת כָּל הַ/זֹּנִ֣ים אַחֲרָ֗י/ו לִ/זְנ֛וֹת אַחֲרֵ֥י הַ/מֹּ֖לֶךְ מִ/קֶּ֥רֶב עַמָּֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: ml
  text: ഞാൻ തന്നേ ആ മനുഷ്യനും അവന്റെ കുടുംബത്തിനും എതിരായി എന്റെ മുഖം തിരിക്കും; അവനെയും, അവന്റെ പിന്നാലെ പോയി മോലെക്കിന്റെ പിന്നാലെ വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുന്നവരെയെല്ലാം[a], അവരുടെ ജനത്തിന്റെ മധ്യേനിന്ന് ഛേദിച്ചുകളയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുക’ എന്നത് ലൈംഗിക അവിശ്വസ്തതയെ സൂചിപ്പിക്കുന്ന എബ്രായ ക്രിയയുടെ രൂപകപ്രയോഗമാണ്; വിഗ്രഹാരാധനയിലൂടെ ദൈവത്തോടുള്ള ഉടമ്പടിയിൽ അവിശ്വസ്തരാകുന്നതിനെ അത് ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഛേദിച്ചുകളയും’ എന്നത് ഉടമ്പടി ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ഇത് മരണം, സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കൽ, അല്ലെങ്കിൽ ദൈവം നീക്കിക്കളയുന്ന മറ്റൊരു വിധം എന്നിവയിൽ ഏതാണ് എന്ന് ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: ഞാൻതന്നെ ... എതിരായി എന്റെ മുഖം തിരിക്കും
  rationale: മുഖം ഒരാൾക്കെതിരായി തിരിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൈവിക എതിർപ്പിന്റെയും ന്യായവിധിയുടെയും ശക്തി നിലനിർത്തുന്നു; אֲנִי നൽകുന്ന ഊന്നൽ ‘ഞാൻതന്നെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: בָּאִישׁ הַהוּא וּבְמִשְׁפַּחְתּוֹ
  choice: ആ മനുഷ്യനും അവന്റെ കുടുംബത്തിനും എതിരായി
  rationale: אִישׁ എന്ന ഏകവചന പുല്ലിംഗരൂപം ‘മനുഷ്യൻ’ എന്നു നിലനിർത്തുന്നു. מִשְׁפָּחָה ഇവിടെ കുടുംബത്തെയോ വിശാല ബന്ധുഗണത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും, ആ അർത്ഥവ്യാപ്തി സ്വാഭാവികമായി വഹിക്കുന്ന ‘കുടുംബം’ തിരഞ്ഞെടുത്തു.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: അവനെ ... ഛേദിച്ചുകളയും
  rationale: നിയമ-ഉടമ്പടി സന്ദർഭത്തിലെ כרת എന്ന ന്യായവിധിപ്രയോഗത്തിന്റെ രൂപകം സംരക്ഷിക്കുന്നു; മരണമാണ്, പുറത്താക്കലാണ്, മറ്റൊരു ദൈവിക നീക്കലാണ് എന്നത് മുഖ്യവാചകത്തിൽ നിർണയിക്കുന്നില്ല.
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: അവന്റെ പിന്നാലെ പോയി മോലെക്കിന്റെ പിന്നാലെ വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുന്ന എല്ലാവരെയും
  rationale: זנה ഉപയോഗിക്കുന്ന ലൈംഗിക അവിശ്വസ്തതയുടെ രൂപകം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു. אַחֲרָיו, אַחֲרֵי എന്നീ ആവർത്തനങ്ങളും യഥാക്രമം ‘അവന്റെ പിന്നാലെ’, ‘മോലെക്കിന്റെ പിന്നാലെ’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הַמֹּלֶךְ
  choice: മോലെക്ക്
  rationale: ഈ സന്ദർഭത്തിൽ ദേവനാമമായി മനസ്സിലാക്കപ്പെടുന്ന രൂപം മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു; നിർവചനോപപദം പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയില്ല.
- source_word: מִקֶּרֶב עַמָּם
  choice: അവരുടെ ജനത്തിന്റെ മധ്യേനിന്ന്
  rationale: സമൂഹത്തിനുള്ളിൽനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം നിലനിർത്തുന്നു. עַמָּם എന്ന ബഹുവചന പ്രത്യയം ‘അവനെയും ... എല്ലാവരെയും’ എന്ന സംയുക്ത കർമവുമായി യോജിക്കുന്നതിനാൽ ‘അവരുടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: വിഗ്രഹാരാധനയ്ക്കുള്ള ലൈംഗിക അവിശ്വസ്തതയുടെ രൂപകം
  choice: ‘വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുന്ന’ എന്ന രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
  alternative: ‘അവിശ്വസ്തരാകുന്ന’ അല്ലെങ്കിൽ ‘വിഗ്രഹാരാധന ചെയ്യുന്ന’
  rationale: എബ്രായം ഉടമ്പടി അവിശ്വസ്തതയെ മനപ്പൂർവം ലൈംഗികമായി ശക്തമായ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു. പൊതുവായ ‘അവിശ്വസ്തത’ എന്നാക്കി മയപ്പെടുത്തുന്നത് വാചകത്തിന്റെ ആലങ്കാരിക-ദൈവശാസ്ത്ര ശക്തി നഷ്ടപ്പെടുത്തും.
- issue: ഉടമ്പടി ന്യായവിധിയിലെ ‘ഛേദിക്കുക’ എന്നതിന്റെ കൃത്യമായ ഫലം
  choice: ‘ഛേദിച്ചുകളയും’ എന്നു നിലനിർത്തി; നടപടിയുടെ കൃത്യരൂപം അടിക്കുറിപ്പിൽ തുറന്നുവച്ചു.
  alternative: ‘കൊന്നുകളയും’, ‘സമൂഹത്തിൽനിന്ന് പുറത്താക്കും’, അല്ലെങ്കിൽ ‘നശിപ്പിക്കും’
  rationale: ഈ വാക്യം ദൈവിക ന്യായവിധി പ്രഖ്യാപിക്കുന്നുവെങ്കിലും അത് മരണമാണോ, പുറത്താക്കലാണോ, മറ്റേതെങ്കിലും ദൈവിക നീക്കലാണോ എന്ന് ഇവിടെ വ്യക്തമാക്കുന്നില്ല. ഒരു വ്യാഖ്യാനം മാത്രം തിരഞ്ഞെടുത്ത് അനിശ്ചിതത്വം ഇല്ലാതാക്കുന്നത് ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘മുഖം എതിരായി തിരിക്കുക’, ‘ഛേദിച്ചുകളയുക’ എന്നീ മൂലഭാഷാ രൂപകങ്ങൾ അർത്ഥവ്യക്തതയോടെ നിലനിർത്തി; അപരിചിതമാകാവുന്ന ഉടമ്പടി-ന്യായവിധി പ്രയോഗം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തനവും ലൈംഗിക അവിശ്വസ്തതയുടെ ശക്തമായ രൂപകവും ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
