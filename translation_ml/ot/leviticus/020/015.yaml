id: LEV.20.15
reference: Leviticus 20:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִתֵּ֧ן שְׁכָבְתּ֛/וֹ בִּ/בְהֵמָ֖ה מ֣וֹת יוּמָ֑ת וְ/אֶת הַ/בְּהֵמָ֖ה תַּהֲרֹֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/015.yaml
  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: ml
  text: ഒരു പുരുഷൻ ഒരു മൃഗവുമായി ലൈംഗികവേഴ്ച നടത്തിയാൽ[a], അവനെ തീർച്ചയായും വധിക്കണം; ആ മൃഗത്തെയും നിങ്ങൾ കൊല്ലണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, ‘ഒരു മൃഗവുമായി തന്റെ ശയനം നൽകുന്നു’; ലൈംഗികവേഴ്ചയെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: ഇത് വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണ്; അടുത്ത വാക്യം സ്ത്രീയുടെ കാര്യം വേർതിരിച്ച് പറയുന്നതിനാൽ ഇവിടെ പുരുഷനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר
  choice: ഏർപ്പെട്ടാൽ
  rationale: പദശഃ ‘ആർ/അവൻ’ എന്ന ബന്ധസൂചകമായിരുന്നാലും, നിയമവ്യവസ്ഥയുടെ സന്ദർഭത്തിൽ സോപാധിക അർഥം സ്വാഭാവികമായി അറിയിക്കാൻ ‘-ആൽ’ പ്രയോഗിച്ചു.
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുക
  rationale: പദശഃ ‘തന്റെ കിടപ്പ് നൽകുക’ എന്ന എബ്രായ ശൈലി ലൈംഗികവേഴ്ചയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ അർഥം വ്യക്തവും മാന്യവുമായി അറിയിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: בִּבְהֵמָה
  choice: ഒരു മൃഗവുമായി
  rationale: בְּהֵמָה എന്നത് ഇവിടെ പൊതുവായി മൃഗത്തെ സൂചിപ്പിക്കുന്നു; ‘മൃഗവുമായി’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מוֹת יוּמָת
  choice: അവനെ നിശ്ചയമായും കൊല്ലണം
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന ഈ എബ്രായ ഘടന മരണശിക്ഷയുടെ ഉറപ്പും നിയമപരമായ നിർബന്ധവും ഊന്നിപ്പറയുന്നു.
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: ആ മൃഗത്തെയും നിങ്ങൾ കൊല്ലണം
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ക്രിയ നിലനിർത്തുകയും, മുൻപ് പരാമർശിച്ച മൃഗത്തെയും കൊല്ലണമെന്ന സമാന്തര നിർദേശം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കുറ്റക്കാരന്റെ ലിംഗനിർദേശം
  choice: പുരുഷനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്ന ‘ഒരു പുരുഷൻ’
  alternative: ലിംഗനിരപേക്ഷമായ ‘ഒരാൾ’
  rationale: മൂലപാഠത്തിലെ אִישׁ പുരുഷനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള വാക്യം സ്ത്രീയുടെ കാര്യം പ്രത്യേകം കൈകാര്യം ചെയ്യുന്നതിനാൽ ലിംഗനിരപേക്ഷ പരിഭാഷ പാഠത്തിന്റെ നിയമഘടന മങ്ങിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവും നിയമപരമായ ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ പുരുഷലിംഗ പ്രത്യേകതയും ഊന്നിയ മരണശിക്ഷാ പ്രയോഗവും രണ്ടാം പുരുഷ ബഹുവചന നിർദേശവും നിലനിർത്തി.
