id: LEV.20.18
reference: Leviticus 20:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: ml
  text: ഒരു പുരുഷൻ ആർത്തവ അശുദ്ധിയിലുള്ള ഒരു സ്ത്രീയോടുകൂടെ ശയിച്ച് അവളുടെ നഗ്നത അനാവൃതമാക്കുകയും, അവളുടെ ഉറവിടം തുറന്നുകാട്ടുകയും, അവൾ തന്റെ രക്തത്തിന്റെ ഉറവിടം അനാവൃതമാക്കുകയും ചെയ്താൽ, അവർ ഇരുവരും തങ്ങളുടെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടും.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾക്ക് ആർത്തവമുള്ളപ്പോൾ.” എബ്രായപദം ആർത്തവവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധിയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “അവൻ അവളുടെ ഉറവിടം തുറന്നുകാട്ടി; അവൾ തന്റെ രക്തത്തിന്റെ ഉറവിടം അനാവൃതമാക്കി.” ഇവിടെ “ഉറവിടം” ശരീരത്തിൽനിന്നുള്ള രക്തസ്രാവത്തെ സൂചിപ്പിക്കുന്ന സൗമ്യപ്രയോഗമാണ്.'
    reason: lexical_alternative
  - marker: c
    text: “ഛേദിക്കപ്പെടും” എന്നത് തോറായിലെ സ്ഥിരമായ നിയമപ്രയോഗമാണ്; ആ നീക്കം എങ്ങനെ നടപ്പാക്കപ്പെടുമെന്നത് ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: നിയമവാക്യത്തിലെ പുല്ലിംഗ ഏകവചനവും ലൈംഗികസന്ദർഭവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: ഒരു സ്ത്രീയോടുകൂടെ ശയിച്ച്
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നിയമപരവും മാന്യവുമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: דָּוָה
  choice: ആർത്തവാശുദ്ധിയിലുള്ള
  rationale: വെറും ആർത്തവാവസ്ഥ മാത്രമല്ല, ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ അശുദ്ധിസ്ഥിതിയും സൂചിപ്പിക്കുന്നു.
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: അവളുടെ നഗ്നത അനാവൃതമാക്കിയാൽ
  rationale: ലേവ്യപുസ്തകത്തിൽ ആവർത്തിക്കുന്ന ലൈംഗിക അനാവരണത്തിന്റെ സ്ഥിരപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: അവൻ അവളുടെ രക്തസ്രോതസ്സ് തുറന്നുകാട്ടുകയും
  rationale: മָקוֹר എന്ന ‘ഉറവിടം/സ്രോതസ്സ്’ രൂപകത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുകയും പ്രസക്തമായ രക്തസ്രാവസൂചന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: അവൾ തന്റെ രക്തത്തിന്റെ ഉറവിടം അനാവൃതമാക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: സ്ത്രീയുടെ പങ്കാളിത്തത്തെക്കുറിച്ചുള്ള സമാന്തരവാക്യവും ‘രക്തത്തിന്റെ ഉറവിടം’ എന്ന എബ്രായ രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: וְנִכְרְתוּ
  choice: ഛേദിക്കപ്പെടണം
  rationale: തോറായിലെ സ്ഥിരമായ ശിക്ഷാസൂത്രം ഔപചാരികമായി നിലനിർത്തുന്നു; ശിക്ഷ നടപ്പാക്കുന്ന വിധം വാക്യം നിർണ്ണയിക്കാത്തതിനാൽ അത് വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- source_word: מִקֶּרֶב עַמָּם
  choice: തങ്ങളുടെ ജനത്തിന്റെ ഇടയിൽനിന്ന്
  rationale: സമൂഹ-ഉടമ്പടി പശ്ചാത്തലം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: דָּוָה എന്ന പദത്തിലെ സ്ത്രീയുടെ അവസ്ഥ
  choice: ആർത്തവാശുദ്ധി
  alternative: ആർത്തവമുള്ളപ്പോൾ
  rationale: ലേവ്യനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ ഇത് സാധാരണ ശാരീരികാവസ്ഥയ്ക്കൊപ്പം ആചാരപരമായ അശുദ്ധിയെയും സൂചിപ്പിക്കുന്നു.
- issue: ‘ഛേദിക്കപ്പെടുക’ എന്ന ശിക്ഷയുടെ സ്വഭാവം
  choice: ശിക്ഷ നടപ്പാക്കുന്ന രീതി വ്യക്തമാക്കാതെ ഔപചാരിക പ്രയോഗം നിലനിർത്തി
  alternative: വധിക്കപ്പെടുക / സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടുക / സന്തതിയില്ലാതെ മരിക്കുക
  rationale: ഇവിടെ എബ്രായ വാക്യം ശിക്ഷയുടെ കൃത്യമായ രീതി നിർവചിക്കുന്നില്ല; തർക്കവിഷയമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള മാന്യവും നിയമപരവുമായ ശൈലി. ‘ശയിക്കുക,’ ‘നഗ്നത അനാവൃതമാക്കുക,’ ‘ഛേദിക്കപ്പെടുക’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ആവർത്തിത നിയമഭാഷയും യഥാർഥമായ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
