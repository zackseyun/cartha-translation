revisions:
- from: ഒരു പുരുഷൻ ആർത്തവാശുദ്ധിയിലുള്ള ഒരു സ്ത്രീയോടുകൂടെ ശയിച്ച് അവളുടെ നഗ്നത അനാവൃതമാക്കിയാൽ—അവൻ അവളുടെ രക്തസ്രോതസ്സ് തുറന്നുകാട്ടുകയും അവൾ തന്റെ രക്തത്തിന്റെ ഉറവിടം അനാവൃതമാക്കുകയും ചെയ്തിരിക്കുന്നു—അവർ ഇരുവരും തങ്ങളുടെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടണം.[a][b][c]
  to: ഒരു പുരുഷൻ ആർത്തവ അശുദ്ധിയിലുള്ള ഒരു സ്ത്രീയോടുകൂടെ ശയിച്ച് അവളുടെ നഗ്നത അനാവൃതമാക്കുകയും, അവളുടെ ഉറവിടം തുറന്നുകാട്ടുകയും, അവൾ തന്റെ രക്തത്തിന്റെ ഉറവിടം അനാവൃതമാക്കുകയും ചെയ്താൽ, അവർ ഇരുവരും തങ്ങളുടെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടും.[a][b][c]
  rationale: The revision resolves the Malayalam conditional/aspect inconsistency, maintains the Hebrew’s distinction between ‘her source’ and ‘the source of her blood,’ and uses a future legal formula for ‘shall be cut off’ without resolving its disputed implementation. Footnote anchors and their meanings are retained.
  reviewer_model: gpt-5.6-terra
