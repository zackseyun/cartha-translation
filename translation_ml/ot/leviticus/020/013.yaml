id: LEV.20.13
reference: Leviticus 20:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִשְׁכַּ֤ב אֶת זָכָר֙ מִשְׁכְּבֵ֣י אִשָּׁ֔ה תּוֹעֵבָ֥ה עָשׂ֖וּ שְׁנֵי/הֶ֑ם מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: ml
  text: ഒരു പുരുഷൻ സ്ത്രീയോടുകൂടെ ശയിക്കുന്നതുപോലെ ഒരു ആണിനോടുകൂടെ ശയിച്ചാൽ[a], അവർ ഇരുവരും അറപ്പുളവാക്കുന്ന കാര്യം ചെയ്തിരിക്കുന്നു. അവർ തീർച്ചയായും വധിക്കപ്പെടണം; അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘ഒരു സ്ത്രീയുടെ ശയനങ്ങൾ’; സ്ത്രീയുമായുള്ള ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അവരുടെ രക്തക്കുറ്റം അവരുടെമേലാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ഒരു പുരുഷൻ ... ചെയ്താൽ
  rationale: നിയമവാക്യത്തിലെ വ്യവസ്ഥാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ചെയ്താൽ’ എന്നു നൽകി; אִישׁ എന്നത് പ്രായപൂർത്തിയായ പുരുഷനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുരുഷൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יִשְׁכַּב אֶת
  choice: ഒരാളോടുകൂടെ ശയിക്കുക
  rationale: ഈ സന്ദർഭത്തിൽ ശׁכב ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന വ്യവഹാരപ്രയോഗമാണ്. ഉറവിടത്തിലെ രൂപകം നിലനിർത്തിക്കൊണ്ട് അർഥം ഗ്രഹിക്കാവുന്ന ഔപചാരിക മലയാളം തിരഞ്ഞെടുത്തു.
- source_word: זָכָר
  choice: ഒരു ആൺ
  rationale: זָכָר എന്നത് אִישׁ എന്ന ‘പുരുഷൻ’ എന്ന സാമൂഹിക/വയസ്സുസൂചക പദത്തിൽനിന്ന് വ്യത്യസ്തമായി ലിംഗത്തെ സൂചിപ്പിക്കുന്ന ‘ആൺ’ എന്നാണ്; മൂലത്തിലെ പദവ്യത്യാസം നിലനിർത്തി.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: സ്ത്രീയോടെന്നപോലെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു സ്ത്രീയുടെ ശയനങ്ങൾ’ എന്ന ബഹുവചനപ്രയോഗമാണെങ്കിലും, സ്ത്രീയുമായുള്ള ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമായതിനാൽ സ്വാഭാവികമായി നൽകി; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: תּוֹעֵבָה
  choice: മ്ലേച്ഛമായ കാര്യം
  rationale: നിയമ-നൈതിക സന്ദർഭത്തിലെ കടുത്ത അപലപനം നിലനിർത്തുന്നു; ആധുനിക വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ പദപ്രയോഗം.
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: അവർ ഇരുവരും ... ചെയ്തിരിക്കുന്നു
  rationale: പ്രവൃത്തിയിൽ ഇരുവർക്കുമുള്ള പങ്ക് മൂലപാഠം വ്യക്തമായി ഊന്നുന്നതിനാൽ ‘ഇരുവരും’ നിലനിർത്തി.
- source_word: מוֹת יוּמָתוּ
  choice: അവർ തീർച്ചയായും വധിക്കപ്പെടണം
  rationale: ക്രിയാനാമവും നിഷ്ക്രിയക്രിയയും ചേർന്ന ഹീബ്രു ഘടന ശിക്ഷയുടെ ഉറപ്പ് ഊന്നുന്നു. ‘തീർച്ചയായും’ ഊന്നലും ‘വധിക്കപ്പെടണം’ നിഷ്ക്രിയമായ നിയമവിധിയും കൈമാറുന്നു.
- source_word: דְּמֵיהֶם בָּם
  choice: അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്
  rationale: മരണത്തിന്റെ ഉത്തരവാദിത്വം കുറ്റക്കാരിൽ തന്നെയാണെന്ന നിയമപരമായ ഹീബ്രു പ്രയോഗം രൂപകസഹിതം നിലനിർത്തുന്നു; ‘രക്തക്കുറ്റം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: ആധുനികമായി വിവാദവിധേയമായ നിയമനിരോധനം മൃദൂകരിക്കാതെയും വികസിപ്പിക്കാതെയും പരിഭാഷപ്പെടുത്തൽ
  choice: ഹീബ്രു പാഠം വിവരിക്കുന്ന നിർദിഷ്ട പ്രവൃത്തിയും അതിനുള്ള ശിക്ഷയും നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സ്വവർഗലൈംഗിക പ്രവൃത്തികൾ’ പോലുള്ള വിശാല വിഭാഗമോ ആധുനിക ലൈംഗിക-സ്വത്വ പദാവലിയോ ഉപയോഗിക്കുക.
  rationale: മൂലപാഠം ഒരു നിർദിഷ്ട പ്രവൃത്തിയെ നിയമഭാഷയിൽ വിവരിക്കുന്നു; ആധുനിക സ്വത്വവിഭാഗത്തെ പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലുള്ളതിൽ കൂടുതലോ കുറവോ ചേർത്തിട്ടില്ല.
- issue: אִישׁ, זָכָר എന്നീ ലിംഗസൂചക പദങ്ങളുടെ വ്യത്യാസം
  choice: ‘പുരുഷൻ’, ‘ആൺ’ എന്ന വ്യത്യസ്ത പദങ്ങൾ ഉപയോഗിച്ചു.
  alternative: രണ്ടിടത്തും ‘പുരുഷൻ’ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ലിംഗനിരപേക്ഷമാക്കുക.
  rationale: മൂലപാഠത്തിലെ പദപരവും അർഥപരവുമായ വ്യത്യാസം സംരക്ഷിക്കുകയും അതിന്റെ വ്യക്തമായ പുരുഷലിംഗസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- issue: דְּמֵיהֶם בָּם എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്’ എന്ന ഉറവിടസന്നിഹിത രൂപകം നിലനിർത്തി.
  alternative: ‘അവരുടെ രക്തക്കുറ്റം അവരുടെമേലാണ്’ എന്നു വ്യാഖ്യാനപരമായി വ്യക്തമാക്കുക.
  rationale: ‘രക്തം’ എന്നും ‘രക്തക്കുറ്റം’ എന്നും ഗ്രഹിക്കാവുന്ന നിയമരൂപകത്തിന്റെ യഥാർഥ സാന്ദ്രത നിലനിർത്തി; വ്യത്യസ്ത അർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. അതിപുരാതനമോ സഭാവിഭാഗ-സവിശേഷമോ ആയ പദാവലി ഒഴിവാക്കി. ഉറവിടത്തിലെ പ്രവൃത്തികേന്ദ്രിത വിവരണവും കടുത്ത വിധിഭാഷയും നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
