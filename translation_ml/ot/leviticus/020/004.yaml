source:
  edition: WLC
  text: וְ/אִ֡ם הַעְלֵ֣ם יַעְלִימֽוּ֩ עַ֨ם הָ/אָ֜רֶץ אֶת עֵֽינֵי/הֶם֙ מִן הָ/אִ֣ישׁ הַ/ה֔וּא בְּ/תִתּ֥/וֹ מִ/זַּרְע֖/וֹ לַ/מֹּ֑לֶךְ לְ/בִלְתִּ֖י הָמִ֥ית אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: ml
  text: എന്നാൽ, ദേശത്തെ ജനങ്ങൾ ആ മനുഷ്യൻ തന്റെ സന്തതിയിൽപ്പെട്ട ചിലരെ[b] മോലെക്കിന്[c] കൊടുക്കുമ്പോൾ, അവനെ വധിക്കാതിരിക്കാനായി അയാളുടെ കാര്യത്തിൽ മനപ്പൂർവം കണ്ണടയ്ക്കുന്നുവെങ്കിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘സന്തതി’ എന്നതിന് എബ്രായത്തിൽ അക്ഷരാർഥം ‘വിത്ത്’ എന്നാണ്; ഇവിടെ അത് അയാളുടെ മക്കളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘മോലെക്ക്’ ഒരു ദേവതയെയോ ഒരുതരം ബാലബലിയാചാരത്തെയോ സൂചിപ്പിക്കാം; മറ്റൊരു വായനയിൽ ‘രാജാവിന്’ എന്നും വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: മനപ്പൂർവം … കണ്ണടയ്ക്കുന്നു
  rationale: ക്രിയയുടെ ആവർത്തനഘടന പ്രവൃത്തിക്ക് ഊന്നൽ നൽകുന്നു. ‘കണ്ണടയ്ക്കുക’ എന്ന പ്രയോഗം എബ്രായ ദൃശ്യരൂപവും അറിഞ്ഞുകൊണ്ട് അവഗണിക്കുന്നതെന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַם הָאָרֶץ
  choice: ദേശത്തെ ജനം
  rationale: ഈ നിയമസന്ദർഭത്തിൽ ഇത് ഒരു പ്രത്യേക സാമൂഹികവർഗത്തെയല്ല, ദേശത്തെയോ സമൂഹത്തെയോ ജനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶת עֵינֵיהֶם מִן הָאִישׁ הַהוּא
  choice: അയാളുടെ നേരെ കണ്ണടയ്ക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘ആ മനുഷ്യനിൽനിന്ന് തങ്ങളുടെ കണ്ണുകൾ മറയ്ക്കുക’ എന്നാണെങ്കിലും, നടപടിയെടുക്കാതെ അറിഞ്ഞുകൊണ്ട് അവഗണിക്കുക എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവിക ശൈലിയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: തന്റെ സന്തതിയിൽ ചിലരെ … കൊടുക്കുമ്പോൾ
  rationale: מִן ഭാഗികത സൂചിപ്പിക്കുന്നതിനാൽ സന്തതി മുഴുവനുമല്ല, അവരിൽ ചിലരെയാണ് ഉദ്ദേശിക്കുന്നത്. זֶרַע എന്ന പദത്തിന്റെ വംശപരമായ വ്യാപ്തി ‘സന്തതി’ നിലനിർത്തുന്നു.
- source_word: לַמֹּלֶךְ
  choice: മോലെക്കിന്
  rationale: നിരോധിക്കപ്പെട്ട ആരാധനാസംബന്ധിയായ സ്വീകർത്താവിന്റെ പരമ്പരാഗത നാമലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: അവനെ വധിക്കാതിരിക്കാനായി
  rationale: നിയമപരമായ മരണശിക്ഷ നടപ്പാക്കാതിരിക്കുക എന്ന ഉദ്ദേശ്യമോ ഫലമോ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘വധിക്കുക’ നിയമസന്ദർഭത്തിന് യോജിച്ച പദമാണ്.
theological_decisions:
- issue: לַמֹּלֶךְ എന്ന ആരാധനാസംബന്ധിയായ പദത്തിന്റെ അർഥം
  choice: മോലെക്ക്
  alternative: രാജാവിന്; അല്ലെങ്കിൽ ഒരു ബാലബലിയാചാരത്തെ സൂചിപ്പിക്കുന്ന പദം
  rationale: ലേവ്യപുസ്തകം 18:21; 20:2–5 എന്നിവയുടെ സന്ദർഭം നിരോധിക്കപ്പെട്ട ആരാധനാസംബന്ധിയായ സ്വീകർത്താവിന്റെ പേരോ സ്ഥാനപ്പേരോ ആണെന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും പദത്തിന്റെ കൃത്യമായ തിരിച്ചറിയലിലുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ നിബന്ധനാവാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ ഇവിടെ അവസാനത്തെ കോമ നിലനിർത്തി. ‘കണ്ണടയ്ക്കുക’ എന്ന പരിചിതമായ രൂപകം മൂലത്തിലെ ദൃശ്യപ്രയോഗവും മനപ്പൂർവമായ അവഗണനയും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
