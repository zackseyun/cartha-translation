source:
  edition: WLC
  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: ml
  text: മരിച്ചവരുടെ ആത്മാക്കളെ വിളിച്ചുവരുത്തുന്നവരിലേക്കു[a]ം നിഗൂഢജ്ഞാനം അവകാശപ്പെടുന്നവരിലേക്കും[b] തിരിഞ്ഞ്, അവരുടെ പിന്നാലെ വേശ്യാവൃത്തി ചെയ്യാൻ പോകുന്ന വ്യക്തിക്കെതിരെ ഞാൻ എന്റെ മുഖം തിരിക്കും; അയാളെ അവന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിച്ചുകളയും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആത്മമാധ്യമങ്ങൾ.’ എബ്രായ പദം മരിച്ചവരെയോ ആത്മാക്കളെയോ സമീപിക്കുന്നതോ വിളിച്ചുവരുത്തുന്നതോ സംബന്ധിച്ച ഒരു ആചാരപ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ആത്മവിദ്യക്കാർ.’ ഈ എബ്രായ പദം സാധാരണയായി മുൻപറഞ്ഞ പദത്തോടൊപ്പം വരുന്നു; നിഗൂഢമോ ആത്മീയമോ ആയ പ്രത്യേക ജ്ഞാനം അവകാശപ്പെടുന്ന ആചാരപ്രവർത്തകരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘ഛേദിച്ചുകളയും’ എന്നത് പതിവായ ഒരു നിയമപ്രയോഗമാണ്; ന്യായവിധി നടപ്പാക്കുന്ന കൃത്യമായ രീതി ഇവിടെ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: വ്യക്തി
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ נֶפֶשׁ അമൂർത്തമായ ‘ആത്മാവ്’ എന്നതിലുപരി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: תִּפְנֶה
  choice: തിരിഞ്ഞ്
  rationale: פנה എന്ന ക്രിയയുടെ ‘തിരിയുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും സഹായമോ അരുളപ്പാടോ തേടുന്നതിന്റെ ആശയം സന്ദർഭത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הָאֹבֹת
  choice: വെളിച്ചപ്പാടന്മാർ
  rationale: മരിച്ചവരെയോ ആത്മാക്കളെയോ സമീപിച്ച് അരുളപ്പാടു പറയുന്ന ഇടനിലക്കാരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഏറ്റവും സമീപമായ പ്രയോഗമാണിത്.
- source_word: הַיִּדְּעֹנִים
  choice: ആത്മാക്കളോട് അരുളപ്പാടു ചോദിക്കുന്നവർ
  rationale: ഒന്നാമത്തെ പദവുമായി ചേർന്ന് വരുന്ന, നിഗൂഢമായ ആത്മജ്ഞാനം അവകാശപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്നു. ‘മന്ത്രവാദികൾ’ എന്നു പൊതുവാക്കാതെ ആത്മോപദേശത്തിന്റെ പ്രത്യേകത വ്യക്തമാക്കുന്നു.
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: അവരെ പിന്തുടർന്ന് വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുന്ന
  rationale: זנה യിലെ ലൈംഗിക അവിശ്വസ്തതയുടെ രൂപകം മായ്ച്ചുകളയാതെ, അവരെ പിന്തുടരുന്നതുമായി അതിനെ സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: ആ വ്യക്തിക്കെതിരെ ഞാൻ എന്റെ മുഖം തിരിക്കും
  rationale: ദൈവിക എതിർപ്പിനെയും ന്യായവിധിയെയും സൂചിപ്പിക്കുന്ന എബ്രായ മുഖരൂപകം നിലനിർത്തുന്നു.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: അവനെ ഛേദിച്ചുകളയും
  rationale: כרת എന്ന നിയമസൂത്രത്തിന്റെ കാഠിന്യം നിലനിർത്തുന്നു; എന്നാൽ ശിക്ഷയുടെ കൃത്യമായ രീതി വിവർത്തനം മുൻകൂട്ടി നിശ്ചയിക്കുന്നില്ല.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: അവന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന്
  rationale: സാമൂഹിക പശ്ചാത്തലവും ‘മധ്യത്തിൽനിന്ന്’ എന്ന ഉറവിടഭാഷയിലെ ആശയവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി അവിശ്വസ്തതയ്ക്കുള്ള വേശ്യാവൃത്തി രൂപകം
  choice: അവരെ പിന്തുടർന്ന് വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുന്ന
  alternative: അവരെ പിന്തുടർന്ന് അവിശ്വസ്തനാകുന്ന
  rationale: എബ്രായം זנה എന്ന ശക്തമായ ലൈംഗിക രൂപകം വ്യക്തമായി ഉപയോഗിക്കുന്നു. അതിനെ പൊതുവായ ‘അവിശ്വസ്തത’യായി മൃദൂകരിക്കാതെ ആത്മീയവും ഉടമ്പടിസംബന്ധവുമായ കുറ്റത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- issue: ‘ഛേദിക്കപ്പെടുക’ എന്ന ശിക്ഷയുടെ അർഥം
  choice: അവനെ ഛേദിച്ചുകളയും
  alternative: അവനെ നശിപ്പിക്കും / പുറത്താക്കും
  rationale: ഇവിടെ ശിക്ഷയുടെ കൃത്യമായ വിധം വ്യക്തമാക്കിയിട്ടില്ല. മരണം, ദൈവിക ന്യായവിധി, അല്ലെങ്കിൽ സമൂഹത്തിൽനിന്നുള്ള നീക്കം എന്നിവയിൽ ഒന്നായി വ്യാഖ്യാനം നിർബന്ധിക്കാതെ മൂലപാഠത്തിന്റെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. മൂലപാഠത്തിലെ മുഖരൂപവും വേശ്യാവൃത്തി രൂപകവും നിയമപരമായ ‘ഛേദിക്കുക’ എന്ന തുറന്ന പ്രയോഗവും നിലനിർത്തിയിട്ടുണ്ട്. അപരിചിതമായ സാങ്കേതിക പദങ്ങളെക്കാൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിവരണാത്മക ഭാഷ ഉപയോഗിച്ചു.
