revisions:
- from: വെളിച്ചപ്പാടന്മാരിലേക്കും ആത്മാക്കളോട് അരുളപ്പാടു ചോദിക്കുന്നവരിലേക്കും[a] തിരിഞ്ഞ്, അവരെ പിന്തുടർന്ന് വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുന്ന[b] വ്യക്തിക്കെതിരെ ഞാൻ എന്റെ മുഖം തിരിക്കും; അവനെ അവന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിച്ചുകളയും[c].
  to: മരിച്ചവരുടെ ആത്മാക്കളെ വിളിച്ചുവരുത്തുന്നവരിലേക്കു[a]ം നിഗൂഢജ്ഞാനം അവകാശപ്പെടുന്നവരിലേക്കും[b] തിരിഞ്ഞ്, അവരുടെ പിന്നാലെ വേശ്യാവൃത്തി ചെയ്യാൻ പോകുന്ന വ്യക്തിക്കെതിരെ ഞാൻ എന്റെ മുഖം തിരിക്കും; അയാളെ അവന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിച്ചുകളയും[c].
  rationale: The revision preserves the Hebrew's two distinct but paired categories of prohibited practitioners without importing a specific modern Kerala institution. It corrects the second category from clients of spirits to practitioners, retains the purposeful prostitution metaphor (‘ചെയ്യാൻ’), preserves the divine ‘face’ idiom, and leaves the sanction ‘cut off’ unspecified. Footnote anchors are separated so each lexical explanation applies to its respective term.
