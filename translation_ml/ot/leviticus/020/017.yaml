source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: ml
  text: ഒരു പുരുഷൻ തന്റെ സഹോദരിയെ—അവന്റെ അപ്പന്റെ മകളോ അമ്മയുടെ മകളോ ആയവളെ—എടുക്കുകയും, അവളുടെ നഗ്നത കാണുകയും, അവൾ അവന്റെ നഗ്നത കാണുകയും ചെയ്താൽ, അത് അപമാനകരമായ പ്രവൃത്തിയാണ്[a]. സ്വജനങ്ങളുടെ കൺമുന്നിൽവെച്ച് അവർ ഛേദിക്കപ്പെടും[b]. അവൻ തന്റെ സഹോദരിയുടെ നഗ്നത അനാവൃതമാക്കി; അവൻ തന്റെ കുറ്റം വഹിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘അപമാനകരമായ പ്രവൃത്തി’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന חֶסֶד എന്ന എബ്രായപദത്തിന് സാധാരണയായി ‘ദയ’ അല്ലെങ്കിൽ ‘വിശ്വസ്തസ്നേഹം’ എന്നാണ് അർഥം; എന്നാൽ ഇവിടെ അപൂർവമായ പ്രതികൂല അർഥത്തിൽ ‘നിന്ദ്യമായ കാര്യം’ അല്ലെങ്കിൽ ‘അപകീർത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഛേദിക്കപ്പെടും’ എന്നത് എബ്രായ നിയമസൂത്രത്തെ അതേ അവ്യക്തതയോടെ നിലനിർത്തുന്നു; അത് വധമോ സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലോ മറ്റേതെങ്കിലും വിധത്തിലുള്ള നീക്കമോ എന്ന് ഈ പ്രയോഗം മാത്രം നിർണയിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: എബ്രായയിലെ പുല്ലിംഗ ഏകവചനവും നിയമവാക്യത്തിന്റെ രൂപവും നിലനിർത്തുന്നു.
- source_word: יִקַּח
  choice: സ്വീകരിക്കുകയും
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘എടുക്കുക’ എന്നതോടു ചേർന്നുനിൽക്കുകയും, ഇവിടെ വിവാഹമോ ലൈംഗികബന്ധമോ എന്ന് അനാവശ്യമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: തന്റെ സഹോദരിയെ—അവൾ തന്റെ അപ്പന്റെ മകളായാലും അമ്മയുടെ മകളായാലും—
  rationale: പിതൃവഴിയിലോ മാതൃവഴിയിലോ ഉള്ള അർധസഹോദരിയും ഉൾപ്പെടുന്നു എന്ന മൂലപാഠത്തിലെ വിശദീകരണം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: അവളുടെ നഗ്നത കാണുകയും, അവൾ അവന്റെ നഗ്നത കാണുകയും
  rationale: ലൈംഗിക അനാവരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ നിയമശൈലിയിലെ ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: חֶסֶד
  choice: അപമാനകരമായ പ്രവൃത്തി
  rationale: ഇവിടെ പതിവായ ‘ദയ/വിശ്വസ്തസ്നേഹം’ എന്ന അനുകൂല അർഥമല്ല, അപമാനമോ നിന്ദയോ സൂചിപ്പിക്കുന്ന അപൂർവമായ പ്രതികൂല അർഥമാണ് സന്ദർഭത്തിന് യോജിക്കുന്നത്.
- source_word: וְנִכְרְתוּ
  choice: അവർ ഇരുവരും ഛേദിക്കപ്പെടണം
  rationale: ശിക്ഷയുടെ കൃത്യമായ രീതി വ്യക്തമാക്കാതെ എബ്രായ നിയമസൂത്രത്തിന്റെ രൂപകവും അവ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: അവരുടെ ജനത്തിന്റെ കൺമുന്നിൽവെച്ച്
  rationale: ‘കണ്ണുകളുടെ മുമ്പിൽ’ എന്ന മൂലപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: גִּלָּה
  choice: അനാവൃതമാക്കിയിരിക്കുന്നു
  rationale: ലേവ്യപുസ്തകത്തിലെ നിരോധിത ലൈംഗികബന്ധങ്ങളെക്കുറിച്ചുള്ള ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന ആവർത്തിത നിയമപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: തന്റെ കുറ്റം വഹിക്കണം
  rationale: കുറ്റവും അതിന്റെ പരിണതഫലവും ഉൾക്കൊള്ളാവുന്ന എബ്രായ നിയമസൂത്രത്തിന്റെ ഭാരം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ חֶסֶד എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രതികൂല അർഥത്തിൽ ‘അപമാനകരമായ പ്രവൃത്തി’
  alternative: ‘നിന്ദ്യമായ കാര്യം’ അല്ലെങ്കിൽ ‘അപകീർത്തി’
  rationale: മറ്റിടങ്ങളിൽ ഈ പദം സാധാരണയായി ദയയെയോ വിശ്വസ്തസ്നേഹത്തെയോ സൂചിപ്പിച്ചാലും, ഇവിടെ നിരോധനവും ശിക്ഷയും അടങ്ങിയ സന്ദർഭം പ്രതികൂല അർഥം ആവശ്യപ്പെടുന്നു.
- issue: ‘ഛേദിക്കപ്പെടണം’ എന്ന ശിക്ഷാസൂത്രത്തിന്റെ വ്യാപ്തി
  choice: വധം, പുറത്താക്കൽ, മറ്റേതെങ്കിലും നീക്കം എന്നിവയിൽ ഒന്നായി നിർവചിക്കാതെ നിയമസൂത്രം നിലനിർത്തുക
  alternative: വധശിക്ഷയെന്നോ സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലെന്നോ വ്യക്തമായി പരിഭാഷപ്പെടുത്തുക
  rationale: ഈ എബ്രായ സൂത്രം ഇവിടെ ശിക്ഷ നടപ്പാക്കുന്ന കൃത്യമായ രീതി സ്വയം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വാചകത്തിലെ യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമശൈലി. മൂലപാഠത്തിലെ ആവർത്തനവും ലൈംഗിക-നിയമപരമായ രൂപകഭാഷയും കഴിയുന്നത്ര നിലനിർത്തി; വിശദീകരണം ആവശ്യമായ അപൂർവ പദവും അവ്യക്തമായ ശിക്ഷാസൂത്രവും അടിക്കുറിപ്പുകളിൽ സൂചിപ്പിച്ചു.
