revisions:
- from: ഒരു പുരുഷൻ തന്റെ സഹോദരിയെ—അവൾ തന്റെ അപ്പന്റെ മകളായാലും അമ്മയുടെ മകളായാലും—സ്വീകരിക്കുകയും, അവളുടെ നഗ്നത കാണുകയും, അവൾ അവന്റെ നഗ്നത കാണുകയും ചെയ്താൽ, അത് അപമാനകരമായ പ്രവൃത്തിയാണ്[a]. അവരുടെ ജനത്തിന്റെ കൺമുന്നിൽവെച്ച് അവർ ഇരുവരും ഛേദിക്കപ്പെടണം[b]. അവൻ തന്റെ സഹോദരിയുടെ നഗ്നത അനാവൃതമാക്കിയിരിക്കുന്നു; അവൻ തന്റെ കുറ്റം വഹിക്കണം.
  to: ഒരു പുരുഷൻ തന്റെ സഹോദരിയെ—അവന്റെ അപ്പന്റെ മകളോ അമ്മയുടെ മകളോ ആയവളെ—എടുക്കുകയും, അവളുടെ നഗ്നത കാണുകയും, അവൾ അവന്റെ നഗ്നത കാണുകയും ചെയ്താൽ, അത് അപമാനകരമായ പ്രവൃത്തിയാണ്[a]. സ്വജനങ്ങളുടെ കൺമുന്നിൽവെച്ച് അവർ ഛേദിക്കപ്പെടും[b]. അവൻ തന്റെ സഹോദരിയുടെ നഗ്നത അനാവൃതമാക്കി; അവൻ തന്റെ കുറ്റം വഹിക്കും.
