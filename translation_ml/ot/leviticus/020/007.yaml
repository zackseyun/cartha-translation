reference: Leviticus 20:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִ֨תְקַדִּשְׁתֶּ֔ם וִ/הְיִיתֶ֖ם קְדֹשִׁ֑ים כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/007.yaml
  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: ml
  text: നിങ്ങൾ നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ[a]; വിശുദ്ധരായിരിക്കുവിൻ. കാരണം, ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളെത്തന്നെ വിശുദ്ധരാക്കുവിൻ.’ ഹീബ്രു ക്രിയ ആത്മപ്രത്യയരൂപത്തിലാണ്; ഇസ്രായേൽ സജീവമായി തങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കണമെന്ന കല്പനയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: നിങ്ങൾ നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ
  rationale: קדשׁ എന്ന ധാതുവിന്റെ ഹിത്പാഏൽ രൂപം സജീവമായ ആത്മപ്രത്യയ അർഥം നൽകുന്നു. തുടർന്നുള്ള ‘വിശുദ്ധരായിരിക്കുവിൻ’ എന്ന നിലാവസ്ഥാപരമായ കല്പനയിൽനിന്ന് ഇതിനെ വേർതിരിച്ചും മൂലഭാഷയിലെ ‘സ്വയം വിശുദ്ധീകരിക്കുക’ എന്ന ഊന്നൽ നിലനിർത്തിയും ഈ പരിഭാഷ നൽകുന്നു.
- source_word: וִהְיִיתֶם
  choice: വിശുദ്ധരായിരിക്കുവിൻ
  rationale: മുൻ കല്പനയോടു ചേർന്ന היה എന്ന ക്രിയാരൂപം ഇവിടെ രണ്ടാമത്തെ കല്പനയായി സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു.
- source_word: קְדֹשִׁים
  choice: വിശുദ്ധർ
  rationale: ലേവ്യപുസ്തകത്തിലെ ഉടമ്പടിപരവും ധാർമികവുമായ ഗൗരവം ‘വിശുദ്ധർ’ വ്യക്തമായി നിലനിർത്തുന്നു; ‘വേർതിരിക്കപ്പെട്ടവർ’ എന്നത് അർഥത്തിന്റെ ഒരു ഭാഗം മാത്രമേ അറിയിക്കൂ.
- source_word: כִּי
  choice: കാരണം
  rationale: കല്പനയ്ക്കുള്ള അടിസ്ഥാനകാരണം അവതരിപ്പിക്കുന്ന ഹീബ്രു ബന്ധകത്തിന്റെ കാരണാർഥം ആധുനിക മലയാളത്തിൽ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവിക നാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ, അതിന്റെ സാധാരണ ശാസ്ത്രീയ ലിപ്യന്തരണത്തിന് അനുയോജ്യമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: രൂപപരമായി ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും സന്ദർഭത്തിൽ ഇത് ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; രണ്ടാംപുരുഷ ബഹുവചന പ്രത്യയം ‘നിങ്ങളുടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ എന്ന രൂപം Yahweh എന്ന പുനർനിർമിത ഉച്ചാരണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- issue: ആത്മപ്രത്യയ വിശുദ്ധീകരണവും വിശുദ്ധാവസ്ഥയും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ട് ഏകോപിത കല്പനകളായി നിലനിർത്തി
  alternative: ‘വിശുദ്ധരാകേണ്ടതിന് നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ’ എന്ന ഉദ്ദേശ്യബന്ധം
  rationale: വാക്യത്തിലെ וְ ... וִ ... എന്ന ഏകോപനം ഉദ്ദേശ്യബന്ധമായി നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല. അതിനാൽ സജീവമായ സ്വയം-വിശുദ്ധീകരണവും വിശുദ്ധരായിരിക്കാനുള്ള കല്പനയും വേർതിരിച്ചെങ്കിലും ബന്ധപ്പെട്ട നിലയിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘വിശുദ്ധീകരിക്കുവിൻ/ആയിരിക്കുവിൻ’ എന്ന ആദരസൂചക ബഹുവചന കല്പനാരൂപങ്ങൾ ഹീബ്രുവിലെ രണ്ടാംപുരുഷ ബഹുവചനം നിലനിർത്തുന്നു; ആദ്യ വാക്യത്തിലെ സർവനാമ ആവർത്തനം ആത്മപ്രത്യയ ഊന്നൽ വ്യക്തമാക്കാൻ ഉദ്ദേശപൂർവം സൂക്ഷിച്ചിരിക്കുന്നു.
