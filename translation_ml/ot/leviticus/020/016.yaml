reference: Leviticus 20:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל כָּל בְּהֵמָה֙ לְ/רִבְעָ֣ה אֹתָ֔/הּ וְ/הָרַגְתָּ֥ אֶת הָ/אִשָּׁ֖ה וְ/אֶת הַ/בְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: ml
  text: ഒരു സ്ത്രീ ഏതെങ്കിലും മൃഗവുമായി ഇണചേരാൻ അതിനെ സമീപിച്ചാൽ[a], ആ സ്ത്രീയെയും മൃഗത്തെയും കൊല്ലണം. അവ രണ്ടും നിശ്ചയമായും വധിക്കപ്പെടണം; സ്ത്രീയുടെയും മൃഗത്തിന്റെയും രക്തം അവരിൽത്തന്നെയാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതോടുകൂടെ കിടക്കാൻ.’ എബ്രായ ക്രിയ ഇവിടെ മൃഗവുമായുള്ള ലൈംഗികബന്ധത്തെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിൽ അതിന്മേൽ കയറുക എന്ന ആശയമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരുടെ രക്തപാതകക്കുറ്റം അവരിൽത്തന്നെയാണ്.’ അവരുടെ മരണത്തിന്റെ ഉത്തരവാദിത്വം അവർക്കുതന്നെയാണെന്നാണ് ഈ പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: സമീപിച്ചാൽ
  rationale: קרב എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അടുത്തുവരുക/സമീപിക്കുക’ നിലനിർത്തുന്നു; ലൈംഗിക ഉദ്ദേശ്യം തുടർന്നുള്ള പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: בְּהֵמָה
  choice: മൃഗം
  rationale: പദത്തിന്റെ പൊതുവായ വ്യാപ്തിയും כָּל നൽകുന്ന ‘ഏതെങ്കിലും’ എന്ന അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְרִבְעָה אֹתָהּ
  choice: അതോടു ഇണചേരാൻ
  rationale: רבע ഇവിടെ മൃഗവുമായുള്ള ലൈംഗികബന്ധത്തെ, അക്ഷരാർഥത്തിൽ കയറുന്നതിനോടു ബന്ധപ്പെട്ട പ്രവൃത്തിയെ, സൂചിപ്പിക്കുന്നു. ‘ഇണചേരാൻ’ ആധുനിക വായനക്കാർക്ക് വ്യക്തവും സംക്ഷിപ്തവുമാണ്; ക്രിയയിലെ ലിംഗവ്യാകരണ സങ്കീർണത അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: וְהָרַגְתָּ
  choice: കൊല്ലണം
  rationale: നിയമനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מוֹת יוּמָתוּ
  choice: നിശ്ചയമായും വധിക്കപ്പെടണം
  rationale: infinitive absolute-ഉം finite verb-ഉം ചേർന്നുള്ള ശക്തമായ വധശിക്ഷാസൂത്രത്തിന്റെ ഊന്നൽ ‘നിശ്ചയമായും’ വഴി നിലനിർത്തുന്നു.
- source_word: דְּמֵיהֶם בָּם
  choice: അവയുടെ രക്തം അവയുടെമേൽ തന്നെയാണ്
  rationale: മരണത്തിന്റെ ഉത്തരവാദിത്വം അവയ്ക്കുതന്നെയാണെന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകഭാഷ നിലനിർത്തുന്നു; ‘രക്തപാതകക്കുറ്റം’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: മൃഗവുമായുള്ള ലൈംഗികബന്ധത്തെക്കുറിച്ചുള്ള കഠിനമായ നിയമവും ശിക്ഷയും വിവർത്തനം ചെയ്യൽ
  choice: നിരോധിത പ്രവൃത്തിയും വധശിക്ഷയും മറച്ചുവയ്ക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘അതോടുകൂടെ കിടക്കാൻ’ പോലുള്ള കൂടുതൽ പരോക്ഷമായ ഭാഷ ഉപയോഗിക്കുക.
  rationale: നിയമവാക്യത്തിന്റെ ഗൗരവവും വ്യക്തതയും നിലനിർത്തുന്നു; മൂലപാഠത്തിനപ്പുറമുള്ള ധാർമിക വ്യാഖ്യാനമോ വിഭാഗീയ നിലപാടോ ചേർക്കുന്നില്ല.
- issue: דְּמֵיהֶם בָּם എന്ന പ്രയോഗത്തിലെ രക്തം/രക്തപാതകക്കുറ്റം എന്ന അർഥസാധ്യത
  choice: മുഖ്യപാഠത്തിൽ ‘അവയുടെ രക്തം അവയുടെമേൽ തന്നെയാണ്’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘അവയുടെ രക്തപാതകക്കുറ്റം അവയുടെമേലാണ്’ എന്ന് അർഥം തുറന്നുപറയുക.
  rationale: എബ്രായത്തിലെ ഉദ്ദേശ്യപൂർവമായ രൂപകവും നിയമ-ധാർമിക സംഘർഷവും സംരക്ഷിക്കുമ്പോൾ, അർഥസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ. ‘വധിക്കപ്പെടണം’ ശിക്ഷാനിയമത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു. സ്ത്രീക്കും മൃഗത്തിനും ചേർന്ന് ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ബഹുവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘അവ രണ്ടും’ എന്നും തുടർന്ന് ‘അവയുടെ’ എന്നും ഉപയോഗിച്ചു.
