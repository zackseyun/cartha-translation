  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: ml
  text: ഞാൻ തന്നേ എന്റെ മുഖം ആ മനുഷ്യന് എതിരായി തിരിച്ച്, അവനെ അവന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിച്ചുകളയും; കാരണം, എന്റെ വിശുദ്ധസ്ഥലം അശുദ്ധമാക്കാനും എന്റെ വിശുദ്ധ നാമം അശുദ്ധമാക്കാനും അവൻ തന്റെ സന്തതിയിൽനിന്ന് ചിലരെ മോലെക്കിന് കൊടുത്തിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ മക്കളിൽ ചിലരെ മോലെക്കിന് ബലിയർപ്പിച്ചിരിക്കുന്നു.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥമായി, ‘തന്റെ സന്തതിയിൽനിന്ന് ചിലരെ മോലെക്കിന് കൊടുത്തിരിക്കുന്നു’ എന്നാണ്; ബലിയർപ്പണം എന്ന അർഥം വിശാലമായ സന്ദർഭത്തിൽനിന്ന് അനുമാനിക്കപ്പെടുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ഞാൻതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: ആ മനുഷ്യനെതിരെ എന്റെ മുഖം തിരിക്കും
  rationale: ദൈവത്തിന്റെ ബോധപൂർവമായ എതിർപ്പിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ
  choice: അവനെ അവന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിച്ചുകളയും
  rationale: ന്യായവിധി എങ്ങനെ നടപ്പാകുമെന്ന് അതിരുകടന്ന് നിർവചിക്കാതെ, כרת എന്ന നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: מִזַּרְעוֹ
  choice: തന്റെ സന്തതിയിൽ ചിലരെ
  rationale: מן എന്നതിന്റെ ഭാഗികതയും זרע എന്നതിന്റെ സന്തതി/മക്കൾ എന്ന അർഥവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: נָתַן לַמֹּלֶךְ
  choice: മോലെക്കിനു കൊടുത്തിരിക്കുന്നു
  rationale: മൂലപാഠത്തിലെ പൊതുവായ ‘കൊടുക്കുക’ എന്ന ക്രിയ സംരക്ഷിക്കുന്നു; പ്രധാനപാഠത്തിൽ ‘ബലിയർപ്പിച്ചു’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  choice: എന്റെ വിശുദ്ധസ്ഥലം അശുദ്ധമാക്കാൻ
  rationale: ആരാധനാപരമായ അശുദ്ധീകരണത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: എന്റെ വിശുദ്ധനാമത്തെ അവഹേളിക്കാൻ
  rationale: ദൈവനാമത്തിന്റെ വിശുദ്ധി ലംഘിച്ച് അതിനെ നിന്ദ്യമായി കൈകാര്യം ചെയ്യുന്നതിന്റെ ഗൗരവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: മോലെക്കുമായി ബന്ധപ്പെട്ട കുറ്റത്തിന്റെ സ്വഭാവം
  choice: ‘തന്റെ സന്തതിയിൽ ചിലരെ മോലെക്കിനു കൊടുത്തിരിക്കുന്നു’ എന്ന മൂലപാഠസമീപമായ ഭാഷ പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘തന്റെ മക്കളിൽ ചിലരെ മോലെക്കിനു ബലിയർപ്പിച്ചിരിക്കുന്നു’
  rationale: വിശാലമായ സന്ദർഭം ബാലബലിയെ ശക്തമായി സൂചിപ്പിച്ചാലും ഈ വാക്യത്തിലെ ക്രിയ ‘കൊടുത്തു’ എന്നാണ്; അതിനാൽ വ്യാഖ്യാനപരമായ വ്യക്തീകരണം അടിക്കുറിപ്പിലാക്കി.
- issue: ദൈവത്തിന്റെ വ്യക്തിപരമായ ന്യായവിധി
  choice: ‘ഞാൻതന്നെ’ എന്ന ഊന്നലും മുഖം തിരിക്കുക എന്ന ദൃശ്യപ്രയോഗവും സംരക്ഷിച്ചു.
  alternative: ‘ഞാൻ അവനെ എതിർക്കും’
  rationale: പകരംവാചകം അർഥം നൽകുമെങ്കിലും എബ്രായത്തിലെ ഊന്നലും ദൈവിക ന്യായവിധിയുടെ ഉടമ്പടിപരമായ പ്രയോഗവും മങ്ങിപ്പോകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ നിയമപരവും ആരാധനാപരവുമായ പദഭാരം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ മതവിഭാഗീയ വ്യാഖ്യാനം ഒഴിവാക്കി.
