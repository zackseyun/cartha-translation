id: LEV.20.8
reference: Leviticus 20:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת חֻקֹּתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: ml
  text: നിങ്ങൾ എന്റെ ചട്ടങ്ങൾ പാലിക്കുകയും അവ അനുഷ്ഠിക്കുകയും വേണം. നിങ്ങളെ വിശുദ്ധീകരിക്കുന്ന[a] യഹ്‌വെ ഞാനാകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളെ വിശുദ്ധരാക്കുന്ന.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: നിങ്ങൾ … പാലിക്കുകയും … വേണം
  rationale: שׁמר എന്ന പദത്തിന്റെ ‘സൂക്ഷിക്കുക/പാലിക്കുക/അനുസരിക്കുക’ എന്ന നിയമ-ഉടമ്പടി അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘പാലിക്കുക’ എന്നു നൽകി; വാക്യത്തിന്റെ നിർദേശാത്മക ഭാവം ‘വേണം’ വ്യക്തമാക്കുന്നു.
- source_word: חֻקֹּתַי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: חֻקָּה നിർദേശിക്കപ്പെട്ട നിയമവ്യവസ്ഥകളെ സൂചിപ്പിക്കുന്നു. ‘ചട്ടങ്ങൾ’ നിയമപരമായ ഭാവം നിലനിർത്തുന്നതോടൊപ്പം സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: അവ അനുഷ്ഠിക്കുകയും
  rationale: עשה എന്ന ക്രിയ നിയമങ്ങളെ പ്രാവർത്തികമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അനുഷ്ഠിക്കുക’ വെറും സമ്മതത്തേക്കാൾ പ്രവൃത്തിയിലുള്ള അനുസരണം പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: מְקַדִּשְׁכֶם
  choice: നിങ്ങളെ വിശുദ്ധീകരിക്കുന്ന
  rationale: קדשׁ എന്ന ധാതുവിന്റെ ഹിഫിൽ പങ്കാളിക്രിയ ദൈവത്തിന്റെ തുടർച്ചയായോ സവിശേഷമായോ ഉള്ള വിശുദ്ധീകരണപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധീകരിക്കുന്ന’ എന്നത് ഈ ദൈവശാസ്ത്രപരവും ഉടമ്പടിപരവുമായ പദബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പേര് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; ‘കർത്താവ്’ എന്നു പകരംവെച്ചില്ല.
- issue: קדשׁ എന്ന വിശുദ്ധി-പദത്തിന്റെ ഉടമ്പടിപരമായ അർഥം
  choice: നിങ്ങളെ വിശുദ്ധീകരിക്കുന്ന
  alternative: നിങ്ങളെ വിശുദ്ധരാക്കുന്ന; നിങ്ങളെ വേർതിരിച്ചുവെക്കുന്ന
  rationale: ‘വിശുദ്ധീകരിക്കുന്ന’ എന്നത് ദൈവത്തിന്റെ പ്രവർത്തനത്തെ നേരിട്ട് നിലനിർത്തുകയും വിശുദ്ധി എന്ന മുഖ്യ ബൈബിൾ പദബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു. കൂടുതൽ സാധാരണഭാഷയിലുള്ള പകരംവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമപരവും ഉടമ്പടിപരവുമായ ഗൗരവം നിലനിർത്തിയ സ്വാഭാവിക ശൈലി. ബഹുവചനമായ ‘നിങ്ങൾ’ മൂലപാഠത്തിലെ അഭിസംബോധന സംരക്ഷിക്കുന്നു.
