reference: Leviticus 20:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֥ר יִקַּ֛ח אֶת אֵ֥שֶׁת אָחִ֖י/ו נִדָּ֣ה הִ֑וא עֶרְוַ֥ת אָחִ֛י/ו גִּלָּ֖ה עֲרִירִ֥ים יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: ml
  text: ഒരു പുരുഷൻ തന്റെ സഹോദരന്റെ ഭാര്യയെ ഭാര്യയായി സ്വീകരിച്ചാൽ, അത് അശുദ്ധിയാണ്[a]; അവൻ തന്റെ സഹോദരന്റെ നഗ്നത വെളിപ്പെടുത്തിയിരിക്കുന്നു. അവർ സന്താനമില്ലാത്തവരായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശുദ്ധി’ എന്ന എബ്രായപദത്തിന് ആചാരപരവും ധാർമ്മികവുമായ അശുദ്ധി അർഥമാക്കാം; ‘മലിനത’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവർ സന്താനങ്ങളില്ലാതെ മരിക്കും’ എന്നും വ്യാഖ്യാനിക്കാറുണ്ട്. എന്നാൽ എബ്രായപാഠം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘അവർ സന്താനമില്ലാത്തവരായിരിക്കും’ എന്നാണ് പറയുന്നത്; ഈ ന്യായവിധി എങ്ങനെ നടപ്പാകുമെന്ന് അത് വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ഒരു പുരുഷൻ ... ചെയ്താൽ
  rationale: നിയമവാക്യത്തിലെ വ്യവസ്ഥാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ആദ്യത്തെ וְ സന്ദർഭബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ നിർബന്ധമായി ‘എന്നാൽ/കൂടാതെ’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: יִקַּח אֶת אֵשֶׁת אָחִיו
  choice: തന്റെ സഹോദരന്റെ ഭാര്യയെ സ്വീകരിച്ചാൽ
  rationale: לקח എന്നതിന്റെ ‘എടുക്കുക/സ്വീകരിക്കുക’ എന്ന വ്യാപകത നിലനിർത്തുന്നു. ‘വിവാഹം കഴിച്ചാൽ’ എന്നു പറഞ്ഞ് ഔപചാരിക വിവാഹച്ചടങ്ങിനെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നതും, ‘എടുത്താൽ’ എന്ന അസ്വാഭാവിക മലയാളവും ഒഴിവാക്കുന്നു.
- source_word: נִדָּה הִוא
  choice: അത് അശുദ്ധിയാണ്
  rationale: נִדָּה ഇവിടെ സ്ത്രീയെ വ്യക്തിപരമായി അശുദ്ധയെന്ന് വിളിക്കുന്നതിലുപരി ആ ബന്ധത്തിന്റെ ആചാരപരവും ധാർമ്മികവുമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു. ‘അത്’ എന്നത് ഈ ബന്ധത്തെയാണ് തിരിച്ചുപറയുന്നത്.
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: അവൻ തന്റെ സഹോദരന്റെ നഗ്നത വെളിപ്പെടുത്തിയിരിക്കുന്നു
  rationale: ലേവ്യപുസ്തകത്തിലെ നിരോധിത ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ എബ്രായ പ്രയോഗത്തിന്റെ രൂപകസ്വഭാവവും അന്തർപാഠബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: עֲרִירִים יִהְיוּ
  choice: അവർ സന്താനമില്ലാത്തവരായിരിക്കും
  rationale: ബഹുവചനരൂപം ഇരുവരെയും സൂചിപ്പിക്കുന്നു. עֲרִירִים നേരിട്ട് സന്താനമില്ലായ്മയാണ് പറയുന്നത്; അത് എങ്ങനെ സംഭവിക്കുമെന്ന് പാഠം വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: עֲרִירִים יִהְיוּ എന്ന ന്യായവിധിവാക്യത്തിന്റെ അർഥം
  choice: അവർ സന്താനമില്ലാത്തവരായിരിക്കും
  alternative: അവർ സന്താനങ്ങളില്ലാതെ മരിക്കും
  rationale: എബ്രായപാഠം സന്താനമില്ലായ്മ വ്യക്തമാക്കുന്നു, എന്നാൽ മരണത്തെയോ ന്യായവിധി നടപ്പാകുന്ന രീതിയെയോ നേരിട്ട് പറയുന്നില്ല. അതിനാൽ പാഠത്തിലെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- issue: נִדָּה ആരെയോ എന്തിനെയോ വിശേഷിപ്പിക്കുന്നു എന്ന ചോദ്യം
  choice: ‘അത് അശുദ്ധിയാണ്’—ബന്ധം/പ്രവൃത്തി അശുദ്ധമാണെന്ന വായന
  alternative: ‘അവൾ അശുദ്ധയാണ്’
  rationale: സ്ത്രീയെ വ്യക്തിപരമായി അശുദ്ധയായി മുദ്രകുത്താതെ, വ്യാകരണപരമായി മുൻപുള്ള സാഹചര്യത്തെ തിരിച്ചുപറയുന്ന സ്വാഭാവിക വായന സ്വീകരിക്കുന്നു; പദത്തിന്റെ ആചാരപര-ധാർമ്മിക വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ നിയമശൈലി. ‘നഗ്നത വെളിപ്പെടുത്തുക’ എന്ന രൂപകപ്രയോഗം ഉറവിടത്തിലെ നിയമപരമായ ഭാഷയും ലേവ്യപുസ്തകത്തിനുള്ളിലെ ആവർത്തനബന്ധവും നിലനിർത്താൻ ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിട്ടുണ്ട്.
