    issue: ‘മരണശിക്ഷ അനുഭവിക്കണം’ is less direct than the source’s passive execution formula.
    rationale: The Hebrew מות יומתו states that both offenders are to be put to death, with emphatic force. ‘മരണശിക്ഷ അനുഭവിക്കണം’ can refer to receiving or undergoing a death sentence and does not as directly state the mandated outcome. ‘നിശ്ചയമായും വധിക്കപ്പെടണം’ preserves the passive legal force without specifying a method.
