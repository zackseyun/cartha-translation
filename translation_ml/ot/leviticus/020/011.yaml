id: LEV.20.11
reference: Leviticus 20:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: ml
  text: ഒരു പുരുഷൻ തന്റെ അപ്പന്റെ ഭാര്യയോടുകൂടെ ശയിച്ചാൽ, അവൻ തന്റെ അപ്പന്റെ നഗ്നത അനാവൃതമാക്കിയിരിക്കുന്നു[a]. ഇരുവരും നിശ്ചയമായും വധിക്കപ്പെടണം; അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യാഖ്യാനപരമായി: ‘അവൻ തന്റെ അപ്പനെ ലൈംഗികമായി അപമാനിച്ചിരിക്കുന്നു.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവൻ തന്റെ അപ്പന്റെ നഗ്നത അനാവൃതമാക്കി’ എന്നാണ്; നിരോധിതമായ ലൈംഗികലംഘനത്തെ സൂചിപ്പിക്കാൻ ലേവ്യപുസ്തകത്തിൽ ഉപയോഗിക്കുന്ന സ്ഥിരപ്രയോഗമാണിത്.'
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്’ എന്നത്, അവരുടെ മരണത്തിന്റെ ഉത്തരവാദിത്വം അവർക്കുതന്നെയാണെന്ന് സൂചിപ്പിക്കുന്ന ഒരു നിയമസൂത്രമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ഒരു പുരുഷൻ ... ശയിച്ചാൽ
  rationale: നിയമപരമായ സോപാധിക വാക്യഘടന സ്വാഭാവിക മലയാളത്തിൽ ‘...ചെയ്താൽ’ എന്നു നൽകി; പുരുഷലിംഗ ഏകവചന കർത്താവും നിലനിർത്തി.
- source_word: יִשְׁכַּב אֶת
  choice: യോടുകൂടെ ശയിച്ചാൽ
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഔപചാരികവും മാന്യവുമായ സമാനപ്രയോഗം; അതിനെ അത്യന്തം വൈദ്യശാസ്ത്രപരമാക്കുകയോ അവ്യക്തമാക്കുകയോ ചെയ്യുന്നില്ല.
- source_word: אֵשֶׁת אָבִיו
  choice: തന്റെ അപ്പന്റെ ഭാര്യ
  rationale: മൂലപാഠത്തിലെ ബന്ധപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ‘രണ്ടാനമ്മ’ എന്ന കൂടുതൽ പരിമിതമായ ബന്ധപദം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: തന്റെ അപ്പന്റെ നഗ്നത അനാവൃതമാക്കിയിരിക്കുന്നു
  rationale: ലേവ്യപുസ്തകത്തിലെ സ്ഥിരമായ ലൈംഗികനിയമ ശൈലി സംരക്ഷിക്കുകയും 18, 20 അധ്യായങ്ങളുമായുള്ള പാഠാന്തരബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מוֹת יוּמְתוּ
  choice: നിശ്ചയമായും മരണശിക്ഷ അനുഭവിക്കണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ക്രിയയും ചേർന്ന ഊന്നൽ ‘നിശ്ചയമായും’ എന്നു പ്രകടമാക്കുന്നു; മരണരീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: שְׁנֵיהֶם
  choice: ഇരുവരും
  rationale: ശിക്ഷ രണ്ടു പങ്കാളികൾക്കും ബാധകമാണെന്ന മൂലപാഠത്തിലെ വ്യക്തമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: דְּמֵיהֶם בָּם
  choice: അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്
  rationale: മരണത്തിന്റെ ഉത്തരവാദിത്വം കുറ്റക്കാരിൽ തന്നെയാണെന്ന നിയമസൂത്രം അതിന്റെ രക്തരൂപകം സഹിതം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ലൈംഗികനിയമത്തിലെ സ്ഥിരപ്രയോഗത്തിന്റെ രൂപകവും അന്തർപാഠബന്ധവും
  choice: തന്റെ അപ്പന്റെ നഗ്നത അനാവൃതമാക്കിയിരിക്കുന്നു
  alternative: അവൻ തന്റെ അപ്പനെ ലൈംഗികമായി അപമാനിച്ചിരിക്കുന്നു
  rationale: വ്യാഖ്യാനാർഥം മാത്രം നൽകാതെ മൂലത്തിലെ സ്ഥിരരൂപകം നിലനിർത്തുന്നത് നിയമത്തിന്റെ കാനോനിക ബന്ധങ്ങളും ധാർമ്മിക ഗൗരവവും സംരക്ഷിക്കുന്നു.
- issue: നിയമത്തിലെ ലിംഗനിർദ്ദിഷ്ട കർത്താവ്
  choice: ഒരു പുരുഷൻ
  alternative: ആരെങ്കിലും
  rationale: എബ്രായ പാഠം പുരുഷലിംഗ ഏകവചനത്തിലുള്ള പുരുഷകുറ്റക്കാരനെയാണ് പ്രത്യേകം അഭിസംബോധന ചെയ്യുന്നത്; അതിനാൽ ലിംഗനിഷ്പക്ഷമാക്കിയിട്ടില്ല.
- issue: രക്തസൂത്രത്തിലെ ഉത്തരവാദിത്വം
  choice: അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്
  alternative: അവരുടെ മരണത്തിന് അവർ തന്നെയാണ് ഉത്തരവാദികൾ
  rationale: വ്യാഖ്യാനം മാത്രം പാഠത്തിൽ പകരാതെ നിയമപരമായ രൂപകവും കുറ്റക്കാരുടെ ഉത്തരവാദിത്വവും ഒരുപോലെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഔപചാരികവുമായ നിയമശൈലി. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കെ ഗൗരവം നിലനിർത്തുന്നു. ‘ശയിക്കുക’, ‘നഗ്നത അനാവൃതമാക്കുക’ എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിലെ ശൈലിയും ലേവ്യപുസ്തകത്തിലെ ആവർത്തിത പദബന്ധവും സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പുകൾ [a], [b] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
