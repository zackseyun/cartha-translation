  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: ml
  text: നിങ്ങളുടെ മുമ്പിൽനിന്ന് ഞാൻ നീക്കിക്കളയുന്ന ജനതയുടെ ചട്ടങ്ങൾക്കനുസരിച്ച്[a][b] നിങ്ങൾ ജീവിക്കരുത്. അവർ ഈ കാര്യങ്ങളെല്ലാം ചെയ്തതുകൊണ്ട് ഞാൻ അവരെ വെറുത്തു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചട്ടങ്ങൾ’ എന്നതിന് ‘ആചാരങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം നിശ്ചയിക്കപ്പെട്ട ആചാരങ്ങളെയോ സ്ഥിരമായ നിയമങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘നിങ്ങളുടെ മുമ്പിൽനിന്ന് ഞാൻ അയച്ചുകളയുന്ന’; ഇവിടെ ജനതയെ പുറത്താക്കുക എന്നതാണ് ആശയം.'
    reason: lexical_alternative
  - marker: c
    text: ‘എനിക്ക് അവരോട് അറപ്പു തോന്നി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ
  choice: ജീവിക്കരുത്
  rationale: הלך എന്നതിന്റെ അക്ഷരാർഥം ‘നടക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ അത് ഒരാളുടെ പെരുമാറ്റത്തെയും ജീവിതരീതിയെയും സൂചിപ്പിക്കുന്ന നൈതിക പ്രയോഗമാണ്. ആ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി എത്തിക്കാൻ ‘ജീവിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּחֻקֹּת
  choice: ചട്ടങ്ങൾക്കനുസരിച്ച്
  rationale: חֻקּוֹת എന്നത് നിശ്ചിത ചട്ടങ്ങളെയോ സ്ഥാപിത ആചാരങ്ങളെയോ സൂചിപ്പിക്കാം. ‘ചട്ടങ്ങൾ’ അതിന്റെ നിയമപരവും പെരുമാറ്റപരവുമായ ശക്തി നിലനിർത്തുന്നു; ‘അനുസരിച്ച്’ എന്നത് בְּ എന്നതിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַגּוֹי
  choice: ജനത
  rationale: ഏകവചനത്തിലുള്ള גּוֹי ഇവിടെ പുറത്താക്കപ്പെടുന്ന കനാന്യ ജനസമൂഹത്തെ ഒന്നായി സൂചിപ്പിക്കുന്നു. ‘ജനത’ സ്വാഭാവികവും പിൽക്കാലത്തെ ‘വിജാതീയർ’ എന്ന മതപരമായ അർഥം അനാവശ്യമായി ചേർക്കാത്തതുമാണ്.
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന് ഞാൻ നീക്കിക്കളയുന്ന
  rationale: ശബ്ദാർഥം ‘നിങ്ങളുടെ മുമ്പിൽനിന്ന് അയച്ചുകളയുന്ന’ എന്നാണെങ്കിലും, ഭൂമിയിൽനിന്നുള്ള പുറത്താക്കലാണ് സന്ദർഭാർഥം. ‘നീക്കിക്കളയുന്ന’ ആ അർഥം സ്വാഭാവികമായി നൽകുകയും അതിരുകടന്ന സൈനിക ഭാഷ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: അവർ ഈ കാര്യങ്ങളെല്ലാം ചെയ്തതുകൊണ്ട്
  rationale: כִּי ഇവിടെ കാരണം അറിയിക്കുന്നു. ഈ വാക്യം മുമ്പ് പറഞ്ഞ നിരോധിത പ്രവൃത്തികളിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.
- source_word: וָאָקֻץ בָּם
  choice: ഞാൻ അവരെ വെറുത്തു
  rationale: קוץ ശക്തമായ അറപ്പിനെയും വെറുപ്പിനെയും സൂചിപ്പിക്കുന്നു. ‘വെറുത്തു’ സാധാരണ മലയാളത്തിൽ ശക്തവും ഗൗരവമുള്ളതുമാണ്; അറപ്പിന്റെ സൂക്ഷ്മഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ശക്തമായ ധാർമിക വെറുപ്പ് എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: ഞാൻ അവരെ വെറുത്തു
  alternative: അവരോട് എനിക്ക് അറപ്പുതോന്നി
  rationale: എബ്രായപദത്തിലെ ശക്തമായ വികാരഭാവം മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു. അതേസമയം, വാക്യം പറയുന്നതിലപ്പുറം ദൈവത്തിന്റെ വികാരങ്ങളെക്കുറിച്ചുള്ള ഒരു സിദ്ധാന്തവ്യാഖ്യാനവും ചേർക്കുന്നില്ല.
- issue: വെറുപ്പിന്റെ കർമം ജനങ്ങളാണോ അവരുടെ പ്രവൃത്തികളാണോ
  choice: അവരെ
  alternative: അവരുടെ പ്രവൃത്തികളെ
  rationale: בָּם എന്നത് വ്യാകരണപരമായി മുമ്പ് പറഞ്ഞ ജനതയെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭം അവരുടെ പ്രവൃത്തികളാണ് വെറുപ്പിന് കാരണമെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും, പരിഭാഷ കർമത്തെ ‘പ്രവൃത്തികൾ’ എന്നു മാറ്റി പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നടക്കുക’ എന്ന എബ്രായ ശൈലി അക്ഷരാർഥത്തിൽ പകർത്താതെ അതിന്റെ നൈതിക അർഥമായ ‘ജീവിക്കുക’ ഉപയോഗിച്ചു. ജനതയോടുള്ള ദൈവിക വെറുപ്പ് എന്ന പാഠത്തിലെ ശക്തിയും സംഘർഷവും മയപ്പെടുത്താതെ നിലനിർത്തി.
