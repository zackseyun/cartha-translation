id: LEV.20.2
reference: Leviticus 20:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל תֹּאמַר֒ אִ֣ישׁ אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר הַ/גָּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יִתֵּ֧ן מִ/זַּרְע֛/וֹ לַ/מֹּ֖לֶךְ מ֣וֹת יוּמָ֑ת עַ֥ם הָ/אָ֖רֶץ יִרְגְּמֻ֥/הוּ בָ/אָֽבֶן־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: ml
  text: 'നീ ഇസ്രായേൽമക്കളോടു പറയേണ്ടത്: ഇസ്രായേൽമക്കളിൽ ഒരാളോ ഇസ്രായേലിൽ പാർക്കുന്ന അന്യദേശനിവാസിയോ[a] തന്റെ സന്തതിയിൽനിന്ന് ഒരാളെ[b] മോലെക്കിനു[c] കൊടുത്താൽ, അവൻ തീർച്ചയായും വധിക്കപ്പെടണം; ദേശത്തെ ജനങ്ങൾ അവനെ കല്ലെറിഞ്ഞു കൊല്ലണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേലിൽ പാർക്കുന്ന അന്യദേശനിവാസി’ എന്നതിനു ‘ഇസ്രായേലിൽ താമസിക്കുന്ന വിദേശി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ ‘അന്യദേശനിവാസി’ എന്ന നാമത്തോടൊപ്പം അതേ ധാതുവിൽനിന്നുള്ള ‘പാർക്കുക’ എന്ന ക്രിയയും ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സന്തതി’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘വിത്ത്’ എന്നാണ്; ഇവിടെ അത് ഒരാളുടെ മക്കളെയോ പിൻതലമുറയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘മോലെക്ക്’ കുട്ടികളെ ബലിയർപ്പിക്കുന്നതുമായി പരമ്പരാഗതമായി ബന്ധപ്പെടുത്തിയിട്ടുള്ള ഒരു ദേവതയെ സൂചിപ്പിക്കാം. ചില വ്യാഖ്യാതാക്കൾ ഈ പദം ഒരു പ്രത്യേകതരം വഴിപാടിനെ സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും കൂട്ടായ അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ אִישׁ
  choice: ആരെങ്കിലും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന നാമം ഓരോ വ്യക്തിയെയും ഉൾക്കൊള്ളുന്ന വിതരണാർഥമുള്ള പ്രയോഗമാണ്; മലയാളത്തിൽ ‘ആരെങ്കിലും’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַגֵּר הַגָּר
  choice: പാർക്കുന്ന പ്രവാസികൾ
  rationale: ഇസ്രായേലിൽ സ്ഥിരമായി താമസിക്കുന്ന അന്യദേശക്കാരെയാണ് גֵּר സൂചിപ്പിക്കുന്നത്. നാമവും സമാനധാതുവിലുള്ള ക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം ‘പാർക്കുന്ന പ്രവാസികൾ’ എന്നതിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יִתֵּן מִזַּרְעוֹ לַמֹּלֶךְ
  choice: തന്റെ സന്തതിയിൽ ആരെയെങ്കിലും മോലെക്കിനു കൊടുത്താൽ
  rationale: זֶרַע എന്നത് അക്ഷരാർഥത്തിൽ ‘വിത്ത്’ ആണെങ്കിലും ഇവിടെ മക്കളെയോ പിൻതലമുറയെയോ സൂചിപ്പിക്കുന്നു. ‘സന്തതി’ അതിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; מן എന്ന ഘടകം ‘ആരെയെങ്കിലും’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: מוֹת יוּמָת
  choice: തീർച്ചയായും വധിക്കപ്പെടണം
  rationale: ക്രിയാനാമവും പരിമിതക്രിയയും ചേർന്ന തീവ്രപ്രയോഗം ശിക്ഷയുടെ നിശ്ചിതത്വത്തെയും ന്യായവിധിപരമായ വധത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: עַם הָאָרֶץ
  choice: ദേശത്തിലെ ജനം
  rationale: പിന്നീടുള്ള സാങ്കേതിക സാമൂഹിക അർഥം ചുമത്താതെ, ഈ നിയമസന്ദർഭത്തിലെ ദേശസമൂഹത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: അവനെ കല്ലെറിഞ്ഞു കൊല്ലണം
  rationale: കല്ലെറിഞ്ഞുള്ള വധശിക്ഷയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; ഉപകരണമായ കല്ലും ശിക്ഷയുടെ മാരകസ്വഭാവവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: മോലെക്കുമായി ബന്ധപ്പെട്ട സന്തതിയെ കൊടുക്കുന്നതിന്റെ അർഥം
  choice: മോലെക്കിനു സന്തതിയിൽ ആരെയെങ്കിലും കൊടുക്കുക എന്ന മൂലപാഠത്തിന്റെ സംക്ഷിപ്ത രൂപം നിലനിർത്തി.
  alternative: ‘മോലെക്ക്-വഴിപാടായി കൊടുക്കുക’ എന്നോ ‘തീയിൽ ബലിയർപ്പിക്കുക’ എന്നോ വ്യക്തമാക്കുക.
  rationale: മോലെക്ക് ഒരു ദേവനെയോ സ്ഥാനപ്പേരെയോ സൂചിപ്പിക്കുന്നു എന്ന പരമ്പരാഗത വായന സാദ്ധ്യമാണ്; എന്നാൽ ചിലർ ഇതിനെ ഒരു വഴിപാടിന്റെ പേരായി മനസ്സിലാക്കുന്നു. ഈ വാക്യം തന്നെ തീയെയോ ആചാരത്തിന്റെ വിശദരൂപത്തെയോ പറയാത്തതിനാൽ അവ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമഭാഷയുടെ നിശ്ചിതത്വം ‘തീർച്ചയായും വധിക്കപ്പെടണം’ എന്നതിലൂടെ നിലനിർത്തി; എബ്രായത്തിന്റെ അസ്വാഭാവിക ആവർത്തനങ്ങൾ മലയാളത്തിൽ അനാവശ്യമായി പകർത്താതെ അവയുടെ അർഥബലം സംരക്ഷിച്ചു.
