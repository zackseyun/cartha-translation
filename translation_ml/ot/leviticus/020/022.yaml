source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹא תָקִ֤יא אֶתְ/כֶם֙ הָ/אָ֔רֶץ אֲשֶׁ֨ר אֲנִ֜י מֵבִ֥יא אֶתְ/כֶ֛ם שָׁ֖מָּ/ה לָ/שֶׁ֥בֶת בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: ml
  text: അതുകൊണ്ട് നിങ്ങൾ എന്റെ എല്ലാ ചട്ടങ്ങളും എന്റെ എല്ലാ ന്യായവിധികളും പാലിക്കുകയും അവ അനുഷ്ഠിക്കുകയും വേണം; നിങ്ങൾ അവിടെ വസിക്കാനായി ഞാൻ നിങ്ങളെ കൊണ്ടുപോകുന്ന ദേശം നിങ്ങളെ ഛർദിച്ചുകളയാതിരിക്കേണ്ടതിന്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുറത്തേക്ക് തുപ്പിക്കളയാതിരിക്കേണ്ടതിന്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘ഛർദിക്കുക’ എന്നാണ്; അശുദ്ധരായ നിവാസികളെ ദേശം പുറത്താക്കുന്നതിനെ ചിത്രീകരിക്കുന്ന ശക്തമായ രൂപകമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ എല്ലാ വിധികളും എന്റെ എല്ലാ നിയമനിർണയങ്ങളും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഹീബ്രായയിൽ חֻקּוֹת, מִשְׁפָּטִים എന്നീ രണ്ടു വ്യത്യസ്ത നിയമപദങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: അതുകൊണ്ട് നിങ്ങൾ ... പാലിച്ച്
  rationale: שׁמר എന്നത് നിയമ-ഉടമ്പടി സന്ദർഭത്തിൽ ‘പാലിക്കുക’ എന്ന അർഥം നൽകുന്നു. മുൻസന്ദർഭത്തിലെ മുന്നറിയിപ്പുമായി ബന്ധിപ്പിക്കാൻ וּ־ ഇവിടെ ‘അതുകൊണ്ട്’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: חֻקֹּתַי
  choice: എന്റെ എല്ലാ ചട്ടങ്ങളും
  rationale: חֻקָּה നിർദേശിക്കപ്പെട്ട നിയമവ്യവസ്ഥകളെ സൂചിപ്പിക്കുന്നു; ‘ചട്ടങ്ങൾ’ എന്നത് ആ നിയമഭാവം നിലനിർത്തുകയും തുടർന്നുള്ള מִשְׁפָּטִים എന്ന പദത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מִשְׁפָּטַי
  choice: എന്റെ എല്ലാ ന്യായവിധികളും
  rationale: מִשְׁפָּטִים എന്ന വ്യത്യസ്ത നിയമപദത്തിന്റെ ന്യായവിധി/നിയമനിർണയ ഭാവം നിലനിർത്താൻ ‘ന്യായവിധികൾ’ ഉപയോഗിച്ചു.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: അനുഷ്ഠിക്കണം
  rationale: നിയമങ്ങളെ കർമത്തിൽ നടപ്പാക്കുക എന്ന עשהയുടെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘അനുഷ്ഠിക്കുക’ എന്നു നൽകുന്നു.
- source_word: וְלֹא תָקִיא אֶתְכֶם הָאָרֶץ
  choice: ദേശം നിങ്ങളെ ഛർദിച്ചുകളയാതിരിക്കേണ്ടതിനാണ്
  rationale: קיא എന്നതിന്റെ അക്ഷരാർഥമായ ‘ഛർദിക്കുക’ നിലനിർത്തി, അശുദ്ധരായ നിവാസികളെ ദേശം പുറത്താക്കുന്നതിന്റെ ശക്തമായ രൂപകം സംരക്ഷിച്ചു.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: ഞാൻ നിങ്ങളെ കൊണ്ടുപോകുന്ന ദേശം
  rationale: ദൈവത്തിന്റെ ഇപ്പോഴത്തെ കൊണ്ടുപോകൽ പ്രവൃത്തിയും ലക്ഷ്യസ്ഥാനമായ ദേശവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ഹീബ്രായയിലെ അധിക സ്ഥാനസൂചനം മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: לָשֶׁבֶת בָּהּ
  choice: നിങ്ങൾ വസിക്കേണ്ടതിന്
  rationale: ישׁב എന്നത് ഇവിടെ ദേശത്തിൽ താമസിക്കുക/വസിക്കുക എന്ന അർഥത്തിലാണ്; ‘വസിക്കുക’ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാണ്.
theological_decisions:
- issue: ഉടമ്പടി മുന്നറിയിപ്പിലെ ദേശത്തെ വ്യക്തിവൽക്കരിക്കുന്ന പുറന്തള്ളൽരൂപകം
  choice: ദേശം നിവാസികളെ ‘ഛർദിച്ചുകളയുന്നു’ എന്ന രൂപകം അതേ തീവ്രതയിൽ നിലനിർത്തി.
  alternative: ദേശം നിങ്ങളെ തള്ളിക്കളയും / പുറത്താക്കും.
  rationale: മൂലപാഠം ദേശത്തെ വ്യക്തിവൽക്കരിച്ച് קיא എന്ന ശക്തമായ ക്രിയ ഉപയോഗിക്കുന്നു. രൂപകം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നത് ദേശത്തിന്റെ അശുദ്ധീകരണവും അതിനെത്തുടർന്നുള്ള പുറത്താക്കലും സംബന്ധിച്ച ദൈവശാസ്ത്രപരമായ ഗൗരവം സംരക്ഷിക്കുന്നു.
- issue: חֻקּוֹת, מִשְׁפָּטִים എന്നീ രണ്ടു നിയമപദങ്ങളുടെ വ്യത്യാസം
  choice: ‘ചട്ടങ്ങൾ’, ‘ന്യായവിധികൾ’ എന്നീ രണ്ടു വ്യത്യസ്ത മലയാളപദങ്ങൾ ഉപയോഗിച്ചു.
  alternative: ‘കല്പനകൾ’, ‘നിയമങ്ങൾ’ / എല്ലാം ചേർത്ത് ‘നിയമങ്ങൾ’.
  rationale: മൂലപാഠത്തിലെ രണ്ടു നിയമവിഭാഗങ്ങളെയും ഒരൊറ്റ പൊതുപദത്തിൽ ലയിപ്പിക്കാതെ അവയുടെ പദവ്യത്യാസം വായനയിൽ ദൃശ്യമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. നിയമപരമായ ഗൗരവത്തിനായി ‘ചട്ടങ്ങൾ’, ‘ന്യായവിധികൾ’, ‘അനുഷ്ഠിക്കുക’ എന്നിവയും, മൂലത്തിലെ ശക്തമായ രൂപകത്തിനായി ‘ഛർദിച്ചുകളയുക’ എന്ന നേരിട്ടുള്ള പ്രയോഗവും നിലനിർത്തി.
