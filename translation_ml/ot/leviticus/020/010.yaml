source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִנְאַף֙ אֶת אֵ֣שֶׁת אִ֔ישׁ אֲשֶׁ֥ר יִנְאַ֖ף אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ מֽוֹת יוּמַ֥ת הַ/נֹּאֵ֖ף וְ/הַ/נֹּאָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: ml
  text: ഒരു പുരുഷൻ മറ്റൊരു പുരുഷന്റെ ഭാര്യയുമായി വ്യഭിചാരം ചെയ്താൽ—തന്റെ അയൽക്കാരന്റെ ഭാര്യയുമായി വ്യഭിചാരം ചെയ്താൽ—വ്യഭിചാരിയും വ്യഭിചാരിണിയും തീർച്ചയായും വധിക്കപ്പെടണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഒരു പുരുഷന്റെ ഭാര്യയുമായി ... തന്റെ അയൽക്കാരന്റെ ഭാര്യയുമായി.” നിയമഭാഷയിലെ ഈ ആവർത്തനം കുറ്റത്തെ ഊന്നിപ്പറയുകയും വ്യക്തമാക്കുകയും ചെയ്യുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ഒരു പുരുഷൻ ... ചെയ്താൽ
  rationale: നിയമത്തിലെ ഒരു പ്രത്യേക സാഹചര്യം അവതരിപ്പിക്കുന്ന ഘടനയായതിനാൽ, ബന്ധസൂചകമായ അക്ഷരാർഥത്തെക്കാൾ വ്യവസ്ഥാസൂചകമായ ‘ചെയ്താൽ’ മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יִנְאַף
  choice: വ്യഭിചാരം ചെയ്താൽ
  rationale: נאף പൊതുവായ ലൈംഗിക അധാർമികതയെയല്ല, വിവാഹബന്ധം ലംഘിക്കുന്ന വ്യഭിചാരത്തെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: മറ്റൊരു പുരുഷന്റെ ഭാര്യയുമായി
  rationale: അക്ഷരാർഥം ‘ഒരു പുരുഷന്റെ ഭാര്യയുമായി’ എന്നാണ്; കുറ്റക്കാരനല്ലാത്ത മറ്റൊരു പുരുഷന്റെ ഭാര്യയെന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കാൻ ‘മറ്റൊരു പുരുഷന്റെ’ എന്നു നൽകി.
- source_word: אֶת אֵשֶׁת רֵעֵהוּ
  choice: തന്റെ അയൽക്കാരന്റെ ഭാര്യയുമായി
  rationale: רֵעַ ഇവിടെ അടുത്ത വീട്ടുകാരനെ മാത്രം സൂചിപ്പിക്കാതെ സമൂഹത്തിലെ സഹാംഗത്തെയും സൂചിപ്പിക്കാം; സ്ഥാപിതവും സ്വാഭാവികവുമായ ‘അയൽക്കാരൻ’ ആ വിശാലത നിലനിർത്തുന്നു.
- source_word: מוֹת יוּמַת
  choice: തീർച്ചയായും വധിക്കപ്പെടണം
  rationale: ക്രിയാനാമവും പരിമിതക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗം മരണശിക്ഷയുടെ ഉറപ്പും ഊന്നലും പ്രകടമാക്കുന്നു; കർമണിപ്രയോഗവും ശിക്ഷാവിധിയുടെ നിയമഭാവവും നിലനിർത്തി.
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: വ്യഭിചാരിയും വ്യഭിചാരിണിയും
  rationale: പുരുഷ-സ്ത്രീ കുറ്റക്കാരെ സമാന്തരമായി പേരെടുത്ത് പറയുന്ന എബ്രായ ഘടന സംക്ഷിപ്തമായും ലിംഗവ്യത്യാസം നിലനിർത്തിയും വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: ലിംഗസൂചകമായ നിയമഭാഷ
  choice: ‘പുരുഷൻ’ എന്നും പുരുഷ-സ്ത്രീ കുറ്റക്കാരെ വേർതിരിച്ച് ‘വ്യഭിചാരി’, ‘വ്യഭിചാരിണി’ എന്നും നിലനിർത്തി.
  alternative: ‘ആരെങ്കിലും വ്യഭിചാരം ചെയ്താൽ ... ഇരുവരും’
  rationale: സംഭവവിവരണത്തിലും ശിക്ഷാവിധിയിലും എബ്രായപാഠം ലിംഗം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; അതിനെ ലിംഗനിരപേക്ഷമായി പരാവർത്തനം ചെയ്തില്ല.
- issue: മരണശിക്ഷയുടെ സൂത്രവാക്യം
  choice: ‘തീർച്ചയായും വധിക്കപ്പെടണം’ എന്ന് നൽകി; വധരീതി വ്യക്തമാക്കിയില്ല.
  alternative: ‘മരണശിക്ഷ നടപ്പാക്കണം’
  rationale: ഈ വാക്യം മരണശിക്ഷയെ ഊന്നിപ്പറയുന്നുവെങ്കിലും അതിന്റെ രീതി പറയുന്നില്ല; മറ്റു ഭാഗങ്ങളിൽ നിന്നോ പാരമ്പര്യങ്ങളിൽ നിന്നോ വിശദാംശങ്ങൾ ചേർത്തില്ല.
- issue: കുറ്റവിവരണത്തിന്റെ ആവർത്തനം
  choice: ഭാര്യയെക്കുറിച്ചുള്ള രണ്ടു സമാന്തര പ്രയോഗങ്ങളും പൂർണമായി നിലനിർത്തി.
  alternative: ‘മറ്റൊരു പുരുഷന്റെ, അതായത് തന്റെ അയൽക്കാരന്റെ, ഭാര്യയുമായി വ്യഭിചാരം ചെയ്താൽ’
  rationale: എബ്രായ നിയമഭാഷയിലെ ആവർത്തനം കുറ്റത്തെ ഊന്നുകയും വ്യക്തമാക്കുകയും ചെയ്യുന്നതിനാൽ അത് ചുരുക്കിക്കളഞ്ഞില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. ‘വ്യഭിചാരം’, ‘വധിക്കപ്പെടണം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും മൂലപാഠത്തിന്റെ കൃത്യതയും ഔപചാരികതയും നിലനിർത്തുന്നതുമാണ്. പ്രധാനപാഠത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
