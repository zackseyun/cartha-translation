source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּֽי יִהְיֶ֨ה בָ/הֶ֥ם א֛וֹב א֥וֹ יִדְּעֹנִ֖י מ֣וֹת יוּמָ֑תוּ בָּ/אֶ֛בֶן יִרְגְּמ֥וּ אֹתָ֖/ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: ml
  text: ഒരു പുരുഷനോ സ്ത്രീയോ ആത്മമാധ്യമമോ ആത്മാക്കളോട് ചോദിക്കുന്നവനോ ആണെങ്കിൽ,[a][b] അവൻ അല്ലെങ്കിൽ അവൾ തീർച്ചയായും വധിക്കപ്പെടണം. അവരെ കല്ലെറിഞ്ഞു കൊല്ലണം. അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മമാധ്യമം’ എന്നു പരിഭാഷപ്പെടുത്തിയ אוֹב എന്ന പദത്തിന് ‘ബന്ധപ്പെട്ട ആത്മാവ്’ അഥവാ ‘പരിചിതാത്മാവ്’ എന്നും അർഥമാകാം; മരിച്ചവരുമായി ബന്ധപ്പെടുന്ന ആത്മാവിനെയോ അതിനോട് ചോദിക്കുന്ന മാധ്യമത്തെയോ ഇത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ആത്മാക്കളോട് ചോദിക്കുന്നവൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയ יִדְּעֹנִי എന്ന പദത്തിന് ‘മന്ത്രവാദി’ എന്നും പരിഭാഷപ്പെടുത്താം; ആധുനിക മാന്ത്രികകഥകളുടെ ധ്വനി ഒഴിവാക്കാനാണ് ഈ പ്രയോഗം ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്’ എന്നത്, അവരുടെ മരണത്തിന്റെ ഉത്തരവാദിത്വം അവർക്കുതന്നെയാണെന്ന് സൂചിപ്പിക്കുന്ന ഒരു നിയമപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אוֹ אִשָּׁה
  choice: ഒരു പുരുഷനിലോ സ്ത്രീയിലോ
  rationale: എബ്രായത്തിലെ പുരുഷൻ–സ്ത്രീ എന്ന വ്യക്തമായ ദ്വയം നിലനിർത്തുന്നു; തുടർന്നുള്ള בָהֶם എന്ന ആശയവുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: כִּי יִהְיֶה בָהֶם
  choice: ഉണ്ടെങ്കിൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘അവരിൽ ഉണ്ടാകുക’ എന്ന ഘടന പൂർണമായി അനുകരിക്കാതെ, വ്യക്തിയിൽ അത്തരം ആത്മാവോ ശേഷിയോ സാന്നിധ്യമുണ്ടെന്ന അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: אוֹב
  choice: മരിച്ചവരുടെ ആത്മാക്കളുമായി ബന്ധപ്പെടുന്ന ആത്മാവ്
  rationale: ഈ പദം മരിച്ചവരുമായി ബന്ധപ്പെട്ട ആത്മാവിനെയോ അതുമായി ഇടപെടുന്ന മാധ്യമത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ ആത്മാവെന്ന സാധ്യത നിലനിർത്തി, പദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִדְּעֹנִי
  choice: ആത്മജ്ഞാനി
  rationale: ആത്മാക്കളിൽനിന്നുള്ള രഹസ്യജ്ഞാനവുമായി ബന്ധപ്പെട്ട വ്യക്തിയെയോ ആത്മാവിനെയോ സൂചിപ്പിക്കുന്ന അപൂർവ പദത്തിന് സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ സമാനപദം; ആധുനിക മാന്ത്രികകഥകളുടെ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: מוֹת יוּמָתוּ
  choice: തീർച്ചയായും വധിക്കപ്പെടണം
  rationale: ക്രിയാനാമം + പരിമിതക്രിയ എന്ന എബ്രായ ഊന്നൽ വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: בָאֶבֶן יִרְגְּמוּ אֹתָם
  choice: അവരെ കല്ലെറിഞ്ഞു കൊല്ലണം
  rationale: കല്ലാണ് വധോപാധിയെന്ന് വ്യക്തമായി സൂക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ നിയമഭാഷ ഉപയോഗിക്കുന്നു.
- source_word: דְּמֵיהֶם בָּם
  choice: അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്
  rationale: മരണത്തിന്റെ ഉത്തരവാദിത്വം കുറ്റക്കാരിൽ തന്നെയാണെന്ന നിയമസൂത്രം വ്യാഖ്യാനിച്ച് മാറ്റാതെ രൂപകാത്മകമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: אוֹב, יִדְּעֹנִי എന്നീ ആത്മബന്ധിത പദങ്ങളുടെ അർഥപരിധി
  choice: മുഖ്യവാചകത്തിൽ ‘മരിച്ചവരുടെ ആത്മാക്കളുമായി ബന്ധപ്പെടുന്ന ആത്മാവ്’ എന്നും ‘ആത്മജ്ഞാനി’ എന്നും നൽകി, അവയുടെ വ്യക്തി/ആത്മാവ് സംബന്ധിയായ അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ നിലനിർത്തുക
  alternative: ‘ആത്മമാധ്യമം’, ‘ആത്മാക്കളോട് ചോദിക്കുന്നവൻ’ എന്നിങ്ങനെ രണ്ടും മനുഷ്യരായ പ്രവർത്തകരായി മാത്രം വിവർത്തനം ചെയ്യുക
  rationale: പുരാതന പദങ്ങൾ ബന്ധപ്പെട്ട ആത്മാവിനെയും അതിനെ ആശ്രയിക്കുന്ന പ്രവർത്തകനെയും സൂചിപ്പിക്കാനിടയുണ്ട്. വിവർത്തനം ആ വർഗ്ഗീകരണം അനാവശ്യമായി തീർപ്പാക്കരുത്.
- issue: പുരുഷനും സ്ത്രീയും വ്യക്തമായി പരാമർശിക്കുന്നത്
  choice: ‘ഒരു പുരുഷനിലോ സ്ത്രീയിലോ’ എന്നു നിലനിർത്തുക
  alternative: ‘ആരിലെങ്കിലും’ എന്ന് ലിംഗനിരപേക്ഷമായി ചുരുക്കുക
  rationale: മൂലപാഠം രണ്ടു ലിംഗങ്ങളെയും വ്യക്തമായി പറയുന്നു; അതിനാൽ ആ രൂപം സംരക്ഷിക്കുന്നു.
- issue: דְּמֵיהֶם בָּם എന്ന നിയമസൂത്രം
  choice: ‘അവരുടെ രക്തം അവരുടെമേൽ തന്നെയാണ്’ എന്നു രൂപകാത്മകമായി നിലനിർത്തുക
  alternative: ‘അവരുടെ മരണത്തിന് അവർ തന്നെയാണ് ഉത്തരവാദികൾ’ എന്നു വിശദീകരിച്ച് വിവർത്തനം ചെയ്യുക
  rationale: മൂലത്തിലെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷഭാരം സംരക്ഷിക്കുകയും വ്യാഖ്യാനം അടിക്കുറിപ്പിലേക്കു മാറ്റുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. അപൂർവമായ ആത്മബന്ധിത എബ്രായ പദങ്ങളുടെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു; വാക്യം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ചുരുക്കവും വ്യക്തവുമായി വെച്ചു.
