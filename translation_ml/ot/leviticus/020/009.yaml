  terminology: “ശപിക്കുക” correctly represents קלל in this context. “അപ്പൻ/അമ്മ” is natural, though “പിതാവു/മാതാവു” would be more elevated; no change is necessary. The responsibility formula and note preserve the Hebrew idiom without doctrinal expansion.
