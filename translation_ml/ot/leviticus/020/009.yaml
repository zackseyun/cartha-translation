  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי אִ֣ישׁ אִ֗ישׁ אֲשֶׁ֨ר יְקַלֵּ֧ל אֶת אָבִ֛י/ו וְ/אֶת אִמּ֖/וֹ מ֣וֹת יוּמָ֑ת אָבִ֧י/ו וְ/אִמּ֛/וֹ קִלֵּ֖ל דָּמָ֥י/ו בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: ml
  text: തന്റെ അപ്പനെയോ അമ്മയെയോ ശപിക്കുന്ന ഏതൊരുവനും നിശ്ചയമായും വധിക്കപ്പെടണം. അവൻ തന്റെ അപ്പനെയും അമ്മയെയും ശപിച്ചിരിക്കുന്നു; അവന്റെ രക്തം അവന്റെമേൽത്തന്നെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവന്റെ രക്തപാതകത്തിന്റെ ഉത്തരവാദിത്വം അവനുതന്നെ” എന്നും അർഥമാകാം. തന്റെ മരണശിക്ഷയ്ക്കുള്ള ഉത്തരവാദിത്വം കുറ്റക്കാരനുതന്നെയാണെന്ന് ഈ എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִישׁ אִישׁ
  choice: ഏതൊരുവനും
  rationale: ആവർത്തിച്ച אִישׁ אִישׁ വിതരണാർഥമുള്ള എബ്രായ പ്രയോഗമാണ്; നിയമത്തിലെ പൊതുവ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഏതൊരുവനും’ എന്നു നൽകുന്നു. כִּי ഇവിടെ നിയമവാക്യത്തെ അവതരിപ്പിക്കുന്നതിനാൽ പ്രത്യേകമായൊരു ബന്ധപദം ചേർക്കാതെ മലയാള വാക്യഘടനയിൽ അർഥം തെളിയുന്നു.
- source_word: יְקַלֵּל / קִלֵּל
  choice: ശപിക്കുന്ന / ശപിച്ചിരിക്കുന്നു
  rationale: പീയേൽ രൂപത്തിലുള്ള קלל ഇവിടെ വെറും അനാദരവല്ല, ഒരാളുടെ നേരെ ശാപവാക്ക് പറയുന്നതാണ്. രണ്ടാമത്തെ ക്രിയ പൂർത്തിയായ കുറ്റത്തെ ശിക്ഷയുടെ അടിസ്ഥാനമായി ആവർത്തിക്കുന്നു.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: തന്റെ അപ്പനെയോ അമ്മയെയോ / തന്റെ അപ്പനെയും അമ്മയെയും
  rationale: ആദ്യത്തെ എബ്രായ ‘ഉം’ നിയമപരമായി മാതാപിതാക്കളിൽ ആരെയെങ്കിലും ശപിച്ചാൽ ശിക്ഷ ബാധകമെന്ന വിതരണാർഥം വഹിക്കുന്നതിനാൽ ‘യോ’ എന്നു നൽകി; കുറ്റത്തിന്റെ സംഗ്രഹമായ രണ്ടാം ആവർത്തനത്തിൽ മൂലത്തിലെ സംയോജനം അനുസരിച്ച് ‘യും’ നിലനിർത്തി.
- source_word: מוֹת יוּמָת
  choice: നിശ്ചയമായും മരണശിക്ഷ അനുഭവിക്കണം
  rationale: ക്രിയാനാമവും പരിണതക്രിയയും ചേർന്ന എബ്രായ തീവ്രപ്രയോഗം ശിക്ഷയുടെ ഉറപ്പിനെയും ന്യായവിധിപരമായ നിർബന്ധത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നിശ്ചയമായും’ തീവ്രതയും ‘മരണശിക്ഷ അനുഭവിക്കണം’ ന്യായവിധിപരമായ നിഷ്ക്രിയാർഥവും നൽകുന്നു.
- source_word: דָּמָיו בּוֹ
  choice: അവന്റെ രക്തം അവന്റെമേൽത്തന്നെ
  rationale: മരണത്തിനുള്ള ഉത്തരവാദിത്വം കുറ്റക്കാരനുതന്നെയാണെന്ന് ചുമത്തുന്ന എബ്രായ നിയമപ്രയോഗം രൂപകാത്മകമായി നിലനിർത്തുന്നു; ‘തന്നെ’ ഉത്തരവാദിത്വത്തിന്റെ ഊന്നൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אִישׁ אִישׁ എന്ന ലിംഗസൂചക വിതരണപ്രയോഗം
  choice: ഏതൊരുവനും
  alternative: ആരെങ്കിലും / ആരായാലും
  rationale: മൂലത്തിലെ പുരുഷലിംഗരൂപം മായ്ച്ചുകളയാതെ അതിന്റെ പ്രതിനിധിപരവും പൊതുവ്യാപകവുമായ നിയമാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- issue: דָּמָיו בּוֹ എന്ന ഉത്തരവാദിത്വസൂത്രം
  choice: അവന്റെ രക്തം അവന്റെമേൽത്തന്നെ
  alternative: അവന്റെ രക്തപാതകക്കുറ്റം അവന്റെമേലാണ്
  rationale: ഈ പ്രയോഗം കുറ്റക്കാരൻ തന്റെ മരണത്തിന് ഉത്തരവാദിയാണെന്ന ന്യായവിധിപരമായ അർഥം നൽകുന്നു. ‘രക്തപാതകക്കുറ്റം’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കാതെ മൂലത്തിലെ രൂപകവും ഉദ്ദേശ്യപൂർവമായ സാന്ദ്രതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ‘അപ്പൻ, അമ്മ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മൂലത്തിലെ കുടുംബബന്ധങ്ങളുടെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നതുമാണ്. വാക്യത്തിന്റെ ആവർത്തനവും ന്യായവിധിപരമായ ഊന്നലും സംരക്ഷിച്ചു.
