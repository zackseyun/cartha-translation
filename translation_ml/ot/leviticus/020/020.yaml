  verdict: revise
  source_fidelity: The draft preserves the Hebrew legal sequence, the singular man and plural consequence, the Levitical ‘uncover nakedness’ idiom, and the deliberately non-mechanistic outcome ‘die childless.’ The Malayalam term അമ്മായി is appropriately constrained by the note as the uncle’s wife. The modal വഹിക്കണം, however, can sound like an exhortation rather than the stated legal consequence conveyed by יִשָּׂאוּ.
  naturalness: The register is suitably formal and modern. അമ്മായിയോടു കൂടെ is understandable, but അമ്മായിയുമായി is smoother contemporary Malayalam in this construction. Future forms for the consequences read more naturally and retain the declarative legal force.
  terminology: ശയിക്കുക and നഗ്നത അനാവൃതമാക്കുക suitably retain the formal Levitical idiom. പാപം is a sound primary rendering of חֶטְאָם, while the footnote correctly preserves ‘guilt/liability’ as an alternative. No doctrinal interpretation has been added.
