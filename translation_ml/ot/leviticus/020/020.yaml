source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: ml
  text: ഒരു പുരുഷൻ തന്റെ അമ്മായിയുമായി[a] ശയിച്ചാൽ, അവൻ തന്റെ അമ്മാവന്റെ നഗ്നത അനാവൃതമാക്കിയിരിക്കുന്നു. അവർ തങ്ങളുടെ പാപം വഹിക്കും[b]; അവർ സന്താനമില്ലാതെ മരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “അമ്മായി” എന്നു പറയുന്നത് അമ്മാവന്റെ ഭാര്യയെയാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “അവർ തങ്ങളുടെ കുറ്റബാധ വഹിക്കും.” എബ്രായ പ്രയോഗം പാപത്തെയോ അതിനാൽ വഹിക്കേണ്ട കുറ്റബാധയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ഒരു പുരുഷൻ ... ചെയ്താൽ
  rationale: തുടർച്ചയായ നിയമസംഭവം അവതരിപ്പിക്കുന്ന വ്യവസ്ഥാരൂപം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; אִישׁ എന്ന പുല്ലിംഗ ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: יִשְׁכַּב אֶת
  choice: കൂടെ ശയിച്ചാൽ
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഔപചാരികതയും മാന്യമായ ഭാഷാശൈലിയും നിലനിർത്തുന്നു.
- source_word: דֹּדָתוֹ
  choice: തന്റെ അമ്മായിയോടു
  rationale: ഈ പദം പിതൃ/മാതൃസഹോദരന്റെ ഭാര്യയെ, അഥവാ വിവാഹബന്ധത്തിലുള്ള അമ്മായിയെ, സൂചിപ്പിക്കുന്നു; അടുത്ത വാക്യഭാഗത്തിലെ דֹּדוֹ ഈ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: അവൻ തന്റെ അമ്മാവന്റെ നഗ്നത അനാവൃതമാക്കിയിരിക്കുന്നു
  rationale: നിരോധിത ബന്ധത്തിലുള്ള ലൈംഗികലംഘനത്തെ സൂചിപ്പിക്കുന്ന ലേവ്യപുസ്തകത്തിലെ സ്ഥിരപ്രയോഗം പരാവർത്തനം ചെയ്യാതെ സംരക്ഷിക്കുന്നു.
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: അവർ തങ്ങളുടെ പാപം വഹിക്കണം
  rationale: ഇരുവരെയും ഉൾക്കൊള്ളുന്ന ബഹുവചനവും ‘പാപം/കുറ്റബാധ വഹിക്കുക’ എന്ന എബ്രായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: עֲרִירִים יָמֻתוּ
  choice: അവർ സന്താനമില്ലാതെ മരിക്കും
  rationale: ശിക്ഷയുടെ നടപടിക്രമം വിശദീകരിക്കാതെ, സന്താനരഹിതരായി മരിക്കുക എന്ന സംക്ഷിപ്ത ഫലപ്രസ്താവന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: עֲרִירִים יָמֻתוּ എന്ന ശിക്ഷാവാക്യത്തിന്റെ അർഥം
  choice: അവർ സന്താനമില്ലാതെ മരിക്കും
  alternative: അവർ മക്കളില്ലാതെ മരിക്കും / അവശേഷിക്കുന്ന സന്തതിയില്ലാതെ മരിക്കും
  rationale: മൂലപാഠം ശിക്ഷയുടെ പ്രവർത്തനരീതി വ്യക്തമാക്കുന്നില്ല; അവസ്ഥയെയും ഫലത്തെയും മാത്രം പറയുന്നു. അതിനാൽ അധികമായ നിയമശാസ്ത്രപരമോ ദൈവശാസ്ത്രപരമോ ആയ വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: חֶטְאָם എന്നതിലെ പാപം–കുറ്റബാധ അർഥവ്യാപ്തി
  choice: പാപം
  alternative: കുറ്റബാധ
  rationale: חטא ചെയ്ത പാപത്തെയും അതിന്റെ കുറ്റബാധയെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള ‘പാപം’ നിലനിർത്തി മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ നിയമശൈലി. ‘ശയിക്കുക,’ ‘നഗ്നത അനാവൃതമാക്കുക’ എന്നീ ലേവ്യപ്രയോഗങ്ങൾ അവയുടെ സാംസ്കാരികവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നഷ്ടപ്പെടാതിരിക്കാൻ ഔപചാരികമായി നിലനിർത്തി.
