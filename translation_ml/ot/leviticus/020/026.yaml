id: LEV.20.26
reference: Leviticus 20:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: ml
  text: നിങ്ങൾ എനിക്കായി വിശുദ്ധരായിരിക്കണം; കാരണം ഞാൻ, യഹ്‌വേ, വിശുദ്ധനാണ്. നിങ്ങൾ എന്റേതായിരിക്കേണ്ടതിന് ഞാൻ നിങ്ങളെ ജനതകളിൽനിന്ന്[a] വേർതിരിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രാഷ്ട്രങ്ങളിൽനിന്ന്.’ എബ്രായത്തിലെ עַמִּים എന്ന പദത്തിന് ‘ജനതകൾ’ എന്നും ചില സന്ദർഭങ്ങളിൽ ‘രാഷ്ട്രങ്ങൾ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם לִי קְדֹשִׁים
  choice: നിങ്ങൾ എനിക്കു വിശുദ്ധരായിരിക്കണം
  rationale: നിയമപരവും പ്രബോധനാത്മകവുമായ സന്ദർഭത്തിൽ ക്രിയാരൂപത്തിനുള്ള ബാധ്യതയുടെയും ഭാവിഫലത്തിന്റെയും ശക്തി ‘ആയിരിക്കണം’ സ്വാഭാവികമായി നൽകുന്നു. לִי എന്ന ബന്ധസൂചന ‘എനിക്കു’ എന്നു നിലനിർത്തുന്നു.
- source_word: כִּי קָדוֹשׁ אֲנִי
  choice: കാരണം ... ഞാൻ വിശുദ്ധനാണ്
  rationale: כִּי ഇവിടെ ഇസ്രായേലിന്റെ വിശുദ്ധിക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു. קָדוֹשׁ എന്നതിന് ‘വിശുദ്ധൻ’ നൽകി ദൈവത്തിന്റെ വിശുദ്ധിയും ജനത്തോട് ആവശ്യപ്പെടുന്ന വിശുദ്ധിയും തമ്മിലുള്ള പദബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: וָאַבְדִּל אֶתְכֶם
  choice: ഞാൻ നിങ്ങളെ ... വേർതിരിച്ചിരിക്കുന്നു
  rationale: בדל വേർതിരിക്കുക എന്ന പൂർത്തിയായ ദൈവിക പ്രവൃത്തിയെയും അതിന്റെ ഇപ്പോഴത്തെ ഉടമ്പടിപരമായ പ്രസക്തിയെയും സൂചിപ്പിക്കുന്നു. קדש-ൽനിന്നുള്ള പദവ്യത്യാസവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: מִן הָעַמִּים
  choice: ജനസമൂഹങ്ങളിൽനിന്ന്
  rationale: עַמִּים വിവിധ ജനവിഭാഗങ്ങളെയോ ജനസമൂഹങ്ങളെയോ സൂചിപ്പിക്കാം; രാഷ്ട്രീയ ‘രാഷ്ട്രങ്ങൾ’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതിരിക്കാൻ ‘ജനസമൂഹങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: לִהְיוֹת לִי
  choice: എനിക്കുള്ളവരായിരിക്കേണ്ടതിന്
  rationale: ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന നിർമാണവും ഉടമ്പടിപരമായ സ്വന്തബന്ധവും വ്യക്തമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ ഉടമ്പടിപരമായ വിശുദ്ധി ധാർമിക ശുദ്ധിയിലേക്കോ ആചാരപരമായ വേർതിരിവിലേക്കോ മാത്രം ചുരുക്കാതെ അവതരിപ്പിക്കൽ
  choice: קדש എന്നതിന് ‘വിശുദ്ധർ/വിശുദ്ധൻ’ എന്നും בדל എന്നതിന് ‘വേർതിരിക്കുക’ എന്നും വേർതിരിച്ചു പരിഭാഷപ്പെടുത്തി
  alternative: קדש, בדל എന്നീ രണ്ടിനെയും ‘വേർതിരിക്കുക/വേർതിരിക്കപ്പെട്ടവർ’ എന്ന ഒരേ പദസമുച്ചയത്തിൽ പരിഭാഷപ്പെടുത്തുക
  rationale: മൂലവാക്യം യഹ്‌വേയുടെ വിശുദ്ധിയിൽ ജനത്തിന്റെ വിശുദ്ധിയെ അടിസ്ഥാനപ്പെടുത്തുകയും തുടർന്ന് ജനസമൂഹങ്ങളിൽനിന്നുള്ള വേർതിരിക്കലിന് വേറൊരു ക്രിയ ഉപയോഗിക്കുകയും ചെയ്യുന്നു. രണ്ടു പദങ്ങളും വേർതിരിക്കുന്നത് ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും പദവ്യത്യാസവും സംരക്ഷിക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘വിശുദ്ധൻ/വിശുദ്ധർ’ എന്ന പരമ്പരാഗത ദൈവശാസ്ത്രപദം നിലനിർത്തിക്കൊണ്ട് വാക്യഘടന സ്വാഭാവികമാക്കി. മുഖ്യവാക്യത്തിലെ [a] അടിക്കുറിപ്പുസൂചകം ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
