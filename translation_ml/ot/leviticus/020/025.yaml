source:
  edition: WLC
  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: ml
  text: അതുകൊണ്ട് ശുദ്ധമായ മൃഗവും അശുദ്ധമായ മൃഗവും തമ്മിലും അശുദ്ധമായ പക്ഷിയും ശുദ്ധമായ പക്ഷിയും തമ്മിലും നിങ്ങൾ വേർതിരിച്ചറിയണം. മൃഗത്താലോ പക്ഷിയാലോ നിലത്ത് ഇഴയുന്ന ഏതെങ്കിലും ജീവിയാലോ നിങ്ങളെത്തന്നെ അറപ്പുള്ളവരാക്കരുത്[a]; അവയെ ഞാൻ നിങ്ങൾക്കായി അശുദ്ധമെന്ന് വേർതിരിച്ചിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളെത്തന്നെ വെറുപ്പുളവാക്കുന്നവരാക്കരുത്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് ‘അറപ്പുള്ളത്, വെറുപ്പുളവാക്കുന്നത്’ എന്ന അർഥമാണ്; ‘അശുദ്ധമാകുക’ എന്നതിനുള്ള സാധാരണ പദമല്ല ഇത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അശുദ്ധമാക്കേണ്ടതിന്” അഥവാ “അശുദ്ധമായി കണക്കാക്കേണ്ടതിന്”; ഇവിടെ ദൈവം അവയെ ഇസ്രായേലിനായി അശുദ്ധവിഭാഗത്തിൽ വേർതിരിച്ചതാണ് ഉദ്ദേശ്യം.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: അതുകൊണ്ട് ... നിങ്ങൾ വേർതിരിച്ചറിയണം
  rationale: ഹിഫ്ഇൽ രൂപം വിഭാഗങ്ങൾ തമ്മിൽ വ്യത്യാസം തിരിച്ചറിഞ്ഞ് പാലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭബന്ധം വ്യക്തമാക്കാൻ וְ എന്ന ബന്ധകത്തെ ‘അതുകൊണ്ട്’ എന്നു നൽകി.
- source_word: הַבְּהֵמָה
  choice: മൃഗം
  rationale: ഇവിടെ കരജീവികളുടെ പൊതുവിഭാഗമാണ്; ‘കന്നുകാലി’ എന്നത് അനാവശ്യമായി അർഥം ചുരുക്കും.
- source_word: הַטְּהֹרָה / הַטְּמֵאָה / הַטָּמֵא / הַטָּהֹר
  choice: ശുദ്ധമായ / അശുദ്ധമായ
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരവും ഉടമ്പടിസംബന്ധവുമായ വിഭാഗങ്ങളെ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്ന പതിവുപദങ്ങൾ.
- source_word: הָעוֹף
  choice: പക്ഷി
  rationale: ഭക്ഷണനിയമങ്ങളുടെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും മനസ്സിലാക്കാൻ എളുപ്പവുമായ പൊതുപദം.
- source_word: וְלֹא תְשַׁקְּצוּ אֶת נַפְשֹׁתֵיכֶם
  choice: നിങ്ങളെത്തന്നെ അറപ്പുളവാക്കുന്നവരാക്കരുത്
  rationale: שׁקץ എന്ന ധാതുവിന്റെ ‘അറപ്പുള്ളത്/വെറുപ്പുളവാക്കുന്നത്’ എന്ന അർഥമേഖല നിലനിർത്തുന്നു; טמא എന്ന ‘അശുദ്ധമാകുക’ എന്ന ആശയവുമായി കലർത്തുന്നില്ല. נַפְשֹׁתֵיכֶם ഇവിടെ മുഴുവൻ വ്യക്തികളെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘നിങ്ങളെത്തന്നെ’ എന്നു നൽകി.
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: നിലത്തുകൂടി ഇഴയുന്ന ഏതെങ്കിലും ജീവിയാൽ
  rationale: רמשׂ നിലത്തോടു ചേർന്ന് നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഇഴയുന്ന ജീവി’ മലയാളത്തിൽ സ്വാഭാവികവും വിശാലവുമാണ്.
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם לְטַמֵּא
  choice: അവയെ ഞാൻ നിങ്ങൾക്കായി അശുദ്ധമെന്ന് വേർതിരിച്ചിരിക്കുന്നു
  rationale: ദൈവം ഇസ്രായേലിനായി ഈ ജീവികളെ അശുദ്ധവിഭാഗമായി നിശ്ചയിച്ചുവെന്ന വർഗീകരണാർഥം സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആചാരപരമായ വിഭാഗഭാഷയോ ധാർമികവൽക്കരിച്ച പരാവർത്തനമോ
  choice: ശുദ്ധം/അശുദ്ധം എന്ന ഉടമ്പടിസംബന്ധമായ ആചാരവിഭാഗങ്ങൾ
  alternative: നിർമലം/മലിനം അല്ലെങ്കിൽ ധാർമികമായി നല്ലത്/ചീത്ത
  rationale: വാക്യം ഇസ്രായേൽ പാലിക്കേണ്ട ഭക്ഷണ-വിശുദ്ധിനിയമങ്ങളിലെ വിഭാഗവ്യത്യാസത്തെക്കുറിച്ചാണ്; ധാർമികമോ ശുചിത്വപരമോ ആയ വ്യാഖ്യാനം ഇതിൽ ചേർക്കുന്നില്ല.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ അർഥം
  choice: മുഴുവൻ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ‘നിങ്ങളെത്തന്നെ’
  alternative: ‘നിങ്ങളുടെ ആത്മാക്കളെ’
  rationale: ഈ ഹീബ്രു പ്രയോഗത്തിൽ נֶפֶשׁ ശരീരത്തിൽനിന്ന് വേറിട്ട ഒരു ആത്മഘടകത്തെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല; വ്യക്തികളെത്തന്നെയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വ്യക്തതയും നിലനിർത്തി. ‘വേർതിരിച്ചറിയണം’ എന്നത് കല്പനയുടെ ശക്തിയും വിഭാഗവിവേചനത്തിന്റെ ആശയവും ഒരുമിച്ച് നൽകുന്നു. ആവർത്തനഘടന ഹീബ്രു വാക്യത്തിന്റെ ഊന്നൽ കാത്തുസൂക്ഷിക്കാൻ നിലനിർത്തി.
