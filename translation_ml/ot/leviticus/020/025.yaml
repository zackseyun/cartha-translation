revisions:
- from: അതുകൊണ്ട് ശുദ്ധമായ മൃഗവും അശുദ്ധമായ മൃഗവും തമ്മിലും അശുദ്ധമായ പക്ഷിയും ശുദ്ധമായ പക്ഷിയും തമ്മിലും നിങ്ങൾ വേർതിരിച്ചറിയണം. മൃഗത്താലോ പക്ഷിയാലോ നിലത്തുകൂടി ഇഴയുന്ന ഏതെങ്കിലും ജീവിയാലോ നിങ്ങളെത്തന്നെ അറപ്പുളവാക്കുന്നവരാക്കരുത്[a]; അവയെ ഞാൻ നിങ്ങൾക്കായി അശുദ്ധമെന്ന് വേർതിരിച്ചിരിക്കുന്നു[b].
  to: അതുകൊണ്ട് ശുദ്ധമായ മൃഗവും അശുദ്ധമായ മൃഗവും തമ്മിലും അശുദ്ധമായ പക്ഷിയും ശുദ്ധമായ പക്ഷിയും തമ്മിലും നിങ്ങൾ വേർതിരിച്ചറിയണം. മൃഗത്താലോ പക്ഷിയാലോ നിലത്ത് ഇഴയുന്ന ഏതെങ്കിലും ജീവിയാലോ നിങ്ങളെത്തന്നെ അറപ്പുള്ളവരാക്കരുത്[a]; അവയെ ഞാൻ നിങ്ങൾക്കായി അശുദ്ധമെന്ന് വേർതിരിച്ചിരിക്കുന്നു[b].
  rationale: The revision makes only two idiomatic improvements while preserving the Hebrew syntax and sense. It retains the existing footnote anchors and the notes' distinction between the שׁקץ terminology and ordinary ritual-uncleanness terminology.
