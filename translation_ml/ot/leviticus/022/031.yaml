  yaml_path: translation/ot/leviticus/022/031.yaml
  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: ml
  text: അതുകൊണ്ട് നിങ്ങൾ എന്റെ കല്പനകൾ പാലിക്കുകയും അവ അനുഷ്ഠിക്കുകയും വേണം. ഞാനാണ് യഹ്‌വേ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു; ‘യഹ്‌വേ’ എന്നും ലിപ്യന്തരണം ചെയ്യുന്നു.'
    reason: ദൈവനാമത്തിന്റെ പരമ്പരാഗത പരിഭാഷയും ലിപ്യന്തരണവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: അതുകൊണ്ട് നിങ്ങൾ … പ്രമാണിക്കുകയും വേണം
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ സന്ദർഭത്തിൽ שׁמר എന്നത് കല്പനകൾ ‘പ്രമാണിക്കുക/പാലിക്കുക’ എന്നാണ്. וּ എന്ന ബന്ധകത്തെ മുൻസന്ദർഭത്തോടുള്ള നിഗമനബന്ധം വ്യക്തമാക്കാൻ ‘അതുകൊണ്ട്’ എന്നു നൽകി.
- source_word: מִצְוֺתַי
  choice: എന്റെ കല്പനകൾ
  rationale: מִצְוָה എന്നതിന്റെ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഔപചാരിക ഭാവം ‘കല്പന’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: അവ അനുഷ്ഠിക്കുകയും വേണം
  rationale: עשה എന്നത് ഇവിടെ കല്പനകൾ പ്രവൃത്തിയിൽ നടപ്പാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രമാണിക്കുക’ എന്ന മുൻക്രിയയിൽ ലയിപ്പിക്കാതെ, എബ്രായത്തിലെ പ്രമാണിക്കൽ–അനുഷ്ഠിക്കൽ എന്ന ഇരട്ടപ്രയോഗം നിലനിർത്തി.
- source_word: אֲנִי יְהוָה
  choice: ഞാനാണ് യഹ്‌വേ
  rationale: അടിവരയിട്ട സ്വയംതിരിച്ചറിയിക്കൽ ഭാവം ‘ഞാനാണ്’ നിലനിർത്തുന്നു; יהוה എന്ന ഉടമ്പടിനാമം ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു. പരമ്പരാഗത സ്ഥാനപ്പേരും മറ്റൊരു പ്രചാരത്തിലുള്ള ലിപ്യന്തരണവും അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമപരമായ ശൈലി. ബഹുവചന അഭിസംബോധനയും ‘പ്രമാണിക്കുക/അനുഷ്ഠിക്കുക’ എന്ന വ്യത്യസ്ത ക്രിയകളും സംരക്ഷിച്ചു.
