reference: Leviticus 22:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: ml
  text: തനിയെ ചത്തതോ വന്യമൃഗങ്ങൾ കീറിയതോ ആയ മൃഗത്തിന്റെ മാംസം[a] അവൻ തിന്നരുത്; അതുമൂലം അവൻ അശുദ്ധനാകും. ഞാൻ യഹോവ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തനിയെ ചത്തതോ വന്യമൃഗങ്ങൾ കീറിയതോ ആയത്.”
    reason: നְבֵלָה, טְרֵפָה എന്നീ പദങ്ങൾ “മൃഗത്തിന്റെ മാംസം” എന്ന വിശദീകരണം ചേർക്കാതെയും വിവർത്തനം ചെയ്യാവുന്നതാണെന്ന് കാണിക്കുന്ന ശാബ്ദിക ബദൽ.
lexical_decisions:
- source_word: נְבֵלָה
  choice: തനിയെ ചത്ത മൃഗത്തിന്റെ മാംസം
  rationale: ശരിയായ അറവിലൂടെയല്ലാതെ സ്വാഭാവികമായോ മറ്റുവിധത്തിലോ ചത്ത മൃഗത്തിന്റെ ജഡത്തെയാണ് ഈ ഭക്ഷണനിയമസന്ദർഭത്തിൽ പദം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ഭക്ഷിക്കുന്ന വസ്തുവാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘മാംസം’ ചേർത്തു.
- source_word: וּטְרֵפָה
  choice: വന്യമൃഗങ്ങൾ കടിച്ചുകീറിയ മൃഗത്തിന്റെ മാംസം
  rationale: ഇരപിടിയൻ മൃഗങ്ങളാൽ കീറപ്പെട്ട മൃഗത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; മൂലപാഠത്തിൽ അന്തർലീനമായ കർത്താവിനെ മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: לֹא יֹאכַל
  choice: അവൻ തിന്നരുത്
  rationale: നിയമസന്ദർഭത്തിലെ നിഷേധാത്മക അപൂർണക്രിയ വിലക്കാണ് പ്രകടിപ്പിക്കുന്നത്; ‘തിന്നരുത്’ അതിന്റെ ബലം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: לְטָמְאָה בָהּ
  choice: അതിനാൽ അവൻ അശുദ്ധനാകും
  rationale: ഭക്ഷിക്കുന്നതിന്റെ ഫലമായി ആചാരപരമായി അശുദ്ധനാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഫലബന്ധം വ്യക്തമായി നിലനിർത്തി.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹോവ ആകുന്നു
  rationale: ദൈവനാമമായ יהוה പൊതുവായി പരിചിതമായ മലയാളരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റിയില്ല.
theological_decisions:
- issue: טמא എന്ന ആചാരശുദ്ധി പദത്തിന്റെ അർഥം
  choice: അശുദ്ധനാകും
  alternative: മലിനനാകും
  rationale: ഈ സന്ദർഭം ധാർമിക കുറ്റത്തേക്കാൾ പുരോഹിതന്റെ ആചാരപരമായ അശുദ്ധിയെക്കുറിച്ചാണ്; ‘അശുദ്ധൻ’ ആ വ്യത്യാസം കൂടുതൽ നേരിട്ട് സൂക്ഷിക്കുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം വിവർത്തനത്തിൽ നിലനിർത്തുകയും ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ. ‘തനിയെ ചത്തതോ … കടിച്ചുകീറിയതോ’ എന്ന സമാന്തരഘടന ഹീബ്രു പദജോടി നിലനിർത്തുന്നു; വാക്യം ഭക്ഷണത്തെക്കുറിച്ചാണെന്ന് വ്യക്തമാക്കാൻ ‘മൃഗത്തിന്റെ മാംസം’ ഒരിക്കൽ പൊതുവായി ചേർത്തിരിക്കുന്നു.
