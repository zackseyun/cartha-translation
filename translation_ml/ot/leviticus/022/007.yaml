source:
  edition: WLC
  text: וּ/בָ֥א הַ/שֶּׁ֖מֶשׁ וְ/טָהֵ֑ר וְ/אַחַר֙ יֹאכַ֣ל מִן הַ/קֳּדָשִׁ֔ים כִּ֥י לַחְמ֖/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: ml
  text: സൂര്യൻ അസ്തമിച്ചശേഷം അവൻ ശുദ്ധനാകും; അതിനുശേഷം അവന് വിശുദ്ധവസ്തുക്കളിൽനിന്ന്[a] ഭക്ഷിക്കാം, കാരണം അവ അവന്റെ ആഹാരമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശുദ്ധയാഗങ്ങളിൽനിന്ന്.”
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “അത് അവന്റെ അപ്പമാണ്.” ഇവിടെ “അപ്പം” എന്നത് വിശുദ്ധവിഹിതങ്ങളിൽനിന്ന് അവനു ലഭിക്കുന്ന ആഹാരത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിച്ചുകഴിയുമ്പോൾ
  rationale: ‘സൂര്യൻ വരുന്നു’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ ശൈലി ഇവിടെ സൂര്യാസ്തമയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; കാലക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְטָהֵר
  choice: അവൻ ശുദ്ധനാകും
  rationale: സൂര്യാസ്തമയത്തിനുശേഷം ആചാരപരമായ ശുദ്ധി പുനഃസ്ഥാപിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ധാർമിക നിർമലത എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: וְאַחַר
  choice: അതിനു ശേഷം
  rationale: നിയമത്തിലെ അടുത്ത ഘട്ടം ലളിതവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: יֹאכַל
  choice: അവന് ... ഭക്ഷിക്കാം
  rationale: ഇവിടത്തെ അപൂർണക്രിയ ശുദ്ധി വീണ്ടെടുത്തശേഷമുള്ള അനുമതിയെ സൂചിപ്പിക്കുന്നു; വെറും ഭാവികാലത്തേക്കാൾ ‘ഭക്ഷിക്കാം’ അത് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: מִן הַקֳּדָשִׁים
  choice: വിശുദ്ധവസ്തുക്കളിൽനിന്ന്
  rationale: קדשים എന്ന ബഹുവചനത്തെ സുതാര്യമായി പരിഭാഷപ്പെടുത്തുന്നു; സന്ദർഭത്തിൽ വിശുദ്ധയാഗങ്ങളുടെ പുരോഹിതവിഹിതം ഉദ്ദേശിക്കാമെങ്കിലും അത് മുഖ്യപാഠത്തിൽ വിശദീകരിച്ച് ചുരുക്കുന്നില്ല.
- source_word: כִּי לַחְמוֹ הוּא
  choice: കാരണം അവ അവന്റെ ആഹാരമാണ്
  rationale: לֶחֶם അക്ഷരാർഥത്തിൽ ‘അപ്പം’ ആണെങ്കിലും ഇവിടെ ഉപജീവനത്തിനുള്ള ഭക്ഷണവിഹിതം എന്ന വിശാലാർഥമുണ്ട്. എബ്രായത്തിലെ ഏകവചനപ്രയോഗം മുൻപുള്ള വിശുദ്ധവസ്തുക്കളെ സമാഹാരമായി കാണുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനമായ ‘അവ’ ഉപയോഗിച്ചു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: ശുദ്ധി എന്ന ഭാഷയുടെ സ്വഭാവം
  choice: ആചാരപരമായ ശുദ്ധി സൂചിപ്പിക്കുന്ന ‘ശുദ്ധനാകും’
  alternative: ധാർമികമോ ആത്മീയമോ ആയ നിർമലത
  rationale: ലേവ്യപുസ്തകം 22-ലെ സന്ദർഭം അശുദ്ധാവസ്ഥയ്ക്കുശേഷം പുരോഹിതന് വിശുദ്ധഭക്ഷണം കഴിക്കാനുള്ള അവകാശം പുനഃസ്ഥാപിക്കുന്നതാണ്. മുഖ്യപാഠം ‘ശുദ്ധൻ’ എന്നു മാത്രം പറഞ്ഞ് ആചാരപരമായ അർഥം സന്ദർഭം നിർണ്ണയിക്കാൻ വിടുന്നു.
- issue: לַחְמוֹ הוּא എന്നതിലെ ഏകവചനവും קדשים എന്നതിലെ ബഹുവചനവും
  choice: സ്വാഭാവിക മലയാളത്തിൽ ‘അവ അവന്റെ ആഹാരമാണ്’
  alternative: ‘അത് അവന്റെ അപ്പമാണ്’
  rationale: എബ്രായത്തിലെ ഏകവചനം വിശുദ്ധവസ്തുക്കളെ ഒരു സമാഹാരഭക്ഷണവിഹിതമായി പരാമർശിക്കാം. ബഹുവചന മുൻപദത്തോടുള്ള സ്വാഭാവിക മലയാള പൊരുത്തം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചെങ്കിലും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി. ‘വിശുദ്ധവസ്തുക്കൾ’ എന്ന പദം മൂലപാഠത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; ‘ആഹാരം’ സാധാരണ വായനക്കാർക്ക് ലളിതമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
