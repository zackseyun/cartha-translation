source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: ml
  text: 'അവരോടു പറയുക: നിങ്ങളുടെ തലമുറകളിലുടനീളം, നിങ്ങളുടെ സന്തതികളിൽ ഏതെങ്കിലും പുരുഷൻ, അവന്റെ അശുദ്ധി അവന്റെമേൽ നിലനിൽക്കുമ്പോൾ, ഇസ്രായേൽമക്കൾ യഹ്‌വേക്കു വിശുദ്ധീകരിക്കുന്ന വിശുദ്ധവസ്തുക്കളുടെ അടുത്തു വന്നാൽ, ആ വ്യക്തി എന്റെ സന്നിധിയിൽനിന്ന് ഛേദിക്കപ്പെടും.[a] ഞാൻ യഹ്‌വേ ആകുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഛേദിക്കപ്പെടും” എന്നത് ഉടമ്പടിസംബന്ധിയായ പതിവ് ശിക്ഷാപ്രയോഗമാണ്; നീക്കം എങ്ങനെ നടപ്പാകുന്നു എന്നതിനെക്കുറിച്ച് വ്യത്യസ്ത വ്യാഖ്യാനങ്ങളുണ്ട്. “എന്റെ സന്നിധിയിൽനിന്ന്” എന്നതിന് “എന്റെ മുമ്പിൽനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകളിലുടനീളം
  rationale: തുടർന്നുവരുന്ന തലമുറകളിലെല്ലാം നിയമം ബാധകമാണെന്ന ഉടമ്പടിസംബന്ധിയായ പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל אִישׁ אֲשֶׁר ... מִכָּל זַרְעֲכֶם
  choice: നിങ്ങളുടെ സന്തതികളിൽ ഏതെങ്കിലും പുരുഷൻ
  rationale: സന്ദർഭം അഹരോന്യ പുരോഹിതവംശത്തിലെ പുരുഷനെ സൂചിപ്പിക്കുന്നതിനാൽ אִישׁ എന്ന പുല്ലിംഗരൂപവും זֶרַע എന്ന വംശപരമായ ആശയവും നിലനിർത്തുന്നു.
- source_word: יִקְרַב
  choice: അടുത്തു വന്നാൽ
  rationale: പുരോഹിതീയ പശ്ചാത്തലത്തിലെ വിശുദ്ധവസ്തുക്കളോടുള്ള സമീപനത്തെ സൂചിപ്പിക്കുന്ന קרב എന്ന ക്രിയയുടെ സ്ഥലപരവും ആചാരപരവുമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: הַקֳּדָשִׁים
  choice: വിശുദ്ധവസ്തുക്കൾ
  rationale: അർപ്പണങ്ങൾ ഉൾപ്പെടുന്നെങ്കിലും അവയിൽ മാത്രം ഒതുങ്ങാത്ത വിശാലമായ ബഹുവചനപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יַקְדִּישׁוּ
  choice: വിശുദ്ധീകരിക്കുന്ന
  rationale: ഹിഫിൽ രൂപത്തിലെ ‘വിശുദ്ധമായി വേർതിരിക്കുക/പ്രതിഷ്ഠിക്കുക’ എന്ന ആചാരപരമായ അർഥം നൽകുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ ഔപചാരിക ജനവിഭാഗനാമത്തിന്റെ രൂപം മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: തന്റെ അശുദ്ധി അവന്റെമേൽ ഇരിക്കുമ്പോൾ
  rationale: ‘അവൻ അശുദ്ധനായിരിക്കുമ്പോൾ’ എന്നു പരത്താതെ, അശുദ്ധി വ്യക്തിയുടെമേൽ നിലനിൽക്കുന്നു എന്ന മൂലപാഠത്തിലെ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
- source_word: וְנִכְרְתָה
  choice: ഛേദിക്കപ്പെടണം
  rationale: כרת നിഫാൽ രൂപത്തിലെ ഉടമ്പടിപരമായ ശിക്ഷാസൂത്രം മരണമായോ സമൂഹഭ്രഷ്ടതയായോ നിർവചിക്കാതെ നിലനിർത്തുന്നു.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ആ വ്യക്തി
  rationale: നിയമപ്രയോഗത്തിൽ נֶפֶשׁ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: מִלְּפָנַי
  choice: എന്റെ സന്നിധിയിൽനിന്ന്
  rationale: ‘എന്റെ മുഖത്തിനു മുമ്പിൽനിന്ന്’ എന്ന അക്ഷരാർഥത്തിന്റെ സാന്നിധ്യസൂചന മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ പദവിപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: וְנִכְרְתָה എന്ന ശിക്ഷാസൂത്രത്തിന്റെ കൃത്യമായ വിധം
  choice: ഛേദിക്കപ്പെടണം
  alternative: കൊല്ലപ്പെടണം; സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടണം; ഉടമ്പടിസ്ഥാനത്തിൽനിന്ന് നീക്കപ്പെടണം
  rationale: വാക്യം ശിക്ഷ നടപ്പാകുന്ന രീതി വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനവിവാദം പരിഹരിക്കാതെ മൂലത്തിലെ ഉടമ്പടിപരമായ സൂത്രം നിലനിർത്തുന്നു.
- issue: מִלְּפָנַי എന്നതിന്റെ ബന്ധം
  choice: എന്റെ സന്നിധിയിൽനിന്ന് ഛേദിക്കപ്പെടണം
  alternative: എന്റെ മുമ്പിൽനിന്ന് ഛേദിക്കപ്പെടണം
  rationale: ദൈവസാന്നിധ്യത്തിൽനിന്നുള്ള നീക്കം എന്ന അർഥസാധ്യത സംരക്ഷിക്കുമ്പോഴും ശിക്ഷയുടെ പ്രായോഗിക രീതി നിർണ്ണയിക്കുന്നില്ല.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഹീബ്രു മൂലത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആചാര ശൈലി. ‘വിശുദ്ധവസ്തുക്കൾ’, ‘അശുദ്ധി’, ‘ഛേദിക്കപ്പെടണം’ എന്നിവ മൂലത്തിലെ പുരോഹിതീയവും ഉടമ്പടിപരവുമായ പദസാന്ദ്രത സംരക്ഷിക്കുന്നു; ശിക്ഷയുടെ സ്വഭാവം അതിവ്യക്തമാക്കുന്നില്ല.
