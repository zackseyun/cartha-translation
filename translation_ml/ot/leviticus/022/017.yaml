id: LEV.22.17
reference: Leviticus 22:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ[a] മോശെയോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: YHWH; ‘യഹോവ’ എന്നും ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു.'
    reason: ദൈവനാമത്തിന്റെ ഹീബ്രു വ്യഞ്ജനരൂപവും മറ്റൊരു പ്രചാരമുള്ള ലിപ്യന്തരവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ വയിക്തോൽ രൂപം പുതിയൊരു ദൈവിക അരുളപ്പാടിനെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പതിവുസൂത്രത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണ് ‘സംസാരിച്ചു’.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമമായ YHWH ഒരു പദവികൊണ്ട് മാറ്റിസ്ഥാപിക്കാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֶל
  choice: -ഓടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു മുൻപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദാതൃവിഭക്തി രൂപം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള മാനക ലിപ്യന്തരണം.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: ലֵאמֹר എന്ന ഹീബ്രു സൂത്രവാക്യം തുടർന്നുള്ള നേരിട്ടുള്ള അരുളപ്പാടിനെ പരിചയപ്പെടുത്തുന്നു. ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അസ്വാഭാവിക ആവർത്തനത്തിനു പകരം മലയാളത്തിലെ ദ്വിബിന്ദു അതിന്റെ വാക്യപ്രവർത്തനം വ്യക്തമായി നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠം YHWH എന്ന വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ഉച്ചാരണത്തിലെ ചരിത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു അരുളപ്പാട്-സൂത്രത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുമ്പോൾ, לֵאמֹר എന്നത് പദാനുപദമായി ആവർത്തിക്കാതെ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിച്ചു.
