id: LEV.22.30
reference: Leviticus 22:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יֵאָכֵ֔ל לֹֽא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: ml
  text: അത് അന്നുതന്നെ ഭക്ഷിക്കണം[a]; അതിൽ ഒരു ഭാഗവും പ്രഭാതംവരെ ശേഷിപ്പിക്കരുത്. ഞാൻ യഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആ ദിവസം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നുതന്നെ
  rationale: പദാനുപദമായി ‘ആ ദിവസം’ എന്നാണെങ്കിലും, യാഗാർപ്പണത്തിന്റെ അതേ ദിവസംതന്നെ ഭക്ഷിക്കണമെന്ന സന്ദർഭത്തിലെ അടിയന്തര കാലപരിധി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יֵאָכֵל
  choice: അതു ഭക്ഷിക്കണം
  rationale: നിഫാൽ രൂപം ഇവിടെ നിഷ്ക്രിയമായ നിയമനിർദേശമാണ്. മലയാളത്തിൽ ‘ഭക്ഷിക്കപ്പെടണം’ എന്നത് കൃത്രിമമായി തോന്നുന്നതിനാൽ, അർഥവും നിർദേശത്തിന്റെ ശക്തിയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֹא תוֹתִירוּ
  choice: ശേഷിപ്പിക്കരുത്
  rationale: יתר എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപം ‘ബാക്കിവെക്കുക/ശേഷിപ്പിക്കുക’ എന്നാണ്; നിരോധനത്തിന്റെ നേരിട്ടുള്ള ശക്തി ഈ പ്രയോഗം സൂക്ഷിക്കുന്നു.
- source_word: מִמֶּנּוּ
  choice: അതിൽ ഒന്നും
  rationale: യാഗമാംസത്തിൽ ഒരു ഭാഗവും ശേഷിപ്പിക്കരുതെന്ന അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: עַד בֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: ഒറ്റരാത്രി സൂക്ഷിക്കരുതെന്ന കാലപരിധി നേരിട്ട് നൽകുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹോവ ആകുന്നു
  rationale: എബ്രായത്തിലെ ഉടമ്പടിനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു; ക്രിയയില്ലാത്ത സ്വയംപരിചയപ്പെടുത്തൽ സൂത്രവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി പൂർത്തിയാക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יהוהയുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ പ്രത്യേക ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. അസ്വാഭാവികമായ നിഷ്ക്രിയപ്രയോഗം ഒഴിവാക്കി മൂലത്തിലെ നിർബന്ധസ്വഭാവം നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് b മൂലപാഠവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല: ‘ഞാൻ യഹോവ ആകുന്നു’ എന്നത് പാഠത്തിന്റെ മുഖ്യവാക്യമാണ്, ‘പ്രഭാതംവരെ’ എന്നതിനുള്ള വ്യത്യസ്ത വായനയല്ല.'
