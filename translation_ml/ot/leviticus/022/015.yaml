id: LEV.22.15
reference: Leviticus 22:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: ml
  text: യിസ്രായേൽമക്കൾ യഹോവയ്ക്ക് അർപ്പിക്കുന്ന[a] വിശുദ്ധവസ്തുക്കളെ അവർ അശുദ്ധമാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അർപ്പിക്കുന്ന” എന്നതിന് അക്ഷരാർഥത്തിൽ “ഉയർത്തുന്ന” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: അശുദ്ധമാക്കരുത്
  rationale: പീലിൽ ഈ ക്രിയ വിശുദ്ധമായതിന്റെ വിശുദ്ധസ്വഭാവത്തെ ലംഘിക്കുക, അതിനെ സാധാരണമായി കണക്കാക്കുക എന്ന ആരാധനാസംബന്ധിയായ അർഥം വഹിക്കുന്നു. ‘അശുദ്ധമാക്കുക’ ആ ഭേദം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קָדְשֵׁי
  choice: വിശുദ്ധവസ്തുക്കൾ
  rationale: ‘വിശുദ്ധമായവ/വിശുദ്ധവസ്തുക്കൾ’ എന്ന വിശാലമായ അർഥം നിലനിർത്തി, ഇതിനെ ബലികളിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ സ്ഥിരമായ ഉടമ്പടിജനനാമമായ ‘യിസ്രായേലിന്റെ മക്കൾ’ എന്ന പ്രയോഗം സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר יָרִימוּ
  choice: അർപ്പിക്കുന്ന
  rationale: ഹിഫീൽ രൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘ഉയർത്തുന്ന’ എന്നും ആരാധനാസന്ദർഭത്തിൽ ‘സമർപ്പിക്കുന്ന/അർപ്പിക്കുന്ന’ എന്നും വരാം. മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകാൻ ‘അർപ്പിക്കുന്ന’ തെരഞ്ഞെടുത്തു; ദൃശ്യബിംബം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമമായ יהוה വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא
  choice: അശുദ്ധമാക്കരുത്
  rationale: നിയമസന്ദർഭത്തിലെ നിഷേധാത്മക അപൂർണക്രിയയെ മലയാളത്തിലെ സ്വാഭാവിക നിരോധനരൂപമായ ‘-രുത്’ കൊണ്ട് നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ പൊതുനാമമായ ‘കർത്താവ്’ എന്നതിനു പകരം ഉടമ്പടിനാമം മലയാളത്തിലെ പരിചിതരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: קָדְשֵׁי എന്നതിന്റെ പരിധി
  choice: വിശുദ്ധവസ്തുക്കൾ
  alternative: വിശുദ്ധയാഗങ്ങൾ
  rationale: സന്ദർഭം അർപ്പണങ്ങളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും നാമരൂപം സ്വതവേ വിശാലമാണ്; അതിനാൽ വ്യാഖ്യാനപരമായി യാഗങ്ങളിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. എബ്രായ വാക്യക്രമത്തെ നിർബന്ധമായി അനുകരിക്കാതെ ബന്ധവാക്യം സ്വാഭാവികമായി നാമത്തിന് മുമ്പിൽ വെച്ചു. ‘വിശുദ്ധവസ്തുക്കൾ’ എന്നത് മൂലത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
