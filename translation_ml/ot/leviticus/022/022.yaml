id: LEV.22.22
reference: Leviticus 22:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: ml
  text: കാഴ്ചയില്ലാത്തതോ, ഒടിവുള്ളതോ, അംഗഭംഗം വന്നതോ, അരിമ്പാറയോ ചൊറിയോ ത്വക്രോഗമോ ഉള്ളതോ ആയ മൃഗങ്ങളെ യഹ്‌വേക്കു അർപ്പിക്കരുത്; അവയിൽ ഒന്നിനെയും യഹ്‌വേക്കുള്ള ഭോജനയാഗമായി[a] യാഗപീഠത്തിന്മേൽ വെക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അഗ്നിയർപ്പണമായി” അല്ലെങ്കിൽ “തീയാൽ അർപ്പിക്കുന്ന യാഗമായി.”
    reason: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ പ്രധാന പകരംവിവർത്തനങ്ങൾ സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: കാഴ്ചയില്ലാത്തത്
  rationale: യാഗത്തിന് അയോഗ്യമാക്കുന്ന അന്ധതയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: שָׁבוּר
  choice: ഒടിവുള്ളത്
  rationale: അവയവത്തിലോ ശരീരത്തിലോ ഒടിവുള്ള മൃഗം എന്ന ആശയം അനാവശ്യമായ വിശദീകരണമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: חָרוּץ
  choice: അംഗഭംഗം വന്നത്
  rationale: വെട്ടുകയോ പിളർക്കുകയോ ചെയ്തതുമൂലമുള്ള ഗുരുതരമായ ശരീരവൈകല്യമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; വെറും ‘മുറിഞ്ഞത്’ എന്നതിനെക്കാൾ വ്യക്തം.
- source_word: יַבֶּלֶת
  choice: അരിമ്പാറ
  rationale: അസാധാരണമായ ത്വക്‌വളർച്ചയെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മലയാളപദം.
- source_word: גָרָב
  choice: പൊറ്റ
  rationale: കാണാവുന്ന ത്വക്‌ബാധയെയോ അതിന്റെ കട്ടപിടിച്ച പാടിനെയോ സൂചിപ്പിക്കുന്ന മൂർത്തമായ പദം; രോഗത്തിന്റെ കൃത്യമായ ആധുനിക നിർണയം അവകാശപ്പെടുന്നില്ല.
- source_word: יַלֶּפֶת
  choice: ത്വക്‌രോഗം
  rationale: കൃത്യമായ ചർമരോഗം ഏതെന്നത് അനിശ്ചിതമായതിനാൽ, തെറ്റായ വൈദ്യശാസ്ത്രകൃത്യത ഒഴിവാക്കി പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: תַקְרִיבוּ
  choice: അർപ്പിക്കരുത്
  rationale: ഹിഫിൽ രൂപത്തിന് യാഗസന്ദർഭത്തിലുള്ള ‘സമർപ്പിക്കുക/അർപ്പിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְאִשֶּׁה
  choice: ഭോജനയാഗം
  rationale: പുരോഹിതസാഹിത്യത്തിൽ തീയിലൂടെ ദൈവത്തിനു സമർപ്പിക്കുന്ന യാഗഭാഗത്തെ സൂചിപ്പിക്കുന്ന പദം; പ്രധാന പാഠത്തിൽ വായനാസൗകര്യം നൽകുകയും പരമ്പരാഗത പകരംവിവർത്തനം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: അവയിൽ ഒന്നിനെയും യാഗപീഠത്തിന്മേൽ വെക്കരുത്
  rationale: מֵהֶם എന്നതിന്റെ വിതരണാർഥവും യാഗപീഠത്തിലെ നിർദ്ദിഷ്ട പ്രവൃത്തിയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു / യഹ്‌വേക്കുള്ള
  rationale: തിരുനാമമായ יהוה നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു; ל എന്ന ബന്ധം ഓരോ വാക്യഘടനയ്ക്കും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള നിയമനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- issue: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ വിവർത്തനം
  choice: ഭോജനയാഗം
  alternative: അഗ്നിയർപ്പണം; തീയാൽ അർപ്പിക്കുന്ന യാഗം
  rationale: പദം തീയുമായി ബന്ധപ്പെട്ട യാഗാർപ്പണത്തെ സൂചിപ്പിക്കുമ്പോഴും അതിന്റെ വ്യുത്പത്തിയും കൃത്യമായ ബലിനിർവചനവും ചർച്ചാവിഷയമാണ്; പ്രധാന പാഠത്തിൽ ‘ഭോജനയാഗം’ സ്വീകരിച്ച് പ്രധാന പകരംവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വൈകല്യങ്ങളുടെ പട്ടിക മൂലപാഠത്തിന്റെ ക്രമത്തിൽ നിലനിർത്തി; മലയാളത്തിൽ പരാമർശവിഷയം വ്യക്തമാക്കാൻ ‘മൃഗങ്ങളെ’ ചേർത്തു. അടിക്കുറിപ്പ് ചേരേണ്ട ‘ഭോജനയാഗമായി’ എന്നിടത്താണ് [a] നൽകിയിരിക്കുന്നത്.
