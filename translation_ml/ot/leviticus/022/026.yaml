source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/026.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വേ[a] മോശെയോടു അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: YHWH (יהוה); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ വാവ്-തുടർച്ചാരൂപം പുതിയ ദൈവിക അരുളപ്പാട് അവതരിപ്പിക്കുന്നു; ആവർത്തിച്ചുവരുന്ന ഈ സൂത്രവാക്യത്തിൽ ‘സംസാരിച്ചു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു പദവികൊണ്ട് മാറ്റിസ്ഥാപിക്കാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: אֶל
  choice: -ഓടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל മലയാളത്തിൽ ‘മോശയോടു’ എന്ന വിഭക്തിരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: משה എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപമാണ് ‘മോശ’.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന വിരാമചിഹ്നം
  rationale: ‘പറഞ്ഞുകൊണ്ട്’ എന്ന യാന്ത്രിക പരിഭാഷ മലയാളത്തിൽ അസ്വാഭാവികമാണ്; לֵאמֹר വഹിക്കുന്ന ഉദ്ധരണി-ആമുഖ പ്രവർത്തനം കോളൻ സ്വാഭാവികമായി നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമത്തിന്റെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു; ഉച്ചാരണത്തിന്റെ ചരിത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ആവർത്തിക്കുന്ന ദൈവിക അരുളപ്പാട്-സൂത്രത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തി; അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വചനവുമായി ബന്ധിപ്പിക്കാൻ കോളൻ ഉപയോഗിച്ചു.
