reference: Leviticus 22:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שׁ֥וֹר וָ/שֶׂ֖ה שָׂר֣וּעַ וְ/קָל֑וּט נְדָבָה֙ תַּעֲשֶׂ֣ה אֹת֔/וֹ וּ/לְ/נֵ֖דֶר לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: ml
  text: എന്നാൽ, ഒരു കാളയ്‌ക്കോ ചെമ്മരിയാടിനോ ഒരു അവയവം അസാധാരണമായി നീണ്ടതോ ചുരുങ്ങിയതോ ആണെങ്കിൽ, അതിനെ സ്വമേധാദാനമായി അർപ്പിക്കാം[a]; എന്നാൽ നേർച്ചയാഗമായി അത് സ്വീകാര്യമാകുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ പൊതുവായി, “രൂപവൈകല്യമുള്ളതോ വളർച്ച മുരടിച്ചതോ.” എബ്രായപദങ്ങൾ ശരീരാനുപാതത്തിലെ വിരുദ്ധമായ രണ്ടു വൈകല്യങ്ങളെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשׁוֹר
  choice: ഒരു കാള
  rationale: שׁוֹר ഒരു ഗോവർഗമൃഗത്തെ സൂചിപ്പിക്കുന്നു; ബലിനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ഏകവചനമായ ‘കാള’ സ്വാഭാവികമാണ്.
- source_word: וָשֶׂה
  choice: ചെമ്മരിയാട്
  rationale: שֶׂה ആടുമാടുകളുടെ കൂട്ടത്തിൽപ്പെട്ട ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാം. ഇവിടെ പൊതുവായ ബലിമൃഗത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ പദമായി ‘ചെമ്മരിയാട്’ സ്വീകരിച്ചു.
- source_word: שָׂרוּעַ וְקָלוּט
  choice: ഒരു അവയവം നീളം കൂടിയതോ നീളം കുറഞ്ഞതോ
  rationale: ഇവ ശരീരാനുപാതത്തിലെ വിരുദ്ധമായ രണ്ട് വൈകല്യങ്ങളെ—നീണ്ടതും ചുരുങ്ങിയതും—സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. കൃത്യമായ ശരീരഘടനാപരമായ അർഥം അനിശ്ചിതമായതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: נְדָבָה
  choice: സ്വമേധാദാനം
  rationale: നിർബന്ധിത നേർച്ചയിൽനിന്നു വ്യത്യസ്തമായി സ്വമനസ്സോടെ സമർപ്പിക്കുന്ന വഴിപാടിനെയാണ് נְדָבָה സൂചിപ്പിക്കുന്നത്.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: അതിനെ ... അർപ്പിക്കാം
  rationale: അക്ഷരാർഥം ‘അതിനെ ചെയ്യുക/ആക്കുക’ എന്നാണെങ്കിലും, യാഗസന്ദർഭത്തിൽ മലയാളത്തിൽ ‘അർപ്പിക്കുക’ എന്നതാണ് സ്വാഭാവികവും സന്ദർഭോചിതവും.
- source_word: וּלְנֵדֶר
  choice: നേർച്ചനിറവേറ്റാനുള്ള യാഗമായി
  rationale: נֵדֶר എടുത്ത നേർച്ചയാൽ ബാധ്യമായ സമർപ്പണത്തെ സൂചിപ്പിക്കുന്നു; സ്വമേധാദാനത്തോടുള്ള വ്യത്യാസം വ്യക്തമാക്കാൻ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: לֹא יֵרָצֶה
  choice: അത് സ്വീകാര്യമാകുകയില്ല
  rationale: യാഗപരമായ സന്ദർഭത്തിൽ רצה എന്ന ക്രിയയുടെ നിഫാൽരൂപം അനുകൂലമായി സ്വീകരിക്കപ്പെടുക എന്ന അർഥം നൽകുന്നു.
theological_decisions:
- issue: שָׂרוּעַ, קָלוּט എന്നീ വൈകല്യപദങ്ങളുടെ സ്വഭാവം
  choice: ‘ഒരു അവയവം നീളം കൂടിയതോ നീളം കുറഞ്ഞതോ’ എന്ന നിർദിഷ്ട വിരുദ്ധജോടിയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘രൂപവൈകല്യമുള്ളതോ വളർച്ച മുരടിച്ചതോ’ എന്ന പൊതുവായ വിവർത്തനം.
  rationale: എബ്രായപദജോടി ശരീരത്തിലെ വിരുദ്ധാനുപാതങ്ങളെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. എന്നാൽ അവയുടെ കൃത്യമായ ശരീരഘടനാപരമായ സൂചന ഉറപ്പില്ലാത്തതിനാൽ ബദൽ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: സ്വമേധാദാനവും നേർച്ചയാഗവും തമ്മിലുള്ള വ്യത്യാസം
  choice: വൈകല്യമുള്ള മൃഗത്തെ സ്വമേധാദാനമായി അർപ്പിക്കാം, എന്നാൽ നേർച്ചനിറവേറ്റാനുള്ള യാഗമായി അത് സ്വീകാര്യമല്ല എന്ന വാക്യത്തിലെ സംഘർഷം അതേപടി നിലനിർത്തി.
  alternative: അർപ്പണത്തിന്റെ ഉപയോഗമോ യാഗപീഠത്തിലെ ദഹനമോ സംബന്ധിച്ച കൂടുതൽ വ്യാഖ്യാനം ചേർക്കുക.
  rationale: മൂലവാക്യം നൽകുന്നതിലധികം ആചാരപരമായ വിശദീകരണം ചേർക്കാതെ അതിലെ നിയമപരമായ വ്യത്യാസം മാത്രം പരിഭാഷയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ബലിനിയമത്തിന്റെ സാങ്കേതിക വ്യത്യാസം വ്യക്തമാക്കാൻ ‘സ്വമേധാദാനം’, ‘നേർച്ചനിറവേറ്റാനുള്ള യാഗം’, ‘സ്വീകാര്യമാകുക’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു.
