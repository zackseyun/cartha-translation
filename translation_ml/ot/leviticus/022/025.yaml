reference: Leviticus 22:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/יַּ֣ד בֶּן נֵכָ֗ר לֹ֥א תַקְרִ֛יבוּ אֶת לֶ֥חֶם אֱלֹהֵי/כֶ֖ם מִ/כָּל אֵ֑לֶּה כִּ֣י מָשְׁחָתָ֤/ם בָּ/הֶם֙ מ֣וּם בָּ֔/ם לֹ֥א יֵרָצ֖וּ לָ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: ml
  text: ഒരു വിദേശിയുടെ കൈയിൽനിന്ന് ഇവയിലൊന്നും നിങ്ങളുടെ ദൈവത്തിനുള്ള ആഹാരമായി[a] അർപ്പിക്കരുത്. കാരണം, അവയ്ക്ക് കേടുപാടുണ്ട്; അവയിൽ ഊനമുണ്ട്[b]. അവ നിങ്ങൾക്കുവേണ്ടി സ്വീകരിക്കപ്പെടുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ ദൈവത്തിന്റെ അപ്പമായി.’ ഇവിടെ ‘അപ്പം’ എന്നത് ദൈവത്തിനു സമർപ്പിക്കുന്ന ആഹാരത്തിനുള്ള എബ്രായ യാഗപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വൈകല്യമുണ്ട്.’ യാഗമൃഗത്തെ അയോഗ്യമാക്കുന്ന ഊനത്തെയാണ് എബ്രായ പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: מִיַּד എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ‘കൈയിൽനിന്ന്’ എന്ന രൂപം നിലനിർത്തുന്നു; ഇവിടെ അത് ഉറവിടത്തെയോ നൽകുന്ന വ്യക്തിയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: בֶּן נֵכָר
  choice: ഒരു വിദേശി
  rationale: അക്ഷരാർഥത്തിൽ ‘വിദേശിയുടെ മകൻ’ എന്നാണെങ്കിലും, ഇത് ഇസ്രായേല്യനല്ലാത്ത വിദേശ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
- source_word: תַקְרִיבוּ
  choice: അർപ്പിക്കരുത്
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ കൊണ്ടുവന്ന് അർപ്പിക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവത്തിനുള്ള ആഹാരം
  rationale: לֶחֶם സാധാരണയായി ‘അപ്പം’ എന്നാണെങ്കിലും, പുരോഹിതീയ യാഗഭാഷയിൽ ദൈവത്തിനു സമർപ്പിക്കുന്ന ആഹാരത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִכָּל אֵלֶּה
  choice: ഇവയിലൊന്നും
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ ഊനമുള്ള മൃഗങ്ങളിൽ ഏതൊന്നും എന്ന ഭാഗികവും നിഷേധാത്മകവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מָשְׁחָתָם
  choice: അവയുടെ കേടുപാട്
  rationale: മൃഗങ്ങളെ യാഗത്തിന് അയോഗ്യമാക്കുന്ന കേട്, വികലത, ദുഷിപ്പ് എന്നീ അർഥസാധ്യതകളെ ഉൾക്കൊള്ളുന്ന പൊതുവായ പദപ്രയോഗമാണിത്.
- source_word: מוּם
  choice: ഊനം
  rationale: ലേവ്യപുസ്തകം 21–22-ൽ യാഗമൃഗത്തെ അയോഗ്യമാക്കുന്ന ശാരീരിക വൈകല്യത്തിനുള്ള സ്ഥിരപദമാണ് מוּם; ‘ഊനം’ അത് സംക്ഷിപ്തവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: അവ നിങ്ങൾക്കുവേണ്ടി സ്വീകരിക്കപ്പെടുകയില്ല
  rationale: യാഗസന്ദർഭത്തിലെ רצה നിഫാൽ രൂപത്തിന്റെ സ്വീകരിക്കപ്പെടുക എന്ന അർഥവും לָכֶם എന്നതിലെ ‘നിങ്ങൾക്കുവേണ്ടി’ എന്ന ബന്ധവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യാഗസമ്മാനത്തിനുള്ള പുരോഹിതീയ പ്രയോഗം
  choice: നിങ്ങളുടെ ദൈവത്തിനുള്ള ആഹാരം
  alternative: നിങ്ങളുടെ ദൈവത്തിന്റെ അപ്പം
  rationale: വാക്യം യാഗമൃഗങ്ങളെക്കുറിച്ചായതിനാൽ ‘ആഹാരം’ എന്നത് പുരോഹിതീയ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥമായ ‘അപ്പം’ മാത്രമാണെന്ന തെറ്റിദ്ധാരണയും ഒഴിവാക്കുന്നു.
- issue: യാഗത്തിന്റെ സ്വീകരണം ആരോടു ബന്ധപ്പെട്ടിരിക്കുന്നു
  choice: അവ നിങ്ങൾക്കുവേണ്ടി സ്വീകരിക്കപ്പെടുകയില്ല
  alternative: അവ സ്വീകാര്യമാകുകയില്ല
  rationale: לָכֶם എന്ന ‘നിങ്ങൾക്കുവേണ്ടി/നിങ്ങളോടുള്ള ബന്ധത്തിൽ’ എന്ന ഘടകം ഒഴിവാക്കാതെ, യാഗത്തിന്റെ ദൈവിക സ്വീകരണത്തെ കുറിച്ചുള്ള വാചകത്തിന്റെ തുറന്ന നിലപാട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘കൈയിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗവും ‘അവയിൽത്തന്നെയുണ്ട്; അവയിൽ ഊനമുണ്ട്’ എന്ന ആവർത്തനവും ഉറവിടത്തിന്റെ ഊന്നലും ഘടനയും നിലനിർത്താൻ സൂക്ഷിച്ചു.
