reference: Leviticus 22:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: ml
  text: ഒരു കാളയോ ചെമ്മരിയാടോ കോലാടോ ജനിക്കുമ്പോൾ, അത് ഏഴു ദിവസം അതിന്റെ അമ്മയോടുകൂടെ കഴിയണം. എട്ടാം ദിവസംമുതൽ, യഹോവയ്ക്കുള്ള അഗ്നിയാഗാർപ്പണമായി അത് സ്വീകാര്യമായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയ്ക്കുള്ള ഭോജനാർപ്പണമായി.” എബ്രായപദം തീയിൽ അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: കാള
  rationale: യാഗത്തിനുള്ള ഗോവർഗമൃഗത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായ ഏകവചനമായി സ്വാഭാവികമാണ്; ഇവിടെ ലിംഗം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: כֶשֶׂב
  choice: ചെമ്മരിയാട്
  rationale: ഈ നിയമസന്ദർഭത്തിൽ കുഞ്ഞാടിനെ മാത്രമല്ല, ചെമ്മരിയാടുവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: עֵז
  choice: കോലാട്
  rationale: വ്യാകരണപരമായി സ്ത്രീലിംഗമാണെങ്കിലും ഇവിടെ മൃഗവർഗത്തിന്റെ പൊതുപേരാണ്.
- source_word: כִּי יִוָּלֵד
  choice: ജനിക്കുമ്പോൾ
  rationale: നിയമത്തിലെ ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്ന כִּי-യെയും ילד എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലെ കർമണിപ്രയോഗത്തെയും സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְהָיָה שִׁבְעַת יָמִים תַּחַת אִמּוֹ
  choice: അത് ഏഴു ദിവസം അതിന്റെ അമ്മയുടെ കീഴിൽ ഇരിക്കണം
  rationale: തുടർന്ന് ആ അവസ്ഥയിൽ കഴിയണമെന്ന ആശയം നൽകുകയും תַּחַת എന്നതിലെ 'കീഴിൽ' എന്ന മൂലദൃശ്യഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: എട്ടാം ദിവസംമുതൽ
  rationale: എട്ടാം ദിവസം ആരംഭിച്ച് തുടർന്നുള്ള കാലമൊട്ടാകെ എന്ന അർഥം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יֵרָצֶה
  choice: സ്വീകാര്യമായിരിക്കും
  rationale: യാഗമായി ദൈവസന്നിധിയിൽ അംഗീകാരം ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; യാഗം നിർബന്ധമായും അർപ്പിക്കപ്പെടും എന്ന് ഇതിലൂടെ പറയുന്നില്ല.
- source_word: לְקָרְבַּן אִשֶּׁה
  choice: ദഹനാർപ്പണമായി
  rationale: തീയിൽ അർപ്പിക്കുന്ന യാഗം എന്ന ആശയം മലയാളത്തിൽ ലളിതമായി അറിയിക്കുന്നു; ഈ എബ്രായ പദത്തിന്റെ കൃത്യമായ അർഥപരിധി വിവാദമുള്ളതിനാൽ അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യത സൂക്ഷിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത്, അർപ്പണത്തിന്റെ ദിശ/സ്വീകർത്താവ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ അർഥം
  choice: ദഹനാർപ്പണം
  alternative: ഭോജനാർപ്പണം
  rationale: തീയിൽ അർപ്പിക്കുന്നതുമായുള്ള ബന്ധം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; 'ഭോജനാർപ്പണം' എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകി അർഥവിവാദം മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. 'അമ്മയുടെ കീഴിൽ' എന്ന മൂലഭാഷാദൃശ്യം മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തി; സാങ്കേതിക യാഗപദത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
