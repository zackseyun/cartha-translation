revisions:
- from: കാളയോ ചെമ്മരിയാടോ കോലാടോ ജനിക്കുമ്പോൾ, അത് ഏഴു ദിവസം അതിന്റെ അമ്മയുടെ കീഴിൽ ഇരിക്കണം. എട്ടാം ദിവസംമുതൽ അത് യഹോവയ്ക്കുള്ള ദഹനാർപ്പണമായി സ്വീകാര്യമായിരിക്കും.[a]
