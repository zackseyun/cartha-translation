source:
  edition: WLC
  text: הַ/מּוֹצִ֤יא אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/033.yaml
  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായിരിക്കാൻ നിങ്ങളെ ഈജിപ്ത് ദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചവൻ ഞാനാണ്. ഞാൻ യഹ്‌വേ[a] ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: “YHWH”; പരമ്പരാഗതമായി “കർത്താവ്” എന്ന് വിവർത്തനം ചെയ്യുന്നു; മറ്റൊരു ലിപ്യന്തരരൂപം “യഹോവ” ആണ്.'
    reason: ദൈവനാമത്തിന്റെ പരമ്പരാഗത വിവർത്തനവും മറ്റൊരു ലിപ്യന്തരവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: הַמּוֹצִיא אֶתְכֶם
  choice: നിങ്ങളെ ... പുറപ്പെടുവിച്ചവൻ
  rationale: ഹിഫ്ഇൽ കർത്തൃവാചക കൃദന്തം യഹ്‌വേയെ വിശേഷിപ്പിക്കുന്നു. മലയാളത്തിൽ കൃദന്തരൂപം നിലനിർത്തുന്നത് സ്വാഭാവികവും മൂലരൂപത്തോട് അടുത്തതുമാണ്.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്ത് ദേശത്തുനിന്ന്
  rationale: പുറപ്പാടിനെ സൂചിപ്പിക്കുന്ന ഉടമ്പടി-സൂത്രവാക്യത്തിലെ ‘ഈജിപ്ത് ദേശം’ എന്ന പൂർണപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: നിങ്ങളുടെ ദൈവമായിരിക്കേണ്ടതിന്
  rationale: היה + ל എന്ന ബന്ധസൂചക ഉടമ്പടി-പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹ്‌വേ ആകുന്നു
  rationale: ക്രിയയില്ലാത്ത എബ്രായ തിരിച്ചറിയൽവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള നാലക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: לִהְיוֹת לָכֶם לֵאלֹהִים എന്ന ഉടമ്പടി-ബന്ധത്തിന്റെ അർഥം
  choice: നിങ്ങളുടെ ദൈവമായിരിക്കേണ്ടതിന്
  alternative: നിങ്ങൾക്കു ദൈവമായിരിക്കേണ്ടതിന്
  rationale: സ്വത്തവകാശം മാത്രം സൂചിപ്പിക്കാതെ ദൈവവും ജനവും തമ്മിലുള്ള ഉടമ്പടി-ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ പ്രസംഗകർത്താവിന്റെ വാക്കുകൾ തുടരുന്നതിനാൽ ‘ഞാനാണ്’ ചേർത്ത് എബ്രായ കൃദന്തത്തിന്റെ തിരിച്ചറിയൽബലം വ്യക്തമാക്കിയിരിക്കുന്നു; ദൈവനാമത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് [a] മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
