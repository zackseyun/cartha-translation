id: LEV.22.21
reference: Leviticus 22:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: ml
  text: ഒരു മനുഷ്യൻ യഹ്‌വേക്കു സമാധാനയാഗം അർപ്പിക്കുന്നുവെങ്കിൽ—ഒരു നേർച്ച നിറവേറ്റാനോ സ്വമേധായാഗമായോ, കന്നുകാലിക്കൂട്ടത്തിൽനിന്നോ ആട്ടിൻകൂട്ടത്തിൽനിന്നോ എടുത്തതായാലും—അത് സ്വീകാര്യമാകേണ്ടതിന് ഊനമില്ലാത്തതായിരിക്കണം; അതിൽ യാതൊരു വൈകല്യവും ഉണ്ടാകരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישׁ כִּי יַקְרִיב
  choice: ഒരു മനുഷ്യൻ ... അർപ്പിക്കുമ്പോൾ
  rationale: אִישׁ എന്ന പുല്ലിംഗ ഏകവചനത്തെ ‘ഒരു മനുഷ്യൻ’ എന്നു നിലനിർത്തുന്നു; ഈ നിയമവാക്യത്തിലെ כִּי യാഥാർഥ്യസാധ്യതയുള്ള സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘അർപ്പിക്കുമ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: זֶבַח שְׁלָמִים
  choice: സമാധാനയാഗം
  rationale: ശ്ലം എന്ന ധാതുവുമായുള്ള സമാധാനം/സമ്പൂർണത എന്ന പദബന്ധം കാത്തുസൂക്ഷിക്കുന്ന പതിവായ യാഗസാങ്കേതിക പദം; ‘കൂട്ടായ്മയാഗം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ വിവർത്തനം ഒഴിവാക്കി.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: ദൈവനാമമായ יהוהയെ ബഹുമാനപദവി ഉപയോഗിച്ച് പകരംവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; ദിശാസൂചകമായ לְ പ്രത്യയം ‘-ക്കു’കൊണ്ട് നൽകി.
- source_word: לְפַלֵּא נֶדֶר
  choice: ഒരു നേർച്ച നിറവേറ്റാൻ
  rationale: ഈ യാഗനിയമസന്ദർഭത്തിൽ פלא എന്ന ക്രിയ നേർച്ചയായി വാഗ്ദാനം ചെയ്തതു നിർവഹിക്കുന്നതിനെയോ തീർക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; ‘നിറവേറ്റാൻ’ സ്വാഭാവികവും അർത്ഥകൃത്യവുമാണ്.
- source_word: אוֹ לִנְדָבָה
  choice: അല്ലെങ്കിൽ സ്വമേധായാഗമായി
  rationale: נְדָבָה നേർച്ചയിൽനിന്നു വ്യത്യസ്തമായ, സ്വമനസ്സാലുള്ള അർപ്പണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നോ ആട്ടിൻകൂട്ടത്തിൽനിന്നോ
  rationale: בקר, צאן എന്നീ രണ്ടു വിശാല വളർത്തുമൃഗവിഭാഗങ്ങളെ വ്യക്തമാക്കുന്നു; צאן ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളാവുന്നതിനാൽ പൊതുവായ ‘ആട്ടിൻകൂട്ടം’ ഉപയോഗിച്ചു.
- source_word: תָּמִים
  choice: ഊനമില്ലാത്തത്
  rationale: യാഗമൃഗത്തിന്റെ ശാരീരിക സമ്പൂർണതയും അംഗീകരണയോഗ്യതയും സൂചിപ്പിക്കുന്നു.
- source_word: לְרָצוֹן
  choice: സ്വീകാര്യമാകേണ്ടതിന്
  rationale: ദൈവസന്നിധിയിൽ യാഗം അംഗീകരിക്കപ്പെടുന്നതാണ് സന്ദർഭാർത്ഥം; ‘പ്രീതിക്കായി’ എന്ന സാദ്ധ്യമായ അർത്ഥത്തേക്കാൾ ഇവിടെ സ്വീകാര്യത വ്യക്തമാക്കുന്നു.
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: അതിൽ യാതൊരു വൈകല്യവും ഉണ്ടാകരുത്
  rationale: מוּם യാഗത്തിന് അയോഗ്യത വരുത്തുന്ന ശാരീരിക ദോഷമാണ്; മുൻപത്തെ ‘ഊനമില്ലാത്തത്’ ആവർത്തിക്കാതെ നിയമനിബന്ധന വ്യക്തമായി പറയുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു ബഹുമാനപദവിയാക്കി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- issue: אִישׁ എന്ന നിയമവിഷയത്തിന്റെ ലിംഗസൂചന
  choice: ഒരു മനുഷ്യൻ
  alternative: ആരെങ്കിലും / ഒരു വ്യക്തി
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം പ്രതിനിധാനപരമായ നിയമപ്രയോഗത്തിലാണെങ്കിലും അതിന്റെ വ്യാകരണരൂപം മായ്ച്ചുകളയാതെ നിലനിർത്തി.
- issue: שְׁלָמִים എന്ന യാഗനാമം
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം
  rationale: ‘കൂട്ടായ്മ’ യാഗത്തിന്റെ സാമൂഹിക വശം വ്യാഖ്യാനാത്മകമായി മുൻനിർത്തുന്നു; ‘സമാധാനം’ മൂലപദത്തിന്റെ ശബ്ദാർഥബന്ധവും പരമ്പരാഗത യാഗനാമവും കാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം യാഗനിയമത്തിന്റെ ഗൗരവവും സാങ്കേതിക കൃത്യതയും നിലനിർത്തി. ദീർഘവാക്യത്തിന്റെ വ്യവസ്ഥയും ഫലവും ഡാഷുകൾകൊണ്ട് വ്യക്തമായി വേർതിരിച്ചു; അനാവശ്യ മതവിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
