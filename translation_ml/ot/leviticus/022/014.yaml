source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יֹאכַ֥ל קֹ֖דֶשׁ בִּ/שְׁגָגָ֑ה וְ/יָסַ֤ף חֲמִֽשִׁית/וֹ֙ עָלָ֔י/ו וְ/נָתַ֥ן לַ/כֹּהֵ֖ן אֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: ml
  text: ഒരു മനുഷ്യൻ[a] വിശുദ്ധവസ്തു[b] അബദ്ധത്തിൽ[c] ഭക്ഷിച്ചാൽ, അതിന്റെ അഞ്ചിലൊന്ന് അതിനോടു കൂട്ടിച്ചേർത്ത്[d] വിശുദ്ധവസ്തു പുരോഹിതനു കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആരെങ്കിലും” / “ഒരു വ്യക്തി.” ഹീബ്രുവിൽ പുല്ലിംഗ ഏകവചനമായ “ഒരു മനുഷ്യൻ”; നിയമവാക്യത്തിൽ ഇത് പൊതുവായ അർഥത്തിൽ പ്രയോഗിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: “വിശുദ്ധവസ്തു” എന്നത് പുരോഹിതർക്കായി വേർതിരിച്ച സമർപ്പിത ഭക്ഷണമോ സ്വത്തോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: 'അഥവാ: “അറിയാതെ” / “തെറ്റായി.”'
    reason: lexical_alternative
  - marker: d
    text: 'അക്ഷരാർഥത്തിൽ: “അതിന്റെ അഞ്ചിലൊന്ന് അതിന്മേൽ ചേർത്ത്.” അതായത്, നഷ്ടപരിഹാരമായി അഞ്ചിലൊന്ന് അധികം നൽകുക.'
    reason: translation_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: ഒരു മനുഷ്യൻ
  rationale: אִישׁ എന്നത് വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണ്. നിയമവാക്യത്തിൽ പൊതുവായ അർഥത്തിലും വരാമെങ്കിലും മൂലരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: -ച്ചാൽ
  rationale: സാഹചര്യാധിഷ്ഠിതമായ നിയമവ്യവസ്ഥ അവതരിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാള നിബന്ധനാരൂപം ഉപയോഗിച്ചു.
- source_word: יֹאכַל
  choice: ഭക്ഷിച്ചാൽ
  rationale: ഭക്ഷിക്കാവുന്ന സമർപ്പിത വസ്തുവിനെക്കുറിച്ചുള്ള നിയമസന്ദർഭത്തിൽ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: קֹדֶשׁ
  choice: വിശുദ്ധവസ്തു
  rationale: പൗരോഹിത്യ ഉപയോഗത്തിനായി വേർതിരിച്ച ഭക്ഷണമോ സമർപ്പിത സ്വത്തോ സൂചിപ്പിക്കാവുന്ന വിശാലമായ പദമാണ്; ‘വിശുദ്ധഭക്ഷണം’ എന്നു ചുരുക്കി നിർവചിക്കുന്നില്ല.
- source_word: בִּשְׁגָגָה
  choice: അബദ്ധത്തിൽ
  rationale: മനഃപൂർവമായ ലംഘനമല്ല, അറിയാതെയോ തെറ്റായോ സംഭവിച്ച പ്രവൃത്തിയാണെന്ന നിയമപരമായ വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: וְיָסַף חֲמִשִׁיתוֹ עָלָיו
  choice: അതിന്റെ അഞ്ചിലൊന്ന് അതിനോടു കൂട്ടിച്ചേർത്ത്
  rationale: മൂലവസ്തുവിനോ അതിന്റെ മൂല്യത്തിനോ അഞ്ചിലൊന്ന് അധികമായി ചേർക്കണമെന്ന ഹീബ്രു പ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְנָתַן
  choice: കൊടുക്കണം
  rationale: നിയമത്തിലെ നിർബന്ധസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לַכֹּהֵן
  choice: പുരോഹിതനു
  rationale: നിർദ്ദിഷ്ടമായ പൗരോഹിത്യ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶת הַקֹּדֶשׁ
  choice: വിശുദ്ധവസ്തു
  rationale: ആദ്യത്തെ קֹדֶשׁ എന്ന പദവുമായുള്ള ആവർത്തനബന്ധം കാത്തുസൂക്ഷിക്കുകയും ‘വിശുദ്ധവിഹിതം’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നിയമവാക്യത്തിലെ പൊതുവായി പ്രയോഗിക്കാവുന്ന പുല്ലിംഗരൂപം
  choice: മുഖ്യപാഠത്തിൽ ‘ഒരു മനുഷ്യൻ’ എന്നു നിലനിർത്തി
  alternative: ‘ആരെങ്കിലും’ / ‘ഒരു വ്യക്തി’
  rationale: മൂലപാഠത്തിലെ אִישׁ പുല്ലിംഗ ഏകവചനമാണെങ്കിലും ഈ നിയമം പൊതുവായി ബാധകമായിരിക്കാം; ആ വ്യാപ്തി അടിക്കുറിപ്പിൽ അറിയിച്ച് രൂപപരമായ പ്രത്യേകത മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: തിരിച്ചുനൽകേണ്ട വിശുദ്ധ വസ്തുവിന്റെ സ്വഭാവം
  choice: രണ്ടിടത്തും ‘വിശുദ്ധവസ്തു’
  alternative: ‘വിശുദ്ധഭക്ഷണം’ / ‘വിശുദ്ധവിഹിതം’
  rationale: കഴിക്കപ്പെട്ടത് സമർപ്പിത ഭക്ഷണമോ വസ്തുവോ ആകാമെന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; വാക്യം പറയുന്നതിലധികം നിർണ്ണയിക്കുന്നില്ല.
- issue: അഞ്ചിലൊന്ന് ചേർക്കുന്നതിന്റെ ആശയം
  choice: ‘അതിന്റെ അഞ്ചിലൊന്ന് അതിനോടു കൂട്ടിച്ചേർത്ത്’
  alternative: ‘ഇരുപതു ശതമാനം അധികം നൽകി’
  rationale: ഹീബ്രുവിലെ ഭിന്നസംഖ്യാരൂപവും മൂലതുകയോടുള്ള കൂട്ടിച്ചേർക്കലും സംരക്ഷിക്കുന്നു; ആധുനിക ശതമാനഭാഷ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘കൊടുക്കണം’ നിർബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു. ‘വിശുദ്ധവസ്തു’ എന്ന ആവർത്തനം ഹീബ്രു പദബന്ധം നിലനിർത്തുന്നു; അടിക്കുറിപ്പുകൾ പാഠത്തിൽ [a]–[d] ആയി എല്ലാം അടയാളപ്പെടുത്തിയിരിക്കുന്നു.
