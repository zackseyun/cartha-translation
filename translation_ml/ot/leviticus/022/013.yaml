  to: എന്നാൽ, ഒരു പുരോഹിതന്റെ മകൾ വിധവയോ വിവാഹമോചിതയോ ആകുകയും അവൾക്കു സന്തതിയില്ലാതിരിക്കുകയും, യൗവനത്തിൽ എന്നപോലെ തന്റെ അപ്പന്റെ വീട്ടിലേക്കു മടങ്ങിവരികയും ചെയ്താൽ, അവൾക്ക് അപ്പന്റെ ഭക്ഷണത്തിൽനിന്ന് കഴിക്കാം[a]; എന്നാൽ അർഹതയില്ലാത്ത ആരും അതിൽനിന്ന് കഴിക്കരുത്[b].
