reference: Leviticus 22:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: ml
  text: എന്നാൽ, ഒരു പുരോഹിതന്റെ മകൾ വിധവയോ വിവാഹമോചിതയോ ആകുകയും അവൾക്കു സന്തതിയില്ലാതിരിക്കുകയും, യൗവനത്തിൽ എന്നപോലെ തന്റെ അപ്പന്റെ വീട്ടിലേക്കു മടങ്ങിവരികയും ചെയ്താൽ, അവൾക്ക് അപ്പന്റെ ഭക്ഷണത്തിൽനിന്ന് കഴിക്കാം[a]; എന്നാൽ അർഹതയില്ലാത്ത ആരും അതിൽനിന്ന് കഴിക്കരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അപ്പന്റെ അപ്പത്തിൽനിന്ന്.’ ഇവിടെ ‘അപ്പം’ പുരോഹിതകുടുംബത്തിന്റെ ആഹാരവിഭവങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അനുമതിയില്ലാത്ത ആരും.’ ഹീബ്രുപദം വംശീയമായി വിദേശിയായ ഒരാളെയല്ല, അനുവദിക്കപ്പെട്ട പുരോഹിതവൃത്തത്തിനു പുറത്തുള്ള ഒരാളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה
  choice: എന്നാൽ ഒരു പുരോഹിതന്റെ മകൾ ... ആയിട്ട്
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യവും നിയമപരമായ നിബന്ധനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה
  choice: വിധവയാകുകയോ വിവാഹമോചിതയാകുകയോ
  rationale: ഹീബ്രുവിലെ വാവ് ഇവിടെ ഒരേ സമയം ഉണ്ടാകേണ്ട രണ്ടു നിലകളല്ല, പകരമുള്ള രണ്ടു സാഹചര്യങ്ങളാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒
  choice: അവൾക്കു സന്തതിയില്ലാതെ
  rationale: זֶרַע എന്നത് അക്ഷരാർഥത്തിൽ ‘വിത്ത്’ ആണെങ്കിലും കുടുംബ-നിയമസന്ദർഭത്തിൽ മക്കളെയോ സന്തതിയെയോ സൂചിപ്പിക്കുന്നു; ‘സന്തതി’ അതിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ
  choice: യൗവനകാലത്തെപ്പോലെ തന്റെ അപ്പന്റെ വീട്ടിലേക്കു മടങ്ങിവന്നാൽ
  rationale: അവൾ വിവാഹത്തിനു മുമ്പുണ്ടായിരുന്ന പിതൃഭവനത്തിലെ നിലയിലേക്കു മടങ്ങുന്നതെന്ന നിയമ-സാമൂഹിക ആശയം സംരക്ഷിക്കുന്നു.
- source_word: מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל
  choice: അവൾക്ക് അപ്പന്റെ ഭക്ഷണത്തിൽനിന്ന് കഴിക്കാം
  rationale: לֶחֶם അക്ഷരാർഥത്തിൽ ‘അപ്പം’ ആണെങ്കിലും ഇവിടെ പുരോഹിതകുടുംബത്തിനു ലഭ്യമായ ആഹാരവിഭവങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; תֹּאכֵל നിയമപരമായ അനുമതിയായി ‘കഴിക്കാം’ എന്നു നൽകി.
- source_word: וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ
  choice: എന്നാൽ അനധികൃതനായ ഒരാളും അതിൽനിന്ന് കഴിക്കരുത്
  rationale: പുരോഹിതനിയമത്തിലെ זָר വംശീയമായി വിദേശിയായവനെയല്ല, അനുമതിയുള്ള പുരോഹിതവൃത്തത്തിനു പുറത്തുള്ളയാളെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ‘അപ്പന്റെ ഭക്ഷണം’ എന്നതിന്റെ വ്യാപ്തി
  choice: לֶחֶם എന്നത് ‘ഭക്ഷണം’ എന്നു പരിഭാഷപ്പെടുത്തി പുരോഹിതകുടുംബത്തിനു ലഭ്യമായ ആഹാരവിഭവങ്ങളെ സൂചിപ്പിച്ചു.
  alternative: ‘അപ്പന്റെ അപ്പം’ എന്ന അക്ഷരാർഥപരമായ പരിഭാഷ.
  rationale: ലേവ്യപുസ്തകം 22-ന്റെ പശ്ചാത്തലം വിശുദ്ധവിഭവങ്ങൾ ഭക്ഷിക്കാനുള്ള അർഹതയാണ്; ‘ഭക്ഷണം’ എന്നത് ആ നിയമപരമായ ആശയം വ്യക്തമാക്കുമ്പോഴും വാചകം പറയുന്നതിലധികം പ്രത്യേകീകരിക്കുന്നില്ല.
- issue: זָר എന്ന പദത്തിന്റെ അർഥം
  choice: ‘അനധികൃതനായ ഒരാൾ’
  alternative: ‘അന്യൻ’ അല്ലെങ്കിൽ ‘വിദേശി’
  rationale: ഇവിടെ വേർതിരിവ് വംശീയതയുടെ അടിസ്ഥാനത്തിലല്ല, പുരോഹിതഭക്ഷണം കഴിക്കാനുള്ള അധികാരത്തിന്റെ അടിസ്ഥാനത്തിലാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു വ്യക്തവും നിയമവാക്യത്തിനു യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘സന്തതി’ മൂലപദത്തിന്റെ വിശാലതയും ‘അനധികൃതനായ ഒരാൾ’ പുരോഹിതനിയമത്തിലെ അർഹതാഭേദവും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
