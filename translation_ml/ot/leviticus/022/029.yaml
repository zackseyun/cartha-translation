source:
  edition: WLC
  text: וְ/כִֽי תִזְבְּח֥וּ זֶֽבַח תּוֹדָ֖ה לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/029.yaml
  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: ml
  text: നിങ്ങൾ യഹ്‌വേക്കു കൃതജ്ഞതായാഗം[a] അർപ്പിക്കുമ്പോൾ, നിങ്ങൾക്കുവേണ്ടി അത് സ്വീകരിക്കപ്പെടുന്നവിധം അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൃതജ്ഞതയുടെ യാഗം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: നിങ്ങൾ … അർപ്പിക്കുമ്പോൾ
  rationale: നിയമനിർദേശത്തിന്റെ സോപാധിക-കാലിക സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; മുൻവാക്യങ്ങളോടുള്ള ബന്ധം വാക്യക്രമത്തിൽ വ്യക്തമാകുന്നതിനാൽ പ്രത്യേകമായി ‘അപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: תִזְבְּחוּ / תִּזְבָּחוּ
  choice: അർപ്പിക്കുമ്പോൾ / അർപ്പിക്കണം
  rationale: זבח യാഗാർപ്പണത്തെ സൂചിപ്പിക്കുന്നു. ‘അർപ്പിക്കുക’ ആധുനിക മലയാളത്തിലെ ആരാധനാസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; ആവർത്തനം നിലനിർത്തി എബ്രായ നിർദേശത്തിന്റെ ഊന്നൽ സംരക്ഷിച്ചു.
- source_word: זֶבַח תּוֹדָה
  choice: കൃതജ്ഞതായാഗം
  rationale: നന്ദിയോ കൃതജ്ഞതയോ സ്വഭാവമായ പ്രത്യേക യാഗവിഭാഗത്തെ സംക്ഷിപ്തവും മാന്യവുമായി സൂചിപ്പിക്കുന്നു; പദഘടനയിലെ സാധുവായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לַ/יהוָה
  choice: യഹ്‌വേക്കു
  rationale: ലാമെദ് സമർപ്പണത്തിന്റെ ദിശ/സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; ദൈവനാമം പൊതുപദവിയാക്കി മാറ്റാതെ യഹ്‌വേ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לִֽ/רְצֹנְ/כֶם
  choice: നിങ്ങൾക്കുവേണ്ടി അത് സ്വീകരിക്കപ്പെടുന്നവിധം
  rationale: യാഗസന്ദർഭത്തിൽ רָצוֹן മനുഷ്യരുടെ ഇഷ്ടത്തെക്കാൾ ദൈവസന്നിധിയിലെ സ്വീകാര്യതയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ലക്ഷ്യ/ഫലഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ നിയമനാമം പേരായിത്തന്നെ നിലനിർത്തുന്നു; ഒരു പദവിയാക്കി മാറ്റുകയോ പരമ്പരാഗതമായ മറ്റൊരു സ്വരീകരണം സ്വീകരിക്കുകയോ ചെയ്തിട്ടില്ല.
- issue: לרצנכם എന്നതിലെ സ്വീകാര്യതയുടെ ദിശ
  choice: നിങ്ങൾക്കുവേണ്ടി അത് സ്വീകരിക്കപ്പെടുന്നവിധം
  alternative: നിങ്ങളുടെ ഇഷ്ടപ്രകാരം / നിങ്ങളുടെ സ്വീകാര്യതയ്ക്കായി
  rationale: പുരോഹിതനിയമത്തിലെ സമാന്തര യാഗപ്രയോഗങ്ങൾ വഴിപാടു യാഗികളുടെ പക്ഷത്ത് ദൈവത്താൽ സ്വീകരിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആരാണ് സ്വീകരിക്കുന്നതെന്ന് മൂലത്തിൽ പരോക്ഷമായതിനാൽ ‘ദൈവം’ എന്ന് വാചകത്തിൽ ചേർക്കാതെ കർമണിപ്രയോഗം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യമായ മാന്യമായ മലയാളം. യാഗസാങ്കേതികത നിലനിർത്തിയെങ്കിലും അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി; മൂലത്തിലെ ക്രിയാവർത്തനം മലയാളത്തിൽ സംരക്ഷിച്ചു.
