id: LEV.22.24
reference: Leviticus 22:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מָע֤וּךְ וְ/כָתוּת֙ וְ/נָת֣וּק וְ/כָר֔וּת לֹ֥א תַקְרִ֖יבוּ לַֽ/יהוָ֑ה וּֽ/בְ/אַרְצְ/כֶ֖ם לֹ֥א תַעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: ml
  text: വൃഷണങ്ങൾ ചതഞ്ഞതോ തകർത്തതോ പറിച്ചുമാറ്റിയതോ മുറിച്ചുമാറ്റിയതോ ആയ ഒരു മൃഗവും നിങ്ങൾ യഹോവയ്ക്ക് അർപ്പിക്കരുത്; നിങ്ങളുടെ ദേശത്ത് അങ്ങനെ ചെയ്യരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ചതഞ്ഞത്, തകർത്തത്, പറിച്ചുമാറ്റിയത്, മുറിച്ചുമാറ്റിയത്’; എബ്രായപാഠം നാലുതരം ക്ഷതങ്ങൾ നിരത്തിപ്പറയുന്നു. സന്ദർഭത്തിൽ ഇവ ആൺമൃഗത്തിന്റെ വൃഷണങ്ങൾക്കുണ്ടാക്കിയ ക്ഷതങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: മൂലപാഠത്തിൽ ‘വൃഷണങ്ങൾ’ എന്ന നാമം നേരിട്ട് ഇല്ല; സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന കർമം വിവർത്തനത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
lexical_decisions:
- source_word: מָעוּךְ
  choice: ചതഞ്ഞത്
  rationale: സമ്മർദംകൊണ്ട് ക്ഷതമേറ്റ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘തകർത്തത്’ എന്നതിൽനിന്ന് വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: כָתוּת
  choice: തകർത്തത്
  rationale: അടിച്ചോ ഞെരിച്ചോ തകർത്ത അവസ്ഥയെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: נָתוּק
  choice: പറിച്ചുമാറ്റിയത്
  rationale: വലിച്ചുപറിച്ച് വേർപെടുത്തിയ അവസ്ഥ എന്ന എബ്രായ അർഥഭേദം പ്രകടമാക്കുന്നു.
- source_word: כָרוּת
  choice: മുറിച്ചുമാറ്റിയത്
  rationale: മുറിച്ചു വേർപെടുത്തിയ അവസ്ഥയെ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: תַקְרִיבוּ
  choice: അർപ്പിക്കരുത്
  rationale: യാഗസന്ദർഭത്തിലെ ‘അടുത്തുകൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה-യെ ശബ്ദസമീപമായും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായും ‘യഹോവ’ എന്നു നൽകുന്നു.
- source_word: בְאַרְצְכֶם
  choice: നിങ്ങളുടെ ദേശത്ത്
  rationale: ഇസ്രായേലിന്റെ ദേശത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക വിവർത്തനം.
- source_word: לֹא תַעֲשׂוּ
  choice: ഇങ്ങനെ ചെയ്യുകയും അരുത്
  rationale: ‘ചെയ്യുക’ എന്ന വിശാലവും അപൂർണ്ണവുമായ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മുൻപറഞ്ഞ അംഗഭംഗപ്പെടുത്തലിലേക്കുള്ള സൂചന വ്യക്തമാക്കുന്നു.
- source_word: implicit object of the four participles
  choice: വൃഷണങ്ങൾ
  rationale: സന്ദർഭത്തിൽ സൂചിതമായ ആൺമൃഗത്തിന്റെ ലൈംഗികാവയവം വ്യക്തമായി പറയാൻ ശരീരശാസ്ത്രപരമായി കൃത്യവും മാന്യവുമായ പദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ നിലനിർത്തുകയും മലയാളത്തിലെ സ്ഥാപിതമായ ശബ്ദരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- issue: וּבְאַרְצְכֶם לֹא תַעֲשׂוּ എന്ന അവസാന നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: ദേശത്ത് അത്തരം അംഗഭംഗം ചെയ്യരുതെന്ന നിരോധനം
  alternative: ദേശത്ത് അത്തരം മൃഗങ്ങളെ യാഗമായി അർപ്പിക്കരുതെന്ന നിരോധനം
  rationale: ‘ചെയ്യുക’ എന്ന എബ്രായക്രിയ വിശാലവും സന്ദർഭാശ്രിതവുമാണ്; ‘ഇങ്ങനെ ചെയ്യുക’ എന്ന രൂപം മുൻപറഞ്ഞ പ്രവൃത്തികളെ സൂചിപ്പിക്കുമ്പോഴും മൂലത്തിലെ സംക്ഷിപ്തതയും ഒരു പരിധിവരെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നാല് ക്ഷതാവസ്ഥകളുടെയും ക്രമവും വ്യത്യാസവും പരമാവധി സൂക്ഷിച്ചു; സൂചിത കർമമായ ‘വൃഷണങ്ങൾ’ വ്യക്തതയ്ക്കായി ചേർത്തു.
