id: LEV.22.10
reference: Leviticus 22:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל זָ֖ר לֹא יֹ֣אכַל קֹ֑דֶשׁ תּוֹשַׁ֥ב כֹּהֵ֛ן וְ/שָׂכִ֖יר לֹא יֹ֥אכַל קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: ml
  text: അവകാശമില്ലാത്ത ആരും വിശുദ്ധഭക്ഷണം[a] കഴിക്കരുത്; പുരോഹിതനോടു ചേർന്നു താമസിക്കുന്നവനോ[b] കൂലിപ്പണിക്കാരനോ വിശുദ്ധഭക്ഷണം കഴിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം ‘വിശുദ്ധവസ്തു.’ ഇവിടെ പുരോഹിതർക്ക് ഭക്ഷിക്കാനായി നീക്കിവെച്ച വിശുദ്ധയാഗഭാഗം ഉദ്ദേശിക്കുന്നു; ‘വിശുദ്ധഭോജനം’ അല്ലെങ്കിൽ ‘വിശുദ്ധഭാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘പുരോഹിതന്റെ താമസക്കാരൻ’ എന്നർഥമുള്ള പദപ്രയോഗം. പുരോഹിതന്റെ ഭവനവുമായി ബന്ധപ്പെട്ട ഒരു താൽക്കാലിക താമസക്കാരനെയോ ആശ്രിതനെയോ സൂചിപ്പിക്കാം; ‘പുരോഹിതന്റെ താമസക്കാരൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: അധികാരമില്ലാത്ത ആരും
  rationale: വിശുദ്ധഭോജനത്തിന്റെ പശ്ചാത്തലത്തിൽ, ഇത് പ്രധാനമായും വിദേശിയെ അല്ല, അത് ഭക്ഷിക്കാൻ അധികാരമില്ലാത്ത ആളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായ നിയമഭാഷയിൽ ഈ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: קֹדֶשׁ
  choice: വിശുദ്ധഭോജനം
  rationale: എബ്രായ ഏകവചനത്തിന്റെ അക്ഷരാർഥം ‘വിശുദ്ധവസ്തു’ എന്നാണെങ്കിലും ഇവിടെ പുരോഹിതർക്ക് ഭക്ഷിക്കാനായി നീക്കിവെച്ച വിശുദ്ധയാഗഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്; ‘വിശുദ്ധഭോജനം’ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תּוֹשַׁב כֹּהֵן
  choice: പുരോഹിതനോടൊപ്പം താമസിക്കുന്ന അന്യൻ
  rationale: പുരോഹിതന്റെ കുടുംബാംഗമല്ലെങ്കിലും അവന്റെ ഭവനത്തോട് ചേർന്ന് താമസിക്കുന്ന ആശ്രിതനെയോ പരദേശവാസിയെയോ സൂചിപ്പിക്കുന്ന ബന്ധം സംരക്ഷിക്കുന്നു; ആ വ്യക്തിയെ പുരോഹിതനായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ഈ രൂപം സഹായിക്കുന്നു.
- source_word: שָׂכִיר
  choice: കൂലിപ്പണിക്കാരൻ
  rationale: കൂലിക്ക് ജോലി ചെയ്യുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സാമൂഹികമായി കൃത്യവുമായ ആധുനിക മലയാളപദം.
- source_word: לֹא יֹאכַל
  choice: ഭക്ഷിക്കരുത്
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണക്രിയ നിയമപരമായ നിരോധനം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഭക്ഷിക്കരുത്’ അത് നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְכָל זָר
  choice: അധികാരമില്ലാത്ത ആരും
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘എല്ലാ അന്യനും ... ഇല്ല’ എന്ന ഘടനയ്ക്ക് പകരം, സർവത്ര ബാധകമായ നിരോധനം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വിശുദ്ധഭോജനം കഴിക്കാനുള്ള യോഗ്യത
  choice: ‘അധികാരമില്ലാത്ത’ എന്ന് പരിഭാഷപ്പെടുത്തി, വംശീയമായ വിദേശിത്വത്തേക്കാൾ ആരാധനാനിയമപ്രകാരമുള്ള അനധികൃതാവസ്ഥ മുന്നിൽവെച്ചു.
  alternative: ‘അന്യൻ’ അല്ലെങ്കിൽ ‘സാധാരണക്കാരൻ’
  rationale: זָר എന്ന പദം ഈ പുരോഹിതീയ സന്ദർഭത്തിൽ വംശീയവിഭാഗത്തെക്കാൾ വിശുദ്ധഭോജനത്തിൽ പങ്കില്ലാത്തവനെ സൂചിപ്പിക്കുന്നു; ‘സാധാരണക്കാരൻ’ പുരോഹിതനല്ലാത്ത എല്ലാവരെയും അതിയായി പൊതുവാക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ആവർത്തനം മൂലപാഠത്തിന്റെ രണ്ടു സമാന്തര നിരോധനങ്ങളും നിലനിർത്തുന്നു. ‘അന്യൻ’ എന്ന പദം രണ്ടാം വാക്യത്തിൽ കുടുംബത്തിന് പുറത്തുള്ള താമസക്കാരനെ സൂചിപ്പിക്കാൻ ഉപയോഗിച്ചിരിക്കുന്നു; ആദ്യവാക്യത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അധികാരമില്ലാത്ത’ എന്നു നൽകിയിരിക്കുന്നു.
