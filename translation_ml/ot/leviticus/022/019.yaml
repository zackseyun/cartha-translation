source:
  edition: WLC
  text: לִֽ/רְצֹנְ/כֶ֑ם תָּמִ֣ים זָכָ֔ר בַּ/בָּקָ֕ר בַּ/כְּשָׂבִ֖ים וּ/בָֽ/עִזִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/019.yaml
  text: for your acceptance, it must be a sound male from the cattle, the sheep, or the goats.
translation:
  language: ml
  text: നിങ്ങൾക്കുവേണ്ടി സ്വീകാര്യമായിരിക്കേണ്ടതിന്, അത് കന്നുകാലികളിൽനിന്നോ ചെമ്മരിയാടുകളിൽനിന്നോ കോലാടുകളിൽനിന്നോ ഉള്ള ഊനമില്ലാത്ത ആണായിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: നിങ്ങൾക്കു സ്വീകാര്യമായിരിക്കേണ്ടതിന്
  rationale: רצון എന്ന പദം ഇവിടെ യാഗം അർപ്പിക്കുന്നവരുടെ ഇഷ്ടത്തെക്കാൾ യാഗം അവർക്കുവേണ്ടി അംഗീകരിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഉദ്ദേശ്യാർഥവും സ്വീകാര്യതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: תָּמִים
  choice: ഊനമില്ലാത്ത
  rationale: യാഗമൃഗത്തിന്റെ ദേഹപരമായ സമഗ്രതയും അംഗീകരിക്കാനാവാത്ത വൈകല്യങ്ങളുടെ അഭാവവും സൂചിപ്പിക്കുന്ന ലേവ്യപുസ്തകത്തിലെ സാങ്കേതിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: זָכָר
  choice: ആൺ
  rationale: മൃഗത്തിന്റെ ആൺലിംഗം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  choice: കന്നുകാലികളിൽനിന്നോ ചെമ്മരിയാടുകളിൽനിന്നോ കോലാടുകളിൽനിന്നോ
  rationale: മൂന്നു അനുവദനീയ മൃഗവിഭാഗങ്ങളെയും വ്യക്തമായി വേർതിരിച്ച്, മലയാളത്തിലെ തിരഞ്ഞെടുപ്പ്-പട്ടികയുടെ സ്വാഭാവിക രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: לִרְצֹנְכֶם എന്നതിലെ സ്വീകാര്യതയുടെ ദിശ
  choice: നിങ്ങൾക്കു സ്വീകാര്യമായിരിക്കേണ്ടതിന്
  alternative: നിങ്ങളുടെ ഇഷ്ടപ്രകാരം
  rationale: സന്ദർഭത്തിൽ യാഗം അർപ്പിക്കുന്നവർക്കുവേണ്ടി ദൈവസന്നിധിയിൽ അംഗീകരിക്കപ്പെടുക എന്ന ആശയമാണ് ശക്തം; എന്നാൽ ഏത് ദൈവശാസ്ത്ര വിശദീകരണവും വാചകത്തിൽ ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- issue: תָּמִים എന്ന യാഗസാങ്കേതിക പദം
  choice: ഊനമില്ലാത്ത
  alternative: കുറ്റമറ്റ / ആരോഗ്യമുള്ള
  rationale: ധാർമ്മിക കുറ്റമില്ലായ്മയായി തെറ്റിദ്ധരിക്കപ്പെടാവുന്ന ഭാഷ ഒഴിവാക്കി മൃഗത്തിന്റെ യാഗയോഗ്യമായ ദേഹപരമായ സമഗ്രത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലവാക്യത്തിലെ നിബന്ധനാപരമായ സ്വരം നിലനിർത്തുകയും അനാവശ്യ വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്തു.
