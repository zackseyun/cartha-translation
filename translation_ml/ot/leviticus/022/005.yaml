reference: Leviticus 22:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אוֹ אִישׁ֙ אֲשֶׁ֣ר יִגַּ֔ע בְּ/כָל שֶׁ֖רֶץ אֲשֶׁ֣ר יִטְמָא ל֑/וֹ א֤וֹ בְ/אָדָם֙ אֲשֶׁ֣ר יִטְמָא ל֔/וֹ לְ/כֹ֖ל טֻמְאָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, താൻ അശുദ്ധനാകാൻ ഇടയാക്കുന്ന ഏതെങ്കിലും ചെറുജീവിയെ[a] തൊടുന്ന പുരുഷനോ, ഏതു അശുദ്ധിമൂലമായാലും താൻ അശുദ്ധനാകാൻ ഇടയാക്കുന്ന ഒരു വ്യക്തിയെ തൊടുന്ന പുരുഷനോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇഴജന്തു’ അല്ലെങ്കിൽ ‘കൂട്ടമായി സഞ്ചരിക്കുന്ന ജീവി.’ എബ്രായപദം നിലത്തോട് ചേർന്ന് ഇഴയുന്നതോ കൂട്ടമായി സഞ്ചരിക്കുന്നതോ ആയ ചെറുജീവികളുടെ വിശാലമായ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടിക തുടരുന്ന ലളിതമായ വികല്പസമുച്ചയം.
- source_word: אִישׁ
  choice: പുരുഷൻ
  rationale: എബ്രായയിലെ പുല്ലിംഗ ഏകവചനരൂപം പ്രതിഫലിപ്പിക്കുന്നു; നിയമസന്ദർഭത്തിൽ പ്രയോഗം പൊതുവായിരിക്കാം.
- source_word: יִגַּע
  choice: തൊടുക
  rationale: ശുദ്ധി-അശുദ്ധി നിയമങ്ങളിൽ נגע എന്ന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: בְּכָל שֶׁרֶץ
  choice: ഏതെങ്കിലും ഇഴജന്തു
  rationale: നിലത്തോട് ചേർന്ന് ഇഴയുകയോ കൂട്ടമായി സഞ്ചരിക്കുകയോ ചെയ്യുന്ന ചെറുജീവികളുടെ വിശാല വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ ജന്തുശാസ്ത്രവിഭാഗമായി ചുരുക്കുന്നില്ല.
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: താൻ അശുദ്ധനാകാൻ ഇടയാക്കുന്ന
  rationale: അശുദ്ധിയുടെ ഉറവിടവും അതുമൂലമുള്ള ഫലവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְאָדָם
  choice: ഒരു മനുഷ്യനെ
  rationale: אָדָם ഇവിടെ അശുദ്ധി പകരാവുന്ന മനുഷ്യവ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: ഏതുതരം അശുദ്ധിയുള്ളതായാലും
  rationale: മൂലത്തിലെ സംക്ഷിപ്തവും അല്പം ദ്വയാർഥസാധ്യതയുള്ളതുമായ പ്രയോഗത്തെ അതിരുകടന്ന് വിശദീകരിക്കാതെ, ആ വ്യക്തിയുടെ ഏതു തരത്തിലുള്ള അശുദ്ധിയും എന്ന ആശയം നൽകുന്നു.
- source_word: טֻמְאָה
  choice: അശുദ്ധി
  rationale: ആചാരപരമായ ശുദ്ധി-അശുദ്ധി സന്ദർഭത്തിന് യോജിക്കുകയും טמא എന്ന ധാതുവുമായുള്ള പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ലേവ്യശുദ്ധിനിയമത്തിലെ טמא / טֻמְאָה എന്ന ഭാഷയുടെ സ്വഭാവം
  choice: ആചാരപരമായ ‘അശുദ്ധൻ / അശുദ്ധി’ എന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: മലിനൻ / മലിനത; നൈതിക കുറ്റബോധം സൂചിപ്പിക്കുന്ന ഭാഷ
  rationale: സന്ദർഭം പുരോഹിതശുദ്ധിനിയമങ്ങളാണ്; ഇത് നിർബന്ധമായും നൈതിക പാപമോ കുറ്റമോ സൂചിപ്പിക്കുന്നില്ല. അതിനാൽ നൈതികവൽക്കരണം ഒഴിവാക്കി.
- issue: לְכֹל טֻמְאָתוֹയിലെ സർവനാമത്തിന്റെ സൂചന
  choice: തൊടപ്പെടുന്ന മനുഷ്യനുള്ള ഏതുതരം അശുദ്ധിയെയും സൂചിപ്പിക്കുന്നതായി വാചകം ക്രമപ്പെടുത്തി.
  alternative: തൊടുന്ന പുരുഷന്റെ അശുദ്ധി എന്നു വായിക്കുക
  rationale: സമീപസ്ഥനായ אָדָם അശുദ്ധിയുടെ മനുഷ്യഉറവിടമായതിനാൽ ഈ വായന സന്ദർഭത്തിൽ കൂടുതൽ സാദ്ധ്യമാണ്; എങ്കിലും മൂലത്തിലെ സങ്കുചിതത്വം കാരണം വാചകം അമിതമായി പ്രത്യേകീകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ നിയമശൈലി. ഇഴജന്തു എന്ന പരിചിതപദം മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ച്, שֶׁרֶץ എന്ന പദത്തിന്റെ വിശാല അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. ‘പുരുഷൻ’ എന്നത് אִישׁ എന്ന പുല്ലിംഗരൂപം പ്രതിഫലിപ്പിക്കുന്നു; ‘മനുഷ്യൻ’ എന്നത് אָדָם എന്ന പൊതുവായ മനുഷ്യസൂചന നൽകുന്നു.
