source:
  edition: WLC
  text: וְ/הִשִּׂ֤יאוּ אוֹתָ/ם֙ עֲוֺ֣ן אַשְׁמָ֔ה בְּ/אָכְלָ֖/ם אֶת קָדְשֵׁי/הֶ֑ם כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: ml
  text: അങ്ങനെ, അവർ അവരുടെ വിശുദ്ധവസ്തുക്കൾ ഭക്ഷിക്കുന്നതിലൂടെ, അവർക്കു പരിഹാരം ആവശ്യമായ കുറ്റബാധ്യത വരുത്തുന്നു[a][b]; അവരെ വിശുദ്ധീകരിക്കുന്ന യഹോവ ഞാൻ ആകുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: ‘അവർക്കു കുറ്റബാധ്യത വരുത്തുന്നു.’ എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്; ഒരു കുറ്റയാഗവുമായി ബന്ധപ്പെട്ട ബാധ്യതയ്ക്കാണ് ഇവിടെ ഊന്നൽ ഉണ്ടായിരിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെ വിശുദ്ധവസ്തുക്കൾ’ എന്നത് പ്രതിഷ്ഠിക്കപ്പെട്ട ഓഹരികളെയോ വഴിപാടുകളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘അവരെ വിശുദ്ധരാക്കുന്ന’ അല്ലെങ്കിൽ ‘അവരെ പ്രതിഷ്ഠിക്കുന്ന.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: അവരെക്കൊണ്ട് വഹിപ്പിക്കരുത്
  rationale: נשׂא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെ ഒരു ഭാരം വഹിക്കാൻ ഇടയാക്കുക എന്ന കാരണാർത്ഥം നൽകുന്നു. മുൻവാക്യത്തിലെ നിരോധനത്തിന്റെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ നിരോധനരൂപം സ്വാഭാവികമാണ്.
- source_word: עֲוֺן אַשְׁמָה
  choice: പരിഹാരം ആവശ്യമായ കുറ്റത്തിന്റെ ഭാരം
  rationale: עון, אשמה എന്നീ പദങ്ങളുടെ സംയോജനം കുറ്റബോധം മാത്രമല്ല, പ്രായശ്ചിത്തപരിഹാരമോ നഷ്ടപരിഹാരമോ ആവശ്യപ്പെടുന്ന ആരാധനാനിയമപരമായ ബാധ്യതയും സൂചിപ്പിക്കുന്നു.
- source_word: בְּאָכְלָם
  choice: ഭക്ഷിക്കുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct സാഹചര്യത്തെയോ മാർഗത്തെയോ സൂചിപ്പിക്കാം; മലയാളത്തിൽ ‘ഭക്ഷിക്കുമ്പോൾ’ സ്വാഭാവികമായി ബന്ധം നിലനിർത്തുകയും കാരണാർത്ഥം അതിയായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: קָדְשֵׁיהֶם
  choice: തങ്ങളുടെ വിശുദ്ധവസ്തുക്കൾ
  rationale: അക്ഷരാർത്ഥമായ ‘അവരുടെ വിശുദ്ധവസ്തുക്കൾ’ എന്നത് സമർപ്പിക്കപ്പെട്ട ഓഹരികളെയോ വഴിപാടുകളെയോ സൂചിപ്പിക്കുന്നു; പ്രതിബിംബസർവനാമം മലയാളത്തിൽ ആശയക്കുഴപ്പം കുറയ്ക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מְקַדְּשָׁם
  choice: അവരെ വിശുദ്ധീകരിക്കുന്ന
  rationale: קדשׁ എന്ന ക്രിയയുടെ പീയേൽ കർത്തൃവാചക രൂപം ‘വിശുദ്ധമാക്കുക/പ്രതിഷ്ഠിക്കുക’ എന്നാണ്; ആരാധനാപരവും ദൈവശാസ്ത്രപരവുമായ ഭാവം നിലനിർത്താൻ ‘വിശുദ്ധീകരിക്കുന്ന’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ ‘അവരെ’ എന്നതിന്റെ സൂചകം
  choice: യഹോവ ബന്ധപ്പെട്ടിരിക്കുന്ന പുരോഹിതരെയോ ഇസ്രായേല്യരെയോ വിശുദ്ധീകരിക്കുന്നു
  alternative: യഹോവ വിശുദ്ധവസ്തുക്കളെ വിശുദ്ധീകരിക്കുന്നു
  rationale: പുരുഷലിംഗ ബഹുവചന പ്രത്യയം സമീപസന്ദർഭത്തിലെ ആളുകളെ സൂചിപ്പിക്കുന്നതാണ് കൂടുതൽ സ്വാഭാവികം. എങ്കിലും പ്രധാനവാചകം ‘അവരെ’ എന്നു തന്നെ നിലനിർത്തി സൂചകത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ ദുഷ്കരമായ കാരണാർത്ഥഘടന പൂർണ്ണമായി ലളിതീകരിക്കാതെ, നിയമ-ആരാധനാപരമായ ‘കുറ്റബാധ്യത’ എന്ന ആശയം വ്യക്തമാക്കിയിരിക്കുന്നു.
