review_pass:
  verdict: revise
  source_fidelity: 'The draft incorrectly turns וְהִשִּׂיאוּ into a prohibition (''വഹിപ്പിക്കരുത്''). The Hebrew form here is a waw-consecutive/perfect verbal clause expressing the resulting action: they cause/bring upon them guilt. The revised wording retains the causative force and does not supply a negation absent from this verse.'
  naturalness: The revised Malayalam is clear and suitably formal for Leviticus. 'കുറ്റബാധ്യത വരുത്തുന്നു' naturally conveys causing guilt/liability to come upon someone, while avoiding an overly cumbersome literal expression such as 'കുറ്റത്തിന്റെ ഭാരം വഹിപ്പിക്കുന്നു.'
  terminology: ‘പരിഹാരം ആവശ്യമായ കുറ്റബാധ്യത’ preserves the cultic-legal force of עֲוֺן אַשְׁמָה without specifying a particular later ritual. ‘വിശുദ്ധവസ്തുക്കൾ,’ ‘യഹോവ,’ and ‘വിശുദ്ധീകരിക്കുന്ന’ are appropriate. The pronouns remain appropriately noncommittal concerning their exact antecedents.
  issues:
  - severity: high
    issue: An unwarranted negation is added in ‘അവരെക്കൊണ്ട് വഹിപ്പിക്കരുത്.’
    rationale: 'Leviticus 22:16 does not contain a negative particle or jussive prohibition. Though the preceding context includes prohibitions, this clause states the consequence/action: ‘and [so] they cause them to bear/bring upon them guilt.’ The added ‘രുത്’ reverses the clause’s assertion.'
