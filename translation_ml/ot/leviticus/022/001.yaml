  - marker: a
    text: 'എബ്രായം: ‘YHWH’ (יהוה). പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്യാറുണ്ട്; ‘യാഹ്‌വേ’ ദൈവനാമത്തിന്റെ സാധാരണ പുനർനിർമ്മിത ഉച്ചാരണമാണ്.'
    reason: എബ്രായത്തിലെ ദൈവനാമം വ്യഞ്ജനാക്ഷരങ്ങളായി മാത്രമാണ് എഴുതപ്പെട്ടിരിക്കുന്നത്; പ്രധാനപാഠത്തിലെ ‘യാഹ്‌വേ’ എന്ന രൂപവും പരമ്പരാഗത വിവർത്തനരീതിയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക പ്രസംഗത്തെ പരിചയപ്പെടുത്തുന്ന പതിവു സൂത്രവാക്യത്തിന്റെ ഗൗരവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു; ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റുന്നില്ല.
- source_word: אֶל מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദുവിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: ഹീബ്രു ഭാഷയിലെ പ്രസംഗപരിചയ സൂത്രത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ അനാവശ്യമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ആവർത്തനമില്ലാതെ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരിനു പകരം മലയാളത്തിൽ ദീർഘകാലമായി പ്രചാരത്തിലുള്ള ‘യഹോവ’ ഉപയോഗിച്ചു; ഉച്ചാരണത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘അരുളിച്ചെയ്തു’ എന്ന പരിചിതമായ ദൈവിക-പ്രസംഗ പദം നിലനിർത്തിയപ്പോൾ, לֵאמֹר എന്നതിന്റെ പ്രവർത്തനം ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമാക്കി.
