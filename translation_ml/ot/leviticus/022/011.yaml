id: LEV.22.11
reference: Leviticus 22:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֹהֵ֗ן כִּֽי יִקְנֶ֥ה נֶ֨פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔/וֹ ה֖וּא יֹ֣אכַל בּ֑/וֹ וִ/ילִ֣יד בֵּית֔/וֹ הֵ֖ם יֹאכְל֥וּ בְ/לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: ml
  text: എന്നാൽ ഒരു പുരോഹിതൻ തന്റെ പണം കൊടുത്ത് ഒരാളെ തന്റെ സ്വത്തായി വാങ്ങിയാൽ[a], ആ വ്യക്തിക്ക് അതിൽനിന്ന് ഭക്ഷിക്കാം[b]. അവന്റെ വീട്ടിൽ ജനിച്ചവർക്കും അവന്റെ ഭക്ഷണത്തിൽനിന്ന് ഭക്ഷിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഒരു വ്യക്തിയെ, തന്റെ പണത്തിന്റെ സമ്പാദ്യമായി”—അതായത്, തന്റെ പണം കൊടുത്ത് വാങ്ങിയ ഒരാളെ.'
    reason: lexical_alternative
  - marker: b
    text: ‘അതിൽ’ എന്നത് സന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന വിശുദ്ധഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു. അവസാനത്തെ ‘ഭക്ഷണം’ എന്നതിന് അക്ഷരാർഥത്തിൽ ‘അപ്പം’ എന്നാണ്; ഇവിടെ അത് പുരോഹിതന് ലഭിച്ച വിശുദ്ധഭക്ഷണത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: referent_clarification
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: എന്നാൽ ഒരു പുരോഹിതൻ ... വാങ്ങിയാൽ
  rationale: മുൻവാക്യത്തിലെ നിയമനിബന്ധനയോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കാൻ וְ എന്നത് ‘എന്നാൽ’ എന്നും, ഈ സാന്ദർഭിക നിയമവ്യവസ്ഥയിലെ כִּי ... יִקְנֶה എന്നത് മലയാളത്തിലെ സ്വാഭാവിക നിബന്ധനാരൂപമായ ‘വാങ്ങിയാൽ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: יִקְנֶה נֶפֶשׁ
  choice: ഒരാളെ ... വാങ്ങിയാൽ
  rationale: נֶפֶשׁ ഇവിടെ അമൂർത്തമായ ‘ആത്മാവ്’ എന്നല്ല, ഒരു മനുഷ്യവ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; קנה പണംകൊടുത്തുള്ള വാങ്ങലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: קִנְיַן כַּסְפּוֹ
  choice: തന്റെ പണംകൊടുത്ത് ... തന്റെ സ്വത്തായി
  rationale: പണത്താൽ നേടിയ ഉടമസ്ഥാവകാശം എന്ന എബ്രായപ്രയോഗത്തിന്റെ അസ്വസ്ഥമാക്കുന്ന സ്വത്ത്-പദവി മൃദൂകരിക്കാതെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הוּא יֹאכַל בּוֹ
  choice: ആ വ്യക്തിക്ക് അതിൽനിന്ന് ഭക്ഷിക്കാം
  rationale: הוּא വാങ്ങപ്പെട്ട വ്യക്തിയിലേക്കാണ് മടങ്ങുന്നത്; ‘ആ വ്യക്തി’ എന്ന് വ്യക്തമാക്കുന്നത് മലയാളത്തിലെ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കുന്നു. בּוֹ സന്ദർഭത്തിലെ വിശുദ്ധഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וִילִיד בֵּיתוֹ
  choice: അവന്റെ വീട്ടിൽ ജനിച്ചവർ
  rationale: വീട്ടിൽ ജനിച്ച ആശ്രിതരെയോ ദാസ്യപദവിയിലുള്ളവരെയോ കൂട്ടമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം; മൂലപാഠത്തേക്കാൾ പദവി കൂടുതൽ നിർവചിക്കാതെ കൂട്ടാർഥം നിലനിർത്തുന്നു.
- source_word: בְלַחְמוֹ
  choice: അവന്റെ ഭക്ഷണത്തിൽനിന്ന്
  rationale: לֶחֶם എന്നതിന് അക്ഷരാർഥത്തിൽ ‘അപ്പം’ എന്നുണ്ടെങ്കിലും ഇവിടെ പുരോഹിതന് ലഭിക്കുന്ന ഭക്ഷണത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘ഭക്ഷണം’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
theological_decisions:
- issue: ദാസ്യവും സ്വത്തവകാശവും സംബന്ധിച്ച നിയമപദപ്രയോഗം
  choice: തന്റെ പണംകൊടുത്ത് ഒരാളെ തന്റെ സ്വത്തായി വാങ്ങിയാൽ
  alternative: തന്റെ പണംകൊടുത്ത് ഒരാളെ വാങ്ങിയാൽ
  rationale: קִנְיַן כַּסְפּוֹ എന്ന പ്രയോഗത്തിലെ സ്വത്തവകാശപരമായ ഘടകം മറച്ചുവയ്ക്കാതെ പരിഭാഷയിൽ നിലനിർത്തി. ഇത് പാഠത്തിന്റെ നിയമഭാഷ വ്യക്തമാക്കുന്നതാണ്; ആ വ്യവസ്ഥയെ അനുകൂലിക്കുന്ന പ്രസ്താവനയല്ല.
- issue: ഭക്ഷിക്കാനുള്ള അനുമതിയുടെ സ്വഭാവം
  choice: ഭക്ഷിക്കാം
  alternative: ഭക്ഷിക്കും
  rationale: നിയമസന്ദർഭത്തിലെ അപൂർണക്രിയാരൂപം ഇവിടെ ഭാവിപ്രവചനത്തേക്കാൾ അനുമതിയാണ് പ്രകടിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. സ്വത്തവകാശഭാഷ മൃദൂകരിച്ചില്ല; എന്നാൽ മൂലപാഠം വ്യക്തമാക്കാത്തിടത്ത് ‘ദാസൻ’ എന്ന പദം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല. ‘ആ വ്യക്തി’ എന്ന ആവർത്തനം സർവനാമത്തിന്റെ സൂചിതവ്യക്തി വ്യക്തമാക്കുന്നു.
