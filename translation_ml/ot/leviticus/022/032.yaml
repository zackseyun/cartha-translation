  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֤א תְחַלְּלוּ֙ אֶת שֵׁ֣ם קָדְשִׁ֔/י וְ/נִ֨קְדַּשְׁתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: ml
  text: എന്റെ വിശുദ്ധനാമത്തെ നിങ്ങൾ അശുദ്ധമാക്കരുത്; ഇസ്രായേൽമക്കളുടെ മധ്യേ ഞാൻ വിശുദ്ധനായി മാനിക്കപ്പെടും.[a] നിങ്ങളെ വിശുദ്ധീകരിക്കുന്ന യഹ്‌വേ ഞാൻ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞാൻ വിശുദ്ധനായി വെളിപ്പെടും” അല്ലെങ്കിൽ “ഞാൻ വിശുദ്ധനായി കണക്കാക്കപ്പെടും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: അശുദ്ധമാക്കരുത്
  rationale: പവിത്രമായതിനെ സാധാരണമായോ അശുദ്ധമായോ കണക്കാക്കി അതിന്റെ വിശുദ്ധി ലംഘിക്കുക എന്ന പീയേൽ രൂപത്തിന്റെ ആരാധനാപരവും ദൈവശാസ്ത്രപരവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שֵׁם קָדְשִׁי
  choice: എന്റെ വിശുദ്ധനാമം
  rationale: ‘നാമം’ എന്ന ആശയവും അതിന്റെ വിശുദ്ധതയും നിലനിർത്തുന്ന സ്വാഭാവികവും ബൈബിൾഭാഷയ്ക്ക് യോജിച്ചതുമായ പ്രയോഗം.
- source_word: וְנִקְדַּשְׁתִּי
  choice: ഞാൻ വിശുദ്ധനായി മാനിക്കപ്പെടണം
  rationale: നിഫാൽ രൂപത്തിലെ നിഷ്ക്രിയ/പ്രതിഫലനാത്മക ആശയം—ദൈവം വിശുദ്ധനായി കണക്കാക്കപ്പെടുകയോ പ്രകടമാക്കപ്പെടുകയോ ചെയ്യുക—മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; സന്ദർഭത്തിലെ ആജ്ഞാത്മക ബലം ‘വേണം’കൊണ്ട് സൂചിപ്പിക്കുന്നു.
- source_word: בְּתוֹךְ
  choice: മധ്യേ
  rationale: സമൂഹത്തിനുള്ളിൽ/അവരുടെ ഇടയിൽ എന്ന സ്ഥാനസംബന്ധമായ അർഥം ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപകൽപ്പനയോടു ചേർന്നുനിൽക്കുകയും മുഴുവൻ ഇസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമായി മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ഹീബ്രു ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: מְקַדִּשְׁכֶם
  choice: നിങ്ങളെ വിശുദ്ധീകരിക്കുന്ന
  rationale: വർത്തമാന കൃതന്തം സൂചിപ്പിക്കുന്ന തുടരുന്ന ദൈവിക പ്രവർത്തനം നിലനിർത്തുകയും קדשׁ ധാതുവുമായി വാക്യത്തിനുള്ളിലെ പദബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: וְנִקְדַּשְׁתִּי എന്നതിന്റെ നിഷ്ക്രിയ/പ്രതിഫലനാത്മക അർഥം
  choice: ഞാൻ വിശുദ്ധനായി മാനിക്കപ്പെടണം
  alternative: ഞാൻ വിശുദ്ധനായി വെളിപ്പെടും; ഞാൻ വിശുദ്ധീകരിക്കപ്പെടും
  rationale: ദൈവം കൂടുതൽ വിശുദ്ധനാകുന്നു എന്ന ആശയം ഒഴിവാക്കി, ഇസ്രായേലിന്റെ മധ്യേ അവന്റെ വിശുദ്ധി അംഗീകരിക്കപ്പെടുകയും പ്രകടമാകുകയും വേണം എന്ന അർഥം നൽകുന്നു; രൂപത്തിന്റെ യഥാർഥ അർഥപരിധി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ പ്രതിനിധിപരമായ വ്യാപ്തി
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം; ഇസ്രായേല്യർ
  rationale: ഹീബ്രുവിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന രൂപത്തോട് അടുത്തുനിൽക്കുമ്പോഴും, പ്രയോഗം ഉടമ്പടിസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നതാണെന്ന് അംഗീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വ്യക്തതയും സംയോജിപ്പിച്ചു. വിശുദ്ധി സംബന്ധിച്ച קדשׁ പദകുടുംബത്തിന്റെ ബന്ധം ‘വിശുദ്ധനായി/വിശുദ്ധീകരിക്കുന്ന’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോട് കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
