revisions:
- from: '“അഹരോനോടും അവന്റെ പുത്രന്മാരോടും എല്ലാ ഇസ്രായേൽമക്കളോടും[a] സംസാരിച്ച് അവരോടു പറയുക: ഇസ്രായേൽഗൃഹത്തിൽപ്പെട്ട ആരെങ്കിലും, അല്ലെങ്കിൽ ഇസ്രായേലിൽ പാർക്കുന്ന വിദേശികളിൽ ആരെങ്കിലും[b], തങ്ങളുടെ ഏതെങ്കിലും നേർച്ചകൾക്കോ ഏതെങ്കിലും സ്വമേധാദാനങ്ങൾക്കോ[c] വേണ്ടി യഹ്‌വേക്കു ഹോമയാഗമായി അർപ്പിക്കുന്ന വഴിപാട് കൊണ്ടുവരുന്നുവെങ്കിൽ—”'
  to: '“അഹരോനോടും അവന്റെ പുത്രന്മാരോടും ഇസ്രായേലിന്റെ സകല പുത്രന്മാരോടും[a] സംസാരിച്ച് അവരോടു പറയുക: ഇസ്രായേൽഗൃഹത്തിൽപ്പെട്ട ആരെങ്കിലും, അല്ലെങ്കിൽ ഇസ്രായേലിൽ പാർക്കുന്ന വിദേശികളിൽ ആരെങ്കിലും[b], തന്റെ ഏതെങ്കിലും നേർച്ചയ്ക്കോ[c] ഏതെങ്കിലും സ്വമേധാർപ്പണത്തിനോ വേണ്ടി തന്റെ വഴിപാട് യഹ്‌വേക്കു ഹോമയാഗമായി അർപ്പിക്കുന്നുവെങ്കിൽ—”'
  rationale: അർപ്പണത്തെ സൂചിപ്പിക്കുന്ന കർമ്മം ‘തന്റെ വഴിപാട്’ എന്നു വ്യക്തമാക്കി, അതിന്റെ ക്രിയയായി ‘അർപ്പിക്കുന്നുവെങ്കിൽ’ നൽകിയിരിക്കുന്നു. ഇതിലൂടെ യַקְרִיב കָרְבָּנוֹ, നേർച്ച/സ്വമേധാർപ്പണ ബന്ധം, യഹ്‌വേക്കുള്ള ഹോമയാഗം എന്നിവ വ്യക്തമായി നിലനിൽക്കുന്നു. അടിക്കുറിപ്പ് c നേർച്ചകൾ എന്ന പദത്തിൽ നങ്കൂരമിട്ടിരിക്കുന്നു; അതിനാൽ ബദൽ വായനയായ ‘നേർച്ചാർപ്പണങ്ങൾ’ മുഖ്യപാഠത്തിലെ പ്രസക്തമായ സ്ഥാനത്തുതന്നെ സൂചിപ്പിക്കപ്പെടുന്നു.
