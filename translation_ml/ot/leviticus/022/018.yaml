  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: ml
  text: '“അഹരോനോടും അവന്റെ പുത്രന്മാരോടും ഇസ്രായേലിന്റെ സകല പുത്രന്മാരോടും[a] സംസാരിച്ച് അവരോടു പറയുക: ഇസ്രായേൽഗൃഹത്തിൽപ്പെട്ട ആരെങ്കിലും, അല്ലെങ്കിൽ ഇസ്രായേലിൽ പാർക്കുന്ന വിദേശികളിൽ ആരെങ്കിലും[b], തന്റെ ഏതെങ്കിലും നേർച്ചയ്ക്കോ[c] ഏതെങ്കിലും സ്വമേധാർപ്പണത്തിനോ വേണ്ടി തന്റെ വഴിപാട് യഹ്‌വേക്കു ഹോമയാഗമായി അർപ്പിക്കുന്നുവെങ്കിൽ—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ സകല പുത്രന്മാർ’; ഇവിടെ മുഴുവൻ ഇസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇസ്രായേലിൽ പാർക്കുന്ന വിദേശി’ എന്നത് ഇസ്രായേൽജനമല്ലെങ്കിലും അവരുടെ സമൂഹക്രമത്തിനകത്ത് താമസിച്ചിരുന്ന ആളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_clarification
  - marker: c
    text: ‘തങ്ങളുടെ എല്ലാ നേർച്ചാർപ്പണങ്ങൾക്കും എല്ലാ സ്വമേധാർപ്പണങ്ങൾക്കും’ എന്നും മനസ്സിലാക്കാം; എബ്രായം നേർച്ചകളോടു ബന്ധപ്പെട്ട അർപ്പണങ്ങളെ സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: സംസാരിച്ച്
  rationale: പീലിൽ വന്ന ആജ്ഞാരൂപം ഔപചാരികമായ ദൈവിക നിർദേശം അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ നിയമശൈലിയിൽ ‘സംസാരിച്ച് ... പറയുക’ സ്വാഭാവികമാണ്.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: എബ്രായം വ്യക്തമായി പുരുഷബഹുവചനമായതിനാലും സന്ദർഭം അഹരോന്റെ പുരോഹിതപുത്രന്മാരെ സംബന്ധിക്കുന്നതിനാലും ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേൽമക്കൾ
  rationale: ഉറവിടത്തിലെ ബന്ധുത്വഭാഷ സംരക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ പരിചിതവും വായനാസൗകര്യമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: אִישׁ אִישׁ
  choice: ആരെങ്കിലും
  rationale: ആവർത്തിച്ച אִישׁ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തൻ/ആരെങ്കിലും’ എന്നാണ്; മലയാളത്തിൽ നിയമവാക്യത്തിനുള്ളിൽ ‘ആരെങ്കിലും’ സ്വാഭാവികമായി പ്രതിനിധാനാർഥം നൽകുന്നു.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹത്തിൽപ്പെട്ട
  rationale: ‘ഇസ്രായേൽഗൃഹം’ എന്ന ഉടമ്പടിസംബന്ധിയായ പ്രയോഗം പരന്നൊരു ജനവിഭാഗനാമമാക്കി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ പാർക്കുന്ന വിദേശികൾ
  rationale: גֵּר ഇസ്രായേൽസമൂഹത്തിനകത്ത് സ്ഥിരമായി താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത ആളെ സൂചിപ്പിക്കുന്നു; ‘പാർക്കുന്ന വിദേശി’ ആ നിയമ-സാമൂഹിക അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: വഴിപാട് കൊണ്ടുവരുന്നുവെങ്കിൽ
  rationale: ബലിസന്ദർഭത്തിലെ קרב എന്ന ക്രിയ വഴിപാട് ദൈവസന്നിധിയിലേക്ക് കൊണ്ടുവന്ന് സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; കൃത്രിമ ആവർത്തനം ഒഴിവാക്കി ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: לְכָל נִדְרֵיהֶם
  choice: തങ്ങളുടെ ഏതെങ്കിലും നേർച്ചകൾക്കു വേണ്ടി
  rationale: നേർച്ചകളുമായി ബന്ധപ്പെട്ട അർപ്പണങ്ങളെയാണ് വാക്യം സൂചിപ്പിക്കുന്നത്; അർപ്പണം എന്ന നാമം ഉറവിടത്തിൽ തുറന്നുപറയാത്തതിനാൽ മുഖ്യപാഠത്തിൽ അതു കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: נִדְבוֹתָם
  choice: തങ്ങളുടെ ഏതെങ്കിലും സ്വമേധാദാനങ്ങൾ
  rationale: സ്വതന്ത്രമനസ്സോടെ നൽകുന്ന യാഗാർപ്പണവിഭാഗത്തെ ‘സ്വമേധാദാനം’ വ്യക്തവും മാന്യവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: ടെട്രാഗ്രാമറ്റൺ പൊതുവായ സ്ഥാനപ്പേരായി മാറ്റാതെ ദൈവത്തിന്റെ ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְעֹלָה
  choice: ഹോമയാഗമായി
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന സാങ്കേതിക യാഗവിഭാഗമാണ്; മലയാള ബൈബിൾഭാഷയിൽ ‘ഹോമയാഗം’ സ്ഥാപിതവും സംക്ഷിപ്തവുമായ പദമാണ്.
theological_decisions:
- issue: നിയമനിർദേശത്തിലെ אִישׁ אִישׁ എന്ന പുരുഷവാചകത്തിന്റെ പരിഭാഷ
  choice: ആരെങ്കിലും
  alternative: ഏതൊരു പുരുഷനും
  rationale: ഇവിടെ പുരുഷവാചകം വിതരണപരവും പ്രതിനിധാനപരവുമാണ്. മലയാളത്തിലെ ‘ആരെങ്കിലും’ നിയമത്തിന്റെ വ്യാപ്തി സ്വാഭാവികമായി അറിയിക്കുന്നു; ഉൾപ്പെടാത്തവരെക്കുറിച്ചുള്ള ഒരു സിദ്ധാന്തനിഗമനം പാഠത്തിൽ കയറ്റുന്നില്ല.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: ഉറവിടം ദൈവത്തിന്റെ പ്രത്യേക നാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുവായ ബിരുദമാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു നൽകുന്നു.
- issue: נדרים എന്നത് നേർച്ചകളെയോ നേർച്ചാർപ്പണങ്ങളെയോ സൂചിപ്പിക്കുന്നതാണോ
  choice: നേർച്ചകൾ
  alternative: നേർച്ചാർപ്പണങ്ങൾ
  rationale: എബ്രായവാക്യഘടന നേർച്ചകളെ നേരിട്ട് പേരിടുന്നു, എന്നാൽ സന്ദർഭം അവയോടു ബന്ധപ്പെട്ട അർപ്പണങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്. മുഖ്യപാഠം രൂപപരമായ തുറന്ന നില പാലിക്കുകയും മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ നിയമ-ആരാധനാശൈലി. ‘ഇസ്രായേൽഗൃഹം’, ‘യഹ്‌വേ’, ‘ഹോമയാഗം’ തുടങ്ങിയ പ്രധാന ഉറവിടപദങ്ങൾ നിലനിർത്തി; വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനങ്ങളിൽ ചേർത്തിട്ടുണ്ട്.
