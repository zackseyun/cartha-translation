  text: כֹּ֛ל אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א תַקְרִ֑יבוּ כִּי לֹ֥א לְ/רָצ֖וֹן יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/020.yaml
  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: ml
  text: ദോഷമുള്ളതൊന്നും നിങ്ങൾ അർപ്പിക്കരുത്[a]; കാരണം, അത് നിങ്ങൾക്കുവേണ്ടി സ്വീകാര്യമാകുകയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യൂനതയുള്ളതൊന്നും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ യാഗപദം സാധാരണയായി ഒരു അർപ്പണത്തെ അയോഗ്യമാക്കുന്ന ശാരീരിക ദോഷത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അത് നിങ്ങൾക്കുവേണ്ടി സ്വീകരിക്കപ്പെടുകയില്ല.’
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: ന്യൂനതയുള്ള ഒന്നും
  rationale: ഹീബ്രു പ്രയോഗം ന്യൂനതയുള്ള ഏതൊന്നിനെയും ഉൾക്കൊള്ളുന്ന സമഗ്രമായ നിരോധനമാണ്. മലയാളത്തിലെ നിഷേധവാക്യത്തിൽ ‘ഒന്നും’ എന്നത് ഈ വ്യാപ്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מוּם
  choice: ന്യൂനത
  rationale: യാഗാർപ്പണത്തിന് അയോഗ്യത വരുത്തുന്ന ശാരീരിക ദോഷത്തെയാണ് പുരോഹിത-യാഗസന്ദർഭത്തിലെ പദം സൂചിപ്പിക്കുന്നത്. ‘ന്യൂനത’ മാന്യവും സ്വാഭാവികവുമായ പൊതുപദമാണ്; ‘വൈകല്യം’ എന്നത് ജീവിയെയോ വ്യക്തിയെയോ അനാവശ്യമായി മുദ്രകുത്തുന്ന ഭാവം നൽകാം.
- source_word: לֹא תַקְרִיבוּ
  choice: നിങ്ങൾ അർപ്പിക്കരുത്
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ കൊണ്ടുവന്ന് അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അർപ്പിക്കുക’ ഈ യാഗപരമായ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഇവിടെ כִּי നിരോധനത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നു; ‘കാരണം’ നിയമവാക്യത്തിന്റെ യുക്തിബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: അത് നിങ്ങൾക്കുവേണ്ടി സ്വീകാര്യമാകുകയില്ല
  rationale: לְרָצוֹן യാഗം ദൈവസന്നിധിയിൽ അനുകൂലമായി സ്വീകരിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. לָכֶם എന്നതിലെ പ്രയോജനാർഥകമായോ പ്രതിനിധ്യപരമായോ ഉള്ള ഭാവം ‘നിങ്ങൾക്കുവേണ്ടി’ നിലനിർത്തുന്നു; വാക്യം സ്വീകാര്യതയോ സ്വീകരിക്കപ്പെടലോ എന്ന യഥാർത്ഥ സൂക്ഷ്മത തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: യാഗപരമായ സ്വീകാര്യതയുടെ ഭാഷ
  choice: നിങ്ങൾക്കുവേണ്ടി സ്വീകാര്യമാകുകയില്ല
  alternative: നിങ്ങൾക്കുവേണ്ടി സ്വീകരിക്കപ്പെടുകയില്ല
  rationale: ഈ വാക്യം യാഗവസ്തു ദൈവസന്നിധിയിൽ അനുകൂലമായി സ്വീകരിക്കപ്പെടുമോ എന്നതിനെക്കുറിച്ചാണ്. ‘സ്വീകാര്യമാകുക’ എന്നത് യോഗ്യതയുടെയും അനുകൂലസ്വീകരണത്തിന്റെയും സൂക്ഷ്മത നിലനിർത്തുന്നു; ‘നിങ്ങൾക്കുവേണ്ടി’ എന്നത് לָכֶם എന്ന പദത്തിന്റെ ബന്ധപരമായ അർത്ഥം മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ യാഗനിയമത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ദൈവം എന്ന കർത്താവ് മൂലപാഠത്തിൽ വ്യക്തമാക്കാത്തതിനാൽ വാക്യത്തിൽ ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
