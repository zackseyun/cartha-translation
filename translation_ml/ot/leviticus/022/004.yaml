revisions:
- from: അഹരോന്റെ സന്തതിയിൽപ്പെട്ട ഏതൊരു പുരുഷനും ചർമരോഗം ബാധിച്ചവനോ[a] സ്രവമുള്ളവനോ ആണെങ്കിൽ, ശുദ്ധനാകുന്നതുവരെ വിശുദ്ധവസ്തുക്കളിൽനിന്ന് ഭക്ഷിക്കരുത്. മൃതശരീരംമൂലം അശുദ്ധമായ എന്തിനെയെങ്കിലും തൊടുന്നവനോ[b], ബീജസ്രാവം ഉണ്ടാകുന്ന ഒരു പുരുഷനെ തൊടുന്നവനോ,
  to: അഹരോന്റെ സന്തതിയിൽപ്പെട്ട ഏതൊരു പുരുഷനും ചർമരോഗം ബാധിച്ചവനോ[a] ശരീരസ്രാവമുള്ളവനോ ആണെങ്കിൽ, ശുദ്ധനാകുന്നതുവരെ വിശുദ്ധവസ്തുക്കളിൽനിന്ന് ഭക്ഷിക്കരുത്. മൃതശരീരസമ്പർക്കത്താൽ അശുദ്ധമായ എന്തിനെയെങ്കിലും തൊടുന്നവനോ[b], ബീജസ്രാവം അവനിൽനിന്ന് പുറപ്പെടുന്ന ഒരു പുരുഷനോ,
  rationale: The revision improves Malayalam idiom and explicitly conveys corpse-related ritual impurity while preserving the source expression's disputed breadth through a footnote. It also clarifies the bodily sense of זָב. The terminal comma is retained because the Hebrew sentence continues in the following verse.
