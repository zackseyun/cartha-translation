source:
  edition: WLC
  text: אִ֣ישׁ אִ֞ישׁ מִ/זֶּ֣רַע אַהֲרֹ֗ן וְ/ה֤וּא צָר֨וּעַ֙ א֣וֹ זָ֔ב בַּ/קֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְ/הַ/נֹּגֵ֨עַ֙ בְּ/כָל טְמֵא נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר תֵּצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: ml
  text: അഹരോന്റെ സന്തതിയിൽപ്പെട്ട ഏതൊരു പുരുഷനും ചർമരോഗം ബാധിച്ചവനോ[a] ശരീരസ്രാവമുള്ളവനോ ആണെങ്കിൽ, ശുദ്ധനാകുന്നതുവരെ വിശുദ്ധവസ്തുക്കളിൽനിന്ന് ഭക്ഷിക്കരുത്. മൃതശരീരസമ്പർക്കത്താൽ അശുദ്ധമായ എന്തിനെയെങ്കിലും തൊടുന്നവനോ[b], ബീജസ്രാവം അവനിൽനിന്ന് പുറപ്പെടുന്ന ഒരു പുരുഷനോ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘കുഷ്ഠരോഗി’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. എന്നാൽ ഹീബ്രു പദം ആചാരപരമായി അശുദ്ധിയുണ്ടാക്കുന്ന പലതരം ചർമാവസ്ഥകളെ സൂചിപ്പിക്കാം; അത് ആധുനിക കുഷ്ഠരോഗം (ഹാൻസൺസ് രോഗം) മാത്രമെന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘മൃതശരീരംമൂലം അശുദ്ധനായ ഏതെങ്കിലും വ്യക്തിയെ തൊടുന്നവനോ.’ ഈ ചുരുക്കം ഹീബ്രു പ്രയോഗം മൃതശരീരവുമായി ബന്ധപ്പെട്ട അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ പരാമർശവിഷയത്തിൽ വ്യത്യസ്ത വ്യാഖ്യാനങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ מִזֶּרַע אַהֲרֹן
  choice: അഹരോന്റെ സന്തതിയിൽപ്പെട്ട ഏതൊരു പുരുഷനും
  rationale: ഇരട്ടിച്ച אִישׁ വിതരണാർഥത്തിൽ ‘ഏതൊരു പുരുഷനും’ എന്നാണ്; പുരോഹിതസന്ദർഭത്തിലെ പുരുഷവംശജനെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: צָרוּעַ
  choice: ചർമരോഗം ബാധിച്ചവൻ
  rationale: ഈ പദം ആചാരപരമായി അശുദ്ധിയുണ്ടാക്കുന്ന വിശാലമായൊരു ചർമാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ആധുനിക ഹാൻസൺസ് രോഗവുമായി തെറ്റായി തുല്യമാക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: זָב
  choice: സ്രവമുള്ളവൻ
  rationale: ആചാരപരമായ അശുദ്ധിക്കിടയാക്കുന്ന ശരീരസ്രവമുള്ള വ്യക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; സംക്ഷിപ്തവും മാന്യവുമായ പ്രയോഗം.
- source_word: בַּקֳּדָשִׁים לֹא יֹאכַל
  choice: വിശുദ്ധവസ്തുക്കളിൽനിന്ന് ഭക്ഷിക്കരുത്
  rationale: പുരോഹിതർക്കുള്ള പ്രതിഷ്ഠിത ഭക്ഷ്യവിഹിതങ്ങളെയാണ് ‘വിശുദ്ധവസ്തുക്കൾ’ സൂചിപ്പിക്കുന്നത്; നിയമപരമായ നിരോധനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: ശുദ്ധനാകുന്നതുവരെ
  rationale: ആചാരപരമായ അശുദ്ധിയിൽനിന്ന് ശുദ്ധാവസ്ഥയിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുന്നു.
- source_word: בְּכָל טְמֵא נֶפֶשׁ
  choice: മൃതശരീരംമൂലം അശുദ്ധമായ എന്തിനെയെങ്കിലും
  rationale: മരണവുമായി ബന്ധപ്പെട്ട അശുദ്ധിയെ സൂചിപ്പിക്കുന്ന ദുഷ്കരമായ ഹീബ്രു പ്രയോഗത്തിന്റെ വസ്തുനിഷ്ഠ വായന നൽകുന്നു; വ്യക്തിയെ സൂചിപ്പിക്കാമെന്ന വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: שִׁכְבַת זָרַע
  choice: ബീജസ്രാവം
  rationale: ശുക്ലത്തിന്റെ പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന് വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളം.
- source_word: אִישׁ אֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: ബീജസ്രാവം ഉണ്ടാകുന്ന ഒരു പുരുഷൻ
  rationale: മൂലപാഠത്തിലെ പുരുഷസൂചനയും ശരീരത്തിൽനിന്നുള്ള സ്രാവവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആചാരപരമായ അശുദ്ധിയെ ആധുനിക രോഗനിർണയമോ ധാർമിക കുറ്റമോ ആയി അവതരിപ്പിക്കാതിരിക്കുക
  choice: ‘ചർമരോഗം ബാധിച്ചവൻ’, ‘ശുദ്ധനാകുന്നതുവരെ’ എന്നിങ്ങനെ ആചാരപരമായ പശ്ചാത്തലം നിലനിർത്തുക
  alternative: ‘കുഷ്ഠരോഗി’, ‘സൗഖ്യം പ്രാപിക്കുന്നതുവരെ’
  rationale: വാക്യം പുരോഹിതന്റെ ആചാരപരമായ യോഗ്യതയെക്കുറിച്ചാണ്; നിർദിഷ്ടമായ ആധുനിക രോഗമോ വ്യക്തിപരമായ പാപവിധിയോ ഇവിടെ ഉദ്ദേശിക്കുന്നില്ല.
- issue: നിയമത്തിലെ ലിംഗസൂചന
  choice: ‘ഏതൊരു പുരുഷനും’ എന്ന് പരിഭാഷപ്പെടുത്തുക
  alternative: ‘ആരെങ്കിലും’ അല്ലെങ്കിൽ ‘ഏതൊരു വ്യക്തിയും’
  rationale: ഹീബ്രു വ്യാകരണപരമായി പുരുഷലിംഗത്തിലാണ്; സന്ദർഭം അഹരോന്റെ പുരുഷവംശജരായ പുരോഹിതരെക്കുറിച്ചുമാണ്.
- issue: മൃതശരീരവുമായി ബന്ധപ്പെട്ട അശുദ്ധിയുടെ വാക്യഘടനാപരമായ അനിശ്ചിതത്വം
  choice: മൃതശരീരംമൂലം അശുദ്ധമായ എന്തിനെയെങ്കിലും തൊടുന്നതായി മുഖ്യപാഠത്തിൽ നൽകുക
  alternative: മൃതശരീരംമൂലം അശുദ്ധനായ ഒരാളെ തൊടുക
  rationale: טְמֵא נֶפֶשׁ എന്ന സങ്കുചിത പ്രയോഗം ഒന്നിലധികം വിധത്തിൽ ഗ്രഹിക്കാം; മുഖ്യപാഠം ഒരു സ്വാഭാവിക വായന നൽകുകയും മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. സാങ്കേതികമായ ആചാരപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകി; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
