source:
  edition: WLC
  text: וְ/שׁ֖וֹר אוֹ שֶׂ֑ה אֹת֣/וֹ וְ/אֶת בְּנ֔/וֹ לֹ֥א תִשְׁחֲט֖וּ בְּ/י֥וֹם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/028.yaml
  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: ml
  text: കാളയോ ചെമ്മരിയാടോ ആയാലും, അതിനെയും അതിന്റെ കുഞ്ഞിനെയും ഒരേ ദിവസം അറുക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചെമ്മരിയാട്” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാം. “അതിന്റെ കുഞ്ഞ്” എന്നതിന് എബ്രായത്തിൽ അക്ഷരാർഥം “അതിന്റെ മകൻ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: കാള
  rationale: വലിയ കന്നുകാലിവർഗത്തിലെ ഒരു മൃഗത്തെ സൂചിപ്പിക്കുന്ന നിയമശൈലിയിലെ സ്വാഭാവിക ഏകവചനപ്രയോഗം; ലിംഗം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: שֶׂה
  choice: ചെമ്മരിയാട്
  rationale: ഈ സന്ദർഭത്തിൽ കൂട്ടത്തിലെ ചെറിയ കന്നുകാലിയെ സൂചിപ്പിക്കുന്നു. പദത്തിന് ആടിനെയോ ചെമ്മരിയാടിനെയോ സൂചിപ്പിക്കാനാകുന്നതിനാൽ ഈ പരിധി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: അതിനെയും അതിന്റെ കുഞ്ഞിനെയും
  rationale: അക്ഷരാർഥത്തിലെ ‘അതും അതിന്റെ മകനും’ എന്ന മൃഗസംബന്ധിയായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അതിന്റെ കുഞ്ഞ്’ എന്നു നൽകുന്നു; അമ്മയാണെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു ചേർക്കുന്നില്ല.
- source_word: תִשְׁחֲטוּ
  choice: അറുക്കരുത്
  rationale: ബലിമൃഗങ്ങളെയും ഭക്ഷണത്തിനുള്ള മൃഗങ്ങളെയും കൊല്ലുന്നതിനുള്ള שׁחט എന്ന സാങ്കേതിക ക്രിയയ്ക്ക് സ്വാഭാവികവും കൃത്യവുമായ മലയാളം.
- source_word: בְּיוֹם אֶחָד
  choice: ഒരേ ദിവസം
  rationale: അക്ഷരാർഥം ‘ഒരു ദിവസത്തിൽ’ എന്നാണെങ്കിലും, നിരോധനം മൃഗത്തെയും അതിന്റെ കുഞ്ഞിനെയും ഒരേ ദിവസത്തിൽ അറുക്കുന്നതിനെക്കുറിച്ചാണെന്ന നിയമപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְ... אוֹ
  choice: '...യോ ...യോ ആയാലും'
  rationale: ആദ്യ സംയോജകവും אוֹ എന്ന വികൽപസൂചകവും ചേർന്ന നിയമപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: മൃഗം മാതാവാണോ എന്ന ചോദ്യം
  choice: ലിംഗനിരപേക്ഷമായി ‘അതിനെ’ എന്നു നിലനിർത്തി
  alternative: ‘തള്ളമൃഗത്തെയും അതിന്റെ കുഞ്ഞിനെയും’
  rationale: മൂലപാഠം അക്ഷരാർഥത്തിൽ ‘അതും അതിന്റെ മകനും’ എന്നാണ് പറയുന്നത്; ഈ വാക്യത്തിൽ മാതാവെന്ന് തുറന്നുപറയാത്തതിനാൽ ആ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘ഒരേ ദിവസം’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സ്വീകരിച്ചു; മൃഗത്തിന്റെ ലിംഗവും മാതൃത്വവും അനാവശ്യമായി നിർണയിച്ചിട്ടില്ല.
