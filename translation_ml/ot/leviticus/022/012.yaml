  choice: എന്നാൽ ഒരു പുരോഹിതന്റെ മകൾ
  rationale: മുൻവാക്യത്തിലെ അനുമതിയോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കാൻ waw-നെ ‘എന്നാൽ’ എന്നു വിവർത്തനം ചെയ്തു; construct ബന്ധം ‘ഒരു പുരോഹിതന്റെ മകൾ’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: כִּי תִהְיֶה לְ/אִישׁ זָר
  choice: പുരോഹിതകുടുംബത്തിന് പുറത്തുള്ള ഒരാളെ വിവാഹം കഴിച്ചാൽ
  rationale: ഇവിടെ היה לְאישׁ എന്ന പ്രയോഗം വിവാഹബന്ധത്തെ സൂചിപ്പിക്കുന്നു. זָר വംശീയമായി ‘വിദേശി’ എന്നല്ല, വിശുദ്ധഭക്ഷണത്തിന് അർഹമായ പുരോഹിതകുടുംബവലയത്തിന് പുറത്തുള്ളയാൾ എന്ന അർഥത്തിലാണ്.
- source_word: הִוא
  choice: അവൾ
  rationale: സ്വതന്ത്ര സർവനാമം മലയാളത്തിൽ വ്യക്തമായ കർത്താവായി നിലനിർത്തി; അധിക ഊന്നൽ ചേർത്തില്ല.
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  choice: വിശുദ്ധവസ്തുക്കളിൽനിന്നുള്ള വഴിപാടിൽനിന്ന്
  rationale: תְּרוּמָה വേർതിരിച്ചു സമർപ്പിച്ച സംഭാവനയെയോ വഴിപാടിനെയോ സൂചിപ്പിക്കുന്നു; קֳדָשִׁים എന്ന ബഹുവചനത്തിന്റെ വിശാലമായ ആരാധനാസംബന്ധിയായ അർഥം ‘വിശുദ്ധവസ്തുക്കൾ’ എന്നു നിലനിർത്തി.
- source_word: לֹא תֹאכֵל
  choice: ഭക്ഷിക്കരുത്
  rationale: നിയമപരമായ നിരോധനത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിൽ זָר എന്നതിന്റെ അർഥം
  choice: പുരോഹിതകുടുംബത്തിന് പുറത്തുള്ള ഒരാൾ
  alternative: അന്യൻ; വിദേശി; പുരോഹിതനല്ലാത്തവൻ
  rationale: ലേവ്യർ 22-ന്റെ സന്ദർഭം വംശീയതയല്ല, വിശുദ്ധഭക്ഷണം കഴിക്കാനുള്ള പുരോഹിതകുടുംബത്തിലെ അംഗത്വവും അർഹതയുമാണ്. അതിനാൽ വംശീയമായ ‘വിദേശി’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി സന്ദർഭസൂചിതമായ പരിധി വ്യക്തമാക്കി.
- issue: בתרומת הקדשים എന്ന ഘടന
  choice: വിശുദ്ധവസ്തുക്കളിൽനിന്നുള്ള വഴിപാടിൽനിന്ന്
  alternative: വിശുദ്ധ വഴിപാടുകളിൽനിന്ന്; വിശുദ്ധ ദാനത്തിൽനിന്ന്
  rationale: ഹീബ്രുവിലെ construct ഘടനയും ആരാധനാസംബന്ധിയായ വിശാല വിഭാഗവും കഴിയുന്നത്ര നിലനിർത്തി; ഇത് ഒരു പ്രത്യേകതരം വഴിപാടിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി. ‘പുരോഹിതകുടുംബത്തിന് പുറത്തുള്ള’ എന്ന പ്രയോഗം זָר-ന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു. മുഖ്യവാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അനുബന്ധ അടിക്കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
