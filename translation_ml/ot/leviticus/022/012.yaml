source:
  edition: WLC
  text: וּ/בַת כֹּהֵ֔ן כִּ֥י תִהְיֶ֖ה לְ/אִ֣ישׁ זָ֑ר הִ֕וא בִּ/תְרוּמַ֥ת הַ/קֳּדָשִׁ֖ים לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: ml
  text: എന്നാൽ ഒരു പുരോഹിതന്റെ മകൾ പുരോഹിതനല്ലാത്ത ഒരാളെ വിവാഹം കഴിച്ചാൽ[a], വിശുദ്ധ വഴിപാടുകളിൽനിന്ന് അവൾ ഭക്ഷിക്കരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പുരോഹിതവൃത്തത്തിന് പുറത്തുള്ള ഒരാളെ വിവാഹം കഴിച്ചാൽ.’ അക്ഷരാർഥത്തിൽ, ‘ഒരു അന്യനായ പുരുഷനു [ഭാര്യയായി] ആയാൽ’; ഇവിടെ ഉദ്ദേശിക്കുന്നത് വംശീയമായി വിദേശിയായ ഒരാളെയല്ല, പുരോഹിതനല്ലാത്ത ഒരാളെയാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘വിശുദ്ധ വഴിപാടുകൾ’ എന്നതിന് ‘വിശുദ്ധ ദാനങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. അക്ഷരാർഥത്തിൽ, ‘വിശുദ്ധവസ്തുക്കളുടെ സംഭാവന/വഴിപാട്.’
    reason: lexical_alternative
lexical_decisions:
