reference: Leviticus 22:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: ml
  text: 'അഹരോനോടും അവന്റെ പുത്രന്മാരോടും പറയുക: ഇസ്രായേൽമക്കൾ[b] എനിക്കായി വിശുദ്ധീകരിക്കുന്ന വിശുദ്ധവസ്തുക്കളിൽനിന്ന് അവർ വിട്ടുനിൽക്കുകയും[a] എന്റെ വിശുദ്ധനാമം അപവിത്രമാക്കാതിരിക്കുകയും വേണം. ഞാൻ യഹ്‌വേ ആകുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തങ്ങളെത്തന്നെ അകറ്റിനിർത്തുക’ അല്ലെങ്കിൽ ‘ഒഴിഞ്ഞുനിൽക്കുക’.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇസ്രായേൽമക്കൾ’ എന്നത് ഹീബ്രുവിലെ ഔപചാരിക പ്രയോഗമാണ്; ‘ഇസ്രായേൽജനം’ അല്ലെങ്കിൽ ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: പറയുക
  rationale: ദൈവിക നിർദേശം അവതരിപ്പിക്കുന്ന പീയേൽ ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: וְיִנָּזְרוּ
  choice: വിട്ടുനിൽക്കുക
  rationale: നിഫാൽ രൂപം ഇവിടെ വിശുദ്ധവസ്തുക്കളുമായി ഇടപെടുന്നതിൽനിന്ന് സ്വയം ഒഴിഞ്ഞുനിൽക്കുകയോ വിട്ടുനിൽക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രായോഗിക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ വിശുദ്ധവസ്തുക്കളിൽനിന്ന്
  rationale: קָדְשֵׁי എന്നതിന്റെ വിശാലമായ ആരാധനാസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു; ‘വഴിപാടുകൾ’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു ഉടമ്പടിപരമായ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നതോടൊപ്പം മലയാളത്തിൽ പരിചിതവും സ്വാഭാവികവുമാണ്.
- source_word: יְחַלְּלוּ
  choice: അപവിത്രമാക്കുക
  rationale: വിശുദ്ധമായതിനെ സാധാരണയോ അശുദ്ധമോ ആയി പെരുമാറുക എന്ന חלל എന്ന ധാതുവിന്റെ ആരാധനാസംബന്ധിയായ ശക്തി പ്രകടിപ്പിക്കുന്നു.
- source_word: שֵׁם קָדְשִׁי
  choice: എന്റെ വിശുദ്ധനാമം
  rationale: ഹീബ്രു ഘടനയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള രൂപം.
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: എനിക്കായി അവർ വിശുദ്ധീകരിക്കുന്ന അവയുടെ കാര്യത്തിൽ
  rationale: ബന്ധവാക്യം ഇസ്രായേൽമക്കൾ ദൈവത്തിനായി വിശുദ്ധീകരിക്കുന്ന വിശുദ്ധവസ്തുക്കളിലേക്കാണ് പ്രധാനമായി ചൂണ്ടുന്നതെന്ന് വ്യക്തമാക്കുന്നു; קדש എന്ന പദകുടുംബത്തിന്റെ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ ടെട്രാഗ്രാമറ്റോണിന്റെ വ്യക്തിനാമരൂപം ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: ‘എനിക്കായി അവർ വിശുദ്ധീകരിക്കുന്ന’ എന്ന ബന്ധവാക്യത്തിന്റെ സൂചകം
  choice: ബന്ധവാക്യം പ്രധാനമായി ‘ഇസ്രായേൽമക്കളുടെ വിശുദ്ധവസ്തുക്കൾ’ എന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
  alternative: വാക്യത്തിന്റെ ഉപരിതലക്രമത്തിൽ അത് ‘എന്റെ വിശുദ്ധനാമം’ എന്നതിനോട് ബന്ധപ്പെടുത്തി വായിക്കാം.
  rationale: സന്ദർഭവും ‘വിശുദ്ധീകരിക്കുക’ എന്ന ക്രിയയുടെ കർമാർഥവും ഇസ്രായേൽ ദൈവത്തിനായി സമർപ്പിക്കുന്ന വിശുദ്ധവസ്തുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; അവയെ പുരോഹിതർ തെറ്റായി കൈകാര്യം ചെയ്യുന്നതാണ് ദൈവത്തിന്റെ വിശുദ്ധനാമത്തെ അപവിത്രമാക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ലേവ്യപുസ്തകത്തിലെ വിശുദ്ധി-ആരാധനാ ഭാഷയുടെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘വിശുദ്ധവസ്തുക്കൾ’, ‘അപവിത്രമാക്കുക’, ‘വിശുദ്ധീകരിക്കുക’ എന്നീ പദങ്ങൾ ഉറവിടത്തിലെ ആവർത്തിക്കുന്ന വിശുദ്ധി-പദബന്ധം സംരക്ഷിക്കുന്നു.
