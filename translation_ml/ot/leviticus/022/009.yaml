  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתִּ֗/י וְ/לֹֽא יִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא וּ/מֵ֥תוּ ב֖/וֹ כִּ֣י יְחַלְּלֻ֑/הוּ אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: ml
  text: അവർ എന്റെ ചുമതല പാലിക്കണം; അതുനിമിത്തം പാപം വഹിക്കാതിരിക്കേണ്ടതിന്, അതിനെ അപവിത്രമാക്കുന്നതുകൊണ്ട് അവർ മരിക്കാതിരിക്കേണ്ടതിന്. അവരെ വിശുദ്ധീകരിക്കുന്ന യഹ്‌വേ ഞാൻ ആകുന്നു.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതുനിമിത്തം കുറ്റക്കാരാകുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘പാപം വഹിക്കുക’ എന്ന എബ്രായ പ്രയോഗം കുറ്റബാധ്യത ഏറ്റുവരുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അതുനിമിത്തം മരിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘അതിനെ അപവിത്രമാക്കുക’ അല്ലെങ്കിൽ ‘അതിനെ സാധാരണമായി കണക്കാക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: ‘അവരെ വിശുദ്ധരാക്കുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: കാത്തുകൊള്ളണം
  rationale: നിയമപരവും ആരാധനാസംബന്ധവുമായ പശ്ചാത്തലത്തിൽ ‘കാത്തുസൂക്ഷിക്കുക/പാലിക്കുക’ എന്ന നിർബന്ധാർഥം നൽകുന്നു; സാധാരണ വായനക്കാർക്കും സ്വാഭാവികമാണ്.
- source_word: מִשְׁמַרְתִּי
  choice: എന്റെ ചുമതല
  rationale: ഏൽപ്പിക്കപ്പെട്ട കർത്തവ്യം, ഉത്തരവാദിത്വം എന്നീ ആശയങ്ങൾ നിലനിർത്തുന്നു; ‘കല്പന’ എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: അതുനിമിത്തം പാപം വഹിക്കുക
  rationale: ‘പാപം വഹിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും കുറ്റബാധ്യതയുടെ സാധ്യതയും സംരക്ഷിക്കുന്നു; עָלָיו എന്നതിനെ ‘അതുനിമിത്തം’ എന്നു കാരണബന്ധത്തോടെ നൽകുന്നു.
- source_word: וּמֵתוּ בוֹ
  choice: അതുമൂലം മരിക്കുക
  rationale: בּוֹ സൂചിപ്പിക്കുന്ന കാരണപരമായോ ബന്ധപ്പെട്ടതായോ ഉള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൃത്യമായ സൂചനയെ നിർബന്ധിച്ച് വിശദീകരിക്കുന്നില്ല.
- source_word: יְחַלְּלֻהוּ
  choice: അതിനെ അശുദ്ധമാക്കുക
  rationale: വിശുദ്ധമായതിനെ അശുദ്ധമാക്കുക/സാധാരണമായി കണക്കാക്കുക എന്ന പുരോഹിതീയ വിശുദ്ധി-വിരുദ്ധത വ്യക്തമാക്കുന്നു; ‘അപവിത്രമാക്കുക’ എന്നത് ഒരു സാധുവായ പകരമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מְקַדְּשָׁם
  choice: അവരെ വിശുദ്ധീകരിക്കുന്ന
  rationale: അവരെ വിശുദ്ധരായി വേർതിരിക്കുന്ന യഹ്‌വേയുടെ പ്രവർത്തനം നിലനിർത്തുന്ന, ഗൗരവമുള്ളതും പരിചിതവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: ‘അതുനിമിത്തം / അതുമൂലം / അതിനെ’ എന്നീ സർവനാമങ്ങളുടെ സൂചന
  choice: എബ്രായത്തിലെ ഏകവചന സർവനാമങ്ങളെ പൊതുവായ ‘അത്’ രൂപത്തിൽ നിലനിർത്തി.
  alternative: അവ വിശുദ്ധഭക്ഷണത്തെയോ യഹ്‌വേയുടെ ചുമതലയെയോ വ്യക്തമായി സൂചിപ്പിക്കുന്നു എന്നു പരിഭാഷയിൽ നിർണ്ണയിക്കുക.
  rationale: ഉടൻമുമ്പുള്ള പശ്ചാത്തലം വിശുദ്ധവസ്തുക്കളെയും വാക്യം ‘എന്റെ ചുമതല’യെയും പരാമർശിക്കുന്നു. മൂലപാഠം നാമം ആവർത്തിക്കാത്തതിനാൽ സൂചനയെ അതിരുകടന്ന് വ്യക്തമാക്കാതെ യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: מְקַדְּשָׁם എന്നതിന്റെ ആശയം
  choice: ‘അവരെ വിശുദ്ധീകരിക്കുന്ന’ എന്നു നൽകി.
  alternative: ‘അവരെ വിശുദ്ധരാക്കുന്ന’ അല്ലെങ്കിൽ ‘അവരെ പ്രതിഷ്ഠിക്കുന്ന’.
  rationale: ദൈവമാണ് അവരെ വിശുദ്ധരായി വേർതിരിക്കുന്നത് എന്ന ആശയം നിലനിർത്തുന്നു; ഒരു പ്രത്യേക സമ്പ്രദായത്തിന്റെ സാങ്കേതിക അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. നിയമപരമായ നിർബന്ധം ‘കാത്തുകൊള്ളണം’ എന്നതിലൂടെ സ്വാഭാവികമായി നൽകി. എബ്രായ സർവനാമങ്ങളുടെ അവ്യക്തത സംരക്ഷിച്ചു; ആരാധനാസംബന്ധമായ വിശുദ്ധി-അശുദ്ധി പദസഞ്ചയം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നിലനിർത്തി.
