language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: ml
  text: അതിനെ തൊടുന്ന വ്യക്തി സന്ധ്യവരെ അശുദ്ധാവസ്ഥയിലായിരിക്കും; തന്റെ ശരീരം വെള്ളത്തിൽ കഴുകാതെ[b] വിശുദ്ധമായവയിൽനിന്ന്[a] ഒന്നും ഭക്ഷിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിശുദ്ധ വഴിപാടുകളിൽനിന്ന്’ / ‘പ്രതിഷ്ഠിക്കപ്പെട്ട വസ്തുക്കളിൽനിന്ന്.’
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘തന്റെ മാംസം വെള്ളത്തിൽ കഴുകിയില്ലെങ്കിൽ.’ ഇവിടെ ‘മാംസം’ എന്നത് ശരീരത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: വ്യക്തി
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ ഈ പദം ശരീരരഹിതമായ ‘ആത്മാവ്’ എന്നതിനേക്കാൾ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ഏകവചനത്തിലുള്ള നിയമപ്രസ്താവനയും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: അതിനെ തൊടുന്ന
  rationale: ക്രിയയുടെ സ്ത്രീലിംഗരൂപം נֶפֶשׁ എന്ന വ്യാകരണപരമായി സ്ത്രീലിംഗമായ നാമത്തോടാണ് പൊരുത്തപ്പെടുന്നത്; അത് ആ വ്യക്തിയുടെ ജൈവലിംഗം സൂചിപ്പിക്കുന്നില്ല. ‘അതിനെ’ എന്നത് മുൻസന്ദർഭത്തിലെ അശുദ്ധിയുടെ ഉറവിടത്തെ അനാവശ്യമായി മനുഷ്യനോ പുരുഷനോ ആക്കി നിർണയിക്കാതെ വിടുന്നു.
- source_word: וְטָמְאָה
  choice: അശുദ്ധനായിരിക്കും
  rationale: ഇത് സ്പർശത്തിന്റെ ഫലമായ ആചാരപരമായ അശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; നിയമപരമായ പ്രസ്താവനയ്ക്ക് യോജിച്ച രൂപമാണിത്.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: അശുദ്ധാവസ്ഥ എത്രകാലം നീളുന്നു എന്നത് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא יֹאכַל
  choice: ഒന്നും ഭക്ഷിക്കരുത്
  rationale: നിയമസന്ദർഭത്തിലെ നിരോധനം വ്യക്തമായി അറിയിക്കുന്നു; מן എന്ന ഭാഗികപ്രയോഗത്തിന്റെ അർഥവും ‘ഒന്നും’ ഉൾക്കൊള്ളുന്നു.
- source_word: מִן הַקֳּדָשִׁים
  choice: വിശുദ്ധവസ്തുക്കളിൽനിന്ന്
  rationale: പ്രതിഷ്ഠിക്കപ്പെട്ട വിശുദ്ധഭക്ഷണം അഥവാ വഴിപാടുകൾ ഉൾപ്പെടാവുന്ന ബഹുവചനപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: כִּי אִם
  choice: കഴുകാതെ … ഭക്ഷിക്കരുത്
  rationale: ഭക്ഷിക്കാൻ മുമ്പ് നിറവേറ്റേണ്ട വ്യവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിലെ നിഷേധാത്മക വ്യവസ്ഥാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: തന്റെ ശരീരം വെള്ളത്തിൽ കഴുകാതെ
  rationale: בשר എന്നതിന്റെ അക്ഷരാർഥം ‘മാംസം’ ആണെങ്കിലും ഇവിടെ അത് മുഴുവൻ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ശാരീരിക പ്രവൃത്തി ഇതിലൂടെ വ്യക്തമാകുന്നു.
theological_decisions:
- issue: അശുദ്ധി എന്ന ഭാഷയുടെ സ്വഭാവം
  choice: ആചാരപരമായ അശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്ന ‘അശുദ്ധൻ’
  alternative: ധാർമിക കുറ്റമോ പാപമോ സൂചിപ്പിക്കുന്ന ഭാഷ
  rationale: വിശുദ്ധവസ്തുക്കൾ ഭക്ഷിക്കാനുള്ള യോഗ്യത, സ്പർശംമൂലമുള്ള അശുദ്ധി, വെള്ളത്തിൽ കഴുകൽ എന്നിവയാണ് സന്ദർഭം. വാക്യം പ്രസ്താവിക്കാത്ത ധാർമിക കുറ്റബോധം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: בּוֹ എന്ന സർവനാമത്തിന്റെ സൂചന
  choice: ‘അതിനെ’ എന്നു നൽകി മുൻസന്ദർഭത്തിലെ അശുദ്ധിയുടെ ഉറവിടത്തിലേക്കുള്ള സൂചന തുറന്നുവെക്കുന്നു
  alternative: ‘അവനെ’ എന്നു നൽകി നിർബന്ധമായി ഒരു പുരുഷമനുഷ്യനെ സൂചിപ്പിക്കൽ
  rationale: മുൻസന്ദർഭത്തിൽ മനുഷ്യനും മനുഷ്യനല്ലാത്ത അശുദ്ധിയുടെ ഉറവിടങ്ങളും വരുന്നതിനാൽ സൂചനയെ അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘വ്യക്തി’ ലിംഗനിരപേക്ഷമാണ്; തുടർന്ന് കർത്താവ് ആവർത്തിക്കാതെ സ്വാഭാവിക മലയാളവാക്യഘടന പാലിച്ചു. അർധവിരാമം ഫലമായ അശുദ്ധാവസ്ഥയെയും അതിനോടനുബന്ധിച്ച ഭക്ഷണനിരോധനത്തെയും ബന്ധിപ്പിക്കുന്നു.
