    rationale: The Hebrew technical term refers more broadly to offerings made by fire, not solely to the offering type conventionally called a burnt offering. ‘അഗ്നിയാഗങ്ങൾ’ retains the broader scope.
  - severity: low
    issue: ‘അവനിൽ വൈകല്യമുള്ളതിനാൽ’ changes the form and emphasis of the second occurrence of מוּם.
    rationale: מוּם בּוֹ is a nominal assertion, ‘a defect is in him,’ not explicitly a causal clause. ‘അവനിൽ വൈകല്യമുണ്ട്’ preserves this wording while still reading naturally in Malayalam.
