id: LEV.21.21
reference: Leviticus 21:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: ml
  text: പുരോഹിതനായ അഹരോന്റെ സന്തതിയിൽ ശരീരവൈകല്യമുള്ള ഒരുവനും യഹോവയ്ക്കുള്ള അഗ്നിയാഗങ്ങൾ[a] അർപ്പിക്കാൻ അടുത്തുവരരുത്. അവനിൽ വൈകല്യമുണ്ട്; തന്റെ ദൈവത്തിന്റെ അപ്പം[b] അർപ്പിക്കാൻ അവൻ അടുത്തുവരരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയ്ക്കുള്ള ഭക്ഷണയാഗങ്ങൾ.’
    reason: lexical_alternative
  - marker: b
    text: ‘തന്റെ ദൈവത്തിന്റെ അപ്പം’ എന്നത് ദൈവത്തിന് യാഗമായി സമർപ്പിക്കുന്ന ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്ന പുരോഹിതപരമായ പ്രയോഗമാണ്; അഥവാ, ‘തന്റെ ദൈവത്തിന്റെ ഭക്ഷണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: ഒരുവനും ... വരരുത്
  rationale: כָּל എന്ന പദവും തുടർന്നുള്ള നിഷേധവും ചേർന്ന് സാർവത്രിക വിലക്ക് സൂചിപ്പിക്കുന്നു. പുരുഷ പുരോഹിതരെക്കുറിച്ചുള്ള നിയമസന്ദർഭം നിലനിർത്താൻ ‘ഒരുവനും’ ഉപയോഗിച്ചു.
- source_word: מוּם
  choice: ശാരീരിക വൈകല്യം
  rationale: ഈ പുരോഹിതനിയമസന്ദർഭത്തിൽ മוּם ശരീരസംബന്ധമായ, ശുശ്രൂഷയിൽനിന്ന് അയോഗ്യനാക്കുന്ന അവസ്ഥകളെയാണ് സൂചിപ്പിക്കുന്നത്; ആ പരിധി വ്യക്തമാക്കാൻ ‘ശാരീരിക’ ചേർത്തു.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: അഹരോന്റെ സന്തതിയിൽ
  rationale: זֶרַע ഇവിടെ വംശപരമ്പരയെയോ പിൻതലമുറയെയോ സൂചിപ്പിക്കുന്നു; ‘സന്തതി’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളമാണ്.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: അഹരോനെ വിശേഷിപ്പിക്കുന്ന സമാനാധികരണപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: יִגַּשׁ
  choice: അടുത്തുവരരുത്
  rationale: ബലിയർപ്പണശുശ്രൂഷയ്ക്കായി ദൈവസന്നിധിയിലേക്ക് സമീപിക്കുന്ന ആശയം നിലനിർത്തുകയും വാക്യത്തിലെ ആവർത്തനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: לְהַקְרִיב
  choice: അർപ്പിക്കാൻ
  rationale: הקריב എന്ന ക്രിയയുടെ യാഗസന്ദർഭത്തിലെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള തത്തുല്യം.
- source_word: אִשֵּׁי יְהוָה
  choice: യഹോവയുടെ ദഹനയാഗങ്ങൾ
  rationale: אִשֶּׁה എന്ന സാങ്കേതിക യാഗപദത്തിന്റെ അഗ്നിയുമായി ബന്ധപ്പെട്ട പരമ്പരാഗത അർത്ഥം ‘ദഹനയാഗങ്ങൾ’ വഴി സൂചിപ്പിക്കുന്നു; വിശാലമായ ‘അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗങ്ങൾ’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകി.
- source_word: לֶחֶם אֱלֹהָיו
  choice: തന്റെ ദൈവത്തിന്റെ അപ്പം
  rationale: לֶחֶם എന്നതിന്റെ അക്ഷരാർഥമായ ‘അപ്പം’ നിലനിർത്തി പുരോഹിതഭാഷയിലെ രൂപകം സംരക്ഷിച്ചു; ‘ഭക്ഷണം’ എന്ന വിശാലാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ നിയമനാമത്തെ ‘കർത്താവ്’ എന്ന പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തി; മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപം തെരഞ്ഞെടുത്തു.
- issue: לֶחֶם אֱלֹהָיו എന്ന പുരോഹിതപ്രയോഗം
  choice: തന്റെ ദൈവത്തിന്റെ അപ്പം
  alternative: തന്റെ ദൈവത്തിന്റെ ഭക്ഷണം
  rationale: ദൈവത്തിന് ഭക്ഷണം ആവശ്യമാണെന്ന ആശയം വിശദീകരിച്ച് തീർപ്പാക്കാതെ, മൂലത്തിലെ യാഗപരമായ രൂപകവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി; അർത്ഥപരിധി അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ‘അടുത്തുവരുക’, ‘വൈകല്യം’, ‘അപ്പം’ എന്നീ ആവർത്തനങ്ങളും പുരോഹിതപരമായ ഭാഷയും സാധ്യമായത്ര നിലനിർത്തി; അപൂർവമായ സാങ്കേതിക പദങ്ങൾക്ക് അടിക്കുറിപ്പുകൾ നൽകി.
