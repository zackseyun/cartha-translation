id: LEV.21.12
reference: Leviticus 21:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: ml
  text: അവൻ വിശുദ്ധമന്ദിരത്തിൽനിന്ന് പുറത്തുപോകരുത്; തന്റെ ദൈവത്തിന്റെ വിശുദ്ധമന്ദിരത്തെ അപവിത്രമാക്കരുത്. തന്റെ ദൈവത്തിന്റെ അഭിഷേകതൈലത്തിന്റെ സമർപ്പണപദവി അവന്റെമേൽ ഉള്ളതിനാൽ ഇങ്ങനെ ചെയ്യണം. ഞാൻ യഹോവ ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ
  choice: വിശുദ്ധമന്ദിരത്തിൽനിന്നു
  rationale: מִקְדָּשׁ ഒരു വിശുദ്ധസ്ഥലത്തെയോ ദൈവാലയത്തിലെ വിശുദ്ധമന്ദിരത്തെയോ സൂചിപ്പിക്കുന്നു. പുരോഹിതനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ ‘വിശുദ്ധമന്ദിരം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לֹא יֵצֵא
  choice: പുറത്തുപോകരുത്
  rationale: നിയമപരമായ നിരോധനമായി വരുന്ന qal imperfect-ന്റെ concrete അർഥമായ ‘പുറത്തുപോകുക’ നിലനിർത്തുന്നു.
- source_word: וְלֹא יְחַלֵּל
  choice: അപവിത്രമാക്കുകയും അരുത്
  rationale: חלל എന്ന piel രൂപം വിശുദ്ധമായതിനെ സാധാരണമായോ അശുദ്ധമായോ ആക്കി അതിന്റെ വിശുദ്ധി ലംഘിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അപവിത്രമാക്കുക’ ഈ ആരാധനാപരമായ വിരോധം വ്യക്തമായി നൽകുന്നു.
- source_word: אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: തന്റെ ദൈവത്തിന്റെ വിശുദ്ധമന്ദിരത്തെ
  rationale: എബ്രായത്തിലെ ആവർത്തനം നിയമപരമായ ഊന്നൽ നൽകുന്നതിനാൽ ‘വിശുദ്ധമന്ദിരം’ വീണ്ടും ഉപയോഗിച്ചു; മൂന്നാംപുരുഷ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘തന്റെ ദൈവത്തിന്റെ’ എന്നു നൽകി.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള വിലക്കുകളുടെ അടിസ്ഥാനം അവതരിപ്പിക്കുന്ന കാരണസൂചകപ്രയോഗം വ്യക്തമായി പകരുന്നു.
- source_word: נֵזֶר
  choice: സമർപ്പണം
  rationale: נֵזֶר എന്നതിന് ‘കിരീടം/മകുടം’ എന്നും ‘സമർപ്പണം’ എന്നും അർഥമാകാം. ഇവിടെ അഭിഷേകതൈലവുമായി ചേർന്ന് മഹാപുരോഹിതന്റെ സമർപ്പിതപദവിയാണ് മുഖ്യമായി സൂചിപ്പിക്കുന്നത്. യഥാർഥ പദചിത്രം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: തന്റെ ദൈവത്തിന്റെ അഭിഷേകതൈലത്താലുള്ള
  rationale: Construct chain-ലെ എല്ലാ ഘടകങ്ങളും നിലനിർത്തിക്കൊണ്ട്, נֵזֶר-നോടുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ കാരണ/മാധ്യമബന്ധമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עָלָיו
  choice: അവന്റെമേൽ ഉണ്ട്
  rationale: അഭിഷേകത്തിലൂടെ ലഭിച്ച സമർപ്പിതനില തുടരുന്നു എന്ന ആശയം നൽകുന്ന ‘മേൽ’ എന്ന സ്ഥലസൂചക രൂപകം നിലനിർത്തുന്നു.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹോവ ആകുന്നു
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത്, ലേവ്യപുസ്തകത്തിൽ ആവർത്തിക്കുന്ന ദൈവിക അധികാരപ്രഖ്യാപനത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: മഹാപുരോഹിതന്റെ നിലയുമായി ബന്ധപ്പെട്ട נֵזֶר എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘സമർപ്പണം’
  alternative: ‘തന്റെ ദൈവത്തിന്റെ അഭിഷേകതൈലത്തിന്റെ കിരീടം അവന്റെമേൽ ഉണ്ട്’
  rationale: ഈ വാക്യത്തിലെ ന്യായീകരണം മഹാപുരോഹിതൻ അഭിഷേകത്താൽ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടവനാണെന്നതിലാണ്. അതിനാൽ ‘സമർപ്പണം’ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു. എങ്കിലും ‘കിരീടം/മകുടം’ എന്ന യഥാർഥ പദസാധ്യതയും അതിലെ രാജകീയമോ ചിഹ്നാത്മകമോ ആയ ഭാവവും ഇല്ലാതാക്കാതിരിക്കാൻ അടിക്കുറിപ്പിൽ ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആരാധനാഭാഷ ഉപയോഗിച്ചു. ‘വിശുദ്ധമന്ദിരം,’ ‘അപവിത്രമാക്കുക,’ ‘അഭിഷേകതൈലം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും പുരോഹിതനിയമങ്ങളുടെ ഭാവത്തിന് യോജിച്ചതുമാണ്. എബ്രായത്തിലെ ആവർത്തനവും ‘അവന്റെമേൽ’ എന്ന രൂപകവും നിലനിർത്തി.
