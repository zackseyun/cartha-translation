id: LEV.21.8
reference: Leviticus 21:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/קִדַּשְׁתּ֔/וֹ כִּֽי אֶת לֶ֥חֶם אֱלֹהֶ֖י/ךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה לָּ֔/ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: ml
  text: അവനെ വിശുദ്ധനായി കണക്കാക്കണം[a]; കാരണം അവൻ നിന്റെ ദൈവത്തിന്റെ ഭക്ഷ്യയാഗം അർപ്പിക്കുന്നു. അവൻ നിനക്കു വിശുദ്ധനായിരിക്കും; നിങ്ങളെ വിശുദ്ധീകരിക്കുന്ന യഹോവയായ ഞാൻ വിശുദ്ധനാകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ദൈവത്തിന്റെ അപ്പം.’ ഇവിടെ ‘അപ്പം’ ദൈവത്തിനു അർപ്പിക്കുന്ന ഭക്ഷ്യയാഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: לֶחֶם എന്ന പദത്തിന്റെ അക്ഷരാർഥവും ഈ സന്ദർഭത്തിലെ വിശാലമായ ആരാധനാസംബന്ധിയായ അർഥവും നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: അവനെ വിശുദ്ധനായി കണക്കാക്കണം
  rationale: קדשׁ എന്ന ധാതുവിന്റെ പിയേൽ രൂപം ഇവിടെ പുരോഹിതനെ വിശുദ്ധനായി വേർതിരിച്ച് അതനുസരിച്ച് പരിഗണിക്കണമെന്ന കല്പനയാണ്. സാങ്കേതികത കൂടാതെ ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവത്തിന്റെ ആഹാരം
  rationale: לֶחֶם എന്നതിന് അക്ഷരാർഥത്തിൽ ‘അപ്പം’ എന്നാണെങ്കിലും, പുരോഹിത-യാഗസന്ദർഭത്തിൽ ദൈവത്തിനു സമർപ്പിക്കുന്ന ഭക്ഷ്യയാഗങ്ങളെ വിശാലമായി സൂചിപ്പിക്കാം. ‘ആഹാരം’ ആ ആരാധനാസംബന്ധിയായ വ്യാപക അർഥം നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מַקְרִיב
  choice: അർപ്പിക്കുന്നു
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ കർത്തൃവാചക രൂപം യാഗസന്ദർഭത്തിൽ ഒരു വഴിപാട് ദൈവസന്നിധിയിൽ കൊണ്ടുവന്ന് സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അർപ്പിക്കുന്നു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: അവൻ നിനക്കു വിശുദ്ധനായിരിക്കണം
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ജനത്തോടുള്ള ബന്ധവും ആവർത്തിക്കുന്ന ‘വിശുദ്ധൻ’ എന്ന പദവും ഈ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מְקַדִּשְׁכֶם
  choice: നിങ്ങളെ വിശുദ്ധീകരിക്കുന്ന
  rationale: קדשׁ എന്ന ധാതുവിന്റെ കർത്തൃവാചക രൂപം ദൈവം ജനത്തെ വിശുദ്ധരാക്കുന്ന പ്രവൃത്തി സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധീകരിക്കുന്ന’ എന്നത് തുടക്കത്തിലെ വിശുദ്ധതാഭാഷയുമായുള്ള പദബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: לֶחֶם אֱלֹהֶיךָ എന്ന ആരാധനാസംബന്ധിയായ പ്രയോഗം
  choice: നിന്റെ ദൈവത്തിന്റെ ആഹാരം
  alternative: നിന്റെ ദൈവത്തിന്റെ അപ്പം
  rationale: പുരോഹിതൻ യാഗങ്ങൾ അർപ്പിക്കുന്ന സന്ദർഭമായതിനാൽ ‘ആഹാരം’ എന്ന വിശാലമായ ആരാധനാസംബന്ധിയായ അർഥമാണ് മുഖ്യവാചകത്തിൽ യോജിച്ചത്. എന്നാൽ ‘അപ്പം’ എന്ന അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: קדשׁ എന്ന പദകുടുംബത്തിന്റെ ആവർത്തനം
  choice: വിശുദ്ധൻ / വിശുദ്ധീകരിക്കുന്ന
  alternative: വേർതിരിക്കപ്പെട്ടവൻ / വിശുദ്ധനാക്കുന്ന
  rationale: പുരോഹിതന്റെ വിശുദ്ധപദവിയും യഹോവയുടെ വിശുദ്ധതയും ജനത്തെ വിശുദ്ധീകരിക്കുന്ന അവന്റെ പ്രവൃത്തിയും തമ്മിലുള്ള വാചകബന്ധം ഈ പദങ്ങൾ നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായി അധികം വിശദീകരിക്കുന്നില്ല.
- issue: ദൈവനാമം יְהוָה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: എബ്രായമൂലത്തിലെ വ്യക്തിനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വചനത്തിലെ ഏകവചന അഭിസംബോധന (‘നിന്റെ’, ‘നിനക്കു’)യും ബഹുവചന പ്രത്യയം (‘നിങ്ങളെ’)യും എബ്രായമൂലത്തിന് അനുസരിച്ച് നിലനിർത്തി. ‘വിശുദ്ധൻ/വിശുദ്ധീകരിക്കുന്ന’ എന്ന ആവർത്തനം ദൈവശാസ്ത്രപരവും ശൈലീപരവുമായ ബന്ധം സംരക്ഷിക്കുന്നു.
