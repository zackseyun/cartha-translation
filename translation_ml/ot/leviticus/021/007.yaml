id: LEV.21.7
reference: Leviticus 21:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִשָּׁ֨ה זֹנָ֤ה וַ/חֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְ/אִשָּׁ֛ה גְּרוּשָׁ֥ה מֵ/אִישָׁ֖/הּ לֹ֣א יִקָּ֑חוּ כִּֽי קָדֹ֥שׁ ה֖וּא לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: ml
  text: വേശ്യയെയോ അപവിത്രയാക്കപ്പെട്ട സ്ത്രീയെയോ[a] അവർ വിവാഹം കഴിക്കരുത്. ഭർത്താവിൽനിന്ന് വിവാഹമോചനം ലഭിച്ച സ്ത്രീയെയും അവർ വിവാഹം കഴിക്കരുത്; കാരണം അവൻ തന്റെ ദൈവത്തിനു വിശുദ്ധനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: വിശുദ്ധപദവിക്ക് ഭംഗം വന്ന സ്ത്രീ. എബ്രായപദം പുരോഹിതവിവാഹത്തിന് അയോഗ്യയാക്കുന്ന ഒരു പ്രത്യേക പദവിയെയും സൂചിപ്പിക്കാം.'
    reason: חֲלָלָה എന്ന അപൂർവവും സാങ്കേതികവുമായ പദത്തിന്റെ അർഥവ്യാപ്തിയും യഥാർഥ അനിശ്ചിതത്വവും വായനക്കാരനു വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: זֹנָה (zonah)
  choice: വേശ്യ
  rationale: ലൈംഗികവ്യാപാരത്തിലോ വേശ്യാവൃത്തിയിലോ ഏർപ്പെടുന്ന സ്ത്രീയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ളതും ആധുനിക വായനക്കാർക്കു വ്യക്തവുമായ പദം.
- source_word: חֲלָלָה (chalalah)
  choice: അപവിത്രയാക്കപ്പെട്ട സ്ത്രീ
  rationale: חלל എന്ന ധാതുവുമായി ബന്ധപ്പെട്ട ഈ പദം സാധാരണ ശാരീരിക അശുദ്ധിയേക്കാൾ വിശുദ്ധപദവിക്ക് ഭംഗം വന്ന നിലയെ സൂചിപ്പിക്കുന്നു; അതിന്റെ നിഷ്ക്രിയഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִקָּחוּ (yiqqachu)
  choice: വിവാഹം കഴിക്കരുത്
  rationale: അക്ഷരാർഥത്തിൽ ‘എടുക്കുക’ എന്നാണെങ്കിലും, സ്ത്രീയെ ഭാര്യയായി എടുക്കുക എന്ന വിവാഹസന്ദർഭത്തിലെ എബ്രായ പ്രയോഗമാണിത്.
- source_word: גְּרוּשָׁה מֵאִישָׁהּ (gerushah me’ishah)
  choice: ഭർത്താവ് ഉപേക്ഷിച്ച സ്ത്രീ
  rationale: ‘തന്റെ ഭർത്താവിൽനിന്ന് അയച്ചുകളയപ്പെട്ടവൾ’ എന്ന മൂലവാചകത്തിന്റെ നിഷ്ക്രിയരൂപവും വിവാഹമോചനത്തിന്റെ പുരാതന സാഹചര്യവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: קָדֹשׁ (qadosh)
  choice: വിശുദ്ധൻ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട പുരോഹിതന്റെ വിശുദ്ധപദവിയെ സൂചിപ്പിക്കുന്ന അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബഹുവചന കല്പനകൾക്കുശേഷമുള്ള ഏകവചന സർവനാമം
  choice: ‘അവർ ... അവൻ’ എന്ന സംഖ്യാമാറ്റം നിലനിർത്തി
  alternative: ‘അവരിൽ ഓരോരുത്തനും തന്റെ ദൈവത്തിനു വിശുദ്ധനാണ്’
  rationale: മൂലപാഠത്തിലെ പുരോഹിതന്മാരോടുള്ള ബഹുവചന നിർദേശങ്ങളിൽനിന്ന് പ്രതിനിധിയായ ഏകവചന പുരോഹിതനിലേക്കുള്ള മാറ്റം വ്യാഖ്യാനിച്ച് സമതലപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
- issue: חֲלָלָה എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: അപവിത്രയാക്കപ്പെട്ട സ്ത്രീ
  alternative: അശുദ്ധയായ സ്ത്രീ
  rationale: ആചാരപരമായ അശുദ്ധി മാത്രമെന്ന് തോന്നിപ്പിക്കാതെ, വിശുദ്ധപദവിക്ക് ഭംഗം വന്നതോ വിവാഹയോഗ്യത നഷ്ടപ്പെട്ടതോ ആയ നിലയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്ത്രീയെ എടുക്കുക’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപത്തിനു പകരം വിവാഹസന്ദർഭം വ്യക്തമായി പറയുന്നു; എന്നാൽ മൂലത്തിലെ ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള മാറ്റം നിലനിർത്തിയിട്ടുണ്ട്.
