source:
  edition: WLC
  text: כִּ֚י אִם לִ/שְׁאֵר֔/וֹ הַ/קָּרֹ֖ב אֵלָ֑י/ו לְ/אִמּ֣/וֹ וּ/לְ/אָבִ֔י/ו וְ/לִ/בְנ֥/וֹ וּ/לְ/בִתּ֖/וֹ וּ/לְ/אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/002.yaml
  text: 'except for his close relative who is nearest to him: for his mother[a], for his father, for his son, for his daughter, and for his brother—'
translation:
  language: ml
  text: എന്നാൽ, അവന് ഏറ്റവും അടുത്ത ബന്ധുവിന്[a] വേണ്ടി മാത്രം—അവന്റെ അമ്മയ്ക്കുവേണ്ടിയും അപ്പനുവേണ്ടിയും മകനുവേണ്ടിയും മകൾക്കുവേണ്ടിയും സഹോദരനുവേണ്ടിയും—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബന്ധു’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് അക്ഷരാർഥത്തിൽ ‘മാംസം’ എന്ന അർഥമുണ്ട്; അതിനാൽ ഇതിനെ ‘രക്തബന്ധു’ എന്നോ ‘മാംസബന്ധു’ എന്നോ പരിഭാഷപ്പെടുത്താവുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: എന്നാൽ … മാത്രം
  rationale: മുൻവാക്യത്തിലെ നിരോധനത്തിന് ഒരു ഒഴിവ് നിർദേശിക്കുന്ന നിയമപരമായ പ്രയോഗമാണിത്; മലയാളത്തിൽ ‘എന്നാൽ … മാത്രം’ ആ നിയന്ത്രിത ഒഴിവ് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׁאֵרוֹ
  choice: അവന്റെ … ബന്ധു
  rationale: ശരീരം അഥവാ മാംസം എന്ന അക്ഷരാർഥത്തിൽനിന്ന് അടുത്ത രക്തബന്ധത്തെ സൂചിപ്പിക്കുന്ന പദമാണിത്. ആധുനിക മലയാളത്തിൽ ‘ബന്ധു’ വ്യക്തവും സ്വാഭാവികവുമാണ്; മൂലപദത്തിന്റെ ദേഹബന്ധിയായ ഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַקָּרֹב אֵלָיו
  choice: അവനോട് ഏറ്റവും അടുത്ത
  rationale: ബന്ധുത്വത്തിലെ സാമീപ്യം വ്യക്തമാക്കുന്ന വിശേഷണമാണിത്. ‘ഏറ്റവും അടുത്ത’ എന്നത് പട്ടികയിലെ അടുത്ത കുടുംബബന്ധങ്ങളുടെ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: അവന്റെ അമ്മയ്ക്കുവേണ്ടിയും അപ്പനുവേണ്ടിയും മകനുവേണ്ടിയും മകൾക്കുവേണ്ടിയും സഹോദരനുവേണ്ടിയും
  rationale: ഓരോ ബന്ധുപദത്തിനുമുമ്പുമുള്ള לְ അനുപ്രയോഗം ‘വേണ്ടി’ എന്നു ആവർത്തിച്ച് നൽകുന്നത് എബ്രായ പട്ടികയുടെ നിയമപരമായ ഘടനയും, ആരുടെ മരണത്തോടനുബന്ധിച്ചാണ് ഒഴിവ് അനുവദിക്കുന്നതെന്ന അർഥവും സംരക്ഷിക്കുന്നു.
