  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി ഉപയോഗിച്ചു. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച നിരോധനത്തിന്റെ അപൂർണമായ തുടർച്ചയായതിനാൽ അവസാനത്തിലെ ദീർഘരേഖ നിലനിർത്തി.
