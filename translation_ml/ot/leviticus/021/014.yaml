id: LEV.21.14
reference: Leviticus 21:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: ml
  text: വിധവയെയോ വിവാഹമോചിതയായ സ്ത്രീയെയോ അപവിത്രയായ സ്ത്രീയെയോ[a] വേശ്യയെയോ—ഇവരിൽ ആരെയും അവൻ ഭാര്യയായി സ്വീകരിക്കരുത്. പകരം, സ്വന്തം ജനത്തിൽനിന്നുള്ള ഒരു കന്യകയെ അവൻ ഭാര്യയായി സ്വീകരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “വിശുദ്ധപദവിക്ക് അയോഗ്യയായ സ്ത്രീ” അഥവാ “വിശുദ്ധത നഷ്ടപ്പെട്ട സ്ത്രീ”; എബ്രായപദം പുരോഹിതവിശുദ്ധിനിയമപ്രകാരം വിവാഹത്തിന് അനുയോജ്യമല്ലെന്നു കണക്കാക്കപ്പെട്ട പദവിയുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: വിധവ
  rationale: വിധവയെ സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാള തുല്യപദം.
- source_word: גְרוּשָׁה
  choice: വിവാഹമോചിതയായ സ്ത്രീ
  rationale: അയച്ചുകളയപ്പെട്ട, അഥവാ വിവാഹബന്ധം വേർപെടുത്തപ്പെട്ട സ്ത്രീയെയാണ് രൂപം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ നിയമപരവും വൈവാഹികവുമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: חֲלָלָה
  choice: അപവിത്രയായ സ്ത്രീ
  rationale: പുരോഹിതവിശുദ്ധിയുമായി ബന്ധപ്പെട്ട നിയമത്തിൽ വിശുദ്ധപദവിയുടെ ലംഘനമോ നഷ്ടമോ സൂചിപ്പിക്കുന്ന പദം; പൊതുവായ ആചാരശുദ്ധിയില്ലായ്മ മാത്രം സൂചിപ്പിക്കാതിരിക്കാനായി വ്യത്യസ്ത അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: זֹנָה
  choice: വേശ്യ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ളതും ഇന്നത്തെ മലയാളത്തിൽ സ്വാഭാവികവുമായ തുല്യരൂപം.
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: ഇവരിൽ ആരെയും അവൻ ഭാര്യയായി സ്വീകരിക്കരുത്
  rationale: ‘എടുക്കുക’ എന്ന എബ്രായ വൈവാഹിക പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും എല്ലാ മുൻവിഭാഗങ്ങളെയും കൂട്ടമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי אִם
  choice: പകരം
  rationale: നിരോധനത്തിനു പിന്നാലെ അനുവദിക്കപ്പെട്ട ഏക തിരഞ്ഞെടുപ്പിനെ അവതരിപ്പിക്കുന്ന വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּתוּלָה
  choice: കന്യക
  rationale: ഈ വിവാഹനിയമസന്ദർഭത്തിൽ കന്യകയായ സ്ത്രീ എന്ന അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: מֵעַמָּיו
  choice: സ്വന്തം ജനത്തിൽനിന്നുള്ള
  rationale: അവന്റെ ജനസമൂഹത്തിനുള്ളിൽനിന്നുള്ള ഉത്ഭവം എന്ന מן എന്ന മുൻപ്രത്യയത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: יִקַּח אִשָּׁה
  choice: ഭാര്യയായി സ്വീകരിക്കണം
  rationale: ‘സ്ത്രീയെ/ഭാര്യയെ എടുക്കുക’ എന്ന എബ്രായ വിവാഹപ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതവിവാഹനിയമത്തിലെ חֲלָלָה എന്ന വിശുദ്ധിപദത്തിന്റെ പരിഭാഷ
  choice: അപവിത്രയായ സ്ത്രീ
  alternative: വിശുദ്ധപദവിക്ക് അയോഗ്യയായ സ്ത്രീ; വിശുദ്ധത നഷ്ടപ്പെട്ട സ്ത്രീ
  rationale: മൂലപദം സാധാരണ അശുദ്ധിയെക്കാൾ, പുരോഹിതവിശുദ്ധിയുടെ പരിധിയിൽ അപവിത്രമാക്കപ്പെട്ടതോ വിശുദ്ധപദവിക്ക് അയോഗ്യമായതോ ആയ നിലയെ സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠം സംക്ഷിപ്തമായി നിർത്തി അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘ഭാര്യയായി സ്വീകരിക്കുക’ എന്ന പ്രയോഗം എബ്രായത്തിലെ വൈവാഹിക ‘എടുക്കുക’ എന്ന ഭാഷാശൈലിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ഇംഗ്ലീഷ് പാഠത്തിൽ [a] വിധവയ്ക്കു പിന്നാലെ കാണുന്നുവെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം חֲלָלָה എന്ന പദത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്; അതിനാൽ മലയാള പ്രധാനപാഠത്തിൽ അടയാളം ‘അപവിത്രയായ സ്ത്രീ’ എന്നതിനു പിന്നാലെ സ്ഥാപിച്ചു.
