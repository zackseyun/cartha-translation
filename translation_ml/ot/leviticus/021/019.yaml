  variant: modern standard Malayalam
source:
  edition: WLC
  text: א֣וֹ אִ֔ישׁ אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ שֶׁ֣בֶר רָ֑גֶל א֖וֹ שֶׁ֥בֶר יָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/019.yaml
  text: or a man who has a broken foot or a broken hand,[a]
translation:
  language: ml
  text: അല്ലെങ്കിൽ കാലിനോ കൈക്കോ ഒടിവുള്ള ഒരു പുരുഷൻ;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവനിൽ കാലിന്റെ ഒടിവോ കൈയുടെ ഒടിവോ ഉള്ള ഒരു പുരുഷൻ.’ ഇവിടെ ‘കാൽ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദത്തിന് ‘പാദം’ എന്നും അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: അല്ലെങ്കിൽ
  rationale: യോഗ്യതയില്ലാതാക്കുന്ന ശാരീരിക അവസ്ഥകളുടെ പട്ടിക തുടരുന്ന ലളിതമായ വികല്പസമുച്ചയമാണ്.
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: പുരോഹിതനിയമത്തിന്റെ ഈ സന്ദർഭത്തിൽ എബ്രായ ഏകവചന പുല്ലിംഗനാമം ഒരു പുരുഷപുരോഹിതനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר יִהְיֶה בוֹ
  choice: ഉള്ള
  rationale: അക്ഷരാർഥത്തിൽ ‘അവനിൽ ഉണ്ടായിരിക്കുന്ന’ എന്ന ഘടനയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവസ്ഥ കൈവശമുള്ളതായി ചുരുക്കി പറയുന്നു.
- source_word: שֶׁבֶר
  choice: ഒടിവ്
  rationale: എല്ലിലുണ്ടാകുന്ന പൊട്ടലിനെയോ ഭംഗത്തെയോ സൂചിപ്പിക്കുന്ന നാമമാണ്; ‘ഒടിവ്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: רָגֶל
  choice: കാൽ
  rationale: പദത്തിന്റെ പ്രാഥമിക അർഥം പാദം ആണെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ ‘കാലിന് ഒടിവ്’ എന്നത് പാദഭാഗത്തെയും ഉൾക്കൊള്ളുന്നു; മൂലപദത്തിന്റെ കാൽ/പാദം എന്ന വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: שֶׁבֶר יָד
  choice: കൈക്ക് ഒടിവ്
  rationale: ആവർത്തിച്ചിരിക്കുന്ന ‘ഒടിവ്’ എന്ന നാമഘടന നിലനിർത്തുന്നു; יָד-ന്റെ നേരിട്ടുള്ള തുല്യം ‘കൈ’ ആണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപ്പട്ടിക തുടരുന്നതിനാൽ വാക്യഭാഗത്തിന്റെ അവസാനം അർധവിരാമം ഉപയോഗിച്ചു; [a] മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
