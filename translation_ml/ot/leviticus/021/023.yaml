id: LEV.21.23
reference: Leviticus 21:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: ml
  text: എങ്കിലും, അവൻ തിരശ്ശീലയ്ക്കുള്ളിലേക്കു[a] പ്രവേശിക്കുകയോ യാഗപീഠത്തിനരികിലേക്കു വരുകയോ പാടില്ല; അവനിൽ ഒരു ശാരീരിക വൈകല്യമുള്ളതിനാൽ, എന്റെ വിശുദ്ധസ്ഥാനങ്ങളെ[c] അപവിത്രമാക്കാതിരിക്കേണ്ടതിന്. അവയെ വിശുദ്ധീകരിക്കുന്ന യാഹ്‌വേ ഞാനാകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തിരശ്ശീലയിലേക്കു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം വിശുദ്ധമന്ദിരത്തിലെ അകത്തെ തിരശ്ശീലയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ‘എന്റെ വിശുദ്ധസ്ഥാനങ്ങൾ’ എന്ന ബഹുവചനമാണ്; ചില പരിഭാഷകൾ അത് ‘എന്റെ വിശുദ്ധസ്ഥാനം’ എന്ന് ഏകവചനമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എങ്കിലും
  rationale: മുൻവാക്യത്തിൽ അനുവദിച്ച കാര്യത്തിനു പിന്നാലെ വരുന്ന നിയന്ത്രണത്തെ സ്വാഭാവികമായ വൈരുധ്യഭാവത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: הַפָּרֹכֶת
  choice: തിരശ്ശീല
  rationale: വിശുദ്ധമന്ദിരത്തിലെ അകത്തെ മറയെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ വ്യക്തവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമായ പദം.
- source_word: יָבֹא
  choice: കടന്നുചെല്ലുക
  rationale: אֶל എന്ന ഉപസർഗവും വിശുദ്ധമന്ദിരസന്ദർഭവും ചേർന്നപ്പോൾ, തിരശ്ശീലയ്ക്കരികിലെ നിയന്ത്രിത മേഖലയിലേക്കുള്ള പ്രവേശനമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: പുരോഹിതനിയമത്തിന്റെ ബലിസന്ദർഭത്തിൽ altar എന്ന ആശയം വ്യക്തമായി നൽകുന്ന സാധാരണ മലയാളപദം.
- source_word: יִגַּשׁ
  choice: അരികിലേക്കു വരുക
  rationale: പുരോഹിതൻ വിശുദ്ധകാര്യത്തിനായി സമീപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന נגשׁ എന്ന ക്രിയയുടെ സമീപനഭാവം നിലനിർത്തുന്നു.
- source_word: מוּם בּוֹ
  choice: അവനിൽ ഒരു ശാരീരിക വൈകല്യമുണ്ട്
  rationale: ഇവിടെ מוּם ധാർമ്മിക കുറ്റമല്ല, പ്രത്യേക പുരോഹിതശുശ്രൂഷയ്ക്കുള്ള ശാരീരിക അയോഗ്യതയാണ്; ‘ശാരീരിക’ എന്നത് ഈ പരിധി വ്യക്തമാക്കുന്നു.
- source_word: יְחַלֵּל
  choice: വിശുദ്ധി ലംഘിക്കുക
  rationale: വിശുദ്ധമായതിനെ സാധാരണമായി കണക്കാക്കി അതിന്റെ വിശുദ്ധസ്വഭാവം ലംഘിക്കുക എന്ന חלל-ന്റെ പുരോഹിതസാഹിത്യത്തിലെ അർഥം നൽകുന്നു; വെറും ഭൗതിക അശുദ്ധീകരണം എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: מִקְדָּשַׁי
  choice: എന്റെ വിശുദ്ധസ്ഥാനങ്ങൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനരൂപം നിലനിർത്തുകയും വിശുദ്ധപരിസരങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: מְקַדְּשָׁם
  choice: അവയെ വിശുദ്ധീകരിക്കുന്ന
  rationale: മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം തൊട്ടുമുമ്പുള്ള ‘എന്റെ വിശുദ്ധസ്ഥാനങ്ങൾ’ എന്നതിലേക്കു ബന്ധിപ്പിക്കുകയും വിശുദ്ധീകരണഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: מְקַדְּשָׁם എന്നതിലെ ബഹുവചന സർവനാമത്തിന്റെ സൂചന
  choice: ‘അവയെ’ എന്നത് ‘എന്റെ വിശുദ്ധസ്ഥാനങ്ങളെ’ സൂചിപ്പിക്കുന്നു
  alternative: പുരോഹിതന്മാരെയോ ജനത്തെയോ പൊതുവായി സൂചിപ്പിക്കുന്നു
  rationale: ഏറ്റവും അടുത്തുള്ള വ്യാകരണപരമായ മുൻപദം ബഹുവചനത്തിലുള്ള ‘എന്റെ വിശുദ്ധസ്ഥാനങ്ങൾ’ ആണ്; നിയന്ത്രിതമായ വിശുദ്ധസ്ഥലപ്രവേശനത്തെക്കുറിച്ചുള്ള ഉടനെയുള്ള സന്ദർഭത്തിനും ഇത് യോജിക്കുന്നു. വിശാലമായ മറ്റൊരു സൂചന സാധ്യമെങ്കിലും വാക്യഘടനയിൽ കുറവ് സാധ്യതയുള്ളതാണ്.
- issue: പുരോഹിതവിശുദ്ധിനിയമത്തിലെ מוּם എന്ന പദം
  choice: ശാരീരിക വൈകല്യം
  alternative: കളങ്കം; അംഗദോഷം
  rationale: ഈ പദം യാഗപീഠശുശ്രൂഷയിലെ ആചാരപരമായ അയോഗ്യതയെക്കുറിച്ചാണ് പറയുന്നത്; പാപം, ധാർമ്മിക കുറ്റം, അല്ലെങ്കിൽ മനുഷ്യന്റെ മൂല്യം കുറവ് എന്നൊന്നും സൂചിപ്പിക്കുന്നില്ല. ‘ശാരീരിക’ എന്ന വിശേഷണം ഈ നിയമപരമായ അർഥപരിധി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി സ്വീകരിച്ചു. പുരോഹിത-വിശുദ്ധിസംബന്ധമായ സാങ്കേതിക ആശയങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകിയെങ്കിലും എബ്രായത്തിലെ ബഹുവചനവും വിശുദ്ധി/അവിശുദ്ധി വൈരുധ്യവും നിലനിർത്തി. വൈകല്യത്തെ ധാർമ്മികദോഷമായോ മനുഷ്യന്റെ മൂല്യക്കുറവായോ അവതരിപ്പിക്കാതിരിക്കാൻ അടിക്കുറിപ്പിൽ നിയമസന്ദർഭം വ്യക്തമാക്കി.
