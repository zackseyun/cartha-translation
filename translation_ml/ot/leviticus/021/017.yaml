  text: דַּבֵּ֥ר אֶֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אִ֣ישׁ מִֽ/זַּרְעֲ/ךָ֞ לְ/דֹרֹתָ֗/ם אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם לֹ֣א יִקְרַ֔ב לְ/הַקְרִ֖יב לֶ֥חֶם אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: ml
  text: '“അഹരോനോടു പറയുക: ‘നിന്റെ സന്തതിയിൽ തലമുറകളിലുടനീളം ദേഹപരമായ ന്യൂനതയുള്ള[a] ഒരു പുരുഷനും തന്റെ ദൈവത്തിന്റെ ആഹാരം[b] അർപ്പിക്കാൻ അടുത്തുവരരുത്.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദേഹത്തിൽ ഒരു കുറവുള്ള.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായപദം ഈ പ്രത്യേക പുരോഹിതചുമതല നിർവഹിക്കുന്നതിൽനിന്ന് ഒഴിവാക്കുന്ന ദേഹപരമായ ന്യൂനതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “തന്റെ ദൈവത്തിന്റെ അപ്പം”; ഈ പുരോഹിതസന്ദർഭത്തിൽ “അപ്പം” യാഗാർപ്പണങ്ങളായ ആഹാരത്തെ കൂടുതൽ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל אַהֲרֹן לֵאמֹר
  choice: അഹരോനോടു പറയുക
  rationale: ഹീബ്രായ കല്പനയും വാക്ക് പരിചയപ്പെടുത്തുന്ന സൂത്രപ്രയോഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אִישׁ מִזַּרְעֲךָ
  choice: നിന്റെ സന്തതിയിൽ ... ഒരു പുരുഷനും
  rationale: അഹരോന്റെ പുരോഹിതവംശത്തിലെ പുരുഷസന്തതിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: לְדֹרֹתָם
  choice: തലമുറതലമുറയായി
  rationale: അഹരോന്റെ വംശത്തിലെ തുടർച്ചയായ തലമുറകളിലേക്കുള്ള നിയമത്തിന്റെ ബാധകത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מוּם
  choice: ശാരീരിക വൈകല്യം
  rationale: ഇവിടെ പുരോഹിതശുശ്രൂഷയിലെ ഈ പ്രത്യേക ചുമതലയിൽനിന്ന് അയോഗ്യനാക്കുന്ന ദേഹസംബന്ധമായ അവസ്ഥയാണ് ഉദ്ദേശ്യം; ‘കളങ്കം’ എന്ന പദം നൽകാവുന്ന ധാർമ്മികമോ വെറും സൗന്ദര്യപരമോ ആയ സൂചന ഒഴിവാക്കുന്നു.
- source_word: לֹא יִקְרַב
  choice: അടുത്തുവരരുത്
  rationale: വിശുദ്ധസ്ഥാനത്തോടുള്ള സാങ്കേതിക സമീപനഭാവവും നിയമപരമായ നിരോധനവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: לְהַקְרִיב
  choice: അർപ്പിക്കാൻ
  rationale: ഹിഫീൽ രൂപം ഈ യാഗസന്ദർഭത്തിൽ വഴിപാട് സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לֶחֶם אֱלֹהָיו
  choice: തന്റെ ദൈവത്തിന്റെ ആഹാരം
  rationale: לֶחֶם അക്ഷരാർഥത്തിൽ ‘അപ്പം’ ആണെങ്കിലും പുരോഹിതസന്ദർഭത്തിൽ യാഗാർപ്പണങ്ങളായ ആഹാരത്തെ കൂടുതൽ വിശാലമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശാരീരിക വൈകല്യമുള്ള പുരോഹിതരെ സംബന്ധിച്ച ആരാധനാക്രമപരമായ നിയന്ത്രണം
  choice: ദൈവത്തിന്റെ ആഹാരം അർപ്പിക്കാൻ അടുത്തുവരുന്നതെന്ന പ്രത്യേക പുരോഹിതചുമതലയെ സംബന്ധിച്ച നിരോധനമായി മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: വ്യക്തിയുടെ ധാർമ്മിക അയോഗ്യതയെയോ ദൈവജനത്തിൽനിന്നുള്ള സമഗ്രമായ പുറത്താക്കലിനെയോ സൂചിപ്പിക്കുന്ന രീതിയിൽ അവതരിപ്പിക്കുക.
  rationale: മൂലപാഠം ഒരു പ്രത്യേക വിശുദ്ധസ്ഥാന ശുശ്രൂഷയിലെ യോഗ്യതയെക്കുറിച്ചാണ് പറയുന്നത്; വ്യക്തിയുടെ മൂല്യം, ധാർമ്മിക കുറ്റം, ഉടമ്പടിയിലെ സ്ഥാനം എന്നിവയെക്കുറിച്ച് അധിക അവകാശവാദം ഉന്നയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാക്രമ ശൈലി. ‘ശാരീരിക വൈകല്യം’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ ദേഹസംബന്ധമായ അർഥം വ്യക്തമാക്കുമ്പോൾ ധാർമ്മിക കളങ്കം സൂചിപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു. പ്രധാനപാഠത്തിൽ [a], [b] എന്നീ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
