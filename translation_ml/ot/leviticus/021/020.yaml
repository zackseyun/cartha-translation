source:
  edition: WLC
  text: אֽוֹ גִבֵּ֣ן אוֹ דַ֔ק א֖וֹ תְּבַלֻּ֣ל בְּ/עֵינ֑/וֹ א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת א֖וֹ מְר֥וֹחַ אָֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/020.yaml
  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
translation:
  language: ml
  text: അല്ലെങ്കിൽ കൂനുള്ളവൻ[a], അല്ലെങ്കിൽ വളർച്ച മുരടിച്ചവൻ[b], അല്ലെങ്കിൽ കണ്ണിൽ വൈകല്യമുള്ളവൻ[c], അല്ലെങ്കിൽ ചൊറിയുള്ളവൻ, അല്ലെങ്കിൽ ചർമത്തിൽ പൊറ്റുള്ളവൻ[d], അല്ലെങ്കിൽ വൃഷണങ്ങൾ ചതഞ്ഞവൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പുറം വളഞ്ഞവൻ.’
    reason: lexical_alternative
  - marker: b
    text: ‘വളർച്ച മുരടിച്ചവൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; പൊതുവേ വളർച്ച കുറഞ്ഞതോ ശരീരം ശോഷിച്ചതോ ആയ ഒരാളെ അതു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘കണ്ണിൽ പാടുള്ളവൻ’; കൃത്യമായ നേത്രവൈകല്യം ഏതെന്ന് അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: d
    text: ഇവിടെയുള്ള രണ്ടു എബ്രായപദങ്ങളും വ്യത്യസ്ത ചർമരോഗങ്ങളെ സൂചിപ്പിക്കുന്നതാകാം; അവയുടെ കൃത്യമായ ആധുനിക രോഗനിർണയം അനിശ്ചിതമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  choice: കൂനുള്ളവൻ
  rationale: പുറം വളഞ്ഞതോ കൂനുള്ളതോ ആയ ശരീരാവസ്ഥയെ സൂചിപ്പിക്കുന്ന പദം; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: דַק
  choice: വളർച്ച മുരടിച്ചവൻ
  rationale: കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; അസാധാരണമായി ചെറുതോ ശോഷിച്ചതോ ആയ ശരീരരൂപത്തെ സൂചിപ്പിക്കാം. അനാവശ്യമായ വൈദ്യശാസ്ത്രകൃത്യത ഒഴിവാക്കി സാധ്യതയുള്ള അർഥം നൽകുന്നു.
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: കണ്ണിൽ വൈകല്യമുള്ളവൻ
  rationale: ഏതുതരം നേത്രവൈകല്യമാണെന്ന് ഉറപ്പില്ലാത്തതിനാൽ ‘പാട്’ അല്ലെങ്കിൽ ‘തിമിരം’ എന്നു കൃത്യപ്പെടുത്താതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: גָרָב
  choice: ചൊറിയുള്ളവൻ
  rationale: ചൊറിച്ചിലോ ചർമരോഗമോ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മലയാളം; ആധുനിക രോഗനിർണയം ആരോപിക്കുന്നില്ല.
- source_word: יַלֶּפֶת
  choice: ചർമത്തിൽ പൊറ്റുള്ളവൻ
  rationale: גָרָב എന്നതിൽനിന്ന് വ്യത്യസ്തമായ മറ്റൊരു ചർമാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ ആധുനിക രോഗനിർണയം അനിശ്ചിതമായതിനാൽ ദൃശ്യമായ ചർമപ്പൊറ്റിനെ സൂചിപ്പിക്കുന്ന പൊതുവായ ഭാഷ ഉപയോഗിക്കുന്നു.
- source_word: מְרוֹחַ אָשֶׁךְ
  choice: വൃഷണങ്ങൾ ചതഞ്ഞവൻ
  rationale: വൃഷണങ്ങൾക്ക് സംഭവിച്ച ചതവോ തകർച്ചയോ നേരിട്ട് സൂചിപ്പിക്കുന്ന, ശരീരശാസ്ത്രപരമായി വ്യക്തമായ പരിഭാഷ.
- source_word: אוֹ
  choice: അല്ലെങ്കിൽ
  rationale: പട്ടികയിലെ ഓരോ അവസ്ഥയും വേർതിരിക്കുന്ന ആവർത്തിത വികൽപകണത്തെ ഏകീകരിച്ച് പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: പുരോഹിതവിശുദ്ധിനിയമത്തിലെ ശാരീരിക വൈകല്യപദങ്ങളുടെ പരിഭാഷ
  choice: ധാർമിക കുറ്റബോധം സൂചിപ്പിക്കാതെ ശാരീരികാവസ്ഥകൾ നേരിട്ട് വിവരിക്കുക.
  alternative: കാഠിന്യം കുറയ്ക്കാൻ പരോക്ഷപദങ്ങൾ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ആധുനിക വൈദ്യശാസ്ത്രനാമങ്ങൾ നൽകുക.
  rationale: ഈ വാക്യം യാഗപീഠശുശ്രൂഷയ്ക്കുള്ള പുരോഹിതയോഗ്യതയെ ബാധിക്കുന്ന ശാരീരികാവസ്ഥകളാണ് പട്ടികപ്പെടുത്തുന്നത്; അവയെ പാപമോ ധാർമികദോഷമോ ആയി ചിത്രീകരിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിന്റെ വ്യക്തതയും യഥാർഥ അനിശ്ചിതത്വവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പട്ടികാശൈലി. ശാരീരികാവസ്ഥകൾ മറച്ചുവയ്ക്കാതെയും അവയ്ക്ക് ധാർമിക കുറ്റം ആരോപിക്കാതെയും അവതരിപ്പിച്ചു; അനിശ്ചിതമായ വൈദ്യപരമായ തിരിച്ചറിയലുകൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
