source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶֽל אַהֲרֹ֖ן וְ/אֶל בָּנָ֑י/ו וְ/אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/024.yaml
  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: ml
  text: അങ്ങനെ മോശെ അഹരോനോടും അവന്റെ പുത്രന്മാരോടും എല്ലാ ഇസ്രായേൽമക്കളോടും[a] സംസാരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യർ’; അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’ എബ്രായത്തിൽ ഇത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവായ ഉടമ്പടിസംബന്ധിയായ നാമമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അങ്ങനെ ... സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ഈ വിഭാഗത്തിന്റെ സമാപനസ്വഭാവം സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘അങ്ങനെ’ ഉപയോഗിച്ചു. דּבר എന്ന ക്രിയയുടെ ലളിതമായ അർഥം ‘സംസാരിച്ചു’ എന്നാണ്.
- source_word: אֶל
  choice: -ഓട്
  rationale: മോശ സംസാരിച്ച അഭിസംബോധിതരെ സൂചിപ്പിക്കുന്ന എബ്രായ പൂർവപ്രത്യയത്തിന് മലയാളത്തിലെ സ്വാഭാവികമായ സമാനരൂപം.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: ഇത് മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ പുല്ലിംഗ ബഹുവചനമാണ്; സന്ദർഭത്തിൽ അഹരോന്റെ പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כָּל
  choice: എല്ലാ
  rationale: തുടർന്നുവരുന്ന സമൂഹത്തെ മുഴുവനായി ഉൾക്കൊള്ളുന്ന സാധാരണ അർഥം നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നതായ ഈ സ്ഥിരമായ ഉടമ്പടിസംബന്ധിയായ ജനനാമം, മലയാളത്തിലെ പരിചിതവും സമൂഹത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്നതുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന രൂപത്തിൽ നൽകി.
theological_decisions:
- issue: ഉടമ്പടിസംബന്ധിയായ ജനനാമമായ בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഈ പ്രയോഗം രൂപത്തിൽ പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും സാധാരണയായി ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ ഉറവിടരൂപത്തിന്റെ ബന്ധവും മലയാളത്തിലെ സ്വാഭാവികതയും ഒരുമിച്ച് കാത്തുസൂക്ഷിക്കുന്നു; അക്ഷരാർഥവും മറ്റൊരു സ്വാഭാവിക രൂപവും അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിക്കുന്ന ‘-ഓടും’ ഘടന എബ്രായത്തിലെ അഭിസംബോധിതരുടെ പട്ടിക വ്യക്തമായി നിലനിർത്തുന്നു; വാക്യാവസാനത്തിലെ വിഭാഗസമാപനഭാവത്തിന് ‘അങ്ങനെ’ യോജിക്കുന്നു.
