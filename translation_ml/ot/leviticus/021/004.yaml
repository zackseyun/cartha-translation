source:
  edition: WLC
  text: לֹ֥א יִטַּמָּ֖א בַּ֣עַל בְּ/עַמָּ֑י/ו לְ/הֵ֖חַלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: ml
  text: തന്റെ ജനത്തിനിടയിൽ ഭർത്താവായിരിക്കെ അവൻ സ്വയം അശുദ്ധനാകരുത്; അങ്ങനെ അവൻ സ്വയം അപവിത്രനാകരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “തന്റെ ജനത്തിനിടയിലെ ഒരു പ്രമുഖനെന്ന നിലയിൽ അവൻ സ്വയം അശുദ്ധനാകരുത്; അങ്ങനെ അവൻ സ്വയം അപവിത്രനാകരുത്.” എബ്രായത്തിലെ ഈ വാക്യഭാഗം ദുഷ്കരമാണ്. ‘ഭർത്താവ്’ എന്ന അർഥത്തിനുപകരം, സമൂഹത്തിൽ പ്രമുഖസ്ഥാനത്തുള്ളവനായിരിക്കെ സ്വയം അശുദ്ധനാകുന്നതിനെതിരായ പൊതുവിലക്കായി ചിലർ ഇതിനെ മനസ്സിലാക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: സ്വയം അശുദ്ധനാക്കുക
  rationale: ഇവിടെ טמא എന്ന ക്രിയയുടെ ഹിത്പഅേൽ രൂപം മരിച്ചവരോടുള്ള സമ്പർക്കം മൂലം പുരോഹിതൻ ആചാരപരമായ അശുദ്ധി ഏൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആചാരശുദ്ധിയുടെ പശ്ചാത്തലം വ്യക്തമായി അറിയിക്കാൻ ഈ പ്രയോഗം അനുയോജ്യമാണ്.
- source_word: בַּעַל
  choice: ഭർത്താവ്
  rationale: ദുഷ്കരമായ ഈ വാക്യഘടനയിൽ בַּעַל എന്നതിന് സാധാരണമായ ബന്ധസൂചക അർഥമായ ‘ഭർത്താവ്’ സ്വീകരിച്ചു. സമീപവാക്യങ്ങളിലെ അടുത്ത ബന്ധുക്കൾക്കുവേണ്ടിയുള്ള ദുഃഖാചരണവും ശവസമ്പർക്കവും സംബന്ധിച്ച നിയമവുമായി ഇത് യോജിക്കുന്നു; എന്നാൽ ‘പ്രമുഖൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּעַמָּיו
  choice: തന്റെ ജനത്തിനിടയിൽ
  rationale: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ സ്വന്തം ജനസമൂഹം അഥവാ ബന്ധുവൃന്ദം എന്ന സൂചനയുണ്ട്.
- source_word: לְהֵחַלּוֹ
  choice: തന്നെ അശുദ്ധീകരിക്കരുത്
  rationale: חלל എന്ന പദം വിശുദ്ധമായതിനെ അശുദ്ധമാക്കുക അഥവാ സാധാരണമാക്കുക എന്ന ആശയം വഹിക്കുന്നു. പുരോഹിതവിശുദ്ധിയുടെ പദാവലി നിലനിർത്താൻ ‘അശുദ്ധീകരിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി; മുൻക്രിയയുടെ ഫലമോ ഉദ്ദേശ്യമോ എന്ന ബന്ധം മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: בַּעַל בְּעַמָּיו എന്ന ദുഷ്കരമായ പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘തന്റെ ജനത്തിനിടയിൽ ഒരു ഭർത്താവെന്ന നിലയിൽ’—പുരോഹിതൻ ഭാര്യയ്ക്കുവേണ്ടി ശവസമ്പർക്കത്തിലൂടെ അശുദ്ധനാകരുതെന്ന വായന
  alternative: ‘തന്റെ ജനത്തിനിടയിലെ ഒരു പ്രമുഖനെന്ന നിലയിൽ’; അല്ലെങ്കിൽ ‘തന്റെ ജനത്തിനിടയിൽ സ്വയം അശുദ്ധനാക്കി തന്നെ അശുദ്ധീകരിക്കരുത്’
  rationale: എബ്രായവാക്യം ചുരുക്കമുള്ളതും വ്യാകരണപരമായി ദുഷ്കരവുമാണ്. בַּעַל എന്നതിന്റെ സാധാരണ അർഥവും ചുറ്റുമുള്ള ബന്ധുത്വനിയമങ്ങളും പരിഗണിച്ച് ‘ഭർത്താവ്’ മുഖ്യവായനയായി സ്വീകരിച്ചു. അനിശ്ചിതത്വം മറച്ചുവയ്ക്കാതെ പ്രധാന ബദൽ വായനകൾ അടിക്കുറിപ്പിൽ ചേർത്തു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തിച്ചുവരുന്ന അശുദ്ധി/വിശുദ്ധതാ പദബന്ധം പരമാവധി നിലനിർത്തുകയും ദുഷ്കരമായ വാക്യത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
