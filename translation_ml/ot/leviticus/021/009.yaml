id: LEV.21.9
reference: Leviticus 21:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַת֙ אִ֣ישׁ כֹּהֵ֔ן כִּ֥י תֵחֵ֖ל לִ/זְנ֑וֹת אֶת אָבִ֨י/הָ֙ הִ֣יא מְחַלֶּ֔לֶת בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: ml
  text: ഒരു പുരോഹിതന്റെ മകൾ വേശ്യാവൃത്തിയിൽ ഏർപ്പെട്ട്[b] തന്നെത്തന്നെ അപവിത്രയാക്കിയാൽ[a], അവൾ തന്റെ അപ്പനെ അപവിത്രനാക്കുന്നു; അവളെ തീയിൽ ചുട്ടുകളയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വേശ്യാവൃത്തി ചെയ്യാൻ തുടങ്ങിയാൽ.’ എബ്രായ ക്രിയയ്ക്ക് ചില സന്ദർഭങ്ങളിൽ ‘തുടങ്ങുക’ എന്ന അർഥമുണ്ട്; എങ്കിലും ഇവിടെ ‘അപവിത്രയാകുക/തന്നെത്തന്നെ അപവിത്രമാക്കുക’ എന്ന അർഥമാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘വേശ്യയെപ്പോലെ പെരുമാറി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: ഒരു പുരോഹിതന്റെ മകൾ
  rationale: ‘ഒരു പുരോഹിതനായ മനുഷ്യന്റെ മകൾ’ എന്ന എബ്രായ ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപമാണിത്; നിയമഭാഷയുടെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: -യാൽ
  rationale: ഈ നിയമസന്ദർഭത്തിൽ നിബന്ധനാപരമായ സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ ‘എങ്കിൽ/ആൽ’ എന്ന അർഥം യോജിക്കുന്നു.
- source_word: תֵחֵל
  choice: തന്നെത്തന്നെ അശുദ്ധയാക്കിയാൽ
  rationale: חלל എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ‘തുടങ്ങുക’ എന്നതിനെക്കാൾ ‘അശുദ്ധമാകുക/തന്നെത്തന്നെ അശുദ്ധമാക്കുക’ എന്ന ഫലാത്മക അർഥമാണ് നൽകുന്നത്. മലയാളത്തിൽ പ്രതിഫലനസ്വഭാവം വ്യക്തമാക്കാൻ ‘തന്നെത്തന്നെ’ ചേർത്തു.
- source_word: לִזְנוֹת
  choice: വേശ്യാവൃത്തിയിൽ ഏർപ്പെട്ട്
  rationale: זנה ഇവിടെ പൊതുവായ ലൈംഗിക അധാർമികതയെക്കാൾ വ്യക്തമായി വേശ്യാവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കാരണം/വിധം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: അവൾ തന്റെ അപ്പനെയും അശുദ്ധനാക്കുന്നു
  rationale: മകളുടെ പ്രവൃത്തി പുരോഹിതനായ അപ്പന്റെ വിശുദ്ധസ്ഥാനത്തെ കളങ്കപ്പെടുത്തുന്നു എന്ന പുരോഹിതീയ ആശയം സംരക്ഷിക്കുന്നു. ‘അപ്പനെയും’ എന്നത് മുമ്പത്തെ ‘തന്നെത്തന്നെ അശുദ്ധയാക്കി’ എന്ന ആശയത്തോടുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: അവളെ തീയിൽ ചുട്ടുകളയണം
  rationale: നിയമത്തിൽ നിർദേശിക്കപ്പെടുന്ന ശിക്ഷയെ ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ബְּ എന്ന ഉപസർഗത്തിന്റെ അഗ്നിമാർഗമുള്ള ദഹനം എന്ന അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുരോഹിതീയ വിശുദ്ധിനിയമത്തിൽ חלל എന്ന പദകുടുംബത്തിന്റെ വിവർത്തനം
  choice: രണ്ടിടത്തും ‘അശുദ്ധമാക്കുക’ എന്ന ഒരേ പദപ്രയോഗം ഉപയോഗിക്കുക
  alternative: ‘കളങ്കപ്പെടുത്തുക’ അല്ലെങ്കിൽ അപ്പനെക്കുറിച്ച് ‘അപമാനിക്കുക’ എന്നു വിവർത്തനം ചെയ്യുക
  rationale: ഒരേ എബ്രായ ധാതുവിന്റെ ആവർത്തനം നിലനിർത്തുന്നതോടൊപ്പം, ഇത് കേവലം കുടുംബമാനത്തെ അപമാനിക്കുന്നതല്ല, പുരോഹിതീയ വിശുദ്ധിയെ ലംഘിക്കുന്നതുമാണ് എന്ന വാചകത്തിന്റെ ഭാരം സംരക്ഷിക്കുന്നു. അതേസമയം പാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി സ്വീകരിച്ചു. ‘പുരോഹിതൻ,’ ‘വേശ്യാവൃത്തി,’ ‘അശുദ്ധമാക്കുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ലേവ്യപുസ്തകത്തിലെ വിശുദ്ധി-അശുദ്ധി പദസഞ്ചയത്തോട് ചേരുന്നതുമാണ്. കുറിപ്പുസൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന ബന്ധപ്പെട്ട വാക്കുകൾക്കരികിൽ ചേർത്തിരിക്കുന്നു.
