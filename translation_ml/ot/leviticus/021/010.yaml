  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/כֹּהֵן֩ הַ/גָּד֨וֹל מֵ/אֶחָ֜י/ו אֲֽשֶׁר יוּצַ֥ק עַל רֹאשׁ֣/וֹ שֶׁ֤מֶן הַ/מִּשְׁחָה֙ וּ/מִלֵּ֣א אֶת יָד֔/וֹ לִ/לְבֹּ֖שׁ אֶת הַ/בְּגָדִ֑ים אֶת רֹאשׁ/וֹ֙ לֹ֣א יִפְרָ֔ע וּ/בְגָדָ֖י/ו לֹ֥א יִפְרֹֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: ml
  text: സഹോദരന്മാരെക്കാൾ ഉന്നതനായ മഹാപുരോഹിതൻ—അവന്റെ തലയിൽ അഭിഷേകതൈലം ഒഴിക്കപ്പെട്ടതും, വസ്ത്രങ്ങൾ ധരിക്കുവാൻ അവന്റെ കൈ നിറയ്ക്കപ്പെട്ടതുമായവൻ[a]—തന്റെ തലമുടി അഴിച്ചിടരുത്[b]; തന്റെ വസ്ത്രങ്ങൾ കീറുകയും അരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൈ നിറയ്ക്കുക’ എന്നത് ഒരാളെ പുരോഹിതശുശ്രൂഷയ്ക്കായി നിയമിക്കുകയോ സ്ഥാനമേൽപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: തലമുടി അഴിച്ചിട്ട് അലങ്കോലമാക്കുന്നതും വസ്ത്രങ്ങൾ കീറുന്നതും പതിവ് വിലാപചിഹ്നങ്ങളായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל מֵאֶחָיו
  choice: സഹോദരന്മാരെക്കാൾ ശ്രേഷ്ഠനായ മഹാപുരോഹിതൻ
  rationale: הַכֹּהֵן הַגָּדוֹל എന്ന സ്ഥാനപ്പേരിന് സ്വാഭാവികമായ ‘മഹാപുരോഹിതൻ’ ഉപയോഗിക്കുന്നു; מֵאֶחָיו എന്ന താരതമ്യപ്രയോഗം ‘സഹോദരന്മാരെക്കാൾ ശ്രേഷ്ഠനായ’ എന്നു നിലനിർത്തുന്നു.
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: അവന്റെ തലയിൽ അഭിഷേകതൈലം ഒഴിക്കപ്പെടുകയും
  rationale: എണ്ണ ഒഴിക്കുന്ന കർമത്തിന്റെ ദൃശ്യരൂപവും എബ്രായത്തിലെ കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: അവന്റെ കൈ നിറയ്ക്കപ്പെടുകയും
  rationale: പുരോഹിതശുശ്രൂഷയിൽ നിയമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ആചാരപ്രയോഗം മുഖ്യപാഠത്തിൽ അക്ഷരാർഥത്തിൽ നിലനിർത്തി, അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: വസ്ത്രങ്ങൾ ധരിക്കേണ്ടതിന്
  rationale: നിശ്ചിതമായ പുരോഹിതവസ്ത്രങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘പുരോഹിത’ എന്ന വിശേഷണം ചേർക്കാതെ ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: തന്റെ തലമുടി അഴിച്ചിടുകയോ അരുത്
  rationale: മൂലത്തിലെ ‘തല’ എന്ന ശരീരഭാഗപ്രയോഗത്തിന്റെ സന്ദർഭാർഥം തലമുടി അഴിച്ചിട്ട് അലങ്കോലമാക്കുന്നതാണ്; ആധുനിക മലയാളത്തിൽ അർഥവത്തായി ഇത് വ്യക്തമാക്കുന്നു.
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: വസ്ത്രങ്ങൾ കീറുകയോ അരുത്
  rationale: വിലാപത്തിന്റെ പതിവടയാളമായ വസ്ത്രം കീറൽ വ്യക്തവും ലളിതവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: מִלֵּא אֶת יָדוֹ എന്ന പുരോഹിതനിയമനപ്രയോഗം
  choice: ‘അവന്റെ കൈ നിറയ്ക്കപ്പെടുകയും’ എന്ന മൂലരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുക
  alternative: ‘പുരോഹിതനായി നിയമിക്കപ്പെടുകയും’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  rationale: ആചാരപരവും ദൈവശാസ്ത്രപരവുമായി പ്രാധാന്യമുള്ള എബ്രായ രൂപകം നഷ്ടപ്പെടുത്താതെ സാധാരണ വായനക്കാരന് അതിന്റെ അർഥം ലഭ്യമാക്കുന്നു.
- issue: מֵאֶחָיו എന്നതിലെ താരതമ്യാർഥം
  choice: സഹോദരന്മാരെക്കാൾ ശ്രേഷ്ഠനായ
  alternative: സഹോദരന്മാരിൽനിന്നുള്ള / സഹോദരന്മാരിൽ മുഖ്യനായ
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ താരതമ്യസാധ്യതയും മറ്റു പുരോഹിതന്മാരോടുള്ള മഹാപുരോഹിതന്റെ ഉയർന്ന സ്ഥാനവും നിലനിർത്തുന്നു; പുരുഷ പുരോഹിതസന്ദർഭമായതിനാൽ ‘സഹോദരന്മാർ’ എന്ന ലിംഗനിർദ്ദിഷ്ട പദം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദീർഘമായ എബ്രായ ബന്ധവാക്യം വായനാസൗകര്യത്തിനായി ഡാഷുകൾക്കുള്ളിൽ നൽകിയിരിക്കുന്നു; നിയമനത്തിന്റെ അപൂർവമായ മൂലഭാഷാപ്രയോഗം അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
