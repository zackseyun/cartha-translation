reference: Leviticus 21:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה אֱמֹ֥ר אֶל הַ/כֹּהֲנִ֖ים בְּנֵ֣י אַהֲרֹ֑ן וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לְ/נֶ֥פֶשׁ לֹֽא יִטַּמָּ֖א בְּ/עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു: “അഹരോന്റെ പുത്രന്മാരായ പുരോഹിതന്മാരോടു സംസാരിച്ച് അവരോടു പറയുക: ‘അവരിൽ ആരും തന്റെ സ്വജനത്തിന്റെ ഇടയിൽ മരിച്ച ഒരാൾ നിമിത്തം[a] തന്നെ അശുദ്ധനാക്കരുത്[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഒരു נֶפֶשׁ (നെഫെഷ്) നിമിത്തം.’ ശുദ്ധിനിയമത്തിന്റെ ഈ പശ്ചാത്തലത്തിൽ ഈ പ്രയോഗം ഒരു മരിച്ച വ്യക്തിയെയോ മൃതദേഹത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അശുദ്ധനായിത്തീരരുത്’ എന്നും ‘തന്നെത്തന്നെ മലിനപ്പെടുത്തരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഇവിടെ മരിച്ചവരുമായുള്ള സമ്പർക്കം മൂലമുണ്ടാകുന്ന ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ ശബ്ദരൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: സംസാരിച്ച് ... പറയുക
  rationale: മൂലപാഠത്തിലെ אמר എന്ന ക്രിയയുടെ ആവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാരായ പുരോഹിതന്മാർ
  rationale: പുരോഹിതന്മാരെ അഹരോന്റെ പുത്രന്മാർ എന്നു തിരിച്ചറിയിക്കുന്ന മൂലപാഠത്തിലെ സമാനാധികരണബന്ധം വ്യക്തമായി നൽകുന്നു; ഇവിടെ ‘പുത്രന്മാർ’ വംശപരമായ കുടുംബനാമനിർദേശവും ഉൾക്കൊള്ളുന്നു.
- source_word: לְנֶפֶשׁ
  choice: മരിച്ച ഒരാൾ നിമിത്തം
  rationale: ശവസ്പർശം സംബന്ധിച്ച ശുദ്ധിനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ נֶפֶשׁ മരിച്ച വ്യക്തിയെയോ മൃതദേഹത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; തെറ്റിദ്ധരിപ്പിക്കാവുന്ന അക്ഷരാർഥമായ ‘ആത്മാവ്’ ഒഴിവാക്കുന്നു.
- source_word: יִטַּמָּא
  choice: തന്നെ അശുദ്ധനാക്കരുത്
  rationale: ക്രിയയുടെ ആത്മനേപദസ്വഭാവവും മൃതദേഹബന്ധം മൂലം ഉണ്ടാകുന്ന ആചാരപരമായ അശുദ്ധിയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: בְּעַמָּיו
  choice: തന്റെ ജനത്തിനിടയിൽ
  rationale: ‘തന്റെ ജനത്തിനിടയിൽ’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; അടുത്ത വാക്യങ്ങൾ അടുത്ത ബന്ധുക്കളെക്കുറിച്ചുള്ള ഒഴിവുകൾ പ്രത്യേകം വ്യക്തമാക്കുന്നതിനാൽ ഇവിടെ തന്നെ ‘ബന്ധുക്കൾ’ എന്നു ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്ന ‘തന്നെ അശുദ്ധനാക്കരുത്’
  alternative: ‘തന്നെത്തന്നെ മലിനപ്പെടുത്തരുത്’
  rationale: ഇവിടെ വിഷയം മൃതദേഹബന്ധം മൂലമുള്ള ആചാരപരമായ അശുദ്ധിയാണ്; നേരിട്ടുള്ള ധാർമിക കുറ്റമോ പാപമോ സൂചിപ്പിക്കുന്ന ഭാഷ ഒഴിവാക്കുന്നു.
- issue: ബഹുവചന അഭിസംബോധനയ്ക്കുള്ളിലെ ഏകവചന വിലക്ക്
  choice: ‘അവരിൽ ആരും ... തന്നെ ... അരുത്’
  alternative: ‘ഒരു പുരോഹിതനും ... അരുത്’
  rationale: പുരോഹിതന്മാരെന്ന ബഹുവചന സമൂഹത്തിലെ ഓരോ അംഗത്തിനും ബാധകമായ ഏകവചന ക്രിയയുടെ വിതരണാർഥം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ദൈവനാമം വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പുസൂചകങ്ങൾ ആശയബന്ധമില്ലാത്ത സ്ഥാനങ്ങളിലായിരുന്നതിനാൽ, [a] ‘മരിച്ച ഒരാൾ’ എന്നതിനോടും [b] ‘അശുദ്ധനാക്കരുത്’ എന്നതിനോടും ചേർത്ത് ഉറവിടപദങ്ങളുമായി ശരിയായി ബന്ധിപ്പിച്ചു.
