id: LEV.21.5
reference: Leviticus 21:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ തലയിൽ കഷണ്ടിപ്പാട് ഉണ്ടാക്കരുത്; താടിയുടെ അരിക്[a] വടിച്ചുകളയരുത്; ദേഹത്ത് മുറിവുകളുണ്ടാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘താടിയുടെ കോണുകൾ.’ എബ്രായപദത്തിന് അരിക്, വശം, കോൺ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יקרחה ... קָרְחָה
  choice: കഷണ്ടിപ്പാട് ഉണ്ടാക്കുക
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന പ്രയോഗം സ്വാഭാവികമായി മുടികൊഴിഞ്ഞുപോകുന്നതല്ല, മനഃപൂർവം തലയിൽ കഷണ്ടിയായ ഭാഗം ഉണ്ടാക്കുന്നതാണ് സൂചിപ്പിക്കുന്നത്. ‘കഷണ്ടിപ്പാട് ഉണ്ടാക്കുക’ ഈ പ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: בְּרֹאשָׁם
  choice: തങ്ങളുടെ തലയിൽ
  rationale: ഏകവചന നാമത്തോടുകൂടിയ ബഹുവചന പ്രത്യയം വിതരണാർഥത്തിലാണ്; ‘തങ്ങളുടെ തലയിൽ’ എബ്രായ രൂപത്തോട് അടുത്തുനിൽക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: פְאַת זְקָנָם
  choice: താടിയുടെ അരിക്
  rationale: פאה എന്ന പദത്തിന് അരിക്, വശം, കോൺ എന്നീ അർഥങ്ങൾ വരാം. കൃത്യമായ അലങ്കാരരീതി അനാവശ്യമായി നിർണയിക്കാതെ മൂലപാഠത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്താൻ ‘അരിക്’ തിരഞ്ഞെടുത്തു.
- source_word: יְגַלֵּחוּ
  choice: വടിച്ചുകളയുക
  rationale: പീയേൽ രൂപം രോമം നീക്കിക്കളയുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘വടിച്ചുകളയുക’ നീക്കംചെയ്യുന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּבִבְשָׂרָם
  choice: ദേഹത്ത്
  rationale: בשר അക്ഷരാർഥത്തിൽ ‘മാംസം’ ആണെങ്കിലും സ്വയം മുറിവേൽപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘ദേഹത്ത്’ എന്നത് ശാരീരിക അർഥം നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: മുറിവുകളുണ്ടാക്കുക
  rationale: ക്രിയ-നാമ സംയോജനം ദേഹത്ത് മുറിക്കുകയോ വരഞ്ഞ് മുറിവേൽപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘മുറിവുകളുണ്ടാക്കുക’ നേരിട്ടും വായിക്കാൻ എളുപ്പമായും ഈ അർഥം നൽകുന്നു.
theological_decisions:
- issue: നിരോധനത്തിന്റെ സ്വഭാവം
  choice: ദേഹത്തിൽ വരുത്തുന്ന നിർദിഷ്ട മാറ്റങ്ങളെയും മുറിവുകളെയും നേരിട്ട് നിരോധിക്കുന്നതായി വിവർത്തനം ചെയ്തു; മരിച്ചവർക്കുവേണ്ടിയുള്ള വിലാപാചാരമെന്ന് മുഖ്യവാചകത്തിൽ കൂട്ടിച്ചേർത്തില്ല.
  alternative: ലേവ്യർ 19:28, ആവർത്തനം 14:1 എന്നിവയുടെ അടിസ്ഥാനത്തിൽ ‘മരിച്ചവർക്കുവേണ്ടി’ എന്ന് വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യത്തിൽ നിരോധിത പ്രവൃത്തികൾ മാത്രമാണ് പറയുന്നത്; സമാന്തര ഭാഗങ്ങളിലെ വിശദീകരണം ഇതിൽ ഇല്ല. അതിനാൽ സന്ദർഭത്തിൽനിന്നുള്ള വിശദീകരണം മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ മൂലപാഠത്തിലുള്ള ദൈവശാസ്ത്രപരമായ പരിധി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആവർത്തിച്ച ‘അരുത്’ രൂപം നിയമനിരോധനത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം അർഥവൈകല്യമുള്ള ‘താടിയുടെ അരിക്’ എന്ന പദബന്ധത്തോടു ചേർത്തിരിക്കുന്നു.
