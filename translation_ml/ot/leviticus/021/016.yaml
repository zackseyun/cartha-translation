    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ דִּבֵּר ഒരു പുതിയ ദൈവിക വചനസംഭവം അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ പതിവുപ്രയോഗം ഔപചാരികതയും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളപ്രയോഗമാണ് ‘-യോടു’; מֹשֶׁה എന്ന പേര് ‘മോശ’ എന്നു നൽകുന്നു.
- source_word: לֵאמֹר
  choice: സംസാരിച്ചു എന്നതിനുശേഷമുള്ള ദ്വിബിന്ദുവിലൂടെ സൂചിപ്പിച്ചു
  rationale: തുടർന്ന് ഉദ്ധരിക്കപ്പെടുന്ന വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രപ്രയോഗമാണിത്. ‘ഇപ്രകാരം പറഞ്ഞു’ എന്നു ആവർത്തിക്കുന്നതിനേക്കാൾ ദ്വിബിന്ദു ആ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ YHWH തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നാമമായി സംരക്ഷിക്കുന്നു; അതേസമയം മലയാള വായനക്കാർക്കു വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപം സ്വീകരിക്കുന്നു. ഉച്ചാരണത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. എബ്രായ വചനാരംഭസൂത്രമായ לֵאמֹר ആവർത്തനപരമായി പദാനുപദം നൽകാതെ ദ്വിബിന്ദുവിലൂടെ പ്രകടിപ്പിച്ചിരിക്കുന്നു; അടുത്ത വാക്യത്തിൽ പ്രസംഗത്തിന്റെ ഉള്ളടക്കം വരുന്നതു ഇതിലൂടെ വ്യക്തമാകുന്നു.
