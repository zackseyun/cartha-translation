id: LEV.21.15
reference: Leviticus 21:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא יְחַלֵּ֥ל זַרְע֖/וֹ בְּ/עַמָּ֑י/ו כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשֽׁ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: ml
  text: അവൻ തന്റെ ജനത്തിന്റെ ഇടയിൽ തന്റെ സന്തതിയെ അപവിത്രമാക്കരുത്[a][b]; കാരണം, അവനെ വിശുദ്ധീകരിക്കുന്ന യഹ്‌വേ ഞാൻ ആകുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അപവിത്രമാക്കരുത്’ എന്നതിന് ‘അശുദ്ധമാക്കരുത്’ അല്ലെങ്കിൽ ‘അപമാനിക്കരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം. വിശുദ്ധമായിരിക്കേണ്ടതിനെ അപവിത്രമോ സാധാരണമോ ആക്കുക എന്ന ആശയം ഹെബ്രായ ക്രിയയ്ക്കുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഈ സന്ദർഭത്തിൽ, വിവാഹത്തെക്കുറിച്ചുള്ള വിലക്കുകൾ ലംഘിക്കുന്നതിലൂടെ അവൻ ഉടമ്പടി സമൂഹത്തിനുള്ളിൽ തന്റെ വംശത്തിന്മേൽ അപവിത്രത വരുത്തുമെന്നതാണ് സൂചന.
    reason: cultural_note
  - marker: c
    text: ‘വിശുദ്ധീകരിക്കുന്ന’ എന്നതിന് ‘വിശുദ്ധനാക്കുന്ന’ അല്ലെങ്കിൽ ‘വിശുദ്ധമായി വേർതിരിക്കുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: അശുദ്ധമാക്കുക
  rationale: പീലിൽ חלל എന്ന ക്രിയ വിശുദ്ധമായിരിക്കേണ്ടതിനെ അശുദ്ധമോ സാധാരണമോ ആക്കുക എന്ന ആശയം വഹിക്കുന്നു. മലയാളത്തിൽ ‘അശുദ്ധമാക്കുക’ എന്നത് ഈ വിശുദ്ധി-അശുദ്ധി വൈരുധ്യം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘അപമാനിക്കുക’ എന്നതിനെക്കാൾ പുരോഹിതീയ വിശുദ്ധിയുടെ പശ്ചാത്തലം നന്നായി നിലനിർത്തുന്നു.
- source_word: זַרְעוֹ
  choice: തന്റെ സന്തതി
  rationale: זֶרַע ഇവിടെ വിവാഹവും പുരോഹിതവംശവും സംബന്ധിച്ച പശ്ചാത്തലത്തിൽ മക്കളെയോ വംശപരമ്പരയെയോ സൂചിപ്പിക്കുന്നു. ‘സന്തതി’ ഈ പരിധി തുറന്നുവെക്കുകയും അക്ഷരാർഥമായ ‘വിത്ത്’ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּעַמָּיו
  choice: തന്റെ ജനത്തിന്റെ ഇടയിൽ
  rationale: בְּ + עַם എന്ന ഘടനയുടെ സാമൂഹികവും ഉടമ്പടി-സമൂഹപരവുമായ അർഥം നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מְקַדְּשׁוֹ
  choice: അവനെ വിശുദ്ധീകരിക്കുന്ന
  rationale: קדשׁ എന്ന ക്രിയയുടെ ‘വിശുദ്ധനാക്കുക/വിശുദ്ധമായി വേർതിരിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു. കർത്തൃവാചക വർത്തമാനകൃദന്തരൂപവും പുരോഹിതീയ വിശുദ്ധിയുടെ ഭാഷയും ഇതിലൂടെ സംരക്ഷിക്കപ്പെടുന്നു.
theological_decisions:
- issue: നിരോധനത്തിന്റെ വ്യാപ്തിയും വിശുദ്ധീകരിക്കപ്പെടുന്ന വ്യക്തിയുടെ സൂചനയും
  choice: നിരോധനം പുരോഹിതൻ തന്റെ സന്തതിയെ ജനത്തിന്റെ ഇടയിൽ അശുദ്ധമാക്കുന്നതായി പൊതുവായ ഹെബ്രായ പദപ്രയോഗത്തിൽ നിലനിർത്തി; ദൈവം ‘അവനെ’ വിശുദ്ധീകരിക്കുന്നു എന്ന സർവനാമവും അതേപടി സൂക്ഷിച്ചു.
  alternative: വിലക്കപ്പെട്ട വിവാഹംകൊണ്ട് മഹാപുരോഹിതൻ തന്റെ വംശത്തെ പുരോഹിതസ്ഥാനത്തിന് അയോഗ്യമാക്കരുത് എന്ന് വ്യക്തമായി വികസിപ്പിക്കാം.
  rationale: സന്ദർഭം വിവാഹനിയമങ്ങളെയും പുരോഹിതവംശത്തെയും സൂചിപ്പിച്ചാലും, മൂലവാക്യം പുരോഹിതസ്ഥാനത്തിലെ അയോഗ്യതയെ തുറന്നുപറയുന്നില്ല. അതിനാൽ വ്യാഖ്യാനവികാസം മുഖ്യവാചകത്തിലേക്ക് ചേർക്കാതെ കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പുരോഹിതീയ വിശുദ്ധിയുടെ പ്രധാന പദബന്ധം നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കരികിൽ മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
