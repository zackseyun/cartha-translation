id: LEV.21.11
reference: Leviticus 21:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַ֛ל כָּל נַפְשֹׁ֥ת מֵ֖ת לֹ֣א יָבֹ֑א לְ/אָבִ֥י/ו וּ/לְ/אִמּ֖/וֹ לֹ֥א יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: ml
  text: അവൻ ഒരു മൃതദേഹത്തിന്റെയും അടുത്ത് ചെല്ലരുത്[a]; തന്റെ അപ്പനോ അമ്മയോ നിമിത്തംപോലും അവൻ തന്നെ അശുദ്ധനാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശവം’ എന്നും പരിഭാഷപ്പെടുത്താം. അക്ഷരാർഥത്തിൽ ‘മരിച്ചവന്റെ വ്യക്തി/ജീവൻ’ എന്ന പ്രയോഗം; ശുദ്ധിനിയമങ്ങളിൽ ഇത് മൃതശരീരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל כָּל נַפְשֹׁת מֵת לֹא יָבֹא
  choice: ഒരു മൃതദേഹത്തിന്റെയും അടുത്തു ചെല്ലരുത്
  rationale: בוא על എന്ന പ്രയോഗം ഇവിടെ ശവത്തോടു സമീപിക്കുകയോ അതുമൂലം സമ്പർക്കത്തിലാകുകയോ ചെയ്യുന്നതിനെ വിലക്കുന്നു. നിഷേധവാക്യത്തിലെ כָּל എന്നതിന്റെ സമഗ്രത ‘ഒരു ...ത്തിന്റെയും’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: נַפְשֹׁת מֵת
  choice: മൃതശരീരം
  rationale: പദാനുപദമായി ‘മരിച്ചവന്റെ വ്യക്തി/ജീവൻ’ എന്ന രൂപമുണ്ടെങ്കിലും, ലേവ്യപുസ്തകത്തിലെ ശുദ്ധിനിയമങ്ങളിൽ ഇത് മനുഷ്യശവത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘മൃതശരീരം’ ഉപയോഗിച്ചു.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: തന്റെ അപ്പനോ അമ്മയോ മരിച്ചാൽപ്പോലും
  rationale: ലְ എന്നത് ഇവിടെ അപ്പനെയോ അമ്മയെയോ സംബന്ധിച്ച സംഭവത്തെ സൂചിപ്പിക്കുന്നു. മരണസന്ദർഭം മൂലപാഠത്തിൽ സന്ദർഭപരമായി ഉൾക്കൊള്ളപ്പെട്ടതിനാൽ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘മരിച്ചാൽപ്പോലും’ എന്നു പറയുന്നു; ‘-ഓ ... -ഓ’ വിതരണാർഥം നൽകുന്നു.
- source_word: לֹא יִטַּמָּא
  choice: അവൻ തന്നെ അശുദ്ധനാക്കരുത്
  rationale: טמא എന്ന ക്രിയയുടെ ഹിത്പഅേൽ രൂപത്തിലെ ആത്മനിർദ്ദേശാർഥം ‘തന്നെ ... ആക്കുക’ എന്നു സംരക്ഷിക്കുന്നു. ‘അശുദ്ധൻ’ ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു; ധാർമിക പാപമായി തെറ്റിദ്ധരിപ്പിക്കാവുന്ന പദങ്ങൾ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ആചാരപരമായ അശുദ്ധിയുടെ പദപ്രയോഗം
  choice: അശുദ്ധനാക്കരുത്
  alternative: മലിനനാക്കരുത്; ആചാരപരമായി അശുദ്ധനാകരുത്
  rationale: ഈ വാക്യം പുരോഹിതന്റെ ശവസമ്പർക്കം മൂലമുള്ള ശുദ്ധിനിലയെക്കുറിച്ചാണ്. ‘അശുദ്ധൻ’ എന്നത് ബൈബിളിലെ വിഭാഗം നിലനിർത്തുന്നു; ‘ആചാരപരമായി’ എന്നു മുഖ്യവാചകത്തിൽ ചേർക്കുന്നത് വ്യാഖ്യാനപരമാണ്, ‘മലിനൻ’ ധാർമിക കളങ്കം സൂചിപ്പിക്കാം.
- issue: അടുത്ത ബന്ധുക്കൾക്കും ഒഴിവില്ലെന്ന ഊന്നൽ
  choice: മരിച്ചാൽപ്പോലും
  alternative: അപ്പനോ അമ്മയോ നിമിത്തം
  rationale: പൊതുവായ വിലക്കിനു പിന്നാലെ ഏറ്റവും അടുത്ത ബന്ധുക്കളെ പേരെടുത്തുപറയുന്നതിലെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; നിയമത്തിന് മാതാപിതാക്കളുടെ കാര്യത്തിലും ഒഴിവില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘അപ്പൻ, അമ്മ’ എന്ന ബന്ധപദങ്ങൾ മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവം നിലനിർത്തുന്നു; ശുദ്ധിനിയമത്തിന്റെ സാങ്കേതിക ആശയം ‘അശുദ്ധൻ’ എന്ന പദത്തിൽ സംരക്ഷിക്കുന്നു.
