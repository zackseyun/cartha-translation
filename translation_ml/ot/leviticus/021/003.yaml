source:
  edition: WLC
  text: וְ/לַ/אֲחֹת֤/וֹ הַ/בְּתוּלָה֙ הַ/קְּרוֹבָ֣ה אֵלָ֔י/ו אֲשֶׁ֥ר לֹֽא הָיְתָ֖ה לְ/אִ֑ישׁ לָ֖/הּ יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: ml
  text: അവനോടു അടുത്തവളായ, ഒരു പുരുഷനോടു ചേർന്നിട്ടില്ലാത്ത കന്യകയായ തന്റെ സഹോദരിക്കുവേണ്ടിയും[a] അവൻ ആചാരപരമായി അശുദ്ധനാകാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു പുരുഷനോടു ചേർന്നിട്ടില്ലാത്ത’ എന്നതിന് ‘ഭർത്താവുണ്ടായിട്ടില്ലാത്ത’ എന്നോ ‘ഒരു പുരുഷനോടൊപ്പം കഴിഞ്ഞിട്ടില്ലാത്ത’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഒരു പുരുഷനുമായുള്ള വിവാഹബന്ധത്തിലോ ലൈംഗിക ഐക്യത്തിലോ പ്രവേശിച്ചിട്ടില്ലാത്ത സഹോദരിയെയാണ് എബ്രായ വ്യവഹാരം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲחֹתוֹ
  choice: തന്റെ സഹോദരിക്കുവേണ്ടിയും
  rationale: സംയോജകവും മുൻപ്രത്യയവും പട്ടികയിലെ മറ്റൊരു അനുവദനീയ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; സർവനാമപ്രത്യയം ‘തന്റെ സഹോദരി’ എന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: הַבְּתוּלָה
  choice: കന്യകയായ
  rationale: ബְּתוּלָה ഇവിടെ സഹോദരിയുടെ ലൈംഗിക-വൈവാഹിക നിലയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കന്യക’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: തനിക്കു അടുത്ത ബന്ധുവായ
  rationale: എബ്രായപ്രയോഗം അടുപ്പമുള്ള കുടുംബബന്ധത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അടുത്ത ബന്ധു’ എന്നു പറയുന്നത് വൈകാരിക അടുപ്പം മാത്രമായി തെറ്റിദ്ധരിക്കപ്പെടാതെ ബന്ധുത്വസാമീപ്യം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: ഒരു പുരുഷനുമായി ചേർന്നിട്ടില്ലാത്ത
  rationale: പദശഃ ‘ഒരു പുരുഷന് ആയിട്ടില്ലാത്ത’ എന്ന പ്രയോഗം വിവാഹമോ ലൈംഗിക ഐക്യമോ ഉണ്ടായിട്ടില്ലെന്ന ആശയം വഹിക്കുന്നു. ‘ചേർന്നിട്ടില്ലാത്ത’ ആ വ്യവഹാരത്തിന്റെ പരിധി അനാവശ്യമായി വിവാഹത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: לָהּ
  choice: മലയാളവാക്യത്തിൽ പരോക്ഷമായി ഉൾപ്പെടുത്തി
  rationale: പ്രത്യേകമായി പദാനുപദം ചേർത്താൽ മലയാളത്തിൽ അസ്വാഭാവികമാകും; ബന്ധപ്പെട്ട സ്ത്രീയെ സൂചിപ്പിക്കുന്ന അർഥം ഉപവാക്യത്തിൽ വ്യക്തമാണ്.
- source_word: יִטַּמָּא
  choice: അവന് അശുദ്ധനാകാം
  rationale: സന്ദർഭം മൃതദേഹസമ്പർക്കം മൂലമുള്ള ആചാരപരമായ അശുദ്ധിയെക്കുറിച്ചാണ്. ക്രിയാരൂപം ഇവിടെ അനുമതി സൂചിപ്പിക്കുന്നതായി ‘ആകാം’ വ്യക്തമാക്കുന്നു; ധാർമിക ദുഷ്ടത എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: ‘അശുദ്ധനാകാം’ എന്ന് ആചാരപരമായ നിലയായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘തന്നെത്തന്നെ മലിനമാക്കാം’
  rationale: ലേവ്യപുസ്തകം 21-ലെ സന്ദർഭം മൃതദേഹത്തോടുള്ള സമ്പർക്കത്തിൽനിന്നുണ്ടാകുന്ന ആചാരപരമായ അശുദ്ധിയാണ്, വ്യക്തിപരമായ പാപമോ ധാർമിക കളങ്കമോ അല്ല.
- issue: אֲשֶׁר לֹא הָיְתָה לְאִישׁ എന്ന വ്യവഹാരത്തിന്റെ പരിധി
  choice: ‘ഒരു പുരുഷനുമായി ചേർന്നിട്ടില്ലാത്ത’
  alternative: ‘വിവാഹിതയായിട്ടില്ലാത്ത’
  rationale: എബ്രായപ്രയോഗം വിവാഹബന്ധത്തെയോ പുരുഷനുമായുള്ള ഐക്യത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ വിശാലത നിലനിർത്തി, വ്യത്യസ്ത വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘അശുദ്ധനാകാം’ എന്നത് അനുമതിയും ആചാരപരമായ അശുദ്ധിയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട മുഴുവൻ സാഹചര്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
