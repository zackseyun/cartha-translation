id: LEV.21.22
reference: Leviticus 21:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: ml
  text: അവന് തന്റെ ദൈവത്തിന്റെ ആഹാരം അതിവിശുദ്ധ വസ്തുക്കളിൽനിന്നും വിശുദ്ധ വസ്തുക്കളിൽനിന്നും ഭക്ഷിക്കാം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶחֶם
  choice: ആഹാരം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘അപ്പം’ എന്നാണെങ്കിലും, ഇവിടെ പുരോഹിതന് ലഭിക്കുന്ന യാഗസംബന്ധമായ ഭക്ഷണവിഹിതങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ആഹാരം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֱלֹהָיו
  choice: തന്റെ ദൈവത്തിന്റെ
  rationale: ഏകവചന പുല്ലിംഗ പ്രത്യയം പുരോഹിതനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കർത്താവിലേക്കുള്ള തിരിച്ചുസംബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: അതിവിശുദ്ധമായവയിൽനിന്നും
  rationale: ഈ സംയുക്തപ്രയോഗം വിശുദ്ധവസ്തുക്കളുടെ ഏറ്റവും ഉയർന്ന വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ അതിശയോക്തിരൂപമാണ്; ‘അതിവിശുദ്ധമായവ’ ആ ആരാധനാനിയമപരമായ വേർതിരിവ് നിലനിർത്തുന്നു.
- source_word: וּמִן הַקֳּדָשִׁים
  choice: വിശുദ്ധമായവയിൽനിന്നും
  rationale: മുൻപറഞ്ഞ അതിവിശുദ്ധ വിഭാഗത്തിൽനിന്ന് വേർതിരിച്ച മറ്റൊരു വിശുദ്ധവിഭാഗത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്; קדש എന്ന മൂലപദവുമായുള്ള ബന്ധവും നിയമപരമായ വ്യത്യാസവും ഈ പരിഭാഷ കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: יֹאכֵל
  choice: ഭക്ഷിക്കാം
  rationale: സന്ദർഭത്തിൽ ഈ അപൂർണക്രിയ ഭാവികാലമോ നിർബന്ധമോ അല്ല, അനുമതിയാണ് പ്രകടിപ്പിക്കുന്നത്; ‘ഭക്ഷിക്കാം’ അത് ലളിതമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിൽ יֹאכֵל എന്ന അപൂർണക്രിയയുടെ ഭാവം
  choice: അനുമതി (‘ഭക്ഷിക്കാം’)
  alternative: സാധാരണ ഭാവികാലം (‘ഭക്ഷിക്കും’) അല്ലെങ്കിൽ നിർബന്ധം (‘ഭക്ഷിക്കണം’)
  rationale: ശാരീരിക ന്യൂനതയുള്ള പുരോഹിതന് സമീപിക്കാനോ അർപ്പിക്കാനോ പാടില്ലാത്ത കാര്യങ്ങളെയും, അവന് തുടർന്നും ഭക്ഷിക്കാൻ അനുവാദമുള്ള വിശുദ്ധവിഹിതങ്ങളെയും സന്ദർഭം വേർതിരിക്കുന്നു. അതിനാൽ അനുമതിസൂചകമായ പരിഭാഷ നിയമപരമായ വൈരുധ്യം അമിതവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ആരാധനാനിയമത്തിലെ രണ്ടു വിശുദ്ധവിഭാഗങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം ‘അതിവിശുദ്ധമായവ’ എന്നും ‘വിശുദ്ധമായവ’ എന്നും നിലനിർത്തി.
