  to: അവന് തന്റെ ദൈവത്തിന്റെ ആഹാരം അതിവിശുദ്ധ വസ്തുക്കളിൽനിന്നും വിശുദ്ധ വസ്തുക്കളിൽനിന്നും ഭക്ഷിക്കാം.
