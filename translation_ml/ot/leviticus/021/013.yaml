source:
  edition: WLC
  text: וְ/ה֕וּא אִשָּׁ֥ה בִ/בְתוּלֶ֖י/הָ יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/013.yaml
  text: And he shall take a wife in her virginity[a].
translation:
  language: ml
  text: അവൻ കന്യകയായ ഒരു സ്ത്രീയെ ഭാര്യയായി സ്വീകരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അവളുടെ കന്യകാത്വത്തിൽ.’ അഥവാ, ‘കന്യകയായിരിക്കെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: അവൻ
  rationale: വാക്യത്തിന്റെ തുടർച്ചയും വ്യക്തമായ കർത്താവും നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘അവൻ തന്നെയോ’ എന്നു ചേർത്താൽ മൂലത്തിലുള്ള നേരിയ ഊന്നൽ അതിരുകടക്കാം.
- source_word: אִשָּׁה
  choice: ഒരു സ്ത്രീയെ ഭാര്യയായി
  rationale: לקח എന്ന ക്രിയയോടൊപ്പം ഇത് വിവാഹസന്ദർഭം സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിനായി ‘സ്ത്രീയെ ഭാര്യയായി സ്വീകരിക്കുക’ എന്ന വിവാഹപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: בִּבְתוּלֶיהָ
  choice: കന്യകയായ
  rationale: സ്ത്രീയുടെ കന്യകാത്വാവസ്ഥയാണ് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി ‘കന്യകയായ’ എന്നും അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകി.
- source_word: יִקָּח
  choice: സ്വീകരിക്കണം
  rationale: ഇവിടെ לקח എന്നത് ഭാര്യയെ സ്വീകരിക്കുക, അഥവാ വിവാഹം കഴിക്കുക, എന്ന നിയമപരമായ വിവാഹപ്രയോഗമാണ്. ‘എടുക്കണം’ എന്ന അക്ഷരാനുവാദത്തേക്കാൾ ‘സ്വീകരിക്കണം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിലെ വിവാഹപദപ്രയോഗം
  choice: ‘ഒരു സ്ത്രീയെ ഭാര്യയായി സ്വീകരിക്കണം’ എന്ന വിവാഹപ്രയോഗം നിലനിർത്തി.
  alternative: ‘അവൻ ഒരു കന്യകയെ വിവാഹം കഴിക്കണം.’
  rationale: വിവാഹത്തിന്റെ അർഥം വ്യക്തമായി നൽകുമ്പോഴും ‘ഭാര്യയെ എടുക്കുക’ എന്ന എബ്രായ ശൈലിയുടെ ഘടന ഭാഗികമായി സംരക്ഷിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനം ഒന്നും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നിയമനിർദേശത്തിന്റെ ഭാവം ‘സ്വീകരിക്കണം’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
