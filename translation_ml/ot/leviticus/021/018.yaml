  to: കാരണം, ശാരീരിക വൈകല്യമുള്ള ഒരു പുരുഷനും സമീപിക്കരുത്:[a] അന്ധനായവനോ മുടന്തനായവനോ മുഖവൈകല്യമുള്ളവനോ[b] അസാധാരണമായി നീണ്ട ഒരു അവയവമുള്ളവനോ[c].
