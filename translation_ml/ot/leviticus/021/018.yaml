id: LEV.21.18
reference: Leviticus 21:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: ml
  text: കാരണം, ശാരീരിക വൈകല്യമുള്ള ഒരു പുരുഷനും സമീപിക്കരുത്:[a] അന്ധനായവനോ മുടന്തനായവനോ മുഖവൈകല്യമുള്ളവനോ[b] അസാധാരണമായി നീണ്ട ഒരു അവയവമുള്ളവനോ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “സമീപിക്കുക” എന്നത് പുരോഹിതശുശ്രൂഷ നിർവഹിക്കാൻ സമീപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: “മുഖവൈകല്യമുള്ളവൻ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രു പദം അപൂർവമാണ്; ക്ഷതമേറ്റതോ രൂപവൈകല്യമുള്ളതോ ആയ മൂക്കിനെ ഇത് കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രു പദം നീണ്ടതോ വളർച്ചകൂടിയതോ അനുപാതരഹിതമായതോ ആയ ഒരു ശരീരഭാഗത്തെ സൂചിപ്പിക്കാനിടയുണ്ട്; കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ വിലക്കിന്റെ കാരണം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം നിലനിർത്തുന്നു.
- source_word: כָל אִישׁ אֲשֶׁר בּוֹ מוּם
  choice: ശാരീരിക വൈകല്യമുള്ള ഒരു പുരുഷനും
  rationale: തുടർന്നുള്ള നിഷേധത്തോടൊപ്പം ‘ഒരു പുരുഷനും ... അരുത്’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭം അഹരോന്യ പുരുഷപുരോഹിതന്മാരെക്കുറിച്ചായതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു. מוּם ഇവിടെ പുരോഹിതശുശ്രൂഷയ്ക്കുള്ള സമീപനത്തെ തടയുന്ന ശാരീരിക വൈകല്യമാണ്.
- source_word: לֹא יִקְרָב
  choice: അടുത്തുവരരുത്
  rationale: പുരോഹിതശുശ്രൂഷയ്ക്കായി വിശുദ്ധസ്ഥാനത്തോട് സമീപിക്കുക എന്ന ആചാരപരമായ അർഥം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അതിന്റെ സന്ദർഭപരമായ പരിധി വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ עִוֵּר
  choice: അന്ധനായവൻ
  rationale: ഹീബ്രു വിശേഷണത്തിന്റെ അർഥം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: פִסֵּחַ
  choice: മുടന്തനായവൻ
  rationale: നടത്തത്തെ ബാധിക്കുന്ന ശാരീരിക അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളപ്രയോഗം.
- source_word: חָרֻם
  choice: മുഖവൈകല്യമുള്ളവൻ
  rationale: അപൂർവമായ ഈ പദം മുഖത്തിന്റെയോ പ്രത്യേകിച്ച് മൂക്കിന്റെയോ ക്ഷതമോ രൂപവൈകല്യമോ സൂചിപ്പിക്കാം; ഉറപ്പില്ലാത്ത കൃത്യത ഒഴിവാക്കി സാധ്യതയുള്ള പൊതുവായ അർഥം നൽകുന്നു.
- source_word: שָׂרוּעַ
  choice: നീളം കൂടിയ ഒരു അവയവമുള്ളവൻ
  rationale: അസമമായി നീണ്ടതോ അനുപാതരഹിതമായതോ ആയ ശരീരഭാഗത്തെ പദം സൂചിപ്പിക്കാനിടയുണ്ട്; മൂലത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിലെ വിലക്കിന്റെ സ്വഭാവം
  choice: ‘അടുത്തുവരരുത്’ എന്നത് പുരോഹിതശുശ്രൂഷയ്ക്കായി സമീപിക്കുന്നതിനെക്കുറിച്ചുള്ള ആചാരപരമായ യോഗ്യതയായി അവതരിപ്പിച്ചു.
  alternative: വ്യക്തിയുടെ പൊതുവായ സാമൂഹിക പുറന്തള്ളലോ ധാർമിക അയോഗ്യതയോ ആയി വായിക്കുക.
  rationale: ഹീബ്രു വാക്യം ശാരീരിക വൈകല്യങ്ങളെ പുരോഹിതസമീപനവുമായി ബന്ധിപ്പിക്കുന്നു; വ്യക്തിയുടെ മൂല്യത്തെയോ പാപസ്ഥിതിയെയോ കുറിച്ചുള്ള അവകാശവാദം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. അപൂർവമായ חָרֻם, שָׂרוּעַ എന്നീ പദങ്ങളുടെ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ച് അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു. പട്ടികയുടെ സമാന്തരഘടന വ്യക്തമാക്കാൻ അവസാനത്തിൽ ക്രിയ ആവർത്തിച്ചു.
