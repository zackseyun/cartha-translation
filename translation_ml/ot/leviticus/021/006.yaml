  revised_text: അവർ തങ്ങളുടെ ദൈവത്തിന് വിശുദ്ധരായിരിക്കണം; തങ്ങളുടെ ദൈവത്തിന്റെ നാമം അപവിത്രമാക്കരുത്. കാരണം, അവർ യഹ്‌വെയുടെ അഗ്നിയർപ്പണങ്ങൾ[a]—തങ്ങളുടെ ദൈവത്തിന്റെ ആഹാരം—അർപ്പിക്കുന്നു; അതുകൊണ്ട് അവർ വിശുദ്ധരായിരിക്കണം.
