reference: Leviticus 21:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ ദൈവത്തിന് വിശുദ്ധരായിരിക്കണം; തങ്ങളുടെ ദൈവത്തിന്റെ നാമം അപവിത്രമാക്കരുത്. കാരണം, അവർ യഹ്‌വെയുടെ അഗ്നിയർപ്പണങ്ങൾ[a]—തങ്ങളുടെ ദൈവത്തിന്റെ ആഹാരം—അർപ്പിക്കുന്നു; അതുകൊണ്ട് അവർ വിശുദ്ധരായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യഹ്‌വെയുടെ ഭക്ഷണയാഗങ്ങൾ.” അക്ഷരാർഥത്തിൽ, തുടർന്നുള്ള പ്രയോഗം “തങ്ങളുടെ ദൈവത്തിന്റെ അപ്പം” എന്നാണ്.'
    reason: אִשֶּׁה എന്ന സാങ്കേതിക യാഗപദം “അഗ്നിയർപ്പണം” എന്നും, സന്ദർഭത്തിൽ “ഭക്ഷണയാഗം” എന്നും വിവർത്തനം ചെയ്യാം; לֶחֶם എന്നതിന്റെ അക്ഷരാർഥം “അപ്പം” ആണ്.
lexical_decisions:
- source_word: קְדֹשִׁים יִהְיוּ
  choice: വിശുദ്ധരായിരിക്കണം
  rationale: നിയമപരമായ സന്ദർഭത്തിലെ അപൂർണക്രിയയുടെ നിർദേശാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ആവർത്തിക്കുന്ന വിശുദ്ധതാഭാഷയും സംരക്ഷിക്കുന്നു.
- source_word: לֵאלֹהֵיהֶם
  choice: തങ്ങളുടെ ദൈവത്തിനു
  rationale: ל എന്ന ബന്ധസൂചക ഉപസർഗവും ദൈവത്തോടുള്ള സമർപ്പിതബന്ധവും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְחַלְּלוּ
  choice: അശുദ്ധമാക്കരുത്
  rationale: חלל എന്ന പദത്തിന്റെ വിശുദ്ധം–സാധാരണം/അശുദ്ധം എന്ന ലേവ്യപുസ്തകത്തിലെ വൈരുധ്യം വ്യക്തമായി നൽകുന്നു; ‘അപമാനിക്കരുത്’ എന്നതിലുപരി ആരാധനാപരമായ ആശയം നിലനിർത്തുന്നു.
- source_word: שֵׁם אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദൈവത്തിന്റെ നാമം
  rationale: ഹീബ്രായ നിർമാണത്തിന്റെ അർഥവും ഗൗരവമുള്ള ശൈലിയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: אִשֵּׁי יְהוָה
  choice: യഹ്‌വെയുടെ അഗ്നിയർപ്പണങ്ങൾ
  rationale: אִשֶּׁה എന്ന ആരാധനാപരമായ സാങ്കേതികപദത്തിലെ അഗ്നിയുമായി ബന്ധപ്പെട്ട അർഥം മറച്ചുവയ്ക്കാതെ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദൈവത്തിന്റെ ആഹാരം
  rationale: לֶחֶם എന്നത് അക്ഷരാർഥത്തിൽ ‘അപ്പം’ ആണെങ്കിലും യാഗസന്ദർഭത്തിൽ വിശാലമായി ‘ആഹാരം’ സൂചിപ്പിക്കാം; പ്രധാനപാഠത്തിൽ തെറ്റായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: מַקְרִיבִם
  choice: അർപ്പിക്കുന്നു
  rationale: യാഗമായി സമീപത്തുകൊണ്ടുവരുക/സമർപ്പിക്കുക എന്ന ഹിഫീൽ രൂപത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാള യാഗഭാഷയിൽ നൽകുന്നു.
- source_word: וְהָיוּ קֹדֶשׁ
  choice: അതുകൊണ്ട് അവർ വിശുദ്ധരായിരിക്കണം
  rationale: മുൻപുള്ള כִּי കാരണവാക്യത്തിൽനിന്നുള്ള നിഗമനം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അവസാനത്തെ വിശുദ്ധതാവശ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിനാമം പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם എന്ന ആരാധനാപരമായ പ്രയോഗം
  choice: യഹ്‌വെയുടെ അഗ്നിയർപ്പണങ്ങൾ—തങ്ങളുടെ ദൈവത്തിന്റെ ആഹാരം
  alternative: യഹ്‌വെയുടെ ഭക്ഷണയാഗങ്ങൾ, തങ്ങളുടെ ദൈവത്തിന്റെ അപ്പം
  rationale: ആദ്യപദത്തിലെ അഗ്നിയാഗസൂചനയും രണ്ടാമത്തെ പദത്തിലെ ഭക്ഷണരൂപകവും ഒരുമിച്ച് സംരക്ഷിച്ചു; ദൈവത്തിനു ആഹാരം ആവശ്യമാണെന്ന ദാർശനിക വ്യാഖ്യാനം ചേർക്കുകയോ ഒഴിവാക്കുകയോ ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പുരോഹിതന്മാരെ സൂചിപ്പിക്കുന്ന ബഹുവചനം സന്ദർഭത്തിൽനിന്ന് നിലനിർത്തി. സാങ്കേതികമായ യാഗഭാഷ വ്യക്തമാക്കിയെങ്കിലും അതിന്റെ രൂപകാത്മകവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം വിശദീകരിച്ച് തീർപ്പാക്കിയിട്ടില്ല.
