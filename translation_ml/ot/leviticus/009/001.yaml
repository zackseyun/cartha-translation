  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/יּ֣וֹם הַ/שְּׁמִינִ֔י קָרָ֣א מֹשֶׁ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו וּ/לְ/זִקְנֵ֖י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/001.yaml
  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: ml
  text: എട്ടാം ദിവസം മോശ അഹരോനെയും അവന്റെ പുത്രന്മാരെയും ഇസ്രായേലിലെ മൂപ്പന്മാരെയും വിളിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിളിച്ചുവരുത്തി’; സന്ദർഭത്തിൽ ഹീബ്രു ക്രിയയ്ക്ക് രണ്ടർഥവും സാധ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: എട്ടാം ദിവസം എന്ന നേരിട്ടുള്ള കാലസൂചനയിലൂടെ ആഖ്യാനപരിവർത്തനം പ്രകടിപ്പിച്ചു
  rationale: ഹീബ്രു രൂപം ആഖ്യാനത്തിലെ പുതിയ ഘട്ടം ആരംഭിക്കുന്നു. അതിനെ പ്രത്യേകം ‘സംഭവിച്ചു’ എന്നു വിവർത്തനം ചെയ്യുന്നത് ആധുനിക മലയാളത്തിൽ കൃത്രിമമായി തോന്നുന്നതിനാൽ, വാക്യാരംഭത്തിലെ കാലസൂചനയിലൂടെ അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: എട്ടാം ദിവസം
  rationale: ഹീബ്രുവിലെ ലളിതമായ കാലപ്രയോഗം നേരിട്ട് പകർന്നു; ഏഴുദിവസത്തെ അഭിഷേകകാലത്തിനു ശേഷമുള്ള ദിവസം എന്ന സന്ദർഭവിവരണം മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ചേർത്തില്ല.
- source_word: קָרָא
  choice: വിളിച്ചു
  rationale: ക്രിയയ്ക്ക് ‘വിളിക്കുക’, ‘വിളിച്ചുവരുത്തുക’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. പ്രധാന പാഠത്തിൽ കൂടുതൽ നേരിട്ടുള്ള ‘വിളിച്ചു’ സ്വീകരിച്ച് മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: לְאַהֲרֹן
  choice: അഹരോനെ
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ നൽകി; ക്രിയയുടെ കർമമായി വിഭക്തിചേർത്തു.
- source_word: וּלְבָנָיו
  choice: അവന്റെ പുത്രന്മാരെ
  rationale: പുരോഹിതശുശ്രൂഷയുടെ സന്ദർഭത്തിൽ בנים അഹരോന്റെ ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ മൂപ്പന്മാരെ
  rationale: ഇസ്രായേലിന്റെ അംഗീകൃത മുതിർന്ന പ്രതിനിധികളെയോ നേതാക്കളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
