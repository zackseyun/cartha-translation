source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: ml
  text: 'മോശ അഹരോനോടു പറഞ്ഞു: “യാഗപീഠത്തിനരികെ ചെന്ന് നിന്റെ പാപയാഗവും[a] ഹോമയാഗവും അർപ്പിച്ച് നിനക്കും ജനത്തിനുംവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കുക. പിന്നെ ജനത്തിന്റെ വഴിപാട് അർപ്പിച്ച് അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കുക—യഹോവ കല്പിച്ചതുപോലെതന്നെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുദ്ധീകരണയാഗം.” എബ്രായപദമായ חַטָּאת പാപയാഗത്തെ സൂചിപ്പിക്കാം; ചില സന്ദർഭങ്ങളിൽ അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണത്തിനാണ് ഊന്നൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרַב אֶל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനരികെ ചെന്ന്
  rationale: ആരാധനാക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ ക്രിയയ്ക്ക് ‘അടുത്തുചെല്ലുക/സമീപിക്കുക’ എന്ന അർഥം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു.
- source_word: וַעֲשֵׂה
  choice: അർപ്പിച്ച് / അർപ്പിക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘ചെയ്യുക’ എന്നാണെങ്കിലും യാഗവസ്തുക്കളോടൊപ്പം ഇവിടെ യാഗം നിർവഹിക്കുകയോ അർപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: חַטָּאתְךָ
  choice: നിന്റെ പാപയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസന്ദർഭത്തിൽ ഇത് പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്നു; ശുദ്ധീകരണവശം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: עֹלָתֶךָ
  choice: നിന്റെ ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള നിലവാരമുള്ളതും കൃത്യവുമായ മലയാള പദം.
- source_word: וְכַפֵּר
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  rationale: യാഗപരമായ പരിഹാരത്തിന്റെയും ശുദ്ധീകരണത്തിന്റെയും വ്യാപ്തി ഒരു പ്രത്യേക സിദ്ധാന്തത്തിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുന്ന പരിചിതമായ മലയാള പ്രയോഗം.
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: നിനക്കും ജനത്തിനുംവേണ്ടി
  rationale: בְּעַד എന്ന പദത്തിന്റെ പ്രതിനിധിത്വപരവും ഗുണഭോക്തൃപരവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: קָרְבַּן הָעָם
  choice: ജനത്തിന്റെ വഴിപാട്
  rationale: קָרְבָּן എന്ന പൊതുവായ അർപ്പണപദത്തെ ‘വഴിപാട്’ എന്നു പരിഭാഷപ്പെടുത്തി; ബന്ധസൂചക ഘടനയും നിലനിർത്തി.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: യഹോവ കല്പിച്ചതുപോലെതന്നെ
  rationale: ദൈവകല്പനയോടുള്ള കൃത്യമായ അനുരൂപത സൂചിപ്പിക്കുകയും יהוה എന്ന വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: חַטָּאת എന്ന യാഗപദത്തിന്റെ അർഥവ്യാപ്തി
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ‘പാപയാഗം’ പരിചിതവും സന്ദർഭയോഗ്യവുമാണ്; എന്നാൽ ആചാരപരമായ അശുദ്ധി നീക്കുന്നതിലുള്ള ഊന്നൽ നഷ്ടപ്പെടാതിരിക്കാൻ മറ്റൊരു സാധുവായ പരിഭാഷ അടിക്കുറിപ്പിൽ ചേർത്തു.
- issue: כפר എന്ന ക്രിയയുടെ യാഗപരമായ അർഥം
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  alternative: ശുദ്ധീകരണം വരുത്തുക / പരിഹാരം വരുത്തുക
  rationale: മൂലപദത്തിന്റെ യാഗപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുമ്പോഴും പ്രായശ്ചിത്തത്തിന്റെ ഒരു പ്രത്യേക സിദ്ധാന്തം വാക്യത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള ആരാധനാഭാഷ നിലനിർത്തി. ‘യാഗപീഠം,’ ‘ഹോമയാഗം,’ ‘പ്രായശ്ചിത്തം’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചു; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
