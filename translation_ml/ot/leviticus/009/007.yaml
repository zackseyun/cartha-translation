  source_fidelity: 'മൂലഎബ്രായത്തിലെ ആജ്ഞാക്രമവും യാഗസംബന്ധമായ പദങ്ങളും വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: അഹരോൻ യാഗപീഠത്തോടു സമീപിക്കുക, സ്വന്തം പാപയാഗവും ഹോമയാഗവും അർപ്പിക്കുക, തനിക്കുവേണ്ടിയും ജനത്തിനുവേണ്ടിയും പ്രായശ്ചിത്തം കഴിക്കുക, തുടർന്ന് ജനത്തിന്റെ അർപ്പണം അർപ്പിച്ച് അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കുക. അവസാനത്തെ ‘യഹോവ കല്പിച്ചതുപോലെതന്നെ’ כַּאֲשֶׁר צִוָּה יְהוָה എന്നതിന്റെ കൃത്യത നിലനിർത്തുന്നു.'
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ള തിരുവെഴുത്തുഭാഷാരജിസ്റ്ററിന് യോജിച്ചതുമാണ്. ‘യാഗപീഠം,’ ‘പാപയാഗം,’ ‘ഹോമയാഗം,’ ‘പ്രായശ്ചിത്തം’ എന്നിവ സന്ദർഭോചിതമായ പരിചിതപദങ്ങളാണ്. ‘ജനത്തിന്റെ വഴിപാട്’ കർബാന്റെ പൊതുവായ അർപ്പണാർഥം സന്ദർഭത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
