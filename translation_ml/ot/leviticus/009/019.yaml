revisions:
- from: കാളയിൽനിന്നും ആട്ടുകൊറ്റനിൽനിന്നുമുള്ള കൊഴുപ്പുള്ള ഭാഗങ്ങളും—കൊഴുത്ത വാൽ, മൂടുന്ന കൊഴുപ്പ്, വൃക്കകൾ, കരളിന്റെ അനുബന്ധഭാഗം എന്നിവയും—
  to: 'കാളയിൽനിന്നും ആട്ടുകൊറ്റനിൽനിന്നും എടുത്ത കൊഴുപ്പുഭാഗങ്ങളും: കൊഴുപ്പേറിയ വാലും, മൂടിക്കിടക്കുന്ന കൊഴുപ്പും, വൃക്കകളും, കരളിന്റെ അനുബന്ധഭാഗവും—'
