source:
  edition: WLC
  text: וְ/אֶת הַ/חֲלָבִ֖ים מִן הַ/שּׁ֑וֹר וּ/מִן הָ/אַ֔יִל הָֽ/אַלְיָ֤ה וְ/הַֽ/מְכַסֶּה֙ וְ/הַ/כְּלָיֹ֔ת וְ/יֹתֶ֖רֶת הַ/כָּבֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/019.yaml
  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: ml
  text: 'കാളയിൽനിന്നും ആട്ടുകൊറ്റനിൽനിന്നും എടുത്ത കൊഴുപ്പുഭാഗങ്ങളും: കൊഴുപ്പേറിയ വാലും, മൂടിക്കിടക്കുന്ന കൊഴുപ്പും, വൃക്കകളും, കരളിന്റെ അനുബന്ധഭാഗവും—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: കൊഴുപ്പുള്ള ഭാഗങ്ങളും
  rationale: യാഗസന്ദർഭത്തിൽ ബലിയർപ്പിക്കാനായി വേർതിരിച്ച നിർദിഷ്ട കൊഴുപ്പുഭാഗങ്ങളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘കൊഴുപ്പ്’ എന്നതിനെക്കാൾ ഇത് വ്യക്തമാണ്. וְאֶת മുൻവാക്യത്തിലെ കർമപ്പട്ടിക തുടരുന്നതിനാൽ ‘-ഉം’ കൊണ്ട് പ്രതിനിധീകരിച്ചു.
- source_word: מִן הַשּׁוֹר
  choice: കാളയിൽനിന്നും
  rationale: שׁוֹר കന്നുകാലിവർഗത്തിലെ ആൺമൃഗത്തെ സൂചിപ്പിക്കാം; മലയാളത്തിലെ ‘കാള’ ഈ യാഗസന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וּמִן הָאַיִל
  choice: ആട്ടുകൊറ്റനിൽനിന്നുമുള്ള
  rationale: אַיִל യാഗസന്ദർഭത്തിൽ ആൺചെമ്മരിയാടിനെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദമായി ‘ആട്ടുകൊറ്റൻ’ തെരഞ്ഞെടുത്തു.
- source_word: הָאַלְיָה
  choice: കൊഴുത്ത വാൽ
  rationale: കൊഴുപ്പ് ധാരാളമുള്ള ചെമ്മരിയാടിന്റെ വാലിനെയാണ് ഈ യാഗസാങ്കേതിക പദം സൂചിപ്പിക്കുന്നത്.
- source_word: וְהַמְכַסֶּה
  choice: മൂടുന്ന കൊഴുപ്പ്
  rationale: כסה (‘മൂടുക’) എന്ന ധാതുവിൽനിന്നുള്ള പദം; ആന്തരാവയവങ്ങളെ മൂടിയിരിക്കുന്ന കൊഴുപ്പിനെ പട്ടികാസന്ദർഭത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וְהַכְּלָיֹת
  choice: വൃക്കകൾ
  rationale: ആധുനിക മലയാളത്തിലെ സാധാരണ ശരീരാവയവനാമം.
- source_word: וְיֹתֶרֶת הַכָּבֵד
  choice: കരളിന്റെ അനുബന്ധഭാഗം
  rationale: יֹתֶרֶת സൂചിപ്പിക്കുന്ന ശരീരഘടനയുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ ‘കരളിന്റെ ഖണ്ഡം’ എന്ന് അതിരുകടന്ന് നിർവചിക്കാതെ, കരളോടു ചേർന്ന പ്രത്യേക ഭാഗം എന്ന മൂലാർത്ഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാഗക്രമത്തിലെ ശരീരഭാഗങ്ങളുടെ പട്ടിക വ്യക്തവും മാന്യവുമായ ശൈലിയിൽ നൽകി. ഈ വാക്യം അടുത്ത വാക്യത്തിലെ ക്രിയയിലേക്കു നീളുന്ന അപൂർണ വാക്യഘടകമായതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം ഡാഷ് ഉപയോഗിച്ചു.
