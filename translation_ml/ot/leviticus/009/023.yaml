id: LEV.9.23
reference: Leviticus 9:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וַ/יֵּ֣צְא֔וּ וַֽ/יְבָרֲכ֖וּ אֶת הָ/עָ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: ml
  text: മോശയും അഹരോനും സമാഗമകൂടാരത്തിൽ പ്രവേശിച്ചു. അവർ പുറത്തുവന്ന് ജനത്തെ അനുഗ്രഹിച്ചു. അപ്പോൾ യഹ്‌വേയുടെ മഹത്വം ജനമെല്ലാവർക്കും പ്രത്യക്ഷമായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ ആരാധനാകേന്ദ്രമായ കൂടാരത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ തുല്യപദം.
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: പ്രവേശിച്ചു ... പുറത്തുവന്ന്
  rationale: സംയുക്ത കർത്താവിനെയും തുടർന്നുള്ള ബഹുവചന ക്രിയകളെയും അടിസ്ഥാനമാക്കി മോശയും അഹരോനും ഒരുമിച്ച് പ്രവേശിച്ചതും പുറത്തുവന്നതുമായ പ്രവർത്തനക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיְבָרֲכוּ
  choice: അനുഗ്രഹിച്ചു
  rationale: അനുഗ്രഹത്തിന്റെ രൂപമോ വാക്കുകളോ അനാവശ്യമായി വിശദീകരിക്കാതെ ഹീബ്രു ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: הָעָם / כָּל הָעָם
  choice: ജനത്തെ / സകലജനത്തിനും
  rationale: കൂടിവന്ന ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന עָם എന്ന പദത്തിന് സന്ദർഭോചിതമായ സ്വാഭാവിക മലയാളം; כָּל എന്നതിന്റെ സമഗ്രതയും സൂക്ഷിക്കുന്നു.
- source_word: כְבוֹד יְהוָה
  choice: യഹ്‌വേയുടെ മഹത്ത്വം
  rationale: പ്രത്യക്ഷമാകുന്ന ദൈവിക മഹിമ എന്ന כָּבוֹד എന്ന പദത്തിന്റെ ഗൗരവവും יְהוָה എന്ന ഉടമ്പടിനാമവും നിലനിർത്തുന്നു.
- source_word: וַיֵּרָא
  choice: പ്രത്യക്ഷമായി
  rationale: നിഫാൽ രൂപം സൂചിപ്പിക്കുന്ന ദൃശ്യമായ വെളിപ്പെടലിനെ സ്വാഭാവികവും ദൈവപ്രത്യക്ഷതയ്ക്ക് യോജിച്ചതുമായ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֶל כָּל הָעָם
  choice: സകലജനത്തിനും
  rationale: പ്രത്യക്ഷത ജനമെല്ലാവർക്കും ദൃശ്യമായെന്ന ആശയം അധിക വ്യാഖ്യാനം ചേർക്കാതെ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഹീബ്രു മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: വാക്യഘടകങ്ങൾ തമ്മിലുള്ള കാലക്രമബന്ധം
  choice: അപ്പോൾ
  alternative: തുടർച്ചയായ ‘ഉം/യും’ ഘടന
  rationale: ഹീബ്രു wayyiqtol ആഖ്യാനക്രമത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; കാരണബന്ധം അനാവശ്യമായി ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ പ്രവർത്തനക്രമം ചെറിയ സ്വതന്ത്രവാക്യങ്ങളിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
