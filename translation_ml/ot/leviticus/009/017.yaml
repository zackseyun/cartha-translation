id: LEV.9.17
reference: Leviticus 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּקְרֵב֮ אֶת הַ/מִּנְחָה֒ וַ/יְמַלֵּ֤א כַפּ/וֹ֙ מִמֶּ֔/נָּה וַ/יַּקְטֵ֖ר עַל הַ/מִּזְבֵּ֑חַ מִ/לְּ/בַ֖ד עֹלַ֥ת הַ/בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/017.yaml
  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: ml
  text: പിന്നെ അവൻ ധാന്യയാഗം അർപ്പിച്ചു; അതിൽനിന്ന് കൈ നിറയെ എടുത്ത്[a], പ്രഭാതത്തിലെ ഹോമയാഗത്തിനു പുറമേ യാഗപീഠത്തിന്മേൽ ദഹിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അതിൽനിന്ന് തന്റെ ഉള്ളങ്കൈ നിറച്ചു.’ യാഗപീഠത്തിൽ ദഹിപ്പിക്കാനായി ധാന്യയാഗത്തിൽനിന്ന് ഒരു ഭാഗം കൈയിൽ എടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: അർപ്പിച്ചു
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള קרב യാഗസന്ദർഭത്തിൽ യാഗവസ്തു അടുത്തുകൊണ്ടുവന്ന് സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അർപ്പിച്ചു’ എന്നത് ആചാരപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַמִּנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗനിയമങ്ങളിൽ מִנְחָה പൊതുവായ വഴിപാടല്ല, ധാന്യത്തിൽനിന്നുള്ള പ്രത്യേക യാഗമാണ്.
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: അതിൽനിന്ന് കൈ നിറയെ എടുത്ത്
  rationale: എബ്രായപ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട്, യാഗത്തിനായി ഒരു കൈപ്പിടിയളവ് എടുക്കുന്നതെന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּקְטֵר
  choice: ദഹിപ്പിച്ചു
  rationale: קטר എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപം യാഗപീഠത്തിൽ വഴിപാട് പുകയായി ഉയരുന്നവിധം കത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ദഹിപ്പിച്ചു’ എന്നത് യാഗസന്ദർഭത്തിന് യോജിച്ച സംക്ഷിപ്തമായ പദമാണ്.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: യാഗം ദഹിപ്പിച്ച സ്ഥലത്തെ വ്യക്തമാക്കുന്ന സ്വാഭാവികവും സ്ഥിരവുമായ മലയാളപ്രയോഗം.
- source_word: מִלְּבַד
  choice: പുറമേ
  rationale: ഈ ധാന്യയാഗം പതിവായ പ്രഭാതയാഗത്തിനു കൂടാതെ അർപ്പിച്ചതാണെന്ന കൂട്ടിച്ചേർക്കൽ ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: עֹלַת הַבֹּקֶר
  choice: പ്രഭാതത്തിലെ ഹോമയാഗം
  rationale: עֹלָה ലേവ്യപുസ്തകത്തിലെ പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപദമാണ്; ‘ഹോമയാഗം’ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമാണ്.
