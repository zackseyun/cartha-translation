translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ‘ധാന്യയാഗം,’ ‘ഹോമയാഗം,’ ‘യാഗപീഠം’ എന്നീ സ്ഥാപിത യാഗപദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ കൈ നിറയ്ക്കുന്ന ദൃശ്യപ്രയോഗം വായനാസൗകര്യത്തോടെ നിലനിർത്തി.
