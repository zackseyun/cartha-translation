revisions:
- from: അവർ ഹോമയാഗം കഷണംകഷണമായി തലയുംകൂടെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു; അവൻ അവയെ യാഗപീഠത്തിന്മേൽ ദഹിപ്പിച്ചു.[a]
  to: ഹോമയാഗത്തിന്റെ കഷണങ്ങളും തലയും അവർ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു; അവൻ അവയെ യാഗപീഠത്തിന്മേൽ പുകയായി അർപ്പിച്ചു.[a]
