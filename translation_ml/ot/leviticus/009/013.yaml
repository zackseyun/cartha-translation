    text: “പുകയായി അർപ്പിച്ചു” എന്ന എബ്രായ ക്രിയ യാഗപീഠത്തിന്മേൽ യാഗഭാഗങ്ങളെ പുകയായി ഉയർത്തുന്നവിധം അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; “ദഹിപ്പിച്ചു” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
