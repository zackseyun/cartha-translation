source:
  edition: WLC
  text: וְ/אֶת הָ/עֹלָ֗ה הִמְצִ֧יאוּ אֵלָ֛י/ו לִ/נְתָחֶ֖י/הָ וְ/אֶת הָ/רֹ֑אשׁ וַ/יַּקְטֵ֖ר עַל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/013.yaml
  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
translation:
  language: ml
  text: ഹോമയാഗത്തിന്റെ കഷണങ്ങളും തലയും അവർ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു; അവൻ അവയെ യാഗപീഠത്തിന്മേൽ പുകയായി അർപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പുകയായി അർപ്പിച്ചു” എന്ന എബ്രായ ക്രിയ യാഗപീഠത്തിന്മേൽ യാഗഭാഗങ്ങളെ പുകയായി ഉയർത്തുന്നവിധം അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; “ദഹിപ്പിച്ചു” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ עֹלָה എന്ന സമ്പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാള പദമാണ് ‘ഹോമയാഗം’.
- source_word: הִמְצִיאוּ אֵלָיו
  choice: അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: Hiphil രൂപം ഇവിടെ യാഗഭാഗങ്ങൾ അഹരോന്റെ അടുക്കൽ എത്തിച്ചുകൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം കർമക്രമം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לִנְתָחֶיהָ
  choice: കഷണംകഷണമായി
  rationale: נֶתַח അറുത്ത മൃഗത്തിന്റെ വേർതിരിച്ച ഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ലְ ഉപസർഗത്തിന്റെ വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: הָרֹאשׁ
  choice: തലയുംകൂടെ
  rationale: മറ്റു കഷണങ്ങളിൽനിന്ന് തല പ്രത്യേകം പരാമർശിക്കപ്പെടുന്നതു നിലനിർത്തുകയും, അതും കൊണ്ടുവന്നുവെന്ന ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּקְטֵר
  choice: ദഹിപ്പിച്ചു
  rationale: യാഗസന്ദർഭത്തിൽ קטר യാഗപീഠത്തിൽ പുകയായി ഉയരുന്നവിധം കത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ദഹിപ്പിച്ചു’ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളമാണ്.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ആരാധനാസന്ദർഭത്തിലെ സ്ഥിരവും വ്യക്തവുമായ മലയാള സമാനപദപ്രയോഗം.
theological_decisions:
- issue: וַיַּקְטֵר എന്ന യാഗക്രിയയുടെ അർഥവ്യാപ്തി
  choice: ദഹിപ്പിച്ചു
  alternative: പുകയായി അർപ്പിച്ചു
  rationale: പ്രധാനപാഠത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ദഹിപ്പിച്ചു’ സ്വീകരിച്ചെങ്കിലും, ഇത് സാധാരണ കത്തിക്കൽ മാത്രമല്ല, യാഗപീഠത്തിൽ പുകയായി ഉയർത്തുന്ന ആരാധനാക്രിയയാണെന്ന പ്രത്യേക അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു വാക്യക്രമത്തിലെ കഷണങ്ങളും തലയും ഒരുമിച്ച് അഹരോന്റെ അടുക്കൽ കൊണ്ടുവന്നുവെന്ന ആശയം വ്യക്തമായി നിലനിർത്തി. പ്രസിദ്ധീകരണ നിർദേശപ്രകാരം അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
