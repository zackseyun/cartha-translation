id: LEV.9.5
reference: Leviticus 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: ml
  text: അങ്ങനെ, മോശെ കൽപ്പിച്ചവ അവർ സമാഗമകൂടാരത്തിന്റെ മുൻവശത്തേക്ക് കൊണ്ടുവന്നു. സമൂഹം മുഴുവനും അടുത്തുവന്ന് യഹ്‌വെയുടെ സന്നിധിയിൽ നിന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: കൊണ്ടുവന്നു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം വ്യക്തമാകുന്നതിനാൽ മലയാളത്തിൽ ‘കൊണ്ടുവന്നു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: മോശ കല്പിച്ചവ
  rationale: മുൻവാക്യങ്ങളിൽ നിർദേശിച്ച വഴിപാടുസാമഗ്രികളെയാണ് ബന്ധവാക്യം സൂചിപ്പിക്കുന്നത്. ‘കല്പിച്ചവ’ അവയെ അനാവശ്യമായി വിശദീകരിക്കാതെ ബഹുവചന വസ്തുക്കളായി വ്യക്തമാക്കുന്നു.
- source_word: אֶל־פְּנֵי
  choice: മുമ്പിലേക്ക്
  rationale: ഇവിടെ പ്രയോഗം കൂടാരത്തിന്റെ മുൻവശത്തേക്കുള്ള സ്ഥലപരമായ നീക്കമാണ് സൂചിപ്പിക്കുന്നത്; പിന്നീടുള്ള לִפְנֵי יְהוָה എന്ന ദൈവസന്നിധി പ്രയോഗത്തിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവവും ഇസ്രായേൽ സമൂഹവും കൂടിവരുന്ന വിശുദ്ധ കൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും മൂലപദത്തിന്റെ ഘടനയോട് ചേർന്നതുമായ പ്രയോഗം.
- source_word: וַיִּקְרְבוּ
  choice: അടുത്തുവന്ന്
  rationale: קרב സൂചിപ്പിക്കുന്ന സമീപനചലനം ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל־הָעֵדָה
  choice: സമൂഹം മുഴുവനും
  rationale: עֵדָה ഇവിടെ ഇസ്രായേലിന്റെ ഒത്തുകൂടിയ സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സമൂഹം മുഴുവനും’ സമഗ്രതയും സമൂഹപരമായ അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּעַמְדוּ
  choice: നിന്നു
  rationale: עמד എന്ന ക്രിയയുടെ ലളിതമായ അർഥം നേരിട്ട് നൽകുന്നു; അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: പ്രയോഗത്തിന്റെ സ്ഥലപരവും ആരാധനാപരവുമായ അർഥങ്ങൾ ഒരുമിച്ച് പകർന്നു നൽകുന്നു; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ അനുക്രമ പ്രവർത്തനങ്ങൾ വ്യക്തമായി നിലനിർത്തുകയും ‘കൂടാരത്തിന്റെ മുമ്പിലേക്ക്’ എന്ന സ്ഥലപരമായ ആശയവും ‘യഹോവയുടെ സന്നിധിയിൽ’ എന്ന ദൈവസാന്നിധ്യ ആശയവും വേർതിരിക്കുകയും ചെയ്തു.
