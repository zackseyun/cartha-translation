- from: 'ഇസ്രായേൽമക്കളോട് നീ ഇങ്ങനെ പറയണം: ‘പാപയാഗത്തിനായി[a] ഒരു ആൺകോലാടിനെയും ഹോമയാഗത്തിനായി ഒരു വയസ്സു പ്രായമുള്ള, ഊനമില്ലാത്ത ഒരു കിടാവിനെയും ഒരു ചെമ്മരിയാട്ടിൻകുട്ടിയെയും എടുക്കുക.’'
  to: 'ഇസ്രായേൽമക്കളോടും നീ ഇങ്ങനെ പറയണം: ‘പാപയാഗത്തിനായി[a] ഒരു ആൺകോലാടിനെയും ഹോമയാഗത്തിനായി ഒരു കിടാവിനെയും ഒരു ചെമ്മരിയാട്ടിൻകുട്ടിയെയും എടുക്കുക; രണ്ടും ഒരു വയസ്സു പ്രായമുള്ളതും ഊനമില്ലാത്തതുമായിരിക്കണം.’'
  rationale: ‘ഇസ്രായേൽമക്കളോടും’ എന്നത് ഹീബ്രായ വാക്യബന്ധകം നിലനിർത്തുന്നു. ‘രണ്ടും ഒരു വയസ്സു പ്രായമുള്ളതും ഊനമില്ലാത്തതുമായിരിക്കണം’ എന്നത് കിടാവിനും ചെമ്മരിയാട്ടിൻകുട്ടിക്കും ഒരുപോലെ ബാധകമായ ബഹുവചന വിശേഷണം വ്യക്തമാക്കുന്നു; അർഥത്തിൽ മാറ്റമില്ല. അടിക്കുറിപ്പിന്റെ നങ്കൂരം ശരിയായ സ്ഥാനത്ത് തുടരുന്നു.
