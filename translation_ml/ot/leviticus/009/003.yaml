id: LEV.9.3
reference: Leviticus 9:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר קְח֤וּ שְׂעִיר עִזִּים֙ לְ/חַטָּ֔את וְ/עֵ֨גֶל וָ/כֶ֧בֶשׂ בְּנֵי שָׁנָ֛ה תְּמִימִ֖ם לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കളോടും നീ ഇങ്ങനെ പറയണം: ‘പാപയാഗത്തിനായി[a] ഒരു ആൺകോലാടിനെയും ഹോമയാഗത്തിനായി ഒരു കിടാവിനെയും ഒരു ചെമ്മരിയാട്ടിൻകുട്ടിയെയും എടുക്കുക; രണ്ടും ഒരു വയസ്സു പ്രായമുള്ളതും ഊനമില്ലാത്തതുമായിരിക്കണം.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ശുദ്ധീകരണയാഗത്തിനായി’; പുരോഹിതയാഗസന്ദർഭങ്ങളിൽ എബ്രായത്തിലെ חַטָּאת എന്ന പദത്തിന് ഈ അർഥവും നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോട്
  rationale: സംയോജകവും ദിശാസൂചകമായ മുൻപ്രത്യയവും നിർദേശത്തിന്റെ തുടർച്ചയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് വംശസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പരിചിതവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ പ്രയോഗമാണ്.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: നീ ഇങ്ങനെ പറയണം
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തിലെ നിർദേശഭാവവും തുടർന്ന് വരുന്ന നേരിട്ടുള്ള വാക്കുകളുടെ ആമുഖവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: קְחוּ
  choice: എടുക്കുക
  rationale: ജനത്തോടുള്ള ബഹുവചന ആജ്ഞയാണ്; ആധുനിക മാനക മലയാളത്തിൽ ‘എടുക്കുക’ സ്വാഭാവികമായ നിർദേശരൂപമാണ്. ‘കൊണ്ടുവരുക’ എന്നത് മൂലക്രിയയിൽ വ്യക്തമല്ലാത്ത ലക്ഷ്യസ്ഥാനഭാവം ചേർക്കും.
- source_word: שְׂעִיר עִזִּים
  choice: ഒരു ആൺകോലാട്
  rationale: കോലാടിന്റെ ആൺലിംഗം യാഗനിർദേശത്തിൽ പ്രസക്തമായതിനാൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിൽ പാപമെന്ന അമൂർത്ത ആശയത്തേക്കാൾ ഒരു പ്രത്യേക യാഗവിഭാഗത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. പരിചിതമായ മുഖ്യപാഠരൂപം ഉപയോഗിച്ച് ‘ശുദ്ധീകരണയാഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְעֵגֶל וָכֶבֶשׂ
  choice: ഒരു കിടാവിനെയും ഒരു ചെമ്മരിയാട്ടിൻകുട്ടിയെയും
  rationale: രണ്ടു മൃഗങ്ങളെയും വേർതിരിച്ച് കൃത്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי שָׁנָה
  choice: ഒരു വയസ്സു പ്രായമുള്ള
  rationale: ബഹുവചനത്തിലുള്ള മൂലപ്രയോഗം കിടാവിനും ചെമ്മരിയാട്ടിൻകുട്ടിക്കും ഒരുപോലെ ബാധകമാണ്; പങ്കിട്ട വിശേഷണമായി നൽകിയിരിക്കുന്നു.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്ത
  rationale: യാഗനിയമത്തിലെ ശാരീരിക ദോഷമില്ലായ്മയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗവിഭാഗത്തിനുള്ള മലയാള ബൈബിൾപരമ്പരയിലെ പരിചിതവും സംക്ഷിപ്തവുമായ പേര്.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ബന്ധസൂചക രൂപം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ ഇത് മുഴുവൻ ഉടമ്പടിസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക സമൂഹനാമമായി വായിക്കപ്പെടുന്നു.
- issue: യാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ അർഥം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഇവിടെ ഒരു പ്രത്യേക യാഗവിഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്. ‘പാപയാഗം’ വായനക്കാർക്ക് കൂടുതൽ പരിചിതമാണെങ്കിലും ശുദ്ധീകരണപ്രാധാന്യം ഉയർത്തിക്കാട്ടുന്ന പരിഭാഷയും ഭാഷാപരമായി സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി. പരമ്പരാഗത യാഗപദങ്ങളായ ‘പാപയാഗം’, ‘ഹോമയാഗം’ എന്നിവ സാധാരണ വായനാസൗകര്യത്തിനായി നിലനിർത്തി; അപരിചിതമായ സാങ്കേതിക ഭാഷ ഒഴിവാക്കി.
