    issue: וְאֶל-ലെ ബന്ധകം മുഖ്യപാഠത്തിൽ ഒഴിവായിരിക്കുന്നു.
    rationale: മുൻനിർദേശത്തോടുള്ള തുടർച്ച സൂചിപ്പിക്കുന്ന ‘and to’ മലയാളത്തിൽ ‘ഇസ്രായേൽമക്കളോടും’ എന്ന രൂപത്തിൽ പ്രകടമാക്കാം.
  - severity: medium
