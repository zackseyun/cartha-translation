reference: Leviticus 9:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַ/בָּשָׂ֖ר וְ/אֶת הָ/ע֑וֹר שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/011.yaml
  text: But the flesh and the hide he burned with fire outside the camp[a].
translation:
  language: ml
  text: എന്നാൽ മാംസവും തോലും അവൻ പാളയത്തിനു പുറത്തുവെച്ച് തീയിൽ ചുട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മാംസവും തൊലിയും അവൻ തീയിൽ ചുട്ടു; പാളയത്തിനു പുറത്ത്.”'
    reason: ബന്ധകത്തിന്റെയും ‘തോൽ/തൊലി,’ ‘തീയിൽ’ എന്നീ പദങ്ങളുടെയും സ്വാഭാവികമായ അക്ഷരാർഥപരമായ ബദൽ.
lexical_decisions:
- source_word: וְ/אֶת
  choice: എന്നാൽ
  rationale: വാവ് സാധാരണയായി തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും, മുൻവാക്യത്തിൽ യാഗപീഠത്തിൽ അർപ്പിച്ചതും ഇവിടെ പാളയത്തിനു പുറത്തു ദഹിപ്പിച്ചതും തമ്മിലുള്ള വ്യത്യാസം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; אֵת കർമചിഹ്നമായതിനാൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: הַ/בָּשָׂר
  choice: മാംസം
  rationale: בָּשָׂר എന്നത് മാംസം/ജഡം എന്നർഥം നൽകുന്നു; യാഗമൃഗത്തിന്റെ ഭൗതിക മാംസത്തെ സൂചിപ്പിക്കാൻ ആധുനിക മലയാളത്തിൽ ‘മാംസം’ വ്യക്തവും മാന്യവുമാണ്.
- source_word: הָ/עוֹר
  choice: തോൽ
  rationale: עוֹר മൃഗത്തിന്റെ skin/hide-നെ സൂചിപ്പിക്കുന്നു; യാഗമൃഗത്തിന്റെ പുറംചർമ്മത്തിന് സ്വാഭാവികമായ മലയാളപദം ‘തോൽ’ ആണ്.
- source_word: שָׂרַף
  choice: ചുട്ടുകളഞ്ഞു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ചുട്ടു’ എന്നാണ്; ഇവിടെ പാളയത്തിനു പുറത്തുള്ള ആചാരപരമായ നിർമാർജനം സൂചിപ്പിക്കുന്ന സാഹചര്യത്തിൽ ‘ചുട്ടുകളഞ്ഞു’ സ്വാഭാവികവും പ്രവൃത്തിയുടെ ഫലഭാവം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: בָּ/אֵשׁ
  choice: തീയിൽ
  rationale: בְּ + אֵשׁ എന്നത് തീയിൽ/തീകൊണ്ട് എന്നർഥം നൽകാം; ‘തീയിൽ ചുട്ടുകളഞ്ഞു’ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: מִ/חוּץ לַ/מַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തുവെച്ച്
  rationale: ഈ പ്രയോഗം ഇസ്രായേല്യരുടെ പാളയത്തിന്റെ അതിരുകൾക്കപ്പുറമുള്ള സ്ഥലം വ്യക്തമാക്കുന്നു; ‘പാളയത്തിനു പുറത്തുവെച്ച്’ പ്രവൃത്തി നടന്ന സ്ഥാനം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ ആചാരപരമായ നിർമാർജനഭാഷ
  choice: മാംസവും തോലും പാളയത്തിനു പുറത്തുവെച്ച് തീയിൽ ചുട്ട പ്രവൃത്തി മാത്രമായി മൂർത്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: പിന്നീടുള്ള ബൈബിൾബന്ധങ്ങളെയോ പ്രതിരൂപാർഥങ്ങളെയോ മുൻനിർത്തിയ വ്യാഖ്യാനപരമായ പരിഭാഷ.
  rationale: എബ്രായവാക്യം ഇവിടെ പുരോഹിതൻ നിർവഹിച്ച നടപടിയാണ് നേരിട്ട് വിവരിക്കുന്നത്; അതിനാൽ പാഠത്തിൽ ഇല്ലാത്ത പിൽക്കാല ദൈവശാസ്ത്രപ്രതീകങ്ങൾ പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. യാഗപരമായ കൃത്യതയ്ക്കായി ‘മാംസം’, ‘തോൽ’, ‘പാളയം’ എന്നീ നേരിട്ടുള്ള പദങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാപാരമ്പര്യഭാഷയും വ്യാഖ്യാനവിസ്താരവും ഒഴിവാക്കി.
