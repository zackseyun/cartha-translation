id: LEV.9.6
reference: Leviticus 9:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: ml
  text: 'മോശെ പറഞ്ഞു: “നിങ്ങൾ ചെയ്യണമെന്ന് യഹ്‌വേ കൽപിച്ച കാര്യം ഇതാണ്; യഹ്‌വേയുടെ മഹത്ത്വം നിങ്ങൾക്കു പ്രത്യക്ഷമാകും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേയുടെ മഹത്ത്വം നിങ്ങൾക്കു പ്രത്യക്ഷമാകേണ്ടതിന്.”
    reason: വְיֵרָא എന്ന അപൂർണക്രിയയെ കല്പനയുടെ ഫലമായോ തുടർന്നുള്ള വാഗ്ദാനമായോ വായിക്കാം; ലക്ഷ്യാർഥത്തിലുള്ള വായനയും സാധ്യമാണ്.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കഥാപ്രവാഹത്തിന് ‘പറഞ്ഞു’ മതിയാകുന്നു.
- source_word: זֶה הַדָּבָר
  choice: കാര്യം ഇതാണ്
  rationale: ‘ഈ കാര്യം/വചനം’ എന്ന ഏകവചനത്തിന്റെ മൂർത്തത നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ച
  rationale: ആധികാരികമായ കല്പന എന്ന അർഥം നിലനിർത്തുന്നു; എബ്രായ പൂർണക്രിയയുടെ മുൻകാലപ്രാബല്യവും സന്ദർഭത്തിൽ വ്യക്തമാകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: תַּעֲשׂוּ
  choice: നിങ്ങളോടു ചെയ്യാൻ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന അഭിസംബോധന വ്യക്തമാക്കുകയും ‘കല്പിച്ച കാര്യം’ എന്ന മലയാള വാക്യഘടനയോട് സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: וְיֵרָא
  choice: അപ്പോൾ ... പ്രത്യക്ഷമാകും
  rationale: കല്പിതപ്രവൃത്തിക്കു പിന്നാലെയുള്ള ഫലം/വാഗ്ദാനം വ്യക്തമാക്കുന്നു; ലക്ഷ്യാർഥത്തിലുള്ള വായനയും സാധ്യമാകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲלֵיכֶם
  choice: നിങ്ങൾക്കു
  rationale: പ്രത്യക്ഷത ലഭിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന אֶל എന്ന ഉപസർഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: כְּבוֹד יְהוָה
  choice: യഹോവയുടെ മഹത്ത്വം
  rationale: ദൈവിക മഹിമയും പ്രത്യക്ഷസാന്നിധ്യവും സൂചിപ്പിക്കുന്ന כָּבוֹד എന്ന പദത്തിന് ഗൗരവമുള്ളതും പൊതുവെ ഗ്രഹിക്കാവുന്നതുമായ തർജമ.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: וְיֵרָא എന്ന അന്തിമ ഉപവാക്യത്തിന്റെ ബന്ധം
  choice: 'ഫലം/തുടർന്നുള്ള വാഗ്ദാനം: ‘അപ്പോൾ ... പ്രത്യക്ഷമാകും’'
  alternative: 'ലക്ഷ്യം: ‘... പ്രത്യക്ഷമാകേണ്ടതിന്’'
  rationale: എബ്രായ ബന്ധകവും അപൂർണക്രിയയും കല്പനയ്ക്കു പിന്നാലെയുള്ള ഫലമായോ ലക്ഷ്യമായോ വായിക്കാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ഫലവായന സ്വീകരിച്ച് യഥാർഥമായ ലക്ഷ്യവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പുരാതനമോ വിഭാഗീയമോ ആയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി; ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
