  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: ml
  text: അഹരോന്റെ പുത്രന്മാർ രക്തം അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു[a]. അവൻ തന്റെ വിരൽ രക്തത്തിൽ മുക്കി, യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ[b] രക്തം പുരട്ടി; രക്തം യാഗപീഠത്തിന്റെ ചുവട്ടിലേക്ക് ഒഴിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ അടുക്കലേക്കു സമർപ്പിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായക്രിയയ്ക്ക് ആചാരപരമായ സന്ദർഭത്തിൽ ‘അടുത്തേക്ക് കൊണ്ടുവരുക, സമർപ്പിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: യാഗപീഠത്തിന്റെ മൂലകളിൽ കൊമ്പുപോലെ പുറത്തേക്ക് തള്ളിനിന്നിരുന്ന ഭാഗങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘യാഗപീഠത്തിന്റെ അടിസ്ഥാനത്തിലേക്ക്’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: അടുക്കൽ കൊണ്ടുവന്നു
  rationale: ഹിഫ്ഇൽ രൂപത്തിലുള്ള קרב എന്ന ക്രിയയുടെ ‘അടുത്തേക്ക് കൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന ആചാരപരമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർ
  rationale: കുടുംബബന്ധവും പുരോഹിതസഹായകരെന്ന സന്ദർഭവും നേരിട്ട് നിലനിർത്തുന്ന മാന്യമായ പ്രയോഗം.
- source_word: הַדָּם
  choice: രക്തം
  rationale: മുൻസന്ദർഭത്തിൽ പരാമർശിച്ച നിർദിഷ്ട യാഗരക്തമാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ പ്രത്യക്ഷ നിർദേശകപദം ചേർക്കാതെതന്നെ ഈ നിർദിഷ്ടത സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: אֵלָיו
  choice: അവന്റെ അടുക്കൽ
  rationale: എബ്രായത്തിലെ സർവനാമം നിലനിർത്തുന്നു; മുൻസന്ദർഭപ്രകാരം അത് അഹരോനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּטְבֹּל אֶצְבָּעוֹ
  choice: തന്റെ വിരൽ രക്തത്തിൽ മുക്കി
  rationale: טבל എന്നതിന്റെ ‘മുക്കുക’ എന്ന നേരിട്ടുള്ള അർഥവും ഏകവചനമായ ‘വിരൽ’ എന്ന രൂപവും സംരക്ഷിക്കുന്നു.
- source_word: וַיִּתֵּן עַל
  choice: രക്തം പുരട്ടി
  rationale: രക്തം യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ ആചാരപരമായി പ്രയോഗിക്കുന്ന പ്രവൃത്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘രക്തം’ എന്ന കർമം സന്ദർഭത്തിൽനിന്ന് ആവർത്തിച്ചിരിക്കുന്നു.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ കൊമ്പുകൾ
  rationale: യാഗപീഠത്തിന്റെ മൂലകളിൽ പുറത്തേക്ക് തള്ളിനിൽക്കുന്ന കൊമ്പുപോലുള്ള ഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ആചാരസാങ്കേതിക പദത്തിന്റെ രൂപകം നിലനിർത്തുന്നു.
- source_word: יָצַק
  choice: ഒഴിച്ചു
  rationale: ദ്രാവകം ഒഴിക്കുന്ന പ്രവൃത്തിക്ക് സ്വാഭാവികവും കൃത്യവുമായ മലയാളം.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ ചുവട്ടിലേക്ക്
  rationale: יְסוֹד എന്നതിന്റെ ‘അടിസ്ഥാനം/ചുവട്’ എന്ന അർഥം ഇവിടെ വ്യക്തമായി നൽകുന്നു; אֶל സൂചിപ്പിക്കുന്ന ദിശ ‘-ലേക്ക്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֵלָיו എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: രക്തം അഹരോന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  alternative: യാഗപീഠത്തിലേക്കോ സൂചിപ്പിക്കപ്പെടാത്ത മറ്റൊരാളിലേക്കോ കൊണ്ടുവന്നു
  rationale: മുൻസന്ദർഭത്തിൽ ആചാരം നിർവഹിക്കുന്നത് അഹരോനും അവനെ സഹായിക്കുന്നത് പുത്രന്മാരുമാകയാൽ അഹരോനാണ് ഏറ്റവും സ്വാഭാവികമായ മുൻസൂചിതൻ; എന്നാൽ മൂലപാഠത്തിലെ സർവനാമരൂപം വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
- issue: രക്തത്തിന്റെ ശേഷിപ്പിനെക്കുറിച്ചുള്ള സൂചന
  choice: ശേഷിച്ച രക്തം
  alternative: രക്തം
  rationale: וְאֶת הַדָּם എന്ന ആവർത്തനം, കുറെ രക്തം കൊമ്പുകളിൽ പുരട്ടിയശേഷമുള്ള രക്തത്തെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. ‘ശേഷിച്ച’ എന്നത് ഈ പ്രവർത്തനക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പുതിയ ദൈവശാസ്ത്രാർഥം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘യാഗപീഠം’, ‘കൊമ്പുകൾ’ തുടങ്ങിയ പരിചിത ബൈബിൾ പദങ്ങൾ സംരക്ഷിച്ചു; വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
