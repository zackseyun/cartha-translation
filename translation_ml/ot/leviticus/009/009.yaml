  source_fidelity: 'The principal sequence and ritual actions are accurately represented: Aaron’s sons bring the blood to him; Aaron dips his finger in it, applies it to the altar’s horns, and pours the blood at/to the altar’s base. However, ‘ശേഷിച്ച രക്തം’ (‘the remaining blood’) adds an explicit qualifier absent from the Hebrew, which simply repeats ‘the blood.’'
  naturalness: The Malayalam is clear, idiomatic, and suitably dignified for a ritual narrative. ‘യാഗപീഠം,’ ‘കൊമ്പുകൾ,’ ‘മുക്കി,’ and ‘പുരട്ടി’ are natural choices in modern standard Malayalam.
