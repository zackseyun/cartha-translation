reference: Leviticus 9:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֣ת הֶ/חָז֗וֹת וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: ml
  text: അഹരോൻ മാറിടഭാഗങ്ങളും വലത്തേ തുടയും യഹോവയുടെ സന്നിധിയിൽ നീരാജനയാഗമായി നീരാജനം ചെയ്തു; മോശ കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: മാറിടഭാഗങ്ങൾ
  rationale: യാഗസന്ദർഭത്തിൽ חָזֶה മൃഗത്തിന്റെ യാഗത്തിനായി വേർതിരിച്ച മാറിടഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ബഹുവചനം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ശരീരഭാഗവും യാഗവിഹിതവും വ്യക്തമായി മനസ്സിലാകുന്ന രൂപമാണിത്.
- source_word: שׁוֹק הַיָּמִין
  choice: വലത്തേ തുട
  rationale: שׁוֹק കാൽ/തുടഭാഗത്തെ സൂചിപ്പിക്കുന്നു; യാഗനിയമങ്ങളുടെ സന്ദർഭത്തിൽ 'തുട' സ്വാഭാവികവും ആവശ്യത്തിന് കൃത്യവുമാണ്. הַיָּמִין നേരിട്ട് 'വലത്തേ' എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הֵנִיף
  choice: നീരാജനം ചെയ്തു
  rationale: נוּף എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം പുരോഹിതയാഗസന്ദർഭത്തിൽ യഹോവയുടെ മുമ്പാകെയുള്ള ആചാരപരമായ ചലിപ്പിച്ചുള്ള സമർപ്പണത്തെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ-യാഗഭാഷയിൽ 'നീരാജനം ചെയ്തു' ഈ സാങ്കേതിക ക്രിയയെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: תְּנוּפָה
  choice: നീരാജനയാഗമായി
  rationale: תְּנוּפָה ആചാരപരമായി ചലിപ്പിച്ചു സമർപ്പിക്കുന്ന യാഗത്തിനുള്ള സാങ്കേതിക നാമമാണ്. 'നീരാജനയാഗം' ക്രിയയുമായുള്ള പദബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് 'മുമ്പാകെ/സന്നിധിയിൽ' എന്നർഥം നൽകുന്നു. യാഗാരാധനയുടെ സാന്നിധ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ 'സന്നിധിയിൽ' തിരഞ്ഞെടുത്തു; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: മോശ കല്പിച്ചതുപോലെതന്നെ
  rationale: മുമ്പ് നൽകിയ മോശയുടെ കല്പനയോട് അഹരോന്റെ പ്രവൃത്തി കൃത്യമായി പൊരുത്തപ്പെട്ടുവെന്ന ആശയം '-പോലെതന്നെ' സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאֵת ... וְאֵת
  choice: മാറിടഭാഗങ്ങളും വലത്തേ തുടയും
  rationale: ആവർത്തിച്ചുള്ള നേരിട്ടുള്ള കർമചിഹ്നം രണ്ടു കർമങ്ങളെ ഏകോപിപ്പിക്കുന്നു; മലയാളത്തിലെ '-ഉം ... -ഉം' ഘടന ഈ സമന്വയം സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉള്ളതിനാൽ ഒരു പൊതുപദവിയാൽ പകരാതെ മലയാളത്തിൽ പരിചിതമായ 'യഹോവ' എന്ന രൂപത്തിൽ വ്യക്തിനാമം നിലനിർത്തി.
- issue: תְּנוּפָה എന്ന യാഗസാങ്കേതിക പദം
  choice: നീരാജനയാഗം
  alternative: ചലിപ്പിച്ചുള്ള സമർപ്പണം
  rationale: മൂലത്തിലെ ആചാരപരമായ സാങ്കേതികത നിലനിർത്താൻ പരമ്പരാഗത യാഗപദം ഉപയോഗിച്ചു; പൊതുവായ 'സമർപ്പണം' എന്നു മാത്രം പറഞ്ഞ് പ്രത്യേക ആചാരത്തെ മായ്ച്ചുകളഞ്ഞില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള യാഗാരാധനാ ശൈലി. ക്രമവും ആവർത്തനവും കഴിയുന്നത്ര മൂലപാഠത്തോട് ചേർത്തുവെച്ചപ്പോൾ, മലയാളത്തിൽ സ്വാഭാവികമായ കർമസമന്വയവും വാക്യക്രമവും ഉപയോഗിച്ചു. സാങ്കേതികമായ 'നീരാജനയാഗം' എന്ന പദം സന്ദർഭത്തിന്റെ കൃത്യതയ്ക്കായി നിലനിർത്തി.
