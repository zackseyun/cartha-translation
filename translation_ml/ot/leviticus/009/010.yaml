base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: ml
  text: പാപപരിഹാരയാഗത്തിൽനിന്നുള്ള[a] കൊഴുപ്പും വൃക്കകളും കരളിന്റെ അനുബന്ധഭാഗവും അവൻ യാഗപീഠത്തിന്മേൽ പുകയായി ഉയർത്തി; യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുദ്ധീകരണയാഗം.” എബ്രായപദം പാപം കൈകാര്യം ചെയ്യുന്നതോടൊപ്പം അശുദ്ധി നീക്കുന്ന യാഗത്തിന്റെ പങ്കിനും ഊന്നൽ നൽകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗസന്ദർഭത്തിൽ അർപ്പിക്കാനായി വേർതിരിച്ച കൊഴുപ്പുള്ള ഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കൊഴുപ്പ്’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: כְּלָיֹת
  choice: വൃക്കകൾ
  rationale: ശരീരാവയവത്തെക്കുറിച്ചുള്ള വ്യക്തമായ പരാമർശം അതേ മൂർത്തതയോടെ നിലനിർത്തുന്നു.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: കരളിന്റെ അനുബന്ധഭാഗം
  rationale: കരളോടു ചേർന്ന പ്രത്യേക ഭാഗം/അനുബന്ധം എന്ന എബ്രായപ്രയോഗത്തിന്റെ അർഥം അനാവശ്യമായി കൃത്യവൽക്കരിക്കാതെ നൽകുന്നു.
- source_word: חַטָּאת
  choice: പാപപരിഹാരയാഗം
  rationale: പാപവുമായി ബന്ധപ്പെട്ട ഈ യാഗവിഭാഗത്തെ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ശുദ്ധീകരണപ്രവർത്തനത്തിന്റെ സാധ്യതയുള്ള ഊന്നൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: הִקְטִיר
  choice: പുകയായി ഉയർത്തി
  rationale: സാധാരണ ‘കത്തിച്ചു’ എന്നതിലുപരി, യാഗവസ്തു പുകയായി ഉയരാൻ ഇടയാക്കുക എന്ന ക്രിയയുടെ യാഗപരമായ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ക്രിയയോടു ചേർന്നപ്പോൾ മലയാളത്തിലെ സ്വാഭാവികമായ യാഗപ്രയോഗമാണിത്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: യാജകീയ യാഗനിയമത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപപരിഹാരയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ എബ്രായപദം പാപത്തെയും അശുദ്ധി നീക്കുന്നതിനെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ പരിചിതവും വ്യക്തവുമായ യാഗവിഭാഗനാമം നിലനിർത്തി, സാധുവായ മറ്റൊരു പ്രവർത്തനപരമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യാഗസാങ്കേതികത വ്യക്തമാക്കുമ്പോഴും മൂലപാഠത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
