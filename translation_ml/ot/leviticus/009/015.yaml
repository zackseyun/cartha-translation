  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת קָרְבַּ֣ן הָ/עָ֑ם וַ/יִּקַּ֞ח אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וַ/יִּשְׁחָטֵ֥/הוּ וַֽ/יְחַטְּאֵ֖/הוּ כָּ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: ml
  text: പിന്നെ അവൻ ജനങ്ങളുടെ വഴിപാട് കൊണ്ടുവന്നു. ജനങ്ങൾക്കുവേണ്ടിയുള്ള പാപയാഗത്തിന്റെ ആൺകോലാടിനെ എടുത്ത് അറുത്തു; ആദ്യത്തേതുപോലെ അതിനെ പാപയാഗമായി അർപ്പിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “അതുകൊണ്ട് പാപശുദ്ധീകരണച്ചടങ്ങ് നടത്തി.” എബ്രായ ക്രിയയ്ക്ക് പുരോഹിതാചാരസന്ദർഭങ്ങളിൽ ശുദ്ധീകരിക്കുക അഥവാ പാപമാലിന്യം നീക്കുക എന്ന ഭാവവും ഉണ്ടാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: അർപ്പിക്കാൻ കൊണ്ടുവന്നു
  rationale: ഹിഫ്ഇൽ രൂപത്തിലുള്ള קרב യാഗസന്ദർഭത്തിൽ വഴിപാട് അടുത്തുകൊണ്ടുവരുക/അർപ്പിക്കാൻ സമർപ്പിക്കുക എന്നർഥം വഹിക്കുന്നു. ഈ പ്രയോഗം പ്രവൃത്തിയെ മുഴുവൻ ‘അർപ്പിച്ചു’ എന്നു മാത്രം നിർവചിക്കാതെ ആചാരപരമായ സമർപ്പണം വ്യക്തമാക്കുന്നു.
- source_word: קָרְבַּן הָעָם
  choice: ജനത്തിന്റെ വഴിപാട്
  rationale: קָרְבָּן ഒരു പൊതുവായ യാഗാർപ്പണപദമാണ്. ‘ജനത്തിന്റെ വഴിപാട്’ എന്നത് നിർമാണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שְׂעִיר הַחַטָּאת
  choice: പാപയാഗത്തിന്റെ ആൺകോലാട്
  rationale: שָׂעִיר ആൺകോലാടിനെയും חַטָּאת ഇവിടെ പാപയാഗത്തെയും സൂചിപ്പിക്കുന്നു. യാഗമൃഗത്തിന്റെ ലിംഗവും ആചാരപരമായ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר לָעָם
  choice: ജനത്തിനുവേണ്ടിയുള്ള
  rationale: ל ഇവിടെ ഉടമസ്ഥതയേക്കാൾ ജനങ്ങളുടെ പേരിലുള്ളതോ അവർക്കുവേണ്ടി നിയോഗിച്ചതോ ആയ യാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁחָטֵהוּ
  choice: അതിനെ എടുത്ത് അറുത്തു
  rationale: שׁחט യാഗമൃഗത്തെ ആചാരപരമായി അറുക്കുന്നതിനുള്ള സാധാരണ ക്രിയയാണ്; ‘അറുത്തു’ മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וַיְחַטְּאֵהוּ
  choice: അതിനെ പാപയാഗമായി അർപ്പിച്ചു
  rationale: חטא എന്നതിന്റെ പിഇൽ രൂപം ഇവിടെ പാപയാഗച്ചടങ്ങ് നിർവഹിക്കുക എന്ന പ്രവർത്തനാർഥം വഹിക്കുന്നു. ‘അതിനെ ശുദ്ധീകരിച്ചു’ എന്നു പറഞ്ഞാൽ മൃഗത്തെയാണ് ശുദ്ധീകരിച്ചതെന്ന തെറ്റിദ്ധാരണ വരാം; തിരഞ്ഞെടുത്ത രൂപം ആചാരപരമായ പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു.
- source_word: כָּרִאשׁוֹן
  choice: ആദ്യത്തേതുപോലെ
  rationale: മുമ്പ് അർപ്പിച്ച പാപയാഗത്തെ സൂചിപ്പിക്കുകയും അതേ നടപടിക്രമം പിന്തുടർന്നതായി അറിയിക്കുകയും ചെയ്യുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ അർഥം
  choice: പാപയാഗം
  alternative: പാപം
  rationale: ലേവ്യപുസ്തകം 9-ലെ ആചാരപരമായ പശ്ചാത്തലത്തിൽ ഈ പദം അമൂർത്തമായ പാപത്തെയല്ല, യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: וַיְחַטְּאֵהוּ എന്ന ക്രിയയുടെ ആചാരപരമായ അർഥം
  choice: അതിനെ പാപയാഗമായി അർപ്പിച്ചു
  alternative: അതിനെ ശുദ്ധീകരിച്ചു / അതുകൊണ്ട് പാപപരിഹാരം ചെയ്തു
  rationale: എബ്രായക്രിയയ്ക്ക് ശുദ്ധീകരണം/പാപം നീക്കൽ എന്ന ആചാരപരമായ ഭാവം ഉണ്ടായേക്കാം. എന്നാൽ ഇവിടെ പ്രത്യക്ഷകർമം ആൺകോലാടായതിനാൽ ‘ശുദ്ധീകരിച്ചു’ തെറ്റിദ്ധാരണയുണ്ടാക്കാം; ‘പാപപരിഹാരം ചെയ്തു’ ക്രിയയിൽ നേരിട്ട് ഇല്ലാത്ത കൂടുതൽ പ്രത്യേകമായ ദൈവശാസ്ത്രപദം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. യാഗപരമായ സാങ്കേതികത നിലനിർത്താൻ ‘വഴിപാട്’, ‘പാപയാഗം’, ‘അറുത്തു’ എന്നീ സാധാരണ ബൈബിൾ-മലയാള പദങ്ങൾ ഉപയോഗിച്ചു; അപൂർവമായ സംസ്കൃതവൽക്കരണവും വിഭാഗീയ ദൈവശാസ്ത്രപദങ്ങളും ഒഴിവാക്കി.
