  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: ml
  text: സമാധാനയാഗങ്ങൾക്കായി ഒരു കാളയെയും ഒരു ആൺചെമ്മരിയാടിനെയും യഹ്‌വേയുടെ സന്നിധിയിൽ യാഗമർപ്പിക്കാൻ,[a] എണ്ണ ചേർത്ത ധാന്യയാഗവും കൊണ്ടുവരുവിൻ; എന്തെന്നാൽ, ഇന്ന് യഹ്‌വേ[b] നിങ്ങൾക്കു പ്രത്യക്ഷനാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമാധാനയാഗങ്ങൾ’ എന്നതിന് ‘കൂട്ടായ്മയാഗങ്ങൾ’ അല്ലെങ്കിൽ ‘ക്ഷേമയാഗങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ യഹ്‌വേ (YHWH) എന്ന ദൈവനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: കാള
  rationale: പശുവർഗത്തിൽപ്പെട്ട യാഗമൃഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം; എബ്രായരൂപം ലിംഗം നിർബന്ധമായി വ്യക്തമാക്കാത്തതിനാൽ കൂടുതൽ പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു.
- source_word: אַיִל
  choice: ആൺചെമ്മരിയാട്
  rationale: ആൺചെമ്മരിയാടിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പ്രയോഗം.
- source_word: שְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: സൗഖ്യം, കൂട്ടായ്മ, സമാധാനം എന്നീ ആശയവ്യാപ്തിയുള്ള യാഗപദത്തിന്റെ പരിചിതമായ മലയാള പരിഭാഷ; പദത്തിന്റെ മുഴുവൻ വ്യാപ്തി ഒരൊറ്റ മലയാളപദത്തിൽ ഒതുങ്ങാത്തതിനാൽ പാഠത്തിൽ പരമ്പരാഗത രൂപം നിലനിർത്തുന്നു.
- source_word: לִזְבֹּחַ
  choice: അർപ്പിക്കാനുള്ള
  rationale: യാഗമായി അറുക്കുകയും അർപ്പിക്കുകയും ചെയ്യുന്ന ആചാരപരമായ പ്രവൃത്തിയെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: കർത്താവിന്റെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദൈവനാമം മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ‘കർത്താവ്’ എന്നു രേഖപ്പെടുത്തുന്നു.
- source_word: מִנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ ധാന്യത്തിൽനിന്നുള്ള യാഗത്തെ പൊതുവായ ‘വഴിപാട്’ എന്നതിനെക്കാൾ കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: എണ്ണയുമായി കലർത്തിയ തയ്യാറെടുപ്പിനെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: כִּי הַיּוֹם
  choice: എന്തെന്നാൽ, ഇന്നു
  rationale: കല്പനയ്ക്കുള്ള കാരണവും ‘ഇന്ന്’ എന്ന സമയഊന്നലും നിലനിർത്തുന്നു.
- source_word: נִרְאָה אֲלֵיכֶם
  choice: നിങ്ങൾക്കു പ്രത്യക്ഷനാകും
  rationale: രൂപപരമായി പൂർത്തകാലമായ ക്രിയ സന്ദർഭത്തിൽ ഉടൻ സംഭവിക്കാനിരിക്കുന്ന ദൈവിക പ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്നതിനാൽ ഭാവികാലത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യഹ്‌വേ
  rationale: മലയാളത്തിലെ മാന്യവും വ്യാപകമായി ഗ്രഹിക്കപ്പെടുന്നതുമായ ദൈവനാമപ്രയോഗം മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുന്നു; എബ്രായത്തിൽ പ്രത്യേക നാമമായ YHWH ആണെന്ന വിവരം അടിക്കുറിപ്പിൽ തുറന്നുപറഞ്ഞ് ഉറവിടസാക്ഷ്യം സംരക്ഷിക്കുന്നു.
- issue: ദൈവിക പ്രത്യക്ഷതയുടെ പ്രസ്താവന
  choice: കർത്താവ് നിങ്ങൾക്കു പ്രത്യക്ഷനാകും
  alternative: കർത്താവിന്റെ മഹത്ത്വം നിങ്ങൾക്കു പ്രത്യക്ഷമാകും
  rationale: ഈ വാക്യത്തിൽ ‘കർത്താവിന്റെ മഹത്ത്വം’ എന്നല്ല, യഹ്‌വേ തന്നെയാണ് കർത്താവായി രേഖപ്പെടുത്തിയിരിക്കുന്നത്; അടുത്ത വാക്യത്തിലെ ഭാഷ ഇവിടെ ചേർക്കുന്നില്ല. സന്ദർഭം പ്രതീക്ഷിക്കപ്പെടുന്ന സംഭവമായതിനാൽ ഭാവികാലം സ്വീകരിക്കുന്നു.
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ ആശയവ്യാപ്തി
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ / ക്ഷേമയാഗങ്ങൾ
  rationale: പരിചിതമായ ആചാരപദം നിലനിർത്തുമ്പോഴും മറ്റുള്ള സാധുവായ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം. യാഗസാങ്കേതിക പദങ്ങൾ വ്യക്തമായി സൂക്ഷിക്കുകയും എബ്രായത്തിലെ കാരണബന്ധവും സമയഊന്നലും നിലനിർത്തുകയും ചെയ്തു.
