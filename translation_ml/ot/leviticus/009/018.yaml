  text: וַ/יִּשְׁחַ֤ט אֶת הַ/שּׁוֹר֙ וְ/אֶת הָ/אַ֔יִל זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לָ/עָ֑ם וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֶת הַ/דָּם֙ אֵלָ֔י/ו וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: ml
  text: പിന്നെ അവൻ ജനത്തിനുവേണ്ടിയുള്ള സമാധാനയാഗമായി കാളയെയും ആട്ടുകൊറ്റനെയും[a] അറുത്തു. അഹരോന്റെ പുത്രന്മാർ രക്തം അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു; അവൻ അത് യാഗപീഠത്തിന്റെ എല്ലാ വശങ്ങളിലും തളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൂട്ടായ്മയാഗം” അല്ലെങ്കിൽ “ക്ഷേമയാഗം.” എബ്രായത്തിലെ שְׁלָמִים എന്ന പദത്തിന് സമാധാനം, സമഗ്രക്ഷേമം, കൂട്ടായ്മ എന്നീ അർത്ഥബന്ധങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: പിന്നെ അവൻ ... അറുത്തു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ ‘പിന്നെ’ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ബലിയർപ്പണസന്ദർഭത്തിൽ ‘അറുത്തു’ എന്നത് പൊതുവായ ‘കൊന്നു’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: הַשּׁוֹר
  choice: കാള
  rationale: שׁוֹר എന്നത് ഗോവർഗമൃഗത്തെ സൂചിപ്പിക്കുന്നു; ഈ ബലിയർപ്പണസന്ദർഭത്തിൽ ‘കാള’ സ്വാഭാവികവും ചുരുക്കവുമായ മലയാളരൂപമാണ്.
- source_word: הָאַיִל
  choice: ആട്ടുകൊറ്റൻ
  rationale: אַיִל ആൺചെമ്മരിയാടിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ‘ആട്ടുകൊറ്റൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദമാണ്.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗം
  rationale: ശാന്തി, സമഗ്രക്ഷേമം, കൂട്ടായ്മ എന്നീ അർത്ഥബന്ധങ്ങളുള്ള שְׁלָמִים എന്ന പദത്തിന്റെ പരമ്പരാഗത ശാലോം-ബന്ധം ‘സമാധാനയാഗം’ നിലനിർത്തുന്നു; മറ്റു സാധുവായ അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֲשֶׁר לָעָם
  choice: ജനത്തിനുവേണ്ടിയുള്ള
  rationale: യാഗം ജനത്തിന്റെ പേരിലും അവർക്കുവേണ്ടിയും അർപ്പിക്കപ്പെട്ടതാണെന്ന് സന്ദർഭാനുസൃതമായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּמְצִאוּ ... אֵלָיו
  choice: അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: ആചാരനടപടിയിൽ പുരോഹിതന്റെ അടുക്കൽ രക്തം എത്തിച്ചുകൊടുക്കുന്നതാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; എബ്രായത്തിലെ സർവനാമം നിലനിർത്തുന്നു.
- source_word: וַיִּזְרְקֵהוּ
  choice: അത് ... തളിച്ചു
  rationale: זָרַק ബലിരക്തം യാഗപീഠത്തിലേക്ക് എറിഞ്ഞു വീഴ്ത്തുന്ന പ്രയോഗമാണ്; മലയാള ബലിയർപ്പണഭാഷയിൽ ‘തളിച്ചു’ സ്വാഭാവികമാണെങ്കിലും ഇത് നേർത്ത തുള്ളിവിതരണം മാത്രമായി മനസ്സിലാക്കരുത്.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: യാഗപീഠത്തിന്മേൽ ചുറ്റും
  rationale: עַל എന്നതിന്റെ ഉപരിതല/ദിശാസൂചനയും סָבִיב എന്നതിന്റെ ചുറ്റുമുള്ള വിതരണവും വാക്കിനോട് അടുത്തുനിന്ന് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗനാമത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: ഒറ്റ മലയാളപദം എബ്രായപദത്തിലെ സമാധാനം, സമഗ്രക്ഷേമം, ദൈവസന്നിധിയിലെ പങ്കാളിത്തം എന്നീ എല്ലാ ഭാവങ്ങളും പൂർണമായി ഉൾക്കൊള്ളുന്നില്ല. മുഖ്യവാചകത്തിൽ പരമ്പരാഗത ബന്ധം നിലനിർത്തുകയും അടിക്കുറിപ്പിൽ യഥാർത്ഥ അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ബലിയർപ്പണശൈലി. ‘യാഗപീഠം,’ ‘അറുത്തു,’ ‘തളിച്ചു’ എന്നീ പരിചിതമായ ആചാരപദങ്ങൾ ഉപയോഗിച്ചു; സാങ്കേതിക അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
