  source_fidelity: The verse accurately retains the narrative sequence, the ox and ram, the people-directed peace offering, Aaron’s sons’ presentation of the blood, and Aaron’s blood rite. The final locative phrase is better rendered so that the blood is applied around the altar rather than potentially suggesting a general sprinkling on its top surface.
