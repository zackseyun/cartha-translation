    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവൻ കൊഴുപ്പിന്റെ ഭാഗങ്ങൾ യാഗപീഠത്തിന്മേൽ പുകയായി ഉയർത്തി.”'
    reason: lexical_alternative
