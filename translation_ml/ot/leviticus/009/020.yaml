    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: അവർ വെച്ചു
  rationale: שׂים എന്ന സാധാരണ ക്രിയയുടെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥം ആചാരപരമായ പ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַחֲלָבִים
  choice: കൊഴുപ്പിന്റെ ഭാഗങ്ങൾ
  rationale: യാഗസന്ദർഭത്തിൽ חֵלֶב എന്ന പദത്തിന്റെ ബഹുവചനം അർപ്പിക്കാനായി വേർതിരിച്ച കൊഴുപ്പുള്ള ഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ബഹുവചനത്തിന്റെ മൂർത്തത നിലനിർത്തുന്നു.
- source_word: עַל הֶחָזוֹת
  choice: നെഞ്ചിന്റെ ഭാഗങ്ങളുടെമേൽ
  rationale: യാഗനിയമങ്ങളിൽ חָזֶה മൃഗത്തിന്റെ നെഞ്ചുഭാഗം എന്ന പ്രത്യേക വിഹിതത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ശരീരഭാഗവും യാഗവിഹിതവും വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: וַיַּקְטֵר
  choice: അവൻ ദഹിപ്പിച്ചു
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിൽ קטר യാഗപീഠത്തിന്മേൽ കത്തിച്ച് പുകയാക്കുന്ന പ്രവൃത്തിയാണ്; ‘ദഹിപ്പിച്ചു’ ആചാരപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു, കൂടുതൽ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: കത്തിക്കൽ നടന്ന സ്ഥലം സൂചിപ്പിക്കുന്ന എബ്രായ ദിശാസൂചക രൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ സ്ഥാനപ്രയോഗമായി അവതരിപ്പിക്കുന്നു.
