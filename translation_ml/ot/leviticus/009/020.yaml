  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആചാരപരമായ ശൈലി. ‘കൊഴുപ്പിന്റെ ഭാഗങ്ങൾ’ എന്ന പ്രയോഗം മൂലത്തിലെ ബഹുവചനം കാത്തുസൂക്ഷിക്കുന്നു; ‘നെഞ്ചിന്റെ ഭാഗങ്ങൾ’ യാഗമൃഗത്തിന്റെ നിർദിഷ്ട വിഹിതമാണെന്ന് വ്യക്തമാക്കുന്നു.
