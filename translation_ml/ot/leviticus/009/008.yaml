id: LEV.9.8
reference: Leviticus 9:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרַ֥ב אַהֲרֹ֖ן אֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁחַ֛ט אֶת עֵ֥גֶל הַ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: ml
  text: അപ്പോൾ അഹരോൻ യാഗപീഠത്തിനരികെ ചെന്ന് തനിക്കുവേണ്ടിയുള്ള പാപയാഗത്തിന്റെ കാളക്കുട്ടിയെ അറുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശുദ്ധീകരണയാഗത്തിന്റെ കാളക്കുട്ടി.’ ഹീബ്രു പദം പാപവും അശുദ്ധിയും നീക്കുന്നതുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: അരികെ ചെന്ന്
  rationale: קרב യാഗപീഠത്തോടുള്ള വ്യക്തമായ സമീപനത്തെ സൂചിപ്പിക്കുന്നു. ‘അരികെ ചെന്ന്’ എന്നത് ചലനവും ആരാധനാക്രമത്തിന്റെ പശ്ചാത്തലവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പണസന്ദർഭത്തിലെ מזבח എന്ന പദത്തിന്റെ പ്രചാരമുള്ളതും വ്യക്തവുമായ മലയാള പരിഭാഷ.
- source_word: וַיִּשְׁחַט
  choice: അറുത്തു
  rationale: שחט ഇവിടെ യാഗമൃഗത്തെ ആചാരപരമായി അറുക്കുന്നതാണ്; പൊതുവായ ‘കൊന്നു’ എന്നതിനെക്കാൾ ‘അറുത്തു’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: עֵגֶל
  choice: കാളക്കുട്ടി
  rationale: עגל ഒരു ഇളം ഗോവിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ യാഗമൃഗത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി തിരിച്ചറിയിക്കുന്ന പദമാണ് ‘കാളക്കുട്ടി’.
- source_word: הַחַטָּאת
  choice: പാപയാഗം
  rationale: പുരോഹിതീയ യാഗനിയമങ്ങളിൽ חטאת യാഗവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പാപയാഗം’ സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ പരിഭാഷയാണ്; ശുദ്ധീകരണപരമായ അർഥസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לוֹ
  choice: തനിക്കുവേണ്ടിയുള്ള
  rationale: ചുറ്റുപാടിലുള്ള ജനത്തിനുവേണ്ടിയുള്ള യാഗങ്ങളിൽനിന്ന് ഇതിനെ വേർതിരിച്ച്, ഇത് അഹരോനുവേണ്ടിയുള്ള യാഗമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതീയ യാഗസന്ദർഭത്തിൽ חטאת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഹീബ്രു പദം ഇവിടെ ഒരു യാഗവിഭാഗത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. ‘പാപയാഗം’ പ്രധാനപാഠത്തിൽ പരിചിതവും വ്യക്തവുമാണ്; എന്നാൽ പാപവും അശുദ്ധിയും നീക്കുന്നതുമായി ബന്ധപ്പെട്ട യാഗത്തിന്റെ ശുദ്ധീകരണധർമ്മം നഷ്ടപ്പെടാതിരിക്കാൻ ‘ശുദ്ധീകരണയാഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യാഗപരമായ സാങ്കേതികത നിലനിർത്തിക്കൊണ്ട് വാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി രൂപപ്പെടുത്തി.
