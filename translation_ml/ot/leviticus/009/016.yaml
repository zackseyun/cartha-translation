id: LEV.9.16
reference: Leviticus 9:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּקְרֵ֖ב אֶת הָ/עֹלָ֑ה וַֽ/יַּעֲשֶׂ֖/הָ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/016.yaml
  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: ml
  text: പിന്നെ അവൻ ഹോമയാഗം കൊണ്ടുവന്ന്, നിശ്ചിതക്രമപ്രകാരം[a] അതു നിർവഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിശ്ചിത നിയമപ്രകാരം”.
    reason: מִשְׁפָּט ഇവിടെ യാഗത്തിനായി നിശ്ചയിച്ച ക്രമത്തെയോ നിയമത്തെയോ സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠം നടപടിക്രമപരമായ ഭാവവും അടിക്കുറിപ്പ് നിയമപരമായ ഭാവവും നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: കൊണ്ടുവന്ന്
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫ്ഈൽ രൂപം ‘അടുത്തേക്കു കൊണ്ടുവരുക/സമർപ്പണത്തിനായി കൊണ്ടുവരുക’ എന്നാണ്. യാഗസന്ദർഭത്തിൽ ‘കൊണ്ടുവന്ന്’ എന്നത് അടുത്ത ക്രിയയുമായി അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ലേവ്യപദമാണ്; മലയാള ബൈബിൾ ഭാഷയിൽ ‘ഹോമയാഗം’ കൃത്യവും പരിചിതവുമാണ്.
- source_word: וַיַּעֲשֶׂהָ
  choice: അതു നിർവഹിച്ചു
  rationale: עשה എന്നത് അടിസ്ഥാനമായി ‘ചെയ്യുക/നിർവഹിക്കുക’ എന്ന വിശാലാർഥമുള്ള ക്രിയയാണ്. ഇവിടെ നിർദേശിക്കപ്പെട്ട യാഗക്രമം നടപ്പാക്കിയതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിർവഹിച്ചു’ സ്വാഭാവികമാണ്; ‘അർപ്പിച്ചു’ എന്നു വിവർത്തനം ചെയ്താൽ മൂലക്രിയയെക്കാൾ സാങ്കേതികമായി അർഥം ചുരുങ്ങാം.
- source_word: כַּמִּשְׁפָּט
  choice: വിധിപ്രകാരം
  rationale: מִשְׁפָּט ഇവിടെ യാഗത്തിനുള്ള നിശ്ചിത നിയമമോ ക്രമമോ സൂചിപ്പിക്കുന്നു. ‘വിധിപ്രകാരം’ അതിന്റെ നിയമപരവും ആചാരക്രമപരവുമായ ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന സംക്ഷിപ്ത ശൈലി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
