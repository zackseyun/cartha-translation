  verdict: revise
  source_fidelity: 'The sequence is retained: he brought/presented the burnt offering and then carried out the rite. ‘ഹോമയാഗം’ accurately renders עֹלָה, and ‘നിർവഹിച്ചു’ appropriately reflects the broad sacrificial-context sense of וַיַּעֲשֶׂהָ.'
