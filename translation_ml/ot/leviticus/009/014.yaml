translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാഗപരിഭാഷ. എബ്രായ വാക്യക്രമത്തിലെ യാഗപീഠവും ദഹനയാഗവും തമ്മിലുള്ള സ്ഥാനബന്ധം വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതായി തോന്നുന്നതിനാൽ അടിസ്ഥാനപാഠത്തിൽ അനാവശ്യ അടിക്കുറിപ്പുമാർക്കർ ചേർത്തിട്ടില്ല.
