reference: Leviticus 9:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְחַ֥ץ אֶת הַ/קֶּ֖רֶב וְ/אֶת הַ/כְּרָעָ֑יִם וַ/יַּקְטֵ֥ר עַל הָ/עֹלָ֖ה הַ/מִּזְבֵּֽחָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/014.yaml
  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: ml
  text: അവൻ ആന്തരാവയവങ്ങളും താഴത്തെ കാലുകളും കഴുകി; അവയെ യാഗപീഠത്തിന്മേലുള്ള ദഹനയാഗത്തിന്മീതെ പുകയായി അർപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: കഴുകി
  rationale: רחץ യാഗസന്ദർഭത്തിൽ വെള്ളംകൊണ്ടു കഴുകുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കഴുകി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַקֶּרֶב
  choice: ആന്തരാവയവങ്ങൾ
  rationale: കുർബാനാസന്ദർഭത്തിലെ קֶרֶב മൃഗത്തിന്റെ ഉള്ളിലുള്ള അവയവങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘ആന്തരാവയവങ്ങൾ’ കൃത്യവും മാന്യവുമാണ്.
- source_word: הַכְּרָעָיִם
  choice: കീഴ്‌ക്കാലുകൾ
  rationale: כְּרָעַיִם മൃഗത്തിന്റെ കാലുകളുടെ താഴത്തെ ഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; വിശാലമായ ‘കാലുകൾ’ എന്നതിനേക്കാൾ ശരീരഘടനാപരമായ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: וַיַּקְטֵר
  choice: യാഗധൂമമായി ഉയർത്തി
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള קטר യാഗപീഠത്തിൽ വസ്തു പുകയായി ഉയരുന്ന വിധം അർപ്പിക്കുന്ന സാങ്കേതിക യാഗപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; വെറും ‘കത്തിച്ചു’ എന്നതിനെക്കാൾ ഈ ആചാരപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: עַל הָעֹלָה
  choice: ദഹനയാഗത്തിന്റെ മുകളിൽ
  rationale: עַל ഇവിടെ യാഗപീഠത്തിൽ നേരത്തേയുള്ള ദഹനയാഗത്തിനുമീതെയുള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: מִזְבֵּחַ എന്നതിന് സാധാരണ മലയാള യാഗപരിഭാഷയായ ‘യാഗപീഠം’ ഉപയോഗിച്ചു; ദിശാസൂചക അന്ത്യപ്രത്യയം സന്ദർഭത്തിൽ ‘-ത്തിന്മേൽ’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
