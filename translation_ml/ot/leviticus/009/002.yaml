revisions:
- from: 'അവൻ അഹരോനോടു പറഞ്ഞു: “നിനക്കുവേണ്ടി പാപയാഗമായി ഒരു കാളക്കിടാവിനെയും ഹോമയാഗമായി ഒരു ആട്ടുകൊറ്റനെയും എടുക്കുക. രണ്ടും ഊനമില്ലാത്തവയായിരിക്കണം. അവയെ യഹോവയുടെ സന്നിധിയിൽ കൊണ്ടുവരുക.”'
  to: 'അവൻ അഹരോനോടു പറഞ്ഞു: “നിനക്കുവേണ്ടി പാപയാഗമായി ഒരു കാളക്കിടാവിനെയും ഹോമയാഗമായി ഒരു ആട്ടുകൊറ്റനെയും എടുക്കുക; രണ്ടും ഊനമില്ലാത്തവയായിരിക്കണം എന്നു ശ്രദ്ധിക്കുക. അവയെ യഹോവയുടെ സന്നിധിയിൽ കൊണ്ടുവരുക.”'
  rationale: The revision keeps the original lexical choices but clarifies that the two animals are to be without blemish. The wording preserves the source’s sacrificial specification and avoids treating ‘present’ as completion of the subsequent sacrificial rites.
