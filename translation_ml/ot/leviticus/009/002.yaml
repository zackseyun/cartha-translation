id: LEV.9.2
reference: Leviticus 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶֽל אַהֲרֹ֗ן קַח לְ֠/ךָ עֵ֣גֶל בֶּן בָּקָ֧ר לְ/חַטָּ֛את וְ/אַ֥יִל לְ/עֹלָ֖ה תְּמִימִ֑ם וְ/הַקְרֵ֖ב לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: ml
  text: 'അവൻ അഹരോനോടു പറഞ്ഞു: “നിനക്കുവേണ്ടി പാപയാഗമായി ഒരു കാളക്കിടാവിനെയും ഹോമയാഗമായി ഒരു ആട്ടുകൊറ്റനെയും എടുക്കുക; രണ്ടും ഊനമില്ലാത്തവയായിരിക്കണം എന്നു ശ്രദ്ധിക്കുക. അവയെ യഹോവയുടെ സന്നിധിയിൽ കൊണ്ടുവരുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אַהֲרֹן
  choice: അവൻ അഹരോനോടു പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനശൈലിയിലെ തുടർച്ച സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; കർത്താവ് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ടതാണ്.
- source_word: קַח לְךָ
  choice: നിനക്കുവേണ്ടി ... എടുക്കുക
  rationale: לְךָ നൽകുന്ന വ്യക്തിപരമായ സൂക്ഷ്മാർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി ആജ്ഞ അവതരിപ്പിക്കുന്നു.
- source_word: עֵגֶל בֶּן בָּקָר
  choice: ഒരു കാളക്കിടാവ്
  rationale: അക്ഷരാർഥത്തിൽ ‘കന്നുകാലിക്കൂട്ടത്തിൽപ്പെട്ട ഒരു കിടാവ്’ എന്ന യുവ ഗോവർഗമൃഗത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ‘കാളക്കിടാവ്’ മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: לְחַטָּאת
  choice: പാപയാഗമായി
  rationale: യാഗസന്ദർഭത്തിൽ חַטָּאת അമൂർത്തമായ പാപത്തെയല്ല, പാപപരിഹാരത്തിനുള്ള യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְאַיִל לְעֹלָה
  choice: ഹോമയാഗമായി ഒരു ആട്ടുകൊറ്റൻ
  rationale: אַיִל എന്നത് ആൺചെമ്മരിയാടിനെയും עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെയും സൂചിപ്പിക്കുന്ന സാങ്കേതിക യാഗപദങ്ങളാണ്.
- source_word: תְּמִימִם
  choice: രണ്ടും ഊനമില്ലാത്തവയായിരിക്കണം
  rationale: ബഹുവചന വിശേഷണം രണ്ടു മൃഗങ്ങളെയും വിശേഷിപ്പിക്കുന്നുവെന്നത് മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: וְהַקְרֵב
  choice: അവയെ ... കൊണ്ടുവരുക
  rationale: קרב എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘അടുത്തേക്കു കൊണ്ടുവരുക/സന്നിധിയിൽ ഹാജരാക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; യാഗനടപടി പൂർത്തിയായെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന ആരാധനാപരമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദിവ്യനാമം നേരിട്ട് ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നേരിട്ട് നൽകുന്നു.
- issue: חַטָּאת എന്ന യാഗപദത്തിന്റെ അർഥം
  choice: പാപയാഗം
  alternative: പാപം / പാപപരിഹാരയാഗം
  rationale: ഈ യാഗസന്ദർഭത്തിൽ പദം യാഗവസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പാപയാഗം’ സാങ്കേതിക അർഥം നിലനിർത്തുന്നു; ‘പാപപരിഹാരയാഗം’ എന്നു നൽകുന്നത് പദത്തിൽ നേരിട്ട് പ്രകടമല്ലാത്ത വ്യാഖ്യാനം ചേർക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യാഗസംബന്ധമായ അംഗീകൃത പദങ്ങളായ ‘പാപയാഗം’, ‘ഹോമയാഗം’, ‘ഊനമില്ലാത്ത’ എന്നിവ ഉപയോഗിച്ചു; ഹീബ്രായ പ്രയോഗത്തിന്റെ അനാവശ്യമായ അക്ഷരാനുകരണം ഒഴിവാക്കി.
