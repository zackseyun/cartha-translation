  source_fidelity: 'ഹീബ്രു വാക്യത്തിലെ ക്രമവും ആശയവും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു: അഹരോൻ ജനത്തിന്റെ നേരെ കൈകൾ ഉയർത്തി അനുഗ്രഹിക്കുന്നു; തുടർന്ന് പാപയാഗം, ഹോമയാഗം, സമാധാനയാഗങ്ങൾ എന്നിവ അർപ്പിച്ചശേഷം ഇറങ്ങുന്നു. יָדוֹയുടെ ഏകവചനരൂപം മുഖ്യപാഠത്തിലെ സ്വാഭാവിക ബഹുവചനപ്രയോഗത്തോടൊപ്പം അടിക്കുറിപ്പിൽ സുതാര്യമായി സംരക്ഷിച്ചിട്ടുണ്ട്.'
