  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַהֲרֹ֧ן אֶת יד/ו אֶל הָ/עָ֖ם וַֽ/יְבָרְכֵ֑/ם וַ/יֵּ֗רֶד מֵ/עֲשֹׂ֧ת הַֽ/חַטָּ֛את וְ/הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: ml
  text: പിന്നെ അഹരോൻ ജനത്തിന്റെ നേരെ തന്റെ കൈകൾ ഉയർത്തി അവരെ അനുഗ്രഹിച്ചു.[a] പാപയാഗവും[b] ഹോമയാഗവും സമാധാനയാഗങ്ങളും[c] അർപ്പിച്ചശേഷം അവൻ താഴേക്കിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ കൈ”; ഹീബ്രു രൂപം ഏകവചനമാണ്. എന്നാൽ അനുഗ്രഹിക്കുമ്പോഴുള്ള ആംഗ്യം സാധാരണയായി രണ്ടു കൈകളും ഉയർത്തുന്നതായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “പാപയാഗം” എന്നതിന് “ശുദ്ധീകരണയാഗം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “സമാധാനയാഗങ്ങൾ” എന്നതിന് “കൂട്ടായ്മയാഗങ്ങൾ” എന്നോ “ക്ഷേമയാഗങ്ങൾ” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: ഉയർത്തി
  rationale: נשׂא എന്ന ക്രിയ കൈയോടൊപ്പം വരുമ്പോൾ ‘ഉയർത്തുക’ എന്നാണ്; അനുഗ്രഹിക്കുന്നതിന് മുമ്പുള്ള ശാരീരിക ആംഗ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יָדוֹ
  choice: തന്റെ കൈകൾ
  rationale: മസോരറ്റിക് രൂപം ഏകവചനമാണെങ്കിലും, അനുഗ്രഹത്തിനായി കൈ ഉയർത്തുന്ന പ്രയോഗം കൂട്ടായ അർഥത്തിൽ ഗ്രഹിക്കപ്പെടാം. സ്വാഭാവിക മലയാളത്തിൽ ‘കൈകൾ’ ആ ആംഗ്യം വ്യക്തമാക്കുന്നു; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶל הָעָם
  choice: ജനത്തിന്റെ നേരെ
  rationale: אֶל ദിശയെ സൂചിപ്പിക്കുന്നു; അഹരോന്റെ ഉയർത്തിയ കൈകളുടെ അഭിമുഖത ‘നേരെ’ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: וַיְבָרְכֵם
  choice: അവരെ അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും അന്തസ്സുള്ളതുമായ മലയാള പരിഭാഷ.
- source_word: וַיֵּרֶד
  choice: അവൻ താഴേക്കിറങ്ങി
  rationale: ירד എന്നതിന്റെ ഇറങ്ങുക/താഴേക്കു പോകുക എന്ന സ്ഥലപരമായ അർഥം സംരക്ഷിക്കുന്നു; യാഗപീഠപ്രദേശത്തുനിന്നുള്ള ഇറക്കം സൂചിപ്പിക്കാം, എന്നാൽ വാചകം സ്ഥലം കൂടുതൽ നിർണയിക്കുന്നില്ല.
- source_word: מֵעֲשֹׂת
  choice: അർപ്പിച്ചശേഷം
  rationale: מן + infinitive construct ഇവിടെ പൂർത്തിയായ യാഗകർമത്തിനു ശേഷമുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അർപ്പിച്ചശേഷം’ സ്വാഭാവികവും സന്ദർഭോചിതവും ആണ്.
- source_word: הַחַטָּאת
  choice: പാപയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ חטאת എന്ന സാങ്കേതിക യാഗപദത്തിന്റെ പരിചിതമായ മലയാള രൂപം; ശുദ്ധീകരണപ്രവർത്തനത്തെ മുൻനിർത്തുന്ന മറ്റൊരു പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന עלה യാഗത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ സാങ്കേതിക പദം.
- source_word: הַשְּׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: שׁלמים എന്ന സാങ്കേതിക യാഗവിഭാഗത്തിന് പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ മലയാളരൂപം; കൂട്ടായ്മ/ക്ഷേമം എന്നീ സൂക്ഷ്മതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യാഗസംബന്ധമായ സാങ്കേതിക പദങ്ങളുടെ പരിഭാഷ
  choice: പ്രധാനവാചകത്തിൽ ‘പാപയാഗം,’ ‘ഹോമയാഗം,’ ‘സമാധാനയാഗങ്ങൾ’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിക്കുക
  alternative: ‘ശുദ്ധീകരണയാഗം’; ‘മുഴുവൻ ദഹിപ്പിക്കുന്ന യാഗം’; ‘കൂട്ടായ്മയാഗങ്ങൾ’ അല്ലെങ്കിൽ ‘ക്ഷേമയാഗങ്ങൾ’
  rationale: ഇവ ലേവ്യപുസ്തകത്തിലെ വ്യത്യസ്ത യാഗവിഭാഗങ്ങളാണ്. പരിചിതമായ പദങ്ങൾ അന്തർപാഠസമാനതയും വായനാസൗകര്യവും നിലനിർത്തുന്നു; പ്രവർത്തനപരമായ മറ്റു സൂക്ഷ്മതകൾ അടിക്കുറിപ്പുകളിൽ നൽകുന്നു.
- issue: יָדוֹ എന്ന ഏകവചനരൂപവും അനുഗ്രഹത്തിന്റെ ആംഗ്യവും
  choice: സ്വാഭാവിക മലയാളത്തിൽ ‘തന്റെ കൈകൾ’
  alternative: ‘തന്റെ കൈ’
  rationale: ഹീബ്രു രൂപം ഏകവചനമാണ്; എന്നാൽ അനുഗ്രഹത്തിനുള്ള കൈ ഉയർത്തൽ കൂട്ടായ പ്രയോഗമായി മനസ്സിലാക്കപ്പെടുന്നു. യഥാർഥ പാഠസാധ്യത മറയ്ക്കാതിരിക്കാൻ ഏകവചനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും അന്തസ്സുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ സംഭവക്രമം നിലനിർത്തിക്കൊണ്ട്, מֵעֲשֹׂת എന്ന ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ ‘അർപ്പിച്ചശേഷം’ എന്ന് നൽകി. എല്ലാ പാഠപരവും യാഗപദസംബന്ധവുമായ പ്രധാന വ്യത്യസ്ത സാധ്യതകളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
