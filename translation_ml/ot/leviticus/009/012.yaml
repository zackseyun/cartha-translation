translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും പുലർത്തുന്ന മലയാളം. യാഗസാങ്കേതിക പദമായി ‘ഹോമയാഗം’ നിലനിർത്തി; ഹീബ്രുവിലെ പ്രവൃത്തിക്രമവും രക്തപ്രയോഗത്തിന്റെ ശക്തിയും സംരക്ഷിച്ചു. പാദക്കുറിപ്പ് പ്രസക്തമായ ‘ചീറ്റിച്ചു’ എന്ന ക്രിയയ്ക്കു ശേഷമാണ് അടയാളപ്പെടുത്തിയത്.
