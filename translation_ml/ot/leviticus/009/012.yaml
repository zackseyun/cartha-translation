  text: וַ/יִּשְׁחַ֖ט אֶת הָ/עֹלָ֑ה וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֵלָי/ו֙ אֶת הַ/דָּ֔ם וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: ml
  text: പിന്നെ അവൻ ഹോമയാഗത്തിനുള്ള മൃഗത്തെ അറുത്തു. അഹരോന്റെ പുത്രന്മാർ രക്തം അഹരോന്റെ അടുക്കൽ കൊണ്ടുവന്നു; അവൻ അത് യാഗപീഠത്തിന്മേൽ ചുറ്റും ചീറ്റിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യാഗപീഠത്തിന്റെ ചുറ്റും വാരിയെറിഞ്ഞു’ എന്നും വിവർത്തനം ചെയ്യാം. രക്തം പ്രയോഗിക്കുന്നതിനുള്ള എബ്രായ ക്രിയ നേരിയ തളിക്കലിനെക്കാൾ ശക്തിയായി എറിയുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: പിന്നെ അവൻ … അറുത്തു
  rationale: ശחט യാഗസന്ദർഭത്തിൽ മൃഗത്തെ ആചാരപരമായി അറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർച്ചയായ സംഭവക്രമം സ്വാഭാവിക മലയാളത്തിൽ ‘പിന്നെ’ എന്നു നൽകി.
- source_word: הָעֹלָה
  choice: ഹോമയാഗമൃഗത്തെ
  rationale: עוֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപദമാണ്. ‘യാഗത്തെ അറുത്തു’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കി, അറുക്കപ്പെടുന്നത് യാഗമൃഗമാണെന്ന സന്ദർഭസൂചന മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: וַיַּמְצִאוּ
  choice: കൊണ്ടുവന്നു
  rationale: ഈ ആചാരക്രമത്തിൽ അഹരോന്റെ പുത്രന്മാർ രക്തം അവന്റെ അടുക്കൽ എത്തിച്ചുകൊടുക്കുന്നതാണ് അർഥം; ‘കൊണ്ടുവന്നു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർ
  rationale: കുടുംബബന്ധവും പുരോഹിതസേവനത്തിലെ പങ്കാളികളെയും നേരിട്ട് നിലനിർത്തുന്നു; ഗൗരവമുള്ള ആധുനിക മലയാളത്തിന് യോജിക്കുന്നു.
- source_word: אֵלָיו
  choice: അവന്റെ അടുക്കൽ
  rationale: ദിശാസൂചന നേരിട്ട് നിലനിർത്തുകയും മുൻവാക്യത്തിലെ അഹരോനെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നതെന്നു സന്ദർഭത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הַדָּם
  choice: രക്തം
  rationale: യാഗക്രമത്തിലെ നിർദിഷ്ട രക്തത്തെ അധിക വിശദീകരണമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: וַיִּזְרְקֵהוּ
  choice: അത് … ചീറ്റിച്ചു
  rationale: זרק ഇവിടെ രക്തം യാഗപീഠത്തിലേക്ക് ശക്തിയായി പ്രയോഗിക്കുന്ന ആചാരക്രിയയാണ്. ‘ചീറ്റിച്ചു’ സാധാരണ മലയാളത്തിൽ പ്രവൃത്തി വ്യക്തമാക്കുന്നു; നേരിയ തുള്ളിവിതറൽ മാത്രമാണെന്ന ധാരണ ഒഴിവാക്കാൻ ബദൽ പാദക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ … വശങ്ങളിലും
  rationale: עַל എന്നത് ഇവിടെ രക്തം യാഗപീഠത്തിന്റെ പുറംവശങ്ങളിൽ പതിക്കുന്ന വിധത്തിലുള്ള പ്രയോഗത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനവും സമ്പർക്കവും സ്വാഭാവികമായി ഈ ഘടന നൽകുന്നു.
- source_word: סָבִיב
  choice: എല്ലാ വശങ്ങളിലും
  rationale: യാഗപീഠത്തെ ചുറ്റിയുള്ള വിതരണാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
