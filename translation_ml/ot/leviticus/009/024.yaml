source:
  edition: WLC
  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: ml
  text: അപ്പോൾ യാഹ്‌വേയുടെ സന്നിധിയിൽനിന്ന് തീ പുറപ്പെട്ട് യാഗപീഠത്തിന്മേലുള്ള ഹോമയാഗവും മേദസ്സിന്റെ ഭാഗങ്ങളും ദഹിപ്പിച്ചു. ജനമെല്ലാം അതു കണ്ടു; അവർ ആനന്ദഘോഷം മുഴക്കി സാഷ്ടാംഗം വീണു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മുഖം നിലത്തിട്ട് വീണു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: തീ പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ പുറത്തേക്കുള്ള ചലനം നേരിട്ട് പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מִלִּפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽനിന്ന്
  rationale: ലִפְנֵי എന്നതിന്റെ അക്ഷരാർഥം ‘മുമ്പിൽനിന്ന്’ എന്നാണെങ്കിലും, ഇവിടെ ദൈവസാന്നിധ്യത്തിൽനിന്ന് തീ പുറപ്പെടുന്നു എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; יְהוָה എന്ന ഉടമ്പടിനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַתֹּאכַל
  choice: ദഹിപ്പിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘തിന്നുകളഞ്ഞു’ എന്ന ആശയമുള്ള ക്രിയ തീയുടെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുമ്പോൾ മലയാളത്തിൽ ‘ദഹിപ്പിച്ചു’ എന്നാണ് സ്വാഭാവികം.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേലുണ്ടായിരുന്ന
  rationale: യാഗവസ്തുക്കൾ യാഗപീഠത്തിന്മേൽ സ്ഥിതിചെയ്തിരുന്നു എന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി അഗ്നിയിൽ അർപ്പിക്കുന്ന עֹלָה എന്ന യാഗത്തിന് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും കൃത്യവുമായ പദം.
- source_word: הַחֲלָבִים
  choice: മേദസ്സിന്റെ ഭാഗങ്ങൾ
  rationale: സാധാരണ കൊഴുപ്പല്ല, യാഗത്തിനായി വേർതിരിച്ച നിർദിഷ്ട മേദോഭാഗങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וַיַּרְא כָּל הָעָם
  choice: ജനമെല്ലാം അതു കണ്ടപ്പോൾ
  rationale: ഹീബ്രു ആഖ്യാനക്രമം സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּרֹנּוּ
  choice: ആനന്ദഘോഷം മുഴക്കി
  rationale: רנן ഇവിടെ സന്തോഷപൂർവമായ ഉച്ചത്തിലുള്ള ഘോഷത്തെ സൂചിപ്പിക്കുന്നു; പാട്ടെന്ന അർഥം അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: സാഷ്ടാംഗം വീണു
  rationale: മുഖം നിലത്താക്കി വീഴുന്ന ആരാധനാപൂർവമായ ശരീരഭാവം സാധാരണ മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദിവ്യനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: ജനത്തിന്റെ വീഴ്ചയുടെ സ്വഭാവം
  choice: സാഷ്ടാംഗം വീണു
  alternative: മുഖം കുനിച്ച് വീണു
  rationale: വിസ്മയമോ ആരാധനയോ എന്ന് വാചകം നേരിട്ട് വിശദീകരിക്കുന്നില്ല; ശരീരഭാവം മാത്രം പരിഭാഷപ്പെടുത്തി പ്രേരണയെ തുറന്ന നിലയിൽ വിടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാഗസംബന്ധിയായ സാങ്കേതിക പദങ്ങൾക്ക് പരിചിതമായ ‘യാഗപീഠം’, ‘ഹോമയാഗം’, ‘മേദസ്സ്’ എന്നിവ ഉപയോഗിച്ചു; അനാവശ്യമായ പുരാതന വാക്യക്രമം ഒഴിവാക്കി.
