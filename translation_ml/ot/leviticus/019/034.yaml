source:
  edition: WLC
  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: ml
  text: നിങ്ങളോടൊപ്പം പാർക്കുന്ന പരദേശി നിങ്ങൾക്കു നിങ്ങളിൽ ജനിച്ച സ്വദേശിയെപ്പോലെ ആയിരിക്കണം[a]. നിന്നെ സ്നേഹിക്കുന്നതുപോലെ അവനെയും സ്നേഹിക്കണം; കാരണം, ഈജിപ്ത് ദേശത്ത് നിങ്ങളും പരദേശികളായിരുന്നു. ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരദേശി’ എന്നത് ‘വിദേശി,’ ‘താമസക്കാരനായ വിദേശി,’ അല്ലെങ്കിൽ ‘അന്യദേശവാസി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഇസ്രായേലിന്റെ ഇടയിൽ പാർക്കുന്ന സ്വദേശിയല്ലാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאֶזְרָח
  choice: സ്വദേശിയെപ്പോലെ
  rationale: אֶזְרָח സമൂഹത്തിലെ സ്വദേശിയായ അംഗത്തെ സൂചിപ്പിക്കുന്നു; כְּ എന്ന താരതമ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַגֵּר
  choice: പരദേശി
  rationale: ഇവിടെ גֵּר വഴിപോക്കനെയല്ല, ഇസ്രായേലിന്റെ ഇടയിൽ പാർക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പരദേശി’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുകയും നിയമ-സാമൂഹിക അർഥം വഹിക്കുകയും ചെയ്യുന്നു.
- source_word: הַגָּר אִתְּכֶם
  choice: നിങ്ങളോടൊപ്പം പാർക്കുന്ന
  rationale: പങ്കാളിവാചകമായ גָּר-ന്റെ താമസിക്കുന്നതെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഗֵּר-നോടുള്ള എബ്രായ പദപ്രതിധ്വനി മലയാളത്തിൽ പൂർണമായി പുനരാവിഷ്കരിക്കാൻ കഴിയാത്തതിനാൽ അർഥവ്യക്തതയ്ക്ക് മുൻഗണന നൽകി.
- source_word: יִהְיֶה לָכֶם
  choice: നിങ്ങളിൽ ... ആയിരിക്കണം
  rationale: പരദേശിയെ സമൂഹം എങ്ങനെ കണക്കാക്കണം എന്ന നിർദേശാത്മക ശക്തി മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאָהַבְתָּ לוֹ
  choice: അവനെ സ്നേഹിക്കണം
  rationale: ഏകവചന അഭിസംബോധനയിലുള്ള ഉടമ്പടി-കല്പനയുടെ നിർബന്ധസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: כָּמוֹךָ
  choice: നിന്നെപ്പോലെതന്നെ
  rationale: ലേവ്യർ 19:18-ലെ സമാന പ്രയോഗവുമായുള്ള ബന്ധം നിലനിർത്തുകയും താരതമ്യത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: കാരണം ... നിങ്ങളും പരദേശികളായിരുന്നു
  rationale: ഗֵּר എന്ന പദത്തിന്റെ ആവർത്തനം ‘പരദേശി/പരദേശികൾ’ എന്ന രൂപത്തിൽ നിലനിർത്തി കല്പനയെ ഇസ്രായേലിന്റെ ഈജിപ്ത് അനുഭവവുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്ത് ദേശത്ത്
  rationale: എബ്രായത്തിലെ പൂർണമായ ഭൂമിശാസ്ത്രപ്രയോഗവും അതിന്റെ ഉടമ്പടി-ചരിത്ര പശ്ചാത്തലവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: ദൈവനാമത്തോടു ചേർന്ന ഉടമ്പടി സൂത്രവാക്യം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: നിയമ-ധാർമിക പശ്ചാത്തലത്തിൽ גֵּר എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പരദേശി
  alternative: പ്രവാസി; താമസക്കാരനായ വിദേശി; അന്യൻ
  rationale: വാക്യം ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെക്കുറിച്ചാണ്. ‘പരദേശി’ ആ സാമൂഹിക ദുർബലതയും അന്യദേശീയതയും സൂചിപ്പിക്കുന്നു; ആധുനിക കുടിയേറ്റനിയമത്തിലെ സാങ്കേതിക വിഭാഗങ്ങൾ അടിച്ചേൽപ്പിക്കുന്നില്ല. മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ ശബ്ദാന്തരണം ചെയ്യുന്നു.
- issue: ഏകവചനവും ബഹുവചനവും മാറിമാറി വരുന്ന അഭിസംബോധന
  choice: ‘നിങ്ങൾ’ എന്ന സമൂഹബഹുവചനവും ‘നിന്നെ’ എന്ന നിയമപരമായ ഏകവചനവും നിലനിർത്തി
  alternative: മുഴുവനും ബഹുവചനമാക്കി ഏകീകരിക്കുക
  rationale: ഹീബ്രുവിൽ לָכֶם/אִתְּכֶם/הֱיִיתֶם/אֱלֹהֵיכֶם ബഹുവചനവും וְאָהַבְתָּ/כָּמוֹךָ ഏകവചനവും ആണ്. ഈ വ്യത്യാസം മായ്ച്ചുകളയാതെ മൂലപാഠത്തിലെ സമൂഹപരവും വ്യക്തിപരവുമായ ഉത്തരവാദിത്തത്തിന്റെ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-ധാർമിക ശൈലി. മൂലത്തിലെ ബഹുവചന ‘നിങ്ങൾ’ എന്നതും ഏകവചന ‘നിന്നെ/അവനെ’ എന്നതും ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
