base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: ml
  text: എന്റെ ചട്ടങ്ങൾ നിങ്ങൾ പാലിക്കണം. നിങ്ങളുടെ വളർത്തുമൃഗങ്ങളെ വ്യത്യസ്ത ഇനങ്ങളിൽപ്പെട്ടവയുമായി ഇണചേർക്കരുത്; നിങ്ങളുടെ വയലിൽ വ്യത്യസ്ത ഇനങ്ങളിലെ വിത്തുകൾ കലർത്തി വിതയ്ക്കരുത്; കലർന്ന നൂലുകൾകൊണ്ടുള്ള ശാത്ത്നേസ്[a] വസ്ത്രം നിങ്ങൾ ധരിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ “ശാത്ത്നേസ്” വിലക്കപ്പെട്ട ഒരു മിശ്രവസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. പരമ്പരാഗതമായി ഇത് കമ്പിളിനൂലും ചണനൂലും കലർത്തിയ വസ്ത്രമായി മനസ്സിലാക്കപ്പെടുന്നു; ആവർത്തനപുസ്തകം 22:11 താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: നിയമപരമായി നിശ്ചയിച്ചിട്ടുള്ള വ്യവസ്ഥകൾ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: תִּשְׁמֹרוּ
  choice: നിങ്ങൾ പാലിക്കണം
  rationale: ഉടമ്പടി-നിയമ പശ്ചാത്തലത്തിൽ ‘കാത്തുസൂക്ഷിക്കുക/ആചരിക്കുക’ എന്ന അർഥമുള്ള ക്രിയയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּהֶמְתְּךָ
  choice: മൃഗങ്ങളെ
  rationale: ഇവിടെ വളർത്തുമൃഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ഉടമസ്ഥതാ സൂചന തുടർന്നുള്ള പരിസരത്തിൽ വ്യക്തമായതിനാൽ മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി.
- source_word: תַרְבִּיעַ כִּלְאַיִם
  choice: വ്യത്യസ്ത ഇനങ്ങളിൽപ്പെട്ട മൃഗങ്ങളെ തമ്മിൽ ഇണചേർക്കരുത്
  rationale: ഹിഫിൽ ക്രിയയിലെ ‘ഇണചേരാൻ ഇടയാക്കുക’ എന്ന കാരണാർഥവും כִּלְאַיִם എന്ന വ്യത്യസ്ത ഇനങ്ങളുടെ ആശയവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: שָׂדְךָ לֹא תִזְרַע כִּלְאָיִם
  choice: നിങ്ങളുടെ വയലിൽ രണ്ടു തരം വിത്തുകൾ കലർത്തി വിതയ്ക്കരുത്
  rationale: വയലിലെ വിതയ്ക്കലുമായി ബന്ധപ്പെട്ട മിശ്രിതത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വിത്തുകൾ’ സന്ദർഭത്തിൽനിന്നുള്ള ന്യായമായ പൂരിപ്പിക്കലാണ്.
- source_word: בֶגֶד כִּלְאַיִם
  choice: കലർന്ന നൂലുകൾകൊണ്ടുള്ള ... വസ്ത്രം
  rationale: വസ്ത്രത്തിന്റെ മിശ്രഘടനയാണ് ഉദ്ദേശ്യമെന്ന് വ്യക്തമാക്കുന്നു; കൃത്യമായ നൂൽതരങ്ങൾ മുഖ്യവാക്യത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: שַׁעַטְנֵז
  choice: ശാത്ത്നേസ്
  rationale: അപൂർവ സാങ്കേതിക പദം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുകയും അതിന്റെ പരമ്പരാഗത വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: לֹא יַעֲלֶה עָלֶיךָ
  choice: നിങ്ങൾ ധരിക്കരുത്
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെമേൽ കയറരുത്’ എന്ന പ്രയോഗം വസ്ത്രസന്ദർഭത്തിൽ ധരിക്കരുത് എന്ന സ്വാഭാവിക മലയാള അർഥത്തിൽ നൽകുന്നു.
