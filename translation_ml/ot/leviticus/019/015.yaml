reference: Leviticus 19:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תַעֲשׂ֥וּ עָ֨וֶל֙ בַּ/מִּשְׁפָּ֔ט לֹא תִשָּׂ֣א פְנֵי דָ֔ל וְ/לֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּ/צֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: ml
  text: ന്യായവിധിയിൽ അനീതി പ്രവർത്തിക്കരുത്. ദരിദ്രനോടു പക്ഷപാതം കാണിക്കരുത്; ഉന്നതനോടു മുഖദാക്ഷിണ്യം കാണിക്കുകയുമരുത്. നീതിയോടെ[a] നിന്റെ സഹജീവിയെ വിധിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായത്തോടെ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ദരിദ്രന്റെ മുഖം ഉയർത്തരുത്,’ ‘ഉന്നതന്റെ മുഖത്തെ ആദരിക്കരുത്’ എന്നാണ് എബ്രായ പ്രയോഗങ്ങളുടെ അക്ഷരാർഥം. കോടതിയിൽ ഒരാളോടു പക്ഷപാതം കാണിക്കുകയോ പദവി കണ്ട് വഴങ്ങിക്കൊടുക്കുകയോ ചെയ്യരുത് എന്നാണ് ഇവയുടെ അർഥം.
    reason: cultural_note
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: ന്യായവിധിയിൽ അനീതി
  rationale: നിയമപരമായ വിധിനിർണയത്തിന്റെ പശ്ചാത്തലത്തിൽ עָוֶל എന്നത് നീതിയുടെ ലംഘനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഈ പ്രയോഗം മൂലപാഠത്തിന്റെ നിയമപരവും ധാർമികവുമായ ഭാരം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תִשָּׂא פְנֵי דָל
  choice: ദരിദ്രനോടു പക്ഷപാതം കാണിക്കുക
  rationale: ‘മുഖം ഉയർത്തുക’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ ദരിദ്രന്റെ പക്ഷം അന്യായമായി പിടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. അർഥം വ്യക്തമായി എത്തിക്കുന്ന പ്രവർത്തനസമാനതയുള്ള പരിഭാഷയാണ് സ്വീകരിച്ചത്.
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: ഉന്നതനോടു മുഖദാക്ഷിണ്യം കാണിക്കുക
  rationale: גָדוֹל ഇവിടെ ശരീരവലുപ്പമല്ല, സാമൂഹിക പദവിയോ പ്രാധാന്യമോ ഉള്ള വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഉന്നതൻ’ ആ വിശാലമായ അർഥം നൽകുന്നു; ‘മുഖദാക്ഷിണ്യം’ ആദരവിന്റെ പേരിലുള്ള ന്യായവിരുദ്ധമായ വഴങ്ങലിനെ വ്യക്തമാക്കുന്നു.
- source_word: בְּצֶדֶק
  choice: നീതിയോടെ
  rationale: צֶדֶק ധാർമികമായ നേരും ന്യായമായ വിധിയും ഒരുമിച്ച് ഉൾക്കൊള്ളാം. ‘നീതിയോടെ’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും ഇരുവശവും ഉൾക്കൊള്ളുന്നതുമാണ്; ‘ന്യായത്തോടെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תִּשְׁפֹּט
  choice: വിധിക്കണം
  rationale: നിയമനിർദേശത്തിലെ നിർബന്ധശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֲמִיתֶךָ
  choice: നിന്റെ സഹജീവിയെ
  rationale: עָמִית ഒരാളോടൊപ്പം സമൂഹത്തിൽ കഴിയുന്ന സഹാംഗത്തെ സൂചിപ്പിക്കുന്നു. ‘സഹജീവി’ ഭൂമിശാസ്ത്രപരമായ അയൽവാസി എന്ന അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാതെ വ്യക്തിബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: നിയമ-ധാർമിക സന്ദർഭത്തിലെ צֶדֶק എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നീതിയോടെ
  alternative: ന്യായത്തോടെ
  rationale: ഈ പദത്തിന് ധാർമിക നീതിയും ന്യായവിധിയിലെ നിഷ്പക്ഷതയും ഉണ്ട്. മുഖ്യപാഠത്തിലെ ‘നീതിയോടെ’ ഈ വിശാലത നിലനിർത്തുന്നു; നിയമപരമായ ഊന്നൽ നൽകുന്ന ‘ന്യായത്തോടെ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാപാരായണത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ മുഖപ്രയോഗങ്ങൾ മുഖ്യപാഠത്തിൽ അർഥസമാനമായി പരിഭാഷപ്പെടുത്തി, അവയുടെ ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
