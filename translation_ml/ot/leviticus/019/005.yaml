source:
  edition: WLC
  text: וְ/כִ֧י תִזְבְּח֛וּ זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּחֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: ml
  text: നിങ്ങൾ യഹ്‌വെയ്ക്ക് ഒരു സമാധാനയാഗം അർപ്പിക്കുമ്പോൾ, നിങ്ങൾക്ക് സ്വീകാര്യത ലഭിക്കത്തക്കവിധം അത് അർപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിങ്ങളുടെ സ്വീകാര്യതയ്ക്കായി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: അർപ്പിക്കുമ്പോൾ
  rationale: നിയമനിർദേശത്തിന്റെ സാഹചര്യപരവും കാലികവുമായ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; പ്രവൃത്തി വെറും സാങ്കൽപ്പിക സാധ്യതയാണെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: תִזְבְּחוּ / תִּזְבָּחֻהוּ
  choice: അർപ്പിക്കുമ്പോൾ / അത് അർപ്പിക്കണം
  rationale: זבח യാഗമായി അറുത്ത് അർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യാഗം അർപ്പിക്കുക’ സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്; ആവർത്തിച്ചിരിക്കുന്ന എബ്രായക്രിയയും നിയമനിർദേശത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: זֶבַח שְׁלָמִים
  choice: ഒരു സമാധാനയാഗം
  rationale: ഈ പ്രസിദ്ധമായ യാഗവിഭാഗത്തിന് മലയാളത്തിൽ സുതാര്യവും പതിവുള്ളതുമായ പേര്; ‘കൂട്ടായ്മയാഗം’ എന്ന വ്യാഖ്യാനപരമായ വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്ക്
  rationale: ל യാഗത്തിന്റെ സമർപ്പണലക്ഷ്യം സൂചിപ്പിക്കുന്നു. יהוה എന്ന ദൈവനാമം പൊതുപദവിയായി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לִרְצֹנְכֶם
  choice: നിങ്ങൾക്ക് സ്വീകാര്യത ലഭിക്കത്തക്കവിധം
  rationale: യാഗനിയമത്തിലെ רָצוֹן ദൈവസന്നിധിയിലെ അംഗീകാരം/സ്വീകാര്യതയെ സൂചിപ്പിക്കുന്നു. ആരാധകന്റെ ഇഷ്ടപ്രകാരം എന്ന തെറ്റായ അർഥം ഒഴിവാക്കി, മലയാളത്തിൽ വ്യക്തമായി ഉദ്ദേശ്യഫലം അറിയിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന തിരഞ്ഞെടുപ്പിനൊത്ത ആധുനിക മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: לִרְצֹנְכֶם എന്നതിന്റെ യാഗസന്ദർഭത്തിലുള്ള അർഥം
  choice: നിങ്ങൾക്ക് സ്വീകാര്യത ലഭിക്കത്തക്കവിധം
  alternative: നിങ്ങളുടെ സ്വീകാര്യതയ്ക്കായി / നിങ്ങളുടെ ഇഷ്ടപ്രകാരം
  rationale: ദൈവത്താൽ സ്വീകരിക്കപ്പെടുക എന്ന യാഗസംബന്ധമായ അർഥം വ്യക്തമാക്കുന്നു; ആരാധകന്റെ വ്യക്തിപരമായ ഇഷ്ടമാണ് മാനദണ്ഡമെന്ന ധ്വനി ഒഴിവാക്കുന്നു. കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘അർപ്പിക്കണം’ എന്ന രൂപം നിർദേശത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; അനാവശ്യ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
