  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: ml
  text: നിന്റെ സഹോദരനെ ഹൃദയത്തിൽ വെറുക്കരുത്. നിന്റെ കൂട്ടുകാരനെ നിശ്ചയമായും ശാസിക്കണം; അവന്റെ കാരണത്താൽ പാപം വരുത്തിക്കൊള്ളരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ കാരണത്താൽ നീ കുറ്റക്കാരനാകരുത്” എന്നും “അവന്റെ പാപത്തിൽ പങ്കാളിയാകരുത്” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായ പ്രയോഗം ഒരു ശൈലീപ്രയോഗമാണ്; തെറ്റ് ചൂണ്ടിക്കാണിക്കാതിരിക്കുന്നതിലൂടെ ഒരാൾ കുറ്റബാധ്യത വരുത്തിവെക്കുന്നതിനെ ഇത് സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂנָא
  choice: വെറുക്കരുത്
  rationale: שׂנא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘വെറുക്കുക’ നിലനിർത്തുന്നു; വിലക്കിന്റെ ധാർമിക ശക്തി മയപ്പെടുത്തുന്നില്ല.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരനെ
  rationale: אָח എന്നത് സ്വന്തം സഹോദരനെയോ ഉടമ്പടി സമൂഹത്തിലെ സഹാംഗത്തെയോ സൂചിപ്പിക്കാം. ‘സഹോദരൻ’ മൂലപദത്തിന്റെ കുടുംബപരവും ഉടമ്പടിപരവുമായ അനുരണനം നിലനിർത്തുന്നു.
- source_word: בִּלְבָבֶךָ
  choice: ഹൃദയത്തിൽ
  rationale: לֵבָב ചിന്തയും ഉദ്ദേശ്യവും ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്നു. ‘ഹൃദയത്തിൽ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: നിശ്ചയമായും ശാസിക്കണം
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും പരിമിതക്രിയയും ചേർന്ന ഘടന കല്പനയ്ക്ക് ഊന്നൽ നൽകുന്നു. ‘നിശ്ചയമായും’ ആ ഊന്നൽ പ്രകടമാക്കുകയും ‘ശാസിക്കുക’ തെറ്റ് തുറന്നുപറഞ്ഞ് തിരുത്തുന്ന ധാർമിക സന്ദർഭത്തിന് ചേരുകയും ചെയ്യുന്നു.
- source_word: עֲמִיתֶךָ
  choice: നിന്റെ കൂട്ടുകാരനെ
  rationale: עָמִית ഒരാളുടെ സമൂഹത്തിലെ സഹാംഗത്തെ സൂചിപ്പിക്കുന്നു. ‘കൂട്ടുകാരൻ’ ഈ സാമുദായിക ബന്ധം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഇവിടെ വ്യക്തിപരമായ സുഹൃത്ത് എന്നതിലുപരി സഹസമൂഹാംഗൻ എന്ന അർഥമാണ്.
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: അവൻ നിമിത്തം നീ പാപം വഹിക്കരുത്
  rationale: נשא חטא എന്ന പ്രയോഗം പാപമോ കുറ്റബാധ്യതയോ വഹിക്കുക എന്ന അർഥം നൽകുന്നു. עליו കാരണമോ ബന്ധപ്പെട്ട ഉത്തരവാദിത്വമോ സൂചിപ്പിക്കാം. മൂലത്തിലെ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടി ധാർമികതയിലെ ബന്ധുത്വപദങ്ങളുടെ വ്യാപ്തി
  choice: ‘നിന്റെ സഹോദരൻ’, ‘നിന്റെ കൂട്ടുകാരൻ’ എന്നീ ഏകവചന പുരുഷലിംഗ ബന്ധപദങ്ങൾ നിലനിർത്തി.
  alternative: ‘നിന്റെ സഹമനുഷ്യൻ’ അല്ലെങ്കിൽ ‘മറ്റൊരു ഇസ്രായേല്യൻ’
  rationale: എബ്രായത്തിൽ വ്യാകരണപരമായി പുരുഷലിംഗ ഏകവചനരൂപങ്ങളാണ് ഉള്ളത്; സന്ദർഭത്തിൽ അവയ്ക്ക് പ്രതിനിധാനപരമായ സാമുദായിക വ്യാപ്തിയുണ്ട്. അവയെ ലിംഗനിരപേക്ഷമാക്കി മൂലത്തിലെ കുടുംബ-ഉടമ്പടി ഭാവം മായ്ച്ചിട്ടില്ല.
- issue: തെറ്റ് ശാസിക്കാതിരിക്കുന്നതിലൂടെ ഉണ്ടാകുന്ന കുറ്റബാധ്യത
  choice: ‘അവൻ നിമിത്തം നീ പാപം വഹിക്കരുത്’ എന്ന അടുത്ത വിവർത്തനം സ്വീകരിച്ചു.
  alternative: ‘അവന്റെ കാരണത്താൽ നീ കുറ്റക്കാരനാകരുത്’ അല്ലെങ്കിൽ ‘അവന്റെ പാപത്തിൽ പങ്കാളിയാകരുത്’
  rationale: എബ്രായ പ്രയോഗം സ്വന്തം കുറ്റബാധ്യത, മറ്റൊരാളുടെ കാരണത്താൽ കുറ്റം വരുത്തൽ, അല്ലെങ്കിൽ അവന്റെ പാപത്തിൽ പങ്കുചേരൽ എന്നീ സമീപ അർഥങ്ങൾക്ക് ഇട നൽകുന്നു. ഒരു വ്യാഖ്യാനം മാത്രം മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കാതെ യഥാർഥമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ‘നിശ്ചയമായും’ മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട അവസാന വാക്യത്തിന്റെ പിന്നാലെ ചേർത്തിരിക്കുന്നു.
