id: LEV.19.10
reference: Leviticus 19:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כַרְמְ/ךָ֙ לֹ֣א תְעוֹלֵ֔ל וּ/פֶ֥רֶט כַּרְמְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: ml
  text: നിന്റെ മുന്തിരിത്തോട്ടത്തിൽ വിളവെടുപ്പിനുശേഷം ശേഷിച്ചവ വീണ്ടും പറിച്ചെടുക്കരുത്[a]; നിന്റെ മുന്തിരിത്തോട്ടത്തിൽ വീണുകിടക്കുന്ന മുന്തിരിപ്പഴങ്ങൾ പെറുക്കരുത്[b]. അവ ദരിദ്രന്നും പരദേശിക്കും[c] വിട്ടുകൊടുക്കണം. ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ മുന്തിരിത്തോട്ടത്തിൽ ശേഷിച്ച മുന്തിരിക്കുലകൾ പെറുക്കരുത്.’ പ്രധാന വിളവെടുപ്പിനുശേഷം ശേഷിച്ചവ എടുക്കാൻ വള്ളികളിലൂടെ വീണ്ടും പോകുന്നതിനെ ഹീബ്രു ക്രിയ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിന്റെ മുന്തിരിത്തോട്ടത്തിലെ ചിതറിക്കിടക്കുന്ന പഴങ്ങൾ.’ വിളവെടുപ്പിനിടെ വേർപെട്ടോ വീണോ കിടക്കുന്ന മുന്തിരിപ്പഴങ്ങളെയാണ് ഹീബ്രു പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘സ്ഥിരതാമസക്കാരനായ വിദേശി.’ ഇസ്രായേല്യനല്ലെങ്കിലും ഇസ്രായേല്യരുടെ ഇടയിൽ താമസിക്കുന്ന വ്യക്തിയെയാണ് ഹീബ്രു גֵּר എന്ന പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּרְמְךָ
  choice: നിന്റെ മുന്തിരിത്തോട്ടം
  rationale: כֶּרֶם എന്നത് മുന്തിരിവള്ളികൾ കൃഷി ചെയ്യുന്ന തോട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘മുന്തിരിത്തോട്ടം’ സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: תְעוֹלֵל
  choice: വിളവെടുപ്പിനുശേഷം ശേഷിച്ചവ വീണ്ടും പറിച്ചെടുക്കുക
  rationale: പ്രധാന വിളവെടുപ്പിനുശേഷം വള്ളികളിൽ ശേഷിച്ച മുന്തിരിക്കുലകൾക്കായി വീണ്ടും തോട്ടത്തിലൂടെ പോകുന്നതാണ് സന്ദർഭത്തിലെ അർഥം. സാങ്കേതികമല്ലാത്ത ഭാഷയിൽ പ്രവൃത്തി വ്യക്തമായി അറിയിക്കാൻ ഈ വിവർത്തനം തെരഞ്ഞെടുത്തു.
- source_word: פֶּרֶט
  choice: വീണുകിടക്കുന്ന മുന്തിരിപ്പഴങ്ങൾ
  rationale: വിളവെടുപ്പിനിടെ വേർപെട്ടു വീഴുകയോ ചിതറിക്കിടക്കുകയോ ചെയ്യുന്ന മുന്തിരിപ്പഴങ്ങളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: תְלַקֵּט
  choice: പെറുക്കുക
  rationale: താഴെ വീണുകിടക്കുന്നവ ഒന്നൊന്നായി ശേഖരിക്കുന്ന പ്രവൃത്തിക്ക് ‘പെറുക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לֶעָנִי
  choice: ദരിദ്രന്
  rationale: עָנִי ഇവിടെ സാമ്പത്തികമായി ദരിദ്രനോ ആവശ്യത്തിലിരിക്കുന്നവനോ ആയ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְלַגֵּר
  choice: നിങ്ങളുടെ ഇടയിൽ താമസിക്കുന്ന അന്യദേശക്കാരന്
  rationale: גֵּר ഇസ്രായേലിന്റെ ഇടയിൽ താമസിച്ചിരുന്ന, എന്നാൽ സ്വദേശീയ അംഗമല്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘അന്യദേശക്കാരൻ’ എന്നതോടൊപ്പം താമസത്തിന്റെ ഘടകം വ്യക്തമാക്കുന്നത് നിയമപരവും സാമൂഹികവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: תַּעֲזֹב אֹתָם
  choice: അവ ... വിട്ടേക്കണം
  rationale: עזב ഇവിടെ ഉപേക്ഷിച്ചുകളയുക എന്നതിലുപരി മറ്റുള്ളവർക്ക് എടുക്കാനായി ശേഷിപ്പിച്ചു വിടുക എന്നാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: ഉറവിടത്തിലെ ബഹുവചന അഭിസംബോധന നിലനിർത്തിക്കൊണ്ട് ഉടമ്പടിസൂത്രവാക്യം നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: ഉറവിടപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു പദവി പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള അഭിസംബോധനാമാറ്റം
  choice: ‘നിന്റെ’ എന്ന ഏകവചനവും ‘നിങ്ങളുടെ’ എന്ന ബഹുവചനവും നിലനിർത്തി
  alternative: വാക്യം മുഴുവൻ ഏകവചനത്തിലോ ബഹുവചനത്തിലോ ഏകീകരിക്കുക
  rationale: മുന്തിരിത്തോട്ടത്തെക്കുറിച്ചുള്ള കല്പനയിൽ ഹീബ്രു ഏകവചനവും സമാപനസൂത്രവാക്യത്തിൽ אֱלֹהֵיכֶם എന്ന ബഹുവചനവും ഉപയോഗിക്കുന്നു; ഈ പാഠസവിശേഷത മായ്ച്ചുകളഞ്ഞില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ നിയമവചനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘വീണ്ടും പറിച്ചെടുക്കുക’, ‘പെറുക്കുക’ എന്നിവ വ്യത്യസ്ത വിളവെടുപ്പുപ്രവൃത്തികളെ വ്യക്തമായി വേർതിരിക്കുന്നു. ഉറവിടത്തിലെ ഏകവചന കല്പനയും അവസാനത്തെ ബഹുവചന ഉടമ്പടിസൂത്രവും സംരക്ഷിച്ചിട്ടുണ്ട്.
