  verdict: revise
  source_fidelity: The draft accurately preserves both prohibitions, the plural sense of אֱלֹהֵי מַסֵּכָה, the benefactive ‘for yourselves,’ and the covenant identification ‘I am Yahweh your God.’ ‘വിഗ്രഹങ്ങളിലേക്കു തിരിയരുത്’ appropriately retains the breadth of פנה rather than narrowing it to worship.
