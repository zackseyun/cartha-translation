id: LEV.19.4
reference: Leviticus 19:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: ml
  text: വിഗ്രഹങ്ങളിലേക്കു തിരിയരുത്[a]. നിങ്ങൾക്കായി വാർത്തെടുത്ത ലോഹദേവന്മാരെ ഉണ്ടാക്കരുത്[b]. ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിലയില്ലാത്ത വിഗ്രഹങ്ങൾ’; ‘വിഗ്രഹങ്ങൾ’ എന്നതിനുള്ള എബ്രായപദത്തിന് അവഹേളനാത്മകമായ അർഥസൂചന ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഉരുക്കിയ ദേവന്മാർ’ അല്ലെങ്കിൽ ‘ലോഹവിഗ്രഹങ്ങൾ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: തിരിയരുത്
  rationale: פנה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘തിരിയുക’ നിലനിർത്തുന്നു. ആരാധന എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കാതെ, ശ്രദ്ധയോ ആശ്രയമോ ആരാധനയോ ലക്ഷ്യമാക്കി വിഗ്രഹങ്ങളിലേക്കു തിരിയുന്നതിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: אֱלִילִים
  choice: വിഗ്രഹങ്ങൾ
  rationale: അവഹേളനാത്മകമായി ‘വിലകെട്ടവ’ എന്ന സൂചന ഈ പദത്തിനുണ്ടാകാമെങ്കിലും, ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പൊതുപദം ‘വിഗ്രഹങ്ങൾ’ ആണ്.
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: വാർത്തെടുത്ത ലോഹദേവന്മാർ
  rationale: מַסֵּכָה സൂചിപ്പിക്കുന്ന ലോഹം ഉരുക്കി അച്ചിൽ വാർത്തെടുക്കുന്ന നിർമാണരീതിയും אֱלֹהֵי എന്നതിലെ ‘ദേവന്മാർ’ എന്ന ബഹുവചനവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: תַעֲשׂוּ לָכֶם
  choice: നിങ്ങൾക്കായി ... ഉണ്ടാക്കരുത്
  rationale: לָכֶם എന്നതിലെ സ്വന്തം ഉപയോഗത്തിനോ കൈവശത്തിനോ വേണ്ടിയുള്ള പ്രയോജനാർഥക ഭാവം ‘നിങ്ങൾക്കായി’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: രൂപപരമായി ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും, ഉടമ്പടിസൂത്രമായ ഈ സന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയായി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ‘യഹ്‌വെ’ എന്ന രൂപം സാധ്യതയേറിയ ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: വിഗ്രഹങ്ങളിലേക്കു തിരിയുക എന്നതിൽ ആരാധനയെ വ്യക്തമാക്കണമോ
  choice: വിഗ്രഹങ്ങളിലേക്കു തിരിയരുത്
  alternative: വിഗ്രഹങ്ങളെ ആരാധിക്കരുത്; വിഗ്രഹങ്ങളെ മാനിക്കരുത്
  rationale: פנה നേരിട്ട് ‘ആരാധിക്കുക’ എന്നു പറയുന്നില്ല. ശ്രദ്ധ, ആശ്രയം, വിധേയത്വം, ആരാധന എന്നിവ ഉൾക്കൊള്ളാവുന്ന മൂലപ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- issue: אֱלֹהֵי מַסֵּכָה എന്നതിലെ ദേവന്മാർ/രൂപങ്ങൾ
  choice: വാർത്തെടുത്ത ലോഹദേവന്മാർ
  alternative: ഉരുക്കിയ ദേവന്മാർ; ലോഹവിഗ്രഹങ്ങൾ
  rationale: മൂലത്തിലെ ‘ദേവന്മാർ’ എന്ന ബഹുവചനവും വാർത്തെടുക്കൽ എന്ന നിർമാണഭാവവും സംരക്ഷിക്കുന്നു; ‘വിഗ്രഹങ്ങൾ’ എന്നു മാത്രം പറഞ്ഞ് ദൈവാവകാശത്തിന്റെ ഭാഷ മറയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിലക്കുവാക്യങ്ങൾ ഉപയോഗിച്ചു. ‘വാർത്തെടുത്ത’ എന്ന പദം അച്ചിൽ ഒഴിച്ച് ലോഹരൂപം നിർമിക്കുന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
