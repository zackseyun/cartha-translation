  - severity: low
    issue: Footnote a uses ‘വിലകെട്ട വിഗ്രഹങ്ങൾ.’
    rationale: ‘വിലകെട്ട’ may imply inexpensive or cheap. ‘വിലയില്ലാത്ത’ more directly conveys ‘worthless,’ the possible pejorative force noted for אֱלִילִים.
