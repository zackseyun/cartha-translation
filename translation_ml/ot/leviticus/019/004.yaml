  terminology: ‘വാർത്തെടുത്ത ലോഹദേവന്മാർ’ naturally conveys cast-metal gods while retaining the source’s plural ‘gods.’ ‘വിഗ്രഹങ്ങൾ’ is an appropriate main-text equivalent for אֱלִילִים. The footnote’s ‘വിലകെട്ട’ is less precise in modern Malayalam because it can suggest cheapness; ‘വിലയില്ലാത്ത’ better expresses the possible pejorative nuance.
