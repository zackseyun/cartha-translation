id: LEV.19.25
reference: Leviticus 19:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: ml
  text: അതിന്റെ വിളവ് നിങ്ങൾക്കു വർധിക്കേണ്ടതിന്, അഞ്ചാം വർഷത്തിൽ നിങ്ങൾ അതിന്റെ ഫലം ഭക്ഷിക്കാം. ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: അഞ്ചാം വർഷത്തിൽ
  rationale: മുൻവാക്യങ്ങളിലെ നിയന്ത്രണങ്ങൾക്കുശേഷമുള്ള നിയമനിർദേശത്തിന്റെ തുടർച്ചയാണ് വാവു സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാതെയും ആ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: תֹּאכְלוּ
  choice: നിങ്ങൾക്ക് ... ഭക്ഷിക്കാം
  rationale: ഈ നിയമസന്ദർഭത്തിലെ അപൂർണക്രിയ മുൻകാല നിരോധനത്തിനുശേഷമുള്ള അനുമതിയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘ഭക്ഷിക്കാം’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֶת־פִּרְיוֹ
  choice: അതിന്റെ ഫലം
  rationale: פְּרִי ഇവിടെ നട്ട ഫലവൃക്ഷത്തിന്റെ ഫലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഏകവചന പ്രത്യയം ‘അതിന്റെ’ എന്ന് നിലനിർത്തുന്നു.
- source_word: לְהוֹסִיף
  choice: അങ്ങനെ ... വർധിക്കും
  rationale: לְ ചേർന്ന ക്രിയാനാമം ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം. ‘അങ്ങനെ’ ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു; ഹീബ്രുവിലെ കാരണബന്ധത്തെ അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- source_word: תְּבוּאָתוֹ
  choice: അതിന്റെ വിളവ്
  rationale: תְּבוּאָה ഉൽപ്പാദനത്തെയോ വിളവിനെയോ സൂചിപ്പിക്കുന്നു. ‘വിളവ്’ കൃഷിസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; മുമ്പുള്ള ‘ഫലം’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും കാക്കുന്നു.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു
  rationale: ലേവ്യപുസ്തകത്തിലെ ഗൗരവമുള്ള ഉടമ്പടി-സ്വയംപരിചയപ്പെടുത്തൽ നിലനിർത്തുന്നു; יְהוָה എന്ന ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്ന് ലിപ്യന്തരണം ചെയ്യുന്നത് ഉടമ്പടിനാമത്തെ വ്യക്തമാക്കുന്നു.
- issue: לְהוֹסִיף സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം/ഫലം
  choice: അങ്ങനെ അതിന്റെ വിളവ് നിങ്ങൾക്കായി വർധിക്കും
  alternative: അതിന്റെ വിളവ് നിങ്ങൾക്കായി വർധിക്കേണ്ടതിന്
  rationale: ഹീബ്രു ഘടന ഉദ്ദേശ്യവും പ്രതീക്ഷിത ഫലവും ഉൾക്കൊള്ളാൻ കഴിയും. ‘അങ്ങനെ’ ഈ ബന്ധം തുറന്നുവെക്കുന്നു; മനുഷ്യരുടെ ഭക്ഷണം തന്നെയാണ് വൃക്ഷത്തിന്റെ വർധനയ്ക്ക് യാന്ത്രിക കാരണം എന്ന ആശയം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. നിയമപരമായ അനുമതി ‘നിങ്ങൾക്ക് ... ഭക്ഷിക്കാം’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമായി നൽകി. മൂലത്തിലെ ‘ഫലം/വിളവ്’ എന്ന പദവ്യത്യാസം സംരക്ഷിച്ചു.
