id: LEV.19.32
reference: Leviticus 19:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/פְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְ/הָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: ml
  text: നരച്ച മുടിയുടെ മുമ്പിൽ നീ എഴുന്നേൽക്കണം[a]; വൃദ്ധന്റെ മുഖത്തെ നീ ആദരിക്കണം[b]; നിന്റെ ദൈവത്തെ നീ ഭയപ്പെടണം; ഞാൻ യഹ്‌വെ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നരച്ച മുടിയുടെ സാന്നിധ്യത്തിൽ.” വാർധക്യത്തെ സൂചിപ്പിക്കാൻ എബ്രായം മൂർത്തമായ ഒരു പ്രയോഗം ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ഒരു മൂപ്പന്റെ സാന്നിധ്യത്തിന് ബഹുമാനം നൽകണം.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “വൃദ്ധന്റെ മുഖത്തെ ആദരിക്കണം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: നരച്ച മുടിയുടെ മുമ്പിൽ
  rationale: שֵׂיבָה എന്നത് അക്ഷരാർഥത്തിൽ നരച്ച മുടിയെയും വിപുലാർഥത്തിൽ വാർധക്യത്തെയും സൂചിപ്പിക്കുന്നു. മִפְּנֵי എന്നതോടൊപ്പം ഈ പരിഭാഷ എബ്രായത്തിലെ മൂർത്തമായ ദൃശ്യവും ആദരസൂചകമായ സാന്നിധ്യബോധവും നിലനിർത്തുന്നു.
- source_word: תָּקוּם
  choice: നീ എഴുന്നേറ്റുനിൽക്കണം
  rationale: קום എന്ന ക്രിയ ഇവിടെ ആദരസൂചകമായി എഴുന്നേറ്റുനിൽക്കാനുള്ള കല്പനയാണ്. ആ പ്രവൃത്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: וְהָדַרְתָּ
  choice: നീ ആദരിക്കണം
  rationale: പീയേൽ രൂപത്തിലുള്ള הדר ഇവിടെ ബഹുമാനിക്കുക, ആദരവ് കാണിക്കുക എന്ന അർഥത്തിലാണ്; ആരാധനാപരമായ ഭാവം അനാവശ്യമായി ചേർക്കാതെ ധാർമിക കല്പന വ്യക്തമാക്കുന്നു.
- source_word: פְּנֵי זָקֵן
  choice: വൃദ്ധന്റെ മുഖത്തെ
  rationale: എബ്രായത്തിലെ ‘വൃദ്ധന്റെ മുഖം’ എന്ന മൂർത്തമായ പ്രയോഗവും זָקֵן എന്ന പുല്ലിംഗ ഏകവചനരൂപവും നിലനിർത്തുന്നു.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: നിന്റെ ദൈവത്തെ നീ ഭയപ്പെടണം
  rationale: יִרא എന്ന ക്രിയയിലെ ഭയം, ഭക്ത്യാദരം, വിസ്മയഭയം എന്നിവയുടെ ദൈവശാസ്ത്രപരമായ സമ്മർദം ‘ഭയപ്പെടണം’ നിലനിർത്തുന്നു; രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥതയും നേരിട്ടുള്ള അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: זָקֵן എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: വൃദ്ധൻ
  alternative: വയോധികൻ / പ്രായമായ വ്യക്തി / മൂപ്പൻ
  rationale: മൂലപാഠം പുല്ലിംഗ ഏകവചനമാണ്. കല്പനയ്ക്ക് പ്രതിനിധാനപരമായ വ്യാപ്തി ഉണ്ടായിരിക്കാമെങ്കിലും പരിഭാഷയിൽ ഉറവിടത്തിലെ ലിംഗരൂപം മായ്ച്ചുകളയുന്നില്ല.
- issue: ദൈവത്തെ ഭയപ്പെടുക എന്ന പ്രയോഗം
  choice: നിന്റെ ദൈവത്തെ നീ ഭയപ്പെടണം
  alternative: നിന്റെ ദൈവത്തെ നീ ഭക്ത്യാദരത്തോടെ മാനിക്കണം
  rationale: വിശുദ്ധിനിയമത്തിലെ ഉടമ്പടിപരമായ സൂത്രവാക്യത്തിൽ ഭയവും ഭക്ത്യാദരവും തമ്മിലുള്ള യഥാർഥ സംഘർഷം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ ഉടമ്പടിനാമം ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ വ്യക്തിനാമമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ സമാന്തരഘടനയും രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധനയും മൂർത്തമായ ‘നരച്ച മുടി/മുഖം’ ദൃശ്യങ്ങളും സാധ്യമായത്ര നിലനിർത്തി.
