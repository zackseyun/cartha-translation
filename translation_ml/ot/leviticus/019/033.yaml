  - severity: low
    issue: Footnote b's alternative ദ്രോഹം ചെയ്യരുത്
    rationale: ദ്രോഹം commonly carries the narrower sense of betrayal or treachery. The Hebrew verb here concerns wronging/oppressing; retaining 'oppress' as the alternative is more faithful.
