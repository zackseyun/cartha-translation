  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי יָג֧וּר אִתְּ/ךָ֛ גֵּ֖ר בְּ/אַרְצְ/כֶ֑ם לֹ֥א תוֹנ֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/033.yaml
  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: ml
  text: നിങ്ങളുടെ ദേശത്ത് ഒരു പരദേശി[a] നിങ്ങളോടൊപ്പം താമസിക്കുന്നുവെങ്കിൽ, നിങ്ങൾ അവനോട് അന്യായം ചെയ്യരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരദേശി’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം ഗേർ ആണ്; ഇസ്രായേല്യരുടെ ഇടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്. ‘വന്നുപാർക്കുന്നവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: cultural_note
  - marker: b
    text: ‘അവനെ പീഡിപ്പിക്കരുത്’ എന്നോ ‘അവനോട് അന്യായം പ്രവർത്തിക്കരുത്’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: താമസിച്ചാൽ
  rationale: നിയമപരമായ ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്ന നിബന്ധനാഭാവം മലയാളത്തിലെ ‘-ച്ചാൽ’ രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: יָגוּר
  choice: താമസിച്ചാൽ
  rationale: സ്വദേശിയല്ലാത്ത ഒരാൾ ഒരു സമൂഹത്തിനിടയിൽ പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന גור എന്ന ക്രിയയുടെ താമസാർഥം ലളിതവും ആധുനികവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: אִתְּךָ
  choice: നിങ്ങളോടൊപ്പം
  rationale: ‘നിന്നോടൊപ്പം’ എന്ന ഏകവചന രൂപം മൂലപാഠത്തോട് കൂടുതൽ രൂപപരമായി അടുത്തതാണെങ്കിലും, തുടർന്ന് വരുന്ന ബഹുവചന അഭിസംബോധനയോടും മലയാളത്തിലെ സമൂഹാഭിസംബോധനയോടും ചേർന്ന് സ്വാഭാവികമാകാൻ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: גֵּר
  choice: പരദേശി
  rationale: വഴിപോക്കനെയല്ല, സ്വദേശിയല്ലാതെ ദേശത്തിനകത്ത് താമസിക്കുന്ന ഒരാളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘പരദേശി’ ആധുനിക മലയാളത്തിൽ ഈ അന്യദേശീയത വ്യക്തമായി അറിയിക്കുന്നു; താമസസ്ഥിതി ക്രിയയിലൂടെയും അടിക്കുറിപ്പിലൂടെയും വ്യക്തമാക്കുന്നു.
- source_word: בְּאַרְצְכֶם
  choice: നിങ്ങളുടെ ദേശത്ത്
  rationale: ‘ദേശം’ എന്നത് אֶרֶץ എന്ന പദത്തിന്റെ ഭൂമിയെയും സമൂഹത്തിന്റെ അധീനപ്രദേശത്തെയും ഉൾക്കൊള്ളുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: לֹא תוֹנוּ
  choice: നിങ്ങൾ അവനോട് അന്യായം ചെയ്യരുത്
  rationale: ינה എന്ന ക്രിയയിലെ ദ്രോഹിക്കുക, പീഡിപ്പിക്കുക, അന്യായം ചെയ്യുക എന്നീ അർഥവ്യാപ്തി പൊതുവായി ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്; ശക്തമായ പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֹתוֹ
  choice: അവനോട്
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചന സർവനാമം പരദേശിയെ സൂചിപ്പിക്കുന്നതിനാൽ അതേ ലിംഗവും വചനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ വിശുദ്ധിനിയമത്തിലെ גֵּר എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പരദേശി
  alternative: പ്രവാസി; വന്നുപാർക്കുന്നവൻ; അന്യദേശവാസി
  rationale: ഇത് അപരിചിതനായ വഴിപോക്കനെയല്ല, ഇസ്രായേലിന്റെ ദേശത്ത് സ്വദേശിയല്ലാതെ താമസിക്കുകയും അവിടത്തെ സാമൂഹിക-നിയമപരമായ സംരക്ഷണത്തിന് വിധേയനാകുകയും ചെയ്യുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പരദേശി’ വായനാസൗകര്യം നൽകുമ്പോൾ താമസത്തിന്റെ സവിശേഷത വാക്യവും അടിക്കുറിപ്പും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി സ്വീകരിച്ചു. അപൂർവമോ അതിപുരാതനമോ ആയ പദങ്ങൾ ഒഴിവാക്കി; എന്നാൽ ‘ദേശം’, ‘പരദേശി’ എന്നീ പദങ്ങളിലൂടെ വാക്യത്തിന്റെ തിരുവെഴുത്തുസംബന്ധിയായ ഗൗരവം നിലനിർത്തി.
