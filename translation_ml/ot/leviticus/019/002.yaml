id: LEV.19.2
reference: Leviticus 19:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל וְ/אָמַרְתָּ֥ אֲלֵ/הֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: ml
  text: '“ഇസ്രായേൽ മക്കളുടെ സമൂഹത്തോടാകെ സംസാരിച്ച് അവരോടു പറയുക: ‘നിങ്ങൾ വിശുദ്ധരായിരിക്കണം; കാരണം ഞാൻ, നിങ്ങളുടെ ദൈവമായ യഹോവ, വിശുദ്ധനാണ്.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: സംസാരിച്ച്
  rationale: പീയേൽ ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള നിർദേശം നിലനിർത്തുന്നു; തുടർന്നുള്ള וְאָמַרְתָּയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ആജ്ഞാക്രമം സൃഷ്ടിക്കുന്നു.
- source_word: כָּל עֲדַת
  choice: സമൂഹം മുഴുവനോടും
  rationale: עֵדָה സൂചിപ്പിക്കുന്ന ഒത്തുചേർന്ന ഉടമ്പടിസമൂഹത്തിന്റെ കൂട്ടായ അർഥവും כָּל എന്ന സമഗ്രതയും വ്യക്തമായി നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ
  rationale: ഹീബ്രുവിലെ പുത്രസംബന്ധമായ രൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: അവരോടു പറയുക
  rationale: നിയമപ്രസംഗത്തിലെ സാധാരണ ആജ്ഞാക്രമം നേരിട്ടും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: നിങ്ങൾ വിശുദ്ധരായിരിക്കണം
  rationale: വിശേഷണം കൂടിയ അപൂർണക്രിയ ഇവിടെ നൽകുന്ന നിർബന്ധാത്മകവും ഉടമ്പടിപരവുമായ ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; പ്രവചനമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: קָדוֹשׁ
  choice: വിശുദ്ധൻ
  rationale: ദൈവത്തോടു ബന്ധപ്പെട്ട קדוש എന്ന പദത്തിന്റെ സ്ഥാപിതവും സമഗ്രവുമായ മലയാള പദം; ‘വേർതിരിക്കപ്പെട്ടവൻ’ എന്നത് അർഥത്തിന്റെ ഒരു ഭാഗം മാത്രമേ നൽകൂ.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയവും ഉടമ്പടിസൂത്രത്തിലെ ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസമൂഹപരമായ പ്രയോഗം
  choice: ഇസ്രായേൽമക്കളുടെ
  alternative: ഇസ്രായേല്യരുടെ / ഇസ്രായേൽജനത്തിന്റെ
  rationale: മൂലത്തിലെ പുത്രസംബന്ധമായ ഭാഷ പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; അതേസമയം ഇത് സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നതാണെന്ന് പാദക്കുറിപ്പിലെ സ്വാഭാവിക പകരം വ്യക്തമാക്കുന്നു.
- issue: വിശുദ്ധരാകാനുള്ള നിർദേശത്തിന്റെ ഭാവം
  choice: നിങ്ങൾ വിശുദ്ധരായിരിക്കണം
  alternative: വിശുദ്ധരായിരിക്കുക / നിങ്ങൾ വിശുദ്ധരാകും
  rationale: ഹീബ്രു അപൂർണക്രിയയ്ക്ക് ഇവിടെ ആജ്ഞാപരമായോ ബാധ്യതാപരമായോ ശക്തിയുണ്ട്. ‘ആയിരിക്കണം’ അത് വ്യക്തമായി നൽകുന്നു; സാധുവായ ആജ്ഞാരൂപം പാദക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയായി മാറ്റാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമപ്രസംഗശൈലി. വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും മൂലത്തിലെ സമൂഹപരമായ അഭിസംബോധന, വിശുദ്ധിയുടെ നിർബന്ധാത്മക ശക്തി, ദൈവനാമം എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്.
