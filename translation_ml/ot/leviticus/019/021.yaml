source:
  edition: WLC
  text: וְ/הֵבִ֤יא אֶת אֲשָׁמ/וֹ֙ לַֽ/יהוָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד אֵ֖יל אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: ml
  text: 'അവൻ തന്റെ കുറ്റപരിഹാരയാഗം യാഹ്‌വേക്കു, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിലേക്കു കൊണ്ടുവരണം: കുറ്റപരിഹാരയാഗമായി ഒരു ആട്ടുകൊറ്റനെ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദമായ אָשָׁם കുറ്റത്തെയും അതിനുള്ള പരിഹാരമായി അർപ്പിക്കുന്ന യാഗത്തെയും സൂചിപ്പിക്കാം; അതിനാൽ ‘കുറ്റയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: കൊണ്ടുവരണം
  rationale: നിയമസന്ദർഭത്തിലെ നിർദേശാത്മക അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשָׁמוֹ
  choice: തന്റെ കുറ്റപരിഹാരയാഗം
  rationale: אָשָׁם കുറ്റത്തെയും അതിനുള്ള പരിഹാരമായി അർപ്പിക്കുന്ന യാഗത്തെയും സൂചിപ്പിക്കാം; ഇവിടെ യാഗസന്ദർഭമായതിനാൽ സംയുക്തപദം രണ്ടു ആശയങ്ങളും നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യാഹ്‌വേയുടെ സന്നിധിയിലേക്ക്
  rationale: לְ എന്നതിന്റെ ദിശാസൂചനയും യാഗം യാഹ്‌വേയ്ക്ക് സമർപ്പിക്കുന്നതാണെന്ന ആശയവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל־פֶּתַח
  choice: പ്രവേശനകവാടത്തിലേക്ക്
  rationale: פֶּתַח എന്ന പ്രവേശനം/വാതിൽ എന്ന അർഥം വിശുദ്ധമന്ദിരസന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: യാഹ്‌വേയുമായി കൂടിക്കാഴ്ചയ്ക്കുള്ള വിശുദ്ധകൂടാരത്തിന്റെ സ്ഥിരവും പരിചിതവുമായ മലയാളനാമം.
- source_word: אֵיל
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്ന אֵיל എന്ന പദത്തിന്റെ കൃത്യമായ മലയാളം.
- source_word: אָשָׁם
  choice: കുറ്റപരിഹാരയാഗമായി
  rationale: അവസാന പ്രയോഗം ആട്ടുകൊറ്റന്റെ യാഗപരമായ ധർമ്മത്തെ സമാനാധികരണമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: എബ്രായപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: אָשָׁם എന്ന യാഗനാമത്തിലെ അർഥവ്യാപ്തി
  choice: കുറ്റപരിഹാരയാഗം
  alternative: കുറ്റയാഗം; പ്രായശ്ചിത്തയാഗം
  rationale: പദത്തിൽ ഉൾപ്പെടുന്ന കുറ്റവും അതിനുള്ള നഷ്ടപരിഹാര/പരിഹാരയാഗവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; ഏതെങ്കിലും പ്രത്യേക സിദ്ധാന്തപരമായ വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ‘കൊണ്ടുവരണം’ നിർബന്ധസ്വഭാവം വ്യക്തമാക്കുന്നു; വാക്യത്തിലെ ദീർഘരേഖ അവസാനത്തെ സമാനാധികരണ വിശദീകരണത്തെ വേർതിരിക്കുന്നു.
