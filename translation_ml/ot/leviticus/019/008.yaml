reference: Leviticus 19:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: ml
  text: അതു തിന്നുന്നവൻ തന്റെ അകൃത്യം വഹിക്കേണ്ടിവരും[a]; കാരണം അവൻ യഹോവയ്ക്കുള്ള വിശുദ്ധവസ്തുവിനെ അപവിത്രമാക്കിയിരിക്കുന്നു[b]. ആ വ്യക്തി സ്വന്തം ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ കുറ്റം വഹിക്കേണ്ടിവരും.’ ഈ എബ്രായ പ്രയോഗം കുറ്റബാധ്യതയെയും അതിന്റെ പരിണതഫലങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘യഹോവയ്ക്കുള്ള വിശുദ്ധവസ്തു’ എന്നത് യഹോവയ്ക്കായി വേർതിരിക്കപ്പെട്ടതിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഇവിടെ അത് യാഗമാംസമാണ്.
    reason: cultural_note
  - marker: c
    text: ‘ഛേദിക്കപ്പെടും’ എന്നത് ഉടമ്പടിസംബന്ധമായ ഒരു ശിക്ഷാസൂത്രമാണ്. അത് മരണമാണോ, സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലാണോ, നേരിട്ടുള്ള ദൈവിക ന്യായവിധിയാണോ എന്ന് ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല. എബ്രായത്തിൽ ‘ആ ജീവൻ’ എന്നാണ്; നിയമപ്രയോഗത്തിൽ അതിന്റെ അർഥം ‘ആ വ്യക്തി’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: അതു തിന്നുന്നവൻ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ യാഗമാംസം നിരോധിത സമയത്ത് തിന്നുന്ന ഏതൊരാളെയും സൂചിപ്പിക്കുന്ന പൊതുവായ ഏകവചന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: തന്റെ അകൃത്യത്തിന്റെ ഭാരം വഹിക്കണം
  rationale: കുറ്റബാധ്യതയും അതിന്റെ പരിണതഫലങ്ങളും ഉൾക്കൊള്ളാവുന്ന എബ്രായ ശൈലി വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: തുടർന്നുവരുന്നത് ശിക്ഷയുടെ കാരണമാണെന്ന് ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: קֹדֶשׁ יְהוָה
  choice: യഹോവയ്ക്കുള്ള വിശുദ്ധവസ്തു
  rationale: യഹോവയ്ക്കായി വേർതിരിക്കപ്പെട്ട വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ യാഗമാംസമാണെങ്കിലും മൂലവാക്യത്തിൽ ഇല്ലാത്ത ‘യാഗം’ എന്ന വിശദീകരണം പ്രധാന പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: חִלֵּל
  choice: അശുദ്ധമാക്കിയിരിക്കുന്നു
  rationale: വിശുദ്ധമായതിനെ സാധാരണമായോ അവിശുദ്ധമായോ കണക്കാക്കി അതിന്റെ വിശുദ്ധത ലംഘിക്കുന്ന പ്രവൃത്തിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וְנִכְרְתָה
  choice: ഛേദിക്കപ്പെടണം
  rationale: മരണം, സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കൽ, ദൈവിക ന്യായവിധി എന്നിവയിൽ ഒന്നായി അർഥം പരിമിതപ്പെടുത്താതെ ഉടമ്പടിസംബന്ധമായ ശിക്ഷാസൂത്രത്തിന്റെ രൂപകം നിലനിർത്തുന്നു.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ആ വ്യക്തി
  rationale: ‘ജീവൻ/പ്രാണൻ’ എന്ന പദം നിയമസന്ദർഭത്തിൽ മുഴുവൻ വ്യക്തിയെയും സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാള പ്രയോഗം സ്വീകരിക്കുന്നു.
- source_word: מֵעַמֶּיהָ
  choice: തന്റെ ജനത്തിൽനിന്ന്
  rationale: נֶפֶשׁ എന്ന വ്യാകരണപരമായി സ്ത്രീലിംഗമായ നാമത്തോടു ചേരുന്ന പ്രത്യയം കുറ്റം ചെയ്ത വ്യക്തിയുടെ ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ലിംഗനിരപേക്ഷമായി സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: ‘ഛേദിക്കപ്പെടുക’ എന്ന ശിക്ഷാസൂത്രത്തിന്റെ അർഥം
  choice: ശിക്ഷ നടപ്പാകുന്ന രീതി വ്യക്തമാക്കാതെ ‘തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടണം’ എന്ന സൂത്രം നിലനിർത്തി.
  alternative: ‘വധിക്കപ്പെടണം’, ‘സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടണം’, അല്ലെങ്കിൽ ‘ദൈവിക ന്യായവിധിയാൽ നീക്കപ്പെടണം’.
  rationale: ഈ വാക്യത്തിൽ ശിക്ഷയുടെ കൃത്യമായ രീതി എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ യഥാർഥമായ നിയമ-ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: עֲוֺנוֹ יִשָּׂא എന്ന പ്രയോഗത്തിലെ കുറ്റവും പരിണതഫലവും
  choice: ‘തന്റെ അകൃത്യത്തിന്റെ ഭാരം വഹിക്കണം’ എന്ന വിശാലമായ പ്രയോഗം ഉപയോഗിച്ചു.
  alternative: ‘തന്റെ കുറ്റം വഹിക്കണം’ അല്ലെങ്കിൽ ‘തന്റെ അകൃത്യത്തിനുള്ള ശിക്ഷ അനുഭവിക്കണം’.
  rationale: പ്രയോഗത്തിന് കുറ്റബാധ്യതയെയും അതിന്റെ ശിക്ഷാഫലത്തെയും ഉൾക്കൊള്ളാൻ കഴിയും; ‘ശിക്ഷ’ എന്നു മാത്രം വിവർത്തനം ചെയ്യുന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അകൃത്യത്തിന്റെ ഭാരം വഹിക്കുക’, ‘ഛേദിക്കപ്പെടുക’ എന്നീ ഗൗരവമുള്ള ബൈബിൾ രൂപകങ്ങൾ അവയുടെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്താൻ ഉപയോഗിച്ചു; ആവശ്യമായ വിശദീകരണം അടിക്കുറിപ്പുകളിൽ നൽകി.
