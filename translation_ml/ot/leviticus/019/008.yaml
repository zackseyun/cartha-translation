- from: അതു തിന്നുന്നവൻ തന്റെ അകൃത്യത്തിന്റെ ഭാരം വഹിക്കണം[a]; കാരണം അവൻ യഹോവയ്ക്കുള്ള വിശുദ്ധവസ്തുവിനെ അശുദ്ധമാക്കിയിരിക്കുന്നു[b]. ആ വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടണം[c].
  to: അതു തിന്നുന്നവൻ തന്റെ അകൃത്യം വഹിക്കേണ്ടിവരും[a]; കാരണം അവൻ യഹോവയ്ക്കുള്ള വിശുദ്ധവസ്തുവിനെ അപവിത്രമാക്കിയിരിക്കുന്നു[b]. ആ വ്യക്തി സ്വന്തം ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും[c].
