id: LEV.19.11
reference: Leviticus 19:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֖א תִּגְנֹ֑בוּ וְ/לֹא תְכַחֲשׁ֥וּ וְ/לֹֽא תְשַׁקְּר֖וּ אִ֥ישׁ בַּ/עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: ml
  text: നിങ്ങൾ മോഷ്ടിക്കരുത്; വഞ്ചനയോടെ പെരുമാറരുത്; പരസ്പരം കള്ളം പറയരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: നിങ്ങൾ മോഷ്ടിക്കരുത്
  rationale: לֹא ചേർന്ന Qal imperfect ഇവിടെ നിയമപരമായ നിരോധനമാണ്. גנב എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മോഷ്ടിക്കുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: תְכַחֲשׁוּ
  choice: വഞ്ചനയോടെ പെരുമാറരുത്
  rationale: כחש എന്ന Piel രൂപത്തിന് വഞ്ചിക്കുക, വ്യാജമായി നിഷേധിക്കുക, കപടമായി ഇടപെടുക എന്നീ അർഥവ്യാപ്തിയുണ്ട്. ഈ സാമൂഹിക നിരോധനങ്ങളുടെ നിരയിൽ, വാക്കുകളിലെ നിഷേധത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കാതെ പൊതുവായ അസത്യപരമായ ഇടപാടിനെ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
- source_word: תְשַׁקְּרוּ
  choice: കള്ളം പറയരുത്
  rationale: שקר എന്ന Piel രൂപം ഇവിടെ മറ്റൊരാളോടുള്ള അസത്യപ്രസ്താവനയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘കള്ളം പറയുക’ എന്നത് വ്യക്തവും സാധാരണവുമായ പ്രയോഗമാണ്.
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: പരസ്പരം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരാൾ തന്റെ സഹവാസിയോട്/സഹജനത്തോട്’ എന്ന വിതരണാത്മക പ്രയോഗമാണിത്. സന്ദർഭത്തിലെ പരസ്പരബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘പരസ്പരം’ വ്യക്തമാക്കുന്നു; പുരുഷന്മാർക്ക് മാത്രമായുള്ള കല്പനയെന്ന തെറ്റിദ്ധാരണയും ഒഴിവാക്കുന്നു.
- source_word: עֲמִית
  choice: പരസ്പരം എന്ന സമഗ്രപ്രയോഗത്തിൽ ഉൾപ്പെടുത്തി
  rationale: עמית എന്നത് സമൂഹത്തിലെ സഹാംഗം, സഹവാസി, അയൽക്കാരൻ എന്നിവയെ സൂചിപ്പിക്കാം. മുഴുവൻ എബ്രായ പ്രയോഗവും പരസ്പരാർഥത്തിൽ പ്രവർത്തിക്കുന്നതിനാൽ പ്രത്യേക നാമപദമായി കൃത്രിമമായി ആവർത്തിക്കാതെ ‘പരസ്പരം’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: אִישׁ ... עֲמִיתוֹ എന്ന വ്യാകരണപരമായി പുല്ലിംഗത്തിലുള്ള വിതരണാത്മക പ്രയോഗം
  choice: പ്രതിനിധാനപരമായ പൊതുവർഗാർഥം നിലനിർത്തി ‘പരസ്പരം’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ഓരോ പുരുഷനും തന്റെ അയൽക്കാരനോട്’ അല്ലെങ്കിൽ ‘ഒരാൾ തന്റെ സഹജനത്തോട്’
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചനം ഇവിടെ പുരുഷന്മാരെ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല; സമൂഹാംഗങ്ങളെ പൊതുവായി പ്രതിനിധീകരിക്കുന്നു. അതിനാൽ സ്വാഭാവികവും ലിംഗാർഥത്തിൽ കൃത്യവുമായ മലയാളം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്നതുമായ മലയാളം. എബ്രായത്തിലെ മൂന്നു സമാന്തര നിരോധനങ്ങളും അർധവിരാമങ്ങളിലൂടെ വ്യക്തമായി നിലനിർത്തി; രണ്ടാമത്തെയും മൂന്നാമത്തെയും ക്രിയകളുടെ അർഥവ്യത്യാസം ‘വഞ്ചനയോടെ പെരുമാറുക’ / ‘കള്ളം പറയുക’ എന്നിങ്ങനെ സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് ചിഹ്നവും അതിന്റെ ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുള്ളതിനാൽ, മലയാള മുഖ്യപാഠത്തിന് അനാവശ്യമായ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
