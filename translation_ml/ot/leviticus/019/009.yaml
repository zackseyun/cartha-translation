translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ബഹുവചനത്തിൽ ആരംഭിക്കുന്ന എബ്രായവാക്യം തുടർന്ന് ഏകവചനത്തിലേക്ക് മാറുന്നതു മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ പൊതുവായ അഭിസംബോധനയായി അവതരിപ്പിച്ചു. അടിക്കുറിപ്പുസൂചകം ബന്ധപ്പെട്ട ആശയഖണ്ഡത്തിന്റെ അവസാനം ചേർത്തു.
