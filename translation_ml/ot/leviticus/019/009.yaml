id: LEV.19.9
reference: Leviticus 19:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶם֙ אֶת קְצִ֣יר אַרְצְ/כֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְ/ךָ֖ לִ/קְצֹ֑ר וְ/לֶ֥קֶט קְצִֽירְ/ךָ֖ לֹ֥א תְלַקֵּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: ml
  text: നിങ്ങളുടെ നിലത്തിലെ വിളവ് കൊയ്യുമ്പോൾ, നിങ്ങളുടെ വയലിന്റെ അരിക്[a] മുഴുവനും കൊയ്യരുത്; നിങ്ങളുടെ കൊയ്ത്തിൽ അവശേഷിക്കുന്ന കതിരുകൾ പെറുക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വയലിന്റെ മൂല’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘അരിക്’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന എബ്രായ പദത്തിന് അരിക്, വശം, മൂല എന്നീ അർഥങ്ങളുണ്ട്; ഇവിടെ കൊയ്യാതെ വിടേണ്ട വയലിന്റെ പുറംഭാഗത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: കൊയ്യുമ്പോൾ
  rationale: בְּ + infinitive construct ഇവിടെ കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘കൊയ്യുമ്പോൾ’ ആ നിയമപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: קְצִיר אַרְצְכֶם
  choice: നിങ്ങളുടെ നിലത്തിലെ വിളവ്
  rationale: קְצִיר ഇവിടെ കൊയ്ത്തിനുള്ള വിളവിനെയും വിളവെടുപ്പിനെയും സൂചിപ്പിക്കാം; കൃഷിസന്ദർഭത്തിൽ ‘നിലത്തിലെ വിളവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്. אֶרֶץ ഇവിടെ രാഷ്ട്രീയമായ ദേശമല്ല, കൃഷിഭൂമിയാണ്.
- source_word: לֹא תְכַלֶּה ... לִקְצֹר
  choice: മുഴുവനായി കൊയ്യരുത്
  rationale: Piel രൂപത്തിലുള്ള כלה ‘പൂർത്തിയാക്കുക/മുഴുവനാക്കുക’ എന്നർഥം നൽകുന്നു; לִקְצֹר വ്യക്തമാക്കുന്ന കൊയ്ത്തുപ്രവൃത്തി ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: פְּאַת שָׂדְךָ
  choice: വയലിന്റെ അരികുവരെ
  rationale: פֵּאָה എന്നത് അരിക്, വശം, മൂല എന്നിവ സൂചിപ്പിക്കാം. കൃഷിസന്ദർഭത്തിൽ ‘അരിക്’ പുറംഭാഗത്തെ വ്യക്തമായി അറിയിക്കുന്നു; -വരെ എന്ന പ്രയോഗം വയലിനെ അരികോളം പൂർണമായി കൊയ്യരുതെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֶקֶט קְצִירְךָ
  choice: കൊയ്ത്തിൽ വീണുകിടക്കുന്ന കതിരുകൾ
  rationale: לֶקֶט പ്രധാന കൊയ്ത്തിനിടെ വീണുപോയതോ ശേഷിച്ചതോ ആയ വിളവിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ പ്രത്യേക സാങ്കേതിക പദത്തേക്കാൾ ഈ വിവരണാത്മക പ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകും.
- source_word: לֹא תְלַקֵּט
  choice: പെറുക്കുകയും അരുത്
  rationale: לקט എന്ന ക്രിയ നിലത്തുനിന്ന് ശേഷിച്ച വിളവ് പെറുക്കിച്ചേർക്കുന്നതാണ്. ‘പെറുക്കുക’ ഈ സാഹചര്യത്തിലെ പ്രവർത്തിയെ കൃത്യമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
