- from: നിങ്ങളുടെ നിലത്തിലെ വിളവ് കൊയ്യുമ്പോൾ, വയലിന്റെ അരികുവരെ മുഴുവനായി കൊയ്യരുത്; കൊയ്ത്തിൽ വീണുകിടക്കുന്ന കതിരുകൾ പെറുക്കുകയും അരുത്.[a]
