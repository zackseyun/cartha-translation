theological_decisions:
- issue: קֹדֶשׁ הִלּוּלִים എന്ന അപൂർവ ആരാധനാപദസമുച്ചയത്തിന്റെ അർഥം
  choice: യഹോവയ്ക്കുള്ള സ്തുതിയാഘോഷത്തിനായി വിശുദ്ധം
  alternative: ‘യഹോവയ്ക്കുള്ള സ്തുതികൾ—വിശുദ്ധം’ അല്ലെങ്കിൽ ‘യഹോവയെ സ്തുതിക്കാനായി വിശുദ്ധം’
  rationale: ഹീബ്രു പദസമുച്ചയം ഫലത്തെ ഒരു പ്രത്യേക ‘യാഗം’ എന്നു വ്യക്തമായി വിളിക്കുന്നില്ല. സ്തുതി, ആഘോഷം, വിശുദ്ധ സമർപ്പണം എന്നിവ തമ്മിലുള്ള ബന്ധം പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായി നൽകുകയും അപൂർവ പ്രയോഗത്തിന്റെ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
