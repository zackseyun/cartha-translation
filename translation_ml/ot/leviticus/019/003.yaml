id: LEV.19.3
reference: Leviticus 19:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: ml
  text: ഓരോ പുരുഷനും[a] തന്റെ അമ്മയെയും അപ്പനെയും ഭയപ്പെടണം[b]. നിങ്ങൾ എന്റെ ശബ്ബത്തുകൾ ആചരിക്കണം. ഞാൻ യഹ്‌വേ, നിങ്ങളുടെ ദൈവം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഓരോ വ്യക്തിയും.’ എബ്രായത്തിൽ ‘പുരുഷൻ’ എന്ന ഏകവചനരൂപം സമൂഹത്തിലെ ഓരോരുത്തരെയും പ്രത്യേകം സൂചിപ്പിക്കുന്ന വിധത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഭയഭക്തിയോടെ ആദരിക്കണം.’ എബ്രായക്രിയയ്ക്ക് ഭയം എന്നതോടൊപ്പം ആദരപൂർവമായ ഭയഭക്തി എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ഓരോ പുരുഷനും
  rationale: പുരുഷലിംഗ ഏകവചനമായ പദം സമൂഹത്തിലെ ഓരോ അംഗത്തെയും പ്രത്യേകം ചൂണ്ടിക്കാണിക്കുന്ന വിതരണാർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. മൂലപാഠത്തിന്റെ പുരുഷലിംഗ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ സമൂഹവ്യാപക പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אִמּוֹ וְאָבִיו
  choice: തന്റെ അമ്മയെയും അപ്പനെയും
  rationale: മൂലപാഠം അമ്മയെ ആദ്യം, അപ്പനെ പിന്നീട് പ്രത്യേകം പേരെടുത്തു പറയുന്നു. ആ ക്രമവും ബന്ധപദങ്ങളും ‘മാതാപിതാക്കൾ’ എന്നു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: תִּירָאוּ
  choice: ഭയപ്പെടണം
  rationale: ירא എന്ന ക്രിയയ്ക്ക് ഭയം, ഭയഭക്തി, ആദരപൂർവമായ ഭയം എന്നീ അർഥവ്യാപ്തികളുണ്ട്. ശക്തമായ നേരിട്ടുള്ള അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും ‘ഭയഭക്തിയോടെ ആദരിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: שַׁבְּתֹתַי
  choice: എന്റെ ശബ്ബത്തുകൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനവും ദൈവിക ഉടമസ്ഥതയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: תִּשְׁמֹרוּ
  choice: ആചരിക്കണം
  rationale: ശബ്ബത്തുകളോടൊപ്പം שׁמר എന്ന ക്രിയ സൂക്ഷ്മമായി പാലിക്കുക/ആചരിക്കുക എന്ന അർഥത്തിലാണ്. ആധുനിക മലയാളത്തിൽ ‘ആചരിക്കുക’ സ്വാഭാവികവും നിയമാനുഷ്ഠാനത്തിന്റെ ആശയം വ്യക്തവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: ഇവിടെ യഹ്‌വേയെ സൂചിപ്പിക്കുന്ന ഉടമ്പടി സൂത്രവാക്യത്തിൽ ഏകവചന അർഥമാണ്; അതിനാൽ ‘നിങ്ങളുടെ ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: മാതാപിതാക്കളോടുള്ള നിർദേശത്തിലെ ירא എന്ന ക്രിയയുടെ ഭാവം
  choice: ഭയപ്പെടണം
  alternative: ഭയഭക്തിയോടെ ആദരിക്കണം
  rationale: മൂലക്രിയയിൽ യഥാർഥ ഭയത്തിന്റെയും ആദരപൂർവമായ ഭയഭക്തിയുടെയും അർഥസാധ്യതകളുണ്ട്. മുഖ്യപാഠത്തിൽ ശക്തമായ നേരിട്ടുള്ള സമാനപദം ഉപയോഗിച്ച് അർഥത്തിന്റെ സംഘർഷം നിലനിർത്തുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ആരംഭത്തിലെ വിതരണാർഥമുള്ള പുരുഷലിംഗ ഏകവചനം
  choice: ഓരോ പുരുഷനും
  alternative: ഓരോ വ്യക്തിയും / ഓരോരുത്തനും
  rationale: אִישׁ വ്യാകരണപരമായി പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും കല്പന സമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്നു. മൂലരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അതിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- issue: ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ സ്ഥാനപ്പേരല്ല, יְהוָה എന്ന വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ നാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അമ്മ’യും ‘അപ്പൻ’യും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ബന്ധപദങ്ങളായി ഉപയോഗിച്ചു. കല്പനയുടെ ഏകവചന-ബഹുവചന നീക്കം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ആദ്യവാക്യത്തിൽ വിതരണാർഥമുള്ള ഏകവചനവും തുടർന്ന് സമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന ‘നിങ്ങൾ’ എന്ന ബഹുവചനവും നിലനിർത്തി.
