  text: וְ/אִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: ml
  text: എന്നാൽ അത് മൂന്നാം ദിവസം ഭക്ഷിച്ചാൽത്തന്നെ, അത് അറപ്പുളവാക്കുന്ന ഒന്നാണ്[a]; അത് അംഗീകരിക്കപ്പെടുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദുർഗന്ധമുള്ള ഒന്ന്’ അല്ലെങ്കിൽ ‘അസ്വീകാര്യമായ ഒന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. അനുവദിച്ച സമയത്തിനപ്പുറം ഭക്ഷിച്ചതിനാൽ ബലിമാംസം ബലിയർപ്പണപരമായി അസ്വീകാര്യമായിത്തീരുന്നതിനെയാണ് ഇവിടെ ഹീബ്രായ പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ചെയ്താൽ
  rationale: മുൻ നിർദേശത്തോടുള്ള വിപരീതസാധ്യതയും വ്യവസ്ഥയുടെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് അറിയിക്കുന്നു.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: ഭക്ഷിക്കുകതന്നെ ചെയ്താൽ
  rationale: ക്രിയയ്ക്കുമുമ്പുള്ള infinitive absolute നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ ‘തന്നെ’ ഉപയോഗിച്ച് നിലനിർത്തുന്നു.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: കാലസൂചനയുടെ നേരായതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: פִּגּוּל
  choice: മലിനമായ ഒന്ന്
  rationale: ബലിമാംസം അനുവദിച്ച സമയത്തിനപ്പുറം ഭക്ഷിച്ചതിനാൽ ആരാധനാക്രമപരമായി അസ്വീകാര്യമായിത്തീരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘മഹാമ്ലേച്ഛത’ പോലുള്ള അതിശക്തമായ പദം ഒഴിവാക്കുന്നു.
- source_word: הוּא
  choice: അത് ... ആണ്
  rationale: ഹീബ്രായയിലെ ഊന്നലുള്ള വിധേയപ്രയോഗം വ്യക്തമായ മലയാള വാക്യമായി നിലനിർത്തുന്നു.
- source_word: לֹא יֵרָצֶה
  choice: അത് അംഗീകരിക്കപ്പെടുകയില്ല
  rationale: ബലിയുടെ സന്ദർഭത്തിൽ רצה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ദൈവസന്നിധിയിലെ സ്വീകാര്യതയെ സൂചിപ്പിക്കുന്നു; കർത്താവിനെ മൂലവാക്യത്തിൽ ഇല്ലാത്തവിധം തുറന്നുപറയുന്നില്ല.
theological_decisions:
- issue: മൂന്നാം ദിവസം ഭക്ഷിക്കപ്പെട്ട ബലിമാംസത്തിന്റെ സ്ഥിതി
  choice: ആ മാംസം ആരാധനാക്രമപരമായി മലിനവും അതിനാൽ അസ്വീകാര്യവുമാണെന്ന് വാക്യം പ്രഖ്യാപിക്കുന്നു.
  alternative: അത് കേവലം കേടുവന്നതോ ഭൗതികമായി ദുഷിച്ചതോ ആണെന്ന വായന; അല്ലെങ്കിൽ മറ്റു ഹീബ്രായ വിലക്കുപദങ്ങൾ സൂചിപ്പിക്കുന്ന അതേ അർഥത്തിൽ അതിനെ അത്യന്തം നിന്ദ്യമായ ഒന്നായി കാണുന്ന വായന.
  rationale: തൊട്ടടുത്ത ബലിനിയമസന്ദർഭവും ‘അംഗീകരിക്കപ്പെടുകയില്ല’ എന്ന അവസാന വാക്യഭാഗവും പദത്തിന് ബലിയർപ്പണപരമായ അർഥം നൽകുന്നു. ഭൗതിക കേടോ കൂടുതൽ വിശാലമായ ധാർമിക വിഭാഗമോ പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ഭക്ഷിക്കുകതന്നെ ചെയ്താൽ’ എന്ന രൂപം ഹീബ്രായയിലെ ഊന്നൽ സൂക്ഷിക്കുന്നു; ‘അത് അംഗീകരിക്കപ്പെടുകയില്ല’ എന്നത് സ്വീകരിക്കുന്നത് ആരാണെന്ന് മൂലപാഠത്തിലുള്ള പരോക്ഷത നിലനിർത്തുന്നു.
