  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן בְּ/אֵ֤יל הָֽ/אָשָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/נִסְלַ֣ח ל֔/וֹ מֵ/חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: ml
  text: പുരോഹിതൻ അവനുവേണ്ടി, അവൻ ചെയ്ത പാപത്തിനായി, കുറ്റപരിഹാരയാഗത്തിന്റെ ആട്ടുകൊറ്റനെക്കൊണ്ട് യഹോവയുടെ സന്നിധിയിൽ പ്രായശ്ചിത്തം നിർവഹിക്കും[a]; അവൻ ചെയ്ത പാപത്തിന് അവന്നു ക്ഷമ ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കുറ്റപരിഹാരയാഗം” എന്നതിനു “അപരാധയാഗം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ אָשָׁם കുറ്റത്തെയും ഈ യാഗത്തിന്റെ നഷ്ടപരിഹാരപരമായ വശത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: പുരോഹിതൻ അവനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പുരോഹിതൻ ഒരാൾക്കുവേണ്ടി നിർവഹിക്കുന്ന യാഗകർമത്തെ സൂചിപ്പിക്കുന്ന כפר על എന്ന പ്രയോഗത്തിന്റെ ആചാരപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בְּאֵיל הָאָשָׁם
  choice: കുറ്റപരിഹാരയാഗത്തിനുള്ള ആട്ടുകൊറ്റനെക്കൊണ്ട്
  rationale: איל എന്നത് ആട്ടുകൊറ്റൻ എന്നും אָשָׁם കുറ്റത്തോടൊപ്പം നഷ്ടപരിഹാരപരമായ വശമുള്ള പ്രത്യേക യാഗം എന്നും സൂചിപ്പിക്കുന്നു; ഉപകരണാർഥകമായ בְ ‘-നെക്കൊണ്ട്’ എന്നു നൽകി.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: യാഗാരാധനയുടെ ഔപചാരിക പശ്ചാത്തലത്തിലുള്ള ‘യഹോവയുടെ മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന സ്ഥാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദൈവനാമം പേരായിത്തന്നെ നിലനിർത്തുന്നു.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: അവൻ ചെയ്ത പാപത്തിനായി
  rationale: എബ്രായത്തിലെ സമാനധാതുപ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וְנִסְלַח לוֹ מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: അപ്പോൾ അവൻ ചെയ്ത പാപം അവനോടു ക്ഷമിക്കപ്പെടും
  rationale: സലഹ് എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള കർമണിപ്രയോഗവും പറയാതെവച്ചിരിക്കുന്ന ദൈവിക കർത്താവും സംരക്ഷിക്കുന്നു; מן ഉൾപ്പെട്ട ക്ഷമാസൂത്രം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു.
- issue: אָשָׁם യാഗത്തിന്റെ സ്വഭാവം
  choice: കുറ്റപരിഹാരയാഗം
  alternative: അപരാധയാഗം
  rationale: പദത്തിൽ കുറ്റത്തിന്റെ ആശയത്തോടൊപ്പം നഷ്ടം നികത്തുന്ന/പരിഹരിക്കുന്ന വശവും ഉള്ളതിനാൽ ‘കുറ്റപരിഹാരയാഗം’ ഇരുവശവും കൂടുതൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; അടിക്കുറിപ്പിൽ പദത്തിന്റെ അർഥവ്യാപ്തി വ്യക്തമാക്കുന്നു.
- issue: ക്ഷമയുടെ കർത്താവ്
  choice: കർമണിപ്രയോഗത്തിൽ കർത്താവിനെ പറയാതെവയ്ക്കുന്നു
  alternative: യഹോവ അവനോടു ക്ഷമിക്കും
  rationale: എബ്രായപാഠം ക്ഷമയുടെ ദൈവിക കർത്താവിനെ വ്യക്തമായി ചേർക്കാതെ കർമണിരൂപം ഉപയോഗിക്കുന്നതിനാൽ അതേ സൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ലേവ്യപുസ്തകത്തിലെ യാഗസാങ്കേതികത നിലനിർത്താൻ ‘പ്രായശ്ചിത്തം കഴിക്കുക’, ‘കുറ്റപരിഹാരയാഗം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ ദീർഘവാക്യബന്ധം വായനാസൗകര്യത്തിനായി അർധവിരാമത്തോടെ അവതരിപ്പിച്ചു.
