id: LEV.19.13
reference: Leviticus 19:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תַעֲשֹׁ֥ק אֶת רֵֽעֲ/ךָ֖ וְ/לֹ֣א תִגְזֹ֑ל לֹֽא תָלִ֞ין פְּעֻלַּ֥ת שָׂכִ֛יר אִתְּ/ךָ֖ עַד בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/013.yaml
  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: ml
  text: നിന്റെ അയൽക്കാരനെ ചൂഷണം ചെയ്യരുത്; അവനിൽനിന്ന് കവർന്നെടുക്കരുത്. കൂലിപ്പണിക്കാരന്റെ കൂലി പ്രഭാതം വരെ നിന്റെ പക്കൽ ഇരിക്കരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: പീഡിപ്പിക്കരുത്
  rationale: עָשַׁק എന്ന ക്രിയയ്ക്ക് അധികാരം ദുരുപയോഗം ചെയ്യുക, അർഹമായതു തടഞ്ഞുവെക്കുക, ചൂഷണം ചെയ്യുക എന്നീ വിശാല അർഥങ്ങളുണ്ട്. ‘പീഡിപ്പിക്കുക’ ആ ധാർമ്മിക വ്യാപ്തി നിലനിർത്തുന്നു; തുടർന്നുള്ള കൂലി തടഞ്ഞുവെക്കൽ അതിന്റെ സാമ്പത്തിക പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
- source_word: רֵעֲךָ
  choice: നിന്റെ അയൽക്കാരനെ
  rationale: നിയമ-ധാർമ്മിക സന്ദർഭത്തിൽ רֵעַ സമൂഹത്തിലെ സഹമനുഷ്യനെ സൂചിപ്പിക്കുന്നു. ‘അയൽക്കാരൻ’ തോറായിലെ പരിചിതമായ സാമൂഹിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תִגְזֹל
  choice: അവന്റെത് കവർന്നെടുക്കുകയും അരുത്
  rationale: גָּזַל ബലപ്രയോഗത്തിലൂടെയോ അന്യായമായോ കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കവർന്നെടുക്കുക’ സാധാരണ മോഷണത്തെക്കാൾ ശക്തമായ ഈ അർഥം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ കർമം സ്വാഭാവികമാക്കാൻ ‘അവന്റെത്’ ചേർത്തിരിക്കുന്നു.
- source_word: תָלִין
  choice: വെച്ചിരിക്കരുത്
  rationale: ക്രിയയുടെ അടിസ്ഥാന ആശയം രാത്രി മുഴുവൻ തങ്ങുക അഥവാ നിലനിൽക്കുക എന്നതാണ്. നിരോധനത്തിന്റെ പ്രായോഗിക അർഥമായ കൂലി കൈവശം തടഞ്ഞുവെക്കൽ മലയാളത്തിൽ സ്വാഭാവികമായി ഇതിലൂടെ പ്രകടമാകുന്നു.
- source_word: פְּעֻלַּת
  choice: കൂലി
  rationale: פְּעֻלָּה ജോലി എന്നോ അതിനുള്ള പ്രതിഫലം എന്നോ വരാം; שָׂכִיר-നോടും പണം വൈകിപ്പിക്കരുതെന്ന കല്പനയോടും ചേർന്നതിനാൽ ഇവിടെ ‘കൂലി’ ആണ് പ്രസക്തമായ അർഥം.
- source_word: שָׂכִיר
  choice: കൂലിപ്പണിക്കാരന്റെ
  rationale: שָׂכִיר കൂലിക്കു നിയമിക്കപ്പെട്ട തൊഴിലാളിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കൂലിപ്പണിക്കാരൻ’ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: אִתְּךָ
  choice: നിന്റെ പക്കൽ
  rationale: കൂലി തൊഴിലുടമയുടെ കൈവശം തുടരുന്നതാണ് പ്രയോഗത്തിന്റെ ആശയം. ‘നിന്റെ പക്കൽ’ എബ്രായത്തിന്റെ നേരിട്ടുള്ള ബന്ധവും മലയാളത്തിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: עַד בֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: വൈകിപ്പിക്കാവുന്ന സമയപരിധിയെ ഈ പ്രയോഗം കൃത്യമായി അടയാളപ്പെടുത്തുന്നു. ‘പ്രഭാതംവരെ’ എന്നത് ‘രാത്രിയൊട്ടാകെ’ എന്ന പരാവർത്തനത്തേക്കാൾ മൂലപാഠത്തിലെ സമയസൂചന നേരിട്ട് സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ മൂന്ന് സമാന്തര നിരോധനങ്ങളും സാമ്പത്തിക-സാമൂഹിക നീതിയുടെ ഊന്നലും സംക്ഷിപ്തമായി നിലനിർത്തിയിരിക്കുന്നു.
