revisions:
- from: നിന്റെ അയൽക്കാരനെ പീഡിപ്പിക്കരുത്; അവന്റെത് കവർന്നെടുക്കുകയും അരുത്. കൂലിപ്പണിക്കാരന്റെ കൂലി പ്രഭാതംവരെ നിന്റെ പക്കൽ വെച്ചിരിക്കരുത്.
  to: നിന്റെ അയൽക്കാരനെ ചൂഷണം ചെയ്യരുത്; അവനിൽനിന്ന് കവർന്നെടുക്കരുത്. കൂലിപ്പണിക്കാരന്റെ കൂലി പ്രഭാതം വരെ നിന്റെ പക്കൽ ഇരിക്കരുത്.
  rationale: The revision corrects the malformed second prohibition, removes the unnecessary possessive object, and uses terminology that better reflects the exploitation-oriented force of the Hebrew while preserving the concise legal register and the explicit limit ‘until morning.’
