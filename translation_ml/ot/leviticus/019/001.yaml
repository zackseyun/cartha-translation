  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വേ[a] മോശെയോടു ഇങ്ങനെ സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പരമ്പരാഗത പകരവിവർത്തനവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ വാവ്-തുടർച്ചാരൂപം പുതിയ ദൈവിക വചനസംഭവം ആരംഭിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘സംസാരിച്ചു’ എന്നത് ഔപചാരികതയും സ്വാഭാവികതയും ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമമായ YHWH-നെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തിന് അനുസരിച്ച് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֶל
  choice: -ഓടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള വിഭക്തിരൂപം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥിരപ്രചാരമുള്ള രൂപം.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്ന് നേരിട്ടുള്ള വാക്കുകൾ വരുന്നു എന്ന് സൂചിപ്പിക്കുന്ന എബ്രായ വചനാരംഭസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; അവസാനത്തെ ദ്വിബിന്ദുവും അതേ പ്രവർത്തനം നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, YHWH എന്ന വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ പരമ്പരാഗത പകരപ്പേരായ ‘കർത്താവ്’ ഒഴിവാക്കി ദൈവനാമം ലിപ്യന്തരിച്ചു. ‘യഹോവ’ എന്ന രൂപം പരമ്പരാഗത സംയുക്തവായനയെ പ്രതിഫലിപ്പിക്കുന്നതിനാൽ ‘യഹ്‌വേ’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അരുളിച്ചെയ്തു’ പോലുള്ള പഴയ സഭാഭാഷ ഒഴിവാക്കി; തുടർന്നുവരുന്ന ദൈവവചനത്തെ പരിചയപ്പെടുത്താൻ ‘ഇങ്ങനെ’യും ദ്വിബിന്ദുവും ഉപയോഗിച്ചു.
