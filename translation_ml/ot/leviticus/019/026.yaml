  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֥א תֹאכְל֖וּ עַל הַ/דָּ֑ם לֹ֥א תְנַחֲשׁ֖וּ וְ/לֹ֥א תְעוֹנֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: ml
  text: രക്തത്തിന്മേൽ നിങ്ങൾ ഭക്ഷിക്കരുത്.[a] നിങ്ങൾ ശകുനം നോക്കുകയോ ശകുനലക്ഷണങ്ങൾ വ്യാഖ്യാനിക്കുകയോ അരുത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രക്തത്തോടുകൂടെ’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; രക്തമുള്ള മാംസം ഭക്ഷ Jennings?
    reason: alternative_reading
  - marker: b
    text: ഈ രണ്ടു എബ്രായക്രിയകളുടെയും കൃത്യമായ വ്യത്യാസം അനിശ്ചിതമാണ്. രണ്ടാമത്തേത് ‘ഭാവിപറയുക’ എന്നോ, പരമ്പരാഗതമായി, ‘കാലം നോക്കുക’ എന്നോ വിവർത്തനം ചെയ്യപ്പെട്ടിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: നിങ്ങൾ ഭക്ഷിക്കരുത്
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണക്രിയ നിയമസന്ദർഭത്തിൽ നിരോധനമാണ്; ഈ രൂപം ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: עַל הַדָּם
  choice: രക്തത്തിന്മേൽവെച്ച്
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്. കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം തിരഞ്ഞെടുക്കാതെ על എന്ന ബന്ധത്തിന്റെ സുതാര്യതയും മൂലപാഠത്തിലെ അവ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: תְנַחֲשׁוּ
  choice: ശകുനം നോക്കുക
  rationale: נחשׁ എന്ന ക്രിയ ഇവിടെ ശകുനങ്ങളിലൂടെ മറഞ്ഞ കാര്യം അറിയാൻ ശ്രമിക്കുന്ന ദിവ്യജ്ഞാനപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: תְעוֹנֵנוּ
  choice: ലക്ഷണങ്ങൾ വ്യാഖ്യാനിക്കുക
  rationale: ענן എന്ന ക്രിയാരൂപത്തിന്റെ അർഥം വിവാദവിധേയമാണെങ്കിലും ശകുനലക്ഷണങ്ങൾ വായിക്കുകയോ വ്യാഖ്യാനിക്കുകയോ ചെയ്യുന്നതാണ് സാധ്യതയുള്ള അർഥം. പഴയ ‘കാലം നോക്കുക’ എന്ന രൂപത്തേക്കാൾ ഇത് ആധുനിക മലയാളത്തിൽ ഗ്രാഹ്യമാണ്.
theological_decisions:
- issue: עַל הַדָּם എന്ന അവ്യക്തമായ നിരോധനം എത്രത്തോളം നിർദിഷ്ടമായി വിവർത്തനം ചെയ്യണം
  choice: മുഖ്യപാഠത്തിൽ താരതമ്യേന അക്ഷരാർഥമുള്ള ‘രക്തത്തിന്മേൽവെച്ച്’ നിലനിർത്തുക
  alternative: ‘രക്തത്തോടുകൂടെ’, ‘മാംസത്തിൽ രക്തം ശേഷിക്കുമ്പോൾ’, അല്ലെങ്കിൽ ‘രക്താചാരവിരുന്നിൽ’
  rationale: ഈ നിരോധനം രക്തമുള്ള മാംസം ഭക്ഷിക്കുന്നതിനെയോ രക്തവുമായി ബന്ധപ്പെട്ട ആചാരവിരുന്നിനെയോ മറ്റൊരു ആരാധനാചാരത്തെയോ സൂചിപ്പിക്കാം. അനിശ്ചിതത്വം തീർപ്പാക്കാതെ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: תְנַחֲשׁוּ, תְעוֹנֵנוּ എന്നീ സമീപാർഥമുള്ള നിരോധനങ്ങളെ വേർതിരിക്കൽ
  choice: ‘ശകുനം നോക്കുക’, ‘ലക്ഷണങ്ങൾ വ്യാഖ്യാനിക്കുക’ എന്നിങ്ങനെ വേർതിരിക്കുക
  alternative: രണ്ടും പൊതുവായി ‘ദിവ്യജ്ഞാനം അന്വേഷിക്കുക’ അല്ലെങ്കിൽ ‘ലക്ഷണം നോക്കുക’ എന്നു വിവർത്തനം ചെയ്യുക
  rationale: മൂലപാഠത്തിലെ രണ്ടു വ്യത്യസ്ത ക്രിയകൾ കഴിയുന്നത്ര വേർതിരിച്ചുകാട്ടുന്നു; എന്നാൽ അവയുടെ കൃത്യമായ സാങ്കേതിക വ്യത്യാസം ഉറപ്പുള്ളതല്ലെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ‘രക്തത്തിന്മേൽവെച്ച്’ അല്പം അസാധാരണമായി കേൾക്കുന്നത് മൂലപാഠത്തിലെ ഉദ്ദേശ്യപൂർവം സംരക്ഷിച്ച അവ്യക്തത മൂലമാണ്; അടിക്കുറിപ്പ് വായനക്കാരനെ സഹായിക്കുന്നു.
