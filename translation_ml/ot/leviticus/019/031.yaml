source:
  edition: WLC
  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: ml
  text: മരിച്ചവരുമായി ആത്മസമ്പർക്കം നടത്തുന്നവരിലേക്കോ ആത്മാക്കളുമായി ബന്ധപ്പെടുന്നവരിലേക്കോ തിരിയരുത്[a]; അവരാൽ അശുദ്ധരാകാൻ അവരെ അന്വേഷിക്കരുത്. ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹോവ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മരിച്ചവരുമായി ആത്മസമ്പർക്കം നടത്തുന്നവർ’ എന്നതിന് ‘മരിച്ചവരുടെ ആത്മാക്കളെ വിളിച്ചുവരുത്തുന്നവർ’ അല്ലെങ്കിൽ ‘മൃതാത്മാക്കളുമായി ബന്ധപ്പെടുന്നവർ’ എന്നും, ‘ആത്മാക്കളുമായി ബന്ധപ്പെടുന്നവർ’ എന്നതിന് ‘പരിചിതാത്മാവുള്ളവർ’ അല്ലെങ്കിൽ ‘ആത്മജ്ഞാനികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദങ്ങൾ ആത്മാക്കളെയോ മരിച്ചവരെയോ സമീപിക്കുന്നതുമായി ബന്ധപ്പെട്ട നിരോധിത പ്രയോഗകരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: തിരിയരുത്
  rationale: פנה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘തിരിയുക/അഭിമുഖമാകുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സഹായത്തിനോ ഉപദേശത്തിനോ വേണ്ടി സമീപിക്കുന്നതും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָאֹבֹת
  choice: മരിച്ചവരുടെ ആത്മാക്കളെ വിളിച്ചുവരുത്തുന്നവർ
  rationale: אוֹב എന്ന പദം മരിച്ചവരുമായി ആത്മീയ സമ്പർക്കം പുലർത്തുന്നതുമായി ബന്ധപ്പെട്ട ആത്മാവിനെയോ അതിന്റെ പ്രയോഗകനെയോ സൂചിപ്പിക്കാം. ഇവിടെ ബഹുവചനവും יִדְּעֹנִים എന്ന സമാന്തര പ്രയോഗകവിഭാഗവും ഉള്ളതിനാൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ വിവരണാത്മക പരിഭാഷ തിരഞ്ഞെടുത്തു.
- source_word: הַיִּדְּעֹנִים
  choice: ആത്മാക്കളുമായി ബന്ധപ്പെടുന്നവർ
  rationale: יִדְּעֹנִי നിരോധിതമായ ആത്മജ്ഞാനമോ ആത്മസമ്പർക്കമോ നടത്തുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ആധുനിക വായനക്കാർക്ക് തെറ്റിദ്ധാരണയുണ്ടാക്കാവുന്ന ‘മന്ത്രവാദികൾ’ പോലുള്ള വിശാല പദം ഒഴിവാക്കി.
- source_word: תְּבַקְשׁוּ
  choice: അന്വേഷിച്ചുചെന്ന്
  rationale: בקש എന്നതിന്റെ ‘അന്വേഷിക്കുക/തേടുക’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, ഈ വ്യക്തികളെ ഉദ്ദേശപൂർവം സമീപിക്കുന്ന പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְטָמְאָה בָהֶם
  choice: അവരാൽ അശുദ്ധരാകരുത്
  rationale: טמאയുടെ അശുദ്ധമാകുക എന്ന ഫലഭാവം നിലനിർത്തുന്നു; അശുദ്ധി ആചാരപരമോ ധാർമികമോ മാത്രമാണെന്ന് ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള ഉടമ്പടിബന്ധപരമായ അഭിസംബോധന നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: ‘അശുദ്ധരാകുക’ എന്ന് മാത്രം നൽകി ആചാരപരവും ധാർമികവുമായ അർഥസാധ്യതകൾ തുറന്നുവയ്ക്കുക
  alternative: ‘ആചാരപരമായി അശുദ്ധരാകുക’ അല്ലെങ്കിൽ ‘ധാർമികമായി മലിനരാകുക’
  rationale: ലേവ്യപുസ്തകത്തിൽ טמא എന്ന പദത്തിന് ആചാരപരവും ധാർമികവുമായ മാനങ്ങൾ ഉണ്ടാകാം; ഈ വാക്യം അവയിൽ ഒന്നു മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- issue: אוֹב, יִדְּעֹנִי എന്നിവ ആത്മാക്കളെയോ പ്രയോഗകരെയോ സൂചിപ്പിക്കുന്നതിലെ അർഥവ്യാപ്തി
  choice: പ്രധാന പാഠത്തിൽ നിരോധിത ആത്മസമ്പർക്കം നടത്തുന്ന വ്യക്തികളായി പരിഭാഷപ്പെടുത്തി, പദങ്ങളുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുക
  alternative: ‘പ്രേതങ്ങൾ’, ‘പരിചിതാത്മാക്കൾ’ എന്നിങ്ങനെ ആത്മീയ സത്തകളായി നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  rationale: സമാന്തര ബഹുവചനങ്ങളും ‘അവരെ അന്വേഷിക്കുക’ എന്ന സന്ദർഭവും പ്രയോഗകരെ സൂചിപ്പിക്കുന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും എബ്രായ പദങ്ങൾ ആത്മാവിനെയും അതുമായി ബന്ധപ്പെട്ട പ്രയോഗകനെയും സൂചിപ്പിക്കാവുന്നതിനാൽ അനിശ്ചിതത്വം പൂർണമായി മറയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. അപരിചിതമായ സാങ്കേതിക പദങ്ങളായ ‘മീഡിയം’, ‘സ്പിരിറ്റിസ്റ്റ്’ എന്നിവയ്ക്കുപകരം വ്യക്തമായ വിവരണാത്മക പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
