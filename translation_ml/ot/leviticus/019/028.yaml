id: LEV.19.28
reference: Leviticus 19:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שֶׂ֣רֶט לָ/נֶ֗פֶשׁ לֹ֤א תִתְּנוּ֙ בִּ/בְשַׂרְ/כֶ֔ם וּ/כְתֹ֣בֶת קַֽעֲקַ֔ע לֹ֥א תִתְּנ֖וּ בָּ/כֶ֑ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: ml
  text: മരിച്ചവർക്കുവേണ്ടി നിങ്ങളുടെ മാംസത്തിൽ മുറിവുകൾ ഉണ്ടാക്കരുത്[a]; നിങ്ങളുടെ മേൽ പച്ചകുത്തിയ അടയാളം ഇടരുത്[b]. ഞാൻ യഹോവ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മരിച്ച ഒരാൾക്കുവേണ്ടി.’ എബ്രായപ്രയോഗം സാധാരണയായി മരിച്ചവരെച്ചൊല്ലിയുള്ള വിലാപാചാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കൊത്തിയ അടയാളം’ അല്ലെങ്കിൽ ‘പച്ചകുത്ത്.’ എബ്രായപ്രയോഗം അപൂർവമാണ്; ശരീരത്തിൽ പതിപ്പിച്ച സ്ഥിരമായ ഒരടയാളത്തെയായിരിക്കാം അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: മുറിവുകൾ
  rationale: ശരീരത്തിൽ മനപ്പൂർവം വരുത്തുന്ന മുറിക്കലുകളെയോ കീറലുകളെയോ ഈ നാമം സൂചിപ്പിക്കുന്നു. ഉപകരണത്തെയോ മുറിവിന്റെ തീവ്രതയെയോ അനാവശ്യമായി നിർണ്ണയിക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ അർഥം നൽകുന്നു.
- source_word: לָנֶפֶשׁ
  choice: മരിച്ചവർക്കുവേണ്ടി
  rationale: ഈ നിയമപരവും വിലാപാചാരസംബന്ധവുമായ സന്ദർഭത്തിൽ נֶפֶשׁ എന്നത് മരിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. മലയാളത്തിൽ ബഹുവചനസാമാന്യരൂപം ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു; ഏകവചനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בִּבְשַׂרְכֶם
  choice: നിങ്ങളുടെ മാംസത്തിൽ
  rationale: בָּשָׂר എന്നതിന്റെ മൂർത്തമായ ശരീരഭാഷ നിലനിർത്താൻ ‘മാംസം’ ഉപയോഗിച്ചു; ഇവിടെ ശരീരത്തിലെ മാംസത്തെ ഉദ്ദേശിക്കുന്നതും മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: כְתֹבֶת קַעֲקַע
  choice: പച്ചകുത്തിയ അടയാളം
  rationale: അപൂർവമായ ഈ സംയുക്തപ്രയോഗം ശരീരത്തിൽ പതിപ്പിക്കുന്ന സ്ഥിരമായ ലിഖിതമോ അടയാളമോ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. ‘പച്ചകുത്തിയ അടയാളം’ സാധ്യതയുള്ള അർഥം സ്വാഭാവികമായി നൽകുമ്പോൾ അപൂർവപദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: നിങ്ങളുടെമേൽ ... ഇടരുത്
  rationale: נתן എന്ന ക്രിയയും ב എന്ന ഉപസർഗവും ചേർന്ന് ശരീരത്തിൽ എന്തെങ്കിലും പതിപ്പിക്കുകയോ ഇടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ നേരിട്ടുള്ള നിരോധനരൂപം നിലനിർത്തി.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹോവ ആകുന്നു
  rationale: ദൈവനാമമായ יהוה ലഘൂകരിക്കാതെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; ഉടമ്പടിസംബന്ധമായ സ്വയംതിരിച്ചറിയിക്കൽ സൂത്രവാക്യത്തിന്റെ ഗൗരവവും നിലനിർത്തി.
theological_decisions:
- issue: ശരീരത്തിൽ അടയാളമിടുന്നതിനെക്കുറിച്ചുള്ള നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: മരിച്ചവർക്കുവേണ്ടിയുള്ള മുറിവുകളെയും ശരീരത്തിലെ പച്ചകുത്തിയ അടയാളത്തെയും കുറിച്ചുള്ള എബ്രായവാക്യം നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ഇരുനിരോധനങ്ങളും മരണവിലാപാചാരങ്ങൾക്ക് മാത്രമായി പരിമിതപ്പെടുത്തുക, അല്ലെങ്കിൽ എല്ലാ സംസ്കാരങ്ങളിലെയും എല്ലാ ആധുനിക പച്ചകുത്തലുകൾക്കും ബാധകമായ സർവകാലിക നിരോധനമായി വിവർത്തനത്തിൽ തന്നെ വികസിപ്പിക്കുക.
  rationale: ആദ്യ നിരോധനത്തെ ‘മരിച്ചവർക്കുവേണ്ടി’ എന്ന് വാക്യം വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; രണ്ടാമത്തേതിൽ ആ പ്രയോഗം ആവർത്തിക്കുന്നില്ല. അതിനാൽ അതിന്റെ വ്യാപ്തി വിവർത്തനത്തിൽ ചുരുക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്യാതെ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘മാംസത്തിൽ’ എന്ന മൂർത്തമായ പദപ്രയോഗം മൂലപാഠത്തിന്റെ ശരീരഭാഷ നിലനിർത്തുന്നു; അപൂർവമായ ശരീരഅടയാളപ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
