id: LEV.19.18
reference: Leviticus 19:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תִקֹּ֤ם וְ/לֹֽא תִטֹּר֙ אֶת בְּנֵ֣י עַמֶּ֔/ךָ וְ/אָֽהַבְתָּ֥ לְ/רֵעֲ/ךָ֖ כָּמ֑וֹ/ךָ אֲנִ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: ml
  text: നിന്റെ ജനത്തിന്റെ മക്കളോടു[a] പ്രതികാരം ചെയ്യുകയോ പക പുലർത്തുകയോ അരുത്. നിന്റെ അയൽക്കാരനെ നിന്നെപ്പോലെതന്നെ സ്നേഹിക്കണം. ഞാൻ യഹ്‌വെ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘നിന്റെ സ്വന്തം ജനത്തോടു.’ അക്ഷരാർഥം: ‘നിന്റെ ജനത്തിന്റെ മക്കളോടു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקֹּם
  choice: പ്രതികാരം ചെയ്യുക
  rationale: נקם എന്ന ക്രിയയുടെ സജീവമായ തിരിച്ചടിയുടെയും പ്രതികാരനടപടിയുടെയും അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תִטֹּר
  choice: പക പുലർത്തുക
  rationale: נטר ഇവിടെ കോപമോ വിരോധമോ ഉള്ളിൽ തുടർന്നും സൂക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പക പുലർത്തുക’ അതിന്റെ ദൈർഘ്യമുള്ള ഭാവം നിലനിർത്തുന്നു.
- source_word: בְּנֵי עַמֶּךָ
  choice: നിന്റെ ജനത്തിന്റെ മക്കൾ
  rationale: ‘നിന്റെ ജനത്തിന്റെ മക്കൾ’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ രൂപവും ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പ്രത്യേകതയും നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְאָהַבְתָּ
  choice: സ്നേഹിക്കണം
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ വാവ് ചേർന്ന പൂർണക്രിയയ്ക്ക് ആജ്ഞാത്മകബലം ഉണ്ട്; ‘സ്നേഹിക്കണം’ ആ നിർബന്ധസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לְרֵעֲךָ
  choice: നിന്റെ അയൽക്കാരനെ
  rationale: רֵעַ എന്നതിന് കൂട്ടുകാരൻ, സഹജീവി, അയൽക്കാരൻ എന്നീ അർഥങ്ങളുണ്ട്; ഈ നൈതിക-നിയമസന്ദർഭത്തിലും പിൽക്കാല വേദപുസ്തകപ്രയോഗത്തിലും ‘അയൽക്കാരൻ’ യോജിച്ചതാണ്.
- source_word: כָּמוֹךָ
  choice: നിന്നെപ്പോലെതന്നെ
  rationale: താരതമ്യപ്രയോഗത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: കല്പനയുടെ കർമത്തിന്റെ വ്യാപ്തി
  choice: ആദ്യ പ്രയോഗത്തിൽ ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ‘നിന്റെ ജനത്തിന്റെ മക്കൾ’ നിലനിർത്തുകയും רֵעַ എന്നതിന് ‘അയൽക്കാരൻ’ ഉപയോഗിക്കുകയും ചെയ്തു.
  alternative: രണ്ടു പ്രയോഗങ്ങളെയും ‘സ്വന്തം ജനത്തോട്’ എന്നോ സാർവത്രികമായ മറ്റൊരു പ്രയോഗമായോ ഏകീകരിക്കുക.
  rationale: വാക്യം בְּנֵי עַמֶּךָ എന്നും רֵעֲךָ എന്നും വ്യത്യസ്ത പ്രയോഗങ്ങൾ ഉപയോഗിക്കുന്നു. പിൽക്കാല വ്യാഖ്യാനങ്ങളിലൂടെ അവയുടെ വ്യാപ്തി വികസിപ്പിക്കുകയോ ചുരുക്കുകയോ ചെയ്യാതെ ഈ പാഠപരമായ വ്യത്യാസം പരിഭാഷയിൽ സൂക്ഷിക്കുന്നു.
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായത്തിലെ വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-നൈതിക ശൈലി. സമാന്തരമായ രണ്ടു നിരോധനങ്ങൾ ഒരേ വാക്യത്തിൽ നിലനിർത്തി; തുടർന്ന് വരുന്ന സകാരാത്മക കല്പന വേർതിരിച്ച് വായനാസൗകര്യം വർധിപ്പിച്ചു.
