id: LEV.19.6
reference: Leviticus 19:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/י֧וֹם זִבְחֲ/כֶ֛ם יֵאָכֵ֖ל וּ/מִֽ/מָּחֳרָ֑ת וְ/הַ/נּוֹתָר֙ עַד י֣וֹם הַ/שְּׁלִישִׁ֔י בָּ/אֵ֖שׁ יִשָּׂרֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/006.yaml
  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: ml
  text: നിങ്ങൾ യാഗമർപ്പിക്കുന്ന ദിവസവും പിറ്റേന്നും അതു ഭക്ഷിക്കണം; എന്നാൽ മൂന്നാം ദിവസംവരെ ശേഷിക്കുന്നത് തീയിൽ ചുട്ടുകളയണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם זִבְחֲכֶם
  choice: നിങ്ങൾ യാഗമർപ്പിക്കുന്ന ദിവസം
  rationale: בְּיוֹם സമയത്തെ സൂചിപ്പിക്കുന്നു; זִבְחֲכֶם എന്ന നാമരൂപത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ ക്രിയാപദപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: יֵאָכֵל
  choice: അതു ഭക്ഷിക്കണം
  rationale: നിഫാൽ അപൂർണ്ണക്രിയയുടെ നിയമപരമായ നിർദേശം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സന്ദർഭത്തിൽനിന്ന് കർമം സൂചിപ്പിക്കാൻ ‘അതു’ ചേർത്തിരിക്കുന്നു.
- source_word: וּמִמָּחֳרָת
  choice: പിറ്റേന്നും
  rationale: മറുദിവസത്തെ സൂചിപ്പിക്കുന്ന ഈ കാലപ്രയോഗത്തിന് ആധുനിക മലയാളത്തിലെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ തുല്യപദമാണ്.
- source_word: וְהַנּוֹתָר
  choice: എന്നാൽ ... ശേഷിക്കുന്നത്
  rationale: נותר എന്ന പങ്കാളിക്രിയ ശേഷിച്ച ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്ന് വരുന്ന വ്യത്യസ്ത നിർദേശം വ്യക്തമാക്കാൻ וְ എന്നത് സന്ദർഭാനുസൃതമായി ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: עַד יוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസംവരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന സമയപരിധി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: തീയിൽ ചുട്ടുകളയണം
  rationale: നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയ അർഥവും നിയമപരമായ നിർബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘ചുട്ടുകളയുക’ അവശിഷ്ടം ദഹിപ്പിച്ച് നീക്കുന്നതിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമനിർദേശ ശൈലി. മൂലത്തിലെ സമയക്രമവും ശേഷിപ്പിനെക്കുറിച്ചുള്ള വ്യത്യസ്ത നിർദേശവും സംരക്ഷിച്ചു.
