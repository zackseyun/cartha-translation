id: LEV.19.35
reference: Leviticus 19:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תַעֲשׂ֥וּ עָ֖וֶל בַּ/מִּשְׁפָּ֑ט בַּ/מִּדָּ֕ה בַּ/מִּשְׁקָ֖ל וּ/בַ/מְּשׂוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/035.yaml
  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: ml
  text: ന്യായവിധിയിലും, നീളത്തിന്റെ അളവുകളിലും, തൂക്കത്തിലും, കൊള്ളളവിലും നിങ്ങൾ അനീതി ചെയ്യരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ന്യായകാര്യത്തിലോ, അളവിലോ, തൂക്കത്തിലോ, കൊള്ളളവിലോ നിങ്ങൾ തെറ്റ് ചെയ്യരുത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  choice: നിങ്ങൾ ... ചെയ്യരുത്
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള എബ്രായ നിരോധനത്തെ സ്വാഭാവികവും നിയമശൈലിക്ക് യോജിച്ചതുമായ മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: עָוֶל
  choice: അനീതി
  rationale: തെറ്റ്, അന്യായം, വഞ്ചന എന്നിവ ഉൾക്കൊള്ളാവുന്ന പദം; തുടർന്നുവരുന്ന അളവുതൂക്കങ്ങളുടെ വാണിജ്യസന്ദർഭത്തിൽ ‘അനീതി’ ഉചിതമാണ്.
- source_word: בַּמִּשְׁפָּט
  choice: ന്യായവിധിയിൽ
  rationale: מִשְׁפָּט എന്ന പദത്തിന്റെ ‘വിധി/നീതി/ന്യായനിർവഹണം’ എന്ന അർഥവ്യാപ്തി പൂർണമായി ചുരുക്കാതെ, എബ്രായത്തോട് അടുത്ത രൂപം നിലനിർത്തുന്നു.
- source_word: בַּמִּדָּה
  choice: നീളമളക്കുന്നതിൽ
  rationale: തുടർന്ന് തൂക്കവും വ്യാപ്തിയളവും പ്രത്യേകം വരുന്നതിനാൽ, מִדָּה ഇവിടെ നീളം അല്ലെങ്കിൽ പരിമാണം അളക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: בַּמִּשְׁקָל
  choice: തൂക്കുന്നതിൽ
  rationale: מִשְׁקָל എന്നത് തൂക്കം അല്ലെങ്കിൽ തൂക്കൽ സൂചിപ്പിക്കുന്നു; പ്രവർത്തനപരമായ മലയാളരൂപം പട്ടികയിൽ സ്വാഭാവികമാണ്.
- source_word: וּבַמְּשׂוּרָה
  choice: വ്യാപ്തി അളക്കുന്നതിൽ
  rationale: מְשׂוּרָה ശേഷി/കൊള്ളളവ് അളക്കുന്ന മാനത്തെ സൂചിപ്പിക്കുന്നു. ദ്രവമോ ഖരമോ എന്നു അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ ആ അർഥം നൽകുന്നു.
theological_decisions:
- issue: בַּמִּשְׁפָּט എന്നതിന്റെ പരിധി
  choice: ന്യായവിധിയിൽ
  alternative: നീതി നടപ്പാക്കുന്നതിൽ / അളവിൽ
  rationale: ഈ പദം ഔപചാരിക കോടതിവിധിയെ മാത്രമോ പൊതുവായ നീതിപൂർവ ഇടപാടുകളെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകം അടുത്ത രൂപം സൂക്ഷിക്കുകയും അടിക്കുറിപ്പ് വിശാലമായ മറ്റൊരു വായന അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വ്യക്തവുമായ നിയമനിർദ്ദേശ ശൈലി. എബ്രായത്തിലെ ഏകവചന അളവുപദങ്ങളെ മലയാളത്തിൽ പ്രവർത്തനരൂപങ്ങളാക്കി സ്വാഭാവികമാക്കി; ‘കൊള്ളളവ്’ക്കാൾ പൊതുവായി മനസ്സിലാകുന്ന ‘വ്യാപ്തി അളക്കുക’ മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ചു.
