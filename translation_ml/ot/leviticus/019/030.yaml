  language: ml
  text: നിങ്ങൾ എന്റെ ശബ്ബത്തുകൾ ആചരിക്കണം; എന്റെ വിശുദ്ധമന്ദിരത്തെ ഭയഭക്തിയോടെ ആദരിക്കണം.[a] ഞാൻ യഹോവ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
