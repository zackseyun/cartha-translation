lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: എന്റെ ശബ്ബത്തുകൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനം നിലനിർത്തുന്നു; യഹോവ നിശ്ചയിച്ച ശബ്ബത്ത് ആചരണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תִּשְׁמֹרוּ
  choice: ആചരിക്കുകയും ... വേണം
  rationale: שׁמר എന്ന പദത്തിന്റെ ‘കാത്തുസൂക്ഷിക്കുക/പാലിക്കുക/ആചരിക്കുക’ എന്ന നിയമപരമായ അർഥം ശബ്ബത്തുകളോടൊപ്പം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִקְדָּשִׁי
  choice: എന്റെ വിശുദ്ധമന്ദിരം
  rationale: מִקְדָּשׁ എന്നത് ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; കൂടാരമെന്നോ ദേവാലയമെന്നോ കാലപരമായി അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: תִּירָאוּ
  choice: ഭയഭക്തിയോടെ ആദരിക്കുക
  rationale: ירא എന്ന പദത്തിലെ ഭയത്തിന്റെയും ആദരപൂർവമായ ഭക്തിയുടെയും അർഥവ്യാപ്തി ആരാധനാസന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹോവ ആകുന്നു
  rationale: ആവർത്തിച്ചു വരുന്ന ഉടമ്പടി-സ്വയംതിരിച്ചറിയിക്കൽ സൂത്രവാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം അത് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: വിശുദ്ധമന്ദിരവുമായി ബന്ധപ്പെട്ട ירא എന്ന ക്രിയയുടെ ഭാവം
  choice: ഭയഭക്തിയോടെ ആദരിക്കുക
  alternative: ഭയപ്പെടുക
  rationale: മൂലക്രിയയ്ക്ക് ‘ഭയപ്പെടുക’ എന്നും ‘ഭക്തിപൂർവം ആദരിക്കുക’ എന്നും അർഥമാകാം. ഈ ആരാധനാസന്ദർഭത്തിൽ വിശുദ്ധസ്ഥലത്തോടുള്ള ഗൗരവപൂർവമായ ആദരമാണ് മുൻനിരയിൽ; എങ്കിലും ‘ഭയഭക്തി’ എന്ന പ്രയോഗം പദത്തിലെ ഭയഘടകം പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘ശബ്ബത്തുകൾ’ എന്ന ബഹുവചനം, ‘വിശുദ്ധമന്ദിരം’ എന്ന വിശുദ്ധസ്ഥലസൂചന, യרא എന്ന പദത്തിലെ ഭയം–ഭക്തി അർഥവ്യാപ്തി എന്നിവ നിലനിർത്തി.
