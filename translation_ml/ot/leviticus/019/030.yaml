    text: 'അഥവാ: “എന്റെ വിശുദ്ധമന്ദിരത്തെ ഭയപ്പെടണം.” എബ്രായ ക്രിയയ്ക്ക് ‘ഭയപ്പെടുക’ എന്നും ‘ഭക്തിപൂർവം ആദരിക്കുക’ എന്നും അർഥമാക്കാം; ഇവിടെ യഹോവയുടെ വിശുദ്ധസ്ഥലത്തോടുള്ള വിശുദ്ധമായ ആദരവിനെയാണ് അത് സൂചിപ്പിക്കുന്നത്.'
