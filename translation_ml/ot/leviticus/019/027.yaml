reference: Leviticus 19:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֣א תַקִּ֔פוּ פְּאַ֖ת רֹאשְׁ/כֶ֑ם וְ/לֹ֣א תַשְׁחִ֔ית אֵ֖ת פְּאַ֥ת זְקָנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: ml
  text: നിങ്ങളുടെ തലയുടെ വശങ്ങളിലെ മുടി വട്ടത്തിൽ വെട്ടരുത്[a][b]; നിങ്ങളുടെ താടിയുടെ അരികുകൾ വികൃതമാക്കരുത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ തലമുടിയുടെ അരികുകൾ.” എബ്രായപദത്തിന് “അരിക്,” “വശം,” “കോണം” എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഇത് തലയുടെ വശങ്ങളിലെ മുടി വൃത്താകൃതിയിൽ ക്ഷൗരം ചെയ്യുകയോ വെട്ടിയൊതുക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
  - marker: c
    text: “വികൃതമാക്കുക” എന്നതിന് പകരം “നശിപ്പിക്കുക,” “കേടാക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: വട്ടത്തിൽ വെട്ടരുത്
  rationale: נקף എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ തലയുടെ അരികിലുള്ള മുടി വൃത്താകൃതിയിൽ വെട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. കൃത്യമായ രീതിയെ അതിരുകടന്ന് നിർവചിക്കാതെ പ്രവർത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: פְּאַת רֹאשְׁכֶם
  choice: നിങ്ങളുടെ തലയുടെ വശങ്ങളിലെ മുടി
  rationale: פֵּאָה എന്നത് ‘അരിക്,’ ‘വശം,’ ‘കോണം’ എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് തലയുടെ വശങ്ങളിലെ മുടിയാണെന്ന് വ്യക്തമാക്കുന്ന, ആധുനിക മലയാളത്തിൽ സുതാര്യമായ പ്രയോഗമാണിത്; എബ്രായത്തിലെ സമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന ബഹുവചനത്തെ മലയാളത്തിലെ സ്വാഭാവിക കൂട്ടായ ‘നിങ്ങളുടെ’ പ്രയോഗം ഉൾക്കൊള്ളുന്നു.
- source_word: תַשְׁחִית
  choice: വികൃതമാക്കുകയും അരുത്
  rationale: שׁחת എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘നശിപ്പിക്കുക,’ ‘കേടാക്കുക,’ ‘വികൃതമാക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. താടിയുടെ രൂപത്തിൽ വരുത്തുന്ന ഹാനികരമായ മാറ്റം വ്യക്തമാക്കുകയും, പ്രത്യേകമായ ഒരു വെട്ടൽരീതി അനാവശ്യമായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: פְּאַת זְקָנֶךָ
  choice: നിങ്ങളുടെ താടിയുടെ അരികുകൾ
  rationale: פֵּאָהയുടെ ‘അരിക്/വശം’ എന്ന അർഥവും זָקָן എന്നതിന്റെ സാധാരണ അർഥമായ ‘താടി’യും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. മലയാളത്തിൽ താടിയുടെ വിവിധ അതിരുകളെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘അരികുകൾ’ ഉപയോഗിച്ചു.
- source_word: לֹא ... וְלֹא
  choice: വെട്ടരുത് ... വികൃതമാക്കുകയും അരുത്
  rationale: എബ്രായത്തിലെ ഇരട്ട നിരോധനത്തിന്റെ നിയമപരമായ ശക്തി, മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിരോധനരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിരോധനത്തിന്റെ സ്വഭാവം
  choice: മുടിയും താടിയും പ്രത്യേക രീതിയിൽ വെട്ടുകയോ മാറ്റുകയോ ചെയ്യുന്നതിനെക്കുറിച്ചുള്ള വ്യക്തമായ നിരോധനമായി വിവർത്തനം ചെയ്തു; അതിന്റെ കാരണം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
  alternative: ഇത് ജാതീയ വിലാപാചാരത്തെയോ അയൽജാതികളുടെ അലങ്കാരരീതികളെയോ മാത്രം നിരോധിക്കുന്നതായി വാചകത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം നിരോധിക്കപ്പെട്ട പ്രവൃത്തികൾ പറയുന്നു, എന്നാൽ അവയുടെ ഉദ്ദേശ്യമോ സാംസ്കാരിക കാരണമോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ ഒരു കാരണം വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ മൂലപാഠത്തിലെ നിയന്ത്രിതത്വം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി സ്വീകരിച്ചു. സാങ്കേതികമോ മതവിഭാഗസവിശേഷമോ ആയ പദങ്ങൾ ഒഴിവാക്കി; മൂലപാഠത്തിലെ പ്രവൃത്തിയും അവ്യക്തതയും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
