  source_fidelity: 'The draft accurately represents both prohibitions: rounding/cutting the hair at the side/edge of the head and damaging the edge(s) of the beard. It appropriately does not add a cultural or ritual rationale absent from this verse. The lexical alternatives in the footnotes preserve the semantic range of פֵּאָה and שׁחת.'
