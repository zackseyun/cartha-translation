  revised_text: നിങ്ങളുടെ തലയുടെ വശങ്ങളിലെ മുടി വട്ടത്തിൽ വെട്ടരുത്[a][b]; നിങ്ങളുടെ താടിയുടെ അരികുകൾ വികൃതമാക്കരുത്[c].
