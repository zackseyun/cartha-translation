source:
  edition: WLC
  text: אַל תְּחַלֵּ֥ל אֶֽת בִּתְּ/ךָ֖ לְ/הַזְנוֹתָ֑/הּ וְ/לֹא תִזְנֶ֣ה הָ/אָ֔רֶץ וּ/מָלְאָ֥ה הָ/אָ֖רֶץ זִמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: ml
  text: നിന്റെ മകളെ വേശ്യാവൃത്തിക്കു വിട്ടുകൊടുത്ത്[a] അവളെ അപമാനിക്കരുത്; അങ്ങനെ ചെയ്താൽ ദേശം വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുകയും[b] ദേശം ദുർന്നടപ്പുകൊണ്ട്[c] നിറയുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളെ വേശ്യാവൃത്തിക്കു പ്രേരിപ്പിച്ച്’ അല്ലെങ്കിൽ ‘അവളെക്കൊണ്ട് വേശ്യാവൃത്തി ചെയ്യിച്ച്.’ എബ്രായ ക്രിയ കാരണാർത്ഥകമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ദേശം വേശ്യാവൃത്തി ചെയ്യാതിരിക്കേണ്ടതിന്.’ സമൂഹം മുഴുവൻ ദുഷിച്ചുപോകുന്നതിനെ ഇവിടെ രൂപകമായി പറയുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘വഷളത്തം’ അല്ലെങ്കിൽ ‘ദുഷ്ടത.’ എബ്രായപദം പലപ്പോഴും ലൈംഗിക പശ്ചാത്തലത്തിലുള്ള അതിരുകടന്ന ധാർമിക അധഃപതനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: അപവിത്രയാക്കരുത്
  rationale: പീയേൽ രൂപത്തിലുള്ള חלל വിശുദ്ധം–അവിശുദ്ധം എന്ന ലേവ്യപുസ്തകത്തിലെ ആശയമണ്ഡലത്തിൽ ഒരാളെ അശുദ്ധമോ സാധാരണമോ ആക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അപവിത്രയാക്കുക’ ഈ വിശുദ്ധി-സന്ദർഭം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בִּתְּךָ
  choice: നിന്റെ മകളെ
  rationale: രണ്ടാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയമുള്ള നേരിട്ടുള്ള ബന്ധപദം; ഏകവചനം നിലനിർത്തി.
- source_word: לְהַזְנוֹתָהּ
  choice: വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുത്തിക്കൊണ്ട്
  rationale: זנה എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണാർത്ഥക രൂപമാണ്; മകൾ സ്വയം വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുന്നു എന്നതിലുപരി അവളെ അതിൽ ഏർപ്പെടുത്തുന്നതാണ് വാചകത്തിന്റെ അർത്ഥം.
- source_word: תִזְנֶה הָאָרֶץ
  choice: ദേശം വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുകയും
  rationale: ദേശത്തെ വ്യക്തിവൽക്കരിക്കുന്ന മൂലഭാഷയിലെ വേശ്യാവൃത്തി-രൂപകം നിലനിർത്തുന്നു; സമൂഹമൊട്ടാകെ ധാർമികമായി ദുഷിക്കുന്നതിനെ ഇത് സൂചിപ്പിക്കുന്നു.
- source_word: וּמָלְאָה הָאָרֶץ
  choice: ദേശം ... നിറയുകയും ചെയ്യും
  rationale: മുന്നറിയിപ്പിന്റെ ഫലമായി സംഭവിക്കാവുന്ന പരിണതിയെ സ്വാഭാവിക മലയാള ഭാവികാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: זִמָּה
  choice: നീചത
  rationale: ഈ പദം അതിരുകടന്ന ധാർമിക അധഃപതനത്തെ, പലപ്പോഴും ലൈംഗിക പശ്ചാത്തലത്തിൽ, സൂചിപ്പിക്കുന്നു. ‘നീചത’ അതിന്റെ വിശാലമായ ധാർമിക ഭാരം നിലനിർത്തുന്നു; ‘ലൈംഗിക അധാർമികത’ എന്നത് അർത്ഥം അനാവശ്യമായി ചുരുക്കും.
theological_decisions:
- issue: ദേശം ‘വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുന്നു’ എന്ന രൂപകം എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ‘ദേശം വേശ്യാവൃത്തിയിൽ ഏർപ്പെടുകയും’ എന്ന് രൂപകം നിലനിർത്തി.
  alternative: ‘ദേശം അധാർമികമാകുകയും’ അല്ലെങ്കിൽ ‘ദേശത്ത് വേശ്യാവൃത്തി വ്യാപിക്കുകയും’
  rationale: മൂലപാഠം ദേശത്തെ വ്യക്തിവൽക്കരിച്ച് സമൂഹത്തിന്റെ വ്യാപകമായ ദുഷിപ്പിനെ ശക്തമായ വേശ്യാവൃത്തി-രൂപകത്തിലൂടെ പറയുന്നു. പൊതുവായ ധാർമിക അധഃപതനമായി പരത്തിവായിക്കാതെ ആ സംഘർഷവും വാചകശക്തിയും സംരക്ഷിച്ചു.
- issue: חלל എന്ന പദത്തിന്റെ വിശുദ്ധി-സന്ദർഭം
  choice: ‘അപവിത്രയാക്കരുത്’
  alternative: ‘മാനഹാനിപ്പെടുത്തരുത്’ അല്ലെങ്കിൽ ‘കളങ്കപ്പെടുത്തരുത്’
  rationale: ലേവ്യപുസ്തകത്തിലെ വിശുദ്ധം–അവിശുദ്ധം വ്യത്യാസവുമായി ബന്ധം നിലനിർത്താൻ ‘അപവിത്രയാക്കുക’ കൂടുതൽ യോജിക്കുന്നു; ഇത് വെറും സാമൂഹിക അപമാനമായി അർത്ഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘വേശ്യാവൃത്തി’ എന്ന നേരിട്ടുള്ള പദവും ‘അപവിത്രയാക്കുക’ എന്ന വിശുദ്ധി-സന്ദർഭ പദവും നിലനിർത്തി; കാരണാർത്ഥവും ദേശത്തെക്കുറിച്ചുള്ള രൂപകവും അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി.
