id: LEV.19.20
reference: Leviticus 19:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a servant woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: ml
  text: ഒരു പുരുഷൻ ഒരു സ്ത്രീയോടുകൂടെ ശയിച്ച് ശുക്ലസ്രാവം ഉണ്ടാകുകയും, അവൾ ഒരു പുരുഷനു നിശ്ചയിക്കപ്പെട്ട[a] അടിമസ്ത്രീയായിരിക്കുകയും, എന്നാൽ അവൾ വീണ്ടെടുക്കപ്പെടുകയോ അവൾക്കു സ്വാതന്ത്ര്യം നൽകപ്പെടുകയോ ചെയ്തിട്ടില്ലെങ്കിൽ, അന്വേഷണം നടത്തണം[b]. അവർ വധിക്കപ്പെടുകയില്ല; കാരണം അവൾ സ്വതന്ത്രയാക്കപ്പെട്ടിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു പുരുഷനുമായി വിവാഹനിശ്ചയം ചെയ്യപ്പെട്ട” അല്ലെങ്കിൽ “ഒരു പുരുഷനു വാഗ്ദാനം ചെയ്യപ്പെട്ട.” എബ്രായപദം അവൾ ഒരു പുരുഷനുവേണ്ടി നിശ്ചയിക്കപ്പെട്ടവളോ വാഗ്ദാനം ചെയ്യപ്പെട്ടവളോ ആണെന്ന് സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു; എങ്കിലും അവളുടെ നിയമസ്ഥിതി പൂർണസ്വാതന്ത്ര്യമുള്ള ഭാര്യയുടേതായിരുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: “അന്വേഷണം” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം അപൂർവവും അർഥനിശ്ചയം ദുഷ്കരവുമാണ്; അതിന് “ശിക്ഷ” എന്നോ “നഷ്ടപരിഹാരം” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: നിയമവാക്യത്തിലെ ലിംഗസൂചനയുള്ള ഏകവചനത്തെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: ഒരു സ്ത്രീയോടുകൂടെ ശയിച്ച് ബീജസ്രാവം ഉണ്ടാകുക
  rationale: ലൈംഗികബന്ധത്തെയും ശുക്ലസ്രാവമെന്ന നിയമപരമായി പ്രസക്തമായ വിശദാംശത്തെയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: שִׁפְחָה
  choice: അടിമസ്ത്രീ
  rationale: ഈ നിയമത്തിൽ നിർണായകമായ ബന്ധിത സാമൂഹിക-നിയമസ്ഥിതി മൃദൂകരിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: ഒരു പുരുഷനു നിശ്ചയിക്കപ്പെട്ട
  rationale: പൂർണമായ വിവാഹനിശ്ചയത്തിന്റെ നിയമസ്ഥിതി അനാവശ്യമായി ചുമത്താതെ, ഒരാൾക്കായി അവളെ നിശ്ചയിച്ചിട്ടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: അവൾ വീണ്ടെടുക്കപ്പെട്ടിട്ടില്ല
  rationale: അടിമസ്ഥിതിയിൽനിന്നുള്ള വിലകൊടുത്ത മോചനത്തിന്റെ നിയമ-സാമ്പത്തിക ആശയം നിലനിർത്തുന്നു.
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: അവൾക്കു സ്വാതന്ത്ര്യം നൽകപ്പെട്ടിട്ടില്ല
  rationale: അടിമത്തത്തിൽനിന്നുള്ള ഔദ്യോഗിക മോചനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּקֹּרֶת
  choice: അന്വേഷണം
  rationale: അത്യപൂർവവും അർഥനിശ്ചയം ദുഷ്കരവുമായ പദത്തിന്, ഒരു പ്രത്യേക ശിക്ഷ മുൻകൂട്ടി നിശ്ചയിക്കാത്ത ഔദ്യോഗിക പരിശോധന എന്ന സാധ്യത നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לֹא יוּמְתוּ
  choice: അവർ വധിക്കപ്പെടരുത്
  rationale: നിയമപരമായ വധശിക്ഷ നിഷേധിക്കുന്ന കർമണിപ്രയോഗം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: കാരണം അവൾ സ്വതന്ത്രയാക്കപ്പെട്ടിരുന്നില്ല
  rationale: മരണശിക്ഷ വിധിക്കാതിരിക്കുന്നതിന് വാക്യം നൽകുന്ന കാരണം അവളുടെ തുടർന്നിരുന്ന അടിമസ്ഥിതിയുമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: נֶחֱרֶפֶת לְאִישׁ എന്ന പ്രയോഗത്തിലെ സ്ത്രീയുടെ നിയമസ്ഥിതി
  choice: ഒരു പുരുഷനു നിശ്ചയിക്കപ്പെട്ട
  alternative: ഒരു പുരുഷനുമായി വിവാഹനിശ്ചയം ചെയ്യപ്പെട്ട; ഒരു പുരുഷനു വാഗ്ദാനം ചെയ്യപ്പെട്ട
  rationale: സ്വതന്ത്രയായ വിവാഹനിശ്ചിത സ്ത്രീയുടെ പൂർണ നിയമസ്ഥിതിയുമായി ഈ കേസിനെ കലർത്താതെ, നിലവിലുള്ള ബന്ധപരമായ അവകാശവാദം നിലനിർത്തുന്നു.
- issue: בִּקֹּרֶת എന്ന അപൂർവപദത്തിന്റെ അർഥം
  choice: അന്വേഷണം നടത്തണം
  alternative: ശിക്ഷ ഉണ്ടായിരിക്കണം; നഷ്ടപരിഹാരം നൽകണം
  rationale: പദത്തിന്റെ യഥാർഥ അർഥം വിവാദമായതിനാൽ ഒരു പ്രത്യേക ശിക്ഷാസിദ്ധാന്തം വാക്യത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. അടിമസ്ഥിതി മറച്ചുവയ്ക്കുന്ന മൃദുപദങ്ങൾ ഒഴിവാക്കി; എന്നാൽ അപൂർവ എബ്രായപദങ്ങളുടെ അനിശ്ചിതത്വം പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പുകളിലും സംരക്ഷിച്ചു.
