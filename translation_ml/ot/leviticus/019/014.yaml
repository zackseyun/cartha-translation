id: LEV.19.14
reference: Leviticus 19:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תְקַלֵּ֣ל חֵרֵ֔שׁ וְ/לִ/פְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: ml
  text: ബധിരനായ ഒരാളെ നീ ശപിക്കരുത്; അന്ധനായ ഒരാളുടെ മുമ്പിൽ ഇടർച്ചക്കല്ല് വെക്കരുത്. എന്നാൽ നിന്റെ ദൈവത്തെ ഭയപ്പെടണം. ഞാൻ യാഹ്‌വേ ആകുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബധിരനെ’, ‘അന്ധനെ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ പുല്ലിംഗ ഏകവചന രൂപങ്ങൾ പ്രതിനിധാനപരമായ നിയമോദാഹരണങ്ങളായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְקַלֵּל
  choice: ശപിക്കരുത്
  rationale: പീയേൽ രൂപത്തിലുള്ള קלל ഇവിടെ ശപിക്കുക എന്ന നേരിട്ടുള്ള വാചിക-ധാർമ്മിക ശക്തി വഹിക്കുന്നു; ‘നിന്ദിക്കുക’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: חֵרֵשׁ
  choice: ബധിരനായ ഒരാളെ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചന നിയമോദാഹരണം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഇത് പ്രതിനിധാനപരമായ ഉദാഹരണമാണ്.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: സ്ഥലസംബന്ധമായ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עִוֵּר
  choice: അന്ധനായ ഒരാളുടെ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ഏകവചന രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ നിയമോദാഹരണമായി അവതരിപ്പിക്കുന്നു.
- source_word: תִתֵּן
  choice: വെക്കരുത്
  rationale: נתן അക്ഷരാർഥത്തിൽ ‘കൊടുക്കുക’ എന്നാണെങ്കിലും, ഇടർച്ചക്കല്ലിനോടൊപ്പം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘വെക്കുക’ എന്നതാണ്.
- source_word: מִכְשֹׁל
  choice: ഇടർച്ചക്കല്ല്
  rationale: കാലിടറി വീഴാൻ ഇടയാക്കുന്ന വസ്തുവെന്ന അക്ഷരാർഥചിത്രവും വിപുലമായ ധാർമ്മിക സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: וְיָרֵאתָ
  choice: എന്നാൽ ... ഭയപ്പെടണം
  rationale: 'വാവ് ബന്ധകത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള വിരുദ്ധാഭാസപരമായ പ്രഭാവം മലയാളത്തിൽ പ്രകടമാക്കുന്നു: മനുഷ്യർ കാണാതിരിക്കാവുന്ന ദുഷ്പ്രവൃത്തിക്കു വിരുദ്ധമായി ദൈവഭയം ആവശ്യപ്പെടുന്നു.'
- source_word: מֵאֱלֹהֶיךָ
  choice: നിന്റെ ദൈവത്തെ
  rationale: ירא-യോടൊപ്പമുള്ള מן ഭയത്തിന്റെ കർമത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; മലയാളത്തിൽ ‘ദൈവത്തെ ഭയപ്പെടുക’ എന്നാണ് സ്വാഭാവികം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: നിയമത്തിലെ പ്രതിനിധാനപരമായ പുല്ലിംഗ ഏകവചനങ്ങൾ
  choice: ‘ബധിരനായ ഒരാൾ’, ‘അന്ധനായ ഒരാൾ’ എന്ന പുല്ലിംഗ ഏകവചന ഉദാഹരണങ്ങൾ നിലനിർത്തുക
  alternative: ‘ബധിരർ’, ‘അന്ധർ’ അല്ലെങ്കിൽ ലിംഗനിരപേക്ഷമായ പൊതുരൂപങ്ങൾ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചന നിയമോദാഹരണങ്ങൾ കൃത്യമായി നിലനിർത്തുന്നു; കല്പനയുടെ ധാർമ്മിക വ്യാപ്തി അവയിൽ മാത്രം പരിമിതമാണെന്ന് ഇതിലൂടെ സൂചിപ്പിക്കുന്നില്ല.
- issue: അവസാന പ്രേരണാവാക്യത്തിന്റെ പ്രഭാവം
  choice: ‘എന്നാൽ നിന്റെ ദൈവത്തെ ഭയപ്പെടണം’
  alternative: ‘നിന്റെ ദൈവത്തെ ഭയപ്പെടണം’ / ‘നിന്റെ ദൈവത്തെ ഭയപ്പെടുക’
  rationale: വാവ് എന്ന ബന്ധകത്തിന് അടിസ്ഥാനപരമായി ‘കൂടാതെ/അപ്പോൾ’ എന്ന ബന്ധമുണ്ടെങ്കിലും, ദുർബലരെ രഹസ്യമായി ദ്രോഹിക്കുന്നതിനും ദൈവത്തോടുള്ള ഉത്തരവാദിത്വത്തിനുമിടയിലെ നൈതിക വൈരുധ്യം ഇവിടെ സന്ദർഭം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഇടർച്ചക്കല്ല്’ മൂലത്തിലെ ദൃശ്യരൂപവും ബൈബിൾപരമായ ധാർമ്മിക അനുരണനവും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
