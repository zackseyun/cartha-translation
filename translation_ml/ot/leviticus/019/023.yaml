id: LEV.19.23
reference: Leviticus 19:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: ml
  text: നിങ്ങൾ ആ ദേശത്ത് പ്രവേശിച്ച് ഭക്ഷ്യഫലം കായ്ക്കുന്ന ഏതൊരു വൃക്ഷവും നട്ടാൽ, അതിന്റെ ഫലം പരിച്ഛേദന ചെയ്യപ്പെടാത്തതെന്നു കണക്കാക്കണം.[a] മൂന്നു വർഷം അത് നിങ്ങൾക്കു പരിച്ഛേദന ചെയ്യപ്പെടാത്തതായിരിക്കണം; അത് ഭക്ഷിക്കപ്പെടരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘പരിച്ഛേദന ചെയ്യപ്പെടാത്തത്.’ ആദ്യത്തെ മൂന്നു വർഷം ഭക്ഷിക്കാൻ അനുവദിക്കാത്ത ഫലത്തെ സൂചിപ്പിക്കാൻ ഈ പദം രൂപകമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: എബ്രായത്തിലെ പരിച്ഛേദനാരൂപകത്തിന്റെ അക്ഷരാർഥവും ഇവിടെ അതിനുള്ള നിയമപരമായ അർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל־הָאָרֶץ
  choice: നിങ്ങൾ ആ ദേശത്തു പ്രവേശിച്ച്
  rationale: നിയമനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ וְכִי ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യം അവതരിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികമായ വ്യവസ്ഥാസംബന്ധമായ രൂപം ഉപയോഗിച്ചു. הָאָרֶץ എന്നത് ‘ആ ദേശം’ എന്നു നിലനിർത്തി; മൂലത്തിൽ ഇല്ലാത്ത ‘കനാൻ’ ചേർത്തിട്ടില്ല.
- source_word: וּנְטַעְתֶּם כָּל־עֵץ מַאֲכָל
  choice: ഭക്ഷ്യഫലം കായ്ക്കുന്ന ഏതൊരു വൃക്ഷവും നട്ടാൽ
  rationale: עֵץ מַאֲכָל ഭക്ഷിക്കാവുന്ന ഫലം തരുന്ന വൃക്ഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്. כָּל എന്നതിന്റെ വിതരണാർഥം ‘ഏതൊരു’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת־פִּרְיוֹ
  choice: അതിന്റെ ഫലം പരിച്ഛേദന ചെയ്യപ്പെടാത്തതെന്നു കണക്കാക്കണം
  rationale: ערל/ערלה എന്ന പദകുടുംബത്തിലെ പരിച്ഛേദനാസംബന്ധമായ രൂപകം നിലനിർത്തി. ക്രിയയുടെ നിയമപരമായ ‘അങ്ങനെ കരുതുക/കണക്കാക്കുക’ എന്ന ഭാവം ‘കണക്കാക്കണം’ എന്നു നൽകി.
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: മൂന്നു വർഷം അത് നിങ്ങൾക്കു വിലക്കപ്പെട്ടതായിരിക്കണം
  rationale: ഫലത്തിന്റെ ആദ്യ മൂന്നു വർഷത്തെ ഭക്ഷണവിലക്കാണ് വാക്യത്തിന്റെ പ്രായോഗിക അർഥം. ആദ്യ പ്രയോഗത്തിൽ രൂപകം നിലനിർത്തിയശേഷം ഇവിടെ ആവർത്തനത്തിന്റെ നിയമപരമായ ഫലം വ്യക്തമായി നൽകി; לָכֶם എന്നത് ‘നിങ്ങൾക്കു’ എന്നു സംരക്ഷിച്ചു.
- source_word: לֹא יֵאָכֵל
  choice: അത് ഭക്ഷിക്കരുത്
  rationale: നിഫാൽ രൂപത്തിലെ നിഷ്ക്രിയ/അവ്യക്തിപരമായ വിലക്ക് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പൊതുവിലക്കായി നൽകി.
theological_decisions:
- issue: ഫലത്തെ ‘പരിച്ഛേദന ചെയ്യപ്പെടാത്തത്’ എന്നു വിളിക്കുന്ന രൂപകം നിലനിർത്തണമോ, ‘വിലക്കപ്പെട്ടത്’ എന്നു മാത്രം വിവർത്തനം ചെയ്യണമോ
  choice: ആദ്യ പ്രയോഗത്തിൽ ‘പരിച്ഛേദന ചെയ്യപ്പെടാത്തത്’ എന്ന രൂപകം നിലനിർത്തി; തുടർന്നുള്ള നിയമപരമായ നില ‘വിലക്കപ്പെട്ടത്’ എന്നു വ്യക്തമാക്കി
  alternative: രണ്ടിടത്തും ‘വിലക്കപ്പെട്ടത്’ എന്നു വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ രണ്ടിടത്തും പരിച്ഛേദനാരൂപകം ആവർത്തിക്കുക
  rationale: എബ്രായത്തിലെ ערל/ערלה എന്ന ഉടമ്പടി-സാംസ്കാരിക രൂപകം ഇല്ലാതാക്കാതെ സംരക്ഷിക്കണം. അതേസമയം മലയാളവായനക്കാരന് അതിന്റെ പ്രായോഗിക അർഥം വ്യക്തമായിരിക്കേണ്ടതിനാൽ തുടർന്നുള്ള വാക്യത്തിൽ ഭക്ഷണവിലക്ക് തുറന്നുപറഞ്ഞു. ‘കൊമ്പുകോതാത്തത്’ എന്ന തോട്ടപരിപാലന വ്യാഖ്യാനം സന്ദർഭം പിന്തുണയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. നിയമനിർദേശത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി. രൂപകത്തിന്റെ ആശയക്കുഴപ്പം അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
