source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങൾ എന്റെ എല്ലാ ചട്ടങ്ങളും എന്റെ എല്ലാ ന്യായവിധികളും[a] പാലിക്കുകയും അവ അനുഷ്ഠിക്കുകയും വേണം. ഞാൻ യഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചട്ടങ്ങൾ’ എന്നതിന് ‘നിയമനിബന്ധനകൾ’ എന്നും, ‘ന്യായവിധികൾ’ എന്നതിന് ‘വിധികൾ’ അല്ലെങ്കിൽ ‘നിയമങ്ങൾ’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായമൂലത്തിൽ വ്യത്യസ്തമായ രണ്ട് നിയമപദങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: അതുകൊണ്ട്, നിങ്ങൾ ... പാലിച്ച്
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ പശ്ചാത്തലത്തിൽ שׁמר എന്നത് ‘പാലിക്കുക/അനുസരിക്കുക’ എന്നർഥം നൽകുന്നു. അധ്യായത്തിന്റെ സമാപനസംഗ്രഹഭാവം സൂചിപ്പിക്കാൻ വാവിനെ ‘അതുകൊണ്ട്’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: כָּל
  choice: എല്ലാ
  rationale: രണ്ടിടത്തുമുള്ള എബ്രായ പദത്തിന്റെ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: חֻקֹּתַי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: חֻקִּים നിർദേശിക്കപ്പെട്ട നിയമനിബന്ധനകളെയോ ചട്ടങ്ങളെയോ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള מִשְׁפָּטִים എന്നതിൽനിന്നുള്ള പദവ്യത്യാസവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: מִשְׁפָּטַי
  choice: എന്റെ ന്യായവിധികൾ
  rationale: מִשְׁפָּטִים ന്യായവിധികൾ, നിയമപരമായ തീരുമാനങ്ങൾ, അല്ലെങ്കിൽ നിയമനിബന്ധനകൾ എന്നിവയെ സൂചിപ്പിക്കാം. ‘ന്യായവിധികൾ’ നിയമപരമായ ഭാവവും חֻקִּים എന്നതിൽനിന്നുള്ള വ്യത്യാസവും സംരക്ഷിക്കുന്നു.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: അവ അനുഷ്ഠിക്കണം
  rationale: നിയമങ്ങളെ കർമത്തിൽ നടപ്പാക്കുക എന്ന עשהയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ രണ്ട് എബ്രായ പദങ്ങളുടെ വ്യത്യാസം മുഖ്യപാഠത്തിൽ കഴിയുന്നത്ര സംരക്ഷിക്കുകയും, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
