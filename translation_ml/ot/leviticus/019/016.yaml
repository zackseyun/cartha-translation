id: LEV.19.16
reference: Leviticus 19:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: ml
  text: നിന്റെ ജനത്തിന്റെ ഇടയിൽ അപവാദം പരത്തിക്കൊണ്ട് ചുറ്റിനടക്കരുത്. നിന്റെ അയൽക്കാരന്റെ രക്തത്തിനെതിരെ നിൽക്കരുത്.[a] ഞാൻ യാഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ അയൽക്കാരന്റെ രക്തം ചൊരിയപ്പെടുമ്പോൾ നോക്കിനിൽക്കരുത്.”
    reason: alternative_reading
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: അപവാദം പരത്തിക്കൊണ്ട് ചുറ്റിനടക്കുക
  rationale: הלך എന്ന ചലനചിത്രവും רכיל എന്നതിലെ സമൂഹത്തിനുള്ളിൽ ഹാനികരമായ വാർത്തകൾ പ്രചരിപ്പിക്കുന്ന അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: בְּעַמֶּיךָ
  choice: നിന്റെ ജനത്തിന്റെ ഇടയിൽ
  rationale: ב എന്ന ബന്ധസൂചകവും עם എന്ന സമൂഹസൂചനയും വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: תַעֲמֹד עַל
  choice: എതിരെ നിൽക്കുക
  rationale: עמד എന്നതിന്റെ അടിസ്ഥാനമായ ‘നിൽക്കുക’ എന്ന ദൃശ്യഭാഷ നിലനിർത്തുകയും על-ന്റെ സാധ്യതയുള്ള പ്രതികൂല അർഥം പ്രധാനപാഠത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു; നിഷ്ക്രിയമായി നോക്കിനിൽക്കുക എന്ന വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: דַּם
  choice: രക്തം
  rationale: ജീവനെയോ രക്തച്ചൊരിച്ചിലിനെയോ സൂചിപ്പിക്കാവുന്ന മൂലപാഠത്തിന്റെ സാക്ഷാൽ ദൃശ്യവും നിയമ-ധാർമിക ശക്തിയും നിലനിർത്തുന്നു.
- source_word: רֵעֶךָ
  choice: നിന്റെ അയൽക്കാരൻ
  rationale: നിയമ-ധാർമിക പശ്ചാത്തലത്തിലെ സഹസമൂഹാംഗത്തെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പദപ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: לֹא תַעֲמֹד עַל דַּם רֵעֶךָ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘നിന്റെ അയൽക്കാരന്റെ രക്തത്തിനെതിരെ നിൽക്കരുത്’ എന്ന താരതമ്യേന ഔപചാരികമായ വായന
  alternative: ‘നിന്റെ അയൽക്കാരന്റെ രക്തം ചൊരിയപ്പെടുമ്പോൾ നോക്കിനിൽക്കരുത്’
  rationale: എബ്രായ പ്രയോഗം സംക്ഷിപ്തവും ബഹുവ്യാഖ്യാനസാധ്യതയുള്ളതുമാണ്. പ്രധാനപാഠം ‘രക്തം’, ‘നിൽക്കുക’ എന്നീ ദൃശ്യങ്ങൾ നിലനിർത്തി അയൽക്കാരന്റെ ജീവന് എതിരായ പ്രവർത്തനമോ കൂട്ടുനിൽപ്പോ ഉൾക്കൊള്ളാൻ ഇടവരുത്തുന്നു; അപകടസമയത്തെ നിഷ്ക്രിയത വിലക്കുന്ന വ്യാപകമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ ആവർത്തിച്ചുള്ള നിരോധനഘടനയും രക്തത്തിന്റെ ദൃശ്യഭാഷയും നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട രണ്ടാം വാക്യത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
