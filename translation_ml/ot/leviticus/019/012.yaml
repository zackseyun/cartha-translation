revisions:
- from: എന്റെ നാമത്തെച്ചൊല്ലി കള്ളസത്യം ചെയ്യരുത്; അങ്ങനെ നിന്റെ ദൈവത്തിന്റെ നാമത്തെ അശുദ്ധമാക്കരുത്.[a] ഞാൻ യഹ്‌വേ ആകുന്നു.
  to: എന്റെ നാമത്തെച്ചൊല്ലി വ്യാജമായി സത്യം ചെയ്ത് നിന്റെ ദൈവത്തിന്റെ നാമം അശുദ്ധമാക്കരുത്.[a] ഞാൻ യഹ്‌വേ ആകുന്നു.
