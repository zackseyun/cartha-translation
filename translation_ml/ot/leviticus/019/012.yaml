    text: 'അക്ഷരാർഥത്തിൽ: “എന്റെ നാമത്തെച്ചൊല്ലി വ്യാജത്തിനായി സത്യം ചെയ്യരുത്.”'
    reason: lexical_alternative
  revision_rationale: The revision retains the direct legal force of the verse while connecting false swearing and the profanation of God’s name in a natural Malayalam construction. The footnote is narrowed to the lexical alternative it is meant to document and corrected for grammar.
