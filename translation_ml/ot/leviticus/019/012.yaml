id: LEV.19.12
reference: Leviticus 19:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא תִשָּׁבְע֥וּ בִ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/חִלַּלְתָּ֛ אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/012.yaml
  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: ml
  text: എന്റെ നാമത്തെച്ചൊല്ലി വ്യാജമായി സത്യം ചെയ്ത് നിന്റെ ദൈവത്തിന്റെ നാമം അശുദ്ധമാക്കരുത്.[a] ഞാൻ യഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “എന്റെ നാമത്തെച്ചൊല്ലി വ്യാജത്തിനായി സത്യം ചെയ്യരുത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: സത്യം ചെയ്യരുത്
  rationale: നിഫാൽ രൂപത്തിലുള്ള שׁבע നിയമപരവും ധാർമികവുമായ സന്ദർഭത്തിൽ ശപഥം ചെയ്യുക എന്നർഥം നൽകുന്നു. മലയാളത്തിൽ ‘സത്യം ചെയ്യുക’ സാധാരണവും സ്വാഭാവികവുമായ പ്രയോഗമാണ്.
- source_word: בִשְׁמִי
  choice: എന്റെ നാമത്തെച്ചൊല്ലി
  rationale: ശപഥസന്ദർഭത്തിലെ ב, ആരുടെ നാമത്തെ ആധാരമാക്കി ശപഥം ചെയ്യുന്നു എന്നു സൂചിപ്പിക്കുന്നു; ‘നാമത്തെച്ചൊല്ലി’ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַשָּׁקֶר
  choice: കള്ളസത്യം
  rationale: അക്ഷരാർഥം ‘വ്യാജത്തിനായി/കള്ളത്തിനായി’ എന്നാണെങ്കിലും, ശപഥസന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗം ‘കള്ളസത്യം’ ആണ്. കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וְחִלַּלְתָּ
  choice: അങ്ങനെ ... അശുദ്ധമാക്കരുത്
  rationale: പിയേൽ രൂപത്തിലുള്ള חלל വിശുദ്ധമായതിനെ അശുദ്ധമാക്കുക, അപവിത്രമാക്കുക എന്നർഥം നൽകുന്നു. ഹീബ്രു വാക്യഘടനയിലെ ഫലബന്ധം ‘അങ്ങനെ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള നിരോധനത്തിന്റെ ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘അശുദ്ധമാക്കരുത്’ ഉപയോഗിച്ചു.
- source_word: שֵׁם
  choice: നാമം
  rationale: ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വവും മഹത്വവും സൂചിപ്പിക്കുന്ന പ്രാധാന്യമുള്ള പദമായതിനാൽ ‘നാമം’ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവം
  rationale: രൂപപരമായി ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും ഇവിടെ ഏകവചനസൂചകമായ പ്രത്യയത്തോടുകൂടി ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സാധാരണമായ ‘യഹ്‌വേ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷര നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരിനു പകരം ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- issue: രണ്ടാം ഉപവാക്യത്തിന്റെ ബലം
  choice: 'ഫലബന്ധം: ‘അങ്ങനെ ... അശുദ്ധമാക്കരുത്’'
  alternative: 'ലളിതമായ സംയോജനം: ‘... അശുദ്ധമാക്കുകയും അരുത്’'
  rationale: വ്യാജശപഥം ദൈവനാമത്തെ അശുദ്ധമാക്കുന്നതായി വാക്യം ബന്ധിപ്പിക്കുന്നു. ‘അങ്ങനെ’ ഈ ബന്ധം വ്യക്തമാക്കുന്നു; എന്നാൽ അതിനെ അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- issue: וְחִלַּלְתָּ എന്ന രൂപത്തിന്റെ മലയാള വ്യാകരണബലം
  choice: നിരോധനത്തിന്റെ തുടർച്ചയായി ‘അശുദ്ധമാക്കരുത്’
  alternative: രൂപപരമായി ‘നീ അശുദ്ധമാക്കും’ / ‘അശുദ്ധമാക്കുകയും ചെയ്യും’
  rationale: ഹീബ്രുവിൽ രണ്ടാമത്തെ ക്രിയ രൂപപരമായി രണ്ടാംപുരുഷ ഏകവചനമാണ്; മുൻ നിരോധനത്തിന്റെ ഫലമോ തുടർച്ചയോ ആയി പ്രവർത്തിക്കുന്നു. മലയാളത്തിൽ ‘അശുദ്ധമാക്കരുത്’ നിയമവാക്യത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള നിയമശൈലി. ‘നാമം’, ‘യഹ്‌വേ’ എന്നിവ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു; ‘കള്ളസത്യം ചെയ്യുക’ സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
