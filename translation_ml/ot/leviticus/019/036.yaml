source:
  edition: WLC
  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: ml
  text: നീതിയുള്ള തുലാസ്സുകളും നീതിയുള്ള തൂക്കക്കട്ടികളും നീതിയുള്ള ഏഫാ അളവും നീതിയുള്ള ഹീൻ അളവും നിങ്ങൾക്കുണ്ടായിരിക്കണം.[a] ഈജിപ്തുദേശത്തുനിന്ന് നിങ്ങളെ പുറപ്പെടുവിച്ച നിങ്ങളുടെ ദൈവമായ യഹോവ ഞാനാകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതിയുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തിയ צֶדֶק എന്ന ഒരേ ഹീബ്രുപദം തുലാസ്സ്, തൂക്കക്കട്ടി, ഏഫാ, ഹീൻ എന്നിവയോടൊപ്പം നാലുതവണ ആവർത്തിക്കുന്നു. ഇവിടെ അത് വ്യാപാരത്തിലെ നീതിയും വിശ്വസനീയമായ അളവും സൂചിപ്പിക്കുന്നു. ഏഫാ ഉണങ്ങിയ സാധനങ്ങൾക്കും ഹീൻ ദ്രവങ്ങൾക്കും ഉപയോഗിച്ചിരുന്ന പുരാതന അളവുകളാണ്.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: നീതിയുള്ള തുലാസ്സുകൾ
  rationale: מֹאזְנַיִם വ്യാപാരത്തിൽ തൂക്കുന്നതിനുള്ള തുലാസ്സുകളെ സൂചിപ്പിക്കുന്നു. צֶדֶק എന്ന ആവർത്തിത പദത്തിന്റെ നീതി/നേരിന്റെ ധാർമ്മിക ശക്തി നിലനിർത്താൻ ‘നീതിയുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אַבְנֵי צֶדֶק
  choice: നീതിയുള്ള തൂക്കക്കട്ടികൾ
  rationale: אַבְנֵי എന്നതിന്റെ അക്ഷരാർഥം ‘കല്ലുകൾ’ ആണെങ്കിലും ഇവിടെ വ്യാപാരത്തിലെ മാനക തൂക്കക്കട്ടികളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ രൂപം ഉപയോഗിച്ചു.
- source_word: אֵיפַת צֶדֶק
  choice: നീതിയുള്ള ഏഫാ അളവ്
  rationale: אֵיפָה പുരാതനകാലത്തെ ഉണങ്ങിയ സാധനങ്ങളുടെ അളവാണ്. സംസ്കാരപരമായ പ്രത്യേകത കാത്തുസൂക്ഷിക്കാൻ പേരിനെ ലിപ്യന്തരണം ചെയ്ത് ‘അളവ്’ ചേർത്തു.
- source_word: וְהִין צֶדֶק
  choice: നീതിയുള്ള ഹീൻ അളവ്
  rationale: הִין പുരാതനകാലത്തെ ദ്രവ അളവാണ്. മൂലപദം നിലനിർത്തുകയും മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ‘അളവ്’ ചേർക്കുകയും ചെയ്തു.
- source_word: יִהְיֶה לָכֶם
  choice: നിങ്ങൾക്കുണ്ടായിരിക്കണം
  rationale: അക്ഷരാർഥമായ ‘നിങ്ങൾക്കായി ഉണ്ടായിരിക്കട്ടെ/ഉണ്ടായിരിക്കണം’ എന്ന നിയമപരമായ നിർദേശത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: യഹോവയോടു ചേർന്ന ഉടമ്പടിസൂത്രത്തിൽ ഏകവചനാർഥമുള്ള ‘നിങ്ങളുടെ ദൈവം’ എന്നതിനെ മലയാള വാക്യഘടനയ്ക്ക് യോജിച്ചവിധം നൽകി.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന് നിങ്ങളെ പുറപ്പെടുവിച്ച
  rationale: പുറപ്പാടിനെ അടിസ്ഥാനമാക്കിയുള്ള ഉടമ്പടിസൂത്രത്തിന്റെ കാരണബന്ധവും പ്രവർത്തകന്റെ ഊന്നലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: വ്യാപാരനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ആവർത്തിക്കുന്ന צֶדֶק എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നീതിയുള്ള
  alternative: സത്യസന്ധമായ; കൃത്യമായ; ന്യായമായ
  rationale: ‘കൃത്യമായ’ എന്നത് അളവിന്റെ സാങ്കേതിക ശരിതെറ്റിലേക്ക് മാത്രം അർഥം ചുരുക്കാം; ‘സത്യസന്ധമായ’ വ്യാപാരത്തിലെ ധാർമ്മികത വ്യക്തമാക്കുമെങ്കിലും മൂലപദത്തിന്റെ നീതി/ന്യായം എന്ന വിശാലമായ അർഥമേഖല കുറയ്ക്കും. നാലിടത്തും ഒരേ പദം ആവർത്തിച്ച് മൂലത്തിലെ ശൈലിയും ധാർമ്മിക ഊന്നലും കാത്തു.
- issue: പുരാതന അളവുകളുടെ അവതരണം
  choice: ഏഫാ, ഹീൻ എന്നീ പേരുകൾ നിലനിർത്തി ‘അളവ്’ ചേർക്കുക
  alternative: ഉണങ്ങിയ സാധനങ്ങളുടെ അളവ്; ദ്രവ അളവ്; ആധുനിക ഏകദേശ പരിവർത്തനം
  rationale: കൃത്യമല്ലാത്ത ആധുനിക തുല്യങ്ങൾ നൽകാതെ മൂലസംസ്കാരത്തിലെ പ്രത്യേക അളവുകൾ സംരക്ഷിക്കുന്നു; ‘അളവ്’ ചേർക്കുന്നത് സാധാരണ വായനക്കാരന് അവയുടെ സ്വഭാവം ഉടൻ വ്യക്തമാക്കുന്നു.
- issue: ദൈവനാമം יְהוָה
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: ഒരു പദവികൊണ്ട് വ്യക്തിനാമം മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ലിപ്യന്തരരൂപം ഉപയോഗിച്ചു; ഹീബ്രു ഉച്ചാരണത്തിന്റെ കൃത്യരൂപം അനിശ്ചിതമാണെന്ന വസ്തുത ഇതിലൂടെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ഹീബ്രുവിലെ നാലുമടങ്ങുള്ള ആവർത്തനം നിലനിർത്തി. പുരാതന അളവുപേരുകൾക്ക് പിന്നാലെ ‘അളവ്’ ചേർത്ത് പ്രധാനവാചകത്തിൽ തന്നെ വ്യക്തത നൽകി; വിശദീകരണം ഒരൊറ്റ [a] അടിക്കുറിപ്പിൽ ഉൾപ്പെടുത്തി.
