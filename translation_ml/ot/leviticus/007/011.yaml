id: LEV.7.11
reference: Leviticus 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת זֶ֣בַח הַ/שְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: ml
  text: യാഹ്‌വേയ്ക്ക് അർപ്പിക്കുന്ന സമാധാനയാഗത്തിന്റെ നിയമം ഇതാണ്:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്ഷേമയാഗം”; പരമ്പരാഗതമായി “സമാധാനയാഗം.”
    reason: שְׁלָמִים എന്ന പദത്തിന്റെ സമാധാനം/ക്ഷേമം/സമ്പൂർണത ഉൾക്കൊള്ളുന്ന അർത്ഥവ്യാപ്തി അറിയിക്കാൻ.
lexical_decisions:
- source_word: וְ/זֹאת
  choice: ഇതാണ്
  rationale: വാക്യം പുതിയ ഉപവിഭാഗം അവതരിപ്പിക്കുന്നു. וְ എന്ന ബന്ധകത്തിന്റെ പ്രഭാഷണതലത്തിലുള്ള പ്രവർത്തനം മലയാളത്തിൽ പ്രത്യേകം ‘ഇപ്പോൾ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: תּוֹרַת
  choice: ചട്ടം
  rationale: പുരോഹിതനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ תּוֹרָה ഒരു ആചാരക്രമത്തെ സംബന്ധിച്ച നിർദിഷ്ട നിയമമോ ചട്ടമോ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘ചട്ടം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും നിയമപരമായ ഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗം
  rationale: זֶבַח ബലിയർപ്പണത്തെയും שְׁלָמִים സമാധാനം, ക്ഷേമം, സമ്പൂർണത എന്നിവയുമായി ബന്ധപ്പെട്ട സാങ്കേതിക യാഗവിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ‘സമാധാനയാഗം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יַקְרִיב
  choice: അർപ്പിക്കേണ്ട
  rationale: יַקְרִיב എന്ന ഹിഫിൽ രൂപം യാഗസന്ദർഭത്തിൽ കൊണ്ടുവന്ന് സമർപ്പിക്കുക/അർപ്പിക്കുക എന്നർത്ഥം നൽകുന്നു. നിയമനിർദേശത്തിന്റെ പൊതുവായ പ്രാബല്യം മലയാളത്തിലെ ‘അർപ്പിക്കേണ്ട’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഹീബ്രായത്തിലെ ഏകവചന പുരുഷരൂപത്തെ അനാവശ്യമായി ലിംഗനിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: לַ/יהוָה
  choice: യഹോവയ്ക്ക്
  rationale: לְ സമർപ്പണത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു. ഉടമ്പടിനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത് ‘യഹോവ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് ഉള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: שְׁלָמִים എന്ന യാഗസാങ്കേതികപദം
  choice: സമാധാനയാഗം
  alternative: ക്ഷേമയാഗം / കൂട്ടായ്മയാഗം
  rationale: പദത്തിൽ സമാധാനം, ക്ഷേമം, സമ്പൂർണത എന്നിവയുടെ അർത്ഥവ്യാപ്തിയുണ്ട്. മുഖ്യപാഠത്തിൽ പാരമ്പര്യവും വ്യക്തതയും നിലനിർത്തി ‘സമാധാനയാഗം’ ഉപയോഗിക്കുകയും മറ്റൊരു അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യാഗസാങ്കേതികത നിലനിർത്തിക്കൊണ്ട് അമിതമായി സംസ്കൃതവൽക്കരിച്ച നിയമഭാഷ ഒഴിവാക്കി.
