language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֖ר מִ/בְּשַׂ֣ר הַ/זָּ֑בַח בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י בָּ/אֵ֖שׁ יִשָּׂרֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/017.yaml
  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
translation:
  language: ml
  text: എന്നാൽ യാഗത്തിന്റെ മാംസത്തിൽ ശേഷിച്ചിരിക്കുന്നത് മൂന്നാം ദിവസം തീയിൽ ചുട്ടുകളയണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: എന്നാൽ … ശേഷിക്കുന്നതു
  rationale: വാക്യം മുൻനിർദേശത്തിന്റെ തുടർച്ചയായിരിക്കുമ്പോഴും ശേഷിപ്പിനെക്കുറിച്ചുള്ള വ്യത്യസ്ത നിർദേശം അവതരിപ്പിക്കുന്നതിനാൽ וְ എന്ന സംയോജകത്തിന് ‘എന്നാൽ’ എന്നത് സ്വാഭാവികമാണ്. നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന നിഫാൽ കൃതന്തത്തിന്റെ അർഥം ‘ശേഷിക്കുന്നതു’ എന്നു നിലനിർത്തുന്നു.
- source_word: מִבְּשַׂר הַזָּבַח
  choice: യാഗത്തിന്റെ മാംസത്തിൽ
  rationale: בָּשָׂר എന്നത് ‘മാംസം/ശരീരം’ എന്നർഥമുള്ളതാണെങ്കിലും, യാഗഭക്ഷണത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘മാംസം’ വ്യക്തവും സ്വാഭാവികവുമാണ്. מִן എന്ന വിഭക്തിയുടെ ഭാഗാത്മക അർഥം മലയാളത്തിലെ ‘-ത്തിൽ’ വഴി പ്രകടമാക്കുന്നു.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: എബ്രായ കാലസൂചനയുടെ നേരിട്ടുള്ളതും സാധാരണ മലയാളത്തിലുള്ളതുമായ പരിഭാഷ.
- source_word: בָּאֵשׁ
  choice: തീയിൽ
  rationale: തീ ഉപയോഗിച്ച് ദഹിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന בְּ എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: יִשָּׂרֵף
  choice: ചുട്ടുകളയണം
  rationale: നിഫാൽ അപൂർണക്രിയ ഇവിടെ നിയമപരമായ നിർദേശം നൽകുന്നു. ‘ചുട്ടുകളയണം’ നിർബന്ധഭാവവും തീയിൽ പൂർണമായി നശിപ്പിക്കണമെന്ന സാഹചര്യാർഥവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
