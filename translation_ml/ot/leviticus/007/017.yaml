translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി ഉപയോഗിച്ചു. ‘ചുട്ടുകളയണം’ എന്ന രൂപം ഔപചാരികതയും സാധാരണ വായനാസൗകര്യവും തമ്മിൽ തുലനം ചെയ്യുന്നു.
