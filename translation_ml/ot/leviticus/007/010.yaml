source:
  edition: WLC
  text: וְ/כָל מִנְחָ֥ה בְלוּלָֽה בַ/שֶּׁ֖מֶן וַ/חֲרֵבָ֑ה לְ/כָל בְּנֵ֧י אַהֲרֹ֛ן תִּהְיֶ֖ה אִ֥ישׁ כְּ/אָחִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/010.yaml
  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: ml
  text: എണ്ണയിൽ കലക്കിയതോ ഉണങ്ങിയതോ ആയ എല്ലാ ധാന്യയാഗവും അഹരോന്റെ എല്ലാ പുത്രന്മാർക്കും ആയിരിക്കണം; ഓരോരുത്തർക്കും തന്റെ സഹോദരനോടു തുല്യവിഹിതമായി ലഭിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഓരോരുത്തനും തന്റെ സഹോദരനെപ്പോലെ.” അഹരോന്റെ പുത്രന്മാർക്കിടയിൽ തുല്യമായി വിഭജിക്കപ്പെടുന്നതാണ് എബ്രായ പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസന്ദർഭത്തിൽ ഇത് പൊതുവായ വഴിപാടല്ല, ധാന്യത്തിൽനിന്നുള്ള പ്രത്യേക യാഗമാണ്.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്തുകലർത്തിയ
  rationale: എണ്ണയോടു കലർത്തിയുള്ള തയ്യാറാക്കൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֲרֵבָה
  choice: ഉണങ്ങിയ
  rationale: എണ്ണ ചേർത്തുകലർത്തിയ യാഗത്തോടുള്ള മൂലപാഠത്തിലെ സംക്ഷിപ്തമായ വൈരുധ്യം നിലനിർത്തുന്നു; ‘എണ്ണ ചേർക്കാത്ത’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: അഹരോന്റെ എല്ലാ പുത്രന്മാർക്കും അവകാശപ്പെട്ടതായിരിക്കണം
  rationale: ലാമെദ് സഹിതമുള്ള היה ഇവിടെ ഉടമസ്ഥതയെയോ വിഹിതാവകാശത്തെയോ സൂചിപ്പിക്കുന്നു; നിയമപരമായ വിതരണഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי אַהֲרֹן
  choice: അഹരോന്റെ ... പുത്രന്മാർ
  rationale: പുരോഹിതനിയമസന്ദർഭത്തിലെ വ്യക്തമായ പുരുഷലിംഗ ബന്ധപദം നിഷ്പക്ഷമാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: אִישׁ כְּאָחִיו
  choice: ഓരോരുത്തനും തന്റെ സഹോദരനെപ്പോലെ തുല്യമായി
  rationale: അഹരോന്റെ പുത്രന്മാർക്കിടയിലെ തുല്യവിതരണം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിതരണാർഥവും സഹോദരതാരതമ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുരോഹിതരെ സൂചിപ്പിക്കുന്ന ലിംഗനിർദ്ദിഷ്ട ഭാഷ
  choice: അഹരോന്റെ എല്ലാ പുത്രന്മാർക്കും ... ഓരോരുത്തനും തന്റെ സഹോദരനെപ്പോലെ
  alternative: അഹരോന്റെ സന്തതികൾക്കെല്ലാം തുല്യമായി
  rationale: എബ്രായം പുരോഹിതനിയമസന്ദർഭത്തിൽ വ്യക്തമായി പുരുഷബന്ധപദങ്ങൾ ഉപയോഗിക്കുന്നതിനാൽ അവയെ ലിംഗനിഷ്പക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-ആരാധനാഭാഷ. ‘ധാന്യയാഗം’ സാങ്കേതിക യാഗപദമായി ഉപയോഗിച്ചു; തുല്യവിതരണത്തിന്റെ ആശയം മുഖ്യപാഠത്തിൽ വ്യക്തമായി നൽകിയെങ്കിലും എബ്രായ പ്രയോഗത്തിന്റെ മറ്റൊരു അടുത്ത രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
