source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵי/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: ml
  text: രണ്ടു വൃക്കകളും, അവയുടെമേലും അരക്കെട്ടിന്മേലും ഉള്ള കൊഴുപ്പും, കരളിന്മേലുള്ള അനുബന്ധഭാഗവും[a]—അത് വൃക്കകളോടൊപ്പം നീക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കരളിന്മേലുള്ള മടൽ’. ഈ ശരീരഭാഗത്തിനുള്ള എബ്രായപദം ഒരു സാങ്കേതികപദമാണ്; അത് കൃത്യമായി ഏതു ഭാഗത്തെ സൂചിപ്പിക്കുന്നു എന്നതിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: രണ്ടു വൃക്കകൾ
  rationale: യാഗസംബന്ധമായ ശരീരഘടനാവിവരണത്തിൽ כְּלָיוֹת വ്യക്തമായി വൃക്കകളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ഇതാണ് സ്വാഭാവികവും കൃത്യവുമായ പദം.
- source_word: הַחֵלֶב
  choice: കൊഴുപ്പ്
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസന്ദർഭത്തിൽ חֵלֶב യാഗത്തിനായി വേർതിരിക്കുന്ന കൊഴുപ്പുള്ള ഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘കൊഴുപ്പ്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: അവയുടെമേൽ
  rationale: עַל എന്നതിന്റെ നേരിട്ടുള്ള സ്ഥലസൂചന നിലനിർത്തുന്നു; ‘അവയെ മൂടുന്ന’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: הַכְּסָלִים
  choice: അരക്കെട്ടിന്റെ ഭാഗം
  rationale: ഈ പദം വൃക്കകൾക്കടുത്തുള്ള അരക്കെട്ട്/പാർശ്വപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ശരീരഭാഗം സാധാരണ മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധത്തിൽ പറയുന്നു; അതിരുകടന്ന ശരീരശാസ്ത്രകൃത്യത അവകാശപ്പെടുന്നില്ല.
- source_word: הַיֹּתֶרֶת
  choice: അനുബന്ധഭാഗം
  rationale: ഇത് യാഗനിയമങ്ങളിലെ സാങ്കേതിക ശരീരഘടനാപദമാണ്; കൃത്യമായി ഏതു ഭാഗമാണെന്നത് വിവാദമായതിനാൽ ‘അനുബന്ധഭാഗം’ അമിതകൃത്യത ഒഴിവാക്കി മൂലത്തിലെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: עַל הַכָּבֵד
  choice: കരളിന്മേലുള്ള
  rationale: עַל എന്നതിന്റെ ലളിതമായ സ്ഥലാർഥം നിലനിർത്തുന്നു; ‘കരളോടു ചേർന്നിരിക്കുന്ന’ എന്ന വിശദീകരണം പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: עַל הַכְּלָיֹת
  choice: വൃക്കകളോടൊപ്പം
  rationale: ഈ യാഗനിർദേശത്തിലെ നടപടിക്രമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കേവലം സ്ഥലസൂചനയായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: יְסִירֶנָּה
  choice: അത് ... നീക്കണം
  rationale: ഹിഫ്ഇൽ ക്രിയ ഇവിടെ യാഗത്തിന്റെ നടപടിക്രമനിർദേശമാണ്. ഏകവചന പ്രത്യയം അനുബന്ധഭാഗത്തെ സൂചിപ്പിക്കുന്ന രീതിയിൽ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
