translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യത്തിലെ പട്ടികാസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് അവസാന നിർദേശം വ്യക്തമായി വേർതിരിക്കാൻ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പുചിഹ്നം ‘വൃക്കകൾ’ എന്നതിനു പിന്നാലെയായിരുന്നെങ്കിലും അടിക്കുറിപ്പ് הַיֹּתֶרֶת എന്ന കരളിലെ സാങ്കേതിക ഭാഗത്തെക്കുറിച്ചായതിനാൽ, മൂലഭാഷാ തെളിവനുസരിച്ച് ചിഹ്നം ‘അനുബന്ധഭാഗം’ എന്നതിനോടു ചേർത്തു.
