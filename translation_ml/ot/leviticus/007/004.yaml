- from: രണ്ടു വൃക്കകളും, അവയുടെമേൽ അരക്കെട്ടിന്റെ ഭാഗത്തുള്ള കൊഴുപ്പും, കരളിന്മേലുള്ള അനുബന്ധഭാഗവും[a]—അത് വൃക്കകളോടൊപ്പം നീക്കണം.
