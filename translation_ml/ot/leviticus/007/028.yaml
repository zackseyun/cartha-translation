lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: തുടർന്നുവരുന്ന ദൈവിക വചനത്തെ പരിചയപ്പെടുത്തുന്ന וַיְדַבֵּר എന്ന ക്രിയയ്ക്ക് മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികവും ആദരസൂചകവുമായ പ്രയോഗം; אמר എന്നതിൽനിന്നുള്ള വ്യത്യാസം സന്ദർഭത്തിൽ അനാവശ്യമായി കൃത്രിമമാക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി YHWH-ന്റെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം; ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് വ്യക്തിനാമത്തെ മറയ്ക്കുന്നില്ല.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്ന് നേരിട്ടുള്ള വചനം വരുന്നതായി സൂചിപ്പിക്കുന്ന എബ്രായ സൂത്രവാക്യത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. മലയാള വായനക്കാർക്കു സുപരിചിതമായ ‘യഹോവ’ അത് പേരായിത്തന്നെ നിലനിർത്തുന്നു; ഉച്ചാരണത്തിന്റെ പണ്ഡിതപുനർനിർമാണമായ ‘യാഹ്‌വേ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്താൻ ദ്വിബിന്ദു ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
