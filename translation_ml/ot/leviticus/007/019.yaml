  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/בָּשָׂ֞ר אֲשֶׁר יִגַּ֤ע בְּ/כָל טָמֵא֙ לֹ֣א יֵֽאָכֵ֔ל בָּ/אֵ֖שׁ יִשָּׂרֵ֑ף וְ/הַ֨/בָּשָׂ֔ר כָּל טָה֖וֹר יֹאכַ֥ל בָּשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: ml
  text: എന്നാൽ, അശുദ്ധമായ എന്തിലെങ്കിലും[a] തൊടുന്ന മാംസം ഭക്ഷിക്കരുത്; അത് തീയിൽ ചുട്ടുകളയണം. മാംസത്തെ സംബന്ധിച്ചിടത്തോളം, ശുദ്ധിയുള്ള ഏവർക്കും മാംസം ഭക്ഷിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘അശുദ്ധം’, ‘ശുദ്ധി’ എന്നീ പദങ്ങൾ ആചാരപരമായ നിലയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അശുദ്ധമായ എന്തിലെങ്കിലും തൊടുന്ന’ എന്നതിന് ‘അശുദ്ധമായ ഏതെങ്കിലും വസ്തുവുമായി സമ്പർക്കത്തിൽ വരുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: എന്നാൽ ... മാംസം
  rationale: בָּשָׂר ഇവിടെ യാഗമാംസത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആരംഭത്തിലെ വാവ്, ഭക്ഷിക്കാവുന്നതും ഭക്ഷിക്കരുതാത്തതുമായ മാംസങ്ങൾ തമ്മിലുള്ള വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: അശുദ്ധമായ എന്തിലെങ്കിലും തൊടുന്ന
  rationale: יִגַּע ശാരീരിക സമ്പർക്കത്തെയും כָּל טָמֵא ആചാരപരമായി അശുദ്ധമായ വസ്തുവിന്റെ വിശാല വിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു. അതിനെ അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: לֹא יֵאָכֵל
  choice: ഭക്ഷിക്കരുത്
  rationale: നിഫാൽ രൂപത്തിലെ നിഷേധാത്മക നിയമബലം, സ്വാഭാവികവും വ്യക്തവുമായ മലയാള നിരോധനരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: അത് തീയിൽ ചുട്ടുകളയണം
  rationale: അശുദ്ധമായ യാഗമാംസം തീകൊണ്ട് നശിപ്പിക്കണമെന്ന നിർബന്ധിത നടപടിയെ ‘ചുട്ടുകളയണം’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; בָּאֵשׁ എന്നത് ‘തീയിൽ’ എന്ന് മൂർത്തമായി നിലനിർത്തി.
- source_word: כָּל טָהוֹר
  choice: ശുദ്ധനായ ഏതൊരാൾക്കും
  rationale: വിശേഷണം ഇവിടെ ആചാരപരമായി ശുദ്ധനായ വ്യക്തിയെ നാമമായി സൂചിപ്പിക്കുന്നു. ‘ഏതൊരാൾക്കും’ നിയമത്തിലെ ഉൾക്കൊള്ളുന്ന അനുമതി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֹאכַל בָּשָׂר
  choice: ആ മാംസം ഭക്ഷിക്കാം
  rationale: ഇവിടെ രൂപം കല്പനയെക്കാൾ അനുമതിയാണ് നൽകുന്നത്. അവസാനത്തെ בָּשָׂר ലേഖനമില്ലാത്തതാണെങ്കിലും സന്ദർഭം അതേ യാഗമാംസമായതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക നിർദ്ദേശാർഥത്തിനായി ‘ആ മാംസം’ എന്നു നൽകി.
theological_decisions:
- issue: טָמֵא / טָהוֹר എന്നീ പദങ്ങളുടെ സ്വഭാവം
  choice: ‘അശുദ്ധം’ / ‘ശുദ്ധൻ’ എന്നു നൽകി, അടിക്കുറിപ്പിൽ ആചാരപരമായ നിലയാണെന്ന് വ്യക്തമാക്കി.
  alternative: ‘മലിനം’ / ‘നിർമലൻ’ അല്ലെങ്കിൽ ധാർമ്മിക അശുദ്ധി/ശുദ്ധി സൂചിപ്പിക്കുന്ന ഭാഷ
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗനിയമസന്ദർഭത്തിൽ ഈ പദങ്ങൾ പ്രാഥമികമായി ആചാരപരമായ നിലയെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യക്തിപരമായ പാപമോ ധാർമ്മിക ഗുണമോ പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമഭാവം നിലനിർത്താൻ ‘ഭക്ഷിക്കരുത്’, ‘ചുട്ടുകളയണം’; അനുമതി വ്യക്തമാക്കാൻ ‘ഭക്ഷിക്കാം’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
