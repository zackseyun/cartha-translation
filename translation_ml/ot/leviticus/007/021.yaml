revisions:
- from: ഒരാൾ ഏതെങ്കിലും അശുദ്ധവസ്തുവിനെ—മനുഷ്യനുമായി ബന്ധപ്പെട്ട അശുദ്ധിയെയോ അശുദ്ധമായ ഒരു മൃഗത്തെയോ അശുദ്ധവും അറപ്പുളവാക്കുന്നതുമായ ഏതെങ്കിലും വസ്തുവിനെയോ—തൊടുകയും യഹോവയ്ക്കുള്ള സമാധാനയാഗത്തിന്റെ മാംസത്തിൽനിന്ന് തിന്നുകയും ചെയ്താൽ, ആ വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടണം.[a]
  to: ഒരാൾ ഏതെങ്കിലും അശുദ്ധവസ്തുവിനെ—മനുഷ്യനുമായി ബന്ധപ്പെട്ട അശുദ്ധിയെയോ, അശുദ്ധമായ ഒരു മൃഗത്തെയോ, അശുദ്ധവും അറപ്പുളവാക്കുന്നതുമായ ഏതെങ്കിലും വസ്തുവിനെയോ—തൊടുകയും യഹോവയ്ക്കുള്ള സമാധാനയാഗത്തിന്റെ മാംസത്തിൽനിന്ന് ഭക്ഷിക്കുകയും ചെയ്താൽ, ആ വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും.[a]
  rationale: The revision preserves the source’s broad ritual categories and its unresolved sanction while making the final consequence more idiomatic and source-sensitive in Malayalam. The footnote is made more neutral and continues to explain the ambiguity without specifying death, excommunication, or another mechanism.
