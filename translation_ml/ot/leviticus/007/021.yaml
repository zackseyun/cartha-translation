source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: ml
  text: ഒരാൾ ഏതെങ്കിലും അശുദ്ധവസ്തുവിനെ—മനുഷ്യനുമായി ബന്ധപ്പെട്ട അശുദ്ധിയെയോ, അശുദ്ധമായ ഒരു മൃഗത്തെയോ, അശുദ്ധവും അറപ്പുളവാക്കുന്നതുമായ ഏതെങ്കിലും വസ്തുവിനെയോ—തൊടുകയും യഹോവയ്ക്കുള്ള സമാധാനയാഗത്തിന്റെ മാംസത്തിൽനിന്ന് ഭക്ഷിക്കുകയും ചെയ്താൽ, ആ വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഛേദിക്കപ്പെടും’ എന്നത് ഉടമ്പടിയുമായി ബന്ധപ്പെട്ട ശിക്ഷാസൂത്രമാണ്. അത് സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലിനെയോ ദൈവിക ന്യായവിധിയെയോ സൂചിപ്പിക്കാം; ഇത് എങ്ങനെ നടപ്പാകുമെന്ന് എബ്രായപാഠം ഇവിടെ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ഒരാൾ / ആ വ്യക്തി
  rationale: നിയമസന്ദർഭത്തിൽ ഈ പദം അമൂർത്തമായ ‘ആത്മാവ്’ എന്നതിലുപരി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘ഒരാൾ’ എന്നും തുടർപരാമർശത്തിൽ ‘ആ വ്യക്തി’ എന്നും പറയുന്നത് സ്വാഭാവികവും ലിംഗനിരപേക്ഷവുമാണ്.
- source_word: תִגַּע
  choice: തൊടുകയും
  rationale: നגע എന്ന ക്രിയയുടെ അടിസ്ഥാനാർത്ഥമായ ‘തൊടുക’ നിലനിർത്തുന്നു; ആചാരപരമായ സമ്പർക്കം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: בְּכָל טָמֵא
  choice: ഏതെങ്കിലും അശുദ്ധവസ്തുവിനെ
  rationale: വിശാലവും അനിശ്ചിതവുമായ പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ സമഗ്രമായി അവതരിപ്പിക്കുന്നു.
- source_word: טֻמְאַת אָדָם
  choice: മനുഷ്യനുമായി ബന്ധപ്പെട്ട അശുദ്ധി
  rationale: മനുഷ്യനിൽനിന്നോ മനുഷ്യശരീരവുമായി ബന്ധപ്പെട്ടോ ഉണ്ടാകുന്ന ആചാരപരമായ അശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മനുഷ്യന്റെ അശുദ്ധി’ എന്ന പ്രയോഗം ധാർമിക അശുദ്ധിയായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: അശുദ്ധമായ ഒരു മൃഗം
  rationale: בְּהֵמָה ഇവിടെ പൊതുവായ മൃഗപദമാണ്; ‘മൃഗം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: שֶׁקֶץ טָמֵא
  choice: അശുദ്ധവും അറപ്പുളവാക്കുന്നതുമായ വസ്തു
  rationale: שֶׁקֶץ സൂചിപ്പിക്കുന്ന ആചാരപരമായ വെറുപ്പും അറപ്പും നിലനിർത്തുന്നു; അതിനെ പ്രത്യേകിച്ച് ഇഴജന്തുക്കളിൽ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: וְאָכַל מִבְּשַׂר
  choice: മാംസത്തിൽനിന്ന് തിന്നുകയും
  rationale: മִן എന്ന ഭാഗികതാസൂചന ‘മാംസത്തിൽനിന്ന്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗം
  rationale: ശְׁלָמִים എന്ന യാഗനാമത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ തുല്യപദമാണിത്; ‘കൂട്ടായ്മയാഗം’ എന്ന വ്യാഖ്യാനാത്മക അർത്ഥത്തിലേക്ക് പാഠത്തെ ചുരുക്കുന്നില്ല.
- source_word: אֲשֶׁר לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: യാഗം യഹോവയ്ക്കായി സമർപ്പിക്കപ്പെട്ടതും അവനുള്ളതുമാണെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יהוה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമത്തെ പേരായി സുതാര്യമായി പ്രതിനിധീകരിക്കുന്നു; ആധുനിക മലയാള ക്രൈസ്തവ വായനയിൽ തിരിച്ചറിയാവുന്ന രൂപമാണിത്.
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടണം
  rationale: നിയമപരമായ ഉടമ്പടി-ശിക്ഷാസൂത്രത്തിന്റെ ശക്തി നിലനിർത്തുകയും ശിക്ഷ നടപ്പാകുന്ന കൃത്യമായ വിധം വിവർത്തനത്തിൽ നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ എന്ന ശിക്ഷാസൂത്രത്തിന്റെ കൃത്യമായ അർത്ഥം
  choice: ‘തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടണം’ എന്ന ഔപചാരികവും തുറന്നതുമായ പ്രയോഗം നിലനിർത്തി
  alternative: ‘ജനത്തിൽനിന്ന് പുറത്താക്കപ്പെടണം’ അല്ലെങ്കിൽ ‘കൊല്ലപ്പെടണം’
  rationale: ഇത് സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലാണോ, മരണശിക്ഷയാണോ, ദൈവിക ന്യായവിധിയാണോ എന്ന് ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ആചാരപരമായ ‘അശുദ്ധി’ എന്ന പദസഞ്ചയം തുടർച്ചയായി നിലനിർത്തി. നീണ്ട എബ്രായ വ്യവസ്ഥാവാക്യം ഡാഷുകൾ ഉപയോഗിച്ച് വായനാസൗകര്യമുള്ളതാക്കി; എന്നാൽ സ്പർശിക്കലും യാഗമാംസം ഭക്ഷിക്കലും ചേർന്ന വ്യവസ്ഥ മാറ്റിയിട്ടില്ല.
