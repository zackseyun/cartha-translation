id: LEV.7.6
reference: Leviticus 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכְלֶ֑/נּוּ בְּ/מָק֤וֹם קָדוֹשׁ֙ יֵאָכֵ֔ל קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/006.yaml
  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: ml
  text: പുരോഹിതന്മാരിൽ ഓരോ പുരുഷനും അത് ഭക്ഷിക്കാം[a]. വിശുദ്ധമായ ഒരു സ്ഥലത്തുവെച്ച് അതു ഭക്ഷിക്കണം. അത് അതിവിശുദ്ധമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുരോഹിതന്മാരിലെ ഓരോ പുരുഷനും അത് ഭക്ഷിക്കണം.” എബ്രായക്രിയയെ ഇങ്ങനെ കൂടുതൽ ഔപചാരികമായി പരിഭാഷപ്പെടുത്താം; ഇവിടെ പുരോഹിതവർഗത്തിലെ ഏതൊരു പുരുഷനും അത് ഭക്ഷിക്കാൻ അനുവാദമുണ്ടെന്നതാണ് സന്ദർഭത്തിലെ ആശയം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “വിശുദ്ധങ്ങളുടെ വിശുദ്ധം”; അത്യുന്നതമായ വിശുദ്ധതയെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: പുരോഹിതന്മാരിൽ ഓരോ പുരുഷനും
  rationale: כָּל എന്നതിന്റെ വിതരണാർഥവും זָכָר എന്നതിന്റെ ലിംഗസൂചനയും בַּכֹּהֲנִים എന്നതിന്റെ കൂട്ടത്തിനുള്ളിലെ അംഗത്വവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יֹאכְלֶנּוּ
  choice: അത് ഭക്ഷിക്കാം
  rationale: ഈ യാഗനിയമസന്ദർഭത്തിൽ അപൂർണ്ണക്രിയ അനുവദിക്കപ്പെട്ട അവകാശം സൂചിപ്പിക്കുന്നു; അതിനാൽ നിർബന്ധത്തേക്കാൾ അനുമതി വ്യക്തമാക്കുന്ന രൂപം തിരഞ്ഞെടുത്തു.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: വിശുദ്ധമായ ഒരു സ്ഥലത്തുവെച്ച്
  rationale: מָקוֹם എന്ന പദത്തിന് നിർദ്ദിഷ്ടതയില്ലാത്തതിനാൽ ‘ഒരു സ്ഥലം’ എന്നു നൽകി; ‘വിശുദ്ധസ്ഥലം’ എന്നു ചേർത്തെഴുതി സങ്കേതത്തിലെ ഒരു പ്രത്യേക ഭാഗമെന്ന ധാരണ വരുത്തിയില്ല.
- source_word: יֵאָכֵל
  choice: അതു ഭക്ഷിക്കണം
  rationale: നിഫാൽ കർമണിപ്രയോഗത്തിലെ നിയമപരമായ നിർദേശം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സ്ഥലം സംബന്ധിച്ച നിർബന്ധം നിലനിർത്തുന്നു.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധം
  rationale: അക്ഷരാർഥത്തിലെ ‘വിശുദ്ധങ്ങളുടെ വിശുദ്ധം’ ഇവിടെ പരമോന്നത വിശുദ്ധതയെ സൂചിപ്പിക്കുന്ന എബ്രായ അതിശയോക്തിപ്രയോഗമാണ്; ബലിവസ്തുവിന്റെ വർഗീകരണം വ്യക്തമായി നൽകുന്നു.
- source_word: הוּא
  choice: അത് ... ആണ്
  rationale: മുൻസന്ദർഭത്തിലെ യാഗവസ്തുവിലേക്കുള്ള ഏകവചന സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭക്ഷിക്കാനുള്ള അവകാശം പുരോഹിതവർഗത്തിലെ പുരുഷന്മാർക്കായി പരിമിതപ്പെടുത്തുന്നത്
  choice: പുരോഹിതന്മാരിൽ ഓരോ പുരുഷനും അത് ഭക്ഷിക്കാം
  alternative: ഓരോ പുരോഹിതനും അത് ഭക്ഷിക്കാം
  rationale: എബ്രായപാഠത്തിലെ זָכָר (‘പുരുഷൻ/ആൺ’) ഒഴിവാക്കാതെ നിയമത്തിലെ ലിംഗപരമായ പരിധി അതേപടി നിലനിർത്തുന്നു.
- issue: יֹאכְלֶנּוּ അനുമതിയോ നിർബന്ധമോ എന്ന വ്യാകരണസാധ്യത
  choice: ഭക്ഷിക്കാം
  alternative: ഭക്ഷിക്കണം
  rationale: യാഗഭാഗത്തിൽ പങ്കുചേരാൻ യോഗ്യരായവരെ നിർണ്ണയിക്കുന്ന സന്ദർഭമായതിനാൽ അനുവദിക്കപ്പെട്ട അവകാശം മുഖ്യമായി പ്രകടിപ്പിച്ചു; കൂടുതൽ ഔപചാരികമായ നിർബന്ധവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘ഭക്ഷിക്കാം’ എന്നത് അനുമതിയും ‘ഭക്ഷിക്കണം’ എന്നത് സ്ഥലത്തെക്കുറിച്ചുള്ള നിർബന്ധവും വേർതിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
