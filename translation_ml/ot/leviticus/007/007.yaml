id: LEV.7.7
reference: Leviticus 7:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כַּֽ/חַטָּאת֙ כָּֽ/אָשָׁ֔ם תּוֹרָ֥ה אַחַ֖ת לָ/הֶ֑ם הַ/כֹּהֵ֛ן אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: ml
  text: പാപയാഗംപോലെ തന്നെയാണ് കുറ്റയാഗവും[a]; അവ രണ്ടിനും ഒരേ നിയമമാണ്[b]. അതുപയോഗിച്ച് പ്രായശ്ചിത്തം ചെയ്യുന്ന പുരോഹിതന് അത് അവകാശപ്പെട്ടതായിരിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “പാപയാഗംപോലെ കുറ്റയാഗവും.”'
    reason: lexical_alternative
  - marker: b
    text: “നിയമം” എന്നതിനുള്ള എബ്രായപദം തോറാ; “നിർദേശം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: “അതിലൂടെ പ്രായശ്ചിത്തം ചെയ്യുന്ന പുരോഹിതന് അത് ഉണ്ടായിരിക്കും”; അതായത്, ആ യാഗം നിർവഹിക്കുന്ന പുരോഹിതനാണ് അത് ലഭിക്കുക.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת כָּאָשָׁם
  choice: പാപയാഗംപോലെ തന്നെയാണ് കുറ്റയാഗവും
  rationale: כ־ സൂചിപ്പിക്കുന്ന താരതമ്യം നിലനിർത്തുന്നു. യാഗസന്ദർഭത്തിൽ חַטָּאת ‘പാപയാഗം’ എന്നും אָשָׁם ‘കുറ്റയാഗം’ എന്നും വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക താരതമ്യഘടനയ്ക്കായി ‘പോലെ തന്നെയാണ് ...വും’ ഉപയോഗിച്ചു.
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: അവ രണ്ടിനും ഒരേ നിയമമാണ്
  rationale: ഇവിടെ תּוֹרָה യാഗക്രമത്തെ നിയന്ത്രിക്കുന്ന നിയമം/നിർദേശം എന്ന അർഥത്തിലാണ്. ദ്വിവചനബോധം വ്യക്തമാക്കാൻ לָהֶם എന്നതിനെ ‘അവ രണ്ടിനും’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַכֹּהֵן אֲשֶׁר יְכַפֵּר בּוֹ
  choice: അതുപയോഗിച്ച് പ്രായശ്ചിത്തം ചെയ്യുന്ന പുരോഹിതൻ
  rationale: כפר എന്ന യാഗശാസ്ത്രപരമായ പദത്തിന്റെ ദൈവശാസ്ത്രഭാരം ‘പ്രായശ്ചിത്തം ചെയ്യുക’ എന്നതിലൂടെ നിലനിർത്തി. בּוֹ യാഗത്തെ ഉപാധിയായി സൂചിപ്പിക്കുന്നതിനാൽ ‘അതുപയോഗിച്ച്’ എന്നു നൽകി; മൂലത്തിൽ പറയാത്ത കർമവിഷയം ചേർത്തിട്ടില്ല.
- source_word: לוֹ יִהְיֶה
  choice: അത് അവകാശപ്പെട്ടതായിരിക്കും
  rationale: ഈ പ്രയോഗം നിർവഹണപുരോഹിതനുള്ള നിയമപരമായ ലഭ്യതയെയും ഉടമസ്ഥാവകാശത്തെയും സൂചിപ്പിക്കുന്നു. ‘അവകാശപ്പെട്ടതായിരിക്കും’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
theological_decisions:
- issue: യാഗനിയമത്തിലെ כפר എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: പ്രായശ്ചിത്തം ചെയ്യുക
  alternative: പാപപരിഹാരം വരുത്തുക; ശുദ്ധീകരണം നടത്തുക
  rationale: ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം അടിച്ചേൽപ്പിക്കാതെ, പുരോഹിതയാഗസന്ദർഭത്തിലെ പദത്തിന്റെ വിശാലമായ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ അർഥം ‘പ്രായശ്ചിത്തം ചെയ്യുക’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാഭാഷ. ‘പാപയാഗം’, ‘കുറ്റയാഗം’, ‘പ്രായശ്ചിത്തം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
