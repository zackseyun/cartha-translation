  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: ml
  text: 'യഹ്‌വെയുടെ അഗ്നിയർപ്പണങ്ങളിൽനിന്ന് അഹരോനുള്ള അഭിഷേകവിഹിതവും[a] അവന്റെ പുത്രന്മാർക്കുള്ള അഭിഷേകവിഹിതവും ഇതാണ്: അവരെ യഹ്‌വെയ്ക്ക് പുരോഹിതന്മാരായി ശുശ്രൂഷ ചെയ്യാൻ അവൻ ഹാജരാക്കിയ ദിവസം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അഭിഷേകവിഹിതം’ എന്നതിന് ‘അഭിഷേകത്തോടനുബന്ധിച്ച് നിശ്ചയിച്ച വിഹിതം’ എന്നും അർഥമാകാം. എബ്രായപദം അഭിഷേകവുമായി ബന്ധപ്പെട്ടതാണെങ്കിലും ഇവിടെ പുരോഹിതർക്കുള്ള ഓഹരിയെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: അഭിഷേകവിഹിതം
  rationale: ഈ പദം അഭിഷേകവുമായി പദോൽപ്പത്തിപരമായി ബന്ധപ്പെട്ടിരിക്കുന്നു; എന്നാൽ ഇവിടെ പുരോഹിതാഭിഷേകത്തോടനുബന്ധിച്ച് ലഭിക്കുന്ന നിശ്ചിത വിഹിതത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അഭിഷേകവിഹിതം’ ഇരു വശങ്ങളും നിലനിർത്തുന്നു.
- source_word: מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו
  choice: അഹരോനുള്ള അഭിഷേകവിഹിതവും അവന്റെ പുത്രന്മാർക്കുള്ള അഭിഷേകവിഹിതവും
  rationale: എബ്രായത്തിലെ ആവർത്തനം ചുരുക്കാതെ നിലനിർത്തുന്നു; בָּנָיו അഹരോന്റെ പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: യഹ്‌വെയുടെ അഗ്നിയർപ്പണങ്ങളിൽനിന്ന്
  rationale: אִשֶּׁה യാഗപീഠത്തിലെ അഗ്നിയിലൂടെ അർപ്പിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്നു. ‘അഗ്നിയർപ്പണം’ ഉറവിടചിത്രം നിലനിർത്തുന്നു; מִן എന്ന ‘നിന്ന്’ ബന്ധവും വ്യക്തമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് ചേർന്ന മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: בְּיוֹם
  choice: ദിവസംമുതൽ
  rationale: ഈ സന്ദർഭത്തിൽ പുരോഹിതവിഹിതം നിലവിൽ വന്ന നിയമനാവസരത്തെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: הִקְרִיב אֹתָם
  choice: അവൻ അവരെ ഹാജരാക്കി
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘അടുത്തുകൊണ്ടുവരുക/മുമ്പാകെ ഹാജരാക്കുക’ എന്ന അർഥമുണ്ട്. മനുഷ്യരാണ് കർമമെന്നതിനാൽ ‘ബലിയർപ്പിച്ചു’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു; വ്യക്തമാക്കാത്ത കർത്താവിനെ ‘അവൻ’ എന്നുതന്നെ നിലനിർത്തുന്നു.
- source_word: לְכַהֵן לַיהוָה
  choice: യഹ്‌വെയ്ക്കു പുരോഹിതന്മാരായി ശുശ്രൂഷ ചെയ്യാൻ
  rationale: כהן എന്ന ക്രിയയിലെ പുരോഹിതസേവനത്തിന്റെ തൊഴിൽപരവും ആരാധനാപരവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിലെ מִשְׁחַת എന്ന പദത്തിന്റെ അർഥം
  choice: അഭിഷേകവുമായി ബന്ധപ്പെട്ട നിശ്ചിത വിഹിതം
  alternative: അഭിഷേകം; വിഹിതം മാത്രം
  rationale: സന്ദർഭം യഹ്‌വെയുടെ അർപ്പണങ്ങളിൽനിന്നുള്ള പുരോഹിതാവകാശത്തെക്കുറിച്ചാണ്; എങ്കിലും പദത്തിന്റെ അഭിഷേകബന്ധം പൂർണമായി ഇല്ലാതാക്കാതെ ‘അഭിഷേകവിഹിതം’ എന്നു നൽകി അർഥസമ്മർദം സംരക്ഷിക്കുന്നു.
- issue: הִקְרִיב എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: ‘അവൻ’ എന്നു മാത്രം നൽകി അവ്യക്തത നിലനിർത്തുക
  alternative: മോശെ എന്നു വ്യക്തമാക്കുക
  rationale: സന്ദർഭത്തിൽ മോശെയായിരിക്കാമെങ്കിലും ഈ വാക്യം കർത്താവിന്റെ പേര് പറയുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ പേര് മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യാഗസാങ്കേതിക പദങ്ങൾക്ക് ലളിതമായ സംയുക്തപദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ആവർത്തനവും വ്യക്തമാക്കാത്ത കർത്താവും സംരക്ഷിച്ചു.
