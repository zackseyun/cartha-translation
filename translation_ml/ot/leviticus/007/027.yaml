revisions:
- from: ഏതെങ്കിലും രക്തം ഭക്ഷിക്കുന്ന ഓരോ വ്യക്തിയും—ആ വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടണം[a][b].
  to: ഏതു രക്തം കഴിക്കുന്ന ഏതൊരാളും—ആ വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും[a][b].
  rationale: The revision makes the passive legal consequence explicit in Malayalam, improves idiomatic phrasing, and leaves the source text’s deliberate ambiguity about the nature of being “cut off” intact. Footnote b is adjusted only to match the revised wording.
