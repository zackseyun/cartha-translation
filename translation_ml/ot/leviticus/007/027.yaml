  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: ml
  text: ഏതു രക്തം കഴിക്കുന്ന ഏതൊരാളും—ആ വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രാണൻ.’ ഇവിടെ എബ്രായത്തിലെ നെഫെഷ് എന്ന പദം ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഛേദിക്കപ്പെടും’ എന്നത് ഉടമ്പടി ലംഘനത്തിനുള്ള ശിക്ഷയെ സൂചിപ്പിക്കുന്ന പതിവു പ്രയോഗമാണ്. അത് സമൂഹത്തിൽനിന്നുള്ള നീക്കത്തെയോ ദൈവിക ന്യായവിധിയെയോ സൂചിപ്പിക്കാം; ഇവിടെ അതിന്റെ കൃത്യമായ രീതി എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: വ്യക്തി
  rationale: നിയമസന്ദർഭത്തിൽ נֶפֶשׁ ഇവിടെ ശരീരത്തിൽനിന്ന് വേറിട്ട ‘ആത്മാവ്’ എന്നതിനെക്കാൾ ഒരു വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വ്യക്തി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: תֹּאכַל
  choice: ഭക്ഷിക്കുന്ന
  rationale: ബന്ധവാക്യത്തിലെ അപൂർണ്ണക്രിയ പൊതുവായ നിയമസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ഭക്ഷിക്കുന്ന’ അതിന്റെ പൊതുവർത്തമാന സ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל דָּם
  choice: ഏതെങ്കിലും രക്തം
  rationale: എണ്ണാനാവാത്ത നാമത്തോടുള്ള כָּל ഇവിടെ വിതരണാത്മകമായി ‘ഏതെങ്കിലും’ എന്ന അർഥം നൽകുന്നു; രക്തം ഏതു രൂപത്തിലായാലും എന്ന ആശയം ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: וְנִכְרְתָה
  choice: ഛേദിക്കപ്പെടണം
  rationale: כרת എന്ന നിഫാൽ രൂപത്തിന്റെ ഉടമ്പടി-ന്യായവിധിസൂത്രത്തെ ഔപചാരികമായി നിലനിർത്തുന്നു. സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലാണോ മരണശിക്ഷയാണോ ദൈവിക ന്യായവിധിയാണോ എന്ന് വിവർത്തനം നിർണയിക്കുന്നില്ല.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ആ വ്യക്തി
  rationale: നാമത്തിന്റെ ആവർത്തനവും സൂചകപദവും കുറ്റക്കാരനെ ഊന്നിപ്പറഞ്ഞ് വീണ്ടും പരാമർശിക്കുന്നു; ‘ആ വ്യക്തി’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מֵעַמֶּיהָ
  choice: തന്റെ ജനത്തിൽനിന്ന്
  rationale: എബ്രായത്തിലെ സ്ത്രീലിംഗ പ്രത്യയം נֶפֶשׁ എന്ന നാമത്തിന്റെ വ്യാകരണലിംഗത്തോടാണ് യോജിക്കുന്നത്; നിയമം സ്ത്രീകൾക്കു മാത്രമുള്ളതല്ല. ലിംഗനിരപേക്ഷമായ ‘തന്റെ’ വ്യക്തിയുടെ സ്വന്തം ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ഛേദിക്കപ്പെടുക’ എന്ന ഉടമ്പടി-ശിക്ഷാസൂത്രത്തിന്റെ അർഥം
  choice: ശിക്ഷയുടെ കൃത്യമായ രീതി വ്യക്തമാക്കാതെ ‘ഛേദിക്കപ്പെടണം’ എന്ന ഔപചാരിക പ്രയോഗം നിലനിർത്തി.
  alternative: ‘വധിക്കപ്പെടണം,’ ‘സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടണം,’ അല്ലെങ്കിൽ ‘ദൈവത്താൽ നശിപ്പിക്കപ്പെടണം.’
  rationale: എബ്രായ സൂത്രം സംക്ഷിപ്തവും വ്യത്യസ്ത വ്യാഖ്യാനങ്ങൾക്ക് ഇടനൽകുന്നതുമാണ്. വിവാദമായ നിയമപരമോ ദൈവശാസ്ത്രപരമോ ആയ വിശദീകരണം പാഠത്തിലേക്ക് ചേർക്കാതെ അതിന്റെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ‘വ്യക്തി,’ ‘തന്റെ’ എന്നിവ ഉപയോഗിച്ച് അനാവശ്യ ലിംഗസൂചന ഒഴിവാക്കി. ‘ഛേദിക്കപ്പെടണം’ എന്ന ഔപചാരിക പ്രയോഗം മൂലപാഠത്തിന്റെ ഉടമ്പടി-ശിക്ഷാസൂത്രവും അതിലെ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
