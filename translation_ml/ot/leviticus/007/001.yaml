id: LEV.7.1
reference: Leviticus 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הָ/אָשָׁ֑ם קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/001.yaml
  text: 'This is the law of the guilt offering: it is most holy[a].'
translation:
  language: ml
  text: 'ഇതാണ് അകൃത്യയാഗത്തിന്റെ നിയമം: അത് അതിവിശുദ്ധമാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നഷ്ടപരിഹാരയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പദമായ ആശാം കുറ്റത്തോടും നഷ്ടപരിഹാരം നൽകുന്നതിനോടും ബന്ധപ്പെട്ട ഒരു യാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: ഇതാണ്
  rationale: വാവ് സഹിതമുള്ള നിർദേശക സർവനാമം പുതിയ ചട്ടവിഭാഗം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ അനാവശ്യമായ കാലസൂചന ചേർക്കാതെ ‘ഇതാണ്’ എന്നു നൽകുന്നത് സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: תּוֹרַת
  choice: നിയമം
  rationale: ഇവിടെ തോറാ യാഗത്തിനുള്ള നിർദിഷ്ട ചട്ടത്തെയോ നടപടിക്രമത്തെയോ സൂചിപ്പിക്കുന്നു; ‘നിയമം’ ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ സന്ദർഭത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: הָאָשָׁם
  choice: അകൃത്യയാഗം
  rationale: ആശാം കുറ്റബോധത്തോടും നഷ്ടപരിഹാരത്തോടും ബന്ധപ്പെട്ട പ്രത്യേക യാഗവിഭാഗമാണ്. മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ ‘അകൃത്യയാഗം’ പ്രധാനപാഠത്തിൽ ഉപയോഗിച്ച് നഷ്ടപരിഹാരത്തിന്റെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധം
  rationale: ഹീബ്രായിയിലെ ആവർത്തനാത്മക പരമോന്നതപ്രയോഗം ഏറ്റവും ഉയർന്ന വിശുദ്ധിനിലയെ സൂചിപ്പിക്കുന്നു. ‘അതിവിശുദ്ധം’ വിശുദ്ധമന്ദിരത്തിലെ പ്രത്യേക സ്ഥലവുമായി ആശയക്കുഴപ്പം ഉണ്ടാക്കാതെ ഈ വർഗീകരണം വ്യക്തമാക്കുന്നു.
- source_word: הוּא
  choice: അത് ... ആണ്
  rationale: സർവനാമം യാഗത്തെ അതിവിശുദ്ധമായ വിഭാഗത്തിൽ ഉൾപ്പെടുത്തി വിധേയപ്രയോഗമായി നിൽക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ സംയോജകഘടന ഉപയോഗിച്ചു.
theological_decisions:
- issue: אָשָׁם എന്ന യാഗപദത്തിന്റെ പരിഭാഷ
  choice: അകൃത്യയാഗം
  alternative: പ്രായശ്ചിത്തയാഗം / നഷ്ടപരിഹാരയാഗം
  rationale: ഇത് ലേവ്യനിയമത്തിലെ ഒരു പ്രത്യേക യാഗവിഭാഗമാണ്. ‘അകൃത്യയാഗം’ കുറ്റത്തിന്റെ വശം നിലനിർത്തുകയും മലയാളത്തിലെ പരിചിതമായ ആചാരപദമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്നു; എന്നാൽ പദത്തിൽ ഉൾപ്പെട്ട നഷ്ടപരിഹാരത്തിന്റെ ആശയം അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. യാഗസാങ്കേതിക പദത്തിന് മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ രൂപം നിലനിർത്തി; വ്യത്യസ്ത അർത്ഥസൂചന അടിക്കുറിപ്പിൽ ചേർത്തു.
