id: LEV.7.2
reference: Leviticus 7:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת הָ֣/עֹלָ֔ה יִשְׁחֲט֖וּ אֶת הָ/אָשָׁ֑ם וְ/אֶת דָּמ֛/וֹ יִזְרֹ֥ק עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: ml
  text: ഹോമയാഗമൃഗത്തെ അറുക്കുന്ന സ്ഥലത്ത് അവർ കുറ്റപരിഹാരയാഗമൃഗത്തെയും[a] അറുക്കണം. അതിന്റെ രക്തം അവൻ യാഗപീഠത്തിന്റെ എല്ലാ വശങ്ങളിലും തളിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അകൃത്യയാഗമൃഗം’ എന്നോ ‘നഷ്ടപരിഹാരയാഗമൃഗം’ എന്നോ വിവർത്തനം ചെയ്യാം. എബ്രായപദം കുറ്റത്തെയും അതിനുള്ള പരിഹാരം വരുത്തുന്നതിനെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: അറുക്കുന്ന സ്ഥലത്തുവെച്ചുതന്നെ
  rationale: സ്ഥലസൂചനയും ഒരേ സ്ഥലത്താണ് ഇരു യാഗമൃഗങ്ങളെയും അറുക്കേണ്ടതെന്ന നടപടിക്രമപരമായ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִשְׁחֲטוּ
  choice: അവർ ... അറുക്കണം
  rationale: യാഗസന്ദർഭത്തിലെ ആചാരപരമായ മൃഗവധത്തെ സൂചിപ്പിക്കുന്ന שׁחט എന്ന ക്രിയയ്ക്ക് ‘അറുക്കുക’ കൃത്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമാണ്.
- source_word: הָעֹלָה
  choice: ഹോമയാഗമൃഗം
  rationale: עוֹלָה എന്ന യാഗവിഭാഗത്തെ ‘ഹോമയാഗം’ എന്നു നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ അറുക്കപ്പെടുന്നത് യാഗമൃഗമാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הָאָשָׁם
  choice: അകൃത്യയാഗമൃഗം
  rationale: אָשָׁם സൂചിപ്പിക്കുന്ന കുറ്റവും അതോടനുബന്ധിച്ച പരിഹാരവും ഉൾക്കൊള്ളുന്ന യാഗവിഭാഗത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ തിരിച്ചറിയാവുന്ന ‘അകൃത്യയാഗം’ ഉപയോഗിക്കുന്നു; അറുക്കപ്പെടുന്നത് മൃഗമാണെന്ന് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: דָּמוֹ
  choice: അതിന്റെ രക്തം
  rationale: ഏകവചന പ്രത്യയം അകൃത്യയാഗമൃഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ ഉടമസ്ഥപ്രയോഗം സ്വീകരിച്ചു.
- source_word: יִזְרֹק
  choice: തളിക്കണം
  rationale: זָרַק ഇവിടെ രക്തം യാഗപീഠത്തിലേക്ക് എറിഞ്ഞ് പ്രയോഗിക്കുന്ന ആചാരക്രിയയാണ്. മലയാളത്തിലെ ‘തളിക്കുക’ ഈ നടപടിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; നേർത്ത ‘വിതറൽ’ എന്ന ആശയത്തിലേക്ക് അതിനെ പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: യാഗപീഠത്തിന്റെ ചുറ്റും
  rationale: രക്തം യാഗപീഠത്തിന്റെ ചുറ്റുമുള്ള വശങ്ങളിൽ പ്രയോഗിക്കണമെന്ന സָבִיב എന്ന പദത്തിന്റെ പരിധിസൂചന സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אָשָׁם എന്ന യാഗപദത്തിന്റെ വിവർത്തനം
  choice: അകൃത്യയാഗം
  alternative: കുറ്റപരിഹാരയാഗം / നഷ്ടപരിഹാരയാഗം
  rationale: വാക്യം യാഗനടപടി വിവരിക്കുന്നതിനാൽ കുറ്റവും പരിഹാരവും തമ്മിലുള്ള ബന്ധം ഒരു പ്രത്യേക സിദ്ധാന്തത്തിലേക്ക് ചുരുക്കാതെ, സ്ഥാപിതവും മനസ്സിലാകുന്നതുമായ യാഗവിഭാഗനാമം മുഖ്യപാഠത്തിൽ നൽകി; പുനഃസ്ഥാപനത്തിന്റെയും നഷ്ടപരിഹാരത്തിന്റെയും ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. ‘അറുക്കണം’, ‘തളിക്കണം’ എന്നീ രൂപങ്ങൾ എബ്രായത്തിലെ നിർദേശാത്മക അപൂർണ്ണക്രിയകളെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു. യാഗപദങ്ങളുടെ സാങ്കേതിക സ്വഭാവം നിലനിർത്തിയിട്ടും സാധാരണ വായനക്കാർക്ക് മൃഗമാണ് അറുക്കപ്പെടുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
