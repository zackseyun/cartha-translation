  text: אֲשֶׁר֩ צִוָּ֨ה יְהוָ֜ה לָ/תֵ֣ת לָ/הֶ֗ם בְּ/יוֹם֙ מָשְׁח֣/וֹ אֹתָ֔/ם מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: ml
  text: യാഹ്‌വേ അവരെ അഭിഷേകം ചെയ്ത ദിവസം ഇസ്രായേൽമക്കളിൽനിന്ന് അവർക്കു നൽകാൻ കൽപിച്ചതു—അവരുടെ തലമുറകളിലുടനീളം നിലനിൽക്കുന്ന ഒരു ചട്ടം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യരിൽനിന്ന്.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേൽമക്കളിൽനിന്ന്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിരന്തരമായ ഒരു ചട്ടം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: അതാണിത്
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ പുരോഹിതർക്കുള്ള ഓഹരികളിലേക്കു ബന്ധവാക്യം തിരിച്ചുചൂണ്ടുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യബന്ധത്തിനായി ‘അതാണിത്’ എന്നു നൽകി.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: ദൈവിക അധികാരത്തോടുകൂടിയ നിയമപരമായ ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: לָתֵת לָהֶם
  choice: അവർക്കു നൽകണമെന്ന്
  rationale: എബ്രായത്തിലെ ‘അവർക്കു കൊടുക്കാൻ’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷ കല്പനയായി നൽകി; സ്വീകർത്താക്കൾ അഹരോനും പുത്രന്മാരുമാണ്.
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: അവരെ അഭിഷേകം ചെയ്ത ദിവസം
  rationale: മָשַׁח എന്ന ക്രിയയുടെ പ്രത്യേക അർഥമായ ‘അഭിഷേകം ചെയ്യുക’ നിലനിർത്തി; മൂന്നാം പുരുഷ ഏകവചന കർത്താവിനെ തുടർന്നുള്ള ‘അവിടുന്ന്’ വ്യക്തമാക്കുന്നു.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽനിന്ന്
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഉടമ്പടി-പ്രയോഗത്തിന്റെ രൂപവും, അവരിൽനിന്നാണ് പുരോഹിതവിഹിതം ലഭിക്കുന്നതെന്ന ഉറവിടാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: എന്നേക്കുമുള്ള ഒരു ചട്ടം
  rationale: ആരാധനാ-നിയമസന്ദർഭത്തിലെ സ്ഥിരമായി ബാധകമായ വ്യവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ദാർശനികമായ അനന്തതയെ അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: לְדֹרֹתָם
  choice: അവരുടെ തലമുറകളിലുടനീളം
  rationale: തുടർച്ചയായ തലമുറകളിലേക്കുള്ള പ്രാബല്യം സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റിയില്ല. മലയാള വായനക്കാർക്കു പരിചിതവും മാന്യവുമായ ‘യഹോവ’ ഉപയോഗിച്ചു; ഉച്ചാരണത്തിന്റെ മറ്റൊരു പുനർനിർമാണം അടിക്കുറിപ്പിൽ ആവശ്യമില്ലാതെ പാഠത്തിന്റെ വ്യക്തത കാത്തു.
- issue: עוֹלָם എന്ന പദത്തിന്റെ നിയമസന്ദർഭത്തിലെ വ്യാപ്തി
  choice: എന്നേക്കുമുള്ള ഒരു ചട്ടം
  alternative: നിരന്തരമായ ഒരു ചട്ടം
  rationale: തലമുറകളിലൂടെ തുടരുന്ന നിയമബാധ്യതയുടെ ശക്തി നിലനിർത്തുന്നു; അതിന്റെ പിന്നീട് ഉണ്ടായേക്കാവുന്ന ദൈവശാസ്ത്രപരമായ പ്രയോഗം പാഠംതന്നെ നിർണ്ണയിക്കുന്നതിലുപരി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമപരവും ആരാധനാസംബന്ധവുമായ ഗൗരവം നിലനിർത്തിയ സ്വാഭാവിക ശൈലി. ബന്ധവാക്യത്തിന്റെ മലയാളക്രമം വ്യക്തമാക്കാൻ ‘അതാണിത്’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
