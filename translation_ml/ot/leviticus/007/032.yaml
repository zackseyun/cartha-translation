id: LEV.7.32
reference: Leviticus 7:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין תִּתְּנ֥וּ תְרוּמָ֖ה לַ/כֹּהֵ֑ן מִ/זִּבְחֵ֖י שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/032.yaml
  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: ml
  text: കൂടാതെ, നിങ്ങളുടെ സമാധാനയാഗങ്ങളിൽനിന്ന് വലതുതുട ഒരു സമർപ്പിതവിഹിതമായി പുരോഹിതന് നിങ്ങൾ നൽകണം[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വലതുകാൽഭാഗം.’
    reason: lexical_alternative
  - marker: b
    text: ‘സമർപ്പിതവിഹിതമായി’ എന്നതിന് ‘ഒരു സമർപ്പണമായി’ എന്നും വിവർത്തനം ചെയ്യാം; പരമ്പരാഗതമായി ‘ഉയർത്തൽഅർപ്പണമായി.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘സൗഹൃദയാഗങ്ങൾ’ അല്ലെങ്കിൽ ‘ക്ഷേമയാഗങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: തുട
  rationale: യാഗമൃഗത്തിന്റെ കാലിന്റെ മുകൾഭാഗത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ആ ശരീരഭാഗം കൃത്യമായി വ്യക്തമാക്കാൻ ‘തുട’ സ്വാഭാവികമാണ്.
- source_word: הַיָּמִין
  choice: വലതു
  rationale: നിശ്ചിതമായി വേർതിരിക്കേണ്ട ഭാഗം വലതുവശത്തേതാണെന്ന് മൂലപാഠം വ്യക്തമാക്കുന്നതിനാൽ അതു നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: תִּתְּנוּ
  choice: നൽകണം
  rationale: നിയമനിർദേശത്തിലുള്ള രണ്ടാം പുരുഷ ബഹുവചന ക്രിയയുടെ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תְרוּמָה
  choice: സമർപ്പിതവിഹിതം
  rationale: വേർതിരിച്ച് ഏല്പിക്കുന്ന നിശ്ചിത വിഹിതം എന്ന ആശയം വ്യക്തമാക്കുന്നു; പദം സൂചിപ്പിക്കാത്ത പ്രത്യേക ഉയർത്തൽചടങ്ങ് വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- source_word: לַכֹּהֵן
  choice: പുരോഹിതന്
  rationale: സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന ഏകവചനം അതേപടി നിലനിർത്തുന്നു.
- source_word: מִזִּבְחֵי שַׁלְמֵיכֶם
  choice: നിങ്ങളുടെ സമാധാനയാഗങ്ങളിൽനിന്ന്
  rationale: מִן എന്നതിന്റെ സ്രോതസ്സർഥവും രണ്ടാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയവും നിലനിർത്തുന്നു; שְׁלָמִים എന്ന അംഗീകൃത യാഗപദത്തിന് ‘സമാധാനയാഗങ്ങൾ’ ഉപയോഗിക്കുന്നു.
- source_word: וְאֵת
  choice: വാക്യക്രമത്തിൽ പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: וְ മുൻസന്ദർഭത്തോടു ബന്ധിപ്പിക്കുന്നുവെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക നിയമവാക്യത്തിൽ വേറിട്ട ‘കൂടാതെ’ അനിവാര്യമല്ല; אֵת നേരിട്ടുള്ള കർമചിഹ്നമായതിനാൽ പ്രത്യേക പരിഭാഷയില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. യാഗസാങ്കേതികത വ്യക്തമാക്കാൻ ‘സമർപ്പിതവിഹിതം’ ഉപയോഗിച്ചിരിക്കുന്നു; പരമ്പരാഗതമായെങ്കിലും ഇന്നത്തെ വായനക്കാർക്ക് അസ്പഷ്ടമായ ‘ഉയർത്തിക്കാഴ്ച’ അടിക്കുറിപ്പിൽ മാത്രം നൽകിയിരിക്കുന്നു.
