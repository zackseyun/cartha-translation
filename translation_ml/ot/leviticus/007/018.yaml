id: LEV.7.18
reference: Leviticus 7:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: ml
  text: എന്നാൽ അവന്റെ സമാധാനയാഗത്തിന്റെ[a] മാംസത്തിൽനിന്ന് എന്തെങ്കിലും മൂന്നാം ദിവസം ഭക്ഷിച്ചാൽ, ആ യാഗം സ്വീകാര്യമാകുകയില്ല; അത് അർപ്പിക്കുന്നവന്റെ കണക്കിൽ വരികയുമില്ല. അത് അറപ്പുളവാക്കുന്ന ഒന്നായിരിക്കും[b]; അതിൽനിന്ന് ഭക്ഷിക്കുന്ന വ്യക്തി തന്റെ കുറ്റം വഹിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമാധാനയാഗം’ എന്നത് ‘കൂട്ടായ്മയാഗം’ എന്നും ‘ക്ഷേമയാഗം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘മലിനമായ മാംസം’ അഥവാ ‘വെറുപ്പുളവാക്കുന്ന വസ്തു’ എന്നും വിവർത്തനം ചെയ്യാം. സ്വീകാര്യമല്ലാതെയും അറപ്പുളവാക്കുന്നതുമായിത്തീർന്ന യാഗവസ്തുവിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ഹീബ്രുപദമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … എങ്കിൽ
  rationale: മുൻനിയമത്തോടുള്ള വ്യത്യാസവും വ്യവസ്ഥയും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: ഭക്ഷിച്ചാൽ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട്–ഇംപർഫെക്റ്റ് ഘടനയുടെ ഊന്നൽ മലയാളത്തിൽ കൃത്രിമമായ ആവർത്തനമില്ലാതെ വ്യവസ്ഥയുടെ ഗൗരവത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: זֶבַח שְׁלָמָיו
  choice: അവന്റെ സമാധാനയാഗം
  rationale: പ്രത്യേക യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും സംക്ഷിപ്തവുമായ പദം; שלם എന്ന പദത്തിന്റെ സമാധാനം/സമ്പൂർണത എന്ന അർത്ഥമേഖലയും നിലനിർത്തുന്നു.
- source_word: לֹא יֵרָצֶה
  choice: സ്വീകാര്യമാകുകയില്ല
  rationale: യാഗസന്ദർഭത്തിലെ רצה ന്റെ അർത്ഥം ദൈവസന്നിധിയിലെ സ്വീകാര്യതയാണ്.
- source_word: לֹא יֵחָשֵׁב לוֹ
  choice: അർപ്പിക്കുന്നവന്റെ കണക്കിൽ വരികയുമില്ല
  rationale: חשב + ל എന്ന കണക്കിടൽ/വകവെച്ചുകൊടുക്കൽ ഭാവം സാധാരണ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פִּגּוּל
  choice: അറപ്പുളവാക്കുന്ന ഒന്ന്
  rationale: സ്വീകാര്യമല്ലാതെയും വെറുപ്പുളവാക്കുന്നതുമായിത്തീർന്ന യാഗവസ്തുവിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദത്തിന്റെ ശക്തി വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: וְהַנֶּפֶשׁ
  choice: വ്യക്തി
  rationale: ഇവിടെ נפש ശരീരത്തിൽനിന്ന് വേറിട്ട ആത്മാവിനെയല്ല, നിയമത്തിന് വിധേയനായ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: തന്റെ കുറ്റം വഹിക്കണം
  rationale: കുറ്റവും അതിനോടനുബന്ധിച്ച ഉത്തരവാദിത്വവും ഉൾക്കൊള്ളുന്ന ഹീബ്രു പ്രയോഗത്തെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: זֶבַח שְׁלָמָיו എന്ന യാഗനാമത്തിന്റെ വിവർത്തനം
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം / ക്ഷേമയാഗം
  rationale: ഇത് ഒരു പ്രത്യേക യാഗവിഭാഗമാണ്. ‘സമാധാനയാഗം’ ചരിത്രപരമായി തിരിച്ചറിയാവുന്നതും ഹീബ്രുവിലെ സമാധാനം, സമ്പൂർണത, ക്ഷേമം എന്നീ അർത്ഥസാധ്യതകൾ പൂർണമായി ഒതുക്കാത്തതുമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: עֲוֺנָהּ תִּשָּׂא എന്ന പ്രയോഗത്തിലെ കുറ്റവും ശിക്ഷാബാധ്യതയും
  choice: തന്റെ കുറ്റം വഹിക്കണം
  alternative: തന്റെ കുറ്റത്തിനുള്ള ശിക്ഷ വഹിക്കണം
  rationale: ഹീബ്രു പ്രയോഗം ശിക്ഷാബാധ്യതയെ സൂചിപ്പിക്കാമെങ്കിലും ‘ശിക്ഷ’ എന്നു മുഖ്യവാചകത്തിൽ ചേർക്കുന്നത് അർത്ഥം കൂടുതൽ നിർണ്ണയിക്കും; അതിനാൽ ഉറവിടത്തിലെ സംക്ഷിപ്തതയും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-ആരാധനാഭാഷ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ഏകവചന പൊതുപരാമർശം ലിംഗനിരപേക്ഷമായ ‘വ്യക്തി/തന്റെ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുകളുടെ വിഷയവും മുഖ്യവാചകത്തിലെ സ്ഥാനവും തമ്മിൽ പൊരുത്തക്കേടുണ്ടായതിനാൽ, ഉറവിടപദങ്ങളോട് യോജിച്ച വിധത്തിൽ [a] സമാധാനയാഗത്തിനും [b] פִּגּוּל എന്ന സാങ്കേതിക പദത്തിനും ചേർത്തു.
