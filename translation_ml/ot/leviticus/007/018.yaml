  source_fidelity: മുഖ്യവാചകം ഹീബ്രു വാക്യഘടനയെയും യാഗസംബന്ധമായ നിയമാർഥത്തെയും വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു. ‘സമാധാനയാഗം,’ ‘സ്വീകാര്യമാകുകയില്ല,’ ‘കണക്കിൽ വരികയുമില്ല,’ ‘അറപ്പുളവാക്കുന്ന ഒന്ന്’ എന്നിവ സന്ദർഭോചിതമാണ്. എന്നാൽ עֲוֺנָהּ תִּשָּׂא-യിലെ ഇംപർഫെക്റ്റ് ഫലവാചകത്തെ ‘വഹിക്കണം’ എന്നു പറയുന്നത് നിർബന്ധം/കല്പന എന്ന സൂക്ഷ്മഭാവം ചേർക്കുന്നു; ഭാവിഫലമായ ‘വഹിക്കും’ കൂടുതൽ കൃത്യമാണ്.
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാചകം സ്വാഭാവികവും മാന്യവുമായ നിയമ-ആരാധനാ രജിസ്റ്ററിൽ ഉണ്ട്. ‘തന്റെ കുറ്റം വഹിക്കും’ എന്ന തിരുത്തൽ വാക്യത്തിന്റെ അവസാനഭാഗം കൂടുതൽ നേരിട്ടും സ്വാഭാവികവുമാക്കുന്നു.
  terminology: ‘സമാധാനയാഗം’ പ്രത്യേക യാഗവിഭാഗത്തിന് യോജിച്ച പരമ്പരാഗത പദമാണ്; ബദലുകൾ അടിക്കുറിപ്പിൽ ഉചിതമായി നൽകിയിരിക്കുന്നു. פִּגּוּൽ-നുള്ള ‘അറപ്പുളവാക്കുന്ന ഒന്ന്’യും അതിന്റെ സാങ്കേതിക വിശദീകരണവും മതിയായതാണ്. അടിക്കുറിപ്പ്-ചിഹ്നങ്ങൾ യഥാക്രമം സമാധാനയാഗത്തിനും פִּגּוּലിനും ശരിയായി ചേർത്തിരിക്കുന്നു.
