id: LEV.7.37
reference: Leviticus 7:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֹ֣את הַ/תּוֹרָ֗ה לָֽ/עֹלָה֙ לַ/מִּנְחָ֔ה וְ/לַֽ/חַטָּ֖את וְ/לָ/אָשָׁ֑ם וְ/לַ֨/מִּלּוּאִ֔ים וּ/לְ/זֶ֖בַח הַ/שְּׁלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: ml
  text: ഇതാണ് ഹോമയാഗം, ധാന്യയാഗം, പാപയാഗം[a], അകൃത്യയാഗം[b], പുരോഹിതപ്രതിഷ്ഠാചടങ്ങുകൾ[c], സമാധാനയാഗബലി[d] എന്നിവയെക്കുറിച്ചുള്ള പ്രമാണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശുദ്ധീകരണയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദം പാപം കൈകാര്യം ചെയ്യുന്നതിനോടൊപ്പം അശുദ്ധി നീക്കുന്നതിനും ഊന്നൽ നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പരിഹാരയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദം കുറ്റബാധ്യതയെയും ആവശ്യമായ നഷ്ടപരിഹാരത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘നിറയ്ക്കലുകൾ’; പുരോഹിതന്മാരെ സ്ഥാനമേൽപ്പിക്കുന്ന പ്രതിഷ്ഠാചടങ്ങുകളെയാണ് ഈ ബഹുവചനപദം സൂചിപ്പിക്കുന്നത്. ‘പുരോഹിതപ്രതിഷ്ഠായാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: ‘കൂട്ടായ്മയാഗബലി’ അല്ലെങ്കിൽ ‘ക്ഷേമയാഗബലി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: ഇതാണ് ... പ്രമാണം
  rationale: സംഗ്രഹപ്രസ്താവനയായ ഹീബ്രു പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു. യാഗങ്ങളെ നിയന്ത്രിക്കുന്ന നിർദേശത്തെ സൂചിപ്പിക്കാൻ ‘പ്രമാണം’ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: לָעֹלָה
  choice: ഹോമയാഗം
  rationale: പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന עֹלָהയ്ക്ക് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദം.
- source_word: לַמִּנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ മִנְחָה ധാന്യത്തിൽനിന്നുള്ള വഴിപാടിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ധാന്യയാഗം’ ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: וְלַחַטָּאת
  choice: പാപയാഗം
  rationale: חַטָּאת പാപത്തോടും അശുദ്ധി നീക്കലോടും ബന്ധപ്പെട്ട യാഗമാണ്. പരിചിതമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി ശുദ്ധീകരണസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְלָאָשָׁם
  choice: അകൃത്യയാഗം
  rationale: אָשָׁם കുറ്റബാധ്യതയും പലപ്പോഴും പരിഹാരം നൽകേണ്ട ബാധ്യതയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ പരിചിതമായ യാഗനാമം ഉപയോഗിച്ച് പരിഹാരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְלַמִּלּוּאִים
  choice: പൗരോഹിത്യാഭിഷേകച്ചടങ്ങുകൾ
  rationale: ബഹുവചനമായ מִלּוּאִים പുരോഹിതന്മാരെ സ്ഥാനമേൽപ്പിക്കുന്ന സമഗ്രമായ പ്രതിഷ്ഠാചടങ്ങുകളെ സൂചിപ്പിക്കുന്നു; ഒറ്റ ‘യാഗം’ എന്നു ചുരുക്കാതെ മൂലത്തിലെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗബലി
  rationale: זֶבַח എന്ന ‘ബലി’യും שְׁלָמִים എന്ന യാഗവിഭാഗവും രണ്ടും പ്രകടമാക്കുന്നു. കൂട്ടായ്മയുടെയും ക്ഷേമത്തിന്റെയും അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: חַטָּאת എന്ന യാഗനാമത്തിന്റെ അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘പാപയാഗം’
  alternative: ‘ശുദ്ധീകരണയാഗം’
  rationale: പദം പാപപരിഹാരത്തെയും ആചാരപരമായ അശുദ്ധി നീക്കലിനെയും ഉൾക്കൊള്ളാം; ഒന്നിനെ മാത്രം നിർണായകമായി മുൻനിർത്താതെ മറ്റേ വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: אָשָׁם എന്ന യാഗത്തിന്റെ സ്വഭാവം
  choice: ‘അകൃത്യയാഗം’
  alternative: ‘പരിഹാരയാഗം’
  rationale: കുറ്റബാധ്യതയാണ് മുഖ്യപദത്തിൽ പ്രതിഫലിക്കുന്നത്; നഷ്ടപരിഹാരസൂചനയും ചില സന്ദർഭങ്ങളിൽ പ്രധാനമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: שְׁלָמִים എന്ന പദത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘സമാധാനയാഗം’
  alternative: ‘കൂട്ടായ്മയാഗം’ അല്ലെങ്കിൽ ‘ക്ഷേമയാഗം’
  rationale: ഹീബ്രു പദത്തിന്റെ അർഥവ്യാപ്തിയിൽ സമാധാനം, സമ്പൂർണക്ഷേമം, കൂട്ടായ്മ എന്നിവ ഉൾപ്പെടാം; പരിചിതരൂപം മുഖ്യപാഠത്തിലും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാഭാഷ ഉപയോഗിച്ചു. യാഗനാമങ്ങളിൽ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങൾ നിലനിർത്തിയപ്പോൾ, ഹീബ്രുവിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു. מִלּוּאִים എന്ന ബഹുവചനം ഒറ്റ യാഗമായി ചുരുക്കാതെ ‘ചടങ്ങുകൾ’ എന്നു നൽകി.
