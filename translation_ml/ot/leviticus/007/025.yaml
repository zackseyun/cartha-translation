id: LEV.7.25
reference: Leviticus 7:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: ml
  text: കാരണം, യഹോവയ്ക്ക് അഗ്നിയർപ്പണം[a] അർപ്പിക്കുന്നതിനായി ഉപയോഗിക്കുന്ന മൃഗത്തിന്റെ കൊഴുപ്പ് ആരെങ്കിലും ഭക്ഷിച്ചാൽ, അത് ഭക്ഷിക്കുന്ന വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അഗ്നിയിൽ ദഹിപ്പിക്കുന്ന വഴിപാട്’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദം യാഗപീഠത്തിലെ അഗ്നിയിൽ ദഹിപ്പിച്ച് യഹോവയ്ക്ക് അർപ്പിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഛേദിക്കപ്പെടും’ എന്നത് എബ്രായ നിയമസൂത്രം അതേപടി സംരക്ഷിക്കുന്നു. ഇതിന്റെ കൃത്യമായ ശിക്ഷ എന്താണെന്നത് തർക്കവിഷയമാണ്; സമൂഹത്തിൽനിന്നുള്ള ബഹിഷ്കരണം, മരണം, അല്ലെങ്കിൽ ദൈവിക ന്യായവിധി എന്നിവ ഇതിൽ ഉൾപ്പെട്ടേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: എങ്കിൽ
  rationale: മുൻവിലക്കിന്റെ അടിസ്ഥാനമോ വിശദീകരണമോ അവതരിപ്പിക്കുന്ന ഘടകം; മലയാളത്തിൽ വ്യവസ്ഥാസ്വഭാവമുള്ള നിയമവാക്യമായി സ്വാഭാവികമായി ചേർത്തു.
- source_word: כָּל אֹכֵל
  choice: ആരെങ്കിലും ഭക്ഷിച്ചാൽ
  rationale: അനിശ്ചിതമായ പൊതുവ്യാപ്തി വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: חֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗനിയമത്തിൽ പ്രത്യേകം മാറ്റിവെച്ച മൃഗക്കൊഴുപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: מִן הַבְּהֵמָה
  choice: മൃഗത്തിന്റെ
  rationale: യാഗത്തിന് ഉപയോഗിക്കാവുന്ന വളർത്തുമൃഗത്തെ സന്ദർഭാനുസൃതമായി ലളിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: അർപ്പിക്കുന്ന
  rationale: ഹീബ്രുവിലെ അനിശ്ചിത ഏകവചന കർത്താവിനെ മലയാളത്തിൽ പൊതുവായ ക്രിയാരൂപത്തിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אִשֶּׁה
  choice: ദഹനാർപ്പണം
  rationale: യാഗപീഠത്തിലെ അഗ്നിയിൽ ദഹിപ്പിച്ച് അർപ്പിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്നു; ‘ഭോജനാർപ്പണം’ എന്ന വ്യാഖ്യാനപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത് സമർപ്പണത്തിന്റെ ലക്ഷ്യം ദത്തിവിഭക്തിയിൽ നൽകുന്നു.
- source_word: וְנִכְרְתָה
  choice: ഛേദിക്കപ്പെടണം
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഹീബ്രു സൂത്രവാക്യം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: ഭക്ഷിക്കുന്ന ആ വ്യക്തി
  rationale: נֶפֶשׁ ഇവിടെ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘ആത്മാവ്’ എന്നു വിവർത്തനം ചെയ്യുന്നത് സന്ദർഭത്തിൽ തെറ്റിദ്ധരിപ്പിക്കും.
- source_word: מֵעַמֶּיהָ
  choice: തന്റെ ജനത്തിൽനിന്ന്
  rationale: വ്യാകരണപരമായ സ്ത്രീലിംഗ പ്രത്യയം נֶפֶשׁ എന്ന പദത്തോടുള്ള യോജിപ്പാണ്; കുറ്റക്കാരന്റെ ലിംഗം നിർണ്ണയിക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക പ്രത്യാവർത്തക രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ എന്ന ഉടമ്പടി-ശിക്ഷാസൂത്രത്തിന്റെ അർഥം
  choice: തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടണം
  alternative: ജനത്തിൽനിന്ന് പുറത്താക്കപ്പെടണം; കൊല്ലപ്പെടണം; ദൈവിക ന്യായവിധിക്ക് വിധേയനാകണം
  rationale: ശിക്ഷയുടെ കൃത്യമായ രീതി ഹീബ്രു വാചകം വ്യക്തമാക്കുന്നില്ല. സമൂഹബഹിഷ്കരണം, മരണം, ദൈവിക ന്യായവിധി തുടങ്ങിയ സാധ്യതകളിൽ ഒന്നിനെ മാത്രം ഉറപ്പിക്കാതെ മൂലപാഠത്തിന്റെ ഗൗരവവും അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- issue: കുറ്റക്കാരന്റെ ലിംഗം
  choice: ആ വ്യക്തി ... തന്റെ ജനം
  alternative: അവൻ ... അവന്റെ ജനം; അവൾ ... അവളുടെ ജനം
  rationale: പ്രത്യയം സ്ത്രീലിംഗത്തിലാകുന്നത് נֶפֶשׁ എന്ന വ്യാകരണപരമായി സ്ത്രീലിംഗമുള്ള നാമത്തോടുള്ള യോജിപ്പാണ്; നിയമം ഏതു വ്യക്തിക്കും ബാധകമായതിനാൽ മലയാളത്തിൽ ലിംഗനിർണ്ണയം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമഭാഷ. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും യാഗസാങ്കേതികതയും ശിക്ഷാസൂത്രത്തിലെ ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
