id: LEV.7.15
reference: Leviticus 7:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְשַׂ֗ר זֶ֚בַח תּוֹדַ֣ת שְׁלָמָ֔י/ו בְּ/י֥וֹם קָרְבָּנ֖/וֹ יֵאָכֵ֑ל לֹֽא יַנִּ֥יחַ מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: ml
  text: അവന്റെ നന്ദിയർപ്പണമായ സമാധാനയാഗത്തിന്റെ മാംസം അവൻ അർപ്പിക്കുന്ന ദിവസത്തിൽതന്നെ ഭക്ഷിക്കണം.[a][b] അതിൽനിന്ന് ഒന്നും പ്രഭാതംവരെ ശേഷിപ്പിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നന്ദിക്കായുള്ള അവന്റെ കൂട്ടായ്മയാഗം.”'
    reason: שְׁלָמִים എന്ന സാങ്കേതിക യാഗപദത്തിന് ‘കൂട്ടായ്മയാഗം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പരിഭാഷ സാധ്യമാണ്.
  - marker: b
    text: 'അഥവാ: “അവന്റെ സമാധാനയാഗങ്ങളുടെ നന്ദിയർപ്പണബലി.”'
    reason: זֶבַח תּוֹדַת שְׁלָמָיו എന്ന ഹീബ്രു പദബന്ധത്തിന്റെ ഘടനയെ കൂടുതൽ അടുത്തു പ്രതിഫലിപ്പിക്കുന്ന മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: וּבְשַׂר
  choice: മാംസം
  rationale: בשר എന്നത് ഇവിടെ യാഗമൃഗത്തിന്റെ ഭക്ഷിക്കപ്പെടുന്ന മാംസത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘മാംസം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: זֶבַח תּוֹדַת שְׁלָמָיו
  choice: അവന്റെ നന്ദിയർപ്പണമായ സമാധാനയാഗം
  rationale: ഈ സങ്കീർണ പദബന്ധം നന്ദി അറിയിക്കുന്നതിനുള്ള സമാധാനയാഗം എന്ന ഉപവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘സമാധാനയാഗം’ എന്നത് ശְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ പദാനുസൃതത നിലനിർത്തുന്നു; ‘നന്ദിയർപ്പണമായ’ അതിന്റെ പ്രത്യേക ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: അവൻ അത് അർപ്പിക്കുന്ന ദിവസംതന്നെ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം അർപ്പിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ביום എന്നതിന്റെ സമയപരിധിക്ക് ‘ദിവസംതന്നെ’ ഊന്നൽ നൽകുന്നു.
- source_word: יֵאָכֵל
  choice: ഭക്ഷിക്കണം
  rationale: നിഫാൽ രൂപം പദാനുപദമായി ‘ഭക്ഷിക്കപ്പെടണം’ എന്നാണെങ്കിലും, നിയമനിർദേശം മലയാളത്തിൽ സജീവമായ അനിർദ്ദിഷ്ട പ്രയോഗമായ ‘ഭക്ഷിക്കണം’ എന്നു പറയുന്നത് കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: לֹא יַנִּיחַ מִמֶּנּוּ
  choice: അതിൽ ഒന്നും ശേഷിപ്പിക്കരുത്
  rationale: ഹിഫിൽ ക്രിയയുടെ ‘വിട്ടേക്കുക/ശേഷിപ്പിക്കുക’ എന്ന അർത്ഥവും מִמֶּנּוּയുടെ ഭാഗാത്മക അർത്ഥവും വ്യക്തമായി നൽകുന്നു; ഏകവചന കർത്താവിനെ മലയാളത്തിലെ നിർദ്ദേശരൂപത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַד בֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: കാലപരിധിയെ കൃത്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ പരിഭാഷ
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം
  rationale: ‘സമാധാനയാഗം’ മൂലപദത്തോടുള്ള പദാനുസൃതതയും ലേവ്യപുസ്തകത്തിലുടനീളമുള്ള സാങ്കേതിക പദത്തിന്റെ സ്ഥിരതയും നിലനിർത്തുന്നു. ‘കൂട്ടായ്മയാഗം’ ആചാരത്തിന്റെ അർത്ഥത്തെ കൂടുതൽ വ്യാഖ്യാനിക്കുന്നതിനാൽ പ്രധാന പാഠത്തിൽ സ്വീകരിച്ചില്ല.
- issue: תּוֹדַת שְׁלָמָיו എന്ന ബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: നന്ദിയർപ്പണമായ സമാധാനയാഗം
  alternative: നന്ദിക്കായുള്ള അവന്റെ സമാധാനയാഗങ്ങൾ
  rationale: ഇവിടെ നന്ദി അറിയിക്കുന്ന സമാധാനയാഗത്തിന്റെ പ്രത്യേക വകഭേദമാണ് ഉദ്ദേശ്യമെന്ന വായന സ്വാഭാവികമായി നൽകുന്നു; എങ്കിലും ഹീബ്രു ഘടനയ്ക്ക് മറ്റൊരു രീതിയിൽ ബന്ധിപ്പിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമനിർദേശ ശൈലി. യാഗസാങ്കേതിക പദമായി ‘സമാധാനയാഗം’ സ്ഥിരമായി നിലനിർത്തി; അനാവശ്യമായി പഴഞ്ചനായ പദങ്ങളും വിഭാഗീയ വ്യാഖ്യാനങ്ങളും ഒഴിവാക്കി.
