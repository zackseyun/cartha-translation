id: LEV.7.12
reference: Leviticus 7:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִ֣ם עַל תּוֹדָה֮ יַקְרִיבֶ/נּוּ֒ וְ/הִקְרִ֣יב עַל זֶ֣בַח הַ/תּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וְ/סֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּ/שָּֽׁמֶן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: ml
  text: അവൻ അത് ഒരു നന്ദിയർപ്പണമായി[a] അർപ്പിക്കുന്നെങ്കിൽ, ആ നന്ദിയാഗത്തോടൊപ്പം എണ്ണ ചേർത്ത പുളിപ്പില്ലാത്ത അപ്പങ്ങളും, എണ്ണ പുരട്ടിയ പുളിപ്പില്ലാത്ത നേർത്ത അപ്പങ്ങളും[b], എണ്ണ ചേർത്ത് തയ്യാറാക്കിയ നന്നായി അരിച്ച മാവുകൊണ്ടുള്ള അപ്പങ്ങളും[c] അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നന്ദിയാഗമായി.’ എബ്രായപദം നന്ദി പ്രകടിപ്പിക്കാൻ കൊണ്ടുവരുന്ന ഒരു യാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘എണ്ണ പുരട്ടിയ’ എന്നത് ഇവിടെ ആളുകളെയോ വസ്തുക്കളെയോ ആചാരപരമായി അഭിഷേകം ചെയ്യുന്നതല്ല, ഭക്ഷണം തയ്യാറാക്കുമ്പോൾ നേർത്ത അപ്പങ്ങളിൽ എണ്ണ പുരട്ടുന്നതാണ്.
    reason: cultural_note
  - marker: c
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പാചകപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; നന്നായി അരിച്ച മാവ് എണ്ണയിൽ നന്നായി കുഴച്ചതോ കലക്കിയതോ ആയിരിക്കാം.
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: תּוֹדָה
  choice: നന്ദിയർപ്പണം
  rationale: ഈ യാഗസന്ദർഭത്തിൽ ഈ പദം നന്ദി പ്രകടിപ്പിക്കാൻ കൊണ്ടുവരുന്ന സമാധാനയാഗത്തിന്റെ ഒരു പ്രത്യേക രൂപത്തെ സൂചിപ്പിക്കുന്നു; ‘നന്ദിയർപ്പണം’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יַקְרִיבֶנּוּ
  choice: അത് ... അർപ്പിക്കുന്നെങ്കിൽ
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ഒരു ബലി സമർപ്പിക്കുക/അർപ്പിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: זֶבַח הַתּוֹדָה
  choice: നന്ദിയാഗം
  rationale: זֶבַח എന്ന യാഗപദത്തെയും അതിന്റെ തരം വ്യക്തമാക്കുന്ന תּוֹדָהയെയും ചുരുക്കവും സ്വാഭാവികവുമായി സംയോജിപ്പിക്കുന്നു.
- source_word: חַלּוֹת מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പങ്ങൾ
  rationale: חַלּוֹת അപ്പംപോലുള്ള ചുട്ട വിഭവങ്ങളെയും מַצּוֹת പുളിപ്പില്ലാത്ത സ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: בלל ചേരുവകൾ കലർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എണ്ണ ചേർത്ത’ എന്നത് ഭക്ഷണതയ്യാറാക്കലിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: רְקִיקֵי מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത നേർത്ത അപ്പങ്ങൾ
  rationale: רְקִיקִים നേർത്ത അപ്പങ്ങളെയോ വേഫർപോലുള്ള അപ്പങ്ങളെയോ സൂചിപ്പിക്കുന്നു; പരിചിതമല്ലാത്ത വിദേശപദം ഒഴിവാക്കി രൂപം വ്യക്തമാക്കുന്നു.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: എണ്ണ പുരട്ടിയ
  rationale: משׁח എന്നതിന്റെ അടിസ്ഥാനാർഥം അഭിഷേകം ചെയ്യുക/പുരട്ടുക എന്നാണെങ്കിലും, ഇവിടെ ഭക്ഷണതയ്യാറാക്കലായതിനാൽ ‘എണ്ണ പുരട്ടിയ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: സാധാരണയായി യാഗങ്ങളിൽ ഉപയോഗിച്ചിരുന്ന നന്നായി അരിച്ച ഉന്നതഗുണമുള്ള മാവിനെയാണ് סֹלֶת സൂചിപ്പിക്കുന്നത്.
- source_word: מֻרְבֶּכֶת
  choice: തയ്യാറാക്കിയ
  rationale: ഈ അപൂർവ പാചകപദം സൂചിപ്പിക്കുന്ന കൃത്യമായ രീതി അനിശ്ചിതമായതിനാൽ, മുഖ്യവാചകത്തിൽ അതിരുകടന്ന കൃത്യത ഒഴിവാക്കി പൊതുവായ പദം ഉപയോഗിക്കുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: חַלֹּת
  choice: അപ്പങ്ങൾ
  rationale: മാവുകൊണ്ട് തയ്യാറാക്കിയ അപ്പംപോലുള്ള വിഭവങ്ങളെയാണ് ഇവിടെ പദം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘അപ്പങ്ങൾ’ സ്വാഭാവികവും വ്യാപകവുമാണ്.
theological_decisions:
- issue: תּוֹדָהയുടെ യാഗപരമായ അർഥം
  choice: നന്ദിയർപ്പണം / നന്ദിയാഗം
  alternative: സ്തോത്രയാഗം
  rationale: പദത്തിന് സ്തോത്രം, നന്ദി, ഏറ്റുപറച്ചിൽ തുടങ്ങിയ അർഥവ്യാപ്തിയുണ്ടെങ്കിലും, ഈ നിയമപരമായ യാഗസന്ദർഭത്തിൽ നന്ദി പ്രകടിപ്പിക്കുന്ന അർപ്പണം എന്ന അർഥമാണ് മുൻപന്തിയിൽ. ‘സ്തോത്രയാഗം’ ആരാധനാഗാനത്തിന്റെ ആശയം അനാവശ്യമായി മുൻനിർത്താം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാഗനിയമത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തിയിട്ടുണ്ട്. ആവർത്തിക്കുന്ന അർപ്പണപദങ്ങൾ സ്വാഭാവികമാക്കുകയും അപൂർവമായ പാചകരീതിയുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുകയും ചെയ്തു.
