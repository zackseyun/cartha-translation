revisions:
- from: അവൻ അത് ഒരു നന്ദിയർപ്പണമായി[a] അർപ്പിക്കുന്നെങ്കിൽ, ആ നന്ദിയാഗത്തോടൊപ്പം എണ്ണ ചേർത്ത പുളിപ്പില്ലാത്ത അപ്പങ്ങളും, എണ്ണ പുരട്ടിയ പുളിപ്പില്ലാത്ത നേർത്ത അപ്പങ്ങളും[b], എണ്ണ ചേർത്ത് തയ്യാറാക്കിയ നേരിയ മാവുകൊണ്ടുള്ള അപ്പങ്ങളും[c] അർപ്പിക്കണം.
  to: അവൻ അത് ഒരു നന്ദിയർപ്പണമായി[a] അർപ്പിക്കുന്നെങ്കിൽ, ആ നന്ദിയാഗത്തോടൊപ്പം എണ്ണ ചേർത്ത പുളിപ്പില്ലാത്ത അപ്പങ്ങളും, എണ്ണ പുരട്ടിയ പുളിപ്പില്ലാത്ത നേർത്ത അപ്പങ്ങളും[b], എണ്ണ ചേർത്ത് തയ്യാറാക്കിയ നന്നായി അരിച്ച മാവുകൊണ്ടുള്ള അപ്പങ്ങളും[c] അർപ്പിക്കണം.
  rationale: The revision replaces the potentially misleading ‘നേരിയ മാവ്’ with ‘നന്നായി അരിച്ച മാവ്’ for סֹלֶת and refines the uncertainty note for מֻרְבֶּכֶת so that it reflects plausible preparation senses without asserting an unsupported heating process. No change is made to the sacrificial or theological sense.
  reviewer_model: gpt-5.6-terra
