  source_fidelity: 'The translation accurately reflects the Hebrew legal instruction: the imperative address, the collective "sons of Israel," the participial subject, both occurrences of the peace-sacrifice term with its possessive suffix, the obligation conveyed by the imperfect, the general offering (קָרְבָּן), and the source relation expressed by מִן are all retained. “കൊണ്ടുവരണം” appropriately conveys the prescriptive force.'
