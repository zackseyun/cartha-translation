id: LEV.7.29
reference: Leviticus 7:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מַּקְרִ֞יב אֶת זֶ֤בַח שְׁלָמָי/ו֙ לַ/יהוָ֔ה יָבִ֧יא אֶת קָרְבָּנ֛/וֹ לַ/יהוָ֖ה מִ/זֶּ֥בַח שְׁלָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോട്[a] ഇങ്ങനെ പറയുക: യഹോവയ്ക്കു തന്റെ സമാധാനയാഗം[b] സമർപ്പിക്കുന്നവൻ, തന്റെ സമാധാനയാഗത്തിൽനിന്ന് യഹോവയ്ക്കുള്ള വഴിപാട് കൊണ്ടുവരണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; “ഇസ്രായേല്യർ” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: “സമാധാനബലി” അഥവാ “കൂട്ടായ്മയാഗം” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്. എബ്രായത്തിൽ ഇത് സമാധാനം, ക്ഷേമം, സമ്പൂർണത എന്നിവയുമായി ബന്ധപ്പെട്ട ഒരു പ്രത്യേക യാഗവിഭാഗത്തിന്റെ പേരാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל ... לֵאמֹר
  choice: …യോട് ഇങ്ങനെ പറയുക
  rationale: നേരിട്ടുള്ള ദൈവിക നിർദേശം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘സംസാരിച്ച് പറയുക’ എന്ന ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നത് കുറിപ്പിൽ സൂക്ഷിക്കുമ്പോൾ, ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം നൽകുന്നു.
- source_word: הַמַּקְרִיב
  choice: സമർപ്പിക്കുന്നവൻ
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് യാഗാർപ്പണസന്ദർഭത്തിൽ ‘അടുത്തുകൊണ്ടുവരുക/ഹാജരാക്കുക’ എന്ന ആശയമുണ്ട്. ‘സമർപ്പിക്കുക’ ആ ആരാധനാപരമായ പ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; എന്നാൽ ‘യാഗം കഴിക്കുക’ എന്നതുമായി അനാവശ്യമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: זֶבַח שְׁלָמָיו
  choice: തന്റെ സമാധാനയാഗം
  rationale: זֶבַח എന്നതിന്റെ യാഗസ്വഭാവവും שְׁלָמִים എന്ന സാങ്കേതിക യാഗവിഭാഗത്തിന്റെ സമാധാനം/ക്ഷേമം എന്ന പദബന്ധവും നിലനിർത്തുന്നു. എബ്രായത്തിലെ സാങ്കേതിക ബഹുവചനരൂപം മലയാളത്തിൽ ഏകവചന യാഗനാമമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: വ്യക്തിനാമമായ יהוהയെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: יָבִיא
  choice: കൊണ്ടുവരണം
  rationale: നിയമനിർദേശത്തിലെ അപൂർണക്രിയയുടെ നിർബന്ധാത്മക ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: קָרְבָּנוֹ
  choice: തന്റെ വഴിപാട്
  rationale: ദൈവസന്നിധിയിലേക്കു കൊണ്ടുവരുന്ന പൊതുവായ അർപ്പണവസ്തുവിനെ സൂചിപ്പിക്കുന്ന קָרְבָּן എന്ന പദത്തിന് വ്യക്തവും സാധാരണക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം.
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: തന്റെ സമാധാനയാഗത്തിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗം വഴിപാട് സമാധാനയാഗത്തിൽനിന്നുള്ളതാണെന്ന ഭാഗിക/ഉത്ഭവബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിപരമായ ഉടമ്പടിനാമം വ്യക്തമായി നിലനിർത്തുന്നു. ‘കർത്താവ്’ എന്നത് വായനാപാരമ്പര്യത്തെ പ്രതിഫലിപ്പിക്കുന്ന സാധുവായ മറ്റൊരു രീതി ആണെങ്കിലും ഇവിടെ നാമവും സ്ഥാനപ്പേരും തമ്മിലുള്ള വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- issue: שְׁלָמִים എന്ന യാഗപദം
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം / ക്ഷേമയാഗം
  rationale: ശ־ל־ם ധാതുവുമായുള്ള പദബന്ധവും זֶבַח സൂചിപ്പിക്കുന്ന യാഗസ്വഭാവവും നിലനിർത്തുന്നു. ‘കൂട്ടായ്മയാഗം’ സാധ്യമായ ഫലമോ പ്രവർത്തനമോ മുൻനിർത്തുന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപമാണ്.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസംബോധന
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ / ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബപരവും സമൂഹപരവുമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹസംബോധന നൽകുന്നു; അക്ഷരാർഥത്തിലെ പുല്ലിംഗരൂപം കുറിപ്പിൽ തുറന്നുകാട്ടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമ-ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘അർപ്പിക്കുന്നവൻ’ എന്നതിന് പകരം ‘സമർപ്പിക്കുന്നവൻ’ ഉപയോഗിച്ച് הַמַּקְרִיב എന്നതിലെ കൊണ്ടുവരൽ/ഹാജരാക്കൽ ഭാവം ഭാഗികമായി നിലനിർത്തി. വാക്യത്തിലെ ആവർത്തനം മൂലപാഠത്തെ പിന്തുടർന്ന് സംരക്ഷിച്ചിട്ടുണ്ട്.
