source:
  edition: WLC
  text: וְ/אִם נֶ֣דֶר א֣וֹ נְדָבָ֗ה זֶ֚בַח קָרְבָּנ֔/וֹ בְּ/י֛וֹם הַקְרִיב֥/וֹ אֶת זִבְח֖/וֹ יֵאָכֵ֑ל וּ/מִֽ/מָּחֳרָ֔ת וְ/הַ/נּוֹתָ֥ר מִמֶּ֖/נּוּ יֵאָכֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: ml
  text: എന്നാൽ, അവന്റെ യാഗാർപ്പണം നേർച്ചയാഗമോ സ്വമേധായാഗമോ ആണെങ്കിൽ, അവൻ തന്റെ യാഗം അർപ്പിക്കുന്ന ദിവസം അത് ഭക്ഷിക്കേണ്ടതാണ്; പിറ്റേന്ന് അതിൽ ശേഷിക്കുന്നത് ഭക്ഷിക്കാം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶדֶר
  choice: നേർച്ച
  rationale: നേർന്ന വാഗ്ദാനത്തെയോ അതിന്റെ നിറവേറ്റലായി നൽകുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; നְדָבָה എന്ന സ്വമേധാദാനത്തിൽനിന്നുള്ള വ്യത്യാസവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נְדָבָה
  choice: സ്വമേധാദാനം
  rationale: നിർബന്ധത്താൽ അല്ലാതെ മനസ്സോടെ നൽകുന്ന ആരാധനാർപ്പണമാണ്; ആ സ്വൈച്ഛിക സ്വഭാവം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: זֶבַח קָרְבָּנוֹ
  choice: അവന്റെ യാഗാർപ്പണം
  rationale: זֶבַח എന്ന യാഗസങ്കല്പവും קָרְבָּן എന്ന അർപ്പണസങ്കല്പവും ഒറ്റ സ്വാഭാവിക മലയാള സംയുക്തത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּיוֹם הַקְרִיבוֹ
  choice: അവൻ തന്റെ യാഗം അർപ്പിക്കുന്ന ദിവസം
  rationale: קרב എന്ന ക്രിയയുടെ യാഗപരമായ 'സമർപ്പിക്കുക/അർപ്പിക്കുക' എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: יֵאָכֵל
  choice: അതു ഭക്ഷിക്കണം
  rationale: ആദ്യ പ്രയോഗത്തിലെ നിയമപരവും നിർദേശാത്മകവുമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: וּמִמָּחֳרָת
  choice: പിറ്റേന്നും
  rationale: തുടർന്നുള്ള ദിവസത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: അതിൽ ശേഷിക്കുന്നത്
  rationale: യാഗാർപ്പണത്തിൽ ബാക്കിയായ ഭാഗത്തെ ലളിതമായും കൃത്യമായും സൂചിപ്പിക്കുന്നു.
- source_word: יֵאָכֵל
  choice: ഭക്ഷിക്കാം
  rationale: അതേ ഹീബ്രു രൂപത്തിന്റെ രണ്ടാമത്തെ പ്രയോഗത്തിൽ സന്ദർഭപരമായ അനുമതിഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
