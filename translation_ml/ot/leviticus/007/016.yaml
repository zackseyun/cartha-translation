  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. യാഗപരമായ സാങ്കേതികത നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
