revisions:
- from: എന്നാൽ അവന്റെ യാഗാർപ്പണം ഒരു നേർച്ചയോ സ്വമേധാദാനമോ[a] ആണെങ്കിൽ, അവൻ തന്റെ യാഗം അർപ്പിക്കുന്ന ദിവസം അതു ഭക്ഷിക്കണം; പിറ്റേന്നും അതിൽ ശേഷിക്കുന്നത് ഭക്ഷിക്കാം.
  to: എന്നാൽ, അവന്റെ യാഗാർപ്പണം നേർച്ചയാഗമോ സ്വമേധായാഗമോ ആണെങ്കിൽ, അവൻ തന്റെ യാഗം അർപ്പിക്കുന്ന ദിവസം അത് ഭക്ഷിക്കേണ്ടതാണ്; പിറ്റേന്ന് അതിൽ ശേഷിക്കുന്നത് ഭക്ഷിക്കാം.
