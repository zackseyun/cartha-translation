id: LEV.7.31
reference: Leviticus 7:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְטִ֧יר הַ/כֹּהֵ֛ן אֶת הַ/חֵ֖לֶב הַ/מִּזְבֵּ֑חָ/ה וְ/הָיָה֙ הֶֽ/חָזֶ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/031.yaml
  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: ml
  text: പുരോഹിതൻ മേദസ്സ് യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം[a]; മാറിടഭാഗം അഹരോനും അവന്റെ പുത്രന്മാർക്കും ഉള്ളതായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മേദസ്സ് യാഗപീഠത്തിന്മേൽ പുകയായി ഉയർത്തി അർപ്പിക്കണം.”
    reason: ഹിഫീൽ രൂപമായ הִקְטִיר ബലിസന്ദർഭത്തിൽ വസ്തുവിനെ പുകയായി ഉയർത്തുന്നവിധം അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: ദഹിപ്പിക്കണം
  rationale: ബലികർമസന്ദർഭത്തിൽ קטר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗപീഠത്തിൽ ബലിവസ്തു കത്തിച്ച് പുകയായി ഉയർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ദഹിപ്പിക്കണം’ വ്യക്തമാണ്; പുകയായി ഉയർത്തുന്ന ഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാകർമസന്ദർഭത്തിലെ כֹּהֵן എന്ന പദത്തിനുള്ള സാധാരണ മലയാള പരിഭാഷ; എബ്രായത്തിലെ ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: הַחֵלֶב
  choice: മേദസ്സ്
  rationale: ലേവ്യപുസ്തകത്തിലെ ബലിനിയമങ്ങളിൽ חֵלֶב യാഗപീഠത്തിൽ ദഹിപ്പിക്കാൻ വേർതിരിച്ച കൊഴുപ്പുഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ഈ ആചാരപരമായ അർഥത്തിന് ‘മേദസ്സ്’ കൃത്യവും മാന്യവുമായ പദമാണ്.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശാസൂചകമായ പ്രത്യയം അക്ഷരാർഥത്തിൽ ‘യാഗപീഠത്തിലേക്ക്’ എന്നു വരാമെങ്കിലും, הִקְטִיר എന്ന ക്രിയയോടുകൂടെ ഇവിടെ മേദസ്സ് യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കുന്നതാണ് സ്വാഭാവികമായ ആചാരപരമായ അർഥം.
- source_word: וְהָיָה
  choice: അവകാശപ്പെട്ടതായിരിക്കണം
  rationale: അക്ഷരാർഥം ‘ആയിരിക്കണം’ എന്നാണെങ്കിലും, ഈ നിയമസന്ദർഭത്തിൽ ഒരു പുരോഹിതവിഹിതത്തിന്റെ ഉടമസ്ഥതയോ നീക്കിവെക്കലോ ആണ് ഉദ്ദേശിക്കുന്നത്. ‘അവകാശപ്പെട്ടതായിരിക്കണം’ ആ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הֶחָזֶה
  choice: നെഞ്ച്
  rationale: ബലിനിയമങ്ങളിൽ חָזֶה പുരോഹിതർക്കു നൽകുന്ന മൃഗത്തിന്റെ നെഞ്ചുഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നെഞ്ച്’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: അഹരോനും അവന്റെ പുത്രന്മാർക്കും
  rationale: לְ എന്ന ഉപസർഗം ഇവിടെ വിഹിതമോ ഉടമസ്ഥതയോ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിലെ ദാതൃവിഭക്തി ആ ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി സ്വീകരിച്ചു. ബലികർമവുമായി ബന്ധപ്പെട്ട സാങ്കേതിക അർഥങ്ങൾ സംരക്ഷിക്കുമ്പോൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു; [a] എന്ന അടിക്കുറിപ്പുസൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
