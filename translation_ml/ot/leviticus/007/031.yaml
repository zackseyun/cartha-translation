review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the priest, the altar-burning of the fat, and the allocation to Aaron and his sons. However, ‘നെഞ്ച്’ is overly general for the designated sacrificial breast portion (חָזֶה); ‘മാറിടഭാഗം’ is more precise in this ritual context. The final predicate is also more idiomatically expressed as an allocation (‘ഉള്ളതായിരിക്കും’) than ‘അവകാശപ്പെട്ടതായിരിക്കണം.’
  naturalness: ‘മേദസ്സ് യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം’ is clear and suitable for modern formal Malayalam. ‘മാറിടഭാഗം’ clearly denotes the animal portion, while ‘അഹരോനും അവന്റെ പുത്രന്മാർക്കും ഉള്ളതായിരിക്കും’ is natural legal-procedural Malayalam.
  terminology: ‘പുരോഹിതൻ,’ ‘മേദസ്സ്,’ and ‘യാഗപീഠം’ are appropriate cultic terms. ‘മാറിടഭാഗം’ preserves the technical sense of the priestly breast portion without confusing it with a person’s chest.
  issues:
  - severity: medium
    issue: ‘നെഞ്ച്’ is imprecise for הֶחָזֶה in sacrificial legislation.
    rationale: The Hebrew identifies a designated breast portion of the offering. ‘മാറിടഭാഗം’ is clearer and more suitably technical in Malayalam.
  - severity: low
    issue: ‘അവകാശപ്പെട്ടതായിരിക്കണം’ is somewhat stiff and less direct than the Hebrew allocation formula.
    rationale: The construction וְהָיָה ... לְ indicates that the portion shall be assigned to Aaron and his sons. ‘...ക്കുള്ളതായിരിക്കും’ conveys this naturally without changing the legal sense.
  revised_text: പുരോഹിതൻ മേദസ്സ് യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം[a]; മാറിടഭാഗം അഹരോനും അവന്റെ പുത്രന്മാർക്കും ഉള്ളതായിരിക്കും.
