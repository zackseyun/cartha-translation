reference: Leviticus 7:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יַקְרִ֣יב מִמֶּ֑/נּוּ אֵ֚ת הָֽ/אַלְיָ֔ה וְ/אֶת הַ/חֵ֖לֶב הַֽ/מְכַסֶּ֥ה אֶת הַ/קֶּֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/003.yaml
  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: ml
  text: 'അവൻ അതിൽനിന്ന് അതിന്റെ കൊഴുപ്പ് മുഴുവനും സമർപ്പിക്കണം[a]: കൊഴുപ്പേറിയ വാലും ആന്തരാവയവങ്ങളെ മൂടുന്ന കൊഴുപ്പും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അർപ്പിക്കണം.” ഹീബ്രു ക്രിയയ്ക്ക് ഒരു യാഗഭാഗം സമർപ്പിക്കുകയോ അർപ്പിക്കുകയോ ചെയ്യുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഇത് ചെമ്മരിയാടിന്റെ കൊഴുപ്പേറിയ വാലാണ്—യാഗത്തിൽ സമർപ്പിക്കേണ്ട ഒരു പ്രത്യേക കൊഴുപ്പുഭാഗം.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: അതിന്റെ കൊഴുപ്പ് / കൊഴുപ്പ്
  rationale: യാഗനിയമങ്ങളുടെ സന്ദർഭത്തിൽ חֵלֶב അർപ്പണത്തിനായി വേർതിരിച്ച കൊഴുപ്പുഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കൊഴുപ്പ്’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: יַקְרִיב
  choice: അർപ്പിക്കണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ കൊണ്ടുവരുക, സമർപ്പിക്കുക, അർപ്പിക്കുക എന്നീ അർഥങ്ങൾ നൽകുന്നു; മലയാളത്തിൽ ‘അർപ്പിക്കണം’ ആചാരപരമായ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִמֶּנּוּ
  choice: അതിൽനിന്ന്
  rationale: പ്രത്യയം സന്ദർഭത്തിലെ യാഗമൃഗത്തെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ‘അതിൽനിന്ന്’ ഈ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: הָאַלְיָה
  choice: കൊഴുപ്പുള്ള വാൽ
  rationale: אַלְיָה ചെമ്മരിയാടിന്റെ പ്രത്യേകമായ കൊഴുപ്പേറിയ വാലിനെ സൂചിപ്പിക്കുന്നു; വെറും ‘വാൽ’ എന്നതിനെക്കാൾ ഈ പരിഭാഷ ശരീരഘടനാപരവും യാഗപരവുമായ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: ആന്തരാവയവങ്ങളെ മൂടുന്ന
  rationale: ഇവിടെ קֶרֶב മൃഗത്തിന്റെ ഉള്ളിലെ അവയവങ്ങളെയോ അന്തർഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘ആന്തരാവയവങ്ങൾ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമാണ്.
- source_word: כָּל
  choice: മുഴുവനും
  rationale: നിർദേശിക്കപ്പെട്ട കൊഴുപ്പുഭാഗങ്ങളുടെ സമഗ്രത ഊന്നിപ്പറയുന്നതിനാൽ ‘മുഴുവനും’ അനുയോജ്യമാണ്.
theological_decisions:
- issue: יַקְרִיב എന്ന യാഗക്രിയയുടെ പരിധി
  choice: അർപ്പിക്കണം
  alternative: സമർപ്പിക്കണം / അടുത്തുകൊണ്ടുവരണം
  rationale: ഹീബ്രു ക്രിയയ്ക്ക് അവതരിപ്പിക്കൽ, സമീപത്തുകൊണ്ടുവരൽ, അർപ്പിക്കൽ എന്നീ പരസ്പരം ബന്ധപ്പെട്ട യാഗാർഥങ്ങൾ ഉണ്ടാകാം. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘അർപ്പിക്കണം’ സ്വീകരിച്ചെങ്കിലും പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ യാഗനിയമ ശൈലി. ‘അർപ്പിക്കണം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ശരീരഘടനാപരമായ കൃത്യതയ്ക്കായി ‘ആന്തരാവയവങ്ങൾ’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
