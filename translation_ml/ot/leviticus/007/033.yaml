  to: അഹരോന്റെ പുത്രന്മാരിൽ സമാധാനയാഗങ്ങളുടെ[a] രക്തവും കൊഴുപ്പും അർപ്പിക്കുന്നവന് വലതുതുട അവന്റെ ഓഹരിയായിരിക്കും.
