source:
  edition: WLC
  text: הַ/מַּקְרִ֞יב אֶת דַּ֧ם הַ/שְּׁלָמִ֛ים וְ/אֶת הַ/חֵ֖לֶב מִ/בְּנֵ֣י אַהֲרֹ֑ן ל֧/וֹ תִהְיֶ֛ה שׁ֥וֹק הַ/יָּמִ֖ין לְ/מָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: ml
  text: അഹരോന്റെ പുത്രന്മാരിൽ സമാധാനയാഗങ്ങളുടെ[a] രക്തവും കൊഴുപ്പും അർപ്പിക്കുന്നവന് വലതുതുട അവന്റെ ഓഹരിയായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൂട്ടായ്മയാഗങ്ങളുടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: അർപ്പിക്കുന്നവന്
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ കർത്തൃവാചക രൂപം യാഗവസ്തു കൊണ്ടുവന്ന് ആചാരപരമായി അർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ യാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: דַּם
  choice: രക്തം
  rationale: യാഗനിയമത്തിലെ പദത്തിന് നേരിട്ടുള്ള സാധാരണ മലയാള പരിഭാഷ.
- source_word: הַשְּׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: ഈ യാഗവിഭാഗത്തിന്റെ സമാധാനം/സമ്പൂർണത എന്ന പദബന്ധം നിലനിർത്തുന്ന പരിചിതമായ പരിഭാഷ; കൂട്ടായ്മയെ ഊന്നുന്ന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הַחֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗത്തിനായി വേർതിരിക്കുന്ന നിർദിഷ്ട കൊഴുപ്പുഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: מִבְּנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാരിൽ
  rationale: പുരോഹിതസംഘത്തിനുള്ളിൽനിന്നുള്ള ഒരാളെ സൂചിപ്പിക്കുന്ന מִן-ന്റെ തിരഞ്ഞെടുപ്പാർഥവും എബ്രായത്തിലെ കുടുംബപരവും പുരുഷലിംഗപരവുമായ പ്രയോഗവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לוֹ תִהְיֶה
  choice: അവന്റെ ... ആയിരിക്കണം
  rationale: നിയമപരമായി അവകാശപ്പെട്ട ഓഹരിയാണെന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שׁוֹק הַיָּמִין
  choice: വലത്തെ തുട
  rationale: שׁוֹק ഇവിടെ മൃഗത്തിന്റെ മേൽക്കാൽ/തുടഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘തുട’ പൊതുവായ ‘കാൽ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: לְמָנָה
  choice: അവന്റെ ഓഹരിയായി
  rationale: നിയമപ്രകാരം അനുവദിക്കപ്പെട്ട പങ്ക് അഥവാ വിഹിതം എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിൽ בְּנֵי אַהֲרֹן എന്നതിന്റെ പരിഭാഷ
  choice: അഹരോന്റെ പുത്രന്മാർ
  alternative: അഹരോന്റെ സന്തതികൾ / അഹരോന്റെ കുടുംബം
  rationale: എബ്രായം വ്യക്തമായി പുരുഷലിംഗ ബഹുവചനമാണ്; യാഗശുശ്രൂഷ ചെയ്യുന്ന പുരോഹിതപുരുഷന്മാരെയാണ് സന്ദർഭം നേരിട്ട് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ലിംഗനിഷ്പക്ഷമായി വിപുലീകരിക്കാതെ മൂലരൂപം നിലനിർത്തി.
- issue: שְׁלָמִים എന്ന യാഗനാമത്തിന്റെ അർഥവ്യാപ്തി
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ
  rationale: ഈ പദത്തിന് സമാധാനം/സമ്പൂർണതയുമായുള്ള പദബന്ധവും കൂട്ടായ്മയുമായുള്ള ആശയബന്ധവും ഉണ്ട്. പ്രധാന പാഠത്തിൽ പരമ്പരാഗതമായ പദബന്ധം നിലനിർത്തി, വ്യാഖ്യാനപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. എബ്രായവാക്യത്തിന്റെ നിയമപരമായ അവകാശഭാവവും യാഗസാങ്കേതിക പദങ്ങളും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു.
