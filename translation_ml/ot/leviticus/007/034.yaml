id: LEV.7.34
reference: Leviticus 7:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: ml
  text: എന്തെന്നാൽ, യിസ്രായേൽമക്കളുടെ സമാധാനയാഗങ്ങളിൽനിന്ന് ആട്ടൽവഴിപാടിന്റെ നെഞ്ചുഭാഗവും ഉയർത്തൽവഴിപാടിന്റെ തുടയും ഞാൻ എടുത്ത്, അവയെ പുരോഹിതനായ അഹരോനും അവന്റെ പുത്രന്മാർക്കും യിസ്രായേൽമക്കളിൽനിന്ന് എന്നേക്കുമായുള്ള നിശ്ചിത വിഹിതമായി നൽകിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: നീരാജനത്തിനുള്ള നെഞ്ച്
  rationale: חֲזֵה മൃഗത്തിന്റെ നെഞ്ചുഭാഗത്തെയും תְּנוּפָה യാഗഭാഗം ദൈവസന്നിധിയിൽ ആചാരപരമായി ചലിപ്പിച്ചു സമർപ്പിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു. ലേവ്യപുസ്തകത്തിലെ സാങ്കേതിക യാഗഭാഷ നിലനിർത്താൻ ഈ പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: വഴിപാടായി നീക്കിവെച്ച തുട
  rationale: שׁוֹק മേൽക്കാൽഭാഗമായ തുടയാണ്; תְּרוּמָה ഉയർത്തിയോ വേർതിരിച്ചോ സമർപ്പിച്ച വിഹിതത്തെ സൂചിപ്പിക്കുന്നു. ആചാരത്തിന്റെ കൃത്യരൂപം മാത്രം നിർബന്ധിക്കാതെ, പുരോഹിതർക്കായി വേർതിരിച്ച സമർപ്പിതഭാഗം എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: ഹീബ്രായിലെ പതിവായ ഉടമ്പടിസംബന്ധിയായ നാമവിളിയുടെ രൂപസവിശേഷതയും മലയാള ബൈബിൾഭാഷയിലെ പരിചിതത്വവും നിലനിർത്തുന്നു.
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: അവരുടെ സമാധാനയാഗങ്ങൾ
  rationale: זֶבַח എന്ന യാഗസങ്കൽപ്പവും שְׁלָמִים എന്ന പ്രത്യേക യാഗവിഭാഗവും സ്വാഭാവികമായ മലയാള സംയുക്തത്തിൽ ഉൾക്കൊള്ളുന്നു; 'കൂട്ടായ്മ' എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: לְחָק עוֹלָם
  choice: ശാശ്വതമായ അവകാശം
  rationale: ഈ സന്ദർഭത്തിൽ חֹק ഒരു നിയമം മാത്രമല്ല, പുരോഹിതർക്കു നിശ്ചയിച്ച സ്ഥിരവിഹിതം അഥവാ അവകാശം എന്ന അർത്ഥം വഹിക്കുന്നു. עוֹלָם അതിന്റെ തുടർച്ചയായ പ്രാബല്യം സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ വിവർത്തനം
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ
  rationale: മൂലപദത്തിന്റെ സമാധാനം/സമ്പൂർണതയോടുള്ള ബന്ധവും പരമ്പരാഗത യാഗനാമവും നിലനിർത്തുന്നു; യാഗത്തിന്റെ അർത്ഥം കൂട്ടായ്മയിൽ മാത്രം ഒതുക്കുന്നില്ല.
- issue: לְחָק עוֹלָם എന്നതിന്റെ നിയമപരവും വിഹിതപരവുമായ അർത്ഥം
  choice: ശാശ്വതമായ അവകാശമായി
  alternative: ശാശ്വതമായ ചട്ടമായി
  rationale: ഈ വാക്യത്തിൽ ദൈവം അഹരോനും പുത്രന്മാർക്കും യാഗഭാഗങ്ങൾ നൽകുന്നതാണ് മുഖ്യമായി പറയുന്നത്. അതിനാൽ സ്ഥിരമായി നിശ്ചയിച്ച വിഹിതം എന്ന സന്ദർഭാർത്ഥം മുൻനിർത്തുന്നു; നിയമപരമായ സ്ഥിരതയും 'ശാശ്വതമായ' എന്നതിലൂടെ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. യാഗസാങ്കേതിക പദങ്ങൾ സാധാരണ വായനക്കാരന് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകിയെങ്കിലും, മൂലത്തിലെ ആവർത്തനവും നിയമപരമായ ഭാവവും കഴിയുന്നത്ര നിലനിർത്തി.
