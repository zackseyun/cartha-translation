revisions:
- from: എന്തെന്നാൽ, യിസ്രായേൽമക്കളുടെ സമാധാനയാഗങ്ങളിൽനിന്ന് നീരാജനത്തിനുള്ള നെഞ്ചും വഴിപാടായി നീക്കിവെച്ച തുടയും ഞാൻ എടുത്ത്, പുരോഹിതനായ അഹരോനും അവന്റെ പുത്രന്മാർക്കും യിസ്രായേൽമക്കളിൽനിന്നുള്ള ശാശ്വതമായ അവകാശമായി നൽകിയിരിക്കുന്നു.
  to: എന്തെന്നാൽ, യിസ്രായേൽമക്കളുടെ സമാധാനയാഗങ്ങളിൽനിന്ന് ആട്ടൽവഴിപാടിന്റെ നെഞ്ചുഭാഗവും ഉയർത്തൽവഴിപാടിന്റെ തുടയും ഞാൻ എടുത്ത്, അവയെ പുരോഹിതനായ അഹരോനും അവന്റെ പുത്രന്മാർക്കും യിസ്രായേൽമക്കളിൽനിന്ന് എന്നേക്കുമായുള്ള നിശ്ചിത വിഹിതമായി നൽകിയിരിക്കുന്നു.
  rationale: The revision replaces the misleading lamp-rite term with terminology for the wave/presentation offering, distinguishes תְּנוּפָה from תְּרוּמָה, and renders the enduring priestly allocation as a prescribed due. It also retains both occurrences of «യിസ്രായേൽമക്കൾ» and preserves the source's legal framing.
