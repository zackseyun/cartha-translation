id: LEV.7.23
reference: Leviticus 7:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כָּל חֵ֜לֶב שׁ֥וֹר וְ/כֶ֛שֶׂב וָ/עֵ֖ז לֹ֥א תֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു[a] പറയുക: കാളയുടെയോ ചെമ്മരിയാടിന്റെയോ കോലാടിന്റെയോ കൊഴുപ്പ് ഒന്നും നിങ്ങൾ ഭക്ഷിക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, കൂടുതൽ വ്യവഹാരികമായി, “ഇസ്രായേല്യർ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: പറയുക
  rationale: דבר എന്ന ക്രിയയുടെ പീയേൽ ആജ്ഞാരൂപം; മോശെയോടുള്ള നേരിട്ടുള്ള കല്പനയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഉടമ്പടിജനത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മനസ്സിലാകുന്നതുമായ രൂപം നിലനിർത്തുന്നു. കൂടുതൽ വ്യവഹാരികമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: പറയുക
  rationale: എബ്രായത്തിലെ പ്രസ്താവനാമുഖമായ ‘പറഞ്ഞുകൊണ്ട്/ഇപ്രകാരം പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന മലയാളത്തിലെ ‘...ഓടു പറയുക:’ എന്ന സ്വാഭാവിക ആജ്ഞാവാക്യത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: כָּל
  choice: ഒന്നും
  rationale: നിഷേധവാക്യത്തിൽ חֵלֶב എന്ന ദ്രവ്യനാമത്തോടൊപ്പം സമഗ്രമായ നിരോധനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חֵלֶב
  choice: കൊഴുപ്പ്
  rationale: മൃഗക്കൊഴുപ്പിനെയും, ഈ യാഗനിയമസന്ദർഭത്തിൽ പ്രത്യേകിച്ച് വേർതിരിച്ച കൊഴുപ്പുഭാഗങ്ങളെയും സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ പദം.
- source_word: שׁוֹר
  choice: കാള
  rationale: പശുവർഗത്തിൽപ്പെട്ട മൃഗത്തെ സൂചിപ്പിക്കുന്ന പട്ടികയിലെ ഏകവചനത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായ പൊതുപദം.
- source_word: כֶשֶׂב
  choice: ചെമ്മരിയാട്
  rationale: ആട്ടിൻകൂട്ടത്തിലെ sheep എന്ന പൊതുവർഗത്തെ സൂചിപ്പിക്കുന്നു; ‘കുഞ്ഞാട്’ അല്ലെങ്കിൽ ‘മുട്ടനാട്’ എന്നു പറഞ്ഞ് പ്രായമോ ലിംഗമോ അധികമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: עֵז
  choice: കോലാട്
  rationale: ചെമ്മരിയാടിൽനിന്ന് വ്യക്തമായി വേർതിരിച്ച് goat എന്ന പൊതുവർഗത്തെ സൂചിപ്പിക്കുന്ന ആധുനിക മലയാളപദം.
- source_word: לֹא תֹאכֵלוּ
  choice: നിങ്ങൾ ഭക്ഷിക്കരുത്
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള നിയമപരമായ നിരോധനം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. എബ്രായ വാക്യത്തിന്റെ സമഗ്രനിരോധനം നിലനിർത്തിക്കൊണ്ട്, പ്രസ്താവനാമുഖം മലയാളത്തിൽ സ്വാഭാവികമായി ചുരുക്കിയിരിക്കുന്നു.
