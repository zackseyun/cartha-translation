id: LEV.7.14
reference: Leviticus 7:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִמֶּ֤/נּוּ אֶחָד֙ מִ/כָּל קָרְבָּ֔ן תְּרוּמָ֖ה לַ/יהוָ֑ה לַ/כֹּהֵ֗ן הַ/זֹּרֵ֛ק אֶת דַּ֥ם הַ/שְּׁלָמִ֖ים ל֥/וֹ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: ml
  text: അതിൽനിന്ന് ഓരോ വഴിപാടിൽനിന്നും ഓരോന്ന് യഹോവയ്ക്കായി നീക്കിവെച്ച വിഹിതമായി[a] അർപ്പിക്കണം; സമാധാനയാഗങ്ങളുടെ[c] രക്തം ചീറ്റുന്ന[b] പുരോഹിതന് അത് അവകാശമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയ്ക്കുള്ള ഉയർത്തുന്ന വഴിപാടായി.’ എബ്രായപദം ദൈവത്തിനായി വേർതിരിച്ച് പുരോഹിതന് നൽകുന്ന ഒരു വിഹിതത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘രക്തം തളിക്കുന്ന’ അല്ലെങ്കിൽ ‘രക്തം എറിയുന്ന.’ യാഗപീഠവുമായി ബന്ധപ്പെട്ട രക്തപ്രയോഗമാണ് എബ്രായക്രിയ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘സമാധാനയാഗങ്ങൾ’ എന്നത് ‘കൂട്ടായ്മയാഗങ്ങൾ’ എന്നോ ‘ക്ഷേമയാഗങ്ങൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: അർപ്പിക്കണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ‘അടുത്തുകൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്നാണ്; ആചാരപരമായ അർപ്പണം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അർപ്പിക്കണം’ തിരഞ്ഞെടുത്തു.
- source_word: מִמֶּנּוּ
  choice: അതിൽനിന്ന്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന സ്തോത്രയാഗവുമായി ബന്ധപ്പെട്ട അപ്പങ്ങളുടെ സമുച്ചയത്തെ ഏകകമായി സൂചിപ്പിക്കുന്ന എബ്രായ ഏകവചന സർവനാമം നിലനിർത്തുന്നു.
- source_word: אֶחָד מִכָּל קָרְבָּן
  choice: ഓരോ വഴിപാടിൽനിന്നും ഓരോന്ന്
  rationale: ‘എല്ലാ/ഓരോ വഴിപാടിൽനിന്നും ഒന്ന്’ എന്ന വിതരണാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; മുൻവാക്യത്തിലെ ഓരോതരം അപ്പത്തിൽനിന്നും ഒന്ന് എന്ന സന്ദർഭം അനാവശ്യമായി വിശദീകരിച്ചിട്ടില്ല.
- source_word: תְּרוּמָה
  choice: നീക്കിവെച്ച വിഹിതം
  rationale: ദൈവത്തിനായി വേർതിരിച്ച് പുരോഹിതന് നൽകുന്ന ഭാഗമാണ് ഉദ്ദേശ്യം. ‘ഉയർത്തുന്ന വഴിപാട്’ എന്ന സാങ്കേതിക പരിഭാഷയേക്കാൾ സാധാരണ വായനക്കാർക്ക് അർഥം വ്യക്തമാക്കുന്നു; ആചാരരീതിയെക്കുറിച്ച് ഉറവിടം പറയുന്നതിലധികം നിർണ്ണയിക്കുന്നില്ല.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: ദൈവനാമമായ יהוה മലയാളത്തിൽ പരിചിതവും വ്യക്തവുമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; לְ എന്ന സമർപ്പണബന്ധം ‘-യ്ക്കായി’ കൊണ്ട് നൽകി.
- source_word: הַזֹּרֵק
  choice: തളിക്കുന്ന
  rationale: זרק ബലിയുടെ രക്തം യാഗപീഠത്തിന്മേൽ/ചുറ്റും എറിയുകയോ ചീറ്റിക്കുകയോ ചെയ്യുന്ന ആചാരപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘തളിക്കുന്ന’ സ്വാഭാവികമായ യാഗഭാഷയാണ്; ‘ചീറ്റുന്ന/എറിയുന്ന’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: דַּם הַשְּׁלָמִים
  choice: സമാധാനയാഗങ്ങളുടെ രക്തം
  rationale: שְׁלָמִים എന്ന സ്ഥാപിത യാഗവിഭാഗത്തിന് ‘സമാധാനയാഗങ്ങൾ’ ഉപയോഗിച്ചു; കൂട്ടായ്മയുടെയും ക്ഷേമത്തിന്റെയും അർഥനിഴലുകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לוֹ יִהְיֶה
  choice: അത് അവകാശമായിരിക്കും
  rationale: പുരോഹിതന് ആ വിഹിതം ലഭിക്കേണ്ടതാണെന്ന ഉടമസ്ഥതയുടെയും നിയമാനുസൃത വിഹിതത്തിന്റെയും ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ മലയാളത്തിൽ പൊതുവായി തിരിച്ചറിയാവുന്ന രൂപത്തിൽ നൽകുന്നു; ‘കർത്താവ്’ എന്ന പകരംവായന ഉപയോഗിച്ച് നാമത്തെ പദവിയാക്കി മാറ്റുന്നില്ല.
- issue: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ പരിഭാഷ
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ / ക്ഷേമയാഗങ്ങൾ
  rationale: പരിചിതമായ യാഗനാമം നിലനിർത്തുകയും പദത്തിന്റെ അർഥപരിധി ‘കൂട്ടായ്മ’യിലേക്കോ ‘ക്ഷേമം’ എന്ന ആശയത്തിലേക്കോ മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ആചാര ശൈലി സ്വീകരിച്ചു. ‘ഓരോ വഴിപാടിൽനിന്നും ഓരോന്ന്’ എന്ന പ്രയോഗം എബ്രായത്തിലെ വിതരണാർഥം വ്യക്തമായി നൽകുന്നു. സാങ്കേതിക യാഗപദങ്ങൾക്ക് വായനാസൗകര്യമുള്ള മുഖ്യപരിഭാഷയും യഥാർഥ പദവൈവിധ്യം സംരക്ഷിക്കുന്ന അടിക്കുറിപ്പുകളും നൽകി.
