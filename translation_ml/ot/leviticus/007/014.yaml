  to: അതിൽനിന്ന് ഓരോ വഴിപാടിൽനിന്നും ഓരോന്ന് യഹോവയ്ക്കായി നീക്കിവെച്ച വിഹിതമായി[a] അർപ്പിക്കണം; സമാധാനയാഗങ്ങളുടെ[c] രക്തം ചീറ്റുന്ന[b] പുരോഹിതന് അത് അവകാശമായിരിക്കും.
  rationale: മൂലപാഠത്തിലെ זרק എന്ന ക്രിയയുടെ ശക്തമായ യാഗരക്ത-പ്രവൃത്തിയെ മുഖ്യപാഠത്തിൽ ‘ചീറ്റുന്ന’ എന്നു വ്യക്തമാക്കി. മറ്റെല്ലാ പദപ്രയോഗങ്ങളും മൂലപാഠത്തോടും ആധുനിക മലയാളപ്രയോഗത്തോടും യോജിക്കുന്നതിനാൽ മാറ്റിയിട്ടില്ല. അടിക്കുറിപ്പിൽ ‘തളിക്കുന്ന,’ ‘എറിയുന്ന’ എന്നീ നിയമാനുസൃത പകരംവായനകൾ നിലനിർത്തി.
