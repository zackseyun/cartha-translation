id: LEV.7.30
reference: Leviticus 7:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יָדָ֣י/ו תְּבִיאֶ֔ינָה אֵ֖ת אִשֵּׁ֣י יְהוָ֑ה אֶת הַ/חֵ֤לֶב עַל הֶֽ/חָזֶה֙ יְבִיאֶ֔/נּוּ אֵ֣ת הֶ/חָזֶ֗ה לְ/הָנִ֥יף אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: ml
  text: അവന്റെ സ്വന്തം കൈകൾ യഹോവയ്ക്കുള്ള അഗ്നിയാഗങ്ങൾ കൊണ്ടുവരണം. നെഞ്ച് യഹോവയുടെ സന്നിധിയിൽ നീരാജനയാഗമായി നീരാജനം ചെയ്യേണ്ടതിന്, അവൻ നെഞ്ചിനോടുകൂടെ കൊഴുപ്പും കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשֵּׁי יְהוָה
  choice: യഹോവയ്ക്കുള്ള ദഹനയാഗങ്ങൾ
  rationale: אִשֶּׁה എന്ന പദം അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമായ രൂപമായി ‘ദഹനയാഗങ്ങൾ’ തെരഞ്ഞെടുത്തു.
- source_word: הֶחָזֶה
  choice: നെഞ്ച്
  rationale: യാഗമൃഗത്തിന്റെ breast/chest ഭാഗത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: לְהָנִיף ... תְּנוּפָה
  choice: നീരാജനയാഗമായി നീരാജനം ചെയ്യേണ്ടതിന്
  rationale: הניף/תנופה എന്ന ക്രിയ-നാമ പദപ്രയോഗത്തിന്റെ ആചാരപരമായ ‘wave offering’ ആശയം മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ‘നീരാജനം’ ഉപയോഗിച്ച് നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ‘യഹോവയുടെ മുമ്പാകെ’ എന്ന അർത്ഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ പ്രതിനിധാനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ יהוה എന്ന പ്രത്യേക ദൈവനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ പ്രതിനിധാനം ചെയ്തു.
- issue: תנופה എന്ന ആചാരത്തിന്റെ സ്വഭാവം
  choice: നീരാജനയാഗം
  alternative: ഉയർത്തിക്കാട്ടുന്ന യാഗം / ചലനയാഗം
  rationale: ആചാരം കൃത്യമായി എങ്ങനെ നിർവഹിച്ചുവെന്നത് പദത്തിൽനിന്നു മാത്രം അമിതമായി നിർണ്ണയിക്കാതെ, പരമ്പരാഗതമായി അംഗീകരിക്കപ്പെട്ട സാങ്കേതിക പദം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രു വാക്യഘടനയിലെ ഉദ്ദേശ്യബന്ധം വ്യക്തമായി പ്രകടിപ്പിച്ചിരിക്കുന്നു; അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
