source:
  edition: WLC
  text: עַל חַלֹּת֙ לֶ֣חֶם חָמֵ֔ץ יַקְרִ֖יב קָרְבָּנ֑/וֹ עַל זֶ֖בַח תּוֹדַ֥ת שְׁלָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/013.yaml
  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: ml
  text: പുളിപ്പിച്ച അപ്പങ്ങളോടൊപ്പം, നന്ദിയർപ്പണമായ തന്റെ സമാധാനയാഗത്തോടുകൂടെ[a] അവൻ തന്റെ വഴിപാട് അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തന്റെ കൂട്ടായ്മയാഗത്തോടുകൂടെ’ അല്ലെങ്കിൽ ‘തന്റെ ക്ഷേമയാഗത്തോടുകൂടെ’.
    reason: שְׁלָמִים എന്ന സാങ്കേതിക യാഗപദത്തിന്റെ സാധുവായ അർത്ഥവികല്പങ്ങൾ സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: עַל
  choice: ഒപ്പം / കൂടെ
  rationale: ഈ വാക്യത്തിൽ עַל ഭൗതികമായി ‘മേൽ’ എന്നതല്ല, അനുബന്ധമോ ഒപ്പമുണ്ടാകുന്നതോ സൂചിപ്പിക്കുന്നു.
- source_word: חַלֹּת לֶחֶם
  choice: അപ്പങ്ങൾ
  rationale: חַלּוֹת അപ്പത്തിന്റെ വട്ടങ്ങളെയോ അപ്പങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ആചാരപരമായ ഭക്ഷണസന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമായ മലയാളം ‘അപ്പങ്ങൾ’ ആണ്.
- source_word: חָמֵץ
  choice: പുളിപ്പിച്ച
  rationale: പുളിപ്പില്ലാത്ത അപ്പവുമായി കാണുന്ന ആചാരപരമായ വ്യത്യാസം വ്യക്തമായി നിലനിർത്തുന്ന സാധാരണ മലയാളപ്രയോഗമാണിത്.
- source_word: יַקְרִיב
  choice: അർപ്പിക്കണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ കൊണ്ടുവന്ന് സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അർപ്പിക്കണം’ നിർദേശാത്മക ഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קָרְבָּנוֹ
  choice: തന്റെ വഴിപാട്
  rationale: קָרְבָּן ദൈവത്തിനു കൊണ്ടുവരുന്ന പൊതുവായ അർപ്പണത്തെ സൂചിപ്പിക്കുന്നു; ‘വഴിപാട്’ ഇവിടെ യാഗാർപ്പണസന്ദർഭത്തിന് യോജിച്ച പരിചിതമായ പദമാണ്.
- source_word: זֶבַח
  choice: യാഗം
  rationale: അറുത്ത് അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന ഈ സാങ്കേതിക പദത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ തുല്യപദം ‘യാഗം’ ആണ്.
- source_word: תּוֹדַת
  choice: സ്തോത്രത്തിനായുള്ള
  rationale: תּוֹדָה നന്ദിയോ സ്തോത്രമോ പ്രകടിപ്പിക്കുന്ന യാഗത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു; ലക്ഷ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שְׁלָמָיו
  choice: തന്റെ സമാധാനയാഗം
  rationale: שְׁלָמִים ഒരു പ്രത്യേക യാഗവിഭാഗമാണ്. ‘സമാധാനയാഗം’ ശാലോം എന്ന പദകുടുംബത്തോടുള്ള ബന്ധവും പരമ്പരാഗത തിരിച്ചറിയലും നിലനിർത്തുന്നു; മറ്റു സാധുവായ അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗസാങ്കേതിക പദത്തിന്റെ പരിഭാഷ
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: എബ്രായപദം സമാധാനം, സമ്പൂർണക്ഷേമം, പങ്കിട്ട കൂട്ടായ്മ എന്നിവയുമായി ബന്ധപ്പെട്ട ഒരു യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ഒരു വ്യാഖ്യാനസാധ്യത മാത്രം നിർബന്ധിക്കാതെ, പരിചിതമായ ‘സമാധാനയാഗം’ മുഖ്യവാചകത്തിൽ നിലനിർത്തുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ dignified ആചാരപരമായ ഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള അനുബന്ധബന്ധം ‘ഒപ്പം/കൂടെ’ എന്ന ഘടനയിൽ നിലനിർത്തി; സാങ്കേതിക യാഗപദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
