id: LEV.7.26
reference: Leviticus 7:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל דָּם֙ לֹ֣א תֹאכְל֔וּ בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶ֑ם לָ/ע֖וֹף וְ/לַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/026.yaml
  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: ml
  text: നിങ്ങളുടെ വാസസ്ഥലങ്ങളിലെങ്ങും പക്ഷിയുടെയോ മൃഗത്തിന്റെയോ രക്തം നിങ്ങൾ ഭക്ഷിക്കരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל דָּם
  choice: രക്തം
  rationale: നിഷേധവാക്യത്തിലെ כָּל സമഗ്രമായ നിരോധനമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ പ്രത്യേകം ‘ഏതൊരു’ ചേർക്കാതെ ‘രക്തം ... ഭക്ഷിക്കരുത്’ എന്നു പറയുന്നത് സ്വാഭാവികവും അതേ വ്യാപ്തിയുള്ളതുമാണ്.
- source_word: לֹא תֹאכְלוּ
  choice: നിങ്ങൾ ഭക്ഷിക്കരുത്
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള നിയമപരമായ നിരോധനത്തിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּ/כֹל מוֹשְׁבֹתֵי/כֶם
  choice: നിങ്ങളുടെ വാസസ്ഥലങ്ങളിലെങ്ങും
  rationale: ‘നിങ്ങളുടെ എല്ലാ വാസസ്ഥലങ്ങളിലും/താമസപ്രദേശങ്ങളിലുമെങ്ങും’ എന്ന വിതരണപരവും സമഗ്രവുമായ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָ/עוֹף וְ/לַ/בְּהֵמָה
  choice: പക്ഷിയുടെയോ മൃഗത്തിന്റെയോ
  rationale: ഹീബ്രുവിലെ לְ ഇവിടെ രക്തം ഏതു ജീവിവർഗത്തിന്റേതാണെന്ന ബന്ധം സൂചിപ്പിക്കുന്നു. രണ്ട് വിഭാഗങ്ങളിലേതായാലും നിരോധനം ബാധകമാണെന്ന് മലയാളത്തിലെ ‘-യുടെയോ ... -യുടെയോ’ വ്യക്തമാക്കുന്നു; בְּהֵמָהയ്ക്ക് സന്ദർഭത്തിൽ വ്യാപകമായ ‘മൃഗം’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: രക്തനിരോധനത്തിന്റെ വ്യാപ്തി
  choice: ഇസ്രായേല്യരുടെ എല്ലാ വാസസ്ഥലങ്ങളിലും പക്ഷികളുടെയോ മൃഗങ്ങളുടെയോ രക്തം ഭക്ഷിക്കുന്നത് നിരോധിക്കുന്നു.
  alternative: അവസാനഭാഗം കൂടുതൽ പദാനുപദമായി ‘പക്ഷിക്കും മൃഗത്തിനും’ എന്നു വിവർത്തനം ചെയ്യാം.
  rationale: വാക്യഘടന രക്തം ഏതു ജീവിവർഗത്തിൽനിന്നുള്ളതാണെന്ന് വ്യക്തമാക്കുന്നതായി സ്വാഭാവികമായി മനസ്സിലാക്കാം. പിന്നീടുള്ള ദൈവശാസ്ത്രപരമായ വിശദീകരണങ്ങൾ ചേർക്കാതെ നിയമത്തിന്റെ പരിധി മാത്രം വിവർത്തനം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ‘വാസസ്ഥലങ്ങളിലെങ്ങും’ എന്നത് പദാനുപദതയും സാധാരണ വായനാസൗകര്യവും സന്തുലിതമാക്കുന്നു.
