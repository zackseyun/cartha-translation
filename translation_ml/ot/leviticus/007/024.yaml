source:
  edition: WLC
  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: ml
  text: തനിയെ ചത്ത മൃഗത്തിന്റെ കൊഴുപ്പും[a] വന്യമൃഗം കീറിയ മൃഗത്തിന്റെ കൊഴുപ്പും[b] ഏതൊരു ഉപയോഗത്തിനും ഉപയോഗിക്കാം; എന്നാൽ അത് ഒരിക്കലും തിന്നരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദമായ ‘നെവേലാ’ വിധിപ്രകാരം അറുക്കപ്പെടാതെ ചത്ത മൃഗത്തെ സൂചിപ്പിക്കുന്നു; ‘ചത്തുകിടക്കുന്നതായി കണ്ടെത്തിയ മൃഗം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘വന്യമൃഗങ്ങളാൽ കീറപ്പെട്ട മൃഗം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗ-ഭക്ഷണനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ മൃഗക്കൊഴുപ്പിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പൊതുവേ മനസ്സിലാകുന്നതുമായ പദം.
- source_word: נְבֵלָה
  choice: തനിയെ ചത്ത മൃഗം
  rationale: വിധിപ്രകാരം അറുക്കപ്പെടാതെ ചത്ത മൃഗം എന്ന നിയമപരമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മരണകാരണം നിർബന്ധമായും 'സ്വാഭാവികം' എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: טְרֵפָה
  choice: വന്യമൃഗം കടിച്ചുകീറിയ മൃഗം
  rationale: ഇരപിടിയൻ മൃഗം കീറിയതോ ആക്രമിച്ചതോ ആയ മൃഗം എന്ന മൂലപദത്തിന്റെ സാധാരണ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: יֵעָשֶׂה
  choice: ഉപയോഗിക്കാം
  rationale: നിർമാണം മാത്രം സൂചിപ്പിക്കാതെ, ഭക്ഷണമല്ലാത്ത പ്രായോഗിക ഉപയോഗത്തിന് അനുമതി നൽകുന്ന നിഫാൽ രൂപത്തിന്റെ സന്ദർഭാർഥം പകർത്തുന്നു.
- source_word: לְכָל מְלָאכָה
  choice: ഏതൊരു ആവശ്യത്തിനും
  rationale: കൊഴുപ്പിന്റെ ഭക്ഷണേതര ഉപയോഗങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: എന്നാൽ അത് ഒരിക്കലും തിന്നരുത്
  rationale: ക്രിയാനാമത്തോടുകൂടിയ ക്രിയാരൂപം നൽകുന്ന ശക്തമായ നിരോധനം 'ഒരിക്കലും' എന്ന പദത്തിലൂടെ വ്യക്തമാക്കുന്നു.
