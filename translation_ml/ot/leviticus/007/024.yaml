  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ രണ്ടു മൃഗവിഭാഗങ്ങളും ഭക്ഷണേതര ഉപയോഗത്തിനുള്ള അനുമതിയും ഭക്ഷണത്തിനെതിരായ ശക്തമായ നിരോധനവും വ്യക്തമായി നിലനിർത്തി.
