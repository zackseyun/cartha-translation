id: LEV.7.8
reference: Leviticus 7:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ֨/כֹּהֵ֔ן הַ/מַּקְרִ֖יב אֶת עֹ֣לַת אִ֑ישׁ ע֤וֹר הָֽ/עֹלָה֙ אֲשֶׁ֣ר הִקְרִ֔יב לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/008.yaml
  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: ml
  text: ഒരു പുരുഷന്റെ ഹോമയാഗം അർപ്പിക്കുന്ന പുരോഹിതന്, താൻ അർപ്പിച്ച ഹോമയാഗത്തിന്റെ തോൽ[a] സ്വന്തമായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘മൃഗചർമ്മം.’'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അത് പുരോഹിതന്, അവന് ആയിരിക്കും.’'
    reason: source_form
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: യാഗനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ כֹּהֵן എന്നതിന് സ്വാഭാവികവും സ്ഥിരവുമായ മലയാള പദം; നിർദിഷ്ടത സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: അർപ്പിക്കുന്ന / അർപ്പിച്ച
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ഇവിടെ യാഗം അർപ്പിക്കുക എന്ന ആരാധനാക്രമപരമായ അർത്ഥമാണ്; ആദ്യരൂപത്തിന്റെ പ്രവർത്തനഭാവവും പിന്നീടുള്ള പൂർത്തിയായ പ്രവർത്തിയും മലയാളത്തിൽ വേർതിരിക്കുന്നു.
- source_word: עֹלַת אִישׁ
  choice: ഒരു പുരുഷന്റെ ഹോമയാഗം
  rationale: עֹלָה എന്ന യാഗവിഭാഗത്തിന് 'ഹോമയാഗം' എന്ന പരിചിതമായ പദം ഉപയോഗിക്കുകയും אִישׁ എന്ന ഏകവചന പുല്ലിംഗരൂപം പൊതുവൽക്കരിക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: עֹור
  choice: തോൽ
  rationale: യാഗമൃഗത്തിന്റെ skin/hide എന്ന അർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ 'തോൽ' എന്നു വ്യക്തമാക്കുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ עֹלָה എന്ന സമ്പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗവിഭാഗത്തിനുള്ള സ്ഥിരവും വായനക്കാർക്ക് പരിചിതവുമായ പരിഭാഷ.
- source_word: אֲשֶׁר הִקְרִיב
  choice: താൻ അർപ്പിച്ച
  rationale: ബന്ധവാക്യം പുരോഹിതൻ അർപ്പിച്ച നിർദിഷ്ട ഹോമയാഗത്തെ സൂചിപ്പിക്കുന്നു; 'താൻ' കർത്താവിലേക്കുള്ള തിരിച്ചുസൂചന സ്വാഭാവികമാക്കുന്നു.
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: പുരോഹിതന് ... സ്വന്തമായിരിക്കും
  rationale: അക്ഷരാർഥത്തിലുള്ള 'പുരോഹിതന്, അവന് ആയിരിക്കും' എന്ന ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി ഉടമസ്ഥാവകാശം വ്യക്തമാക്കുന്ന വിധത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: אִישׁ എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: ഒരു പുരുഷന്റെ ഹോമയാഗം
  alternative: ഒരാളുടെ ഹോമയാഗം
  rationale: എബ്രായത്തിലെ ഏകവചന പുല്ലിംഗമായ אִישׁ എന്ന രൂപം അനാവശ്യമായി ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
- issue: עֹלָה എന്ന യാഗസാങ്കേതികപദം
  choice: ഹോമയാഗം
  alternative: ദഹനയാഗം / ആരോഹണയാഗം
  rationale: യാഗം മുഴുവനായി ദഹിപ്പിക്കുന്ന സ്ഥാപിത വിഭാഗത്തെ 'ഹോമയാഗം' വ്യക്തമായി സൂചിപ്പിക്കുന്നു; 'ആരോഹണയാഗം' പദോത്പത്തിയെ കൂടുതൽ കാണിച്ചാലും സാധാരണ വായനക്കാർക്ക് കുറച്ച് വ്യക്തമാണ്.
- issue: തോൽ ലഭിക്കുന്ന പുരോഹിതൻ ആരെന്നത്
  choice: യാഗം അർപ്പിക്കുന്ന അതേ പുരോഹിതന് തോൽ സ്വന്തമായിരിക്കും
  alternative: പുരോഹിതവർഗത്തിന് പൊതുവായി തോൽ ലഭിക്കും
  rationale: വാക്യത്തിലെ ഏകവചന ബന്ധഘടനയും לַכֹּהֵן לוֹ എന്ന ഊന്നലും നിർവഹിച്ച പുരോഹിതന്റെ വ്യക്തിഗത അവകാശത്തെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാഗസാങ്കേതികതയ്ക്കായി പരിചിതമായ ‘ഹോമയാഗം’, ‘പുരോഹിതൻ’ എന്നീ പദങ്ങൾ നിലനിർത്തി; എബ്രായത്തിലെ ഏകവചന പുല്ലിംഗസൂചനയും ഉടമസ്ഥതയിലെ ഊന്നലും സംരക്ഷിച്ചു.
