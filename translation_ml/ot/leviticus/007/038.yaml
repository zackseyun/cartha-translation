revisions:
- from: യഹ്‌വെ സീനായിമലയിൽവെച്ച് മോശയോടു കല്പിച്ചവ ഇവയാണ്; യഹ്‌വെക്കു തങ്ങളുടെ വഴിപാടുകൾ അർപ്പിക്കാൻ ഇസ്രായേൽമക്കളോടു അവൻ കല്പിച്ച ദിവസം, സീനായിമരുഭൂമിയിൽവെച്ചാണ് അവൻ ഇവ കല്പിച്ചത്.
  to: സീനായി മരുഭൂമിയിൽവെച്ച് യഹ്‌വെക്കു തങ്ങളുടെ അർപ്പണങ്ങൾ അർപ്പിക്കാൻ അവൻ ഇസ്രായേൽമക്കളോടു കല്പിച്ച ദിവസത്തിൽ, സീനായിപർവതത്തിൽവെച്ച് യഹ്‌വെ മോശെയോടു കല്പിച്ചവയാണിവ.
  rationale: The revision retains the antecedent-summarizing sense supplied by the preceding context (‘ഇവ’) while accurately making the Sinai-wilderness phrase part of the temporal setting. It removes the unsupported claim that Yahweh commanded these regulations a second time in the wilderness.
