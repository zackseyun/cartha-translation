source:
  edition: WLC
  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: ml
  text: സീനായി മരുഭൂമിയിൽവെച്ച് യഹ്‌വെക്കു തങ്ങളുടെ അർപ്പണങ്ങൾ അർപ്പിക്കാൻ അവൻ ഇസ്രായേൽമക്കളോടു കല്പിച്ച ദിവസത്തിൽ, സീനായിപർവതത്തിൽവെച്ച് യഹ്‌വെ മോശെയോടു കല്പിച്ചവയാണിവ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: കല്പിച്ചവ ഇവയാണ്
  rationale: മുൻവാക്യങ്ങളിലെ ചട്ടങ്ങളിലേക്കു ബന്ധിപ്പിക്കുന്ന സാപേക്ഷഘടന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഈ വാക്യം മുൻസന്ദർഭത്തിന്റെ സമാപനമാണെന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: നിയമപരവും ആരാധനാക്രമപരവുമായ പശ്ചാത്തലത്തിൽ ക്രിയയുടെ അധികാരപൂർണമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּהַר סִינָי
  choice: സീനായിമലയിൽവെച്ച്
  rationale: സ്ഥലസൂചനയായ בְּ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും സീനായിമല എന്ന ഭൂമിശാസ്ത്രപരമായ പരാമർശം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּיוֹם צַוֹּתוֹ
  choice: അവൻ കല്പിച്ച ദിവസം
  rationale: ഹീബ്രുവിലെ വ്യക്തമായ കാലസൂചനയും സർവനാമപ്രത്യയമുള്ള infinitive construct-ന്റെ അർഥവും വായനാസൗകര്യമുള്ള ഉപവാക്യമായി നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധസൂചകമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לְהַקְרִיב
  choice: അർപ്പിക്കാൻ
  rationale: ഹിഫിൽ രൂപത്തിന്റെ യാഗാർപ്പണസന്ദർഭത്തിലുള്ള ‘സമീപത്തേക്കു കൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קָרְבְּנֵיהֶם
  choice: തങ്ങളുടെ വഴിപാടുകൾ
  rationale: വിവിധതരം യാഗങ്ങളെയും അർപ്പണങ്ങളെയും ഉൾക്കൊള്ളുന്ന קָרְבָּן എന്ന വിശാല പദത്തിന് ‘വഴിപാടുകൾ’ അനുയോജ്യമാണ്.
- source_word: בְּמִדְבַּר סִינָי
  choice: സീനായിമരുഭൂമിയിൽവെച്ച്
  rationale: מִדְבָּר എന്നതിന്റെ വനാന്തര/മരുഭൂമി പ്രദേശം എന്ന അർഥവും സ്ഥലപ്പേരും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു; ‘യഹ്‌വെ’ സാധ്യതയേറിയ ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽജനം
  rationale: ഹീബ്രുവിലെ കുടുംബപരമായ രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽ സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിനെ വ്യാഖ്യാനിച്ച് മാറ്റിയിട്ടില്ല.
- issue: വാക്യത്തിലെ ആവർത്തിച്ചുള്ള കല്പനയുടെ കർത്താവ്
  choice: രണ്ടാം ഘടകത്തിൽ ‘അവൻ’ എന്നും അവസാനത്തിൽ ‘അവൻ’ എന്നും യഹ്‌വെയെ സൂചിപ്പിക്കുന്നു
  alternative: അവസാന ക്രിയ ഒഴിവാക്കി കൂടുതൽ സംക്ഷിപ്തമായി ബന്ധിപ്പിക്കൽ
  rationale: ഹീബ്രുവിലെ צַוֹּתוֹ എന്ന രൂപത്തിലെ കർത്താവ് യഹ്‌വെയാണ്; മലയാളത്തിൽ സൂചന വ്യക്തമാക്കുമ്പോഴും മോശയാണ് ഇസ്രായേൽമക്കളോടു കല്പിച്ചതെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ സമാപന സാപേക്ഷവാക്യമാണെങ്കിലും ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ വ്യക്തതയ്ക്കായി ‘ഇവയാണ്’ ചേർത്തു. ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ കുടുംബപരമായ രൂപം സംരക്ഷിക്കുന്നു; പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
