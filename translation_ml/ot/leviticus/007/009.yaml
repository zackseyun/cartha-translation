source:
  edition: WLC
  text: וְ/כָל מִנְחָ֗ה אֲשֶׁ֤ר תֵּֽאָפֶה֙ בַּ/תַּנּ֔וּר וְ/כָל נַעֲשָׂ֥ה בַ/מַּרְחֶ֖שֶׁת וְ/עַֽל מַחֲבַ֑ת לַ/כֹּהֵ֛ן הַ/מַּקְרִ֥יב אֹתָ֖/הּ ל֥/וֹ תִֽהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: ml
  text: ചൂളയിൽ ചുട്ടതോ ആഴമുള്ള ചട്ടിയിൽ[a] അല്ലെങ്കിൽ പരന്ന ചട്ടിയിൽ തയ്യാറാക്കിയതോ ആയ ഓരോ ധാന്യയാഗവും അതു അർപ്പിക്കുന്ന പുരോഹിതനുള്ളതായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആഴമുള്ള ചട്ടി,” “പരന്ന ചട്ടി” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന രണ്ടു എബ്രായ പദങ്ങളും വ്യത്യസ്ത തരത്തിലുള്ള പാചകോപകരണങ്ങളെ സൂചിപ്പിക്കുന്നതായിരിക്കാം; അവയുടെ കൃത്യമായ രൂപം ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസന്ദർഭത്തിൽ ഇത് പൊതുവായ വഴിപാടല്ല, ധാന്യത്തിൽനിന്നുള്ള പ്രത്യേക യാഗമാണ്; ‘ധാന്യയാഗം’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: അടുപ്പിൽ ചുട്ടത്
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണി അർഥവും תַּנּוּר എന്ന ചുട്ടെടുക്കാനുള്ള അടുപ്പും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: נַעֲשָׂה
  choice: തയ്യാറാക്കിയത്
  rationale: עשה എന്ന വിശാലമായ ക്രിയയ്ക്ക് ഭക്ഷണനിർമാണസന്ദർഭത്തിൽ ‘തയ്യാറാക്കിയത്’ സ്വാഭാവികമാണ്; പാചകരീതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: מַרְחֶשֶׁת
  choice: ആഴമുള്ള ചട്ടി
  rationale: അടുത്ത പദമായ מַחֲבַת-ൽനിന്നുള്ള സാധ്യതയുള്ള പാത്രവ്യത്യാസം നിലനിർത്താൻ ആഴമുള്ള പാചകപാത്രമെന്ന പരമ്പരാഗത ധാരണ സൂചിപ്പിക്കുന്നു.
- source_word: מַחֲבַת
  choice: പരന്ന ചട്ടി
  rationale: מַרְחֶשֶׁת-നെക്കാൾ പരന്ന പാചകോപകരണമെന്ന സാധ്യതയുള്ള വ്യത്യാസം മലയാളത്തിൽ വ്യക്തവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: הַמַּקְרִיב אֹתָהּ
  choice: അതു അർപ്പിക്കുന്ന
  rationale: קרב എന്ന ഹിഫീൽ രൂപത്തിന് യാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക’ കൃത്യവും സ്വാഭാവികവുമാണ്; ‘അടുത്തുകൊണ്ടുവരുക’ എന്ന പദാനുപദ രൂപത്തേക്കാൾ ചടങ്ങിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: לַכֹּהֵן ... לוֹ תִהְיֶה
  choice: പുരോഹിതനുള്ളതായിരിക്കണം
  rationale: ലാമെദും לוֹ תִהְיֶה എന്ന ഘടനയും ഇവിടെ അവകാശം/വിഹിതം സൂചിപ്പിക്കുന്നു; ഈ നിയമപരമായ അർഥം മലയാളത്തിൽ നേരിട്ട് അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവാക്യമായി നിലനിർത്തി; രണ്ടു പാചകപാത്രങ്ങളുടെ സാധ്യതയുള്ള വ്യത്യാസം പാഠത്തിലും അതിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലും സൂക്ഷിച്ചു.
