id: LEV.7.22
reference: Leviticus 7:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ[a] മോശെയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ ഹീബ്രു വ്യഞ്ജനരൂപവും അതിനു പകരമായി ഉപയോഗിക്കുന്ന പരമ്പരാഗത പരിഭാഷയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: וַיְדַבֵּר ഒരു പുതിയ ദൈവിക പ്രസംഗഘടകം ആരംഭിക്കുന്നു. മലയാള ബൈബിൾഭാഷയിൽ ദൈവത്തിന്റെ ഔപചാരികമായ സംസാരത്തെ സ്വാഭാവികവും ആദരപൂർവവുമായി സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്തു’ യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന നാമരൂപത്തിൽ നിലനിർത്തുന്നു; സാധ്യതയുള്ള ഉച്ചാരണവ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶל
  choice: -ഓട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന മുൻപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദത്തിവ്/സംബോധനരൂപമായ ‘മോശയോട്’ ഉപയോഗിക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാളത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്ന് വരുന്ന വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന לֵאמֹר എന്ന ഹീബ്രു സൂത്രവാക്യത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘ഇപ്രകാരം പറഞ്ഞു’ എന്നു ആവർത്തിക്കുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാൽ പകരാതെ മലയാള വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ എന്നു നൽകുന്നു. ഹീബ്രു വ്യഞ്ജനരൂപവും മറ്റൊരു സാധാരണ പുനർനിർമിത ഉച്ചാരണവും അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർവവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രു പ്രസംഗപരിചയ സൂത്രത്തിന്റെ അർഥം മലയാളത്തിലെ സ്വാഭാവിക വിരാമചിഹ്നത്തിലൂടെ കൈമാറുന്നു.
