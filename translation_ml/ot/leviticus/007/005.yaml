id: LEV.7.5
reference: Leviticus 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְטִ֨יר אֹתָ֤/ם הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה אִשֶּׁ֖ה לַ/יהוָ֑ה אָשָׁ֖ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: ml
  text: പുരോഹിതൻ അവയെ യാഗപീഠത്തിന്മേൽ യഹ്‌വേക്കുള്ള അഗ്നിയർപ്പണമായി[a] ദഹിപ്പിക്കണം; അത് കുറ്റയാഗമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യഹ്‌വേക്കായി അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗമായി.’ എബ്രായപദം അഗ്നിമുഖേന അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പരിഹാരയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം; പരമ്പരാഗതമായി ‘അകൃത്യയാഗം’ എന്നും പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: ദഹിപ്പിക്കണം
  rationale: ഹിഫ്ഈൽ രൂപത്തിലുള്ള קטר യാഗസന്ദർഭത്തിൽ വസ്തു യാഗപീഠത്തിൽ പുകയായി ഉയരുന്നവിധം ദഹിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ദഹിപ്പിക്കണം’ ആ പ്രവൃത്തി സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: אֹתָם
  choice: അവയെ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ യാഗത്തിന്റെ ഭാഗങ്ങളെയാണ് ബഹുവചന പ്രത്യക്ഷകർമ സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: നിശ്ചിത ഏകവചന നാമത്തിന് ലേവ്യപുസ്തകത്തിലെ ആരാധനാക്രമസന്ദർഭത്തിൽ യോജിച്ച സാധാരണ മലയാള പദം.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശാസൂചക പ്രത്യയം അക്ഷരാർഥത്തിൽ ‘യാഗപീഠത്തിലേക്ക്’ എന്നു വരാമെങ്കിലും, ഇവിടെ യാഗഭാഗങ്ങൾ പീഠത്തിന്മേൽ ദഹിപ്പിക്കുന്ന പ്രവർത്തിയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: אִשֶּׁה
  choice: അഗ്നിയർപ്പണം
  rationale: ലേവ്യപുസ്തകത്തിലെ സാങ്കേതിക യാഗപദം അഗ്നിമുഖേന അർപ്പിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്നു. ‘അഗ്നിയർപ്പണം’ അഗ്നിയുമായുള്ള ബന്ധം നിലനിർത്തുകയും ‘ഭോജനയാഗം’ എന്ന വിവാദ വ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: לְ സമർപ്പണത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה ‘യഹ്‌വേ’ എന്നു നേരിട്ട് ലിപ്യന്തരണം ചെയ്തു.
- source_word: אָשָׁם
  choice: കുറ്റയാഗം
  rationale: ഇത് കുറ്റബോധത്തോടും ചില സന്ദർഭങ്ങളിൽ നഷ്ടപരിഹാരത്തോടും ബന്ധപ്പെട്ട ഔപചാരിക യാഗവിഭാഗത്തിന്റെ പേരാണ്. ‘കുറ്റയാഗം’ ആ വിഭാഗത്തെ ആധുനിക വായനക്കാർക്ക് സുതാര്യമായി അറിയിക്കുന്നു; മറ്റു പതിവു പേരുകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הוּא
  choice: അത് … ആണ്
  rationale: ഈ യാഗത്തെ അതിന്റെ ഔപചാരിക വിഭാഗമായി തിരിച്ചറിയിക്കുന്ന എബ്രായ നാമവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ ഉടമ്പടിനാമം മറയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: אָשָׁם എന്ന സാങ്കേതിക യാഗപദം
  choice: കുറ്റയാഗം
  alternative: പരിഹാരയാഗം; അകൃത്യയാഗം
  rationale: പ്രധാനപാഠത്തിൽ യാഗത്തിന്റെ കുറ്റവുമായി ബന്ധപ്പെട്ട സ്വഭാവം വ്യക്തമായി നിലനിർത്തുന്നു. ‘പരിഹാരയാഗം’ നഷ്ടപരിഹാരവശത്തിന് കൂടുതൽ ഊന്നൽ നൽകുന്നതിനാൽ അതിനെ ഏക അർഥമായി സ്വീകരിക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി ഉപയോഗിച്ചു. യാഗസാങ്കേതികത നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
