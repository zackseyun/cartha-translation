id: LEV.7.20
reference: Leviticus 7:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶׁר תֹּאכַ֣ל בָּשָׂ֗ר מִ/זֶּ֤בַח הַ/שְּׁלָמִים֙ אֲשֶׁ֣ר לַ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: ml
  text: എന്നാൽ യഹോവയ്ക്കുള്ള സമാധാനയാഗത്തിൽനിന്നുള്ള മാംസം, തന്റെമേൽ അശുദ്ധിയുള്ളപ്പോൾ ഭക്ഷിക്കുന്ന വ്യക്തി—ആ വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തന്റെ ജനത്തിൽനിന്ന് പുറത്താക്കപ്പെടണം.’ ‘ഛേദിക്കപ്പെടണം’ എന്ന പ്രയോഗം പുറത്താക്കലിനെയോ മരണത്തെയോ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ അതിന്റെ കൃത്യമായ വിധം എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: വ്യക്തി
  rationale: നിയമസന്ദർഭത്തിൽ נֶפֶשׁ അമൂർത്തമായ ‘ആത്മാവ്’ എന്നതിലുപരി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘വ്യക്തി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ലിംഗനിരപേക്ഷവുമാണ്.
- source_word: תֹּאכַל
  choice: ഭക്ഷിക്കുന്ന
  rationale: ഇവിടത്തെ അപൂർണക്രിയ പൊതുവായ ഒരു നിയമസാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ ബന്ധകൃദ്‌രൂപം ആ വ്യവസ്ഥാപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בָּשָׂר
  choice: മാംസം
  rationale: യാഗഭക്ഷണത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘മാംസം’ വ്യക്തവും സാധാരണ ഉപയോഗത്തിലുള്ളതുമാണ്.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗത്തിന്റെ
  rationale: ശְׁלָמִים എന്ന നിർദിഷ്ട യാഗവിഭാഗത്തിന് പരിചിതമായ ‘സമാധാനയാഗം’ നിലനിർത്തുന്നു; מִן യാഗത്തിൽനിന്നുള്ള മാംസമെന്ന ബന്ധത്തിലൂടെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: אֲשֶׁר לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: യാഗം യഹോവയ്ക്കായി സമർപ്പിക്കപ്പെട്ടതും അവനു വിശുദ്ധമായി അവകാശപ്പെട്ടതുമാണെന്ന ആശയം സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: טֻמְאָתוֹ עָלָיו
  choice: തന്റെ അശുദ്ധി തന്റെമേൽ ഇരിക്കുമ്പോൾ
  rationale: ‘അശുദ്ധി അവന്റെമേൽ’ എന്ന എബ്രായ രൂപകവും ആചാരപരമായ നിയമബലവും നിലനിർത്തുന്നു; വെറും ‘അശുദ്ധനായിരിക്കുമ്പോൾ’ എന്ന് ലളിതീകരിക്കുന്നില്ല.
- source_word: וְנִכְרְתָה
  choice: ഛേദിക്കപ്പെടണം
  rationale: כרת എന്ന ശിക്ഷാസൂത്രത്തിന്റെ ശക്തമായ ‘മുറിച്ചുനീക്കൽ’ രൂപകം സംരക്ഷിക്കുന്നു; പുറത്താക്കലാണോ മരണമാണോ എന്ന് മുഖ്യവാചകം തീരുമാനിക്കുന്നില്ല.
- source_word: מֵעַמֶּיהָ
  choice: തന്റെ ജനത്തിൽനിന്ന്
  rationale: വ്യാകരണസ്ത്രീലിംഗമായ נֶפֶשׁ മൂലമുള്ള പ്രത്യയത്തെ ജൈവലിംഗമായി അവതരിപ്പിക്കാതെ, പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ എന്ന ശിക്ഷാസൂത്രത്തിന്റെ അർഥം
  choice: തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടണം
  alternative: തന്റെ ജനത്തിൽനിന്ന് പുറത്താക്കപ്പെടണം; അല്ലെങ്കിൽ മരിക്കണം/വധിക്കപ്പെടണം
  rationale: ഈ സൂത്രം ഉടമ്പടിസമൂഹത്തിൽനിന്നുള്ള കടുത്ത നീക്കം സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ നടപ്പാക്കൽരീതി ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മുഖ്യവാചകം രൂപകം നിലനിർത്തുകയും സാധ്യതകൾ അടിക്കുറിപ്പിൽ മാത്രം പറയുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ‘യഹോവ’ എന്ന ദൈവനാമവും ‘സമാധാനയാഗം’ എന്ന തിരിച്ചറിയാവുന്ന യാഗപദവും നിലനിർത്തി. മൂലത്തിലെ ആവർത്തനം (‘വ്യക്തി—ആ വ്യക്തി’) ശിക്ഷാവിധിയുടെ ഊന്നലിനായി സംരക്ഷിച്ചു.
