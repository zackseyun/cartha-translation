id: LEV.5.12
reference: Leviticus 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: ml
  text: അവൻ അത് പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം; പുരോഹിതൻ അതിൽനിന്ന് ഒരു കൈപ്പിടി നിറയെ, അതിന്റെ സ്മാരകാംശം, എടുത്ത് യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണങ്ങൾക്കുമേൽ യാഗപീഠത്തിൽ ദഹിപ്പിക്കണം. അത് പാപയാഗമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുദ്ധീകരണയാഗം.” എബ്രായപദം പാപവുമായി ബന്ധപ്പെട്ട അശുദ്ധി നീക്കുന്നതിനുള്ള യാഗത്തെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: അവൻ അത് കൊണ്ടുവരണം
  rationale: ഹിഫീൽ രൂപവും സ്ത്രീലിംഗ ഏകവചന പ്രത്യയവും മുൻസന്ദർഭത്തിലെ മാവിനെയോ വഴിപാടിനെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അത്’ എന്നു നൽകി.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: തന്റെ കൈയിൽ കൊള്ളുന്നത്ര എടുത്ത്
  rationale: പുരോഹിതൻ കൈകൊണ്ട് എടുക്കുന്ന നിർദിഷ്ട യാഗാംശത്തെ സൂചിപ്പിക്കുന്ന ആചാരസാങ്കേതിക പ്രയോഗം; അക്ഷരാർഥമായ ‘മുഷ്ടിയുടെ നിറവ്’ എന്നതിനെക്കാൾ വ്യക്തവും സ്വാഭാവികവും.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: അതിന്റെ സ്മാരകാംശമായി
  rationale: യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന പ്രതിനിധിയായ ധാന്യയാഗാംശം എന്ന സാങ്കേതിക അർഥം നിലനിർത്തുന്നു.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിൽ ദഹിപ്പിക്കണം
  rationale: קטר എന്ന ക്രിയയുടെ യാഗസന്ദർഭത്തിലെ അർഥം പുക ഉയരുന്നവിധം യാഗമായി ദഹിപ്പിക്കുക എന്നതാണ്; മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായ രൂപം.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: യഹോവയ്ക്കുള്ള ദഹനയാഗങ്ങളുടെമേൽ
  rationale: על എന്നതിന്റെ സ്ഥാനബന്ധവും אִשֶּׁה എന്ന യാഗസാങ്കേതിക പദത്തിന്റെ അഗ്നിയിൽ ദഹിപ്പിക്കുന്ന വഴിപാട് എന്ന ആശയവും സംരക്ഷിക്കുന്നു; ‘ഭക്ഷണയാഗങ്ങൾ’ എന്ന് അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: חַטָּאת הִוא
  choice: അത് പാപയാഗമാണ്
  rationale: ഇവിടെ חטאת യാഗത്തിന്റെ വർഗീകരണം സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിൽ തിരിച്ചറിയാവുന്ന പരമ്പരാഗതവും സുതാര്യവുമായ സമതുല്യം.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ അർഥം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: സന്ദർഭത്തിൽ ഇത് യാഗത്തിന്റെ വർഗനാമമാണ്. ‘പാപയാഗം’ എന്നത് മുഖ്യവാചകത്തിൽ പരിചിതവും സുതാര്യവുമാണ്; എന്നാൽ പാപം മൂലമുണ്ടാകുന്ന അശുദ്ധി നീക്കുന്ന കർമത്തെ പദം സൂചിപ്പിക്കാമെന്ന പ്രധാന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി. ആചാരസാങ്കേതിക പദങ്ങളിൽ ആവശ്യമായ കൃത്യത നിലനിർത്തിക്കൊണ്ട് അമിതമായ അക്ഷരാർഥത ഒഴിവാക്കി. മുഖ്യവാചകത്തിലെ [a] അടിക്കുറിപ്പുചിഹ്നം ബന്ധപ്പെട്ട ‘പാപയാഗം’ എന്ന പദപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
