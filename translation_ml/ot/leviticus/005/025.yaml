id: LEV.5.25
reference: Leviticus 5:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת אֲשָׁמ֥/וֹ יָבִ֖יא לַ/יהוָ֑ה אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: ml
  text: അവൻ യഹ്‌വെയ്ക്ക് തന്റെ കുറ്റപരിഹാരയാഗം[a]—നിന്റെ മൂല്യനിർണയപ്രകാരം, ആട്ടിൻകൂട്ടത്തിൽനിന്നുള്ള ഊനമില്ലാത്ത ഒരു ആൺചെമ്മരിയാടിനെ, കുറ്റപരിഹാരയാഗമായി—പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുറ്റപരിഹാരയാഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം കുറ്റത്തെയോ നഷ്ടപരിഹാരത്തെയോ അതിനായുള്ള പ്രത്യേക യാഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: തന്റെ കുറ്റപരിഹാരയാഗം / കുറ്റപരിഹാരയാഗമായി
  rationale: אָשָׁם കുറ്റം, പരിഹാരം, അതിനായുള്ള പ്രത്യേക യാഗം എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥങ്ങൾ വഹിക്കുന്നു. ഈ യാഗനിയമസന്ദർഭത്തിൽ ‘കുറ്റപരിഹാരയാഗം’ കുറ്റവും പരിഹാരവും യാഗവിഭാഗവും ഒരുമിച്ച് സൂചിപ്പിക്കുകയും, മൂലപാഠത്തിലെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יָבִיא
  choice: കൊണ്ടുവരണം
  rationale: നിയമനിർദേശത്തിലെ ഹിഫ്ഇൽ അപൂർണക്രിയയുടെ നിർബന്ധസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്കു
  rationale: ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു.
- source_word: אַיִל תָּמִים
  choice: ഊനമില്ലാത്ത ഒരു ആൺചെമ്മരിയാട്
  rationale: אַיִל ആൺചെമ്മരിയാടിനെയും תָּמִים യാഗത്തിന് അയോഗ്യമാക്കുന്ന ദേഹവൈകല്യമോ ഊനമോ ഇല്ലാത്ത അവസ്ഥയെയും സൂചിപ്പിക്കുന്നു.
- source_word: מִן הַצֹּאן
  choice: ആട്ടിൻകൂട്ടത്തിൽനിന്നുള്ള
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലിക്കൂട്ടത്തെ സൂചിപ്പിക്കാം; എന്നാൽ אַיִל മൃഗത്തെ ആൺചെമ്മരിയാടായി ഇതിനകം നിർണ്ണയിക്കുന്നു.
- source_word: בְּעֶרְכְּךָ
  choice: നിന്റെ മതിപ്പനുസരിച്ച്
  rationale: രണ്ടാംപുരുഷ ഏകവചനപ്രത്യയം നിലനിർത്തിക്കൊണ്ട് നിയമപരമായ മൂല്യനിർണ്ണയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל הַכֹּהֵן
  choice: പുരോഹിതന്റെ അടുക്കൽ
  rationale: യാഗമൃഗം ഔദ്യോഗികമായി പുരോഹിതന്റെ അടുത്തേക്ക് കൊണ്ടുവരുന്നതെന്ന ദിശാഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധ്യതയേറിയ ഉച്ചാരണത്തെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്യുന്നു.
- issue: אָשָׁם എന്ന പദത്തിന്റെ ഇരട്ട പ്രയോഗം
  choice: രണ്ടിടത്തും ‘കുറ്റപരിഹാരയാഗം’
  alternative: ആദ്യത്തേത് ‘പരിഹാരം’, രണ്ടാമത്തേത് ‘കുറ്റയാഗം’
  rationale: രണ്ടിടത്തും ഒരേ എബ്രായപദമാണെന്നത് വായനക്കാരന് ദൃശ്യമാക്കുന്നു; അതേസമയം ‘കുറ്റപരിഹാരം’ എന്ന സംയുക്തരൂപം കുറ്റബോധവും നഷ്ടപരിഹാരസ്വഭാവവും പ്രത്യേക യാഗവിഭാഗവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തി പൂർണമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആരാധനാഭാഷ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ אָשָׁם എന്ന പദത്തിന്റെ ആവർത്തനവും അർഥവ്യാപ്തിയും നിലനിർത്തി; ‘ഊനമില്ലാത്ത’ എന്നത് യാഗമൃഗത്തിന്റെ അംഗീകാര്യാവസ്ഥ സ്വാഭാവികമായി അറിയിക്കുന്നു.
