source:
  edition: WLC
  text: וְ/הָיָ֥ה כִֽי יֶאְשַׁ֖ם לְ/אַחַ֣ת מֵ/אֵ֑לֶּה וְ/הִ֨תְוַדָּ֔ה אֲשֶׁ֥ר חָטָ֖א עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/005.yaml
  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: ml
  text: ഈ കാര്യങ്ങളിൽ ഏതെങ്കിലും ഒന്നിൽ ഒരാൾ കുറ്റക്കാരനായിത്തീരുമ്പോൾ[a], താൻ അതിൽ ചെയ്ത പാപം ഏറ്റുപറയണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുറ്റബാധ്യത വരുമ്പോൾ’ അല്ലെങ്കിൽ ‘കുറ്റക്കാരനായിരിക്കുമ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ വെറും ഉള്ളിലെ കുറ്റബോധത്തേക്കാൾ നിയമപരമായ കുറ്റസ്ഥിതിക്കും ബാധ്യതയ്ക്കുമാണ് ഊന്നൽ നൽകുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘താൻ അതിനെ സംബന്ധിച്ച് പാപം ചെയ്തതു ഏറ്റുപറയണം.’ ‘അതിൽ’ എന്നത് മുമ്പ് പറഞ്ഞ സംഭവങ്ങളിൽ ഒന്നിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …ആയിത്തീരുമ്പോൾ
  rationale: നിയമവാക്യത്തിലെ സാഹചര്യം അവതരിപ്പിക്കുന്ന സൂത്രപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; כִּי ഇവിടെ വെറും സാങ്കൽപ്പികമായ ‘എങ്കിൽ’ എന്നതിലുപരി സംഭവിക്കുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്നു.
- source_word: יֶאְשַׁם
  choice: കുറ്റക്കാരനായിത്തീരുമ്പോൾ
  rationale: ഈ ക്രിയ നിയമപരമായ കുറ്റവും അതിനോടു ബന്ധപ്പെട്ട ബാധ്യതയും സൂചിപ്പിക്കുന്നു; കുറ്റബോധം മനസ്സിലാകുന്നതായി മാത്രം വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: ഈ കാര്യങ്ങളിൽ ഏതെങ്കിലും ഒന്നിൽ
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ സംഭവങ്ങളിൽ ഒന്നിനെ സൂചിപ്പിക്കുന്ന പരാമർശം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וְהִתְוַדָּה
  choice: ഏറ്റുപറയണം
  rationale: Hitpael രൂപം ഇവിടെ പാപം സമ്മതിച്ചുപറയുന്നതിനെ സൂചിപ്പിക്കുന്നു; നിയമപരമായ നിർദേശം മലയാളത്തിലെ ‘ണം’ രൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר חָטָא עָלֶיהָ
  choice: താൻ അതിൽ ചെയ്ത പാപം
  rationale: അവൻ പാപം ചെയ്ത കാര്യം ഏറ്റുപറയണമെന്ന അർഥവും עָלֶיהָ എന്ന ബന്ധസൂചക സർവനാമം മുൻപറഞ്ഞ കാര്യത്തിലേക്കു മടങ്ങുന്നതും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יֶאְשַׁם എന്നതിന്റെ അർഥം
  choice: നിയമപരമായി കുറ്റക്കാരനായിത്തീരുക
  alternative: തന്റെ കുറ്റം തിരിച്ചറിയുക
  rationale: ഹീബ്രു ക്രിയയുടെ പ്രാഥമിക ഊന്നൽ കുറ്റം തിരിച്ചറിയുന്ന ആന്തരിക അനുഭവത്തിലല്ല, കുറ്റസ്ഥിതിയിലും ബാധ്യതയിലുമാണ്; തിരിച്ചറിവ് സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ഹീബ്രുവിലെ സൂത്രപ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമായി നീട്ടാതെ സാഹചര്യവാക്യമായി നൽകി; കുറ്റത്തിന്റെ നിയമപരമായ ഭാവവും അവസാനത്തെ ബന്ധസൂചകവും അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
