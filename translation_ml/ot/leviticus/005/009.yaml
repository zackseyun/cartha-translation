  terminology: «പാപയാഗം» is a suitable consistent rendering of חַטָּאת in the main text. The footnote appropriately preserves ‘ശുദ്ധീകരണയാഗം’ as a legitimate lexical alternative without forcing a disputed nuance into the text.
