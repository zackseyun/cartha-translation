source:
  edition: WLC
  text: וְ/הִזָּ֞ה מִ/דַּ֤ם הַ/חַטָּאת֙ עַל קִ֣יר הַ/מִּזְבֵּ֔חַ וְ/הַ/נִּשְׁאָ֣ר בַּ/דָּ֔ם יִמָּצֵ֖ה אֶל יְס֣וֹד הַ/מִּזְבֵּ֑חַ חַטָּ֖את הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: ml
  text: അവൻ പാപയാഗത്തിന്റെ രക്തത്തിൽനിന്ന് കുറച്ച് യാഗപീഠത്തിന്റെ വശത്ത് തളിക്കണം[a]. ശേഷിക്കുന്ന രക്തം യാഗപീഠത്തിന്റെ അടിത്തറയിലേക്കു പിഴിഞ്ഞൊഴിക്കണം. അത് പാപയാഗമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ രണ്ടിടത്തുമുള്ള “പാപയാഗം” എന്നതിന് “ശുദ്ധീകരണയാഗം” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദമായ חַטָּאת പാപത്തിനായുള്ള യാഗത്തെ, അതിന്റെ ശുദ്ധീകരണധർമ്മത്തിന് ഊന്നൽ നൽകി, സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: തളിക്കണം
  rationale: നזה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗകർമത്തിൽ രക്തം ആചാരപരമായി തളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִדַּם
  choice: രക്തത്തിൽ കുറച്ച്
  rationale: מִן ഇവിടെ ഭാഗിക അർഥത്തിലാണ്; ഈ ഘട്ടത്തിൽ രക്തം മുഴുവനുമല്ല, അതിൽ ഒരു ഭാഗമാണ് പ്രയോഗിക്കുന്നത്.
- source_word: הַחַטָּאת
  choice: പാപയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ חַטָּאת പാപവുമായി ബന്ധപ്പെട്ട യാഗവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പരിചിതമായ 'പാപയാഗം' മുഖ്യപാഠത്തിൽ നിലനിർത്തി, ശുദ്ധീകരണധ്വനി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ പാർശ്വത്തിൽ
  rationale: קִיר അക്ഷരാർഥത്തിൽ മതിൽ/വശം എന്നാണ്; യാഗപീഠത്തെക്കുറിച്ച് മലയാളത്തിൽ 'പാർശ്വം' ഭൗതിക ഉപരിതലത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: ശേഷിക്കുന്ന രക്തം
  rationale: ശׁאר എന്ന ധാതുവിന്റെ നിഫാൽ കൃദന്തരൂപം ശേഷിച്ചിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: יִמָּצֶה
  choice: പിഴിഞ്ഞൊഴിക്കണം
  rationale: מצהയുടെ നിഫാൽ രൂപം ശേഷിച്ച രക്തം ഞെക്കി/പിഴിഞ്ഞ് പുറത്താക്കുന്ന പ്രത്യേക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; വെറും 'ഒഴിക്കുക' എന്നതിനെക്കാൾ ക്രിയയുടെ ഭാവം നന്നായി നിലനിർത്തുന്നു.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ ചുവട്ടിലേക്ക്
  rationale: יְסוֹד യാഗപീഠത്തിന്റെ അടിഭാഗത്തെയോ അടിസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; 'ചുവട്' സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: חַטָּאת הוּא
  choice: അത് പാപയാഗമാണ്
  rationale: ഈ വാക്യം യാഗത്തെ അതിന്റെ വിഭാഗമായി തിരിച്ചറിയുന്നു; ആദ്യപ്രയോഗത്തോടുള്ള പദസാമ്യം നിലനിർത്തിയിരിക്കുന്നു.
theological_decisions:
- issue: യാഗനിയമത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ എബ്രായപദം പാപവുമായുള്ള ബന്ധത്തെയും ആചാരപരമായ ശുദ്ധീകരണഫലത്തെയും സൂചിപ്പിക്കാം. പരിചിതവും സന്ദർഭത്തിൽ കൃത്യവുമായ 'പാപയാഗം' മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിലൂടെ ദൃശ്യമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാഗകർമത്തിന്റെ ഭൗതിക പ്രവർത്തനങ്ങൾ കൃത്യമായി നിലനിർത്തിക്കൊണ്ട് അനാവശ്യ സാങ്കേതികഭാഷ ഒഴിവാക്കി.
