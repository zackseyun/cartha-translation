  - severity: low
    issue: Rendering of the altar’s base
    rationale: «ചുവട്ടിലേക്ക്» can suggest the area underneath the altar, whereas יְסוֹד denotes its base/foundation. «അടിത്തറയിലേക്കു» is more precise.
