  source_fidelity: The draft accurately represents the partitive application of blood, the altar's side, the draining/squeezing out of the remainder, and the final classification as a חַטָּאת offering. However, «രക്തത്തിൽ കുറച്ച്» can mean ‘a little in the blood’ rather than the required partitive ‘some of the blood’; «രക്തത്തിൽനിന്ന് കുറച്ച്» makes the source sense explicit. «അടിത്തറയിലേക്കു» is more precise than «ചുവട്ടിലേക്ക്» for יְסוֹד, the altar’s base/foundation.
