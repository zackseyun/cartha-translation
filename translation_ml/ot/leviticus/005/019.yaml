lexical_decisions:
- source_word: אָשָׁם
  choice: കുറ്റപരിഹാരയാഗം
  rationale: യാഗസന്ദർഭത്തിൽ ഈ നാമം കുറ്റം നിമിത്തം അർപ്പിക്കുന്ന പ്രത്യേക യാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘കുറ്റപരിഹാരയാഗം’ എന്നത് കുറ്റവും അതിനുള്ള പരിഹാരപരമായ യാഗവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הוּא
  choice: അത് ... ആണ്
  rationale: മുൻപറഞ്ഞ യാഗത്തെ തിരിച്ചറിയിക്കുന്ന വിധേയപ്രയോഗമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ നാമവാക്യമായി വിവർത്തനം ചെയ്തു.
- source_word: אָשֹׁם אָשַׁם
  choice: തീർച്ചയായും കുറ്റം ചെയ്തിരിക്കുന്നു
  rationale: ഒരേ ധാതുവിലുള്ള അനന്തക്രിയയും സമാപികാക്രിയയും ചേർന്ന പ്രയോഗം ശക്തമായ ഊന്നൽ നൽകുന്നു. ‘തീർച്ചയായും’ ആ ഊന്നൽ വ്യക്തമാക്കുന്നു; ‘കുറ്റം ചെയ്തിരിക്കുന്നു’ ഉത്തരവാദിത്വവും കുറ്റാവസ്ഥയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയോടു
  rationale: אשם എന്ന ക്രിയയോടൊപ്പം ל എന്ന ഉപസർഗം യഹോവയുമായി ബന്ധപ്പെട്ട കുറ്റബാധ്യതയെ സൂചിപ്പിക്കുന്നു. ‘യഹോവയോടു’ എന്നത് ‘യഹോവയ്ക്കു മുമ്പാകെ’ എന്നും ‘യഹോവയ്ക്കെതിരെ’ എന്നും ഗ്രഹിക്കാവുന്ന മൂലപാഠത്തിലെ ബന്ധപരമായ വിസ്താരം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: יהוה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രഗ്രാമറ്റണിനെ മലയാളത്തിൽ വ്യാപകവും തിരിച്ചറിയാവുന്നതുമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: לַיהוָה എന്ന അവസാനപ്രയോഗം אשם എന്ന ക്രിയയുമായി എങ്ങനെ ബന്ധപ്പെടുന്നു
  choice: കുറ്റം യഹോവയുമായുള്ള ബന്ധത്തിൽ സംഭവിച്ചതായി ‘യഹോവയോടു’ എന്നു നൽകി.
  alternative: ‘യഹോവയ്ക്കെതിരെ’ അല്ലെങ്കിൽ ‘യഹോവയുടെ മുമ്പാകെ’; മറ്റൊരു സാധ്യതയായി യാഗം ‘യഹോവയ്ക്കുള്ള കുറ്റപരിഹാരയാഗം’ എന്നു ബന്ധിപ്പിക്കാം.
  rationale: മസോററ്റിക് പാഠത്തിലെ വാക്യക്രമം לַיהוָה എന്നതിനെ അവസാനത്തെ ക്രിയാവാക്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു. എന്നാൽ ל എന്ന ഉപസർഗത്തിന്റെ അർത്ഥം ‘എതിരെ’ എന്നു മാത്രം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ ബന്ധപരമായ അസ്പഷ്ടത നിലനിർത്തുന്ന ‘യഹോവയോടു’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാ-നിയമഭാഷ. എബ്രായത്തിലെ ധാതുപുനരാവർത്തനം പദശഃ അനുകരിക്കാതെ ‘തീർച്ചയായും’ എന്ന ഊന്നൽപദത്തിലൂടെ പകർന്നു; അടിക്കുറിപ്പിൽ മൂലഭാഷയുടെ സവിശേഷത വ്യക്തമാക്കി.
