  source_fidelity: 'അർഥം മിക്കവാറും മൂലത്തോട് വിശ്വസ്തമാണ്: സാമ്പത്തിക അശക്തിക്കായുള്ള ഇളവ്, പക്ഷികളുടെ ഇനങ്ങൾ, ഏഫായുടെ പത്തിലൊന്ന്, എണ്ണയും കുന്തിരിക്കവും ഒഴിവാക്കൽ, പാപയാഗത്തിന്റെ വർഗ്ഗീകരണം എന്നിവ നിലനിൽക്കുന്നു. എന്നാൽ ‘കഴിവ് എത്തുന്നില്ല’ സാമ്പത്തികസന്ദർഭത്തിൽ സ്വാഭാവികമല്ല; ‘നേരിയ മാവ്’ സോലെത്തിന്റെ ‘fine flour’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നില്ല.'
  naturalness: ‘അർപ്പിക്കാനുള്ള സാമ്പത്തികശേഷി അയാൾക്കില്ലെങ്കിൽ’ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘നേർത്ത മാവ്’ ‘നേരിയ മാവി’നേക്കാൾ യോജിച്ചതാണ്. അവസാനത്തെ രണ്ടു നിരോധനങ്ങളും സമാന്തരമായി ലളിതമായി നൽകാം.
