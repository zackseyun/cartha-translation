source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: ml
  text: എന്നാൽ, രണ്ടു കുറുപ്രാവുകളെയോ രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങളെയോ അർപ്പിക്കാനുള്ള സാമ്പത്തികശേഷി അയാൾക്കില്ലെങ്കിൽ[a], താൻ ചെയ്ത പാപത്തിനുവേണ്ടിയുള്ള തന്റെ വഴിപാടായി ഒരു ഏഫായുടെ പത്തിലൊന്ന് നേർത്ത മാവ് പാപയാഗമായി കൊണ്ടുവരണം. അതിന്മേൽ എണ്ണ ഒഴിക്കരുത്; അതിന്മേൽ കുന്തിരിക്കം ഇടുകയും അരുത്. കാരണം, അതു പാപയാഗമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അയാളുടെ കൈ എത്തുന്നില്ലെങ്കിൽ”—മതിയായ സാമ്പത്തികശേഷി ഇല്ലെന്നർഥമുള്ള എബ്രായ പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: അയാളുടെ കഴിവ് എത്തുന്നില്ലെങ്കിൽ
  rationale: ‘കൈ എത്തുന്നില്ല’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ സാമ്പത്തികശേഷി പോരെന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് മൂലപ്രയോഗത്തിലെ ‘എത്തുക’ എന്ന രൂപകത്തിന്റെ ഒരു ഭാഗം സൂക്ഷിക്കുന്നു.
- source_word: תֹרִים
  choice: കുറുപ്രാവുകൾ
  rationale: യാഗസന്ദർഭത്തിലെ പ്രത്യേക പക്ഷിവർഗമായ turtledoves-നെ പൊതുവായ ‘പ്രാവുകൾ’ എന്നതിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: בְנֵי יוֹנָה
  choice: പ്രാവിൻകുഞ്ഞുങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘പ്രാവിന്റെ മക്കൾ’; പ്രായസൂചന വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: קָרְבָּנוֹ
  choice: വഴിപാട്
  rationale: അർപ്പിക്കാനായി കൊണ്ടുവരുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പൊതുവായ യാഗപദം; ഇവിടെ മാവും ഉൾപ്പെടുന്നതിനാൽ ‘ബലി’യെക്കാൾ വിശാലമാണ്.
- source_word: אֲשֶׁר חָטָא
  choice: താൻ ചെയ്ത പാപത്തിനുള്ള
  rationale: കുറ്റവും വഴിപാടും തമ്മിലുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: ഒരു ഏഫായുടെ പത്തിലൊന്ന്
  rationale: പുരാതന അളവായ ഏഫാ ഏകദേശ ആധുനിക അളവാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗങ്ങൾക്കുപയോഗിച്ച നന്നായി അരിച്ചോ പൊടിച്ചോ തയ്യാറാക്കിയ ഉന്നതഗുണമുള്ള മാവിനെ ലളിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗമായി
  rationale: ഇവിടെ חַטָּאת പാപത്തെയല്ല, അർപ്പിക്കുന്ന യാഗവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: അതിന്മേൽ എണ്ണ ഒഴിക്കരുത്
  rationale: മാവിന്മേൽ എണ്ണ ചേർക്കുന്നതിനുള്ള നേരിട്ടുള്ള വിലക്ക് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: കുന്തിരിക്കം വയ്ക്കുകയും അരുത്
  rationale: לְבֹנָה എന്ന യാഗസുഗന്ധദ്രവ്യത്തിന് പ്രചാരത്തിലുള്ള മലയാളപദമായ ‘കുന്തിരിക്കം’ ഉപയോഗിക്കുന്നു.
- source_word: כִּי חַטָּאת הִיא
  choice: കാരണം, അതു പാപയാഗമാണ്
  rationale: എണ്ണയും കുന്തിരിക്കവും ഒഴിവാക്കാനുള്ള കാരണം ഈ വഴിപാടിന്റെ യാഗവിഭാഗമാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യാഗനിയമസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ അർഥം
  choice: പാപയാഗം
  alternative: പാപം
  rationale: വാക്യഘടനയും മാവിനെക്കുറിച്ചുള്ള ആചാരനിർദേശങ്ങളും ഇവിടെ അർപ്പണവസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ പിൽക്കാല സിദ്ധാന്തവിഭാഗങ്ങൾ ചേർക്കാതെ ആചാരപരമായ അർഥം നിലനിർത്തുന്നു.
- issue: ദാരിദ്ര്യത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: അയാളുടെ കഴിവ് എത്തുന്നില്ലെങ്കിൽ
  alternative: അയാൾക്ക് വാങ്ങാൻ കഴിയുന്നില്ലെങ്കിൽ
  rationale: നിയമത്തിലെ സാമ്പത്തിക ഇളവ് വ്യക്തമാക്കുമ്പോഴും, മൂലത്തിലെ ‘കൈ എത്തുക’ എന്ന പ്രയോഗത്തിന്റെ രൂപകാത്മക സ്വരം ഭാഗികമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമഭാഷ. ‘അയാൾ’ എന്ന ലിംഗനിരപേക്ഷ ഏകവചനരൂപം ഉപയോഗിച്ചു; പുരാതന അളവായ ‘ഏഫാ’ മാറ്റമില്ലാതെ നിലനിർത്തി.
