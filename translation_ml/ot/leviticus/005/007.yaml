source:
  edition: WLC
  text: וְ/אִם לֹ֨א תַגִּ֣יע יָד/וֹ֮ דֵּ֣י שֶׂה֒ וְ/הֵבִ֨יא אֶת אֲשָׁמ֜/וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ שְׁנֵ֥י בְנֵֽי יוֹנָ֖ה לַֽ/יהוָ֑ה אֶחָ֥ד לְ/חַטָּ֖את וְ/אֶחָ֥ד לְ/עֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: ml
  text: എന്നാൽ ഒരു ചെമ്മരിയാടിനെ നൽകാൻ അവനു കഴിവില്ലെങ്കിൽ, താൻ ചെയ്ത പാപത്തിനുള്ള തന്റെ കുറ്റയാഗമായി രണ്ട് കുറുപ്രാവുകളെയോ രണ്ട് പ്രാവിൻകുഞ്ഞുങ്ങളെയോ യഹോവയ്ക്കു കൊണ്ടുവരണം—ഒന്ന് പാപയാഗമായും[a] മറ്റൊന്ന് ഹോമയാഗമായും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശുദ്ധീകരണയാഗമായി.’ ഹീബ്രുവിലെ חַטָּאת എന്ന പദം ‘പാപം’ എന്നോ, യാഗസന്ദർഭങ്ങളിൽ പാപമോ അശുദ്ധിയോ നീക്കുന്നതുമായി ബന്ധപ്പെട്ട യാഗം എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: ഒരു ചെമ്മരിയാടിനെ നൽകാൻ അവനു കഴിവില്ലെങ്കിൽ
  rationale: ‘അവന്റെ കൈ എത്തുന്നില്ല’ എന്ന ഹീബ്രു പ്രയോഗം സാമ്പത്തികശേഷിയില്ലായ്മയെ സൂചിപ്പിക്കുന്നു. അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വാങ്ങാൻ കഴിയില്ല’ എന്നതിനെക്കാൾ യാഗത്തിനായി നൽകുക എന്ന സന്ദർഭത്തിന് ഇത് യോജിക്കുന്നു.
- source_word: אֲשָׁמוֹ
  choice: തന്റെ കുറ്റയാഗമായി
  rationale: ആശാം എന്ന പദം കുറ്റത്തെയും അതുമായി ബന്ധപ്പെട്ട യാഗത്തെയും സൂചിപ്പിക്കാം; ഇവിടെ ‘കൊണ്ടുവരണം’ എന്ന ക്രിയയും യാഗനിയമസന്ദർഭവും യാഗവസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר חָטָא
  choice: താൻ ചെയ്ത പാപത്തിനുള്ള
  rationale: അവൻ പാപം ചെയ്ത കാര്യം ഈ യാഗവുമായി ബന്ധിപ്പിക്കുന്ന ഉപവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שְׁתֵּי תֹרִים
  choice: രണ്ട് കുറുപ്രാവുകൾ
  rationale: תֹר എന്ന പക്ഷിനാമത്തിന് മലയാളത്തിൽ മനസ്സിലാകുന്ന പരമ്പരാഗത സമാനപദം ഉപയോഗിക്കുന്നു.
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: രണ്ട് പ്രാവിൻകുഞ്ഞുങ്ങൾ
  rationale: അക്ഷരാർഥത്തിലെ ‘പ്രാവിന്റെ മക്കൾ’ എന്ന ഹീബ്രു പ്രയോഗം പ്രായം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമമായ יהוה നേരിട്ട് ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗമായി
  rationale: യാഗപരമായ സന്ദർഭത്തിലും עֹלָהയോടുള്ള ജോടിയിലും പദം ഒരു യാഗത്തെ സൂചിപ്പിക്കുന്നു. പതിവായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച് ‘ശുദ്ധീകരണയാഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְעֹלָה
  choice: ഹോമയാഗമായി
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന עֹלָה യാഗത്തിനുള്ള മലയാളത്തിലെ സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പദമാണ് ‘ഹോമയാഗം’.
theological_decisions:
- issue: חַטָּאת എന്ന യാഗപദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: നിയമപരവും യാഗപരവുമായ ഈ സന്ദർഭത്തിൽ പരമ്പരാഗതമായ ‘പാപയാഗം’ വ്യക്തമാണ്. എന്നാൽ പദം പാപമോ അശുദ്ധിയോ നീക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കാമെന്ന യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമ-യാഗഭാഷ. ഹീബ്രു വാക്യത്തിന്റെ നിബന്ധനയും യാഗങ്ങളുടെ ക്രമവും നിലനിർത്തി; സാങ്കേതിക യാഗപദങ്ങൾക്ക് പരിചിതമായ മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചു.
