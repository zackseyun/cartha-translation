  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: ml
  text: ഒരാൾ പാപം ചെയ്യുകയും യഹോവയോടു വിശ്വാസവഞ്ചന പ്രവർത്തിക്കുകയും, തന്റെ കൂട്ടുകാരനോട് സൂക്ഷിപ്പിനായി ഏൽപ്പിച്ച വസ്തുവിന്റെ കാര്യത്തിലോ, കൈയിൽ ഏൽപ്പിച്ച വസ്തുവിന്റെ കാര്യത്തിലോ[a], കവർച്ചയിലൂടെയോ വ്യാജമായി ഇടപെടുകയോ, അല്ലെങ്കിൽ തന്റെ കൂട്ടുകാരനെ ചൂഷണം ചെയ്യുകയോ ചെയ്താൽ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പണയവസ്തുവിന്റെ കാര്യത്തിലോ”; എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “കൈയിൽ വെച്ചതിന്റെ കാര്യത്തിലോ” എന്നാണ്.'
    reason: തְשׂוּמֶת יָד എന്ന നിയമപ്രയോഗത്തിന്റെ കൃത്യമായ അർത്ഥം അനിശ്ചിതമാണ്; ‘പണയവസ്തു’ എന്ന സാധ്യതയും അക്ഷരാർഥവും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ഒരാൾ
  rationale: നിയമസന്ദർഭത്തിൽ ഈ പദം വ്യക്തിയായ ഒരാളെ സൂചിപ്പിക്കുന്നു; ‘ആത്മാവ്’ എന്നതിനെക്കാൾ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כִּי תֶחֱטָא
  choice: പാപം ചെയ്യുകയാണെങ്കിൽ
  rationale: כִּיയും അപൂർണക്രിയയും ചേർന്ന് ഇവിടെ നിബന്ധനാപരമായ നിയമവാക്യം ആരംഭിക്കുന്നു.
- source_word: וּמָעֲלָה מַעַל בַּיהוָה
  choice: യഹോവയോടു വിശ്വാസവഞ്ചന കാണിക്കുകയും ചെയ്താൽ
  rationale: സജാതീയ ക്രിയാനാമപ്രയോഗത്തിന്റെ ശക്തിയും, മനുഷ്യനോടുള്ള അനീതിയെ യഹോവയോടുള്ള അവിശ്വസ്തതയായി അവതരിപ്പിക്കുന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: וְכִחֵשׁ בַּעֲמִיתוֹ
  choice: തന്റെ കൂട്ടുകാരനോടു കള്ളം പറയുക
  rationale: כחש ഇവിടെ നിഷേധിച്ചുപറയുകയോ വ്യാജമായി ഇടപെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; പട്ടികയിലെ സ്വത്തുസംബന്ധമായ വിഷയങ്ങളോട് സ്വാഭാവികമായി ചേരുന്നു.
- source_word: בְּפִקָּדוֹן
  choice: തന്നെ ഏൽപ്പിച്ച സൂക്ഷിപ്പുവസ്തു
  rationale: സൂക്ഷിച്ചുകൊള്ളാൻ ഏൽപ്പിച്ച സ്വത്താണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בִתְשׂוּמֶת יָד
  choice: തന്റെ കൈയിൽ ഏൽപ്പിച്ച മറ്റെന്തെങ്കിലും
  rationale: അക്ഷരാർഥത്തിലെ ‘കൈയിൽ വെച്ചത്’ എന്ന ആശയം നിലനിർത്തുന്നു; ഇതിന്റെ കൃത്യമായ നിയമസാങ്കേതിക അർത്ഥം അനിശ്ചിതമായതിനാൽ പൊതുവായ വിവർത്തനം സ്വീകരിച്ചു.
- source_word: בְגָזֵל
  choice: കവർച്ച
  rationale: ബലമായി കൈക്കലാക്കുന്നതോ അങ്ങനെ എടുത്ത വസ്തുവോ എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: തന്റെ കൂട്ടുകാരനെ ചൂഷണം ചെയ്യുക
  rationale: സാമ്പത്തികമായി ഞെരുക്കുക, അവകാശം തടഞ്ഞുവെക്കുക, അന്യായമായി പ്രയോജനപ്പെടുത്തുക എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാല അർത്ഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സാമൂഹികമോ സാമ്പത്തികമോ ആയ അനീതി ഒരേസമയം ദൈവത്തോടുള്ള പാപമാണെന്ന ആശയം
  choice: യഹോവയോടു വിശ്വാസവഞ്ചന
  alternative: യഹോവയുടെ കാര്യത്തിൽ അവിശ്വസ്തത
  rationale: എബ്രായപാഠം കൂട്ടുകാരനോടുള്ള വഞ്ചനയെ യഹോവയോടുള്ള വിശ്വാസവഞ്ചനയായി നേരിട്ട് അവതരിപ്പിക്കുന്നു; ഈ ലംബമായ ദൈവബന്ധം വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമവാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു; ആവർത്തനമുള്ള ബന്ധകങ്ങൾ വായനാസൗകര്യത്തിനായി ക്രമപ്പെടുത്തി.
