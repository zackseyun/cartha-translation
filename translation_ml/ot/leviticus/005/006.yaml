id: LEV.5.6
reference: Leviticus 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: ml
  text: 'താൻ ചെയ്ത പാപം നിമിത്തം അവൻ തന്റെ കുറ്റപരിഹാരയാഗം[a] യാഹ്‌വെയ്ക്ക് കൊണ്ടുവരണം: ആട്ടിൻപറ്റത്തിൽനിന്നുള്ള ഒരു പെൺമൃഗം, അതായത് ഒരു പെൺചെമ്മരിയാടോ ഒരു പെൺകോലാടോ, പാപയാഗമായി. പുരോഹിതൻ അവന്റെ പാപത്തിനായി അവനുവേണ്ടി പ്രായശ്ചിത്തം നടത്തണം.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുറ്റത്തിനുള്ള അവന്റെ വഴിപാട്’ എന്നോ ‘അവന്റെ പരിഹാരയാഗം’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ אשם കുറ്റത്തോടും പരിഹാരത്തോടും ബന്ധപ്പെട്ടതാണ്; എന്നാൽ വാക്യത്തിന്റെ തുടർന്നുള്ള ഭാഗത്ത് ഈ മൃഗത്തെ ‘പാപയാഗമായി’ അർപ്പിക്കണമെന്ന് പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവന്റെ പാപത്തിൽനിന്ന്.’ പ്രായശ്ചിത്തത്തിന്റെ ഫലമായി പാപത്തിൽനിന്നുള്ള മോചനത്തെ ഈ പ്രയോഗം ഊന്നിപ്പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: കൊണ്ടുവരണം
  rationale: നിയമനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲשָׁמוֹ
  choice: തന്റെ കുറ്റപരിഹാരയാഗമായി
  rationale: אשם എന്ന പദത്തിലെ കുറ്റം/പരിഹാരം എന്നീ ആശയങ്ങൾ നിലനിർത്തുകയും, തുടർന്ന് വരുന്ന ‘പാപയാഗം’ എന്ന വ്യത്യസ്ത ബലിപദവുമായി ഉള്ള പാഠത്തിലെ സംഘർഷം മായ്ച്ചുകളയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לַיהוָה
  choice: യാഹ്‌വെയ്ക്കു
  rationale: ദൈവനാമമായ יהוה പരിഭാഷപ്പെടുത്താതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: താൻ ചെയ്ത പാപം നിമിത്തം
  rationale: മൂലത്തിലെ പാപവും അതിന്റെ കാരണബന്ധവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: ആട്ടിൻപറ്റത്തിൽനിന്ന് ഒരു പെൺ...
  rationale: ചെറുകന്നുകാലികളുടെ കൂട്ടത്തിൽനിന്നുള്ള പെൺമൃഗം എന്ന നിർദേശം തുടർന്നുള്ള രണ്ട് ഇനങ്ങളോടൊപ്പം വ്യക്തമായി നൽകുന്നു.
- source_word: כִשְׂבָּה
  choice: ഒരു പെൺകുഞ്ഞാട്
  rationale: പദം സൂചിപ്പിക്കുന്ന പെൺചെമ്മരിയാട്ടിൻകുട്ടിയെ വ്യക്തമായി പറയുന്നു.
- source_word: אוֹ שְׂעִירַת עִזִּים
  choice: അല്ലെങ്കിൽ ഒരു പെൺകോലാട്
  rationale: മൃഗത്തിന്റെ ഇനവും പെൺലിംഗവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗമായി
  rationale: പുരോഹിതബലിയുടെ സാങ്കേതിക അർഥം നിലനിർത്തുന്ന, മലയാളവായനക്കാർക്ക് പരിചിതമായ പ്രയോഗം.
- source_word: וְכִפֶּר עָלָיו
  choice: അവനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പുരോഹിതൻ ആ വ്യക്തിക്കുവേണ്ടി നിർവഹിക്കുന്ന ബലിപരമായ പ്രായശ്ചിത്തക്രിയയെ ഒരു പ്രത്യേക സിദ്ധാന്തത്തിലേക്ക് ചുരുക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: מֵחַטָּאתוֹ
  choice: അവന്റെ പാപം നിമിത്തം
  rationale: מן എന്ന ഉപസർഗത്തിന്റെ ബന്ധം/കാരണം എന്ന സാധ്യത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പാപത്തിൽനിന്ന്’ എന്ന നീക്കത്തിന്റെ സൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഒരേ വാക്യത്തിൽ אשם, חטאת എന്നീ രണ്ടു ബലിപദങ്ങളുടെ ഉപയോഗം
  choice: אשם എന്നതിന് ‘കുറ്റപരിഹാരയാഗം’, חטאת എന്നതിന് ‘പാപയാഗം’ എന്ന് വ്യത്യസ്തമായി പരിഭാഷപ്പെടുത്തുക
  alternative: ആദ്യത്തേത് പൊതുവായി ‘കുറ്റത്തിനുള്ള വഴിപാട്’ എന്നോ രണ്ടാമത്തേത് ‘ശുദ്ധീകരണയാഗം’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  rationale: മൂലപാഠം രണ്ടു പദങ്ങളും ചേർത്തുപയോഗിക്കുന്നതിനാൽ അവയെ ഏകീകരിക്കാതെ അതിലെ യഥാർഥ പദവ്യത്യാസവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയായി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: כפר എന്ന പദത്തിന്റെ ബലിപരമായ അർഥം
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  alternative: ശുദ്ധീകരിക്കുക; പരിഹാരം വരുത്തുക
  rationale: ബലിക്രമത്തിലെ വിശാലമായ അർഥം നിലനിർത്തുകയും, പ്രായശ്ചിത്തത്തെക്കുറിച്ചുള്ള ഏതെങ്കിലും പിന്നീടുള്ള പ്രത്യേക സിദ്ധാന്തം പാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമനിർദേശശൈലി. ‘കുറ്റപരിഹാരയാഗം’, ‘പാപയാഗം’, ‘പ്രായശ്ചിത്തം’ എന്നീ ബലിപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഉപയോഗിച്ചു; മൂലത്തിലെ സാങ്കേതിക പദവ്യത്യാസം നിലനിർത്തി.
