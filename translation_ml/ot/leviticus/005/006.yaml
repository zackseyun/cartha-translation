revisions:
- from: താൻ ചെയ്ത പാപം നിമിത്തം അവൻ തന്റെ കുറ്റപരിഹാരയാഗമായി[a] ആട്ടിൻപറ്റത്തിൽനിന്ന് ഒരു പെൺകുഞ്ഞാടിനെയോ ഒരു പെൺകോലാടിനെയോ പാപയാഗമായി യാഹ്‌വെയ്ക്കു കൊണ്ടുവരണം. പുരോഹിതൻ അവന്റെ പാപം നിമിത്തം അവനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം.[b]
  to: 'താൻ ചെയ്ത പാപം നിമിത്തം അവൻ തന്റെ കുറ്റപരിഹാരയാഗം[a] യാഹ്‌വെയ്ക്ക് കൊണ്ടുവരണം: ആട്ടിൻപറ്റത്തിൽനിന്നുള്ള ഒരു പെൺമൃഗം, അതായത് ഒരു പെൺചെമ്മരിയാടോ ഒരു പെൺകോലാടോ, പാപയാഗമായി. പുരോഹിതൻ അവന്റെ പാപത്തിനായി അവനുവേണ്ടി പ്രായശ്ചിത്തം നടത്തണം.[b]'
  rationale: The revision clarifies the destination of the bringing action, renders the female sheep without an unwarranted age restriction, and retains every important lexical distinction and both footnote anchors. The final phrase remains idiomatic while the footnote preserves the literal ‘from his sin’ nuance of מֵחַטָּאתוֹ.
