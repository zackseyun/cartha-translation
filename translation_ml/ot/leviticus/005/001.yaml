  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: ml
  text: ഒരു വ്യക്തി പാപം ചെയ്യുകയും, സാക്ഷ്യം നൽകാൻ ആവശ്യപ്പെടുന്ന ശപഥപൂർവമായ ആഹ്വാനം[a] കേൾക്കുകയും, താൻ സാക്ഷിയായിരിക്കെ—അത് കണ്ടതുകൊണ്ടോ മറ്റുവിധത്തിൽ അറിഞ്ഞതുകൊണ്ടോ—അത് അറിയിക്കാതിരിക്കയും ചെയ്താൽ, അവൻ തന്റെ കുറ്റം വഹിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ശപഥത്തിന്റെ ശബ്ദം.’ ഇവിടെ സാക്ഷ്യമുള്ളവർ മൊഴി നൽകണമെന്ന് ശപഥപൂർവം ആവശ്യപ്പെടുന്ന ആഹ്വാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തന്റെ അകൃത്യം വഹിക്കണം.’ സാക്ഷ്യം നൽകാതിരിക്കുന്നതിന്റെ കുറ്റബാധ്യത അയാളിൽ നിലനിൽക്കുന്നു എന്നതാണ് എബ്രായ പ്രയോഗത്തിന്റെ ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ഒരാൾ
  rationale: നിയമസന്ദർഭത്തിൽ ‘വ്യക്തി’ എന്ന അർഥം നൽകുന്നു; ആത്മാവെന്ന തത്ത്വചിന്താപരമായ അർഥം അനാവശ്യമായി കൊണ്ടുവരാതെ സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: תֶחֱטָא
  choice: പാപം ചെയ്യുന്നത്
  rationale: ധാർമികവും നിയമപരവുമായ കുറ്റത്തിന്റെ ബലം നിലനിർത്തുന്നു; സന്ദർഭം അവതരിപ്പിക്കുന്ന ഉപവാക്യത്തോട് സ്വാഭാവികമായി ചേരുന്നു.
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: സാക്ഷ്യം പറയാൻ ആവശ്യപ്പെടുന്ന ശപഥവാക്ക് അയാൾ കേൾക്കുന്നു
  rationale: അക്ഷരാർഥമായ ‘ശപഥത്തിന്റെ ശബ്ദം’ മലയാളത്തിൽ അവ്യക്തമാണ്. നിയമസന്ദർഭത്തിലെ സാക്ഷ്യത്തിനായുള്ള ഗൗരവമായ ശപഥപൂർവ ആഹ്വാനം വ്യക്തമാക്കുമ്പോഴും ‘ശപഥവാക്ക്’ എന്ന മൂലപ്രതീകം നിലനിർത്തി.
- source_word: וְהוּא עֵד
  choice: അയാൾ അതിനു സാക്ഷിയുമാണ്
  rationale: വിഷയവുമായി ബന്ധപ്പെട്ട വ്യക്തിയുടെ നിയമപരമായ സാക്ഷിസ്ഥാനം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: അത് കണ്ടിട്ടോ മറ്റുവിധത്തിൽ അറിഞ്ഞിട്ടോ ഉള്ളവൻ
  rationale: നേരിട്ടു കണ്ട അറിവും മറ്റുവഴിയുള്ള അറിവും എന്ന രണ്ടു സാധ്യതകൾ വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: אִם לֹא יַגִּיד
  choice: അത് അറിയിക്കാതിരുന്നാൽ
  rationale: נגד എന്ന ക്രിയയുടെ ‘അറിയിക്കുക/വെളിപ്പെടുത്തുക’ എന്ന വിശാലത നിലനിർത്തുന്നു; ഔപചാരിക കോടതിസാക്ഷ്യം മാത്രം എന്നു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: തന്റെ അകൃത്യത്തിന്റെ കുറ്റം അയാൾ വഹിക്കണം
  rationale: കുറ്റത്തിനുള്ള ഉത്തരവാദിത്വവും അതിന്റെ പരിണതഫലവും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഭാരം നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിയമവാക്യത്തിലെ ലിംഗപ്രതിനിധാനം
  choice: ലിംഗനിഷ്പക്ഷമായ ‘ഒരാൾ’ എന്ന തുടക്കവും ഏകവചന ‘അയാൾ’ എന്ന തുടർപരാമർശവും
  alternative: എല്ലായിടത്തും ‘അവൻ’ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ബഹുവചനരൂപം ഉപയോഗിക്കുക
  rationale: נֶפֶשׁ പൊതുവായി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; എബ്രായത്തിലെ ഏകവചന ഘടന കാത്തുകൊണ്ട് മലയാളത്തിൽ സാധാരണ വ്യക്തിയെ ഉൾക്കൊള്ളുന്ന രൂപം തിരഞ്ഞെടുത്തു.
- issue: וְנָשָׂא עֲוֺנוֹ എന്നതിലെ കുറ്റവും ശിക്ഷയും
  choice: ‘തന്റെ അകൃത്യത്തിന്റെ കുറ്റം വഹിക്കണം’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘തന്റെ അകൃത്യത്തിനുള്ള ശിക്ഷ അനുഭവിക്കണം’
  rationale: മൂലപാഠം കുറ്റബാധ്യതയെയും അതിന്റെ ഫലത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കാവുന്നതിനാൽ അതിനെ ശിക്ഷ മാത്രമായി നിർവചിക്കാതെ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ നിയമവാക്യശൈലി. സങ്കീർണമായ എബ്രായ ഉപവാക്യശൃംഖല വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി; കാരണം–ഫലം ബന്ധവും സാക്ഷിയുടെ ഉത്തരവാദിത്വവും നിലനിർത്തി.
