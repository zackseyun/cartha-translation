revisions:
- from: ഒരു വ്യക്തി അവിശ്വസ്തത കാട്ടുകയും യഹോവയ്ക്കു വിശുദ്ധമായ വസ്തുക്കളുടെ കാര്യത്തിൽ അറിയാതെ പാപം ചെയ്യുകയും ചെയ്താൽ, ആ വ്യക്തി യഹോവയ്ക്ക് കുറ്റപരിഹാരയാഗമായി[a] ആട്ടിൻകൂട്ടത്തിൽനിന്ന് ഊനമില്ലാത്ത ഒരു ആൺചെമ്മരിയാടിനെ കൊണ്ടുവരണം. നീ നിശ്ചയിക്കുന്ന മൂല്യമനുസരിച്ച്, അതിന് വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ മാനദണ്ഡപ്രകാരമുള്ള[b] വെള്ളിശേക്കെലുകളുടെ വില ഉണ്ടായിരിക്കണം; അത് കുറ്റപരിഹാരയാഗത്തിനുള്ളതാണ്.
  to: ഒരു വ്യക്തി അവിശ്വസ്തത കാട്ടുകയും യഹോവയുടെ വിശുദ്ധവസ്തുക്കളെ സംബന്ധിച്ച് അറിയാതെ പാപം ചെയ്യുകയും ചെയ്താൽ, ആ വ്യക്തി യഹോവയ്ക്കു തന്റെ കുറ്റപരിഹാരയാഗമായി[a] ആട്ടിൻകൂട്ടത്തിൽനിന്നുള്ള ഊനമില്ലാത്ത ഒരു ആൺചെമ്മരിയാടിനെ കൊണ്ടുവരണം; വിശുദ്ധ ശേക്കെൽ മാനദണ്ഡപ്രകാരം[b] വെള്ളിശേക്കെലുകളിൽ നീ നിശ്ചയിക്കുന്ന മൂല്യമുള്ളതായിരിക്കണം അത്—കുറ്റപരിഹാരയാഗത്തിനായി.
  rationale: The revision retains the draft's sound choices for the generic legal subject, inadvertence, holy things, divine name, sacrificial animal, and אָשָׁם terminology. It corrects the valuation syntax so that the ram is described as having the assessed value in silver shekels according to the sacred standard, rather than introducing an unintended separate pricing assertion. Footnote b is aligned with the less specific wording of the Hebrew text.
  reviewer_model: gpt-5.6-terra
