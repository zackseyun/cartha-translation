id: LEV.5.15
reference: Leviticus 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: ml
  text: ഒരു വ്യക്തി അവിശ്വസ്തത കാട്ടുകയും യഹോവയുടെ വിശുദ്ധവസ്തുക്കളെ സംബന്ധിച്ച് അറിയാതെ പാപം ചെയ്യുകയും ചെയ്താൽ, ആ വ്യക്തി യഹോവയ്ക്കു തന്റെ കുറ്റപരിഹാരയാഗമായി[a] ആട്ടിൻകൂട്ടത്തിൽനിന്നുള്ള ഊനമില്ലാത്ത ഒരു ആൺചെമ്മരിയാടിനെ കൊണ്ടുവരണം; വിശുദ്ധ ശേക്കെൽ മാനദണ്ഡപ്രകാരം[b] വെള്ളിശേക്കെലുകളിൽ നീ നിശ്ചയിക്കുന്ന മൂല്യമുള്ളതായിരിക്കണം അത്—കുറ്റപരിഹാരയാഗത്തിനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ אָשָׁם എന്ന പദം ‘കുറ്റയാഗം’ എന്നോ ‘നഷ്ടപരിഹാരയാഗം’ എന്നോ വിവർത്തനം ചെയ്യാം. അത് കുറ്റത്തിന്റെ ബാധ്യതയെയും അതിനുള്ള പരിഹാരമായി അർപ്പിക്കുന്ന യാഗത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വിശുദ്ധ ശേക്കെൽ’ വിശുദ്ധകാര്യങ്ങളിലെ മൂല്യനിർണയത്തിന് ഉപയോഗിച്ചിരുന്ന ഔദ്യോഗിക തൂക്കമാനദണ്ഡമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ഒരു വ്യക്തി
  rationale: നിയമസന്ദർഭത്തിൽ ഈ പദം വ്യക്തിയായ ഒരാളെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘പ്രാണൻ’ എന്നതിനെക്കാൾ ആധുനിക മലയാളത്തിൽ ‘ഒരു വ്യക്തി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: תִמְעֹל מַעַל
  choice: അവിശ്വസ്തത കാട്ടുകയും
  rationale: ക്രിയയും അതേ മൂലത്തിൽനിന്നുള്ള നാമവും ചേർന്ന പ്രയോഗം വിശുദ്ധമായ ബാധ്യത ലംഘിക്കുന്ന അവിശ്വസ്തതയെ ഊന്നിപ്പറയുന്നു.
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: അറിയാതെ പാപം ചെയ്യുകയും
  rationale: בִשְׁגָגָה മനഃപൂർവമായ ധിക്കാരമല്ല, അറിവില്ലാതെയോ അബദ്ധത്തിലോ സംഭവിക്കുന്ന തെറ്റാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: യഹോവയ്ക്കു വിശുദ്ധമായ വസ്തുക്കളുടെ കാര്യത്തിൽ
  rationale: യഹോവയ്ക്കായി വേർതിരിക്കപ്പെട്ട വഴിപാടുകൾ, സ്വത്ത്, അർഹതകൾ എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാലമായ ആരാധനാസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സാധാരണമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: കുറ്റപരിഹാരയാഗം
  rationale: אָשָׁם കുറ്റബാധ്യതയെയും അതിന് പരിഹാരം വരുത്തുന്ന യാഗത്തെയും സൂചിപ്പിക്കാം. ‘കുറ്റപരിഹാരയാഗം’ ഈ രണ്ടു വശങ്ങളും ഒരുമിച്ച് അറിയിക്കുകയും സന്ദർഭത്തിലെ നഷ്ടപരിഹാരസ്വഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אַיִל תָּמִים
  choice: ഊനമില്ലാത്ത ഒരു ആൺചെമ്മരിയാട്
  rationale: യാഗമൃഗത്തിന് ദോഷമോ വൈകല്യമോ ഇല്ലെന്ന ആരാധനാസംബന്ധിയായ അർഥം വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִן הַצֹּאן
  choice: ആട്ടിൻകൂട്ടത്തിൽനിന്ന്
  rationale: צֹאן ചെറുകന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; אַיִל ആൺചെമ്മരിയാടെന്ന് ഇതിനകം വ്യക്തമാക്കുന്നതിനാൽ ഈ രൂപം മതിയാകുന്നു.
- source_word: בְּעֶרְכְּךָ כֶּסֶף שְׁקָלִים
  choice: നീ നിശ്ചയിക്കുന്ന മൂല്യമനുസരിച്ച് ... വെള്ളിശേക്കെലുകളുടെ വില
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള മൂല്യനിർണയസൂത്രം നിലനിർത്തുകയും മൂല്യം വെള്ളിശേക്കെലുകളിൽ കണക്കാക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ മാനദണ്ഡപ്രകാരം
  rationale: ഇത് നാണയനാമം മാത്രമല്ല, വിശുദ്ധകാര്യങ്ങളിലെ ഔദ്യോഗിക തൂക്കമാനദണ്ഡവുമാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אָשָׁם എന്ന യാഗനാമത്തിന്റെ വിവർത്തനം
  choice: കുറ്റപരിഹാരയാഗം
  alternative: കുറ്റയാഗം; നഷ്ടപരിഹാരയാഗം; അകൃത്യയാഗം
  rationale: വാക്യം കുറ്റബാധ്യതയും വിശുദ്ധവസ്തുക്കളുമായി ബന്ധപ്പെട്ട നഷ്ടം പരിഹരിക്കുന്ന നടപടിയും ഒരുമിച്ച് മുന്നിൽ കൊണ്ടുവരുന്നു. ‘കുറ്റപരിഹാരയാഗം’ ഈ ഉദ്ദേശ്യപൂർണമായ ദ്വയാർഥം ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: നിയമവാക്യത്തിലെ വ്യക്തിവാചക ഏകവചനം
  choice: ഒരു വ്യക്തി ... ആ വ്യക്തി ... കൊണ്ടുവരണം
  alternative: ആരെങ്കിലും ... അവർ കൊണ്ടുവരണം
  rationale: נֶפֶשׁ എന്ന പൊതുവായ വ്യക്തിസൂചനയും തുടർന്നുള്ള എബ്രായ ഏകവചന നിയമരൂപവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; അനാവശ്യമായ ലിംഗനിർണ്ണയം ഒഴിവാക്കുന്നു.
- issue: മനഃപൂർവതയുടെ സ്വഭാവം
  choice: അറിയാതെ
  alternative: അബദ്ധത്തിൽ; മനഃപൂർവമല്ലാതെ
  rationale: בִשְׁגָגָה ഉയർത്തിപ്പിടിക്കുന്ന അനുദ്ദേശിതത്വം വ്യക്തമാക്കുന്നു; അതിനെ ധിക്കാരപൂർവമായ പാപമായി വായിക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ നിയമ-ആരാധനാശൈലി ഉപയോഗിച്ചു. ‘വിശുദ്ധവസ്തുക്കൾ’ എന്നതിന്റെ പരിധിയും אָשָׁם എന്ന പദത്തിലെ കുറ്റബാധ്യത/പരിഹാരം എന്നീ അർഥതലങ്ങളും അനാവശ്യമായി ചുരുക്കിയിട്ടില്ല.
