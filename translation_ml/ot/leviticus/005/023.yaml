source:
  edition: WLC
  text: וְ/הָיָה֮ כִּֽי יֶחֱטָ֣א וְ/אָשֵׁם֒ וְ/הֵשִׁ֨יב אֶת הַ/גְּזֵלָ֜ה אֲשֶׁ֣ר גָּזָ֗ל א֤וֹ אֶת הָ/עֹ֨שֶׁק֙ אֲשֶׁ֣ר עָשָׁ֔ק א֚וֹ אֶת הַ/פִּקָּד֔וֹן אֲשֶׁ֥ר הָפְקַ֖ד אִתּ֑/וֹ א֥וֹ אֶת הָ/אֲבֵדָ֖ה אֲשֶׁ֥ר מָצָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: ml
  text: അവൻ പാപം ചെയ്ത് കുറ്റക്കാരനായിത്തീരുമ്പോൾ[a], താൻ കവർന്നെടുത്തതോ അടിച്ചമർത്തി കൈക്കലാക്കിയതോ[b] തന്നെ ഏൽപ്പിച്ചിരുന്ന വസ്തുവോ താൻ കണ്ടെത്തിയ നഷ്ടപ്പെട്ട വസ്തുവോ[c] തിരികെ കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവൻ പാപം ചെയ്ത് കുറ്റക്കാരനായാൽ.” എബ്രായ നിയമപ്രയോഗം “ചെയ്യുമ്പോൾ” എന്നോ “ചെയ്താൽ” എന്നോ പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അടിച്ചമർത്തലിലൂടെ നേടിയതോ” അല്ലെങ്കിൽ “വഞ്ചിച്ചെടുത്തതോ.” എബ്രായപദത്തിന് മറ്റൊരാളുടെ സ്വത്ത് ചൂഷണത്തിലൂടെയോ വഞ്ചനയിലൂടെയോ കൈക്കലാക്കുന്നതോ തടഞ്ഞുവയ്ക്കുന്നതോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “താൻ കണ്ടുകിട്ടിയ നഷ്ടപ്പെട്ട സ്വത്തോ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …ചെയ്യുമ്പോൾ
  rationale: എബ്രായ നിയമവാക്യത്തിലെ സംഭവസാഹചര്യം അവതരിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിച്ചു; ‘…ചെയ്താൽ’ എന്നും സാധ്യമാണ്.
- source_word: יֶחֱטָא וְאָשֵׁם
  choice: പാപം ചെയ്ത് കുറ്റക്കാരനായിത്തീരുമ്പോൾ
  rationale: חטא എന്നതിന്റെ ധാർമിക-ഉടമ്പടിപരമായ ‘പാപം’ എന്ന അർഥവും אשם എന്നതിന്റെ കുറ്റബാധ്യതയും വേർതിരിച്ചുതന്നെ നിലനിർത്തുന്നു.
- source_word: וְהֵשִׁיב
  choice: തിരികെ കൊടുക്കണം
  rationale: നഷ്ടപരിഹാരപരമായ മടക്കിനൽകലും നിയമപരമായ നിർബന്ധവും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: താൻ കവർന്നെടുത്തത്
  rationale: ഒരാളുടെ വസ്തു അന്യായമായി പിടിച്ചെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന cognate noun-verb പ്രയോഗത്തിന്റെ ശക്തി അനാവശ്യ ആവർത്തനം കൂടാതെ നൽകുന്നു.
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: ബലപ്രയോഗത്തിലൂടെ കൈക്കലാക്കിയത്
  rationale: അടിച്ചമർത്തലിലൂടെയോ ചൂഷണത്തിലൂടെയോ മറ്റൊരാളുടെ വസ്തു കൈവശപ്പെടുത്തുകയോ തടഞ്ഞുവയ്ക്കുകയോ ചെയ്യുന്ന വിശാല അർഥം സൂചിപ്പിക്കുന്നു.
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: തന്നെ ഏൽപ്പിച്ചിരുന്ന വസ്തു
  rationale: മറ്റൊരാൾ സൂക്ഷിക്കാനായി ഏൽപ്പിച്ച സ്വത്ത് എന്ന നിയമസന്ദർഭം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: താൻ കണ്ടെത്തിയ നഷ്ടപ്പെട്ട വസ്തു
  rationale: കണ്ടുകിട്ടിയ അന്യന്റെ നഷ്ടപ്പെട്ട സ്വത്തെന്ന അർഥം വ്യാഖ്യാനാതിരേകം കൂടാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: וְאָשֵׁם എന്ന ക്രിയയുടെ അർഥം
  choice: കുറ്റക്കാരനായിത്തീരുക
  alternative: തന്റെ കുറ്റം തിരിച്ചറിയുക
  rationale: മൂലപദം പ്രധാനമായി കുറ്റബാധ്യത വരുന്നതിനെ സൂചിപ്പിക്കുന്നു; വ്യക്തിപരമായ തിരിച്ചറിവ് മാത്രം എന്നു ചുരുക്കുന്നത് ഇവിടെ ഉറപ്പില്ലാത്ത വ്യാഖ്യാനം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി. എബ്രായത്തിലെ പട്ടികഘടനയും കുറ്റബാധ്യതയിൽനിന്ന് വസ്തു മടക്കിനൽകുന്നതിലേക്കുള്ള ബന്ധവും നിലനിർത്തി; അത്യധികം സംസ്കൃതവത്കരിച്ച നിയമപദങ്ങൾ ഒഴിവാക്കി.
