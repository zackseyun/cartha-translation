    issue: “ബലപ്രയോഗത്തിലൂടെ കൈക്കലാക്കിയതോ” is too narrow for הָעֹשֶׁק אֲשֶׁר עָשָׁק.
    rationale: The Hebrew term concerns oppressive/exploitative or fraudulent seizure or withholding. It need not imply physical force; “അടിച്ചമർത്തി കൈക്കലാക്കിയത്” better preserves the semantic range without importing a specific method.
