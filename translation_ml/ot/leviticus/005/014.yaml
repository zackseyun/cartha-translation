  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: YHWH; ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക അഭിസംബോധനയ്ക്കുള്ള ആവർത്തിത സൂത്രവാക്യത്തിൽ דבר എന്ന ക്രിയയുടെ ഗൗരവവും സ്വാഭാവിക മലയാള പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ നാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: לֵאמֹר
  choice: അരുളിച്ചെയ്തു എന്ന അവതരണത്തിൽ ഉൾപ്പെടുത്തി
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രപ്രയോഗം മലയാളത്തിൽ വേറിട്ട് ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർത്താൽ കൃത്രിമമാകും; കോളൺ അതിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ പദവിയാക്കി മാറ്റാതെ മലയാള വായനക്കാർക്ക് സുപരിചിതമായ ലിപ്യന്തരണരൂപം സ്വീകരിച്ചു; ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ഹീബ്രു വാക്യഘടന യാന്ത്രികമായി പകർത്താതെ, അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വചനത്തിലേക്കുള്ള ബന്ധം കോളൺകൊണ്ട് നിലനിർത്തുന്നു.
