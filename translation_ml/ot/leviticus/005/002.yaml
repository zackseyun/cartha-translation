id: LEV.5.2
reference: Leviticus 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ഒരാൾ ഏതെങ്കിലും അശുദ്ധവസ്തുവിനെ—അശുദ്ധമായ ഒരു വന്യമൃഗത്തിന്റെ ജഡമോ, അശുദ്ധമായ ഒരു വളർത്തുമൃഗത്തിന്റെ ജഡമോ, അശുദ്ധമായ ഒരു ഇഴജന്തുവിന്റെ ജഡമോ—തൊടുകയും, അത് അയാളിൽനിന്ന് മറഞ്ഞിരിക്കുകയും ചെയ്താൽ, അയാൾ അശുദ്ധനായി കുറ്റക്കാരനാകും[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അത് അയാളിൽനിന്ന് മറഞ്ഞിരിക്കുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഉദ്ദേശിക്കുന്നത്, ഈ അശുദ്ധി അയാൾക്കു ബാധകമാകുമ്പോൾ അയാൾ കുറ്റക്കാരനാകുന്നു എന്നതാണ്; ജഡം തൊടുന്നത് ഉദ്ദേശപൂർവമായ പാപത്തിന്റെ അതേ അർഥത്തിൽ സ്വതവേ ഒരു ധാർമ്മിക തിന്മയാണെന്നല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ഒരാൾ
  rationale: നിയമസന്ദർഭത്തിൽ ഈ പദം ദേഹരഹിതമായ ‘ആത്മാവ്’ എന്നതിലുപരി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘ഒരാൾ’ സ്വാഭാവികവും പൊതുവ്യാപ്തിയുള്ളതുമാണ്.
- source_word: תִּגַּע בְּ
  choice: തൊടുക
  rationale: ב ചേർന്ന נגע ശാരീരിക സമ്പർക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘തൊടുക’ ലളിതവും കൃത്യവുമാണ്.
- source_word: כָל דָּבָר טָמֵא
  choice: ഏതെങ്കിലും അശുദ്ധവസ്തു
  rationale: דָּבָר ഇവിടെ തുടർന്നുള്ള ഉദാഹരണങ്ങൾ വിശദീകരിക്കുന്ന വിശാല വിഭാഗമാണ്; ‘അശുദ്ധവസ്തു’ ആ പൊതുവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: נִבְלַת
  choice: ജഡം
  rationale: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധിനിയമസന്ദർഭത്തിൽ ഇത് ചത്ത മൃഗത്തിന്റെ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ജഡം’ സംക്ഷിപ്തവും മാന്യവുമാണ്.
- source_word: חַיָּה טְמֵאָה
  choice: അശുദ്ധമായ ഒരു വന്യമൃഗം
  rationale: חַיָּה ഇവിടെ בְּהֵמָהയോട് വ്യത്യസ്തമായി കാട്ടിൽ ജീവിക്കുന്ന മൃഗത്തെ സൂചിപ്പിക്കുന്നു; ‘വന്യമൃഗം’ ആ ഭേദം വ്യക്തമാക്കുന്നു.
- source_word: בְּהֵמָה טְמֵאָה
  choice: അശുദ്ധമായ ഒരു വളർത്തുമൃഗം
  rationale: בְּהֵמָה ഇവിടെ വീട്ടിൽ വളർത്തുന്ന വലിയ മൃഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘വളർത്തുമൃഗം’ വന്യമൃഗത്തോടുള്ള വ്യത്യാസം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שֶׁרֶץ טָמֵא
  choice: അശുദ്ധമായ ഒരു ഇഴജന്തു
  rationale: שֶׁרֶץ ചെറുതായി ഇഴയുകയോ കൂട്ടമായി പെരുകുകയോ ചെയ്യുന്ന ജീവികളുടെ നിയമവിഭാഗമാണ്; ‘ഇഴജന്തു’ മലയാള ബൈബിൾശൈലിയിലും പൊതുഭാഷയിലും ഗ്രാഹ്യമാണ്, എങ്കിലും പദത്തിന്റെ മുഴുവൻ ജീവശാസ്ത്രപരമായ വ്യാപ്തി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: അത് അയാളുടെ അറിവിൽപ്പെടാതിരിക്കുക
  rationale: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ കാര്യം അയാളിൽനിന്ന് മറഞ്ഞിരിക്കുന്നു എന്നാണ്; സ്വാഭാവിക മലയാളത്തിൽ അറിവില്ലായ്മ വ്യക്തമാക്കിക്കൊണ്ട് മൂലത്തിലെ ദൃഷ്ടികോണം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְהוּא טָמֵא
  choice: അയാൾ അശുദ്ധനാകുന്നു
  rationale: ഇത് സമ്പർക്കത്തിന്റെ ഫലമായ ആചാരപരമായ നില വ്യക്തമാക്കുന്നു; ‘അശുദ്ധൻ’ എന്നത് ധാർമ്മിക പാപത്തെക്കാൾ ശുദ്ധിനിയമത്തിലെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וְאָשֵׁם
  choice: കുറ്റബാധ്യത വരുത്തിവെക്കുന്നു
  rationale: אָשֵׁם ഇവിടെ വെറും മാനസിക കുറ്റബോധമല്ല, നിയമപരമായ ബാധ്യത വരുന്നതിനെ സൂചിപ്പിക്കാം; ഈ പരിഭാഷ ആ അർഥം വ്യക്തമാക്കുകയും ഉദ്ദേശപൂർവമായ ധാർമ്മിക ദോഷം അനാവശ്യമായി ആരോപിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: טָמֵא/טְמֵאָה എന്നത് ‘അശുദ്ധൻ/അശുദ്ധമായ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മലിനൻ/മലിനമായ’ അല്ലെങ്കിൽ ‘പാപിയായ’
  rationale: വാക്യം ജഡസ്പർശം മൂലമുള്ള ആചാരപരമായ അശുദ്ധിയെക്കുറിച്ചാണ്; അതിനെ സ്വതവേ ധാർമ്മിക തിന്മയായി മാറ്റുന്ന പദപ്രയോഗം ഒഴിവാക്കണം.
- issue: אָשֵׁם എന്നതിലെ കുറ്റം അഥവാ ബാധ്യത
  choice: ‘കുറ്റബാധ്യത വരുത്തിവെക്കുന്നു’ എന്നു നൽകി.
  alternative: ‘കുറ്റക്കാരനാകുന്നു’ അല്ലെങ്കിൽ ‘കുറ്റം ചെയ്യുന്നു’
  rationale: മൂലപദം കുറ്റം/ബാധ്യത എന്ന സംഘർഷം വഹിക്കുന്നു. ‘കുറ്റബാധ്യത’ നിയമപരമായ ഫലം സൂക്ഷിക്കുകയും ജഡം തൊടുന്നതിനെ ഉദ്ദേശപൂർവമായ ധാർമ്മിക പാപവുമായി പൂർണമായി സമീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ലിംഗപ്രയോഗം
  choice: נֶפֶשׁ എന്നതിന് ‘ഒരാൾ’, തുടർന്നും ‘അയാൾ’ ഉപയോഗിച്ചു.
  alternative: ‘ഒരു വ്യക്തി ... ആ വ്യക്തി’ എന്ന ലിംഗനിരപേക്ഷ ആവർത്തനം
  rationale: ‘ഒരാൾ’ പൊതുവായ വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഏകവചന നിയമശൈലിയും എബ്രായത്തിലെ തുടർ സർവനാമഘടനയും ‘അയാൾ’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. നീണ്ട എബ്രായ ഏകവാക്യത്തിന്റെ ബന്ധം നിലനിർത്തിക്കൊണ്ട് ഡാഷുകൾ ഉപയോഗിച്ച് മൂന്ന് ഉദാഹരണങ്ങൾ വ്യക്തമായി വേർതിരിച്ചു. ‘അശുദ്ധം’, ‘ജഡം’, ‘കുറ്റബാധ്യത’ എന്നീ പദങ്ങൾ ലേവ്യപുസ്തകത്തിലെ ആചാര-നിയമസന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു.
