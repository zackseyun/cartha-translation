source:
  edition: WLC
  text: וְ/הֵבִ֤יא אֹתָ/ם֙ אֶל הַ/כֹּהֵ֔ן וְ/הִקְרִ֛יב אֶת אֲשֶׁ֥ר לַ/חַטָּ֖את רִאשׁוֹנָ֑ה וּ/מָלַ֧ק אֶת רֹאשׁ֛/וֹ מִ/מּ֥וּל עָרְפּ֖/וֹ וְ/לֹ֥א יַבְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: ml
  text: അവൻ അവയെ പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം; പാപയാഗത്തിനുള്ളതിനെ ആദ്യം അർപ്പിക്കണം. അതിന്റെ തല കഴുത്തിന്റെ മുൻവശത്തുനിന്ന് നുള്ളിയൊടിക്കണം; എന്നാൽ അതിനെ പൂർണമായി വേർപെടുത്തരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാപയാഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം ‘ശുദ്ധീകരണയാഗം’ എന്നും മനസ്സിലാക്കാം. ‘കഴുത്തിന്റെ മുൻവശത്തുനിന്ന്’ എന്നതിന്റെ എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; കഴുത്തിന്റെ എതിർവശം/പിൻകഴുത്തുമായി ബന്ധപ്പെട്ട സ്ഥാനം എന്നും വ്യാഖ്യാനിക്കപ്പെടുന്നു. എങ്ങനെയായാലും, തല ശരീരത്തിൽനിന്ന് പൂർണമായി വേർപെടുത്തരുതെന്നാണ് അവസാന നിർദേശം.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: അവൻ അവയെ പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം
  rationale: മുൻവാക്യത്തിലെ രണ്ടു പക്ഷികളെയാണ് ബഹുവചനമായ אֹתָם സൂചിപ്പിക്കുന്നത്. നിയമനിർദേശത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ ‘കൊണ്ടുവരണം’ എന്നു നൽകി.
- source_word: וְהִקְרִיב
  choice: പുരോഹിതൻ ... അർപ്പിക്കുകയും
  rationale: ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ അർപ്പിക്കുക/സമർപ്പിക്കുക എന്നർഥം നൽകുന്നു. ആദ്യ ക്രിയയുടെ കർത്താവായ വഴിപാടുകാരനിൽനിന്ന് ആചാരനടപടി ചെയ്യുന്ന പുരോഹിതനിലേക്കുള്ള സന്ദർഭസഹജമായ കർത്തൃമാറ്റം മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: പാപയാഗത്തിനുള്ളതിനെ ആദ്യം
  rationale: חַטָּאת എന്ന പദത്തിന്റെ ഇവിടെ പ്രസക്തമായ യാഗാർഥവും רִאשׁוֹנָה എന്ന ക്രമസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: וּמָלַק אֶת רֹאשׁוֹ
  choice: അതിന്റെ ... തല നുള്ളിയൊടിക്കുകയും
  rationale: מלק പക്ഷിയാഗത്തിൽ പുരോഹിതൻ കൈകൊണ്ട് ചെയ്യുന്ന പ്രത്യേക ആചാരനടപടിയാണ്. ‘നുള്ളിയൊടിക്കുക’ തല പൂർണമായി ഛേദിക്കുന്നതെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി ആ പ്രവർത്തി വ്യക്തമാക്കുന്നു.
- source_word: מִמּוּל עָרְפּוֹ
  choice: അതിന്റെ കഴുത്തിന്റെ പിൻവശത്തുനിന്ന്
  rationale: עֹרֶף കഴുത്തിന്റെ പിൻഭാഗം/പിരടി എന്നാണ്; מִמּוּל എന്ന ദുഷ്കരമായ പ്രയോഗത്തെ ഇവിടെ ആ ഭാഗത്തുനിന്ന് എന്ന സ്വാഭാവികവും സ്രോതസ്സിനടുത്തതുമായ അർഥത്തിൽ നൽകി.
- source_word: וְלֹא יַבְדִּיל
  choice: എന്നാൽ തല പൂർണമായി വേർപെടുത്തരുത്
  rationale: בדל വേർതിരിക്കുക എന്നാണ്. ആചാരത്തിലെ പ്രായോഗിക നിർദേശം—തല ശരീരത്തിൽനിന്ന് പൂർണമായി വേർപെടുത്തരുത്—വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: חַטָּאת എന്ന യാഗനാമത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ‘പാപയാഗം’ മലയാള വായനക്കാർക്ക് പരിചിതവും ഈ സന്ദർഭത്തിൽ സാധുവുമാണ്; ‘ശുദ്ധീകരണയാഗം’ എന്ന പണ്ഡിതപരമായ മറ്റൊരു വ്യാഖ്യാനം ഉണ്ടായാലും അത് വാക്യത്തിൽ നിർബന്ധമായി ചുമത്തിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശശൈലി. വഴിപാടുകാരനും പുരോഹിതനും തമ്മിലുള്ള കർത്തൃമാറ്റം ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ വ്യക്തമാക്കി; എബ്രായത്തിലെ സാങ്കേതിക യാഗഭാഷ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നിലനിർത്തി.
