  naturalness: തിരുത്തിയ പാഠം ആധുനിക നിലവാരമലയാളത്തിലെ നിയമനിർദേശശൈലി നിലനിർത്തുന്നു. ‘തല നുള്ളിയൊടിക്കണം; എന്നാൽ അതിനെ പൂർണമായി വേർപെടുത്തരുത്’ എന്ന ഘടന ആചാരക്രിയയും അതിന്റെ പരിധിയും വ്യക്തമായി അറിയിക്കുന്നു.
