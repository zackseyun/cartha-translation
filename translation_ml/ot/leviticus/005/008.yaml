    rationale: וְהֵבִיא, וְהִקְרִיב, וּמָלַק എന്നീ ക്രിയകൾക്ക് പാഠത്തിൽ കർത്തൃമാറ്റസൂചനയില്ല. പുരോഹിതൻ പ്രവർത്തിക്കുന്നു എന്നു സന്ദർഭത്തിൽ അനുമാനിക്കാമെങ്കിലും വിവർത്തനത്തിൽ അതു ചേർക്കരുത്.
