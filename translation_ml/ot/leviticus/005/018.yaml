id: LEV.5.18
reference: Leviticus 5:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: ml
  text: അവൻ കുറ്റയാഗത്തിനായി[a] നിന്റെ മൂല്യനിർണയമനുസരിച്ചുള്ള ഊനമില്ലാത്ത ഒരു ആട്ടുകൊറ്റനെ ആട്ടിൻപറ്റത്തിൽനിന്ന് പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം. അവൻ അറിവില്ലാതെ ചെയ്ത അബദ്ധത്തിനുവേണ്ടി[b] പുരോഹിതൻ അവനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം; അപ്പോൾ അവന് ക്ഷമ ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുറ്റയാഗമായി’ എന്നും പരിഭാഷപ്പെടുത്താം; മറ്റൊരു സാധ്യത ‘പരിഹാരയാഗത്തിനായി’ എന്നാണ്. ഹീബ്രുവിലെ אָשָׁם ഒരു പ്രത്യേക യാഗവിഭാഗത്തിന്റെ പേരാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവൻ മനഃപൂർവമല്ലാതെ ചെയ്ത പാപം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു അബദ്ധത്തിൽ സംഭവിച്ച തെറ്റിനാണ് ഊന്നൽ നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: അവൻ ... കൊണ്ടുവരണം
  rationale: നിയമനിർദേശത്തിലെ നിർബന്ധാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אַיִל תָּמִים
  choice: ഊനമില്ലാത്ത ഒരു ആട്ടുകൊറ്റൻ
  rationale: യാഗസന്ദർഭത്തിൽ אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെയും תָּמִים ദോഷമോ വൈകല്യമോ ഇല്ലാത്ത യാഗമൃഗത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: מִן הַצֹּאן
  choice: ആട്ടിൻപറ്റത്തിൽനിന്ന്
  rationale: ചെറിയ കന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന സമാഹാരപദത്തിന്റെ അർഥം മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; אַיִל മൃഗത്തെ ആട്ടുകൊറ്റനായി നേരത്തേ വ്യക്തമാക്കുന്നു.
- source_word: בְּעֶרְכְּךָ
  choice: നിന്റെ മൂല്യനിർണയമനുസരിച്ചുള്ള
  rationale: രണ്ടാംപുരുഷ ഏകവചനവും നിയമപരമായ വിലമതിക്കൽ എന്ന ആശയവും നിലനിർത്തുന്നു; വില നിർണയിക്കുന്ന വ്യക്തിയെ വാചകത്തിൽക്കാൾ കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: לְאָשָׁם
  choice: കുറ്റയാഗത്തിനായി
  rationale: ലേവ്യപുസ്തകത്തിലെ പ്രത്യേക യാഗവിഭാഗത്തെ തിരിച്ചറിയാവുന്ന രീതിയിൽ അവതരിപ്പിക്കുന്നു; പരിഹാരപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: וְכִפֶּר עָלָיו
  choice: പുരോഹിതൻ അവനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പുരോഹിതന്റെ യാഗപരമായ പ്രവർത്തനവും ആ വ്യക്തിക്കുവേണ്ടിയുള്ള അതിന്റെ ദിശയും നിലനിർത്തുന്ന പതിവും ഗ്രാഹ്യവുമായ പ്രയോഗം.
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג
  choice: ചെയ്ത അബദ്ധത്തിനുവേണ്ടി
  rationale: ശ്രദ്ധക്കുറവിലോ അറിവില്ലായ്മയിലോ സംഭവിച്ച തെറ്റ് എന്ന ശബ്ദാർഥം നിലനിർത്തുന്നു; മനഃപൂർവമായ കുറ്റമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: וְהוּא לֹא יָדַע
  choice: അവൻ അറിയാതെ
  rationale: തെറ്റ് മനഃപൂർവമല്ലായിരുന്നുവെന്ന വിശദീകരണം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְנִסְלַח לוֹ
  choice: അപ്പോൾ അവനോടു ക്ഷമിക്കും
  rationale: ഹീബ്രു ദൈവിക കർമണിപ്രയോഗത്തിന്റെ ഫലം നിലനിർത്തിക്കൊണ്ട് ക്ഷമിക്കുന്ന കർത്താവിനെ വാചകത്തിൽ പുതുതായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: אָשָׁם എന്ന യാഗപദത്തിന്റെ പരിഭാഷ
  choice: കുറ്റയാഗം
  alternative: പരിഹാരയാഗം
  rationale: ഇത് പുരോഹിതനിയമത്തിലെ നിർദിഷ്ട യാഗവിഭാഗത്തിന്റെ പേരാണ്. ‘കുറ്റയാഗം’ പരിചിതത്വവും പദസുസ്ഥിരതയും നൽകുന്നു; നഷ്ടപരിഹാരത്തിന്റെ ഭാവം സാധ്യതയായി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: כפר എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  alternative: പരിഹാരം വരുത്തുക / ശുദ്ധീകരിക്കുക
  rationale: യാഗത്തിലൂടെ പുരോഹിതൻ നിർവഹിക്കുന്ന നടപടിയെയും തുടർന്ന് ലഭിക്കുന്ന ക്ഷമയെയും ബന്ധിപ്പിക്കുന്ന ദൈവശാസ്ത്രഭാരം സംരക്ഷിക്കുന്നു; ക്രിയയുടെ പ്രവർത്തനരീതി അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- issue: അബദ്ധവും അറിവില്ലായ്മയും തമ്മിലുള്ള ബന്ധം
  choice: അവൻ അറിയാതെ ചെയ്ത അബദ്ധം
  alternative: അവന്റെ മനഃപൂർവമല്ലാത്ത പാപം
  rationale: മൂലപാഠത്തിലെ ശגג/שגגה പദബന്ധവും ‘അവൻ അറിഞ്ഞില്ല’ എന്ന വിശദീകരണവും സംരക്ഷിച്ച്, പാപത്തിന്റെ സ്വഭാവത്തെ കൂടുതൽ കർശനമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘കൊണ്ടുവരണം’, ‘പ്രായശ്ചിത്തം കഴിക്കണം’ എന്നിവ നിർദേശാത്മക സ്വരം നിലനിർത്തുന്നു. യാഗസാങ്കേതിക പദങ്ങൾക്ക് പരിചിതമായ മലയാളരൂപങ്ങൾ സ്വീകരിച്ചെങ്കിലും മൂലപാഠത്തിലെ വ്യത്യസ്ത അർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
