id: LEV.5.22
reference: Leviticus 5:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֽוֹ מָצָ֧א אֲבֵדָ֛ה וְ/כִ֥חֶשׁ בָּ֖/הּ וְ/נִשְׁבַּ֣ע עַל שָׁ֑קֶר עַל אַחַ֗ת מִ/כֹּ֛ל אֲשֶׁר יַעֲשֶׂ֥ה הָ/אָדָ֖ם לַ/חֲטֹ֥א בָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/022.yaml
  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: ml
  text: അല്ലെങ്കിൽ, കാണാതെപോയ ഒരു വസ്തു കണ്ടെത്തി, അതിനെ നിഷേധിക്കുകയും കള്ളസത്യം ചെയ്യുകയും ചെയ്താൽ—മനുഷ്യൻ അവയാൽ പാപം ചെയ്യാൻ ചെയ്യുന്ന സകല കാര്യങ്ങളിലെയും ഏതെങ്കിലും ഒന്നിനെക്കുറിച്ച്—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבֵדָה
  choice: കാണാതെപോയ ഒരു വസ്തു
  rationale: നഷ്ടപ്പെട്ടതോ ഉടമയിൽനിന്ന് വേർപെട്ടതോ ആയ കണ്ടെത്തിയ സ്വത്തിനെ സൂചിപ്പിക്കുന്ന പൊതുവായ പദപ്രയോഗം.
- source_word: וְכִחֶשׁ בָּהּ
  choice: അതിനെക്കുറിച്ച് കള്ളം പറയുകയും
  rationale: כחש എന്ന ക്രിയയുടെ നിഷേധിക്കുക/വഞ്ചനാപരമായി കള്ളം പറയുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; בָּהּ അതിനെക്കുറിച്ചുള്ള നിഷേധത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וְנִשְׁבַּע עַל שָׁקֶר
  choice: കള്ളസത്യം ചെയ്യുകയും
  rationale: അസത്യമായ കാര്യം സത്യംചെയ്ത് ഉറപ്പിക്കുന്നതിനെ മലയാളത്തിലെ പരിചിതവും സംക്ഷിപ്തവുമായ പ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യൻ
  rationale: ഇവിടെ ഒരു വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്ന സമൂഹനാമം; ലിംഗവിശേഷം അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: לַחֲטֹא בָהֵנָּה
  choice: പാപം ചെയ്യാൻ ഇടയാകുന്ന
  rationale: അക്ഷരാർഥമായ ‘അവയാൽ പാപം ചെയ്യുക’ എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: הָאָדָם എന്ന പദത്തിന്റെ ലിംഗപരവും പൊതുവുമായ വ്യാപ്തി
  choice: മനുഷ്യൻ
  alternative: ഒരു പുരുഷൻ
  rationale: സന്ദർഭം കുറ്റം ചെയ്യാവുന്ന മനുഷ്യനെ പൊതുവായി പരാമർശിക്കുന്നു; മൂലപദം ഇവിടെ നിർബന്ധമായി പുരുഷലിംഗത്തെ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: വാക്യത്തിന്റെ അപൂർണ്ണമായ തുടർച്ച
  choice: അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി
  alternative: സ്വതന്ത്രമായ സമ്പൂർണ്ണ വാക്യമായി മാറ്റുക
  rationale: ഈ വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന വ്യവസ്ഥാപരമായ പട്ടികയുടെ ഭാഗമാണ്; മൂലഭാഷയിലെ ഘടനയും തീവ്രതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ പട്ടികയുടെ തുടർച്ചയും മൂലവാക്യത്തിന്റെ അപൂർണ്ണ ഘടനയും നിലനിർത്തിയിരിക്കുന്നു.
