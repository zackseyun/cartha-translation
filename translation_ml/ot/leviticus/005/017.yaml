source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: ml
  text: ഒരു വ്യക്തി പാപം ചെയ്യുകയും യഹോവയുടെ കൽപ്പനകളിൽ ചെയ്യരുതാത്ത കാര്യങ്ങളിൽ ഏതെങ്കിലും ഒന്ന് അറിയാതെയാണെങ്കിലും ചെയ്യുകയും ചെയ്താൽ, അയാൾ കുറ്റക്കാരനാകും; അയാൾ തന്റെ അകൃത്യം വഹിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തന്റെ കുറ്റബാധ്യത വഹിക്കണം.” “അകൃത്യം വഹിക്കുക” എന്ന ഹീബ്രു പ്രയോഗം തെറ്റിന്റെ കുറ്റബാധ്യതയെയോ അതിന്റെ പരിണതഫലത്തെയോ ചുമക്കുന്നതിനെ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ഒരു വ്യക്തി
  rationale: നിയമസന്ദർഭത്തിൽ ഈ പദം ദേഹരഹിതമായ ‘ആത്മാവ്’ എന്നതിലുപരി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: תֶחֱטָא
  choice: പാപം ചെയ്യുകയും
  rationale: പുരോഹിതനിയമസന്ദർഭത്തിലെ חטא എന്ന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וְעָשְׂתָה אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: യഹോവയുടെ കല്പനകൾ വിലക്കുന്ന കാര്യങ്ങളിൽ ഏതെങ്കിലും ഒന്ന് ... ചെയ്യുകയും ചെയ്താൽ
  rationale: നിരോധിക്കപ്പെട്ട കാര്യങ്ങളുടെ കൂട്ടത്തിൽനിന്ന് ഏതെങ്കിലും ഒരു പ്രവൃത്തി ചെയ്യുന്നതെന്ന വിതരണാർഥവും നിയമപരമായ നിരോധനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ വ്യക്തിനാമമായി മലയാളത്തിലെ പരിചിതരൂപത്തിൽ നൽകുന്നു.
- source_word: וְלֹא יָדַע
  choice: അറിയാതെയാണെങ്കിലും
  rationale: ലംഘനം അറിവില്ലാതെ സംഭവിച്ചതാണെന്ന ഇളവുസൂചന മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאָשֵׁם
  choice: അയാൾ കുറ്റക്കാരനാകും
  rationale: ലംഘനഫലമായി കുറ്റബാധ്യത വരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ആകും’ എന്നത് ഫലാവസ്ഥയും ഉൾക്കൊള്ളുന്നു.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: അയാൾ തന്റെ അകൃത്യം വഹിക്കണം
  rationale: കുറ്റത്തിന്റെ ബാധ്യതയോ പരിണതഫലമോ വഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: അറിയാതെയുള്ള പാപവും കുറ്റബാധ്യതയും തമ്മിലുള്ള ബന്ധം
  choice: അറിവില്ലായ്മ വ്യക്തമാക്കിയിട്ടും ‘കുറ്റക്കാരനാകും’ എന്ന് നിലനിർത്തി
  alternative: അറിവില്ലായ്മ കുറ്റബാധ്യത ഒഴിവാക്കുന്നതായി വ്യാഖ്യാനിക്കുക
  rationale: വാക്യം അറിവില്ലായ്മയും കുറ്റബാധ്യതയും ഒരുമിച്ച് പ്രസ്താവിക്കുന്നതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: וְנָשָׂא עֲוֺנוֹ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: തന്റെ അകൃത്യം വഹിക്കണം
  alternative: തന്റെ കുറ്റത്തിന്റെ ശിക്ഷ അനുഭവിക്കണം
  rationale: മൂലപ്രയോഗം കുറ്റബാധ്യതയെയും അതിന്റെ പരിണതഫലത്തെയും സൂചിപ്പിക്കാവുന്നതിനാൽ ‘ശിക്ഷ’ എന്നു മാത്രം ചുരുക്കാതെ രൂപകവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ദീർഘമായ ഹീബ്രു വ്യവസ്ഥാവാക്യം വായനാസൗകര്യത്തിനായി സ്വാഭാവിക മലയാളക്രമത്തിൽ പുനഃക്രമീകരിച്ചെങ്കിലും അതിലെ വ്യവസ്ഥ, അറിവില്ലായ്മ, കുറ്റബാധ്യത, അകൃത്യം വഹിക്കൽ എന്നീ ഘടകങ്ങൾ എല്ലാം സംരക്ഷിച്ചു. ആവർത്തനം ഒഴിവാക്കാൻ പ്രതിനിധിപരമായ ഏകവചനത്തിൽ ‘അയാൾ’ ഉപയോഗിച്ചു.
