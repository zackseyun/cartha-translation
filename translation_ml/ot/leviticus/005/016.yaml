id: LEV.5.16
reference: Leviticus 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: ml
  text: വിശുദ്ധവസ്തുവിനു താൻ വരുത്തിയ നഷ്ടം അവൻ നഷ്ടപരിഹാരമായി നൽകണം[a]. അതിന്റെ അഞ്ചിലൊന്ന് അതോടു ചേർത്ത് പുരോഹിതനു കൊടുക്കണം. പിന്നെ പുരോഹിതൻ അകൃത്യയാഗത്തിനുള്ള ആട്ടുകൊറ്റനെക്കൊണ്ട് അവനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം[b]; അപ്പോൾ അവന് ക്ഷമ ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശുദ്ധവസ്തുവിൽനിന്ന് താൻ അന്യായമായി എടുത്തതോ തടഞ്ഞുവെച്ചതോ ആയതിനു നഷ്ടപരിഹാരം.” എബ്രായം വിശുദ്ധമായ ഒരു വസ്തുവിനെയോ വിശുദ്ധമായ അവകാശത്തെയോ സംബന്ധിച്ച കുറ്റത്തെയും അതിനുള്ള നഷ്ടപരിഹാരത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പരിഹാരയാഗത്തിനുള്ള ആട്ടുകൊറ്റനെക്കൊണ്ട്.”
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: വിശുദ്ധവസ്തുവിൽനിന്ന് താൻ പാപംചെയ്തതിനു പകരം
  rationale: വാക്യഘടന വിശുദ്ധമായ വസ്തുവോ അവകാശമോ ഉൾപ്പെട്ട കുറ്റത്തെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘വിശുദ്ധമന്ദിരം’ എന്ന ആശയം ചേർക്കാതെ അതിലെ അസ്പഷ്ടത നിലനിർത്തുന്നു.
- source_word: יְשַׁלֵּם
  choice: നഷ്ടപരിഹാരം നൽകണം
  rationale: ഈ നിയമപരമായ സന്ദർഭത്തിൽ മൂലധനം തിരികെ നൽകുന്നതും നഷ്ടം നികത്തുന്നതുമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: חֲמִישִׁתוֹ יוֹסֵף עָלָיו
  choice: അതിനോടുകൂടെ അതിന്റെ അഞ്ചിലൊന്നും ചേർത്ത്
  rationale: അടിസ്ഥാന തുകയ്ക്കു പുറമേ അഞ്ചിലൊന്ന് അധികമായി നൽകണമെന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לַכֹּהֵן
  choice: പുരോഹിതനു
  rationale: സ്വീകർത്താവിനെ നേരിട്ടും പതിവായും സൂചിപ്പിക്കുന്നു.
- source_word: יְכַפֵּר עָלָיו
  choice: അവനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: യാഗസന്ദർഭത്തിലെ כפר എന്ന ക്രിയയ്ക്ക് മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ മതഭാഷയിലും ഗ്രഹിക്കാവുന്ന സമാനപ്രയോഗം.
- source_word: בְּאֵיל הָאָשָׁם
  choice: അകൃത്യയാഗത്തിനുള്ള ആട്ടുകൊറ്റനെക്കൊണ്ട്
  rationale: אָשָׁם കുറ്റത്തെയും പരിഹാരത്തെയും ഉൾക്കൊള്ളുന്ന സാങ്കേതിക യാഗപദമാണ്; ‘അകൃത്യയാഗം’ പരിചിതവും സന്ദർഭോചിതവുമായ മലയാളപദമാണ്.
- source_word: וְנִסְלַח לוֹ
  choice: അപ്പോൾ അവനോടു ക്ഷമിക്കും
  rationale: എബ്രായത്തിലെ കർത്താവിനെ വ്യക്തമാക്കാത്ത ദൈവിക കർമവാചകസ്വഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: אָשָׁם എന്ന യാഗപദത്തിന്റെ വിവർത്തനം
  choice: അകൃത്യയാഗം
  alternative: പരിഹാരയാഗം
  rationale: ഈ പദത്തിൽ കുറ്റവും നഷ്ടപരിഹാരവും രണ്ടും അടങ്ങിയിരിക്കുന്നു. ‘അകൃത്യയാഗം’ സാങ്കേതിക യാഗനാമമായി തിരിച്ചറിയാവുന്നതാണ്; നഷ്ടപരിഹാരത്തിന്റെ വശം വാക്യത്തിന്റെ ആദ്യഭാഗത്തിൽ വ്യക്തമായി നൽകിയിട്ടുണ്ട്.
- issue: וְנִסְלַח לוֹയിലെ ക്ഷമയുടെ കർത്താവ്
  choice: കർത്താവിനെ വ്യക്തമാക്കാതെ ‘അവനോടു ക്ഷമിക്കും’
  alternative: ‘ദൈവം അവനോടു ക്ഷമിക്കും’
  rationale: സന്ദർഭത്തിൽ ക്ഷമ നൽകുന്നത് ദൈവമാണെങ്കിലും മൂലപാഠം കർത്താവിനെ പേരെടുത്ത് പറയുന്നില്ല; അതിനാൽ വിവർത്തനം അതിനെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-യാഗഭാഷ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ വിശുദ്ധവസ്തുവിനെ സംബന്ധിച്ച കുറ്റത്തിന്റെ കൃത്യസ്വഭാവവും ക്ഷമയുടെ അപ്രകട കർത്താവും അനാവശ്യമായി നിർണയിച്ചിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
