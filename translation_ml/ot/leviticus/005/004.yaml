id: LEV.5.4
reference: Leviticus 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ഒരാൾ തിന്മ ചെയ്യാനോ നന്മ ചെയ്യാനോ തന്റെ അധരങ്ങളാൽ അവിവേകമായി ശപഥം ചെയ്യുകയും[b]—മനുഷ്യൻ ശപഥത്തിൽ ഉച്ചരിക്കുന്ന എന്തുകാര്യമായാലും—അത് അയാളിൽനിന്ന് മറഞ്ഞിരിക്കുകയും[a], പിന്നീട് അയാൾ അത് അറിയുകയും, ഇവയിൽ ഒന്നിൽ കുറ്റക്കാരനാകുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അത്’ എന്നത് ശപഥത്തെയോ അതിന്റെ ബാധ്യതയെയോ ലംഘനത്തെയോ സൂചിപ്പിക്കാം; ഹീബ്രു ഇതു കൃത്യമായി വ്യക്തമാക്കുന്നില്ല.
    reason: ambiguity
  - marker: b
    text: ‘അവിവേകമായി’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഹീബ്രു പ്രയോഗത്തിന് അക്ഷരാർഥത്തിൽ ‘അധരങ്ങളാൽ ഉച്ചരിക്കുക’ എന്നും വരാം; ഈ സന്ദർഭത്തിൽ ചിന്തിക്കാതെയുള്ള ശപഥം എന്ന ആശയം ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ഒരാൾ
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഒരാൾ’ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ മലയാളമാണ്.
- source_word: תִשָּׁבַע
  choice: ശപഥം ചെയ്യുക
  rationale: നിഫാൽ രൂപം ഇവിടെ ശപഥമെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: തന്റെ അധരങ്ങൾകൊണ്ട് എടുത്തുചാടി ശപഥം ചെയ്യുക
  rationale: בטא അടിസ്ഥാനമായി അധരങ്ങളാൽ ഉച്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭം ചിന്തിക്കാതെയുള്ള അശ്രദ്ധമായ ശപഥത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘എടുത്തുചാടി’ ചേർത്തു, എന്നാൽ ‘അധരങ്ങൾകൊണ്ട്’ എന്ന രൂപകവും നിലനിർത്തി.
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: തിന്മ ചെയ്യാനോ നന്മ ചെയ്യാനോ
  rationale: ഹീബ്രുവിലെ വിപരീതധ്രുവങ്ങളെയും ശപഥത്തിന്റെ വിശാലമായ ഉള്ളടക്കത്തെയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: മനുഷ്യൻ ശപഥത്തിൽ എന്തുതന്നെ ഉച്ചരിച്ചാലും
  rationale: הָאָדָם എന്ന പൊതുവായ പ്രതിനിധി ഏകവചനത്തെ ‘മനുഷ്യൻ’ എന്നു നിലനിർത്തുകയും പ്രസ്താവനയുടെ പൊതുവ്യാപ്തി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: അത് അയാളുടെ ശ്രദ്ധയിൽപ്പെടാതിരിക്കുക
  rationale: ഹീബ്രുവിലെ മറഞ്ഞിരിക്കുക/അറിയാതിരിക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അത്’ എന്തിനെ സൂചിപ്പിക്കുന്നു എന്ന അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: וְהוּא יָדַע
  choice: പിന്നീട് അയാൾ അത് അറിയുക
  rationale: മുൻപുണ്ടായ അറിവില്ലായ്മയ്ക്കുശേഷമുള്ള തിരിച്ചറിവ് ക്രമസൂചകമായി വ്യക്തമാക്കുന്നു.
- source_word: וְאָשֵׁם
  choice: കുറ്റക്കാരനാകുക
  rationale: പ്രവൃത്തിയിൽനിന്നുണ്ടാകുന്ന കുറ്റബാധ്യതയെ ലളിതവും നിയമസന്ദർഭത്തിന് യോജിച്ചതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: ഇവയിൽ ഏതെങ്കിലും ഒന്നിൽ
  rationale: മുൻപറഞ്ഞ കേസുകളിലൊന്നിലേക്കുള്ള സൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിയമവാക്യത്തിലെ പൊതുവായ പുരുഷലിംഗപ്രയോഗം
  choice: הָאָדָם എന്നതിന് ‘മനുഷ്യൻ’ എന്ന പ്രതിനിധി ഏകവചനം നിലനിർത്തി; נֶפֶשׁ എന്നതിന് ‘ഒരാൾ’ ഉപയോഗിച്ചു.
  alternative: രണ്ടിടത്തും ‘ഒരാൾ’ അല്ലെങ്കിൽ ‘ഒരു വ്യക്തി’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠത്തിലെ נֶפֶשׁ / הָאָדָם വ്യത്യാസം ഭാഗികമായി നിലനിർത്തുന്നു; ‘മനുഷ്യൻ’ ഇവിടെ സ്ത്രീകളെ ഒഴിവാക്കാതെ പൊതുവായ മനുഷ്യവ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- issue: അശ്രദ്ധമായ ശപഥമോ വെറും വാചിക ഉച്ചാരണമോ
  choice: ‘തന്റെ അധരങ്ങൾകൊണ്ട് എടുത്തുചാടി ശപഥം ചെയ്യുക’
  alternative: ‘തന്റെ അധരങ്ങൾകൊണ്ട് ഉച്ചരിച്ച് ശപഥം ചെയ്യുക’
  rationale: בטא എന്ന പദത്തിന് ഉച്ചരിക്കുക എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും സന്ദർഭം ചിന്തിക്കാതെയോ ആവേശത്തിലോ ചെയ്ത ശപഥത്തെ സൂചിപ്പിക്കാം. പ്രധാന പാഠത്തിൽ സന്ദർഭാർഥം നൽകി, അടിക്കുറിപ്പിൽ അടിസ്ഥാനാർഥം രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ നിയമശൈലി. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്ന വ്യവസ്ഥയായതിനാൽ അവസാനം കോമ നിലനിർത്തി. ‘അയാൾ’ ആവർത്തിക്കുന്നത് ഹീബ്രുവിലെ ഏകവചന വ്യക്തിസൂചന വ്യക്തമാക്കുന്നു.
