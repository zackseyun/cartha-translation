revisions:
- from: അല്ലെങ്കിൽ, ഒരാൾ തിന്മ ചെയ്യാനോ നന്മ ചെയ്യാനോ—മനുഷ്യൻ ശപഥത്തിൽ എന്തുതന്നെ ഉച്ചരിച്ചാലും—തന്റെ അധരങ്ങൾകൊണ്ട് എടുത്തുചാടി ശപഥം ചെയ്യുകയും, അത് അയാളുടെ ശ്രദ്ധയിൽപ്പെടാതിരിക്കുകയും[a], പിന്നീട് അയാൾ അത് അറിയുകയും, ഇവയിൽ ഏതെങ്കിലും ഒന്നിൽ കുറ്റക്കാരനാകുകയും ചെയ്താൽ[b],
  to: അല്ലെങ്കിൽ, ഒരാൾ തിന്മ ചെയ്യാനോ നന്മ ചെയ്യാനോ തന്റെ അധരങ്ങളാൽ അവിവേകമായി ശപഥം ചെയ്യുകയും[b]—മനുഷ്യൻ ശപഥത്തിൽ ഉച്ചരിക്കുന്ന എന്തുകാര്യമായാലും—അത് അയാളിൽനിന്ന് മറഞ്ഞിരിക്കുകയും[a], പിന്നീട് അയാൾ അത് അറിയുകയും, ഇവയിൽ ഒന്നിൽ കുറ്റക്കാരനാകുകയും ചെയ്താൽ,
  rationale: The revision restores a fluent Malayalam conditional construction, uses a suitably formal equivalent for a rash or thoughtless oath, retains the generic-singular distinction between ‘ഒരാൾ’ and ‘മനുഷ്യൻ,’ and relocates the lexical footnote marker to the expression it explains. The revised passive wording preserves the source ambiguity concerning what was hidden from the person.
