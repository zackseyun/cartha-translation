source:
  edition: WLC
  text: א֠וֹ מִ/כֹּ֞ל אֲשֶׁר יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒ וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ יִתְּנֶ֖/נּוּ בְּ/י֥וֹם אַשְׁמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, താൻ കള്ളമായി സത്യം ചെയ്തിട്ടുള്ള ഏതെങ്കിലും കാര്യത്തെക്കുറിച്ചായാലും, അവൻ അതു പൂർണമായി തിരിച്ചുകൊടുക്കണം; അതോടൊപ്പം അതിന്റെ അഞ്ചിലൊന്ന് കൂടി ചേർക്കണം. തന്റെ അകൃത്യയാഗത്തിന്റെ[a] ദിവസം അത് അതിന്റെ അവകാശിക്കു കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ കുറ്റത്തിന്റെ ദിവസം” അല്ലെങ്കിൽ “താൻ കുറ്റക്കാരനാകുന്ന ദിവസം.” എബ്രായപദത്തിന് കുറ്റാവസ്ഥയെയോ അകൃത്യയാഗത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ യാഗസന്ദർഭത്തെ മുൻനിർത്തിയാണ് മുഖ്യപാഠം നൽകിയിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: א֠וֹ מִכֹּל אֲשֶׁר
  choice: അല്ലെങ്കിൽ… ഏതൊരു കാര്യവും
  rationale: മുൻവാക്യത്തിലെ പട്ടിക തുടരുന്ന ‘അല്ലെങ്കിൽ’ എന്ന അർഥവും, ബാധകമായ കാര്യങ്ങളുടെ വിശാലപരിധിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִשָּׁבַע עָלָיו לַשֶּׁקֶר
  choice: താൻ കള്ളസത്യം ചെയ്ത
  rationale: ഒരു കാര്യത്തെക്കുറിച്ചു വ്യാജമായി സത്യം ചെയ്യുക എന്ന നിയമപരമായ ആശയം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: וְשִׁלַּם אֹתוֹ בְּרֹאשׁוֹ
  choice: അതു മുഴുവനായി തിരിച്ചുകൊടുക്കുകയും
  rationale: ‘അതിന്റെ തല/മൂലധനം’ എന്ന എബ്രായ നിയമപ്രയോഗം നഷ്ടപ്പെട്ടതിന്റെ മുഖ്യത്തുക മുഴുവനായും മടക്കിനൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַחֲמִשִׁתָיו יֹסֵף עָלָיו
  choice: അതിന്റെ അഞ്ചിലൊന്ന് അതിനോടു ചേർക്കുകയും
  rationale: മൂല്യത്തിന്റെ ഇരുപത് ശതമാനം അധികമായി നൽകണമെന്ന നഷ്ടപരിഹാരനിയമം കൃത്യമായി അറിയിക്കുന്നു.
- source_word: לַאֲשֶׁר הוּא לוֹ
  choice: അതിന്റെ അവകാശിക്കു
  rationale: ‘അത് ആർക്കുള്ളതോ അവന്’ എന്ന എബ്രായ ഉടമസ്ഥാവകാശപ്രയോഗത്തിന്റെ സ്വാഭാവികവും നിയമപരമായി വ്യക്തവുമായ മലയാളരൂപം.
- source_word: יִתְּנֶנּוּ
  choice: അത്… കൊടുക്കണം
  rationale: നഷ്ടപരിഹാരത്തുക അവകാശിക്കു കൈമാറുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ ക്രിയാരൂപം.
- source_word: בְּיוֹם אַשְׁמָתוֹ
  choice: തന്റെ അകൃത്യയാഗത്തിന്റെ ദിവസം
  rationale: ലേവ്യപുസ്തകത്തിലെ തൊട്ടടുത്ത യാഗസന്ദർഭത്തിൽ പദത്തിന്റെ ആചാരപരമായ അർഥം മുൻനിർത്തുന്നു; എന്നാൽ ‘കുറ്റം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אַשְׁמָתוֹ എന്ന പദത്തിന്റെ അർഥം
  choice: തന്റെ അകൃത്യയാഗത്തിന്റെ
  alternative: തന്റെ കുറ്റത്തിന്റെ / താൻ കുറ്റക്കാരനാകുന്ന
  rationale: പദം കുറ്റാവസ്ഥയെയും അതുമായി ബന്ധപ്പെട്ട അകൃത്യയാഗത്തെയും സൂചിപ്പിക്കാം. തൊട്ടടുത്ത ബലിയർപ്പണസന്ദർഭം കാരണം മുഖ്യപാഠത്തിൽ യാഗാർഥം സ്വീകരിച്ചെങ്കിലും യഥാർഥമായ അർഥദ്വയത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള നിയമ-ആചാര ശൈലി. ‘അകൃത്യയാഗം’ ലേവ്യപുസ്തകത്തിലെ ബലിപദസഞ്ചയവുമായി പൊരുത്തപ്പെടുന്നു; വാക്യഘടന എബ്രായത്തിന്റെ ക്രമം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമാക്കി.
