    rationale: יִשָּׁבַע עָלָיו לַשֶּׁקֶר means to swear falsely concerning a matter. Adding “കാര്യത്തെക്കുറിച്ചായാലും” makes the relational force of עָלָיו explicit and avoids a potentially awkward Malayalam construction.
