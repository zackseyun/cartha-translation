source:
  edition: WLC
  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַל חַטָּאת֧/וֹ אֲשֶׁר חָטָ֛א מֵֽ/אַחַ֥ת מֵ/אֵ֖לֶּה וְ/נִסְלַ֣ח ל֑/וֹ וְ/הָיְתָ֥ה לַ/כֹּהֵ֖ן כַּ/מִּנְחָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: ml
  text: ഇങ്ങനെ, ഇവയിൽ ഏതെങ്കിലും ഒന്നിൽ അവൻ ചെയ്ത പാപത്തിനുവേണ്ടി പുരോഹിതൻ അവനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കും; അപ്പോൾ അവന് ക്ഷമ ലഭിക്കും.[a] ആ യാഗം ധാന്യയാഗംപോലെ പുരോഹിതനുള്ളതായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ പാപം ക്ഷമിക്കപ്പെടും.’ എബ്രായത്തിൽ പ്രയോഗം നിഷ്ക്രിയമാണ്; ക്ഷമിക്കുന്നവൻ ആരെന്ന് അതിൽ വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִפֶּר
  choice: പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പുരോഹിതബലികർമത്തിന്റെ പശ്ചാത്തലത്തിൽ כפר പാപപരിഹാരത്തിനായുള്ള ആചാരകർമത്തെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും ഇവിടെ വ്യക്തവുമായ പ്രയോഗമാണ് ‘പ്രായശ്ചിത്തം കഴിക്കുക’; പ്രായശ്ചിത്തത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: עָלָיו
  choice: അവനുവേണ്ടി
  rationale: כפר എന്ന ക്രിയയോടുകൂടിയ עַל കുറ്റം ചെയ്ത വ്യക്തിക്കുവേണ്ടി പുരോഹിതൻ പ്രവർത്തിക്കുന്നു എന്ന അർഥം നൽകുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ כֹּהֵן എന്നതിന്റെ സ്വാഭാവികവും സ്ഥിരവുമായ മലയാള പരിഭാഷ.
- source_word: עַל חַטָּאתוֹ
  choice: അവൻ ചെയ്ത പാപത്തിനുവേണ്ടി
  rationale: חַטָּאת എന്നതിന് ‘പാപം’ എന്നും ‘പാപയാഗം’ എന്നും അർഥമാകാമെങ്കിലും, പിന്നാലെയുള്ള אֲשֶׁר חָטָא (‘അവൻ ചെയ്ത’) എന്ന ബന്ധവാക്യം ഇവിടെ കുറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: ഇവയിൽ ഏതെങ്കിലും ഒന്നിൽ
  rationale: മുമ്പ് പറഞ്ഞ സാഹചര്യങ്ങളിൽ ഒന്നിനെ സൂചിപ്പിക്കുന്ന ഭാഗികപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְנִסְלַח לוֹ
  choice: അവന് ക്ഷമ ലഭിക്കും
  rationale: סלח എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ക്ഷമ ലഭിക്കുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു; ക്ഷമിക്കുന്നവനെ എബ്രായം വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിലും കർത്താവിനെ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: അത് പുരോഹിതനുള്ളതായിരിക്കും
  rationale: യാഗവസ്തുവിന്മേലുള്ള പുരോഹിതന്റെ അവകാശം വ്യക്തമാക്കുന്നു. ‘അത്’ സമീപസന്ദർഭത്തിലെ മാവുകൊണ്ടുള്ള യാഗവസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: כַּמִּנְחָה
  choice: ധാന്യയാഗംപോലെ
  rationale: ലേവ്യപുസ്തകത്തിലെ ബലികർമസന്ദർഭത്തിൽ מִנְחָה സാധാരണയായി ധാന്യയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ബലികർമത്തെ തുടർന്നുള്ള ക്ഷമയുടെ സൂത്രവാക്യം
  choice: അവന് ക്ഷമ ലഭിക്കും
  alternative: അവനുവേണ്ടി അത് ക്ഷമിക്കപ്പെടും
  rationale: എബ്രായത്തിലെ നിഷ്ക്രിയരൂപം ക്ഷമിക്കുന്നവനെ പേരെടുത്തു പറയുന്നില്ല. തെരഞ്ഞെടുത്ത മലയാളം ആ നിയന്ത്രണം പാലിക്കുകയും സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ പദാനുപദമായ സാധ്യത അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ലേവ്യപുസ്തകത്തിലെ ആചാരനിയമങ്ങൾക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. അടിക്കുറിപ്പിന്റെ സൂചിക ക്ഷമയെക്കുറിച്ചുള്ള വാക്യത്തോടു ചേർത്തിരിക്കുന്നു; അതാണ് അടിക്കുറിപ്പിന്റെ യഥാർഥ വിഷയവും എബ്രായത്തിലെ വ്യാകരണപരമായ അനിശ്ചിതത്വവും.
