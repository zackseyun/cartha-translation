source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/020.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ മോശയോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: ദൈവിക അരുളപ്പാടിന്റെ പുതിയ ഘടകം ആരംഭിക്കുന്ന സാധാരണ ആഖ്യാനസൂത്രമാണിത്; דבר എന്ന ക്രിയയുടെ അർഥവും ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാള ബൈബിൾ വായനക്കാർക്കു പരിചിതമായ നാമരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദത്തിവ് രൂപം നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള അരുളപ്പാട് അവതരിപ്പിക്കുന്ന ഹീബ്രു സൂത്രത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ഒരു ദൈവിക സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ നാമസ്വഭാവം നിലനിർത്തുന്ന, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ സ്വീകരിച്ചു; ഉച്ചാരണത്തിന്റെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം ഒരു പരമ്പരാഗത പകരപ്പേരിലൂടെ മറച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ഹീബ്രു വാക്യഘടന യാന്ത്രികമായി പകർത്താതെ, അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള അരുളപ്പാടിലേക്കുള്ള മാറ്റം ദ്വിബിന്ദുവിലൂടെ വ്യക്തമാക്കുന്നു.
