  source_fidelity: 'മുഖ്യാർഥം മൂലഎബ്രായത്തോടും ഇംഗ്ലീഷ് പരിശോധനാപാഠത്തോടും വിശ്വസ്തമാണ്: മനുഷ്യസംബന്ധമായ ആചാരപരമായ അശുദ്ധിയുമായുള്ള സ്പർശം, അതിനെക്കുറിച്ചുള്ള മുൻകാല അജ്ഞത, പിന്നീടുള്ള അറിവ്, കുറ്റബാധ്യത എന്നിവയെല്ലാം സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ അവസാനത്തെ ‘കുറ്റക്കാരനാകുന്നു’ അറിവ് ലഭിക്കുമ്പോഴാണ് കുറ്റം പുതുതായി ഉണ്ടാകുന്നതെന്ന സൂചന നൽകാം; וְאָשֵׁם എന്ന നിയമപരമായ നിലയെ ‘കുറ്റക്കാരനാണ്’ എന്നു പറയുന്നതാണ് കൂടുതൽ കൃത്യം.'
  naturalness: ‘അത് അയാളുടെ അറിവിൽപ്പെടാതിരിക്കുകയും’ സ്വാഭാവികമാണെങ്കിലും, മൂലത്തിലെ ‘അവനിൽനിന്ന് മറഞ്ഞിരുന്നു’ എന്ന നിഷ്ക്രിയരൂപം മുഖ്യപാഠത്തിൽ തന്നെ നൽകുന്നത് കൂടുതൽ നേരിട്ടും അടിക്കുറിപ്പിനോടു കൂടുതൽ ഒത്തുപോകുന്നതുമാണ്. പരിഷ്കരിച്ച വാക്യം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ നിയമപരമായ ശൈലി നിലനിർത്തുന്നു.
  terminology: ‘അശുദ്ധി’ ആചാരപരമായ/നിയമപരമായ טֻמְאָהയ്ക്ക് യോജിച്ചതാണ്; ധാർമ്മിക പാപം എന്ന ആശയം അതിൽ ചേർക്കുന്നില്ല. ‘മനുഷ്യനിൽനിന്നുള്ള അശുദ്ധി’ മനുഷ്യസ്രോതസ്സുമായി ബന്ധപ്പെട്ട അശുദ്ധിയെ വ്യക്തമാക്കുന്നു. ‘കുറ്റക്കാരനാണ്’ אשם-ന്റെ നിയമപരമായ കുറ്റബാധ്യതയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
