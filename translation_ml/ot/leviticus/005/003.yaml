id: LEV.5.3
reference: Leviticus 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ഒരാൾ മനുഷ്യനിൽനിന്നുള്ള അശുദ്ധി[a] തൊടുകയും—ഒരാളെ അശുദ്ധനാക്കുന്ന ഏതുതരം അശുദ്ധിയായാലും—അത് അയാളിൽനിന്ന് മറഞ്ഞിരിക്കുകയും[b], പിന്നീട് അയാൾ അത് അറിയുകയും ചെയ്താൽ, അയാൾ കുറ്റക്കാരനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനുഷ്യനിൽനിന്നുള്ള ആചാരപരമായ അശുദ്ധി’ എന്നും അർഥമാക്കാം. ഈ നിയമസന്ദർഭത്തിലെ എബ്രായപദം ധാർമ്മികദോഷത്തെയല്ല, ആചാരപരമായ അശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അത് അയാളിൽനിന്ന് മറഞ്ഞിരിക്കുകയും’; അതായത്, സംഭവിച്ച സമയത്ത് അയാൾ അതിനെക്കുറിച്ച് അറിഞ്ഞിരുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: തൊടുകയും
  rationale: נגע എന്ന ക്രിയ בְ എന്ന ഉപസർഗത്തോടുകൂടെ ശാരീരിക സമ്പർക്കത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തൊടുക’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: טֻמְאַת אָדָם
  choice: മനുഷ്യനിൽനിന്നുള്ള അശുദ്ധി
  rationale: טֻמְאָה ഇവിടെ ലേവ്യനിയമത്തിലെ ആചാരപരമായ അശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്; אָדָם അശുദ്ധിയുടെ മനുഷ്യസ്രോതസ്സിനെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യനിൽനിന്നുള്ള’ എന്നത് ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: ഏതുതരം അശുദ്ധിയായാലും
  rationale: മനുഷ്യസ്രോതസ്സുമായി ബന്ധപ്പെട്ട എല്ലാ തരത്തിലുള്ള അശുദ്ധിയെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തി ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: ഒരാളെ അശുദ്ധനാക്കുന്ന
  rationale: ബന്ധവാക്യം അശുദ്ധിയുടെ ഫലം വിശദീകരിക്കുന്നു; പൊതുവായ നിയമപ്രസ്താവനയായതിനാൽ ‘ഒരാളെ’ എന്ന രൂപം യോജിക്കുന്നു.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: അത് അയാളുടെ അറിവിൽപ്പെടാതിരിക്കുകയും
  rationale: עלם എന്നതിന്റെ നിഫാൽ രൂപത്തിലുള്ള നിഷ്ക്രിയഭാവവും, സംഭവസമയത്ത് ആൾ അതറിയാതിരുന്നതും ഈ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהוּא יָדַע
  choice: പിന്നീട് അയാൾ അത് അറിയുകയും ചെയ്താൽ
  rationale: മുൻപ് അറിയാതിരുന്ന കാര്യം തുടർന്നു അറിയുന്ന കാലക്രമം ‘പിന്നീട്’ വ്യക്തമാക്കുന്നു.
- source_word: וְאָשֵׁם
  choice: അയാൾ കുറ്റക്കാരനാകുന്നു
  rationale: ആചാര-നിയമപരമായ ഈ സന്ദർഭത്തിൽ אשם കുറ്റമോ ബാധ്യതയോ വന്നുചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കുറ്റക്കാരനാകുന്നു’ അതിന്റെ നിയമബലം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: ലേവ്യനിയമത്തിലെ טֻמְאָה എന്നതിന്റെ സ്വഭാവം
  choice: ‘അശുദ്ധി’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘മാലിന്യം’ അല്ലെങ്കിൽ ധാർമ്മിക അർഥമുള്ള ‘പാപാവസ്ഥ’
  rationale: ഇവിടെ സമ്പർക്കംമൂലം ഉണ്ടാകുന്ന ആചാരപരമായ അശുദ്ധിയാണ് വിഷയം; അതിനെ സ്വതവേ ധാർമ്മികദോഷമായി വ്യാഖ്യാനിക്കുന്ന പദം മൂലപാഠം ആവശ്യപ്പെടുന്നില്ല.
- issue: אָדָם എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ‘മനുഷ്യനിൽനിന്നുള്ള’ എന്ന പൊതുവായ രൂപം
  alternative: ‘പുരുഷന്റെ’ അല്ലെങ്കിൽ ‘മനുഷ്യവർഗത്തിന്റെ’
  rationale: אָדָם ഇവിടെ പുരുഷലിംഗത്തെ മാത്രമല്ല, മനുഷ്യസ്രോതസ്സിനെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- issue: וְאָשֵׁם എന്നതിലെ കുറ്റബാധ്യത
  choice: ‘കുറ്റക്കാരനാകുന്നു’
  alternative: ‘കുറ്റം വഹിക്കുന്നു’
  rationale: അറിവില്ലായ്മ ഉണ്ടായിരുന്നിട്ടും നിയമപരമായ കുറ്റബാധ്യത നിലനിൽക്കുന്നതെന്ന പാഠത്തിന്റെ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ വാക്യഘടന നിലനിർത്തിക്കൊണ്ട് അത്യന്തം അക്ഷരാനുകരണം ഒഴിവാക്കി; ‘അശുദ്ധി’ എന്ന പദം ആചാരപരമായ അർഥത്തിൽ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
