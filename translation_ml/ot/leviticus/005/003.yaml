  to: അല്ലെങ്കിൽ, ഒരാൾ മനുഷ്യനിൽനിന്നുള്ള അശുദ്ധി[a] തൊടുകയും—ഒരാളെ അശുദ്ധനാക്കുന്ന ഏതുതരം അശുദ്ധിയായാലും—അത് അയാളിൽനിന്ന് മറഞ്ഞിരിക്കുകയും[b], പിന്നീട് അയാൾ അത് അറിയുകയും ചെയ്താൽ, അയാൾ കുറ്റക്കാരനാണ്.
  rationale: 'പരിഷ്കരണം രണ്ട് ചെറിയ കാര്യങ്ങളിൽ മാത്രം ഒതുക്കി: മൂലത്തിലെ നിഷ്ക്രിയ ‘മറഞ്ഞിരിക്കുകയും’ മുഖ്യപാഠത്തിൽ പുനഃസ്ഥാപിച്ചു; അവസാന നിയമവിധിയെ ‘കുറ്റക്കാരനാണ്’ എന്നു മാറ്റി. അശുദ്ധിയുടെ ആചാരപരമായ സ്വഭാവം, മനുഷ്യസ്രോതസ്സിന്റെ പൊതുവായ അർഥം, മുൻകാല അജ്ഞതയ്ക്കുശേഷമുള്ള അറിവ് എന്നിവ മാറ്റമില്ലാതെ നിലനിർത്തി.'
