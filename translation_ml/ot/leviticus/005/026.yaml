  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה וְ/נִסְלַ֣ח ל֑/וֹ עַל אַחַ֛ת מִ/כֹּ֥ל אֲשֶֽׁר יַעֲשֶׂ֖ה לְ/אַשְׁמָ֥ה בָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: ml
  text: പുരോഹിതൻ യഹ്‌വെയുടെ സന്നിധിയിൽ അവനുവേണ്ടി പ്രായശ്ചിത്തം നിർവഹിക്കും; അവൻ കുറ്റക്കാരനാകുന്ന സകല പ്രവൃത്തികളിൽ ഏതെങ്കിലും ഒന്നിനെച്ചൊല്ലി അവന് ക്ഷമ ലഭിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവൻ ചെയ്തുകൊണ്ട് കുറ്റക്കാരനാകുന്ന സകല കാര്യങ്ങളിൽ ഏതെങ്കിലും ഒന്നിനെ സംബന്ധിച്ച്.”'
    reason: അവസാന എബ്രായ പ്രയോഗത്തിന്റെ ഘടനയും അതിലെ ‘ഏതെങ്കിലും ഒന്ന്’ എന്ന വിതരണാർഥവും കാണിക്കുന്ന അക്ഷരാർഥപരമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: וְכִפֶּר
  choice: പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പീലേൽ രൂപം യാഗാരാധനാപരമായ സന്ദർഭത്തിൽ പാപപരിഹാരം നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: עָלָיו
  choice: അവനുവേണ്ടി
  rationale: כפר എന്ന ക്രിയയോടൊപ്പം על പ്രായശ്ചിത്തം ആർക്കുവേണ്ടിയാണ് നിർവഹിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: നിശ്ചിതരൂപത്തിലുള്ള പൗരോഹിത്യപദത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാള പരിഭാഷ.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: വിശുദ്ധമന്ദിരാരാധനയുടെ പശ്ചാത്തലത്തിൽ യഹ്‌വെയുടെ മുമ്പിൽ, അവിടുത്തെ സാന്നിധ്യത്തിൽ എന്ന അർഥം നൽകുന്നു.
- source_word: וְנִסְלַח לוֹ
  choice: അവന് ക്ഷമ ലഭിക്കും
  rationale: סלח എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള ഫലപ്രധാനമായ നിഷ്ക്രിയ അർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ക്ഷമിക്കുന്നവൻ ദൈവമാണെന്ന സൂചന നിലനിർത്തുന്നു, എന്നാൽ വാചകത്തിൽ ഇല്ലാത്ത കർത്താവിനെ തുറന്നുപറയുന്നില്ല.
- source_word: עַל אַחַת מִכֹּל
  choice: ഇത്തരം ഏതൊരു പ്രവൃത്തിയെ സംബന്ധിച്ചും
  rationale: മുഴുവൻ വിഭാഗത്തിൽപ്പെടുന്ന ഏതെങ്കിലും ഒറ്റ കുറ്റകൃത്യത്തെയും ഉൾക്കൊള്ളുന്ന വിതരണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: കുറ്റം വരുത്തുന്ന ... പ്രവൃത്തി
  rationale: അക്ഷരാർഥത്തിൽ ‘അത് ചെയ്തുകൊണ്ട് കുറ്റക്കാരനാകുക’ എന്ന ബന്ധം മലയാളത്തിൽ ചുരുക്കമായും വ്യക്തമായും അവതരിപ്പിക്കുന്നു; ഇവിടെ ആശയം കുറ്റയാഗമല്ല, പ്രവൃത്തിമൂലം വരുന്ന കുറ്റബോധ്യതയാണ്.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָה എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനനാമംകൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളലിപിയിൽ പ്രതിനിധീകരിക്കുന്നു.
- issue: ക്ഷമിക്കുന്ന കർത്താവിനെ വ്യക്തമാക്കണമോ
  choice: നിഷ്ക്രിയ ഫലപ്രയോഗമായ ‘അവന് ക്ഷമ ലഭിക്കും’ നിലനിർത്തി
  alternative: ‘ദൈവം അവനോടു ക്ഷമിക്കും’
  rationale: മൂലപാഠം ക്ഷമിക്കുന്നവനെ നേരിട്ട് പേരെടുത്തുപറയുന്നില്ല. സന്ദർഭത്തിൽ അത് യഹ്‌വെയാണെന്ന് വ്യക്തമാണെങ്കിലും പരിഭാഷ ആ കർത്താവിനെ പാഠത്തിൽ ചേർക്കാതെ മൂലത്തിലെ നിഷ്ക്രിയത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. യാഗാരാധനാപരമായ സാങ്കേതികത നിലനിർത്താൻ ‘പ്രായശ്ചിത്തം’ ഉപയോഗിച്ചു; അതേസമയം അവസാന എബ്രായ വാക്യഘടനയുടെ അസ്വാഭാവികത മുഖ്യപാഠത്തിൽ സ്വാഭാവിക മലയാളമാക്കി, കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകി.
