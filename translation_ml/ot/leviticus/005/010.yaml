source:
  edition: WLC
  text: וְ/אֶת הַ/שֵּׁנִ֛י יַעֲשֶׂ֥ה עֹלָ֖ה כַּ/מִּשְׁפָּ֑ט וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: ml
  text: രണ്ടാമത്തേതിനെ ചട്ടപ്രകാരം[a] ഹോമയാഗമായി അർപ്പിക്കണം. അവൻ ചെയ്ത പാപത്തിനുവേണ്ടി പുരോഹിതൻ അവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം; അപ്പോൾ അവനു ക്ഷമ ലഭിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിശ്ചയിക്കപ്പെട്ട നടപടിക്രമമനുസരിച്ച്.’
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രുവിൽ നിഷ്ക്രിയപ്രയോഗമാണ്: ‘അവനോടു ക്ഷമിക്കപ്പെടും.’ ക്ഷമിക്കുന്ന ദൈവിക കർത്താവിനെ വാക്യം നേരിട്ട് പറയുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: രണ്ടാമത്തേതിനെ
  rationale: മുൻവാക്യത്തിലെ രണ്ടാമത്തെ പക്ഷിയെയാണ് ഈ ക്രമസംഖ്യ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭോചിതവും നേരിട്ടുള്ളതുമായ പ്രയോഗം.
- source_word: יַעֲשֶׂה עֹלָה
  choice: ഹോമയാഗമായി അർപ്പിക്കണം
  rationale: עשה എന്ന വിശാലാർഥ ക്രിയയെ യാഗകർമസന്ദർഭത്തിന് സ്വാഭാവികമായി ‘അർപ്പിക്കണം’ എന്നു നൽകി; עֹלָהയ്ക്ക് ലേവ്യപുസ്തകത്തിൽ പ്രചാരമുള്ള ‘ഹോമയാഗം’ ഉപയോഗിച്ചു.
- source_word: כַּמִּשְׁפָּט
  choice: ചട്ടപ്രകാരം
  rationale: നിശ്ചയിക്കപ്പെട്ട യാഗക്രമത്തെയോ നിയമത്തെയോ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും ഔപചാരികവുമായ മലയാളം; നടപടിക്രമം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְכִפֶּר עָלָיו
  choice: അവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: പുരോഹിത യാഗഭാഷയിലെ כפר എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരവും ആചാരപരവുമായ വ്യാപ്തി ചുരുക്കാതെ പരമ്പരാഗതവും മനസ്സിലാകുന്നതുമായ പ്രയോഗം.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: അവൻ ചെയ്ത പാപത്തിനുവേണ്ടി
  rationale: ഹീബ്രു ആവർത്തനഘടനയെ അസ്വാഭാവികമായി പകർത്താതെ, പ്രായശ്ചിത്തത്തിന്റെ കാരണമായ പാപത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְנִסְלַח לוֹ
  choice: അവനു ക്ഷമ ലഭിക്കും
  rationale: ക്ഷമിക്കുന്ന ദൈവിക കർത്താവിനെ ഹീബ്രുവിനെപ്പോലെ പരാമർശിക്കാതെ വിടുകയും, ആ നിഷ്ക്രിയ ആശയം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പുരോഹിത പ്രായശ്ചിത്തഭാഷയെ പിന്നീടുള്ള പ്രത്യേക സിദ്ധാന്തങ്ങളിലേക്ക് ചുരുക്കാതിരിക്കുക
  choice: അവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം
  alternative: അവനെ ശുദ്ധീകരിക്കണം / അവനു ക്ഷമ നേടിക്കൊടുക്കണം
  rationale: כפר എന്ന പദത്തിന്റെ യാഗപരവും ദൈവശാസ്ത്രപരവുമായ അർഥവ്യാപ്തി ‘പ്രായശ്ചിത്തം ചെയ്യുക’ നിലനിർത്തുന്നു; അതിനെ ശുദ്ധീകരണമെന്നോ ക്ഷമ നേടലെന്നോ മാത്രം നിർവചിക്കുന്നില്ല.
- issue: ക്ഷമയുടെ ദൈവിക കർത്താവിനെ പരോക്ഷമായി നിലനിർത്തുക
  choice: അവനു ക്ഷമ ലഭിക്കും
  alternative: യഹോവ അവനോടു ക്ഷമിക്കും / അവന്റെ പാപം ക്ഷമിക്കപ്പെടും
  rationale: ഹീബ്രു നിഷ്ക്രിയരൂപത്തിൽ ക്ഷമിക്കുന്നവനെ വ്യക്തമാക്കുന്നില്ല. തിരുവെഴുത്തിലെ ആ ദൈവഭക്തിപൂർവമായ പരോക്ഷത പ്രധാനവാചകത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാ-നിയമഭാഷ. ‘ഹോമയാഗം,’ ‘പുരോഹിതൻ,’ ‘പ്രായശ്ചിത്തം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
