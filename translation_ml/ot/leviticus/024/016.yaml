revisions:
- from: യഹോവയുടെ നാമത്തെ ദുഷിക്കുന്നവൻ[a] നിശ്ചയമായും വധിക്കപ്പെടണം; സഭ മുഴുവനും അവനെ കല്ലെറിഞ്ഞു കൊല്ലുകതന്നെ വേണം. പരദേശിയായാലും സ്വദേശിയായാലും, നാമത്തെ[b] ദുഷിക്കുമ്പോൾ അവൻ വധിക്കപ്പെടണം.
  to: യഹോവയുടെ നാമത്തെ ദൂഷിക്കുന്നവൻ[a] നിശ്ചയമായും വധിക്കപ്പെടണം; ജനസമൂഹം മുഴുവനും അവനെ തീർച്ചയായും കല്ലെറിഞ്ഞു കൊല്ലണം. പരദേശിയായാലും സ്വദേശിയായാലും, നാമത്തെ[b] ദൂഷിക്കുമ്പോൾ അവൻ വധിക്കപ്പെടണം.
  rationale: The revision retains the source’s legal register, passive death-penalty formulation, communal responsibility, and the debated semantic range of נקב. It replaces an unnatural Malayalam verb with the established term for blasphemy, renders עדה without a potentially church-specific association, and expresses the emphatic stoning formula more fluently. No interpretive or denominational expansion has been introduced.
