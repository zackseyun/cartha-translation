id: LEV.24.16
reference: Leviticus 24:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: ml
  text: യഹോവയുടെ നാമത്തെ ദൂഷിക്കുന്നവൻ[a] നിശ്ചയമായും വധിക്കപ്പെടണം; ജനസമൂഹം മുഴുവനും അവനെ തീർച്ചയായും കല്ലെറിഞ്ഞു കൊല്ലണം. പരദേശിയായാലും സ്വദേശിയായാലും, നാമത്തെ[b] ദൂഷിക്കുമ്പോൾ അവൻ വധിക്കപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയുടെ നാമം ഉച്ചരിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘യഹോവയുടെ നാമത്തെ ശപിക്കുന്നവൻ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് വ്യക്തമായി ഉച്ചരിക്കുക എന്നും, ഈ സാഹചര്യത്തിൽ നിന്ദിക്കുക അഥവാ ശപിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ എബ്രായത്തിൽ ‘നാമം’ എന്നുമാത്രമാണ്; അത് യഹോവയുടെ ദൈവനാമത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക പകരപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב / בְּנָקְבוֹ
  choice: ദുഷിക്കുന്നവൻ / ദുഷിക്കുമ്പോൾ
  rationale: נקב എന്ന ക്രിയയ്ക്ക് ‘വ്യക്തമായി ഉച്ചരിക്കുക/പേര് പറയുക’ എന്നും ഈ സാഹചര്യത്തിൽ ‘നിന്ദിക്കുക, ദുഷിക്കുക’ എന്നും അർഥസാധ്യതകളുണ്ട്. മരണശിക്ഷ നിർദേശിക്കുന്ന നിയമസന്ദർഭത്തിൽ ദൈവനാമത്തെ അവഹേളനപരമായി ഉപയോഗിക്കുന്ന കുറ്റം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ‘ദുഷിക്കുക’ തിരഞ്ഞെടുത്തു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: שֵׁם יְהוָה
  choice: യഹോവയുടെ നാമം
  rationale: שֵׁם എന്നത് ‘നാമം’; יְהוָה എന്ന ദൈവനാമം മലയാളത്തിൽ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു. പൊതുവായ ഒരു സ്ഥാനപദം ഉപയോഗിക്കാതെ മൂലപാഠത്തിലെ ഉടമ്പടിനാമം നിലനിർത്തുന്നു.
- source_word: מוֹת יוּמָת
  choice: നിശ്ചയമായും വധിക്കപ്പെടണം
  rationale: ക്രിയയുടെ infinitive absolute-ഉം finite passive രൂപവും ചേർന്ന നിയമപരമായ ഊന്നൽ, നിർബന്ധവും ഉറപ്പും ഉൾക്കൊള്ളുന്ന ‘നിശ്ചയമായും’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി; passive ഭാവവും സംരക്ഷിച്ചു.
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: അവനെ കല്ലെറിഞ്ഞു കൊല്ലുകതന്നെ വേണം
  rationale: അതേ ധാതുവിന്റെ ആവർത്തനം നൽകുന്ന ഊന്നൽ ‘തന്നെ വേണം’ എന്നതിലൂടെ അറിയിച്ചു. വധശിക്ഷയുടെ രീതിയാണെന്നത് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി വരാൻ ‘കല്ലെറിഞ്ഞു കൊല്ലുക’ എന്നു നൽകി.
- source_word: כָּל הָעֵדָה
  choice: സഭ മുഴുവനും
  rationale: עֵדָה ഇവിടെ നിയമവിധി നടപ്പാക്കുന്ന ഒത്തുകൂടിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ’ ഔപചാരികവും വായനാസൗകര്യമുള്ളതുമായ മലയാളപദമാണ്.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: പരദേശിയായാലും സ്വദേശിയായാലും
  rationale: גֵּר ഇസ്രായേലിൽ പാർക്കുന്ന സ്വദേശിയല്ലാത്തവനെയും אֶזְרָח സ്വദേശിയെയും സൂചിപ്പിക്കുന്നു. നിയമം ഇരുവർക്കും ഒരുപോലെ ബാധകമാണെന്ന സമാന്തരത ഈ ജോടി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּנָקְבוֹ שֵׁם
  choice: നാമത്തെ ദുഷിക്കുമ്പോൾ
  rationale: בְּ + infinitive construct ഇവിടെ കാലിക/സാഹചര്യാർഥത്തിൽ ‘ചെയ്യുമ്പോൾ’ എന്നു വിവർത്തനം ചെയ്തു. שֵׁם ഒറ്റയ്ക്ക് വന്നിടത്ത് ദൈവനാമത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക പകരപ്രയോഗം നിലനിർത്താൻ ‘നാമം’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ടെട്രാഗ്രാമറ്റൺ നേരിട്ട് ഉള്ളതിനാൽ പൊതുവായ സ്ഥാനപദത്തിനു പകരം ദൈവത്തിന്റെ സവിശേഷ നാമം മലയാളത്തിലെ പരിചിതരൂപമായ ‘യഹോവ’ എന്നു നൽകി.
- issue: ദൈവനാമത്തോടൊപ്പമുള്ള נקב എന്ന ക്രിയയുടെ അർഥം
  choice: ദുഷിക്കുക
  alternative: ഉച്ചരിക്കുക; ശപിക്കുക
  rationale: ഈ നിയമസന്ദർഭത്തിൽ കുറ്റകരമായ നാമദൂഷണം മുഖ്യസാധ്യതയാണ്. എന്നാൽ ക്രിയയുടെ ‘വ്യക്തമായി പറയുക/ഉച്ചരിക്കുക’ എന്ന പദാർഥസാധ്യതയും ‘ശപിക്കുക’ എന്ന ശക്തമായ വ്യാഖ്യാനവും പൂർണമായി ഒഴിവാക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: അവസാനത്തെ שֵׁם എന്ന ഒറ്റപ്രയോഗം
  choice: നാമം
  alternative: യഹോവയുടെ നാമം
  rationale: മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും ആദരസൂചകമായ ‘നാമം’ എന്ന പകരപ്രയോഗവും നിലനിർത്തി; ഉദ്ദേശിക്കുന്നത് യഹോവയുടെ നാമമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. ‘നിശ്ചയമായും’, ‘തന്നെ വേണം’ എന്നീ പ്രയോഗങ്ങൾ എബ്രായത്തിലെ ഇരട്ട ഊന്നൽരൂപങ്ങൾ വേർതിരിച്ചറിയാൻ സഹായിക്കുന്നു. ‘പരദേശി/സ്വദേശി’ എന്ന ജോടി സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഔപചാരികവുമാണ്; പ്രത്യേക സഭാപാരമ്പര്യങ്ങളുടെ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
