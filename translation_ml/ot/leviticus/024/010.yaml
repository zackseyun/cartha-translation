base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: ml
  text: ഒരു ഇസ്രായേല്യസ്ത്രീയുടെ മകൻ—അവന്റെ പിതാവ് ഒരു ഈജിപ്തുകാരനായിരുന്നു—ഇസ്രായേൽമക്കളുടെ ഇടയിൽ പുറപ്പെട്ടു. പാളയത്തിൽവെച്ച് ആ ഇസ്രായേല്യസ്ത്രീയുടെ മകനും ഒരു ഇസ്രായേല്യപുരുഷനും തമ്മിൽ പൊരുതി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തമ്മിൽ വഴക്കിട്ടു.” ഈ ക്രിയ വാക്കുതർക്കത്തെയോ പോരാട്ടത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം വ്യക്തമാക്കുന്ന സഞ്ചാരം നിലനിർത്തുന്നു; എവിടെനിന്നാണ് പുറപ്പെട്ടതെന്ന് മൂലപാഠം പറയാത്തതിനാൽ അതു ചേർത്തിട്ടില്ല.
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  choice: ഒരു ഇസ്രായേല്യസ്ത്രീയുടെ മകൻ
  rationale: മാതൃവംശപരമായ തിരിച്ചറിയൽ സ്വാഭാവികമായ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു; തുടർന്ന് വരുന്ന ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  choice: അവന്റെ അപ്പൻ ഒരു ഈജിപ്തുകാരനായിരുന്നു
  rationale: ഹീബ്രു വാക്യഘടനയുടെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; പിതൃപരമായ തിരിച്ചറിയൽ മാത്രം വ്യക്തമാക്കുന്നു.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിലേക്ക്
  rationale: בְּתוֹךְ എന്നതിന്റെ ‘ഇടയിൽ/മധ്യേ’ എന്ന അർഥവും בְּנֵי יִשְׂרָאֵל എന്ന പരമ്പരാഗത ദേശീയ-ഉടമ്പടിപദപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: וַיִּנָּצוּ
  choice: തമ്മിൽ പൊരുതി
  rationale: ക്രിയയ്ക്ക് വാക്കുതർക്കത്തെയും ശാരീരിക പോരാട്ടത്തെയും സൂചിപ്പിക്കാനാകുന്നു. സന്ദർഭത്തിലെ സംഘർഷവും തുടർന്നുള്ള രൂക്ഷതയും കണക്കിലെടുത്ത് ‘പൊരുതി’ തെരഞ്ഞെടുത്തു; വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בַּמַּחֲנֶה
  choice: പാളയത്തിൽവെച്ച്
  rationale: ഇസ്രായേൽജനത്തിന്റെ പാളയത്തിനുള്ളിലെ സംഭവസ്ഥലം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: ആ ഇസ്രായേല്യസ്ത്രീയുടെ മകൻ
  rationale: തിരിച്ചറിയലിനും സാഹിത്യപരമായ ഊന്നലിനുമായി മൂലപാഠത്തിലെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: ഒരു ഇസ്രായേല്യപുരുഷൻ
  rationale: മിശ്രപാരമ്പര്യമുള്ള ആ മനുഷ്യനോട് വിരുദ്ധമായി മറ്റെയാളെ ഇസ്രായേല്യനായി തിരിച്ചറിയുന്ന മൂലപാഠത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക ദേശീയ അഭിധാനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഇവിടെ ഈ പ്രയോഗം ജനതയുടെ പതിവായ ദേശീയ-ഉടമ്പടി അഭിധാനമാണ്. ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകുന്നത് ഹീബ്രു രൂപത്തോടുള്ള ബന്ധം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ദീർഘമായ ആദ്യവാക്യത്തിന്റെ ബന്ധങ്ങൾ വ്യക്തമായി കാണിക്കാൻ പിതൃവിവരം ഡാഷുകൾക്കിടയിൽ നൽകി. മൂലപാഠത്തിലെ തിരിച്ചറിയൽ-ആവർത്തനം ഒഴിവാക്കിയിട്ടില്ല.
