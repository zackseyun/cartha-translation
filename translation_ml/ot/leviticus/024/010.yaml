  source_fidelity: The directional phrase “ഇടയിലേക്കു” (‘into/among’) does not precisely render Hebrew בְּתוֹךְ, which is locative (‘among/in the midst of’). Changing it to “ഇടയിൽ” preserves the source wording without implying movement into the group. The paternal clause and the repeated maternal identification accurately convey the Hebrew sense.
