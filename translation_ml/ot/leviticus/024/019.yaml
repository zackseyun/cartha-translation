language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יִתֵּ֥ן מ֖וּם בַּ/עֲמִית֑/וֹ כַּ/אֲשֶׁ֣ר עָשָׂ֔ה כֵּ֖ן יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: ml
  text: ഒരുവൻ തന്റെ കൂട്ടുകാരന് പരിക്കേൽപ്പിച്ചാൽ,[a] അവൻ ചെയ്തതുപോലെതന്നെ അവനോടും ചെയ്യപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “തന്റെ കൂട്ടുകാരന് ഒരു ഊനമോ വൈകല്യമോ വരുത്തിയാൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: ഒരുവൻ ... ചെയ്താൽ
  rationale: നിയമപരമായ സോപാധിക പ്രയോഗമായ כִּיയെ സ്വാഭാവിക മലയാളത്തിൽ ‘-ച്ചാൽ’ എന്നു നൽകി; אִישׁ എന്ന ഏകവചനത്തെ ‘ഒരുവൻ’ എന്നു നിലനിർത്തി.
- source_word: יִתֵּן מוּם
  choice: പരിക്കേൽപ്പിച്ചാൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘വൈകല്യം/ഊനം നൽകുക’ എന്നാണെങ്കിലും, ഇവിടെ ശരീരഹാനിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പരിക്കേൽപ്പിക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בַּעֲמִיתוֹ
  choice: തന്റെ സഹജീവിക്കു
  rationale: עָמִית സമൂഹത്തിലെ മറ്റൊരംഗത്തെയോ കൂട്ടാളിയെയോ സൂചിപ്പിക്കുന്നു. ‘സഹജീവി’ ബന്ധപരമായ വിശാലത നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി ഗ്രഹിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതുപോലെതന്നെ
  rationale: ഹീബ്രുവിലെ താരതമ്യവും തുല്യാനുപാതത്തിന്റെ ഊന്നലും ‘പോലെതന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: അവനോടും ചെയ്യണം
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണിപരവും നിയമപരവുമായ അർഥം മലയാളത്തിലെ അനൈച്ഛിക നിയമനിർദേശമായ ‘ചെയ്യണം’ വഴി സ്വാഭാവികമായി നൽകി; സ്വകാര്യ പ്രതികാരമെന്ന ആശയം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: നിയമസന്ദർഭത്തിലെ തുല്യപ്രതികാര തത്ത്വം
  choice: ചെയ്ത ഹാനിക്കനുസരിച്ചുള്ള ന്യായപരമായ പ്രതിഫലനമായി വിവർത്തനം ചെയ്തു.
  alternative: വ്യക്തിപരമായ പ്രതികാരത്തിന് അനുമതി നൽകുന്നതായി വ്യാഖ്യാനിക്കുന്ന പരാവർത്തനം.
  rationale: ഹീബ്രു വാക്യം ആനുപാതികമായ നിയമനടപടിയാണ് പ്രസ്താവിക്കുന്നത്. കർമണിപ്രയോഗത്തിന്റെ ന്യായപരമായ അനിശ്ചിത കർത്തൃത്വം നിലനിർത്തി, സ്വകാര്യ പ്രതികാരം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ നിയമഭാഷ. വാക്യത്തിന്റെ ആനുപാതിക ഘടന നിലനിർത്തിക്കൊണ്ട് കടുപ്പമുള്ള അക്ഷരാനുവാദം ഒഴിവാക്കി.
