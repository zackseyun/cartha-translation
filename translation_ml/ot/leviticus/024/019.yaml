  to: ഒരുവൻ തന്റെ കൂട്ടുകാരന് പരിക്കേൽപ്പിച്ചാൽ,[a] അവൻ ചെയ്തതുപോലെതന്നെ അവനോടും ചെയ്യപ്പെടണം.
