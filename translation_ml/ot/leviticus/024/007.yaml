- from: ഓരോ നിരയുടെയും മുകളിൽ ശുദ്ധമായ കുന്തിരിക്കം വെക്കണം[a]. അത് അപ്പത്തിനുവേണ്ടിയുള്ള സ്മാരകാംശമായി, യഹ്‌വേക്കുള്ള ദഹനയാഗമായി തീരും[b].
  to: ഓരോ അപ്പനിരയ്ക്കുമേൽ ശുദ്ധമായ കുന്തിരിക്കം വെക്കണം[a]. അത് അപ്പത്തിനുവേണ്ടി സ്മാരകാംശമായും യഹ്‌വേക്കുള്ള തീയിൽ അർപ്പിക്കുന്ന വഴിപാടായും ഇരിക്കണം[b].
  rationale: The revision replaces the overly specific “ദഹനയാഗം” with a source-faithful expression for an offering made by fire, while retaining the ritual relationship of the frankincense to the bread. It also refines the lexical-alternative footnote for הַמַּעֲרֶכֶת. Both original footnote anchors are retained.
