reference: Leviticus 24:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַתָּ֥ עַל הַֽ/מַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְ/הָיְתָ֤ה לַ/לֶּ֨חֶם֙ לְ/אַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: ml
  text: ഓരോ അപ്പനിരയ്ക്കുമേൽ ശുദ്ധമായ കുന്തിരിക്കം വെക്കണം[a]. അത് അപ്പത്തിനുവേണ്ടി സ്മാരകാംശമായും യഹ്‌വേക്കുള്ള തീയിൽ അർപ്പിക്കുന്ന വഴിപാടായും ഇരിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രമീകരണത്തിന്മേൽ’; സന്ദർഭത്തിൽ ഇത് ക്രമമായി അടുക്കിയ അപ്പനിരകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഭക്ഷ്യയാഗമായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: വെക്കണം
  rationale: ആചാരനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ വാവ് ചേർന്ന ഖാൽ പൂർണക്രിയ ആജ്ഞാർത്ഥം വഹിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘വെക്കണം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַמַּעֲרֶכֶת
  choice: ഓരോ നിര
  rationale: മുൻവാക്യത്തിലെ അപ്പങ്ങളുടെ രണ്ടു ക്രമീകൃത നിരകളെയാണ് ഏകവചനസമൂഹനാമം വിതരണാർത്ഥത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: לְבֹנָה זַכָּה
  choice: ശുദ്ധമായ കുന്തിരിക്കം
  rationale: ലְבֹנָה സുഗന്ധധൂപത്തിനുപയോഗിക്കുന്ന resin ആയ കുന്തിരിക്കത്തെയും זַכָּה അതിന്റെ ആചാരപരമായ ശുദ്ധിയെയും സൂചിപ്പിക്കുന്നു.
- source_word: לְאַזְכָּרָה
  choice: സ്മാരകാംശമായി
  rationale: യാഗത്തെ ദൈവസന്നിധിയിൽ ഓർമപ്പെടുത്തുന്ന പ്രതിനിധിയാഗാംശം എന്ന പുരോഹിതപരമായ സാങ്കേതിക അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אִשֶּׁה
  choice: ദഹനയാഗമായി
  rationale: തീയിൽ അർപ്പിക്കുന്ന യാഗം എന്ന പുരോഹിതഭാഷയിലെ ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പദത്തിന്റെ വ്യുത്പത്തിയും പ്രയോഗപരമായ മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה മറച്ചുവയ്ക്കാതെ ശബ്ദാന്തരം ചെയ്ത്, സമർപ്പണത്തിന്റെ ദിശ സൂചിപ്പിക്കുന്ന לְ-യും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്യുന്നു.
- issue: לְאַזְכָּרָה എന്ന യാഗസാങ്കേതിക പദത്തിന്റെ അർഥം
  choice: സ്മാരകാംശം
  alternative: സ്മരണയ്ക്കായി; ഓർമയാഗമായി
  rationale: ഇത് മനുഷ്യരുടെ മാനസിക ഓർമ മാത്രമാണെന്ന് നിർണ്ണയിക്കാതെ, മുഴുവൻ അപ്പസമർപ്പണത്തെ പ്രതിനിധീകരിക്കുന്ന യാഗാംശം എന്ന ആചാരപരമായ ധ്വനി സംരക്ഷിക്കുന്നു.
- issue: אִשֶּׁה എന്ന പദത്തിന്റെ യാഗപരമായ വ്യാഖ്യാനം
  choice: ദഹനയാഗം
  alternative: തീയിൽ അർപ്പിക്കുന്ന യാഗം; ഭക്ഷ്യയാഗം
  rationale: തീമുഖേന അർപ്പിക്കുന്ന സമർപ്പണം എന്ന പരമ്പരാഗത പുരോഹിതപ്രയോഗം വ്യക്തമാക്കുന്നു; ‘ഭക്ഷ്യം’ എന്ന വ്യാഖ്യാനം പാഠത്തിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ പുരോഹിതാചാരത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘കുന്തിരിക്കം’, ‘സ്മാരകാംശം’, ‘ദഹനയാഗം’ എന്നീ പദങ്ങൾ സന്ദർഭസൂക്ഷ്മതയ്ക്കായി ഉപയോഗിച്ചു; എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
