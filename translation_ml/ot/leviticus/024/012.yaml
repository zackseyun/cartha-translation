  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּנִּיחֻ֖/הוּ בַּ/מִּשְׁמָ֑ר לִ/פְרֹ֥שׁ לָ/הֶ֖ם עַל פִּ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: ml
  text: യഹ്‌വേയുടെ വചനപ്രകാരം അവർക്കു വ്യക്തമാക്കേണ്ടതിന് അവർ അവനെ കാവലിൽ പാർപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർക്കു വ്യക്തമായി പ്രഖ്യാപിക്കേണ്ടതിന്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയയ്ക്ക് ഒരു കാര്യം വ്യക്തമാക്കുക, തെളിച്ചുപറയുക എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: അവർ അവനെ … പാർപ്പിച്ചു
  rationale: ഹിഫ്ഇൽ രൂപത്തിന് ഇവിടെ ‘വെക്കുക, പാർപ്പിക്കുക’ എന്ന അർഥമാണ്; തുടർച്ചയായ ആഖ്യാനക്രമം സ്വാഭാവികമായ മലയാള വാക്യത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּמִּשְׁמָר
  choice: കാവലിൽ
  rationale: മִשְׁמָר ഇവിടെ വെറും നിരീക്ഷണമല്ല, കാവലോടുകൂടിയ തടങ്കലിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കാവലിൽ പാർപ്പിച്ചു’ നിയമപരമായ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: לִפְרֹשׁ
  choice: കാര്യം … വ്യക്തമാക്കേണ്ടതിന്
  rationale: פרשׁ എന്ന ക്രിയയ്ക്ക് ‘വ്യക്തമാക്കുക, തെളിച്ചുപറയുക’ എന്ന അർഥമുണ്ട്. ഹീബ്രുവിൽ കർമം തുറന്നുപറയാത്തതിനാൽ, മലയാളത്തിലെ വ്യക്തതയ്ക്കായി പൊതുവായ ‘കാര്യം’ ചേർത്തു; പ്രത്യേകമായി ‘വിധി’ എന്നു വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: לָהֶם
  choice: അവർക്കു
  rationale: വ്യക്തത ലഭിക്കേണ്ടവരെയാണ് ഈ സർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘അവർക്കു’ സ്വാഭാവികമാണ്.
- source_word: עַל־פִּי
  choice: വചനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘വായനുസരിച്ച്’ എന്ന ഈ പ്രയോഗം അധികാരപൂർവമായ അരുളപ്പാടിനോടുള്ള അനുസരണത്തെ സൂചിപ്പിക്കുന്നു; ‘വചനപ്രകാരം’ വാക്കിന്റെയും അധികാരത്തിന്റെയും ഭാവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: വ്യക്തമാക്കേണ്ടത് എന്താണെന്നത്
  choice: പൊതുവായ ‘കാര്യം’
  alternative: വിധി / തീരുമാനം
  rationale: ഹീബ്രു ക്രിയയ്ക്ക് വ്യക്തമായ കർമം നൽകിയിട്ടില്ല. നിയമപരമായ പശ്ചാത്തലം ഒരു വിധിയെ സൂചിപ്പിക്കാമെങ്കിലും, മൂലത്തിലെ തുറന്ന നില സംരക്ഷിക്കാൻ കൂടുതൽ പൊതുവായ പദം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ആഖ്യാന ശൈലി. ‘തടങ്കൽ’ എന്ന സാങ്കേതിക പദത്തേക്കാൾ സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ ‘കാവലിൽ പാർപ്പിച്ചു’ തിരഞ്ഞെടുത്തു.
