  text: עַ֚ל הַ/מְּנֹרָ֣ה הַ/טְּהֹרָ֔ה יַעֲרֹ֖ךְ אֶת הַ/נֵּר֑וֹת לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/004.yaml
  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: ml
  text: ശുദ്ധമായ നിലവിളക്കിന്മേൽ അവൻ വിളക്കുകൾ യഹ്‌വെയുടെ സന്നിധിയിൽ നിരന്തരം ക്രമപ്പെടുത്തി വെക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ഇവിടെ ദൈവനാമമായ യഹ്‌വെ (YHWH) വരുന്നു.
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപത്തെക്കുറിച്ചുള്ള പാഠവിവരം
lexical_decisions:
- source_word: עַל
  choice: മേൽ
  rationale: വിളക്കുതണ്ടുമായി ബന്ധപ്പെട്ട വിളക്കുകളുടെ സ്ഥാനം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: הַמְּנֹרָה
  choice: വിളക്കുതണ്ട്
  rationale: ആരാധനാസംബന്ധിയായ പ്രത്യേക ദീപാധാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും ‘വിളക്ക്’ എന്നതിനെക്കാൾ കൃത്യം.
- source_word: הַטְּהֹרָה
  choice: ശുദ്ധമായ
  rationale: പുരോഹിതീയ പശ്ചാത്തലത്തിലെ ശുദ്ധസ്ഥിതിയെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יַעֲרֹךְ
  choice: ക്രമീകരിക്കണം
  rationale: ക്രമത്തിൽ വെക്കുക എന്ന പ്രവർത്തി വ്യക്തമാക്കുന്നു; പരിപാലിക്കുക എന്ന വിശാലമായ ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: הַנֵּרוֹת
  choice: വിളക്കുകൾ
  rationale: വിളക്കുതണ്ടിലെ ഓരോ ദീപത്തെയും നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ആരാധനാസന്ദർഭത്തിലെ ‘മുമ്പാകെ/സന്നിധിയിൽ’ എന്ന അർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ YHWH-നെ ഒരു പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: תָּמִיד
  choice: നിരന്തരം
  rationale: ക്രമമായി തുടരുന്ന ആരാധനാക്രമത്തിന്റെ തുടർച്ച നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അത് പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: תָּמִיד സൂചിപ്പിക്കുന്ന തുടർച്ച
  choice: നിരന്തരം
  alternative: പതിവായി
  rationale: തുടർച്ചയും ക്രമമായ ആവർത്തനവും ഉൾക്കൊള്ളാവുന്ന മൂലപദത്തിന്റെ വ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആരാധനാസംബന്ധിയായ സാങ്കേതികത നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ സംസ്കൃതഭാരം ഒഴിവാക്കി.
