- from: ശുദ്ധമായ വിളക്കുതണ്ടിന്മേൽ അവൻ വിളക്കുകൾ യഹ്‌വെയുടെ സന്നിധിയിൽ നിരന്തരം ക്രമീകരിക്കണം.[a]
  to: ശുദ്ധമായ നിലവിളക്കിന്മേൽ അവൻ വിളക്കുകൾ യഹ്‌വെയുടെ സന്നിധിയിൽ നിരന്തരം ക്രമപ്പെടുത്തി വെക്കണം.[a]
