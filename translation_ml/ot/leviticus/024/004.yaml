review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the pure lampstand, the lamps, their placement before Yahweh, and the ongoing nature of the rite. The modal construction appropriately reflects the Hebrew instructional imperfect.
  naturalness: ‘വിളക്കുതണ്ട്’ is not the most natural Malayalam term for the cultic lampstand and can suggest a component of a lamp rather than the stand itself. ‘നിലവിളക്ക്’ is clear, established, and natural in this context. ‘ക്രമപ്പെടുത്തി വെക്കണം’ more idiomatically conveys the deliberate setting in order intended by יַעֲרֹךְ.
  terminology: ‘ശുദ്ധമായ,’ ‘യഹ്‌വെയുടെ സന്നിധിയിൽ,’ and ‘നിരന്തരം’ suitably preserve the priestly register, the divine name, and תָּמִיד. The footnote should identify the transliterated divine name consistently in Malayalam while retaining YHWH as the source-form reference.
  issues:
  - severity: medium
    issue: ‘വിളക്കുതണ്ട്’ is imprecise and somewhat unnatural for מְנוֹרָה.
    rationale: The Hebrew refers to the cultic lampstand as a whole. ‘നിലവിളക്ക്’ is the standard natural Malayalam designation and avoids the possible sense of a lamp’s stem or wick.
  - severity: low
    issue: ‘ക്രമീകരിക്കണം’ is serviceable but less idiomatic in this ritual action.
    rationale: ‘ക്രമപ്പെടുത്തി വെക്കണം’ directly expresses setting the lamps in order without expanding the action into general maintenance.
  revised_text: ശുദ്ധമായ നിലവിളക്കിന്മേൽ അവൻ വിളക്കുകൾ യഹ്‌വെയുടെ സന്നിധിയിൽ നിരന്തരം ക്രമപ്പെടുത്തി വെക്കണം.[a]
