source:
  edition: WLC
  text: שֶׁ֚בֶר תַּ֣חַת שֶׁ֔בֶר עַ֚יִן תַּ֣חַת עַ֔יִן שֵׁ֖ן תַּ֣חַת שֵׁ֑ן כַּ/אֲשֶׁ֨ר יִתֵּ֥ן מוּם֙ בָּֽ/אָדָ֔ם כֵּ֖ן יִנָּ֥תֶן בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/020.yaml
  text: fracture for fracture[a], eye for eye, tooth for tooth; as he inflicts an injury on a person[b], so it shall be inflicted on him.
translation:
  language: ml
  text: ഒടിവിനു പകരം ഒടിവ്, കണ്ണിനു പകരം കണ്ണ്, പല്ലിനു പകരം പല്ല്; ഒരാൾ ഒരു വ്യക്തിക്കു പരിക്കേൽപ്പിക്കുന്നതുപോലെ[a], അതുപോലെതന്നെ അയാൾക്കും പരിക്കേൽപ്പിക്കപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു മനുഷ്യനിൽ വൈകല്യം/ഊനം വരുത്തുന്നതുപോലെ.’ ഇവിടെ എബ്രായഭാഷയിൽ ‘വൈകല്യം കൊടുക്കുക’ എന്ന പ്രയോഗമാണ്; അതിനെ പ്രധാനപാഠത്തിൽ ‘പരിക്കേൽപ്പിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבֶר
  choice: ഒടിവ്
  rationale: ശരീരത്തിനുണ്ടാകുന്ന പൊട്ടൽ അഥവാ അസ്ഥിയുടെ ഒടിവ് എന്ന നിയമസന്ദർഭത്തിലെ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: תַּחַת
  choice: പകരം
  rationale: പ്രതികാരനിയമസൂത്രത്തിൽ തുല്യമായ പ്രതിഫലം അഥവാ പകരം എന്ന ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַיִן
  choice: കണ്ണ്
  rationale: ശരീരാവയവത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പദം അതേപടി നിലനിർത്തുന്നു.
- source_word: שֵׁן
  choice: പല്ല്
  rationale: ശരീരാവയവത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പദം അതേപടി നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר
  choice: എന്നതുപോലെ
  rationale: ആദ്യ പ്രവൃത്തിയും അതിനൊത്ത നിയമഫലവും തമ്മിലുള്ള താരതമ്യം വ്യക്തമാക്കുന്നു.
- source_word: יִתֵּן מוּם
  choice: പരിക്കേൽപ്പിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘വൈകല്യം/ഊനം കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ മറ്റൊരാൾക്ക് ശാരീരിക ക്ഷതി വരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘പരിക്കേൽപ്പിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: אָדָם
  choice: ഒരാൾ / മറ്റൊരാൾ
  rationale: ഈ നിയമസന്ദർഭത്തിൽ ഒരു മനുഷ്യവ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്ന പ്രതിനിധി ഏകവചനമാണ്; മലയാളത്തിൽ ലിംഗനിരപേക്ഷമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: כֵּן
  choice: അങ്ങനെതന്നെ
  rationale: പ്രവൃത്തിക്കും നിയമഫലത്തിനുമിടയിലെ കൃത്യമായ അനുരൂപത നിലനിർത്തുന്നു.
- source_word: יִנָּתֶן בּוֹ
  choice: അയാൾക്കും അങ്ങനെതന്നെ ഏൽപ്പിക്കപ്പെടണം
  rationale: നിഫാൽ ക്രിയയുടെ നിഷ്ക്രിയരൂപവും മുൻപറഞ്ഞ പരിക്കിനോടുള്ള അനുരൂപതയും നിലനിർത്തുന്നു; ആരാണ് ശിക്ഷ നടപ്പാക്കുന്നതെന്ന് പാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പ്രതികാരനിയമസൂത്രത്തിന്റെ സ്വഭാവം
  choice: ‘ഒടിവിനു പകരം ഒടിവ്, കണ്ണിനു പകരം കണ്ണ്, പല്ലിനു പകരം പല്ല്’ എന്ന മൂർത്തമായ അനുരൂപസൂത്രം നിലനിർത്തി.
  alternative: ‘പരിക്കിനു തുല്യമായ നഷ്ടപരിഹാരം’ എന്ന അമൂർത്ത വ്യാഖ്യാനം.
  rationale: എബ്രായപാഠം ശരീരാവയവങ്ങളും പരിക്കും എടുത്തുപറയുന്ന അനുരൂപസൂത്രമാണ് നൽകുന്നത്. അത് നഷ്ടപരിഹാരമായി മാത്രം ചുരുക്കുന്നതോ മറ്റൊരു പ്രത്യേക നിയമവ്യാഖ്യാനം ചേർക്കുന്നതോ പരിഭാഷയുടെ പരിധി കടക്കും.
- issue: מוּם എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘പരിക്ക്’; അടിക്കുറിപ്പിൽ ‘വൈകല്യം/വിരൂപത’ എന്ന സാധ്യത സൂചിപ്പിച്ചു.
  alternative: പ്രധാനപാഠത്തിൽ ‘വൈകല്യം’ അല്ലെങ്കിൽ ‘വിരൂപത’.
  rationale: സന്ദർഭം ഒരാൾ മറ്റൊരാൾക്കുണ്ടാക്കുന്ന ശാരീരിക ക്ഷതത്തെക്കുറിച്ചാണ്; ‘പരിക്ക്’ വായനാസൗകര്യം നൽകുമ്പോൾ, മൂലപദത്തിന്റെ കൂടുതൽ പ്രത്യേകമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പ് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ആവർത്തനാത്മകമായ എബ്രായ നിയമസൂത്രത്തിന്റെ താളവും മൂർത്തതയും നിലനിർത്തി; അവസാനവാക്യത്തിലെ നിഷ്ക്രിയരൂപം സംരക്ഷിച്ച് ശിക്ഷ നടപ്പാക്കുന്ന വ്യക്തിയെയോ സംവിധാനത്തെയോ പാഠത്തിലേക്ക് പുതുതായി ചേർത്തിട്ടില്ല.
