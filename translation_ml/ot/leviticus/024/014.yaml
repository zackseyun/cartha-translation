- from: “ശപിച്ചവനെ പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുവരുക[a]. കേട്ടവരെല്ലാം അവന്റെ തലയിൽ തങ്ങളുടെ കൈകൾ വെക്കട്ടെ[b]. സഭ മുഴുവനും അവനെ കല്ലെറിയട്ടെ.”
  to: “ശപിച്ചവനെ പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോകുക[a]. കേട്ടവരെല്ലാം അവന്റെ തലയിൽ തങ്ങളുടെ കൈകൾ വെക്കട്ടെ[b]. മുഴുവൻ സമൂഹവും അവനെ കല്ലെറിഞ്ഞ് കൊല്ലട്ടെ.”
