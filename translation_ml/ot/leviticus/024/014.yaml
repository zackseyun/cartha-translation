  variant: modern standard Malayalam
source:
  edition: WLC
  text: הוֹצֵ֣א אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/סָמְכ֧וּ כָֽל הַ/שֹּׁמְעִ֛ים אֶת יְדֵי/הֶ֖ם עַל רֹאשׁ֑/וֹ וְ/רָגְמ֥וּ אֹת֖/וֹ כָּל הָ/עֵדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: ml
  text: “ശപിച്ചവനെ പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോകുക[a]. കേട്ടവരെല്ലാം അവന്റെ തലയിൽ തങ്ങളുടെ കൈകൾ വെക്കട്ടെ[b]. മുഴുവൻ സമൂഹവും അവനെ കല്ലെറിഞ്ഞ് കൊല്ലട്ടെ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവനിന്ദ ചെയ്തവനെ.” എബ്രായത്തിൽ അക്ഷരാർഥമായി “ശപിച്ചവനെ” എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ കൈകൾ വെക്കുന്നത് സാക്ഷികൾ കുറ്റക്കാരനെ ഔപചാരികമായി തിരിച്ചറിയുന്നതിനെ സൂചിപ്പിക്കുന്നതാകാം. ഇതിന് പ്രതീകാത്മകമായ അർഥവും ഉണ്ടായിരിക്കാമെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: പുറത്തേക്കു കൊണ്ടുവരുക
  rationale: ഹിഫീൽ ആജ്ഞാരൂപം ഒരാളെ പുറത്തേക്കു പോകാൻ ഇടയാക്കുക എന്നർഥം നൽകുന്നു; ലക്ഷ്യസ്ഥാനമായ ‘പാളയത്തിനു പുറത്ത്’ എന്ന പ്രയോഗത്തോടൊപ്പം മലയാളത്തിൽ ‘കൊണ്ടുവരുക’ സ്വാഭാവികമാണ്.
- source_word: הַמְקַלֵּל
  choice: ശപിച്ചവനെ
  rationale: קלל എന്ന ക്രിയയുടെ പങ്കാളിത്തരൂപം സന്ദർഭത്തിലെ പ്രത്യേക കുറ്റക്കാരനെ സൂചിപ്പിക്കുന്നു. ‘ദൈവദൂഷണം ചെയ്തവൻ’ എന്നു വ്യാഖ്യാനിച്ച് പ്രധാനപാഠത്തിൽ ചേർക്കാതെ, എബ്രായത്തിലെ ‘ശപിക്കുക’ എന്ന പദാർഥം നിലനിർത്തുന്നു.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തേക്കു
  rationale: സമൂഹത്തിന്റെ പാളയപരിധിക്കു പുറത്തേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള സ്ഥാനപ്രയോഗം.
- source_word: וְסָמְכוּ
  choice: വെക്കട്ടെ
  rationale: തലയിൽ കൈകൾ വെക്കുക എന്ന സ്ഥാപിതമായ പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; തുടർന്നുവരുന്ന നിർദേശാത്മക ഭാവം ‘വെക്കട്ടെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: כָל הַשֹּׁמְעִים
  choice: കേട്ടവരെല്ലാം
  rationale: എബ്രായത്തിൽ കേട്ട കാര്യമോ വ്യക്തിയോ കർമമായി വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ ‘അവനെ കേട്ടവർ’ എന്ന കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കി യഥാർഥ സംക്ഷിപ്തതയും അസ്പഷ്ടതയും സംരക്ഷിക്കുന്നു.
- source_word: יְדֵיהֶם עַל רֹאשׁוֹ
  choice: അവന്റെ തലയിൽ തങ്ങളുടെ കൈകൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനമായ ‘കൈകൾ’യും ഏകവചനമായ ‘തല’യും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וְרָגְמוּ אֹתוֹ
  choice: അവനെ കല്ലെറിയട്ടെ
  rationale: רגם കല്ലെറിഞ്ഞുള്ള ശിക്ഷയെ സൂചിപ്പിക്കുന്ന പതിവുപദമാണ്. ‘കൊല്ലട്ടെ’ എന്നു വ്യക്തമായി കൂട്ടിച്ചേർക്കാതെ മൂലപാഠത്തിന്റെ ക്രിയ നേരിട്ട് പകരുന്നു.
- source_word: כָל הָעֵדָה
  choice: സഭ മുഴുവനും
  rationale: עֵדָה ഉടമ്പടിസമൂഹത്തെ കൂട്ടായ നിലയിൽ സൂചിപ്പിക്കുന്നു; ‘സഭ മുഴുവനും’ ഔപചാരികമായ സാമൂഹിക അർഥവും വായനാസൗകര്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുറ്റക്കാരനെ ‘ശപിച്ചവൻ’ എന്നോ ‘ദൈവദൂഷണം ചെയ്തവൻ’ എന്നോ വിളിക്കണമോ
  choice: ശപിച്ചവനെ
  alternative: ദൈവദൂഷണം ചെയ്തവനെ
  rationale: ഇവിടത്തെ എബ്രായപദം קלל, ‘ശപിക്കുക,’ എന്ന ക്രിയയിൽനിന്നുള്ളതാണ്. വിശാലസന്ദർഭം ദൈവനാമത്തിനെതിരായ കുറ്റത്തെ സൂചിപ്പിച്ചാലും, ആ വ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ ഉറപ്പിക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: തലയിൽ കൈകൾ വെക്കുന്നതിന്റെ അർഥം
  choice: പ്രവൃത്തി മാത്രം പ്രധാനപാഠത്തിൽ പറയുക
  alternative: സാക്ഷികളുടെ ഔപചാരിക തിരിച്ചറിയലായോ കുറ്റത്തിന്റെ പ്രതീകാത്മക കൈമാറ്റമായോ വിശദീകരിക്കുക
  rationale: വാക്യം പ്രവൃത്തി നിർദേശിക്കുന്നുവെങ്കിലും അതിന്റെ പ്രതീകാത്മക അർഥം വിശദീകരിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. ‘സഭ’ എന്ന പദം עֵדָהയുടെ കൂട്ടായ ഔപചാരികഭാവം നിലനിർത്തുന്നു. മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത കർമം ‘കേട്ടവരെല്ലാം’ എന്നിടത്ത് ചേർത്തിട്ടില്ല; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ [a], [b] പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
