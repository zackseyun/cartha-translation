  text: בְּ/י֨וֹם הַ/שַּׁבָּ֜ת בְּ/י֣וֹם הַ/שַּׁבָּ֗ת יַֽעַרְכֶ֛/נּוּ לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד מֵ/אֵ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: ml
  text: ഓരോ ശബ്ബത്ത് ദിവസവും[a] അവൻ അത് യഹ്‌വേയുടെ സന്നിധിയിൽ നിരന്തരം ക്രമപ്പെടുത്തി വെക്കണം[b], ഇസ്രായേൽമക്കളിൽനിന്നുള്ള ശാശ്വതമായ ഒരു ഉടമ്പടിയായി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ശബ്ബത്ത് ദിവസത്തിൽ, ശബ്ബത്ത് ദിവസത്തിൽ”; അതായത്, ഓരോ ശബ്ബത്തിലും അഥവാ ശബ്ബത്തുതോറും.'
    reason: lexical_alternative
  - marker: b
    text: “അത് ക്രമമായി നിരത്തണം” എന്നും പരിഭാഷപ്പെടുത്താം. “അത്” എന്ന ഏകവചനം അപ്പത്തിന്റെ മുഴുവൻ നിരയെ ഒരു ഘടകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അവസാന പദബന്ധം വ്യാകരണപരമായി മുൻവാക്യത്തോടു ചേർത്ത്, “ശാശ്വതമായ ഒരു ഉടമ്പടിയായി” എന്നും വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: ഓരോ ശബ്ബത്തുദിവസവും
  rationale: ആവർത്തനം വിതരണാർഥകമായ എബ്രായ ശൈലിയാണ്; ഓരോ ശബ്ബത്തിലും എന്ന പതിവായ ആവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יַעַרְכֶנּוּ
  choice: അവൻ അത് ക്രമപ്പെടുത്തണം
  rationale: ערך എന്ന ക്രിയയ്ക്ക് ആരാധനാക്രമത്തിൽ വസ്തുക്കൾ ക്രമമായി നിരത്തുക എന്ന അർഥമുണ്ട്; ഏകവചന പ്രത്യയം അപ്പത്തിന്റെ മുഴുവൻ നിരയെ ഒരു ഘടകമായി സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധിയിൽ സമർപ്പിച്ചു വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ആരാധനാപരമായ പ്രയോഗം; യഹ്‌വേ എന്ന ഉടമ്പടിനാമം നിലനിർത്തുന്നു.
- source_word: תָּמִיד
  choice: നിരന്തരം
  rationale: ഇവിടെ ഇടവിടാതെയുള്ള പ്രവൃത്തിയേക്കാൾ നിശ്ചിതമായി തുടർന്നുവരുന്ന ആചാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ശബ്ബത്തുതോറുമെന്ന സമയവാക്യം ആ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽനിന്നുള്ള
  rationale: מֵאֵת എന്നതിന്റെ ഉറവിടാർഥവും בְּנֵי יִשְׂרָאֵל എന്ന പരമ്പരാഗത സമൂഹനാമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְּרִית עוֹלָם
  choice: ശാശ്വതമായ ഒരു ഉടമ്പടി
  rationale: നിയമപരമായ ബാധ്യത എന്ന ആശയം കൂട്ടിച്ചേർക്കാതെ, ഉടമ്പടിയുടെയും സ്ഥിരതയുടെയും അടിസ്ഥാന എബ്രായ അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בְּרִית עוֹלָם എന്നതിന്റെ ആചാരനിയമപരമായ ബലം
  choice: ശാശ്വതമായ ഒരു ഉടമ്പടി
  alternative: ശാശ്വത ഉടമ്പടിബാധ്യത
  rationale: മൂലത്തിലെ ഉടമ്പടിഭാഷ നേരിട്ട് നിലനിർത്തുകയും ‘ബാധ്യത’ എന്ന വ്യാഖ്യാനാത്മക പദം മുഖ്യപാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: מֵאֵת എന്ന പദബന്ധത്തിന്റെ ബന്ധം
  choice: അത് ഇസ്രായേൽമക്കളിൽനിന്നുള്ള ശാശ്വതമായ ഒരു ഉടമ്പടിയാണ്
  alternative: ഇസ്രായേൽമക്കൾക്കുവേണ്ടിയുള്ള ശാശ്വതമായ ഒരു ഉടമ്പടി
  rationale: מֵאֵת സാധാരണയായി ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; ഗുണഭോക്തൃാർഥം ചേർത്ത് അവ്യക്തത തീർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാ-നിയമശൈലി. ‘ക്രമപ്പെടുത്തണം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ആചാരപരമായ ക്രമീകരണത്തെ സൂചിപ്പിക്കുന്നതുമാണ്. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
