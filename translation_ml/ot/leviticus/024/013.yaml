source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/013.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ എന്നത് ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികവും മാന്യവുമായ ‘അരുളിച്ചെയ്തു’ തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ശീർഷകമാക്കി മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ശബ്ദലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: אֶל
  choice: -യോടു
  rationale: സംസാരം അഭിമുഖീകരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ദാതൃപ്രയോഗം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: പേരിന്റെ സ്ഥാപിതമായ മലയാള ബൈബിൾ രൂപം ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്ന് വരുന്ന വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സംസാരസൂത്രം മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ഇപ്രകാരം’ പോലുള്ള ഉറവിടത്തിൽ ഇല്ലാത്ത ഉള്ളടക്കം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലത്തിലെ വ്യത്യാസം സംരക്ഷിക്കുന്നു; ‘യഹ്‌വേ’ സാധ്യതയേറിയ ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ വാക്യഘടന അക്ഷരാർഥമായി ആവർത്തിക്കാതെ അതിന്റെ ആഖ്യാനക്രമവും തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തിലേക്കുള്ള സൂചനയും നിലനിർത്തി.
