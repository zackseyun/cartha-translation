  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: ml
  text: സമാഗമകൂടാരത്തിൽ, സാക്ഷ്യത്തിന്റെ തിരശ്ശീലയ്ക്കു[a] പുറത്ത്, അഹരോൻ അതിനെ സന്ധ്യ മുതൽ പ്രഭാതംവരെ യഹ്‌വേയുടെ സന്നിധിയിൽ നിരന്തരം[b] ക്രമത്തിൽ വെക്കണം. ഇത് നിങ്ങളുടെ തലമുറതലമുറയ്ക്കും സ്ഥിരമായ ചട്ടമാണ്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സാക്ഷ്യത്തിന്റെ മറശ്ശീലയ്ക്കു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘നിരന്തരം’ എന്നത് ‘സന്ധ്യ മുതൽ പ്രഭാതംവരെ’ നടത്തേണ്ട ഈ ആചാരം പതിവായി തുടർന്നുപോരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഓരോ നിമിഷവും പകലും രാത്രിയും എന്ന അർഥം നിർബന്ധമല്ല.
    reason: cultural_note
  - marker: c
    text: ‘ശാശ്വതമായ ചട്ടം’ അല്ലെങ്കിൽ ‘എന്നേക്കുമുള്ള ചട്ടം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: സാക്ഷ്യത്തിന്റെ തിരശ്ശീലയ്ക്കു പുറത്ത്
  rationale: ഈ പ്രയോഗം സാക്ഷ്യവുമായി ബന്ധപ്പെട്ട അകത്തെ വിശുദ്ധതിരശ്ശീലയുടെ പുറത്തെ സ്ഥാനം സൂചിപ്പിക്കുന്നു. ‘തിരശ്ശീല’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും വിശുദ്ധകൂടാരസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: ഇസ്രായേലിന്റെ വിശുദ്ധകൂടാരത്തിനുള്ള സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളപദമാണ്.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: അതിനെ … ക്രമപ്പെടുത്തി വെക്കണം
  rationale: ערך എന്ന ക്രിയയ്ക്ക് ക്രമപ്പെടുത്തുക, ഒരുക്കിവെക്കുക എന്ന അർഥമുണ്ട്. മുൻവാക്യത്തിലെ വിളക്കുസംവിധാനത്തെയാണ് ഏകവചന സർവനാമം സൂചിപ്പിക്കുന്നത്; മൂലത്തിലെ സർവനാമം പരിഭാഷയിലും നിലനിർത്തുന്നു.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: സന്ധ്യമുതൽ പ്രഭാതംവരെ
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ സമയപരിധി നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: ആരാധനാസന്ദർഭത്തിൽ לִפְנֵי എന്നത് ദൈവസാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു; ‘സന്നിധിയിൽ’ ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, ‘Yahweh’ എന്ന പുനർനിർമിത ഉച്ചാരണത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: תָּמִיד
  choice: നിരന്തരം
  rationale: പുരോഹിതനിയമങ്ങളിൽ ഈ പദം ഇടവിടാത്ത ഓരോ നിമിഷത്തെയും മാത്രമല്ല, പതിവായി തുടർന്നുപോരുന്ന ആചരണത്തെയും സൂചിപ്പിക്കാം. സമയപരിധിയോടൊപ്പം പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: സ്ഥിരമായ ചട്ടം
  rationale: തുടർന്നുനിൽക്കുന്ന നിർബന്ധിത നിയമം എന്ന ആശയം ആധുനികവും വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു; ‘ശാശ്വതമായ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതലമുറയായി നിങ്ങൾക്കുള്ള
  rationale: തുടർച്ചയായ തലമുറകളിലേക്കുള്ള ബാധകത മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരോ പിന്നീട് രൂപപ്പെട്ട മറ്റൊരു ഉച്ചാരണമോ ഉപയോഗിക്കാതെ നാമം ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: תָּמִיד എന്നതിന്റെ ആചാരപരമായ വ്യാപ്തി
  choice: നിരന്തരം
  alternative: പതിവായി; ഓരോ രാത്രിയും തുടർച്ചയായി
  rationale: വാക്യം തന്നെ ‘സന്ധ്യമുതൽ പ്രഭാതംവരെ’ എന്നു നിർദേശിക്കുന്നതിനാൽ ‘നിരന്തരം’ എന്നത് ഓരോ രാത്രിയിലെയും ആചരണത്തിന്റെ തുടർച്ചയാണോ തലമുറകളിലുടനീളമുള്ള പതിവാണോ എന്നു പരിഭാഷയിൽ ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: חֻקַּת עוֹלָם എന്നതിലെ കാലവ്യാപ്തി
  choice: സ്ഥിരമായ ചട്ടം
  alternative: ശാശ്വതമായ ചട്ടം; എന്നേക്കുമുള്ള ചട്ടം
  rationale: עוֹלָם ദീർഘകാലമോ സ്ഥിരതയോ ശാശ്വതതയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം അതിന്റെ നിയമപരമായ സ്ഥിരത വ്യക്തമാക്കുകയും കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ ശൈലി. വിശുദ്ധകൂടാരവുമായി ബന്ധപ്പെട്ട സ്ഥാപിതപദങ്ങളായ ‘സമാഗമകൂടാരം’, ‘തിരശ്ശീല’, ‘സന്നിധി’ എന്നിവ നിലനിർത്തി; ദീർഘമോ അത്യന്തം സംസ്കൃതവത്കൃതമോ ആയ വാക്യഘടന ഒഴിവാക്കി.
