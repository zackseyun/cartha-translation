base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: ml
  text: അത് അഹരോനും അവന്റെ പുത്രന്മാർക്കും അവകാശപ്പെട്ടതായിരിക്കണം; അവർ അത് ഒരു വിശുദ്ധസ്ഥലത്തുവെച്ച് ഭക്ഷിക്കണം. കാരണം, യഹോവയ്ക്കുള്ള അഗ്ന്യർപ്പണങ്ങളിൽനിന്ന് അത് അവന് അതിവിശുദ്ധമാണ്[a]; ഇത് എന്നേക്കുമുള്ള ചട്ടമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയ്ക്കുള്ള അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാടുകളിൽനിന്ന്.” എബ്രായ സാങ്കേതികപദം പരമ്പരാഗതമായി അഗ്നിയിലൂടെ സമർപ്പിക്കുന്ന വഴിപാടുകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: അത് അഹരോനും അവന്റെ പുത്രന്മാർക്കും അവകാശപ്പെട്ടതായിരിക്കണം
  rationale: היה + לְ എന്ന ഘടന ഇവിടെ നിലനിൽപ്പിനേക്കാൾ ഉടമസ്ഥതയെയും നിയുക്ത ഓഹരിയെയും സൂചിപ്പിക്കുന്നു. നിയമപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַאֲכָלֻהוּ
  choice: അവർ അത് ... ഭക്ഷിക്കണം
  rationale: നിയമനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: ഒരു വിശുദ്ധസ്ഥലത്തുവെച്ച്
  rationale: എബ്രായത്തിൽ നിർദിഷ്ടാർഥക ഉപപദമില്ലാത്തതിനാൽ ഒരു പ്രത്യേക മുറിയെന്ന് അമിതമായി നിർണ്ണയിക്കാതെ 'ഒരു വിശുദ്ധസ്ഥലം' എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധമായ
  rationale: എബ്രായത്തിലെ പരമോന്നതത്വം സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הוּא לוֹ
  choice: അത് അവന് അതിവിശുദ്ധമായ ഓഹരിയാണ്
  rationale: לֹו എന്ന ഏകവചനം നിലനിർത്തി അഹരോനെ പുരോഹിതവംശത്തിന്റെ പ്രതിനിധിയായി കാണാൻ വാക്യസന്ദർഭത്തെ അനുവദിക്കുന്നു. 'ഓഹരി' എന്നത് ലഭിക്കുന്ന വിശുദ്ധ വിഹിതത്തിന്റെ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: യഹോവയ്ക്കുള്ള ദഹനാർപ്പണങ്ങളിൽനിന്ന്
  rationale: אִשֶּׁה അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗാർപ്പണങ്ങളെ പരമ്പരാഗതമായി സൂചിപ്പിക്കുന്നു. 'ദഹനാർപ്പണം' അഗ്നിസംബന്ധം വ്യക്തമാക്കുന്നു; പരിധി കൂടുതൽ കൃത്യമായി വിവരിക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: חָק עוֹלָם
  choice: എന്നേക്കുമുള്ള ചട്ടം
  rationale: തുടർച്ചയായ നിയമനിർദേശത്തിന്റെ അർഥം ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അഹരോനെയും പുത്രന്മാരെയും പറഞ്ഞ സന്ദർഭത്തിലെ ഏകവചനമായ לֹו-യുടെ സൂചിതവ്യക്തി
  choice: '''അവന്'' എന്ന ഏകവചനം നിലനിർത്തി'
  alternative: '''അവർക്ക്'' എന്ന് ബഹുവചനമാക്കി പുരോഹിതസ്വീകർത്താക്കളെയെല്ലാം വ്യക്തമാക്കുക'
  rationale: മൂലപാഠത്തിലെ ഏകവചനം മിനുക്കിമാറ്റാതെ അഹരോൻ പുരോഹിതവംശത്തെ പ്രതിനിധീകരിക്കുന്നതാകാമെന്ന സാധ്യത സന്ദർഭത്തിന് വിട്ടുകൊടുക്കുന്നു.
- issue: אִשֶּׁה എന്ന യാഗസാങ്കേതികപദത്തിന്റെ പരിധി
  choice: മുഖ്യപാഠത്തിൽ 'ദഹനാർപ്പണങ്ങൾ'; അടിക്കുറിപ്പിൽ അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗാർപ്പണങ്ങൾ എന്നു വിശദീകരണം
  alternative: '''ഭോജനാർപ്പണങ്ങൾ'' എന്നു പരിഭാഷപ്പെടുത്തുക'
  rationale: അഗ്നിയിലൂടെ സമർപ്പിക്കൽ എന്ന പദത്തിന്റെ പരമ്പരാഗത ബന്ധം സംരക്ഷിക്കുകയും ദൈവം അക്ഷരാർഥത്തിൽ ഭക്ഷിക്കുന്നു എന്ന ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. 'പുത്രന്മാർ' എന്നത് പുരോഹിതവംശത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിലെ ലിംഗനിർദിഷ്ടത കാത്തുസൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് സൂചകം [a] മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
