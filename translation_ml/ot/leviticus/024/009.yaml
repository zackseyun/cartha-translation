revisions:
- from: അത് അഹരോനും അവന്റെ പുത്രന്മാർക്കും അവകാശപ്പെട്ടതായിരിക്കണം; അവർ അത് ഒരു വിശുദ്ധസ്ഥലത്തുവെച്ച് ഭക്ഷിക്കണം. കാരണം, യഹോവയ്ക്കുള്ള ദഹനാർപ്പണങ്ങളിൽനിന്ന് അത് അവന് അതിവിശുദ്ധമായ ഓഹരിയാണ്[a]; ഇത് എന്നേക്കുമുള്ള ചട്ടമാണ്.
  to: അത് അഹരോനും അവന്റെ പുത്രന്മാർക്കും അവകാശപ്പെട്ടതായിരിക്കണം; അവർ അത് ഒരു വിശുദ്ധസ്ഥലത്തുവെച്ച് ഭക്ഷിക്കണം. കാരണം, യഹോവയ്ക്കുള്ള അഗ്ന്യർപ്പണങ്ങളിൽനിന്ന് അത് അവന് അതിവിശുദ്ധമാണ്[a]; ഇത് എന്നേക്കുമുള്ള ചട്ടമാണ്.
