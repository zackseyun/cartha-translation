reference: Leviticus 24:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֥ישׁ אִ֛ישׁ כִּֽי יְקַלֵּ֥ל אֱלֹהָ֖י/ו וְ/נָשָׂ֥א חֶטְאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/015.yaml
  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: ml
  text: 'നീ ഇസ്രായേൽമക്കളോടു ഇപ്രകാരം പറയണം: ‘ഏതൊരു പുരുഷനും തന്റെ ദൈവത്തെ ശപിച്ചാൽ, അവൻ തന്റെ പാപം വഹിക്കണം[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ പാപം വഹിക്കുക” എന്നത് ആ കുറ്റത്തിന്റെ കുറ്റമോ കുറ്റബാധ്യതയോ ശിക്ഷാബാധ്യതയോ വഹിക്കുക എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കുടുംബപരവും സമൂഹപരവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: പറയേണ്ടത്
  rationale: നിയമനിർദേശത്തിന്റെ ആജ്ഞാഭാവവും തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തിന്റെ ആമുഖവും മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אִישׁ אִישׁ
  choice: ഏതൊരു പുരുഷനും
  rationale: ‘പുരുഷൻ, പുരുഷൻ’ എന്ന ആവർത്തനത്തിന്റെ വിതരണാത്മക ഊന്നൽ പ്രകടമാക്കുകയും വ്യാകരണപരമായ പുരുഷലിംഗ ഏകവചനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יְקַלֵּל
  choice: ശപിച്ചാൽ
  rationale: קלל എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘ശപിക്കുക’ എന്നാണ്; അടുത്ത വാക്യത്തിലെ ദൈവനാമത്തെ ദുഷിക്കുന്ന പ്രത്യേക കുറ്റവുമായി ഇതിനെ അനാവശ്യമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: אֱלֹהָיו
  choice: തന്റെ ദൈവത്തെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം വ്യക്തമായി നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘യഹോവ’ എന്ന പ്രത്യേകീകരണം ചേർക്കുന്നില്ല.
- source_word: וְנָשָׂא חֶטְאוֹ
  choice: അവൻ തന്റെ പാപം വഹിക്കണം
  rationale: കുറ്റത്തിനുള്ള ഉത്തരവാദിത്വമോ ബാധ്യതയോ വഹിക്കുക എന്ന എബ്രായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אֱלֹהָיו എന്നതിന്റെ വ്യാപ്തി
  choice: തന്റെ ദൈവത്തെ
  alternative: ദൈവത്തെ; യഹോവയെ
  rationale: ഉടമസ്ഥപ്രത്യയമുള്ള മൂലപാഠം അതേപടി സംരക്ഷിക്കുകയും അടുത്ത വാക്യത്തിലെ ദൈവനാമസംബന്ധമായ പ്രത്യേക കുറ്റത്തിൽ നിന്ന് ഈ വാക്യത്തിന്റെ പൊതുവായ ഭാഷ വേർതിരിച്ചുനിർത്തുകയും ചെയ്യുന്നു.
- issue: നിയമത്തിലെ കർത്താവിന്റെ ലിംഗരൂപം
  choice: ഏതൊരു പുരുഷനും
  alternative: ആരെങ്കിലും
  rationale: אִישׁ אִישׁ എന്ന പുരുഷലിംഗ ഏകവചന ആവർത്തനത്തിന്റെ വിതരണാത്മക ശക്തി ലിംഗനിരപേക്ഷമാക്കി മാറ്റാതെ നൽകുന്നു.
- issue: ‘പാപം വഹിക്കുക’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ശാബ്ദിക പ്രയോഗം നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുക
  alternative: തന്റെ കുറ്റത്തിന്റെ ശിക്ഷ അനുഭവിക്കണം
  rationale: പ്രയോഗത്തിലുള്ള കുറ്റബോധം, ഉത്തരവാദിത്വം, ശിക്ഷാബാധ്യത എന്നിവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധിച്ച് തെരഞ്ഞെടുക്കാതെ യഥാർത്ഥ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമനിർദേശ ശൈലി. ‘ഇസ്രായേൽമക്കൾ’ എന്ന പരിചിത ബൈബിൾപ്രയോഗം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. ഉദ്ധരണിയുടെ അവസാനത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നം ചേർത്തിരിക്കുന്നു.
