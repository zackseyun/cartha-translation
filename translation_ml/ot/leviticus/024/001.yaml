source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: പിന്നെ യഹ്‌വെ മോശയോട് ഇപ്രകാരം അരുളിച്ചെയ്തു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’ (יהוה); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു. കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമാണ്; മറ്റൊരു ഉച്ചാരണരൂപം: ‘യാഹ്‌വെ.’'
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപവും പരമ്പരാഗത പരിഭാഷയും ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പിന്നെ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചാഘടന ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കാൻ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֶל
  choice: -യോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദത്തിവിഭക്തി ഉപയോഗിച്ചു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: എബ്രായത്തിൽ നേരിട്ടുള്ള വാക്കുകളെ അവതരിപ്പിക്കുന്ന ഈ രൂപത്തെ ‘ഇപ്രകാരം’ എന്നു അധികമായി ചേർക്കാതെ മലയാള വിരാമചിഹ്നത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യാഹ്‌വെ; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയായി മാറ്റാതെ ലിപ്യന്തരിച്ചു. കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള വാക്കുകൾക്കായി വാക്യാവസാനത്തിൽ ദ്വിബിന്ദു നിലനിർത്തി; ‘അരുളിച്ചെയ്തു’ ദൈവിക പ്രസംഗസന്ദർഭത്തിന് യോജിച്ച പരമ്പരാഗതമെങ്കിലും പൊതുവെ മനസ്സിലാകുന്ന പദമാണ്.
