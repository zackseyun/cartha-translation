  variant: modern standard Malayalam
source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു കൽപ്പിക്കുക: വെളിച്ചത്തിനായി ഇടിച്ചു പിഴിഞ്ഞെടുത്ത ശുദ്ധമായ ഒലിവെണ്ണ അവർ നിന്റെ അടുക്കൽ കൊണ്ടുവരണം; വിളക്ക് നിരന്തരം കത്തിച്ചുകൊണ്ടിരിക്കാൻ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിരന്തരം” എന്നത് ഇവിടെ തുടർച്ചയായി എന്നോ ക്രമമായി പതിവുപോലെ എന്നോ അർഥമാക്കാം.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: צַו
  choice: കല്പിക്കുക
  rationale: നേരിട്ടുള്ള ആജ്ഞയെ സൂചിപ്പിക്കുന്ന പിയേൽ ആജ്ഞാരൂപത്തിന്റെ അധികാരബലം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന പരമ്പരാഗത ഉടമ്പടി-നാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഇത് സന്ദർഭത്തിൽ ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: അവർ നിന്റെ അടുക്കൽ കൊണ്ടുവരണം
  rationale: לקח എന്നതിന് അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നർഥമുണ്ടെങ്കിലും אֵלֶיךָ (‘നിന്റെ അടുക്കൽ’) ചേർന്ന ഈ ഘടനയിൽ ഉദ്ദേശിക്കുന്ന പ്രവൃത്തി കൊണ്ടുവരിക എന്നതാണ്.
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: ഇടിച്ചെടുത്ത, ശുദ്ധമായ ഒലിവെണ്ണ
  rationale: എണ്ണയുടെ ഉറവിടവും ശുദ്ധിയും ഒലിവ് ഇടിച്ചോ ചതച്ചോ എണ്ണയെടുത്ത രീതിയും വ്യക്തമായി സൂക്ഷിക്കുന്ന, മലയാളത്തിൽ വായനാസുഖമുള്ള പ്രയോഗം.
- source_word: לַמָּאוֹר
  choice: വിളക്കിനായി
  rationale: മָאוֹר പ്രകാശം/വെളിച്ചം എന്ന ആശയമുള്ളതാണെങ്കിലും ഇവിടെ വിശുദ്ധമന്ദിരത്തിലെ വിളക്ക് തെളിയിക്കുന്ന ആവശ്യത്തെ സൂചിപ്പിക്കുന്നു; ‘വിളക്കിനായി’ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְהַעֲלֹת נֵר
  choice: വിളക്ക് ... കത്തിച്ചുകൊണ്ടിരിക്കുക
  rationale: അക്ഷരാർഥത്തിൽ വിളക്കിനെ ‘ഉയർത്തുക’ എന്ന ഹിഫീൽ പ്രയോഗം ഇവിടെ വിളക്ക് തെളിയിച്ച് കത്തിച്ചുനിർത്തുക എന്ന സാങ്കേതിക ആശയം നൽകുന്നു.
- source_word: תָּמִיד
  choice: നിരന്തരം
  rationale: പുരോഹിതശുശ്രൂഷാസന്ദർഭത്തിൽ പതിവായോ തുടർച്ചയായോ നിലനിൽക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടി-നാമത്തിലെ ലിംഗരൂപം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം / ഇസ്രായേല്യർ
  rationale: എബ്രായത്തിലെ പരമ്പരാഗത ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന രൂപത്തോട് സുതാര്യബന്ധം പുലർത്തുന്നു; മലയാളത്തിലെ ‘മക്കൾ’ സന്ദർഭത്തിൽ സമൂഹത്തെ മുഴുവനായി ഉൾക്കൊള്ളാനും കഴിയും.
- issue: תָּמִיד സൂചിപ്പിക്കുന്ന കാലപരിധി
  choice: നിരന്തരം
  alternative: പതിവായി
  rationale: പദത്തിന് തുടർച്ചയും ക്രമമായ ആവർത്തനവും സൂചിപ്പിക്കാനാകുന്നതിനാൽ അർഥത്തിലെ സാധ്യത ചുരുക്കാതെ പരമ്പരാഗതമായ വിശാലപ്രയോഗം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ഒലിവെണ്ണ’ എന്ന പ്രചാരത്തിലുള്ള രൂപവും ‘നിന്റെ അടുക്കൽ’ എന്ന തിരുവെഴുത്തുശൈലിയോട് ചേർന്ന സ്വാഭാവിക പ്രയോഗവും ഉപയോഗിച്ചു.
