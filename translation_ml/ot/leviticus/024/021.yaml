  terminology: 'മൃഗം is suitably broad for בְהֵמָה, and മനുഷ്യൻ naturally denotes an individual human person in contrast to an animal without importing an unwarranted male-only limitation. നഷ്ടപരിഹാരം is an appropriate modern legal equivalent for restitution. No footnote is required: unlike the English wording ''man,'' the Malayalam മനുഷ്യൻ does not create a material ambiguity needing an alternative-rendering note.'
