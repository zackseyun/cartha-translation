id: LEV.24.21
reference: Leviticus 24:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: ml
  text: മൃഗത്തെ അടിച്ചുകൊല്ലുന്നവൻ അതിന് നഷ്ടപരിഹാരം നൽകണം; മനുഷ്യനെ അടിച്ചുകൊല്ലുന്നവനെ വധിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַכֵּה
  choice: അടിച്ചുകൊല്ലുന്നവൻ
  rationale: נכה എന്ന ക്രിയയുടെ ഹിഫിൽ കർത്തൃവാചക രൂപം ഇവിടെ മാരകമായി അടിക്കുന്നവനെ സൂചിപ്പിക്കുന്നു; മൃഗത്തിന് നഷ്ടപരിഹാരവും മനുഷ്യനെ കൊന്നതിന് മരണശിക്ഷയും പറയുന്ന സമാന്തരഫലങ്ങൾ മാരകത്വം വ്യക്തമാക്കുന്നു.
- source_word: בְהֵמָה
  choice: മൃഗം
  rationale: വളർത്തുമൃഗത്തെയോ പൊതുവിൽ ഒരു മൃഗത്തെയോ സൂചിപ്പിക്കാവുന്ന വിശാലപദമാണിത്; നിയമസന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളം ‘മൃഗം’ ആണ്.
- source_word: יְשַׁלְּמֶנָּה
  choice: അതിന് നഷ്ടപരിഹാരം നൽകണം
  rationale: שלם എന്ന ക്രിയയുടെ പീയേൽ രൂപം നഷ്ടം നികത്തുകയോ പകരം നൽകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം בְהֵמָה എന്ന പദത്തിലേക്കാണ് മടങ്ങുന്നത്.
- source_word: אָדָם
  choice: മനുഷ്യൻ
  rationale: മൃഗത്തോടുള്ള വൈരുധ്യത്തിൽ ഇത് മനുഷ്യവർഗത്തെ അമൂർത്തമായി അല്ല, ഒരു വ്യക്തിയായ മനുഷ്യനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മനുഷ്യൻ’ നിയമവാക്യത്തിലെ പ്രതിനിധിപരമായ ഏകവചനവും പദത്തിന്റെ വിശാലമായ മനുഷ്യസൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: יוּמָת
  choice: വധിക്കണം
  rationale: ഹോഫാൽ രൂപം ‘മരണത്തിന് വിധേയനാക്കപ്പെടുക’ എന്ന നിയമപരമായ കർമണാർത്ഥം നൽകുന്നു; ‘വധിക്കണം’ സ്വാഭാവിക മലയാളത്തിൽ ആ ന്യായവിധിയുടെ ബലം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: നിയമസന്ദർഭത്തിലെ אָדָם എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യൻ
  alternative: ഒരു പുരുഷൻ
  rationale: ഹീബ്രു പദം വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും, മൃഗത്തോടുള്ള വൈരുധ്യത്തിൽ ലിംഗഭേദമില്ലാതെ ഒരു മനുഷ്യവ്യക്തിയെ സൂചിപ്പിക്കാം. ‘മനുഷ്യൻ’ ആ വിശാല അർത്ഥം നിലനിർത്തുകയും മലയാള നിയമശൈലിയിൽ പ്രതിനിധിപരമായ ഏകവചനമായി സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. രണ്ടു സമാന്തര വ്യവസ്ഥകളുടെ ഘടന സെമിക്കോളൺ ഉപയോഗിച്ച് നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യമായ സാങ്കേതിക നിയമപദങ്ങൾ ഒഴിവാക്കി.
