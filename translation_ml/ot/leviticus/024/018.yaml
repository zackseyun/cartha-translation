id: LEV.24.18
reference: Leviticus 24:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מַכֵּ֥ה נֶֽפֶשׁ בְּהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/018.yaml
  text: 'And whoever strikes down an animal shall make restitution for it: life for life[a].'
translation:
  language: ml
  text: ഒരു മൃഗത്തെ കൊല്ലുന്നവൻ അതിന് നഷ്ടപരിഹാരം നൽകണം—ജീവനു പകരം ജീവൻ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: “ജീവനു പകരം ജീവൻ.” മൃഗത്തിനുള്ള നഷ്ടപരിഹാരത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ, ഈ പ്രയോഗം തുല്യമായ നഷ്ടപരിഹാരത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה
  choice: കൊന്നുകളയുന്നവൻ
  rationale: നכה എന്ന ക്രിയയുടെ ഹിഫീൽ കർത്തൃവാചക രൂപം പൊതുവായ നിയമവ്യവസ്ഥയിലെ കർത്താവിനെ സൂചിപ്പിക്കുന്നു. ഇവിടെ നֶפֶשׁ בְּהֵמָה എന്ന കർമത്തോടൊപ്പം വരുന്നതിനാൽ മാരകമായ പ്രഹരം, അതായത് കൊല്ലൽ, എന്നാണ് സ്വാഭാവിക അർഥം.
- source_word: נֶפֶשׁ בְּהֵמָה
  choice: ഒരു മൃഗത്തെ
  rationale: ഇവിടെ נֶפֶשׁ മൃഗത്തിന്റെ ജീവനെയാണ് സൂചിപ്പിക്കുന്നത്; വേറിട്ട ഒരു അമൂർത്ത ‘ആത്മാവ്’ എന്ന ആശയമല്ല. മലയാളത്തിൽ ‘മൃഗത്തിന്റെ ജീവനെ അടിക്കുന്നവൻ’ എന്ന അക്ഷരാർഥരൂപം അസ്വാഭാവികമായതിനാൽ മാരകപ്രവൃത്തിയെ ‘മൃഗത്തെ കൊന്നുകളയുക’ എന്നു വ്യക്തമാക്കി.
- source_word: יְשַׁלְּמֶנָּה
  choice: അതിന് നഷ്ടപരിഹാരം നൽകണം
  rationale: പീയേൽ രൂപത്തിലുള്ള שלם നഷ്ടം നികത്തുകയോ പകരം നൽകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം בְּהֵמָהയിലേക്കു മടങ്ങുന്നതിനാൽ ‘അതിന്’ എന്നു ചേർത്തു.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: ജീവനു പകരം ജീവൻ
  rationale: ഹീബ്രായ നിയമസൂത്രത്തിന്റെ സംക്ഷിപ്തതയും സമാന്തരഘടനയും നിലനിർത്തുന്നു. ഈ സന്ദർഭത്തിൽ അത് തുല്യമായ നഷ്ടപരിഹാരത്തെ സൂചിപ്പിക്കുമ്പോഴും അതിന്റെ രൂപം കൂടുതൽ വിശദീകരിച്ച് വിവർത്തനത്തിൽ ചുരുക്കിയിട്ടില്ല.
theological_decisions:
- issue: മൃഗത്തെ കൊന്നതിനുള്ള പ്രതിഫലസൂത്രത്തിന്റെ അർഥം
  choice: മൃഗത്തെ കൊന്നതിന് തുല്യമായ നഷ്ടപരിഹാരം നൽകണമെന്ന വ്യവസ്ഥ; ‘ജീവനു പകരം ജീവൻ’ എന്ന മൂലസൂത്രം അതേപടി സംരക്ഷിക്കുന്നു.
  alternative: കൊല്ലപ്പെട്ട മൃഗത്തിനു പകരമായി നിർബന്ധമായും മറ്റൊരു മൃഗത്തെ തന്നേ നൽകണമെന്നാണ് കൂടുതൽ അക്ഷരാർഥപരമായി വായിക്കാനാവുക; അല്ലെങ്കിൽ വിശാലമായ പ്രതികാരനീതിസൂത്രത്തിന്റെ ഭാഗമായി ധനമോ വസ്തുവോ കൊണ്ടുള്ള നഷ്ടപരിഹാരമായി കാണാം.
  rationale: ‘നഷ്ടപരിഹാരം നൽകണം’ എന്ന ക്രിയയാണ് തുടർന്നുള്ള സൂത്രത്തിന്റെ സന്ദർഭാർഥത്തെ നിയന്ത്രിക്കുന്നത്. എന്നാൽ നഷ്ടപരിഹാരത്തിന്റെ കൃത്യമായ രീതി വാക്യം വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനം അതു നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി സ്വീകരിച്ചു. ‘ആത്മാവ്’ എന്ന പദം ഒഴിവാക്കി സന്ദർഭത്തിലെ ജീവൻ/ജീവഹാനി എന്ന അർഥം വ്യക്തമാക്കിയിട്ടുണ്ട്; മൂലത്തിലെ നിയമസൂത്രത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി.
