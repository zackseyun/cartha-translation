language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: ml
  text: അവയെ രണ്ടു നിരകളായി[a], ഓരോ നിരയിലും ആറുവീതം, യഹ്‌വേയുടെ സന്നിധിയിൽ ശുദ്ധമായ[b] മേശമേൽ വയ്ക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘രണ്ടു ക്രമീകരണങ്ങളായി’ അല്ലെങ്കിൽ ‘രണ്ടു അടുക്കുകളായി’; അപ്പങ്ങൾ ക്രമമായി വെച്ച വിന്യാസത്തെയാണ് ഹീബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ശുദ്ധമായ’ എന്നത് ഇവിടെ വെറും ഭൗതിക വൃത്തിയെയല്ല, ആരാധനാസംബന്ധിയായ ആചാരശുദ്ധിയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: വെക്കണം
  rationale: שׂוּם എന്ന ക്രിയയുടെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥവും നിർദേശാത്മക ഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אוֹתָם
  choice: അവയെ
  rationale: മുൻവാക്യത്തിലെ പന്ത്രണ്ട് അപ്പങ്ങളെയാണ് പ്രത്യക്ഷ കർമസർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: രണ്ടു നിരകളായി
  rationale: מַעֲרָכָה ക്രമപ്പെടുത്തിയ കൂട്ടത്തെയോ വിന്യാസത്തെയോ സൂചിപ്പിക്കുന്നു; മേശപ്പുറത്തെ അപ്പങ്ങളുടെ ക്രമീകരണത്തിന് ‘നിരകൾ’ സ്വാഭാവികമാണ്, എന്നാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: ഓരോ നിരയിലും ആറുവീതം
  rationale: ഹീബ്രായിലെ സംഖ്യയും ഏകവചനമായ ‘വിന്യാസം/നിര’യും ചേർന്ന പ്രയോഗത്തിന്റെ വിതരണാർഥം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל הַשֻּׁלְחָן
  choice: മേശമേൽ
  rationale: עַל എന്നതിന്റെ സാധാരണ സ്ഥാനാർഥമായ ‘മേൽ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַטָּהֹר
  choice: ശുദ്ധമായ
  rationale: വിശുദ്ധമന്ദിരസന്ദർഭത്തിലെ טָהוֹר ആചാരപരമായ ശുദ്ധിയെ സൂചിപ്പിക്കുന്നു; ‘ശുദ്ധമായ’ എന്നത് വെറും ഭൗതിക വൃത്തിയേക്കാൾ ആ ഭാവം നന്നായി വഹിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥവും יהוה എന്ന ദൈവനാമവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ചതുർക്ഷര ദൈവനാമത്തെ പദവിയാക്കി മാറ്റാതെ പേരായി അവതരിപ്പിക്കുന്നു.
- issue: הַטָּהֹר എന്ന ആരാധനാസംബന്ധിയായ വിശേഷണം
  choice: ശുദ്ധമായ മേശ
  alternative: വൃത്തിയുള്ള മേശ
  rationale: ഇത് വിശുദ്ധമന്ദിരോപകരണത്തെക്കുറിച്ചുള്ളതിനാൽ ആചാരപരമായ ശുദ്ധി നിലനിർത്തുന്നു; വെറും ഭൗതിക വൃത്തിയെന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. ‘നിര’, ‘ശുദ്ധമായ’, ‘സന്നിധിയിൽ’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
