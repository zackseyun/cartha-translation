  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: ml
  text: ഇസ്രായേൽക്കാരിയായ ആ സ്ത്രീയുടെ മകൻ തിരുനാമം വ്യക്തമായി ഉച്ചരിക്കുകയും ശപിക്കുകയും ചെയ്തു.[a] അപ്പോൾ അവർ അവനെ മോശെയുടെ അടുക്കൽ കൊണ്ടുവന്നു. അവന്റെ അമ്മയുടെ പേര് ദിബ്രിയുടെ മകളായ ശെലോമീത്ത് എന്നായിരുന്നു; അവൾ ദാൻ ഗോത്രത്തിൽപ്പെട്ടവളായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തിരുനാമത്തെ നിന്ദിച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് “വ്യക്തമായി ഉച്ചരിക്കുക” എന്നോ, ഈ സന്ദർഭത്തിൽ തിരുനാമനിന്ദയുടെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതായോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: വ്യക്തമായി ഉച്ചരിക്കുകയും
  rationale: נקב എന്ന ക്രിയയ്ക്ക് ‘വ്യക്തമായി പറയുക/ഉച്ചരിക്കുക’ എന്ന അർഥം വരാം. തുടർന്ന് വേറൊരു ക്രിയയായ וַיְקַלֵּל (‘ശപിച്ചു’) വരുന്നതിനാൽ, രണ്ട് പ്രവർത്തനങ്ങളും വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: אֶת הַשֵּׁם
  choice: തിരുനാമം
  rationale: നിശ്ചയാർഥപ്രത്യയത്തോടെയുള്ള ‘നാമം’ ഇവിടെ ദൈവനാമത്തോടുള്ള ആദരപൂർവമായ പരാമർശമാണ്. മലയാളത്തിൽ ‘തിരുനാമം’ ഈ പ്രത്യേകത സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; എന്നാൽ വാചകത്തിൽ യഹോവ എന്ന നാമം ചേർക്കുന്നില്ല.
- source_word: וַיְקַלֵּל
  choice: ശപിക്കുകയും ചെയ്തു
  rationale: പീയേൽ രൂപത്തിലുള്ള קלל എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘ശപിക്കുക’ എന്നാണ്; മുൻക്രിയയുമായി ഇതിനെ ലയിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  choice: അവർ അവനെ മോശെയുടെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: ഹീബ്രുവിലെ കർത്താവ് വ്യക്തമാക്കാത്ത മൂന്നാംപുരുഷ ബഹുവചന സജീവരൂപം മലയാളത്തിലും ‘അവർ’ എന്നു നിലനിർത്തുന്നു.
- source_word: שְׁלֹמִית בַּת דִּבְרִי
  choice: ദിബ്രിയുടെ മകളായ ശെലോമീത്ത്
  rationale: വ്യക്തിനാമങ്ങൾ ശബ്ദാനുസൃതമായി ലിപ്യന്തരം ചെയ്യുകയും പിതൃബന്ധം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: לְמַטֵּה דָן
  choice: അവൾ ദാൻ ഗോത്രത്തിൽപ്പെട്ടവളായിരുന്നു
  rationale: ഈ പ്രയോഗം ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നു. അമ്മയെയാണ് ഈ വിവരം വിശേഷിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
theological_decisions:
- issue: נקב എന്ന ക്രിയയും ‘തിരുനാമം’ എന്ന കർമവും ചേർന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: അവൻ തിരുനാമം വ്യക്തമായി ഉച്ചരിച്ചു; തുടർന്ന് ശപിച്ചു എന്നിങ്ങനെ രണ്ട് ക്രിയകളും വേർതിരിച്ചു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തിരുനാമത്തെ ദുഷിച്ചു ശപിച്ചു’ അല്ലെങ്കിൽ ‘തിരുനാമത്തെ നിന്ദിച്ചു’ എന്ന ഒറ്റ ആശയമായി ഗ്രഹിക്കുക.
  rationale: മൂലപാഠം נקב, קלל എന്നീ രണ്ട് ക്രിയകൾ ഉപയോഗിക്കുന്നു. ആദ്യത്തേതിന്റെ ‘വ്യക്തമായി ഉച്ചരിക്കുക’ എന്ന സാധ്യത മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും, സന്ദർഭപരമായ ‘തിരുനാമത്തെ നിന്ദിച്ചു’ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നത് യഥാർഥമായ അർഥസന്ദിഗ്ധത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘തിരുനാമം’ ദൈവനാമത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്നു. ‘അപ്പോൾ’ കഥയുടെ തുടർച്ചയും ‘എന്നായിരുന്നു’ പശ്ചാത്തലവിവരവും സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
