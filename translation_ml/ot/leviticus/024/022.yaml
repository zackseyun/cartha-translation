revisions:
- from: നിങ്ങൾക്ക് ഒരേ നീതിന്യായവ്യവസ്ഥയായിരിക്കണം; പരദേശിക്കും സ്വദേശിക്കും ഒരുപോലെ. കാരണം, ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹോവ ആകുന്നു.
  to: നിങ്ങൾക്കു പരദേശിക്കും സ്വദേശിക്കും ഒരുപോലെ ഒരേ നീതിന്യായമാനദണ്ഡം ഉണ്ടായിരിക്കണം; ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹോവ ആകുന്നു.
  rationale: The revision renders the singular legal standard explicitly and states its equal application to the resident foreigner and the native-born person in idiomatic modern Malayalam. It retains the source's final causal grounding and the personal divine name without adding interpretive content.
  reviewer_model: gpt-5.6-terra
