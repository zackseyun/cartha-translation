id: LEV.24.22
reference: Leviticus 24:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִשְׁפַּ֤ט אֶחָד֙ יִהְיֶ֣ה לָ/כֶ֔ם כַּ/גֵּ֥ר כָּ/אֶזְרָ֖ח יִהְיֶ֑ה כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: ml
  text: നിങ്ങൾക്കു പരദേശിക്കും സ്വദേശിക്കും ഒരുപോലെ ഒരേ നീതിന്യായമാനദണ്ഡം ഉണ്ടായിരിക്കണം; ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹോവ ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: ഒരേ നീതിന്യായവ്യവസ്ഥ
  rationale: מִשְׁפָּט ഇവിടെ ഒറ്റപ്പെട്ട വിധിയെയല്ല, എല്ലാവർക്കും ഒരുപോലെ ബാധകമായ ന്യായനിയമത്തെയോ നീതിന്യായമാനദണ്ഡത്തെയോ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ഈ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: גֵּר
  choice: പരദേശി
  rationale: ഇസ്രായേൽ സമൂഹത്തിനിടയിൽ താമസിക്കുന്ന, സ്വദേശിയല്ലാത്ത താമസക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്; 'പരദേശി' സംക്ഷിപ്തവും നിലവിലെ സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: אֶזְרָח
  choice: സ്വദേശി
  rationale: ദേശത്ത് ജന്മാവകാശവും പൂർണ്ണ സാമൂഹിക അംഗത്വവുമുള്ള നാട്ടുകാരനോടുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוהയെ പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിലൂടെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പരദേശിക്കും സ്വദേശിക്കും തുല്യമായ നീതിന്യായം
  choice: പരദേശിക്കും സ്വദേശിക്കും ഒരുപോലെ
  alternative: പരദേശിയെപ്പോലെ സ്വദേശിക്കും
  rationale: כַּגֵּר כָּאֶזְרָח എന്ന സമാന്തരഘടനയുടെ ഉദ്ദേശ്യമായ നിയമത്തിനു മുമ്പിലെ തുല്യത വ്യക്തമായി നിലനിർത്തുന്നു; ആരെയും മുൻഗണനയുള്ള മാനദണ്ഡമാക്കുന്നില്ല.
- issue: ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പൊതുപദവിയായി മാറ്റാതെ സൂക്ഷിക്കുന്നു; വാക്യത്തിന്റെ ഉടമ്പടിസംബന്ധിയായ അടിസ്ഥാനവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമസന്ദർഭത്തിലെ സർവസമത്വം വ്യക്തമാക്കുന്നതിനൊപ്പം ഹീബ്രു വാക്യത്തിന്റെ കാരണം സൂചിപ്പിക്കുന്ന അവസാനഘടനയും സംരക്ഷിച്ചിട്ടുണ്ട്.
