  text: וְ/לָקַחְתָּ֣ סֹ֔לֶת וְ/אָפִיתָ֣ אֹתָ֔/הּ שְׁתֵּ֥ים עֶשְׂרֵ֖ה חַלּ֑וֹת שְׁנֵי֙ עֶשְׂרֹנִ֔ים יִהְיֶ֖ה הַֽ/חַלָּ֥ה הָ/אֶחָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/005.yaml
  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: ml
  text: നീ നന്നായി അരിച്ച മാവ് എടുത്ത് അതുകൊണ്ട് പന്ത്രണ്ട് അപ്പങ്ങൾ[a] ചുടണം. ഓരോ അപ്പത്തിനും ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള രണ്ട് അളവ് മാവ് ഉണ്ടായിരിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പന്ത്രണ്ട് കേക്കുകൾ.” എബ്രായപദം ആചാരപരമായ സന്ദർഭങ്ങളിൽ ഉപയോഗിക്കുന്ന ചുട്ട അപ്പത്തിന്റെ ഘടകങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “രണ്ട് പത്തിലൊന്ന്.” പുരോഹിതീയ അളവുപ്രയോഗത്തിൽ ഇത് ഓരോ അപ്പത്തിനും ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള രണ്ട് അളവ് എന്നാണ് അർഥം.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: നീ ... എടുത്ത്
  rationale: നിർദേശക്രമത്തിലെ കല്പനാഭാവം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗാരാധനാസന്ദർഭത്തിൽ ഉപയോഗിക്കുന്ന നന്നായി ശുദ്ധീകരിച്ച മാവിനെ സൂചിപ്പിക്കുന്ന പതിവായ മലയാള പ്രയോഗം; മൂലത്തിൽ പറയാത്ത ധാന്യവർഗം ചേർക്കുന്നില്ല.
- source_word: וְאָפִיתָ אֹתָהּ
  choice: അതുകൊണ്ട് ... ചുടണം
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മാവിലേക്കാണ് മടങ്ങുന്നത്; മലയാളത്തിൽ ഫലമായി അപ്പങ്ങൾ ഉണ്ടാക്കുന്നതു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: പന്ത്രണ്ട് അപ്പങ്ങൾ
  rationale: חַלּוֹת എന്നത് ആചാരപരമായ സന്ദർഭത്തിലെ വേവിച്ച അപ്പഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് 'അപ്പങ്ങൾ' വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള രണ്ട് അളവ്
  rationale: പുരോഹിതീയ അളവുഭാഷയിലെ രണ്ട് പത്തിലൊന്നിനെ വ്യക്തമായി അവതരിപ്പിക്കുകയും ഓരോ അപ്പത്തിനുമുള്ള അളവാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: ഓരോ അപ്പത്തിനും ... ഉണ്ടായിരിക്കണം
  rationale: അക്ഷരാർഥത്തിലെ 'ഒരു അപ്പം' ഇവിടെ വിതരണാർഥത്തിൽ ഓരോ അപ്പത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അതിന്റെ സ്വാഭാവിക രൂപമാണിത്.
