  - severity: low
    issue: The main-text expression for the quantity is stylistically heavy.
    rationale: Reordering it as “ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള രണ്ട് അളവ് മാവ്” more transparently communicates two one-tenth measures for each loaf.
