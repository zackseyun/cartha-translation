translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കല്പനാഭാവത്തിന് 'ചുടണം' ഉപയോഗിച്ചു; അളവ് വ്യക്തതയ്ക്കായി വിപുലീകരിച്ചെങ്കിലും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
