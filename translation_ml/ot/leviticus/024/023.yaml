source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁה֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/יּוֹצִ֣יאוּ אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֖/וֹ אָ֑בֶן וּ/בְנֵֽי יִשְׂרָאֵ֣ל עָשׂ֔וּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: ml
  text: അങ്ങനെ മോശ ഇസ്രായേൽമക്കളോടു സംസാരിച്ചു. അവർ ശപിച്ചവനെ[a] പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോയി അവനെ കല്ലെറിഞ്ഞു. യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ ഇസ്രായേൽമക്കൾ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവദൂഷകനെ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ കൃദന്തത്തിന്റെ അക്ഷരാർഥം “ശപിച്ചവൻ” എന്നാണ്; മുൻസന്ദർഭത്തിൽ ദൈവനാമത്തെ ശപിച്ച മനുഷ്യനെയാണ് ഇതു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള דבר എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘സംസാരിക്കുക’ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ കുടുംബപരമായ രൂപം നിലനിർത്തുകയും മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: וַיּוֹצִיאוּ ... מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോയി
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘പുറത്തേക്കു കൊണ്ടുപോകുക’ എന്ന ചലനാർഥവും ലക്ഷ്യസ്ഥാനമായ പാളയത്തിനു പുറത്തും വ്യക്തമായി നൽകുന്നു.
- source_word: הַמְקַלֵּל
  choice: ശപിച്ചവനെ
  rationale: קלל എന്ന ക്രിയയുടെ കൃദന്തരൂപം മുൻസന്ദർഭത്തിൽ ദൈവനാമത്തെ ശപിച്ച മനുഷ്യനെ സൂചിപ്പിക്കുന്നു; ‘ദൈവദൂഷകൻ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: കല്ലെറിഞ്ഞു കൊന്നു
  rationale: എബ്രായത്തിലെ കല്ലെറിഞ്ഞുള്ള വധശിക്ഷയെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; വെറും ‘കല്ലെറിഞ്ഞു’ എന്നു പറഞ്ഞാൽ മരണഫലം അസ്പഷ്ടമാകാം.
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: കല്പിച്ചതുപോലെതന്നെ ... ചെയ്തു
  rationale: മുമ്പ് നൽകിയ കല്പനയോടുള്ള കൃത്യമായ അനുസരണം സൂചിപ്പിക്കുന്ന എബ്രായ സംഗ്രഹവാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപദവി ഉപയോഗിച്ച് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: הַמְקַלֵּל എന്നതിനെ ‘ദൈവദൂഷകൻ’ എന്നു വ്യാഖ്യാനപരമായി വിവർത്തനം ചെയ്യണമോ
  choice: ശപിച്ചവൻ
  alternative: ദൈവദൂഷകൻ
  rationale: സന്ദർഭം ദൈവനാമത്തിനെതിരായ ദൂഷണത്തെക്കുറിച്ചാണെങ്കിലും ഈ വാക്യത്തിലെ പദം അക്ഷരാർഥത്തിൽ ‘ശപിച്ചവൻ’ എന്നാണ്. അതിനാൽ മുഖ്യപാഠം നേരിട്ടുള്ള പദാർഥം നിലനിർത്തുകയും സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ,’ ‘പാളയം,’ ‘കല്പിച്ചു’ തുടങ്ങിയ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്കു തെളിമയുള്ളതാക്കി.
