  terminology: ‘മനുഷ്യൻ’ retains the masculine singular for אִישׁ in the agent clause. ‘മനുഷ്യനെ’ renders the generic human referent of אָדָם without importing a male-only limitation. ‘വധിക്കപ്പെടണം’ appropriately retains the passive legal formulation.
