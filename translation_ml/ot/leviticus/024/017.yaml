  source_fidelity: 'The draft rightly understands נֶפֶשׁ אָדָם as a human person/life rather than an immaterial soul, and it preserves the emphatic passive death-penalty formula. However, ‘മനുഷ്യജീവനെ ... പ്രഹരിച്ചാൽ’ is not idiomatic Malayalam: one strikes a person, not ‘a human life.’'
