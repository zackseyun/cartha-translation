source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: ml
  text: ഒരു മനുഷ്യൻ ഏതെങ്കിലും മനുഷ്യനെ പ്രഹരിച്ച് കൊന്നാൽ[b][a], അവൻ തീർച്ചയായും വധിക്കപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഏതെങ്കിലും മനുഷ്യന്റെ ജീവൻ.’ ഇവിടെ പറയുന്നത് ഒരു മനുഷ്യവ്യക്തിയെയോ മനുഷ്യജീവനെയോ കുറിച്ചാണ്; ശരീരത്തിൽനിന്ന് വേറിട്ട അമൂർത്തമായ ‘ആത്മാവിനെ’ പ്രത്യേകമായി ഉദ്ദേശിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഏതെങ്കിലും മനുഷ്യനെ മാരകമായി പ്രഹരിച്ചാൽ.’ എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘പ്രഹരിക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ അത് മരണകാരണമാകുന്ന പ്രഹരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: ഒരു മനുഷ്യൻ ... ചെയ്താൽ
  rationale: אִישׁ എന്ന പുല്ലിംഗ ഏകവചനം ‘ഒരു മനുഷ്യൻ’ എന്നു നിലനിർത്തുന്നു; നിയമവാക്യത്തിലെ כִּי നിബന്ധനയെ മലയാളത്തിലെ ‘ചെയ്താൽ’ എന്ന ഘടന സ്വാഭാവികമായി അറിയിക്കുന്നു. വാക്യാരംഭത്തിലെ וְ മലയാളത്തിൽ നിർബന്ധമായി വേറിട്ട ‘കൂടാതെ’കൊണ്ട് പ്രകടിപ്പിക്കാതെ സന്ദർഭബന്ധത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: יַכֶּה
  choice: മാരകമായി പ്രഹരിച്ചാൽ
  rationale: נכה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘പ്രഹരിക്കുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും, ഈ സന്ദർഭത്തിൽ പ്രഹരം മരണകാരണമാണെന്ന അർഥം ‘മാരകമായി’കൊണ്ട് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: ഏതെങ്കിലും മനുഷ്യജീവനെ
  rationale: נֶפֶשׁ ഇവിടെ ഭൗതികശരീരത്തിൽനിന്നു വേർപ്പെട്ട ‘ആത്മാവ്’ എന്നല്ല, മനുഷ്യന്റെ ജീവൻ/ജീവിക്കുന്ന വ്യക്തി എന്നാണർഥം. אָדָם പൊതുവായി മനുഷ്യനെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ‘മനുഷ്യജീവൻ’ എന്ന ഘടന സംരക്ഷിക്കുന്നു.
- source_word: מוֹת יוּמָת
  choice: അവൻ നിർബന്ധമായും വധിക്കപ്പെടണം
  rationale: infinitive absolute കൂടിയ passive imperfect നൽകുന്ന ശക്തമായ മരണശിക്ഷാ സൂത്രം ‘നിർബന്ധമായും’കൊണ്ട് പ്രകടിപ്പിക്കുന്നു; passive രൂപം ‘വധിക്കപ്പെടണം’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ നിയമസന്ദർഭത്തിലെ വ്യാപ്തി
  choice: മനുഷ്യജീവൻ
  alternative: പുരുഷന്റെ ജീവൻ / ഒരു വ്യക്തി
  rationale: ഇവിടെ אָדָם പുരുഷന്മാർക്കു മാത്രമല്ല, മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അതിനാൽ ഇരയുടെ ലിംഗം പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: אִישׁ എന്ന പുല്ലിംഗ ഏകവചനത്തിന്റെ അവതരണം
  choice: ഒരു മനുഷ്യൻ
  alternative: ആരെങ്കിലും / ഒരു വ്യക്തി
  rationale: നിയമത്തിന് പ്രതിനിധാത്മക വ്യാപ്തിയുണ്ടെങ്കിലും, മൂലപാഠത്തിലെ വ്യക്തമായ പുല്ലിംഗ ഏകവചനം അനാവശ്യമായി ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ മാനവശാസ്ത്രപരമായ അർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ് / വ്യക്തി
  rationale: ഈ സന്ദർഭത്തിൽ കൊല്ലപ്പെടാവുന്ന മനുഷ്യജീവനെയാണ് സൂചിപ്പിക്കുന്നത്; ശരീരത്തിൽനിന്നു വേറിട്ട അമൂർത്ത ആത്മാവിനെ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ‘മാരകമായി പ്രഹരിക്കുക’ മൂലക്രിയയുടെ ദൃശ്യസ്വഭാവവും ഫലവും ഒരുമിച്ച് അറിയിക്കുന്നു; ‘നിർബന്ധമായും വധിക്കപ്പെടണം’ ശിക്ഷാസൂത്രത്തിന്റെ ഊന്നലും കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
