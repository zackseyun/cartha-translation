    rationale: ജീവൻ (‘life’) is not normally the object of ‘പ്രഹരിക്കുക’ (‘strike’). The Hebrew expression denotes the person struck/killed; rendering the object as ‘ഏതെങ്കിലും മനുഷ്യനെ’ is both natural and contextually accurate.
