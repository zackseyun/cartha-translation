source:
  edition: WLC
  text: וְ/אִם תֵּֽלְכ֤וּ עִמִּ/י֙ קֶ֔רִי וְ/לֹ֥א תֹאב֖וּ לִ/שְׁמֹ֣עַֽ לִ֑/י וְ/יָסַפְתִּ֤י עֲלֵי/כֶם֙ מַכָּ֔ה שֶׁ֖בַע כְּ/חַטֹּאתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: ml
  text: നിങ്ങൾ എനിക്കു വിരോധമായി നടക്കുകയും എന്റെ വാക്കു കേൾക്കാൻ മനസ്സില്ലാതിരിക്കുകയും ചെയ്താൽ, നിങ്ങളുടെ പാപങ്ങൾക്കനുസരിച്ച് ഞാൻ നിങ്ങളെ ഏഴിരട്ടിയായി കൂടുതൽ പ്രഹരിക്കും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ എന്നോടു ശത്രുതയോടെ പെരുമാറുകയും.” “എന്നോടുകൂടെ കേരി ആയി നടക്കുക” എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം ദുഷ്കരമാണ്; ഇവിടെ അത് യാദൃച്ഛികതയെക്കാൾ എതിർപ്പിന്റെ നിലപാടിനെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങളുടെ പാപങ്ങൾക്കനുസരിച്ച് നിങ്ങളെ ഏഴു പ്രാവശ്യം പ്രഹരിക്കാൻ ഞാൻ വീണ്ടും കൂട്ടിച്ചേർക്കും.”
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרִי
  choice: വിരോധമായി
  rationale: ഈ അധ്യായത്തിലെ ആവർത്തിത പ്രയോഗത്തിൽ ഇത് യാദൃച്ഛികതയെക്കാൾ ദൈവത്തോടുള്ള എതിർപ്പിന്റെ നിലപാടാണ് സൂചിപ്പിക്കുന്നത്. ‘വിരോധമായി’ എന്നത് ആ ബന്ധപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: നിങ്ങൾ എനിക്കു വിരോധമായി നടക്കുക
  rationale: ‘നടക്കുക’ എന്ന എബ്രായ പ്രയോഗം പെരുമാറ്റത്തെയും ജീവിതരീതിയെയും സൂചിപ്പിക്കുന്നു. രൂപകത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തിക്കൊണ്ട് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: תֹאבוּ
  choice: മനസ്സില്ലാതിരിക്കുക
  rationale: ക്രിയ കേവലം പ്രവർത്തിക്കാതിരിക്കലല്ല, മനസ്സിന്റെ വിസമ്മതത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മനസ്സില്ലാതിരിക്കുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ഉറവിടത്തോട് അടുത്തതുമാണ്.
- source_word: לִשְׁמֹעַ לִי
  choice: എന്റെ വാക്കു കേൾക്കുക
  rationale: ഉടമ്പടി സന്ദർഭത്തിൽ ‘കേൾക്കുക’ അനുസരണത്തെയും ഉൾക്കൊള്ളുന്നു. എന്നാൽ ‘അനുസരിക്കുക’ എന്നു മാത്രം പറഞ്ഞ് ആ അർഥപരമായ വ്യാപ്തി ചുരുക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ‘എന്റെ വാക്കു കേൾക്കുക’ ഉപയോഗിച്ചു.
- source_word: וְיָסַפְתִּי
  choice: കൂടുതൽ എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ഭാവിക്രിയ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘കൂട്ടിച്ചേർക്കുക/വീണ്ടും ചെയ്യുക’ എന്നതാണ്. മുൻവിധികളുടെ തുടർച്ചയായ ശിക്ഷാവർധന സന്ദർഭത്തിൽ ‘ഏഴിരട്ടിയായി പ്രഹരിക്കും’ എന്നതിൽ വർധന വ്യക്തമാണ്; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: מַכָּה
  choice: പ്രഹരിക്കും
  rationale: നാമരൂപത്തിലുള്ള ‘പ്രഹരം/ബാധ’ ഇവിടെ ക്രിയാത്മകമായി പരിഭാഷപ്പെടുത്തുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘മഹാമാരി’ എന്നതുപോലെ ഒരു പ്രത്യേക ശിക്ഷാമാർഗത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: שֶׁבַע
  choice: ഏഴിരട്ടിയായി
  rationale: ശിക്ഷയുടെ തീവ്രവർധന സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിന് ‘ഏഴിരട്ടിയായി’ സ്വാഭാവികമായ മലയാള തുല്യമാണ്; ‘ഏഴു പ്രാവശ്യം’ എന്ന വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: כְּחַטֹּאתֵיכֶם
  choice: നിങ്ങളുടെ പാപങ്ങൾക്കനുസരിച്ച്
  rationale: כְּ എന്ന ഉപസർഗത്തിന്റെ അനുരൂപതയോ അളവനുസൃതതയോ ഉള്ള ഭാവം ഇത് നിലനിർത്തുന്നു; വെറും ‘പാപങ്ങൾ നിമിത്തം’ എന്ന കാരണാർഥത്തേക്കാൾ ഉറവിടത്തോട് അടുത്തതാണ്.
theological_decisions:
- issue: ഉടമ്പടിശിക്ഷയുടെ സ്വഭാവവും തീവ്രതയും
  choice: ഇസ്രായേലിന്റെ പാപങ്ങൾക്കനുസരിച്ചുള്ള ദൈവിക ശിക്ഷയുടെ വർധനയായി അവതരിപ്പിച്ചു; ശിക്ഷയുടെ പ്രത്യേക മാർഗം നിർണ്ണയിച്ചില്ല.
  alternative: מַכָּה എന്നത് പ്രത്യേകിച്ച് ‘മഹാമാരി’ എന്നും כְּחַטֹּאתֵיכֶם എന്നത് കേവലം ‘നിങ്ങളുടെ പാപങ്ങൾ നിമിത്തം’ എന്നും പരിഭാഷപ്പെടുത്താം.
  rationale: വാക്യം ലേവ്യപുസ്തകം 26-ലെ ഉടമ്പടിശിക്ഷകളുടെ ക്രമവർധനയിലാണ്. എബ്രായം ആവശ്യപ്പെടാത്ത ഒരു പ്രത്യേക ശിക്ഷാമാർഗം ചേർക്കാതെ മുന്നറിയിപ്പിന്റെ തീവ്രതയും പാപങ്ങളുമായുള്ള അനുരൂപതയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നടക്കുക’, ‘കേൾക്കുക’ എന്നീ ഉറവിടരൂപകങ്ങൾ നിലനിർത്തിയപ്പോൾ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘എന്റെ വാക്കു’ ചേർത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
