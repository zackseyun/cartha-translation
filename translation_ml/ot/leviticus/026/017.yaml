source:
  edition: WLC
  text: וְ/נָתַתִּ֤י פָנַ/י֙ בָּ/כֶ֔ם וְ/נִגַּפְתֶּ֖ם לִ/פְנֵ֣י אֹיְבֵי/כֶ֑ם וְ/רָד֤וּ בָ/כֶם֙ שֹֽׂנְאֵי/כֶ֔ם וְ/נַסְתֶּ֖ם וְ/אֵין רֹדֵ֥ף אֶתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: ml
  text: ഞാൻ എന്റെ മുഖം നിങ്ങൾക്കെതിരേ തിരിക്കും[a]; നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ നിങ്ങൾ അടിച്ചുവീഴ്ത്തപ്പെടും[b]. നിങ്ങളെ വെറുക്കുന്നവർ നിങ്ങളെ ഭരിക്കും; നിങ്ങളെ പിന്തുടരാൻ ആരുമില്ലാതിരിക്കെ[c] നിങ്ങൾ ഓടിപ്പോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ മുഖം നിങ്ങൾക്കെതിരേ തിരിക്കും’ എന്നത് ന്യായവിധിയിൽ ദൃഢമായി എതിർക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾ പരാജയപ്പെടും.’
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ, ‘നിങ്ങളെ പിന്തുടരുന്നില്ലെങ്കിലും.’ അക്ഷരാർഥം: ‘നിങ്ങളെ പിന്തുടരുന്നവൻ ആരുമില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָכֶם
  choice: ഞാൻ എന്റെ മുഖം നിങ്ങൾക്കെതിരെ നിർത്തും
  rationale: ദൈവം ന്യായവിധിയിൽ ദൃഢമായി എതിർക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിലെ ‘മുഖം’ നിലനിർത്തുന്നു; മലയാളത്തിൽ അർഥം ഗ്രഹിക്കാവുന്ന വിധം ‘എതിരെ നിർത്തും’ എന്നു നൽകി.
- source_word: וְנִגַּפְתֶּם
  choice: നിങ്ങൾ അടിച്ചുവീഴ്ത്തപ്പെടും
  rationale: യുദ്ധസന്ദർഭത്തിൽ തോൽപ്പിക്കപ്പെടുകയോ അടിച്ചുവീഴ്ത്തപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന നിഫാൽ രൂപത്തിന്റെ ശക്തിയും ദൃശ്യതയും നിലനിർത്തുന്നു.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ
  rationale: സ്ഥാനപരവും സൈനികവുമായ നേരിട്ടുള്ള പ്രയോഗം സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְרָדוּ בָכֶם
  choice: നിങ്ങളെ ഭരിക്കും
  rationale: רדה സൂചിപ്പിക്കുന്ന അധീനഭരണത്തെ നേരിട്ട് നൽകുന്നു; പീഡനത്തിന്റെ തോത് സംബന്ധിച്ച് മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: שֹׂנְאֵיכֶם
  choice: നിങ്ങളെ വെറുക്കുന്നവർ
  rationale: മുമ്പുള്ള ‘ശത്രുക്കൾ’ എന്ന പദത്തിൽനിന്നുള്ള എബ്രായത്തിലെ പദവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: וְנַסְתֶּם
  choice: നിങ്ങൾ ഓടിപ്പോകും
  rationale: ഭയത്താൽ പലായനം ചെയ്യുന്നതിനെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: ആരും നിങ്ങളെ പിന്തുടരാതിരിക്കെ
  rationale: യഥാർഥ പിന്തുടർച്ചക്കാരൻ ഇല്ലാതെയും അവർ പരിഭ്രാന്തരായി ഓടുമെന്ന ആശയം നൽകുന്നു; എബ്രായ ഘടനയിലെ കാലപരമോ വിരുദ്ധാർഥകമോ ആയ സൂക്ഷ്മത ഒരൊറ്റ ദിശയിൽ അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ന്യായവിധിയിലെ ദൈവത്തെക്കുറിച്ചുള്ള മനുഷ്യരൂപക ഭാഷ
  choice: ‘ഞാൻ എന്റെ മുഖം നിങ്ങൾക്കെതിരെ നിർത്തും’ എന്ന പ്രയോഗം നിലനിർത്തി
  alternative: ‘ഞാൻ നിങ്ങളെ എതിർക്കും’
  rationale: വെറും അമൂർത്തമായ എതിർപ്പായി ചുരുക്കാതെ, ദൈവത്തിന്റെ വ്യക്തിപരവും ഉടമ്പടിസംബന്ധവുമായ ദൃഢവിരോധം പ്രകടമാക്കുന്ന മൂലഭാഷയിലെ രൂപകം സംരക്ഷിക്കുന്നു.
- issue: വെറുക്കുന്നവരുടെ അധീനതയുടെ സ്വഭാവം
  choice: ‘നിങ്ങളെ ഭരിക്കും’
  alternative: ‘നിങ്ങളെ അടിച്ചമർത്തും’
  rationale: വാക്യം അധീനഭരണം വ്യക്തമാക്കുന്നു; എന്നാൽ അതിന്റെ ക്രൂരതയുടെ അളവ് ഇവിടെ പ്രത്യേകം നിർവചിക്കാത്തതിനാൽ കൂടുതൽ ശക്തമായ വ്യാഖ്യാനപദം ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ബഹുവചന അഭിസംബോധന എല്ലായിടത്തും നിലനിർത്തി. ‘ശത്രുക്കൾ’ എന്നും ‘വെറുക്കുന്നവർ’ എന്നും ഉള്ള മൂലപാഠത്തിലെ പദവ്യത്യാസവും ദൈവത്തിന്റെ ‘മുഖം’ എന്ന രൂപകവും സംരക്ഷിച്ചു.
