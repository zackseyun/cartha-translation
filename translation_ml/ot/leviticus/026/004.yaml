  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י גִשְׁמֵי/כֶ֖ם בְּ/עִתָּ֑/ם וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ יְבוּלָ֔/הּ וְ/עֵ֥ץ הַ/שָּׂדֶ֖ה יִתֵּ֥ן פִּרְיֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: ml
  text: അപ്പോൾ ഞാൻ നിങ്ങൾക്കു മഴ അതതു കാലത്ത് നൽകും[a]. ദേശം അതിന്റെ വിളവ് നൽകും; വയലിലെ വൃക്ഷങ്ങൾ അവയുടെ ഫലം നൽകും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘യഥാസമയത്ത്’ അല്ലെങ്കിൽ ‘തക്ക കാലത്ത്.’'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ ‘വയലിലെ വൃക്ഷം’ എന്ന് ഏകവചനമാണെങ്കിലും അതിന് കൂട്ടായ അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: ഞാൻ നൽകും
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘നൽകുക’ നിലനിർത്തുന്നു; ഉടമ്പടിവാഗ്ദാനത്തിൽ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: גִשְׁמֵיכֶם
  choice: നിങ്ങൾക്കുള്ള മഴ
  rationale: ബഹുവചനമായ ‘നിങ്ങളുടെ മഴകൾ’ എന്നത് മലയാളത്തിൽ കൃത്രിമമാകുന്നതിനാൽ, ഇസ്രായേലിന്റെ പ്രയോജനത്തിനായി ലഭിക്കുന്ന കാലാനുസൃത മഴ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּעִתָּם
  choice: അതതു കാലത്ത്
  rationale: മഴകൾ അവയ്ക്കു യോജിച്ച നിർദിഷ്ട സമയങ്ങളിൽ ലഭിക്കുന്നതിനെ വ്യക്തമാക്കുകയും എബ്രായത്തിലെ സമയസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְנָתְנָה הָאָרֶץ
  choice: ദേശം ... നൽകും
  rationale: הָאָרֶץ ഇവിടെ ഉടമ്പടിയുടെ കാർഷിക പശ്ചാത്തലത്തിലുള്ള ദേശത്തെ സൂചിപ്പിക്കുന്നു. נתן എന്ന ക്രിയയുടെ ആവർത്തനം ‘നൽകും’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: יְבוּלָהּ
  choice: അതിന്റെ വിളവ്
  rationale: יְבוּל എന്നത് ദേശത്തിന്റെ കാർഷിക ഉൽപ്പാദനത്തെ സൂചിപ്പിക്കുന്നു; ‘വിളവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְעֵץ הַשָּׂדֶה
  choice: വയലിലെ വൃക്ഷങ്ങൾ
  rationale: എബ്രായ ഏകവചനം സമഷ്ട്യർഥത്തിലാണ്. ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ബഹുവചനം ഉപയോഗിക്കുന്നു.
- source_word: יִתֵּן פִּרְיוֹ
  choice: അവയുടെ ഫലം നൽകും
  rationale: נתן എന്ന ആവർത്തിത ക്രിയയെ ‘നൽകും’ എന്നു നിലനിർത്തുന്നു; സമഷ്ട്യർഥമുള്ള വൃക്ഷങ്ങളെ മലയാളത്തിൽ ബഹുവചനമായി അവതരിപ്പിച്ചതിനനുസരിച്ച് സർവനാമവും ബഹുവചനമാണ്.
theological_decisions:
- issue: അനുസരണവുമായി ബന്ധപ്പെട്ട ഉടമ്പടി അനുഗ്രഹത്തിന്റെ കാർഷിക ഭാഷ
  choice: മഴ, വിളവ്, ഫലം എന്നിവയെക്കുറിച്ചുള്ള ദൈവിക വാഗ്ദാനം അതിന്റെ മൂർത്തമായ കാർഷിക അർഥത്തിൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇതിനെ എല്ലാ കാലത്തേക്കുമുള്ള ഭൗതിക സമൃദ്ധിവാഗ്ദാനമായി വികസിപ്പിക്കുകയോ പൂർണമായും ആത്മീയ സമൃദ്ധിയുടെ രൂപകമായി മാറ്റുകയോ ചെയ്യുക.
  rationale: സന്ദർഭം ഇസ്രായേലിനോടുള്ള ഉടമ്പടിയിലെ മഴയും ദേശത്തിന്റെ ഫലഭൂയിഷ്ഠതയും സംബന്ധിച്ച അനുഗ്രഹമാണ്. പരിഭാഷ പിന്നീടുള്ള ദൈവശാസ്ത്ര പ്രയോഗങ്ങൾ വാക്യത്തിലേക്ക് ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യത്തിലെ נתן (‘നൽകുക’) എന്ന ക്രിയയുടെ ആവർത്തനം മഴ, ദേശത്തിന്റെ വിളവ്, വൃക്ഷങ്ങളുടെ ഫലം എന്നീ ഭാഗങ്ങളിൽ കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്.
