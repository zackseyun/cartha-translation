revisions:
- from: അത് ശൂന്യമായിക്കിടക്കുന്ന നാളുകളിലൊക്കെയും, നിങ്ങൾ അതിൽ പാർത്തിരുന്നപ്പോൾ നിങ്ങളുടെ ശബ്ബത്തുകളിൽ[a] അതിന് ലഭിക്കാതിരുന്ന വിശ്രമം അത് അനുഭവിക്കും.[b]
  to: അത് ശൂന്യമായിക്കിടക്കുന്ന നാളുകളിലെല്ലാം അത് വിശ്രമിക്കും; നിങ്ങൾ അതിൽ പാർത്തിരുന്നപ്പോൾ നിങ്ങളുടെ ശബ്ബത്തുകളിൽ[a] അതു വിശ്രമിക്കാതിരുന്നതിന് പകരമായിരിക്കും ആ വിശ്രമം.[b]
  rationale: The revision replaces ‘അനുഭവിക്കും’ with ‘വിശ്രമിക്കും’ for direct lexical and imagery fidelity to the repeated Hebrew verb. It expresses the object/compensatory force of אֵת אֲשֶׁר לֹא שָׁבְתָה as ‘അതിനു പകരമായിരിക്കും ആ വിശ്രമം,’ a clear Malayalam formulation that does not add doctrinal interpretation. Existing footnote anchors remain correctly attached.
