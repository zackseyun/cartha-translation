  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל יְמֵ֥י הָשַּׁמָּ֖/ה תִּשְׁבֹּ֑ת אֵ֣ת אֲשֶׁ֧ר לֹֽא שָׁבְתָ֛ה בְּ/שַׁבְּתֹתֵי/כֶ֖ם בְּ/שִׁבְתְּ/כֶ֥ם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: ml
  text: അത് ശൂന്യമായിക്കിടക്കുന്ന നാളുകളിലെല്ലാം അത് വിശ്രമിക്കും; നിങ്ങൾ അതിൽ പാർത്തിരുന്നപ്പോൾ നിങ്ങളുടെ ശബ്ബത്തുകളിൽ[a] അതു വിശ്രമിക്കാതിരുന്നതിന് പകരമായിരിക്കും ആ വിശ്രമം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘നിങ്ങളുടെ ശബ്ബത്തുകൾ’ എന്നത് ഭൂമിക്ക് നൽകേണ്ടിയിരുന്ന ശബ്ബത്ത്-വിശ്രമങ്ങളെ, പ്രത്യേകിച്ച് ചുറ്റുപാടുള്ള വാക്യങ്ങളിൽ പറയുന്ന ശബ്ബത്തുവർഷങ്ങളെ, സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: 'കൂടുതൽ പദാനുപദമായി: ‘നിങ്ങളുടെ ശബ്ബത്തുകളിൽ അതു വിശ്രമിക്കാതിരുന്നതിനെ അത് വിശ്രമിക്കും.’ എബ്രായത്തിൽ ‘വിശ്രമിക്കുക’ എന്ന ക്രിയ ഊന്നലിനായി ആവർത്തിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי הַשַּׁמָּה
  choice: അത് ശൂന്യമായിക്കിടക്കുന്ന നാളുകളിലൊക്കെയും
  rationale: כָּל יְמֵי എന്ന സമഗ്രമായ കാലസൂചനയും, ഭൂമിയെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ പ്രത്യയത്തോടുകൂടിയ הַשַּׁמָּה എന്ന ‘ശൂന്യത/ശൂന്യാവസ്ഥ’ ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תִּשְׁבֹּת אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: അതിന് ലഭിക്കാതിരുന്ന വിശ്രമം അത് അനുഭവിക്കും
  rationale: ശבת എന്ന ധാതുവിന്റെ ആവർത്തനം ‘വിശ്രമം’ എന്ന പദത്തിലൂടെ പ്രതിഫലിപ്പിക്കുകയും, אֵת אֲשֶׁר എന്ന അപൂർവമായ കർമഘടനയുടെ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: നിങ്ങളുടെ ശബ്ബത്തുകളിൽ
  rationale: മൂലത്തിലെ ‘നിങ്ങളുടെ ശബ്ബത്തുകൾ’ എന്ന രൂപം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ഭൂമിക്ക് നൽകേണ്ടിയിരുന്ന ശബ്ബത്ത്-വിശ്രമങ്ങളെ, പ്രത്യേകിച്ച് ശബ്ബത്തുവർഷങ്ങളെ, സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: നിങ്ങൾ അതിൽ പാർത്തിരുന്നപ്പോൾ
  rationale: ഇസ്രായേല്യർ ആ ഭൂമിയിൽ വസിച്ചിരുന്ന കാലത്തെ സൂചിപ്പിക്കുന്ന കാലാർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളുടെ ശബ്ബത്തുകൾ’ എന്നതിന്റെ പരിധി
  choice: പ്രധാനവാചകത്തിൽ വിശാലവും മൂലത്തോടടുത്തതുമായ ‘നിങ്ങളുടെ ശബ്ബത്തുകളിൽ’ നിലനിർത്തി
  alternative: ‘നിങ്ങളുടെ ശബ്ബത്തുവർഷങ്ങളിൽ’ എന്ന് വ്യക്തമായി വിവർത്തനം ചെയ്യുക
  rationale: ലേവ്യപുസ്തകം 26:34-ന്റെ സന്ദർഭം ശബ്ബത്തുവർഷങ്ങളെ മുൻനിർത്തുന്നുവെങ്കിലും, മൂലപദം പൊതുവായ ബഹുവചനമായതിനാൽ വ്യാഖ്യാനം പ്രധാനവാചകത്തിൽ ചുരുക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഭൂമിയെ സൂചിപ്പിക്കാൻ ‘അത്’ ഉപയോഗിച്ചു; ‘ശബ്ബത്ത്’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തി. രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാചകഭാഗങ്ങളിൽ ഉൾപ്പെടുത്തി.
