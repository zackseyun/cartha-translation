id: LEV.26.8
reference: Leviticus 26:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/רָדְפ֨וּ מִ/כֶּ֤ם חֲמִשָּׁה֙ מֵאָ֔ה וּ/מֵאָ֥ה מִ/כֶּ֖ם רְבָבָ֣ה יִרְדֹּ֑פוּ וְ/נָפְל֧וּ אֹיְבֵי/כֶ֛ם לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: ml
  text: നിങ്ങളിൽ അഞ്ചുപേർ നൂറുപേരെ പിന്തുടരും[a]; നിങ്ങളിൽ നൂറുപേർ പതിനായിരംപേരെ പിന്തുടരും[b]. നിങ്ങളുടെ ശത്രുക്കൾ നിങ്ങളുടെ മുമ്പിൽ വാളാൽ വീഴും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: രണ്ടു വാക്യഭാഗങ്ങളിലും ‘പിന്തുടരും’ എന്നതിന് ‘ഓടിച്ചുപോകും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദമായ רְבָבָה എന്നതിന് ‘പതിനായിരം’ എന്നോ ‘ഒരു മിരിയാദ്’ എന്നോ അർഥമാകാം; ഇവിടെ സംഖ്യകളുടെ സമാന്തരഘടനയ്ക്ക് ‘പതിനായിരം’ യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: ഓടിക്കും
  rationale: רדף എന്നത് പിന്തുടരുക/ഓടിക്കുക എന്നർഥമുള്ളതാണ്. സൈനികവിജയത്തിന്റെ ഈ സന്ദർഭത്തിൽ ‘ഓടിക്കും’ സ്വാഭാവികവും ശത്രുവിനെ പിന്തിരിപ്പിക്കുന്ന ആശയം വ്യക്തമാക്കുന്നതുമാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִכֶּם
  choice: നിങ്ങളിൽ
  rationale: 'מן ഇവിടെ ഭാഗത്തെ സൂചിപ്പിക്കുന്നു: ‘നിങ്ങളിൽ അഞ്ചുപേർ’, ‘നിങ്ങളിൽ നൂറുപേർ’.'
- source_word: חֲמִשָּׁה מֵאָה
  choice: അഞ്ചുപേർ നൂറുപേരെ
  rationale: എബ്രായ സംഖ്യാതുലനം വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ വ്യക്തികളെ എണ്ണുന്നതിനുള്ള ‘പേർ’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: רְבָבָה
  choice: പതിനായിരംപേർ
  rationale: רְבָבָהയ്ക്ക് ‘പതിനായിരം’ എന്നും ‘അസംഖ്യം/വലിയൊരു സംഘം’ എന്നും അർഥമാകാം; ഇവിടെ ഉയർന്നുവരുന്ന സംഖ്യാനുപാതം കണക്കിലെടുത്ത് നിർദിഷ്ട സംഖ്യ സ്വീകരിക്കുന്നു.
- source_word: וְנָפְלוּ
  choice: വീഴും
  rationale: נפל എന്നതിന്റെ നേരിട്ടുള്ള ദൃശ്യരൂപം നിലനിർത്തുന്നു; യുദ്ധസന്ദർഭത്തിൽ കൊല്ലപ്പെടുകയോ പരാജയപ്പെടുകയോ ചെയ്യുന്നതിന്റെ സൂചന സ്വാഭാവികമായി ലഭിക്കുന്നു.
- source_word: אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കൾ
  rationale: സൈനിക ഉടമ്പടി-അനുഗ്രഹസന്ദർഭത്തിൽ אויב എന്നതിന്റെ സാധാരണവും കൃത്യവുമായ പരിഭാഷ.
- source_word: לִפְנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽ
  rationale: സൈനികപരാജയം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֶחָרֶב
  choice: വാളാൽ
  rationale: യുദ്ധത്തിൽ വാളിനാൽ സംഭവിക്കുന്ന വീഴ്ചയെ സൂചിപ്പിക്കുന്ന കരണാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-അനുഗ്രഹത്തിലെ സൈനികവാഗ്ദാനം അതിശയോക്തിയോ അക്ഷരാർഥത്തിലുള്ള ഉറപ്പോ എന്ന ചോദ്യം
  choice: അസമാനമായ സൈനികവിജയത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള വാഗ്ദാനം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
  alternative: ഇത് നിർദിഷ്ട സൈനികവാഗ്ദാനമല്ലാതെ പൊതുവായ പ്രോത്സാഹനമായി വ്യാഖ്യാനിക്കുക.
  rationale: ലേവ്യർ 26-ലെ ഉടമ്പടി അനുഗ്രഹങ്ങളുടെ ഭാഗമായി വാക്യം വ്യക്തമായ സംഖ്യകളും യുദ്ധദൃശ്യവും ഉപയോഗിക്കുന്നു; പരിഭാഷ ഈ സംഘർഷവും മൂർത്തതയും വ്യാഖ്യാനത്തിലൂടെ നീക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തനാത്മകമായ എബ്രായ സമാന്തരഘടനയും സൈനിക ദൃശ്യവും നിലനിർത്തി; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാകാൻ വ്യക്തിസംഖ്യകളോടൊപ്പം ‘പേർ’ ചേർത്തു.
