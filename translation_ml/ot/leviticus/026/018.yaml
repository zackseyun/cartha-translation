source:
  edition: WLC
  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: ml
  text: ഇതെല്ലാം ഉണ്ടായിട്ടും[a] നിങ്ങൾ എന്റെ വാക്കു കേൾക്കുന്നില്ലെങ്കിൽ, ഞാൻ നിങ്ങളുടെ പാപങ്ങൾ നിമിത്തം നിങ്ങളെ ഏഴിരട്ടിയായി[b] ശിക്ഷിച്ചു തിരുത്തുന്നത് തുടരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇതെല്ലാം കഴിഞ്ഞിട്ടും’ അല്ലെങ്കിൽ ‘ഇതെല്ലാം ഉണ്ടായിട്ടും.’ മുമ്പ് പറഞ്ഞ ന്യായവിധികൾ ഉണ്ടായിട്ടും എന്ന അർഥമാണ് ഈ എബ്രായ പ്രയോഗത്തിനുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഏഴു പ്രാവശ്യം.’ കൃത്യമായ ഒരു എണ്ണത്തെക്കാൾ ശിക്ഷയുടെ വർധിച്ച തീവ്രതയെ എബ്രായപദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എങ്കിൽ
  rationale: മുന്നോട്ടു തുടരുന്ന ഉടമ്പടി-മുന്നറിയിപ്പിലെ വ്യവസ്ഥാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാക്യാരംഭത്തിലെ ബന്ധകശക്തി തുടർന്നുള്ള ഘടനയിലൂടെ നിലനിൽക്കുന്നു.
- source_word: עַד אֵלֶּה
  choice: ഇതെല്ലാം ഉണ്ടായിട്ടും
  rationale: ഇവിടെ പ്രയോഗം വെറും കാലപരിധിയെയല്ല, മുമ്പ് പറഞ്ഞ ന്യായവിധികൾ ഉണ്ടായിട്ടും അനുസരണക്കേട് തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: നിങ്ങൾ എന്റെ വാക്കു കേൾക്കുന്നില്ല
  rationale: שׁמע എന്ന പദത്തിന്റെ കേൾവി-രൂപകം നിലനിർത്തുകയും സന്ദർഭത്തിൽ അടങ്ങിയിരിക്കുന്ന അനുസരണത്തിന്റെ ആശയം സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְיָסַפְתִּי
  choice: തുടരും
  rationale: ശിക്ഷാനടപടി വീണ്ടും തുടരുകയും രൂക്ഷമാകുകയും ചെയ്യുന്നതാണ് ഇവിടെ ഉദ്ദേശ്യം; അക്ഷരാർഥമായ ‘കൂട്ടും’ എന്നതിനെക്കാൾ ‘തുടരും’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: നിങ്ങളെ ശിക്ഷിച്ചു തിരുത്തുന്നത്
  rationale: יסר എന്ന പദത്തിലുള്ള ശിക്ഷാത്മകവും തിരുത്തൽ ലക്ഷ്യമുള്ളതുമായ രണ്ടു വശങ്ങളും ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: שֶׁבַע
  choice: ഏഴിരട്ടിയായി
  rationale: ന്യായവിധിയുടെ തീവ്രത വർധിക്കുന്നതിനെ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു; കൃത്യമായ എണ്ണമായി വായിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: നിങ്ങളുടെ പാപങ്ങൾ നിമിത്തം
  rationale: ശിക്ഷയുടെ കാരണമോ അടിസ്ഥാനമോ പാപങ്ങളാണെന്ന ആശയം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-ശാപത്തിന്റെ സന്ദർഭത്തിൽ יָסַר എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: ശിക്ഷിച്ചു തിരുത്തുക
  alternative: ശിക്ഷിക്കുക; തിരുത്തുക
  rationale: ഈ നടപടിക്ക് യഥാർഥ ശിക്ഷാത്മക ശക്തിയുണ്ടെങ്കിലും അതിൽ തിരുത്തൽ ലക്ഷ്യവും അടങ്ങിയിരിക്കുന്നു. ഒരു വശം മാത്രം തിരഞ്ഞെടുക്കാതെ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് പരിഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘എന്റെ വാക്കു കേൾക്കുക’ എന്ന പ്രയോഗം കേൾവിയുടെ രൂപകവും അനുസരണത്തിന്റെ ഉടമ്പടിപരമായ സൂചനയും നിലനിർത്തുന്നു. ‘ശിക്ഷിച്ചു തിരുത്തുക’ എന്നത് ശിക്ഷയുടെയും തിരുത്തലിന്റെയും ഇരട്ടഭാവം സംരക്ഷിക്കുന്നു.
