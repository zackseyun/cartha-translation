  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/שִׁבְרִ֣/י לָ/כֶם֮ מַטֵּה לֶחֶם֒ וְ֠/אָפוּ עֶ֣שֶׂר נָשִׁ֤ים לַחְמְ/כֶם֙ בְּ/תַנּ֣וּר אֶחָ֔ד וְ/הֵשִׁ֥יבוּ לַחְמְ/כֶ֖ם בַּ/מִּשְׁקָ֑ל וַ/אֲכַלְתֶּ֖ם וְ/לֹ֥א תִשְׂבָּֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളുടെ അപ്പത്തിന്റെ ലഭ്യത തകർക്കുമ്പോൾ[a], പത്തു സ്ത്രീകൾ നിങ്ങളുടെ അപ്പം ഒരേയൊരു അടുപ്പിൽ ചുട്ട്, തൂക്കി നിങ്ങൾക്കു തിരികെ നൽകും. നിങ്ങൾ ഭക്ഷിക്കും; എങ്കിലും തൃപ്തരാകുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അപ്പത്തിന്റെ വടി’; ജീവൻ നിലനിർത്തുന്ന അപ്പത്തിന്റെ ലഭ്യതയെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: ഞാൻ ... തകർക്കുമ്പോൾ
  rationale: בְּ + infinitive construct ഇവിടെ കാലസൂചക ഉപവാക്യം രൂപപ്പെടുത്തുന്നു. ‘തകർക്കുമ്പോൾ’ ന്യായവിധിയുടെ ശക്തമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: מַטֵּה לֶחֶם
  choice: നിങ്ങളുടെ അപ്പത്തിന്റെ ആശ്രയം
  rationale: അക്ഷരാർഥത്തിൽ ‘അപ്പത്തിന്റെ വടി’ എന്ന ഈ പ്രയോഗം അപ്പം നൽകുന്ന ജീവധാരണശേഷിയെയോ ഉപജീവനാധാരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അപ്പത്തിന്റെ ആശ്രയം’ മൂലരൂപകത്തോട് അടുത്തുനിൽക്കുകയും മലയാളത്തിൽ അർഥഗ്രാഹ്യമാകുകയും ചെയ്യുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְאָפוּ עֶשֶׂר נָשִׁים
  choice: പത്തു സ്ത്രീകൾ ... ചുട്ട്
  rationale: ഭാവിയിലെ ന്യായവിധിയുടെ ഫലക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; സ്ത്രീകൾ എന്ന വ്യക്തമായ പരാമർശം നിലനിർത്തുന്നു.
- source_word: בְּתַנּוּר אֶחָד
  choice: ഒരേയൊരു അടുപ്പിൽ
  rationale: '‘ഒന്ന്’ എന്ന ഊന്നൽ ക്ഷാമത്തെ വ്യക്തമാക്കുന്നു: പത്തു സ്ത്രീകളുടെ അപ്പവും ഒരൊറ്റ അടുപ്പിൽ ഒതുങ്ങും.'
- source_word: וְהֵשִׁיבוּ לַחְמְכֶם בַּמִּשְׁקָל
  choice: തൂക്കിക്കൊണ്ട് നിങ്ങൾക്കു തിരികെ നൽകും
  rationale: Hiphil രൂപം ‘തിരികെ നൽകുക’ എന്ന ആശയം നൽകുന്നു; בַּמִּשְׁקָל ക്ഷാമകാലത്തെ തൂക്കിയുള്ള വിഹിതവിതരണം സൂചിപ്പിക്കുന്നു.
- source_word: וַאֲכַלְתֶּם וְלֹא תִשְׂבָּעוּ
  choice: നിങ്ങൾ ഭക്ഷിക്കും; എങ്കിലും തൃപ്തരാകുകയില്ല
  rationale: ഭക്ഷിച്ചിട്ടും വിശപ്പ് മാറാത്ത അവസ്ഥയെ שׂבע സൂചിപ്പിക്കുന്നു. ‘തൃപ്തരാകുകയില്ല’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
