  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ക്ഷാമത്തിന്റെ ദൃശ്യവും മൂലപാഠത്തിലെ ‘അപ്പം’ എന്ന പ്രത്യേക രൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
