  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/תַ֥ם לָ/רִ֖יק כֹּחֲ/כֶ֑ם וְ/לֹֽא תִתֵּ֤ן אַרְצְ/כֶם֙ אֶת יְבוּלָ֔/הּ וְ/עֵ֣ץ הָ/אָ֔רֶץ לֹ֥א יִתֵּ֖ן פִּרְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: ml
  text: നിങ്ങളുടെ ശക്തി വ്യർഥമായി ക്ഷയിച്ചുപോകും[a]. നിങ്ങളുടെ ദേശം അതിന്റെ വിളവ് നൽകുകയില്ല; ദേശത്തിലെ വൃക്ഷങ്ങൾ അവയുടെ ഫലം നൽകുകയുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിങ്ങളുടെ ശക്തി ശൂന്യതയ്ക്കായി തീർന്നുപോകും”; “ദേശത്തിലെ വൃക്ഷം അതിന്റെ ഫലം നൽകുകയില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַם
  choice: ക്ഷയിച്ചുപോകും
  rationale: תמם ഇവിടെ ശക്തി പൂർണമായി ചെലവായി തീരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ക്ഷയിച്ചുപോകും’ എന്നത് ആ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לָרִיק
  choice: വ്യർഥമായി
  rationale: ഈ പദം ഫലമില്ലായ്മയെയും നിഷ്ഫലതയെയും സൂചിപ്പിക്കുന്നു; ‘വ്യർഥമായി’ എന്നത് സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: כֹּחֲכֶם
  choice: നിങ്ങളുടെ ശക്തി
  rationale: כח എന്നത് ഇവിടെ കൃഷിയധ്വാനത്തിൽ ചെലവാകുന്ന ശക്തിയെയോ ശേഷിയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: תִתֵּן
  choice: നൽകുകയില്ല
  rationale: മൂലപദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘നൽകുക’ നിലനിർത്തുകയും ദേശവും വൃക്ഷങ്ങളും വിളവും ഫലവും നൽകുന്നു എന്ന മലയാളപ്രയോഗം സ്വാഭാവികമായി ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: אַרְצְכֶם
  choice: നിങ്ങളുടെ ദേശം
  rationale: ארץ ഇവിടെ ഇസ്രായേല്യരുടെ കൃഷിഭൂമിയുൾപ്പെടുന്ന ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ ഈ വിപുലത നിലനിർത്തുന്നു.
- source_word: יְבוּלָהּ
  choice: അതിന്റെ വിളവ്
  rationale: יבול ദേശത്തിന്റെ കാർഷിക ഉൽപ്പാദനത്തെ സൂചിപ്പിക്കുന്നു; ‘വിളവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְעֵץ הָאָרֶץ
  choice: ദേശത്തിലെ വൃക്ഷങ്ങൾ
  rationale: ഏകവചനരൂപമായ עץ ഇവിടെ സമൂഹവാചകമായി പ്രവർത്തിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: פִּרְיוֹ
  choice: അവയുടെ ഫലം
  rationale: എബ്രായത്തിൽ സമൂഹവാചക ഏകവചനത്തോട് യോജിക്കുന്ന ഏകവചന പ്രത്യയമാണുള്ളത്. ‘വൃക്ഷങ്ങൾ’ എന്ന് ബഹുവചനത്തിൽ പരിഭാഷപ്പെടുത്തിയതിനാൽ മലയാള വ്യാകരണാനുസൃതമായി ‘അവയുടെ’ എന്നു നൽകി.
