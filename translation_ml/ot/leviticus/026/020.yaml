translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ സമൂഹവാചക ഏകവചനം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകിയിരിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
