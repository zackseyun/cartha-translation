source:
  edition: WLC
  text: וְ/הִשְׁמַדְתִּ֞י אֶת בָּמֹֽתֵי/כֶ֗ם וְ/הִכְרַתִּי֙ אֶת חַמָּ֣נֵי/כֶ֔ם וְ/נָֽתַתִּי֙ אֶת פִּגְרֵי/כֶ֔ם עַל פִּגְרֵ֖י גִּלּוּלֵי/כֶ֑ם וְ/גָעֲלָ֥ה נַפְשִׁ֖/י אֶתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: ml
  text: നിങ്ങളുടെ ഉന്നതപൂജാസ്ഥലങ്ങളെ ഞാൻ നശിപ്പിക്കും; നിങ്ങളുടെ ധൂപപീഠങ്ങളെ[a] വെട്ടിവീഴ്ത്തും; നിങ്ങളുടെ ശവങ്ങളെ നിങ്ങളുടെ വിഗ്രഹശവങ്ങൾക്കുമേൽ ഇടും; എന്റെ ഉള്ളം നിങ്ങളെ വെറുക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിങ്ങളുടെ സൂര്യസ്തംഭങ്ങൾ.’ എബ്രായപദം അനധികൃത ആരാധനയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ രൂപം വിവാദവിഷയമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁמַדְתִּי
  choice: ഞാൻ നശിപ്പിക്കും
  rationale: שׁמד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം സമ്പൂർണമായ നശീകരണപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ശക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: בָּמֹתֵיכֶם
  choice: നിങ്ങളുടെ പൂജാഗിരികളെ
  rationale: במות ഉയർന്ന സ്ഥലങ്ങളിലുള്ള ആരാധനാകേന്ദ്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പൂജാഗിരികൾ’ ഉയരവും ആരാധനാപരമായ പ്രവർത്തനവും ചുരുക്കമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהִכְרַתִּי
  choice: വെട്ടിവീഴ്ത്തും
  rationale: כרת എന്നതിന്റെ മൗലികമായ ‘വെട്ടിക്കളയുക’ എന്ന ദൃശ്യഭാവം ആരാധനാവസ്തുക്കളുടെ നശീകരണസന്ദർഭത്തിൽ നിലനിർത്തുന്നു.
- source_word: חַמָּנֵיכֶם
  choice: നിങ്ങളുടെ ധൂപപീഠങ്ങളെ
  rationale: חמנים എന്നത് അനധികൃത ആരാധനയുമായി ബന്ധപ്പെട്ട വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; കൃത്യരൂപം വിവാദമായതിനാൽ വായനാസൗകര്യമുള്ള പ്രവർത്തനപരമായ വിവർത്തനം സ്വീകരിച്ചു.
- source_word: וְנָתַתִּי
  choice: ഇടും
  rationale: נתן ഇവിടെ ഒന്നിനെ മറ്റൊന്നിന്മേൽ വെക്കുക എന്ന സാധാരണ ഭൗതിക അർഥത്തിലാണ്.
- source_word: פִּגְרֵיכֶם
  choice: നിങ്ങളുടെ ശവങ്ങളെ
  rationale: פגר മനുഷ്യരുടെ നിർജീവമായ ശരീരങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ശവങ്ങൾ’ നേരിട്ടും ഗൗരവത്തോടെയും അർഥം നൽകുന്നു.
- source_word: פִּגְרֵי גִּלּוּלֵיכֶם
  choice: നിങ്ങളുടെ വിഗ്രഹങ്ങളുടെ ശവങ്ങൾ
  rationale: ഒരേ פגר പദം മനുഷ്യർക്കും വിഗ്രഹങ്ങൾക്കും ഉപയോഗിക്കുന്ന എബ്രായ ആവർത്തനം നിലനിർത്തി; അത് വിഗ്രഹങ്ങളുടെ നിർജീവതയും അപമാനവും ഊന്നുന്നു.
- source_word: גִּלּוּלֵיכֶם
  choice: നിങ്ങളുടെ വിഗ്രഹങ്ങൾ
  rationale: גִּלּוּלִים നിന്ദാസൂചകമായ വിഗ്രഹപദമാണ്; മുഖ്യപാഠത്തിൽ വ്യക്തവും സാധാരണവുമായ ‘വിഗ്രഹങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: וְגָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: എന്റെ ഉള്ളം നിങ്ങളെ വെറുക്കും
  rationale: നַפְשִׁי എന്ന പദത്തെ ഒഴിവാക്കാതെ ‘എന്റെ ഉള്ളം’ എന്നു നൽകി ദൈവിക വെറുപ്പിന്റെ തീവ്രവും മനുഷ്യരൂപകവുമായ ഭാഷ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക വെറുപ്പിനെ മനുഷ്യാനുഭവത്തിന്റെ ഭാഷയിൽ അവതരിപ്പിക്കൽ
  choice: എന്റെ ഉള്ളം നിങ്ങളെ വെറുക്കും
  alternative: ഞാൻ നിങ്ങളെ വെറുക്കും
  rationale: മൂലപാഠത്തിലെ נַפְשִׁי (‘എന്റെ ജീവൻ/ഉള്ളം’) നിലനിർത്തുന്നത് ദൈവത്തിന്റെ നിയമബന്ധപരമായ നിരാകരണത്തിന്റെ തീവ്രതയും വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും മയപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള, നേരിട്ടുള്ള ശിക്ഷാവിധിയുടെ ശൈലി. എബ്രായത്തിലെ ‘ശവങ്ങൾ’ എന്ന ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി. ‘പൂജാഗിരികൾ’ സാധാരണ വായനക്കാരന് അർഥസൂചന നൽകുന്ന സംക്ഷിപ്ത സംയുക്തപദമാണ്.
