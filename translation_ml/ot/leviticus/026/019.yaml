id: LEV.26.19
reference: Leviticus 26:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁבַרְתִּ֖י אֶת גְּא֣וֹן עֻזְּ/כֶ֑ם וְ/נָתַתִּ֤י אֶת שְׁמֵי/כֶם֙ כַּ/בַּרְזֶ֔ל וְ/אֶֽת אַרְצְ/כֶ֖ם כַּ/נְּחֻשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: ml
  text: നിങ്ങളുടെ ശക്തിയുടെ അഹങ്കാരം ഞാൻ തകർക്കും; നിങ്ങളുടെ ആകാശത്തെ[a] ഇരുമ്പുപോലെയും നിങ്ങളുടെ ദേശത്തെ വെങ്കലംപോലെയും[b] ആക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘നിങ്ങളുടെ ആകാശങ്ങൾ’ എന്ന ബഹുവചനരൂപമാണ്; മുകളിലെ ആകാശത്തെ സൂചിപ്പിക്കാൻ ഈ രൂപം പതിവായി ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ചെമ്പുപോലെ.’ എബ്രായപദത്തിന് ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: ഞാൻ തകർക്കും
  rationale: שׁבר എന്ന ക്രിയയുടെ ‘തകർക്കുക’ എന്ന അടിസ്ഥാനാർഥവും അഹങ്കാരത്തെ ഇല്ലാതാക്കുന്ന രൂപകപ്രയോഗവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: നിങ്ങളുടെ ശക്തിയുടെ അഹങ്കാരം
  rationale: גְּאוֹן എന്നതിന്റെ ഈ ന്യായവിധിസന്ദർഭത്തിലെ പ്രതികൂലമായ ‘അഹങ്കാരം’ എന്ന അർഥവും עֹז എന്നതിന്റെ ‘ശക്തി’ എന്ന അർഥവും എബ്രായത്തിലെ ബന്ധഘടനയോടടുത്ത് സംരക്ഷിക്കുന്നു.
- source_word: וְנָתַתִּי
  choice: ആക്കും
  rationale: נתן അക്ഷരാർഥത്തിൽ ‘നൽകുക/വെക്കുക’ എന്നാണെങ്കിലും, താരതമ്യപദങ്ങളോടുകൂടിയ ഈ ഘടനയിൽ എന്തിനെയെങ്കിലും മറ്റൊന്നുപോലെ ആക്കുക എന്ന ഫലാർഥമാണ്.
- source_word: שְׁמֵיכֶם
  choice: നിങ്ങളുടെ ആകാശത്തെ
  rationale: എബ്രായത്തിൽ ബഹുവചനരൂപമാണെങ്കിലും അത് മുകളിലെ ആകാശത്തെ സൂചിപ്പിക്കുന്ന പതിവുരൂപമാണ്; മലയാളത്തിൽ ഏകവചനമായ ‘ആകാശം’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: כַּבַּרְזֶל
  choice: ഇരുമ്പുപോലെ
  rationale: മഴ നൽകാത്ത, കഠിനവും വഴങ്ങാത്തതുമായ ആകാശത്തിന്റെ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אַרְצְכֶם
  choice: നിങ്ങളുടെ ദേശത്തെ
  rationale: אֶרֶץ എന്ന പദത്തിന് ദേശം, ഭൂമി, നിലം എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; ഉടമ്പടിയുടെയും കൃഷിയുടെയും ഈ സന്ദർഭത്തിൽ ‘ദേശം’ പ്രദേശത്തെയും അതിന്റെ മണ്ണിനെയും ഉൾക്കൊള്ളുന്നു.
- source_word: כַּנְּחֻשָׁה
  choice: വെങ്കലംപോലെ
  rationale: נְחֻשָׁה ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം; കഠിനവും വിളവുതരാത്തതുമായ ദേശത്തിന്റെ രൂപകത്തിൽ ‘വെങ്കലം’ സ്വാഭാവികവും പരമ്പരാഗതവുമായ തിരഞ്ഞെടുപ്പാണ്.
theological_decisions:
- issue: ശാപരൂപകത്തിന്റെ ആശയം
  choice: ആകാശം ഇരുമ്പുപോലെയും ദേശം വെങ്കലംപോലെയും ആകുന്ന രൂപകം അതേപടി നിലനിർത്തി.
  alternative: വരൾച്ചയും കൃഷിനാശവും നേരിട്ട് വിശദീകരിക്കുക.
  rationale: ഉടമ്പടിശാപത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ ദൃശ്യങ്ങൾ മഴയില്ലായ്മയെയും വിളവില്ലായ്മയെയും സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠം അവയെ നേരിട്ട് വിശദീകരിക്കാതെ രൂപകമായി അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സമാന്തര രൂപകങ്ങളും ‘ശക്തിയുടെ അഹങ്കാരം’ എന്ന ഉദ്ദേശപൂർവമായ ബന്ധഘടനയും സംരക്ഷിച്ചു; ദൃശ്യത്തിന്റെ അർഥം മുഖ്യപാഠത്തിൽ വിശദീകരിച്ച് ചുരുക്കിയിട്ടില്ല.
