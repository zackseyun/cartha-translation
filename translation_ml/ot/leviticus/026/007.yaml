  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ബഹുവചനമായ ‘നിങ്ങൾ’ നിലനിർത്തിയിരിക്കുന്നു. മൂലപാഠത്തിലെ യുദ്ധചിത്രവും ‘വീഴും’ എന്ന തുറന്ന അർഥപരിധിയും സംരക്ഷിച്ചിരിക്കുന്നു.
