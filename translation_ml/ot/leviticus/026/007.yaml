  yaml_path: translation/ot/leviticus/026/007.yaml
  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: ml
  text: നിങ്ങൾ നിങ്ങളുടെ ശത്രുക്കളെ പിന്തുടരും; അവർ നിങ്ങളുടെ മുമ്പിൽ വാളാൽ വീഴും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ നിങ്ങളുടെ മുമ്പിൽ വാളിന് ഇരയായി വീഴും.” എബ്രായപ്രയോഗം മലയാളത്തിൽ ഒന്നിലധികം സ്വാഭാവികരീതിയിൽ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: നിങ്ങൾ ... പിന്തുടരും
  rationale: רדף എന്ന ക്രിയയ്ക്ക് ‘പിന്തുടരുക, പിന്നാലെ ചെല്ലുക’ എന്നാണ് സാധാരണ അർഥം. സൈനികസന്ദർഭം നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ് ‘പിന്തുടരും’.
- source_word: אֶת אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കളെ
  rationale: אֹיֵב എന്ന നാമത്തിന്റെ പതിവ് അർഥം ‘ശത്രു’ എന്നാണ്; ബഹുവചനവും രണ്ടാംപുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְנָפְלוּ
  choice: അവർ ... വീഴും
  rationale: נפל എന്നതിന്റെ അടിസ്ഥാനചിത്രം ‘വീഴുക’ എന്നതാണ്. യുദ്ധത്തിൽ ഇത് പരാജയത്തെയോ മരണത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും, മൂലപാഠത്തിലെ ചിത്രം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽ
  rationale: לפני എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളം ‘മുമ്പിൽ’ എന്നാണ്.
- source_word: לֶחָרֶב
  choice: വാളിനിരയായി
  rationale: חרב-നോടുകൂടിയ ל യുദ്ധത്തിൽ വാളാൽ സംഭവിക്കുന്ന വീഴ്ചയെ സൂചിപ്പിക്കുന്നു. ‘വാളിനിരയായി വീഴും’ എന്ന മലയാളപ്രയോഗം ‘വാളാൽ വീഴും’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; എങ്കിലും എബ്രായ മുൻപ്രത്യയത്തിന്റെ ബന്ധം മറ്റൊരു രീതിയിലും അവതരിപ്പിക്കാം.
