revisions:
- from: എന്നാൽ അവർക്കുവേണ്ടി, ജനതകളുടെ കൺമുന്നിൽവെച്ച് ഈജിപ്തുദേശത്തുനിന്ന് ഞാൻ പുറപ്പെടുവിച്ച അവരുടെ പൂർവികരുമായുള്ള ഉടമ്പടി[a] ഞാൻ ഓർക്കും—അവർക്കു ദൈവമായിരിക്കേണ്ടതിന്. ഞാൻ യഹ്‌വെ ആകുന്നു.
