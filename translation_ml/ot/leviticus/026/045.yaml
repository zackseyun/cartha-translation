  rationale: The revision removes the added modal force of “മായിരിക്കേണ്ടതിന്,” retaining the Hebrew infinitive's straightforward purpose sense. Minor reordering improves Malayalam flow without altering the source’s referents or covenantal meaning. The footnote continues to preserve the lexical breadth of רִאשֹׁנִים and its contextual reference to the earlier exodus generation.
