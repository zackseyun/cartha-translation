source:
  edition: WLC
  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: ml
  text: എന്നാൽ, ജനതകളുടെ കൺമുമ്പാകെ ഈജിപ്തുദേശത്തുനിന്ന് ഞാൻ പുറപ്പെടുവിച്ച അവരുടെ പൂർവികരോടുള്ള ഉടമ്പടി[a] ഞാൻ അവർക്കുവേണ്ടി ഓർക്കും; അവർക്കു ദൈവമായിരിക്കാൻ. ഞാൻ യഹ്‌വെ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “മുൻപുണ്ടായിരുന്നവരുമായുള്ള ഉടമ്പടി”; ഈ പ്രയോഗം ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിക്കപ്പെട്ട മുൻതലമുറയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: എന്നാൽ ... ഞാൻ ഓർക്കും
  rationale: വാക്യാരംഭത്തിലെ וְ സന്ദർഭത്തിൽ മുൻവിധിന്യായത്തോടുള്ള വിരുദ്ധമായ വഴിത്തിരിവ് സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി; ക്രിയയുടെ ഭാവാർഥം നേരിട്ട് നിലനിർത്തി.
- source_word: לָהֶם
  choice: അവർക്കുവേണ്ടി
  rationale: ל എന്ന ഉപസർഗം ഓർക്കൽ അവരുടെ നന്മയ്ക്കായി/അവരുടെ പക്ഷമായി നടക്കുന്നതാണെന്ന സൂചന നൽകുന്നു.
- source_word: בְּרִית רִאשֹׁנִים
  choice: അവരുടെ പൂർവികരുമായുള്ള ഉടമ്പടി
  rationale: רִאשֹׁנִים അക്ഷരാർഥത്തിൽ ‘മുൻപുണ്ടായിരുന്നവർ’ എന്ന ബഹുവചന നാമവൽക്കൃത വിശേഷണമാണ്. തുടർന്നുള്ള ‘അവരെ ഞാൻ പുറപ്പെടുവിച്ചു’ എന്ന വാക്യഭാഗം മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘പൂർവികർ’ എന്നു നൽകി, അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന് ഞാൻ പുറപ്പെടുവിച്ച
  rationale: ബന്ധവാക്യം ഉടമ്പടിയെയല്ല, പൂർവികരെയാണ് വിശേഷിപ്പിക്കുന്നത്. പുറപ്പാടിന്റെ പരമ്പരാഗത പ്രയോഗവും ‘ദേശം’ എന്ന ഘടകവും നിലനിർത്തി.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: ജനതകളുടെ കൺമുന്നിൽവെച്ച്
  rationale: പുറപ്പാട് മറ്റു ജനതകൾ പരസ്യമായി കണ്ട സംഭവമായിരുന്നു എന്ന ദൃശ്യസാക്ഷ്യഭാവം സംരക്ഷിക്കുന്നു.
- source_word: לִהְיוֹת לָהֶם לֵאלֹהִים
  choice: അവർക്കു ദൈവമായിരിക്കേണ്ടതിന്
  rationale: ഹീബ്രു ഉദ്ദേശ്യപ്രയോഗവും ഉടമ്പടിസൂത്രവാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ഹീബ്രു ചതുരക്ഷരനാമത്തിന്റെ പ്രചാരത്തിലുള്ള ശാസ്ത്രീയ ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: ‘മുൻപുണ്ടായിരുന്നവരുടെ ഉടമ്പടി’ എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: പുറപ്പാടുതലമുറയായ പൂർവികരുമായുള്ള ഉടമ്പടി
  alternative: ‘മുൻപുണ്ടായിരുന്നവരുമായുള്ള ഉടമ്പടി’ അല്ലെങ്കിൽ അമൂർത്തമായ ‘ആദ്യ ഉടമ്പടി’
  rationale: ‘അവരെ ഈജിപ്തുദേശത്തുനിന്ന് ഞാൻ പുറപ്പെടുവിച്ചു’ എന്ന ബന്ധവാക്യം വ്യക്തികളിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. എങ്കിലും רִאשֹׁנִים എന്ന പദത്തിന്റെ പൊതുവായ ‘മുൻപുണ്ടായിരുന്നവർ’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: ഉദ്ദേശ്യപ്രയോഗം ആരോടു ബന്ധിപ്പിക്കണം
  choice: ഈജിപ്തിൽനിന്നുള്ള പുറപ്പെടുവിക്കലിന്റെ ഉദ്ദേശ്യമായി ‘അവർക്കു ദൈവമായിരിക്കേണ്ടതിന്’ നിലനിർത്തി
  alternative: ഉടമ്പടി ഓർക്കുന്നതിന്റെ ഉദ്ദേശ്യമായി വായിക്കുക
  rationale: ഹീബ്രു പദക്രമത്തിൽ infinitive phrase പുറപ്പെടുവിക്കൽ വാക്യഭാഗത്തിനു പിന്നാലെ വരുന്നതിനാൽ അതിനോടുള്ള ബന്ധമാണ് സ്വാഭാവികം; വിവർത്തനത്തിൽ അധികമായ വ്യാഖ്യാനം ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ഒരുമിപ്പിച്ചു. ‘കൺമുന്നിൽവെച്ച്’, ‘ഉടമ്പടി’, ‘പുറപ്പെടുവിച്ച’ എന്നീ പദങ്ങൾ മൂലത്തിലെ ഔപചാരികവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം സൂക്ഷിക്കുന്നു; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
