  yaml_path: translation/ot/leviticus/026/028.yaml
  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: ml
  text: അപ്പോൾ ഞാൻ ഉഗ്രകോപത്തോടെ നിങ്ങളോടു വിരോധമായി നടക്കും[a]; ഞാൻതന്നെ നിങ്ങളുടെ പാപങ്ങൾ നിമിത്തം നിങ്ങളെ ഏഴിരട്ടിയായി ശാസിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിരോധത്തിന്റെ ഉഗ്രകോപത്തിൽ നിങ്ങളോടുകൂടെ നടക്കും”; പരമ്പരാഗതമായി, “കോപത്തോടെ നിങ്ങളോടു വിരോധമായി നടക്കും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങളുടെ പാപങ്ങൾ നിമിത്തം നിങ്ങളെ ഏഴു പ്രാവശ്യം ശാസിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: ഞാൻ ... നടക്കും
  rationale: הלך എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘നടക്കുക’ നിലനിർത്തുന്നു; ഈ അധ്യായത്തിൽ ദൈവവും ഇസ്രായേലും തമ്മിലുള്ള ഉടമ്പടി-ബന്ധത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തിത പ്രയോഗമാണിത്.
- source_word: עִמָּכֶם
  choice: നിങ്ങൾക്കു വിരോധമായി
  rationale: עם അക്ഷരാർഥത്തിൽ ‘നിങ്ങളോടുകൂടെ’ എന്നാണെങ്കിലും, קֶרִי ചേർന്ന ഈ പ്രയോഗത്തിൽ ബന്ധപരമായ എതിർപ്പ് പ്രകടമാണ്. സ്വാഭാവിക മലയാളത്തിൽ ആ പ്രതികൂല അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בַּחֲמַת
  choice: ഉഗ്രകോപത്തോടെ
  rationale: חֵמָה സൂചിപ്പിക്കുന്ന ചൂടേറിയ കോപത്തിന്റെയും ക്രോധത്തിന്റെയും തീവ്രത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קֶרִי
  choice: വിരോധമായി
  rationale: ലേവ്യപുസ്തകം 26-ൽ ആവർത്തിക്കുന്ന ഈ ദുഷ്കരപദം എതിർപ്പ്, വിരോധം, ശത്രുത എന്നീ ആശയങ്ങൾ നൽകുന്നു. മുഖ്യവാചകത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ‘വിരോധമായി’ ഉപയോഗിച്ച് രൂപപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְיִסַּרְתִּי
  choice: ശാസിക്കും
  rationale: יסר എന്ന പദത്തിലെ ശിക്ഷണത്തിന്റെയും തിരുത്തലിന്റെയും ഭാവം ‘ശാസിക്കും’ നിലനിർത്തുന്നു; അതിനെ കേവലം പ്രതികാരപരമായ ശിക്ഷയായി ചുരുക്കുന്നില്ല.
- source_word: אַף אֲנִי
  choice: ഞാനും ... ഞാൻതന്നെ
  rationale: אַף എന്ന കൂട്ടിച്ചേർക്കൽഭാവവും אֲנִי എന്ന ഊന്നലും മലയാളത്തിൽ വേർതിരിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: שֶׁבַע
  choice: ഏഴിരട്ടിയായി
  rationale: ഉടമ്പടി-ശാപങ്ങളുടെ പശ്ചാത്തലത്തിലെ ശക്തിപ്പെടുത്തിയ നടപടിയെ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു; ‘ഏഴു പ്രാവശ്യം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: നിങ്ങളുടെ പാപങ്ങൾ നിമിത്തം
  rationale: ശാസനയുടെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്ന עַל എന്നതിന്റെ പ്രവർത്തനം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-ശാപത്തിലെ ദൈവിക പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ദൈവം ‘വിരോധമായി നടക്കുന്നു’ എന്ന ബന്ധപരമായ എതിർപ്പും ‘ശാസിക്കുന്നു’ എന്ന ശിക്ഷണഭാവവും ഒരുമിച്ച് നിലനിർത്തി.
  alternative: വാക്യം മുഴുവനും കേവലം ശിക്ഷാപരമായി വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ വിരോധത്തിന്റെ ഭാഷ മൃദൂകരിക്കുക.
  rationale: എബ്രായവാചകം הלך + עם + קֶרִי എന്ന ബന്ധപരമായ എതിർപ്പിനെയും יסר എന്ന ശാസന/ശിക്ഷണ ആശയത്തെയും ചേർക്കുന്നു. രണ്ടും നിലനിർത്തുന്നത് വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം മുൻകൂട്ടി പരിഹരിക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘നടക്കും’ എന്ന ഉടമ്പടി-രൂപകവും ‘ഞാൻതന്നെ’ എന്ന ഊന്നലും നിലനിർത്തി; അപൂർവമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
