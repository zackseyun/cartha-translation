  terminology: “കൽപ്പനകൾ” appropriately renders מִצְוֺת, and “അനുഷ്ഠിക്കുക” appropriately conveys doing/carrying out commandments in this formal context. The footnote responsibly identifies “അനുസരിക്കുക” as a possible implicature without replacing the hearing/listening wording in the main text.
