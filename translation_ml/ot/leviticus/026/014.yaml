  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/014.yaml
  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ എന്റെ വാക്കു കേൾക്കാതെയും ഈ കൽപ്പനകളെല്ലാം അനുഷ്ഠിക്കാതെയും ഇരുന്നാൽ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെ അനുസരിക്കാതെയും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് അനുസരണത്തോടെ കേൾക്കുക എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ഇരുന്നാൽ
  rationale: മുൻപുള്ള അനുഗ്രഹഭാഗത്തോടുള്ള വൈരുധ്യവും നിബന്ധനയും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: നിങ്ങൾ എന്റെ വാക്കു കേൾക്കാതെയും
  rationale: שׁמע ל എന്നത് ശ്രദ്ധിച്ചു കേൾക്കുക എന്നതിനൊപ്പം അനുസരണത്തിന്റെ അർഥവും വഹിക്കുന്നു. ‘എന്റെ വാക്കു കേൾക്കുക’ എന്ന മലയാളപ്രയോഗം കേൾവിയുടെ രൂപകവും ബന്ധപരമായ ഭാവവും നിലനിർത്തുന്നു; നേരിട്ട് ‘അനുസരിക്കുക’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
- source_word: וְלֹא תַעֲשׂוּ
  choice: അനുഷ്ഠിക്കാതെയും
  rationale: നിയമപരമായ സന്ദർഭത്തിൽ עשה കൽപ്പനകൾ പ്രവർത്തിയിൽ നടപ്പാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അനുഷ്ഠിക്കുക’ ആ അർഥം സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: ഈ കൽപ്പനകളെല്ലാം
  rationale: כָּל എന്ന സമഗ്രതയും הָאֵלֶּה എന്ന സമീപസൂചകവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു; מִצְוֺת എന്നതിന് ഉടമ്പടി-നിയമപരമായ ‘കൽപ്പനകൾ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: שׁמע ל എന്നത് കേൾക്കൽ എന്നോ അനുസരിക്കൽ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: എന്റെ വാക്കു കേൾക്കുക
  alternative: എന്നെ അനുസരിക്കുക
  rationale: എബ്രായത്തിലെ കേൾവിയെ ആധാരമാക്കിയ പ്രയോഗം നിലനിർത്തുകയും തുടർന്ന് വരുന്ന കൽപ്പനകൾ അനുഷ്ഠിക്കുക എന്ന പ്രത്യേക വ്യവസ്ഥയുമായി അതിനെ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു. അടിക്കുറിപ്പ് അനുസരണത്തിന്റെ ഉൾക്കാഴ്ച വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എന്റെ വാക്കു കേൾക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലത്തിലെ കേൾവി–അനുസരണ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു. വാക്യം അടുത്ത വാക്യങ്ങളിലേക്കു തുടരുന്ന നിബന്ധനാഭാഗമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തിയിരിക്കുന്നു.
