source:
  edition: WLC
  text: וְ/אֶתְ/כֶם֙ אֱזָרֶ֣ה בַ/גּוֹיִ֔ם וַ/הֲרִיקֹתִ֥י אַחֲרֵי/כֶ֖ם חָ֑רֶב וְ/הָיְתָ֤ה אַרְצְ/כֶם֙ שְׁמָמָ֔ה וְ/עָרֵי/כֶ֖ם יִהְי֥וּ חָרְבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളെ ജനതകളുടെ ഇടയിൽ ചിതറിക്കും; നിങ്ങളുടെ പിന്നാലെ ഞാൻ വാൾ ഊരിയെടുക്കും[a]. നിങ്ങളുടെ ദേശം പാഴ്മയായിത്തീരും; നിങ്ങളുടെ പട്ടണങ്ങൾ തകർന്നുകിടക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ പിന്നാലെ ഞാൻ വാൾ ഉറയിൽനിന്ന് പുറത്തെടുക്കും.’
    reason: ‘വാൾ ഊരിയെടുക്കും’ എന്ന പ്രയോഗം വാൾ ഉറയിൽനിന്ന് പുറത്തെടുക്കുന്ന എബ്രായ യുദ്ധപ്രയോഗത്തെ ചുരുക്കത്തിൽ അറിയിക്കുന്നു.
lexical_decisions:
- source_word: אֱזָרֶה
  choice: ചിതറിക്കും
  rationale: זרה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ആളുകളെ വിവിധ ജനതകളുടെ ഇടയിലേക്കു ചിതറിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ചിതറിക്കും’ പ്രവാസവിധിയുടെ ദൃശ്യവും നേരിട്ടുള്ള ദൈവിക പ്രവർത്തനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַגּוֹיִם
  choice: ജനതകളുടെ ഇടയിൽ
  rationale: גּוֹיִם വിദേശ ജനതകളെയോ രാഷ്ട്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘ജനതകൾ’ എന്നത് അനാവശ്യമായ പിൽക്കാല മതപരമായ അർഥഭാരം ഒഴിവാക്കി മനുഷ്യസമൂഹങ്ങളെയും അവരുടെ ദേശങ്ങളെയും ഉൾക്കൊള്ളുന്നു.
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: ഞാൻ വാൾ ഊരും
  rationale: ריק എന്ന ക്രിയയും חֶרֶב എന്ന നാമവും ചേർന്ന പ്രയോഗം വാൾ ഉറയിൽനിന്ന് ഊരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വാൾ ഊരും’ എന്നത് സജീവമായ യുദ്ധദൃശ്യവും ഒന്നാംപുരുഷ ദൈവിക പ്രവർത്തനവും ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אַחֲרֵיכֶם
  choice: നിങ്ങളുടെ പിന്നാലെ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘നിങ്ങളുടെ പിന്നാലെ’ എന്നാണ്; സന്ദർഭത്തിൽ ശത്രുതാപരമായ പിന്തുടരൽ ധ്വനിക്കുന്നു. ആ ധ്വനി വിശദീകരിച്ച് ഉറപ്പിക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തി.
- source_word: שְׁמָמָה
  choice: ശൂന്യപ്രദേശം
  rationale: ഈ നാമം നാശത്താൽ ശൂന്യമായ അവസ്ഥയെയോ സ്ഥലത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ശൂന്യപ്രദേശം’ നാമരൂപം നിലനിർത്തുകയും ദേശത്തിന്റെ പൂർണമായ വിജനത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: חָרְבָּה
  choice: പാഴിടങ്ങൾ
  rationale: ഈ നാമം തകർന്നു നശിച്ചോ ഉപേക്ഷിക്കപ്പെട്ടോ കിടക്കുന്ന സ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്നു. പട്ടണങ്ങളോടൊപ്പം ‘പാഴിടങ്ങൾ’ എന്നത് ഫലമായുണ്ടാകുന്ന നാശാവസ്ഥ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: ആയിത്തീരും
  rationale: היה ഇവിടെ വെറും നിലനിൽപ്പിനേക്കാൾ വിധിയുടെ ഫലമായി പുതിയ അവസ്ഥയിലാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ആയിത്തീരും’ ആ മാറ്റം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പ്രവാസവും സൈനിക പിന്തുടരലും ഉൾപ്പെടുന്ന ഉടമ്പടി-വിധിയിൽ ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനം
  choice: ‘ഞാൻ നിങ്ങളെ... ചിതറിക്കും; ... ഞാൻ വാൾ ഊരും’ എന്ന നേരിട്ടുള്ള ഒന്നാംപുരുഷ പ്രയോഗം നിലനിർത്തി.
  alternative: ദൈവിക പ്രവർത്തനം മൃദൂകരിക്കുന്ന കർമണിപ്രയോഗമോ വ്യക്തിയില്ലാത്ത പ്രയോഗമോ ഉപയോഗിക്കുക.
  rationale: എബ്രായപാഠം ഈ വിധിനടപടികൾ ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനമായി വ്യക്തമായി അവതരിപ്പിക്കുന്നു. ആ ദൈവശാസ്ത്രപരമായ ശക്തി മൃദൂകരിക്കാതെ നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിക്കുന്ന ‘നിങ്ങളുടെ’ എന്ന രൂപവും നേരിട്ടുള്ള ദൈവിക വചനവും മൂലപാഠത്തിന്റെ ഉടമ്പടി-വിധി സ്വരഭാവം നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘nations’ എന്നതിനു പിന്നാലെയാണെങ്കിലും അതിന്റെ ഉള്ളടക്കം വാൾ ഊരുന്ന പ്രയോഗത്തോടു ബന്ധപ്പെട്ടതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനു പിന്നാലെ ചേർത്തു.
