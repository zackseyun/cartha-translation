reference: Leviticus 26:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: ml
  text: എന്നിരുന്നാലും, അവർ ശത്രുക്കളുടെ ദേശത്തായിരിക്കുമ്പോഴും, അവരെ പൂർണമായി ഇല്ലാതാക്കുകയും അവരോടുള്ള എന്റെ ഉടമ്പടി ലംഘിക്കുകയും ചെയ്യേണ്ടവിധം ഞാൻ അവരെ തള്ളിക്കളയുകയോ അവരോടു അറപ്പു തോന്നുകയോ ചെയ്യുകയില്ല; കാരണം ഞാൻ അവരുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: എന്നിട്ടും ... പോലും
  rationale: മുൻവിധികളോടുള്ള ശക്തമായ concessive/adversative ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: അവർ ശത്രുക്കളുടെ ദേശത്തായിരിക്കുമ്പോൾ
  rationale: בְּ + infinitive construct-ന്റെ കാലസാഹചര്യവും construct chain-ന്റെ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לֹא מְאַסְתִּים
  choice: ഞാൻ അവരെ തള്ളിക്കളയുകയില്ല
  rationale: מָאַס എന്നത് ഇവിടെ ഉടമ്പടിബന്ധത്തിൽ നിരസിക്കുകയോ ഉപേക്ഷിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘തള്ളിക്കളയുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: וְלֹא גְעַלְתִּים
  choice: വെറുക്കുകയോ ചെയ്യുകയില്ല
  rationale: גָּעַל സൂചിപ്പിക്കുന്ന ശക്തമായ അറപ്പും വെറുപ്പും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְכַלֹּתָם
  choice: അവരെ പൂർണമായി ഇല്ലാതാക്കാനും
  rationale: כָּלָה-യുടെ സമ്പൂർണ നാശം/അവസാനം വരുത്തൽ എന്ന ശക്തി ‘പൂർണമായി’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: അവരോടുള്ള എന്റെ ഉടമ്പടി ലംഘിക്കാനും
  rationale: הֵפֵר എന്നതിന്റെ ഉടമ്പടി അസാധുവാക്കുക/തകർക്കുക എന്ന ഗൗരവം ‘ലംഘിക്കുക’ വഴി വ്യക്തമായി നൽകുന്നു.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: കാരണം ഞാൻ അവരുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു
  rationale: כִּי-യുടെ കാരണബോധവും ദൈവനാമമായ יהוה-യും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; മലയാള ഉച്ചാരണത്തിന് അനുയോജ്യമായ രൂപം ഉപയോഗിക്കുന്നു.
- issue: מְאַסְתִּים, גְעַלְתִּים എന്നീ qatal ക്രിയകളുടെ കാലഭാവം
  choice: ഭാവിമുഖമായ ‘ചെയ്യുകയില്ല’
  alternative: ‘ചെയ്തിട്ടില്ല’ അല്ലെങ്കിൽ ‘ചെയ്യുന്നില്ല’
  rationale: വരാനിരിക്കുന്ന ശിക്ഷയുടെയും ശത്രുദേശവാസത്തിന്റെയും പശ്ചാത്തലത്തിൽ ദൈവത്തിന്റെ തുടർന്നുനിൽക്കുന്ന ഉടമ്പടിപ്രതിജ്ഞയാണ് സന്ദർഭം; എങ്കിലും qatal രൂപത്തിന്റെ വ്യത്യസ്ത കാലവായനകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദൈവനാമം ‘യഹ്‌വേ’ എന്ന് നേരിട്ട് നൽകിയിരിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ലെ footnote-marker ക്രമക്കേട് പിന്തുടരാതെ, മലയാള കരടിലെ യഥാർത്ഥ കുറിപ്പിന് [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
