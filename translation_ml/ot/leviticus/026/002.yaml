source:
  edition: WLC
  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/002.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: ml
  text: എന്റെ ശബ്ബത്തുകളെ നിങ്ങൾ ആചരിക്കണം; എന്റെ വിശുദ്ധമന്ദിരത്തെ നിങ്ങൾ ഭയഭക്തിയോടെ ആദരിക്കണം[a]. ഞാൻ യാഹ്‌വെ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ വിശുദ്ധമന്ദിരത്തെ ഭയപ്പെടണം” എന്നും “എന്റെ വിശുദ്ധമന്ദിരത്തെ വിസ്മയഭയത്തോടെ ആദരിക്കണം” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ഭയം, ഭക്ത്യാദരം, വിസ്മയഭയം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: എന്റെ ശബ്ബത്തുകൾ
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം ചേർന്ന ബഹുവചനരൂപം നേരിട്ട് നിലനിർത്തുന്നു. ആഴ്ചതോറുമുള്ള ശബ്ബത്ത് മാത്രമല്ല, യാഹ്‌വെയ്ക്കുള്ള വിശുദ്ധ ശബ്ബത്തുകാലങ്ങളുടെ സമുച്ചയവും ഇതിൽ ഉൾപ്പെടാമെന്ന വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: תִּשְׁמֹרוּ
  choice: നിങ്ങൾ ആചരിക്കണം
  rationale: കല്പനകളെയും വിശുദ്ധകാലങ്ങളെയും സംബന്ധിച്ച് שׁמר എന്ന ക്രിയയ്ക്ക് ‘കാത്തുസൂക്ഷിക്കുക, പാലിക്കുക, ആചരിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ശബ്ബത്തുകളോടൊപ്പം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗം ‘ആചരിക്കണം’ ആണ്.
- source_word: וּמִקְדָּשִׁי
  choice: എന്റെ വിശുദ്ധമന്ദിരത്തെ
  rationale: מִקְדָּשׁ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശുദ്ധസ്ഥലത്തെയോ സങ്കേതത്തെയോ സൂചിപ്പിക്കുന്നു. ആരാധനാസന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി മനസ്സിലാകുന്ന പദമാണ് ‘വിശുദ്ധമന്ദിരം’.
- source_word: תִּירָאוּ
  choice: നിങ്ങൾ ഭയഭക്തിയോടെ മാനിക്കണം
  rationale: ירא എന്ന ക്രിയയ്ക്ക് ഭയപ്പെടുക, ഭക്ത്യാദരത്തോടെ മാനിക്കുക, വിസ്മയഭയത്തോടെ നിൽക്കുക എന്നീ അർഥവ്യാപ്തിയുണ്ട്. ഇവിടെ വെറും പേടിയല്ല, വിശുദ്ധസ്ഥാനത്തോടുള്ള ഗൗരവപൂർണമായ ഭക്ത്യാദരമാണ് ഉദ്ദേശ്യമെന്ന സന്ദർഭസൂചന നൽകിക്കൊണ്ട് മൂലപദത്തിലെ ‘ഭയം’ എന്ന ഘടകവും ‘ഭയഭക്തിയോടെ’ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണ പണ്ഡിതപുനർനിർമാണമായ ‘Yahweh’ എന്ന രൂപത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യാഹ്‌വെ ആകുന്നു
  rationale: കല്പനകൾക്ക് ദൈവിക അധികാരം നൽകുന്ന ഉടമ്പടിസൂത്രവാക്യത്തിലെ ഊന്നലുള്ള സ്വയംപരിചയപ്പെടുത്തൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യാഹ്‌വെ’ എന്നത് വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട ശാസ്ത്രീയ പുനർനിർമാണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: വിശുദ്ധമന്ദിരത്തെ സംബന്ധിച്ച ירא എന്ന ക്രിയയുടെ ഭാവം
  choice: ഭയഭക്തിയോടെ മാനിക്കണം
  alternative: ഭയപ്പെടണം; വിസ്മയഭയത്തോടെ ആദരിക്കണം
  rationale: മൂലക്രിയയിലെ ഭയം, ഭക്ത്യാദരം, വിസ്മയം എന്നീ അർഥസാധ്യതകൾ പൂർണമായി ഒരൊറ്റ മലയാളപദത്തിൽ ഒതുക്കാതെ, സന്ദർഭത്തിന് യോജിച്ച പ്രധാന അർഥം പാഠത്തിൽ നൽകുകയും ശേഷിക്കുന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ‘ശബ്ബത്തുകൾ’ എന്ന സ്ഥാപിതമായ മതപദം നിലനിർത്തി; അപരിചിതമായ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി. രണ്ട് സമാന്തര കല്പനകളും വേർതിരിച്ച് അവതരിപ്പിച്ചതിനാൽ ഹീബ്രു വാക്യഘടനയുടെ ഊന്നൽ വ്യക്തമാണ്.
