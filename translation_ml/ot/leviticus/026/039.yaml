  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: ml
  text: നിങ്ങളിൽ ശേഷിക്കുന്നവർ തങ്ങളുടെ അകൃത്യം നിമിത്തം ശത്രുക്കളുടെ ദേശങ്ങളിൽ ക്ഷയിച്ചുപോകും[a]; അവരുടെ പിതാക്കന്മാരുടെ അകൃത്യങ്ങൾ നിമിത്തവും അവരോടുകൂടെ[b] അവർ ക്ഷയിച്ചുപോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ജീർണ്ണിച്ചുപോകും” അല്ലെങ്കിൽ “വാടിപ്പോകും”; ഹീബ്രു ക്രിയ ന്യായവിധിക്കു കീഴിലുള്ള ക്ഷയത്തെയോ ജീർണ്ണതയെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “അവരോടുകൂടെ” എന്നത് പിതാക്കന്മാരുടെ അകൃത്യങ്ങൾ അവരോടുകൂടെ തുടരുന്നു എന്നോ, ആ പൂർവിക അകൃത്യങ്ങൾ ഇപ്പോഴും അവരെ ബാധിക്കവെ അവർ ക്ഷയിക്കുന്നു എന്നോ അർഥമാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: നിങ്ങളിൽ ശേഷിക്കുന്നവർ
  rationale: ശിക്ഷാവിധിക്കുശേഷം അഭിസംബോധന ചെയ്യപ്പെടുന്ന ജനത്തിൽ ശേഷിച്ചവരെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: יִמַּקּוּ
  choice: ക്ഷയിച്ചുപോകും
  rationale: מקק എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ന്യായവിധിക്കു കീഴിലെ ദേഹക്ഷയമോ ജീർണ്ണനമോ സൂചിപ്പിക്കുന്നു; രണ്ടു പ്രാവശ്യവും ഒരേ പദം ഉപയോഗിച്ച് ആവർത്തനം സംരക്ഷിച്ചു.
- source_word: בַּעֲוֺנָם
  choice: തങ്ങളുടെ അകൃത്യം നിമിത്തം
  rationale: עָוֹן അകൃത്യം, കുറ്റം, അതിന്റെ ഫലം എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ בְ കാരണാർഥമായി വായിക്കാവുന്നതിനാൽ ‘നിമിത്തം’ ഉപയോഗിച്ചു; പദത്തിന്റെ നൈതിക-ന്യായവിധി ഭാവം ‘അകൃത്യം’ നിലനിർത്തുന്നു.
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: ശത്രുക്കളുടെ ദേശങ്ങളിൽ
  rationale: ഹീബ്രുവിലെ ബഹുവചനം നിലനിർത്തുകയും പ്രവാസത്തിന്റെ വിദേശദേശ പശ്ചാത്തലം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: וְאַף
  choice: … നിമിത്തവും
  rationale: വാക്യത്തിലെ കൂട്ടിച്ചേർക്കലും ഊന്നലും മലയാളത്തിലെ ‘-വും’ മുഖേന സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: തങ്ങളുടെ പിതാക്കന്മാരുടെ അകൃത്യങ്ങൾ നിമിത്തവും
  rationale: അകൃത്യങ്ങളുടെ ബഹുവചനവും ‘പിതാക്കന്മാർ’ എന്ന നേരിട്ടുള്ള ബന്ധപദവും സംരക്ഷിക്കുന്നു; ‘പൂർവികർ’ എന്നു പൊതുവാക്കുന്നില്ല.
- source_word: אִתָּם
  choice: അവ അവരോടുകൂടെ ഇരിക്കെ
  rationale: ‘അവരോടുകൂടെ’ എന്ന ഹീബ്രുവിലെ സംക്ഷിപ്തവും അവ്യക്തവുമായ ബന്ധം നിലനിർത്തുന്നു. ‘അവ’ എന്നത് അടുത്തുള്ള ‘അകൃത്യങ്ങൾ’ എന്നതിലേക്കു വ്യാകരണപരമായി ചൂണ്ടുന്നുവെങ്കിലും, അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രബന്ധം വിശദീകരിച്ചു തീർക്കുന്നില്ല.
theological_decisions:
- issue: തലമുറകൾക്കിടയിലെ കുറ്റവും ന്യായവിധിയും
  choice: അവർ സ്വന്തം അകൃത്യം നിമിത്തവും പിതാക്കന്മാരുടെ അകൃത്യങ്ങൾ നിമിത്തവും ക്ഷയിക്കുന്നു എന്ന ഇരട്ട പ്രസ്താവന നിലനിർത്തി.
  alternative: ഇത് പൂർവികരുടെ പാപത്തിന്റെ ഫലങ്ങൾ മാത്രമാണെന്നോ, മക്കൾ അതേ പാപങ്ങളിൽ പങ്കെടുത്തതുകൊണ്ടു മാത്രമാണെന്നോ വ്യാഖ്യാനിച്ച് പരിഹരിക്കുക.
  rationale: മൂലപാഠം ‘തങ്ങളുടെ അകൃത്യം’ എന്നും ‘പിതാക്കന്മാരുടെ അകൃത്യങ്ങൾ’ എന്നും വേർതിരിച്ചു പറയുന്നു. വ്യക്തിപരമായ ഉത്തരവാദിത്വവും തലമുറകളിലൂടെ തുടരുന്ന ന്യായവിധിയും തമ്മിലുള്ള സംഘർഷം പരിഭാഷയിൽ മൃദൂകരിക്കരുത്.
- issue: אִתָּם എന്നതിന്റെ ബന്ധം
  choice: ‘അവ അവരോടുകൂടെ ഇരിക്കെ’ എന്ന തുറന്ന രൂപം ഉപയോഗിച്ചു.
  alternative: ‘അവർ പിതാക്കന്മാരോടൊപ്പം ക്ഷയിക്കും’ എന്നോ ‘പൂർവികപാപങ്ങളുടെ ഫലങ്ങൾ അവരെ ബാധിക്കുമ്പോൾ’ എന്നോ നിർണായകമായി വ്യാഖ്യാനിക്കുക.
  rationale: സർവനാമത്തിന്റെ ബന്ധവും ‘കൂടെ’ എന്നതിന്റെ കൃത്യമായ ആശയവും സംക്ഷിപ്തമാണ്. പരിഭാഷ ഒരു വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കാതെ യഥാർത്ഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘അകൃത്യം’, ‘പിതാക്കന്മാർ’, ‘ക്ഷയിച്ചുപോകും’ എന്നീ പദങ്ങൾ ഉടമ്പടി-ന്യായവിധിയുടെ ഭാവം നിലനിർത്തുന്നു. മുഖ്യവാക്യത്തിൽ [a], [b] എന്നീ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ചേർത്തിരിക്കുന്നു.
