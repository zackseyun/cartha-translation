lexical_decisions:
- source_word: וְאִם
  choice: എന്നിട്ടും ... എങ്കിൽ/നടന്നാൽ
  rationale: മുൻപുള്ള ഉടമ്പടി മുന്നറിയിപ്പുകളുടെ തുടർച്ചയിൽ വ്യവസ്ഥയും പ്രതികൂലമായ പുരോഗതിയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: בְּזֹאת
  choice: എന്നിട്ടും
  rationale: മുൻപ് പറഞ്ഞ ശിക്ഷണനടപടികൾ ഉണ്ടായിട്ടും എന്ന concessive അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: എന്റെ വാക്കു കേൾക്കാതെ
  rationale: שׁמע എന്ന പദത്തിന്റെ കേൾവി-രൂപകം നിലനിർത്തുകയും അനുസരണത്തിന്റെ സൂചന സ്വാഭാവികമായി ഉൾക്കൊള്ളിക്കുകയും ചെയ്യുന്നു.
- source_word: וַהֲלַכְתֶּם
  choice: നടന്നാൽ
  rationale: הלך ഇവിടെ ജീവിതനടത്തത്തെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്ന ഉടമ്പടി-പ്രയോഗമാണ്; 'നടക്കുക' ആ രൂപകം നിലനിർത്തുന്നു.
- source_word: עִמִּי בְּקֶרִי
  choice: എനിക്കെതിരായി
  rationale: അക്ഷരാർഥത്തിൽ ദുഷ്കരമായ 'എന്നോടുകൂടെ വിരോധത്തിൽ നടക്കുക' എന്ന സംയുക്തപ്രയോഗത്തിന്റെ ബന്ധപരമായ എതിർപ്പ് വ്യക്തമാക്കുന്നു; അപൂർവമായ קֶרִיയുടെ കൃത്യനിറം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകം 26-ലെ ഉടമ്പടി മുന്നറിയിപ്പിലെ ‘നടക്കുക’ എന്ന ബന്ധപരമായ പ്രയോഗം
  choice: ‘എനിക്കെതിരായി നടന്നാൽ’ എന്നു നൽകി നടത്തത്തിന്റെ രൂപകവും ദൈവത്തോടുള്ള എതിർപ്പും നിലനിർത്തുന്നു.
  alternative: ‘എന്നോടു ശത്രുതയോടെ പെരുമാറിയാൽ’ അല്ലെങ്കിൽ ‘എന്നെ അനുസരിക്കാതിരുന്നാൽ’
  rationale: വാക്യം വെറും അനുസരണക്കേടിനേക്കാൾ ഉടമ്പടി ബന്ധത്തിലെ എതിർനിലപാട് സൂചിപ്പിക്കുന്നു. അതേസമയം ദുഷ്കരമായ קֶרִיയെ ‘ശത്രുത’ എന്നു മാത്രം നിർവചിച്ച് അർഥം അതിയായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് സ്വാഭാവികവുമായ മലയാളം. ‘എന്റെ വാക്കു കേൾക്കുക,’ ‘നടക്കുക’ എന്നീ ബൈബിൾസംബന്ധിയായ രൂപകങ്ങൾ നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാനുവാദം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
