  text: എന്നിട്ടും നിങ്ങൾ എന്റെ വാക്കു കേൾക്കാതെ എനിക്കെതിരായി നടന്നാൽ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ഏകദേശം ‘എന്നോടുകൂടെ എതിർപ്പിൽ നടക്കുക’ എന്നാണ്. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന പദം ദുഷ്കരമാണ്; ഈ സന്ദർഭത്തിൽ അതിന് ‘എതിർപ്പ്’ അല്ലെങ്കിൽ ‘ശത്രുത’ എന്ന അർഥമുണ്ട്.
