  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: ml
  text: എന്നാൽ, അവർ തങ്ങളുടെ അകൃത്യവും തങ്ങളുടെ പിതാക്കന്മാരുടെ അകൃത്യവും, എന്നോടു അവർ വിശ്വാസവഞ്ചന കാട്ടിയ അവരുടെ വിശ്വാസവഞ്ചനയും[a], എനിക്കെതിരായി അവർ നടന്നതും[b] ഏറ്റുപറഞ്ഞാൽ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘വിശ്വാസവഞ്ചന’ എന്നതിനു ‘അപരാധം’ എന്നോ ‘ദ്രോഹം’ എന്നോ വിവർത്തനം ചെയ്യാം. ഉടമ്പടിബന്ധം ലംഘിച്ചതിന് ഊന്നൽ നൽകാൻ എബ്രായത്തിൽ ഒരേ ധാതുവിലുള്ള നാമവും ക്രിയയും ആവർത്തിക്കുന്നു: ‘എന്നോടു അവർ വിശ്വാസവഞ്ചന കാട്ടിയ അവരുടെ വിശ്വാസവഞ്ചന.’'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്നോടു ശത്രുതയോടെ നടന്നു.’ ഈ അധ്യായത്തിൽ ആവർത്തിക്കുന്ന ദുഷ്കരമായ קֶרִי (ഖെരി) എന്ന എബ്രായപദം എതിർപ്പോടെയോ ശത്രുതയോടെയോ ഉള്ള പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: എന്നാൽ അവർ … ഏറ്റുപറഞ്ഞാൽ
  rationale: ידה എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ഇവിടെ ‘ഏറ്റുപറയുക’ എന്ന അർഥത്തിലാണ്. മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന നിബന്ധനാപരമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘എന്നാൽ … ഏറ്റുപറഞ്ഞാൽ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: עֲוֺנָם
  choice: തങ്ങളുടെ അകൃത്യം
  rationale: עָוֹן കുറ്റകരമായ ദുഷ്പ്രവൃത്തിയെയോ അതിന്റെ കുറ്റബാധ്യതയെയോ സൂചിപ്പിക്കാം. ഇവിടെ ഏറ്റുപറയേണ്ട ധാർമിക തെറ്റ് എന്ന ഭാരം ‘അകൃത്യം’ നിലനിർത്തുന്നു.
- source_word: עֲוֺן אֲבֹתָם
  choice: തങ്ങളുടെ പിതാക്കന്മാരുടെ അകൃത്യം
  rationale: എബ്രായത്തിലെ ഘടന നേരിട്ട് നിലനിർത്തുകയും, പുരുഷലിംഗ പൂർവികപദമായ אָבוֹת എന്നതിനു ‘പിതാക്കന്മാർ’ ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: בְּמַעֲלָם … מָעֲלוּ בִי
  choice: എന്നോടു വിശ്വാസവഞ്ചന കാട്ടിയ അവരുടെ വിശ്വാസവഞ്ചന
  rationale: മൂലത്തിലെ മַעַל എന്ന നാമത്തിന്റെയും അതേ ധാതുവിലുള്ള ക്രിയയുടെയും ആവർത്തനം ഉടമ്പടിബന്ധത്തിലെ വിശ്വാസലംഘനത്തിന് ഊന്നൽ നൽകുന്നു. ആ ബന്ധവും ആവർത്തനവും മലയാളത്തിലും കഴിയുന്നത്ര നിലനിർത്തി.
- source_word: וְאַף
  choice: …യും
  rationale: കുറ്റസമ്മതത്തിൽ മറ്റൊരു കാര്യംകൂടി ചേർക്കുന്നതായി മലയാളത്തിലെ സമുച്ചയപ്രത്യയം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: എനിക്കു വിരോധമായി നടന്നത്
  rationale: הלך എന്ന ‘നടക്കുക’ എന്ന ജീവിതനടപ്പിന്റെ രൂപകവും, ദുഷ്കരമായ קֶרִי പദത്തിന്റെ എതിർപ്പ്/ശത്രുത എന്ന ആശയവും ചേർത്ത് നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: സ്വന്തം അകൃത്യത്തോടൊപ്പം പിതാക്കന്മാരുടെ അകൃത്യവും ഏറ്റുപറയുക
  choice: ‘തങ്ങളുടെ പിതാക്കന്മാരുടെ അകൃത്യം’ എന്നു മുഖ്യപാഠത്തിൽ വ്യക്തമായി നിലനിർത്തി.
  alternative: ‘പൂർവികരുടെ പാപങ്ങൾ’ എന്നോ അവരുടെ തെറ്റുകളുടെ ഫലങ്ങൾ മാത്രമെന്നോ നൽകുക.
  rationale: മൂലപാഠം അവരുടെ സ്വന്തം അകൃത്യത്തോടൊപ്പം പിതാക്കന്മാരുടെ അകൃത്യവും നേരിട്ട് ഉൾപ്പെടുത്തുന്നു. അതിലെ സമൂഹപരവും ഉടമ്പടിസംബന്ധവുമായ സംഘർഷം വ്യക്തിവാദപരമായി മൃദൂകരിക്കുകയോ വിശദീകരണം ചേർത്ത് പരിഹരിക്കുകയോ ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. ‘അകൃത്യം,’ ‘വിശ്വാസവഞ്ചന,’ ‘വിരോധമായി നടന്നു’ എന്നീ പദപ്രയോഗങ്ങൾ മൂലത്തിലെ ധാർമിക, ഉടമ്പടിസംബന്ധ, രൂപകാത്മക ഘടകങ്ങൾ നിലനിർത്തുന്നു. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന നിബന്ധനയായതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമം ഉപയോഗിച്ചു.
