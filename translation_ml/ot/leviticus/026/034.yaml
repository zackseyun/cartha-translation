  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: ml
  text: അപ്പോൾ ദേശം ശൂന്യമായി കിടക്കുന്ന കാലമൊക്കെയും തന്റെ ശബ്ബത്തുകളുടെ കുറവ് നികത്തും; നിങ്ങൾ ശത്രുക്കളുടെ ദേശത്തായിരിക്കുമ്പോൾ, അപ്പോൾ ദേശം വിശ്രമിച്ച് തന്റെ ശബ്ബത്തുകളുടെ കുറവ് നികത്തും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ ശബ്ബത്തുകൾ അനുഭവിക്കും” അല്ലെങ്കിൽ “തന്റെ ശബ്ബത്തുകൾക്കു ലഭിക്കേണ്ടത് ലഭിക്കും.” ഇവിടെ എബ്രായക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ മുമ്പ് ലഭിക്കാതിരുന്ന ശബ്ബത്തുകൾക്കുള്ള പരിഹാരം ലഭിക്കുക എന്ന ഭാവമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: മുൻവിവരിച്ച ന്യായവിധിയുടെ ഫലമായി സംഭവിക്കുന്ന കാര്യത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലസൂചകപ്രയോഗം.
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: അനുഭവിക്കും / അനുഭവിക്കുകയും ചെയ്യും
  rationale: ഈ സന്ദർഭത്തിൽ ദേശത്തിന് ലഭിക്കാതെപോയ ശബ്ബത്തുവിശ്രമം ഒടുവിൽ ലഭിക്കുന്നതെന്ന ആശയം നൽകുന്നു. എബ്രായപദത്തിന്റെ ആവർത്തനം മലയാളത്തിലും ഒരേ പ്രയോഗത്തിലൂടെ നിലനിർത്തി; പ്രതിഫലനത്തിന്റെയോ കുറവുനികത്തലിന്റെയോ ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇവിടെ മുഴുവൻ ഭൂമിയെയല്ല, ഉടമ്പടിയുമായി ബന്ധപ്പെട്ട പ്രത്യേക ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: തന്റെ ശബ്ബത്തുവിശ്രമങ്ങൾ
  rationale: ദേശത്തിന് നിശ്ചയിച്ചിരുന്ന ശബ്ബത്തുകളെ, പ്രത്യേകിച്ച് ശബ്ബത്തുവർഷങ്ങളിലെ വിശ്രമത്തെ, വ്യക്തമാക്കുന്നു. ‘വിശ്രമങ്ങൾ’ ചേർക്കുന്നത് സാധാരണ വായനക്കാർക്ക് അർഥം ഗ്രഹിക്കാൻ സഹായിക്കുന്നു.
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: ശൂന്യമായി കിടക്കുന്ന കാലമൊക്കെയും
  rationale: ദേശത്തിന്റെ ശൂന്യാവസ്ഥയുടെ മുഴുവൻ ദൈർഘ്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: നിങ്ങൾ ശത്രുക്കളുടെ ദേശത്തായിരിക്കുമ്പോൾ
  rationale: പ്രധാന സംഭവത്തോടൊപ്പം നിലനിൽക്കുന്ന കാലപരമായ സാഹചര്യത്തെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: תִּשְׁבַּת
  choice: വിശ്രമിക്കുകയും
  rationale: കൃഷി നിലച്ച് ദേശം വിശ്രമിക്കുന്നതും ശബ്ബത്തിന്റെ ആശയവും ഒരുപോലെ നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
theological_decisions:
- issue: പ്രവാസകാലത്ത് ദേശവും അതിന്റെ ശബ്ബത്തുകളും തമ്മിലുള്ള ബന്ധം
  choice: ദേശത്തിന് മുമ്പ് ലഭിക്കാതെപോയ ശബ്ബത്തുവിശ്രമം ശൂന്യകാലത്ത് ലഭിക്കുന്നു എന്ന നിലയിൽ ‘അനുഭവിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ശബ്ബത്തുകളുടെ കുറവ് നികത്തും’ അല്ലെങ്കിൽ ‘ശബ്ബത്തുകൾക്കുള്ള പ്രതിഫലം ലഭിക്കും.’
  rationale: വിധിയുടെയും നഷ്ടപരിഹാരത്തിന്റെയും സന്ദർഭഭാവം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുമ്പോൾ, മുഖ്യവാചകം എബ്രായപദത്തിന്റെ ‘സ്വീകരിക്കുക/അനുഭവിക്കുക’ എന്ന വിശാലത തുറന്നുവയ്ക്കുന്നു; ഏതെങ്കിലും പ്രത്യേക മതവിഭാഗത്തിന്റെ വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശബ്ബത്ത്’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തി, ദേശത്തിന്റെ വിശ്രമമാണെന്ന് വ്യക്തമാക്കാൻ ‘ശബ്ബത്തുവിശ്രമങ്ങൾ’ എന്നു പ്രയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനവും വാക്യത്തിന്റെ വിധിന്യായഭാവവും സംരക്ഷിച്ചു.
