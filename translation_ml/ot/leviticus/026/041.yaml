id: LEV.26.41
reference: Leviticus 26:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: ml
  text: ഞാനും[a] അവരോടു വിരോധമായി നടക്കുകയും[b] അവരുടെ ശത്രുക്കളുടെ ദേശത്തേക്ക് അവരെ കൊണ്ടുവരുകയും ചെയ്യും. അല്ലെങ്കിൽ അപ്പോൾ[c] അവരുടെ പരിച്ഛേദനയേൽക്കാത്ത ഹൃദയം[d] താഴ്ത്തപ്പെടും; അപ്പോൾ അവർ തങ്ങളുടെ അകൃത്യത്തിനുള്ള ശിക്ഷ ഏറ്റുവാങ്ങും.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞാനും’ എന്നതിന് ‘ഞാൻ തന്നെയും’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപ്രയോഗം ദൈവത്തിന്റെ പ്രതികരണപ്രവൃത്തിക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവരോടുകൂടെ വിരോധത്തിൽ നടക്കും’ അഥവാ ‘അവർക്കു വിരോധമായി നടക്കും.’ ഈ അധ്യായത്തിലെ ഉടമ്പടിശാപഭാഷ ഇവിടെ ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ‘അല്ലെങ്കിൽ അപ്പോൾ.’ ഈ പ്രയോഗം ദുഷ്കരമാണ്; അവരുടെ ഹൃദയം താഴ്ത്തപ്പെടുന്ന ഘട്ടത്തെ ഇത് അവതരിപ്പിക്കുന്നതായിരിക്കാം.
    reason: alternative_reading
  - marker: d
    text: അക്ഷരാർഥത്തിൽ ‘അവരുടെ പരിച്ഛേദനയേൽക്കാത്ത ഹൃദയം.’ ആന്തരിക ദുശ്ശാഠ്യത്തെയും അശുദ്ധിയെയും സൂചിപ്പിക്കുന്ന ഉടമ്പടിരൂപകമാണിത്.
    reason: cultural_note
  - marker: e
    text: ‘അവർ തങ്ങളുടെ അകൃത്യത്തിന് പരിഹാരം ചെയ്യും’ എന്നോ ‘അവരുടെ അകൃത്യത്തിനുള്ള വില വീട്ടപ്പെടും’ എന്നോ വിവർത്തനം ചെയ്യാം. കുറ്റത്തിന് അർഹമായ പരിണതഫലം സ്വീകരിക്കുകയോ വഹിക്കുകയോ ചെയ്യുന്നതാണ് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: ഞാനും
  rationale: אַף എന്ന പദവും സ്വതന്ത്ര സർവനാമവും ചേർന്ന് ദൈവത്തിന്റെ പ്രതികരണപ്രവൃത്തിക്ക് ഊന്നൽ നൽകുന്നു. ‘ഞാനും’ ആ പരസ്പരപ്രതികരണവും ഊന്നലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: അവരോടു വിരോധമായി നടക്കും
  rationale: ലേവ്യപുസ്തകം 26-ൽ ആവർത്തിക്കുന്ന ഉടമ്പടിശാപപ്രയോഗമാണിത്. קֶרִי ഇവിടെ യാദൃച്ഛികതയെക്കാൾ എതിർപ്പ് അഥവാ വിരോധം സൂചിപ്പിക്കുന്നു; ‘വിരോധമായി നടക്കുക’ മൂലത്തിലെ നടത്തത്തിന്റെ രൂപകവും അധ്യായത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: അവരുടെ ശത്രുക്കളുടെ ദേശത്തേക്ക് അവരെ കൊണ്ടുവരും
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘കൊണ്ടുവരുക’ എന്നാണ് അർഥം. ഈ വിവർത്തനം പ്രവാസത്തിന്റെ പശ്ചാത്തലം വ്യക്തമായി നൽകുന്നു.
- source_word: אוֹ אָז
  choice: അല്ലെങ്കിൽ അപ്പോൾ
  rationale: ഈ എബ്രായ പദസമുച്ചയത്തിന്റെ വാക്യഘടന ദുഷ്കരമാണ്. അതിന്റെ വികല്പസൂചകമായ സ്വഭാവം വ്യാഖ്യാനിച്ച് മിനുക്കിക്കളയാതെ ‘അല്ലെങ്കിൽ അപ്പോൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: יִכָּנַע
  choice: താഴ്ത്തപ്പെടും
  rationale: כנע എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ‘താഴ്ത്തപ്പെടുക’ അഥവാ ‘കീഴടക്കപ്പെടുക’ എന്നർഥം നൽകുന്നു. ഹൃദയമാണ് കർത്താവ് എന്നതിനാൽ ‘താഴ്ത്തപ്പെടും’ ആന്തരികമായ വിനയപ്പെടലിനെ കൂടുതൽ യോജിച്ചവിധം സൂചിപ്പിക്കുന്നു.
- source_word: לְבָבָם הֶעָרֵל
  choice: അവരുടെ പരിച്ഛേദനയേൽക്കാത്ത ഹൃദയം
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിസംബന്ധമായ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു. ‘ദുശ്ശാഠ്യമുള്ള ഹൃദയം’ എന്ന വ്യാഖ്യാനപരമായ പകരംവാക്ക് ഉപയോഗിക്കാതെ തോറായുമായും പ്രവാചകഗ്രന്ഥങ്ങളുമായുമുള്ള ആശയബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: അപ്പോൾ അവർ തങ്ങളുടെ അകൃത്യത്തിനുള്ള ശിക്ഷ ഏറ്റുവാങ്ങും
  rationale: רצה + עון എന്ന പ്രയോഗം കുറ്റത്തിന്റെ ന്യായമായ പരിണതഫലം സ്വീകരിക്കുകയോ വഹിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ശിക്ഷ ഏറ്റുവാങ്ങും’ എന്നത് സ്വയം പ്രായശ്ചിത്തം നേടുന്നു എന്ന ആശയം ചേർക്കാതെ ഈ ന്യായവിധിസംബന്ധമായ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: הֶעָרֵל എന്ന പദം ഹൃദയത്തെ വിശേഷിപ്പിക്കുന്ന രൂപകം
  choice: ‘പരിച്ഛേദനയേൽക്കാത്ത ഹൃദയം’ എന്ന ഉടമ്പടിരൂപകം നിലനിർത്തി
  alternative: ‘ദുശ്ശാഠ്യമുള്ള ഹൃദയം’ അല്ലെങ്കിൽ ‘മാനസാന്തരപ്പെടാത്ത ഹൃദയം’
  rationale: ഇത് പൊതുവായ ദുശ്ശാഠ്യവിവരണം മാത്രമല്ല, ഉടമ്പടിപരമായ അർഥഭാരമുള്ള രൂപകമാണ്. നേരിട്ടുള്ള രൂപം നിലനിർത്തുന്നത് ആവർത്തനപുസ്തകത്തോടും പ്രവാചകഗ്രന്ഥങ്ങളോടുമുള്ള ബന്ധം സംരക്ഷിക്കുകയും വ്യാഖ്യാനപരമായ ചുരുക്കൽ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: יִרְצוּ אֶת עֲוֺנָם എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: അവർ തങ്ങളുടെ അകൃത്യത്തിനുള്ള ശിക്ഷ ഏറ്റുവാങ്ങും
  alternative: അവർ തങ്ങളുടെ അകൃത്യത്തിന് പരിഹാരം ചെയ്യും; അവരുടെ അകൃത്യം വീട്ടപ്പെടും
  rationale: ഈ പ്രയോഗം ഉടമ്പടിലംഘനത്തിനുള്ള ശിക്ഷ അംഗീകരിച്ച് വഹിക്കുന്നതിനെക്കുറിച്ചാണ്; പുണ്യപ്രവൃത്തിയിലൂടെ സ്വയം പ്രായശ്ചിത്തം നേടുന്നതിനെക്കുറിച്ചല്ല. തിരഞ്ഞെടുത്ത രൂപം പിൽക്കാല സിദ്ധാന്തവിഭാഗങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ ന്യായവിധിസംബന്ധമായ അർഥം സൂക്ഷിക്കുന്നു.
- issue: אוֹ אָז എന്ന ദുഷ്കരമായ ബന്ധകപ്രയോഗം
  choice: ‘അല്ലെങ്കിൽ അപ്പോൾ’ എന്ന് തുറന്ന നിലയിൽ സൂക്ഷിച്ചു
  alternative: ‘അപ്പോൾ ഒരുപക്ഷേ’ അല്ലെങ്കിൽ നിബന്ധനയായി ‘അപ്പോൾ അവരുടെ ഹൃദയം താഴ്മപ്പെട്ടാൽ’
  rationale: മൂലത്തിലെ വികല്പസൂചനയും വാക്യഘടനാപരമായ അസ്പഷ്ടതയും മായ്ച്ചുകളയാതെ നിലനിർത്തുന്നു; മാനസാന്തരത്തിന്റെ കൃത്യമായ ക്രമബന്ധം വിവർത്തനം തന്നെ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘വിരോധമായി നടക്കുക,’ ‘പരിച്ഛേദനയേൽക്കാത്ത ഹൃദയം’ എന്നീ മൂലരൂപകങ്ങൾ ദൈവശാസ്ത്രപരവും അന്തർഗ്രന്ഥപരവുമായ അർഥഭാരം കാരണം നിലനിർത്തി; ദുഷ്കരമായ ‘അല്ലെങ്കിൽ അപ്പോൾ’ എന്ന ബന്ധം അടിക്കുറിപ്പോടെ തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
