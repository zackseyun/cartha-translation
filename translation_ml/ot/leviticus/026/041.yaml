  source_fidelity: എബ്രായത്തിലെ ഊന്നലുള്ള אַף אֲנִי (‘ഞാനും’), ഉടമ്പടി-ശാപസന്ദർഭത്തിലെ בְּקֶרִי (‘വിരോധമായി’), പ്രവാസസൂചന, ദുഷ്കരമായ אוֹ אָז-ന്റെ വികല്പസ്വഭാവം, ‘പരിച്ഛേദനയേൽക്കാത്ത ഹൃദയം’ എന്ന രൂപകം, കുറ്റത്തിന്റെ പരിണതഫലം സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന יִרְצוּ אֶת־עֲוֺנָם എന്നിവ വിശ്വസ്തമായി കൈമാറിയിരിക്കുന്നു. ‘അകൃത്യത്തിനുള്ള ശിക്ഷ ഏറ്റുവാങ്ങും’ എന്നത് സന്ദർഭാനുസൃതവും വ്യാഖ്യാനാതിക്രമമില്ലാത്തതുമാണ്.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും വായനാസുഗമവുമാണ്. ‘അല്ലെങ്കിൽ അപ്പോൾ’ സാധാരണ മലയാളപ്രയോഗമല്ലെങ്കിലും, മൂലത്തിലെ അസാധാരണവും തർക്കവിഷയവുമായ അല്ലെങ്കിൽ-സൂചന മനഃപൂർവം നിലനിർത്തുന്നതാണ്; അതിനെ വിശദീകരിക്കുന്ന അടിക്കുറിപ്പ് ഉണ്ട്.
  terminology: ‘വിരോധമായി നടക്കുക,’ ‘പരിച്ഛേദനയേൽക്കാത്ത ഹൃദയം,’ ‘അകൃത്യം,’ ‘ശിക്ഷ ഏറ്റുവാങ്ങുക’ എന്നിവ മൂലരൂപകത്തിനും നിയമ/ഉടമ്പടി രജിസ്റ്ററിനും യോജിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പുകളിലെ പദവ്യത്യാസങ്ങളും സാംസ്കാരിക വിശദീകരണവും ശരിയായ ആങ്കറുകളിൽ നൽകിയിട്ടുണ്ട്.
