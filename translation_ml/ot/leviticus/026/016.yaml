reference: Leviticus 26:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַף אֲנִ֞י אֶֽעֱשֶׂה זֹּ֣את לָ/כֶ֗ם וְ/הִפְקַדְתִּ֨י עֲלֵי/כֶ֤ם בֶּֽהָלָה֙ אֶת הַ/שַּׁחֶ֣פֶת וְ/אֶת הַ/קַּדַּ֔חַת מְכַלּ֥וֹת עֵינַ֖יִם וּ/מְדִיבֹ֣ת נָ֑פֶשׁ וּ/זְרַעְתֶּ֤ם לָ/רִיק֙ זַרְעֲ/כֶ֔ם וַ/אֲכָלֻ֖/הוּ אֹיְבֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: ml
  text: 'ഞാനും നിങ്ങളോട് ഇങ്ങനെ ചെയ്യും: പെട്ടെന്നുള്ള ഭീതി[a], ക്ഷയിപ്പിക്കുന്ന രോഗം[b], പനി എന്നിവ ഞാൻ നിങ്ങളുടെമേൽ വരുത്തും; അവ കണ്ണുകളെ മങ്ങിക്കുകയും ജീവനെ ക്ഷയിപ്പിക്കുകയും ചെയ്യും.[c] നിങ്ങൾ വിത്തു വിതയ്ക്കുന്നതു വെറുതെയാകും; നിങ്ങളുടെ ശത്രുക്കൾ അതു തിന്നും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “പരിഭ്രാന്തി.” ഈ ഹീബ്രു പദം പെട്ടെന്നുണ്ടാകുന്ന ഭീതിയെയോ സംഭ്രമത്തെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിലെ രോഗനാമത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; ശരീരം ക്ഷയിപ്പിക്കുന്ന ഒരു രോഗത്തെയാണ് സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “കണ്ണുകളെ ക്ഷയിപ്പിക്കുകയും ജീവനെ വാടിക്കുകയും ചെയ്യുന്നവ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אֲנִי
  choice: ഞാനും
  rationale: തുടർച്ചയോടൊപ്പം ഊന്നലും പ്രതികാരാത്മകമായ ഭാവവും നൽകുന്ന പ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികം.
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: ഞാൻ നിങ്ങളുടെമേൽ വരുത്തും
  rationale: ഹിഫ്ഇൽ രൂപത്തിന് നിയമിക്കുക, ഏൽപ്പിക്കുക, മേൽ വരുത്തുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ന്യായവിധിയുടെ ഈ സന്ദർഭത്തിൽ ‘മേൽ വരുത്തും’ വ്യക്തവും സ്വാഭാവികവുമാണ്; ഭരണചുമതല നിയമിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: בֶּהָלָה
  choice: പെട്ടെന്നുള്ള ഭീതി
  rationale: ഭീതി, പരിഭ്രാന്തി, പെട്ടെന്നുള്ള ഞെട്ടൽ എന്നീ ഭാവങ്ങൾ ഉൾക്കൊള്ളുന്നു.
- source_word: הַשַּׁחֶפֶת
  choice: ക്ഷയിപ്പിക്കുന്ന രോഗം
  rationale: കൃത്യമായ പുരാതന രോഗനിർണയം അനിശ്ചിതമായതിനാൽ ക്ഷയം വരുത്തുന്ന രോഗം എന്ന ലക്ഷണാധിഷ്ഠിത പരിഭാഷ സ്വീകരിച്ചു; ക്ഷയരോഗം എന്ന് അതിവിശദമാക്കിയില്ല.
- source_word: הַקַּדַּחַת
  choice: പനി
  rationale: ജ്വരതാപത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സമകാലിക രൂപം.
- source_word: מְכַלּוֹת עֵינַיִם
  choice: കണ്ണുകളെ മങ്ങിക്കുകയും
  rationale: അക്ഷരാർഥത്തിലെ ‘കണ്ണുകളെ ക്ഷയിപ്പിക്കുക/തീർക്കുക’ എന്ന ദൃശ്യഭാവം രോഗഫലമായി കാഴ്ച മങ്ങുന്നതെന്ന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: ജീവനെ ക്ഷയിപ്പിക്കുകയും
  rationale: נפש ഇവിടെ വേർപെട്ട അമൂർത്ത ആത്മാവിനെക്കാൾ ജീവൻ/ജീവശക്തി എന്ന അർഥത്തിലാണ്; ദുഷ്കരമായ ഹീബ്രു പ്രയോഗത്തിന്റെ ക്ഷയിപ്പിക്കുന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: നിങ്ങൾ വിത്തു വിതയ്ക്കുന്നതു വെറുതെയാകും
  rationale: ഫലമില്ലായ്മയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും വിതയ്ക്കൽ എന്ന കാർഷികചിത്രം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കൾ അതു തിന്നുകളയും
  rationale: വാവ് സംയോജകത്തെ നേരിട്ട് നിലനിർത്തുന്നു; ക്രിയയിലെ ഏകവചന പ്രത്യയം വിത്തിനെയോ അതിൽനിന്നുള്ള വിളവിനെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതു’ എന്ന അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശാപസന്ദർഭത്തിലെ נָפֶשׁ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ജീവൻ
  alternative: ആത്മാവ്; ജീവശക്തി; വ്യക്തി
  rationale: ശാരീരിക ക്ഷയത്തിന്റെ സന്ദർഭത്തിൽ ‘ജീവൻ’ ഹീബ്രു പദത്തിന്റെ ജീവസത്ത/ജീവിതം എന്ന അർഥം നൽകുന്നു; മനുഷ്യഘടനയെക്കുറിച്ചുള്ള പിന്നീടുള്ള പ്രത്യേക സിദ്ധാന്തം പാഠത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ദൈവിക പ്രവർത്തനം സൂചിപ്പിക്കുന്ന פקד ഹിഫ്ഇൽ രൂപം
  choice: നിങ്ങളുടെമേൽ വരുത്തും
  alternative: നിങ്ങളുടെമേൽ നിയമിക്കും; നിങ്ങളെ സന്ദർശിക്കും
  rationale: ഉടമ്പടി ലംഘനത്തിനുള്ള ന്യായവിധി ദൈവം ഏൽപ്പിക്കുന്നതിനെ വ്യക്തമാക്കുന്നു; ദൈവിക പ്രവർത്തനത്തിന്റെ കർത്തൃത്വം മൃദൂകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവിക ന്യായവിധിയുടെ നേരിട്ടുള്ള സ്വരം നിലനിർത്തി. അപൂർവമായ രോഗനാമം അതിവിശദമായ വൈദ്യനിർണയമായി മാറ്റാതെ, അടിക്കുറിപ്പിൽ അനിശ്ചിതത്വം രേഖപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രസക്തമായ മുഖ്യവാചകസ്ഥാനങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
