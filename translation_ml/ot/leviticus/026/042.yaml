  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: ml
  text: അപ്പോൾ യാക്കോബുമായുള്ള എന്റെ ഉടമ്പടി ഞാൻ ഓർക്കും[a]; ഇസ്ഹാക്കുമായുള്ള എന്റെ ഉടമ്പടിയും അബ്രാഹാമുമായുള്ള എന്റെ ഉടമ്പടിയും ഞാൻ ഓർക്കും; ദേശത്തെയും ഞാൻ ഓർക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാക്കോബുമായുള്ള എന്റെ ഉടമ്പടി ഞാൻ ഓർക്കും.’ എബ്രായത്തിലെ സംയോജകം ലളിതമായി ‘എന്നും’ എന്നോ ‘കൂടാതെ’ എന്നോ പരിഭാഷപ്പെടുത്താം; ‘അപ്പോൾ’ എന്നത് മുൻസന്ദർഭവുമായുള്ള ഈ വാക്യത്തിന്റെ ബന്ധം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: അപ്പോൾ … ഞാൻ ഓർക്കും
  rationale: זכר എന്നത് ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ വെറും മനസ്സിൽ ഓർക്കുന്നതിനെക്കാൾ പ്രവർത്തിക്കാനുള്ള ഉദ്ദേശ്യത്തോടെ ഓർക്കുന്നതിനെ സൂചിപ്പിക്കാം. എങ്കിലും മൂലപദത്തിന്റെ രൂപം നിലനിർത്താൻ ‘ഓർക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി. മുൻസന്ദർഭവുമായുള്ള ബന്ധം വ്യക്തമാക്കാൻ וְ എന്ന സംയോജകത്തെ ‘അപ്പോൾ’ എന്നു നൽകി; ‘എന്നും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: בְּרִית എന്നത് ദൈവവും പിതാക്കന്മാരും തമ്മിലുള്ള ബന്ധത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബൈബിൾപദമാണ്; ആ ഗൗരവവും ബന്ധപരമായ അർത്ഥവും ‘ഉടമ്പടി’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: יַעֲקֹב
  choice: യാക്കോബ്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ നൽകി.
- source_word: וְאַף
  choice: …യും
  rationale: ഇവിടെ אַף നൽകുന്ന കൂട്ടിച്ചേർക്കലും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ ‘യും’ എന്ന ചേർക്കൽപ്രത്യയംകൊണ്ട് പ്രകടമാക്കി; അനാവശ്യമായ കാഠിന്യം ഒഴിവാക്കി.
- source_word: יִצְחָק
  choice: യിസ്ഹാക്ക്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ നൽകി.
- source_word: אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ നൽകി.
- source_word: אֶזְכֹּר
  choice: ഞാൻ ഓർക്കും
  rationale: അബ്രാഹാമിന്റെ ഉടമ്പടിയോടു ചേർന്നുള്ള ആവർത്തിത ക്രിയ മൂലപാഠത്തിലെ വാഗ്‌ഭംഗിയും ഊന്നലും നിലനിർത്തുന്നതിനായി ഒഴിവാക്കാതെ പരിഭാഷപ്പെടുത്തി.
- source_word: וְהָאָרֶץ
  choice: ദേശത്തെയും
  rationale: ഉടമ്പടി സന്ദർഭത്തിൽ אֶרֶץ വാഗ്ദത്തദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. നിർദ്ദിഷ്ടത നിലനിർത്താൻ ‘ദേശം’ എന്നതിനോട് കർമചിഹ്നവും കൂട്ടിച്ചേർക്കൽപ്രത്യയവും ചേർത്തു.
theological_decisions:
- issue: പിതാക്കന്മാരുമായുള്ള ഉടമ്പടികളുടെ ക്രമവും ഊന്നലും
  choice: യാക്കോബ്, യിസ്ഹാക്ക്, അബ്രാഹാം എന്ന എബ്രായ ക്രമം നിലനിർത്തുകയും ഓരോരുത്തനോടും ‘എന്റെ ഉടമ്പടി’ എന്ന പ്രയോഗം ആവർത്തിക്കുകയും ചെയ്തു.
  alternative: കാലക്രമപരമായി അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നു പുനഃക്രമീകരിക്കുക; അല്ലെങ്കിൽ ‘അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരുമായുള്ള ഉടമ്പടി’ എന്നു ചുരുക്കുക.
  rationale: മൂലപാഠത്തിലെ വിപരീതകാലക്രമവും ആവർത്തനവും ഉദ്ദേശ്യപൂർവമായ ഊന്നൽ നൽകുന്നു. അത് മിനുക്കിക്കളയുന്നത് പാഠത്തിൽ ഇല്ലാത്ത പരിചിതസൂത്രവാക്യം ഇറക്കുമതി ചെയ്യുന്നതായിരിക്കും.
- issue: ദൈവം ‘ഓർക്കുന്നു’ എന്നതിന്റെ അർത്ഥം
  choice: ‘ഓർക്കും’ എന്ന പദം വിപുലീകരിക്കാതെ നിലനിർത്തി.
  alternative: ‘ഓർത്ത് പ്രവർത്തിക്കും’ അല്ലെങ്കിൽ ‘പുതുക്കും’ എന്നു വ്യാഖ്യാനാത്മകമായി നൽകുക.
  rationale: ഉടമ്പടി സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ഓർമ്മ പ്രവർത്തനത്തെ സൂചിപ്പിക്കാമെങ്കിലും പാഠം നേരിട്ട് പറയുന്നത് ‘ഓർക്കും’ എന്നാണ്. ആ ദൈവശാസ്ത്രപരമായ അർത്ഥസാന്ദ്രത പരിഭാഷയിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനവും പിതാക്കന്മാരുടെ അസാധാരണ ക്രമവും സംരക്ഷിച്ചു; മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി וְאַף എന്നത് ‘യും’ എന്ന ചേർക്കൽപ്രത്യയത്തിലൂടെ പ്രകടമാക്കി.
