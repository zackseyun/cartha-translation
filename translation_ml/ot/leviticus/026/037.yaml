translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ പരിഭ്രാന്തിയുടെ ദൃശ്യഭാവം സൂക്ഷിച്ചിരിക്കുന്നു; ‘ഓടിപ്പോകുക’ എന്ന പരോക്ഷക്രിയ ചേർക്കാതെ താരതമ്യപ്രയോഗം നിലനിർത്തി. പ്രസിദ്ധീകരണവാക്യത്തിലെ ഏക അടിക്കുറിപ്പുകുറി [a] പ്രധാനപാഠത്തിലും നൽകിയിരിക്കുന്നു.
