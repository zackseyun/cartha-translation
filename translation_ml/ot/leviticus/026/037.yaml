source:
  edition: WLC
  text: וְ/כָשְׁל֧וּ אִישׁ בְּ/אָחִ֛י/ו כְּ/מִ/פְּנֵי חֶ֖רֶב וְ/רֹדֵ֣ף אָ֑יִן וְ/לֹא תִֽהְיֶ֤ה לָ/כֶם֙ תְּקוּמָ֔ה לִ/פְנֵ֖י אֹֽיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: ml
  text: വാളിൽനിന്ന് ഓടിപ്പോകുന്നതുപോലെ അവർ പരസ്പരം തട്ടിവീഴും[a]; പിന്തുടരുന്നവൻ ആരുമില്ലെങ്കിലും, നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ നിലകൊള്ളാൻ നിങ്ങൾക്കു കഴിയുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഒരാൾ തന്റെ സഹോദരനോടു/എതിരെ”; ഇവിടെ പരിഭ്രാന്തിയിൽ അവർ പരസ്പരം കൂട്ടിയിടിച്ചു വീഴുന്നതാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: തട്ടിവീഴും
  rationale: כשל എന്ന ക്രിയയുടെ ഇടറുക/വീഴുക എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; തുടർന്നുള്ള പരസ്പരസമ്പർക്കവും പരിഭ്രാന്തിയും സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אִישׁ בְּאָחִיו
  choice: പരസ്പരം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരാൾ തന്റെ സഹോദരനിൽ/സഹോദരനെതിരെ’ എന്ന വിതരണാത്മക പ്രയോഗം; ഇവിടെ പരിഭ്രാന്തിയിൽ ഒരാൾ മറ്റൊരാളിൽ തട്ടി വീഴുന്നതാണ് ആശയം.
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: വാളിന്റെ മുമ്പിൽനിന്നെന്നപോലെ
  rationale: כְּ (‘പോലെ’)യും מִפְּנֵי (‘മുമ്പിൽനിന്ന്/സന്നിധിയിൽനിന്ന്’)യും ചേർന്ന രൂപം അടുത്തായി പകരുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ഓടിപ്പോകുക’ എന്ന ക്രിയ ചേർക്കുന്നില്ല.
- source_word: וְרֹדֵף אָיִן
  choice: പിന്തുടരുന്നവൻ ആരുമില്ലെങ്കിലും
  rationale: ‘പിന്തുടരുന്നവൻ ഇല്ല’ എന്ന അസ്തിത്വനിഷേധത്തെ സ്വാഭാവിക മലയാളത്തിൽ പകരുകയും സന്ദർഭത്തിലെ വൈരുധ്യഭാവം ‘എങ്കിലും’കൊണ്ട് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: ഉറച്ചുനിൽക്കാൻ നിങ്ങൾക്കു കഴിയുകയില്ല
  rationale: תְּקוּמָהയുടെ ‘എഴുന്നേൽപ്പ്/നിലനിൽപ്പ്/എതിർത്തുനിൽക്കാനുള്ള ശേഷി’ എന്ന അർഥപരിധിയിൽ, സൈനികസന്ദർഭത്തിലെ ചെറുത്തുനിൽക്കാനാകാത്ത അവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ
  rationale: ശത്രുസാമീപ്യത്തിലും ഏറ്റുമുട്ടലിലും לפניക്കുള്ള സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളപ്രയോഗം.
