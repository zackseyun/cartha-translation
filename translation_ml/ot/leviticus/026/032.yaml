id: LEV.26.32
reference: Leviticus 26:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/הֲשִׁמֹּתִ֥י אֲנִ֖י אֶת הָ/אָ֑רֶץ וְ/שָֽׁמְמ֤וּ עָלֶ֨י/הָ֙ אֹֽיְבֵי/כֶ֔ם הַ/יֹּשְׁבִ֖ים בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: ml
  text: ഞാൻതന്നെ ആ ദേശത്തെ ശൂന്യമാക്കും; അതിൽ താമസിക്കുന്ന നിങ്ങളുടെ ശത്രുക്കൾ അതുകണ്ട് സ്തംഭിച്ചുപോകും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അതുകണ്ട് വിസ്മയിച്ചുപോകും” അല്ലെങ്കിൽ “അതുകണ്ട് ഭയന്നുപോകും.” ദേശത്തിന്റെ നാശം കണ്ടുള്ള ഞെട്ടലും ഭീതിയും ഈ എബ്രായ ക്രിയയ്ക്ക് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: ശൂന്യമാക്കും
  rationale: ശׁמם എന്ന ധാതുവിന്റെ കാരണപ്രയോഗം ദേശത്തെ ശൂന്യാവസ്ഥയിലാക്കുക എന്നർഥം നൽകുന്നു. ‘ശൂന്യമാക്കും’ കാരണാർഥം വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: אֲנִי
  choice: ഞാൻതന്നെ
  rationale: ക്രിയയിൽ കർത്താവ് അടങ്ങിയിരിക്കെ സ്വതന്ത്ര സർവനാമം ചേർത്തിരിക്കുന്നത് ഊന്നലിനാണ്; ‘ഞാൻതന്നെ’ അത് നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ആ ദേശത്തെ
  rationale: ഉടമ്പടിശാപങ്ങളുടെ ഈ സന്ദർഭത്തിൽ പദം ഭൂമി മുഴുവനെയല്ല, ഇസ്രായേലിന്റെ ഉടമ്പടിദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സന്ദർഭനിർദ്ദിഷ്ടത വ്യക്തമാക്കാൻ ‘ആ ദേശം’ സ്വാഭാവികമാണ്.
- source_word: וְשָׁמְמוּ
  choice: സ്തംഭിച്ചുപോകും
  rationale: ഇവിടെ ശׁמם എന്ന ധാതു നാശം കണ്ട് ഞെട്ടി സ്തംഭിക്കുന്ന പ്രതികരണം സൂചിപ്പിക്കാം. ശത്രുക്കളാണ് കർത്താവെന്നതിനാൽ അവരെ ശൂന്യമാക്കുന്നു എന്നതിലുപരി അവരുടെ ഞെട്ടലാണ് സന്ദർഭോചിതം.
- source_word: עָלֶיהָ
  choice: അതുകണ്ട്
  rationale: ശׁמם എന്ന ക്രിയയോടൊപ്പമുള്ള עַל വിസ്മയത്തിന്റെയോ ഭീതിയുടെയോ കാരണത്തെ സൂചിപ്പിക്കുന്നു; ദേശത്തിന്റെ അവസ്ഥ കണ്ടുള്ള പ്രതികരണം മലയാളത്തിൽ ‘അതുകണ്ട്’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കൾ
  rationale: മൂലത്തിലെ രണ്ടാംപുരുഷ ബഹുവചന ഉടമസ്ഥരൂപത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക വിവർത്തനം.
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: അതിൽ താമസിക്കുന്ന
  rationale: ישׁב എന്ന കൃദ്യന്തം അവിടെ വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘താമസിക്കുന്ന’ ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: ഉടമ്പടിന്യായവിധിയുടെ സന്ദർഭത്തിൽ הָאָרֶץ എന്നതിന്റെ സൂചന
  choice: ആ ദേശം—സന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ/കനാന്റെ ദേശം
  alternative: ഭൂമി മുഴുവൻ
  rationale: അടുത്ത സന്ദർഭം ഇസ്രായേലിന്റെ ദേശത്തിന്മേലുള്ള ഉടമ്പടിശാപങ്ങളെക്കുറിച്ചാണ്; അതിനാൽ ന്യായവിധിയെ സർവഭൂമിയിലേക്കു വ്യാപിപ്പിക്കാതെ ‘ആ ദേശം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- issue: וְשָׁמְמוּ എന്നതിലെ അർഥവ്യാപ്തി
  choice: ശത്രുക്കൾ ദേശത്തിന്റെ നാശം കണ്ട് സ്തംഭിച്ചുപോകും
  alternative: ശത്രുക്കൾ തന്നെയും ശൂന്യരാകും / അവർ വിസ്മയിക്കും / ഭയന്നുപോകും
  rationale: ധാതുവിന് ശൂന്യമാകുക എന്നും ഞെട്ടുകയോ ഭീതിയോടെ വിസ്മയിക്കുകയോ ചെയ്യുക എന്നും അർഥമാകാം. ഇവിടെ ദേശത്തിൽ താമസിക്കുന്ന ശത്രുക്കളാണ് കർത്താക്കൾ; עָלֶיהָ അവരുടെ പ്രതികരണത്തിന്റെ കാരണമായി ദേശത്തെ ചൂണ്ടുന്നതിനാൽ പ്രതികരണാർഥം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ ‘ഞാൻതന്നെ’ എന്നതിലൂടെ നിലനിർത്തി. എബ്രായത്തിലെ സാധാരണ സംയോജകബന്ധം ഉദ്ദേശ്യബന്ധമായി മാറ്റാതെ മലയാളത്തിലെ സ്വാഭാവികമായ അർദ്ധവിരാമം ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രതികരണവാക്യത്തിനുശേഷം ചേർത്തു.
