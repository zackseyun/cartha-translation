id: LEV.26.1
reference: Leviticus 26:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: ml
  text: നിങ്ങൾ നിങ്ങൾക്കായി വിഗ്രഹങ്ങൾ ഉണ്ടാക്കരുത്; കൊത്തിയുണ്ടാക്കിയ രൂപമോ കൽത്തൂണോ നിങ്ങൾക്കായി സ്ഥാപിക്കരുത്. രൂപം കൊത്തിയ കല്ല്[a] അതിനെ നമസ്കരിക്കാനായി നിങ്ങളുടെ ദേശത്ത് വെക്കരുത്. കാരണം, ഞാൻ നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെ[b] ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രൂപം കൊത്തിയ കല്ല്” എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കൃത്യമായ സൂക്ഷ്മാർഥം ഉറപ്പില്ല; “കൊത്തുപണിയുള്ള കല്ല്” അല്ലെങ്കിൽ “കൽരൂപം” എന്നും പരിഭാഷപ്പെടുത്താം. വിലക്കപ്പെട്ട ആരാധനയുമായി ബന്ധപ്പെട്ട ഒരു കൽവസ്തുവിനെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു: YHWH (יהוה); പരമ്പരാഗതമായി “കർത്താവ്” എന്നും നൽകാറുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: വിഗ്രഹങ്ങൾ
  rationale: ആരാധനയ്ക്കായി ഉണ്ടാക്കുന്ന വ്യാജദൈവരൂപങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപദം; മൂലത്തിലെ നിന്ദാസൂചന അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: פֶסֶל
  choice: കൊത്തിയുണ്ടാക്കിയ രൂപം
  rationale: കൊത്തുപണിയിലൂടെ നിർമിച്ച രൂപം എന്ന മൂർത്തമായ അർഥം നിലനിർത്തുകയും אֱלִילִם എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം കാക്കുകയും ചെയ്യുന്നു.
- source_word: מַצֵּבָה
  choice: നാട്ടിയ കൽത്തൂൺ
  rationale: നിവർത്തി സ്ഥാപിച്ച കൽസ്മാരകമോ തൂണോ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; 'വിശുദ്ധ' എന്ന് ചേർത്ത് ആരാധനാസംബന്ധമായ വ്യാഖ്യാനം പദത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: אֶבֶן מַשְׂכִּית
  choice: രൂപം കൊത്തിയ കല്ല്
  rationale: കല്ലിൽ രൂപമോ അലങ്കാരമോ കൊത്തിയിരിക്കുന്ന വസ്തുവാകാമെന്ന സാധ്യത വ്യക്തമാക്കുന്നു; കൃത്യമായ സൂക്ഷ്മാർഥം വിവാദമുള്ളതിനാൽ അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകൾ നൽകുന്നു.
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: അതിനെ നമസ്കരിക്കരുത്
  rationale: ലക്ഷ്യാർഥമുള്ള ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു. 'അതിന്റെമേൽ നമസ്കരിക്കുക' എന്ന വ്യാകരണസാധ്യതയെക്കാൾ ആരാധനാവസ്തുവിനു മുമ്പിൽ കുനിയുക എന്ന സന്ദർഭാർഥം കൂടുതൽ സാധ്യതയുള്ളതാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം നിലനിർത്തുന്നു. മലയാളത്തിലെ വ്യാപകവും വായനാസൗകര്യമുള്ളതുമായ ലിപ്യന്തരണം 'യഹോവ'യാണ്; മറ്റു പാരമ്പര്യങ്ങൾ സൂചിപ്പിക്കാൻ അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു.
- issue: വിലക്കപ്പെട്ട ആരാധനാവസ്തുക്കളുടെ പദവ്യത്യാസം
  choice: വിഗ്രഹങ്ങൾ, കൊത്തിയുണ്ടാക്കിയ രൂപം, നാട്ടിയ കൽത്തൂൺ, രൂപം കൊത്തിയ കല്ല് എന്നിങ്ങനെ വേർതിരിച്ചു
  alternative: എല്ലാം 'വിഗ്രഹങ്ങൾ' എന്ന ഒറ്റപദത്തിൽ ലയിപ്പിക്കുക
  rationale: വാക്യത്തിൽ നിരത്തിയിരിക്കുന്ന വ്യത്യസ്ത ഹീബ്രുപദങ്ങളുടെ നിയമപരമായ പ്രത്യേകതയും ആവർത്തനത്തിലെ ഊന്നലും സംരക്ഷിക്കുന്നു.
- issue: עָלֶיהָ എന്ന മുൻപ്രത്യയത്തിന്റെ ബന്ധം
  choice: അതിനെ നമസ്കരിക്കുക
  alternative: അതിന്റെമേൽ നമസ്കരിക്കുക
  rationale: ആരാധനാവസ്തുവിന് മുമ്പിൽ കുനിയുക എന്ന അർഥമാണ് സന്ദർഭത്തിൽ കൂടുതൽ സ്വാഭാവികം; എങ്കിലും മുൻപ്രത്യയത്തിന്റെ അക്ഷരാർഥം മറ്റൊരു വ്യാഖ്യാനത്തിന് ഇട നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. നിരോധനങ്ങളുടെ ആവർത്തനം നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി മൂന്നായി വിഭജിച്ചു. എല്ലാ രണ്ടാംപുരുഷ ബഹുവചനരൂപങ്ങളും സമൂഹത്തോടുള്ള അഭിസംബോധനയായി സൂക്ഷിച്ചു.
