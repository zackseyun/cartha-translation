  terminology: ‘ജനതകൾ’ appropriately represents גּוֹיִם without importing later religious senses. ‘ദേശം’ is a sound contextual rendering of אֶרֶץ, and ‘ശത്രുക്കളുടെ’ correctly preserves the construct relationship. The note accurately identifies the literal sense of the Hebrew verb.
