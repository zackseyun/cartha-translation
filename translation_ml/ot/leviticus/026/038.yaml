  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: ml
  text: നിങ്ങൾ ജനതകളുടെ ഇടയിൽ നശിച്ചുപോകും; നിങ്ങളുടെ ശത്രുക്കളുടെ ദേശം നിങ്ങളെ വിഴുങ്ങും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘തിന്നുകളയും.’ എബ്രായ ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘തിന്നുക’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: നിങ്ങൾ നശിച്ചുപോകും
  rationale: Qal രൂപത്തിലുള്ള אבד ഇവിടെ ഉടമ്പടിശാപത്തിന്റെ ഫലമായി വരുന്ന നാശത്തെ സൂചിപ്പിക്കുന്നു. ‘നശിച്ചുപോകും’ എന്നത് അക്രമമരണത്തെ അനാവശ്യമായി വ്യക്തമാക്കാതെ നാശവും ഇല്ലാതാകലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּגּוֹיִם
  choice: ജനതകളുടെ ഇടയിൽ
  rationale: גּוֹיִם എന്നത് ‘ജനതകൾ/രാഷ്ട്രങ്ങൾ’ എന്നാണ്. പ്രവാസസന്ദർഭത്തിൽ ‘ജനതകളുടെ ഇടയിൽ’ സ്വാഭാവികമാണ്; പിൽക്കാല മതപരമായ അർഥഭാരം ഉള്ള പദം ഒഴിവാക്കുന്നു.
- source_word: וְאָכְלָה
  choice: വിഴുങ്ങും
  rationale: אכל എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘തിന്നുക’ എന്നതാണ്. ദേശം കർത്താവായുള്ള ഈ രൂപകത്തിൽ ‘വിഴുങ്ങും’ എന്നത് അതിന്റെ ദൃശ്യശക്തിയും വ്യക്തിവൽക്കരണവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶתְכֶם
  choice: നിങ്ങളെ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയത്തോടുകൂടിയ നേരിട്ടുള്ള കർമത്തെ സ്വാഭാവികമായി ‘നിങ്ങളെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֶרֶץ
  choice: ദേശം
  rationale: אֶרֶץ എന്നതിന് ദേശം, ഭൂമി, രാജ്യം എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ശത്രുക്കളുടെ അധീനദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദേശം’ ഏറ്റവും യോജിച്ചതാണ്.
- source_word: אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കളുടെ
  rationale: ‘ദേശം’ എന്ന പദത്തെ വിശേഷിപ്പിക്കുന്ന construct പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണിത്.
theological_decisions:
- issue: ‘ശത്രുക്കളുടെ ദേശം നിങ്ങളെ തിന്നും’ എന്ന രൂപകത്തിന്റെ ശക്തി
  choice: ദേശം പ്രവാസികളെ ‘വിഴുങ്ങുന്നു’ എന്ന ഉടമ്പടിശാപരൂപകം നിലനിർത്തി.
  alternative: ‘നിങ്ങളുടെ ശത്രുക്കളുടെ ദേശം നിങ്ങളെ നശിപ്പിക്കും’ എന്നു വിശദീകരിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായത്തിൽ ‘തിന്നുക’ എന്ന സാധാരണ ക്രിയ ദേശത്തെ കർത്താവാക്കി രൂപകമായി ഉപയോഗിക്കുന്നു. ‘വിഴുങ്ങും’ എന്ന പരിഭാഷ ശാപത്തിന്റെ കാഠിന്യവും സാഹിത്യദൃശ്യവും നിലനിർത്തുന്നു; അതിനെ ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘വിഴുങ്ങും’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ ശക്തമായ രൂപകം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
