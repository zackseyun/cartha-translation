reference: Leviticus 26:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ וְ/הַ/תּוֹרֹת֒ אֲשֶׁר֙ נָתַ֣ן יְהוָ֔ה בֵּינ֕/וֹ וּ/בֵ֖ין בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֥ר סִינַ֖י בְּ/יַד מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: ml
  text: യാഹ്‌വെ മോശെ മുഖാന്തരം[a] സീനായി പർവതത്തിൽ തനിക്കും ഇസ്രായേൽമക്കൾക്കും ഇടയിൽ നൽകിയ ചട്ടങ്ങളും ന്യായവിധികളും നിയമങ്ങളും ഇവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “മോശെയുടെ കൈയാൽ”; അർത്ഥം: “മോശെ മുഖാന്തരം.”'
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവയാണ്
  rationale: സംഗ്രഹവാക്യം അവതരിപ്പിക്കുന്ന എബ്രായ നിർദേശകപ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള വാക്യാന്ത്യരൂപത്തിൽ നൽകുന്നു.
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: സ്ഥിരമായി നിർദേശിക്കപ്പെട്ട വ്യവസ്ഥകൾ എന്ന നിയമപരമായ അർത്ഥം ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: הַמִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: നിയമവിധികൾ, ന്യായനിർണയങ്ങൾ എന്നീ ഉറവിടാർത്ഥങ്ങളെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הַתּוֹרֹת
  choice: നിയമങ്ങൾ
  rationale: ചട്ടങ്ങളും ന്യായവിധികളും ചേർന്ന നിയമസംഗ്രഹത്തിന്റെ പശ്ചാത്തലത്തിൽ ബഹുവചനമായ תּוֹרֹת-ന് യോജിച്ച സ്വാഭാവിക പദം.
- source_word: אֲשֶׁר נָתַן
  choice: നൽകിയ
  rationale: נָתַן എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർത്ഥമായ ‘നൽകുക’ സംരക്ഷിക്കുന്നു; ‘സ്ഥാപിച്ച’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നൽകുന്നു.
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: തനിക്കും ഇസ്രായേൽമക്കൾക്കും ഇടയിൽ
  rationale: പരസ്പര ഉടമ്പടിബന്ധത്തെ സൂചിപ്പിക്കുന്ന ‘ഇടയിൽ’ എന്ന ഘടനയും בְּנֵי יִשְׂרָאֵל എന്ന ഉറവിടപ്രയോഗത്തിന്റെ രൂപവും നിലനിർത്തുന്നു.
- source_word: בְּהַר סִינַי
  choice: സീനായിമലയിൽവെച്ച്
  rationale: സംഭവസ്ഥലം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെയുടെ കൈമുഖാന്തരം
  rationale: ‘മോശെയുടെ കൈയാൽ’ എന്ന എബ്രായ ശൈലിയുടെ രൂപഭാവം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് മധ്യസ്ഥതയുടെ അർത്ഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാള വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ജനസമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽജനം
  rationale: ഉറവിടത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന പദരൂപം സംരക്ഷിക്കുകയും, മുഴുവൻ ഉടമ്പടിജനത്തെയും സൂചിപ്പിക്കുന്ന പരമ്പരാഗത സാമൂഹികപ്രയോഗമായി വായിക്കപ്പെടാൻ ഇടവരുത്തുകയും ചെയ്യുന്നു.
- issue: נָתַן എന്ന ക്രിയയുടെ ഉടമ്പടിസന്ദർഭാർഥം
  choice: നൽകിയ
  alternative: സ്ഥാപിച്ച
  rationale: ‘സ്ഥാപിച്ചു’ എന്ന ഉടമ്പടിവ്യാഖ്യാനം സാധ്യമാണെങ്കിലും, മൂലക്രിയയുടെ നേരിട്ടുള്ള അർത്ഥം സംരക്ഷിച്ച് ആശയവികാസം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ഉടമ്പടി ശൈലി. വാക്യക്രമം മലയാളത്തിന് സ്വാഭാവികമാക്കിയെങ്കിലും എബ്രായത്തിലെ മൂന്ന് നിയമപദങ്ങളുടെ വേർതിരിവും ‘ഇടയിൽ’ എന്ന ബന്ധപ്രയോഗവും നിലനിർത്തിയിരിക്കുന്നു. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോട് കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
