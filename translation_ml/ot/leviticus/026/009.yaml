  yaml_path: translation/ot/leviticus/026/009.yaml
  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളിലേക്കു തിരിയും; നിങ്ങളെ സന്താനസമൃദ്ധരാക്കുകയും പെരുപ്പിക്കുകയും ചെയ്യും[a]. നിങ്ങളുമായുള്ള എന്റെ ഉടമ്പടി ഞാൻ സ്ഥിരപ്പെടുത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞാൻ നിങ്ങളെ അനുകൂലമായി കടാക്ഷിക്കും.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “ഞാൻ നിങ്ങളിലേക്കു തിരിയും” എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് ദൈവത്തിന്റെ അനുകൂലമായ ശ്രദ്ധയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: ഞാൻ നിങ്ങളിലേക്കു തിരിഞ്ഞ്
  rationale: פנה എന്ന ക്രിയയുടെ ‘തിരിയുക’ എന്ന ദൃശ്യരൂപവും אֲלֵיכֶם സൂചിപ്പിക്കുന്ന ദിശയും നിലനിർത്തുന്നു. അനുഗ്രഹത്തിന്റെ പശ്ചാത്തലത്തിൽ ദൈവത്തിന്റെ അനുകൂലമായ ശ്രദ്ധ ഇതിൽ ഉൾക്കൊള്ളുന്നുവെങ്കിലും അത് മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: നിങ്ങളെ സന്താനസമൃദ്ധരാക്കുകയും
  rationale: פרה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം കാരണാർത്ഥകമാണ്. ഇവിടെ ജനത്തിന്റെ വർധനയാണ് ഉദ്ദേശിക്കുന്നത്; ‘സന്താനസമൃദ്ധരാക്കുക’ എന്നത് ആ അർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: നിങ്ങളെ പെരുപ്പിക്കുകയും ചെയ്യും
  rationale: רבה എന്ന ഹിഫീൽ രൂപം ‘എണ്ണത്തിൽ വർധിപ്പിക്കുക, പെരുപ്പിക്കുക’ എന്നാണ്. മുൻപുള്ള ഫലസമൃദ്ധിയുടെ അനുഗ്രഹവുമായി അതിന്റെ സമാന്തരബന്ധം നിലനിർത്തുന്നു.
- source_word: וַהֲקִימֹתִי אֶת־בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി ഞാൻ ഉറപ്പിക്കും
  rationale: ברית-യോടൊപ്പം קום എന്ന ഹിഫീൽ ക്രിയ നിലവിലുള്ള ഉടമ്പടിയെ ഉറപ്പിക്കുക, പ്രാബല്യത്തിൽ നിലനിർത്തുക എന്ന അർത്ഥം വഹിക്കാം. ഈ പശ്ചാത്തലത്തിൽ ‘ഉറപ്പിക്കും’ എന്നത് പുതിയൊരു ഉടമ്പടി ആദ്യമായി സ്ഥാപിക്കുന്നു എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
- source_word: אִתְּכֶם
  choice: നിങ്ങളോടുള്ള
  rationale: ഉടമ്പടിയുടെ ബന്ധപരമായ ദിശ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവം ജനത്തിലേക്കു ‘തിരിയുന്നു’ എന്ന പ്രയോഗത്തിലെ അനുകൂലത മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘ഞാൻ നിങ്ങളിലേക്കു തിരിഞ്ഞ്’ എന്ന മൂർത്തമായ എബ്രായ ദൃശ്യരൂപം നിലനിർത്തി
  alternative: ‘ഞാൻ നിങ്ങളെ അനുകൂലമായി കടാക്ഷിച്ച്’
  rationale: സന്ദർഭം ദൈവാനുകൂല്യം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; എങ്കിലും ക്രിയയുടെ അടിസ്ഥാന അർത്ഥം ‘തിരിയുക’ എന്നാണ്. അതിനാൽ മുഖ്യപാഠം ഉറവിടരൂപം കാത്തുസൂക്ഷിക്കുകയും അർത്ഥസൂചന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: וַהֲקִימֹתִי എന്നത് ‘സ്ഥാപിക്കും’ എന്നോ ‘ഉറപ്പിക്കും’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: ‘ഉറപ്പിക്കും’
  alternative: ‘സ്ഥാപിക്കും’
  rationale: ലേവ്യപുസ്തകം 26-ലെ അഭിസംബോധിതർ ഇതിനകം സീനായി ഉടമ്പടിയുടെ പരിധിയിലാണ്. അതിനാൽ ഇവിടെ ഉടമ്പടി പ്രാബല്യത്തിൽ ഉറപ്പിക്കുന്നതെന്ന വായന സന്ദർഭത്തിന് യോജിക്കുന്നു; എങ്കിലും ‘സ്ഥാപിക്കും’ എന്ന അർത്ഥസാധ്യത പൂർണമായി ഇല്ലാതാകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉടമ്പടി’ എന്ന സ്ഥിരമായ ബൈബിൾ പദം നിലനിർത്തി. ‘സന്താനസമൃദ്ധരാക്കുക’ ജനവർധനയുടെ ആശയം വ്യക്തമാക്കുന്നു; ‘പെരുപ്പിക്കുക’ ആവർത്തനമല്ലാതെ എബ്രായത്തിലെ സമാന്തര അനുഗ്രഹസൂത്രം സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
