id: LEV.26.22
reference: Leviticus 26:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִשְׁלַחְתִּ֨י בָ/כֶ֜ם אֶת חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/שִׁכְּלָ֣ה אֶתְ/כֶ֔ם וְ/הִכְרִ֨יתָה֙ אֶת בְּהֶמְתְּ/כֶ֔ם וְ/הִמְעִ֖יטָה אֶתְ/כֶ֑ם וְ/נָשַׁ֖מּוּ דַּרְכֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: ml
  text: ഞാൻ വയലിലെ വന്യമൃഗങ്ങളെ[a] നിങ്ങളുടെ നേരെ അയക്കും. അവ നിങ്ങളെ മക്കളെ നഷ്ടപ്പെട്ടവരാക്കും[b], നിങ്ങളുടെ വളർത്തുമൃഗങ്ങളെ നശിപ്പിക്കും, നിങ്ങളുടെ എണ്ണം കുറയ്ക്കും; നിങ്ങളുടെ വഴികൾ വിജനമായിത്തീരും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വയലിലെ കാട്ടുമൃഗങ്ങളെ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ ക്രിയയുടെ അർഥം ‘നിങ്ങളെ ദുഃഖിതരാക്കും’ എന്ന പൊതുഅർഥമല്ല; പ്രത്യേകിച്ച് മക്കളെ നഷ്ടപ്പെടുത്തി വിലപിപ്പിക്കും എന്നതാണ്. ‘മക്കൾ’ എന്ന പദം മൂലവാചകത്തിൽ പ്രത്യേകം പറഞ്ഞിട്ടില്ല.
    reason: lexical_alternative
  - marker: c
    text: ‘വഴികൾ’ എന്നത് ‘പാതകൾ’ എന്നും വിവർത്തനം ചെയ്യാം; ഇവിടെ സഞ്ചാരവഴികൾ ആളൊഴിഞ്ഞ് വിജനമാകുന്നതാണ് സാധ്യതയേറിയ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: ഞാൻ നിങ്ങളുടെ നേരെ അയക്കും
  rationale: שלח എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ദൈവിക പ്രവർത്തനത്തെ നേരിട്ട് ‘അയക്കും’ എന്നു സൂചിപ്പിക്കുന്നു; ശിക്ഷാത്മക സാഹചര്യത്തിലെ בָכֶם എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ‘നിങ്ങളുടെ നേരെ’ എന്നാണ്.
- source_word: חַיַּת הַשָּׂדֶה
  choice: വയലിലെ വന്യമൃഗങ്ങളെ
  rationale: ഈ സംയുക്തപ്രയോഗം മനുഷ്യരുടെ വളർത്തുമൃഗങ്ങളിൽനിന്ന് വ്യത്യസ്തമായ തുറസ്സായ പ്രദേശങ്ങളിലെ വന്യമൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘വന്യമൃഗങ്ങൾ’ ആധുനികവും വ്യക്തവുമാണ്.
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: അവ നിങ്ങളെ മക്കളില്ലാത്തവരാക്കും
  rationale: שׁכל എന്ന ക്രിയയുടെ പീയേൽ രൂപം സാധാരണയായി മക്കളെ നഷ്ടപ്പെടുത്തി ഒരാളെ മക്കളില്ലാത്തവനാക്കുക എന്ന അർഥം വഹിക്കുന്നു. മലയാളത്തിൽ വെറും ‘ദുഃഖിതരാക്കും’ എന്നു പറഞ്ഞാൽ നിർണായകമായ ആശയം നഷ്ടപ്പെടും.
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: നിങ്ങളുടെ കന്നുകാലികളെ നശിപ്പിക്കും
  rationale: הכרית ഇവിടെ പൂർണമായ ഇല്ലായ്മ വരുത്തുക എന്ന ശിക്ഷാത്മക അർഥത്തിലാണ്. ‘ഛേദിച്ചുകളയും’ എന്ന പദാനുപദ വിവർത്തനത്തെക്കാൾ ‘നശിപ്പിക്കും’ സ്വാഭാവികവും അർഥവ്യക്തവുമാണ്; בְּהֵמָה വളർത്തുമൃഗസമ്പത്തിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: നിങ്ങളുടെ എണ്ണം കുറയ്ക്കും
  rationale: מעט എന്നതിന്റെ ഹിഫീൽ രൂപം ‘കുറവാക്കുക’ എന്നാണ്; ഇവിടെ ജനസംഖ്യ കുറയുന്നതിനെ ‘നിങ്ങളുടെ എണ്ണം കുറയ്ക്കും’ എന്നു വ്യക്തമായി നൽകുന്നു.
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: നിങ്ങളുടെ വഴികൾ വിജനമായിത്തീരും
  rationale: נשׁם എന്നത് ശൂന്യമോ വിജനമോ ആയിത്തീരുന്നതും דְּרָכִים ഇവിടെ സഞ്ചാരവഴികളുമായിരിക്കാൻ സാധ്യതയുള്ളതുമാണ്. ‘വഴികൾ’ എന്ന പദം മൂലത്തിലെ ചെറിയ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: മക്കളെ നഷ്ടപ്പെടുന്നതിനെക്കുറിച്ചുള്ള പരോക്ഷ സൂചന
  choice: പ്രധാനവാചകത്തിൽ ‘മക്കളില്ലാത്തവരാക്കും’ എന്ന് വ്യക്തമാക്കി
  alternative: ‘നിങ്ങളെ മക്കൾ നഷ്ടപ്പെട്ടവരാക്കും’ അല്ലെങ്കിൽ പരോക്ഷമായി ‘നിങ്ങളെ വിയോഗത്തിലാക്കും’
  rationale: എബ്രായ ക്രിയയിൽ ‘മക്കൾ’ എന്ന നാമം പ്രത്യേകം ഇല്ലെങ്കിലും שׁכל എന്ന പ്രയോഗം പതിവായി മക്കളുടെ നഷ്ടത്തെ സൂചിപ്പിക്കുന്നു. വ്യക്തതയ്ക്കായി അർഥം നൽകിയെങ്കിലും ഈ പരോക്ഷത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: דַּרְכֵיכֶם എന്നതിന്റെ അർഥം
  choice: ‘നിങ്ങളുടെ വഴികൾ’ എന്നു നിലനിർത്തി, സാഹചര്യത്തിൽ സഞ്ചാരവഴികൾ എന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി
  alternative: ‘നിങ്ങളുടെ പാതകൾ’ അല്ലെങ്കിൽ രൂപകമായി ‘നിങ്ങളുടെ ജീവിതരീതികൾ’
  rationale: ജനനാശവും കന്നുകാലിനാശവും മൂലം ഗതാഗതപാതകൾ വിജനമാകുന്നതാണ് സന്ദർഭത്തിലെ സാധ്യതയേറിയ അർഥം; എങ്കിലും ‘വഴികൾ’ എന്ന വിശാലമായ പദം മൂലത്തിലെ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദൈവിക വിധിയുടെ നേരിട്ടുള്ള ഭാഷ നിലനിർത്തി. ‘വയലിലെ വന്യമൃഗങ്ങൾ,’ ‘മക്കളില്ലാത്തവരാക്കും,’ ‘വഴികൾ’ എന്നീ തിരഞ്ഞെടുപ്പുകളിലൂടെ മൂലത്തിന്റെ ദൃശ്യവും ഭാഗികമായ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
