  to: നിങ്ങൾ ദീർഘകാലം സൂക്ഷിച്ചുവെച്ച പഴയ വിളവ് ഭക്ഷിക്കും; പുതിയ വിളവുമൂലം പഴയതു പുറത്തെടുക്കും.[a]
