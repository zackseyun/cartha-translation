id: LEV.26.10
reference: Leviticus 26:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֥ם יָשָׁ֖ן נוֹשָׁ֑ן וְ/יָשָׁ֕ן מִ/פְּנֵ֥י חָדָ֖שׁ תּוֹצִֽיאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: ml
  text: നിങ്ങൾ ദീർഘകാലം സൂക്ഷിച്ചുവെച്ച പഴയ വിളവ് ഭക്ഷിക്കും; പുതിയ വിളവുമൂലം പഴയതു പുറത്തെടുക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ പദാനുപദമായി: “നിങ്ങൾ വളരെ പഴയതു ഭക്ഷിക്കും; പുതിയതുമൂലം പഴയതു പുറത്തേക്കു കൊണ്ടുപോകും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: നിങ്ങൾ ... ഭക്ഷിക്കും
  rationale: ഉടമ്പടിയുടെ അനുഗ്രഹവാഗ്ദാനങ്ങളുടെ ഈ സന്ദർഭത്തിൽ വാവോടുകൂടിയ ഖാൽ പൂർണരൂപം ഭാവികാല അർഥം നൽകുന്നു.
- source_word: יָשָׁן נוֹשָׁן
  choice: ദീർഘകാലം സൂക്ഷിച്ചുവെച്ച പഴയ വിളവ്
  rationale: יָשָׁן ഇവിടെ നാമവാചകമായി മുൻവിളവിൽ നിന്നുള്ള സംഭരിച്ച ഉൽപ്പന്നത്തെ സൂചിപ്പിക്കുന്നു; נוֹשָׁן അതിന്റെ പഴക്കവും ദീർഘകാല സംഭരണവും ഊന്നുന്നു. സന്ദർഭം വ്യക്തമാക്കാൻ ‘വിളവ്’ ചേർത്തിരിക്കുന്നു; ‘പഴകിയത്’ എന്ന പ്രതികൂല ധ്വനി ഒഴിവാക്കി.
- source_word: וְיָשָׁן
  choice: പഴയതു
  rationale: രണ്ടാമത്തെ יָשָׁן-ഉം നാമവാചകമായി മുമ്പ് സംഭരിച്ചിരുന്ന വിളവിനെ സൂചിപ്പിക്കുന്നു; ആവർത്തനഭാരം കൂടാതെ എബ്രായത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: מִפְּנֵי חָדָשׁ
  choice: പുതിയ വിളവിനുവേണ്ടി
  rationale: מִפְּנֵי ഇവിടെ പുതിയത് വന്നതിനാൽ പഴയത് മാറ്റുന്ന കാരണമോ സ്ഥാനമൊഴിയലോ സൂചിപ്പിക്കുന്നു. ‘വേണ്ടി’ പുതിയ വിളവിന് ഇടം നൽകുന്ന പ്രായോഗിക ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: תּוֹצִיאוּ
  choice: പുറത്തെടുക്കും
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘പുറത്തേക്കു കൊണ്ടുവരുക/എടുക്കുക’ എന്നാണ്. ‘പുറത്തെടുക്കും’ മൂലരൂപത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘ഒഴിവാക്കും’ എന്നതിനെക്കാൾ കുറച്ച് വ്യാഖ്യാനാത്മകമാണ്.
