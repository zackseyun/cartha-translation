translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ശൈലി. സമൃദ്ധിയുടെ ആശയം വ്യക്തമാക്കാൻ ‘വിളവ്’ സന്ദർഭാനുസൃതമായി ചേർത്തു. പ്രധാനവാചകത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോട് പൊരുത്തപ്പെടുന്നു.
