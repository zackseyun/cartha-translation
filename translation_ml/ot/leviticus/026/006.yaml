source:
  edition: WLC
  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: ml
  text: ദേശത്ത് ഞാൻ സമാധാനം നൽകും; നിങ്ങളെ ഭയപ്പെടുത്താൻ ആരുമില്ലാതെ നിങ്ങൾ കിടക്കും. ഉപദ്രവകാരികളായ മൃഗങ്ങളെ[a] ഞാൻ ദേശത്തുനിന്ന് നീക്കിക്കളയും; വാൾ[b] നിങ്ങളുടെ ദേശത്തുകൂടി കടന്നുപോകുകയുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അപകടകാരികളായ വന്യമൃഗങ്ങളെ.’ ഹീബ്രു പ്രയോഗം ദേശത്തുള്ള ഭീഷണികരമായ മൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘വാൾ’ എന്നത് ഇവിടെ യുദ്ധത്തെയോ സായുധാക്രമണത്തെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു ആലങ്കാരിക പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי שָׁלוֹם
  choice: ഞാൻ സമാധാനം നൽകും
  rationale: נתן എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘നൽകുക’ നിലനിർത്തുന്നു; שָׁלוֹם ഇവിടെ സുരക്ഷയും ക്ഷേമവും ഉൾക്കൊള്ളുന്ന ഉടമ്പടിയനുഗ്രഹമാണ്, അതിന് സ്വാഭാവികമായ മലയാളപദം ‘സമാധാനം’ ആണ്.
- source_word: בָּאָרֶץ
  choice: ദേശത്ത്
  rationale: ഉടമ്പടിയുമായി ബന്ധപ്പെട്ട നിർദിഷ്ട ദേശത്തെ സൂചിപ്പിക്കുന്ന אֶרֶץ എന്ന പദത്തിന്റെ ഭൗമിക അർഥം നിലനിർത്തുന്നു.
- source_word: וּשְׁכַבְתֶּם
  choice: നിങ്ങൾ കിടന്നുറങ്ങും
  rationale: שׁכב എന്ന ക്രിയയുടെ ‘കിടക്കുക’ എന്ന ദൃശ്യഭാവവും ഭയരഹിതമായ വിശ്രമത്തിന്റെ സന്ദർഭാർഥവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് നൽകുന്നു.
- source_word: וְאֵין מַחֲרִיד
  choice: നിങ്ങളെ ഭയപ്പെടുത്താൻ ആരുമില്ലാതെ
  rationale: മറ്റൊരാളെ ഭയപ്പെടുത്തുന്നവൻ എന്ന മַחֲרִיד-ന്റെ കാരകശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: וְהִשְׁבַּתִּי
  choice: ഞാൻ നീക്കിക്കളയും
  rationale: ഹിഫീൽ രൂപം ‘ഇല്ലാതാക്കുക/നിലച്ചുപോകുമാറാക്കുക’ എന്നു സൂചിപ്പിക്കുന്നു; ദേശത്തുനിന്ന് അപകടകരമായ മൃഗങ്ങളെ അകറ്റുന്നതിന്റെ ഫലം ഇവിടെ വ്യക്തമായി പറയുന്നു.
- source_word: חַיָּה רָעָה
  choice: ഉപദ്രവകാരികളായ മൃഗങ്ങൾ
  rationale: רָעָה ഇവിടെ ധാർമികമായ ‘ദുഷ്ടത’യല്ല, മനുഷ്യർക്കും കന്നുകാലികൾക്കും ഹാനികരമായ സ്വഭാവമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְחֶרֶב
  choice: വാൾ
  rationale: അക്ഷരാർഥമായ ദൃശ്യരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് യുദ്ധത്തെയോ സായുധാക്രമണത്തെയോ പ്രതിനിധാനം ചെയ്യുന്നു.
- source_word: לֹא תַעֲבֹר בְּאַרְצְכֶם
  choice: നിങ്ങളുടെ ദേശത്തുകൂടി കടന്നുപോകുകയുമില്ല
  rationale: עבר എന്നതിന്റെ ‘കടന്നുപോകുക’ എന്ന നേരിട്ടുള്ള അർഥവും ശത്രുസൈന്യം ദേശത്തിലൂടെ നീങ്ങുന്ന ദൃശ്യവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വാഗ്ദത്ത സമാധാനത്തിന്റെ വ്യാപ്തി
  choice: ഇസ്രായേലിന്റെ ദേശത്തെ ഭയത്തിൽനിന്നും ഹാനികരമായ മൃഗങ്ങളിൽനിന്നും സായുധാക്രമണത്തിൽനിന്നും സംരക്ഷിക്കുന്ന സമഗ്രവും ഭൗതികമായി പ്രകടമാകുന്നതുമായ ഉടമ്പടിയനുഗ്രഹം
  alternative: ഇത് കേവലം ആന്തരികമായ ആത്മീയ സമാധാനമെന്നോ കേവലം രാഷ്ട്രീയ സമാധാനമെന്നോ പരിമിതപ്പെടുത്തുക
  rationale: സുരക്ഷിതമായി കിടക്കുക, ഹാനികരമായ മൃഗങ്ങൾ ഇല്ലാതാകുക, വാൾ കടന്നുപോകാതിരിക്കുക എന്നീ മൂർത്തമായ പരാമർശങ്ങൾ വാഗ്ദത്തത്തിന്റെ വിശാലത വ്യക്തമാക്കുന്നു; പരിഭാഷ അതിനെ ഒറ്റ മേഖലയിൽ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ദൈവിക വാഗ്ദാനത്തിന്റെ ഒന്നാംപുരുഷ സ്വരം നിലനിർത്തി. ‘കിടന്നുറങ്ങും’ സുരക്ഷിത വിശ്രമത്തിന്റെ ചിത്രം സ്വാഭാവികമായി നൽകുന്നു; ‘വാൾ’ എന്ന മൂലരൂപം അടിക്കുറിപ്പിലൂടെ വിശദീകരിക്കുന്നു.
