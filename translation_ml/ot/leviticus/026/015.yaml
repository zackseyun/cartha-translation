reference: Leviticus 26:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם בְּ/חֻקֹּתַ֣/י תִּמְאָ֔סוּ וְ/אִ֥ם אֶת מִשְׁפָּטַ֖/י תִּגְעַ֣ל נַפְשְׁ/כֶ֑ם לְ/בִלְתִּ֤י עֲשׂוֹת֙ אֶת כָּל מִצְוֺתַ֔/י לְ/הַפְרְ/כֶ֖ם אֶת בְּרִיתִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: ml
  text: എന്റെ ചട്ടങ്ങളെ നിങ്ങൾ നിരസിക്കുകയും, എന്റെ വിധികളെ നിങ്ങളുടെ ഉള്ളം വെറുക്കുകയും, അങ്ങനെ എന്റെ എല്ലാ കല്പനകളും അനുഷ്ഠിക്കാതെ എന്റെ ഉടമ്പടി ലംഘിക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: חֻקִּים നിർദേശിക്കപ്പെട്ട നിയമവ്യവസ്ഥകളെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള מִשְׁפָּטִים എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിയമ-ഉടമ്പടി ഭാവവും ‘ചട്ടങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: תִּמְאָסוּ
  choice: നിങ്ങൾ നിരസിക്കുകയും
  rationale: מאס അവജ്ഞയോടുകൂടിയ തള്ളിക്കളയലിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘നിരസിക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִשְׁפָּטַי
  choice: എന്റെ വിധികൾ
  rationale: מִשְׁפָּטִים നിയമപരമായ വിധികളെയോ ന്യായനിർണയങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘വിധികൾ’ ആ നിയമഭാവം സംരക്ഷിക്കുകയും ‘ചട്ടങ്ങൾ’ എന്നതിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: നിങ്ങളുടെ ഉള്ളം വെറുക്കുകയും
  rationale: געל കടുത്ത വെറുപ്പിനെയും അറപ്പിനെയും സൂചിപ്പിക്കുന്നു; נֶפֶשׁ ഇവിടെ വ്യക്തിയുടെ ഉള്ളത്തെയോ മുഴുവൻ സ്വത്വത്തെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. അക്ഷരാർഥമായ ‘നിങ്ങളുടെ ആത്മാവ്’ എന്നതിനെക്കാൾ ‘നിങ്ങളുടെ ഉള്ളം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അതിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: അങ്ങനെ ... അനുഷ്ഠിക്കാതെ
  rationale: ഈ ഘടന ഫലമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു. ‘അങ്ങനെ ... അനുഷ്ഠിക്കാതെ’ വെറുപ്പിൽനിന്ന് അനുസരണക്കേടിലേക്കുള്ള ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל מִצְוֺתַי
  choice: എന്റെ കല്പനകളെല്ലാം
  rationale: מִצְוֹת കല്പനകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കല്പനകൾ’ ഉടമ്പടി-നിയമസന്ദർഭത്തിലെ സ്ഥിരവും വ്യക്തവുമായ പദമാണ്.
- source_word: לְהַפְרְכֶם
  choice: ലംഘിക്കുകയും
  rationale: פרר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഉടമ്പടി അസാധുവാക്കുകയോ തകർക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഉടമ്പടി ലംഘിക്കുക’ സ്വാഭാവികമായ നിയമ-ഉടമ്പടി പ്രയോഗമാണ്.
- source_word: בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: בְּרִית എന്ന സ്ഥിരമായ ഉടമ്പടി പദത്തിന് ‘ഉടമ്പടി’ കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാള പരിഭാഷയാണ്.
theological_decisions:
- issue: נֶפֶשׁ ഉൾപ്പെട്ട ഹീബ്രു മാനവശാസ്ത്രപരമായ പ്രയോഗം
  choice: നിങ്ങളുടെ ഉള്ളം വെറുക്കുകയും
  alternative: നിങ്ങളുടെ ആത്മാവ് വെറുക്കുകയും / നിങ്ങൾ പൂർണമായി വെറുക്കുകയും
  rationale: മൂലപാഠത്തിൽ נֶפֶשׁ വ്യാകരണകർത്താവായതിനാൽ വ്യക്തിയുടെ ആന്തരികവും സമഗ്രവുമായ വെറുപ്പ് നിലനിർത്തുന്നു; എന്നാൽ ‘ആത്മാവ്’ എന്ന സാങ്കേതിക പദം അനാവശ്യമായ ദേഹ-ആത്മ ദ്വൈത വ്യാഖ്യാനം ക്ഷണിക്കാം. ‘ഉള്ളം’ പ്രയോഗത്തിന്റെ തീവ്രത സ്വാഭാവികമായി കൈമാറുന്നു.
- issue: ഉടമ്പടി-നിയമ പദങ്ങളുടെ വ്യത്യാസം
  choice: ചട്ടങ്ങൾ / വിധികൾ / കല്പനകൾ / ഉടമ്പടി
  alternative: നിയമങ്ങൾ / പ്രമാണങ്ങൾ / ആജ്ഞകൾ / ഉടമ്പടി
  rationale: വാക്യത്തിൽ വ്യത്യസ്തമായ നിയമ-ഉടമ്പടി പദങ്ങൾ നിരത്തിയിരിക്കുന്നു. അവയെ ഒറ്റ പദത്തിലേക്ക് ചുരുക്കാതെ മലയാളത്തിലും സാധ്യമായത്ര വ്യത്യാസം നിലനിർത്തി.
- issue: לְהַפְרְכֶם എന്നതിലെ ബന്ധം
  choice: അനുഷ്ഠിക്കാതെ എന്റെ ഉടമ്പടി ലംഘിക്കുകയും
  alternative: എന്റെ ഉടമ്പടി അസാധുവാക്കേണ്ടതിന് / അതുവഴി എന്റെ ഉടമ്പടി തകർക്കുകയും
  rationale: ഇവിടെ കല്പനകൾ അനുഷ്ഠിക്കാതിരിക്കുന്നത് ഉടമ്പടി ലംഘനമായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ഏകോപിത ക്രിയാശൃംഖല ആ ബന്ധം നിലനിർത്തുന്നു; ഉദ്ദേശ്യമോ ഫലമോ എന്ന സൂക്ഷ്മ അനിശ്ചിതത്വം അതിയായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമ-ഉടമ്പടി ശൈലി. വാക്യം മുൻവാക്യത്തിന്റെ നിബന്ധനാശൃംഖലയോട് ചേരുന്നതിനാൽ ‘ചെയ്താൽ’ എന്ന നിബന്ധനാന്ത്യം നിലനിർത്തി. പ്രസിദ്ധീകരണ കരടിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുമില്ല.
