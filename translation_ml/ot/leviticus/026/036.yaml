id: LEV.26.36
reference: Leviticus 26:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֔ם וְ/הֵבֵ֤אתִי מֹ֨רֶךְ֙ בִּ/לְבָבָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/הֶ֑ם וְ/רָדַ֣ף אֹתָ֗/ם ק֚וֹל עָלֶ֣ה נִדָּ֔ף וְ/נָס֧וּ מְנֻֽסַת חֶ֛רֶב וְ/נָפְל֖וּ וְ/אֵ֥ין רֹדֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: ml
  text: ശത്രുക്കളുടെ ദേശങ്ങളിൽ കഴിയുന്ന നിങ്ങളിൽ ശേഷിക്കുന്നവരുടെ ഹൃദയങ്ങളിൽ ഞാൻ ധൈര്യക്ഷയം വരുത്തും. കാറ്റിൽ പറന്നുപോകുന്ന ഒരു ഇലയുടെ ശബ്ദം[a] അവരെ പിന്തുടരും; വാളിൽനിന്ന് ഓടുന്നതുപോലെ അവർ ഓടും; പിന്തുടരാൻ ആരുമില്ലെങ്കിലും അവർ വീഴും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഓടിക്കപ്പെടുന്ന ഒരു ഇലയുടെ ശബ്ദം.’'
    reason: നിദ്ദാഫ് എന്ന ഹീബ്രായ പദം ഇല ഓടിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനെ ഓടിക്കുന്ന കാരണമായി കാറ്റിനെ മൂലപാഠം നേരിട്ട് പറയുന്നില്ല.
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: നിങ്ങളിൽ ശേഷിക്കുന്നവർ
  rationale: വിധിക്കുശേഷം ഇസ്രായേലിൽ ശേഷിച്ചവരെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; בכם നൽകുന്ന നേരിട്ടുള്ള അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: מֹרֶךְ
  choice: ഭീരുത്വം
  rationale: വെറും ഭയത്തേക്കാൾ ധൈര്യം തകരുന്ന ആന്തരിക അവസ്ഥയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ മലയാളപദം തെരഞ്ഞെടുത്തു.
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: അവരുടെ ശത്രുക്കളുടെ ദേശങ്ങളിൽവെച്ച്
  rationale: ഹീബ്രായയിലെ ബഹുവചനമായ ‘ദേശങ്ങൾ’ നിലനിർത്തുകയും പ്രവാസത്തിന്റെ പശ്ചാത്തലം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: קוֹל עָלֶה נִדָּף
  choice: കാറ്റിൽ പറക്കുന്ന ഒരു ഇലയുടെ ശബ്ദം
  rationale: נדף എന്നതിന്റെ കാറ്റിനാൽ ഓടിക്കപ്പെടുന്ന/പറക്കുന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കാറ്റ് മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥപരമായ പകരം നൽകുന്നു.
- source_word: מְנֻסַת חֶרֶב
  choice: വാളിൽനിന്ന് ഓടുന്നതുപോലെ
  rationale: വാളിന്റെ മുമ്പിൽനിന്നുള്ള പരിഭ്രാന്തമായ പലായനത്തെ സൂചിപ്പിക്കുന്ന രീതിവാചകം മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: ആരും പിന്തുടരാതിരിക്കുമ്പോഴും അവർ വീഴും
  rationale: യഥാർത്ഥ പിന്തുടരുന്നവൻ ഇല്ലെന്ന പരിഹാസാത്മക വൈരുധ്യം ‘എങ്കിലും’ എന്ന ഭാവത്തോടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘വീഴും’ എന്നതിലെ വീഴ്ചയോ തകർച്ചയോ എന്ന അവ്യക്തത പരിഹരിക്കുന്നില്ല.
theological_decisions:
- issue: വിധിയുടെ സ്വഭാവം
  choice: പ്രവാസത്തിൽ ദൈവം വരുത്തുന്ന ആന്തരിക ഭീരുത്വവും പരിഭ്രാന്തിയും
  alternative: വെറും ബാഹ്യ സൈനിക പിന്തുടരൽ
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനം ഹൃദയങ്ങളിലാണ് സംഭവിക്കുന്നതെന്ന് മൂലപാഠം പറയുന്നു; നിസ്സാരമായ ഇലശബ്ദംപോലും പിന്തുടരുന്നതായി അനുഭവപ്പെടുന്നത് അകാരണമായ പരിഭ്രാന്തി പ്രകടമാക്കുന്നു. ഈ രണ്ട് ഘടകങ്ങളും അധിക സിദ്ധാന്തഭാഷയില്ലാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ലേവ്യപുസ്തകത്തിലെ വിധിപ്രഖ്യാപനത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനവും വാക്യത്തിലെ വർധിച്ചുവരുന്ന പരിഭ്രാന്തിയും സംരക്ഷിച്ചു.
