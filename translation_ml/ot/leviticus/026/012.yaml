id: LEV.26.12
reference: Leviticus 26:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִתְהַלַּכְתִּי֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וְ/אַתֶּ֖ם תִּהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളുടെ ഇടയിൽ നടക്കും; ഞാൻ നിങ്ങളുടെ ദൈവമായിരിക്കും, നിങ്ങൾ എന്റെ ജനമായിരിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: ഞാൻ നടക്കും
  rationale: הלך എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം ഇവിടെ ജനത്തിന്റെ മധ്യേ ദൈവം സഞ്ചരിക്കുന്നതും സന്നിഹിതനായിരിക്കുന്നതുമായ ദൃശ്യബിംബം നൽകുന്നു. ‘വസിക്കും’ എന്നു വിവർത്തനം ചെയ്യുന്നത് ക്രിയയുടെ നേരിട്ടുള്ള അർഥത്തെക്കാൾ കൂടുതലായി വ്യാഖ്യാനിക്കും.
- source_word: בְּתוֹכְכֶם
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: ഈ പ്രയോഗത്തിന്റെ അർഥം ‘നിങ്ങളുടെ മധ്യേ’ എന്നാണ്. ‘നിങ്ങളുടെ ഇടയിൽ’ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സമൂഹമധ്യേയുള്ള സാന്നിധ്യം വ്യക്തമാക്കുന്നു; ‘നിങ്ങളുടെ ഉള്ളിൽ’ എന്നത് ആന്തരിക വാസത്തെ തെറ്റായി സൂചിപ്പിക്കാം.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: ഞാൻ നിങ്ങളുടെ ദൈവമായിരിക്കും
  rationale: היה + ל എന്ന ഘടനയിലുള്ള പതിവ് ഉടമ്പടി സൂത്രവാക്യമാണിത്. മലയാളത്തിലെ സ്വാഭാവികമായ ഉടമസ്ഥബന്ധപ്രയോഗം അതിന്റെ ബന്ധപരമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: לֵאלֹהִים
  choice: ദൈവം
  rationale: ഇസ്രായേലുമായുള്ള ഉടമ്പടിയുടെ സന്ദർഭത്തിൽ אֱלֹהִים ഏക സത്യദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അനിശ്ചിതമായ ‘ഒരു ദൈവം’ എന്നല്ല.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: നിങ്ങൾ എന്റെ ജനമായിരിക്കും
  rationale: ഇതും പതിവ് ഉടമ്പടി സൂത്രവാക്യമാണ്. ‘എനിക്ക് ഒരു ജനമായിരിക്കും’ എന്ന വാക്കുപ്രതി രൂപത്തെക്കാൾ ‘എന്റെ ജനം’ ബന്ധത്തിന്റെ അർഥം സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടി സൂത്രവാക്യത്തിന്റെ വിവർത്തനം
  choice: ‘ഞാൻ നിങ്ങളുടെ ദൈവമായിരിക്കും, നിങ്ങൾ എന്റെ ജനമായിരിക്കും’ എന്ന പരസ്പരബന്ധമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘ഞാൻ നിങ്ങൾക്കു ദൈവമായിരിക്കും, നിങ്ങൾ എനിക്കു ജനമായിരിക്കും.’
  rationale: എബ്രായത്തിലെ സ്ഥാപിതമായ ഉടമ്പടി ഭാഷയുടെ പരസ്പരവും ബന്ധപരവുമായ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിങ്ങളുടെ ഇടയിൽ നടക്കും’ എന്ന മൂർത്തമായ ദൈവസാന്നിധ്യബിംബം സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് പാഠത്തിലെ [a] അടയാളം വാക്യത്തിലെ ‘God’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് ‘walk among you’ എന്ന പ്രയോഗത്തിനുള്ള പദവികൽപമായിരുന്നു; മലയാളത്തിൽ ‘നിങ്ങളുടെ ഇടയിൽ’ നേരിട്ടും സ്വാഭാവികമായും ഉറവിടാർഥം നൽകുന്നതിനാൽ അനാവശ്യമായ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
