id: LEV.26.31
reference: Leviticus 26:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת עָֽרֵי/כֶם֙ חָרְבָּ֔ה וַ/הֲשִׁמּוֹתִ֖י אֶת מִקְדְּשֵׁי/כֶ֑ם וְ/לֹ֣א אָרִ֔יחַ בְּ/רֵ֖יחַ נִיחֹֽחֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: ml
  text: നിങ്ങളുടെ പട്ടണങ്ങളെ ഞാൻ പാഴിടങ്ങളാക്കും; നിങ്ങളുടെ വിശുദ്ധസ്ഥാനങ്ങളെ തകർത്തു വിജനമാക്കും; നിങ്ങളുടെ യാഗങ്ങളുടെ പ്രസാദകരമായ സൗരഭ്യം ഞാൻ മണക്കുകയുമില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായഭാഷയിൽ അക്ഷരാർഥം: ‘നിങ്ങളുടെ പ്രസാദകരമായ സൗരഭ്യം ഞാൻ മണക്കുകയില്ല.’ ഇത് യാഗങ്ങൾ ദൈവത്തിന് സ്വീകാര്യമാകുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണ്; വ്യക്തതയ്ക്കായി ‘യാഗങ്ങളുടെ’ എന്നു പാഠത്തിൽ ചേർത്തിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי ... חָרְבָּה
  choice: പാഴിടങ്ങളാക്കും
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കൊടുക്കുക/വെക്കുക’ എന്നാണെങ്കിലും, ‘പട്ടണങ്ങൾ’ എന്ന കർമത്തോടും חָרְבָּה എന്ന വിധേയനാമത്തോടും ചേർന്ന ഇവിടെ ‘പാഴിടങ്ങളാക്കുക’ എന്ന കാരണാർഥമാണ് സ്വാഭാവികം.
- source_word: עָרֵיכֶם
  choice: നിങ്ങളുടെ പട്ടണങ്ങളെ
  rationale: עיר നഗരം അല്ലെങ്കിൽ പട്ടണം എന്നർഥം വഹിക്കാം. വ്യത്യസ്ത വലുപ്പമുള്ള ജനവാസകേന്ദ്രങ്ങളെ ഉൾക്കൊള്ളാൻ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമായ പൊതുപദമാണ്.
- source_word: וַהֲשִׁמּוֹתִי
  choice: ശൂന്യമാക്കും
  rationale: שמם എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഒന്നിനെ വിജനമോ നശിച്ചതോ ആക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ശൂന്യമാക്കും’ അതിന്റെ കാരണാർഥവും ഭീഷണിയുടെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: מִקְדְּשֵׁיכֶם
  choice: നിങ്ങളുടെ വിശുദ്ധസ്ഥാനങ്ങളെ
  rationale: מקדש എന്ന പദത്തിന്റെ ബഹുവചനം ആരാധനയ്ക്കായി വേർതിരിച്ച വിശുദ്ധ ഇടങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ബഹുവചനം നിലനിർത്തുകയും ദേവാലയം എന്ന ഏകസ്ഥാപനത്തിലേക്ക് അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְלֹא אָרִיחַ
  choice: ഞാൻ മണക്കുകയുമില്ല
  rationale: ריח എന്ന ക്രിയ ഇവിടെ അക്ഷരാർഥത്തിൽ ‘മണക്കുക’ എന്നാണ്. യാഗങ്ങൾ സ്വീകരിക്കാതിരിക്കുന്നതെന്ന സൂചന ഉണ്ടെങ്കിലും, മൂലപാഠത്തിലെ മാനുഷിക ഇന്ദ്രിയരൂപകം മാറ്റാതെ സൂക്ഷിച്ചു.
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: നിങ്ങളുടെ യാഗങ്ങളുടെ പ്രസാദകരമായ സൗരഭ്യം
  rationale: ריח ניחח യാഗസന്ദർഭത്തിലെ പതിവുശൈലിയാണ്. ‘നിങ്ങളുടെ സൗരഭ്യം’ എന്നു മാത്രം പറഞ്ഞാൽ ജനങ്ങളുടെ ശരീരഗന്ധമെന്ന തെറ്റിദ്ധാരണയ്ക്കിടയുള്ളതിനാൽ, സന്ദർഭത്തിൽ അന്തർലീനമായ ‘യാഗങ്ങളുടെ’ എന്ന് വ്യക്തതയ്ക്കായി ചേർത്തു.
theological_decisions:
- issue: അവസാന വാക്യഭാഗം ഇന്ദ്രിയരൂപകത്തോടെ തന്നെയോ, യാഗനിരസനത്തിന്റെ വ്യാഖ്യാനമായി തന്നെയോ പരിഭാഷപ്പെടുത്തുക
  choice: ‘നിങ്ങളുടെ യാഗങ്ങളുടെ പ്രസാദകരമായ സൗരഭ്യം ഞാൻ മണക്കുകയുമില്ല’ എന്ന മൂലരൂപകം നിലനിർത്തി
  alternative: ‘നിങ്ങളുടെ യാഗങ്ങൾ ഞാൻ സ്വീകരിക്കുകയില്ല’
  rationale: എബ്രായപാഠം ‘മണക്കുക’ എന്ന ക്രിയയും യാഗങ്ങളോടു ബന്ധപ്പെട്ട ‘പ്രസാദകരമായ സൗരഭ്യം’ എന്ന പ്രയോഗവും വ്യക്തമായി ഉപയോഗിക്കുന്നു. അതിനെ ‘സ്വീകരിക്കുക’ എന്നു മാറ്റുന്നത് സൂചിതമായ ദൈവശാസ്ത്രാർഥത്തെ നേരിട്ടുള്ള പ്രസ്താവനയാക്കി മൂലപാഠത്തിലെ രൂപകവും സംഘർഷവും ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. സമാന്തരമായ മൂന്ന് ഭാവികാല വാക്യഭാഗങ്ങളും മൂലപാഠത്തിലെ ബഹുവചനങ്ങളും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അത് വിശദീകരിക്കുന്ന അവസാന വാക്യഭാഗത്തോടു ചേർത്തു.
