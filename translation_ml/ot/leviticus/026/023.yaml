source:
  edition: WLC
  text: וְ/אִ֨ם בְּ/אֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: ml
  text: ഈ കാര്യങ്ങളാൽ നിങ്ങൾ എന്റെ ശിക്ഷണം സ്വീകരിക്കാതെയും എന്നോടു ശത്രുതയോടെ നടക്കുകയും ചെയ്താൽ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്നോടു ശത്രുതയോടെ’—ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘എന്നോടുകൂടെ വിരോധഭാവത്തിൽ’ എന്ന ഇടിയമാണ്. ‘എനിക്കു വിരോധമായി’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘എന്റെ ശിക്ഷണം സ്വീകരിക്കാതെയും’ എന്നതിൽ ഹീബ്രു ക്രിയ നിഷ്ക്രിയരൂപത്തിലാണ്; ‘എന്നിൽനിന്നു തിരുത്തപ്പെടാതെയും’ എന്ന അർഥവും സാധ്യമാണ്.
    reason: עִמִּי קֶרִי എന്ന ഇടിയത്തിന്റെയും תִוָּסְרוּ לִי എന്ന നിഷ്ക്രിയ പ്രയോഗത്തിന്റെയും ഭാഷാപരമായ സൂക്ഷ്മതയും ശേഷിക്കുന്ന അസ്പഷ്ടതയും രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: ഇവയൊക്കെ ഉണ്ടായിട്ടും
  rationale: בְּ എന്ന ഉപസർഗം മുമ്പ് വിവരിച്ച ശിക്ഷാവിധികളെ സൂചിപ്പിക്കുന്നു. ഇവിടെ നിബന്ധനയ്ക്കുള്ളിൽ ശക്തമായ concessive ഭാവമുള്ളതിനാൽ, ‘ഇവയാൽ’ എന്ന യാന്ത്രിക രൂപത്തേക്കാൾ സ്വാഭാവികമായി മുൻവിധികളുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: תִוָּסְרוּ
  choice: ശിക്ഷണം സ്വീകരിക്കാതെ
  rationale: יסר എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ശിക്ഷണത്തിലൂടെ തിരുത്തപ്പെടുക എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ കർത്തൃവാചകസദൃശമായ ഈ പ്രയോഗം മുൻ ശിക്ഷകൾ ഫലിച്ചില്ലെന്ന അർഥം വ്യക്തമാക്കുന്നു; ശിക്ഷ സംഭവിച്ചില്ലെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: לִי
  choice: എന്റെ
  rationale: ഇവിടെ ദൈവത്തോടുള്ള ബന്ധത്തിൽ അവനിൽനിന്നുള്ള ശിക്ഷണം സ്വീകരിച്ച് വഴങ്ങുക എന്ന ഇടിയോമാറ്റിക് ആശയമാണ്. ‘എനിക്കായി’ എന്ന അക്ഷരാർഥരൂപം മലയാളത്തിൽ ആശയക്കുഴപ്പമുണ്ടാക്കുന്നതിനാൽ ‘എന്റെ ശിക്ഷണം’ എന്നു ചേർത്തു.
- source_word: וַהֲלַכְתֶּם
  choice: നടന്നാൽ
  rationale: നടക്കുക എന്നത് ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം നിലനിർത്തുന്നു. തുടർന്നുവരുന്ന വാക്യത്തിന്റെ നിബന്ധനാഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: עִמִּי קֶרִי
  choice: എന്നോടു ശത്രുതയോടെ
  rationale: עִמִּי എന്നത് അക്ഷരാർഥത്തിൽ ‘എന്നോടുകൂടെ’ എന്നും അപൂർവമായ קֶרִי വിരോധം/ശത്രുതാപരമായ നിലപാട് എന്നും സൂചിപ്പിക്കുന്നു. ചേർന്നുള്ള ഇടിയത്തിന്റെ ബന്ധപരമായ വൈരഭാവം ഈ രൂപം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: עִמִּי קֶרִי എന്ന ഉടമ്പടി-ബന്ധ ഇടിയത്തിന്റെ അർഥം
  choice: എന്നോടു ശത്രുതയോടെ നടന്നാൽ
  alternative: എനിക്കു വിരോധമായി നടന്നാൽ
  rationale: ദൈവത്തോടുള്ള കേവല അനുസരണക്കേടിനെക്കാൾ ബന്ധപരമായ എതിർപ്പും വൈരനിലപാടും ഹീബ്രു പ്രയോഗത്തിൽ അടങ്ങിയിരിക്കുന്നു. ‘ശത്രുതയോടെ’ അത് വ്യക്തമാക്കുന്നു; അതേസമയം പാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: תִוָּסְרוּ לִי എന്ന പ്രയോഗത്തിലെ പ്രവർത്തകന്റെയും പ്രതികരണത്തിന്റെയും ബന്ധം
  choice: എന്റെ ശിക്ഷണം സ്വീകരിക്കാതെ
  alternative: എന്നാൽ തിരുത്തപ്പെടാതെ / എനിക്കു വഴങ്ങുന്നവിധം തിരുത്തപ്പെടാതെ
  rationale: ഹീബ്രുവിലെ לִי ദൈവത്തോടുള്ള ശരിയായ പ്രതികരണത്തെയും സൂചിപ്പിക്കാം; ക്രിയ നിഷ്ക്രിയരൂപത്തിലാണ്. മലയാളപരിഭാഷ ശിക്ഷണത്തിന്റെ ഉറവിടവും അത് സ്വീകരിക്കാതിരിക്കുന്ന പ്രതികരണവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു, എന്നാൽ ലഘുവായ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നടക്കുക’ എന്ന ബൈബിൾസവിശേഷമായ ജീവിതരീതി-രൂപകം നിലനിർത്തിയിട്ടുണ്ട്. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന നിബന്ധനയായതിനാൽ അവസാനം അർധവിരാമമോ പൂർണ്ണവിരാമമോ നൽകാതെ കോമ ഉപയോഗിച്ചു.
