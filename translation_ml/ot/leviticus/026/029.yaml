  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֖ם בְּשַׂ֣ר בְּנֵי/כֶ֑ם וּ/בְשַׂ֥ר בְּנֹתֵי/כֶ֖ם תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/029.yaml
  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: ml
  text: നിങ്ങൾ നിങ്ങളുടെ പുത്രന്മാരുടെ മാംസം തിന്നും; നിങ്ങളുടെ പുത്രിമാരുടെ മാംസവും നിങ്ങൾ തിന്നും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: നിങ്ങൾ ... തിന്നും
  rationale: אכל എന്ന ധാതുവിന്റെ ഖാൽ രൂപം, രണ്ടാം പുരുഷ ബഹുവചനം. ഉടമ്പടിശാപങ്ങളുടെ ഈ സന്ദർഭത്തിൽ പ്രവചനാത്മകമായ ഭാവി അർഥം സ്വാഭാവികമായി നൽകുന്നു; വാവ് ബന്ധകത്തിന്റെ തുടർച്ച വാക്യഘടനയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: בְּשַׂר
  choice: മാംസം
  rationale: בָּשָׂר എന്നത് ഇവിടെ ശരീരത്തിലെ മാംസത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മാംസം’ ഭീകരമായ നരഭോജനാർത്ഥം മയപ്പെടുത്താതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְּנֵיכֶם
  choice: നിങ്ങളുടെ പുത്രന്മാരുടെ
  rationale: അടുത്ത ഭാഗത്ത് പുത്രിമാരെ പ്രത്യേകം പറയുന്നതിനാൽ, പുരുഷലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ പൊതുവായ ‘മക്കൾ’ എന്നാക്കി മാറ്റാതെ സൂക്ഷിക്കുന്നു.
- source_word: וּבְשַׂר
  choice: മാംസവും
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ച നാമം നിലനിർത്തി സമാന്തര ഘടനയും ഭീകരമായ ഊന്നലും സംരക്ഷിക്കുന്നു; וּ ബന്ധകത്തെ ‘-വും’ കൊണ്ട് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנֹתֵיכֶם
  choice: നിങ്ങളുടെ പുത്രിമാരുടെ
  rationale: പുത്രന്മാർ–പുത്രിമാർ എന്ന മൂലഭാഷയിലെ വ്യക്തമായ ജോടി അതേപടി നിലനിർത്തുന്നു.
- source_word: תֹּאכֵלוּ
  choice: നിങ്ങൾ തിന്നും
  rationale: രണ്ടാമത്തെ ക്രിയയും മൂലപാഠത്തിൽ ആവർത്തിക്കുന്നതിനാൽ മലയാളത്തിലും ഒഴിവാക്കാതെ നൽകി മുന്നറിയിപ്പിന്റെ ഊന്നലും സമാന്തരതയും കാക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിശാപത്തിലെ നരഭോജന മുന്നറിയിപ്പ് എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ‘നിങ്ങൾ നിങ്ങളുടെ പുത്രന്മാരുടെ മാംസം തിന്നും ... പുത്രിമാരുടെ മാംസവും നിങ്ങൾ തിന്നും’ എന്ന നേരിട്ടുള്ള പ്രവചനാത്മക പ്രസ്താവന
  alternative: അർഥത്തിന്റെ ഭീകരത കുറയ്ക്കുന്ന മൃദുവായ പ്രയോഗം
  rationale: ഇത് ഉടമ്പടിശാപത്തിന്റെ അക്ഷരാർഥത്തിലുള്ള ഭീകര മുന്നറിയിപ്പാണ്. അധികമായ ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കാതെയും അർഥം മയപ്പെടുത്താതെയും നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘തിന്നും’ എന്ന സ്വാഭാവിക ക്രിയ ഉപയോഗിച്ചു; ‘ഭക്ഷിക്കും’ എന്നത് ഈ സന്ദർഭത്തിലെ ഞെട്ടിപ്പിക്കുന്ന നേരിട്ടുള്ള ഭാവം കുറയ്ക്കാനിടയുള്ളതിനാൽ ഒഴിവാക്കി. മൂലപാഠത്തിലെ പുത്രന്മാർ–പുത്രിമാർ എന്ന സമാന്തരതയും ക്രിയയുടെ ആവർത്തനവും സംരക്ഷിച്ചു.
