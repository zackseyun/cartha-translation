  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളുടെ നേരെ ഉടമ്പടിയുടെ പ്രതികാരം നടപ്പാക്കുന്ന വാൾ വരുത്തും[a]. നിങ്ങൾ നിങ്ങളുടെ പട്ടണങ്ങളിലേക്കു ഒന്നിച്ചുകൂടും. അപ്പോൾ ഞാൻ നിങ്ങളുടെ ഇടയിൽ മഹാമാരി അയക്കും; നിങ്ങൾ ശത്രുവിന്റെ കയ്യിൽ ഏൽപ്പിക്കപ്പെടും.
