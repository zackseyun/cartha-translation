  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. 'മഹാമാരി', 'ഏല്പിക്കപ്പെടും' എന്നിവ ഗൗരവമുള്ള ബൈബിൾ ശൈലി നിലനിർത്തുമ്പോഴും അതിപുരാതന പ്രയോഗങ്ങൾ ഒഴിവാക്കുന്നു.
