theological_decisions:
- issue: ‘ഉടമ്പടിയുടെ പ്രതികാരം’ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: ഉടമ്പടിയുമായി ബന്ധപ്പെട്ട ദൈവിക ന്യായവിധി എന്ന ബന്ധം വിവർത്തനത്തിൽ അതേപടി നിലനിർത്തി.
  alternative: ‘ഉടമ്പടി ലംഘിച്ചതിനുള്ള പ്രതികാരം’ അല്ലെങ്കിൽ ‘ഉടമ്പടിക്കുവേണ്ടിയുള്ള പ്രതികാരം’ എന്നു വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക.
  rationale: എബ്രായ ഘടന പ്രതികാരം ഉടമ്പടിയുടെ അടിസ്ഥാനത്തിലാണോ, അതിന്റെ ഉപരോധശിക്ഷകളാണോ, അതിനുവേണ്ടിയാണോ എന്ന അടുത്ത ബന്ധമുള്ള സൂക്ഷ്മതകൾ അനുവദിക്കുന്നു. അവയിൽ ഒന്ന് മാത്രം ഉറപ്പിക്കാതെ യഥാർത്ഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
