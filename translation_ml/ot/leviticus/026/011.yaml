id: LEV.26.11
reference: Leviticus 26:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י מִשְׁכָּנִ֖/י בְּ/תוֹכְ/כֶ֑ם וְ/לֹֽא תִגְעַ֥ל נַפְשִׁ֖/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/011.yaml
  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: ml
  text: ഞാൻ എന്റെ വാസസ്ഥലം നിങ്ങളുടെ മധ്യേ സ്ഥാപിക്കും; എന്റെ ഉള്ളം നിങ്ങളെ വെറുക്കുകയുമില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: എന്റെ വാസസ്ഥലം
  rationale: מִשְׁכָּן എന്നത് ദൈവത്തിന്റെ വാസസ്ഥലത്തെയോ തിരുനിവാസത്തെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ ഉടമ്പടി അനുഗ്രഹത്തിന്റെ പൊതുവായ പ്രസ്താവനയായതിനാൽ സ്വാഭാവികവും അർത്ഥവ്യാപ്തിയുള്ളതുമായ ‘വാസസ്ഥലം’ തെരഞ്ഞെടുത്തു.
- source_word: בְּתוֹכְכֶם
  choice: നിങ്ങളുടെ മധ്യേ
  rationale: ഇസ്രായേൽജനത്തിന്റെ നടുവിലുള്ള ദൈവസാന്നിധ്യം എന്ന സ്ഥലപരവും ബന്ധപരവുമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: נַפְשִׁי
  choice: എന്റെ ഉള്ളം
  rationale: അക്ഷരാർഥത്തിലെ ‘എന്റെ പ്രാണൻ’ മലയാളത്തിൽ അസ്വാഭാവികമാണ്; ദൈവത്തിന്റെ വ്യക്തിപരമായ സ്വയംസൂചന നിലനിർത്താൻ ‘എന്റെ ഉള്ളം’ ഉപയോഗിച്ചു, അതിനെ വെറും ‘ഞാൻ’ എന്നു ലഘൂകരിച്ചില്ല.
- source_word: תִגְעַל
  choice: വെറുക്കുക
  rationale: געל എന്ന ക്രിയയിലെ ശക്തമായ നിരസിക്കൽ, അറപ്പ്, തള്ളിക്കളയൽ എന്നീ ഭാവങ്ങളിൽ ഇവിടെ സ്വാഭാവികമായി യോജിക്കുന്ന ‘വെറുക്കുക’ തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ദൈവത്തെക്കുറിച്ചുള്ള נֶפֶשׁ എന്ന മാനവസാദൃശ്യ ഭാഷ
  choice: ‘എന്റെ ഉള്ളം’ എന്ന് വ്യക്തമായി നിലനിർത്തി
  alternative: ‘ഞാൻ നിങ്ങളെ വെറുക്കുകയില്ല’
  rationale: മൂലപാഠത്തിലെ נַפְשִׁי എന്ന പദം ഒഴിവാക്കാതെ അതിന്റെ ശക്തിയും വ്യക്തിപരമായ ഭാവവും സംരക്ഷിച്ചു; അതേസമയം ‘എന്റെ പ്രാണൻ’ എന്ന അസ്വാഭാവിക മലയാളം ഒഴിവാക്കി.
- issue: מִשְׁכָּן എന്നതിന്റെ സ്ഥാപനപരമായ അർത്ഥം
  choice: വാസസ്ഥലം
  alternative: തിരുനിവാസം / സമാഗമകൂടാരം
  rationale: വാക്യം ദൈവം ജനമധ്യേ വസിക്കുന്നതിനെ മുൻനിർത്തുന്നു. ഒരു പ്രത്യേക നിർമ്മിതിയെന്ന വ്യാഖ്യാനം നിർബന്ധിക്കാതെ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു വാക്യത്തിലെ രണ്ട് സമാന്തര പ്രസ്താവനകളും സംരക്ഷിച്ചു; ആവശ്യമില്ലാത്ത വ്യാഖ്യാനപദങ്ങൾ ചേർത്തിട്ടില്ല.
