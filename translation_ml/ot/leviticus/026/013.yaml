- from: നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ഞാൻ ആകുന്നു. ഈജിപ്ത്‌ദേശത്ത് അവരുടെ അടിമകളായിരുന്നതിൽനിന്ന് നിങ്ങളെ പുറത്തുകൊണ്ടുവന്നത് ഞാനാണ്. നിങ്ങളുടെ നുകത്തിന്റെ തണ്ടുകൾ ഞാൻ ഒടിച്ചു; നിങ്ങളെ നിവർന്നുനടക്കുമാറാക്കി.[a]
  to: നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ഞാൻ ആകുന്നു; ഈജിപ്ത്‌ദേശത്തുനിന്ന്, അവരുടെ അടിമകളായിരുന്നതിൽനിന്ന്, നിങ്ങളെ പുറത്തുകൊണ്ടുവന്നവൻ ഞാൻ ആകുന്നു. നിങ്ങളുടെ നുകത്തിന്റെ തണ്ടുകൾ ഞാൻ ഒടിച്ചു; നിങ്ങളെ നിവർന്നു നടക്കുമാറാക്കി.[a]
  rationale: «ഈജിപ്ത്‌ദേശത്ത്» എന്ന സ്ഥാനസൂചനയെ «ഈജിപ്ത്‌ദേശത്തുനിന്ന്» എന്ന പുറപ്പാടുസൂചനയായി തിരുത്തി. ഇതിലൂടെ מֵאֶרֶץ മִצְרַיִם എന്ന എബ്രായപ്രയോഗത്തിന്റെ ദിശയും ഹോത്സിയ്തീ (“പുറത്തുകൊണ്ടുവന്നു”) എന്ന ക്രിയയുടെ അർത്ഥവും കൃത്യമായി പ്രതിഫലിക്കുന്നു. മറ്റെല്ലാ പ്രധാന പദങ്ങളും ചിത്രകങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
