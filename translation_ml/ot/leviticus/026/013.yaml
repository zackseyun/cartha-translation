  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ഞാൻ ആകുന്നു; ഈജിപ്ത്‌ദേശത്തുനിന്ന്, അവരുടെ അടിമകളായിരുന്നതിൽനിന്ന്, നിങ്ങളെ പുറത്തുകൊണ്ടുവന്നവൻ ഞാൻ ആകുന്നു. നിങ്ങളുടെ നുകത്തിന്റെ തണ്ടുകൾ ഞാൻ ഒടിച്ചു; നിങ്ങളെ നിവർന്നു നടക്കുമാറാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളെ തലയുയർത്തി നടക്കുമാറാക്കി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: യഹ്‌വേയോടുള്ള ഏകവചനസൂചനയുള്ള ഉടമ്പടിസൂത്രത്തിൽ ഈ രൂപം ഏകവചനമായ ‘ദൈവം’ എന്നാണ്.
- source_word: הוֹצֵאתִי ... מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്ത്‌ദേശത്ത് ... നിങ്ങളെ പുറത്തുകൊണ്ടുവന്നത്
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർത്ഥവും പുറപ്പാടിന്റെ ചലനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִהְיוֹת לָהֶם עֲבָדִים
  choice: അവരുടെ അടിമകളായിരുന്നതിൽനിന്ന്
  rationale: ഈജിപ്തിലെ പീഡനപരമായ ബന്ധനാവസ്ഥയെ മൃദൂകരിക്കാതെ ‘അടിമകൾ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: מֹטֹת עֻלְּכֶם
  choice: നിങ്ങളുടെ നുകത്തിന്റെ തണ്ടുകൾ
  rationale: നുകത്തിന്റെ മോട്ടോത് എന്ന മൂർത്തമായ ബന്ധനചിത്രം ‘തണ്ടുകൾ’ എന്ന പദം സംരക്ഷിക്കുന്നു.
- source_word: וָאוֹלֵךְ אֶתְכֶם
  choice: നിങ്ങളെ ... നടക്കുമാറാക്കി
  rationale: הלך എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണാർത്ഥം നിലനിർത്തുന്നു.
- source_word: קוֹמְמִיּוּת
  choice: നിവർന്ന്
  rationale: അടിമത്തത്തിനു വിപരീതമായ ശരീരനിലയും വീണ്ടെടുത്ത മാന്യതയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ഈജിപ്തിലെ ഇസ്രായേലിന്റെ നില
  choice: അടിമകൾ
  alternative: ദാസന്മാർ
  rationale: സന്ദർഭം പീഡനപരമായ ബന്ധനത്തിൽനിന്നുള്ള വിടുതലിനെ ഊന്നുന്നതിനാൽ, ആ നിലയെ മൃദൂകരിക്കാതെ വ്യക്തമാക്കുന്നു.
- issue: അവസാനത്തെ വിമോചനചിത്രം
  choice: നിങ്ങളെ നിവർന്നുനടക്കുമാറാക്കി
  alternative: നിങ്ങളെ തലയുയർത്തി നടക്കുമാറാക്കി
  rationale: എബ്രായത്തിലെ കാരണാർത്ഥചലനവും നിവർന്ന ശരീരനിലയും സംരക്ഷിക്കുന്നു; ‘തലയുയർത്തി’ എന്നത് മാന്യതയുടെ ആശയം കൂടുതൽ തുറന്നുപറയുന്ന വ്യാഖ്യാനാത്മക പരിഭാഷയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യഹ്‌വേ’ എന്ന വ്യക്തിനാമവും ‘അടിമകൾ’ എന്ന ബന്ധനസൂചനയും വ്യക്തമായി നിലനിർത്തി; അവസാനപ്രയോഗത്തിലെ ശരീരനിലയും മാന്യതയും സംബന്ധിച്ച അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
