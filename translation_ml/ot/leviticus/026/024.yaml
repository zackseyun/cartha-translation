source:
  edition: WLC
  text: וְ/הָלַכְתִּ֧י אַף אֲנִ֛י עִמָּ/כֶ֖ם בְּ/קֶ֑רִי וְ/הִכֵּיתִ֤י אֶתְ/כֶם֙ גַּם אָ֔נִי שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/024.yaml
  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: ml
  text: അപ്പോൾ ഞാനും നിങ്ങളോടു വിരോധമായി നടക്കും[a]; നിങ്ങളുടെ പാപങ്ങൾ നിമിത്തം ഞാൻ തന്നെ നിങ്ങളെ ഏഴിരട്ടിയായി[b] പ്രഹരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശത്രുതയോടെ” / “എതിർപ്പോടെ.” ഇവിടെ “വിരോധമായി” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം ലേവ്യപുസ്തകം 26-ൽ ആവർത്തിക്കുന്ന ഒരു മുഖ്യപദമാണ്; ഇസ്രായേലും യഹോവയും പരസ്പരം എതിർക്കുന്നതിനെ അത് വിവരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങളുടെ പാപങ്ങൾ നിമിത്തം ഏഴു പ്രാവശ്യം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: അപ്പോൾ ... നടക്കും
  rationale: הלך എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘നടക്കുക’ നിലനിർത്തുന്നു. ലേവ്യപുസ്തകം 26-ൽ ആവർത്തിക്കുന്ന ഉടമ്പടി-വിധിയുടെ രൂപകം സംരക്ഷിക്കാനായി ‘പ്രവർത്തിക്കും’ എന്ന പരാവർത്തനം ഒഴിവാക്കി. וְ എന്ന ബന്ധകത്തെ മുന്നറിയിപ്പുകളുടെ തുടർച്ച വ്യക്തമാക്കുന്ന വിധത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: אַף אֲנִי
  choice: ഞാനും
  rationale: ഇസ്രായേലിന്റെ എതിർപ്പിന് ദൈവം തന്റെ ഭാഗത്തുനിന്നും പ്രതികരിക്കുന്നു എന്ന പരസ്പരതയും ഊന്നലും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עִמָּכֶם
  choice: നിങ്ങളോടു
  rationale: പദശഃ ‘നിങ്ങളോടുകൂടെ’ എന്നാണെങ്കിലും, בקרי സൂചിപ്പിക്കുന്ന എതിർപ്പ് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘നിങ്ങളോടു വിരോധമായി’ എന്നു ചേർത്തു.
- source_word: בְּקֶרִי
  choice: വിരോധമായി
  rationale: ലേവ്യപുസ്തകം 26-ൽ ഇസ്രായേലിന്റെയും യഹോവയുടെയും പരസ്പര എതിർനിലപാടിനെ സൂചിപ്പിക്കുന്ന ആവർത്തിത മുഖ്യപദമാണിത്. ‘വിരോധമായി’ എന്നത് ഈ സാഹിത്യബന്ധം നിലനിർത്തുകയും വെറും വികാരപരമായ ശത്രുതയായി അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִכֵּיתִי
  choice: പ്രഹരിക്കും
  rationale: נכה എന്ന ക്രിയയുടെ ശിക്ഷാത്മക ശക്തി നിലനിർത്തുന്ന, ആധുനികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: גַּם אָ֔נִי
  choice: ഞാൻതന്നെ
  rationale: വിധി നേരിട്ട് ദൈവം നടപ്പാക്കുന്നു എന്ന രണ്ടാമത്തെ ഊന്നൽ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שֶׁבַע
  choice: ഏഴിരട്ടിയായി
  rationale: ശിക്ഷയുടെ തീവ്രത സൂചിപ്പിക്കുന്ന ആവർത്തിത സൂത്രവാക്യത്തെ വെറും ഗണിതപരമായ എണ്ണമായി ചുരുക്കാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: നിങ്ങളുടെ പാപങ്ങൾ നിമിത്തം
  rationale: ശിക്ഷയുടെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്ന עַל എന്നതിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവവും ഇസ്രായേലും തമ്മിലുള്ള പരസ്പര എതിർനിലപാട് വിവരിക്കുന്ന בקרי എന്ന ഉടമ്പടി-വിധി പ്രയോഗം
  choice: വിരോധമായി
  alternative: ശത്രുതയോടെ; എതിർപ്പോടെ
  rationale: വാക്യം ഉടമ്പടിലംഘനത്തിനുള്ള പ്രത്യുത്തരവിധിയെ ചിത്രീകരിക്കുന്നു. ‘വിരോധമായി’ എന്നത് പദത്തിന്റെ ആവർത്തിത സാഹിത്യപങ്ക് കാത്തുസൂക്ഷിക്കുകയും അതിനെ ദൈവത്തിന്റെ വികാരപരമായ ശത്രുതയായി മാത്രം വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: שֶׁבַע എന്ന ശിക്ഷാസൂത്രത്തിന്റെ അക്ഷരാർഥത്തിന്റെ അളവ്
  choice: ഏഴിരട്ടിയായി
  alternative: ഏഴു പ്രാവശ്യം
  rationale: മുന്നറിയിപ്പിന്റെ തീവ്രതയും വാചകത്തിന്റെ ആലങ്കാരിക ശക്തിയും സംരക്ഷിക്കുന്നു; അതേസമയം മറ്റൊരു സാദ്ധ്യമായ സംഖ്യാത്മക വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. അധ്യായത്തിൽ ആവർത്തിക്കുന്ന ‘നടക്കുക’ എന്ന രൂപകവും ‘വിരോധമായി’ എന്ന മുഖ്യപദവും സാഹിത്യപരമായ ഏകോപനത്തിനായി ഉദ്ദേശപൂർവം നിലനിർത്തി; ‘ഞാൻതന്നെ’ ദൈവിക പ്രവർത്തനത്തിലെ മൂലപാഠത്തിന്റെ ഊന്നൽ പുനരാവിഷ്കരിക്കുന്നു.
