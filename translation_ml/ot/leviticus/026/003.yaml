id: LEV.26.3
reference: Leviticus 26:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם בְּ/חֻקֹּתַ֖/י תֵּלֵ֑כוּ וְ/אֶת מִצְוֺתַ֣/י תִּשְׁמְר֔וּ וַ/עֲשִׂיתֶ֖ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: ml
  text: നിങ്ങൾ എന്റെ ചട്ടങ്ങൾ അനുസരിച്ച് നടക്കുകയും[a] എന്റെ കല്പനകൾ പാലിച്ച് അവ പ്രാവർത്തികമാക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ ചട്ടങ്ങൾ പിന്തുടരുകയും.’ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘എന്റെ ചട്ടങ്ങളിൽ നടക്കുകയും’ എന്നാണ്; അവയ്ക്കനുസരിച്ച് ഒരാളുടെ ജീവിതം ക്രമപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ചെയ്താൽ
  rationale: വാക്യത്തിന്റെ വ്യവസ്ഥാപരമായ സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ക്രിയാസമുച്ചയത്തിന്റെ അവസാനം ‘ചെയ്താൽ’ ഉപയോഗിച്ചു.
- source_word: בְּחֻקֹּתַי
  choice: എന്റെ ചട്ടങ്ങൾ അനുസരിച്ച്
  rationale: חֻקּוֹת എന്നത് നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ നിശ്ചിത ചട്ടങ്ങളെ സൂചിപ്പിക്കുന്നു; בְ എന്നതിന്റെ അനുസരണാർത്ഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: תֵּלֵכוּ
  choice: നടക്കുകയും
  rationale: הלך എന്ന ക്രിയയുടെ ‘നടക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; ജീവിതക്രമത്തെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִצְוֺתַי
  choice: എന്റെ കല്പനകൾ
  rationale: מִצְוָה എന്നതിന്റെ നിയമപരമായ ‘commandment’ എന്ന അർത്ഥത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: תִּשְׁמְרוּ
  choice: പാലിച്ച്
  rationale: നിയമങ്ങളും കല്പനകളും സംബന്ധിച്ച് שׁמר എന്നത് ‘കാത്തുസൂക്ഷിക്കുക/ആചരിക്കുക’ എന്ന അർത്ഥത്തിലാണ്; ‘പാലിക്കുക’ ആ അനുസരണത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: അവ പ്രാവർത്തികമാക്കുകയും
  rationale: കല്പനകളെ യഥാർത്ഥത്തിൽ ചെയ്യുക എന്ന עשהയുടെ പ്രവർത്തനപരമായ ഊന്നൽ വ്യക്തമായി നൽകുന്നു; മുൻപുള്ള ‘പാലിക്കുക’ എന്നതിൽനിന്നുള്ള വ്യത്യാസവും കാക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിപരമായ അനുസരണത്തിന്റെ രൂപകം
  choice: ‘എന്റെ ചട്ടങ്ങൾ അനുസരിച്ച് നടക്കുക’ എന്ന നടപ്പിന്റെ രൂപകം നിലനിർത്തി.
  alternative: ‘എന്റെ ചട്ടങ്ങൾ പിന്തുടരുക’ അല്ലെങ്കിൽ ‘എന്റെ ചട്ടങ്ങൾക്കനുസരിച്ച് ജീവിക്കുക.’
  rationale: എബ്രായത്തിലെ ‘ചട്ടങ്ങളിൽ നടക്കുക’ എന്ന രൂപകം ജീവിതത്തെ ദൈവത്തിന്റെ ചട്ടങ്ങൾക്കനുസരിച്ച് ക്രമപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അർത്ഥവ്യക്തതയ്ക്കായി ‘അനുസരിച്ച്’ ചേർത്തിട്ടും ‘നടക്കുക’ എന്ന ബൈബിൾരൂപകം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-ഉടമ്പടി ശൈലി. അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന വ്യവസ്ഥാപരമായ ഉപവാക്യമാകുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
