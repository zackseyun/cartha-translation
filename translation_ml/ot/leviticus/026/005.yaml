id: LEV.26.5
reference: Leviticus 26:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִשִּׂ֨יג לָ/כֶ֥ם דַּ֨יִשׁ֙ אֶת בָּצִ֔יר וּ/בָצִ֖יר יַשִּׂ֣יג אֶת זָ֑רַע וַ/אֲכַלְתֶּ֤ם לַחְמְ/כֶם֙ לָ/שֹׂ֔בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: ml
  text: നിങ്ങളുടെ മെതിക്കൽ മുന്തിരിക്കൊയ്ത്തുവരെ എത്തും; മുന്തിരിക്കൊയ്ത്ത് വിതയ്ക്കുന്ന കാലംവരെ എത്തും; നിങ്ങൾ നിങ്ങളുടെ അപ്പം തൃപ്തിവരുവോളം തിന്നുകയും നിങ്ങളുടെ ദേശത്ത് നിർഭയമായി വസിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּיִשׁ
  choice: മെതിക്കൽ
  rationale: ധാന്യത്തിൽനിന്ന് കതിരും പതിരും വേർതിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പദം; വിളവിന്റെ സമൃദ്ധിമൂലം ഈ ജോലി ദീർഘകാലം നീളുമെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: בָּצִיר
  choice: മുന്തിരിപ്പഴം പറിക്കുന്ന കാലം
  rationale: മുന്തിരിക്കൊയ്ത്ത് എന്ന സാങ്കേതിക പ്രയോഗത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ കാലസൂചന.
- source_word: יַשִּׂיג
  choice: നീണ്ടുനിൽക്കും
  rationale: അക്ഷരാർഥത്തിൽ ‘എത്തിപ്പിടിക്കും’ എന്ന ദൃശ്യപ്രയോഗമാണ്; ഇവിടെ ഒരു കാർഷികകാലം അടുത്തതുവരെ തുടരുമെന്ന ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לָשֹׂבַע
  choice: തൃപ്തിയാകുവോളം
  rationale: വിശപ്പടക്കി മതിവരെയുള്ള സമൃദ്ധമായ ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לָבֶטַח
  choice: സുരക്ഷിതരായി
  rationale: ഭയമോ ഭീഷണിയോ കൂടാതെ നിർഭയമായി കഴിയുന്ന അവസ്ഥയെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: וִישַׁבְתֶּם
  choice: വസിക്കുകയും ചെയ്യും
  rationale: ישׁב എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ അർഥം ദേശത്ത് പാർക്കുക/വസിക്കുക എന്നതാണ്; ‘ജീവിക്കുക’ എന്നതിനെക്കാൾ ഉറവിടത്തോട് അടുത്തത്.
