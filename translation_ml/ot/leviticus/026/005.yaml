  to: നിങ്ങളുടെ മെതിക്കൽ മുന്തിരിക്കൊയ്ത്തുവരെ എത്തും; മുന്തിരിക്കൊയ്ത്ത് വിതയ്ക്കുന്ന കാലംവരെ എത്തും; നിങ്ങൾ നിങ്ങളുടെ അപ്പം തൃപ്തിവരുവോളം തിന്നുകയും നിങ്ങളുടെ ദേശത്ത് നിർഭയമായി വസിക്കുകയും ചെയ്യും.
