translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം കാർഷികപദങ്ങൾ വ്യക്തമാക്കി. ഹീബ്രുവിലെ സമാന്തരഘടനയും സമൃദ്ധി, തൃപ്തി, സുരക്ഷ എന്നീ വാഗ്ദാനങ്ങളുടെ ക്രമവും സംരക്ഷിച്ചു.
