  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: ml
  text: എന്നാൽ ദേശം അവരാൽ ഉപേക്ഷിക്കപ്പെടും; അവർ ഇല്ലാതെ അത് ശൂന്യമായി കിടക്കുമ്പോൾ, അത് തന്റെ ശബ്ബത്തുകൾ അനുഭവിക്കും. അവർ തങ്ങളുടെ അകൃത്യത്തിനുള്ള ശിക്ഷ ഏറ്റുവാങ്ങും[a]; കാരണം—വീണ്ടും പറയട്ടെ, കാരണം—അവർ എന്റെ ന്യായവിധികൾ നിരസിക്കുകയും അവരുടെ ഉള്ളം എന്റെ ചട്ടങ്ങളെ വെറുക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ തങ്ങളുടെ അകൃത്യം ഏറ്റെടുക്കും’ എന്നും ‘അവർ തങ്ങളുടെ അകൃത്യത്തിന് പരിഹാരം ചെയ്യും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ പ്രയോഗം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം; ഇവിടെ ഉടമ്പടി ലംഘനത്തിനുള്ള ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ശിക്ഷാസംബന്ധമായ അർഥമാണ് സ്വീകരിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
