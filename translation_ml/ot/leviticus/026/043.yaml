  rationale: ഉടമ്പടി-ശിക്ഷയുടെ പശ്ചാത്തലത്തിൽ רצה + עון എന്ന പ്രയോഗത്തിന്റെ ന്യായവിധിസംബന്ധമായ അർഥം മുൻനിറുത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יַעַן וּבְיַעַן
