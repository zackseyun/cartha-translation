- source_word: בְּמִשְׁפָּטַי
  choice: എന്റെ ന്യായവിധികൾ
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ അർഥം നൽകുകയും חֻקֹּתַי എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: חֻקֹּתַי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: ദൈവികമായി നിശ്ചയിച്ച ചട്ടങ്ങൾ എന്ന നിയമപരമായ അർഥം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളത്തിൽ നൽകുന്നു.
- source_word: גָּעֲלָה נַפְשָׁם
  choice: അവരുടെ ഉള്ളം ... വെറുക്കുകയും ചെയ്തു
  rationale: കൂട്ടായ ഏകവചനമായ ‘അവരുടെ പ്രാണൻ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ അന്തരംഗപരമായ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിലെ ‘അവരുടെ ഉള്ളം’ വഴി സംരക്ഷിക്കുന്നു.
