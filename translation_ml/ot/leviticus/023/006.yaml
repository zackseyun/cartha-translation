id: LEV.23.6
reference: Leviticus 23:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/זֶּ֔ה חַ֥ג הַ/מַּצּ֖וֹת לַ/יהוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: ml
  text: ഈ മാസം പതിനഞ്ചാം ദിവസം യഹ്‌വേക്കുള്ള[a] പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവമാണ്; ഏഴു ദിവസം നിങ്ങൾ പുളിപ്പില്ലാത്ത അപ്പം തിന്നണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹ്‌വേക്കുവേണ്ടിയുള്ള.’ എബ്രായ ഉപസർഗം സമർപ്പണമോ അവകാശബന്ധമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: ഈ മാസം പതിനഞ്ചാം ദിവസം
  rationale: എബ്രായ കലണ്ടർപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആദ്യത്തെ וּ സന്ദർഭബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: חַג הַמַּצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവം
  rationale: חַג എന്നത് ആരാധനാപരമായ ഉത്സവത്തെയും מַצּוֹת പുളിപ്പിക്കാത്ത അപ്പത്തെയും സൂചിപ്പിക്കുന്നു; ഉത്സവനാമം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത്, לְ എന്ന ഉപസർഗം സൂചിപ്പിക്കാവുന്ന സമർപ്പണം/ബന്ധം ‘-ക്കുള്ള’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നേരിട്ട് പറയുന്നു.
- source_word: מַצּוֹת תֹּאכֵלוּ
  choice: നിങ്ങൾ പുളിപ്പില്ലാത്ത അപ്പം തിന്നണം
  rationale: നിയമപരമായ നിർദേശശക്തി ‘തിന്നണം’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ബഹുവചനമായ מַצּוֹת ഭക്ഷ്യവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഏകവചന സമാഹാരപ്രയോഗമായ ‘അപ്പം’ യോജിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: לַיהוָה എന്നതിലെ לְ ഉപസർഗത്തിന്റെ ബന്ധം
  choice: യഹ്‌വേക്കുള്ള
  alternative: യഹ്‌വേക്കുവേണ്ടിയുള്ള
  rationale: ഉത്സവത്തിന്റെ സമർപ്പണം അല്ലെങ്കിൽ അവകാശബന്ധം എന്ന യഥാർഥ ദ്വയാർഥസാധ്യത മുഖ്യപാഠത്തിൽ ചുരുക്കമായി നിലനിർത്തി, മറ്റൊരു സ്വാഭാവിക വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമ-ആരാധനാ ശൈലി. ‘ഉത്സവം,’ ‘പുളിപ്പില്ലാത്ത അപ്പം,’ ‘തിന്നണം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ദൈവനാമം ‘യഹ്‌വേ’ എന്നു നിലനിർത്തിയിരിക്കുന്നു.
