id: LEV.23.37
reference: Leviticus 23:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ לְ/הַקְרִ֨יב אִשֶּׁ֜ה לַ/יהוָ֗ה עֹלָ֧ה וּ/מִנְחָ֛ה זֶ֥בַח וּ/נְסָכִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: ml
  text: 'യഹോവയുടെ നിശ്ചിത ഉത്സവകാലങ്ങൾ ഇവയാണ്; അവയെ നിങ്ങൾ വിശുദ്ധസമ്മേളനങ്ങളായി പ്രഖ്യാപിക്കണം: യഹോവയ്ക്ക് അഗ്നിയാഗം അർപ്പിക്കുന്നതിനായി—ഹോമയാഗം, ധാന്യയാഗം, ബലി, പാനീയയാഗങ്ങൾ—അതത് ദിവസത്തിനുള്ളത് അതത് ദിവസത്തിൽ അർപ്പിക്കണം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: നിശ്ചിത ഉത്സവകാലങ്ങൾ
  rationale: מוֹעֵד എന്ന പദത്തിന്റെ നിശ്ചയിക്കപ്പെട്ട സമയം/ആഘോഷസമയം എന്നീ ആശയങ്ങൾ സന്ദർഭോചിതമായി ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിലൂടെ പ്രതിനിധീകരിക്കുന്നു; പദത്തെ സാധാരണ സ്ഥാനപ്പേരായി മാറ്റുന്നില്ല.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: വിശുദ്ധസഭായോഗങ്ങൾ
  rationale: വിശുദ്ധമായി വിളിച്ചുകൂട്ടുന്ന പൊതുയോഗങ്ങൾ എന്ന ഹീബ്രു ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִשֶּׁה
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന ഭോജനയാഗം
  rationale: അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗം എന്ന അടിസ്ഥാനാർത്ഥവും, യഹോവയ്ക്കുള്ള യാഗഭോജനം എന്ന ലേവ്യപുസ്തകത്തിലെ ധാരണയും നിലനിർത്തുന്നു.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ഓരോ ദിവസത്തിനും നിശ്ചയിച്ചിരിക്കുന്നതനുസരിച്ച്
  rationale: അക്ഷരാർഥത്തിലെ ‘അതത് ദിവസത്തിന്റെ കാര്യം അതത് ദിവസത്തിൽ’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: അഗ്നിയാഗത്തിന്റെ സ്വഭാവം
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന ഭോജനയാഗം
  alternative: അഗ്നിയാഗം
  rationale: אִשֶּׁה എന്ന പദത്തിന്റെ അഗ്നിസംബന്ധമായ രൂപവും യാഗഭോജനസംബന്ധമായ സന്ദർഭാർഥവും ഒന്നും ഒഴിവാക്കാതെ നൽകുന്നു.
- issue: ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു; ഒരു പ്രത്യേക വ്യാഖ്യാനപരമ്പര നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാഗങ്ങളുടെ സാങ്കേതിക പദങ്ങൾ നിലനിർത്തിക്കൊണ്ട് വാക്യക്രമം മലയാളത്തിന് സ്വാഭാവികമാക്കി.
