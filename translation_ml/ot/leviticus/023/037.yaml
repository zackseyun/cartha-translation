revisions:
- from: നിങ്ങൾ വിശുദ്ധസഭായോഗങ്ങളായി പ്രഖ്യാപിക്കേണ്ട യഹോവയുടെ നിശ്ചിത ഉത്സവകാലങ്ങൾ ഇവയാണ്. ഓരോ ദിവസത്തിനും നിശ്ചയിച്ചിരിക്കുന്നതനുസരിച്ച് യഹോവയ്ക്ക് ദഹനയാഗവും ധാന്യയാഗവും ബലിയും പാനീയയാഗങ്ങളും—അതായത്, അഗ്നിയിൽ അർപ്പിക്കുന്ന ഭോജനയാഗം—അർപ്പിക്കണം.
  to: 'യഹോവയുടെ നിശ്ചിത ഉത്സവകാലങ്ങൾ ഇവയാണ്; അവയെ നിങ്ങൾ വിശുദ്ധസമ്മേളനങ്ങളായി പ്രഖ്യാപിക്കണം: യഹോവയ്ക്ക് അഗ്നിയാഗം അർപ്പിക്കുന്നതിനായി—ഹോമയാഗം, ധാന്യയാഗം, ബലി, പാനീയയാഗങ്ങൾ—അതത് ദിവസത്തിനുള്ളത് അതത് ദിവസത്തിൽ അർപ്പിക്കണം.'
  rationale: 'The revision restores the source order and syntax: the holy convocations are proclaimed in order to present an offering by fire to YHWH, specified by the four sacrificial categories. It also uses neutral modern Malayalam for holy convocations and avoids treating the fire offering as a separate food offering.'
  reviewer_model: gpt-5.6-terra
