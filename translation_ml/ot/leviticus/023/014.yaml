id: LEV.23.14
reference: Leviticus 23:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֶחֶם֩ וְ/קָלִ֨י וְ/כַרְמֶ֜ל לֹ֣א תֹֽאכְל֗וּ עַד עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה עַ֚ד הֲבִ֣יאֲ/כֶ֔ם אֶת קָרְבַּ֖ן אֱלֹהֵי/כֶ֑ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: ml
  text: അപ്പമോ വറുത്ത ധാന്യമോ[a] പുത്തൻ ധാന്യമോ[b] ഈ ദിവസം വരെയും—നിങ്ങളുടെ ദൈവത്തിന്റെ വഴിപാട് നിങ്ങൾ കൊണ്ടുവരുന്നതുവരെയും—ഭക്ഷിക്കരുത്. ഇത് നിങ്ങളുടെ തലമുറകളിലുടനീളം, നിങ്ങളുടെ എല്ലാ വാസസ്ഥലങ്ങളിലും സ്ഥിരമായ ചട്ടമാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തീയിൽ ചുട്ട ധാന്യം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘പുതുതായി വിളഞ്ഞ ധാന്യം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘ശാശ്വതമായ ചട്ടം’ അല്ലെങ്കിൽ ‘എന്നേക്കുമുള്ള ചട്ടം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: ധാന്യവിളവിന്റെ പശ്ചാത്തലത്തിൽ പൊതുവായ ‘ഭക്ഷണം’ എന്നതിനെക്കാൾ ചുട്ടുണ്ടാക്കിയ അപ്പം എന്ന മൂർത്തമായ അർഥം യോജിക്കുന്നു.
- source_word: קָלִי
  choice: വറുത്ത ധാന്യം
  rationale: തീയിൽ വറുത്തതോ ചൂടിൽ ഉണക്കിയതോ ആയ ധാന്യത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ എളുപ്പം മനസ്സിലാകുന്ന പ്രയോഗമാണിത്.
- source_word: כַרְמֶל
  choice: പുത്തൻ ധാന്യം
  rationale: ഇവിടെ സ്ഥലനാമമായ കർമ്മേൽ അല്ല, പുതുതായി വിളഞ്ഞ ധാന്യമോ ധാന്യക്കതിരുകളോ ആണ് ഉദ്ദേശ്യം.
- source_word: לֹא תֹאכְלוּ
  choice: ഭക്ഷിക്കരുത്
  rationale: നിഷേധത്തോടുകൂടിയ ക്രിയ നിയമപരമായ വിലക്കാണ്; മലയാളത്തിലെ സ്വാഭാവികവും ദൃഢവുമായ നിരോധനരൂപം ഉപയോഗിച്ചു.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: ഈ ദിവസംതന്നെ
  rationale: עֶצֶם നൽകുന്ന ഊന്നൽ ‘തന്നെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: עַד הֲבִיאֲכֶם
  choice: നിങ്ങൾ കൊണ്ടുവരുന്നതുവരെ
  rationale: വിലക്ക് അവസാനിപ്പിക്കുന്ന മുൻവ്യവസ്ഥയായ പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവത്തിനുള്ള വഴിപാട്
  rationale: קָרְבָּן എന്ന പൊതുവായ അർപ്പണപദത്തെ പ്രത്യേക യാഗവിഭാഗമായി പരിമിതപ്പെടുത്താതെ അവതരിപ്പിക്കുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: സ്ഥിരമായ ചട്ടം
  rationale: നിയമത്തിന്റെ തുടർന്നുനിൽക്കുന്ന ബാധ്യത പ്രകടമാക്കുന്നു; ‘ശാശ്വതം’ എന്ന സാധ്യമായ ശക്തമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകളിലുടനീളം
  rationale: തുടർന്നുവരുന്ന തലമുറകളിലേക്കുള്ള നിയമത്തിന്റെ വ്യാപ്തി വ്യക്തമായി നൽകുന്നു.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: നിങ്ങളുടെ എല്ലാ വാസസ്ഥലങ്ങളിലും
  rationale: ഇസ്രായേല്യർ താമസിക്കുന്ന എല്ലാ ഇടങ്ങളെയും സൂചിപ്പിക്കുന്ന നിയമപരമായ ഔപചാരികത നിലനിർത്തുന്നു.
theological_decisions:
- issue: മോശെയുടെ ന്യായപ്രമാണത്തിലെ חֻקַּת עוֹלָם എന്നതിന്റെ വ്യാപ്തി
  choice: ‘സ്ഥിരമായ ചട്ടം’ എന്നു പരിഭാഷപ്പെടുത്തി, ലേവ്യപുസ്തകത്തിലെ ഉടമ്പടി-നിയമ പശ്ചാത്തലത്തിലുള്ള തുടർച്ചയുടെ ശക്തി നിലനിർത്തി.
  alternative: ‘ശാശ്വതമായ ചട്ടം’ അല്ലെങ്കിൽ ‘എന്നേക്കുമുള്ള ചട്ടം’.
  rationale: എബ്രായപ്രയോഗത്തിന്റെ ദീർഘകാല ബാധ്യത മറച്ചുവയ്ക്കാതെയും, മോശെയുടെ ആചാരനിയമം പിന്നീടും എങ്ങനെ ബാധകമാകുന്നു എന്ന ദൈവശാസ്ത്രവിവാദം പരിഭാഷയിൽ തീർപ്പാക്കാതെയും ഇരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമശൈലി. ‘വഴിപാട്’, ‘സ്ഥിരമായ ചട്ടം’, ‘വാസസ്ഥലങ്ങൾ’ എന്നീ പദങ്ങൾ ലേവ്യപുസ്തകത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ഇരട്ട ‘עד’ ഘടനയുടെ ബന്ധം ദീർഘവാക്യത്തിൽ വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു.
