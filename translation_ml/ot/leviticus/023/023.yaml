lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ ഈ രൂപം പുതിയൊരു ദൈവിക അരുളപ്പാട് ആരംഭിക്കുന്ന പതിവുശൈലിയാണ്; ‘സംസാരിച്ചു’ എന്നത് അതിനെ സ്വാഭാവികവും മാന്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוהയെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל
  choice: -ഓടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ പൂർവപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദത്തിവ് രൂപം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: משה എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥിരപ്പെട്ട രൂപം.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അക്ഷരാർഥരൂപം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമാകും; തുടർന്നുവരുന്ന അരുളപ്പാടിനെ ദ്വിബിന്ദു സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റുന്നില്ല. ഉച്ചാരണത്തിന്റെ കൃത്യരൂപം അനിശ്ചിതമായിരിക്കെ മലയാള വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യം. എബ്രായത്തിലെ ‘സംസാരിച്ചു… പറഞ്ഞുകൊണ്ട്’ എന്ന സൂത്രവാക്യം മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ തുടർന്നുള്ള നേരിട്ടുള്ള വചനത്തെ ദ്വിബിന്ദുവിലൂടെ പരിചയപ്പെടുത്തുന്നു.
