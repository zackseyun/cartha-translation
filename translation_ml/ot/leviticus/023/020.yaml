  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: ml
  text: പുരോഹിതൻ അവയെ ആദ്യഫലങ്ങളുടെ അപ്പത്തോടും രണ്ടു കുഞ്ഞാടുകളോടും ചേർത്ത്, യഹോവയുടെ സന്നിധിയിൽ ആട്ടുന്ന വഴിപാടായി ആട്ടണം.[a] അവ യഹോവയ്ക്കു വിശുദ്ധമായിരിക്കും; അവ പുരോഹിതനുള്ളതായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആദ്യഫലങ്ങളുടെ അപ്പത്തിന്മേലും’ ‘രണ്ടു കുഞ്ഞാടുകളുടെ മേലും’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ עַל എന്ന മുൻസർഗത്തിന് ‘മേൽ’ എന്ന അർഥവും വരാം; ഇവിടെ അത് ഇവയെ ഒന്നിച്ചു ആചാരപരമായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף / תְּנוּפָה
  choice: നീരാജനവഴിപാടായി ആട്ടിക്കാണിക്കണം
  rationale: נוּף എന്ന ക്രിയയും תְּנוּפָה എന്ന സാങ്കേതിക യാഗപദവും സൂചിപ്പിക്കുന്ന ആചാരപരമായ ചലിപ്പിച്ചുള്ള സമർപ്പണം വ്യക്തമാക്കാൻ, പരിചിതമായ ‘നീരാജനവഴിപാട്’ എന്ന പദത്തോടൊപ്പം സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ‘ആട്ടിക്കാണിക്കുക’ ഉപയോഗിച്ചു.
- source_word: אֹתָם
  choice: അവയെ
  rationale: മുൻസന്ദർഭത്തിലെ സമർപ്പണവസ്തുക്കളെ സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമത്തിന്റെ അനിശ്ചിതമായ പൂർവപദബന്ധം അതേപടി നിലനിർത്തുന്നു.
- source_word: עַל לֶחֶם הַבִּכּוּרִים
  choice: ആദ്യഫലങ്ങളുടെ അപ്പത്തോടുംകൂടെ
  rationale: ഈ യാഗക്രമത്തിൽ עַל അനുബന്ധമായി ഒരുമിച്ചു സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതായി എടുത്തു; ഭൗതികമായി മുകളിൽ വെച്ചുവെന്ന ആശയം നിർബന്ധമാക്കുന്നില്ല.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധിയിൽ നടത്തുന്ന ആരാധനാക്രിയയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: עַל שְׁנֵי כְּבָשִׂים
  choice: രണ്ടു കുഞ്ഞാടുകളോടുംകൂടെ
  rationale: മുമ്പത്തെ עַל പോലെ, യാഗവസ്തുക്കളുടെ അനുബന്ധമായ സംയുക്ത സമർപ്പണം വ്യക്തമാക്കുന്നു; സ്ഥലബന്ധമായ ‘മുകളിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: קֹדֶשׁ יִהְיוּ לַיהוָה לַכֹּהֵן
  choice: അവ യഹോവയ്ക്കു വിശുദ്ധമായിരിക്കും; അവ പുരോഹിതനുള്ളവയാണ്
  rationale: യഹോവയ്ക്കുള്ള വിശുദ്ധപദവിയും പുരോഹിതന് ലഭിക്കുന്ന അവകാശവും വേർതിരിച്ചും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: യഹോവയ്ക്കു വിശുദ്ധമായ വസ്തുക്കൾ പുരോഹിതനുള്ളവയാകുന്നതിലെ ബന്ധം
  choice: ‘യഹോവയ്ക്കു വിശുദ്ധം’ എന്നും ‘പുരോഹിതനുള്ളത്’ എന്നും ഇരുവശവും പ്രസ്താവിച്ചു
  alternative: പുരോഹിതന്റെ ഉപയോഗത്തിനായി യഹോവയ്ക്കു സമർപ്പിതം എന്നു വിശദീകരിക്കുക
  rationale: മൂലപാഠം സമർപ്പണവും പുരോഹിതാവകാശവും ചേർത്തുപറയുന്നു; അവയുടെ കൃത്യബന്ധം വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതെ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തി.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. ലേവ്യയാഗക്രമത്തിലെ സാങ്കേതിക പദമായ ‘നീരാജനവഴിപാട്’ നിലനിർത്തിയെങ്കിലും അതിന്റെ പ്രവർത്തി വ്യക്തമാക്കാൻ ‘ആട്ടിക്കാണിക്കണം’ ചേർത്തു. മൂലത്തിലെ സർവനാമസംബന്ധമായ അനിശ്ചിതത്വവും עַל എന്ന മുൻവാക്കിന്റെ സ്ഥലബന്ധ/അനുബന്ധ അർഥസാധ്യതയും പരിഹരിച്ചുകളയാതെ സൂക്ഷിച്ചു.
