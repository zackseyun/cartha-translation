id: LEV.23.36
reference: Leviticus 23:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: ml
  text: ഏഴു ദിവസം നിങ്ങൾ യഹ്‌വേക്കു അഗ്നിയർപ്പണം അർപ്പിക്കണം. എട്ടാം ദിവസം നിങ്ങൾക്കു ഒരു വിശുദ്ധ സമ്മേളനം ഉണ്ടായിരിക്കണം; നിങ്ങൾ യഹ്‌വേക്കു അഗ്നിയർപ്പണം അർപ്പിക്കണം. അതു ഒരു ഗൗരവസഭയാണ്; പതിവ് ജോലികളൊന്നും ചെയ്യരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: ആവശ്യമായ അർപ്പണങ്ങളുടെ കാലദൈർഘ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: അർപ്പിക്കണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ഈ ആരാധനാസന്ദർഭത്തിലുള്ള യാഗാർപ്പണത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִשֶּׁה
  choice: ദഹനാർപ്പണം
  rationale: തീ മുഖാന്തരം യഹ്‌വേക്കു സമർപ്പിക്കുന്ന യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; 'ഹോമയാഗം' എന്ന പ്രത്യേക യാഗവിഭാഗവുമായി തെറ്റായി സമീകരിക്കാതിരിക്കാനും 'ഭോജനാർപ്പണം' എന്ന ആശയവിസ്താരം ഒഴിവാക്കാനും ഈ പൊതുവായ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: ל എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണദിശ നിലനിർത്തുകയും יהוה എന്ന ദൈവനാമം നേരിട്ട് ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധസഭായോഗം
  rationale: ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടുന്ന വിശുദ്ധ കൂടിവരവിനെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: עֲצֶרֶת
  choice: സമാപനസഭ
  rationale: ഉത്സവത്തിന്റെ അവസാനഘട്ടത്തിലെ പ്രത്യേക കൂടിവരവ് എന്ന സാദ്ധ്യമായ അർഥം നൽകുന്നു; പദത്തിന്റെ തടഞ്ഞുനിൽക്കൽ/നിയന്ത്രണം എന്ന പശ്ചാത്തലം സന്ദർഭത്തിൽ സമ്മേളനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: പതിവുള്ള ജോലികളൊന്നും
  rationale: എല്ലാ പ്രവർത്തനവും അല്ല, സാധാരണ ഉപജീവനമോ സേവനമോ സംബന്ധിച്ച തൊഴിലാണ് നിരോധിക്കുന്നതെന്ന ഉത്സവനിയമത്തിലെ വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: എട്ടാം ദിവസം
  rationale: ലളിതവും നേരിട്ടുള്ളതുമായ കാലസൂചന.
- source_word: יִהְיֶה לָכֶם
  choice: നിങ്ങൾക്കു ... ഉണ്ടായിരിക്കണം
  rationale: היה + ל എന്ന ഘടനയുടെ അസ്തിത്വാർഥവും നിർദേശസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമം പദവിയായി മാറ്റാതെ, സാദ്ധ്യമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- issue: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ പരിധി
  choice: ദഹനാർപ്പണം
  alternative: തീയിലൂടെയുള്ള അർപ്പണം / ഭോജനാർപ്പണം
  rationale: തീയിൽ സമർപ്പിക്കുന്ന അർപ്പണം എന്ന ആരാധനാപരമായ അർഥം നിലനിർത്തുന്നു; ദൈവം ഭക്ഷണം ആവശ്യമുള്ളവനാണെന്ന അനാവശ്യമായ ധാരണ ഒഴിവാക്കുന്നു.
- issue: עֲצֶרֶת എന്ന പദത്തിന്റെ ഉത്സവപരമായ അർഥം
  choice: സമാപനസഭ
  alternative: ഗൗരവസഭ / പ്രത്യേക സഭ
  rationale: എട്ടാം ദിവസത്തെ സമാപന കൂടിവരവ് എന്ന സന്ദർഭാർഥം സ്വീകരിക്കുന്നു; എന്നാൽ പദത്തിൽ അടങ്ങിയ നിയന്ത്രണം/നിർത്തിവെക്കൽ എന്ന ആശയം പൂർണമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ പുരോഹിതനിയമങ്ങളുടെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. 'വിശുദ്ധസഭായോഗം', 'സമാപനസഭ' എന്നിവ തമ്മിലുള്ള മൂലപാഠപരമായ വ്യത്യാസം സൂക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നം തെറ്റായ സ്ഥാനത്താണെന്നും അതിന്റെ ഉള്ളടക്കം אִשֶּׁה-നോടാണ് ബന്ധപ്പെട്ടതെന്നും കണക്കിലെടുത്ത്, മലയാള മുഖ്യപാഠത്തിൽ ആശയം നേരിട്ട് വ്യക്തമായതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
