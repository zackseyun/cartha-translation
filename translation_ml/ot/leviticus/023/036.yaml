  to: ഏഴു ദിവസം നിങ്ങൾ യഹ്‌വേക്കു അഗ്നിയർപ്പണം അർപ്പിക്കണം. എട്ടാം ദിവസം നിങ്ങൾക്കു ഒരു വിശുദ്ധ സമ്മേളനം ഉണ്ടായിരിക്കണം; നിങ്ങൾ യഹ്‌വേക്കു അഗ്നിയർപ്പണം അർപ്പിക്കണം. അതു ഒരു ഗൗരവസഭയാണ്; പതിവ് ജോലികളൊന്നും ചെയ്യരുത്.
  rationale: അഗ്നിയർപ്പണം എന്ന തിരുത്തൽ אִשֶּׁה-യുടെ വിശാലമായ യാഗസാങ്കേതിക അർഥം നിലനിർത്തുകയും അതിനെ ഹോമയാഗവുമായി സമീകരിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു. עֲצֶרֶת-ന് നിഷ്പക്ഷമായ മുഖ്യപരിഭാഷയും സമാപനാർഥം അടിക്കുറിപ്പിൽ ബദലായും നൽകിയിരിക്കുന്നു. കുറിപ്പ് a ‘അഗ്നിയർപ്പണം’ എന്ന പദത്തോടും കുറിപ്പ് b ‘ഗൗരവസഭ’ എന്ന പദത്തോടും ബന്ധിപ്പിക്കണം.
