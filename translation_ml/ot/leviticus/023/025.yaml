id: LEV.23.25
reference: Leviticus 23:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: ml
  text: അധ്വാനമുള്ള ജോലിയൊന്നും നിങ്ങൾ ചെയ്യരുത്; യഹ്‌വേക്കു അഗ്നിയിൽ അർപ്പിക്കുന്ന ഒരു യാഗം സമർപ്പിക്കേണ്ടതാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭക്ഷണയാഗം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: ഒരു ... ജോലിയും നിങ്ങൾ ചെയ്യരുത്
  rationale: നിഷേധത്തോടുകൂടിയ כָּל എന്നതിന്റെ സമ്പൂർണ നിരോധനശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഒരു ... ജോലിയും ... ചെയ്യരുത്’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: അധ്വാനമുള്ള ജോലി
  rationale: വിശുദ്ധദിവസത്തിൽ നിരോധിക്കുന്നത് എല്ലാ പ്രവൃത്തിയും അല്ല, സാധാരണ അധ്വാനസ്വഭാവമുള്ള ജോലിയാണ്. ‘അധ്വാനമുള്ള ജോലി’ എന്നത് പഴഞ്ചൻ പദപ്രയോഗങ്ങളില്ലാതെ ഈ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: וְהִקְרַבְתֶּם
  choice: സമർപ്പിക്കണം
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ഒരു വഴിപാട് ദൈവസന്നിധിയിൽ കൊണ്ടുവന്ന് അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സമർപ്പിക്കണം’ ആ ആരാധനാപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִשֶּׁה
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന ഒരു യാഗം
  rationale: പുരോഹിതസാഹിത്യത്തിലെ ഈ പദം അഗ്നിയിലൂടെ അർപ്പിക്കുന്ന യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. പദത്തിന്റെ കൃത്യമായ വ്യാഖ്യാനം വിവാദമുള്ളതിനാൽ ‘ഭക്ഷണയാഗം’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ഉറപ്പിച്ചിട്ടില്ല; അത് അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരം ചെയ്തു; ദിശാസൂചക לְ മലയാളത്തിലെ ‘-ക്കു’ വഴി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമം יהוה
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ ‘യഹ്‌വേ’ എന്നു നൽകുന്നു; പൊതുവായ സ്ഥാനപ്പേരിലൂടെ മറയ്ക്കുന്നില്ല.
- issue: യാഗപദമായ אִשֶּׁהയുടെ അർഥം
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന ഒരു യാഗം
  alternative: ഭക്ഷണയാഗം; അഗ്നിയർപ്പണം
  rationale: ഈ പദത്തിന്റെ രൂപവും പുരോഹിതസാഹിത്യത്തിലെ പ്രയോഗവും അഗ്നിയുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘ഭക്ഷണയാഗം’ എന്ന വ്യാഖ്യാനവും പ്രചാരത്തിലുണ്ട്. പ്രധാനവാചകം അഗ്നിസംബന്ധം നിലനിർത്തുകയും മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ബഹുവചന അഭിസംബോധന നിലനിർത്തി; യാഗപരമായ സാങ്കേതിക അർഥം സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ തുറന്നുപറഞ്ഞു.
