base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: ml
  text: ഒന്നാം മാസം, അതിന്റെ പതിനാലാം ദിവസം, സന്ധ്യാവേളയിൽ[a] യഹോവയ്ക്കുള്ള പെസഹയാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘സന്ധ്യകൾക്കിടയിൽ’; സൂര്യാസ്തമയത്തോടു ചേർന്ന സന്ധ്യാവേളയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: ‘പെസഹായാഗം’ അല്ലെങ്കിൽ ‘പെസഹാബലി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: ഒന്നാം മാസത്തിന്റെ
  rationale: ആരാധനാവർഷത്തിലെ ഒന്നാം മാസത്തെ സൂചിപ്പിക്കുന്ന കലണ്ടർപ്രയോഗമാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി തീയതിവാക്യവുമായി ചേർത്തു.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: പതിനാലാം ദിവസം
  rationale: മാസത്തിനുള്ളിലെ തീയതി പറയുന്ന സാധാരണ എബ്രായരീതിയാണ്; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘ദിവസം’ ചേർത്തു.
- source_word: בֵּין הָעַרְבָּיִם
  choice: സന്ധ്യാസമയത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘സന്ധ്യകൾക്കിടയിൽ’ എന്ന എബ്രായ ശൈലി സൂര്യാസ്തമയത്തോടു ചേർന്ന സന്ധ്യാവേളയെ സൂചിപ്പിക്കുന്നു; വ്യാഖ്യാനപ്രാധാന്യമുള്ള അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: פֶּסַח
  choice: പെസഹ
  rationale: ആചരണം, യാഗകർമം, യാഗമൃഗം എന്നിവയെ സൂചിപ്പിക്കാവുന്ന പദത്തിന്റെ വിശാലത ‘പെസഹ’ നിലനിർത്തുന്നു; യാഗാർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: ל സമർപ്പണം/ബന്ധം സൂചിപ്പിക്കുന്നു; ‘യഹോവയ്ക്കുള്ള’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും അർഥസൂക്ഷ്മത കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
- issue: ആരാധനാസന്ദർഭത്തിലെ פֶּסַח എന്ന പദത്തിന്റെ അർഥം
  choice: പെസഹ
  alternative: പെസഹായാഗം; പെസഹാബലി
  rationale: പദം ഉത്സവത്തെയോ ആചരണത്തെയോ യാഗത്തെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠം വിശാലമായ അർഥം നിലനിർത്തുകയും യാഗാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാപരമായ ശൈലി. എബ്രായ വാക്യത്തിന്റെ കലണ്ടർക്രമം സ്വാഭാവിക മലയാള തീയതിപ്രയോഗമായി അവതരിപ്പിച്ചു; യഥാർഥമായ ശബ്ദാർഥ-ആചാരാർഥ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
