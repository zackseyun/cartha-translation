source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: ml
  text: '“ഇസ്രായേൽപുത്രന്മാരോടു[a] സംസാരിച്ച് അവരോടു പറയുക: ഞാൻ നിങ്ങൾക്കു നൽകുന്ന ദേശത്തു നിങ്ങൾ പ്രവേശിച്ച് അതിലെ വിള കൊയ്യുമ്പോൾ, നിങ്ങളുടെ കൊയ്ത്തിന്റെ ആദ്യഫലമായ കറ്റ[b] പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യരോടു.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാരോടു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഓമർ.” ഇവിടെ എബ്രായപദം ഒരു കറ്റയെ സൂചിപ്പിക്കാം; അതേ പദം “ഓമർ” എന്ന സാങ്കേതിക പദമായും ഉപയോഗിക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കുടുംബബന്ധസൂചന നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: כִּי
  choice: …പ്രവേശിച്ച് … കൊയ്യുമ്പോൾ
  rationale: കല്പന ബാധകമാകുന്ന സാഹചര്യം ഇവിടെ כִּי അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ുമ്പോൾ’ ഘടന ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇസ്രായേൽ പ്രവേശിക്കാനിരിക്കുന്ന ഉടമ്പടിപരവും ഭൂമിശാസ്ത്രപരവുമായ പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נֹתֵן
  choice: നൽകുന്ന
  rationale: എബ്രായ കൃദന്തരൂപത്തിലെ നടന്നുകൊണ്ടിരിക്കുന്നതോ ആസന്നമായതോ ആയ ദൈവിക പ്രവൃത്തി ലളിതമായി നിലനിർത്തുന്നു.
- source_word: וּקְצַרְתֶּם אֶת־קְצִירָהּ
  choice: അതിലെ വിള കൊയ്യുമ്പോൾ
  rationale: ദേശത്തിൽനിന്നുള്ള വിള കൊയ്യുന്നതെന്ന കാർഷിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അതിലെ’ എന്നത് പ്രത്യയം ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് കാണിക്കുന്നു.
- source_word: וַהֲבֵאתֶם
  choice: കൊണ്ടുവരണം
  rationale: നിയമനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: עֹמֶר
  choice: കറ്റ
  rationale: പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരുന്ന കൊയ്ത്തുവസ്തുവെന്ന ഈ സന്ദർഭത്തിലെ മൂർത്തമായ കാർഷിക അർഥം നൽകുന്നു; സാങ്കേതിക രൂപമായ ‘ഓമർ’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: רֵאשִׁית
  choice: ആദ്യഫലം
  rationale: കൊയ്ത്തിൽ ആദ്യം ലഭിക്കുന്നതും ദൈവത്തിനു സമർപ്പിക്കപ്പെടുന്നതുമായ ഭാഗത്തിന്റെ കാലപരവും ആരാധനാപരവുമായ പ്രാധാന്യം പ്രകടമാക്കുന്നു.
- source_word: קְצִירְכֶם
  choice: നിങ്ങളുടെ കൊയ്ത്ത്
  rationale: മുമ്പുള്ള കൊയ്ത്തുപദാവലിയുമായി ബന്ധം നിലനിർത്തുകയും കാർഷിക പശ്ചാത്തലത്തിൽ സ്വാഭാവികമാവുകയും ചെയ്യുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ כֹּהֵן എന്ന പദത്തിന്റെ പതിവും കൃത്യവുമായ മലയാളരൂപം.
theological_decisions:
- issue: ഉടമ്പടിസമൂഹത്തെ ലിംഗസൂചനയോടെ അഭിസംബോധന ചെയ്യുന്നത്
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: എബ്രായത്തിലെ בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബബന്ധമുള്ള പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അതിനെ കൂടുതൽ പൊതുവാക്കുകയോ വ്യാഖ്യാനിച്ച് മാറ്റുകയോ ചെയ്യുന്നില്ല.
- issue: ആരാധനാപരമായ עֹמֶר എന്ന പദം
  choice: കറ്റ
  alternative: ഓമർ
  rationale: ഈ വാക്യത്തിൽ കൊയ്തെടുത്ത ഒരു വസ്തു പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരുന്നതായതിനാൽ കാർഷികമായ മൂർത്ത അർഥം മുഖ്യപാഠത്തിൽ യോജിക്കുന്നു; സാങ്കേതിക പദമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. എബ്രായ വാക്യത്തിന്റെ സാഹചര്യം-കല്പന ക്രമം മലയാളത്തിലെ ‘-ുമ്പോൾ … കൊണ്ടുവരണം’ എന്ന സ്വാഭാവിക ഘടനയിൽ അവതരിപ്പിച്ചു; യഥാർഥമായ പദാർഥവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
