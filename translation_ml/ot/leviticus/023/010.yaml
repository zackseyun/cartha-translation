    rationale: While “മക്കൾ” is idiomatic, it can mean children generally and does not retain the Hebrew masculine plural as explicitly as the source-oriented policy calls for. “ഇസ്രായേൽപുത്രന്മാർ” provides a safe formal equivalent.
