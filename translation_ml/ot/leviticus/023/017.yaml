id: LEV.23.17
reference: Leviticus 23:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: ml
  text: നിങ്ങളുടെ വാസസ്ഥലങ്ങളിൽനിന്ന് നീരാജനാർപ്പണത്തിനുള്ള രണ്ട് അപ്പങ്ങൾ കൊണ്ടുവരണം. അവ ഓരോന്നും ഒരു ഏഫയുടെ പത്തിലിരണ്ട് അളവ് നല്ല മാവുകൊണ്ടുള്ളവയായിരിക്കണം[a]. അവ പുളിപ്പുചേർത്ത് ചുടണം[b]; യാഹ്‌വേക്കുള്ള ആദ്യഫലങ്ങളായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘പത്തിൽ രണ്ട് അളവുകൾ’; പുരോഹിതീയ അളവുപദ്ധതിയിൽ ഇത് ഒരു ഏഫയുടെ പത്തിലിരണ്ട് അളവാണ്.
    reason: cultural_note
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: ‘പുളിപ്പുള്ള അപ്പമായി അവ ചുടണം.’ ഈ ആദ്യഫല അപ്പങ്ങൾ പുളിപ്പുള്ളവയാണെന്ന് എബ്രായപാഠം വ്യക്തമായി പറയുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: നിങ്ങളുടെ വാസസ്ഥലങ്ങളിൽനിന്ന്
  rationale: מוֹשָׁב എന്നത് വസിക്കുന്ന സ്ഥലം അഥവാ പാർപ്പിടം സൂചിപ്പിക്കുന്നു; ഉറവിടത്തിലെ സ്ഥലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תָּבִיאוּ
  choice: കൊണ്ടുവരണം
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ആരാധനാക്രമവുമായി ബന്ധപ്പെട്ട നിർദേശം നൽകുന്നു; ആധുനിക മലയാളത്തിലെ നിയമനിർദേശ ശൈലിക്ക് ഇത് യോജിക്കുന്നു.
- source_word: לֶחֶם תְּנוּפָה שְׁתַּיִם
  choice: നീരാജനാർപ്പണത്തിനായി രണ്ടു അപ്പം
  rationale: לֶחֶם രൂപത്തിൽ ഏകവചനമായിരുന്നാലും שְׁתַּיִם അതിനെ രണ്ടായി നിർണ്ണയിക്കുന്നു. תְּנוּפָה യാഗവസ്തു ആചാരപരമായി ചലിപ്പിച്ചു സമർപ്പിക്കുന്ന സാങ്കേതിക ആരാധനാപദമാണ്.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: ഒരു ഏഫയുടെ പത്തിൽ രണ്ടു ഭാഗം
  rationale: עִשָּׂרוֹן പുരോഹിതീയ അളവുപദ്ധതിയിൽ ഏഫയുടെ പത്തിലൊന്നാണ്; സൂചിതമായ ഏഫ വ്യക്തമാക്കുന്നത് മലയാളവായനക്കാർക്ക് അളവ് ഗ്രഹിക്കാൻ സഹായിക്കുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: ധാന്യാർപ്പണങ്ങളിൽ ഉപയോഗിക്കുന്ന നന്നായി അരിച്ച മാവിനുള്ള പതിവായ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: പുളിപ്പുചേർത്ത് അവ ചുടണം
  rationale: חָמֵץ പുളിപ്പിച്ച അവസ്ഥയെയും תֵּאָפֶינָה ചുടപ്പെടുന്നതിനെയും സൂചിപ്പിക്കുന്നു; ഈ അപ്പങ്ങൾ പുളിപ്പുള്ളവയാണെന്ന ശ്രദ്ധേയ വിവരം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בִּכּוּרִים
  choice: ആദ്യഫലങ്ങൾ
  rationale: ദൈവത്തിനു സമർപ്പിക്കുന്ന വിളവിന്റെ ആദ്യഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അപ്പങ്ങളുടെ ആരാധനാപരമായ നിലയാണ് പറയുന്നത്.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: ל സമർപ്പണബന്ധം സൂചിപ്പിക്കുന്നു; יהוה എന്ന ഉടമ്പടിനാമം മലയാളത്തിലെ പരിചിതരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിനാമമാക്കി മാറ്റാതെ ഉടമ്പടിനാമം മലയാളത്തിലെ പരിചിതരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: תְּנוּפָה എന്ന ആരാധനാക്രമപദം
  choice: നീരാജനാർപ്പണം
  alternative: ചലിപ്പിച്ചുള്ള അർപ്പണം
  rationale: ഇത് ഇസ്രായേലിന്റെ യാഗക്രമത്തിലെ പ്രത്യേക സമർപ്പണരീതിയെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ-ആരാധനാഭാഷയിൽ പ്രചാരമുള്ള സാങ്കേതികപദം ഉപയോഗിക്കുന്നത് വിഭാഗീയ വ്യാഖ്യാനം ചേർക്കാതെ ആചാരപരമായ വിഭാഗം നിലനിർത്തുന്നു.
- issue: בִּכּוּרִים എന്നതിന്റെ വാക്യബന്ധം
  choice: അവ യഹോവയ്ക്കുള്ള ആദ്യഫലങ്ങളാണ്
  alternative: യഹോവയ്ക്ക് ആദ്യഫലങ്ങളായി
  rationale: ഹീബ്രുവിൽ ക്രിയയില്ലാത്ത അവസാനഘടകം അപ്പങ്ങളുടെ പദവിയെയോ സമർപ്പണലക്ഷ്യത്തെയോ സൂചിപ്പിക്കാം; വ്യക്തമായ മലയാളവാക്യമായി നൽകിയെങ്കിലും അവ ദൈവത്തിനുള്ള ആദ്യഫലങ്ങളാണെന്ന അടിസ്ഥാനബന്ധം മാത്രം പ്രസ്താവിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാ-നിയമനിർദേശ ശൈലി. സാങ്കേതികമായ תְּנוּפָהയ്ക്ക് പരിചിതമായ ‘നീരാജനാർപ്പണം’ നിലനിർത്തി; പുരാതന അളവിന് വിശദീകരണ അടിക്കുറിപ്പ് നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
