source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶת מֹעֲדֵ֖י יְהוָ֑ה אֶל בְּנֵ֖י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/044.yaml
  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: ml
  text: അങ്ങനെ മോശെ യാഹ്‌വേയുടെ നിശ്ചിത സമയങ്ങൾ ഇസ്രായേൽമക്കളോടു പ്രസ്താവിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യരോടു’; അക്ഷരാർഥത്തിൽ, ‘ഇസ്രായേലിന്റെ പുത്രന്മാരോടു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പ്രസ്താവിച്ചു
  rationale: പീയേൽ രൂപത്തിന് അടിസ്ഥാനമായി ‘സംസാരിച്ചു’ എന്ന അർഥമുണ്ടെങ്കിലും, ഉത്സവകലണ്ടറിന്റെ സമാപനസംഗ്രഹത്തിൽ നിശ്ചിത ആചരണങ്ങൾ ഔദ്യോഗികമായി അറിയിച്ചതെന്ന ആശയം ‘പ്രസ്താവിച്ചു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֹעֲדֵי
  choice: നിശ്ചിത സമയങ്ങൾ
  rationale: מוֹעֵד മുൻകൂട്ടി നിശ്ചയിച്ച സമയം അഥവാ സംഗമസമയം സൂചിപ്പിക്കുന്നു. ഈ അധ്യായത്തിൽ ശബത്തും ഉൾപ്പെടുന്നതിനാൽ ‘ഉത്സവങ്ങൾ’ എന്നതിനെക്കാൾ വ്യാപകമായ ‘നിശ്ചിത സമയങ്ങൾ’ മൂലഭാഷയുടെ പരിധി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֶל
  choice: -ഓടു
  rationale: മോശ ആരോടാണ് അറിയിച്ചതെന്ന് സൂചിപ്പിക്കുന്ന സമ്പ്രദാനബന്ധം മലയാളത്തിൽ ‘ഇസ്രായേൽമക്കളോടു’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പ്രതിനിധിപരമായ പ്രയോഗം മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും മാന്യവും സ്വാഭാവികവുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകി; കൂടുതൽ അക്ഷരാർഥമായ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: വാക്യത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്. അതിനാൽ ഒരു ബിരുദം പകരംവയ്ക്കാതെ മൂലനാമത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കൂട്ടായ പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: കൂട്ടായ ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പരമ്പരാഗത രൂപഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപം തെരഞ്ഞെടുത്തു; അത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നു എന്ന് വ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അങ്ങനെ’ സമാപനസംഗ്രഹത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു; ‘നിശ്ചിത സമയങ്ങൾ’ ഈ അധ്യായത്തിന്റെ മുഴുവൻ പരിധിയും നിലനിർത്തുന്നു.
