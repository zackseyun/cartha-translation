id: LEV.23.27
reference: Leviticus 23:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֡ךְ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֩ הַ/שְּׁבִיעִ֨י הַ/זֶּ֜ה י֧וֹם הַ/כִּפֻּרִ֣ים ה֗וּא מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: ml
  text: എന്നാൽ ഈ ഏഴാം മാസത്തിന്റെ പത്താം ദിവസം പാപപരിഹാരദിനമാണ്.[a] അന്ന് നിങ്ങൾക്കു വിശുദ്ധസഭായോഗം ഉണ്ടായിരിക്കണം. നിങ്ങൾ നിങ്ങളെത്തന്നെ ക്ലേശിപ്പിക്കുകയും[b] യഹോവയ്ക്ക് അഗ്നിയർപ്പണം അർപ്പിക്കുകയും വേണം.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘പരിഹാരങ്ങളുടെ ദിവസം’ എന്നാണ്.
    reason: മൂലഭാഷയിലെ ബഹുവചനരൂപം രേഖപ്പെടുത്താൻ.
  - marker: b
    text: അല്ലെങ്കിൽ ‘നിങ്ങളെത്തന്നെ താഴ്ത്തുകയും’ അഥവാ ‘സ്വയം നിഷേധിക്കുകയും’.
    reason: എബ്രായ പ്രയോഗത്തിന്റെ സാധുവായ അർഥവ്യാപ്തി സൂചിപ്പിക്കാൻ.
  - marker: c
    text: ഈ എബ്രായപദത്തെ ‘ഭോജനയാഗം’ എന്നും മനസ്സിലാക്കാം; അഗ്നിയിൽ ദഹിപ്പിച്ച് ദൈവത്തിനു സമർപ്പിക്കുന്ന യാഗത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: ആരാധനാപരമായ സാങ്കേതികപദത്തിന്റെ പകരവ്യാഖ്യാനം വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻപത്തെ ഉത്സവനിർദേശങ്ങളിൽനിന്നുള്ള നിയന്ത്രകവും ഊന്നൽ നൽകുന്നതുമായ മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: ഈ ഏഴാം മാസത്തിന്റെ പത്താം ദിവസം
  rationale: എബ്രായ കാലസൂചനയും ‘ഈ’ എന്ന നിർദേശകപദവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יוֹם הַכִּפֻּרִים
  choice: പാപപരിഹാരദിനം
  rationale: മലയാളത്തിൽ സ്വാഭാവികവും തിരിച്ചറിയാവുന്നതുമായ ഉത്സവനാമം; മൂലത്തിലെ ബഹുവചനരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധസഭായോഗം
  rationale: ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടുന്ന വിശുദ്ധസമ്മേളനം എന്ന ആരാധനാപരമായ സാങ്കേതിക അർഥം നൽകുന്നു.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: നിങ്ങൾ നിങ്ങളെത്തന്നെ ക്ലേശിപ്പിക്കുകയും
  rationale: ഉപവാസത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കാതെ സ്വയം നിഷേധിക്കുകയും താഴ്ത്തുകയും ചെയ്യുന്ന വിശാലമായ ആചാരപരവും അനുതാപപരവുമായ ആശയം നിലനിർത്തുന്നു.
- source_word: אִשֶּׁה
  choice: അഗ്നിയർപ്പണം
  rationale: അഗ്നിയുമായി ബന്ധപ്പെട്ട യാഗാർപ്പണം എന്ന പുരോഹിതഭാഷയിലെ പദപ്രയോഗം സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു; മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה-യെ പേരായിത്തന്നെ സുതാര്യമായി മലയാളത്തിലാക്കുന്നു.
theological_decisions:
- issue: ഉത്സവനാമത്തിലെ എബ്രായ ബഹുവചനം
  choice: പ്രധാനവാചകത്തിൽ ‘പാപപരിഹാരദിനം’; അടിക്കുറിപ്പിൽ അക്ഷരാർഥമായ ബഹുവചനം
  alternative: ‘പരിഹാരങ്ങളുടെ ദിവസം’
  rationale: മൂലപാഠത്തിലെ כִּפֻּרִים ബഹുവചനമാണെന്ന വിവരം മറയ്ക്കാതെ, മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ ഉത്സവനാമം പ്രധാനവാചകത്തിൽ ഉപയോഗിക്കുന്നു.
- issue: സ്വയം ക്ലേശിപ്പിക്കൽ എന്ന കല്പനയുടെ വ്യാപ്തി
  choice: നിങ്ങളെത്തന്നെ ക്ലേശിപ്പിക്കുക
  alternative: നിങ്ങളെത്തന്നെ താഴ്ത്തുക / സ്വയം നിഷേധിക്കുക
  rationale: ഇത് ഉപവാസം മാത്രമാണെന്ന് നിർണയിക്കാതെയും കേവലം ആന്തരിക വിനയമായി മയപ്പെടുത്താതെയും എബ്രായ പ്രയോഗത്തിന്റെ ആചാരപരവും അനുതാപപരവുമായ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- issue: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ അർഥം
  choice: അഗ്നിയർപ്പണം
  alternative: ഭോജനയാഗം
  rationale: പദത്തിന്റെ അഗ്നിയുമായി ബന്ധപ്പെട്ട പരമ്പരാഗത ധാരണ പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു; ദൈവത്തിനുള്ള ‘ഭോജനം’ എന്ന പുരോഹിതരൂപകം അടിക്കുറിപ്പിൽ പകരവായനയായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘വിശുദ്ധസഭായോഗം’, ‘അഗ്നിയർപ്പണം’ എന്നീ പദങ്ങൾ ലേവ്യപുസ്തകത്തിന്റെ ആരാധനാപരമായ ഔപചാരികത നിലനിർത്തുന്നു.
