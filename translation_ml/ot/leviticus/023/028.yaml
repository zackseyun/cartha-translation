  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: ml
  text: ഈ ദിവസംതന്നെ നിങ്ങൾ യാതൊരു ജോലിയും ചെയ്യരുത്; കാരണം, നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയുടെ സന്നിധിയിൽ നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം നടത്താനുള്ള പ്രായശ്ചിത്തദിനമാണിത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “പ്രായശ്ചിത്തങ്ങളുടെ ദിവസം.” ഉത്സവത്തിന്റെ പേര് മലയാളത്തിൽ സാധാരണയായി “പ്രായശ്ചിത്തദിനം” എന്നാണ് പറയുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל מְלָאכָה לֹא תַעֲשׂוּ
  choice: നിങ്ങൾ യാതൊരു ജോലിയും ചെയ്യരുത്
  rationale: ഉത്സവദിനത്തിലെ നിയമപരമായ നിരോധനം സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു; מְלָאכָה എന്നത് ഇവിടെ ജോലി അഥവാ തൊഴിൽ എന്ന പൊതുവായ അർഥത്തിലാണ്.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ഈ ദിവസംതന്നെ
  rationale: ആ നിശ്ചിത ദിവസത്തെ ഊന്നിപ്പറയുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള നിരോധനത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יוֹם כִּפֻּרִים
  choice: പ്രായശ്ചിത്തദിവസം
  rationale: സ്ഥാപിതമായ ഉത്സവനാമം നിലനിർത്തുന്നു; എബ്രായത്തിലെ ബഹുവചനരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לְכַפֵּר עֲלֵיכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കാൻ
  rationale: כפר എന്ന ആരാധനാക്രമസംബന്ധിയായ പദത്തിന്റെ അർഥഭാരം നിലനിർത്തുകയും על സൂചിപ്പിക്കുന്ന ഗുണഭോക്തൃബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധിയിലെ ആരാധനാക്രമപരമായ പശ്ചാത്തലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: כפר / כִּפֻּרִים എന്ന ആരാധനാക്രമപദം
  choice: പ്രായശ്ചിത്തം / പ്രായശ്ചിത്തദിവസം
  alternative: പരിഹാരം / ശുദ്ധീകരണദിവസം
  rationale: പദത്തിന്റെ ആരാധനാക്രമപരവും അനുരഞ്ജനപരവുമായ ഭാരം സൂക്ഷിക്കുന്നു; ഒരു പ്രത്യേക പിൽക്കാല പ്രായശ്ചിത്തസിദ്ധാന്തം നിർബന്ധിച്ച് ചേർക്കുന്നില്ല. ബഹുവചനരൂപത്തിന്റെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
