  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാക്രമ ശൈലി. ‘ചെയ്യരുത്’ നിരോധനത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘ഈ ദിവസംതന്നെ’ കാലസൂചനയിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
