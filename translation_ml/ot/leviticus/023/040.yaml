id: LEV.23.40
reference: Leviticus 23:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: ml
  text: ഒന്നാം ദിവസം നിങ്ങൾക്കായി ശോഭയുള്ള വൃക്ഷത്തിന്റെ ഫലവും, ഈന്തപ്പനയോലകളും, തഴച്ചിലയുള്ള വൃക്ഷങ്ങളുടെ കൊമ്പുകളും, നീരൊഴുക്കിനരികിലെ വില്ലോവൃക്ഷങ്ങളും എടുക്കണം. നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയുടെ സന്നിധിയിൽ ഏഴു ദിവസം സന്തോഷിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: നിങ്ങൾക്കായി ... എടുക്കണം
  rationale: നിയമനിർദേശത്തിലെ ആജ്ഞാർഥം ‘എടുക്കണം’ വ്യക്തമാക്കുന്നു; לָכֶם എന്നത് ‘നിങ്ങൾക്കായി’ എന്നു നിലനിർത്തുന്നു.
- source_word: פְּרִי עֵץ הָדָר
  choice: മനോഹരമായ വൃക്ഷങ്ങളുടെ ഫലം
  rationale: הָדָר എന്ന പദത്തിന്റെ ഭംഗി/ശോഭ എന്ന പൊതുവായ അർഥം സംരക്ഷിക്കുന്നു; പിൽക്കാലത്തെ സിട്രൺ തിരിച്ചറിയൽ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: כַּפֹּת תְּמָרִים
  choice: ഈന്തപ്പനയോലകൾ
  rationale: പനയുടെ ഇലക്കൊമ്പുകളെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളം.
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: തഴച്ചിലയുള്ള വൃക്ഷങ്ങളുടെ കൊമ്പുകൾ
  rationale: עָבֹת സൂചിപ്പിക്കുന്ന ഇടതൂർന്ന ഇലച്ചാർത്ത് സാധാരണ വായനക്കാർക്കു വ്യക്തമായി നൽകുന്നു.
- source_word: וְעַרְבֵי נָחַל
  choice: നീരൊഴുക്കിനരികിലെ അരയാലുകൾ
  rationale: עֲרָבָה എന്നത് ജലസമീപത്തു വളരുന്ന willow വർഗത്തെ സൂചിപ്പിക്കുന്നു; ‘അരയാൽ’ മലയാളത്തിലെ സ്ഥാപിതമായ സസ്യനാമപ്രയോഗമാണ്, എന്നാൽ കൃത്യമായ സസ്യതിരിച്ചറിയലിൽ ചെറിയ അനിശ്ചിതത്വമുണ്ട്.
- source_word: וּשְׂמַחְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽ ... നിങ്ങൾ ആനന്ദിക്കണം
  rationale: שׂמח എന്നതിന്റെ സന്തോഷിക്കുക/ആനന്ദിക്കുക എന്ന നേരിട്ടുള്ള അർഥവും לִפְנֵי എന്നതിന്റെ സാന്നിധ്യാർഥവും സംരക്ഷിക്കുന്നു; ദിവ്യനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: എബ്രായ പാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: פְּרִי עֵץ הָדָר എന്നതിന്റെ തിരിച്ചറിയൽ
  choice: മനോഹരമായ വൃക്ഷങ്ങളുടെ ഫലം
  alternative: സിട്രൺ ഫലം (എത്രോഗ്)
  rationale: എബ്രായ വാചകം പൊതുവായതിനാൽ പിൽക്കാല യഹൂദാചാരത്തിലെ പ്രത്യേക തിരിച്ചറിയൽ മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമനിർദേശത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. പട്ടികയിലെ സസ്യവിവരണങ്ങൾ സാങ്കേതികത കുറച്ച് സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
