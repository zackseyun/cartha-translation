revisions:
- from: ഒന്നാം ദിവസം നിങ്ങൾക്കായി മനോഹരമായ വൃക്ഷങ്ങളുടെ ഫലവും[a] ഈന്തപ്പനയോലകളും തഴച്ചിലയുള്ള വൃക്ഷങ്ങളുടെ കൊമ്പുകളും നീരൊഴുക്കിനരികിലെ അരയാലുകളും എടുക്കണം. നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽ ഏഴു ദിവസം നിങ്ങൾ ആനന്ദിക്കണം.
  to: ഒന്നാം ദിവസം നിങ്ങൾക്കായി ശോഭയുള്ള വൃക്ഷത്തിന്റെ ഫലവും, ഈന്തപ്പനയോലകളും, തഴച്ചിലയുള്ള വൃക്ഷങ്ങളുടെ കൊമ്പുകളും, നീരൊഴുക്കിനരികിലെ വില്ലോവൃക്ഷങ്ങളും എടുക്കണം. നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയുടെ സന്നിധിയിൽ ഏഴു ദിവസം സന്തോഷിക്കണം.
