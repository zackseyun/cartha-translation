source:
  edition: WLC
  text: כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹֽשְׁבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/031.yaml
  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: ml
  text: നിങ്ങൾ ഒരു ജോലിയും ചെയ്യരുത്. നിങ്ങളുടെ തലമുറകളിലുടനീളവും നിങ്ങളുടെ എല്ലാ വാസസ്ഥലങ്ങളിലും[b] ബാധകമായ, എന്നേക്കുമുള്ള[a] ഒരു ചട്ടമാണിത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘സ്ഥിരമായ ചട്ടം’ അല്ലെങ്കിൽ ‘ശാശ്വതമായ ചട്ടം.’ എബ്രായത്തിലെ עוֹלָם ദീർഘകാലം തുടരുന്നതോ നിരന്തരമായതോ ആയ കാലദൈർഘ്യം സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘നിങ്ങളുടെ എല്ലാ കുടിയിരിപ്പുകളിലും’ അല്ലെങ്കിൽ ‘നിങ്ങൾ എവിടെ പാർത്താലും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: നിങ്ങൾ ഒരു ജോലിയും ചെയ്യരുത്
  rationale: നിഷേധത്തോടുകൂടിയ כָּל מְלָאכָה എല്ലാത്തരം ജോലികളെയും സമഗ്രമായി വിലക്കുന്നു. മലയാളത്തിലെ ‘ഒരു ജോലിയും ചെയ്യരുത്’ ഈ സമഗ്രത സ്വാഭാവികമായ നിയമഭാഷയിൽ അറിയിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: חֻקַּת עוֹלָם
  choice: എന്നേക്കുമുള്ള ചട്ടം
  rationale: חֻקָּה നിയമപരമായി നിശ്ചയിക്കപ്പെട്ട ചട്ടത്തെയും עוֹלָם ദീർഘകാലമോ നിരന്തരമോ ആയ നിലനിൽപ്പിനെയും സൂചിപ്പിക്കുന്നു. ‘എന്നേക്കുമുള്ള ചട്ടം’ കാലദൈർഘ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; അതിന്റെ പരിധിയെക്കുറിച്ചുള്ള വ്യാഖ്യാനചോദ്യം അടച്ചുപൂട്ടുന്നില്ല.
- source_word: לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകളിലുടനീളം
  rationale: തുടർച്ചയായ തലമുറകളിലേക്കുള്ള ബാധകതയെ സ്വാഭാവികവും കൃത്യവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: നിങ്ങൾ പാർക്കുന്ന എല്ലാ സ്ഥലങ്ങളിലും
  rationale: מוֹשָׁב പാർപ്പിടം, വാസസ്ഥലം, കുടിയിരിപ്പ് എന്നിവയെ സൂചിപ്പിക്കാം. ഈ പരിഭാഷ സ്ഥലപരമായ സമഗ്രത വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ആരാധനാനിയമത്തിലെ עוֹלָם എന്ന കാലദൈർഘ്യപദം
  choice: എന്നേക്കുമുള്ള ചട്ടം
  alternative: സ്ഥിരമായ ചട്ടം / ശാശ്വതമായ ചട്ടം
  rationale: ‘എന്നേക്കുമുള്ള’ എന്നത് മൂലപദത്തിന്റെ തുടരുന്ന കാലദൈർഘ്യം നേരിട്ട് നിലനിർത്തുന്നു; അതിനെ തത്ത്വചിന്താപരമായ പരിപൂർണ അനന്തതയായി നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കുന്നില്ല. പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും യഥാർത്ഥ വ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി. വാക്യത്തിലെ സമഗ്രനിഷേധവും തലമുറ-സ്ഥല വ്യാപ്തിയും വ്യക്തമായി സൂക്ഷിച്ചു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ ബന്ധപ്പെട്ട പ്രയോഗങ്ങൾക്ക് പിന്നാലെ ക്രമമായി നൽകിയിരിക്കുന്നു.
