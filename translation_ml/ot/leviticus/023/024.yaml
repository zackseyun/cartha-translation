id: LEV.23.24
reference: Leviticus 23:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു പറയുക: ഏഴാം മാസത്തിൽ, മാസത്തിന്റെ ഒന്നാം ദിവസം, നിങ്ങൾക്കു ഒരു പൂർണവിശ്രമവും കാഹളനാദത്തോടുകൂടിയ[a] ഒരു സ്മരണാചരണവും വിശുദ്ധ സമ്മേളനവും ഉണ്ടായിരിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉച്ചത്തിലുള്ള നാദത്തോടുകൂടിയ ഒരു സ്മരണാചരണം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ആർപ്പുവിളിയെയോ കൊമ്പ് അല്ലെങ്കിൽ കാഹളനാദം ഉൾപ്പെടെയുള്ള ഉയർന്ന സിഗ്നൽശബ്ദത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ കുടുംബപരമായ സമൂഹനാമത്തിന്റെ രൂപവും ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בְּאֶחָד לַחֹדֶשׁ
  choice: ഏഴാം മാസം, മാസത്തിന്റെ ഒന്നാം ദിവസം
  rationale: എബ്രായ കലണ്ടർപ്രയോഗത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: שַׁבָּתוֹן
  choice: പൂർണവിശ്രമത്തിന്റെ ദിവസം
  rationale: സാധാരണ വേലയിൽനിന്നുള്ള പ്രത്യേകം ആചരിക്കേണ്ട വിരാമത്തെ സൂചിപ്പിക്കുന്നു; ‘ശബ്ബത്ത്’ എന്ന പദവുമായി അനാവശ്യമായി പൂർണമായി സമീകരിക്കുന്നില്ല.
- source_word: זִכְרוֹן
  choice: സ്മരണാചരണം
  rationale: സ്മരണയ്ക്കായി നിശ്ചയിച്ച ആചരണം എന്ന ആരാധനാക്രമപരമായ ആശയം മലയാളത്തിൽ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: תְּרוּעָה
  choice: കാഹളനാദം
  rationale: ഉത്സവകലണ്ടർ പശ്ചാത്തലത്തിൽ കൊമ്പോ കാഹളമോ മുഴക്കുന്ന സിഗ്നൽനാദം സാധ്യതയേറിയതാണ്; എന്നാൽ പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധസഭായോഗം
  rationale: വിശുദ്ധമായി വിളിച്ചുകൂട്ടുന്ന സമൂഹയോഗം എന്ന ആരാധനാക്രമപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: תְּרוּעָה എന്ന പദം സൂചിപ്പിക്കുന്ന ശബ്ദത്തിന്റെ സ്വഭാവം
  choice: കാഹളനാദം
  alternative: ഉച്ചത്തിലുള്ള ആർപ്പുവിളി അല്ലെങ്കിൽ പൊതുവായ സിഗ്നൽശബ്ദം
  rationale: ഈ ഉത്സവപരമായ പശ്ചാത്തലത്തിൽ കാഹളം/കൊമ്പ് മുഴക്കൽ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ ഗ്രഹിക്കലാണ്; എങ്കിലും എബ്രായപദത്തിന്റെ അർഥം അതിൽ മാത്രം ഒതുങ്ങുന്നില്ലെന്നത് അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആരാധനാക്രമഭാഷ. മൂലത്തിലെ നിർദേശാത്മക ശൈലിയും നാമപദനിരയും മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യഘടനയിൽ നിലനിർത്തിയിരിക്കുന്നു.
