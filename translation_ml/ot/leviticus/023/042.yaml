id: LEV.23.42
reference: Leviticus 23:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: ml
  text: ഏഴു ദിവസം നിങ്ങൾ താൽക്കാലിക കുടിലുകളിൽ താമസിക്കണം[a]; ഇസ്രായേലിലെ സ്വദേശികളായ എല്ലാവരും താൽക്കാലിക കുടിലുകളിൽ താമസിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മറപ്പുരകളിൽ’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഉത്സവത്തിനായി ഒരുക്കുന്ന താൽക്കാലിക വാസകുടിലുകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: താത്കാലിക കുടിലുകളിൽ
  rationale: സֻכּוֹת ഉത്സവത്തിനായി ഒരുക്കുന്ന താത്കാലിക വാസകുടിലുകളെ സൂചിപ്പിക്കുന്നു. ‘താത്കാലിക കുടിലുകൾ’ എന്നത് വാക്കിന്റെ ദൃശ്യരൂപവും സന്ദർഭത്തിലെ താത്കാലികതയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: താമസിക്കണം
  rationale: ישׁב എന്ന ക്രിയയ്ക്ക് അടിസ്ഥാനമായി ‘ഇരിക്കുക’ എന്നർഥമുണ്ടെങ്കിലും ഇവിടെ വാസസന്ദർഭത്തിൽ ‘താമസിക്കുക’ എന്നാണ്. കല്പനയുടെ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘താമസിക്കണം’ ഉപയോഗിച്ചു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഏഴു ദിവസം’ എന്നു നൽകാം.
- source_word: כָּל הָאֶזְרָח
  choice: സ്വദേശികളായ എല്ലാവരും
  rationale: אֶזְרָח സമൂഹത്തിലെ സ്വദേശജനത്തെ സൂചിപ്പിക്കുന്നു; ഇത് പിന്നീട് രൂപപ്പെട്ട രാഷ്ട്രീയ ‘പൗരൻ’ എന്ന ആശയം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതെ, പ്രതിനിധിക ഏകവചനത്തിന്റെ പൊതുവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ
  rationale: നിയമം ബാധകമായ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: הָאֶזְרָח എന്ന വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനത്തിന്റെ വ്യാപ്തി
  choice: സ്വദേശികളായ എല്ലാവരും
  alternative: സ്വദേശിയായ ഓരോ പുരുഷനും
  rationale: ഹീബ്രു നാമം വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും ഇവിടെ സമൂഹത്തിലെ സ്വദേശജനത്തെ പ്രതിനിധികമായി സൂചിപ്പിക്കുന്നു. അനാവശ്യമായ പുരുഷപരിമിതി ചേർക്കാതെ അതിന്റെ പൊതുവ്യാപ്തി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കല്പനാശൈലി. ‘പാർക്കണം’ എന്നതിനെക്കാൾ സർവസാധാരണമായ ‘താമസിക്കണം’ സ്വീകരിച്ചു; ആവർത്തനം മൂലപാഠത്തിനനുസരിച്ച് നിലനിർത്തി.
