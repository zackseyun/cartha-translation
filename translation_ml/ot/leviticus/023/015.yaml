  text: וּ/סְפַרְתֶּ֤ם לָ/כֶם֙ מִ/מָּחֳרַ֣ת הַ/שַּׁבָּ֔ת מִ/יּוֹם֙ הֲבִ֣יאֲ/כֶ֔ם אֶת עֹ֖מֶר הַ/תְּנוּפָ֑ה שֶׁ֥בַע שַׁבָּת֖וֹת תְּמִימֹ֥ת תִּהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: ml
  text: 'ശബ്ബത്തിന്റെ പിറ്റേന്ന്, നീരാജനയാഗത്തിന്റെ കറ്റ നിങ്ങൾ കൊണ്ടുവരുന്ന ദിവസംമുതൽ, നിങ്ങൾക്കായി എണ്ണണം: പൂർണമായ ഏഴ് ശബ്ബത്തുകൾ ഉണ്ടായിരിക്കണം.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പൂർണമായ ഏഴ് ആഴ്ചകൾ.” എബ്രായത്തിൽ അക്ഷരാർഥമായി “പൂർണമായ ഏഴ് ശബ്ബത്തുകൾ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: നിങ്ങൾക്കായി എണ്ണണം
  rationale: നിയമനിർദേശസന്ദർഭത്തിലെ ക്രിയയുടെ ആജ്ഞാത്മക ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ “എണ്ണണം” എന്നു നൽകി.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കായി
  rationale: ദാതൃക സർവനാമത്തിന്റെ വ്യക്തിപരമായ ഊന്നൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ അസ്വാഭാവികമായ അതിരുകടന്ന പ്രതിഫലനപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: ശബ്ബത്തിന്റെ പിറ്റേന്ന്
  rationale: ആരംഭദിവസത്തെ സമയബന്ധം വ്യക്തമായി നൽകുകയും שַׁבָּת എന്ന ആരാധനാപരമായ പദം “ശബ്ബത്ത്” ആയി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: നിങ്ങൾ കൊണ്ടുവരുന്ന ദിവസംമുതൽ
  rationale: എണ്ണലിന്റെ ആരംഭബിന്ദു വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עֹמֶר
  choice: കറ്റ
  rationale: ഇവിടെ അളവിനേക്കാൾ ആചാരപരമായി അർപ്പിക്കുന്ന ധാന്യക്കറ്റയാണ് ഉദ്ദേശിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് സുതാര്യമായ പദം.
- source_word: הַתְּנוּפָה
  choice: നീരാജനയാഗം
  rationale: യഹോവയുടെ സന്നിധിയിൽ ചലിപ്പിച്ച് സമർപ്പിക്കുന്ന പ്രത്യേക അർപ്പണത്തെ സൂചിപ്പിക്കുന്ന മലയാള ബൈബിൾപരമ്പരയിലെ പരിചിതമായ ആരാധനാപദം; പൊതുവായ “സമർപ്പണയാഗം” എന്നതിനെക്കാൾ ആചാരവിശേഷം നിലനിർത്തുന്നു.
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: ഏഴ് ശബ്ബത്തുകൾ
  rationale: എബ്രായ പാഠം സാധാരണ ‘ആഴ്ചകൾ’ എന്ന പദത്തിനു പകരം ശബ്ബത്ത് എന്ന പദം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ കലണ്ടർസംബന്ധമായ വ്യാഖ്യാനവൈവിധ്യം മുഖ്യപാഠത്തിൽ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: תְּמִימֹת
  choice: പൂർണമായ
  rationale: കാലഗണനയിൽ ധാർമ്മിക പരിപൂർണതയല്ല, മുഴുവൻ കാലചക്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תִּהְיֶינָה
  choice: ഉണ്ടായിരിക്കണം
  rationale: അസ്തിത്വപരമായ വാക്യഘടനയും നിർദേശത്തിന്റെ ബലവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
theological_decisions:
- issue: കലണ്ടർ നിർദേശത്തിലെ שַׁבָּת / שַׁבָּתוֹת എന്ന പദത്തിന്റെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ “ശബ്ബത്ത് / ശബ്ബത്തുകൾ” നിലനിർത്തി.
  alternative: എണ്ണപ്പെടുന്ന ഏഴുദിവസ കാലഘട്ടങ്ങളെ സൂചിപ്പിക്കാൻ “ആഴ്ച / ആഴ്ചകൾ” എന്നു വിവർത്തനം ചെയ്യാം.
  rationale: എബ്രായത്തിൽ ശബ്ബത്ത് എന്ന പദം വ്യക്തമായി വരുന്നു. എണ്ണൽ ഏതു ദിവസം തുടങ്ങുന്നു, ബഹുവചനം ഇവിടെ ‘ആഴ്ചകൾ’ എന്ന അർഥത്തിൽ പ്രയോഗിച്ചിട്ടുണ്ടോ എന്നീ ദീർഘകാല വ്യാഖ്യാനപ്രശ്നങ്ങൾ വിവർത്തനത്തിൽ നിശ്ശബ്ദമായി തീർപ്പാക്കാതെ, സാധാരണ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമനിർദേശശൈലി. ആരാധനാപരമായ പ്രധാന പദമായ “ശബ്ബത്ത്” നിലനിർത്തി; תְּנוּפָהയ്ക്ക് മലയാള ബൈബിൾവായനയിൽ പരിചിതമായ “നീരാജനയാഗം” ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
