id: LEV.23.8
reference: Leviticus 23:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַ/יהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הַ/שְּׁבִיעִי֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: ml
  text: ഏഴു ദിവസവും നിങ്ങൾ യാഹ്‌വെക്കു തീയിൽ അർപ്പിക്കുന്ന വഴിപാട് അർപ്പിക്കണം.[a] ഏഴാം ദിവസം വിശുദ്ധ സമ്മേളനം ഉണ്ടായിരിക്കണം; അധ്വാനമുള്ള ഒരു ജോലിയും ചെയ്യരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭക്ഷണവഴിപാട്.”
    reason: אִשֶּׁה എന്ന പുരോഹിതയാഗപദത്തിന് ‘തീയിൽ അർപ്പിക്കുന്ന വഴിപാട്’ എന്നതാണ് കൂടുതൽ നേരിട്ടുള്ള അർഥം; ചില ആധുനിക പരിഭാഷകൾ അതിനെ ‘ഭക്ഷണവഴിപാട്’ എന്നും നൽകുന്നു.
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: നിങ്ങൾ അർപ്പിക്കണം
  rationale: ഹിഫിൽ രൂപം യാഗസന്ദർഭത്തിൽ ഒരു വഴിപാട് അടുത്തുകൊണ്ടുവന്ന് സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അർപ്പിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אִשֶּׁה
  choice: ദഹനയാഗം
  rationale: ഈ പുരോഹിതഭാഷാപദം തീയിൽ അർപ്പിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്നു. ‘ദഹനയാഗം’ വായനാസൗകര്യമുള്ള തിരഞ്ഞെടുപ്പാണ്; എന്നാൽ ഇത് പ്രത്യേക യാഗവിഭാഗമായ עֹלָהയുമായി തെറ്റിദ്ധരിക്കപ്പെടാൻ സാധ്യതയുള്ളതിനാൽ കൂടുതൽ പദാനുപദമായ അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ל സമർപ്പണത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; ദൈവനാമം പദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസവും
  rationale: ഏഴു ദിവസങ്ങളിലുടനീളം യാഗം അർപ്പിക്കണമെന്ന കാലദൈർഘ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: നേരിട്ടുള്ള കാലസൂചന.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധസഭായോഗം
  rationale: വിശുദ്ധമായ ഔദ്യോഗിക വിളിച്ചുകൂട്ടലിനെ സൂചിപ്പിക്കുന്ന ഉത്സവസാങ്കേതികപ്രയോഗം; ‘സഭായോഗം’ വിളിച്ചുകൂട്ടലിന്റെയും കൂട്ടായ്മയുടെയും ആശയം നിലനിർത്തുന്നു.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: പതിവുള്ള അധ്വാനജോലിയൊന്നും
  rationale: എല്ലാത്തരം പ്രവൃത്തിയും എന്നതിലുപരി സാധാരണ തൊഴിൽപരമായ അധ്വാനമാണ് നിരോധിക്കപ്പെടുന്നത്; ഈ പരിധി മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא תַעֲשׂוּ
  choice: ചെയ്യരുത്
  rationale: ബഹുവചനത്തിലുള്ള നേരിട്ടുള്ള നിരോധനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ നിലനിർത്തുന്നു. ആധുനിക പണ്ഡിതപരമായ ‘യാഹ്‌വെ’ എന്ന രൂപം സാധ്യമാണെങ്കിലും സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ തിരഞ്ഞെടുത്തു.
- issue: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ പരിധി
  choice: ദഹനയാഗം, അടിക്കുറിപ്പോടെ
  alternative: തീയിൽ അർപ്പിക്കുന്ന വഴിപാട്
  rationale: പദം തീയിൽ അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു; അത് പ്രത്യേകമായി സമ്പൂർണഹോമയാഗം മാത്രമാണെന്ന് നിർണ്ണയിക്കാതെ പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമ-ആരാധനാഭാഷ ഉപയോഗിച്ചു. ‘വിശുദ്ധസഭായോഗം’ ഉത്സവസംബന്ധമായ ഔദ്യോഗിക വിളിച്ചുകൂട്ടലിനെയും ‘പതിവുള്ള അധ്വാനജോലി’ നിരോധനത്തിന്റെ നിയന്ത്രിത പരിധിയെയും വ്യക്തമാക്കുന്നു.
