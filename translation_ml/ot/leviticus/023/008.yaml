  to: ഏഴു ദിവസവും നിങ്ങൾ യാഹ്‌വെക്കു തീയിൽ അർപ്പിക്കുന്ന വഴിപാട് അർപ്പിക്കണം.[a] ഏഴാം ദിവസം വിശുദ്ധ സമ്മേളനം ഉണ്ടായിരിക്കണം; അധ്വാനമുള്ള ഒരു ജോലിയും ചെയ്യരുത്.
  rationale: പ്രത്യേക ‘ദഹനയാഗം’ എന്ന തെറ്റിദ്ധരിപ്പിക്കാവുന്ന നിർണ്ണയം ഒഴിവാക്കി אִשֶּׁהയുടെ വിശാലമായ യാഗാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി. യഹോവനാമത്തിന്റെ രൂപം ഇംഗ്ലീഷ് POB തീരുമാനത്തോടു ചേർത്ത് ‘യാഹ്‌വെ’ ആക്കി. മִקְרָא קֹדֶשׁ, മְלֶאכֶת עֲבֹדָה എന്നിവയുടെ ഉത്സവ-നിയമപരമായ അർഥപരിധിയും നിലനിർത്തിയിരിക്കുന്നു.
