  terminology: יהוהയെ ‘യാഹ്‌വെ’ എന്നു നൽകിയിരിക്കുന്നു; ഇത് നൽകിയ ഇംഗ്ലീഷ് POB തീരുമാനവുമായി യോജിക്കുന്നു. אִשֶּׁהയെ ‘തീയിൽ അർപ്പിക്കുന്ന വഴിപാട്’ എന്നു പരിഭാഷപ്പെടുത്തിയത് അതിനെ ഹോമയാഗമായി പരിമിതപ്പെടുത്താതെ യാഗപരമായ അർഥം നിലനിർത്തുന്നു.
