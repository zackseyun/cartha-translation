  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: ml
  text: അപ്പത്തോടൊപ്പം[a] ഒരു വയസ്സുള്ള, ഊനമില്ലാത്ത ഏഴ് ആൺകുഞ്ഞാടുകളെയും കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളയെയും രണ്ട് ആട്ടുകൊറ്റന്മാരെയും നിങ്ങൾ അർപ്പിക്കണം. അവ അവയുടെ ധാന്യയാഗത്തോടും പാനീയയാഗങ്ങളോടുംകൂടെ യഹോവയ്ക്കുള്ള ഹോമയാഗമായിരിക്കണം—യഹോവയ്ക്കു പ്രസാദകരമായ സുഗന്ധമുള്ള, തീയിൽ അർപ്പിക്കുന്ന യാഗം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അപ്പത്തിനരികെ’ എന്നും ‘അപ്പത്തിനു പുറമേ’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായ ബന്ധപദം ഇവിടെ കൂടെയുണ്ടാകുന്നതിനെയോ അധികമായി അർപ്പിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അഗ്നിയർപ്പണം’; എബ്രായപദം തീയിൽ അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: നിങ്ങൾ അർപ്പിക്കണം
  rationale: ഹിഫിൽ രൂപം യാഗസന്ദർഭത്തിൽ അർപ്പണവസ്തു അടുത്തുകൊണ്ടുവന്ന് സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അർപ്പിക്കണം’ സ്വാഭാവികവും ആചാരപരമായ അർത്ഥത്തിന് യോജിച്ചതുമാണ്.
- source_word: עַל הַלֶּחֶם
  choice: അപ്പത്തോടൊപ്പം
  rationale: עַל ഇവിടെ ഭൗതികമായി ‘അപ്പത്തിന്മേൽ’ എന്നതിലുപരി മുമ്പ് പറഞ്ഞ അപ്പയാഗത്തോടൊപ്പമുള്ള അനുബന്ധ അർപ്പണത്തെ സൂചിപ്പിക്കുന്നു; യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: ഒരു വയസ്സുള്ള, ഊനമില്ലാത്ത ഏഴ് ആൺകുഞ്ഞാടുകൾ
  rationale: כְּבָשִׂים എന്ന പുല്ലിംഗരൂപവും യാഗപ്പട്ടികയുടെ കൃത്യതയും ‘ആൺകുഞ്ഞാടുകൾ’ പിന്തുണയ്ക്കുന്നു; תְּמִימִם എന്ന സാങ്കേതിക യാഗപദത്തിന് ‘ഊനമില്ലാത്ത’ വ്യക്തവും പതിവുമായ തുല്യപദമാണ്.
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള
  rationale: പദപ്രയോഗം കന്നുകാലിവർഗത്തിൽപ്പെട്ട ഒരു കാളയെ സൂചിപ്പിക്കുന്നു; പ്രായത്തെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ മൂലത്തിന്റെ ഘടന പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְאֵילִם שְׁנָיִם
  choice: രണ്ട് ആട്ടുകൊറ്റന്മാർ
  rationale: אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ, അഥവാ ram-നെ, കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: יִהְיוּ עֹלָה לַיהוָה
  choice: അവ യഹോവയ്ക്കുള്ള ഹോമയാഗമായിരിക്കണം
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തിന്റെ സാങ്കേതിക നാമമാണ്; ഏകവചനരൂപം പട്ടികപ്പെടുത്തിയ മൃഗങ്ങളെ കൂട്ടമായി വിശേഷിപ്പിക്കുന്നു.
- source_word: וּמִנְחָתָם וְנִסְכֵּיהֶם
  choice: അവയുടെ ധാന്യയാഗത്തോടും പാനീയയാഗങ്ങളോടുംകൂടെ
  rationale: മൃഗയാഗങ്ങളോടനുബന്ധിച്ച ധാന്യയാഗവും ഒഴിച്ചർപ്പിക്കുന്ന പാനീയയാഗങ്ങളും മലയാളത്തിൽ വ്യക്തമായി വേർതിരിക്കുന്നു; എബ്രായത്തിലെ ഏകവചന-ബഹുവചന വ്യത്യാസവും സൂക്ഷിക്കുന്നു.
- source_word: אִשֵּׁה
  choice: ദഹനയാഗം
  rationale: ഈ പദത്തിന്റെ തീയിൽ അർപ്പിക്കപ്പെടുന്ന യാഗം എന്ന അടിസ്ഥാനഘടകം നിലനിർത്തുന്നു; ‘ഭോജനയാഗം’ എന്നു വിവർത്തനം ചെയ്ത് മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത ഭക്ഷണധാരണ മുന്നോട്ടുവയ്ക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധം
  rationale: ദൈവത്തിന് അംഗീകരിക്കപ്പെടുന്നതും പ്രസാദകരവുമായ യാഗസുഗന്ധത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: יהוה എന്ന ഉടമ്പടിനാമം പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവി ഉപയോഗിച്ച് പകരംവയ്ക്കാതെ വ്യക്തിനാമം ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: אִשֵּׁה എന്ന യാഗപദത്തിന്റെ അർത്ഥം
  choice: ദഹനയാഗം
  alternative: ഭോജനയാഗം
  rationale: തീയിൽ അർപ്പിക്കുന്നതെന്ന മൂലപദത്തിന്റെ വ്യക്തമായ ഘടകം സംരക്ഷിക്കുന്നു; ദൈവം ഭക്ഷണം ആവശ്യപ്പെടുന്നു എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം യാഗസാങ്കേതിക പദങ്ങൾ സ്ഥിരതയോടെ ഉപയോഗിച്ചു. പട്ടികയുടെ ഔപചാരിക ഭാവം നിലനിർത്തിയെങ്കിലും അതിപുരാതനമായ വാക്യഘടന ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
