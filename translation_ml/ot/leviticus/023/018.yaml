- from: അപ്പത്തോടൊപ്പം[a] ഒരു വയസ്സുള്ള, ഊനമില്ലാത്ത ഏഴ് ആൺകുഞ്ഞാടുകളെയും കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളയെയും രണ്ട് ആട്ടുകൊറ്റന്മാരെയും നിങ്ങൾ അർപ്പിക്കണം. അവ അവയുടെ ധാന്യയാഗത്തോടും പാനീയയാഗങ്ങളോടുംകൂടെ യഹോവയ്ക്കുള്ള ഹോമയാഗമായിരിക്കണം—യഹോവയ്ക്കു പ്രസാദകരമായ സുഗന്ധമുള്ള ദഹനയാഗം[b].
  to: അപ്പത്തോടൊപ്പം[a] ഒരു വയസ്സുള്ള, ഊനമില്ലാത്ത ഏഴ് ആൺകുഞ്ഞാടുകളെയും കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാളയെയും രണ്ട് ആട്ടുകൊറ്റന്മാരെയും നിങ്ങൾ അർപ്പിക്കണം. അവ അവയുടെ ധാന്യയാഗത്തോടും പാനീയയാഗങ്ങളോടുംകൂടെ യഹോവയ്ക്കുള്ള ഹോമയാഗമായിരിക്കണം—യഹോവയ്ക്കു പ്രസാദകരമായ സുഗന്ധമുള്ള, തീയിൽ അർപ്പിക്കുന്ന യാഗം[b].
  rationale: The revision changes only the final sacrificial designation so that אִשֵּׁה is not conflated with עֹלָה. It retains the draft’s accurate rendering of the list of animals, the accompanying-offering sense of עַל הַלֶּחֶם, the direct rendering ‘യഹോവ,’ and both footnote anchors.
