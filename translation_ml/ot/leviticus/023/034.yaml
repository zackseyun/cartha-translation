language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֲמִשָּׁ֨ה עָשָׂ֜ר י֗וֹם לַ/חֹ֤דֶשׁ הַ/שְּׁבִיעִי֙ הַ/זֶּ֔ה חַ֧ג הַ/סֻּכּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים לַ/יהֹוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കളോടു ഇപ്രകാരം പറയുക: ‘ഈ ഏഴാം മാസത്തിലെ പതിനഞ്ചാം ദിവസം യാഹ്‌വേയ്ക്കുള്ള കുടിലുകളുടെ പെരുന്നാൾ ഏഴു ദിവസത്തേക്കാണ്.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: ഇസ്രായേൽമക്കളോടു പറയുക
  rationale: ഹീബ്രു കല്പനാശൈലിയും ‘ഇസ്രായേൽമക്കൾ’ എന്ന സൂത്രവാക്യപരമായ സമൂഹനാമവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. לֵאמֹר എന്ന ഉദ്ധരണി-ആമുഖത്തിന്റെ പ്രവർത്തനം തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകൾകൊണ്ട് വ്യക്തമാകുന്നതിനാൽ വേറിട്ട് ‘ഇപ്രകാരം പറഞ്ഞുകൊൾക’ എന്നു ആവർത്തിച്ചിട്ടില്ല.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: ഈ ഏഴാം മാസത്തിലെ പതിനഞ്ചാം ദിവസംമുതൽ
  rationale: തീയതിയുടെ കൃത്യതയും ‘ഈ’ എന്ന നിർദ്ദേശകപദവും നിലനിർത്തുന്നു. പെരുന്നാളിന്റെ ഏഴുദിവസത്തെ ദൈർഘ്യം സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ദിവസംമുതൽ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: חַג הַסֻּכּוֹת
  choice: കുടിലുകളുടെ പെരുന്നാൾ
  rationale: סֻכּוֹת താൽക്കാലിക കുടിലുകളെയോ അഭയകൂടുകളെയോ സൂചിപ്പിക്കുന്നു. ‘കുടിലുകളുടെ പെരുന്നാൾ’ മൂലപദത്തിന്റെ ദൃശ്യവും സാധാരണ വായനക്കാർക്കുള്ള സുതാര്യതയും കാത്തുസൂക്ഷിക്കുന്നു; പരിചിതമായ പരമ്പരാഗത നാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: പെരുന്നാളിന്റെ ദൈർഘ്യം നേരിട്ട്, സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: ל എന്ന ഉപസർഗം ഇവിടെ പെരുന്നാൾ യഹോവയ്ക്കായി സമർപ്പിക്കപ്പെട്ടതാണെന്ന ബന്ധം സൂചിപ്പിക്കുന്നു. ദൈവനാമം പൊതുപദവിയാക്കി മാറ്റാതെ ‘യഹോവ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: סֻכּוֹת എന്ന പെരുന്നാളിന്റെ പേര്
  choice: കുടിലുകളുടെ പെരുന്നാൾ
  alternative: കൂടാരപ്പെരുന്നാൾ
  rationale: പ്രധാനപാഠത്തിൽ ഹീബ്രു പദത്തിന്റെ അടിസ്ഥാന അർഥം സുതാര്യമാക്കുന്നു; പരിചിതമായ പരമ്പരാഗത നാമം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. ലേവ്യപുസ്തകത്തിലെ നിയമഭാഷയുടെ ഔപചാരികത നിലനിർത്തുമ്പോഴും അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
