  edition: WLC
  text: מִ/לְּ/בַ֖ד שַׁבְּתֹ֣ת יְּהוָ֑ה וּ/מִ/לְּ/בַ֣ד מַתְּנֽוֹתֵי/כֶ֗ם וּ/מִ/לְּ/בַ֤ד כָּל נִדְרֵי/כֶם֙ וּ/מִ/לְּ/בַד֙ כָּל נִדְב֣וֹתֵי/כֶ֔ם אֲשֶׁ֥ר תִּתְּנ֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: ml
  text: യഹോവയുടെ ശബ്ബത്തുകൾക്കു പുറമേയും, നിങ്ങളുടെ ദാനങ്ങൾക്കു പുറമേയും, നിങ്ങളുടെ എല്ലാ നേർച്ചകൾക്കു പുറമേയും, നിങ്ങൾ യഹോവയ്ക്കു നൽകുന്ന നിങ്ങളുടെ എല്ലാ സ്വമേധയാ ഉള്ള വഴിപാടുകൾക്കു പുറമേയും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: പുറമേ
  rationale: ഉത്സവങ്ങളോടനുബന്ധിച്ച അർപ്പണങ്ങൾ ശബ്ബത്തുകളുടെയും മറ്റു ദാനങ്ങളുടെയും നേർച്ചകളുടെയും സ്വമേധാവഴിപാടുകളുടെയും സ്ഥാനത്ത് വരുന്നതല്ലെന്നും അവയ്ക്കു പുറമേയാണെന്നും സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നു; ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമാകുന്ന വിധത്തിൽ നിലനിർത്തി.
- source_word: שַׁבְּתֹת יְהוָה
  choice: യഹോവയുടെ ശബ്ബത്തുകൾ
  rationale: എബ്രായ ബഹുവചനവും യഹോവയുടെ നാമത്തോടുള്ള construct ബന്ധവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുർവർണ ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നൽകുന്നു.
- source_word: מַתְּנוֹתֵיכֶם
  choice: നിങ്ങളുടെ ദാനങ്ങൾ
  rationale: ദൈവത്തിനു നൽകുന്ന സമ്മാനങ്ങളെയോ ദാനങ്ങളെയോ സൂചിപ്പിക്കുന്ന വിശാലമായ അർഥം അധികവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: כָּל נִדְרֵיכֶם
  choice: നിങ്ങളുടെ എല്ലാ നേർച്ചകൾ
  rationale: נֶדֶר എന്നത് നേർച്ചയെയോ നേർന്ന വസ്തുവിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ വഴിപാടുകളുടെ പട്ടികയിലുള്ളതിനാൽ 'നേർച്ചകൾ' ആ അർഥവ്യാപ്തി തുറന്നുവെക്കുന്നു.
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: നിങ്ങളുടെ എല്ലാ സ്വമേധയാ അർപ്പിക്കുന്ന വഴിപാടുകൾ
  rationale: യാഗാർപ്പണസന്ദർഭത്തിലെ נְדָבָהയുടെ സ്വമേധാസ്വഭാവവും വഴിപാടെന്ന ആശയവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: നിങ്ങൾ യഹോവയ്ക്ക് നൽകുന്നവയാണിവ
  rationale: נתן എന്ന ക്രിയയുടെ ലളിതമായ 'നൽകുക' എന്ന അർഥം സൂക്ഷിക്കുകയും ആപേക്ഷികവാക്യം പട്ടികയിലെ ദാനവിഭാഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുപദവിയായ 'കർത്താവ്' എന്നതിനു പകരം മലയാളത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- issue: מִלְּבַד സൂചിപ്പിക്കുന്ന ബന്ധം
  choice: പുറമേ
  alternative: ഒഴികെ
  rationale: ഈ ഉത്സവാർപ്പണങ്ങൾ ശബ്ബത്തുകളെയും വ്യക്തിപരമായ ദാനങ്ങളെയും മാറ്റിസ്ഥാപിക്കുന്നുവെന്ന അർഥം ഒഴിവാക്കി, അവയ്ക്കു പുറമേ ചേർക്കപ്പെടുന്നവയെന്ന സന്ദർഭാർഥം മുൻനിർത്തി; പദത്തിന്റെ 'വേറിട്ട്/ഒഴികെ' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. എബ്രായത്തിലെ പട്ടികാസ്വഭാവവും ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തി; അവസാന ആപേക്ഷികവാക്യം മലയാളത്തിൽ അസ്പഷ്ടത കുറയ്ക്കാൻ സ്വതന്ത്രമായ സമാപനമായി നൽകി.
