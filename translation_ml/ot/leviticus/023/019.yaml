id: LEV.23.19
reference: Leviticus 23:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֛ם שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּ֑את וּ/שְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְ/זֶ֥בַח שְׁלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: ml
  text: നിങ്ങൾ പാപയാഗമായി ഒരു ആൺകോലാടിനെയും[a], സമാധാനയാഗത്തിനായി ഒരു വയസ്സുള്ള രണ്ട് ആൺകുഞ്ഞാടുകളെയും[b] അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാപയാഗം’ എന്നതിന് ‘ശുദ്ധീകരണയാഗം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സമാധാനയാഗം’ എന്നതിന് ‘കൂട്ടായ്മയാഗം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: നിങ്ങൾ ... അർപ്പിക്കണം
  rationale: പദശഃ ‘ചെയ്യുക/ഒരുക്കുക’ എന്നാണെങ്കിലും, നിർദിഷ്ട മൃഗങ്ങളെയും യാഗവിഭാഗങ്ങളെയും കുറിച്ചുള്ള ഈ ബലിസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക’ എന്നത് സ്വാഭാവികവും ആശയകൃത്യവുമാണ്.
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: ഒരു ആൺകോലാട്
  rationale: ആടിന്റെ ഇനവും ആൺലിംഗവും ഏകവചനവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗമായി
  rationale: ലേവ്യപുസ്തകത്തിലെ ബലിനിയമങ്ങളിൽ חַטָּאת സൂചിപ്പിക്കുന്ന പരമ്പരാഗത യാഗവിഭാഗത്തെ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ ഭാഷയിൽ നൽകുന്നു; ‘ശുദ്ധീകരണയാഗം’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וּשְׁנֵי כְבָשִׂים
  choice: രണ്ട് ആൺകുഞ്ഞാടുകളെ
  rationale: സംഖ്യയും ബലിക്കായി നിർദേശിച്ച കുഞ്ഞാടുകളുടെ ആൺലിംഗസൂചനയും വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי שָׁנָה
  choice: ഒരു വയസ്സുള്ള
  rationale: ഒരു വയസ്സ് പ്രായമുള്ള മൃഗങ്ങൾ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לְזֶבַח שְׁלָמִים
  choice: സമാധാനയാഗബലിയായി
  rationale: זֶבַח എന്ന ബലി ആശയവും שְׁלָמִים എന്ന യാഗവിഭാഗവും ചുരുക്കമായും ഉറവിടത്തോട് അടുത്തും പ്രകടിപ്പിക്കുന്നു; മറ്റൊരു വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ബലിനിയമങ്ങളിൽ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: പാപയാഗം എന്നത് വ്യാപകമായി മനസ്സിലാക്കപ്പെടുന്ന പരമ്പരാഗത യാഗനാമമാണ്. എന്നാൽ പദത്തിന്റെ ശുദ്ധീകരണപരമായ പ്രവർത്തനത്തെ ഊന്നുന്ന വിവർത്തനം തള്ളിക്കളയാതെ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ വിവർത്തനം
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം
  rationale: സമാധാനയാഗം എന്നത് ഉറവിടപദത്തോടും സ്ഥാപിതമായ യാഗനാമത്തോടും കൂടുതൽ അടുത്തതാണ്. ‘കൂട്ടായ്മയാഗം’ അതിന്റെ പങ്കാളിത്തസ്വഭാവത്തെ വ്യാഖ്യാനാത്മകമായി ഊന്നുന്നതിനാൽ ബദൽരൂപമായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ബലിനിയമത്തിന് യോജിച്ച ഗൗരവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വ്യക്തതയും നിലനിർത്തി. വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കുമ്പോഴും മൃഗങ്ങളുടെ എണ്ണം, ലിംഗം, പ്രായം, യാഗവിഭാഗങ്ങൾ എന്നിവ സംരക്ഷിച്ചു.
