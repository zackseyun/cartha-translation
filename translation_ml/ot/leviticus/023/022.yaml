  source_fidelity: 'പ്രധാന അർഥം വിശ്വസ്തമായി കൈമാറിയിട്ടുണ്ട്: കൊയ്ത്തിന്റെ അരിക് മുഴുവൻ കൊയ്യാതിരിക്കൽ, ശേഷിപ്പുകൾ പെറുക്കാതിരിക്കൽ, അവ ദരിദ്രർക്കും ഗേറിനും വിട്ടുകൊടുക്കൽ, യഹ്‌വേയുടെ സ്വയംപരിചയം എന്നിവ എല്ലാം നിലനിൽക്കുന്നു. ലെകെത് എന്നത് കൊയ്ത്തിലെ/കൊയ്ത്തിൽ വീണ ശേഷിപ്പുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ചിതറിവീണവ’ സ്വീകാര്യമാണ്, എങ്കിലും ‘ശേഷിപ്പുകൾ’ ചേർക്കുന്നത് നിയമസന്ദർഭം കൂടുതൽ വ്യക്തമായി നൽകുന്നു.'
  naturalness: ‘കൊയ്ത്തിൽ ചിതറിവീണവ പെറുക്കുകയും അരുത്’ എന്ന ഘടന ആധുനിക നിലവാരമലയാളത്തിൽ വ്യാകരണപരമായി അസ്വാഭാവികമാണ്. ‘… പെറുക്കരുത്’ എന്നു നേരിട്ട് പറയണം. അവസാന കല്പനയിൽ ‘അവ അവർക്കായി വിട്ടേക്കണം’ എന്നതിനുപകരം ‘അവ അവർക്കായി വിട്ടുകൊടുക്കണം’ നിയമഭാഷയിൽ കൂടുതൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
  terminology: ‘അരിക്’ פאהയ്ക്കു യോജിച്ച വിശാലമായ പദമാണ്; അടിക്കുറിപ്പിലെ ‘വശം/മൂല’ എന്ന ബദലുകളും സഹായകമാണ്. גר-നുള്ള ‘നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശി’ സന്ദർഭോചിതമാണ്; അടിക്കുറിപ്പ് അതിന്റെ താമസക്കാരൻ എന്ന നിയമ-സാമൂഹിക ഭാവം വ്യക്തമാക്കുന്നു. ‘യഹ്‌വേ’ യഹ്‌വേ എന്ന നാമത്തിന്റെ നേരിട്ടുള്ള ലിപ്യന്തരണമായി യോജിക്കുന്നു.
  issues:
  - severity: medium
    issue: നിഷേധവാക്യത്തിന്റെ വ്യാകരണഘടന അസ്വാഭാവികമാണ്.
    rationale: ‘പെറുക്കുകയും അരുത്’ എന്നതിനു പകരം ‘പെറുക്കരുത്’ വേണം; ഇതു കല്പനയുടെ അർഥം മാറ്റാതെ വ്യക്തമായ മലയാളമാക്കുന്നു.
  - severity: low
    issue: ലെകെത്തിന്റെ വിവരണം അല്പം കൂടുതൽ വ്യക്തത ആവശ്യപ്പെടുന്നു.
    rationale: ‘ചിതറിവീണവ’ സാധുവാണെങ്കിലും ‘കൊയ്ത്തിൽ ചിതറിവീണ ശേഷിപ്പുകൾ’ എന്നു പറയുമ്പോൾ വിളവെടുപ്പിനുശേഷം ശേഖരിക്കാവുന്ന ശേഷിപ്പുകൾ എന്ന നിയമപരമായ ആശയം കൂടുതൽ സുതാര്യമാകും.
  revised_text: നിങ്ങൾ നിങ്ങളുടെ ദേശത്തിലെ വിളവു കൊയ്യുമ്പോൾ, നിങ്ങളുടെ വയലിന്റെ അരിക്[a] മുഴുവനായി കൊയ്തുതീർക്കരുത്; നിങ്ങളുടെ കൊയ്ത്തിൽ ചിതറിവീണ ശേഷിപ്പുകൾ പെറുക്കരുത്. അവ ദരിദ്രനും നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശിക്കും[b] വിട്ടുകൊടുക്കണം. ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു.
  revised_footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘വശം’ അഥവാ ‘മൂല.’ എബ്രായപദത്തിന് വയലിന്റെ അരിക്, വശം, മൂല എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘താമസക്കാരനായ പരദേശി.’ ഇസ്രായേലിന്റെ ഇടയിൽ പാർക്കുകയും അവിടത്തെ സാമൂഹിക-നിയമപരമായ സംരക്ഷണം ലഭിക്കുകയും ചെയ്തിരുന്ന ഇസ്രായേലേതര വ്യക്തിയെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  revision_rationale: വ്യാകരണപരമായി അസ്വാഭാവികമായ ‘പെറുക്കുകയും അരുത്’ എന്ന പ്രയോഗം ‘പെറുക്കരുത്’ എന്നു തിരുത്തി. ലെകെത്തിന്റെ കാർഷിക-നിയമപരമായ സൂചന വ്യക്തമാക്കാൻ ‘ശേഷിപ്പുകൾ’ ചേർത്തു; ഇതു മൂലപാഠത്തിലെ അർഥം വികസിപ്പിക്കാതെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. മറ്റെല്ലാ പദതെരഞ്ഞെടുപ്പുകളും, അടിക്കുറിപ്പ് ആങ്കറുകളും, യഹ്‌വേ എന്ന ദൈവനാമവും നിലനിർത്തിയിരിക്കുന്നു.
