id: LEV.23.22
reference: Leviticus 23:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: ml
  text: നിങ്ങൾ നിങ്ങളുടെ ദേശത്തിലെ വിളവു കൊയ്യുമ്പോൾ, നിങ്ങളുടെ വയലിന്റെ അരിക്[a] മുഴുവനായി കൊയ്തുതീർക്കരുത്; നിങ്ങളുടെ കൊയ്ത്തിൽ ചിതറിവീണ ശേഷിപ്പുകൾ പെറുക്കരുത്. അവ ദരിദ്രനും നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശിക്കും[b] വിട്ടുകൊടുക്കണം. ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘വശം’ അഥവാ ‘മൂല.’ എബ്രായപദത്തിന് വയലിന്റെ അരിക്, വശം, മൂല എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘താമസക്കാരനായ പരദേശി.’ ഇസ്രായേലിന്റെ ഇടയിൽ പാർക്കുകയും അവിടത്തെ സാമൂഹിക-നിയമപരമായ സംരക്ഷണം ലഭിക്കുകയും ചെയ്തിരുന്ന ഇസ്രായേലേതര വ്യക്തിയെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: നിങ്ങൾ നിങ്ങളുടെ ദേശത്തിലെ വിളവു കൊയ്യുമ്പോൾ
  rationale: കצר എന്ന ക്രിയയുടെ infinitive construct ഇവിടെ കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘കൊയ്യുമ്പോൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ അതു വ്യക്തമാക്കുന്നു; קְצִיר אַרְצְכֶם എന്നത് ‘നിങ്ങളുടെ ദേശത്തിലെ വിളവ്’ എന്നു നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ
  choice: നിങ്ങളുടെ വയലിന്റെ അരിക് മുഴുവനായി കൊയ്തുതീർക്കരുത്
  rationale: Piel രൂപത്തിലുള്ള כלה പൂർണമായി തീർക്കുക എന്ന ആശയം നൽകുന്നു. פאה അരിക്, വശം, മൂല എന്നിവ സൂചിപ്പിക്കാവുന്നതിനാൽ പ്രധാന പാഠത്തിൽ വിശാലമായ ‘അരിക്’ സ്വീകരിക്കുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: കൊയ്ത്തിൽ ചിതറിവീണവ പെറുക്കുകയും അരുത്
  rationale: לקט പ്രധാന കൊയ്ത്തിനിടെ ചിതറുകയോ ശേഷിക്കുകയോ ചെയ്തവയെ പെറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സാങ്കേതികവും അപരിചിതവുമായ പദത്തിനു പകരം സാധാരണ വായനക്കാരന് ഉടൻ മനസ്സിലാകുന്ന വിവരണം ഉപയോഗിച്ചു.
- source_word: לֶעָנִי
  choice: ദരിദ്രന്
  rationale: עני സാമ്പത്തികമായി ദുർബലനും ആവശ്യത്തിലുമുള്ള വ്യക്തിയെ ഇവിടെ സൂചിപ്പിക്കുന്നു; ‘ദരിദ്രൻ’ സാമൂഹികനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ നേരിട്ടുള്ള മലയാളമാണ്.
- source_word: וְלַגֵּר
  choice: നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശിക്ക്
  rationale: גר വെറും അപരിചിതനെയല്ല, ഇസ്രായേൽ സമൂഹത്തിനിടയിൽ താമസിക്കുന്ന അന്യദേശക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്. വിവരണാത്മകമായ ഈ പരിഭാഷ ആ സാമൂഹിക-നിയമപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲזֹב אֹתָם
  choice: അവ ... വിട്ടേക്കണം
  rationale: עזב ഇവിടെ ഉപേക്ഷിച്ചുകളയുക എന്ന വികാരാർഥത്തിലല്ല, മറ്റുള്ളവർക്കായി അവിടെ ശേഷിപ്പിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത് ‘യഹ്‌വേ’ എന്നു നൽകി; ഉടമ്പടിസൂത്രത്തിന്റെ ഗൗരവവും തിരിച്ചറിയാവുന്ന ഘടനയും നിലനിർത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് ഉള്ളതിനാൽ പദവിയായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: גר എന്ന പദത്തിന്റെ സാമൂഹിക-നിയമപരമായ അർഥം
  choice: നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശി
  alternative: പരദേശി / പ്രവാസി / അന്യൻ
  rationale: ഇസ്രായേലിന്റെ ഇടയിൽ സ്ഥിരമോ ദീർഘകാലമോ ആയി പാർത്ത് അതിന്റെ നിയമസംരക്ഷണത്തിൽ കഴിയുന്ന ഇസ്രായേലേതര വ്യക്തിയെയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ആ പ്രത്യേകത മങ്ങാതിരിക്കാനാണ് വിവരണാത്മക രൂപം സ്വീകരിച്ചത്.
- issue: രണ്ടാംപുരുഷ വചനത്തിലെ മാറ്റം
  choice: മലയാളത്തിൽ ബഹുവചന അഭിസംബോധന തുടർച്ചയായി ഉപയോഗിച്ചു
  alternative: ‘നിങ്ങൾ’ എന്നതിൽനിന്ന് ‘നിന്റെ’ എന്ന ഏകവചനത്തിലേക്കുള്ള എബ്രായമാറ്റം രൂപപരമായി പുനരാവർത്തിക്കുക
  rationale: എബ്രായത്തിൽ സമൂഹത്തോടുള്ള ബഹുവചന അഭിസംബോധനയിൽനിന്ന് പ്രതിനിധിയായ വ്യക്തിയോടുള്ള ഏകവചന കല്പനയിലേക്കു മാറ്റമുണ്ട്. മലയാളത്തിൽ അക്ഷരാർഥമായി അതു പകർത്തുന്നത് അസ്വാഭാവികവും അഭിസംബോധനയിലെ തെറ്റുപോലെയും തോന്നാം; ബഹുവചനം നിയമം ഓരോരുത്തർക്കും ബാധകമാണെന്ന അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘കൊയ്ത്തിൽ ചിതറിവീണവ’ എന്ന പ്രയോഗം കാർഷികനിയമത്തിന്റെ അർഥം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു. കല്പനയുടെ ഉറപ്പിനായി ‘അരുത്,’ ‘വിട്ടേക്കണം’ എന്നീ സ്വാഭാവിക രൂപങ്ങൾ സ്വീകരിച്ചു.
