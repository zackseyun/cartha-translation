source:
  edition: WLC
  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הוּא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם בְּ/תִשְׁעָ֤ה לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב מֵ/עֶ֣רֶב עַד עֶ֔רֶב תִּשְׁבְּת֖וּ שַׁבַּתְּ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: ml
  text: ഇത് നിങ്ങൾക്കു പൂർണ വിശ്രമത്തിന്റെ ശബ്ബത്താണ്; നിങ്ങൾ നിങ്ങളെത്തന്നെ കഷ്ടപ്പെടുത്തണം.[a] മാസത്തിന്റെ ഒൻപതാം ദിവസം വൈകുന്നേരം, വൈകുന്നേരം മുതൽ വൈകുന്നേരം വരെ[b] നിങ്ങൾ നിങ്ങളുടെ ശബ്ബത്ത് ആചരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങൾ നിങ്ങളെത്തന്നെ താഴ്ത്തണം’ എന്നോ ‘നിങ്ങൾ സ്വയം നിഷേധിക്കണം’ എന്നോ വിവർത്തനം ചെയ്യാം. എബ്രായ ശൈലി പ്രായശ്ചിത്തപരമായ ആചരണത്തിലെ സ്വയംക്ലേശത്തെ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായി ഇത് ഉപവാസവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘വൈകുന്നേരം മുതൽ വൈകുന്നേരം വരെ.’ ഇസ്രായേല്യരുടെ ദിവസം കണക്കാക്കുന്ന രീതിയനുസരിച്ചാണ് ആചരണകാലം ഇവിടെ നിർണയിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: സമ്പൂർണ വിശ്രമത്തിന്റെ ശബ്ബത്ത്
  rationale: ആവർത്തിച്ചുള്ള നാമപ്രയോഗം വിശ്രമത്തിന്റെയും പ്രവൃത്തിനിർത്തലിന്റെയും തീവ്രത ഊന്നിപ്പറയുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: നിങ്ങൾ നിങ്ങളെത്തന്നെ കഷ്ടപ്പെടുത്തണം
  rationale: ആചാരപരമായ ഈ സന്ദർഭത്തിൽ പ്രായശ്ചിത്തപരമായ സ്വയംക്ലേശത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ഉപവാസം എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: נַפְשֹׁתֵיכֶם
  choice: നിങ്ങളെത്തന്നെ
  rationale: ഈ പ്രയോഗത്തിൽ נֶפֶשׁ പ്രതിഫലനാർഥത്തിലാണ് പ്രവർത്തിക്കുന്നത്. ‘നിങ്ങളുടെ ആത്മാക്കളെ’ എന്ന വിവർത്തനം ഇവിടെ തെറ്റായ മനുഷ്യശാസ്ത്രപരമായ ധാരണ ഉളവാക്കാം.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: മാസത്തിന്റെ ഒൻപതാം ദിവസം വൈകുന്നേരം
  rationale: എബ്രായ വാക്യക്രമവും ആചരണം ആരംഭിക്കുന്ന സമയവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: വൈകുന്നേരംമുതൽ വൈകുന്നേരംവരെ
  rationale: ‘സൂര്യാസ്തമയംമുതൽ സൂര്യാസ്തമയംവരെ’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ എബ്രായത്തിന്റെ കൃത്യമായ സമയപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: നിങ്ങൾ നിങ്ങളുടെ ശബ്ബത്ത് ആചരിക്കണം
  rationale: ക്രിയയിലെ വിശ്രമിക്കുക/നിർത്തുക എന്ന ആശയവും ‘നിങ്ങളുടെ ശബ്ബത്ത്’ എന്ന നാമപ്രയോഗവും മലയാളത്തിലെ സ്വാഭാവികമായ ആചരണഭാഷയിൽ കൈമാറുന്നു.
theological_decisions:
- issue: ആചാരപരമായ സന്ദർഭത്തിലെ സ്വയംക്ലേശത്തിന്റെ അർഥം
  choice: പ്രധാന പാഠത്തിൽ ‘നിങ്ങളെത്തന്നെ കഷ്ടപ്പെടുത്തണം’ എന്ന വിശാലമായ കല്പന നിലനിർത്തി.
  alternative: ‘നിങ്ങൾ ഉപവസിക്കണം’ അല്ലെങ്കിൽ ‘നിങ്ങൾ നിങ്ങളെത്തന്നെ താഴ്ത്തണം’
  rationale: ഈ വാക്യത്തിൽ എബ്രായം ഉപവാസത്തെ നേരിട്ട് പേരെടുത്തു പറയുന്നില്ല. ഉപവാസം ഈ ആചരണത്തിൽ ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും, അതുമാത്രമാണ് കല്പനയുടെ അർഥമെന്നു നിശ്ചയിക്കാതെ മൂലപാഠത്തിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശബ്ബത്ത്’ എന്ന സ്ഥാപിത ബൈബിൾപദം നിലനിർത്തിയപ്പോൾ, മറ്റു ഘടകങ്ങളിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന സ്വാഭാവിക വാക്യഘടന ഉപയോഗിച്ചു. എബ്രായത്തിലെ ‘വൈകുന്നേരം’ എന്ന ആവർത്തനം അർഥപരമായ പ്രാധാന്യം കണക്കിലെടുത്ത് നിലനിർത്തി.
