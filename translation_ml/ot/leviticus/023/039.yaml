id: LEV.23.39
reference: Leviticus 23:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: ml
  text: എന്നാൽ ഏഴാം മാസം പതിനഞ്ചാം ദിവസം, നിങ്ങൾ ദേശത്തിന്റെ വിളവ് ശേഖരിച്ചുകഴിയുമ്പോൾ, യഹ്‌വെയുടെ ഉത്സവം[a] ഏഴു ദിവസം ആചരിക്കണം. ഒന്നാം ദിവസം പൂർണവിശ്രമവും[b] എട്ടാം ദിവസം പൂർണവിശ്രമവും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹ്‌വെയ്ക്കുള്ള ഉത്സവം.’ എബ്രായപദം പലപ്പോഴും തീർത്ഥാടനവുമായി ബന്ധപ്പെട്ട ഉത്സവാചരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശബ്ബത്തുവിശ്രമം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം വിശുദ്ധാചരണവുമായി ബന്ധപ്പെട്ട പ്രത്യേക വിശ്രമത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻനിർദേശങ്ങളിൽനിന്ന് ഈ ഉത്സവത്തിന്റെ സമയവും ആചരണവും വീണ്ടും എടുത്തുപറയുന്ന മാറ്റവും പരിധിനിർണ്ണയവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എന്നാൽ’ ഈ വ്യവഹാരബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ഏഴാം മാസം പതിനഞ്ചാം ദിവസം
  rationale: എബ്രായ കലണ്ടർ-തീയതി പ്രയോഗത്തിന്റെ വ്യക്തതയും സ്വാഭാവിക മലയാളക്രമവും നിലനിർത്തുന്നു.
- source_word: בְּאָסְפְּכֶם
  choice: നിങ്ങൾ ... ശേഖരിച്ചുകഴിയുമ്പോൾ
  rationale: בְ ചേർന്ന infinitive construct സൂചിപ്പിക്കുന്ന സമയസാഹചര്യവും വിളവെടുപ്പ് പൂർത്തിയായ ശേഷമുള്ള ഘട്ടവും പ്രകടമാക്കുന്നു.
- source_word: תְּבוּאַת הָאָרֶץ
  choice: ദേശത്തിന്റെ വിളവ്
  rationale: תְּבוּאָה ധാന്യത്തിൽ മാത്രം ഒതുങ്ങാതെ ദേശം നൽകുന്ന വിളവിനെയോ ഉൽപ്പാദനഫലത്തെയോ വ്യാപകമായി സൂചിപ്പിക്കുന്നു.
- source_word: תָּחֹגּוּ אֶת חַג
  choice: ഉത്സവം ... ആചരിക്കണം
  rationale: חגג എന്ന ക്രിയയും חַג എന്ന നാമവും തീർത്ഥാടനസ്വഭാവമുള്ള ആഘോഷപരമായ വിശുദ്ധാചരണത്തെ സൂചിപ്പിക്കുന്നു; അനാവശ്യ പദാവർത്തനം ഒഴിവാക്കി അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: שַׁבָּתוֹן
  choice: പൂർണവിശ്രമം
  rationale: സാധാരണ ജോലികളിൽനിന്നുള്ള പ്രത്യേകവും സമ്പൂർണവുമായ വിരാമമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ആഴ്ചതോറുമുള്ള ശബ്ബത്തുമായി ഇതിനെ നിർബന്ധമായി ഒരുമിപ്പിക്കാതെ വിശ്രമത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: ഉത്സവനിയമത്തിലെ שַׁבָּתוֹן എന്ന പദത്തിന്റെ അർഥം
  choice: പൂർണവിശ്രമം
  alternative: ശബ്ബത്തുവിശ്രമം; വിശുദ്ധ വിശ്രമം
  rationale: ഇത് ഉത്സവവുമായി ബന്ധപ്പെട്ട പ്രത്യേക തൊഴിൽവിരാമത്തെ സൂചിപ്പിക്കുന്നു. ‘ശബ്ബത്ത്’ എന്നു മാത്രം പറഞ്ഞാൽ ആഴ്ചതോറുമുള്ള ശബ്ബത്താണെന്ന തെറ്റായ നിർണ്ണയം വരാം; ‘പൂർണവിശ്രമം’ ആ ബന്ധം നിർബന്ധിക്കാതെ പദത്തിന്റെ ശക്തി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാപാഠത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ എബ്രായവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി ഒഴുകുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി; ഒന്നാം ദിവസവും എട്ടാം ദിവസവും തമ്മിലുള്ള നിയമപരമായ സമാന്തരത നിലനിർത്തി.
