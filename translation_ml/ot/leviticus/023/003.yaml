  source_fidelity: 'എബ്രായ വാക്യത്തിലെ ക്രമവും അർഥവും കൃത്യമായി സംരക്ഷിച്ചിട്ടുണ്ട്: ആറു ദിവസത്തെ ജോലി, ഏഴാം ദിവസത്തെ പൂർണവിശ്രമ ശബ്ബത്ത്, വിശുദ്ധമായി വിളിച്ചുകൂട്ടപ്പെട്ട യോഗം, ജോലിനിരോധനം, യഹോവയ്ക്കുള്ള ശബ്ബത്ത്, എല്ലാ വാസസ്ഥലങ്ങളിലുമുള്ള പ്രാബല്യം എന്നിവയെല്ലാം ഉൾക്കൊള്ളുന്നു. ‘ജോലി ചെയ്യാം’ നിഫാൽ ക്രിയയുടെ സന്ദർഭോചിതമായ അനുമതിഭാവം സ്വാഭാവികമായി നൽകുന്നു.'
