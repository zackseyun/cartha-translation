id: LEV.23.3
reference: Leviticus 23:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֤ת שַׁבָּתוֹן֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ שַׁבָּ֥ת הִוא֙ לַֽ/יהוָ֔ה בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: ml
  text: ആറു ദിവസം ജോലി ചെയ്യാം; എന്നാൽ ഏഴാം ദിവസം പൂർണവിശ്രമത്തിന്റെ ശബ്ബത്തും വിശുദ്ധസഭായോഗവും ആകുന്നു.[a] അന്നു നിങ്ങൾ യാതൊരു ജോലിയും ചെയ്യരുത്. നിങ്ങൾ താമസിക്കുന്ന എല്ലായിടത്തും അത് യഹോവയ്ക്കുള്ള ശബ്ബത്താണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ശബ്ബത്തുവിശ്രമം’ അല്ലെങ്കിൽ ‘ഗംഭീരവിശ്രമത്തിന്റെ ശബ്ബത്ത്.’ എബ്രായ പദസംയോജനം ശബ്ബത്തിലെ വിശ്രമത്തെ ശക്തമായി ഊന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിങ്ങളുടെ എല്ലാ വാസസ്ഥലങ്ങളിലും’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ എല്ലാ കുടിയിരിപ്പുകളിലും.’ എബ്രായപദത്തിന് വാസസ്ഥലങ്ങളെയോ സ്ഥിരവാസ സമൂഹങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: ജോലി ചെയ്യാം
  rationale: നിഫാൽ അപൂർണക്രിയയുടെ നിർവ്യക്തമായ അനുമതിപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; കർശന കല്പനയായി മാറ്റുന്നില്ല.
- source_word: מְלָאכָה
  choice: ജോലി
  rationale: ശബ്ബത്ത് നിയമത്തിലെ സാധാരണ തൊഴിൽ/വേല എന്ന ആശയത്തിന് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദം.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: പൂർണവിശ്രമത്തിന്റെ ശബ്ബത്ത്
  rationale: ശബ്ബത്തും സമ്പൂർണമായ വിരാമവും ഊന്നിപ്പറയുന്ന എബ്രായ പദസംയോജനത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധസഭായോഗം
  rationale: വിശുദ്ധമായി വിളിച്ചുകൂട്ടുന്ന ഔദ്യോഗിക സമൂഹയോഗം എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: לֹא תַעֲשׂוּ
  choice: നിങ്ങൾ യാതൊരു ജോലിയും ചെയ്യരുത്
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള നേരിട്ടുള്ള നിരോധനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: അത് യഹോവയ്ക്കുള്ള ശബ്ബത്താണ്
  rationale: ദിവസം യഹോവയോടു സമർപ്പിതവും അവനിലേക്കു അഭിമുഖവുമാണെന്ന לְ എന്ന ഉപസർഗത്തിന്റെ ബന്ധം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള രൂപത്തിൽ നൽകുന്നു.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: നിങ്ങൾ താമസിക്കുന്ന എല്ലായിടത്തും
  rationale: വാസസ്ഥലങ്ങൾ എന്ന അർഥവും നിയമത്തിന്റെ സർവസ്ഥല വ്യാപ്തിയും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: എന്നാൽ ഏഴാം ദിവസം
  rationale: വാവ് എന്ന ബന്ധകത്തിന്റെ അടിസ്ഥാനബന്ധം കാത്തുകൊണ്ട് ആറു പ്രവൃത്തിദിവസങ്ങളും ഏഴാം വിശ്രമദിവസവും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: שַׁבַּת שַׁבָּתוֹן എന്ന പ്രയോഗത്തിന്റെ ശക്തി
  choice: പൂർണവിശ്രമത്തിന്റെ ശബ്ബത്ത്
  alternative: ഗംഭീരവിശ്രമത്തിന്റെ ശബ്ബത്ത്
  rationale: സാധാരണ ജോലിയിൽനിന്നുള്ള സമ്പൂർണ വിരാമത്തെ ഊന്നുന്ന പ്രയോഗത്തിന്റെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ശക്തി നിലനിർത്തുന്നു; പിൽക്കാല വ്യാഖ്യാനങ്ങൾ ചേർക്കുന്നില്ല.
- issue: מִקְרָא קֹדֶשׁ എന്നതിലെ വിളിച്ചുകൂട്ടൽഭാവം
  choice: വിശുദ്ധസഭായോഗം
  alternative: വിശുദ്ധസമ്മേളനം
  rationale: വിശുദ്ധമായി വിളിച്ചുകൂട്ടപ്പെട്ട സമൂഹയോഗം എന്ന ആശയം മലയാളത്തിൽ ഗൗരവത്തോടെയും വ്യക്തതയോടെയും അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമഭാഷയുടെ വ്യക്തത നിലനിർത്തിയിട്ടുണ്ട്; പഴമയേറിയ ക്രിയാരൂപങ്ങളും വിഭാഗീയ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
