  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י כָל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁ֣ר לֹֽא תְעֻנֶּ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/נִכְרְתָ֖ה מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, ഈ ദിവസംതന്നെ സ്വയം താഴ്ത്താത്ത ഏതൊരാളും തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സ്വയം കഷ്ടപ്പെടുത്താത്ത.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പ്രയോഗം ആത്മനിഷേധത്തെയോ സ്വയം താഴ്ത്തുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായി ഇത് ഉപവാസവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: വാക്യത്തിന്റെ വിശദീകരണസ്വഭാവം മലയാളത്തിലെ പ്രവാഹത്തിലൂടെ സൂചിപ്പിച്ച് പ്രത്യേകം പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: മുൻ കല്പനയ്ക്കുള്ള കാരണം/വിശദീകരണം അവതരിപ്പിക്കുന്ന ഘടകമാണിത്. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ ‘എന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ കൃത്രിമമായി തോന്നാം; ഉള്ളടക്കത്തിന്റെ വിശദീകരണഭാവം വാക്യം തന്നെ നിലനിർത്തുന്നു.
- source_word: כָל הַנֶּפֶשׁ
  choice: ഏതൊരാളും
  rationale: נֶפֶשׁ ഇവിടെ അമൂർത്തമായ ‘ആത്മാവ്’ എന്ന സാങ്കേതിക അർഥത്തിലല്ല, വ്യക്തിയെ മുഴുവനായി സൂചിപ്പിക്കുന്നു. ‘ഏതൊരാളും’ നിയമവാക്യത്തിന് സ്വാഭാവികവും സർവവ്യാപകവുമാണ്.
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: സ്വയം താഴ്ത്താത്ത
  rationale: പ്രായശ്ചിത്തദിനസന്ദർഭത്തിൽ ענה എന്ന പദപ്രയോഗം ഉപവാസം ഉൾപ്പെടാവുന്ന ആത്മനിഷേധത്തെയും വിനയപ്പെടലിനെയും സൂചിപ്പിക്കുന്നു. ‘സ്വയം താഴ്ത്തുക’ അനുതാപപരമായ നിലപാട് വ്യക്തമാക്കുകയും ശാരീരിക പീഡനം മാത്രമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു; കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ഈ ദിവസംതന്നെ
  rationale: עֶצֶם നൽകുന്ന കാലസൂചക ഊന്നൽ ‘തന്നെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְנִכְרְתָה
  choice: ഛേദിക്കപ്പെടും
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ כרת എന്ന പ്രയോഗത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; ശിക്ഷയുടെ കൃത്യമായ രീതി മരണമോ പുറത്താക്കലോ ദൈവിക ന്യായവിധിയോ എന്ന് അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: מֵעַמֶּיהָ
  choice: തന്റെ ജനത്തിൽനിന്ന്
  rationale: സ്ത്രീലിംഗ പ്രത്യയം വ്യാകരണപരമായി נֶפֶשׁ എന്ന നാമത്തോടാണ് യോജിക്കുന്നത്; പരാമർശം പൊതുവായ വ്യക്തിയെയാണ്. ‘തന്റെ’ ലിംഗനിരപേക്ഷവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: പ്രായശ്ചിത്തദിനത്തിൽ സ്വയം ‘താഴ്ത്തുക/കഷ്ടപ്പെടുത്തുക’ എന്ന കല്പനയുടെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘സ്വയം താഴ്ത്താത്ത’ എന്നു നൽകി
  alternative: ‘സ്വയം കഷ്ടപ്പെടുത്താത്ത’ അല്ലെങ്കിൽ ‘ആത്മനിഷേധം അനുഷ്ഠിക്കാത്ത’
  rationale: എബ്രായ പ്രയോഗം അനുതാപം, ആത്മനിഷേധം, പരമ്പരാഗതമായി ഉപവാസം എന്നിവയുമായി ബന്ധപ്പെട്ടതാണ്. മുഖ്യവാചകം ഉടമ്പടിപരമായ വിനയത്തെ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ‘ഛേദിക്കപ്പെടും’ എന്ന ശിക്ഷയുടെ സ്വഭാവം
  choice: ശിക്ഷയുടെ രീതി നിർവചിക്കാതെ പരമ്പരാഗത നിയമസൂത്രം നിലനിർത്തി
  alternative: ‘പുറത്താക്കപ്പെടും’ അല്ലെങ്കിൽ ‘നീക്കപ്പെടും’
  rationale: മനുഷ്യർ നടപ്പാക്കുന്ന വധമോ സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലോ നേരിട്ടുള്ള ദൈവിക ന്യായവിധിയോ എന്ന് ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ‘ഛേദിക്കപ്പെടും’ ഉപയോഗിച്ചു; ലിംഗനിരപേക്ഷമായ ‘ഏതൊരാളും/തന്റെ’ പ്രയോഗങ്ങൾ തിരഞ്ഞെടുത്തു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
