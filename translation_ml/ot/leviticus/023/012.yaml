id: LEV.23.12
reference: Leviticus 23:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֕ם בְּ/י֥וֹם הֲנִֽיפְ/כֶ֖ם אֶת הָ/עֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן שְׁנָת֛/וֹ לְ/עֹלָ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: ml
  text: നിങ്ങൾ ധാന്യക്കറ്റ[a] ആട്ടുന്ന ദിവസം, ഊനമില്ലാത്ത ഒരു വയസ്സുള്ള ആൺകുഞ്ഞാടിനെ യാഹ്‌വെക്കു ഹോമയാഗമായി അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഓമെർ’; ഇവിടെ ഈ പദം വെറും ഉണങ്ങിയ അളവിനെയല്ല, യാഗാചാരത്തിൽ സമർപ്പിക്കപ്പെടുന്ന ധാന്യക്കറ്റയെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: അർപ്പിക്കണം
  rationale: עשה എന്ന ക്രിയയ്ക്ക് പൊതുവെ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണർഥം; എന്നാൽ യാഗസന്ദർഭത്തിൽ യാഗം അർപ്പിക്കുക എന്ന സാങ്കേതിക ആശയം സ്വാഭാവികമായി അറിയിക്കാൻ ‘അർപ്പിക്കണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּיוֹם
  choice: ദിവസം
  rationale: ആചാരക്രിയ നടക്കുന്ന സമയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദിവസം’ എന്ന സ്വാഭാവിക കാലപ്രയോഗം സ്വീകരിച്ചു.
- source_word: הֲנִיפְכֶם
  choice: നീരാജനം ചെയ്യുന്ന
  rationale: נוף എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യഹോവയുടെ സന്നിധിയിൽ വസ്തു ആചാരപരമായി ചലിപ്പിച്ചു സമർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ-ആരാധനാഭാഷയിൽ തിരിച്ചറിയാവുന്ന സാങ്കേതിക പദമായി ‘നീരാജനം’ നിലനിർത്തി.
- source_word: הָעֹמֶר
  choice: കറ്റ
  rationale: കൊയ്ത്തിന്റെ ഈ സന്ദർഭത്തിൽ עֹמֶר ഉണങ്ങിയ അളവിനെക്കാൾ ആചാരപരമായി സമർപ്പിക്കുന്ന ധാന്യക്കറ്റയെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘കറ്റ’ തിരഞ്ഞെടുത്തു; ‘ഓമെർ’ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: כֶּבֶשׂ
  choice: ഒരു ആൺകുഞ്ഞാട്
  rationale: כֶּבֶשׂ കുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു; യാഗനിയമത്തിലെ ലിംഗസൂചന വ്യക്തമാക്കാൻ ‘ആൺകുഞ്ഞാട്’ ഉപയോഗിച്ചു.
- source_word: תָּמִים
  choice: ഊനമില്ലാത്ത
  rationale: യാഗമൃഗത്തിന്റെ ദോഷരഹിതാവസ്ഥയെ സൂചിപ്പിക്കുന്ന תָּמִים എന്ന പദത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും സാങ്കേതികമായി കൃത്യവുമായ ‘ഊനമില്ലാത്ത’ ഉപയോഗിച്ചു.
- source_word: בֶּן שְׁנָתוֹ
  choice: ഒരു വയസ്സുള്ള
  rationale: വയസ്സ് സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഒരു വയസ്സുള്ള’ എന്നു നൽകി.
- source_word: לְעֹלָה
  choice: ഹോമയാഗമായി
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗവിഭാഗത്തിന്റെ സാങ്കേതിക നാമമാണ്; മലയാളത്തിൽ പരിചിതമായ ‘ഹോമയാഗം’ ആ വിഭാഗം സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: יהוה എന്ന ഉടമ്പടിനാമം വിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ പതിവായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി; לְ എന്ന ബന്ധം ‘-യ്ക്ക്’കൊണ്ട് പ്രകടമാക്കി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമം പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തി. ആധുനിക മലയാള ക്രൈസ്തവ വായനയിൽ വ്യാപകമായി തിരിച്ചറിയുന്ന ‘യഹോവ’ എന്ന രൂപം തിരഞ്ഞെടുത്തു; കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമായതിനാൽ ‘യാഹ്‌വെ’ ഒരു സാധ്യമായ പകരമാണ്.
- issue: עֹמֶר എന്ന പദം വസ്തുവോ അളവോ എന്നത്
  choice: കറ്റ
  alternative: ഓമെർ; അളവ്
  rationale: കൊയ്ത്തും നീരാജനക്രിയയും ഉള്ള ഉടൻസന്ദർഭം ധാന്യക്കറ്റയെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും പദം ഒരു ഉണങ്ങിയ അളവിനെയും സൂചിപ്പിക്കാമെന്ന നിഘണ്ടുപരമായ സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. യാഗസംബന്ധമായ ‘നീരാജനം’, ‘ഹോമയാഗം’ എന്നീ പരിചിത സാങ്കേതിക പദങ്ങൾ നിലനിർത്തി; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി.
