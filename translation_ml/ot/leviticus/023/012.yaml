- from: നിങ്ങൾ കറ്റ[a] നീരാജനം ചെയ്യുന്ന ദിവസം, ഒരു വയസ്സുള്ള ഊനമില്ലാത്ത ഒരു ആൺകുഞ്ഞാടിനെ യഹോവയ്ക്ക് ഹോമയാഗമായി അർപ്പിക്കണം.
