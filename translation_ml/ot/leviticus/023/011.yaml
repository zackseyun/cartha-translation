reference: Leviticus 23:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵנִ֧יף אֶת הָ/עֹ֛מֶר לִ/פְנֵ֥י יְהוָ֖ה לִֽ/רְצֹנְ/כֶ֑ם מִֽ/מָּחֳרַת֙ הַ/שַּׁבָּ֔ת יְנִיפֶ֖/נּוּ הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: ml
  text: നിങ്ങളുടെ സ്വീകാര്യതയ്ക്കായി[a] അവൻ ആ ധാന്യക്കറ്റ യഹ്‌വെയുടെ സന്നിധിയിൽ ആട്ടിക്കാണിക്കണം; ശബ്ബത്തിന്റെ പിറ്റേന്ന് പുരോഹിതൻ അത് ആട്ടിക്കാണിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ സ്വീകരിക്കപ്പെടേണ്ടതിന്.” എബ്രായപ്രയോഗം, ഈ വഴിപാടിലൂടെ ആരാധകർ യഹ്‌വെയുടെ സന്നിധിയിൽ സ്വീകരിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף / יְנִיפֶנּוּ
  choice: ആട്ടിക്കാണിക്കണം
  rationale: נוּף എന്ന ക്രിയ ഇവിടെ വഴിപാടിനെ ദൈവസന്നിധിയിൽ ആട്ടിക്കാണിക്കുന്ന ആചാരപരമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്കും മനസ്സിലാകുന്ന വിധത്തിൽ ആചാരത്തിന്റെ ദൃശ്യപ്രവൃത്തി ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: הָעֹמֶר
  choice: ആ കറ്റ
  rationale: ഈ സന്ദർഭത്തിൽ עֹמֶר ഒരു ധാന്യയളവിനെക്കാൾ ആദ്യഫലമായി കൊണ്ടുവരുന്ന ധാന്യക്കറ്റയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യത്തിൽ ആചാരപരമായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לִרְצֹנְכֶם
  choice: നിങ്ങളുടെ സ്വീകാര്യതയ്ക്കായി
  rationale: ആരാധകർ ദൈവസന്നിധിയിൽ സ്വീകരിക്കപ്പെടുന്നതുമായി ബന്ധപ്പെട്ട ആചാരപരമായ അർഥം നിലനിർത്തുന്നു; എബ്രായത്തിലെ സംക്ഷിപ്തതയും ചില അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: ശബ്ബത്തിന്റെ പിറ്റേന്ന്
  rationale: ശബ്ബത്തിനു തൊട്ടടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ഇസ്രായേലിന്റെ ആരാധനാക്രമത്തിൽ ഔദ്യോഗികമായി ശുശ്രൂഷിക്കുന്ന כֹּהֵן എന്ന പദത്തിന്റെ സ്ഥിരവും വ്യക്തവുമായ പരിഭാഷ.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: לִרְצֹנְכֶם എന്നതിന്റെ യാഗപരമായ അർഥം
  choice: നിങ്ങളുടെ സ്വീകാര്യതയ്ക്കായി
  alternative: നിങ്ങൾ സ്വീകരിക്കപ്പെടേണ്ടതിന്
  rationale: വഴിപാടിലൂടെ ആരാധകർ ദൈവസന്നിധിയിൽ സ്വീകരിക്കപ്പെടുന്നു എന്ന അർഥസാധ്യത നിലനിർത്തിക്കൊണ്ട്, എബ്രായപ്രയോഗത്തെക്കാൾ കൂടുതൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ആട്ടിക്കാണിക്കുക’ ആചാരപ്രവൃത്തിയെ സുതാര്യമാക്കുന്നു; സാങ്കേതികവും ഇന്ന് അപരിചിതവുമായ പദപ്രയോഗം ഒഴിവാക്കി.
