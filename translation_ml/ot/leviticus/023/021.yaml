revisions:
- from: ആ ദിവസംതന്നെ നിങ്ങൾ ഒരു വിശുദ്ധസഭ[a] വിളിച്ചുകൂട്ടണം. പതിവുള്ള അധ്വാനവേലയൊന്നും ചെയ്യരുത്[b]. നിങ്ങൾ വസിക്കുന്ന എല്ലായിടങ്ങളിലും തലമുറതലമുറയായി പാലിക്കേണ്ട സ്ഥിരമായ ചട്ടമാണിത്[c].
  to: ആ ദിവസംതന്നെ നിങ്ങൾ ഒരു വിശുദ്ധസമ്മേളനം[a] വിളിച്ചുകൂട്ടണം. സാധാരണ അധ്വാനവേലയൊന്നും ചെയ്യരുത്[b]. നിങ്ങളുടെ എല്ലാ വാസസ്ഥലങ്ങളിലും, നിങ്ങളുടെ തലമുറകളിലുടനീളം, ഇതു സ്ഥിരമായ ഒരു ചട്ടമായിരിക്കും[c].
  rationale: മൂലപാഠത്തിലെ מִקְרָא קֹדֶשׁ എന്ന ആരാധനാനിയമപരമായ പദപ്രയോഗം കൂടുതൽ കൃത്യമായി പ്രതിഫലിപ്പിക്കാൻ ‘വിശുദ്ധസമ്മേളനം’ ഉപയോഗിച്ചു. വേലാനിരോധനത്തിന്റെ സാധാരണ/സേവനപരമായ പരിധി നിലനിർത്തി. അവസാന നിയമസൂത്രം സ്ഥലവും തലമുറകളും ഉൾക്കൊള്ളുന്ന മൂലഘടനയോട് കൂടുതൽ ചേർത്ത് പുനഃക്രമീകരിച്ചു.
