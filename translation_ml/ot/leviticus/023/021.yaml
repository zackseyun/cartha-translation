id: LEV.23.21
reference: Leviticus 23:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: ml
  text: ആ ദിവസംതന്നെ നിങ്ങൾ ഒരു വിശുദ്ധസമ്മേളനം[a] വിളിച്ചുകൂട്ടണം. സാധാരണ അധ്വാനവേലയൊന്നും ചെയ്യരുത്[b]. നിങ്ങളുടെ എല്ലാ വാസസ്ഥലങ്ങളിലും, നിങ്ങളുടെ തലമുറകളിലുടനീളം, ഇതു സ്ഥിരമായ ഒരു ചട്ടമായിരിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “വിശുദ്ധസഭായോഗം” അല്ലെങ്കിൽ “പരിശുദ്ധ സമ്മേളനം.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ “സേവനത്തിന്റെ/അധ്വാനത്തിന്റെ യാതൊരു വേലയും” എന്നാണ്; സാധാരണ അധ്വാനവേലയാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “നിത്യമായ ചട്ടം” അല്ലെങ്കിൽ “എന്നേക്കുമുള്ള ചട്ടം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: വിളിച്ചുകൂട്ടണം
  rationale: ആരാധനാപരമായ ഈ സന്ദർഭത്തിൽ קרא ഒരു വിശുദ്ധസമ്മേളനം ഔദ്യോഗികമായി വിളിച്ചുചേർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ഈ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ആ ദിവസംതന്നെ
  rationale: പ്രസ്തുത ദിവസത്തെത്തന്നെ ഊന്നിപ്പറയുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: מִקְרָא קֹדֶשׁ
  choice: ഒരു വിശുദ്ധസഭ
  rationale: ഔദ്യോഗികമായി വിളിച്ചുചേർക്കുന്ന വിശുദ്ധസമ്മേളനമാണ് ഉദ്ദേശ്യം; സാങ്കേതിക ഭാവവും സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയും സംയോജിപ്പിക്കുന്നു.
- source_word: יִהְיֶה לָכֶם
  choice: വിശുദ്ധസഭ ... വിളിച്ചുകൂട്ടണം
  rationale: ‘നിങ്ങൾക്കായി ആയിരിക്കണം’ എന്ന പ്രവചനഘടന മലയാളത്തിലെ സ്വാഭാവിക കല്പനാരൂപത്തിൽ ഉൾക്കൊള്ളിച്ചിരിക്കുന്നു; ആശയം നഷ്ടപ്പെടുന്നില്ല.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: പതിവുള്ള അധ്വാനവേലയൊന്നും
  rationale: പദശഃ ‘വേല/സേവനത്തിന്റെ യാതൊരു പ്രവൃത്തിയും’; എല്ലാ പ്രവർത്തനവും എന്നതിനെക്കാൾ സാധാരണ ഉപജീവനപരമോ അധ്വാനപരമോ ആയ വേലയെ സൂചിപ്പിക്കുന്ന നിയമപ്രയോഗമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: לֹא תַעֲשׂוּ
  choice: ചെയ്യരുത്
  rationale: നിയമപരമായ നിരോധനം ആധുനിക മലയാളത്തിൽ നേരിട്ടും ഗൗരവത്തോടെയും അവതരിപ്പിക്കുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: സ്ഥിരമായ ചട്ടം
  rationale: עוֹלָם എന്നതിന്റെ ദീർഘകാല, തുടർച്ചയായ ബാധകത നിലനിർത്തുന്നു; ‘നിത്യമായ’ എന്നത് സൃഷ്ടിക്കാവുന്ന അതിഭൗതിക നിർവചനത്തെ നിർബന്ധിക്കുന്നില്ല.
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: നിങ്ങൾ വസിക്കുന്ന എല്ലായിടങ്ങളിലും
  rationale: എല്ലാ ഇസ്രായേൽ വാസസ്ഥലങ്ങളിലേക്കുമുള്ള വ്യാപ്തി സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതലമുറയായി പാലിക്കേണ്ട
  rationale: തുടർന്നുവരുന്ന തലമുറകളിലുടനീളമുള്ള ബാധകത നിയമപരമായ സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉത്സവനിയമത്തിലെ വേലാനിരോധനത്തിന്റെ വ്യാപ്തി
  choice: ‘പതിവുള്ള അധ്വാനവേലയൊന്നും ചെയ്യരുത്’
  alternative: ‘ഒരു വേലയും ചെയ്യരുത്’ / ‘സാധാരണ വേലയൊന്നും ചെയ്യരുത്’
  rationale: כָּל מְלֶאכֶת עֲבֹדָה എല്ലാ സങ്കൽപ്പിക്കാവുന്ന പ്രവർത്തനങ്ങളെയും നിർബന്ധമായി നിരോധിക്കുന്നതല്ല; പതിവുള്ള സേവനപരമോ ഉപജീവനപരമോ അധ്വാനവേലയെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്. അതിനാൽ മൂലപാഠത്തേക്കാൾ കർശനമായ ശബ്ബത്ത് വ്യാഖ്യാനം ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
- issue: חֻקַּת עוֹלָם എന്ന നിയമസൂത്രത്തിന്റെ കാലവ്യാപ്തി
  choice: ‘സ്ഥിരമായ ചട്ടം’
  alternative: ‘നിത്യമായ ചട്ടം’ / ‘എന്നേക്കുമുള്ള ചട്ടം’
  rationale: നിയമസൂത്രത്തിലെ ദീർഘകാല തുടർച്ച സംരക്ഷിക്കുമ്പോഴും עוֹלָם എന്ന പദത്തിന് സന്ദർഭം നിർണ്ണയിക്കാത്ത പരമമായ ദാർശനിക അനന്തത ചുമത്തുന്നില്ല; പകരംവിവർത്തനങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘വിളിച്ചുകൂട്ടണം,’ ‘പാലിക്കേണ്ട സ്ഥിരമായ ചട്ടം’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ഔദ്യോഗിക സ്വരം സ്വാഭാവികമായി നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
