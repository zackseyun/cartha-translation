id: LEV.23.2
reference: Leviticus 23:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക: യാഹ്‌വെയുടെ നിശ്ചിതകാലങ്ങൾ[a]—നിങ്ങൾ വിശുദ്ധ സമ്മേളനങ്ങളായി[b] പ്രഖ്യാപിക്കേണ്ടവ—ഇവയാണ് എന്റെ നിശ്ചിതകാലങ്ങൾ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിശ്ചിത ഉത്സവങ്ങൾ’ അല്ലെങ്കിൽ ‘ഉത്സവങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം വിരുന്നുകളെ മാത്രമല്ല, നിശ്ചയിക്കപ്പെട്ട വിശുദ്ധാവസരങ്ങളെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘വിശുദ്ധ സഭായോഗങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: സംസാരിക്കുക
  rationale: ദൈവിക നിർദേശത്തിന്റെ നേരിട്ടുള്ള ആജ്ഞാഭാവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഉടമ്പടിസംബന്ധിയായ സമൂഹപ്രയോഗം മലയാളത്തിലെ പതിവായ സംയുക്തരൂപത്തിൽ സംരക്ഷിക്കുന്നു; ഇത് ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: അവരോടു പറയുക
  rationale: ‘സംസാരിച്ച് ... പറയുക’ എന്ന എബ്രായ ആജ്ഞാക്രമത്തിന്റെ ആവർത്തനവും ഔപചാരിക ഭാവവും നിലനിർത്തുന്നു.
- source_word: מוֹעֲדֵי / מוֹעֲדָי
  choice: നിശ്ചിതകാലങ്ങൾ / എന്റെ നിശ്ചിതകാലങ്ങൾ
  rationale: מוֹעֵד എന്നത് നിശ്ചയിക്കപ്പെട്ട സമയം അഥവാ സംഗമാവസരം എന്ന വിശാല അർഥമുള്ളതാണ്; അധ്യായത്തിൽ ശബത്തും ഉൾപ്പെടുന്നതിനാൽ ‘ഉത്സവങ്ങൾ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റിസ്ഥാപിക്കാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: നിങ്ങൾ പ്രഖ്യാപിക്കേണ്ടവ
  rationale: ഇവിടെ קרא പൊതുവായി വിളിച്ചറിയിക്കുക അഥവാ പ്രഖ്യാപിക്കുക എന്ന ആരാധനാസന്ദർഭത്തിലെ അർഥത്തിലാണ്.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: വിശുദ്ധസഭായോഗങ്ങൾ
  rationale: വിളിച്ചുകൂട്ടപ്പെട്ട വിശുദ്ധസമ്മേളനങ്ങൾ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵלֶּה הֵם
  choice: ഇവയാണ്
  rationale: എബ്രായത്തിലെ ഊന്നലുള്ള തിരിച്ചറിയൽപ്രയോഗം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: വ്യക്തിനാമത്തെ പദവിയായി മാറ്റാതെ നിലനിർത്തുന്നു; ‘യഹോവ’ ആധുനിക മലയാള വായനക്കാർക്കിടയിൽ സ്ഥാപിതമായ ലിപ്യന്തരണമാണ്.
- issue: מוֹעֲדֵי എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: നിശ്ചിതകാലങ്ങൾ
  alternative: ഉത്സവങ്ങൾ; പെരുന്നാളുകൾ
  rationale: പദത്തെ ആഘോഷവേളകളിലേക്കു മാത്രം ചുരുക്കാതെ, ശബത്ത് ഉൾപ്പെടെയുള്ള ദൈവം നിശ്ചയിച്ച വിശുദ്ധകാലങ്ങളെ ഉൾക്കൊള്ളുന്ന വിശാലത സംരക്ഷിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഉടമ്പടിജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്ന മൂലപ്രയോഗത്തിന്റെ കുടുംബബന്ധസൂചന നിലനിർത്തുകയും അസ്വാഭാവികമായ അത്യന്തം അക്ഷരാർഥരൂപം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ നിയമനിർദേശ ശൈലി. മൂലത്തിലെ പദക്രമവും ഊന്നലും കഴിയുന്നത്ര നിലനിർത്തിയപ്പോൾ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ഇടവരകൾ ഉപയോഗിച്ചു. ‘ഇസ്രായേൽമക്കൾ’ സമൂഹമൊട്ടാകെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ഉടമ്പടിപ്രയോഗമാണ്.
