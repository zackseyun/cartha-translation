source:
  edition: WLC
  text: בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן מִקְרָא קֹ֑דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/035.yaml
  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: ml
  text: ഒന്നാം ദിവസം വിളിച്ചുകൂട്ടിയ വിശുദ്ധസമ്മേളനം ഉണ്ടായിരിക്കണം[a]. സാധാരണ ജോലിയൊന്നും ചെയ്യരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധമായ ഒരു സമ്മേളനം.’ എബ്രായത്തിലെ מִקְרָא קֹדֶשׁ ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടുന്ന വിശുദ്ധസമ്മേളനത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സേവനവുമായി ബന്ധപ്പെട്ട ജോലി’ അല്ലെങ്കിൽ ‘തൊഴിൽപരമായ ജോലി.’ എബ്രായപ്രയോഗം സാധാരണ സേവനത്തോടോ തൊഴിലോടോ ബന്ധപ്പെട്ട ജോലിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: ഒന്നാം ദിവസം
  rationale: בְּ എന്ന കാലസൂചക ഉപസർഗവും ‘ഒന്നാം’ എന്ന ക്രമസംഖ്യയും ചേർന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒന്നാം ദിവസം’ എന്നു നൽകാം.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധസഭായോഗം
  rationale: ഈ സ്ഥിരമായ ആരാധനാപദം വിശുദ്ധമായി വേർതിരിച്ച, ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടുന്ന സമൂഹയോഗത്തെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധസഭായോഗം’ വിശുദ്ധിയുടെയും വിളിച്ചുകൂട്ടലിന്റെയും ആശയങ്ങൾ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: പതിവ് ജോലിയൊന്നും
  rationale: ഈ പദസമുച്ചയം എല്ലാ പ്രവർത്തനങ്ങളെയും നിരോധിക്കുന്നതിലുപരി ഉപജീവനത്തോടോ സാധാരണ സേവനത്തോടോ ബന്ധപ്പെട്ട പതിവ് ജോലിയെ സൂചിപ്പിക്കുന്നു. ‘പതിവ് ജോലി’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്; ‘കഠിനാധ്വാനം’ എന്നു പറഞ്ഞാൽ ശാരീരികമായി പ്രയാസമുള്ള പണിയിലേക്ക് അർഥം അനാവശ്യമായി ചുരുങ്ങാം.
- source_word: לֹא תַעֲשׂוּ
  choice: ചെയ്യരുത്
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള നിയമനിർദേശം മലയാളത്തിൽ മാന്യവും നേരിട്ടതുമായ നിരോധനരൂപമായ ‘ചെയ്യരുത്’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
