    issue: The term “വിശുദ്ധസഭായോഗം” is a compressed, potentially church-specific compound.
    rationale: It may suggest a church meeting rather than an officially summoned sacred assembly, and is less transparent for modern readers.
  - severity: low
    issue: The work footnote's alternatives “സേവനജോലി” and “തൊഴിൽജോലി” are awkward compounds.
    rationale: Clearer alternatives can explain the service/occupational sense without implying that only a particular class of labor is prohibited.
