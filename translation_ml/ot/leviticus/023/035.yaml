translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ നിയമ-ആരാധനാ സന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘സഭായോഗം’ ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടിയ വിശുദ്ധസമ്മേളനത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; ‘പതിവ് ജോലി’ അർഥം ശാരീരിക കഠിനാധ്വാനത്തിലേക്ക് മാത്രം ചുരുക്കാതെ സാധാരണ തൊഴിൽപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
