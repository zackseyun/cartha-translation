id: LEV.23.4
reference: Leviticus 23:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: ml
  text: 'യഹ്‌വേയുടെ നിശ്ചിത സമയങ്ങൾ ഇവയാണ്: നിങ്ങൾ അവയെ അവയുടെ നിശ്ചിത സമയങ്ങളിൽ പ്രഖ്യാപിക്കേണ്ട വിശുദ്ധ സമ്മേളനങ്ങൾ[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിശ്ചിത ഉത്സവങ്ങൾ’ അല്ലെങ്കിൽ ‘നിയമിക്കപ്പെട്ട കാലങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഉത്സവവിരുന്നുകളെക്കാൾ വിശാലമാണ്; യഹ്‌വേ നിശ്ചയിച്ച സമയങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘വിശുദ്ധമായി വിളിച്ചുകൂട്ടുന്ന യോഗങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവയാണ്
  rationale: തുടർന്ന് വരുന്ന പട്ടികയെ പരിചയപ്പെടുത്തുന്ന ബഹുവചന നിർദേശപദം; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആണ്’ ചേർത്തു.
- source_word: מוֹעֲדֵי
  choice: നിശ്ചിത സമയങ്ങൾ
  rationale: מוֹעֵד ഉത്സവങ്ങളെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; നിശ്ചയിക്കപ്പെട്ട സമയം അഥവാ കൂടിവരവിന്റെ അവസരം എന്ന വിശാലമായ അർഥമുണ്ട്. ശബ്ബത്തും ഈ അധ്യായത്തിന്റെ പരിധിയിൽ വരുന്നതിനാൽ ‘ഉത്സവങ്ങൾ’ എന്നതിനെക്കാൾ ഇത് കൃത്യമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവികനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: വിശുദ്ധ സമ്മേളനങ്ങൾ
  rationale: വിശുദ്ധമായി വേർതിരിക്കപ്പെട്ട, വിളിച്ചുകൂട്ടുന്ന പൊതുയോഗങ്ങൾ എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: നിങ്ങൾ ... പ്രഖ്യാപിക്കേണ്ട
  rationale: ഇവയെ പരസ്യമായി വിളിച്ചറിയിക്കുകയോ ആചരിക്കേണ്ടതായി പ്രഖ്യാപിക്കുകയോ ചെയ്യുന്നതാണ് സന്ദർഭത്തിലെ קרא എന്ന ക്രിയയുടെ ഭാവം. אֹתָם മലയാളവാക്യത്തിൽ പ്രത്യേക സർവനാമമില്ലാതെ ബന്ധവാക്യത്തിന്റെ കർമമായി സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: בְּמוֹעֲדָם
  choice: അതതു നിശ്ചിത സമയത്ത്
  rationale: ഓരോ വിശുദ്ധ സമ്മേളനത്തിനും അതിനായി നിശ്ചയിച്ച സമയമുണ്ടെന്ന വിതരണഭാവം ‘അതതു’ വ്യക്തമാക്കുന്നു; מוֹעֵד എന്ന പദത്തിന്റെ ആവർത്തനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവികനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു ബിരുദം പകരംവയ്ക്കാതെ അതിനെ ലിപ്യന്തരിച്ചു; ഉച്ചാരണത്തിന്റെ പുനർനിർമാണത്തെക്കുറിച്ചുള്ള പരിധി അംഗീകരിച്ചുകൊണ്ട് സാധാരണ പണ്ഡിതരൂപം പിന്തുടരുന്നു.
- issue: מוֹעֲדֵי എന്നതിന്റെ പരിധി
  choice: നിശ്ചിത സമയങ്ങൾ
  alternative: നിശ്ചിത ഉത്സവങ്ങൾ
  rationale: ഈ അധ്യായത്തിൽ ശബ്ബത്ത് ഉൾപ്പെടുന്നതിനാൽ പദത്തെ ഉത്സവവിരുന്നുകളിലേക്ക് മാത്രം ചുരുക്കിയില്ല; സമയവും ദൈവികനിയമനവും ഒരുപോലെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘വിശുദ്ധ സമ്മേളനങ്ങൾ’ സഭാപരമായ പ്രത്യേക സാങ്കേതികപദം ഒഴിവാക്കി വിളിച്ചുകൂട്ടപ്പെട്ട വിശുദ്ധ യോഗങ്ങളുടെ ആശയം നൽകുന്നു. എബ്രായത്തിലെ ഒരേ മൂലപദമായ מוֹעֵד രണ്ടു പ്രാവശ്യവും വരുന്നതിനാൽ മലയാളത്തിലും ‘നിശ്ചിത സമയം’ ആവർത്തിച്ചു.
