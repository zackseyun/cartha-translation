  terminology: Use 'കുടിലുകൾ' for סֻכּוֹת, with 'കൂടാരങ്ങൾ' retained as a footnoted alternative. Render יהוה as 'യാഹ്‌വേ' to represent the name consistently with the English POB lexical decision. 'ഇസ്രായേൽമക്കൾ,' 'ഈജിപ്തുദേശം,' and 'നിങ്ങളുടെ ദൈവം' are suitable.
