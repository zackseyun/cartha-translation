source:
  edition: WLC
  text: לְמַעַן֮ יֵדְע֣וּ דֹרֹֽתֵי/כֶם֒ כִּ֣י בַ/סֻּכּ֗וֹת הוֹשַׁ֨בְתִּי֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/הוֹצִיאִ֥/י אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: ml
  text: നിങ്ങളുടെ തലമുറകൾ അറിയേണ്ടതിന്, ഞാൻ ഇസ്രായേൽമക്കളെ ഈജിപ്തുദേശത്തുനിന്ന് പുറത്തുകൊണ്ടുവന്നപ്പോൾ കുടിലുകളിൽ[a] പാർപ്പിച്ചു. ഞാൻ നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൂടാരങ്ങളിൽ.’ എബ്രായത്തിലെ സുക്കോത്ത് എന്ന പദം താൽക്കാലിക കുടിലുകളെയോ പാർപ്പിടങ്ങളെയോ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായി ഇതിനെ ‘കൂടാരങ്ങൾ’ എന്നും വിളിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ דֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകൾ അറിയേണ്ടതിന്
  rationale: ഉദ്ദേശ്യാർഥം വ്യക്തമാക്കുന്ന לְמַעַן എന്നതിന്റെയും തലമുറകളിലേക്കുള്ള തുടർച്ച സൂചിപ്പിക്കുന്ന דֹרֹתֵיכֶם എന്നതിന്റെയും ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַסֻּכּוֹת
  choice: കൂടാരങ്ങളിൽ
  rationale: സുക്കോത്ത് പെരുന്നാളുമായുള്ള പദബന്ധം നിലനിർത്തിക്കൊണ്ട് താൽക്കാലിക പാർപ്പിടങ്ങളെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ പദം തെരഞ്ഞെടുത്തു; 'താൽക്കാലിക കുടിലുകൾ' എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הוֹשַׁבְתִּי
  choice: പാർപ്പിച്ചു
  rationale: ישׁב എന്ന ധാതുവിന്റെ ഹിഫീൽ കാരകഭാവം—'പാർക്കാൻ ഇടയാക്കി'—സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ
  rationale: അക്ഷരാർഥമായ 'ഇസ്രായേലിന്റെ മക്കൾ' എന്ന കൂട്ടായ ജനസമൂഹസൂചന മലയാളത്തിലെ പരമ്പരാഗതവും സ്വാഭാവികവുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּהוֹצִיאִי אוֹתָם
  choice: അവരെ ... പുറപ്പെടുവിച്ചപ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct ന്റെ കാലസാഹചര്യം 'പ്പോൾ' കൊണ്ടും ദൈവം അവരെ പുറത്തുകൊണ്ടുവന്ന കാരകഭാവം 'പുറപ്പെടുവിച്ചു' കൊണ്ടും പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: മൂലത്തിലെ 'ദേശം' എന്ന നാമം ഒഴിവാക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ അപാദാനരൂപം ഉപയോഗിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: ഉടമ്പടിസൂത്രവാക്യത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ 'കർത്താവ്' എന്നു മാറ്റിയില്ല. മലയാളത്തിൽ ഏറ്റവും പരിചിതമായ 'യഹോവ' ഉപയോഗിച്ചു; ഉച്ചാരണപുനർനിർമാണമായ 'യാഹ്‌വേ' മറ്റൊരു സാധ്യതയാണ്.
- issue: ഇസ്രായേലിന്റെ മരുഭൂമിവാസത്തിന്റെ സ്വഭാവം
  choice: അവരെ കൂടാരങ്ങളിൽ പാർപ്പിച്ചു
  alternative: അവർക്കു അഭയം നൽകി; അവരെ സുക്കോത്തിൽ പാർപ്പിച്ചു
  rationale: הוֹשַׁבְתִּי യിലെ ദൈവിക കാരകപ്രവർത്തനവും סֻכּוֹת എന്നതിന്റെ സാധാരണ അർഥവും നിലനിർത്തുന്നു; ഇത് പ്രത്യേക സ്ഥലനാമമാണെന്നോ ദൈവിക സംരക്ഷണത്തിന്റെ രൂപകമെന്നോ പാഠത്തിൽ ഇല്ലാത്തവിധം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും കൂട്ടിച്ചേർത്തു. 'പാർപ്പിച്ചു' കാരകഭാവം കൃത്യമായി നൽകുന്നു. 'ഇസ്രായേൽമക്കൾ', 'ഈജിപ്തുദേശം', 'യഹോവ' എന്നീ രൂപങ്ങൾ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ ബൈബിൾ രജിസ്റ്റർ നിലനിർത്തുന്നു.
