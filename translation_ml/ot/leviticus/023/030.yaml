id: LEV.23.30
reference: Leviticus 23:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: ml
  text: ഈ ദിവസം തന്നേ ഏതെങ്കിലും ജോലി ചെയ്യുന്ന ഓരോ വ്യക്തിയെയും ഞാൻ അവരവരുടെ ജനത്തിന്റെ ഇടയിൽനിന്ന് നശിപ്പിച്ചുകളയും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആ വ്യക്തിയെ അവരുടെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിച്ചുകളയും” (അതായത്, നീക്കിക്കളയും). ഇവിടെ എബ്രായക്രിയയുടെ അർഥം “നശിപ്പിക്കുക/നാശമടയാൻ ഇടയാക്കുക” എന്നാണ്; സാധാരണ “ഛേദിച്ചുകളയുക” എന്നു വിവർത്തനം ചെയ്യുന്ന ക്രിയയല്ല ഇത്. എങ്കിലും വിധിയിലൂടെ സമൂഹത്തിൽനിന്ന് നീക്കപ്പെടുക എന്ന അർഥം ഇതിനോട് അടുത്തു ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: ആൾ / ഏതൊരാൾ
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഗദ്യത്തിൽ נֶפֶשׁ ഇവിടെ ശരീരത്തിൽനിന്നു വേറിട്ട ‘ആത്മാവ്’ എന്നതിലുപരി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ആവർത്തനം ഭാരമാകാതിരിക്കാൻ മലയാളത്തിൽ ‘ഏതൊരാൾ’ എന്നും പിന്നെ ക്രിയയിലെ കർമരൂപത്തിലൂടെയും അർഥം പ്രകടിപ്പിച്ചു.
- source_word: תַּעֲשֶׂה כָּל מְלָאכָה
  choice: ഏതെങ്കിലും ജോലി ചെയ്യുന്ന
  rationale: עשה + מְלָאכָה എന്ന കൂട്ടിന്റെ സ്വാഭാവിക മലയാളരൂപം ‘ജോലി ചെയ്യുക’ ആണ്; כָּל എന്നതിന്റെ സമഗ്രത ‘ഏതെങ്കിലും’ നിലനിർത്തുന്നു.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ഈ ദിവസംതന്നെ
  rationale: עֶצֶם הַיּוֹם എന്ന പ്രയോഗത്തിലെ സമയസംബന്ധമായ ഊന്നൽ ‘തന്നെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהַאֲבַדְתִּי
  choice: ഞാൻ ... നശിപ്പിച്ചുകളയും
  rationale: אבד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘നശിപ്പിക്കുക/നാശമടയാൻ ഇടയാക്കുക’ എന്നാണ്. ‘നശിപ്പിച്ചുകളയും’ അതിന്റെ ശക്തിയും ദൈവിക വിധിയുടെ ഭാവിയും വ്യക്തമാക്കുന്നു.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: അവന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന്
  rationale: ഇത് സമൂഹത്തിനുള്ളിൽനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന വിധിപ്രയോഗമാണ്. נֶפֶשׁ വ്യാകരണപരമായി സ്ത്രീലിംഗമായതിനാലാണ് എബ്രായത്തിൽ സ്ത്രീലിംഗ പ്രത്യയം; മലയാളത്തിൽ പരമ്പരാഗത ഏകവചന പൊതുപ്രയോഗമായി ‘അവന്റെ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ സൂചിപ്പിക്കുന്ന ശിക്ഷയുടെ സ്വഭാവം
  choice: അവന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് നശിപ്പിച്ചുകളയും
  alternative: അവന്റെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിച്ചുകളയും / നീക്കിക്കളയും
  rationale: മൂലപാഠത്തിൽ ‘ഛേദിക്കുക’ എന്ന സാങ്കേതിക ഉടമ്പടിപദമായി സാധാരണ വരുന്ന כרת അല്ല, ‘നശിക്കുക/നശിപ്പിക്കുക’ എന്ന אבד ആണ്. അതിനാൽ പ്രധാന പാഠം ക്രിയയുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു; സമൂഹത്തിൽനിന്നുള്ള നീക്കം എന്ന ബന്ധപ്പെട്ട അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ നിയമവിധിയുടെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘ഈ ദിവസംതന്നെ’ എന്നത് മൂലത്തിലെ ഊന്നൽ സ്വാഭാവികമായി പകർന്നുനൽകുന്നു; ശിക്ഷയുടെ കൃത്യസ്വഭാവത്തെ പാഠം അനുവദിക്കുന്നതിലധികം നിർവചിച്ചിട്ടില്ല.
