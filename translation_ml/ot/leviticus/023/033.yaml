  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ דִּבֵּר പുതിയ ദൈവിക അരുളപ്പാടിനെ അവതരിപ്പിക്കുന്നു. ആവർത്തിച്ചു വരുന്ന ഈ സൂത്രവാക്യത്തിന് ‘സംസാരിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരി יהוה ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶל
  choice: -ഓടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധപദം മലയാളത്തിൽ ‘മോശയോടു’ എന്ന വിഭക്തിരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള മാനകരൂപം ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന വാക്കുകൾ അവതരിപ്പിക്കുന്ന ദ്വിബിന്ദു
  rationale: ലֵאמֹר എന്ന എബ്രായ അരുളപ്പാട്-ആമുഖം അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്നാണ്. എന്നാൽ ആധുനിക മലയാളത്തിൽ ‘സംസാരിച്ചു:’ എന്ന രൂപം അതിന്റെ പ്രയോഗധർമ്മം സ്വാഭാവികമായി നൽകുകയും അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയിലേക്കു നയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. ആ സവിശേഷത നിലനിർത്താൻ പദവിയായ ‘കർത്താവ്’ എന്നതിന് പകരം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു; മറ്റൊരു പരമ്പരാഗത ഉച്ചാരണരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ആവർത്തിത എബ്രായ അരുളപ്പാട്-സൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അനാവശ്യമായി തോന്നുന്ന ‘പറഞ്ഞുകൊണ്ട്’ ഒഴിവാക്കി ദ്വിബിന്ദു ഉപയോഗിച്ചു.
