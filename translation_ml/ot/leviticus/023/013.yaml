id: LEV.23.13
reference: Leviticus 23:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: ml
  text: അതിന്റെ ധാന്യയാഗം എണ്ണയിൽ കലർത്തിയ നേർമാവിന്റെ ഒരു ഏഫയുടെ പത്തിൽ രണ്ടുഭാഗം ആയിരിക്കണം; അത് യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണവും പ്രസാദകരമായ സൗരഭ്യവും ആയിരിക്കണം. അതിന്റെ പാനീയയാഗം ഒരു ഹീനിന്റെ നാലിലൊന്ന് വീഞ്ഞായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയ്ക്കുള്ള ഭോജനയാഗം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: അതിന്റെ ധാന്യയാഗം
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യയാഗത്തെ സൂചിപ്പിക്കുന്നു; ഏകവചന പുല്ലിംഗ പ്രത്യയം മുമ്പ് പറഞ്ഞ ആട്ടിൻകുട്ടിയെ പരാമർശിക്കുന്നു.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: ഒരു ഏഫയുടെ പത്തിൽ രണ്ടുഭാഗം
  rationale: അക്ഷരാർഥത്തിൽ ‘രണ്ട് പത്തിലൊന്നുകൾ’; പുരോഹിതനിയമങ്ങളിൽ ഉദ്ദേശിക്കുന്ന ഏഫ അളവ് വ്യക്തമാക്കി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: סֹלֶת
  choice: നേർമാവ്
  rationale: യാഗങ്ങൾക്കായി ഉപയോഗിച്ച ശുദ്ധീകരിച്ച മേൽത്തരം മാവിനെ സൂചിപ്പിക്കുന്ന പതിവ് മലയാള പദം.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയിരിക്കുന്നുവെന്ന കർമണിപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִשֶּׁה לַיהוָה
  choice: യഹോവയ്ക്ക് ... ദഹനയാഗം
  rationale: אִשֶּׁה തീയിൽ അർപ്പിക്കുന്ന യാഗത്തിനുള്ള സാങ്കേതിക പദമാണ്; ‘ദഹനയാഗം’ അതിന്റെ അഗ്നിസംബന്ധമായ സ്വഭാവം നിലനിർത്തുന്നു, എന്നാൽ ‘ഭോജനയാഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യം
  rationale: ദൈവസന്നിധിയിലെ സ്വീകാര്യത സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപ്രയോഗത്തിന്റെ രൂപകാർഥം നിലനിർത്തുന്നു.
- source_word: וְנִסְכֹּה
  choice: അതിന്റെ പാനീയയാഗം
  rationale: നֶסֶךְ അനുബന്ധമായി ഒഴിച്ചർപ്പിക്കുന്ന ദ്രവയാഗമാണ്; ‘പാനീയയാഗം’ വ്യക്തവും സ്ഥാപിതവുമായ മലയാള സമാനപദമാണ്.
- source_word: יַיִן
  choice: വീഞ്ഞ്
  rationale: നേരിട്ടുള്ള പദസമാനം.
- source_word: רְבִיעִת הַהִין
  choice: ഒരു ഹീനിന്റെ നാലിലൊന്ന്
  rationale: പുരാതന അളവായ ‘ഹീൻ’ നിലനിർത്തി ഭിന്നസംഖ്യ സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ നിയമനാമം നേരിട്ട് ഉള്ളതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പരിചിതമായ നാമരൂപം ഉപയോഗിച്ചു.
- issue: אִשֶּׁה എന്ന യാഗസാങ്കേതിക പദം
  choice: ദഹനയാഗം
  alternative: ഭോജനയാഗം
  rationale: പദത്തിന്റെ അഗ്നിയിലൂടെ അർപ്പിക്കുന്ന സ്വഭാവം പ്രധാനപാഠത്തിൽ നിലനിർത്തി; ഭക്ഷ്യാർപ്പണം ഊന്നുന്ന മറ്റൊരു സാധുവായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ യാഗപരിഭാഷ ഉപയോഗിച്ചു. പുരാതന അളവുപദങ്ങളായ ‘ഏഫ’, ‘ഹീൻ’ എന്നിവ നിലനിർത്തി; മൂലത്തിലെ വാക്യബന്ധവും യാഗഭാഷയും സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു.
