id: LEV.23.16
reference: Leviticus 23:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַ֣ד מִֽ/מָּחֳרַ֤ת הַ/שַּׁבָּת֙ הַ/שְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְ/הִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: ml
  text: ഏഴാമത്തെ ശബ്ബത്തിന്റെ പിറ്റേന്നുവരെ നിങ്ങൾ അമ്പതു ദിവസം എണ്ണണം[a]. പിന്നെ യാഹ്‌വേയ്ക്ക് പുതിയൊരു ധാന്യയാഗം അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഏഴാമത്തെ ആഴ്ചയുടെ പിറ്റേന്നുവരെ.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഏഴാമത്തെ ശബ്ബത്തിന്റെ പിറ്റേന്ന്’ എന്നാണ്; ഉത്സവത്തിനായുള്ള ഈ ദിവസക്കണക്ക് കലണ്ടർപ്രകാരം എങ്ങനെ പ്രകടിപ്പിക്കണമെന്നതിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד
  choice: വരെ
  rationale: എണ്ണേണ്ട കാലപരിധി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘വരെ’ ഉപയോഗിച്ചു.
- source_word: מִמָּחֳרַת
  choice: പിറ്റേന്ന്
  rationale: ‘അടുത്ത ദിവസം/പിറ്റേന്ന്’ എന്ന അർഥം നൽകുന്ന പദത്തിന് സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: ഏഴാമത്തെ ശബ്ബത്ത്
  rationale: എബ്രായപാഠത്തിലെ ‘ശബ്ബത്ത്’ എന്ന പദം നിലനിർത്തി; ‘ഏഴാമത്തെ ആഴ്ച’ എന്ന് വ്യാഖ്യാനിച്ച് കലണ്ടർസംബന്ധമായ അനിശ്ചിതത്വം പരിഹരിച്ചില്ല.
- source_word: תִּסְפְּרוּ
  choice: നിങ്ങൾ എണ്ണണം
  rationale: നിയമനിർദേശത്തിലുള്ള രണ്ടാം പുരുഷ ബഹുവചന ക്രിയയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായ നിർബന്ധരൂപത്തിൽ നൽകി.
- source_word: חֲמִשִּׁים יוֹם
  choice: അമ്പതു ദിവസം
  rationale: സംഖ്യയും കാലഘടകവും മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തി.
- source_word: וְהִקְרַבְתֶּם
  choice: പിന്നെ … അർപ്പിക്കണം
  rationale: യാഗസന്ദർഭത്തിലെ ‘കൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന ആശയം ‘അർപ്പിക്കുക’ എന്ന് നൽകി; ക്രമബന്ധം വ്യക്തമാക്കാൻ ‘പിന്നെ’ ചേർത്തു.
- source_word: מִנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസാങ്കേതികപ്രയോഗത്തിൽ ഇത് സാധാരണയായി ധാന്യത്തിൽനിന്നുള്ള യാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: חֲדָשָׁה
  choice: പുതിയൊരു
  rationale: ‘പുതിയത്’ എന്ന വിശേഷണം നേരിട്ട് നിലനിർത്തുകയും മലയാളവാക്യത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ഒരു’ ചേർക്കുകയും ചെയ്തു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה ശബ്ദാന്തരീകരിച്ച്, അർപ്പണത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന ל മലയാളത്തിലെ ദത്തിവിഭക്തിയാൽ നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- issue: ‘ഏഴാമത്തെ ശബ്ബത്ത്’ എന്നത് ‘ഏഴാമത്തെ ആഴ്ച’യായി ലളിതീകരിക്കണമോ
  choice: ഏഴാമത്തെ ശബ്ബത്ത്
  alternative: ഏഴാമത്തെ ആഴ്ച
  rationale: മൂലപാഠം സാധാരണ ‘ആഴ്ച’ എന്ന പദമല്ല, שַׁבָּת എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ കലണ്ടർ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ പദപ്രയോഗം സംരക്ഷിച്ചു; മറ്റൊരു ഗ്രഹിക്കൽ അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശശൈലി ഉപയോഗിച്ചു. യാഗസംബന്ധിയായ കൃത്യതയ്ക്കായി ‘ധാന്യയാഗം’ എന്നും, മൂലപാഠത്തിലെ കലണ്ടർസംബന്ധിയായ അനിശ്ചിതത്വം നിലനിർത്താൻ ‘ശബ്ബത്ത്’ എന്നും ഉപയോഗിച്ചു.
