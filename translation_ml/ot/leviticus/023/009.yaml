  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: യഹ്‌വെ മോശയോടു അരുളിച്ചെയ്തു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്യപ്പെടുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ ഔപചാരികമായ വചനാരംഭസൂത്രത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം; പുതിയ പ്രസംഗസംഭവത്തെ സൂചിപ്പിക്കുന്ന വയ്യിഖ്തോൽ രൂപത്തിന്റെ ഭൂതകാല അർഥവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി YHWH-ന്റെ മലയാള ലിപ്യന്തരണം; ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- source_word: אֶל
  choice: -യോട്
  rationale: സംസാരത്തിന്റെ അഭിമുഖലക്ഷ്യം സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള വിഭക്തിരൂപം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി ദ്വിബിന്ദുവിലൂടെ പ്രകടിപ്പിക്കുന്നു; ‘ഇപ്രകാരം’ എന്നു ചേർക്കാതെ മൂലത്തിലെ പ്രവർത്തനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം YHWH എന്ന വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരിച്ചു; ‘യഹോവ’യ്ക്കു പകരം സാദ്ധ്യതയേറിയ ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്ന ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും മാന്യവുമായ നിയമഗ്രന്ഥശൈലി. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസ്താവനയെ പരിചയപ്പെടുത്താൻ ‘ലֵאמֹר’ ദ്വിബിന്ദുവായി നൽകിയിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം ദൈവനാമത്തിനുശേഷം സ്ഥാപിച്ചു.
