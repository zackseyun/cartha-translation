id: LEV.23.41
reference: Leviticus 23:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: ml
  text: എല്ലാ വർഷവും ഏഴു ദിവസം നിങ്ങൾ അത് യഹ്‌വേക്കുള്ള ഉത്സവമായി ആഘോഷിക്കണം.[a] ഇത് നിങ്ങളുടെ തലമുറകളിലുടനീളം പ്രാബല്യത്തിലുള്ള സ്ഥിരമായ ചട്ടമാണ്.[b] ഏഴാം മാസത്തിൽ നിങ്ങൾ അത് ആഘോഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യഹ്‌വേക്കായി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “എന്നേക്കുമുള്ള ചട്ടം” അല്ലെങ്കിൽ “ശാശ്വതമായ ചട്ടം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: ആഘോഷിക്കണം
  rationale: חָגַג എന്ന ക്രിയ തീർഥാടനോത്സവം ആചരിക്കുന്നതിനെയോ ആഘോഷിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘ആഘോഷിക്കണം’ എന്ന രൂപം വാക്യത്തിലെ ആവർത്തനത്തിലും ഒരേപോലെ നിലനിർത്തി.
- source_word: אֹתוֹ
  choice: അത്
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ ഉത്സവത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; മൂലപാഠത്തിലില്ലാത്ത നാമം ചേർക്കാതെ ‘അത്’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: חַג
  choice: ഉത്സവം
  rationale: חַג മതപരമായ ആഘോഷത്തെയും പലപ്പോഴും തീർഥാടനോത്സവത്തെയും സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ലേവ്യപുസ്തകത്തിലെ പശ്ചാത്തലത്തിന് യോജിച്ചതുമായ പദമാണ് ‘ഉത്സവം’.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: ל എന്ന ഉപസർഗം സമർപ്പണമോ ബഹുമാനാർഥമായ ദിശയോ സൂചിപ്പിക്കുന്നു. ദൈവനാമം יהוה ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; ‘യഹ്‌വേക്കുള്ള’ എന്നത് ഉത്സവം അവനുവേണ്ടി/അവന്റെ ബഹുമാനാർഥം ആചരിക്കുന്നതായി സ്വാഭാവികമായി പറയുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: ഉത്സവത്തിന്റെ ദൈർഘ്യം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: בַּשָּׁנָה
  choice: വർഷത്തിൽ
  rationale: എബ്രായത്തിലെ ‘വർഷത്തിൽ’ എന്ന രൂപത്തോട് അടുത്തുനിൽക്കുകയും വാർഷിക ആചരണത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: സ്ഥിരമായ ചട്ടം
  rationale: חֻקָּה നിർദേശിക്കപ്പെട്ട ചട്ടത്തെയും עוֹלָם തുടർന്നുനിൽക്കുന്ന പ്രാബല്യത്തെയും സൂചിപ്പിക്കുന്നു. ‘സ്ഥിരമായ’ എന്നത് തത്ത്വശാസ്ത്രപരമായ കേവല അനന്തത നിർബന്ധിക്കാതെ ദീർഘകാല ബാധ്യത നിലനിർത്തുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതലമുറയായി നിങ്ങൾക്കുള്ള
  rationale: തുടർച്ചയായ തലമുറകളിലേക്കുള്ള ബാധകത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ഏഴാം മാസത്തിൽ
  rationale: ഉത്സവം ആചരിക്കേണ്ട സമയം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള കാലസൂചനയാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ ഉടമ്പടിനാമം മറയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു നൽകി.
- issue: עוֹלָם എന്ന പദത്തിന്റെ കാലവ്യാപ്തി
  choice: സ്ഥിരമായ
  alternative: എന്നേക്കുമുള്ള; ശാശ്വതമായ
  rationale: ആരാധനാനിയമത്തിന്റെ തുടർന്നുനിൽക്കുന്ന ബാധ്യതയാണ് പദം ഇവിടെ അറിയിക്കുന്നത്; കേവലമായ കാലാതീതതയെ നിർബന്ധമായി പ്രസ്താവിക്കാതെ മൂലപാഠത്തിന്റെ വ്യാപ്തി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ‘ആഘോഷിക്കുക’ എന്ന ക്രിയയുടെ ആവർത്തനം നിലനിർത്തി; യഹ്‌വേ എന്ന ഉടമ്പടിനാമവും עוֹלָם എന്നതിലെ കാലവ്യാപ്തിയുടെ സാധ്യതയും മറച്ചുവെച്ചില്ല.
