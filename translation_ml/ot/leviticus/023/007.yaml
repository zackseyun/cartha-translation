id: LEV.23.7
reference: Leviticus 23:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/007.yaml
  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
translation:
  language: ml
  text: ഒന്നാം ദിവസം നിങ്ങൾക്കു വിശുദ്ധ കൂടിവരവ് ഉണ്ടായിരിക്കണം[a]. പതിവ് ജോലിയൊന്നും ചെയ്യരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധ സമ്മേളനം’ അല്ലെങ്കിൽ ‘വിശുദ്ധ സഭായോഗം.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ, ‘അധ്വാനത്തിന്റെ/സേവനത്തിന്റെ ജോലി’; അതായത്, പതിവ് തൊഴിൽ. പരമ്പരാഗതമായി ‘ദാസ്യവേല’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: ഒന്നാം ദിവസം
  rationale: בַּ എന്ന കാലസൂചക ഉപസർഗവും നിർദിഷ്ടമായ ക്രമസംഖ്യയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഒന്നാം ദിവസം’ എന്നു നൽകുന്നു.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധ സഭായോഗം
  rationale: מִקְרָא എന്നതിലെ വിളിച്ചുകൂട്ടൽ/കൂടിവരവ് എന്ന ആശയവും קֹדֶשׁ എന്നതിലെ വിശുദ്ധതയും ഒരുമിച്ച് നിലനിർത്തുന്ന, ആരാധനാസന്ദർഭത്തിന് യോജിച്ച പ്രയോഗമാണിത്.
- source_word: יִהְיֶה לָכֶם
  choice: നിങ്ങൾക്കു ... ഉണ്ടായിരിക്കണം
  rationale: ജനത്തിനു അത്തരം ഒരു വിശുദ്ധ കൂടിവരവ് ഉണ്ടായിരിക്കണമെന്ന നിയമപരമായ നിർദേശം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; എബ്രായത്തിലെ לָכֶם എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: പതിവുള്ള അധ്വാനജോലിയൊന്നും
  rationale: നിഷേധവാക്യത്തിലെ כָּל-ന്റെ സമഗ്രത ‘ഒന്നും’ വ്യക്തമാക്കുന്നു. מְלֶאכֶת עֲבֹדָה എന്ന പ്രത്യേക സംയുക്തം എല്ലാ പ്രവൃത്തിയെയും അല്ല, പതിവായ തൊഴിൽ/അധ്വാനവേലയെയാണു സൂചിപ്പിക്കുന്നത്.
- source_word: לֹא תַעֲשׂוּ
  choice: ചെയ്യരുത്
  rationale: നിയമപരമായ നിരോധനം ആധുനിക മലയാളത്തിൽ നേരിട്ടും ഗൗരവത്തോടെയും അറിയിക്കുന്ന സ്വാഭാവിക രൂപമാണിത്.
theological_decisions:
- issue: מְלֶאכֶת עֲבֹדָה എന്ന ഉത്സവകാല നിരോധനത്തിന്റെ പരിധി
  choice: പതിവുള്ള അധ്വാനജോലി നിരോധിക്കുന്നു
  alternative: യാതൊരു പ്രവൃത്തിയും ചെയ്യാൻ പാടില്ല
  rationale: ഇവിടെ പ്രവൃത്തിക്കുള്ള പൊതുപദം മാത്രം ഉപയോഗിച്ചിട്ടില്ല; ‘ജോലി/തൊഴിൽസേവനത്തിന്റെ വേല’ എന്ന പ്രത്യേക പദസമുച്ചയമാണ് ഉള്ളത്. അതിനാൽ എല്ലാ സങ്കൽപ്പിക്കാവുന്ന പ്രവർത്തനങ്ങളിലേക്കും നിരോധനം വ്യാപിപ്പിക്കാതെ മൂലപാഠത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘സഭായോഗം’ ആരാധനയ്ക്കായി വിളിച്ചുകൂട്ടപ്പെട്ട സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘പതിവുള്ള അധ്വാനജോലി’ എന്നത് മְלֶאכֶת עֲבֹדָהയുടെ നിയന്ത്രിത അർഥം സംരക്ഷിക്കുന്നു.
