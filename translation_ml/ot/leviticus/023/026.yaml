lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക സംസാരത്തെ സൂചിപ്പിക്കുന്ന പതിവ് മലയാള ബൈബിൾ പ്രയോഗമാണിത്; וַ־ സഹിതമുള്ള ക്രിയ പുതിയ സംസാരസംഭവം ആരംഭിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി יהוה ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: אֶל ഇവിടെ സംസാരത്തിന്റെ അഭിമുഖത്തെ അടയാളപ്പെടുത്തുന്നു; ആധുനിക മലയാളത്തിൽ ‘മോശയോട്’ എന്നതാണ് സ്വാഭാവികം.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്ന് വരുന്ന വാക്കുകളെ നേരിട്ടുള്ള ഉദ്ധരണിയായി അവതരിപ്പിക്കുന്ന ഈ എബ്രായ സൂത്രപ്രയോഗം മലയാളത്തിൽ കോളൺകൊണ്ട് സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം നിലനിർത്തുകയും ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് പകരംവയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു; പ്രചാരത്തിലുള്ള മറ്റൊരു മലയാള ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തനാത്മകമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന പദാനുപദമായി കൊണ്ടുവരാതെ, തുടർവചനത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തെ സൂചിപ്പിക്കാൻ കോളൺ ഉപയോഗിച്ചു.
