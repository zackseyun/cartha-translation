source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: യഹ്‌വെ മോശെയോടു പറഞ്ഞു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: «YHWH»; പരമ്പരാഗതമായി «കർത്താവ്» എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: דבר എന്ന ക്രിയയുടെ തുടർച്ചയായ ഭൂതകാലരൂപം ദൈവിക വചനത്തിന്റെ ആഖ്യാനപരമായ അവതാരികയാണ്. ആധുനിക മലയാള ബൈബിൾ ശൈലിയിൽ ‘അരുളിച്ചെയ്തു’ സ്വാഭാവികവും ആദരസൂചകവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ ഉച്ചാരണസൗകര്യമുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל
  choice: -ഓടു
  rationale: സംസാരത്തിന്റെ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പൂർവപ്രത്യയം മലയാളത്തിൽ ‘മോശയോടു’ എന്ന വിഭക്തിരൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ രൂപത്തിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്ന് നേരിട്ടുള്ള വചനം വരുന്നതായി സൂചിപ്പിക്കുന്ന എബ്രായ സൂത്രവാക്യം മലയാളത്തിൽ ‘എന്നു പറഞ്ഞ്’ എന്നു ആവർത്തിക്കുന്നതിനെക്കാൾ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായും കൃത്യമായും പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ അതിനെ മറച്ചുവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ എന്നത് സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് അടുത്ത മലയാളരൂപമാണ്.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. എബ്രായത്തിലെ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന സൂത്രപ്രയോഗം പദാനുപദമായി ആവർത്തിക്കാതെ, അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള വചനത്തെ ദ്വിബിന്ദു സൂചിപ്പിക്കുന്നു.
