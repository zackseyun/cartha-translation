  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: ml
  text: പുരോഹിതൻ അവയെ യാഗപീഠത്തിന്മേൽ അഗ്നിയർപ്പണത്തിന്റെ ഭക്ഷണമായി ദഹിപ്പിക്കണം—പ്രസാദകരമായ സുഗന്ധത്തിനായി. കൊഴുപ്പെല്ലാം യാഹ്‌വെയ്ക്കുള്ളതാണ്.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാഗഭക്ഷണമായി’; അക്ഷരാർഥത്തിൽ, ‘അഗ്നിയർപ്പണത്തിന്റെ അപ്പം/ഭക്ഷണം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശാന്തിദായകമായ സുഗന്ധത്തിനായി’ അല്ലെങ്കിൽ ‘മധുരസുഗന്ധത്തിനായി.’
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘കൊഴുപ്പെല്ലാം യാഹ്‌വെയ്ക്കാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: പുരോഹിതൻ അവയെ ദഹിപ്പിക്കണം
  rationale: ബലികർമസന്ദർഭത്തിൽ קטר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗപീഠത്തിൽ കത്തിച്ച് പുകയായി ഉയർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ദഹിപ്പിക്കണം’ എന്നത് ആ പ്രവർത്തനം വ്യക്തവും മാന്യവുമായി അറിയിക്കുന്നു; ബഹുവചന പ്രത്യയം ‘അവയെ’ എന്നു നിലനിർത്തി.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശാസൂചക/സ്ഥാനസൂചക രൂപം ഇവിടെ ദഹിപ്പിക്കൽ നടക്കുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു. ബലികർമസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം ‘യാഗപീഠത്തിന്മേൽ’ എന്നതാണ്.
- source_word: לֶחֶם אִשֶּׁה
  choice: ഭക്ഷണമായി, തീയിൽ അർപ്പിക്കുന്ന യാഗമായി
  rationale: לֶחֶם എന്നത് ഇവിടെ അപ്പം എന്ന പരിമിത അർഥത്തിലല്ല, വിശാലമായി ‘ഭക്ഷണം’ എന്നാണ്. אִשֶּׁה തീ മുഖേന അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ സാന്ദ്രമായ ബലികർമപ്രയോഗം വായനാസൗകര്യത്തോടെ നിലനിർത്തി.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധത്തിനായി
  rationale: ദൈവസന്നിധിയിൽ യാഗം സ്വീകാര്യമാകുന്നതിനെ രൂപകമായി സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബലികർമപ്രയോഗമാണിത്. ‘പ്രസാദകരമായ സുഗന്ധം’ രൂപകം നിലനിർത്തുകയും അതിനെ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל חֵלֶב
  choice: കൊഴുപ്പെല്ലാം
  rationale: כָּל എന്ന പദത്തിന്റെ സമഗ്രതയും ഊന്നലും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ദൈവത്തിനായി വേർതിരിച്ച ബലിമൃഗത്തിന്റെ കൊഴുപ്പുഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ളതാണ്
  rationale: לְ ഇവിടെ സമർപ്പണം/അവകാശം സൂചിപ്പിക്കുന്നു. ‘യഹോവയ്ക്കുള്ളതാണ്’ എന്നത് കൊഴുപ്പ് യഹോവയ്ക്കായി മാറ്റിവെച്ചതാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; יהוה എന്ന ദിവ്യനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദിവ്യനാമം നേരിട്ട് വരുന്നതിനാൽ പൊതുവായി പരിചിതമായ മലയാളരൂപമായ ‘യഹോവ’ ഉപയോഗിച്ച് വ്യക്തിനാമസ്വഭാവം നിലനിർത്തി.
- issue: לְרֵיחַ נִיחֹחַ എന്ന ബലികർമസൂത്രവാക്യം
  choice: പ്രസാദകരമായ സുഗന്ധത്തിനായി
  alternative: ശാന്തിദായകമായ സുഗന്ധത്തിനായി; മധുരസുഗന്ധത്തിനായി
  rationale: യാഗത്തിന്റെ സ്വീകാര്യത സൂചിപ്പിക്കുന്ന മൂലരൂപകം നിലനിർത്തുന്നു; ദൈവത്തിന്റെ ഘ്രാണാനുഭവത്തെക്കുറിച്ച് അമിതമായി അക്ഷരാർഥമാക്കുകയോ കൂടുതൽ വികസിതമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുകയോ ചെയ്യുന്നില്ല.
- issue: לַיהוָה എന്ന പ്രയോഗത്തിലെ സമർപ്പണവും അവകാശവും
  choice: യഹോവയ്ക്കുള്ളതാണ്
  alternative: യഹോവയ്ക്കാണ്
  rationale: לְ എന്നതിന് ‘വേണ്ടി/ക്ക്’ എന്നും അവകാശസൂചനയായും വായിക്കാവുന്ന സാന്ദ്രതയുണ്ട്. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ അവകാശപ്രയോഗം സ്വീകരിച്ചു; കൂടുതൽ അക്ഷരസമമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ബൈബിൾഭാഷയാണ് ഉപയോഗിച്ചത്. ‘യാഗപീഠം’, ‘ദഹിപ്പിക്കുക’, ‘യാഗം’ തുടങ്ങിയ സാധാരണമായി ഗ്രഹിക്കാവുന്ന ബലികർമപദങ്ങൾ നിലനിർത്തി; അതിപുരാതനമായ വാക്യക്രമവും വിഭാഗീയ സാങ്കേതികപദങ്ങളും ഒഴിവാക്കി.
