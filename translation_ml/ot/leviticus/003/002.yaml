source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וּ/שְׁחָט֕/וֹ פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: ml
  text: അവൻ തന്റെ വഴിപാടിന്റെ തലയിൽ കൈവെച്ച് സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽ[a] അതിനെ അറുക്കണം; അഹരോന്റെ പുത്രന്മാരായ പുരോഹിതന്മാർ ആ രക്തം യാഗപീഠത്തിന്മേൽ ചുറ്റും എറിഞ്ഞൊഴിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സമാഗമകൂടാരത്തിന്റെ വാതിൽക്കൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ആ രക്തം യാഗപീഠത്തിന്മേൽ ചുറ്റും ശക്തിയായി ചൊരിയണം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: കൈവെച്ച്
  rationale: യാഗസന്ദർഭത്തിൽ סמך എന്നത് മൃഗത്തിന്റെ തലയിൽ കൈ വയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സമ്മർദത്തിന്റെ അളവ് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ സ്വാഭാവികവും വിശാലവുമായ ‘കൈവെച്ച്’ തെരഞ്ഞെടുത്തു.
- source_word: רֹאשׁ קָרְבָּנוֹ
  choice: തന്റെ വഴിപാടിന്റെ തലയിൽ
  rationale: קָרְבָּן ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന വഴിപാടിനുള്ള പൊതുപദമാണ്; ‘വഴിപാട്’ അതിന്റെ വ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: וּשְׁחָטוֹ
  choice: അതിനെ അറുക്കണം
  rationale: שׁחט യാഗമൃഗത്തെ ആചാരപരമായി അറുക്കുന്നതിന് ഉപയോഗിക്കുന്ന പതിവുപദമാണ്; പൊതുവായ ‘കൊല്ലുക’ എന്നതിനെക്കാൾ ‘അറുക്കുക’ കൃത്യമാണ്.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽവെച്ച്
  rationale: פֶּתַח തുറവിനെയോ പ്രവേശനത്തെയോ സൂചിപ്പിക്കുന്നു; אֹהֶל מוֹעֵד എന്ന സ്ഥാപിത വിശുദ്ധകൂടാരനാമത്തിന് ‘സമാഗമകൂടാരം’ സ്വാഭാവികമായ മലയാളരൂപമാണ്.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: അഹരോന്റെ പുത്രന്മാരായ പുരോഹിതന്മാർ
  rationale: അഹരോന്റെ പുത്രന്മാരെ പുരോഹിതന്മാരായി തിരിച്ചറിയുന്ന മൂലപാഠത്തിലെ സമാനാധികരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְזָרְקוּ אֶת־הַדָּם
  choice: ആ രക്തം ... എറിഞ്ഞൊഴിക്കണം
  rationale: זרק രക്തം എറിയുകയോ ശക്തിയായി ചൊരിയുകയോ ചെയ്യുന്ന പ്രവൃത്തിയാണ്; ‘തളിക്കുക’ മറ്റൊരു പ്രത്യേക ആചാരപ്രവൃത്തിയെന്ന ധാരണ നൽകാം. ‘എറിഞ്ഞൊഴിക്കുക’ മലയാളത്തിൽ പ്രവൃത്തിയുടെ ദിശയും ദ്രവസ്വഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: עַל־הַמִּזְבֵּחַ סָבִיב
  choice: യാഗപീഠത്തിന്റെ ചുറ്റും അതിന്മേൽ
  rationale: עַל രക്തം യാഗപീഠത്തിൽ പതിക്കുന്നതും סָבִיב അതിന്റെ ചുറ്റുമുള്ള പ്രയോഗവും അറിയിക്കുന്നു; മലയാളവാക്യക്രമത്തിൽ ‘ചുറ്റും അതിന്മേൽ’ രണ്ടും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാഗരക്തം പ്രയോഗിക്കുന്ന രീതി
  choice: ആ രക്തം യാഗപീഠത്തിന്റെ ചുറ്റും അതിന്മേൽ എറിഞ്ഞൊഴിക്കണം
  alternative: ആ രക്തം യാഗപീഠത്തിന്മേൽ ചുറ്റും തളിക്കണം
  rationale: זרק എന്ന ക്രിയ സാധാരണയായി എറിയുക/എറിഞ്ഞൊഴിക്കുക എന്ന ശക്തമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘തളിക്കുക’ മറ്റൊരു സാങ്കേതിക ആചാരനടപടിയുടെ സൂക്ഷ്മത അനാവശ്യമായി കൊണ്ടുവരാൻ സാധ്യതയുള്ളതിനാൽ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി, അടിക്കുറിപ്പിൽ പകരംവായനയായി സൂചിപ്പിച്ചു.
- issue: פֶּתַח എന്ന സ്ഥലസൂചന
  choice: പ്രവേശനത്തിങ്കൽവെച്ച്
  alternative: വാതിൽക്കൽവെച്ച്
  rationale: മൂലപദത്തിന് പ്രവേശനം, തുറവ്, വാതിൽപ്പടി എന്നീ അടുത്ത അർത്ഥങ്ങൾ സാധ്യമാണ്. മുഖ്യപാഠത്തിൽ വിശാലമായ ‘പ്രവേശനം’ ഉപയോഗിച്ച് പകരംവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യാഗപരമായ കൃത്യതയ്ക്കായി ‘വഴിപാട്’, ‘അറുക്കുക’, ‘യാഗപീഠം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
