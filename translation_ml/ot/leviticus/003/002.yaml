revisions:
- from: അവൻ തന്റെ വഴിപാടിന്റെ തലയിൽ കൈവെച്ച് സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽവെച്ച്[a] അതിനെ അറുക്കണം. അഹരോന്റെ പുത്രന്മാരായ പുരോഹിതന്മാർ ആ രക്തം യാഗപീഠത്തിന്റെ ചുറ്റും അതിന്മേൽ എറിഞ്ഞൊഴിക്കണം.[b]
  to: അവൻ തന്റെ വഴിപാടിന്റെ തലയിൽ കൈവെച്ച് സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽ[a] അതിനെ അറുക്കണം; അഹരോന്റെ പുത്രന്മാരായ പുരോഹിതന്മാർ ആ രക്തം യാഗപീഠത്തിന്മേൽ ചുറ്റും എറിഞ്ഞൊഴിക്കണം.[b]
