id: LEV.3.10
reference: Leviticus 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: ml
  text: രണ്ടു വൃക്കകളും, അവയുടെ മേലുള്ളതും അരക്കെട്ടിനോടു ചേർന്നുള്ളതുമായ കൊഴുപ്പും, കരളിന്മേലുള്ള അനുബന്ധഭാഗവും[a] അവൻ വൃക്കകളോടൊപ്പം നീക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘കരളിന്മേലുള്ള ഖണ്ഡം.’ ഈ ശരീരഭാഗത്തിനുള്ള എബ്രായപദത്തിന്റെ (יֹתֶרֶת) കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: രണ്ടു വൃക്കകൾ
  rationale: യാഗവുമായി ബന്ധപ്പെട്ട ശരീരഘടനാവിവരണത്തിൽ כְּלָיֹת വ്യക്തമായി വൃക്കകളെയാണ് സൂചിപ്പിക്കുന്നത്; ദ്വിവചനം ‘രണ്ടു’ എന്നു നിലനിർത്തി.
- source_word: הַחֵלֶב
  choice: കൊഴുപ്പ്
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസന്ദർഭത്തിൽ חֵלֶב യാഗത്തിനായി വേർതിരിക്കുന്ന ആന്തരിക കൊഴുപ്പിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം തെരഞ്ഞെടുത്തു.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: അവയുടെ മേലുള്ള
  rationale: ഈ ആപേക്ഷികവാക്യം കൊഴുപ്പ് വൃക്കകളുടെ മേലാണെന്ന സ്ഥാനബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַכְּסָלִים
  choice: അരക്കെട്ടിന്റെ ഭാഗം
  rationale: כְּסָלִים അരക്കെട്ട്/പാർശ്വപ്രദേശം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ശരീരഘടനാപരമായി മനസ്സിലാക്കാവുന്നതുമായ രൂപം ഉപയോഗിച്ചു.
- source_word: הַיֹּתֶרֶת
  choice: അനുബന്ധഭാഗം
  rationale: ഈ യാഗശരീരഘടനാപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; ‘ഖണ്ഡം’ എന്നു അതിയായി കൃത്യത അവകാശപ്പെടാതെ പൊതുവായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: עַל הַכָּבֵד
  choice: കരളിന്മേലുള്ള
  rationale: עַל സൂചിപ്പിക്കുന്ന സ്ഥാനം അല്ലെങ്കിൽ ചേർച്ചയുടെ ബന്ധം വിശാലമായി നിലനിർത്തുന്നു.
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: അവൻ വൃക്കകളോടൊപ്പം നീക്കണം
  rationale: യാഗനടപടിയുടെ പശ്ചാത്തലത്തിൽ പദസമുച്ചയം കരളിനോടു ബന്ധപ്പെട്ട ഭാഗം വൃക്കകളോടൊപ്പം നീക്കുന്നതായി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; יְסִירֶנָּהയുടെ നിർദേശസ്വഭാവവും നിലനിർത്തുന്നു.
