translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാഗനിയമത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭാഷ ഉപയോഗിച്ചു. എബ്രായവാക്യത്തിന്റെ പട്ടികാരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ക്രമപ്പെടുത്തി; ശരീരഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവച്ചു.
