source:
  edition: WLC
  text: חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶ֑ם כָּל חֵ֥לֶב וְ/כָל דָּ֖ם לֹ֥א תֹאכֵֽלוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: ml
  text: 'നിങ്ങളുടെ തലമുറകളിലുടനീളം, നിങ്ങളുടെ എല്ലാ വാസസ്ഥലങ്ങളിലും, ഇത് സ്ഥിരമായ[a] ഒരു ചട്ടമായിരിക്കും: കൊഴുപ്പോ രക്തമോ നിങ്ങൾ ഭക്ഷിക്കരുത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്ഥിരമായ’ എന്നതിന് ‘എന്നേക്കുമുള്ള’ എന്നോ ‘ശാശ്വതമായ’ എന്നോ പരിഭാഷപ്പെടുത്താം. നിയമസന്ദർഭങ്ങളിൽ എബ്രായ പദമായ עוֹלָם സാധാരണയായി തുടർന്നുനിൽക്കുന്ന പ്രാബല്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקַּת
  choice: ചട്ടം
  rationale: സ്ഥിരമായി നിർദേശിക്കപ്പെട്ട നിയമം എന്ന നിയമ-ഉടമ്പടിപരമായ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: עוֹלָם
  choice: എന്നേക്കുമുള്ള
  rationale: നിയമസൂത്രത്തിൽ തുടരുന്ന, ദീർഘകാല പ്രാബല്യം സൂചിപ്പിക്കുന്നു; പദത്തിന്റെ ദൈർഘ്യസംബന്ധമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതലമുറയായി നിങ്ങൾക്ക്
  rationale: തുടർച്ചയായ തലമുറകളിലേക്കുള്ള ബാധകത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: നിങ്ങൾ പാർക്കുന്ന എല്ലാ ഇടങ്ങളിലും
  rationale: ഓരോ വാസസ്ഥലത്തും എന്ന സമഗ്രമായ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל חֵלֶב
  choice: കൊഴുപ്പ്
  rationale: כָּל-ന്റെ സമഗ്രത നിരോധനവാക്യത്തിലെ ‘-ഓ ... -ഓ’ ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: וְכָל דָּם
  choice: രക്തം
  rationale: കൊഴുപ്പിനോടു സമാന്തരമായി സമഗ്ര നിരോധനം ലളിതമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא תֹאכֵלוּ
  choice: ഭക്ഷിക്കരുത്
  rationale: നിയമപരമായ നിരോധനത്തിന്റെ ബലം ആധുനിക മലയാളത്തിലെ നേരിട്ടുള്ള വിലക്കുരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: עוֹלָם സൂചിപ്പിക്കുന്ന ചട്ടത്തിന്റെ കാലാവധി
  choice: ‘എന്നേക്കുമുള്ള ഒരു ചട്ടം’ എന്നു പരിഭാഷപ്പെടുത്തി, നിയമസന്ദർഭത്തിലെ തുടർന്നുനിൽക്കുന്ന പ്രാബല്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: സ്ഥിരമായ ഒരു ചട്ടം; ശാശ്വതമായ ഒരു ചട്ടം
  rationale: എബ്രായ നിയമസൂത്രത്തിന്റെ ശക്തി നിലനിർത്തുകയും അതിന് സന്ദർഭാതീതമായ ദാർശനിക അനന്തത നിർബന്ധമായി ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമഭാഷ. ഹീബ്രു വാക്യത്തിലെ തലമുറകളുടെയും എല്ലാ വാസസ്ഥലങ്ങളുടെയും വ്യാപ്തിയും കൊഴുപ്പിനും രക്തത്തിനുമുള്ള സമഗ്ര വിലക്കും സംരക്ഷിച്ചിട്ടുണ്ട്.
