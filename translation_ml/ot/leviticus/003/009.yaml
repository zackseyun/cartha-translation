  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: ml
  text: 'അവൻ സമാധാനയാഗത്തിൽനിന്ന് യഹ്‌വേക്കു അഗ്നിയർപ്പണമായി ഇതു സമർപ്പിക്കണം: അതിന്റെ കൊഴുപ്പ്, നട്ടെല്ലിനോടു ചേർന്നിടത്തുനിന്ന് വേർപെടുത്തേണ്ട മുഴുവൻ കൊഴുത്ത വാൽ[a], ആന്തരികാവയവങ്ങളെ മൂടുന്ന കൊഴുപ്പ്, ആന്തരികാവയവങ്ങളുടെമേലുള്ള സകല കൊഴുപ്പും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് യാഗത്തിനായി കൊണ്ടുവന്ന കൊഴുപ്പേറിയ വാലുള്ള ചെമ്മരിയാടിന്റെ മുഴുവൻ വാലാണ്. “നട്ടെല്ലിന് എതിർവശത്തുവെച്ച്” അല്ലെങ്കിൽ “നട്ടെല്ലിന്റെ അടിഭാഗത്തുവെച്ച്” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: സാംസ്കാരികവും പദാർഥപരവുമായ വിശദീകരണം
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗം
  rationale: ശ്ലാമീം എന്ന സ്ഥാപിത യാഗപദത്തിന്റെ സമാധാനം, ക്ഷേമം, കൂട്ടായ്മ എന്നീ അർത്ഥവ്യാപ്തികളിൽ പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ ‘സമാധാനയാഗം’ തിരഞ്ഞെടുത്തു.
- source_word: אִשֶּׁה
  choice: ദഹനാർപ്പണം
  rationale: തീയിൽ അർപ്പിക്കുന്ന യാഗഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ ഭക്ഷണം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി ആചാരപരമായ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: חֶלְבּוֹ
  choice: അതിന്റെ കൊഴുപ്പ്
  rationale: യാഗത്തിനായി വേർതിരിച്ച മൃഗത്തിന്റെ കൊഴുപ്പുഭാഗങ്ങളെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: הָאַלְיָה תְמִימָה
  choice: മുഴുവൻ കൊഴുത്ത വാൽ
  rationale: אַלְיָה കൊഴുപ്പേറിയ പ്രത്യേകതരം ചെമ്മരിയാടിന്റെ വാലിനെയും תְמִימָה അതിന്റെ മുഴുമയെയും സൂചിപ്പിക്കുന്നു.
- source_word: לְעֻמַּת הֶעָצֶה
  choice: നട്ടെല്ലിനോടു ചേർത്ത്
  rationale: വാൽ നീക്കേണ്ട സ്ഥാനം നട്ടെല്ല്/വാലെല്ലുമായി ബന്ധപ്പെട്ടതാണെന്ന് വ്യക്തമാക്കുന്നു; മൂലത്തിലെ സ്ഥാനബന്ധത്തിന് മറ്റു വ്യാഖ്യാനങ്ങളും സാധ്യമായതിനാൽ കുറിപ്പ് ചേർത്തു.
- source_word: יְסִירֶנָּה
  choice: നീക്കേണ്ട
  rationale: ഹിഫീൽ ക്രിയയുടെ ‘വേർപെടുത്തുക/നീക്കുക’ എന്ന നിർദേശാത്മക അർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: കുടലുകളെ മൂടുന്ന കൊഴുപ്പ്
  rationale: യാഗാനുഷ്ഠാനത്തിലെ ആന്തരികാവയവസന്ദർഭത്തിൽ קֶרֶב എന്നത് ഉള്ളവയവങ്ങളെയോ കുടലുകളെയോ സൂചിപ്പിക്കുന്നു; ‘കുടലുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: കുടലുകളിന്മേലുള്ള സകല കൊഴുപ്പും
  rationale: കുടലുകളെ മൂടുന്ന കൊഴുപ്പും അവയുടെ മേലുള്ള മുഴുവൻ കൊഴുപ്പും എന്ന മൂലപാഠത്തിലെ ആവർത്തനവും വ്യത്യാസവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- issue: זֶבַח הַשְּׁלָמִים എന്ന യാഗപദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: ഒറ്റ അർത്ഥത്തിലേക്ക് അതിരുകടന്ന് ചുരുക്കാതെ പരമ്പരാഗതമായി തിരിച്ചറിയാവുന്ന പദം ഉപയോഗിച്ചു; കൂട്ടായ്മയും ക്ഷേമവും അതിന്റെ അർത്ഥവ്യാപ്തിയിൽ ഉൾപ്പെടാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാഗനിയമത്തിന്റെ ഔപചാരിക ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ പട്ടികാസ്വഭാവവും ശരീരഘടനാപരമായ ആവർത്തനവും സംരക്ഷിച്ചു.
