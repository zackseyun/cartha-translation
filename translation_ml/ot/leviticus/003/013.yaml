  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹאשׁ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: ml
  text: അവൻ അതിന്റെ തലമേൽ തന്റെ കൈവെച്ച് സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽവെച്ച് അതിനെ അറുക്കണം. അഹരോന്റെ പുത്രന്മാർ അതിന്റെ രക്തം യാഗപീഠത്തിന്റെ ചുറ്റും ചീറ്റണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിന്റെ രക്തം യാഗപീഠത്തിന്റെ ചുറ്റും തളിക്കണം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ യാഗസന്ദർഭത്തിൽ രക്തം എറിയുക, ചീറ്റിക്കുക, തളിക്കുക എന്നീ അർഥങ്ങളിൽ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת־יָדוֹ עַל־רֹאשׁוֹ
  choice: അതിന്റെ തലമേൽ തന്റെ കൈവെച്ച്
  rationale: സാമാന്യമായ ‘വെക്കുക’ എന്നതിലുപരി യാഗമൃഗത്തിന്മേൽ കൈവയ്ക്കുന്ന ആചാരപ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഏകവചനമായ ‘കൈ’ നിലനിർത്തുന്നു.
- source_word: וְשָׁחַט אֹתוֹ
  choice: അതിനെ അറുക്കണം
  rationale: שׁחט സൂചിപ്പിക്കുന്ന യാഗസംബന്ധമായ മൃഗവധത്തിന് ആധുനിക മലയാളത്തിലെ കൃത്യവും സ്വാഭാവികവുമായ പദമാണ് ‘അറുക്കുക’.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽവെച്ച്
  rationale: אֹהֶל מוֹעֵד എന്ന ആരാധനാസംബന്ധമായ സ്ഥിരപ്രയോഗം ‘സമാഗമകൂടാരം’ എന്നു നൽകുകയും לִפְנֵי എന്ന സ്ഥലസൂചന ‘മുമ്പിൽവെച്ച്’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർ
  rationale: എബ്രായ നിർമാണത്തിലെ ഔപചാരിക പുരോഹിതവംശസൂചന നിലനിർത്തുന്നു.
- source_word: וְזָרְקוּ ... אֶת־דָּמוֹ
  choice: അതിന്റെ രക്തം ... തളിക്കണം
  rationale: യാഗക്രമത്തിൽ രക്തം യാഗപീഠത്തിലേക്ക് പ്രയോഗിക്കുന്ന പ്രവൃത്തിക്ക് മലയാളത്തിൽ സ്വാഭാവികമായ ‘തളിക്കുക’ തെരഞ്ഞെടുത്തു; എന്നാൽ זרק എന്ന ക്രിയയുടെ ശക്തി ‘എറിയുക/ചീറ്റിക്കുക’ എന്നും നൽകാവുന്നതിനാൽ വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַל־הַמִּזְבֵּחַ סָבִיב
  choice: യാഗപീഠത്തിന്റെ ചുറ്റും
  rationale: രക്തം യാഗപീഠത്തിന്റെ എല്ലാ വശങ്ങളിലും പ്രയോഗിക്കുന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ആരാധനാ-നിയമശൈലി. ‘സമാഗമകൂടാരം’, ‘യാഗപീഠം’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അനാവശ്യമായ പുരാതന ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
