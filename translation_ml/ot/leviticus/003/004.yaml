source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָי֖וֹת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: ml
  text: രണ്ടു വൃക്കകളും, അവയുടെമേലുള്ളതും ഇടുപ്പുഭാഗത്തുള്ളതുമായ കൊഴുപ്പും, കരളിന്മേലുള്ള അനുബന്ധഭാഗവും[a] വൃക്കകളോടൊപ്പം അവൻ നീക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കരളിന്മേലുള്ള ഖണ്ഡം.’ ഈ ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; അതുകൊണ്ട് മുഖ്യപാഠത്തിൽ ‘അനുബന്ധഭാഗം’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: രണ്ടു വൃക്കകൾ
  rationale: കുൽയോത് ഇവിടെ യാഗമൃഗത്തിന്റെ വൃക്കകളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; എണ്ണവും ശരീരാവയവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: അവയുടെ മേലുള്ള കൊഴുപ്പ്
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസന്ദർഭത്തിൽ ഖേലെവ് യാഗത്തിനായി മാറ്റിവെക്കുന്ന കൊഴുപ്പുള്ള ഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; വൃക്കകളോടുള്ള സ്ഥാനബന്ധവും നിലനിർത്തുന്നു.
- source_word: הַכְּסָלִים
  choice: ഇടുപ്പുഭാഗം
  rationale: ഈ പദം അരക്കെട്ട്/പാർശ്വഭാഗം ഉൾപ്പെടുന്ന ശരീരമേഖലയെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ശരീരശാസ്ത്രപരമായി മതിയായതുമായ പ്രയോഗമാണിത്.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: കരളിന്മേലുള്ള അനുബന്ധഭാഗം
  rationale: യോതെരെത് എന്ന ശരീരാവയവപദത്തിന്റെ കൃത്യമായ സൂചന അനിശ്ചിതമാണ്. ‘അനുബന്ധഭാഗം’ എന്നത് ‘ഖണ്ഡം’ എന്നു തീർച്ചപ്പെടുത്താതെ കരളുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: עַל הַכְּלָיוֹת
  choice: വൃക്കകളോടൊപ്പം
  rationale: യാഗക്രമത്തിലെ ആവർത്തിത സൂത്രവാക്യത്തിൽ ഈ പദസമുച്ചയം പ്രസ്തുത കരൾഭാഗം വൃക്കകളോടൊപ്പം നീക്കുന്നതായി നടപടിക്രമപരമായി സൂചിപ്പിക്കുന്നു; കർശനമായ സ്ഥാനാർഥം മലയാളത്തിൽ ശരീരശാസ്ത്രപരമായി അസ്വാഭാവികമാകും.
- source_word: יְסִירֶנָּה
  choice: അവൻ നീക്കണം
  rationale: ഹിഫീൽ ക്രിയയുടെ നീക്കംചെയ്യുക എന്ന അർഥവും ആചാരനിയമത്തിന്റെ നിർദേശാത്മക ബലവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആചാര ശൈലി ഉപയോഗിച്ചു. എബ്രായവാക്യത്തിന്റെ പട്ടികാസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ സാങ്കേതികത ഒഴിവാക്കി; അനിശ്ചിതമായ ശരീരാവയവപദം അടിക്കുറിപ്പോടെ തുറന്നുവെച്ചു.
