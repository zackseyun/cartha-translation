    issue: «ദഹനയാഗം» for אִשֶּׁה
    rationale: In standard Malayalam Bible terminology, «ദഹനയാഗം» readily identifies the distinct whole-burnt offering, whereas אִשֶּׁה here means a fire offering more generally. Leviticus 3 concerns a well-being offering, so the narrower term can misstate the ritual category.
