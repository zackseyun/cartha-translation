  yaml_path: translation/ot/leviticus/003/011.yaml
  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: ml
  text: പുരോഹിതൻ അത് യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം; അത് യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണത്തിന്റെ ആഹാരമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണത്തിന്റെ അപ്പം.’ ഇവിടെ ‘അപ്പം’ എന്നത് ബലികർമഭാഷയിൽ ‘ആഹാരം’ എന്ന അർഥത്തിൽ രൂപകാത്മകമായി ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: അത് ദഹിപ്പിക്കണം
  rationale: ബലികർമസന്ദർഭത്തിൽ קטר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗപീഠത്തിൽ ദഹിപ്പിച്ച് പുകയായി ഉയർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ‘ദഹിപ്പിക്കണം’ ഈ പ്രവൃത്തി വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ഇസ്രായേലിന്റെ ആരാധനാക്രമത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശാസൂചകമായ രൂപം ഇവിടെ ബലിവസ്തു യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: לֶחֶם
  choice: ആഹാരം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘അപ്പം’ ആണെങ്കിലും, ഇവിടെ ബലികർമവുമായി ബന്ധപ്പെട്ട ദൈവത്തിനുള്ള യാഗപീഠവിഹിതത്തെ സൂചിപ്പിക്കുന്ന രൂപകാത്മക പ്രയോഗമാണ്; ‘ആഹാരം’ ആ പ്രയോഗം തെറ്റിദ്ധാരണയില്ലാതെ നൽകുന്നു.
- source_word: אִשֶּׁה
  choice: ദഹനയാഗം
  rationale: തീയിൽ അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ബലികർമപദമാണിത്. ‘ദഹനയാഗം’ തീ മുഖേന അർപ്പിക്കുന്നതെന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു; ഇത് മുഴുവൻ ഹോമയാഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി വായിക്കാതിരിക്കാൻ അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: ל എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണാർഥം ‘യ്ക്കുള്ള’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: לֶחֶם אִשֶּׁה എന്ന ബലികർമപ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ദഹനയാഗത്തിന്റെ ആഹാരം
  alternative: അപ്പം, തീയിൽ അർപ്പിക്കുന്ന യാഗം
  rationale: എബ്രായവാക്യം ‘അപ്പം/ആഹാരം’ എന്നും ‘തീയിൽ അർപ്പിക്കുന്ന യാഗം’ എന്നും രണ്ട് ബലികർമപദങ്ങളെ ചേർക്കുന്നു. ദൈവത്തിന് ശാരീരിക പോഷണം ആവശ്യമാണെന്ന ആശയം ഇറക്കുമതി ചെയ്യാതെ, യാഗപീഠത്തിലെ ദൈവവിഹിതത്തെക്കുറിച്ചുള്ള രൂപകാത്മക ഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാക്രമശൈലി. എബ്രായത്തിന്റെ രൂപകാത്മകമായ ‘ആഹാരം’ എന്ന ഭാഷ പ്രധാനപാഠത്തിൽ നിലനിർത്തി; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ നൽകി.
