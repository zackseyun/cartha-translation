source:
  edition: WLC
  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: ml
  text: അവൻ തന്റെ വഴിപാടിന്റെ തലയിൽ തന്റെ കൈ വെക്കണം; സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽ അതിനെ അറുക്കണം. അഹരോന്റെ പുത്രന്മാർ അതിന്റെ രക്തം യാഗപീഠത്തിന്റെ ചുറ്റും എറിയണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചീറ്റിക്കണം’ അല്ലെങ്കിൽ ‘വീശിയെറിയണം’ എന്നും വിവർത്തനം ചെയ്യാം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയ മൃദുവായി തളിക്കുന്നതിനെക്കാൾ, രക്തം ശക്തിയോടെ എറിയുന്ന ആചാരപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: കൈവെച്ച്
  rationale: യാഗസന്ദർഭത്തിൽ മൃഗത്തിന്റെ തലയിൽ കൈ വയ്ക്കുന്ന ആചാരപ്രവൃത്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; സമ്മർദത്തിന്റെ അളവോ പ്രതീകാർഥമോ അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: קָרְבָּנוֹ
  choice: തന്റെ വഴിപാട്
  rationale: ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന അർപ്പണം എന്ന קָרְבָּן എന്ന പദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְשָׁחַט
  choice: അറുക്കണം
  rationale: യാഗമൃഗത്തെ ആചാരപരമായി കൊല്ലുന്നതിന് മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ആരാധനാസന്ദർഭത്തിലെ നിശ്ചിത കൂടാരനാമം സംക്ഷിപ്തവും പരിചിതവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: וְזָרְקוּ
  choice: എറിഞ്ഞൊഴിക്കണം
  rationale: രക്തം മൃദുവായി തളിക്കുന്നതല്ല, ശക്തിയോടെ യാഗപീഠത്തിലേക്ക് എറിയുന്ന ആചാരപ്രവൃത്തിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രുവിലെ ലിംഗസൂചകമായ കുടുംബബന്ധം പൊതുവാക്കാതെ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: യാഗപീഠത്തിന്റെ ചുറ്റും
  rationale: രക്തം യാഗപീഠത്തിന്റെ എല്ലാ വശങ്ങളിലുമായി പ്രയോഗിക്കണമെന്ന വിതരണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ കൈവയ്ക്കൽ
  choice: പ്രതീകാർഥം ചേർക്കാതെ ‘തലയിൽ കൈവെച്ച്’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: കുറ്റം കൈമാറൽ, താദാത്മ്യപ്പെടൽ തുടങ്ങിയ വ്യാഖ്യാനങ്ങൾ വാചകത്തിൽ ചേർക്കുക; അല്ലെങ്കിൽ സമ്മർദം ഊന്നി ‘കൈ അമർത്തിവെച്ച്’ എന്നു നൽകുക.
  rationale: വാക്യം ആചാരപ്രവൃത്തി മാത്രം വിവരിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ അർഥം ഇവിടെ വിശദീകരിക്കുന്നില്ല.
- issue: בְּנֵי אַהֲרֹן എന്ന ലിംഗസൂചക കുടുംബപദം
  choice: അഹരോന്റെ പുത്രന്മാർ
  alternative: അഹരോന്റെ സന്തതികൾ; അഹരോന്യ പുരോഹിതന്മാർ
  rationale: മൂലപാഠം പ്രത്യേകമായി ‘പുത്രന്മാർ’ എന്നു പറയുന്നു; പൊതുവായ പദം ഉപയോഗിക്കുന്നത് ഉറവിടത്തിന്റെ കൃത്യത കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആചാരനിർദേശ ശൈലി. പരമ്പരാഗതമായി പരിചിതമായ ‘സമാഗമകൂടാരം’, ‘യാഗപീഠം’ എന്നീ പദങ്ങൾ നിലനിർത്തി; അപരിചിതമായ സംസ്കൃതഭാരം ഒഴിവാക്കി.
