- from: അവൻ തന്റെ വഴിപാടിന്റെ തലയിൽ കൈവെച്ച്, സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽവെച്ച് അതിനെ അറുക്കണം. അഹരോന്റെ പുത്രന്മാർ അതിന്റെ രക്തം യാഗപീഠത്തിന്റെ ചുറ്റും എറിഞ്ഞൊഴിക്കണം.[a]
