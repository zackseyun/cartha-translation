  terminology: «സമാധാനയാഗം», «വഴിപാട്», «കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന്», and «യഹ്‌വെയുടെ സന്നിധിയിൽ» are suitable. The footnote responsibly records alternatives for זֶבַח שְׁלָמִים without making an interpretive alternative the main text. «ഊനമില്ലാത്തത്» appropriately expresses the sacrificial sense of תָּמִים.
  issues:
