source:
  edition: WLC
  text: וְ/אִם זֶ֥בַח שְׁלָמִ֖ים קָרְבָּנ֑/וֹ אִ֤ם מִן הַ/בָּקָר֙ ה֣וּא מַקְרִ֔יב אִם זָכָר֙ אִם נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖/נּוּ לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: ml
  text: അവന്റെ വഴിപാട് സമാധാനയാഗമാണെങ്കിൽ[a], അവൻ കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് അർപ്പിക്കുന്നതാണെങ്കിൽ, ആണായാലും പെണ്ണായാലും അത് ഊനമില്ലാത്തതായിരിക്കണം; അത് യഹ്‌വെയുടെ സന്നിധിയിൽ അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൂട്ടായ്മയാഗം” അല്ലെങ്കിൽ “ക്ഷേമയാഗം.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “സമാധാനവഴിപാടുകളുടെ യാഗം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: സമാധാനയാഗം
  rationale: זֶבַח യാഗത്തെയും שְׁלָמִים ഈ പ്രത്യേക വഴിപാടുവർഗത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സംയുക്തപദമായി നൽകിയെങ്കിലും, എബ്രായത്തിലെ വിപുലമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: קָרְבָּן ദൈവസന്നിധിയിലേക്ക് കൊണ്ടുവരുന്ന പൊതുവായ അർപ്പണത്തെ സൂചിപ്പിക്കുന്നു; യാഗനിയമങ്ങളുടെ സന്ദർഭത്തിൽ ‘വഴിപാട്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִן הַבָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന്
  rationale: בָּקָר പശുവർഗത്തിൽപ്പെട്ട കൂട്ടുമൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന്’ വർഗവും കൂട്ടവും വ്യക്തമാക്കുന്നു.
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: അർപ്പിക്കുക / അർപ്പിക്കണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ അടുത്തുകൊണ്ടുവരുക, സമർപ്പിക്കുക എന്നർത്ഥം നൽകുന്നു; ‘അർപ്പിക്കുക’ സ്വാഭാവികമായ ആരാധനാഭാഷയാണ്.
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: ആണായാലും പെണ്ണായാലും
  rationale: ഇരട്ട אִם ഘടന ഏതു ലിംഗത്തിലുള്ള മൃഗവും അനുവദനീയമാണെന്ന തിരഞ്ഞെടുപ്പ് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תָּמִים
  choice: ഊനമില്ലാത്തത്
  rationale: യാഗമൃഗത്തിന്റെ ശാരീരിക വൈകല്യമോ ദോഷമോ ഇല്ലാത്ത അവസ്ഥയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ‘ഊനമില്ലാത്തത്’ കൃത്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമാണ്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന ബന്ധാർത്ഥവും יהוה എന്ന ദൈവനാമവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യാഹ്‌വെ; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു. മലയാളത്തിലെ വായനാസൗകര്യത്തിന് ‘യഹ്‌വെ’ ഉപയോഗിച്ചു.
- issue: שְׁלָמִים എന്ന യാഗവർഗത്തിന്റെ പേര്
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: ഈ പദത്തിന്റെ അർത്ഥവലയം സമാധാനം, സമ്പൂർണക്ഷേമം, കൂട്ടായ്മ എന്നിവ ഉൾക്കൊള്ളാം. മുഖ്യപാഠത്തിൽ പരമ്പരാഗതവും വിശാലവുമായ ‘സമാധാനയാഗം’ സ്വീകരിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. യാഗനിയമത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തിയിരിക്കുമ്പോഴും എബ്രായ വാക്യഘടന വാക്കിന് വാക്കായി പകർത്തിയിട്ടില്ല. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
