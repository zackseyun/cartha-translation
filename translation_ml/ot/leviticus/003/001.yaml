    issue: Temporal wording for a conditional clause
    rationale: «അവൻ അതിനെ കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് അർപ്പിക്കുമ്പോൾ» means “when he offers it from the herd,” whereas אִם ... מַקְרִיב is conditional (“if he offers it from the herd”).
  - severity: low
    issue: Compressed expression of the unblemished-animal requirement
    rationale: «ഊനമില്ലാത്തതിനെ ... അർപ്പിക്കണം» is understandable, but «അത് ഊനമില്ലാത്തതായിരിക്കണം» explicitly and naturally predicates the required condition of the animal.
