language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: ml
  text: അവൻ തന്റെ വഴിപാടായി ഒരു ചെമ്മരിയാടിനെ[a] അർപ്പിക്കുന്നുവെങ്കിൽ, അതിനെ യഹ്‌വേയുടെ സന്നിധിയിൽ കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു കുഞ്ഞാടിനെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: എങ്കിൽ
  rationale: യാഗനിർദേശങ്ങളിലെ ഒരു വ്യവസ്ഥാപരമായ സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാള വ്യവസ്ഥാരൂപം ഉപയോഗിച്ചു.
- source_word: כֶּשֶׂב
  choice: ചെമ്മരിയാട്
  rationale: പദം പ്രായം കൃത്യമായി നിർണയിക്കാതെ ചെമ്മരിയാടിനെയോ കുഞ്ഞാടിനെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: מַקְרִיב
  choice: അർപ്പിക്കുന്നുവെങ്കിൽ
  rationale: ഹിഫിൽ രൂപത്തിലെ ‘അടുത്തുകൊണ്ടുവരുക/അർപ്പിക്കുക’ എന്ന ആരാധനാപരമായ അർഥവും വ്യവസ്ഥ അവതരിപ്പിക്കുന്ന പങ്കും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קָרְבָּנוֹ
  choice: തന്റെ വഴിപാടായി
  rationale: ദൈവസന്നിധിയിലേക്ക് കൊണ്ടുവരുന്ന പൊതുവായ അർപ്പണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വഴിപാട്’ അനുയോജ്യമാണ്; ‘യാഗം’ എന്ന കൂടുതൽ ചുരുങ്ങിയ അർഥം ഒഴിവാക്കി.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: അതിനെ ... കൊണ്ടുവരണം
  rationale: നിയമനിർദേശത്തിലെ തുടർച്ചയും ബാധ്യതയും മലയാളത്തിലെ ‘വണം’ രൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു; ആവർത്തനം ഒഴിവാക്കാൻ രണ്ടാമത്തെ קרב-നെ ‘കൊണ്ടുവരണം’ എന്നു നൽകി.
- source_word: לִפְנֵי
  choice: സന്നിധിയിൽ
  rationale: സ്ഥലപരവും ആരാധനാപരവുമായ ‘മുമ്പാകെ/സാന്നിധ്യത്തിൽ’ എന്ന ആശയം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്തി; പദവിയാൽ പകരംവയ്ക്കുകയോ മറ്റൊരു പരമ്പരാഗത ഉച്ചാരണരൂപം തെരഞ്ഞെടുക്കുകയോ ചെയ്തില്ല.
- issue: כֶּשֶׂב എന്ന പദത്തിലെ പ്രായസംബന്ധമായ അനിശ്ചിതത്വം
  choice: മുഖ്യപാഠത്തിൽ ‘ചെമ്മരിയാട്’, അടിക്കുറിപ്പിൽ ‘കുഞ്ഞാട്’
  alternative: മുഖ്യപാഠത്തിൽ ‘കുഞ്ഞാട്’
  rationale: ഈ പദത്തിന് ചെമ്മരിയാടിനെയും പ്രത്യേകിച്ച് ഇളം ചെമ്മരിയാടായ കുഞ്ഞാടിനെയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ മൂലത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആരാധനാ-നിയമ ശൈലി. ‘അർപ്പിക്കുക’ എന്നും ‘കൊണ്ടുവരുക’ എന്നും ഉപയോഗിച്ച് മൂലത്തിലെ קרב എന്ന ധാതുവിന്റെ ആവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ വ്യത്യസ്തമായി പ്രകടിപ്പിച്ചു; [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
