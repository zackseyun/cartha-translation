reference: Leviticus 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: ml
  text: അവന്റെ വഴിപാട് യഹ്‌വേയ്ക്കുള്ള സമാധാനയാഗമായി[a] ആട്ടിൻപറ്റത്തിൽനിന്നാണെങ്കിൽ, ആണായാലും പെണ്ണായാലും ഊനമില്ലാത്തതിനെ അവൻ അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൂട്ടായ്മയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം. സമാധാനം എന്ന ആശയത്തോടൊപ്പം പങ്കിട്ട ക്ഷേമത്തെയും യാഗഭോജനത്തിലെ കൂട്ടായ്മയെയും സൂചിപ്പിക്കാവുന്ന שְׁלָמִים എന്ന ഹീബ്രായ പദമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ആണെങ്കിൽ
  rationale: മുൻപത്തെ യാഗനിർദേശത്തോടു ബന്ധപ്പെട്ടു നിൽക്കുന്ന വ്യവസ്ഥയെ സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ പ്രകടമാക്കുന്നു; ഹീബ്രായിലെ തുടക്കസംയോജകത്തിന്റെ ബന്ധം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: מִן הַצֹּאן
  choice: ആട്ടിൻപറ്റത്തിൽനിന്ന്
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. അടുത്ത വാക്യങ്ങളിൽ ഇവ വേർതിരിക്കപ്പെടുന്നതിനാൽ ഇവിടെ പൊതുവായ ‘ആട്ടിൻപറ്റം’ നിലനിർത്തുന്നു.
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: കുർബാനിക സന്ദർഭത്തിലെ ദൈവത്തിനു കൊണ്ടുവരുന്ന സമർപ്പണത്തെ മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְזֶבַח שְׁלָמִים
  choice: സമാധാനയാഗമായി
  rationale: זֶבַח എന്ന യാഗധാരണയും שְׁלָמִים എന്ന സാങ്കേതിക പദത്തിന്റെ പരമ്പരാഗത സമാധാനാർഥവും സംക്ഷിപ്തമായ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; കൂട്ടായ്മയുടെയും പങ്കിട്ട ക്ഷേമത്തിന്റെയും ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേയ്ക്ക്
  rationale: ഹീബ്രായിലെ ദൈവനാമമായ יהוהയെ പേരായിത്തന്നെ അവതരിപ്പിക്കുകയും לְ എന്ന സമർപ്പണബന്ധം ‘-യ്ക്ക്’ വഴി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: זָכָר אוֹ נְקֵבָה
  choice: ആണായാലും പെണ്ണായാലും
  rationale: യാഗമൃഗത്തിന്റെ ലിംഗത്തെക്കുറിച്ചുള്ള ഇരു സാധ്യതകളും സ്രോതസ്സിന്റെ ക്രമത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: תָּמִים
  choice: ഊനമില്ലാത്തതിനെ
  rationale: യാഗമൃഗത്തിൽ ദേഹപരമായ ന്യൂനതയോ വൈകല്യമോ ഉണ്ടാകരുതെന്ന ആചാരപരമായ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: יַקְרִיבֶנּוּ
  choice: അവൻ അർപ്പിക്കണം
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗമായി മുന്നിൽ കൊണ്ടുവന്ന് സമർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘അർപ്പിക്കണം’ നിർദേശത്തിന്റെ ബലം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ പേരായിത്തന്നെ നിലനിർത്തുന്നു; ‘യഹ്‌വേ’ സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ അർഥവ്യാപ്തി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം
  rationale: പരമ്പരാഗത സാങ്കേതികപദം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ പദം സമാധാനത്തിൽ മാത്രം ഒതുങ്ങാതെ ക്ഷേമം, പങ്കിടൽ, യാഗഭോജനത്തിലെ കൂട്ടായ്മ എന്നിവയും സൂചിപ്പിക്കാമെന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആചാരപരമായ ഭാഷ ഉപയോഗിച്ചു. ഹീബ്രായ വാക്യക്രമം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും വ്യവസ്ഥാസൂചകം മലയാളത്തിൽ സ്വാഭാവികമായി വാക്യാവസാനത്തോട് ചേർത്തു; ‘ആണായാലും പെണ്ണായാലും’ എന്നത് ഊനമില്ലായ്മയുടെ നിബന്ധനയ്ക്കുമുമ്പിൽ വെച്ച് രണ്ടും മൃഗത്തെയാണ് വിശേഷിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കി.
