source:
  edition: WLC
  text: וְ/הִקְטִ֨ירוּ אֹת֤/וֹ בְנֵֽי אַהֲרֹן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ֣/עֹלָ֔ה אֲשֶׁ֥ר עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: ml
  text: അഹരോന്റെ പുത്രന്മാർ അതിനെ യാഗപീഠത്തിൽ, തീയിൽ കത്തുന്ന വിറകിന്മേലുള്ള ഹോമയാഗത്തിന്മേൽ വെച്ച് ദഹിപ്പിക്കണം. അത് യഹോവയ്ക്കു പ്രസാദകരമായ സൗരഭ്യമായ, അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭോജനയാഗം.”
    reason: אִשֶּׁה എന്ന സാങ്കേതിക യാഗപദം സാധാരണയായി അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘ഭോജനയാഗം’ എന്നത് അതിന്റെ മറ്റൊരു വ്യാഖ്യാനപരമായ പരിഭാഷയാണ്.
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: ദഹിപ്പിക്കണം
  rationale: യാഗസന്ദർഭത്തിലെ קטר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗപീഠത്തിൽ വസ്തു പുകയായി ഉയരുന്നവിധം കത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആചാരനിർദേശത്തിന്റെ ഭാവവും സ്വാഭാവികമായ മലയാളവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אֹתוֹ
  choice: അതിനെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന സമാധാനയാഗത്തിന്റെ കൊഴുപ്പുഭാഗങ്ങളിലേക്കാണ് ഏകവചന കർമസർവനാമം തിരിച്ചുപോകുന്നത്.
- source_word: בְנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർ
  rationale: ബന്ധവും പുരോഹിതചുമതലയും നേരിട്ട് സൂചിപ്പിക്കുന്ന, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പരിഭാഷ.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശാസൂചകമായ -ה ഇവിടെ ആചാരക്രിയയുടെ ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ത്തിന്മേൽ’ അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל הָעֹלָה
  choice: ഹോമയാഗത്തിന്മേൽ വെച്ച്
  rationale: עַל എന്നത് ഇവിടെ മുകളിലായുള്ള സ്ഥാനബന്ധം സൂചിപ്പിക്കുന്നതായി എടുത്തു. ‘വെച്ച്’ ചേർക്കുന്നത് മലയാളത്തിൽ ക്രമീകരണം വ്യക്തമാക്കുന്നു; ‘ഹോമയാഗം’ עֹלָהയുടെ നിലവാരമുള്ള ആചാരപദമാണ്.
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: തീയുടെമേലുള്ള വിറകിന്മേൽ ഇരിക്കുന്ന
  rationale: 'മൂലത്തിലെ ആവർത്തിത സ്ഥാനബന്ധങ്ങൾ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിലാക്കി: തീ, അതിന്മേൽ വിറക്, അതിന്മേൽ ഹോമയാഗം.'
- source_word: אִשֵּׁה
  choice: ദഹനയാഗം
  rationale: ഇത് അഗ്നിയിലൂടെ അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. ‘ദഹനയാഗം’ മലയാളത്തിൽ വ്യക്തമാണ്; ‘ഭോജനയാഗം’ എന്ന പരിഭാഷ ദൈവം അക്ഷരാർഥത്തിൽ ഭക്ഷിക്കുന്നു എന്ന തെറ്റിദ്ധാരണയ്ക്ക് ഇടയാക്കാം. സാധുവായ മറ്റൊരു അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യം
  rationale: സ്ഥിരമായ യാഗപ്രയോഗം യഹോവയ്ക്ക് സ്വീകാര്യവും പ്രസാദകരവുമായ അർപ്പണത്തെ സൂചിപ്പിക്കുന്നു. ‘സൗരഭ്യം’ ഗൗരവവും വായനാസൗകര്യവും നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: ലാമെദ് സമർപ്പണവും ബന്ധവും സൂചിപ്പിക്കുന്നു. ദൈവനാമമായ יהוה മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ നാലക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു സ്ഥാനപദം ഉപയോഗിക്കാതെ നാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: אִשֵּׁה എന്ന യാഗസാങ്കേതിക പദത്തിന്റെ അർഥം
  choice: ദഹനയാഗം
  alternative: ഭോജനയാഗം
  rationale: അഗ്നിയിലൂടെ അർപ്പിക്കുന്ന യാഗം എന്ന അടിസ്ഥാന ആശയം മുഖ്യപാഠത്തിൽ നൽകി. യാഗം യഹോവയുടെ ‘ഭോജനം’ എന്ന ആരാധനാപരമായ സങ്കൽപ്പവുമായി ഈ പദത്തിന് ബന്ധമുണ്ടാകാമെന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകി; അക്ഷരാർഥ ദൈവഭക്ഷണം സൂചിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ആചാരപദങ്ങളായ ‘യാഗപീഠം’, ‘ഹോമയാഗം’, ‘ദഹനയാഗം’ എന്നിവ സ്ഥിരതയ്ക്കായി ഉപയോഗിച്ചു. മൂലത്തിലെ പാളികളായ സ്ഥാനക്രമം വ്യക്തമായി നിലനിർത്തി; കൃത്രിമമായ പദാനുപദ വാക്യഘടന ഒഴിവാക്കി.
