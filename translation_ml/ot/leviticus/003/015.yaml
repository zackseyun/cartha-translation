- from: രണ്ടു വൃക്കകളും, അവയുടെമേൽ അരക്കെട്ടിന്റെ ഭാഗത്തുള്ള കൊഴുപ്പും, കരളിന്മേലുള്ള അനുബന്ധഭാഗവും[a] വൃക്കകളോടൊപ്പം[b] അവൻ നീക്കം ചെയ്യണം.
  to: രണ്ടു വൃക്കകളും, അവയുടെമേലുള്ളതും അരപ്രദേശത്തിന്മേലുള്ളതുമായ കൊഴുപ്പും, കരളിന്മേലുള്ള അനുബന്ധഭാഗവും[a] വൃക്കകളോടൊപ്പം[b] അവൻ നീക്കം ചെയ്യണം.
