source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: ml
  text: രണ്ടു വൃക്കകളും, അവയുടെമേലുള്ളതും അരപ്രദേശത്തിന്മേലുള്ളതുമായ കൊഴുപ്പും, കരളിന്മേലുള്ള അനുബന്ധഭാഗവും[a] വൃക്കകളോടൊപ്പം[b] അവൻ നീക്കം ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കരളിന്റെ ഒരു ഖണ്ഡം.’ ഈ ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന്റെ (יֹתֶרֶת) കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ അമിതമായ ശരീരശാസ്ത്രകൃത്യത ഒഴിവാക്കാൻ ‘അനുബന്ധഭാഗം’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘വൃക്കകളിന്മേൽ.’ ഇവിടെ ഈ ഭാഗം വൃക്കകളോടൊപ്പം നീക്കം ചെയ്യണമെന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: രണ്ടു വൃക്കകൾ
  rationale: യാഗമൃഗത്തിന്റെ ശരീരഘടനയിൽ כְּלָיָה വ്യക്തമായി വൃക്കയെ സൂചിപ്പിക്കുന്നു; ദ്വിവചനരൂപം ‘രണ്ടു വൃക്കകൾ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: הַחֵלֶב
  choice: കൊഴുപ്പ്
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസന്ദർഭത്തിൽ חֵלֶב നീക്കിവെച്ച് അർപ്പിക്കേണ്ട വിശിഷ്ട കൊഴുപ്പുഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കൊഴുപ്പ്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: അവയുടെമേൽ
  rationale: ഈ ബന്ധവാക്യം വൃക്കകളെയും അവയോടു ചേർന്നിരിക്കുന്ന കൊഴുപ്പിനെയും സൂചിപ്പിക്കുന്നു; എബ്രായത്തിലെ സ്ഥലബന്ധം നിലനിർത്തി.
- source_word: הַכְּסָלִים
  choice: അരക്കെട്ടിന്റെ ഭാഗം
  rationale: ഇവിടെ כְּסָלִים മൃഗത്തിന്റെ കടിപ്രദേശത്തെയോ അരക്കെട്ടിനോടടുത്ത ഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു; ‘അരക്കെട്ടിന്റെ ഭാഗം’ സാധാരണ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന ശരീരസ്ഥാന വിവരണമാണ്.
- source_word: הַיֹּתֶרֶת
  choice: അനുബന്ധഭാഗം
  rationale: ഈ പദം കരളുമായി ബന്ധപ്പെട്ട, കൃത്യമായി തിരിച്ചറിയാൻ പ്രയാസമുള്ള ഒരു നീണ്ടുനിൽക്കുന്ന ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘അനുബന്ധഭാഗം’ അനാവശ്യമായ ആധുനിക ശരീരശാസ്ത്രകൃത്യത അവകാശപ്പെടാതെ പദത്തിന്റെ പൊതുവായ ആശയം നിലനിർത്തുന്നു.
- source_word: עַל הַכָּבֵד
  choice: കരളിന്മേലുള്ള
  rationale: עַל എന്നതിന്റെ അടിസ്ഥാന സ്ഥലബന്ധമായ ‘മേൽ’ നിലനിർത്തിയതോടൊപ്പം മലയാളവാക്യത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: עַל הַכְּלָיֹת
  choice: വൃക്കകളോടൊപ്പം
  rationale: അക്ഷരാർഥത്തിൽ ‘വൃക്കകളിന്മേൽ’ എന്നാണ്; എന്നാൽ ഈ യാഗനിർദേശസൂത്രത്തിൽ പ്രസ്തുത കരൾഭാഗം വൃക്കകളോടൊപ്പം നീക്കണമെന്ന നടപടിക്രമാർത്ഥമാണ് സാധ്യതയേറിയത്. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יְסִירֶנָּה
  choice: അവൻ നീക്കം ചെയ്യണം
  rationale: סור എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ആചാരപരമായ നിർദേശത്തിൽ ‘നീക്കം ചെയ്യുക’ എന്ന കാരണാർത്ഥം വഹിക്കുന്നു; ‘ചെയ്യണം’ മലയാളത്തിലെ നിയമനിർദേശശൈലിക്ക് സ്വാഭാവികമാണ്.
