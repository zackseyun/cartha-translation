translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ അവയവപ്പട്ടിക ‘-ഉം’ ഘടനയിലൂടെ നിലനിർത്തി; അനിശ്ചിതമായ ശരീരശാസ്ത്രപദത്തിന് പൊതുവായ പരിഭാഷയും വിശദീകരണ അടിക്കുറിപ്പും നൽകി.
