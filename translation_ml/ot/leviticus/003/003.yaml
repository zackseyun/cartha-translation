id: LEV.3.3
reference: Leviticus 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרִיב֙ מִ/זֶּ֣בַח הַ/שְּׁלָמִ֔ים אִשֶּׁ֖ה לַ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: ml
  text: അവൻ സമാധാനയാഗത്തിൽനിന്ന് യഹ്‌വേക്കുള്ള അഗ്നിയർപ്പണമായി[a] ആന്തരാവയവങ്ങളെ മൂടുന്ന മേദസ്സും ആന്തരാവയവങ്ങളിന്മേലുള്ള സകല മേദസ്സും അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭോജനയാഗമായി.”
    reason: אִשֶּׁה എന്ന പദം തീയിൽ ദഹിപ്പിക്കുന്ന യാഗം എന്നോ ദൈവത്തിനുള്ള ഭോജനസമ്മാനം എന്നോ ഗ്രഹിക്കാവുന്നതിനാൽ പദാർഥവൈകല്യം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: അർപ്പിക്കണം
  rationale: ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ഔപചാരികമായി കൊണ്ടുവന്ന് സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അർപ്പിക്കുക’ സ്വാഭാവികവും ആചാരപരമായ അർഥം നിലനിർത്തുന്നതുമാണ്.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗത്തിൽനിന്ന്
  rationale: זֶבַח യാഗബലിയെയും שְׁלָמִים സമാധാനം, ക്ഷേമം, കൂട്ടായ്മ എന്നിവയുമായി ബന്ധപ്പെട്ട യാഗവിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു. പരിചിതമായ യാഗനാമമായ ‘സമാധാനയാഗം’ നിലനിർത്തുന്നു.
- source_word: אִשֶּׁה
  choice: അഗ്നിയർപ്പണം
  rationale: പുരോഹിതഗ്രന്ഥങ്ങളിലെ ഈ സാങ്കേതികപദം തീയിൽ ദഹിപ്പിച്ച് അർപ്പിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്നു. ‘അഗ്നിയർപ്പണം’ അഗ്നിയുമായുള്ള ബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു; ‘ഭോജനയാഗം’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്ക്
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്ന് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַחֵלֶב
  choice: മേദസ്സ്
  rationale: യാഗനിയമത്തിൽ മൃഗത്തിന്റെ അർപ്പണത്തിനായി വേർതിരിക്കുന്ന കൊഴുപ്പുള്ള ഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മേദസ്സ്’ ഈ ആചാരപരവും ശരീരശാസ്ത്രപരവുമായ അർഥത്തിന് യോജിച്ച പദമാണ്.
- source_word: הַמְכַסֶּה
  choice: മൂടുന്ന
  rationale: ആന്തരാവയവങ്ങളുടെ പുറത്ത് ആവരണമായി കിടക്കുന്ന മേദസ്സിനെ വിശേഷിപ്പിക്കുന്ന കർത്തൃവാചക പങ്കാളിത്തരൂപത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: הַקֶּרֶב
  choice: ആന്തരാവയവങ്ങൾ
  rationale: മൃഗബലിയുടെ ശരീരഘടനാപരമായ സന്ദർഭത്തിൽ ഉള്ളിലുള്ള അവയവങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: ആന്തരാവയവങ്ങളിന്മേലുള്ള സകല മേദസ്സും
  rationale: അവയവങ്ങളെ പൊതിഞ്ഞിരിക്കുന്ന മേദസ്സിനോടൊപ്പം അവയുടെമേൽ ചേർന്നിരിക്കുന്ന ശേഷിക്കുന്ന മേദസ്സിനെയും പദപ്രയോഗം ഉൾക്കൊള്ളുന്നു; עַל എന്നതിന്റെ സ്ഥാനബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള നിയമനാമം പൊതുവായ സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: אִשֶּׁה എന്ന യാഗസാങ്കേതികപദം
  choice: അഗ്നിയർപ്പണം
  alternative: ഭോജനയാഗം; തീയിൽ അർപ്പിക്കുന്ന യാഗം
  rationale: പദത്തിന്റെ അഗ്നിസംബന്ധമായ പരമ്പരാഗത ഗ്രഹണം മുഖ്യപാഠത്തിൽ നിലനിർത്തുമ്പോഴും, ദൈവത്തിനുള്ള ഭോജനസമ്മാനമെന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ യാഗനിയമ ശൈലി. ‘സമാധാനയാഗം,’ ‘അഗ്നിയർപ്പണം,’ ‘മേദസ്സ്’ എന്നീ പദങ്ങൾ സാങ്കേതിക കൃത്യതയ്ക്കായി ഉപയോഗിച്ചു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സുഗമമാക്കി.
