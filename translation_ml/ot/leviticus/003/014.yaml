source:
  edition: WLC
  text: וְ/הִקְרִ֤יב מִמֶּ֨/נּוּ֙ קָרְבָּנ֔/וֹ אִשֶּׁ֖ה לַֽ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: ml
  text: 'അതിൽനിന്ന് അവൻ യഹ്‌വേക്കു തീയിൽ അർപ്പിക്കുന്ന വഴിപാടായി[a] തന്റെ വഴിപാട് അർപ്പിക്കണം: ആന്തരാവയവങ്ങളെ മൂടുന്ന കൊഴുപ്പും ആന്തരാവയവങ്ങളിന്മേലുള്ള സകല കൊഴുപ്പും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭോജനാർപ്പണമായി.” אִשֶּׁה എന്ന എബ്രായ യാഗപദം പരമ്പരാഗതമായി “തീയാൽ അർപ്പിക്കുന്ന വഴിപാട്” എന്നു പരിഭാഷപ്പെടുത്തപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: അർപ്പിക്കണം
  rationale: ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ വഴിപാട് ദൈവസന്നിധിയിൽ സമർപ്പിക്കുന്ന ഔപചാരിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അർപ്പിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִמֶּנּוּ
  choice: അതിൽനിന്ന്
  rationale: പ്രത്യയം മുമ്പ് പരാമർശിച്ച യാഗമൃഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യക്തിയെയല്ല.
- source_word: קָרְבָּנוֹ
  choice: തന്റെ വഴിപാട്
  rationale: קָרְבָּן എന്ന സാങ്കേതിക യാഗപദത്തിന് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ആരാധനാസന്ദർഭത്തിന് യോജിച്ച പദമാണ് ‘വഴിപാട്’.
- source_word: אִשֶּׁה
  choice: ദഹനാർപ്പണം
  rationale: പദം തീയിൽ അർപ്പിക്കപ്പെടുന്ന യാഗഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ദഹനാർപ്പണം’ തീ മുഖേനയുള്ള അർപ്പണത്തിന്റെ ആശയം സംക്ഷിപ്തമായി നൽകുന്നു; ‘ഭോജനയാഗം’ എന്ന് നിർണ്ണയിക്കുന്നതിനെക്കാൾ ഉറവിടത്തിന്റെ രൂപശാസ്ത്രപരമായ ബന്ധം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: לְ സമർപ്പണത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; ദൈവനാമം മറച്ചുവയ്ക്കാതെ יהוה എന്ന ഉടമ്പടിനാമം ‘യഹ്‌വേ’യായി ലിപ്യന്തരിച്ചു.
- source_word: הַחֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗനിയമത്തിൽ മൃഗത്തിന്റെ ദഹിപ്പിക്കാനായി വേർതിരിക്കുന്ന കൊഴുപ്പുഭാഗങ്ങളെയാണ് חֵלֶב സൂചിപ്പിക്കുന്നത്.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: ആന്തരാവയവങ്ങളെ മൂടുന്ന
  rationale: എബ്രായ കർത്തൃവാചക വിശേഷണരൂപവും അതിന്റെ ശരീരശാസ്ത്രപരമായ സ്ഥാനബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: ആന്തരാവയവങ്ങളിന്മേലുള്ള സകല കൊഴുപ്പും
  rationale: עַל എന്നതിന്റെ സ്ഥാനസൂചനയും כָּל എന്നതിന്റെ സമഗ്രതയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായി കാണുന്ന നാലക്ഷര ദൈവനാമത്തെ ബഹുമാനപദവി കൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധ്യതയേറിയ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ അർത്ഥം
  choice: ദഹനാർപ്പണം
  alternative: ഭോജനയാഗം / തീയാൽ അർപ്പിക്കുന്ന വഴിപാട്
  rationale: ഈ പദത്തിന്റെ കൃത്യമായ വ്യുത്പത്തിയും അർത്ഥവ്യാപ്തിയും ചർച്ചാവിഷയമാണ്. മുഖ്യപാഠം തീയിൽ ദഹിപ്പിച്ചുള്ള സമർപ്പണത്തെ വ്യക്തമാക്കുന്നു; പകരംവിവർത്തനം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ യാഗനിയമ ശൈലി. ‘ആന്തരാവയവങ്ങൾ’, ‘കൊഴുപ്പ്’ എന്നീ വ്യക്തമായ ശരീരശാസ്ത്രപദങ്ങൾ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ തുടർന്നുപോകുന്ന പട്ടികാസ്വഭാവം അവസാനത്തെ അർധവിരാമസദൃശമായ കോളൺ ഘടനയിൽ നിലനിർത്തി.
