source:
  edition: WLC
  text: וְ/אִ֥ם עֵ֖ז קָרְבָּנ֑/וֹ וְ/הִקְרִיב֖/וֹ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: ml
  text: എന്നാൽ അവന്റെ അർപ്പണം ഒരു കോലാടാണെങ്കിൽ, അവൻ അതിനെ യഹ്‌വെയുടെ[a] സന്നിധിയിൽ സമർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’—ദൈവത്തിന്റെ വ്യക്തിനാമം; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപവും പരമ്പരാഗത പരിഭാഷയും അറിയിക്കുക.
lexical_decisions:
- source_word: וְאִם
  choice: ആണെങ്കിൽ
  rationale: തുടർച്ചയായ ബലിനിർദേശങ്ങളിൽ അടുത്ത സാധ്യത അവതരിപ്പിക്കുന്ന നിബന്ധനാപ്രയോഗം. മലയാളത്തിൽ വേറൊരു വിരോധസൂചകം ചേർക്കാതെ സ്വാഭാവികമായി നിബന്ധന വ്യക്തമാക്കുന്നു.
- source_word: עֵז
  choice: ഒരു കോലാട്
  rationale: എബ്രായ ഏകവചനനാമം ഇവിടെ goat എന്ന പൊതുവായ അർഥത്തിലാണ്; ചെമ്മരിയാടിൽനിന്ന് വേർതിരിച്ചറിയാൻ ‘കോലാട്’ ഉപയോഗിച്ചു.
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ അർപ്പണം
  rationale: ദൈവസന്നിധിയിലേക്ക് കൊണ്ടുവരുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്ന പൊതുവായ പദമാണ്; ‘ബലി’ എന്ന കൂടുതൽ പരിമിതമായ അർഥം നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: וְהִקְרִיבוֹ
  choice: അവൻ അതിനെ ... സമർപ്പിക്കണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം സമീപത്തേക്ക് കൊണ്ടുവന്ന് അർപ്പിക്കുക/സമർപ്പിക്കുക എന്ന ആരാധനാപരമായ അർഥം നൽകുന്നു. നിയമനിർദേശത്തിന്റെ ബലം ‘വേണം’കൊണ്ട് വ്യക്തമാക്കി.
- source_word: לִפְנֵי
  choice: സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിൽ എന്ന സ്ഥലപരവും ആരാധനാപരവുമായ ആശയം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ നാല് എബ്രായ വ്യഞ്ജനാക്ഷരങ്ങളുടെ ശീർഷകപകരം ഒഴിവാക്കി, വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഒരു ശീർഷകമല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ പരമ്പരാഗത ശീർഷകപകരത്തിനു പകരം നാമം ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ആരാധനാപരമായ ഗൗരവമുള്ള മലയാളം. വാക്യക്രമം സ്വാഭാവികമാക്കിയെങ്കിലും നിബന്ധന, ഏകവചനം, കർത്താവ്, കർമം, ദൈവസന്നിധിയിലെ സമർപ്പണം എന്നിവ മൂലപാഠത്തോട് ചേർന്നു നിലനിർത്തി.
