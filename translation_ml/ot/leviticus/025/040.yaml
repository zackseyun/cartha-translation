reference: Leviticus 25:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כְּ/שָׂכִ֥יר כְּ/תוֹשָׁ֖ב יִהְיֶ֣ה עִמָּ֑/ךְ עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל יַעֲבֹ֥ד עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: ml
  text: അവൻ നിന്റെ അടുക്കൽ ഒരു കൂലിപ്പണിക്കാരനെപ്പോലെയും നിന്റെ ഇടയിൽ പാർക്കുന്ന പരദേശിയെപ്പോലെയും ആയിരിക്കണം; ജൂബിലിവർഷംവരെ അവൻ നിന്നോടുകൂടെ ജോലി ചെയ്യണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: ഒരു കൂലിപ്പണിക്കാരനെപ്പോലെ
  rationale: שָׂכִיר കൂലിക്കു ജോലി ചെയ്യുന്ന ആളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കൂലിപ്പണിക്കാരൻ’ അടിമയല്ലാത്ത തൊഴിലാളിയുടെ നില ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: כְּתוֹשָׁב
  choice: നിന്റെ ഇടയിൽ പാർക്കുന്ന പരദേശിയെപ്പോലെ
  rationale: תּוֹשָׁב സ്വദേശിയല്ലെങ്കിലും സമൂഹത്തിനുള്ളിൽ താമസിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സാമൂഹിക-നിയമപരമായ പദമാണ്. ‘പാർക്കുന്ന പരദേശി’ ഈ താമസസ്വഭാവവും അന്യദേശീയ നിലയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִהְיֶה עִמָּךְ
  choice: അവൻ നിന്റെ അടുക്കൽ ... ആയിരിക്കണം
  rationale: ഈ പ്രയോഗം യജമാനനുമായുള്ള അവന്റെ നിലയെ നിർണ്ണയിക്കുന്നു. ‘നിന്റെ അടുക്കൽ’ עִמָּךְ എന്നതിന്റെ ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു; താരതമ്യബലം തുടർന്നുള്ള രണ്ട് כְּ ഉപസർഗങ്ങളിലൂടെ പ്രകടമാകുന്നു.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: ജൂബിലിവർഷംവരെ
  rationale: ലേവ്യപുസ്തകം 25-ലെ മോചനവർഷത്തിനുള്ള സാങ്കേതിക നാമം സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: יַעֲבֹד עִמָּךְ
  choice: അവൻ നിന്റെ അടുക്കൽ സേവിക്കണം
  rationale: עבד എന്നതിന് ‘സേവിക്കുക’ എന്നും ‘ജോലി ചെയ്യുക’ എന്നും അർഥമാകാം. ഇവിടെ ‘സേവിക്കണം’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘നിന്റെ അടുക്കൽ’ ആവർത്തിക്കുന്ന עִמָּךְ സംരക്ഷിക്കുകയും ‘നിനക്കുവേണ്ടി’ എന്ന് വ്യക്തമാക്കി ബന്ധത്തെ കൂടുതൽ അധീനതാപരമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കടബാധ്യതയാൽ സേവനത്തിലായ ഇസ്രായേല്യന്റെ സ്ഥാനം
  choice: അടിമയെന്നല്ല, കൂലിപ്പണിക്കാരനും പാർക്കുന്ന പരദേശിയും പോലെയുള്ള താൽക്കാലികവും സംരക്ഷിതവുമായ നിലയായി പരിഭാഷപ്പെടുത്തി.
  alternative: അവൻ ഒരു കൂലിവേലക്കാരനെപ്പോലെ ഇരിക്കണം; അവൻ നിന്നെ സേവിക്കണം.
  rationale: അടുത്ത സന്ദർഭം (ലേവ്യർ 25:39–43) ഈ വ്യക്തിയെ അടിമയിൽനിന്ന് വേർതിരിക്കുകയും അവന്റെ സേവനം ജൂബിലിവർഷംവരെ പരിമിതപ്പെടുത്തുകയും ചെയ്യുന്നു. അതിനാൽ മൂലപാഠം നിയന്ത്രിക്കുന്ന അധീനതയെക്കാൾ കടുത്ത അടിമത്തധ്വനി പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഏകവചന രണ്ടാംപുരുഷനായ ‘നിന്റെ’ ഉപയോഗിച്ച് ഹീബ്രുവിലെ രൂപം നിലനിർത്തി. ‘ജൂബിലിവർഷം’ നിയമപരമായ സാങ്കേതിക പദമായി ഉപയോഗിച്ചു.
