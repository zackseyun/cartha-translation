id: LEV.25.39
reference: Leviticus 25:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי יָמ֥וּךְ אָחִ֛י/ךָ עִמָּ֖/ךְ וְ/נִמְכַּר לָ֑/ךְ לֹא תַעֲבֹ֥ד בּ֖/וֹ עֲבֹ֥דַת עָֽבֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a servant.
translation:
  language: ml
  text: നിന്റെ സഹോദരൻ നിന്റെ അടുക്കൽ ദരിദ്രനായിത്തീർന്ന് തന്നെത്തന്നെ നിനക്കു വിൽക്കുകയാണെങ്കിൽ[b], അവനെക്കൊണ്ട് അടിമവേല ചെയ്യിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അടിമയുടെ വേല അവനെക്കൊണ്ട് ചെയ്യിക്കരുത്.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “നിനക്കു വിൽക്കപ്പെടുകയാണെങ്കിൽ.” എബ്രായപ്രയോഗം കർമണിയായി വിവർത്തനം ചെയ്യാം; സന്ദർഭത്തിൽ ദരിദ്രനായ ഒരാൾ കടബാധ്യതമൂലം തന്നെത്താൻ സേവനത്തിനായി വിൽക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִי
  choice: എങ്കിൽ
  rationale: ബന്ധകത്തോടുകൂടിയ വ്യവസ്ഥയെ സ്വാഭാവികമായ മലയാള നിയമശൈലിയിൽ അവതരിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തോടുള്ള ബന്ധം വാക്യഘടനയിൽ നിലനിൽക്കുന്നു.
- source_word: יָמוּךְ
  choice: ദരിദ്രനായിത്തീർന്ന്
  rationale: സാമ്പത്തികമായി ക്ഷയിച്ച് ദാരിദ്ര്യത്തിലാകുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ആരംഭഭാവം നിലനിർത്തുന്നു.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരൻ
  rationale: അക്ഷരാർഥത്തിലുള്ള കുടുംബബന്ധപദം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഉടമ്പടിസമൂഹത്തിലെ സഹാംഗത്തെയും സൂചിപ്പിക്കാം.
- source_word: עִמָּךְ
  choice: നിന്റെ അടുക്കൽ
  rationale: അഭിസംബോധിതനുമായുള്ള സമീപബന്ധവും സാഹചര്യവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; 'നിന്നോടുകൂടെ' എന്നത് ഇവിടെ അസ്വാഭാവികമാകാം.
- source_word: וְנִמְכַּר לָךְ
  choice: തനിക്കുതന്നെ നിനക്കു വിൽക്കുകയാണെങ്കിൽ
  rationale: നിഫാൽ രൂപത്തിന്റെ വ്യാകരണപരമായ കർമണിപ്രയോഗസാധ്യത അംഗീകരിച്ചുകൊണ്ട്, ദാരിദ്ര്യംമൂലമുള്ള സ്വയംവിൽപ്പനയാണ് സന്ദർഭത്തിലെ പ്രയോഗാർഥമെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: അവനെക്കൊണ്ട് ... ചെയ്യിക്കരുത്
  rationale: അവനിൽനിന്ന് നിർബന്ധമായി അധ്വാനം ആവശ്യപ്പെടരുതെന്ന നിയമനിരോധനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֲבֹדַת עָבֶד
  choice: അടിമവേല
  rationale: ‘അടിമയുടെ സേവനം/വേല’ എന്ന സാമൂഹികപദവിയോടു ബന്ധപ്പെട്ട ശക്തമായ അർഥം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു; സാധാരണ സേവനമെന്നാക്കി മൃദൂകരിക്കുന്നില്ല.
theological_decisions:
- issue: ഇസ്രായേലിലെ കടബാധ്യതാസേവനനിയമത്തിലെ സാമൂഹികപദവിയുടെ വിവർത്തനം
  choice: അടിമവേല ചെയ്യിക്കരുത്
  alternative: ദാസനെപ്പോലെ സേവിപ്പിക്കരുത്
  rationale: עבד എന്ന പദവും עֲבֹדַת עָבֶד എന്ന പ്രയോഗവും ഇവിടെ സാധാരണ പരിചരണമല്ല, അടിമപ്പദവിയിലുള്ള അധ്വാനമാണ് സൂചിപ്പിക്കുന്നത്. ദരിദ്രനായ സഹോദരൻ ഒരു സേവനബന്ധത്തിൽ പ്രവേശിക്കുന്നതിനെ വാക്യം നിഷേധിക്കുന്നില്ല; അവനെ അടിമയുടെ തൊഴിൽപദവിയിൽ കൈകാര്യം ചെയ്യുന്നതാണ് വിലക്കുന്നത്.
- issue: וְנִמְכַּר എന്ന നിഫാൽ രൂപത്തിലെ കർമണി–മധ്യമാർഥ അസന്ദിഗ്ധത
  choice: മുഖ്യപാഠത്തിൽ സ്വയംവിൽപ്പന; അടിക്കുറിപ്പിൽ കർമണിപ്രയോഗം
  alternative: നിനക്കു വിൽക്കപ്പെടുകയാണെങ്കിൽ
  rationale: വ്യാകരണരൂപം കർമണിയായി വിവർത്തനം ചെയ്യാം; എന്നാൽ ദാരിദ്ര്യനിയമത്തിന്റെ സന്ദർഭം കടബാധ്യതമൂലമുള്ള സ്വയംവിൽപ്പനയെ സൂചിപ്പിക്കുന്നു. യഥാർഥ ഭാഷാപരമായ അസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമനിരോധനത്തിന്റെ ശക്തി നിലനിർത്താൻ ‘അടിമവേല’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
