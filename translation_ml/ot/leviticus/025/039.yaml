- from: നിന്റെ സഹോദരൻ നിന്റെ അടുക്കൽ ദരിദ്രനായിത്തീർന്ന് തനിക്കുതന്നെ നിനക്കു വിൽക്കുകയാണെങ്കിൽ[b], അവനെക്കൊണ്ട് അടിമവേല ചെയ്യിക്കരുത്.[a]
