reference: Leviticus 25:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിൽ താമസിക്കുന്ന ഒരു വിദേശിക്കു മതിയായ സാമ്പത്തികശേഷി കൈവരുകയും, അവനോടൊപ്പമുള്ള നിങ്ങളുടെ സഹോദരൻ ദരിദ്രനായിത്തീർന്ന്, നിങ്ങളുടെ ഇടയിൽ താമസിക്കുന്ന ആ വിദേശിക്കോ വിദേശിയുടെ കുടുംബത്തിലെ ഒരംഗത്തിനോ[a] സ്വയം വിൽക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു വിദേശിയുടെ കുടുംബത്തിന്റെ വേരിനോ ശാഖയ്‌ക്കോ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: ദുഷ്കരമായ עֵקֶר എന്ന പദത്തിന്റെ അക്ഷരാർഥസാധ്യതയും പ്രധാനപാഠത്തിലെ സന്ദർഭോചിതമായ വ്യക്തിസൂചനയും വായനക്കാരന് അറിയിക്കുന്നു.
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: മതിയായ സാമ്പത്തികശേഷി കൈവരുക
  rationale: ‘കൈ എത്തുക’ എന്ന എബ്രായ പ്രയോഗം സാമ്പത്തികമായി കഴിവുള്ള നിലയിലെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. അതിന്റെ സാമ്പത്തിക അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: גֵּר וְתוֹשָׁב
  choice: താമസിക്കുന്ന ഒരു വിദേശി
  rationale: ഇസ്രായേൽ സമൂഹത്തിനുള്ളിൽ പാർക്കുന്നെങ്കിലും സ്വദേശിയല്ലാത്ത വ്യക്തിയെയാണ് ഈ സംയുക്തപ്രയോഗം സൂചിപ്പിക്കുന്നത്. രണ്ട് പദങ്ങളെയും അസ്വാഭാവികമായി വേർതിരിക്കാതെ താമസസ്ഥിതിയും വിദേശിത്വവും നിലനിർത്തുന്നു.
- source_word: וּמָךְ
  choice: ദരിദ്രനായിത്തീരുക
  rationale: മുമ്പുണ്ടായിരുന്ന നിലയിൽനിന്ന് ദാരിദ്ര്യത്തിലേക്കുള്ള ഇടിവ് ക്രിയ സൂചിപ്പിക്കുന്നു.
- source_word: אָחִיךָ
  choice: നിങ്ങളുടെ സഹോദരൻ
  rationale: ഉടമ്പടി സമൂഹത്തിലെ സഹഇസ്രായേല്യനെ സൂചിപ്പിക്കുന്ന കുടുംബബന്ധഭാഷ അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: עִמּוֹ
  choice: അവന്റെ അടുത്തുള്ള
  rationale: സമ്പന്നനായ വിദേശിയോടുള്ള സാമീപ്യവും സാഹചര്യബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וְנִמְכַּר
  choice: തന്നെത്തന്നെ വിൽക്കുക
  rationale: രൂപം കർമണിയായിരിക്കാമെങ്കിലും, കടുത്ത ദാരിദ്ര്യംമൂലം ഒരാൾ സ്വയം സേവനത്തിന് വിൽക്കുന്ന നിയമസന്ദർഭമാണ് ഇവിടെ. പ്രതിഫലനാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: വിദേശിയുടെ കുടുംബത്തിലെ ഒരംഗത്തിന്
  rationale: עֵקֶר എന്ന ദുഷ്കരപദം കുടുംബത്തിന്റെ വേര്, ശാഖ, അല്ലെങ്കിൽ അതിൽപ്പെട്ട ഒരാൾ എന്ന ആശയം നൽകാം. സന്ദർഭത്തിൽ സാധ്യതയേറിയ വ്യക്തിസൂചന പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേല്യ ബന്ധുത്വഭാഷയുടെ പരിഭാഷ
  choice: നിങ്ങളുടെ സഹോദരൻ
  alternative: നിങ്ങളുടെ സഹഇസ്രായേല്യൻ / ബന്ധു
  rationale: നിയമത്തിന്റെ കുടുംബപരവും ധാർമികവുമായ ഊന്നൽ നഷ്ടപ്പെടാതിരിക്കാൻ അക്ഷരാർഥത്തിലുള്ള ബന്ധുപദം നിലനിർത്തുന്നു.
- issue: וְנִמְכַּר സൂചിപ്പിക്കുന്ന വിൽപ്പനയുടെ സ്വഭാവം
  choice: തന്നെത്തന്നെ വിൽക്കുക
  alternative: വിൽക്കപ്പെടുക
  rationale: എബ്രായരൂപത്തിലെ കർമണി/പ്രതിഫലന സാധ്യത അംഗീകരിച്ചുകൊണ്ട്, ദാരിദ്ര്യംമൂലമുള്ള സ്വയംവിൽപ്പന എന്ന നിയമസന്ദർഭത്തിന് യോജിച്ച വായന സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്കു ഗ്രാഹ്യവുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന അവസാനത്തെ ദുഷ്കരപ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
