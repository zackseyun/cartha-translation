  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: ml
  text: കാരണം, ഇസ്രായേൽമക്കൾ[a] എനിക്കുള്ള അടിമകളാണ്[b]; അവർ എന്റെ അടിമകളാണ്. അവരെ ഞാൻ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചു. ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹോവ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; അഥവാ ‘ഇസ്രായേല്യർ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ദാസന്മാർ’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം ബന്ധിതസേവനത്തെ സൂചിപ്പിക്കുന്നു; ഇസ്രായേൽ മനുഷ്യയജമാനന്മാരുടേതല്ല, യഹോവയ്ക്കുള്ളവരാണ് എന്നതാണ് സന്ദർഭത്തിലെ ഊന്നൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള നിയമനിർദേശത്തിന് അടിസ്ഥാനകാരണം അവതരിപ്പിക്കുന്ന ഹീബ്രു ബന്ധപദത്തിന്റെ വിശദീകരണസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִי
  choice: എനിക്കുള്ള
  rationale: ‘എനിക്ക്/എന്റേതായി’ എന്ന ഉടമസ്ഥതയുടെയും അവകാശബന്ധത്തിന്റെയും ആശയം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബ-സമൂഹ പ്രയോഗം സ്വാഭാവികവും പരമ്പരാഗതവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֲבָדִים / עֲבָדַי
  choice: അടിമകൾ / എന്റെ അടിമകൾ
  rationale: ഈ അധ്യായത്തിലെ മനുഷ്യയജമാനന്മാരോടുള്ള സ്ഥിരബന്ധത്തിന് എതിരായി യഹോവയ്ക്കുള്ള അവകാശബന്ധമാണ് ഊന്നുന്നത്. ആവർത്തനം ഹീബ്രുവിലെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: അവരെ ... പുറപ്പെടുവിച്ചത് ഞാനാണ്
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘പുറത്തുകൊണ്ടുവരുക’ എന്ന പുറപ്പാട്-സൂത്രവാക്യം നിലനിർത്തുകയും കർത്താവായ ‘ഞാൻ’ എന്ന ഊന്നൽ മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: മൂലത്തിലെ ‘ഈജിപ്ത് ദേശത്തിൽനിന്ന്’ എന്ന സ്ഥിരപ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപദംകൊണ്ട് മറയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ഉടമസ്ഥരൂപമുള്ള ഉടമ്പടി-സൂത്രവാക്യം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിബന്ധവും ബന്ധിതസേവനവും സൂചിപ്പിക്കുന്ന עבד എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: വാക്യത്തിന്റെ ന്യായം ഇസ്രായേൽ മനുഷ്യരുടെ സ്ഥിരസ്വത്തല്ല, യഹോവയ്ക്കുള്ളവരാണ് എന്ന അവകാശബന്ധത്തിലാണ്. ‘അടിമകൾ’ ആ ബന്ധിതസ്ഥിതിയുടെ ശക്തി നിലനിർത്തുന്നു; എന്നാൽ പദത്തിന്റെ ‘ദാസൻ/സേവകൻ’ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക സമൂഹപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ / ഇസ്രായേല്യർ
  rationale: മലയാളത്തിലെ ‘മക്കൾ’ മൂലത്തിലെ വംശപരവും കുടുംബപരവുമായ സമൂഹധ്വനി സ്വാഭാവികമായി നൽകുന്നു; ഹീബ്രുവിന്റെ അക്ഷരാർഥമായ ‘പുത്രന്മാർ’ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് രൂപപരമായ വിവരം നഷ്ടപ്പെടാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ആവർത്തനവും അവകാശബന്ധത്തിന്റെ ഊന്നലും നിലനിർത്തി; ‘ഞാനാണ്’ എന്ന രൂപം പുറപ്പെടുവിച്ച കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ഊന്നുന്നു.
