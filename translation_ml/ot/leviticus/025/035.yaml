id: LEV.25.35
reference: Leviticus 25:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָ֥טָה יָד֖/וֹ עִמָּ֑/ךְ וְ/הֶֽחֱזַ֣קְתָּ בּ֔/וֹ גֵּ֧ר וְ/תוֹשָׁ֛ב וָ/חַ֖י עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: ml
  text: നിന്റെ സഹോദരൻ ദരിദ്രനായിത്തീരുകയും നിന്റെ അടുക്കൽ അവന്റെ കൈ തളരുകയും ചെയ്താൽ[a], നീ അവനെ താങ്ങണം[b], അങ്ങനെ അവൻ പരദേശിയായി വന്നു പാർക്കുന്നവനെയോ താൽക്കാലിക താമസക്കാരനെയോ പോലെ നിന്റെ അടുക്കൽ ജീവിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നിന്റെ അടുക്കൽ അവന്റെ കൈ തളരുകയും ചെയ്താൽ.’ ഇത് ഉപജീവനമാർഗമോ സ്വയം നിലനിൽക്കാനുള്ള കഴിവോ നഷ്ടപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ‘പരദേശിയായി വന്നു പാർക്കുന്നവനും താൽക്കാലിക താമസക്കാരനും’ എന്ന എബ്രായ പ്രയോഗം വാക്യഘടനയിൽ സംക്ഷിപ്തമാണ്. അതിനെ, പിന്തുണയ്ക്കപ്പെടുന്ന വ്യക്തിയെ വിശേഷിപ്പിച്ചുകൊണ്ട്, ‘നീ അവനെ—പരദേശിയായി വന്നു പാർക്കുന്നവനെയും താൽക്കാലിക താമസക്കാരനെയും—താങ്ങണം’ എന്നും ഗ്രഹിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יָמוּךְ
  choice: ദരിദ്രനായിത്തീരുക
  rationale: സാമ്പത്തികമായി താഴ്ന്ന നിലയിലാകുന്നതിനെ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരൻ
  rationale: മൂലപാഠത്തിലെ ബന്ധുത്വപദം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഉടമ്പടിസമൂഹത്തിലെ സഹാംഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: നിന്റെ അടുക്കൽ അവന്റെ കൈ തളരുക
  rationale: ഉപജീവനശേഷിയോ സാമ്പത്തിക കരുത്തോ നഷ്ടപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; ആവർത്തിക്കുന്ന עִמָּךְ എന്നതിന്റെ സാമൂഹിക-സാമീപ്യഭാവവും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: നീ അവനെ താങ്ങണം
  rationale: חזק എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ആവശ്യത്തിലായവനെ പിടിച്ചുനിർത്തുകയോ പിന്തുണയ്ക്കുകയോ ചെയ്യുക എന്ന അർഥത്തിലാണ്.
- source_word: גֵּר
  choice: പരദേശിയായി വന്നു പാർക്കുന്നവൻ
  rationale: ഇസ്രായേൽ സമൂഹത്തിനുള്ളിൽ താമസിക്കുന്ന അന്യദേശക്കാരന്റെ നിയമ-സാമൂഹിക നില ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְתוֹשָׁב
  choice: താൽക്കാലിക താമസക്കാരൻ
  rationale: גֵּר എന്ന പദത്തിൽനിന്നു വേറിട്ട, സ്ഥിരത കുറഞ്ഞ താമസനിലയെ വായനാസൗകര്യത്തോടെ സൂചിപ്പിക്കുന്നു.
- source_word: וָחַי עִמָּךְ
  choice: അവൻ നിന്റെ അടുക്കൽ ജീവിക്കട്ടെ
  rationale: പിന്തുണയുടെ ഉദ്ദേശ്യമോ ഫലമോ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുകയും עִמָּךְ എന്ന ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘നിന്റെ സഹോദരൻ’ എന്നതിന്റെ വ്യാപ്തി
  choice: മൂലത്തിലെ ബന്ധുത്വഭാഷയായ ‘നിന്റെ സഹോദരൻ’ നിലനിർത്തി, സന്ദർഭത്തിൽ സമൂഹത്തിലെ സഹാംഗത്തെ സൂചിപ്പിക്കാൻ അനുവദിച്ചു.
  alternative: ‘നിന്റെ സഹഇസ്രായേല്യൻ’ അല്ലെങ്കിൽ ‘നിന്റെ ബന്ധു’
  rationale: വ്യാഖ്യാനപരമായ വിപുലീകരണത്തിലൂടെ മൂലപാഠത്തിലെ കുടുംബബന്ധരൂപകം ഇല്ലാതാക്കാതിരിക്കാനാണ് ഈ തിരഞ്ഞെടുപ്പ്.
- issue: גֵּר וְתוֹשָׁב എന്ന സംക്ഷിപ്ത പ്രയോഗത്തിന്റെ ബന്ധം
  choice: 'ദരിദ്രനായ സഹോദരൻ സമൂഹത്തിൽ തുടരുന്ന നിലയോടുള്ള താരതമ്യമായി: ‘പരദേശിയായി വന്നു പാർക്കുന്നവനെയോ താൽക്കാലിക താമസക്കാരനെയോ പോലെ’.'
  alternative: 'ഇവരെ പിന്തുണയ്ക്കേണ്ട അധിക വ്യക്തികളായി: ‘പരദേശിയായി വന്നു പാർക്കുന്നവനെയും താൽക്കാലിക താമസക്കാരനെയും നീ താങ്ങണം’.'
  rationale: എബ്രായ വാക്യഘടന സംക്ഷിപ്തവും ഒന്നിലധികം വിധത്തിൽ ഗ്രഹിക്കാവുന്നതുമാണ്. പ്രധാന പാഠം സ്വാഭാവികമായ താരതമ്യബന്ധം സ്വീകരിക്കുന്നു; മറ്റൊരു സാധ്യവായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സാമ്പത്തിക തകർച്ചയെ സൂചിപ്പിക്കുന്ന ‘കൈ തളരുക’ എന്ന മൂലരൂപകം അടിക്കുറിപ്പോടെ നിലനിർത്തി. גֵּר, תוֹשָׁב എന്നീ വ്യത്യസ്ത സാമൂഹിക നിലകൾ മലയാളത്തിൽ വേർതിരിച്ചു.
