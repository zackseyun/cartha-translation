  verdict: revise
  source_fidelity: The conditional sense, remaining many years, proportional calculation, repayment, and concrete redemption amount are all represented accurately. However, “തന്നെ വാങ്ങിയ വില” can sound reflexive or ambiguous in Malayalam; the Hebrew means the amount paid to purchase him.
