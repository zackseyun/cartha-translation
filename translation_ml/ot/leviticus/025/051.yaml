id: LEV.25.51
reference: Leviticus 25:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם ע֥וֹד רַבּ֖וֹת בַּ/שָּׁנִ֑ים לְ/פִי/הֶן֙ יָשִׁ֣יב גְּאֻלָּת֔/וֹ מִ/כֶּ֖סֶף מִקְנָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/051.yaml
  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: ml
  text: ഇനിയും അനേകം വർഷങ്ങൾ ശേഷിക്കുന്നുവെങ്കിൽ, ആ വർഷങ്ങളുടെ അനുപാതത്തിൽ, അവനെ വാങ്ങിയ തുകയിൽനിന്ന് തന്റെ വീണ്ടെടുപ്പുവില[a] അവൻ തിരിച്ചടയ്ക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ വീണ്ടെടുപ്പ് അവൻ തിരിച്ചടയ്ക്കണം.” ഹീബ്രു നാമം വീണ്ടെടുപ്പിന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ വീണ്ടെടുപ്പിനായി തിരിച്ചടയ്ക്കേണ്ട തുകയെയാണ് ഉദ്ദേശിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: എങ്കിൽ
  rationale: നിയമത്തിലെ വ്യവസ്ഥാഭേദം അവതരിപ്പിക്കുന്ന സാധാരണ ഉപാധിപദമായി പരിഭാഷപ്പെടുത്തി.
- source_word: עוֹד רַבּוֹת בַּשָּׁנִים
  choice: ഇനിയും അനേകം വർഷങ്ങൾ ശേഷിക്കുന്നുവെങ്കിൽ
  rationale: עוֹד എന്നതിന്റെ ‘ഇനിയും’ എന്ന അർത്ഥവും അനേകം വർഷങ്ങൾ ബാക്കിയുണ്ടെന്ന ഹീബ്രു നിർമാണത്തിന്റെ സൂചനയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: לְפִיהֶן
  choice: ആ വർഷങ്ങളുടെ അനുപാതത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവയുടെ വായനുസരിച്ച്’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ മുമ്പ് പറഞ്ഞ വർഷങ്ങളുടെ എണ്ണത്തിന് ആനുപാതികമായി എന്നർത്ഥം നൽകുന്നു.
- source_word: יָשִׁיב
  choice: തിരിച്ചടയ്ക്കണം
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപം സാമ്പത്തിക-നിയമപരമായ ഈ സന്ദർഭത്തിൽ പണം മടക്കിനൽകുക അഥവാ തിരിച്ചടയ്ക്കുക എന്നാണ്.
- source_word: גְּאֻלָּתוֹ
  choice: തന്റെ വീണ്ടെടുപ്പുവില
  rationale: ഗെഉല്ലാ എന്ന നാമം വീണ്ടെടുപ്പിന്റെ പ്രവൃത്തിയെയും അതിനുള്ള തുകയെയും സൂചിപ്പിക്കാം; ഈ കണക്കുകൂട്ടൽസന്ദർഭത്തിൽ തുകയാണ് പ്രധാന സൂചന.
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: തന്നെ വാങ്ങിയ വിലയിൽനിന്ന്
  rationale: ‘അവന്റെ വാങ്ങലിന്റെ പണത്തിൽനിന്ന്’ എന്ന ഹീബ്രു ഘടന, ആ വ്യക്തിക്കായി ആദ്യം നൽകിയ വാങ്ങൽവിലയെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘വീണ്ടെടുപ്പുവില’ സന്ദർഭത്തിലെ സാമ്പത്തിക അർത്ഥം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പിൽ ഹീബ്രു നാമത്തിന്റെ യഥാർഥ അർത്ഥവ്യാപ്തി നിലനിർത്തി.
