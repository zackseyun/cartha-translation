  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּ֤י תָבֹ֨אוּ֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן לָ/כֶ֑ם וְ/שָׁבְתָ֣ה הָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക: ‘ഞാൻ നിങ്ങൾക്കു തരുന്ന ദേശത്തേക്കു നിങ്ങൾ ചെല്ലുമ്പോൾ, ദേശം യഹോവയ്ക്കായി ഒരു ശബ്ബത്ത് ആചരിക്കും.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോടു സംസാരിക്കുക
  rationale: കല്പനാരൂപത്തിന്റെ നേരിട്ടുള്ള ഭാവവും בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബബന്ധപരമായ പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: അവരോടു പറയുക
  rationale: നിയമനിർദേശത്തിന്റെ ആവർത്തനാത്മകവും ഔപചാരികവുമായ എബ്രായ ശൈലി സംരക്ഷിക്കുന്നു.
- source_word: כִּי תָבֹאוּ אֶל־הָאָרֶץ
  choice: ദേശത്തേക്കു നിങ്ങൾ ചെല്ലുമ്പോൾ
  rationale: ഇവിടെ כִּי പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവിസാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന കാലവാചകമായതിനാൽ ‘ചെല്ലുമ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: ഞാൻ നിങ്ങൾക്കു തരുന്ന
  rationale: നֹתֵן എന്ന പങ്കാളിക്രിയയുടെ ഇപ്പോഴുള്ളതോ ആസന്നമായതോ ആയ ദാനപ്രവർത്തനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְשָׁבְתָה הָאָרֶץ שַׁבָּת
  choice: ദേശം ഒരു ശബ്ബത്ത് ആചരിക്കണം
  rationale: ദേശം വ്യക്തിവൽക്കരിക്കപ്പെട്ട് ശബ്ബത്തുവിശ്രമം പാലിക്കുന്നുവെന്ന മൂലപാഠത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘ആചരിക്കുക’ ഈ സ്ഥാപനപരമായ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: לְ എന്ന മുൻപ്രത്യയത്തിന്റെ സമർപ്പണാർഥം ‘യ്ക്കായി’ എന്നു നൽകി; ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: ദേശം ശബ്ബത്ത് ആചരിക്കുന്നു എന്ന വ്യക്തിവൽക്കരണം
  choice: ദേശം ... ശബ്ബത്ത് ആചരിക്കണം
  alternative: ദേശത്തിനു ശബ്ബത്തുവിശ്രമം നൽകണം
  rationale: മൂലപാഠം ദേശത്തെയാണ് വ്യാകരണപരമായ കർത്താവാക്കുന്നത്; അതിലെ ദൈവശാസ്ത്രപരമായ ഊന്നലും രൂപകവും നഷ്ടപ്പെടാതിരിക്കാൻ സജീവരൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ നിയമനിർദേശ ശൈലി. ‘ഇസ്രായേൽമക്കൾ’, ‘ദേശം’, ‘ശബ്ബത്ത്’, ‘യഹോവ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി.
