id: LEV.25.11
reference: Leviticus 25:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: ml
  text: അതു യോബേൽവർഷമാണ്; അമ്പതാം വർഷം നിങ്ങൾക്കുള്ളതായിരിക്കും. നിങ്ങൾ വിതയ്ക്കരുത്; താനേ മുളച്ചുവളർന്നതു കൊയ്യരുത്; വെട്ടിയൊരുക്കാതെ വിട്ട മുന്തിരിവള്ളികളിലെ മുന്തിരിപ്പഴം ശേഖരിക്കരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹבֵל
  choice: യോബേൽവർഷം
  rationale: ലേവ്യപുസ്തകം 25-ലെ സന്ദർഭത്തിൽ ഈ പദം കാഹളത്തെയല്ല, പ്രത്യേകമായി നിശ്ചയിച്ച അമ്പതാം വർഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പരിചിതമായ തിരുവെഴുത്തുപദം നിലനിർത്തിക്കൊണ്ട് അർത്ഥം വ്യക്തമാക്കാൻ ‘വർഷം’ ചേർത്തു.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: അമ്പതാം വർഷം
  rationale: എബ്രായ നിർമാണത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: תִּהְיֶה לָכֶם
  choice: നിങ്ങൾക്കുള്ളതായിരിക്കണം
  rationale: ‘നിങ്ങൾക്കായി/നിങ്ങൾക്കുള്ളതായി ആയിരിക്കണം’ എന്ന ദാതൃസംബന്ധിയായ ആശയം നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ യോബേൽ എന്ന വിധേയപദം അനാവശ്യമായി ആവർത്തിക്കുന്നില്ല.
- source_word: לֹא תִזְרָעוּ
  choice: നിങ്ങൾ വിതയ്ക്കരുത്
  rationale: നിയമപരമായ നിരോധനം ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: לֹא תִקְצְרוּ
  choice: കൊയ്യരുത്
  rationale: ധാന്യവിളയുടെ കൊയ്ത്തിനെ സൂചിപ്പിക്കുന്ന ക്രിയയായി, മുന്തിരി ശേഖരിക്കുന്നതിനുള്ള പിന്നത്തെ ക്രിയയിൽനിന്ന് വ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: סְפִיחֶיהָ
  choice: താനേ മുളച്ചുവളർന്നതു
  rationale: വിതയ്ക്കാതെ സ്വയം വളരുന്ന വിളയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സ്വാഭാവിക മലയാളം തെരഞ്ഞെടുത്തു.
- source_word: לֹא תִבְצְרוּ
  choice: ശേഖരിക്കരുത്
  rationale: മുന്തിരിപ്പഴം പറിച്ചെടുക്കുന്ന വിളവെടുപ്പിനുള്ള പ്രത്യേക ക്രിയയുടെ സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נְזִרֶיהָ
  choice: വെട്ടിയൊരുക്കാതെ വിട്ട മുന്തിരിവള്ളികളിലെ മുന്തിരിപ്പഴം
  rationale: ഈ കൃഷിസന്ദർഭത്തിൽ പരിപാലിക്കാതെയോ വെട്ടിയൊരുക്കാതെയോ വിട്ട മുന്തിരിവള്ളികളുടെ വിളവിനെയാണ് സൂചിപ്പിക്കുന്നത്. בצר എന്ന ക്രിയയുടെ കർമ്മം മുന്തിരിപ്പഴമാണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ആരംഭവിധേയം (‘അതു യോബേൽവർഷമാണ്’)യും തുടർന്ന് വരുന്ന ‘അമ്പതാം വർഷം നിങ്ങൾക്കുള്ളതായിരിക്കണം’ എന്ന ഘടനയും വേർതിരിച്ച് നിലനിർത്തി. ഇവിടെ വിശദീകരണം ആവശ്യമായ നിർണായക പാഠഭേദമോ ഒഴിവാക്കാനാകാത്ത അർത്ഥസന്ദിഗ്ധതയോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
