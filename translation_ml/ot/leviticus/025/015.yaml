  source_fidelity: 'The temporal and proportional structure is accurately conveyed: purchase is governed by the years after the Jubilee, and sale by the remaining crop-bearing years. However, «സ്വജനം» normally denotes one’s own relative/kinsman and is narrower than עֲמִית, ‘fellow/associate’ in this legal setting.'
