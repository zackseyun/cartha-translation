language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: ml
  text: യൂബിലിക്കുശേഷമുള്ള വർഷങ്ങളുടെ എണ്ണമനുസരിച്ച് നിന്റെ സഹജനത്തിൽനിന്ന് നീ വാങ്ങണം; വിളവു ലഭിക്കുന്ന വർഷങ്ങളുടെ എണ്ണമനുസരിച്ച്[a] അവൻ നിനക്കു വിൽക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘വിളവുകളുടെ വർഷങ്ങളുടെ എണ്ണമനുസരിച്ച്.’ ഭൂമി സ്ഥിരമായി കൈമാറുന്നതല്ല; അടുത്ത യൂബിലിവരെ വിളവു ലഭിക്കുന്ന എത്ര വർഷങ്ങൾ ശേഷിക്കുന്നുവോ അതിന്റെ അടിസ്ഥാനത്തിലാണ് വിൽപ്പനവില നിശ്ചയിക്കേണ്ടത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר
  choice: എണ്ണമനുസരിച്ച്
  rationale: בְּ എന്ന മുൻപ്രത്യയത്തോടുകൂടിയ מִסְפָּר ഇവിടെ അളവിനെയോ മൂല്യനിർണയത്തിന്റെ അടിസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; ‘എണ്ണമനുസരിച്ച്’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אַחַר הַיּוֹבֵל
  choice: യൂബിലിക്കുശേഷമുള്ള
  rationale: യൂബിലി ചക്രവുമായി ബന്ധപ്പെട്ട കാലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: תִּקְנֶה
  choice: നീ വാങ്ങണം
  rationale: നിയമനിർദേശത്തിലെ രണ്ടാംപുരുഷ ഏകവചന അപൂർണക്രിയയുടെ നിർദേശാത്മക ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: നിന്റെ സ്വജനത്തിൽനിന്ന്
  rationale: עָמִית നിയമപരമായ ഈ സന്ദർഭത്തിൽ അതേ സമൂഹത്തിലെ സഹാംഗത്തെ സൂചിപ്പിക്കുന്നു; ‘സ്വജനം’ ബന്ധത്തിന്റെ സാമൂഹിക സ്വഭാവം നിലനിർത്തുകയും അനാവശ്യമായ പ്രത്യേകീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: שְׁנֵי תְבוּאֹת
  choice: വിളവു ലഭിക്കുന്ന വർഷങ്ങൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘വിളവുകളുടെ വർഷങ്ങൾ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെറും കലണ്ടർ വർഷങ്ങളല്ല, വിളവെടുക്കാവുന്ന ശേഷിക്കുന്ന വർഷങ്ങളാണ് ഉദ്ദേശ്യം.
- source_word: יִמְכָּר לָךְ
  choice: അവൻ നിനക്കു വിൽക്കണം
  rationale: വാങ്ങുന്നവന്റെ നടപടിക്കു സമാന്തരമായി വിൽക്കുന്നവന്റെ നിയമപരമായ നടപടി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ നിയമവചനത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. എബ്രായ വാക്യത്തിന്റെ വാങ്ങൽ–വിൽപ്പന സമാന്തരഘടന സംരക്ഷിച്ചിട്ടുണ്ട്.
