  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַֽעֲבַרְתָּ֞ שׁוֹפַ֤ר תְּרוּעָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִעִ֔י בֶּ/עָשׂ֖וֹר לַ/חֹ֑דֶשׁ בְּ/יוֹם֙ הַ/כִּפֻּרִ֔ים תַּעֲבִ֥ירוּ שׁוֹפָ֖ר בְּ/כָל אַרְצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: ml
  text: അപ്പോൾ, ഏഴാം മാസത്തിലെ പത്താം ദിവസം, നീ കൊമ്പുകാഹളം[a] ഉച്ചത്തിൽ മുഴക്കണം. പാപപരിഹാരദിവസത്തിൽ[b] നിങ്ങൾ നിങ്ങളുടെ ദേശത്തെങ്ങും കൊമ്പുകാഹളം മുഴക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം ‘ഷോഫാർ’; കൊമ്പുകൊണ്ടുള്ള ഒരു കാഹളം, പരമ്പരാഗതമായി പലപ്പോഴും ആട്ടുകൊറ്റന്റെ കൊമ്പിൽനിന്നുണ്ടാക്കുന്നതായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പാപപരിഹാരദിവസം’ എന്നതിനുള്ള എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘പരിഹാരങ്ങളുടെ ദിവസം’ എന്നാണ്; ‘പരിഹാരങ്ങൾ’ ബഹുവചനത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: നിങ്ങൾ ... മുഴക്കണം
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം അക്ഷരാർഥത്തിൽ ‘കടന്നുപോകാൻ ഇടയാക്കുക’ എന്നാണെങ്കിലും, שׁוֹפָר-നോടൊപ്പം വാദ്യത്തിന്റെ ശബ്ദം പുറപ്പെടുവിക്കുക എന്ന പ്രയോഗാർഥം നൽകുന്നു. മലയാളത്തിൽ ‘മുഴക്കണം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: שׁוֹפַר תְּרוּעָה
  choice: ഉച്ചത്തിൽ കൊമ്പുവാദ്യം
  rationale: שׁוֹפַר കൊമ്പുകൊണ്ടുള്ള ഒരു വാദ്യത്തെയും תְּרוּעָה ഉച്ചത്തിലുള്ള സൂചനാശബ്ദത്തെയും സൂചിപ്പിക്കുന്നു. ‘ഉച്ചത്തിൽ കൊമ്പുവാദ്യം മുഴക്കണം’ എന്നത് രണ്ടിന്റെയും ആശയം സ്വാഭാവിക മലയാളത്തിൽ ചേർത്തുനൽകുന്നു.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ഏഴാം മാസം
  rationale: കാലസൂചനയുടെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: ആ മാസത്തിന്റെ പത്താം ദിവസം
  rationale: ‘മാസത്തിന്റെ പത്തിൽ’ എന്ന എബ്രായ പ്രയോഗത്തെ സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: പാപപരിഹാരദിവസത്തിൽ
  rationale: നിശ്ചിത വിശുദ്ധദിവസത്തെ സൂചിപ്പിക്കുന്ന כִּפֻּרִים എന്ന പദത്തിന് മലയാളത്തിൽ പരിചിതവും അർഥവത്തുമായ സമാനപദം. മൂലത്തിലെ ബഹുവചനരൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲבִירוּ שׁוֹפָר
  choice: കൊമ്പുവാദ്യം മുഴക്കണം
  rationale: മുമ്പത്തെ പ്രയോഗത്തിന്റെ ആവർത്തനം നിലനിർത്തുന്നു; ബഹുവചന അഭിസംബോധന മലയാളത്തിലെ ‘നിങ്ങളുടെ’ എന്ന തുടർന്നുള്ള രൂപത്തോടും സന്ദർഭത്തോടും യോജിക്കുന്നു.
- source_word: בְּכָל אַרְצְכֶם
  choice: നിങ്ങളുടെ ദേശത്തെങ്ങും
  rationale: ദേശത്തിന്റെ മുഴുവൻ വ്യാപ്തിയെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: יוֹם הַכִּפֻּרִים എന്ന വിശുദ്ധദിവസനാമത്തിന്റെ പരിഭാഷ
  choice: പാപപരിഹാരദിവസം
  alternative: പരിഹാരങ്ങളുടെ ദിവസം
  rationale: മൂലരൂപം വ്യാകരണപരമായി ബഹുവചനമാണെങ്കിലും ഒരു നിർദിഷ്ട ആചാരദിവസത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ വായനക്കാർക്ക് വ്യക്തമായ പരമ്പരാഗത ഏകവചന ദിവസനാമം മുഖ്യപാഠത്തിൽ നൽകി, മൂലത്തിലെ ബഹുവചന സവിശേഷത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഷോഫാർ’ എന്ന അപരിചിത ലിപ്യന്തരണം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി ‘കൊമ്പുവാദ്യം’ ഉപയോഗിച്ചു; കൃത്യമായ എബ്രായ പദം അടിക്കുറിപ്പിൽ നിലനിർത്തി. ആദ്യവാക്യത്തിൽ തിയതിസൂചനയെ മുൻനിർത്തുന്നത് മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനും മൂലത്തിലെ കാലഘടനയ്ക്കും യോജിക്കുന്നു.
