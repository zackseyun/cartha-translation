review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the one-year redemption deadline, the permanent legal status of the sale, its continuation in the buyer's line, and its non-reversion at the Jubilee. The Hebrew legal idiom לֹא יֵצֵא, however, is better represented in Malayalam as not ‘returning’ rather than ‘leaving.’
  naturalness: ‘അത് വിട്ടുപോകുകയില്ല’ is ambiguous and unnatural for a property’s legal disposition. ‘അത് തിരിച്ചുപോകുകയില്ല’ is clear, idiomatic, and retains the source’s concrete movement idiom. Recasting the permanent status as ‘സ്ഥിരസ്വത്തായിരിക്കും’ gives the legal sense more naturally than ‘സ്ഥിരപ്പെട്ടിരിക്കും.’
  terminology: ‘വീണ്ടെടുക്കുക’ and ‘യോബേൽവർഷം’ are appropriate established terms. ‘സ്ഥിരസ്വത്ത്’ appropriately expresses the force of וְקָם ... לַצְּמִיתֻת without adding interpretation beyond the property-law context.
  issues:
  - severity: medium
    issue: The expression ‘യോബേൽവർഷത്തിൽ അത് വിട്ടുപോകുകയില്ല’ is semantically unclear in Malayalam.
    rationale: It can suggest that the house itself does not depart, rather than that it does not revert from the buyer’s ownership. The Hebrew idiom means that the property does not go out/revert at Jubilee; ‘തിരിച്ചുപോകുകയില്ല’ communicates this naturally while preserving the idiomatic image.
  - severity: low
    issue: ‘എന്നേക്കുമായി സ്ഥിരപ്പെട്ടിരിക്കും’ is less idiomatic for the legal status of a house.
    rationale: The source indicates that ownership stands permanently. ‘സ്ഥിരസ്വത്തായിരിക്കും’ is standard, concise Malayalam legal phrasing and explicitly links permanence to ownership.
  revised_text: എന്നാൽ, ഒരു പൂർണവർഷം തികയുന്നതിനുമുമ്പ് ആ വീട് വീണ്ടെടുക്കപ്പെടുന്നില്ലെങ്കിൽ, മതിലില്ലാത്ത പട്ടണത്തിലുള്ള ആ വീട് അതു വാങ്ങിയവന്റെയും അവന്റെ തലമുറകളുടെയും എന്നേക്കുമുള്ള സ്ഥിരസ്വത്തായിരിക്കും[a]; യോബേൽവർഷത്തിൽ അത് തിരിച്ചുപോകുകയില്ല[b].
