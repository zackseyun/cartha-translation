  to: എന്നാൽ, ഒരു പൂർണവർഷം തികയുന്നതിനുമുമ്പ് ആ വീട് വീണ്ടെടുക്കപ്പെടുന്നില്ലെങ്കിൽ, മതിലില്ലാത്ത പട്ടണത്തിലുള്ള ആ വീട് അതു വാങ്ങിയവന്റെയും അവന്റെ തലമുറകളുടെയും എന്നേക്കുമുള്ള സ്ഥിരസ്വത്തായിരിക്കും[a]; യോബേൽവർഷത്തിൽ അത് തിരിച്ചുപോകുകയില്ല[b].
  rationale: The revision preserves every legal element in the Hebrew while improving modern Malayalam clarity. It makes the permanent proprietary status explicit and renders the Jubilee non-reversion idiom in an intelligible but still source-sensitive way. The footnote clarifies the contextual legal referent without importing doctrinal claims.
