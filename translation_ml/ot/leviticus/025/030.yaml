reference: Leviticus 25:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: ml
  text: എന്നാൽ, ഒരു പൂർണവർഷം തികയുന്നതിനുമുമ്പ് ആ വീട് വീണ്ടെടുക്കപ്പെടുന്നില്ലെങ്കിൽ, മതിലില്ലാത്ത പട്ടണത്തിലുള്ള ആ വീട് അതു വാങ്ങിയവന്റെയും അവന്റെ തലമുറകളുടെയും എന്നേക്കുമുള്ള സ്ഥിരസ്വത്തായിരിക്കും[a]; യോബേൽവർഷത്തിൽ അത് തിരിച്ചുപോകുകയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എന്നേക്കുമായി നിൽക്കും.” വിൽപ്പന നിയമപരമായി സ്ഥിരമായിത്തീരും എന്നതാണ് എബ്രായ പ്രയോഗത്തിന്റെ അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: “യോബേൽവർഷത്തിൽ അത് തിരിച്ചുപോകുകയില്ല” എന്നത്, യോബേൽവർഷത്തിൽ ആ വീട് വിൽപ്പനക്കാരന്റെ കുടുംബത്തിലേക്ക് മടങ്ങുകയില്ല എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  choice: വീണ്ടെടുക്കപ്പെടുന്നില്ലെങ്കിൽ
  rationale: ഗാഅൽ എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ നിയമപരമായി സ്വത്ത് വിലകൊടുത്ത് തിരിച്ചെടുക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ലേവ്യപുസ്തകം 25-ലെ വീണ്ടെടുപ്പ് എന്ന മുഖ്യപദാവലി നിലനിർത്തുന്നു.
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: ഒരു പൂർണവർഷം തികയുന്നതിനുമുമ്പ്
  rationale: വീണ്ടെടുപ്പിനുള്ള സമയപരിധിയായ ഒരു സമ്പൂർണ വർഷത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സർവനാമത്തെ അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: എന്നേക്കുമായി സ്ഥിരപ്പെട്ടിരിക്കും
  rationale: അക്ഷരാർഥത്തിലെ ‘നിൽക്കും’ എന്നതിനെക്കാൾ, വിൽപ്പന നിയമപരമായി സ്ഥിരവും പിൻവലിക്കാനാകാത്തതുമായിത്തീരുന്നു എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; അതേസമയം ‘സ്ഥിരപ്പെടുക’ എന്ന രൂപം എബ്രായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לֹא חֹמָה
  choice: മതിലില്ലാത്ത പട്ടണത്തിലുള്ള ആ വീട്
  rationale: ആവർത്തനമുള്ള എബ്രായ ബന്ധവാക്യത്തെ അർഥനഷ്ടമില്ലാതെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളമാക്കുന്നു.
- source_word: לַקֹּנֶה אֹתוֹ
  choice: അതു വാങ്ങിയവനും
  rationale: ക്രയകർത്താവിനെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി തിരിച്ചറിയാവുന്ന സ്വാഭാവിക രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְדֹרֹתָיו
  choice: അവന്റെ തലമുറകൾക്കും
  rationale: ഉടമസ്ഥാവകാശം വാങ്ങിയവന്റെ വംശപരമ്പരയിലൂടെ തുടരുന്നു എന്ന ഔപചാരിക ആശയം നിലനിർത്തുന്നു.
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  choice: യോബേൽവർഷത്തിൽ അത് വിട്ടുപോകുകയില്ല
  rationale: ‘പുറപ്പെടുക’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗത്തിന്റെ നിയമാർഥമായ ഉടമയുടെ കൈയിൽനിന്ന് വിടുതൽ പ്രാപിക്കാതിരിക്കുക എന്നത് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יּוֹבֵל
  choice: യോബേൽവർഷം
  rationale: ലേവ്യപുസ്തകം 25-ലെ നിയമസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്ന പ്രചാരത്തിലുള്ള ബൈബിൾ പദം; ‘വർഷം’ ചേർക്കുന്നത് ആധുനിക വായനക്കാരന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മതിലില്ലാത്ത പട്ടണത്തിലെ വീടിന്റെ വിൽപ്പനയുടെ നിയമപരമായ പ്രാബല്യം
  choice: ഒരു പൂർണവർഷത്തിനകം വീണ്ടെടുക്കപ്പെടാത്ത വീട് വാങ്ങിയവന്റെയും അവന്റെ തലമുറകളുടെയും സ്ഥിരസ്വത്തായിത്തീരുകയും യോബേലിൽ ആദ്യകുടുംബത്തിലേക്ക് മടങ്ങാതിരിക്കുകയും ചെയ്യുന്നു.
  alternative: വിൽപ്പന വാങ്ങിയവന് സാധുവായി തുടരുന്നു എന്നു മാത്രം പറയുക, അല്ലെങ്കിൽ וְקָם എന്നത് ‘നിൽക്കും’ എന്ന് അക്ഷരാർഥത്തിൽ നൽകുക.
  rationale: וְקָם, לַצְּמִיתֻת, לְדֹרֹתָיו, לֹא יֵצֵא בַּיּוֹבֵל എന്നിവയുടെ സംയുക്തബലം സ്ഥിരവും പാരമ്പര്യമായി തുടരുന്നതുമായ കൈമാറ്റത്തെ സൂചിപ്പിക്കുന്നു. സ്വത്തുനിയമത്തിന്റെ പരിധിക്കപ്പുറം ദൈവശാസ്ത്രപരമായ നിഗമനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘വീണ്ടെടുക്കുക,’ ‘സ്ഥിരപ്പെടുക,’ ‘യോബേൽവർഷം’ എന്നീ പദങ്ങൾ അധ്യായത്തിലെ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ പദസാദൃശ്യം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
