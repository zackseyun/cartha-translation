  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: ml
  text: അവന് നിന്റെ പണം പലിശയ്ക്ക് വായ്പയായി നൽകരുത്[a]; നിന്റെ ഭക്ഷണം വർധനയ്ക്കായി നൽകരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പണം’ എന്നതിന് ‘വെള്ളി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം വെള്ളിയെയും പണത്തെയും സൂചിപ്പിക്കാം; ഇവിടെ വായ്പയുടെ സന്ദർഭമായതിനാൽ ‘പണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: b
    text: ‘വർധനയ്ക്കായി’ എന്നതിന് ‘ലാഭത്തിനായി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം നൽകിയ വസ്തുവിന്മേൽ ലഭിക്കുന്ന വർധനയെയോ നേട്ടത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפְּךָ
  choice: നിന്റെ പണം
  rationale: כֶּסֶף എന്നത് അക്ഷരാർഥത്തിൽ ‘വെള്ളി’ എന്നും സാമ്പത്തിക സന്ദർഭങ്ങളിൽ ‘പണം’ എന്നും അർഥമാക്കാം. വായ്പയെക്കുറിച്ചുള്ള ഈ നിയമസന്ദർഭത്തിൽ ‘പണം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: תִתֵּן לוֹ
  choice: അവന് ... കൊടുക്കരുത്
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കൊടുക്കുക’ എന്നാണ്. ‘പലിശയ്ക്ക്’ എന്ന അനുബന്ധപ്രയോഗം വായ്പ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ ‘പണം പലിശയ്ക്ക് കൊടുക്കുക’ എന്ന് പറഞ്ഞാൽ ആ സാമ്പത്തിക അർഥം സ്വാഭാവികമായി ലഭിക്കുന്നു.
- source_word: בְּנֶשֶׁךְ
  choice: പലിശയ്ക്ക്
  rationale: נֶשֶׁךְ വായ്പയ്ക്കു ചുമത്തുന്ന പലിശയെ സൂചിപ്പിക്കുന്നു. ‘പലിശയ്ക്ക്’ എന്നത് അമിതപലിശ എന്ന പരിമിതമായ ആശയം ചേർക്കാതെ ആ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וּבְמַרְבִּית
  choice: ലാഭത്തിനായി
  rationale: מַרְבִּית നൽകിയ വസ്തുവിന്മേൽ ഈടാക്കുന്ന വർധന, അധികം, അല്ലെങ്കിൽ നേട്ടം എന്ന അർഥം വഹിക്കുന്നു. ഭക്ഷണത്തിന്റെ സന്ദർഭത്തിൽ ‘ലാഭത്തിനായി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; ‘വർധനയ്ക്കായി’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אָכְלֶךָ
  choice: നിന്റെ ഭക്ഷണം
  rationale: אָכֶל എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘ഭക്ഷണം’ എന്നാണ്. ‘കരുതൽശേഖരം’ പോലുള്ള വ്യാഖ്യാനപരമായ പദങ്ങളെക്കാൾ ഇത് മൂലപാഠത്തിന്റെ മൂർത്തമായ ഭാഷ നിലനിർത്തുന്നു.
- source_word: לֹא ... לֹא
  choice: '... കൊടുക്കരുത്; ... കൊടുക്കുകയും അരുത്'
  rationale: ആവർത്തിക്കുന്ന രണ്ടു നിഷേധങ്ങളും ഏകോപിതമായ രണ്ടു വിലക്കുകളായി മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
