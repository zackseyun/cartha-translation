    rationale: Although ‘പലിശയ്ക്ക് കൊടുക്കുക’ may imply a loan in context, the Hebrew construction with money and interest has the idiomatic legal-economic sense ‘lend.’ Adding ‘വായ്പയായി’ safely makes this explicit.
  - severity: low
    issue: ‘ലാഭത്തിനായി’ is less source-specific for מַרְבִּית.
    rationale: The Hebrew denotes increase or additional return. ‘ലാഭം’ is possible, but ‘വർധന’ more directly preserves the lexical distinction and the formal parallel with interest.
