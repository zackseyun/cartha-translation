translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ വിലക്കിന്റെ ഗൗരവം നിലനിർത്തിയിട്ടുണ്ട്. ‘പലിശ’യും ‘ലാഭം/അധികം’യും എന്ന സമാന്തരവും എന്നാൽ പൂർണമായി ഒരേ അർഥമല്ലാത്തതുമായ പദങ്ങൾ വേർതിരിച്ചിരിക്കുന്നു.
