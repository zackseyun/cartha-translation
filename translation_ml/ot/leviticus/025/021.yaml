  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: ml
  text: അപ്പോൾ ആറാം വർഷത്തിൽ ഞാൻ നിങ്ങൾക്കുവേണ്ടി എന്റെ അനുഗ്രഹം കല്പിക്കും; അത് മൂന്നു വർഷത്തേക്കുള്ള വിളവ്[a] നൽകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിളവ്’ എന്നതിന് ‘കാർഷിക ഉൽപ്പാദനം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: അപ്പോൾ … ഞാൻ … കല്പിക്കും
  rationale: צוה എന്ന ക്രിയയുടെ ആജ്ഞാപനശക്തി ‘കല്പിക്കും’ നിലനിർത്തുന്നു. മുൻവാക്യത്തിലെ ചോദ്യത്തിനുള്ള മറുപടിയായതിനാൽ וְ എന്ന ബന്ധകത്തിന്റെ സന്ദർഭാർഥം ‘അപ്പോൾ’ എന്നു പ്രകടമാക്കി.
- source_word: אֶת־בִּרְכָתִי
  choice: എന്റെ അനുഗ്രഹം
  rationale: ദൈവം നൽകുന്ന അനുകൂലതയെയും അതിന്റെ ഫലമായ സമൃദ്ധിയെയും സൂചിപ്പിക്കുന്ന വിശാലവും നേരിട്ടുള്ളതുമായ പ്രയോഗം.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: לְ ഇവിടെ അനുഗ്രഹത്തിന്റെ ഗുണഭോക്താക്കളെ സൂചിപ്പിക്കുന്നു; ‘നിങ്ങൾക്കുവേണ്ടി’ ആ ഗുണഭോക്തൃഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: ആറാം വർഷത്തിൽ
  rationale: ശബ്ബത്തുവർഷചക്രവുമായി ബന്ധപ്പെട്ട സമയസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְעָשָׂת
  choice: ആ വർഷം … നൽകും
  rationale: സ്ത്രീലിംഗ ഏകവചനക്രിയയ്ക്ക് സന്ദർഭത്തിൽ ‘ആറാം വർഷം’ എന്നത് സ്വാഭാവിക വിഷയമായി ഗ്രഹിക്കാം. ‘നൽകും’ എന്നത് അസാധാരണമായ കാർഷിക ഉൽപ്പാദനം സുതാര്യമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: הַתְּבוּאָה
  choice: വിളവ്
  rationale: תבואה കാർഷിക ഉൽപ്പാദനത്തെയോ വിളവിനെയോ സൂചിപ്പിക്കുന്നു; ‘വിളവ്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: മൂന്നു വർഷത്തേക്കുള്ള
  rationale: വിളവ് മൂന്നു വർഷത്തേക്കു മതിയാകുമെന്ന സന്ദർഭാർഥം സംക്ഷിപ്തമായി നൽകുന്നു; ‘മതിയായ’ എന്ന വിശദീകരണപദം പ്രത്യേകം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: വാഗ്ദത്ത അനുഗ്രഹത്തിന്റെ സ്വഭാവം
  choice: അസാധാരണമായ കാർഷിക സമൃദ്ധി ഉളവാക്കുന്ന ദൈവത്തിന്റെ നേരിട്ടുള്ള അനുഗ്രഹകല്പന
  alternative: പൊതുവായ ദൈവപരിപാലനത്തെക്കുറിച്ചുള്ള പ്രസ്താവന മാത്രം
  rationale: ‘ഞാൻ കല്പിക്കും’ എന്നും ‘എന്റെ അനുഗ്രഹം’ എന്നും ദൈവം ഒന്നാംപുരുഷനിൽ പറയുന്നത് സാധാരണ വിളവുചക്രത്തെക്കുറിച്ചുള്ള പൊതുനിരീക്ഷണമല്ല, പ്രത്യേകമായ ദൈവിക ഇടപെടലാണെന്ന് സൂചിപ്പിക്കുന്നു.
- issue: וְעָשָׂת എന്ന ക്രിയയുടെ വ്യാകരണവിഷയം
  choice: ‘ആ വർഷം’ എന്നു വ്യക്തമാക്കി വിവർത്തനം ചെയ്യുക
  alternative: ‘അത്’ എന്നു മാത്രം നൽകി അനുഗ്രഹമോ വർഷമോ നിലമോ എന്നത് തുറന്നുവയ്ക്കുക
  rationale: സ്ത്രീലിംഗ ഏകവചനരൂപവും അടുത്തുള്ള הַשָּׁנָה എന്ന നാമവും ‘ആ വർഷം’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. മലയാളത്തിൽ അവ്യക്തമായ ‘അത്’ ഒഴിവാക്കുന്നത് സ്വാഭാവികത വർധിപ്പിക്കുന്നു; ഉൽപ്പാദനത്തിന്റെ അന്തിമകാരണം ദൈവാനുഗ്രഹമാണെന്ന വാക്യത്തിന്റെ ആശയം ഇതിലൂടെ മാറുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കല്പിക്കും’ ദൈവിക ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു; ‘ആ വർഷം’ വ്യാകരണബന്ധം വായനക്കാരന് വ്യക്തമായി നൽകുന്നു.
