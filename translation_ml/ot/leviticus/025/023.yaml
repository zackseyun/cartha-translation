reference: Leviticus 25:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ לֹ֤א תִמָּכֵר֙ לִ/צְמִתֻ֔ת כִּי לִ֖/י הָ/אָ֑רֶץ כִּֽי גֵרִ֧ים וְ/תוֹשָׁבִ֛ים אַתֶּ֖ם עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: ml
  text: ദേശം സ്ഥിരമായി വിൽക്കരുത്[a]; കാരണം ദേശം എന്റേതാണ്. നിങ്ങൾ എന്നോടുകൂടെ പരദേശികളും താത്കാലിക താമസക്കാരുമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നേക്കുമായി’ അല്ലെങ്കിൽ ‘സ്ഥിരമായി അന്യാധീനമാക്കുന്നവിധത്തിൽ.’
    reason: lexical_alternative
  - marker: b
    text: ‘പരദേശികളും താത്കാലിക താമസക്കാരും’ എന്ന പ്രയോഗം ദേശത്തിന്റെ ഉടമയായ ദൈവത്തോടുകൂടെ ആശ്രിതരായി വസിക്കുന്ന ഇസ്രായേലിന്റെ നിലയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: വിൽക്കരുത്
  rationale: നിഫാൽ അപൂർണക്രിയയ്ക്ക് ഈ നിയമസന്ദർഭത്തിൽ നിഷ്ക്രിയവും നിരോധനാത്മകവുമായ അർഥമുണ്ട്. മലയാളത്തിലെ സ്വാഭാവിക നിയമപ്രയോഗത്തിൽ ‘വിൽക്കരുത്’ നിരോധനം വ്യക്തമായി അറിയിക്കുന്നു; ഭൂമിയുടെ ഉടമയോടുള്ള കല്പന എന്നതിലുപരി വിൽപ്പന നടക്കരുതെന്ന ഫലമാണ് ഊന്നുന്നത്.
- source_word: לִצְמִתֻת
  choice: ശാശ്വതമായി അന്യാധീനപ്പെടുത്തുന്ന വിധത്തിൽ
  rationale: צְמִתֻת ഇവിടെ ഭൂമി വീണ്ടെടുക്കാനാവാത്തവിധം സ്ഥിരമായി കൈവിട്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ശാശ്വതമായി’ മാത്രം പറയുന്നതിനെക്കാൾ ഈ രൂപം ഭൂവുടമസ്ഥാവകാശത്തിന്റെ സ്ഥിരമായ അന്യാധീനപ്പെടുത്തൽ എന്ന നിയമപരമായ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: כִּי לִי הָאָרֶץ
  choice: കാരണം ദേശം എന്റേതാണ്
  rationale: כִּיയുടെ കാരണാർഥവും ദൈവത്തിന്റെ നേരിട്ടുള്ള ഉടമസ്ഥാവകാശവാദവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: גֵרִים
  choice: പരദേശികൾ
  rationale: സ്വന്തം പാരമ്പര്യദേശമല്ലാത്തിടത്ത് ആശ്രിതനിലയിൽ പാർക്കുന്നവരെ גֵר സൂചിപ്പിക്കുന്നു. ‘പരദേശികൾ’ ഈ അന്യദേശീയവും ആശ്രിതവുമായ നില സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וְתוֹשָׁבִים
  choice: താത്കാലിക താമസക്കാർ
  rationale: תוֹשָׁב സ്ഥിരമായ പാരമ്പര്യാവകാശമില്ലാതെ താമസിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു. അടുത്തുള്ള ‘പരദേശികൾ’ എന്ന പദത്തിൽനിന്ന് വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് ഭൂമിയിലെ അവരുടെ വാസാവകാശം പരമമല്ലെന്ന ആശയം ഈ വിവർത്തനം നൽകുന്നു.
- source_word: עִמָּדִי
  choice: എന്റെ അടുക്കൽ
  rationale: עִמָּדִיയുടെ അടിസ്ഥാന അർഥം ‘എന്നോടുകൂടെ’ എന്നാണ്. ഈ ഭൂവുടമസ്ഥാവകാശസന്ദർഭത്തിൽ ‘എന്റെ അടുക്കൽ’ എന്നത് ദൈവത്തിന്റെ അധീനതയിൽ ആശ്രിതരായി വസിക്കുന്ന ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘എന്റെ മുമ്പാകെ’ എന്ന വ്യത്യസ്ത ആശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: ദേശത്തോടുള്ള ഇസ്രായേലിന്റെ ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ദേശത്തിന്റെ പരമമായ ഉടമസ്ഥാവകാശം ദൈവത്തിന്റേതും ഇസ്രായേലിന്റെ കൈവശാവകാശം ആശ്രിതവും പരിമിതവുമാണെന്ന നിലയിൽ വാക്യം അവതരിപ്പിക്കുന്നു.
  alternative: ഇത് ദൈവിക ഉടമസ്ഥാവകാശത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ അവകാശവാദമില്ലാത്ത ഒരു സാമൂഹിക-സാമ്പത്തിക നിയമം മാത്രമാണെന്നോ, യോബേൽസന്ദർഭത്തിനപ്പുറം സമ്പൂർണമായ അവകാശനിഷേധം പ്രസ്താവിക്കുന്നുവെന്നോ വായിക്കാം.
  rationale: ‘ദേശം എന്റേതാണ്’ എന്ന വ്യക്തമായ കാരണം നിയമത്തെയും ദൈവിക ഉടമസ്ഥാവകാശത്തെയും ബന്ധിപ്പിക്കുന്നു. വിവർത്തനം ഈ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം നിലനിർത്തുന്നു; പിന്നീടുള്ള സിദ്ധാന്തസംവിധാനങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘ദേശം’ ലേവ്യപുസ്തകത്തിലെ വാഗ്ദത്തഭൂമി/ഭൂവിഭാഗം എന്ന വിശാല അർഥം നിലനിർത്തുന്നു. മുഖ്യപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
