language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֣ת סְפִ֤יחַ קְצִֽירְ/ךָ֙ לֹ֣א תִקְצ֔וֹר וְ/אֶת עִנְּבֵ֥י נְזִירֶ֖/ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: ml
  text: നിന്റെ കൊയ്ത്തിൽനിന്നു താനേ മുളച്ചുവളർന്ന വിളവ്[a] നീ കൊയ്യരുത്; വെട്ടിയൊരുക്കാതെ വിട്ട നിന്റെ മുന്തിരിവള്ളിയിലെ മുന്തിരിപ്പഴങ്ങൾ[b] നീ പറിച്ചുശേഖരിക്കരുത്. അത് ദേശത്തിന് സമ്പൂർണ വിശ്രമവർഷമായിരിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘താനേ വളർന്ന വിളവ്’ അല്ലെങ്കിൽ ‘സ്വയം മുളച്ച വിളവ്.’ മുൻകൊയ്ത്തിൽ വീണ വിത്തിൽനിന്ന് കൃഷിചെയ്യാതെ വളരുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തോടടുത്ത്, ‘വേറിട്ടുവിട്ട നിന്റെ മുന്തിരിവള്ളിയിലെ മുന്തിരിപ്പഴങ്ങൾ’; ശാബത്തുവർഷത്തിൽ വെട്ടിയൊരുക്കാതെയും പരിചരിക്കാതെയും വിട്ട മുന്തിരിവള്ളിയെയാണ് എബ്രായപദം ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ദേശത്തിന് ഒരു ശാബത്തുവർഷം’ അല്ലെങ്കിൽ ‘ദേശത്തിന് ഗൗരവപൂർണമായ വിശ്രമവർഷം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: നിന്റെ കൊയ്ത്തിൽനിന്നു താനേ മുളച്ചുവളർന്ന വിളവ്
  rationale: മുൻകൊയ്ത്തിൽ വീണ വിത്തിൽനിന്ന് കൃഷിചെയ്യാതെ സ്വയം വളരുന്ന വിളവിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് അർഥം വ്യക്തമാക്കിക്കൊണ്ട് കൃഷിചെയ്യാതെയുള്ള വളർച്ച എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: לֹא תִקְצוֹר
  choice: നീ കൊയ്യരുത്
  rationale: ധാന്യവും വയൽവിളവും അരിഞ്ഞെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന കൃഷിസംബന്ധമായ ക്രിയയുടെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: עִנְּבֵי נְזִירֶךָ
  choice: വെട്ടിയൊരുക്കാതെ വിട്ട നിന്റെ മുന്തിരിവള്ളിയിലെ മുന്തിരിക്കുലകൾ
  rationale: נָזִיר എന്ന പദം ഇവിടെ ശാബത്തുവർഷത്തിൽ പരിചരിക്കാതെ വേറിട്ടുവിട്ട മുന്തിരിവള്ളിയെ സൂചിപ്പിക്കുന്നു. ‘നാസീർ’ എന്ന വ്യക്തിവ്രതസംബന്ധമായ അർഥം വരാതെയും കാർഷികസന്ദർഭം വ്യക്തമാകുന്നതുമായ പരിഭാഷയാണ് ഇത്.
- source_word: לֹא תִבְצֹר
  choice: നീ ശേഖരിക്കരുത്
  rationale: മുന്തിരിപ്പഴം പറിച്ചുശേഖരിക്കുന്നതിനുള്ള പ്രത്യേക ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: സമ്പൂർണ വിശ്രമത്തിന്റെ ഒരു വർഷം
  rationale: שַׁבָּתוֹן എന്ന തീവ്രതയുള്ള ശബ്ബത്ത്-വിശ്രമ ആശയം വെറും വർഷനാമമാക്കി ചുരുക്കാതെ വ്യക്തവും ആധുനികവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: לָאָרֶץ
  choice: ദേശത്തിനു
  rationale: ലേവ്യർ 25-ലെ സന്ദർഭത്തിൽ കൃഷിഭൂമിയുൾപ്പെടുന്ന ഇസ്രായേൽദേശമാണ് ഉദ്ദേശ്യം; ‘ഭൂമിക്ക്’ എന്നതിനെക്കാൾ ‘ദേശത്തിനു’ ഈ സന്ദർഭപരമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശാബത്തുവർഷത്തിന്റെ പദപ്രയോഗം പിൽക്കാല മതസാങ്കേതിക അർഥങ്ങൾ ചേർക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: ദേശത്തിനു സമ്പൂർണ വിശ്രമത്തിന്റെ ഒരു വർഷം
  alternative: ദേശത്തിനു ഒരു ശാബത്തുവർഷം / ദേശത്തിനു ഗൗരവപൂർണമായ വിശ്രമവർഷം
  rationale: ദേശം അനുഭവിക്കേണ്ട ശക്തമായി ഊന്നിയ ശബ്ബത്ത്-വിശ്രമത്തെ ഈ രൂപം വ്യക്തമാക്കുന്നു. അതിനെ വെറും കലണ്ടർപേരാക്കി ചുരുക്കുകയോ മൂലപാഠത്തിലില്ലാത്ത ആചാരപരമായ വ്യാഖ്യാനം ചേർക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. കാർഷികപദങ്ങളുടെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുമ്പോഴും എബ്രായ മൂലത്തിലെ ശാബത്ത്-വിശ്രമ ആശയവും ദേശകേന്ദ്രിതമായ പ്രയോഗവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കരികിലോ വാക്യാവസാനത്തിലോ നൽകിയിരിക്കുന്നു.
