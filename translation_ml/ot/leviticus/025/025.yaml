source:
  edition: WLC
  text: כִּֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָכַ֖ר מֵ/אֲחֻזָּת֑/וֹ וּ/בָ֤א גֹֽאֲל/וֹ֙ הַ/קָּרֹ֣ב אֵלָ֔י/ו וְ/גָאַ֕ל אֵ֖ת מִמְכַּ֥ר אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: ml
  text: നിന്റെ സഹോദരൻ ദരിദ്രനായിത്തീർന്ന് തന്റെ കുടുംബാവകാശഭൂമിയുടെ ഒരു ഭാഗം വിൽക്കുകയാണെങ്കിൽ, അവന്റെ ഏറ്റവും അടുത്ത ബന്ധുവായ വീണ്ടെടുപ്പുകാരൻ[a] വന്ന് ആ സഹോദരൻ വിറ്റത് വീണ്ടെടുക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീണ്ടെടുപ്പുകാരൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം, കുടുംബത്തിന്റെ ഭൂമി തിരിച്ചെടുക്കാനുള്ള അവകാശവും കടമയും ഉള്ള അടുത്ത ബന്ധുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_and_cultural_note
  - marker: b
    text: ഇത് ‘വന്ന് ആ സഹോദരൻ വിറ്റത് വീണ്ടെടുക്കാം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ നിയമവാക്യം ഇവിടെ അവകാശം/അനുമതി, കടമ എന്നിവയിൽ ഏതിനാണ് ഊന്നൽ നൽകുന്നതെന്ന് പ്രത്യേകം അടയാളപ്പെടുത്തുന്നില്ല.
    reason: legal_modal_ambiguity
lexical_decisions:
- source_word: יָמוּךְ
  choice: ദരിദ്രനായിത്തീരുക
  rationale: സാമ്പത്തികമായി ക്ഷയിച്ച് ദാരിദ്ര്യത്തിലാകുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരൻ
  rationale: മൂലത്തിലെ കുടുംബബന്ധപദം അതേപടി നിലനിർത്തുന്നു; നിയമസന്ദർഭത്തിൽ ഇത് സഹഇസ്രായേല്യനെയും സൂചിപ്പിക്കാം.
- source_word: מֵאֲחֻזָּתוֹ
  choice: തന്റെ കുടുംബാവകാശഭൂമിയിൽ ഒരു ഭാഗം
  rationale: אֲחֻזָּה സാധാരണ സ്വത്തിനെക്കാൾ, കുടുംബത്തിനും ഗോത്രത്തിനും ലഭിച്ച പാരമ്പര്യ ഭൂവകാശത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; מִן എന്ന ഭാഗികതയും ‘ഒരു ഭാഗം’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: അവനോട് ഏറ്റവും അടുത്ത ബന്ധുവായ വീണ്ടെടുപ്പുകാരൻ
  rationale: ഗോഏൽ എന്ന പദത്തിലെ വീണ്ടെടുപ്പിന്റെ നിയമാർഥവും അടുത്ത ബന്ധുവെന്ന യോഗ്യതയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: וְגָאַל
  choice: വീണ്ടെടുക്കണം
  rationale: കുടുംബത്തിന്റെ അന്യാധീനപ്പെട്ട ഭൂമി തിരിച്ചെടുക്കുന്ന നിയമനടപടിയെ സൂചിപ്പിക്കുന്ന ഗאלിന്റെ പ്രധാന അർഥവും നിയമപരമായ ബാധ്യതയും നിലനിർത്തുന്നു.
- source_word: אֵת מִמְכַּר אָחִיו
  choice: സഹോദരൻ വിറ്റത്
  rationale: ‘വിൽക്കപ്പെട്ട വസ്തു/വിൽപ്പന’ എന്ന പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭം അത് ഭൂമിയാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേൽ നിയമത്തിലെ സഹോദരബന്ധ ഭാഷ
  choice: നിന്റെ സഹോദരൻ
  alternative: നിന്റെ ബന്ധു / നിന്റെ സഹഇസ്രായേല്യൻ
  rationale: സന്ദർഭത്തിൽ പദത്തിന് വിശാലമായ ഉടമ്പടിസമൂഹാർഥം ഉണ്ടാകാമെങ്കിലും, മൂലത്തിലെ ‘സഹോദരൻ’ എന്ന കുടുംബബന്ധ ഭാഷ മാറ്റാതെ സൂക്ഷിക്കുന്നു.
- issue: גאל എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വീണ്ടെടുപ്പുകാരൻ / വീണ്ടെടുക്കുക
  alternative: തിരിച്ചുവാങ്ങാൻ അവകാശമുള്ള അടുത്ത ബന്ധു / തിരിച്ചുവാങ്ങുക
  rationale: ഈ പദത്തിന്റെ കുടുംബനിയമപരവും വിശാലമായ വേദപുസ്തകപരവുമായ പ്രതിധ്വനി ‘വീണ്ടെടുപ്പ്’ നിലനിർത്തുന്നു; ബന്ധുത്വഘടകം മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കിയിട്ടുണ്ട്.
- issue: וּבָא וְגָאַל എന്ന നിയമവാക്യത്തിന്റെ ബലനില
  choice: വന്ന് ... വീണ്ടെടുക്കണം
  alternative: വന്ന് ... വീണ്ടെടുക്കാം
  rationale: നിയമപരമായ പ്രതീക്ഷയെയും അടുത്ത ബന്ധുവിന്റെ കടമയെയും മുഖ്യവാക്യം പ്രകടമാക്കുന്നു; എബ്രായ ക്രിയാരൂപം അനുമതിയോ അവകാശമോ മുൻനിർത്തി വായിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘കുടുംബാവകാശഭൂമി’ ഇസ്രായേലിന്റെ പാരമ്പര്യ ഭൂവ്യവസ്ഥ ordinary readers-ന് മനസ്സിലാകുന്നവിധം സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു; സാങ്കേതികമായ ‘ബന്ധു-വീണ്ടെടുപ്പുകാരൻ’ എന്ന സംയുക്തപദം ഒഴിവാക്കി സ്വാഭാവിക വാക്യഘടന സ്വീകരിച്ചു.
