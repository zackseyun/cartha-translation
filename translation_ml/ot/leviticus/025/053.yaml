id: LEV.25.53
reference: Leviticus 25:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ/שְׂכִ֥יר שָׁנָ֛ה בְּ/שָׁנָ֖ה יִהְיֶ֣ה עִמּ֑/וֹ לֹֽא יִרְדֶּ֥/נּֽוּ בְּ/פֶ֖רֶךְ לְ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: ml
  text: അവൻ വർഷംതോറും കൂലിവേലക്കാരനെപ്പോലെ അവനോടുകൂടെ ആയിരിക്കണം[a]. നിന്റെ കൺമുന്നിൽ അവൻ അവനെ കഠിനമായി ഭരിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘കൂലിവേലക്കാരനായി അവൻ വർഷംതോറും അവനോടുകൂടെ ആയിരിക്കണം.’'
    reason: כִּשְׂכִיר എന്നത് ‘കൂലിവേലക്കാരനെപ്പോലെ’ എന്ന ഉപമയായോ ‘കൂലിവേലക്കാരനായി’ എന്ന നിലസൂചനയായോ മലയാളത്തിൽ അവതരിപ്പിക്കാം.
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: കൂലിവേലക്കാരനെപ്പോലെ
  rationale: כ എന്ന ഉപസർഗം ഉപമയെ സൂചിപ്പിക്കുന്നു; שׂכיר അടിമയെയല്ല, കൂലിക്കു ജോലി ചെയ്യുന്ന ആളെയാണ് സൂചിപ്പിക്കുന്നത്. ആ വ്യത്യാസം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: שָׁנָה בְּשָׁנָה
  choice: വർഷംതോറും
  rationale: ഓരോ വർഷവും തുടരുന്ന നിലയെ സൂചിപ്പിക്കുന്ന വിതരണാർഥമുള്ള എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളം.
- source_word: יִהְיֶה עִמּוֹ
  choice: അവനോടുകൂടെ ആയിരിക്കണം
  rationale: היה എന്ന ക്രിയയുടെ ലളിതമായ ‘ആയിരിക്കുക’ എന്ന അർഥവും עִמּוֹ എന്നതിലെ ‘അവനോടുകൂടെ’ എന്ന ബന്ധവും സംരക്ഷിക്കുന്നു; ‘താമസിക്കണം’ അല്ലെങ്കിൽ ‘സേവിക്കണം’ എന്ന ആശയം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: לֹא יִרְדֶּנּוּ
  choice: അവൻ അവനെ ... ഭരിക്കരുത്
  rationale: רדה എന്നത് ഭരിക്കുക, ആധിപത്യം ചെലുത്തുക എന്ന അർഥം നൽകുന്നു. കർത്താവും കർമവും എബ്രായത്തിലെപ്പോലെ സർവനാമങ്ങളായി നിലനിർത്തുന്നു.
- source_word: בְּפֶרֶךְ
  choice: കഠിനമായി
  rationale: നിർദയമോ കടുത്തതോ ആയ അധീശത്വത്തെ സൂചിപ്പിക്കുന്നു; ‘ഭരിക്കരുത്’ എന്നതിനോടൊപ്പം സ്വാഭാവികമായി ചേരുകയും നിയമവാക്യത്തിന്റെ ധാർമ്മിക ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לְעֵינֶיךָ
  choice: നിന്റെ കൺമുന്നിൽ
  rationale: ‘നിന്റെ കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന ദൃശ്യസാക്ഷിത്വത്തിന്റെ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: വിദേശ ഉടമയുടെ കീഴിലുള്ള ഇസ്രായേല്യന്റെ നില
  choice: അടിമയെന്നല്ല, കൂലിവേലക്കാരനോടുള്ള ഉപമയായി പരിഭാഷപ്പെടുത്തി.
  alternative: കൂലിക്കാരനായ ദാസനെപ്പോലെ
  rationale: שׂכיר കൂലിക്കു ജോലി ചെയ്യുന്ന ആളെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭം സേവകത്വം ഉൾക്കൊള്ളുന്നുവെങ്കിലും, ഇവിടെ ഇല്ലാത്ത സ്ഥാവര-അടിമത്തത്തിന്റെ ശക്തമായ ആശയം ചേർക്കാതെ നിയമപരമായ സംരക്ഷണവും താൽക്കാലിക നിലയും നിലനിർത്തുന്നു.
- issue: יִהְיֶה עִמּוֹ എന്നതിലെ ബന്ധത്തിന്റെ സ്വഭാവം
  choice: അവനോടുകൂടെ ആയിരിക്കണം
  alternative: അവനോടുകൂടെ സേവിക്കണം
  rationale: മൂലപാഠത്തിലെ ക്രിയ ‘ആയിരിക്കുക’ എന്നത്രേ പറയുന്നു. സേവനബന്ധം സന്ദർഭത്തിൽ നിന്ന് മനസ്സിലാകുമെങ്കിലും അത് ക്രിയയിൽ നേരിട്ട് ചേർക്കാതെ അർഥതീവ്രത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ‘കൂലിവേലക്കാരൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും שׂכיר എന്ന പദത്തെ ‘അടിമ’യിൽ നിന്ന് വേർതിരിക്കുന്നതുമാണ്. സർവനാമങ്ങളുടെ ആവർത്തനം മൂലപാഠത്തിലെ കർത്താവ്–കർമം ഘടന സംരക്ഷിക്കുന്നു; സന്ദർഭം അവയുടെ സൂചന വ്യക്തമാക്കുന്നു.
