review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the six-year duration, sowing of the field, vineyard pruning, and gathering of produce. However, «മുന്തിരിത്തോട്ടം വെട്ടിയൊരുക്കണം» can suggest cutting back or clearing the vineyard itself, rather than pruning its vines (זמר). The revision makes the required viticultural action explicit without changing the sense.
  naturalness: «ആറു വർഷത്തേക്ക്» naturally and explicitly expresses the Hebrew duration. «മുന്തിരിത്തോട്ടത്തിലെ വള്ളികൾ വെട്ടിയൊതുക്കണം» is clear modern Malayalam agricultural usage. The parallel legal-instructional cadence is retained.
  terminology: «വയൽ» accurately renders שָׂדֶה, «മുന്തിരിത്തോട്ടം» renders כֶּרֶם, and «വിളവ്» suitably renders תְּבוּאָה. The footnote preserves the broader lexical possibility of agricultural produce.
  issues:
  - severity: medium
    issue: The phrase «മുന്തിരിത്തോട്ടം വെട്ടിയൊരുക്കണം» is insufficiently precise for vineyard pruning.
    rationale: In this context זמר means pruning vines. Malayalam wording that treats the vineyard itself as the object of cutting may be understood as clearing or cutting back the whole plot. Naming the vines communicates the agricultural action intended by the Hebrew.
  - severity: low
    issue: «ആറു വർഷം» is acceptable but does not state the duration relation as explicitly as Malayalam can.
    rationale: The Hebrew accusative expresses the period during which each action is performed. «ആറു വർഷത്തേക്ക്» makes this temporal force clear and remains natural.
  revised_text: ആറു വർഷത്തേക്ക് നീ നിന്റെ വയലിൽ വിതയ്ക്കണം; ആറു വർഷത്തേക്ക് നിന്റെ മുന്തിരിത്തോട്ടത്തിലെ വള്ളികൾ വെട്ടിയൊതുക്കണം; അതിലെ വിളവ്[a] ശേഖരിക്കുകയും വേണം.
