id: LEV.25.3
reference: Leviticus 25:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שֵׁ֤שׁ שָׁנִים֙ תִּזְרַ֣ע שָׂדֶ֔/ךָ וְ/שֵׁ֥שׁ שָׁנִ֖ים תִּזְמֹ֣ר כַּרְמֶ֑/ךָ וְ/אָסַפְתָּ֖ אֶת תְּבוּאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/003.yaml
  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: ml
  text: ആറു വർഷത്തേക്ക് നീ നിന്റെ വയലിൽ വിതയ്ക്കണം; ആറു വർഷത്തേക്ക് നിന്റെ മുന്തിരിത്തോട്ടത്തിലെ വള്ളികൾ വെട്ടിയൊതുക്കണം; അതിലെ വിളവ്[a] ശേഖരിക്കുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിലെ കാർഷികോത്പന്നം.’ എബ്രായപദം കൃഷിയിൽനിന്നുള്ള ഉത്പന്നത്തെ പൊതുവായും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: ആറു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആറു വർഷം’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: תִּזְרַע שָׂדֶךָ
  choice: നീ നിന്റെ വയലിൽ വിതയ്ക്കണം
  rationale: שָׂדֶה എന്നത് പൊതുവായ ‘ദേശം’ എന്നതിലുപരി കൃഷിയിടത്തെ സൂചിപ്പിക്കുന്നു; നിയമപരമായ നിർദേശം ‘വിതയ്ക്കണം’ എന്നു വ്യക്തമായി നൽകിയിരിക്കുന്നു.
- source_word: תִּזְמֹר כַּרְמֶךָ
  choice: നിന്റെ മുന്തിരിത്തോട്ടം വെട്ടിയൊരുക്കണം
  rationale: മുന്തിരിത്തോട്ടത്തിന്റെ പശ്ചാത്തലത്തിൽ זמר മുന്തിരിവള്ളികളുടെ അനാവശ്യ ശാഖകൾ വെട്ടി പരിപാലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായ കാർഷികപ്രയോഗമാണ് ‘വെട്ടിയൊരുക്കുക’.
- source_word: וְאָסַפְתָּ
  choice: ശേഖരിക്കുകയും വേണം
  rationale: אָסַף എന്ന ക്രിയയുടെ ‘കൂട്ടിച്ചേർക്കുക/ശേഖരിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും മുൻ നിർദേശങ്ങളോടുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: תְּבוּאָתָהּ
  choice: അതിന്റെ വിളവ്
  rationale: תְּבוּאָה കൃഷിയിൽനിന്നു ലഭിക്കുന്ന വിളവിനെയോ ഉത്പന്നത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വിളവ്’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ‘അതിന്റെ’ എന്നു നിലനിർത്തി, അതിന്റെ കൃത്യമായ പൂർവപദം അനാവശ്യമായി നിർണയിച്ചിട്ടില്ല.
theological_decisions:
- issue: ആറു വർഷത്തെ കൃഷിപ്പണിയുടെ നിയമപരമായ സ്വഭാവം
  choice: ‘വിതയ്ക്കണം’, ‘വെട്ടിയൊരുക്കണം’, ‘ശേഖരിക്കുകയും വേണം’ എന്ന നിർദേശരൂപം
  alternative: അനുമതി സൂചിപ്പിക്കുന്ന ‘വിതയ്ക്കാം’ തുടങ്ങിയ രൂപങ്ങൾ
  rationale: എബ്രായ അപൂർണക്രിയകൾ ഈ നിയമസന്ദർഭത്തിൽ നിർദേശാത്മകമാണ്; അവയെ വെറും അനുമതിയായി ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ആവർത്തിച്ചിരിക്കുന്ന ‘ആറു വർഷം’ എന്ന ഘടന മൂലപാഠത്തിന്റെ സമാന്തരത നിലനിർത്തുന്നു; അർദ്ധവിരാമങ്ങൾ പ്രവർത്തനങ്ങളെ വ്യക്തമായി വേർതിരിക്കുന്നു.
