id: LEV.25.29
reference: Leviticus 25:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: ml
  text: മതിലുകളുള്ള ഒരു പട്ടണത്തിൽ ഒരാൾ താമസത്തിനുള്ള ഒരു വീട് വിൽക്കുകയാണെങ്കിൽ, അതു വിറ്റതുമുതൽ ഒരു വർഷം തികയുന്നതുവരെ അയാൾക്ക് അത് വീണ്ടെടുക്കാം; ഒരു വർഷക്കാലം[a] അതു വീണ്ടെടുക്കാനുള്ള അവകാശം ഉണ്ടായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ദിവസങ്ങൾ’; ഈ നിയമപ്രയോഗത്തിൽ അത് ഒരു പൂർണവർഷത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי יִמְכֹּר
  choice: ഒരാൾ ... വിൽക്കുകയാണെങ്കിൽ
  rationale: നിയമപരമായ ഉപാധിവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; אִישׁ എന്ന ഏകവചനത്തെ ഉൾക്കൊള്ളുന്ന പൊതുപ്രയോഗമായി ‘ഒരാൾ’ നൽകുന്നു.
- source_word: בֵּית מוֹשַׁב
  choice: താമസത്തിനുള്ള ഒരു വീട്
  rationale: താമസോപയോഗത്തിനുള്ള വീടെന്ന ഘടനാഭേദം നിലനിർത്തുന്നു.
- source_word: עִיר חוֹמָה
  choice: മതിലുകളുള്ള ഒരു പട്ടണം
  rationale: മതിലാൽ ചുറ്റപ്പെട്ട നഗരത്തെ നേരിട്ടും വ്യക്തമായും സൂചിപ്പിക്കുന്നു; ‘കോട്ടനഗരം’ എന്ന് വ്യാഖ്യാനിച്ചു വികസിപ്പിക്കുന്നില്ല.
- source_word: וְהָיְתָה גְּאֻלָּתוֹ
  choice: അയാൾക്ക് അത് വീണ്ടെടുക്കാം
  rationale: ഇവിടെ גְּאֻלָּה വിൽക്കപ്പെട്ട സ്വത്ത് തിരികെ വാങ്ങാനുള്ള നിയമപരമായ അവസരത്തെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ കർത്താവിനെയും വസ്തുവിനെയും വ്യക്തമാക്കുന്നു.
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: അതു വിറ്റതുമുതൽ ഒരു വർഷം തികയുന്നതുവരെ
  rationale: വിൽപ്പന നടന്ന തീയതി മുതൽ കണക്കാക്കുന്ന പൂർണവർഷമാണെന്ന് വ്യക്തമാക്കുന്നു; കലണ്ടർ വർഷത്തിന്റെ അവസാനം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: יָמִים
  choice: ഒരു വർഷക്കാലം
  rationale: ഈ നിയമപ്രയോഗത്തിൽ ‘ദിവസങ്ങൾ’ എന്ന പദം ഒരു പൂർണവർഷത്തെ സൂചിപ്പിക്കുന്നു; അർത്ഥം മുഖ്യവാചകത്തിൽ വ്യക്തമായി നൽകുകയും പദശഃ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: תִּהְיֶה גְאֻלָּתוֹ
  choice: അതു വീണ്ടെടുക്കാനുള്ള അവകാശം ഉണ്ടായിരിക്കും
  rationale: നിശ്ചിത കാലയളവിൽ നിലനിൽക്കുന്ന വീണ്ടെടുപ്പവകാശമാണ് വാക്യം പ്രസ്താവിക്കുന്നത്; മലയാള നിയമഭാഷയിൽ വ്യക്തമായ രൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. നിയമപരമായ സ്വഭാവം നിലനിർത്തിക്കൊണ്ട് എബ്രായ വാക്യത്തിലെ ആവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
