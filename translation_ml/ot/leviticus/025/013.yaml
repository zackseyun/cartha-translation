review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal setting, the Jubilee institution, the legal force of the imperfect, and the distributive return to one's own holding. אולם, ‘അവകാശഭൂമി’ can imply a legally inherited entitlement more explicitly than אֲחֻזָּה itself states in this verse. In Leviticus 25 the referent is indeed landholding, so ‘ഭൂസ്വത്ത്’ retains the contextual land sense without over-specifying inheritance.
  naturalness: ‘നിങ്ങൾ ഓരോരുത്തനും’ is understandable, but ‘നിങ്ങളിൽ ഓരോരുത്തനും’ is more idiomatic modern standard Malayalam for a distributive expression following a plural address. ‘ഭൂസ്വത്ത്’ is concise and natural in this legal-land context.
  terminology: ‘യോബേൽ വർഷം’ is an appropriate established biblical designation. ‘ഭൂസ്വത്ത്’ accurately renders אֲחֻזָּה in context; the footnote preserves the broader lexical alternative ‘കൈവശസ്വത്ത്’. The footnote marker is placed directly after the term it qualifies.
  issues:
  - severity: low
    issue: ‘അവകാശഭൂമി’ is somewhat over-specific for אֲחֻזָּה.
    rationale: The Hebrew denotes a holding/possession; its hereditary character belongs to the wider legal context but is not explicitly expressed in this clause. ‘ഭൂസ്വത്ത്’ preserves the landholding sense with less interpretive loading.
  - severity: low
    issue: The distributive subject phrasing can be made more idiomatic.
    rationale: ‘നിങ്ങളിൽ ഓരോരുത്തനും’ is the standard formal Malayalam construction for ‘each of you’ and maintains the plural addressees plus individual distribution.
  revised_text: ഈ യോബേൽ വർഷത്തിൽ നിങ്ങളിൽ ഓരോരുത്തനും അവനവന്റെ ഭൂസ്വത്തിലേക്കു[a] മടങ്ങണം.
  revised_footnotes:
