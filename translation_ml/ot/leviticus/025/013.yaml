id: LEV.25.13
reference: Leviticus 25:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/שְׁנַ֥ת הַ/יּוֹבֵ֖ל הַ/זֹּ֑את תָּשֻׁ֕בוּ אִ֖ישׁ אֶל אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/013.yaml
  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: ml
  text: ഈ യോബേൽ വർഷത്തിൽ നിങ്ങളിൽ ഓരോരുത്തനും അവനവന്റെ ഭൂസ്വത്തിലേക്കു[a] മടങ്ങണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അവനവന്റെ കൈവശസ്വത്തിലേക്ക്.’'
    reason: אֲחֻזָּה എന്ന പദത്തിന് ‘കൈവശസ്വത്ത്’ എന്ന വിശാലമായ അർഥവുമുണ്ട്; ഇവിടെ ലേവ്യപുസ്തകം 25-ന്റെ സന്ദർഭം ഭൂമിയിലുള്ള കൈവശസ്വത്തിനെയാണ് സൂചിപ്പിക്കുന്നത്.
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: ഈ യോബേൽവർഷത്തിൽ
  rationale: בְּ കാലസൂചന നൽകുന്നു; יוֹבֵל ലേവ്യപുസ്തകം 25-ലെ പ്രത്യേക വിമോചന-പുനഃസ്ഥാപന വർഷത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഈ യോബേൽവർഷത്തിൽ’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: תָּשֻׁבוּ
  choice: മടങ്ങണം
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ക്രിയാരൂപം നിയമനിർദേശത്തിന്റെ നിർബന്ധസ്വരം വഹിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘മടങ്ങണം’ അതിനെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אִישׁ
  choice: നിങ്ങൾ ഓരോരുത്തനും
  rationale: ഇവിടെ אִישׁ വിതരണാർഥത്തിലാണ്—സമൂഹത്തിലെ ഓരോ വ്യക്തിയെയും പ്രത്യേകം ഉദ്ദേശിക്കുന്നു. ബഹുവചന അഭിസംബോധനയോടു ചേർന്ന ഈ രൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്; ഹീബ്രു വ്യാകരണത്തിലെ പുരുഷലിംഗരൂപം അനാവശ്യമായി എല്ലാവരെയും പുരുഷന്മാരായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: അവനവന്റെ അവകാശഭൂമിയിലേക്കു
  rationale: אֲחֻזָּה ഈ നിയമസന്ദർഭത്തിൽ കുടുംബത്തിന് അനുവദിക്കപ്പെട്ട ഭൂസ്വത്തെയോ പാരമ്പര്യ കൈവശഭൂമിയെയോ സൂചിപ്പിക്കുന്നു. ‘അവകാശഭൂമി’ ഈ സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘അവനവന്റെ’ ഏകവചന വിതരണബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: אִישׁ എന്ന പുരുഷലിംഗ വിതരണനാമത്തിന്റെ പരിധി
  choice: നിങ്ങൾ ഓരോരുത്തനും
  alternative: ഓരോ പുരുഷനും
  rationale: നിയമം അഭിസംബോധന ചെയ്യപ്പെടുന്ന സമൂഹത്തിലെ ഓരോ അംഗത്തിന്റെയും സ്വന്തം കൈവശഭൂമിയിലേക്കുള്ള മടക്കമാണ് വാക്യത്തിന്റെ ആശയം. വ്യാകരണലിംഗത്തെ ജൈവലിംഗപരിധിയായി കടുപ്പിക്കാതെ വിതരണാർഥം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- issue: אֲחֻזָּהയുടെ സ്വഭാവം
  choice: അവകാശഭൂമി
  alternative: കൈവശസ്വത്ത് / അവകാശസ്വത്ത്
  rationale: ലേവ്യപുസ്തകം 25-ന്റെ ഭൂമി-പുനഃസ്ഥാപന പശ്ചാത്തലത്തിൽ ഇത് പൊതുവായ ഏതു സ്വത്തിനേക്കാളും അനുവദിക്കപ്പെട്ട ഭൂവകയെ സൂചിപ്പിക്കുന്നു. അതുകൊണ്ട് പ്രധാന പാഠത്തിൽ ഭൂമിസംബന്ധം വ്യക്തമാക്കുന്നു; കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. ‘യോബേൽവർഷം’ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ സ്ഥാപനനാമമായി നിലനിർത്തി. ‘അവനവന്റെ’ എന്ന പ്രയോഗം വിതരണാർഥവും ഏകവചന ഉടമസ്ഥബന്ധവും സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
