revisions:
- from: ഈ യോബേൽവർഷത്തിൽ നിങ്ങൾ ഓരോരുത്തനും അവനവന്റെ അവകാശഭൂമിയിലേക്കു മടങ്ങണം.[a]
  to: ഈ യോബേൽ വർഷത്തിൽ നിങ്ങളിൽ ഓരോരുത്തനും അവനവന്റെ ഭൂസ്വത്തിലേക്കു[a] മടങ്ങണം.
  rationale: The revision improves standard Malayalam idiom, avoids making hereditary entitlement explicit in the main text beyond what the Hebrew clause says, and relocates the lexical footnote anchor to the translated term אֲחֻזָּה.
