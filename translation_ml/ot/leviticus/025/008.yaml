source:
  edition: WLC
  text: וְ/סָפַרְתָּ֣ לְ/ךָ֗ שֶׁ֚בַע שַׁבְּתֹ֣ת שָׁנִ֔ים שֶׁ֥בַע שָׁנִ֖ים שֶׁ֣בַע פְּעָמִ֑ים וְ/הָי֣וּ לְ/ךָ֗ יְמֵי֙ שֶׁ֚בַע שַׁבְּתֹ֣ת הַ/שָּׁנִ֔ים תֵּ֥שַׁע וְ/אַרְבָּעִ֖ים שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: ml
  text: “നിനക്കായി വർഷങ്ങളുടെ ഏഴ് ശബ്ബത്തുകൾ[a] എണ്ണണം—ഏഴു വർഷം വീതം ഏഴു പ്രാവശ്യം. അങ്ങനെ വർഷങ്ങളുടെ ആ ഏഴ് ശബ്ബത്തുകളുടെ കാലയളവ് നിനക്കു നാല്പത്തൊൻപതു വർഷമായിരിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വർഷങ്ങളുടെ ഏഴ് ആഴ്ചകൾ.” എബ്രായത്തിൽ അക്ഷരാർഥം “വർഷങ്ങളുടെ ഏഴ് ശബ്ബത്തുകൾ” എന്നാണ്; ഇത് ഏഴു വർഷം വീതമുള്ള ഏഴ് ചക്രങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ לְךָ
  choice: നിനക്കായി ... എണ്ണണം
  rationale: ספר എന്ന ക്രിയയുടെ എണ്ണുക/കണക്കാക്കുക എന്ന അർഥവും לְךָ എന്ന ദാതൃസർവനാമവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: ഏഴു വർഷശബ്ബത്തുകൾ
  rationale: വർഷങ്ങളുമായി ബന്ധപ്പെട്ട ശബ്ബത്ത്-ചക്രങ്ങൾ എന്ന എബ്രായ രൂപകം നിലനിർത്തുകയും ശബ്ബത്തുവർഷനിയമവുമായുള്ള ബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: ഏഴു വർഷം വീതം ഏഴു പ്രാവശ്യം
  rationale: ഏഴുവർഷ ഘടകത്തിന്റെ ഏഴുമടങ്ങായ ആവർത്തനം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְמֵי שֶׁבַע שַׁבְּתֹת הַשָּׁנִים
  choice: ഏഴു വർഷശബ്ബത്തുകളുടെ കാലം
  rationale: יְמֵי എന്നതിന്റെ അക്ഷരാർഥം ‘ദിവസങ്ങൾ’ ആണെങ്കിലും ഇവിടെ മുഴുവൻ കാലയളവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കാലം’ മലയാളത്തിൽ സ്വാഭാവികവും അർഥസൂക്ഷ്മതയുള്ളതുമാണ്.
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: നാല്പത്തൊൻപതു വർഷം
  rationale: എബ്രായ സംഖ്യാക്രമത്തെ സ്വാഭാവിക മലയാള സംഖ്യാരൂപത്തിൽ നൽകുന്നു.
