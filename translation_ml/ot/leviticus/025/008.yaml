  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമനിർദേശ ശൈലി. ‘വർഷശബ്ബത്ത്’ അപരിചിതമായേക്കാമെങ്കിലും ഉറവിടരൂപകം സംരക്ഷിക്കാൻ ഉപയോഗിച്ച് അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
