  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אוֹ דֹד֞/וֹ א֤וֹ בֶן דֹּד/וֹ֙ יִגְאָלֶ֔/נּוּ אֽוֹ מִ/שְּׁאֵ֧ר בְּשָׂר֛/וֹ מִ/מִּשְׁפַּחְתּ֖/וֹ יִגְאָלֶ֑/נּוּ אֽוֹ הִשִּׂ֥יגָה יָד֖/וֹ וְ/נִגְאָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: ml
  text: അവന്റെ പിതൃസഹോദരനോ പിതൃസഹോദരന്റെ മകനോ അവനെ വീണ്ടെടുക്കാം; അല്ലെങ്കിൽ അവന്റെ കുലത്തിലെ അടുത്ത രക്തബന്ധുക്കളിൽ ഒരാൾ അവനെ വീണ്ടെടുക്കാം; അല്ലെങ്കിൽ അവന്റെ കൈയ്ക്ക് പ്രാപ്തിയുണ്ടായാൽ[a] അവൻ സ്വയം വീണ്ടെടുക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന് മതിയായ സാമ്പത്തികശേഷി ഉണ്ടായാൽ.’ അക്ഷരാർഥത്തിൽ, ‘അവന്റെ കൈ എത്തിച്ചേർന്നാൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹדוֹ
  choice: അവന്റെ പിതൃസഹോദരൻ
  rationale: ഈ ബന്ധുത്വനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ דּוֹד പിതാവിന്റെ സഹോദരനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘അമ്മാവൻ’ സാധാരണയായി മാതൃസഹോദരനെ സൂചിപ്പിക്കുന്നതിനാൽ കൃത്യതയ്ക്കായി ‘പിതൃസഹോദരൻ’ സ്വീകരിച്ചു.
- source_word: בֶן דֹּדוֹ
  choice: പിതൃസഹോദരന്റെ മകൻ
  rationale: എബ്രായത്തിലെ ‘അവന്റെ പിതൃസഹോദരന്റെ മകൻ’ എന്ന ബന്ധുത്വപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; പൊതുവായ ‘ബന്ധുവായ സഹോദരൻ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: יִגְאָלֶנּוּ
  choice: അവനെ വീണ്ടെടുക്കാം
  rationale: גאל എന്ന ബന്ധുത്വാധിഷ്ഠിത നിയമപദത്തിന്റെ ആശയതുടർച്ച കാത്തുസൂക്ഷിക്കുന്നു. ഇവിടെ സാധ്യത/അനുമതി സൂചിപ്പിക്കുന്ന നിയമപരമായ ഭാവത്തിന് ‘വീണ്ടെടുക്കാം’ യോജിക്കുന്നു.
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: അടുത്ത രക്തബന്ധുക്കളിൽ ഒരാൾ
  rationale: ‘അവന്റെ മാംസത്തിലെ അടുത്തവൻ’ എന്ന എബ്രായ പ്രയോഗം അടുത്ത രക്തബന്ധത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രൂപം സ്വീകരിച്ചു.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: അവന്റെ കുലത്തിലെ
  rationale: מִשְׁפָּחָה ഇവിടെ ഒരു ചെറിയ കുടുംബത്തെക്കാൾ വിശാലമായ ബന്ധുസമൂഹത്തെയോ കുലത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: הִשִּׂיגָה יָדוֹ
  choice: അവന്റെ കൈ പ്രാപ്തമായാൽ
  rationale: സാമ്പത്തികശേഷി കൈവരിക്കുക എന്ന അർഥമുള്ള എബ്രായ കൈ-പ്രയോഗം വായിക്കാവുന്ന മലയാളത്തിൽ നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְנִגְאָל
  choice: അവൻ സ്വയം വീണ്ടെടുക്കാം
  rationale: രൂപം നിഷ്ക്രിയമായിരിക്കാമെങ്കിലും സന്ദർഭത്തിൽ സ്വന്തമായി മോചനവില നൽകാനുള്ള ശേഷിയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ‘സ്വയം വീണ്ടെടുക്കാം’ സ്വാഭാവികമായി അത് അറിയിക്കുന്നു.
theological_decisions:
- issue: ബന്ധുത്വ-വീണ്ടെടുപ്പിനുള്ള גאל പദസമൂഹത്തിന്റെ പരിഭാഷ
  choice: ‘വീണ്ടെടുക്കുക’ എന്ന പദം ഉപയോഗിച്ചു.
  alternative: ‘വിലകൊടുത്തു തിരിച്ചെടുക്കുക’
  rationale: വാണിജ്യപ്രവർത്തനം മാത്രമല്ല, ബന്ധുവിന്റെ നിയമപരമായ വീണ്ടെടുപ്പുചുമതലയും ഈ പദത്തിൽ ഉൾപ്പെടുന്നു; അതിനാൽ അധ്യായത്തിലെ ആശയതുടർച്ച നിലനിർത്തി.
- issue: הִשִּׂיגָה יָדוֹ എന്ന കൈ-പ്രയോഗം
  choice: ‘അവന്റെ കൈ പ്രാപ്തമായാൽ’ എന്ന് രൂപകം നിലനിർത്തി.
  alternative: ‘അവന് മതിയായ സാമ്പത്തികശേഷി ഉണ്ടായാൽ’
  rationale: എബ്രായത്തിലെ ദൃശ്യരൂപം സംരക്ഷിച്ചുകൊണ്ട് അതിന്റെ സാമ്പത്തിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി; അങ്ങനെ മൂലത്തിലെ രൂപകവും വായനാസൗകര്യവും ഒരുമിച്ചു നിലനിർത്തുന്നു.
- issue: וְנִגְאָל എന്ന രൂപത്തിന്റെ കർത്തൃത്വം
  choice: ‘അവൻ സ്വയം വീണ്ടെടുക്കാം’
  alternative: ‘അവൻ വീണ്ടെടുക്കപ്പെടാം’
  rationale: മുൻവാക്യത്തിലെ വ്യക്തിയുടെ കൈ പ്രാപ്തമാകുന്നതുമായി ബന്ധിപ്പിക്കുമ്പോൾ സ്വന്തം മോചനവില നൽകുന്നതാണ് സന്ദർഭാർഥം; എങ്കിലും എബ്രായരൂപത്തിലെ നിഷ്ക്രിയത്വസാധ്യത പരിഭാഷയിൽ അനാവശ്യമായി സിദ്ധാന്തവൽക്കരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. നിയമപരവും ബന്ധുത്വപരവുമായ കൃത്യതയ്ക്കായി ‘പിതൃസഹോദരൻ’, ‘കുലം’, ‘വീണ്ടെടുക്കുക’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. എബ്രായത്തിലെ കൈ-രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, സ്വാഭാവിക അർഥം അടിക്കുറിപ്പിൽ നൽകി.
