  to: അവന്റെ പിതൃസഹോദരനോ പിതൃസഹോദരന്റെ മകനോ അവനെ വീണ്ടെടുക്കാം; അല്ലെങ്കിൽ അവന്റെ കുലത്തിലെ അടുത്ത രക്തബന്ധുക്കളിൽ ഒരാൾ അവനെ വീണ്ടെടുക്കാം; അല്ലെങ്കിൽ അവന്റെ കൈയ്ക്ക് പ്രാപ്തിയുണ്ടായാൽ[a] അവൻ സ്വയം വീണ്ടെടുക്കാം.
