  text: וְ/עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ אֲשֶׁ֣ר יִהְיוּ לָ֑/ךְ מֵ/אֵ֣ת הַ/גּוֹיִ֗ם אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם מֵ/הֶ֥ם תִּקְנ֖וּ עֶ֥בֶד וְ/אָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male servant and your female servant who may belong to you[a], from the nations that are around you[b], from them you may buy a male servant and a female servant.
translation:
  language: ml
  text: നിനക്കുള്ള പുരുഷ അടിമയും സ്ത്രീ അടിമയും[a] നിങ്ങളെ ചുറ്റിപ്പാർക്കുന്ന ജനതകളിൽനിന്നുള്ളവരായിരിക്കും[b]; അവരിൽനിന്ന് നിങ്ങൾക്ക് പുരുഷ അടിമയെയും സ്ത്രീ അടിമയെയും വാങ്ങാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുരുഷ ദാസനും സ്ത്രീ ദാസിയും’ എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഇവിടെ വാങ്ങലും ഉടമസ്ഥതയും വ്യക്തമായതിനാൽ മുഖ്യപാഠത്തിൽ ‘അടിമ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ജനതകൾ’ എന്നത് ഇസ്രായേലിനെ ചുറ്റിപ്പാർത്തിരുന്ന ഇസ്രായേലേതര ജനസമൂഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. എബ്രായത്തിൽ അഭിസംബോധന ആദ്യം ഏകവചനത്തിലും പിന്നീട് ബഹുവചനത്തിലുമാണ്.
    reason: source_clarification
lexical_decisions:
- source_word: עַבְדְּךָ / עֶבֶד
  choice: പുരുഷ അടിമ
  rationale: വാങ്ങലും ഉടമസ്ഥതയും വ്യക്തമാകുന്ന ഈ നിയമസന്ദർഭത്തിൽ ‘ദാസൻ’ എന്നതിനെക്കാൾ ബന്ധിതസ്ഥിതി തുറന്നുകാട്ടുന്ന ‘അടിമ’ യോജിക്കുന്നു; אָמָה എന്ന സ്ത്രീലിംഗപദത്തോടുള്ള വ്യത്യാസം നിലനിർത്താൻ ‘പുരുഷ’ ചേർത്തു.
- source_word: אֲמָתְךָ / אָמָה
  choice: സ്ത്രീ അടിമ
  rationale: എബ്രായത്തിലെ സ്ത്രീലിംഗവിഭാഗം വ്യക്തമായി നിലനിർത്തുകയും പഴഞ്ചൻ പ്രയോഗം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: നിനക്കുള്ള ... ആയിരിക്കണം
  rationale: വാക്യം അഭിസംബോധിതന്റെ കൈവശം വരുന്ന അടിമകളുടെ ഉറവിടം നിയന്ത്രിക്കുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു. ഭാവ/നിയമപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵאֵת הַגּוֹיִם
  choice: ജനതകളിൽനിന്ന്
  rationale: גּוֹיִם ഇവിടെ ഇസ്രായേലിനു ചുറ്റുമുള്ള ഇസ്രായേലേതര ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘വിജാതീയർ’ എന്ന ദൈവശാസ്ത്രഭാരം ഒഴിവാക്കുന്നു.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: നിങ്ങളെ ചുറ്റിപ്പാർക്കുന്ന
  rationale: അയൽജനതകളെ തിരിച്ചറിയിക്കുന്ന സ്ഥലപരമായ ബന്ധം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: מֵהֶם
  choice: അവരിൽനിന്ന്
  rationale: മുമ്പു പറഞ്ഞ ചുറ്റുമുള്ള ജനതകളെയാണ് വാങ്ങലിന്റെ ഉറവിടമായി ചൂണ്ടിക്കാണിക്കുന്നത്.
- source_word: תִּקְנוּ
  choice: നിങ്ങൾക്ക് ... വാങ്ങാം
  rationale: קנה എന്നതിന്റെ വാങ്ങുക/സ്വായത്തമാക്കുക എന്ന അർഥവും ഇവിടെ കല്പനയ്ക്കു പകരം നിയമപരമായ അനുമതിയാണെന്ന സൂക്ഷ്മതയും നിലനിർത്തുന്നു.
- source_word: עֶבֶד וְאָמָה
  choice: പുരുഷ അടിമയെയും സ്ത്രീ അടിമയെയും
  rationale: രണ്ടു ഏകവചനപദങ്ങളുടെയും പൊതുവായ, വിഭാഗസൂചക പ്രയോഗവും ലിംഗവ്യത്യാസവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അടിമത്തവുമായി ബന്ധപ്പെട്ട പദങ്ങൾ നിയമപാഠത്തിൽ പരിഭാഷപ്പെടുത്തൽ
  choice: ‘അടിമ’ ഉപയോഗിച്ചു
  alternative: ‘ദാസൻ/ദാസി’ അല്ലെങ്കിൽ ‘വേലക്കാരൻ/വേലക്കാരി’
  rationale: ആളുകളെ വാങ്ങുന്നതും കൈവശം വയ്ക്കുന്നതുമാണ് പാഠത്തിന്റെ നേരിട്ടുള്ള വിഷയം; അതിനാൽ ബന്ധിതവും ഉടമസ്ഥതാധിഷ്ഠിതവുമായ സ്ഥിതി മൃദൂകരിക്കാതെ പറയേണ്ടതാണ്.
- issue: תִּקְנוּ എന്ന അപൂർണക്രിയയുടെ നിയമപരമായ ബലം
  choice: അനുമതിസൂചകമായി ‘വാങ്ങാം’
  alternative: കല്പനാസൂചകമായി ‘വാങ്ങണം’
  rationale: ഈ നിയമം വാങ്ങാൻ നിർബന്ധിക്കുന്നതല്ല; ആരിൽനിന്ന് വാങ്ങാൻ അനുവാദമുണ്ടെന്ന് നിർണ്ണയിക്കുന്നതാണ്.
- issue: אֲשֶׁר יִהְיוּ לָךְ എന്ന ഉപവാക്യത്തിന്റെ ബന്ധം
  choice: അടിമകളുടെ അനുവദനീയമായ ഉറവിടം നിർണ്ണയിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘നിനക്കു സ്വന്തമായേക്കാവുന്ന’ എന്ന സാധ്യതാസൂചക വായന
  rationale: എബ്രായഘടനയിൽ ആദ്യ ഉപവാക്യം മുൻനിർത്തി പിന്നീട് വാങ്ങാനുള്ള അനുമതി വരുന്നു; മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കുമ്പോഴും ഉടമസ്ഥതയുടെ അസ്വസ്ഥമായ നിയമാർഥം മറച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും നേരിട്ടുമുള്ള മലയാളം. അടിമത്തത്തിന്റെ യാഥാർഥ്യം മൃദൂകരിക്കുന്ന പഴഞ്ചൻ ‘ദാസൻ/ദാസി’ പ്രയോഗം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി. മൂലത്തിലെ ഏകവചന-ബഹുവചന അഭിസംബോധനമാറ്റം (‘നിനക്ക്’/‘നിങ്ങളെ’/‘നിങ്ങൾക്ക്’) സംരക്ഷിച്ചു.
