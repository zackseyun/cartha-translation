source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֙ אֶת חֻקֹּתַ֔/י וְ/אֶת מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶ֣ם אֹתָ֑/ם וִֽ/ישַׁבְתֶּ֥ם עַל הָ/אָ֖רֶץ לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: ml
  text: നിങ്ങൾ എന്റെ ചട്ടങ്ങൾ അനുഷ്ഠിക്കുകയും എന്റെ ന്യായവിധികൾ കാത്തുപാലിച്ച് അവ അനുഷ്ഠിക്കുകയും വേണം.[a][b] നിങ്ങൾ ദേശത്ത് സുരക്ഷിതമായി വസിക്കും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ നിയമവിധികൾ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ חֻקִּים (ചട്ടങ്ങൾ), מִשְׁפָּטִים (ന്യായവിധികൾ/നിയമവിധികൾ) എന്നീ വ്യത്യസ്ത നിയമപദങ്ങളാണുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ ‘ചെയ്യുക’ എന്ന ക്രിയ ആവർത്തിക്കുന്നു: അക്ഷരാർഥത്തിൽ, “നിങ്ങൾ എന്റെ ചട്ടങ്ങൾ ചെയ്യുകയും, എന്റെ ന്യായവിധികൾ കാത്തുപാലിച്ച് അവ ചെയ്യുകയും വേണം.”'
    reason: lexical_alternative
  - marker: c
    text: അതായത്, വാഗ്ദത്തദേശത്ത് സുരക്ഷിതമായി വസിക്കുക.
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ നിർദേശങ്ങൾ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; מִשְׁפָּטַי എന്ന വേറിട്ട നിയമപദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: מִשְׁפָּטַי
  choice: എന്റെ ന്യായവിധികൾ
  rationale: നിയമവിധികൾ, ന്യായനിർണയങ്ങൾ, ചട്ടങ്ങൾ എന്നീ അർഥപരിധിയുള്ള പദത്തിന്റെ ഔപചാരിക നിയമഭാവം സൂക്ഷിക്കുന്നു; חֻקֹּתַי എന്നതുമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: תִּשְׁמְרוּ
  choice: പ്രമാണിച്ച്
  rationale: ഉടമ്പടി-നിയമ പശ്ചാത്തലത്തിൽ ‘കാത്തുപാലിക്കുക/അനുസരിക്കുക’ എന്ന ശക്തി നൽകുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: അനുസരിച്ചു പ്രവർത്തിക്കുകയും ... അവ നടപ്പാക്കുകയും
  rationale: עשה എന്ന ക്രിയയുടെ ആവർത്തനം പൂർണമായി ഒഴിവാക്കാതെ, മലയാളത്തിലെ അസ്വാഭാവിക പദാവർത്തനം കുറച്ച് പ്രായോഗിക അനുസരണത്തിനുള്ള ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וִישַׁבְתֶּם
  choice: നിങ്ങൾ ... വസിക്കും
  rationale: ദേശത്ത് സ്ഥിരതാമസമാക്കുക എന്ന വാഗ്ദത്തദേശ പശ്ചാത്തലത്തിലെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഈ സന്ദർഭത്തിലെ ഇസ്രായേലിന്റെ വാഗ്ദത്തദേശത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും സ്വാഭാവികവുമായ മലയാള പദം.
- source_word: לָבֶטַח
  choice: സുരക്ഷിതരായി
  rationale: ഭയമില്ലാത്ത, ഉറപ്പുള്ള വാസം എന്ന ആശയം ‘വസിക്കും’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: അനുസരണവും ദേശത്തിലെ സുരക്ഷിതവാസവും തമ്മിലുള്ള ബന്ധം
  choice: ഇസ്രായേലിന്റെ ഉടമ്പടി-ദേശ പശ്ചാത്തലത്തിൽ, ദൈവത്തിന്റെ ചട്ടങ്ങളും ന്യായവിധികളും അനുസരിക്കുന്നതിനെ ദേശത്തിലെ സുരക്ഷിതവാസവുമായി വാക്യം ബന്ധിപ്പിക്കുന്നു.
  alternative: എല്ലാ കാലത്തുമുള്ള എല്ലാ വിശ്വാസികൾക്കും വ്യക്തിപരമായ സുരക്ഷയോ സമൃദ്ധിയോ ഉറപ്പുനൽകുന്ന പൊതുവാഗ്ദത്തമായി വായിക്കുക.
  rationale: എബ്രായപാഠം അനുസരണത്തെയും ‘ദേശത്ത്’ സുരക്ഷിതമായി വസിക്കുന്നതിനെയും നേരിട്ട് ബന്ധിപ്പിക്കുന്നു. വിവർത്തനം ഈ പ്രത്യേക ഉടമ്പടി പശ്ചാത്തലം നിലനിർത്തുകയും വാക്യത്തെ അതിന്റെ പരിധിക്കപ്പുറം സാർവത്രികമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമ-ഉടമ്പടി ശൈലി. ആദ്യത്തെ וַעֲשִׂיתֶם ഫലസൂചകമായ ‘അതുകൊണ്ട്’ കൊണ്ടും അവസാനത്തെ וִישַׁבְתֶּם ‘അപ്പോൾ’ കൊണ്ടും ബന്ധിപ്പിച്ച് സന്ദർഭത്തിലെ നിർദേശ-ഫലക്രമം സ്വാഭാവികമാക്കി. മുഖ്യപാഠത്തിലെ [a], [b], [c] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
