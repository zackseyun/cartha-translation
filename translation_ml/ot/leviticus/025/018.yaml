  to: നിങ്ങൾ എന്റെ ചട്ടങ്ങൾ അനുഷ്ഠിക്കുകയും എന്റെ ന്യായവിധികൾ കാത്തുപാലിച്ച് അവ അനുഷ്ഠിക്കുകയും വേണം.[a][b] നിങ്ങൾ ദേശത്ത് സുരക്ഷിതമായി വസിക്കും.[c]
  rationale: ഉറവിടത്തിലെ സാധാരണ ബന്ധകങ്ങളെ നിഗമനസൂചകങ്ങളാക്കാതെ നിലനിർത്തി. עשה എന്ന ക്രിയയുടെ രണ്ടുതവണയുള്ള പ്രയോഗം ‘അനുഷ്ഠിക്കുക’ എന്ന സ്വാഭാവിക നിയമ-ഉടമ്പടി പദത്തിലൂടെ സംരക്ഷിച്ചു; תִּשְׁמְרוּവിന് ‘കാത്തുപാലിക്കുക’ ഉപയോഗിച്ച് രണ്ടു നിയമപദങ്ങളുടെയും ക്രിയകളുടെയും വ്യത്യാസം വ്യക്തമാക്കി. അടിക്കുറിപ്പ് b എബ്രായവാക്യക്രമത്തോടു ചേർത്ത് തിരുത്തി.
