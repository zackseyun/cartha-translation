  naturalness: ‘ചട്ടങ്ങൾ അനുസരിച്ചു പ്രവർത്തിക്കുക’ എന്നും ‘ന്യായവിധികൾ പ്രമാണിച്ച് അവ നടപ്പാക്കുക’ എന്നും ചേർന്ന പ്രയോഗം അല്പം ഭാരമുള്ളതും, ‘അവ’ ഏതിനെ സൂചിപ്പിക്കുന്നു എന്നതിൽ മങ്ങലുണ്ടാക്കുന്നതുമാണ്. ‘അനുഷ്ഠിക്കുക’യും ‘കാത്തുപാലിക്കുക’യും നിയമ-ഉടമ്പടി രജിസ്റ്ററിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
