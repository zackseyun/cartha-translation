  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: ml
  text: അവൻ തന്നെ വാങ്ങിയവനോടു, അവൻ അവന് വിറ്റുപോയ വർഷം മുതൽ[a] യോബേൽ വർഷംവരെയുള്ള കാലം കണക്കാക്കണം. അവന്റെ വിൽപ്പനവില വർഷങ്ങളുടെ എണ്ണത്തിനനുസരിച്ചായിരിക്കണം; കൂലിക്കാരന്റെ സേവനകാലംപോലെ അവൻ അവനോടൊപ്പം ആയിരിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ വിൽപ്പനയുടെ വർഷം മുതൽ.” ഹീബ്രു പ്രയോഗം കൂടുതൽ ഔപചാരികമായി ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; വിൽപ്പന നടത്തിയ വ്യക്തിയെ വ്യാകരണരൂപം മാത്രം നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “കൂലിക്കാരന്റെ ദിവസങ്ങൾപോലെ.” വർഷങ്ങളുടെ മൂല്യം സ്ഥിരമായ ഉടമസ്ഥതയായി അല്ല, കൂലിസേവനകാലമായി കണക്കാക്കണമെന്ന താരതമ്യമാണ് ഇവിടെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: കണക്കാക്കണം
  rationale: വീണ്ടെടുപ്പുവില നിർണയിക്കുന്ന നിയമ-സാമ്പത്തിക സന്ദർഭത്തിലെ കണക്കുകൂട്ടൽ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: קֹנֵהוּ
  choice: തന്നെ വാങ്ങിയവൻ
  rationale: കנה എന്ന ധാതുവിന്റെ കർത്തൃവാചക രൂപം ആ വ്യക്തിയെ വിലകൊടുത്തു സ്വന്തമാക്കിയ ആളെ സൂചിപ്പിക്കുന്നു; ‘വാങ്ങിയവൻ’ ഇടപാടിന്റെ സ്വഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: അവന് വിറ്റുപോയ വർഷംമുതൽ
  rationale: ഹീബ്രു രൂപം ‘അവന് വിൽക്കപ്പെട്ട വർഷംമുതൽ’ എന്നും കൂടുതൽ ഔപചാരികമായി നൽകാം. ‘വിറ്റുപോയ’ എന്നത് കർത്തൃനിർണ്ണയം അമിതമായി വ്യക്തമാക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: യോബേൽവർഷംവരെ
  rationale: ഇസ്രായേലിലെ നിയമസ്ഥാപനമായ യോബേൽവർഷത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וְהָיָה כֶּסֶף מִמְכָּרוֹ
  choice: അവന്റെ വിൽപ്പനവില ... ആയിരിക്കണം
  rationale: כֶּסֶף അക്ഷരാർഥത്തിൽ പണം/വെള്ളി എന്നാണെങ്കിലും ഇവിടെ വിൽപ്പനയുടെ ധനമൂല്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּמִסְפַּר שָׁנִים
  choice: വർഷങ്ങളുടെ എണ്ണത്തിനനുസരിച്ച്
  rationale: വർഷങ്ങളുടെ എണ്ണത്തെ അടിസ്ഥാനമാക്കിയുള്ള അനുപാതിക കണക്കുകൂട്ടലാണ് ഈ പ്രയോഗം അറിയിക്കുന്നത്.
- source_word: כִּימֵי שָׂכִיר
  choice: കൂലിവേലക്കാരന്റെ തൊഴിൽക്കാലംപോലെ
  rationale: שָׂכִיר കൂലി ലഭിക്കുന്ന തൊഴിലാളിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദിവസങ്ങൾ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കാലപരമായ ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘തൊഴിൽക്കാലം’ ഉപയോഗിച്ചു.
- source_word: יִהְיֶה עִמּוֹ
  choice: അവൻ അവനോടുകൂടെ ആയിരിക്കണം
  rationale: മൂലത്തിലെ നില/ബന്ധം സൂചിപ്പിക്കുന്ന ലളിതവാക്യം ഔപചാരികമായി നിലനിർത്തുന്നു; മുൻപുള്ള ഉപമ ഇത് കൂലിവേലക്കാരന്റെ സേവനസ്ഥിതിയാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വിറ്റുപോയ വ്യക്തിയുടെ നില സ്ഥിരമായ ഉടമസ്ഥതയാണോ കൂലിസേവനമാണോ എന്ന നിയമപരമായ താരതമ്യം
  choice: ‘കൂലിവേലക്കാരന്റെ തൊഴിൽക്കാലംപോലെ’ എന്ന ഉപമ നിലനിർത്തി
  alternative: ‘അവനെ കൂലിവേലക്കാരനായി കണക്കാക്കണം’ എന്നു വ്യാഖ്യാനാത്മകമായി വ്യക്തമാക്കുക
  rationale: മൂലപാഠം ഉപമയിലൂടെ സംസാരിക്കുന്നതിനാൽ അതിനെ നേരിട്ടുള്ള നിയമനിഗമനമാക്കി മാറ്റാതെ അതിന്റെ പിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി സ്വീകരിച്ചു. ‘യോബേൽവർഷം’, ‘വിൽപ്പനവില’, ‘കൂലിവേലക്കാരൻ’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ നിയമ-സാമ്പത്തിക ഭാവം നിലനിർത്തുന്നതുമാണ്. സർവനാമങ്ങളുടെ ആവർത്തനം ഹീബ്രുവിലെ രണ്ട് വ്യക്തികളുടെ ബന്ധം കൃത്യമായി സൂക്ഷിക്കാൻ നിലനിർത്തി.
