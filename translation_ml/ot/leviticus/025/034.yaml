  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּֽ/שְׂדֵ֛ה מִגְרַ֥שׁ עָרֵי/הֶ֖ם לֹ֣א יִמָּכֵ֑ר כִּֽי אֲחֻזַּ֥ת עוֹלָ֛ם ה֖וּא לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/034.yaml
  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: ml
  text: എന്നാൽ അവരുടെ പട്ടണങ്ങളിലെ മേച്ചിൽഭൂമി[a] വിൽക്കരുത്; കാരണം അത് അവർക്കുള്ള സ്ഥിരമായ കൈവശാവകാശമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മേച്ചിൽഭൂമി’ എന്നതിന് ‘പൊതുഭൂമി’ എന്നോ ‘തുറസ്സായ ഭൂമി’ എന്നോ വിവർത്തനം ചെയ്യാം. מִגְרָשׁ എന്ന എബ്രായപദം ലേവ്യരുടെ പട്ടണങ്ങൾക്കു ചുറ്റുമുള്ള ഭൂമിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സ്ഥിരമായ’ എന്നതിന് ‘എന്നേക്കുമുള്ള’ എന്നും വിവർത്തനം ചെയ്യാം. עוֹלָם എന്ന എബ്രായപദം ദീർഘമായി നിലനിൽക്കുന്നതിനെ സൂചിപ്പിക്കാം; ഇവിടെ ഇത് കൈമാറ്റം ചെയ്യാനാവാത്ത നിലനിൽക്കുന്ന കൈവശാവകാശത്തെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׂדֵה
  choice: എന്നാൽ ... വയൽ
  rationale: שָׂדֶה എന്നതിലെ ‘വയൽ’ എന്ന അർഥം നിലനിർത്തുന്നു. മുൻവാക്യത്തിലെ പട്ടണവീടുകളെക്കുറിച്ചുള്ള വ്യവസ്ഥയോടുള്ള വൈരുധ്യം വ്യക്തമാക്കാൻ וּ־യെ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: מִגְרַשׁ עָרֵיהֶם
  choice: അവരുടെ പട്ടണങ്ങളോടു ചേർന്ന മേച്ചിൽപ്പുറം
  rationale: മִגְרָשׁ പട്ടണത്തിനു ചുറ്റുമുള്ള തുറസ്സായ, മൃഗങ്ങളെ മേയ്ക്കാൻ ഉപയോഗിക്കുന്ന ഭൂമിയെ സൂചിപ്പിക്കുന്നു. ‘പട്ടണങ്ങളോടു ചേർന്ന’ എന്നത് സ്ഥലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא יִמָּכֵר
  choice: വിൽക്കരുത്
  rationale: מכר എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള നിയമപരമായ നിഷേധം ആധുനിക മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲחֻזַּת עוֹלָם
  choice: സ്ഥിരമായ അവകാശഭൂമി
  rationale: אֲחֻזָּה പാരമ്പര്യമായി കൈവശംവയ്ക്കുന്ന ഭൂസ്വത്തിനെയും עוֹלָם ഇവിടെ അതിന്റെ ദീർഘകാല, കൈമാറ്റം ചെയ്യാനാവാത്ത നിലയെയും സൂചിപ്പിക്കുന്നു.
- source_word: הוּא לָהֶם
  choice: അത് അവരുടെ
  rationale: സർവനാമവും לָהֶם എന്ന ഉടമസ്ഥബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ ഭൂനിയമത്തിൽ עוֹלָם എന്നതിന്റെ വ്യാപ്തി
  choice: സ്ഥിരമായ
  alternative: എന്നേക്കുമുള്ള / ശാശ്വതമായ
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പദം ഭൂമിയുടെ നിലനിൽക്കുന്ന, അന്യാധീനപ്പെടുത്താനാവാത്ത അവകാശസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു; കാലാതീതമായ നിത്യതയെ നിർബന്ധമായി പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ ‘സ്ഥിരമായ’ നിയമപരമായ ശക്തി നിലനിർത്തുകയും അർഥം അതിരുകടക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി. ‘വയൽ’ എന്ന മൂലപദം നിലനിർത്തിക്കൊണ്ട് ‘മേച്ചിൽപ്പുറം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാകുന്ന വിധം ചേർത്തു; ‘അവകാശഭൂമി’ ഭൂസ്വത്തിന്റെ നിയമപരമായ സ്വഭാവം പ്രകടമാക്കുന്നു.
