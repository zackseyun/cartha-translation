revisions:
- from: എന്നാൽ അവരുടെ പട്ടണങ്ങളോടു ചേർന്ന മേച്ചിൽപ്പുറമായ വയൽ[a] വിൽക്കരുത്; കാരണം അത് അവരുടെ സ്ഥിരമായ അവകാശഭൂമിയാണ്[b].
  to: എന്നാൽ അവരുടെ പട്ടണങ്ങളിലെ മേച്ചിൽഭൂമി[a] വിൽക്കരുത്; കാരണം അത് അവർക്കുള്ള സ്ഥിരമായ കൈവശാവകാശമാണ്[b].
  rationale: The revision renders the construct relationship without adding a narrowly spatial claim, improves Malayalam idiom, and represents אֲחֻזַּת עוֹלָם as an enduring legal possession. The footnotes retain the lexical and semantic alternatives, and their markers remain correctly anchored.
