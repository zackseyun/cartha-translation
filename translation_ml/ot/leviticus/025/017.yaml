source:
  edition: WLC
  text: וְ/לֹ֤א תוֹנוּ֙ אִ֣ישׁ אֶת עֲמִית֔/וֹ וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: ml
  text: നിങ്ങളിൽ ആരും തന്റെ സഹാംഗത്തോട് അനീതി ചെയ്യരുത്[a]; നിന്റെ ദൈവത്തെ ഭയപ്പെടണം. കാരണം ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അന്യായം ചെയ്യരുത്’ അല്ലെങ്കിൽ ‘ചൂഷണം ചെയ്യരുത്.’ സാമൂഹികമോ സാമ്പത്തികമോ ആയ ഇടപാടുകളിൽ മറ്റൊരാളോട് അന്യായമായ പ്രയോജനം നേടുന്നതിനെ ഹീബ്രു ക്രിയ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: അനീതി ചെയ്യരുത്
  rationale: യנה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ സാമൂഹികമോ സാമ്പത്തികമോ ആയ ഇടപാടുകളിൽ മറ്റൊരാളെ അന്യായമായി പ്രയോജനപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അനീതി ചെയ്യുക’ അതിന്റെ വിശാലമായ നൈതിക-നിയമപരമായ ബലം നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אִישׁ
  choice: ആരും
  rationale: ഹീബ്രുവിൽ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും ഇത് വിതരണാർഥത്തിൽ ‘ഓരോരുത്തനും/ആരും’ എന്ന നിയമപ്രയോഗമാണ്. മലയാളത്തിൽ ‘നിങ്ങളിൽ ആരും’ എന്നത് സമൂഹത്തോടുള്ള വിലക്ക് സ്വാഭാവികമായും കൃത്യമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: עֲמִיתוֹ
  choice: തന്റെ സഹോദരനോട്
  rationale: עָמִית നിയമസന്ദർഭങ്ങളിൽ ഒരേ സമൂഹത്തിലെ സഹാംഗത്തെയോ സമനിലയിലുള്ള കൂട്ടാളിയെയോ സൂചിപ്പിക്കുന്നു. ‘സഹോദരൻ’ ഉടമ്പടി സമൂഹത്തിനുള്ളിലെ ബന്ധം വ്യക്തമാക്കുന്നു; ഇത് ജൈവസഹോദരനെ മാത്രം ഉദ്ദേശിക്കുന്നില്ല.
- source_word: וְיָרֵאתָ
  choice: നിന്റെ ദൈവത്തെ ഭയപ്പെടണം
  rationale: വാവ് ഔപചാരികമായി ‘എന്നും’ ആണെങ്കിലും മലയാളത്തിൽ പുതിയ നിർദേശവാക്യമായി നൽകുന്നത് നിരോധനവും അതിന്റെ ദൈവഭയത്തിലുള്ള അടിസ്ഥാനവും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: מֵאֱלֹהֶיךָ
  choice: നിന്റെ ദൈവത്തെ
  rationale: ירא എന്ന ക്രിയയ്ക്കുശേഷമുള്ള מן ദൈവത്തെ ഭയത്തിന്റെ ലക്ഷ്യമായി അടയാളപ്പെടുത്തുന്ന ഹീബ്രു പ്രയോഗമാണ്; മലയാളത്തിൽ വിഭക്തിപ്രത്യയം ഉപയോഗിച്ച് സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: ബഹുവചന പ്രത്യയം മുഴുവൻ ഉടമ്പടി സമൂഹത്തെയും അഭിസംബോധന ചെയ്യുന്നു; ‘നിങ്ങളുടെ’ അത് കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: കാരണം ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു
  rationale: כִּיയുടെ കാരണാർഥവും കല്പനയ്ക്ക് അടിസ്ഥാനമായ ഉടമ്പടി സൂത്രവാക്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ കൊണ്ട് പകരാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: אִישׁ എന്ന പ്രതിനിധിപരമായ പുല്ലിംഗ പ്രയോഗം
  choice: നിങ്ങളിൽ ആരും
  alternative: ഒരു പുരുഷനും; ഓരോ മനുഷ്യനും
  rationale: ഇത് പുരുഷന്മാരെ മാത്രം വേർതിരിക്കുന്ന പ്രസ്താവനയല്ല, സമൂഹത്തിലെ ഓരോ അംഗത്തിനുമുള്ള വിതരണാർഥ നിയമവിലക്കാണ്. മലയാളത്തിലെ ‘ആരും’ ആ പ്രവർത്തനം സ്വാഭാവികമായി നൽകുന്നു; അഭിസംബോധനയുടെ ബഹുവചനപരിധി ‘നിങ്ങളിൽ’ വ്യക്തമാക്കുന്നു.
- issue: עֲמִיתוֹ സൂചിപ്പിക്കുന്ന സാമൂഹികബന്ധം
  choice: തന്റെ സഹോദരനോട്
  alternative: തന്റെ അയൽക്കാരനോട്; തന്റെ കൂട്ടാളിയോട്
  rationale: ലേവ്യപുസ്തകത്തിലെ നിയമസന്ദർഭത്തിൽ ഈ പദം ഒരേ ഉടമ്പടി സമൂഹത്തിലെ സഹാംഗത്തെ സൂചിപ്പിക്കാം. ‘സഹോദരൻ’ ആ സാമൂഹിക-ഉടമ്പടി അടുപ്പം നിലനിർത്തുന്നു, എന്നാൽ രക്തബന്ധം മാത്രം എന്നർഥമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഏകവചനമായ ‘നിന്റെ’ എന്ന ദൈവഭയകല്പനയും ബഹുവചനമായ ‘നിങ്ങളുടെ’ എന്ന സമൂഹസംബോധനയും മൂലത്തിലെ സംഖ്യാമാറ്റം അനുസരിച്ച് നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
