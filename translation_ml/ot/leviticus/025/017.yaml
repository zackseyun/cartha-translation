  source_fidelity: The draft accurately preserves the prohibition, the singular imperative to fear God, the causal clause, and the singular-to-plural shift in ‘your God.’ However, ‘സഹോദരൻ’ adds a brotherhood sense not expressed by עֲמִיתוֹ, which denotes one’s fellow/associate, especially a fellow member of the community.
