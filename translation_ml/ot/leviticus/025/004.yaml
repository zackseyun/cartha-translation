source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: ml
  text: എന്നാൽ ഏഴാം വർഷത്തിൽ ദേശത്തിന് പൂർണവിശ്രമത്തിന്റെ ഒരു ശബ്ബത്ത്[a] ഉണ്ടായിരിക്കണം—യഹ്‌വേക്കുള്ള ഒരു ശബ്ബത്ത്. നിന്റെ വയലിൽ വിതയ്ക്കരുത്; നിന്റെ മുന്തിരിത്തോട്ടം വെട്ടിയൊരുക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഗൗരവപൂർണമായ വിശ്രമത്തിന്റെ ഒരു ശബ്ബത്ത്.’ എബ്രായപ്രയോഗം എല്ലാ പ്രവൃത്തിയും പൂർണമായി നിർത്തിവെക്കുക എന്ന ആശയത്തെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: എന്നാൽ ഏഴാം വർഷത്തിൽ
  rationale: മുൻവാക്യത്തിലെ ആറു വർഷത്തെ കൃഷിയനുമതിയോട് ഏഴാം വർഷത്തെ നിർദേശം വിപരീതമാകുന്നതിനാൽ וּ-യെ ഇവിടെ സ്വാഭാവികമായ വ്യതിരിക്തബന്ധമായി വിവർത്തനം ചെയ്തു.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: പൂർണവിശ്രമത്തിന്റെ ഒരു ശബ്ബത്ത്
  rationale: ശബ്ബത്ത് എന്ന ആശയവും שַׁבָּתוֹן നൽകുന്ന സമ്പൂർണ വിരാമത്തിന്റെ ഊന്നലും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: יִהְיֶה לָאָרֶץ
  choice: ദേശത്തിന് ... ഉണ്ടായിരിക്കണം
  rationale: വിശ്രമം ദേശത്തിനുള്ളതാണെന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദിശ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שַׁבָּת לַיהוָה
  choice: യഹ്‌വേക്കുള്ള ഒരു ശബ്ബത്ത്
  rationale: לְ-യുടെ സമർപ്പണാർഥം ‘-ക്കുള്ള’ എന്ന രൂപത്തിൽ സൂക്ഷിക്കുകയും ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: നിന്റെ വയലിൽ വിതയ്ക്കരുത്
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള നിയമനിഷേധം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു; മലയാളത്തിൽ ‘വയലിൽ വിതയ്ക്കുക’ എന്നാണ് പതിവ് പ്രയോഗം.
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: നിന്റെ മുന്തിരിത്തോട്ടം വെട്ടിയൊരുക്കുകയും അരുത്
  rationale: മുന്തിരിവള്ളികളുടെ അനാവശ്യ ശാഖകൾ മുറിച്ചുമാറ്റുന്ന זמר എന്ന കൃഷിക്രിയയെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ, സീനായിൽ വെളിപ്പെടുത്തപ്പെട്ട ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ദേശത്തിന്റെ ശബ്ബത്ത് യഹ്‌വേക്കുള്ളതെന്ന ബന്ധം
  choice: യഹ്‌വേക്കുള്ള ഒരു ശബ്ബത്ത്
  alternative: യഹ്‌വേയുടെ ശബ്ബത്ത്
  rationale: לַיהוָה എന്നത് ഉടമസ്ഥത മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കാതെ, യഹ്‌വേക്കായി സമർപ്പിക്കപ്പെട്ട വിശ്രമം എന്ന ദിശാത്മക/സമർപ്പണാർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. ‘ശബ്ബത്ത്’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തി; അപൂർവമായ കൃഷിപദത്തിനു പകരം ‘വെട്ടിയൊരുക്കുക’ ഉപയോഗിച്ചു.
