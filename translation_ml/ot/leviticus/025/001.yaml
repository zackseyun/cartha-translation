source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/הַ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/001.yaml
  text: And Yahweh spoke to Moses on Mount Sinai[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വേ[a] സീനായ് മലയിൽ മോശെയോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; ‘യഹോവ’ എന്നും ലിപ്യന്തരം ചെയ്യാറുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ ഹീബ്രു വ്യഞ്ജനരൂപവും മറ്റൊരു പ്രചാരത്തിലുള്ള ലിപ്യന്തരവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: വിവരണത്തിന്റെ അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്ന വാവ്-തുടർച്ചയും ദൈവം സംസാരിക്കുന്നതും സ്വാഭാവികവും മാന്യവുമായി പ്രകടിപ്പിക്കുന്നു; തുടർന്നുവരുന്ന לֵאמֹר എന്ന അവതാരകപ്രയോഗവുമായി അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: אֶל מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּהַר סִינַי
  choice: സീനായ് മലയിൽവെച്ച്
  rationale: בְּ എന്ന സ്ഥലസൂചകത്തിന്റെ അർഥം നിലനിർത്തുന്നു; ഇവിടെ പ്രസംഗം മലയുടെ മുകളിലാണോ മലപ്രദേശത്താണോ എന്നത് അനാവശ്യമായി നിർണയിക്കാതെ സ്ഥലബന്ധം അറിയിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ദൈവവചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രപ്രയോഗം മലയാളത്തിൽ കോളൺകൊണ്ട് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റുന്നില്ല. കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമായതിനാൽ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ ഉപയോഗിക്കുകയും മറ്റൊരു പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ മാന്യമായ മലയാളം. ഒറ്റവാക്യത്തിന്റെ തുടർച്ച അടുത്ത വാക്യത്തിലേക്ക് തുറന്നുനിർത്താൻ കോളൺ ഉപയോഗിച്ചു.
