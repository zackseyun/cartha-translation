  yaml_path: translation/ot/leviticus/025/024.yaml
  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: ml
  text: നിങ്ങളുടെ കൈവശഭൂമിയിലെല്ലാം ഭൂമിയുടെ വീണ്ടെടുപ്പ് അനുവദിക്കണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഭൂമി വീണ്ടെടുക്കുന്നതിനുള്ള അവകാശം അനുവദിക്കണം.’'
    reason: lexical_alternative
  - marker: b
    text: ‘കൈവശഭൂമി’ എന്നത് ഇസ്രായേലിൽ അവകാശമായി ലഭിച്ച വിഹിതത്തിനുള്ളിലെ ഭൂസ്വത്തിനെയോ കൈവശത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְכֹל
  choice: എല്ലാം
  rationale: നിയമം അവരുടെ കൈവശഭൂമിയുടെ മുഴുവൻ പരിധിയിലും ബാധകമാണെന്ന സമഗ്രത സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אֶרֶץ
  choice: ഭൂമി
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പദം ഭൂഗോളത്തെയല്ല, ഉടമസ്ഥതയിലുള്ള നിലത്തെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: אֲחֻזַּתְכֶם
  choice: നിങ്ങളുടെ കൈവശഭൂമി
  rationale: ഇസ്രായേലിന്റെ അവകാശവിഹിതത്തിനുള്ളിലുള്ള ഭൂസ്വത്തോ പാരമ്പര്യ കൈവശമോ എന്ന നിയമപരമായ ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: גְּאֻלָּה
  choice: വീണ്ടെടുപ്പിനുള്ള അവകാശം
  rationale: വിറ്റ ഭൂമി വിലകൊടുത്ത് തിരിച്ചുവാങ്ങാനുള്ള ക്രമീകരണമോ അവകാശമോ ആണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; വെറും ആത്മീയ അർഥം തോന്നാതിരിക്കാൻ നിയമപരമായ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: תִּתְּנוּ
  choice: അനുവദിക്കണം
  rationale: അക്ഷരാർഥമായ ‘കൊടുക്കണം’ എന്നതിനെക്കാൾ, നിയമപരമായ അവകാശം നിഷേധിക്കാതെ ലഭ്യമാക്കുക എന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לָאָרֶץ
  choice: ഭൂമിക്ക്
  rationale: വീണ്ടെടുപ്പ് ഏതിനോടു ബന്ധപ്പെട്ടതാണെന്ന് മൂലപാഠത്തിലെ ദാതൃവിഭക്തിയുടെ രൂപം ചുരുക്കമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിറ്റ പാരമ്പര്യഭൂമിയെക്കുറിച്ചുള്ള കല്പനയുടെ സ്വഭാവം
  choice: കൈവശഭൂമിക്ക് വീണ്ടെടുപ്പിനുള്ള അവകാശം അനുവദിക്കണമെന്ന നിയമപരമായ കല്പന
  alternative: ‘ഭൂമിക്ക് വീണ്ടെടുപ്പ് കൊടുക്കണം’ എന്ന കൂടുതൽ അക്ഷരാനുസൃതമായ രൂപം
  rationale: ലേവ്യപുസ്തകം 25-ലെ ഭൂനിയമസന്ദർഭം വിറ്റ ഭൂമി തിരിച്ചുവാങ്ങാനുള്ള വ്യവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘അവകാശം’ എന്നത് സന്ദർഭാർഥം വ്യക്തമാക്കുമ്പോഴും പിൽക്കാല സിദ്ധാന്താർഥങ്ങൾ ഇതിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ സന്ദർഭം വ്യക്തമാക്കാൻ ‘വീണ്ടെടുപ്പിനുള്ള അവകാശം’ ഉപയോഗിച്ചു; മൂലപാഠത്തോടടുത്ത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
