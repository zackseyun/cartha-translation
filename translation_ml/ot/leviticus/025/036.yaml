source:
  edition: WLC
  text: אַל תִּקַּ֤ח מֵֽ/אִתּ/וֹ֙ נֶ֣שֶׁךְ וְ/תַרְבִּ֔ית וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ וְ/חֵ֥י אָחִ֖י/ךָ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: ml
  text: അവനിൽനിന്ന് പലിശയോ ലാഭമോ വാങ്ങരുത്[a]. നിന്റെ ദൈവത്തെ ഭയപ്പെടുക; നിന്റെ സഹോദരൻ നിന്നോടൊപ്പം ജീവിക്കട്ടെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലാഭം’ എന്നതിന് ‘വർധന’ അല്ലെങ്കിൽ ‘നേട്ടം’ എന്നും പരിഭാഷപ്പെടുത്താം. ദരിദ്രനായ കടക്കാരനിൽനിന്ന് ഈടാക്കുന്ന പലിശയെ സംബന്ധിച്ച രണ്ട് അർത്ഥസമീപ പദങ്ങളാണ് ഹീബ്രുവിൽ ഇവിടെ ചേർത്തുപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘നിന്റെ സഹോദരൻ’ എന്നത് രക്തബന്ധമുള്ള സഹോദരനെ മാത്രം അല്ല, ഉടമ്പടിസമൂഹത്തിലെ ഒരു സഹാംഗത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: വാങ്ങരുത്
  rationale: אַל ചേർന്ന അപൂർണക്രിയ നേരിട്ടുള്ള നിരോധനമാണ്. സാമ്പത്തിക സന്ദർഭത്തിൽ ‘വാങ്ങരുത്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מֵאִתּוֹ
  choice: അവനിൽനിന്ന്
  rationale: നിരോധിക്കപ്പെട്ട സാമ്പത്തിക നേട്ടം ആരിൽനിന്നാണ് ഈടാക്കുന്നത് എന്ന് ഈ പദബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: נֶשֶׁךְ
  choice: പലിശ
  rationale: വായ്പയ്ക്കു ചുമത്തുന്ന പലിശയാണ് അർത്ഥം; പഴഞ്ചനായോ അതിരുകടന്ന പലിശ മാത്രം സൂചിപ്പിക്കുന്നതായോ തോന്നാവുന്ന പദങ്ങളെക്കാൾ ആധുനിക മലയാളത്തിൽ ഇത് വ്യക്തമാണ്.
- source_word: וְתַרְבִּית
  choice: ലാഭം
  rationale: נֶשֶׁךְ എന്ന പദത്തോടു ചേർന്ന് കടം വാങ്ങിയ ദരിദ്രനിൽനിന്ന് ഈടാക്കുന്ന വർധിത തുകയെയോ നേട്ടത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വർധന’ എന്നതും സാധ്യമാണ്; എന്നാൽ സാമ്പത്തിക സന്ദർഭത്തിൽ ‘ലാഭം’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: നിന്റെ ദൈവത്തെ ഭയപ്പെടുക
  rationale: ദൈവത്തോടുള്ള ഉത്തരവാദിത്വത്തെ നേരിട്ട് അറിയിക്കുന്നു. ഹീബ്രുവിലെ ഉടമ്പടിസംബന്ധമായ രണ്ടാംപുരുഷ ഏകവചന ഭാവം നിലനിർത്തുന്നു.
- source_word: וְחֵי
  choice: ജീവിക്കട്ടെ
  rationale: സന്ദർഭത്തിൽ അനുവദനീയമോ നിർദേശാത്മകമോ ആയ ജസ്സീവ് ഭാവം നൽകുന്നു. ‘അങ്ങനെ ജീവിക്കേണ്ടതിന്’ എന്ന വ്യക്തമായ ഉദ്ദേശ്യബന്ധം ചേർക്കാതെ ഹീബ്രു സംയോജനത്തിന്റെ തുറന്ന സ്വഭാവം സംരക്ഷിക്കുന്നു.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരൻ
  rationale: അക്ഷരാർഥത്തിലുള്ള കുടുംബപദം നിലനിർത്തുന്നു; ഇവിടെ അത് രക്തബന്ധമുള്ള സഹോദരനെ മാത്രം അല്ല, ഉടമ്പടിസമൂഹത്തിലെ സഹാംഗത്തെയും സൂചിപ്പിക്കാം.
- source_word: עִמָּךְ
  choice: നിന്നോടൊപ്പം
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്നവന്റെ കൂടെ സമൂഹത്തിൽ തുടർന്നു ജീവിക്കുക എന്ന ആശയം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടി നിയമത്തിലെ אָחִיךָ എന്ന സാമൂഹിക-നൈതിക പദത്തിന്റെ പരിഭാഷ
  choice: നിന്റെ സഹോദരൻ
  alternative: നിന്റെ സഹഇസ്രായേല്യൻ / നിന്റെ ബന്ധു
  rationale: ‘സഹോദരൻ’ എന്നത് ഹീബ്രുവിലെ കുടുംബപരവും ഉടമ്പടിപരവുമായ ശക്തി നിലനിർത്തുന്നു. അതിന്റെ വിപുലമായ സാമൂഹിക അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: וְחֵי എന്നതിലെ ബന്ധം
  choice: നിന്റെ സഹോദരൻ നിന്നോടൊപ്പം ജീവിക്കട്ടെ
  alternative: നിന്റെ സഹോദരൻ നിന്നോടൊപ്പം ജീവിക്കേണ്ടതിന്
  rationale: ഹീബ്രുവിലെ וְ എന്ന സംയോജകത്തെ വ്യക്തമായ ഉദ്ദേശ്യവാക്യമായി തീർപ്പാക്കാതെ, നിർദേശാത്മക/ഫലാത്മക സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നേരിട്ടുള്ള ഏകവചന അഭിസംബോധനയും കുടുംബപരമായ ‘സഹോദരൻ’ എന്ന രൂപവും നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകങ്ങൾ ബന്ധപ്പെട്ട പ്രസ്താവനകൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
