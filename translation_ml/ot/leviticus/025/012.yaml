id: LEV.25.12
reference: Leviticus 25:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: ml
  text: കാരണം, ഇത് ജൂബിലിവർഷമാണ്; ഇത് നിങ്ങൾക്കു വിശുദ്ധമായിരിക്കണം. വയലിൽനിന്ന് അതിന്റെ വിളവ്[a] നിങ്ങൾ ഭക്ഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അതിന്റെ ഉൽപ്പന്നം’ അല്ലെങ്കിൽ ‘അതിന്റെ കൃഷിഫലം.’ എബ്രായപദം വയൽ പുറപ്പെടുവ Jennings?
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: അത്
  rationale: മുൻ നിർദേശത്തിന്റെ കാരണം വിശദീകരിക്കുന്ന ഘടകമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യബന്ധത്തിനായി പ്രത്യേക കാരണസൂചക പദം ചേർക്കാതെ പ്രസ്താവനയായി നൽകി.
- source_word: יוֹבֵל
  choice: ജൂബിലിവർഷം
  rationale: ലേവ്യപുസ്തകം 25-ൽ ഈ പദം ആട്ടുകൊമ്പിനെയല്ല, പ്രത്യേകമായ അമ്പതാം വർഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വർഷം’ ചേർക്കുന്നത് അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: അത് നിങ്ങൾക്കു വിശുദ്ധമായിരിക്കണം
  rationale: കർത്താവിനായി വേർതിരിക്കപ്പെട്ടിരിക്കുന്നതിന്റെ ഉടമ്പടിപരവും മതപരവുമായ ഭാരം ‘വിശുദ്ധം’ നിലനിർത്തുന്നു.
- source_word: מִן הַשָּׂדֶה
  choice: വയലിൽനിന്ന്
  rationale: വയൽ സ്വാഭാവികമായി ഉൽപ്പാദിപ്പിക്കുന്നതിൽനിന്ന് നേരിട്ട് ഭക്ഷിക്കണമെന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: תֹּאכְלוּ
  choice: നിങ്ങൾ ഭക്ഷിക്കണം
  rationale: നിയമസന്ദർഭത്തിലെ നിർദേശാത്മകമായ അപൂർണക്രിയയെ ആധുനിക മലയാളത്തിലെ വ്യക്തമായ വിധിരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תְּבוּאָתָהּ
  choice: അതിന്റെ വിളവ്
  rationale: വയൽ പുറപ്പെടുവിക്കുന്ന ഫലത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദമാണ് ‘വിളവ്’; സ്വയം വളർന്ന ഉൽപ്പന്നങ്ങളെയും ഉൾക്കൊള്ളാൻ ഇതിന് കഴിയും.
theological_decisions:
- issue: ജൂബിലിവർഷത്തിന്റെ വിശുദ്ധിയെ സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: അത് നിങ്ങൾക്കു വിശുദ്ധമായിരിക്കണം
  alternative: അത് നിങ്ങൾക്കു പവിത്രമായിരിക്കണം / നിങ്ങൾക്കായി വേർതിരിക്കപ്പെട്ടതായിരിക്കണം
  rationale: קֹדֶשׁ എന്ന പദത്തിന്റെ ഉടമ്പടിപരവും ദൈവബന്ധിതവുമായ ഭാരം ‘വിശുദ്ധം’ വ്യക്തമായി നിലനിർത്തുന്നു; അതിനെ വെറും പ്രത്യേകതയോ ആചാരപരമായ വേർതിരിവോ ആയി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ. ‘ജൂബിലിവർഷം’ സാധാരണ വായനക്കാരന് ആശയം വ്യക്തമാക്കുന്നു; ‘വിശുദ്ധം’ പ്രധാന ദൈവശാസ്ത്രപദത്തിന്റെ സ്ഥിരത പാലിക്കുന്നു.
