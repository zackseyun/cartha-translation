  yaml_path: translation/ot/leviticus/025/007.yaml
  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: ml
  text: നിന്റെ വളർത്തുമൃഗങ്ങൾക്കും നിന്റെ ദേശത്തുള്ള വന്യമൃഗങ്ങൾക്കും ദേശത്തെ മുഴുവൻ വിളവും ഭക്ഷണത്തിനായിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: നിന്റെ കന്നുകാലികൾക്കും
  rationale: בְּהֵמָה ഇവിടെ അഭിസംബോധിതന്റെ ഉടമസ്ഥതയിലുള്ള വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള വന്യമൃഗങ്ങളിൽനിന്നുള്ള വ്യത്യാസവും ‘കന്നുകാലികൾ’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לַחַיָּה
  choice: വന്യമൃഗങ്ങൾക്കും
  rationale: חַיָּה ഇവിടെ വളർത്തുമൃഗങ്ങൾക്ക് വിപരീതമായി സ്വതന്ത്രമായി ജീവിക്കുന്ന മൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘വന്യമൃഗങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: നിന്റെ ദേശത്തുള്ള
  rationale: ബന്ധവാക്യം വന്യമൃഗങ്ങളെ വിശേഷിപ്പിക്കുന്നു. אֶרֶץ എന്നതിന്റെ ഭൗമികവും ഉടമ്പടിപരവുമായ അർഥഭാവം ‘ദേശം’ നിലനിർത്തുന്നു.
- source_word: תִּהְיֶה
  choice: ആയിരിക്കണം
  rationale: היה ഇവിടെ വിളവ് ആഹാരമായി ലഭ്യമായിരിക്കണമെന്ന നിയമപരമായ നിർദേശം പ്രകടിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ നിർദേശസ്വരം ‘ആയിരിക്കണം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל תְּבוּאָתָהּ
  choice: അതിന്റെ വിളവെല്ലാം
  rationale: תְּבוּאָה ഭൂമിയിൽനിന്നു ലഭിക്കുന്ന ഉൽപ്പന്നത്തെയോ വിളവിനെയോ സൂചിപ്പിക്കുന്നു; സ്ത്രീലിംഗ പ്രത്യയം മുമ്പുള്ള ദേശത്തെയാണ് പരാമർശിക്കുന്നത്. കാർഷികസന്ദർഭത്തിൽ ‘വിളവ്’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: לֶאֱכֹל
  choice: ആഹാരമായി
  rationale: ל ചേർന്ന ക്രിയാനാമം ഇവിടെ ഉദ്ദേശ്യമോ ഉപയോഗമോ സൂചിപ്പിക്കുന്നു. ‘ആഹാരമായി’ എന്നത് അർഥം വ്യക്തമായി നൽകുകയും മലയാളത്തിലെ നിയമനിർദേശ ശൈലിക്ക് ചേരുകയും ചെയ്യുന്നു.
