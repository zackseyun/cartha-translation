  source_fidelity: 'The conditional and the reference to the prior redemption provisions are conveyed accurately. However, "വിട്ടുപോകണം" expresses obligation (''must leave''), whereas the Hebrew imperfect in this legal apodosis states the resulting outcome: he and his sons will go out in the Jubilee year. "പുറപ്പെടും" retains the Hebrew legal idiom without adding a modal obligation.'
