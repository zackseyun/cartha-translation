    issue: '"വിട്ടുപോകണം" is overly modal.'
    rationale: It can mean that the man is required to leave, while וְיָצָא presents the legal consequence that he will go out/be released in the Jubilee year. Replacing it with "പുറപ്പെടും" avoids this shift.
