  terminology: '"വീണ്ടെടുക്കപ്പെടുക" suitably renders נגאל in this redemption-law context. "പുത്രന്മാർ" correctly preserves the masculine plural ''sons''; "യോബേൽ" is retained as the conventional term.'
  issues:
