reference: Leviticus 25:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם לֹ֥א יִגָּאֵ֖ל בְּ/אֵ֑לֶּה וְ/יָצָא֙ בִּ/שְׁנַ֣ת הַ/יֹּבֵ֔ל ה֖וּא וּ/בָנָ֥י/ו עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: ml
  text: എന്നാൽ ഈ മാർഗങ്ങളാൽ അവൻ വീണ്ടെടുക്കപ്പെടുന്നില്ലെങ്കിൽ[a], അവനും അവനോടൊപ്പം അവന്റെ പുത്രന്മാരും യോബേൽ വർഷത്തിൽ പുറപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇവയാൽ’—മുമ്പുള്ള വാക്യങ്ങളിൽ വിവരിച്ച വീണ്ടെടുപ്പുവ്യവസ്ഥകളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻപു പറഞ്ഞ വീണ്ടെടുപ്പുസാധ്യതകളോട് ബന്ധിപ്പിക്കുന്ന നിബന്ധനയും നേരിയ വൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לֹא
  choice: ഇല്ല
  rationale: തുടർന്നുവരുന്ന ക്രിയയെ നിഷേധിക്കുന്ന സാധാരണ നിഷേധരൂപം.
- source_word: יִגָּאֵל
  choice: വീണ്ടെടുക്കപ്പെടുന്നു
  rationale: ബന്ധുവോ വിലയടയ്ക്കുന്ന ക്രമമോ മുഖേന ദാസ്യത്തിൽനിന്നു വീണ്ടെടുക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന നിഫാൽ രൂപത്തിന്റെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: בְּאֵלֶּה
  choice: ഈ മാർഗങ്ങളാൽ
  rationale: മുൻവാക്യങ്ങളിൽ വിവരിച്ച വീണ്ടെടുപ്പിനുള്ള വ്യവസ്ഥകളിലേക്കാണ് സൂചന; ‘മാർഗങ്ങളാൽ’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ സൂചന വ്യക്തമാക്കുമ്പോഴും മൂലത്തിലെ സംക്ഷിപ്തതയെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְיָצָא
  choice: വിട്ടുപോകണം
  rationale: അക്ഷരാർഥത്തിൽ ‘പുറപ്പെടും’; ഈ ദാസ്യനിയമസന്ദർഭത്തിൽ സേവനത്തിൽനിന്നുള്ള വിടുതലാണ് ഉദ്ദേശ്യം. ‘വിട്ടുപോകണം’ നിയമവ്യവസ്ഥയുടെ ബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: യോബേൽവർഷത്തിൽ
  rationale: ലേവ്യപുസ്തകത്തിലെ יוֹבֵל എന്ന നിയമപരമായ കാലസൂചകത്തിന് മലയാളത്തിൽ പരിചിതമായ പദപ്രയോഗം.
- source_word: הוּא
  choice: അവൻ
  rationale: സ്വതന്ത്ര സർവനാമം വിഷയത്തെ വ്യക്തമായി വീണ്ടും ചൂണ്ടിക്കാണിക്കുന്നു.
- source_word: וּבָנָיו עִמּוֹ
  choice: അവനോടൊപ്പം അവന്റെ പുത്രന്മാരും
  rationale: בנים എന്ന പുല്ലിംഗ ബഹുവചനം ‘പുത്രന്മാർ’ എന്നു കൃത്യമായി നിലനിർത്തുകയും עִמּוֹ എന്ന കൂട്ടായ വിടുതൽസൂചന സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കുടുംബത്തെ സൂചിപ്പിക്കുന്ന בָנָיו എന്ന ലിംഗനിർദ്ദിഷ്ട പദം
  choice: പുത്രന്മാർ
  alternative: മക്കൾ
  rationale: എബ്രായമൂലം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്നാണ് പറയുന്നത്; അതിനെ ലിംഗനിരപേക്ഷമായി വിപുലീകരിക്കാതെ മൂലരൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘വീണ്ടെടുക്കപ്പെടുക’, ‘യോബേൽവർഷം’ എന്നീ സന്ദർഭപ്രധാന പദങ്ങൾ നിലനിർത്തി; അതേസമയം വാക്യഘടന സാധാരണ വായനക്കാർക്കു സുഗമമാക്കി.
