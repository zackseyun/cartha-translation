revisions:
- from: അമ്പതാം വർഷം നിങ്ങൾ വിശുദ്ധീകരിക്കണം; ദേശത്തിലെ സകല നിവാസികൾക്കും വിടുതൽ[a] പ്രഖ്യാപിക്കണം. അത് നിങ്ങൾക്കു യോവേൽവർഷം[b] ആയിരിക്കണം. നിങ്ങളിൽ ഓരോരുത്തനും അവനവന്റെ അവകാശസ്വത്തിലേക്കു[c] മടങ്ങണം; ഓരോരുത്തനും അവനവന്റെ കുടുംബത്തിലേക്കും[d] മടങ്ങണം.
  to: അമ്പതാം വർഷത്തെ നിങ്ങൾ വിശുദ്ധീകരിക്കണം; ദേശത്ത് അതിലെ സകല നിവാസികൾക്കും വിടുതൽ[a] പ്രഖ്യാപിക്കണം. അത് നിങ്ങൾക്കു യോവേൽ വർഷം[b] ആയിരിക്കണം. നിങ്ങളിൽ ഓരോരുത്തനും അവനവന്റെ സ്വത്തിലേക്കു[c] മടങ്ങണം; ഓരോരുത്തനും അവനവന്റെ കുടുംബത്തിലേക്കും[d] മടങ്ങണം.
  rationale: The revision clarifies that the fiftieth year itself is consecrated, preserves the Hebrew’s location-plus-recipient construction, and retains the repeated ‘return.’ It also uses a less over-specified main-text equivalent for אֲחֻזָּה while preserving its inherited-holding nuance in a footnote, and narrows the Jubilee note to the contextual meaning.
