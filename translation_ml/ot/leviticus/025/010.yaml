id: LEV.25.10
reference: Leviticus 25:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: ml
  text: അമ്പതാം വർഷത്തെ നിങ്ങൾ വിശുദ്ധീകരിക്കണം; ദേശത്ത് അതിലെ സകല നിവാസികൾക്കും വിടുതൽ[a] പ്രഖ്യാപിക്കണം. അത് നിങ്ങൾക്കു യോവേൽ വർഷം[b] ആയിരിക്കണം. നിങ്ങളിൽ ഓരോരുത്തനും അവനവന്റെ സ്വത്തിലേക്കു[c] മടങ്ങണം; ഓരോരുത്തനും അവനവന്റെ കുടുംബത്തിലേക്കും[d] മടങ്ങണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മോചനം’ എന്നോ ‘സ്വാതന്ത്ര്യം’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ ദെരോർ എന്ന പദം യോവേൽ വർഷത്തിലെ ഔദ്യോഗിക വിടുതൽപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ യോവേൽ ഈ സന്ദർഭത്തിൽ അമ്പതാം വർഷത്തിലെ പ്രത്യേക സ്ഥാപനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘കൈവശസ്വത്തിലേക്കു.’ എബ്രായപദം പ്രത്യേകിച്ച് പാരമ്പര്യമായി ലഭിച്ച ഭൂസ്വത്തെയോ സ്വത്തവകാശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ ‘കുലത്തിലേക്കും.’ എബ്രായപദം കുടുംബത്തെയോ വിശാലമായ ബന്ധുസംഘത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: നിങ്ങൾ വിശുദ്ധീകരിക്കണം
  rationale: קדשׁ എന്ന പിയേൽ ക്രിയയുടെ ‘വിശുദ്ധമായി വേർതിരിക്കുക, വിശുദ്ധീകരിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; നിയമപരവും ആരാധനാസംബന്ധവുമായ സന്ദർഭത്തിന് യോജിച്ച ആധുനിക മലയാളപ്രയോഗമാണിത്.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: അമ്പതാം വർഷം
  rationale: എബ്രായ സംഖ്യാഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം; അർഥനഷ്ടമില്ലാതെ ക്രമസംഖ്യ വ്യക്തമാക്കുന്നു.
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: വിടുതൽ പ്രഖ്യാപിക്കണം
  rationale: דְּרוֹר ഇവിടെ യോവേൽവർഷത്തിലെ ഔദ്യോഗിക വിമോചനപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു. ‘വിടുതൽ’ അടിമത്തത്തിൽനിന്നുള്ള മോചനവും ബാധ്യതകളിൽനിന്നുള്ള വിടുതലും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവിക പദമാണ്.
- source_word: בָּאָרֶץ לְכָל יֹשְׁבֶיהָ
  choice: ദേശത്തിലെ സകല നിവാസികൾക്കും
  rationale: בְּ എന്നതിന്റെ സ്ഥലാർഥവും לְ എന്നതിന്റെ അഭിമുഖാർഥവും നേരിട്ട് നിലനിർത്തുന്നു; ‘സകല നിവാസികൾക്കും’ എന്നത് പ്രഖ്യാപനത്തിന്റെ സമഗ്ര വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: יוֹבֵל הִוא תִּהְיֶה לָכֶם
  choice: അത് നിങ്ങൾക്കു യോവേൽവർഷം ആയിരിക്കണം
  rationale: ഈ സന്ദർഭത്തിൽ יוֹבֵל കൊമ്പിനെ മാത്രമല്ല, അമ്പതാം വർഷത്തിലെ പ്രത്യേക സ്ഥാപനത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതികപദമാണ്. ലിപ്യന്തരണത്തോടൊപ്പം ‘വർഷം’ ചേർക്കുന്നത് സാധാരണ വായനക്കാർക്ക് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: മടങ്ങണം ... മടങ്ങണം
  rationale: שׁוב എന്ന ഒരേ ക്രിയയുടെ ആവർത്തനം നിലനിർത്തി സ്വത്തിന്റെയും കുടുംബത്തിന്റെയും പുനഃസ്ഥാപനം ഊന്നിപ്പറയുന്നു.
- source_word: אִישׁ
  choice: നിങ്ങളിൽ ഓരോരുത്തനും / ഓരോരുത്തനും
  rationale: പുരുഷലിംഗ ഏകവചനരൂപമായ אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു. രണ്ടാംപുരുഷ ബഹുവചന അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുമ്പോൾ ഓരോ വ്യക്തിയെയും ഉദ്ദേശിക്കുന്ന നിയമപരമായ ബലം നിലനിർത്തുന്നു.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: അവനവന്റെ അവകാശസ്വത്തിലേക്കു
  rationale: אֲחֻזָּה സാധാരണ സ്വത്ത് മാത്രമല്ല, പ്രത്യേകിച്ച് കുടുംബപരമായി ലഭിച്ച ഭൂസ്വത്തോ കൈവശാവകാശമോ സൂചിപ്പിക്കുന്നു. ‘അവകാശസ്വത്ത്’ ഈ ഘടകം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: അവനവന്റെ കുടുംബത്തിലേക്കും
  rationale: מִשְׁפָּחָה കുടുംബത്തെയോ വിശാലമായ കുലബന്ധസംഘത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ പൊതുവായ ‘കുടുംബം’ ഉപയോഗിച്ച് ‘കുലം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോവേൽവർഷത്തിലെ דְּרוֹר എന്ന പ്രഖ്യാപനത്തിന്റെ വ്യാപ്തി
  choice: വിടുതൽ
  alternative: മോചനം; സ്വാതന്ത്ര്യം
  rationale: പദം ഔദ്യോഗികമായ വിടുതൽപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു; രാഷ്ട്രീയസ്വാതന്ത്ര്യമെന്ന ഒറ്റ അർഥത്തിലേക്കോ ഒരു പ്രത്യേക വിമോചനരീതിയിലേക്കോ ചുരുക്കാതെ സന്ദർഭത്തിലെ നിയമപരവും സാമൂഹികവുമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- issue: יוֹבֵל എന്ന പദത്തിന്റെ സാങ്കേതിക അർഥം
  choice: യോവേൽവർഷം
  alternative: യോവേൽ; ആട്ടുകൊമ്പിന്റെ നാദം
  rationale: ലേവ്യപുസ്തകം 25-ലെ സമീപസന്ദർഭത്തിൽ ഇത് അമ്പതാം വർഷത്തെ സ്ഥാപനമാണ്. കൊമ്പുമായുള്ള പദബന്ധം അംഗീകരിക്കുമ്പോഴും മുഖ്യപാഠം ഇവിടെ ഉദ്ദേശിക്കുന്ന വർഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: വിതരണാർഥത്തിലുള്ള אִישׁ
  choice: നിങ്ങളിൽ ഓരോരുത്തനും
  alternative: ഓരോ പുരുഷനും
  rationale: നിയമത്തിലെ രണ്ടാംപുരുഷ ബഹുവചന അഭിസംബോധനയ്ക്കുള്ളിൽ אִישׁ ഓരോ അംഗത്തെയും വേർതിരിച്ച് സൂചിപ്പിക്കുന്നു. ‘ഓരോരുത്തനും’ എന്നത് ലിംഗത്തെക്കുറിച്ചുള്ള അനാവശ്യമായ സിദ്ധാന്തപരമായ നിഗമനം വരുത്താതെ വിതരണാർഥം കൃത്യമായി നൽകുന്നു.
- issue: מִשְׁפָּחָה സൂചിപ്പിക്കുന്ന സാമൂഹിക ഘടകം
  choice: കുടുംബം
  alternative: കുലം
  rationale: എബ്രായപദത്തിന് അടുത്ത കുടുംബത്തേക്കാൾ വിശാലമായ ബന്ധുസംഘത്തെയും സൂചിപ്പിക്കാം. വായനാസൗകര്യത്തിനായി ‘കുടുംബം’ മുഖ്യപാഠത്തിൽ നൽകിയെങ്കിലും യഥാർഥമായ അർഥവൈകല്യം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആരാധനാശൈലി സ്വീകരിച്ചു. ‘സകല നിവാസികൾക്കും,’ ‘വിശുദ്ധീകരിക്കണം,’ ‘പ്രഖ്യാപിക്കണം’ എന്നിവ ഔപചാരികത നിലനിർത്തുന്നു; അതേസമയം വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. എബ്രായത്തിലെ ‘മടങ്ങുക’ എന്ന ആവർത്തനം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
