id: LEV.25.31
reference: Leviticus 25:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָתֵּ֣י הַ/חֲצֵרִ֗ים אֲשֶׁ֨ר אֵין לָ/הֶ֤ם חֹמָה֙ סָבִ֔יב עַל שְׂדֵ֥ה הָ/אָ֖רֶץ יֵחָשֵׁ֑ב גְּאֻלָּה֙ תִּהְיֶה לּ֔/וֹ וּ/בַ/יֹּבֵ֖ל יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: ml
  text: എന്നാൽ ചുറ്റും മതിലില്ലാത്ത ഗ്രാമങ്ങളിലെ വീടുകൾ ദേശത്തെ വയലായി കണക്കാക്കപ്പെടും[a]. അവ വീണ്ടെടുക്കാവുന്നതായിരിക്കും; ജൂബിലിവർഷത്തിൽ അവ വിടുതൽ പ്രാപിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ദേശത്തെ വയലായി കണക്കാക്കപ്പെടും.” അതായത്, ഈ ഗ്രാമവീടുകൾ മതിൽകെട്ടിയ നഗരങ്ങളിലെ വീടുകളായല്ല, ഗ്രാമീണ ഭൂമിപോലെയാണ് നിയമപരമായി പരിഗണിക്കപ്പെടുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “ജൂബിലിയിൽ അത് പുറപ്പെടും.” അതായത്, ജൂബിലിവർഷത്തിൽ ഈ സ്വത്ത് വിട്ടയക്കപ്പെടുകയോ അതിന്റെ മുൻ അവകാശത്തിലേക്ക് മടങ്ങുകയോ ചെയ്യും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתֵּי הַחֲצֵרִים
  choice: എന്നാൽ ... ഗ്രാമങ്ങളിലെ വീടുകൾ
  rationale: חֲצֵרִים ഇവിടെ മതിൽകെട്ടിയ നഗരങ്ങളിൽനിന്നു വ്യത്യസ്തമായ ഗ്രാമീണ കുടിയിരിപ്പുകളെ സൂചിപ്പിക്കുന്നു. തുടർന്ന് മതിലില്ലായ്മ പ്രത്യേകം പറയുന്നതിനാൽ ‘ഗ്രാമങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: ചുറ്റും മതിലില്ലാത്ത
  rationale: ഗ്രാമങ്ങളെ ചുറ്റിയുള്ള മതിലിന്റെ അഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: നാട്ടിൻപുറത്തെ വയലുകൾപോലെ കണക്കാക്കണം
  rationale: 'അക്ഷരാർഥത്തിലെ ‘ദേശത്തിലെ വയൽ’ എന്ന പ്രയോഗത്തിന്റെ നിയമപരമായ ഉദ്ദേശ്യം നിലനിർത്തുന്നു: ഈ വീടുകൾ മതിൽകെട്ടിയ നഗരവീടുകളായല്ല, ഗ്രാമീണ ഭൂമിയായാണ് പരിഗണിക്കപ്പെടുന്നത്.'
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: അവ വീണ്ടെടുക്കാവുന്നതായിരിക്കും
  rationale: വിൽക്കപ്പെട്ട സ്വത്ത് ബന്ധുവോ മുൻ ഉടമയോ തിരികെ വാങ്ങാനുള്ള നിയമപരമായ വീണ്ടെടുപ്പാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ഹീബ്രായ ഏകവചന സർവനാമം സ്വത്തിനെ ഒരു വിഭാഗമായി കാണുന്നു; മലയാളത്തിൽ മുൻപുള്ള ബഹുവചനത്തോട് ചേർന്ന് ‘അവ’ ഉപയോഗിച്ചു.
- source_word: וּבַיֹּבֵל יֵצֵא
  choice: ജൂബിലിവർഷത്തിൽ അവ വിട്ടുകൊടുക്കപ്പെടുകയും വേണം
  rationale: יֵצֵא എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘പുറപ്പെടുക’ ആണെങ്കിലും, ഈ സ്വത്തുനിയമസന്ദർഭത്തിൽ ജൂബിലിയിൽ വാങ്ങിയവന്റെ കൈവശത്തിൽനിന്ന് സ്വത്ത് വിടുതൽ പ്രാപിച്ച് മടങ്ങുന്നതാണ് ആശയം. മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ നിയമപരമായ ഫലം വ്യക്തമാക്കി.
theological_decisions:
- issue: ജൂബിലിയിൽ സ്വത്തിന്റെ ‘പുറപ്പെടൽ’ ആരിലേക്കുള്ള മടക്കമാണെന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല
  choice: പ്രധാനപാഠത്തിൽ ‘വിട്ടുകൊടുക്കപ്പെടുക’ എന്നു നൽകി, മടക്കത്തിന്റെ നിയമപരമായ ആശയം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു
  alternative: ‘അവ പുറപ്പെടും’ എന്ന അക്ഷരാർഥ വിവർത്തനം
  rationale: മൂലത്തിലെ നിയമപരമായ വിടുതൽ നിലനിർത്തിക്കൊണ്ട്, മുൻ ഉടമയിലേക്കോ അവകാശകുടുംബത്തിലേക്കോ എന്നതിനെ പ്രധാനപാഠത്തിൽ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘വീണ്ടെടുക്കുക’, ‘ജൂബിലിവർഷം’ എന്നിവ ലേവ്യപുസ്തകത്തിലെ ഭൂസ്വത്തുനിയമസന്ദർഭവുമായി യോജിക്കുന്ന സാങ്കേതിക പദങ്ങളായി നിലനിർത്തി; അപരിചിതമായ ഹീബ്രായ പ്രയോഗങ്ങൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
