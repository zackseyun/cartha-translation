  verdict: revise
  source_fidelity: 'The procedural sense is accurately represented: he calculates the years from the sale, repays the amount remaining after that calculation to the purchaser, and returns to his landed holding. The phrase for the recipient should be made syntactically unambiguous in Malayalam as the person to whom he sold the land.'
