  terminology: ‘അവകാശഭൂമി’ appropriately conveys אֲחֻזָּה as a hereditary landed holding in this context, and the cultural footnote preserves the fuller nuance. ‘ശേഷിക്കുന്ന തുക’ accurately renders הָעֹדֵף in its redemption-payment context.
