source:
  edition: WLC
  text: וְ/חִשַּׁב֙ אֶת שְׁנֵ֣י מִמְכָּר֔/וֹ וְ/הֵשִׁיב֙ אֶת הָ֣/עֹדֵ֔ף לָ/אִ֖ישׁ אֲשֶׁ֣ר מָֽכַר ל֑/וֹ וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/027.yaml
  text: then he shall calculate the years since its sale and return the surplus to the man to whom he sold it, and he shall return to his property.
translation:
  language: ml
  text: അപ്പോൾ അവൻ അത് വിറ്റതുമുതലുള്ള വർഷങ്ങൾ കണക്കാക്കി, ശേഷിക്കുന്ന തുക[a] താൻ അത് വിറ്റുകൊടുത്ത ആളിന് തിരികെ കൊടുക്കണം; പിന്നെ അവൻ തന്റെ അവകാശഭൂമിയിലേക്കു[b] മടങ്ങണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശേഷിക്കുന്നത്’ അല്ലെങ്കിൽ ‘അധികമുള്ളത്’ എന്നും പരിഭാഷപ്പെടുത്താം. അവശേഷിക്കുന്ന വർഷങ്ങൾക്കുള്ള മൂല്യം കണക്കാക്കിയശേഷം ബാക്കിയാകുന്ന തുകയെയാണ് ഹീബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവകാശഭൂമി’ എന്നത് അവന്റെ ഭൂസ്വത്തിനെ—സാധ്യതയേറിയവിധം ഇസ്രായേലിൽ കുടുംബത്തിനു ലഭിച്ച പാരമ്പര്യ ഭൂവിഹിതത്തെ—സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: അപ്പോൾ അവൻ ... കണക്കാക്കി
  rationale: חִשֵּׁב എന്ന ക്രിയ ഇവിടെ വീണ്ടെടുപ്പിനായി തുക കണക്കാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അപ്പോൾ’ സന്ദർഭത്തിലെ നടപടിക്രമക്രമം വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: അതു വിറ്റതുമുതലുള്ള വർഷങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ വിൽപ്പനയുടെ വർഷങ്ങൾ.’ ഭൂമിയുടെ വീണ്ടെടുപ്പ് സംബന്ധിച്ച സന്ദർഭത്തിൽ, വിൽപ്പനയ്ക്കുശേഷം കഴിഞ്ഞ വർഷങ്ങളാണ് കണക്കാക്കേണ്ടത്; മലയാളത്തിൽ ഈ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהֵשִׁיב אֶת־הָעֹדֵף
  choice: ശേഷിക്കുന്ന തുക ... തിരികെ കൊടുക്കണം
  rationale: הֵשִׁיב എന്ന ഹിഫീൽ രൂപം തിരികെ നൽകുക/മടക്കിക്കൊടുക്കുക എന്നും הָעֹדֵף കണക്കിന് ശേഷം ശേഷിക്കുന്നതെന്നും സൂചിപ്പിക്കുന്നു. സാമ്പത്തിക സന്ദർഭം വ്യക്തമാക്കാൻ ‘തുക’ ചേർത്തിരിക്കുന്നു.
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: താൻ അതു വിറ്റയാൾക്ക്
  rationale: ഹീബ്രായിലെ വ്യക്തിപരമായ പരാമർശം നിലനിർത്തിക്കൊണ്ട്, വാങ്ങിയ വ്യക്തിയെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְשָׁב
  choice: പിന്നെ അവൻ ... മടങ്ങണം
  rationale: שׁוב എന്ന ക്രിയയുടെ ‘മടങ്ങുക’ എന്ന അടിസ്ഥാനാർഥവും നിയമനിർദേശത്തിന്റെ ബാധ്യതാസ്വരവും നിലനിർത്തുന്നു.
- source_word: לַאֲחֻזָּתוֹ
  choice: തന്റെ അവകാശഭൂമിയിലേക്ക്
  rationale: ലേവ്യപുസ്തകത്തിലെ אֲחֻזָּה സാധാരണ സ്വത്തിനെക്കാൾ, കുടുംബത്തിനോ ഗോത്രത്തിനോ ലഭിച്ച സ്ഥിരമായ ഭൂവുടമസ്ഥതയെ സൂചിപ്പിക്കുന്നു. ‘അവകാശഭൂമി’ ഈ ഭൂമിസംബന്ധമായ പ്രത്യേകത സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: യോവേൽനിയമത്തിലെ אֲחֻזָּהയുടെ സ്വഭാവം
  choice: അവകാശഭൂമി
  alternative: സ്വത്ത്; കൈവശഭൂമി; പാരമ്പര്യസ്വത്ത്
  rationale: ഇത് ഏതൊരു സ്വത്തും എന്നതിലുപരി ഇസ്രായേലിലെ കുടുംബ-ഗോത്ര ഭൂവിതരണവുമായി ബന്ധപ്പെട്ട ഭൂവുടമസ്ഥതയാണ്. ‘അവകാശഭൂമി’ ആ നിയമപരവും ഉടമ്പടിപരവുമായ പശ്ചാത്തലം സൂചിപ്പിക്കുന്നു; എന്നാൽ അത് എങ്ങനെയാണ് ലഭിച്ചതെന്ന വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശശൈലി ഉപയോഗിച്ചു. ദീർഘമായ ഹീബ്രായ വാക്യക്രമം നിലനിർത്തിയെങ്കിലും, നടപടികളുടെ അനുക്രമം വ്യക്തമാക്കാൻ ‘അപ്പോൾ’, ‘പിന്നെ’ എന്നിവ ചേർത്തു. സാമ്പത്തികവും ഭൂവുടമസ്ഥതാസംബന്ധവുമായ സൂക്ഷ്മതകൾ പ്രധാനവാക്യം ഭാരപ്പെടുത്താതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
