    rationale: הַגָּרִים עִמָּךְ is a plural participial phrase with singular "with you." "അതായത്" is not present in the source and makes the clause an explanatory restatement rather than a modifier; "നിങ്ങളോടൊപ്പം" changes the singular suffix.
