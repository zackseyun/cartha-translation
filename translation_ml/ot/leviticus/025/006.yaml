source:
  edition: WLC
  text: וְ֠/הָיְתָה שַׁבַּ֨ת הָ/אָ֤רֶץ לָ/כֶם֙ לְ/אָכְלָ֔ה לְ/ךָ֖ וּ/לְ/עַבְדְּ/ךָ֣ וְ/לַ/אֲמָתֶ֑/ךָ וְ/לִ/שְׂכִֽירְ/ךָ֙ וּ/לְ/תוֹשָׁ֣בְ/ךָ֔ הַ/גָּרִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male servant, for your female servant, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: ml
  text: ദേശത്തിന്റെ ശബ്ബത്ത്‌വിളവ്[a] നിങ്ങൾക്കു ഭക്ഷണത്തിനായിരിക്കണം—നിനക്കും നിന്റെ പുരുഷ അടിമക്കും നിന്റെ സ്ത്രീ അടിമക്കും, നിന്നോടൊപ്പം താമസിക്കുന്നവരായ നിന്റെ കൂലിവേലക്കാരനും നിന്റെ വിദേശ താമസക്കാരനും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, ‘ദേശത്തിന്റെ ശബ്ബത്ത്.’ ഇവിടെ ദേശം ശബ്ബത്ത്‌വിശ്രമം ആചരിക്കുന്ന വർഷത്തിൽ നൽകുന്ന വിളവിനെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘വിദേശ താമസക്കാരൻ’ എന്നത് സ്വദേശിയല്ലെങ്കിലും ഇസ്രായേല്യരുടെ ഇടയിൽ താമസിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു; ‘പരദേശവാസി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ ‘താമസിക്കുന്നവർ’ ബഹുവചനമായതിനാൽ, അത് കൂലിവേലക്കാരനെയും വിദേശ താമസക്കാരനെയും ഒരുമിച്ച് വിശേഷിപ്പിക്കാം.
    reason: lexical_and_grammatical_ambiguity
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ആയിരിക്കണം
  rationale: നിയമനിർദേശത്തിന്റെ ഭാവി/വിധിസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שַׁבַּת הָאָרֶץ
  choice: ദേശത്തിന്റെ ശബ്ബത്ത്‌വർഷത്തിലെ വിളവ്
  rationale: പദശഃ ‘ദേശത്തിന്റെ ശബ്ബത്ത്’ എന്നാണെങ്കിലും, לְאָכְלָה എന്ന തുടർച്ചയും സന്ദർഭവും ഇവിടെ വിശ്രമവർഷത്തിൽ ലഭിക്കുന്ന ഭക്ഷ്യവിളവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശബ്ബത്ത്‌വർഷം’ സ്ഥാപനപരമായ ബന്ധവും ‘വിളവ്’ സന്ദർഭാർഥവും നിലനിർത്തുന്നു.
- source_word: לָכֶם לְאָכְלָה
  choice: നിങ്ങൾക്ക് ആഹാരമായിരിക്കണം
  rationale: ബഹുവചന അഭിസംബോധനയും ഭക്ഷണത്തിനായുള്ള ഉപയോഗവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְךָ
  choice: നിനക്കും
  rationale: മൂലത്തിലെ ബഹുവചനമായ לָכֶם എന്നതിൽനിന്ന് ഏകവചനമായ לְךָ എന്നതിലേക്കുള്ള മാറ്റം സംരക്ഷിക്കുന്നു.
- source_word: עַבְדְּךָ וְלַאֲמָתֶךָ
  choice: നിന്റെ അടിമയായ പുരുഷനും അടിമയായ സ്ത്രീക്കും
  rationale: ലിംഗവ്യത്യാസവും കൂലിവേലക്കാരനിൽനിന്നുള്ള ബന്ധിത സാമൂഹികസ്ഥാനവ്യത്യാസവും മറച്ചുവയ്ക്കാതെ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׂכִירְךָ
  choice: നിന്റെ കൂലിവേലക്കാരനും
  rationale: കൂലിക്കു ജോലി ചെയ്യുന്ന വ്യക്തിയെ വീട്ടടിമകളിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: תוֹשָׁבְךָ
  choice: നിന്റെ വിദേശതാമസക്കാരനും
  rationale: സ്വദേശിയല്ലെങ്കിലും സമൂഹത്തിനിടയിൽ താമസിക്കുന്ന വ്യക്തി എന്ന സാമൂഹികസ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: הַגָּרִים עִמָּךְ
  choice: അതായത് നിങ്ങളോടൊപ്പം പാർക്കുന്നവർക്കും
  rationale: മസോററ്റിക് രൂപത്തിലെ ബഹുവചനം സംരക്ഷിച്ച്, അടുത്തുള്ള കൂലിവേലക്കാരനെയും വിദേശതാമസക്കാരനെയും ഒരുമിച്ച് വിശേഷിപ്പിക്കാവുന്ന യഥാർഥ വ്യാകരണസാധ്യത തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേൽ നിയമത്തിലെ സേവകത്വപദങ്ങളുടെ വിവർത്തനം
  choice: עבד/אמה എന്നവയെ പുരുഷ-സ്ത്രീ അടിമകളായും שׂכיר എന്നതിനെ കൂലിവേലക്കാരനായും വേർതിരിച്ചു.
  alternative: എല്ലാവരെയും ‘ദാസൻ/ദാസി/വേലക്കാരൻ’ എന്ന പൊതുപദങ്ങളാൽ നൽകുക.
  rationale: മൂലപാഠം വ്യത്യസ്ത സാമൂഹിക-സാമ്പത്തിക വിഭാഗങ്ങളെ വേർതിരിക്കുന്നു; പൊതുപദങ്ങൾ ഉപയോഗിക്കുന്നത് ആ വ്യത്യാസം മങ്ങിച്ചുകളയും.
- issue: הַגָּרִים עִמָּךְ എന്ന ബഹുവചനവിശേഷണത്തിന്റെ ബന്ധം
  choice: ‘നിങ്ങളോടൊപ്പം പാർക്കുന്നവർ’ എന്നു ബഹുവചനത്തിൽ നൽകി, കൂലിവേലക്കാരനെയും വിദേശതാമസക്കാരനെയും ഉൾക്കൊള്ളാനുള്ള സാധ്യത നിലനിർത്തി.
  alternative: വിദേശതാമസക്കാരനെ മാത്രം സൂചിപ്പിക്കുന്ന ഏകവചനമായി ‘നിന്നോടൊപ്പം പാർക്കുന്നവൻ’ എന്നു നൽകുക.
  rationale: ലഭ്യമായ WLC പാഠത്തിൽ הַגָּרִים ബഹുവചനമാണ്; അതിനെ ഏകവചനമാക്കുന്നത് വ്യാകരണത്തിലെ യഥാർഥ പിരിമുറുക്കം നിശ്ശബ്ദമായി പരിഹരിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമഭാഷ ഉപയോഗിച്ചു. ‘ശബ്ബത്ത്‌വർഷം,’ ‘കൂലിവേലക്കാരൻ,’ ‘വിദേശതാമസക്കാരൻ’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ തിരഞ്ഞെടുക്കപ്പെട്ടു. മൂലത്തിലെ നിങ്ങൾ/നീ എന്ന സംഖ്യാമാറ്റവും അവസാന വിശേഷണത്തിലെ ബഹുവചനവും നിലനിർത്തി.
