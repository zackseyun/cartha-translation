  edition: WLC
  text: וְ/הִתְנַחֲלְתֶּ֨ם אֹתָ֜/ם לִ/בְנֵי/כֶ֤ם אַחֲרֵי/כֶם֙ לָ/רֶ֣שֶׁת אֲחֻזָּ֔ה לְ/עֹלָ֖ם בָּ/הֶ֣ם תַּעֲבֹ֑דוּ וּ/בְ/אַ֨חֵי/כֶ֤ם בְּנֵֽי יִשְׂרָאֵל֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָֽרֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: ml
  text: നിങ്ങളുടെ കാലശേഷം, അവരെ സ്ഥിരമായ കൈവശസ്വത്തായി അവകാശമാക്കേണ്ടതിന് നിങ്ങളുടെ പുത്രന്മാർക്കു അവകാശമായി കൈമാറാം[a]. അവരെക്കൊണ്ട് നിങ്ങൾക്ക് വേല ചെയ്യിക്കാം. എന്നാൽ നിങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കളുടെ കാര്യത്തിൽ[b], ഒരാൾ തന്റെ സഹോദരന്റെമേൽ കഠിനമായി ആധിപത്യം നടത്തരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘നിങ്ങളുടെ കാലശേഷം നിങ്ങളുടെ പുത്രന്മാർക്കു അവരെ പാരമ്പര്യസ്വത്തായി കൈമാറാം.’'
    reason: lexical_alternative
  - marker: b
    text: ‘സഹോദരന്മാർ’, ‘ഇസ്രായേൽമക്കൾ’ എന്നിവ എബ്രായത്തിലെ പുല്ലിംഗ ബന്ധുത്വപദങ്ങളെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; സഹഇസ്രായേല്യരെ ഉടമ്പടിബന്ധത്തിലുള്ള സ്വജനങ്ങളായാണ് ഈ നിയമം അവതരിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: അവകാശമായി കൈമാറാം
  rationale: നחל എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം ഇവിടെ തലമുറകളിലേക്കു പാരമ്പര്യസ്വത്തായി കൈമാറുക എന്ന നിയമപരമായ ആശയം വഹിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: നിങ്ങളുടെ കാലശേഷം നിങ്ങളുടെ പുത്രന്മാർക്ക്
  rationale: בנים എന്ന പുല്ലിംഗ പദത്തെ ‘പുത്രന്മാർ’ എന്നു നേരിട്ട് നിലനിർത്തുകയും אַחֲרֵיכֶם എന്നത് അവകാശിയുടെ മരണശേഷമുള്ള കൈമാറ്റമെന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: കൈവശസ്വത്തായി അവർക്ക് അവരെ അവകാശമാക്കാം
  rationale: ירש എന്ന അവകാശപ്പെടുത്തൽ ആശയവും אֲחֻזָּה എന്ന നിയമപരമായ കൈവശസ്വത്ത് ആശയവും രണ്ടും നിലനിർത്തുന്നു.
- source_word: לְעֹלָם
  choice: ശാശ്വതമായ
  rationale: ഈ നിയമസന്ദർഭത്തിൽ തുടർന്നുനിൽക്കുന്ന അഥവാ സ്ഥിരമായ ഉടമസ്ഥാവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിഭൗതികമായ നിത്യത നിർബന്ധമായി ആരോപിക്കാതെ പദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: അവരെക്കൊണ്ട് നിങ്ങൾക്ക് വേല ചെയ്യിക്കാം
  rationale: ഇവിടെ עבד സ്വമേധയാ ചെയ്യുന്ന സാധാരണ സേവനമല്ല, കൈവശസ്വത്തായി കണക്കാക്കപ്പെട്ടവരിൽനിന്ന് ആവശ്യപ്പെടുന്ന വേലയാണ്; ഈ സാമൂഹിക യാഥാർഥ്യം മൃദൂകരിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു.
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: എന്നാൽ നിങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കളുടെ കാര്യത്തിൽ
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യവും ഉടമ്പടിസമൂഹത്തിലെ ബന്ധുത്വം സൂചിപ്പിക്കുന്ന ‘സഹോദരന്മാർ’, ‘ഇസ്രായേൽമക്കൾ’ എന്നീ രണ്ടു ഘടകങ്ങളും സംരക്ഷിക്കുന്നു.
- source_word: אִישׁ בְּאָחִיו
  choice: നിങ്ങളിൽ ആരും തന്റെ സഹോദരന്റെമേൽ
  rationale: ഓരോ വ്യക്തിയും തന്റെ സഹോദരനോടുള്ള ബന്ധത്തിൽ പാലിക്കേണ്ട വിലക്ക് എന്ന വിതരണാത്മക ഘടന സ്വാഭാവിക മലയാള നിയമശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לֹא תִרְדֶּה בוֹ
  choice: ആധിപത്യം നടത്തരുത്
  rationale: רדה എന്നത് ഭരിക്കുക, അധീശത്വം പ്രയോഗിക്കുക എന്ന അർഥം വഹിക്കുന്നു; ‘ആധിപത്യം നടത്തുക’ അധികാരപ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: בְּפָרֶךְ
  choice: കഠിനമായി
  rationale: നിർബന്ധിതവേലയുടെ പശ്ചാത്തലത്തിൽ ക്രൂരമായ കാഠിന്യം സൂചിപ്പിക്കുന്ന പദത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേല്യ സാമൂഹികനിയമത്തിലെ ബന്ധുത്വഭാഷ
  choice: ‘സഹോദരന്മാർ’, ‘ഇസ്രായേൽമക്കൾ’ എന്നീ പുല്ലിംഗ ബന്ധുത്വപദങ്ങൾ നിലനിർത്തി.
  alternative: ‘സഹഇസ്രായേല്യർ’ അല്ലെങ്കിൽ ‘സ്വജനങ്ങൾ’ എന്നു ലിംഗനിരപേക്ഷമായി ചുരുക്കുക.
  rationale: എബ്രായപാഠം ഉടമ്പടിബന്ധത്തെ വ്യക്തമായ പുല്ലിംഗ ബന്ധുത്വഭാഷയിലൂടെയാണ് അവതരിപ്പിക്കുന്നത്; അതിനാൽ അതിനെ പൊതുവൽക്കരിച്ച് മായ്ച്ചുകളയാതെ പാഠത്തിന്റെ രൂപവും സാമൂഹിക പശ്ചാത്തലവും സംരക്ഷിച്ചു.
- issue: അടിമത്തം, ഉടമസ്ഥത, നിർബന്ധിതവേല എന്നിവയുടെ ഭാഷ എത്ര നേരിട്ട് നൽകണം
  choice: പാരമ്പര്യ കൈവശസ്വത്തിന്റെയും വേല ചെയ്യിക്കുന്നതിന്റെയും ഭാഷ മൃദൂകരിക്കാതെ നൽകി.
  alternative: ‘സേവകർ’, ‘സേവനം ഉപയോഗിക്കുക’ തുടങ്ങിയ ഉടമസ്ഥതയുടെ ശക്തി കുറയ്ക്കുന്ന ഭാഷ ഉപയോഗിക്കുക.
  rationale: പാഠം മനുഷ്യരെ പാരമ്പര്യസ്വത്തായി കൈമാറുന്നതും അവരിൽനിന്ന് വേല ആവശ്യപ്പെടുന്നതും തുറന്നുപറയുന്നു. അതിന്റെ നിയമപരവും ധാർമികവുമായ സംഘർഷം വിവർത്തനം മറച്ചുവയ്ക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ നിയമശൈലി. ‘കൈവശസ്വത്ത്’, ‘ആധിപത്യം’ എന്നിവ പാഠത്തിന്റെ നിയമപരവും കഠിനവുമായ സ്വഭാവം നിലനിർത്തുന്നു; അതേസമയം അനാവശ്യമായ സാങ്കേതികത ഒഴിവാക്കിയിരിക്കുന്നു.
