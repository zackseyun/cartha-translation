  rationale: 'The revision clarifies the Hebrew purpose/inheritance construction: the persons are passed on to the sons so that they may inherit them as a permanent possession. It also replaces an overly absolute rendering of לְעֹלָם and improves the alternative footnote’s modern Malayalam idiom, without softening the text’s hereditary-property or compelled-labor language.'
  reviewer_model: gpt-5.6-terra
