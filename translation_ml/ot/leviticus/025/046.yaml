revisions:
- from: നിങ്ങളുടെ കാലശേഷം നിങ്ങളുടെ പുത്രന്മാർക്ക് അവരെ അവകാശമായി കൈമാറാം[a]; ശാശ്വതമായ കൈവശസ്വത്തായി അവർക്ക് അവരെ അവകാശമാക്കാം. അവരെക്കൊണ്ട് നിങ്ങൾക്ക് വേല ചെയ്യിക്കാം. എന്നാൽ നിങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കളുടെ കാര്യത്തിൽ[b], നിങ്ങളിൽ ആരും തന്റെ സഹോദരന്റെമേൽ കഠിനമായി ആധിപത്യം നടത്തരുത്.
