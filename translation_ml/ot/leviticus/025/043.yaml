translation:
  language: ml
  text: അവന്റെമേൽ കാഠിന്യത്തോടെ[a] ആധിപത്യം ചെലുത്തരുത്; നിന്റെ ദൈവത്തെ ഭയപ്പെടുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിഷ്ഠുരമായി,” “കഠോരമായി.” എബ്രായപദം കഠിനവും ഞെരുക്കുന്നതുമായ പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה בּוֹ
  choice: അവനോട് … അധികാരം പ്രയോഗിക്കരുത്
  rationale: רדה എന്ന ക്രിയ അധികാരം ചെലുത്തുക, ഭരിക്കുക എന്ന ആശയം നൽകുന്നു. ഇവിടെ കടപ്പാടുമൂലം സേവിക്കുന്ന സഹഇസ്രായേല്യനോടുള്ള അധികാരപ്രയോഗമാണ് സന്ദർഭം; അതിനാൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അവനോട് അധികാരം പ്രയോഗിക്കുക’ എന്നു നൽകി ബന്ധത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: בְּפָרֶךְ
  choice: കഠിനമായി
  rationale: പദം കഠിനവും ഞെരുക്കുന്നതുമായ പെരുമാറ്റത്തെയോ അധ്വാനത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കഠിനമായി’ എന്നത് ഇവിടെ സ്വാഭാവികവും അർത്ഥസമൃദ്ധവുമാണ്; കൂടുതൽ ശക്തമായ ‘നിഷ്കരുണമായി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְיָרֵאתָ
  choice: ഭയപ്പെടണം
  rationale: രൂപപരമായി ‘നീ ഭയപ്പെടണം’ എന്നതാണ്. മുൻനിഷേധത്തോടുള്ള നൈതിക പ്രതികരണമാണ് ഈ കല്പന. മലയാളത്തിലെ അർദ്ധവിരാമം ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ അധികമായി ‘എന്നാൽ’ ചേർത്തിട്ടില്ല.
- source_word: מֵאֱלֹהֶיךָ
  choice: നിന്റെ ദൈവത്തെ
  rationale: ירא എന്ന ക്രിയയോടുകൂടിയ מִן ഭയത്തിന്റെ വിഷയത്തെ അടയാളപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിന്റെ ദൈവത്തെ ഭയപ്പെടുക’ എന്നു വരുന്നു; ഉടമസ്ഥസർവനാമം നിലനിർത്തിയിരിക്കുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിന്റെ നൈതിക പ്രേരണ
  choice: കഠിനമായ അധികാരപ്രയോഗം വിലക്കുന്ന കല്പനയ്ക്കു പിന്നാലെ ദൈവഭയം ആവശ്യപ്പെടുന്ന ബന്ധം നിലനിർത്തി.
  alternative: ‘എന്നാൽ നിന്റെ ദൈവത്തെ ഭയപ്പെടണം’ എന്നു വ്യക്തമായ വൈരുധ്യസംയോജകം ചേർക്കാം; അല്ലെങ്കിൽ രൂപപരമായി ‘നിന്റെ ദൈവത്തെ ഭയപ്പെടുകയും വേണം’ എന്നു നൽകാം.
  rationale: וְ എന്നത് രൂപപരമായി ‘കൂടാതെ/ഉം’ ആണെങ്കിലും സന്ദർഭത്തിൽ ദൈവഭയം സാമൂഹിക അധികാരത്തെ നിയന്ത്രിക്കുന്ന നൈതിക അടിസ്ഥാനമായി പ്രവർത്തിക്കുന്നു. അർദ്ധവിരാമം ഈ ബന്ധം പ്രകടമാക്കുന്നു; മൂലപാഠത്തിലുള്ളതിലധികം വൈരുധ്യം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ. ഏകവചന പുരുഷസൂചനയായ ‘അവനോട്’യും ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ’യും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
