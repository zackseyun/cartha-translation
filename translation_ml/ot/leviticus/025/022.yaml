source:
  edition: WLC
  text: וּ/זְרַעְתֶּ֗ם אֵ֚ת הַ/שָּׁנָ֣ה הַ/שְּׁמִינִ֔ת וַ/אֲכַלְתֶּ֖ם מִן הַ/תְּבוּאָ֣ה יָשָׁ֑ן עַ֣ד הַ/שָּׁנָ֣ה הַ/תְּשִׁיעִ֗ת עַד בּוֹא֙ תְּב֣וּאָתָ֔/הּ תֹּאכְל֖וּ יָשָֽׁן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: ml
  text: എട്ടാം വർഷത്തിൽ നിങ്ങൾ വിതയ്ക്കുകയും പഴയ വിളവിൽനിന്ന് ഭക്ഷിക്കുകയും വേണം; ഒമ്പതാം വർഷം വരെ. ഒമ്പതാം വർഷത്തിലെ വിളവ് വന്നുചേരുന്നതുവരെ നിങ്ങൾ പഴയത്[a] ഭക്ഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പഴയ വിളവ്.” ഇവിടെ എബ്രായത്തിൽ “പഴയത്” എന്നുമാത്രമാണ്; “വിളവ്” എന്നത് സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: നിങ്ങൾ വിതയ്ക്കുകയും വേണം
  rationale: നിയമനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ക്രിയയ്ക്കുള്ള ഭാവി/നിർദേശാത്മക ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַשָּׁנָה הַשְּׁמִינִת
  choice: എട്ടാം വർഷത്തിൽ
  rationale: നിശ്ചിതമായ ക്രമസംഖ്യാ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וַאֲכַלְתֶּם מִן הַתְּבוּאָה יָשָׁן
  choice: പഴയ വിളവിൽനിന്നു ഭക്ഷിക്കുകയും വേണം
  rationale: תְּבוּאָה കാർഷിക വിളവിനെയും יָשָׁן മുൻവിളവിൽനിന്നു ശേഷിച്ച പഴയ സംഭരണത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: ഒമ്പതാം വർഷംവരെ
  rationale: കാലപരിധി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: ആ വർഷത്തെ വിളവ് വന്നുചേരുന്നതുവരെ
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം തൊട്ടുമുമ്പുള്ള ‘ഒമ്പതാം വർഷം’ എന്നതിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; בּוֹא എന്ന ‘വരുക’ എന്ന ആശയം ‘വന്നുചേരുക’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: תֹּאכְלוּ יָשָׁן
  choice: നിങ്ങൾ പഴയതു ഭക്ഷിക്കണം
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ ‘പഴയത്’ എന്ന ആവർത്തനം നിലനിർത്തുന്നു; ഉദ്ദേശിക്കുന്നത് പഴയ വിളവാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
