translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമനിർദേശത്തിന്റെ ഭാവം ‘വേണം/ഭക്ഷിക്കണം’ എന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു; എബ്രായത്തിലെ ആവർത്തനവും ഒമ്പതാം വർഷത്തോടുള്ള സർവനാമബന്ധവും സംരക്ഷിച്ചിരിക്കുന്നു.
