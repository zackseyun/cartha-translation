revisions:
- from: അവൻ വിൽക്കപ്പെട്ടശേഷം, അവനെ വീണ്ടെടുക്കാം; അവന്റെ സഹോദരന്മാരിൽ ഒരാൾ[a] അവനെ വീണ്ടെടുക്കാം.
  to: അവൻ വിൽക്കപ്പെട്ട ശേഷം, അവന് വീണ്ടെടുപ്പ് ലഭ്യമായിരിക്കും; അവന്റെ സഹോദരന്മാരിൽ ഒരാൾക്ക് അവനെ വീണ്ടെടുക്കാം.
  rationale: The revision gives the first clause a formal nominal rendering that directly reflects “redemption shall be available to him,” while retaining «വീണ്ടെടുക്കുക» for the brother's redeeming action. It preserves the Hebrew's masculine kinship term, legal-permissive force, and the English audit trail's distinction between redemption's availability and its exercise.
