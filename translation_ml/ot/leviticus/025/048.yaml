id: LEV.25.48
reference: Leviticus 25:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַחֲרֵ֣י נִמְכַּ֔ר גְּאֻלָּ֖ה תִּהְיֶה לּ֑/וֹ אֶחָ֥ד מֵ/אֶחָ֖י/ו יִגְאָלֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: ml
  text: അവൻ വിൽക്കപ്പെട്ട ശേഷം, അവന് വീണ്ടെടുപ്പ് ലഭ്യമായിരിക്കും; അവന്റെ സഹോദരന്മാരിൽ ഒരാൾക്ക് അവനെ വീണ്ടെടുക്കാം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי
  choice: ശേഷം
  rationale: തുടർന്നുവരുന്ന നിയമവ്യവസ്ഥ ബാധകമാകുന്ന സമയം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: נִמְכַּר
  choice: വിൽക്കപ്പെട്ട
  rationale: מכר എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള കർമണിപ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: അവനെ വീണ്ടെടുക്കാം
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന് വീണ്ടെടുപ്പ് ഉണ്ടായിരിക്കും’ എന്ന നിയമപരമായ ലഭ്യതയെയാണ് ഈ നാമപദ-അസ്തിത്വഘടന സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി കർമണിസാധ്യതയായി നൽകി.
- source_word: אֶחָד מֵאֶחָיו
  choice: അവന്റെ സഹോദരന്മാരിൽ ഒരാൾ
  rationale: ‘അവന്റെ സഹോദരന്മാരിൽനിന്ന് ഒരാൾ’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ പുരുഷലിംഗ ബന്ധുത്വസൂചന നിലനിർത്തുന്നു.
- source_word: יִגְאָלֶנּוּ
  choice: അവനെ വീണ്ടെടുക്കാം
  rationale: גאל എന്ന ബന്ധുത്വ-വീണ്ടെടുപ്പ് ക്രിയയുടെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ പ്രതിധ്വനി ‘വീണ്ടെടുക്കുക’ നിലനിർത്തുന്നു; ഇവിടെ വ്യവസ്ഥ അനുവദിക്കുന്ന സാധ്യതയാണ് ‘ആം’ സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: אֶחָיו എന്ന ബന്ധുത്വപദത്തിന്റെ പരിഭാഷ
  choice: അവന്റെ സഹോദരന്മാർ
  alternative: അവന്റെ പുരുഷബന്ധുക്കൾ / ബന്ധുക്കൾ
  rationale: എബ്രായപദം അക്ഷരാർഥത്തിൽ പുരുഷലിംഗ ബഹുവചനമായ ‘അവന്റെ സഹോദരന്മാർ’ എന്നാണ്. നിയമപരിസരത്തിൽ വീണ്ടെടുപ്പുകാരനായി പ്രവർത്തിക്കുന്ന പുരുഷകുടുംബാംഗത്തെ വിശാലമായി സൂചിപ്പിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: גְּאֻלָּה תִּהְיֶה לּוֹ എന്ന ഘടനയുടെ നിയമപരമായ ബലം
  choice: അവനെ വീണ്ടെടുക്കാം
  alternative: അവന് വീണ്ടെടുപ്പ് ഉണ്ടായിരിക്കും / അവന് വീണ്ടെടുപ്പിന് അവകാശമുണ്ടായിരിക്കും
  rationale: നാമപദരൂപമായ ‘വീണ്ടെടുപ്പ്’ എന്നതും ‘അവന് ഉണ്ടായിരിക്കും’ എന്ന ഘടനയും ചേർന്ന് വീണ്ടെടുപ്പ് ലഭ്യമാണെന്ന നിയമപരമായ സാധ്യത പ്രകടിപ്പിക്കുന്നു. നിർബന്ധം ചുമത്താതെ ഈ സാധ്യത സ്വാഭാവിക മലയാളത്തിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ നിയമപരവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘വീണ്ടെടുക്കുക’ എന്ന പദം ബന്ധുത്വ-വീണ്ടെടുപ്പിന്റെ ആശയം നിലനിർത്തുന്നു; വാക്യത്തിലെ ആവർത്തനം മൂലപാഠത്തിന്റെ ഘടന പിന്തുടരുന്നു.
