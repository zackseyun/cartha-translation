language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְ/פִ֣י רֹ֣ב הַ/שָּׁנִ֗ים תַּרְבֶּה֙ מִקְנָת֔/וֹ וּ/לְ/פִי֙ מְעֹ֣ט הַ/שָּׁנִ֔ים תַּמְעִ֖יט מִקְנָת֑/וֹ כִּ֚י מִסְפַּ֣ר תְּבוּאֹ֔ת ה֥וּא מֹכֵ֖ר לָֽ/ךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: ml
  text: വർഷങ്ങൾ കൂടുതലാണെങ്കിൽ അതിനനുസരിച്ച് വാങ്ങൽവില കൂട്ടണം; വർഷങ്ങൾ കുറവാണെങ്കിൽ അതിനനുസരിച്ച് വാങ്ങൽവില കുറയ്ക്കണം. കാരണം, അവൻ നിനക്കു വിൽക്കുന്നത് വിളവുകളുടെ എണ്ണമാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിളവുകൾ’ എന്നതിനുള്ള എബ്രായപദം ‘വിളകൾ,’ ‘ഉൽപ്പന്നം,’ അല്ലെങ്കിൽ ‘വിളവെടുപ്പുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי
  choice: അതിന് അനുസരിച്ച്
  rationale: എണ്ണത്തിനനുസരിച്ചുള്ള ആനുപാതിക ബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: רֹב הַשָּׁנִים / מְעֹט הַשָּׁנִים
  choice: വർഷങ്ങൾ കൂടുതലാണെങ്കിൽ / വർഷങ്ങൾ കുറവാണെങ്കിൽ
  rationale: യൂബിലിവരെ ശേഷിക്കുന്ന വർഷങ്ങളുടെ കൂടുതലും കുറവും തമ്മിലുള്ള നിയമപരമായ താരതമ്യം ലളിതവും സമമിതവുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: תַּרְבֶּה / תַּמְעִיט
  choice: കൂട്ടണം / കുറയ്ക്കണം
  rationale: വാങ്ങൽവില മേലോട്ടോ കീഴോട്ടോ ക്രമീകരിക്കണമെന്ന ഹിഫിൽ രൂപങ്ങളുടെ കാരക അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מִקְנָתוֹ
  choice: വാങ്ങൽവില
  rationale: വർഷങ്ങളുടെയും വിളവുകളുടെയും എണ്ണമനുസരിച്ച് മൂല്യം കണക്കാക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘വാങ്ങൽവില’ എന്നത് ഇടപാടുസംബന്ധമായ അർഥം ഏറ്റവും വ്യക്തമായി നൽകുന്നു.
- source_word: מִסְפַּר תְּבוּאֹת
  choice: ഒരു നിശ്ചിത എണ്ണം വിളവുകൾ
  rationale: വിൽക്കപ്പെടുന്നത് ഭൂമിയുടെ ശാശ്വത ഉടമസ്ഥതയല്ല, ലഭിക്കാനിരിക്കുന്ന വിളവുകളുടെ എണ്ണത്തോട് ബന്ധപ്പെട്ട അവകാശമാണെന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘വിളവുകൾ’ എന്ന പദത്തിന്റെ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הוּא מֹכֵר לָךְ
  choice: അവൻ നിനക്കു വിൽക്കുന്നത്
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചന കർത്താവിനെയും രണ്ടാംപുരുഷ ഏകവചന സ്വീകർത്താവിനെയും നിലനിർത്തിക്കൊണ്ട് വാക്യത്തിന്റെ വിശദീകരണാത്മക ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ നിയമനിർദേശ ശൈലി. ഹീബ്രുവിലെ ഏകവചന അഭിസംബോധന ‘നിനക്കു’ എന്നു നിലനിർത്തിയിരിക്കുന്നു.
