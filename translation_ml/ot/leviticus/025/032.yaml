  rationale: സംയോജകവും നാമവും ചേർന്ന് നിയമചർച്ചയിലെ പുതിയ വിഷയത്തെ അവതരിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആ വിഷയമാറ്റം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
