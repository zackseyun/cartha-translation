  choice: ലേവ്യർക്ക്
  rationale: വീണ്ടെടുപ്പവകാശം ആർക്കാണ് ഉള്ളതെന്നു ലാമെദ് സൂചിപ്പിക്കുന്നു; ദാതൃവിഭക്തി അതിന്റെ നിയമപരമായ ഉടമസ്ഥത നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ലേവ്യരുടെ പട്ടണങ്ങളിലെ വീടുകളെ സംബന്ധിച്ച വീണ്ടെടുപ്പുവ്യവസ്ഥയുടെ നിയമബലം
  choice: ഈ വാക്യം ലേവ്യർക്ക് തങ്ങളുടെ പട്ടണങ്ങളിലെ വീടുകൾ വീണ്ടെടുക്കാനുള്ള നിലനിൽക്കുന്ന അവകാശം നൽകുന്നു.
  alternative: ‘ശാശ്വതമായ വീണ്ടെടുപ്പ് ലേവ്യർക്കുണ്ടായിരിക്കും’ എന്ന കൂടുതൽ രൂപനിഷ്ഠമായ പരിഭാഷ.
  rationale: גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם എന്ന നാമപ്രയോഗം ലേവ്യർക്കുള്ള തുടർച്ചയായ വീണ്ടെടുപ്പവകാശം സ്ഥാപിക്കുന്നു. മുഖ്യപാഠം അതിന്റെ നിയമബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; രൂപനിഷ്ഠമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ‘വീണ്ടെടുക്കാനുള്ള അവകാശം’ എന്ന പ്രയോഗം മൂലഹീബ്രുവിലെ നാമഘടനയെയും നിയമബലത്തെയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
