  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: ml
  text: ലേവ്യരുടെ പട്ടണങ്ങളെ സംബന്ധിച്ചിടത്തോളം, അവരുടെ ഉടമസ്ഥതയിലുള്ള പട്ടണങ്ങളിലെ വീടുകൾ വീണ്ടെടുക്കുന്നതിനുള്ള അവകാശം ലേവ്യർക്കു എക്കാലത്തേക്കും ഉണ്ടായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “എക്കാലത്തേക്കുള്ള വീണ്ടെടുപ്പവകാശം ലേവ്യർക്കുണ്ടായിരിക്കും.”'
    reason: lexical_alternative
