  rationale: തുടർന്നുള്ള ‘ഉണ്ടായിരിക്കും’ എന്ന ക്രിയയോടൊപ്പം ഈ നാമം ഒരു നിലനിൽക്കുന്ന നിയമാവകാശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ നാമരൂപം നിലനിർത്തുന്നത് മൂലവാക്യത്തിന്റെ നിയമസ്വഭാവം വ്യക്തമായി നൽകുന്നു.
