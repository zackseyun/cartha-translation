id: LEV.25.42
reference: Leviticus 25:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my servants[a], whom I brought out from the land of Egypt[b]; they shall not be sold as servants are sold.
translation:
  language: ml
  text: കാരണം, അവർ ഈജിപ്തുദേശത്തുനിന്ന് ഞാൻ പുറത്തുകൊണ്ടുവന്ന എന്റെ അടിമകളാണ്[a]; അവരെ ഒരു അടിമയെ വിൽക്കുന്നതുപോലെ വിൽക്കരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ ദാസന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഹീബ്രുപദം ഉടമസ്ഥതയും ബന്ധിതാവസ്ഥയും ഊന്നുന്നതിനാൽ ‘അടിമകൾ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഒരു അടിമയുടെ വിൽപ്പനയായി അവർ വിൽക്കപ്പെടരുത്’; അതായത്, സാധാരണ അടിമവിൽപ്പനയുടെ രീതിയിൽ അവരെ വിൽക്കരുത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള നിയമത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ഹീബ്രു ബന്ധകത്തിന്റെ വിശദീകരണബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֲבָדַי הֵם
  choice: അവർ എന്റെ അടിമകളാണ്
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ עֶבֶד എന്ന പദവും ഊന്നൽ നൽകുന്ന הֵם എന്ന സർവനാമവും പ്രതിഫലിപ്പിക്കുന്നു. ഇവിടെ ബന്ധിതാവസ്ഥയും യഹോവയുടെ ഉടമസ്ഥതയും നിയമത്തിന്റെ അടിസ്ഥാനമായതിനാൽ ‘അടിമകൾ’ എന്നത് ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ പ്രസക്തമാണ്.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: ഞാൻ പുറപ്പെടുവിച്ചവർ
  rationale: പുറപ്പാടിനെ സൂചിപ്പിക്കുന്ന പതിവ് ഹീബ്രു പ്രയോഗം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ബന്ധവാക്യത്തിന്റെ വ്യക്തിസൂചനയും നിലനിർത്തുന്നു.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: ഭൂമിശാസ്ത്രപരമായ ഹീബ്രു പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: לֹא יִמָּכְרוּ
  choice: അവരെ വിൽക്കരുത്
  rationale: നിയമപരമായ നിരോധനം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു. ഹീബ്രുവിലെ നിഷ്ക്രിയരൂപം പദാനുപദമായി പകർത്തുന്നതിനേക്കാൾ ഈ രൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്; അർത്ഥം മാറുന്നില്ല.
- source_word: מִמְכֶּרֶת עָבֶד
  choice: അടിമകളെ വിൽക്കുന്ന രീതിയിൽ
  rationale: ഒരു സാധാരണ അടിമവിൽപ്പനയുടെ രീതിയിലോ ഇടപാടായോ അവരെ വിൽക്കരുതെന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ഹീബ്രുവിന്റെ അപൂർവമായ നാമപ്രയോഗം പദാനുപദമായി കാഠിന്യമാക്കുന്നില്ല.
theological_decisions:
- issue: עֶבֶד / עֲבָדַי എന്ന പദം യിസ്രായേലിനെ ദൈവത്തിന്റേതായി അവതരിപ്പിക്കുന്ന സാഹചര്യത്തിൽ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: ഈ വാക്യത്തിൽ പുറപ്പാടിലൂടെ അവർ യഹോവയ്ക്കുള്ളവരായതിനാൽ മനുഷ്യരുടെ സാധാരണ അടിമസ്വത്തായി വിൽക്കപ്പെടരുത് എന്ന സാമൂഹിക-നിയമപരമായ വൈരുധ്യമാണ് പ്രധാനം. അതുകൊണ്ട് ബന്ധിതാവസ്ഥയെ മൃദൂകരിക്കാത്ത ‘അടിമകൾ’ സ്വീകരിച്ചു; ഇതിലൂടെ പിൽക്കാല അടിമത്തക്രമങ്ങളോ പ്രത്യേക സഭാപരമായ വ്യാഖ്യാനങ്ങളോ വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ആദ്യവാക്യത്തിലെ ഊന്നലും അവസാന നിരോധനത്തിലെ സാമൂഹിക-നിയമപരമായ ശക്തിയും നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി.
