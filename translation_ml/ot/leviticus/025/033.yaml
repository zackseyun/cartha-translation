  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: ml
  text: ലേവ്യരിൽ ഒരാൾ അതു വീണ്ടെടുത്താലും, അവന്റെ അവകാശനഗരത്തിലുള്ള വീടിന്റെ വിൽപ്പന യോബേൽവർഷത്തിൽ ഒഴിഞ്ഞുപോകണം[a]; കാരണം, ലേവ്യരുടെ നഗരങ്ങളിലെ വീടുകൾ ഇസ്രായേൽമക്കളുടെ ഇടയിൽ അവർക്കുള്ള അവകാശസ്വത്താണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം ‘പുറപ്പെട്ടുപോകണം.’ അതായത്, വിറ്റ വീട് വാങ്ങിയവന്റെ കൈവശത്തിൽനിന്ന് ഒഴിഞ്ഞ് യഥാർഥ അവകാശത്തിലേക്കു മടങ്ങണം. ‘വീടിന്റെ വിൽപ്പന’ എന്നതിന് ‘വിറ്റ വീട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇസ്രായേൽമക്കൾ’ എന്നത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവായ ഉടമ്പടിപദപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: ലേവ്യരിൽ ഒരാൾ അതു വീണ്ടെടുത്താലും
  rationale: מן എന്നത് ഇവിടെ ഭാഗസൂചകമായി എടുത്ത് ‘ലേവ്യരിൽ ഒരാൾ’ എന്നു പരിഭാഷപ്പെടുത്തി. גאל എന്ന നിയമപരമായ പദത്തിന് ‘വീണ്ടെടുക്കുക’ എന്ന സാങ്കേതിക അർഥം നിലനിർത്തി. തുടർന്നുള്ള നിയമഫലവുമായി പൊരുത്തപ്പെടാൻ നിബന്ധനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: וְיָצָא
  choice: ഒഴിഞ്ഞുപോകണം
  rationale: അക്ഷരാർഥം ‘പുറപ്പെട്ടുപോകുക’ എന്നാണ്; യോബേൽനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ വിറ്റ സ്വത്ത് വാങ്ങിയവന്റെ കൈവശത്തിൽനിന്ന് വിടുന്നതാണ് സൂചന. നിയമപരമായ നിർബന്ധഭാവം മലയാളത്തിൽ ‘ണം’കൊണ്ട് പ്രകടമാക്കി.
- source_word: מִמְכַּר בַּיִת
  choice: വീടിന്റെ വിൽപ്പന
  rationale: ממכר എന്നത് വിൽപ്പനയെയോ വിറ്റ വസ്തുവിനെയോ സൂചിപ്പിക്കാം. എബ്രായത്തിലെ നാമഘടനയോട് അടുത്തുനിൽക്കാൻ ‘വീടിന്റെ വിൽപ്പന’ എന്നു നൽകി; യഥാർഥത്തിൽ സ്വത്ത് മടങ്ങിവരുന്നതാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: וְעִיר אֲחֻזָּתוֹ
  choice: അവന്റെ അവകാശനഗരത്തിലുള്ള
  rationale: സംക്ഷിപ്തമായ എബ്രായ ഘടനയെ സന്ദർഭാനുസൃതമായി വീടിന്റെ സ്ഥാനസൂചനയായി വായിച്ചു. אחזהയുടെ പാരമ്പര്യ-നിയമപരമായ ആശയം ‘അവകാശ’ എന്നു നിലനിർത്തി.
- source_word: בַּיֹּבֵל
  choice: യോബേൽവർഷത്തിൽ
  rationale: യോബേൽ എന്ന സാങ്കേതിക സ്ഥാപനത്തെ ലിപ്യന്തരണം ചെയ്തു; അത് നിർദിഷ്ട വർഷമാണെന്ന് വായനക്കാർക്ക് വ്യക്തമാക്കാൻ ‘വർഷത്തിൽ’ ചേർത്തു.
- source_word: בָתֵּי עָרֵי הַלְוִיִּם
  choice: ലേവ്യരുടെ നഗരങ്ങളിലെ വീടുകൾ
  rationale: എബ്രായത്തിലെ construct chain സ്വാഭാവികവും അർഥവ്യക്തവുമായ മലയാളത്തിൽ സ്ഥാനബന്ധമായി അവതരിപ്പിച്ചു.
- source_word: הִוא אֲחֻזָּתָם
  choice: അവർക്കുള്ള അവകാശസ്വത്താണ്
  rationale: אחזה സാധാരണ സ്വത്തിനെക്കാൾ നിയമപരവും പാരമ്പര്യപരവുമായ കൈവശാവകാശം സൂചിപ്പിക്കുന്നതിനാൽ ‘അവകാശസ്വത്ത്’ തെരഞ്ഞെടുത്തു.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിൽ
  rationale: בני ישראל എന്ന സ്ഥിരമായ ഉടമ്പടിപദപ്രയോഗം മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകി.
theological_decisions:
- issue: מִן הַלְוִיִּם എന്നതിന്റെ ബന്ധം
  choice: ലേവ്യരിൽ ഒരാൾ
  alternative: ലേവ്യരിൽനിന്ന് വീണ്ടെടുക്കുന്നവൻ
  rationale: מן ഭാഗസൂചകമായി വായിക്കുന്നത് ഈ നിയമവാക്യത്തിൽ ലേവ്യരിൽപ്പെട്ട ഒരാളെയാണ് കർത്താവായി കാണിക്കുന്നത്; ‘ലേവ്യരിൽനിന്ന്’ എന്നു വായിച്ചാൽ വീണ്ടെടുക്കുന്നവനും സ്വത്തിന്റെ ഉടമയും തമ്മിലുള്ള ബന്ധം മറിഞ്ഞുപോകാൻ സാധ്യതയുണ്ട്.
- issue: യോബേലിൽ വീടിന്റെ നിയമസ്ഥിതി
  choice: വിൽപ്പന ഒഴിഞ്ഞുപോകണം
  alternative: വീട് മടങ്ങിവരണം
  rationale: ויצא എന്ന രൂപകത്തിന്റെ നിയമഫലം വ്യക്തമാകുന്ന വിധത്തിൽ, എന്നാൽ മടങ്ങിവരുന്ന കക്ഷിയെ അധികമായി നിർണ്ണയിക്കാതെ, അർഥത്തിലെ സംഘർഷം നിലനിർത്തി.
- issue: בני ישראל എന്ന ഉടമ്പടിപദപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ വംശ-ഉടമ്പടി പ്രയോഗത്തെ പരമ്പരാഗതവും ഇന്നും ഗ്രഹിക്കാവുന്നതുമായ മലയാളരൂപത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമപരമായ ശൈലി പാലിച്ചു. ‘വീണ്ടെടുക്കുക,’ ‘യോബേൽവർഷം,’ ‘അവകാശസ്വത്ത്’ എന്നീ പദങ്ങൾ സാങ്കേതിക ആശയങ്ങൾ നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയാണ്. മുഖ്യവാക്യത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും [a], [b] എന്ന ക്രമത്തിൽ ചേർത്തിട്ടുണ്ട്.
