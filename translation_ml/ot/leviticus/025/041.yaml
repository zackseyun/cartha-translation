  text: וְ/יָצָא֙ מֵֽ/עִמָּ֔/ךְ ה֖וּא וּ/בָנָ֣י/ו עִמּ֑/וֹ וְ/שָׁב֙ אֶל מִשְׁפַּחְתּ֔/וֹ וְ/אֶל אֲחֻזַּ֥ת אֲבֹתָ֖י/ו יָשֽׁוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: ml
  text: അപ്പോൾ അവനും അവനോടുകൂടെ അവന്റെ പുത്രന്മാരും നിന്റെ അടുക്കൽനിന്ന് പുറപ്പെടും. അവൻ തന്റെ ബന്ധുഗണത്തിലേക്ക്[a] മടങ്ങും; തന്റെ പിതാക്കന്മാരുടെ അവകാശസ്വത്തിലേക്ക്[b] മടങ്ങും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തന്റെ കുടുംബത്തിലേക്ക്’; എബ്രായപദത്തിന് അടുത്ത കുടുംബത്തെക്കാൾ വിശാലമായ ഒരു ബന്ധുഗണത്തെയോ കുലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തന്റെ പിതാക്കന്മാരുടെ കൈവശസ്വത്തിലേക്ക്’ അല്ലെങ്കിൽ ‘തന്റെ പൈതൃകസ്വത്തിലേക്ക്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: പുറപ്പെടും
  rationale: നിയമസന്ദർഭത്തിൽ തുടർന്നുണ്ടാകുന്ന ഭാവിക്രിയയെ സൂചിപ്പിക്കുന്നു. ദാസ്യസേവനത്തിൽനിന്നുള്ള മോചനം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നുവെങ്കിലും, എബ്രായത്തിലെ മൂർത്തമായ ‘പുറപ്പെടുക’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: מֵעִמָּךְ
  choice: നിന്റെ അടുക്കൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘നിനക്കൊപ്പമുള്ള ഇടത്തിൽനിന്ന്’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘നിന്റെ സേവനത്തിൽനിന്ന്’ എന്നു വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: അവനും അവനോടുകൂടെ അവന്റെ പുത്രന്മാരും
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ കുടുംബപദം കൃത്യമായി നിലനിർത്തുകയും, പുത്രന്മാരും അവനോടൊപ്പം പുറപ്പെടുന്നു എന്ന ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְשָׁב ... יָשׁוּב
  choice: മടങ്ങും ... മടങ്ങും
  rationale: ശׁוב് എന്ന ക്രിയയുടെ ആവർത്തനം സംരക്ഷിച്ച്, കുടുംബബന്ധത്തിലേക്കും പൈതൃകസ്വത്തിലേക്കുമുള്ള പുനഃസ്ഥാപനത്തിന് എബ്രായം നൽകുന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: מִשְׁפַּחְתּוֹ
  choice: തന്റെ വംശത്തിലേക്ക്
  rationale: ഇവിടെ പദം അടുത്ത കുടുംബത്തെക്കാൾ വിശാലമായ ബന്ധുഗണത്തെയോ കുലത്തെയോ സൂചിപ്പിക്കാം. ‘വംശം’ ആ സാമൂഹിക-നിയമപരമായ വ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരുടെ അവകാശസ്വത്തിലേക്ക്
  rationale: അֲחֻזָּה പാരമ്പര്യമായി കൈവശമുള്ള ഭൂസ്വത്തിനെയോ അവകാശസ്വത്തിനെയോ സൂചിപ്പിക്കുന്നു. ‘അവകാശസ്വത്ത്’ നിയമപരമായ ആശയം വ്യക്തമാക്കുമ്പോൾ ‘പിതാക്കന്മാരുടെ’ എന്ന മൂലഭാഷാപ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുരുഷലിംഗ ബന്ധുത്വഭാഷയുടെ പരിഭാഷ
  choice: അവന്റെ പുത്രന്മാർ ... തന്റെ പിതാക്കന്മാർ
  alternative: അവന്റെ മക്കൾ ... തന്റെ പൂർവികർ
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായ പുരുഷലിംഗ ബഹുവചനങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; പിതൃവംശീയ അവകാശത്തിന്റെ നിയമസന്ദർഭവും പ്രസക്തമായതിനാൽ അവ ലിംഗനിരപേക്ഷമാക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: മോചനത്തിന്റെ സാമൂഹിക-നിയമപരമായ അർഥം
  choice: നിന്റെ അടുക്കൽനിന്ന് പുറപ്പെടും
  alternative: നിന്റെ സേവനത്തിൽനിന്ന് മോചിതനാകും
  rationale: യോബേൽവർഷത്തിലെ കടദാസ്യത്തിൽനിന്നുള്ള മോചനമാണ് സന്ദർഭം. എങ്കിലും മൂലപാഠം ‘പുറപ്പെടുക’ എന്ന ക്രിയയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ നിയമപരമായ നിഗമനം മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച് ചേർക്കാതെ മൂലരൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ ‘മടങ്ങും’ എന്ന ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി; ‘വംശം’ എന്ന പദത്തിന്റെ സാധ്യതയുള്ള അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
