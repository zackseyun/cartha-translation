revisions:
- from: നിങ്ങളോടുകൂടെ താമസിക്കുന്ന പരദേശികളുടെ മക്കളിൽനിന്നും[a], നിങ്ങളോടുകൂടെയുള്ള അവരുടെ കുടുംബങ്ങളിൽനിന്നും—നിങ്ങളുടെ ദേശത്ത് അവർക്കു ജനിച്ചവരിൽനിന്നും—നിങ്ങൾക്കു വാങ്ങാം; അവർ നിങ്ങളുടെ അവകാശസ്വത്തായിരിക്കും.[b]
  to: നിങ്ങളോടുകൂടെ താമസിക്കുന്ന പരദേശികളുടെ മക്കളിൽനിന്നും[a], നിങ്ങളോടുകൂടെയുള്ള അവരുടെ കുടുംബങ്ങളിൽനിന്നും, അവർ നിങ്ങളുടെ ദേശത്ത് ജനിപ്പിച്ചവരിൽനിന്നും നിങ്ങൾക്കു വാങ്ങാം; അവർ നിങ്ങളുടെ കൈവശസ്വത്തായിരിക്കും.[b]
