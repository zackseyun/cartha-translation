  text: וְ֠/גַם מִ/בְּנֵ֨י הַ/תּוֹשָׁבִ֜ים הַ/גָּרִ֤ים עִמָּ/כֶם֙ מֵ/הֶ֣ם תִּקְנ֔וּ וּ/מִ/מִּשְׁפַּחְתָּ/ם֙ אֲשֶׁ֣ר עִמָּ/כֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּ/אַרְצְ/כֶ֑ם וְ/הָי֥וּ לָ/כֶ֖ם לַֽ/אֲחֻזָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: ml
  text: നിങ്ങളോടുകൂടെ താമസിക്കുന്ന പരദേശികളുടെ മക്കളിൽനിന്നും[a], നിങ്ങളോടുകൂടെയുള്ള അവരുടെ കുടുംബങ്ങളിൽനിന്നും, അവർ നിങ്ങളുടെ ദേശത്ത് ജനിപ്പിച്ചവരിൽനിന്നും നിങ്ങൾക്കു വാങ്ങാം; അവർ നിങ്ങളുടെ കൈവശസ്വത്തായിരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിങ്ങളോടുകൂടെ പാർക്കുന്ന അന്യദേശീയരുടെ വംശജരിൽനിന്നും.’'
    reason: ‘മക്കൾ’ എന്നതിന് ഈ നിയമസന്ദർഭത്തിൽ ‘വംശജർ’ എന്ന വിശാലാർഥവും ഉണ്ടാകാം.
  - marker: b
    text: എബ്രായപദം ‘കൈവശസ്വത്ത്’ അഥവാ ‘കൈവശമുള്ള ഉടമസ്ഥത’ എന്നാണ്; തുടർന്നുള്ള വാക്യത്തിൽ ഈ സ്വത്ത് പാരമ്പര്യമായി കൈമാറാമെന്നു വ്യക്തമാക്കുന്നു.
    reason: אֲחֻזָּה ഇവിടെ കൈവശമുള്ള സ്വത്തുസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു; പാരമ്പര്യമായി കൈമാറ്റം ചെയ്യപ്പെടുന്നതു അടുത്ത വാക്യത്തിൽ വ്യക്തമാണ്.
lexical_decisions:
- source_word: וְגַם
  choice: നിന്നും … വാങ്ങാം
  rationale: മുൻവാക്യത്തിലെ അനുമതിയോടു മറ്റൊരു വാങ്ങൽസ്രോതസ്സ് കൂട്ടിച്ചേർക്കുന്നു. ‘വാങ്ങാം’ എന്നത് നിയമപരമായ അനുമതി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִבְּנֵי
  choice: മക്കളിൽനിന്നും
  rationale: בֵּן എന്ന പദത്തിന്റെ ബഹുവചനബന്ധരൂപം അക്ഷരാർഥത്തിൽ ‘മക്കൾ/പുത്രന്മാർ’ എന്നാണ്; ഇവിടെ ഇരുപാലരെയും ഉൾക്കൊള്ളാവുന്ന വംശജരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മക്കൾ’ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമാണ്.
- source_word: הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: നിങ്ങളോടുകൂടെ താമസിക്കുന്ന പരദേശികൾ
  rationale: രണ്ടു പദങ്ങളും ഇസ്രായേല്യരല്ലാത്ത, അവരുടെ ഇടയിൽ പാർക്കുന്ന നിവാസികളെ സൂചിപ്പിക്കുന്നു. ‘പരദേശികൾ’ അന്യദേശീയതയും ‘താമസിക്കുന്ന’ നിവാസസ്ഥിതിയും ചേർത്ത് വ്യക്തമാക്കുന്നു.
- source_word: מֵהֶם תִּקְנוּ
  choice: നിങ്ങൾക്കു വാങ്ങാം
  rationale: קנה ഇവിടെ വാണിജ്യപരമായി ‘വാങ്ങുക’ എന്ന അർഥത്തിലാണ്. സന്ദർഭത്തിലെ നിയമാനുമതി ‘വാങ്ങാം’ വ്യക്തമാക്കുന്നു.
- source_word: וּמִמִּשְׁפַּחְתָּם
  choice: അവരുടെ കുടുംബങ്ങളിൽനിന്നും
  rationale: מִשְׁפָּחָה കുടുംബമോ കുലമോ സൂചിപ്പിക്കാം; സാധാരണ വായനക്കാർക്ക് ‘കുടുംബങ്ങൾ’ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: നിങ്ങളുടെ ദേശത്ത് അവർക്കു ജനിച്ചവർ
  rationale: הוליד എന്നതിന്റെ കാരണാർഥരൂപം അക്ഷരാർഥത്തിൽ ‘ജനിപ്പിച്ചു/പിതാവായി’ എന്നാണ്. മലയാളത്തിൽ ‘അവർക്കു ജനിച്ചവർ’ വംശബന്ധം സ്വാഭാവികമായി അറിയിക്കുകയും പുരുഷന്മാരെ മാത്രം മുൻനിർത്തുന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: അവർ നിങ്ങളുടെ അവകാശസ്വത്തായിരിക്കും
  rationale: אֲחֻזָּה കൈവശമുള്ളതും പാരമ്പര്യമായി കൈമാറാവുന്നതുമായ സ്വത്തിനെ സൂചിപ്പിക്കുന്നു. ‘അവകാശസ്വത്ത്’ ഈ നിയമപരമായ സ്വത്തുസ്ഥിതി മറച്ചുവയ്ക്കാതെ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: അടിമത്തത്തെയും മനുഷ്യരെ സ്വത്തായി കണക്കാക്കുന്ന നിയമഭാഷയെയും എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ‘വാങ്ങാം’, ‘അവകാശസ്വത്ത്’ എന്നീ നേരിട്ടുള്ള ഉടമസ്ഥതാഭാഷ നിലനിർത്തി
  alternative: ‘സ്വന്തമാക്കാം’, ‘ദാസന്മാർ’, ‘കൈവശം’ തുടങ്ങിയ മൃദുവായ പ്രയോഗങ്ങൾ
  rationale: എബ്രായപാഠം വാങ്ങലിനെയും പാരമ്പര്യമായി കൈമാറാവുന്ന സ്വത്തുസ്ഥിതിയെയും നേരിട്ട് വിവരിക്കുന്നു. ധാർമിക അസ്വസ്ഥത കുറയ്ക്കാൻ മൂലപാഠത്തിന്റെ കാഠിന്യം മൃദൂകരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ദീർഘമായ എബ്രായവാക്യത്തിന്റെ ബന്ധങ്ങൾ വ്യക്തമാക്കാൻ ഡാഷുകൾ ചേർത്തു; എന്നാൽ വാക്യഘടനയും ആശയക്രമവും പരമാവധി നിലനിർത്തി.
