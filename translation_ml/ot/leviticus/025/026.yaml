reference: Leviticus 25:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֛י לֹ֥א יִֽהְיֶה לּ֖/וֹ גֹּאֵ֑ל וְ/הִשִּׂ֣יגָה יָד֔/וֹ וּ/מָצָ֖א כְּ/דֵ֥י גְאֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: ml
  text: എന്നാൽ ഒരു പുരുഷന് വീണ്ടെടുപ്പുകാരൻ[a] ഇല്ലാതിരിക്കുകയും, അവന് ആവശ്യമായ സാമ്പത്തികശേഷി ലഭിക്കുകയും[b] തന്റെ വീണ്ടെടുപ്പിന് വേണ്ടത്ര തുക കണ്ടെത്തുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അടുത്ത ബന്ധുവായ വീണ്ടെടുപ്പുകാരൻ.’ എബ്രായത്തിലെ גֹּאֵל എന്ന പദം കുടുംബസ്വത്ത് വീണ്ടെടുക്കാനുള്ള അവകാശമോ ചുമതലയോ ഉള്ള അടുത്ത ബന്ധുവിനെ പലപ്പോഴും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ കൈ എത്തുന്നു.’ ഒരാളുടെ സാമ്പത്തികശേഷി ആവശ്യത്തിന് മതിയാകുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: എന്നാൽ ഒരു പുരുഷന് … ഇല്ലാതിരിക്കുകയും
  rationale: മുൻവാക്യത്തിലെ സാഹചര്യത്തിന് വിപരീതമായ മറ്റൊരു നിയമസാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ וְ ആശയപരമായി ‘എന്നാൽ’ എന്നും, כִּי വ്യവസ്ഥാസൂചകമായും പരിഭാഷപ്പെടുത്തി. אִישׁ എന്ന ഏകവചന പുല്ലിംഗരൂപം ‘ഒരു പുരുഷൻ’ എന്ന അർഥത്തിൽ നിലനിർത്തി.
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: വീണ്ടെടുപ്പുകാരൻ ഇല്ലാതിരിക്കുകയും
  rationale: ഗോത്രസ്വത്ത് തിരികെ വാങ്ങാനുള്ള അവകാശമോ ചുമതലയോ ഉള്ള അടുത്ത ബന്ധുവിനെയാണ് גֹּאֵל ഇവിടെ സൂചിപ്പിക്കുന്നത്. മുഖ്യപാഠത്തിൽ സംക്ഷിപ്തമായ ‘വീണ്ടെടുപ്പുകാരൻ’ ഉപയോഗിച്ച് ബന്ധുത്വസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: പിന്നീട് അവന് ആവശ്യമായ സമ്പത്ത് ലഭിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ കൈ എത്തി’ എന്നാണെങ്കിലും, സാമ്പത്തികശേഷി മതിയാകുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്. മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം വ്യക്തമാക്കാൻ ‘ആവശ്യമായ സമ്പത്ത് ലഭിച്ച്’ എന്നു നൽകി.
- source_word: וּמָצָא כְּדֵי גְאֻלָּתוֹ
  choice: തന്റെ നിലം വീണ്ടെടുക്കാൻ വേണ്ടത്ര പണം കണ്ടെത്തുകയും ചെയ്താൽ
  rationale: מָצָא എന്ന ‘കണ്ടെത്തുക/ലഭിക്കുക’ എന്ന ആശയവും כְּדֵי എന്ന പര്യാപ്തതയും നിലനിർത്തി. സന്ദർഭം വിറ്റ നിലത്തിന്റെ വീണ്ടെടുപ്പായതിനാൽ അവ്യക്തമായ പ്രത്യയത്തിന്റെ സൂചിതവിഷയം ‘നിലം’ എന്നു വ്യക്തമാക്കി; സാമ്പത്തിക നിയമസന്ദർഭത്തിൽ വേണ്ടത്ര തുക എന്ന ആശയം ‘പണം’ കൊണ്ട് സ്വാഭാവികമാക്കി.
theological_decisions:
- issue: גֹּאֵל എന്ന പദത്തിന്റെ കുടുംബ-നിയമപരമായ അർഥം
  choice: വീണ്ടെടുപ്പുകാരൻ
  alternative: അടുത്ത ബന്ധുവായ വീണ്ടെടുപ്പുകാരൻ
  rationale: ഈ വാക്യത്തിൽ പദം ആത്മീയ രക്ഷയെക്കാൾ കുടുംബസ്വത്ത് വീണ്ടെടുക്കുന്ന നിയമപരമായ പങ്കിനെയാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യപാഠം ഭാരപ്പെടുത്താതെ ഈ പ്രത്യേകത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: גְאֻלָּתוֹ എന്നതിലെ പ്രത്യയത്തിന്റെ സൂചന
  choice: തന്റെ നിലം വീണ്ടെടുക്കാൻ
  alternative: തന്റെ വീണ്ടെടുപ്പിന്
  rationale: വ്യാകരണപരമായി ‘അവന്റെ വീണ്ടെടുപ്പ്’ എന്നാകാമെങ്കിലും മുൻവാക്യത്തിൽ വിറ്റ സ്വത്താണ് ചർച്ചാവിഷയം. മലയാളത്തിൽ തെറ്റായ ആത്മീയ വായന ഒഴിവാക്കാനും നിയമസന്ദർഭം വ്യക്തമാക്കാനും ‘നിലം’ ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘വീണ്ടെടുപ്പ്’ എന്ന ബൈബിൾപരിചിത പദം നിലനിർത്തിയെങ്കിലും, ഇത് ഭൂസ്വത്ത് തിരിച്ചുവാങ്ങുന്നതിനെക്കുറിച്ചാണെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന വ്യവസ്ഥാവാക്യമായതിനാൽ അവസാനത്തിൽ കോമ വെച്ചു.
