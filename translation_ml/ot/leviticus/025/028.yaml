id: LEV.25.28
reference: Leviticus 25:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֨ם לֹֽא מָֽצְאָ֜ה יָד֗/וֹ דֵּי֮ הָשִׁ֣יב ל/וֹ֒ וְ/הָיָ֣ה מִמְכָּר֗/וֹ בְּ/יַד֙ הַ/קֹּנֶ֣ה אֹת֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יּוֹבֵ֑ל וְ/יָצָא֙ בַּ/יֹּבֵ֔ל וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: ml
  text: എന്നാൽ അതു വീണ്ടെടുക്കാൻ വേണ്ടത്ര വക അയാൾക്കു ലഭിച്ചില്ലെങ്കിൽ, അയാൾ വിറ്റത് യോബേൽവർഷം വരെ വാങ്ങിയവന്റെ കൈവശം തുടരും. യോബേലിൽ അത് വാങ്ങിയവന്റെ കൈവശത്തുനിന്ന് ഒഴിഞ്ഞുപോകും; അയാൾ തന്റെ അവകാശസ്വത്തിലേക്കു മടങ്ങിവരും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അത് അയാളുടെ അവകാശസ്വത്തിലേക്കു മടങ്ങിവരും.” അവസാനത്തെ എബ്രായ ക്രിയയുടെ കർത്താവ് വിൽപ്പനക്കാരനല്ല, വിറ്റ സ്വത്താണെന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ
  choice: വേണ്ടത്ര വക അയാൾക്കു ലഭിച്ചില്ലെങ്കിൽ
  rationale: ‘കൈ കണ്ടെത്തുക’ എന്ന എബ്രായ പ്രയോഗം സാമ്പത്തികശേഷി അല്ലെങ്കിൽ മാർഗം ലഭിക്കുക എന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ അക്ഷരാർഥം അസ്വാഭാവികമായതിനാൽ ‘വക ലഭിക്കുക’ എന്നു സ്വാഭാവികമായി അർഥം നൽകി.
- source_word: דֵּי הָשִׁיב לוֹ
  choice: അതു വീണ്ടെടുക്കാൻ വേണ്ടത്ര
  rationale: സന്ദർഭം വിറ്റ അവകാശസ്വത്ത് വിലകൊടുത്ത് തിരിച്ചെടുക്കുന്നതാണ്. അതിനാൽ ‘തിരികെ കൊടുക്കാൻ’ എന്നതിനെക്കാൾ നിയമപരമായ ആശയം വ്യക്തമാക്കുന്ന ‘വീണ്ടെടുക്കാൻ’ തെരഞ്ഞെടുത്തു.
- source_word: מִמְכָּרוֹ
  choice: അയാൾ വിറ്റത്
  rationale: ഈ നാമം വിൽപ്പനയെയോ വിറ്റ വസ്തുവിനെയോ സൂചിപ്പിക്കാം. തുടർന്ന് അത് വാങ്ങിയവന്റെ കൈവശം ഇരിക്കുന്നതായി പറയുന്നതിനാൽ ഇവിടെ വിറ്റ സ്വത്താണ് ഉദ്ദേശ്യം.
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: വാങ്ങിയവന്റെ കൈവശം
  rationale: ‘കൈയിൽ’ എന്ന എബ്രായ ഉടമസ്ഥതാപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘കൈവശം’ എന്നു നൽകി.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: യോബേൽവർഷം
  rationale: നിയമത്തിലെ സാങ്കേതിക പദമായ יוֹבֵל ശബ്ദാന്തരണം ചെയ്ത് ‘യോബേൽവർഷം’ എന്നു നൽകി.
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: യോബേലിൽ അത് അവന്റെ കൈവശത്തുനിന്ന് ഒഴിഞ്ഞുപോകും
  rationale: יצא എന്ന ക്രിയയുടെ ‘പുറപ്പെടുക/ഒഴിഞ്ഞുപോകുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും, വസ്തു വാങ്ങിയവന്റെ ഉടമസ്ഥതയിൽനിന്ന് മോചിതമാകുന്നു എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: അയാൾ തന്റെ അവകാശസ്വത്തിലേക്കു മടങ്ങിവരും
  rationale: אֲחֻזָּה പാരമ്പര്യമായി ലഭിച്ച ഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവകാശസ്വത്ത്’ എന്നു നൽകി. ക്രിയയുടെ കർത്താവായി വിൽപ്പനക്കാരനെ പ്രധാന പാഠത്തിൽ സ്വീകരിച്ചു.
theological_decisions:
- issue: וְשָׁב എന്ന അവസാന ക്രിയയുടെ കർത്താവ്
  choice: 'വിൽപ്പനക്കാരൻ/മുൻ ഉടമയാണ് കർത്താവ്: ‘അയാൾ തന്റെ അവകാശസ്വത്തിലേക്കു മടങ്ങിവരും.’'
  alternative: 'വിറ്റ സ്വത്താണ് കർത്താവ്: ‘അത് അയാളുടെ അവകാശസ്വത്തിലേക്കു മടങ്ങിവരും.’'
  rationale: പുരുഷലിംഗ ഏകവചനരൂപം വ്യാകരണപരമായി വ്യക്തിയെയോ പുരുഷലിംഗ നാമമായി ഗ്രഹിക്കുന്ന വിറ്റ വസ്തുവിനെയോ സൂചിപ്പിക്കാം. യോബേൽ നിയമത്തിന്റെ വ്യക്തികേന്ദ്രിതമായ ഭാഷ കണക്കിലെടുത്ത് മുൻ ഉടമയെ മുഖ്യവായനയായി സ്വീകരിച്ചു; യഥാർഥമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘വീണ്ടെടുക്കുക’, ‘കൈവശം’, ‘അവകാശസ്വത്ത്’ എന്നിവ ഉപയോഗിച്ചു; മൂലത്തിലെ യഥാർഥ വ്യാകരണാനിശ്ചിതത്വം [a] എന്ന അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
