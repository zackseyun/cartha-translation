  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲנִ֗י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֤ת לָ/כֶם֙ אֶת אֶ֣רֶץ כְּנַ֔עַן לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ ഞാൻ ആകുന്നു[a]. നിങ്ങൾക്കു കനാൻദേശം നൽകാനും നിങ്ങളുടെ ദൈവമായിരിക്കാനുമായി നിങ്ങളെ ഈജിപ്ത് ദേശത്തുനിന്ന് പുറത്തുകൊണ്ടുവന്നത് ഞാനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ ഹീബ്രു രൂപവും പരമ്പരാഗത പരിഭാഷയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും ഇവിടെ ഏകവചന ദൈവത്തെയും ഉടമ്പടിബന്ധത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: הוֹצֵאתִי
  choice: കൊണ്ടുവന്നത്
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം പുറപ്പാട് സന്ദർഭത്തിൽ ‘പുറത്തുകൊണ്ടുവരുക’ എന്നാണ്; മലയാളവാക്യത്തിൽ ഉറവിടസ്ഥാനം വ്യക്തമാകുന്നതിനാൽ ‘ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്നു’ സ്വാഭാവികമാണ്.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഈജിപ്ത് ദേശത്തുനിന്ന്’; ആധുനിക മലയാളത്തിൽ ‘ഈജിപ്തിൽനിന്ന്’ അതേ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: നിങ്ങൾക്കു കനാൻദേശം തരാൻ
  rationale: לָתֵת എന്ന ഉദ്ദേശ്യസൂചക അനന്തക്രിയയും ഉടമ്പടിദാനത്തിന്റെ നേരിട്ടുള്ള ഭാഷയും നിലനിർത്തുന്നു.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: നിങ്ങളുടെ ദൈവമായിരിക്കാൻ
  rationale: ദൈവത്തിന്റെ സത്തയിൽ മാറ്റമെന്നല്ല, അവിടുന്ന് ജനത്തോടുള്ള ഉടമ്പടിബന്ധത്തിൽ അവരുടെ ദൈവമായിരിക്കുന്നതെന്നാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲנִי
  choice: ഞാൻ ആകുന്നു / ഞാനാണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ തിരിച്ചറിയൽവാക്യമായും അവസാനത്തെ ‘ഞാനാണ്’ എന്ന ഊന്നലിലൂടെയും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ ദൈവനാമം നിലനിർത്തുന്നു. മലയാളത്തിലെ വ്യാപകവും മാന്യവുമായ ലിപ്യന്തരണം ‘യഹോവ’യാണ്; ശാസ്ത്രീയമായി പുനർനിർമിച്ച ഉച്ചാരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: לִהְיוֹת לָכֶם לֵאלֹהִים എന്ന ഉടമ്പടിസൂത്രം
  choice: നിങ്ങളുടെ ദൈവമായിരിക്കാൻ
  alternative: നിങ്ങൾക്കു ദൈവമായിരിക്കാൻ; നിങ്ങളുടെ ദൈവമായിത്തീരാൻ
  rationale: ഇത് ദൈവത്തിന്റെ സത്തയിൽ സംഭവിക്കുന്ന മാറ്റമല്ല, ഉടമ്പടിപരമായ ബന്ധമാണ്. ‘ആയിത്തീരാൻ’ എന്നത് അനാവശ്യമായ മാറ്റധ്വനി നൽകാമെന്നതിനാൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ഉദ്ദേശ്യഘടനയും അവസാനത്തെ ദൈവബന്ധസൂത്രവും ഒരൊറ്റ സ്വാഭാവിക വാക്യത്തിൽ സൂക്ഷിച്ചു; אֲנִי എന്നതിന്റെ ഊന്നൽ ‘ഞാനാണ്’ എന്ന രൂപത്തിൽ പ്രകടമാക്കി.
