  text: וְ/אִם מְעַ֞ט נִשְׁאַ֧ר בַּ/שָּׁנִ֛ים עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל וְ/חִשַּׁב ל֑/וֹ כְּ/פִ֣י שָׁנָ֔י/ו יָשִׁ֖יב אֶת גְּאֻלָּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/052.yaml
  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: ml
  text: എന്നാൽ, യോബേൽ വർഷംവരെ കുറച്ച് വർഷങ്ങൾ മാത്രം ശേഷിക്കുന്നുവെങ്കിൽ, അവൻ അയാളോടുകൂടെ കണക്കുകൂട്ടണം; തന്റെ വർഷങ്ങൾക്കനുസരിച്ച് തന്റെ വീണ്ടെടുപ്പുവില തിരിച്ചടയ്ക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ വീണ്ടെടുപ്പിനുള്ള തുക തിരിച്ചടയ്ക്കണം.” എബ്രായ പ്രയോഗം അമൂർത്തമായ വീണ്ടെടുപ്പിനെയല്ല, വീണ്ടെടുപ്പിനായി നൽകേണ്ട തുകയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: കുറച്ചു വർഷങ്ങളേ ശേഷിക്കുന്നുള്ളൂ
  rationale: מְעַט എന്നത് ഇവിടെ വർഷങ്ങളുടെ കുറഞ്ഞ എണ്ണത്തെയും נִשְׁאַר ശേഷിച്ചിരിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ അളവുസൂചനയായി അവതരിപ്പിച്ചു.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: യോബേൽവർഷം
  rationale: ലേവ്യപുസ്തകം 25-ലെ നിയമപരമായ പ്രത്യേക സ്ഥാപനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ പരിചിതമായ ബൈബിൾ പദമായ ‘യോബേൽ’ നിലനിർത്തി.
- source_word: וְחִשַּׁב לוֹ
  choice: അവൻ അയാളുമായി കണക്കുകൂട്ടണം
  rationale: חשב എന്ന സാമ്പത്തിക-നിയമപരമായ ക്രിയയെയും לוֹ സൂചിപ്പിക്കുന്ന ബന്ധപ്പെട്ട മറ്റേ കക്ഷിയെയും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: כְּפִי שָׁנָיו
  choice: ശേഷിക്കുന്ന വർഷങ്ങളുടെ അനുപാതത്തിൽ
  rationale: כְּפִי എന്നതിന്റെ ആനുപാതിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി; സന്ദർഭത്തിൽ കണക്കാക്കേണ്ടത് യോബേൽവരെ ശേഷിക്കുന്ന വർഷങ്ങളാണ്.
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: തന്റെ വീണ്ടെടുപ്പുവില തിരിച്ചടയ്ക്കണം
  rationale: גְּאֻלָּה ഇവിടെ അമൂർത്തമായ വീണ്ടെടുപ്പിനേക്കാൾ മോചനത്തിനായി നൽകേണ്ട തുകയെയാണ് സൂചിപ്പിക്കുന്നത്; יָשִׁיב സാമ്പത്തിക തിരിച്ചടവിനെ സൂചിപ്പിക്കുന്നു.
