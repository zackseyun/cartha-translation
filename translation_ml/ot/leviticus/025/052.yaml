translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘യോബേൽ’ എന്ന സ്ഥാപിത ബൈബിൾ പദം നിലനിർത്തുകയും സാമ്പത്തിക കണക്കുകൂട്ടലിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുകയും ചെയ്തു.
