  to: നിങ്ങൾ നിങ്ങളുടെ കൂട്ടുകാരന് എന്തെങ്കിലും വിൽക്കുകയോ അവന്റെ കൈയിൽനിന്ന് എന്തെങ്കിലും വാങ്ങുകയോ ചെയ്താൽ, ആരും തന്റെ സഹോദരനോടു അന്യായം ചെയ്യരുത്.[a]
