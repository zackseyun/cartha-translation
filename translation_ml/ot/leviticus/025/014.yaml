reference: Leviticus 25:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי תִמְכְּר֤וּ מִמְכָּר֙ לַ/עֲמִיתֶ֔/ךָ א֥וֹ קָנֹ֖ה מִ/יַּ֣ד עֲמִיתֶ֑/ךָ אַל תּוֹנ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: ml
  text: നിങ്ങൾ നിങ്ങളുടെ കൂട്ടുകാരന് എന്തെങ്കിലും വിൽക്കുകയോ അവന്റെ കൈയിൽനിന്ന് എന്തെങ്കിലും വാങ്ങുകയോ ചെയ്താൽ, ആരും തന്റെ സഹോദരനോടു അന്യായം ചെയ്യരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരസ്പരം അന്യായം ചെയ്യരുത്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക്, പ്രത്യേകിച്ച് വ്യാപാര ഇടപാടുകളിൽ, മറ്റൊരാളോട് അന്യായമായി പെരുമാറുക അല്ലെങ്കിൽ അന്യായമായ നേട്ടം കൈവരിക്കുക എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ചെയ്യുമ്പോൾ
  rationale: നിയമവാക്യത്തിലെ ആവർത്തിച്ചു സംഭവിക്കാവുന്ന സാഹചര്യത്തെ അവതരിപ്പിക്കുന്നതിനാൽ, ഇവിടെ וְכִי എന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ ‘ചെയ്യുമ്പോൾ’ എന്നു നൽകി; വ്യവസ്ഥാത്മക ഭാവവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: תִמְכְּרוּ מִמְכָּר
  choice: എന്തെങ്കിലും വിൽക്കുക
  rationale: מִמְכָּר വിൽക്കപ്പെടുന്ന വസ്തുവിനെയോ വിൽപ്പനയെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ ക്രിയയോടൊപ്പം ‘എന്തെങ്കിലും’ എന്നത് ഇടപാടിന്റെ വസ്തുവിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עָמִית
  choice: കൂട്ടുകാരൻ
  rationale: സമൂഹത്തിലെ സഹാംഗത്തെയോ തുല്യസ്ഥാനത്തുള്ള ആളെയോ സൂചിപ്പിക്കുന്ന പദമാണിത്. ‘കൂട്ടുകാരൻ’ എന്നത് ആ സാമൂഹികബന്ധം നിലനിർത്തുന്നു; വെറും സമീപവാസി എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: ‘കൈയിൽനിന്ന്’ എന്ന എബ്രായ ഇടപാട്-പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മലയാളത്തിലും വ്യക്തവും സ്വാഭാവികവുമാകുന്നതിനാൽ നിലനിർത്തി.
- source_word: אַל תּוֹנוּ
  choice: അന്യായമായി ചൂഷണം ചെയ്യരുത്
  rationale: ינה എന്ന ക്രിയ ഈ വ്യാപാരസന്ദർഭത്തിൽ അന്യായമായി പ്രയോജനം നേടുക, വഞ്ചിക്കുക, ദോഷം ചെയ്യുക എന്നീ ആശയങ്ങൾ വഹിക്കുന്നു. ‘ചൂഷണം’ സാമ്പത്തിക അനീതിയുടെ ഭാവം വ്യക്തമാക്കുന്നു; ‘അന്യായമായി’ അതിന്റെ നൈതിക സ്വഭാവം തുറന്നുകാട്ടുന്നു.
- source_word: אִישׁ אֶת אָחִיו
  choice: ആരും തന്റെ സഹോദരനെ
  rationale: אִישׁ ഇവിടെ വിതരണാത്മകമായി ‘ആരും’ എന്ന അർഥം നൽകുന്നു; אָחִיו എന്നതിന്റെ നേരിട്ടുള്ള ബന്ധപദം ‘തന്റെ സഹോദരനെ’ എന്നു നിലനിർത്തി, ഉടമ്പടി-സമൂഹത്തിലെ സഹാംഗത്വത്തിന്റെ ഭാവവും സംരക്ഷിച്ചു.
theological_decisions:
- issue: നിയമനിരോധനത്തിലെ പ്രതിനിധാനപരമായ പുല്ലിംഗ പദങ്ങൾ
  choice: ‘ആരും തന്റെ സഹോദരനെ’
  alternative: ‘ഒരാൾ മറ്റൊരാളെ’ / ‘ആരും തന്റെ കൂട്ടുകാരനെ’
  rationale: אִישׁ എന്നതിന്റെ വിതരണാത്മക അർഥം മലയാളത്തിൽ ‘ആരും’ എന്നു സ്വാഭാവികമായി നൽകുമ്പോഴും, אָחִיו എന്ന ബന്ധപദത്തിന്റെ വ്യക്തമായ ‘സഹോദരൻ’ രൂപം നിലനിർത്തുന്നു. ഇതിലൂടെ നിയമത്തിന്റെ പൊതുപ്രയോഗവും മൂലപാഠത്തിലെ സഹോദരബന്ധഭാഷയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- issue: ינה എന്ന ക്രിയയുടെ വ്യാപാരസന്ദർഭത്തിലുള്ള പരിധി
  choice: മുഖ്യപാഠത്തിൽ ‘അന്യായമായി ചൂഷണം ചെയ്യരുത്’; അടിക്കുറിപ്പിൽ പര്യായങ്ങൾ
  alternative: ‘ദ്രോഹിക്കരുത്’ / ‘വഞ്ചിക്കരുത്’ / ‘അന്യായം ചെയ്യരുത്’
  rationale: വ്യാപാരത്തിൽ അന്യായലാഭം നേടുന്നതാണ് ഉടൻ പ്രസക്തമായ അർഥം; എന്നാൽ ക്രിയയ്ക്ക് പൊതുവായി ദോഷം ചെയ്യുക എന്ന വിശാലതയും ഉള്ളതിനാൽ അടിക്കുറിപ്പിൽ ആ അർഥപരിധി സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമഭാവം നിലനിർത്തിക്കൊണ്ട് വാക്യഘടന സ്വാഭാവികമാക്കി. ‘കൈയിൽനിന്ന്’ എന്ന മൂലഭാഷയിലെ ഇടപാട്-രൂപകം സംരക്ഷിച്ചു; ‘സഹോദരൻ’ എന്ന സമൂഹബന്ധപദവും നിലനിർത്തി.
