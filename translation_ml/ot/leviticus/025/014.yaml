review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the sale/buying setting, the transactional idiom ‘from the hand of,’ and the distributive prohibition. However, ‘അന്യായമായി ചൂഷണം ചെയ്യരുത്’ is narrower and stronger than ינה, which in this context prohibits wronging or taking unfair advantage but does not necessarily specify systematic exploitation. ‘ചെയ്യുമ്പോൾ’ is acceptable in legal Malayalam, though an explicit conditional better reflects וְכִי.
  naturalness: The sentence is generally fluent. ‘തന്റെ സഹോദരനെ അന്യായമായി ചൂഷണം ചെയ്യരുത്’ is grammatically understandable, but ‘തന്റെ സഹോദരനോടു അന്യായം ചെയ്യരുത്’ is more idiomatic Malayalam. ‘കൂട്ടുകാരൻ’ is natural, though it can suggest a friend; in this legal context it is retained as a workable rendering of a fellow community member.
  terminology: Retain ‘കൂട്ടുകാരൻ’ consistently for עָמִית and ‘സഹോദരൻ’ for אָחִיו. Render ינה as ‘അന്യായം ചെയ്യുക’ in the main text, with the commercial sense of unfair advantage explained in the footnote. This avoids overstating the verb while preserving its legal-economic relevance.
  issues:
  - severity: medium
    issue: ‘അന്യായമായി ചൂഷണം ചെയ്യരുത്’ is overly specific for ינה.
    rationale: The verb can mean wrong, mistreat, or take unfair advantage. ‘ചൂഷണം’ can imply a more sustained or severe form of exploitation than the Hebrew itself requires, while ‘അന്യായമായി’ adds an element already inherent in the prohibition.
  - severity: low
    issue: The prohibition’s Malayalam object construction is less idiomatic.
    rationale: With ‘അന്യായം ചെയ്യുക,’ Malayalam normally uses ‘ഒരാളോടു അന്യായം ചെയ്യുക,’ rather than treating the person as the direct object.
