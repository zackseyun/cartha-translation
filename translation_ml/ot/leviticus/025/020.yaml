  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ചോദ്യംയും തുടർന്നുള്ള ആശങ്കയുടെ ഊന്നലും നിലനിർത്തിയിട്ടുണ്ട്.
