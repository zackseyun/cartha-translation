  text: וְ/כִ֣י תֹאמְר֔וּ מַה נֹּאכַ֤֖ל בַּ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֑ת הֵ֚ן לֹ֣א נִזְרָ֔ע וְ/לֹ֥א נֶאֱסֹ֖ף אֶת תְּבוּאָתֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/020.yaml
  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: ml
  text: 'നിങ്ങൾ ഇങ്ങനെ പറഞ്ഞാൽ: ‘ഏഴാം വർഷത്തിൽ ഞങ്ങൾ എന്തു ഭക്ഷിക്കും? ഇതാ, ഞങ്ങൾ വിതയ്ക്കുകയോ ഞങ്ങളുടെ വിളവ് ശേഖരിക്കുകയോ ചെയ്യുകയില്ലല്ലോ.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תֹאמְרוּ
  choice: നിങ്ങൾ ... എന്നു ചോദിച്ചേക്കാം
  rationale: സന്ദർഭത്തിലെ സാങ്കൽപ്പിക ചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ബഹുവചന അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: מַה נֹּאכַל
  choice: ഞങ്ങൾ എന്തു ഭക്ഷിക്കും?
  rationale: ഹീബ്രു ചോദ്യത്തിന്റെ നേരിട്ടുള്ള അർഥവും ഭാവികാലഭാവവും നിലനിർത്തുന്നു.
- source_word: הֵן
  choice: -ല്ലോ
  rationale: ഹീബ്രുവിലെ ഊന്നൽ ഇവിടെ മലയാളത്തിലെ സ്വാഭാവികമായ വിശദീകരണാത്മക ഊന്നലിലൂടെ പകരുന്നു; സന്ദർഭത്തിൽ ‘since’ എന്ന ആശയബന്ധവും പ്രകടമാക്കുന്നു.
- source_word: נֶאֱסֹף אֶת־תְּבוּאָתֵנוּ
  choice: ഞങ്ങളുടെ വിളവ് ശേഖരിക്കുക
  rationale: תְּבוּאָה എന്നത് ഇവിടെ ഭൂമിയുടെ ഉൽപ്പന്നമായ വിളവിനെ സൂചിപ്പിക്കുന്നു; ‘ശേഖരിക്കുക’ നിഷ്ക്രിയ ഹീബ്രു രൂപത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
