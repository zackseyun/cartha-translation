  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: ml
  text: എന്നാൽ യോവേലിനുശേഷം[a] അവൻ തന്റെ വയൽ വിശുദ്ധമായി വേർതിരിച്ചു സമർപ്പിക്കുകയാണെങ്കിൽ, യോവേൽവർഷംവരെ ശേഷിക്കുന്ന വർഷങ്ങൾക്കനുസരിച്ച് പുരോഹിതൻ അവനുവേണ്ടി തുക കണക്കാക്കണം[b]; അത് നിന്റെ മൂല്യനിർണയത്തിൽനിന്ന് കുറയ്ക്കപ്പെടണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോവേൽവർഷത്തിനുശേഷം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പുരോഹിതൻ അവനുവേണ്ടി വില നിർണയിക്കണം.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘നിന്റെ നിർണയിച്ച മൂല്യത്തിൽനിന്ന് അത് കുറയ്ക്കപ്പെടണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: യോവേലിനുശേഷം
  rationale: אַחַר കാലക്രമത്തിലെ ‘ശേഷം’ എന്ന അർഥം നൽകുന്നു; הַיֹּבֵל യോവേൽ എന്ന നിയമസ്ഥാപനത്തെയോ അതിന്റെ വർഷത്തെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠം സംക്ഷിപ്തമായ മൂലരൂപം നിലനിർത്തുന്നു.
- source_word: יַקְדִּישׁ
  choice: വിശുദ്ധമായി വേർതിരിക്കുന്നുവെങ്കിൽ
  rationale: קדשׁ ഇവിടെ വയൽ യഹോവയ്ക്കായി വിശുദ്ധമായി മാറ്റിവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാസംബന്ധിയായ അർഥം നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: שָׂדֵהוּ
  choice: തന്റെ വയൽ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: പുരോഹിതൻ അവനുവേണ്ടി തുക കണക്കാക്കണം
  rationale: חשב എന്നത് ഈ നിയമപരമായ സാഹചര്യത്തിൽ കണക്കാക്കുക എന്ന അർഥത്തിലാണ്; הַכֶּסֶף അക്ഷരാർഥത്തിൽ ‘വെള്ളി/പണം’ ആയെങ്കിലും ഇവിടെ നിർണയിക്കേണ്ട ധനത്തുകയാണ്.
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: ശേഷിക്കുന്ന വർഷങ്ങളുടെ അടിസ്ഥാനത്തിൽ
  rationale: עַל־פִּי എന്ന പ്രയോഗത്തിന്റെ ‘അടിസ്ഥാനത്തിൽ/അനുസരിച്ച്’ എന്ന അർഥവും ആനുപാതിക കണക്കുകൂട്ടലും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: അടുത്ത യോവേൽവർഷംവരെ
  rationale: വയൽ സമർപ്പിച്ച ശേഷമുള്ള ശേഷിക്കുന്ന വർഷങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ കാലപരിധി വ്യക്തമാക്കാൻ ‘അടുത്ത’ ചേർത്തിരിക്കുന്നു, എന്നാൽ യോവേൽവർഷം എന്ന മൂലഘടകം നിലനിർത്തുന്നു.
- source_word: וְנִגְרַע
  choice: അതു കുറയ്ക്കണം
  rationale: Niphal രൂപം മൂല്യനിർണയത്തിൽനിന്നുള്ള കുറവ് സൂചിപ്പിക്കുന്നു. നിയമ-സാമ്പത്തിക പശ്ചാത്തലത്തിൽ ലളിതവും വ്യക്തവുമായ മലയാളം.
- source_word: מֵעֶרְכֶּךָ
  choice: നിന്റെ മൂല്യനിർണയത്തിൽനിന്ന്
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം ‘നിന്റെ’ എന്നു നേരിട്ട് നിലനിർത്തി, മുൻപ് നിശ്ചയിച്ച മൂല്യനിർണയത്തോടുള്ള ബന്ധം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: מֵעֶרְכֶּךָ എന്നതിലെ രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം
  choice: നിന്റെ മൂല്യനിർണയത്തിൽനിന്ന്
  alternative: ആ മൂല്യനിർണയത്തിൽനിന്ന് / അതിന്റെ മൂല്യത്തിൽനിന്ന്
  rationale: എബ്രായപാഠത്തിലെ നേരിട്ടുള്ള ഏകവചന അഭിസംബോധന നിലനിർത്തുന്നത് നിയമഭാഷയുടെ സ്വഭാവവും മുമ്പുള്ള മൂല്യനിർണയത്തോടുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
- issue: יַקְדִּישׁ എന്ന ആരാധനാസംബന്ധിയായ പദം
  choice: വിശുദ്ധമായി വേർതിരിക്കുന്നു
  alternative: സമർപ്പിക്കുന്നു / പ്രതിഷ്ഠിക്കുന്നു
  rationale: വസ്തു വിശുദ്ധമായി യഹോവയ്ക്കായി മാറ്റിവെക്കപ്പെടുന്നു എന്ന ആശയം നിലനിർത്തുന്നു; ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘യോവേൽ’, ‘പുരോഹിതൻ’, ‘വിശുദ്ധമായി വേർതിരിക്കുക’, ‘മൂല്യനിർണയം’ എന്നീ പദങ്ങൾ ലേവ്യപുസ്തകത്തിലെ ആരാധനാ-നിയമ പശ്ചാത്തലം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
