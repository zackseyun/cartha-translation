id: LEV.27.3
reference: Leviticus 27:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר מִ/בֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְ/עַ֖ד בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וְ/הָיָ֣ה עֶרְכְּ/ךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: ml
  text: ഇരുപത് വയസ്സുമുതൽ അറുപത് വയസ്സുവരെ പ്രായമുള്ള പുരുഷന്റെ കാര്യത്തിൽ, നീ നിശ്ചയിക്കേണ്ട മൂല്യം വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽമാനദണ്ഡപ്രകാരം വെള്ളിയുടെ അമ്പത് ശേക്കെൽ ആയിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: നീ നിശ്ചയിക്കേണ്ട മൂല്യം
  rationale: ലേവ്യപുസ്തകം 27-ലെ നേർച്ചാസന്ദർഭത്തിൽ ഇത് ഒരാളുടെ അന്തർലീനമായ വിലയെയല്ല, നിയമപ്രകാരം നിശ്ചയിക്കുന്ന മൂല്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַזָּכָר
  choice: പുരുഷൻ
  rationale: ഈ വാക്യത്തിലെ ലിംഗാധിഷ്ഠിത നിയമവിഭാഗം വ്യക്തമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: ഇരുപതു വയസ്സുമുതൽ അറുപതു വയസ്സുവരെ പ്രായമുള്ള
  rationale: ഹീബ്രായ പ്രായപരിധിയെ വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: അമ്പതു ശേക്കെൽ വെള്ളി
  rationale: തൂക്കവും ലോഹവും ചേർന്ന ഹീബ്രായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; പരിചിതമായ ബൈബിൾ അളവുപദമായ ‘ശേക്കെൽ’ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽപ്രകാരം
  rationale: വിശുദ്ധസ്ഥലവുമായി ബന്ധപ്പെട്ട ഔദ്യോഗിക തൂക്കമാനദണ്ഡമാണ് ഉദ്ദേശിക്കുന്നത്; בְ എന്ന ഉപസർഗത്തിന്റെ മാനദണ്ഡാർഥം ‘പ്രകാരം’ വ്യക്തമാക്കുന്നു.
- source_word: וְהָיָה ... וְהָיָה
  choice: ആയിരിക്കണം
  rationale: നിയമനിർദേശപരമായ ബലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഹീബ്രായത്തിലെ ആവർത്തനം മലയാളവാക്യത്തിൽ അനാവശ്യമായി പകർത്തുന്നില്ല.
theological_decisions:
- issue: ലിംഗാധിഷ്ഠിത മൂല്യനിർണയവിഭാഗം
  choice: പുരുഷൻ
  alternative: ആൾ / മനുഷ്യൻ
  rationale: മൂലപാഠം പുരുഷലിംഗവിഭാഗത്തെ പ്രത്യേകം നിർദേശിക്കുന്നതിനാൽ അതിനെ ലിംഗനിരപേക്ഷമാക്കി മാറ്റുന്നില്ല; ഇത് വ്യക്തിയുടെ മാനവമഹത്വത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയല്ല, നേർച്ചയുമായി ബന്ധപ്പെട്ട നിയമവിഭാഗമാണ്.
- issue: עֵרֶךְ എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: നിശ്ചയിക്കേണ്ട മൂല്യം
  alternative: വില / അന്തർലീന മൂല്യം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് നേർച്ചാസംബന്ധമായ ഔദ്യോഗിക മൂല്യനിർണയമാണ്; വ്യക്തിയുടെ അന്തർലീനമോ വിപണിസംബന്ധമോ ആയ വിലയല്ല.
- issue: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ
  choice: തൂക്കമാനദണ്ഡമായി അവതരിപ്പിച്ചു
  alternative: വിശുദ്ധമായ ശേക്കെൽ
  rationale: הַקֹּדֶשׁ ഇവിടെ ശേക്കെലിന്റെ ധാർമ്മിക ഗുണത്തേക്കാൾ വിശുദ്ധസ്ഥലവുമായി ബന്ധപ്പെട്ട അംഗീകൃത മാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരമായ നിർദേശഭാവം നിലനിർത്തിയെങ്കിലും അത്യന്തം പുരാതനമോ ദുഷ്കരമോ ആയ പദക്രമം ഒഴിവാക്കി.
