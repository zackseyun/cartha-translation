id: LEV.27.20
reference: Leviticus 27:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: ml
  text: എന്നാൽ, അവൻ ആ വയൽ വീണ്ടെടുക്കുന്നില്ലെങ്കിലോ, അല്ലെങ്കിൽ ആ വയൽ മറ്റൊരാൾക്ക്[a] വിറ്റിട്ടുണ്ടെങ്കിലോ, അത് ഇനി വീണ്ടെടുക്കപ്പെടുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മറ്റൊരു പുരുഷന്.’ ഹീബ്രുവിൽ ‘പുരുഷൻ’ എന്ന പദമാണ്; നിയമസന്ദർഭത്തിൽ അതിന് പൊതുവായ അർഥവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … ചെയ്താൽ
  rationale: മുൻവാക്യത്തിലെ വ്യവസ്ഥയുടെ പ്രതികൂലമായ തുടർച്ചയാണിത്; ‘എന്നാൽ’ എന്നത് ആ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִגְאַל / יִגָּאֵל
  choice: വീണ്ടെടുക്കുക / വീണ്ടെടുക്കപ്പെടുക
  rationale: സമർപ്പിച്ച സ്വത്ത് നിശ്ചിത വില നൽകി തിരികെ കൈവശമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗാൽ എന്ന നിയമ-ആരാധനാപരമായ പദത്തിന്റെ സാങ്കേതിക ഭാവം നിലനിർത്തുന്നു; കർത്തരി-കർമണി രൂപങ്ങളിലെ ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: הַשָּׂדֶה
  choice: ആ വയൽ
  rationale: പൊതുവായ ഭൂവിഭാഗമല്ല, മുൻസന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന നിർദിഷ്ട വയലാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: מָכַר
  choice: വിറ്റിരിക്കുകയോ
  rationale: വിൽപ്പന പൂർത്തിയായതും അതിന് ഇപ്പോഴും നിയമപരമായ ഫലം നിലനിൽക്കുന്നതും ഈ രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְאִישׁ אַחֵר
  choice: മറ്റൊരാൾക്ക്
  rationale: אִישׁ എന്ന പദം രൂപത്തിൽ പുരുഷലിംഗമാണെങ്കിലും നിയമവാക്യത്തിൽ ‘മറ്റൊരു വ്യക്തി’ എന്ന പൊതുവായ അർഥത്തിൽ വരാം; ‘മറ്റൊരാൾ’ ആ നിയമബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עוֹד
  choice: പിന്നെ
  rationale: വിൽപ്പനയ്ക്കുശേഷം ഇനി വീണ്ടെടുപ്പ് സാധ്യമല്ലെന്ന കാലപരവും നിയമപരവുമായ പരിധി മലയാളത്തിൽ സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: നിയമവാക്യത്തിലെ പുരുഷലിംഗരൂപം
  choice: മറ്റൊരാൾക്ക്
  alternative: മറ്റൊരു പുരുഷന്
  rationale: ഇവിടെ אִישׁ എന്നത് ഒരു പുരുഷനെ മാത്രമായി നിർബന്ധമായി പരിമിതപ്പെടുത്താതെ മറ്റൊരു വ്യക്തിയെ സൂചിപ്പിക്കാവുന്നതാണ്. അതിനാൽ സ്വാഭാവികമായ പൊതുപ്രയോഗം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുകയും മൂലഭാഷയിലെ പുരുഷലിംഗരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
- issue: גאל എന്ന പദത്തിന്റെ നിയമ-ആരാധനാപരമായ ബലം
  choice: വീണ്ടെടുക്കുക
  alternative: തിരികെ വാങ്ങുക
  rationale: ‘തിരികെ വാങ്ങുക’ സാമ്പത്തിക ഇടപാടിനെ മാത്രം മുൻനിർത്താം; ‘വീണ്ടെടുക്കുക’ ലേവ്യപുസ്തകം 27-ലെ സമർപ്പിത സ്വത്തിന്റെ നിയമപരമായ തിരിച്ചെടുപ്പ് എന്ന സാങ്കേതിക ഭാവം കൂടുതൽ നന്നായി നിലനിർത്തുന്നു.
- issue: അവസാന ക്രിയയുടെ കർമണിപ്രയോഗം
  choice: അത് പിന്നെ വീണ്ടെടുക്കപ്പെടുകയില്ല
  alternative: അവന് അത് പിന്നെ വീണ്ടെടുക്കാൻ കഴിയില്ല
  rationale: ഹീബ്രു കർമണിരൂപം ആരാണ് വീണ്ടെടുക്കാൻ കഴിയാത്തത് എന്ന് പരിമിതപ്പെടുത്താതെ വയലിന്റെ നിയമസ്ഥിതി പ്രസ്താവിക്കുന്നു; അതേ തുറന്ന നില മലയാളത്തിലും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘ആ വയൽ’ മുൻസന്ദർഭത്തിലെ നിർദിഷ്ട വയലിനെ സൂചിപ്പിക്കുന്നു. വ്യവസ്ഥാവാക്യത്തിലെ രണ്ടു സാധ്യതകളും ‘-യോ … -യോ ചെയ്താൽ’ എന്ന സമാന്തരഘടനയിൽ അവതരിപ്പിച്ചു.
