  yaml_path: translation/ot/leviticus/027/029.yaml
  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: ml
  text: മനുഷ്യരിൽനിന്ന് പൂർണമായി സമർപ്പിക്കപ്പെട്ട ആരെയും വീണ്ടെടുക്കാൻ പാടില്ല[a]; അവൻ തീർച്ചയായും കൊല്ലപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യരിൽനിന്ന് നാശത്തിനായി സമർപ്പിക്കപ്പെട്ട ആരെയും വീണ്ടെടുക്കാൻ പാടില്ല; അവൻ തീർച്ചയായും കൊല്ലപ്പെടണം.” ഇവിടെ ‘പൂർണമായി സമർപ്പിക്കപ്പെട്ട’ എന്നത് തിരിച്ചെടുക്കാനാവാത്തവിധം സമർപ്പിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക നിയമ-ആരാധനാപരമായ പ്രയോഗമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵרֶם
  choice: ശാപാർപ്പിതൻ
  rationale: חֵרֶם എന്നത് ദൈവത്തിനായി തിരിച്ചെടുക്കാനാവാത്തവിധം മാറ്റിവെച്ചതും ചില സന്ദർഭങ്ങളിൽ നാശത്തിനായി വിധിക്കപ്പെട്ടതുമായ ഒന്നിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. ഇവിടെ മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നതെന്നു തുടർന്നുള്ള מִן הָאָדָםയും മരണവാക്യവും വ്യക്തമാക്കുന്നതിനാൽ വ്യക്തിവാചകമായ ‘ശാപാർപ്പിതൻ’ ഉപയോഗിച്ചു; ‘ശാപം’ എന്നും ‘അർപ്പണം’ എന്നും ഉള്ള ആശയങ്ങൾ ചേർത്ത് പദത്തിന്റെ നിയമ-ആരാധനാപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- source_word: יָחֳרַם
  choice: ശാപാർപ്പിതമാക്കപ്പെട്ട
  rationale: חרם ധാതുവുമായുള്ള പദബന്ധം നിലനിർത്തുകയും, ഒരാളെ തിരിച്ചെടുക്കാനാവാത്ത വിധം ഹേരെമിന് കീഴിലാക്കിയെന്ന കർമണ്യാർഥം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: מִן הָאָדָם
  choice: മനുഷ്യരിൽനിന്ന്
  rationale: ഇവിടെ אָדָם മനുഷ്യവർഗത്തിൽനിന്നുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘മനുഷ്യനിൽനിന്ന്’ മലയാളത്തിൽ അസ്വാഭാവികവും ആശയക്കുഴപ്പമുള്ളതുമായതിനാൽ, ഉറവിടത്തിന്റെ വിഭാഗാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יִפָּדֶה
  choice: വീണ്ടെടുക്കപ്പെടരുത്
  rationale: פדה എന്നത് വിലകൊടുത്തു മോചിപ്പിക്കുക, തിരികെ വാങ്ങുക, വീണ്ടെടുക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ലേവ്യപുസ്തകം 27-ലെ നിയമ-ആരാധനാപരമായ പശ്ചാത്തലത്തിന് ‘വീണ്ടെടുക്കുക’ യോജിക്കുന്നു; לֹא സഹിതം നിരോധനം പ്രകടമാക്കുന്നു.
- source_word: מוֹת יוּמָת
  choice: നിശ്ചയമായും കൊല്ലപ്പെടണം
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗം മരണവിധിയുടെ ഉറപ്പ് ഊന്നിപ്പറയുന്നു. ‘നിശ്ചയമായും’ ആ ഊന്നൽ കാത്തുസൂക്ഷിക്കുകയും കർമണി രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മനുഷ്യനെ സംബന്ധിക്കുന്ന חֵרֶם എന്ന നിയമ-ആരാധനാപരമായ പദത്തിന്റെ അർഥം
  choice: ‘ശാപാർപ്പിതൻ’ എന്ന സാങ്കേതികസ്വഭാവമുള്ള പദം ഉപയോഗിച്ച് സമർപ്പണവും നാശവിധിയും തമ്മിലുള്ള സംഘർഷം നിലനിർത്തി.
  alternative: ‘നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവൻ’ അല്ലെങ്കിൽ ‘വിലക്കിന് കീഴിലാക്കിയ വ്യക്തി’.
  rationale: വാക്യത്തിന്റെ അവസാനഭാഗം മരണത്തെ വ്യക്തമായി പറയുന്നുണ്ടെങ്കിലും, ആദ്യപകുതിയിലെ חרם / פדה എന്നീ നിയമ-ആരാധനാപരമായ പദങ്ങളെ വെറും ശിക്ഷാവിധിയായി ചുരുക്കരുത്. അതേസമയം മലയാളവായനക്കാരന് മനുഷ്യനെയാണ് പരാമർശിക്കുന്നതെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാകണം.
- issue: אָדָם എന്ന പദത്തിന്റെ പ്രതിനിധാനാർഥം
  choice: ‘മനുഷ്യരിൽനിന്ന്’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘മനുഷ്യനിൽനിന്ന്’ അല്ലെങ്കിൽ ‘മനുഷ്യവർഗത്തിൽനിന്ന്’.
  rationale: എബ്രായത്തിലെ ഏകവചനസാമൂഹിക പദം ഇവിടെ മനുഷ്യവർഗത്തിൽനിന്നുള്ള വ്യക്തിയെ വർഗീകരിക്കുന്നു. ‘മനുഷ്യരിൽനിന്ന്’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. അപരിചിതമായെങ്കിലും അർഥസൂചനയുള്ള ‘ശാപാർപ്പിതൻ’ എന്ന സംയുക്തപദം ഉറവിടത്തിലെ സാങ്കേതിക חֵרֶם ആശയം സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് കൂടുതൽ വ്യക്തമായ പര്യായവായന നൽകുന്നു.
