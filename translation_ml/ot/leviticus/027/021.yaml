reference: Leviticus 27:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/שָּׂדֶ֜ה בְּ/צֵאת֣/וֹ בַ/יֹּבֵ֗ל קֹ֛דֶשׁ לַֽ/יהוָ֖ה כִּ/שְׂדֵ֣ה הַ/חֵ֑רֶם לַ/כֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: ml
  text: എന്നാൽ ആ വയൽ യോബേൽ വർഷത്തിൽ വിട്ടുകിട്ടുമ്പോൾ, സമർപ്പിത വയൽപോലെ[a] യഹ്‌വേയ്ക്ക് വിശുദ്ധമായിരിക്കും; അത് പുരോഹിതന്റെ അവകാശഭൂമിയായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നാശത്തിനായി സമർപ്പിച്ച വയൽപോലെ’ അഥവാ ‘വിലക്കിനുകീഴിലുള്ള വയൽപോലെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം യഹ്‌വേയ്ക്ക് മാറ്റാനാവാത്തവിധം സമർപ്പിച്ച് സാധാരണ മനുഷ്യോപയോഗത്തിൽനിന്ന് നീക്കിയ ഒന്നിനെ സൂചിപ്പിക്കുന്നു.
    reason: חֵרֶם എന്ന പദത്തിന്റെ സമർപ്പണം, വിലക്ക്, നാശം എന്നിവ ഉൾക്കൊള്ളുന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וְהָיָה הַשָּׂדֶה
  choice: എന്നാൽ ആ വയൽ ... ആയിരിക്കും
  rationale: നിയമവിവരണത്തിന്റെ തുടർച്ചയും മുൻവാക്യത്തിലെ വീണ്ടെടുപ്പുസാഹചര്യത്തോടുള്ള വൈരുധ്യവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: യോബേൽ വർഷത്തിൽ വിട്ടുകിട്ടുമ്പോൾ
  rationale: അക്ഷരാർഥം ‘അത് പുറപ്പെടുമ്പോൾ’ എന്നാണെങ്കിലും, ഇവിടെ യോബേൽ നിയമപ്രകാരം ഭൂമി കൈവശത്തിൽനിന്ന് വിടുവിക്കപ്പെടുന്നതാണ് ഉദ്ദേശ്യം. ‘വിട്ടുകിട്ടുമ്പോൾ’ നിയമപരമായ വിടുതലും സ്വാഭാവികമായ മലയാളവും നിലനിർത്തുന്നു.
- source_word: קֹדֶשׁ לַיהוָה
  choice: യഹ്‌വേയ്ക്ക് വിശുദ്ധമായിരിക്കും
  rationale: ദൈവനാമം ലിപ്യന്തരണം ചെയ്ത്, ഭൂമി യഹ്‌വേയ്ക്കായി വേർതിരിക്കപ്പെടുന്നു എന്ന ഉടമ്പടിപരമായ ആശയം നിലനിർത്തുന്നു.
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: സമർപ്പിതവയൽപോലെ[a]
  rationale: חֵרֶם എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ മാറ്റാനാവാത്ത സമർപ്പണം മുഖ്യവാചകത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; നാശം, വിലക്ക്, സാധാരണ ഉപയോഗത്തിൽനിന്നുള്ള നീക്കം എന്നീ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: അത് പുരോഹിതന്റെ അവകാശഭൂമിയായിരിക്കും
  rationale: אֲחֻזָּה ഒരു ഭൂസ്വത്തോ സ്ഥിരകൈവശമോ സൂചിപ്പിക്കുന്നു. പുരോഹിതനാണ് കൈവശക്കാരൻ എന്നത് വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
theological_decisions:
- issue: חֵרֶם എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: സമർപ്പിതവയൽ
  alternative: നാശത്തിനായി സമർപ്പിച്ച വയൽ; വിലക്കിനുകീഴിലുള്ള വയൽ
  rationale: ഈ സന്ദർഭത്തിൽ പ്രധാനം ഭൂമി യഹ്‌വേയ്ക്ക് മാറ്റാനാവാത്തവിധം വേർതിരിക്കപ്പെടുകയും മുൻ ഉടമയുടെ സാധാരണ ഉപയോഗത്തിൽനിന്ന് നീങ്ങുകയും ചെയ്യുന്നതാണ്. ‘നാശത്തിനായി’ എന്നത് മുഖ്യവാചകത്തിൽ ചേർത്താൽ ഈ പ്രത്യേക ഭൂനിയമസന്ദർഭത്തിൽ പദത്തിന്റെ ഒരു സാധ്യത മാത്രം ഉറപ്പിച്ചേക്കാം; അതിനാൽ ശക്തമായ മറ്റു അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഹീബ്രു ദൈവനാമത്തെ പേരായിത്തന്നെ സുതാര്യമായി പ്രതിനിധീകരിക്കുന്നു; പദവിയായ ‘കർത്താവ്’ എന്നതുമായി കലരുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘യോബേൽ വർഷം’, ‘വിശുദ്ധം’, ‘അവകാശഭൂമി’ എന്നീ പദങ്ങൾ ഭൂനിയമപരവും ആരാധനാപരവുമായ ഭാവം നിലനിർത്തുന്നു.
