id: LEV.27.32
reference: Leviticus 27:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן כֹּ֥ל אֲשֶׁר יַעֲבֹ֖ר תַּ֣חַת הַ/שָּׁ֑בֶט הָֽ/עֲשִׂירִ֕י יִֽהְיֶה קֹּ֖דֶשׁ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: ml
  text: കന്നുകാലികളുടെയും ആടുകളുടെയും ദശാംശം—വടിയുടെ[b] കീഴിലൂടെ കടന്നുപോകുന്നവയിൽ ഓരോ പത്താമത്തെ മൃഗം[a]—യഹോവയ്ക്കു വിശുദ്ധമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “പത്താമത്തേത്.” വടിയുടെ കീഴിലൂടെ മൃഗങ്ങളെ എണ്ണിക്കടത്തുമ്പോൾ വരുന്ന ഓരോ പത്താമത്തെ മൃഗത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: “വടി” എന്നതിന് “ഇടയക്കോൽ” എന്നും പരിഭാഷപ്പെടുത്താം. മൃഗങ്ങളെ ഓരോന്നായി ഇടയന്റെ വടിക്കീഴിലൂടെ കടത്തിവിട്ട് എണ്ണുന്ന രീതിയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: מַעְשַׂר
  choice: ഓരോ പത്താമത്തേതും
  rationale: ദശാംശം എന്ന നിയമപരമായ ആശയം നിലനിർത്തിക്കൊണ്ട്, തുടർന്നുള്ള ‘പത്താമത്തേത്’ എന്ന വിശദീകരണവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: בָּקָר וָצֹאן
  choice: കന്നുകാലികളിലും ആടുമാടുകളിലും
  rationale: ബോവൈൻ മൃഗങ്ങളെയും ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലികളെയും സൂചിപ്പിക്കുന്ന രണ്ടു സമുച്ചയപദങ്ങളുടെ പരിധി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יַעֲבֹר תַּחַת הַשָּׁבֶט
  choice: വടിയുടെ കീഴിലൂടെ കടന്നുപോകുന്ന
  rationale: മൃഗങ്ങളെ ഇടയന്റെ വടിക്കീഴിലൂടെ ഓരോന്നായി കടത്തിവിട്ട് എണ്ണുന്ന ഇടയജീവിതത്തിലെ ദൃശ്യവും സാങ്കേതിക അർത്ഥവും സംരക്ഷിക്കുന്നു.
- source_word: הָעֲשִׂירִי
  choice: ഓരോ പത്താമത്തേതും
  rationale: എബ്രായത്തിലെ ‘പത്താമത്തേത്’ എണ്ണപ്പെടുന്ന മൃഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആവർത്തിത എണ്ണലിലെ ഓരോ പത്താമത്തെ മൃഗവും ഉദ്ദേശ്യമാണെന്ന് ‘ഓരോ’ വ്യക്തമാക്കുന്നു.
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: വിശുദ്ധമായിരിക്കണം
  rationale: യഹോവയ്ക്കായി വേർതിരിക്കപ്പെട്ട വിശുദ്ധസ്ഥിതി സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ വിധേയപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരിച്ചു നൽകുകയും സമർപ്പണം/അവകാശം സൂചിപ്പിക്കുന്ന לְ എന്ന ബന്ധം ദാതിവ് രൂപത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ഉടമ്പടിനാമം പൊതുപദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ‘പത്താമത്തേത്’ എന്നതിലെ സൂചിത നാമം
  choice: വാചകത്തിൽ ‘മൃഗം’ ചേർക്കാതെ നപുംസക ഏകവചനരൂപമായ ‘പത്താമത്തേത്’ നിലനിർത്തുന്നു
  alternative: ഓരോ പത്താമത്തെ മൃഗവും
  rationale: മൂലത്തിലെ യഥാർഥ സംക്ഷിപ്തതയും വ്യാകരണപരമായ സൂചനയും നിലനിർത്തുന്നു; പശ്ചാത്തലത്തിൽ മൃഗങ്ങളാണെന്ന് വ്യക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഔപചാരികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തിയെങ്കിലും അനാവശ്യമായ സഭാപര പദാവലി ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
