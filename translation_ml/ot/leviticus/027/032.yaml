- from: കന്നുകാലികളിലും ആടുമാടുകളിലും, വടിയുടെ കീഴിലൂടെ കടന്നുപോകുന്ന ഓരോ പത്താമത്തേതും[a] യഹോവയ്ക്കു വിശുദ്ധമായിരിക്കണം[b].
