  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל מַעְשַׂ֨ר הָ/אָ֜רֶץ מִ/זֶּ֤רַע הָ/אָ֨רֶץ֙ מִ/פְּרִ֣י הָ/עֵ֔ץ לַ/יהוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: ml
  text: നിലത്തിലെ സകല ദശാംശവും—നിലത്തിലെ വിത്തിൽനിന്നും വൃക്ഷത്തിന്റെ ഫലത്തിൽനിന്നും ഉള്ളത്—യഹോവയ്ക്കുള്ളതാണ്; അത് യഹോവയ്ക്കു വിശുദ്ധമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל מַעְשַׂר הָאָרֶץ
  choice: നിലത്തിലെ ദശാംശമെല്ലാം
  rationale: ഏകവചന നാമത്തോടുള്ള כָל ഇവിടെ സമഗ്രമായ/വിതരണാത്മകമായ അർഥം നൽകുന്നു. കാർഷികസന്ദർഭത്തിൽ הָאָרֶץ എന്നത് ഭൂലോകമല്ല, വിളവുതരുന്ന നിലമാണ്. ‘ദശാംശം’ ആരാധനാസംബന്ധമായ പത്തിലൊന്നിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִזֶּרַע הָאָרֶץ
  choice: നിലത്തിലെ വിത്തിൽനിന്നായാലും
  rationale: ‘വിത്ത്’ എന്ന എബ്രായ ദൃശ്യരൂപം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള വൃക്ഷഫലത്തോടുള്ള സമാന്തരതയും സംരക്ഷിക്കുന്നു. ആയാലും…ആയാലും എന്ന ഘടന ഉറവിടങ്ങളുടെ പരിധി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִפְּרִי הָעֵץ
  choice: വൃക്ഷത്തിന്റെ ഫലത്തിൽനിന്നായാലും
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘വൃക്ഷം’ വർഗസൂചകമായി നിലനിർത്തിയിരിക്കുന്നു; ‘ഫലം’ എന്ന നേരിട്ടുള്ള കാർഷികപദവും സംരക്ഷിക്കുന്നു.
- source_word: לַיהוָה הוּא
  choice: യഹോവയ്ക്കുള്ളതാണ്
  rationale: לְ ഇവിടെ ഉടമസ്ഥതയും സമർപ്പണവും ഉൾക്കൊള്ളുന്നു. ‘യഹോവയ്ക്കുള്ളതാണ്’ ഈ രണ്ടിനെയും അമിതമായി വേർതിരിക്കാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: קֹדֶשׁ לַיהוָה
  choice: യഹോവയ്ക്കു വിശുദ്ധമാണ്
  rationale: യഹോവയ്ക്കായി വേർതിരിക്കപ്പെട്ടതെന്ന ആരാധനാസംബന്ധമായ അർഥം ‘വിശുദ്ധം’ സംരക്ഷിക്കുന്നു. എബ്രായത്തിൽ അതിശയോക്തിരൂപമില്ലാത്തതിനാൽ ‘അതിവിശുദ്ധം’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപം ഉപയോഗിച്ചു.
- issue: לַיהוָה എന്ന പ്രയോഗത്തിലെ ഉടമസ്ഥതയും സമർപ്പണവും
  choice: യഹോവയ്ക്കുള്ളതാണ്
  alternative: യഹോവയുടേതാണ് / യഹോവയ്ക്കായുള്ളതാണ്
  rationale: לְ എന്ന മുൻപ്രത്യയം ഇവിടെ ഉടമസ്ഥതയെയും ആരാധനാപരമായ സമർപ്പണത്തെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഈ ബന്ധത്തെ തുറന്നുവെക്കുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ പദാനുപദമായ ഉടമസ്ഥതാരൂപം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ കാർഷിക ദൃശ്യരൂപങ്ങളും ‘വിശുദ്ധം’ എന്ന ആരാധനാസംബന്ധമായ പദവും നിലനിർത്തി; ഇടവരകൾ ഘടകവാക്യം വായിക്കാൻ സഹായിക്കുന്നു.
