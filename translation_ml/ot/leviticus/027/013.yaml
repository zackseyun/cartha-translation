translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘വീണ്ടെടുക്കുകതന്നെ’ എന്ന പ്രയോഗം ഹീബ്രുവിലെ യഥാർഥ ഊന്നൽ നിലനിർത്തുന്നു; സാങ്കേതികമായ ‘മൂല്യനിർണയം’ ലേവ്യപുസ്തകം 27-ലെ പുരോഹിത വിലനിർണയസന്ദർഭത്തിന് യോജിക്കുന്നു.
