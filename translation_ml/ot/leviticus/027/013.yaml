  yaml_path: translation/ot/leviticus/027/013.yaml
  text: But if he does redeem it[a], then he shall add a fifth to your valuation.
translation:
  language: ml
  text: എന്നാൽ അവൻ അതിനെ തീർച്ചയായും വീണ്ടെടുക്കുന്നുവെങ്കിൽ[a], നിന്റെ മൂല്യനിർണയത്തുകയ്ക്ക് അഞ്ചിലൊന്ന് കൂടി ചേർക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൻ അതിനെ വീണ്ടെടുക്കുന്നുവെങ്കിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രുവിൽ ക്രിയയ്ക്ക് ഊന്നൽ നൽകാൻ ഒരേ ക്രിയയുടെ അനന്തക്രിയാരൂപവും (infinitive absolute) രൂപാന്തരപ്പെട്ട ക്രിയയും ഒരുമിച്ച് ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ചെയ്യുന്നെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ നിയമനിർദേശത്തോടുള്ള വ്യത്യസ്ത സാഹചര്യം അവതരിപ്പിക്കുന്ന നിബന്ധനയായതിനാൽ ‘എന്നാൽ ... എങ്കിൽ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: അവൻ അതിനെ വീണ്ടെടുക്കുകതന്നെ ചെയ്യുന്നെങ്കിൽ
  rationale: גאל എന്ന ക്രിയയുടെ infinitive absolute + finite verb ഘടനയിലെ ഊന്നൽ ‘-തന്നെ’ വഴി നിലനിർത്തുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുൻവാക്യത്തിലെ മൃഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിനെ’ എന്നു നൽകി.
- source_word: וְיָסַף
  choice: കൂടി ചേർക്കണം
  rationale: നിയമസന്ദർഭത്തിലെ നിർബന്ധിത ഫലവും കൂട്ടിച്ചേർക്കലിന്റെ ആശയവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: חֲמִישִׁתוֹ
  choice: അതിന്റെ അഞ്ചിലൊന്നു
  rationale: അഞ്ചിലൊന്ന് എന്ന അനുപാതവും ഹീബ്രു പ്രത്യയവും വ്യക്തമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് മൂല്യനിർണയത്തോടു ചേർക്കേണ്ട അധികവിഹിതമാണ്.
- source_word: עַל עֶרְכֶּךָ
  choice: നിന്റെ മൂല്യനിർണയത്തോടുകൂടെ
  rationale: עַל ഇവിടെ വിലയിരുത്തിയ തുകയ്ക്കു മുകളിലായി ചേർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയം ‘നിന്റെ’ എന്നു നേരിട്ട് നിലനിർത്തി.
