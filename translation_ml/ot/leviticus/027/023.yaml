- from: അപ്പോൾ പുരോഹിതൻ അവനുവേണ്ടി, യോബേൽവർഷംവരെയുള്ള നിന്റെ മൂല്യനിർണയത്തുകയുടെ വിഹിതം കണക്കാക്കണം. അവൻ[a] ആ തുക അന്നുതന്നെ യഹോവയ്ക്കുള്ള വിശുദ്ധ വഴിപാടായി[b] നൽകണം.
  to: അപ്പോൾ പുരോഹിതൻ അവനുവേണ്ടി യോബേൽവർഷം വരെയുള്ള നിന്റെ മൂല്യനിർണയത്തുകയുടെ വിഹിതം കണക്കാക്കണം. അവൻ[a] ആ തുക അന്നുതന്നെ യഹോവയ്ക്കുള്ള വിശുദ്ധ വഴിപാടായി[b] നൽകണം.
