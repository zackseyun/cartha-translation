source:
  edition: WLC
  text: וְ/חִשַּׁב ל֣/וֹ הַ/כֹּהֵ֗ן אֵ֚ת מִכְסַ֣ת הָֽ/עֶרְכְּ/ךָ֔ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נָתַ֤ן אֶת הָ/עֶרְכְּ/ךָ֙ בַּ/יּ֣וֹם הַ/ה֔וּא קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: ml
  text: അപ്പോൾ പുരോഹിതൻ അവനുവേണ്ടി യോബേൽവർഷം വരെയുള്ള നിന്റെ മൂല്യനിർണയത്തുകയുടെ വിഹിതം കണക്കാക്കണം. അവൻ[a] ആ തുക അന്നുതന്നെ യഹോവയ്ക്കുള്ള വിശുദ്ധ വഴിപാടായി[b] നൽകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ഈ ക്രിയയുടെ കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല. സന്ദർഭത്തിൽ, വയൽ സമർപ്പിച്ച വ്യക്തിയെയാണ് സാധാരണയായി ഉദ്ദേശിക്കുന്നത്; വ്യാകരണപരമായി പുരോഹിതനെയും കർത്താവായി മനസ്സിലാക്കാൻ കഴിയും.
    reason: source_ambiguity
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യഹോവയ്ക്കു വിശുദ്ധമായത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: അപ്പോൾ ... കണക്കാക്കണം
  rationale: פיעל രൂപത്തിലുള്ള חשׁב ഇവിടെ ഒരു തുക കണക്കാക്കുക എന്ന അർഥത്തിലാണ്. തുടർച്ച സൂചിപ്പിക്കുന്ന וְ സ്വാഭാവിക മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: לּוֹ
  choice: അവനുവേണ്ടി
  rationale: പുരോഹിതൻ ബന്ധപ്പെട്ട വ്യക്തിക്കുവേണ്ടി തുക കണക്കാക്കുന്നു എന്ന ദാതൃകപ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: מִכְסַת
  choice: വിഹിതം
  rationale: യോബേൽവർഷംവരെയുള്ള കാലയളവനുസരിച്ച് മൊത്തം മൂല്യത്തിൽനിന്ന് കണക്കാക്കുന്ന അനുപാതിക പങ്കിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הָעֶרְכְּךָ
  choice: നിന്റെ മൂല്യനിർണയത്തുക
  rationale: ലേവ്യർ 27-ലെ സാങ്കേതിക മൂല്യനിർണയഭാവവും രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയവും നിലനിർത്തുന്നു; ‘തുക’ ചേർക്കുന്നത് പണമടയ്ക്കുന്ന സന്ദർഭം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: യോബേൽവർഷംവരെ
  rationale: അനുപാതിക കണക്കിന്റെ അവസാനപരിധി നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: וְנָתַן
  choice: അവൻ ... നൽകണം
  rationale: נתן എന്നതിന്റെ വിശാലമായ ‘നൽകുക’ എന്ന അർഥം നിലനിർത്തുന്നു; പണം അടയ്ക്കുക എന്നതിലേക്കോ സമർപ്പിക്കുക എന്നതിലേക്കോ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നുതന്നെ
  rationale: ‘ആ ദിവസം’ എന്ന സമയസൂചനയെ സ്വാഭാവികവും ഊന്നലുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: קֹדֶשׁ לַיהוָה
  choice: യഹോവയ്ക്കുള്ള വിശുദ്ധ വഴിപാടായി
  rationale: അക്ഷരാർഥം ‘യഹോവയ്ക്കു വിശുദ്ധമായത്’ എന്നാണ്. ഇവിടെ നൽകപ്പെടുന്ന തുക ദൈവത്തിനു വേർതിരിക്കപ്പെട്ടതാണെന്ന ആരാധനാസംബന്ധമായ ആശയം ‘വഴിപാട്’ വഴി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു; ഒരു പദവിപ്പേരായി മാറ്റുന്നില്ല.
theological_decisions:
- issue: וְנָתַן എന്ന ക്രിയയുടെ മറഞ്ഞിരിക്കുന്ന കർത്താവ്
  choice: പ്രധാനവാചകത്തിൽ ‘അവൻ’ എന്നു നൽകി, വ്യക്തിയെ വ്യക്തമാക്കാതെ എബ്രായത്തിലെ വ്യാകരണപരമായ അനിശ്ചിതത്വം നിലനിർത്തി
  alternative: വയൽ സമർപ്പിച്ച വ്യക്തിയാണ് നൽകുന്നത് എന്ന് തുറന്നുപറയുക; അല്ലെങ്കിൽ സമീപസ്ഥനായ പുരോഹിതനെയാണ് കർത്താവായി വായിക്കുക
  rationale: സന്ദർഭം വയൽ സമർപ്പിച്ച വ്യക്തിയെയാണ് പണം നൽകുന്നവനായി ശക്തമായി സൂചിപ്പിക്കുന്നത്; എന്നാൽ എബ്രായത്തിൽ കർത്താവ് തുറന്നുപറയുന്നില്ല. അതിനാൽ വിവർത്തനത്തിൽ അതിനെ നിശ്ശബ്ദമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
- issue: קֹדֶשׁ לַיהוָה എന്നതിന്റെ അവതരണം
  choice: ‘യഹോവയ്ക്കുള്ള വിശുദ്ധ വഴിപാടായി’
  alternative: ‘യഹോവയ്ക്കു വിശുദ്ധമായത്’
  rationale: ‘വഴിപാട്’ ആരാധനാസംബന്ധമായ സമർപ്പണഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘മൂല്യനിർണയത്തുക’, ‘വിഹിതം’ എന്നീ പദങ്ങൾ സാമ്പത്തികവും ആചാരപരവുമായ കൃത്യത സംരക്ഷിക്കുന്നു. എബ്രായത്തിലെ മറഞ്ഞിരിക്കുന്ന കർത്താവിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
