source:
  edition: WLC
  text: וְ/אִ֨ם בַּ/בְּהֵמָ֤ה הַ/טְּמֵאָה֙ וּ/פָדָ֣ה בְ/עֶרְכֶּ֔/ךָ וְ/יָסַ֥ף חֲמִשִׁת֖/וֹ עָלָ֑י/ו וְ/אִם לֹ֥א יִגָּאֵ֖ל וְ/נִמְכַּ֥ר בְּ/עֶרְכֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: ml
  text: എന്നാൽ അത് ആചാരപരമായി അശുദ്ധമായ മൃഗവർഗത്തിൽപ്പെട്ടതാണെങ്കിൽ[a], അത് നിന്റെ വിലമതിപ്പനുസരിച്ച് വീണ്ടെടുക്കാം; അതിന്റെ അഞ്ചിലൊന്ന് അതിനോടു കൂടി ചേർക്കണം[b]. അത് വീണ്ടെടുക്കപ്പെട്ടില്ലെങ്കിൽ, നിന്റെ വിലമതിപ്പനുസരിച്ച് അത് വിൽക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആചാരപരമായി അശുദ്ധമായ കന്നുകാലിവർഗത്തിൽപ്പെട്ടതാണെങ്കിൽ.’ ഹീബ്രു പ്രയോഗം ആചാരപരമായി അശുദ്ധമെന്ന് കണക്കാക്കപ്പെട്ട മൃഗവർഗത്തിൽപ്പെട്ട ഒന്നിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അതിന്റെ അഞ്ചിലൊന്ന് അതിന്മേൽ കൂട്ടിച്ചേർക്കണം’; അതായത്, നിശ്ചയിച്ച വിലമതിപ്പിനോടു ഇരുപത് ശതമാനം കൂടി ചേർക്കണം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: ആചാരപരമായി അശുദ്ധമായ മൃഗങ്ങളുടെ കൂട്ടത്തിൽപ്പെട്ടത്
  rationale: בְּהֵמָה ഇവിടെ മൃഗം/കന്നുകാലി എന്ന വർഗത്തെ സൂചിപ്പിക്കുന്നു; മുൻപറഞ്ഞ നേർച്ചവസ്തു ആചാരപരമായി അശുദ്ധമായ മൃഗവർഗത്തിൽപ്പെടുന്നു എന്ന വർഗീകരണാർഥം വ്യക്തമാക്കുന്നു. 'ആചാരപരമായി' എന്നത് സാധാരണ ശുചിത്വമല്ല, ലേവ്യപുസ്തകത്തിലെ അനുഷ്ഠാനപരമായ അശുദ്ധിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וּפָדָה
  choice: അവന് അതിനെ വീണ്ടെടുക്കാം
  rationale: פדה എന്നത് വില നൽകി തിരികെ സ്വന്തമാക്കുക എന്നർഥം. തുടർന്നുള്ള 'വീണ്ടെടുക്കുന്നില്ലെങ്കിൽ' എന്ന വ്യവസ്ഥ, വീണ്ടെടുക്കൽ ലഭ്യമായ ഒരു ഐച്ഛികമാണെന്ന് സൂചിപ്പിക്കുന്നതിനാൽ നിയമസന്ദർഭത്തിൽ 'വീണ്ടെടുക്കാം' സ്വാഭാവികമാണ്.
- source_word: בְעֶרְכֶּךָ
  choice: നീ നിശ്ചയിച്ച വിലയ്ക്ക്
  rationale: עֵרֶךְ വിലമതിപ്പിനെയോ നിർണയിച്ച മൂല്യത്തെയോ സൂചിപ്പിക്കുന്നു. രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: ആ വിലയുടെ അഞ്ചിലൊന്നുകൂടെ അതിനോടു ചേർക്കണം
  rationale: ഹീബ്രു പ്രയോഗം നിശ്ചയിച്ച വിലയ്ക്കുമുകളിൽ ഇരുപത് ശതമാനം കൂടി നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. 'ആ വിലയുടെ' എന്ന് ചേർത്തത് അഞ്ചിലൊന്ന് ഏതിന്റേതാണെന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: וְאִם לֹא יִגָּאֵל
  choice: അതിനെ വീണ്ടെടുക്കുന്നില്ലെങ്കിൽ
  rationale: നിഫാൽ രൂപം കർത്താവിനെ വ്യക്തമാക്കാതെ വിടുന്നു; മലയാളത്തിലും കർത്താവിനെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ നിയമവ്യവസ്ഥ നിലനിർത്തുന്നു.
- source_word: וְנִמְכַּר
  choice: അതിനെ വിൽക്കണം
  rationale: നിഫാൽ രൂപത്തിന്റെ നിയമപരമായ കർമണി നിർദേശാർഥം സ്വാഭാവികമായ മലയാള നിയമശൈലിയിൽ നൽകുന്നു.
theological_decisions:
- issue: അശുദ്ധി എന്നതിന്റെ സ്വഭാവം
  choice: ആചാരപരമായി അശുദ്ധമായ
  alternative: അശുദ്ധമായ
  rationale: ഈ സന്ദർഭത്തിലെ טָמֵא ധാർമ്മിക മലിനതയെയോ ദേഹശുചിത്വക്കുറവിനെയോ അല്ല, യാഗാർപ്പണത്തിന് യോഗ്യമല്ലാത്ത ആചാരപരമായ വർഗത്തെ സൂചിപ്പിക്കുന്നു.
- issue: വീണ്ടെടുക്കൽ നിർബന്ധമോ ഐച്ഛികമോ
  choice: വീണ്ടെടുക്കാം
  alternative: വീണ്ടെടുക്കണം
  rationale: നിയമശൈലിയിലെ ക്രിയാരൂപം നിർദേശാർഥമായി വായിക്കാനാകുമെങ്കിലും, ഉടനെ വരുന്ന 'വീണ്ടെടുക്കുന്നില്ലെങ്കിൽ' എന്ന സാധ്യത വീണ്ടെടുക്കൽ നിർബന്ധമല്ലെന്ന വായനയെ ശക്തിപ്പെടുത്തുന്നു. ഈ ബന്ധം വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ നിയമ-ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. 'നീ നിശ്ചയിച്ച വില' എന്ന പ്രയോഗം പുരോഹിതനോടുള്ള ഹീബ്രു രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധന നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
