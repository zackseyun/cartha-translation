source:
  edition: WLC
  text: לֹ֧א יְבַקֵּ֛ר בֵּֽין ט֥וֹב לָ/רַ֖ע וְ/לֹ֣א יְמִירֶ֑/נּוּ וְ/אִם הָמֵ֣ר יְמִירֶ֔/נּוּ וְ/הָֽיָה ה֧וּא וּ/תְמוּרָת֛/וֹ יִֽהְיֶה קֹ֖דֶשׁ לֹ֥א יִגָּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: ml
  text: അത് നല്ലതോ ചീത്തയോ എന്ന് അവൻ പരിശോധിക്കരുത്[a]; അതിനു പകരം മറ്റൊന്നിനെ വെക്കുകയും അരുത്. എന്നാൽ അവൻ അതിനെ മാറ്റുക തന്നെ ചെയ്താൽ[b], അതും അതിനു പകരം വെച്ചതും വിശുദ്ധമായിരിക്കും; അത് വീണ്ടെടുക്കപ്പെടരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നല്ലതിനും ചീത്തയ്ക്കും ഇടയിൽ പരിശോധിക്കരുത്.’ ദശാംശത്തിനായി കടന്നുപോകുന്ന മൃഗങ്ങളിൽ ഗുണനിലവാരം നോക്കി വേർതിരിക്കുന്നതിനെ ഈ എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ ക്രിയയ്ക്ക് ഊന്നലുണ്ട്: ‘മാറ്റുക തന്നെ ചെയ്താൽ’ അഥവാ ‘തീർച്ചയായും മാറ്റിയാൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר / בֵּין טוֹב לָרַע
  choice: അത് നല്ലതോ ചീത്തയോ എന്ന് പരിശോധിക്കരുത്
  rationale: പശുക്കളുടെ ദശാംശത്തിൽ മൃഗത്തിന്റെ ഗുണനിലവാരം പരിശോധിച്ച് തിരഞ്ഞെടുക്കുന്നതിനെയാണ് പീയേൽ ക്രിയയും ‘നല്ലതിനും ചീത്തയ്ക്കും ഇടയിൽ’ എന്ന എബ്രായ പ്രയോഗവും സൂചിപ്പിക്കുന്നത്. സ്വാഭാവിക മലയാളത്തിൽ ഈ നിയമാർഥം വ്യക്തമാക്കുന്നു.
- source_word: יְמִירֶנּוּ
  choice: അതിനെ മറ്റൊന്നുമായി മാറ്റുകയുമരുത്
  rationale: നേർന്നതോ ദശാംശമായി വേർതിരിച്ചതോ ആയ മൃഗത്തിന് പകരം മറ്റൊരു മൃഗത്തെ വെക്കുക എന്ന സാങ്കേതിക നിയമാർഥം ‘മാറ്റുക’ എന്ന ക്രിയയിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָמֵר יְמִירֶנּוּ
  choice: അതിനെ മാറ്റുകതന്നെ ചെയ്താൽ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്നുള്ള എബ്രായ ഊന്നൽ ‘മാറ്റുകതന്നെ ചെയ്താൽ’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: תְמוּרָתוֹ
  choice: അതിനു പകരം വെച്ചത്
  rationale: ആദ്യത്തെ മൃഗത്തിന്റെ സ്ഥാനത്ത് വെച്ച പകരമൃഗമാണ് ഉദ്ദേശ്യം; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗമാണിത്.
- source_word: קֹדֶשׁ
  choice: വിശുദ്ധമായിരിക്കും
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ആരാധനാപരമായ നിലയെ ലേവ്യപുസ്തകത്തിന്റെ വിശുദ്ധതാ ഭാഷയ്ക്ക് യോജിച്ചവിധം നിലനിർത്തുന്നു.
- source_word: לֹא יִגָּאֵל
  choice: അവയെ വീണ്ടെടുക്കാൻ പാടില്ല
  rationale: സമർപ്പിത നിലയിൽനിന്ന് വിലകൊടുത്ത് തിരികെ നേടുന്നതിനെ സൂചിപ്പിക്കുന്ന ആരാധനാ-നിയമ പദമാണ് ‘വീണ്ടെടുക്കുക’. മുൻവാക്യത്തിൽ രണ്ടു മൃഗങ്ങളും വിശുദ്ധമാകുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചന കർമം വ്യക്തമാക്കി.
theological_decisions:
- issue: സമർപ്പണഭാഷയുടെ ആരാധനാ-നിയമ ശക്തി
  choice: קֹדֶשׁ എന്നത് ‘വിശുദ്ധം’ എന്നും גאל എന്നത് ‘വീണ്ടെടുക്കുക’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പവിത്രം’, ‘വിലകൊടുത്ത് തിരികെ വാങ്ങുക’ എന്നിങ്ങനെ കൂടുതൽ വിശദീകരണാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം ഇസ്രായേലിന്റെ ആരാധനാനിയമത്തിൽ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട മൃഗങ്ങളെക്കുറിച്ചാണ്. ഈ പദങ്ങൾ പിന്നീടുള്ള പ്രത്യേക സിദ്ധാന്തം അടിച്ചേൽപ്പിക്കാതെ മൂലത്തിലെ ദൈവാരാധനാപരമായ ഭാരം നിലനിർത്തുന്നു.
- issue: അവസാന നിരോധനത്തിന്റെ വചനസംബന്ധിയായ എണ്ണം
  choice: ‘അവയെ വീണ്ടെടുക്കാൻ പാടില്ല’ എന്ന ബഹുവചനം ഉപയോഗിച്ചു.
  alternative: എബ്രായത്തിലെ ഏകവചന രൂപം കൂടുതൽ ഔപചാരികമായി പിന്തുടർന്ന് ‘അത് വീണ്ടെടുക്കപ്പെടരുത്’ എന്നു നൽകുക.
  rationale: അടുത്തുള്ള ‘അതും അതിനു പകരം വെച്ചതും’ എന്ന രണ്ടു മൃഗങ്ങളെയാണ് വിശുദ്ധമെന്ന് പ്രഖ്യാപിക്കുന്നത്; നിരോധനം രണ്ടിനും ബാധകമെന്ന സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. എബ്രായ ക്രിയ വ്യാകരണപരമായി ഏകവചനമാണെന്ന രൂപപരമായ സൂക്ഷ്മത അടിക്കുറിപ്പിലൂടെ അറിയിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. ‘വിശുദ്ധം’, ‘വീണ്ടെടുക്കുക’ എന്നീ പദങ്ങൾ ലേവ്യപുസ്തകത്തിലെ ആരാധനാപരമായ പദസമ്പത്ത് നിലനിർത്തുന്നു; അപരിചിതമായ സംസ്കൃതബഹുലതയും വിഭാഗീയ വ്യാഖ്യാനവും ഒഴിവാക്കി.
