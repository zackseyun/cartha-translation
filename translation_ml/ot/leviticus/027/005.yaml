id: LEV.27.5
reference: Leviticus 27:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: ml
  text: അഞ്ചു വയസ്സുമുതൽ ഇരുപതു വയസ്സുവരെ പ്രായമുള്ള ആളാണെങ്കിൽ, നീ നിശ്ചയിക്കേണ്ട മൂല്യം ആണിന് ഇരുപതു ശേക്കേലും പെണ്ണിന് പത്തു ശേക്കേലും ആയിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: ആളാണെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ വ്യവസ്ഥകളോടുള്ള തുടർച്ച മലയാളത്തിലെ സോപാധിക ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; പ്രായപരിധി വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആൾ’ ചേർത്തു.
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: അഞ്ചു വയസ്സുമുതൽ ഇരുപതു വയസ്സുവരെയുള്ള
  rationale: ഹീബ്രായ പ്രായപ്രയോഗത്തെയും ഉൾക്കൊള്ളുന്ന പ്രായപരിധിയെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהָיָה
  choice: ആയിരിക്കണം
  rationale: നിയമപരവും നിർദേശാത്മകവുമായ ബലം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֶרְכְּךָ
  choice: നിന്റെ മൂല്യനിർണയം
  rationale: നേർച്ചയുമായി ബന്ധപ്പെട്ട് നിശ്ചയിക്കുന്ന മൂല്യവും രണ്ടാംപുരുഷ ഏകവചന സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: הַזָּכָר
  choice: ആണിന്
  rationale: ഏകവചനത്തിലുള്ള ജൈവലിംഗ വർഗ്ഗത്തെ നിയമപ്പട്ടികയിലെ വിഭാഗമായി സംക്ഷിപ്തമായി നൽകുന്നു; ‘പുരുഷന്’ എന്ന സാമൂഹികമായി കൂടുതൽ നിർദ്ദിഷ്ടമായ പദം ഒഴിവാക്കുന്നു.
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: ഇരുപതു ശേക്കേൽ
  rationale: ചരിത്രപരമായ തൂക്ക/മൂല്യ ഏകകം ആധുനിക നാണയത്തിലേക്ക് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: וְלַנְּקֵבָה
  choice: പെണ്ണിന്
  rationale: ആൺ–പെൺ എന്ന സമാന്തരമായ ഏകവചന വർഗ്ഗീകരണം സംരക്ഷിക്കുന്നു.
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: പത്തു ശേക്കേൽ
  rationale: സംഖ്യയും ചരിത്രപരമായ ഏകകവും നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ആൺ–പെൺ അടിസ്ഥാനത്തിലുള്ള നേർച്ചാമൂല്യ വിഭാഗങ്ങളുടെ വിവർത്തനം
  choice: ആണിന് ... പെണ്ണിന്
  alternative: പുരുഷന് ... സ്ത്രീക്ക്; ഒരു ആണിന് ... ഒരു പെണ്ണിന്
  rationale: ഹീബ്രായം സാമൂഹിക കൂട്ടങ്ങളെക്കാൾ ഏകവചനത്തിലുള്ള ലിംഗവിഭാഗങ്ങളെയാണ് നിയമപരമായ മൂല്യപ്പട്ടികയിൽ സൂചിപ്പിക്കുന്നത്. ഈ രൂപം അതിനെ നിലനിർത്തുകയും വാക്യത്തിനപ്പുറമുള്ള സാമൂഹികമോ സിദ്ധാന്തപരമോ ആയ നിഗമനങ്ങൾ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമനിർദേശ ശൈലി. ‘ശേക്കേൽ’ ചരിത്രപരമായ അളവായി നിലനിർത്തി; അനാവശ്യ സാങ്കേതികത ഒഴിവാക്കി.
