  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: ml
  text: യഹോവയ്ക്കു വഴിപാട് അതിൽനിന്ന് അർപ്പിക്കുന്ന ഒരു മൃഗമാണെങ്കിൽ[a], അതിൽനിന്ന് യഹോവയ്ക്കു കൊടുക്കുന്നതെല്ലാം വിശുദ്ധമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹോവയ്ക്കു വഴിപാടായി അർപ്പിക്കാവുന്ന ഒരു മൃഗമാണെങ്കിൽ.” എബ്രായപ്രയോഗം യഹോവയ്ക്കു വഴിപാട് അർപ്പിക്കുന്ന മൃഗവർഗത്തെ സൂചിപ്പിക്കുന്നതായും, അതിൽനിന്ന് യഥാർഥത്തിൽ ഒരു വഴിപാട് അർപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ആണെങ്കിൽ
  rationale: നിയമവ്യവസ്ഥയിലെ സോപാധികമായ തുടർച്ച സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; മുൻവാക്യത്തോടുള്ള ബന്ധം വാക്യക്രമത്തിൽ വ്യക്തമാകുന്നു.
- source_word: בְּהֵמָה
  choice: മൃഗം
  rationale: ഇവിടെ യാഗസന്ദർഭത്തിലുള്ള പൊതുവായ മൃഗവർഗത്തെ സൂചിപ്പിക്കുന്ന വിശാലവും ആധുനികവുമായ പദം.
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה
  choice: യഹോവയ്ക്ക് വഴിപാടായി അർപ്പിക്കുന്ന തരത്തിലുള്ള
  rationale: יַקְרִיבוּ എന്നതിന്റെ യാഗപരമായ ‘അർപ്പിക്കുക/അടുത്തുകൊണ്ടുവരുക’ എന്ന അർഥവും מִמֶּנָּה സൃഷ്ടിക്കുന്ന വർഗപരമായ ബന്ധവും നിലനിർത്തുന്നു; എബ്രായപ്രയോഗത്തിലെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: קָרְבָּן
  choice: വഴിപാട്
  rationale: ദൈവത്തിന് അർപ്പിക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന യാഗപരമായ മലയാളപദം.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כֹּל אֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: അതിൽനിന്ന് യഹോവയ്ക്ക് കൊടുക്കുന്നതെല്ലാം
  rationale: ഏകവചന മൃഗത്തെ സൂചിപ്പിക്കുന്ന מִמֶּנּוּ-വും പൊതുവായ കർത്തൃപ്രയോഗമുള്ള יִתֵּן-വും ലിംഗനിർണ്ണയം ചേർക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יִהְיֶה קֹדֶשׁ
  choice: വിശുദ്ധമായിരിക്കണം
  rationale: യാഗനിയമത്തിലെ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശുദ്ധസ്ഥിതി നിലനിർത്തുകയും നിയമപരമായ നിർബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ് / യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാൽ പകരാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: יִהְיֶה קֹדֶשׁ എന്നതിലെ വിശുദ്ധത
  choice: വിശുദ്ധമായിരിക്കണം
  alternative: വിശുദ്ധമായിത്തീരും / വിശുദ്ധമായിരിക്കും
  rationale: യാഗവസ്തു ദൈവത്തിനായി വേർതിരിക്കപ്പെടുന്ന നിയമപരവും ആരാധനാപരവുമായ നില സൂചിപ്പിക്കുന്നു; ധാർമ്മിക നിർമലത മാത്രമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമ-ആരാധനാ ശൈലി. മൂലപാഠത്തിലെ വ്യാഖ്യാനസാധ്യത പ്രധാനവാചകവും അടിക്കുറിപ്പും ചേർത്ത് സംരക്ഷിച്ചിരിക്കുന്നു.
