    rationale: יִהְיֶה קֹדֶשׁ is most directly rendered ‘will/shall be holy.’ In this legal context it has binding force, but ‘വിശുദ്ധമായിരിക്കും’ preserves the form without unnecessarily recasting it as an imperative.
