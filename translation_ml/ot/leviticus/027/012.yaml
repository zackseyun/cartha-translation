language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֶעֱרִ֤יךְ הַ/כֹּהֵן֙ אֹתָ֔/הּ בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כְּ/עֶרְכְּ/ךָ֥ הַ/כֹּהֵ֖ן כֵּ֥ן יִהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/012.yaml
  text: and the priest shall assess it[a], whether good or bad; as the priest assesses it, so it shall be.
translation:
  language: ml
  text: പുരോഹിതൻ അതിനെ നല്ലതോ മോശമോ എന്നു വിലയിരുത്തണം; പുരോഹിതാ, നീ നിശ്ചയിക്കുന്ന വിലപ്രകാരംതന്നെ അതായിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: വിലയിരുത്തണം
  rationale: നേർച്ചയായി സമർപ്പിച്ച മൃഗത്തിന്റെ മൂല്യം ഔദ്യോഗികമായി നിശ്ചയിക്കുന്ന പുരോഹിതന്റെ പ്രവൃത്തിയെയാണ് ഇവിടെ ഹിഫ്ഈൽ രൂപം സൂചിപ്പിക്കുന്നത്; നിയമനിർദേശത്തിന്റെ സ്വരം ‘ണം’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ യാജകസംബന്ധമായ നിയമഭാഷയ്ക്ക് ചേരുന്ന സാധാരണ മലയാളപദം.
- source_word: אֹתָהּ
  choice: അതിനെ
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം സന്ദർഭത്തിലെ മൃഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി നപുംസകലിംഗരൂപം ഉപയോഗിക്കുന്നു.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: നല്ലതോ മോശമോ എന്നു
  rationale: മൃഗത്തിന്റെ ഗുണനിലവാരം വിലയിരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം.
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: പുരോഹിതനായ നീ നിശ്ചയിക്കുന്ന വില
  rationale: כְּעֶרְכְּךָ എന്നതിലെ രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം മറച്ചുവയ്ക്കാതെ, പിന്നാലെയുള്ള ‘പുരോഹിതൻ’ എന്ന അഭിസംബോധനയുമായി ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: כֵּן יִהְיֶה
  choice: വിലതന്നെ അതിനുണ്ടായിരിക്കണം
  rationale: പുരോഹിതൻ നിശ്ചയിക്കുന്ന വിലയാണ് പ്രാബല്യത്തിൽ വരേണ്ടത് എന്ന നിയമപരമായ അർഥം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
