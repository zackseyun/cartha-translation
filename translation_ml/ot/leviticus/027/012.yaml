translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള വ്യക്തവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. എബ്രായത്തിലെ രണ്ടാംപുരുഷ ഏകവചന രൂപം സംരക്ഷിക്കാൻ ‘പുരോഹിതനായ നീ’ ഉപയോഗിച്ചു; മുഖ്യവാചകത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
