  language: ml
  text: എന്നാൽ ഒരാൾ തന്റെ ദശാംശത്തിൽനിന്ന് എന്തെങ്കിലും വീണ്ടെടുക്കുകയാണെങ്കിൽ[a], അതിന് അഞ്ചിലൊന്ന് അധികമായി ചേർക്കണം.
  philosophy: optimal-equivalence
