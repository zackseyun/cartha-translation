reference: Leviticus 27:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם מִ/שְּׁנַ֥ת הַ/יֹּבֵ֖ל יַקְדִּ֣ישׁ שָׂדֵ֑/הוּ כְּ/עֶרְכְּ/ךָ֖ יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/017.yaml
  text: If he consecrates his field from the year of jubilee[a], your valuation shall stand.
translation:
  language: ml
  text: യോബേൽ വർഷം മുതൽ അവൻ തന്റെ വയൽ വിശുദ്ധമായി വേർതിരിക്കുന്നുവെങ്കിൽ[a], നിന്റെ മൂല്യനിർണയം നിലനിൽക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സമർപ്പിക്കുന്നുവെങ്കിൽ.” എബ്രായ ക്രിയയ്ക്ക് ഒരു വസ്തുവിനെ വിശുദ്ധമായി വേർതിരിക്കുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: എങ്കിൽ
  rationale: കേസുനിയമത്തിലെ വ്യവസ്ഥ അവതരിപ്പിക്കുന്ന സാധാരണ സോപാധിക പ്രയോഗം.
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: യോബേൽവർഷംമുതൽ
  rationale: מִן ആരംഭബിന്ദുവിനെ സൂചിപ്പിക്കുന്നു; അടുത്ത യോബേൽവരെ ശേഷിക്കുന്ന കാലത്തെ ആശ്രയിച്ചുള്ള മൂല്യനിർണയസന്ദർഭവുമായി ഇത് യോജിക്കുന്നു.
- source_word: יַקְדִּישׁ
  choice: വിശുദ്ധമായി വേർതിരിക്കുന്നുവെങ്കിൽ
  rationale: קדשׁ എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു വസ്തുവിനെ വിശുദ്ധ ഉപയോഗത്തിനായി മാറ്റിവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ആരാധനാസംബന്ധമായ അർഥം നിലനിർത്തുന്നു.
- source_word: שָׂדֵהוּ
  choice: തന്റെ വയൽ
  rationale: മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തെ സന്ദർഭോചിതമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: כְּעֶרְכְּךָ
  choice: നിന്റെ മൂല്യനിർണയം
  rationale: നിയമസന്ദർഭത്തിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്ന വ്യക്തി നിശ്ചയിക്കുന്ന മൂല്യത്തെ സൂചിപ്പിക്കുന്നു; כְּ ഘടകം തുടർന്നുള്ള יָקוּם സഹിതം മാനദണ്ഡപ്രകാരമുള്ള സാധുത പ്രകടിപ്പിക്കുന്നു.
- source_word: יָקוּם
  choice: അതേപടി നിലനിൽക്കും
  rationale: קום ഇവിടെ നിയമപരമായ സാധുതയെയോ പ്രാബല്യത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഔപചാരികവും വ്യക്തവുമായ നിയമഭാവം നൽകുന്നു.
theological_decisions:
- issue: യഹോവയ്ക്കായി സ്വത്ത് വിശുദ്ധമായി മാറ്റിവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ആരാധനാസംബന്ധമായ ക്രിയ
  choice: വിശുദ്ധമായി വേർതിരിക്കുന്നു
  alternative: സമർപ്പിക്കുന്നു
  rationale: തിരിച്ചുവെക്കലിന്റെ വിശുദ്ധസ്വഭാവം വ്യക്തമായി നിലനിർത്തുകയും ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക അർഥം അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘യോബേൽവർഷം’ ലേവ്യപുസ്തകത്തിലെ സ്ഥാപനപരമായ പദമായി നിലനിർത്തി; ‘അതേപടി നിലനിൽക്കും’ എന്നത് മൂല്യനിർണയത്തിന്റെ നിയമസാധുത വ്യക്തമാക്കുന്നു.
