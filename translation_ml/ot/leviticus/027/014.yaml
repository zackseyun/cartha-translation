id: LEV.27.14
reference: Leviticus 27:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: ml
  text: ഒരാൾ തന്റെ വീട് യഹോവയ്ക്കു വിശുദ്ധമായി സമർപ്പിച്ചാൽ, അതു നല്ലതോ മോശമോ എന്നു നോക്കി പുരോഹിതൻ അതിന്റെ മൂല്യം നിശ്ചയിക്കണം.[a] പുരോഹിതൻ അതിനു നിശ്ചയിക്കുന്ന മൂല്യംതന്നെ നിലനിൽക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നല്ലതോ മോശമോ’ എന്നത് വീടിന്റെ അവസ്ഥയോ ഗുണനിലവാരമോ എന്തായാലും അതനുസരിച്ച് മൂല്യം നിർണയിക്കണമെന്നർത്ഥം.
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: ‘പുരോഹിതൻ അതിനെ എങ്ങനെ വിലയിരുത്തുന്നുവോ അങ്ങനെതന്നെ അത് പ്രാബല്യത്തിൽ ഇരിക്കും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: ഒരാൾ ... സമർപ്പിച്ചാൽ
  rationale: ഇത് ഒരു നിയമസാഹചര്യം അവതരിപ്പിക്കുന്ന സോപാധിക പ്രയോഗമാണ്. ലിംഗസൂചന അനാവശ്യമായി മുൻനിർത്താതെ אִישׁ എന്ന ഏകവചനത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഒരാൾ’ എന്നു നൽകി.
- source_word: יַקְדִּישׁ
  choice: വിശുദ്ധമായി സമർപ്പിച്ചാൽ
  rationale: קדשׁ എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു വസ്തുവിനെ വിശുദ്ധമായ നിലയിൽ ദൈവത്തിനായി വേർതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സമർപ്പിക്കുക’ എന്നതോടൊപ്പം ‘വിശുദ്ധമായി’ ചേർത്തത് ഈ വിശുദ്ധീകരണഭാവം നിലനിർത്തുന്നു.
- source_word: בֵּיתוֹ
  choice: തന്റെ വീട്
  rationale: വിലനിർണയത്തിനു വിധേയമായ കെട്ടിടസ്വത്താണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘ഭവനം’ അല്ലെങ്കിൽ ‘കുടുംബം’ എന്നതിനെക്കാൾ ‘വീട്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: קֹדֶשׁ לַיהוָה
  choice: യഹോവയ്ക്കു വിശുദ്ധമായി
  rationale: വീട് യഹോവയ്ക്കായി വിശുദ്ധമായി വേർതിരിക്കപ്പെടുന്നതാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ദൈവനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹോവ’ എന്നു നൽകി.
- source_word: וְהֶעֱרִיכוֹ הַכֹּהֵן
  choice: പുരോഹിതൻ അതിന്റെ മൂല്യം നിശ്ചയിക്കണം
  rationale: ലേവ്യപുസ്തകം 27-ലെ ערך ഔദ്യോഗികമായ പുരോഹിത മൂല്യനിർണയത്തെ സൂചിപ്പിക്കുന്നു. ആ നിയമപരമായ പ്രവർത്തനം സാധാരണ വായനക്കാർക്കു വ്യക്തമാക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: അതു നല്ലതോ മോശമോ എന്നു നോക്കി
  rationale: വീടിന്റെ അവസ്ഥയോ ഗുണനിലവാരമോ പരിഗണിച്ചുള്ള വിലയിരുത്തലാണ് ഈ ഹെബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർത്ഥം. ‘നല്ലതിനും മോശത്തിനും ഇടയിൽ’ എന്ന പദാനുപദരൂപത്തെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായിട്ടും അർത്ഥം സംരക്ഷിച്ചും നൽകി.
- source_word: כַּאֲשֶׁר יַעֲרִיךְ אֹתוֹ הַכֹּהֵן
  choice: പുരോഹിതൻ അതിനു നിശ്ചയിക്കുന്ന മൂല്യംതന്നെ
  rationale: പുരോഹിതന്റെ നിർണയം അന്തിമമാണെന്ന ആശയം വ്യക്തമാക്കുന്നു; മുൻവാക്യത്തിലെ മൂല്യനിർണയ പദാവലി ആവർത്തിച്ച് ബന്ധം നിലനിർത്തി.
- source_word: כֵּן יָקוּם
  choice: നിലനിൽക്കും
  rationale: קום ഇവിടെ ശാരീരികമായി എഴുന്നേൽക്കുന്നതല്ല, നിശ്ചയിച്ച മൂല്യം സാധുവായും പ്രാബല്യമുള്ളതായും തുടരുന്നതാണ് സൂചിപ്പിക്കുന്നത്. ‘നിലനിൽക്കും’ മൂലത്തിലെ നിയമപ്രയോഗത്തിന്റെ രൂപകഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ നാലക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പൊതുവായ സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- issue: വീടിനെ ‘വിശുദ്ധം’ എന്നു വിളിക്കുന്നതിന്റെ സ്വഭാവം
  choice: യഹോവയ്ക്കു വിശുദ്ധമായി സമർപ്പിക്കൽ
  alternative: യഹോവയ്ക്കു വെറും ദാനമായി നൽകൽ
  rationale: קֹדֶשׁ എന്നത് സാധാരണ ഉടമസ്ഥത കൈമാറ്റം മാത്രമല്ല, വിശുദ്ധമായി വേർതിരിച്ച നിലയെ സൂചിപ്പിക്കുന്നു. എന്നാൽ വീടിന് സ്വതവേയുള്ള ആരാധ്യസ്വഭാവം ആരോപിക്കാതെ സമർപ്പണത്തിന്റെ നിലയായി ഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. പദാനുപദമായ അസ്വാഭാവികത ഒഴിവാക്കിയെങ്കിലും വിശുദ്ധസമർപ്പണം, പുരോഹിതന്റെ ഔദ്യോഗിക മൂല്യനിർണയം, അതിന്റെ നിർണായക പ്രാബല്യം എന്നീ മൂലഘടകങ്ങൾ നിലനിർത്തി.
