  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם נְקֵבָ֖ה הִ֑וא וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ שְׁלֹשִׁ֥ים שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/004.yaml
  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: ml
  text: എന്നാൽ സ്ത്രീയാണെങ്കിൽ, നീ നിശ്ചയിക്കേണ്ട മൂല്യം മുപ്പത് ശേക്കെൽ ആയിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ആണെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ പുരുഷനെ സംബന്ധിച്ച സാഹചര്യത്തോട് വിരുദ്ധമായ അടുത്ത സാഹചര്യം അവതരിപ്പിക്കുന്ന സംയോജകവും ഉപാധിസൂചകവുമാണ്; ആ സന്ദർഭവ്യത്യാസം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נְקֵבָה הִוא
  choice: പെൺവ്യക്തിയാണെങ്കിൽ
  rationale: נְקֵבָה സ്ത്രീലിംഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ഇവിടെ മനുഷ്യരുടെ നേർച്ചമൂല്യനിർണയമാണ് സന്ദർഭം. ‘സ്ത്രീയാണെങ്കിൽ’ എന്നതിനെക്കാൾ പ്രായഭേദമില്ലാത്ത അർഥം നിലനിർത്താൻ ‘പെൺവ്യക്തി’ ഉപയോഗിച്ചു.
- source_word: וְהָיָה
  choice: ആയിരിക്കണം
  rationale: നിയമനിർദേശത്തിലെ ഫലവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ ബാധ്യതാസ്വരത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: עֶרְכְּךָ
  choice: നിന്റെ മൂല്യനിർണയം
  rationale: ലേവ്യപുസ്തകം 27-ലെ നേർച്ചയുമായി ബന്ധപ്പെട്ട് നിശ്ചയിക്കുന്ന ഔദ്യോഗിക മൂല്യത്തെയും രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയത്തെയും സംരക്ഷിക്കുന്നു.
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: മുപ്പത് ശേക്കെൽ
  rationale: സംഖ്യ കൃത്യമായി നിലനിർത്തുകയും അളവുമൂല്യമായ ശേക്കെൽ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘വെള്ളി’ ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ. മുൻവാക്യത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ടും ഉപാധി–ഫലം ഘടന ‘ആണെങ്കിൽ ... ആയിരിക്കണം’ കൊണ്ടും വ്യക്തമാക്കിയിരിക്കുന്നു.
