id: LEV.27.2
reference: Leviticus 27:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אִ֕ישׁ כִּ֥י יַפְלִ֖א נֶ֑דֶר בְּ/עֶרְכְּ/ךָ֥ נְפָשֹׁ֖ת לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക: ഒരാൾ യഹോവയ്ക്കായി വ്യക്തികളുടെ മൂല്യനിർണയം ഉൾക്കൊള്ളുന്ന ഒരു പ്രത്യേക നേർച്ച നേർന്നാൽ,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത മറ്റൊരു പരിഭാഷ: “ഒരാൾ യഹോവയ്ക്കായി വ്യക്തികളെക്കുറിച്ച് നിന്റെ മൂല്യനിർണയപ്രകാരം ഒരു അസാധാരണ നേർച്ച നേർന്നാൽ.” “നിന്റെ മൂല്യനിർണയം” ഉൾപ്പെടുന്ന എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; തുടർന്നുള്ള വാക്യങ്ങൾ വ്യക്തികൾക്കായി നിശ്ചയിച്ച മൂല്യങ്ങളെ വിവരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: സംസാരിക്കുക
  rationale: പീയേൽ ആജ്ഞാരൂപത്തിന്റെ ഔപചാരിക ദൈവിക നിർദേശശൈലി നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും പാരമ്പര്യപരവുമായി നൽകുന്നു.
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: നിയമഭാഷയിലെ ഏകവചന പുരുഷരൂപത്തിന് പ്രതിനിധാനപരമായ പൊതുവ്യാപ്തിയുണ്ടാകാം; ‘ഒരാൾ’ അത് അനാവശ്യമായി പുരുഷന്മാരിൽ മാത്രം പരിമിതപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: יַפְלִא נֶדֶר
  choice: ഒരു പ്രത്യേക നേർച്ച നേർന്നാൽ
  rationale: ഹിഫീൽ രൂപം സാധാരണ നേർച്ചയിൽനിന്ന് പ്രത്യേകമായി നിർവചിക്കപ്പെടുന്ന നേർച്ചയെ സൂചിപ്പിക്കുന്നു; ‘പ്രത്യേക നേർച്ച’ അർത്ഥവും സ്വാഭാവിക മലയാളവും സംരക്ഷിക്കുന്നു.
- source_word: בְּעֶרְכְּךָ נְפָשֹׁת
  choice: വ്യക്തികളുടെ നിശ്ചിത മൂല്യം സംബന്ധിച്ച്
  rationale: തുടർന്നുള്ള വാക്യങ്ങളിൽ നിയമം നിശ്ചയിക്കുന്ന വ്യക്തിമൂല്യനിർണയമാണ് സന്ദർഭം. ദുഷ്കരമായ രണ്ടാംപുരുഷ ഏകവചനപ്രത്യയത്തെ കൃത്രിമമായി മോശെയുടെ വ്യക്തിപരമായ വിലയിരുത്തലാക്കി മാറ്റാതെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: നേർച്ചയുടെ സമർപ്പണലക്ഷ്യം വ്യക്തമാക്കുകയും יהוה എന്ന ഉടമ്പടിനാമം പേരായിത്തന്നെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: אִישׁ എന്ന നിയമപരമായ പുരുഷ ഏകവചനം
  choice: ഒരാൾ
  alternative: ഒരു പുരുഷൻ
  rationale: ഇവിടെ നിയമനിബന്ധന അവതരിപ്പിക്കുന്ന പ്രതിനിധാനപരമായ ഏകവചനമാണ്; ‘ഒരാൾ’ യഥാർത്ഥ പൊതുവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു, എന്നാൽ ലിംഗത്തെക്കുറിച്ച് വാക്യം പറയാത്തത് ചേർക്കുന്നില്ല.
- issue: בְּעֶרְכְּךָ എന്ന ദുഷ്കരമായ പ്രയോഗം
  choice: നിശ്ചിത മൂല്യം സംബന്ധിച്ച്
  alternative: നിന്റെ മൂല്യനിർണയപ്രകാരം
  rationale: രണ്ടാംപുരുഷപ്രത്യയം ഔപചാരികമായി പ്രകടമാക്കുന്ന മറ്റൊരു വായന സാധ്യമാണെങ്കിലും, തുടർന്നുള്ള നിശ്ചിത നിരക്കുകളുടെ പശ്ചാത്തലത്തിൽ ഈ പരിഭാഷ ആശയം വ്യക്തമാക്കുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശശൈലി. ‘ഇസ്രായേൽമക്കൾ,’ ‘നേർച്ച,’ ‘യഹോവ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ദുഷ്കരമായ മൂല്യനിർണയപ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകി.
