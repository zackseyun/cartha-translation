  terminology: ‘വിശുദ്ധമായി വേർതിരിച്ചവൻ’ suitably preserves the cultic force of הַמַּקְדִּישׁ without imposing doctrinal language. ‘വീണ്ടെടുക്കുക,’ ‘വെള്ളി,’ and ‘അഞ്ചിലൊന്ന്’ are accurate, natural choices in this legal context.
