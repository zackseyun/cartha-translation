reference: Leviticus 27:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֨ם הַ/מַּקְדִּ֔ישׁ יִגְאַ֖ל אֶת בֵּית֑/וֹ וְ֠/יָסַף חֲמִישִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/הָ֥יָה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: ml
  text: തന്റെ വീടിനെ വിശുദ്ധമായി വേർതിരിച്ചവൻ അതു വീണ്ടെടുക്കുകയാണെങ്കിൽ[a], നിന്റെ മൂല്യനിർണയപ്രകാരമുള്ള വെള്ളിയുടെ അഞ്ചിലൊന്ന് അതിനു പുറമെ കൂട്ടിച്ചേർക്കണം[b]; അപ്പോൾ അത് അവന്റേതായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സമർപ്പിച്ചവൻ” അല്ലെങ്കിൽ “വിശുദ്ധീകരിച്ചവൻ.”
    reason: lexical_alternative
  - marker: b
    text: അതായത്, പുരോഹിതൻ നിശ്ചയിച്ച വെള്ളിമൂല്യത്തിന്റെ അഞ്ചിലൊന്ന് കൂടി അയാൾ നൽകണം.
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: വിശുദ്ധമായി വേർതിരിച്ചവൻ
  rationale: קדשׁ എന്ന ധാതുവിന്റെ ആരാധനാപരമായ അർഥം നിലനിർത്തിക്കൊണ്ട്, ഒരു വീട് യഹോവയ്ക്കായി വേർതിരിക്കുന്ന പ്രവൃത്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: יִגְאַל
  choice: വീണ്ടെടുക്കുന്നെങ്കിൽ
  rationale: ഈ നിയമ-ആരാധനാ സന്ദർഭത്തിൽ പണം നൽകി സ്വത്ത് വീണ്ടും സ്വന്തമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; 'വീണ്ടെടുക്കുക' മൂലപദത്തിന്റെ ആശയവും ലേവ്യപുസ്തകത്തിലെ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: בֵּיתוֹ
  choice: തന്റെ വീട്
  rationale: നിയമപരമായി മൂല്യനിർണയം ചെയ്യപ്പെടുന്ന സ്വത്തിനെ സൂചിപ്പിക്കുന്ന 'അവന്റെ വീട്' എന്ന അക്ഷരാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְיָסַף
  choice: കൂട്ടിച്ചേർക്കണം
  rationale: നിബന്ധന നിറവേറുമ്പോൾ നിർബന്ധമായും ചെയ്യേണ്ട നിയമനടപടിയെന്ന ഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: חֲמִישִׁית
  choice: അഞ്ചിലൊന്ന്
  rationale: മൂലഭാഷയിലെ one-fifth എന്ന അളവ് ആധുനിക ശതമാനരൂപത്തിലേക്ക് മാറ്റാതെ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: നിന്റെ മൂല്യനിർണയപ്രകാരമുള്ള വെള്ളി
  rationale: כֶּסֶף എന്നതിന്റെ മൂർത്തമായ 'വെള്ളി' എന്ന അർഥവും, ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യപ്പെട്ട പുരോഹിതന്റെ മൂല്യനിർണയവും സംരക്ഷിക്കുന്നു.
- source_word: עָלָיו
  choice: അതിനോടു
  rationale: നിർണയിച്ച തുകയ്ക്കു പുറമേ അഞ്ചിലൊന്ന് ചേർക്കുന്നു എന്ന കൂട്ടിച്ചേർക്കൽബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהָיָה לוֹ
  choice: അപ്പോൾ അത് അവന്റേതായിരിക്കും
  rationale: പണം നൽകിയതിന്റെ ഫലമായി വീട് അവന്റെ ഉടമസ്ഥതയിലാകുന്നതിനെ നേരിട്ട് വ്യക്തമാക്കുന്നു; 'വീണ്ടും' എന്നത് മൂലത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ദൈവത്തിനായി വേർതിരിച്ച സ്വത്തിനുള്ള ആരാധനാപരമായ പദപ്രയോഗം
  choice: വിശുദ്ധമായി വേർതിരിച്ചവൻ
  alternative: സമർപ്പിച്ചവൻ; വിശുദ്ധീകരിച്ചവൻ
  rationale: '''വിശുദ്ധമായി വേർതിരിക്കുക'' എന്നത് קדשׁ എന്ന പദത്തിന്റെ വിശുദ്ധ/ആരാധനാപരമായ ശക്തി നിലനിർത്തുന്നു. ''സമർപ്പിക്കുക'' മാത്രം ഉപയോഗിച്ചാൽ ആ വിശുദ്ധഭാവം ദുർബലമാകാം; ''വിശുദ്ധീകരിക്കുക'' ഈ സ്വത്ത്-മൂല്യനിർണയ സന്ദർഭത്തിൽ കൂടുതൽ സാങ്കേതികമായോ സിദ്ധാന്തപരമായോ കേൾക്കാം.'
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമ-ആരാധനാ ശൈലി. മൂലത്തിലെ ഏകവചനമായ 'നിന്റെ' നിലനിർത്തിയിരിക്കുന്നു; പശ്ചാത്തലത്തിൽ അത് മൂല്യനിർണയം നടത്തുന്ന പുരോഹിതനെ സൂചിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
