id: LEV.27.11
reference: Leviticus 27:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם֙ כָּל בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁר לֹא יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה וְ/הֶֽעֱמִ֥יד אֶת הַ/בְּהֵמָ֖ה לִ/פְנֵ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: ml
  text: എന്നാൽ, അതിൽനിന്ന് യഹോവയ്ക്കു വഴിപാട് അർപ്പിക്കാനാവാത്ത ഏതെങ്കിലും അശുദ്ധമായ മൃഗമാണെങ്കിൽ, അവൻ ആ മൃഗത്തെ പുരോഹിതന്റെ മുമ്പിൽ നിർത്തണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ആണെങ്കിൽ
  rationale: മുൻനിയമത്തോടു തുടർച്ച പുലർത്തിക്കൊണ്ട് വ്യത്യസ്തമായ ഒരു നിബന്ധനാപരമായ സാഹചര്യം അവതരിപ്പിക്കുന്നു.
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: ഏതെങ്കിലും അശുദ്ധമൃഗം
  rationale: ഏകവചന നാമത്തോടൊപ്പമുള്ള כָּל ഇവിടെ അനിശ്ചിതമായ ‘ഏതെങ്കിലും’ എന്ന അർഥം നൽകുന്നു; טָמֵא ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: വഴിപാടായി അർപ്പിക്കാൻ പാടില്ലാത്ത
  rationale: יַקְרִיבוּ എന്ന പൊതുവാചക ബഹുവചനത്തിന്റെ വ്യക്തിനിരപേക്ഷ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ ‘അർപ്പിക്കാൻ പാടില്ലാത്ത’ എന്നു നൽകി; מִמֶּנָּה സൂചിപ്പിക്കുന്ന മൃഗത്തിൽനിന്നുള്ള അർപ്പണം മലയാളവാക്യത്തിൽ ‘വഴിപാടായി’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: קָרְבָּן
  choice: വഴിപാട്
  rationale: ദൈവസന്നിധിയിലേക്ക് കൊണ്ടുവരുന്ന ആരാധനാപരമായ അർപ്പണത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ മലയാള പദം.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה പേരായി നിലനിർത്തുന്നു.
- source_word: וְהֶעֱמִיד
  choice: നിർത്തണം
  rationale: עמד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘നിൽക്കുമാറാക്കുക/നിർത്തുക’ എന്നാണ്; നിയമനിർദേശത്തിൽ ‘നിർത്തണം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֶת הַבְּהֵמָה לִפְנֵי הַכֹּהֵן
  choice: ആ മൃഗത്തെ പുരോഹിതന്റെ മുമ്പിൽ
  rationale: കർമവും പുരോഹിതസന്നിധിയും നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു.
- issue: יַקְרִיבוּ എന്ന മൂന്നാംപുരുഷ ബഹുവചനത്തിന്റെ കർത്താവ്
  choice: വ്യക്തിനിരപേക്ഷമായി ‘അർപ്പിക്കാൻ പാടില്ലാത്ത’
  alternative: ‘അവർ അർപ്പിക്കാത്ത’
  rationale: ഹീബ്രുവിലെ ബഹുവചനം ഇവിടെ നിർദിഷ്ടമായ ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കാതെ പൊതുവായ/വ്യക്തിനിരപേക്ഷ പ്രയോഗമാണ്; മലയാളത്തിൽ അജ്ഞാതമായ ‘അവർ’ ചേർക്കുന്നത് തെറ്റിദ്ധാരണയ്ക്കിടയാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ. ആചാരപരമായ ‘അശുദ്ധി’ നിലനിർത്തുകയും വാക്യത്തിന്റെ നിബന്ധന–നിർദേശം ഘടന വ്യക്തമായി നൽകുകയും ചെയ്തു.
