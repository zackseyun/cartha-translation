id: LEV.27.16
reference: Leviticus 27:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: ml
  text: 'ഒരു പുരുഷൻ തന്റെ പാരമ്പര്യസ്വത്തായ വയലിൽനിന്ന് ഒരു ഭാഗം[a] യഹ്‌വേക്കു വിശുദ്ധമായി സമർപ്പിക്കുകയാണെങ്കിൽ, അതിന്റെ മൂല്യനിർണയം അതു വിതയ്ക്കാൻ വേണ്ട വിത്തിന്റെ അളവനുസരിച്ചായിരിക്കണം: ഒരു ഹോമെർ യവവിത്തിന് അമ്പത് ശേക്കെൽ വെള്ളി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ അവകാശമായി ലഭിച്ച വയലിൽനിന്ന് കുറെ ഭാഗം.” എബ്രായപ്രയോഗം പാരമ്പര്യമായി കൈവശമുള്ള ഭൂമിയെ സൂചിപ്പിക്കുന്നു; ‘വയൽ’ എന്ന പദത്തോടു മുൻചേർന്ന ‘മിൻ’ വയലിന്റെ ഒരു ഭാഗം മാത്രമാണ് സമർപ്പിക്കുന്നതെന്നു സൂചിപ്പിക്കുന്നു.
    reason: പാരമ്പര്യഭൂസ്വത്തിന്റെ നിയമപരമായ അർഥവും ഭാഗികസമർപ്പണമെന്ന വ്യാകരണസൂചനയും വ്യക്തമാക്കുന്ന പദവികല്പം.
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: തന്റെ പാരമ്പര്യസ്വത്തായ വയലിന്റെ ഒരു ഭാഗം
  rationale: מִן എന്ന ഉപസർഗം വയൽ മുഴുവനുമല്ല, അതിൽനിന്നുള്ള ഒരു ഭാഗമാണെന്ന് സൂചിപ്പിക്കുന്നു. אֲחֻזָּה പാരമ്പര്യമായി കൈവശമുള്ള ഭൂസ്വത്തിനെ കുറിക്കുന്നു.
- source_word: יַקְדִּישׁ
  choice: വിശുദ്ധമായി സമർപ്പിക്കുന്നെങ്കിൽ
  rationale: ഈ അധ്യായത്തിലെ മൂല്യനിർണയസന്ദർഭത്തിൽ യഹ്‌വെയ്ക്കായി വിശുദ്ധമായി വേർതിരിച്ചുവെക്കുന്നതാണ് ക്രിയയുടെ അർഥം; മലയാളത്തിൽ സ്വാഭാവികതയും ആരാധനാപരമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: എബ്രായപദം വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണ്; നിയമവാക്യത്തിൽ പ്രതിനിധാനപരമായ അർഥം വഹിച്ചാലും ഉറവിടത്തിലെ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്കു
  rationale: സീനായിയിൽ വെളിപ്പെടുത്തപ്പെട്ട ഉടമ്പടിനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത് ദൈവനാമം സംരക്ഷിക്കുന്നു.
- source_word: עֶרְכְּךָ
  choice: നീ അതിന്റെ മൂല്യം നിശ്ചയിക്കേണ്ടത്
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള പുരോഹിതപരമായ മൂല്യനിർണയം സ്വാഭാവിക മലയാളവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְפִי זַרְעוֹ
  choice: അതിനു വേണ്ട വിത്തിന്റെ അളവനുസരിച്ച്
  rationale: വയൽ വിതയ്ക്കാൻ ആവശ്യമായ വിത്തിന്റെ അളവാണ് മൂല്യനിർണയത്തിന്റെ അടിസ്ഥാനമെന്ന കാർഷിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: ഒരു ഹോമെർ യവവിത്തു വിതയ്ക്കാവുന്ന നിലം
  rationale: ഒരു ഹോമെർ അളവ് യവവിത്ത് ആവശ്യമായ ഭൂവിസ്തൃതിയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക കാർഷികമാനത്തെ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: അമ്പത് ശേക്കെൽ വെള്ളി
  rationale: മൂലപാഠത്തിലെ നാണയഭാരമാനവും വെള്ളിയെന്ന വസ്തുവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: നിയമവാക്യത്തിലെ אִישׁ എന്ന പൊതുവായ പുല്ലിംഗപ്രയോഗം
  choice: ഒരു പുരുഷൻ
  alternative: ഒരാൾ; ഒരു വ്യക്തി
  rationale: പദത്തിന്റെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം നിലനിർത്തുന്നു; അതിന്റെ നിയമപരമായ പ്രതിനിധാനസ്വഭാവം നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമപരവും ആരാധനാപരവുമായ ഗൗരവം നിലനിർത്തി രചിച്ചു. ‘ഹോമെർ’, ‘ശേക്കെൽ’ എന്നീ പുരാതന അളവുപദങ്ങൾ ഉറവിടത്തിന്റെ സാംസ്കാരിക പ്രത്യേകത സംരക്ഷിക്കാൻ ലിപ്യന്തരണം ചെയ്തു.
