  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֣א יַחֲלִיפֶ֗/נּוּ וְ/לֹֽא יָמִ֥יר אֹת֛/וֹ ט֥וֹב בְּ/רָ֖ע אוֹ רַ֣ע בְּ/ט֑וֹב וְ/אִם הָמֵ֨ר יָמִ֤יר בְּהֵמָה֙ בִּ/בְהֵמָ֔ה וְ/הָֽיָה ה֥וּא וּ/תְמוּרָת֖/וֹ יִֽהְיֶה קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: ml
  text: അവൻ അതിനെ മാറ്റിസ്ഥാപിക്കുകയോ കൈമാറ്റം ചെയ്യുകയോ അരുത്[a]—നല്ലതിനു പകരം ചീത്തയോ ചീത്തയ്ക്കു പകരം നല്ലതോ. എന്നാൽ അവൻ ഒരു മൃഗത്തിനു പകരം മറ്റൊരു മൃഗത്തെ കൈമാറ്റം ചെയ്യുകതന്നെ ചെയ്താൽ[b], ആ മൃഗവും അതിനു പകരം കൈമാറ്റം ചെയ്ത മൃഗവും വിശുദ്ധമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിനെ പകരംവെക്കുകയോ’ എന്നും പരിഭാഷപ്പെടുത്താം; മാറ്റിസ്ഥാപിക്കൽ, കൈമാറ്റം എന്നിവ സൂചിപ്പിക്കുന്ന പരസ്പരബന്ധമുള്ളതെങ്കിലും വ്യത്യസ്തമായ രണ്ടു ക്രിയകളാണ് എബ്രായത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ ക്രിയയ്ക്ക് ഊന്നൽ നൽകിയിരിക്കുന്നു: ‘കൈമാറ്റം ചെയ്യുകതന്നെ ചെയ്താൽ’ അഥവാ ‘തീർച്ചയായും കൈമാറ്റം ചെയ്താൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: അതിനെ മാറ്റിവെക്കുക
  rationale: വേർതിരിച്ചുവച്ച മൃഗത്തെ മറ്റൊന്നുകൊണ്ട് മാറ്റുന്നതാണ് ഇവിടെ ഹിഫീൽ രൂപത്തിന്റെ അർഥം. പിന്നാലെയുള്ള מוּר എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: יָמִיר אֹתוֹ
  choice: അതിനു പകരം കൊടുക്കുക
  rationale: ഒരു മൃഗത്തിനു പകരം മറ്റൊന്നിനെ നൽകുന്ന നിയമപരമായ കൈമാറ്റത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മുൻക്രിയയുമായുള്ള സൂക്ഷ്മ വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: നല്ലതിനു പകരം ചീത്തയോ ചീത്തയ്ക്കു പകരം നല്ലതോ
  rationale: നാമരൂപത്തിൽ പ്രവർത്തിക്കുന്ന വിശേഷണങ്ങളെയും പരസ്പര പകരംവെക്കലിനെയും സംക്ഷിപ്തവും വ്യക്തവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְאִם הָמֵר יָמִיר
  choice: എന്നാൽ ... കൊടുക്കുകതന്നെ ചെയ്താൽ
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ ‘-തന്നെ ചെയ്താൽ’ എന്ന സ്വാഭാവിക മലയാള പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: ഒരു മൃഗത്തിനു പകരം മറ്റൊരു മൃഗം
  rationale: ഒരു മൃഗത്തെ മറ്റൊന്നുകൊണ്ട് പകരംവെക്കുന്നതെന്ന ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: അതും അതിനു പകരം കൊടുത്തതും
  rationale: മൂലമൃഗവും പകരമൃഗവും രണ്ടും ഫലത്തിൽ ഉൾപ്പെടുന്നുവെന്ന് മൂലപാഠത്തിലെ ഏകവചന സർവനാമവും תְמוּרָהയും അനുസരിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: קֹדֶשׁ
  choice: വിശുദ്ധമായിരിക്കും
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശുദ്ധപദവിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നതും ലേവ്യപുസ്തകത്തിന്റെ ആരാധനാനിയമസന്ദർഭത്തിന് യോജിച്ചതുമായ പ്രയോഗം.
theological_decisions:
- issue: കൈമാറ്റശ്രമത്തിനുശേഷം മൂലമൃഗത്തിന്റെയും പകരമൃഗത്തിന്റെയും പദവി
  choice: മൂലമൃഗവും പകരം നൽകിയ മൃഗവും രണ്ടും വിശുദ്ധമായിരിക്കും.
  alternative: പകരം നൽകിയ മൃഗം മാത്രം വിശുദ്ധമാകുന്നു; അല്ലെങ്കിൽ കൈമാറ്റം അസാധുവാണെന്നു മാത്രം പ്രസ്താവിക്കുന്നു.
  rationale: ‘അതും അതിനു പകരം കൊടുത്തതും വിശുദ്ധമായിരിക്കും’ എന്ന എബ്രായ വാക്യം വിശുദ്ധപദവി രണ്ടിനും നേരിട്ട് ചുമത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. എബ്രായത്തിലെ രണ്ടു ക്രിയകളുടെ വ്യത്യാസവും ഊന്നൽരൂപവും സാധ്യമായത്ര സ്വാഭാവികമായി നിലനിർത്തിയിട്ടുണ്ട്; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
