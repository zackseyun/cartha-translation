id: LEV.27.7
reference: Leviticus 27:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/אִם מִ/בֶּן שִׁשִּׁ֨ים שָׁנָ֤ה וָ/מַ֨עְלָ/ה֙ אִם זָכָ֔ר וְ/הָיָ֣ה עֶרְכְּ/ךָ֔ חֲמִשָּׁ֥ה עָשָׂ֖ר שָׁ֑קֶל וְ/לַ/נְּקֵבָ֖ה עֲשָׂרָ֥ה שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: ml
  text: അറുപതു വയസ്സോ അതിലധികമോ പ്രായമുള്ള ആളാണെങ്കിൽ, പുരുഷന് നീ നിശ്ചയിക്കുന്ന മൂല്യം പതിനഞ്ചു ശേക്കെലും സ്ത്രീക്ക് പത്തു ശേക്കെലും ആയിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: അറുപതു വയസ്സോ അതിലധികമോ പ്രായമുള്ള
  rationale: അറുപതു വയസ്സുമുതൽ മുകളിലേക്കുള്ള പ്രായപരിധിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: זָכָר
  choice: പുരുഷന്
  rationale: ഈ മൂല്യനിർണയസന്ദർഭത്തിൽ ജൈവലിംഗത്തെ സൂചിപ്പിക്കുന്ന പദം; സമാന്തരമായ נְקֵבָה എന്ന പദത്തോടൊപ്പം സ്വാഭാവികമായ മലയാളജോടി നൽകുന്നു.
- source_word: עֶרְכְּךָ
  choice: നീ നിശ്ചയിക്കുന്ന മൂല്യം
  rationale: രണ്ടാംപുരുഷ പ്രത്യയത്തെയും നേർച്ചാനിയമത്തിലെ സാങ്കേതിക മൂല്യനിർണയത്തെയും വ്യക്തമാക്കുന്നു; മൂലഗ്രന്ഥം ഇവിടെ മൂല്യം നിശ്ചയിക്കുന്ന വ്യക്തിയെ പ്രത്യേകം വ്യക്തമാക്കുന്നില്ല.
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: പതിനഞ്ചു ശേക്കെൽ
  rationale: സംഖ്യയും തൂക്ക/നാണയ ഏകകവും നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: לַנְּקֵבָה
  choice: സ്ത്രീക്ക്
  rationale: പുരുഷനുള്ള മൂല്യത്തോടു താരതമ്യപ്പെടുത്തി സ്ത്രീക്കുള്ള മൂല്യം സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: പത്തു ശേക്കെൽ
  rationale: സംഖ്യയും ഏകകവും നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: עֶרְכְּךָ എന്ന രണ്ടാംപുരുഷരൂപത്തിലെ അഭിസംബോധിതൻ
  choice: നീ നിശ്ചയിക്കുന്ന മൂല്യം
  alternative: നിന്റെ മൂല്യനിർണയം
  rationale: സന്ദർഭത്തിൽ മൂല്യം നിശ്ചയിക്കുന്നവൻ ആരെന്നത് ഈ വാക്യം മാത്രം വ്യക്തമായി പറയുന്നില്ല; അതിനാൽ പുരോഹിതൻ എന്ന് ചേർക്കാതെ രണ്ടാംപുരുഷരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. എബ്രായവാക്യത്തിന്റെ നിബന്ധനാരൂപം സ്വാഭാവികമായി പുനഃക്രമീകരിച്ചു; പുരുഷൻ/സ്ത്രീ എന്ന സമാന്തരപദങ്ങൾ ഉപയോഗിച്ചു. പ്രസിദ്ധീകരണത്തിൽ ‘ശേക്കെൽ’ എന്ന ഏകകത്തിന്റെ അക്ഷരരൂപം പുസ്തകമൊട്ടാകെ ഏകീകരിക്കണം.
