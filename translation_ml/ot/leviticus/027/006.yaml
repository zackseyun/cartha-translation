id: LEV.27.6
reference: Leviticus 27:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֣ם מִ/בֶּן חֹ֗דֶשׁ וְ/עַד֙ בֶּן חָמֵ֣שׁ שָׁנִ֔ים וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר חֲמִשָּׁ֥ה שְׁקָלִ֖ים כָּ֑סֶף וְ/לַ/נְּקֵבָ֣ה עֶרְכְּ/ךָ֔ שְׁלֹ֥שֶׁת שְׁקָלִ֖ים כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: ml
  text: ഒരു മാസം പ്രായം മുതൽ അഞ്ചു വയസ്സു വരെയുള്ളവരുടെ കാര്യത്തിൽ, ആണിന് നീ നിശ്ചയിക്കേണ്ട വില അഞ്ച് ശേക്കെൽ വെള്ളിയും പെണ്ണിന് നീ നിശ്ചയിക്കേണ്ട വില മൂന്ന് ശേക്കെൽ വെള്ളിയും ആയിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן־חֹדֶשׁ
  choice: ഒരു മാസം പ്രായംമുതൽ
  rationale: എബ്രായത്തിലെ പ്രായസൂചക പ്രയോഗം സ്വാഭാവികവും നിയമപരമായി വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; താഴത്തെ പ്രായപരിധി ഒരു മാസം എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְעַד בֶּן־חָמֵשׁ שָׁנִים
  choice: അഞ്ചു വയസ്സുവരെ
  rationale: പ്രായപരിധിയുടെ മുകളറ്റം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: עֶרְכְּךָ
  choice: നിന്റെ മൂല്യനിർണയം
  rationale: നേർച്ചകളുമായി ബന്ധപ്പെട്ട ഈ അധ്യായത്തിലെ നിശ്ചിത വിലയിരുത്തലിനുള്ള നിയമപദം സംരക്ഷിക്കുകയും രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַזָּכָר
  choice: ആൺകുട്ടിക്കുള്ള
  rationale: ഈ പ്രായവിഭാഗം ഒരു മാസംമുതൽ അഞ്ചു വയസ്സുവരെയുള്ളതിനാൽ, ലിംഗവിഭാഗം വ്യക്തമാക്കിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പ്രായോചിത പദം ഉപയോഗിക്കുന്നു.
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף
  choice: അഞ്ചു ശേക്കെൽ വെള്ളി
  rationale: തുകയും വെള്ളി എന്ന വസ്തുവും നേരിട്ട് നിലനിർത്തുന്നു; ‘ശേക്കെൽ’ അളവ്/നാണയനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְלַנְּקֵבָה
  choice: പെൺകുട്ടിക്കുള്ള
  rationale: സമാന്തരമായ സ്ത്രീലിംഗ വിഭാഗം ഈ പ്രായപരിധിക്ക് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: മൂന്നു ശേക്കെൽ വെള്ളി
  rationale: മൂലത്തിലെ തുകയും വസ്തുവും പുരുഷലിംഗ വിഭാഗത്തിലെ പ്രയോഗത്തോടുള്ള സമാന്തരതയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: וְהָיָה
  choice: ആയിരിക്കണം
  rationale: നിയമനിർദേശപരമായ ബലം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമശൈലി. മൂലത്തിലെ ‘നിന്റെ’ എന്ന ഏകവചന അഭിസംബോധനയും മൂല്യനിർണയത്തിന്റെ സാങ്കേതിക സ്വഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
