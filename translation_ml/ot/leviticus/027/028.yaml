reference: Leviticus 27:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: ml
  text: എന്നാൽ, ഒരാൾ തനിക്കുള്ള സകലത്തിൽനിന്നും—മനുഷ്യരെയോ മൃഗങ്ങളെയോ തന്റെ പാരമ്പര്യസ്വത്തിലെ വയലിനെയോ—യഹോവയ്ക്കായി നിശ്ശേഷം സമർപ്പിക്കുന്നതൊന്നും[a] വിൽക്കാനോ വീണ്ടെടുക്കാനോ പാടില്ല. നിശ്ശേഷം സമർപ്പിക്കപ്പെട്ടതെല്ലാം യഹോവയ്ക്ക് അതിവിശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിശ്ശേഷം സമർപ്പിക്കപ്പെട്ടത്” എന്നത് എബ്രായത്തിലെ ഖേരെം (ḥērem) എന്ന സാങ്കേതിക പദമാണ്. യഹോവയ്ക്കായി തിരിച്ചെടുക്കാനാവാത്തവിധം വേർതിരിക്കപ്പെട്ടതിനെ ഇത് സൂചിപ്പിക്കുന്നു; ചില സന്ദർഭങ്ങളിൽ നിരോധനവിധേയമാക്കിയതെന്നോ നാശത്തിനായി ഏൽപ്പിച്ചതെന്നോ ഉള്ള അർഥവും ഇതിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻപുള്ള വീണ്ടെടുക്കാവുന്ന നേർച്ചവസ്തുക്കളെ സംബന്ധിച്ച ചട്ടങ്ങളിൽനിന്ന് വ്യത്യസ്തമായ ഒരു നിയന്ത്രണം ഇവിടെ അവതരിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ വൈരുധ്യസൂചകം ഉപയോഗിച്ചു.
- source_word: חֵרֶם / יַחֲרִם
  choice: നിശ്ശേഷം സമർപ്പിക്കപ്പെട്ടത് / നിശ്ശേഷം സമർപ്പിക്കുക
  rationale: യഹോവയ്ക്കായി തിരിച്ചെടുക്കാനാവാത്തവിധം വേർതിരിക്കുന്നതെന്ന സാങ്കേതിക അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; നിരോധനത്തിന്റെയോ നാശത്തിനായി ഏൽപ്പിക്കുന്നതിന്റെയോ സാധ്യതയുള്ള അർഥഛായ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: എബ്രായ നിയമഭാഷയിലെ പ്രതിനിധിപരമായ പുരുഷ ഏകവചനത്തെ മലയാളത്തിലെ സ്വാഭാവിക നിയമപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു; ഇതിലൂടെ പ്രസ്താവനയുടെ പൊതുവ്യാപ്തി വ്യക്തമാകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി / യഹോവയ്ക്ക്
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം പേരായിത്തന്നെ സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: തനിക്കുള്ള സകലത്തിൽനിന്നും
  rationale: സമർപ്പിക്കപ്പെടുന്ന വസ്തു അയാളുടെ ഉടമസ്ഥതയിൽപ്പെട്ടതാണെന്ന പരിധി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: מֵאָדָם וּבְהֵמָה
  choice: മനുഷ്യനെയോ മൃഗത്തെയോ
  rationale: אָדָם മൃഗത്തോടു വിപരീതമായി മനുഷ്യവർഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മനുഷ്യൻ’ എന്ന വിഭാഗപദം ഉപയോഗിച്ചു.
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: തന്റെ പാരമ്പര്യസ്വത്തിലെ വയലിൽനിന്നുള്ള ഏതെങ്കിലും ഭാഗം
  rationale: אֲחֻזָּה ഗോത്രപരമായി ലഭിച്ച പാരമ്പര്യഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്നു; מִן എന്നതിന്റെ ഭാഗികമായ അർഥം വ്യക്തമാക്കാൻ ‘ഏതെങ്കിലും ഭാഗം’ എന്നു ചേർത്തു.
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: വിൽക്കുകയോ വീണ്ടെടുക്കുകയോ അരുത്
  rationale: വിൽപ്പനയും സാങ്കേതികമായ വീണ്ടെടുപ്പും നിരോധിക്കുന്ന നിയമവാക്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധം
  rationale: എബ്രായത്തിലെ പരമോന്നത വിശുദ്ധി സൂചിപ്പിക്കുന്ന ഘടനയ്ക്ക് വ്യക്തവും dignified-ഉം ആയ മലയാള തുല്യം.
theological_decisions:
- issue: חֵרֶם എന്ന സാങ്കേതിക പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ തിരിച്ചെടുക്കാനാവാത്ത സമർപ്പണം മുൻനിർത്തി ‘നിശ്ശേഷം സമർപ്പിക്കപ്പെട്ടത്’ എന്നു നൽകി.
  alternative: ‘നാശത്തിനായി ഏൽപ്പിക്കപ്പെട്ടത്’ അല്ലെങ്കിൽ ‘നിരോധനവിധേയമാക്കിയത്’.
  rationale: ഈ വാക്യം വിൽക്കാനോ വീണ്ടെടുക്കാനോ കഴിയാത്തതും യഹോവയ്ക്ക് അതിവിശുദ്ധവുമായ നിലയ്ക്കാണ് ഊന്നൽ നൽകുന്നത്. എന്നാൽ പദത്തിന് മറ്റു സന്ദർഭങ്ങളിൽ നിരോധനത്തിന്റെയും നാശത്തിനായി ഏൽപ്പിക്കലിന്റെയും അർഥഛായ ഉള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
- issue: אָדָם എന്ന പദത്തിന്റെ വിഭാഗപരമായ പ്രയോഗം
  choice: ‘മനുഷ്യൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പുരുഷൻ’.
  rationale: ഇവിടെ പദം ‘മൃഗം’ എന്ന വിഭാഗത്തോടു വിപരീതമായി മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അതിനാൽ ലിംഗപരമായി പരിമിതപ്പെടുത്താതെ മൂലത്തിലെ വിഭാഗവ്യത്യാസം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘നിശ്ശേഷം സമർപ്പിക്കുക’ എന്ന പ്രയോഗം സാങ്കേതികവും അപരിചിതവുമായ ആശയം വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം അവതരിപ്പിക്കുന്നു; അടിക്കുറിപ്പ് യഥാർഥ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
