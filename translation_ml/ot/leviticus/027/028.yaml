revisions:
- from: എന്നാൽ, ഒരാൾ തനിക്കുള്ള സകലത്തിൽനിന്നും—മനുഷ്യനെയോ മൃഗത്തെയോ തന്റെ പാരമ്പര്യസ്വത്തിലെ വയലിൽനിന്നുള്ള ഏതെങ്കിലും ഭാഗത്തെയോ—യഹോവയ്ക്കായി നിശ്ശേഷം സമർപ്പിക്കുന്നതൊന്നും[a] വിൽക്കുകയോ വീണ്ടെടുക്കുകയോ അരുത്. നിശ്ശേഷം സമർപ്പിക്കപ്പെട്ടതെല്ലാം യഹോവയ്ക്ക് അതിവിശുദ്ധമാണ്.
  to: എന്നാൽ, ഒരാൾ തനിക്കുള്ള സകലത്തിൽനിന്നും—മനുഷ്യരെയോ മൃഗങ്ങളെയോ തന്റെ പാരമ്പര്യസ്വത്തിലെ വയലിനെയോ—യഹോവയ്ക്കായി നിശ്ശേഷം സമർപ്പിക്കുന്നതൊന്നും[a] വിൽക്കാനോ വീണ്ടെടുക്കാനോ പാടില്ല. നിശ്ശേഷം സമർപ്പിക്കപ്പെട്ടതെല്ലാം യഹോവയ്ക്ക് അതിവിശുദ്ധമാണ്.
  rationale: The revision removes the unsupported specification that only ‘some part’ of a hereditary field is devoted. It otherwise preserves the draft’s sound handling of the legal and technical vocabulary, including the explanatory footnote for ḥerem.
