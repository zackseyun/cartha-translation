source:
  edition: WLC
  text: אַךְ בְּכ֞וֹר אֲשֶׁר יְבֻכַּ֤ר לַֽ/יהוָה֙ בִּ/בְהֵמָ֔ה לֹֽא יַקְדִּ֥ישׁ אִ֖ישׁ אֹת֑/וֹ אִם שׁ֣וֹר אִם שֶׂ֔ה לַֽ/יהוָ֖ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: ml
  text: എന്നാൽ, കന്നുകാലികളിൽ കടിഞ്ഞൂലായി പിറന്ന യഹോവയ്ക്കുള്ള ഒരു മൃഗത്തെ ആരും[a] വിശുദ്ധമായി സമർപ്പിക്കരുത്. അത് കാളയോ ചെമ്മരിയാടോ കോലാടോ ആയാലും[b], യഹോവയ്ക്കുള്ളതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഒരു പുരുഷൻ’; ഇവിടെ അത് പൊതുവായി ‘ആരും’ എന്ന അർഥത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ שֶׂה എന്ന പദത്തിന് ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻപുള്ള സമർപ്പണനിയമങ്ങൾക്ക് ഒരു നിയന്ത്രണമോ അപവാദമോ അവതരിപ്പിക്കുന്നതിനാൽ, വൈരുധ്യ-നിയന്ത്രണ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּכוֹר
  choice: കടിഞ്ഞൂലായി പിറന്ന്
  rationale: ഒരു മൃഗത്തിന്റെ ആദ്യജാതസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന പ്രയോഗമാണിത്.
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: കന്നുകാലികളിൽ കടിഞ്ഞൂലായി പിറന്ന് യഹോവയ്ക്കുള്ളതായ
  rationale: בכר എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപം ഇവിടെ മനുഷ്യൻ നൽകുന്ന പദവിയെയല്ല, ജനനംമൂലം ലഭിക്കുന്ന ആദ്യജാതസ്ഥിതിയെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ അത്തരം മൃഗം നേരത്തേ യഹോവയ്ക്കുള്ളതാണെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: בִּבְהֵמָה
  choice: കന്നുകാലികളിൽ
  rationale: സന്ദർഭത്തിൽ നേർച്ചയ്ക്കോ യാഗത്തിനോ ഉപയോഗിക്കാവുന്ന വളർത്തുമൃഗങ്ങളുടെ പൊതുവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: അതിനെ ആരും വിശുദ്ധമായി സമർപ്പിക്കരുത്
  rationale: קדש എന്നതിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ആരാധനാപരമായ ‘വിശുദ്ധമായി വേർതിരിക്കുക/സമർപ്പിക്കുക’ എന്ന അർഥം വ്യക്തമാക്കുന്നു. אִישׁ വ്യാകരണപരമായി പുരുഷഏകവചനമാണെങ്കിലും ഇവിടെ പൊതുവായി ഏതൊരു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: അത് കാളയായാലും ചെമ്മരിയാടോ കോലാടോ ആയാലും
  rationale: ‘ഇതായാലും അതായാലും’ എന്ന ഘടന സംരക്ഷിക്കുന്നു. שֶׂה ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാവുന്നതിനാൽ രണ്ടും ഉൾപ്പെടുത്തി ഹീബ്രുവിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: לַיהוָה הוּא
  choice: യഹോവയ്ക്കുള്ളതാണ്
  rationale: മൃഗത്തിന്മേലുള്ള യഹോവയുടെ മുൻകൂട്ടിയുള്ള അവകാശം സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ മലയാളത്തിൽ പതിവായി അറിയപ്പെടുന്ന വ്യക്തിനാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: കടിഞ്ഞൂൽ മൃഗത്തെ വീണ്ടും വിശുദ്ധമായി സമർപ്പിക്കാൻ പാടില്ലാത്തതിന്റെ കാരണം
  choice: കടിഞ്ഞൂലായതിനാൽ അത് ഇതിനകം യഹോവയ്ക്കുള്ളതാണ്; അതുകൊണ്ട് ഒരാൾക്ക് അതിനെ പുതിയൊരു നേർച്ചയായി സമർപ്പിക്കാനാവില്ല.
  alternative: ഉടമസ്ഥാവകാശത്തിന് ഊന്നൽ നൽകാതെ, കടിഞ്ഞൂൽസ്ഥിതി തന്നെയാണ് അതിന്റെ വിശുദ്ധീകരണം എന്നു മാത്രം മനസ്സിലാക്കുക.
  rationale: അവസാനത്തെ ‘യഹോവയ്ക്കുള്ളതാണ്’ എന്ന വാക്യം യഹോവയുടെ നിലവിലുള്ള അവകാശത്തിന് ഊന്നൽ നൽകുന്നു; എങ്കിലും കടിഞ്ഞൂൽസ്ഥിതിയും വിശുദ്ധതയും തമ്മിലുള്ള ബന്ധം വിവർത്തനം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ആരാധനാപരമായ קדש എന്ന ആശയം നിലനിർത്താൻ ‘വിശുദ്ധമായി സമർപ്പിക്കുക’ ഉപയോഗിച്ചു; ശെ എന്ന പദത്തിന്റെ യഥാർഥ വ്യാപ്തി ചുരുക്കാതിരിക്കാൻ ചെമ്മരിയാടും കോലാടും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തി.
