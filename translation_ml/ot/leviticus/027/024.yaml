revisions:
- from: വിമോചനവർഷത്തിൽ ആ വയൽ, അത് ആരിൽനിന്നു വാങ്ങിയോ അയാളിലേക്കു—ആ ദേശഭാഗം അവകാശമായി ഉള്ളവനിലേക്കു—മടങ്ങിച്ചെല്ലണം.[a]
  to: യോബേൽ വർഷത്തിൽ വയൽ, ആരിൽനിന്ന് അത് വാങ്ങിയതോ അവന്റെ അടുക്കലേക്കു—ഭൂമിയിൽ അവകാശഭൂമിയുള്ളവന്റെ അടുക്കലേക്കു—മടങ്ങിച്ചെല്ലണം.[a]
  rationale: The revision restores the specific Jubilee designation, improves the legal-landholding sense of אֲחֻזַּת הָאָרֶץ, and smooths the Malayalam relative clause. The footnote retains the contextual hereditary-allotment nuance as an alternative rather than importing it into the main text.
