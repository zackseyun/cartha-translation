source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת הַ/יּוֹבֵל֙ יָשׁ֣וּב הַ/שָּׂדֶ֔ה לַ/אֲשֶׁ֥ר קָנָ֖/הוּ מֵ/אִתּ֑/וֹ לַ/אֲשֶׁר ל֖/וֹ אֲחֻזַּ֥ת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: ml
  text: യോബേൽ വർഷത്തിൽ വയൽ, ആരിൽനിന്ന് അത് വാങ്ങിയതോ അവന്റെ അടുക്കലേക്കു—ഭൂമിയിൽ അവകാശഭൂമിയുള്ളവന്റെ അടുക്കലേക്കു—മടങ്ങിച്ചെല്ലണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഭൂമിയിൽ പാരമ്പര്യമായി ലഭിച്ച അവകാശഭൂമിയുള്ളവന്റെ അടുക്കലേക്കു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഭൂമിയിലെ ഒരു അവകാശഭൂമിയെയോ ഭൂവിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ അത് കുടുംബത്തിന് ആദ്യം ലഭിച്ച ഭൂവിഹിതമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: വിമോചനവർഷത്തിൽ
  rationale: യോവേൽനിയമത്തിലെ പ്രത്യേക വർഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ മലയാളവായനക്കാർക്ക് നിയമസന്ദർഭത്തിലെ മോചനവും സ്വത്ത് മടക്കവും വ്യക്തമാക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ പദമാണ് ‘വിമോചനവർഷം’.
- source_word: יָשׁוּב הַשָּׂדֶה
  choice: ആ വയൽ ... മടങ്ങിച്ചെല്ലണം
  rationale: നിയമപരമായ ഫലം സൂചിപ്പിക്കുന്ന അപൂർണ്ണക്രിയയുടെ നിർബന്ധസ്വഭാവം ‘ണം’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; שָׂדֶה നേരിട്ട് ‘വയൽ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: അത് ആരിൽനിന്നു വാങ്ങിയോ അയാളിലേക്കു
  rationale: ഹീബ്രൂവിലെ സർവനാമബന്ധം മലയാളത്തിൽ അനാവശ്യമായ ഒരു വ്യക്തമായ കർത്താവിനെ ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; വയൽ വാങ്ങിയ മുൻ ഉടമയെയാണ് വാക്യം തിരിച്ചറിയിക്കുന്നത്.
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: ആ ദേശഭാഗം അവകാശമായി ഉള്ളവനിലേക്കു
  rationale: אֲחֻזָּה എന്നത് കൈവശാവകാശമുള്ള ഭൂസ്വത്തെയോ ഭൂവിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ദേശഭാഗം അവകാശമായി ഉള്ളവൻ’ എന്നത് നിയമപരമായ ഭൂവകാശം വ്യക്തമാക്കുന്നു; ‘പാരമ്പര്യ’ എന്ന ആശയം മുഖ്യവാചകത്തിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: വിമോചനവർഷനിയമത്തിൽ אֲחֻזַּת הָאָרֶץ എന്നതിന്റെ സ്വഭാവം
  choice: ‘ആ ദേശഭാഗം അവകാശമായി ഉള്ളവൻ’ എന്നു മുഖ്യവാചകത്തിൽ നൽകി
  alternative: ‘ആ ദേശഭാഗം പാരമ്പര്യാവകാശമായി ഉള്ളവൻ’
  rationale: വിശാലസന്ദർഭത്തിൽ ഇത് കുടുംബത്തിന്റെ ആദിമ ഭൂവിഹിതമായിരിക്കാമെങ്കിലും, ഈ പദസമുച്ചയം നേരിട്ട് ഭൂവശാവകാശത്തെയാണ് പറയുന്നത്. അതിനാൽ പാരമ്പര്യസ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും മുഖ്യവാചകത്തിൽ ഉറവിടത്തിന്റെ അളവ് കവിയാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ. ദീർഘമായ ബന്ധവാക്യത്തിന്റെ രണ്ട് സൂചനകളും ഒരേ വ്യക്തിയിലേക്കാണെന്നു വ്യക്തമാക്കാൻ ഇടവരകൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
