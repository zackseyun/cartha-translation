    text: 'അഥവാ: “ഭൂമിയിൽ പാരമ്പര്യമായി ലഭിച്ച അവകാശഭൂമിയുള്ളവന്റെ അടുക്കലേക്കു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഭൂമിയിലെ ഒരു അവകാശഭൂമിയെയോ ഭൂവിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ അത് കുടുംബത്തിന് ആദ്യം ലഭിച്ച ഭൂവിഹിതമാണ്.'
