id: LEV.27.22
reference: Leviticus 27:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם֙ אֶת שְׂדֵ֣ה מִקְנָת֔/וֹ אֲשֶׁ֕ר לֹ֖א מִ/שְּׂדֵ֣ה אֲחֻזָּת֑/וֹ יַקְדִּ֖ישׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
translation:
  language: ml
  text: എന്നാൽ, തന്റെ പൈതൃകസ്വത്തിൽപ്പെട്ടതല്ലാത്ത, താൻ വിലയ്ക്കു വാങ്ങിയ ഒരു വയൽ അവൻ യഹോവയ്ക്കു വിശുദ്ധമായി സമർപ്പിക്കുന്നുവെങ്കിൽ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ വാങ്ങിയ ഒരു വയൽ’; പൈതൃകമായി ലഭിച്ച കുടുംബഭൂമിയിൽ ഉൾപ്പെടാത്ത വയൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ആണെങ്കിൽ
  rationale: മുൻനിയമവുമായി തുടർച്ച പുലർത്തിക്കൊണ്ട് പുതിയതും അല്പം വ്യത്യസ്തവുമായ ഒരു വ്യവസ്ഥ അവതരിപ്പിക്കുന്ന സംയോജക-സോപാധിക പ്രയോഗം.
- source_word: שְׂדֵה מִקְנָתוֹ
  choice: താൻ വിലയ്ക്കു വാങ്ങിയ ഒരു വയൽ
  rationale: വാങ്ങി സമ്പാദിച്ച വയൽ എന്ന നിയമപരമായ വ്യത്യാസം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പൈതൃകമായി ലഭിച്ച ഭൂമിയോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: തന്റെ പൈതൃകസ്വത്തിൽപ്പെട്ടതല്ലാത്ത
  rationale: אֲחֻזָּה ഇവിടെ കുടുംബപരമായി കൈവശം ലഭിച്ച പാരമ്പര്യ ഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പ്പെട്ടതല്ലാത്ത’ എന്നത് מן സൂചിപ്പിക്കുന്ന ഉറവിട/അംഗത്വബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יַקְדִּישׁ
  choice: വിശുദ്ധമായി സമർപ്പിക്കുന്നത്
  rationale: ഒരു വസ്തുവിനെ യഹോവയ്ക്കായി വിശുദ്ധമായി വേർതിരിക്കുന്ന നേർച്ചാ-നിയമപരമായ അർഥം ‘സമർപ്പിക്കുക’ എന്നതോടൊപ്പം ‘വിശുദ്ധമായി’ ചേർത്ത് വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ל എന്ന ദിശാസൂചക വിഭക്തിയെയും വെളിപ്പെടുത്തപ്പെട്ട ദൈവനാമമായ יהוה-യെയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: יַקְדִּישׁ എന്നതിന്റെ ആരാധനാ-നിയമപരമായ ഭാവം
  choice: വിശുദ്ധമായി സമർപ്പിക്കുക
  alternative: സമർപ്പിക്കുക
  rationale: വെറും ദാനം ചെയ്യുക എന്നതിലുപരി ദൈവത്തിനായി വിശുദ്ധമായി വേർതിരിക്കുക എന്ന ആശയം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന സോപാധിക നിയമവാക്യമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തിയിരിക്കുന്നു.
