  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വേ മോശയോടു പറഞ്ഞു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്യുന്നു.'
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപവും പരമ്പരാഗത പകരംവിവർത്തനവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ ഈ ആഖ്യാനസൂത്രത്തിലെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; പിന്നാലെ വരുന്ന לֵאמֹר മൂലം ‘പറഞ്ഞു’ എന്ന ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘-യോടു’ എന്നു നൽകുന്നു; מֹשֶׁה എന്ന പേര് പതിവ് മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഇരട്ടപ്പുള്ളി
  rationale: എബ്രായത്തിലെ പതിവ് ഉദ്ധരണി-ആമുഖത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ഇരട്ടപ്പുള്ളിയാൽ സൂചിപ്പിക്കുന്നു; ‘ഇപ്രകാരം പറഞ്ഞു’ എന്നു ചേർത്താൽ וַיְדַבֵּר നോടൊപ്പം അനാവശ്യ ആവർത്തനം ഉണ്ടാകും.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരായി പകരാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; പരമ്പരാഗത പകരംവിവർത്തനം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടനയ്ക്ക് പകരം ഇരട്ടപ്പുള്ളി ഉപയോഗിച്ചു.
