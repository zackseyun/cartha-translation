source:
  edition: WLC
  text: וְ/אִם מָ֥ךְ הוּא֙ מֵֽ/עֶרְכֶּ֔/ךָ וְ/הֶֽעֱמִיד/וֹ֙ לִ/פְנֵ֣י הַ/כֹּהֵ֔ן וְ/הֶעֱרִ֥יךְ אֹת֖/וֹ הַ/כֹּהֵ֑ן עַל פִּ֗י אֲשֶׁ֤ר תַּשִּׂיג֙ יַ֣ד הַ/נֹּדֵ֔ר יַעֲרִיכֶ֖/נּוּ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: ml
  text: എന്നാൽ നിന്റെ നിശ്ചിത മൂല്യത്തുക നൽകാൻ അവൻ ദരിദ്രനാണെങ്കിൽ[a], അവനെ പുരോഹിതന്റെ മുമ്പാകെ നിർത്തണം; പുരോഹിതൻ അവനുവേണ്ടിയുള്ള മൂല്യത്തുക നിശ്ചയിക്കണം. നേർച്ച ചെയ്യുന്നവന്റെ സാമ്പത്തികശേഷിക്കനുസരിച്ച് പുരോഹിതൻ അവനുവേണ്ടിയുള്ള മൂല്യത്തുക നിശ്ചയിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ നിശ്ചിത മൂല്യത്തുകയേക്കാൾ ദരിദ്രനാണെങ്കിൽ.” ഹീബ്രു ഘടന ഇങ്ങനെ കൂടുതൽ അക്ഷരാർഥത്തിൽ പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉദ്ദേശിക്കുന്നത് നിശ്ചിത തുക നൽകാൻ അവനു കഴിയുന്നില്ല എന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നേർച്ച ചെയ്യുന്നവന്റെ കൈ എത്തുന്നതനുസരിച്ച്.” ഇത് സാമ്പത്തികശേഷിയെ സൂചിപ്പിക്കുന്ന ഒരു ഹീബ്രു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָךְ
  choice: നൽകാൻ കഴിയാത്തവിധം ദരിദ്രൻ
  rationale: ഈ പദം സാമ്പത്തികമായി താഴ്ന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള מֵעֶרְכֶּךָയോടൊപ്പം, നിശ്ചിത തുക നൽകാൻ കഴിയാത്ത ദാരിദ്ര്യം എന്ന താരതമ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵעֶרְכֶּךָ
  choice: നിന്റെ നിശ്ചിത മൂല്യം
  rationale: ലേവ്യപുസ്തകം 27-ൽ עֵרֶךְ നേർച്ചാസംബന്ധമായ നിശ്ചിത പണമൂല്യമാണ്. രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം ‘നിന്റെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: וְהֶעֱמִידוֹ
  choice: അവനെ ... നിർത്തണം
  rationale: עמד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘നിർത്തുക’ എന്ന നിയമനടപടിയുടെ അർഥം നിലനിർത്തുന്നു; പ്രവൃത്തികർത്താവ് ഹീബ്രുവിൽ വ്യക്തമല്ലാത്തതിനാൽ മലയാളത്തിലും ചേർത്തിട്ടില്ല.
- source_word: לִפְנֵי הַכֹּהֵן
  choice: പുരോഹിതന്റെ മുമ്പാകെ
  rationale: പുരോഹിതാധികാരത്തിന്റെ സന്നിധിയിൽ ഹാജരാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവ് നിയമ-ആരാധനാപ്രയോഗം.
- source_word: וְהֶעֱרִיךְ אֹתוֹ / יַעֲרִיכֶנּוּ
  choice: അവന്റെ മൂല്യം നിശ്ചയിക്കണം
  rationale: ഈ അധ്യായത്തിൽ ערך ഒരു വ്യക്തിയുമായി ബന്ധപ്പെട്ട നേർച്ചത്തുക നിർണയിക്കുന്ന സാങ്കേതിക ക്രിയയാണ്; ആവർത്തനം ഇരുവിടത്തും നിലനിർത്തുന്നു.
- source_word: עַל פִּי
  choice: അനുസരിച്ച്
  rationale: മൂല്യനിർണയത്തിന്റെ മാനദണ്ഡം അവതരിപ്പിക്കുന്ന ‘പ്രകാരം/അടിസ്ഥാനത്തിൽ’ എന്ന അർഥമുള്ള പ്രയോഗം.
- source_word: אֲשֶׁר תַּשִּׂיג יַד
  choice: സാമ്പത്തികശേഷി
  rationale: അക്ഷരാർഥത്തിൽ ‘കൈ എത്തുന്നത്’ എന്ന ഹീബ്രു പ്രയോഗം ഒരാളുടെ ധനശേഷിയെയാണ് സൂചിപ്പിക്കുന്നത്; ആ അർഥം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: הַנֹּדֵר
  choice: നേർച്ച നേരുന്നവൻ
  rationale: നേർച്ച ചെയ്യുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമരൂപം; സാധാരണ മലയാള ബൈബിൾ-ആരാധനാ പ്രയോഗവുമായി യോജിക്കുന്നതും വായനാസൗകര്യമുള്ളതുമാണ്.
