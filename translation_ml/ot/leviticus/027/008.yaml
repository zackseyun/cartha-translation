translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. ‘നിശ്ചിത മൂല്യം’ എന്ന പദപ്രയോഗം അധ്യായത്തിലെ സാങ്കേതിക സാമ്പത്തിക ആശയം വ്യക്തമാക്കുന്നു. ഹീബ്രുവിലെ ആവർത്തനം നിലനിർത്തിയിട്ടുണ്ട്; അപരിചിതമായ ‘കൈ എത്തുക’ എന്ന ഇടിയം മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമായ ‘സാമ്പത്തികശേഷി’യായി നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
