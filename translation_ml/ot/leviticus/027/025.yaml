reference: Leviticus 27:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל עֶרְכְּ/ךָ֔ יִהְיֶ֖ה בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה יִהְיֶ֥ה הַ/שָּֽׁקֶל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/025.yaml
  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: ml
  text: നിന്റെ ഓരോ മൂല്യനിർണയവും വിശുദ്ധമന്ദിര ശേക്കെലിന്റെ മാനദണ്ഡപ്രകാരം ആയിരിക്കണം; ഒരു ശേക്കെൽ ഇരുപത് ഗേര ആയിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: നീ നിശ്ചയിക്കുന്ന ഓരോ മൂല്യവും
  rationale: ലേവ്യപുസ്തകം 27-ലെ നേർച്ചകളും സമർപ്പിതരായ വ്യക്തികളും വസ്തുക്കളും സംബന്ധിച്ച ഔദ്യോഗിക മൂല്യനിർണയമാണ് ערך സൂചിപ്പിക്കുന്നത്. രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയം ‘നീ നിശ്ചയിക്കുന്ന’ എന്നു നിലനിർത്തി.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കെൽ അനുസരിച്ച്
  rationale: ആരാധനാസംബന്ധമായ മൂല്യനിർണയങ്ങൾക്ക് ഉപയോഗിച്ചിരുന്ന ഔദ്യോഗിക തൂക്കമാനദണ്ഡത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘വിശുദ്ധമായ ശേക്കെൽ’ എന്ന ഗുണവിശേഷണമാത്രമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: גֵּרָה
  choice: ഗേര
  rationale: ഗേര ചെറിയൊരു തൂക്ക/നാണയ അളവാണ്. സ്വാഭാവികമായ മലയാള തുല്യപദമില്ലാത്തതിനാൽ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: ഒരു ശേക്കെൽ ഇരുപത് ഗേര ആയിരിക്കണം
  rationale: ശേക്കെലിന്റെ നിർവചിത അളവ് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; നിയമപരമായ നിർദേശഭാവവും നിലനിർത്തുന്നു.
- source_word: וְכָל
  choice: ഓരോ
  rationale: സന്ദർഭത്തിലെ വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വാക്യാരംഭത്തിലെ וְ മലയാളത്തിൽ നിർബന്ധമായി വേറിട്ട സംയോജകമായി നൽകേണ്ടതില്ല.
- source_word: יִהְיֶה
  choice: ആയിരിക്കണം
  rationale: നിയമസാഹിത്യത്തിലെ നിർദേശാത്മക അപൂർണക്രിയയുടെ ശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
