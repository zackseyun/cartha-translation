id: LEV.27.34
reference: Leviticus 27:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: ml
  text: യഹ്‌വെ സീനായ് പർവതത്തിൽ മോശയോടു ഇസ്രായേൽമക്കൾക്കായി[a] കൽപ്പിച്ച കൽപ്പനകൾ ഇവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേൽമക്കളോട്’ അല്ലെങ്കിൽ ‘ഇസ്രായേൽമക്കളെ സംബന്ധിച്ച്.’
    reason: אֶל എന്ന മുൻവ്യയം ഈ ഘടനയിൽ ലക്ഷ്യസ്വീകർത്താവിനെയോ അവരെ സംബന്ധിച്ചുള്ള കല്പനയെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവയാണ്
  rationale: സമാപനസംഗ്രഹം അവതരിപ്പിക്കുന്ന പ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികമായ നാമവാക്യരൂപം.
- source_word: הַמִּצְוֺת
  choice: കല്പനകൾ
  rationale: മִצְוָהയുടെ ആജ്ഞാപരവും നിയമപരവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר
  choice: —ച്ച
  rationale: ഹീബ്രു ബന്ധസർവനാമത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാല കൃদন্তബന്ധരൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ച
  rationale: കല്പന പുറപ്പെടുവിക്കുക എന്ന ക്രിയാർത്ഥം നേരിട്ട് നൽകുകയും ‘കല്പനകൾ’ എന്ന നാമത്തോടുള്ള പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶת מֹשֶׁה
  choice: മോശയോടു
  rationale: മോശെയാണ് കല്പന സ്വീകരിക്കുന്ന വ്യക്തി എന്ന ക്രിയാസംബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കായി
  rationale: കല്പനകൾ ഇസ്രായേൽമക്കളെ ഉദ്ദേശിച്ചുള്ളവയാണെന്ന സന്ദർഭാർത്ഥം നൽകുന്നു; אֶל എന്നതിലെ ‘അവരോട്/അവർക്കായി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּהַר סִינָי
  choice: സീനായ് മലയിൽവെച്ച്
  rationale: സംഭവസ്ഥലം സൂചിപ്പിക്കുന്ന בְ മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനപ്രയോഗത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം; ഇസ്രായേല്യർ
  rationale: ഹീബ്രു ബന്ധപ്രയോഗത്തിന്റെ രൂപഭാവം കഴിയുന്നത്ര നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സമൂഹത്തെ പ്രതിനിധീകരിക്കുന്ന ജനവിഭാഗനാമമാണ്, പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല.
- issue: אֶל എന്ന മുൻവ്യയത്തിന്റെ ബന്ധാർത്ഥം
  choice: ഇസ്രായേൽമക്കൾക്കായി
  alternative: ഇസ്രായേൽമക്കളോട്; ഇസ്രായേൽമക്കളെ സംബന്ധിച്ച്
  rationale: മോശയ്ക്കു നൽകിയ കല്പനകൾ ഇസ്രായേലിനു കൈമാറാനുള്ളവയാണെന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിലെ വ്യാകരണപരമായ തുറന്ന നില അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ സമാപനസൂത്രവാക്യം. ‘കല്പിച്ച കല്പനകൾ’ എന്ന ആവർത്തനം ഹീബ്രുവിലെ צִוָּה/מִצְוֺת പദബന്ധം ഉദ്ദേശപൂർവം നിലനിർത്തുന്നു.
