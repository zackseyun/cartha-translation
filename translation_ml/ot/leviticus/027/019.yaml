source:
  edition: WLC
  text: וְ/אִם גָּאֹ֤ל יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה הַ/מַּקְדִּ֖ישׁ אֹת֑/וֹ וְ֠/יָסַף חֲמִשִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/קָ֥ם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: ml
  text: എന്നാൽ ആ വയൽ വിശുദ്ധമായി വേർതിരിച്ചവൻ അതു തീർച്ചയായും വീണ്ടെടുക്കുന്നുവെങ്കിൽ,[a] നിന്റെ മൂല്യനിർണയത്തുകയുടെ അഞ്ചിലൊന്ന് അതിനു പുറമേ അവൻ ചേർക്കണം;[b] അപ്പോൾ ആ വയൽ അവനുള്ളതായിരിക്കും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിശുദ്ധമായി വേർതിരിച്ചവൻ” എന്നതിന് “സമർപ്പിച്ചവൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “നിന്റെ മൂല്യനിർണയത്തിന്റെ വെള്ളിയുടെ അഞ്ചിലൊന്ന്.”'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ “അത് അവന്റേതായിരിക്കും”; അക്ഷരാർഥം: “അത് അവനുവേണ്ടി നിലനിൽക്കും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻനിയമത്തിന്റെ തുടർച്ചയിലുള്ള വ്യവസ്ഥയാണെങ്കിലും ഇവിടെ ഒരു വിപരീതസാധ്യത അവതരിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: גָּאֹל יִגְאַל
  choice: തീർച്ചയായും വീണ്ടെടുക്കുന്നെങ്കിൽ
  rationale: ക്രിയയുടെ infinitive absolute + imperfect ഘടന നൽകുന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: הַשָּׂדֶה
  choice: ആ വയൽ
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞിട്ടുള്ള നിർദിഷ്ട വയലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: അതിനെ വിശുദ്ധമായി വേർതിരിച്ചവൻ
  rationale: הקדישׁ എന്ന ആരാധനാസംബന്ധമായ ക്രിയയുടെ ‘വിശുദ്ധ ആവശ്യത്തിനായി വേർതിരിക്കുക’ എന്ന അർഥം സാധാരണ വായനക്കാർക്കു വ്യക്തമായി നൽകുന്നു.
- source_word: וְיָסַף
  choice: കൂടി അവൻ ചേർക്കണം
  rationale: നിയമസന്ദർഭത്തിലെ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: חֲמִשִׁית כֶּסֶף עֶרְכְּךָ
  choice: നിന്റെ മൂല്യനിർണയത്തുകയോടുകൂടെ അതിന്റെ അഞ്ചിലൊന്നു
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ മൂല്യനിർണയത്തിന്റെ വെള്ളിയുടെ അഞ്ചിലൊന്ന്’ എന്നതിലെ സാമ്പത്തിക അർഥവും രണ്ടാംപുരുഷ അഭിസംബോധനയും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: וְקָם לוֹ
  choice: ആ വയൽ അവന്റേതായി ഉറപ്പിക്കപ്പെടും
  rationale: ‘അവനുവേണ്ടി നിലനിൽക്കും’ എന്ന ഹീബ്രു നിയമപ്രയോഗത്തിന്റെ ഉടമസ്ഥത ഉറപ്പാകുന്നു എന്ന അർഥം നൽകുന്നു; വയലാണ് കർത്താവെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: הקדישׁ എന്ന ആരാധനാസംബന്ധമായ ക്രിയ
  choice: വിശുദ്ധമായി വേർതിരിച്ചവൻ
  alternative: സമർപ്പിച്ചവൻ; വിശുദ്ധീകരിച്ചവൻ
  rationale: വസ്തുവിനെ യഹോവയ്ക്കായി വിശുദ്ധ ഉപയോഗത്തിനു വേർതിരിക്കുന്ന ആശയം സംരക്ഷിക്കുന്നു; വെറും ലൗകിക ദാനമായി അർഥം ചുരുക്കുന്നില്ല.
- issue: നിയമവാക്യത്തിന്റെ വിധിനിർദേശസ്വഭാവം
  choice: ചേർക്കണം ... ഉറപ്പിക്കപ്പെടും
  alternative: ചേർക്കും ... അവന്റേതായിരിക്കും
  rationale: ആദ്യക്രിയയിലെ ബാധ്യതയും അവസാനപ്രയോഗത്തിലെ നിയമപരമായ ഫലവും തമ്മിലുള്ള വ്യത്യാസം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഔപചാരികവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ നിയമ-ആരാധനാ ശൈലി. ‘വീണ്ടെടുക്കുക’, ‘വിശുദ്ധമായി വേർതിരിക്കുക’ എന്നീ പദങ്ങൾ മൂലഭാഷയിലെ ആരാധനാസംബന്ധമായ അർഥം നിലനിർത്തുന്നു; ദുർഗ്രാഹ്യമായ അക്ഷരാനുവാദം മുഖ്യവാക്യത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
