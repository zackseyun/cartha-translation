id: LEV.1.14
reference: Leviticus 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: ml
  text: ഒരു വ്യക്തിയുടെ യഹോവയ്ക്കുള്ള വഴിപാട് പക്ഷികളിൽനിന്നുള്ള ഹോമയാഗമാണെങ്കിൽ, ആ വ്യക്തി തന്റെ വഴിപാട് കുറുപ്രാവുകളിൽനിന്നോ പ്രാവിൻകുഞ്ഞുങ്ങളിൽനിന്നോ അർപ്പിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: ആണെങ്കിൽ
  rationale: തുടർന്നുള്ള യാഗനിർദേശത്തിലെ പുതിയ സാധ്യത അവതരിപ്പിക്കുന്ന വ്യവസ്ഥാഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാക്യാരംഭത്തിലെ וְ വേറിട്ട് ‘എന്നാൽ’ എന്നു നൽകേണ്ട ആവശ്യമില്ല.
- source_word: מִן הָעוֹף
  choice: പക്ഷികളിൽനിന്നുള്ള
  rationale: യാഗത്തിനായി ഉപയോഗിക്കുന്ന പറവകളെ സൂചിപ്പിക്കുന്ന പൊതുപദമാണ്; ആധുനിക മലയാളത്തിൽ ‘പക്ഷികൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന ഈ പ്രത്യേക യാഗവിഭാഗത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും കൃത്യവുമായ പദം.
- source_word: קָרְבָּנוֹ
  choice: തന്റെ വഴിപാട്
  rationale: അടുത്തുകൊണ്ടുവരുന്ന സമർപ്പണത്തെ സൂചിപ്പിക്കുന്ന പൊതുപദമായ קָרְבָּן ഇവിടെ സ്വാഭാവികമായി ‘വഴിപാട്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: ל എന്ന ബന്ധം സമർപ്പണം യഹോവയ്ക്കുള്ളതാണെന്ന് വ്യക്തമാക്കുന്നു; ദൈവനാമം പരോക്ഷമായ സ്ഥാനപ്പേരാൽ മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְהִקְרִיב
  choice: അർപ്പിക്കണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗം കൊണ്ടുവന്ന് ആചാരപരമായി സമർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ നിർദേശഭാവത്തിന് ‘അർപ്പിക്കണം’ സ്വാഭാവികമാണ്.
- source_word: מִן הַתֹּרִים
  choice: കുറുപ്രാവുകളിൽനിന്നോ
  rationale: תֹּרִים എന്നത് turtledoves എന്ന പ്രത്യേക പ്രാവുവർഗത്തെ സൂചിപ്പിക്കുന്നു; അതിന് പ്രചാരത്തിലുള്ള മലയാളനാമം ‘കുറുപ്രാവ്’ ആണ്.
- source_word: אוֹ
  choice: -ഓ ... -ഓ
  rationale: അനുവദിച്ചിരിക്കുന്ന രണ്ടു പക്ഷിവർഗങ്ങൾക്കിടയിലെ വികല്പം മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: പ്രാവിൻകുഞ്ഞുങ്ങളിൽനിന്നോ
  rationale: ‘പ്രാവിന്റെ മക്കൾ’ എന്ന ഹീബ്രു പ്രയോഗം പ്രായം കുറഞ്ഞ പ്രാവുകളെ സൂചിപ്പിക്കുന്നു; പ്രായസൂചന നഷ്ടപ്പെടാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: אֶת קָרְבָּנוֹ
  choice: തന്റെ വഴിപാട്
  rationale: നേരിട്ടുള്ള കർമചിഹ്നമായ אֶת മലയാളത്തിൽ വേറിട്ട് വിവർത്തനം ചെയ്യേണ്ടതില്ല; ആവർത്തിച്ചിരിക്കുന്ന നാമം വാക്യത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- issue: עֹלָה എന്ന യാഗവിഭാഗത്തിന്റെ അർത്ഥം
  choice: ഹോമയാഗം
  alternative: ആരോഹണയാഗം
  rationale: ധാതുവിന് ‘കയറുക’ എന്ന ആശയബന്ധമുണ്ടെങ്കിലും ഇവിടെ ഒരു നിശ്ചിത യാഗവിഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്; ‘ഹോമയാഗം’ അതിന്റെ ആചാരപരമായ അർത്ഥം വായനക്കാരന് വ്യക്തമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വ്യക്തിയെ ലിംഗനിർണ്ണയം ചെയ്യാതെ പറയാൻ ‘ഒരാൾ/അയാൾ’ ഉപയോഗിച്ചു; യാഗസാങ്കേതിക പദങ്ങളിൽ പരിചിതമായ ‘ഹോമയാഗം’, ‘വഴിപാട്’ എന്നിവ നിലനിർത്തി.
