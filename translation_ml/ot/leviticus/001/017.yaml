id: LEV.1.17
reference: Leviticus 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שִׁסַּ֨ע אֹת֣/וֹ בִ/כְנָפָי/ו֮ לֹ֣א יַבְדִּיל֒ וְ/הִקְטִ֨יר אֹת֤/וֹ הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: ml
  text: പുരോഹിതൻ അതിനെ അതിന്റെ ചിറകുകളുടെ ഭാഗത്ത് പിളർക്കണം; എന്നാൽ അതിനെ വേർപെടുത്തരുത്. പുരോഹിതൻ അതിനെ യാഗപീഠത്തിന്മേൽ, തീയിന്മേലുള്ള വിറകിന്മേൽ, ദഹിപ്പിക്കണം. അത് യഹ്‌വേക്കുള്ള ദഹനയാഗം, അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗം[a], പ്രസാദകരമായ സൗരഭ്യം തന്നേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അഗ്നിയാഗം.”'
    reason: אִשֵּׁה എന്ന പദത്തിന്റെ സംക്ഷിപ്തമായ മറ്റൊരു സാധുവായ വിവർത്തനം നൽകുന്നു.
lexical_decisions:
- source_word: שִׁסַּע
  choice: പിളർക്കണം
  rationale: പക്ഷിയുടെ ശരീരം തുറക്കത്തക്കവിധം പിളർക്കുന്നതാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; പിന്നാലെയുള്ള ‘രണ്ടായി വേർപെടുത്തരുത്’ എന്ന നിർദേശം പൂർണമായി മുറിച്ചുമാറ്റരുതെന്ന പരിധി വ്യക്തമാക്കുന്നു.
- source_word: בִכְנָפָיו
  choice: ചിറകുകളോടുകൂടെ
  rationale: ബְּ എന്ന ഉപസർഗം ഇവിടെ സ്ഥലം/അനുബന്ധം സൂചിപ്പിക്കാം. പക്ഷിയെ ചിറകുകളോടുകൂടെ തുറന്നുപിളർക്കുന്ന ദൃശ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא יַבְדִּיל
  choice: അതിനെ രണ്ടായി വേർപെടുത്തരുത്
  rationale: בדל എന്ന ക്രിയയുടെ വേർതിരിക്കുക എന്ന അർഥം വ്യക്തമായി നൽകുകയും, പിളർത്തിയാലും ഭാഗങ്ങൾ പൂർണമായി വേർപെടരുതെന്ന നിർദേശം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִקְטִיר
  choice: ദഹിപ്പിക്കണം
  rationale: യാഗസന്ദർഭത്തിൽ യാഗപീഠത്തിന്മേൽ കത്തിച്ച് പുകയായി ഉയർത്തുന്ന പ്രവൃത്തിയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദഹിപ്പിക്കണം’ സംക്ഷിപ്തവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ബലികർമസന്ദർഭത്തിലെ altar എന്ന ആശയത്തിനുള്ള സ്വാഭാവികവും നിലവാരമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: തീയിന്മേലുള്ള വിറകിന്മേൽ
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ച עַל ഘടനയും യാഗപീഠത്തിലെ അടുക്കിവെച്ച ക്രമവും കഴിയുന്നത്ര സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: עֹלָה
  choice: ദഹനയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള സ്ഥാപിതവും കൃത്യവുമായ മലയാളപദം.
- source_word: אִשֵּׁה
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗം
  rationale: പദത്തിന്റെ അഗ്നിയുമായി ബന്ധപ്പെട്ട യാഗാർഥം നേരിട്ട് നൽകുന്നു; ‘ഭോജനയാഗം’ എന്നു വിവർത്തനം ചെയ്ത് പാഠത്തിൽ ഉറപ്പില്ലാത്ത വ്യാഖ്യാനം ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യം
  rationale: ദൈവിക സ്വീകാര്യത സൂചിപ്പിക്കുന്ന യാഗസൂത്രവാക്യത്തിന്റെ ഗന്ധരൂപകം നിലനിർത്തുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളം.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: ലְ എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണബന്ധം പ്രകടിപ്പിക്കുകയും יהוה എന്ന ദൈവനാമം മറയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള സവിശേഷ ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: רֵיחַ נִיחֹחַ എന്ന യാഗസൂത്രവാക്യം
  choice: പ്രസാദകരമായ സൗരഭ്യം
  alternative: ശാന്തിദായകമായ സൗരഭ്യം; ഹൃദ്യമായ സുഗന്ധം
  rationale: യാഗത്തിന്റെ ദൈവിക സ്വീകാര്യതയെ സൂചിപ്പിക്കുന്ന രൂപകം സംരക്ഷിക്കുന്നു; പാഠത്തിൽ ഇല്ലാത്ത പാപപരിഹാരവ്യാഖ്യാനമോ മറ്റു പിൽക്കാല വിഭാഗങ്ങളോ ചേർക്കുന്നില്ല.
- issue: אִשֵּׁה എന്ന പദത്തിന്റെ അർഥം
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗം
  alternative: അഗ്നിയാഗം; ഭോജനയാഗം
  rationale: പദത്തിന്റെ വ്യുത്പത്തിയും യാഗസന്ദർഭവും പിന്തുടർന്ന് അഗ്നിയിലുള്ള അർപ്പണം പ്രധാനപാഠത്തിൽ നൽകുന്നു; ‘ഭോജനയാഗം’ എന്ന വിവാദപരമായ അർഥം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. യാഗസാങ്കേതിക പദങ്ങൾ വ്യക്തമായി സൂക്ഷിച്ചു; മൂലപാഠത്തിലെ പ്രവർത്തനക്രമവും അഗ്നിയാഗം എന്ന പദത്തിലെ അർഥസാധ്യതയും അനാവശ്യമായി വ്യാഖ്യാനിച്ചില്ല.
