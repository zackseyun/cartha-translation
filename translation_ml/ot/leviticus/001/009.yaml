revisions:
- from: എന്നാൽ അതിന്റെ കുടലുകളും കാലുകളും വെള്ളത്തിൽ കഴുകണം. പുരോഹിതൻ അതു മുഴുവനും യാഗപീഠത്തിന്മേൽ പുകയായി ഉയർത്തണം. അത് യഹോവയ്ക്കു പ്രസാദകരമായ സൗരഭ്യമായ ദഹനയാഗം, അഗ്നിയർപ്പണം[a] ആകുന്നു.[b]
  to: എന്നാൽ അതിന്റെ ഉള്ളവയവങ്ങളും കാലുകളും വെള്ളത്തിൽ കഴുകണം; പുരോഹിതൻ അതു മുഴുവനും യാഗപീഠത്തിന്മേൽ പുകയായി ഉയർത്തണം—യഹോവയ്ക്കുള്ള ദഹനയാഗമായി, അഗ്നിയർപ്പണമായി,[a] പ്രസാദകരമായ സൗരഭ്യമായി.[b]
  rationale: The revision broadens 'കുടലുകൾ' to the more source-faithful 'ഉള്ളവയവങ്ങൾ' and restores the Hebrew's direct syntactic sequence by attaching the three sacrificial descriptions to the priest's offering action. It retains the draft's judicious handling of the disputed term אִשֶּׁה and places each footnote marker at its relevant expression.
