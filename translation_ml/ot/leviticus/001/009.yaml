reference: Leviticus 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/קִרְבּ֥/וֹ וּ/כְרָעָ֖י/ו יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיח֖וֹחַ לַֽ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: ml
  text: എന്നാൽ അതിന്റെ ഉള്ളവയവങ്ങളും കാലുകളും വെള്ളത്തിൽ കഴുകണം; പുരോഹിതൻ അതു മുഴുവനും യാഗപീഠത്തിന്മേൽ പുകയായി ഉയർത്തണം—യഹോവയ്ക്കുള്ള ദഹനയാഗമായി, അഗ്നിയർപ്പണമായി,[a] പ്രസാദകരമായ സൗരഭ്യമായി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭോജനയാഗം.” אִשֶּׁה എന്ന ഹീബ്രുപദം “അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗം” എന്നും “ഭോജനയാഗം” എന്നും മനസ്സിലാക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: “പ്രസാദകരമായ സൗരഭ്യം” എന്നത് യാഗം യഹോവയ്ക്കു സ്വീകാര്യമാണെന്നു സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: അതിന്റെ കുടലുകൾ
  rationale: യാഗസന്ദർഭത്തിൽ കֶרֶב മൃഗത്തിന്റെ ഉള്ളവയവങ്ങളെ സൂചിപ്പിക്കുന്നു; കഴുകുന്ന പ്രവൃത്തിയോട് ചേർന്ന് ‘കുടലുകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כְרָעָיו
  choice: കാലുകൾ
  rationale: മൃഗത്തിന്റെ താഴത്തെ കാലുകളെ സൂചിപ്പിക്കുന്ന പദം; സാങ്കേതികമല്ലാത്ത, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗം.
- source_word: יִרְחַץ בַּמָּיִם
  choice: വെള്ളത്തിൽ കഴുകണം
  rationale: בַּמָּיִם എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘വെള്ളത്തിൽ’ എന്നു നൽകാം; ആചാരപരമായ കഴുകൽ നിലനിർത്തുന്നു.
- source_word: וְהִקְטִיר
  choice: പുകയായി ഉയർത്തണം
  rationale: യാഗപീഠത്തിൽ അർപ്പണം കത്തിച്ച് പുകയായി ഉയർത്തുന്ന സവിശേഷ യാഗക്രിയയാണ് ഈ ഹിഫീൽ ക്രിയ സൂചിപ്പിക്കുന്നത്; വെറും ‘കത്തിക്കുക’ എന്നതിനെക്കാൾ കൃത്യം.
- source_word: אֶת־הַכֹּל
  choice: അതു മുഴുവനും
  rationale: ഒരുക്കിയ മൃഗത്തിന്റെ സമ്പൂർണതയെ ഊന്നിപ്പറയുന്നു.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: യാഗസന്ദർഭത്തിലെ സാധാരണവും വ്യക്തവുമായ മലയാള പദപ്രയോഗം.
- source_word: עֹלָה
  choice: ദഹനയാഗം
  rationale: മുഴുവനായി യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന ഈ യാഗത്തിനുള്ള സ്ഥാപിതവും സുതാര്യവുമായ മലയാള പദം.
- source_word: אִשֵּׁה
  choice: അഗ്നിയർപ്പണം
  rationale: പദത്തിന്റെ വ്യുത്പത്തിയിലും പരമ്പരാഗത വ്യാഖ്യാനത്തിലും ഉള്ള അഗ്നിസംബന്ധം നിലനിർത്തുന്നു; ‘ഭോജനയാഗം’ എന്നു നിർണ്ണയിച്ച് അർത്ഥവിവാദം തീർക്കുന്നില്ല.
- source_word: רֵיחַ נִיחוֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യം
  rationale: ദൈവത്തിന് യാഗം സ്വീകാര്യമാണെന്നു സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗസൂത്രത്തിന്റെ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: ഹീബ്രു പാഠത്തിലുള്ള ദൈവനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രത്യേക നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം നിലനിർത്തി.
- issue: אִשֵּׁה എന്ന യാഗപദത്തിന്റെ അർത്ഥം
  choice: അഗ്നിയർപ്പണം
  alternative: ഭോജനയാഗം
  rationale: ഈ പദത്തിന്റെ കൃത്യമായ വ്യാഖ്യാനം വിവാദവിധേയമാണ്. പ്രധാന പാഠത്തിൽ അഗ്നിസംബന്ധമായ അർത്ഥം നിലനിർത്തുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
- issue: רֵיחַ נִיחוֹחַ എന്ന യാഗസൂത്രം
  choice: പ്രസാദകരമായ സൗരഭ്യം
  alternative: ശാന്തിദായകമായ സൗരഭ്യം
  rationale: ദൈവിക അംഗീകാരത്തെ സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്നു; ദൈവത്തിന് ശാരീരിക ഗന്ധാവശ്യം ഉണ്ടെന്ന ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ ക്രിയാനുക്രമവും യാഗപരമായ വിശേഷണശ്രേണിയും വ്യക്തമായ ചെറുവാക്യങ്ങളാക്കി നൽകി; പാഠത്തിലെ യാഗരൂപകവും അർത്ഥവൈവിധ്യവും നിലനിർത്തി.
