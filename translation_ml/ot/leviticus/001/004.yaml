id: LEV.1.4
reference: Leviticus 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/סָמַ֣ךְ יָד֔/וֹ עַ֖ל רֹ֣אשׁ הָ/עֹלָ֑ה וְ/נִרְצָ֥ה ל֖/וֹ לְ/כַפֵּ֥ר עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: ml
  text: അവൻ ഹോമയാഗത്തിന്റെ തലയിൽ തന്റെ കൈ വയ്ക്കണം; അത് അവനു സ്വീകാര്യമായിരിക്കും, അവന്റെ പ്രായശ്ചിത്തത്തിനായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവൻ സ്വീകാര്യനാകും.” ഹീബ്രുവിലെ നിഷ്ക്രിയരൂപം യാഗത്തെക്കാൾ നേരിട്ട് യാഗം അർപ്പിക്കുന്നവനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמַךְ
  choice: കൈവെക്കണം
  rationale: യാഗസന്ദർഭത്തിൽ סמך മൃഗത്തിന്മേൽ കൈ വയ്ക്കുകയോ അമർത്തിവയ്ക്കുകയോ ചെയ്യുന്ന ആചാരപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കൈവെക്കണം’ സ്വാഭാവികവും ബലത്തിന്റെ അളവ് അനാവശ്യമായി നിർണ്ണയിക്കാത്തതുമാണ്.
- source_word: יָדוֹ
  choice: കൈ
  rationale: ഹീബ്രുവിലെ ഏകവചനം നിലനിർത്തുന്നു; മലയാളത്തിൽ കർത്താവിന്റെ ഉടമസ്ഥബന്ധം ക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: עַל רֹאשׁ
  choice: തലയിൽ
  rationale: ശാരീരിക പ്രവൃത്തിയെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിന്റെ സ്ഥിരമായ മലയാള ബൈബിൾ പദമാണ്; പദോൽപ്പത്തിപരമായ ‘ആരോഹണയാഗം’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്.
- source_word: וְנִרְצָה
  choice: അത് ... സ്വീകരിക്കപ്പെടും
  rationale: רצהയുടെ നിഫാൽ രൂപത്തിലെ നിഷ്ക്രിയ അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ സമീപസ്ഥമായ യാഗവസ്തുവിനെയാണ് പ്രധാന വായനയിൽ സൂചിപ്പിക്കുന്നത്; കർത്താവിനെ യാഗമായി വ്യക്തമാക്കുന്ന ‘അത്’ മലയാളത്തിൽ ആവശ്യമാണ്.
- source_word: לוֹ
  choice: അവനുവേണ്ടി
  rationale: ഗുണഭോക്താവിനെയോ പ്രയോജനം ലഭിക്കുന്ന വ്യക്തിയെയോ സൂചിപ്പിക്കുന്ന לְ എന്ന ബന്ധം ചുരുക്കമായും വിശാലമായും നിലനിർത്തുന്നു.
- source_word: לְכַפֵּר
  choice: പ്രായശ്ചിത്തം വരുത്താൻ
  rationale: כפר എന്ന പ്രധാന യാഗപരമായ പദത്തിന്റെ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു; പ്രായശ്ചിത്തത്തിന്റെ പ്രവർത്തനരീതി ഒരു പ്രത്യേക സിദ്ധാന്തപ്രകാരം ചുരുക്കുന്നില്ല.
- source_word: עָלָיו
  choice: അവനുവേണ്ടി
  rationale: כפר-നോടൊപ്പമുള്ള על യാഗം അർപ്പിക്കുന്ന വ്യക്തിയുടെ പക്ഷത്തോ നന്മയ്ക്കായോ പ്രായശ്ചിത്തം നടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: וְנִרְצָה എന്ന നിഷ്ക്രിയ ക്രിയയുടെ സൂചിത കർത്താവ്
  choice: യാഗം സ്വീകരിക്കപ്പെടുന്നു
  alternative: യാഗം അർപ്പിക്കുന്നവൻ സ്വീകരിക്കപ്പെടുന്നു
  rationale: ക്രിയ മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചനമാണ്; സന്ദർഭത്തിലെ ഏറ്റവും അടുത്ത യാഗപരമായ സൂചകം הָעֹלָה ആണ്. അതിനാൽ പ്രധാന പാഠത്തിൽ യാഗത്തെ സൂചിപ്പിക്കുന്ന ‘അത്’ സ്വീകരിച്ചു. എന്നാൽ നിഷ്ക്രിയ പ്രയോഗം യാഗം അർപ്പിക്കുന്നവന്റെ സ്വീകാര്യതയെ കൂടുതൽ നേരിട്ട് സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാവുന്നതിനാൽ ആ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. സ്ഥാപിതമായ യാഗപരമായ പദങ്ങളായ ‘ഹോമയാഗം’, ‘പ്രായശ്ചിത്തം’ എന്നിവ ഉപയോഗിച്ചു. മൂലത്തിലെ വാക്യക്രമവും നിഷ്ക്രിയതയും സാധ്യമായത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിന്റെ സ്വാഭാവികത സംരക്ഷിച്ചു.
