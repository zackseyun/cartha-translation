revisions:
- from: അവൻ ഹോമയാഗത്തിന്റെ തലയിൽ കൈവെക്കണം; അവനുവേണ്ടി പ്രായശ്ചിത്തം വരുത്താൻ അത് അവനുവേണ്ടി സ്വീകരിക്കപ്പെടും.[a]
  to: അവൻ ഹോമയാഗത്തിന്റെ തലയിൽ തന്റെ കൈ വയ്ക്കണം; അത് അവനു സ്വീകാര്യമായിരിക്കും, അവന്റെ പ്രായശ്ചിത്തത്തിനായി.[a]
  rationale: The revision preserves the source’s ritual action, passive ambiguity, and atonement language while making the sentence idiomatic in modern standard Malayalam. It avoids resolving the disputed referent of וְנִרְצָה and retains the alternative in the footnote.
