    text: അല്ലെങ്കിൽ, “അവൻ സ്വീകാര്യനാകും.” ഹീബ്രുവിലെ നിഷ്ക്രിയരൂപം യാഗത്തെക്കാൾ നേരിട്ട് യാഗം അർപ്പിക്കുന്നവനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
