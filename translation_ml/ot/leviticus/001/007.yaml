id: LEV.1.7
reference: Leviticus 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/נָתְנוּ בְּנֵ֨י אַהֲרֹ֧ן הַ/כֹּהֵ֛ן אֵ֖שׁ עַל הַ/מִּזְבֵּ֑חַ וְ/עָרְכ֥וּ עֵצִ֖ים עַל הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/007.yaml
  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: ml
  text: പുരോഹിതനായ അഹരോന്റെ പുത്രന്മാർ യാഗപീഠത്തിന്മേൽ തീ വെക്കുകയും, തീയുടെമേൽ വിറക് ക്രമമായി അടുക്കുകയും വേണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: വെച്ച്
  rationale: נתן എന്ന ക്രിയയ്ക്ക് ഇവിടെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥമാണ്; യാഗക്രമത്തിലെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോന്റെ പുത്രന്മാർ
  rationale: הַכֹּהֵן എന്ന ഏകവചന വിശേഷണം അഹരോനെയാണ് വിശേഷിപ്പിക്കുന്നത്; എബ്രായത്തിലെ ബന്ധവും കുടുംബപരമായ തിരിച്ചറിയലും നിലനിർത്തുന്നു.
- source_word: אֵשׁ
  choice: തീ
  rationale: ബലിയർപ്പണക്രമത്തിലെ അക്ഷരാർഥത്തിലുള്ള തീയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ബലിയർപ്പണസന്ദർഭത്തിൽ מִזְבֵּחַ എന്നതിന് ‘യാഗപീഠം’ വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: וְעָרְכוּ
  choice: ക്രമമായി അടുക്കണം
  rationale: ערך ഇവിടെ വെറുതെ ഇടുക എന്നതിലുപരി ക്രമപ്പെടുത്തി നിരത്തുക എന്ന ആശയം നൽകുന്നു; ‘ക്രമമായി അടുക്കുക’ ആ സൂക്ഷ്മത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֵצִים
  choice: വിറക്
  rationale: അഗ്നിക്കായി ഉപയോഗിക്കുന്ന മരക്കഷണങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന സമാഹാരനാമമാണ് ‘വിറക്’; ‘മരം’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: עַל הָאֵשׁ
  choice: തീയുടെമേൽ
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള സ്ഥാനസൂചന നിലനിർത്തി പ്രവർത്തനക്രമം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. എബ്രായത്തിലെ വാക്യക്രമവും ആചാരപരമായ കൃത്യതയും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട്, ക്രിയകളുടെ നിർദേശാത്മക ശക്തി ‘അടുക്കണം’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിച്ചു.
