source:
  edition: WLC
  text: וְ/עָרְכ֗וּ בְּנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים אֵ֚ת הַ/נְּתָחִ֔ים אֶת הָ/רֹ֖אשׁ וְ/אֶת הַ/פָּ֑דֶר עַל הָ/עֵצִים֙ אֲשֶׁ֣ר עַל הָ/אֵ֔שׁ אֲשֶׁ֖ר עַל הַ/מִּזְבֵּֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: ml
  text: പുരോഹിതന്മാരായ അഹരോന്റെ പുത്രന്മാർ കഷണങ്ങളും തലയും മേദസ്സും[a] യാഗപീഠത്തിന്മേലുള്ള തീയുടെമേലുള്ള വിറകിൽ ക്രമമായി വെക്കേണ്ടതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മേദസ്സിന്റെ ആവരണം’ അല്ലെങ്കിൽ ‘കൊഴുപ്പേറിയ ഭാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം യാഗത്തിനുപയോഗിച്ച മൃഗത്തിന്റെ കൊഴുപ്പേറിയ ഒരു ഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: ക്രമമായി വെക്കണം
  rationale: യാഗക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ ערך എന്നത് വസ്തുക്കൾ ക്രമപ്പെടുത്തി വെക്കുക എന്ന നടപടിക്രമാർഥം നൽകുന്നു. ‘ക്രമമായി വെക്കണം’ എന്നത് ആ നിർദേശഭാവവും ക്രമീകരണവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: പുരോഹിതന്മാരായ അഹരോന്റെ പുത്രന്മാർ
  rationale: ‘പുരോഹിതന്മാർ’ എന്നത് അഹരോന്റെ പുത്രന്മാരെ വിശദീകരിക്കുന്ന സമാനാധികരണ പ്രയോഗമാണ്; മലയാളത്തിൽ ഈ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַנְּתָחִים
  choice: കഷണങ്ങൾ
  rationale: മുൻഘട്ടത്തിൽ മുറിച്ച മൃഗത്തിന്റെ ഭാഗങ്ങളെയാണ് נְתָחִים സൂചിപ്പിക്കുന്നത്. ‘കഷണങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മൂലപദത്തോട് ചേർന്നതുമാണ്.
- source_word: הָרֹאשׁ
  choice: തല
  rationale: നേരിട്ടുള്ള ശരീരാവയവനാമം; അർഥവികാസം ആവശ്യമില്ല.
- source_word: הַפָּדֶר
  choice: മേദസ്സ്
  rationale: פָּדֶר യാഗത്തിനുപയോഗിക്കുന്ന കൊഴുപ്പേറിയ ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ ശരീരഘടനാപരമായ സൂചന അനിശ്ചിതമായതിനാൽ പൊതുവായതും മാന്യവുമായ ‘മേദസ്സ്’ മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: עַל הָעֵצִים
  choice: വിറകിന്മേൽ
  rationale: עֵצִים ഇവിടെ തീക്കുള്ള ഇന്ധനമായ വിറകിനെ കൂട്ടാർഥത്തിൽ സൂചിപ്പിക്കുന്നു. ‘വിറക്’ ഈ യാഗസന്ദർഭത്തിൽ ‘മരം’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേലുള്ള തീയുടെമേലുള്ള വിറകിന്മേൽ
  rationale: എബ്രായത്തിലെ തുടർച്ചയായ രണ്ടു ബന്ധവാക്യങ്ങൾ നൽകുന്ന സ്ഥലക്രമം—യാഗപീഠത്തിന്മേൽ തീ, തീയുടെമേൽ വിറക്—ലളിതമാക്കി മാറ്റാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ഗൗരവമുള്ള നടപടിക്രമശൈലി സ്വീകരിച്ചു. എബ്രായവാക്യത്തിലെ സ്ഥലബന്ധങ്ങളുടെ ആവർത്തനസ്വഭാവം അർഥവ്യക്തത നഷ്ടപ്പെടാതെ നിലനിർത്തി; അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ‘മേദസ്സ്’ എന്ന പദത്തിനുശേഷം ചേർത്തു.
