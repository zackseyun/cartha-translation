source:
  edition: WLC
  text: וְ/נִתַּ֤ח אֹת/וֹ֙ לִ/נְתָחָ֔י/ו וְ/אֶת רֹאשׁ֖/וֹ וְ/אֶת פִּדְר֑/וֹ וְ/עָרַ֤ךְ הַ/כֹּהֵן֙ אֹתָ֔/ם עַל הָֽ/עֵצִים֙ אֲשֶׁ֣ר עַל הָ/אֵ֔שׁ אֲשֶׁ֖ר עַל הַ/מִּזְבֵּֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: ml
  text: അവൻ അതിനെ അതിന്റെ കഷണങ്ങളായി മുറിക്കണം; അതിന്റെ തലയും കൊഴുപ്പും[a] സഹിതം അവയെ പുരോഹിതൻ യാഗപീഠത്തിന്മേലുള്ള തീയിൽ കിടക്കുന്ന വിറകിന്മേൽ ക്രമമായി നിരത്തണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൊഴുപ്പ്” എന്നതിന് “മേദസ്സ്” എന്നോ “ആന്തരാവയവങ്ങളെ പൊതിഞ്ഞിരിക്കുന്ന കൊഴുപ്പ്” എന്നോ വിവർത്തനം ചെയ്യാം. എബ്രായപദം യാഗമൃഗവുമായി ബന്ധപ്പെട്ട കൊഴുപ്പുള്ള കലകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח ... לִנְתָחָיו
  choice: അതിനെ അതിന്റെ കഷണങ്ങളായി മുറിക്കണം
  rationale: യാഗമൃഗത്തെ നിശ്ചിത കഷണങ്ങളാക്കുന്ന നടപടിയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും നടപടിക്രമത്തിന്റെ നിർദേശഭാവം നിലനിർത്തുന്നതുമായ പ്രയോഗം.
- source_word: רֹאשׁוֹ
  choice: അതിന്റെ തല
  rationale: യാഗമൃഗത്തിന്റെ ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള വിവർത്തനം.
- source_word: פִּדְרוֹ
  choice: അതിന്റെ കൊഴുപ്പ്
  rationale: യാഗമൃഗവുമായി ബന്ധപ്പെട്ട കൊഴുപ്പുള്ള കലകളെ സൂചിപ്പിക്കുന്ന പദം; കൂടുതൽ സാങ്കേതികമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְעָרַךְ
  choice: ക്രമമായി വെക്കണം
  rationale: യാഗക്രമത്തിൽ വസ്തുക്കൾ ചിട്ടയോടെ നിരത്തിവെക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗശുശ്രൂഷ നിർവഹിക്കുന്ന כהן എന്ന പദത്തിന്റെ സാധാരണ മലയാളരൂപം.
- source_word: אֹתָם
  choice: അവയെ
  rationale: കഷണങ്ങൾ, തല, കൊഴുപ്പ് എന്നിവയെ ഒരുമിച്ച് തിരികെ സൂചിപ്പിക്കുന്നു.
- source_word: עַל הָעֵצִים
  choice: വിറകിന്മേൽ
  rationale: യാഗപീഠത്തിലെ തീയ്ക്കായി ഉപയോഗിക്കുന്ന മരം എന്ന സന്ദർഭത്തിൽ 'വിറക്' സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവും ആണ്.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേലുള്ള തീയിലെ വിറകിന്മേൽ
  rationale: വിറക് തീയുടെമേലും തീ യാഗപീഠത്തിന്മേലും എന്ന എബ്രായത്തിലെ പാളികളായ സ്ഥാനബന്ധം മലയാളത്തിൽ സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമ-യാഗനിർദേശ ശൈലി. എബ്രായത്തിലെ നിർദേശഭാവവും സ്ഥലബന്ധവും സംരക്ഷിച്ചുകൊണ്ട്, ദീർഘമായ ബന്ധവാക്യത്തിനു പകരം സ്വാഭാവിക മലയാളഘടന ഉപയോഗിച്ചു.
