id: LEV.1.11
reference: Leviticus 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁחַ֨ט אֹת֜/וֹ עַ֣ל יֶ֧רֶךְ הַ/מִּזְבֵּ֛חַ צָפֹ֖נָ/ה לִ/פְנֵ֣י יְהוָ֑ה וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: ml
  text: അവൻ അതിനെ യാഗപീഠത്തിന്റെ വടക്കുവശത്ത്, യഹോവയുടെ സന്നിധിയിൽ അറുക്കണം. പുരോഹിതന്മാരായ അഹരോന്റെ പുത്രന്മാർ അതിന്റെ രക്തം യാഗപീഠത്തിന്മേൽ ചുറ്റും എറിഞ്ഞൊഴിക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിന്റെ രക്തം യാഗപീഠത്തിന്മേൽ ചുറ്റും ശക്തിയായി ചീറ്റണം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ നേർത്തായി തളിക്കുന്നതല്ല, രക്തം ശക്തിയായി എറിഞ്ഞൊഴിക്കുന്ന പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: അറുക്കണം
  rationale: ശׁחט യാഗമൃഗത്തെ ആചാരാനുസൃതമായി അറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രത്യേക ക്രിയയാണ്; പൊതുവായ ‘കൊല്ലുക’ എന്നതിനെക്കാൾ കൃത്യം. ‘-ണം’ നിയമപരമായ ആചാരനിർദേശത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: യാഗപീഠത്തിന്റെ വടക്കുവശത്ത്
  rationale: יֶרֶךְ എന്നതിന്റെ ‘വശം/പാർശ്വം’ എന്ന അർഥവും צָפֹנָה സൂചിപ്പിക്കുന്ന വടക്കൻ സ്ഥാനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസാന്നിധ്യത്തിൽ നടക്കുന്ന യാഗക്രിയയെ സൂചിപ്പിക്കുന്ന ആരാധനാപരമായ പ്രയോഗം; לִפְנֵי എന്നതിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְזָרְקוּ
  choice: എറിഞ്ഞൊഴിക്കണം
  rationale: זרק എന്ന ക്രിയയിലെ എറിയുക/ശക്തിയായി ചീറ്റിക്കുക എന്ന ഭാവം നിലനിർത്തുന്നു; നേർത്ത തളിക്കൽ മാത്രമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: പുരോഹിതന്മാരായ അഹരോന്റെ പുത്രന്മാർ
  rationale: അഹരോന്റെ പുത്രന്മാരെയും അവരുടെ പുരോഹിതസ്ഥാനത്തെയും സമാനാധികരണ ഘടനയിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: דָּמוֹ
  choice: അതിന്റെ രക്തം
  rationale: സർവനാമം യാഗമൃഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അചേതന/മൃഗസൂചനയായ ‘അതിന്റെ’ സ്വാഭാവികമാണ്.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: യാഗപീഠത്തിന്മേൽ ചുറ്റും
  rationale: രക്തം യാഗപീഠത്തിലേക്ക് പ്രയോഗിക്കുന്നതും അതിന്റെ എല്ലാ വശങ്ങളിലുമായി ചെയ്യുന്നതും സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആചാരനിർദേശ ശൈലി. മൂലപാഠത്തിന്റെ ക്രമവും നിയമപരമായ ഭാവവും കഴിയുന്നത്ര നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി.
