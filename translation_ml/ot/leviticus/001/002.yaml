id: LEV.1.2
reference: Leviticus 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു[a] സംസാരിച്ച് അവരോടു പറയുക: നിങ്ങളിൽ ഒരാൾ[b] യഹ്‌വെയ്ക്ക് ഒരു വഴിപാട് കൊണ്ടുവരുമ്പോൾ, വളർത്തുമൃഗങ്ങളിൽനിന്ന്—കന്നുകാലികളിൽനിന്നോ ചെമ്മരിയാടുകളിലും കോലാടുകളിലുംനിന്നോ—നിങ്ങൾ നിങ്ങളുടെ വഴിപാട് കൊണ്ടുവരണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ‘ഇസ്രായേൽജനം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘മനുഷ്യൻ’ (אָדָם); ഇവിടെ സമൂഹത്തിലെ ഒരാളെ പ്രതിനിധാനപരമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികവും സഭ്യതയുള്ളതുമായ സംബോധന നൽകുന്നു.
- source_word: אָדָם
  choice: ഒരാൾ
  rationale: ഇവിടെ ഒരു വ്യക്തിയെ പ്രതിനിധാനപരമായി അവതരിപ്പിക്കുന്ന വ്യവസ്ഥാപരമായ പ്രയോഗമാണ്; ‘ഒരു മനുഷ്യൻ’ എന്നതിനെക്കാൾ ‘ഒരാൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്, മൂലത്തിലെ പ്രതിനിധാനപരമായ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יַקְרִיב / תַּקְרִיבוּ
  choice: കൊണ്ടുവരുക
  rationale: ഹിഫിൽ രൂപത്തിന് ബലിയർപ്പണസന്ദർഭത്തിൽ ‘അടുത്തുകൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന അർഥമുണ്ട്. ഒരേ ധാതുവിന്റെ ആവർത്തനം മലയാളത്തിലും ‘കൊണ്ടുവരുക’ എന്നു നിലനിർത്തുന്നു.
- source_word: קָרְבָּן
  choice: വഴിപാട്
  rationale: വിവിധതരം സമർപ്പണങ്ങളെ ഉൾക്കൊള്ളുന്ന വിശാലമായ പദമാണിത്; ‘ബലി’ എന്നത് ഇവിടെ അർഥം അനാവശ്യമായി ചുരുക്കാം.
- source_word: מִכֶּם
  choice: നിങ്ങളിൽ
  rationale: സമൂഹത്തിൽനിന്നുള്ള ഒരു വ്യക്തി എന്ന ഭാഗിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַבְּהֵמָה
  choice: വളർത്തുമൃഗങ്ങൾ
  rationale: ബലിക്കായി ഉപയോഗിക്കുന്ന ഗൃഹപാലിത മൃഗങ്ങളുടെ പൊതുവിഭാഗത്തെ വ്യക്തമാക്കുന്നു.
- source_word: הַבָּקָר
  choice: കന്നുകാലികൾ
  rationale: വലിയ കന്നുകാലികളായ പശുവർഗത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായ, സ്വാഭാവിക മലയാളപദം.
- source_word: הַצֹּאן
  choice: ആടുമാടുകൾ
  rationale: ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്ക്
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוהയെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് പേരായി നിലനിർത്തുന്നു; സ്വരീകരണത്തിൽ പൂർണനിശ്ചയമില്ലെങ്കിലും ‘യഹ്‌വെ’ വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട പുനർനിർമാണമാണ്.
- issue: אָדָם എന്ന പദത്തിലെ പ്രതിനിധാനപരമായ ഏകവചനം
  choice: ഒരാൾ
  alternative: ഒരു മനുഷ്യൻ
  rationale: നിയമത്തിലെ സങ്കൽപ്പിത വ്യക്തി സമൂഹത്തിലെ ഏതു അംഗത്തെയും പ്രതിനിധീകരിക്കുന്നു. മലയാളത്തിലെ ‘ഒരാൾ’ ഈ വ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റം
  choice: ‘ഒരാൾ ... കൊണ്ടുവരുമ്പോൾ’ എന്ന ഏകവചനവും ‘നിങ്ങൾ നിങ്ങളുടെ വഴിപാട്’ എന്ന ബഹുവചനവും നിലനിർത്തി
  alternative: മുഴുവൻ വാക്യവും ഏകവചനമാക്കുക
  rationale: മൂലപാഠം ആദ്യം വ്യക്തിഗത സംഭവം അവതരിപ്പിച്ചശേഷം സമൂഹത്തോട് ബഹുവചനത്തിൽ നിർദേശം നൽകുന്നു; ഈ ശ്രദ്ധേയമായ മാറ്റം സമതലപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യാഗനിയമത്തിന്റെ ഔപചാരിക സ്വരം നിലനിർത്തിയിരിക്കുമ്പോഴും ദുഷ്കരമായ സംസ്കൃതഭാരിത പദങ്ങൾ ഒഴിവാക്കി. മൂലത്തിലെ ക്രിയാവർത്തനവും ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റവും ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
