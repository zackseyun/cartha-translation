id: LEV.1.16
reference: Leviticus 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵסִ֥יר אֶת מֻרְאָת֖/וֹ בְּ/נֹצָתָ֑/הּ וְ/הִשְׁלִ֨יךְ אֹתָ֜/הּ אֵ֤צֶל הַ/מִּזְבֵּ֨חַ֙ קֵ֔דְמָ/ה אֶל מְק֖וֹם הַ/דָּֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: ml
  text: അവൻ അതിന്റെ തീറ്റസഞ്ചി[a] തൂവലുകളോടുകൂടെ[b] നീക്കണം; അതിനെ യാഗപീഠത്തിന്റെ കിഴക്കുവശത്തുള്ള ചാരം ഇടുന്ന സ്ഥലത്തേക്ക് എറിഞ്ഞുകളയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കഴുത്തുസഞ്ചി.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദത്തിന് ‘തൂവലുകളോടുകൂടെ’ എന്നാണ് നേരിട്ടുള്ള അർഥം; ചില പരിഭാഷകൾ ‘അതിലെ അഴുക്കോടുകൂടെ’ എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: നീക്കി
  rationale: സור എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു ഭാഗം നീക്കം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; യാഗക്രമനിർദേശത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: מֻרְאָתוֹ
  choice: അതിന്റെ തീറ്റസഞ്ചി
  rationale: പക്ഷിയുടെ ദഹനവ്യവസ്ഥയിലെ crop/craw എന്ന അവയവമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വ്യക്തമായ ശരീരശാസ്ത്രപദമായി ‘തീറ്റസഞ്ചി’ തിരഞ്ഞെടുത്തു.
- source_word: בְּנֹצָתָהּ
  choice: തൂവലുകളോടുകൂടെ
  rationale: വ്യഞ്ജനപാഠം נוצה (‘തൂവൽ/തൂവൽക്കൂട്ടം’) എന്ന പദവുമായി സ്വാഭാവികമായി ബന്ധപ്പെടുന്നു. ദുഷ്കരമായ പ്രയോഗമായതിനാൽ ‘അഴുക്കോടുകൂടെ’ എന്ന പരമ്പരാഗത വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: എറിഞ്ഞുകളയണം
  rationale: שלך എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന്റെ ‘എറിയുക/വലിച്ചെറിയുക’ എന്ന നേരിട്ടുള്ള അർഥവും നടപടിക്രമപരമായ നിർദേശഭാവവും ഇത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ ... വശത്ത്
  rationale: אצל സൂചിപ്പിക്കുന്ന യാഗപീഠത്തോടു ചേർന്നുള്ള സ്ഥാനം, തുടർന്നുള്ള കിഴക്കുദിശയുമായി ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: קֵדְמָה
  choice: കിഴക്കുവശത്ത്
  rationale: ദിശാസൂചകമായ ഈ രൂപം ഇവിടെ യാഗപീഠത്തിന്റെ കിഴക്കുഭാഗത്തുള്ള സ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: ചാരം ഇടുന്ന സ്ഥലത്തേക്ക്
  rationale: യാഗപീഠത്തിൽനിന്നുള്ള ചാരത്തിനായി നിശ്ചയിച്ച സ്ഥലത്തെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘ചാരക്കൂമ്പാരം’ എന്ന് മൂലപാഠത്തെക്കാൾ പ്രത്യേകമാക്കാതെ സ്ഥലത്തിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാഗക്രമനിർദേശ ശൈലി. സാങ്കേതികമായ പക്ഷിശരീരശാസ്ത്രപദത്തിന് മനസ്സിലാക്കാവുന്ന ‘തീറ്റസഞ്ചി’ ഉപയോഗിക്കുകയും പകരംപദം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
