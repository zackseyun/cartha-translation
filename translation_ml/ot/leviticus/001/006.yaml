translation:
  language: ml
  text: പിന്നെ അവൻ ഹോമയാഗമൃഗത്തിന്റെ തോലുരിച്ച്[a] അതിനെ അതിന്റെ കഷണങ്ങളായി മുറിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹോമയാഗമൃഗത്തിന്റെ തോൽ നീക്കി.’
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപദപ്രയോഗം: ‘അതിനെ അതിന്റെ കഷണങ്ങളായി മുറിക്കണം’; യാഗത്തിനായി മൃഗത്തെ വിവിധ ഭാഗങ്ങളായി വിഭജിക്കുന്നതിനെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: തോലുരിച്ച്
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള פשט ഇവിടെ യാഗമൃഗത്തിന്റെ തോൽ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തോലുരിക്കുക’ ആചാരനടപടി വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗമൃഗത്തിന്റെ
  rationale: עֹלָה ലേവ്യപുസ്തകത്തിൽ പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പദമാണ്. ഈ വാക്യത്തിൽ തോലുരിക്കുകയും മുറിക്കുകയും ചെയ്യുന്നത് യാഗമൃഗത്തെയായതിനാൽ ‘ഹോമയാഗമൃഗം’ എന്നു വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וְנִתַּח
  choice: മുറിക്കണം
  rationale: נתח യാഗത്തിനായി മൃഗത്തെ വിവിധ ഭാഗങ്ങളായി മുറിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘കഷണങ്ങളായി’ എന്ന പ്രയോഗം വിഭജനത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לִנְתָחֶיהָ
  choice: അതിന്റെ കഷണങ്ങളായി
  rationale: נתח എന്ന നാമം മുറിച്ചെടുത്ത ഭാഗത്തെയോ കഷണത്തെയോ സൂചിപ്പിക്കുന്നു. ל ഇവിടെ ഫലസൂചകമായി വന്ന് മൃഗത്തെ അതിന്റെ ഘടകഭാഗങ്ങളായി മുറിക്കണമെന്ന അർഥം നൽകുന്നു.
- source_word: וְ
  choice: പിന്നെ
  rationale: മുൻവാക്യത്തിലെ നടപടിക്കു പിന്നാലെയുള്ള ക്രമം ഈ ബന്ധകപദം സൂചിപ്പിക്കുന്നു; ‘പിന്നെ’ മലയാളത്തിൽ ആ നടപടിക്രമം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
