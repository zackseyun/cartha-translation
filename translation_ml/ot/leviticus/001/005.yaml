reference: Leviticus 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁחַ֛ט אֶת בֶּ֥ן הַ/בָּקָ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ֠/הִקְרִיבוּ בְּנֵ֨י אַהֲרֹ֤ן הַֽ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וְ/זָרְק֨וּ אֶת הַ/דָּ֤ם עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: ml
  text: അവൻ യഹ്‌വെയുടെ സന്നിധിയിൽ കാളക്കിടാവിനെ[a] അറുക്കണം. അഹരോന്റെ പുത്രന്മാരായ പുരോഹിതന്മാർ ആ രക്തം കൊണ്ടുവന്ന്, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കലുള്ള യാഗപീഠത്തിന്റെ ചുറ്റുവശങ്ങളിലാകെ രക്തം ചീറ്റണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘കന്നുകാലിക്കൂട്ടത്തിന്റെ മകൻ’; ഇവിടെ യാഗത്തിനുള്ള ഒരു ആൺകന്നുകാലിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘എറിഞ്ഞൊഴിക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം; പരമ്പരാഗതമായി ‘തളിക്കണം’ എന്നും പറയുന്നു. എബ്രായ ക്രിയ ആചാരപരമായി രക്തം എറിഞ്ഞോ വീശിയോ പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: അറുക്കണം
  rationale: യാഗക്രമത്തെക്കുറിച്ചുള്ള നിർദേശസന്ദർഭത്തിൽ ഈ ക്രിയ നിർബന്ധാത്മകമായ നടപടിയെ സൂചിപ്പിക്കുന്നു. മൃഗത്തെ യാഗത്തിനായി കൊല്ലുന്ന പ്രവൃത്തിക്ക് ‘അറുക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בֶּן הַבָּקָר
  choice: കാളക്കിടാവ്
  rationale: അക്ഷരാർഥത്തിൽ ‘കന്നുകാലിക്കൂട്ടത്തിന്റെ മകൻ’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ യാഗത്തിനുള്ള ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു. ‘കാളക്കിടാവ്’ മലയാളത്തിൽ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു; പ്രയോഗത്തിന്റെ സ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: സ്ഥലപരവും ആരാധനാപരവുമായ ‘മുഖത്തിനുമുമ്പിൽ’ എന്ന ആശയം മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהִקְרִיבוּ
  choice: കൊണ്ടുവന്ന്
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അടുത്തേക്ക് കൊണ്ടുവരുക/ഹാജരാക്കുക’ എന്നാണ്. ഇവിടെ രക്തത്തെ പുരോഹിതന്മാർ യാഗപീഠത്തിനരികിലേക്കു കൊണ്ടുവരുന്ന നടപടിയാണ്; ‘അർപ്പിക്കുക’ എന്നു പറഞ്ഞാൽ മുഴുവൻ യാഗക്രിയയുമായി തെറ്റിദ്ധരിക്കാം.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: അഹരോന്റെ പുത്രന്മാരായ പുരോഹിതന്മാർ
  rationale: കുടുംബബന്ധവും പുരോഹിതപദവിയും ഒരുമിച്ച് നിലനിർത്തുന്നു; രക്തം കൈകാര്യം ചെയ്യുന്നത് പുരോഹിതന്മാരാണെന്ന വാക്യത്തിന്റെ ഊന്നലും വ്യക്തമാണ്.
- source_word: וְזָרְקוּ
  choice: ചീറ്റണം
  rationale: זרק രക്തത്തെ എറിഞ്ഞോ വീശിയോ പ്രയോഗിക്കുന്ന ശക്തമായ ചലനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ചീറ്റുക’ ആ ഭൗതികപ്രവൃത്തി സ്വാഭാവികമായി അറിയിക്കുന്നു; പരമ്പരാഗതമായ ‘തളിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: യാഗപീഠത്തിന്മേൽ ചുറ്റുമായി
  rationale: עַל എന്നതിന്റെ ഉപരിതലബന്ധവും סָבִיב എന്നതിന്റെ ചുറ്റുമുള്ള പ്രയോഗവും നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘ചുറ്റുമായി’ എന്നത് യാഗപീഠത്തിന്റെ വിവിധ വശങ്ങളിലേക്കുള്ള രക്തപ്രയോഗം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കലുള്ള
  rationale: ബന്ധവാക്യം യാഗപീഠത്തിന്റെ സ്ഥാനം തിരിച്ചറിയിക്കുന്നു. ‘പ്രവേശനത്തിങ്കൽ’ എന്നത് פתח എന്നതിന്റെ സ്ഥലപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവവും ജനവും കൂടിച്ചേരുന്ന നിശ്ചിത കൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഉറവിടപ്രയോഗത്തോട് സുതാര്യവുമായ പദമാണ്.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: എബ്രായ വാചകം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. ഒരു പദവിയാക്കി മാറ്റാതെ നിയമബന്ധപരമായ വ്യക്തിനാമം നിലനിർത്താൻ ‘യഹ്‌വെ’ ഉപയോഗിച്ചു.
- issue: രക്തപ്രയോഗത്തെ സൂചിപ്പിക്കുന്ന זרק എന്ന ക്രിയ
  choice: ചീറ്റണം
  alternative: തളിക്കണം / എറിഞ്ഞൊഴിക്കണം
  rationale: പരമ്പരാഗത ആരാധനാഭാഷയായ ‘തളിക്കുക’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ, രക്തം ശക്തമായി എറിഞ്ഞോ വീശിയോ പ്രയോഗിക്കുന്ന മൂലക്രിയയുടെ ഭൗതികത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. നിയമഗ്രന്ഥത്തിലെ നടപടിക്രമസ്വരം ‘-ണം’ രൂപങ്ങളിലൂടെ നിലനിർത്തി. ‘യാഗപീഠം’, ‘പുരോഹിതന്മാർ’, ‘സമാഗമകൂടാരം’ എന്നീ പരിചിതമായ ആരാധനാപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും, വ്യാഖ്യാനപരമായ മതവിഭാഗീയ സാങ്കേതികഭാഷ ഒഴിവാക്കി.
