  text: וְ/הַ/קֶּ֥רֶב וְ/הַ/כְּרָעַ֖יִם יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְרִ֨יב הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അതിന്റെ ആന്തരികാവയവങ്ങളും കാലുകളും വെള്ളംകൊണ്ട് കഴുകണം. പുരോഹിതൻ അതെല്ലാം അർപ്പിച്ച് യാഗപീഠത്തിന്മേൽ പുകയായി ഉയർത്തണം. അത് ഒരു ഹോമയാഗമാണ്: യഹോവയ്ക്കു പ്രസാദകരമായ സുഗന്ധമായ അഗ്നിയർപ്പണം.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘തീയിൽ അർപ്പിക്കുന്ന യാഗം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: ആന്തരികാവയവങ്ങൾ
  rationale: യാഗമൃഗത്തിന്റെ ഉള്ളിലുള്ള അവയവങ്ങളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ പ്രയോഗമാണിത്.
- source_word: הַכְּרָעַיִם
  choice: കാലുകൾ
  rationale: യാഗമൃഗത്തിന്റെ കാലുകളെ, പ്രത്യേകിച്ച് താഴത്തെ ഭാഗങ്ങളെ, സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ പൊതുപദം തിരഞ്ഞെടുത്തു.
- source_word: יִרְחַץ בַּמָּיִם
  choice: വെള്ളത്തിൽ കഴുകണം
  rationale: רחץ എന്ന ക്രിയയുടെ കഴുകുക എന്ന അർത്ഥവും בַּמָּיִם എന്ന ഉപാധിസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְהִקְרִיב
  choice: അർപ്പിച്ച്
  rationale: ഹിഫീൽ രൂപം യാഗവസ്തു അടുത്തുകൊണ്ടുവരുകയോ സമർപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ദഹിപ്പിക്കൽക്രിയയിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്നു.
- source_word: אֶת־הַכֹּל
  choice: അതെല്ലാം
  rationale: തയ്യാറാക്കിയ യാഗമൃഗത്തിന്റെ മുഴുവൻ ഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന സമഗ്രത നിലനിർത്തുന്നു.
- source_word: וְהִקְטִיר
  choice: പുകയായി ഉയർത്തണം
  rationale: സാധാരണ കത്തിക്കൽ മാത്രമല്ല, യാഗപീഠത്തിൽ യാഗവസ്തു പുകയായി ഉയരുന്ന പ്രത്യേക യാഗക്രിയയും പ്രകടമാക്കുന്നു.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദഹിപ്പിക്കൽ നടക്കുന്ന യാഗസ്ഥലം വ്യക്തമായി നൽകുന്നു.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന ഈ പ്രത്യേക യാഗവിഭാഗത്തിന് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും കൃത്യവുമായ പദമാണ്.
- source_word: אִשֵּׁה
  choice: അഗ്നിയർപ്പണം
  rationale: അഗ്നിയുമായി ബന്ധപ്പെട്ട യാഗാർപ്പണം എന്ന അടിസ്ഥാനസൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; പദത്തിന്റെ കൃത്യമായ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധം
  rationale: യാഗം ദൈവത്തിനു സ്വീകാര്യമാകുന്നതിനെ സൂചിപ്പിക്കുന്ന ഇന്ദ്രിയരൂപകം പരിഹരിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയായി മാറ്റാതെ പേരായിത്തന്നെ സുതാര്യമായി നൽകുന്നു.
theological_decisions:
- issue: רֵיחַ נִיחֹחַ എന്ന പ്രയോഗത്തിലെ ദൈവത്തെക്കുറിച്ചുള്ള ഇന്ദ്രിയരൂപകം
  choice: യഹോവയ്ക്കു പ്രസാദകരമായ സുഗന്ധം
  alternative: ആശ്വാസകരമായ സുഗന്ധം
  rationale: യാഗത്തിന്റെ ദൈവിക സ്വീകാര്യതയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം നിലനിർത്തുന്നു; അതിനെ ദൈവത്തിന്റെ ശരീരപ്രവർത്തനത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയായി വിശദീകരിച്ചോ ലഘൂകരിച്ചോ മാറ്റുന്നില്ല.
- issue: אִשֵּׁה എന്ന യാഗസാങ്കേതികപദത്തിന്റെ അർത്ഥം
  choice: അഗ്നിയർപ്പണം
  alternative: തീയിൽ അർപ്പിക്കുന്ന യാഗം; ഭക്ഷ്യയാഗം
  rationale: പദത്തിലെ അഗ്നിസംബന്ധം നേരിട്ട് സൂക്ഷിക്കുന്നു. ‘ഭക്ഷ്യയാഗം’ എന്ന വ്യാഖ്യാനം സാധ്യമെങ്കിലും തീയെ സംബന്ധിച്ച വ്യക്തമായ പദരൂപം മറയ്ക്കുന്നതിനാൽ മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. യാഗസാങ്കേതികത വ്യക്തമാക്കാൻ ‘ഹോമയാഗം’, ‘അഗ്നിയർപ്പണം’, ‘യാഗപീഠം’ എന്നീ പരിചിതപദങ്ങൾ നിലനിർത്തി; വാക്യക്രമം ഹീബ്രുവിലെ നടപടിക്രമവും പുരോഹിതന്റെ പങ്കും വ്യക്തമായി വേർതിരിക്കുന്നു.
