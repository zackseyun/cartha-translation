id: LEV.1.1
reference: Leviticus 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ[a] മോശെയെ വിളിച്ചു; സമാഗമകൂടാരത്തിൽനിന്ന് അവനോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം יהוה ആണ്; ഇത് ‘യഹോവ’ എന്നും ലിപ്യന്തരണം ചെയ്യാറുണ്ട്.
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപവും പ്രചാരത്തിലുള്ള മറ്റൊരു ലിപ്യന്തരണവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ קרא മോശെയോടുള്ള ദൈവിക അഭിസംബോധനയെ സൂചിപ്പിക്കുന്നു. ‘വിളിച്ചു’ എന്നത് ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘വിളിച്ചുവരുത്തി’ എന്നു പറഞ്ഞാൽ മൂലപാഠത്തിലില്ലാത്ത ആജ്ഞാഭാവം കൂടുതലാകാം.
- source_word: אֶל־מֹשֶׁה
  choice: മോശെയെ
  rationale: മലയാളത്തിൽ ‘വിളിക്കുക’ എന്ന ക്രിയയോടൊപ്പം ലക്ഷ്യവ്യക്തിയെ ദ്വിതീയാവിഭക്തിയിൽ പറയുന്നത് സ്വാഭാവികമാണ്; ഇത് എബ്രായത്തിലെ ‘മോശെയോട്/മോശെയെ ലക്ഷ്യമാക്കി’ എന്ന ബന്ധം കൃത്യമായി നൽകുന്നു.
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ ഔപചാരികമായ സംസാരത്തെ മാന്യവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു. പിന്നാലെയുള്ള לֵאמֹר എന്ന വാക്യാരംഭസൂചകത്തെ ‘ഇങ്ങനെ’ എന്ന രൂപത്തിൽ വേർതിരിച്ചും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוהയെ ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֵלָיו
  choice: അവനോട്
  rationale: സർവനാമം മുമ്പ് പറഞ്ഞ മോശെയെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
- source_word: מֵאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽനിന്ന്
  rationale: אֹהֶל מוֹעֵד നിയമിതമായ കൂടിക്കാഴ്ചയുടെ വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്. ‘സമാഗമകൂടാരം’ മലയാളത്തിലെ വ്യക്തവും സ്ഥാപിതവുമായ സമാനപദമാണ്.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടരുന്ന വചനത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന എബ്രായ വാക്യസൂചകത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി മുന്നോട്ടു കൊണ്ടുപോകുന്നു; അവസാനത്തെ ദ്വിബിന്ദു അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകൾ പ്രതീക്ഷിപ്പിക്കുന്നു.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: ആരംഭത്തിലെ waw-consecutive പുറപ്പാട് പുസ്തകത്തിന്റെ അവസാനത്തിൽനിന്ന് കഥ മുന്നോട്ടു നീങ്ങുന്നതായി സൂചിപ്പിക്കുന്നു. ‘അപ്പോൾ’ ഈ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു. ‘യഹോവ’ പരമ്പരാഗതമായ മറ്റൊരു ലിപ്യന്തരണമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘അരുളിച്ചെയ്തു’ ദൈവിക പ്രസംഗത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നിലനിർത്തി.
