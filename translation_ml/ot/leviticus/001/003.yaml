  rationale: ‘ഒരു ആണിനെ’ എന്ന പ്രയോഗം ‘ഒരു ഊനമില്ലാത്ത ആൺമൃഗത്തെ’ എന്നു മാറ്റി, യാഗത്തിനുള്ള മൃഗം ആണായിരിക്കണമെന്ന മൂലപാഠത്തിലെ നിർദേശം സ്വാഭാവികവും അവ്യക്തതയില്ലാത്തതുമായ മലയാളത്തിൽ വ്യക്തമാക്കി. മറ്റെല്ലാ ഘടകങ്ങളും മൂലപാഠത്തോടും ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിൽ സൂക്ഷിച്ചിരിക്കുന്ന ലִרְצֹנוֹയുടെ വ്യാഖ്യാന-അവ്യക്തതയോടും യോജിക്കുന്നു.
