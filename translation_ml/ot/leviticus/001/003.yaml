id: LEV.1.3
reference: Leviticus 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: ml
  text: അവന്റെ വഴിപാട് കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ദഹനയാഗമാണെങ്കിൽ, ഒരു ഊനമില്ലാത്ത ആൺമൃഗത്തെ അവൻ അർപ്പിക്കണം. യഹ്‌വെയുടെ സന്നിധിയിൽ തനിക്കു സ്വീകാര്യത ലഭിക്കേണ്ടതിന്, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിൽവെച്ച് അവൻ അതിനെ അർപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയുടെ സന്നിധിയിൽ തന്റെ ഇഷ്ടപ്രകാരം അവൻ അതിനെ അർപ്പിക്കണം.” എബ്രായപ്രയോഗം അർപ്പിക്കുന്നവന്റെ സ്വീകാര്യതയെയോ അവന്റെ സന്നദ്ധതയെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלָה
  choice: ദഹനയാഗം
  rationale: യാഗവസ്തു മുഴുവനായി യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന ലേവ്യപുസ്തകത്തിലെ സാങ്കേതിക യാഗപദത്തിന് മലയാളത്തിൽ വ്യക്തവും സ്ഥാപിതവുമായ തുല്യപദം.
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: ദൈവസന്നിധിയിലേക്കു കൊണ്ടുവരുന്ന യാഗവസ്തുവിനെ സൂചിപ്പിക്കുന്ന പൊതുപദം; സന്ദർഭത്തിന് യോജിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: מִן הַבָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള
  rationale: ആട് മുതലായ ചെറുകന്നുകാലികളല്ല, ഗോവർഗത്തിലെ വളർത്തുമൃഗങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; കൂട്ടം എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: זָכָר תָּמִים
  choice: ഊനമില്ലാത്ത ഒരു ആണിനെ
  rationale: മൃഗത്തിന്റെ ലിംഗവും യാഗയോഗ്യതയ്ക്കാവശ്യമായ ദോഷരാഹിത്യവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יַקְרִיבֶנּוּ / יַקְרִיב אֹתוֹ
  choice: അവൻ അതിനെ അർപ്പിക്കണം
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് യാഗസന്ദർഭത്തിൽ 'അർപ്പിക്കുക' എന്നതാണ് സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിൽവെച്ച്
  rationale: വിശുദ്ധമന്ദിരസംബന്ധിയായ സ്ഥിരപ്രയോഗത്തെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു; സ്ഥലം സൂചിപ്പിക്കുന്ന אֶל എന്നതിന്റെ സന്ദർഭാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִרְצֹנוֹ לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ തനിക്കു സ്വീകാര്യത ലഭിക്കേണ്ടതിന്
  rationale: לִרְצֹנוֹ എന്ന ദുഷ്കരപ്രയോഗത്തിന്റെ സാധ്യതയേറിയ യാഗസംബന്ധിയായ അർഥം—അർപ്പിക്കുന്നവന് ദൈവസന്നിധിയിൽ സ്വീകാര്യത ലഭിക്കൽ—വ്യക്തമായി നൽകുന്നു; സന്നദ്ധത എന്ന പരമ്പരാഗത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ തിരുനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: לִרְצֹנוֹ എന്നതിന്റെ വ്യാഖ്യാനം
  choice: തനിക്കു സ്വീകാര്യത ലഭിക്കേണ്ടതിന്
  alternative: സ്വമേധയാ / തന്റെ ഇഷ്ടപ്രകാരം
  rationale: ലേവ്യയാഗസന്ദർഭത്തിൽ ദൈവിക അംഗീകാരം അഥവാ സ്വീകാര്യത എന്ന അർഥം ശക്തമാണ്. എങ്കിലും എബ്രായപ്രയോഗത്തിന് സന്നദ്ധതയെ സൂചിപ്പിക്കുന്ന ദീർഘകാല വിവർത്തനപാരമ്പര്യമുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; പദവിയായ 'കർത്താവ്' എന്നതുമായി കലരുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. യാഗസംബന്ധിയായ സാങ്കേതികതയ്ക്കായി ‘ദഹനയാഗം’, ‘വഴിപാട്’, ‘സമാഗമകൂടാരം’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തി.
