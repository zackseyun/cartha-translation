  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: ml
  text: പുരോഹിതൻ അതിനെ യാഗപീഠത്തിലേക്ക് കൊണ്ടുവന്ന്, അതിന്റെ തല നുള്ളിയൊടിച്ച്[a] യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം; അതിന്റെ രക്തം യാഗപീഠത്തിന്റെ വശത്ത്[b] പിഴിഞ്ഞൊഴിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തല ഞെരിച്ചൊടിച്ച്’ എന്നും പരിഭാഷപ്പെടുത്താം; പക്ഷിയാഗത്തെ പുരോഹിതൻ കൊല്ലുന്ന പ്രത്യേക പ്രവൃത്തിക്കുള്ള സാങ്കേതിക എബ്രായപദമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘യാഗപീഠത്തിന്റെ ഭിത്തിയിൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: അതിനെ ... കൊണ്ടുവന്ന്
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘അടുത്തേക്ക് കൊണ്ടുവരുക’ എന്ന ചലനം സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള אֶל הַמִּזְבֵּחַ നോടൊപ്പം ഇത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: യാഗകർമനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ כֹּהֵן എന്നതിന് സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: אֶל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനരികെ
  rationale: אֶל ലക്ഷ്യത്തിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; യാഗപീഠത്തിങ്കലേക്ക് കൊണ്ടുവരുന്ന പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וּמָלַק
  choice: നുള്ളിയൊടിച്ച്
  rationale: പക്ഷിയാഗത്തെ പുരോഹിതൻ കൊല്ലുന്ന പ്രത്യേക രീതിയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ക്രിയയാണ് מלק. ‘നുള്ളിയൊടിക്കുക’ വിരലോ നഖമോ ഉപയോഗിച്ചുള്ള പ്രവൃത്തിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; കൃത്യരീതിയിലെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶת רֹאשׁוֹ
  choice: അതിന്റെ തല
  rationale: מלק എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമം; ഇവിടെ പക്ഷിയെയാണ് ‘അത്’ സൂചിപ്പിക്കുന്നത്.
- source_word: וְהִקְטִיר
  choice: ദഹിപ്പിക്കണം
  rationale: യാഗസന്ദർഭത്തിൽ קטר യാഗപീഠത്തിൽ കത്തിച്ച് പുകയായി ഉയർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ദഹിപ്പിക്കുക’ ആചാരപരമായ ഗൗരവവും സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയും ഒരുമിച്ച് നൽകുന്നു.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: യാഗവസ്തുവിനെ യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന പ്രവൃത്തിക്ക് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: וְנִמְצָה
  choice: പിഴിഞ്ഞൊഴിക്കണം
  rationale: מצה എന്ന ക്രിയയുടെ നിഫാൽ രൂപം രക്തം ഞെക്കി പുറത്തെടുക്കുകയോ വാർന്നുപോകാൻ ഇടയാക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആ പ്രവൃത്തിയും ഫലവും സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: דָמוֹ
  choice: അതിന്റെ രക്തം
  rationale: പക്ഷിയാഗത്തിന്റെ രക്തത്തെയാണ് പ്രത്യയം സൂചിപ്പിക്കുന്നത്.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ വശത്ത്
  rationale: קִיר അക്ഷരാർഥത്തിൽ ‘ഭിത്തി’ ആണെങ്കിലും യാഗപീഠത്തെ സംബന്ധിച്ച് ‘വശം’ എന്നത് സ്വാഭാവികവും ഉദ്ദേശിച്ച സ്ഥാനത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതുമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
