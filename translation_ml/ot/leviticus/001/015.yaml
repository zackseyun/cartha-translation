translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിൽ, യാഗനിയമത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായത്തിലെ ക്രിയാക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനവ്യത്യാസം തിരുത്തി: [a] מלק എന്ന ക്രിയയ്ക്കും [b] യാഗപീഠത്തിന്റെ ‘വശം/ഭിത്തി’ എന്ന പദപ്രയോഗത്തിനും ചേർത്തു.'
