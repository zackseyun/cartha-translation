id: LEV.1.10
reference: Leviticus 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: ml
  text: അവന്റെ വഴിപാട് ആട്ടിൻകൂട്ടത്തിൽനിന്ന്—ചെമ്മരിയാടുകളിൽനിന്നോ കോലാടുകളിൽനിന്നോ—ഹോമയാഗത്തിനായുള്ളതാണെങ്കിൽ,[a] ഊനമില്ലാത്ത ഒരു ആണിനെ അവൻ അർപ്പിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഹോമയാഗമായി.”'
    reason: lexical_alternative
  - marker: b
    text: “ഊനമില്ലാത്ത” എന്നത് ഈ യാഗത്തിന് ആവശ്യമായ വിധത്തിൽ ശാരീരിക വൈകല്യമോ ദോഷമോ ഇല്ലാത്തത് എന്നാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: ആണെങ്കിൽ
  rationale: മുൻ നിർദേശത്തോടു ബന്ധപ്പെടുത്തി അടുത്ത വ്യവസ്ഥ അവതരിപ്പിക്കുന്ന ഉപാധിപ്രയോഗം; മലയാളത്തിൽ വാക്യഘടനയ്ക്കനുസരിച്ച് അവസാനം ചേർത്തു.
- source_word: מִן הַצֹּאן
  choice: ആട്ടിൻകൂട്ടത്തിൽനിന്ന്
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള രണ്ട് വിഭാഗങ്ങളും വിവർത്തനത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קָרְבָּנוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: ആരാധനയിൽ ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന അർപ്പണത്തെ സൂചിപ്പിക്കുന്ന കָרְבָּן എന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാള പദം.
- source_word: מִן הַכְּשָׂבִים
  choice: ചെമ്മരിയാടുകളിൽനിന്നോ
  rationale: ആടിന്റെ പ്രായം അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ כְּשָׂבִים എന്ന വിഭാഗനാമം നിലനിർത്തുന്നു.
- source_word: אוֹ מִן הָעִזִּים
  choice: കോലാടുകളിൽനിന്നോ
  rationale: ചെമ്മരിയാടുകളിൽനിന്ന് വേർതിരിച്ചുള്ള goat വിഭാഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായുള്ളത്
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗവിഭാഗമായ עֹלָהയ്ക്ക് മലയാള ബൈബിൾ-ആരാധനാ പ്രയോഗത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദം.
- source_word: זָכָר
  choice: ഒരു ആണിനെ
  rationale: യാഗമൃഗത്തിന്റെ ലിംഗത്തെക്കുറിച്ചുള്ള വ്യക്തമായ നിബന്ധന അതേപടി നിലനിർത്തുന്നു.
- source_word: תָּמִים
  choice: ഊനമില്ലാത്ത
  rationale: യാഗസന്ദർഭത്തിൽ ശാരീരിക വൈകല്യമോ ദോഷമോ ഇല്ലാത്ത അവസ്ഥയെ സ്വാഭാവികവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: יַקְרִיבֶנּוּ
  choice: അവൻ അർപ്പിക്കണം
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗമായി സമർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; നിർദേശത്തിന്റെ ബാധ്യത മലയാളത്തിലെ ‘വേണം’ രൂപം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: עֹלָה എന്ന യാഗപദത്തിന്റെ വിവർത്തനം
  choice: ഹോമയാഗം
  alternative: ദഹനയാഗം / ഉയരുന്ന യാഗം
  rationale: സ്ഥാപിതമായ യാഗവിഭാഗം സാധാരണ മലയാള വായനക്കാർക്ക് തിരിച്ചറിയാൻ ‘ഹോമയാഗം’ സഹായിക്കുന്നു; പദോൽപ്പത്തിയെ മാത്രം മുൻനിർത്തിയ ‘ഉയരുന്ന യാഗം’ സന്ദർഭം മങ്ങിയാക്കാം.
- issue: യാഗമൃഗത്തിന്റെ ലിംഗനിബന്ധന
  choice: ഒരു ആണിനെ
  alternative: ആൺമൃഗത്തെ
  rationale: ഹീബ്രു പാഠത്തിലെ זָכָר എന്ന വ്യക്തമായ ലിംഗനിബന്ധന ചുരുക്കമോ സാമാന്യവൽക്കരണമോ ചെയ്യാതെ നിലനിർത്തുന്നു.
- issue: יַקְרִיבֶנּוּയിലെ പ്രത്യയവും പിന്നാലെയുള്ള വിശേഷണപ്രയോഗവും
  choice: ഊനമില്ലാത്ത ഒരു ആണിനെ അവൻ അർപ്പിക്കണം
  alternative: അവൻ അതിനെ—ഊനമില്ലാത്ത ഒരു ആണിനെ—അർപ്പിക്കണം
  rationale: ഹീബ്രുവിലെ ക്രിയാപ്രത്യയം അർപ്പിക്കപ്പെടുന്ന മൃഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആവർത്തനഭാരം ഒഴിവാക്കി അതേ കർമ്മത്തെ ‘ഒരു ആണിനെ’ എന്നു നേരിട്ട് വ്യക്തമാക്കുന്നു, അർത്ഥം മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ, എന്നാൽ ലേവ്യപുസ്തകത്തിലെ യാഗനിയമങ്ങൾക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ചെമ്മരിയാട്/കോലാട്’ എന്ന വേർതിരിവ് ഉപയോഗിച്ച് ഹീബ്രു വിഭാഗങ്ങൾ വ്യക്തമാക്കി; വാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ഉപാധിഘടകം മലയാളരീതിയിൽ ക്രമപ്പെടുത്തി.
