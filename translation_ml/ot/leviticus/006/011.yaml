revisions:
- from: അഹരോന്റെ പുത്രന്മാരിൽ ഓരോ പുരുഷനും അതിൽനിന്നു ഭക്ഷിക്കാം. യഹോവയ്ക്കുള്ള ദഹനയാഗങ്ങളിൽനിന്നുള്ള ഈ ഓഹരി തലമുറതലമുറയായി നിങ്ങൾക്കുള്ള ശാശ്വതനിയമമാണ്. അവയെ തൊടുന്നതെന്തും വിശുദ്ധമായിത്തീരും.[a]
  to: അഹരോന്റെ പുത്രന്മാരിൽ പെട്ട ഓരോ പുരുഷനും അതിൽനിന്ന് ഭക്ഷിക്കാം. യഹോവയ്ക്കുള്ള അഗ്നിയാഗങ്ങളെ സംബന്ധിച്ച് തലമുറതലമുറയായി നിങ്ങൾക്കുള്ള ശാശ്വതനിയമമാണിത്. അവയെ തൊടുന്നതെന്തും വിശുദ്ധമായിത്തീരും.[a]
  rationale: The revision replaces the overly specific 'burnt offerings' terminology with the broader sacrificial term 'fire offerings' and renders the permanent-statute formula without adding a distinct 'portion' as the meaning of statute. The final clause and its footnote retain the Hebrew's debated scope without resolving it interpretively.
