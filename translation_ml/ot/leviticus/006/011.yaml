  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: ml
  text: അഹരോന്റെ പുത്രന്മാരിൽ പെട്ട ഓരോ പുരുഷനും അതിൽനിന്ന് ഭക്ഷിക്കാം. യഹോവയ്ക്കുള്ള അഗ്നിയാഗങ്ങളെ സംബന്ധിച്ച് തലമുറതലമുറയായി നിങ്ങൾക്കുള്ള ശാശ്വതനിയമമാണിത്. അവയെ തൊടുന്നതെന്തും വിശുദ്ധമായിത്തീരും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവയെ തൊടുന്നതെന്തും വിശുദ്ധീകരിക്കപ്പെടും.” എബ്രായപാഠം സമ്പർക്കത്തിലൂടെ വിശുദ്ധമായിത്തീരുന്നതിനെ സൂചിപ്പിക്കാം; എന്നാൽ വിശുദ്ധമായതു മാത്രമേ അവയെ തൊടാവൂ എന്ന് കൂടുതൽ നിയന്ത്രിതമായ അർഥത്തിൽ ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל זָכָר
  choice: ഓരോ പുരുഷനും
  rationale: പുരോഹിതസ്ഥാനത്തെ ലിംഗപരമായ യോഗ്യത വ്യക്തമാക്കുന്ന വിതരണാർഥത്തിലുള്ള പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: בִּבְנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാരിൽ
  rationale: പുരോഹിതകുടുംബത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ കുടുംബനാമം വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: יֹאכֲלֶנָּה
  choice: അതിൽനിന്നു ഭക്ഷിക്കാം
  rationale: മുൻസന്ദർഭത്തിലെ യാഗഭാഗത്തെ സൂചിപ്പിക്കുകയും പുരോഹിതർക്കുള്ള അംഗീകൃത അവകാശം നിയമഭാഷയിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: חָק עוֹלָם
  choice: ശാശ്വതനിയമം
  rationale: തുടർച്ചയായ നിയമബാധ്യതയെ ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതലമുറയായി നിങ്ങൾക്കുള്ള
  rationale: തുടർന്നുവരുന്ന തലമുറകളിലേക്കുള്ള പ്രാബല്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: യഹോവയ്ക്കുള്ള ദഹനയാഗങ്ങളിൽനിന്നുള്ള ഈ ഓഹരി
  rationale: אִשֶּׁה എന്ന യാഗസാങ്കേതികപദത്തിന്റെ അഗ്നിയിൽ അർപ്പിക്കപ്പെടുന്ന അർഥം സംരക്ഷിക്കുകയും, ഭക്ഷിക്കാവുന്ന പുരോഹിതഓഹരിയുമായുള്ള വാക്യബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ മലയാളത്തിലെ പരിചിതമായ നേരിട്ടുള്ള രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: അവയെ തൊടുന്നതെന്തും
  rationale: തൊടുന്നത് വ്യക്തിയോ വസ്തുവോ എന്ന് മൂലപാഠം നിർണയിക്കാത്തതിനാൽ അതിന്റെ വ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: יִקְדָּשׁ
  choice: വിശുദ്ധമായിത്തീരും
  rationale: സമ്പർക്കത്തിന്റെ ഫലമായി വിശുദ്ധസ്ഥിതി കൈവരിക്കുന്നു എന്ന ക്രിയയുടെ ഫലാർഥം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ വിശുദ്ധിയുടെ പകർച്ച
  choice: അവയെ തൊടുന്നതെന്തും വിശുദ്ധമായിത്തീരും
  alternative: വിശുദ്ധമായത് മാത്രമേ അവയെ തൊടാവൂ; അല്ലെങ്കിൽ തൊടുന്നത് വിശുദ്ധീകരണബാധ്യതയ്ക്കു വിധേയമാകും
  rationale: יִקְדָּשׁ എന്ന ക്രിയ ഇവിടെ ഫലമായി വിശുദ്ധമാകുന്നതാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. എന്നാൽ അതിന്റെ ആചാരപരമായ പ്രായോഗിക ഫലം മൂലപാഠം പൂർണമായി വിശദീകരിക്കാത്തതിനാൽ മറ്റ് വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാഭാഷ ഉപയോഗിച്ചു. സാങ്കേതിക യാഗപദം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകിയെങ്കിലും മൂലപാഠത്തിലെ വിശുദ്ധിസംബന്ധമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
