id: LEV.6.21
reference: Leviticus 6:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁ֥ר תְּבֻשַּׁל בּ֖/וֹ יִשָּׁבֵ֑ר וְ/אִם בִּ/כְלִ֤י נְחֹ֨שֶׁת֙ בֻּשָּׁ֔לָה וּ/מֹרַ֥ק וְ/שֻׁטַּ֖ף בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: ml
  text: മൺപാത്രത്തിലാണ് അത് പുഴുങ്ങിയതെങ്കിൽ ആ പാത്രം ഉടച്ചുകളയണം. എന്നാൽ ചെമ്പുപാത്രത്തിലാണ്[a] അത് പുഴുങ്ങിയതെങ്കിൽ ആ പാത്രം നന്നായി തേച്ച് വെള്ളത്തിൽ കഴുകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെങ്കലപാത്രത്തിൽ.” എബ്രായപദമായ נְחֹשֶׁת സന്ദർഭമനുസരിച്ച് ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: മൺപാത്രം
  rationale: കളിമണ്ണുകൊണ്ടുള്ള പാത്രത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളപ്രയോഗം; ലോഹപാത്രവുമായുള്ള വസ്തുവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: പുഴുങ്ങിയതെങ്കിൽ
  rationale: യാഗമാംസം ദ്രാവകത്തിൽ പാകംചെയ്യുന്ന ഈ സന്ദർഭത്തിൽ בשׁל എന്ന ക്രിയയുടെ തിളപ്പിച്ചു പാകംചെയ്യുക എന്ന പ്രത്യേക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בּוֹ
  choice: പാത്രത്തിലാണ്
  rationale: പാത്രത്തിനുള്ളിൽ പുഴുങ്ങിയെന്ന സ്ഥാനബന്ധം സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִשָּׁבֵר
  choice: ഉടച്ചുകളയണം
  rationale: നിയമനിർദേശത്തിലെ നിർബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; പാത്രം ഉപയോഗശൂന്യമാക്കുന്ന വിധം തകർക്കണമെന്ന ആശയവും പ്രകടമാക്കുന്നു.
- source_word: כְלִי נְחֹשֶׁת
  choice: ചെമ്പുപാത്രം
  rationale: נְחֹשֶׁת ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ പുരാതന ലോഹപാത്രത്തിന് സ്വാഭാവികമായ 'ചെമ്പുപാത്രം' മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּמֹרַק
  choice: നന്നായി തേച്ച്
  rationale: מרק സൂചിപ്പിക്കുന്ന ശക്തമായ ഉരച്ചുശുദ്ധീകരിക്കൽ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: വെള്ളത്തിൽ കഴുകണം
  rationale: שטף എന്നത് വെള്ളംകൊണ്ടുള്ള കഴുകൽ അല്ലെങ്കിൽ ഒഴുക്കിക്കഴുകൽ സൂചിപ്പിക്കുന്നു; തേച്ചശേഷമുള്ള രണ്ടാമത്തെ ശുദ്ധീകരണനടപടിയായി ഇത് വ്യക്തമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. ആവർത്തിച്ചുള്ള പാത്രസൂചനകൾ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി നിലനിർത്തി; വസ്തുസംബന്ധമായ എബ്രായ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
