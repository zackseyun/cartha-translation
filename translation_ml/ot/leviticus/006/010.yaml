id: LEV.6.10
reference: Leviticus 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: ml
  text: അത് പുളിപ്പോടെ ചുട്ടെടുക്കരുത്. അഗ്നിയിൽ അർപ്പിക്കുന്ന എന്റെ യാഗങ്ങളിൽനിന്ന്[a] അവരുടെ ഓഹരിയായി ഞാൻ അത് നൽകിയിരിക്കുന്നു. പാപയാഗവും കുറ്റയാഗവും[b]പോലെ അത് അതിവിശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ ഭോജനയാഗങ്ങളിൽനിന്ന്.”
    reason: lexical_alternative
  - marker: b
    text: “കുറ്റയാഗം” എന്നതിന് “പരിഹാരയാഗം” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵאָפֶה חָמֵץ
  choice: പുളിപ്പോടെ ചുട്ടെടുക്കരുത്
  rationale: നിഫാൽ ക്രിയയുടെ നിഷ്ക്രിയാർഥവും നിയമനിർദേശത്തിന്റെ വിലക്കുസ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘അപ്പം’ എന്നു ചേർത്ത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: חֶלְקָם
  choice: അവരുടെ ഓഹരിയായി
  rationale: പുരോഹിതന്മാർക്കു നിശ്ചയിച്ചുകൊടുത്ത പങ്ക് എന്ന അർഥം വ്യക്തമായി നൽകുകയും ബഹുവചന ഉടമസ്ഥപ്രത്യയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: נָתַתִּי אֹתָהּ
  choice: ഞാൻ അത് നൽകിയിരിക്കുന്നു
  rationale: ദൈവം മുമ്പേ സ്ഥാപിച്ച, ഇപ്പോഴും പ്രാബല്യത്തിലുള്ള ദാനം എന്ന പൂർണക്രിയയുടെ ഭാവം പ്രകടമാക്കുന്നു.
- source_word: מֵאִשָּׁי
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന എന്റെ യാഗങ്ങളിൽനിന്ന്
  rationale: אִשֶּׁה എന്ന സാങ്കേതിക യാഗപദത്തിലെ അഗ്നിയുമായി ബന്ധപ്പെട്ട അർഥം നിലനിർത്തുന്നു; ‘ദഹനയാഗം’ എന്നു പറഞ്ഞാൽ വേറൊരു യാഗവിഭാഗമായ עֹלָהയുമായി കലരാൻ ഇടയുള്ളതിനാൽ അത് ഒഴിവാക്കി.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധമാണ്
  rationale: എബ്രായത്തിലെ അതിശയോക്തിപരമായ വിശുദ്ധതാവർഗ്ഗീകരണം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כַּחַטָּאת
  choice: പാപയാഗംപോലെ
  rationale: כְּ എന്ന താരതമ്യ/വർഗ്ഗീകരണ സൂചന നിലനിർത്തി, ഈ യാഗഭാഗത്തിന് പാപയാഗത്തിനുള്ളതുപോലെ അതിവിശുദ്ധ പദവിയുണ്ടെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וְכָאָשָׁם
  choice: കുറ്റയാഗംപോലെ
  rationale: אָשָׁם എന്ന യാഗവിഭാഗത്തിന് ആധുനിക വായനക്കാർക്കു മനസ്സിലാകുന്ന സംക്ഷിപ്തമായ പദം ഉപയോഗിക്കുന്നു; പരിഹാരത്തിന്റെ വശം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: אָשָׁם എന്ന യാഗപദത്തിന്റെ വിവർത്തനം
  choice: കുറ്റയാഗം
  alternative: പരിഹാരയാഗം
  rationale: കുറ്റവുമായി ബന്ധപ്പെട്ട യാഗവിഭാഗം എന്ന അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; അതിനെക്കുറിച്ചുള്ള പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം പാഠത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല. നഷ്ടപരിഹാരത്തിന്റെ സാധ്യതയുള്ള ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: אִשֶּׁה എന്ന സാങ്കേതിക യാഗപദത്തിന്റെ വിവർത്തനം
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന എന്റെ യാഗങ്ങൾ
  alternative: എന്റെ ഭോജനയാഗങ്ങൾ
  rationale: മൂലപദത്തിന്റെ അഗ്നിബന്ധം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. ദൈവത്തിനുള്ള ‘ഭോജനം’ എന്ന യാഗപരമായ പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു; ദൈവം സാധാരണ അർഥത്തിൽ ഭക്ഷിക്കുന്നു എന്ന വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-യാഗഭാഷയാണ് ഉപയോഗിച്ചത്. ‘ദഹനയാഗം’ എന്ന പരിചിതപദം ഇവിടെ ഒഴിവാക്കി; അത് എബ്രായത്തിലെ വേറൊരു പ്രത്യേക യാഗവിഭാഗത്തെ സൂചിപ്പിക്കാറുണ്ട്. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
