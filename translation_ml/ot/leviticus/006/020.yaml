  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: ml
  text: അതിന്റെ മാംസത്തെ തൊടുന്നതെന്തും വിശുദ്ധമായിത്തീരും. അതിന്റെ രക്തത്തിൽ ചിലത് ഒരു വസ്ത്രത്തിന്മേൽ തെറിച്ചാൽ[a], രക്തം തെറിച്ച ആ വസ്ത്രം വിശുദ്ധമായ സ്ഥലത്ത് കഴുകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തെറിച്ചാൽ’ എന്നതിന് ‘തളിക്കപ്പെട്ടാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ ആചാരപരമായി തളിക്കുന്നതിനെയും സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ രക്തം വസ്ത്രത്തിന്മേൽ പതിക്കുകയും അതു കഴുകേണ്ടിവരികയും ചെയ്യുന്നതിനാൽ ‘തെറിച്ചാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: തൊടുന്നതെന്തും
  rationale: സമഗ്രവും അനിശ്ചിതവുമായ പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ വസ്തുക്കളെയോ വ്യക്തികളെയോ ഉൾക്കൊള്ളാവുന്നവിധം അവതരിപ്പിക്കുന്നു.
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: അതിന്റെ മാംസത്തെ തൊടുന്ന
  rationale: യാഗസന്ദർഭത്തിൽ בָּשָׂר യാഗമൃഗത്തിന്റെ മാംസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സ്ത്രീലിംഗ പ്രത്യയം പാപയാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിന്റെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: יִקְדָּשׁ
  choice: വിശുദ്ധമായിത്തീരും
  rationale: സമ്പർക്കത്തിലൂടെ വിശുദ്ധപദവിയിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുന്ന ഫലാവസ്ഥ നിലനിർത്തുന്നു; ഔപചാരികമായ മറ്റൊരു പ്രതിഷ്ഠാക്രിയ നടന്നുവെന്ന് സൂചിപ്പിക്കുന്നില്ല.
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: അതിന്റെ രക്തത്തിൽ കുറെ ... തെറിച്ചാൽ
  rationale: נזה രക്തം പ്രക്ഷേപിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. വസ്ത്രം കഴുകേണ്ടിവരുന്ന ഈ സന്ദർഭത്തിൽ ‘തെറിക്കുക’ സ്വാഭാവികമാണ്; എന്നാൽ ക്രിയയ്ക്ക് ആചാരപരമായ തളിക്കൽ എന്ന അർഥവും ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: עַל הַבֶּגֶד
  choice: ഒരു വസ്ത്രത്തിന്മേൽ
  rationale: നിയമവാക്യത്തിലെ പൊതുവായ സന്ദർഭം വ്യക്തമാക്കാൻ മലയാളത്തിൽ അനിശ്ചിതരൂപം സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ
  choice: രക്തം തെറിച്ച ആ വസ്ത്രം
  rationale: സ്ത്രീലിംഗ ഏകവചനപ്രത്യയം വസ്ത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആവർത്തനമുണ്ടെങ്കിലും മലയാളത്തിൽ കഴുകേണ്ടത് എന്താണെന്ന് വ്യക്തമായി പറയുന്നു.
- source_word: תְּכַבֵּס
  choice: കഴുകണം
  rationale: വസ്ത്രം കഴുകുക എന്ന പീയേൽ ക്രിയയുടെ നിയമപരമായ നിർദേശം ആധുനിക മലയാളത്തിലെ ബാധ്യതാസൂചക രൂപത്തിൽ നൽകുന്നു.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: വിശുദ്ധമായ ഒരു സ്ഥലത്തുവെച്ച്
  rationale: എബ്രായത്തിൽ നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ അകത്തെ വിശുദ്ധമന്ദിരം എന്ന് അതിവ്യക്തമാക്കാതെ വിശുദ്ധമായി വേർതിരിച്ച ഒരു സ്ഥലം എന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പാപയാഗത്തിന്റെ മാംസവുമായി സമ്പർക്കം മൂലം ലഭിക്കുന്ന വിശുദ്ധതയുടെ സ്വഭാവം
  choice: സമ്പർക്കത്തിലാകുന്നത് വിശുദ്ധപദവിയിലേക്കു വരുന്നു എന്ന വാചകാർത്ഥം നിലനിർത്തി ‘വിശുദ്ധമായിത്തീരും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ധാർമിക വിശുദ്ധതയല്ല, വിശുദ്ധോപയോഗത്തിനായി നിയന്ത്രിക്കപ്പെടുന്നു എന്ന് വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം ആചാരപരമായ വിശുദ്ധിയെക്കുറിച്ചാണെങ്കിലും മൂലപാഠം വ്യാഖ്യാനപരമായി ചുരുക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വിശാലതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘വിശുദ്ധമായിത്തീരും’ എന്ന രൂപം ആചാരപരമായ പദവിമാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
