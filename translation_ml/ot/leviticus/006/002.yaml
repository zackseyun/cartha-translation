  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: ml
  text: 'അഹരോനോടും അവന്റെ പുത്രന്മാരോടും കൽപ്പിക്കുക: “ഹോമയാഗത്തെക്കുറിച്ചുള്ള നിയമം[a] ഇതാണ്: ഹോമയാഗം തന്നേ രാത്രി മുഴുവൻ പ്രഭാതം വരെ യാഗപീഠത്തിലെ കത്തുന്ന സ്ഥലത്ത്[b] ഇരിക്കണം; യാഗപീഠത്തിലെ തീ അതിൽ കത്തിക്കൊണ്ടിരിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹോമയാഗത്തിനുള്ള നിർദേശം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യാഗപീഠത്തിലെ ദഹനസ്ഥാനത്ത്.” ഈ ഹീബ്രു പദം യാഗപീഠത്തിലെ ദഹനസ്ഥലത്തെയോ അഗ്നിത്തട്ടിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: കല്പിക്കുക
  rationale: നേരിട്ടുള്ള ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാള പ്രയോഗം.
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: അഹരോനോടും അവന്റെ പുത്രന്മാരോടും
  rationale: പുരോഹിതസന്ദർഭത്തിലെ പുരുഷസന്തതിയെ കൃത്യമായി സൂചിപ്പിക്കുകയും മലയാളത്തിലെ പരോക്ഷകർമഘടന സ്വാഭാവികമായി പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: זֹאת תּוֹרַת
  choice: നിയമം ഇതാണ്
  rationale: യാഗക്രമത്തെ നിയന്ത്രിക്കുന്ന ഔപചാരിക വ്യവസ്ഥ എന്ന അർഥം നൽകുന്നു; ‘നിർദേശം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ മലയാള പദം.
- source_word: הִוא הָעֹלָה
  choice: ഹോമയാഗം തന്നേ
  rationale: സർവനാമത്തോടുകൂടിയ ആവർത്തനത്തിലെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: עַל מוֹקְדָה
  choice: ദഹനസ്ഥാനത്ത്
  rationale: מוֹקְדָה സൂചിപ്പിക്കുന്ന യാഗപീഠത്തിലെ കത്തുന്ന സ്ഥലം അഥവാ അഗ്നിത്തട്ട് എന്ന മൂർത്തമായ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: രാത്രി മുഴുവൻ പ്രഭാതംവരെ
  rationale: ഹീബ്രു പാഠത്തിലെ സമയപരിധിയും ക്രമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: യാഗപീഠത്തിലെ തീ അതിൽ കത്തിച്ചുകൊണ്ടിരിക്കണം
  rationale: തീ തുടർച്ചയായി നിലനിർത്തണമെന്ന ഹോഫാൽ ക്രിയാരൂപത്തിന്റെ നിർദേശാത്മക ഭാവം നൽകുന്നു; בּוֹ എന്ന സർവനാമത്തിന്റെ സംക്ഷിപ്തതയും സാധ്യതയുള്ള അവ്യക്തതയും ‘അതിൽ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാഗനിയമത്തിലെ תּוֹרָה എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നിയമം
  alternative: നിർദേശം; ചട്ടം
  rationale: ഇവിടെ പദം മുഴുവൻ മോശൈക തോറായുടെ ശീർഷകമെന്നതിലുപരി ഒരു പ്രത്യേക യാഗക്രമത്തെ നിയന്ത്രിക്കുന്ന വ്യവസ്ഥയാണ്. ‘നിയമം’ ഔപചാരിക ഭാവം സംരക്ഷിക്കുന്നു; മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: യാഗപീഠത്തിലെ തീയെക്കുറിച്ചുള്ള ക്രിയയുടെ സ്വഭാവം
  choice: കത്തിച്ചുകൊണ്ടിരിക്കണം
  alternative: കത്തിക്കൊണ്ടിരിക്കണം
  rationale: ഹീബ്രു ക്രിയാരൂപം തീ വെറുതെ കത്തുന്നുവെന്ന വിവരണത്തേക്കാൾ, അതിനെ തുടർച്ചയായി കത്തിച്ചുനിർത്തണമെന്ന നിർദേശം സൂചിപ്പിക്കുന്നു.
- issue: בּוֹ എന്ന സർവനാമത്തിന്റെ സൂചന
  choice: അതിൽ
  alternative: യാഗപീഠത്തിന്മേൽ; ദഹനസ്ഥാനത്ത്
  rationale: സർവനാമം യാഗപീഠത്തെയോ അടുത്തുള്ള ദഹനസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാം. മലയാളത്തിൽ നിർബന്ധിതമായി ഒരു സൂചന തിരഞ്ഞെടുക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും ചെറിയ അവ്യക്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. പരിചിതമായ ‘ഹോമയാഗം’, ‘യാഗപീഠം’ എന്നീ പദങ്ങൾ നിലനിർത്തി; അപൂർവമായ സാങ്കേതിക പദത്തിന് ലളിതമായ അടിക്കുറിപ്പ് ചേർത്തു.
