revisions:
- from: അവന്റെ പുത്രന്മാരിൽ അവന്റെ സ്ഥാനത്ത് വരുന്ന അഭിഷിക്തനായ പുരോഹിതൻ അതു തയ്യാറാക്കണം. ഇത് യഹോവയ്ക്കുള്ള ശാശ്വതമായ ചട്ടമാണ്; അതു മുഴുവനായും പുകയായി ഉയർത്തണം.[a]
  to: അവന്റെ സ്ഥാനത്ത്, അവന്റെ പുത്രന്മാരിൽനിന്ന് വരുന്ന അഭിഷിക്തനായ പുരോഹിതൻ അതു തയ്യാറാക്കണം. ഇത് യഹോവയ്ക്കുള്ള എന്നേക്കുമുള്ള ചട്ടമാണ്; അതു മുഴുവനായും പുകയായി ഉയർത്തപ്പെടണം.[a]
  rationale: 'The revision clarifies the Hebrew priestly succession construction and retains the passive force of תָּקְטָר. It preserves the source’s restrained wording: the main text does not add ‘high priest,’ while the footnote gives only the necessary ritual explanation.'
