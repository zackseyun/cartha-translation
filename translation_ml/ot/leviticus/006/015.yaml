id: LEV.6.15
reference: Leviticus 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/כֹּהֵ֨ן הַ/מָּשִׁ֧יחַ תַּחְתָּ֛י/ו מִ/בָּנָ֖י/ו יַעֲשֶׂ֣ה אֹתָ֑/הּ חָק עוֹלָ֕ם לַ/יהוָ֖ה כָּלִ֥יל תָּקְטָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: ml
  text: അവന്റെ സ്ഥാനത്ത്, അവന്റെ പുത്രന്മാരിൽനിന്ന് വരുന്ന അഭിഷിക്തനായ പുരോഹിതൻ അതു തയ്യാറാക്കണം. ഇത് യഹോവയ്ക്കുള്ള എന്നേക്കുമുള്ള ചട്ടമാണ്; അതു മുഴുവനായും പുകയായി ഉയർത്തപ്പെടണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുകയായി ഉയർത്തപ്പെടണം’ എന്നത് യാഗാർപ്പണം മുഴുവനും യാഗപീഠത്തിൽ ദഹിപ്പിച്ച് അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: അഭിഷിക്തനായ പുരോഹിതൻ
  rationale: ആരാധനാക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ ഔദ്യോഗികമായി അഭിഷേകം ചെയ്യപ്പെട്ട പുരോഹിതനെയാണ് സൂചിപ്പിക്കുന്നത്; മശീഹാ എന്ന പദവിയായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: അവന്റെ പുത്രന്മാരിൽ അവന്റെ സ്ഥാനത്ത് വരുന്ന
  rationale: מִבָּנָיו എന്നതിലെ പുരുഷസന്തതി എന്ന അർത്ഥവും תַּחְתָּיו എന്നതിലെ സ്ഥാനമേറ്റെടുക്കൽ എന്ന സന്ദർഭാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: അതു തയ്യാറാക്കണം
  rationale: עָשָׂה എന്ന വിശാലമായ ക്രിയയെ യാഗക്രമത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘അർപ്പിക്കണം’ എന്നു മൂലപാഠത്തേക്കാൾ അധികം നിർവചിക്കുന്നില്ല.
- source_word: חָק עוֹלָם
  choice: ശാശ്വതമായ ചട്ടം
  rationale: തുടർച്ചയായ നിയമബാധ്യത വ്യക്തമാക്കുന്ന, ആധുനികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: ദൈവനാമമായ יהוהയെ മലയാളത്തിലെ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു; לְ എന്നതിന്റെ സമർപ്പണബന്ധം ‘യ്ക്കുള്ള’ കൊണ്ട് നൽകുന്നു.
- source_word: כָּלִיל תָּקְטָר
  choice: മുഴുവനായും പുകയായി ഉയർത്തണം
  rationale: യാഗവസ്തു ഒട്ടാകെ യാഗപീഠത്തിൽ പുകയായി ഉയർത്തപ്പെടുന്നു എന്ന ഹിഫീൽ ക്രിയയുടെ പ്രത്യേക യാഗാർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘അഭിഷിക്തനായ പുരോഹിതൻ’ ആരാണ്
  choice: മുൻപുരോഹിതന്റെ പുത്രന്മാരിൽ അവന്റെ സ്ഥാനം ഏറ്റെടുക്കുന്ന ഔദ്യോഗികമായി അഭിഷിക്തനായ പുരോഹിതൻ
  alternative: അഭിഷിക്തരായ പുരോഹിതന്മാരിൽ ആരെങ്കിലും; അല്ലെങ്കിൽ മശീഹാസംബന്ധിയായ പദവി
  rationale: ‘അവന്റെ പുത്രന്മാരിൽ’ എന്നും ‘അവന്റെ സ്ഥാനത്ത്’ എന്നും പറയുന്ന അനന്തരാവകാശഭാഷ ഒരു പാരമ്പര്യ പുരോഹിതപദവിയെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘മഹാപുരോഹിതൻ’ എന്ന പദം പ്രധാനവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം സുതാര്യമായി നിലനിർത്തുകയും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ആരാധനാക്രമ-നിയമ ശൈലി സ്വീകരിച്ചു. ‘പുത്രന്മാർ’, ‘അഭിഷിക്തനായ പുരോഹിതൻ’, ‘ചട്ടം’ എന്നീ പദങ്ങൾ മൂലത്തിലെ കുടുംബ, ഔദ്യോഗിക, നിയമപരമായ ഘടകങ്ങൾ നിലനിർത്തുന്നു. പ്രധാനവാക്യത്തിലെ ഏക അടിക്കുറിപ്പ് ചിഹ്നം [a] അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
