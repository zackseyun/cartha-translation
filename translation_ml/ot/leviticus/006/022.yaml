  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമപരമായ ശൈലി. അനുമതിയുടെ ഭാവം ‘ഭക്ഷിക്കാം’ എന്നതിലൂടെ നിലനിർത്തി; ആരാധനാക്രമപരമായ സാങ്കേതികത അനാവശ്യമായി വികസിപ്പിച്ചിട്ടില്ല.
