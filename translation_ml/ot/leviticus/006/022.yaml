source:
  edition: WLC
  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכַ֣ל אֹתָ֑/הּ קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/022.yaml
  text: Every male among the priests may eat it[a]; it is most holy.
translation:
  language: ml
  text: പുരോഹിതന്മാരിൽ ഓരോ പുരുഷനും അത് ഭക്ഷിക്കാം; അത് അതിവിശുദ്ധമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘വിശുദ്ധതകളുടെ വിശുദ്ധത’; ‘അതിവിശുദ്ധം’ എന്നർഥമുള്ള ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר
  choice: ഓരോ പുരുഷനും
  rationale: ഏകവചനമായ זָכָר-നോടുകൂടിയ כָּל വിതരണാർഥം നൽകുന്നതിനാൽ, പുരോഹിതഗണത്തിലെ ഓരോ പുരുഷനെയും സൂചിപ്പിക്കുന്നു.
- source_word: בַּכֹּהֲנִים
  choice: പുരോഹിതന്മാരിൽ
  rationale: ב എന്ന ഉപസർഗം ഇവിടെ പുരോഹിതഗണത്തിനുള്ളിലെ അംഗത്വം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יֹאכַל
  choice: ഭക്ഷിക്കാം
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ അപൂർണക്രിയ അനുവദിക്കപ്പെട്ട പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഓരോരുത്തനും നിർബന്ധമായി ഭക്ഷിക്കണമെന്ന കല്പനയായി വായിക്കാതിരിക്കാൻ ‘ഭക്ഷിക്കാം’ എന്നു നൽകി.
- source_word: אֹתָהּ
  choice: അത്
  rationale: സ്ത്രീലിംഗ സർവനാമം മുൻസന്ദർഭത്തിലെ വഴിപാടിനെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കാതെ സർവനാമമായി നിലനിർത്തി.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധം
  rationale: അക്ഷരാർഥത്തിൽ ‘വിശുദ്ധതകളുടെ വിശുദ്ധത’ എന്ന എബ്രായ അതിശയോക്തിപ്രയോഗം പരമോന്നത വിശുദ്ധിയെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: הִוא
  choice: അത് ... ആണ്
  rationale: എബ്രായത്തിലെ സ്ത്രീലിംഗ സർവനാമം അതിന്റെ വ്യാകരണപരമായ പൂർവ്വപദത്തോട് യോജിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അത്’ എന്നു നൽകി.
