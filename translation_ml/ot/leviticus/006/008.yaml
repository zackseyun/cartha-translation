reference: Leviticus 6:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: ml
  text: അവൻ ധാന്യയാഗത്തിലെ നന്നായി അരിച്ച മാവിൽനിന്ന് തന്റെ കൈപ്പിടിയളവും അതിന്റെ എണ്ണയിൽനിന്ന് ഒരു ഭാഗവും, ധാന്യയാഗത്തിന്മേലുള്ള കുന്തിരിക്കം മുഴുവനും എടുക്കണം[a]. അതിന്റെ സ്മാരകഭാഗമായി[b] അവൻ അത് യാഗപീഠത്തിന്മേൽ യഹോവേക്കു പ്രസാദകരമായ സൗരഭ്യമായി ദഹിപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “അവൻ അതിൽനിന്ന് തന്റെ കൈപ്പിടികൊണ്ട് എടുത്തുയർത്തണം.” ഹീബ്രുവിലെ ക്രിയയും നാമവും യാഗത്തിൽനിന്ന് നിശ്ചിത കൈപ്പിടിയളവ് എടുക്കുന്നതിന് ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “സ്മാരകഭാഗം” എന്നത് ധാന്യയാഗത്തെ പ്രതിനിധീകരിച്ച് യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന ഭാഗത്തിനുള്ള സാങ്കേതിക യാഗപദമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים ... בְּקֻמְצוֹ
  choice: അവൻ തന്റെ കൈപ്പിടിയളവ് എടുത്തുയർത്തണം
  rationale: רום എന്ന ക്രിയയുടെ എടുത്തുമാറ്റുകയും ഉയർത്തുകയും ചെയ്യുന്ന ഭാവവും קֹמֶץ സൂചിപ്പിക്കുന്ന കൈയിൽ ഒതുങ്ങുന്ന അളവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: מִסֹּלֶת הַמִּנְחָה
  choice: ധാന്യയാഗത്തിലെ നേരിയ മാവ്
  rationale: סֹלֶת യാഗത്തിൽ ഉപയോഗിക്കുന്ന പ്രത്യേകം അരിച്ച നേരിയ മാവിനെയും מִנְחָה ഈ സന്ദർഭത്തിൽ ധാന്യയാഗത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: וּמִשַּׁמְנָהּ
  choice: അതിന്റെ എണ്ണയിൽനിന്നും
  rationale: ആവർത്തിക്കുന്ന מִן ഭാഗികമായി എടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; എണ്ണ മുഴുവനുമല്ല, അതിൽനിന്നുള്ള ഒരു ഭാഗമാണ് ഉദ്ദേശ്യം.
- source_word: כָּל הַלְּבֹנָה
  choice: കുന്തിരിക്കം മുഴുവനും
  rationale: לְבֹנָה പൊതുവായ ധൂപവർഗമല്ല, പ്രത്യേകിച്ച് frankincense ആണ്; മലയാളത്തിലെ പതിവും വ്യക്തവുമായ പദം 'കുന്തിരിക്കം' ആണ്.
- source_word: וְהִקְטִיר הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം
  rationale: קטר എന്ന യാഗസാങ്കേതിക ക്രിയയുടെ പുകയാക്കി അർപ്പിക്കുന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായ യാഗഭാഷയിൽ നൽകുന്നു.
- source_word: אַזְכָּרָתָהּ
  choice: അതിന്റെ സ്മാരകാംശമായി
  rationale: ധാന്യയാഗത്തിന്റെ പ്രതിനിധിഭാഗം യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്നതിനുള്ള സാങ്കേതിക പദഭാവം 'സ്മാരകാംശം' സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യം
  rationale: ദൈവിക അംഗീകാരത്തിന്റെ യാഗപരമായ സ്ഥിരപ്രയോഗം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: רֵיחַ נִיחֹחַ എന്ന യാഗപ്രയോഗം
  choice: പ്രസാദകരമായ സൗരഭ്യം
  alternative: ശാന്തിദായകമായ സുഗന്ധം
  rationale: ദൈവം അർപ്പണം അംഗീകരിക്കുന്നു എന്ന ആശയം നിലനിർത്തുന്നു; ദൈവിക ഗന്ധാസ്വാദനത്തെ യാന്ത്രികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- issue: אַזְכָּרָה എന്ന സാങ്കേതിക യാഗപദം
  choice: സ്മാരകാംശം
  alternative: ഓർമപ്പെടുത്തുന്ന അംശം
  rationale: ആരാണ് ആരെ ഓർമിപ്പിക്കുന്നത് എന്നത് മൂലപദം ഇവിടെ വിശദീകരിക്കാത്തതിനാൽ ആ ദൈവശാസ്ത്രപരമായ അവ്യക്തത പരിഹരിക്കാതെ സാങ്കേതിക അർത്ഥം സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. യാഗസാങ്കേതിക കൃത്യതയ്ക്കായി 'ധാന്യയാഗം', 'യാഗപീഠം', 'സ്മാരകാംശം' എന്നിവ ഉപയോഗിച്ചു; വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി.
