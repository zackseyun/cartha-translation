revisions:
- from: ധാന്യയാഗത്തിലെ നേരിയ മാവിൽനിന്നും അതിന്റെ എണ്ണയിൽനിന്നും അവൻ തന്റെ കൈപ്പിടിയളവ് എടുത്തുയർത്തണം[a]. ധാന്യയാഗത്തിന്മേലുള്ള കുന്തിരിക്കം മുഴുവനും അതോടൊപ്പം എടുത്ത്, അതിന്റെ സ്മാരകാംശമായി[b] യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം; അത് യഹോവയ്ക്കു പ്രസാദകരമായ സൗരഭ്യമാണ്.
  to: അവൻ ധാന്യയാഗത്തിലെ നന്നായി അരിച്ച മാവിൽനിന്ന് തന്റെ കൈപ്പിടിയളവും അതിന്റെ എണ്ണയിൽനിന്ന് ഒരു ഭാഗവും, ധാന്യയാഗത്തിന്മേലുള്ള കുന്തിരിക്കം മുഴുവനും എടുക്കണം[a]. അതിന്റെ സ്മാരകഭാഗമായി[b] അവൻ അത് യാഗപീഠത്തിന്മേൽ യഹോവേക്കു പ്രസാദകരമായ സൗരഭ്യമായി ദഹിപ്പിക്കണം.
