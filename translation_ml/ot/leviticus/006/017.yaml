  terminology: The divine name should consistently be rendered “യാഹ്‌വെ,” corresponding to the English POB’s “Yahweh,” rather than “യഹോവ” (“Jehovah”). The footnote should support that chosen form without introducing a conflicting alternative as though it were the preferred reading.
