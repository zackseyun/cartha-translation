id: LEV.6.17
reference: Leviticus 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ മോശെയോടു സംസാരിച്ചു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’ (יהוה); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ דבר ഒരു പുതിയ ദൈവവചനഘടകം ആരംഭിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ വാക്യബന്ധത്തിൽ പ്രത്യേകമായി ‘പിന്നെ’ ചേർത്ത് കാലക്രമം അതിവ്യാഖ്യാനിക്കാതെ ‘സംസാരിച്ചു’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה-യെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ നാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: אֶל ഇവിടെ സംസാരത്തിന്റെ അഭിമുഖവ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘മോശയോടു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לֵאמֹר
  choice: സംസാരിച്ചു എന്ന ക്രിയയ്ക്കുശേഷമുള്ള ദ്വിബിന്ദുവിലൂടെ പ്രതിനിധീകരിച്ചു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ഹീബ്രു സൂത്രവാക്യമാണിത്. ‘ഇപ്രകാരം പറഞ്ഞുകൊണ്ട്’ എന്ന ആവർത്തനഭാരം ഒഴിവാക്കി, തുടർന്നുവരുന്ന വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു മലയാളത്തിൽ അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി വഹിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാൽ പകരംവച്ചില്ല. മലയാള വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം തിരഞ്ഞെടുത്തു; ഉച്ചാരണത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: לֵאמֹר എന്ന ഉദ്ധരണി-സൂത്രത്തിന്റെ രൂപം
  choice: ദ്വിബിന്ദു
  alternative: ഇങ്ങനെ പറഞ്ഞു; അരുളിച്ചെയ്തത്
  rationale: ഇത് തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്നു. ദ്വിബിന്ദു ആ പ്രവർത്തനം ലളിതമായി നിലനിർത്തുന്നു; ‘അരുളിച്ചെയ്തു’ എന്നത് മൂലത്തിലെ സാധാരണ דבר-നെ അനാവശ്യമായി ഉയർന്ന മതഭാഷയാക്കും.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു വാക്യത്തിന്റെ സൂത്രസ്വഭാവം നിലനിർത്തിയെങ്കിലും, മലയാളത്തിൽ അസ്വാഭാവികമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ആവർത്തനം ഒഴിവാക്കി.
