id: LEV.6.7
reference: Leviticus 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: ml
  text: 'ധാന്യയാഗത്തിന്റെ നിയമം[a] ഇതാണ്: അഹരോന്റെ പുത്രന്മാർ അത് യഹ്‌വെയുടെ സന്നിധിയിൽ, യാഗപീഠത്തിന്റെ മുൻവശത്ത് സമർപ്പിക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ധാന്യയാഗത്തിനുള്ള നിർദേശം” എന്നും “ധാന്യയാഗത്തിന്റെ ചട്ടം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: ഇതാണ്
  rationale: പുതിയ നിർദേശവിഭാഗം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തോടുള്ള ബന്ധം വാക്യക്രമത്തിൽ നിലനിൽക്കുന്നു.
- source_word: תּוֹרַת
  choice: നിയമം
  rationale: യാഗം സംബന്ധിച്ച നിർദിഷ്ട നടപടിക്രമത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ഔപചാരിക സ്വഭാവം നിലനിർത്തുന്ന പരിചിതമായ മലയാളപദമാണിത്; ‘നിർദേശം’, ‘ചട്ടം’ എന്നീ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הַמִּנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസന്ദർഭത്തിൽ מִנְחָה പൊതുവായ സമ്മാനമല്ല, ധാന്യത്തിൽനിന്നുള്ള യാഗമാണ്.
- source_word: הַקְרֵב אֹתָהּ
  choice: അത് ... സമർപ്പിക്കണം
  rationale: യാഗവസ്തു അടുത്തുകൊണ്ടുവന്ന് ആചാരപരമായി സമർപ്പിക്കാനുള്ള നിർദേശം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർ
  rationale: പുരോഹിതകുടുംബത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ബന്ധപദപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ദൈവസാന്നിധ്യത്തിൽ നടക്കുന്ന സമർപ്പണം എന്ന ആശയം വ്യക്തമാക്കുകയും ദിവ്യനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: אֶל פְּנֵי הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ മുൻവശത്ത്
  rationale: യാഗപീഠത്തോടുള്ള കൃത്യമായ സ്ഥലബന്ധം സൂചിപ്പിക്കുകയും മുൻപുള്ള ‘സന്നിധിയിൽ’ എന്ന പ്രയോഗത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പദവിയാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന പദ്ധതിയുടെ രീതിക്കനുസരിച്ച് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: യാഗനിയമത്തിലെ תּוֹרָה എന്ന പദം
  choice: നിയമം
  alternative: നിർദേശം; ചട്ടം
  rationale: നിയമപരവും ആരാധനാക്രമപരവുമായ ഭാവം നിലനിർത്തുന്നു; പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ യാഗനിയമത്തിന്റെ ഔപചാരിക ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ദൈവസാന്നിധ്യവും യാഗപീഠത്തിന്റെ മുൻവശവും എന്ന രണ്ടു ബന്ധപ്രയോഗങ്ങളും വേർതിരിച്ചു സൂക്ഷിച്ചിട്ടുണ്ട്.
