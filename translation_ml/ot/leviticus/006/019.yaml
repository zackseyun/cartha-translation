  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: ml
  text: അതിന്റെ പാപയാഗകർമം നിർവഹിക്കുന്ന[a] പുരോഹിതൻ അതു ഭക്ഷിക്കണം. അതു വിശുദ്ധമായ ഒരു സ്ഥലത്ത്, സമാഗമകൂടാരത്തിന്റെ പ്രാകാരത്തിൽ, ഭക്ഷിക്കേണ്ടതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അതിലൂടെ പ്രായശ്ചിത്തം ചെയ്യുന്ന.” എബ്രായ കൃദന്തത്തിന് പാപയാഗത്തിന്റെ അനുഷ്ഠാനം നിർവഹിക്കുന്നതിനെ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാനും കഴിയും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: כֹּהֵן എന്ന പദത്തിന്റെ സ്വാഭാവികവും സ്ഥിരവുമായ മലയാള പരിഭാഷ; നിർദിഷ്ട പുരോഹിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ നിർദിഷ്ടപ്രത്യയത്തിന്റെ ഭാവം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: പാപയാഗകർമം നിർവഹിക്കുന്ന
  rationale: പീയേൽ രൂപത്തിലുള്ള חטא ഇവിടെ പാപയാഗവുമായി ബന്ധപ്പെട്ട പ്രത്യേക അനുഷ്ഠാനകർമം നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രായശ്ചിത്തം ചെയ്യുന്ന’ എന്നതിനെക്കാൾ മൂലത്തിലെ ആചാരപരമായ അർഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുകയും മലയാളത്തിൽ വ്യക്തത നൽകുകയും ചെയ്യുന്നു.
- source_word: יֹאכֲלֶנָּה
  choice: അതു ഭക്ഷിക്കണം
  rationale: നിയമനിർദേശത്തിലെ അപൂർണക്രിയയുടെ ബാധ്യതാഭാവം ‘ഭക്ഷിക്കണം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: വിശുദ്ധമായ ഒരു സ്ഥലത്ത്
  rationale: מָקוֹם എന്ന നാമത്തിന് നിർദിഷ്ടപ്രത്യയം ഇല്ലാത്തതിനാൽ ‘ഒരു സ്ഥലം’ എന്നു പരിഭാഷപ്പെടുത്തി; cultic terminology-യിൽ קָדֹשׁ എന്നതിന് ‘വിശുദ്ധമായ’ നിലനിർത്തി.
- source_word: תֵּאָכֵל
  choice: അതു ഭക്ഷിക്കണം
  rationale: നിഫാൽ അപൂർണക്രിയയിലെ നിർദേശാത്മക നിഷ്ക്രിയഭാവം മലയാളത്തിൽ സ്വാഭാവികമായ പൊതുനിർദേശമായി അവതരിപ്പിക്കുന്നു; യാഗവസ്തുവിന്മേലുള്ള ഊന്നൽ ‘അതു’ എന്ന കർത്താവിലൂടെ നിലനിർത്തുന്നു.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രാകാരത്തിൽവെച്ച്
  rationale: אֹהֶל מוֹעֵד എന്നതിന് പ്രചാരത്തിലുള്ള ‘സമാഗമകൂടാരം’ എന്നും חָצֵר എന്നതിന് വ്യക്തമായ ‘പ്രാകാരം’ എന്നും നൽകി.
theological_decisions:
- issue: പുരോഹിതനിയമങ്ങളിലെ חטא എന്ന ക്രിയയുടെ യാഗാനുഷ്ഠാനപരമായ അർഥം
  choice: പാപയാഗകർമം നിർവഹിക്കുന്ന പുരോഹിതൻ
  alternative: അതുകൊണ്ട് പ്രായശ്ചിത്തം ചെയ്യുന്ന പുരോഹിതൻ; അതിനെ പാപയാഗമായി അർപ്പിക്കുന്ന പുരോഹിതൻ; അതിലൂടെ ശുദ്ധീകരിക്കുന്ന പുരോഹിതൻ
  rationale: മൂലക്രിയയ്ക്ക് ശുദ്ധീകരിക്കൽ, പാപയാഗകർമം നിർവഹിക്കൽ എന്നീ ബന്ധമുള്ള അർഥങ്ങൾ ഉണ്ടാകാം. പ്രധാന പാഠം പാപയാഗസന്ദർഭം വ്യക്തമാക്കുന്നു; എന്നാൽ ‘പ്രായശ്ചിത്തം’ മാത്രം ചേർത്ത് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല. യഥാർഥമായ വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: സ്ത്രീലിംഗ സർവനാമങ്ങളുടെ സൂചന
  choice: യാഗവസ്തുവിനെ സൂചിപ്പിക്കുന്ന ‘അതു’
  alternative: സ്ത്രീലിംഗസൂചന പദശഃ പ്രകടിപ്പിക്കൽ
  rationale: എബ്രായത്തിലെ വ്യാകരണലിംഗം മലയാളത്തിൽ ആവർത്തിക്കേണ്ടതില്ല; നിയമ-യാഗസന്ദർഭത്തിൽ യാഗവസ്തുവിനെ സൂചിപ്പിക്കാൻ ‘അതു’ സ്വാഭാവികമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശശൈലി. ‘പാപയാഗകർമം’, ‘പുരോഹിതൻ’, ‘വിശുദ്ധമായ’, ‘സമാഗമകൂടാരം’, ‘പ്രാകാരം’ എന്നീ പദങ്ങൾ യാഗാരാധനാസന്ദർഭത്തിന്റെ സാങ്കേതിക കൃത്യതയും സാധാരണ വായനക്കാരന് ഗ്രഹിക്കാവുന്ന സ്വാഭാവികതയും സമന്വയിപ്പിക്കുന്നു.
