base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: ml
  text: എന്നാൽ, വിശുദ്ധസ്ഥലത്തു പ്രായശ്ചിത്തം ചെയ്യാൻ അതിന്റെ രക്തത്തിൽനിന്ന് കുറെ സമാഗമകൂടാരത്തിനകത്തേക്കു കൊണ്ടുവരുന്ന യാതൊരു പാപയാഗവും[a] ഭക്ഷിക്കരുത്; അത് തീയിൽ ദഹിപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശുദ്ധീകരണയാഗം.’ ലേവ്യപുസ്തകത്തിൽ ഹീബ്രു പദമായ חַטָּאת പാപവും അശുദ്ധിയും നീക്കുന്നതിനുള്ള യാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: എന്നാൽ, ... ഏതു ... എങ്കിലും
  rationale: വാക്യം മുൻനിയമങ്ങളോടു ബന്ധിപ്പിക്കുമ്പോഴും ഇവിടെ വരുന്ന വ്യത്യസ്തമായ നിർദേശം സൂചിപ്പിക്കാൻ וְ എന്ന ബന്ധകത്തെ ‘എന്നാൽ’ എന്നു നൽകി; כָל ന്റെ സമഗ്രമായ വ്യാപ്തി ‘ഏതു ... എങ്കിലും’ സംരക്ഷിക്കുന്നു.
- source_word: חַטָּאת
  choice: പാപയാഗം
  rationale: യാജകീയ യാഗസന്ദർഭത്തിൽ ഈ പദം അമൂർത്തമായ ‘പാപം’ എന്നതല്ല, പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പൊതുവായ മലയാള ബൈബിൾ ഭാഷയിൽ ‘പാപയാഗം’ വ്യക്തവും പരിചിതവുമാണ്; ശുദ്ധീകരണവശം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: അതിന്റെ രക്തത്തിൽനിന്നെങ്കിലും കുറെ ... കൊണ്ടുവരുന്നുവോ
  rationale: מִן നൽകുന്ന അംശാർത്ഥം—രക്തം മുഴുവനല്ല, അതിൽനിന്ന് ഒരു ഭാഗം—‘കുറെ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; ഹീബ്രുവിലെ കർമണിപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിനകത്തേക്ക്
  rationale: സ്ഥിരമായ വിശുദ്ധമന്ദിരനാമം നിലനിർത്തുകയും אֶל എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ അകത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לְכַפֵּר
  choice: പ്രായശ്ചിത്തം കഴിക്കേണ്ടതിന്
  rationale: യാഗക്രമത്തിലെ כפר ന്റെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി നിലനിർത്തുന്ന പരിചിതമായ പ്രയോഗമാണിത്; പ്രായശ്ചിത്തത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തം ഇതിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: בַּקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലത്ത്
  rationale: അമൂർത്തമായ വിശുദ്ധിയെയല്ല, വിശുദ്ധമന്ദിരത്തിലെ വിശുദ്ധ മേഖലയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לֹא תֵאָכֵל
  choice: അത് ഭക്ഷിക്കരുത്
  rationale: നിഫാൽ കർമണിയുടെയും നിയമപരമായ നിരോധനത്തിന്റെയും അർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: അത് തീയിൽ ദഹിപ്പിക്കണം
  rationale: ഹീബ്രുവിലെ ‘തീകൊണ്ട്/തീയിൽ ചുട്ടുകളയുക’ എന്ന ഊന്നൽ സൂക്ഷിച്ചുകൊണ്ട് നിയമഭാഷയിൽ സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: യാജകീയ യാഗനിയമത്തിൽ חַטָּאת എന്ന പദത്തിന്റെ അർത്ഥം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ സന്ദർഭത്തിൽ പദം യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശുദ്ധീകരണയാഗം’ ആചാരപരമായ ശുദ്ധീകരണവശം എടുത്തുകാട്ടുന്ന സാധുവായ മറ്റൊരു പരിഭാഷയാണെങ്കിലും, ‘പാപയാഗം’ സാധാരണ വായനക്കാർക്ക് കൂടുതൽ പരിചിതമാണ്; മറ്റർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: വിശുദ്ധമന്ദിരത്തിനകത്തേക്കു കൊണ്ടുവരുന്ന രക്തത്തിന്റെ അളവ്
  choice: രക്തത്തിൽനിന്ന് കുറെ കൊണ്ടുവരുന്നു എന്ന അംശാർത്ഥം വ്യക്തമാക്കി
  alternative: അതിന്റെ രക്തം കൊണ്ടുവരുന്നു
  rationale: מִדָּמָהּ എന്നതിലെ מִן രക്തത്തിൽനിന്ന് ഒരു ഭാഗം കൊണ്ടുവരുന്നതായി സൂചിപ്പിക്കുന്നു. അത് തുറന്നുപറയുന്നത് യാഗക്രമത്തിലെ വിശദാംശം മങ്ങിപ്പോകാതിരിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമ-ആചാര ശൈലി. ‘സമാഗമകൂടാരം,’ ‘പ്രായശ്ചിത്തം,’ ‘പാപയാഗം’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ദീർഘമായ ഹീബ്രു ബന്ധവാക്യം മലയാളത്തിൽ വായിക്കാവുന്ന ക്രമത്തിൽ അവതരിപ്പിച്ചു.
