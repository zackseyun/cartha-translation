  text: וְ/הָ/אֵ֨שׁ עַל הַ/מִּזְבֵּ֤חַ תּֽוּקַד בּ/וֹ֙ לֹ֣א תִכְבֶּ֔ה וּ/בִעֵ֨ר עָלֶ֧י/הָ הַ/כֹּהֵ֛ן עֵצִ֖ים בַּ/בֹּ֣קֶר בַּ/בֹּ֑קֶר וְ/עָרַ֤ךְ עָלֶ֨י/הָ֙ הָֽ/עֹלָ֔ה וְ/הִקְטִ֥יר עָלֶ֖י/הָ חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: ml
  text: യാഗപീഠത്തിന്മേൽ തീ കത്തിക്കൊണ്ടിരിക്കണം; അത് അണയരുത്. പുരോഹിതൻ ഓരോ പ്രഭാതത്തിലും[a] അതിന്മേൽ വിറക് കത്തിക്കണം; അതിന്മേൽ ഹോമയാഗം ക്രമമായി വെക്കുകയും സമാധാനയാഗങ്ങളുടെ[b] കൊഴുപ്പുഭാഗങ്ങൾ അതിന്മേൽ ദഹിപ്പിക്കുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘പ്രഭാതംതോറും.’ എബ്രായഭാഷയിൽ ‘പ്രഭാതം’ എന്ന പദം ആവർത്തിക്കുന്നത് ഓരോ പ്രഭാതത്തിലും എന്ന വിതരണാർഥത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ക്ഷേമയാഗങ്ങൾ’ അല്ലെങ്കിൽ ‘കൂട്ടായ്മയാഗങ്ങൾ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: കത്തിക്കൊണ്ടിരിക്കണം
  rationale: ഹോഫാൽ രൂപം തീ തുടർച്ചയായി കത്തുന്ന നിലയിൽ നിലനിർത്തണമെന്ന കർമണിപരമായ നിർദേശം നൽകുന്നു; മലയാളത്തിൽ ഈ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בּוֹ / עָלֶיהָ
  choice: അതിന്മേൽ
  rationale: യാഗപീഠത്തിന്റെ ഉപരിതലത്തിലുള്ള തീയെയും അതിന്മേൽ നടത്തുന്ന യാഗക്രിയകളെയും സൂചിപ്പിക്കാൻ സ്വാഭാവികമായ സ്ഥാനപ്രയോഗം.
- source_word: לֹא תִכְבֶּה
  choice: അത് കെട്ടുപോകരുത്
  rationale: തീ അണയാതെ തുടരണം എന്ന നിയമനിർദേശം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּבִעֵר
  choice: വിറക് കത്തിക്കണം
  rationale: പുരോഹിതൻ തീ നിലനിർത്താൻ വിറക് ചേർത്ത് കത്തിക്കുന്ന പ്രവൃത്തിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; പുതുതായി തീ കൊളുത്തുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: ഓരോ പ്രഭാതത്തിലും
  rationale: ‘പ്രഭാതം പ്രഭാതം’ എന്ന ആവർത്തനത്തിന്റെ വിതരണാർഥം, അതായത് ദിവസേനയുള്ള പ്രവൃത്തി, സ്വാഭാവികമായി പകരുന്നു.
- source_word: וְעָרַךְ
  choice: ക്രമമായി വെക്കുകയും
  rationale: യാഗവസ്തു യാഗപീഠത്തിൽ നിശ്ചിത ക്രമത്തിൽ നിരത്തിവെക്കുന്ന അനുഷ്ഠാനാർഥം നിലനിർത്തുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കപ്പെടുന്ന യാഗവിഭാഗത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും കൃത്യവുമായ പദം.
- source_word: וְהִקְטִיר
  choice: ദഹിപ്പിക്കുകയും
  rationale: യാഗപീഠത്തിൽ അർപ്പിതഭാഗങ്ങൾ പുകയായി ഉയരുന്ന വിധം കത്തിക്കുന്ന ബലികർമത്തെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: חֶלְבֵי
  choice: കൊഴുപ്പുഭാഗങ്ങൾ
  rationale: പൊതുവായ ‘മികച്ച ഭാഗങ്ങൾ’ എന്നല്ല, യാഗത്തിൽ ദഹിപ്പിക്കാൻ വേർതിരിച്ച പ്രത്യേക കൊഴുപ്പുഭാഗങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: הַשְּׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: ഈ യാഗവിഭാഗത്തിന് തിരിച്ചറിയാവുന്ന പരമ്പരാഗത പദം ഉപയോഗിക്കുമ്പോഴും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാഗസംബന്ധിയായ സാങ്കേതിക പദങ്ങളുടെ വിവർത്തനം
  choice: ‘ഹോമയാഗം’, ‘സമാധാനയാഗങ്ങൾ’ എന്നീ പരിചിതമായ യാഗപദങ്ങൾ ഉപയോഗിച്ചു
  alternative: ‘ആരോഹണയാഗം’, ‘ക്ഷേമയാഗങ്ങൾ’ അല്ലെങ്കിൽ ‘കൂട്ടായ്മയാഗങ്ങൾ’ പോലുള്ള വ്യുത്പത്തിപരമായ പദങ്ങൾ
  rationale: നിയമപരവും അനുഷ്ഠാനപരവുമായ സന്ദർഭത്തിൽ യാഗവിഭാഗങ്ങൾ വ്യക്തമായി തിരിച്ചറിയാൻ പരിചിതപദങ്ങൾ സഹായിക്കുന്നു; ശְׁלָמִים എന്നതിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമനിർദേശ ശൈലി. ആവർത്തിക്കുന്ന ‘അതിന്മേൽ’ എന്ന പ്രയോഗം എബ്രായവാക്യത്തിന്റെ യാഗപീഠകേന്ദ്രിത ഘടന നിലനിർത്താൻ ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
