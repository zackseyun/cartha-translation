language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַֽל מַחֲבַ֗ת בַּ/שֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑/נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: ml
  text: എണ്ണ ചേർത്ത് ഒരു പരന്ന ചട്ടിയിൽ അതു തയ്യാറാക്കണം[a]. നന്നായി കലർത്തിയശേഷം അതു കൊണ്ടുവരണം. കഷണങ്ങളാക്കിയ ധാന്യയാഗത്തിന്റെ ചുട്ടെടുത്ത ഭാഗങ്ങളായി അതു യഹോവയ്ക്കു പ്രസാദകരമായ സൗരഭ്യമായി അർപ്പിക്കണം[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എണ്ണയിൽ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ചുട്ടെടുത്ത ഭാഗങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം അത്യപൂർവമാണ്; പരന്ന ചട്ടിയിൽ തയ്യാറാക്കിയ ചുട്ട ഭാഗങ്ങളെ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘പ്രസാദകരമായ സൗരഭ്യം’ എന്നത് യഹോവയ്ക്കു സ്വീകാര്യമായ യാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ യാഗപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: പരന്ന ചട്ടി
  rationale: ധാന്യയാഗം തയ്യാറാക്കാൻ ഉപയോഗിച്ചിരുന്ന പരന്ന പാചകപാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בַּשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത്
  rationale: בְּ എന്ന ഉപസർഗത്തിന് ഇവിടെ ‘എണ്ണയിൽ’ എന്നും ‘എണ്ണ ചേർത്ത്’ എന്നും അർഥമാകാം; തയ്യാറാക്കൽരീതിയെ സ്വാഭാവികമായി അറിയിക്കാൻ ‘എണ്ണ ചേർത്ത്’ സ്വീകരിച്ചു.
- source_word: מֻרְבֶּכֶת
  choice: നന്നായി കുഴച്ചശേഷം
  rationale: എണ്ണയുമായി യോജിപ്പിച്ചോ കലർത്തിയോ തയ്യാറാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; പ്രത്യേക പാചകരീതി അനാവശ്യമായി നിർണ്ണയിക്കാതെ ആശയം നൽകുന്നു.
- source_word: תְּבִיאֶנָּה
  choice: അതു കൊണ്ടുവരണം
  rationale: സ്ത്രീലിംഗ പ്രത്യയം യാഗവസ്തുവിനെ സൂചിപ്പിക്കുന്നു; ക്രിയയുടെ അടിസ്ഥാനമായ ‘കൊണ്ടുവരുക’ എന്ന അർഥം നിലനിർത്തി.
- source_word: תֻּפִינֵי
  choice: ചുട്ടെടുത്ത കഷണങ്ങളായി
  rationale: അത്യപൂർവമായ ഈ പാചകപദം ചുട്ടെടുത്ത ഭാഗങ്ങളെയോ കഷണങ്ങളെയോ സൂചിപ്പിക്കാമെന്നതിനാൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: מִנְחַת פִּתִּים
  choice: നുറുക്കിയ ധാന്യയാഗമായി
  rationale: מִנְחָה എന്ന യാഗസാങ്കേതിക പദത്തിന് ‘ധാന്യയാഗം’ എന്നും, פִּתִּים എന്നതിന് ഭാഗങ്ങളാക്കിയതോ നുറുക്കിയതോ എന്ന ആശയവും നൽകി.
- source_word: תַּקְרִיב
  choice: അർപ്പിക്കണം
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള קרב യാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക/സമർപ്പിക്കുക’ എന്നാണ്; മലയാളത്തിൽ ‘അർപ്പിക്കുക’ സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യം
  rationale: യാഗം ദൈവത്തിന് സ്വീകാര്യമാണെന്നു സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപ്രയോഗം; അതിന്റെ രൂപകാത്മക ഭാഷയും ആരാധനാഭാവവും നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: മൂലപാഠത്തിലെ יהוה എന്ന ദൈവനാമം പൊതുവായി പരിചിതമായ മലയാളരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുനാമമാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ‘യഹോവ’ സാധാരണ മലയാളവായനക്കാർക്ക് ഏറെ പരിചിതമായ രൂപമാണ്.
- issue: רֵיחַ נִיחֹחַ എന്ന യാഗപ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രസാദകരമായ സൗരഭ്യം
  alternative: സുഖകരമായ ഗന്ധം; ശാന്തിദായകമായ സൗരഭ്യം
  rationale: യാഗം ദൈവത്തിന് സ്വീകാര്യമാണെന്ന ദൈവശാസ്ത്രപരമായ പശ്ചാത്തലം സൂചിപ്പിക്കുമ്പോഴും മൂലത്തിലെ സൗരഭ്യരൂപകം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ലേവ്യപുസ്തകത്തിലെ യാഗനിർദേശങ്ങൾക്ക് യോജിച്ച ഗൗരവവും വ്യക്തതയും പാലിച്ചു. അപൂർവമായ പാചകപദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു; യാഗസാങ്കേതിക പദമായ ‘ധാന്യയാഗം’ നിലനിർത്തി.
