  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל מִנְחַ֥ת כֹּהֵ֛ן כָּלִ֥יל תִּהְיֶ֖ה לֹ֥א תֵאָכֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/016.yaml
  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: ml
  text: പുരോഹിതന്റെ ഓരോ ധാന്യയാഗവും മുഴുവനായും ദഹിപ്പിക്കണം[a]; അത് ഭക്ഷിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘മുഴുവനായിരിക്കണം.’ എബ്രായ വിശേഷണപദത്തിന് യാഗം മുഴുവനായതോ സമ്പൂർണമായതോ ആണെന്നു സൂചിപ്പിക്കാം; ഇവിടെ അത് ഭക്ഷിക്കാതെ മുഴുവനും യാഗപീഠത്തിൽ അർപ്പിച്ച് ദഹിപ്പിക്കണമെന്നതാണ് പ്രായോഗിക അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: ഓരോ
  rationale: כָּל എന്ന പദം ഏകവചന നാമത്തോടു ചേർന്ന് വിതരണാർഥത്തിൽ ‘ഓരോ’ എന്നു സൂചിപ്പിക്കുന്നു. തുടക്കത്തിലെ וְ നിയമനിർദേശത്തിന്റെ തുടർച്ച കാണിക്കുന്നുവെങ്കിലും, മലയാളത്തിൽ ഈ ഒറ്റവാക്യത്തിന്റെ ആരംഭത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ ചേർക്കാതെ സ്വാഭാവികമായി ആ ബന്ധം നിലനിർത്താം.
- source_word: מִנְחַת
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ മִנְחָה സാധാരണ വഴിപാടിനെയല്ല, ധാന്യംകൊണ്ടുള്ള പ്രത്യേക യാഗവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ധാന്യയാഗം’ അതിന്റെ സാങ്കേതികവും വ്യക്തവുമായ മലയാളരൂപമാണ്.
- source_word: כֹּהֵן
  choice: പുരോഹിതന്റെ
  rationale: מִנְחַת כֹּהֵן എന്ന construct ഘടന ‘പുരോഹിതന്റെ ധാന്യയാഗം’ എന്നാണ്; മലയാളത്തിലെ ബന്ധികാരൂപം ഇത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּלִיל
  choice: മുഴുവനായും ദഹിപ്പിക്കണം
  rationale: כָּלִיל എന്ന വിശേഷണം ‘മുഴുവൻ/സമ്പൂർണം’ എന്നർഥം വഹിക്കുകയും യാഗസന്ദർഭത്തിൽ ഒന്നും ഭക്ഷണത്തിനായി മാറ്റിവയ്ക്കാതെ മുഴുവനും യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. മുഖ്യവാചകം പ്രായോഗിക അർഥം വ്യക്തമായി നൽകുന്നു; പദത്തിന്റെ രൂപപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: תִּהְיֶה
  choice: ദഹിപ്പിക്കണം
  rationale: നിയമവാക്യത്തിലെ היה imperfect നിർദേശാത്മക ശക്തിയുള്ളതാണ്. മലയാളത്തിലെ ‘-ണം’ രൂപം നിയമപരമായ ബാധ്യത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא תֵאָכֵל
  choice: അത് ഭക്ഷിക്കരുത്
  rationale: Niphal രൂപം നിഷ്ക്രിയമായ ‘ഭക്ഷിക്കപ്പെടരുത്’ എന്നാണ് അക്ഷരാർഥം; എന്നാൽ ‘അത് ഭക്ഷിക്കരുത്’ മലയാളത്തിൽ സ്വാഭാവികവും അതേ നിരോധനം കൃത്യമായി അറിയിക്കുന്നതുമാണ്.
