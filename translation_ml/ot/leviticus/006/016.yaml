translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, എന്നാൽ യാഗനിയമത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ധാന്യയാഗം’ എന്ന സാങ്കേതിക പദം സ്ഥിരതയ്ക്കായി ഉപയോഗിച്ചു; כָּלִיל എന്ന പദത്തിലെ രൂപപരമായ ‘മുഴുവൻ’ എന്ന അർഥവും സന്ദർഭപരമായ ‘മുഴുവനായി ദഹിപ്പിക്കൽ’ എന്ന അർഥവും മുഖ്യവാചകവും അടിക്കുറിപ്പും ചേർന്ന് സംരക്ഷിക്കുന്നു.
