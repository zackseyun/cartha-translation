id: LEV.6.13
reference: Leviticus 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: ml
  text: 'അഹരോനും അവന്റെ പുത്രന്മാരും അവനെ[a] അഭിഷേകം ചെയ്യുന്ന ദിവസം യഹോവയ്ക്ക് അർപ്പിക്കേണ്ട വഴിപാട് ഇതാണ്: നിരന്തരം അർപ്പിക്കേണ്ട ധാന്യയാഗമായി ഒരു ഏഫയുടെ പത്തിലൊന്ന് നന്നായി അരച്ച മാവ്; അതിന്റെ പകുതി രാവിലെ, പകുതി വൈകുന്നേരം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലപാഠത്തിൽ “അവനെ” എന്നത് ഏകവചനമാണ്, എന്നാൽ വാക്യത്തിൽ “അഹരോനും അവന്റെ പുത്രന്മാരും” എന്നു പറയുന്നു. “അവന്റെ അഭിഷേകദിവസം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: קָרְבַּן
  choice: വഴിപാട്
  rationale: ബലികർമസന്ദർഭത്തിലെ വിശാലമായ അർപ്പണപദം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: יַקְרִיבוּ
  choice: അർപ്പിക്കേണ്ട
  rationale: ഹിഫിൽ രൂപം ഇവിടെ യഹോവയുടെ സന്നിധിയിൽ ഔപചാരികമായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה-യെ സുതാര്യമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: അവനെ അഭിഷേകം ചെയ്യുന്ന ദിവസം
  rationale: മസോരറ്റിക് പാഠത്തിലെ ഏകവചന കർമസർവനാമം നിലനിർത്തുകയും സമയസൂചന വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: ഒരു ഏഫയുടെ പത്തിലൊന്ന്
  rationale: അളവിനെ കൃത്യമായും മലയാളത്തിൽ സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: ധാന്യയാഗത്തിനായി ഉപയോഗിച്ച ശുദ്ധീകരിച്ച, നന്നായി പൊടിച്ച മാവിനെ സൂചിപ്പിക്കുന്ന പതിവ് മലയാളപ്രയോഗം.
- source_word: מִנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗനിയമസന്ദർഭത്തിൽ ധാന്യത്തിൽനിന്നുള്ള യാഗം എന്ന പ്രത്യേക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: תָּמִיד
  choice: നിരന്തരമായ
  rationale: പതിവായി തുടർന്നുകൊണ്ടിരിക്കുന്ന യാഗക്രമത്തെ സൂചിപ്പിക്കുന്നു; ഇടവിടാതെ ജ്വലിക്കുന്ന ഭൗതിക തുടർച്ച നിർബന്ധമായി ആരോപിക്കുന്നില്ല.
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: അതിന്റെ പകുതി ... പകുതി
  rationale: യാഗവസ്തു രണ്ടു തുല്യഭാഗങ്ങളായി വിഭജിക്കുന്നതിനെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: രാവിലെയും ... വൈകുന്നേരവും
  rationale: ഹീബ്രുവിലെ സമയപ്രയോഗങ്ങൾക്ക് സ്വാഭാവികമായ ആധുനിക മലയാളസമാനത.
theological_decisions:
- issue: “അഹരോനും അവന്റെ പുത്രന്മാരും” എന്ന ബഹുവചന പരാമർശത്തിനിടയിലെ אֹתוֹ എന്ന ഏകവചന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: “അവനെ അഭിഷേകം ചെയ്യുന്ന ദിവസം” എന്ന് ഏകവചനം പാഠത്തിൽ നിലനിർത്തി.
  alternative: “അവരെ അഭിഷേകം ചെയ്യുന്ന ദിവസം” എന്ന വിതരണാത്മകമോ കൂട്ടായതോ ആയ ബഹുവചന വായന.
  rationale: മസോരറ്റിക് പാഠത്തിൽ സർവനാമം ഏകവചനമാണ്. അത് അഹരോനെയോ ഓരോ അഭിഷിക്തപുരോഹിതനെയോ സൂചിപ്പിക്കാമെന്ന യഥാർഥ അവ്യക്തത പരിഭാഷയിൽ ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാനിയമശൈലി. അളവുപദമായ “ഏഫ” ലിപ്യന്തരം ചെയ്തു; മൂലപാഠത്തിലെ ഏകവചന-ബഹുവചന സംഘർഷം തിരുത്താതെ സൂക്ഷിച്ചു.
