lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക പ്രസംഗം ആരംഭിക്കുന്ന ഈ ആഖ്യാനസൂത്രത്തിന് സ്വാഭാവികവും ആദരസൂചകവുമായ മലയാളപ്രയോഗം; ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ഔപചാരികഭാവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക ആധുനിക മലയാളരൂപം.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രസംഗസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘അരുളിച്ചെയ്തു’ എന്ന ക്രിയയോടൊപ്പം അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം ഒരു പദവിക്കുപകരം ചതുരക്ഷര ദൈവനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ദൈവത്തിന്റെ വ്യക്തിനാമം പാഠത്തിൽ നിലനിർത്തുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലെന്ന കാര്യം അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ദൈവിക പ്രസംഗസൂത്രം. എബ്രായത്തിലെ ‘സംസാരിച്ചു … പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഇങ്ങനെ അരുളിച്ചെയ്തു’ എന്ന് സംയോജിപ്പിച്ചു.
