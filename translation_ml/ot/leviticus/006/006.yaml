- source_word: תִכְבֶּה
  choice: അണഞ്ഞുപോകരുത്
  rationale: ക്രിയയുടെ അകർമകമായ ‘അണഞ്ഞുപോകുക’ എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
