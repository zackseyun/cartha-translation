id: LEV.6.1
reference: Leviticus 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: യഹ്‌വെ മോശയോട് അരുളിച്ചെയ്തു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ דּבר അടുത്ത വചനഘട്ടത്തെ അവതരിപ്പിക്കുന്നു. ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമാണ് ‘അരുളിച്ചെയ്തു’; തുടർന്നുവരുന്ന לֵאמֹר സൂത്രവാക്യം മലയാളത്തിൽ വേറിട്ട് ആവർത്തിക്കാതെ ഇതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֶל
  choice: -യോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ അടയാളപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാള വിഭക്തിരൂപം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാളത്തിൽ നിലവിലുള്ള പ്രമാണിക വ്യക്തിനാമരൂപം.
- source_word: לֵאמֹר
  choice: അരുളിച്ചെയ്തു എന്നതിൽ ഉൾക്കൊള്ളുന്നു
  rationale: നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രപ്രയോഗമാണിത്. ‘പറഞ്ഞുകൊണ്ട്’ എന്ന യാന്ത്രിക ആവർത്തനം ഒഴിവാക്കി, മലയാളത്തിലെ ഉദ്ധരണി-പരിചയപ്പെടുത്തൽ രീതിയിൽ ക്രിയയിലും ദ്വിബിന്ദുവിലും അർഥം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, സാധാരണമായി അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തെ ആധാരമാക്കി ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു; പാരമ്പര്യരൂപം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി. എബ്രായത്തിലെ ‘സംസാരിച്ചു, പറഞ്ഞുകൊണ്ട്’ എന്ന സൂത്രഘടന വാക്കിന് വാക്കായി ആവർത്തിക്കാതെ സ്വാഭാവികമായ ‘അരുളിച്ചെയ്തു:’ എന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
