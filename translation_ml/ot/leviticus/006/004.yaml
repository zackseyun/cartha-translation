reference: Leviticus 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/פָשַׁט֙ אֶת בְּגָדָ֔י/ו וְ/לָבַ֖שׁ בְּגָדִ֣ים אֲחֵרִ֑ים וְ/הוֹצִ֤יא אֶת הַ/דֶּ֨שֶׁן֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה אֶל מָק֖וֹם טָהֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/004.yaml
  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: ml
  text: പിന്നെ അവൻ തന്റെ വസ്ത്രങ്ങൾ അഴിച്ചുമാറ്റി വേറെ വസ്ത്രങ്ങൾ ധരിക്കണം. ചാരം പാളയത്തിനു പുറത്തുള്ള ശുദ്ധമായ[b] ഒരു സ്ഥലത്തേക്കു കൊണ്ടുപോകണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചാരം പുറത്തേക്കു കൊണ്ടുവരണം’ അല്ലെങ്കിൽ ‘പുറത്തേക്കു നീക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ശുദ്ധമായ’ എന്നത് ലേവ്യപുസ്തകത്തിലെ ആചാരശുദ്ധിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט
  choice: പിന്നെ അവൻ … അഴിച്ചുമാറ്റി
  rationale: വസ്ത്രത്തിന്റെ സന്ദർഭത്തിൽ פשט എന്നത് ‘അഴിക്കുക/അഴിച്ചുമാറ്റുക’ എന്നാണ്. നടപടിക്രമത്തിലെ തുടർച്ചയെ וּ സൂചിപ്പിക്കുന്നതിനാൽ ‘പിന്നെ’ എന്നു നൽകി.
- source_word: בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ
  rationale: בגד എന്ന സാധാരണ വാക്കിന്റെ സ്വാഭാവികവും ആചാരസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളരൂപം.
- source_word: וְלָבַשׁ
  choice: ധരിക്കണം
  rationale: לבש ഇവിടെ വസ്ത്രം ധരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; നിർദേശാത്മകമായ ഹീബ്രായ രൂപം മലയാളത്തിൽ ‘ധരിക്കണം’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: בְּגָדִים אֲחֵרִים
  choice: വേറെ വസ്ത്രങ്ങൾ
  rationale: ആദ്യം ധരിച്ചിരുന്നവയിൽനിന്ന് വ്യത്യസ്തമായ വസ്ത്രങ്ങളെയാണ് אֲחֵרִים സൂചിപ്പിക്കുന്നത്; ‘വേറെ വസ്ത്രങ്ങൾ’ ലളിതവും കൃത്യവുമാണ്.
- source_word: וְהוֹצִיא
  choice: കൊണ്ടുപോകണം
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ചാരം ഒരു സ്ഥലത്തുനിന്ന് പുറത്തേക്കു നീക്കി മറ്റൊരു സ്ഥലത്തേക്കു കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַדֶּשֶׁן
  choice: ചാരം
  rationale: യാഗപീഠത്തിൽ ശേഷിച്ച ദഹനാവശിഷ്ടത്തെയാണ് ഇവിടെ דֶּשֶׁן സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ചാരം’ സ്വാഭാവികമാണ്.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തുള്ള
  rationale: ചാരം എത്തിക്കേണ്ട സ്ഥലം പാളയത്തിന്റെ അതിരിനു പുറത്താണെന്ന ദിശയും സ്ഥാനവും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: אֶל מָקוֹם טָהוֹר
  choice: ശുദ്ധമായ ഒരു സ്ഥലത്തേക്ക്
  rationale: טָהוֹר എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘ശുദ്ധമായ’ നിലനിർത്തുന്നു; ലേവ്യപുസ്തകത്തിലെ ആചാരശുദ്ധിയുടെ സവിശേഷത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: טָהוֹר എന്ന പദത്തിലെ ആചാരശുദ്ധിയുടെ അർഥനിഴൽ
  choice: ശുദ്ധമായ സ്ഥലം
  alternative: ആചാരപരമായി ശുദ്ധമായ സ്ഥലം
  rationale: പ്രധാനവാചകത്തിൽ ‘ആചാരപരമായി’ എന്നു ചേർക്കുന്നത് മൂലപാഠത്തെക്കാൾ വിശദീകരണാത്മകമാകും. ‘ശുദ്ധമായ’ എന്ന നേരിട്ടുള്ള വിവർത്തനം നിലനിർത്തി ലേവ്യസന്ദർഭത്തിലെ ആചാരപരമായ അർഥം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. പുരോഹിതകർമത്തിന്റെ നടപടിക്രമഭാവം ‘അഴിച്ചുമാറ്റി’, ‘ധരിക്കണം’, ‘കൊണ്ടുപോകണം’ എന്നീ സ്വാഭാവിക ക്രിയകളിലൂടെ നിലനിർത്തി.
