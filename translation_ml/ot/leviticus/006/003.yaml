  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: ml
  text: പുരോഹിതൻ തന്റെ ശണവസ്ത്രം ധരിക്കണം; ശണനൂൽകൊണ്ടുള്ള അടിവസ്ത്രവും തന്റെ ശരീരത്തിന്മേൽ[a] ധരിക്കണം. തീ യാഗപീഠത്തിന്മേൽ ഹോമയാഗത്തെ ദഹിപ്പിച്ചുണ്ടായ ചാരം[b] അവൻ എടുത്തുമാറ്റി യാഗപീഠത്തിന്റെ അരികിൽ വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “തന്റെ മാംസത്തിന്മേൽ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തോട് കൂടുതൽ ചേർന്ന്, “തീ ഹോമയാഗത്തെ ദഹിപ്പിച്ച ചാരം.” ഹീബ്രു പ്രയോഗം സങ്കുചിതമായതിനാൽ അടുത്ത അർഥമുള്ള പലവിധത്തിൽ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: തന്റെ ചണവസ്ത്രം
  rationale: പുരോഹിതവസ്ത്രത്തിന്റെ കൃത്യമായ രൂപം അനാവശ്യമായി നിർണയിക്കാതെ, בַד സൂചിപ്പിക്കുന്ന ചണവസ്തുവും ഔദ്യോഗിക വസ്ത്രം എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: מִכְנְסֵי בַד
  choice: ചണകൊണ്ടുള്ള അടിവസ്ത്രം
  rationale: ശരീരത്തിന്റെ താഴ്ഭാഗത്ത് തൊലിയോടു ചേർന്നു ധരിക്കുന്ന പുരോഹിതവസ്ത്രത്തിന്റെ പ്രവർത്തനം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל בְּשָׂרוֹ
  choice: തന്റെ ദേഹത്തിന്മേൽ
  rationale: അക്ഷരാർഥമായ ‘തന്റെ മാംസത്തിന്മേൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികമായിരിക്കെ, വസ്ത്രം ശരീരത്തിൽ നേരിട്ട് ധരിക്കുന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: וְהֵרִים
  choice: നീക്കി
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ഉയർത്തുക’ എന്നാണെങ്കിലും, ഇവിടെ യാഗപീഠത്തിൽനിന്ന് ചാരം എടുത്തുമാറ്റുന്ന ആചാരനടപടിയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: הַדֶּשֶׁן
  choice: ചാരം
  rationale: യാഗപീഠത്തിലെ ദഹനശേഷിപ്പിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: ഹോമയാഗത്തെ തീ ദഹിപ്പിച്ചുണ്ടായ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ സങ്കുചിതത്വം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുമ്പോൾ, തീ ഹോമയാഗം ദഹിപ്പിക്കുകയും അതിൽനിന്ന് ചാരം ഉണ്ടാകുകയും ചെയ്യുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: പൂർണമായി തീയിൽ അർപ്പിക്കുന്ന യാഗത്തിനുള്ള മലയാള ബൈബിൾ-ആചാരപരമായ സുതാര്യ പദമാണ്.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ അരികിൽ
  rationale: സ്ഥലസാമീപ്യവും വശത്തുള്ള സ്ഥാനവും സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
