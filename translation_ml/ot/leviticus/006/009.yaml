source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֣רֶת מִמֶּ֔/נָּה יֹאכְל֖וּ אַהֲרֹ֣ן וּ/בָנָ֑י/ו מַצּ֤וֹת תֵּֽאָכֵל֙ בְּ/מָק֣וֹם קָדֹ֔שׁ בַּ/חֲצַ֥ר אֹֽהֶל מוֹעֵ֖ד יֹאכְלֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: ml
  text: അതിൽ ശേഷിക്കുന്നത് അഹരോനും അവന്റെ പുത്രന്മാരും ഭക്ഷിക്കണം[a]. അതു പുളിപ്പില്ലാത്തതായി[b] ഒരു വിശുദ്ധസ്ഥലത്തുവെച്ച്[c] ഭക്ഷിക്കണം; സമാഗമകൂടാരത്തിന്റെ പ്രാകാരത്തുവെച്ച് അവർ അതു ഭക്ഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അതിന്റെ ശേഷിപ്പ്’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പുളിപ്പില്ലാത്ത അപ്പമായി’. എബ്രായപദം യാഗവസ്തു പുളിപ്പില്ലാത്ത രൂപത്തിൽ ഭക്ഷിക്കണമെന്നു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ‘ഒരു വിശുദ്ധസ്ഥലത്ത്’ എന്നാണ്, ‘ആ വിശുദ്ധസ്ഥലത്ത്’ എന്നല്ല; അടുത്ത വാക്യഭാഗം ആ സ്ഥലം സമാഗമകൂടാരത്തിന്റെ പ്രാകാരമാണെന്നു വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: അതിൽ ശേഷിക്കുന്നത്
  rationale: സ്ത്രീലിംഗ ഏകവചന കൃദന്തരൂപം ധാന്യയാഗത്തിൽ ശേഷിക്കുന്ന അംശത്തെ നാമമായി സൂചിപ്പിക്കുന്നു. ‘അതിൽ ശേഷിക്കുന്നത്’ എന്നത് מן എന്നതിന്റെ ഉറവിട/വേർതിരിവ് ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יֹאכְלוּ
  choice: ഭക്ഷിക്കണം
  rationale: നിയമപരമായ നിർദേശസന്ദർഭത്തിലെ അപൂർണക്രിയയുടെ നിർബന്ധാത്മക ബലം ‘ഭക്ഷിക്കണം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַהֲרֹן וּבָנָיו
  choice: അഹരോനും അവന്റെ പുത്രന്മാരും
  rationale: ഇവിടെ בנים പുരോഹിതശുശ്രൂഷയിലുള്ള അഹരോന്റെ ആൺവംശജരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: מַצּוֹת תֵּאָכֵל
  choice: അതു പുളിപ്പില്ലാത്തതായി ഭക്ഷിക്കണം
  rationale: מַצּוֹת എന്ന ബഹുവചനരൂപം പുളിപ്പില്ലാത്ത ഭക്ഷ്യരൂപത്തെ സൂചിപ്പിക്കുന്നു. ‘അപ്പം’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത വർഗനാമം ചേർക്കാതെ, യാഗവസ്തു പുളിപ്പില്ലാത്ത നിലയിൽ ഭക്ഷിക്കണമെന്ന ആശയം നിലനിർത്തുന്നു; നിഫാൽ ക്രിയയുടെ കർമ്മണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ നിർദേശരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: ഒരു വിശുദ്ധസ്ഥലത്തുവെച്ച്
  rationale: מָקוֹם എന്ന നാമത്തിന് നിർദേശാർഥക ഉപപദമില്ലാത്തതിനാൽ ‘ഒരു വിശുദ്ധസ്ഥലം’ എന്നാണ് പരിഭാഷ; അടുത്ത ഉപവാക്യം ആ സ്ഥലം സമാഗമകൂടാരത്തിന്റെ പ്രാകാരമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: בַּחֲצַר
  choice: പ്രാകാരത്തുവെച്ച്
  rationale: חצר കൂടാരപരിസരത്തിലെ ചുറ്റുമതിലുള്ള തുറന്ന പ്രാകാരത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രാകാരം’ ദേവാലയസന്ദർഭത്തിൽ വ്യക്തവും മാന്യവുമായ പദമാണ്.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: എബ്രായ നാമത്തിന്റെ ‘കൂടാരം’ എന്ന ദൃശ്യരൂപവും കൂടിവരവിന്റെ ആശയവും സംരക്ഷിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ പദമാണ്.
- source_word: יֹאכְלוּהָ
  choice: അവർ അതു ഭക്ഷിക്കണം
  rationale: അവസാന ക്രിയയിലെ കർമ്മപ്രത്യയം തുറന്നുപറയുകയും മൂലത്തിലെ ആവർത്തനം ചുരുക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
