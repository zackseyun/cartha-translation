base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: ml
  text: '“അഹരോനോടും അവന്റെ പുത്രന്മാരോടും പറയുക: ‘പാപപരിഹാരയാഗത്തെക്കുറിച്ചുള്ള ചട്ടം ഇതാണ്: ഹോമയാഗമൃഗത്തെ അറുക്കുന്ന സ്ഥലത്തുവെച്ച് പാപപരിഹാരയാഗമൃഗത്തെയും യഹ്‌വേയുടെ സന്നിധിയിൽ അറുക്കണം. അത് അതിവിശുദ്ധമാണ്.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പാപപരിഹാരയാഗം” എന്നതിന് “ശുദ്ധീകരണയാഗം” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദമായ חַטָּאת പാപത്തെയും അതുമായി ബന്ധപ്പെട്ട ശുദ്ധീകരണയാഗത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל אַהֲרֹן וְאֶל בָּנָיו לֵאמֹר
  choice: അഹരോനോടും അവന്റെ പുത്രന്മാരോടും പറയുക
  rationale: ആജ്ഞാരൂപത്തിന്റെയും ഔപചാരിക നിയമഭാഷയുടെയും ഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സംയോജിത പ്രയോഗം സ്വീകരിച്ചു.
- source_word: זֹאת תּוֹרַת
  choice: ചട്ടം ഇതാണ്
  rationale: യാഗക്രമത്തിന്റെ പ്രത്യേക നിർദേശത്തെ സൂചിപ്പിക്കുന്ന תּוֹרָהയ്ക്ക് ഇവിടെ ‘ചട്ടം’ എന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും നിയമപരമായ ഭാവമുള്ളതുമാണ്.
- source_word: הַחַטָּאת
  choice: പാപപരിഹാരയാഗം
  rationale: ആചാരപരമായ യാഗത്തെയാണ് പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്. പരിചിതമായ ‘പാപപരിഹാരയാഗം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച് ശുദ്ധീകരണാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: בִּמְקוֹם אֲשֶׁר תִּשָּׁחֵט הָעֹלָה
  choice: ഹോമയാഗമൃഗത്തെ അറുക്കുന്ന സ്ഥലത്തുവെച്ച്
  rationale: עֹלָהയെ ‘ഹോമയാഗം’ എന്നും שׁחטയെ യാഗസന്ദർഭത്തിന് യോജിച്ച ‘അറുക്കുക’ എന്നും പരിഭാഷപ്പെടുത്തി; അറുക്കപ്പെടുന്നത് യാഗമൃഗമാണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: תִּשָּׁחֵט הַחַטָּאת
  choice: പാപപരിഹാരയാഗമൃഗത്തെയും ... അറുക്കണം
  rationale: നിയമപരമായ നിർബന്ധം ‘അറുക്കണം’കൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; യാഗത്തെയല്ല യാഗമൃഗത്തെയാണ് ശാരീരികമായി അറുക്കുന്നതെന്ന അർഥം വ്യക്തമാക്കി.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്ന ആരാധനാസന്ദർഭപ്രയോഗം ‘സന്നിധിയിൽ’ എന്നു നൽകി; ദൈവനാമം മറച്ചുവയ്ക്കാതെ യഹ്‌വേ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: קֹדֶשׁ קָדָשִׁים הִוא
  choice: അത് അതിവിശുദ്ധമാണ്
  rationale: എബ്രായ അതിശയോക്തിരൂപം അർഥസുതാര്യമായ മലയാള സൂപ്പർലേറ്റീവിലൂടെ നൽകി; സ്ത്രീലിംഗ സർവനാമത്തിന്റെ മുൻപദബന്ധം ‘അത്’കൊണ്ട് നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ നിയമനാമത്തെ ഒരു സ്ഥാനനാമംകൊണ്ട് പകരാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- issue: חַטָּאת എന്ന യാഗനാമത്തിന്റെ അർഥവ്യാപ്തി
  choice: പാപപരിഹാരയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: പദം പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയും അതിന്റെ ശുദ്ധീകരണഫലത്തെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ പരിചിതമായ പേര് നൽകി, വ്യത്യസ്ത ഊന്നൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. യാഗനിയമത്തിന്റെ ഔപചാരികത നിലനിർത്തിയെങ്കിലും അത്യന്തം പഴഞ്ചനായ പദക്രമം ഒഴിവാക്കി. ‘യാഗമൃഗം’ ചേർത്തത് അറുക്കൽക്രിയയുടെ വസ്തു മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കാനാണ്.
