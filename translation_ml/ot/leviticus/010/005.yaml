translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘നീളങ്കി’ എന്നത് כֻּתֹּנֶת എന്ന പ്രത്യേക വസ്ത്രപദത്തിന്റെ അർഥം ‘വസ്ത്രം’ എന്ന പൊതുപദത്തേക്കാൾ കൃത്യമായി നൽകുന്നു; ഉപസർഗത്തിലെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
