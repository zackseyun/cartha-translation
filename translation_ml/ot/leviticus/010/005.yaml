- from: അങ്ങനെ അവർ അടുത്തുചെന്ന്, അവരുടെ നീളങ്കികളോടെ അവരെ പാളയത്തിനു പുറത്തേക്കു ചുമന്നുകൊണ്ടുപോയി[a]—മോശ പറഞ്ഞതുപോലെതന്നെ.
  to: അങ്ങനെ അവർ അടുത്തുചെന്ന്, അവരുടെ നീളങ്കികളിൽ അവരെ പാളയത്തിനു പുറത്തേക്കു ചുമന്നുകൊണ്ടുപോയി[a]—മോശെ പറഞ്ഞതുപോലെതന്നെ.
  rationale: The revision renders the Hebrew prepositional phrase with ‘നീളങ്കികളിൽ,’ retaining its primary locative sense, while the footnote gives the viable instrumental sense. It also standardizes the spelling of Moses without changing the meaning or register.
