source:
  edition: WLC
  text: וַֽ/יִּקְרְב֗וּ וַ/יִּשָּׂאֻ/ם֙ בְּ/כֻתֳּנֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/005.yaml
  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
translation:
  language: ml
  text: അങ്ങനെ അവർ അടുത്തുചെന്ന്, അവരുടെ നീളങ്കികളിൽ അവരെ പാളയത്തിനു പുറത്തേക്കു ചുമന്നുകൊണ്ടുപോയി[a]—മോശെ പറഞ്ഞതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ നീളങ്കികൾ ഉപയോഗിച്ച്.’ എബ്രായത്തിലെ ഉപസർഗം ഉപകരണം സൂചിപ്പിക്കാം; അതിനാൽ നീളങ്കികളിൽ പിടിച്ചോ അവ ഉപയോഗിച്ചോ മൃതദേഹങ്ങൾ ചുമന്നുവെന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: അവർ അടുത്തുചെന്ന്
  rationale: קרב എന്ന ധാതുവിന്റെ ഖാൽ വയിക്തോൽ രൂപം മൃതദേഹങ്ങളുടെ അടുത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; ആചാരപരമായ അധിക അർഥം ചേർക്കാതെ ദിശാബോധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיִּשָּׂאֻם
  choice: അവരെ ... ചുമന്നുകൊണ്ടുപോയി
  rationale: נשׂא എന്ന ക്രിയയും മൂന്നാം പുരുഷ ബഹുവചന കർമപ്രത്യയവും നാദാബിനെയും അബീഹൂവിനെയും എടുത്തു നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: בְּכֻתֳּנֹתָם
  choice: അവരുടെ നീളങ്കികളോടെ
  rationale: כֻּתֹּנֶת ശരീരത്തിൽ ധരിക്കുന്ന നീണ്ട വസ്ത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. בְּ എന്ന ഉപസർഗം ഇവിടെ അവ ധരിച്ചിരുന്ന സാഹചര്യമോ അവ ഉപയോഗിച്ച രീതിയോ സൂചിപ്പിക്കാം; ‘-കളോടെ’ മുഖ്യവാചകത്തിൽ ഈ അവ്യക്തത ഒരു പരിധിവരെ നിലനിർത്തുന്നു.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തേക്കു
  rationale: אֶל കൂടിയ מִחוּץ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു; ‘പുറത്തേക്കു’ ആ ദിശാബോധം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: മോശ പറഞ്ഞതുപോലെതന്നെ
  rationale: മുമ്പത്തെ മോശയുടെ നിർദേശത്തോടുള്ള കൃത്യമായ അനുസരണം כַּאֲשֶׁר സൂചിപ്പിക്കുന്നു; ‘പോലെതന്നെ’ താരതമ്യബലം നിലനിർത്തുന്നു.
