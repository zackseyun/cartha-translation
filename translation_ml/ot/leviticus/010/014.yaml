id: LEV.10.14
reference: Leviticus 10:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: ml
  text: നിന്റെ പുത്രന്മാരും പുത്രിമാരും നിന്നോടുകൂടെ നീയും നീരാജനാർപ്പണത്തിന്റെ നെഞ്ചും[a] ഉയർത്തിവെച്ച വഴിപാടിന്റെ തുടയും[b] ശുദ്ധമായ സ്ഥലത്ത് ഭക്ഷിക്കണം. കാരണം, അവ ഇസ്രായേൽമക്കളുടെ സമാധാനയാഗങ്ങളിൽനിന്ന് നിനക്കും നിന്റെ പുത്രന്മാർക്കും വിഹിതമായി നൽകിയിരിക്കുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയുടെ സന്നിധിയിൽ നീരാജനംചെയ്ത് സമർപ്പിച്ച നെഞ്ച്.” എബ്രായപദം ആചാരപരമായി നീരാജനംചെയ്ത ഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഉയർത്തിവെച്ച വഴിപാടിന്റെ തുട.” എബ്രായപദം ഉയർത്തിയതോ പുരോഹിതവിഹിതമായി വേർതിരിച്ചതോ ആയ വഴിപാടിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: “സമാധാനയാഗങ്ങൾ” എന്നത് “കൂട്ടായ്മയാഗങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദത്തിന് സമാധാനം, സമ്പൂർണത, ക്ഷേമം എന്നീ വിശാല അർഥങ്ങളുമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: നീരാജനാർപ്പണത്തിന്റെ നെഞ്ച്
  rationale: חֲזֶה മൃഗത്തിന്റെ നെഞ്ചുഭാഗത്തെയും תְּנוּפָה യഹോവയുടെ സന്നിധിയിൽ ആ ഭാഗം ആചാരപരമായി നീരാജനംചെയ്ത് സമർപ്പിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ-ആരാധനാ ഭാഷയിൽ പരിചിതമായ ‘നീരാജനാർപ്പണം’ ആ ആചാരാർഥം ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: വഴിപാടായി ഉയർത്തിയ തുട
  rationale: שׁוֹק ഇവിടെ മൃഗത്തിന്റെ തുട/കാലിന്റെ മേൽഭാഗമാണ്; תְּרוּמָה ഉയർത്തുകയോ വേർതിരിച്ചു നൽകുകയോ ചെയ്ത പുരോഹിതാവകാശത്തെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിനായി ബന്ധം ക്രിയാവിശേഷണരൂപത്തിൽ വ്യക്തമാക്കി.
- source_word: תֹּאכְלוּ
  choice: ഭക്ഷിക്കണം
  rationale: ഇവിടത്തെ അപൂർണ്ണക്രിയ നിയമപരമായ നിർദേശമാണ്; ‘ഭക്ഷിക്കണം’ അതിന്റെ ബാധ്യതാബോധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּמָקוֹם טָהוֹר
  choice: ശുദ്ധമായ ഒരു സ്ഥലത്തുവെച്ച്
  rationale: טָהוֹר ലേവ്യസന്ദർഭത്തിൽ ആചാരപരമായ ശുദ്ധിയെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ അധികവ്യാഖ്യാനം ചേർക്കാതെ ‘ശുദ്ധമായ’ എന്നു നിലനിർത്തി.
- source_word: אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ
  choice: നീയും നിന്നോടൊപ്പം നിന്റെ പുത്രന്മാരും പുത്രിമാരും
  rationale: മൂലപാഠം പുത്രന്മാരെയും പുത്രിമാരെയും പ്രത്യേകം പറയുന്നു; ‘നിന്നോടൊപ്പം’ എന്ന ഘടകവും സംരക്ഷിച്ചിട്ടുണ്ട്.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: നിനക്കും നിന്റെ പുത്രന്മാർക്കുമുള്ള അവകാശം
  rationale: חֹק ഇവിടെ ചട്ടം എന്നതിലുപരി നിശ്ചയിച്ചുനൽകിയ പുരോഹിതവിഹിതം/അവകാശം എന്നാണ്. ‘അവകാശം’ അതിന്റെ നിയമപരവും വിഹിതപരവുമായ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: נִתְּנוּ
  choice: നൽകിയിരിക്കുന്നു
  rationale: നിഷ്ക്രിയ പൂർണ്ണക്രിയ മുൻപ് നൽകിയതും ഇപ്പോഴും പ്രാബല്യത്തിലുള്ളതുമായ നിയോഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מִזִּבְחֵי שַׁלְמֵי
  choice: സമാധാനയാഗങ്ങളിൽനിന്ന്
  rationale: שְׁלָמִים സമാധാനം, സമ്പൂർണത, ക്ഷേമം എന്നിവയടങ്ങുന്ന വിശാലമായ അർഥമേഖലയുള്ള യാഗവിഭാഗമാണ്. ‘സമാധാനയാഗം’ പരമ്പരാഗത അർഥം നിലനിർത്തുന്നു; ‘കൂട്ടായ്മയാഗം’ അർഥം ചുരുക്കാം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രായിലെ പുത്രസംബന്ധിയായ പരമ്പരാഗത സമൂഹനാമം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: മൂലപാഠത്തിലെ പുത്രസംബന്ധിയായ പരമ്പരാഗത പ്രയോഗം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ ഒരു ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപമാണിത്.
- issue: שְׁלָמִים എന്ന യാഗനാമത്തിന്റെ പരിഭാഷ
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ
  rationale: ‘സമാധാനയാഗങ്ങൾ’ എന്നത് സമാധാനം, സമ്പൂർണത, ക്ഷേമം എന്നിവ ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു; ‘കൂട്ടായ്മ’ ഒരു പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് അർഥം ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമനിർദേശത്തിന്റെ ഭാവം ‘ഭക്ഷിക്കണം’ എന്നതിലൂടെ നിലനിർത്തി. യാഗസാങ്കേതിക പദങ്ങൾ അതിവ്യാഖ്യാനം ചെയ്യാതെ, ആവശ്യമായ പകരങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
