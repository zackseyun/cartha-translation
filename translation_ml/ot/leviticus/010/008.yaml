id: LEV.10.8
reference: Leviticus 10:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/008.yaml
  text: And Yahweh spoke to Aaron[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ[a] അഹരോനോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ YHWH; ‘യഹോവ’ എന്നും ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ דבר ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുകയും ദൈവിക വചനത്തിന്റെ ഔപചാരിക ആമുഖമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ ദൈവം സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണ് ‘അരുളിച്ചെയ്തു’.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֶל
  choice: -നോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദത്തിവ്/സംബോധനരൂപം.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്ഥാപിതമായ ബൈബിൾരൂപത്തിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്ന് വരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രപ്രയോഗത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘ഇപ്രകാരം പറഞ്ഞു’ എന്നു ആവർത്തിക്കുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു. ഉച്ചാരണത്തിന്റെ പുനർനിർമാണത്തിൽ ഉറപ്പില്ലാത്തതിനാൽ പരിചിതമായ മലയാളരൂപം മുഖ്യപാഠത്തിലും മറ്റൊരു സാധാരണ ലിപ്യന്തരരൂപം അടിക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ദൈവിക-വചന ആമുഖം. എബ്രായത്തിലെ לֵאמֹר എന്ന ആവർത്തനഘടന പദാനുപദമായി പകർത്താതെ ദ്വിബിന്ദുവിലൂടെ അതിന്റെ വാക്യപ്രവർത്തനം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ദൈവനാമത്തോടു ബന്ധപ്പെട്ടതിനാൽ അതിന്റെ പിന്നാലെ ചേർത്തു.
