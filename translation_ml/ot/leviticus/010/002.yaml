id: LEV.10.2
reference: Leviticus 10:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֥צֵא אֵ֛שׁ מִ/לִּ/פְנֵ֥י יְהוָ֖ה וַ/תֹּ֣אכַל אוֹתָ֑/ם וַ/יָּמֻ֖תוּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: ml
  text: യഹ്‌വെയുടെ സന്നിധിയിൽനിന്ന്[a] തീ പുറപ്പെട്ട് അവരെ ദഹിപ്പിച്ചു; അവർ യഹ്‌വെയുടെ സന്നിധിയിൽ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘യഹ്‌വെയുടെ മുമ്പിൽനിന്ന്’; മറ്റൊരു പരിഭാഷ: ‘യഹ്‌വെയുടെ സാന്നിധ്യത്തിൽനിന്ന്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം തീ ദൈവസന്നിധിയിൽനിന്ന് പുറത്തേക്കു വന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ ദിശാഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: אֵשׁ
  choice: തീ
  rationale: ഇവിടെ ഈ നാമം ന്യായവിധിയുടെ പ്രവർത്തകമായ യഥാർഥ തീയെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്.
- source_word: מִלִּפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽനിന്ന്
  rationale: പദസമുച്ചയത്തിന്റെ അർഥം അക്ഷരാർഥത്തിൽ ‘യഹ്‌വെയുടെ മുഖം/സാന്നിധ്യം മുമ്പിൽനിന്ന്’ എന്നാണ്. ‘സന്നിധിയിൽനിന്ന്’ എന്നത് ഉറവിടസ്ഥലവും ദൈവസാന്നിധ്യവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַתֹּאכַל
  choice: ദഹിപ്പിച്ചു
  rationale: אכל എന്നതിന് അടിസ്ഥാനമായി ‘തിന്നുക’ എന്നർഥമുണ്ടെങ്കിലും തീ കർത്താവാകുമ്പോൾ ‘ദഹിപ്പിച്ചു’ എന്നത് സമ്പൂർണമായ നശിപ്പിക്കൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֹתָם
  choice: അവരെ
  rationale: സമീപസന്ദർഭത്തിലെ നാദാബിനെയും അബീഹൂവിനെയും സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമമാണിത്.
- source_word: וַיָּמֻתוּ
  choice: അവർ മരിച്ചു
  rationale: מות എന്ന ക്രിയ ഇവിടെ അകർമകമായ ലളിത ആഖ്യാനഭൂതകാലത്തിലാണ്. മുൻവാക്യം മരണകാരണം വ്യക്തമാക്കുന്നതിനാൽ ‘കൊല്ലപ്പെട്ടു’ എന്ന വ്യാഖ്യാനവികാസം ചേർത്തിട്ടില്ല.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ആവർത്തിക്കുന്ന സ്ഥല-ദൈവശാസ്ത്ര പ്രയോഗം ‘സന്നിധിയിൽ’ എന്നു നൽകി എബ്രായത്തിലെ ഗൗരവമുള്ള ആവർത്തനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ വെളിപ്പെടുത്തപ്പെട്ട ഉടമ്പടിനാമം മറയ്ക്കാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: וַיָּמֻתוּ എന്നത് അകർമകഫലമായോ കാരണസൂചക കർമണിയായോ നൽകുന്നത്
  choice: അവർ മരിച്ചു
  alternative: അവർ കൊല്ലപ്പെട്ടു
  rationale: എബ്രായക്രിയ സജീവ അകർമകരൂപത്തിലാണ്; അതിനു മുമ്പുള്ള വാക്യം കാരണം ഇതിനകം നൽകുന്നു. അതിനാൽ മൂലപാഠത്തിലെ ലളിതമായ പ്രസ്താവന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ രണ്ടു ലִפְנֵי പ്രയോഗങ്ങളുടെയും ആവർത്തനം ‘സന്നിധി’ എന്ന പദത്തിലൂടെ സംരക്ഷിച്ചു; ആദ്യത്തേതിലെ מִן ഉപസർഗത്തിന്റെ ഉറവിടഭാവം ‘-യിൽനിന്ന്’ എന്നു വ്യക്തമാക്കി.
