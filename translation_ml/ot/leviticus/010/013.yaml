id: LEV.10.13
reference: Leviticus 10:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: ml
  text: നിങ്ങൾ അതു വിശുദ്ധമായ ഒരിടത്ത് ഭക്ഷിക്കണം; കാരണം, അതു നിനക്കുള്ള ഓഹരിയും നിന്റെ പുത്രന്മാർക്കുള്ള ഓഹരിയും ആകുന്നു—യഹോവയുടെ അഗ്നിയർപ്പണങ്ങളിൽനിന്നുള്ളത്[a]. ഇപ്രകാരമാണ് എനിക്കു കല്പന ലഭിച്ചിരിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയുടെ ഭക്ഷ്യയാഗങ്ങളിൽനിന്നുള്ളത്.”
    reason: אִשֶּׁה എന്ന ആരാധനാക്രമപദം സാധാരണയായി അഗ്നിയർപ്പണങ്ങളെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘ഭക്ഷ്യയാഗങ്ങൾ’ എന്ന അർഥവും സ്വീകരിക്കാവുന്നതാണ്.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: നിങ്ങൾ ഭക്ഷിക്കണം
  rationale: ക്രിയ പുരുഷലിംഗ ബഹുവചന അഭിസംബോധനയിലാണ്. മലയാളത്തിൽ ‘ഭക്ഷിക്കണം’ കല്പനയുടെ സ്വഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു; തുടക്കത്തിലെ വാവ് വേറിട്ട് ‘എന്നിട്ട്’ എന്നു ചേർക്കേണ്ട ആവശ്യമില്ല.
- source_word: אֹתָהּ
  choice: അതു
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ യാഗവിഹിതത്തെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന കർമസർവനാമമാണിത്.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: വിശുദ്ധമായ ഒരു സ്ഥലത്തുവെച്ച്
  rationale: എബ്രായത്തിൽ നിർദിഷ്ട ഉപപദമില്ലാത്തതിനാൽ ഒരു പ്രത്യേക മുറിയെയോ വിശുദ്ധസ്ഥാനത്തെയോ അനാവശ്യമായി നിർണ്ണയിക്കാതെ ‘ഒരു സ്ഥലം’ എന്നു പരിഭാഷപ്പെടുത്തി. ‘വിശുദ്ധമായ’ എന്നത് ആരാധനാക്രമപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: നിനക്കും നിന്റെ പുത്രന്മാർക്കും നിശ്ചയിച്ചിട്ടുള്ള ഓഹരി
  rationale: പുരോഹിതസന്ദർഭത്തിൽ חֹק ഒരു അമൂർത്ത നിയമത്തെക്കാൾ നിശ്ചയിച്ചുനൽകിയ വിഹിതത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ഏകവചന ‘നിനക്ക്’ അഹരോനെയും ‘പുത്രന്മാർ’ അവന്റെ പുരുഷ പുരോഹിതസന്തതിയെയും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണങ്ങളിൽനിന്ന്
  rationale: אִשֶּׁה അഗ്നിയുമായി ബന്ധപ്പെട്ട യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘അഗ്നിയർപ്പണം’ അതിനെ ദഹനയാഗം എന്ന പ്രത്യേക യാഗവിഭാഗവുമായി കലർത്താതെ സംക്ഷിപ്തമായി അറിയിക്കുന്നു; ‘ഭക്ഷ്യയാഗങ്ങൾ’ എന്ന സന്ദർഭപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: അങ്ങനെയാണ് എനിക്കു കല്പന ലഭിച്ചിരിക്കുന്നത്
  rationale: മോശയ്ക്ക് ദൈവത്തിൽനിന്ന് ലഭിച്ച കല്പനയെ സൂചിപ്പിക്കുന്ന എബ്രായ കർമണിപ്രയോഗം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും ചെയ്തു.
theological_decisions:
- issue: പുരോഹിതർക്കുള്ള חֹק എന്ന പദത്തിന്റെ അർഥം
  choice: നിശ്ചയിച്ചിട്ടുള്ള ഓഹരി
  alternative: ചട്ടം; അവകാശവിഹിതം
  rationale: ഈ സന്ദർഭം യാഗത്തിൽനിന്ന് പുരോഹിതർക്കു ലഭിക്കുന്ന നിശ്ചിത വിഹിതത്തെക്കുറിച്ചാണ്; അതിനാൽ ‘ചട്ടം’ എന്നു പറഞ്ഞാൽ വസ്തുനിഷ്ഠമായ ഓഹരി മറഞ്ഞുപോകും.
- issue: אִשֵּׁי יְהוָה എന്ന യാഗപരമായ പ്രയോഗം
  choice: യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണങ്ങൾ
  alternative: യഹോവയ്ക്കുള്ള ഭക്ഷ്യയാഗങ്ങൾ
  rationale: പദത്തിന്റെ അഗ്നിസംബന്ധമായ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; യാഗങ്ങളെ ദൈവത്തിനുള്ള ‘ഭക്ഷണം’ എന്ന ആരാധനാക്രമപരമായ വിഭാഗമായി മനസ്സിലാക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ഏകവചനവും ബഹുവചനവും കലർന്ന അഭിസംബോധന
  choice: ‘നിങ്ങൾ’ എന്ന ബഹുവചന ക്രിയയോടൊപ്പം ‘നിനക്കും നിന്റെ പുത്രന്മാർക്കും’ എന്ന ഏകവചന ഉടമസ്ഥപ്രയോഗം
  alternative: എല്ലായിടത്തും ബഹുവചനമാക്കുക
  rationale: എബ്രായപാഠം ഭക്ഷിക്കാനുള്ള നിർദേശം കൂട്ടത്തോടു ബഹുവചനത്തിൽ നൽകുമ്പോൾ ഓഹരി അഹരോനോടു വ്യക്തിപരമായി ഏകവചനത്തിൽ ബന്ധിപ്പിക്കുന്നു. ഈ വ്യത്യാസം ദൈവശാസ്ത്രപരമായി സമതലപ്പെടുത്താതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. യാഗപരമായ സാങ്കേതികത നിലനിർത്തിയെങ്കിലും അപരിചിതമായ സംസ്കൃതഭാരിത പദങ്ങൾ ഒഴിവാക്കി. എബ്രായത്തിലെ ബഹുവചന-ഏകവചന അഭിസംബോധന വ്യത്യാസം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
