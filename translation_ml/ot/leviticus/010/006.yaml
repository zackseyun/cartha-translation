revisions:
- from: 'മോശ അഹരോനോടും അവന്റെ പുത്രന്മാരായ എലെയാസാരിനോടും ഈഥാമാരിനോടും പറഞ്ഞു: “നിങ്ങളുടെ തലമുടി അഴിച്ചിടരുത്[a]; നിങ്ങളുടെ വസ്ത്രങ്ങൾ കീറുകയും അരുത്. അങ്ങനെ ചെയ്താൽ നിങ്ങൾ മരിക്കുകയും സമൂഹം മുഴുവനോടും അവൻ കോപിക്കുകയും ചെയ്യും. എന്നാൽ നിങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽഗൃഹം മുഴുവനും യഹ്‌വെ കത്തിച്ച ദഹനത്തെച്ചൊല്ലി കരയട്ടെ[b].”'
  to: 'മോശ അഹരോനോടും അവന്റെ പുത്രന്മാരായ എലെയാസാരിനോടും ഈഥാമാരിനോടും പറഞ്ഞു: “നിങ്ങളുടെ തലമുടി അഴിച്ചിടരുത്[a]; നിങ്ങളുടെ വസ്ത്രങ്ങൾ കീറരുത്. അങ്ങനെ ചെയ്താൽ നിങ്ങൾ മരിക്കും; അവൻ മുഴുവൻ സഭയോടും കോപിക്കും. എന്നാൽ നിങ്ങളുടെ സഹോദരന്മാർ, ഇസ്രായേൽഗൃഹം മുഴുവനും, യഹ്‌വെ കത്തിച്ച ദഹനത്തെച്ചൊല്ലി കരയട്ടെ[b].”'
  rationale: The revision corrects Malayalam grammar, clarifies the warning’s logical force without adding interpretation, and uses “സഭ” for the cultic-community sense of עֵדָה. It preserves the disputed head/hair nuance in the footnote, the implicit personal subject in the anger clause, and the concrete cognate expression concerning the burning.
