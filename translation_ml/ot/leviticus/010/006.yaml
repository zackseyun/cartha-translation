  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֣ה אֶֽל אַהֲרֹ֡ן וּ/לְ/אֶלְעָזָר֩ וּ/לְ/אִֽיתָמָ֨ר בָּנָ֜י/ו רָֽאשֵׁי/כֶ֥ם אַל תִּפְרָ֣עוּ וּ/בִגְדֵי/כֶ֤ם לֹֽא תִפְרֹ֨מוּ֙ וְ/לֹ֣א תָמֻ֔תוּ וְ/עַ֥ל כָּל הָ/עֵדָ֖ה יִקְצֹ֑ף וַ/אֲחֵי/כֶם֙ כָּל בֵּ֣ית יִשְׂרָאֵ֔ל יִבְכּוּ֙ אֶת הַ/שְּׂרֵפָ֔ה אֲשֶׁ֖ר שָׂרַ֥ף יְהוָֽה־׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: ml
  text: 'മോശ അഹരോനോടും അവന്റെ പുത്രന്മാരായ എലെയാസാരിനോടും ഈഥാമാരിനോടും പറഞ്ഞു: “നിങ്ങളുടെ തലമുടി അഴിച്ചിടരുത്[a]; നിങ്ങളുടെ വസ്ത്രങ്ങൾ കീറരുത്. അങ്ങനെ ചെയ്താൽ നിങ്ങൾ മരിക്കും; അവൻ മുഴുവൻ സഭയോടും കോപിക്കും. എന്നാൽ നിങ്ങളുടെ സഹോദരന്മാർ, ഇസ്രായേൽഗൃഹം മുഴുവനും, യഹ്‌വെ കത്തിച്ച ദഹനത്തെച്ചൊല്ലി കരയട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തല മൂടാതെ ഇരിക്കരുത്” എന്നും “തലമുടി അലങ്കോലമായി വിടരുത്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം തല അല്ലെങ്കിൽ തലമുടിയുമായി ബന്ധപ്പെട്ട ഒരു ശോകാചരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “യഹ്‌വെ കത്തിച്ച ദഹനം.” ഒരേ ധാതുവിൽനിന്നുള്ള പദങ്ങൾ ആവർത്തിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: നിങ്ങളുടെ തലമുടി അഴിച്ചിടരുത്
  rationale: פרע ഇവിടെ ശോകാചരണത്തിന്റെ ഭാഗമായി തലമുടി അഴിച്ചിട്ട് അലങ്കോലമായി വിടുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ തലമുടിയെ വ്യക്തമാക്കുന്നത് ഉദ്ദേശിച്ച ആചാരം സ്വാഭാവികമായി അറിയിക്കുന്നു; ശിരോവസ്ത്രം നീക്കുക എന്ന വിവാദ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കുന്നില്ല.
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: നിങ്ങളുടെ വസ്ത്രങ്ങൾ കീറുകയും അരുത്
  rationale: פרם ശോകത്തിന്റെ അടയാളമായി വസ്ത്രം കീറുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ ദൃശ്യവും ആചാരപരമായ ശക്തിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְלֹא תָמֻתוּ וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: അങ്ങനെ ചെയ്താൽ നിങ്ങൾ മരിക്കുകയും സമൂഹം മുഴുവനോടും അവൻ കോപിക്കുകയും ചെയ്യും
  rationale: വിലക്കുകൾ ലംഘിച്ചാലുണ്ടാകുന്ന ഫലം മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു. יִקְצֹף എന്ന ഏകവചന ക്രിയയുടെ പരോക്ഷ കർത്താവിനെ ‘അവൻ’ എന്നു നിലനിർത്തി, മുഖ്യപാഠത്തിൽ ദൈവനാമം അധികമായി ചേർക്കുന്നില്ല.
- source_word: וַאֲחֵיכֶם כָּל בֵּית יִשְׂרָאֵל
  choice: നിങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽഗൃഹം മുഴുവനും
  rationale: ‘നിങ്ങളുടെ സഹോദരന്മാർ’ എന്ന പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുകയും, തുടർന്നുള്ള സമാനാധികരണപ്രയോഗം അതിന്റെ ദേശീയ-സാമൂഹിക വ്യാപ്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה אֲשֶׁר שָׂרַף
  choice: കത്തിച്ച ദഹനത്തെച്ചൊല്ലി കരയട്ടെ
  rationale: ദൈവിക അഗ്നിയാൽ ഉണ്ടായ ദഹനമെന്ന മൂർത്തമായ ചിത്രം നിലനിർത്തുന്നു; ‘ദുരന്തം’ അല്ലെങ്കിൽ ‘ന്യായവിധി’ എന്ന വ്യാഖ്യാനപദങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘Yahweh’ എന്ന രൂപത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יִקְצֹף എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: അവൻ കോപിക്കുകയും ചെയ്യും
  alternative: സമൂഹം മുഴുവൻമേൽ കോപം വരും
  rationale: എബ്രായത്തിൽ കർത്താവ് തുറന്നുപറഞ്ഞിട്ടില്ലെങ്കിലും ക്രിയ ഏകവചനത്തിലാണ്; വ്യക്തിപരമായ ദൈവിക പ്രവർത്തനം നിലനിർത്തിക്കൊണ്ട് ആ പരോക്ഷതയും സംരക്ഷിക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘Yahweh’ എന്ന ശാസ്ത്രീയ പുനർനിർമാണത്തോട് അടുത്ത മലയാളരൂപമാണിത്.
- issue: പുരോഹിതന്മാർക്ക് ശോകാചരണവിലക്ക്
  choice: തലമുടി അഴിച്ചിടുന്നതും വസ്ത്രം കീറുന്നതും വിലക്കുന്നു
  alternative: തല മൂടാതിരിക്കുന്നതും വസ്ത്രം കീറുന്നതും വിലക്കുന്നു
  rationale: പ്രസംഗസന്ദർഭത്തിലെ ശോകാചരണസൂചന നിലനിർത്തുന്നു; എന്നാൽ തല/മുടിയുമായി ബന്ധപ്പെട്ട ആദ്യ ആചാരത്തിന്റെ കൃത്യരൂപത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘എലെയാസാർ’, ‘ഈഥാമാർ’, ‘ഇസ്രായേൽഗൃഹം’ എന്നീ രൂപങ്ങൾ ബൈബിൾപരമായ തിരിച്ചറിയൽ നിലനിർത്തുന്നു. മൂലത്തിലെ ആവർത്തനവും മുന്നറിയിപ്പിന്റെ കാഠിന്യവും പരമാവധി സംരക്ഷിച്ചിരിക്കുന്നു.
