source:
  edition: WLC
  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: ml
  text: 'നീക്കിവെച്ച വഴിപാടിന്റെ തുട[a][b]യും വീശിക്കാണിക്കുന്ന വഴിപാടിന്റെ നെഞ്ചുഭാഗവും[c], കൊഴുപ്പുഭാഗങ്ങളുടെ അഗ്നിയാഗങ്ങളോടൊപ്പം, യഹ്‌വേയുടെ[d] സന്നിധിയിൽ വീശിക്കാണിക്കുന്ന വഴിപാടായി അർപ്പിക്കാൻ അവർ കൊണ്ടുവരണം. യഹ്‌വേ കല്പിച്ചതുപോലെ, ശാശ്വതമായ ഒരു ചട്ടപ്രകാരം അത് നിനക്കും നിന്നോടൊപ്പമുള്ള നിന്റെ പുത്രന്മാർക്കും അവകാശമായിരിക്കും.


    [a] “തുട” എന്നതിന് “കാൽഭാഗം” എന്നും പരിഭാഷപ്പെടുത്താം.


    [b] “നീക്കിവെച്ച വഴിപാട്” എന്നത് ദൈവത്തിനായി വേർതിരിച്ച സമർപ്പിതഭാഗത്തെ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായി “ഉയർത്തുന്ന വഴിപാട്” എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.


    [c] “വീശിക്കാണിക്കുന്ന വഴിപാട്” യഹ്‌വേയുടെ സന്നിധിയിൽ ആചാരപരമായി അവതരിപ്പിക്കുന്ന വഴിപാടാണ്; “സമർപ്പണവഴിപാട്” എന്നും പരിഭാഷപ്പെടുത്താം.


    [d] “യഹ്‌വേ” എന്നത് എബ്രായത്തിലെ ദൈവനാമമായ יהוה (YHWH) ആണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തുട” എന്നതിന് “കാൽഭാഗം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “നീക്കിവെച്ച വഴിപാട്” എന്നത് ദൈവത്തിനായി വേർതിരിച്ച സമർപ്പിതഭാഗത്തെ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായി “ഉയർത്തുന്ന വഴിപാട്” എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: “വീശിക്കാണിക്കുന്ന വഴിപാട്” യഹ്‌വേയുടെ സന്നിധിയിൽ ആചാരപരമായി അവതരിപ്പിക്കുന്ന വഴിപാടാണ്; “സമർപ്പണവഴിപാട്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: cultural_note
  - marker: d
    text: “യഹ്‌വേ” എന്നത് എബ്രായത്തിലെ ദൈവനാമമായ יהוה (YHWH) ആണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: തുട
  rationale: യാഗമൃഗത്തിന്റെ പിൻകാലിലെ മുകളിലെ മാംസഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം; ‘കാൽഭാഗം’ എന്ന വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תְּרוּמָה
  choice: നീക്കിവെച്ച വഴിപാട്
  rationale: ദൈവത്തിനായി വേർതിരിച്ച് സമർപ്പിക്കുന്ന ഭാഗം എന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പഴയ ആചാരസാങ്കേതിക പദപ്രയോഗം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: חָזֶה
  choice: നെഞ്ച്
  rationale: യാഗസന്ദർഭത്തിലെ മൃഗത്തിന്റെ നെഞ്ചുഭാഗത്തിന് വ്യക്തവും സാധാരണവുമായ മലയാളപദം.
- source_word: תְּנוּפָה / לְהָנִיף תְּנוּפָה
  choice: വീശിക്കാണിക്കുന്ന വഴിപാട് / വീശിക്കാണിക്കുന്ന വഴിപാടായി അർപ്പിക്കുക
  rationale: നാമത്തിന്റെയും അതേ ധാതുവിൽനിന്നുള്ള ക്രിയയുടെയും ബന്ധം നിലനിർത്തുകയും യഹ്‌വേയുടെ സന്നിധിയിലെ ആചാരപരമായ അവതരണം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: കൊഴുപ്പുള്ള ഭാഗങ്ങളുടെ ദഹനാർപ്പണങ്ങളോടൊപ്പം
  rationale: עַל ഇവിടെ അനുബന്ധത സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു; אִשִּׁים തീയിൽ അർപ്പിക്കുന്ന യാഗഭാഗങ്ങളെയും הַחֲלָבִים നിർദിഷ്ട കൊഴുപ്പുഭാഗങ്ങളെയും സൂചിപ്പിക്കുന്നു.
- source_word: יָבִיאוּ
  choice: അവർ കൊണ്ടുവരണം
  rationale: നിയമനിർദേശസന്ദർഭത്തിലെ നിർബന്ധാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: ആരാധനാസന്ദർഭത്തിലെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהָיָה לְךָ וּלְבָנֶיךָ אִתְּךָ
  choice: അത് നിനക്കും നിന്നോടൊപ്പമുള്ള നിന്റെ പുത്രന്മാർക്കും ... ആയിരിക്കണം
  rationale: പുരോഹിതഭാഗത്തിന്മേലുള്ള അഹരോന്റെയും അവന്റെ പുത്രന്മാരുടെയും അവകാശം സൂചിപ്പിക്കുന്ന എബ്രായഘടന അടുത്തായി നിലനിർത്തുന്നു.
- source_word: לְחָק עוֹלָם
  choice: ശാശ്വതമായ ഒരു ചട്ടം
  rationale: חק എന്നത് നിശ്ചിത നിയമമോ ചട്ടമോ എന്നും עולם അതിന്റെ തുടർച്ചയായ സാധുതയും സൂചിപ്പിക്കുന്നു; ‘ശാശ്വതമായ’ എന്നത് കാലപരിധിയെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: യഹ്‌വേ കല്പിച്ചതുപോലെ
  rationale: ദൈവകല്പനയോടുള്ള കൃത്യമായ അനുസരണത്തിന്റെ താരതമ്യബലം ചുരുക്കവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം മറച്ചുവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ഇതിന്റെ സ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: תְּנוּפָה എന്ന യാഗസാങ്കേതിക പദം
  choice: വീശിക്കാണിക്കുന്ന വഴിപാട്
  alternative: സമർപ്പണവഴിപാട്
  rationale: വഴിപാടിന്റെ ആചാരപരമായ ചലനത്തെയും അനുബന്ധ ക്രിയയുമായുള്ള പദബന്ധത്തെയും സംരക്ഷിക്കുന്നു; പൊതുവായ പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: לְחָק עוֹלָם എന്ന കാലവ്യാപ്തിയുള്ള നിയമവാക്യം
  choice: ശാശ്വതമായ ഒരു ചട്ടം
  alternative: സ്ഥിരമായ ഒരു അവകാശം
  rationale: നിയമപരമായ חק എന്ന പദവും עולם എന്നതിലെ തുറന്ന കാലവ്യാപ്തിയും നിലനിർത്തുന്നു; അതിന്റെ പ്രാബല്യപരിധി വാചകത്തിന് പുറത്തുള്ള ദൈവശാസ്ത്രധാരണകൊണ്ട് പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. യാഗസാങ്കേതിക പദങ്ങൾ അനാവശ്യമായി പുരാതനമാക്കാതെ, മൂലത്തിലെ നാമ-ക്രിയബന്ധവും നിയമഭാവവും സംരക്ഷിച്ചിട്ടുണ്ട്.
