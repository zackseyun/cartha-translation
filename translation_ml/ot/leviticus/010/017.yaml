  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: ml
  text: “നിങ്ങൾ പാപയാഗം[a] വിശുദ്ധസ്ഥലത്തുവെച്ച് ഭക്ഷിക്കാതിരുന്നത് എന്തുകൊണ്ട്? അത് അതിവിശുദ്ധമാണ്. സഭയുടെ അകൃത്യം വഹിക്കാനും യഹോവയുടെ സന്നിധിയിൽ അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കാനുമായി അവൻ അത് നിങ്ങൾക്കു തന്നിരിക്കുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശുദ്ധീകരണയാഗം.” എബ്രായപദം പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയും അശുദ്ധി നീക്കുന്നതിനുള്ള യാഗത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: നിങ്ങൾ ... ഭക്ഷിക്കാതിരുന്നത് എന്തുകൊണ്ട്?
  rationale: ശാസനയുടെ സന്ദർഭത്തിലുള്ള കാരണചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַחַטָּאת
  choice: പാപയാഗം
  rationale: ഇവിടെ പദം യാഗമൃഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പരിചിതമായ യാഗസാങ്കേതികപദം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, ശുദ്ധീകരണപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലത്തുവെച്ച്
  rationale: പുരോഹിതർ യാഗഭാഗം ഭക്ഷിക്കേണ്ടതായി നിശ്ചയിക്കപ്പെട്ട വിശുദ്ധ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധം
  rationale: എബ്രായത്തിലെ അതിശയോക്തിപരമായ വിശുദ്ധതാ നിർമാണം മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְאֹתָהּ נָתַן לָכֶם
  choice: അവൻ അത് നിങ്ങൾക്കു തന്നിരിക്കുന്നു
  rationale: വ്യക്തമായി പറയാത്ത മൂന്നാംപുരുഷ ഏകവചന കർത്താവിനെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לָשֵׂאת אֶת עֲוֹן הָעֵדָה
  choice: സഭയുടെ അകൃത്യം വഹിക്കാൻ
  rationale: נשא עון എന്ന പ്രയോഗത്തിലെ പ്രതിനിധിത്വപരവും ആചാരപരവുമായ ഭാരം അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കാൻ
  rationale: യാഗസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും ദൈവശാസ്ത്രപരമായി മിതവുമായ പ്രയോഗം.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുകയും לפני എന്നതിന്റെ സാന്നിധ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: חַטָּאת എന്ന യാഗപദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: യാഗാർപ്പണം എന്ന അർഥം സന്ദർഭത്തിൽ ഉറപ്പാണ്; എന്നാൽ പദത്തിൽ പാപപരിഹാരത്തിനൊപ്പം ശുദ്ധീകരണത്തിന്റെ ആശയവും ഉൾപ്പെടാവുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: נָתַן എന്ന ക്രിയയുടെ പരാമർശിക്കാത്ത കർത്താവ്
  choice: ‘അവൻ’ എന്നു നിലനിർത്തി
  alternative: ‘അത് നിങ്ങൾക്കു നൽകപ്പെട്ടിരിക്കുന്നു’ എന്ന കർമണിപ്രയോഗം
  rationale: എബ്രായത്തിലെ മൂന്നാംപുരുഷ ഏകവചന ക്രിയയെ സംരക്ഷിക്കുന്നു; സന്ദർഭം കർത്താവായി ദൈവത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മുഖ്യവാചകത്തിൽ വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: עֲוֹן എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: അകൃത്യം
  alternative: കുറ്റം
  rationale: പാപകരമായ പ്രവൃത്തിയും അതോടു ബന്ധപ്പെട്ട കുറ്റഭാരവും ഉൾക്കൊള്ളാവുന്ന എബ്രായ പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പൂർണമായി ഒതുക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യവുമായ മലയാളം. യാഗസാങ്കേതികപദങ്ങൾ വ്യക്തമായി നിലനിർത്തി; വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചു.
