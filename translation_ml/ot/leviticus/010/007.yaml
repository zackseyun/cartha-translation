id: LEV.10.7
reference: Leviticus 10:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ פֶּן תָּמֻ֔תוּ כִּי שֶׁ֛מֶן מִשְׁחַ֥ת יְהוָ֖ה עֲלֵי/כֶ֑ם וַֽ/יַּעֲשׂ֖וּ כִּ/דְבַ֥ר מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: ml
  text: നിങ്ങൾ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽനിന്ന് പുറത്തുപോകരുത്; അല്ലെങ്കിൽ നിങ്ങൾ മരിക്കും; കാരണം യാഹ്‌വേയുടെ അഭിഷേകതൈലം നിങ്ങളുടെമേൽ ഉണ്ട്.” അവർ മോശയുടെ വചനപ്രകാരം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: പ്രവേശനകവാടത്തിൽനിന്ന്
  rationale: פֶּתַח എന്നത് ഇവിടെ കൂടാരത്തിലേക്കുള്ള പ്രവേശനസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പ്രവേശനകവാടം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്; തുടക്കത്തിലെ וְ മലയാളത്തിൽ നിർബന്ധമായി വേറിട്ട സംയോജകപദമായി പ്രകടിപ്പിക്കാതെ വാക്യബന്ധത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ വിശുദ്ധകൂടാരത്തിനുള്ള സ്ഥിരവും പരിചിതവുമായ മലയാള പദപ്രയോഗമാണിത്; ദൈവവും ജനവും കൂടിവരുന്ന സ്ഥലമെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: לֹא תֵצְאוּ
  choice: പുറത്തുപോകരുത്
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണക്രിയ ഇവിടെ നേരിട്ടുള്ള വിലക്കാണ്. ആജ്ഞയുടെ ശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פֶּן תָּמֻתוּ
  choice: നിങ്ങൾ മരിക്കാതിരിക്കേണ്ടതിന്
  rationale: פֶּן മുന്നറിയിപ്പായ അനിഷ്ടഫലത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ രൂപം ‘മരിച്ചുപോകാതിരിക്കാനായി’ എന്ന ഗൗരവമുള്ള മുന്നറിയിപ്പ് നിലനിർത്തുന്നു; ‘അല്ലെങ്കിൽ നിങ്ങൾ മരിക്കും’ എന്നതും സാധ്യമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: വിലക്കിന്റെ കാരണം പരിചയപ്പെടുത്തുന്ന കാര്യകാരണബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: യഹോവയുടെ അഭിഷേകതൈലം
  rationale: യഹോവയോടു ബന്ധപ്പെട്ടതും പുരോഹിതപ്രതിഷ്ഠയ്ക്കായി ഉപയോഗിച്ചതുമായ വിശുദ്ധതൈലത്തെ സംക്ഷിപ്തമായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: עֲלֵיכֶם
  choice: നിങ്ങളുടെമേൽ ഉണ്ട്
  rationale: അഭിഷേകതൈലം അവരുടെമേൽ ഇരിക്കുന്നു എന്ന എബ്രായപ്രയോഗം നേരിട്ട് നിലനിർത്തുകയും അവരുടെ പ്രതിഷ്ഠിതസ്ഥിതി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּעֲשׂוּ
  choice: അവർ ... ചെയ്തു
  rationale: വിവരണത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ക്രിയയെ ലളിതമായ ഭൂതകാലത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּדְבַר מֹשֶׁה
  choice: മോശയുടെ വചനപ്രകാരം
  rationale: മോശ പറഞ്ഞ നിർദേശത്തിന് അനുസൃതമായി പ്രവർത്തിച്ചു എന്ന അർഥം ഔപചാരികതയും വായനാസൗകര്യവും ചേർത്ത് നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയായി മാറ്റാതെ സംരക്ഷിക്കുന്നു. ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്കിടയിൽ ‘യഹോവ’ കൂടുതൽ പരിചിതമായ ലിപ്യന്തരണമാണ്; ‘യാഹ്‌വേ’ ഉച്ചാരണപരമായി സാധ്യമായ മറ്റൊരു രൂപമാണ്.
- issue: അഭിഷേകതൈലം ‘മേൽ’ ഇരിക്കുന്നതിന്റെ അർഥം
  choice: ഭൗതിക അഭിഷേകവും അതിലൂടെ സൂചിപ്പിക്കപ്പെടുന്ന പുരോഹിതപ്രതിഷ്ഠയും ഒരുമിച്ച് തുറന്നുവയ്ക്കുന്നു
  alternative: ‘നിങ്ങൾ യഹോവയ്ക്കു പ്രതിഷ്ഠിക്കപ്പെട്ടവർ ആകുന്നു’ എന്ന് വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: עֲלֵיכֶם എന്ന മൂലരൂപകം നേരിട്ട് നിലനിർത്തുന്നത് ഭൗതിക തൈലത്തെയും പ്രതിഷ്ഠിത പദവിയെയും വേർതിരിക്കാതെ സൂക്ഷിക്കുന്നു; വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമ-ആഖ്യാന ശൈലി. പരിചിതമായ ആരാധനാപദങ്ങളായ ‘സമാഗമകൂടാരം’, ‘അഭിഷേകതൈലം’, ‘വചനം’ എന്നിവ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന ലളിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാക്കി. ഉദ്ധരണിയുടെ അവസാനവും തുടർന്നുള്ള ആഖ്യാനവാക്യവും വ്യക്തമായി വേർതിരിച്ചിട്ടുണ്ട്.
