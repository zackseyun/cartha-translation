  to: 'പിന്നെ മോശെ അഹരോന്റെ പിതൃസഹോദരനായ ഉസ്സീയേലിന്റെ പുത്രന്മാരായ മിശായേലിനെയും എൽസാഫാനെയും വിളിച്ച് അവരോട് പറഞ്ഞു: “അടുത്തുവരുവിൻ; നിങ്ങളുടെ സഹോദരന്മാരെ[a] വിശുദ്ധസ്ഥാനത്തിന്റെ മുമ്പിൽനിന്ന്[b] പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോകുവിൻ.”'
