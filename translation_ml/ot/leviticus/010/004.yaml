reference: Leviticus 10:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל מִֽישָׁאֵל֙ וְ/אֶ֣ל אֶלְצָפָ֔ן בְּנֵ֥י עֻזִּיאֵ֖ל דֹּ֣ד אַהֲרֹ֑ן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם קִ֠רְב֞וּ שְׂא֤וּ אֶת אֲחֵי/כֶם֙ מֵ/אֵ֣ת פְּנֵי הַ/קֹּ֔דֶשׁ אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: ml
  text: 'പിന്നെ മോശെ അഹരോന്റെ പിതൃസഹോദരനായ ഉസ്സീയേലിന്റെ പുത്രന്മാരായ മിശായേലിനെയും എൽസാഫാനെയും വിളിച്ച് അവരോട് പറഞ്ഞു: “അടുത്തുവരുവിൻ; നിങ്ങളുടെ സഹോദരന്മാരെ[a] വിശുദ്ധസ്ഥാനത്തിന്റെ മുമ്പിൽനിന്ന്[b] പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോകുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാർ’ എന്ന ഹീബ്രു പദം അടുത്ത പുരുഷബന്ധുക്കളെയും സൂചിപ്പിക്കാം; ഇവിടെ അത് നാദാബിനെയും അബീഹൂവിനെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിശുദ്ധസ്ഥാനത്തിന്റെ സന്നിധിയിൽനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ച്
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ קרא ഒരാളെ വിളിക്കുക അഥവാ അടുത്തേക്കു വരാൻ ആഹ്വാനം ചെയ്യുക എന്നർഥം നൽകുന്നു; ‘വിളിച്ച്’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: בְּנֵי עֻזִּיאֵל
  choice: ഉസ്സീയേലിന്റെ പുത്രന്മാരായ
  rationale: നിർമാണബന്ധത്തിലുള്ള ഈ പദസമുച്ചയം മിശായേലിനെയും എൽസാഫാനെയും ഉസ്സീയേലിന്റെ നേരിട്ടുള്ള പുത്രന്മാരായി തിരിച്ചറിയുന്നു; ‘വംശജർ’ എന്നു പറയുന്നത് അനാവശ്യമായി വിശാലമാണ്.
- source_word: דֹּד אַהֲרֹן
  choice: അഹരോന്റെ പിതൃസഹോദരനായ
  rationale: דּוֹד ഇവിടെ ‘അമ്മാവൻ’ എന്ന പൊതുവായ മലയാളപ്രയോഗത്തേക്കാൾ കൃത്യമായി അഹരോന്റെ പിതാവിന്റെ സഹോദരനെ സൂചിപ്പിക്കുന്നു. ഉസ്സീയേലുമായുള്ള സമാനാധികരണബന്ധവും പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നു.
- source_word: קִרְבוּ
  choice: അടുത്തുവരുവിൻ
  rationale: קרב എന്ന ആജ്ഞാരൂപത്തിന്റെ സ്ഥലപരമായ ‘അടുത്തേക്കു വരുക’ എന്ന അർഥം ഇതു നിലനിർത്തുന്നു; വിശുദ്ധസ്ഥാനത്തോടു ബന്ധപ്പെട്ട ഗൗരവമുള്ള സന്ദർഭത്തിനും യോജിക്കുന്നു.
- source_word: שְׂאוּ
  choice: കൊണ്ടുപോകുവിൻ
  rationale: נשא എന്ന ക്രിയയ്ക്ക് ‘എടുക്കുക, ചുമക്കുക, വഹിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ മൃതദേഹങ്ങൾ അവിടെനിന്നു മാറ്റുന്നതാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ കർമവും ലക്ഷ്യസ്ഥാനവും ചേർന്നപ്പോൾ ‘കൊണ്ടുപോകുവിൻ’ ഈ പ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֲחֵיכֶם
  choice: നിങ്ങളുടെ സഹോദരന്മാരെ
  rationale: אָח എന്ന പദം നേരിട്ടുള്ള സഹോദരന്മാരെ മാത്രമല്ല അടുത്ത പുരുഷബന്ധുക്കളെയും സൂചിപ്പിക്കാം. ഇവിടെ നാദാബും അബീഹൂവും അവരുടെ പിതൃസഹോദരപുത്രന്മാരാണെങ്കിലും, മൂലപാഠത്തിലെ ബന്ധപദം നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥാനത്തിന്റെ മുമ്പിൽനിന്ന്
  rationale: פְּנֵי എന്നതിന്റെ ‘മുഖം/മുമ്പിൽ/സന്നിധി’ എന്ന സ്ഥലപരമായ ഭാവം ‘മുമ്പിൽനിന്ന്’ നേരിട്ട് നിലനിർത്തുന്നു. הַקֹּדֶשׁ ഇവിടെ അമൂർത്തമായ വിശുദ്ധിയെയല്ല, വിശുദ്ധമായ സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തേക്ക്
  rationale: אֶל നൽകുന്ന ദിശാബോധവും מִחוּץ നൽകുന്ന പുറംസ്ഥലബോധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: אֲחֵיכֶם എന്ന ബന്ധപദത്തിന്റെ പരിധി
  choice: ‘നിങ്ങളുടെ സഹോദരന്മാർ’ എന്ന മൂലപാഠസമീപമായ പ്രയോഗം നിലനിർത്തി ബന്ധത്തിന്റെ വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘നിങ്ങളുടെ ബന്ധുക്കൾ’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ പിതൃസഹോദരപുത്രന്മാർ’
  rationale: പ്രത്യാമ്നായങ്ങൾ ചരിത്രബന്ധം വ്യക്തമാക്കുമെങ്കിലും ഹീബ്രു പദത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ കുടുംബസാമീപ്യവും വിശാലമായ അർഥപരിധിയും ചുരുക്കും. അതിനാൽ പാഠത്തിൽ പദരൂപം സംരക്ഷിച്ച് അടിക്കുറിപ്പിൽ വ്യക്തത നൽകി.
- issue: הַקֹּדֶשׁ എന്നതിന്റെ സ്ഥലസൂചന
  choice: വിശുദ്ധസ്ഥാനം
  alternative: വിശുദ്ധമന്ദിരം
  rationale: ഇവിടെ നിർദ്ദിഷ്ടമായ മന്ദിരഘടകത്തെക്കാൾ വിശുദ്ധപരിസരത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ ‘വിശുദ്ധസ്ഥാനം’ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ദൈവാലയസന്ദർഭത്തിന് യോജിച്ച ‘വിശുദ്ധസ്ഥാനം’, ബഹുവചന ആജ്ഞയ്ക്ക് ‘-വിൻ’ രൂപം, പാളയത്തിലേക്കുള്ള ദിശ വ്യക്തമാക്കുന്ന ‘പുറത്തേക്ക്’ എന്നിവ തിരഞ്ഞെടുത്തു. ബന്ധപദത്തിലും വിശുദ്ധസ്ഥാനത്തിന്റെ സ്ഥാനസൂചനയിലും മൂലപാഠത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
