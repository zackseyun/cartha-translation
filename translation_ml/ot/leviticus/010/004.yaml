  source_fidelity: 'മുഖ്യപാഠം ഹീബ്രു മൂലത്തോട് വിശ്വസ്തമാണ്: ഉസ്സീയേൽ അഹരോന്റെ പിതൃസഹോദരനാണെന്ന വംശബന്ധം, സമീപിക്കാനുള്ള ആജ്ഞ, വിശുദ്ധസ്ഥാനത്തിന്റെ മുമ്പിൽനിന്നുള്ള നീക്കം, പാളയത്തിനു പുറത്തേക്കുള്ള ദിശ എന്നിവ യഥാവിധി പ്രതിഫലിക്കുന്നു. എന്നാൽ അടിക്കുറിപ്പ് a നാദാബ്-അബീഹൂവിനെ മിശായേൽ-എൽസാഫാന്റെ ‘പിതൃസഹോദരപുത്രന്മാർ’ എന്നു വിശേഷിപ്പിക്കുന്നത് വംശബന്ധത്തെ തെറ്റായി വിവരിക്കുന്നു.'
