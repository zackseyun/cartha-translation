  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הַ/קֹּ֖דֶשׁ וּ/בֵ֣ין הַ/חֹ֑ל וּ/בֵ֥ין הַ/טָּמֵ֖א וּ/בֵ֥ין הַ/טָּהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/010.yaml
  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
translation:
  language: ml
  text: വിശുദ്ധമായതും സാധാരണമായതും തമ്മിലും[a] ആചാരപരമായി അശുദ്ധമായതും ആചാരപരമായി ശുദ്ധമായതും തമ്മിലും[b] വേർതിരിച്ചറിയേണ്ടതിനും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധമായതും വിശുദ്ധമല്ലാത്തതും.’ എബ്രായപദം വിശുദ്ധമായി വേർതിരിക്കപ്പെട്ടതും അങ്ങനെ വേർതിരിക്കപ്പെടാത്തതും തമ്മിലുള്ള വ്യത്യാസമാണ് സൂചിപ്പിക്കുന്നത്; ദൈവനിന്ദയെയോ ധാർമ്മിക ദുഷ്ടതയെയോ അത് നിർബന്ധമായി അർഥമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ആചാരപരമായി അശുദ്ധമായതും ആചാരപരമായി ശുദ്ധമായതും.
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: വേർതിരിച്ചറിയേണ്ടതിനും
  rationale: ലക്ഷ്യം സൂചിപ്പിക്കുന്ന ക്രിയാരൂപവും മുൻവാക്യത്തോടുള്ള തുടർച്ചയും നിലനിർത്തുന്നു. വെറും ഭൗതിക വേർതിരിക്കൽ എന്നതിലുപരി വിഭാഗങ്ങൾ തിരിച്ചറിയുക എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: בֵּין
  choice: തമ്മിൽ
  rationale: ആവർത്തിച്ചുവരുന്ന രണ്ട് ജോടി വിഭാഗങ്ങൾക്കിടയിലെ വ്യത്യാസം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: הַקֹּדֶשׁ
  choice: വിശുദ്ധമായത്
  rationale: ഒരു പ്രത്യേക വസ്തുവിനെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ, വിശുദ്ധമായി വേർതിരിക്കപ്പെട്ടവയുടെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: הַחֹל
  choice: സാധാരണമായത്
  rationale: തിന്മയെയോ ദൈവനിന്ദയെയോ നിർബന്ധമായി സൂചിപ്പിക്കാതെ, വിശുദ്ധമായി വേർതിരിക്കപ്പെടാത്ത സാധാരണ വിഭാഗം എന്ന പുരോഹിതനിയമപരമായ അർഥം നൽകുന്നു.
- source_word: הַטָּמֵא
  choice: ആചാരപരമായി അശുദ്ധമായത്
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരശുദ്ധിയുടെ വിഭാഗമാണെന്ന് വ്യക്തമാക്കുകയും അതിനെ ധാർമ്മിക കുറ്റവുമായി തുല്യമാക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: הַטָּהוֹר
  choice: ശുദ്ധമായത്
  rationale: അശുദ്ധമായത് എന്നതിന്റെ സ്വാഭാവിക പ്രതിപദമായി നിന്ന്, പുരോഹിതനിയമത്തിലെ ആചാരശുദ്ധിയുടെ വിഭാഗത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: קֹדֶשׁ എന്നതും חֹל എന്നതും തമ്മിലുള്ള പുരോഹിതനിയമപരമായ വ്യത്യാസം
  choice: വിശുദ്ധമായതും സാധാരണമായതും
  alternative: വിശുദ്ധമായതും അപവിത്രമായതും
  rationale: חֹל ഇവിടെ വിശുദ്ധമായി വേർതിരിക്കപ്പെടാത്തതിനെ സൂചിപ്പിക്കുന്നു; അത് നിർബന്ധമായി ദൈവനിന്ദാപരമോ ദുഷിച്ചതോ അല്ല. ‘അപവിത്രമായത്’ എന്ന പദം അത്തരം ശക്തമായ ധാർമ്മിക ഭാവം നൽകാനും തുടർന്നുള്ള ‘അശുദ്ധമായത്’ എന്ന വിഭാഗവുമായി കലരാനും ഇടയുണ്ട്.
- issue: טָמֵא / טָהוֹר എന്നീ വിഭാഗങ്ങളുടെ സ്വഭാവം
  choice: ആചാരപരമായി അശുദ്ധമായത് / ശുദ്ധമായത്
  alternative: അശുദ്ധമായത് / ശുദ്ധമായത്
  rationale: ലേവ്യപുസ്തകത്തിന്റെ സന്ദർഭത്തിൽ ഇവ പ്രധാനമായും ആചാരപരമായ നിലകളാണ്. ‘ആചാരപരമായി’ എന്നു ചേർക്കുന്നത് എല്ലാ അശുദ്ധതയും ധാർമ്മിക കുറ്റമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു; രണ്ടാമത്തെ പദത്തിലും അതേ പരിധി സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ളതും അതേസമയം പുരോഹിതനിയമപരമായ ഗൗരവം നിലനിർത്തുന്നതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ ‘വേർതിരിച്ചറിയേണ്ടതിനും’ എന്ന ലക്ഷ്യസൂചക രൂപവും അവസാനത്തെ കോമയും നിലനിർത്തി.
