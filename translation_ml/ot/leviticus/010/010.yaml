  terminology: ‘വിശുദ്ധമായത് / സാധാരണമായത്’ preserves the holy/common distinction without conflating commonness with impurity. ‘ആചാരപരമായി അശുദ്ധമായത് / ആചാരപരമായി ശുദ്ധമായത്’ appropriately signals ritual categories.
