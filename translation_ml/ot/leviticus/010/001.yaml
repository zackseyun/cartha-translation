base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: ml
  text: പിന്നെ അഹരോന്റെ പുത്രന്മാരായ നാദാബും അബീഹൂവും അവരവരുടെ തീച്ചട്ടി എടുത്ത്, അതിൽ തീ ഇട്ട്, അതിന്മേൽ ധൂപം വെച്ച്, യഹ്‌വെ അവർക്കു കൽപ്പിച്ചിട്ടില്ലാത്ത അനധികൃതമായ തീ[a] യഹ്‌വെയുടെ സന്നിധിയിൽ അർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അന്യമായ തീ” അല്ലെങ്കിൽ “വിദേശമായ തീ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പ്രയോഗം, തുടർന്നുള്ള വാക്യം വ്യക്തമാക്കുന്നതുപോലെ, യഹ്‌വെ അനുവദിക്കാത്ത തീയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: എടുത്ത്
  rationale: לקח എന്ന സാധാരണ ആഖ്യാനക്രിയയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാരായ
  rationale: ഹീബ്രു സംയുക്തപദത്തിന്റെ കുടുംബബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു; പേരുകളുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: נָדָב וַאֲבִיהוּא
  choice: നാദാബും അബീഹൂവും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: אִישׁ מַחְתָּתוֹ
  choice: അവരവരുടെ തീച്ചട്ടി
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥമായ ‘ഓരോരുത്തൻ/അവരവർ’ നിലനിർത്തുന്നു; מַחְתָּה കനലോ തീയോ വഹിക്കുന്ന പാത്രമായതിനാൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ‘തീച്ചട്ടി’ തിരഞ്ഞെടുത്തു.
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: അതിൽ തീ ഇട്ട്
  rationale: ഓരോരുത്തന്റെയും തീച്ചട്ടിയെ വിതരണാർഥത്തിൽ ഏകവചനമായി പരാമർശിച്ച് സ്വാഭാവിക മലയാളക്രമം പാലിക്കുന്നു.
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: അതിന്മേൽ ധൂപം വെച്ച്
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഓരോ തീച്ചട്ടിയെയും വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നതായി നിലനിർത്തുന്നു; קְטֹרֶת എന്നതിന് ‘ധൂപം’ വ്യക്തവും പ്രചാരമുള്ളതുമാണ്.
- source_word: וַיַּקְרִבוּ
  choice: അർപ്പിച്ചു
  rationale: ആരാധനാക്രമ പശ്ചാത്തലത്തിലെ קרב ഹിഫീൽ രൂപത്തിന്റെ സമർപ്പണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ദൈവനാമം നേരിട്ട് നിലനിർത്തിക്കൊണ്ട് ആരാധനാപരമായ ‘സന്നിധിയിൽ’ എന്ന അർഥം നൽകുന്നു.
- source_word: אֵשׁ זָרָה
  choice: അനധികൃതമായ തീ
  rationale: അടുത്ത ഉപവാക്യം വിശദീകരിക്കുന്നതുപോലെ, ദൈവകല്പനയാൽ അനുവദിക്കപ്പെടാത്ത തീ എന്ന പുരോഹിത-നിയമപരമായ ആശയം വ്യക്തമാക്കുന്നു; ‘അന്യമായ തീ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: യഹ്‌വെ അവരോടു കല്പിച്ചിട്ടില്ലാത്ത
  rationale: ബന്ധവാക്യം തീയുടെ അനധികൃതസ്വഭാവം വിശദീകരിക്കുന്ന വിധത്തിൽ ചേർക്കുകയും אֹתָם എന്ന ബഹുവചന കർമപ്രത്യയം ‘അവരോട്’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയാൽ പകരാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אֵשׁ זָרָה എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: അനധികൃതമായ തീ
  alternative: അന്യമായ തീ; അപരിചിതമായ തീ
  rationale: ‘അവരോടു കല്പിച്ചിട്ടില്ലാത്ത’ എന്ന തുടർന്നുള്ള വാക്യം നിയമാനുമതിയുടെ അഭാവം ചൂണ്ടിക്കാണിക്കുന്നു. അതേസമയം זָרָה എന്ന പദത്തിന്റെ ‘അന്യമായ/വിദേശമായ’ നിഴലാർഥം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പുരോഹിതാരാധനയുടെ പശ്ചാത്തലം നിലനിർത്തിയെങ്കിലും അപരിചിതമായ സഭാപദാവലി ഒഴിവാക്കി; ‘തീച്ചട്ടി’, ‘ധൂപം’, ‘അർപ്പിച്ചു’, ‘സന്നിധിയിൽ’ എന്നീ സാധാരണയായി ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു.
