id: LEV.10.20
reference: Leviticus 10:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּיטַ֖ב בְּ/עֵינָֽי/ו׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/020.yaml
  text: And Moses heard[a], and it was good in his eyes.
translation:
  language: ml
  text: മോശ അത് കേട്ടു[a]; അത് അവന്റെ ദൃഷ്ടിയിൽ നല്ലതായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘മോശ അത് ശ്രദ്ധിച്ചു കേട്ടു.’ തുടർന്നുള്ള വാക്കുകൾക്ക് ‘അത് അവന് പ്രസാദകരമായി തോന്നി’ എന്നോ ‘അവൻ അത് അംഗീകരിച്ചു’ എന്നോ അർഥമാകാം. ഹീബ്രുവിൽ അക്ഷരാർഥം: ‘അത് അവന്റെ കണ്ണുകളിൽ നല്ലതായിരുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടു
  rationale: שׁמע എന്ന ക്രിയയുടെ ഖാൽ രൂപത്തിന് ഇവിടെ പ്രാഥമികമായി ‘കേൾക്കുക’ എന്നാണ് അർഥം. മുൻവാക്യത്തിലെ അഹരോന്റെ വിശദീകരണം മോശ കേട്ടുവെന്ന ആഖ്യാനക്രമം ഇത് നിലനിർത്തുന്നു; ‘മനസ്സിലാക്കി’ എന്നോ ‘അംഗീകരിച്ചു’ എന്നോ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ വ്യാപകവും സ്വാഭാവികവുമായ വ്യക്തിനാമരൂപം.
- source_word: וַיִּיטַב
  choice: നല്ലതായിരുന്നു
  rationale: יטב എന്ന ക്രിയയുടെ ‘നല്ലതായിരിക്കുക, പ്രസാദകരമായിരിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു. തുടർന്നുള്ള ‘അവന്റെ ദൃഷ്ടിയിൽ’ എന്ന പ്രയോഗത്തോടൊപ്പം, കാര്യം മോശയ്ക്ക് സ്വീകാര്യമായി തോന്നിയെന്ന ആശയം നൽകുന്നു.
- source_word: בְּעֵינָיו
  choice: അവന്റെ ദൃഷ്ടിയിൽ
  rationale: ‘അവന്റെ കണ്ണുകളിൽ’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിന്റെ വിലയിരുത്തൽസൂചകമായ ഹീബ്രു ശൈലി മലയാളത്തിൽ dignified-ഉം ഗ്രാഹ്യവുമായ രീതിയിൽ നിലനിർത്തുന്നു; ‘അവന്’ എന്നതിനെക്കാൾ മൂലരൂപം കൂടുതൽ സുതാര്യമാക്കുന്നു.
theological_decisions:
- issue: മോശയുടെ പ്രതികരണത്തിന്റെ ശക്തി
  choice: അത് അവന്റെ ദൃഷ്ടിയിൽ നല്ലതായിരുന്നു
  alternative: അവൻ അത് അംഗീകരിച്ചു
  rationale: ഹീബ്രു പ്രയോഗം അനുകൂലമായ വിലയിരുത്തൽ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഔപചാരികമായ അംഗീകാരം എന്ന ആശയം നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ സൂക്ഷ്മതയും സാധ്യതയുള്ള അർഥവ്യാപ്തിയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രു ശൈലിയുടെ ദൃശ്യബിംബം പൂർണമായും ഇല്ലാതാക്കാതെ ‘ദൃഷ്ടിയിൽ’ എന്ന സ്വാഭാവിക പ്രയോഗം സ്വീകരിച്ചു.
