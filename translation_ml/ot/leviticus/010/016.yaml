source:
  edition: WLC
  text: וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את דָּרֹ֥שׁ דָּרַ֛שׁ מֹשֶׁ֖ה וְ/הִנֵּ֣ה שֹׂרָ֑ף וַ֠/יִּקְצֹף עַל אֶלְעָזָ֤ר וְ/עַל אִֽיתָמָר֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/נּוֹתָרִ֖ם לֵ/אמֹֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: ml
  text: 'മോശെ പാപയാഗത്തിന്റെ ആൺകോലാടിനെ വളരെ ശ്രദ്ധയോടെ അന്വേഷിച്ചു[a]. അതാ, അത് ദഹിപ്പിക്കപ്പെട്ടിരുന്നു[b]. അപ്പോൾ അഹരോന്റെ ശേഷിച്ച പുത്രന്മാരായ[c] എലെയാസാരോടും ഈഥാമാരോടും മോശെ കോപിച്ചു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാപയാഗത്തിന്റെ ആൺകോലാടിനെ അന്വേഷിച്ചന്വേഷിച്ചു.” ഊന്നലിനായി എബ്രായത്തിൽ ക്രിയാനാമത്തോടൊപ്പം അതേ ധാതുവിൽനിന്നുള്ള സമാപികാക്രിയയും ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അത് പൂർണമായി ദഹിപ്പിക്കപ്പെട്ടിരുന്നു.” ആൺകോലാടിനെ ദഹിപ്പിക്കപ്പെട്ട നിലയിൽ കണ്ടെത്തിയെന്നാണ് എബ്രായരൂപം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: “അഹരോന്റെ ശേഷിച്ച പുത്രന്മാർ” എന്നത് നാദാബിന്റെയും അബീഹൂവിന്റെയും മരണശേഷം ശേഷിച്ച എലെയാസാരെയും ഈഥാമാരെയും സൂചിപ്പിക്കുന്നു (ലേവ്യർ 10:1–2, 12).
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: പാപയാഗത്തിനുള്ള ആൺകോലാട്
  rationale: שְׂעִיר എന്നത് ആൺകോലാടിനെയും הַחַטָּאת പാപയാഗത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ യാഗവും അതിനുള്ള മൃഗവും തമ്മിലുള്ള ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: വളരെ ശ്രദ്ധയോടെ അന്വേഷിച്ചു
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗം അന്വേഷണത്തിന്റെ ഊന്നൽ പ്രകടമാക്കുന്നു. പദശഃ ആവർത്തനത്തേക്കാൾ ഈ രൂപം ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള കണ്ടെത്തലിലേക്കു വായനക്കാരന്റെ ശ്രദ്ധ തിരിക്കുന്ന വ്യവഹാരധർമം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שֹׂרָף
  choice: അതിനെ ദഹിപ്പിച്ചുകളഞ്ഞിരുന്നു
  rationale: നിഷ്ക്രിയ കൃദന്തരൂപം കണ്ടെത്തിയപ്പോഴുള്ള മൃഗത്തിന്റെ ദഹിപ്പിക്കപ്പെട്ട അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. കർത്താവിനെ മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിലും വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: וַיִּקְצֹף
  choice: കോപിച്ചു
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന കോപം വ്യക്തമായി നൽകുന്നു; അതിന്റെ തീവ്രത അനാവശ്യമായി വർധിപ്പിക്കുന്നില്ല.
- source_word: הַנּוֹתָרִם
  choice: ശേഷിച്ച
  rationale: നാദാബിന്റെയും അബീഹൂവിന്റെയും മരണശേഷം അവശേഷിച്ച അഹരോന്റെ പുത്രന്മാരെയാണ് ഈ വിശേഷണം തിരിച്ചറിയിക്കുന്നത്; ‘അതിജീവിച്ച’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കി.
- source_word: לֵאמֹר
  choice: 'പറഞ്ഞു:'
  rationale: അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള സംഭാഷണത്തിലേക്കു സ്വാഭാവികമായി നയിക്കുന്ന മലയാള രൂപം.
