translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. യാഗസംബന്ധമായ സാങ്കേതിക പദമായി ‘പാപയാഗം’ നിലനിർത്തി. וְהִנֵּהയുടെ ശ്രദ്ധാകർഷക സ്വഭാവത്തിന് ‘അതാ’ ഉപയോഗിച്ചു; ഇത് അല്പം ഉയർന്ന രജിസ്റ്ററിലുള്ളതെങ്കിലും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. വാക്യാവസാനത്തിലെ ദ്വിബിന്ദു അടുത്ത വാക്യത്തിലെ പ്രസംഗത്തിലേക്കുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
