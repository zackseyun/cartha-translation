id: LEV.10.18
reference: Leviticus 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֵ֚ן לֹא הוּבָ֣א אֶת דָּמָ֔/הּ אֶל הַ/קֹּ֖דֶשׁ פְּנִ֑ימָה אָכ֨וֹל תֹּאכְל֥וּ אֹתָ֛/הּ בַּ/קֹּ֖דֶשׁ כַּ/אֲשֶׁ֥ר צִוֵּֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/018.yaml
  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: ml
  text: നോക്കൂ, അതിന്റെ രക്തം വിശുദ്ധമന്ദിരത്തിന്റെ അകത്തേക്ക് കൊണ്ടുപോയിട്ടില്ല.[a] ഞാൻ കല്പിച്ചതുപോലെ നിങ്ങൾ അത് വിശുദ്ധസ്ഥലത്ത് തീർച്ചയായും ഭക്ഷിക്കേണ്ടതായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധസ്ഥലത്തിന്റെ അകത്തേക്ക്.’ എബ്രായപാഠം വിശുദ്ധമേഖലയെ സൂചിപ്പിക്കുന്ന പദത്തോടൊപ്പം ‘അകത്തേക്ക്’ എന്ന പദവും ഉപയോഗിച്ച് ഉൾഭാഗത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ ‘ഭക്ഷിക്കുക, നിങ്ങൾ ഭക്ഷിക്കണം’ എന്ന ആവർത്തനഘടന കല്പനയ്ക്ക് ഊന്നൽ നൽകുന്നു; സന്ദർഭത്തിൽ അതിന്റെ അർഥം ‘നിങ്ങൾ തീർച്ചയായും ഭക്ഷിക്കേണ്ടതായിരുന്നു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: നോക്കൂ
  rationale: തുടർന്നുപറയുന്ന കാര്യത്തിലേക്ക് ഊന്നലോടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: הוּבָא
  choice: കൊണ്ടുപോയിട്ടില്ല
  rationale: בוא എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപം രക്തം അകത്തേക്ക് കൊണ്ടുപോകപ്പെട്ടില്ലെന്ന നിഷ്ക്രിയ ആശയം നൽകുന്നു; മലയാളത്തിൽ സന്ദർഭോചിതമായി സ്വാഭാവികമാക്കിയിരിക്കുന്നു.
- source_word: דָּמָהּ
  choice: അതിന്റെ രക്തം
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം പാപയാഗമൃഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ മൃഗത്തെയോ യാഗവസ്തുവെയോ സൂചിപ്പിക്കാൻ ‘അതിന്റെ’ സ്വാഭാവികമാണ്.
- source_word: אֶל־הַקֹּדֶשׁ פְּנִימָה
  choice: വിശുദ്ധമന്ദിരത്തിന്റെ അകത്തേക്ക്
  rationale: വിശുദ്ധമേഖലയിലേക്കുള്ള ദിശയും פְּנִימָה നൽകുന്ന ‘അകത്തേക്ക്’ എന്ന ഊന്നലും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: אָכוֹל תֹּאכְלוּ
  choice: നിങ്ങൾ ... ഭക്ഷിക്കേണ്ടതായിരുന്നു
  rationale: ക്രിയാനാമവും അപൂർണക്രിയയും ചേർന്ന ഊന്നൽ, കഴിഞ്ഞുപോയ കടമ നിർവഹിക്കാതിരുന്നതിനെക്കുറിച്ചുള്ള മോശെയുടെ ശാസനയായി മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֹתָהּ
  choice: അതു
  rationale: പാപയാഗത്തെയോ അതിന്റെ മാംസത്തെയോ സൂചിപ്പിക്കുന്ന കർമസർവനാമം; സന്ദർഭത്തിൽ പരാമർശം വ്യക്തമായതിനാൽ ‘അതു’ മതിയാകുന്നു.
- source_word: בַּקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലത്തുവെച്ചുതന്നെ
  rationale: പുരോഹിതന്മാർ യാഗം ഭക്ഷിക്കേണ്ട നിർദിഷ്ട വിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ‘തന്നെ’ ക്രിയയിലെ ഊന്നൽ സ്വാഭാവികമായി സഹായിക്കുന്നു.
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: ഞാൻ കല്പിച്ചതുപോലെ
  rationale: മോശെ മുമ്പു നൽകിയ കല്പനയിലേക്കുള്ള നേരിട്ടുള്ള സൂചന ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ആരാധനാക്രമത്തിലെ സ്ഥലപരമായ പദപ്രയോഗം
  choice: രക്തം കൊണ്ടുപോകാത്ത അകത്തെ വിശുദ്ധമേഖലയെ ‘വിശുദ്ധമന്ദിരത്തിന്റെ അകത്തേക്ക്’ എന്നും ഭക്ഷിക്കേണ്ട സ്ഥലത്തെ ‘വിശുദ്ധസ്ഥലത്ത്’ എന്നും വേർതിരിച്ചു.
  alternative: രണ്ടിടത്തും ‘വിശുദ്ധസ്ഥലം’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക; അല്ലെങ്കിൽ ആദ്യത്തേത് ‘തിരശ്ശീലയ്ക്കകത്ത്’ എന്ന് കൂടുതൽ നിർദിഷ്ടമാക്കുക.
  rationale: ആദ്യ പ്രയോഗത്തിൽ ദിശാസൂചകമായ אֶל എന്നതോടൊപ്പം ‘അകത്തേക്ക്’ എന്നർഥമുള്ള פְּנִימָה ഉണ്ട്; രണ്ടാമത്തേത് ഭക്ഷിക്കേണ്ട വിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. വ്യത്യാസം നിലനിർത്തുന്നത് ആചാരത്തിന്റെ യുക്തി വ്യക്തമാക്കുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത ‘തിരശ്ശീല’ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആരാധനാക്രമവുമായി ബന്ധപ്പെട്ട ‘വിശുദ്ധമന്ദിരം’, ‘വിശുദ്ധസ്ഥലം’ എന്നീ പദങ്ങൾ തമ്മിലുള്ള സന്ദർഭപരമായ വ്യത്യാസം നിലനിർത്തി. മൂലത്തിലെ ഊന്നൽ പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും പ്രകടമാക്കി.
