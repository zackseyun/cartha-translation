  naturalness: ‘വിശുദ്ധസ്ഥലത്തുവെച്ചുതന്നെ’ സ്വാഭാവികമാണെങ്കിലും ‘തന്നെ’ സ്ഥലത്തെ പ്രത്യേകമായി ഊന്നുന്നതായി കേൾക്കാം. എബ്രായത്തിലെ പ്രധാന ഊന്നൽ ‘തീർച്ചയായും ഭക്ഷിക്കേണ്ടതായിരുന്നു’ എന്ന ക്രിയാഭാഗത്തിൽ നൽകുന്നതാണ് കൂടുതൽ വ്യക്തവും സ്വാഭാവികവും.
  terminology: ‘വിശുദ്ധമന്ദിരത്തിന്റെ അകത്തേക്ക്’ എന്നും ‘വിശുദ്ധസ്ഥലത്ത്’ എന്നും വേർതിരിക്കുന്നത് എബ്രായത്തിലെ സ്ഥലസൂചനകളുടെ വ്യത്യാസം അമിതമായി നിർവചിക്കാതെ സംരക്ഷിക്കുന്നു. ‘കല്പിച്ചതുപോലെ’യും യാഗസന്ദർഭത്തിലെ ‘അതിന്റെ രക്തം’യും ഉചിതമാണ്.
