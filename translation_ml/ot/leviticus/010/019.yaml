    issue: Added concessive sense in “എന്നിട്ടും”
    rationale: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה states that such things happened/befell Aaron; it does not explicitly say ‘nevertheless’ or ‘in spite of this.’
  - severity: medium
    issue: Footnote anchors do not correspond to their stated functions
    rationale: The existing note a is a calamity note but is attached after the whole statement; note b is a lexical alternative for חַטָּאת but is attached only to the second occurrence. The lexical note should be anchored to both occurrences, and the calamity note to the phrase describing what befell Aaron.
