revisions:
- from: 'അഹരോൻ മോശയോടു പറഞ്ഞു: “നോക്കൂ, ഇന്ന് അവർ തങ്ങളുടെ പാപയാഗവും ഹോമയാഗവും യഹോവയുടെ സന്നിധിയിൽ അർപ്പിച്ചു. എന്നിട്ടും ഇതുപോലുള്ള കാര്യങ്ങൾ എനിക്കു സംഭവിച്ചു.[a] ഇന്ന് ഞാൻ പാപയാഗം ഭക്ഷിച്ചിരുന്നെങ്കിൽ,[b] അത് യഹോവയുടെ ദൃഷ്ടിയിൽ നല്ലതാകുമായിരുന്നോ?”'
  to: 'അഹരോൻ മോശയോടു പറഞ്ഞു: “നോക്കൂ, ഇന്ന് അവർ തങ്ങളുടെ പാപയാഗം[a] ഹോമയാഗവും യഹോവയുടെ സന്നിധിയിൽ അർപ്പിച്ചു. ഇതുപോലെയുള്ള സംഭവങ്ങൾ എനിക്കു സംഭവിച്ചു.[b] ഇന്ന് ഞാൻ പാപയാഗം[a] ഭക്ഷിച്ചിരുന്നെങ്കിൽ, അത് യഹോവയുടെ ദൃഷ്ടിയിൽ നല്ലതാകുമായിരുന്നോ?”'
