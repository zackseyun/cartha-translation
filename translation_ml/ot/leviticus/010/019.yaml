  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: ml
  text: 'അഹരോൻ മോശയോടു പറഞ്ഞു: “നോക്കൂ, ഇന്ന് അവർ തങ്ങളുടെ പാപയാഗം[a] ഹോമയാഗവും യഹോവയുടെ സന്നിധിയിൽ അർപ്പിച്ചു. ഇതുപോലെയുള്ള സംഭവങ്ങൾ എനിക്കു സംഭവിച്ചു.[b] ഇന്ന് ഞാൻ പാപയാഗം[a] ഭക്ഷിച്ചിരുന്നെങ്കിൽ, അത് യഹോവയുടെ ദൃഷ്ടിയിൽ നല്ലതാകുമായിരുന്നോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പാപയാഗം” എന്നതിനു “ശുദ്ധീകരണയാഗം” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം പാപത്തിൽനിന്നോ അശുദ്ധിയിൽനിന്നോ ശുദ്ധീകരണവുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “ഇതുപോലെയുള്ളവ എനിക്കു സംഭവിച്ചു.” ആ ദിവസം അഹരോന്റെ പുത്രന്മാർ മരിച്ചതുപോലുള്ള ദുരന്തങ്ങളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.'
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  choice: നോക്കൂ
  rationale: അഹരോന്റെ വിശദീകരണത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന കണികയുടെ സ്വാഭാവികവും ആധുനികവുമായ മലയാളരൂപം.
- source_word: הִקְרִיבוּ
  choice: അർപ്പിച്ചു
  rationale: ഹിഫിൽ രൂപത്തിന് യാഗസന്ദർഭത്തിലുള്ള പതിവ് അർഥം; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവും.
- source_word: חַטָּאתָם / חַטָּאת
  choice: തങ്ങളുടെ പാപയാഗം / പാപയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസന്ദർഭത്തിൽ ഇത് അമൂർത്തമായ പാപത്തെയല്ല, പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പാപയാഗം’ പരിചിതവും സുതാര്യവുമായ പദമാണ്.
- source_word: עֹלָתָם
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ പദം.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസാന്നിധ്യത്തിൽ യാഗം അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ആരാധനാസംബന്ധിയായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: ഇതുപോലുള്ള കാര്യങ്ങൾ എനിക്കു സംഭവിച്ചു
  rationale: ആ ദിവസത്തെ ദുരന്തങ്ങളെ, പ്രത്യേകിച്ച് പുത്രന്മാരുടെ മരണത്തെ, സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം അധികവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: וְאָכַלְתִּי
  choice: ഞാൻ ... ഭക്ഷിച്ചിരുന്നെങ്കിൽ
  rationale: രൂപത്തിൽ waw + qatal ആണെങ്കിലും, തുടർന്നുള്ള ആലങ്കാരിക ചോദ്യവുമായി ചേർന്ന് സന്ദർഭത്തിൽ പ്രതിവാസ്തവ നിബന്ധനയുടെ ശക്തിയുണ്ട്.
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: അത് യഹോവയുടെ ദൃഷ്ടിയിൽ നല്ലതാകുമായിരുന്നോ
  rationale: ദൈവിക അംഗീകാരത്തെക്കുറിച്ചുള്ള ആലങ്കാരിക ചോദ്യം ഹീബ്രു ദൃശ്യരൂപത്തോട് അടുത്തുനിന്ന് വായിക്കാവുന്ന മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തിന്റെ വ്യക്തിനാമസ്വഭാവം മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: അഹരോൻ പാപയാഗം ഭക്ഷിക്കാതിരുന്നതിനുള്ള ന്യായീകരണത്തിന്റെ സ്വഭാവം
  choice: ആ ദിവസത്തെ ദുരന്തങ്ങളുടെ പശ്ചാത്തലത്തിൽ താൻ പാപയാഗം ഭക്ഷിക്കുന്നത് യഹോവയുടെ ദൃഷ്ടിയിൽ അംഗീകാരയോഗ്യമാകുമായിരുന്നോ എന്ന് അഹരോൻ ചോദിക്കുന്നു.
  alternative: അഹരോൻ വ്യക്തിപരമായ ദുഃഖം മാത്രം പ്രകടിപ്പിക്കുന്നു; അല്ലെങ്കിൽ തന്റെ ഇപ്പോഴത്തെ അവസ്ഥയിൽ യാഗം ഭക്ഷിക്കുന്നത് ആചാരപരമായി ശരിയായിരിക്കുമോ എന്ന് പ്രത്യേകം ചോദിക്കുന്നു.
  rationale: ഹീബ്രു വാചകം ദുരന്തങ്ങളെയും യാഗം ഭക്ഷിക്കുന്നതിനെയും ബന്ധിപ്പിക്കുന്നു; എന്നാൽ പ്രശ്നം ആചാരശുദ്ധിയോ വിലാപമോ പൊതുവായ ഔചിത്യമോ എന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നോക്കൂ’ ശ്രദ്ധാകർഷക കണികയുടെ സജീവത നിലനിർത്തുന്നു; ‘സന്നിധിയിൽ’, ‘ദൃഷ്ടിയിൽ’ എന്നീ പ്രയോഗങ്ങൾ ആരാധനാസന്ദർഭത്തിന്റെ ഗൗരവം കാത്തുസൂക്ഷിക്കുന്നു. ഹീബ്രുവിലെ ആലങ്കാരിക ചോദ്യം ചോദ്യരൂപത്തിൽ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
