language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ അഹരോനോടു പറഞ്ഞു: “യഹ്‌വെ അരുളിച്ചെയ്തത് ഇതാണ്: ‘എന്നോട് അടുത്തുവരുന്നവരുടെ ഇടയിൽ ഞാൻ പരിശുദ്ധനെന്നു വെളിപ്പെടും[a]; സകലജനത്തിന്റെയും മുമ്പാകെ ഞാൻ മഹത്ത്വപ്പെടും[b].’” അഹരോൻ മൗനം പാലിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നോട് അടുത്തുവരുന്നവരാൽ ഞാൻ പരിശുദ്ധനായി മാനിക്കപ്പെടും.” ദൈവത്തിന്റെ പരിശുദ്ധി പ്രകടമാകുന്നു എന്നോ അവനെ സമീപിക്കുന്നവർ അവനെ പരിശുദ്ധനായി മാനിക്കുന്നു എന്നോ എബ്രായപ്രയോഗം സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “ഞാൻ ബഹുമാനിക്കപ്പെടും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നൽകി.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: യഹ്‌വെ അരുളിച്ചെയ്തത് ഇതാണ്
  rationale: തിരിച്ചറിയൽസൂചകമായ എബ്രായ വാക്യഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ദൈവത്തിന്റെ വാക്കിനെ സൂചിപ്പിക്കുന്ന മാന്യമായ ‘അരുളിച്ചെയ്തു’ എന്ന ക്രിയ ഉപയോഗിക്കുന്നു.
- source_word: בִּקְרֹבַי
  choice: എന്നോട് അടുത്തുവരുന്നവരുടെ ഇടയിൽ
  rationale: ‘എന്റെ സമീപസ്ഥരിൽ/എന്നെ സമീപിക്കുന്നവരിൽ’ എന്ന അർഥവും ആരാധനയ്ക്കോ ശുശ്രൂഷയ്ക്കോ ദൈവത്തെ സമീപിക്കുന്ന പുരോഹിതസന്ദർഭവും സൂക്ഷിക്കുന്നു; ‘പുരോഹിതന്മാർ’ എന്ന് അമിതമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: אֶקָּדֵשׁ
  choice: ഞാൻ പരിശുദ്ധനെന്നു വെളിപ്പെടും
  rationale: קדש എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള ദൈവത്തിന്റെ പരിശുദ്ധി പ്രകടമാകുക എന്ന ഭാവം വായനാസൗകര്യത്തോടെ നൽകുന്നു; സമീപിക്കുന്നവർ ദൈവത്തെ പരിശുദ്ധനായി മാനിക്കണം എന്ന സാദ്ധ്യഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְעַל פְּנֵי כָל הָעָם
  choice: സകലജനത്തിന്റെയും മുമ്പാകെ
  rationale: സംഭവത്തിന്റെ പരസ്യസ്വഭാവം കാത്തുകൊണ്ട് എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളസമാനത നൽകുന്നു.
- source_word: אֶכָּבֵד
  choice: ഞാൻ മഹത്ത്വപ്പെടും
  rationale: כבד എന്നതിന്റെ നിഫാൽ രൂപത്തിലുള്ള മഹത്ത്വവും പൊതുവായ ബഹുമാനവും ലഭിക്കുന്ന ഭാവം ദൈവത്തെ സംബന്ധിച്ച ഗൗരവത്തോടെ നിലനിർത്തുന്നു.
- source_word: וַיִּדֹּם
  choice: മൗനം പാലിച്ചു
  rationale: ദുഃഖകരമായ സംഭവത്തോടുള്ള അഹരോന്റെ നിശ്ശബ്ദ പ്രതികരണത്തിന്റെ ഗൗരവവും സംക്ഷിപ്തതയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവത്തെ സമീപിക്കുന്നവരുടെ ഇടയിൽ അവന്റെ പരിശുദ്ധി എങ്ങനെ പ്രകടമാകുന്നു എന്ന പ്രഖ്യാപനം
  choice: എന്നോട് അടുത്തുവരുന്നവരുടെ ഇടയിൽ ഞാൻ പരിശുദ്ധനെന്നു വെളിപ്പെടും
  alternative: എന്നോട് അടുത്തുവരുന്നവരാൽ ഞാൻ പരിശുദ്ധനായി മാനിക്കപ്പെടും
  rationale: എബ്രായ നിഫാൽ രൂപത്തിന് ദൈവത്തിന്റെ പരിശുദ്ധി പ്രകടമാകുന്നു എന്നും സമീപിക്കുന്നവർ അവനെ പരിശുദ്ധനായി മാനിക്കുന്നു എന്നും ഉള്ള ഭാവങ്ങൾ വഹിക്കാനാകും. മുഖ്യവാചകം ദൈവിക പ്രകടനത്തെ മുൻനിർത്തുമ്പോൾ മറ്റേ സാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: אֶכָּבֵד എന്നതിലെ പരസ്യമായ മഹത്ത്വം/ബഹുമാനം
  choice: ഞാൻ മഹത്ത്വപ്പെടും
  alternative: ഞാൻ ബഹുമാനിക്കപ്പെടും
  rationale: ‘മഹത്ത്വപ്പെടും’ എന്നത് ദൈവത്തെ സംബന്ധിച്ച כבד എന്ന പദത്തിന്റെ ഗൗരവവും സമാന്തരവാക്യത്തിലെ പരിശുദ്ധിയുമായുള്ള ബന്ധവും സൂക്ഷിക്കുന്നു; ‘ബഹുമാനിക്കപ്പെടും’ സാധുവായ മറ്റൊരു പദസാദ്ധ്യതയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ദൈവനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു നൽകിയിരിക്കുന്നു. ‘പരിശുദ്ധനെന്നു വെളിപ്പെടും’ എന്ന പ്രയോഗം മൂലത്തിലെ സിദ്ധാന്തപരമായ പിരിമുറുക്കം പൂർണമായി തീർപ്പാക്കാതെ വായനാസൗകര്യം നൽകുന്നു.
