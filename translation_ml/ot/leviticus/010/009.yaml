reference: Leviticus 10:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: ml
  text: നീയും നിന്റെ പുത്രന്മാരും സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കുമ്പോൾ വീഞ്ഞോ മത്തുപാനീയമോ[a] കുടിക്കരുത്; നിങ്ങൾ മരിക്കാതിരിക്കേണ്ടതിന്[b]. ഇതു നിങ്ങളുടെ തലമുറകൾക്കായി സ്ഥിരമായ ഒരു നിയമമാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ലഹരിപാനീയം.’ എബ്രായപദം സാധാരണയായി വീഞ്ഞല്ലാത്ത മദ്യപാനീയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾ മരിക്കാതിരിക്കേണ്ടതിന്’ അല്ലെങ്കിൽ ‘നിങ്ങൾ മരിക്കാതിരിക്കട്ടെ.’
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘ശാശ്വതനിയമം’ അല്ലെങ്കിൽ ‘എന്നേക്കുമുള്ള ചട്ടം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יַיִן
  choice: വീഞ്ഞ്
  rationale: പുളിപ്പിച്ച മുന്തിരിപ്പാനീയത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായപദത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: שֵׁכָר
  choice: ലഹരിപാനീയം
  rationale: വീഞ്ഞിനു പുറമേയുള്ള മദ്യം കലർന്ന പാനീയങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ‘മദ്യം’ എന്നത് വീഞ്ഞിനെയും ഉൾക്കൊള്ളാമെന്നതിനാൽ ഇവിടെ ‘ലഹരിപാനീയം’ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: אַל תֵּשְׁתְּ
  choice: കുടിക്കരുത്
  rationale: אַל സഹിതമുള്ള ക്രിയാരൂപം വ്യക്തമായ നിരോധനമാണ്; ആധുനിക മലയാളത്തിൽ അതിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക രൂപം.
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: നീയും നിന്നോടുകൂടെയുള്ള നിന്റെ പുത്രന്മാരും
  rationale: അഹരോനെയും അവനോടൊപ്പമുള്ള പുത്രന്മാരെയും വ്യക്തമായി ഉൾപ്പെടുത്തുകയും אִתָּךְ എന്ന ആവർത്തിച്ച ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּבֹאֲכֶם
  choice: പ്രവേശിക്കുമ്പോൾ
  rationale: പ്രവേശനസമയത്തേക്കു നിരോധനത്തെ പരിമിതപ്പെടുത്തുന്ന കാലസാഹചര്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ ആരാധനാകൂടാരത്തിനുള്ള സ്ഥാപിതവും മനസ്സിലാക്കാൻ എളുപ്പമുള്ള മലയാളപദം.
- source_word: וְלֹא תָמֻתוּ
  choice: അല്ലെങ്കിൽ നിങ്ങൾ മരിക്കും
  rationale: നിരോധനം ലംഘിച്ചാൽ ഒഴിവാക്കേണ്ട മാരകഫലം എന്ന മുന്നറിയിപ്പ് വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ഏകോപനവാക്യത്തിന്റെ ഫലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: ശാശ്വതനിയമം
  rationale: തുടർച്ചയായി ബാധകമായ നിയമനിർദേശം എന്ന നിയമപരമായ സൂത്രവാക്യത്തിന്റെ ദൈർഘ്യബലം നിലനിർത്തുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതലമുറയായി നിങ്ങൾക്കുള്ള
  rationale: തുടർന്നുവരുന്ന തലമുറകളിലുടനീളമുള്ള ബാധകത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മരണവാക്യത്തിന്റെ ബന്ധം
  choice: ‘അല്ലെങ്കിൽ നിങ്ങൾ മരിക്കും’ എന്ന ഫലമുന്നറിയിപ്പായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നിങ്ങൾ മരിക്കാതിരിക്കേണ്ടതിന്’ / ‘നിങ്ങൾ മരിക്കാതിരിക്കട്ടെ’
  rationale: וְלֹא תָמֻתוּ എന്നത് അക്ഷരാർഥത്തിൽ ‘നിങ്ങൾ മരിക്കുകയില്ല’ എന്നായിരുന്നാലും, നിരോധനത്തിനു പിന്നാലെ അത് ലംഘനത്തിന്റെ മരണഭീഷണി സൂചിപ്പിക്കുന്നു. തിരഞ്ഞെടുക്കപ്പെട്ട രൂപം ലക്ഷ്യവും ഫലവും തമ്മിലുള്ള സാധ്യത നിലനിർത്തിക്കൊണ്ട് മുന്നറിയിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: നിരോധനത്തിന്റെ പരിധി
  choice: സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കുന്ന അവസരത്തിലേക്കു നിരോധനം ബന്ധിപ്പിച്ചു.
  alternative: പുരോഹിതന്മാർക്കുള്ള എല്ലാ സമയത്തെയും സമ്പൂർണ മദ്യവർജനം
  rationale: בְּבֹאֲכֶם എന്ന കാലസൂചകപ്രയോഗം കല്പനയുടെ സന്ദർഭം പ്രവേശനസമയമെന്നു വ്യക്തമാക്കുന്നു; അതിനപ്പുറം ഒരു സമഗ്ര സിദ്ധാന്തം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- issue: חֻקַּת עוֹלָם എന്നതിന്റെ ദൈർഘ്യം
  choice: ‘ശാശ്വതനിയമം’
  alternative: ‘സ്ഥിരനിയമം’ / ‘എന്നേക്കുമുള്ള ചട്ടം’
  rationale: നിയമത്തിന്റെ തുടർച്ചയായ തലമുറാബാധകത സംരക്ഷിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ കാലപരിധിയെ പരിഭാഷയിൽ കൂടുതൽ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമനിർദേശശൈലി. ‘നീ’ എന്ന ഏകവചന അഭിസംബോധന അഹരോനെയും ‘നിങ്ങൾ’ എന്ന ബഹുവചനം അഹരോനെയും പുത്രന്മാരെയും പ്രതിഫലിപ്പിക്കുന്നു. പരമ്പരാഗതമായി പരിചിതമായ ‘സമാഗമകൂടാരം’ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
