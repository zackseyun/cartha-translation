revisions:
- from: യഹോവ മോശെയുടെ കൈമുഖാന്തരം അവരോടു അരുളിച്ചെയ്ത എല്ലാ ചട്ടങ്ങളും ഇസ്രായേൽമക്കളെ പഠിപ്പിക്കേണ്ടതിനും.[a]
  to: യഹോവ മോശെ മുഖാന്തരം അവരോടു അരുളിച്ചെയ്ത എല്ലാ ചട്ടങ്ങളും ഇസ്രായേൽമക്കളെ പഠിപ്പിക്കേണ്ടതിനും.[a]
  rationale: The revision changes only the unnatural Malayalam calque ‘മോശെയുടെ കൈമുഖാന്തരം’ to the idiomatic and source-faithful ‘മോശെ മുഖാന്തരം.’ The footnote now preserves the Hebrew’s literal ‘by the hand of Moses’ imagery without burdening the main text. The sentence remains grammatically dependent on the prior verse, as indicated by ‘പഠിപ്പിക്കേണ്ടതിനും.’
