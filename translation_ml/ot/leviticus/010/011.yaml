id: LEV.10.11
reference: Leviticus 10:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: ml
  text: യഹോവ മോശെ മുഖാന്തരം അവരോടു അരുളിച്ചെയ്ത എല്ലാ ചട്ടങ്ങളും ഇസ്രായേൽമക്കളെ പഠിപ്പിക്കേണ്ടതിനും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “മോശെയുടെ കൈവഴി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: പഠിപ്പിക്കേണ്ടതിനും
  rationale: വാവോടുകൂടിയ ഹിഫീൽ അനന്തക്രിയ മുൻവാക്യത്തിലെ പുരോഹിതചുമതലകളുടെ തുടർച്ചയാണ്. ‘പഠിപ്പിക്കുക’ എന്നത് സാധാരണ വായനക്കാർക്കു വ്യക്തവും മൂലത്തിലെ അധ്യാപനാർഥത്തോട് ചേർന്നതുമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബപരമായ സമൂഹപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും ബൈബിൾപരവുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുന്നു; ഇവിടെ അത് ഉടമ്പടിജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: כָּל הַחֻקִּים
  choice: എല്ലാ ചട്ടങ്ങളും
  rationale: חֻקִּים നിർദേശിക്കപ്പെട്ട നിയമവ്യവസ്ഥകളെ സൂചിപ്പിക്കുന്നു. ‘ചട്ടങ്ങൾ’ നിയമപരമായ ഭാവം നിലനിർത്തുന്നതിനൊപ്പം ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיהֶם
  choice: യഹോവ അവരോടു അരുളിച്ചെയ്ത
  rationale: ബന്ധവാക്യം ‘ചട്ടങ്ങൾ’ എന്നതിനെ വിശേഷിപ്പിക്കുന്നു. ദൈവത്തിന്റെ ഔദ്യോഗിക വചനത്തിന് അനുയോജ്യമായ മാന്യഭാവം ‘അരുളിച്ചെയ്ത’ നൽകുന്നു; אֲלֵיהֶם എന്നത് ‘അവരോട്’ എന്നു നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: തിരുവെഴുത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ രൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെയുടെ കൈമുഖാന്തരം
  rationale: മോശെയുടെ മധ്യസ്ഥപങ്ക് സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിലെ ‘കൈ’ എന്ന രൂപകം നിലനിർത്തുന്നു. കൂടുതൽ സ്വാഭാവികമായ അർഥവിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന നാമരൂപം നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ; ഇസ്രായേല്യർ
  rationale: പുരുഷലിംഗ കുടുംബപ്രയോഗത്തിന്റെ സമൂഹപരമായ ബലം ‘ഇസ്രായേൽമക്കൾ’ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; അതിനെ വെറും ജനതാനാമമാക്കി ചുരുക്കുന്നില്ല.
- issue: בְּיַד מֹשֶׁה എന്ന മധ്യസ്ഥതാപ്രയോഗം
  choice: മോശെയുടെ കൈമുഖാന്തരം
  alternative: മോശെ മുഖാന്തരം
  rationale: മൂലത്തിലെ ദേഹരൂപകം നിലനിർത്തി മോശെയുടെ മധ്യസ്ഥപങ്ക് പ്രകടമാക്കുന്നു; മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ‘മുഖാന്തരം’ ചേർക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ബൈബിൾ ഗദ്യം. ഈ വാക്യം മുൻവാക്യത്തിലെ നിർദ്ദേശത്തിന്റെ വ്യാകരണപരമായ തുടർച്ചയായതിനാൽ ‘പഠിപ്പിക്കേണ്ടതിനും’ എന്നു അവസാനിപ്പിച്ചു. എബ്രായത്തിലെ മധ്യസ്ഥതാരൂപകം പ്രധാനപാഠത്തിൽ സൂക്ഷിച്ചും സ്വാഭാവിക വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകിയുമിരിക്കുന്നു.
