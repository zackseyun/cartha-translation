reference: Leviticus 10:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: ml
  text: 'പിന്നെ മോശ അഹരോനോടും അവന്റെ ശേഷിച്ച പുത്രന്മാരായ എലെയാസാരോടും ഈഥാമാരോടും പറഞ്ഞു: “യഹ്‌വേയ്ക്കുള്ള അഗ്നിയർപ്പണങ്ങളിൽനിന്ന്[a] ശേഷിച്ച ധാന്യയാഗം എടുക്കുവിൻ; യാഗപീഠത്തിനരികെ അതിനെ പുളിപ്പില്ലാത്തതായിത്തന്നെ ഭക്ഷിക്കുവിൻ; കാരണം അത് അതിവിശുദ്ധമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “യഹ്‌വേയ്ക്കുള്ള ആഹാരയാഗങ്ങളിൽനിന്ന്.”'
    reason: אִשֵּׁי എന്ന യാഗസാങ്കേതിക പദത്തിന് ‘അഗ്നിയർപ്പണങ്ങൾ’ എന്ന ഔപചാരിക പരിഭാഷയ്ക്കൊപ്പം ‘ആഹാരയാഗങ്ങൾ’ എന്ന സന്ദർഭാനുസൃത പരിഭാഷയും സാധ്യമാണ്.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പിന്നെ മോശ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘പിന്നെ’ സ്വാഭാവികമായ മലയാളത്തിൽ സംഭവക്രമം വ്യക്തമാക്കുന്നു.
- source_word: הַנּוֹתָרִים
  choice: ശേഷിച്ച പുത്രന്മാർ
  rationale: നാദാബിന്റെയും അബീഹൂവിന്റെയും മരണശേഷം അഹരോന് ശേഷിച്ചിരുന്ന പുത്രന്മാരെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘അതിജീവിച്ച’ എന്നതിനെക്കാൾ ‘ശേഷിച്ച’ മൂലപാഠത്തോട് അടുത്തും വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമാണ്.
- source_word: הַמִּנְחָה
  choice: ധാന്യയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസാങ്കേതിക പ്രയോഗത്തിൽ ഇത് പൊതുവായ വഴിപാടല്ല, ധാന്യത്തിൽനിന്നുള്ള യാഗമാണ്.
- source_word: הַנּוֹתֶרֶת
  choice: ശേഷിച്ച
  rationale: യഹോവയ്ക്കുള്ള ഭാഗം അർപ്പിച്ചതിനുശേഷം ബാക്കിയുള്ള ധാന്യയാഗഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: യഹോവയ്ക്ക് അഗ്നിയിൽ അർപ്പിച്ച യാഗങ്ങളിൽനിന്ന്
  rationale: אִשֶּׁה എന്ന പദത്തിലെ അഗ്നിയർപ്പണ ആശയം നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാളത്തിൽ വ്യക്തമായി വായിക്കാവുന്ന രൂപം തെരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וְאִכְלֻהָ מַצּוֹת
  choice: പുളിപ്പില്ലാത്തതായി ഭക്ഷിക്കുവിൻ
  rationale: מַצּוֹת ഇവിടെ ഭക്ഷിക്കേണ്ട രീതിയെ സൂചിപ്പിക്കുന്ന വിധേയ/ക്രിയാവിശേഷണ പ്രയോഗമാണ്; അതിനാൽ ധാന്യയാഗം പുളിപ്പില്ലാതെ ഭക്ഷിക്കണമെന്ന അർത്ഥം നിലനിർത്തുന്നു.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനരികിൽവെച്ച്
  rationale: אֵצֶל സൂചിപ്പിക്കുന്ന സമീപ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; നേരിട്ടുള്ള സ്പർശം ഇതിൽ സൂചിപ്പിക്കുന്നില്ല.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അതിവിശുദ്ധം
  rationale: എബ്രായയിലെ പരമോന്നതത്വം സൂചിപ്പിക്കുന്ന ആവർത്തനപ്രയോഗത്തെ യാഗവസ്തുവിന്റെ ഏറ്റവും ഉയർന്ന വിശുദ്ധനിലയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു ബിരുദനാമം പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപം നിലനിർത്തി.
- issue: קֹדֶשׁ קָדָשִׁים എന്ന വിശുദ്ധതയുടെ പദവി
  choice: അതിവിശുദ്ധം
  alternative: വിശുദ്ധങ്ങളിൽ വിശുദ്ധം
  rationale: ഇത് യാഗവസ്തുവിന്റെ പരമോന്നത വിശുദ്ധപദവിയെ സൂചിപ്പിക്കുന്ന എബ്രായ അതിശയോക്തി-ഘടനയാണ്; വിശുദ്ധമന്ദിരത്തിലെ പ്രത്യേക സ്ഥലമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘അതിവിശുദ്ധം’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. യാഗസാങ്കേതിക പദങ്ങൾക്ക് സ്ഥിരതയുള്ള രൂപങ്ങൾ ഉപയോഗിച്ചു; കല്പനയുടെ ബഹുവചനഭാവം ‘ഭക്ഷിക്കുവിൻ’ എന്നതിൽ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട യാഗപ്രയോഗത്തിനുശേഷം തന്നെയാണ് ചേർത്തത്.
