reference: Leviticus 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/סָמְכוּ זִקְנֵ֨י הָ/עֵדָ֧ה אֶת יְדֵי/הֶ֛ם עַל רֹ֥אשׁ הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: ml
  text: സഭയിലെ മൂപ്പന്മാർ യഹോവയുടെ സന്നിധിയിൽ കാളയുടെ തലമേൽ തങ്ങളുടെ കൈകൾ വെക്കണം; തുടർന്ന് ഒരാൾ[a] യഹോവയുടെ സന്നിധിയിൽ ആ കാളയെ അറുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം ഇവിടെ ‘മൂപ്പന്മാർ’ എന്ന ബഹുവചനത്തിൽനിന്ന് ഏകവചന ക്രിയയിലേക്കു മാറുന്നു. അതിനാൽ ‘അവൻ കാളയെ അറുക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം; അറുക്കുന്ന വ്യക്തി ആരാണെന്ന് ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: വെക്കണം
  rationale: യാഗസന്ദർഭത്തിൽ סמך കൈകൾ യാഗമൃഗത്തിന്റെമേൽ വെച്ച് അമർത്തുന്ന ആചാരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കൈകൾ വെക്കുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: זִקְנֵי הָעֵדָה
  choice: സഭയിലെ മൂപ്പന്മാർ
  rationale: עֵדָה ഇവിടെ ഒത്തുകൂടിയ ഉടമ്പടി-സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സഭ’ ഔപചാരികമായ സമൂഹബോധവും ‘മൂപ്പന്മാർ’ זִקְנֵי എന്നതും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת יְדֵיהֶם
  choice: തങ്ങളുടെ കൈകൾ
  rationale: മൂന്നാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയവും ‘കൈകൾ’ എന്ന ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: עַל רֹאשׁ הַפָּר
  choice: കാളയുടെ തലമേൽ
  rationale: യാഗമൃഗത്തിന്റെ തലയിൽ കൈവെക്കുന്ന സ്ഥലബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്നു; פַּר എന്നതിന് ഇവിടെ ‘കാള’ യോജിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സാന്നിധ്യത്തിൽ’ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְשָׁחַט
  choice: തുടർന്ന് ഒരാൾ … അറുക്കണം
  rationale: എബ്രായത്തിലെ മൂന്നാം പുരുഷ ഏകവചന ക്രിയ, മുൻപുള്ള ബഹുവചന കർത്താവിലേക്കു ചേർത്ത് മിനുക്കാതെ സംരക്ഷിക്കുന്നു. ‘ഒരാൾ’ നിർവഹിക്കുന്ന വ്യക്തി ആരെന്നു നിർണ്ണയിക്കാതെയും ഏകവചനം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിത ലിപ്യന്തരണമായ ‘യഹോവ’ ഉപയോഗിക്കുന്നു.
- issue: וְשָׁחַט എന്ന ഏകവചന ക്രിയയും മുൻപുള്ള ബഹുവചന കർത്താവും തമ്മിലുള്ള മാറ്റം
  choice: ‘ഒരാൾ … അറുക്കണം’ എന്നു നൽകി ഏകവചനം നിലനിർത്തുക
  alternative: ‘അവർ അറുക്കണം’ അല്ലെങ്കിൽ ‘കാള അറുക്കപ്പെടണം’
  rationale: എബ്രായം ‘മൂപ്പന്മാർ’ എന്ന ബഹുവചനത്തിൽനിന്ന് ഏകവചന ക്രിയയിലേക്കു മാറുന്നു. ‘ഒരാൾ’ എന്ന അനിശ്ചിത പ്രയോഗം നിർവാഹകനെ തിരിച്ചറിയാതെ ഈ സംഖ്യാമാറ്റവും വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമനിർദേശത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ശൈലി. ‘യഹോവയുടെ സന്നിധിയിൽ’ എന്ന പ്രയോഗം ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; എബ്രായത്തിലെ ബഹുവചനത്തിൽനിന്നുള്ള ഏകവചനമാറ്റം അടിക്കുറിപ്പോടെ തുറന്നുവെച്ചിരിക്കുന്നു.
