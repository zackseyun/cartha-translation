reference: Leviticus 4:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבּ/וֹ֙ יַקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה כְּ/חֵ֖לֶב זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֖/וֹ וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: ml
  text: അതിന്റെ കൊഴുപ്പ് മുഴുവനും അവൻ സമാധാനയാഗത്തിന്റെ[a] കൊഴുപ്പുപോലെ യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം. ഇങ്ങനെ പുരോഹിതൻ അവന്റെ പാപം[b] നിമിത്തം അവന്നുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം; അപ്പോൾ അവന്നു ക്ഷമ ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമാധാനയാഗം’ എന്നത് ‘കൂട്ടായ്മയാഗം’ എന്നോ ‘ക്ഷേമയാഗം’ എന്നോ പരിഭാഷപ്പെടുത്താവുന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ חַטָּאת എന്ന പദത്തിന് ‘പാപം’ എന്നും ‘പാപയാഗം’ എന്നും അർഥമുണ്ടാകാം; ഇവിടെ അത് ഏറ്റവും സാധ്യതയോടെ ആ മനുഷ്യന്റെ പാപത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: അതിന്റെ കൊഴുപ്പ്
  rationale: യാഗമൃഗത്തിൽനിന്ന് യാഗപീഠത്തിൽ ദഹിപ്പിക്കാനായി വേർതിരിച്ച കൊഴുപ്പുഭാഗങ്ങളെയാണ് חֵלֶב സൂചിപ്പിക്കുന്നത്. പ്രത്യയം ‘അതിന്റെ’ എന്നു നിലനിർത്തി.
- source_word: יַקְטִיר
  choice: ദഹിപ്പിക്കണം
  rationale: യാഗസന്ദർഭത്തിലെ ഹിഫിൽ രൂപം യാഗപീഠത്തിൽ കത്തിച്ച് പുകയാക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ആചാരപരമായ അർഥം സ്വാഭാവികമായി നൽകാൻ ‘ദഹിപ്പിക്കണം’ ഉപയോഗിച്ചു.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശാസൂചക രൂപം യാഗപീഠത്തിലേക്കുള്ള ചലനം സൂചിപ്പിച്ചാലും, മലയാളത്തിൽ ഈ യാഗക്രിയയ്ക്ക് ‘യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കുക’ എന്നതാണ് സ്വാഭാവികം.
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗത്തിന്റെ കൊഴുപ്പുപോലെ
  rationale: ശ്ലാമീം യാഗത്തിലെ കൊഴുപ്പു കൈകാര്യം ചെയ്യുന്ന പതിവുരീതിയോടാണ് താരതമ്യം. പരിചിതമായ യാഗവിഭാഗനാമമായി ‘സമാധാനയാഗം’ സ്വീകരിച്ചു; പദത്തിന്റെ വിശാല അർഥപരിധി അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וְכִפֶּר עָלָיו
  choice: പുരോഹിതൻ അവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ ആചാരപരമായ അർഥം സംരക്ഷിക്കുന്ന സ്ഥിരവും മതവിഭാഗനിരപേക്ഷവുമായ പ്രയോഗമാണ് ‘പ്രായശ്ചിത്തം ചെയ്യുക’.
- source_word: מֵחַטָּאתוֹ
  choice: അവന്റെ പാപത്തിനുവേണ്ടി
  rationale: חַטָּאת എന്നതിന് ‘പാപം’ എന്നും ‘പാപയാഗം’ എന്നും അർഥമുണ്ടാകാം. ഇവിടെ തുടർന്നുള്ള ക്ഷമാപ്രസ്താവനയും വാക്യഘടനയും വ്യക്തിയുടെ പാപത്തെയാണ് കൂടുതൽ സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
- source_word: וְנִסְלַח לוֹ
  choice: അവനോടു ക്ഷമിക്കപ്പെടും
  rationale: סלח എന്ന നിഫാൽ രൂപത്തിലെ ദൈവിക കർമണിപ്രയോഗം തുറന്നുവ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു; ക്ഷമിക്കുന്ന കർത്താവിനെ പാഠം വ്യക്തമാക്കാത്തതിനാൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ പരിഭാഷ
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: ഈ എബ്രായപദത്തിൽ സമാധാനം, സമ്പൂർണക്ഷേമം, ദൈവസന്നിധിയിലെ കൂട്ടായ്മ എന്നീ ഭാവങ്ങൾ ഉൾപ്പെടാം. മുഖ്യപാഠത്തിൽ പരിചിതമായ ‘സമാധാനയാഗം’ നിലനിർത്തുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്തു.
- issue: מֵחַטָּאתוֹ എന്നതിലെ חַטָּאת-ന്റെ അർഥം
  choice: അവന്റെ പാപം
  alternative: അവന്റെ പാപയാഗം
  rationale: ലേവ്യപുസ്തകത്തിൽ പദം കുറ്റത്തെയും അതിനുള്ള യാഗത്തെയും സൂചിപ്പിക്കാം. എന്നാൽ ഇവിടെ ‘അവനുവേണ്ടി’ എന്ന പ്രയോഗവും തുടർന്നുള്ള ക്ഷമയും കുറ്റമായ പാപത്തെയാണ് കൂടുതൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: וְנִסְלַח לוֹ എന്ന ദൈവിക കർമണിപ്രയോഗം
  choice: അവനോടു ക്ഷമിക്കപ്പെടും
  alternative: ദൈവം അവനോടു ക്ഷമിക്കും
  rationale: മൂലപാഠം ക്ഷമിക്കുന്ന കർത്താവിനെ നേരിട്ട് പറയുന്നില്ല. ദൈവിക കർമണിയുടെ സൂചന നിലനിർത്താനും വ്യാഖ്യാനത്തെ മുഖ്യപാഠത്തിൽ ചേർക്കാതിരിക്കാനും കർമണിരൂപം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ലേവ്യപുസ്തകത്തിലെ യാഗസാങ്കേതിക പദങ്ങൾക്ക് സ്ഥിരത നൽകാൻ ‘യാഗപീഠം’, ‘സമാധാനയാഗം’, ‘പ്രായശ്ചിത്തം’ എന്നിവ ഉപയോഗിച്ചു. മൂലത്തിലെ കല്പനാഭാവം ‘ചെയ്യണം’ എന്ന രൂപത്തിലൂടെയും ദൈവിക കർമണി ‘ക്ഷമിക്കപ്പെടും’ എന്ന രൂപത്തിലൂടെയും നിലനിർത്തി.
