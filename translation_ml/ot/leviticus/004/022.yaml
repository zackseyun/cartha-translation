base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: ml
  text: ഒരു നേതാവ്[a] പാപം ചെയ്യുകയും, തന്റെ ദൈവമായ യഹ്‌വെ ചെയ്യരുതെന്നു കല്പിച്ചിട്ടുള്ള കാര്യങ്ങളിൽ ഏതെങ്കിലും ഒന്ന് അബദ്ധവശാൽ[b] ചെയ്യുകയും അങ്ങനെ കുറ്റക്കാരനായിത്തീരുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രഭു’, ‘ഭരണാധികാരി’, ‘തലവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; നָשִׂיא എന്ന എബ്രായപദം അംഗീകൃതനായ ഒരു നേതാവിനെയോ തലവനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അറിയാതെ’ അല്ലെങ്കിൽ ‘മനഃപൂർവമല്ലാതെ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ എബ്രായപദം ഉദ്ദേശിക്കാതെയുള്ള ലംഘനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: നേതാവ്
  rationale: ഈ പദം അംഗീകൃത ഗോത്രത്തലവനെയോ സമൂഹനേതാവിനെയോ സൂചിപ്പിക്കുന്നു; രാജകുമാരൻ എന്ന അർഥത്തിൽ മാത്രം ഒതുങ്ങാത്തതിനാൽ ‘നേതാവ്’ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: יֶחֱטָא
  choice: പാപം ചെയ്യുക
  rationale: חטא എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും ധാർമിക ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: וְעָשָׂה אַחַת מִכָּל
  choice: കാര്യങ്ങളിൽ ഏതെങ്കിലും ഒന്ന് ചെയ്യുക
  rationale: വിലക്കപ്പെട്ട പ്രവൃത്തികളുടെ ആകെത്തുകയിൽനിന്ന് ഒരു പ്രവൃത്തി ചെയ്യുന്നതെന്ന ഭാഗിക അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִצְוֺת יְהוָה אֱלֹהָיו אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: തന്റെ ദൈവമായ യഹ്‌വെ ചെയ്യരുതെന്നു കല്പിച്ചിട്ടുള്ള കാര്യങ്ങൾ
  rationale: കല്പനകളെയും അവയിൽ ഉൾപ്പെട്ട വിലക്കുകളെയും മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; אֱלֹהָיו എന്ന ബന്ധസൂചക പ്രത്യയം ‘തന്റെ ദൈവമായ’ എന്നു നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בִּשְׁגָגָה
  choice: അബദ്ധവശാൽ
  rationale: ലേവ്യപുസ്തകത്തിലെ ബലിയർപ്പണനിയമങ്ങളുടെ സന്ദർഭത്തിൽ മനഃപൂർവമല്ലാതെ സംഭവിക്കുന്ന ലംഘനത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
- source_word: וְאָשֵׁם
  choice: അങ്ങനെ കുറ്റക്കാരനായിത്തീരുക
  rationale: ലംഘനത്തിന്റെ ഫലമായി കുറ്റാവസ്ഥയിൽ ആകുന്നതെന്ന ക്രിയാത്മകവും ഫലസൂചകവുമായ ഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: וְאָשֵׁם സൂചിപ്പിക്കുന്ന കുറ്റാവസ്ഥ
  choice: അങ്ങനെ കുറ്റക്കാരനായിത്തീരുക
  alternative: കുറ്റമുള്ളവനായിരിക്കുക
  rationale: പ്രവൃത്തിയുടെ ഫലമായി കുറ്റം ബാധിക്കുന്നുവെന്ന സാദ്ധ്യതയുള്ള ഫലബന്ധം നിലനിർത്തുന്നു; കുറ്റബോധം തോന്നുന്നു എന്ന മാനസിക അർഥം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ചേർത്തു.
