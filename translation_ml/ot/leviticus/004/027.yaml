  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: ml
  text: സാധാരണ ജനങ്ങളിൽപ്പെട്ട ഒരാൾ[a] അറിയാതെ യഹ്‌വെ വിലക്കിയിട്ടുള്ള ഒരു കാര്യം ചെയ്ത് പാപം ചെയ്യുകയും കുറ്റക്കാരനായിത്തീരുകയും ചെയ്താൽ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: ‘ദേശത്തിലെ ജനങ്ങളിൽപ്പെട്ട ഒരാൾ.’ ചുറ്റുമുള്ള നിയമങ്ങളിൽ പുരോഹിതനോടും നേതാവിനോടും വ്യത്യസ്തമായി സമൂഹത്തിലെ ഒരു സാധാരണ അംഗത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘കുറ്റം വഹിച്ചാൽ’ / ‘കുറ്റക്കാരനായാൽ.’ കുറ്റാവസ്ഥയിൽ പ്രവേശിക്കുന്നതോ കുറ്റം വഹിക്കുന്നതോ ഈ എബ്രായ ക്രിയയ്ക്ക് സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: ഒരാൾ
  rationale: നിയമസന്ദർഭത്തിൽ נֶפֶשׁ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘ഒരാൾ’ ഏകവചനത്തിലുള്ള നിയമവിഷയത്തെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: תֶּחֱטָא
  choice: പാപം ചെയ്താൽ
  rationale: חטא എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടും വ്യക്തവുമായ മലയാളരൂപമാണിത്.
- source_word: בִשְׁגָגָה
  choice: അറിയാതെ
  rationale: യാഗനിയമങ്ങളിൽ ഈ പദം മനഃപൂർവമല്ലാത്ത, അശ്രദ്ധയാലോ അബദ്ധത്താലോ സംഭവിക്കുന്ന ലംഘനത്തെ സൂചിപ്പിക്കുന്നു; ‘അറിയാതെ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: מֵעַם הָאָרֶץ
  choice: സാധാരണ ജനങ്ങളിൽപ്പെട്ട
  rationale: ചുറ്റുമുള്ള നിയമങ്ങളിൽ പുരോഹിതനിൽനിന്നും നേതാവിൽനിന്നും വേർതിരിച്ചുള്ള സമൂഹത്തിലെ സാധാരണ അംഗത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; പദശഃ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בַּעֲשֹׂתָהּ אַחַת מִמִּצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: യഹ്‌വെ വിലക്കിയിട്ടുള്ള ഒരു കാര്യം ചെയ്ത്
  rationale: ചെയ്യരുതെന്ന കല്പനകളിൽ ഒന്നിനെ പ്രവർത്തിച്ചതാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ അസ്വാഭാവികമായ പദാനുപദ ഘടന ഒഴിവാക്കി നിരോധനവും പ്രവൃത്തിയും ഒരുപോലെ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְאָשֵׁם
  choice: കുറ്റക്കാരനായിത്തീർന്നാൽ
  rationale: പ്രവൃത്തിയുടെ ഫലമായി കുറ്റാവസ്ഥയിൽ പ്രവേശിക്കുന്നതെന്ന ക്രിയയുടെ ഭാവം നിലനിർത്തുന്നു; ‘കുറ്റം വഹിച്ചാൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: מֵעַם הָאָרֶץ എന്ന പ്രയോഗത്തിന്റെ സാമൂഹിക-നിയമപരമായ അർഥം
  choice: സാധാരണ ജനങ്ങളിൽപ്പെട്ട
  alternative: ദേശത്തിലെ ജനങ്ങളിൽപ്പെട്ട
  rationale: ഈ അധ്യായത്തിൽ അഭിഷിക്തപുരോഹിതൻ, സഭ, നേതാവ് എന്നിവരോടുള്ള വൈരുധ്യത്തിൽ സാധാരണ സമൂഹാംഗത്തെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുകയും പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: וְאָשֵׁם എന്ന ക്രിയയുടെ ഭാവം
  choice: കുറ്റക്കാരനായിത്തീർന്നാൽ
  alternative: കുറ്റം വഹിച്ചാൽ / കുറ്റക്കാരനായാൽ
  rationale: നിരോധിത പ്രവൃത്തിയിൽനിന്ന് ഉണ്ടാകുന്ന നിയമപരമായ കുറ്റാവസ്ഥയിലേക്കുള്ള നീക്കം ഈ രൂപം പ്രകടമാക്കുന്നു; അതിനപ്പുറമുള്ള സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. എബ്രായവാക്യത്തിലെ വ്യവസ്ഥാപക ഘടനയും അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന അപൂർണതയും അവസാനത്തിലെ ദീർഘരേഖയിലൂടെ നിലനിർത്തി. ‘യഹ്‌വെ’ ദൈവനാമത്തിന്റെ ലിപ്യന്തരമാണ്.
