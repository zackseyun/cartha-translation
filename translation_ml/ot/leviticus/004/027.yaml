  naturalness: ‘സാധാരണ ജനങ്ങളിൽപ്പെട്ട’, ‘അറിയാതെ’, ‘കുറ്റക്കാരനായിത്തീരുകയും’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായ നിയമപരമായ ശൈലി നൽകുന്നു. പരിഷ്കരിച്ച വാചകം വിശദീകരണ ഇടച്ചേർക്കലില്ലാതെ കൂടുതൽ ഒഴുക്കോടെ വായിക്കാം; വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം ദീർഘരേഖ നിലനിർത്തിയിരിക്കുന്നു.
