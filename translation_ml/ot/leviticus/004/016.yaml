source:
  edition: WLC
  text: וְ/הֵבִ֛יא הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר אֶל אֹ֖הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/016.yaml
  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: ml
  text: പിന്നെ അഭിഷിക്തനായ പുരോഹിതൻ കാളയുടെ രക്തത്തിൽനിന്ന് കുറച്ച് സമാഗമകൂടാരത്തിനകത്തേക്ക് കൊണ്ടുവരണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “കാളയുടെ രക്തത്തിൽനിന്ന്.” ഇവിടെ എബ്രായ പ്രയോഗം രക്തത്തിന്റെ ഒരു ഭാഗം മാത്രമാണ് കൊണ്ടുവരുന്നതെന്ന് സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “സമാഗമകൂടാരം” എന്നതിന് പരമ്പരാഗത പരിഭാഷകളിൽ “തിരുനിവാസം” എന്നും കാണാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵבִיא
  choice: പിന്നെ ... കൊണ്ടുവരണം
  rationale: സംയോജക വാവോടുകൂടിയ ഹിഫീൽ ക്രിയ നിയമപരമായ നടപടിക്രമത്തിലെ അടുത്ത ഘട്ടത്തെ സൂചിപ്പിക്കുന്നു. ‘പിന്നെ’ ക്രമാനുക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘കൊണ്ടുവരണം’ നിർദേശത്തിന്റെ ബാധ്യതയും നൽകുന്നു.
- source_word: הַ/כֹּהֵן הַ/מָּשִׁיחַ
  choice: അഭിഷിക്തനായ പുരോഹിതൻ
  rationale: ഇവിടെ הַמָּשִׁיחַ അഭിഷേകത്തിലൂടെ സ്ഥാനമേൽപ്പിക്കപ്പെട്ട പുരോഹിതനെ വിശേഷിപ്പിക്കുന്നു; മിശിഹായെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരല്ല. ‘അഭിഷിക്തനായ’ എബ്രായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מִ/דַּם הַ/פָּר
  choice: കാളയുടെ രക്തത്തിൽ കുറച്ച്
  rationale: 'מִן ഇവിടെ ഭാഗസൂചകമായി മനസ്സിലാക്കുന്നതാണ് ആചാരസന്ദർഭത്തിന് യോജിച്ചത്: മുഴുവൻ രക്തമല്ല, അതിൽ ഒരു ഭാഗമാണ് അകത്തേക്കു കൊണ്ടുവരുന്നത്. ഈ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.'
- source_word: אֶל
  choice: അകത്തേക്കു
  rationale: אֶל സാധാരണയായി ‘അടുത്തേക്ക്/ലേക്ക്’ എന്നർഥമുള്ളതാണെങ്കിലും, രക്തം വിശുദ്ധകൂടാരത്തിലേക്കു കൊണ്ടുവരുന്ന ഈ ചലനസന്ദർഭത്തിൽ അകത്തേക്കുള്ള പ്രവേശനം ലക്ഷ്യമാണെന്ന് വ്യക്തമാക്കാൻ ‘അകത്തേക്കു’ യോജിക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവസന്നിധിയിൽ കൂടിവരുന്നതിനുള്ള വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന പരിചിതവും അർഥസുതാര്യവുമായ മലയാളപദം.
theological_decisions:
- issue: പുരോഹിതസന്ദർഭത്തിൽ הַמָּשִׁיחַ എന്നതിന്റെ പരിഭാഷ
  choice: അഭിഷിക്തനായ
  alternative: പ്രതിഷ്ഠിക്കപ്പെട്ട / മിശിഹാ
  rationale: ഈ പദം ഇവിടെ അഭിഷേകത്തിലൂടെ സ്ഥാനമേൽപ്പിക്കപ്പെട്ട പുരോഹിതനെ വിവരിക്കുന്നു. ‘പ്രതിഷ്ഠിക്കപ്പെട്ട’ എന്നത് വ്യാഖ്യാനപരമാണ്; ‘മിശിഹാ’ എന്നു നൽകുന്നത് ഈ ആചാരസന്ദർഭത്തിൽ തെറ്റിദ്ധരിപ്പിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമപരമായ ആചാരനിർദേശത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ശൈലി. ‘സമാഗമകൂടാരം’ മലയാള ബൈബിൾ പ്രയോഗപരിചയം നിലനിർത്തുന്നു; ഭാഗസൂചകമായ מִן മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കിയിട്ടുണ്ട്.
