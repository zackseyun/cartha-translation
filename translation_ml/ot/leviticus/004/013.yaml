    issue: Literal calque in the awareness idiom
    rationale: ‘സഭയുടെ കണ്ണുകളിൽനിന്ന്’ is understandable but unnatural in modern standard Malayalam. The Hebrew ‘from the eyes of the assembly’ is idiomatically expressed as escaping the assembly’s notice.
