id: LEV.4.13
reference: Leviticus 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: ml
  text: ഇസ്രായേൽസമൂഹം മുഴുവനും അറിയാതെ പാപം ചെയ്യുകയും[a], ആ കാര്യം സഭയുടെ ശ്രദ്ധയിൽപ്പെടാതെപോകുകയും[b], യഹ്‌വെ ചെയ്യരുതെന്നു കല്പിച്ച കാര്യങ്ങളിൽ ഒന്ന് അവർ ചെയ്യുകയും അങ്ങനെ കുറ്റക്കാരായിത്തീരുകയും ചെയ്താൽ—[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അറിയാതെ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായക്രിയ ഇവിടെ മനഃപൂർവമായ ധിക്കാരമല്ല, അബദ്ധത്താലോ അറിവില്ലായ്മയാലോ സംഭവിച്ച പാപത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘സഭയുടെ കണ്ണുകളിൽനിന്ന് മറഞ്ഞിരിക്കുക’; ആ കാര്യം സമൂഹത്തിന്റെ ശ്രദ്ധയിൽപ്പെടാതെപോയി എന്നർഥമുള്ള പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘കുറ്റക്കാരായിത്തീരുക’ എന്നതിന് ‘കുറ്റബാധ്യത വരുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: ഇസ്രായേൽസമൂഹം
  rationale: עֵדָה ഇവിടെ ഇസ്രായേൽജനതയെ ഒരു സമഗ്രമായ ആരാധനാ-നിയമസമൂഹമായി സൂചിപ്പിക്കുന്നു. പിന്നാലെയുള്ള קהל-ൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്താൻ ഇതിനെ ‘സമൂഹം’ എന്നും അതിനെ ‘സഭ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: יִשְׁגּוּ
  choice: അറിയാതെ പാപം ചെയ്യുക
  rationale: ശׁגה എന്ന ക്രിയ ലേവ്യപുസ്തകം 4-ലെ യാഗനിയമസന്ദർഭത്തിൽ മനഃപൂർവമായ ധിക്കാരമല്ല, അറിവില്ലായ്മയാലോ അബദ്ധത്താലോ സംഭവിക്കുന്ന പാപത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְנֶעְלַם דָּבָר
  choice: ആ കാര്യം മറഞ്ഞിരിക്കുക
  rationale: കുറ്റകരമായ പ്രവൃത്തി സമൂഹം തിരിച്ചറിയാതെപോയെന്ന ആശയം നൽകുന്ന എബ്രായ നിഷ്ക്രിയപ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: מֵעֵינֵי הַקָּהָל
  choice: സഭയുടെ കണ്ണുകളിൽനിന്ന്
  rationale: തിരിച്ചറിവിനെയും ശ്രദ്ധയെയും സൂചിപ്പിക്കുന്ന ‘കണ്ണുകൾ’ എന്ന എബ്രായ രൂപകം നിലനിർത്തി; קהל എന്ന പദത്തിന് ഇവിടെ ‘സഭ’ ഉപയോഗിച്ചു.
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: യഹ്‌വെ ചെയ്യരുതെന്നു കല്പിച്ചിട്ടുള്ള കാര്യങ്ങളിൽ ഏതെങ്കിലും ഒന്ന് അവർ ചെയ്യുക
  rationale: നിരോധിക്കപ്പെട്ട പ്രവൃത്തികളുടെ സമുച്ചയത്തിൽനിന്ന് ഒന്ന് ചെയ്യുന്നതാണ് വാക്യഘടനയുടെ അർഥം. മലയാളത്തിൽ സ്വാഭാവികമായി വരുന്നതിനായി ‘കല്പന ചെയ്യുക’ എന്ന കൃത്രിമപ്രയോഗം ഒഴിവാക്കി അർഥബന്ധം വ്യക്തമാക്കി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ഉച്ചാരണസൗകര്യമുള്ള ലിപ്യന്തരണമായി നൽകി.
- source_word: וְאָשֵׁמוּ
  choice: അങ്ങനെ കുറ്റക്കാരായിത്തീരുക
  rationale: പ്രവൃത്തിയുടെ ഫലമായി കുറ്റബാധ്യതയുള്ള നിലയിൽ എത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ഫലാവസ്ഥ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശׁגה സൂചിപ്പിക്കുന്ന പാപത്തിന്റെ സ്വഭാവം
  choice: അറിയാതെ ചെയ്ത പാപം
  alternative: തെറ്റിപ്പോകുക / അബദ്ധം ചെയ്യുക
  rationale: ഈ അധ്യായത്തിലെ യാഗനിയമം മനഃപൂർവമായ ധിക്കാരത്തെക്കാൾ അറിവില്ലാതെ സംഭവിച്ച ലംഘനത്തെക്കുറിച്ചാണ്; എന്നാൽ ‘അറിയാതെ’ എന്നത് ഉത്തരവാദിത്വമില്ലെന്ന് സൂചിപ്പിക്കാതിരിക്കാൻ ‘പാപം ചെയ്യുക’ എന്നും നിലനിർത്തി.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമസ്വഭാവം സംരക്ഷിക്കാൻ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു; സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിച്ചില്ല.
- issue: സമൂഹത്തിന്റെ അറിവില്ലായ്മയും കുറ്റബാധ്യതയും തമ്മിലുള്ള സംഘർഷം
  choice: അറിവില്ലായ്മയും തുടർന്ന് ഉണ്ടാകുന്ന കുറ്റാവസ്ഥയും രണ്ടും തുറന്നുവച്ചു
  alternative: അറിഞ്ഞില്ലാത്തതിനാൽ കുറ്റമില്ലെന്നോ കുറ്റം മനഃപൂർവമാണെന്നോ വിശദീകരിക്കുക
  rationale: മൂലപാഠം കാര്യം സമൂഹത്തിന്റെ ശ്രദ്ധയിൽപ്പെടാതെ പോയെന്നും എന്നിരുന്നാലും അവർ കുറ്റക്കാരായിത്തീർന്നെന്നും പറയുന്നു; ഈ നിയമ-ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചുകളഞ്ഞില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമപരവും ആരാധനാസംബന്ധവുമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടന ഉപയോഗിച്ചു. עֵדָה / קהל വ്യത്യാസം ‘സമൂഹം’ / ‘സഭ’ എന്നിങ്ങനെ സൂക്ഷിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നൽകി.
