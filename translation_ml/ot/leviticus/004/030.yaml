  revised_text: പുരോഹിതൻ അതിന്റെ രക്തത്തിൽ നിന്ന് കുറച്ച്[a] തന്റെ വിരൽകൊണ്ട് എടുത്ത് ഹോമയാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ[b] പുരട്ടണം; അതിന്റെ രക്തം മുഴുവനും[c] യാഗപീഠത്തിന്റെ ചുവട്ടിൽ ഒഴിക്കണം.
