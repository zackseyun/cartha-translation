  source_fidelity: 'മുഖ്യവാചകം എബ്രായ യാഗക്രമത്തെ പൊതുവേ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു: രക്തത്തിൽനിന്ന് ഒരു ഭാഗം വിരൽകൊണ്ട് എടുത്ത് യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ ഇടുകയും, പിന്നെ രക്തം മുഴുവനും പീഠത്തിന്റെ അടിയിൽ ഒഴിക്കുകയും ചെയ്യണം. എന്നാൽ അടിക്കുറിപ്പ് a-യുടെ ഉള്ളടക്കവും അതിന്റെ സ്ഥാനവും מִדָּמָהּ (‘അതിന്റെ രക്തത്തിൽനിന്ന്/രക്തത്തിൽനിന്ന് കുറച്ച്’) എന്ന പദത്തോടു ചേരുന്നില്ല. അതു ശരിയാക്കുകയും, ‘ഒഴിച്ചുകളയണം’ എന്നതിനു പകരം മൂലക്രിയയായ שׁפך-നോട് കൂടുതൽ നേരിട്ട് ചേരുന്ന ‘ഒഴിക്കണം’ ഉപയോഗിക്കുകയും വേണം.'
  naturalness: ‘ഹോമയാഗപീഠം,’ ‘കൊമ്പുകൾ,’ ‘യാഗപീഠത്തിന്റെ ചുവട്ടിൽ’ എന്നിവ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വ്യക്തവും അനുയോജ്യവുമാണ്. ‘രക്തത്തിൽ നിന്ന്’ എന്ന വേർതിരിച്ചെഴുത്ത് സാധാരണ ലിപിപ്രയോഗത്തോടു കൂടുതൽ ഒത്തിരിക്കുന്നു.
