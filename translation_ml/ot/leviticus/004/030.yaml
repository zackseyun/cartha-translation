source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: ml
  text: പുരോഹിതൻ അതിന്റെ രക്തത്തിൽ നിന്ന് കുറച്ച്[a] തന്റെ വിരൽകൊണ്ട് എടുത്ത് ഹോമയാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ[b] പുരട്ടണം; അതിന്റെ രക്തം മുഴുവനും[c] യാഗപീഠത്തിന്റെ ചുവട്ടിൽ ഒഴിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അതിന്റെ രക്തത്തിൽനിന്ന്.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “അതിന്റെ രക്തത്തിൽനിന്ന്” എന്നാണ്; ഇവിടെ പുരോഹിതൻ യാഗപീഠത്തിൽ പുരട്ടുന്നതിനായി രക്തത്തിന്റെ ഒരു ഭാഗം എടുക്കുന്നു എന്ന ഭാഗസൂചക അർഥമാണ് സാധ്യതയുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: “കൊമ്പുകൾ” എന്നത് യാഗപീഠത്തിന്റെ മൂലകളിൽ കൊമ്പുപോലെ ഉയർന്നുനിന്നിരുന്ന ഭാഗങ്ങളാണ്.
    reason: cultural_note
  - marker: c
    text: “രക്തം മുഴുവനും” എന്നാണ് എബ്രായപാഠം. എന്നാൽ മുമ്പ് കുറച്ച് രക്തം കൊമ്പുകളിൽ പുരട്ടിയതിനാൽ, ഇവിടെ ശേഷിച്ച രക്തം മുഴുവനുമാണ് ഉദ്ദേശ്യമെന്ന് പ്രവൃത്തിക്രമം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח הַכֹּהֵן
  choice: പുരോഹിതൻ ... എടുത്ത്
  rationale: നിയമപരമായ യാഗക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ പ്രവൃത്തികളുടെ നിർദേശാത്മക അനുക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; കർത്താവിന്റെ നിർദ്ദിഷ്ടതയും നിലനിർത്തുന്നു.
- source_word: מִדָּמָהּ
  choice: അതിന്റെ രക്തത്തിൽനിന്ന് കുറച്ച്
  rationale: 'מִן ഇവിടെ ഭാഗസൂചകമായി പ്രവർത്തിക്കുന്നു: ഈ ഘട്ടത്തിൽ മുഴുവൻ രക്തമല്ല, അതിൽ ഒരു ഭാഗമാണ് എടുക്കുന്നത്.'
- source_word: בְּאֶצְבָּעוֹ
  choice: തന്റെ വിരൽകൊണ്ട്
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ കരണാർഥം നിലനിർത്തുന്നു; പുരോഹിതൻ രക്തം പ്രയോഗിക്കുന്ന ഉപാധി വിരലാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וְנָתַן
  choice: പുരട്ടണം
  rationale: נתן എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘വയ്ക്കുക’ ആണെങ്കിലും, വിരൽകൊണ്ട് രക്തം യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ ഇടുന്ന ഈ ആചാരസന്ദർഭത്തിൽ ‘പുരട്ടുക’ സ്വാഭാവികവും പ്രവൃത്തിയുടെ സ്വഭാവം കൃത്യമായി അറിയിക്കുന്നതുമാണ്.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: ഹോമയാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ
  rationale: ‘കൊമ്പുകൾ’ എന്ന പ്രത്യേക ആരാധനാകർമപദം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; ഹോമയാഗവുമായി ബന്ധപ്പെട്ട യാഗപീഠം എന്ന ബന്ധവും സംക്ഷിപ്തമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: അതിന്റെ രക്തം മുഴുവനും
  rationale: כָּל എന്ന സമഗ്രപദം മുഖ്യവാചകത്തിൽ അതേപടി സംരക്ഷിക്കുന്നു; നേരത്തെ കുറച്ച് രക്തം ഉപയോഗിച്ചതിനാൽ ശേഷിച്ചതാണ് ഉദ്ദേശ്യമെന്ന സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִשְׁפֹּךְ
  choice: ഒഴിച്ചുകളയണം
  rationale: യാഗകർമസന്ദർഭത്തിലെ שׁפך എന്ന ക്രിയയുടെ ‘ഒഴിക്കുക’ എന്ന അർഥവും നിർദേശാത്മക ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ ചുവട്ടിൽ
  rationale: יְסוֹד എന്നത് ഇവിടെ യാഗപീഠത്തിന്റെ അടിഭാഗം അഥവാ ചുവട് സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് ‘ചുവട്ടിൽ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: യാഗക്രമനിർദേശത്തിലെ ക്രിയാഭാവം
  choice: ‘പുരട്ടണം ... ഒഴിച്ചുകളയണം’ എന്ന നിർദേശാത്മക രൂപം
  alternative: ‘എടുത്തു ... പുരട്ടി ... ഒഴിച്ചു’ എന്ന ഭൂതകാല വിവരണം
  rationale: എബ്രായ ക്രിയാരൂപങ്ങൾ ഒറ്റയ്ക്ക് നോക്കുമ്പോൾ ഭൂതകാലസദൃശമായി തോന്നാമെങ്കിലും, ഭാഗത്തിന്റെ സാഹിത്യരൂപം നിയമപരമായ യാഗക്രമനിർദേശമാണ്; അതിനാൽ നിർദേശാത്മക മലയാളം യോജിക്കുന്നു.
- issue: യാഗപീഠത്തിലെ קַרְנֹת എന്ന പദം
  choice: ‘കൊമ്പുകൾ’ എന്ന അക്ഷരാർഥ ആരാധനാകർമപദം നിലനിർത്തി
  alternative: ‘മൂലകളിലെ തള്ളിനിൽക്കുന്ന ഭാഗങ്ങൾ’ എന്ന പ്രവർത്തനാത്മക വിവരണം
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ദൃശ്യവും ആരാധനാകർമസങ്കേതവും മായ്ച്ചുകളയാതെ സൂക്ഷിക്കുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘രക്തം മുഴുവനും’ എന്നതും മുമ്പ് എടുത്ത ഭാഗവും തമ്മിലുള്ള പിരിമുറുക്ക്
  choice: כָּל അനുസരിച്ച് മുഖ്യവാചകത്തിൽ ‘രക്തം മുഴുവനും’ നിലനിർത്തി
  alternative: സന്ദർഭത്തെ വ്യാഖ്യാനിച്ച് ‘ശേഷിച്ച രക്തം മുഴുവനും’ എന്ന് മുഖ്യവാചകത്തിൽ ചേർക്കുക
  rationale: മൂലപാഠത്തിന്റെ വാക്കുകൾ സംരക്ഷിക്കുകയും, പ്രവൃത്തിക്രമം ശേഷിച്ച രക്തത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിലേക്ക് മാറ്റുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാഗകർമത്തിന്റെ സാങ്കേതിക പദങ്ങളായ ‘ഹോമയാഗപീഠം’, ‘കൊമ്പുകൾ’ എന്നിവ നിലനിർത്തി; ആശയവ്യക്തതയ്ക്ക് ആവശ്യമായ വിശദീകരണം അടിക്കുറിപ്പുകളിൽ നൽകി.
