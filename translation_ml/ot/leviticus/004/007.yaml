  to: പുരോഹിതൻ രക്തത്തിൽനിന്ന് കുറച്ച് യഹ്‌വേയുടെ സന്നിധിയിൽ, സമാഗമകൂടാരത്തിലുള്ള സുഗന്ധധൂപപീഠത്തിന്റെ[a] കൊമ്പുകളിൽ പുരട്ടണം. കാളയുടെ രക്തം മുഴുവനും[b] സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിലുള്ള ഹോമയാഗപീഠത്തിന്റെ ചുവട്ടിൽ ഒഴിക്കണം.
