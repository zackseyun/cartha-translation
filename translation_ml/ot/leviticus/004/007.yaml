  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: ml
  text: പുരോഹിതൻ രക്തത്തിൽനിന്ന് കുറച്ച് യഹ്‌വേയുടെ സന്നിധിയിൽ, സമാഗമകൂടാരത്തിലുള്ള സുഗന്ധധൂപപീഠത്തിന്റെ[a] കൊമ്പുകളിൽ പുരട്ടണം. കാളയുടെ രക്തം മുഴുവനും[b] സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിലുള്ള ഹോമയാഗപീഠത്തിന്റെ ചുവട്ടിൽ ഒഴിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ധൂപപീഠം.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “കാളയുടെ രക്തം മുഴുവനും.” പീഠത്തിന്റെ കൊമ്പുകളിൽ കുറച്ച് രക്തം പുരട്ടിക്കഴിഞ്ഞതിനാൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് ശേഷിച്ച രക്തം മുഴുവനുമാണ്.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְנָתַן
  choice: പുരട്ടണം
  rationale: രക്തം യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ ഇടുന്ന ആചാരക്രിയയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും കൃത്യമായും അറിയിക്കുന്നു; പൊതുവായ ‘വയ്ക്കണം’ എന്നതിനെക്കാൾ ഈ സാഹചര്യത്തിൽ വ്യക്തമാണ്.
- source_word: מִן הַדָּם
  choice: രക്തത്തിൽ കുറച്ച് എടുത്ത്
  rationale: מִן ഇവിടെ ഭാഗികത സൂചിപ്പിക്കുന്നു. രക്തത്തിന്റെ ഒരു ഭാഗമാണ് ഉപയോഗിക്കുന്നതെന്ന് വ്യക്തമായി പറയുന്നു.
- source_word: קַרְנוֹת
  choice: കൊമ്പുകൾ
  rationale: യാഗപീഠത്തിന്റെ പുറത്തേക്കു തള്ളിനിൽക്കുന്ന കോണുകൾക്കുള്ള പരമ്പരാഗതവും കൃത്യവുമായ ആരാധനാപദം നിലനിർത്തുന്നു.
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: സുഗന്ധധൂപപീഠം
  rationale: സുഗന്ധവ്യഞ്ജനങ്ങളാൽ തയ്യാറാക്കിയ ധൂപത്തെയും അതിനുള്ള യാഗപീഠത്തെയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: സ്ഥലപരവും ആരാധനാപരവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ദൈവനാമം പദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ ആരാധനാസന്ദർഭത്തിലെ നിശ്ചിത കൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്കു പരിചിതവും അർഥസമ്പന്നവുമായ പദമാണ്.
- source_word: כָּל דַּם הַפָּר
  choice: കാളയുടെ രക്തം മുഴുവനും
  rationale: ഹീബ്രുവിലെ ‘കാളയുടെ രക്തം മുഴുവനും’ എന്ന വ്യക്തമായ രൂപം നിലനിർത്തുന്നു. മുമ്പ് കുറച്ച് രക്തം ഉപയോഗിച്ചതിനാൽ പ്രായോഗികമായി ശേഷിച്ച രക്തമാണ് ഉദ്ദേശ്യമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִשְׁפֹּךְ
  choice: ഒഴിച്ചുകളയണം
  rationale: ശേഷിക്കുന്ന രക്തം പീഠത്തിന്റെ ചുവട്ടിൽ പൂർണമായി ഒഴിക്കുന്ന ഭൗതികക്രിയയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְסוֹד מִזְבַּח הָעֹלָה
  choice: ഹോമയാഗപീഠത്തിന്റെ ചുവട്
  rationale: יְסוֹד എന്ന അടിസ്ഥാനം/ചുവട് എന്ന അർഥവും עֹלָה എന്ന സമ്പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തിന്റെ സ്ഥാപിത മലയാളനാമവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പതിവായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: മുമ്പ് കുറച്ച് രക്തം ഉപയോഗിച്ചശേഷമുള്ള כָּל דַּם הַפָּר
  choice: കാളയുടെ രക്തം മുഴുവനും
  alternative: കാളയുടെ ശേഷിച്ച രക്തം മുഴുവനും
  rationale: ‘ശേഷിച്ച’ എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും ഹീബ്രു അത് തുറന്നു പറയുന്നില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ മൂലരൂപം നിലനിർത്തി സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ആചാരക്രമവും ബന്ധങ്ങളും അതേപടി നിലനിർത്തി.
