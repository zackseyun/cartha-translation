  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶצְבָּע֖/וֹ מִן הַ/דָּ֑ם וְ/הִזָּ֞ה שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֵ֖ת פְּנֵ֥י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ തന്റെ വിരൽ രക്തത്തിൽ മുക്കി, യഹ്‌വെയുടെ സന്നിധിയിൽ, തിരശ്ശീലയ്ക്കു[a] മുന്നിൽ അതിൽനിന്ന് ഏഴു പ്രാവശ്യം തളിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മറശ്ശീല.’ വിശുദ്ധമന്ദിരത്തിലെ വിശുദ്ധ ഇടങ്ങളെ വേർതിരിക്കുന്ന തിരശ്ശീലയെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטָבַל
  choice: പിന്നെ ... മുക്കി
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘മുക്കുക’ നിലനിർത്തുന്നു; വാവ്-തുടർച്ച സൂചിപ്പിക്കുന്ന ആചാരക്രമം ‘പിന്നെ’ എന്നതിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: യാഗനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം; നിർദിഷ്ടത സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: אֶצְבָּעוֹ
  choice: തന്റെ വിരൽ
  rationale: ഏകവചനം നിലനിർത്തുന്നു; മലയാളത്തിലെ പ്രതിഫലക ഉടമസ്ഥരൂപം കർത്താവായ പുരോഹിതനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִן הַדָּם
  choice: രക്തത്തിൽ ... ആ രക്തത്തിൽ കുറച്ച്
  rationale: טבל-നോടൊപ്പമുള്ള מן രക്തത്തിൽ വിരൽ മുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള തളിക്കലിൽ ‘കുറച്ച്’ ചേർത്ത് ഉപയോഗിക്കുന്നത് രക്തത്തിന്റെ ഒരു ഭാഗം മാത്രമാണെന്ന ഭാഗികത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהִזָּה
  choice: തളിക്കണം
  rationale: പുരോഹിതാചാരത്തിൽ ദ്രാവകം, പ്രത്യേകിച്ച് രക്തം, തളിക്കുന്ന പ്രവൃത്തിക്കുള്ള സ്വാഭാവിക പദം; നിയമനിർദേശത്തിന്റെ പ്രാബല്യം ‘ണം’ രൂപം നൽകുന്നു.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: സംഖ്യയും ആവർത്തനവും നേരിട്ട് നിലനിർത്തുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥം ആചാരസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: തിരശ്ശീലയുടെ മുൻവശത്ത്
  rationale: ‘തിരശ്ശീലയുടെ മുഖം/മുൻഭാഗം’ എന്ന എബ്രായപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; פָּרֹכֶת വിശുദ്ധസ്ഥലത്തെ വേർതിരിക്കുന്ന തിരശ്ശീലയാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ഉച്ചാരണത്തിന്റെ പുനർനിർമാണസ്വഭാവം അംഗീകരിച്ചുകൊണ്ട് വ്യാപകമായ ‘Yahweh’ രൂപത്തോട് യോജിക്കുന്ന മലയാളലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: פָּרֹכֶת എന്ന വിശുദ്ധമന്ദിര വസ്തുവിന്റെ പേര്
  choice: തിരശ്ശീല
  alternative: മറശ്ശീല
  rationale: വിശുദ്ധ ഇടങ്ങളെ വേർതിരിക്കുന്ന മന്ദിരത്തിലെ തൂക്കുവസ്തുവിനെ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; പിന്നീട് രൂപപ്പെട്ട സഭാപരമായ പ്രത്യേക അർഥങ്ങൾ അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാഗക്രമത്തിന്റെ തുടർച്ച ‘പിന്നെ’ എന്നും നിർദേശസ്വഭാവം ‘തളിക്കണം’ എന്നും പ്രകടമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘തിരശ്ശീല’ എന്ന പദത്തിനോടുതന്നെ ചേർത്തിരിക്കുന്നു.
