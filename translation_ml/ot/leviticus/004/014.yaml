source:
  edition: WLC
  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: ml
  text: അവർ ചെയ്ത പാപം അറിവിൽ വരുമ്പോൾ[a], ജനസമൂഹം പാപയാഗമായി കന്നുകാലിക്കൂട്ടത്തിലെ ഒരു കാളയെ അർപ്പിക്കുകയും അതിനെ സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽ കൊണ്ടുവരികയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഈ വാക്യത്തിൽ ഹീബ്രുവിലെ חַטָּאת (ഖത്താത്ത്) എന്ന ഒരേ പദം രണ്ടുതവണ വരുന്നു: ആദ്യം ‘പാപം’ എന്ന അർഥത്തിലും പിന്നീട് ‘പാപയാഗം’ എന്ന അർഥത്തിലും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: വെളിപ്പെട്ടാൽ
  rationale: ידע എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം പാപം അറിയപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആരാണ് കണ്ടെത്തിയതെന്ന് വ്യക്തമാക്കാതെ, സംഭവം അറിവിലാകുന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַֽחַטָּאת
  choice: പാപം
  rationale: തുടർന്നുള്ള ‘അവർ ചെയ്ത’ എന്ന ബന്ധവാക്യം ഇവിടെ യാഗത്തെയല്ല, അവർ ചെയ്ത പാപത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: അവർ ചെയ്ത
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ ‘പാപം ചെയ്യുക’ എന്ന സംയോജനത്തിലൂടെ നൽകുന്നു.
- source_word: הַקָּהָל
  choice: സഭ
  rationale: ആരാധനാ-നിയമപരമായ സന്ദർഭത്തിലെ ഒത്തുകൂടിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളപദം.
- source_word: וְהִקְרִיבוּ
  choice: അർപ്പിക്കുകയും
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപത്തിന് യാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക’ എന്ന അർഥമുണ്ട്; പിന്നാലെയുള്ള ‘കൊണ്ടുവരുക’ എന്ന ക്രിയയിൽനിന്നും ഇത് വ്യക്തമായി വേർതിരിയുന്നു.
- source_word: פַּר בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാളയെ
  rationale: പദസമുച്ചയം കന്നുകാലിവർഗത്തിൽപ്പെട്ട ഒരു കാളയെ സൂചിപ്പിക്കുന്നു. ‘കന്നുകാലിയുടെ മകനായ കാള’ എന്ന പദാനുപദരൂപത്തെക്കാൾ ഇത് സ്വാഭാവികവും അർഥസമ്പൂർണ്ണവുമാണ്.
- source_word: לְחַטָּאת
  choice: പാപയാഗമായി
  rationale: ഇവിടെ חטאת പാപത്തെയല്ല, നിർദേശിക്കപ്പെട്ട യാഗവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: അതിനെ ... കൊണ്ടുവരികയും
  rationale: സർവനാമം കാളയെ സൂചിപ്പിക്കുന്നു; בוא എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപം ‘കൊണ്ടുവരുക’ എന്നാണ്.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽ
  rationale: ആരാധനാസ്ഥലത്തിന്റെ പേരും അതിന്റെ മുമ്പിലുള്ള സ്ഥാനവും കൃത്യമായും പരിചിതമായും നൽകുന്നു.
theological_decisions:
- issue: חטאת എന്ന ഒരേ പദം ഈ വാക്യത്തിൽ രണ്ടർഥങ്ങളിൽ വരുന്നത്
  choice: ആദ്യത്തേത് ‘പാപം’ എന്നും രണ്ടാമത്തേത് ‘പാപയാഗം’ എന്നും പരിഭാഷപ്പെടുത്തി
  alternative: രണ്ടിടത്തും ഒരേ മലയാളപദം ഉപയോഗിക്കുക; അല്ലെങ്കിൽ രണ്ടാമത്തേത് ‘ശുദ്ധീകരണയാഗം’ എന്നു നൽകുക
  rationale: ‘അവർ ചെയ്ത’ എന്ന ബന്ധവാക്യം ആദ്യപ്രയോഗം കുറ്റകൃത്യമായ പാപമാണെന്ന് വ്യക്തമാക്കുന്നു; לְחַטָּאת എന്ന രണ്ടാമത്തെ പ്രയോഗം യാഗവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭാനുസൃതമായ ഈ വ്യത്യാസം അർഥവ്യക്തത കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സഭ’, ‘പാപയാഗം’, ‘സമാഗമകൂടാരം’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നിലനിർത്തി.
