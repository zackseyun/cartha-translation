  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת ע֤וֹר הַ/פָּר֙ וְ/אֶת כָּל בְּשָׂר֔/וֹ עַל רֹאשׁ֖/וֹ וְ/עַל כְּרָעָ֑י/ו וְ/קִרְבּ֖/וֹ וּ/פִרְשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: ml
  text: എന്നാൽ കാളയുടെ തോലും അതിന്റെ മാംസം മുഴുവനും—തലയും കാലുകളും ആന്തരാവയവങ്ങളും ചാണകവും ഉൾപ്പെടെ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹר
  choice: തോൽ
  rationale: യാഗസന്ദർഭത്തിൽ അറുക്കപ്പെട്ട മൃഗത്തിന്റെ പുറംതൊലിയെ സ്വാഭാവികവും കൃത്യവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַפָּר
  choice: കാള
  rationale: פַּר കാളയെയോ ഇളംകാളയെയോ സൂചിപ്പിക്കാം; ഇവിടെ പ്രായം പ്രത്യേകം ഊന്നാത്തതിനാൽ ‘കാള’ മതിയാകുന്നു.
- source_word: כָּל בְּשָׂרוֹ
  choice: അതിന്റെ മാംസം മുഴുവനും
  rationale: בָּשָׂר എന്നതിന്റെ മൂർത്തമായ ശാരീരിക അർഥം നിലനിർത്തുന്നു; ‘ശരീരം’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: עַל רֹאשׁוֹ וְעַל כְּרָעָיו
  choice: തലയും കാലുകളും … ഉൾപ്പെടെ
  rationale: ഈ പട്ടികയിൽ עַל ഉൾപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘മേൽ’ മലയാളത്തിൽ തെറ്റായ ബന്ധം തോന്നിപ്പിക്കും.
- source_word: קִרְבּוֹ
  choice: ആന്തരാവയവങ്ങൾ
  rationale: യാഗവുമായി ബന്ധപ്പെട്ട ശരീരഘടനയിൽ ഉള്ളിലുള്ള അവയവങ്ങളെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: פִרְשׁוֹ
  choice: ചാണകം
  rationale: ഇത് വിസർജ്യത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘കുടൽമാലിന്യം’ പോലുള്ള പദം ആന്തരാവയവങ്ങളുമായുള്ള വ്യത്യാസം മങ്ങിച്ചേക്കാം.
