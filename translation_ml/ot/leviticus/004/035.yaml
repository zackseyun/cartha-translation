source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/ה יָסִ֗יר כַּ/אֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב הַ/כֶּשֶׂב֮ מִ/זֶּ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֹתָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן עַל חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: ml
  text: അതിന്റെ കൊഴുപ്പു മുഴുവനും, സമാധാനയാഗബലിയിൽനിന്ന് കുഞ്ഞാടിന്റെ കൊഴുപ്പ് നീക്കുന്നതുപോലെ, അവൻ നീക്കണം. പുരോഹിതൻ അവയെ യാഗപീഠത്തിന്മേൽ, യഹ്‌വേക്കുള്ള അഗ്നിയർപ്പണങ്ങളുടെമേൽ ദഹിപ്പിക്കണം.[a] അവൻ ചെയ്ത പാപത്തെച്ചൊല്ലി പുരോഹിതൻ അവന്നുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം; അപ്പോൾ അവന്നു ക്ഷമ ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹ്‌വേക്കുള്ള തീയിൽ അർപ്പിക്കുന്ന യാഗങ്ങളുടെമേൽ.” എബ്രായത്തിലെ ഈ പ്രയോഗം യാഗസംബന്ധമായ ഒരു സാങ്കേതിക പദമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗക്രമത്തിൽ മൃഗത്തിൽനിന്ന് നീക്കി അർപ്പിക്കേണ്ട കൊഴുപ്പിനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ലളിതവും നേരിട്ടുമുള്ള മലയാളപ്രയോഗം.
- source_word: יָסִיר / יוּסַר
  choice: നീക്കണം / നീക്കുന്നതുപോലെ
  rationale: യാഗമൃഗത്തിൽനിന്ന് നിർദിഷ്ട കൊഴുപ്പ് വേർപെടുത്തുന്ന ആചാരനടപടി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַכֶּשֶׂב
  choice: കുഞ്ഞാട്
  rationale: യാഗസന്ദർഭത്തിൽ כֶּשֶׂב എന്നത് സാധാരണയായി കുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗം
  rationale: ശ്ലാമീം എന്ന സാങ്കേതിക യാഗവിഭാഗത്തിന്റെ പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ മലയാളരൂപം.
- source_word: וְהִקְטִיר
  choice: ദഹിപ്പിക്കണം
  rationale: യാഗപീഠത്തിൽ കത്തിച്ച് പുകയായി ഉയർത്തുന്ന ആചാരപ്രവൃത്തിയെ മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֹתָם
  choice: അവയെ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചന സർവനാമം നീക്കിയ കൊഴുപ്പുഭാഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; അതിന്റെ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശാസൂചക രൂപം ഉണ്ടായിരുന്നാലും യാഗപ്രവൃത്തിയുടെ സ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: യഹ്‌വേക്കുള്ള ദഹനയാഗങ്ങളുടെമേൽ
  rationale: אִשֵּׁי എന്ന സാങ്കേതിക പ്രയോഗം തീയിൽ അർപ്പിക്കുന്ന യാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; עַל എന്നതിന്റെ മേൽ/മുകളിൽ എന്ന ബന്ധവും നിലനിർത്തുന്നു. പദത്തിന്റെ മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְכִפֶּר עָלָיו
  choice: അവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ വിശാലമായ ആചാര-ദൈവശാസ്ത്ര അർഥം ഒരു പ്രത്യേക സിദ്ധാന്തമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: അവൻ ചെയ്ത പാപത്തെക്കുറിച്ച്
  rationale: എബ്രായത്തിലെ ആവർത്തനാത്മക ഘടനയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: וְנִסְלַח לוֹ
  choice: അവനോടു ക്ഷമിക്കപ്പെടും
  rationale: വാക്യത്തിലെ നിഷ്ക്രിയരൂപവും ക്ഷമ ലഭിക്കുന്ന ഫലവും നിലനിർത്തുന്നു; ക്ഷമിക്കുന്ന കർത്താവിനെ പാഠം വ്യക്തമാക്കാത്തതിനാൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യാഗപരമായ כפר ഭാഷയുടെ വിവർത്തനം
  choice: അവനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം
  alternative: അവനുവേണ്ടി പാപപരിഹാരം നടത്തണം
  rationale: വാക്യം യാഗക്രമവും അതിന്റെ ഫലവും വിവരിക്കുന്നുവെങ്കിലും പ്രായശ്ചിത്തത്തെക്കുറിച്ചുള്ള പിന്നീടുള്ള ഒരു പ്രത്യേക വ്യവസ്ഥിതസിദ്ധാന്തം നിർവചിക്കുന്നില്ല; അതിനാൽ വിശാലമായ ബൈബിൾപരമായ പദം നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ ആധുനിക മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: וְנִסְלַח לוֹ എന്നതിലെ ക്ഷമയുടെ വ്യാകരണരൂപം
  choice: അവനോടു ക്ഷമിക്കപ്പെടും
  alternative: അവൻ ക്ഷമിക്കപ്പെടും
  rationale: എബ്രായത്തിൽ ക്ഷമിക്കപ്പെടുന്നതിന്റെ വ്യാകരണവിഷയം വ്യക്തിയേക്കാൾ അവന്റെ കുറ്റം/പാപം എന്ന ആശയത്തോടു ചേർന്നിരിക്കാമെന്ന സൂക്ഷ്മത നിലനിർത്താൻ ദാതൃഘടനയോട് അടുത്ത രൂപം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ യാഗപരമായ ശൈലി. ‘പ്രായശ്ചിത്തം’, ‘യാഗപീഠം’ തുടങ്ങിയ സ്ഥാപിത പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി. അടിക്കുറിപ്പ് സൂചിക [a] ബന്ധപ്പെട്ട സാങ്കേതിക പ്രയോഗത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
