    issue: Tense/mood mismatch in ‘കൊണ്ടുപോയി’
    rationale: The completed past form makes the prescribed action sound like a narrated past event. In context, the Hebrew describes what is to be done with the bull; Malayalam should use an obligative/instructional form.
