  text: וְ/הוֹצִ֣יא אֶת הַ/פָּ֗ר אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/שָׂרַ֣ף אֹת֔/וֹ כַּ/אֲשֶׁ֣ר שָׂרַ֔ף אֵ֖ת הַ/פָּ֣ר הָ/רִאשׁ֑וֹן חַטַּ֥את הַ/קָּהָ֖ל הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: ml
  text: അവൻ കാളയെ പാളയത്തിനു പുറത്തേക്ക് കൊണ്ടുപോകണം; ആദ്യത്തെ കാളയെ ദഹിപ്പിച്ചതുപോലെ അതിനെയും ദഹിപ്പിക്കണം. അത് സഭയ്ക്കുവേണ്ടിയുള്ള പാപയാഗമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശുദ്ധീകരണയാഗം.’ എബ്രായപദം പാപം പരിഹരിക്കുന്നതിനോടൊപ്പം അശുദ്ധി നീക്കുന്നതിലുള്ള യാഗത്തിന്റെ പങ്കിനും ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: പുറത്തേക്കു കൊണ്ടുപോയി
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു വസ്തുവിനെ പുറത്തേക്കു കൊണ്ടുപോകുക എന്ന കാരകാർഥം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ചലനപ്രയോഗമാണിത്.
- source_word: הַפָּר
  choice: കാളയെ
  rationale: פַּר യാഗത്തിനുള്ള ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു; ‘കാള’ വ്യക്തവും പൊതുവായും മനസ്സിലാകുന്നതുമാണ്.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തേക്കു
  rationale: പാളയത്തിന്റെ അതിരിനപ്പുറത്തേക്കുള്ള ദിശയും ലക്ഷ്യസ്ഥാനവും ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְשָׂרַף אֹתוֹ
  choice: അതിനെയും ദഹിപ്പിക്കണം
  rationale: שׂרף എന്നത് കത്തിക്കുക/ദഹിപ്പിക്കുക എന്നാണ്; യാഗമൃഗത്തിന്റെ ശരീരം തീയിൽ നശിപ്പിക്കുന്ന പ്രവൃത്തി മാന്യവും വ്യക്തവുമായി അറിയിക്കാൻ ‘ദഹിപ്പിക്കുക’ ഉപയോഗിച്ചു.
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: ദഹിപ്പിച്ചതുപോലെ
  rationale: כַּאֲשֶׁר മുൻപ് ചെയ്ത നടപടിയുമായുള്ള നേരിട്ടുള്ള താരതമ്യം സൂചിപ്പിക്കുന്നു.
- source_word: הַפָּר הָרִאשׁוֹן
  choice: ആദ്യത്തെ കാളയെ
  rationale: רִאשׁוֹן മുൻപ് വിവരിച്ച കാളയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; ‘ആദ്യത്തെ’ ആ ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: חַטַּאת
  choice: പാപയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗസന്ദർഭത്തിൽ חַטָּאת പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘പാപയാഗം’ മലയാളത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമാണ്. ശുദ്ധീകരണപ്രാധാന്യമുള്ള പകരം വിവർത്തനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: הַקָּהָל
  choice: സഭയ്ക്കുവേണ്ടിയുള്ള
  rationale: קָהָל ഇവിടെ ഉടമ്പടിസമൂഹത്തെ കൂട്ടായ ഘടകമായി സൂചിപ്പിക്കുന്നു; ‘സഭ’ മാന്യവും പരിചിതവുമായ പദമാണ്. ബന്ധാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘സഭയ്ക്കുവേണ്ടിയുള്ള’ എന്നു നൽകി.
- source_word: הוּא
  choice: അത് ... ആണ്
  rationale: സർവനാമം മുൻപറഞ്ഞ കാള/യാഗത്തെ സഭയുടെ പാപയാഗമായി തിരിച്ചറിയുന്ന വിധേയപ്രയോഗമാണ്; മലയാളത്തിൽ ഇത് വ്യക്തമായി പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: യാഗനിയമത്തിൽ חַטַּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ പദം പാപത്തെയും അശുദ്ധി നീക്കുന്നതിനെയും ബന്ധപ്പെടുത്തി ഉപയോഗിക്കപ്പെടാം. ഇവിടെ അത് യാഗമൃഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ പരിചിതമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ നൽകി; ‘ശുദ്ധീകരണയാഗം’ എന്ന യഥാർഥ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. നിയമനിർദേശത്തിന്റെ തുടർച്ച അറിയിക്കാൻ ‘ദഹിപ്പിക്കണം’ ഉപയോഗിച്ചു; സാങ്കേതിക യാഗപദം പരിചിതരൂപത്തിൽ നിലനിർത്തി, യഥാർഥ പകരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
