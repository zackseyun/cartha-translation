  terminology: חַטָּאת രണ്ട് സ്ഥാനത്തും ‘പാപം’ എന്നാണ് ശരിയായി നൽകിയിരിക്കുന്നത്; കָרְבָּן ‘വഴിപാട്’ എന്നും תְּמִימָה ‘ഊനമില്ലാത്ത’ എന്നും യോജിക്കുന്നു. അടിക്കുറിപ്പ് b-യിലെ നിലവിലെ ‘മറ്റൊരു പദക്രമം’ മുഖ്യവാക്യത്തിലെ അതേ പദക്രമം തന്നെ ആവർത്തിക്കുന്നതിനാൽ അതിനെ യഥാർഥ ബദൽക്രമമാക്കുന്നു.
