  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: א֚וֹ הוֹדַ֣ע אֵלָ֔י/ו חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/הֵבִ֨יא קָרְבָּנ֜/וֹ שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, അവൻ ചെയ്ത പാപം അവന് അറിയിക്കപ്പെട്ടാൽ[a], താൻ ചെയ്ത പാപത്തിനുവേണ്ടി ഊനമില്ലാത്ത ഒരു പെൺകോലാടിനെ തന്റെ വഴിപാടായി കൊണ്ടുവരണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അത് അവന് ബോധ്യമായാൽ’ അല്ലെങ്കിൽ ‘അവന്റെ പാപത്തെക്കുറിച്ച് അവനെ അറിയിച്ചാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ നിഷ്ക്രിയരൂപം, അയാൾതന്നെ പാപം തിരിച്ചറിഞ്ഞതാണോ അതോ മറ്റൊരാൾ അറിയിച്ചതാണോ എന്നു വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പദക്രമം: ‘തന്റെ വഴിപാടായി, താൻ ചെയ്ത പാപത്തിനുവേണ്ടി, ഊനമില്ലാത്ത ഒരു പെൺകോലാടിനെ കൊണ്ടുവരണം.’'
    reason: previous_rendering
lexical_decisions:
- source_word: א֚וֹ
  choice: അല്ലെങ്കിൽ
  rationale: നിയമനിർദേശത്തിലെ മറ്റൊരു സാധ്യത അവതരിപ്പിക്കുന്ന സംയോജകപദം; തുടർന്നുള്ള ക്രിയാരൂപത്തോടൊപ്പം വ്യവസ്ഥാഭാവം വ്യക്തമാകുന്നു.
- source_word: הוֹדַע אֵלָיו
  choice: അവനെ അറിയിക്കപ്പെട്ടാൽ
  rationale: ידע എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപത്തിലുള്ള നിഷ്ക്രിയഭാവം നിലനിർത്തുന്നു; സ്വയം മനസ്സിലാക്കുന്നതോ മറ്റൊരാൾ അറിയിക്കുന്നതോ എന്ന് നിർബന്ധമായി തീരുമാനിക്കുന്നില്ല.
- source_word: חַטָּאתוֹ
  choice: അവൻ ചെയ്ത പാപം / താൻ ചെയ്ത പാപം
  rationale: ഇവിടെ חַטָּאת് യാഗത്തെക്കാൾ ചെയ്ത തെറ്റിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ സർവനാമപ്രയോഗത്തിന് അനുസരിച്ച് ആദ്യത്തിൽ ‘അവൻ’, തുടർന്ന് അതേ കർത്താവിലേക്കു മടങ്ങുന്നിടത്ത് ‘താൻ’ ഉപയോഗിച്ചു.
- source_word: וְהֵבִיא
  choice: കൊണ്ടുവരണം
  rationale: നിയമപരമായ നിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קָרְבָּנוֹ
  choice: തന്റെ വഴിപാടായി
  rationale: ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന സമർപ്പണത്തെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന യാഗസംബന്ധിയായ പദം.
- source_word: שְׂעִירַת עִזִּים ... נְקֵבָה
  choice: ഒരു പെൺകോലാടിനെ
  rationale: ആട് പെണ്ണായിരിക്കണമെന്ന മൂലപാഠത്തിന്റെ വ്യക്തമായ നിർദേശം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: תְּמִימָה
  choice: ഊനമില്ലാത്ത
  rationale: യാഗമൃഗത്തിന് വൈകല്യമോ ദോഷമോ ഇല്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പരിചിതമായ യാഗപരിഭാഷ.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: താൻ ചെയ്ത പാപത്തിനുവേണ്ടി
  rationale: വഴിപാട് ആ പാപവുമായി ബന്ധപ്പെട്ട് കൊണ്ടുവരുന്നതാണെന്ന ബന്ധം വ്യക്തമാക്കുന്നു; മുൻപ്രത്യയത്തിന് അതിലധികം വ്യാഖ്യാനം ചുമത്തുന്നില്ല.
theological_decisions:
- issue: നിയമപരവും ശുദ്ധീകരണപരവുമായ പശ്ചാത്തലത്തിൽ חַטָּאת എന്ന പദത്തിന്റെ അർഥം
  choice: രണ്ടിടത്തും ‘പാപം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടാമത്തെ പ്രയോഗം ‘പാപയാഗം’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ വാക്യത്തിൽ വഴിപാട് קָרְבָּנוֹ എന്നു പ്രത്യേകം വിളിക്കപ്പെടുകയും അത് പെൺകോലാടാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു. ആവർത്തിക്കുന്ന חַטָּאתוֹ ചെയ്ത കുറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനെ യാഗത്തിന്റെ പേരായി മാറ്റേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലപാഠത്തിലെ നിഷ്ക്രിയപ്രയോഗത്തിന്റെ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; അനാവശ്യമായ സഭാവിഭാഗപരമായ യാഗസാങ്കേതികത ചേർത്തിട്ടില്ല.
