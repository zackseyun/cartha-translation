  to: അല്ലെങ്കിൽ, അവൻ ചെയ്ത പാപം അവന് അറിയിക്കപ്പെട്ടാൽ[a], താൻ ചെയ്ത പാപത്തിനുവേണ്ടി ഊനമില്ലാത്ത ഒരു പെൺകോലാടിനെ തന്റെ വഴിപാടായി കൊണ്ടുവരണം.[b]
