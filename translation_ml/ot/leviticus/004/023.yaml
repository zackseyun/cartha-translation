  text: אֽוֹ הוֹדַ֤ע אֵלָי/ו֙ חַטָּאת֔/וֹ אֲשֶׁ֥ר חָטָ֖א בָּ֑/הּ וְ/הֵבִ֧יא אֶת קָרְבָּנ֛/וֹ שְׂעִ֥יר עִזִּ֖ים זָכָ֥ר תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/023.yaml
  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, അവൻ ചെയ്ത പാപം അവന് അറിയിക്കപ്പെട്ടാൽ[a], അവൻ ഊനമില്ലാത്ത ഒരു ആൺകോലാടിനെ തന്റെ വഴിപാടായി കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “അവൻ പാപം ചെയ്ത ആ പാപം അവന് അറിയിക്കപ്പെട്ടാൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ നിയമസാഹചര്യത്തിന്റെ മറ്റൊരു സാധ്യത അവതരിപ്പിക്കുന്ന ലളിതമായ വികൽപസംയോജകം.
- source_word: הוֹדַע אֵלָיו
  choice: അവനെ അറിയിച്ചാൽ
  rationale: ידע എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം, പാപത്തെക്കുറിച്ചുള്ള അറിവ് മറ്റൊരു വഴിയിലൂടെ അയാളിലേക്കെത്തുന്നു എന്ന നിഷ്ക്രിയ/കാരണനിഷ്ക്രിയ ആശയം നൽകുന്നു. മലയാളത്തിലെ കർത്താവിനെ വ്യക്തമാക്കാത്ത പ്രയോഗം ഇത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: חַטָּאתוֹ
  choice: താൻ ചെയ്ത പാപം
  rationale: തുടർന്നുള്ള ‘അവൻ ചെയ്ത’ എന്ന ബന്ധവാക്യം ഇതു പാപത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്നും പാപയാഗത്തെയല്ലെന്നും വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: താൻ ചെയ്ത
  rationale: בָּהּ എന്ന ഘടകം חטא എന്ന ക്രിയയോടൊപ്പം ഇവിടെ പ്രയോഗപരമാണ്; മലയാളത്തിൽ ‘താൻ ചെയ്ത പാപം’ എന്നത് അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהֵבִיא
  choice: അവൻ ... കൊണ്ടുവരണം
  rationale: നിയമഭാഷയിലെ വാവ് ചേർന്ന പൂർണക്രിയ നിർദേശിക്കുന്ന തുടർനടപടിയാണ്; മലയാളത്തിൽ ‘കൊണ്ടുവരണം’ ബാധ്യത വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: קָרְבָּנוֹ
  choice: തന്റെ വഴിപാടായി
  rationale: ദൈവസന്നിധിയിൽ അർപ്പിക്കാൻ കൊണ്ടുവരുന്ന വസ്തുവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘വഴിപാട്’ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന യാഗപരമായ പദമാണ്.
- source_word: שְׂעִיר עִזִּים זָכָר
  choice: ഒരു ആൺകോലാട്
  rationale: ഈ പദസമുച്ചയം ആൺവർഗത്തിലുള്ള കോലാടിനെ വ്യക്തമായി നിർദേശിക്കുന്നു; ലിംഗസൂചന മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תָּמִים
  choice: ഊനമില്ലാത്ത
  rationale: യാഗമൃഗത്തിന് ദോഷമോ വൈകല്യമോ ഇല്ലെന്നു സൂചിപ്പിക്കുന്ന സാധാരണ യാഗപരമായ അർഥം.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ അർഥം
  choice: പാപം/കുറ്റം
  alternative: പാപയാഗം
  rationale: חַטָּאת എന്നതിന് ലേവ്യപുസ്തകത്തിൽ ‘പാപം’ എന്നും ‘പാപയാഗം’ എന്നും അർഥമാകാമെങ്കിലും, ‘അവൻ ചെയ്ത’ എന്ന ബന്ധവാക്യം ഇവിടെ ചെയ്ത കുറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്. വഴിപാട് പിന്നീട് קָרְבָּנוֹ എന്ന വേറൊരു പദത്താൽ പറയപ്പെടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. മുഖ്യവാക്യത്തിൽ ആശയവിനിമയത്തിന്റെ കർത്താവിനെ വ്യക്തമാക്കാതെ എബ്രായ നിഷ്ക്രിയതയുടെ അർഥം നിലനിർത്തുകയും, കൂടുതൽ പദാനുസൃതമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
