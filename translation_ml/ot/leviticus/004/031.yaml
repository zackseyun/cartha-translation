id: LEV.4.31
reference: Leviticus 4:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: ml
  text: അവൻ അതിന്റെ മേദസ്സ് മുഴുവനും നീക്കണം, സമാധാനയാഗത്തിന്റെ[a] മേദസ്സ് നീക്കുന്നതുപോലെ. പുരോഹിതൻ അത് യാഗപീഠത്തിന്മേൽ യഹോവയ്ക്ക് പ്രസാദകരമായ സുഗന്ധമായി[b] ദഹിപ്പിക്കണം. പിന്നെ പുരോഹിതൻ അവനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം; അവന് ക്ഷമ ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൂട്ടായ്മയാഗത്തിന്റെ.”
    reason: lexical_alternative
  - marker: b
    text: “പ്രസാദകരമായ സുഗന്ധം” എന്നത് യഹോവയ്ക്ക് സ്വീകാര്യമായ യാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവ് യാഗപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: മേദസ്സ്
  rationale: യാഗത്തിൽ വേർതിരിച്ച് ദഹിപ്പിക്കുന്ന കൊഴുപ്പിനെ സൂചിപ്പിക്കുന്ന പതിവായ, കൃത്യമായ മലയാള പദം.
- source_word: יָסִיר
  choice: നീക്കണം
  rationale: നിയമപരമായ നടപടിക്രമത്തിന്റെ നിർബന്ധസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר הוּסַר
  choice: നീക്കുന്നതുപോലെ
  rationale: മുൻപ് നിർദേശിച്ച സമാധാനയാഗക്രമത്തോടുള്ള താരതമ്യം നിലനിർത്തുന്നു.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗം
  rationale: ശְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ പരമ്പരാഗതവും സുതാര്യവുമായ മലയാള രൂപം; കൂട്ടായ്മയാഗം എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְהִקְטִיר
  choice: ദഹിപ്പിക്കണം
  rationale: യാഗപീഠത്തിൽ അർപ്പണം കത്തിക്കുന്ന പ്രത്യേക യാഗക്രിയയെ വെറും 'കത്തിക്കുക' എന്നതിനെക്കാൾ യോജിച്ച രീതിയിൽ അറിയിക്കുന്നു.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധമായി
  rationale: ദൈവത്തിനു സ്വീകാര്യമായ യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ രൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה ഒരു പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְכִפֶּר עָלָיו
  choice: അയാൾക്കുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പുരോഹിതന്റെ യാഗപരമായ പ്രവർത്തനവും അത് ആ വ്യക്തിക്കുവേണ്ടിയാണെന്ന ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: וְנִסְלַח לוֹ
  choice: അയാൾക്ക് ക്ഷമ ലഭിക്കും
  rationale: എബ്രായത്തിലെ കർമണിഫലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ക്ഷമിക്കുന്ന കർത്താവിനെ വാചകം പ്രത്യേകം പറയാത്തതും നിലനിർത്തുന്നു.
theological_decisions:
- issue: וְכִפֶּר עָלָיו ... וְנִסְלַח לוֹ എന്ന യാഗസൂത്രവാക്യത്തിന്റെ വിവർത്തനം
  choice: പുരോഹിതൻ അയാൾക്കുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം; അയാൾക്ക് ക്ഷമ ലഭിക്കും
  alternative: പുരോഹിതൻ അയാൾക്കായി പരിഹാരം വരുത്തണം; അവനോടു ക്ഷമിക്കപ്പെടും
  rationale: പുരോഹിതന്റെ പ്രായശ്ചിത്തക്രിയയ്ക്കു പിന്നാലെ ക്ഷമ ലഭിക്കുന്നതായി എബ്രായവാക്യം പറയുന്നു; അതിന്റെ പ്രവർത്തനരീതി സംബന്ധിച്ച പിൽക്കാല സിദ്ധാന്തവിശദീകരണം വിവർത്തനത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ലേവ്യപുസ്തകത്തിലെ നിയമ-യാഗഭാഷയുടെ ഗൗരവം നിലനിർത്തിയിരിക്കുന്നു. കർത്തൃസൂചന ആശയക്കുഴപ്പമാകാതിരിക്കാൻ യാഗം കൊണ്ടുവന്ന വ്യക്തിയെ ‘അയാൾ’ എന്നും പുരോഹിതനെ വ്യക്തമായ നാമപദത്താലും സൂചിപ്പിച്ചു. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ സ്ഥാപിച്ചു.
