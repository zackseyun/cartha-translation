source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַט֙ אֶת הַ֣/חַטָּ֔את בִּ/מְק֖וֹם הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: ml
  text: അവൻ പാപയാഗത്തിന്റെ തലമേൽ തന്റെ കൈ വെച്ച്, ഹോമയാഗം അറുക്കുന്ന സ്ഥലത്ത് പാപയാഗത്തെ അറുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുദ്ധീകരണയാഗം.” എബ്രായത്തിലെ חטאת എന്ന പദം പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയും ശുദ്ധീകരണത്തിനായുള്ള യാഗത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: കൈ വെച്ച്
  rationale: യാഗസന്ദർഭത്തിൽ סמך കൈ മൃഗത്തിന്റെമേൽ വയ്ക്കുകയോ അമർത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കൈ വെക്കുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יָדוֹ
  choice: തന്റെ കൈ
  rationale: എബ്രായപദം ഏകവചനവും മൂന്നാംപുരുഷ പുല്ലിംഗസർവനാമപ്രത്യയമുള്ളതുമാണ്; അതിനാൽ ഏകവചനം നിലനിർത്തുന്നു.
- source_word: עַל רֹאשׁ
  choice: തലമേൽ
  rationale: സ്ഥാനബന്ധം നേരിട്ട് സൂചിപ്പിക്കുന്നതും യാഗക്രിയയുടെ പ്രത്യേകത നിലനിർത്തുന്നതുമായ സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הַחַטָּאת
  choice: പാപയാഗം
  rationale: ലേവ്യപുസ്തകത്തിലെ ഈ യാഗസന്ദർഭത്തിൽ חטאת പാപവുമായി ബന്ധപ്പെട്ട പ്രത്യേക യാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘പാപയാഗം’ പരിചിതവും സുതാര്യവുമായ സാങ്കേതിക പദമാണ്; ശുദ്ധീകരണവശം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְשָׁחַט
  choice: അറുക്കണം
  rationale: שחט യാഗമൃഗത്തെ ആചാരപരമായി അറുക്കുന്നതിനുള്ള സാങ്കേതിക ക്രിയയാണ്. ‘കൊല്ലണം’ എന്ന പൊതുപദത്തേക്കാൾ ‘അറുക്കണം’ യാഗസന്ദർഭം നന്നായി പകർന്നു നൽകുന്നു; നിയമനിർദേശത്തിന്റെ ബലം ‘ണം’ രൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: בִּמְקוֹם
  choice: അറുക്കുന്ന സ്ഥലത്തുവെച്ച്
  rationale: വാക്യം നിർദേശിക്കുന്ന നിശ്ചിത യാഗസ്ഥലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. മൂലത്തിലെ ‘സ്ഥലത്ത്’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് മുൻക്രിയ ആവർത്തിക്കുന്നത് ലക്ഷ്യസ്ഥലം അസന്ദിഗ്ധമാക്കുന്നു.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന עלה യാഗത്തിനുള്ള മലയാളത്തിലെ സ്ഥാപിതവും വായനക്കാർക്ക് പരിചിതവുമായ പദമാണ്.
theological_decisions:
- issue: חטאת എന്ന യാഗസാങ്കേതിക പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഇവിടെ ഒരു പ്രത്യേക യാഗമൃഗത്തിന്റെ സമർപ്പണവും അറുക്കലുമാണ് നേരിട്ടുള്ള സന്ദർഭം. ‘പാപയാഗം’ പദത്തിന്റെ പാപബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു; എന്നാൽ ശുദ്ധീകരണപ്രവർത്തനത്തെ മുൻനിർത്തുന്ന സാധുവായ മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: നിയമ-യാഗസന്ദർഭത്തിലെ എബ്രായ wayyiqtol ക്രിയാരൂപം
  choice: വെച്ച് ... അറുക്കണം
  alternative: വെച്ചു ... അറുത്തു
  rationale: രൂപപരമായി ആഖ്യാനക്രമം സൂചിപ്പിക്കാവുന്ന ക്രിയകളാണെങ്കിലും, ഈ ഭാഗം അനുഷ്ഠാനനിർദേശം തുടരുന്നതാണ്. മലയാളത്തിലെ നിർദേശാത്മക ‘ണം’ രൂപം ആ നിയമബലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാഗനിയമശൈലി. ‘പാപയാഗം,’ ‘ഹോമയാഗം’ എന്നീ പരിചിത സാങ്കേതിക പദങ്ങൾ ഉപയോഗിച്ചു; ഏകവചനമായ ‘കൈ’യും നിർദേശാത്മക ക്രിയാബലവും സംരക്ഷിച്ചു.
