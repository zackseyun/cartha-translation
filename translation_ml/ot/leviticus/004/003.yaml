  text: אִ֣ם הַ/כֹּהֵ֧ן הַ/מָּשִׁ֛יחַ יֶחֱטָ֖א לְ/אַשְׁמַ֣ת הָ/עָ֑ם וְ/הִקְרִ֡יב עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן בָּקָ֥ר תָּמִ֛ים לַ/יהוָ֖ה לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: ml
  text: അഭിഷിക്തനായ പുരോഹിതൻ[a] പാപം ചെയ്ത് ജനത്തിന്മേൽ കുറ്റബാധ വരുത്തുന്നുവെങ്കിൽ[b], താൻ ചെയ്ത പാപത്തിനായി കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഊനമില്ലാത്ത ഒരു കാളയെ പാപയാഗമായി യഹോവയ്ക്ക് അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അഭിഷിക്തനായ മഹാപുരോഹിതൻ.’ എബ്രായമൂലത്തിൽ അക്ഷരാർഥത്തിൽ ‘അഭിഷിക്തനായ പുരോഹിതൻ’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത മറ്റൊരു പരിഭാഷ: ‘ജനത്തിന്റെ കുറ്റബാധയ്ക്കായി.’ പുരോഹിതന്റെ പാപം ജനത്തെ ബാധിക്കുന്ന കുറ്റബാധയിൽ കലാശിക്കുന്നതായി ഈ ചുരുക്കമുള്ള എബ്രായപ്രയോഗം സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: അഭിഷിക്തനായ പുരോഹിതൻ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘അഭിഷിക്തനായ പുരോഹിതൻ’ എന്നാണ്. സന്ദർഭത്തിൽ മഹാപുരോഹിതനെ സൂചിപ്പിക്കുന്നെങ്കിലും മൂലപാഠത്തിൽ ‘മഹാ’ എന്ന പ്രത്യേക പദമില്ല.
- source_word: יֶחֱטָא
  choice: പാപം ചെയ്ത്
  rationale: אִם എന്ന നിബന്ധനാപദത്തോടുകൂടിയ ക്രിയയെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘പാപം ചെയ്ത് ... വരുത്തുന്നുവെങ്കിൽ’ എന്ന നിബന്ധനാഘടനയിൽ ചേർത്തു.
- source_word: לְאַשְׁמַת הָעָם
  choice: ജനത്തിന്മേൽ കുറ്റബാധ വരുത്തുന്നുവെങ്കിൽ
  rationale: ചുരുക്കമുള്ള എബ്രായപ്രയോഗം പുരോഹിതന്റെ പാപം ജനത്തെ ബാധിക്കുന്ന കുറ്റബാധയിലേക്കു നയിക്കുന്നതായി സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ രീതി അധികമായി നിർവചിക്കാതെ ഫലം നിലനിർത്തുന്നു.
- source_word: וְהִקְרִיב
  choice: അർപ്പിക്കണം
  rationale: യാഗസന്ദർഭത്തിൽ ‘കൊണ്ടുവന്ന് സമർപ്പിക്കുക/അർപ്പിക്കുക’ എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘അർപ്പിക്കണം’ നിയമപരമായ നിർദേശം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: താൻ ചെയ്ത പാപത്തിനായി
  rationale: മൂലത്തിലെ ആവർത്തനം മലയാളത്തിൽ അനാവശ്യമായ കാഠിന്യമില്ലാതെ, യാഗം ഏതു പാപത്തിനുവേണ്ടിയാണെന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: פַּר בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള
  rationale: ‘കാള, കന്നുകാലിയുടെ മകൻ’ എന്ന അക്ഷരാർഥഘടനയെ അസ്വാഭാവികമായി പകർത്താതെ മൃഗത്തിന്റെ ഇനവും കൂട്ടത്തിൽനിന്നുള്ളതെന്ന ആശയവും സൂക്ഷിക്കുന്നു; പ്രായം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: תָּמִים
  choice: ഊനമില്ലാത്ത
  rationale: യാഗമൃഗത്തിന്റെ അംഗീകാര്യമായ ശാരീരിക സമ്പൂർണതയെ സൂചിപ്പിക്കുന്ന പതിവ് യാഗപരമായ പ്രയോഗം.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוהയെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לְחַטָּאת
  choice: പാപയാഗമായി
  rationale: ഇവിടെ חַטָּאת പാപത്തെ മാത്രമല്ല, അതിനുവേണ്ടിയുള്ള യാഗത്തെയും സൂചിപ്പിക്കുന്നു; ‘പാപയാഗമായി’ ആ ആചാരപരമായ പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ എന്നത് ‘അഭിഷിക്തനായ പുരോഹിതൻ’ എന്നോ ‘അഭിഷിക്തനായ മഹാപുരോഹിതൻ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: അഭിഷിക്തനായ പുരോഹിതൻ
  alternative: അഭിഷിക്തനായ മഹാപുരോഹിതൻ
  rationale: സന്ദർഭം മഹാപുരോഹിതപദവിയെ സൂചിപ്പിക്കാമെങ്കിലും എബ്രായമൂലം നേരിട്ട് ‘അഭിഷിക്തനായ പുരോഹിതൻ’ എന്നാണ് പറയുന്നത്. വ്യാഖ്യാനപരമായ വിപുലീകരണം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: לְאַשְׁמַת הָעָם എന്നതിലെ സമൂഹപരമായ ഫലം എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: ജനത്തിന്മേൽ കുറ്റബാധ വരുത്തുന്നുവെങ്കിൽ
  alternative: ജനത്തിന്റെ കുറ്റബാധയ്ക്കായി
  rationale: പുരോഹിതന്റെ പാപത്തിന് സമൂഹത്തെ ബാധിക്കുന്ന ഫലമുണ്ടെന്ന ആശയം നിലനിർത്തുന്നു; എന്നാൽ ആ കുറ്റബാധയുടെ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനരീതി മൂലപാഠത്തെക്കാൾ അധികമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമ-യാഗഭാഷ ഉപയോഗിച്ചു. ‘പാപയാഗം,’ ‘ഊനമില്ലാത്ത,’ ‘അഭിഷിക്തനായ പുരോഹിതൻ’ തുടങ്ങിയ പദങ്ങൾ ആചാരപരമായ കൃത്യത നിലനിർത്തുന്നു; എബ്രായത്തിലെ യഥാർഥമായ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
