translation:
  language: ml
  text: അവൻ അതിന്റെ മുഴുവൻ കൊഴുപ്പും അതിൽനിന്ന് നീക്കി യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യാഗപീഠത്തിന്മേൽ പുകയായി ഉയരാൻ ദഹിപ്പിക്കണം.” എബ്രായ ക്രിയ യാഗസന്ദർഭത്തിൽ ഒരു വഴിപാട് പുകയായി ഉയരാൻ ഇടയാക്കുന്നതിനെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: —
  rationale: മുൻവാക്യത്തിലെ അനുഷ്ഠാനക്രമത്തിന്റെ തുടർച്ച മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധത്തിലൂടെ പ്രകടമാകുന്നു; നേരിട്ടുള്ള കർമസൂചകത്തിന് വേറെ പരിഭാഷ ആവശ്യമില്ല.
- source_word: כָּל חֶלְבּוֹ
  choice: അതിന്റെ കൊഴുപ്പെല്ലാം
  rationale: כָּל സമഗ്രത സൂചിപ്പിക്കുന്നു; חֵלֶב ഇവിടെ യാഗത്തിനായി വേർതിരിക്കുന്ന മൃഗക്കൊഴുപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יָרִים מִמֶּנּוּ
  choice: അതിൽനിന്ന് നീക്കി
  rationale: רוּם എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് അക്ഷരാർഥത്തിൽ ഉയർത്തുക എന്ന ഭാവമുണ്ടെങ്കിലും, ഈ യാഗസന്ദർഭത്തിൽ മൃഗത്തിൽനിന്ന് കൊഴുപ്പ് വേർതിരിച്ചെടുക്കുക എന്നതാണ് ഉദ്ദേശ്യം.
- source_word: וְהִקְטִיר
  choice: ദഹിപ്പിക്കണം
  rationale: הקטיר യാഗവസ്തു പുകയായി ഉയരത്തക്കവിധം യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന പ്രത്യേക യാഗക്രിയയെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ ‘ദഹിപ്പിക്കുക’ ആ അർഥം നൽകുന്നു.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശാസൂചകമായ അവസാനപ്രത്യയം ഉണ്ടായിരുന്നാലും הקטיר-നോടൊപ്പം ഇവിടെ ക്രിയ നടക്കുന്ന സ്ഥലം യാഗപീഠമാണെന്ന് സൂചിപ്പിക്കുന്നതാണ് സ്വാഭാവികമായ അർഥം.
