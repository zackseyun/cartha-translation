  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר יוּרַ֔ם מִ/שּׁ֖וֹר זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/הִקְטִירָ/ם֙ הַ/כֹּהֵ֔ן עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/010.yaml
  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
translation:
  language: ml
  text: സമാധാനയാഗത്തിന്റെ കാളയിൽനിന്ന് അത് നീക്കുന്നതുപോലെതന്നെ[a], പുരോഹിതൻ അവയെ ഹോമയാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “സമാധാനയാഗത്തിന്റെ കാളയിൽനിന്ന് അത് ഉയർത്തപ്പെടുന്നതുപോലെ.” യാഗത്തിനായി ഭാഗങ്ങൾ മാറ്റിയെടുക്കുന്നതിനോടൊപ്പം അവ ഉയർത്തപ്പെടുന്ന ആശയവും എബ്രായ ക്രിയ ഉണർത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: മുൻവിവരിച്ച സമാധാനയാഗക്രമത്തോടുള്ള വ്യക്തമായ താരതമ്യം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יוּרַם
  choice: നീക്കുന്നതു
  rationale: רום എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘ഉയർത്തപ്പെടുക’ എന്ന ആശയമുണ്ടെങ്കിലും, ഇവിടെ യാഗത്തിനായി കൊഴുപ്പുഭാഗങ്ങൾ മൃഗത്തിൽനിന്ന് മാറ്റിയെടുക്കുന്നതാണ് സന്ദർഭാർഥം; അക്ഷരാർഥസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִשּׁוֹר
  choice: കാളയിൽനിന്ന്
  rationale: שׁוֹר എന്നത് പശുവർഗത്തിലെ ആൺമൃഗത്തെ ഇവിടെ സൂചിപ്പിക്കുന്നു; യാഗസന്ദർഭത്തിൽ ‘കാള’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗത്തിനുള്ള
  rationale: സ്ഥിരമായ യാഗസാങ്കേതികപദമായ שְׁלָמִים എന്നതിന്റെ സമാധാനബന്ധം സംരക്ഷിക്കുമ്പോൾ, മുഴുവൻ ഘടനയെ സാധാരണ മലയാളത്തിൽ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְהִקְטִירָם
  choice: അവയെ ... ദഹിപ്പിക്കണം
  rationale: കൊഴുപ്പുഭാഗങ്ങളെ യാഗപീഠത്തിൽ പുകയാക്കി അർപ്പിക്കുന്ന പ്രവൃത്തിയാണ് קטר സൂചിപ്പിക്കുന്നത്; ‘ദഹിപ്പിക്കുക’ യാഗസന്ദർഭത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: യാഗശുശ്രൂഷ നിർവഹിക്കുന്ന ഔദ്യോഗിക മതപദവിക്ക് സ്വാഭാവികമായ മലയാളപദം.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: ഹോമയാഗപീഠത്തിന്മേൽ
  rationale: עֹלָה എന്ന പൂർണദഹനയാഗത്തോടു ബന്ധപ്പെട്ട യാഗപീഠത്തെ കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാള യാഗപദാവലിയിലൂടെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. മുൻവാക്യത്തിൽ പട്ടികപ്പെടുത്തിയ കൊഴുപ്പുഭാഗങ്ങളെയാണ് ‘അവ’ സൂചിപ്പിക്കുന്നത്. യാഗസാങ്കേതിക പദങ്ങളായ ‘സമാധാനയാഗം’, ‘ഹോമയാഗപീഠം’ എന്നിവ സ്ഥിരതയ്ക്കായി ഉപയോഗിച്ചു.
