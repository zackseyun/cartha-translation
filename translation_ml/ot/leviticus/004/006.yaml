id: LEV.4.6
reference: Leviticus 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: ml
  text: പുരോഹിതൻ തന്റെ വിരൽ രക്തത്തിൽ മുക്കി, യാഹ്‌വേയുടെ സന്നിധിയിൽ, വിശുദ്ധമന്ദിരത്തിന്റെ തിരശ്ശീലയ്ക്കു മുമ്പിൽ, രക്തത്തിൽനിന്ന് കുറച്ച് എടുത്ത് ഏഴു പ്രാവശ്യം തളിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “വിശുദ്ധസ്ഥലത്തിന്റെ തിരശ്ശീലയ്ക്കു മുമ്പിൽ.”
    reason: פָּרֹכֶת הַקֹּדֶשׁ എന്ന പദബന്ധത്തിലെ הַקֹּדֶשׁ “വിശുദ്ധമന്ദിരം” എന്നും കൂടുതൽ സാങ്കേതികമായി “വിശുദ്ധസ്ഥലം” എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: וְטָבַל
  choice: മുക്കി
  rationale: ചടങ്ങിനുള്ള നിർദേശക്രമം തുടരുന്ന ക്രിയ; טבל എന്നതിന്റെ സ്വാഭാവിക അർഥം ‘മുക്കുക’ എന്നാണ്.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ഈ യാഗചടങ്ങ് നിർവഹിക്കുന്ന നിർദിഷ്ട പുരോഹിതനെ സൂചിപ്പിക്കുന്ന ഏകവചനപദം.
- source_word: אֶצְבָּעוֹ בַּדָּם
  choice: തന്റെ വിരൽ രക്തത്തിൽ
  rationale: മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും വിരൽ മുക്കപ്പെടുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന ב എന്ന ഉപസർഗവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהִזָּה מִן־הַדָּם
  choice: ആ രക്തത്തിൽ കുറെ ... തളിക്കണം
  rationale: נזה എന്നത് പുരോഹിതചടങ്ങിൽ ആചാരപരമായി തളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; מן ഇവിടെ രക്തത്തിന്റെ ഒരു ഭാഗം എന്ന അംശാർത്ഥം നൽകുന്നു.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: എണ്ണത്തെ ക്രിയാവിശേഷണമായി വ്യക്തമാക്കുന്ന സാധാരണ പ്രയോഗം.
- source_word: לִפְנֵי יְהוָה
  choice: യാഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിലെ സ്ഥലപരവും ആരാധനാപരവുമായ ‘സന്നിധിയിൽ/മുമ്പിൽ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദൈവനാമം യാഹ്‌വേ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിന്റെ തിരശ്ശീലയ്ക്കു മുമ്പിൽ
  rationale: פָּרֹכֶת എന്നത് അകത്തെ തിരശ്ശീലയെയും הַקֹּדֶשׁ വിശുദ്ധസ്ഥലത്തെയോ വിശുദ്ധമന്ദിരത്തെയോ സൂചിപ്പിക്കുന്നു; פני സ്ഥലദിശയായ ‘മുമ്പിൽ’ എന്ന് നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: എബ്രായപാഠത്തിലെ സവിശേഷ ദൈവനാമം പൊതുനാമമാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: פָּרֹכֶת הַקֹּדֶשׁ എന്ന ആരാധനാസംബന്ധമായ പ്രയോഗം
  choice: വിശുദ്ധമന്ദിരത്തിന്റെ തിരശ്ശീല
  alternative: വിശുദ്ധസ്ഥലത്തിന്റെ തിരശ്ശീല
  rationale: ഈ പദബന്ധം വിശുദ്ധമേഖലയോടു ബന്ധപ്പെട്ട തിരശ്ശീലയെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധമന്ദിരം’ വായനാസൗകര്യം നൽകുന്നു; ‘വിശുദ്ധസ്ഥലം’ എന്ന കൂടുതൽ വാസ്തുശാസ്ത്രപരമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. യാഗചടങ്ങിന്റെ ഔപചാരിക ഭാവം നിലനിർത്താൻ ‘പുരോഹിതൻ’, ‘സന്നിധിയിൽ’, ‘തിരശ്ശീല’ എന്നീ പൊതുവേ മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു.
