revisions:
- from: പുരോഹിതൻ തന്റെ വിരൽ രക്തത്തിൽ മുക്കി, യാഹ്‌വേയുടെ സന്നിധിയിൽ, വിശുദ്ധമന്ദിരത്തിന്റെ തിരശ്ശീലയ്ക്കു മുമ്പിൽ, ആ രക്തത്തിൽ കുറെ ഏഴു പ്രാവശ്യം തളിക്കണം.[a]
  to: പുരോഹിതൻ തന്റെ വിരൽ രക്തത്തിൽ മുക്കി, യാഹ്‌വേയുടെ സന്നിധിയിൽ, വിശുദ്ധമന്ദിരത്തിന്റെ തിരശ്ശീലയ്ക്കു മുമ്പിൽ, രക്തത്തിൽനിന്ന് കുറച്ച് എടുത്ത് ഏഴു പ്രാവശ്യം തളിക്കണം.[a]
