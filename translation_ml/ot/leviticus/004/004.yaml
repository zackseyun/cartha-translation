id: LEV.4.4
reference: Leviticus 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: ml
  text: അവൻ കാളയെ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിങ്കൽ, യഹ്‌വേയുടെ സന്നിധിയിൽ[a], കൊണ്ടുവരണം. അവൻ കാളയുടെ തലയിൽ കൈവെച്ച് യഹ്‌വേയുടെ സന്നിധിയിൽ അതിനെ അറുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേയുടെ മുമ്പാകെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: കൊണ്ടുവരണം
  rationale: ഹിഫ്ഇൽ രൂപം വഴിപാടുകാരൻ മൃഗത്തെ കൊണ്ടുവരണമെന്ന ആചാരനിർദേശം നൽകുന്നു; മലയാളത്തിൽ ‘കൊണ്ടുവരണം’ നിർദേശസ്വഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַפָּר
  choice: കാള
  rationale: פַּר യാഗസന്ദർഭത്തിൽ കാളയെ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ പ്രായം വ്യക്തമായി പറഞ്ഞിട്ടില്ലാത്തതിനാൽ ‘ഇളം’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിങ്കൽ
  rationale: פֶּתַח എന്നത് തുറവ്, പ്രവേശനം, കവാടം എന്നിവ സൂചിപ്പിക്കുന്നു; אֹהֶל מוֹעֵד എന്ന വിശുദ്ധമന്ദിരനാമത്തിന് ‘സമാഗമകൂടാരം’ വ്യക്തവും പരിചിതവുമായ മലയാളരൂപമാണ്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന് ‘മുമ്പാകെ/സന്നിധിയിൽ’ എന്നർത്ഥമുണ്ട്. ആരാധനാചാരസന്ദർഭത്തിലെ സാന്നിധ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘സന്നിധിയിൽ’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: കാളയുടെ തലയിൽ കൈവെച്ച്
  rationale: סמך ഇവിടെ മൃഗത്തിന്റെ തലയിൽ കൈ വയ്ക്കുന്ന യാഗാചാരത്തെ സൂചിപ്പിക്കുന്നു. അതിന്റെ പ്രതീകാർഥം വാക്യത്തിൽ വിശദീകരിക്കാത്തതിനാൽ പ്രവൃത്തി മാത്രം പരിഭാഷപ്പെടുത്തി.
- source_word: וְשָׁחַט
  choice: അറുക്കണം
  rationale: שׁחט യാഗമൃഗത്തെ ആചാരപരമായി അറുക്കുന്നതിനുള്ള സാങ്കേതിക ക്രിയയാണ്; ‘കൊല്ലണം’ എന്ന പൊതുപദത്തേക്കാൾ ‘അറുക്കണം’ ഈ അർത്ഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് പദവിയായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: കാളയുടെ തലയിൽ കൈവയ്ക്കുന്നതിന്റെ അർത്ഥം
  choice: ശാരീരിക ആചാരപ്രവൃത്തി മാത്രം പ്രസ്താവിക്കുക
  alternative: ഐക്യപ്പെടലോ കുറ്റത്തിന്റെ കൈമാറ്റമോ എന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: ഈ വാക്യം പ്രവൃത്തി പറയുന്നു; അതിന്റെ സമ്പൂർണ ദൈവശാസ്ത്രപരമായ അർത്ഥം വിശദീകരിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- issue: לִפְנֵי എന്ന ആരാധനാചാരപ്രയോഗം
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  alternative: യഹ്‌വേയുടെ മുമ്പാകെ
  rationale: സ്ഥലപരമായ ‘മുമ്പിൽ’ എന്ന ആശയത്തോടൊപ്പം ദൈവസാന്നിധ്യത്തിലെ ആചാരപ്രവൃത്തിയെന്ന ഭാവവും ഈ സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു; ‘സന്നിധിയിൽ’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആചാരനിർദേശ ശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ വാക്യക്രമം മലയാളത്തിൽ രണ്ടു വാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചു; ഉള്ളടക്കബന്ധം മാറ്റിയിട്ടില്ല.
