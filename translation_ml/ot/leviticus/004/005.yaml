language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַ֛ח הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר וְ/הֵבִ֥יא אֹת֖/וֹ אֶל אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/005.yaml
  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: ml
  text: അഭിഷിക്തനായ പുരോഹിതൻ കാളയുടെ രക്തത്തിൽനിന്ന് കുറച്ച് എടുത്ത്[a] സമാഗമകൂടാരത്തിനകത്തേക്കു കൊണ്ടുവരണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “കാളയുടെ രക്തത്തിൽനിന്ന്.” ഹീബ്രുവിലെ പ്രയോഗം ഇവിടെ ഭാഗസൂചകമായിരിക്കാം; പുരോഹിതൻ രക്തം മുഴുവനുമല്ല, അതിൽ ഒരു ഭാഗമാണ് എടുക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രു അക്ഷരാർഥത്തിൽ “സമാഗമകൂടാരത്തിലേക്ക്” എന്നാണ്. തുടർന്നുള്ള അനുഷ്ഠാനങ്ങൾ വിശുദ്ധകൂടാരത്തിനുള്ളിൽ നടക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ “അകത്തേക്ക്” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: എടുത്ത് ... കൊണ്ടുവരണം
  rationale: യാഗക്രമത്തിലെ തുടർച്ചയായ നിർദേശം സൂചിപ്പിക്കുന്നതിനാൽ, ഹീബ്രു രൂപത്തെ ഭൂതകാലമായി അല്ലാതെ നിർദേശാർഥത്തിലുള്ള ‘വേണം’ ഉപയോഗിച്ച് വിവർത്തനം ചെയ്തു; മലയാളത്തിലെ സ്വാഭാവിക ക്രമവാക്യത്തിനായി ആദ്യ ക്രിയയെ ‘എടുത്ത്’ എന്നു ബന്ധിപ്പിച്ചു.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: അഭിഷിക്തനായ പുരോഹിതൻ
  rationale: മָשִׁיחַ എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘അഭിഷിക്തൻ’ നിലനിർത്തുന്നു; ‘മഹാപുരോഹിതൻ’ എന്ന വ്യാഖ്യാനപരമായ പദവി പകരംവയ്ക്കുകയോ പിൽക്കാല ക്രിസ്തുസംബന്ധമായ അർഥം ഇവിടെ ചേർക്കുകയോ ചെയ്യുന്നില്ല.
- source_word: מִדַּם
  choice: രക്തത്തിൽനിന്ന് കുറച്ച്
  rationale: מִן ഇവിടെ ഭാഗസൂചകമായി പ്രവർത്തിക്കുന്നതിനാൽ മുഴുവൻ രക്തമല്ല, അതിൽ ഒരു ഭാഗമാണ് എടുക്കുന്നതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַפָּר
  choice: കാളയുടെ
  rationale: פַּר പ്രായപൂർത്തിയായ ആൺകന്നുകാലിയെ, അഥവാ കാളയെ, സൂചിപ്പിക്കുന്നു; ഹീബ്രു ബന്ധം മലയാളത്തിൽ ഷഷ്ഠിവിഭക്തിയിലൂടെ സ്വാഭാവികമായി നൽകി.
- source_word: וְהֵבִיא אֹתוֹ
  choice: കൊണ്ടുവരണം
  rationale: കർമപ്രത്യയം മുമ്പു പറഞ്ഞ രക്തത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അത് ആവർത്തിക്കാതെയും പ്രത്യേക സർവനാമം ചേർക്കാതെയും അർഥം വ്യക്തമാണ്; ‘വേണം’ നടപടിക്രമപരമായ നിർദേശം പ്രകടമാക്കുന്നു.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിനകത്തേക്ക്
  rationale: אֶל സാധാരണയായി ‘-ലേക്ക്’ എന്നാണ്; തുടർന്നുള്ള അനുഷ്ഠാനങ്ങൾ വിശുദ്ധകൂടാരത്തിനുള്ളിൽ നടക്കുന്നതിനാൽ ഇവിടെ പ്രവേശനദിശ വ്യക്തമാക്കാൻ ‘അകത്തേക്ക്’ ഉപയോഗിച്ചു. אֹהֶל מוֹעֵד എന്നതിന് പരിചിതവും മാന്യവുമായ ‘സമാഗമകൂടാരം’ സ്വീകരിച്ചു.
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ എന്ന ലേവ്യപദവിയുടെ വിവർത്തനം
  choice: അഭിഷിക്തനായ പുരോഹിതൻ
  alternative: മഹാപുരോഹിതൻ; പ്രതിഷ്ഠിക്കപ്പെട്ട പുരോഹിതൻ
  rationale: ഹീബ്രുവിലെ ‘അഭിഷിക്തൻ’ എന്ന പദാർഥം നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് മഹാപുരോഹിതനെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും ആ വ്യാഖ്യാനപദവി മുഖ്യപാഠത്തിൽ പകരംവയ്ക്കുന്നില്ല; അതുപോലെ പിൽക്കാല മശീഹാ/ക്രിസ്തു അർഥവും ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ അനുഷ്ഠാനനിർദേശ ശൈലി. ‘സമാഗമകൂടാരം,’ ‘അഭിഷിക്തനായ പുരോഹിതൻ’ എന്നീ സഭാപാരമ്പര്യങ്ങളിൽ വ്യാപകമായി മനസ്സിലാക്കപ്പെടുന്ന പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും ഏതെങ്കിലും പ്രത്യേക സമുദായത്തിന്റെ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
