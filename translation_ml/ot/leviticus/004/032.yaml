    text: അല്ലെങ്കിൽ, ‘ശുദ്ധീകരണയാഗം.’ എബ്രായപദമായ חַטָּאת പാപവും ആചാരപരമായ അശുദ്ധിയും കൈകാര്യം ചെയ്യുന്ന യാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
