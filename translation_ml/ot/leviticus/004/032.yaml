id: LEV.4.32
reference: Leviticus 4:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם כֶּ֛בֶשׂ יָבִ֥יא קָרְבָּנ֖/וֹ לְ/חַטָּ֑את נְקֵבָ֥ה תְמִימָ֖ה יְבִיאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/032.yaml
  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
translation:
  language: ml
  text: ഒരു ചെമ്മരിയാട്ടിൻകുട്ടിയെ തന്റെ പാപയാഗത്തിനുള്ള വഴിപാടായി അവൻ കൊണ്ടുവരുന്നെങ്കിൽ, ഊനമില്ലാത്ത ഒരു പെൺചെമ്മരിയാട്ടിൻകുട്ടിയെ അവൻ കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: തൊട്ടുമുമ്പുള്ള യാഗനിർദേശത്തോടു ബന്ധിപ്പിച്ചുകൊണ്ട് മറ്റൊരു സാധ്യത അവതരിപ്പിക്കുന്ന സോപാധിക പ്രയോഗം.
- source_word: כֶּבֶשׂ
  choice: ഒരു ചെമ്മരിയാട്ടിൻകുട്ടി
  rationale: ആട്ടിൻകൂട്ടത്തിലെ ഇളം ചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു; യാഗസന്ദർഭത്തിലും തുടർന്നുള്ള പെൺലിംഗനിർദേശത്തിലും സ്വാഭാവികമാണ്.
- source_word: יָבִיא
  choice: കൊണ്ടുവരുന്നു
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ വസ്തുവിനെ കൊണ്ടുവരുക എന്ന വ്യക്തമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: קָרְבָּנוֹ
  choice: വഴിപാടായി
  rationale: ദൈവസന്നിധിയിലേക്കു കൊണ്ടുവരുന്ന അർപ്പണത്തെ സൂചിപ്പിക്കുന്ന קָרְבָּן എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; ഉടമസ്ഥത വാക്യത്തിലെ ‘അവൻ’ എന്ന കർത്താവിലൂടെ വ്യക്തമാകുന്നു.
- source_word: לְחַטָּאת
  choice: പാപപരിഹാരയാഗമായി
  rationale: ലേവ്യപുസ്തകത്തിലെ പ്രത്യേക യാഗവിഭാഗത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ശുദ്ധീകരണപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: נְקֵבָה
  choice: ഒരു പെൺകുട്ടി
  rationale: മൃഗം പെൺലിംഗത്തിലുള്ളതായിരിക്കണം എന്ന നിർദേശം വ്യക്തമാക്കുന്നു; മുൻപറഞ്ഞ ചെമ്മരിയാട്ടിൻകുട്ടിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תְמִימָה
  choice: ഊനമില്ലാത്ത
  rationale: യാഗമൃഗത്തിൽ വൈകല്യമോ ദോഷമോ ഇല്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്ന കൃത്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: יְבִיאֶנָּה
  choice: കൊണ്ടുവരണം
  rationale: പെൺമൃഗത്തെ സൂചിപ്പിക്കുന്ന കർമപ്രത്യയത്തോടുകൂടിയ ആവർത്തിത ക്രിയയുടെ നിർദേശാത്മക ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യാഗനിയമത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപപരിഹാരയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ പദം പാപവുമായി ബന്ധപ്പെട്ട യാഗവിഭാഗത്തെയും ആചാരപരമായ അശുദ്ധി നീക്കുന്നതിനുള്ള ശുദ്ധീകരണപ്രവർത്തനത്തെയും സൂചിപ്പിക്കാം. പരിചിതവും വ്യക്തവുമായ ‘പാപപരിഹാരയാഗം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. യാഗസാങ്കേതിക പദം വായനാസൗകര്യത്തിനായി വ്യക്തമായി നൽകിയിരിക്കുന്നു; മൂലപാഠത്തിലെ ആവർത്തനവും സോപാധിക ഘടനയും നിലനിർത്തിയിട്ടുണ്ട്.
