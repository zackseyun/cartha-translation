revisions:
- from: എന്നാൽ അവൻ പാപപരിഹാരയാഗമായി[a] ഒരു ചെമ്മരിയാട്ടിൻകുട്ടിയെ വഴിപാടായി കൊണ്ടുവരുന്നെങ്കിൽ, ഊനമില്ലാത്ത ഒരു പെൺകുട്ടിയെ കൊണ്ടുവരണം.
  to: ഒരു ചെമ്മരിയാട്ടിൻകുട്ടിയെ തന്റെ പാപയാഗത്തിനുള്ള വഴിപാടായി അവൻ കൊണ്ടുവരുന്നെങ്കിൽ, ഊനമില്ലാത്ത ഒരു പെൺചെമ്മരിയാട്ടിൻകുട്ടിയെ അവൻ കൊണ്ടുവരണം.
  rationale: The revision identifies the female animal unambiguously, retains the source’s repeated bringing language and possessive ‘his offering,’ and uses a conventional Malayalam sacrificial category term without deciding the debated expiatory versus purificatory emphasis. The footnote preserves that genuine lexical alternative.
