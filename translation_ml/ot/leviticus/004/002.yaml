id: LEV.4.2
reference: Leviticus 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു[a] പറയുക: യഹോവയുടെ കല്പനകളാൽ വിലക്കിയിരിക്കുന്ന കാര്യങ്ങളിൽ ഏതെങ്കിലും ഒന്ന് ഒരാൾ അറിയാതെ[b] ചെയ്തു പാപം ചെയ്താൽ,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ‘ഇസ്രായേൽജനം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘അബദ്ധത്തിൽ’ അല്ലെങ്കിൽ ‘പിഴവുമൂലം’ എന്നും പരിഭാഷപ്പെടുത്താം; മനഃപൂർവമായ ധിക്കാരത്തോടെയല്ലാതെ സംഭവിച്ച പാപത്തെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: പറയുക
  rationale: ദൈവം മോശെയോടു നൽകുന്ന നേരിട്ടുള്ള ആജ്ഞയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധമുള്ള എബ്രായ പ്രയോഗത്തെ മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ സമൂഹം മുഴുവനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נֶפֶשׁ
  choice: ഒരാൾ
  rationale: നിയമസന്ദർഭത്തിൽ ഈ പദം അമൂർത്തമായ ‘ആത്മാവ്’ എന്നതിലുപരി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: בִשְׁגָגָה
  choice: അറിയാതെ
  rationale: ബോധപൂർവമായ ധിക്കാരത്തിനു വിപരീതമായി, അശ്രദ്ധയാലോ അബദ്ധത്തിലോ സംഭവിക്കുന്ന പ്രവൃത്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: מִכֹּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: യഹോവയുടെ കല്പനകളാൽ വിലക്കിയിരിക്കുന്ന കാര്യങ്ങളിൽ ഏതെങ്കിലും ഒന്ന്
  rationale: ചെയ്യരുതാത്ത പ്രവൃത്തികളെ സംബന്ധിച്ച കല്പനകൾ എന്ന എബ്രായ നിയമപ്രയോഗത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: അവയിൽ ഏതെങ്കിലും ഒന്ന് ... ചെയ്തു
  rationale: മുമ്പു പറഞ്ഞ വിലക്കപ്പെട്ട കാര്യങ്ങളിൽ ഒന്ന് യഥാർഥത്തിൽ ചെയ്തുവെന്ന വ്യവസ്ഥ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: അബദ്ധത്തിൽ ചെയ്ത പാപത്തിന്റെ സ്വഭാവം
  choice: അറിയാതെ ചെയ്തു പാപം ചെയ്താൽ
  alternative: മനഃപൂർവമല്ലാതെ പാപം ചെയ്താൽ
  rationale: പ്രവൃത്തി പാപമല്ലെന്നു ലഘൂകരിക്കാതെ, അത് ബോധപൂർവമായ ധിക്കാരത്തോടെ ചെയ്തതല്ലെന്ന പാഠത്തിലെ വ്യത്യാസം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. എബ്രായ വാക്യഘടന അതേപടി പകർത്താതെ, ‘പാപം ചെയ്യുകയും അവയിൽ ഒന്ന് പ്രവർത്തിക്കുകയും ചെയ്താൽ’ എന്ന ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒന്ന് ... ചെയ്തു പാപം ചെയ്താൽ’ എന്നു സംയോജിപ്പിച്ചു; അർഥഘടകങ്ങൾ എല്ലാം നിലനിർത്തി.
