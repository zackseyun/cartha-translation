source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵי/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָי֖וֹת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: ml
  text: രണ്ടു വൃക്കകളും, അവയുടെ മേലുള്ളതും അരപ്രദേശത്തിന്മേലുള്ളതുമായ കൊഴുപ്പും, വൃക്കകളോടൊപ്പം കരളിന്മേലുള്ള അനുബന്ധഭാഗവും[a] അവൻ നീക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കരളിന്റെ ഒരു ദളം.’ ഈ ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; അതിനാൽ ‘അനുബന്ധഭാഗം’ എന്ന സൂക്ഷ്മമായ പരിഭാഷയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: രണ്ടു വൃക്കകൾ
  rationale: എബ്രായത്തിലെ എണ്ണവും വ്യക്തമായ ശരീരാവയവസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַחֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗസന്ദർഭത്തിൽ അർപ്പിക്കാനായി വേർതിരിക്കുന്ന കൊഴുപ്പുഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദം.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: അവയുടെ മേലുള്ള
  rationale: ബന്ധവാക്യം വൃക്കകളുടെ മേലുള്ള കൊഴുപ്പിനെ സൂചിപ്പിക്കുന്നതാണെന്ന് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַכְּסָלִים
  choice: അരക്കെട്ടിന്റെ ഭാഗം
  rationale: ഈ ശരീരഘടനാ സന്ദർഭത്തിലെ അര/പാർശ്വപ്രദേശത്തെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: കരളിന്മേലുള്ള അനുബന്ധഭാഗം
  rationale: കൃത്യമായ ശരീരഘടന വിവാദമായതിനാൽ അമിതകൃത്യത ഒഴിവാക്കി, עַל എന്ന ഉപസർഗത്തിന്റെ സ്ഥാനബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: עַל הַכְּלָיוֹת
  choice: വൃക്കകളോടൊപ്പം
  rationale: യാഗക്രമത്തിൽ ഈ ഭാഗം വൃക്കകളോടൊപ്പം നീക്കണമെന്ന കൂട്ടായ പ്രവർത്തനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְסִירֶנָּה
  choice: അവൻ നീക്കണം
  rationale: നിയമപരമായ നിർദേശശൈലിയും പട്ടികപ്പെടുത്തിയ ഭാഗങ്ങളെ ഒരു കൂട്ടമായി നീക്കുന്ന പ്രവൃത്തിയും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
