    issue: The rendering of הַכְּסָלִים is indirect and imprecise.
    rationale: ‘അരക്കെട്ടിന്റെ ഭാഗത്തുള്ള’ means roughly ‘located in the part of the waist/waistband’ rather than directly expressing the anatomical loins region. ‘അരപ്രദേശത്തിന്മേലുള്ള’ more faithfully reflects ‘which is upon the loins’ and reads more naturally in Malayalam.
  revised_text: രണ്ടു വൃക്കകളും, അവയുടെ മേലുള്ളതും അരപ്രദേശത്തിന്മേലുള്ളതുമായ കൊഴുപ്പും, വൃക്കകളോടൊപ്പം കരളിന്മേലുള്ള അനുബന്ധഭാഗവും[a] അവൻ നീക്കണം.
