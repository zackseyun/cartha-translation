translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ വാക്യത്തിലെ പട്ടികാക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അസ്വാഭാവിക ആവർത്തനം കുറച്ചു; ശരീരഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
