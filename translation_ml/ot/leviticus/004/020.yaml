source:
  edition: WLC
  text: וְ/עָשָׂ֣ה לַ/פָּ֔ר כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/פַ֣ר הַֽ/חַטָּ֔את כֵּ֖ן יַעֲשֶׂה לּ֑/וֹ וְ/כִפֶּ֧ר עֲלֵ/הֶ֛ם הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: ml
  text: പാപയാഗത്തിന്റെ കാളയോട് ചെയ്തതുപോലെ അവൻ ഈ കാളയോടും ചെയ്യണം; അതേവിധം ഇതിനോടും അവൻ ചെയ്യണം. പുരോഹിതൻ അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം; അവർ ക്ഷമിക്കപ്പെടും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: അവൻ ഈ കാളയോടും ചെയ്യണം
  rationale: עשה എന്ന സാധാരണ ക്രിയയുടെ നടപടിക്രമപരമായ നിർദേശസ്വഭാവം ‘ചെയ്യണം’ എന്നു സ്വാഭാവികമായി നൽകി; לַפָּר ഇവിടെ കാളയോടുള്ള ആചാരപരമായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കാളയോട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כַּאֲשֶׁר עָשָׂה לְפַר הַחַטָּאת
  choice: പാപയാഗത്തിനുള്ള കാളയോട് ചെയ്തതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר എന്ന താരതമ്യം ‘ചെയ്തതുപോലെതന്നെ’ എന്നു വ്യക്തമായി നിലനിർത്തി. חטאת എന്നതിന് പരിചിതവും സന്ദർഭോചിതവുമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: അതേവിധം അവൻ ഇതിനോടും ചെയ്യണം
  rationale: כֵּן സൂചിപ്പിക്കുന്ന കൃത്യമായ അനുരൂപത ‘അതേവിധം’ എന്നു നിലനിർത്തി; ആവർത്തനം മൂലപാഠത്തിന്റെ ഊന്നൽ ആയതിനാൽ ഒഴിവാക്കിയില്ല.
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: പുരോഹിതൻ അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: כפר എന്ന യാഗപരമായ മുഖ്യപദത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ സുതാര്യമായ ‘പ്രായശ്ചിത്തം കഴിക്കുക’ ഉപയോഗിച്ചു; עליהם എന്നത് പ്രയോജനം/പ്രതിനിധിത്വം സൂചിപ്പിക്കുന്ന ‘അവർക്കുവേണ്ടി’ ആയി നൽകി.
- source_word: וְנִסְלַח לָהֶם
  choice: അപ്പോൾ അവർ ക്ഷമിക്കപ്പെടും
  rationale: סלח എന്ന നിഫാൽ രൂപത്തിന്റെ ഫലസൂചക നിഷ്ക്രിയാർത്ഥം ‘അവർ ക്ഷമിക്കപ്പെടും’ എന്നു നൽകി. വാക്യഫലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: യാഗനിയമത്തിലെ חטאת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ പദം പാപത്തെ കൈകാര്യം ചെയ്യുന്ന യാഗത്തെയും അതിലൂടെ ഉണ്ടാകുന്ന ശുദ്ധീകരണത്തെയും സൂചിപ്പിക്കാം. സാധാരണ വായനക്കാർക്ക് പരിചിതവും ലേവ്യപുസ്തകം 4-ന്റെ പാപസന്ദർഭം നേരിട്ട് പ്രകടമാക്കുന്നതുമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; യഥാർഥമായ മറ്റൊരു അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആചാരനിയമത്തിന്റെ നിർദേശസ്വഭാവം ‘ചെയ്യണം’ എന്ന രൂപത്തിൽ നിലനിർത്തി; മൂലപാഠത്തിലെ താരതമ്യവും ആവർത്തനവും സംരക്ഷിച്ചു.
