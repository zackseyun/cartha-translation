  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ പാപയാഗത്തിന്റെ[a] രക്തത്തിൽനിന്ന് കുറച്ച് തന്റെ വിരൽകൊണ്ട് എടുത്ത് ഹോമയാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ പുരട്ടണം; അതിന്റെ രക്തം മുഴുവനും യാഗപീഠത്തിന്റെ ചുവട്ടിൽ ഒഴിച്ചുകളയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശുദ്ധീകരണയാഗം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം പാപവുമായി ബന്ധപ്പെട്ടും ആചാരപരമായ ശുദ്ധീകരണവുമായി ബന്ധപ്പെട്ടും അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: പിന്നെ ... എടുത്ത്
  rationale: വാവ് + ഖാതൽ രൂപം ആചാരനടപടിയിലെ അടുത്ത ഘട്ടത്തെ തുടർച്ചയായി അവതരിപ്പിക്കുന്നു; ‘പിന്നെ’ നടപടിക്രമത്തിന്റെ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആചാരം നിർവഹിക്കുന്ന നിർദിഷ്ട പുരോഹിതനെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: מִדַּם
  choice: രക്തത്തിൽ കുറച്ച്
  rationale: 'מִן ഇവിടെ അംശസൂചകമാണ്: വിരൽകൊണ്ട് പ്രയോഗിക്കുന്നത് രക്തത്തിന്റെ ഒരു ഭാഗം മാത്രമാണ്.'
- source_word: הַחַטָּאת
  choice: പാപയാഗം
  rationale: ഈ യാഗക്രമസന്ദർഭത്തിൽ പദം അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘പാപയാഗം’ പരിചിതവും അർഥവ്യക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: בְּאֶצְבָּעוֹ
  choice: തന്റെ വിരൽകൊണ്ട്
  rationale: בְּ ഇവിടെ ഉപകരണാർഥം നൽകുന്നു; പുരോഹിതൻ രക്തം പുരട്ടാൻ തന്റെ വിരൽ ഉപയോഗിക്കുന്നു.
- source_word: וְנָתַן
  choice: പുരട്ടണം
  rationale: נתן അടിസ്ഥാനമായി ‘വെക്കുക/നൽകുക’ എന്നാണെങ്കിലും, യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ രക്തം വിരൽകൊണ്ട് ഇടുന്ന ഈ ആചാരസന്ദർഭത്തിൽ ‘പുരട്ടണം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: ഹോമയാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ
  rationale: യാഗപീഠത്തിലെ കൊമ്പുപോലുള്ള projections എന്ന ആചാരചിത്രവും, അത് ഹോമയാഗവുമായി ബന്ധപ്പെട്ട പീഠമാണെന്ന തിരിച്ചറിയലും നിലനിർത്തുന്നു.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: അതിന്റെ രക്തം മുഴുവനും
  rationale: כָּל സൂചിപ്പിക്കുന്ന സമഗ്രത നിലനിർത്തുന്നു. വിരൽകൊണ്ട് കുറച്ചെടുത്ത ശേഷമുള്ള ശേഷിപ്പാണ് സന്ദർഭത്തിൽ ഉദ്ദേശ്യമെങ്കിലും, മൂലപാഠത്തിലെ ‘മുഴുവനും’ എന്ന രൂപം മാറ്റിയിട്ടില്ല.
- source_word: יִשְׁפֹּךְ
  choice: ഒഴിച്ചുകളയണം
  rationale: രക്തം ആചാരപരമായി മനഃപൂർവം ഒഴിക്കുന്ന പ്രവൃത്തി വ്യക്തമാക്കുന്നു; ആകസ്മികമായി ചൊരിയുക എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ ചുവട്ടിൽ
  rationale: יְסוֹד എന്ന ‘അടിസ്ഥാനം/ചുവട്’ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യാഗനിയമത്തിൽ חַטָּאת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ സന്ദർഭത്തിൽ പദം ഒരു യാഗത്തെ സൂചിപ്പിക്കുന്നു എന്നത് വ്യക്തമാണ്; എന്നാൽ ആ യാഗത്തിന്റെ പാപബന്ധവും ശുദ്ധീകരണപ്രവർത്തനവും പദത്തിൽ ഒത്തുചേരുന്നു. പ്രധാനപാഠത്തിൽ പരിചിതമായ ‘പാപയാഗം’ ഉപയോഗിച്ച്, സാധുവായ മറ്റൊരു വ്യാഖ്യാനപരിഭാഷ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവമുള്ള ആചാരഭാഷ ഉപയോഗിച്ചു. ‘ഹോമയാഗപീഠം,’ ‘കൊമ്പുകൾ,’ ‘പാപയാഗം’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി.
