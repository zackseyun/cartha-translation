source:
  edition: WLC
  text: וְ/אֶת כָּל חֵ֛לֶב פַּ֥ר הַֽ/חַטָּ֖את יָרִ֣ים מִמֶּ֑/נּוּ אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה עַל הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: ml
  text: 'പാപപരിഹാരയാഗത്തിനുള്ള കാളയുടെ കൊഴുപ്പെല്ലാം അവൻ അതിൽനിന്നു നീക്കണം: കുടലുകളെ മൂടുന്ന കൊഴുപ്പും കുടലുകളുടെ മേലുള്ള കൊഴുപ്പെല്ലാം.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുദ്ധീകരണയാഗത്തിനുള്ള കാള.” എബ്രായത്തിലെ חַטָּאת എന്ന പദം ‘പാപം’ എന്നും പാപമോ അശുദ്ധിയോ നീക്കുന്നതുമായി ബന്ധപ്പെട്ട യാഗം എന്നും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: എല്ലാം
  rationale: നിർദേശിക്കപ്പെട്ട കൊഴുപ്പ് മുഴുവനും നീക്കണമെന്ന എബ്രായപദത്തിന്റെ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: חֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗക്രമത്തിൽ വേർതിരിക്കേണ്ട പ്രത്യേക കൊഴുപ്പിനെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ശരീരഘടനാവിവരണം അർഥം വ്യക്തമാക്കുന്നു.
- source_word: פַּר הַחַטָּאת
  choice: പാപപരിഹാരയാഗത്തിനുള്ള കാള
  rationale: കാള ഈ യാഗത്തിനായി നിയോഗിക്കപ്പെട്ടതാണെന്ന സംയുക്തബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יָרִים
  choice: നീക്കണം
  rationale: പദത്തിന്റെ അടിസ്ഥാനമായ ‘ഉയർത്തുക’ എന്ന ആശയത്തേക്കാൾ, ഇവിടെ യാഗമൃഗത്തിൽനിന്ന് നിർദിഷ്ട ഭാഗങ്ങൾ വേർതിരിച്ചെടുക്കുന്ന ആചാരപ്രവർത്തനമാണ് സന്ദർഭോചിതം.
- source_word: מִמֶּנּוּ
  choice: അതിൽനിന്നു
  rationale: സർവനാമം യാഗത്തിനുള്ള കാളയെ സൂചിപ്പിക്കുന്നു; നടപടിവിവരണത്തിൽ സ്വാഭാവികമായ നപുംസകപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: הַמְכַסֶּה
  choice: മൂടുന്ന
  rationale: കൊഴുപ്പിന്റെ സ്ഥാനവും പ്രവർത്തനവും വിവരിക്കുന്ന വിശേഷണാത്മക കൃദന്തരൂപം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: קֶרֶב
  choice: കുടലുകൾ
  rationale: യാഗശരീരഘടനയുടെ ഈ സന്ദർഭത്തിൽ ഉള്ളവയവങ്ങളെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ പദം.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: കുടലുകളുടെ മേലുള്ള
  rationale: עַל എന്നതിന്റെ സ്ഥാനസൂചന നിലനിർത്തുകയും കുടലുകളെ മൂടുന്ന കൊഴുപ്പിനോടൊപ്പം മേലുള്ള കൊഴുപ്പും ഉൾപ്പെടുന്നതായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപപരിഹാരയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: חַטָּאת പാപത്തെയും പാപം/അശുദ്ധി നീക്കുന്നതുമായി ബന്ധപ്പെട്ട യാഗത്തെയും സൂചിപ്പിക്കാം. മലയാളത്തിലെ പരിചിതവും സന്ദർഭോചിതവുമായ ‘പാപപരിഹാരയാഗം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച്, ‘ശുദ്ധീകരണയാഗം’ എന്ന സാധുവായ മറ്റൊരു ഊന്നൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ആചാരനിർദേശ ശൈലി. എബ്രായവാക്യത്തിലെ ആവർത്തനവും ശരീരഘടനാസംബന്ധമായ സ്ഥാനവ്യത്യാസവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
