source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַ֤ט אֹתָ/הּ֙ לְ/חַטָּ֔את בִּ/מְק֕וֹם אֲשֶׁ֥ר יִשְׁחַ֖ט אֶת הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: ml
  text: അവൻ പാപയാഗമൃഗത്തിന്റെ തലയിൽ തന്റെ കൈവയ്ക്കണം; പിന്നെ ഹോമയാഗമൃഗത്തെ അറുക്കുന്ന സ്ഥലത്തുവെച്ച് അതിനെ പാപയാഗമായി അറുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാപയാഗം’ വരുന്ന രണ്ടു സ്ഥലങ്ങളിലും ‘ശുദ്ധീകരണയാഗം’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായപദത്തിന് പാപത്തെയും ആചാരപരമായ അശുദ്ധിയെയും പരിഹരിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת־יָדוֹ
  choice: തന്റെ കൈവെക്കണം
  rationale: സാംസ്കാരിക-യാഗസന്ദർഭത്തിൽ סמך കൈ മൃഗത്തിന്മേൽ വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ഏകവചനമായ ‘കൈ’ നിലനിർത്തി.
- source_word: עַל רֹאשׁ הַחַטָּאת
  choice: പാപയാഗമൃഗത്തിന്റെ തലയിൽ
  rationale: חטאת ഇവിടെ ഒരു യാഗത്തെയും അതിനായി കൊണ്ടുവന്ന മൃഗത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ തലയും അറുക്കലും സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘യാഗമൃഗം’ എന്ന് വ്യക്തമാക്കി.
- source_word: וְשָׁחַט אֹתָהּ
  choice: അതിനെ … അറുക്കണം
  rationale: שׁחט യാഗമൃഗത്തെ ആചാരപരമായി അറുക്കുന്നതിനുള്ള സാങ്കേതിക ക്രിയയാണ്; ‘അറുക്കുക’ അതിന്റെ മൂർത്തവും യാഗപരവുമായ അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗമായി
  rationale: ലാമെദ് ഇവിടെ മൃഗത്തിന്റെ യാഗപരമായ നിയോഗം സൂചിപ്പിക്കുന്നു; ‘പാപയാഗമായി’ മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט אֶת־הָעֹלָה
  choice: ഹോമയാഗമൃഗത്തെ അറുക്കുന്ന സ്ഥലത്തുവെച്ച്
  rationale: ആചാരനിർദേശത്തിലെ പതിവായ പ്രവൃത്തി മലയാളത്തിലെ അകർതൃസൂചനയുള്ള വർത്തമാനരൂപത്തിൽ സ്വാഭാവികമായി നൽകി; עֹלָהയ്ക്ക് പ്രചാരമുള്ള ‘ഹോമയാഗം’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: യാഗനിയമങ്ങളിൽ חטאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: חטאת പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയും അശുദ്ധി നീക്കുന്ന ശുദ്ധീകരണപ്രവർത്തനത്തെയും സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ പരിചിതമായ ‘പാപയാഗം’ ഉപയോഗിച്ചെങ്കിലും പ്രധാനപ്പെട്ട മറ്റൊരു വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ‘പാപയാഗമൃഗം’, ‘ഹോമയാഗമൃഗം’ എന്നീ രൂപങ്ങൾ അറുക്കപ്പെടുന്നത് യാഗമെന്ന അമൂർത്ത ആശയമല്ല, മൃഗമാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
