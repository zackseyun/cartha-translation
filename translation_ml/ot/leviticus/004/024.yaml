  source_fidelity: 'മുഖ്യഅർത്ഥം ശരിയായി പ്രതിഫലിപ്പിക്കുന്നു: ഒരൊറ്റ കൈ ആൺകോലാടിന്റെ തലയിൽ വെക്കൽ, അതിനെ അറുക്കൽ, യഹോവയുടെ സന്നിധിയിൽ ഹോമയാഗം അറുക്കുന്ന സ്ഥലം, പാപയാഗം എന്ന വർഗീകരണം എന്നിവ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു. എന്നാൽ “ഹോമയാഗമൃഗം” മൂലത്തിലെ הָעֹלָה (‘ഹോമയാഗം/burnt offering’) എന്ന യാഗവർഗപദത്തേക്കാൾ വ്യാഖ്യാനപരമായി കൂടുതൽ നിർദിഷ്ടമാണ്.'
  naturalness: “കൈവെച്ച്” സ്വാഭാവികമാണെങ്കിലും നിർദേശരൂപമായ וְסָמַךְ-ന്റെ പ്രവൃത്തിയെ “കൈവെക്കണം” എന്ന് പ്രത്യേകം പറയുന്നത് കൂടുതൽ വ്യക്തവും നിയമനിർദേശ ശൈലിക്ക് യോജിച്ചതുമാണ്. “ഹോമയാഗം അറുക്കുന്ന സ്ഥലത്ത്” ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
