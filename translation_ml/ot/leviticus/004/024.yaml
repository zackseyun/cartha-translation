source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שָׁחַ֣ט אֹת֔/וֹ בִּ/מְק֛וֹם אֲשֶׁר יִשְׁחַ֥ט אֶת הָ/עֹלָ֖ה לִ/פְנֵ֣י יְהוָ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: ml
  text: അവൻ തന്റെ കൈ ആൺകോലാടിന്റെ തലയിൽ വെക്കണം; യഹോവയുടെ സന്നിധിയിൽ ഹോമയാഗം അറുക്കുന്ന സ്ഥലത്ത് അതിനെ അറുക്കണം. അത് പാപയാഗമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത് ശുദ്ധീകരണയാഗമാണ്.” എബ്രായത്തിലെ חַטָּאת എന്ന പദത്തിന് ‘പാപം’ എന്നും പാപമോ അശുദ്ധിയോ നീക്കുന്നതുമായി ബന്ധപ്പെട്ട യാഗം എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: തന്റെ കൈവെച്ച്
  rationale: യാഗകർമത്തിലെ סמך יד എന്ന പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; എബ്രായത്തിലെ ഏകവചനമായ ‘കൈ’ നിലനിർത്തുന്നു.
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: ആൺകോലാടിന്റെ തലയിൽ
  rationale: שָׂעִיר ഇവിടെ യാഗത്തിനുള്ള ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; ലിംഗസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְשָׁחַט אֹתוֹ
  choice: അതിനെ അറുക്കണം
  rationale: שׁחט എന്നത് യാഗസന്ദർഭത്തിലെ ആചാരപരമായ അറുക്കലിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കൊല്ലുക’ എന്ന പൊതുപദത്തേക്കാൾ ‘അറുക്കുക’ യോജിക്കുന്നു.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט אֶת הָעֹלָה
  choice: ഹോമയാഗമൃഗത്തെ അറുക്കുന്ന സ്ഥലത്തുവെച്ച്
  rationale: എബ്രായത്തിലെ സജീവമായ അനിശ്ചിത കർത്തൃപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യമായി നൽകുന്നു; עֹלָה എന്ന യാഗവിഭാഗത്തെ ‘ഹോമയാഗം’ എന്നും ഇവിടെ അറുക്കപ്പെടുന്ന മൃഗത്തെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കിയും പരിഭാഷപ്പെടുത്തി.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സന്നിധി/സാന്നിധ്യ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: חַטָּאת הוּא
  choice: അത് പാപയാഗമാണ്
  rationale: ഈ സന്ദർഭത്തിൽ חַטָּאת ഒരു നിർദിഷ്ട യാഗവിഭാഗത്തെ തിരിച്ചറിയിക്കുന്നു; പരമ്പരാഗതവും വ്യക്തവുമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: חַטָּאת എന്ന യാഗപദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഇവിടെ പദം യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ വ്യക്തവും സ്ഥാപിതവുമാണ്; പാപനിവാരണവും ശുദ്ധീകരണവും ഉൾക്കൊള്ളുന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. യാഗസാങ്കേതിക പദങ്ങൾ വ്യക്തമായി നിലനിർത്തി; യഥാർത്ഥത്തിലെ അർത്ഥദ്വന്ദ്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
