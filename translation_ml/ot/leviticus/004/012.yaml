base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: ml
  text: അവൻ കാളയെ മുഴുവനും പാളയത്തിനു പുറത്തുള്ള ശുദ്ധമായ ഒരു സ്ഥലത്തേക്ക്[a], ചാരം നിക്ഷേപിക്കുന്ന സ്ഥലത്തേക്ക്[b], കൊണ്ടുപോകണം; വിറകിന്മേൽ തീയിൽ അതിനെ ദഹിപ്പിക്കണം. ചാരം നിക്ഷേപിക്കുന്ന സ്ഥലത്തുവെച്ചുതന്നെ അതു ദഹിപ്പിക്കപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യക്തമായി: “ആചാരപരമായി ശുദ്ധമായ ഒരു സ്ഥലം.”'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ചാരം ഒഴിച്ചിടുന്ന സ്ഥലം”; അതായത്, യാഗപീഠത്തിലെ ചാരം നിക്ഷേപിക്കാൻ നിശ്ചയിച്ചിരുന്ന സ്ഥലം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: കൊണ്ടുപോയി
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം പുറത്തേക്കു കൊണ്ടുപോകുന്ന കാരണക പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘പാളയത്തിനു പുറത്തുള്ള’ എന്ന പ്രയോഗം ദിശ വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ ‘കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്.
- source_word: כָּל הַפָּר
  choice: കാളയെ മുഴുവനും
  rationale: כָּל നിശ്ചിതനാമത്തോടൊപ്പം വരുന്നത് മൃഗത്തിന്റെ മുഴുവൻ ഭാഗവും ഉദ്ദേശിക്കുന്നുവെന്ന് ഊന്നിപ്പറയുന്നു.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തുള്ള
  rationale: പാളയത്തിന്റെ അതിർത്തിക്കു പുറത്തുള്ള സ്ഥലം എന്ന സ്ഥാനാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מָקוֹם טָהוֹר
  choice: ശുദ്ധമായ ഒരു സ്ഥലം
  rationale: טָהוֹר എന്നത് ലേവ്യസന്ദർഭത്തിൽ ആചാരപരമായ ശുദ്ധിയെയും സൂചിപ്പിക്കാം; പ്രധാനവാക്യത്തിൽ ലളിതമായ ‘ശുദ്ധമായ’ നിലനിർത്തി ആ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: ചാരം നിക്ഷേപിക്കുന്ന സ്ഥലം
  rationale: שֶׁפֶךְ ഒഴിച്ചിടുകയോ നിക്ഷേപിക്കുകയോ ചെയ്യുന്ന നിശ്ചിത സ്ഥലത്തെയും דֶּשֶׁן ഇവിടെ യാഗപീഠത്തിലെ ചാരത്തെയും സൂചിപ്പിക്കുന്നു. ‘ചാരക്കൂമ്പാരം’ എന്നതിനെക്കാൾ സ്ഥലത്തിന്റെ നിയുക്തമായ ഉപയോഗം ഈ വിവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: וְשָׂרַף אֹתוֹ
  choice: ദഹിപ്പിക്കണം
  rationale: നിയമനിർദേശത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും שׂרף എന്നതിന്റെ പൂർണമായി കത്തിക്കുന്ന അർഥം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: വിറകിന്മേൽ തീയിൽ
  rationale: ഇന്ധനമായ വിറകിനെയും തീയെയും എബ്രായപാഠം വേർതിരിച്ചു പറയുന്നത് കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: ചാരം നിക്ഷേപിക്കുന്ന സ്ഥലത്തുവെച്ചുതന്നെ അതു ദഹിപ്പിക്കണം
  rationale: നിയുക്തസ്ഥലം ആവർത്തിച്ചു ഊന്നുന്ന മൂലപാഠത്തിന്റെ നിയമശൈലി സംരക്ഷിക്കാൻ ‘വെച്ചുതന്നെ’ ഉപയോഗിച്ച് ആവർത്തനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: טָהוֹר എന്ന പദത്തിലെ ആചാരശുദ്ധിയുടെ സൂചന
  choice: ശുദ്ധമായ ഒരു സ്ഥലം
  alternative: ആചാരപരമായി ശുദ്ധമായ ഒരു സ്ഥലം
  rationale: യാഗക്രമത്തിന്റെ പശ്ചാത്തലം ആചാരശുദ്ധിയെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപദം തന്നെ ‘ആചാരപരമായി’ എന്ന് വിശദീകരിക്കുന്നില്ല. അതിനാൽ പ്രധാനവാക്യത്തിൽ അർഥപരിധി തുറന്നുവെച്ച് അടിക്കുറിപ്പിൽ സാധ്യത വ്യക്തമാക്കുന്നു.
- issue: שֶׁפֶךְ הַדֶּשֶׁן എന്ന യാഗചാര നിർമാർജനസ്ഥലം
  choice: ചാരം നിക്ഷേപിക്കുന്ന സ്ഥലം
  alternative: ചാരക്കൂമ്പാരം
  rationale: ഇത് യാദൃച്ഛികമായ ഒരു ചാരക്കൂമ്പാരമല്ല, യാഗപീഠത്തിലെ ചാരം കൊണ്ടുവന്ന് ഇടുന്നതിനുള്ള നിയുക്തസ്ഥലമാണെന്ന് പദസമുച്ചയം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശശൈലി ഉപയോഗിച്ചു. ‘പാളയം’, ‘യാഗപീഠം’, ‘ദഹിപ്പിക്കുക’ തുടങ്ങിയ പൊതുവായി ഗ്രഹിക്കാവുന്ന ബൈബിൾ-ആരാധനാപദങ്ങൾ നിലനിർത്തി; അനാവശ്യമായ സാങ്കേതികമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
