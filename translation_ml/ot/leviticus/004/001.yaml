id: LEV.4.1
reference: Leviticus 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വേ[a] മോശെയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: YHWH; ‘യഹോവ’ എന്നും ലിപ്യന്തരം ചെയ്യാറുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക പ്രസംഗം ആരംഭിക്കുന്ന וַיְדַבֵּר എന്ന പതിവു സൂത്രവാക്യത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം; സാധാരണ ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിലെ ഔപചാരികത നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: יְהוָה എന്ന ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയത്തെ സ്വാഭാവിക മലയാള ദത്തിവ് രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള ഉദ്ധരണി സൂചിപ്പിക്കുന്ന ദ്വിബിന്ദു
  rationale: ലֵאמֹר തുടർന്നുവരുന്ന പ്രസംഗത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഇപ്രകാരം’ എന്നു ചേർക്കാതെ ദ്വിബിന്ദു ഉപയോഗിക്കുന്നത് അർത്ഥം സ്വാഭാവികമായി കൈമാറുകയും അടുത്ത വാക്യത്തിലേക്കുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. ‘യഹ്‌വെ’ വ്യക്തിനാമം നിലനിർത്തുന്നു; ‘കർത്താവ്’ എന്ന പദവി മൂലത്തിലെ പേരിനെ മറയ്ക്കും. ‘യഹോവ’ പരമ്പരാഗതമായ മറ്റൊരു രൂപമായതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, തിരുവെഴുത്തിനു യോജിച്ച മാന്യമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ ദൈവിക പ്രസംഗസൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; ലֵאמֹר എന്നതിനെ വേറൊരു അനാവശ്യ പദമായി ആവർത്തിക്കാതെ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
