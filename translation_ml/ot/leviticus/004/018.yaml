  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: ml
  text: അവൻ രക്തത്തിൽനിന്ന് കുറച്ച്[a] സമാഗമകൂടാരത്തിലുള്ള, യാഹ്‌വെയുടെ സന്നിധിയിലെ യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ ഇടണം. രക്തം മുഴുവനും സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തുള്ള ഹോമയാഗപീഠത്തിന്റെ അടിഭാഗത്ത് ഒഴിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു അക്ഷരാർഥത്തിൽ: ‘രക്തത്തിൽനിന്ന് അവൻ ഇടണം.’ വാക്യത്തിന്റെ പിന്നീടുള്ള ‘രക്തം മുഴുവനും’ എന്ന പ്രയോഗത്തോടുള്ള വ്യത്യാസം വ്യക്തമാക്കാൻ ‘കുറച്ച്’ എന്നു ചേർത്തിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: രക്തത്തിൽനിന്ന് കുറച്ച്
  rationale: ഹീബ്രു അക്ഷരാർഥത്തിൽ ‘രക്തത്തിൽനിന്ന് അവൻ ഇടണം’ എന്നാണ്. വാക്യത്തിന്റെ പിന്നീടുള്ള ‘രക്തം മുഴുവനും’ എന്നതുമായുള്ള വ്യത്യാസം വ്യക്തമാക്കാൻ അന്തർലീനമായ ഭാഗികാർഥം ‘കുറച്ച്’ എന്നു പ്രകടമാക്കി.
- source_word: יִתֵּן
  choice: ഇടണം
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘വെക്കുക/ഇടുക’ എന്നതാണ്. ‘പുരട്ടണം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ സാങ്കേതിക പദം ഒഴിവാക്കി.
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ കൊമ്പുകൾ
  rationale: קרנות എന്നതിന്റെ രൂപകാത്മകമല്ലാത്ത ആരാധനാസംബന്ധിയായ സാങ്കേതിക അർഥമായ ‘കൊമ്പുകൾ’ നിലനിർത്തി.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: യാഹ്‌വെയുടെ സന്നിധിയിലുള്ള
  rationale: לִפְנֵי എന്നത് ഇവിടെ സ്ഥലസൂചനയോടൊപ്പം ദൈവസാന്നിധ്യവും സൂചിപ്പിക്കുന്നു; ‘സന്നിധിയിൽ’ സ്വാഭാവികമായി രണ്ടും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ വിശുദ്ധകൂടാരത്തിനുള്ള സ്ഥാപിതവും സുതാര്യവുമായ മലയാള പദപ്രയോഗം.
- source_word: וְאֵת כָּל הַדָּם
  choice: രക്തം മുഴുവനും
  rationale: മുമ്പ് ഒരു ഭാഗം ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും ഹീബ്രു നേരിട്ട് ‘രക്തം മുഴുവനും’ എന്നു പറയുന്നു; ‘ശേഷിച്ച രക്തം’ എന്നു വ്യാഖ്യാനിച്ചില്ല.
- source_word: יִשְׁפֹּךְ
  choice: ഒഴിച്ചുകളയണം
  rationale: שׁפך എന്ന ക്രിയയുടെ ആചാരപരമായ സാഹചര്യത്തിലുള്ള ‘pour out’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: אֶל יְסוֹד
  choice: അടിഭാഗത്ത്
  rationale: יְסוֹד എന്നത് യാഗപീഠത്തിന്റെ അടിത്തറയെയോ ചുവടിനെയോ സൂചിപ്പിക്കുന്നു; ‘അടിഭാഗത്ത്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: מִזְבַּח הָעֹלָה
  choice: ഹോമയാഗപീഠം
  rationale: עֹלָה എന്ന സമ്പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള പതിവ് മലയാള പദമായ ‘ഹോമയാഗം’ സംയുക്തരൂപത്തിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിനരികെയുള്ള
  rationale: פֶּתַח എന്ന സ്ഥലസൂചനയെ ‘പ്രവേശനകവാടം’ എന്നു വ്യക്തമായി നൽകി; യാഗപീഠം കവാടത്തിനരികിലാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളക്രമത്തിൽ പ്രകടമാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം തന്നെയാണ് ഉള്ളത്. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെയും ‘Jehovah’ രൂപം സ്വീകരിക്കാതെയും Yahweh എന്നതിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: כָּל הַדָּם എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: രക്തം മുഴുവനും
  alternative: ശേഷിച്ച രക്തം
  rationale: സന്ദർഭത്തിൽ മുമ്പത്തെ പ്രയോഗത്തിനുശേഷം ശേഷിക്കുന്ന രക്തമാണ് ഉദ്ദേശ്യമെങ്കിലും മൂലപാഠത്തിലെ ‘മുഴുവൻ’ എന്ന രൂപം നിലനിർത്തി; അന്തർലീനമായ അർഥം വാചകത്തിൽ പകരംവെച്ചില്ല.
