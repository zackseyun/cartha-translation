id: LEV.4.25
reference: Leviticus 4:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת דָּמ֣/וֹ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד מִזְבַּ֥ח הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ പാപയാഗത്തിന്റെ[a] രക്തത്തിൽനിന്ന് കുറച്ച് തന്റെ വിരൽകൊണ്ട് എടുത്ത് ഹോമയാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ പുരട്ടണം; ശേഷിച്ച രക്തം ഹോമയാഗപീഠത്തിന്റെ ചുവട്ടിൽ ഒഴിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശുദ്ധീകരണയാഗം.’ എബ്രായപദം പാപപരിഹാരത്തോടും അശുദ്ധിനീക്കത്തോടും ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: പിന്നെ ... എടുത്ത്
  rationale: വാവ് + ഖാതൽ ഇവിടെ അനുഷ്ഠാനനിർദേശത്തിലെ അടുത്ത ഘട്ടം തുടരുന്നു; ആ ക്രമാനുസൃത ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ ‘പിന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: מִדַּם
  choice: രക്തത്തിൽ കുറച്ച്
  rationale: מִן ഇവിടെ ഭാഗികത സൂചിപ്പിക്കുന്നതിനാൽ മുഴുവൻ രക്തമല്ല, അതിൽ ഒരു ഭാഗമാണ് പുരോഹിതൻ എടുക്കുന്നത്.
- source_word: הַחַטָּאת
  choice: പാപയാഗം
  rationale: ഈ യാഗസന്ദർഭത്തിൽ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതിനെക്കാൾ പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പാപയാഗം’ വ്യക്തവും പരിചിതവുമായ മലയാള പദമാണ്.
- source_word: בְּאֶצְבָּעוֹ
  choice: വിരൽകൊണ്ട്
  rationale: 'בְּ ഇവിടെ ഉപകരണാർഥത്തിലാണ്: രക്തം പ്രയോഗിക്കാൻ പുരോഹിതൻ തന്റെ വിരൽ ഉപയോഗിക്കുന്നു.'
- source_word: וְנָתַן עַל
  choice: '... കൊമ്പുകളിൽ പുരട്ടണം'
  rationale: രക്തം യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ ഇടുന്ന അനുഷ്ഠാനക്രിയയെ ‘പുരട്ടുക’ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: קַרְנוֹת
  choice: കൊമ്പുകൾ
  rationale: യാഗപീഠത്തിന്റെ മൂലകളിലുള്ള കൊമ്പുപോലുള്ള ഉയർച്ചകളെ സൂചിപ്പിക്കുന്ന പതിവായും കൃത്യമായും ഉള്ള പദം.
- source_word: מִזְבַּח הָעֹלָה
  choice: ഹോമയാഗപീഠം
  rationale: ഹോമയാഗവുമായി ബന്ധപ്പെട്ട പുറത്തെ യാഗപീഠത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാള സംയുക്തപദം.
- source_word: וְאֶת־דָּמוֹ יִשְׁפֹּךְ
  choice: ശേഷിച്ച രക്തം ... ഒഴിക്കണം
  rationale: ആദ്യം രക്തത്തിൽ കുറച്ച് എടുത്തതായി പറഞ്ഞതിനാൽ ഇനി ഒഴിക്കുന്നത് ശേഷിക്കുന്ന രക്തമാണെന്ന സന്ദർഭസൂചന മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പുതിയ അനുഷ്ഠാനവിവരം ചേർക്കുന്നില്ല.
- source_word: אֶל יְסוֹד
  choice: ചുവട്ടിൽ
  rationale: יְסוֹד യാഗപീഠത്തിന്റെ അടിഭാഗത്തെയോ അടിസ്ഥാനഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ചുവട്ടിൽ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സ്ഥാനസൂചകവുമാണ്.
theological_decisions:
- issue: യാഗനിയമത്തിൽ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഇവിടെ പദം പാപമെന്ന അമൂർത്ത ആശയമല്ല, യാഗമൃഗത്തെയും അനുഷ്ഠാനത്തെയും സൂചിപ്പിക്കുന്നു. ‘പാപയാഗം’ പരമ്പരാഗത യാഗവിഭാഗത്തെ സുതാര്യമായി നിലനിർത്തുന്നു; എന്നാൽ പദത്തിന് അശുദ്ധി നീക്കുന്നതുമായി ബന്ധപ്പെട്ട ‘ശുദ്ധീകരണയാഗം’ എന്ന അർഥസാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ അനുഷ്ഠാനനിർദേശ ശൈലി. യാഗസാങ്കേതിക പദങ്ങളായ ‘പാപയാഗം,’ ‘ഹോമയാഗപീഠം,’ ‘കൊമ്പുകൾ’ എന്നിവ നിലനിർത്തി; വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി രൂപപ്പെടുത്തി.
