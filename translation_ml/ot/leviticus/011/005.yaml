  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַ/שָּׁפָ֗ן כִּֽי מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּ/פַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: ml
  text: പാറയിലെ ഹൈറാക്സ്[a], കാരണം അത് അയവിറക്കുന്നതാണ്, എന്നാൽ അതിന്റെ കുളമ്പ് പിളർന്നിട്ടില്ല; അത് നിങ്ങൾക്കു അശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹൈറാക്സ്.’ പരമ്പരാഗത ഇംഗ്ലീഷ് വിവർത്തനങ്ങളിൽ പലപ്പോഴും ‘കോണി’ എന്നു കാണുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: പാറ ഹൈറാക്സ്
  rationale: ഈ പദം പാറക്കെട്ടുകളിൽ വസിക്കുന്ന ഹൈറാക്സിനെയാണ് സൂചിപ്പിക്കുന്നത്. ജീവശാസ്ത്രപരമായി കൃത്യമായ ‘ഹൈറാക്സ്’ എന്ന പേര് സ്വീകരിക്കുകയും വായനക്കാരന് തിരിച്ചറിയാൻ സഹായിക്കുന്നതിന് ‘പാറ’ ചേർക്കുകയും ചെയ്തു.
- source_word: כִּי
  choice: അതുകൊണ്ട് / അതിനാൽ എന്ന കാരണബന്ധം
  rationale: ഈ അവ്യയം മൃഗത്തെ അശുദ്ധമായി വർഗീകരിക്കുന്നതിനുള്ള കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യബന്ധം സ്വാഭാവികമാക്കാൻ ‘അതുകൊണ്ട്’ എന്ന ആശയം ‘അതുകൊണ്ടെങ്കിലും … അതിനാൽ’ എന്ന ഘടനയിൽ പ്രകടിപ്പിച്ചു.
- source_word: מַעֲלֵה גֵרָה
  choice: അയവിറക്കുന്നതാണ്
  rationale: അക്ഷരാർഥത്തിൽ ‘അയവിറക്കുന്നു’ എന്ന ആശയമുള്ള എബ്രായ പ്രയോഗത്തിന് മൃഗങ്ങളുടെ ജീർണപ്രക്രിയയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പദമാണ് ‘അയവിറക്കുക’.
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: അതിന്റെ കുളമ്പ് പിളർന്നിട്ടില്ല
  rationale: വിഭജിക്കപ്പെട്ട കുളമ്പില്ലെന്ന ആഹാരനിയമത്തിലെ വർഗീകരണലക്ഷണം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: טָמֵא
  choice: അശുദ്ധം
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ ശുദ്ധി-അശുദ്ധി വിഭാഗത്തെ മലയാളത്തിൽ സ്ഥാപിതവും വ്യക്തവുമായ രീതിയിൽ സൂചിപ്പിക്കുന്നു; ധാർമിക ദുഷ്ടത എന്ന ആശയം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: לָכֶם
  choice: നിങ്ങൾക്ക്
  rationale: ഈ വർഗീകരണം അഭിസംബോധന ചെയ്യപ്പെടുന്ന സമൂഹത്തിന് ബാധകമാണെന്ന് നേരിട്ട് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ ആഹാരനിയമത്തിൽ טָמֵא എന്നതിന്റെ സ്വഭാവം
  choice: ആചാരപരമായി അശുദ്ധം എന്ന നിയമപരമായ വിഭാഗം നിലനിർത്തുന്ന ‘അശുദ്ധം’
  alternative: ധാർമികമായി മലിനം
  rationale: ലേവ്യപുസ്തകം 11-ന്റെ സന്ദർഭത്തിൽ ഈ പദം മൃഗത്തിന്റെ ധാർമിക സ്വഭാവത്തെക്കുറിച്ചല്ല, ഇസ്രായേലിന്റെ ശുദ്ധി-അശുദ്ധി വ്യവസ്ഥയിലെ അതിന്റെ പദവിയെക്കുറിച്ചാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമഭാഷയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ശൈലി. ജീവിയുടെ പേരിൽ ശാസ്ത്രീയ കൃത്യതയ്ക്കായി ‘പാറ ഹൈറാക്സ്’ ഉപയോഗിച്ചു; പരിചിതമായ പരമ്പരാഗത പേര് അടിക്കുറിപ്പിൽ നൽകി.
