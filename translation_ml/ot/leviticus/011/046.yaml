  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: ml
  text: ഇതാണ് മൃഗങ്ങളെയും പക്ഷികളെയും വെള്ളത്തിൽ സഞ്ചരിക്കുന്ന സകല ജീവികളെയും[b] ഭൂമിയിൽ കൂട്ടമായി ഇഴയുന്ന സകല ജീവികളെയും സംബന്ധിച്ചുള്ള നിയമം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിയമം’ എന്നതിന് പകരം ‘ഉപദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം; תּוֹרָה എന്ന എബ്രായപദം നിയമത്തെയും അധികാരപൂർവമായ ഉപദേശത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ജീവികൾ’ എന്നതിന് പകരം ‘ജീവനുള്ള സകലതും’ എന്നും പരിഭാഷപ്പെടുത്താം; נֶפֶשׁ הַחַיָּה എന്ന എബ്രായപ്രയോഗം ജീവനുള്ള ജീവിയെയാണ് സൂചിപ്പിക്കുന്നത്, ശരീരത്തിൽനിന്നു വേറിട്ട ഒരു ‘ആത്മാവിനെ’ അല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: സംബന്ധിച്ചുള്ള പ്രമാണം
  rationale: ഇവിടെ תּוֹרָה ശുദ്ധവും അശുദ്ധവുമായ ജീവികളെക്കുറിച്ചുള്ള അധികാരപൂർവമായ ചട്ടങ്ങളുടെയും ഉപദേശത്തിന്റെയും സമാഹാരത്തെ സൂചിപ്പിക്കുന്നു. ‘പ്രമാണം’ നിയമപരവും പ്രബോധനപരവുമായ ഭാവങ്ങൾ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַבְּהֵמָה
  choice: മൃഗങ്ങൾ
  rationale: בְּהֵמָה കരയിൽ ജീവിക്കുന്ന മൃഗങ്ങളെ, പലപ്പോഴും വളർത്തുമൃഗങ്ങളെയും കന്നുകാലികളെയും, സൂചിപ്പിക്കാം. ഈ അധ്യായത്തിന്റെ വിശാലമായ വർഗീകരണസന്ദർഭത്തിൽ ‘മൃഗങ്ങൾ’ അനാവശ്യമായി അർഥം ചുരുക്കാതെ വ്യക്തമാണ്.
- source_word: הָעוֹף
  choice: പക്ഷികൾ
  rationale: עוֹף പറക്കുന്ന ജീവികളെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും ഈ വർഗപ്പട്ടികയിൽ ‘പക്ഷികൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: כָל נֶפֶשׁ הַחַיָּה
  choice: സകല ജീവികൾ
  rationale: נֶפֶשׁ הַחַיָּה എന്നത് ജീവനുള്ള ജീവിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ശരീരത്തിൽനിന്നു വേറിട്ട ‘ആത്മാവ്’ എന്ന ആശയം ഇവിടെ ഉദ്ദേശിക്കുന്നില്ല.
- source_word: הָרֹמֶשֶׂת בַּמָּיִם
  choice: വെള്ളത്തിൽ സഞ്ചരിക്കുന്ന
  rationale: רמש ചലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ജലജീവികളെക്കുറിച്ചായതിനാൽ ‘സഞ്ചരിക്കുന്ന’ എന്നത് ‘ഇഴയുന്ന’ എന്നതിനെക്കാൾ സ്വാഭാവികവും വിശാലവുമാണ്.
- source_word: וּלְכָל נֶפֶשׁ הַשֹּׁרֶצֶת
  choice: കൂട്ടമായി ഇഴയുന്ന സകല ജീവികൾ
  rationale: שׁרץ ചെറുജീവികളുടെ പെരുകിയുള്ള കൂട്ടചലനത്തെയോ ഇഴച്ചിലിനെയോ സൂചിപ്പിക്കുന്നു. ‘കൂട്ടമായി ഇഴയുന്ന’ എന്നത് ഭൂമിയിലെ ജീവികളുടെ സന്ദർഭത്തിൽ രണ്ടു ഭാവങ്ങളും പ്രകടമാക്കുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: אָרֶץ ഇവിടെ വെള്ളത്തോടു വിരുദ്ധമായി കരയെയോ ഭൂമിയെയോ സൂചിപ്പിക്കുന്നു. ‘ഭൂമിയിൽ’ സംഗ്രഹവാക്യത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
