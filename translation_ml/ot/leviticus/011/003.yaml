source:
  edition: WLC
  text: כֹּ֣ל מַפְרֶ֣סֶת פַּרְסָ֗ה וְ/שֹׁסַ֤עַת שֶׁ֨סַע֙ פְּרָסֹ֔ת מַעֲלַ֥ת גֵּרָ֖ה בַּ/בְּהֵמָ֑ה אֹתָ֖/הּ תֹּאכֵֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/003.yaml
  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: ml
  text: കുളമ്പ് പകുത്തതും കുളമ്പ് പൂർണമായി പിളർന്നതും[a] അയവിറക്കുന്നതുമായ ഏതു മൃഗത്തെയും നിങ്ങൾക്കു ഭക്ഷിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “കുളമ്പിനെ പകുക്കുന്നതും കുളമ്പുകളുടെ പിളർപ്പിനെ പിളർക്കുന്നതും.” കുളമ്പ് യഥാർഥത്തിൽ പൂർണമായി വേർതിരിഞ്ഞിരിക്കണമെന്ന് വ്യക്തമാക്കാൻ എബ്രായത്തിൽ പരസ്പരം ബന്ധപ്പെട്ട രണ്ടു പ്രയോഗങ്ങൾ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: ഏതു ...ത്തെയും
  rationale: തുടർന്നുള്ള ലക്ഷണങ്ങളുള്ള മുഴുവൻ മൃഗവർഗത്തെയും വിതരണാർഥത്തിൽ ഉൾപ്പെടുത്തുന്ന നിയമാനുമതി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: കുളമ്പു പിളർന്നത്
  rationale: കുളമ്പിന്റെ ഭൗതികഘടനയെ ലളിതവും കൃത്യവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: അതിന്റെ പിളർപ്പ് പൂർണമായി വേർതിരിഞ്ഞത്
  rationale: മുൻവാക്യത്തിലെ പിളർന്ന കുളമ്പിനെ കൂടുതൽ കൃത്യമായി നിർവചിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: מַעֲלַת גֵּרָה
  choice: അയവിറക്കുന്നത്
  rationale: അക്ഷരാർഥമായ ‘അയവിറക്കുക/വീണ്ടും മുകളിലേക്കു കൊണ്ടുവരുക’ എന്ന ആശയത്തെയും സാധാരണ മലയാളത്തിലെ ജന്തുശാസ്ത്രപരമായ പ്രയോഗത്തെയും ഒത്തുചേർക്കുന്നു.
- source_word: בַּבְּהֵמָה
  choice: മൃഗം
  rationale: ഭക്ഷണനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ കരമൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന പൊതുവായതും സ്വാഭാവികവുമായ പദം; ‘കന്നുകാലി’ എന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: നിങ്ങൾക്കു ഭക്ഷിക്കാം
  rationale: ഇവിടെ നിർബന്ധകല്പനയല്ല, ഭക്ഷിക്കാനുള്ള നിയമാനുമതിയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ഈ വ്യത്യാസം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
