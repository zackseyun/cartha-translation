translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. നിയമപരമായ അനുമതി വ്യക്തമായി സൂചിപ്പിക്കുമ്പോൾ എബ്രായത്തിലെ കുളമ്പുസംബന്ധമായ ആവർത്തനവും ഊന്നലും മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
