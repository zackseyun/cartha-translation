  rationale: സന്ദർഭത്തിലെ ആജ്ഞാത്മക ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; വെറും ഭാവികാലപ്രവചനമായി വായിക്കപ്പെടുന്നത് ഒഴിവാക്കുന്നു.
