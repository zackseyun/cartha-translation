    rationale: The infinitive לִהְיוֹת means ‘to be,’ expressing purpose in this covenant formula. The Malayalam ‘ആയിരിക്കേണ്ടതിന്’ can mean ‘in order that [I] must be,’ adding obligation not explicit in the source. ‘ആയിരിക്കാൻ’ preserves the purpose expression without that addition.
