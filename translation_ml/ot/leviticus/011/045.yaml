  rationale: ദൈവവും ജനവും തമ്മിലുള്ള ഉടമ്പടിബന്ധം സ്വാഭാവികവും കൃത്യവുമായി പ്രകടിപ്പിക്കുന്നു; ‘ദൈവമായിത്തീരാൻ’ എന്ന അനാവശ്യമായ അർത്ഥസൂചന ഒഴിവാക്കുന്നു.
