  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: ml
  text: എന്തെന്നാൽ ഞാൻ നിങ്ങളുടെ ദൈവമായിരിക്കാൻ നിങ്ങളെ ഈജിപ്ത് ദേശത്തുനിന്ന് കൊണ്ടുവന്ന[a] യഹോവ ആകുന്നു. നിങ്ങൾ വിശുദ്ധരായിരിക്കണം; കാരണം ഞാൻ വിശുദ്ധനാണ്.[b]
  philosophy: optimal-equivalence
