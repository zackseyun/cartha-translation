- source_word: הַמַּעֲלֶה
  choice: കൊണ്ടുവന്ന
  rationale: ഈ കർത്തൃവാചകത്തിന് വർത്തമാനസദൃശമായ രൂപമുണ്ടെങ്കിലും, പുറപ്പാടെന്ന കഴിഞ്ഞ ചരിത്രസംഭവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ഭൂതകാലം ഉപയോഗിക്കുന്നു; ‘രക്ഷിച്ച’ എന്നു പരാവർത്തനം ചെയ്യാതെ ചലനത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്ത് ദേശത്തുനിന്ന്
  rationale: എബ്രായത്തിലെ ‘ദേശം’ എന്ന നാമം വ്യക്തമായി നിലനിർത്തുകയും പുറപ്പാടുമായി ബന്ധപ്പെട്ട ഉടമ്പടിപ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
