  choice: വിശുദ്ധരായിരിക്കണം
  rationale: ‘വേർതിരിക്കപ്പെട്ടവർ’ എന്നത് അർത്ഥത്തിന്റെ ഒരു ഭാഗം മാത്രമാണ്; ഇവിടെ ദൈവത്തിന്റെ സ്വഭാവവുമായി ബന്ധിപ്പിച്ചിരിക്കുന്ന സമഗ്രമായ വിശുദ്ധതയെ ‘വിശുദ്ധർ’ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: കാരണം ഞാൻ വിശുദ്ധനാണ്
  rationale: ജനത്തിന്റെ വിശുദ്ധതയ്ക്ക് ദൈവത്തിന്റെ വിശുദ്ധതയാണ് അടിസ്ഥാനം എന്ന കാരണബന്ധം സമകാലിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വിശുദ്ധതയുടെ ഉടമ്പടിപരമായ അടിസ്ഥാനം
  choice: ഇസ്രായേൽ വിശുദ്ധരായിരിക്കണമെന്ന ആവശ്യത്തെ യഹോവയുടെ വ്യക്തിത്വത്തിലും പുറപ്പാടിലൂടെ ചെയ്ത വീണ്ടെടുപ്പിലും അവരുടെ ദൈവമായുള്ള ഉടമ്പടിബന്ധത്തിലും വാക്യം അടിസ്ഥാനപ്പെടുത്തുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഈ വാക്യം വിശാലമായ ഉടമ്പടിപരമായ പ്രസക്തിയില്ലാത്ത, ആചാരശുദ്ധിയെക്കുറിച്ചുള്ള നിർദേശം മാത്രമാണെന്ന വായന.
  rationale: തൊട്ടടുത്ത സന്ദർഭം ഭക്ഷണശുദ്ധിയെക്കുറിച്ചാണെങ്കിലും, വാക്യം ആജ്ഞയെ പുറപ്പാടിനോടും ‘നിങ്ങളുടെ ദൈവം’ എന്ന ബന്ധസൂത്രത്തോടും ദൈവത്തിന്റെ സ്വന്തം വിശുദ്ധതയോടും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെ ഈ സംഘർഷവും വ്യാപ്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ലേവ്യപുസ്തകത്തിന്റെ ഉടമ്പടി-ആജ്ഞാ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ആദ്യത്തെ כִּי ‘എന്തെന്നാൽ’ എന്നും രണ്ടാമത്തേത് വ്യക്തമായ കാരണബന്ധമായി ‘കാരണം’ എന്നും നൽകി; വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ബന്ധം വിശദീകരണമായി വികസിപ്പിച്ചിട്ടില്ല.
