  terminology: “അശുദ്ധരാക്കുക/അശുദ്ധരാകുക” appropriately retains ritual-impurity terminology without importing moral guilt. “വെറുപ്പുളവാക്കുന്നവരാക്കുക” maintains a lexical distinction from ritual uncleanness.
