  text: കൂട്ടമായി പെരുകുന്ന യാതൊരു ജീവിയാലും[a] നിങ്ങളെത്തന്നെ വെറുപ്പുളവാക്കുന്നവരാക്കരുത്. അവയാൽ നിങ്ങളെത്തന്നെ അശുദ്ധരാക്കരുത്; അങ്ങനെ അവയാൽ അശുദ്ധരാകാതിരിക്കാൻ.
