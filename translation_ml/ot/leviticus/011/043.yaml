    text: 'അഥവാ: “ഇഴഞ്ഞുനീങ്ങുന്ന യാതൊരു ജീവിയാലും.” എബ്രായപദം ഇഴയുന്നവയെ മാത്രം അല്ല, കൂട്ടമായി പെരുകുകയോ നിറഞ്ഞു ചലിക്കുകയോ ചെയ്യുന്ന ജീവികളുടെ വിശാല വിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഒരേ പദം നാമമായും ക്രിയായായും ആവർത്തിക്കുന്നു.'
