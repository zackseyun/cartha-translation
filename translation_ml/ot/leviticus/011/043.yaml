translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ആദരപൂർണ മലയാളം. ‘ആത്മാക്കളെ’ എന്ന അതിസങ്കുചിത വിവർത്തനം ഒഴിവാക്കി പ്രതിഫലനമായ ‘നിങ്ങളെത്തന്നെ’ സ്വീകരിച്ചു. രണ്ടു വ്യത്യസ്ത എബ്രായധാതുക്കളുടെ വേർതിരിവ് ‘അറപ്പുളവാക്കുന്നവർ’ എന്നും ‘അശുദ്ധർ’ എന്നും നിലനിർത്തി.
