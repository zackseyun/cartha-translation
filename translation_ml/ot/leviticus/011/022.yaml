translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തനപരമായ വർഗീകരണസൂത്രം മലയാളത്തിൽ അനാവശ്യമായ കാഠിന്യം ഒഴിവാക്കി ഒരിക്കൽ സംയുക്തമായി നൽകിയിരിക്കുന്നു; എന്നാൽ അത് പട്ടികയിലെ ഓരോ പ്രാണിക്കും ബാധകമാണെന്ന അർഥം സംരക്ഷിച്ചിട്ടുണ്ട്.
