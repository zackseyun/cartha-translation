source:
  edition: WLC
  text: אֶת אֵ֤לֶּה מֵ/הֶם֙ תֹּאכֵ֔לוּ אֶת הָֽ/אַרְבֶּ֣ה לְ/מִינ֔/וֹ וְ/אֶת הַ/סָּלְעָ֖ם לְ/מִינֵ֑/הוּ וְ/אֶת הַ/חַרְגֹּ֣ל לְ/מִינֵ֔/הוּ וְ/אֶת הֶ/חָגָ֖ב לְ/מִינֵֽ/הוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: ml
  text: 'അവയിൽനിന്ന് ഇവയെ നിങ്ങൾക്കു ഭക്ഷിക്കാം: അതതു ഇനത്തിൽപ്പെട്ട വെട്ടുക്കിളി, അതതു ഇനത്തിൽപ്പെട്ട സോലാം[a], അതതു ഇനത്തിൽപ്പെട്ട ചീവീട്, അതതു ഇനത്തിൽപ്പെട്ട പുൽച്ചാടി എന്നിവ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വെട്ടുക്കിളി” എന്നതൊഴികെ ഇവിടെയുള്ള എബ്രായ പ്രാണിനാമങ്ങളുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. סָלְעָם എന്നതിന് പരമ്പരാഗതമായി “മുണ്ഡവെട്ടുക്കിളി” എന്നും חַרְגֹּל എന്നതിന് “ചീവീട്” എന്നും പരിഭാഷ നൽകിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: അവയിൽനിന്ന് ഇവയെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ചിറകുള്ള കൂട്ടജീവികളിൽനിന്നുള്ള അനുവദനീയമായ ഒരു ഉപവിഭാഗത്തെയാണ് ഈ പ്രയോഗം പരിചയപ്പെടുത്തുന്നത്.
- source_word: תֹּאכֵלוּ
  choice: നിങ്ങൾക്കു ഭക്ഷിക്കാം
  rationale: ഭക്ഷണനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ അപൂർണക്രിയ അനുവദനീയത സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ഇത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הָאַרְבֶּה
  choice: വെട്ടുക്കിളി
  rationale: ഈ എബ്രായപദത്തിന് ഏറ്റവും ഉറപ്പുള്ളതും പൊതുവായി അംഗീകരിക്കപ്പെട്ടതുമായ തിരിച്ചറിയലാണ് വെട്ടുക്കിളി.
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: അതതിന്റെ ഇനത്തിൽപ്പെട്ട
  rationale: തോറായിൽ ആവർത്തിക്കുന്ന വർഗീകരണസൂത്രത്തിന്റെ അർഥം സംരക്ഷിക്കുന്നു. ഓരോ പട്ടികനാമത്തിനും ഇത് ബാധകമാണെന്നത് മലയാളവാക്യഘടനയിൽ സംയുക്തമായി വ്യക്തമാക്കുന്നു.
- source_word: הַסָּלְעָם
  choice: സോലാം
  rationale: ജീവിയുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ ഉറപ്പില്ലാത്ത ഒരു മലയാള ജീവിനാമം ചുമത്താതെ എബ്രായനാമത്തിന്റെ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: הַחַרְגֹּל
  choice: ചീവീട്
  rationale: ചാടുന്ന ഓർത്തോപ്റ്ററ വിഭാഗത്തിലെ പ്രാണിയെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വായനക്കാർക്ക് പരിചിതവുമായ സമാനപദം; കൃത്യമായ തിരിച്ചറിയലിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הֶחָגָב
  choice: പുൽച്ചാടി
  rationale: വെട്ടുക്കിളിയിൽനിന്ന് വേർതിരിച്ചുനിർത്തിക്കൊണ്ട് പുൽച്ചാടിവർഗത്തിലെ പ്രാണിയെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; കൃത്യമായ ജീവിവർഗം ഉറപ്പില്ല.
