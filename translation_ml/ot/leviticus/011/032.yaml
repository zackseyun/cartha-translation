id: LEV.11.32
reference: Leviticus 11:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: ml
  text: അവ ചത്തിരിക്കുമ്പോൾ, അവയിൽ ഒന്ന് വീഴുന്ന മരംകൊണ്ടുള്ള ഏതൊരു പാത്രമോ വസ്ത്രമോ തോലോ ചാക്കുതുണിയോ—ജോലി ചെയ്യാൻ ഉപയോഗിക്കുന്ന ഏതൊരു സാധനവും—അശുദ്ധമാകും. അത് വെള്ളത്തിൽ ഇടണം[a]; സന്ധ്യവരെ അത് അശുദ്ധമായിരിക്കും; പിന്നെ ശുദ്ധമാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അത് വെള്ളത്തിൽ മുക്കണം.” എബ്രായഭാഷയിൽ അക്ഷരാർഥം “അത് വെള്ളത്തിലേക്ക് കൊണ്ടുവരപ്പെടണം” എന്നാണ്.'
    reason: ശുദ്ധീകരണനടപടിയുടെ കൃത്യരീതി എബ്രായപ്രയോഗം നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല; ‘മുക്കണം’ എന്ന സാധ്യത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִפֹּל עָלָיו מֵהֶם בְּמֹתָם
  choice: അവ ചത്തിരിക്കുമ്പോൾ അവയിൽ ഒന്ന് വീഴുന്ന ഏതൊരു വസ്തുവും
  rationale: כֹּל എന്നതിന്റെ സമഗ്രതയും מֵהֶם എന്നതിന്റെ വിതരണാർഥവും നിലനിർത്തുന്നു; ബഹുവചന സൂചന മുൻവാക്യത്തിലെ ജീവികളുടെ ശവങ്ങളിലേക്കാണ്.
- source_word: יִטְמָא
  choice: അശുദ്ധമാകും
  rationale: സമ്പർക്കം മൂലം ഉണ്ടാകുന്ന ആചാരപരമായ അശുദ്ധാവസ്ഥയിലേക്കുള്ള മാറ്റം വ്യക്തമാക്കുന്നു.
- source_word: מִכָּל כְּלִי עֵץ אוֹ בֶגֶד אוֹ עוֹר אוֹ שָׂק
  choice: മരംകൊണ്ടുള്ള പാത്രമോ വസ്ത്രമോ തോലോ ചാക്കുതുണിയോ
  rationale: പട്ടികയുടെ നിയമപരമായ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; עוֹר എന്നത് സംസ്കരിച്ച തുകൽ മാത്രമെന്ന പരിധി വരാതിരിക്കാൻ ‘തോൽ’ എന്നും שָׂק എന്നത് വസ്തുവിനെ സൂചിപ്പിക്കാൻ ‘ചാക്കുതുണി’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: ജോലിക്കായി ഉപയോഗിക്കുന്ന ഏതൊരു സാധനവും
  rationale: כְּלִי എന്ന വിശാലപദത്തെ ഇവിടെ പാത്രത്തിൽ മാത്രം ഒതുക്കാതെ ഉപയോഗസാധനം എന്ന അർഥത്തിൽ നൽകുന്നു; നിഷ്ക്രിയഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ഉപയോഗാർഥമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּמַּיִם יוּבָא
  choice: അത് വെള്ളത്തിൽ ഇടണം
  rationale: ഹോഫാൽ രൂപത്തിന്റെ അക്ഷരാർഥം ‘വെള്ളത്തിലേക്ക് കൊണ്ടുവരപ്പെടണം’ എന്നാണ്; ശുദ്ധീകരണസന്ദർഭത്തിലെ സ്വാഭാവിക മലയാളം ‘വെള്ളത്തിൽ ഇടണം’ എന്നതാണ്. മുഴുകിക്കഴുകണം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: സന്ധ്യവരെ അത് അശുദ്ധമായിരിക്കും; പിന്നെ ശുദ്ധമാകും
  rationale: അശുദ്ധാവസ്ഥയുടെ കാലപരിധിയും തുടർന്ന് ശുദ്ധാവസ്ഥയിലേക്കുള്ള മാറ്റവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: טמא/טהר എന്ന പദജോടിയുടെ സ്വഭാവം
  choice: അശുദ്ധം/ശുദ്ധം
  alternative: മലിനം/നിർമലം; അയോഗ്യം/യോഗ്യം
  rationale: ലേവ്യപുസ്തകത്തിലെ ഈ നിയമസന്ദർഭം ആചാരപരമായ നിലയെക്കുറിച്ചാണ്; ധാർമ്മിക കുറ്റബോധം അനാവശ്യമായി ചേർക്കാതെ സ്ഥാപിതവും ഗ്രഹിക്കാവുന്നതുമായ പദജോടി ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ നിയമഗ്രന്ഥത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. പട്ടികയുടെ ഘടന ഡാഷ് ഉപയോഗിച്ച് നിലനിർത്തി; ആചാരപരമായ ശുദ്ധി-അശുദ്ധി ഭാഷയ്ക്ക് ധാർമ്മിക കുറ്റത്തിന്റെ അർഥം ചേർത്തിട്ടില്ല.
