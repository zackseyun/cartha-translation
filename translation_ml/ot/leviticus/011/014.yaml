    text: ഈ പക്ഷികളുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്; ആദ്യത്തേതിനെ ‘കഴുകൻ’ എന്നും രണ്ടാമത്തേതിനെ ‘പരുന്ത്’ എന്നും പരിഭാഷപ്പെടുത്താനും കഴിയും.
