lexical_decisions:
- source_word: הַדָּאָה
  choice: പരുന്ത്
  rationale: ഇരപിടിയൻ പക്ഷിയെ സൂചിപ്പിക്കുന്ന ഈ എബ്രായനാമത്തിന്റെ കൃത്യമായ ജന്തുശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. മലയാളത്തിൽ പരിചിതവും അർത്ഥപരിധിക്കുള്ളിലുമുള്ള ‘പരുന്ത്’ ഉപയോഗിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: הָאַיָּה
  choice: പ്രാപ്പിടിയൻ
  rationale: ഈ പദവും ഒരു ഇരപിടിയൻ പക്ഷിയെ സൂചിപ്പിക്കുന്നു; ‘പരുന്ത്’ എന്ന തിരിച്ചറിയലും സാധ്യമാണ്. മുൻപത്തെ വ്യത്യസ്ത എബ്രായപദത്തിൽനിന്ന് വേർതിരിച്ചുകാണിക്കാനും രണ്ടു പേരെയും അനാവശ്യമായി ഒരേ പക്ഷിയാക്കാതിരിക്കാനും ‘പ്രാപ്പിടിയൻ’ തിരഞ്ഞെടുത്തു.
- source_word: לְמִינָהּ
  choice: അതതു ഇനത്തിലുള്ള
  rationale: ‘അതിന്റെ ഇനംപ്രകാരം’ എന്ന വർഗീകരണാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു. ഏകവചന സ്ത്രീലിംഗ പ്രത്യയത്തെ പക്ഷിവർഗത്തിന്റെ വിവിധ ഇനങ്ങളിലേക്കുള്ള സൂചനയായി അവതരിപ്പിക്കുന്നു.
- source_word: וְאֶת ... וְאֶת
  choice: …നെയും …നെയും
  rationale: אֵת എന്ന നേരിട്ടുള്ള കർമചിഹ്നത്തിന് മലയാളത്തിൽ പ്രത്യേക പരിഭാഷ ആവശ്യമില്ല. ആവർത്തിക്കുന്ന וְאֶת ഘടന പട്ടികയുടെ തുടർച്ചയ്ക്കൊത്ത ‘…നെയും …നെയും’ രൂപത്തിൽ പ്രതിനിധീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പട്ടികാശൈലി. വാക്യം ചുറ്റുമുള്ള അശുദ്ധപക്ഷികളുടെ പട്ടികയുടെ ഭാഗമായതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം കോമ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ആദ്യ പക്ഷിനാമത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
