  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ആവർത്തിക്കുന്ന എബ്രായ കർമസൂചകങ്ങളുടെ ഘടന മലയാളത്തിലെ ‘-യെയും’ എന്ന സമാന്തര രൂപങ്ങളിലൂടെ നിലനിർത്തി.
