lexical_decisions:
- source_word: תִּנְשֶׁמֶת (tinšemet)
  choice: മൂങ്ങ
  rationale: ഈ പുരാതന പക്ഷിനാമത്തിന്റെ കൃത്യമായ ഇനം അനിശ്ചിതമാണ്; സന്ദർഭവും പരമ്പരാഗത തിരിച്ചറിയലും അടിസ്ഥാനമാക്കി പൊതുവായ ‘മൂങ്ങ’ എന്ന പദം സ്വീകരിച്ചു.
- source_word: קָאָת (qāʾat)
  choice: ഞാറപ്പക്ഷി
  rationale: സാധാരണയായി പെലിക്കനായി തിരിച്ചറിയപ്പെടുന്ന പക്ഷി; മലയാളത്തിൽ സ്വാഭാവികവും പരിചിതവുമായ പേരാണ് ‘ഞാറപ്പക്ഷി’.
- source_word: רָחָם (rāḥām)
  choice: ശവംതീനി കഴുകൻ
  rationale: ശവഭോജിയായ കഴുകുവർഗപ്പക്ഷിയെന്ന പരമ്പരാഗത തിരിച്ചറിയൽ വ്യക്തമാക്കുന്നു; കൃത്യമായ ജൈവ ഇനം ഉറപ്പില്ലാത്തതിനാൽ അതിലും പ്രത്യേകമായ പേര് ഒഴിവാക്കി.
