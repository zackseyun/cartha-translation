reference: Leviticus 11:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ שֶׁ֥קֶץ ה֖וּא לֹ֥א יֵאָכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: ml
  text: നിലത്തു കൂട്ടമായി നീങ്ങുന്ന എല്ലാ ചെറുജീവികളും[a] അറപ്പുള്ളവയാണ്[b]; അവ ഭക്ഷിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇഴജന്തുക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം കൂട്ടമായി സഞ്ചരിക്കുകയോ നിലത്തോടു ചേർന്ന് നീങ്ങുകയോ ചെയ്യുന്ന ചെറുജീവികളെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അറപ്പായവ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഈ പദം ഭക്ഷണമെന്ന നിലയിൽ ആചാരപരമായി അറപ്പുള്ളതും നിഷിദ്ധവുമായതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: എല്ലാ
  rationale: וְ മുൻനിയമങ്ങളോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാളത്തിലെ തുടർച്ചയിൽ പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കാതെ സ്വാഭാവികമായി ബന്ധം നിലനിൽക്കുന്നു; כָּל എന്നതിന്റെ സമഗ്രത ‘എല്ലാ’ സംരക്ഷിക്കുന്നു.
- source_word: הַ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: ഇഴഞ്ഞുനീങ്ങുന്ന ... ചെറുജീവികൾ
  rationale: שֶׁרֶץ എന്ന ജീവിവർഗവും അതേ ധാതുവിലുള്ള שׁרץ എന്ന ക്രിയയും നിലത്തോടു ചേർന്ന് കൂട്ടമായി നീങ്ങുന്ന ചെറുജീവികളെ സൂചിപ്പിക്കുന്നു. ഹീബ്രായയിലെ പദാവർത്തനം മലയാളത്തിൽ അതേപടി ആവർത്തിച്ചാൽ അസ്വാഭാവികമാകുന്നതിനാൽ വിവരണാത്മകമായി നൽകി.
- source_word: עַל הָ/אָ֑רֶץ
  choice: നിലത്തുകൂടി
  rationale: ഈ സന്ദർഭത്തിൽ אָרֶץ ജലജീവികൾക്കും പറക്കുന്ന ജീവികൾക്കും വിരുദ്ധമായി കരയിലെ, പ്രത്യേകിച്ച് നിലത്തോടു ചേർന്നുള്ള സഞ്ചാരമേഖലയെ സൂചിപ്പിക്കുന്നു.
- source_word: שֶׁ֥קֶץ
  choice: അറപ്പുളവാക്കുന്നവ
  rationale: ശാരീരിക വെറുപ്പ് മാത്രമല്ല, ഭക്ഷണമെന്ന നിലയിൽ ആചാരപരമായി നിഷിദ്ധവും അറപ്പുള്ളതുമായ അവസ്ഥയാണ് ഇവിടെ שֶׁקֶץ സൂചിപ്പിക്കുന്നത്. ‘മ്ലേച്ഛം’ പോലുള്ള അസ്പഷ്ടമോ സാമൂഹികമായി ഭാരമുള്ളതോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
- source_word: ה֖וּא
  choice: ആണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ വിധേയവാക്യത്തിൽ സ്വാഭാവികമായ ‘ആണ്’ മുഖേന പ്രതിഫലിപ്പിച്ചു.
- source_word: לֹ֥א יֵאָכֵֽל
  choice: അവയെ തിന്നരുത്
  rationale: നിഫാൽ രൂപം അക്ഷരാർഥത്തിൽ ‘തിന്നപ്പെടരുത്’ എന്ന കർമണി നിരോധനമാണ്; എന്നാൽ ആ രൂപം മലയാളത്തിൽ കൃത്രിമമായതിനാൽ നിയമപരമായ നിരോധനശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: שֶׁקֶץ എന്ന പദത്തിന്റെ ആചാരപരമായ ഭക്ഷണസന്ദർഭം
  choice: പ്രധാനവാചകത്തിൽ ‘അറപ്പുളവാക്കുന്നവ’ എന്നും അടിക്കുറിപ്പിൽ ആചാരപരമായ അർഥപരിധിയും വ്യക്തമാക്കി.
  alternative: ‘അറപ്പായവ’ അല്ലെങ്കിൽ ‘മ്ലേച്ഛമായവ’
  rationale: ഈ വാക്യം ജീവികളുടെ സർവകാല ധാർമ്മിക ദുഷ്ടത പ്രഖ്യാപിക്കുന്നതല്ല; ലേവ്യപുസ്തകം 11-ലെ ഭക്ഷണനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ അവയെ ഭക്ഷണമെന്ന നിലയിൽ നിരോധിക്കുന്നു. ആ സംഘർഷം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ പരിധി വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. ‘തിന്നപ്പെടരുത്’ എന്ന കൃത്രിമ കർമണി രൂപത്തിനുപകരം ‘തിന്നരുത്’ ഉപയോഗിച്ചു. രണ്ട് അടിക്കുറിപ്പുകളുടെയും സൂചകങ്ങൾ ബന്ധപ്പെട്ട പ്രധാനപദത്തിന് പിന്നാലെ നൽകിയിരിക്കുന്നു.
