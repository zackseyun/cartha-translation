- from: വെള്ളത്തിലുള്ള ചിറകുകളും ചെതുമ്പലുകളും ഇല്ലാത്ത സകലതും നിങ്ങൾക്ക് അറപ്പുളവാക്കുന്നതാണ്[a].
  to: വെള്ളത്തിൽ ചിറകുകളും ചെതുമ്പലുകളും ഇല്ലാത്തതെല്ലാം നിങ്ങൾക്കു വെറുപ്പുളവാക്കുന്നതാണ്[a].
  rationale: The revision preserves the Hebrew’s totalizing category and its locative reference to what is in the water, while removing a Malayalam attachment ambiguity. It also replaces a misleading footnote alternative with one that reflects the lexical range of שֶׁקֶץ without importing unrelated social or ethnic connotations.
