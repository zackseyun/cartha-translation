  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּ֣ל אֲשֶׁ֥ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת בַּ/מָּ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: ml
  text: വെള്ളത്തിൽ ചിറകുകളും ചെതുമ്പലുകളും ഇല്ലാത്തതെല്ലാം നിങ്ങൾക്കു വെറുപ്പുളവാക്കുന്നതാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾക്കു വെറുക്കപ്പെടേണ്ടതാണ്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഭക്ഷണനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ആചാരപരമായി വെറുക്കപ്പെടേണ്ടതോ അറപ്പുളവാക്കുന്നതോ ആയ ഒന്നിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: സകലതും
  rationale: സമഗ്രമായ വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന്റെ പൂർണവ്യാപ്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר
  choice: -ഉള്ള
  rationale: തുടർന്നുവരുന്ന നിർവചനവ്യവസ്ഥയെ മുഖ്യവിഭാഗവുമായി ബന്ധിപ്പിക്കുന്ന എബ്രായ ആപേക്ഷിക ഘടന മലയാളത്തിൽ വിശേഷണരൂപമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֵין לוֹ
  choice: ഇല്ലാത്ത
  rationale: പ്രത്യയസഹിതമായ അസ്തിത്വനിഷേധം ഇവിടെ കൈവശമില്ലായ്മയെയോ സവിശേഷതയുടെ അഭാവത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ഇല്ലാത്ത’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: סְנַפִּיר
  choice: ചിറകുകൾ
  rationale: ജലജീവികളുടെ fins എന്ന ശരീരാവയവത്തെ സാധാരണ മലയാളത്തിൽ ‘ചിറകുകൾ’ എന്നു പറയുന്നു; എബ്രായ ഏകവചനം വർഗസൂചകമായതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: קַשְׂקֶשֶׂת
  choice: ചെതുമ്പലുകൾ
  rationale: ജലജീവികളുടെ scales എന്ന അർഥത്തിന് ‘ചെതുമ്പലുകൾ’ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപദമാണ്; ഉറവിടത്തിലെ ഏകവചനം വർഗസൂചകമായി ഗ്രഹിക്കുന്നു.
- source_word: בַּמָּיִם
  choice: വെള്ളത്തിലുള്ള
  rationale: מַיִם രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും ഇവിടെ പൊതുവായി ജലമേഖലയെ സൂചിപ്പിക്കുന്നു; ‘വെള്ളത്തിലുള്ള’ ആ സ്ഥാനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שֶׁקֶץ
  choice: അറപ്പുളവാക്കുന്നതാണ്
  rationale: ഭക്ഷണനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ആചാരപരമായി വെറുക്കപ്പെടേണ്ടതും അറപ്പായതുമായ ഒന്നിനെ സൂചിപ്പിക്കുന്ന ശക്തമായ വിലയിരുത്തൽ നിലനിർത്തുന്നു; ‘അശുദ്ധം’ എന്ന് മാറ്റി വേറൊരു എബ്രായ പദസമൂഹവുമായി കലർത്തുന്നില്ല.
- source_word: הוּא
  choice: ആണ്
  rationale: എബ്രായ നാമിക വിധേയവാക്യത്തിലെ ഊന്നിയ സർവനാമം മലയാളത്തിൽ സ്വാഭാവികമായ വിധേയബന്ധമായ ‘ആണ്’ വഴി പ്രതിഫലിക്കുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങൾക്ക്
  rationale: ഇസ്രായേലിനോടുള്ള നേരിട്ടുള്ള ഉടമ്പടിസംബന്ധമായ പ്രയോഗം ദത്തിവിഭക്തിയിൽ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭക്ഷണനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ שֶׁקֶץ എന്ന പദത്തിന്റെ ആചാരപരമായ വിലയിരുത്തൽ
  choice: അറപ്പുളവാക്കുന്നതാണ്
  alternative: നിങ്ങൾക്ക് മ്ലേച്ഛമാണ് / നിങ്ങൾ വെറുക്കേണ്ടതാണ്
  rationale: ഈ പദം സാധാരണ അശുദ്ധതാവാചകത്തിൽനിന്ന് വ്യത്യസ്തമായി ശക്തമായ അറപ്പും നിരസനവും സൂചിപ്പിക്കുന്നു. തെരഞ്ഞെടുത്ത രൂപം ആചാരപരമായ പശ്ചാത്തലം നഷ്ടപ്പെടുത്താതെ ആ ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അശുദ്ധം’ എന്നു വിവർത്തനം ചെയ്ത് പദഭേദം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമവാക്യത്തിന്റെ സമഗ്രതയ്ക്കായി ‘സകലതും’ നിലനിർത്തി. അപൂർവമോ അത്യന്തം സാങ്കേതികമോ ആയ ആചാരപര പദപ്രയോഗം പ്രധാനവാചകത്തിൽ ഒഴിവാക്കി, അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
