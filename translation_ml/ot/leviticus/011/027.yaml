source:
  edition: WLC
  text: וְ/כֹ֣ל הוֹלֵ֣ךְ עַל כַּפָּ֗י/ו בְּ/כָל הַֽ/חַיָּה֙ הַ/הֹלֶ֣כֶת עַל אַרְבַּ֔ע טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: ml
  text: നാലുകാലിൽ നടക്കുന്ന[a] സകല മൃഗങ്ങളിലും കാൽപ്പത്തികളിൽ ഊന്നി നടക്കുന്നവയെല്ലാം നിങ്ങൾക്ക് അശുദ്ധമാണ്. അവയുടെ ശവം[b] തൊടുന്ന ഏവനും സന്ധ്യവരെ അശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാലുകാലിലും സഞ്ചരിക്കുന്ന.”
    reason: lexical_alternative
  - marker: b
    text: “അവയുടെ ശവം” എന്ന എബ്രായ പ്രയോഗത്തിൽ നാമം ഏകവചനത്തിലും അതിനോടു ചേർന്ന പ്രത്യയം ബഹുവചനത്തിലുമാണ്; ഇവിടെ അത് കൂട്ടായ അർത്ഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ עַל כַּפָּיו
  choice: കാൽപ്പത്തികളിൽ ഊന്നി നടക്കുന്നവയെല്ലാം
  rationale: כַּף എന്നത് കൈപ്പത്തി, ഉള്ളംകാൽ, കാൽപ്പത്തി എന്നിവയെ സൂചിപ്പിക്കാം. മൃഗങ്ങളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘കാൽപ്പത്തികൾ’ സ്വാഭാവികമാണ്; ‘ഊന്നി നടക്കുക’ എന്ന പ്രയോഗം മൃഗത്തിന്റെ ചലനരീതിയെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בְּכָל הַחַיָּה
  choice: സകല മൃഗങ്ങളിലും
  rationale: ഭക്ഷണനിയമങ്ങളുടെ ഈ സന്ദർഭത്തിൽ חַיָּה കരയിലെ മൃഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സകല മൃഗങ്ങളിലും’ എന്നത് ഉൾപ്പെട്ട വർഗത്തെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַהֹלֶכֶת עַל אַרְבַּע
  choice: നാലുകാലിൽ നടക്കുന്ന
  rationale: ‘നാലിന്മേൽ നടക്കുന്ന’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള രൂപം. ‘നാലുകാലിലും സഞ്ചരിക്കുന്ന’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: നിങ്ങൾക്ക് അശുദ്ധമാണ്
  rationale: ഇവിടെ טמא ധാർമിക കുറ്റത്തെക്കാൾ ആചാരപരമായ അശുദ്ധാവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അശുദ്ധം’ ലേവ്യപുസ്തകത്തിലെ ഈ നിയമഭാഷയ്ക്ക് യോജിച്ച പദമാണ്.
- source_word: כָּל הַנֹּגֵעַ בְּנִבְלָתָם
  choice: അവയുടെ ശവം തൊടുന്ന ഏവനും
  rationale: നְבֵלָה മൃഗത്തിന്റെ ശവത്തെ സൂചിപ്പിക്കുന്നു. ഏകവചന നാമത്തോടു ബഹുവചന പ്രത്യയം ചേർന്ന എബ്രായ കൂട്ടായ പ്രയോഗം ‘അവയുടെ ശവം’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: സന്ധ്യവരെ അശുദ്ധനായിരിക്കും
  rationale: നിയമപരമായ ഫലാവസ്ഥയെ വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആചാരപരമായ ശുദ്ധി-അശുദ്ധി സൂചിപ്പിക്കുന്ന പദപ്രയോഗം
  choice: അശുദ്ധം / അശുദ്ധനായിരിക്കും
  alternative: മലിനം / ദുഷിക്കപ്പെട്ടവൻ
  rationale: ഈ വാക്യം പ്രധാനമായും ആചാരപരമായ നിലയെ നിയന്ത്രിക്കുന്നതാണ്; ധാർമിക കുറ്റമോ സാധാരണ ശാരീരിക മലിനതയോ സൂചിപ്പിക്കുന്ന പദങ്ങൾ അർത്ഥത്തെ തെറ്റായി ചുരുക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. നിയമപരവും ആചാരപരവുമായ ഭാവം നിലനിർത്താൻ ‘അശുദ്ധം’ എന്ന സ്ഥിരതയുള്ള പദം ഉപയോഗിച്ചു; അത്യന്തം അക്ഷരാർഥപരമായ അസ്വാഭാവിക ഘടനകൾ ഒഴിവാക്കി.
