translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. שׁקץ എന്ന പദത്തിന്റെ ശക്തി നിലനിർത്താൻ ‘അറപ്പുള്ളവ’ എന്ന പ്രയോഗം ആവർത്തിച്ചു. ഉറപ്പില്ലാത്ത പക്ഷിനാമങ്ങൾ മുഖ്യപാഠത്തിൽ വായിക്കാവുന്ന പേരുകളായി നൽകി, ജന്തുശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
