source:
  edition: WLC
  text: וְ/אֶת אֵ֨לֶּה֙ תְּשַׁקְּצ֣וּ מִן הָ/ע֔וֹף לֹ֥א יֵאָכְל֖וּ שֶׁ֣קֶץ הֵ֑ם אֶת הַ/נֶּ֨שֶׁר֙ וְ/אֶת הַ/פֶּ֔רֶס וְ/אֵ֖ת הָ/עָזְנִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: ml
  text: 'പക്ഷികളിൽ ഇവയെ നിങ്ങൾ അറപ്പുള്ളവയായി കണക്കാക്കണം; അവയെ തിന്നരുത്; അവ അറപ്പുള്ളവയാണ്: കഴുകൻ[a], താടിക്കഴുകൻ[b], കരിങ്കഴുകൻ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പട്ടികയിലെ എബ്രായ പക്ഷിനാമങ്ങളെ എല്ലായ്പ്പോഴും ഉറപ്പോടെ തിരിച്ചറിയാനാവില്ല. ഇവിടെ ‘കഴുകൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദം ഒരു വലിയ ഇരപിടിയൻ പക്ഷിയെയോ ശവംതീനിക്കഴുകനെയോ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ പക്ഷിയുടെ തിരിച്ചറിയൽ ഉറപ്പില്ല. ‘താടിക്കഴുകൻ’ എന്നതിനു പകരം ‘ലംമെർഗൈയർ’ എന്നും പറയാറുണ്ട്; പഴയ പരിഭാഷകളിൽ അസ്ഥി പൊട്ടിക്കുന്ന കഴുകനെ സൂചിപ്പിക്കുന്ന പേരുകളും കാണാം.
    reason: lexical_alternative
  - marker: c
    text: ഈ പക്ഷിയുടെ കൃത്യമായ തിരിച്ചറിയൽ ഉറപ്പില്ല. പഴയ ചില പരിഭാഷകൾ ‘മീൻപരുന്ത്’ എന്നു നൽകുന്നു; ചിലർ ഒരിനം കഴുകനെയോ ശവംതീനിക്കഴുകനെയോ നിർദേശിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: അറപ്പുള്ളവയായി കണക്കാക്കണം
  rationale: പീയേൽ രൂപം കേവലം വ്യക്തിപരമായ വെറുപ്പിനെയല്ല, ഭക്ഷണനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇവയെ നിഷിദ്ധവും അറപ്പുള്ളവയുമായി പരിഗണിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִן הָעוֹף
  choice: പക്ഷികളിൽ
  rationale: מִן എന്നതിന്റെ വിഭജനാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഈ പട്ടികയുടെ പശ്ചാത്തലത്തിൽ עוֹף എന്നതിന് ‘പക്ഷികൾ’ യോജിക്കുന്നു.
- source_word: לֹא יֵאָכְלוּ
  choice: അവയെ തിന്നരുത്
  rationale: നിഫാൽ അപൂർണക്രിയയിലെ നിഷേദത്തെ മലയാളത്തിലെ സ്വാഭാവിക നിയമഭാഷയിൽ സജീവരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; അർഥം മാറ്റുന്നില്ല.
- source_word: שֶׁקֶץ
  choice: അറപ്പുള്ളവ
  rationale: ആചാര-ഭക്ഷണ പശ്ചാത്തലത്തിലെ ശക്തമായ നിഷിദ്ധതയും അറപ്പും നിലനിർത്തുന്നു; അതിനെ വെറും ‘അശുദ്ധം’ എന്നാക്കി ദുർബലപ്പെടുത്തുന്നില്ല.
- source_word: הַנֶּשֶׁר
  choice: കഴുകൻ
  rationale: പരമ്പരാഗതവും പൊതുവായി മനസ്സിലാകുന്നതുമായ പേര്; ഇത് ഒരു വലിയ ഇരപിടിയൻ പക്ഷിയെയോ ശവംതീനിപ്പക്ഷിയെയോ സൂചിപ്പിക്കാമെന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַפֶּרֶס
  choice: താടിക്കഴുകൻ
  rationale: ഈ എബ്രായ പക്ഷിനാമത്തിന് സാധാരണ നിർദേശിക്കപ്പെടുന്ന bearded vulture/lammergeier എന്ന തിരിച്ചറിയലിനെ വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഉറപ്പില്ലായ്മ അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- source_word: הָעָזְנִיָּה
  choice: കരിങ്കഴുകൻ
  rationale: സാധ്യതയുള്ള ആധുനിക തിരിച്ചറിയൽ ഉപയോഗിക്കുന്നു; കൃത്യമായ ജാതിനിർണയം ഉറപ്പില്ലാത്തതിനാൽ മറ്റു നിർദേശങ്ങൾ അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
