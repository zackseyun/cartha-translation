id: LEV.11.33
reference: Leviticus 11:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל כְּלִי חֶ֔רֶשׂ אֲשֶׁר יִפֹּ֥ל מֵ/הֶ֖ם אֶל תּוֹכ֑/וֹ כֹּ֣ל אֲשֶׁ֧ר בְּ/תוֹכ֛/וֹ יִטְמָ֖א וְ/אֹת֥/וֹ תִשְׁבֹּֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: ml
  text: അവയിൽ ഒന്നെങ്കിലും ഏതെങ്കിലും മൺപാത്രത്തിനകത്ത്[a] വീണാൽ, അതിനകത്തുള്ളതെല്ലാം അശുദ്ധമാകും; ആ പാത്രം നിങ്ങൾ ഉടയ്ക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കളിമൺപാത്രം.’ എബ്രായപദം ചുട്ട മണ്ണുകൊണ്ടുണ്ടാക്കിയ പാത്രത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: മൺപാത്രം
  rationale: כְּלִי എന്നത് ഒരു ഉപകരണമോ പാത്രമോ സൂചിപ്പിക്കുന്നു; חֶרֶשׂ അതു ചുട്ടെടുത്ത മണ്ണുകൊണ്ടുള്ളതാണെന്ന് വ്യക്തമാക്കുന്നു. ‘മൺപാത്രം’ ആ വസ്തുഭേദവും ആചാരപരമായ പ്രസക്തിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יִפֹּל מֵהֶם
  choice: അവയിൽ ഒന്ന് … വീണാൽ
  rationale: ബഹുവചന സർവനാമം മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ജീവികളിലേക്കോ അവയുടെ ശവങ്ങളിലേക്കോ മടങ്ങുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ശവം’ ഇവിടെ ചേർക്കാതെ, വിതരണാർഥം ‘അവയിൽ ഒന്ന്’ എന്നു നിലനിർത്തുന്നു.
- source_word: אֶל תּוֹכוֹ
  choice: മൺപാത്രത്തിനകത്ത്
  rationale: תּוֹךְ പാത്രത്തിന്റെ ഉൾഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘അകത്ത്’ പ്രവേശനവും ഉള്ളിടവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: അതിനകത്തുള്ളതെല്ലാം
  rationale: כֹּל എന്നതിന്റെ സമഗ്രത നിലനിർത്തിക്കൊണ്ട് പാത്രത്തിലെ മുഴുവൻ ഉള്ളടക്കവും ഉൾപ്പെടുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: יִטְמָא
  choice: അശുദ്ധമാകും
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരശുദ്ധിയുടെ പശ്ചാത്തലത്തിൽ טמא എന്നതിന് ‘അശുദ്ധം’ യോജിച്ച പദമാണ്; ക്രിയാരൂപം സമ്പർക്കത്തിന്റെ ഫലമായി ഉണ്ടാകുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: ആ പാത്രം നിങ്ങൾ ഉടയ്ക്കണം
  rationale: മുൻനിർത്തിയ പ്രത്യക്ഷകർമത്തിന്റെ ഊന്നൽ ‘ആ പാത്രം’ എന്നതിലൂടെ നിലനിർത്തുന്നു. שׁבר എന്നതിന്റെ അടിസ്ഥാനാർഥം അതിവ്യാഖ്യാനം ചെയ്യാതെ ‘ഉടയ്ക്കണം’ എന്നു നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ നിബന്ധന–ഫലം–കല്പന എന്ന ക്രമവും പാത്രത്തിന്മേലുള്ള അവസാന ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
