source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֜ה ה֗וּא וְ/שֹׁסַ֥ע שֶׁ֨סַע֙ פַּרְסָ֔ה וְ/ה֖וּא גֵּרָ֣ה לֹֽא יִגָּ֑ר טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: ml
  text: പന്നി[a]—അതിന്റെ കുളമ്പ് പിളർന്നതും കുളമ്പ് പൂർണമായി പിളർന്നതുമാണെങ്കിലും, അത് അയവിറക്കാത്തതിനാൽ[b] നിങ്ങൾക്ക് അശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൂകരം.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, ‘അയവിറക്ക് വീണ്ടും വായിലേക്കു കൊണ്ടുവരുന്നില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזִיר
  choice: പന്നി
  rationale: ഹീബ്രു പദം ഈ മൃഗവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും എല്ലാവർക്കും മനസ്സിലാകുന്നതുമായ പദമാണ് ‘പന്നി’.
- source_word: כִּי
  choice: ആയതിനാൽ
  rationale: മൃഗത്തെ അശുദ്ധമായി കണക്കാക്കുന്നതിനുള്ള വിശദീകരണകാരണം അവതരിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מַפְרִיס פַּרְסָה
  choice: അതിന്റെ കുളമ്പ് പിളർന്നത്
  rationale: കുളമ്പ് വിഭജിക്കപ്പെട്ടിരിക്കുന്ന അവസ്ഥയെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: കുളമ്പിൽ പിളർപ്പുള്ളത്
  rationale: ഹീബ്രുവിലെ രണ്ടാമത്തെ, ഊന്നൽ നൽകുന്ന സമാന്തര വിവരണം പൂർണമായി ലയിപ്പിക്കാതെ മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: גֵּרָה לֹא יִגָּר
  choice: അത് അയവിറക്കാത്തതിനാൽ
  rationale: മലയാളത്തിലെ പതിവായ മൃഗശാസ്ത്രപ്രയോഗമായ ‘അയവിറക്കുക’ ആശയം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥമായ ‘അയവിറക്ക് മുകളിലേക്കു കൊണ്ടുവരുന്നില്ല’ എന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: טָמֵא הוּא לָכֶם
  choice: നിങ്ങൾക്ക് അശുദ്ധമാണ്
  rationale: ഭക്ഷണനിയമങ്ങളുടെ പശ്ചാത്തലത്തിലെ ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുകയും ഹീബ്രുവിലെ അഭിസംബോധിതരോടുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഭക്ഷണനിയമത്തിൽ טָמֵא എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: അശുദ്ധം—ആചാരപരവും ഭക്ഷണനിയമപരവുമായ അർഥത്തിൽ
  alternative: മലിനം; അശുദ്ധീകരിക്കപ്പെട്ടത്
  rationale: ലേവ്യപുസ്തകം 11-ൽ ഇത് ധാർമിക ദുഷ്ടതയെക്കാൾ ഇസ്രായേലിന്റെ ഭക്ഷണ-വിശുദ്ധി വേർതിരിവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അശുദ്ധം’ ഈ നിയമപരവും ആചാരപരവുമായ അർഥം അനാവശ്യമായി വികസിപ്പിക്കാതെ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ പിളർന്ന കുളമ്പിനെക്കുറിച്ചുള്ള ഇരട്ട വിവരണം ആവർത്തനം പൂർണമായി നീക്കാതെ വായനാസൗകര്യത്തോടെ നിലനിർത്തി; ‘അശുദ്ധം’ എന്നത് ധാർമിക കുറ്റമായി തെറ്റിദ്ധരിക്കാതിരിക്കാനുള്ള പശ്ചാത്തലബോധം തീരുമാനത്തിൽ രേഖപ്പെടുത്തി.
