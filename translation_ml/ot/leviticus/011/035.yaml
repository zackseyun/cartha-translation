  terminology: '"അശുദ്ധം" is an appropriate consistent rendering of טמא. "അടുപ്പ്" for תַּנּוּר and "പാചകച്ചൂള" for כִירַיִם are suitable, while the cultural footnote appropriately preserves the latter term''s uncertainty.'
