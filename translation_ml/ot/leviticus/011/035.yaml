language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/כֹל אֲשֶׁר יִפֹּ֨ל מִ/נִּבְלָתָ֥/ם עָלָי/ו֮ יִטְמָא֒ תַּנּ֧וּר וְ/כִירַ֛יִם יֻתָּ֖ץ טְמֵאִ֣ים הֵ֑ם וּ/טְמֵאִ֖ים יִהְי֥וּ לָ/כֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: ml
  text: അവയുടെ ശവത്തിൽനിന്ന് എന്തെങ്കിലും ഏതെങ്കിലും വസ്തുവിന്മേൽ വീണാൽ, ആ വസ്തു അശുദ്ധമാകും[a]. അടുപ്പും പാചകച്ചൂളയും പൊളിച്ചുകളയണം; അവ അശുദ്ധമാണ്[b], അവ നിങ്ങൾക്കു അശുദ്ധമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവയുടെ ചത്ത ശരീരം’ അല്ലെങ്കിൽ ‘അവയുടെ ശവങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഇവിടെ ശുദ്ധിനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ അശുദ്ധ ജീവിയുടെ ശവത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പാചകച്ചൂള’ എന്നത് പാത്രം വെച്ച് പാചകം ചെയ്യുന്ന ഒരു സംവിധാനമാണ്; എബ്രായപദം ചൂളയെയോ പാത്രം വയ്ക്കുന്ന അടുപ്പിനെയോ തീകൂട്ടിയ പാചകസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: נִּבְלָתָם
  choice: അവയുടെ ശവം
  rationale: നְבֵלָה ഇവിടെ ശുദ്ധിനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ ചത്ത മൃഗത്തിന്റെ ശവത്തെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ഏകവചന സമാഹാരപ്രയോഗവും മൂന്നാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יִפֹּל
  choice: വീഴുന്നുവോ
  rationale: നിയമഭാഷയിലെ പൊതുവായ സാഹചര്യം സൂചിപ്പിക്കുന്ന അപൂർണക്രിയയെ വ്യവസ്ഥാപരമായ മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: עָלָיו יִטְמָא
  choice: ഏതൊന്നിന്മേൽ ... അത് അശുദ്ധമാകും
  rationale: ശവത്തിന്റെ ഒരു ഭാഗം പതിക്കുന്ന വസ്തുവിന് ഉണ്ടാകുന്ന ശുദ്ധിനിയമപരമായ അവസ്ഥാമാറ്റം വ്യക്തമായി പറയുന്നു.
- source_word: תַּנּוּר
  choice: അടുപ്പ്
  rationale: അപ്പം ചുടാനുള്ള പുരാതന അടുപ്പിനെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനിക മലയാളപദത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כִירַיִם
  choice: പാചകച്ചൂള
  rationale: പാത്രം വെച്ച് പാചകം ചെയ്യുന്ന ചൂളയോ സമാനമായ പാചകസംവിധാനമോ സൂചിപ്പിക്കുന്ന പദമാണിത്; പുരാതന സാങ്കേതിക രൂപം അനാവശ്യമായി കൃത്യമാക്കാതെ ഗാർഹിക പാചകസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: יֻתָּץ
  choice: പൊളിച്ചുകളയണം
  rationale: മലിനമായ മൺനിർമിത പാചകസംവിധാനം തകർക്കണമെന്ന നിയമപരമായ നിർബന്ധം ഈ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: טְמֵאִים הֵם
  choice: അവ അശുദ്ധമാണ്
  rationale: ടָמֵא എന്ന പ്രധാന ശുദ്ധിനിയമപദത്തിന് സ്ഥിരതയുള്ള 'അശുദ്ധം' എന്ന മലയാളസമാനപദം ഉപയോഗിക്കുന്നു; ഇത് ധാർമിക ദുഷ്ടതയല്ല, ആചാരപരമായ അശുദ്ധിയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: അവ നിങ്ങൾക്ക് അശുദ്ധമായിരിക്കണം
  rationale: לָכֶם എന്ന ബന്ധസൂചകപ്രയോഗം 'നിങ്ങൾക്ക്' എന്ന് സംരക്ഷിക്കുകയും ഇസ്രായേല്യർ അവയെ അശുദ്ധമായി കണക്കാക്കണമെന്ന നിയമബോധം നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ലേവ്യശുദ്ധിനിയമത്തിലെ טמא/טמאים എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: പ്രധാനപാഠത്തിൽ 'അശുദ്ധം' എന്ന് പരിഭാഷപ്പെടുത്തുക
  alternative: '''ആചാരപരമായി അശുദ്ധം'' അല്ലെങ്കിൽ ''ശുദ്ധിനിയമപ്രകാരം അശുദ്ധം'''
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് ധാർമിക തിന്മയല്ല, ആചാരപരമായ അശുദ്ധിയാണ്. എന്നിരുന്നാലും പ്രധാന ബൈബിൾപദത്തിന്റെ സ്ഥിരതയും എബ്രായത്തിന്റെ സംക്ഷിപ്തതയും നിലനിർത്താൻ 'അശുദ്ധം' ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. 'അശുദ്ധം' എന്ന മുഖ്യപദം ആവർത്തിച്ച് എബ്രായപാഠത്തിലെ ഊന്നൽ നിലനിർത്തി; അടുപ്പും പാചകച്ചൂളയും രണ്ടിനെയും സൂചിപ്പിക്കുന്ന ബഹുവചനത്തെ തുടർന്നുള്ള വാക്യങ്ങളിൽ 'അവ' എന്ന് സ്വാഭാവികമായി കൈകാര്യം ചെയ്തു.
