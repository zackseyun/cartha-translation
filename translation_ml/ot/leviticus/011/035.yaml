  source_fidelity: The draft correctly conveys the impurity caused when something from the carcass falls on an object, the required destruction of the cooking installations, and their unclean status. However, the opening construction is syntactically awkward in Malayalam, and the singular pronoun "അത്" after the paired cooking installations obscures the Hebrew plural reference.
