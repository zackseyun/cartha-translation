- from: വെള്ളത്തിലുള്ള സകല ജീവികളിലും ചിറകുകളും ചെതുമ്പലുകളും ഉള്ളവയെ നിങ്ങൾക്കു ഭക്ഷിക്കാം—കടലുകളിലും അരുവികളിലും[a] വെള്ളത്തിൽ കഴിയുന്ന ഇവയെ നിങ്ങൾക്കു ഭക്ഷിക്കാം.
  to: 'വെള്ളത്തിലുള്ള സകല ജീവികളിൽനിന്നും ഇവയെ നിങ്ങൾക്കു ഭക്ഷിക്കാം: വെള്ളത്തിൽ, കടലുകളിലും അരുവികളിലും, ചിറകുകളും ചെതുമ്പലുകളും ഉള്ളവയെ നിങ്ങൾക്കു ഭക്ഷിക്കാം.'
