  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമവാക്യത്തിലെ അനുമതിഭാവവും അവസാനത്തെ ആവർത്തന ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
