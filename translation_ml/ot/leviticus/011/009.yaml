  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּ֖ל אֲשֶׁ֣ר בַּ/מָּ֑יִם כֹּ֣ל אֲשֶׁר ל/וֹ֩ סְנַפִּ֨יר וְ/קַשְׂקֶ֜שֶׂת בַּ/מַּ֗יִם בַּ/יַּמִּ֛ים וּ/בַ/נְּחָלִ֖ים אֹתָ֥/ם תֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: ml
  text: 'വെള്ളത്തിലുള്ള സകല ജീവികളിൽനിന്നും ഇവയെ നിങ്ങൾക്കു ഭക്ഷിക്കാം: വെള്ളത്തിൽ, കടലുകളിലും അരുവികളിലും, ചിറകുകളും ചെതുമ്പലുകളും ഉള്ളവയെ നിങ്ങൾക്കു ഭക്ഷിക്കാം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת זֶה ... אֹתָם
  choice: ഉള്ളവയെ ... ഇവയെ
  rationale: ആമുഖത്തിലെ ഏകവചന നിർദേശകപ്രയോഗം വർഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനസമാന പ്രയോഗം സ്വീകരിച്ചു; അവസാനത്തെ אֹתָם ആവർത്തനത്തിലൂടെ ഊന്നൽ നിലനിർത്തി.
- source_word: תֹּאכְלוּ
  choice: നിങ്ങൾക്കു ഭക്ഷിക്കാം
  rationale: ഭക്ഷണനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ അനുമതി സൂചിപ്പിക്കുന്ന അപൂർണ്ണക്രിയാരൂപത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: വെള്ളത്തിലുള്ള സകല ജീവികളിലും
  rationale: מִן എന്നതിന്റെ വിഭാഗത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് എന്ന അർഥവും כֹּל എന്നതിന്റെ സമഗ്രതയും വ്യക്തമാക്കുന്നു; സന്ദർഭം ജീവികളെയാണു സൂചിപ്പിക്കുന്നത്.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: ചിറകുകളും ചെതുമ്പലുകളും
  rationale: മത്സ്യശരീരഘടനയെ സൂചിപ്പിക്കുന്ന സാധാരണവും മനസ്സിലാകുന്നതുമായ മലയാള പദങ്ങൾ; ഹീബ്രുവിലെ വർഗനാമങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനത്തിൽ നൽകി.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: കടലുകളിലും അരുവികളിലും
  rationale: יַמִּים എന്നതിനു 'കടലുകൾ' എന്നും, ഒഴുകുന്ന ഉൾനാടൻ ജലപാതയെ ഇവിടെ സൂചിപ്പിക്കുന്ന נְחָלִים എന്നതിനു 'അരുവികൾ' എന്നും നൽകി; രണ്ടാമത്തെ പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
