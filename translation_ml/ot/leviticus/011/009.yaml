    text: “അരുവികൾ” എന്നതിനുപകരം “നദികൾ” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദം ഒഴുക്കുകൾ, നദിപ്പാതകൾ, കാലികമായി വെള്ളമൊഴുകുന്ന വരണ്ട തോടുകൾ എന്നിവയെ സന്ദർഭാനുസരണം സൂചിപ്പിക്കാം.
