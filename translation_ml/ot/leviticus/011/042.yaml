reference: Leviticus 11:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּל֩ הוֹלֵ֨ךְ עַל גָּח֜ וְ/כֹ֣ל הוֹלֵ֣ךְ עַל אַרְבַּ֗ע עַ֚ד כָּל מַרְבֵּ֣ה רַגְלַ֔יִם לְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ לֹ֥א תֹאכְל֖וּ/ם כִּי שֶׁ֥קֶץ הֵֽם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: ml
  text: നിലത്തു ഇഴഞ്ഞുനീങ്ങുന്ന സകല ഇഴജന്തുക്കളിലും, വയറിന്മേൽ നീങ്ങുന്നതോ[a] നാലുകാലിൽ നടക്കുന്നതോ അനേകം കാലുകളുള്ളതോ ആയ ഒന്നും നിങ്ങൾ തിന്നരുത്; അവ അറപ്പുളവാക്കുന്നവയാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വയറിന്മേൽ ഇഴയുന്നതോ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വെറുപ്പുളവാക്കുന്നവ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ עַל גָּח
  choice: വയറിന്മേൽ നീങ്ങുന്നത്
  rationale: ചലനരീതിയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ഇഴയുന്നത്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: നാലുകാലിൽ നടക്കുന്നത്
  rationale: എബ്രായത്തിലെ ദൃശ്യമായ വിവരണം വ്യക്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: അനേകം കാലുകളുള്ളത്
  rationale: മുമ്പുള്ള വിഭാഗങ്ങൾക്കൊപ്പം അനേകം കാലുകളുള്ള ജീവികളെയും ഉൾപ്പെടുത്തുന്ന വ്യാപക അർഥം നൽകുന്നു; എബ്രായത്തിലെ עַד ഇവിടെ പരിധിയേക്കാൾ ഉൾപ്പെടുത്തലാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ עַל הָאָרֶץ
  choice: നിലത്തു ഇഴഞ്ഞുനീങ്ങുന്ന സകല ചെറുജീവികളിലും
  rationale: ശׁרץ എന്ന നാമ-ക്രിയ ആവർത്തനത്തിന്റെ വർഗീകരണ ഊന്നൽ വായനാസൗകര്യത്തോടെ പകരുന്നു; ‘നിലം’ ഈ സന്ദർഭത്തിലെ ഭൂതലചലനം വ്യക്തമാക്കുന്നു.
- source_word: לֹא תֹאכְלֻם
  choice: ഒന്നിനെയും നിങ്ങൾ തിന്നരുത്
  rationale: നിയമപരമായ നിരോധനവും മുൻപറഞ്ഞ എല്ലാ വിഭാഗങ്ങളിലേക്കുമുള്ള സമഗ്ര പ്രയോഗവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שֶׁקֶץ
  choice: അറപ്പുളവാക്കുന്നവ
  rationale: ആഹാരശുദ്ധിനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ശക്തമായ വെറുപ്പും വിലക്കപ്പെട്ട നിലയും സൂചിപ്പിക്കുന്നു; ‘മ്ലേച്ഛം’ പോലുള്ള അസ്വാഭാവികമോ വേറിട്ട സാമൂഹിക അർഥമുള്ളതോ ആയ പദങ്ങൾ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: വിശുദ്ധിനിയമത്തിലെ നിരോധനത്തിന്റെ സ്വഭാവം
  choice: വാക്യത്തെ ലേവ്യ ആഹാരശുദ്ധിനിയമത്തിനുള്ളിലെ നേരിട്ടുള്ള ഭക്ഷണനിരോധനമായി വിവർത്തനം ചെയ്തു.
  alternative: ഇതിനെ എല്ലാ കാലത്തേക്കുമുള്ള ധാർമിക കല്പനയായി നിർവചിക്കുക, അല്ലെങ്കിൽ വെറും സാംസ്കാരിക വിലക്കായി മൃദൂകരിക്കുക.
  rationale: എബ്രായപാഠം ഇവിടെ നേരിട്ടുള്ള നിയമനിരോധനമാണ് നൽകുന്നത്; അതിന്റെ പിൽക്കാല പ്രാബല്യത്തെക്കുറിച്ചുള്ള വിശ്വാസശാസ്ത്രപരമായ തർക്കം വാക്യം തന്നെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനഘടനയുടെ വർഗീകരണ ഊന്നൽ സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ പുനഃസംഘടിപ്പിച്ചു; മതവിഭാഗസവിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
