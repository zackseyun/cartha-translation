  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: ml
  text: പെരുഞാറയെയും, അതതു ഇനംപ്രകാരമുള്ള കൊക്കിനെയും[a][b], ഉപ്പൂപ്പനെയും[c], വവ്വാലിനെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള എബ്രായ പക്ഷിനാമത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്; ‘കൊക്ക്’ എന്നതിനുപകരം ‘ഐബിസ്’ എന്നോ നീണ്ട കാലുകളുള്ള മറ്റൊരു നീർപ്പക്ഷി എന്നോ ആയിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “അതതു ഇനംപ്രകാരമുള്ള” എന്ന പ്രയോഗം ഈ പൊതുവായ പക്ഷിവർഗത്തിൽ ഉൾപ്പെടുന്ന ബന്ധപ്പെട്ട ഇനങ്ങളെയോ വകഭേദങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: പരമ്പരാഗതമായി ചില വിവർത്തനങ്ങളിൽ ‘ടിറ്റിഭപ്പക്ഷി’ (lapwing) എന്നു നൽകിയിട്ടുണ്ട്; എന്നാൽ എബ്രായപദം ‘ഉപ്പൂപ്പൻ’ എന്ന പക്ഷിയെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲסִידָה
  choice: പെരുഞാറ
  rationale: ഈ പക്ഷിനാമത്തിന്റെ പരമ്പരാഗതവും പൊതുവേ അംഗീകരിക്കപ്പെട്ടതുമായ തിരിച്ചറിയൽ ‘stork’ ആണ്; മലയാളത്തിൽ അതിനെ വ്യക്തമായി സൂചിപ്പിക്കാൻ ‘പെരുഞാറ’ ഉപയോഗിച്ചു.
- source_word: אֲנָפָה
  choice: കൊക്ക്
  rationale: കൃത്യമായ പക്ഷിശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണെങ്കിലും ‘heron’ എന്ന പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥത്തിന് സ്വാഭാവികമായ മലയാളപദം ‘കൊക്ക്’ ആണ്.
- source_word: לְמִינָהּ
  choice: അതിന്റെ ഇനംപ്രകാരം
  rationale: ഒരു പൊതുവായ പക്ഷിവർഗത്തിനുള്ളിലെ ബന്ധപ്പെട്ട ഇനങ്ങളെയോ വകഭേദങ്ങളെയോ ഉൾക്കൊള്ളുന്ന എബ്രായ വർഗീകരണപ്രയോഗം കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: דּוּכִיפַת
  choice: ഉപ്പൂപ്പൻ
  rationale: പഴയ വിവർത്തനങ്ങളിലെ ‘lapwing’ എന്ന തിരിച്ചറിയലിനെക്കാൾ ആധുനിക എബ്രായ നിഘണ്ടുശാസ്ത്രം ‘hoopoe’ എന്ന തിരിച്ചറിയലിനെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; അതിന്റെ മലയാളനാമമാണ് ‘ഉപ്പൂപ്പൻ’.
- source_word: עֲטַלֵּף
  choice: വവ്വാൽ
  rationale: തിരിച്ചറിയൽ ഉറപ്പുള്ളതാണ്. ആധുനിക വർഗീകരണത്തിൽ സസ്തനിയാണെങ്കിലും, ഇവിടെ പറക്കുന്ന ജീവികളുടെ അനുഭവാധിഷ്ഠിത പട്ടികയിലാണ് ഇത് വരുന്നത്.
- source_word: וְאֵת / וְאֶת
  choice: -യെയും / -നെയും
  rationale: ആവർത്തിക്കുന്ന സംയോജകവും നേരിട്ടുള്ള കർമസൂചകവും മലയാളത്തിൽ ഓരോ പട്ടികാംഗത്തോടും ചേർത്ത ‘-യെയും/-നെയും’ എന്ന രൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
