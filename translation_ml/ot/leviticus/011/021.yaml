translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമശൈലി. ‘ചിറകുള്ള ഇഴജന്തുക്കൾ’ എന്നത് പരമ്പരാഗത ജന്തുവർഗഭാഷ നിലനിർത്തുമ്പോഴും ‘പക്ഷികൾ’ എന്ന തെറ്റായ പരിമിതീകരണം ഒഴിവാക്കുന്നു. പാഠവ്യത്യാസവും כְרָעַיִם എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
