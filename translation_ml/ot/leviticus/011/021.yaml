  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּל֙ שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע אֲשֶׁר לא כְרָעַ֨יִם֙ מִ/מַּ֣עַל לְ/רַגְלָ֔י/ו לְ/נַתֵּ֥ר בָּ/הֵ֖ן עַל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: ml
  text: എന്നാൽ നാലുകാലിൽ സഞ്ചരിക്കുന്ന ചിറകുള്ള ഇഴജന്തുക്കളിൽ, തങ്ങളുടെ പാദങ്ങൾക്കു മുകളിലായി നിലത്തു ചാടാൻ ചാട്ടക്കാലുകളുള്ളവയെ[b] നിങ്ങൾക്കു ഭക്ഷിക്കാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായിലെ വ്യഞ്ജനപാഠം അക്ഷരാർഥത്തിൽ ‘കാലുകൾ ഇല്ലാത്തവ’ എന്നു വായിക്കാം; എന്നാൽ സന്ദർഭവും പുരാതന പരിഭാഷകളും പിന്തുണയ്ക്കുന്ന പരമ്പരാഗത വായന ‘കാലുകളുള്ളവ’ എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: ‘ചാട്ടക്കാലുകൾ’ എന്നതിന് ‘ചാടാൻ അനുയോജ്യമായ കാലുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; നിലത്തു ചാടാൻ ഉപയോഗിക്കുന്ന പ്രത്യേക പിൻകാലുകളെയാണ് ഹീബ്രായപദം ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ നിരോധനത്തിന് ഇവിടെ വരുന്ന ഒഴിവ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: ഇവയെ നിങ്ങൾക്കു ഭക്ഷിക്കാം
  rationale: നിയമസന്ദർഭത്തിൽ ക്രിയ അനുമതിയാണ് സൂചിപ്പിക്കുന്നത്; ഏകവചനരൂപം ഇവിടെ അനുവദിക്കപ്പെട്ട ഒരു വർഗത്തെ പരിചയപ്പെടുത്തുന്നു.
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: ചിറകുള്ള ഇഴജന്തുക്കളിൽ
  rationale: שֶׁרֶץ ചെറുതായി കൂട്ടമായി നീങ്ങുന്ന ജീവികളുടെ വിശാലവർഗത്തെയും הָעוֹף പറക്കുന്ന/ചിറകുള്ള വിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ നിയമ-ജന്തുശാസ്ത്ര സന്ദർഭത്തിൽ ‘ചിറകുള്ള ഇഴജന്തുക്കൾ’ സംക്ഷിപ്തവും ഗ്രാഹ്യവുമാണ്.
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: നാലുകാലിൽ സഞ്ചരിക്കുന്ന
  rationale: ഹീബ്രായിലെ ‘നാലിന്മേൽ നടക്കുന്ന’ എന്ന ശരീരചലന വിവരണം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לוֹא כְרָעַיִם
  choice: ചാട്ടക്കാലുകളുള്ളവ
  rationale: സന്ദർഭവും പരമ്പരാഗത വായനയും ‘ഉള്ളവ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു; כְרָעַיִם ഇവിടെ ചാടാൻ അനുയോജ്യമായ പ്രത്യേക പിൻകാലുകളാണ്.
- source_word: מִמַּעַל לְרַגְלָיו
  choice: പാദങ്ങൾക്കു മുകളിലായി
  rationale: പ്രത്യേക ചാട്ടക്കാലുകളുടെ ശരീരസ്ഥാനത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ വിവരണം പരമാവധി നിലനിർത്തുന്നു.
- source_word: לְנַתֵּר בָּהֵן עַל הָאָרֶץ
  choice: നിലത്തുകൂടി ചാടാൻ
  rationale: പ്രത്യേക കാലുകളുടെ ഉദ്ദേശ്യവും നിലത്തെ ചലനവും ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
