  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵת֙ בַּ֣ת הַֽ/יַּעֲנָ֔ה וְ/אֶת הַ/תַּחְמָ֖ס וְ/אֶת הַ/שָּׁ֑חַף וְ/אֶת הַ/נֵּ֖ץ לְ/מִינֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/016.yaml
  text: and the ostrich[a], and the hawk, and the gull, and the falcon according to its kind,
translation:
  language: ml
  text: ഒട്ടകപ്പക്ഷി[a], പരുന്ത്, കടൽക്കാക്ക, വല്ലൂരും അതതിന്റെ ഇനങ്ങളോടുകൂടെ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലെ പല എബ്രായ പക്ഷിനാമങ്ങളുടെയും തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. പരമ്പരാഗതമായ മറ്റു വിവർത്തനങ്ങളിൽ ‘ഒട്ടകപ്പക്ഷി’ക്കു പകരം ‘മൂങ്ങ’, ‘പരുന്ത്’ എന്നതിനു പകരം ‘രാപ്പരുന്ത്’ അല്ലെങ്കിൽ ‘മൂങ്ങ’, ‘കടൽക്കാക്ക’യ്ക്കു പകരം ‘കുയിൽ’, ‘വല്ലൂർ’ എന്നതിനു പകരം ‘പരുന്ത്’ എന്നിവ കാണപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: ഒട്ടകപ്പക്ഷി
  rationale: പദപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘യഅനയുടെ മകൾ’ എന്നാണെങ്കിലും, ജീവികളുടെ പട്ടികയിൽ ഇത് ഒരു പക്ഷിയുടെ സ്ഥിരനാമമായി പ്രവർത്തിക്കുന്നു. ആധുനിക നിഘണ്ടുതെളിവുകളുടെ അടിസ്ഥാനത്തിൽ ‘ഒട്ടകപ്പക്ഷി’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: הַתַּחְמָס
  choice: പരുന്ത്
  rationale: കൃത്യമായ പക്ഷിയിനം അനിശ്ചിതമാണ്. ഇരപിടിയൻ പക്ഷിയെ സൂചിപ്പിക്കുന്ന പൊതുവായ സ്വാഭാവിക മലയാളപദമായി ‘പരുന്ത്’ സ്വീകരിച്ചു.
- source_word: הַשָּׁחַף
  choice: കടൽക്കാക്ക
  rationale: തിരിച്ചറിയൽ പൂർണമായി ഉറപ്പില്ലെങ്കിലും ആധുനിക നിഘണ്ടുക്കളിൽ സാധാരണയായി gull എന്ന തിരിച്ചറിയൽ ലഭിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘കടൽക്കാക്ക’ എന്നു നൽകി.
- source_word: הַנֵּץ
  choice: വല്ലൂരം
  rationale: ഈ പദം പരുന്തുവർഗത്തിലെ ഒരു ഇരപിടിയൻ പക്ഷിയെ സൂചിപ്പിക്കുന്നു. തַּחְמָס എന്ന മുൻപത്തെ പദത്തിൽനിന്ന് വേർതിരിക്കാനും falcon എന്ന സാധ്യത നിലനിർത്താനും ‘വല്ലൂരം’ തെരഞ്ഞെടുത്തു.
- source_word: לְמִינֵהוּ
  choice: അതതു ഇനത്തിൽപ്പെട്ട
  rationale: വർഗീകരണസന്ദർഭങ്ങളിൽ ആവർത്തിക്കുന്ന ഈ പ്രയോഗം ഓരോ ഇനത്തെയും അതിന്റെ വകഭേദങ്ങളോടുകൂടെ ഉൾപ്പെടുത്തുന്നു. മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാശൈലിയിൽ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְאֵת / וְאֶת
  choice: എന്നിവയും
  rationale: ആവർത്തിക്കുന്ന സംയോജകവും നേരിട്ടുള്ള കർമചിഹ്നവും മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന പട്ടികയെ ക്രമീകരിക്കുന്നു. മലയാളത്തിൽ കർമചിഹ്നം പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ പട്ടികയുടെ തുടർച്ച ‘എന്നിവയും’ കൊണ്ട് പ്രകടമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിലെ കർമപ്പട്ടികയുടെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ അർധവിരാമം നൽകി. പക്ഷിനാമങ്ങളുടെ യഥാർഥ തിരിച്ചറിയലിലുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
