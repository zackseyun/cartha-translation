id: LEV.11.8
reference: Leviticus 11:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֣א תִגָּ֑עוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: ml
  text: അവയുടെ മാംസത്തിൽനിന്ന് ഒന്നും നിങ്ങൾ തിന്നരുത്; അവയുടെ മൃഗശവങ്ങളിൽ[a] തൊടരുത്. അവ നിങ്ങൾക്ക് അശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചത്ത മൃഗങ്ങളുടെ ശരീരങ്ങളിൽ.’ എബ്രായപദം ചത്ത മൃഗത്തിന്റെ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: അവയുടെ മാംസത്തിൽനിന്ന് ഒന്നും
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ അംശസൂചകബലം വ്യക്തമാക്കാൻ ‘ഒന്നും’ ചേർത്തു; בָּשָׂר എന്നതിന്റെ ശരീരസംബന്ധമായ അർഥം ‘മാംസം’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לֹא תֹאכֵלוּ
  choice: നിങ്ങൾ തിന്നരുത്
  rationale: നിയമപരമായ നിരോധനം ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായി അവതരിപ്പിക്കുന്നു.
- source_word: וּבְנִבְלָתָם
  choice: അവയുടെ ശവങ്ങളിൽ
  rationale: נְבֵלָה ഇവിടെ ചത്ത മൃഗത്തിന്റെ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ശവം’ അതിനെ സംക്ഷിപ്തമായും കൃത്യമായും അറിയിക്കുന്നു.
- source_word: לֹא תִגָּעוּ
  choice: തൊടരുത്
  rationale: נגע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സമ്പർക്കം മൂലമുള്ള ആചാരപരമായ അശുദ്ധി വിവർത്തനത്തിൽ വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: അവ നിങ്ങൾക്ക് അശുദ്ധമാണ്
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ ശുദ്ധി-അശുദ്ധി വിഭാഗം ‘അശുദ്ധം’ എന്ന പദംകൊണ്ട് നിലനിർത്തുന്നു; לָכֶם എന്ന ബന്ധസൂചന ‘നിങ്ങൾക്ക്’ എന്ന് നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ലേവ്യരുടെ ഭക്ഷണനിയമത്തിലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: ‘അശുദ്ധം’ എന്ന ആചാരപരമായ വിഭാഗമായി വിവർത്തനം ചെയ്തു
  alternative: ‘മലിനം’ എന്നു വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ ധാർമിക ദോഷമായി വ്യാഖ്യാനിക്കുക
  rationale: വാക്യം ഇസ്രായേലിന്റെ ശുദ്ധി-വിശുദ്ധി നിയമങ്ങളുടെ ഭാഷയിലാണ് സംസാരിക്കുന്നത്. ധാർമിക ദോഷമോ ഈ നിയമത്തിന്റെ പിൽക്കാല ഉടമ്പടിപരമായ പ്രയോഗമോ സംബന്ധിച്ച നിഗമനങ്ങൾ പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. അനാവശ്യമായ പുരാതനശൈലി ഒഴിവാക്കി; മൂലപാഠത്തിലെ നിരോധനവും ആചാരപരമായ അശുദ്ധിയുടെ വിഭാഗവും വ്യക്തമായി നിലനിർത്തി.
