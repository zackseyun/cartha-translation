reference: Leviticus 11:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: ml
  text: കാരണം ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു. അതുകൊണ്ട് നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ; വിശുദ്ധരായിരിക്കുവിൻ, കാരണം ഞാൻ വിശുദ്ധനാണ്. നിലത്തു ഇഴഞ്ഞുനീങ്ങുന്ന യാതൊരു ചെറുജീവിയാലും നിങ്ങളെത്തന്നെ അശുദ്ധരാക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശുദ്ധരാക്കരുത്’ എന്നതിന് ‘മലിനപ്പെടുത്തരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘ചെറുജീവി’ എന്നത് എബ്രായ ശെരെץ എന്ന പദത്തിന്റെ സന്ദർഭാനുസൃതമായ വിവർത്തനമാണ്; അതിന് ‘കൂട്ടംകൂടുന്ന ജീവി’ അല്ലെങ്കിൽ ‘ഇഴജന്തു’ എന്നും പറയാം.
    reason: טמא എന്ന പദത്തിന്റെ ആചാരപരമായ അശുദ്ധി എന്ന അർഥവും שׁרץ എന്ന പദത്തിന്റെ ‘swarming/teeming creature’ എന്ന വ്യാപകമായ വർഗാർഥവും സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിച്ച്
  rationale: ഹിത്പയേൽ രൂപത്തിന്റെ ആത്മനിഷ്ഠമായ അർഥം—തങ്ങളെത്തന്നെ വിശുദ്ധമായി വേർതിരിക്കുക—സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: വിശുദ്ധരായിരിക്കുവിൻ
  rationale: ആവശ്യപ്പെടുന്ന അവസ്ഥയും സന്ദർഭത്തിലെ ആജ്ഞാഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: תְטַמְּאוּ אֶת נַפְשֹׁתֵיכֶם
  choice: നിങ്ങളെത്തന്നെ അശുദ്ധരാക്കരുത്
  rationale: നֶפֶשׁ എന്ന പദത്തെ ഇവിടെ ‘ആത്മാക്കൾ’ എന്നു വേർതിരിച്ചു വായിക്കാതെ വ്യക്തികളെ മുഴുവനായി സൂചിപ്പിക്കുന്ന ആത്മനിഷ്ഠ പ്രയോഗമായി പരിഭാഷപ്പെടുത്തി.
- source_word: הַשֶּׁרֶץ הָרֹמֵשׂ
  choice: ഇഴഞ്ഞുനീങ്ങുന്ന ... ചെറുജീവി
  rationale: ശׁרץ സൂചിപ്പിക്കുന്ന ചെറുതായി കൂട്ടംകൂടി സഞ്ചരിക്കുന്ന ജീവികളെയും רמשׂ സൂചിപ്പിക്കുന്ന നിലത്തോടുചേർന്നുള്ള ചലനത്തെയും വായനാസൗകര്യത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: עַל הָאָרֶץ
  choice: നിലത്ത്
  rationale: ഈ ജീവികളുടെ ഭൂതലസഞ്ചാരമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘ഭൂമിയിൽ’ എന്നതിനെക്കാൾ ‘നിലത്ത്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
theological_decisions:
- issue: ദൈവത്തിന്റെ വിശുദ്ധിയും ജനങ്ങളുടെ ബാധ്യതയും തമ്മിലുള്ള പദബന്ധം
  choice: ദൈവത്തിനും ജനങ്ങൾക്കും ‘വിശുദ്ധ’ എന്ന ഒരേ പദകുടുംബം നിലനിർത്തി
  alternative: ഒരിടത്ത് ‘വേർതിരിക്കപ്പെട്ട’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: קדשׁ എന്ന ആവർത്തിത മൂലപദത്തിലൂടെ ദൈവത്തിന്റെ വിശുദ്ധിയിൽ ജനങ്ങളുടെ വിശുദ്ധിക്കുള്ള അടിസ്ഥാനം സ്ഥാപിക്കുന്ന വാക്യത്തിന്റെ ദൈവശാസ്ത്രബന്ധം ഇതിലൂടെ വ്യക്തമാകുന്നു.
- issue: נַפְשֹׁתֵיכֶם എന്ന പദത്തിന്റെ അർഥം
  choice: ‘നിങ്ങളെത്തന്നെ’
  alternative: ‘നിങ്ങളുടെ ആത്മാക്കളെ’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ ജീവനെ’
  rationale: ഇവിടെ സാങ്കേതികമായ ശരീരം–ആത്മാവ് വേർതിരിവല്ല, വിലക്കപ്പെട്ട ജീവികളാൽ വ്യക്തികൾ അശുദ്ധരാകുന്നതാണ് വിഷയം; അതിനാൽ അനാവശ്യമായ മാനവശാസ്ത്ര നിഗമനം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ആയിരിക്കുവിൻ’ എന്ന രൂപം ആജ്ഞയുടെ ഗൗരവം നിലനിർത്തുന്നു; അത്യന്തം പുരാതനമായ പദക്രമം ഒഴിവാക്കി.
