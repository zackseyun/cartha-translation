  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: ml
  text: നിങ്ങൾക്കു ഭക്ഷണത്തിനുള്ള[a] മൃഗങ്ങളിൽ ഏതെങ്കിലും ഒന്ന് ചത്താൽ, അതിന്റെ ശവം തൊടുന്നവൻ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിങ്ങൾക്കു ഭക്ഷണമായിരിക്കുന്ന.” ഈ ഹീബ്രു പ്രയോഗം ഭക്ഷണമായി അനുവദിക്കപ്പെട്ട മൃഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: …ചത്താൽ
  rationale: വാക്യം മുൻനിയമങ്ങളോടു ബന്ധിപ്പിക്കുന്ന വ്യവസ്ഥാപരമായ പ്രയോഗം. മലയാളത്തിൽ ‘-ആൽ’ എന്ന വ്യവസ്ഥാരൂപം ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു; വേറിട്ട ‘എന്നാൽ’ ചേർക്കേണ്ടതില്ല.
- source_word: יָמוּת
  choice: ചത്താൽ
  rationale: മൃഗത്തിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപ്രയോഗം; വ്യവസ്ഥാവാക്യത്തിലെ ഹീബ്രു അപൂർണക്രിയയുടെ ഭാവവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: מִן הַבְּהֵמָה
  choice: മൃഗങ്ങളിൽ ഒന്ന്
  rationale: מִן എന്നതിന്റെ അംശസൂചകബലം ‘ഒന്ന്’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു. ഈ ഭക്ഷണനിയമസന്ദർഭത്തിൽ בְּהֵמָה കരയിലെ ഭക്ഷ്യയോഗ്യ മൃഗങ്ങളുടെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വളർത്തുമൃഗം’ എന്നു അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ ‘മൃഗം’ എന്നു നൽകി.
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: നിങ്ങൾക്കു ഭക്ഷണത്തിനുള്ള
  rationale: ഹീബ്രുവിലെ വർഗീകരണസ്വഭാവവും ‘നിങ്ങൾക്കു ഭക്ഷണമായി’ എന്ന ആശയവും അടുത്തായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം. ഇത് വെറും ഉടമസ്ഥതയല്ല, ഭക്ഷ്യയോഗ്യതയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַנֹּגֵעַ
  choice: തൊടുന്നവൻ
  rationale: കർതൃവാചക വർത്തമാനകൃദന്തരൂപത്തിന്റെ പൊതുവായ വ്യക്തിസൂചന സംക്ഷിപ്തമായും നേരിട്ടും നൽകുന്നു.
- source_word: בְּנִבְלָתָהּ
  choice: അതിന്റെ ശവം
  rationale: נְבֵלָה സ്വാഭാവികമായി ചത്ത മൃഗത്തിന്റെ ജഡത്തെ സൂചിപ്പിക്കുന്നു. ‘ശവം’ സാധാരണ വായനക്കാർക്കു വ്യക്തവും ശുദ്ധിനിയമത്തിന്റെ സന്ദർഭത്തിനു യോജിച്ചതുമാണ്.
- source_word: יִטְמָא
  choice: അശുദ്ധനായിരിക്കും
  rationale: ഇവിടെ ആചാരപരമായ അശുദ്ധിയാണ് ഉദ്ദേശ്യം. നിയമവാക്യത്തിലെ നിർണിത ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: നിയമസൂത്രത്തിലെ സമയപരിധി സംക്ഷിപ്തവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘അശുദ്ധൻ’ എന്നതിന്റെ സ്വഭാവം
  choice: അശുദ്ധനായിരിക്കും
  alternative: മലിനനായിത്തീരും
  rationale: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധിനിയമസന്ദർഭം ആചാരപരമായ നിലയെയാണ് സൂചിപ്പിക്കുന്നത്; ധാർമിക കുറ്റമോ ശാരീരിക അഴുക്കോ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കാതെ പതിവായ നിയമപരമായ പദം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള നിയമശൈലി. ‘നിങ്ങൾക്കു ഭക്ഷണത്തിനുള്ള’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ ഘടനയും ഭക്ഷ്യയോഗ്യതയുടെ ആശയവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
