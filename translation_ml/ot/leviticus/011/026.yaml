    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു പിളർപ്പിനെ പിളർക്കുന്നില്ല.’ ഒരേ ധാതുവിൽനിന്നുള്ള നാമവും ക്രിയയും ചേർന്ന ഈ എബ്രായ പ്രയോഗം കുളമ്പ് പൂർണമായി രണ്ടായി പിളർന്നിട്ടില്ലെന്ന ആശയത്തിന് ഊന്നൽ നൽകുന്നു.
