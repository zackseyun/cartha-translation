id: LEV.11.26
reference: Leviticus 11:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְֽ/כָל הַ/בְּהֵמָ֡ה אֲשֶׁ֣ר הִוא֩ מַפְרֶ֨סֶת פַּרְסָ֜ה וְ/שֶׁ֣סַע אֵינֶ֣/נָּה שֹׁסַ֗עַת וְ/גֵרָה֙ אֵינֶ֣/נָּה מַעֲלָ֔ה טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִטְמָֽא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: ml
  text: കുളമ്പ് പിളർന്നിട്ടുണ്ടെങ്കിലും, അത് പൂർണമായി രണ്ടായി പിരിഞ്ഞിട്ടില്ലാത്തതും അയവിറക്കാത്തതുമായ എല്ലാ മൃഗങ്ങളും നിങ്ങൾക്ക് അശുദ്ധമാണ്. അവയെ തൊടുന്ന ഏതൊരാളും അശുദ്ധനാകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: എല്ലാ മൃഗങ്ങളും
  rationale: לְ ഇവിടെ പരിഗണനയിലുള്ള വിഭാഗത്തെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യഘടനയിലൂടെ ആ വിഷയപ്രാധാന്യം സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ ‘എല്ലാ മൃഗങ്ങളും’ എന്നു നൽകി.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: കുളമ്പു പിളർന്നിട്ടുണ്ടെങ്കിലും
  rationale: കുളമ്പ് വിഭജിക്കപ്പെട്ടിരിക്കുന്ന അവസ്ഥയാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. തുടർന്നുള്ള വിരുദ്ധവിവരണവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘എങ്കിലും’ ചേർത്തു.
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: അതു പൂർണമായി രണ്ടായി പിരിഞ്ഞിട്ടില്ലാത്തതും
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള നാമവും ക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗം കുളമ്പ് പൂർണമായി രണ്ടായി വേർപെട്ടിട്ടില്ലെന്ന ആശയം ഊന്നുന്നു. വ്യക്തതയ്ക്കായി ‘പൂർണമായി രണ്ടായി’ എന്നു നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: അയവിറക്കാത്തതുമായ
  rationale: അക്ഷരാർഥത്തിൽ ‘അയവ് മുകളിലേക്കു കൊണ്ടുവരാത്ത’ എന്നാണെങ്കിലും, ആ ജൈവപ്രക്രിയയ്ക്കുള്ള സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപദം ‘അയവിറക്കുക’ എന്നതാണ്.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: നിങ്ങൾക്ക് അശുദ്ധമാണ്
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ ശുദ്ധി-അശുദ്ധി വിഭാഗത്തെ ‘അശുദ്ധം’ കൃത്യമായി സൂചിപ്പിക്കുന്നു. לָכֶם എന്ന നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ കാഴ്ചപ്പാട് ‘നിങ്ങൾക്ക്’ എന്നു നിലനിർത്തി.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: അവയെ തൊടുന്ന ഏതൊരാളും
  rationale: כָּל സഹിതമുള്ള ഏകവചന കൃദന്തം പൊതുവായ വ്യവസ്ഥയാണ്; ‘ഏതൊരാളും’ അത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִטְמָא
  choice: അശുദ്ധനാകും
  rationale: ഈ അപൂർണക്രിയ നിയമപരമായ ഫലത്തെയും അതിലൂടെ ഉണ്ടാകുന്ന അവസ്ഥയെയും സൂചിപ്പിക്കുന്നു. ‘അശുദ്ധനാകും’ രണ്ടും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ലേവ്യനിയമത്തിലെ ശുദ്ധി-അശുദ്ധി പദാവലി
  choice: അശുദ്ധം
  alternative: മലിനം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് നിർബന്ധമായും ധാർമികദോഷമല്ല, ആചാരപരമായ ശുദ്ധിവിഭാഗമാണ്. ‘അശുദ്ധം’ ആ വ്യത്യാസം നിലനിർത്തുകയും അനാവശ്യമായ ധാർമിക അർഥം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമപരമായ ശൈലി ഉപയോഗിച്ചു. സാങ്കേതികമല്ലാത്ത വായനക്കാർക്കും ഗ്രഹിക്കാവുന്ന ‘കുളമ്പ്’, ‘അയവിറക്കുക’, ‘അശുദ്ധം’ എന്നീ പ്രചാരത്തിലുള്ള പദങ്ങൾ തിരഞ്ഞെടുത്തു; മൂലത്തിലെ വർഗീകരണവും ആചാരപരമായ അർഥവും നിലനിർത്തി.
