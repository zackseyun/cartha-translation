source:
  edition: WLC
  text: וְ/זֶ֤ה לָ/כֶם֙ הַ/טָּמֵ֔א בַּ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ הַ/חֹ֥לֶד וְ/הָ/עַכְבָּ֖ר וְ/הַ/צָּ֥ב לְ/מִינֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: ml
  text: 'നിലത്ത് കൂട്ടമായി സഞ്ചരിക്കുന്ന ചെറുജീവികളിൽ നിങ്ങൾക്ക് അശുദ്ധമായവ ഇവയാണ്: മോൾ-എലി[a], എലി, അതതു വർഗത്തിൽപ്പെട്ട വലിയ പല്ലി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: חֹלֶד, צָב എന്നീ ഹീബ്രു പദങ്ങൾ സൂചിപ്പിക്കുന്ന ജീവികൾ ഏതെന്നു കൃത്യമായി നിർണയിക്കപ്പെട്ടിട്ടില്ല. חֹלֶד എന്നതിന് ‘വീസൽ’ അല്ലെങ്കിൽ ‘മോൾ’ എന്നും צָב എന്നതിന് ‘ആമ’ അല്ലെങ്കിൽ പൊതുവായി ‘പല്ലി’ എന്നും പരമ്പരാഗതമായി പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה לָכֶם הַטָּמֵא
  choice: നിങ്ങൾക്ക് അശുദ്ധമായവ ഇവയാണ്
  rationale: ഹീബ്രുവിലെ ഏകവചനരൂപമായ זֶה തുടർന്നുവരുന്ന ജീവികളുടെ പട്ടികയെ പരിചയപ്പെടുത്തുന്നു. അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനമായ ‘ഇവയാണ്’ എന്നു നൽകി; לָכֶם എന്ന ബന്ധസൂചന ‘നിങ്ങൾക്ക്’ എന്നും ആചാരപരമായ טָמֵא ‘അശുദ്ധമായവ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ עַל הָאָרֶץ
  choice: നിലത്തു കൂട്ടമായി സഞ്ചരിക്കുന്ന ചെറുജീവികളിൽ
  rationale: שֶׁרֶץ എന്ന നാമത്തിന്റെയും שׁרץ എന്ന ക്രിയയുടെയും ബന്ധം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട്, എലി പോലുള്ള പട്ടികയിലെ ജീവികൾക്കും ചേരുന്ന സ്വാഭാവിക മലയാളം തിരഞ്ഞെടുത്തു. ‘ചെറുജീവികൾ’ ഈ നിയമപരമായ ജീവിവർഗത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: הַחֹלֶד
  choice: മോൾ എലി
  rationale: ജീവിയുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. നിലത്തിനടിയിൽ കഴിയുന്ന ഒരു ചെറു സസ്തനിയെന്ന സാധ്യത സൂചിപ്പിക്കുന്ന ആധുനിക നാമം മുഖ്യപാഠത്തിൽ നൽകി; മറ്റു പരമ്പരാഗത തിരിച്ചറിയലുകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: הָעַכְבָּר
  choice: എലി
  rationale: עַכְבָּר എലി വർഗത്തിലെ ജീവിയെ സൂചിപ്പിക്കുന്ന സാധാരണ പദമാണ്; മലയാളത്തിലെ ‘എലി’ സ്വാഭാവികവും ആവശ്യമായത്ര വിശാലവുമാണ്.
- source_word: הַצָּב
  choice: വലിയ പല്ലി
  rationale: ഈ ജീവിയുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണെങ്കിലും ഇവിടെ ഒരു വലിയ പല്ലിവർഗജീവിയാകാനുള്ള സാധ്യത പരിഗണിച്ചു. ‘ആമ’ എന്ന പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: לְמִינֵהוּ
  choice: അതതു വർഗത്തിൽപ്പെട്ട
  rationale: മִין എന്ന വർഗീകരണപദത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഈ പ്രയോഗം പട്ടികയിൽ അവസാനമായി പറഞ്ഞ ജീവിയുടെ വിവിധ വർഗങ്ങളെ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: טָמֵא എന്ന പദത്തിന്റെ ആചാരശുദ്ധിസംബന്ധമായ അർഥം
  choice: അശുദ്ധമായവ
  alternative: മലിനമായവ
  rationale: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധി-അശുദ്ധി നിയമങ്ങളുടെ സാങ്കേതിക പശ്ചാത്തലം നിലനിർത്താൻ ‘അശുദ്ധം’ ഉപയോഗിച്ചു; ഇത് സാധാരണ ശാരീരിക അഴുക്കിനെയോ ധാർമിക ദോഷത്തെയോ മാത്രം സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമപാഠശൈലി സ്വീകരിച്ചു. ഹീബ്രു പട്ടികയുടെ ഘടനയും ആചാരശുദ്ധിയുടെ സാങ്കേതിക ഭാഷയും നിലനിർത്തി; അനിശ്ചിതമായ ജന്തുനാമങ്ങൾ അടിക്കുറിപ്പിലൂടെ തുറന്നുവച്ചു.
