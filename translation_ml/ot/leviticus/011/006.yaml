  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: ml
  text: കാട്ടുമുയലും[a]—കാരണം അത് അയവിറക്കുന്നു, എന്നാൽ അതിന്റെ കുളമ്പ് പിളർന്നിട്ടില്ല; അതു നിങ്ങൾക്കു അശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം പരമ്പരാഗതമായി ‘കാട്ടുമുയൽ’ (hare) എന്നു മനസ്സിലാക്കപ്പെടുന്നു; ചിലർ അതിനെ മുയൽവർഗത്തെ സൂചിപ്പിക്കുന്ന കൂടുതൽ വിശാലമായ പദമായി കാണുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: മുയൽ
  rationale: എബ്രായപദം പരമ്പരാഗതമായി hare എന്ന ജന്തുവിനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കപ്പെടുന്നു. മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വിശാലവുമായ തിരിച്ചറിയൽപദം ‘മുയൽ’ ആണ്; കൃത്യമായ ജന്തുശാസ്ത്രപരമായ തിരിച്ചറിയലിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: അത്
  rationale: ഇവിടെ כִּי വർഗീകരണത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ പിന്നാലെയുള്ള രണ്ടു ലക്ഷണങ്ങളെ ഡാഷിന് ശേഷം നേരിട്ട് പ്രസ്താവിക്കുന്നത് കാരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מַעֲלַת גֵּרָה
  choice: അയവിറക്കുന്നു
  rationale: ‘അയവിറക്കുക’ എന്നത് തീറ്റ വീണ്ടും വായിലേക്കു കൊണ്ടുവന്ന് ചവയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ നിലവിലുള്ള സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: എന്നാൽ അതിന്റെ കുളമ്പ് പിളർന്നിട്ടില്ല
  rationale: എബ്രായത്തിലെ നിഷേധാത്മകമായ രണ്ടാമത്തെ മാനദണ്ഡം വ്യക്തമായി നിലനിർത്തുന്നു; ‘എന്നാൽ’ ആദ്യ ലക്ഷണത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: טְמֵאָה הִוא לָכֶם
  choice: അത് നിങ്ങൾക്ക് അശുദ്ധമാണ്
  rationale: ആചാരപരമായ ഭക്ഷണവർഗീകരണത്തിന്റെ പശ്ചാത്തലത്തിൽ טָמֵא എന്ന പദത്തിന്റെ വിശാലമായ ബൈബിൾപ്രയോഗം ‘അശുദ്ധം’ നിലനിർത്തുന്നു; לָכֶם എന്നത് ‘നിങ്ങൾക്ക്’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ലേവ്യ ഭക്ഷണനിയമത്തിലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: ആചാരപരമായ അശുദ്ധി
  alternative: ധാർമികമായ തിന്മയോ മലിനതയോ
  rationale: ഈ വാക്യം ഇസ്രായേലിന്റെ ഭക്ഷണനിയമത്തിലെ വർഗീകരണത്തെക്കുറിച്ചാണ്; ജന്തു ധാർമികമായി ദുഷ്ടമാണെന്ന് പറയുന്നതല്ല. മുഖ്യപാഠത്തിൽ വിശാലമായ ‘അശുദ്ധം’ എന്ന ബൈബിൾപദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. എബ്രായവാക്യത്തിന്റെ മൃഗപ്പട്ടികാ ഘടന നിലനിർത്താൻ ആരംഭത്തിൽ ‘മുയലിനെയോ’ എന്നും, കാരണലക്ഷണങ്ങൾ വ്യക്തമായി വേർതിരിക്കാൻ ഡാഷും ഉപയോഗിച്ചു.
