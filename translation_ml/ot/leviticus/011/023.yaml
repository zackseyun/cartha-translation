  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. നിയമവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
