id: LEV.11.23
reference: Leviticus 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף אֲשֶׁר ל֖/וֹ אַרְבַּ֣ע רַגְלָ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: ml
  text: എന്നാൽ നാലു കാലുകളുള്ള[b] ചിറകുള്ള ചെറുപ്രാണികളെല്ലാം[a] നിങ്ങൾക്കു വെറുക്കത്തക്കവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പറക്കുന്ന ഇഴജീവികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗം കൂട്ടമായി കാണപ്പെടുന്ന പറക്കുന്ന ചെറുജീവികളെ, പ്രത്യേകിച്ച് പ്രാണികളെ, വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘നാലു കാലുകൾ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: എന്നാൽ … എല്ലാം
  rationale: മുൻവാക്യത്തിലെ അനുവദനീയമായ ജീവികളെക്കുറിച്ചുള്ള പ്രസ്താവനയ്ക്കു പിന്നാലെയുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; כֹל എന്നതിന്റെ സമഗ്രത ‘എല്ലാം’ നിലനിർത്തുന്നു.
- source_word: שֶׁרֶץ הָעֹוף
  choice: ചിറകുള്ള ഇഴജന്തുക്കൾ
  rationale: പറക്കുന്നതോ ചിറകുള്ളതോ ആയ ചെറുജീവികളുടെ വിശാല വിഭാഗത്തെയാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികവും ചുരുക്കവുമായ വിഭാഗനാമമായി ഇത് ഉപയോഗിച്ചു; പദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: אֲשֶׁר לוֹ
  choice: ഉള്ള
  rationale: ഉടമസ്ഥതയെയോ സവിശേഷതയെയോ സൂചിപ്പിക്കുന്ന ആപേക്ഷിക ഘടന സ്വാഭാവിക മലയാളത്തിൽ ‘ഉള്ള’ എന്നു നൽകി.
- source_word: אַרְבַּע רַגְלָיִם
  choice: നാലു കാലുകൾ
  rationale: മൂലപാഠത്തിലെ സംഖ്യയും ശരീരാവയവത്തെ സൂചിപ്പിക്കുന്ന പദവും നേരിട്ട് നിലനിർത്തുന്നു; ചുറ്റുമുള്ള വാക്യങ്ങളിലെ ജന്തുശാസ്ത്രപരമായ സങ്കീർണത പരിഹരിക്കാൻ പാഠം മാറ്റിയിട്ടില്ല.
- source_word: שֶׁקֶץ הוּא לָכֶם
  choice: നിങ്ങൾക്കു വെറുക്കത്തക്കവയാണ്
  rationale: שֶׁקֶץ എന്നതിലെ ശക്തമായ അറപ്പിന്റെയും നിരാകരണത്തിന്റെയും ഭാവം നൽകുന്നു; ‘അശുദ്ധം’ എന്നു മാത്രം പറഞ്ഞ് അർത്ഥം ചുരുക്കുകയോ പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക സാങ്കേതിക അർത്ഥം ചേർക്കുകയോ ചെയ്യുന്നില്ല. എബ്രായത്തിലെ വർത്തമാനകാല നാമവാക്യത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
