id: LEV.11.28
reference: Leviticus 11:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: ml
  text: അവയുടെ ശവം ചുമക്കുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകണം; സന്ധ്യവരെ അശുദ്ധനായിരിക്കും.[a] അവ നിങ്ങൾക്ക് അശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവയുടെ ശവങ്ങൾ.’ ഇവിടെ എബ്രായപ്രയോഗം പരാമർശിക്കപ്പെടുന്ന മൃഗങ്ങളെ ഓരോന്നായി ഉദ്ദേശിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: ചുമക്കുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപസർഗത്തോടുകൂടിയ കർത്തൃവാചക കൃദന്തം പൊതുവായ നിയമപ്രസ്താവനയിൽ ‘ചുമക്കുന്നവൻ’ എന്ന അർഥം നൽകുന്നു.
- source_word: נִבְלָתָם
  choice: അവയുടെ ശവം
  rationale: נְבֵלָה ഇവിടെ മൃഗത്തിന്റെ ശവത്തെ സൂചിപ്പിക്കുന്നു; ബഹുവചന പ്രത്യയം മുൻസന്ദർഭത്തിലെ മൃഗങ്ങളിലേക്കാണ് ചൂണ്ടുന്നത്. എബ്രായത്തിലെ ഏകവചനരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ കഴുകണം
  rationale: നിയമസാഹിത്യത്തിലെ അപൂർണക്രിയയ്ക്ക് നിർദേശകബലം ഉണ്ട്; ആധുനിക മലയാളത്തിൽ ‘കഴുകണം’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു. മൂന്നാംപുരുഷ പ്രത്യയം ‘തന്റെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְטָמֵא
  choice: അശുദ്ധനായിരിക്കും
  rationale: ശവം ചുമക്കുന്നതിന്റെ ഫലമായ ആചാരപരമായ നിലയെ സൂചിപ്പിക്കുന്നു; ഭാവാർഥമുള്ള നിയമപ്രസ്താവന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: കാലപരിധി ചുരുക്കമായും സ്വാഭാവികമായും രേഖപ്പെടുത്തുന്നു.
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: അവ നിങ്ങൾക്ക് അശുദ്ധമാണ്
  rationale: മുൻസന്ദർഭത്തിലെ മൃഗങ്ങളുടെ ആചാരപരമായ നില സംഗ്രഹിക്കുന്നു; לָכֶם എന്നത് ‘നിങ്ങൾക്ക്’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആചാരപരമായ അശുദ്ധിയുടെ പദപ്രയോഗം
  choice: അശുദ്ധം / അശുദ്ധനായിരിക്കും
  alternative: മലിനം / മലിനനായിരിക്കും
  rationale: ലേവ്യപുസ്തകത്തിലെ טמא ഒരു സാങ്കേതിക ആചാരപരമായ വിഭാഗമാണ്. ‘അശുദ്ധം’ എന്നത് ധാർമ്മിക കുറ്റബോധം അനാവശ്യമായി ചേർക്കാതെ ആ നില വ്യക്തമാക്കുകയും പ്രധാനപദത്തിന്റെ സ്ഥിരത പാലിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപ്രസ്താവനയുടെ നിർദേശകബലം ‘കഴുകണം’ എന്ന രൂപത്തിൽ നൽകി; ആചാരപരമായ അശുദ്ധിയും ധാർമ്മിക കുറ്റവും തമ്മിൽ കലർത്തിയിട്ടില്ല.
