source:
  edition: WLC
  text: דַּבְּר֛וּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֤את הַֽ/חַיָּה֙ אֲשֶׁ֣ר תֹּאכְל֔וּ מִ/כָּל הַ/בְּהֵמָ֖ה אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു പറയുക: ‘ഭൂമിയിലുള്ള സകല മൃഗങ്ങളിൽനിന്നും നിങ്ങൾക്കു ഭക്ഷിക്കാവുന്ന ജീവികൾ ഇവയാണ്.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി “ജീവി ഇതാണ്”; ഇവിടെ ആ ഏകവചനം ഒരു വർഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: പറയുക
  rationale: ബഹുവചന ആജ്ഞാരൂപം; മോശയോടും അഹരോനോടും നൽകിയ നിർദേശം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന കുടുംബബന്ധപരമായ എബ്രായ പ്രയോഗം നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായ സമൂഹനാമം.
- source_word: לֵאמֹר
  choice: 'പറയുക:'
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ആവർത്തനമില്ലാതെ കോളൺകൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: זֹאת הַחַיָּה
  choice: ജീവികൾ ഇവയാണ്
  rationale: രൂപപരമായി ഏകവചനമാണെങ്കിലും חַיָּה ഇവിടെ വർഗസൂചകമായ കൂട്ടാർഥത്തിൽ വരുകയും തുടർന്നുള്ള പട്ടികയെ പരിചയപ്പെടുത്തുകയും ചെയ്യുന്നു; അതിനാൽ മലയാളത്തിൽ ബഹുവചനം ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: നിങ്ങൾക്കു ഭക്ഷിക്കാവുന്ന
  rationale: നിയമസന്ദർഭത്തിലെ അനുമതി/അധികാരം പ്രകടിപ്പിക്കുന്നു; വെറും ഭാവികാലമായി പരിഭാഷപ്പെടുത്തുന്നില്ല.
- source_word: מִכָּל
  choice: സകല ...കളിൽനിന്നും
  rationale: ഒരു വലിയ ഗണത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് സൂചിപ്പിക്കുന്ന partitive അർഥം നിലനിർത്തുന്നു.
- source_word: הַבְּהֵמָה
  choice: മൃഗങ്ങൾ
  rationale: ഈ ഭക്ഷണനിയമസന്ദർഭത്തിൽ കരയിലെ മൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപദം.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: ഭൂമിയിലുള്ള
  rationale: തുടർന്നുവരുന്ന ജലജീവിവിഭാഗത്തിൽനിന്ന് കരജീവികളെ വേർതിരിക്കുന്ന സ്ഥാനസൂചന സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: זֹאת הַחַיָּה എന്നതിന്റെ വ്യാകരണ ഏകവചനവും വർഗസൂചക കൂട്ടാർഥവും
  choice: പ്രധാനവാചകത്തിൽ ‘ജീവികൾ ഇവയാണ്’ എന്ന സ്വാഭാവിക ബഹുവചനം
  alternative: ‘ജീവി ഇതാണ്’ എന്ന രൂപപരമായ ഏകവചനം
  rationale: മൂലത്തിലെ ഏകവചനരൂപം മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു; എന്നാൽ വരാനിരിക്കുന്ന ഭക്ഷ്യജീവികളുടെ പട്ടികയെ പരിചയപ്പെടുത്തുന്ന കൂട്ടാർഥം മലയാളത്തിൽ വ്യക്തമായി കൈമാറുന്നു. ഇതിൽ പ്രത്യേക മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഇസ്രായേൽമക്കൾ’ എന്ന പരിചിതമായ കുടുംബബന്ധപദം നിലനിർത്തി; ഉദ്ധരണി അവതരിപ്പിക്കുന്ന לֵאמֹר മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി വിരാമചിഹ്നത്തിലൂടെ പ്രകടിപ്പിച്ചു.
