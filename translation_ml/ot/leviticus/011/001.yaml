  text: And Yahweh spoke to Moses and to Aaron[a], saying to them,
translation:
  language: ml
  text: 'യാഹ്‌വേ[a] മോശെയോടും അഹരോനോടും സംസാരിച്ചു; അവരോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: യְהוָה എന്ന ദൈവനാമത്തിന്റെ ലിപ്യന്തരണവും പരമ്പരാഗത പകരവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ വിവരണാത്മക രൂപം ഒരു പുതിയ ദൈവിക അരുളപ്പാടിനെ അവതരിപ്പിക്കുന്നു; ‘സംസാരിച്ചു’ സൂത്രവാക്യത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: രണ്ടുപേരും അരുളപ്പാടിന്റെ സഹസ്വീകർത്താക്കളാണെന്ന ഹീബ്രു ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר אֲלֵהֶם
  choice: അവരോടു പറഞ്ഞു
  rationale: തുടർന്നുവരുന്ന വാക്കുകൾ മോശയോടും അഹരോനോടും തന്നെയാണ് അഭിസംബോധന ചെയ്യുന്നതെന്ന് אֲלֵהֶם വ്യക്തമാക്കുന്നു; ആവർത്തനഭാവം ഒഴിവാക്കാതെ വായനാസൗകര്യത്തോടെ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ പേരായി നിലനിർത്തുന്നു; മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ തിരിച്ചറിയാവുന്ന ‘യഹോവ’ സ്വീകരിക്കുകയും മറ്റൊരു സാദ്ധ്യ ഉച്ചാരണം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ഹീബ്രുവിലെ ഇരട്ട അഭിസംബോധനയും ‘അവരോട്’ എന്ന വ്യക്തമായ സൂചനയും നിലനിർത്തി; തുടർന്നുവരുന്ന നേരിട്ടുള്ള അരുളപ്പാടിന് യോജിച്ച് അവസാനം ദ്വിബിന്ദു ചേർത്തു.
