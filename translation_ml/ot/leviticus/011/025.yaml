    rationale: 'In Malayalam, ‘ഏതെങ്കിലും’ in this construction is unclear as to whether it modifies a carcass or something taken from one. Adding ‘ഒന്ന്’ makes the distributive object explicit: ‘any one of their carcasses.’'
