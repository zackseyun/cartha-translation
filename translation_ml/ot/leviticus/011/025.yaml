reference: Leviticus 11:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּשֵׂ֖א מִ/נִּבְלָתָ֑/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/025.yaml
  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: ml
  text: അവയുടെ ശവങ്ങളിൽ ഏതെങ്കിലുമൊന്ന് ചുമക്കുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകണം; അവൻ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയുടെ ശവങ്ങളിൽനിന്ന്.’ എബ്രായ പ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ ‘അവയുടെ ശവങ്ങളിൽ ഏതെങ്കിലുമൊന്ന്’ എന്നത് വിതരണാർത്ഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הַ/נֹּשֵׂא
  choice: ചുമക്കുന്നവൻ
  rationale: כָּל എന്നതോടുകൂടിയ കർത്തൃവാചക രൂപം പൊതുവായ നിയമത്തിൽ ‘ആരെങ്കിലും/എല്ലാവനും’ എന്ന വിതരണാർത്ഥം നൽകുന്നു. മലയാളത്തിൽ ‘ചുമക്കുന്നവൻ’ ഈ പൊതുവ്യാപ്തി സ്വാഭാവികമായി അറിയിക്കുന്നു; וְ മുൻനിയമത്തോടുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നു.
- source_word: מִ/נִּבְלָתָ/ם
  choice: അവയുടെ ശവങ്ങളിൽ ഏതെങ്കിലും
  rationale: נְבֵלָה ഇവിടെ മൃഗത്തിന്റെ ശവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. נשׂא-യ്ക്കുശേഷമുള്ള מִן ഭാഗികമോ വിതരണപരമോ ആയ അർത്ഥം നൽകാം; അതിനാൽ ‘അവയുടെ ശവങ്ങളിൽ ഏതെങ്കിലും’ സ്വാഭാവികമായും കൃത്യമായും അർത്ഥം നൽകുന്നു.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: തന്റെ വസ്ത്രങ്ങൾ കഴുകണം
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ imperfect ബാധ്യത അറിയിക്കുന്നു. ‘കഴുകണം’ ആ നിർദേശാത്മക ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ഏകവചന പുല്ലിംഗ പ്രതിനിധിയെ ‘തന്റെ’ നിലനിർത്തുന്നു.
- source_word: וְ/טָמֵא
  choice: അവൻ ... അശുദ്ധനായിരിക്കും
  rationale: טָמֵא ധാർമ്മിക ദുഷ്ടതയല്ല, ആചാരപരമായ അശുദ്ധാവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ പൂർണ്ണവാക്യരൂപം ഉപയോഗിക്കുന്നത് അർത്ഥം സുതാര്യമാക്കുന്നു.
- source_word: עַד הָ/עָרֶב
  choice: സന്ധ്യവരെ
  rationale: അശുദ്ധാവസ്ഥയുടെ കാലപരിധി സൂചിപ്പിക്കുന്ന ഈ പദപ്രയോഗത്തിന് ‘സന്ധ്യവരെ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തുല്യരൂപമാണ്.
theological_decisions:
- issue: പൊതുവായ നിയമവാക്യത്തിലെ ഏകവചന പുല്ലിംഗ രൂപങ്ങൾ
  choice: ‘ചുമക്കുന്നവൻ’, ‘തന്റെ’, ‘അവൻ’ എന്ന ഏകവചന പുല്ലിംഗ രൂപങ്ങൾ നിലനിർത്തി
  alternative: ‘ചുമക്കുന്നവർ’, ‘അവരുടെ’ എന്ന ബഹുവചന ലിംഗനിരപേക്ഷ രൂപങ്ങൾ
  rationale: എബ്രായം ഒരു പ്രതിനിധി വ്യക്തിയെ സൂചിപ്പിക്കാൻ ഏകവചന പുല്ലിംഗ രൂപങ്ങൾ ഉപയോഗിക്കുന്നു. അതിന്റെ വ്യാകരണരൂപവും പൊതുവ്യാപ്തിയും മാറ്റാതെ മലയാളത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി. ആചാരപരമായ അശുദ്ധി സൂചിപ്പിക്കാൻ ‘അശുദ്ധൻ’ ഉപയോഗിച്ചു; നിർദേശത്തിന്റെ ബാധ്യതയ്ക്ക് ‘കഴുകണം’ തെരഞ്ഞെടുത്തു.
