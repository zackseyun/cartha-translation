- from: അവ നിങ്ങൾക്കു അറപ്പുളവാക്കുന്നവയായിരിക്കണം; അവയുടെ മാംസത്തിൽനിന്ന് ഒന്നും നിങ്ങൾ തിന്നരുത്; അവയുടെ ശവങ്ങളെ അറപ്പുളവാക്കുന്നവയായി കണക്കാക്കണം.[a]
