source:
  edition: WLC
  text: וְ/שֶׁ֖קֶץ יִהְי֣וּ לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וְ/אֶת נִבְלָתָ֖/ם תְּשַׁקֵּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: ml
  text: അവ നിങ്ങൾക്കു അറപ്പുളവാക്കുന്നവയായിരിക്കണം; അവയുടെ മാംസത്തിൽനിന്ന് ഒന്നും നിങ്ങൾ തിന്നരുത്; അവയുടെ ചത്ത ശരീരങ്ങളെ അറപ്പുളവാക്കുന്നവയായി കണക്കാക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വെറുക്കത്തക്കവ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ എബ്രായപദം ഭക്ഷണനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ആചാരപരമായി അറപ്പുളവാക്കുന്നതോ വെറുക്കത്തക്കതോ ആയ ഒന്നിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: അറപ്പുളവാക്കുന്നവ
  rationale: ഭക്ഷണനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ആചാരപരമായി വെറുപ്പുളവാക്കുന്നതും ഒഴിവാക്കേണ്ടതുമായ ഒന്നിനെ ഈ പദം സൂചിപ്പിക്കുന്നു. ‘അശുദ്ധം’ എന്നത് ദുർബലവും വേറൊരു എബ്രായ പദസമൂഹവുമായി കലരാവുന്നതുമാണ്.
- source_word: יִהְיוּ לָכֶם
  choice: അവ നിങ്ങൾക്കു ... ആയിരിക്കണം
  rationale: ഇസ്രായേൽ ഇവയെ എങ്ങനെ കണക്കാക്കണമെന്ന നിർബന്ധിത നിലപാട് സൂചിപ്പിക്കുന്ന לָכֶם എന്ന ദാതൃപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִבְּשָׂרָם
  choice: അവയുടെ മാംസത്തിൽനിന്ന് ഒന്നും
  rationale: നിഷേധിക്കപ്പെട്ട ഭക്ഷണക്രിയയ്ക്കുശേഷമുള്ള מִן ഭാഗിക അർഥമുള്ളതാണ്; അവയുടെ മാംസത്തിൽ ഏതെങ്കിലും അളവ് ഭക്ഷിക്കുന്നതും വിലക്കുന്നു.
- source_word: לֹא תֹאכֵלוּ
  choice: നിങ്ങൾ തിന്നരുത്
  rationale: നിയമസന്ദർഭത്തിലെ നിഷേധാത്മക നിർദേശത്തിന്റെ വ്യക്തമായ നിരോധനശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: נִבְלָתָם
  choice: അവയുടെ ശവങ്ങൾ
  rationale: മൃഗങ്ങളുടെ ചത്ത ശരീരങ്ങളെ സൂചിപ്പിക്കുന്ന പദത്തിന് സംക്ഷിപ്തവും കൃത്യവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: תְּשַׁקֵּצוּ
  choice: അറപ്പുളവാക്കുന്നവയായി കണക്കാക്കണം
  rationale: שֶׁקֶץ എന്ന നാമത്തോടുള്ള പദബന്ധം നിലനിർത്തുകയും വെറും വൈകാരിക വെറുപ്പിനപ്പുറം നിയമപരമായ വർഗീകരണം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഭക്ഷണനിയമത്തിലെ അശുദ്ധി-ഭാഷയുടെ സ്വഭാവം
  choice: ആചാരപരമായ വെറുപ്പും ഒഴിവാക്കലും സൂചിപ്പിക്കുന്ന ‘അറപ്പുളവാക്കുന്ന’ എന്ന ഭാഷ ഉപയോഗിച്ചു.
  alternative: ‘മ്ലേച്ഛം’, ‘നിന്ദ്യം’, അല്ലെങ്കിൽ ‘അശുദ്ധം’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം ഇസ്രായേലിന്റെ ഉടമ്പടി-ഭക്ഷണ വേർതിരിവുകളെക്കുറിച്ചാണ്. ഈ തിരഞ്ഞെടുപ്പ് പദത്തിന്റെ ശക്തമായ പ്രതികൂല മൂല്യം സംരക്ഷിക്കുന്നു; എന്നാൽ മൂലപാഠം വ്യക്തമാക്കാത്ത വിശാലമായ ധാർമിക കുറ്റവിഭാഗം അതിലേക്കു ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ബന്ധകഘടന അർധവിരാമങ്ങൾകൊണ്ട് നിലനിർത്തി; ശവങ്ങളെക്കുറിച്ചുള്ള അവസാന നിർദേശം വികാരമാത്രമല്ല, നിർബന്ധിതമായ വിലയിരുത്തലാണെന്ന് വ്യക്തമാക്കാൻ ‘കണക്കാക്കണം’ സ്വീകരിച്ചു.
