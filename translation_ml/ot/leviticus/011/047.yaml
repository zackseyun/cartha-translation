    text: ‘ജീവജന്തു’ എന്നതിനു ‘മൃഗം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  revision_rationale: 'The revision makes two limited idiomatic improvements: it uses ‘ജീവജന്തു’ for the dietary-context sense of חַיָּה and replaces the less natural ‘ഭക്ഷിക്കരുതാത്ത’ with ‘ഭക്ഷിക്കാൻ പാടില്ലാത്ത,’ which clearly communicates the source’s prohibition. The Hebrew parallel structure and ritual-purity terminology are retained.'
