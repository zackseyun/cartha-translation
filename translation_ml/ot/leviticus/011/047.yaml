source:
  edition: WLC
  text: לְ/הַבְדִּ֕יל בֵּ֥ין הַ/טָּמֵ֖א וּ/בֵ֣ין הַ/טָּהֹ֑ר וּ/בֵ֤ין הַֽ/חַיָּה֙ הַֽ/נֶּאֱכֶ֔לֶת וּ/בֵין֙ הַֽ/חַיָּ֔ה אֲשֶׁ֖ר לֹ֥א תֵאָכֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/047.yaml
  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: ml
  text: അശുദ്ധമായതും ശുദ്ധമായതും തമ്മിലും, ഭക്ഷിക്കാവുന്ന ജീവജന്തുവും ഭക്ഷിക്കാൻ പാടില്ലാത്ത ജീവജന്തുവും തമ്മിലും വേർതിരിച്ചറിയാൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: വേർതിരിച്ചറിയാൻ
  rationale: ഈ ക്രിയാരൂപം മുൻസന്ദർഭത്തിലെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. കേവലം വേർപെടുത്തുക എന്നതിലുപരി, ന്യായപ്രമാണപ്രകാരമുള്ള വിഭാഗവ്യത്യാസം തിരിച്ചറിയുക എന്ന അർഥം ഇവിടെ യോജിക്കുന്നു.
- source_word: בֵּין ... וּבֵין
  choice: … തമ്മിലും … തമ്മിലും
  rationale: എബ്രായത്തിലെ ആവർത്തിത ഘടന രണ്ടു ജോടി വൈരുധ്യങ്ങളെ സമാന്തരമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തമ്മിലും’ എന്ന ആവർത്തനം അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַטָּמֵא
  choice: അശുദ്ധമായത്
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരവും നിയമപരവുമായ വർഗത്തെ സൂചിപ്പിക്കുന്നു; ധാർമ്മിക ദുഷ്ടത എന്ന ആശയം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: הַטָּהֹר
  choice: ശുദ്ധമായത്
  rationale: ‘അശുദ്ധമായത്’ എന്നതിനോടു ചേർന്നുള്ള ആചാര-നിയമപരമായ വിരുദ്ധവർഗം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַחַיָּה
  choice: ജീവി
  rationale: ഇവിടെ ഭക്ഷണനിയമങ്ങളുടെ പരിധിയിലുള്ള ജീവിയെ സൂചിപ്പിക്കുന്നു. ‘ജീവി’ എബ്രായപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുകയും കാട്ടുമൃഗങ്ങൾക്കു മാത്രമായി അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַנֶּאֱכֶלֶת
  choice: ഭക്ഷിക്കാവുന്ന
  rationale: നിഫാൽ കൃതന്തം ഇവിടെ കേവല സാധ്യതയല്ല, ഭക്ഷിക്കാൻ അനുമതിയുള്ളത് എന്ന നിയമപരമായ അർഥമാണ് നൽകുന്നത്.
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: ഭക്ഷിക്കരുതാത്ത
  rationale: ഭക്ഷിക്കാൻ നിരോധിക്കപ്പെട്ട ജീവിയെ സമകാലിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ലേവ്യനിയമത്തിലെ ആചാരശുദ്ധിയുടെ പദാവലി
  choice: טָמֵא/טָהֹר എന്നിവയെ ‘അശുദ്ധമായത്/ശുദ്ധമായത്’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘മലിനമായത്/നിർമലമായത്’
  rationale: വാക്യം ദൈവിക ഭക്ഷണനിയമത്തിൽ നിശ്ചയിച്ച ആചാര-നിയമപരമായ വിഭാഗങ്ങളെ സംഗ്രഹിക്കുന്നു. തിരഞ്ഞെടുത്ത പദങ്ങൾ അവയെ സ്വഭാവസിദ്ധമായ ധാർമ്മിക തിന്മയോ നന്മയോ ആയി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമസംഗ്രഹശൈലി. മൂലത്തിലെ ഉദ്ദേശ്യസൂചക അനന്തക്രിയ മുൻവാക്യത്തോടുള്ള വ്യാകരണബന്ധം നിലനിർത്തുന്നതിനായി വാക്യാവസാനത്തിൽ ‘വേർതിരിച്ചറിയാൻ’ എന്നു നൽകിയിരിക്കുന്നു; രണ്ടു വൈരുധ്യജോടികളുടെ സമാന്തരഘടന സംരക്ഷിച്ചിട്ടുണ്ട്.
