  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָֽ/אֹכֵל֙ מִ/נִּבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: ml
  text: അതിന്റെ ശവത്തിൽനിന്ന് തിന്നുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകണം; അവൻ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും[a][b]. അതിന്റെ ശവം ചുമക്കുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകണം; അവൻ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിന്റെ ശവത്തിൽനിന്ന്’ അല്ലെങ്കിൽ ‘അതിന്റെ ശവത്തിന്റെ ഒരു ഭാഗം’; എബ്രായപ്രയോഗത്തിന് വിഭജകാർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘അശുദ്ധൻ’ എന്നത് ഇസ്രായേലിന്റെ ആചാരശുദ്ധിനിയമങ്ങളുടെ അർഥത്തിലാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: തിന്നുന്നവൻ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ കർത്തൃവാചക കൃദന്തം പൊതുവായ നിയമവിഷയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തിന്നുന്നവൻ’ നിയമശൈലിയും ഏകവചനരൂപവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מִנִּבְלָתָהּ
  choice: അതിന്റെ ശവത്തിൽനിന്ന്
  rationale: מִן ഇവിടെ വിഭജകാർഥം വഹിച്ച് ശവത്തിന്റെ ഏതെങ്കിലും ഭാഗത്തിൽനിന്ന് തിന്നുന്നതിനെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ വ്യാപ്തി നിർബന്ധമായി തീർപ്പാക്കാതെ ഈ രൂപം യഥാർഥമായ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: נְבֵלָה / נִבְלָתָהּ
  choice: ശവം
  rationale: ഈ മൃഗശുദ്ധിനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ പദം മനുഷ്യശരീരത്തെയല്ല, ചത്ത മൃഗത്തിന്റെ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ശവം’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ കഴുകണം
  rationale: നിയമസാഹിത്യത്തിലെ അപൂർണ്ണക്രിയയ്ക്ക് നിർദേശാത്മക ബലം ഉണ്ട്. ‘കഴുകണം’ ആ നിർബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പ്രതിനിധിപരമായ ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: וְטָמֵא
  choice: അവൻ ... അശുദ്ധനായിരിക്കും
  rationale: ഇത് പ്രവൃത്തിയുടെ ഫലമായ അശുദ്ധാവസ്ഥയെ പ്രസ്താവിക്കുന്നു. ‘ആചാരപരമായി’ എന്ന വ്യാഖ്യാനവാക്ക് മുഖ്യപാഠത്തിൽ ചേർക്കാതെ സ്രോതസ്സിലെ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: കാലപരിധി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: הַנֹּשֵׂא
  choice: ചുമക്കുന്നവൻ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ കർത്തൃവാചക കൃദന്തത്തിന്റെ പൊതുവായ നിയമാർഥവും ആദ്യവാക്യത്തോടുള്ള സമാന്തരഘടനയും നിലനിർത്തുന്നു.
- source_word: אֶת נִבְלָתָהּ
  choice: അതിന്റെ ശവം
  rationale: നേരിട്ടുള്ള കർമവും ഏകവചന ഉടമസ്ഥപ്രത്യയവും മലയാളത്തിൽ ലളിതമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: അശുദ്ധതയുടെ സ്വഭാവം
  choice: മുഖ്യപാഠത്തിൽ ‘അശുദ്ധൻ’ എന്ന് മാത്രം വിവർത്തനം ചെയ്യുക
  alternative: ‘ആചാരപരമായി അശുദ്ധൻ’ എന്ന് വികസിപ്പിക്കുക
  rationale: ലേവ്യപുസ്തകത്തിലെ പശ്ചാത്തലം ഇസ്രായേലിന്റെ ആചാരശുദ്ധിനിയമങ്ങളാണെങ്കിലും, ‘ആചാരപരമായി’ എന്നത് എബ്രായപാഠത്തിൽ നേരിട്ട് ഇല്ല. അതിനാൽ മുഖ്യപാഠം മൂലരൂപം നിലനിർത്തുകയും അടിക്കുറിപ്പ് പശ്ചാത്തലം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: നിയമപരമായ കൃദന്തങ്ങളിലെ ലിംഗവും എണ്ണവും
  choice: ‘തിന്നുന്നവൻ/ചുമക്കുന്നവൻ’, ‘തന്റെ’, ‘അവൻ’ എന്നീ ഏകവചന പുല്ലിംഗരൂപങ്ങൾ നിലനിർത്തുക
  alternative: ലിംഗനിരപേക്ഷമായ ബഹുവചനരൂപം ഉപയോഗിക്കുക
  rationale: എബ്രായത്തിലെ ഏകവചന പുല്ലിംഗ നിയമരൂപം പ്രതിനിധിപരമാണ്. മലയാളത്തിൽ അതിന്റെ വ്യാകരണരൂപം നിലനിർത്തുന്നത് സ്രോതസ്സിനോടുള്ള ഔപചാരിക കൃത്യതയും രണ്ട് ഉപവാക്യങ്ങളിലെ സമാന്തരതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ആവർത്തനവും സമാന്തരവാക്യഘടനയും എബ്രായപാഠത്തിനനുസരിച്ച് നിലനിർത്തി. അടിക്കുറിപ്പുകളുടെ ക്രമം മുഖ്യപാഠത്തിലെ [a][b] എന്ന സ്വാഭാവികക്രമത്തിലാക്കി.
