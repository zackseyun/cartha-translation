source:
  edition: WLC
  text: וְ/כִ֤י יֻתַּן מַ֨יִם֙ עַל זֶ֔רַע וְ/נָפַ֥ל מִ/נִּבְלָתָ֖/ם עָלָ֑י/ו טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: ml
  text: എന്നാൽ വിത്തിന്മേൽ വെള്ളം ഒഴിച്ചിട്ടുണ്ടാകുകയും അവയുടെ ശവങ്ങളിൽ ഏതെങ്കിലും അതിന്മേൽ വീഴുകയും ചെയ്താൽ, അത് നിങ്ങൾക്കു അശുദ്ധമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻവാക്യത്തോടുള്ള വ്യത്യാസവും നിയമപരമായ ഉപാധിയും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: വിത്തിന്മേൽ വെള്ളം ഒഴിച്ചശേഷം
  rationale: ഹോഫാൽ നിഷ്ക്രിയരൂപത്തിന്റെ ‘വെള്ളം ഇടപ്പെടുക’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും, അശുദ്ധി ബാധിക്കാൻ പ്രസക്തമായ നനഞ്ഞ അവസ്ഥ വ്യക്തമാക്കുകയും ചെയ്യുന്നു; ‘നനച്ചാൽ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: וְנָפַל
  choice: വീണാൽ
  rationale: നിബന്ധനാധിഷ്ഠിത നിയമവാക്യത്തിൽ ഹീബ്രു പൂർണ്ണക്രിയയെ മലയാളത്തിലെ ഉപാധിരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִנִּבְלָתָם
  choice: അവയുടെ ശവങ്ങളിൽ ഏതെങ്കിലും
  rationale: מִן എന്നതിന്റെ അംശസൂചക അർഥവും נְבֵלָה എന്ന മൃഗശവത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: עָלָיו
  choice: അതിന്മേൽ
  rationale: പുരുഷലിംഗ ഏകവചനമായ זֶרַע എന്ന വിത്തിലേക്കുള്ള തിരിച്ചുസൂചന നിലനിർത്തുന്നു.
- source_word: טָמֵא הוּא לָכֶם
  choice: ആ വിത്ത് നിങ്ങൾക്ക് അശുദ്ധമാണ്
  rationale: ആചാരപരമായ അശുദ്ധിയുടെ നിയമപ്രഖ്യാപനം നിലനിർത്തുന്നു; മലയാളത്തിൽ സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ആ വിത്ത്’ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: ആചാരപരമായ അശുദ്ധി (‘അശുദ്ധം’)
  alternative: മലിനം / ദൂഷിതം
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരശുദ്ധിയുടെ നിയമസ്ഥിതിയെയാണ് വാക്യം സൂചിപ്പിക്കുന്നത്; ധാർമ്മിക കുറ്റമോ സാധാരണ ഭൗതിക മലിനീകരണമോ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി. ‘ശവം’ ഇവിടെ സമീപസന്ദർഭത്തിലെ അശുദ്ധമൃഗങ്ങളുടെ ചത്ത ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ഹീബ്രുവിലെ വിത്ത് എന്ന ഏകവചന സമാഹാരനാമം നിലനിർത്തിയിരിക്കുന്നു.
