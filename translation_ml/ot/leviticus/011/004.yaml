id: LEV.11.4
reference: Leviticus 11:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: ml
  text: 'എന്നാൽ, അയവിറക്കുന്നവയുടെയോ കുളമ്പ് പിളർന്നവയുടെയോ[a] കൂട്ടത്തിൽപ്പെട്ട ഇവയെ നിങ്ങൾ തിന്നരുത്: ഒട്ടകം അയവിറക്കുന്നെങ്കിലും അതിന്റെ കുളമ്പ് പിളർന്നിട്ടില്ല; അത് നിങ്ങൾക്ക് അശുദ്ധമാണ്[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുളമ്പ് രണ്ടായി വേർപെട്ടവ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘നിങ്ങൾക്ക് അശുദ്ധം’; അതായത്, ഭക്ഷണനിയമങ്ങൾക്കു കീഴിൽ ഇസ്രായേലിന് അശുദ്ധമായി കണക്കാക്കപ്പെട്ടത്.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പൊതുനിയമത്തിന് ഒരു നിയന്ത്രണമോ അപവാദമോ അവതരിപ്പിക്കുന്ന എതിർഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: അയവിറക്കുന്നവയുടെ കൂട്ടത്തിൽപ്പെട്ട
  rationale: എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ വീണ്ടും വായിലേക്കു കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മൃഗങ്ങളുടെ ഈ സ്വഭാവത്തിനുള്ള വ്യക്തവും സാധാരണവുമായ മലയാളപദമാണ് ‘അയവിറക്കുക’.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: കുളമ്പു പിളർന്നവയുടെ കൂട്ടത്തിൽപ്പെട്ട
  rationale: രണ്ടാമത്തെ വർഗീകരണലക്ഷണം വ്യക്തമാക്കുന്നു. തുടർന്നുള്ള മൃഗങ്ങൾക്ക് രണ്ടു ലക്ഷണങ്ങളിൽ ഒന്നു മാത്രമുള്ളതിനാൽ മലയാളത്തിൽ ‘-യുടെയോ ... -യുടെയോ’ എന്ന ഘടന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: הַגָּמָל
  choice: ഒട്ടകം
  rationale: പറയപ്പെട്ട മൃഗത്തിന്റെ നേരിട്ടുള്ള ആധുനിക മലയാള സമാനപദം.
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: ഒട്ടകം അയവിറക്കുന്നെങ്കിലും
  rationale: ഒട്ടകത്തിന് ആദ്യത്തെ ലക്ഷണമുണ്ടെന്ന കാര്യം അറിയിക്കുകയും, തുടർന്നുള്ള വിരുദ്ധലക്ഷണവുമായി ‘-എങ്കിലും’ മുഖേന സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: അതിന്റെ കുളമ്പ് പിളർന്നിട്ടില്ല
  rationale: രണ്ടാമത്തെ നിർബന്ധിത ലക്ഷണം ഒട്ടകത്തിനില്ലെന്ന എബ്രായവാക്യത്തിന്റെ നിഷേധം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: טָמֵא הוּא לָכֶם
  choice: അത് നിങ്ങൾക്ക് അശുദ്ധമാണ്
  rationale: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധി-അശുദ്ധി വർഗീകരണത്തിന്റെ കേന്ദ്രപദം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുകയും לָכֶם എന്ന ‘നിങ്ങൾക്ക്’ എന്ന നിയമബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ലേവ്യരുടെ ഭക്ഷണനിയമത്തിലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: അശുദ്ധം
  alternative: ആചാരപരമായി അശുദ്ധം
  rationale: טָמֵא എന്ന പദം ഇവിടെ ഇസ്രായേലിന്റെ ശുദ്ധി-വർഗീകരണവുമായി ബന്ധപ്പെട്ടതാണെങ്കിലും, മുഖ്യപാഠത്തിൽ ‘ആചാരപരം’ എന്നു ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമായി അർഥം ചുരുക്കും. അതിനാൽ അടിസ്ഥാനപദം നിലനിർത്തി പശ്ചാത്തലം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘അയവിറക്കുക,’ ‘കുളമ്പ്,’ ‘അശുദ്ധം’ എന്നീ സാധാരണവും സന്ദർഭോചിതവുമായ പദങ്ങൾ തിരഞ്ഞെടുത്തു. മൂലപാഠത്തിലെ വർഗീകരണഭാവവും നിയമപരമായ ‘നിങ്ങൾക്ക്’ എന്ന കാഴ്ചപ്പാടും നിലനിർത്തി.
