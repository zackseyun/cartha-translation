  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ആചാരശുദ്ധിയുടെ സാങ്കേതിക അർഥത്തിൽ ‘ശുദ്ധം’ നിലനിർത്തി; മൂലത്തിലെ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
