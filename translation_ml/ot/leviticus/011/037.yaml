id: LEV.11.37
reference: Leviticus 11:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִ֤י יִפֹּל֙ מִ/נִּבְלָתָ֔/ם עַל כָּל זֶ֥רַע זֵר֖וּעַ אֲשֶׁ֣ר יִזָּרֵ֑עַ טָה֖וֹר הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/037.yaml
  text: And if any of their carcass falls on any seed for sowing that is to be sown[a], it is clean.
translation:
  language: ml
  text: അവയുടെ മൃഗശവത്തിൽനിന്ന് എന്തെങ്കിലും[a] വിതയ്ക്കാൻ വെച്ചിരിക്കുന്ന ഏതെങ്കിലും വിത്തിന്മേൽ വീണാൽ, ആ വിത്ത് ശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയുടെ മൃഗശവങ്ങളിൽ ഒന്നിൽനിന്ന് എന്തെങ്കിലും.’ מִנִּבְלָתָם എന്ന എബ്രായപ്രയോഗം മൃഗശവത്തിന്റെ ഏതെങ്കിലും ഭാഗത്തെയോ അവയുടെ മൃഗശവങ്ങളിൽ ഒന്നിൽനിന്നുള്ളതെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: വീണാൽ
  rationale: തുടർന്നുവരുന്ന നിയമസാഹചര്യത്തെ നിബന്ധനയായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യാവസാന ക്രിയയിലെ ‘-ആൽ’ പ്രത്യയം ബന്ധകവും നിബന്ധനാർഥവും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: יִפֹּל
  choice: വീണാൽ
  rationale: നിയമപരമായ സാങ്കൽപ്പിക സാഹചര്യത്തിലെ Qal imperfect-നെ സ്വാഭാവികമായ മലയാള നിബന്ധനാരൂപത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: מִנִּבְלָתָם
  choice: അവയുടെ ശവത്തിൽനിന്ന് എന്തെങ്കിലും
  rationale: מִן എന്നതിന്റെ ഭാഗികാർഥവും נְבֵלָה എന്നതിന്റെ മൃഗശവാർഥവും സംരക്ഷിക്കുന്നു. എബ്രായപ്രയോഗത്തിന് ഭാഗമെന്നോ ശവങ്ങൾ എന്ന കൂട്ടാർഥത്തിലോ വായിക്കാവുന്ന അസ്പഷ്ടതയുള്ളതിനാൽ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: עַל כָּל
  choice: ഏതെങ്കിലും …മേൽ
  rationale: ഈ നിബന്ധനാപരമായ നിയമസന്ദർഭത്തിൽ עַל എന്നതിന്റെ സ്ഥലാർഥവും כָּל എന്നതിന്റെ വിതരണാർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: זֶרַע זֵרוּעַ אֲשֶׁר יִזָּרֵעַ
  choice: വിതയ്ക്കാനുള്ള ഏതെങ്കിലും വിത്ത്
  rationale: വിതയ്ക്കാൻ ഉദ്ദേശിച്ച വിത്താണ് സൂചിപ്പിക്കുന്നത്; എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിൽ കൃത്രിമമാക്കാതെ ഉദ്ദേശ്യാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: טָהוֹר הוּא
  choice: ആ വിത്ത് ശുദ്ധമാണ്
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ ശുദ്ധിയെ ‘ശുദ്ധം’ എന്നു രേഖപ്പെടുത്തുന്നു. മലയാളത്തിൽ സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ ‘ആ വിത്ത്’ എന്നു പറഞ്ഞു; ‘ശുദ്ധമായി തുടരുന്നു’ എന്ന അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
