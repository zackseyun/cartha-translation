  terminology: ‘അശുദ്ധം’ is the appropriate established rendering for ritual impurity in Leviticus, and ‘പാത്രം’ appropriately represents כְּלִי in this context. ‘ഭക്ഷിക്കാവുന്ന’ and ‘കുടിക്കാവുന്ന’ preserve the qualifying force of the Niphal forms.
