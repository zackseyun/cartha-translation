  verdict: revise
  source_fidelity: The draft accurately conveys the two qualifying categories, the condition of water coming upon food, and the resultant ritual uncleanness. ‘വീണാൽ’ is a natural contextual rendering of Hebrew ‘comes upon’ without introducing an agent. ‘അശുദ്ധമാകും’ suitably preserves the change-of-state force of יִטְמָא.
