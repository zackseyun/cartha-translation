id: LEV.11.34
reference: Leviticus 11:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/כָּל הָ/אֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛י/ו מַ֖יִם יִטְמָ֑א וְ/כָל מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּ/כָל כְּלִ֖י יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: ml
  text: ഭക്ഷിക്കാവുന്ന ഏതൊരു ഭക്ഷണത്തിന്മേലും വെള്ളം വീണാൽ അത് അശുദ്ധമാകും; ഏതെങ്കിലും പാത്രത്തിലുള്ള കുടിക്കാവുന്ന ഏതൊരു പാനീയവും അശുദ്ധമാകും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഭക്ഷിക്കപ്പെടുന്ന എല്ലാ ഭക്ഷണവും—അതിന്മേൽ വെള്ളം വന്നാൽ—അശുദ്ധമാകും; എല്ലാ പാത്രത്തിലുമുള്ള, കുടിക്കപ്പെടുന്ന എല്ലാ പാനീയവും അശുദ്ധമാകും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: ഭക്ഷിക്കാവുന്ന ഏതൊരു ഭക്ഷണവും
  rationale: מִכָּל എന്നത് ഇവിടെ ഒരു പൊതുവിഭാഗത്തിലെ ഏതൊന്നിനെയും സൂചിപ്പിക്കുന്നു; הָאֹכֶל എന്നത് ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ നിയമപരമായ വ്യാപ്തി സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ഈ രൂപം സ്വീകരിച്ചു.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: ഭക്ഷിക്കാവുന്ന
  rationale: നിഫാൽ അപൂർണക്രിയ ഭക്ഷിക്കപ്പെടുന്നതോ ഭക്ഷണയോഗ്യമായതോ എന്ന യോഗ്യത സൂചിപ്പിക്കുന്നു; ‘ഭക്ഷിക്കാവുന്ന’ ഈ അർത്ഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֲשֶׁר יָבוֹא עָלָיו מַיִם
  choice: അതിന്മേൽ വെള്ളം വീണാൽ
  rationale: അക്ഷരാർഥം ‘അതിന്മേൽ വെള്ളം വരുക’ എന്നാണ്. മലയാളത്തിൽ ‘വെള്ളം വീണാൽ’ സ്വാഭാവികമായ നിയമനിബന്ധനയായി വരുന്നു; വെള്ളം മനപ്പൂർവം ഒഴിച്ചതാണെന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: יִטְמָא
  choice: അശുദ്ധമാകും
  rationale: טמא ഇവിടെ ആചാരപരമായ അശുദ്ധാവസ്ഥയിലാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അശുദ്ധമാകും’ അവസ്ഥാമാറ്റം നിലനിർത്തുന്നു.
- source_word: מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: കുടിക്കാവുന്ന ഏതൊരു പാനീയവും
  rationale: מַשְׁקֶה എന്നത് കുടിക്കാനുള്ള പാനീയത്തെയും അനുബന്ധ നിഫാൽ രൂപം കുടിക്കപ്പെടാവുന്നതെന്ന യോഗ്യതയെയും സൂചിപ്പിക്കുന്നു.
- source_word: בְּכָל כְּלִי
  choice: ഏതെങ്കിലും പാത്രത്തിലുള്ള
  rationale: כְּלִי എന്ന പൊതുപദത്തിന് ഈ സന്ദർഭത്തിൽ ‘പാത്രം’ സ്വാഭാവികമാണ്; בְּ എന്നത് പാനീയം പാത്രത്തിനുള്ളിലാണെന്ന സ്ഥിതിയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: അശുദ്ധം
  alternative: മലിനം / ആചാരപരമായി അശുദ്ധം
  rationale: വാക്യം טמא എന്ന ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ പദം ഉപയോഗിക്കുന്നു. മുഖ്യപാഠത്തിൽ ‘അശുദ്ധം’ ആ അർത്ഥവലയം നിലനിർത്തുന്നു; വിശദീകരണപദം ചേർത്ത് വാക്യം വ്യാഖ്യാനിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. എബ്രായത്തിലെ യോഗ്യതാസൂചക നിഫാൽ രൂപങ്ങൾ ‘ഭക്ഷിക്കാവുന്ന’, ‘കുടിക്കാവുന്ന’ എന്നു നൽകി; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം മുഴുവൻ വാക്യത്തിലെ ഈ രണ്ട് സമാന്തര രൂപങ്ങൾക്കും ബാധകമാകുന്ന വിധത്തിൽ വാക്യാവസാനത്ത് ചേർത്തു.
