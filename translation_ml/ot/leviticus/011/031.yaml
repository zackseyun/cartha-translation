  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֛לֶּה הַ/טְּמֵאִ֥ים לָ/כֶ֖ם בְּ/כָל הַ/שָּׁ֑רֶץ כָּל הַ/נֹּגֵ֧עַ בָּ/הֶ֛ם בְּ/מֹתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: ml
  text: ഇഴയുന്ന എല്ലാ ജീവികളിലും ഇവ നിങ്ങൾക്കു അശുദ്ധമാണ്.[a] അവ ചത്ത അവസ്ഥയിൽ അവയെ തൊടുന്ന ഏവനും വൈകുന്നേരം വരെ അശുദ്ധനാകും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൂട്ടമായി സഞ്ചരിക്കുന്ന എല്ലാ ചെറുജീവികളിലും’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഇഴയുകയോ കൂട്ടമായി നിറഞ്ഞുനീങ്ങുകയോ ചെയ്യുന്ന ചെറുജീവികളെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അവയുടെ മരണത്തിൽ’; അവ ചത്ത അവസ്ഥയിൽ അവയെ തൊടുന്നതാണ് ഉദ്ദേശ്യം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַטְּמֵאִים לָכֶם
  choice: ഇവ നിങ്ങൾക്ക് അശുദ്ധമാണ്
  rationale: ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചനമായ אֵלֶּהയും ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്ന הַטְּמֵאִים എന്ന പദവും സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּכָל הַשָּׁרֶץ
  choice: ഇഴയുന്ന എല്ലാ ജീവികളിലും
  rationale: שֶׁרֶץ ചെറുതായി ഇഴയുകയോ കൂട്ടമായി സഞ്ചരിക്കുകയോ ചെയ്യുന്ന ജീവികളുടെ വിശാല വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വായനാസൗകര്യമുള്ള പൊതുവായ വർഗനാമമായി ഇത് നൽകുന്നു.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: അവയെ തൊടുന്ന ഏവനും
  rationale: ഹീബ്രു ഘടനയുടെ പൊതുവായ, എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന പ്രാബല്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּמֹתָם
  choice: അവ ചത്തുകിടക്കുമ്പോൾ
  rationale: അക്ഷരാർഥമായ ‘അവയുടെ മരണത്തിൽ’ എന്നതിലുപരി, അവയുടെ ചത്ത അവസ്ഥയിൽ സ്പർശിക്കുന്നതാണ് ഉദ്ദേശ്യമെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: വൈകുന്നേരംവരെ അശുദ്ധനായിരിക്കും
  rationale: സ്പർശനത്തിന്റെ ഫലമായ ആചാരപരമായ അശുദ്ധിയും അതിന്റെ സമയപരിധിയും നിയമഭാഷയുടെ ഗൗരവത്തോടെ നൽകുന്നു.
theological_decisions:
- issue: ‘അശുദ്ധം’ എന്നതിന്റെ സ്വഭാവം
  choice: ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്ന പതിവുപദമായ ‘അശുദ്ധം’ ഉപയോഗിച്ചു
  alternative: മലിനം / ശുദ്ധിയില്ലാത്തത്
  rationale: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധി-അശുദ്ധി വ്യവസ്ഥയുടെ സാങ്കേതിക അർഥം നിലനിർത്താനും ധാർമ്മിക പാപമെന്ന വ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കാതിരിക്കാനും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ലേവ്യനിയമങ്ങളുടെ ഗൗരവമുള്ള ശൈലി നിലനിർത്തി. ‘ജീവികൾ’ എന്ന പൊതുപദം ഉപയോഗിച്ച് ജീവശാസ്ത്രപരമായ അതിവിശദീകരണം ഒഴിവാക്കി.
