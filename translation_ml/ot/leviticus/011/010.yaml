language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר אֵֽין ל֜/וֹ סְנַפִּ֣יר וְ/קַשְׂקֶ֗שֶׂת בַּ/יַּמִּים֙ וּ/בַ/נְּחָלִ֔ים מִ/כֹּל֙ שֶׁ֣רֶץ הַ/מַּ֔יִם וּ/מִ/כֹּ֛ל נֶ֥פֶשׁ הַ/חַיָּ֖ה אֲשֶׁ֣ר בַּ/מָּ֑יִם שֶׁ֥קֶץ הֵ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: ml
  text: എന്നാൽ കടലുകളിലും നീരൊഴുക്കുകളിലും[a] ചിറകും ചെതുമ്പലും ഇല്ലാത്ത സകലവും—വെള്ളത്തിലെ സകല കൂട്ടമായി ചലിക്കുന്ന ജീവികളിലും വെള്ളത്തിലുള്ള സകല ജീവജാലങ്ങളിലും ഉൾപ്പെടുന്നവ—നിങ്ങൾക്കു അറപ്പുളവാക്കുന്നവയാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീരൊഴുക്കുകൾ’ എന്നത് ‘നദികൾ’ എന്നോ, സന്ദർഭമനുസരിച്ച് കാലാവസ്ഥാനുസൃതമായ ജലപാതകൾ എന്നോ വിവർത്തനം ചെയ്യാം; എബ്രായപദം ഒഴുകുന്ന ജലപാതങ്ങളെ പൊതുവേ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾക്കു അറപ്പായവയാണ്.’ ഇവിടെ എബ്രായപദം ഭക്ഷണനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ആചാരപരമായി അറപ്പുള്ളതോ വെറുക്കത്തക്കതോ ആയതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: എന്നാൽ ... എല്ലാം
  rationale: മുൻവാക്യത്തിലെ അനുവദിക്കപ്പെട്ട ജലജീവികളോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; ‘എല്ലാം’ സമഗ്രമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: ഇല്ലാത്തവ
  rationale: ആവശ്യമായ രണ്ടു ശരീരലക്ഷണങ്ങളുടെയും അഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: ചിറകുകളും ചെതുമ്പലുകളും
  rationale: ജലജീവികളുടെ fins, scales എന്നീ രണ്ടു ലക്ഷണങ്ങളും ആവശ്യമാണ് എന്ന സംയോജക അർഥം നിലനിർത്തുന്നു.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: കടലുകളിലും നീരൊഴുക്കുകളിലും
  rationale: ‘കടലുകൾ’ എന്ന ബഹുവചനവും ഒഴുകുന്ന ഉൾനാടൻ ജലപാതകളെ സൂചിപ്പിക്കുന്ന נְחָלִים എന്ന വിശാല അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: വെള്ളത്തിൽ കൂട്ടമായി ചലിക്കുന്ന സകല ജീവികളിൽപ്പെട്ടവ
  rationale: שֶׁרֶץ എന്നത് വെള്ളത്തിൽ കൂട്ടമായി നിറഞ്ഞു ചലിക്കുന്ന ജീവികളുടെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; partitive מִן ‘...യിൽപ്പെട്ടവ’ എന്നായി വ്യക്തമാക്കുന്നു.
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה אֲשֶׁר בַּמָּיִם
  choice: വെള്ളത്തിലുള്ള മറ്റേതൊരു ജീവജന്തുവായാലും
  rationale: נֶפֶשׁ הַחַיָּה എന്ന വിശാലമായ ജീവിവർഗപ്രയോഗം ‘ജീവജന്തു’ എന്നു നൽകുന്നു; ആവർത്തനം കുറയ്ക്കാൻ ‘മറ്റേതൊരു’ ഉപയോഗിച്ചെങ്കിലും സമഗ്രത സംരക്ഷിക്കുന്നു.
- source_word: שֶׁקֶץ הֵם לָכֶם
  choice: അവ നിങ്ങൾക്ക് അറപ്പുളവാക്കുന്നവയാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യം അവയുടെ നിലവിലുള്ള ആചാര-ഭക്ഷണനിയമപരമായ നില അറിയിക്കുന്നു; ‘ആണ്’ അതിനെ വർത്തമാനസ്ഥിതിയായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭക്ഷണനിയമത്തിലെ שֶׁקֶץ എന്ന ആചാരപരമായ പദം
  choice: അറപ്പുളവാക്കുന്നവ
  alternative: മ്ലേച്ഛമായവ / വെറുക്കത്തക്കവ
  rationale: ഇവിടെ പദം പൊതുവായ ധാർമിക അപലപനത്തേക്കാൾ ഇസ്രായേലിന്റെ ഭക്ഷണനിയമത്തിലെ ആചാരപരമായ അറപ്പിനെയും ഒഴിവാക്കേണ്ട നിലയെയും സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠം ശക്തി നിലനിർത്തുകയും അടിക്കുറിപ്പ് പരിധി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. നിയമപരമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അതിപുരാതനമോ പ്രത്യേക സഭാപാരമ്പര്യവുമായി ബന്ധമുള്ളതോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. ദീർഘമായ എബ്രായ വിഭാഗീകരണം ഡാഷുകൾക്കുള്ളിൽ സ്വാഭാവികമായി ക്രമപ്പെടുത്തി.
