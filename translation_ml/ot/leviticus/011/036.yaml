  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֣ךְ מַעְיָ֥ן וּ/ב֛וֹר מִקְוֵה מַ֖יִם יִהְיֶ֣ה טָה֑וֹר וְ/נֹגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/036.yaml
  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: ml
  text: എന്നാൽ, ഒരു നീരുറവയോ ജലസംഭരണക്കുഴിയോ—വെള്ളം ഒന്നിച്ചുകൂടിയിരിക്കുന്ന സ്ഥലം—ശുദ്ധമായിരിക്കും; എന്നാൽ ആ ജീവികളുടെ ശവം തൊടുന്നയാൾ അശുദ്ധനാകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ അശുദ്ധിനിയമത്തിന് ഇവിടെ ഒരു അപവാദമോ വ്യത്യാസമോ വരുന്നതായി സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘മാത്രം’ എന്ന നിയന്ത്രണാർഥം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: מַעְיָן
  choice: നീരുറവ
  rationale: സ്വാഭാവികമായി പൊട്ടിപ്പുറപ്പെടുന്ന ജലസ്രോതസ്സിനെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ പദം.
- source_word: בּוֹר
  choice: ജലസംഭരണക്കുഴി
  rationale: വെള്ളം ശേഖരിച്ചുവെക്കുന്നതിനുള്ള മനുഷ്യനിർമിത കുഴി അഥവാ സംഭരണിയെ സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു; സാധാരണ ‘കുഴി’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: מִקְוֵה מַיִם
  choice: വെള്ളം ശേഖരിച്ചുവെക്കുന്ന
  rationale: ഒന്നിച്ചുകൂടിയതോ സംഭരിക്കപ്പെട്ടതോ ആയ ജലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പദപ്രയോഗത്തിലെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יִהְיֶה טָהוֹר
  choice: ശുദ്ധമായിത്തന്നെ ഇരിക്കും
  rationale: അത്തരം ജലസ്രോതസ്സ് ശവം മൂലം അശുദ്ധമാകാതെ ശുദ്ധമായി തുടരുന്നു എന്ന സന്ദർഭസൂചന വ്യക്തമാക്കുന്നു; അതേസമയം ആചാരപരമായ ‘ശുദ്ധം’ എന്ന പദം നിലനിർത്തുന്നു.
- source_word: נֹגֵעַ
  choice: തൊടുന്നയാൾ
  rationale: സാമാന്യമായി ബാധകമായ substantival participle സ്വാഭാവികവും ലിംഗനിരപേക്ഷവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: נִבְלָתָם
  choice: അവയുടെ ശവം
  rationale: മുമ്പ് പറഞ്ഞ ജീവികളുടെ മൃതശരീരത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന-സമൂഹാർഥമുള്ള എബ്രായരൂപം സംരക്ഷിക്കുന്നു.
- source_word: יִטְמָא
  choice: അശുദ്ധനാകും
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ അശുദ്ധിസ്ഥിതിയെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: ആചാരപരമായ ശുദ്ധി-അശുദ്ധി പദാവലി
  choice: ശുദ്ധം / അശുദ്ധം
  alternative: വൃത്തിയുള്ളത് / മലിനമായത്
  rationale: ഇവിടെ ശാരീരിക വൃത്തിയെയോ നൈതിക ദുഷ്ടതയെയോ അല്ല, ലേവ്യനിയമത്തിലെ ആചാരപരമായ നിലയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശുദ്ധം / അശുദ്ധം’ ആ വ്യത്യാസം കൃത്യമായി നിലനിർത്തുന്നു.
- issue: יִהְיֶה എന്നതിലെ തുടർച്ചാസൂചന
  choice: ശുദ്ധമായിത്തന്നെ ഇരിക്കും
  alternative: ശുദ്ധമായിരിക്കും
  rationale: എബ്രായരൂപം അക്ഷരാർഥത്തിൽ ‘ശുദ്ധമായിരിക്കും’ എന്നാണെങ്കിലും, മുൻവാക്യത്തിലെ അശുദ്ധിയാകുന്ന നിയമത്തിന് ഇതൊരു അപവാദമായതിനാൽ ശുദ്ധിയായി തുടരുന്നു എന്ന സന്ദർഭസൂചന സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; പുതിയ ദൈവശാസ്ത്രവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശുദ്ധം/അശുദ്ധം’ എന്ന ആചാരപരമായ പദാവലി സ്ഥിരമായി പാലിച്ചു; ജലസംഭരണിയുടെ സ്വഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കി.
