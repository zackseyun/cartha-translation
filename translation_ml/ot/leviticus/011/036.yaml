- from: എന്നാൽ, നീരുറവയോ വെള്ളം ശേഖരിച്ചുവെക്കുന്ന ജലസംഭരണക്കുഴിയോ[a] ശുദ്ധമായിത്തന്നെ ഇരിക്കും; എന്നാൽ അവയുടെ ശവം തൊടുന്നയാൾ അശുദ്ധനാകും.
