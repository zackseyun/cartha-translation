  source_fidelity: 'മുഖ്യപാഠം എബ്രായത്തിന്റെ വർഗീകരണഭാഷയും നിയമപരമായ പ്രഖ്യാപനവും പൊതുവേ വിശ്വസ്തമായി നൽകുന്നു: כֹּל, שֶׁרֶץ, הָעוֹף, הַהֹלֵךְ, שֶׁקֶץ, לָכֶם എന്നിവയുടെ ആശയങ്ങൾ നിലനിൽക്കുന്നു. עַל־אַרְבַּע എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘നാലിന്മേൽ’ എന്നാണെങ്കിലും മലയാളത്തിൽ ‘നാല് കാലുകളിൽ’ എന്നത് കൂടുതൽ സ്വാഭാവികമാണ്; അടിക്കുറിപ്പ് അക്ഷരാർഥവും തുടർന്നുള്ള ഒഴിവാക്കലും വ്യക്തമാക്കുന്നു.'
  naturalness: ‘നാല് കാലുകളിൽ നടക്കുന്ന ചിറകുള്ള ഇഴജന്തുക്കളെല്ലാം’ എന്ന ക്രമം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘നാലുകാലിൽ’ എന്ന സംയുക്തപ്രയോഗത്തേക്കാൾ ‘നാല് കാലുകളിൽ’ സാധാരണ വായനയിൽ കൂടുതൽ സുതാര്യമാണ്.
  terminology: 'മുഖ്യപാഠത്തിലെ ‘അറപ്പുളവാക്കുന്നവ’ שֶׁקֶץ-ന്റെ ഭക്ഷണനിയമസന്ദർഭത്തിലുള്ള വെറുപ്പും നിരോധനവും യോജ്യമായി അറിയിക്കുന്നു. എന്നാൽ അടിക്കുറിപ്പ് c-യിലെ ‘മ്ലേച്ഛമായവ’ ശുപാർശ ചെയ്യാനാവില്ല: അതിന് സംസ്കാര/ജനവിഭാഗസംബന്ധമായ അനാവശ്യവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമായ അർഥഭാരമുണ്ട്; ഇവിടെ അതു ശുദ്ധി-ഭക്ഷണനിയമത്തിലെ שֶׁקֶץ-ന് യോജിച്ച പദമല്ല.'
