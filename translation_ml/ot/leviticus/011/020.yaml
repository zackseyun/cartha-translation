id: LEV.11.20
reference: Leviticus 11:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּ֚ל שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: ml
  text: നാല് കാലുകളിൽ നടക്കുന്ന ചിറകുള്ള ഇഴജന്തുക്കളെല്ലാം നിങ്ങൾക്ക് അറപ്പുളവാക്കുന്നവയാണ്[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പറക്കുന്ന ഇഴജന്തുക്കൾ.” എബ്രായപദമായ עוֹף പക്ഷികളെ മാത്രമല്ല, പറക്കുന്ന ജീവികളെ പൊതുവായും സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “നാലിന്മേൽ നടക്കുന്ന.” നാലു കാലുകൾ ഉപയോഗിച്ചുള്ള സഞ്ചാരമാണ് ഉദ്ദേശ്യം; എന്നാൽ ചാടുന്നതിനുള്ള പ്രത്യേക കാലുകളുള്ള ചില പ്രാണികൾക്ക് തുടർന്നുള്ള വാക്യങ്ങൾ ഇളവ് നൽകുന്നു.
    reason: cultural_note
  - marker: c
    text: 'അഥവാ: “നിങ്ങൾക്ക് വെറുക്കപ്പെടേണ്ടവയാണ്.” ഇവിടെ ഉപയോഗിച്ച പദം ഭക്ഷണനിയമങ്ങളുടെ പശ്ചാത്തലത്തിലുള്ള ആചാരപരമായ അറപ്പിനെയും വിലക്കിനെയും സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: എല്ലാം
  rationale: നിയമത്തിൽ ഉൾപ്പെടുന്ന മുഴുവൻ വർഗത്തെയും സമഗ്രമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: שֶׁרֶץ
  choice: ഇഴജന്തുക്കൾ
  rationale: കൂട്ടമായി പെരുകുകയോ ഇഴയുകയോ ചെയ്യുന്ന ചെറുജീവികളുടെ വർഗത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ പ്രാണികൾ ഉൾപ്പെടുന്ന വിപുലമായ വർഗനാമമായി ഉപയോഗിക്കുന്നു.
- source_word: הָעוֹף
  choice: ചിറകുള്ള
  rationale: עוֹף പക്ഷികൾക്കു മാത്രമല്ല, പറക്കുന്ന ജീവികൾക്കും ഉപയോഗിക്കാം. തുടർന്നുള്ള വാക്യങ്ങളിൽ പ്രാണികളാണ് പ്രസക്തമായതിനാൽ ‘ചിറകുള്ള’ എന്ന വിശേഷണം തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: הַהֹלֵךְ
  choice: നടക്കുന്ന
  rationale: ജീവിയുടെ പതിവായ സഞ്ചാരരീതിയെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചക രൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עַל אַרְבַּע
  choice: നാലുകാലിൽ
  rationale: അക്ഷരാർഥമായ ‘നാലിന്മേൽ’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികവും അടുത്തതുമായ രീതിയിൽ നൽകുന്നു; അടുത്ത വാക്യങ്ങളിലെ ചാടുന്ന പ്രാണികൾക്കുള്ള വ്യവസ്ഥയെ മുൻകൂട്ടി ഇല്ലാതാക്കുന്നില്ല.
- source_word: שֶׁקֶץ
  choice: അറപ്പുളവാക്കുന്നവ
  rationale: ഭക്ഷണനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ ആചാരപരമായി വെറുക്കേണ്ടതോ വിലക്കപ്പെട്ടതോ ആയ നിലയെ ശക്തമായി അറിയിക്കുന്നു; സാധാരണ ‘അശുദ്ധം’ എന്ന പദത്തിലേക്ക് ഇതിന്റെ പ്രത്യേകത ചുരുക്കുന്നില്ല.
- source_word: לָכֶם
  choice: നിങ്ങൾക്ക്
  rationale: ഇസ്രായേലുമായുള്ള ബന്ധത്തിൽ ഈ ജീവികളെ എങ്ങനെ കണക്കാക്കണം എന്ന ദാതൃബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: שֶׁקֶץ എന്ന പദത്തിന്റെ ആചാരപരമായ അർഥം
  choice: അറപ്പുളവാക്കുന്നവ
  alternative: മ്ലേച്ഛമായവ / വെറുക്കേണ്ടവ
  rationale: ഇത് പൊതുവായ നൈതിക ദുഷ്ടതയെക്കാൾ ഭക്ഷണനിയമങ്ങളിലെ ആചാരപരമായ വെറുപ്പും വിലക്കും സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠം ശക്തി നിലനിർത്തുകയും അടിക്കുറിപ്പ് പരിധി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ നിയമശൈലിയും വർഗീകരണഭാവവും നിലനിർത്തി; ‘ചിറകുള്ള’ എന്നത് പക്ഷികൾക്ക് മാത്രമായി അർഥം ചുരുങ്ങാതിരിക്കാൻ തിരഞ്ഞെടുത്തു.
