source:
  edition: WLC
  text: וּ/לְ/אֵ֖לֶּה תִּטַּמָּ֑אוּ כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: ml
  text: ഇവയാൽ നിങ്ങൾ അശുദ്ധരാകും:[a] അവയുടെ ശവത്തെ തൊടുന്ന ഏവനും സന്ധ്യവരെ അശുദ്ധനായിരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇവയെ സംബന്ധിച്ച് നിങ്ങൾ അശുദ്ധരാകും.” ആരംഭവാക്യം ഇവ അശുദ്ധിക്ക് കാരണമാകുന്നു എന്നു പറയുന്നതായോ, അടുത്ത വിഭാഗത്തെ പൊതുവായി പരിചയപ്പെടുത്തുന്നതായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “അവയുടെ ശവത്തെ” എന്ന എബ്രായപ്രയോഗത്തിൽ നാമം ഏകവചനത്തിലും ഉടമസ്ഥപ്രത്യയം ബഹുവചനത്തിലുമാണ്; “അവയുടെ ശവങ്ങളെ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: ഇവയാൽ
  rationale: לְ ചേർന്ന സൂചകപദം ഇവിടെ അശുദ്ധി ഉണ്ടാകുന്ന കാരണമെന്ന അർഥത്തിലും അടുത്ത വിഭാഗത്തെക്കുറിച്ചുള്ള ആമുഖമെന്ന അർഥത്തിലും ഗ്രഹിക്കാം. മുഖ്യവാചകത്തിലെ ‘ഇവയാൽ’ കാരണാർഥം സ്വാഭാവികമായി നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תִּטַּמָּאוּ
  choice: നിങ്ങൾ അശുദ്ധരാകും
  rationale: ടാമേ എന്ന ധാതുവിന്റെ രണ്ടാംപുരുഷ ബഹുവചനരൂപം ആചാരപരമായ അശുദ്ധാവസ്ഥയിലാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ധാർമിക കുറ്റമോ മനഃപൂർവമായ സ്വയംമലിനീകരണമോ ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: כָּל הַנֹּגֵעַ
  choice: തൊടുന്ന ഏവനും
  rationale: כָּל-നോടുകൂടിയ ഏകവചന കൃദന്തത്തിന്റെ സാമാന്യവും സർവവ്യാപകവുമായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנִבְלָתָם
  choice: അവയുടെ ശവം
  rationale: נְבֵלָה ചത്ത മൃഗത്തിന്റെ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. എബ്രായത്തിൽ നാമം ഏകവചനവും ഉടമസ്ഥപ്രത്യയം ബഹുവചനവുമാണ്; ആ രൂപം മുഖ്യവാചകത്തിൽ സൂക്ഷിച്ചു, ബഹുവചനസാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: יִטְמָא
  choice: അശുദ്ധനായിരിക്കും
  rationale: സാമാന്യ ഏകവചന കർത്താവിനോട് യോജിക്കുന്ന രൂപം; സ്പർശത്തിന്റെ ഫലമായി നിലനിൽക്കുന്ന ആചാരപരമായ അശുദ്ധി വ്യക്തമാക്കുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: അശുദ്ധാവസ്ഥയുടെ കാലപരിധി സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: വിശുദ്ധതാനിയമങ്ങളിലെ അശുദ്ധി എന്ന ആശയത്തിന്റെ സ്വഭാവം
  choice: טמא എന്ന പദം ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്ന ‘അശുദ്ധൻ/അശുദ്ധർ’ എന്നായി പരിഭാഷപ്പെടുത്തി
  alternative: മലിനൻ; അശുദ്ധിയുള്ളവൻ
  rationale: ഈ വാക്യം മൃഗശവം തൊടുന്നതിലൂടെ ഉണ്ടാകുന്ന ആചാരപരമായ അവസ്ഥയെക്കുറിച്ചാണ്; ധാർമിക കുറ്റബോധം പാഠത്തിൽ ചേർക്കാതിരിക്കാൻ ‘അശുദ്ധൻ’ അനുയോജ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമവാചകത്തിന് യോജിച്ച ഗൗരവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ലാളിത്യവും പാലിച്ചു. ‘ശവം’ മൃഗത്തിന്റെ ചത്ത ശരീരം എന്ന അർഥത്തിൽ ഉപയോഗിച്ചു; ‘സന്ധ്യവരെ’ എന്നത് സ്വാഭാവിക മലയാളക്രമം പിന്തുടരുന്നു.
