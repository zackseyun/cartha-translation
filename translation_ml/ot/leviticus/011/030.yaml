  text: the gecko[a], the monitor lizard, the lizard, the sand lizard, and the chameleon.
translation:
  language: ml
  text: പല്ലിപ്പാറ്റ[a], ഉടുമ്പ്, പല്ലി, മണൽപ്പല്ലി, ഓന്ത് എന്നിവയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലെ പല ജീവികളുടെയും കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ‘പല്ലിപ്പാറ്റ’ എന്നതിന് ഫെററ്റോ മൂക്കനെലിയോ; ‘ഉടുമ്പ്’ എന്നതിന് ഓന്തോ; ‘മണൽപ്പല്ലി’ എന്നതിന് സ്കിങ്കോ, പഴയ പാരമ്പര്യത്തിൽ ഒച്ചോ; ‘ഓന്ത്’ എന്നതിന് മോൾ എന്നറിയപ്പെടുന്ന മണ്ണെലിയോ മറ്റൊരു പല്ലിവർഗജീവിയോ എന്നും നിർദേശിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: പല്ലിപ്പാറ്റ
  rationale: കൃത്യമായ ജന്തുശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ഇഴജന്തുക്കളുടെ പട്ടിക എന്ന സന്ദർഭത്തിൽ സസ്തനിയെക്കാൾ പല്ലിവർഗത്തിൽപ്പെട്ട ജീവി സാധ്യതയുള്ളതിനാൽ, ആധുനിക മലയാളത്തിൽ ഗെക്കോയെ സൂചിപ്പിക്കുന്ന പരിചിതമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: הַכֹּחַ
  choice: ഉടുമ്പ്
  rationale: വലിയ പല്ലിവർഗജീവിയെ സൂചിപ്പിക്കുന്നതായി സാധാരണ മനസ്സിലാക്കപ്പെടുന്നു. മലയാളത്തിൽ മോണിറ്റർ ലിസാർഡിനുള്ള സ്വാഭാവികവും കൃത്യവുമായ പൊതുപദമാണ് ‘ഉടുമ്പ്’.
- source_word: הַלְּטָאָה
  choice: പല്ലി
  rationale: ഇനം കൃത്യമായി നിശ്ചയിക്കാനാകാത്തതിനാൽ വിശാലമായ ജന്തുശാസ്ത്ര അർഥം നിലനിർത്തുന്ന പൊതുപദം ഉപയോഗിച്ചു.
- source_word: הַחֹמֶט
  choice: മണൽപ്പല്ലി
  rationale: പഴയ ‘ഒച്ച്’ എന്ന നിർദേശത്തേക്കാൾ ഈ ഇഴജന്തുപ്പട്ടികയിൽ പല്ലിവർഗ തിരിച്ചറിയലാണ് സന്ദർഭോചിതം. എങ്കിലും കൃത്യമായ ഇനം അനിശ്ചിതമായതിനാൽ മറ്റൊരു സാധ്യതയായ സ്കിങ്ക് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: הַתִּנְשָׁמֶת
  choice: ഓന്ത്
  rationale: ഇതേ എബ്രായപദം മറ്റൊരു സന്ദർഭത്തിൽ പക്ഷിയെ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ ഇഴജന്തുക്കളുടെ പട്ടികയിലാണ്. ‘ഓന്ത്’ സന്ദർഭത്തിനു യോജിക്കുന്ന വ്യാപകമായ തിരിച്ചറിയലാണ്; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
