translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം. എബ്രായത്തിലെ וְ എന്ന സംയോജകത്തിന്റെ പട്ടികാസ്വഭാവം അവസാനത്തെ ‘എന്നിവയും’ എന്ന പ്രയോഗത്തിലൂടെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു. ജന്തുനാമങ്ങളുടെ യഥാർഥ തിരിച്ചറിയലിലുള്ള അനിശ്ചിതത്വം മുഖ്യവാചകത്തെ ഭാരപ്പെടുത്താതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
