  text: the little owl[a], the cormorant, and the great owl.
translation:
  language: ml
  text: ചെറിയ മൂങ്ങ[a], നീർക്കാക്ക, വലിയ മൂങ്ങ എന്നിവയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പക്ഷികളെ കൃത്യമായി തിരിച്ചറിയുക പ്രയാസമാണ്. ‘ചെറിയ മൂങ്ങ,’ ‘നീർക്കാക്ക,’ ‘വലിയ മൂങ്ങ’ എന്നിവ സാദ്ധ്യമായ പരമ്പരാഗതമോ പണ്ഡിതോചിതമോ ആയ പരിഭാഷകളാണ്. כוֹס എന്നതിന് ‘മൂങ്ങ’ അല്ലെങ്കിൽ ‘കൂമൻ,’ שָׁלָךְ എന്നതിന് ‘പെലിക്കൻ,’ יַנְשׁוּף എന്നതിന് ‘കൊമ്പൻമൂങ്ങ’ അല്ലെങ്കിൽ ‘കഴുകൻമൂങ്ങ’ എന്നീ പരിഭാഷകളും നിർദേശിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: ചെറിയ മൂങ്ങ
  rationale: ഇത് അശുദ്ധപക്ഷികളുടെ പട്ടികയിലെ ഒരു പ്രത്യേക പക്ഷിപ്പേരാണ്; കൃത്യമായ ഇനം അനിശ്ചിതമാണെങ്കിലും ‘ചെറിയ മൂങ്ങ’ എന്ന തിരിച്ചറിയൽ സാദ്ധ്യവും ആധുനിക വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: הַשָּׁלָךְ
  choice: നീർക്കാക്ക
  rationale: കൃത്യമായ പക്ഷിയിനം വിവാദവിധേയമാണ്. വെള്ളത്തിൽ മുങ്ങി ഇരപിടിക്കുന്ന പക്ഷിയെന്ന സാദ്ധ്യതയോട് യോജിക്കുന്ന, മലയാളത്തിൽ കോർമറന്റിന് സാധാരണ ഉപയോഗിക്കുന്ന പേരാണ് ‘നീർക്കാക്ക’.
- source_word: הַיַּנְשׁוּף
  choice: വലിയ മൂങ്ങ
  rationale: ഈ പദം രാത്രിഞ്ചരിയായ ഒരു വലിയ മൂങ്ങവർഗത്തെ സൂചിപ്പിക്കുന്നതായി പൊതുവെ കരുതപ്പെടുന്നു; കൃത്യമായ ആധുനിക ഇനം ഉറപ്പിക്കാതെ അതിന്റെ പ്രത്യേകത അറിയിക്കാൻ ‘വലിയ മൂങ്ങ’ ഉപയോഗിച്ചു.
- source_word: וְאֶת
  choice: എന്നിവയും
  rationale: ആവർത്തിച്ചുള്ള സംയോജകവും കർമചിഹ്നവും മുൻവാക്യത്തിൽ തുടരുന്ന പട്ടികയെ ഘടിപ്പിക്കുന്നു. മലയാളത്തിൽ ഓരോ ഇനത്തിനുമുമ്പും അത് യാന്ത്രികമായി ആവർത്തിക്കാതെ ‘എന്നിവയും’ എന്നു അവസാനിപ്പിക്കുന്നത് സ്വാഭാവികമായി പട്ടികയുടെ തുടർച്ച വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി സ്വീകരിച്ചു. പക്ഷികളുടെ കൃത്യമായ ജൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ ഉറപ്പില്ലാത്തതിനാൽ പ്രധാനപാഠത്തിൽ സാദ്ധ്യമായ പൊതുപേരുകളും അടിക്കുറിപ്പിൽ മറ്റ് നിർദേശങ്ങളും നൽകി.
