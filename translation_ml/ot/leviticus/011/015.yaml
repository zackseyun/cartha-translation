lexical_decisions:
- source_word: אֵת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നമാണ്; മലയാളത്തിൽ ഇതിന് വേറിട്ട പദം ആവശ്യമില്ല.
- source_word: כָּל
  choice: ഓരോന്നും
  rationale: ഏകവചനത്തിലുള്ള ഒരു കൂട്ടനാമത്തോടൊപ്പം വരുന്നതിനാൽ, ആ വർഗത്തിൽപ്പെടുന്ന എല്ലാറ്റിനെയും ഉൾക്കൊള്ളുന്ന വിതരണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֹרֵב
  choice: കാക്കവർഗം
  rationale: എബ്രായപദം സാധാരണയായി മലങ്കാക്കയെ സൂചിപ്പിച്ചാലും, ഇവിടെ കാക്ക–മലങ്കാക്ക കുടുംബത്തെ വിശാലമായി സൂചിപ്പിക്കാനിടയുണ്ട്. ആ സാധ്യത നിലനിർത്താൻ 'കാക്കവർഗം' തിരഞ്ഞെടുത്തു.
- source_word: לְמִינוֹ
  choice: അതതിന്റെ ഇനം അനുസരിച്ച്
  rationale: പുരോഹിതസാഹിത്യത്തിലെ വർഗീകരണസൂത്രം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആധുനിക ജീവശാസ്ത്രത്തിലെ കൃത്യമായ species എന്ന സാങ്കേതിക അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
