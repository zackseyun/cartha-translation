    text: 'അഥവാ: “അതതിന്റെ ഇനപ്രകാരം എല്ലാ കാക്കകളെയും.” എബ്രായപദം കാക്ക–മലങ്കാക്ക കുടുംബത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതാകാം; എങ്കിലും “മലങ്കാക്ക” എന്നതാണ് പതിവ് പരിഭാഷ.'
    reason: lexical_alternative
