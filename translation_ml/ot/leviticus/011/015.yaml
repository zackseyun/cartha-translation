  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ചുറ്റുമുള്ള നിരോധിത പക്ഷികളുടെ പട്ടികയിൽ ചേരുന്ന നാമപദശൈലി നിലനിർത്തിയിരിക്കുന്നു.
