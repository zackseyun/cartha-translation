id: LEV.15.17
reference: Leviticus 15:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל בֶּ֣גֶד וְ/כָל ע֔וֹר אֲשֶׁר יִהְיֶ֥ה עָלָ֖י/ו שִׁכְבַת זָ֑רַע וְ/כֻבַּ֥ס בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: ml
  text: ശുക്ലസ്രാവം പറ്റിയിരിക്കുന്ന ഏതു വസ്ത്രവും ഏതു തോൽവസ്തുവും[a] വെള്ളത്തിൽ കഴുകണം; അത് സന്ധ്യവരെ അശുദ്ധമായിരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “തോൽ”; ഇവിടെ മൃഗത്തോൽകൊണ്ടുള്ള ഒരു വസ്തുവായിരിക്കാം ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: “അത്” എന്നത് വസ്ത്രത്തിനോ തോൽവസ്തുവിനോ ബാധകമാണ്; അശുദ്ധി ഇവിടെ ആചാരപരമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: referent_clarity
lexical_decisions:
- source_word: בֶּגֶד
  choice: വസ്ത്രം
  rationale: വസ്ത്രത്തിനെയോ ധരിക്കുന്ന തുണിയെയോ സൂചിപ്പിക്കുന്ന പൊതുവായ പദം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: עוֹר
  choice: തോൽവസ്തു
  rationale: മൂലപദം ‘തോൽ’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ മൃഗത്തോൽകൊണ്ടുള്ള ഒരു വസ്തുവാകാനാണ് സാധ്യത. ‘തോൽവസ്തു’ ആ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു, എന്നാൽ അടിക്കുറിപ്പിൽ അക്ഷരാർഥം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: പുരണ്ടിട്ടുള്ള
  rationale: ‘അതിന്റെമേൽ ഉണ്ടായിരിക്കുന്ന’ എന്ന സ്ഥാനസൂചന മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שִׁכְבַת זָרַע
  choice: ശുക്ലസ്രാവം
  rationale: ഈ പ്രയോഗം പുറത്തുവന്ന ശുക്ലത്തെ സൂചിപ്പിക്കുന്നു. ‘ശുക്ലസ്രാവം’ വ്യക്തവും മാന്യവും സന്ദർഭോചിതവുമായ ആധുനിക പ്രയോഗമാണ്.
- source_word: וְכֻבַּס
  choice: കഴുകണം
  rationale: നിയമനിർദേശത്തിന്റെ ബാധ്യത മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; കർമണിപ്രയോഗം നിർബന്ധമാക്കാതെ മൂലത്തിലെ നിയമബലം നിലനിർത്തുന്നു.
- source_word: בַּמַּיִם
  choice: വെള്ളത്തിൽ
  rationale: ബְּ എന്ന ഉപസർഗത്തിന്റെ മാധ്യമ/സ്ഥലാർഥം ഇവിടെ സ്വാഭാവിക മലയാളത്തിൽ ‘വെള്ളത്തിൽ കഴുകണം’ എന്നു നൽകാം.
- source_word: וְטָמֵא
  choice: അശുദ്ധമായിരിക്കും
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ ശുദ്ധി-അശുദ്ധി വിഭാഗം സൂചിപ്പിക്കുന്നു; ധാർമിക കുറ്റബോധം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: കാലപരിധി ലളിതവും കൃത്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ലേവ്യശുദ്ധിനിയമത്തിലെ ‘അശുദ്ധി’യുടെ സ്വഭാവം
  choice: טָמֵא എന്നത് ‘അശുദ്ധം’ എന്നു നൽകി ആചാരപരമായ വിഭാഗം നിലനിർത്തി.
  alternative: ‘മലിനം’ അല്ലെങ്കിൽ ധാർമിക കുറ്റം സൂചിപ്പിക്കുന്ന വിശദീകരണം
  rationale: ലേവ്യപുസ്തകം 15-ൽ ഇത് ആചാരപരമായ അശുദ്ധിയാണ്; വ്യക്തിപരമായ പാപമോ ധാർമിക കുറ്റമോ എന്ന് വാക്യം പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ശരീരസ്രാവത്തെ വ്യക്തമായി പറയുമ്പോഴും അനാവശ്യമായ വൈദ്യസാങ്കേതികത ഒഴിവാക്കി. നിയമശൈലി സ്വാഭാവികമാക്കാൻ ‘കഴുകണം’ ഉപയോഗിച്ചു.
