  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: ml
  text: 'ഇതാണ് സ്രവമുള്ളവനെയും, ശുക്ലസ്രാവം പുറപ്പെടുന്നതിനാൽ അശുദ്ധനാകുന്നവനെയും സംബന്ധിച്ചുള്ള നിയമം:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: ഇതാണ് ... സംബന്ധിച്ചുള്ള നിയമം
  rationale: സംഗ്രഹനിയമം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ നൽകിയിരിക്കുന്നു.
- source_word: הַזָּב
  choice: സ്രവമുള്ളവൻ
  rationale: ശരീരസ്രവം ബാധിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്തനാമത്തിന്റെ സംക്ഷിപ്തവും വ്യക്തവുമായ പരിഭാഷ.
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זֶרַע
  choice: ശുക്ലസ്രാവം ഉണ്ടാകുന്നവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവനിൽനിന്ന് ശുക്ലസ്രാവം പുറപ്പെടുന്നവൻ’; മലയാളത്തിൽ ശരീരപ്രക്രിയയെ വ്യക്തമായും മാന്യമായും അറിയിക്കാൻ ‘ഉണ്ടാകുന്നവൻ’ സ്വാഭാവികമാണ്.
- source_word: לְטָמְאָה בָהּ
  choice: അതിനാൽ അശുദ്ധനാകുന്ന
  rationale: ഇവിടെ לְ രൂപം ഫലമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ സ്രാവം മൂലമുണ്ടാകുന്ന ആചാരപരമായ അശുദ്ധിയുടെ ഫലം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: അശുദ്ധൻ
  alternative: മലിനൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ טמא ആചാരപരമായ നിലയെ സൂചിപ്പിക്കുന്നു; ‘അശുദ്ധൻ’ അതിനെ നൈതികപാപമായി വ്യാഖ്യാനിക്കാതെ പരമ്പരാഗതവും വ്യക്തവുമായ പദമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; നിയമസംഗ്രഹത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് ശരീരസംബന്ധമായ പദങ്ങൾ വ്യക്തവും മാന്യവുമായി നൽകിയിരിക്കുന്നു.
