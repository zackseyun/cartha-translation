id: LEV.15.28
reference: Leviticus 15:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִֽם טָהֲרָ֖ה מִ/זּוֹבָ֑/הּ וְ/סָ֥פְרָה לָּ֛/הּ שִׁבְעַ֥ת יָמִ֖ים וְ/אַחַ֥ר תִּטְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: ml
  text: എന്നാൽ അവൾ തന്റെ സ്രവത്തിൽനിന്ന് ശുദ്ധയായാൽ[a], അവൾ തനിക്കുവേണ്ടി ഏഴു ദിവസം എണ്ണണം; അതിനുശേഷം അവൾ ശുദ്ധയായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾ തന്റെ സ്രവത്തിൽനിന്ന് ശുദ്ധയായാൽ ... അതിനുശേഷം അവൾ ശുദ്ധയാകും.” സ്രവത്തിൽനിന്നു ശുദ്ധയാകുന്നതും അതിനുശേഷമുള്ള ആചാരപരമായ ശുദ്ധസ്ഥാനവും സൂചിപ്പിക്കാൻ ഹീബ്രു ഒരേ പദമൂലമാണ് ഉപയോഗിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ആയാൽ
  rationale: മുൻവിവരിച്ച അവസ്ഥയോടുള്ള വ്യത്യാസവും നിബന്ധനയും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: טָהֲרָה מִזּוֹבָהּ
  choice: അവളുടെ സ്രവം നിലച്ച് അവൾ ശുദ്ധയായാൽ
  rationale: ഹീബ്രു טהר എന്ന ക്രിയയുടെ ശുദ്ധി-അർത്ഥം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ ആദ്യം ഉദ്ദേശിക്കുന്നത് സ്രവത്തിന്റെ നിലച്ചുപോകലാണെന്ന് വ്യക്തമാക്കുന്നു; ‘സ്രവം’ זוֹב എന്ന ശരീരസ്രവത്തെ മാന്യവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְסָפְרָה לָּהּ
  choice: അവൾ തനിക്കുവേണ്ടി ... എണ്ണണം
  rationale: לָּהּ എന്ന ദാതൃസർവനാമം ‘തനിക്കുവേണ്ടി’ എന്നു നിലനിർത്തുകയും നിയമനിർദേശത്തിന്റെ ബലം ‘എണ്ണണം’ എന്നു സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: സംഖ്യയും കാലയളവും നേരിട്ട്, സാധാരണ മലയാളക്രമത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וְאַחַר
  choice: അതിനുശേഷം
  rationale: ഏഴുദിവസത്തെ എണ്ണലിനു ശേഷമുള്ള അടുത്ത ഘട്ടം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: תִּטְהָר
  choice: അവൾ ശുദ്ധയായിരിക്കും
  rationale: കാലയളവ് പൂർത്തിയായശേഷം ലഭിക്കുന്ന ആചാരപരമായ ശുദ്ധസ്ഥിതി സൂചിപ്പിക്കുന്നു; ആദ്യപ്രയോഗത്തിലെ സ്രവം നിലയ്ക്കുന്നതും അവസാനത്തെ ശുദ്ധസ്ഥാനവും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആചാരപരമായ ശുദ്ധിയുടെ പദപ്രയോഗം
  choice: ‘ശുദ്ധ’ എന്ന പദം ആചാരപരമായ നിലയെ സൂചിപ്പിക്കുന്നവിധം ഉപയോഗിച്ചു.
  alternative: ‘നിർമല’ / ‘ശുദ്ധീകരിക്കപ്പെട്ട’
  rationale: ലേവ്യപുസ്തകം 15-ലെ വിഷയം ശരീരസ്രവവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ നിലയാണ്; ധാർമിക കുറ്റമോ പാപമോ ഇവിടെ സൂചിപ്പിക്കുന്നില്ല. അതിനാൽ മലയാളത്തിൽ പരിചിതമായ ‘ശുദ്ധ’ നിലനിർത്തി, അടിക്കുറിപ്പിൽ അർത്ഥപരിധി വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരമായ നിർദേശഭാവം ‘എണ്ണണം’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; ‘ശുദ്ധ’ എന്നത് ധാർമികമല്ല, ആചാരപരമായ അർത്ഥത്തിലാണ്.
