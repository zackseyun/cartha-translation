id: LEV.15.7
reference: Leviticus 15:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נֹּגֵ֖עַ בִּ/בְשַׂ֣ר הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ml
  text: സ്രവമുള്ള പുരുഷന്റെ മാംസത്തിൽ തൊടുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും വെള്ളത്തിൽ കുളിക്കുകയും വേണം[a]; അവൻ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്രവമുള്ള പുരുഷന്റെ ശരീരത്തിൽ.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘സ്രവമുള്ളവന്റെ മാംസത്തിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: തൊടുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപസർഗത്തോടുകൂടിയ കൃതന്തം പൊതുവായ നിയമവിഷയമായി ‘തൊടുന്നവൻ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בִּבְשַׂר
  choice: മാംസത്തിൽ
  rationale: בָּשָׂר എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘മാംസം’ നിലനിർത്തുന്നു; ഇവിടെ അത് വ്യക്തിയുടെ ശരീരത്തെ സൂചിപ്പിക്കാനും കഴിയും.
- source_word: הַזָּב
  choice: സ്രവമുള്ള പുരുഷൻ
  rationale: സന്ദർഭത്തിലെ അസാധാരണ ശാരീരിക സ്രവമുള്ള പുരുഷനെ പുൽലിംഗ ഏകവചനരൂപത്തിന് അനുസരിച്ച് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും വേണം
  rationale: വസ്ത്രങ്ങൾ കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയെ ആധുനിക മലയാളത്തിലെ നിയമനിർദേശ ശൈലിയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְרָחַץ בַּמַּיִם
  choice: വെള്ളത്തിൽ കുളിക്കുകയും വേണം
  rationale: ഈ സന്ദർഭത്തിൽ ശരീരം കഴുകുന്നതാണ് ഉദ്ദേശ്യം; ‘വെള്ളത്തിൽ കുളിക്കുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וְטָמֵא
  choice: അശുദ്ധനായിരിക്കും
  rationale: ധാർമിക കുറ്റമല്ല, ആചാരപരമായ അശുദ്ധിയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ലേവ്യപുസ്തകത്തിലെ പ്രയോഗത്തിന് ‘അശുദ്ധൻ’ യോജിക്കുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: അശുദ്ധിയുടെ കാലപരിധി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: ടָמֵא എന്നത് ആചാരപരമായ ‘അശുദ്ധൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: മലിനൻ; അശൗചമുള്ളവൻ
  rationale: ലേവ്യപുസ്തകം 15-ൽ ഇത് ഇസ്രായേലിന്റെ ശുദ്ധിനിയമങ്ങളിലെ ആചാരസ്ഥിതിയാണ്; സ്പർശം സ്വതവേ ധാർമികപാപമാണെന്ന ആശയം ചേർക്കാതിരിക്കാൻ ‘അശുദ്ധൻ’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമനിർദേശ ശൈലി. ‘മാംസം’ എന്ന അക്ഷരാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സന്ദർഭസഹജമായ ‘ശരീരം’ അടിക്കുറിപ്പിൽ നൽകി.
