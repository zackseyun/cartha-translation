id: LEV.15.18
reference: Leviticus 15:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִשָּׁ֕ה אֲשֶׁ֨ר יִשְׁכַּ֥ב אִ֛ישׁ אֹתָ֖/הּ שִׁכְבַת זָ֑רַע וְ/רָחֲצ֣וּ בַ/מַּ֔יִם וְ/טָמְא֖וּ עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: ml
  text: ഒരു പുരുഷൻ ഒരു സ്ത്രീയോടുകൂടെ ശയിക്കുകയും ശുക്ലസ്രാവം ഉണ്ടാകുകയും ചെയ്താൽ, ഇരുവരും വെള്ളത്തിൽ കുളിക്കണം; സന്ധ്യവരെ അവർ അശുദ്ധരായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, സന്ധ്യവരെ ആചാരപരമായി അശുദ്ധരായിരിക്കും.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר יִשְׁכַּב אִישׁ אֹתָהּ
  choice: ഒരു പുരുഷൻ ഒരു സ്ത്രീയോടുകൂടെ ശയിക്കുകയും ... ചെയ്താൽ
  rationale: നിയമസന്ദർഭത്തിലെ സോപാധിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ചെയ്താൽ’ എന്നു നൽകി; ‘കൂടെ ശയിക്കുക’ എന്നത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ മാന്യവും വ്യക്തവുമായ സമാനപ്രയോഗമാണ്.
- source_word: שִׁכְבַת זָרַע
  choice: ശുക്ലസ്രാവം
  rationale: ഈ ഘടന ഇവിടെ പ്രത്യേകമായി വീര്യസ്രാവത്തെ സൂചിപ്പിക്കുന്നു; ‘ശുക്ലസ്രാവം’ കൃത്യവും ആധുനിക മലയാളത്തിൽ മനസ്സിലാകുന്നതുമായ പദമാണ്.
- source_word: וְרָחֲצוּ בַמַּיִם
  choice: ഇരുവരും വെള്ളത്തിൽ കുളിക്കണം
  rationale: ബഹുവചനക്രിയ ഇരുപങ്കാളികളെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇരുവരും’ എന്നു വ്യക്തമാക്കി. רחץ എന്നത് കഴുകുക/കുളിക്കുക എന്നർഥമുള്ളതിനാൽ ഈ ശരീരശുദ്ധീകരണസന്ദർഭത്തിൽ ‘കുളിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: וְטָמְאוּ
  choice: അവർ അശുദ്ധരായിരിക്കും
  rationale: ധാർമിക കുറ്റബോധം ചേർക്കാതെ ലേവ്യപുസ്തകത്തിലെ താൽക്കാലിക ആചാരപരമായ അശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: എബ്രായത്തിലെ സമയപരിധി സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലേവ്യശുദ്ധിനിയമത്തിലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: മുഖ്യവാചകത്തിൽ ‘അശുദ്ധർ’ എന്നു മാത്രം നൽകുകയും ആചാരപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
  alternative: ‘ആചാരപരമായി അശുദ്ധർ’ എന്ന് മുഖ്യവാചകത്തിൽ നൽകുക.
  rationale: ടָמֵא എന്ന പദത്തിൽ ഇല്ലാത്ത ധാർമിക പാപബോധം ചേർക്കാതെയും അതിന്റെ നിയമ-ആചാരസന്ദർഭം വായനക്കാരനു വ്യക്തമാക്കിയും മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ലൈംഗികപ്രവൃത്തിയും ശരീരസ്രാവവും മറച്ചുവയ്ക്കാതെ, അശ്ലീലമാകാത്ത നിയമഭാഷയിലാണ് നൽകിയിരിക്കുന്നത്.
