id: LEV.15.1
reference: Leviticus 15:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യാഹ്‌വെ[a] മോശെയോടും അഹരോനോടും പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വയ്യക്ഷേപക ക്രിയാരൂപം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു നൽകി. ദൈവത്തിന്റെ ഗൗരവമുള്ള സംസാരത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകി.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന אֶל എന്ന മുൻപ്രത്യയത്തിന്റെ അർഥം ഇരുവരിലേക്കുമുള്ള അഭിസംബോധനയായി സ്വാഭാവിക മലയാളത്തിലെ ‘-ഓടും ... -ഓടും’ ഘടനയിൽ നിലനിർത്തി.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തു:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന സൂത്രപ്രയോഗമാണിത്. മലയാളത്തിൽ വാക്യാവസാനത്തെ ദ്വിബിന്ദു അതിന്റെ പ്രവർത്തനം വ്യക്തമായി നിർവഹിക്കുന്നതിനാൽ വേറിട്ട് ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർത്തില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള വായനക്കാർക്കു സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി; ഉച്ചാരണത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പേരുകൾക്ക് മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ ‘മോശ’, ‘അഹരോൻ’, ‘യഹോവ’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു. לֵאמֹר എന്നതിന്റെ പ്രഭാഷണ-പരിചയപ്പെടുത്തൽ പ്രവർത്തനം ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
