  rationale: The revision aligns the divine-name rendering with the stated POB policy, regularizes the inflection of മോശെ, and uses an idiomatic modern Malayalam speech formula while preserving the Hebrew sequence, the two named recipients, and the forward-pointing function of לֵאמֹר.
