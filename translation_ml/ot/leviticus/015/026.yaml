source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: ml
  text: അവളുടെ സ്രവം തുടരുന്ന എല്ലാ ദിവസങ്ങളിലും, അവൾ കിടക്കുന്ന ഏതു കിടക്കയും അവൾക്ക് അവളുടെ ആർത്തവകാലത്തെ കിടക്കയെപ്പോലെയായിരിക്കും[a]; അവൾ ഇരിക്കുന്ന ഏതു വസ്തുവും[b] അവളുടെ ആർത്തവകാലത്തെ അശുദ്ധിയെപ്പോലെ അശുദ്ധമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആർത്തവകാലം” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ആർത്തവാവസ്ഥയെയും അതോടനുബന്ധിച്ച ആചാരപരമായ വേർതിരിവിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “വസ്തു” എന്നത് പാത്രം മാത്രമല്ല, അവൾ ഇരിക്കുന്ന ഏതു സാമാനവും ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: കിടക്ക
  rationale: കിടക്കുന്ന സ്ഥലത്തെയോ വിരിപ്പിനെയോ സൂചിപ്പിക്കുന്നു; ഈ ആചാരപരമായ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: അവളുടെ സ്രവമുള്ള ദിവസങ്ങളിലൊക്കെയും
  rationale: זוֹבָהּ ഈ അധ്യായത്തിൽ ശരീരസ്രവത്തെ സൂചിപ്പിക്കുന്നു; ‘സ്രവം’ വൈദ്യപരമായി വ്യക്തവും അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാത്തതുമാണ്.
- source_word: נִדָּתָהּ
  choice: അവളുടെ ആർത്തവകാലം
  rationale: ഇവിടെ സ്ത്രീയുടെ മാസികാവസ്ഥയും അതോടനുബന്ധിച്ച ആചാരപരമായ വേർതിരിവുമാണ് ഉദ്ദേശ്യം; മുഖ്യവാചകത്തിൽ ‘ആർത്തവകാലം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יִהְיֶה לָּהּ
  choice: അവൾക്കായിരിക്കും
  rationale: അവളോടുള്ള ബന്ധത്തിൽ അതിന്റെ ആചാരപരമായ നിലയെയോ വർഗീകരണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: כְּלִי
  choice: വസ്തു
  rationale: כְּלִי പാത്രത്തിൽ മാത്രം ഒതുങ്ങാതെ ഉപകരണം, സാമാനം, ഇരിക്കാവുന്ന വസ്തു എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്; മലയാളത്തിലെ ‘പാത്രം’ ഇവിടെ അനാവശ്യമായി അർത്ഥം ചുരുക്കും.
- source_word: טָמֵא / טֻמְאָה
  choice: അശുദ്ധം / അശുദ്ധി
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ ശുദ്ധിനിയമങ്ങളുടെ സാങ്കേതിക ഭാഷ വ്യക്തമാക്കുന്ന പതിവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: טָמֵא / טֻמְאָה എന്നിവ ‘അശുദ്ധം / അശുദ്ധി’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: അശുചി / അശുചിത്വം
  rationale: ഇവിടെ വ്യക്തിപരമായ പാപമോ ധാർമ്മിക കുറ്റമോ അല്ല, ഇസ്രായേലിന്റെ ശുദ്ധിനിയമപ്രകാരമുള്ള ആചാരപരമായ നിലയാണ് പരാമർശിക്കുന്നത്.
- issue: נִדָּה എന്ന പദത്തിന്റെ അവതരണം
  choice: മുഖ്യവാചകത്തിൽ ‘ആർത്തവകാലം’
  alternative: ആർത്തവ അശുദ്ധിയുടെ കാലം; ആർത്തവം
  rationale: സന്ദർഭത്തിലെ ശരീരാവസ്ഥ വ്യക്തമായി അറിയിക്കുമ്പോഴും ‘അശുദ്ധി’ എന്ന ആശയം താരതമ്യത്തിന്റെ അവസാനഭാഗത്ത് പ്രത്യേകം നിലനിർത്തുന്നു; നിദ്ദാ എന്ന പദത്തിലെ ആചാരപരമായ വേർതിരിവിന്റെ ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. ‘സ്രവം’, ‘ആർത്തവകാലം’ എന്നീ പദങ്ങൾ ശരീരാവസ്ഥയെ വ്യക്തമായി പറയുന്നു; ‘അശുദ്ധി’ ആചാരപരമായ സാങ്കേതിക അർത്ഥത്തിലാണ്. എബ്രായത്തിലെ ആവർത്തനവും താരതമ്യഘടനയും കഴിയുന്നത്ര നിലനിർത്തി.
