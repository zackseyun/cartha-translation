source:
  edition: WLC
  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ml
  text: സ്രവമുള്ള പുരുഷൻ ഇരുന്ന വസ്തുവിൽ[a] ഇരിക്കുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകുകയും വെള്ളത്തിൽ കുളിക്കുകയും വേണം; അവൻ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വസ്തു’ എന്നതിന് ‘പാത്രം,’ ‘ഉപകരണം,’ അല്ലെങ്കിൽ ‘സാധനം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദത്തിന് വിശാലമായ അർത്ഥപരിധിയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: ഇരിക്കുന്നവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ വർത്തമാനകൃത് രൂപത്തിന്റെ പൊതുവായ നിയമപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַכְּלִי
  choice: വസ്തു
  rationale: כְּלִי പാത്രം, ഉപകരണം, സാമഗ്രി, വസ്തു എന്നിവയെ സൂചിപ്പിക്കാവുന്ന വിശാലപദമാണ്; ഇവിടെ ഇരിക്കാവുന്ന ഏതൊരു വസ്തുവും ഉദ്ദേശിക്കാവുന്നതിനാൽ ‘വസ്തു’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: ഇരുന്ന വസ്തുവിന്മേൽ
  rationale: സ്രവമുള്ള പുരുഷൻ മുമ്പ് അതിന്മേൽ ഇരുന്നതിലൂടെ വസ്തുവിനെ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַזָּב
  choice: സ്രവമുള്ള പുരുഷൻ
  rationale: ഈ ഭാഗം പുരുഷന്റെ ശാരീരിക സ്രവത്തെക്കുറിച്ചാണ്; എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചന സൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ കഴുകുകയും
  rationale: വസ്ത്രങ്ങൾ കഴുകുക എന്ന നിയമനിർദേശം കൃത്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וְרָחַץ בַּמַּיִם
  choice: വെള്ളത്തിൽ കുളിക്കുകയും
  rationale: ശുദ്ധിനിയമസന്ദർഭത്തിൽ ശരീരം വെള്ളത്തിൽ കഴുകുന്നതാണ് അർത്ഥം; ‘കുളിക്കുക’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: സന്ധ്യവരെ അയാൾ അശുദ്ധനായിരിക്കും
  rationale: സമ്പർക്കത്തെത്തുടർന്നുള്ള അശുദ്ധാവസ്ഥയും അതിന്റെ സമയപരിധിയും നിയമഭാവത്തോടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അശുദ്ധതയുടെ സ്വഭാവം
  choice: ‘അശുദ്ധൻ’ എന്ന് ലളിതമായി വിവർത്തനം ചെയ്തു
  alternative: ‘ആചാരപരമായി അശുദ്ധൻ’ അല്ലെങ്കിൽ ‘മലിനൻ’
  rationale: സന്ദർഭം ലേവ്യ ശുദ്ധിനിയമങ്ങളുടേതാണ്; ഇത് ധാർമിക കുറ്റമാണെന്ന് സൂചിപ്പിക്കാതെ മൂലത്തിലെ പദം നിലനിർത്തുന്നു. ‘ആചാരപരമായി’ എന്നത് വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലായിരിക്കും.
- issue: הַזָּב എന്നതിലെ ലിംഗസൂചന
  choice: ‘സ്രവമുള്ള പുരുഷൻ’ എന്ന് വ്യക്തമായി നൽകി
  alternative: ‘സ്രവമുള്ളയാൾ’
  rationale: ലേവ്യപുസ്തകം 15:2–15-ലെ വിഷയം പുരുഷന്റെ സ്രവമാണ്; എബ്രായ പുല്ലിംഗസൂചന മായ്ച്ചുകളയാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ. ‘വേണം’ നിർദേശത്തെ വ്യക്തമാക്കുന്നു; ‘അശുദ്ധൻ’ ധാർമിക കുറ്റം അനാവശ്യമായി ചുമത്താതെ ശുദ്ധിനിയമത്തിലെ നിലയെ സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് സൂചിക പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
