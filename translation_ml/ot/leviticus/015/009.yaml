source:
  edition: WLC
  text: וְ/כָל הַ/מֶּרְכָּ֗ב אֲשֶׁ֨ר יִרְכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/009.yaml
  text: And every saddle on which the man with the discharge rides shall be unclean[a].
translation:
  language: ml
  text: സ്രവമുള്ളവൻ കയറുന്ന ഏതു സവാരിവസ്തുവും അശുദ്ധമായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ കയറുന്ന ഏതു വസ്തുവും’; എബ്രായപദം ഇടുങ്ങിയ അർത്ഥത്തിൽ ‘ജീനി’യെ മാത്രമല്ല, കയറുന്ന വസ്തുവിനെ കൂടുതൽ വിശാലമായും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: ഓരോ
  rationale: כָּל എന്നതിന്റെ വിതരണാത്മകമായ സമഗ്രത ‘ഓരോ’ സ്വാഭാവികമായി നൽകുന്നു; വാക്യം മുൻനിയമത്തിന്റെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ പ്രത്യേകമായ ‘കൂടാതെ’ ചേർക്കാതെയും ബന്ധം വ്യക്തമാകുന്നു.
- source_word: הַ/מֶּרְכָּב
  choice: സവാരിയുപകരണം
  rationale: מֶרְכָּב എന്നത് കയറിസഞ്ചരിക്കുന്ന വസ്തുവിനെ വിശാലമായി സൂചിപ്പിക്കാം. ‘ജീനി’ എന്നു മാത്രം ചുരുക്കാതെ, സന്ദർഭത്തിന് യോജിച്ച വിശാല അർത്ഥം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: കയറുന്ന
  rationale: ‘അതിന്റെമേൽ അവൻ കയറുന്നു’ എന്ന ബന്ധവാക്യത്തിന്റെ അർത്ഥം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַ/זָּב
  choice: സ്രവമുള്ളവൻ
  rationale: പുരുഷലിംഗത്തിലുള്ള substantivized participle-ന്റെ അർത്ഥം നിലനിർത്തുന്നു; അധ്യായത്തിന്റെ സന്ദർഭത്തിൽ ശരീരസ്രവമുള്ള പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יִטְמָא
  choice: അശുദ്ധമായിരിക്കും
  rationale: നിയമപരവും ആചാരപരവുമായ അശുദ്ധസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു; ധാർമിക കുറ്റബോധം അനാവശ്യമായി ഉൾപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ അശുദ്ധതാഭാഷയുടെ സ്വഭാവം
  choice: טמא എന്നത് ആചാരപരവും നിയമപരവുമായ അർത്ഥത്തിൽ ‘അശുദ്ധം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: മലിനം; ദൂഷിതം
  rationale: ഈ വാക്യം ശരീരസ്രവവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധതയെക്കുറിച്ചാണ്; വ്യക്തിപരമായ പാപമോ ധാർമിക ദുഷ്ടതയോ ഇതിൽ സ്വതവേ സൂചിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ലേവ്യനിയമങ്ങളുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഭാഷ ഉപയോഗിച്ചു. ‘സവാരിയുപകരണം’ അല്പം സാങ്കേതികമാണെങ്കിലും എബ്രായപദത്തിന്റെ വിശാലത കൃത്യമായി സംരക്ഷിക്കുന്നു.
