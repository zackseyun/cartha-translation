id: LEV.15.14
reference: Leviticus 15:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: ml
  text: എട്ടാം ദിവസം അവൻ തനിക്കുവേണ്ടി രണ്ടു കുറുപ്രാവുകളെയോ രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങളെയോ എടുത്ത്, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ യഹ്‌വെയുടെ[a] സന്നിധിയിൽ വന്ന് അവയെ പുരോഹിതനു കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: YHWH; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു. ദൈവനാമത്തിന്റെ പുരാതന ഉച്ചാരണം ഉറപ്പില്ല; ‘യഹ്‌വെ’ എന്നത് വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട പുനർനിർമിത ഉച്ചാരണമാണ്.'
    reason: ദൈവനാമത്തിന്റെ രൂപവും ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: എട്ടാം ദിവസം
  rationale: മുൻവാക്യത്തിലെ ശുദ്ധീകരണക്രമത്തിന്റെ തുടർച്ച സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ, ഹീബ്രു സംയോജകത്തെ നിർബന്ധമായി ‘അപ്പോൾ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ നടപടിയുടെ സമയമായി അവതരിപ്പിക്കുന്നു.
- source_word: יִקַּח לוֹ
  choice: അവൻ തനിക്കുവേണ്ടി ... എടുത്ത്
  rationale: לוֹ എന്ന ദത്തിവാചക സർവനാമം വഴിപാടുകാരൻ പക്ഷികളെ തനിക്കുവേണ്ടി സമ്പാദിക്കുന്നുവെന്ന ആശയം നിലനിർത്തുന്നു; നിയമനിർദേശത്തിന്റെ ബലം അവസാനത്തെ ‘കൊടുക്കണം’ എന്ന ക്രിയയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: שְׁתֵּי תֹרִים
  choice: രണ്ടു കുറുപ്രാവുകൾ
  rationale: תֹרִים എന്നത് ബലിക്കായി ഉപയോഗിച്ചിരുന്ന turtledoves-നെ സൂചിപ്പിക്കുന്നു; ‘കുറുപ്രാവ്’ മലയാളത്തിൽ പരിചിതവും ഇനവ്യത്യാസം നിലനിർത്തുന്നതുമായ പദമാണ്.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: അല്ലെങ്കിൽ രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങൾ
  rationale: അക്ഷരാർഥമായ ‘പ്രാവിന്റെ മക്കൾ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ ‘പ്രാവിൻകുഞ്ഞുങ്ങൾ’ എന്നു നൽകുന്നു.
- source_word: וּבָא לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ വന്ന്
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യാർഥം ‘സന്നിധിയിൽ’ എന്നു വ്യക്തമായി നൽകുന്നു; നിയമക്രമത്തിൽ തുടർന്നുവരുന്ന പ്രവൃത്തിയായി וּבָא വിവർത്തനം ചെയ്യുന്നു.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: פֶּתַח എന്നത് പ്രവേശനസ്ഥലം/കവാടം എന്നർഥമുള്ളതിനാൽ വ്യക്തമായ മലയാളം ഉപയോഗിക്കുന്നു; אֹהֶל מוֹעֵד എന്ന സ്ഥിരപ്രയോഗത്തിന് ‘സമാഗമകൂടാരം’ നിലനിർത്തുന്നു.
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: അവയെ പുരോഹിതനു കൊടുക്കണം
  rationale: נתן എന്നതിന്റെ നേരിട്ടുള്ള കൈമാറ്റാർഥം ‘കൊടുക്കുക’ നിലനിർത്തുന്നു; നിയമനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം ‘കൊടുക്കണം’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലുള്ള നാലക്ഷര ദൈവനാമം ഒരു പദവിയായി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു. ഉച്ചാരണത്തെക്കുറിച്ചുള്ള ചരിത്രപരമായ അനിശ്ചിതത്വവും പരമ്പരാഗത പ്രതിപാദനവും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശശൈലി. ദീർഘമായ ഹീബ്രു വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാശൃംഖലയായി നൽകി; ബലിപദങ്ങളുടെ വ്യത്യാസവും ദൈവനാമവും സംരക്ഷിച്ചു.
