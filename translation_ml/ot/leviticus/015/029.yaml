revisions:
- from: എട്ടാം ദിവസം അവൾ തനിക്കുവേണ്ടി രണ്ടു ചെങ്ങാലികളെയോ രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങളെയോ എടുത്ത്, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽ[a] പുരോഹിതന്റെ അടുക്കൽ അവയെ കൊണ്ടുവരണം.
  to: എട്ടാം ദിവസം അവൾ തനിക്കുവേണ്ടി രണ്ട് ചങ്ങാലപ്പക്ഷികളെയോ രണ്ട് പ്രാവിൻകുഞ്ഞുങ്ങളെയോ എടുക്കണം; അവയെ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കലുള്ള പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം.
  rationale: വാക്യത്തിലെ ലക്ഷ്യബന്ധം വ്യക്തമാക്കാൻ പുരോഹിതനെ ‘സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കലുള്ള’വൻ എന്നു ക്രമപ്പെടുത്തി. മുഖ്യവാചകത്തിൽ സ്ഥാനസൂചനയാക്കി സ്വാഭാവികമാക്കിയ രണ്ടാമത്തെ ഹീബ്രു אֶל-നെ അടിക്കുറിപ്പിൽ ഔപചാരികമായ വികല്പമായി നിലനിർത്തി. മറ്റ് ആശയങ്ങളോ ആചാരാർഥങ്ങളോ മാറ്റിയിട്ടില്ല.
