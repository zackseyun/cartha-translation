  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י תִּֽקַּֽח לָ/הּ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וְ/הֵבִיאָ֤ה אוֹתָ/ם֙ אֶל הַ/כֹּהֵ֔ן אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/029.yaml
  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: ml
  text: എട്ടാം ദിവസം അവൾ തനിക്കുവേണ്ടി രണ്ട് ചങ്ങാലപ്പക്ഷികളെയോ രണ്ട് പ്രാവിൻകുഞ്ഞുങ്ങളെയോ എടുക്കണം; അവയെ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കലുള്ള പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: എട്ടാം ദിവസം
  rationale: നിയമനിർദേശത്തിന്റെ തുടർച്ച സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ വാവിനെ പ്രത്യേകം ‘എന്നിട്ട്’ എന്നു ചേർക്കാതെ, കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി.
- source_word: תִּקַּח לָהּ
  choice: അവൾ തനിക്കുവേണ്ടി ... എടുത്ത്
  rationale: לָהּ എന്ന ഗുണഭോക്തൃ/പ്രത്യാവർത്തക ഭാവം ‘തനിക്കുവേണ്ടി’ എന്നു നിലനിർത്തി; തുടർന്നുള്ള കൊണ്ടുവരൽ നിർദേശവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: שְׁתֵּי תֹרִים
  choice: രണ്ടു ചെങ്ങാലികൾ
  rationale: תֹרִים യാഗത്തിനുപയോഗിച്ചിരുന്ന turtledoves-നെ സൂചിപ്പിക്കുന്നു; ആ പക്ഷിയെ മലയാളത്തിൽ തിരിച്ചറിയിക്കുന്ന സാധാരണ പദമായി ‘ചെങ്ങാലി’ ഉപയോഗിച്ചു.
- source_word: אוֹ
  choice: -യോ ... -യോ
  rationale: അനുവദിക്കപ്പെട്ട രണ്ടു വഴികളിലുള്ള തിരഞ്ഞെടുപ്പ് മലയാളത്തിലെ സ്വാഭാവിക വികല്പഘടനയിലൂടെ വ്യക്തമാക്കി.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങൾ
  rationale: ‘പ്രാവിന്റെ മക്കൾ’ എന്ന അക്ഷരാർഥത്തിനുപകരം, ചെറുപ്പമായ പ്രാവുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: וְהֵבִיאָה אֹתָם
  choice: അവയെ കൊണ്ടുവരണം
  rationale: നിയമപരമായ നിർദേശഭാവം ‘വരണം’ ഉപയോഗിച്ച് വ്യക്തമാക്കി; ബഹുവചന നിർജീവ കർമത്തിന് ‘അവയെ’ യോജിക്കുന്നു.
- source_word: אֶל הַכֹּהֵן
  choice: പുരോഹിതന്റെ അടുക്കൽ
  rationale: നിർദിഷ്ട ആചാരനിർവാഹകനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു നിർദേശകഘടകത്തിന്റെ ഭാവം സന്ദർഭത്തിൽ വ്യക്തമാണ്; മലയാളത്തിൽ ‘പുരോഹിതന്റെ അടുക്കൽ’ സ്വാഭാവികമാണ്.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽ
  rationale: פֶּתַח എന്നത് പ്രവേശനസ്ഥലമാണ്; രണ്ടാമത്തെ אֶל-നെ സ്ഥലസൂചകമായി ഗ്രഹിക്കുന്നത് ലക്ഷ്യസ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. אֹהֶל מוֹעֵד-ന് സ്ഥിരവും അർഥസമ്പന്നവുമായ ‘സമാഗമകൂടാരം’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ലേവ്യപുസ്തകത്തിലെ ആചാരനിയമത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രുവിലെ ഗുണഭോക്തൃഭാവവും നിർദേശഭാവവും നിലനിർത്തിക്കൊണ്ട് വാക്യക്രമം മലയാളത്തിന് സ്വാഭാവികമാക്കി.
