id: LEV.15.20
reference: Leviticus 15:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר תִּשְׁכַּ֥ב עָלָ֛י/ו בְּ/נִדָּתָ֖/הּ יִטְמָ֑א וְ/כֹ֛ל אֲשֶׁר תֵּשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/020.yaml
  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: ml
  text: അവളുടെ ആർത്തവസംബന്ധമായ ആചാരപരമായ അശുദ്ധിക്കാലത്ത് അവൾ കിടക്കുന്ന ഏതു വസ്തുവും അശുദ്ധമായിരിക്കും[a]; അവൾ ഇരിക്കുന്ന ഏതു വസ്തുവും അശുദ്ധമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവളുടെ ആർത്തവകാലത്ത്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായപദം ശാരീരികമായ ആർത്തവത്തെ മാത്രമല്ല, അതുമായി ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധാവസ്ഥയെയും ഉൾക്കൊള്ളുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  choice: ആർത്തവകാലത്തെ ആചാരപരമായ അശുദ്ധി
  rationale: ആർത്തവമെന്ന ശാരീരിക സംഭവത്തെയും ലേവ്യപുസ്തകത്തിലെ ആചാരശുദ്ധി-അശുദ്ധി നിലയെയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; ധാർമ്മിക കുറ്റബോധം സൂചിപ്പിക്കുന്നില്ല.
- source_word: תִּשְׁכַּב
  choice: കിടക്കുന്ന
  rationale: ഉറങ്ങുക എന്ന പ്രത്യേക അർഥം ചേർക്കാതെ, ഒരു വസ്തുവിന്മേൽ കിടക്കുക എന്ന സന്ദർഭാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: תֵּשֵׁב
  choice: ഇരിക്കുന്ന
  rationale: ഒരു വസ്തുവിന്മേൽ ഇരിക്കുക എന്ന സാധാരണവും നേരിട്ടുമായ അർഥം നൽകുന്നു.
- source_word: עָלָיו
  choice: അവൾ ... എല്ലാം
  rationale: ഹീബ്രായയിലെ ‘അതിന്റെമേൽ’ എന്ന സ്ഥലബന്ധം മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യഘടനയിൽ ‘അവൾ കിടക്കുന്ന/ഇരിക്കുന്ന എല്ലാം’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: יִטְמָא
  choice: അശുദ്ധമായിരിക്കും
  rationale: നിയമസന്ദർഭത്തിലെ ആചാരപരമായ അശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘പാപകരം’ പോലുള്ള ധാർമ്മിക അർഥം ചേർക്കുന്നില്ല.
- source_word: וְכֹל אֲשֶׁר
  choice: എല്ലാം
  rationale: ഹീബ്രായയിലെ സമഗ്രവ്യാപ്തി മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: טמא/נִדָּה എന്നിവയെ ആചാരശുദ്ധി-അശുദ്ധി സംബന്ധിച്ച പദങ്ങളായി പരിഭാഷപ്പെടുത്തുക
  alternative: ആർത്തവം ധാർമ്മിക മലിനതയോ പാപമോ ആണെന്ന ധാരണ ഉളവാക്കുന്ന ഭാഷ ഉപയോഗിക്കുക
  rationale: ഈ വാക്യം ഇസ്രായേലിന്റെ ആചാരശുദ്ധിനിയമത്തിലെ ഒരു നിലയെക്കുറിച്ചാണ്; സ്ത്രീയുടെ ആർത്തവത്തെ ധാർമ്മിക കുറ്റമായി വിധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമസന്ദർഭം നിലനിർത്തിക്കൊണ്ട് ധാർമ്മിക മലിനത എന്ന തെറ്റായ സൂചന ഒഴിവാക്കാൻ ‘ആചാരപരമായ’ എന്ന് വ്യക്തമാക്കി.
