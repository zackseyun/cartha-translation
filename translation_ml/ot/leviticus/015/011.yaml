  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: ml
  text: സ്രവമുള്ള പുരുഷൻ വെള്ളത്തിൽ കൈകൾ കഴുകാതെ ആരെയെങ്കിലും തൊട്ടാൽ,[a] തൊടപ്പെട്ടയാൾ തന്റെ വസ്ത്രങ്ങൾ അലക്കി വെള്ളത്തിൽ കുളിക്കണം; സന്ധ്യവരെ അയാൾ അശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ഈ വാക്യഭാഗം അക്ഷരാർഥത്തിൽ, “സ്രവമുള്ള പുരുഷൻ ആരെ തൊടുന്നുവോ, അവന്റെ കൈകൾ വെള്ളത്തിൽ കഴുകിയിട്ടില്ലെങ്കിൽ” എന്ന രീതിയിലാണ്. കൈകൾ കഴുകാതെയുള്ള സ്പർശമാണ് അശുദ്ധി പകരുന്ന വ്യവസ്ഥയെന്ന അർഥം ഇവിടെ സ്വീകരിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: സ്രവമുള്ള പുരുഷൻ
  rationale: זוּב എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം ശരീരസ്രവമുള്ള ഒരു പുരുഷനെയാണ് ഈ ശുദ്ധിനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ സൂചിപ്പിക്കുന്നത്. ‘പുരുഷൻ’ എന്നത് എബ്രായത്തിലെ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: יִגַּע בּוֹ
  choice: ആരെയെങ്കിലും തൊട്ടാൽ
  rationale: נגע എന്ന ക്രിയ ב എന്ന ഉപസർഗത്തോടുകൂടെ ശാരീരിക സ്പർശം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യവസ്ഥാസംബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘തൊട്ടാൽ’ എന്നു നൽകി.
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: വെള്ളത്തിൽ കൈകൾ കഴുകാതെ
  rationale: שׁטף കഴുകിക്കളയുക അഥവാ വെള്ളംകൊണ്ട് ശുദ്ധമാക്കുക എന്നർഥം നൽകുന്നു. ഇവിടെ സ്രവമുള്ള പുരുഷൻ കൈകൾ കഴുകാതെയാണ് മറ്റൊരാളെ തൊടുന്നത് എന്ന സാഹചര്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ അലക്കി
  rationale: כּבס പ്രധാനമായി വസ്ത്രം അലക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അലക്കുക’ എന്നത് തുടർന്നുള്ള ശരീരം കുളിക്കുന്ന പ്രവൃത്തിയിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്നു.
- source_word: וְרָחַץ בַּמַּיִם
  choice: വെള്ളത്തിൽ കുളിക്കണം
  rationale: רחץ ഇവിടെ ശരീരം വെള്ളത്തിൽ കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആചാരപരമായ നിർദേശം മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘കുളിക്കണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: സന്ധ്യവരെ അയാൾ അശുദ്ധനായിരിക്കും
  rationale: טמא ഇവിടെ ധാർമ്മിക കുറ്റമല്ല, ആചാരപരമായ അശുദ്ധിയാണ്. സമയപരിധിയായ ‘സന്ധ്യവരെ’ വ്യക്തമായി നിലനിർത്തി.
- source_word: כֹל אֲשֶׁר
  choice: ആരെയെങ്കിലും … തൊടപ്പെട്ടയാൾ
  rationale: ഈ പ്രയോഗം ഓരോ വ്യക്തിയെയും ഉൾക്കൊള്ളുന്ന വിതരണാർഥമുള്ളതാണ്. മലയാളത്തിൽ കർത്താവിനെയും സ്പർശിക്കപ്പെട്ട വ്യക്തിയെയും ആശയക്കുഴപ്പമില്ലാതെ വേർതിരിക്കാൻ ഈ ഘടന ഉപയോഗിച്ചു.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ טמא എന്ന അശുദ്ധിഭാഷയുടെ സ്വഭാവം
  choice: ആചാരപരമായ അർഥത്തിൽ ‘അശുദ്ധൻ’
  alternative: ‘മലിനനായവൻ’ എന്ന ധാർമ്മികമായി കേൾക്കാവുന്ന പ്രയോഗം
  rationale: ശരീരസ്രവം, സമ്പർക്കം, കഴുകൽ, സന്ധ്യവരെയുള്ള സമയപരിധി എന്നിവയാണ് സന്ദർഭം. അതിനാൽ ഈ നിലയെ ധാർമ്മിക കുറ്റമായി വ്യാഖ്യാനിക്കാതെ ശുദ്ധിനിയമത്തിലെ ആചാരപരമായ വിഭാഗമായി നിലനിർത്തുന്നു.
- issue: കൈകൾ കഴുകാത്തത് ആരുടെ പ്രവൃത്തിയാണ്
  choice: സ്രവമുള്ള പുരുഷൻ കൈകൾ കഴുകാതെ മറ്റൊരാളെ തൊടുന്നു
  alternative: സ്പർശിക്കപ്പെട്ട വ്യക്തി സ്വന്തം കൈകൾ കഴുകിയിട്ടില്ല
  rationale: וְיָדָיו എന്നതിലെ ഏകവചന പുരുഷസൂചനയ്ക്ക് ഏറ്റവും അടുത്തതും സന്ദർഭപരമായി യോജിച്ചതുമായ പൂർവ്വപദം הַזָּב ആണ്. എങ്കിലും എബ്രായ വാക്യക്രമത്തിന്റെ സങ്കുചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘വസ്ത്രങ്ങൾ അലക്കുക,’ ‘വെള്ളത്തിൽ കുളിക്കുക,’ ‘അശുദ്ധനായിരിക്കുക’ എന്നീ വ്യത്യസ്ത പ്രവൃത്തികൾ വേർതിരിച്ചു; കർത്തൃസൂചന വ്യക്തമാക്കാൻ ‘തൊടപ്പെട്ടയാൾ’ ചേർത്തു.
