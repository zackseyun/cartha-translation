  to: ഒരു സ്ത്രീക്ക് അവളുടെ ആർത്തവ അശുദ്ധിയുടെ സമയത്തല്ലാതെ ഏറെ ദിവസങ്ങൾ രക്തസ്രാവം ഉണ്ടാകുകയോ[a], അല്ലെങ്കിൽ അവളുടെ ആർത്തവ അശുദ്ധിയുടെ കാലം കഴിഞ്ഞും രക്തസ്രാവം ഉണ്ടാകുകയോ[b] ചെയ്താൽ, ആ അശുദ്ധസ്രാവം തുടരുന്ന ദിവസങ്ങളിലെല്ലാം അവൾ ആർത്തവ അശുദ്ധിയുടെ ദിവസങ്ങളിലെന്നപോലെ അശുദ്ധയായിരിക്കും.
