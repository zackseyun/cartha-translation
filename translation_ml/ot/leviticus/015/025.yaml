id: LEV.15.25
reference: Leviticus 15:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: ml
  text: ഒരു സ്ത്രീക്ക് അവളുടെ ആർത്തവ അശുദ്ധിയുടെ സമയത്തല്ലാതെ ഏറെ ദിവസങ്ങൾ രക്തസ്രാവം ഉണ്ടാകുകയോ[a], അല്ലെങ്കിൽ അവളുടെ ആർത്തവ അശുദ്ധിയുടെ കാലം കഴിഞ്ഞും രക്തസ്രാവം ഉണ്ടാകുകയോ[b] ചെയ്താൽ, ആ അശുദ്ധസ്രാവം തുടരുന്ന ദിവസങ്ങളിലെല്ലാം അവൾ ആർത്തവ അശുദ്ധിയുടെ ദിവസങ്ങളിലെന്നപോലെ അശുദ്ധയായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവളുടെ ആർത്തവകാലത്തിനു പുറത്തായി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പദം ആർത്തവരക്തസ്രാവത്തെ മാത്രമല്ല, അതിനോടു ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധാവസ്ഥയെയും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവളുടെ ആർത്തവ അശുദ്ധിക്കു പുറമേ രക്തസ്രാവം ഉണ്ടാകുകയോ’ എന്നും പരിഭാഷപ്പെടുത്താം; അതായത്, സാധാരണ ആർത്തവകാലത്തിനപ്പുറം സ്രാവം നീളുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: രക്തസ്രാവം തുടരുക / സ്രാവം തുടരുക
  rationale: זוּב എന്ന ക്രിയയും זוֹב എന്ന നാമവും അസാധാരണമായ ശരീരസ്രാവത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ അത് രക്തമാണെന്ന് വ്യക്തമാകുന്നതിനാൽ, സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘രക്തസ്രാവം തുടരുക’ എന്നു നൽകി; അവസാന ഭാഗത്ത് ആവർത്തനം ലഘൂകരിക്കാൻ ‘സ്രാവം’ ഉപയോഗിച്ചു.
- source_word: דָּמָהּ
  choice: രക്തസ്രാവം
  rationale: പ്രത്യയം ചേർന്ന പദത്തിന്റെ അർഥം അക്ഷരാർഥത്തിൽ ‘അവളുടെ രക്തം’ എന്നാണ്. זוֹב എന്നതിനോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ‘രക്തസ്രാവം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יָמִים רַבִּים
  choice: ഏറെ ദിവസങ്ങൾ
  rationale: സ്രാവത്തിന്റെ ദീർഘകാല ദൈർഘ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: ആർത്തവാശുദ്ധിയുടെ സമയമല്ലാത്തപ്പോൾ
  rationale: עֵת എന്നത് ‘സമയം’ എന്നും נִדָּה ഇവിടെ ആർത്തവത്തോടു ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധാവസ്ഥ ഉൾക്കൊള്ളുന്നതുമാണ്. ജൈവസംഭവം മാത്രമല്ല, ലേവ്യനിയമത്തിലെ ആചാരപരമായ സ്ഥിതിയും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: נִדָּה
  choice: ആർത്തവാശുദ്ധി
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പദം ആർത്തവരക്തസ്രാവം മാത്രമല്ല, അതിനോടു ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധാവസ്ഥയും സൂചിപ്പിക്കുന്നു. ‘ആർത്തവാശുദ്ധി’ ഈ രണ്ടു ഘടകങ്ങളും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עַל נִדָּתָהּ
  choice: ആർത്തവാശുദ്ധിയുടെ കാലം കഴിഞ്ഞും
  rationale: עַל ഇവിടെ സാധാരണ ആർത്തവകാലത്തിനു മുകളിലേക്കോ അതിനപ്പുറത്തേക്കോ നീളുന്നതിനെ സൂചിപ്പിക്കാം. ‘കാലം കഴിഞ്ഞും’ എന്നത് ആ ദൈർഘ്യവിപുലീകരണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘അതിനു പുറമേ’ എന്ന സാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: ആ അശുദ്ധസ്രാവം തുടരുന്ന ദിവസങ്ങളിലെല്ലാം
  rationale: സ്രാവത്തെയും അതുമൂലമുള്ള ആചാരപരമായ അശുദ്ധിയെയും ബന്ധിപ്പിക്കുന്ന എബ്രായ ഘടന വ്യക്തവും വായനാസൗകര്യമുള്ളതുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിച്ചു.
- source_word: טְמֵאָה
  choice: അശുദ്ധയായിരിക്കും
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ ശുദ്ധി-അശുദ്ധി വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ഇത് ധാർമിക കുറ്റം ആരോപിക്കാതെ നിയമപരമായ ആചാരസ്ഥിതി നിലനിർത്തുന്നു.
- source_word: כִּימֵי נִדָּתָהּ
  choice: ആർത്തവാശുദ്ധിയുടെ ദിവസങ്ങളിലെന്നപോലെ
  rationale: അസാധാരണ സ്രാവകാലത്തെ അവളുടെ സ്ഥിതി സാധാരണ ആർത്തവാശുദ്ധിക്കാലത്തെ സ്ഥിതിയോടു തുല്യമാണെന്ന താരതമ്യം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആചാരപരമായ അശുദ്ധിയെ ധാർമിക കുറ്റമായി തെറ്റിദ്ധരിപ്പിക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: ‘അശുദ്ധ’ എന്നും ‘ആർത്തവാശുദ്ധി’ എന്നും ആചാരപരമായ സ്ഥിതിയെ സൂചിപ്പിക്കുന്ന പദങ്ങളായി ഉപയോഗിച്ചു
  alternative: എല്ലായിടത്തും ‘മലിനം’ ഉപയോഗിക്കുക; അല്ലെങ്കിൽ ആചാരപരമായ അശുദ്ധിയെ വ്യക്തമാക്കാതെ ‘ആർത്തവം’ എന്നു മാത്രം നൽകുക
  rationale: വാക്യം വ്യക്തിപരമായ പാപത്തെയല്ല, ലേവ്യനിയമത്തിലെ ആചാരപരമായ ശുദ്ധി-അശുദ്ധി നിലയെയാണ് കൈകാര്യം ചെയ്യുന്നത്. തിരഞ്ഞെടുത്ത പദങ്ങൾ ഈ നിയമപരവും ആരാധനാസംബന്ധവുമായ വിഭാഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവമുള്ള നിയമഭാഷ ഉപയോഗിച്ചു. ‘ആർത്തവാശുദ്ധി’ എന്ന സംയുക്തപദം ജൈവമായ ആർത്തവത്തെയും അതിനോടു ബന്ധപ്പെട്ട ലേവ്യ ആചാരസ്ഥിതിയെയും വേർതിരിക്കാതെ സൂക്ഷിക്കുന്നു. ‘അശുദ്ധ’ എന്നത് ഇവിടെ ധാർമിക കുറ്റമല്ല, ആചാരപരമായ നിലയാണ്.
