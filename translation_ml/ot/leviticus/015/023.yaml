source:
  edition: WLC
  text: וְ/אִ֨ם עַֽל הַ/מִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל הַ/כְּלִ֛י אֲשֶׁר הִ֥וא יֹשֶֽׁבֶת עָלָ֖י/ו בְּ/נָגְע/וֹ ב֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: ml
  text: അത് കിടക്കമേലോ അവൾ ഇരിക്കുന്ന വസ്തുവിന്മേലോ[a] ആണെങ്കിൽ, അവൻ അതിനെ തൊടുമ്പോൾ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വസ്തു’ എന്നതിന് ‘ഉപകരണം’ അല്ലെങ്കിൽ ‘പാത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ כְּלִי ഒരു വസ്തു, ഉപകരണം, പാത്രം തുടങ്ങിയവയെ സൂചിപ്പിക്കാവുന്ന വിശാലപദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ആണെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ നിയമസാഹചര്യത്തോടുള്ള ബന്ധവും വ്യവസ്ഥയും മലയാളത്തിലെ സ്വാഭാവികമായ നിബന്ധനാരൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַל הַמִּשְׁכָּב
  choice: കിടക്കമേൽ
  rationale: מִשְׁכָּב ഇവിടെ കിടക്കയെയോ കിടക്കുന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കുന്നു; ‘കിടക്ക’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הוּא
  choice: അത് … ആണെങ്കിൽ
  rationale: പുല്ലിംഗ ഏകവചന സർവനാമം സന്ദർഭത്തിൽ മുമ്പ് സൂചിപ്പിച്ച വസ്തുവിനെയാണ് പരാമർശിക്കുന്നത്; മലയാളത്തിൽ ജഡവസ്തുവിന് ‘അത്’ യോജിക്കുന്നു.
- source_word: עַל הַכְּלִי
  choice: ഏതെങ്കിലും ഉപകരണത്തിന്മേൽ
  rationale: כְּלִי പാത്രം, ഉപകരണം, സാമഗ്രി, വസ്തു എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാലപദമാണ്. ഇവിടെ ഒരാൾ ഇരിക്കാവുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉപകരണം’ മതിയായ വ്യാപ്തി നിലനിർത്തുന്നു; ‘ഏതെങ്കിലും’ അനിശ്ചിതത്വം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: അവൾ ഇരിക്കുന്ന
  rationale: ഹീബ്രു സംബന്ധവാക്യവും വർത്തമാന പങ്കാളിക്രിയയുടെ തുടർച്ചയായ അർഥവും ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנָגְעוֹ בוֹ
  choice: അവൻ അതിനെ തൊടുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചന പ്രത്യയം ‘അവൻ’ എന്ന് നിലനിർത്തുന്നു.
- source_word: יִטְמָא
  choice: അശുദ്ധനായിരിക്കും
  rationale: നിയമസന്ദർഭത്തിലെ ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘അശുദ്ധൻ’ എന്നത് ധാർമ്മിക കുറ്റം നിർബന്ധമായി സൂചിപ്പിക്കാതെ ശുദ്ധിനിയമത്തിലെ നിലയെ നേരിട്ട് പറയുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: ലേവ്യപുസ്തകത്തിലെ ആവർത്തിതമായ കാലപരിധിസൂത്രം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: ലേവ്യശുദ്ധിനിയമത്തിലെ טָמֵא എന്ന നിലയുടെ സ്വഭാവം
  choice: ‘അശുദ്ധനായിരിക്കും’ എന്ന് ലളിതമായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘ആചാരപരമായി അശുദ്ധനായിരിക്കും’ അല്ലെങ്കിൽ ‘മലിനനായിരിക്കും’
  rationale: ഇത് ശുദ്ധിനിയമത്തിലെ ആചാരപരമായ നിലയാണ്; ധാർമ്മിക കുറ്റബോധം നിർബന്ധമായി ഉദ്ദേശിക്കുന്നില്ല. എന്നാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യവാക്യത്തിൽ ചേർക്കാതിരിക്കാൻ ‘ആചാരപരമായി’ എന്ന് കൂട്ടിച്ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഗദ്യശൈലി. ഹീബ്രുവിലെ വ്യവസ്ഥ, സർവനാമപരാമർശം, കാലബന്ധം, ശുദ്ധിനില എന്നിവ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം സ്വീകരിച്ചു.
