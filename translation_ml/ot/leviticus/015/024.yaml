source:
  edition: WLC
  text: וְ/אִ֡ם שָׁכֹב֩ יִשְׁכַּ֨ב אִ֜ישׁ אֹתָ֗/הּ וּ/תְהִ֤י נִדָּתָ/הּ֙ עָלָ֔י/ו וְ/טָמֵ֖א שִׁבְעַ֣ת יָמִ֑ים וְ/כָל הַ/מִּשְׁכָּ֛ב אֲשֶׁר יִשְׁכַּ֥ב עָלָ֖י/ו יִטְמָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: ml
  text: ഒരു പുരുഷൻ അവളോടുകൂടെ തീർച്ചയായും ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുകയും[a] അവളുടെ ആർത്തവ അശുദ്ധി അവന്റെമേൽ വരികയും ചെയ്താൽ, അവൻ ഏഴു ദിവസം അശുദ്ധനായിരിക്കും; അവൻ കിടക്കുന്ന ഓരോ കിടക്കയും അശുദ്ധമാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഒരു പുരുഷൻ അവളോടുകൂടെ കിടക്കുകതന്നെ ചെയ്താൽ.” ഇവിടെ എബ്രായ പ്രയോഗം ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുകതന്നെ ചെയ്യുകയും
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ഇംപെർഫെക്റ്റും ചേർന്ന പ്രയോഗത്തിലെ ഊന്നൽ ‘തന്നെ’ എന്നതിലൂടെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ലൈംഗികബന്ധത്തെ വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: ഏകവചന പുല്ലിംഗ നാമത്തിന്റെ ലിംഗസൂചന കൃത്യമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: אֹתָהּ
  choice: അവളോടുകൂടെ
  rationale: സ്ത്രീയെ സൂചിപ്പിക്കുന്ന പ്രത്യക്ഷ കർമസർവനാമം; മലയാളത്തിലെ ലൈംഗികബന്ധപ്രയോഗത്തിൽ ‘അവളോടുകൂടെ’ സ്വാഭാവികമാണ്.
- source_word: נִדָּתָהּ
  choice: അവളുടെ ആർത്തവ അശുദ്ധി
  rationale: ജീവശാസ്ത്രപരമായ ആർത്തവം മാത്രമല്ല, ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ അശുദ്ധാവസ്ഥയും ഈ പദം സൂചിപ്പിക്കുന്നു.
- source_word: וּתְהִי ... עָלָיו
  choice: അവന്റെമേൽ വരുകയും
  rationale: ‘അവന്റെമേൽ ആയിരിക്കുക’ എന്ന എബ്രായ ദൃശ്യരൂപവും അശുദ്ധി അവനിലേക്കു ബാധകമാകുന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: וְטָמֵא
  choice: അവൻ ... അശുദ്ധനായിരിക്കും
  rationale: നിബന്ധനയ്ക്കു പിന്നാലെയുള്ള നിയമപരമായ ഫലത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: മൂലത്തിലെ കാലദൈർഘ്യം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: הַמִּשְׁכָּב
  choice: കിടക്ക
  rationale: കിടക്കുന്ന സ്ഥലം എന്ന അർഥത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമായ പദം.
- source_word: אֲשֶׁר יִשְׁכַּב עָלָיו
  choice: അവൻ കിടക്കുന്ന
  rationale: ‘അതിന്റെമേൽ അവൻ കിടക്കുന്നു’ എന്ന ബന്ധവാക്യം മലയാളത്തിൽ ചുരുക്കിയും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: יִטְמָא
  choice: അശുദ്ധമാകും
  rationale: നിയമവാക്യത്തിലെ അനന്തരഫലം വ്യക്തമാക്കുകയും ആദ്യത്തെ അശുദ്ധിപ്രയോഗവുമായി യോജിപ്പ് പാലിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആചാരപരമായ അശുദ്ധിയെ ധാർമിക കുറ്റമായി വ്യാഖ്യാനിക്കാതിരിക്കുക
  choice: ‘അശുദ്ധി/അശുദ്ധൻ’ എന്ന ആചാരശുദ്ധി സംബന്ധിയായ ഭാഷ ഉപയോഗിച്ചു
  alternative: ‘കളങ്കം’, ‘മലിനത’, അല്ലെങ്കിൽ ധാർമിക പാപബോധം ഉണർത്തുന്ന പദങ്ങൾ
  rationale: ലേവ്യപുസ്തകം 15-ലെ വിഷയം ആചാരപരമായ ശുദ്ധി-അശുദ്ധിയാണ്; ഈ വാക്യം സ്വതവേ വ്യക്തിപരമായ ധാർമിക കുറ്റം പ്രഖ്യാപിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും ലേവ്യനിയമങ്ങളുടെ ഗൗരവം നിലനിർത്തുന്നതുമായ ഭാഷ. ‘ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുക’ വ്യക്തവും മാന്യവുമാണ്; അടിക്കുറിപ്പിൽ എബ്രായ ഭാഷാശൈലിയുടെ അക്ഷരാർഥം സംരക്ഷിച്ചിരിക്കുന്നു.
