reference: Leviticus 15:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי תֵצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָ֑רַע וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת כָּל בְּשָׂר֖/וֹ וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: ml
  text: ഒരു പുരുഷന് ശുക്ലസ്രാവം ഉണ്ടായാൽ[a], അവൻ തന്റെ ശരീരം മുഴുവൻ വെള്ളത്തിൽ കഴുകണം; സന്ധ്യവരെ അവൻ അശുദ്ധനായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ശുക്ലവിസർജനം’; എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘വിത്തിന്റെ ശയനം’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘അശുദ്ധൻ’ എന്നത് ലേവ്യശുദ്ധിനിയമങ്ങളുടെ പശ്ചാത്തലത്തിലുള്ള ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു; അത് നിർബന്ധമായും ധാർമ്മിക കുറ്റത്തെ സൂചിപ്പിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: പുരുഷന്റെ ശരീരസ്രാവത്തെക്കുറിച്ചുള്ള പ്രത്യേക നിയമമായതിനാൽ ലിംഗസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: ഉണ്ടായാൽ
  rationale: നിയമപരമായ സോപാധിക സാഹചര്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תֵצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: അവനിൽനിന്ന് ശുക്ലസ്രാവം ഉണ്ടായാൽ
  rationale: ‘അവനിൽനിന്ന് പുറപ്പെടുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ വൈദ്യശരീരപരമായ പദപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: וְרָחַץ בַּמַּיִם אֶת כָּל בְּשָׂרוֹ
  choice: അവൻ തന്റെ ശരീരം മുഴുവൻ വെള്ളത്തിൽ കഴുകണം
  rationale: നിയമനിർദേശത്തിന്റെ ബലം ‘കഴുകണം’ എന്നു നൽകുകയും ‘സകല മാംസവും’ എന്ന എബ്രായ ശൈലിയെ സ്വാഭാവികമായി ‘ശരീരം മുഴുവൻ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: സന്ധ്യവരെ അവൻ അശുദ്ധനായിരിക്കും
  rationale: ലേവ്യശുദ്ധിനിയമങ്ങളിലെ നിലയെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ ‘അശുദ്ധൻ’ നിലനിർത്തുന്നു; സമയപരിധിയും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: טָמֵא എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: പ്രധാനവാചകത്തിൽ ‘അശുദ്ധനായിരിക്കും’; അടിക്കുറിപ്പിൽ ആചാരപരമായ അശുദ്ധിയെന്ന് വ്യക്തമാക്കുന്നു
  alternative: ധാർമ്മികമായി മലിനനായിരിക്കും / ആചാരപരമായി അശുദ്ധനായിരിക്കും
  rationale: മൂലവാചകം അശുദ്ധിയുടെ നില പ്രസ്താവിക്കുന്നു; ഈ സന്ദർഭത്തിൽ അത് വ്യക്തിപരമായ പാപക്കുറ്റം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല. പ്രധാനവാചകത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട് തെറ്റായ ധാർമ്മിക നിഗമനം ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. നിയമവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; അത്യന്തം അക്ഷരാർഥപരമായ ‘സകല മാംസവും’ ഒഴിവാക്കി സ്വാഭാവികമായ ‘ശരീരം മുഴുവൻ’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
