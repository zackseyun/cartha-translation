    rationale: മൂലത്തിലെ ‘അവനിൽനിന്ന് പുറപ്പെടുന്നു’ എന്ന ആശയം ശരിയായി പ്രതിഫലിപ്പിക്കുന്നെങ്കിലും, മലയാളത്തിൽ ‘ഒരു പുരുഷന് ... ഉണ്ടായാൽ’ എന്നത് കൂടുതൽ സ്വാഭാവികമാണ്; അർഥനഷ്ടമില്ല.
