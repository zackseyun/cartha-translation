  to: ഒരു പുരുഷന് ശുക്ലസ്രാവം ഉണ്ടായാൽ[a], അവൻ തന്റെ ശരീരം മുഴുവൻ വെള്ളത്തിൽ കഴുകണം; സന്ധ്യവരെ അവൻ അശുദ്ധനായിരിക്കും[b].
  rationale: മുഖ്യവാക്യത്തിൽ കൂടുതൽ സ്വാഭാവികമായ മലയാളഘടന സ്വീകരിച്ചു. അടിക്കുറിപ്പ് a-യിൽ അക്ഷരാർഥത്തെ സന്ദർഭാർഥത്തിൽനിന്ന് വേർതിരിച്ച്, മൂലപദസമുച്ചയത്തെക്കുറിച്ചുള്ള തെറ്റിദ്ധരിപ്പിക്കുന്ന ‘ശയനസ്രാവം’ എന്ന രൂപം ഒഴിവാക്കി. അശുദ്ധി ആചാരപരമാണെന്ന ആവശ്യമായ വിശദീകരണവും അതിന്റെ ആങ്കറും നിലനിർത്തിയിരിക്കുന്നു.
