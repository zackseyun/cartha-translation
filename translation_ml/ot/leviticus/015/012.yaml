id: LEV.15.12
reference: Leviticus 15:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁר יִגַּע בּ֥/וֹ הַ/זָּ֖ב יִשָּׁבֵ֑ר וְ/כָל כְּלִי עֵ֔ץ יִשָּׁטֵ֖ף בַּ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/012.yaml
  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: ml
  text: സ്രവമുള്ളയാൾ തൊടുന്ന മൺപാത്രം[a][b] ഉടച്ചുകളയണം; എല്ലാ മരപ്പാത്രങ്ങളും വെള്ളത്തിൽ കഴുകണം.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കളിമൺപാത്രം’ അല്ലെങ്കിൽ ‘മൺകൊണ്ടുള്ള പാത്രം.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായഭാഷയിൽ ‘സ്രവമുള്ളയാൾ’; ശരീരസ്രവം ബാധിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ശുദ്ധിനിയമത്തിലെ സാങ്കേതിക പ്രയോഗം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘വെള്ളംകൊണ്ട് നന്നായി കഴുകണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: മൺപാത്രം
  rationale: മണ്ണുകൊണ്ടോ കളിമണ്ണുകൊണ്ടോ നിർമിച്ച പാത്രത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വസ്തുഭേദം നിലനിർത്തുന്നതുമായ മലയാളപദം.
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: തൊടുന്ന
  rationale: נגע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘തൊടുക’ ലളിതമായി നിലനിർത്തുന്നു.
- source_word: הַזָּב
  choice: സ്രവമുള്ളയാൾ
  rationale: ശരീരസ്രവം ബാധിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ശുദ്ധിനിയമത്തിലെ സാങ്കേതിക പ്രയോഗം, അനാവശ്യമായി ലിംഗം ചേർക്കാതെ അവസ്ഥയെ കേന്ദ്രീകരിച്ച് നൽകുന്നു.
- source_word: יִשָּׁבֵר
  choice: ഉടച്ചുകളയണം
  rationale: നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയ അർഥവും നിയമപരമായ നിർബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כָל כְּלִי עֵץ
  choice: എല്ലാ മരപ്പാത്രങ്ങളും
  rationale: മരംകൊണ്ടുള്ള ഉപകരണങ്ങളെയോ പാത്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു; മുൻപുള്ള മൺപാത്രത്തോടുള്ള സമാന്തരത നിലനിർത്തുന്നു.
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: വെള്ളത്തിൽ കഴുകണം
  rationale: שטף ഇവിടെ വെള്ളംകൊണ്ട് കഴുകുകയോ നന്നായി വെള്ളമൊഴിച്ച് ശുദ്ധമാക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പാത്രത്തെ സംബന്ധിച്ച് ‘കഴുകണം’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള നിയമശൈലി. ‘ഉടച്ചുകളയണം’, ‘കഴുകണം’ എന്നീ രൂപങ്ങൾ എബ്രായത്തിലെ നിയമപരമായ നിർദേശം സ്വാഭാവികമായി അറിയിക്കുന്നു; സ്രവത്തിന്റെ സ്വഭാവം പാഠം വ്യക്തമാക്കാത്തതിനാൽ അതിനെ കൂടുതൽ നിർവചിച്ചിട്ടില്ല.
