id: LEV.15.30
reference: Leviticus 15:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הָ/אֶחָ֣ד חַטָּ֔את וְ/אֶת הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלֶ֤י/הָ הַ/כֹּהֵן֙ לִ/פְנֵ֣י יְהוָ֔ה מִ/זּ֖וֹב טֻמְאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ ഒന്നിനെ പാപയാഗമായും[a] മറ്റേതിനെ ഹോമയാഗമായും അർപ്പിക്കണം. അവളുടെ അശുദ്ധമായ സ്രാവംനിമിത്തം പുരോഹിതൻ യഹ്‌വേയുടെ സന്നിധിയിൽ അവൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാപയാഗം’ എന്നതിന് ‘ശുദ്ധീകരണയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ חַטָּאת എന്ന പദം ലേവ്യാരാധനാക്രമത്തിൽ യാഗത്തിന്റെ ശുദ്ധീകരണധർമത്തെയും ഊന്നിപ്പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: അർപ്പിക്കണം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, യാഗങ്ങളെ കർമവിഷയങ്ങളാക്കുന്ന ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായ ആരാധനാക്രമപ്രയോഗം ‘അർപ്പിക്കുക’ ആണ്.
- source_word: הָאֶחָד חַטָּאת
  choice: ഒന്നിനെ പാപയാഗമായി
  rationale: חַטָּאת ഇവിടെ ഒരു യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. പരിചിതമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും ശുദ്ധീകരണധർമം അടിവരയിടുന്ന മറ്റൊരു പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
- source_word: וְאֶת הָאֶחָד עֹלָה
  choice: മറ്റേതിനെ ഹോമയാഗമായി
  rationale: ആവർത്തിച്ച הָאֶחָד സന്ദർഭത്തിൽ ‘ഒന്ന് … മറ്റേത്’ എന്ന വിതരണാർഥം നൽകുന്നു; עֹלָהയ്ക്ക് മലയാള ബൈബിൾ-ആരാധനാഭാഷയിൽ വ്യക്തവും സംക്ഷിപ്തവുമായ പദം ‘ഹോമയാഗം’ ആണ്.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: അവൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ כפר എന്ന ക്രിയയുടെ ആരാധനാക്രമ-ദൈവശാസ്ത്ര ഭാരം ‘പ്രായശ്ചിത്തം ചെയ്യുക’ സംരക്ഷിക്കുന്നു; עָלֶיהָ ഇവിടെ സ്വാഭാവികമായി ‘അവൾക്കുവേണ്ടി’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ആരാധനാക്രമപരമായ സാന്നിധ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘സന്നിധിയിൽ’ എന്നു നൽകി; ദൈവനാമം യഹ്‌വേ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: അവളുടെ അശുദ്ധമായ സ്രാവംനിമിത്തം
  rationale: זוֹב ശരീരസ്രാവത്തെയും טֻמְאָה അതിന്റെ ആചാരപരമായ അശുദ്ധിയെയും സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ מִן-ന്റെ കാരണബന്ധം നിലനിർത്തുന്നു; അതേസമയം അസ്വാഭാവികമായ ‘അവളുടെ അശുദ്ധിയുടെ സ്രാവം’ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: חַטָּאת എന്ന യാഗനാമത്തിന്റെ പരിഭാഷ
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ പദം പാപത്തോടു ബന്ധപ്പെട്ട യാഗവിഭാഗത്തെയും ലേവ്യാരാധനാക്രമത്തിലെ ശുദ്ധീകരണപ്രവർത്തനത്തെയും ഉൾക്കൊള്ളാം. പരിചിതമായ പദം മുഖ്യപാഠത്തിൽ നൽകി യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: എബ്രായപാഠത്തിൽ പ്രത്യക്ഷമായിരിക്കുന്ന ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: כפר על എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: അവൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം
  alternative: അവളെ ശുദ്ധീകരിക്കണം
  rationale: ‘പ്രായശ്ചിത്തം’ മൂലപദത്തിന്റെ ആരാധനാക്രമ-ദൈവശാസ്ത്ര വ്യാപ്തി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ശുദ്ധീകരണം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും അതിലേക്കു മാത്രം അർഥം ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യാഗസാങ്കേതിക പദങ്ങളായ ‘പാപയാഗം’, ‘ഹോമയാഗം’, ‘പ്രായശ്ചിത്തം’ എന്നിവ വ്യക്തതയ്ക്കും പാരമ്പര്യപരിചിതത്വത്തിനുമായി നിലനിർത്തി; എബ്രായ വാക്യത്തിന്റെ കാരണബന്ധവും ആവർത്തിച്ച പുരോഹിതവിഷയവും സംരക്ഷിച്ചു.
