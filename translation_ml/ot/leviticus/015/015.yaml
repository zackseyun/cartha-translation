reference: Leviticus 15:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה אֹתָ/ם֙ הַ/כֹּהֵ֔ן אֶחָ֣ד חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה מִ/זּוֹבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: ml
  text: 'പുരോഹിതൻ അവയെ അർപ്പിക്കണം: ഒന്നിനെ പാപയാഗമായും[a] മറ്റേതിനെ ഹോമയാഗമായും അർപ്പിക്കണം. അവന്റെ സ്രവം നിമിത്തം പുരോഹിതൻ യഹോവയുടെ സന്നിധിയിൽ അവനുവേണ്ടി പ്രായശ്ചിത്തം നടത്തണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുദ്ധീകരണയാഗമായി.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദമായ חַטָּאת ധാർമ്മിക പാപത്തിനുള്ള യാഗത്തെ മാത്രമല്ല, ആചാരപരമായ അശുദ്ധി നീക്കുന്നതിനുള്ള യാഗത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: അവയെ അർപ്പിക്കണം
  rationale: യാഗകർമത്തിന്റെ പശ്ചാത്തലത്തിൽ עשה എന്നത് വെറുതെ ‘ഉണ്ടാക്കുക’ എന്നതിലുപരി യാഗമായി നിർവഹിക്കുക/അർപ്പിക്കുക എന്നാണ്; മുൻവാക്യത്തിലെ രണ്ടു പക്ഷികളെയാണ് ബഹുവചന സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗശുശ്രൂഷ നിർവഹിക്കുന്ന כהן എന്ന പദത്തിന്റെ സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാള പരിഭാഷ.
- source_word: אֶחָד חַטָּאת
  choice: ഒന്നിനെ പാപയാഗമായി
  rationale: חַטָּאת എന്ന യാഗനാമത്തിന് പരിചിതമായ മലയാള രൂപം ‘പാപയാഗം’ ആണ്; ആചാരപരമായ അശുദ്ധി നീക്കുന്നതിനുള്ള ‘ശുദ്ധീകരണയാഗം’ എന്ന സാങ്കേതിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהָאֶחָד עֹלָה
  choice: മറ്റേതിനെ ഹോമയാഗമായി
  rationale: עֹלָה എന്നത് പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിത യാഗനാമമാണ്; הָאֶחָד എന്നതിന്റെ പരസ്പരവിരുദ്ധ നിർദ്ദേശം ‘മറ്റേത്’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: וְכִפֶּר עָלָיו
  choice: അവനുവേണ്ടി പ്രായശ്ചിത്തം നടത്തണം
  rationale: כפר എന്നതിന്റെ യാഗപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്ന പ്രയോഗം.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധിയിൽ നടക്കുന്ന യാഗകർമം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം; יהוה എന്ന ദിവ്യനാമം ‘യഹോവ’യായി ലിപ്യന്തരിച്ചു.
- source_word: מִזּוֹבוֹ
  choice: അവന്റെ സ്രവം നിമിത്തം
  rationale: זוֹב ശരീരത്തിൽനിന്നുള്ള സ്രവത്തെ സൂചിപ്പിക്കുന്നു; מן ഇവിടെ പ്രായശ്ചിത്തം ആവശ്യമായ കാരണമോ ഉറവിടമോ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിമിത്തം’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ആചാരശുദ്ധിയുടെ പശ്ചാത്തലത്തിൽ חַטָּאת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: പരമ്പരാഗതവും പൊതുവേ തിരിച്ചറിയാവുന്നതുമായ യാഗനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. എന്നാൽ ഇവിടെ ധാർമ്മിക പാപം മാത്രമല്ല, ആചാരപരമായ അശുദ്ധി നീക്കുന്നതും ലക്ഷ്യമാകുന്നതിനാൽ സാങ്കേതികമായ മറ്റൊരു പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: כפר എന്ന ക്രിയയുടെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: പ്രായശ്ചിത്തം നടത്തുക
  alternative: പരിഹാരം വരുത്തുക; ശുദ്ധീകരിക്കുക
  rationale: യാഗത്തിലൂടെ സംഭവിക്കുന്ന ഫലത്തിന്റെ രീതി അമിതമായി നിർവചിക്കാതെ, മൂലപദത്തിന്റെ ആരാധനാപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷവും വ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ യാഗസംബന്ധിയായ സ്ഥാപിത പദങ്ങൾ നിലനിർത്തി. വാക്യഘടന നിയമപരമായ ഗൗരവം സൂക്ഷിക്കുമ്പോഴും അനാവശ്യമായ പഴമൊഴിവിന്യാസങ്ങൾ ഒഴിവാക്കുന്നു.
