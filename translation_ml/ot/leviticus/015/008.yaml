id: LEV.15.8
reference: Leviticus 15:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי יָרֹ֛ק הַ/זָּ֖ב בַּ/טָּה֑וֹר וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: ml
  text: സ്രവമുള്ളവൻ ശുദ്ധനായ ഒരാളുടെമേൽ തുപ്പിയാൽ, ആ വ്യക്തി തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും വെള്ളത്തിൽ കുളിക്കുകയും വേണം; സന്ധ്യവരെ അയാൾ അശുദ്ധനായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള ‘ശുദ്ധൻ’, ‘അശുദ്ധൻ’ എന്നീ പദങ്ങൾ പ്രധാനമായും ആചാരപരമായ നിലയെയാണ് സൂചിപ്പിക്കുന്നത്; ധാർമ്മികമായ മലിനതയെ നിർബന്ധമായും അർഥമാക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: എങ്കിൽ / -യാൽ
  rationale: നിയമപരമായ സംഭവക്രമത്തിലെ വ്യവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാവാക്യരൂപമായ ‘-യാൽ’ ഉപയോഗിച്ചു.
- source_word: יָרֹק
  choice: തുപ്പിയാൽ
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘തുപ്പുക’ എന്നതാണ്; בְּ ഉപസർഗം വ്യക്തിയിലേക്കുള്ള ‘മേൽ’ എന്ന ബന്ധമായി പ്രകടിപ്പിച്ചു.
- source_word: הַזָּב
  choice: സ്രവമുള്ളവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘സ്രവിക്കുന്നവൻ’; സന്ദർഭത്തിലെ പുരുഷ ഏകവചനത്തെ നിലനിർത്തിക്കൊണ്ട് രോഗനിർണയം കൂട്ടിച്ചേർക്കാതെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: בַּטָּהוֹר
  choice: ശുദ്ധനായ ഒരാളുടെമേൽ
  rationale: വിശേഷണം ഇവിടെ നാമവൽക്കരിച്ചാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. ‘ഒരാൾ’ ചേർത്തത് മലയാളത്തിലെ വ്യക്തതയ്ക്കായി; ‘ശുദ്ധൻ’ ആചാരപരമായ നിലയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: ആ വ്യക്തി തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും
  rationale: כִּבֶּס വസ്ത്രം അലക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രു ക്രിയകളിലെ കർത്താവ് തുപ്പേറ്റ ശുദ്ധനായ വ്യക്തിയാണെന്നത് മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ വ്യക്തമാക്കി.
- source_word: וְרָחַץ בַּמַּיִם
  choice: വെള്ളത്തിൽ കുളിക്കുകയും വേണം
  rationale: ഈ ശുദ്ധീകരണസന്ദർഭത്തിൽ ശരീരം വെള്ളത്തിൽ കഴുകുന്നതാണ് ഉദ്ദേശ്യം; ‘കുളിക്കുക’ ആ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְטָמֵא
  choice: അശുദ്ധനായിരിക്കും
  rationale: ധാർമ്മിക കുറ്റമല്ല, ആചാരപരമായ അശുദ്ധാവസ്ഥയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; നിയമവാക്യത്തിന്റെ ഫലപ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ അശുദ്ധിയുടെ ദൈർഘ്യം സൂചിപ്പിക്കുന്ന പതിവ് കാലപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: ശുദ്ധി–അശുദ്ധി പദാവലി
  choice: ‘ശുദ്ധൻ’ / ‘അശുദ്ധൻ’ എന്ന ആചാരപരമായ പദങ്ങൾ
  alternative: ‘നിർമലൻ’ / ‘മലിനൻ’
  rationale: ഈ വാക്യം ധാർമ്മിക കുറ്റത്തെക്കാൾ ഇസ്രായേലിന്റെ ആചാരപരമായ നിലയെക്കുറിച്ചാണ്. മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘ശുദ്ധൻ/അശുദ്ധൻ’ കൂടുതൽ വ്യക്തവും സ്ഥാപിതവുമാണ്.
- issue: തുടർന്നുള്ള ക്രിയകളുടെ കർത്താവ്
  choice: തുപ്പേറ്റ ശുദ്ധനായ വ്യക്തിയെയാണ് ‘ആ വ്യക്തി’ എന്നും ‘അയാൾ’ എന്നും വ്യക്തമാക്കി
  alternative: സർവനാമം മാത്രം ഉപയോഗിച്ച് കർത്താവിനെ അവ്യക്തമായി വിടുക
  rationale: ഹീബ്രുവിലെ വ്യാകരണപരമായ തുടർച്ചയിൽ കർത്താവ് בַּטָּהוֹר, അതായത് തുപ്പേറ്റ ശുദ്ധനായ വ്യക്തിയാണ്. മലയാളത്തിൽ തെറ്റായ കർത്തൃബന്ധം ഉണ്ടാകാതിരിക്കാൻ ഇത് വ്യക്തമാക്കി; പുതിയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരമായ വ്യവസ്ഥയും ആചാരശുദ്ധിയുടെ സാങ്കേതിക അർഥവും നിലനിർത്തി. പ്രധാനവാചകത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രസ്താവനയ്ക്കുശേഷം നൽകിയിരിക്കുന്നു.
