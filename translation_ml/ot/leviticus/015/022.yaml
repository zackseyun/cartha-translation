id: LEV.15.22
reference: Leviticus 15:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֔עַ בְּ/כָל כְּלִ֖י אֲשֶׁר תֵּשֵׁ֣ב עָלָ֑י/ו יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ml
  text: അവൾ ഇരിക്കുന്ന ഏതു വസ്തുവിലും തൊടുന്ന ഏവനും തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും വെള്ളത്തിൽ കുളിക്കുകയും വേണം; അവൻ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വസ്തു’ എന്നതിന് ‘പാത്രം,’ ‘ഉപകരണം,’ ‘സാധനം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ כְּלִי എന്ന പദത്തിന് വിശാലമായ അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: തൊടുന്ന ഏവനും
  rationale: സംബന്ധക കൃതന്തവും כָל എന്ന സമഗ്രതാസൂചകവും ചേർന്ന പൊതുവായ വ്യക്തിവർഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּכָל כְּלִי
  choice: ഏതെങ്കിലും വസ്തുവിൽ
  rationale: כְּלִי പാത്രം, ഉപകരണം, സാധനം, വസ്തു എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്; ഇരിക്കാവുന്ന ഇനത്തെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘വസ്തു’ അനാവശ്യമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: അവൾ ഇരിക്കുന്ന
  rationale: സ്ത്രീയെ സൂചിപ്പിക്കുന്ന ക്രിയാരൂപവും മുൻപുള്ള כְּלִי-യെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യവും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും
  rationale: כִּבֵּס വസ്ത്രം കഴുകി വൃത്തിയാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അലക്കുക’ കൃത്യമാണ്; പ്രതിഫലനാത്മക ഉടമസ്ഥത ‘തന്റെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְרָחַץ בַּמַּיִם
  choice: വെള്ളത്തിൽ കുളിക്കുകയും
  rationale: ശുദ്ധിനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ רָחַץ ശരീരം വെള്ളത്തിൽ കഴുകുന്നതാണ്; ‘കുളിക്കുക’ സാധാരണ വായനക്കാർക്ക് അത് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וְטָמֵא
  choice: അവൻ ... അശുദ്ധനായിരിക്കും
  rationale: טָמֵא ഇവിടെ ധാർമിക കുറ്റമല്ല, ആചാരപരമായ അശുദ്ധാവസ്ഥയാണ്; ‘അശുദ്ധൻ’ ലേവ്യപുസ്തകത്തിലെ ഈ വിഭാഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: അശുദ്ധാവസ്ഥയുടെ സമയപരിധി സ്വാഭാവികവും കൃത്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധിനിയമത്തിൽ അശുദ്ധിയുടെ സ്വഭാവം
  choice: טָמֵא എന്നത് ആചാരപരമായ ‘അശുദ്ധൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: മലിനൻ; അശുദ്ധിയുള്ളവൻ
  rationale: സ്പർശംമൂലം ഉണ്ടാകുന്ന ആരാധനാക്രമസംബന്ധിയായ അവസ്ഥയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; വ്യക്തിപരമായ പാപമോ ധാർമിക കുറ്റമോ പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ നിയമനിർദേശത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ‘വേണം’ ഉപയോഗിച്ചു. ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ വിഭാഗത്തിന് പരിചിതവും വ്യക്തവുമായ ‘അശുദ്ധൻ’ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
