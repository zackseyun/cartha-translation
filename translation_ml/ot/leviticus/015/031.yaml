  revised_text: ഇങ്ങനെ, ഇസ്രായേൽമക്കൾക്ക് അവരുടെ അശുദ്ധിയെക്കുറിച്ച് നിങ്ങൾ മുന്നറിയിപ്പ് നൽകണം; അങ്ങനെ, അവരുടെ മധ്യേയുള്ള എന്റെ തിരുനിവാസത്തെ അശുദ്ധമാക്കുന്നതിനാൽ അവർ തങ്ങളുടെ അശുദ്ധിയിൽ മരിക്കാതിരിക്കും.[a]
