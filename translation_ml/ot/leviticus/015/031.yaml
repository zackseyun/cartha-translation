id: LEV.15.31
reference: Leviticus 15:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: ml
  text: ഇങ്ങനെ, ഇസ്രായേൽമക്കൾക്ക് അവരുടെ അശുദ്ധിയെക്കുറിച്ച് നിങ്ങൾ മുന്നറിയിപ്പ് നൽകണം; അങ്ങനെ, അവരുടെ മധ്യേയുള്ള എന്റെ തിരുനിവാസത്തെ അശുദ്ധമാക്കുന്നതിനാൽ അവർ തങ്ങളുടെ അശുദ്ധിയിൽ മരിക്കാതിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇസ്രായേൽമക്കൾ” എന്നതിന് “ഇസ്രായേല്യർ” എന്നും വിവർത്തനം ചെയ്യാം.'
    reason: ബְּנֵי יִשְׂרָאֵל എന്ന സ്ഥിരസമൂഹനാമത്തിന് സ്വാഭാവികമായ മലയാള പര്യായം സൂചിപ്പിക്കുന്നു; പ്രധാനപാഠത്തിലെ ഉറവിടാനുസൃതമായ രൂപം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: നിങ്ങൾ അകറ്റിനിർത്തണം
  rationale: זהר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ഇവിടെ മുന്നറിയിപ്പ് നൽകി അശുദ്ധിയിൽനിന്ന് വിട്ടുനിൽപ്പിക്കുക/വേർതിരിക്കുക എന്ന പ്രതിരോധാത്മക അർഥമുണ്ട്. തുടർന്നുള്ള מִן ചേർന്ന പ്രയോഗവുമായി ‘അകറ്റിനിർത്തണം’ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഉടമ്പടിസമൂഹനാമം മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ സംയുക്തരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִטֻּמְאָתָם
  choice: അവരുടെ അശുദ്ധിയിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അടിസ്ഥാനബന്ധം നിലനിർത്തുകയും അശുദ്ധിയിൽനിന്നുള്ള വേർതിരിക്കൽ എന്ന വായന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: טֻמְאָה
  choice: അശുദ്ധി
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ അശുദ്ധിയുടെ സാങ്കേതിക വിഭാഗം മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; അതിനെ പാപം എന്ന നൈതിക വിഭാഗമാക്കി മാറ്റുന്നില്ല.
- source_word: וְלֹא יָמֻתוּ
  choice: അല്ലെങ്കിൽ ... അവർ മരിച്ചുപോകും
  rationale: മുന്നറിയിപ്പിന്റെ പ്രതിരോധലക്ഷ്യവും അനുസരിക്കാതിരുന്നാൽ ഉണ്ടാകുന്ന മരണഭീഷണിയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּטֻמְאָתָם
  choice: തങ്ങളുടെ അശുദ്ധിയിൽ
  rationale: മരണം സംഭവിക്കുന്ന അവസ്ഥയെയോ സാഹചര്യത്തെയോ സൂചിപ്പിക്കുന്ന ב എന്ന ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְּטַמְּאָם
  choice: അവർ അശുദ്ധമാക്കുമ്പോൾ
  rationale: טמא എന്ന ക്രിയയുടെ കാരകഭാവവും ב സൂചിപ്പിക്കുന്ന സാഹചര്യബന്ധവും വ്യക്തമായി നൽകുന്നു; ‘മലിനപ്പെടുത്തുക’ എന്നത് നൈതികവൽക്കരിക്കാനിടയുള്ളതിനാൽ ഒഴിവാക്കി.
- source_word: מִשְׁכָּנִי
  choice: എന്റെ തിരുനിവാസത്തെ
  rationale: מִשְׁכָּן എന്നത് ദൈവത്തിന്റെ വിശുദ്ധ വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ‘തിരുനിവാസം’ കൂടാരരൂപത്തിലുള്ള വിശുദ്ധ വാസസ്ഥലം എന്ന ആശയം ഗൗരവത്തോടെയും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: അവരുടെ മധ്യേയുള്ള
  rationale: ഇസ്രായേൽസമൂഹത്തിന്റെ നടുവിലുള്ള ദൈവസാന്നിധ്യത്തെ ഹീബ്രുവിനോട് അടുത്തും സംക്ഷിപ്തമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ അശുദ്ധി
  choice: טֻמְאָה എന്നത് ‘അശുദ്ധി’ എന്നു പരിഭാഷപ്പെടുത്തി ആചാരപരമായ അർഥം നിലനിർത്തി.
  alternative: മലിനത; പാപം
  rationale: ഈ വാക്യം പൊതുവായ നൈതിക കുറ്റത്തെക്കാൾ ദൈവത്തിന്റെ തിരുനിവാസത്തെ ബാധിക്കുന്ന ആചാരപരമായ അശുദ്ധിയെയും അതിൽനിന്നുള്ള അപകടത്തെയും കുറിച്ചാണ്.
- issue: זהר എന്ന ക്രിയയുടെയും מִן ഉപസർഗത്തിന്റെയും ബന്ധം
  choice: ‘അശുദ്ധിയിൽനിന്ന് ... അകറ്റിനിർത്തണം’ എന്ന വേർതിരിക്കൽഭാവം സ്വീകരിച്ചു.
  alternative: ‘അശുദ്ധിയെക്കുറിച്ച് ... മുന്നറിയിപ്പ് നൽകണം’
  rationale: ഹിഫീൽ രൂപം മുന്നറിയിപ്പിന്റെ ആശയം ഉൾക്കൊള്ളാമെങ്കിലും, മസോററ്റിക് പാഠത്തിലെ מִן ‘നിന്ന്’ എന്ന വേർതിരിക്കൽബന്ധത്തിനും പ്രാചീന വിവർത്തനപാരമ്പര്യത്തിൽ പ്രതിഫലിക്കുന്ന അകറ്റിനിർത്തൽഭാവത്തിനും പ്രധാന്യം നൽകുന്നു; വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: മരണവും തിരുനിവാസത്തിന്റെ അശുദ്ധീകരണവും തമ്മിലുള്ള ബന്ധം
  choice: അശുദ്ധാവസ്ഥയിൽ തിരുനിവാസത്തെ അശുദ്ധമാക്കുന്നതിന്റെ ഫലമായ മരണഭീഷണിയായി വാചകം നിലനിർത്തി.
  alternative: ആചാരപരമായ അശുദ്ധിയിലായിരിക്കുന്നത് മാത്രം മരണത്തിന്റെ നേരിട്ടുള്ള കാരണം എന്ന വായന
  rationale: בְּטַמְּאָם എന്ന ഘടകം തിരുനിവാസത്തെ അശുദ്ധമാക്കുന്ന പ്രവൃത്തിയെ മരണഭീഷണിയോട് ബന്ധിപ്പിക്കുന്നു; ഈ ബന്ധം വിവർത്തനത്തിൽ മറച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമപരമായ ശൈലി ഉപയോഗിച്ചു. ‘ഇസ്രായേൽമക്കൾ’, ‘അശുദ്ധി’, ‘തിരുനിവാസം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ലേവ്യപുസ്തകത്തിന്റെ ആചാരപരമായ പശ്ചാത്തലം നിലനിർത്തുന്നതുമാണ്. പ്രധാനവാക്യത്തിൽ സ്രോതസ്സിലെ വേർതിരിക്കൽഭാവം സ്വീകരിച്ചെങ്കിലും മുന്നറിയിപ്പെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
