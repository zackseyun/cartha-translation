    rationale: ഈ നിയമസന്ദർഭത്തിലും നൽകിയ ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിലും ഹിഫീൽ രൂപം മുന്നറിയിപ്പ്/ഉപദേശം നൽകുക എന്നാണ്. വേർതിരിച്ചുനിർത്തൽ എന്ന സാധ്യതയെ പ്രധാനപാഠമാക്കുന്നത് പ്രവർത്തികർത്തവ്യത്തെയും വാക്യത്തിന്റെ പ്രതിരോധലക്ഷ്യത്തെയും മാറ്റുന്നു.
