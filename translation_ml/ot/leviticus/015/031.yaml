revisions:
- from: അതിനാൽ ഇസ്രായേൽമക്കളെ അവരുടെ അശുദ്ധിയിൽനിന്ന് നിങ്ങൾ അകറ്റിനിർത്തണം[a]; അല്ലെങ്കിൽ, അവരുടെ മധ്യേയുള്ള എന്റെ തിരുനിവാസത്തെ അവർ അശുദ്ധമാക്കുമ്പോൾ, തങ്ങളുടെ അശുദ്ധിയിൽ അവർ മരിച്ചുപോകും.
  to: ഇങ്ങനെ, ഇസ്രായേൽമക്കൾക്ക് അവരുടെ അശുദ്ധിയെക്കുറിച്ച് നിങ്ങൾ മുന്നറിയിപ്പ് നൽകണം; അങ്ങനെ, അവരുടെ മധ്യേയുള്ള എന്റെ തിരുനിവാസത്തെ അശുദ്ധമാക്കുന്നതിനാൽ അവർ തങ്ങളുടെ അശുദ്ധിയിൽ മരിക്കാതിരിക്കും.[a]
  rationale: ഹീബ്രു വാക്യക്രമവും അർഥബന്ധവും അനുസരിച്ച് הִזַּרְתֶּם ‘മുന്നറിയിപ്പ് നൽകണം’ എന്നു തിരുത്തി; מִטֻּמְאָתָם ‘അവരുടെ അശുദ്ധിയെക്കുറിച്ച്’ എന്നു നൽകി. ‘അല്ലെങ്കിൽ’ ഒഴിവാക്കി ഉദ്ദേശ്യബന്ധമായ ‘അങ്ങനെ ... മരിക്കാതിരിക്കും’ നിലനിർത്തി. בְּטַמְּאָם എת־מִשְׁכָּנִי എന്ന ഘടകത്തിന്റെ കാരണം/സാഹചര്യബന്ധം ‘എന്റെ തിരുനിവാസത്തെ അശുദ്ധമാക്കുന്നതിനാൽ’ എന്നു പ്രകടമാക്കി. ‘അശുദ്ധി’യും ‘തിരുനിവാസം’യും ആചാരപരമായ പദാവലി സംരക്ഷിക്കുന്നു.
