  source_fidelity: പ്രധാനപാഠത്തിലെ ‘അശുദ്ധിയിൽനിന്ന് ... അകറ്റിനിർത്തണം’ എന്നത് וְהִזַּרְתֶּם എന്ന ഹിഫീൽ ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ മുഖ്യമായ ‘മുന്നറിയിപ്പ് നൽകുക’ എന്ന അർഥത്തിൽനിന്ന് മാറുന്നു. מִן ഇവിടെ മുന്നറിയിപ്പിന്റെ വിഷയത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു. കൂടാതെ ‘അല്ലെങ്കിൽ’ എന്ന ഘടന ഹീബ്രുവിലെ ഉദ്ദേശ്യ/പ്രതിരോധബന്ധത്തെ വ്യവസ്ഥാപരമായ ഫലവാക്യമായി മാറ്റുന്നു.
  naturalness: ‘അകറ്റിനിർത്തണം’ സ്വാഭാവികമായ മലയാളമാണെങ്കിലും ഈ വാക്യത്തിൽ തെറ്റായ പ്രധാന അർഥം നൽകുന്നു. ‘അവരുടെ അശുദ്ധിയെക്കുറിച്ച് ... മുന്നറിയിപ്പ് നൽകണം’ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും നിയമപരമായ ഗൗരവശൈലിക്ക് യോജിച്ചതുമാണ്. മരണവും തിരുനിവാസത്തെ അശുദ്ധമാക്കുന്നതുമായ ബന്ധം ‘അശുദ്ധമാക്കുന്നതിനാൽ’ എന്നു നൽകുന്നത് വ്യക്തമാണ്.
  terminology: ‘ഇസ്രായേൽമക്കൾ,’ ‘അശുദ്ധി,’ ‘തിരുനിവാസം’ എന്നിവ ആചാരപരമായ സന്ദർഭവും യോജിച്ച ഗൗരവരജിസ്റ്ററും നിലനിർത്തുന്നു. ‘അശുദ്ധി’യെ നൈതിക പാപമായി വ്യാഖ്യാനിക്കുന്നില്ല.
