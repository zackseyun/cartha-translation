language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֹ֛את תִּהְיֶ֥ה טֻמְאָת֖/וֹ בְּ/זוֹב֑/וֹ רָ֣ר בְּשָׂר֞/וֹ אֶת זוֹב֗/וֹ אֽוֹ הֶחְתִּ֤ים בְּשָׂר/וֹ֙ מִ/זּוֹב֔/וֹ טֻמְאָת֖/וֹ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: ml
  text: 'അവന്റെ സ്രവം മൂലമുള്ള അശുദ്ധി ഇതായിരിക്കും: അവന്റെ ശരീരത്തിൽനിന്ന് സ്രവം ഒഴുകിക്കൊണ്ടിരുന്നാലും[a], അല്ലെങ്കിൽ സ്രവം പുറത്തുവരാതെ അവന്റെ ശരീരം അടഞ്ഞുകിടന്നാലും, അത് അവന്റെ അശുദ്ധിയാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അവന്റെ മാംസം അവന്റെ സ്രവം ഒഴുക്കിയാലും ... അവന്റെ മാംസം അവന്റെ സ്രവത്തിൽനിന്ന് അടഞ്ഞുകിടന്നാലും.’ ഇവിടെ ‘മാംസം’ സ്രവവുമായി ബന്ധപ്പെട്ട ശരീരത്തെയോ ശരീരഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: അവന്റെ അശുദ്ധി
  rationale: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധിനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ ഈ പദം ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അശുദ്ധി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: זוֹב
  choice: സ്രവം
  rationale: ഇവിടെ അസാധാരണമായ ശാരീരിക, പ്രത്യേകിച്ച് ജനനേന്ദ്രിയസംബന്ധമായ, ഒഴുക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സ്രവം’ വ്യക്തവും മാന്യമായ വൈദ്യശാസ്ത്രസ്വഭാവമുള്ളതുമായ പദമാണ്.
- source_word: רָר
  choice: ഒഴുകിക്കൊണ്ടിരുന്നാലും
  rationale: സ്രവം ശരീരത്തിൽനിന്ന് സജീവമായി പുറത്തുവരുന്നതിനെ ക്രിയ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ തുടർച്ചയായ അവസ്ഥയും ‘אוֹ’ അടയാളപ്പെടുത്തുന്ന രണ്ടു സാധ്യതകളുടെ ഘടനയും ഇതിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: בְּשָׂרוֹ
  choice: അവന്റെ ശരീരം / അവന്റെ ശരീരത്തിൽനിന്ന്
  rationale: അക്ഷരാർഥം ‘അവന്റെ മാംസം’ എന്നാണെങ്കിലും ഇവിടെ സ്രവവുമായി ബന്ധപ്പെട്ട ശരീരഭാഗത്തെയോ ശാരീരികാവസ്ഥയെയോ ഉദ്ദേശിക്കുന്നു; ‘ശരീരം’ സാധാരണ വായനക്കാർക്ക് തെറ്റിദ്ധാരണയില്ലാതെ അർഥം നൽകുന്നു.
- source_word: הֶחְתִּים
  choice: പുറത്തുവരാതെ ... അടഞ്ഞിരുന്നാലും
  rationale: സ്രവം സ്വതന്ത്രമായി ഒഴുകുന്നതിന് വിപരീതമായി ശരീരം അടയുകയോ തടസ്സപ്പെടുകയോ ചെയ്ത അവസ്ഥയാണ് ഹിഫീൽ രൂപം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ‘പുറത്തുവരാതെ’ ചേർത്തിരിക്കുന്നു.
- source_word: מִזּוֹבוֹ
  choice: സ്രവം പുറത്തുവരാതെ
  rationale: מִן വേർപാട്/തടസ്സം എന്ന ബന്ധം പ്രകടമാക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവികമായ ‘സ്രവത്തിൽനിന്ന്’ എന്നതിനുപകരം സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְזֹאת תִּהְיֶה
  choice: ഇതായിരിക്കും
  rationale: നിയമപ്രഖ്യാപനത്തിന്റെ ഭാവികാലസ്വഭാവം നിലനിർത്തുന്നു; ആരംഭത്തിലെ וְ മലയാളത്തിൽ നിർബന്ധമായി വേറെ ‘എന്നാൽ/കൂടാതെ’ എന്ന് വിവർത്തനം ചെയ്യാതെ സ്വാഭാവിക വാക്യബന്ധത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: אוֹ
  choice: '...ആലും ...ആലും'
  rationale: രണ്ടു വ്യത്യസ്ത അവസ്ഥകളിലും ഒരേ അശുദ്ധിനിർണ്ണയം ബാധകമാണെന്ന നിയമപരമായ ഘടന മലയാളത്തിലെ സമാന്തര concessive രൂപങ്ങളിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: ‘അശുദ്ധി’ എന്ന ആചാരനിയമപരമായ വിഭാഗമായി മാത്രം അവതരിപ്പിച്ചു
  alternative: ധാർമ്മിക പാപമോ വ്യക്തിപരമായ കുറ്റമോ സൂചിപ്പിക്കുന്ന ഭാഷ
  rationale: טֻמְאָה ഇവിടെ ലേവ്യശുദ്ധിനിയമത്തിലെ ആചാരപരമായ നിലയാണ്; മൂലപാഠം പറയാത്ത ധാർമ്മിക കുറ്റബോധം വിവർത്തനത്തിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമ-വൈദ്യശാസ്ത്ര ഭാവം സ്വീകരിച്ചു. അസ്വാഭാവികമായ അക്ഷരാനുവാദം ഒഴിവാക്കിയെങ്കിലും ‘ഒഴുകുക/അടയുക’ എന്ന ഹീബ്രു വിരുദ്ധതയും ആചാരപരമായ അശുദ്ധി എന്ന വിഭാഗവും നിലനിർത്തി.
