source:
  edition: WLC
  text: וְ/כִֽי יִטְהַ֤ר הַ/זָּב֙ מִ/זּוֹב֔/וֹ וְ/סָ֨פַר ל֜/וֹ שִׁבְעַ֥ת יָמִ֛ים לְ/טָהֳרָת֖/וֹ וְ/כִבֶּ֣ס בְּגָדָ֑י/ו וְ/רָחַ֧ץ בְּשָׂר֛/וֹ בְּ/מַ֥יִם חַיִּ֖ים וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: ml
  text: സ്രവമുള്ള പുരുഷൻ തന്റെ സ്രവത്തിൽനിന്ന് ശുദ്ധനായാൽ, തന്റെ ശുദ്ധീകരണത്തിനായി അവൻ ഏഴു ദിവസം എണ്ണണം; തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും ജീവജലത്തിൽ[a] ശരീരം കഴുകുകയും വേണം. അപ്പോൾ അവൻ ശുദ്ധനാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, ‘ജീവിക്കുന്ന വെള്ളം’; അതായത്, ഉറവിൽനിന്നുള്ളതോ ഒഴുകുന്നതോ ആയ വെള്ളം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: സ്രവബാധയുള്ള പുരുഷൻ
  rationale: ഈ അധ്യായത്തിൽ വിവരിക്കുന്ന അസാധാരണമായ ശാരീരിക സ്രവമുള്ള പുരുഷനെയാണ് ഹീബ്രു പദം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വ്യക്തവും മാന്യവും വൈദ്യശാസ്ത്രപരമായി നിഷ്പക്ഷവുമായ പ്രയോഗമാണിത്.
- source_word: יִטְהַר ... מִזּוֹבוֹ
  choice: തന്റെ സ്രവത്തിൽനിന്ന് ശുദ്ധനായാൽ
  rationale: സ്രവം അവസാനിച്ചതിനെത്തുടർന്ന് ആചാരപരമായ ശുദ്ധിയിലേക്കു വരുന്നതാണ് സന്ദർഭം. മൂലപാഠത്തിലെ ‘സ്രവത്തിൽനിന്ന്’ എന്ന ബന്ധവും ശുദ്ധി എന്ന ആചാരപരമായ വിഭാഗവും നിലനിർത്തുന്നു.
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים
  choice: അവൻ ഏഴു ദിവസം എണ്ണണം
  rationale: തുടർന്നുള്ള ആചാരനടപടിയായ നിർദേശം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְטָהֳרָתוֹ
  choice: തന്റെ ശുദ്ധീകരണത്തിനായി
  rationale: നൈതിക കുറ്റമോ പാപമോ സൂചിപ്പിക്കാതെ ആചാരപരമായ ശുദ്ധീകരണപ്രക്രിയയെ വ്യക്തമാക്കുന്നു.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും
  rationale: വസ്ത്രങ്ങൾ കഴുകുക എന്ന പ്രത്യേക പ്രവൃത്തിക്ക് സ്വാഭാവികമായ മലയാളപദം ‘അലക്കുക’ ആണ്.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: ശരീരം കഴുകുകയും
  rationale: בשר എന്നതിന്റെ അക്ഷരാർഥം ‘മാംസം’ ആണെങ്കിലും ഇവിടെ ശരീരം മുഴുവൻ കഴുകുന്നതാണ് ഉദ്ദേശ്യം; ‘ശരീരം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בְּמַיִם חַיִּים
  choice: ജീവജലത്തിൽ
  rationale: ‘ജീവിക്കുന്ന വെള്ളം’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപകസ്വഭാവം സൂക്ഷിക്കുന്ന അടുത്ത വിവർത്തനമാണിത്; ഇവിടെ ഉറവിലെയോ ഒഴുകുന്നതോ ആയ ശുദ്ധജലമാണ് പ്രായോഗിക അർഥമെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: וְטָהֵר
  choice: അപ്പോൾ അവൻ ശുദ്ധനാകും
  rationale: ആചാരക്രമത്തിന്റെ ഫലമായി ലഭിക്കുന്ന ശുദ്ധാവസ്ഥയെ വ്യക്തമാക്കുന്നു; ‘അപ്പോൾ’ നടപടിക്രമത്തിന്റെ ക്രമവും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ആചാരശുദ്ധിയുടെ ഭാഷ നൈതിക കുറ്റബോധമായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കുക
  choice: ‘ശുദ്ധൻ/ശുദ്ധീകരണം’ എന്ന പദങ്ങൾ ആചാരപരമായ അർഥത്തിൽ ഉപയോഗിച്ചു
  alternative: ‘നിർമലൻ/പരിശുദ്ധൻ’ എന്നിങ്ങനെ വിവർത്തനം ചെയ്യുക
  rationale: ലേവ്യപുസ്തകം 15-ലെ അശുദ്ധി ശാരീരിക സ്രവവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ നിലയാണ്; വ്യക്തിപരമായ പാപമോ നൈതിക മലിനതയോ ഈ വാക്യം പ്രസ്താവിക്കുന്നില്ല.
- issue: מַיִם חַיִּים എന്ന പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും പ്രായോഗിക അർഥവും
  choice: മുഖ്യപാഠത്തിൽ ‘ജീവജലം’ നിലനിർത്തി അടിക്കുറിപ്പിൽ ‘പുതിയതോ ഒഴുകുന്നതോ ആയ വെള്ളം’ എന്ന് വിശദീകരിച്ചു
  alternative: മുഖ്യപാഠത്തിൽ നേരിട്ട് ‘ഒഴുകുന്ന ശുദ്ധജലം’ എന്ന് നൽകുക
  rationale: മൂലത്തിലെ സജീവമായ പ്രയോഗം സംരക്ഷിക്കുമ്പോഴും പിൽക്കാല ദൈവശാസ്ത്രപരമായ അർഥം ഇവിടെ അനാവശ്യമായി ചുമത്താതെ സന്ദർഭാർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ നിയമപരവും ആചാരപരവുമായ ഗൗരവം നിലനിർത്തുന്ന ഭാഷ ഉപയോഗിച്ചു. ‘സ്രവബാധയുള്ള പുരുഷൻ’ എന്നത് പുരുഷസംബന്ധിയായ സന്ദർഭം വ്യക്തമായി സൂക്ഷിക്കുന്നു; ‘ശുദ്ധൻ’ എന്നത് ഇവിടെ ആചാരപരമായ നിലയെയാണ് സൂചിപ്പിക്കുന്നത്.
