id: LEV.15.5
reference: Leviticus 15:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּ/מִשְׁכָּב֑/וֹ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: ml
  text: അവന്റെ കിടക്ക[a] തൊടുന്ന ഒരു പുരുഷൻ തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും വെള്ളത്തിൽ കുളിക്കുകയും വേണം; അവൻ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ കിടന്ന സ്ഥലം.’ ഹീബ്രു പദം നിർമ്മിച്ച കിടക്കയെ മാത്രമല്ല, ഒരാൾ കിടന്ന സ്ഥലത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ശുദ്ധിനിയമങ്ങൾ പ്രകാരം ആചാരപരമായി അശുദ്ധൻ.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  choice: പുരുഷൻ
  rationale: אִישׁ ഏകവചന പുല്ലിംഗമായതിനാൽ നിയമസന്ദർഭത്തിലെ ലിംഗസൂചന നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി ബന്ധവാക്യത്തോടൊപ്പം ഉപയോഗിച്ചു.
- source_word: יִגַּע
  choice: തൊടുന്ന
  rationale: נגע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘തൊടുക’ ആചാരപരമായ സമ്പർക്കസന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: בְּ/מִשְׁכָּב/וֹ
  choice: അവന്റെ കിടക്ക
  rationale: מִשְׁכָּב കിടക്കയെയോ ഒരാൾ കിടന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കാം. പ്രധാന പാഠത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ‘കിടക്ക’ നൽകി, വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: തന്റെ വസ്ത്രങ്ങൾ അലക്കി
  rationale: כִּבֵּס വസ്ത്രം കഴുകുന്നതിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; ‘അലക്കുക’ മലയാളത്തിൽ ഈ വ്യത്യാസം വ്യക്തമായി നൽകുന്നു. കർത്താവിലേക്കു തിരിച്ചുനിൽക്കുന്ന സർവനാമത്തിന് ‘തന്റെ’ സ്വാഭാവികമാണ്.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: വെള്ളത്തിൽ കുളിക്കണം
  rationale: רחץ ഇവിടെ ശരീരം കഴുകുന്നതാണ്; ‘കുളിക്കുക’ അതിനെ വ്യക്തമായി അറിയിക്കുന്നു. בַּמַּיִם എന്നത് ‘വെള്ളത്തിൽ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: וְ/טָמֵא
  choice: അവൻ അശുദ്ധനായിരിക്കും
  rationale: טָמֵא ഇവിടെ ധാർമിക കുറ്റമല്ല, ശുദ്ധിനിയമങ്ങളിലെ ആചാരപരമായ നിലയാണ്. ‘അശുദ്ധൻ’ എന്ന പരമ്പരാഗതവും കൃത്യവുമായ പദം നിലനിർത്തി.
- source_word: עַד הָ/עָרֶב
  choice: സന്ധ്യവരെ
  rationale: അശുദ്ധാവസ്ഥയുടെ സമയപരിധി മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായി നൽകുന്നു.
theological_decisions:
- issue: ലേവ്യശുദ്ധിനിയമത്തിലെ ‘അശുദ്ധൻ’ എന്നതിന്റെ സ്വഭാവം
  choice: പ്രധാന പാഠത്തിൽ ‘അശുദ്ധനായിരിക്കും’ എന്നു നിലനിർത്തി; ആചാരപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ആചാരപരമായി അശുദ്ധനായിരിക്കും’ എന്നു പ്രധാന പാഠത്തിൽ വികസിപ്പിക്കുക.
  rationale: ഹീബ്രു טָמֵא ഈ സന്ദർഭത്തിൽ ആരാധനാ-ശുദ്ധിനിയമങ്ങളിലെ നിലയെ സൂചിപ്പിക്കുന്നു; ധാർമിക കുറ്റം ആരോപിക്കുന്നില്ല. എന്നാൽ മൂലപാഠത്തിലെ സംക്ഷിപ്ത വിഭാഗനാമം പ്രധാന പാഠത്തിൽ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘അലക്കണം/കുളിക്കണം’ എന്ന നിർബന്ധരൂപവും ‘അശുദ്ധനായിരിക്കും’ എന്ന നിലാവിവരണവും ഹീബ്രുവിലെ ക്രിയാഭേദം സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
