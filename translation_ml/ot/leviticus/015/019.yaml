id: LEV.15.19
reference: Leviticus 15:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: ml
  text: ഒരു സ്ത്രീക്കു സ്രാവമുണ്ടാകുകയും അവളുടെ ശരീരത്തിലെ സ്രാവം രക്തമായിരിക്കുകയും ചെയ്താൽ[a], അവൾ ഏഴു ദിവസം ആർത്തവ അശുദ്ധിയിൽ കഴിയണം[b]. അവളെ തൊടുന്ന ഏവനും സന്ധ്യവരെ അശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി: “അവളുടെ മാംസത്തിൽ.” ഇവിടെ അത് അവളുടെ ശരീരത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “ആർത്തവ അശുദ്ധി” എന്നത് ലേവ്യനിയമപ്രകാരമുള്ള ആചാരപരമായ അശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; അത് നിർബന്ധമായും ധാർമ്മിക തെറ്റിനെയോ പാപത്തെയോ സൂചിപ്പിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: സ്രാവമുണ്ടാകുക / അവളുടെ സ്രാവം
  rationale: זוּב എന്ന ധാതു ശരീരത്തിൽനിന്നുള്ള ഒഴുക്കിനെയോ സ്രാവത്തെയോ സൂചിപ്പിക്കുന്നു. ‘സ്രാവം’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വൈദ്യശാസ്ത്രപരമായി വ്യക്തവുമായ പദമാണ്; ഒരേ പദം ആവർത്തിക്കുന്നത് എബ്രായത്തിലെ പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: דָּם
  choice: രക്തം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ അർഥം.
- source_word: בִּבְשָׂרָהּ
  choice: അവളുടെ ശരീരത്തിലെ
  rationale: בשר എന്നതിന് അക്ഷരാർഥത്തിൽ ‘മാംസം’ എന്നുണ്ടെങ്കിലും ഇവിടെ സ്ത്രീയുടെ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ב എന്ന ഉപസർഗത്തിന്റെ ‘ൽ/യിൽ’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളത്തിനായി ‘ശരീരത്തിലെ’ എന്നു നൽകി.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: സംഖ്യാവാചക പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: בְנִדָּתָהּ
  choice: ആർത്തവ അശുദ്ധിയിൽ
  rationale: ലേവ്യപുസ്തകത്തിലെ נִדָּה ആർത്തവവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ആർത്തവ അശുദ്ധി’ ജൈവസംഭവവും നിയമപരമായ ആചാരസ്ഥിതിയും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָל־הַנֹּגֵעַ בָּהּ
  choice: അവളെ തൊടുന്ന ഏവനും
  rationale: כל സഹിതമുള്ള കർത്തൃവാചക കൃദന്തം പൊതുവായ, വ്യവസ്ഥാപരമായ പ്രസ്താവനയാണ്; ‘ഏവനും’ അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יִטְמָא
  choice: അശുദ്ധനായിരിക്കും
  rationale: טמא എന്നത് ഇവിടെ ലേവ്യനിയമപ്രകാരമുള്ള ആചാരപരമായ അശുദ്ധാവസ്ഥയാണ്. ഭാവികാലരൂപം നിയമത്തിന്റെ ഫലം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: കാലപരിധി ചുരുക്കമായും സ്വാഭാവികമായും കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ആചാരപരമായ അശുദ്ധിയെ ധാർമ്മിക കുറ്റമായി തെറ്റിദ്ധരിക്കാതിരിക്കുക
  choice: മുഖ്യപാഠത്തിൽ ‘അശുദ്ധി/അശുദ്ധൻ’ നിലനിർത്തി അടിക്കുറിപ്പിൽ അത് ആചാരപരമായ നിലയാണെന്ന് വ്യക്തമാക്കുക
  alternative: ‘മലിനത/മലിനൻ’ അല്ലെങ്കിൽ വിശദീകരണം കൂടാതെ ‘അശുദ്ധി’ മാത്രം ഉപയോഗിക്കുക
  rationale: ലേവ്യപുസ്തകം 15-ലെ പദാവലി ആചാരപരമായ ശുദ്ധി-അശുദ്ധി നിലകളെക്കുറിച്ചാണ്; ഈ വാക്യം സ്വതവേ ധാർമ്മിക കുറ്റബോധമോ വ്യക്തിപരമായ പാപമോ ആരോപിക്കുന്നില്ല. അതിനാൽ പരമ്പരാഗത നിയമപദം നിലനിർത്തുകയും അതിന്റെ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നവിധം സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി സ്വീകരിച്ചു. ശരീരപ്രക്രിയയെ യൂഫെമിസത്തിലൂടെ മറച്ചുവയ്ക്കാതെ ‘സ്രാവം’, ‘രക്തം’, ‘ആർത്തവം’ എന്നീ വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചു; അതേസമയം ആചാരപരമായ അശുദ്ധിയും ധാർമ്മിക കുറ്റവും തമ്മിലുള്ള വ്യത്യാസം സംരക്ഷിച്ചു.
