id: LEV.15.27
reference: Leviticus 15:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל הַ/נּוֹגֵ֥עַ בָּ֖/ם יִטְמָ֑א וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: ml
  text: അവയെ തൊടുന്ന ഏവനും അശുദ്ധനാകും[a]. അവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകുകയും വെള്ളത്തിൽ കുളിക്കുകയും വേണം; സന്ധ്യവരെ അവൻ അശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, മുൻസന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന അവളുടെ അശുദ്ധിയുമായി ബന്ധപ്പെട്ട വസ്തുക്കൾ—അവൾ കിടക്കുകയോ ഇരിക്കുകയോ ചെയ്ത വസ്തുക്കൾ പോലുള്ളവ.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: അവയെ തൊടുന്ന ഏവനും
  rationale: כָּל എന്ന പദവും നാമമായി പ്രവർത്തിക്കുന്ന נגע എന്ന വർത്തമാനകൃദ്‌രൂപവും ചേർന്ന് പൊതുവായ സർവവ്യാപക പ്രയോഗം നൽകുന്നു. ‘ഏവനും’ അതിന്റെ സമഗ്രത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּם
  choice: അവയെ
  rationale: മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം മുൻസന്ദർഭത്തിലെ സ്ത്രീയുടെ അശുദ്ധിയുമായി ബന്ധപ്പെട്ട കിടക്കയെയും ഇരിപ്പിടത്തെയും പോലുള്ള വസ്തുക്കളിലേക്കാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യവാക്യത്തിൽ സൂചനയുടെ അവ്യക്തത കൂട്ടിവ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: יִטְמָא
  choice: അശുദ്ധനാകും
  rationale: ലേവ്യപുസ്തകത്തിലെ ഈ സന്ദർഭത്തിൽ טמא ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു; ധാർമിക പാപമോ കളങ്കമോ എന്ന് തെറ്റിദ്ധരിപ്പിക്കാത്ത പ്രയോഗമാണിത്.
- source_word: וְ/כִבֶּס בְּגָדָיו
  choice: അവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകുകയും വേണം
  rationale: כבס വസ്ത്രങ്ങൾ അലക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വസ്ത്രങ്ങൾ കഴുകുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְ/רָחַץ בַּמַּיִם
  choice: വെള്ളത്തിൽ കുളിക്കുകയും വേണം
  rationale: ഈ ആചാരപരമായ സന്ദർഭത്തിൽ רחץ ശരീരം വെള്ളത്തിൽ കഴുകുന്നതാണ്. ‘കുളിക്കുക’ എന്നത് പൊതുവായ ‘കഴുകുക’ എന്നതിനേക്കാൾ ഈ അർഥം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: സന്ധ്യവരെ അവൻ അശുദ്ധനായിരിക്കും
  rationale: ഈ ഉപവാക്യം ആചാരപരമായ അശുദ്ധിയുടെ കാലപരിധി വ്യക്തമാക്കുന്നു. ‘സന്ധ്യവരെ’ സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
theological_decisions:
- issue: ലേവ്യപുസ്തകത്തിലെ അശുദ്ധി ഭാഷയുടെ സ്വഭാവം
  choice: טמא എന്നത് ആചാരപരമായ അശുദ്ധിയായി ‘അശുദ്ധൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കളങ്കപ്പെട്ടവൻ’ അല്ലെങ്കിൽ ധാർമികമായി മലിനനായവൻ എന്ന അർഥം നൽകുക.
  rationale: സന്ദർഭം ആചാരശുദ്ധിയെക്കുറിച്ചുള്ള നിയമമാണ്. വെറും സ്പർശനം ധാർമിക പാപമാണെന്ന് സൂചിപ്പിക്കാതെ മൂലപാഠത്തിലെ ആരാധനാചാരപരമായ വിഭാഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഹീബ്രു വാക്യത്തിന്റെ നിയമപരമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ബാധ്യത സൂചിപ്പിക്കുന്ന ‘വേണം’ പ്രയോഗിച്ചു; അവസാന ഉപവാക്യത്തിലെ കാലപരിധി വ്യക്തമായി നിലനിർത്തി.
