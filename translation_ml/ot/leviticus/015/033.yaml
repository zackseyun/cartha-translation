  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: ml
  text: ആർത്തവ അശുദ്ധിയിൽ അസ്വാസ്ഥ്യമുള്ള സ്ത്രീയെക്കുറിച്ചും[a], സ്രവമുള്ളയാളെക്കുറിച്ചും—പുരുഷനായാലും സ്ത്രീയായാലും—അശുദ്ധയായ[b] ഒരു സ്ത്രീയോടുകൂടെ ശയിക്കുന്ന പുരുഷനെക്കുറിച്ചും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആർത്തവമുള്ള സ്ത്രീ’; ഇവിടെ ‘അസ്വാസ്ഥ്യമുള്ള സ്ത്രീ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രുപദം അവളുടെ ആർത്തവാവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്യത്തിലെ ‘അശുദ്ധ’ എന്നത് ലേവ്യനിയമപ്രകാരമുള്ള ആചാരപരമായ അശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്; നൈതിക അശുദ്ധിയെയല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה
  choice: അസ്വാസ്ഥ്യമുള്ള സ്ത്രീ
  rationale: ഈ പദം ശാരീരിക അസ്വാസ്ഥ്യത്തിലോ ദുർബലാവസ്ഥയിലോ ഉള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘ആർത്തവ അശുദ്ധിയിൽ’ എന്ന പ്രയോഗം ആ അവസ്ഥയുടെ സ്വഭാവം വ്യക്തമാക്കുന്നു. പദത്തെ വെറും ‘ആർത്തവമുള്ള സ്ത്രീ’ എന്നു ആവർത്തനമായി ചുരുക്കാതെ അതിന്റെ അടിസ്ഥാന അർഥഭേദം നിലനിർത്തുന്നു.
- source_word: בְּנִדָּתָהּ
  choice: ആർത്തവ അശുദ്ധിയിൽ
  rationale: ലേവ്യപുസ്തകത്തിലെ ശുദ്ധി-അശുദ്ധി നിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ נִדָּה ആർത്തവവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു.
- source_word: הַזָּב אֶת־זוֹבוֹ
  choice: സ്രവമുള്ളയാൾ
  rationale: ഹീബ്രുവിലെ സമാനധാതുപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; പിന്നാലെയുള്ള ‘ആണായാലും പെണ്ണായാലും’ എന്ന വാക്കുകൾ ഇത് ഇരുവർക്കും ബാധകമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: ആണായാലും പെണ്ണായാലും
  rationale: മുൻപറഞ്ഞ സ്രവമുള്ള വ്യക്തിയുടെ വിഭാഗം പുരുഷനും സ്ത്രീക്കും ബാധകമാണെന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: യോടുകൂടെ ശയിക്കുന്ന
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു സൗമ്യോക്തിയുടെ മാന്യവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗമാണിത്.
- source_word: טְמֵאָה
  choice: അശുദ്ധയായ ഒരു സ്ത്രീ
  rationale: ഇവിടെ സ്ത്രീലിംഗ ഏകവചന വിശേഷണം ലേവ്യനിയമപ്രകാരമുള്ള ആചാരപരമായ അശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്; നൈതിക കളങ്കം സൂചിപ്പിക്കുന്ന ഭാഷ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ആചാരപരമായ ശുദ്ധി-അശുദ്ധി പദാവലി
  choice: נִדָּה, טְמֵאָה എന്നിവയെ ‘ആർത്തവ അശുദ്ധി’, ‘അശുദ്ധയായ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കളങ്കിത’, ‘മലിന’, അല്ലെങ്കിൽ നൈതിക അശുദ്ധി സൂചിപ്പിക്കുന്ന പദങ്ങൾ
  rationale: ഈ വാക്യം ലേവ്യനിയമത്തിലെ ആചാരപരമായ അവസ്ഥകളെക്കുറിച്ചാണ്; വ്യക്തിയുടെ നൈതിക മൂല്യത്തെ വിധിക്കുന്നില്ല. അതിനാൽ സാംസ്കാരികവും നിയമപരവുമായ അർഥപരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ ഹീബ്രുവിലെ ബന്ധകഘടന നിലനിർത്തി; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇതാണ് നിയമം’ പോലുള്ള സമാപനവാക്യം ചേർത്തിട്ടില്ല.
