id: LEV.15.10
reference: Leviticus 15:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: ml
  text: അവന്റെ കീഴിലുണ്ടായിരുന്ന ഏതൊന്നിലും തൊടുന്നവൻ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും[a]. അവയെ ചുമക്കുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ അലക്കി വെള്ളത്തിൽ കുളിക്കണം[b]; അവൻ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ കീഴിലുള്ള ഏതൊന്നിലും.’ എബ്രായം കൂടുതൽ അക്ഷരാർഥത്തിൽ വർത്തമാനകാലമായി പരിഭാഷപ്പെടുത്താം; എന്നാൽ ബാധിതനായ വ്യക്തിയുടെ കീഴിൽ മുമ്പുണ്ടായിരുന്ന വസ്തുക്കളെക്കുറിച്ചുള്ള നടപടിക്രമപരമായ സന്ദർഭത്തിന് ഭൂതകാലം കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവയെ’ എന്ന ബഹുവചന സർവനാമം, അവന്റെ കീഴിലുണ്ടായിരുന്നവയുമായി ബന്ധപ്പെട്ട അശുദ്ധമായ വസ്തുക്കളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: തൊടുന്നവൻ
  rationale: നגע എന്ന ക്രിയയുടെ കൃതന്തം ഇവിടെ നേരിട്ടുള്ള ശാരീരിക സ്പർശത്തെ സൂചിപ്പിക്കുന്നു; ആചാരപരമായ ശുദ്ധി-അശുദ്ധിയുടെ സന്ദർഭത്തിൽ ‘തൊടുന്നവൻ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: അവന്റെ കീഴിലുണ്ടായിരുന്ന ഏതൊന്നിലും
  rationale: തַחַת എന്നതിന്റെ സ്ഥലസംബന്ധിയായ അർഥം ‘കീഴിൽ’ എന്ന് നിലനിർത്തുന്നു. നടപടിക്രമപരമായ ഈ സന്ദർഭത്തിൽ, ബാധിതനായ വ്യക്തിയുടെ കീഴിൽ മുമ്പുണ്ടായിരുന്ന വസ്തുക്കളെയാണ് ഉദ്ദേശിക്കുന്നതെന്നതിനാൽ ഭൂതകാലരൂപം സ്വാഭാവികമാണ്; എങ്കിലും എബ്രായത്തിലെ കാലസംബന്ധിയായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יִטְמָא
  choice: അശുദ്ധനായിരിക്കും
  rationale: പുരോഹിതനിയമത്തിലെ טמא ആചാരപരമായ അശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘അശുദ്ധനായിരിക്കും’ നിയമവാക്യത്തിന്റെ ഫലവും അവസ്ഥയും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: കാലപരിധി മലയാളത്തിൽ സ്വാഭാവികമായും സംക്ഷിപ്തമായും വ്യക്തമാക്കുന്നു.
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: അവയെ ചുമക്കുന്നവൻ
  rationale: נשא ഇവിടെ വസ്തുക്കളെ എടുത്തുകൊണ്ടുപോകുക അഥവാ ചുമക്കുക എന്ന അർഥത്തിലാണ്. എബ്രായത്തിലെ ബഹുവചന സർവനാമം നിലനിർത്തി ‘അവയെ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ അലക്കി
  rationale: כבס വസ്ത്രങ്ങൾ കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വസ്ത്രങ്ങളോടൊപ്പം ‘അലക്കുക’ എന്നത് ഏറ്റവും സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וְרָחַץ בַּמַּיִם
  choice: വെള്ളത്തിൽ കുളിക്കണം
  rationale: רחץ ഈ ശുദ്ധീകരണസൂത്രത്തിൽ ശരീരം വെള്ളത്തിൽ കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കുളിക്കണം’ സാധാരണ വായനക്കാർക്ക് ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: അവൻ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും
  rationale: അലക്കുകയും കുളിക്കുകയും ചെയ്ത ശേഷവും സന്ധ്യവരെ തുടരുന്ന അശുദ്ധാവസ്ഥയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ നിയമപരവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ആചാരപരമായ ‘അശുദ്ധി’ എന്ന ആശയം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തി; എബ്രായത്തിലെ കാലസംബന്ധിയായ സാധ്യതയും ബഹുവചന സർവനാമത്തിന്റെ സൂചനയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
