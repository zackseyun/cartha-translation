id: LEV.15.4
reference: Leviticus 15:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֗ב אֲשֶׁ֨ר יִשְׁכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָ֑א וְ/כָֽל הַ/כְּלִ֛י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: ml
  text: സ്രവമുള്ള പുരുഷൻ കിടക്കുന്ന ഏതു കിടക്കയും അശുദ്ധമാകും; അവൻ ഇരിക്കുന്ന ഏതു വസ്തുവും[a] അശുദ്ധമാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘വസ്തു’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് ഉപകരണം, സാധനം, പാത്രം എന്നീ വിശാലമായ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: കിടക്ക
  rationale: מִשְׁכָּב എന്നത് കിടക്കാനുള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപദം ‘കിടക്ക’യാണ്.
- source_word: הַזָּב
  choice: സ്രവമുള്ള പുരുഷൻ
  rationale: זוּב എന്ന ധാതുവിൽനിന്നുള്ള ഈ പദം ഇവിടെ ശരീരസ്രവമുള്ള പുരുഷനെ സൂചിപ്പിക്കുന്നു; വാക്യത്തിലെയും സമീപസന്ദർഭത്തിലെയും പുല്ലിംഗ ഏകവചനരൂപങ്ങൾ അതിനെ പിന്തുണയ്ക്കുന്നു.
- source_word: יִשְׁכַּב עָלָיו
  choice: കിടക്കുന്ന
  rationale: എബ്രായത്തിലെ ‘അതിന്‍മേൽ കിടക്കുക’ എന്ന ബന്ധവാക്യം നിയമപ്രസ്താവനയ്ക്ക് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ നൽകി.
- source_word: יִטְמָא
  choice: അശുദ്ധമാകും
  rationale: טמא ഇവിടെ ആചാരപരമായ അശുദ്ധാവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അശുദ്ധമാകും’ നിയമപരമായ ഫലവും അവസ്ഥയും ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַכְּלִי
  choice: വസ്തു
  rationale: כְּלִי എന്നതിന് വസ്തു, ഉപകരണം, പാത്രം തുടങ്ങിയ വിശാലമായ അർഥപരിധിയുണ്ട്. ഒരാൾക്ക് ഇരിക്കാവുന്ന എന്തിനെയും ഇവിടെ ഉദ്ദേശിക്കാമെന്നതിനാൽ ‘വസ്തു’ സന്ദർഭത്തിന് ഏറ്റവും സ്വാഭാവികമാണ്; പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יֵשֵׁב עָלָיו
  choice: ഇരിക്കുന്ന
  rationale: ישׁב + עַל എന്നത് ‘അതിന്‍മേൽ ഇരിക്കുക’ എന്നാണ്. ആവർത്തിക്കുന്ന പൊതുനിയമത്തെ മലയാളത്തിൽ വർത്തമാനകാല ബന്ധരൂപം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: അശുദ്ധതയുടെ സ്വഭാവം
  choice: അശുദ്ധം
  alternative: ആചാരപരമായി അശുദ്ധം; മലിനം
  rationale: ഈ വാക്യം ധാർമിക കുറ്റത്തെക്കാൾ ലേവ്യശുദ്ധിനിയമത്തിലെ അവസ്ഥയെപ്പറ്റിയാണ്. ‘ആചാരപരമായി’ എന്ന് മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെയും ‘മലിനം’ എന്നതിലൂടെ ധാർമികദൂഷണത്തിന്റെ സൂചന വർധിപ്പിക്കാതെയും ‘അശുദ്ധം’ മൂലത്തിലെ വിഭാഗം നിലനിർത്തുന്നു.
- issue: വിഷയത്തിന്റെ ലിംഗസൂചന
  choice: സ്രവമുള്ള പുരുഷൻ / അവൻ
  alternative: സ്രവമുള്ളയാൾ
  rationale: എബ്രായപാഠത്തിലെ രൂപങ്ങൾ പുല്ലിംഗ ഏകവചനമാണ്; സമീപസന്ദർഭവും പുരുഷന്റെ ശരീരസ്രവത്തെയാണ് കൈകാര്യം ചെയ്യുന്നത്. അതിനാൽ ലിംഗസൂചന വ്യക്തമാക്കിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം. ‘ഏതു…യും’ എന്ന ഘടന כָּל എന്നതിന്റെ സമഗ്രതയും രണ്ടു സമാന്തര ഉപവാക്യങ്ങളുടെയും താളവും സംരക്ഷിക്കുന്നു.
