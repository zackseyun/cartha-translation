source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֖עַ בְּ/מִשְׁכָּבָ֑/הּ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: ml
  text: അവളുടെ കിടക്കയിൽ[a] തൊടുന്ന ഏവനും തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും വെള്ളത്തിൽ കുളിക്കുകയും വേണം; സന്ധ്യവരെ അയാൾ അശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കിടക്ക’ എന്നതിന് ‘അവൾ കിടക്കുന്ന സ്ഥലം’ അല്ലെങ്കിൽ ‘കിടക്കവിരി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം അവൾ കിടക്കുന്ന സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: തൊടുന്ന ഏവനും
  rationale: സാമാന്യമായി എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യാപ്തിയും വർത്തമാനകർത്തൃരൂപത്തിന്റെ പൊതുവായ നിയമസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּמִשְׁכָּבָהּ
  choice: അവളുടെ കിടക്കയിൽ
  rationale: מִשְׁכָּב എന്നത് കിടക്കുന്ന സ്ഥലം അഥവാ കിടക്കയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘കിടക്ക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും
  rationale: כבס പ്രത്യേകിച്ച് വസ്ത്രം കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ശരീരം കഴുകുന്നതിൽനിന്ന് വേർതിരിക്കാൻ ‘അലക്കുക’ ഉപയോഗിച്ചു.
- source_word: וְרָחַץ בַּמַּיִם
  choice: വെള്ളത്തിൽ കുളിക്കുകയും
  rationale: ആചാരപരമായ ഈ സന്ദർഭത്തിൽ ശരീരം വെള്ളത്തിൽ കഴുകുന്നതാണ് ഉദ്ദേശ്യം; ‘കുളിക്കുക’ അത് സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: സന്ധ്യവരെ അയാൾ അശുദ്ധനായിരിക്കും
  rationale: טמא സൂചിപ്പിക്കുന്ന ആചാരപരമായ അശുദ്ധിയുടെ നിലയും അതിന്റെ സമയപരിധിയും നിലനിർത്തുന്നു; ഇത് ധാർമ്മിക കുറ്റമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: ആചാരപരമായ വിഭാഗത്തെ സൂചിപ്പിക്കാൻ ‘അശുദ്ധൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മലിനൻ’ അല്ലെങ്കിൽ ‘ശുദ്ധിയില്ലാത്തവൻ’
  rationale: ലേവ്യപുസ്തകം 15-ന്റെ നിയമസന്ദർഭത്തിൽ ഇത് ധാർമ്മിക കുറ്റത്തെയല്ല, ആചാരപരമായ നിലയെയാണ് സൂചിപ്പിക്കുന്നത്. പതിവായ ബൈബിൾ പദമായ ‘അശുദ്ധൻ’ ഈ വ്യത്യാസം അനാവശ്യ വ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമപരമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ ഉപയോഗിച്ചു. ‘വേണം’ നിർദേശത്തിന്റെ ബാധ്യതയും ‘ആയിരിക്കും’ അശുദ്ധിയുടെ തുടർന്നുനിൽക്കുന്ന അവസ്ഥയും സ്വാഭാവികമായി വേർതിരിക്കുന്നു. അടിക്കുറിപ്പിന്റെ ചിഹ്നം ബന്ധപ്പെട്ട ‘കിടക്ക’ എന്ന പദത്തിനരികിൽ വരേണ്ടതായതിനാൽ പ്രസിദ്ധീകരണരൂപത്തിൽ അത് അവിടേക്കു മാറ്റുന്നത് ഉചിതമാണ്.
