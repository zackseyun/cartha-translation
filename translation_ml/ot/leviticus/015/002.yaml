source:
  edition: WLC
  text: דַּבְּרוּ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/אֲמַרְתֶּ֖ם אֲלֵ/הֶ֑ם אִ֣ישׁ אִ֗ישׁ כִּ֤י יִהְיֶה֙ זָ֣ב מִ/בְּשָׂר֔/וֹ זוֹב֖/וֹ טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക: ഏതൊരു പുരുഷന്റെയും ശരീരത്തിൽനിന്ന്[a] സ്രവം പുറപ്പെടുമ്പോൾ, അവന്റെ സ്രവം അശുദ്ധമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അവന്റെ മാംസത്തിൽനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ אֶל־בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോടു സംസാരിച്ച്
  rationale: ബഹുവചന ആജ്ഞയും ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഉടമ്പടി-സംബന്ധമായ പ്രയോഗവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַאֲמַרְתֶּם אֲלֵהֶם
  choice: അവരോടു പറയുക
  rationale: എബ്രായ നിയമപ്രസംഗത്തിലെ തുടർച്ചയായ ആജ്ഞാരൂപത്തിന്റെ ഔപചാരിക താളം സംരക്ഷിക്കുന്നു.
- source_word: אִישׁ אִישׁ
  choice: ഏതൊരു പുരുഷന്റെയും
  rationale: ആവർത്തനം നൽകുന്ന വിതരണാർഥം (‘ഓരോ പുരുഷനും/ഏതൊരു പുരുഷനും’) വ്യക്തമാക്കുന്നു; സന്ദർഭം പുരുഷന്റെ ശരീരസ്രവത്തെക്കുറിച്ചായതിനാൽ ലിംഗനിരപേക്ഷ പദം ഒഴിവാക്കുന്നു.
- source_word: כִּי יִהְיֶה זָב
  choice: സ്രവം പുറപ്പെടുമ്പോൾ
  rationale: כִּי ഇവിടെ നിയമപരമായ സംഭവസാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ ‘എങ്കിൽ’ എന്നതിനെക്കാൾ ‘പുറപ്പെടുമ്പോൾ’ യോജിക്കുന്നു. זָב എന്ന പ്രവാഹാവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִבְּשָׂרוֹ
  choice: ശരീരത്തിൽനിന്ന്
  rationale: בשר എന്നതിന്റെ അക്ഷരാർഥം ‘മാംസം’ ആണെങ്കിലും, ഈ ശുദ്ധിനിയമസന്ദർഭത്തിൽ ‘ശരീരം’ സാധാരണ വായനക്കാരന് ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: זוֹבוֹ
  choice: അവന്റെ സ്രവം
  rationale: זָב എന്നതുമായി ഒരേ പദകുടുംബത്തിലെ നാമത്തിന് ‘സ്രവം’ ഉപയോഗിച്ച് നിയമവാക്യത്തിലെ പദബന്ധം നിലനിർത്തുന്നു.
- source_word: טָמֵא הוּא
  choice: അശുദ്ധമാണ്
  rationale: ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു; ധാർമ്മിക പാപം എന്ന് അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: ആചാരപരമായ അശുദ്ധിയുടെ പദപ്രയോഗം
  choice: അശുദ്ധമാണ്
  alternative: മലിനമാണ്
  rationale: טָמֵא ഇവിടെ ധാർമ്മിക കുറ്റത്തേക്കാൾ ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു. ‘അശുദ്ധം’ മലയാള ബൈബിൾ-നിയമഭാഷയിൽ വ്യക്തവും സ്ഥാപിതവുമാണ്.
- issue: അശുദ്ധിയെന്ന വിധിയുടെ വ്യാകരണപരമായ ആധാരം
  choice: അവന്റെ സ്രവം അശുദ്ധമാണ്
  alternative: അവൻ അശുദ്ധനാണ്
  rationale: എബ്രായത്തിലെ זוֹבוֹ טָמֵא הוּא എന്ന അടുത്ത പദബന്ധം സ്രവത്തെ വിഷയമായി വായിക്കാൻ ശക്തമായി പിന്തുണയ്ക്കുന്നു; പുരുഷനെയും സ്രവത്തെയും സൂചിപ്പിക്കാൻ കഴിയുന്ന പുൽലിംഗരൂപം മൂലമുള്ള സൂക്ഷ്മത ഉണ്ടായിരുന്നാലും വാക്യഘടനയോട് ഏറ്റവും അടുത്ത വായന തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമപ്രസംഗശൈലി സ്വീകരിച്ചു. ശരീരസ്രവത്തെ അനാവശ്യമായി വിശദീകരിക്കാതെയും മൃദൂകരിക്കാതെയും വ്യക്തമായി അവതരിപ്പിച്ചു; മൂലത്തിലെ പദക്രമവും സ്വാഭാവിക മലയാളവാക്യഘടനയും തമ്മിൽ സമതുലനം പാലിച്ചു.
