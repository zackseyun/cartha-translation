revisions:
- from: എന്നാൽ നിങ്ങൾതന്നെ എന്റെ ചട്ടങ്ങളും എന്റെ ന്യായവിധികളും പാലിക്കണം; ഈ മ്ലേച്ഛപ്രവൃത്തികളിലൊന്നും നിങ്ങൾ ചെയ്യരുത്—സ്വദേശിയായാലും നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന പരദേശിയായാലും.[a]
  to: എന്നാൽ നിങ്ങൾതന്നെ എന്റെ ചട്ടങ്ങളും എന്റെ ന്യായവിധികളും പാലിക്കണം; സ്വദേശിയോ നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന പരദേശിയോ ഈ അറപ്പുളവാക്കുന്ന പ്രവൃത്തികളിലൊന്നും ചെയ്യരുത്.[a]
  rationale: The revision retains the legal force, emphatic ‘you yourselves,’ and inclusive scope of the Hebrew. It replaces an unsuitable, socially loaded term for ‘abominations’ with a natural phrase denoting detestable acts, and it makes the native-born and resident foreigner explicit subjects of the prohibition. The lexical-alternative footnote remains anchored to ‘പരദേശി.’
