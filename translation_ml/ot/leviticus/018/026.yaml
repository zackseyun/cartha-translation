source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י וְ/לֹ֣א תַעֲשׂ֔וּ מִ/כֹּ֥ל הַ/תּוֹעֵבֹ֖ת הָ/אֵ֑לֶּה הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾതന്നെ എന്റെ ചട്ടങ്ങളും എന്റെ ന്യായവിധികളും പാലിക്കണം; സ്വദേശിയോ നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന പരദേശിയോ ഈ അറപ്പുളവാക്കുന്ന പ്രവൃത്തികളിലൊന്നും ചെയ്യരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങളുടെ ഇടയിൽ താമസിക്കുന്ന വിദേശി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אַתֶּם
  choice: എന്നാൽ നിങ്ങൾതന്നെ ... പാലിക്കണം
  rationale: שׁמר എന്നതിന് നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ സന്ദർഭത്തിൽ ‘പാലിക്കുക’ യോജിക്കുന്നു; സ്വതന്ത്ര സർവനാമമായ אַתֶּם നൽകുന്ന ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: חֻקֹּתַי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: חֻקִּים നിശ്ചയിക്കപ്പെട്ട നിയമനിർദേശങ്ങളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ചട്ടങ്ങൾ’ വ്യക്തവും നിയമപരവുമാണ്.
- source_word: מִשְׁפָּטַי
  choice: എന്റെ ന്യായവിധികൾ
  rationale: מִשְׁפָּטִים നിയമപരമായ വിധികളെയോ തീർപ്പുകളെയോ സൂചിപ്പിക്കുന്നു; ‘ന്യായവിധികൾ’ അതിന്റെ വ്യത്യസ്ത നിയമാർഥം നിലനിർത്തുന്നു.
- source_word: וְלֹא תַעֲשׂוּ מִכֹּל
  choice: ഒന്നും നിങ്ങൾ ചെയ്യരുത്
  rationale: നിഷേധത്തോടുകൂടിയ מן + כל സമഗ്രമായ വിലക്കാണ്; മലയാളത്തിൽ ‘ഒന്നും ... ചെയ്യരുത്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: ഈ മ്ലേച്ഛപ്രവൃത്തികൾ
  rationale: תּוֹעֵבָהയുടെ ശക്തമായ ധാർമ്മിക വെറുപ്പും, ഇവിടെ മുമ്പ് പറഞ്ഞ പ്രവൃത്തികളിലേക്കുള്ള സൂചനയും ‘മ്ലേച്ഛപ്രവൃത്തികൾ’ വ്യക്തമാക്കുന്നു.
- source_word: הָאֶזְרָח
  choice: സ്വദേശി
  rationale: ദേശത്തിലും സമൂഹത്തിലും ജന്മനാ ഉൾപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന אֶזְרָח എന്നതിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന പരദേശി
  rationale: גֵּר ഒരു താൽക്കാലിക യാത്രക്കാരനെക്കാൾ സമൂഹത്തിനുള്ളിൽ താമസിക്കുന്ന അന്യദേശക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്; അനുബന്ധ കൃദന്തരൂപം താമസസ്ഥിതി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വിലക്ക് സ്വദേശിക്കും സമൂഹത്തിൽ പാർക്കുന്ന പരദേശിക്കും ബാധകമാണോ
  choice: വിലക്ക് സ്വദേശിക്കും അവരുടെ ഇടയിൽ പാർക്കുന്ന പരദേശിക്കും ബാധകമാണെന്ന് വിവർത്തനം വ്യക്തമാക്കുന്നു.
  alternative: അവസാന പദസമുച്ചയത്തെ കല്പനയ്ക്ക് വിധേയരായവരുടെ സമാനാധികരണപരമായ തിരിച്ചറിയലായി മാത്രം വായിക്കാം.
  rationale: ഹീബ്രു വാക്യഘടനയിൽ הָאֶזְרָח, הַגֵּר എന്നീ രണ്ടുകൂട്ടരും വിലക്കിന്റെ പരിധിയിൽ വരുന്നു; ‘ആയാലും ... ആയാലും’ ഇരുവരെയും ഉൾക്കൊള്ളുന്നതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിയമോപദേശ ശൈലി. ‘നിങ്ങൾതന്നെ’ എന്നത് മൂലത്തിലെ ഊന്നൽ സൂക്ഷിക്കുന്നു; ‘പാലിക്കണം/ചെയ്യരുത്’ കല്പനയുടെ നിർബന്ധസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
