- from: കാരണം, ഈ അറപ്പുളവാക്കുന്ന പ്രവൃത്തികളിൽ ഏതെങ്കിലും ചെയ്യുന്നവർ—അവ ചെയ്യുന്ന ആ വ്യക്തികൾ—തങ്ങളുടെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടും[a].
