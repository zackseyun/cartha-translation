id: LEV.18.29
reference: Leviticus 18:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: ml
  text: കാരണം, ഈ അറപ്പുളവാക്കുന്ന പ്രവൃത്തികളിൽ ഏതെങ്കിലും ചെയ്യുന്ന എല്ലാവരും തങ്ങളുടെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വധിക്കപ്പെടും’ അല്ലെങ്കിൽ ‘സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടും.’ എബ്രായപാഠം ‘ഛേദിക്കപ്പെടും’ എന്നാണ് പറയുന്നത്; വിധി എങ്ങനെ നടപ്പാക്കപ്പെടുമെന്ന് അത് കൃത്യമായി വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള വിലക്കുകൾക്കുള്ള വിശദീകരണവും അവയുടെ ലംഘനത്തിന്റെ ഫലവും അവതരിപ്പിക്കുന്ന ബന്ധപദമായി സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: כָּל אֲשֶׁר
  choice: ചെയ്യുന്നവർ
  rationale: ‘ആരെല്ലാം/ഏവൻ’ എന്ന സാർവത്രികവും അനിശ്ചിതവുമായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יַעֲשֶׂה / הָעֹשֹׂת
  choice: ചെയ്യുന്നവർ—അവ ചെയ്യുന്ന ആ വ്യക്തികൾ
  rationale: ‘ചെയ്യുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും എബ്രായത്തിലെ ഏകവചനസദൃശമായ സാർവത്രിക പ്രയോഗത്തിൽനിന്ന് ബഹുവചനമായ ‘വ്യക്തികൾ’ എന്ന ആവർത്തനത്തിലേക്കുള്ള നീക്കം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: ഈ അറപ്പുളവാക്കുന്ന പ്രവൃത്തികളിൽ ഏതെങ്കിലും
  rationale: מִן എന്ന ഭാഗികസൂചനയും כֹּל എന്ന സമഗ്രവ്യാപ്തിയും ‘ഇവയിൽ ഏതെങ്കിലും’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു; תּוֹעֵבוֹת ഇവിടെ ധാർമികവും ആചാരപരവുമായി വെറുക്കപ്പെടുന്ന പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു.
- source_word: וְנִכְרְתוּ
  choice: ഛേദിക്കപ്പെടും
  rationale: നിയമ-ഉടമ്പടി സന്ദർഭത്തിലെ ‘വെട്ടിമാറ്റപ്പെടുക/ഛേദിക്കപ്പെടുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; ശിക്ഷയുടെ കൃത്യമായ രീതി വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അതിനെ വിവർത്തനത്തിൽ ചുരുക്കി നിർവചിക്കുന്നില്ല.
- source_word: הַנְּפָשׁוֹת
  choice: ആ വ്യക്തികൾ
  rationale: נֶפֶשׁ ഇവിടെ ശരീരത്തിൽനിന്നു വേറിട്ട ‘ആത്മാവ്’ എന്നതിലുപരി വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ തെറ്റിദ്ധരിപ്പിക്കാത്ത നിയമപരമായ മനുഷ്യസൂചനയാണ് ഉപയോഗിച്ചത്.
- source_word: מִקֶּרֶב עַמָּם
  choice: തങ്ങളുടെ ജനത്തിന്റെ ഇടയിൽനിന്ന്
  rationale: ഉടമ്പടിസമൂഹത്തിനകത്തുനിന്നുള്ള നീക്കം എന്ന സമൂഹപരമായ ആശയം നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם എന്ന ശിക്ഷാസൂത്രത്തിന്റെ അർഥം
  choice: തങ്ങളുടെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടും
  alternative: കൊന്നുകളയപ്പെടും; സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടും
  rationale: ഈ എബ്രായ നിയമസൂത്രം ദൈവികവിധിയാലുള്ള മരണമാണോ, മനുഷ്യർ നടപ്പാക്കുന്ന വധശിക്ഷയാണോ, സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലാണോ എന്ന് ഈ വാക്യത്തിൽ കൃത്യമായി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്ര-നിയമപരമായ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘മ്ലേച്ഛതകൾ’ പോലുള്ള താരതമ്യേന അപരിചിതമായ പദത്തിനു പകരം ‘അറപ്പുളവാക്കുന്ന പ്രവൃത്തികൾ’ എന്നു നൽകി; എന്നാൽ ശിക്ഷാസൂത്രത്തിലെ നിയമപരമായ രൂപകം മനപ്പൂർവം നിലനിർത്തി.
