  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: ml
  text: ഇവയിലൊന്നിനാലും നിങ്ങളെത്തന്നെ അശുദ്ധരാക്കരുത്[a]. കാരണം, ഞാൻ നിങ്ങളുടെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുന്ന ജനതകൾ ഇവയെല്ലാം മൂലം അശുദ്ധരായിത്തീർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇവയിലൊന്നിനാലും നിങ്ങളെത്തന്നെ മലിനരാക്കരുത് … ജനതകൾ … മലിനരാക്കപ്പെട്ടു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: നിങ്ങളെത്തന്നെ അശുദ്ധരാക്കരുത്
  rationale: אַל സഹിതമുള്ള അപൂർണ്ണക്രിയ നിരോധനം പ്രകടിപ്പിക്കുന്നു; טמאയുടെ ഹിത്പയേൽ രൂപത്തിലെ സ്വയം ഉൾപ്പെടുന്ന പ്രവർത്തനവും ലേവ്യപുസ്തകത്തിലെ അശുദ്ധി-പദാവലിയും ഈ വിവർത്തനം നിലനിർത്തുന്നു.
- source_word: בְּכָל אֵלֶּה
  choice: ഇവയിലൊന്നിനാലും
  rationale: നിഷേധവാക്യത്തിൽ ‘ഇവയെല്ലാംകൊണ്ടും’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘ഇവയിലൊന്നിനാലും’ എന്നു നൽകുന്നു; ב എന്ന ഉപസർഗത്തിന്റെ കാരണ/മാധ്യമഭാവം ‘-നാൽ’ വഴി പ്രകടമാകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള നിരോധനത്തിന്റെ അടിസ്ഥാനം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְכָל אֵלֶּה נִטְמְאוּ
  choice: ഇവയെല്ലാംമൂലം അശുദ്ധരായിത്തീർന്നു
  rationale: നിഫാൽ രൂപത്തിന്റെ ഫലാവസ്ഥയെ ‘അശുദ്ധരായിത്തീർന്നു’ എന്നു നൽകുകയും ആദ്യപ്രയോഗത്തോടുള്ള പദസംബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַגּוֹיִם
  choice: ജനതകൾ
  rationale: ഇവിടെ ദേശത്ത് പാർത്തിരുന്ന ഇസ്രായേലേതര ജനവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ജനതകൾ’ ആ അർത്ഥം കാലവ്യത്യാസമില്ലാതെ നൽകുന്നു.
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: ഞാൻ ... നീക്കിക്കളയുന്ന
  rationale: שלח എന്നതിന്റെ അടിസ്ഥാനാർത്ഥം ‘അയയ്ക്കുക’ ആണെങ്കിലും, ദേശത്തുനിന്നുള്ള പുറത്താക്കലിന്റെ ഈ സന്ദർഭത്തിൽ ബലമായ നീക്കം പ്രകടിപ്പിക്കുന്ന ‘നീക്കിക്കളയുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: ഹീബ്രുവിലെ സ്ഥലബന്ധമായ ‘നിങ്ങളുടെ മുമ്പിൽനിന്ന്’ എന്ന ഘടന മലയാളത്തിൽ നേരിട്ടും വ്യക്തമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലേവ്യപുസ്തകം 18-ലെ ആചാരപരവും ധാർമികവുമായ അശുദ്ധിയുടെ പദാവലി
  choice: അശുദ്ധരാക്കുക / അശുദ്ധരായിത്തീരുക
  alternative: മലിനരാക്കുക / മലിനരാക്കപ്പെടുക
  rationale: טמא എന്ന പദത്തിന്റെ ലേവ്യപുസ്തകപരമായ ആശയതുടർച്ച ‘അശുദ്ധി’ എന്ന പദം സംരക്ഷിക്കുന്നു. ‘മലിനമാക്കുക’ സാധുവായ മറ്റൊരു വിവർത്തനമാണെങ്കിലും, അത് കൂടുതൽ പൊതുവായ ഭൗതികമോ നൈതികമോ ആയ മലിനതയായി മാത്രം കേൾക്കാൻ ഇടയുണ്ട്. നിഫാൽ രൂപത്തെ നിർബന്ധമായി കർമണിയായി തീർക്കാതെ ഫലാവസ്ഥയായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അശുദ്ധി’ എന്ന ലേവ്യപുസ്തക പദാവലി നിലനിർത്തിയിട്ടുണ്ട്; അമിതമായി പുരാതനമോ പ്രത്യേക സഭാപാരമ്പര്യവുമായി ബന്ധപ്പെടുന്നതോ ആയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
