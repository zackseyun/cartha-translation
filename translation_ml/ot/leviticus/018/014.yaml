id: LEV.18.14
reference: Leviticus 18:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחִֽי אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה אֶל אִשְׁתּ/וֹ֙ לֹ֣א תִקְרָ֔ב דֹּדָֽתְ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/014.yaml
  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: ml
  text: നിന്റെ അപ്പന്റെ സഹോദരന്റെ നഗ്നത നീ അനാവൃതമാക്കരുത്; അവന്റെ ഭാര്യയെ നീ സമീപിക്കരുത്.[a] അവൾ നിന്റെ അമ്മായിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘സമീപിക്കുക’; ഈ അഗമ്യഗമനനിയമസന്ദർഭത്തിൽ ഈ ക്രിയയ്ക്ക് ലൈംഗികമായ അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: നഗ്നത
  rationale: ലേവ്യപുസ്തകം 18-ലെ സ്ഥിരമായ നിയമപ്രയോഗമായ ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും വ്യാഖ്യാനപരമായ പരാവർത്തനം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: אֲחִי אָבִיךָ
  choice: നിന്റെ അപ്പന്റെ സഹോദരൻ
  rationale: എബ്രായത്തിലെ ബന്ധനിർദേശം നേരിട്ട് നിലനിർത്തുകയും പിതൃസഹോദരനെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: תְגַלֶּה
  choice: അനാവൃതമാക്കരുത്
  rationale: גלה എന്ന ക്രിയയുടെ പീയേൽ രൂപത്തിലുള്ള നിയമശൈലിയിലെ ‘അനാവൃതമാക്കുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: അവന്റെ ഭാര്യയെ നീ സമീപിക്കരുത്
  rationale: קרב എന്ന നിയന്ത്രിതമായ ‘സമീപിക്കുക’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ഈ അഗമ്യഗമനനിയമസന്ദർഭത്തിൽ അതിന്റെ ലൈംഗിക സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: דֹּדָתְךָ
  choice: നിന്റെ അമ്മായി
  rationale: മുൻവാക്യം കൃത്യമായ ബന്ധം വ്യക്തമാക്കുന്നതിനാൽ സാധാരണ മലയാളത്തിലെ ബന്ധപദം സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: הִוא
  choice: അവൾ ... ആണ്
  rationale: എബ്രായ സർവനാമത്തിന്റെ വിധേയപ്രയോഗം നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു; കാരണാർഥം അധികമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: അഗമ്യഗമനനിയമത്തിലെ ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: സ്ഥിരമായ ദൃശ്യരൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: ‘ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്’ എന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: അധ്യായത്തിലുടനീളമുള്ള നിയമസൂത്രത്തിന്റെ ഏകീകരണവും എബ്രായപാഠത്തോടുള്ള സുതാര്യതയും സംരക്ഷിക്കുന്നു; അതിന്റെ ലൈംഗിക അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- issue: ദֹּדָה എന്ന ബന്ധപദത്തിന്റെ നിർദേശം
  choice: ‘അമ്മായി’ എന്നു വിവർത്തനം ചെയ്യുക
  alternative: ‘അപ്പന്റെ സഹോദരന്റെ ഭാര്യ’ എന്നു വീണ്ടും പൂർണമായി പറയുക
  rationale: എബ്രായത്തിൽ അവസാനമായി സാധാരണ ബന്ധപദമാണ് ഉപയോഗിക്കുന്നത്; മുൻവാക്യം ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം ഇതിനകം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മൂലത്തിലെ ‘പിതാവ്’ എന്ന കുടുംബബന്ധത്തിന് വ്യക്തവുമാണ്. ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന ആവർത്തിത നിയമപ്രയോഗം ഔപചാരികമായി സംരക്ഷിച്ചിരിക്കുന്നു.
