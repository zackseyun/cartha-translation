source:
  edition: WLC
  text: וְ/אִשָּׁ֥ה אֶל אֲחֹתָ֖/הּ לֹ֣א תִקָּ֑ח לִ/צְרֹ֗ר לְ/גַלּ֧וֹת עֶרְוָתָ֛/הּ עָלֶ֖י/הָ בְּ/חַיֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: ml
  text: ആദ്യ ഭാര്യ ജീവിച്ചിരിക്കുമ്പോൾ, അവളുടെ സഹോദരിയെ അവൾക്കു പുറമേ എതിരാളിയായ ഭാര്യയായി സ്വീകരിച്ച് ആ സഹോദരിയുടെ നഗ്നത അനാവൃതമാക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആദ്യ ഭാര്യ ജീവിച്ചിരിക്കുമ്പോൾ, അവളുടെ സഹോദരിയെ അവൾക്കു പുറമേ സ്വീകരിച്ച് അവളെ എതിരാളിയാക്കാൻ അവളുടെ നഗ്നത അനാവൃതമാക്കരുത്.” എബ്രായവാക്യം സങ്കുചിതമാണ്; ആദ്യ ഭാര്യ ജീവിച്ചിരിക്കുമ്പോൾ അവളുടെ സഹോദരിയെ അധികഭാര്യയായി സ്വീകരിക്കുന്നതാണ് ഇവിടെ നിരോധിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה
  choice: ഒരു സ്ത്രീ
  rationale: אִשָּׁה എന്ന പദത്തിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. ഇവിടെ ‘സ്വീകരിക്കുക’ എന്ന വിവാഹസന്ദർഭം ദാമ്പത്യാർഥം വ്യക്തമാക്കുന്നതിനാൽ പൊതുവായ നിയമരൂപം നിലനിർത്താൻ ‘ഒരു സ്ത്രീ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֶל אֲחֹתָהּ
  choice: അവളുടെ സഹോദരിയെ അവൾക്കു പുറമേ
  rationale: അക്ഷരാർഥത്തിലെ ‘അവളുടെ സഹോദരിയോടു/അരികെ’ എന്ന ബന്ധത്തെ, ആദ്യ സഹോദരി ജീവിച്ചിരിക്കെ രണ്ടാമത്തെയാളെ അധികഭാര്യയായി സ്വീകരിക്കുന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא תִקָּח
  choice: സ്വീകരിക്കരുത്
  rationale: വിവാഹത്തിനായി ഒരാളെ ‘എടുക്കുക’ എന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായി ‘സ്വീകരിക്കുക’ എന്നു നൽകി; നിയമപരമായ നിരോധനം ‘അരുത്’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: לִצְרֹר
  choice: എതിരാളിയായ ഭാര്യയായി
  rationale: צרר ഇവിടെ സഹോദരിമാർക്കിടയിൽ വൈരമോ മത്സരമോ സൃഷ്ടിക്കുന്ന സഹഭാര്യബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ‘ഭാര്യയായി’ എന്നത് വിവാഹസന്ദർഭം വ്യക്തമാക്കുന്നു; പദത്തിന്റെ ഫലസൂചന ‘എതിരാളിയായ’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: അവളുടെ നഗ്നത അനാവൃതമാക്കുക
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ലേവ്യപുസ്തകത്തിലെ സ്ഥിരമായ ശിഷ്ടോക്തി ഉറവിടത്തോടുള്ള സുതാര്യതയ്ക്കായി അക്ഷരസന്നിഹിതമായി നിലനിർത്തി.
- source_word: עָלֶיהָ בְּחַיֶּיהָ
  choice: ഒരു സ്ത്രീ ജീവിച്ചിരിക്കുമ്പോൾ ... അവൾക്കു പുറമേ
  rationale: ‘അവളുടെമേൽ/അവൾക്കു പുറമേ, അവളുടെ ജീവിതകാലത്ത്’ എന്ന സങ്കുചിത എബ്രായഘടനയുടെ കാലപരവും അധികഭാര്യയെ സംബന്ധിക്കുന്നതുമായ ബലം മലയാളവാക്യക്രമത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ബഹുഭാര്യതയോടും സഹോദരിമാരുമായുള്ള വിവാഹത്തോടും ബന്ധപ്പെട്ട നിരോധനത്തിന്റെ പരിധി
  choice: ആദ്യ സഹോദരി ജീവിച്ചിരിക്കുമ്പോൾ അവളുടെ സഹോദരിയെ അധികഭാര്യയായി സ്വീകരിക്കുന്നതിനെ വാക്യം നിരോധിക്കുന്നു.
  alternative: ആദ്യ സഹോദരി മരിച്ചശേഷവും ഉൾപ്പെടെ, രണ്ട് സഹോദരിമാരെ വിവാഹം ചെയ്യുന്നതിനെ എല്ലാ സാഹചര്യങ്ങളിലും വാക്യം നിരോധിക്കുന്നു; അല്ലെങ്കിൽ എതിരാളിത്തം സൃഷ്ടിക്കുന്ന ഏതു വിവാഹക്രമത്തെയും പൊതുവായി നിരോധിക്കുന്നു.
  rationale: לִצְרֹר എന്നും בְּחַיֶּיהָ എന്നും ഉള്ള പ്രയോഗങ്ങൾ ആദ്യ സഹോദരിയുടെ ജീവിതകാലത്ത് രണ്ടാമത്തെ സഹോദരിയെ അവൾക്കു പുറമേ സ്വീകരിച്ച് മത്സരബന്ധം സൃഷ്ടിക്കുന്നതിലേക്കാണ് സ്വാഭാവികമായി വിരൽചൂണ്ടുന്നത്. മൂലപാഠം വ്യക്തമാക്കുന്നതിനെക്കാൾ നിരോധനത്തിന്റെ പരിധി വികസിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ നിയമശൈലി. ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന ഉറവിടശിഷ്ടോക്തി ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു; ‘എതിരാളിയായ ഭാര്യ’ വിവാഹപരമായ മത്സരബന്ധം വ്യക്തമാക്കുന്നു.
