reference: Leviticus 18:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֶרְוַ֥ת אָבִ֛י/ךָ וְ/עֶרְוַ֥ת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּ/ךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: ml
  text: നിന്റെ അപ്പന്റെ നഗ്നത—അതായത്, നിന്റെ അമ്മയുടെ നഗ്നത—നീ അനാവൃതമാക്കരുത്.[a] അവൾ നിന്റെ അമ്മയാണ്; അവളുടെ നഗ്നത നീ അനാവൃതമാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിന്റെ അപ്പന്റെ നഗ്നതയും നിന്റെ അമ്മയുടെ നഗ്നതയും നീ അനാവൃതമാക്കരുത്.” തുടർന്ന് “അവൾ നിന്റെ അമ്മയാണ്” എന്നു വാക്യം വിശദീകരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: നഗ്നത
  rationale: ലേവ്യപുസ്തകം 18-ൽ גלה ערוה എന്നത് നിരോധിത ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ നിയമസൗമ്യോക്തിയാണ്. ‘നഗ്നത’ എന്നു വിവർത്തനം ചെയ്യുന്നത് ആ മൂലരൂപവും നിയമഭാവവും നിലനിർത്തുന്നു.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: നീ അനാവൃതമാക്കരുത്
  rationale: עֶרְוָהയോടൊപ്പം വരുന്ന גלה എന്ന ക്രിയയുടെ ആവർത്തിത നിയമപ്രയോഗം ദൃശ്യമാക്കുകയും അതിന്റെ സൂചിതമായ ലൈംഗിക അർഥം അതിവ്യാഖ്യാനം ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אָבִיךָ
  choice: നിന്റെ അപ്പൻ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ അടുത്ത ബന്ധപദത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
- source_word: וְעֶרְוַת אִמְּךָ
  choice: അതായത്, നിന്റെ അമ്മയുടെ നഗ്നത
  rationale: ഹീബ്രുവിലെ וְ അക്ഷരാർഥത്തിൽ ‘കൂടാതെ/യും’ എന്നു വരാമെങ്കിലും, പിന്നാലെയുള്ള ‘അവൾ നിന്റെ അമ്മയാണ്’ എന്ന വാക്യം രണ്ടാമത്തെ പദസമുച്ചയം ആദ്യത്തേതിനെ വിശദീകരിക്കുന്നതായി സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ ആ വിശദീകരണബന്ധം നൽകിയെങ്കിലും അക്ഷരാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הִוא
  choice: അവൾ ... ആണ്
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം അമ്മയെ സൂചിപ്പിക്കുന്നു; ഹീബ്രുവിലെ ഊന്നിയ തിരിച്ചറിയൽ പ്രസ്താവന നിലനിർത്തുന്നു.
- source_word: אִמְּךָ
  choice: നിന്റെ അമ്മ
  rationale: ബന്ധപദത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം; മൂലത്തിലെ ആവർത്തനം നിയമപരമായ വ്യക്തതയ്ക്കും ഊന്നലിനുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നിന്റെ അപ്പന്റെ നഗ്നത’ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘നിന്റെ അപ്പന്റെ നഗ്നത—അതായത്, നിന്റെ അമ്മയുടെ നഗ്നത’ എന്ന വിശദീകരണബന്ധമായി മുഖ്യവാചകത്തിൽ നൽകി.
  alternative: ‘നിന്റെ അപ്പന്റെ നഗ്നതയും നിന്റെ അമ്മയുടെ നഗ്നതയും’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ വായന.
  rationale: വാക്യത്തിലെ ‘അവൾ നിന്റെ അമ്മയാണ്’ എന്ന തുടർവ്യാഖ്യാനം അമ്മയുടെ നഗ്നത അപ്പന്റെ നഗ്നതയുമായി ബന്ധപ്പെടുത്തി കാണുന്നു. എന്നാൽ ഹീബ്രുവിലെ സംയോജകത്തിന് അക്ഷരാർഥത്തിൽ ‘യും’ എന്ന വായന സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന സൗമ്യോക്തി മൂലത്തിലെ ആവർത്തനവും ലൈംഗിക നിരോധനത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു. സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായതിനാൽ ‘പിതാവ്’ എന്നതിനു പകരം ‘അപ്പൻ’ ഉപയോഗിച്ചു.
