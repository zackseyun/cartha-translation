id: LEV.18.27
reference: Leviticus 18:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֚י אֶת כָּל הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔ל עָשׂ֥וּ אַנְשֵֽׁי הָ/אָ֖רֶץ אֲשֶׁ֣ר לִ/פְנֵי/כֶ֑ם וַ/תִּטְמָ֖א הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: ml
  text: എന്തെന്നാൽ, നിങ്ങൾക്കുമുമ്പ് ഈ ദേശത്ത് പാർത്തിരുന്നവർ അറപ്പുളവാക്കുന്ന ഈ സകല കാര്യങ്ങളും ചെയ്തു; അതിനാൽ ദേശം അശുദ്ധമായിത്തീർന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദേശം മലിനമാക്കപ്പെട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: അങ്ങനെ
  rationale: ഈ വാക്യം മുൻപുള്ള മുന്നറിയിപ്പിന് വിശദീകരണാടിസ്ഥാനം നൽകുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധത്തിനായി കാരണഫലബന്ധം ‘അങ്ങനെ’ എന്നതിലൂടെ പ്രകടമാക്കി.
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: ഈ മ്ലേച്ഛകാര്യങ്ങളെല്ലാം
  rationale: תּוֹעֵבָה സൂചിപ്പിക്കുന്ന ശക്തമായ ധാർമികവും ഉടമ്പടിസംബന്ധവുമായ അറപ്പിന്റെ ഭാവം നിലനിർത്തുകയും ബഹുവചനവും നിർദേശകഭാവവും വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עָשׂוּ
  choice: ചെയ്തു
  rationale: עשה എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: אַנְשֵׁי הָאָרֶץ
  choice: ഈ ദേശത്തുണ്ടായിരുന്നവർ
  rationale: പദശഃ ‘ദേശത്തിലെ പുരുഷന്മാർ’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ മുൻനിവാസികളെ സമൂഹമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യമായി പുരുഷന്മാരിൽ മാത്രം അർഥം ചുരുക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: നിങ്ങൾക്കുമുമ്പ്
  rationale: മുൻനിവാസികളുടെ കാലപരമായ മുൻഗാമിത്വം ചുരുക്കമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: וַתִּטְמָא
  choice: അശുദ്ധമായിത്തീർന്നു
  rationale: טמא എന്ന ക്രിയയിലെ അശുദ്ധാവസ്ഥയിലേക്കുള്ള മാറ്റവും അതിന്റെ ഫലവും നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: സന്ദർഭം ഭൂഗോളമൊട്ടാകെയല്ല, ഇസ്രായേലിനു മുമ്പ് മറ്റു ജനങ്ങൾ പാർത്തിരുന്ന പ്രത്യേക ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ദേശത്തിന്റെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: ദേശം അശുദ്ധമായിത്തീർന്നു
  alternative: ദേശം മലിനമാക്കപ്പെട്ടു
  rationale: മനുഷ്യരുടെ പ്രവൃത്തികളാൽ ദേശം അശുദ്ധമായെന്ന വാചകത്തിലെ ധാർമിക-ആചാരപരമായ ബന്ധം നിലനിർത്തുന്നു; അതിനെ പൂർണമായും ആചാരപരമോ രൂപകപരമോ ആയി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള ശൈലി. ഹീബ്രുവിലെ ശക്തമായ നൈതികഭാവവും ദേശത്തിന്റെ അശുദ്ധിയെന്ന ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിച്ചു.
