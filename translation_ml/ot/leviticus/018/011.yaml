id: LEV.18.11
reference: Leviticus 18:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֶרְוַ֨ת בַּת אֵ֤שֶׁת אָבִ֨י/ךָ֙ מוֹלֶ֣דֶת אָבִ֔י/ךָ אֲחוֹתְ/ךָ֖ הִ֑וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/011.yaml
  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: ml
  text: നിന്റെ അപ്പന്റെ ഭാര്യയുടെ മകൾ, നിന്റെ അപ്പനിൽ ജനിച്ചവൾ—അവൾ നിന്റെ സഹോദരിയാണ്—അവളുടെ നഗ്നത നീ അനാവൃതമാക്കരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: നഗ്നത / അവളുടെ നഗ്നത
  rationale: ലേവ്യപുസ്തകം 18-ലെ ലൈംഗിക നിരോധനസൂത്രത്തിൽ עֶרְוָה എന്ന പദത്തിന് ‘നഗ്നത’ എന്നത് നിയമപരമായ പ്രയോഗഭാവവും അധ്യായത്തിനകത്തെ പദസാമ്യവും നിലനിർത്തുന്നു.
- source_word: בַּת
  choice: മകൾ
  rationale: ബന്ധത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പദമായതിനാൽ അക്ഷരാർഥത്തിൽ നിലനിർത്തി.
- source_word: אֵשֶׁת אָבִיךָ
  choice: നിന്റെ അപ്പന്റെ ഭാര്യ
  rationale: ‘രണ്ടാനമ്മ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, എബ്രായത്തിലെ വ്യക്തമായ ബന്ധപ്രയോഗം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: നിന്റെ അപ്പനു ജനിച്ചവളായ
  rationale: പിതാവിൽനിന്നുള്ള ജൈവബന്ധം വ്യക്തമാക്കുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: אֲחוֹתְךָ הִוא
  choice: അവൾ നിന്റെ സഹോദരിയാണ്
  rationale: ബന്ധം ഫലത്തിൽ അർധസഹോദരിയുടേതാണെങ്കിലും, മൂലപാഠം ‘സഹോദരി’ എന്നാണ് നേരിട്ട് പറയുന്നത്; അതിനാൽ മുഖ്യപാഠത്തിൽ അതേ വിശാലപദം നിലനിർത്തി.
- source_word: לֹא תְגַלֶּה
  choice: നീ അനാവൃതമാക്കരുത്
  rationale: ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന അധ്യായത്തിലെ സ്ഥിരമായ നിയമപ്രയോഗവും നിരോധനത്തിന്റെ ഗൗരവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ബന്ധത്തെ മുഖ്യപാഠത്തിൽ ‘അർധസഹോദരി’ എന്നു വ്യക്തമാക്കണമോ
  choice: ‘അവൾ നിന്റെ സഹോദരിയാണ്’ എന്ന മൂലപാഠതലത്തിലുള്ള വാക്കുകൾ നിലനിർത്തുക
  alternative: ‘അവൾ നിന്റെ അർധസഹോദരിയാണ്’
  rationale: മുൻവിവരണം ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം വ്യക്തമാക്കുന്നു; ‘അർധ-’ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് ഉപകാരപ്രദമായ വിശദീകരണമാണെങ്കിലും എബ്രായത്തിൽ തുറന്നുപറയാത്ത ഘടകം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും നിലവിലെ ഭാഷയിൽ സ്വാഭാവികവുമാണ്. മൂലത്തിലെ മുൻനിറുത്തിയ ബന്ധവിവരണവും അവസാനം വരുന്ന ‘അവളുടെ നഗ്നത’ എന്ന ആവർത്തനവും ഡാഷുകൾ ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ സംരക്ഷിച്ചു.
