revisions:
- from: നിന്റെ അപ്പന്റെ ഭാര്യയുടെ മകൾ—നിന്റെ അപ്പനു ജനിച്ചവളായ അവൾ നിന്റെ സഹോദരിയാണ്[a]—അവളുടെ നഗ്നത നീ അനാവൃതമാക്കരുത്.
  to: നിന്റെ അപ്പന്റെ ഭാര്യയുടെ മകൾ, നിന്റെ അപ്പനിൽ ജനിച്ചവൾ—അവൾ നിന്റെ സഹോദരിയാണ്—അവളുടെ നഗ്നത നീ അനാവൃതമാക്കരുത്.
  rationale: The revision preserves every kinship element and the source’s unqualified “she is your sister,” while using more idiomatic Malayalam for paternal descent and retaining the chapter’s formal prohibition idiom. The footnote is retained unchanged in content; its anchor should remain after “സഹോദരിയാണ്” in the formatted text.
