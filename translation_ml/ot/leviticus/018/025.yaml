  text: וַ/תִּטְמָ֣א הָ/אָ֔רֶץ וָ/אֶפְקֹ֥ד עֲוֺנָ֖/הּ עָלֶ֑י/הָ וַ/תָּקִ֥א הָ/אָ֖רֶץ אֶת יֹשְׁבֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: ml
  text: അങ്ങനെ ദേശം അശുദ്ധമായിത്തീർന്നു[a]. അതിന്റെ അകൃത്യത്തിന് ഞാൻ അതിനെ ശിക്ഷിച്ചു[b]; ദേശം അതിലെ നിവാസികളെ ഛർദിച്ചുകളഞ്ഞു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മലിനമാക്കപ്പെട്ടു.’ എബ്രായ ക്രിയയെ ‘അശുദ്ധമായിത്തീർന്നു’ എന്നോ ‘മലിനമാക്കപ്പെട്ടു’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ അകൃത്യം ഞാൻ അതിന്മേൽ സന്ദർശിച്ചു’; ന്യായവിധിയിൽ കുറ്റം കണക്കിലെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘പുറത്തേക്ക് ഛർദിച്ചു.’ അശുദ്ധി നിമിത്തം ദേശം തന്റെ നിവാസികളെ പുറന്തള്ളുന്നതിനെ ചിത്രീകരിക്കാൻ എബ്രായം ഛർദിയുടെ ശക്തമായ രൂപകം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: അശുദ്ധമായിത്തീർന്നു
  rationale: טמא ഇവിടെ ദേശം ആചാരപരമായും ധാർമികമായും അശുദ്ധമായ അവസ്ഥയിലായതിനെ സൂചിപ്പിക്കുന്നു. ‘അശുദ്ധമായിത്തീർന്നു’ ഫലാവസ്ഥ വ്യക്തമാക്കുകയും കർത്തൃ-കർമഭാവം അനാവശ്യമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ലേവ്യപുസ്തകം 18-ന്റെ സന്ദർഭത്തിൽ אֶרֶץ ഭൂമി മുഴുവനെയല്ല, കനാൻദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ദേശം’ യോജിക്കുന്നു.
- source_word: וָאֶפְקֹד
  choice: ശിക്ഷിച്ചു
  rationale: פקד എന്നതിന് ‘സന്ദർശിക്കുക/കണക്കുചോദിക്കുക’ എന്ന വിശാല അർഥപരിധിയുണ്ടെങ്കിലും עון-നോടൊപ്പം ഇവിടെ ന്യായവിധിയിൽ കുറ്റം കണക്കിലെടുത്ത് ശിക്ഷിക്കുന്നതാണു പ്രസക്തം.
- source_word: עֲוֺנָהּ
  choice: അതിന്റെ അകൃത്യം
  rationale: עון അകൃത്യം, കുറ്റം, കുറ്റഫലം എന്നിവ സൂചിപ്പിക്കാം. ‘അകൃത്യം’ ധാർമിക ഗൗരവം നിലനിർത്തുകയും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുകയും ചെയ്യുന്നു.
- source_word: עָלֶיהָ
  choice: അതിനെ
  rationale: פקד עון על എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം ‘അതിന്റെ അകൃത്യത്തിന് അതിനെ ശിക്ഷിച്ചു’ എന്നായി നൽകി; വിധി ദേശത്തിന്മേൽ വരുന്നു എന്ന ബന്ധം ഇതിൽ വ്യക്തമാണ്.
- source_word: וַתָּקִא
  choice: ഛർദിച്ചുകളഞ്ഞു
  rationale: קיא എന്നത് നേരിട്ട് ‘ഛർദിക്കുക’ എന്നാണ്. ദേശം നിവാസികളെ ബലമായി പുറന്തള്ളുന്നതായി ചിത്രീകരിക്കുന്ന ശക്തമായ രൂപകം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: יֹשְׁבֶיהָ
  choice: അതിലെ നിവാസികൾ
  rationale: ישב-ന്റെ പങ്കാളിത്തരൂപം ദേശത്തു പാർക്കുന്നവരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘അതിലെ നിവാസികൾ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: അശുദ്ധിയോട് പ്രതികരിക്കുന്നതായി ദേശത്തെ വ്യക്തിവൽക്കരിക്കൽ
  choice: ദേശം തന്റെ നിവാസികളെ ‘ഛർദിച്ചുകളഞ്ഞു’ എന്ന മൂർത്തമായ ദൃശ്യം നിലനിർത്തി.
  alternative: ദേശം തന്റെ നിവാസികളെ പുറത്താക്കി.
  rationale: പാപം, അശുദ്ധി, ദൈവിക ന്യായവിധി, ദേശത്തുനിന്നുള്ള പുറത്താക്കൽ എന്നിവ തമ്മിലുള്ള ബന്ധം എബ്രായ രൂപകം ശക്തമായി അവതരിപ്പിക്കുന്നു; അതിനെ മൃദൂകരിച്ചില്ല.
- issue: וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ എന്നതിലെ ദൈവിക ന്യായവിധി
  choice: ‘അതിന്റെ അകൃത്യത്തിന് ഞാൻ അതിനെ ശിക്ഷിച്ചു’ എന്നു നേരിട്ടു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അതിന്റെ അകൃത്യം ഞാൻ അതിന്മേൽ സന്ദർശിച്ചു’ / ‘അതിന്റെ കുറ്റം ഞാൻ അതിനോടു കണക്കുചോദിച്ചു.’
  rationale: വാക്യം ന്യായവിധിയുടെ പ്രവർത്തനം ദൈവത്തോടു നേരിട്ട് ബന്ധിപ്പിക്കുന്നു. ‘ശിക്ഷിച്ചു’ എന്നത് പദപ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഛർദിച്ചുകളഞ്ഞു’ എന്ന ശക്തമായ പ്രയോഗം അസ്വസ്ഥമാക്കാവുന്നതാണെങ്കിലും മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ ദൃശ്യരൂപം സംരക്ഷിക്കാൻ നിലനിർത്തി.
