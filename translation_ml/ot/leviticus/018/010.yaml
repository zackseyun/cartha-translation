  to: നിന്റെ മകന്റെ മകളുടെയോ നിന്റെ മകളുടെ മകളുടെയോ നഗ്നത നീ അനാവരണം ചെയ്യരുത്;[a] അവർ നിന്റെ നഗ്നതയാണ്.[b]
