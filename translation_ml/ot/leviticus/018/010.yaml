  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֶרְוַ֤ת בַּת בִּנְ/ךָ֙ א֣וֹ בַֽת בִּתְּ/ךָ֔ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָ֑/ן כִּ֥י עֶרְוָתְ/ךָ֖ הֵֽנָּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/010.yaml
  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: ml
  text: നിന്റെ മകന്റെ മകളുടെയോ നിന്റെ മകളുടെ മകളുടെയോ നഗ്നത നീ അനാവരണം ചെയ്യരുത്;[a] അവർ നിന്റെ നഗ്നതയാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: ‘നിന്റെ മകന്റെ മകളുമായോ നിന്റെ മകളുടെ മകളുമായോ നീ ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്.’ എബ്രായ ശിഷ്ടോക്തിയുടെ അക്ഷരാർഥം ‘നഗ്നത അനാവരണം ചെയ്യുക’ എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: അവസാന ഭാഗത്തിന്റെ അക്ഷരാർഥം ‘അവർ നിന്റെ നഗ്നതയാണ്’ എന്നാണ്. ഈ അടുത്ത സന്തതികൾ സ്വന്തം കുടുംബബന്ധത്തിന്റെ ഭാഗമാണെന്നും അതിനാൽ അവരുമായുള്ള ലൈംഗികബന്ധം നിരോധിതമാണെന്നും സൂചിപ്പിക്കുന്ന കുടുംബ-ബന്ധുത്വപരമായ ഭാഷയാണ് ഇത്.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: നഗ്നത
  rationale: ലേവ്യപുസ്തകം 18-ൽ ആവർത്തിക്കുന്ന גלה ערוה എന്ന നിയമപരമായ ശിഷ്ടോക്തിയെ നിലനിർത്താനും അവസാന കാരണവാക്യത്തിലെ ഒരേ പദത്തിന്റെ ആവർത്തനം സംരക്ഷിക്കാനും ‘നഗ്നത’ തിരഞ്ഞെടുത്തു.
- source_word: בַּת בִּנְךָ
  choice: നിന്റെ മകന്റെ മകൾ
  rationale: എബ്രായത്തിലെ കൃത്യമായ ബന്ധുത്വഘടനയും പിതൃവഴിയുള്ള കൊച്ചുമകളെന്ന നിയമപരമായ പ്രത്യേകതയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בַת בִּתְּךָ
  choice: നിന്റെ മകളുടെ മകൾ
  rationale: മാതൃവഴിയുള്ള കൊച്ചുമകളെ സൂചിപ്പിക്കുന്ന സമാന്തര ബന്ധുത്വഘടന വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: לֹא תְגַלֶּה
  choice: നീ അനാവരണം ചെയ്യരുത്
  rationale: അധ്യായത്തിലെ ആവർത്തിത നിയമസൂത്രത്തിന്റെ രൂപം നിലനിർത്തുന്നു; ഉദ്ദേശ്യം ലൈംഗികബന്ധമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണമർത്ഥം അർധവിരാമത്തിനു ശേഷമുള്ള വാക്യത്തിലൂടെ
  rationale: എബ്രായത്തിലെ കാരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കാൻ അർധവിരാമവും വിശദീകരണവാക്യവും ഉപയോഗിച്ചു.
- source_word: הֵנָּה
  choice: അവർ ... ആകുന്നു
  rationale: സ്ത്രീലിംഗ ബഹുവചന സർവനാമം മുമ്പുള്ള രണ്ടു കൊച്ചുമക്കളിലേക്കാണ് മടങ്ങുന്നതെന്ന വ്യാകരണസൂചന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘അവർ നിന്റെ നഗ്നത ആകുന്നു’ എന്ന അവസാന കാരണവാക്യത്തിന്റെ അർത്ഥം
  choice: അവർ നിന്റെ നഗ്നത തന്നെയാകുന്നു
  alternative: അവരുടെ നഗ്നത നിന്റേതുതന്നെയാണ് / അവർ നിന്റെ സ്വന്തം മാംസമാണ്
  rationale: എബ്രായം കൊച്ചുമക്കളെ തന്നെ ‘നിന്റെ നഗ്നത’ എന്നു വിശേഷിപ്പിക്കുന്ന അസാധാരണമായ കുടുംബ-ഐക്യഭാഷ ഉപയോഗിക്കുന്നു. അതിനെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘സ്വന്തം മാംസം’ എന്നാക്കി മാറ്റാതെ അതിലെ ദൈവശാസ്ത്രപരവും ആശയപരവുമായ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ‘അനാവരണം ചെയ്യുക’ എന്നത് സാധാരണ സംഭാഷണത്തേക്കാൾ ഔപചാരികമാണെങ്കിലും, അധ്യായത്തിലെ സ്ഥിരമായ എബ്രായ നിയമശിഷ്ടോക്തിയും അന്തർപാഠ ഏകതയും സംരക്ഷിക്കാൻ ഉചിതമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
