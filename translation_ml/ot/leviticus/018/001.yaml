id: LEV.18.1
reference: Leviticus 18:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ മോശെയോടു ഇങ്ങനെ പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: וַയിക്തോൽ രൂപം ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; דבר എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാളം ‘സംസാരിച്ചു’ എന്നാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റിയിട്ടില്ല.
- source_word: אֶל
  choice: -ഓടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന് സ്വാഭാവിക മലയാള ദത്തിവ് രൂപം ഉപയോഗിച്ചു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാളത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള ഉദ്ധരണി സൂചിപ്പിക്കുന്ന ദ്വിബിന്ദു
  rationale: ‘പറഞ്ഞുകൊണ്ട്/ഇങ്ങനെ പറഞ്ഞു’ എന്ന വാചകസൂത്രം മലയാളത്തിൽ പ്രത്യേകം ആവർത്തിക്കാതെ, അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വചനത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നിലനിർത്തി. മലയാള വായനക്കാർക്കിടയിൽ വ്യാപകമായി സ്ഥാപിതമായ ലിപ്യന്തരണരൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. എബ്രായത്തിലെ പതിവ് ദൈവവചന-ആമുഖം മലയാളത്തിൽ ചുരുക്കവും സ്വാഭാവികവുമായ നേരിട്ടുള്ള വാക്യമായി അവതരിപ്പിച്ചു.
