    issue: The divine name is rendered “യഹോവ.”
    rationale: The Hebrew has יְהוָה, and the English POB’s explicit lexical and theological decision renders this personal name “Yahweh.” “യഹോവ” corresponds to the alternate English form “Jehovah,” not to the adopted project rendering.
  - severity: low
    issue: לֵאמֹר is represented only implicitly by punctuation.
    rationale: A colon can introduce the following quotation, but “ഇങ്ങനെ” naturally and explicitly carries the Hebrew formula “saying,” while retaining a concise modern Malayalam style.
