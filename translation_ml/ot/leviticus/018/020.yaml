  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶל אֵ֨שֶׁת֙ עֲמִֽיתְ/ךָ֔ לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/זָ֑רַע לְ/טָמְאָה בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/020.yaml
  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: ml
  text: നിന്റെ അയൽക്കാരന്റെ ഭാര്യയുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്[a]; അങ്ങനെ നിന്നെത്തന്നെ അശുദ്ധനാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “നിന്റെ അയൽക്കാരന്റെ ഭാര്യയ്ക്ക് വിത്തായി നിന്റെ വീര്യസ്രാവം നൽകരുത്.”'
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: നിന്റെ അയൽക്കാരന്റെ ഭാര്യ
  rationale: ഈ നിയമസന്ദർഭത്തിൽ עָמִית് സമൂഹത്തിലെ മറ്റൊരു അംഗത്തെ സൂചിപ്പിക്കുന്നു. ‘അയൽക്കാരൻ’ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്
  rationale: വിത്താകുന്ന ശയനസ്രാവം നൽകുക എന്ന അക്ഷരാർഥചിത്രം ഇവിടെ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഭാഷാശൈലിയാണ്. മുഖ്യവാചകത്തിൽ അതിന്റെ അർഥം വ്യക്തമായി നൽകുകയും മൂലഭാഷയിലെ ചിത്രം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: לְטָמְאָה בָהּ
  choice: അവളിലൂടെ നിന്നെത്തന്നെ അശുദ്ധനാക്കുക
  rationale: അവസാനത്തെ അനന്തക്രിയാപദം ആ ബന്ധത്തിന്റെ ഫലമായ അശുദ്ധീകരണം സൂചിപ്പിക്കുന്നു. ‘അവളിലൂടെ’ എന്നത് בָהּ എന്ന പ്രയോഗത്തിന്റെ ഉപാധി/ബന്ധ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: നിരോധനത്തിന്റെ സ്വഭാവവും അശുദ്ധിയുടെ ഭാഷയും
  choice: അയൽക്കാരന്റെ ഭാര്യയുമായുള്ള ലൈംഗികബന്ധം നിരോധിക്കുകയും അതിലൂടെ അഭിസംബോധിതൻ അശുദ്ധനാകുന്നതായി പറയുകയും ചെയ്യുന്നു.
  alternative: അക്ഷരാർഥത്തിലുള്ള ശുക്ലസ്രാവചിത്രം മുഖ്യവാചകത്തിൽ നിലനിർത്തുക; അല്ലെങ്കിൽ അശുദ്ധിയെ പ്രത്യേകമായി ‘ആചാരപരമായ അശുദ്ധി’ എന്നു വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായ ഭാഷാശൈലി ലൈംഗികബന്ധത്തെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ טמא എന്ന പദം ഇവിടെ അശുദ്ധിയുടെ സ്വഭാവം കൂടുതൽ വിശദീകരിക്കുന്നില്ല. അതിനാൽ ‘അശുദ്ധൻ’ എന്ന വിശാലമായ പദം നിലനിർത്തി പ്രത്യേക ദൈവശാസ്ത്രവിഭാഗം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ നിയമശൈലി. ലൈംഗികപ്രയോഗം മറച്ചുവയ്ക്കാതെയും അനാവശ്യമായി ശരീരശാസ്ത്രപരമാക്കാതെയും വിവർത്തനം ചെയ്തു; മൂലപാഠത്തിലെ അശുദ്ധീകരണഭാഷ നിലനിർത്തി.
