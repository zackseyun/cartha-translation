source:
  edition: WLC
  text: וְ/אֶ֨ת זָכָ֔ר לֹ֥א תִשְׁכַּ֖ב מִשְׁכְּבֵ֣י אִשָּׁ֑ה תּוֹעֵבָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/022.yaml
  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: ml
  text: ഒരു സ്ത്രീയോടെന്നപോലെ ഒരു പുരുഷനോടുകൂടെ ശയിക്കരുത്[a]; അത് അറപ്പുളവാക്കുന്ന പ്രവൃത്തിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘സ്ത്രീയുമായുള്ള ശയനങ്ങൾ’; ഒരു സ്ത്രീയുമായുള്ള ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ശൈലിപ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכָר
  choice: ഒരു പുരുഷൻ
  rationale: זָכָר എന്നത് ആൺലിംഗത്തിലുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ നിയമവാക്യത്തിന്റെ ഈ സാഹചര്യത്തിൽ ‘പുരുഷൻ’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്; മൂലപാഠത്തിൽ ഇല്ലാത്ത കൂടുതൽ പ്രത്യേകമായ പ്രായപരിധിയോ ബന്ധസ്വഭാവമോ ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: תִשְׁכַּב
  choice: ശയിക്കരുത്
  rationale: שׁכב ഇവിടെ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ശിഷ്ടോക്തിയാണ്. ‘ശയിക്കുക’ എന്നത് എബ്രായ രൂപകത്തെ നിലനിർത്തുകയും സന്ദർഭത്തിൽ അർഥം ഗ്രഹിക്കാവുന്നതാക്കുകയും ചെയ്യുന്നു.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: ഒരു സ്ത്രീയോടെന്നപോലെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു സ്ത്രീയുടെ ശയനങ്ങൾ’ എന്ന ബഹുവചന നിർമാണമാണിത്; സ്ത്രീയുമായുള്ള ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. മലയാളത്തിലെ താരതമ്യഘടന അർഥവും മൂലത്തിലെ പരോക്ഷപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: תּוֹעֵבָה
  choice: അറപ്പുളവാക്കുന്നത്
  rationale: תּוֹעֵבָה ശക്തമായ വെറുപ്പിനും നിഷിദ്ധതയ്ക്കും പാത്രമായ ഒന്നിനെ സൂചിപ്പിക്കുന്നു. ‘അറപ്പുളവാക്കുന്നത്’ ആ ശക്തി ആധുനികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘മ്ലേച്ഛത’ പോലുള്ള അസംബന്ധമായ സാമൂഹിക അർഥച്ചായകൾ ഒഴിവാക്കുന്നു.
- source_word: הִוא
  choice: അത് ... ആണ്
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുൻപറഞ്ഞ പ്രവൃത്തിയെ ചൂണ്ടിക്കാണിക്കുന്നു. മലയാളത്തിൽ ‘അത് ... ആണ്’ സ്വാഭാവികമായ നിർദേശക വിധിവാക്യമാണ്.
theological_decisions:
- issue: വിശുദ്ധിനിയമങ്ങളുടെ പശ്ചാത്തലത്തിലുള്ള നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: പുരുഷനോടുകൂടെ ‘ഒരു സ്ത്രീയോടെന്നപോലെ’ ശയിക്കുന്ന പ്രവൃത്തിയെ നേരിട്ട് നിരോധിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി; മൂലപാഠത്തിൽ ഇല്ലാത്ത പരിമിതപ്പെടുത്തുന്ന വിശേഷണങ്ങൾ ചേർത്തില്ല.
  alternative: ഇത് ആരാധനാക്രമപരമോ ചൂഷണപരമോ ആയ ഒരു പ്രത്യേക പ്രവൃത്തിയിലേക്ക് മാത്രം ചുരുക്കി പരിഭാഷപ്പെടുത്തുക; അല്ലെങ്കിൽ പൊതുവായ ഒരു വ്യാഖ്യാനപദം ഉപയോഗിച്ച് വികസിപ്പിക്കുക.
  rationale: എബ്രായ വാക്യം പ്രത്യേകമായ താരതമ്യശൈലിയിൽ നേരിട്ടുള്ള നിരോധനം ഉന്നയിക്കുകയും ആ പ്രവൃത്തിയെ תּוֹעֵבָה എന്നു വിശേഷിപ്പിക്കുകയും ചെയ്യുന്നു. പരിഭാഷ മൂലപാഠം പറയുന്നതിലധികമോ കുറവോ പറയാതെ അതിന്റെ ഭാഷാപരമായ പരിധി നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. ‘ശയിക്കുക’ എന്ന ശിഷ്ടോക്തി മൂലത്തിലെ പരോക്ഷഭാഷ നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അപൂർവമായ എബ്രായ ബഹുവചനശൈലി വ്യക്തമാക്കുന്നു.
