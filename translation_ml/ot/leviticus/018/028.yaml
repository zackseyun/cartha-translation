source:
  edition: WLC
  text: וְ/לֹֽא תָקִ֤יא הָ/אָ֨רֶץ֙ אֶתְ/כֶ֔ם בְּ/טַֽמַּאֲ/כֶ֖ם אֹתָ֑/הּ כַּ/אֲשֶׁ֥ר קָאָ֛ה אֶת הַ/גּ֖וֹי אֲשֶׁ֥ר לִ/פְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/028.yaml
  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: ml
  text: നിങ്ങൾ അതിനെ അശുദ്ധമാക്കുമ്പോൾ, നിങ്ങൾക്കുമുമ്പുണ്ടായിരുന്ന ജനതയെ ദേശം ഛർദ്ദിച്ചുകളഞ്ഞതുപോലെ, ദേശം നിങ്ങളെയും ഛർദ്ദിച്ചുകളയാതിരിക്കേണ്ടതിന്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പുറത്തേക്കു തുപ്പിക്കളയാതിരിക്കേണ്ടതിന്.’ എബ്രായത്തിൽ, അശുദ്ധമാക്കപ്പെട്ട ദേശം തന്റെ നിവാസികളെ ശക്തമായി പുറന്തള്ളുന്നതിന്റെ സജീവമായ ഒരു രൂപകമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: ഛർദ്ദിച്ചുകളയുക / ഛർദ്ദിച്ചുകളഞ്ഞു
  rationale: ദേശത്തെ വ്യക്തിവൽക്കരിക്കുന്ന എബ്രായത്തിലെ ശക്തമായ പുറന്തള്ളൽരൂപകം അതേ തീവ്രതയോടെ നിലനിർത്തുന്നു; വെറും ‘പുറത്താക്കുക’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ദൃശ്യഭാവം വ്യക്തമാക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: സന്ദർഭം മുഴുവൻ ഭൂമിയെയല്ല, കനാൻദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ഭൂമി’ എന്നതിനെക്കാൾ ‘ദേശം’ യോജിക്കുന്നു.
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: നിങ്ങൾ അതിനെ അശുദ്ധമാക്കുമ്പോൾ
  rationale: בְ + infinitive construct എന്ന ഘടനയുടെ കാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും, טמא എന്ന ക്രിയയുടെ ‘അശുദ്ധമാക്കുക’ എന്ന കാരകഭാവം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: הַגּוֹי
  choice: ജനത
  rationale: മുമ്പത്തെ നിവാസികളെ ഏകവചനത്തിലുള്ള ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന גוי എന്ന പദത്തിന് ‘ജനത’ സ്വാഭാവികവും കൃത്യവുമാണ്; ‘വിജാതീയർ’ പോലുള്ള പദങ്ങൾ പിന്നീടുള്ള മതപരമായ സൂചനകൾ അനാവശ്യമായി ചേർക്കും.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: നിങ്ങൾക്കുമുമ്പുണ്ടായിരുന്ന
  rationale: ഇസ്രായേലിനു മുമ്പ് ആ ദേശത്ത് ഉണ്ടായിരുന്നവരെന്ന കാലപരമായ മുൻഗണന സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: וְלֹא
  choice: …ആതിരിക്കട്ടെ
  rationale: അക്ഷരാർഥത്തിലെ ‘എന്നും ഇല്ല’ എന്നതിനുപകരം, മുൻസന്ദർഭവുമായി ചേർന്നുള്ള നിഷേധാത്മക മുന്നറിയിപ്പ്/ഫലഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിയുടെ പ്രവർത്തകയായി ദേശത്തെ വ്യക്തിവൽക്കരിക്കൽ
  choice: നിവാസികളെ ‘ഛർദ്ദിച്ചുകളയുന്ന’ വ്യാകരണകർത്താവായി ദേശത്തെ നിലനിർത്തി.
  alternative: ദൈവം ദേശം മുഖേന അവരെ പുറത്താക്കുന്നു എന്ന് വിശദീകരിച്ച് രൂപകം മൃദുവാക്കുക.
  rationale: അശുദ്ധിയോട് പ്രതികരിച്ച് ദേശം തന്നെ നിവാസികളെ പുറന്തള്ളുന്നതായി എബ്രായവാക്യം വ്യക്തമായി ചിത്രീകരിക്കുന്നു. ദൈവത്തിന്റെ പരമാധികാരത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കാതെ ലേവ്യപുസ്തകത്തിലെ ധാർമിക അശുദ്ധി–ദേശമലിനീകരണം–പുറന്തള്ളൽ എന്ന ദൈവശാസ്ത്രപരമായ ബന്ധം ഈ രൂപകം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഛർദ്ദിച്ചുകളയുക’ എന്ന ശക്തമായ രൂപകം മനപ്പൂർവം നിലനിർത്തി; അടിക്കുറിപ്പ് സൂചകം മുഖ്യവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
