  naturalness: The wording is generally clear and modern. Recasting the final clause with ‘ഛർദ്ദിച്ചുകളയാതിരിക്കേണ്ടതിന്’ gives the expected warning force in formal modern Malayalam while preserving the verse’s syntactic dependence on its preceding context.
  terminology: ‘ദേശം,’ ‘അശുദ്ധമാക്കുക,’ ‘ജനത,’ and ‘ഛർദ്ദിച്ചുകളയുക’ are suitable. The strong metaphor should remain untranslated into a merely abstract ‘expel.’
