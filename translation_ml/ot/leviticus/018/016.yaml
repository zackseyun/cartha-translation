id: LEV.18.16
reference: Leviticus 18:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֶרְוַ֥ת אֵֽשֶׁת אָחִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה עֶרְוַ֥ת אָחִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/016.yaml
  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: ml
  text: നിന്റെ സഹോദരന്റെ ഭാര്യയുടെ നഗ്നത നീ അനാവൃതമാക്കരുത്[a]; അത് നിന്റെ സഹോദരന്റെ നഗ്നതയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യക്തമായി: ‘നിന്റെ സഹോദരന്റെ ഭാര്യയുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്.’ എബ്രായഭാഷയിൽ ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന പരോക്ഷപ്രയോഗമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: നഗ്നത
  rationale: ലേവ്യപുസ്തകം 18-ലെ גלה ערוה എന്ന നിയമപരവും പരോക്ഷവുമായ പ്രയോഗം നിരോധിത ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന് നിലനിർത്തുന്നത് മൂലത്തിലെ രൂപകവും അധ്യായത്തിലുടനീളമുള്ള പദസാമ്യവും സംരക്ഷിക്കുന്നു.
- source_word: אֵשֶׁת אָחִיךָ
  choice: നിന്റെ സഹോദരന്റെ ഭാര്യ
  rationale: സംബന്ധസൂചക ഘടന ഇവിടെ വിവാഹബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘സ്ത്രീ’ എന്നതിനെക്കാൾ ‘ഭാര്യ’ കൃത്യമാണ്.
- source_word: לֹא תְגַלֵּה
  choice: നീ അനാവൃതമാക്കരുത്
  rationale: לֹא ചേർന്ന അപൂർണക്രിയ നിയമപരമായ നിരോധനമാണ്. ‘അനാവൃതമാക്കരുത്’ എന്നത് ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ നിരോധനവും മൂലപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: അത് നിന്റെ സഹോദരന്റെ നഗ്നതയാണ്
  rationale: മൂലത്തിലെ ആവർത്തനവും നിരോധനത്തിന് നൽകുന്ന ബന്ധപരവും നിയമപരവുമായ അടിസ്ഥാനവും അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിയമപരമായ പരോക്ഷപ്രയോഗത്തെ നേരിട്ട് ലൈംഗികബന്ധത്തിന്റെ നിരോധനമായി വ്യക്തമാക്കണമോ എന്നത്
  choice: പ്രധാന പാഠത്തിൽ ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന എബ്രായ പരോക്ഷപ്രയോഗം നിലനിർത്തുക
  alternative: നിന്റെ സഹോദരന്റെ ഭാര്യയുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്
  rationale: മൂലപാഠം നേരിട്ടുള്ള പ്രയോഗത്തിനുപകരം സ്ഥിരമായ നിയമപരമായ പരോക്ഷപ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്. അത് നിലനിർത്തുന്നത് മൂലത്തോടുള്ള അടുപ്പവും ലേവ്യപുസ്തകം 18-ലെ പദസാമ്യവും സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ. ‘അനാവൃതമാക്കുക’ എന്ന പദം മൂലത്തിലെ പരോക്ഷപ്രയോഗം നിലനിർത്തുന്നു; അർഥവ്യക്തതയ്ക്കായി അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു.
