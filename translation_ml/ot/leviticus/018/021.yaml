source:
  edition: WLC
  text: וּ/מִֽ/זַּרְעֲ/ךָ֥ לֹא תִתֵּ֖ן לְ/הַעֲבִ֣יר לַ/מֹּ֑לֶךְ וְ/לֹ֧א תְחַלֵּ֛ל אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: ml
  text: നിന്റെ സന്തതിയിൽനിന്ന് ആരെയും[a] മോലെക്കിനുവേണ്ടി കടത്തിവിടാൻ കൊടുക്കരുത്[b]. നിന്റെ ദൈവത്തിന്റെ നാമത്തെ അപവിത്രമാക്കരുത്. ഞാൻ യഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ മക്കളിൽ ആരെയും.’ എബ്രായയിൽ അക്ഷരാർഥം ‘നിന്റെ വിത്തിൽനിന്ന്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: മോലെക്കുമായി ബന്ധപ്പെട്ട ഒരു ആചാരത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്. ഇതിനെ ശിശുബലിയായി പലരും മനസ്സിലാക്കുന്നു; മറ്റിടങ്ങളിൽ മക്കളെ ‘തീയിലൂടെ കടത്തുക’ എന്ന് ഈ ആചാരത്തെ വിവരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: നിന്റെ സന്തതിയിൽ ആരെയും
  rationale: זֶרַע എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വിത്ത്’ എന്നാണെങ്കിലും ഇവിടെ അത് ഒരാളുടെ സന്തതിയെ സൂചിപ്പിക്കുന്നു. מִן എന്ന ഭാഗികപ്രയോഗത്തിന്റെ ‘ആരെയും’ എന്ന അർഥവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: תִתֵּן
  choice: കൊടുക്കരുത്
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ ‘കൊടുക്കുക’ എന്ന അർഥവും നിയമപരമായ നിരോധനത്തിന്റെ ശക്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְהַעֲבִיר
  choice: കടത്തിവിടാൻ
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘കടന്നുപോകാൻ ഇടയാക്കുക/കടത്തിവിടുക’ എന്നാണ്. ആചാരത്തിന്റെ കൃത്യസ്വഭാവം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ എബ്രായ പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לַמֹּלֶךְ
  choice: മോലെക്കിനുവേണ്ടി
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങളും പരമ്പരാഗത ധാരണയും മോലെക്ക് എന്ന പേരിനെ പിന്തുണയ്ക്കുന്നു. ഇവിടെ ദേവതയുമായി ബന്ധപ്പെട്ട ആചാരപരമായ സമർപ്പണബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘-നുവേണ്ടി’ ഉപയോഗിച്ചു.
- source_word: תְחַלֵּל
  choice: അപവിത്രമാക്കരുത്
  rationale: חלל എന്ന പീയേൽ രൂപത്തിന്റെ ‘വിശുദ്ധത ലംഘിക്കുക, അപവിത്രമാക്കുക’ എന്ന ഉടമ്പടിപരവും ആരാധനാപരവുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവത്തിന്റെ നാമത്തെ
  rationale: ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട മഹത്വത്തെയും കീർത്തിയെയും പ്രതിനിധാനം ചെയ്യുന്ന ‘നാമം’ എന്ന ആശയത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: മോലെക്കുമായി ബന്ധപ്പെട്ട നിരോധിത പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: ‘കടത്തിവിടാൻ’ എന്ന എബ്രായ ശൈലി മുഖ്യപാഠത്തിൽ നിലനിർത്തി; തീയിലൂടെയോ ബലിയായോ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ മാത്രം നൽകി.
  alternative: ‘മക്കളെ മോലെക്കിനു ബലിയർപ്പിക്കരുത്’ അല്ലെങ്കിൽ ‘തീയിലൂടെ കടത്തിവിടരുത്’
  rationale: ഈ വാക്യത്തിൽ തീയെ നേരിട്ട് പരാമർശിക്കുന്നില്ല. വിശാലമായ തിരുവെഴുത്തുപശ്ചാത്തലം ശിശുബലിയെയും തീയുമായി ബന്ധപ്പെട്ട ആചാരത്തെയും ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, മുഖ്യപാഠം അതിലധികം വ്യക്തമാക്കുന്നത് മൂലപാഠത്തിലെ അവ്യക്തത നീക്കിക്കളയും.
- issue: זֶרַע എന്ന പദത്തിന്റെ ഇവിടെ ഉദ്ദേശിക്കുന്നവർ
  choice: ‘സന്തതി’
  alternative: ‘മക്കൾ’ അല്ലെങ്കിൽ ‘വിത്ത്’
  rationale: ‘സന്തതി’ എന്നത് എബ്രായപദത്തിന്റെ കുടുംബപരമായ അർഥം സ്വാഭാവികമായി നൽകുകയും പ്രായവിഭാഗം അനാവശ്യമായി പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ നിരോധനശക്തി നിലനിർത്തുന്നതിനൊപ്പം മോലെക്ക് ആചാരത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള യഥാർഥ അവ്യക്തത മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
