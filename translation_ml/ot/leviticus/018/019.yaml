  terminology: ‘ആചാരപരമായ അശുദ്ധി’ properly distinguishes the Levitical ritual-purity category from hygiene, medicine, or moral defilement. The footnote should say that the Hebrew uses ritual-purity language, rather than the less precise ‘language related to ritual purity.’
