  yaml_path: translation/ot/leviticus/018/019.yaml
  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: ml
  text: ഒരു സ്ത്രീ അവളുടെ ആർത്തവകാലത്തെ ആചാരപരമായ അശുദ്ധിയിലായിരിക്കുമ്പോൾ, അവളുടെ നഗ്നത അനാവൃതമാക്കാൻ അവളെ സമീപിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളുടെ ആർത്തവ അശുദ്ധിയിൽ.’ ഇവിടെ എബ്രായപാഠം ആചാരപരമായ ശുദ്ധി-അശുദ്ധിയുമായി ബന്ധപ്പെട്ട ഭാഷ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה
  choice: ഒരു സ്ത്രീയെ ... സമീപിക്കരുത്
  rationale: אִשָּׁה ഇവിടെ ഉടമസ്ഥസൂചനയില്ലാതെ പൊതുവായി വരുന്നതിനാൽ ‘ഒരു സ്ത്രീ’ എന്നു പരിഭാഷപ്പെടുത്തി. אֶל എന്നത് קָרַב എന്ന ക്രിയയോടൊപ്പം ‘സമീപിക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: അവളുടെ ആർത്തവകാലത്തെ അശുദ്ധിയിൽ
  rationale: נִדָּה ആർത്തവവുമായി ബന്ധപ്പെട്ട അവസ്ഥയെയും טֻמְאָה ലേവ്യപുസ്തകത്തിലെ ആചാരപരമായ അശുദ്ധിയെയും സൂചിപ്പിക്കുന്നു. ‘ആർത്തവകാലത്തെ അശുദ്ധി’ ഈ ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לֹא תִקְרַב
  choice: സമീപിക്കരുത്
  rationale: നിയമപരമായ നിരോധനം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിധത്തിൽ പ്രകടമാക്കുന്നു; ലൈംഗികബന്ധത്തിനായി അടുത്തുചെല്ലുക എന്ന സന്ദർഭസൂചനയും നിലനിർത്തുന്നു.
- source_word: לְ/גַלּוֹת
  choice: അനാവൃതമാക്കാൻ
  rationale: גלה എന്ന ക്രിയയുടെ ‘മറ നീക്കുക/വെളിപ്പെടുത്തുക’ എന്ന അർഥവും ലേവ്യപുസ്തകം 18-ലെ നിയമപരമായ പരോക്ഷപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: עֶרְוָתָהּ
  choice: അവളുടെ നഗ്നത
  rationale: עֶרְוָה എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥവും ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന ലൈംഗിക പരോക്ഷപ്രയോഗവും അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അശുദ്ധിയെ ആചാരപരമായ വിഭാഗമായോ കേവലം ശാരീരികമോ വൈദ്യശാസ്ത്രപരമോ ആയ അവസ്ഥയായോ അവതരിപ്പിക്കൽ
  choice: ആർത്തവകാലത്തെ അശുദ്ധി
  alternative: ആർത്തവകാലം; ആർത്തവ അശുദ്ധി
  rationale: טֻמְאָה ലേവ്യപുസ്തകത്തിൽ ആചാരശുദ്ധിയുമായി ബന്ധപ്പെട്ട പദമാണ്. ‘അശുദ്ധി’ മൂലപാഠത്തിന്റെ വിഭാഗം സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അത് ധാർമ്മിക മലിനതയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന പരോക്ഷപ്രയോഗം മൂലപാഠത്തിലെ ലൈംഗിക നിയമഭാഷ സംരക്ഷിക്കുന്നു; ‘അശുദ്ധി’ എന്നത് ആചാരപരമായ അർഥത്തിലാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
