source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחֽוֹת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה כִּֽי שְׁאֵ֥ר אִמְּ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/013.yaml
  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: ml
  text: നിന്റെ അമ്മയുടെ സഹോദരിയുടെ നഗ്നത നീ അനാവൃതമാക്കരുത്[a]; അവൾ നിന്റെ അമ്മയുടെ അടുത്ത രക്തബന്ധുവാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അർഥവ്യക്തമായി: “നിന്റെ അമ്മയുടെ സഹോദരിയുമായി നീ ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്.” ഹീബ്രുവിൽ അക്ഷരാർഥം: “നിന്റെ അമ്മയുടെ സഹോദരിയുടെ നഗ്നത നീ അനാവൃതമാക്കരുത്.”'
    reason: lexical_alternative
  - marker: b
    text: “അടുത്ത രക്തബന്ധു” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന שְׁאֵר (ഷെഏർ) അടുത്ത മാംസബന്ധുവിനെ സൂചിപ്പിക്കുന്ന ഒരു ബന്ധുത്വപദമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת
  choice: നഗ്നത
  rationale: ലേവ്യപുസ്തകം 18-ൽ ആവർത്തിക്കുന്ന ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന നിയമപരമായ പരോക്ഷപ്രയോഗം നിലനിർത്തുന്നു; ഇത് നിരോധിത ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: תְגַלֵּה
  choice: നീ അനാവൃതമാക്കരുത്
  rationale: പീഏൽ രൂപത്തിലുള്ള גלהയും עֶרְוָהയും ചേർന്ന സ്ഥിരമായ നിരോധനസൂത്രം ഔപചാരിക നിയമശൈലിയിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲחוֹת אִמְּךָ
  choice: നിന്റെ അമ്മയുടെ സഹോദരി
  rationale: ഹീബ്രു ബന്ധപദഘടന നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു; ‘അമ്മായി’ എന്നതിനെക്കാൾ ബന്ധം കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׁאֵר
  choice: അടുത്ത രക്തബന്ധു
  rationale: ബന്ധുത്വനിയമസന്ദർഭത്തിൽ അടുത്ത മാംസബന്ധുവിനെയോ രക്തബന്ധുവിനെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כִּי
  choice: അവൾ … ആണ്
  rationale: നിരോധനത്തിന്റെ കാരണം മലയാളത്തിൽ സ്വാഭാവികമായ അർഥബന്ധത്തിലൂടെ അവതരിപ്പിക്കുന്നു; വേണമെങ്കിൽ ‘കാരണം’ ചേർക്കാമെങ്കിലും ഇവിടെ അർഥം വ്യക്തമാണ്.
- source_word: הִוא
  choice: അവൾ
  rationale: കാരണമൊഴിയിലെ സ്ത്രീലിംഗ ഏകവചന കർത്താവിനെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: അഗമ്യഗമനനിയമത്തിലെ പരോക്ഷപ്രയോഗത്തിന്റെ അവതരണം
  choice: മുഖ്യപാഠത്തിൽ ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന പരോക്ഷപ്രയോഗം നിലനിർത്തുക
  alternative: ‘ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്’ എന്ന് ചലനാത്മകമായി പരിഭാഷപ്പെടുത്തുക
  rationale: ഹീബ്രു പാഠം ലേവ്യപുസ്തകം 18 മുഴുവൻ ആവർത്തിക്കുന്ന ഔപചാരിക നിയമപരമായ പരോക്ഷപ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്. അതിനെ നിലനിർത്തുന്നത് സാഹിത്യപരമായ ഏകതയും നിയമശൈലിയും സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമഭാഷ ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തിത പരോക്ഷപ്രയോഗം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും അതിന്റെ ലൈംഗിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
