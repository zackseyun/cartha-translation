source:
  edition: WLC
  text: עֶרְוַ֥ת אֵֽשֶׁת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה עֶרְוַ֥ת אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/008.yaml
  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: ml
  text: നിന്റെ അപ്പന്റെ ഭാര്യയുടെ നഗ്നത നീ അനാവൃതമാക്കരുത്[a]; അത് നിന്റെ അപ്പന്റെ നഗ്നതയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യക്തമായി: ‘നിന്റെ അപ്പന്റെ ഭാര്യയുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘നഗ്നത അനാവൃതമാക്കുക’ എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: നഗ്നത
  rationale: ലേവ്യപുസ്തകം 18-ൽ ആവർത്തിക്കുന്ന ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന നിയമപരമായ ശിഷ്ടപ്രയോഗം നിലനിർത്തുന്നു; ഇത് നിരോധിത ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മുഖ്യപാഠത്തിൽ അതിനെ വിശദീകരിച്ചുപറയുന്നില്ല.
- source_word: אֵשֶׁת
  choice: ഭാര്യ
  rationale: ‘നിന്റെ അപ്പന്റെ’ എന്നതോടു ചേർന്ന നിർമാണത്തിൽ ഇത് വിവാഹബന്ധത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: לֹא תְגַלֵּה
  choice: നീ അനാവൃതമാക്കരുത്
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണ്ണക്രിയയുടെ നിയമപരമായ വിലക്ക് സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും എബ്രായ രൂപകം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אָבִיךָ
  choice: നിന്റെ അപ്പൻ
  rationale: നേരിട്ടുള്ള ബന്ധപദപ്രയോഗം; വാക്യത്തിലെ ആവർത്തനം വ്യക്തതയ്ക്കും മൂലപാഠസാദൃശ്യത്തിനുമായി നിലനിർത്തുന്നു.
- source_word: הִוא
  choice: അത് ... ആണ്
  rationale: സ്ത്രീലിംഗ സർവനാമം ‘നഗ്നത’ എന്ന സ്ത്രീലിംഗ നാമത്തെയാണ് തിരിച്ചുസൂചിപ്പിക്കുന്നത്; അതിനാൽ സ്ത്രീയെ സൂചിപ്പിക്കുന്ന ‘അവൾ’ എന്നതിനു പകരം മലയാളത്തിൽ ‘അത്’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ശിഷ്ടപ്രയോഗത്തെ ലൈംഗികബന്ധത്തിനുള്ള വ്യക്തമായ വിലക്കായി മുഖ്യപാഠത്തിൽ പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന ആവർത്തിത നിയമസൂത്രം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘നിന്റെ അപ്പന്റെ ഭാര്യയുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്’
  rationale: എബ്രായ പാഠത്തിന്റെ ശിഷ്ടപ്രയോഗവും അധ്യായത്തിലുടനീളമുള്ള പദസാമ്യവും സംരക്ഷിക്കുന്നു; വ്യക്തമായ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു, അതുവഴി രൂപകത്തെ മൗനമായി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അധ്യായത്തിലെ നിയമപരമായ ആവർത്തിത ശൈലി സംരക്ഷിക്കാൻ ‘നഗ്നത അനാവൃതമാക്കുക’ ഉപയോഗിച്ചു.
