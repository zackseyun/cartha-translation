id: LEV.18.2
reference: Leviticus 18:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക: ‘ഞാൻ നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ ആകുന്നു.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: സംസാരിച്ച്
  rationale: ദൈവം മോശെയോടു നൽകുന്ന നേരിട്ടുള്ള കല്പനയാണ്; തുടർന്നുവരുന്ന ‘പറയുക’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ ഇത് അവതരിപ്പിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബ-ഉടമ്പടി പ്രയോഗം നിലനിർത്തുകയും, മലയാളത്തിൽ പതിവും സ്വാഭാവികവുമായ സംയുക്തരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: അവരോടു പറയുക
  rationale: എബ്രായത്തിലെ തുടർച്ചയായ കല്പനയുടെ നേരിട്ടുള്ള ഭാവവും ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: אֲנִי
  choice: ഞാൻ ... ആണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ തിരിച്ചറിയൽ വാക്യഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: രണ്ടാംപുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയവും, യഹോവയെ സൂചിപ്പിക്കുന്ന ഏകവചന അർഥവും കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയാണുള്ളത്. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; മലയാള വായനക്കാർക്കിടയിൽ സ്ഥിരപ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപമാണ് തെരഞ്ഞെടുത്തത്. ‘യാഹ്‌വേ’ എന്നത് പുനർനിർമിത ഉച്ചാരണത്തെ കൂടുതൽ അടുത്ത് പ്രതിനിധീകരിക്കുന്ന മറ്റൊരു രൂപമാണ്.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഇത് ഉടമ്പടിജനത്തെ കുടുംബബന്ധത്തിൽ അവതരിപ്പിക്കുന്ന പ്രയോഗമാണ്. അതിന്റെ കുടുംബസങ്കൽപ്പം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികവും സമൂഹത്തെ മുഴുവനായി ഉൾക്കൊള്ളുന്നതുമായ രൂപം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. എബ്രായത്തിലെ ‘സംസാരിക്കുക ... പറയുക’ എന്ന ഇരട്ട ക്രിയ നിലനിർത്തി; എന്നാൽ മലയാളത്തിൽ സ്വാഭാവികമാകാൻ ആദ്യക്രിയയെ ക്രിയാവിശേഷണരൂപത്തിൽ ചേർത്തു.
