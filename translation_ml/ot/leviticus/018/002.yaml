  to: 'ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക: ‘ഞാൻ നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ ആകുന്നു.’'
