source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֣י בָּ/הֶ֑ם אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: ml
  text: അതുകൊണ്ട് നിങ്ങൾ എന്റെ ചട്ടങ്ങളും ന്യായവിധികളും പാലിക്കണം. ഒരു മനുഷ്യൻ[a] അവ അനുഷ്ഠിച്ചാൽ, അവയാൽ[b] ജീവിക്കും. ഞാൻ യഹ്‌വെ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരെങ്കിലും.” ഇവിടെ “മനുഷ്യൻ” എന്ന എബ്രായ ഏകവചനപ്രയോഗം ഏതു മനുഷ്യനെയും പ്രതിനിധീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവയിൽ ജീവിക്കും.” എബ്രായത്തിലെ മുൻപ്രത്യയം ഉപാധിയെ (“അവയാൽ”) അല്ലെങ്കിൽ ജീവിതത്തിന്റെ മേഖലയെ (“അവയിൽ”) സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: അതുകൊണ്ട് നിങ്ങൾ ... പാലിക്കണം
  rationale: നിയമനിർദേശത്തിലെ സംയോജകത്തോടുകൂടിയ ക്രിയയുടെ ആജ്ഞാത്മക ഭാവം ‘പാലിക്കണം’ എന്നു സ്വാഭാവികമായി നൽകി; മുൻസന്ദർഭത്തോടുള്ള ബന്ധം ‘അതുകൊണ്ട്’ വ്യക്തമാക്കുന്നു.
- source_word: חֻקֹּתַי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: നിർദേശിക്കപ്പെട്ട നിയമവ്യവസ്ഥകളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ഔപചാരിക നിയമാർഥം നിലനിർത്തുന്നു.
- source_word: מִשְׁפָּטַי
  choice: എന്റെ ന്യായവിധികൾ
  rationale: חֻקֹּתַי എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് നിയമപരമായ വിധികൾ/ന്യായനിർണയങ്ങൾ എന്ന അർഥം നൽകുന്നു.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם
  choice: അവ അനുഷ്ഠിച്ചാൽ
  rationale: עשה എന്ന ക്രിയയിലെ പ്രായോഗിക അനുസരണത്തിന്റെ ആശയം ‘അനുഷ്ഠിക്കുക’ നിലനിർത്തുന്നു; വാക്യബന്ധത്തിൽ അന്തർലീനമായ നിബന്ധനാഭാവം ‘-ച്ചാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: הָאָדָם
  choice: ഒരു മനുഷ്യൻ
  rationale: എബ്രായത്തിലെ ഏകവചന പ്രതിനിധിപ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെ അത് ഒരു പ്രത്യേക വ്യക്തിയെ മാത്രം സൂചിപ്പിക്കുന്നില്ലെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וָחַי
  choice: ജീവിക്കും
  rationale: അനുസരണത്തിന്റെ ഫലമായി ജീവിക്കുക എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; ജീവിതത്തിന്റെ കാലപരമോ ഉടമ്പടിപരമോ നിത്യപരമോ ആയ വ്യാപ്തി നിർവചിക്കുന്നില്ല.
- source_word: בָּהֶם
  choice: അവയാൽ
  rationale: בְּ എന്ന മുൻപ്രത്യയത്തിന്റെ ഉപാധിസൂചകമായ ‘അവയാൽ’ എന്ന വായന പ്രധാനപാഠത്തിൽ നൽകുന്നു; സ്ഥലമോ ജീവിതമേഖലയോ സൂചിപ്പിക്കുന്ന ‘അവയിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: ‘അവയാൽ ജീവിക്കും’ എന്നതിലെ ജീവിതത്തിന്റെ വ്യാപ്തി
  choice: ജീവിതം കാലിക സമൃദ്ധിയോ ദേശത്തിലെ ഉടമ്പടിജീവിതമോ നിത്യജീവനോ എന്നു നിർണ്ണയിക്കാതെ വിശാലമായ പ്രയോഗം നിലനിർത്തി.
  alternative: അവയിലൂടെ ജീവൻ പ്രാപിക്കും
  rationale: മൂലപാഠം വാഗ്ദാനം ചെയ്യുന്ന ജീവിതത്തിന്റെ കൃത്യമായ വ്യാപ്തി വ്യക്തമാക്കുന്നില്ല; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പരിഭാഷ ദൈവശാസ്ത്രപരമായ സംഘർഷം അനാവശ്യമായി പരിഹരിച്ചേനേ.
- issue: אָדָם എന്ന ഏകവചന പ്രതിനിധിപ്രയോഗം
  choice: ഒരു മനുഷ്യൻ
  alternative: ആരെങ്കിലും / ഒരു വ്യക്തി
  rationale: മൂലത്തിലെ ഏകവചന മനുഷ്യപ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും അതിന്റെ പൊതുവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. സമാന്തരമായ നിയമപദങ്ങളുടെ വ്യത്യാസം ‘ചട്ടങ്ങൾ / ന്യായവിധികൾ’ എന്നായി നിലനിർത്തി; ദൈവശാസ്ത്രപരമായി നിർണ്ണായകമായ ‘ജീവിക്കും’ എന്ന പ്രയോഗം വിശദീകരിച്ച് ചുരുക്കിയില്ല.
