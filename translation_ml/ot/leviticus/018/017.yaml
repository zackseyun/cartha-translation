revisions:
- from: ഒരു സ്ത്രീയുടെയും അവളുടെ മകളുടെയും നഗ്നത അനാവൃതമാക്കരുത്.[a] അവളുടെ മകന്റെ മകളെയോ മകളുടെ മകളെയോ അവളുടെ നഗ്നത അനാവൃതമാക്കേണ്ടതിന് സ്വീകരിക്കരുത്; അവർ അടുത്ത രക്തബന്ധുക്കളാണ്.[b] അത് ഒരു നീചകൃത്യമാണ്.[c]
  to: ഒരു സ്ത്രീയുടെയും അവളുടെ മകളുടെയും നഗ്നത വെളിപ്പെടുത്തരുത്.[a] അവളുടെ നഗ്നത വെളിപ്പെടുത്തുന്നതിനായി അവളുടെ മകന്റെ മകളെയോ അവളുടെ മകളുടെ മകളെയോ സ്വീകരിക്കരുത്; അവർ അവളുടെ അടുത്ത രക്തബന്ധുക്കളാണ്.[b] അത് ഒരു നീചകൃത്യമാണ്.[c]
  rationale: The revision removes a Malayalam tautology while retaining the Hebrew ‘uncover nakedness’ idiom and its legal-register force. It also supplies the possessive relationship inherent in שַׁאֲרָה. The kinship distinctions, the deliberately broad sense of ‘take,’ the singular ‘her’ in the purpose clause, and the force of זִמָּה remain intact.
