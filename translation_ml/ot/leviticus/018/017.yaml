reference: Leviticus 18:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: ml
  text: ഒരു സ്ത്രീയുടെയും അവളുടെ മകളുടെയും നഗ്നത വെളിപ്പെടുത്തരുത്.[a] അവളുടെ നഗ്നത വെളിപ്പെടുത്തുന്നതിനായി അവളുടെ മകന്റെ മകളെയോ അവളുടെ മകളുടെ മകളെയോ സ്വീകരിക്കരുത്; അവർ അവളുടെ അടുത്ത രക്തബന്ധുക്കളാണ്.[b] അത് ഒരു നീചകൃത്യമാണ്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നഗ്നത വെളിപ്പെടുത്തുക’ എന്നത് നിരോധിത ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവർ അവളുടെ മാംസമാണ്’; അതായത്, അവളുടെ അടുത്ത രക്തബന്ധുക്കൾ.'
    reason: lexical_alternative
  - marker: c
    text: 'മറ്റുവിധത്തിൽ: ‘ദുഷ്ടത,’ ‘അശ്ലീലകൃത്യം,’ അല്ലെങ്കിൽ ‘അതിക്രമമായ പ്രവൃത്തി.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה / לְגַלּוֹת עֶרְוָתָהּ
  choice: നഗ്നത അനാവൃതമാക്കുക
  rationale: ലേവ്യപുസ്തകത്തിൽ നിരോധിത ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ എബ്രായ പ്രയോഗത്തിന്റെ രൂപകവും നിയമശൈലിയും നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אִשָּׁה
  choice: ഒരു സ്ത്രീ
  rationale: ഈ നാമത്തിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. ഇവിടെ വിവാഹബന്ധം മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കാത്തതിനാൽ വിശാലമായ ‘സ്ത്രീ’ തിരഞ്ഞെടുത്തു.
- source_word: וּבִתָּהּ
  choice: അവളുടെ മകൾ
  rationale: സ്ത്രീയെ സൂചിപ്പിക്കുന്ന പ്രത്യയം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: תִקַּח
  choice: സ്വീകരിക്കുക
  rationale: മൂലത്തിലെ ‘എടുക്കുക’ എന്ന വിശാല ക്രിയ വിവാഹത്തെയോ ലൈംഗികമായി കൂടെക്കൊള്ളുന്നതിനെയോ സൂചിപ്പിക്കാം. ‘വിവാഹം കഴിക്കുക’ എന്നു ചുരുക്കാതെ ഈ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: בַּת בְּנָהּ
  choice: അവളുടെ മകന്റെ മകൾ
  rationale: മൂലത്തിലെ ബന്ധഘടനയും നിയമപരമായ കൃത്യതയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בַּת בִּתָּהּ
  choice: അവളുടെ മകളുടെ മകൾ
  rationale: മൂലത്തിലെ ബന്ധഘടന നേരിട്ട് നിലനിർത്തുകയും മകന്റെ മകൾ എന്ന മുൻപ്രയോഗവുമായി സമാന്തരത പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: שַׁאֲרָה הֵנָּה
  choice: അവർ അടുത്ത രക്തബന്ധുക്കളാണ്
  rationale: ശാരീരിക/രക്തബന്ധത്തെ സൂചിപ്പിക്കുന്ന ‘അവളുടെ മാംസം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: זִמָּה
  choice: നീചകൃത്യം
  rationale: ലൈംഗികസന്ദർഭത്തിലുള്ള ഗുരുതരമായ അധാർമികതയെയും അതിക്രമത്തെയും സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ശക്തി സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘അവളുടെ നഗ്നത’ എന്ന ഏകവചന പ്രത്യയത്തിന്റെ സൂചിതവ്യക്തി
  choice: പ്രത്യയം വികസിപ്പിക്കാതെ ‘അവളുടെ’ എന്നു നിലനിർത്തി; വ്യാകരണപരമായി അത് ആദ്യം പറഞ്ഞ സ്ത്രീയിലേക്കാണ് സ്വാഭാവികമായി മടങ്ങുന്നത്.
  alternative: ഓരോ സന്തതിയെയും പ്രത്യേകം സൂചിപ്പിക്കുന്ന വിതരണാർഥമായി വായിക്കുക.
  rationale: മൂലത്തിലെ ഏകവചനവും അതിലുള്ള സാദ്ധ്യമായ ബന്ധവും അതേപടി സൂക്ഷിച്ച് വ്യാഖ്യാനത്തെ പരിഭാഷയിൽ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- issue: תִקַּח എന്ന ക്രിയയുടെ നിയമപരമായ വ്യാപ്തി
  choice: ‘സ്വീകരിക്കരുത്’ എന്നു നൽകി വിവാഹത്തിൽ മാത്രം ഒതുക്കിയില്ല.
  alternative: ‘വിവാഹം കഴിക്കരുത്’ അല്ലെങ്കിൽ ‘ഭാര്യയായി സ്വീകരിക്കരുത്.’
  rationale: തുടർന്നുള്ള ലൈംഗികപ്രയോഗം നിരോധനത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു; ‘വിവാഹം’ എന്നു മാത്രം പറഞ്ഞാൽ എബ്രായത്തേക്കാൾ പരിധി ചുരുങ്ങാം.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ മാന്യമായ നിയമശൈലി സ്വീകരിച്ചു. ബന്ധപദങ്ങൾ മൂലത്തിലെ കൃത്യമായ ഘടനയിൽ നിലനിർത്തി; അപരിചിതമായ എബ്രായ ലൈംഗികപ്രയോഗം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
