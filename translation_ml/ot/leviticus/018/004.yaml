lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: എന്റെ വിധികൾ
  rationale: מִשְׁפָּט എന്ന പദത്തിന്റെ നിയമപരമായ ‘വിധികൾ/നിയമനിർണയങ്ങൾ’ എന്ന അർഥം നിലനിർത്തുന്നു; חֻקֹּתַי എന്നതിൽനിന്നുള്ള വ്യത്യാസവും സൂക്ഷിക്കുന്നു.
- source_word: תַּעֲשׂוּ
  choice: നിങ്ങൾ അനുഷ്ഠിക്കണം
  rationale: עשה എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘ചെയ്യുക’ ആണെങ്കിലും, നിയമകല്പനകളുടെ സന്ദർഭത്തിൽ ‘അനുഷ്ഠിക്കുക’ യഥാർഥമായി പ്രാവർത്തികമാക്കുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֻקֹּתַי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: חֻקָּה നിർദേശിക്കപ്പെട്ട നിയമത്തെയോ ചട്ടത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ചട്ടങ്ങൾ’ നിയമപരമായ ഭാവം നിലനിർത്തുകയും מִשְׁפָּטַי എന്നതുമായ പദവ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: תִּשְׁמְרוּ
  choice: പാലിച്ച്
  rationale: שׁמר എന്നതിന്റെ ‘കാത്തുസൂക്ഷിക്കുക/പാലിക്കുക’ എന്ന ഉടമ്പടിനിയമപരമായ അർഥം ഇവിടെ ‘പാലിക്കുക’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָלֶכֶת בָּהֶם
  choice: അവയിൽ നടക്കണം
  rationale: ദൈവത്തിന്റെ കല്പനകൾക്കനുസൃതമായി ജീവിതം നയിക്കുക എന്ന ഹീബ്രു രൂപകം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയത്തോടുകൂടിയ സംയുക്തരൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകി ഉടമ്പടിബന്ധം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു ബിരുദനാമം പകരംവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: לָלֶכֶת בָּהֶם എന്ന പ്രയോഗത്തിന്റെ ശക്തി
  choice: അവയിൽ നടക്കണം
  alternative: അവ അനുസരിച്ച് ജീവിക്കണം
  rationale: ജീവിതനടത്തത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; ‘ജീവിക്കുക’ എന്ന വ്യാഖ്യാനപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ രണ്ട് പദങ്ങളുടെ വ്യത്യാസം ‘വിധികൾ/ചട്ടങ്ങൾ’ എന്നു സൂക്ഷിച്ചു; ഹീബ്രുവിലെ ‘നടക്കുക’ എന്ന ജീവിതരൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
