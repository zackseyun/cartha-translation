revisions:
- from: ഒരു മൃഗത്തോടും ശയിച്ച് അതിനാൽ നിന്നെത്തന്നെ അശുദ്ധനാക്കരുത്[a]. ഒരു മൃഗം തന്നോടു ഇണചേരേണ്ടതിന് ഒരു സ്ത്രീ അതിന്റെ മുമ്പിൽ നിൽക്കരുത്[b]. അത് ഒരു വികൃതിയാണ്[c].
  to: ഒരു മൃഗത്തോടും ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്; അതോടുകൂടെ അശുദ്ധനാകരുത്[a]. ഒരു സ്ത്രീ ഒരു മൃഗത്തിന്റെ മുമ്പിൽ നിൽക്കരുത്, മൃഗം അവളുമായി ഇണചേരേണ്ടതിന്[b]. ഇത് ക്രമഭംഗമാണ്[c].
