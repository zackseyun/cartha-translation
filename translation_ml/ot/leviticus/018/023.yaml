source:
  edition: WLC
  text: וּ/בְ/כָל בְּהֵמָ֛ה לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/טָמְאָה בָ֑/הּ וְ/אִשָּׁ֗ה לֹֽא תַעֲמֹ֞ד לִ/פְנֵ֧י בְהֵמָ֛ה לְ/רִבְעָ֖/הּ תֶּ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: ml
  text: ഒരു മൃഗത്തോടും ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്; അതോടുകൂടെ അശുദ്ധനാകരുത്[a]. ഒരു സ്ത്രീ ഒരു മൃഗത്തിന്റെ മുമ്പിൽ നിൽക്കരുത്, മൃഗം അവളുമായി ഇണചേരേണ്ടതിന്[b]. ഇത് ക്രമഭംഗമാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘നിന്റെ ശയനം കൊടുക്കരുത്’; ‘അതോടുകൂടെ അശുദ്ധിയിലാകേണ്ടതിന്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അത് അവളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടേണ്ടതിന്’ എന്നാണ്; മൃഗവുമായുള്ള ലൈംഗികബന്ധത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘കലർപ്പ്,’ ‘നിന്ദ്യമായ പ്രവൃത്തി,’ അല്ലെങ്കിൽ ‘ക്രമക്കേട്’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം, പ്രത്യേകിച്ച് ലൈംഗികസന്ദർഭത്തിൽ, ശരിയായ ക്രമത്തിന്റെ ഗുരുതരമായ ലംഘനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: ഒരു മൃഗത്തോടും
  rationale: בְּהֵמָה ഇവിടെ പൊതുവായി മൃഗത്തെ സൂചിപ്പിക്കുന്നു; כָּל സഹിതമുള്ള സമഗ്രനിഷേധം മലയാളത്തിൽ ‘ഒരു മൃഗത്തോടും’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: ശയിക്കരുത്
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ ശയനം കൊടുക്കരുത്’ എന്ന എബ്രായ പ്രയോഗം ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ആ പദാനുപദരൂപം മലയാളത്തിൽ അസ്വാഭാവികവും അവ്യക്തവുമായതിനാൽ അർഥം നേരിട്ട് നൽകുന്ന ‘ശയിക്കരുത്’ സ്വീകരിച്ചു; മൂലപ്രയോഗം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לְטָמְאָה בָהּ
  choice: അതിനാൽ നിന്നെത്തന്നെ അശുദ്ധനാക്കരുത്
  rationale: טמא എന്നത് അശുദ്ധി/മലിനീകരണം എന്ന ബൈബിൾ ആശയം വഹിക്കുന്നു. ഇത് വെറും ആചാരപരമായ അശുദ്ധിയെന്നോ പൊതുവായ ധാർമിക കുറ്റമെന്നോ മാത്രം ചുരുക്കാതെ ‘അശുദ്ധനാക്കുക’ എന്നു നിലനിർത്തുന്നു.
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: ഒരു സ്ത്രീ അതിന്റെ മുമ്പിൽ നിൽക്കരുത്
  rationale: ‘മൃഗത്തിന്റെ മുമ്പിൽ നിൽക്കുക’ എന്ന മൂലചിത്രം നിലനിർത്തുന്നു; തുടർന്നുള്ള ഉദ്ദേശ്യവാക്യം അതിന്റെ ലൈംഗിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לְרִבְעָהּ
  choice: മൃഗം തന്നോടു ഇണചേരേണ്ടതിന്
  rationale: רבע ഈ സാഹചര്യത്തിൽ മൃഗം പെണ്ണിനെ കയറുന്നതായ ലൈംഗികക്രിയയെ സൂചിപ്പിക്കുന്നു. സ്ത്രീ ക്രിയയുടെ സ്വീകരകയാണെന്ന സ്ത്രീലിംഗ പ്രത്യയം മാനിച്ചുകൊണ്ട്, അശ്ലീലത ഒഴിവാക്കി അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: תֶּבֶל
  choice: വികൃതി
  rationale: ഈ അപൂർവപദം പ്രത്യേകിച്ച് ലൈംഗികസന്ദർഭത്തിൽ ശരിയായ ക്രമത്തിന്റെ ലംഘനം, കലർപ്പ്, അതിക്രമം എന്നിവ സൂചിപ്പിക്കുന്നു. ‘വികൃതി’ ആ നിഷേധാത്മക വിലയിരുത്തൽ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അശുദ്ധിയുടെ ഭാഷ ആചാരപരമോ ധാർമികമോ എന്നതായി ചുരുക്കുന്നത്
  choice: അതിനാൽ നിന്നെത്തന്നെ അശുദ്ധനാക്കരുത്
  alternative: അതിനോടുകൂടെ അശുദ്ധിയിലാകരുത്
  rationale: മൂലപാഠം അശുദ്ധി എന്ന ബൈബിൾ വിഭാഗം ഉപയോഗിക്കുന്നു; അതിനെ ആചാരപരമെന്നോ ധാർമികമെന്നോ മാത്രം നിർവചിക്കാതെ അതേ സംഘർഷം നിലനിർത്തുന്നു.
- issue: תֶּבֶל എന്ന പദത്തിന്റെ മൂല്യനിർണയം
  choice: വികൃതി
  alternative: ക്രമക്കേട് / കലർപ്പ് / നിന്ദ്യമായ പ്രവൃത്തി
  rationale: പദം ശരിയായ ക്രമത്തിന്റെ ഗുരുതരമായ ലംഘനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ നിഴലർഥം വിവാദവിധേയമാണ്. മുഖ്യപാഠത്തിൽ വായനാസൗകര്യമുള്ള ‘വികൃതി’യും അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകളും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായത്തിലെ ലൈംഗികപ്രയോഗങ്ങളുടെ അർഥം മറച്ചുവയ്ക്കാതെ, അനാവശ്യമായ അശ്ലീലതയും അസ്വാഭാവികമായ പദാനുപദതയും ഒഴിവാക്കി. പുരുഷനോടുള്ള ആദ്യ നിരോധനവും സ്ത്രീയോടുള്ള രണ്ടാമത്തെ നിരോധനവും വേർതിരിച്ച വാക്യങ്ങളാക്കി വ്യക്തത വർധിപ്പിച്ചു.
