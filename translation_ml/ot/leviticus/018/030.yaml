id: LEV.18.30
reference: Leviticus 18:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: ml
  text: അതിനാൽ, നിങ്ങൾ എന്റെ ചുമതല പാലിക്കണം; നിങ്ങൾക്കുമുമ്പ് ആചരിച്ചുപോന്നിരുന്ന വെറുക്കത്തക്ക ആചാരങ്ങളിൽ ഒന്നും അനുഷ്ഠിക്കാതിരിക്കേണ്ടതിനും അവയാൽ നിങ്ങളെത്തന്നെ അശുദ്ധരാക്കാതിരിക്കേണ്ടതിനും. ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: കാത്തുകൊള്ളണം
  rationale: שׁמר എന്നതിന് ‘കാക്കുക, പാലിക്കുക, അനുസരിക്കുക’ എന്നർഥമുണ്ട്. നിയമപരവും ഉടമ്പടിപരവുമായ നിർദേശത്തിന്റെ ബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִשְׁמַרְתִּי
  choice: എന്റെ കൽപ്പന
  rationale: מִשְׁמֶרֶת ഏല്പിക്കപ്പെട്ട കാവൽച്ചുമതലയെയോ പാലിക്കേണ്ട നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘എന്റെ കൽപ്പന കാത്തുകൊള്ളുക’ എന്ന പ്രയോഗം മലയാളത്തിൽ വ്യക്തവും മൂലത്തിലെ പദാവർത്തനം ഭാഗികമായി നിലനിർത്തുന്നതുമാണ്.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: അനുഷ്ഠിക്കാതിരിക്കാനും
  rationale: ഈ ഘടന നിരോധനപരമായ ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു. തുടർന്നുവരുന്ന സ്ഥാപിത ആചാരങ്ങളെ സംബന്ധിക്കുന്നതിനാൽ ‘ചെയ്യാതിരിക്കുക’ എന്നതിനെക്കാൾ ‘അനുഷ്ഠിക്കാതിരിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: മ്ലേച്ഛമായ ആചാരങ്ങളിൽ ഒന്നും
  rationale: מן എന്ന ഭാഗികപ്രയോഗം ‘ഒന്നും’ എന്നു പ്രതിഫലിപ്പിച്ചു. חֻקּוֹת ഇവിടെ നിയമങ്ങൾ മാത്രമല്ല, സ്ഥാപിത ആചാരങ്ങളെയും സൂചിപ്പിക്കാം; תּוֹעֵבֹת ശക്തമായ ധാർമിക-ആരാധനാപരമായ വെറുപ്പിനെ അറിയിക്കുന്നു.
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: നിങ്ങൾക്കുമുമ്പ് അനുഷ്ഠിച്ചിരുന്ന
  rationale: നിഷ്ക്രിയരൂപവും കാലപരമായ ‘നിങ്ങൾക്കുമുമ്പ്’ എന്ന ആശയവും സംരക്ഷിക്കുന്നു; മുൻകാല ജനങ്ങളുടെ പതിവായ പ്രവൃത്തികളെന്ന സന്ദർഭവും വ്യക്തമാകുന്നു.
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: അവയാൽ നിങ്ങളെത്തന്നെ അശുദ്ധരാക്കാതിരിക്കാനും
  rationale: ക്രിയയുടെ ആത്മനിഷ്ഠ അർഥം ‘നിങ്ങളെത്തന്നെ’ എന്നും בְּയുടെ കാരണ/ഉപകരണബന്ധം ‘അവയാൽ’ എന്നും വ്യക്തമാക്കുന്നു.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു
  rationale: ഉടമ്പടിപരമായ സ്വയംപരിചയപ്പെടുത്തൽ സംരക്ഷിക്കുകയും יהוה എന്ന ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ ആധുനിക മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: תּוֹעֵבֹת എന്ന പദത്തിന്റെ ധാർമിക-ആരാധനാപരമായ തീവ്രത
  choice: മ്ലേച്ഛമായ
  alternative: അറപ്പുളവാക്കുന്ന / വെറുക്കത്തക്ക
  rationale: മൂലപദത്തിലെ ശക്തമായ നിഷേധാത്മക വിലയിരുത്തൽ നിലനിർത്തുന്നു; അതേസമയം സന്ദർഭത്തിൽ ഇല്ലാത്ത പ്രത്യേക കുറ്റവിഭാഗം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ഉടമ്പടി ശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വാക്യബന്ധം സ്വാഭാവികമാക്കി; മൂലത്തിലെ നിരോധനലക്ഷ്യം, ആത്മനിഷ്ഠ അശുദ്ധീകരണം, പദാർത്ഥത്തിലെ സാധ്യതാവ്യാപ്തി എന്നിവ സംരക്ഷിച്ചു.
