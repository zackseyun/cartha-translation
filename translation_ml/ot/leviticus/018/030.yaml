revisions:
- from: അതുകൊണ്ട്, നിങ്ങൾക്കുമുമ്പ് അനുഷ്ഠിച്ചിരുന്ന മ്ലേച്ഛമായ ആചാരങ്ങളിൽ ഒന്നും അനുഷ്ഠിക്കാതിരിക്കാനും അവയാൽ നിങ്ങളെത്തന്നെ അശുദ്ധരാക്കാതിരിക്കാനും എന്റെ കൽപ്പന കാത്തുകൊള്ളണം.[a] ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു.
  to: അതിനാൽ, നിങ്ങൾ എന്റെ ചുമതല പാലിക്കണം; നിങ്ങൾക്കുമുമ്പ് ആചരിച്ചുപോന്നിരുന്ന വെറുക്കത്തക്ക ആചാരങ്ങളിൽ ഒന്നും അനുഷ്ഠിക്കാതിരിക്കേണ്ടതിനും അവയാൽ നിങ്ങളെത്തന്നെ അശുദ്ധരാക്കാതിരിക്കേണ്ടതിനും. ഞാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ ആകുന്നു.
  rationale: The revision removes the misleading ethnic/social connotations of ‘മ്ലേച്ഛമായ,’ retains the Hebrew’s strong evaluative language with ‘വെറുക്കത്തക്ക,’ and restructures the sentence so that keeping Yahweh’s charge clearly governs the two following prevention clauses. The footnote is correspondingly corrected. The footnote marker [a] should be placed after ‘വെറുക്കത്തക്ക ആചാരങ്ങളിൽ’ in typesetting.
