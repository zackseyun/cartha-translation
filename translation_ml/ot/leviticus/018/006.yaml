- issue: ‘നഗ്നത അനാവരണം ചെയ്യുക’ എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: മൂലത്തിലെ നിയമപരമായ സൗമ്യോക്തി നിലനിർത്തുക
  alternative: ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുക
  rationale: പ്രയോഗം ലൈംഗിക വെളിപ്പെടുത്തലിനെയോ ലൈംഗികബന്ധത്തെയോ സൂചിപ്പിക്കാമെന്ന അർഥപരിധി ഒറ്റ വ്യാഖ്യാനമായി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു; ആവശ്യമായ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
