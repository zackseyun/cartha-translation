lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: നിങ്ങളിൽ ആരും
  rationale: 'ആവർത്തിച്ച ഏകവചന നാമം വിതരണാർഥകമാണ്: ഓരോ വ്യക്തിയെയും നിരോധനം ബാധിക്കുന്നു. നിഷേധവാക്യത്തിൽ ‘നിങ്ങളിൽ ആരും’ എന്നത് ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘നിങ്ങളിൽ’ സന്ദർഭത്തിൽനിന്നുള്ള വ്യക്തമാക്കലാണ്.'
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: തന്റെ അടുത്ത രക്തബന്ധു
  rationale: ഈ പ്രയോഗം ശരീരബന്ധത്തിലധിഷ്ഠിതമായ അടുത്ത ബന്ധുത്വത്തെ സൂചിപ്പിക്കുന്നു. ‘അടുത്ത രക്തബന്ധു’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്; എബ്രായത്തിലെ ‘മാംസം’ എന്ന രൂപകം അക്ഷരാർഥത്തിൽ നിലനിർത്തിയാൽ അർഥം മങ്ങാം.
- source_word: לֹא תִקְרְבוּ
  choice: സമീപിക്കരുത്
  rationale: നിഷേധത്തോടുകൂടിയ രണ്ടാംപുരുഷ ബഹുവചന ക്രിയ നിയമപരമായ വിലക്ക് പ്രകടിപ്പിക്കുന്നു. ‘സമീപിക്കരുത്’ ഔപചാരികതയും തുടർന്നുവരുന്ന ലൈംഗിക സൂചനയുള്ള സൗമ്യോക്തിയും നിലനിർത്തുന്നു.
- source_word: לְגַלּוֹת עֶרְוָה
  choice: നഗ്നത അനാവരണം ചെയ്യാൻ
  rationale: അധ്യായത്തിൽ ആവർത്തിക്കുന്ന നിയമപരമായ സൗമ്യോക്തി മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു. അതിന്റെ ലൈംഗിക അർഥപരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹോവ ആകുന്നു
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമമായ יהוה ലിപ്യന്തരിച്ചു നൽകുകയും കല്പനയ്ക്ക് ആധാരമായ ദൈവിക സ്വയംതിരിച്ചറിയൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
