id: LEV.18.3
reference: Leviticus 18:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: ml
  text: നിങ്ങൾ താമസിച്ചിരുന്ന ഈജിപ്ത് ദേശത്ത് അവർ ചെയ്യുന്നതുപോലെ[a] നിങ്ങൾ ചെയ്യരുത്. ഞാൻ നിങ്ങളെ കൊണ്ടുപോകുന്ന കനാൻദേശത്ത് അവർ ചെയ്യുന്നതുപോലെ നിങ്ങൾ ചെയ്യരുത്. അവരുടെ ചട്ടങ്ങൾ അനുസരിച്ച് നടക്കരുത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഈജിപ്ത് ദേശത്തിന്റെ പ്രവൃത്തികൾക്കനുസരിച്ച് … കനാൻദേശത്തിന്റെ പ്രവൃത്തികൾക്കനുസരിച്ച്.’ ‘പ്രവൃത്തികൾ’ അഥവാ ‘രീതികൾ’ എന്ന എബ്രായ പ്രയോഗം ആ ദേശങ്ങളിലെ ജനങ്ങളുടെ പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘അവരുടെ ആചാരങ്ങളോ നിയമങ്ങളോ പിന്തുടരരുത്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: അവർ ചെയ്യുന്നതുപോലെ
  rationale: ‘പ്രവൃത്തി/ചെയ്യുന്ന രീതി അനുസരിച്ച്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ താരതമ്യബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ദേശത്തിലെ നിവാസികളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്ത് ദേശം
  rationale: ഭൂമിശാസ്ത്രപരമായ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് എബ്രായ ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: നിങ്ങൾ താമസിച്ചിരുന്ന
  rationale: ഇസ്രായേല്യരുടെ മുൻകാല വാസസ്ഥലത്തെ ലളിതവും കൃത്യവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא תַעֲשׂוּ
  choice: നിങ്ങൾ ചെയ്യരുത്
  rationale: നിയമപരമായ നിരോധനത്തിന്റെ ബലം വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: וּכְמַעֲשֵׂה אֶרֶץ כְּנַעַן
  choice: കനാൻദേശത്ത് അവർ ചെയ്യുന്നതുപോലെയും
  rationale: ആദ്യ ഉപവാക്യത്തോടുള്ള സമാന്തരതയും ആവർത്തനവും നിലനിർത്തുന്നു; ‘അവർ’ എന്നത് ദേശവാസികളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അന്തർനിഹിത അർഥം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: ഞാൻ നിങ്ങളെ കൊണ്ടുപോകുന്ന
  rationale: מֵבִיא എന്ന കൃതന്തത്തിന്റെ പുരോഗമിക്കുന്നതും സമീപഭാവിയെ സൂചിപ്പിക്കുന്നതുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: അവരുടെ ചട്ടങ്ങൾ അനുസരിച്ച്
  rationale: חֻקּוֹת എന്ന പദത്തിലെ നിർബന്ധകമായ മാനദണ്ഡങ്ങളുടെ ആശയം ‘ചട്ടങ്ങൾ’ നൽകുന്നു; മലയാളത്തിൽ ‘നടക്കുക’ എന്ന പെരുമാറ്റരൂപകത്തോടൊപ്പം സ്വാഭാവികമാകാൻ ‘അനുസരിച്ച്’ ഉപയോഗിച്ചു.
- source_word: לֹא תֵלֵכוּ
  choice: നടക്കരുത്
  rationale: ജീവിതനടപ്പിനെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഈജിപ്തിന്റെയും കനാന്റെയും ‘ദേശത്തിന്റെ പ്രവൃത്തികൾ’ എന്ന പ്രയോഗം മണ്ണിനെയോ ദേശവാസികളുടെ പെരുമാറ്റത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ദേശവാസികളെ അന്തർനിഹിത കർത്താക്കളാക്കി ‘അവർ ചെയ്യുന്നതുപോലെ’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘ഈജിപ്ത്/കനാൻ ദേശത്തിന്റെ പ്രവൃത്തികൾക്കനുസരിച്ച്’
  rationale: എബ്രായത്തിൽ പ്രവൃത്തികൾ ദേശത്തിനാണ് വ്യാകരണപരമായി ചാർത്തുന്നത്; എന്നാൽ ഉദ്ദേശിക്കുന്നത് അവിടത്തെ ജനങ്ങളുടെ രീതികളാണ്. തിരഞ്ഞെടുക്കപ്പെട്ട രൂപം ഈ അർഥം വ്യക്തമാക്കുമ്പോഴും പാഠത്തെ പൊതുവായ ‘സംസ്കാരം’ എന്ന ആശയമായി ചുരുക്കുന്നില്ല.
- issue: חֻקֹּתֵיהֶם എന്നത് ‘ചട്ടങ്ങൾ’ എന്നോ ‘ആചാരങ്ങൾ’ എന്നോ നൽകണമോ
  choice: ചട്ടങ്ങൾ
  alternative: ആചാരങ്ങൾ / നിയമങ്ങൾ
  rationale: നിയമപരമായ സന്ദർഭത്തിൽ ബന്ധനാത്മകമായ മാനദണ്ഡങ്ങളുടെ ബലം ‘ചട്ടങ്ങൾ’ നന്നായി സംരക്ഷിക്കുന്നു; അതേസമയം പദത്തിന് ആചാരങ്ങൾ എന്ന അർഥസാധ്യതയുണ്ടെന്ന് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: הלך എന്ന ‘നടക്കുക’ രൂപകം നേരിട്ട് നിലനിർത്തണമോ ‘പിന്തുടരുക’ എന്ന് വ്യാഖ്യാനിക്കണമോ
  choice: നടക്കരുത്
  alternative: പിന്തുടരരുത്
  rationale: പെരുമാറ്റത്തെയും ജീവിതരീതിയെയും സൂചിപ്പിക്കുന്ന ബൈബിൾരൂപകം സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ സമാന്തര ഉപവാക്യങ്ങൾ നിലനിർത്തുകയും ‘നടക്കുക’ എന്ന പെരുമാറ്റരൂപകം സംരക്ഷിക്കുകയും ചെയ്തു; അസ്വാഭാവികമായ വാക്കുതോറ്റ പരിഭാഷ ഒഴിവാക്കി.
