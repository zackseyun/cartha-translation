source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחוֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה שְׁאֵ֥ר אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/012.yaml
  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: ml
  text: നിന്റെ അപ്പന്റെ സഹോദരിയുടെ നഗ്നത നീ അനാവൃതമാക്കരുത്[a]; അവൾ നിന്റെ അപ്പന്റെ അടുത്ത ബന്ധുവാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നഗ്നത അനാവൃതമാക്കുക’ എന്നത് ലേവ്യപുസ്തകം 18-ൽ വിലക്കപ്പെട്ട ലൈംഗിക അനാവരണത്തെയോ ലൈംഗികബന്ധത്തെയോ സൂചിപ്പിക്കുന്ന നിയമപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘അവൾ നിന്റെ അപ്പന്റെ മാംസമാണ്’; അഥവാ, ‘രക്തബന്ധുവാണ്.’'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: നഗ്നത
  rationale: ലേവ്യപുസ്തകം 18-ലെ സ്ഥിരമായ നിയമപ്രയോഗമായ ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന രൂപം നിലനിർത്തുന്നു; വിലക്കപ്പെട്ട ലൈംഗിക അനാവരണം അഥവാ ബന്ധമാണ് സന്ദർഭത്തിലെ അർഥം.
- source_word: תְגַלֵּה
  choice: നീ അനാവൃതമാക്കരുത്
  rationale: גלה എന്ന ക്രിയയുടെ പീയേൽ രൂപവും עֶרְוָהയും ചേർന്ന നിയമസൂത്രത്തെ ഔപചാരികമായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു; ‘ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്’ എന്ന വിശദീകരണം മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: אֲחוֹת אָבִיךָ
  choice: നിന്റെ അപ്പന്റെ സഹോദരി
  rationale: മൂലപാഠത്തിലെ ബന്ധനിർദേശം നേരിട്ട് സംരക്ഷിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളപ്രയോഗം.
- source_word: שְׁאֵר אָבִיךָ
  choice: നിന്റെ അപ്പന്റെ മാംസബന്ധു
  rationale: שְׁאֵר എന്ന പദത്തിലെ ‘മാംസം/രക്തബന്ധം’ എന്ന ദേഹബന്ധിത ബന്ധുത്വഭാവം നിലനിർത്തുന്നു; വെറും ‘അടുത്ത ബന്ധു’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ രൂപകത്വത്തോട് അടുത്തതാണ്.
- source_word: הִוא
  choice: അവൾ ... ആണ്
  rationale: സ്ത്രീയെ വിലക്കപ്പെട്ട അടുത്ത കുടുംബബന്ധമായി തിരിച്ചറിയുന്ന ലളിതവും സ്വാഭാവികവുമായ രൂപം.
theological_decisions:
- issue: അഗമ്യഗമനവിലക്കിലെ നിയമസൂത്രത്തിന്റെ വിവർത്തനം
  choice: ‘നഗ്നത നീ അനാവൃതമാക്കരുത്’ എന്ന മൂലസൂത്രം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘നീ ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടരുത്’
  rationale: നിയമഭാഷയുടെ ആവർത്തനവും അന്തർപാഠബന്ധവും സംരക്ഷിക്കുകയും എബ്രായപാഠം നേരിട്ട് പറയുന്നതിലധികം മുഖ്യപാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു; അടിക്കുറിപ്പ് പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- issue: שְׁאֵר എന്ന ബന്ധുത്വപദത്തിലെ രൂപകത്വം
  choice: ‘മാംസബന്ധു’
  alternative: ‘അടുത്ത ബന്ധു’ / ‘രക്തബന്ധു’ / ‘നിന്റെ അപ്പന്റെ മാംസം’
  rationale: ‘മാംസം’ എന്ന മൂലരൂപകം പൂർണമായി ഇല്ലാതാക്കാതെ മലയാളത്തിൽ ബന്ധുത്വം വ്യക്തമാക്കുന്നു. ‘നിന്റെ അപ്പന്റെ മാംസം’ കൂടുതൽ പദാനുപദമാണെങ്കിലും മലയാളത്തിൽ അസ്പഷ്ടമാണ്; ‘രക്തബന്ധു’ സാധ്യമായ വ്യാഖ്യാനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ‘അപ്പൻ’ എന്നത് אָבִיךָയുടെ സാധാരണവും നേരിട്ടുമുള്ള രൂപമായി സ്വീകരിച്ചു. മൂലത്തിലെ ലൈംഗിക നിയമസൂത്രവും שְׁאֵר എന്ന പദത്തിന്റെ മാംസബന്ധരൂപകവും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
