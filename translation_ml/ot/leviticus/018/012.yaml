  terminology: ‘നഗ്നത അനാവൃതമാക്കുക’ appropriately maintains the recurring Levitical legal idiom. ‘അടുത്ത ബന്ധു’ is a natural Malayalam rendering of שְׁאֵר in this kinship context, while the footnote records the literal flesh imagery and the possible ‘blood relative’ sense.
