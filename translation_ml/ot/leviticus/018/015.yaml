id: LEV.18.15
reference: Leviticus 18:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֶרְוַ֥ת כַּלָּֽתְ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אֵ֤שֶׁת בִּנְ/ךָ֙ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: ml
  text: നിന്റെ മരുമകളുടെ നഗ്നത നീ അനാവൃതമാക്കരുത്[a]. അവൾ നിന്റെ മകന്റെ ഭാര്യയാണ്; അവളുടെ നഗ്നത നീ അനാവൃതമാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “നഗ്നത അനാവൃതമാക്കുക”; നിരോധിക്കപ്പെട്ട ലൈംഗികബന്ധങ്ങളെ സൂചിപ്പിക്കാൻ ലേവ്യപുസ്തകത്തിൽ ആവർത്തിച്ചു വരുന്ന നിയമപരമായ ശിഷ്ടോക്തിയാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: നഗ്നത / അവളുടെ നഗ്നത
  rationale: ലേവ്യപുസ്തകം 18-ൽ ആവർത്തിക്കുന്ന നിയമപരമായ ശിഷ്ടോക്തിയെ നിലനിർത്താനും എബ്രായ പദത്തിന്റെ ആവർത്തനം സംരക്ഷിക്കാനും ‘നഗ്നത’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כַּלָּתְךָ
  choice: നിന്റെ മരുമകൾ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയം ചേർന്ന ഈ ബന്ധുസൂചകപദം സന്ദർഭത്തിൽ മകന്റെ ഭാര്യയെ, അതായത് മരുമകളെ, നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: לֹא תְגַלֵּה / לֹא תְגַלֶּה
  choice: നീ അനാവൃതമാക്കരുത്
  rationale: גלה എന്ന ക്രിയയും עֶרְוָה എന്ന നാമവും ചേർന്ന ആവർത്തിത നിരോധനസൂത്രത്തിന്റെ രൂപവും നിയമഭാഷയുടെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: אֵשֶׁת בִּנְךָ
  choice: നിന്റെ മകന്റെ ഭാര്യ
  rationale: മരുമകൾ ആരാണെന്ന് വിശദീകരിക്കുന്ന മൂലപാഠത്തിലെ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: הִוא
  choice: അവൾ ... ആണ്
  rationale: മുമ്പ് പരാമർശിച്ച സ്ത്രീയെ തിരിച്ചറിയിക്കുന്ന വിശദീകരണാത്മക ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന ലൈംഗിക നിരോധനശിഷ്ടോക്തിയുടെ പരിഭാഷ
  choice: ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന മൂലപാഠത്തിലെ ശിഷ്ടോക്തി നിലനിർത്തി.
  alternative: ‘ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുക’ എന്നു വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായത്തിൽ ലേവ്യപുസ്തകം 18 മുഴുവൻ ആവർത്തിക്കുന്ന സ്ഥിരമായ നിയമശിഷ്ടോക്തിയാണിത്. അതിനെ വ്യക്തമായ പരാവർത്തനമാക്കി മാറ്റാതെ നിലനിർത്തുന്നത് പദസാമ്യവും മൂലപാഠത്തിന്റെ സാഹിത്യ-നിയമരൂപവും സംരക്ഷിക്കുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയ മലയാളം. ആവർത്തനവും നിയമപരമായ നിരോധനശൈലിയും സംരക്ഷിച്ചു. ‘മരുമകൾ’ എന്ന പദം ചിലപ്പോൾ പൊതുവായി വിവാഹബന്ധത്തിലൂടെ വന്ന സ്ത്രീയെ സൂചിപ്പിക്കാമെന്നതിനാൽ തുടർന്നുള്ള ‘നിന്റെ മകന്റെ ഭാര്യ’ എന്ന വിശദീകരണം മൂലപാഠപ്രകാരം നിലനിർത്തി.
