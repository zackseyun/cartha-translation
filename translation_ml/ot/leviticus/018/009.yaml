source:
  edition: WLC
  text: עֶרְוַ֨ת אֲחֽוֹתְ/ךָ֤ בַת אָבִ֨י/ךָ֙ א֣וֹ בַת אִמֶּ֔/ךָ מוֹלֶ֣דֶת בַּ֔יִת א֖וֹ מוֹלֶ֣דֶת ח֑וּץ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: ml
  text: നിന്റെ സഹോദരിയുടെ—അവൾ നിന്റെ അപ്പന്റെ മകളായാലും അമ്മയുടെ മകളായാലും, വീട്ടിൽ ജനിച്ചവളായാലും പുറത്തു ജനിച്ചവളായാലും—നഗ്നത നീ അനാവൃതമാക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വീട്ടിൽ ജനിച്ചവളോ പുറത്തു ജനിച്ചവളോ.’ എബ്രായത്തിൽ ‘വീട്ടിൽ’ ജനിച്ചതും ‘പുറത്തു’ ജനിച്ചതും തമ്മിലാണ് വ്യത്യാസപ്പെടുത്തുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: നഗ്നത
  rationale: ലേവ്യപുസ്തകം 18-ലെ നിരോധിത ലൈംഗികബന്ധങ്ങളുടെ നിയമസന്ദർഭത്തിൽ עֶרְוָה എന്ന പദത്തിന്റെ സ്ഥാപിതമായ ലൈംഗിക-നിയമപരമായ അർഥം നിലനിർത്തുന്നു. ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന പ്രയോഗം എബ്രായ ശൈലിയെയും അതിന്റെ സൂചനയെയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: אֲחוֹתְךָ
  choice: നിന്റെ സഹോദരി
  rationale: പുരുഷനോടുള്ള ഏകവചന അഭിസംബോധനയും നേരിട്ടുള്ള ബന്ധുത്വപദവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  choice: നിന്റെ അപ്പന്റെ മകൾ / അമ്മയുടെ മകൾ
  rationale: പിതൃവഴിയിലോ മാതൃവഴിയിലോ സഹോദരിയായവളെ ഉൾപ്പെടുത്തുന്ന എബ്രായ സമാന്തരഘടനയും നിയമപരമായ കൃത്യതയും സംരക്ഷിക്കുന്നു.
- source_word: מוֹלֶדֶת
  choice: ജനിച്ചവൾ
  rationale: ഇവിടെ ജനനസ്ഥിതിയെ സൂചിപ്പിക്കുന്ന രൂപത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാള പരിഭാഷ.
- source_word: בַּיִת / חוּץ
  choice: വീട്ടിൽ / പുറത്തു
  rationale: ‘വീട്’ എന്നും ‘പുറം’ എന്നും ഉള്ള എബ്രായ വിരുദ്ധജോടി ചുരുക്കമായും നേരിട്ടും നിലനിർത്തുന്നു; ‘വീട്’ എന്നത് കെട്ടിടത്തെയോ കുടുംബഗൃഹവ്യവസ്ഥയെയോ സൂചിപ്പിക്കാമെന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לֹא תְגַלֶּה
  choice: നീ അനാവൃതമാക്കരുത്
  rationale: നിയമപരമായ നിരോധനശൈലിയും ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന മൂലഭാഷയിലെ സ്ഥിരപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: אוֹ ... אוֹ
  choice: ആയാലും ... ആയാലും
  rationale: പട്ടികപ്പെടുത്തിയിരിക്കുന്ന എല്ലാ സാധ്യതകളെയും ഉൾക്കൊള്ളുന്ന ആവർത്തിത വികല്പഘടന സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: നിരോധിത ബന്ധത്തിന്റെ വ്യാപ്തി
  choice: പിതാവിന്റെ മകളായാലും മാതാവിന്റെ മകളായാലും, വീട്ടിൽ ജനിച്ചവളായാലും പുറത്തു ജനിച്ചവളായാലും, ഒരാളുടെ സഹോദരിയുമായുള്ള ലൈംഗികബന്ധം ഈ വാക്യം നിരോധിക്കുന്നു.
  alternative: അവസാന വിശേഷണങ്ങൾ ഒരേ മാതാപിതാക്കളുള്ള സഹോദരിമാരെയും അർധസഹോദരിമാരെയും വേർതിരിക്കുന്നതായോ, വീട്ടിൽ ജനിച്ചവരെയും മറ്റിടത്ത് ജനിച്ചവരെയും വേർതിരിക്കുന്നതായോ മനസ്സിലാക്കാം.
  rationale: എബ്രായ നിയമവാക്യം ‘നിന്റെ സഹോദരി’ എന്ന വിഭാഗത്തെ ചുരുക്കുന്നതിനെക്കാൾ അതിന്റെ പരിധി വിശദീകരിക്കുന്നതാണ്. എന്നാൽ ‘വീട്ടിൽ/പുറത്തു’ എന്ന പ്രയോഗത്തിന്റെ കൃത്യമായ സാമൂഹിക സൂചനയെ പരിഭാഷ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ‘അപ്പൻ’ എന്നത് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ബന്ധുത്വപദമാണ്; ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന മൂലഭാഷാ ശൈലി ദൈവശാസ്ത്രപരമായ സൂചനയെ വിശദീകരിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
