  to: അസസ്സേലിലേക്കു[a] ആൺകോലാടിനെ വിട്ടയയ്ക്കുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകുകയും തന്റെ ശരീരം വെള്ളത്തിൽ കഴുകുകയും വേണം. അതിനുശേഷം അവന് പാളയത്തിലേക്കു പ്രവേശിക്കാം.
  rationale: മുഖ്യവാചകത്തിൽ വിവാദപദമായ עֲזָאזֵל ലിപ്യന്തരണമായി നിലനിർത്തി, ലְ-ന്റെ സന്ദർഭോചിതമായ ദിശാർഥം ‘-ിലേക്കു’ എന്നു നൽകി. മലയാളത്തിലെ ക്രിയാവിന്യാസം ശുദ്ധീകരണക്രിയ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നവിധം പരിഷ്കരിച്ചു; പ്രവേശനം കഴുകലിനുശേഷം അനുവദിക്കപ്പെടുന്നതാണെന്ന ഭാവം ‘പ്രവേശിക്കാം’ എന്നതിലൂടെ നിലനിർത്തി.
