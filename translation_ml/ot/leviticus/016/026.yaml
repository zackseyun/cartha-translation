source:
  edition: WLC
  text: וְ/הַֽ/מְשַׁלֵּ֤חַ אֶת הַ/שָּׂעִיר֙ לַֽ/עֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: ml
  text: അസസ്സേലിലേക്കു[a] ആൺകോലാടിനെ വിട്ടയയ്ക്കുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകുകയും തന്റെ ശരീരം വെള്ളത്തിൽ കഴുകുകയും വേണം. അതിനുശേഷം അവന് പാളയത്തിലേക്കു പ്രവേശിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അസസ്സേലിനായി’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘അസസ്സേൽ’ എന്ന എബ്രായപദത്തിന്റെ അർഥം തർക്കവിധേയമാണ്. അത് ഒരു പേരോ പ്രത്യേക സംജ്ഞയോ ആയിരിക്കാം; അല്ലെങ്കിൽ നീക്കിക്കളയൽ അഥവാ ‘പാപഭാരം വഹിക്കുന്ന ആട്’ എന്ന ആശയവുമായി ബന്ധപ്പെട്ടതായും വ്യാഖ്യാനിക്കപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: വിട്ടയയ്ക്കുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപസർഗത്തോടുകൂടിയ കർത്തൃവാചക രൂപം ഈ ചുമതല നിർവഹിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַשָּׂעִיר
  choice: ആട്ടുകൊറ്റനെ
  rationale: യാഗസന്ദർഭത്തിൽ ഈ നാമം ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ആട്ടുകൊറ്റൻ’ ലിംഗവും മൃഗവും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לַעֲזָאזֵל
  choice: അസസ്സേലിനായി
  rationale: לְ എന്നതിന് ഇവിടെ ‘-നായി’ എന്ന ബന്ധം നൽകി, തർക്കവിധേയമായ עֲזָאזֵל എന്ന പദം വ്യാഖ്യാനിക്കാതെ ലിപ്യന്തരിച്ചു; ഇതിലൂടെ മൂലത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ കഴുകുകയും ... വേണം
  rationale: ആചാരപരമായ നിർദേശം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ‘വേണം’ ഉപയോഗിച്ചു; ‘തന്റെ’ എന്നത് അവന്റെ വസ്ത്രങ്ങളെന്ന ബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמָּיִם
  choice: ശരീരം വെള്ളത്തിൽ കുളിക്കുകയും
  rationale: בָּשָׂר അക്ഷരാർഥത്തിൽ ‘മാംസം’ ആയാലും ഈ ശുദ്ധീകരണസന്ദർഭത്തിൽ മുഴുവൻ ശരീരമാണ് ഉദ്ദേശ്യം; ‘ശരീരം വെള്ളത്തിൽ കുളിക്കുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: וְאַחֲרֵי כֵן
  choice: അതിനുശേഷം
  rationale: പ്രവൃത്തികളുടെ കാലക്രമം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: അവന് പാളയത്തിനുള്ളിൽ വരാം
  rationale: കഴുകലിനുശേഷമുള്ള പ്രവേശനാനുമതിയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘വരാം’ ആ അനുമതിയുടെ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രായശ്ചിത്തദിനാചാരത്തിലെ לַעֲזָאזֵל എന്നതിന്റെ അർഥം
  choice: വ്യക്തിനാമമോ പ്രത്യേക സംജ്ഞയോ എന്ന നിലയിൽ ‘അസസ്സേൽ’ എന്നു ലിപ്യന്തരിച്ചു; לְ എന്നത് ‘-നായി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നീക്കിക്കളയുന്നതിനായി,’ ‘അസസ്സേലിലേക്കു,’ അല്ലെങ്കിൽ ‘പാപഭാരം വഹിക്കുന്ന ആടിനായി’
  rationale: ഈ എബ്രായപദത്തിന്റെ അർഥവും സൂചനയും തർക്കവിധേയമാണ്. ലിപ്യന്തരണം ഒരു ഭൂതസത്ത, സ്ഥലം, നീക്കം, അല്ലെങ്കിൽ ആടിന്റെ പ്രവർത്തനം എന്നിങ്ങനെയുള്ള വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നതു ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശ ശൈലി ഉപയോഗിച്ചു. ‘അസസ്സേൽ’ വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി; ആചാരപരമായ ക്രമവും പ്രവേശനാനുമതിയുടെ ഭാവവും വ്യക്തമായി പ്രകടിപ്പിച്ചു.
