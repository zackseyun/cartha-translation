id: LEV.16.20
reference: Leviticus 16:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִלָּה֙ מִ/כַּפֵּ֣ר אֶת הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/הִקְרִ֖יב אֶת הַ/שָּׂעִ֥יר הֶ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: ml
  text: വിശുദ്ധമന്ദിരത്തിനും[a] സമാഗമകൂടാരത്തിനും യാഗപീഠത്തിനും വേണ്ടി പ്രായശ്ചിത്തം[c] കഴിച്ചുതീർന്നശേഷം, ജീവനുള്ള കോലാട്ടുകൊറ്റനെ അവൻ സമർപ്പിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധസ്ഥലത്തിനും.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘അടുത്തുകൊണ്ടുവരണം’ എന്നാണ്; അതായത്, അടുത്ത ആചാരനടപടിക്കായി മുന്നിൽ കൊണ്ടുവരണം.
    reason: lexical_alternative
  - marker: c
    text: ഈ സന്ദർഭത്തിൽ ‘പ്രായശ്ചിത്തം കഴിക്കുക’ എന്നത് ആചാരപരമായ ശുദ്ധീകരണം നടത്തുക, അഥവാ അശുദ്ധി നീക്കുക, എന്ന അർഥത്തിലും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה
  choice: കഴിച്ചുതീർന്നശേഷം
  rationale: ഒരു പ്രവൃത്തി പൂർത്തിയാക്കി അടുത്ത ആചാരനടപടിയിലേക്കു കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִכַּפֵּר
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  rationale: ലേവ്യപുസ്തകത്തിലെ כפר എന്ന പ്രധാന ആചാരപദത്തിന്റെ വിശാലമായ ബലിസംബന്ധ അർഥം നിലനിർത്തുന്നു; ശുദ്ധീകരണം എന്ന ഒറ്റ ഫലത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരം
  rationale: ഇവിടെ അമൂർത്തമായ വിശുദ്ധിയെയല്ല, വിശുദ്ധമായ ആരാധനാസ്ഥലത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമായ രൂപമാണിത്.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവസന്നിധിയിൽ കൂടിവരുന്ന കൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും മൂലപദത്തോട് അടുത്തതുമായ പ്രയോഗം.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പിക്കുന്ന പീഠത്തെ സ്വാഭാവികവും കൃത്യവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְהִקְרִיב
  choice: സമർപ്പിക്കണം
  rationale: അക്ഷരാർഥമായ ‘അടുത്തുകൊണ്ടുവരുക’ ഇവിടെ അടുത്ത ആചാരനടപടിക്കായി മൃഗത്തെ ഔപചാരികമായി മുന്നിൽ കൊണ്ടുവരുന്നതാണ്; ‘സമർപ്പിക്കുക’ അത് സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: הַשָּׂעִיר הֶחָי
  choice: ജീവനുള്ള കോലാട്ടുകൊറ്റൻ
  rationale: കൊല്ലപ്പെട്ട ആടിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്ന חַי എന്ന വിശേഷണവും שָׂעִיר സൂചിപ്പിക്കുന്ന ആൺകോലാടും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബലിസംബന്ധ സന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  alternative: ആചാരപരമായി ശുദ്ധീകരിക്കുക / മാലിന്യം നീക്കുക
  rationale: ഈ പദത്തിന് ശുദ്ധീകരണത്തിന്റെയോ മാലിന്യനീക്കത്തിന്റെയോ ആശയം സന്ദർഭത്തിൽ ഉണ്ടായേക്കാമെങ്കിലും, അതിനെ മാത്രം മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കുന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും. ‘പ്രായശ്ചിത്തം’ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ വിശാലത നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: הַקֹּדֶשׁ സൂചിപ്പിക്കുന്ന വിശുദ്ധസ്ഥലത്തിന്റെ തിരിച്ചറിയൽ
  choice: വിശുദ്ധമന്ദിരം
  alternative: വിശുദ്ധസ്ഥലം
  rationale: സമാഗമകൂടാരത്തോടും യാഗപീഠത്തോടും ചേർന്ന പട്ടികയിൽ ഇത് വിശുദ്ധ ആരാധനാസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. അതിന്റെ പരിധിയെ കൂടുതൽ കൃത്യമായി നിർവചിക്കാതെ സന്ദർഭത്തിലെ സ്ഥലാർഥം മാത്രം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘സമാഗമകൂടാരം,’ ‘യാഗപീഠം,’ ‘പ്രായശ്ചിത്തം’ തുടങ്ങിയ പരിചിതമായ ആചാരപദങ്ങൾ നിലനിർത്തിക്കൊണ്ട് വാക്യക്രമം സ്വാഭാവികമാക്കി.
