id: LEV.16.12
reference: Leviticus 16:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: ml
  text: അവൻ യഹ്‌വെയുടെ സന്നിധിയിലുള്ള യാഗപീഠത്തിന്മേൽനിന്ന് തീക്കനലുകൾകൊണ്ട് ഒരു ധൂപകലശം നിറച്ചെടുക്കണം; നന്നായി പൊടിച്ച സുഗന്ധധൂപം ഇരുകൈകളിലും നിറയെ എടുത്ത്, അവ തിരശ്ശീലയ്ക്കകത്തേക്ക്[a] കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിരശ്ശീലയ്ക്കുള്ളിൽ.’ എബ്രായപ്രയോഗം തിരശ്ശീലയ്ക്കു പിന്നിലുള്ള അകത്തെ വിശുദ്ധസ്ഥാനത്തേക്ക് ധൂപകലശവും ധൂപവും കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: എടുക്കണം
  rationale: ആചാരക്രമം നിർദേശിക്കുന്ന വാചകത്തിൽ ഈ ക്രിയയ്ക്ക് നിർബന്ധാത്മകമായ ഭാവിയർഥമുണ്ട്; ആധുനിക മലയാളത്തിൽ ‘എടുക്കണം’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מְלֹא הַמַּחְתָּה
  choice: ഒരു ധൂപകലശം നിറച്ചെടുക്കണം
  rationale: അക്ഷരാർഥം ‘ധൂപകലശത്തിന്റെ നിറവ്’ എന്നാണെങ്കിലും, ധൂപകലശം അതിന്റെ ശേഷിവരെ നിറയ്ക്കുന്നതാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: גַּחֲלֵי אֵשׁ
  choice: തീക്കനലുകൾ
  rationale: തീയിൽനിന്നുള്ള ചൂടുള്ള കനലുകളെ സൂചിപ്പിക്കുന്ന എബ്രായ സംയുക്തത്തിന്റെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽനിന്ന്
  rationale: מֵעַל എന്ന പദത്തിലെ ‘മുകളിൽനിന്ന്’ എന്ന സ്ഥലസൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: מִלִּפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിലുള്ള
  rationale: ഈ പ്രയോഗം യാഗപീഠം യഹ്‌വെയുടെ മുമ്പിലാണെന്ന സ്ഥാനം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘സന്നിധിയിലുള്ള’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: וּמְלֹא חָפְנָיו
  choice: ഇരുകൈകളിലും നിറയെ
  rationale: ‘കൈകൾ/കൈക്കുമ്പിളുകൾ നിറയെ’ എന്ന അളവും ദ്വിവചനസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: നന്നായി പൊടിച്ച സുഗന്ധധൂപം
  rationale: സുഗന്ധവസ്തുക്കളാൽ നിർമിച്ച ധൂപവും അത് നേർത്തതായി ചതച്ചതാണെന്ന ആചാരവിശദാംശവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: וְהֵבִיא
  choice: കൊണ്ടുവരണം
  rationale: നിർദേശപരമ്പര തുടരുന്ന ഹിഫിൽ ക്രിയയുടെ ചലനാർഥം മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: തിരശ്ശീലയ്ക്കകത്തേക്ക്
  rationale: തിരശ്ശീലയ്ക്കു പിന്നിലുള്ള അകത്തെ വിശുദ്ധസ്ഥാനത്തേക്കുള്ള ദിശയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; മൂലത്തിലെ ചുരുക്കപ്രയോഗം വ്യക്തമായ മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ശബ്ദലിപ്യന്തരണം ചെയ്തു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യഹ്‌വെ’ എബ്രായ ഉച്ചാരണത്തിന്റെ പൊതുവേ അംഗീകരിക്കപ്പെടുന്ന പുനർനിർമാണത്തോട് അടുത്തതാണ്.
- issue: מִבֵּית לַפָּרֹכֶת എന്ന സ്ഥലപ്രയോഗം
  choice: തിരശ്ശീലയ്ക്കകത്തേക്ക്
  alternative: തിരശ്ശീലയ്ക്കുള്ളിൽ; തിരശ്ശീലയ്ക്കു പിന്നിലേക്ക്
  rationale: ഇത് തിരശ്ശീല കടന്ന് അകത്തെ വിശുദ്ധസ്ഥാനത്തേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു; പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കാതെ സ്ഥലാർഥം മാത്രം വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ആചാരനിർദേശത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായത്തിലെ അളവ്, ദ്വിവചനസൂചന, സ്ഥലബന്ധം എന്നിവ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിച്ചു.
