id: LEV.16.18
reference: Leviticus 16:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: ml
  text: പിന്നെ അവൻ പുറത്തേക്കു പോയി യഹോവയുടെ മുമ്പിലുള്ള യാഗപീഠത്തിന് പ്രായശ്ചിത്തം കഴിക്കണം[a]. കാളയുടെ രക്തത്തിൽനിന്നും കോലാടിന്റെ രക്തത്തിൽനിന്നും അല്പം എടുത്ത് യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ ചുറ്റും പുരട്ടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിനെ ശുദ്ധീകരിക്കണം’; പുരോഹിതചടങ്ങുകളുടെ പശ്ചാത്തലത്തിൽ എബ്രായ ക്രിയാപദത്തിന് ശുദ്ധീകരണഭാവവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: പിന്നെ അവൻ ... പുറത്തുവന്ന്
  rationale: ചടങ്ങിലെ നിർദേശങ്ങളുടെ ക്രമം വ്യക്തമാക്കുകയും അകത്തെ വിശുദ്ധസ്ഥാനത്തുനിന്നുള്ള പുറത്തേക്കുള്ള നീക്കം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിലുള്ള യാഗപീഠം
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന സ്ഥാനസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וְכִפֶּר עָלָיו
  choice: അതിനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പുരോഹിതചടങ്ങിലെ כפר എന്ന ക്രിയയുടെ വിശാലമായ പ്രായശ്ചിത്താർഥം നിലനിർത്തുന്നു; യാഗപീഠത്തെ ശുദ്ധീകരിക്കുന്ന ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: കാളയുടെ രക്തത്തിൽനിന്നും കോലാടിന്റെ രക്തത്തിൽനിന്നും കുറെ എടുത്ത്
  rationale: ആവർത്തിക്കുന്ന מִן ഭാഗികാർഥം വഹിക്കുന്നതിനാൽ ഓരോ മൃഗത്തിന്റെയും രക്തത്തിൽനിന്ന് കുറെ എടുക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: הַפָּר
  choice: കാള
  rationale: פַּר എന്നതിന്റെ നേരിട്ടുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളപദം.
- source_word: הַשָּׂעִיר
  choice: കോലാട്
  rationale: שָׂעִיר ആൺകോലാടിനെ സൂചിപ്പിക്കാമെങ്കിലും സന്ദർഭത്തിൽ മൃഗം മുമ്പേ തിരിച്ചറിയപ്പെട്ടതിനാൽ അനാവശ്യമായ വിശദീകരണം ഒഴിവാക്കുന്നു.
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ ചുറ്റും പുരട്ടണം
  rationale: രക്തം ആചാരപരമായി കൊമ്പുകളിൽ ഇടുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘പുരട്ടണം’ എന്നു പറയുന്നു; סָבִיב എന്നത് ‘ചുറ്റും’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുരോഹിതചടങ്ങിലെ כפר എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: അതിനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം
  alternative: അതിനെ ശുദ്ധീകരിക്കണം
  rationale: ‘പ്രായശ്ചിത്തം കഴിക്കുക’ ബലിചടങ്ങിന്റെ വിശാലമായ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു; യാഗപീഠശുദ്ധീകരണത്തിന്റെ യഥാർഥ ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു, എന്നാൽ ഒരു മാത്രം വ്യാഖ്യാനത്തിലേക്ക് മുഖ്യപാഠത്തെ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ആചാരനിർദേശ ശൈലി. ദൈവനാമം ‘യഹോവ’ എന്നു നിലനിർത്തി; ചടങ്ങിന്റെ ക്രമവും മൂലപാഠത്തിലെ കർത്താവിന്റെ തുടർച്ചയും സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ അവതരിപ്പിച്ചു.
