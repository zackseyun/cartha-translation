id: LEV.16.19
reference: Leviticus 16:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: ml
  text: അവൻ രക്തത്തിൽനിന്ന് കുറച്ച് തന്റെ വിരൽകൊണ്ട് അതിന്മേൽ ഏഴു പ്രാവശ്യം തളിക്കണം; യിസ്രായേൽമക്കളുടെ[c] അശുദ്ധികളിൽനിന്ന് അതിനെ ശുദ്ധീകരിക്കുകയും[a] വിശുദ്ധീകരിക്കുകയും വേണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അതിനെ ആചാരപരമായി നിർമലമാക്കണം’; എബ്രായക്രിയ പുരോഹിതകർമത്തിൽ ഒന്നിനെ ആചാരപരമായി ശുദ്ധമാക്കുന്നതിനുള്ള സാധാരണ പദമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അതിനെ വിശുദ്ധമായി വേർതിരിക്കണം.’
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘യിസ്രായേലിന്റെ പുത്രന്മാർ’; ഇവിടെ ഈ പ്രയോഗം യിസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: തളിക്കണം
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള נזה പുരോഹിതകർമത്തിൽ രക്തം തളിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ആചാരപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עָלָיו
  choice: അതിന്മേൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ യാഗപീഠത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ അന്വയം നിലനിർത്തുന്നു.
- source_word: מִן־הַדָּם
  choice: രക്തത്തിൽ കുറച്ച്
  rationale: מִן എന്നതിന്റെ ഭാഗികാർഥം നിലനിർത്തി, തളിക്കാനായി രക്തത്തിന്റെ ഒരു ഭാഗം എടുക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: בְּאֶצְבָּעוֹ
  choice: തന്റെ വിരൽകൊണ്ട്
  rationale: ഉപകരണാർഥത്തിലുള്ള בְּ മലയാളത്തിൽ ‘കൊണ്ട്’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു; കർത്താവിലേക്കുള്ള തിരിച്ചുസൂചനയ്ക്ക് ‘തന്റെ’ ഉപയോഗിക്കുന്നു.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: ആചാരത്തിന്റെ കൃത്യമായ എണ്ണത്തെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וְטִהֲרוֹ
  choice: അതിനെ ശുദ്ധീകരിച്ച്
  rationale: טהר പുരോഹിതപരമായ സന്ദർഭത്തിൽ ആചാരപരമായി ശുദ്ധമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; നൈതികമോ ആന്തരികമോ ആയ പരിവർത്തനം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: וְקִדְּשׁוֹ
  choice: വിശുദ്ധീകരിക്കണം
  rationale: קדש ഇവിടെ വിശുദ്ധമായി വേർതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിശുദ്ധീകരിക്കുക’ കൃത്യവും പരിചിതവുമായ ആചാരപദമാണ്.
- source_word: מִטֻּמְאֹת
  choice: അശുദ്ധികളിൽനിന്ന്
  rationale: എബ്രായത്തിലെ ബഹുവചനം സംരക്ഷിക്കുകയും ആചാരപരമായ അശുദ്ധിയുടെ വിഭാഗങ്ങളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കളുടെ
  rationale: മുഴുവൻ യിസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്ന ഉടമ്പടിസംബന്ധമായ കൂട്ടപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥത്തിലെ പുല്ലിംഗരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: യാഗപീഠത്തെ സംബന്ധിച്ച ആചാരപരമായ ശുദ്ധീകരണഭാഷ
  choice: യിസ്രായേൽമക്കളുടെ അശുദ്ധികളിൽനിന്ന് യാഗപീഠത്തെ ശുദ്ധീകരിക്കുകയും വിശുദ്ധീകരിക്കുകയും ചെയ്യുന്നു.
  alternative: ‘നിർമലമാക്കുക’, ‘വിശുദ്ധമായി വേർതിരിക്കുക’ എന്നിങ്ങനെ കൂടുതൽ വിശദമായി പരിഭാഷപ്പെടുത്താം.
  rationale: ഇത് യാഗപീഠത്തെ ബാധിക്കുന്ന പുരോഹിതകർമത്തെയാണ് വിവരിക്കുന്നത്; നൈതിക പരിവർത്തനമോ ആന്തരിക ആത്മീയ പുതുക്കലോ സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കുന്നില്ല.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കൂട്ടപ്രയോഗം
  choice: യിസ്രായേൽമക്കൾ
  alternative: ‘യിസ്രായേലിന്റെ പുത്രന്മാർ’ അല്ലെങ്കിൽ ‘യിസ്രായേൽജനം’.
  rationale: ‘യിസ്രായേൽമക്കൾ’ ആധുനിക മലയാളത്തിൽ സമൂഹത്തെ മുഴുവനായി സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ അക്ഷരാർഥമായ പുല്ലിംഗരൂപം അടിക്കുറിപ്പിൽ മറച്ചുവയ്ക്കാതെ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. വാക്യത്തിലെ രണ്ട് ആചാരക്രിയകളും ‘അശുദ്ധികളിൽനിന്ന്’ എന്ന ഘടകവുമായി ബന്ധപ്പെടാവുന്ന വിധത്തിൽ പദക്രമം ക്രമപ്പെടുത്തി; മൂലത്തിലെ ബഹുവചനവും ആചാരപരമായ സാങ്കേതികതയും നിലനിർത്തി.
