- from: അവൻ രക്തത്തിൽ കുറച്ച് തന്റെ വിരൽകൊണ്ട് അതിന്മേൽ ഏഴു പ്രാവശ്യം തളിക്കണം; യിസ്രായേൽമക്കളുടെ[c] അശുദ്ധികളിൽനിന്ന് അതിനെ ശുദ്ധീകരിച്ച്[a] വിശുദ്ധീകരിക്കണം[b].
  to: അവൻ രക്തത്തിൽനിന്ന് കുറച്ച് തന്റെ വിരൽകൊണ്ട് അതിന്മേൽ ഏഴു പ്രാവശ്യം തളിക്കണം; യിസ്രായേൽമക്കളുടെ[c] അശുദ്ധികളിൽനിന്ന് അതിനെ ശുദ്ധീകരിക്കുകയും[a] വിശുദ്ധീകരിക്കുകയും വേണം[b].
