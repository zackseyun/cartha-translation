  - severity: low
    issue: ‘മരുഭൂമിയിൽ’ is both narrower and less directional than the source phrase.
    rationale: בַּמִּדְבָּר denotes wilderness/open uncultivated land and accompanies the dispatching action. ‘വനാന്തരത്തിലേക്ക്’ preserves both the broader setting and the movement into it.
