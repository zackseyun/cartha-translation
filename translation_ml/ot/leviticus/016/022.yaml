source:
  edition: WLC
  text: וְ/נָשָׂ֨א הַ/שָּׂעִ֥יר עָלָ֛י/ו אֶת כָּל עֲוֺנֹתָ֖/ם אֶל אֶ֣רֶץ גְּזֵרָ֑ה וְ/שִׁלַּ֥ח אֶת הַ/שָּׂעִ֖יר בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: ml
  text: ആ കോലാട് അവരുടെ സകല അകൃത്യങ്ങളും തന്റെമേൽ വഹിച്ചുകൊണ്ട് ഒറ്റപ്പെട്ട ഒരു ദേശത്തേക്ക്[a] പോകും; അവൻ ആ കോലാടിനെ വനാന്തരത്തിലേക്ക് വിട്ടയക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിച്ഛേദിക്കപ്പെട്ട ഒരു ദേശത്തേക്ക്,’ ‘എത്തിപ്പെടാൻ പ്രയാസമുള്ള ഒരു ദേശത്തേക്ക്,’ അല്ലെങ്കിൽ ‘വിജനമായ ഒരു ദേശത്തേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ജനവാസത്തിൽനിന്ന് വേർപെട്ടതോ ഒറ്റപ്പെട്ടതോ ആയ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: വഹിച്ചുകൊണ്ട് പോകും
  rationale: נשא എന്നത് ‘വഹിക്കുക, ചുമക്കുക’ എന്നർഥം നൽകുന്നു. കോലാട് അകൃത്യങ്ങളെ തന്റെമേൽ ചുമന്ന് അകറ്റിക്കൊണ്ടുപോകുന്ന ദൃശ്യബിംബം ഈ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַשָּׂעִיר
  choice: ആ കോലാട്
  rationale: שָׂעִיר സാധാരണയായി ആൺകോലാടിനെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ വാക്യത്തിൽ ലിംഗവിശേഷം അർഥനിർണായകമല്ല. ‘കോലാട്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മതിയായും വ്യക്തവുമാണ്.
- source_word: עָלָיו
  choice: തന്റെമേൽ
  rationale: കോലാടിന്റെമേൽ അകൃത്യങ്ങൾ ചുമത്തപ്പെട്ടിരിക്കുന്ന പ്രത്യക്ഷമായ ബന്ധം പ്രതിഫലിപ്പിക്കുന്നു; അർഥത്തെ ‘നീക്കിക്കളയുക’ എന്ന വ്യാഖ്യാനമായി മാറ്റുന്നില്ല.
- source_word: כָּל עֲוֺנֹתָם
  choice: അവരുടെ സകല അകൃത്യങ്ങളും
  rationale: עָוֹן പാപം, അകൃത്യം, അതിനോടനുബന്ധിച്ച കുറ്റഭാരം എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു. ‘അകൃത്യങ്ങൾ’ ധാർമികവും ആചാരപരവുമായ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: ഒറ്റപ്പെട്ട ഒരു ദേശത്തേക്ക്
  rationale: גְּזֵרָה എന്ന അപൂർവപദം വേർപെട്ടതോ ജനവാസത്തിൽനിന്ന് ഒറ്റപ്പെട്ടതോ ആയ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതായി സാധ്യതയുണ്ട്. മലയാളത്തിൽ അസ്വാഭാവികമായ പദാനുപദരൂപത്തേക്കാൾ ‘ഒറ്റപ്പെട്ട’ ഈ ആശയം വ്യക്തമായി നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְשִׁלַּח
  choice: വിട്ടയയ്ക്കണം
  rationale: ഇവിടെ שׁלח കോലാടിനെ ജനസമൂഹത്തിൽനിന്ന് അകലെ മരുഭൂമിയിലേക്ക് അയച്ചുവിടുന്ന ആചാരനടപടിയെ സൂചിപ്പിക്കുന്നു. ‘വിട്ടയയ്ക്കണം’ മലയാളത്തിൽ സ്വാഭാവികമായ നിർദേശരൂപമാണ്.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: מִדְבָּר മരുഭൂമി, വിജനപ്രദേശം, വനാന്തരം എന്നിവയെ സൂചിപ്പിക്കാം. മുൻപറഞ്ഞ ഒറ്റപ്പെട്ട ദേശത്തിലേക്ക് കോലാടിനെ കൊണ്ടുപോയി അവിടെ വിട്ടയയ്ക്കുന്നതാണ് സന്ദർഭം; അതിനാൽ സ്ഥാനാർഥകമായ ‘മരുഭൂമിയിൽ’ അനുയോജ്യമാണ്.
theological_decisions:
- issue: കോലാട് ജനത്തിന്റെ അകൃത്യങ്ങൾ വഹിക്കുന്ന ആചാരബിംബം
  choice: കോലാട് അവരുടെ അകൃത്യങ്ങൾ തന്റെമേൽ വഹിച്ചുകൊണ്ട് പോകുന്നു എന്ന മൂർത്തമായ ഭാഷ നിലനിർത്തി.
  alternative: ‘അവരുടെ പാപങ്ങൾ നീക്കിക്കളയും’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ.
  rationale: എബ്രായപാഠം അകൃത്യങ്ങൾ കോലാടിന്റെമേൽ ചുമത്തപ്പെടുകയും അത് അവയെ വഹിച്ചുകൊണ്ടുപോകുകയും ചെയ്യുന്ന കൈമാറ്റ-നീക്കൽ ബിംബമാണ് അവതരിപ്പിക്കുന്നത്. പിന്നീടുള്ള ദൈവശാസ്ത്രനിഗമനങ്ങൾ ചേർക്കാതെ അതേ സംഘർഷവും പ്രതീകവും നിലനിർത്തുന്നു.
- issue: אֶרֶץ גְּזֵרָה എന്ന അനിശ്ചിത പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: പ്രധാനപാഠത്തിൽ ‘ഒറ്റപ്പെട്ട ഒരു ദേശം’ എന്നു നൽകി.
  alternative: ‘വിച്ഛേദിക്കപ്പെട്ട ദേശം,’ ‘എത്തിപ്പെടാൻ പ്രയാസമുള്ള ദേശം,’ അല്ലെങ്കിൽ ‘വിജനദേശം.’
  rationale: ഈ പ്രയോഗത്തിന്റെ കൃത്യമായ സൂക്ഷ്മാർഥം അനിശ്ചിതമാണ്. ജനവാസത്തിൽനിന്നുള്ള വേർപാടാണ് സാധ്യതയുള്ള കേന്ദ്രാശയം; അതിനാൽ സ്വാഭാവിക മലയാളരൂപം പ്രധാനപാഠത്തിൽ നൽകി, യഥാർഥ പദസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: וְשִׁלַּח എന്ന ക്രിയയുടെ കർത്താവ്
  choice: മുൻസന്ദർഭത്തിലെ ആചാരനിർവാഹകനെ സൂചിപ്പിക്കുന്ന ‘അയാൾ’ നിലനിർത്തി.
  alternative: കർത്താവിനെ ഒഴിവാക്കി ‘കോലാടിനെ മരുഭൂമിയിൽ വിട്ടയയ്ക്കണം’ എന്നു മാത്രം പറയുക.
  rationale: എബ്രായത്തിൽ പുരുഷ ഏകവചന കർത്താവ് ക്രിയയിൽ പ്രകടമാണ്. മലയാളത്തിൽ ‘അയാൾ’ ചേർക്കുന്നത് അത് വ്യക്തമാക്കുന്നു; പ്രത്യേക വ്യക്തിത്വമോ ദൈവശാസ്ത്രപരമായ അധികവിവരമോ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആചാരപരമായ ദൃശ്യബിംബം നിലനിർത്തിയിട്ടുണ്ട്. വാക്യത്തിലെ തുടർച്ച വ്യക്തമാക്കാൻ അർദ്ധവിരാമം ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് സൂചിക [a] പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
