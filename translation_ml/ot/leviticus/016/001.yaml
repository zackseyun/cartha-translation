id: LEV.16.1
reference: Leviticus 16:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: ml
  text: അഹരോന്റെ രണ്ടു പുത്രന്മാർ യഹ്‌വേയുടെ സന്നിധിയിൽ അടുത്തുചെന്ന്[a] മരിച്ചതിനുശേഷം, യഹ്‌വേ മോശെയോടു സംസാരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ പദാനുപദമായി: “അവർ യഹ്‌വേയുടെ സന്നിധിയിൽ അടുത്തുവന്നപ്പോൾ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: ദൈവിക അരുളപ്പാടിന്റെ പതിവ് ആമുഖമായ דבר എന്ന ക്രിയയെ അനാവശ്യമായി വികസിപ്പിക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אַחֲרֵי מוֹת שְׁנֵי בְּנֵי אַהֲרֹן
  choice: അഹരോന്റെ രണ്ടു പുത്രന്മാർ ... മരിച്ചതിനുശേഷം
  rationale: എബ്രായത്തിലെ നാമവാചക ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി മാറ്റുമ്പോഴും രണ്ടു പുത്രന്മാരുടെയും മരണത്തെ ഒരൊറ്റ സംഭവമായി നിലനിർത്തുന്നു.
- source_word: בְּקָרְבָתָם
  choice: അടുത്തുചെന്ന്
  rationale: בְּ ചേർന്ന infinitive construct ഇവിടെ കാലസൂചന നൽകുന്നു; קרב എന്നതിന്റെ ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്ന ആശയവും ആരാധനാസംബന്ധമായ പശ്ചാത്തലവും സംരക്ഷിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: സ്ഥലപരവും ആരാധനാസംബന്ധവുമായ സാന്നിധ്യാർഥം ഒരുപോലെ വഹിക്കാവുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: וַיָּמֻתוּ
  choice: മരിച്ചു
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ ആഖ്യാനതുടർച്ചയെ കാരണബന്ധം അധികമായി ചേർക്കാതെ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു പദവികൊണ്ട് പകരാതെ ദൈവനാമം സംരക്ഷിക്കുന്നു.
- issue: അഹരോന്റെ പുത്രന്മാരുടെ സമീപനവും മരണവും തമ്മിലുള്ള ബന്ധം
  choice: അടുത്തുചെന്ന് മരിച്ചു
  alternative: അടുത്തുചെന്നപ്പോൾ അവർ മരിച്ചു
  rationale: മൂലപാഠം സമീപിച്ചതിനുശേഷമുള്ള മരണത്തെ ചേർത്തുപറയുന്നു; എന്നാൽ വ്യക്തമായ കാരണവാചകം ഉപയോഗിക്കുന്നില്ല. അതിനാൽ കാരണബന്ധം നിർബന്ധിച്ച് ചേർക്കാതെ ആഖ്യാനക്രമം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ എബ്രായവാക്യം മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനാകുന്ന ക്രമത്തിൽ നൽകിയെങ്കിലും ദൈവനാമം, സംഭവക്രമം, മൂലത്തിലെ കാരണപരമായ അനിശ്ചിതത്വം എന്നിവ സംരക്ഷിച്ചു.
