  to: അഹരോന്റെ രണ്ടു പുത്രന്മാർ യഹ്‌വേയുടെ സന്നിധിയിൽ അടുത്തുചെന്ന്[a] മരിച്ചതിനുശേഷം, യഹ്‌വേ മോശെയോടു സംസാരിച്ചു.
