source:
  edition: WLC
  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: ml
  text: 'ഇത് നിങ്ങൾക്കുള്ള ശാശ്വതമായ ഒരു ചട്ടമായിരിക്കണം[a]: ഇസ്രായേൽമക്കൾക്കുവേണ്ടി അവരുടെ സകല പാപങ്ങളെ നിമിത്തം വർഷത്തിലൊരിക്കൽ പ്രായശ്ചിത്തം നടത്താൻ[b]. യഹോവ മോശയോടു കല്പിച്ചതുപോലെ അവൻ ചെയ്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “എന്നേക്കുമുള്ള ചട്ടം.”
    reason: lexical_alternative
  - marker: b
    text: “അവരുടെ സകല പാപങ്ങളിൽനിന്നും” എന്നും വിവർത്തനം ചെയ്യാം; ഈ വായന ശുദ്ധീകരണത്തിന്റെ സൂചനയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת לָכֶם לְחֻקַּת עוֹלָם
  choice: ഇത് നിങ്ങൾക്കുള്ള ശാശ്വതചട്ടമായിരിക്കണം
  rationale: നിയമപരമായ ഭാവാർഥവും ചട്ടത്തിന്റെ നിലനിൽക്കുന്ന സ്വഭാവവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְכַפֵּר
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  rationale: ലേവ്യപുസ്തകം 16-ലെ യാഗപരവും ദൈവശാസ്ത്രപരവുമായ כפר എന്ന പദത്തിന്റെ സ്ഥാപിതമായ മലയാള പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കുവേണ്ടി
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന രൂപം മലയാളത്തിൽ പതിവായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന പ്രയോഗത്തിലൂടെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מִכָּל חַטֹּאתָם
  choice: അവരുടെ സകല പാപങ്ങൾക്കുംവേണ്ടി
  rationale: പ്രായശ്ചിത്തത്തിന്റെ വിഷയമായി അവരുടെ എല്ലാ പാപങ്ങളെയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘പാപങ്ങളിൽനിന്ന്’ എന്ന ശുദ്ധീകരണസൂചനയുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אַחַת בַּשָּׁנָה
  choice: വർഷത്തിലൊരിക്കൽ
  rationale: വാർഷിക ആവർത്തനത്തെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പറയുന്നു.
- source_word: וַיַּעַשׂ
  choice: അവൻ ചെയ്തു
  rationale: ഹീബ്രുവിൽ കർത്താവ് വ്യക്തമായി പേരെടുത്ത് പറയാത്തതിനാൽ ആ അവ്യക്തത നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അഹരോനായിരിക്കാം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: כפר എന്ന പദത്തിന്റെ യാഗപരമായ അർഥം
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  alternative: ശുദ്ധീകരിക്കുക / പരിഹാരം വരുത്തുക
  rationale: പാപപരിഹാരവും ശുദ്ധീകരണവും ഉൾക്കൊള്ളാവുന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ സ്ഥാപിത പദം ഉപയോഗിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം / ഇസ്രായേല്യർ
  rationale: ഹീബ്രു രൂപത്തോട് അടുത്തുനിൽക്കുകയും മുഴുവൻ ഉടമ്പടിസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന പതിവ് മലയാള ബൈബിൾ പ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
- issue: וַיַּעַשׂ എന്ന ക്രിയയുടെ അപ്രകട കർത്താവ്
  choice: അവൻ ചെയ്തു
  alternative: അഹരോൻ ചെയ്തു
  rationale: സന്ദർഭം അഹരോനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം പേര് പറയാത്തതിനാൽ വിവർത്തനത്തിൽ പേര് ചേർത്ത് അവ്യക്തത നീക്കുന്നില്ല.
- issue: יְהוָה എന്ന ദൈവനാമം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പദവിയാക്കി മാറ്റാതെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. ‘പ്രായശ്ചിത്തം കഴിക്കുക’, ‘ശാശ്വതചട്ടം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതോടൊപ്പം ലേവ്യപുസ്തകത്തിന്റെ യാഗപരമായ ഭാവവും നിലനിർത്തുന്നു.
