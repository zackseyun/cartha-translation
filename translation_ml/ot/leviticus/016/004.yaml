  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: ml
  text: അവൻ വിശുദ്ധമായ ലിനൻ അങ്കി[a] ധരിക്കണം; ലിനൻ അടിവസ്ത്രങ്ങൾ അവന്റെ ദേഹത്തിന്മേൽ[b] ഉണ്ടായിരിക്കണം. അവൻ ലിനൻ അരപ്പട്ട അരയിൽ ചുറ്റിക്കെട്ടുകയും ലിനൻ തലപ്പാവ് തലയിൽ ചുറ്റുകയും വേണം. ഇവ വിശുദ്ധവസ്ത്രങ്ങളാണ്. അവൻ തന്റെ ദേഹം വെള്ളത്തിൽ കഴുകിയശേഷം അവ ധരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശുദ്ധമായ ലിനൻ അങ്കി’ എന്നതിന് ‘വിശുദ്ധ ലിനൻ വസ്ത്രം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ദേഹം’ എന്നിടത്ത്, രണ്ടിടത്തും, എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘മാംസം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת בַּד קֹדֶשׁ
  choice: വിശുദ്ധമായ ചണയങ്കി
  rationale: כְּתֹנֶת എന്ന പുരോഹിതവസ്ത്രത്തിന് സ്വാഭാവികമായ ‘അങ്കി’യും, בַּד എന്ന വസ്തുവിന് ‘ചണ’യും, קֹדֶשׁ എന്നതിന് ആരാധനാസന്ദർഭത്തിലെ പതിവായ ‘വിശുദ്ധ’വും ഉപയോഗിച്ചു.
- source_word: מִכְנְסֵי בַד
  choice: ചണയടിവസ്ത്രം
  rationale: ശരീരത്തിന്റെ താഴ്ഭാഗത്ത് നേരിട്ട് ധരിക്കുന്ന പുരോഹിതവസ്ത്രത്തെ പഴഞ്ചൻ പദപ്രയോഗമില്ലാതെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַל בְּשָׂרוֹ
  choice: അവന്റെ ദേഹത്തിന്മേൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘മാംസം’ മലയാളത്തിൽ അനാവശ്യമായ ദൈവശാസ്ത്രപരമായ അർഥസൂചന നൽകാം; വസ്ത്രധാരണസന്ദർഭത്തിൽ ‘ദേഹം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אַבְנֵט בַּד יַחְגֹּר
  choice: ചണയരപ്പട്ട അരയിൽ ചുറ്റിക്കെട്ടുക
  rationale: אַבְנֵט ഒരു വസ്ത്രപ്പട്ടയാണ്; יַחְגֹּר അരയ്ക്കു ചുറ്റി കെട്ടുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: מִצְנֶפֶת בַּד יִצְנֹף
  choice: ചണത്തലപ്പാവ് തലയിൽ ചുറ്റുക
  rationale: നാമത്തിന്റെയും അതേ മൂലത്തിൽ നിന്നുള്ള ക്രിയയുടെയും ചുറ്റിക്കെട്ടുന്ന ഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בִּגְדֵי קֹדֶשׁ
  choice: വിശുദ്ധവസ്ത്രങ്ങൾ
  rationale: ആരാധനാശുശ്രൂഷയ്ക്കായി വേർതിരിക്കപ്പെട്ട വസ്ത്രങ്ങളെന്ന വാക്യത്തിന്റെ നേരിട്ടുള്ള പ്രസ്താവന മാത്രം നൽകുന്നു.
- source_word: וְרָחַץ בַּמַּיִם אֶת בְּשָׂרוֹ וּלְבֵשָׁם
  choice: തന്റെ ദേഹം വെള്ളത്തിൽ കഴുകിയശേഷം അവ ധരിക്കണം
  rationale: ആദ്യം കഴുകി തുടർന്ന് വസ്ത്രങ്ങൾ ധരിക്കുന്ന ക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അവ’ എന്നത് മുമ്പ് പറഞ്ഞ വിശുദ്ധവസ്ത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: വസ്ത്രങ്ങളുടെ വിശുദ്ധതയുടെ സ്വഭാവം
  choice: ‘വിശുദ്ധവസ്ത്രങ്ങൾ’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘പവിത്രവസ്ത്രങ്ങൾ’
  rationale: קֹדֶשׁ വസ്ത്രങ്ങൾ ആരാധനാശുശ്രൂഷയ്ക്കായി വേർതിരിക്കപ്പെട്ടവയാണെന്ന് പറയുന്നു; പിന്നീടുള്ള പ്രതീകാത്മകമോ വിഭാഗീയമോ ആയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: בָּשָׂר എന്ന പദത്തിന്റെ ആചാരപരമായ സന്ദർഭം
  choice: പ്രധാനപാഠത്തിൽ ‘ദേഹം’
  alternative: ‘മാംസം’
  rationale: ഇവിടെ പദം മനുഷ്യശരീരത്തെ ഭൗതികമായി സൂചിപ്പിക്കുന്നു. ‘ദേഹം’ ആ അർഥം വ്യക്തമായി നൽകുകയും ‘മാംസം’ മൂലം ഉണ്ടാകാവുന്ന അനാവശ്യ ദൈവശാസ്ത്രസൂചന ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: കഴുകലും ധരിക്കലും തമ്മിലുള്ള ക്രമം
  choice: ‘കഴുകിയശേഷം ... ധരിക്കണം’
  alternative: ‘കഴുകുകയും ... ധരിക്കുകയും വേണം’
  rationale: ഹീബ്രു ക്രിയാക്രമം ആചാരനടപടികളുടെ അനുക്രമമായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു; അതിലധികമായ കാരണബന്ധം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. പുരോഹിതവസ്ത്രങ്ങളുടെ സാങ്കേതിക സ്വഭാവം കാത്തുകൊണ്ട് പഴഞ്ചൻ പദങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ [a], [b] പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
