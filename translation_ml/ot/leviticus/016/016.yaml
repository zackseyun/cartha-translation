id: LEV.16.16
reference: Leviticus 16:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: ml
  text: ഇങ്ങനെ, ഇസ്രായേൽമക്കളുടെ[a] അശുദ്ധികൾ നിമിത്തവും അവരുടെ അതിക്രമങ്ങൾ നിമിത്തവും—അവരുടെ സകല പാപങ്ങളെയും സംബന്ധിച്ച്—വിശുദ്ധമന്ദിരത്തിനുവേണ്ടി[b] അവൻ പ്രായശ്ചിത്തം കഴിക്കണം[c]. അവരുടെ അശുദ്ധികളുടെ നടുവിൽ അവരോടുകൂടെ വസിക്കുന്ന സമാഗമകൂടാരത്തിനുവേണ്ടിയും അവൻ അങ്ങനെതന്നെ ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യരുടെ.’ ‘ഇസ്രായേൽമക്കൾ’ എന്നത് ഇവിടെ ഉടമ്പടിജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിശുദ്ധസ്ഥലത്തിനുവേണ്ടി.’ ഹീബ്രു പദം ഈ അനുഷ്ഠാനസന്ദർഭത്തിൽ വിശുദ്ധമന്ദിരത്തെയോ വിശുദ്ധസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘പ്രായശ്ചിത്തം കഴിക്കുക’ എന്നതിൽ അശുദ്ധിയും പാപവും മൂലം ബാധിക്കപ്പെട്ട വിശുദ്ധസ്ഥാനം ശുദ്ധീകരിക്കുക എന്ന ആശയവും ഉൾപ്പെടുന്നു; അതിനാൽ ‘ശുദ്ധീകരിക്കണം’ എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: ലേവ്യപുസ്തകത്തിലെ അനുഷ്ഠാനപരമായ സന്ദർഭത്തിൽ כפר പാപവും അശുദ്ധിയും മൂലം ബാധിക്കപ്പെട്ട വിശുദ്ധസ്ഥാനത്തിനുവേണ്ടി നടത്തുന്ന പ്രായശ്ചിത്ത-ശുദ്ധീകരണ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്ഥാപിതമായ ‘പ്രായശ്ചിത്തം കഴിക്കുക’ എന്ന പ്രയോഗം ഈ വിപുലമായ അനുഷ്ഠാനാർഥം നിലനിർത്തുന്നു.
- source_word: עַל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിനുവേണ്ടി
  rationale: הַקֹּדֶשׁ ഇവിടെ അമൂർത്തമായ വിശുദ്ധിയെയല്ല, വിശുദ്ധമായ ആരാധനാസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വിശുദ്ധമന്ദിരം’ സാധാരണ വായനക്കാർക്കു വ്യക്തവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: מִטֻּמְאֹת
  choice: അശുദ്ധികൾ നിമിത്തം
  rationale: כפר എന്ന ക്രിയയോടൊപ്പമുള്ള מִן ഇവിടെ പ്രായശ്ചിത്തപ്രവൃത്തിക്ക് കാരണമായ അശുദ്ധികളെ സൂചിപ്പിക്കുന്നു. ബഹുവചനം മൂലപാഠത്തിലെ രൂപവും വിവിധ അനുഷ്ഠാന അശുദ്ധികളുടെ ആശയവും നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത രൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല.
- source_word: וּמִפִּשְׁעֵיהֶם
  choice: അവരുടെ അതിക്രമങ്ങൾ നിമിത്തം
  rationale: פשע നിയമലംഘനത്തോടൊപ്പം കലഹസ്വഭാവവും ഉൾക്കൊള്ളാം. ‘അതിക്രമങ്ങൾ’ ധാർമിക ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായി ‘കലാപം’ എന്നു ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: לְכָל חַטֹּאתָם
  choice: അവരുടെ സകല പാപങ്ങളെയും സംബന്ധിച്ച്
  rationale: לְ എന്ന ബന്ധസൂചകത്തിന്റെ പരിധി കൃത്യമായി ഒരൊറ്റ ബന്ധത്തിലേക്ക് ചുരുക്കാതെ, അശുദ്ധികളും അതിക്രമങ്ങളും എല്ലാ പാപങ്ങളുമായി ബന്ധപ്പെട്ടിരിക്കുന്നുവെന്ന മൂലവാക്യത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു. חטאות ഇവിടെ ‘പാപയാഗങ്ങൾ’ എന്നതിനെക്കാൾ ‘പാപങ്ങൾ’ എന്നാണ് സ്വാഭാവികം.
- source_word: וְכֵן יַעֲשֶׂה
  choice: അവൻ അങ്ങനെതന്നെ ചെയ്യണം
  rationale: അടുത്ത വിശുദ്ധവസ്തുവിനും സമാനമായ അനുഷ്ഠാനനടപടി നടത്തണമെന്ന നടപടിക്രമപരമായ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: לְאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിനുവേണ്ടി
  rationale: אֹהֶל מוֹעֵד എന്ന സ്ഥിരപ്രയോഗത്തിന് അർഥസുതാര്യവും മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവുമായ തത്തുല്യം.
- source_word: הַשֹּׁכֵן אִתָּם
  choice: അവരോടുകൂടെ വസിക്കുന്ന
  rationale: ശׁכן എന്ന വർത്തമാന പങ്കാളിത്തരൂപത്തിന്റെ തുടർച്ചയായ വാസവും ബന്ധപരമായ സമീപ്യതയും നിലനിർത്തുന്നു; വ്യാകരണപരമായി ഇത് സമാഗമകൂടാരത്തെ വിശേഷിപ്പിക്കുന്നു.
- source_word: בְּתוֹךְ טֻמְאֹתָם
  choice: അവരുടെ അശുദ്ധികളുടെ നടുവിൽ
  rationale: വിശുദ്ധകൂടാരം അശുദ്ധികളുള്ള ജനത്തിന്റെ മധ്യേ നിലകൊള്ളുന്നു എന്ന ശക്തമായ സ്ഥലരൂപകം ബഹുവചനത്തോടുകൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പ്രായശ്ചിത്തദിന സന്ദർഭത്തിലെ כפר എന്നതിന്റെ അർഥം
  choice: ‘പ്രായശ്ചിത്തം കഴിക്കുക’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘ശുദ്ധീകരിക്കുക’ അഥവാ ‘മാലിന്യം നീക്കുക’
  rationale: ഈ അനുഷ്ഠാനം വിശുദ്ധസ്ഥാനവുമായി ബന്ധപ്പെട്ട അശുദ്ധിയെയും പാപത്തെയും അഭിമുഖീകരിക്കുന്നു. ശുദ്ധീകരണം അതിന്റെ ഫലത്തിന്റെ ഒരു പ്രധാന വശമാണെങ്കിലും, ‘പ്രായശ്ചിത്തം’ എന്നത് അനുഷ്ഠാനപരവും ദൈവശാസ്ത്രപരവുമായ വിശാലത ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: לְכָל חַטֹּאתָם എന്നതിന്റെ ബന്ധം
  choice: ‘അവരുടെ സകല പാപങ്ങളെയും സംബന്ധിച്ച്’ എന്ന പരിധിസൂചക രൂപം
  alternative: ‘അവരുടെ സകല പാപങ്ങൾ നിമിത്തം’ അല്ലെങ്കിൽ ‘അവരുടെ സകല പാപങ്ങളായ അതിക്രമങ്ങൾ നിമിത്തം’
  rationale: ഹീബ്രു പ്രയോഗം മുൻപുള്ള അശുദ്ധികളോടും അതിക്രമങ്ങളോടും എങ്ങനെ കൃത്യമായി ബന്ധപ്പെടുന്നു എന്നത് ഒരു പരിധിവരെ തുറന്നുവെക്കുന്നു. അതിനെ കാരണം എന്നോ വിശദീകരണസമാനത എന്നോ മാത്രം നിർണയിക്കാതെ മൂലപാഠത്തിലെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- issue: הַשֹּׁכֵן എന്നതിന്റെ വ്യാകരണപരമായ സൂചന
  choice: വസിക്കുന്നത് സമാഗമകൂടാരമാണെന്ന രൂപം നിലനിർത്തി
  alternative: ദൈവം അവരുടെ ഇടയിൽ വസിക്കുന്നു എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ
  rationale: പുല്ലിംഗ ഏകവചന പങ്കാളിത്തരൂപം സമീപസ്ഥമായ אֹהֶל എന്ന പുല്ലിംഗ നാമത്തോട് സ്വാഭാവികമായി യോജിക്കുന്നു. ദൈവസാന്നിധ്യം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും അത് നേരിട്ട് ചേർക്കുന്നത് പരിഭാഷയെക്കാൾ വ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ അനുഷ്ഠാനഭാഷ ഉപയോഗിച്ചു. ‘വിശുദ്ധമന്ദിരം,’ ‘പ്രായശ്ചിത്തം,’ ‘സമാഗമകൂടാരം’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ദീർഘമായ ഹീബ്രു ബന്ധഘടന വ്യക്തമാക്കാൻ ഇടവരകൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ക്രമമായി ചേർത്തിരിക്കുന്നു.
