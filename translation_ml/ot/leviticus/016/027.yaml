  text: וְ/אֵת֩ פַּ֨ר הַֽ/חַטָּ֜את וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את אֲשֶׁ֨ר הוּבָ֤א אֶת דָּמָ/ם֙ לְ/כַפֵּ֣ר בַּ/קֹּ֔דֶשׁ יוֹצִ֖יא אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֑ה וְ/שָׂרְפ֣וּ בָ/אֵ֔שׁ אֶת עֹרֹתָ֥/ם וְ/אֶת בְּשָׂרָ֖/ם וְ/אֶת פִּרְשָֽׁ/ם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: ml
  text: പാപയാഗത്തിനുള്ള കാളയെയും പാപയാഗത്തിനുള്ള ആട്ടുകൊറ്റനെയും—വിശുദ്ധസ്ഥാനത്ത് പ്രായശ്ചിത്തം ചെയ്യാൻ അവയുടെ രക്തം അകത്തേക്കു കൊണ്ടുവന്നതായിരുന്നു—അവൻ പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോകണം; അവയുടെ തോലും മാംസവും ചാണകവും അവർ തീയിൽ ദഹിപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം ‘അവൻ ... കൊണ്ടുപോകണം’ എന്ന ഏകവചനത്തിൽനിന്ന് ‘അവർ ... ദഹിപ്പിക്കണം’ എന്ന ബഹുവചനത്തിലേക്കു മാറുന്നു. ഇത് മുഖ്യകർമനിർവാഹകനെയും സഹായികളെയും വേർതിരിച്ചുകാണിക്കുന്നതാകാം.
    reason: cultural_note
lexical_decisions:
- source_word: פַּר הַחַטָּאת
  choice: പാപയാഗത്തിനുള്ള കാള
  rationale: חַטָּאת എന്ന സ്ഥാപിത യാഗവിഭാഗം ‘പാപയാഗം’ എന്നു നൽകി, കാളയുടെ യാഗപരമായ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׂעִיר הַחַטָּאת
  choice: പാപയാഗത്തിനുള്ള ആട്ടുകൊറ്റൻ
  rationale: שָׂעִיר ഇവിടെ ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; ‘ആട്ടുകൊറ്റൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: הוּבָא אֶת דָּמָם
  choice: അവയുടെ രക്തം അകത്തേക്കു കൊണ്ടുവന്നതായിരുന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപത്തിലെ കർമണിപ്രയോഗവും വിശുദ്ധസ്ഥാനത്തിലേക്കുള്ള ദിശാസൂചനയും നിലനിർത്തുന്നു.
- source_word: לְכַפֵּר
  choice: പ്രായശ്ചിത്തം ചെയ്യാൻ
  rationale: യാഗസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന് പരിചിതവും വിശാലവുമായ മലയാള പദപ്രയോഗം; ‘ശുദ്ധീകരിക്കുക’ എന്ന ഒരൊറ്റ വശത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: בַּקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥാനത്ത്
  rationale: ഇവിടെ קֹדֶשׁ അമൂർത്തമായ വിശുദ്ധിയെയല്ല, ആചാരപരമായ വിശുദ്ധസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יוֹצִיא אֶל מִחוּץ לַמַּחֲנֶה
  choice: അവൻ പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോകണം
  rationale: ഹിഫിൽ രൂപത്തിന്റെ കാരണാർഥവും പുറത്തേക്കുള്ള ദിശയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: അവർ തീയിൽ ദഹിപ്പിക്കണം
  rationale: എബ്രായത്തിലെ ബഹുവചന കർത്താവിനെ നിലനിർത്തുകയും തീകൊണ്ടുള്ള പൂർണ ദഹനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עֹרֹתָם
  choice: അവരുടെ തോൽ
  rationale: യാഗമൃഗങ്ങളുടെ പുറംചർമ്മത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ പദം.
- source_word: בְּשָׂרָם
  choice: മാംസം
  rationale: മൃഗശരീരത്തിലെ മാംസത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: פִּרְשָׁם
  choice: ചാണകം
  rationale: മലമോ കുടൽമാലിന്യമോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘കുടൽ’ എന്നാക്കി തെറ്റായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: חַטָּאת, כפר എന്നീ യാഗപരമായ പദങ്ങളുടെ വിവർത്തനം
  choice: ‘പാപയാഗം’, ‘പ്രായശ്ചിത്തം ചെയ്യുക’
  alternative: ‘ശുദ്ധീകരണയാഗം’, ‘ശുദ്ധീകരിക്കുക’
  rationale: പരമ്പരാഗതമായി തിരിച്ചറിയാവുന്ന യാഗഭാഷ നിലനിർത്തുമ്പോഴും ഈ പദങ്ങളുടെ ദൈവശാസ്ത്രാർഥം ഒരു പ്രത്യേക സിദ്ധാന്തത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: יוֹצִיא എന്ന ഏകവചനത്തിൽനിന്ന് וְשָׂרְפוּ എന്ന ബഹുവചനത്തിലേക്കുള്ള മാറ്റം
  choice: ‘അവൻ ... കൊണ്ടുപോകണം; ... അവർ ... ദഹിപ്പിക്കണം’ എന്ന സംഖ്യാമാറ്റം നിലനിർത്തി
  alternative: ‘അവർ ... കൊണ്ടുപോയി ദഹിപ്പിക്കണം’ എന്ന് ഏകീകരിക്കൽ
  rationale: കർമനിർവഹിക്കുന്ന വ്യക്തിയും സഹായികളും തമ്മിലുള്ള സാധ്യതയുള്ള വ്യത്യാസം വിശദീകരിച്ചുറപ്പിക്കാതെ, മൂലപാഠത്തിലെ യഥാർഥ വ്യാകരണപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നെങ്കിലും ലേവ്യപുസ്തകത്തിലെ ആചാരനിയമങ്ങൾക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ദിശാസൂചന സ്വാഭാവികമാക്കുകയും മൂലത്തിലെ ഏകവചന–ബഹുവചന മാറ്റം നിലനിർത്തുകയും ചെയ്തു.
