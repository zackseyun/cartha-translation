  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי בַ/יּ֥וֹם הַ/זֶּ֛ה יְכַפֵּ֥ר עֲלֵי/כֶ֖ם לְ/טַהֵ֣ר אֶתְ/כֶ֑ם מִ/כֹּל֙ חַטֹּ֣אתֵי/כֶ֔ם לִ/פְנֵ֥י יְהוָ֖ה תִּטְהָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഈ ദിവസത്തിൽ നിങ്ങളെ ശുദ്ധീകരിക്കാനായി നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം നടത്തും[a]; നിങ്ങളുടെ എല്ലാ പാപങ്ങളിൽനിന്നും യഹ്‌വെയുടെ[b] സന്നിധിയിൽ നിങ്ങൾ ശുദ്ധരാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം നടത്തും.’ എബ്രായ ക്രിയ ഏകവചനമാണ്; എന്നാൽ ഈ ഉപവാക്യത്തിൽ കർതൃത്തെ വ്യക്തമായി പറഞ്ഞിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ YHWH; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ കല്പനയുടെ കാരണം വിശദീകരിക്കുന്ന ബന്ധകമായി സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בַיּוֹם הַזֶּה
  choice: ഈ ദിവസത്തിൽ
  rationale: ആചാരപരമായ സന്ദർഭത്തിലെ എബ്രായ നിർദേശകപദത്തിന്റെ നേരിട്ടുള്ള കാലസൂചന നിലനിർത്തുന്നു.
- source_word: יְכַפֵּר עֲלֵיכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം നടത്തും
  rationale: כפר എന്ന ആരാധനാക്രമപരമായ പദത്തിന്റെ അർഥം ‘പ്രായശ്ചിത്തം നടത്തുക’ എന്നു നൽകുന്നു; על ഇവിടെ പ്രായശ്ചിത്തത്തിന്റെ ഗുണഭോക്താക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിങ്ങൾക്കുവേണ്ടി’ എന്നു പരിഭാഷപ്പെടുത്തി. മലയാളത്തിൽ കർത്താവിനെ വെളിപ്പെടുത്താതെ ക്രിയ ഉപയോഗിക്കുന്നത് മൂലപാഠത്തിലെ അപ്രസ്തുത കർത്താവിനെ സംരക്ഷിക്കുന്നു.
- source_word: לְטַהֵר אֶתְכֶם
  choice: നിങ്ങളെ ശുദ്ധീകരിക്കാനായി
  rationale: പ്രായശ്ചിത്തത്തിന്റെ ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന infinitive ഘടന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: നിങ്ങളുടെ എല്ലാ പാപങ്ങളിൽനിന്നും
  rationale: ഇവിടെ חטאת യാഗങ്ങളെയല്ല, ജനങ്ങളുടെ പാപങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ശുദ്ധീകരണസന്ദർഭത്തിന് ഇതാണ് യോജിച്ച അർഥം.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യാർഥം സ്വാഭാവികമായി നൽകുകയും ദൈവനാമമായ YHWH ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: תִּטְהָרוּ
  choice: നിങ്ങൾ ശുദ്ധരാകും
  rationale: മുൻപുള്ള ‘ശുദ്ധീകരിക്കുക’ എന്ന പ്രവൃത്തിയിൽനിന്ന് വേർതിരിച്ച്, അതിന്റെ ഫലമായ ശുദ്ധാവസ്ഥയെ qal ക്രിയ സൂചിപ്പിക്കുന്നതു നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; പരമ്പരാഗത പരിഭാഷ അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: כפר എന്ന ആരാധനാക്രമപരമായ പദം
  choice: പ്രായശ്ചിത്തം നടത്തുക
  alternative: പരിഹാരം വരുത്തുക; പാപപരിഹാരം ചെയ്യുക
  rationale: ലേവ്യപുസ്തകത്തിലെ യാഗാരാധനാപരമായ അർഥം നിലനിർത്തുന്നു; പ്രായശ്ചിത്തത്തിന്റെ പ്രവർത്തനരീതിയെക്കുറിച്ചുള്ള പിൽക്കാല സിദ്ധാന്തം വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: יְכַפֵּר എന്ന ഏകവചനക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: കർത്താവിനെ ചേർക്കാതെ ‘പ്രായശ്ചിത്തം നടത്തും’
  alternative: അവൻ പ്രായശ്ചിത്തം നടത്തും; പ്രായശ്ചിത്തം നടത്തപ്പെടും
  rationale: എബ്രായത്തിൽ ക്രിയ ഏകവചനമാണെങ്കിലും ഈ ഉപവാക്യത്തിൽ കർത്താവ് പേരെടുത്തു പറഞ്ഞിട്ടില്ല. മലയാളത്തിലെ അപ്രസ്തുത കർത്തൃപ്രയോഗം ഈ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആരാധനാഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘പ്രായശ്ചിത്തം’, ‘ശുദ്ധീകരിക്കുക’, ‘സന്നിധി’ എന്നീ പരിചിതമായ വേദപദങ്ങൾ സന്ദർഭത്തിന്റെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു.
