  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/ם יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: ml
  text: അവയെ ചുട്ടുകളയുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും ശരീരം വെള്ളത്തിൽ കഴുകുകയും വേണം.[a] അതിനുശേഷം അവന് പാളയത്തിനകത്തേക്ക് വരാം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘തന്റെ മാംസം’. ഇവിടെ ശരീരം കഴുകുന്നതിനെക്കുറിച്ചുള്ള പ്രയോഗമായതിനാൽ ‘ശരീരം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘അവൻ പാളയത്തിനകത്തേക്ക് വരും.’ ഹീബ്രു ക്രിയയെ ലളിത ഭാവിയായി വായിക്കാം; എന്നാൽ ഇവിടെ ശുദ്ധീകരണത്തിനു ശേഷമുള്ള പുനഃപ്രവേശനാനുമതിയാണ് സാധ്യതയേറിയ അർഥം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֹּׂרֵף
  choice: അവയെ ചുട്ടുകളയുന്നവൻ
  rationale: നിശ്ചയാർഥക അവ്യയത്തോടുകൂടിയ കർത്തൃവാചക കൃദന്തം, മുൻവാക്യത്തിൽ പറഞ്ഞ കാളയെയും കോലാടിനെയും—അഥവാ അവയുടെ അവശിഷ്ടങ്ങളെയും—ചുട്ടുകളയുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ ചുമതലയും പ്രവൃത്തിയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֹתָם
  choice: അവയെ
  rationale: സമീപസന്ദർഭത്തിലെ കാളയെയും കോലാടിനെയും, അല്ലെങ്കിൽ അവയുടെ അവശിഷ്ടങ്ങളെയും, തിരിച്ചുസൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും
  rationale: അപൂർണക്രിയാരൂപത്തിന് ഇവിടെ ആചാരനിയമത്തിലെ നിർദേശാത്മക ബലമുണ്ട്. വസ്ത്രം കഴുകുന്നതിന് ആധുനിക മലയാളത്തിൽ ‘അലക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ
  choice: ശരീരം വെള്ളത്തിൽ കഴുകുകയും
  rationale: בשר പദത്തിന്റെ അക്ഷരാർഥം ‘മാംസം’ ആണെങ്കിലും ഈ ശുദ്ധീകരണസ്നാന പ്രയോഗത്തിൽ മുഴുവൻ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശരീരം കഴുകുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: בַּמָּיִם
  choice: വെള്ളത്തിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥലാർഥം നിലനിർത്തി സ്നാനത്തിന്റെ മാധ്യമവും സാഹചര്യവും വ്യക്തമാക്കുന്നു.
- source_word: וְאַחֲרֵי כֵן
  choice: അതിനുശേഷം
  rationale: ശുദ്ധീകരണനടപടികൾ പൂർത്തിയായ ശേഷമുള്ള ക്രമം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: അവന് പാളയത്തിനകത്തേക്ക് വരാം
  rationale: സന്ദർഭത്തിൽ കഴുകലിനുശേഷമുള്ള പുനഃപ്രവേശനാനുമതിയാണ് പ്രധാന സൂചന. אֶל സഹിതമുള്ള בוא പാളയത്തിലേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിന്റെ ആചാരശുദ്ധിസംബന്ധമായ ബലം
  choice: 'ശുദ്ധീകരണത്തിനുശേഷമുള്ള അനുവദിക്കപ്പെട്ട പുനഃപ്രവേശനം: ‘അവന് ... വരാം’'
  alternative: 'ലളിത ഭാവി/നിർദേശം: ‘അവൻ ... വരും’ അല്ലെങ്കിൽ ‘വരണം’'
  rationale: യിസ്രായേൽ പാളയത്തിന് പുറത്തുവെച്ച് പാപയാഗാവശിഷ്ടങ്ങൾ ചുട്ടുകളഞ്ഞതിലൂടെ ഉണ്ടായ ആചാരപരമായ അശുദ്ധിക്കു ശേഷം ആവശ്യമായ കഴുകൽ പൂർത്തിയാക്കുമ്പോൾ മാത്രമുള്ള പുനഃപ്രവേശനമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. എങ്കിലും ഹീബ്രു ക്രിയാരൂപം ലളിത ഭാവിയായും വായിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ലേവ്യപുസ്തകത്തിലെ നിയമപരവും ആചാരപരവുമായ ഗൗരവം നിലനിർത്തുന്ന ഭാഷ. ‘അലക്കുക’ എന്നത് വസ്ത്രശുദ്ധീകരണത്തെയും ‘ശരീരം കഴുകുക’ എന്നത് ദേഹശുദ്ധീകരണത്തെയും വ്യക്തമായി വേർതിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാചകഭാഗത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
