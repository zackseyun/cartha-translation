source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: ml
  text: 'യഹ്‌വേ മോശെയോടു പറഞ്ഞു: “നിന്റെ സഹോദരനായ അഹരോനോടു പറയുക: അവൻ എപ്പോൾ വേണമെങ്കിലും തിരശ്ശീലയ്ക്കുള്ളിലെ അതിവിശുദ്ധസ്ഥാനത്തേക്കു, പെട്ടകത്തിന്മേലുള്ള പ്രായശ്ചിത്തമൂടിയുടെ[a] മുമ്പിലേക്കു, പ്രവേശിക്കരുത്; അങ്ങനെ അവൻ മരിക്കാതിരിക്കട്ടെ. കാരണം, പ്രായശ്ചിത്തമൂടിയുടെ മുകളിൽ മേഘത്തിൽ ഞാൻ പ്രത്യക്ഷനാകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രായശ്ചിത്തമൂടി” എന്നതിന് പരമ്പരാഗതമായി “കരുണാസനം” എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: דַּבֵּר אֶל אַהֲרֹן אָחִיךָ
  choice: നിന്റെ സഹോദരനായ അഹരോനോടു പറയുക
  rationale: മോശെ അഹരോനോടു കല്പന അറിയിക്കണമെന്ന നിർദേശശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאַל יָבֹא בְכָל עֵת
  choice: അവൻ ... ഇഷ്ടമുള്ളപ്പോഴെല്ലാം പ്രവേശിക്കരുത്
  rationale: നിയമിതമല്ലാത്ത, അനിയന്ത്രിതമായ പ്രവേശനമാണ് നിരോധിക്കുന്നത്; നിരന്തരം പ്രവേശിക്കുന്നതിനെക്കുറിച്ചുള്ള പ്രസ്താവനയല്ല.
- source_word: הַקֹּדֶשׁ מִבֵּית לַפָּרֹכֶת
  choice: തിരശ്ശീലയ്ക്കകത്ത് ... അതിവിശുദ്ധസ്ഥാനത്തേക്ക്
  rationale: ഈ സന്ദർഭത്തിൽ തിരശ്ശീലയ്ക്കുള്ളിലെ ആന്തരിക വിശുദ്ധസ്ഥലമാണ് ഉദ്ദേശിക്കുന്നത്. ‘അതിവിശുദ്ധസ്ഥാനം’ വായനക്കാരന് കൂടാരത്തിന്റെ ഈ പ്രത്യേക ഭാഗം വ്യക്തമായി തിരിച്ചറിയാൻ സഹായിക്കുന്നു.
- source_word: הַכַּפֹּרֶת
  choice: പ്രായശ്ചിത്തമൂടി
  rationale: പെട്ടകത്തിന്റെ യഥാർത്ഥ മൂടിയെയും പ്രായശ്ചിത്തശുശ്രൂഷയിലെ അതിന്റെ ധാർമിക-ആചാരപരമായ പ്രാധാന്യത്തെയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: הָאָרֹן
  choice: പെട്ടകം
  rationale: മൂലപാഠത്തിൽ ‘നിയമപെട്ടകം’ എന്ന വിപുലമായ പേര് ഇല്ലാത്തതിനാൽ ലളിതമായ രൂപം നിലനിർത്തുന്നു.
- source_word: וְלֹא יָמוּת
  choice: അല്ലെങ്കിൽ അവൻ മരിക്കും
  rationale: നിരോധനം ലംഘിച്ചാലുള്ള മരണഫലം ആധുനിക മലയാളത്തിൽ നേരിട്ടും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: כִּי בֶעָנָן אֵרָאֶה עַל הַכַּפֹּרֶת
  choice: കാരണം പ്രായശ്ചിത്തമൂടിയുടെ മുകളിൽ മേഘത്തിൽ ഞാൻ പ്രത്യക്ഷനാകും
  rationale: നിരോധനത്തിന്റെ കാരണം വ്യക്തമാക്കുകയും ‘മേഘത്തിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക അവ്യക്തത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: כַּפֹּרֶת എന്ന ആരാധനാസംബന്ധിയായ പദത്തിന്റെ വിവർത്തനം
  choice: പ്രായശ്ചിത്തമൂടി
  alternative: കരുണാസനം
  rationale: ഈ പദം പെട്ടകത്തിന്റെ മൂടിയെ സൂചിപ്പിക്കുന്നതോടൊപ്പം പ്രായശ്ചിത്തച്ചടങ്ങുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു. ‘പ്രായശ്ചിത്തമൂടി’ വസ്തുവിനെയും അതിന്റെ ചടങ്ങുസംബന്ധിയായ ധ്വനിയെയും വ്യക്തമാക്കുന്നു; പരമ്പരാഗതമായ പകരംവാക്ക് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: בְּכָל עֵת എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ഇഷ്ടമുള്ളപ്പോഴെല്ലാം എന്ന അനിയന്ത്രിത പ്രവേശനം
  alternative: എല്ലാ സമയത്തും
  rationale: സന്ദർഭം നിരന്തരം പ്രവേശിക്കുന്നതിനെക്കുറിച്ചല്ല, നിശ്ചയിക്കപ്പെട്ട അവസരത്തിനു പുറത്തുള്ള പ്രവേശനം നിരോധിക്കുന്നതിനെക്കുറിച്ചാണ്.
- issue: הַקֹּדֶשׁ എന്ന സ്ഥലനാമത്തിന്റെ സന്ദർഭപരമായ നിർണ്ണയം
  choice: അതിവിശുദ്ധസ്ഥാനം
  alternative: വിശുദ്ധസ്ഥലം
  rationale: ‘തിരശ്ശീലയ്ക്കകത്ത്’ എന്നും പെട്ടകത്തിന്മേലുള്ള മൂടിയുടെ മുമ്പിൽ എന്നും പറയുന്നതിനാൽ ആന്തരിക വിശുദ്ധമന്ദിരമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ‘വിശുദ്ധസ്ഥലം’ എന്നു മാത്രം പറഞ്ഞാൽ പുറത്തെ വിഭാഗവുമായി ആശയക്കുഴപ്പം ഉണ്ടാകാം.
- issue: മേഘവും ദൈവപ്രത്യക്ഷതയും തമ്മിലുള്ള ബന്ധം
  choice: മേഘത്തിൽ ഞാൻ പ്രത്യക്ഷനാകും
  alternative: ഞാൻ മേഘമായി പ്രത്യക്ഷനാകും / മൂടിയുടെ മുകളിൽ ഞാൻ മേഘത്തിൽ പ്രത്യക്ഷപ്പെടുന്നു
  rationale: בֶעָנָן എന്നത് ദൈവം മേഘത്തിനുള്ളിലോ മേഘത്തോടുകൂടിയോ പ്രത്യക്ഷനാകുന്നു എന്ന അർഥം അനുവദിക്കുന്നു. ദൈവത്തെ മേഘത്തോടു പൂർണമായി സമീകരിക്കാതെ മൂലത്തിലെ രൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കൂടാരാരാധനയിലെ സാങ്കേതിക അർഥം വ്യക്തമാക്കാൻ ‘അതിവിശുദ്ധസ്ഥാനം’, ‘പ്രായശ്ചിത്തമൂടി’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദത്തിനു പകരം വാക്യാവസാനത്ത് വെച്ചിട്ടുണ്ടെങ്കിലും മുഖ്യപാഠത്തിൽ വ്യക്തമായി ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
