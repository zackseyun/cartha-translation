revisions:
- from: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു: “നിന്റെ സഹോദരനായ അഹരോനോടു പറയുക: അവൻ തിരശ്ശീലയ്ക്കകത്ത്, പെട്ടകത്തിന്മേലുള്ള പ്രായശ്ചിത്തമൂടിയുടെ മുമ്പിലുള്ള അതിവിശുദ്ധസ്ഥാനത്തേക്ക് ഇഷ്ടമുള്ളപ്പോഴെല്ലാം പ്രവേശിക്കരുത്; അല്ലെങ്കിൽ അവൻ മരിക്കും. കാരണം പ്രായശ്ചിത്തമൂടിയുടെ മുകളിൽ മേഘത്തിൽ ഞാൻ പ്രത്യക്ഷനാകും.[a]”'
  to: 'യഹ്‌വേ മോശെയോടു പറഞ്ഞു: “നിന്റെ സഹോദരനായ അഹരോനോടു പറയുക: അവൻ എപ്പോൾ വേണമെങ്കിലും തിരശ്ശീലയ്ക്കുള്ളിലെ അതിവിശുദ്ധസ്ഥാനത്തേക്കു, പെട്ടകത്തിന്മേലുള്ള പ്രായശ്ചിത്തമൂടിയുടെ[a] മുമ്പിലേക്കു, പ്രവേശിക്കരുത്; അങ്ങനെ അവൻ മരിക്കാതിരിക്കട്ടെ. കാരണം, പ്രായശ്ചിത്തമൂടിയുടെ മുകളിൽ മേഘത്തിൽ ഞാൻ പ്രത്യക്ഷനാകും.”'
  rationale: The revision clarifies the Hebrew locative progression—inside the veil, in the Most Holy Place, before the ark's atonement cover—without adding ritual details. It retains the source's cloud-expression ambiguity, uses a purpose/result formulation for avoidance of death, and moves the lexical-alternative marker to its referent.
  reviewer_model: gpt-5.6-terra
