  source_fidelity: 'മൂലഹീബ്രുവിലെ ആചാരക്രമവും പാപപദത്രയവും കരടിൽ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: അഹരോൻ ഇരുകൈകളും ജീവനുള്ള കോലാട്ടുകൊറ്റന്റെ തലയിൽ വെക്കുന്നു, ഇസ്രായേൽമക്കളുടെ അകൃത്യങ്ങൾ/അതിക്രമങ്ങൾ/പാപങ്ങൾ ഏറ്റുപറയുന്നു, അവയെ അതിന്റെ തലയിൽ വയ്ക്കുന്നു, പിന്നെ അതിനെ മരുഭൂമിയിലേക്ക് അയക്കുന്നു. עִתִּי എന്ന ദുഷ്കരമായ വിശേഷണത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പ് യുക്തമായി സംരക്ഷിക്കുന്നു.'
  naturalness: ‘ഒരാളുടെ കൈവശം അതിനെ ... അയയ്ക്കണം’ എന്നത് മലയാളത്തിൽ ആ വ്യക്തിയുടെ ഉടമസ്ഥതയിലോ കൈപ്പിടിയിലോ ഏൽപ്പിക്കുന്നതുപോലെ കേൾക്കാം. ബְּיַד എന്ന ഏജൻസി-പ്രയോഗത്തിന് ‘ഒരാളുടെ കൈവഴി’ കൂടുതൽ സ്വാഭാവികവും നേരിട്ടുമാണ്.
  terminology: ‘അകൃത്യങ്ങൾ / അതിക്രമങ്ങൾ / പാപങ്ങൾ’ എന്ന വേർതിരിവ് മൂലത്തിലെ മൂന്ന് പദങ്ങളുടെ ആവർത്തനാത്മക സമഗ്രത സംരക്ഷിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ,’ ‘ജീവനുള്ള കോലാട്ടുകൊറ്റൻ,’ ‘മരുഭൂമി’ എന്നിവയും രജിസ്റ്ററിനും സന്ദർഭത്തിനും യോജിക്കുന്നു.
