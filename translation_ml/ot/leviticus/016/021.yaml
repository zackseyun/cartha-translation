source:
  edition: WLC
  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: ml
  text: അഹരോൻ ജീവനുള്ള കോലാട്ടുകൊറ്റന്റെ തലയിൽ തന്റെ രണ്ടു കൈകളും വെച്ച്, ഇസ്രായേൽമക്കളുടെ എല്ലാ അകൃത്യങ്ങളും അവരുടെ എല്ലാ അതിക്രമങ്ങളും അവരുടെ എല്ലാ പാപങ്ങളും അതിന്റെമേൽ ഏറ്റുപറയണം. അവയെ കോലാട്ടുകൊറ്റന്റെ തലയിൽ ചുമത്തി, ആ ചുമതലയ്ക്കായി നിയോഗിക്കപ്പെട്ട ഒരാളുടെ കൈവഴി[a] അതിനെ മരുഭൂമിയിലേക്ക് അയയ്ക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ ചുമതലയ്ക്കായി സന്നദ്ധനായ’ അല്ലെങ്കിൽ ‘അതിന് യോജിച്ച’ ഒരാൾ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം നിയമനം, സന്നദ്ധത, അല്ലെങ്കിൽ ആ അവസരത്തിനുള്ള യോഗ്യത എന്നിവയിൽ ഏതിനെ ഊന്നുന്നു എന്നത് ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: വെച്ച്
  rationale: യാഗാചാരസന്ദർഭത്തിൽ കൈകൾ മൃഗത്തിന്റെ തലയിൽ വയ്ക്കുന്ന ആചാരപ്രവൃത്തിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അമർത്തലിന്റെ അളവ് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: שְׁתֵּי יָדוֹ
  choice: തന്റെ രണ്ടു കൈകളും
  rationale: ദ്വിവചനത്തിന്റെ ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הַשָּׂעִיר הַחַי
  choice: ജീവനുള്ള കോലാട്ടുകൊറ്റൻ
  rationale: പ്രായശ്ചിത്തദിനാചാരത്തിൽ ജീവനോടെ ശേഷിക്കുന്ന ആൺകോലാടിനെ തിരിച്ചറിയിക്കുന്നു.
- source_word: וְהִתְוַדָּה עָלָיו
  choice: അതിന്റെമേൽ ഏറ്റുപറയണം
  rationale: പാപങ്ങൾ മൃഗത്തിന്റെമേൽ ആചാരപരമായി ഏറ്റുപറയുന്നതെന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: עֲוֺנֹת
  choice: അകൃത്യങ്ങൾ
  rationale: ധാർമ്മിക വക്രതയും കുറ്റവും സൂചിപ്പിക്കുകയും മറ്റു പാപപദങ്ങളിൽനിന്ന് വ്യത്യസ്തമായി നിലകൊള്ളുകയും ചെയ്യുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ പുത്രസംബന്ധിയായ സമൂഹനാമത്തിന്റെ രൂപം സ്വാഭാവികമായ ബൈബിൾ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פִּשְׁעֵיהֶם
  choice: അതിരിക്രമങ്ങൾ
  rationale: പരിധിലംഘനവും കലഹാത്മകമായ കുറ്റവും ഉൾക്കൊള്ളുന്ന പദം; പാപപദത്രയത്തിലെ വ്യത്യാസം കാക്കുന്നു.
- source_word: לְכָל חַטֹּאתָם
  choice: അവരുടെ എല്ലാ പാപങ്ങളും
  rationale: മസോററ്റിക് വിഭജനവും വാക്യത്തിലെ സമഗ്രമായ പാപപ്പട്ടികയും അനുസരിച്ച് മൂന്നാമത്തെ വിഭാഗമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְנָתַן אֹתָם
  choice: അവയെ ... ചുമത്തി
  rationale: ഏറ്റുപറഞ്ഞ പാപങ്ങളെ കോലാട്ടുകൊറ്റന്റെ തലയിൽ ആചാരപരമായി ഏൽപ്പിക്കുന്ന ആശയം സജീവമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְשִׁלַּח
  choice: അയയ്ക്കണം
  rationale: അകറ്റി മരുഭൂമിയിലേക്കു കൊണ്ടുപോകുന്ന പ്രവൃത്തിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: בְּיַד אִישׁ עִתִּי
  choice: ആ ചുമതലയ്ക്കായി നിയോഗിക്കപ്പെട്ട ഒരാളുടെ കൈവശം
  rationale: עִתִּי എന്ന ദുഷ്കരപദം നിയമനം, സന്നദ്ധത, അവസരയോഗ്യത എന്നിവയിൽ ഏതിനെയാണ് ഊന്നുന്നതെന്ന അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ സന്ദർഭാനുസൃതമായി നൽകുകയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: הַמִּדְבָּרָה
  choice: മരുഭൂമിയിലേക്ക്
  rationale: ദിശാസൂചക പ്രത്യയം വ്യക്തമാക്കുന്ന ലക്ഷ്യഗതിയെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മൂന്നു പാപപദങ്ങളുടെ വ്യത്യാസം
  choice: അകൃത്യങ്ങൾ / അതിക്രമങ്ങൾ / പാപങ്ങൾ
  alternative: എല്ലാം ‘പാപങ്ങൾ’ എന്നു ഏകീകരിക്കൽ
  rationale: עֲוֺנֹת, פִּשְׁעִים, חַטֹּאות എന്ന പദത്രയം ഇസ്രായേലിന്റെ കുറ്റത്തിന്റെ സമഗ്രത ഊന്നുന്നതിനാൽ അവയുടെ അർത്ഥവ്യത്യാസം നിലനിർത്തി.
- issue: പാപങ്ങൾ കോലാട്ടുകൊറ്റന്റെ തലയിൽ വയ്ക്കുന്നതിന്റെ അവതരണം
  choice: അവയെ ... തലയിൽ ചുമത്തി
  alternative: അവയെ ... തലയിൽ വെച്ച്
  rationale: വിധി എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്നതിനെ സിദ്ധാന്തപരമായി വിശദീകരിക്കാതെ, മൂലപാഠത്തിലെ പ്രതീകാത്മക കൈമാറ്റഭാഷ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ കുടുംബ/വംശസംബന്ധിയായ രൂപം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ സമൂഹത്തെ ഉൾക്കൊള്ളുന്ന പതിവുപ്രയോഗം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദീർഘമായ ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; ആചാരക്രമവും പാപപദത്രയവും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ദുഷ്കരപദത്തിന്റെ വിവർത്തനത്തിനു ശേഷം ചേർത്തിരിക്കുന്നു.
