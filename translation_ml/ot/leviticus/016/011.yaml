source:
  edition: WLC
  text: וְ/הִקְרִ֨יב אַהֲרֹ֜ן אֶת פַּ֤ר הַֽ/חַטָּאת֙ אֲשֶׁר ל֔/וֹ וְ/כִפֶּ֥ר בַּֽעֲד֖/וֹ וּ/בְעַ֣ד בֵּית֑/וֹ וְ/שָׁחַ֛ט אֶת פַּ֥ר הַֽ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: ml
  text: അഹരോൻ തനിക്കുവേണ്ടിയുള്ള പാപയാഗത്തിന്റെ കാളയെ[a] ഹാജരാക്കണം; തനിക്കും തന്റെ വീട്ടുകാർക്കും[b] വേണ്ടി പ്രായശ്ചിത്തം കഴിക്കണം; പിന്നെ തനിക്കുവേണ്ടിയുള്ള പാപയാഗത്തിന്റെ കാളയെ അറുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാപയാഗത്തിനുള്ള കാളയെ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘തനിക്കും തന്റെ വീടിനും വേണ്ടി’ എന്നാണ്; ഇവിടെ ‘വീട്’ എന്നത് അദ്ദേഹത്തിന്റെ വീട്ടിലുള്ളവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: ഹാജരാക്കി
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള קרב യാഗസന്ദർഭത്തിൽ മൃഗത്തെ അടുത്തുകൊണ്ടുവന്ന് ദൈവസന്നിധിയിൽ ഹാജരാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്ന് അറുക്കൽ പറയുന്നതിനാൽ ഇവിടെ ‘അർപ്പിച്ചു’ എന്നു വിവർത്തനം ചെയ്ത് മുഴുവൻ യാഗക്രിയയും മുൻകൂട്ടി സൂചിപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: פַּר הַחַטָּאת
  choice: പാപയാഗത്തിന്റെ കാള
  rationale: സ്രോതസ്സിലെ സംയുക്തബന്ധവും യാഗപരമായ സാങ്കേതികപദവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לוֹ
  choice: തനിക്കുവേണ്ടിയുള്ള
  rationale: ഇവിടെ കേവല ഉടമസ്ഥതയേക്കാൾ അഹരോനുവേണ്ടി നിയോഗിക്കപ്പെട്ട മൃഗം എന്ന ആചാരപരമായ അർത്ഥമാണ് പ്രസക്തം.
- source_word: וְכִפֶּר
  choice: പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ പരമ്പരാഗതവും വിശാലവുമായ അർത്ഥം നിലനിർത്തുന്നു; പ്രായശ്ചിത്തത്തിന്റെ പ്രത്യേക സിദ്ധാന്തപരമായ പ്രവർത്തനരീതി ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: തനിക്കും തന്റെ കുടുംബത്തിനും വേണ്ടി
  rationale: בעד എന്നതിന്റെ ‘വേണ്ടി/പക്ഷമായി’ എന്ന അർത്ഥവും ביתו എന്നതിന്റെ വീട്ടിലുള്ളവർ എന്ന ആശയവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְשָׁחַט
  choice: പിന്നെ ... അറുക്കണം
  rationale: שׁחט യാഗമൃഗത്തെ അറുക്കുന്നതിനുള്ള സാധാരണ പദമാണ്. ‘പിന്നെ’ ക്രിയകളുടെ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: פַּר הַחַטָּאת אֲשֶׁר לוֹ
  choice: തനിക്കുവേണ്ടിയുള്ള പാപയാഗത്തിന്റെ കാള
  rationale: എബ്രായത്തിലെ ആവർത്തനവും ആചാരപരമായ ഊന്നലും നിലനിർത്താൻ ഒരേ പ്രയോഗം രണ്ടിടത്തും ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  alternative: ശുദ്ധീകരണം നടത്തുക
  rationale: വാക്യം ആചാരക്രിയയെയും അതിന്റെ ഗുണഭോക്താക്കളെയും പറയുന്നു; അതിന്റെ പിന്നിലെ പ്രത്യേക ദൈവശാസ്ത്രപരമായ പ്രവർത്തനരീതി നിർണ്ണയിക്കുന്നില്ല. ‘പ്രായശ്ചിത്തം കഴിക്കുക’ ഈ വിശാലതയും പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. യാഗസാങ്കേതികപദങ്ങൾ വ്യക്തമായി നിലനിർത്തുകയും എബ്രായത്തിലെ ആവർത്തനം സംരക്ഷിക്കുകയും ചെയ്തു.
