reference: Leviticus 16:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: ml
  text: അവൻ വിശുദ്ധസ്ഥാനത്ത് പ്രായശ്ചിത്തം കഴിക്കാനായി സമാഗമകൂടാരത്തിൽ പ്രവേശിക്കുന്നതുമുതൽ പുറത്തുവരുന്നതുവരെ ആരും സമാഗമകൂടാരത്തിൽ ഉണ്ടായിരിക്കരുത്. അവൻ തനിക്കുവേണ്ടിയും തന്റെ കുടുംബത്തിനുവേണ്ടിയും ഇസ്രായേലിന്റെ സർവസഭയ്ക്കുവേണ്ടിയും പ്രായശ്ചിത്തം കഴിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל־אָדָם
  choice: ആരും
  rationale: നിഷേധവാക്യത്തിൽ ‘ഒരു മനുഷ്യനും’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ആരും ... ഉണ്ടായിരിക്കരുത്’ എന്നു നൽകുന്നു; വിലക്ക് എല്ലാവരെയും ഉൾക്കൊള്ളുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ ആരാധനാകൂടാരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും പരിചിതവുമായ മലയാള ബൈബിൾ പദപ്രയോഗം.
- source_word: לְכַפֵּר / וְכִפֶּר
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  rationale: כפר എന്ന ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ ക്രിയയുടെ അർഥം നിലനിർത്തുന്ന പരമ്പരാഗതവും ഗ്രാഹ്യവുമായ പ്രയോഗം.
- source_word: בַּקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥാനത്ത്
  rationale: ആചാരസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലാർഥം സംരക്ഷിക്കുന്നു; ഇവിടെ അതിനെ കൂടുതൽ സങ്കുചിതമായ പ്രത്യേക അറയുടെ പേരായി നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: בֵּיתוֹ
  choice: തന്റെ കുടുംബം
  rationale: ‘അവന്റെ വീട്/ഗൃഹം’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭാനുസൃതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സർവസഭ
  rationale: קהל എന്നത് ജനത്തിന്റെ ഔപചാരിക സമൂഹത്തെയോ സഭയെയോ സൂചിപ്പിക്കുന്നു; ‘സർവസഭ’ ‘എല്ലാ’ എന്ന വ്യാപ്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രായശ്ചിത്തത്തിന്റെ കർത്താവും പ്രയോജനഭോക്താക്കളും
  choice: ‘അവൻ ... തനിക്കുവേണ്ടിയും ... പ്രായശ്ചിത്തം കഴിക്കണം’ എന്ന ഘടന നിലനിർത്തി
  alternative: പുരോഹിതനെയോ പ്രായശ്ചിത്തത്തിന്റെ ഫലത്തെയോ വിശദീകരിച്ച് ചേർക്കുക
  rationale: മൂലവാക്യം കർത്താവിനെ മുമ്പത്തെ സന്ദർഭത്തിൽനിന്ന് ‘അവൻ’ എന്നുമാത്രം സൂചിപ്പിക്കുകയും പ്രായശ്ചിത്തത്തിന്റെ സ്വഭാവം വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു; അതിനാൽ വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കി.
- issue: בַּקֹּדֶשׁ എന്നതിന്റെ സ്ഥലപരിധി
  choice: ‘വിശുദ്ധസ്ഥാനത്ത്’
  alternative: ‘അതിവിശുദ്ധസ്ഥാനത്ത്’ അല്ലെങ്കിൽ ‘വിശുദ്ധമന്ദിരത്തിൽ’
  rationale: ഹീബ്രു പദം ഇവിടെ പൊതുവായി ‘വിശുദ്ധസ്ഥലം/വിശുദ്ധമേഖല’ എന്നു വായിക്കാവുന്നതിനാൽ യഥാർഥത്തിലുള്ള വ്യാപ്തിവ്യത്യാസം അടച്ചുപൂട്ടിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഹീബ്രുവിലെ സമയഘടന വ്യക്തമായി വായിക്കാനായി ‘പ്രവേശിക്കുന്നതുമുതൽ പുറത്തുവരുന്നതുവരെ’ എന്ന സ്വാഭാവിക ക്രമം ഉപയോഗിച്ചു. അനാവശ്യമായ ലിംഗനിർണ്ണയം ഒഴിവാക്കാതെ, വിലക്കിന്റെ സർവവ്യാപ്തി മലയാളത്തിലെ ‘ആരും’ എന്ന നിഷേധരൂപത്തിൽ പ്രകടമാക്കി.
