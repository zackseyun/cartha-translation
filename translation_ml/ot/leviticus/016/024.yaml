source:
  edition: WLC
  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: ml
  text: അവൻ ഒരു വിശുദ്ധസ്ഥലത്ത്[b] തന്റെ ശരീരം[a] വെള്ളംകൊണ്ട് കഴുകണം; തുടർന്ന് തന്റെ വസ്ത്രങ്ങൾ ധരിക്കണം. പിന്നെ അവൻ പുറത്തുവന്ന്, തന്റെ ഹോമയാഗവും ജനങ്ങളുടെ ഹോമയാഗവും അർപ്പിക്കണം; തനിക്കുവേണ്ടിയും ജനത്തിനുവേണ്ടിയും പാപപരിഹാരം നടത്തണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘തന്റെ മാംസം’.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഒരു വിശുദ്ധസ്ഥലത്ത്’ എന്നാണ്; അകത്തെ വിശുദ്ധമന്ദിരമുറിയായ ‘വിശുദ്ധസ്ഥലം’ എന്ന സാങ്കേതിക അർഥം നിർബന്ധമല്ല.
    reason: lexical_alternative
  - marker: c
    text: ‘പാപനിവൃത്തി വരുത്തണം’ എന്നും, ചില അനുഷ്ഠാനസന്ദർഭങ്ങളിൽ ‘ശുദ്ധീകരിക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ
  choice: കഴുകി ... ധരിക്കണം
  rationale: നിയമനിർദേശങ്ങളുടെ തുടർച്ചയിൽ വരുന്ന ഈ ക്രിയയ്ക്ക് വിധിപരമായ അർഥമുണ്ട്. മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമവാക്യത്തിനായി ആദ്യക്രിയയെ ക്രിയാവിശേഷണരൂപത്തിലും മുഖ്യവിധിയെ ‘ധരിക്കണം’ എന്ന രൂപത്തിലും അവതരിപ്പിച്ചു.
- source_word: בְּשָׂרוֹ
  choice: തന്റെ ശരീരം
  rationale: അക്ഷരാർഥം ‘തന്റെ മാംസം’ എന്നാണെങ്കിലും, അനുഷ്ഠാനപരമായ കഴുകലിന്റെ സന്ദർഭത്തിൽ ‘ശരീരം’ ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നതുമാണ്.
- source_word: בַּמַּיִם
  choice: വെള്ളംകൊണ്ട്
  rationale: רחץ എന്ന കഴുകൽക്രിയയോടൊപ്പം ഉപാധിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: ഒരു വിശുദ്ധസ്ഥലത്ത്
  rationale: מקום എന്ന പദത്തിന് നിർദേശക ഉപപദമില്ല. അതിനാൽ സാങ്കേതികമായ ‘വിശുദ്ധസ്ഥലത്തിൽ’ എന്നതിനെക്കാൾ അനിർദിഷ്ടമായ ‘ഒരു വിശുദ്ധസ്ഥലത്ത്’ എബ്രായത്തെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְלָבַשׁ אֶת־בְּגָדָיו
  choice: സ്വന്തം വസ്ത്രങ്ങൾ ധരിക്കണം
  rationale: ‘ധരിക്കുക’ അനുഷ്ഠാനപരവും മാന്യവുമായ ഭാഷാശൈലി നിലനിർത്തുന്നു; ‘സ്വന്തം’ പ്രത്യയസൂചനയെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְיָצָא
  choice: പുറത്തുവന്ന്
  rationale: വിശുദ്ധസ്ഥലത്തുനിന്നുള്ള തുടർചലനം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְעָשָׂה
  choice: അർപ്പിച്ച്
  rationale: ഹോമയാഗങ്ങളോടൊപ്പം עשׂה എന്ന ക്രിയയ്ക്ക് അക്ഷരാർഥമായ ‘ചെയ്യുക’ എന്നതിനെക്കാൾ യാഗസന്ദർഭത്തിന് യോജിച്ചത് ‘അർപ്പിക്കുക’ ആണ്.
- source_word: עֹלָתוֹ
  choice: തനിക്കുള്ള ഹോമയാഗം
  rationale: עלה എന്ന യാഗപദത്തിന് മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ മതഭാഷയിലും വ്യക്തമായ, സ്ഥാപിതമായ തുല്യപദമാണ് ‘ഹോമയാഗം’; ഉടമസ്ഥതയ്ക്കപ്പുറം അവനുവേണ്ടിയുള്ള യാഗമെന്ന സന്ദർഭാർഥവും ‘തനിക്കുള്ള’ നിലനിർത്തുന്നു.
- source_word: עֹלַת הָעָם
  choice: ജനത്തിനുള്ള ഹോമയാഗം
  rationale: മുൻപത്തെ പ്രയോഗത്തോടുള്ള സമാന്തരഘടന നിലനിർത്തുകയും യാഗം ജനത്തിനുവേണ്ടിയുള്ളതാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְכִפֶּר
  choice: പാപപരിഹാരം വരുത്തണം
  rationale: כפר എന്ന പൗരോഹിത്യ-യാഗപദത്തിന്റെ വിശാലമായ അനുഷ്ഠാനപരവും ദൈവശാസ്ത്രപരവുമായ അർഥം നിലനിർത്തുന്നു; ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: בַּעֲדוֹ וּבְעַד הָעָם
  choice: തനിക്കുവേണ്ടിയും ജനത്തിനുവേണ്ടിയും
  rationale: בעד എന്നതിന്റെ പ്രതിനിധിത്വപരമായ ‘വേണ്ടി’ എന്ന അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: ലേവ്യയാഗനിയമത്തിലെ כפר എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപപരിഹാരം വരുത്തണം
  alternative: പാപനിവൃത്തി വരുത്തണം; ശുദ്ധീകരിക്കണം
  rationale: ഈ വാക്യം പാപപരിഹാരദിനത്തിലെ പൗരോഹിത്യയാഗനടപടിയെക്കുറിച്ചാണ്. ‘പാപപരിഹാരം വരുത്തുക’ എന്നത് പദത്തിന്റെ സ്ഥാപിതമായ വിശാലാർഥം സംരക്ഷിക്കുന്നു; ചില അനുഷ്ഠാനസന്ദർഭങ്ങളിലെ പാപനിവൃത്തിയുടെയോ ശുദ്ധീകരണത്തിന്റെയോ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശശൈലി സ്വീകരിച്ചു. ദീർഘമായ എബ്രായ ക്രമവാക്യം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; പ്രവർത്തനങ്ങളുടെ ക്രമവും വിധിപരമായ ശക്തിയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടു ചേർത്തിരിക്കുന്നു.
