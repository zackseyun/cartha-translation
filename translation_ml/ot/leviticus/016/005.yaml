id: LEV.16.5
reference: Leviticus 16:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെ സമൂഹത്തിൽനിന്ന്[a] അവൻ പാപയാഗത്തിനായി[b] രണ്ട് ആൺകോലാടുകളെയും ഹോമയാഗത്തിനായി ഒരു ആട്ടുകൊറ്റനെയും എടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “ഇസ്രായേൽജനതയുടെ” / “ഇസ്രായേല്യരുടെ.” എബ്രായത്തിൽ അക്ഷരാർഥം: “ഇസ്രായേലിന്റെ മക്കൾ.”'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ശുദ്ധീകരണയാഗത്തിനായി.” ലേവ്യപുസ്തകത്തിൽ חַטָּאת എന്ന എബ്രായപദം പാപവും ആചാരപരമായ അശുദ്ധിയും നീക്കുന്നതുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: …യിൽനിന്ന്
  rationale: ബന്ധകവും ഉറവിടം സൂചിപ്പിക്കുന്ന മുൻപ്രത്യയവും ചേർന്ന രൂപം. മുൻവാക്യത്തിന്റെ തുടർച്ച മലയാളവാക്യക്രമത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നതിനാൽ പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കാതെ, മൃഗങ്ങളെ സമൂഹത്തിൽനിന്നാണ് എടുക്കേണ്ടത് എന്ന അർഥം വ്യക്തമായി നൽകി.
- source_word: עֲדַת
  choice: സമൂഹം
  rationale: ഉടമ്പടിജനമായ ഇസ്രായേലിന്റെ കൂട്ടായ സമൂഹത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിനപ്പുറം ഇവിടെ ഉദ്ദേശിക്കുന്ന മുഴുവൻ ജനസമൂഹത്തെയും ഉൾക്കൊള്ളുന്നതുമായ പദമാണ് ‘സമൂഹം’.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപം ചുരുക്കവും പരിചിതവുമായ മലയാളപ്രയോഗത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
- source_word: יִקַּח
  choice: എടുക്കണം
  rationale: ആചാരനിയമത്തിലെ നിർദേശാത്മക അപൂർണക്രിയയെ ആധുനിക മലയാളത്തിലെ വ്യക്തമായ നിർബന്ധനിർദേശമായി അവതരിപ്പിക്കുന്നു.
- source_word: שְׂעִירֵי עִזִּים
  choice: ആൺകോലാടുകൾ
  rationale: ബലിമൃഗങ്ങളുടെ ഇനം മാത്രമല്ല, ആൺമൃഗങ്ങളാണെന്ന നിർദേശവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: ലേവ്യപുസ്തകത്തിലെ ബലിസന്ദർഭത്തിൽ חַטָּאת ഒരു പ്രത്യേക യാഗത്തെ സൂചിപ്പിക്കുന്നു. പരമ്പരാഗതമായി വ്യക്തവും പൊതുവേ മനസ്സിലാകുന്നതുമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
- source_word: וְאַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: אַיִל എന്നത് പ്രത്യേകിച്ച് ആൺചെമ്മരിയാടായ കൊറ്റനെ സൂചിപ്പിക്കുന്നു; אֶחָד എന്ന സംഖ്യയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന עֹלָה യാഗത്തിന് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും കൃത്യവുമായ ‘ഹോമയാഗം’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കൂട്ടായ പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം / ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധപരമായ രൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുമ്പോഴും അത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ലെന്നും മുഴുവൻ ഇസ്രായേൽജനത്തെയും ഉൾക്കൊള്ളുന്ന കൂട്ടായ പ്രയോഗമാണെന്നും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ബലിസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ യാഗം പാപത്തോടും ആചാരപരമായ അശുദ്ധിയോടും ബന്ധപ്പെട്ടിരിക്കുന്നതിനാൽ രണ്ട് പേരുകളും അതിന്റെ വശങ്ങൾ പ്രകടിപ്പിക്കുന്നു. പരിചിതമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ നൽകി, ശുദ്ധീകരണപ്രവർത്തനം ഊന്നുന്ന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള നിയമ-ആരാധനാ ശൈലി പാലിച്ചു. ‘പാപയാഗം,’ ‘ഹോമയാഗം’ എന്നീ പരിചിത ബലിസാങ്കേതിക പദങ്ങൾ നിലനിർത്തി; മലയാളത്തിലെ സ്വാഭാവിക കർമക്രമം അനുസരിച്ച് ക്രിയ അവസാനം വെച്ചു.
