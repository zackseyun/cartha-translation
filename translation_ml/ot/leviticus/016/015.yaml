id: LEV.16.15
reference: Leviticus 16:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: ml
  text: പിന്നെ അവൻ ജനത്തിനുവേണ്ടിയുള്ള പാപയാഗത്തിന്റെ കോലാടിനെ അറുത്ത്, അതിന്റെ രക്തം തിരശ്ശീലയ്ക്കുള്ളിലേക്കു കൊണ്ടുവരണം. കാളയുടെ രക്തത്തോടു ചെയ്തതുപോലെ അതിന്റെ രക്തത്തോടും ചെയ്യണം; ആ രക്തം പ്രായശ്ചിത്തമൂടിയുടെ മേലും പ്രായശ്ചിത്തമൂടിയുടെ മുമ്പിലും തളിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁחַט
  choice: പിന്നെ അവൻ ... അറുത്ത്
  rationale: ആചാരക്രമത്തിലെ തുടർച്ചയെ ‘പിന്നെ’ വ്യക്തമാക്കുന്നു; שׁחט എന്നത് യാഗമൃഗത്തെ അറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: שְׂעִיר הַחַטָּאת אֲשֶׁר לָעָם
  choice: ജനത്തിനുവേണ്ടിയുള്ള പാപയാഗത്തിന്റെ കോലാട്
  rationale: ജനത്തിനുവേണ്ടി അർപ്പിക്കുന്ന പാപയാഗവുമായി ഈ കോലാടിനുള്ള ബന്ധവും അഹരോന്റെ കാളയിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: אֶל מִבֵּית לַפָּרֹכֶת
  choice: തിരശ്ശീലയ്ക്കുള്ളിലേക്കു
  rationale: തിരശ്ശീലയ്ക്കു പിന്നിലുള്ള അകത്തെ വിശുദ്ധസ്ഥലത്തേക്കുള്ള പ്രവേശനമാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: וְעָשָׂה אֶת דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: കാളയുടെ രക്തത്തോടു ചെയ്തതുപോലെ അതിന്റെ രക്തത്തോടും ചെയ്യണം
  rationale: മൂലപാഠത്തിലെ സംക്ഷിപ്തമായ ആചാരനിർദേശം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהִזָּה אֹתוֹ
  choice: ആ രക്തം ... തളിക്കണം
  rationale: נזה യാഗാചാരസന്ദർഭത്തിൽ രക്തം തളിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ആ രക്തം’ എന്ന് വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: הַכַּפֹּרֶת
  choice: പ്രായശ്ചിത്തമൂടി
  rationale: പെട്ടകത്തിന്റെ സ്വർണമൂടിയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വസ്തുസംബന്ധിയായ അർഥവും כפר ധാതുവുമായുള്ള പ്രായശ്ചിത്തബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: അതിന്റെ മുമ്പിലും
  rationale: മൂടിയുടെ ‘മേൽ’ എന്നതിൽനിന്നു വ്യത്യസ്തമായ, അതിന്റെ മുമ്പിലുള്ള സ്ഥാനം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: כַּפֹּרֶת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പ്രായശ്ചിത്തമൂടി
  alternative: കൃപാസനം
  rationale: ഈ പദം പെട്ടകത്തിന്റെ മൂടിയെയും പ്രായശ്ചിത്തദിനത്തിലെ അതിന്റെ ആചാരപരമായ പങ്കിനെയും സൂചിപ്പിക്കുന്നു. ‘പ്രായശ്ചിത്തമൂടി’ വസ്തുവും כפר ധാതുബന്ധവും സുതാര്യമാക്കുന്നു; പരമ്പരാഗതമായ ‘കൃപാസനം’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആചാരനിർദേശ ശൈലി. സാങ്കേതിക യാഗപദങ്ങൾ ആവശ്യമായിടത്ത് നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
