id: LEV.16.8
reference: Leviticus 16:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַ֧ן אַהֲרֹ֛ן עַל שְׁנֵ֥י הַ/שְּׂעִירִ֖ם גּוֹרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַ/יהוָ֔ה וְ/גוֹרָ֥ל אֶחָ֖ד לַ/עֲזָאזֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: ml
  text: 'അഹരോൻ ആ രണ്ടു കോലാടുകളുടെമേൽ നറുക്കിടണം: ഒരു നറുക്ക് യഹോവയ്ക്കും ഒരു നറുക്ക് അസാസേലിനും[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പാപവാഹക കോലാടിനും.” ‘അസാസേൽ’ എന്ന എബ്രായപദത്തിന്റെ അർഥം തർക്കവിധേയമാണ്; അത് ഒരു പേരായോ കോലാടിന്റെ ചുമതലയായോ നീക്കിക്കളയലുമായി ബന്ധപ്പെട്ട ഒരു പദമായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  choice: നറുക്കുകൾ ഇടണം
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കൊടുക്കുക/വെക്കുക’ എന്നാണെങ്കിലും, גּוֹרָלוֹת (‘നറുക്കുകൾ’) എന്ന പദത്തോടൊപ്പം ഇവിടെ നറുക്കിടുന്ന ആചാരപ്രവൃത്തിയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘നറുക്കുകൾ ഇടണം’ സ്വാഭാവികവും അർഥവ്യക്തവുമാണ്.
- source_word: עַל
  choice: മേൽ
  rationale: ‘മേൽ/മീതെ’ എന്ന സ്ഥലസംബന്ധിയായ ആചാരചിത്രം നിലനിർത്തുന്നു; ‘വേണ്ടി’ എന്ന വ്യാഖ്യാനാത്മക പരിഭാഷ ഒഴിവാക്കുന്നു.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: ആ രണ്ടു കോലാടുകൾ
  rationale: שָׂעִיר ഇവിടെ ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു. ‘കോലാട്’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; നിർദ്ദിഷ്ടതയ്ക്കായി ‘ആ’ ചേർത്തിരിക്കുന്നു.
- source_word: גּוֹרָלוֹת
  choice: നറുക്കുകൾ
  rationale: വിശുദ്ധ ആചാരത്തിൽ തിരഞ്ഞെടുപ്പിനോ നിയോഗത്തിനോ ഉപയോഗിക്കുന്ന നറുക്കുകളെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: גּוֹרָל אֶחָד
  choice: ഒരു നറുക്ക്
  rationale: ആവർത്തിച്ചിരിക്കുന്ന ഏകവചന പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; לְ നിയോഗം/ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘യ്ക്ക്’ ഉപയോഗിക്കുന്നു.
- source_word: לַעֲזָאזֵל
  choice: അസാസേലിന്
  rationale: עֲזָאזֵל എന്ന പദത്തിന്റെ അർഥം തർക്കവിധേയമായതിനാൽ പ്രധാനവാചകത്തിൽ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു; ‘പാപവാഹക കോലാട്’ പോലുള്ള വ്യാഖ്യാനപരമായ തീർപ്പ് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: പ്രായശ്ചിത്തദിനാചാരത്തിലെ עֲזָאזֵל എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘അസാസേൽ’ എന്ന ലിപ്യന്തരണം
  alternative: ‘പാപവാഹക കോലാട്’; ‘പൂർണമായ നീക്കം’; മരുഭൂമിയുമായി ബന്ധപ്പെട്ട ഒരു വ്യക്തിസത്ത
  rationale: ഈ പദം കോലാടിന്റെ ചുമതലയെയോ അതിന്റെ ലക്ഷ്യസ്ഥാനത്തെയോ ഒരു വ്യക്തിസത്തയെയോ സൂചിപ്പിക്കുന്നുവോ എന്ന് വാക്യം തന്നെ നിർണായകമായി വ്യക്തമാക്കുന്നില്ല. ലിപ്യന്തരണം ഈ യഥാർഥ അവ്യക്തതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ആചാരചിത്രവും ‘അസാസേൽ’ എന്ന പദത്തിന്റെ അവ്യക്തതയും നിലനിർത്തിയിരിക്കുന്നു.
