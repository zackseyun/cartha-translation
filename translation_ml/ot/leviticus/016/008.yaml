  to: 'അഹരോൻ ആ രണ്ടു കോലാടുകളുടെമേൽ നറുക്കിടണം: ഒരു നറുക്ക് യഹോവയ്ക്കും ഒരു നറുക്ക് അസാസേലിനും[a].'
