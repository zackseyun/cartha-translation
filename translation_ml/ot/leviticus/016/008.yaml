  source_fidelity: The draft accurately represents the two goats, the assignment by lots, and the parallel allocations “for Yahweh” and “for Azazel.” Retaining “അസാസേൽ” in the main text appropriately preserves the disputed Hebrew term without resolving it interpretively.
  naturalness: “നറുക്കുകൾ ഇടണം” is intelligible, but “നറുക്കിടണം” is the more idiomatic modern Malayalam expression for casting lots. It also avoids the slightly awkward impression that multiple lots are individually being placed on the goats.
  terminology: “കോലാടുകൾ,” “യഹോവ,” and “അസാസേൽ” are appropriate in a formal modern Malayalam biblical register. The footnote responsibly identifies the alternative “scapegoat” sense while retaining the term’s uncertainty.
