  text: וּ/בָ֤א אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וּ/פָשַׁט֙ אֶת בִּגְדֵ֣י הַ/בָּ֔ד אֲשֶׁ֥ר לָבַ֖שׁ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ וְ/הִנִּיחָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: ml
  text: പിന്നെ അഹരോൻ സമാഗമകൂടാരത്തിൽ വന്ന്, വിശുദ്ധസ്ഥലത്തേക്കു കടന്നപ്പോൾ ധരിച്ചിരുന്ന ശണവസ്ത്രങ്ങൾ അഴിച്ച് അവിടെ വെക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധമന്ദിരം’; പ്രായശ്ചിത്തദിനത്തിന്റെ വിപുലമായ സന്ദർഭം കണക്കിലെടുത്ത് ചിലർ ഇതിനെ കൂടുതൽ പ്രത്യേകമായി ‘അതിവിശുദ്ധസ്ഥലം’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָא
  choice: പിന്നെ ... വന്ന്
  rationale: ആചാരനിർദേശത്തിലെ ക്രമാനുസൃത പ്രവർത്തനം സൂചിപ്പിക്കുന്ന വാവ് + ഖാതൽ രൂപത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘പിന്നെ ... വന്ന്’ എന്നു നൽകി.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ആരാധനയ്ക്കായി നിശ്ചയിക്കപ്പെട്ട കൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: וּפָשַׁט
  choice: അഴിച്ച്
  rationale: വസ്ത്രം നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: בִּגְדֵי הַבָּד
  choice: ചണവസ്ത്രങ്ങൾ
  rationale: בגד എന്ന ‘വസ്ത്രം’ എന്ന അർഥവും בד സൂചിപ്പിക്കുന്ന വസ്തുവും നിലനിർത്തുന്നു; ആചാരപരമായ പ്രാധാന്യം മറച്ചുവയ്ക്കുന്നില്ല.
- source_word: אֲשֶׁר לָבַשׁ
  choice: ധരിച്ചിരുന്ന
  rationale: മുമ്പ് ധരിച്ച വസ്ത്രങ്ങളിലേക്കുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּבֹאוֹ
  choice: കടന്നപ്പോൾ
  rationale: കാലസാഹചര്യം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെ ‘...പ്പോൾ’ എന്നു നൽകുകയും വിശുദ്ധസ്ഥലത്തേക്കുള്ള പ്രവേശനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലം
  rationale: എബ്രായത്തിലെ പൊതുവായ ‘വിശുദ്ധ [സ്ഥലം]’ എന്ന രൂപം സംരക്ഷിക്കുന്നു; അതിവിശുദ്ധസ്ഥലം എന്നു മുഖ്യപാഠത്തിൽ കൂടുതൽ പ്രത്യേകമാക്കുന്നില്ല.
- source_word: וְהִנִּיחָם שָׁם
  choice: അവിടെ വെക്കണം
  rationale: വസ്ത്രങ്ങൾ അവിടെ വെച്ചുപോകണമെന്ന നിർദേശം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു; വെക്കുന്ന രീതി അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
theological_decisions:
- issue: הַקֹּדֶשׁ എന്നതിന്റെ സ്ഥലപരമായ സൂചന
  choice: വിശുദ്ധസ്ഥലം
  alternative: വിശുദ്ധമന്ദിരം; അതിവിശുദ്ധസ്ഥലം
  rationale: ഈ വാക്യത്തിൽ എബ്രായപദം ‘വിശുദ്ധ [സ്ഥലം]’ എന്ന പൊതുരൂപത്തിലാണ്. പ്രായശ്ചിത്തദിനത്തിന്റെ വിപുലമായ സന്ദർഭം അതിവിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നുവെങ്കിലും, മുഖ്യപാഠം കൂടുതൽ പ്രത്യേകമായ വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ഗൗരവമുള്ള ആചാരനിർദേശ ശൈലി ഉപയോഗിച്ചു. വാക്യത്തിന്റെ ക്രമാനുസൃത സ്വഭാവം നിലനിർത്താൻ സംയുക്ത ക്രിയാരൂപങ്ങളും അവസാനത്തിൽ ‘വെക്കണം’ എന്ന നിർദേശരൂപവും സ്വീകരിച്ചു.
