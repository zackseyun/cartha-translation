id: LEV.16.3
reference: Leviticus 16:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/זֹ֛את יָבֹ֥א אַהֲרֹ֖ן אֶל הַ/קֹּ֑דֶשׁ בְּ/פַ֧ר בֶּן בָּקָ֛ר לְ/חַטָּ֖את וְ/אַ֥יִל לְ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: ml
  text: 'അഹരോൻ വിശുദ്ധസ്ഥാനത്തേക്കു പ്രവേശിക്കേണ്ടത് ഇപ്രകാരമാണ്: പാപയാഗത്തിനായി[a] കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാളയെയും[b] ഹോമയാഗത്തിനായി ഒരു ആട്ടുകൊറ്റനെയും കൂടെക്കൊണ്ട്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ശുദ്ധീകരണയാഗത്തിനായി.’ എബ്രായപദം പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയും ആചാരപരമായ ശുദ്ധീകരണത്തെയും സൂചിപ്പിക്കാം.'
    reason: alternative_reading
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഒരു കാള, കന്നുകാലിയുടെ മകൻ’; കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള കാളയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/זֹאת
  choice: ഇപ്രകാരമാണ്
  rationale: בְּזֹאת ഇവിടെ മാർഗമോ രീതിയോ സൂചിപ്പിക്കുന്നു; തുടർന്ന് പറയുന്ന യാഗസാമഗ്രികളോടുകൂടിയ പ്രവേശനരീതിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יָבֹא
  choice: പ്രവേശിക്കേണ്ടത്
  rationale: നിയമനിർദേശസന്ദർഭത്തിലെ imperfect രൂപത്തിന്റെ നിർദേശാത്മക ശക്തി നിലനിർത്തുന്നു; വെറും ഭാവികാലപ്രസ്താവനയായി മാറ്റുന്നില്ല.
- source_word: אֶל הַ/קֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥാനത്തേക്കു
  rationale: ഇവിടെ הַקֹּדֶשׁ പ്രായശ്ചിത്തദിനത്തിൽ അഹരോൻ പ്രവേശിക്കുന്ന വിശുദ്ധമായ ആന്തരിക ഇടത്തെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘വിശുദ്ധമന്ദിരം’ എന്നതിനെക്കാൾ സ്ഥലസൂചന വ്യക്തമാണ്.
- source_word: בְּ/פַר בֶּן בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാളയെയും
  rationale: ‘കാള, കന്നുകാലിയുടെ മകൻ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പ്രായത്തെക്കുറിച്ച് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘കാളക്കുട്ടി’ എന്നു ചേർക്കുന്നില്ല.
- source_word: לְ/חַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: യാഗനിയമങ്ങളിൽ חַטָּאת എന്ന പദത്തിന്റെ പരമ്പരാഗതവും പരിചിതവുമായ അർത്ഥം നൽകുന്നു; ശുദ്ധീകരണപ്രാധാന്യം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְ/אַיִל
  choice: ഒരു ആട്ടുകൊറ്റനെയും
  rationale: אַיִל എന്നത് ആൺചെമ്മരിയാടായ ram-നെ സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിൽ വ്യക്തമായ പദം ഉപയോഗിക്കുന്നു.
- source_word: לְ/עֹלָה
  choice: ഹോമയാഗത്തിനായി
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിന്റെ സ്ഥിരമായ സാങ്കേതികപദമാണ്; മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ‘ഹോമയാഗം’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാഗനിയമത്തിലെ חַטָּאת എന്ന ആരാധനാപദം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: പദം പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയും അതിന്റെ ആചാരപരമായ ശുദ്ധീകരണഫലത്തെയും ഉൾക്കൊള്ളാം. മുഖ്യപാഠത്തിൽ പരിചിതമായ ‘പാപയാഗം’ ഉപയോഗിച്ച് മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നത് ഈ അർത്ഥപിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശശൈലി. വാക്യാരംഭത്തിലെ എബ്രായ ഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘പ്രവേശിക്കേണ്ടത് ഇപ്രകാരമാണ്’ എന്നു നൽകി; യാഗവസ്തുക്കൾ ‘കൊണ്ടുവരണം’ എന്ന സ്വാഭാവിക ക്രിയയോടെ ബന്ധിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
