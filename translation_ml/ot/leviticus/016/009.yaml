id: LEV.16.9
reference: Leviticus 16:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרִ֤יב אַהֲרֹן֙ אֶת הַ/שָּׂעִ֔יר אֲשֶׁ֨ר עָלָ֥ה עָלָ֛י/ו הַ/גּוֹרָ֖ל לַ/יהוָ֑ה וְ/עָשָׂ֖/הוּ חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: ml
  text: പിന്നെ അഹരോൻ, യഹ്‌വേക്കുള്ള ചീട്ട് വീണ കോലാടിനെ മുന്നിൽ കൊണ്ടുവന്ന് അതിനെ പാപയാഗമായി അർപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേക്കുള്ള ചീട്ട് ലഭിച്ച കോലാടിനെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: മുന്നിൽ കൊണ്ടുവന്ന്
  rationale: ബലികർമസന്ദർഭത്തിൽ הקריב എന്നത് ആചാരനടപടിക്കായി അടുത്തുകൊണ്ടുവരുക അഥവാ സന്നിധിയിൽ അവതരിപ്പിക്കുക എന്നർഥം നൽകുന്നു. ‘മുന്നിൽ കൊണ്ടുവന്ന്’ എന്നത് ബലിയർപ്പണം എന്ന അന്തിമനടപടി മുൻകൂട്ടി ചേർക്കാതെ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַשָּׂעִיר
  choice: കോലാടിനെ
  rationale: שׂעיר ഇവിടെ ആൺകോലാടിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘കോലാട്’ ആൺമൃഗത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: ചീട്ട് വീണ
  rationale: עלה ... הגורל എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം ചീട്ടിലൂടെ ആ മൃഗം നിയോഗിക്കപ്പെട്ടു എന്നതാണ്. ‘ചീട്ട് വീണ’ മലയാളത്തിലെ സ്വാഭാവികമായ സമാനപ്രയോഗമാണ്.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: ל എന്ന ഉപസർഗം ‘യഹ്‌വേക്കായി’ എന്ന നിയോഗം സൂചിപ്പിക്കുന്നു; יהוה എന്ന ദൈവനാമം വ്യക്തിനാമമായി ‘യഹ്‌വേ’ എന്നു നിലനിർത്തുന്നു.
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: അതിനെ പാപയാഗമായി അർപ്പിക്കണം
  rationale: യാഗനിയമങ്ങളിൽ חטאת എന്നത് ‘പാപയാഗം’ എന്നാണ്. עשהו חטאת എന്നത് മൃഗത്തെ പാപയാഗമായി ആചരിക്കുക/അർപ്പിക്കുക എന്നർഥം നൽകുന്നു; മലയാളത്തിൽ ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിനാമമാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: חטאת എന്ന പദത്തിന്റെ ഇവിടെ ഉള്ള അർഥം
  choice: പാപയാഗം
  alternative: പാപം
  rationale: ലേവ്യപുസ്തകത്തിലെ ഈ യാഗക്രമസന്ദർഭത്തിൽ חטאת പാപത്തെയല്ല, പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാക്രമഭാഷയാണ് ഉപയോഗിച്ചത്. ‘കോലാട്’, ‘ചീട്ട് വീണ’, ‘പാപയാഗം’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലപാഠത്തിന്റെ ആചാരപരമായ കൃത്യതയും നിലനിർത്തുന്നു.
