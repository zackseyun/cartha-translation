id: LEV.16.10
reference: Leviticus 16:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: ml
  text: എന്നാൽ അസസേലിനുള്ള നറുക്ക് വീണ കോലാട്ടുകൊറ്റനെ യഹോവയുടെ മുമ്പാകെ ജീവനോടെ നിർത്തപ്പെടണം; അതിന്മേൽ പ്രായശ്ചിത്തം നടത്തേണ്ടതിനും അസസേലിനായി അതിനെ മരുഭൂമിയിലേക്ക് അയയ്ക്കേണ്ടതിനും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അസസേൽ’ എന്ന എബ്രായപദത്തിന്റെ അർഥം തർക്കവിധേയമാണ്. അത് ഒരു പേരോ സ്ഥലസൂചനയോ ആയിരിക്കാം; അല്ലെങ്കിൽ നീക്കംചെയ്യലുമായി ബന്ധപ്പെട്ട ഒരു പദമായിരിക്കാം. ചില പരിഭാഷാപാരമ്പര്യങ്ങൾ ഇവിടെ ‘പാപവാഹക കോലാട്’ എന്നു നൽകുന്നു.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അതിനു വേണ്ടി പ്രായശ്ചിത്തം നടത്തേണ്ടതിന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: എന്നാൽ ... കോലാട്ടുകൊറ്റനെ
  rationale: שָׂעִיר ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; മുൻവാക്യത്തിലെ മറ്റേ കോലാടിനോടുള്ള വൈരുധ്യം וְ ഇവിടെ ‘എന്നാൽ’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: നറുക്ക് വീണ
  rationale: തിരഞ്ഞെടുപ്പിനായി നറുക്കുവീണു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לַעֲזָאזֵל
  choice: അസസേലിനുള്ള / അസസേലിനായി
  rationale: עֲזָאזֵל എന്ന പദത്തിന്റെ അർഥം തർക്കവിധേയമായതിനാൽ വ്യാഖ്യാനപരമായ ‘പാപവാഹക കോലാട്’ എന്നതിനു പകരം ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: יָעֳמַד חַי
  choice: ജീവനോടെ നിർത്തണം
  rationale: ഹോഫാൽ രൂപത്തിലെ causative/passive ഭാവവും കോലാടിനെ ജീവനോടെ നിർത്തുന്ന ആശയവും സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ മുമ്പാകെ
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരിച്ചു; cultic presentation സൂചിപ്പിക്കുന്ന לִפְנֵי ‘മുമ്പാകെ’ എന്നു നൽകി.
- source_word: לְכַפֵּר עָלָיו
  choice: അതിന്‍മേൽ പ്രായശ്ചിത്തം കഴിച്ച്
  rationale: כפר എന്ന ആരാധനാക്രമപദത്തിന് ‘പ്രായശ്ചിത്തം കഴിക്കുക’ എന്നും עַל എന്നതിന് ‘മേൽ’ എന്നും നൽകി, ബന്ധത്തിന്റെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: לְשַׁלַּח אֹתוֹ ... הַמִּדְבָּרָה
  choice: അതിനെ മരുഭൂമിയിലേക്ക് ... അയയ്ക്കണം
  rationale: ഉദ്ദേശ്യവും ദിശാസൂചകമായ ה־ ending-ഉം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: עֲזָאזֵל എന്നതിന്റെ അർഥം
  choice: അസസേൽ (ലിപ്യന്തരണം)
  alternative: പാപവാഹക കോലാട്; പൂർണമായ നീക്കം; മരുഭൂമിയുമായി ബന്ധപ്പെട്ട വ്യക്തി/സ്ഥലം
  rationale: പദത്തിന്റെ കൃത്യമായ സൂചന അനിശ്ചിതമാണ്. ലിപ്യന്തരണം ഈ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; പ്രധാന വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: לְכַפֵּר עָלָיו എന്നതിലെ עַל-ന്റെ ഭാവം
  choice: അതിന്‍മേൽ പ്രായശ്ചിത്തം കഴിച്ച്
  alternative: അതിനു വേണ്ടി പ്രായശ്ചിത്തം കഴിച്ച്
  rationale: ‘മേൽ’ എന്ന രൂപം കോലാട് പ്രായശ്ചിത്തത്തിന്റെ ഗുണഭോക്താവാണോ ആചാരപരമായ മാധ്യമമാണോ എന്ന് പാഠം പറയുന്നതിലധികം നിർണയിക്കാതെ വിടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നറുക്ക്’, ‘മുമ്പാകെ’, ‘പ്രായശ്ചിത്തം’ എന്നീ പരിചിതമായ ബൈബിൾ-ആരാധനാപദങ്ങൾ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
