source:
  edition: WLC
  text: וְ/הָיְתָ֥ה לָ/כֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם בַּ/חֹ֣דֶשׁ הַ֠/שְּׁבִיעִי בֶּֽ/עָשׂ֨וֹר לַ/חֹ֜דֶשׁ תְּעַנּ֣וּ אֶת נַפְשֹֽׁתֵי/כֶ֗ם וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: ml
  text: 'ഇത് നിങ്ങൾക്ക് സ്ഥിരമായ ഒരു ചട്ടമായിരിക്കണം: ഏഴാം മാസം, ആ മാസത്തിന്റെ പത്താം ദിവസം, നിങ്ങൾ സ്വയം താഴ്ത്തണം[a]; ഒരു ജോലിയും ചെയ്യരുത്—സ്വദേശിയായാലും നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന പരദേശിയായാലും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർത്ഥത്തിൽ, “നിങ്ങൾ സ്വയം കഷ്ടപ്പെടുത്തണം.” ഈ പ്രയോഗത്തിൽ ഉപവാസവും ഉൾപ്പെടുന്നതായി പരമ്പരാഗതമായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ഇത് ... ആയിരിക്കണം
  rationale: നിയമപരമായ ഈ സൂത്രവാക്യം മുമ്പ് പറഞ്ഞ ക്രമീകരണത്തെ ചൂണ്ടിക്കാട്ടി അതിന്റെ തുടർന്നുള്ള ബാധ്യത വ്യക്തമാക്കുന്നു.
- source_word: לְחֻקַּת עוֹלָם
  choice: എന്നേക്കുമുള്ള ഒരു ചട്ടം
  rationale: חֻקָּה നിർദേശിക്കപ്പെട്ട ചട്ടത്തെയും עוֹלָם ദീർഘകാലം നിലനിൽക്കുന്ന ബാധ്യതയെയും സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിൽ ശക്തി നിലനിർത്തുന്നു.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: ഏഴാം മാസം, ആ മാസത്തിന്റെ പത്താം ദിവസം
  rationale: എബ്രായ കലണ്ടർ തീയതി വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם
  choice: നിങ്ങൾ സ്വയം താഴ്ത്തണം
  rationale: ענה എന്ന ക്രിയയും נֶפֶשׁ എന്ന പദവും ചേർന്ന പ്രയോഗം ആത്മനിഷേധം/കഷ്ടപ്പെടുത്തൽ ഉൾക്കൊള്ളുന്ന വിശാലമായ ആശയമാണ്; ഉപവാസം മാത്രമായി പരിമിതപ്പെടുത്താതെ അർത്ഥവ്യാപ്തി കാക്കുന്നു.
- source_word: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ
  choice: ഒരു ജോലിയും ചെയ്യരുത്
  rationale: מְלָאכָהയുടെ സാധാരണ തൊഴിൽ/വേല എന്ന അർത്ഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָאֶזְרָח
  choice: സ്വദേശി
  rationale: സമൂഹത്തിൽ ജന്മനാ ഉൾപ്പെട്ട അംഗത്തെ പരദേശിയോട് വേർതിരിച്ചു സൂചിപ്പിക്കുന്നു.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: നിങ്ങളുടെ ഇടയിൽ താമസിക്കുന്ന പരദേശി
  rationale: ഗേർ എന്നത് ഇസ്രായേൽ സമൂഹത്തിനുള്ളിൽ പാർക്കുന്ന പുറത്തുനിന്നുള്ള താമസക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അനാവശ്യമായ രാഷ്ട്രീയ അർത്ഥച്ചായകളില്ലാതെ ആശയം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പാപപരിഹാരദിനത്തിലെ ആത്മനിഷേധ കല്പനയുടെ അർത്ഥം
  choice: പ്രധാന പാഠത്തിൽ “സ്വയം താഴ്ത്തണം” എന്ന് വിശാലമായി പരിഭാഷപ്പെടുത്തുക
  alternative: “സ്വയം കഷ്ടപ്പെടുത്തണം” അല്ലെങ്കിൽ “ഉപവസിക്കണം”
  rationale: എബ്രായ പ്രയോഗം ഉപവാസം ഉൾപ്പെടാവുന്ന ആത്മനിഷേധത്തെ സൂചിപ്പിക്കുന്നെങ്കിലും ഉപവാസത്തിൽ മാത്രം ഒതുങ്ങുന്നില്ല. അതിനാൽ വിശാലമായ അർത്ഥം പ്രധാന പാഠത്തിലും കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമഭാഷയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനം ഒഴിവാക്കി.
