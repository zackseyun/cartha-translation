translation:
  language: ml
  text: അവൻ യഹ്‌വെയുടെ സന്നിധിയിൽ തീമേൽ ധൂപം ഇടണം; ധൂപത്തിന്റെ പുകമേഘം സാക്ഷ്യത്തിന്മേലുള്ള പ്രായശ്ചിത്തമൂടി[a] മൂടേണ്ടതിനും അവൻ മരിക്കാതിരിക്കേണ്ടതിനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൃപാസനം.’ എബ്രായപദം പെട്ടകത്തിന്റെ മൂടിയെയാണ് സൂചിപ്പിക്കുന്നത്, പ്രത്യേകിച്ച് പ്രായശ്ചിത്താചാരങ്ങളിലെ അതിന്റെ പങ്കുമായി ബന്ധപ്പെട്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: ഇടണം
  rationale: ആചാരനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ ക്രിയ നിർബന്ധാത്മകമായ നിർദേശമാണ്; ആധുനിക മലയാളത്തിൽ ‘ഇടണം’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַקְּטֹרֶת
  choice: ധൂപം
  rationale: വിശുദ്ധമന്ദിരാചാരത്തിൽ ഉപയോഗിക്കുന്ന സുഗന്ധധൂപത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ ഉപയോഗത്തിലും ‘ധൂപം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עַל הָאֵשׁ
  choice: തീയുടെമേൽ
  rationale: ധൂപം കത്തുന്ന തീയുടെയോ തീക്കനലുകളുടെയോ മേൽ ഇടുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ദൈവസാന്നിധ്യത്തിലെ ആചാരപരമായ സമീപ്യതയെ മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְכִסָּה
  choice: അപ്പോൾ ... മൂടും
  rationale: എബ്രായ വാക്യശൃംഖലയിലെ ഫലബന്ധം നിലനിർത്തുന്നു; തുടർന്ന് വരുന്ന മരണനിവാരണവാക്യം ഉദ്ദേശ്യവും ഫലവും വ്യക്തമാക്കുന്നു.
- source_word: עֲנַן הַקְּטֹרֶת
  choice: ധൂപത്തിന്റെ മേഘം
  rationale: എബ്രായ ഘടനയും മേഘത്തിന്റെ ദൃശ്യരൂപകവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: הַכַּפֹּרֶת
  choice: പ്രായശ്ചിത്തമൂടി
  rationale: പെട്ടകത്തിന്റെ മൂടിയെയും പ്രായശ്ചിത്താചാരത്തിലെ അതിന്റെ പങ്കിനെയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; പരമ്പരാഗതമായ ‘കൃപാസനം’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: സാക്ഷ്യത്തിന്റെ മുകളിലുള്ള
  rationale: ‘സാക്ഷ്യം’ എന്ന എബ്രായ പദത്തിന്റെ സംക്ഷിപ്തതയും സന്ദർഭപരമായ അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു; പലകകളെന്ന വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וְלֹא יָמוּת
  choice: അങ്ങനെ അവൻ മരിക്കുകയില്ല
  rationale: ധൂപമേഘം മൂടുന്നതുമായി ബന്ധപ്പെട്ട സംരക്ഷക ഫലം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അതേസമയം കാരണം, ഉദ്ദേശ്യം, ഫലം എന്നിവയിൽ എബ്രായത്തിലുള്ള ചെറിയ തുറന്ന നില പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
theological_decisions:
- issue: വിശുദ്ധമന്ദിര-പ്രായശ്ചിത്ത പശ്ചാത്തലത്തിൽ הַכַּפֹּרֶת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പ്രായശ്ചിത്തമൂടി
  alternative: കൃപാസനം
  rationale: ഈ പദം പെട്ടകത്തിന്റെ മൂടിയെ സൂചിപ്പിക്കുകയും പ്രായശ്ചിത്താചാരവുമായി ബന്ധപ്പെട്ടിരിക്കുകയും ചെയ്യുന്നു. ‘പ്രായശ്ചിത്തമൂടി’ വസ്തുവിനെയും ആചാരപരമായ പ്രവർത്തനത്തെയും സുതാര്യമാക്കുന്നു; പരമ്പരാഗത പരിഭാഷ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: וְלֹא יָמוּת എന്ന അവസാനവാക്യത്തിന്റെ ബന്ധം
  choice: അങ്ങനെ അവൻ മരിക്കുകയില്ല
  alternative: അവൻ മരിക്കാതിരിക്കേണ്ടതിന്
  rationale: എബ്രായത്തിൽ ഇത് ഉദ്ദേശ്യമോ ഫലമോ ആയി വായിക്കാവുന്നതാണ്. ‘അങ്ങനെ’ എന്നത് ഫലബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുമ്പോഴും അതിനെ അതിയായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ആചാരഭാഷ ഉപയോഗിച്ചു. ‘സാക്ഷ്യം’ പോലുള്ള പ്രധാന എബ്രായ ആശയങ്ങൾ അനാവശ്യമായി വികസിപ്പിക്കാതെ നിലനിർത്തി; നീണ്ട ഒറ്റവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
