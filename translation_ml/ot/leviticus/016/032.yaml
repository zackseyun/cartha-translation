source:
  edition: WLC
  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: ml
  text: തന്റെ പിതാവിന്റെ സ്ഥാനത്ത് പുരോഹിതനായി ശുശ്രൂഷിക്കാൻ അഭിഷേകം ചെയ്യപ്പെടുകയും സ്ഥാനമേൽപ്പിക്കപ്പെടുകയും[a] ചെയ്ത പുരോഹിതൻ പ്രായശ്ചിത്തം നിർവഹിക്കണം; അവൻ ശണവസ്ത്രങ്ങളായ വിശുദ്ധവസ്ത്രങ്ങൾ ധരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവന്റെ കൈ നിറയ്ക്കുക.’ പുരോഹിതശുശ്രൂഷയിൽ ഒരാളെ ഔദ്യോഗികമായി സ്ഥാനമേൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: പ്രായശ്ചിത്തം നിർവഹിക്കണം
  rationale: പുരോഹിതാചാരസന്ദർഭത്തിൽ כפר നിർദിഷ്ടമായ പ്രായശ്ചിത്തശുശ്രൂഷ നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ക്രിയാവിധിയുടെ ആചാരപരമായ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: എബ്രായപദം സ്വതവേ ‘പുരോഹിതൻ’ എന്നാണ്; സന്ദർഭം മഹാപുരോഹിതന്റെ പിൻഗാമിയെ സൂചിപ്പിച്ചാലും മൂലപാഠത്തിൽ ഇല്ലാത്ത പദവി ചേർത്തിട്ടില്ല.
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: അഭിഷേകം ചെയ്യപ്പെടുകയും
  rationale: ബന്ധവാക്യം നിയമാനുസൃതമായി അഭിഷേകം ലഭിച്ച പുരോഹിതനെ തിരിച്ചറിയുന്നു. കർത്താവ് വ്യക്തമാക്കപ്പെടാത്തതിനാൽ സ്വാഭാവികമായ കർമണിപ്രയോഗം സ്വീകരിച്ചു.
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: സ്ഥാനമേൽപ്പിക്കപ്പെടുകയും[a]
  rationale: ‘അവന്റെ കൈ നിറയ്ക്കുക’ എന്ന എബ്രായപ്രയോഗം പുരോഹിതസ്ഥാനത്ത് ഔദ്യോഗികമായി സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി, പദാനുപദരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: לְכַהֵן
  choice: പുരോഹിതനായി ശുശ്രൂഷിക്കാൻ
  rationale: പുരോഹിതസ്ഥാനത്തിന്റെ പ്രവർത്തനവും സേവനവും സൂചിപ്പിക്കുന്ന ക്രിയാത്മക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: תַּחַת אָבִיו
  choice: തന്റെ പിതാവിന്റെ സ്ഥാനത്ത്
  rationale: പിതാവിനെത്തുടർന്ന് അതേ ഔദ്യോഗികസ്ഥാനത്ത് വരുന്നതെന്ന പകരംവഹിക്കൽ/പിൻഗാമിത്വ അർഥം നിലനിർത്തുന്നു.
- source_word: וְלָבַשׁ
  choice: ധരിക്കണം
  rationale: ആചാരത്തിനായി വസ്ത്രം അണിയുക എന്ന നിർബന്ധിത പ്രവൃത്തി സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: בִּגְדֵי הַבָּד
  choice: ചണവസ്ത്രങ്ങൾ
  rationale: പുരോഹിതവസ്ത്രസന്ദർഭത്തിലെ בד എന്നത് ചണനൂൽകൊണ്ടുള്ള വസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധവസ്ത്രങ്ങളായ
  rationale: രണ്ടാമത്തെ പദസമുച്ചയം ചണവസ്ത്രങ്ങളെ വിശുദ്ധശുശ്രൂഷയ്ക്കായി വേർതിരിച്ചവയായി പുനർവിശദീകരിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ വിശേഷണസമാസമായി ചേർത്തു.
theological_decisions:
- issue: הַכֹּהֵן എന്നത് ‘പുരോഹിതൻ’ എന്നോ ‘മഹാപുരോഹിതൻ’ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: പുരോഹിതൻ
  alternative: മഹാപുരോഹിതൻ
  rationale: സന്ദർഭം മഹാപുരോഹിതന്റെ പിൻഗാമിയെ ഉദ്ദേശിക്കുന്നുവെങ്കിലും മൂലപാഠം ‘പുരോഹിതൻ’ എന്നു പറഞ്ഞ് അഭിഷേകം, സ്ഥാനാരോഹണം, പിതാവിന്റെ സ്ഥാനത്തെ പിൻഗാമിത്വം എന്നിവകൊണ്ട് അവനെ വിശേഷിപ്പിക്കുന്നു. അതിനാൽ വ്യാഖ്യാനാത്മക പദവി ചേർത്തിട്ടില്ല.
- issue: ‘കൈ നിറയ്ക്കുക’ എന്ന സ്ഥാനാരോഹണപ്രയോഗം എങ്ങനെ നൽകണം
  choice: സ്ഥാനമേൽപ്പിക്കപ്പെടുക
  alternative: കൈ നിറയ്ക്കപ്പെടുക
  rationale: പദാനുപദരൂപം സാധാരണ മലയാളവായനക്കാർക്ക് അർഥശൂന്യമോ തെറ്റിദ്ധാരണാജനകമോ ആകാം. ആചാരപരമായ ഔദ്യോഗികസ്ഥാപനത്തിന്റെ അർഥം മുഖ്യപാഠത്തിൽ നൽകി, മൂലഭാഷയിലെ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘പ്രായശ്ചിത്തം,’ ‘അഭിഷേകം,’ ‘പുരോഹിതൻ’ എന്നീ സ്ഥാപിതമായ ആരാധനാപദങ്ങൾ നിലനിർത്തി. എബ്രായത്തിലെ വസ്ത്രപദങ്ങളുടെ പുനരുക്തി മലയാളത്തിൽ ‘വിശുദ്ധവസ്ത്രങ്ങളായ ചണവസ്ത്രങ്ങൾ’ എന്ന സ്വാഭാവിക അനുബന്ധഘടനയിൽ സംരക്ഷിച്ചു.
