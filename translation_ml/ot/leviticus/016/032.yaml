- from: തന്റെ പിതാവിന്റെ സ്ഥാനത്ത് പുരോഹിതനായി ശുശ്രൂഷിക്കാൻ അഭിഷേകം ചെയ്യപ്പെടുകയും സ്ഥാനമേൽപ്പിക്കപ്പെടുകയും[a] ചെയ്ത പുരോഹിതൻ പ്രായശ്ചിത്തം നിർവഹിക്കണം; അവൻ വിശുദ്ധവസ്ത്രങ്ങളായ ചണവസ്ത്രങ്ങൾ ധരിക്കണം.
  to: തന്റെ പിതാവിന്റെ സ്ഥാനത്ത് പുരോഹിതനായി ശുശ്രൂഷിക്കാൻ അഭിഷേകം ചെയ്യപ്പെടുകയും സ്ഥാനമേൽപ്പിക്കപ്പെടുകയും[a] ചെയ്ത പുരോഹിതൻ പ്രായശ്ചിത്തം നിർവഹിക്കണം; അവൻ ശണവസ്ത്രങ്ങളായ വിശുദ്ധവസ്ത്രങ്ങൾ ധരിക്കണം.
