id: LEV.16.7
reference: Leviticus 16:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַ֖ח אֶת שְׁנֵ֣י הַ/שְּׂעִירִ֑ם וְ/הֶעֱמִ֤יד אֹתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: ml
  text: പിന്നെ അവൻ ആ രണ്ട് ആൺകോലാടുകളെയും എടുത്ത് സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ യഹോവയുടെ സന്നിധിയിൽ നിർത്തണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: പിന്നെ അവൻ ... കൊണ്ടുവന്ന്
  rationale: ചടങ്ങുസംബന്ധമായ നിർദേശങ്ങളുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന വാവ് ചേർന്ന ക്രിയാരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമാനുക്രമ പ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: ആ രണ്ട് ആൺകോലാടുകളെയും
  rationale: שָׂעִיר ഇവിടെ ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തിൽ നിർവചിക്കപ്പെട്ട ജോഡിയായതിനാൽ നിർദേശകമായ ‘ആ’ ചേർത്തു.
- source_word: וְהֶעֱמִיד אֹתָם
  choice: നിർത്തണം
  rationale: עמד എന്നതിന്റെ ഹിഫീൽ രൂപം ‘നിൽക്കുമാറാക്കുക/നിർത്തുക’ എന്ന ഭൗതിക സ്ഥാനനിർണയാർഥം വഹിക്കുന്നു; ആചാരനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം ‘ണം’കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിലെ സാന്നിധ്യപരവും സ്ഥാനപരവുമായ അർഥം ‘സന്നിധിയിൽ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ദൈവനാമം ലിപ്യന്തരിച്ചു.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: פֶּתַח എന്നത് പ്രവേശനസ്ഥലം; אֹהֶל מוֹעֵד എന്ന സ്ഥിരനാമത്തിന് മലയാളത്തിൽ പരിചിതവും ഉറവിടാർഥത്തോട് ചേർന്നതുമായ ‘സമാഗമകൂടാരം’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആചാരനിർദേശ ശൈലി. ക്രിയകളെ വേർതിരിച്ച് കൃത്രിമമാക്കാതെ ‘കൊണ്ടുവന്ന് ... നിർത്തണം’ എന്ന സ്വാഭാവിക മലയാളഘടന ഉപയോഗിച്ചു.
