- from: പിന്നെ അവൻ ആ രണ്ട് ആൺകോലാടുകളെയും കൊണ്ടുവന്ന് സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ യഹോവയുടെ സന്നിധിയിൽ നിർത്തണം.
  to: പിന്നെ അവൻ ആ രണ്ട് ആൺകോലാടുകളെയും എടുത്ത് സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ യഹോവയുടെ സന്നിധിയിൽ നിർത്തണം.
  rationale: 'The revision replaces ''കൊണ്ടുവന്ന്'' with ''എടുത്ത്'' to render וְלָקַח directly, while retaining the source’s procedural sequence and physical-placement sense in natural modern Malayalam. No footnote is needed: the verse contains no unresolved ambiguity requiring annotation.'
