id: LEV.16.6
reference: Leviticus 16:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרִ֧יב אַהֲרֹ֛ן אֶת פַּ֥ר הַ/חַטָּ֖את אֲשֶׁר ל֑/וֹ וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: ml
  text: അഹരോൻ തനിക്കുവേണ്ടിയുള്ള പാപയാഗത്തിന്റെ കാളയെ[a] ഹാജരാക്കണം; തനിക്കുവേണ്ടിയും തന്റെ കുടുംബത്തിനുവേണ്ടിയും പ്രായശ്ചിത്തം നടത്തണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശുദ്ധീകരണയാഗത്തിന്റെ കാളയെ.’ എബ്രായപദമായ חַטָּאת പാപയാഗത്തെ സൂചിപ്പിക്കാം; ചില സന്ദർഭങ്ങളിൽ അത് ആചാരപരമായ ശുദ്ധീകരണത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: ഹാജരാക്കി
  rationale: യാഗസന്ദർഭത്തിൽ הקריב എന്നത് യഹോവയുടെ സന്നിധിയിൽ യാഗവസ്തുവിനെ കൊണ്ടുവന്ന് ഹാജരാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. യാഗം മുഴുവനായി അർപ്പിച്ചുകഴിഞ്ഞുവെന്ന അർഥം മുൻകൂട്ടി നൽകാതെ ആചാരപരമായ പ്രവൃത്തിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: פַּר
  choice: കാളയെ
  rationale: פַּר പ്രായപൂർത്തിയായ ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘കാള’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַחַטָּאת
  choice: പാപയാഗത്തിന്റെ
  rationale: ഇവിടെ חַטָּאת അമൂർത്തമായ പാപത്തെയല്ല, യാഗക്രമത്തിലെ ഒരു യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പരിചിതമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, ശുദ്ധീകരണപരമായ ഊന്നൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר לוֹ
  choice: തനിക്കുവേണ്ടിയുള്ള
  rationale: ചുറ്റുമുള്ള വാക്യങ്ങളിലെ ജനത്തിനുവേണ്ടിയുള്ള യാഗങ്ങളിൽനിന്ന് വേർതിരിച്ച്, ഇത് അഹരോന്റെ സ്വന്തം ആവശ്യത്തിനായി നിശ്ചയിച്ച യാഗമാണെന്ന് ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: וְכִפֶּר
  choice: പ്രായശ്ചിത്തം കഴിക്കണം
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ כפר എന്ന ക്രിയയുടെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ നൽകുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: בַּעֲדוֹ
  choice: തനിക്കുവേണ്ടിയും
  rationale: בְּעַד എന്നത് ഒരാളുടെ നിമിത്തം അല്ലെങ്കിൽ അയാൾക്കുവേണ്ടി എന്ന ഗുണഭോക്തൃ അർഥം നൽകുന്നു.
- source_word: וּבְעַד בֵּיתוֹ
  choice: തന്റെ കുടുംബത്തിനുവേണ്ടിയും
  rationale: ഇവിടെ בַּיִת ഒരു കെട്ടിടത്തേക്കാൾ അഹരോന്റെ കുടുംബത്തെയോ വീട്ടുകാരെയോ സൂചിപ്പിക്കുന്നു; ‘കുടുംബം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
theological_decisions:
- issue: യാഗനിയമത്തിൽ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഉടൻ വരുന്ന സന്ദർഭത്തിൽ ഈ നാമം പാപം എന്ന അമൂർത്ത ആശയത്തെയല്ല, ഒരു യാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘പാപയാഗം’ പരിചിതവും സുതാര്യവുമായ പദമാണ്; ആചാരപരമായ ശുദ്ധീകരണ ഊന്നൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: בֵּיתוֹ എന്നതിന്റെ വ്യാപ്തി
  choice: തന്റെ കുടുംബം
  alternative: തന്റെ വീട് / വീട്ടുകാർ
  rationale: സന്ദർഭത്തിൽ ഇത് അഹരോന്റെ വാസസ്ഥലമായ കെട്ടിടത്തെയല്ല, അവന്റെ കുടുംബഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക ദൈവശാസ്ത്ര നിഗമനങ്ങളൊന്നും ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. എബ്രായത്തിലെ പ്രവൃത്തിക്രമം നിലനിർത്താൻ ‘ഹാജരാക്കി ... കഴിക്കണം’ എന്ന ഘടന ഉപയോഗിച്ചു; ‘കുടുംബം’ സാധാരണ വായനക്കാർക്ക് ‘ഭവനം’ എന്ന ഭൗതിക അർഥത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
