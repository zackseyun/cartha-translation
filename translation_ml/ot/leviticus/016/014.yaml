source:
  edition: WLC
  text: וְ/לָקַח֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/הִזָּ֧ה בְ/אֶצְבָּע֛/וֹ עַל פְּנֵ֥י הַ/כַּפֹּ֖רֶת קֵ֑דְמָ/ה וְ/לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת יַזֶּ֧ה שֶֽׁבַע פְּעָמִ֛ים מִן הַ/דָּ֖ם בְּ/אֶצְבָּעֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: ml
  text: പിന്നെ അവൻ കാളയുടെ രക്തത്തിൽനിന്ന് അല്പം എടുത്ത്, തന്റെ വിരൽകൊണ്ട് കരുണാസനത്തിന്റെ[a] കിഴക്കുവശത്തെ ഉപരിതലത്തിൽ തളിക്കണം; കരുണാസനത്തിന്റെ മുമ്പിൽ അവൻ തന്റെ വിരൽകൊണ്ട് രക്തത്തിൽനിന്ന് അല്പം ഏഴു പ്രാവശ്യം തളിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രായശ്ചിത്തമൂടി.’ എബ്രായപദമായ കപ്പോരെത്ത് നിയമപെട്ടകത്തിന്റെ മൂടിയെയാണ് സൂചിപ്പിക്കുന്നത്; അത് പ്രായശ്ചിത്തവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: പിന്നെ അവൻ ... എടുത്ത്
  rationale: യാഗക്രമത്തിലെ തുടർച്ചയായ നിർദേശം സൂചിപ്പിക്കുന്നതിനാൽ ബന്ധകത്തോടുകൂടിയ ക്രിയയെ സ്വാഭാവികമായ നടപടിക്രമഭാഷയിൽ വിവർത്തനം ചെയ്തു.
- source_word: מִדַּם הַפָּר
  choice: കാളയുടെ രക്തത്തിൽ കുറെ
  rationale: מִן ഇവിടെ ഭാഗിക അർഥമുള്ളതിനാൽ മുഴുവൻ രക്തമല്ല, അതിൽ ഒരു അളവാണ് എടുക്കുന്നതെന്ന് വ്യക്തമാക്കി.
- source_word: וְהִזָּה
  choice: തളിക്കണം
  rationale: പുരോഹിതാചാരസന്ദർഭത്തിൽ נזה രക്തം തളിക്കുന്ന പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; നിർദേശാത്മക സ്വഭാവം ‘-ണം’ രൂപത്തിൽ നിലനിർത്തി.
- source_word: בְאֶצְבָּעוֹ
  choice: വിരൽകൊണ്ട്
  rationale: בְ ഉപകരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആചാരത്തിൽ രക്തം പ്രയോഗിക്കുന്ന മാർഗം വ്യക്തമായി നൽകി.
- source_word: עַל פְּנֵי הַכַּפֹּרֶת קֵדְמָה
  choice: കരുണാസനത്തിന്റെ കിഴക്കോട്ടുള്ള മുൻഭാഗത്ത്
  rationale: פְּנֵי എന്ന സ്ഥലസൂചനയും קֵדְמָה എന്ന കിഴക്കോട്ടുള്ള ദിശയും ചേർത്ത് സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: הַכַּפֹּרֶת
  choice: കരുണാസനം
  rationale: നിയമപെട്ടകത്തിന്റെ പ്രത്യേക മൂടിയെ സൂചിപ്പിക്കുന്ന പരിചിതമായ ആരാധനാപദം സ്വീകരിച്ചു; വസ്തുവിന്റെ ഭൗതികവും പ്രായശ്ചിത്തബന്ധിതവുമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: കരുണാസനത്തിന്റെ മുമ്പിലും
  rationale: ആദ്യത്തെ തളിക്കൽ കരുണാസനത്തിന്റെ ഭാഗത്തും രണ്ടാമത്തേത് അതിന്റെ മുമ്പിലുമാണെന്ന സ്ഥലവ്യത്യാസം നിലനിർത്തി.
- source_word: יַזֶּה שֶׁבַע פְּעָמִים מִן הַדָּם
  choice: രക്തത്തിൽ കുറെ ... ഏഴു പ്രാവശ്യം തളിക്കണം
  rationale: രക്തത്തിന്റെ ഒരു ഭാഗം ഉപയോഗിക്കുന്നതും ആചാരപരമായി പ്രധാനമായ ഏഴ് ആവർത്തനങ്ങളും വ്യക്തമായി സംരക്ഷിച്ചു.
theological_decisions:
- issue: הַכַּפֹּרֶת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കരുണാസനം
  alternative: പ്രായശ്ചിത്തമൂടി
  rationale: ഈ പദം നിയമപെട്ടകത്തിന്റെ മൂടിയെയും പ്രായശ്ചിത്തവുമായി ബന്ധപ്പെട്ട വിശുദ്ധസ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു. പരിചിതമായ ‘കരുണാസനം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചെങ്കിലും, പദത്തിന്റെ കൂടുതൽ ഭൗതികമായ വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകി; ഇതുവഴി ഒരേയൊരു വ്യാഖ്യാനം നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശാത്മക ശൈലി ഉപയോഗിച്ചു. ആചാരക്രമത്തിലെ സ്ഥലവ്യത്യാസവും രക്തത്തിന്റെ ഭാഗിക ഉപയോഗവും ഏഴ് തവണ എന്ന എണ്ണവും വ്യക്തമായി നിലനിർത്തി.
