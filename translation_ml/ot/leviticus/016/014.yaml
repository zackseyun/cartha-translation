revisions:
- from: പിന്നെ അവൻ കാളയുടെ രക്തത്തിൽ കുറെ എടുത്ത് വിരൽകൊണ്ട് കരുണാസനത്തിന്റെ[a] കിഴക്കോട്ടുള്ള മുൻഭാഗത്ത് തളിക്കണം; കരുണാസനത്തിന്റെ മുമ്പിലും രക്തത്തിൽ കുറെ വിരൽകൊണ്ട് ഏഴു പ്രാവശ്യം തളിക്കണം.
  to: പിന്നെ അവൻ കാളയുടെ രക്തത്തിൽനിന്ന് അല്പം എടുത്ത്, തന്റെ വിരൽകൊണ്ട് കരുണാസനത്തിന്റെ[a] കിഴക്കുവശത്തെ ഉപരിതലത്തിൽ തളിക്കണം; കരുണാസനത്തിന്റെ മുമ്പിൽ അവൻ തന്റെ വിരൽകൊണ്ട് രക്തത്തിൽനിന്ന് അല്പം ഏഴു പ്രാവശ്യം തളിക്കണം.
  rationale: The revision corrects the Malayalam expression of the Hebrew partitive מִן, more closely represents the eastern surface indicated by עַל־פְּנֵי הַכַּפֹּרֶת קֵדְמָה, and refines the lexical footnote. It preserves the ritual sequence, the finger as instrument, the distinct location before the kapporet, and the seven repetitions.
