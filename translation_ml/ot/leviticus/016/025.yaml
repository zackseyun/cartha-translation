source:
  edition: WLC
  text: וְ/אֵ֛ת חֵ֥לֶב הַֽ/חַטָּ֖את יַקְטִ֥יר הַ/מִּזְבֵּֽחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/025.yaml
  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: ml
  text: പാപപരിഹാരയാഗത്തിന്റെ[a] കൊഴുപ്പ് അവൻ യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുദ്ധീകരണയാഗം.” എബ്രായപദം പാപത്തിൽനിന്നോ അശുദ്ധിയിൽനിന്നോ ശുദ്ധീകരിക്കുന്നതിനുള്ള യാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: '[വാക്യക്രമത്തിലൂടെ ബന്ധിപ്പിച്ചു; പ്രത്യേകമായി ‘പിന്നെ’ ചേർത്തില്ല]'
  rationale: וְ മുൻചടങ്ങിനോടുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ ആ ബന്ധം നിലനിൽക്കുന്നതിനാൽ അധിക സംയോജകപദം നിർബന്ധമല്ല. אֵת എന്ന കർമസൂചകത്തിന് പ്രത്യേകം പരിഭാഷ ആവശ്യമില്ല.
- source_word: חֵלֶב
  choice: കൊഴുപ്പ്
  rationale: യാഗത്തിനായി വേർതിരിച്ച മേദസ്സിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘കൊഴുപ്പ്’ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പരിഭാഷയാണ്.
- source_word: הַחַטָּאת
  choice: പാപപരിഹാരയാഗം
  rationale: യാഗനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ חַטָּאת പാപവുമായി ബന്ധപ്പെട്ട പരിഹാരയാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ശുദ്ധീകരണയാഗം’ എന്ന ആചാരപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יַקְטִיר
  choice: ദഹിപ്പിക്കണം
  rationale: കെടാർ എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗപീഠത്തിൽ അർപ്പണവസ്തു പുകയായി ഉയരുന്നവിധം കത്തിക്കുന്ന ആചാരപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ദഹിപ്പിക്കണം’ മലയാളത്തിൽ സ്വാഭാവികവും നിർദേശാത്മക ഭാവം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ദിശാസൂചകപ്രത്യയം അക്ഷരാർഥത്തിൽ ‘യാഗപീഠത്തിലേക്ക്’ എന്നു വരാമെങ്കിലും, ഇവിടെ ദഹിപ്പിക്കൽ നടക്കുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നതിനാൽ ‘യാഗപീഠത്തിന്മേൽ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: യാഗനിയമത്തിൽ חַטָּאת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാപപരിഹാരയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ഈ എബ്രായപദം പാപത്തിനായുള്ള യാഗത്തെയും പാപമോ അശുദ്ധിയോ നീക്കി ശുദ്ധീകരിക്കുന്ന യാഗപ്രവർത്തനത്തെയും സൂചിപ്പിക്കാം. പ്രധാനവാചകത്തിൽ പരിചിതവും വ്യക്തവുമായ ‘പാപപരിഹാരയാഗം’ ഉപയോഗിച്ച്, യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആചാരനിയമ ശൈലി സ്വീകരിച്ചു. നിർദേശാത്മക യִקטോൽ രൂപം ‘ദഹിപ്പിക്കണം’ എന്നു നൽകി.
