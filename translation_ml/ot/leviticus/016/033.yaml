  naturalness: വാചകം പൊതുവേ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. എന്നാൽ ‘യാഗപീഠത്തിനുംവേണ്ടി’, ‘ജനത്തിനും[b]വേണ്ടിയും’ എന്നിവയിലെ ചേർത്തെഴുത്തും അടിക്കുറിപ്പുചിഹ്നത്തിന്റെ സ്ഥാനവും വായനയെ തടസ്സപ്പെടുത്തുന്നു. ‘സകല ജനം’ എന്ന വേർതിരിച്ച രൂപം കൂടുതൽ സ്വാഭാവികമാണ്.
