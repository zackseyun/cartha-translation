id: LEV.16.33
reference: Leviticus 16:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: ml
  text: അങ്ങനെ അവൻ വിശുദ്ധമന്ദിരത്തിനും[a] സമാഗമകൂടാരത്തിനും യാഗപീഠത്തിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണം; പുരോഹിതന്മാർക്കും സഭയിലെ സകല ജനത്തിനുവേണ്ടിയും[b] അവൻ പ്രായശ്ചിത്തം ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശുദ്ധമന്ദിരത്തിനുവേണ്ടി ശുദ്ധീകരണകർമം നടത്തണം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ ആരാധനാകർമസന്ദർഭത്തിൽ כפר എന്ന എബ്രായക്രിയ പ്രായശ്ചിത്തത്തോടൊപ്പം അശുദ്ധി നീക്കുന്നതിനും ഊന്നൽ നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സഭയിലെ സകല ജനം’ എന്നത് ‘സമൂഹത്തിലെ സകല ജനം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: പ്രായശ്ചിത്തം ചെയ്യണം
  rationale: ലേവ്യപുസ്തകത്തിലെ כפר എന്ന ആവർത്തിത ക്രിയയുടെ സാങ്കേതിക ആരാധനാകർമ അർഥം നിലനിർത്തുന്നു. വിശുദ്ധസ്ഥാനങ്ങൾക്കും വ്യക്തികൾക്കും ഒരേ പ്രയോഗം ഉപയോഗിച്ച് മൂലപാഠത്തിലെ കർമപരമായ ഐക്യവും ആവർത്തനവും സംരക്ഷിക്കുന്നു; അതേസമയം ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം വിവർത്തനത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരം
  rationale: ‘വിശുദ്ധമായ മന്ദിരം’ എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു. ഇവിടെ എബ്രായപദം നിർബന്ധമായി ആവശ്യപ്പെടാത്ത ‘അതിവിശുദ്ധസ്ഥലം’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ ആരാധനാകൂടാരത്തിനുള്ള പരിചിതവും സുതാര്യവുമായ മലയാളപദം; കൂടാരം എന്ന മൂലരൂപവും കൂടിവരുന്ന പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ആരാധനാകർമസന്ദർഭത്തിൽ altar എന്ന ആശയത്തിനുള്ള സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപ്രയോഗം.
- source_word: עַל
  choice: —ക്കുംവേണ്ടി
  rationale: כפר എന്ന ക്രിയയോടൊപ്പം വരുന്ന עַל എന്ന ബന്ധത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ളതും സാധാരണവുമായ മലയാളരൂപം.
- source_word: כָּל עַם הַקָּהָל
  choice: സഭയിലെ സകലജനം
  rationale: കൂടിവന്ന സമൂഹത്തിൽ ഉൾപ്പെട്ട മുഴുവൻ ജനത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ സാമൂഹികവും സമഗ്രവുമായ ഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിശുദ്ധവസ്തുക്കൾക്കും വ്യക്തികൾക്കും ബാധകമായ כפר എന്ന പ്രായശ്ചിത്തഭാഷയുടെ വ്യാപ്തി
  choice: മന്ദിരം, കൂടാരം, യാഗപീഠം, പുരോഹിതന്മാർ, ജനം എന്നിവയ്ക്കെല്ലാം ‘പ്രായശ്ചിത്തം ചെയ്യുക’ എന്ന ഒരേ പ്രയോഗം ഉപയോഗിച്ചു.
  alternative: വിശുദ്ധസ്ഥാനങ്ങൾക്ക് ‘ശുദ്ധീകരിക്കുക’ എന്നും വ്യക്തികൾക്ക് ‘പ്രായശ്ചിത്തം ചെയ്യുക’ എന്നും വ്യത്യസ്തമായി നൽകുക.
  rationale: മൂലപാഠം כפר എന്ന ക്രിയ മനപ്പൂർവം ആവർത്തിക്കുന്നു. ഒരേ മലയാളപ്രയോഗം ആ കർമത്തിന്റെ ഐക്യം നിലനിർത്തുകയും, ശുദ്ധീകരണം അതിന്റെ ഒരു വശമാണെങ്കിലും വിവർത്തനം തന്നെ രണ്ട് വ്യത്യസ്ത പ്രവർത്തനങ്ങളായി അതിനെ വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാകർമഭാഷ ഉപയോഗിച്ചു. ‘പ്രായശ്ചിത്തം ചെയ്യണം’ എന്ന ആവർത്തനം ശൈലിപരമായി ചുരുക്കാതെ മൂലപാഠത്തിലെ പ്രധാന ക്രിയയുടെ ആവർത്തനം സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ [b] ചിഹ്നം altar-നുശേഷം കാണുന്നുവെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് ‘people of the assembly’ എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ബന്ധപ്പെട്ട ജനപ്രയോഗത്തിനരികെ [b] സ്ഥാപിച്ചു.
