  rationale: അർഥത്തിലോ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയിലോ മാറ്റം വരുത്താതെ, മലയാളത്തിലെ ദത്തിവ്-‘വേണ്ടി’ പ്രയോഗം തിരുത്തുകയും [b] അടിക്കുറിപ്പുചിഹ്നം അതു വിശദീകരിക്കുന്ന നാമവാക്യത്തിനു ശേഷം സ്ഥാപിക്കുകയും ചെയ്തു. ‘സകല ജനം’ എന്ന രൂപം ആധുനിക വായനയിൽ കൂടുതൽ വ്യക്തമാണ്.
