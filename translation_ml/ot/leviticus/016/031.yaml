  - severity: low
    issue: Less idiomatic reflexive rendering of self-humbling
    rationale: ‘നിങ്ങളെത്തന്നെ താഴ്ത്തിക്കൊള്ളണം’ better conveys the reflexive idiom וְעִנִּיתֶם אֶת־נַפְשֹׁתֵיכֶם than the more abrupt ‘നിങ്ങളെത്തന്നെ താഴ്ത്തണം.’
  revised_text: അത് നിങ്ങൾക്കു പൂർണവിശ്രമ ശബ്ബത്താണ്. നിങ്ങൾ നിങ്ങളെത്തന്നെ താഴ്ത്തിക്കൊള്ളണം[a]. ഇത് എന്നേക്കുമുള്ള ചട്ടമാണ്.
