  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הִיא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם חֻקַּ֖ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: ml
  text: അത് നിങ്ങൾക്കു പൂർണവിശ്രമ ശബ്ബത്താണ്. നിങ്ങൾ നിങ്ങളെത്തന്നെ താഴ്ത്തിക്കൊള്ളണം[a]. ഇത് എന്നേക്കുമുള്ള ചട്ടമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ നിങ്ങളെത്തന്നെ കഷ്ടപ്പെടുത്തണം”; ഉപവാസവും സ്വയംനിഷേധവും ഇതിൽ ഉൾപ്പെടുന്നതായി പാരമ്പര്യമായി മനസ്സിലാക്കിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת
  choice: ശബ്ബത്ത്
  rationale: തോറായിലെ സ്ഥിരമായ ആരാധനാ-ദൈവശാസ്ത്ര സംജ്ഞയായതിനാൽ പൊതുവായ ‘വിശ്രമദിവസം’ എന്നതിനു പകരം ‘ശബ്ബത്ത്’ നിലനിർത്തി.
- source_word: שַׁבָּתוֹן
  choice: സമ്പൂർണ വിശ്രമം
  rationale: שַׁבַּת שַׁבָּתוֹן എന്ന ഊന്നൽ നിറഞ്ഞ പ്രയോഗത്തിന്റെ പരിപൂർണ വിശ്രമം എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הִיא לָכֶם
  choice: അത് നിങ്ങൾക്കു ... ആണ്
  rationale: സമൂഹത്തോടു പറയുന്ന വിധേയവാക്യത്തിന്റെ അർഥവും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְעִנִּיתֶם
  choice: നിങ്ങൾ ... താഴ്ത്തണം
  rationale: പ്രായശ്ചിത്തദിനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ ക്രിയ ആത്മതാഴ്മയും സ്വയം നിഷേധിക്കലും ഉൾക്കൊള്ളുന്നു. ശാരീരിക പീഡനം മാത്രം സൂചിപ്പിക്കാതിരിക്കാനും എബ്രായത്തിന്റെ വിശാല അർഥം നിലനിർത്താനും ‘താഴ്ത്തണം’ തിരഞ്ഞെടുത്തു; കൂടുതൽ പദാനുസൃതമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: נַפְשֹׁתֵיכֶם
  choice: നിങ്ങളെത്തന്നെ
  rationale: ഇവിടെ נֶפֶשׁ പ്രത്യാവർത്തക പ്രയോഗത്തിന്റെ ഭാഗമാണ്; ‘നിങ്ങളുടെ ആത്മാക്കളെ’ എന്ന പദാനുസൃത വിവർത്തനത്തേക്കാൾ ‘നിങ്ങളെത്തന്നെ’ മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: എന്നേക്കുമുള്ള ചട്ടം
  rationale: നിയമപരമായ ഈ സ്ഥിരപ്രയോഗത്തിലെ ദീർഘകാല ബാധകത വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: പ്രായശ്ചിത്തദിനത്തിലെ സ്വയം നിഷേധിക്കാനുള്ള കല്പനയുടെ അർഥം
  choice: പ്രധാന പാഠത്തിൽ ‘നിങ്ങൾ നിങ്ങളെത്തന്നെ താഴ്ത്തണം’ എന്നു പൊതുവായ അർഥത്തിൽ നൽകി.
  alternative: ‘നിങ്ങൾ നിങ്ങളെത്തന്നെ കഷ്ടപ്പെടുത്തണം’ അല്ലെങ്കിൽ ‘നിങ്ങൾ ഉപവസിക്കണം’.
  rationale: എബ്രായപാഠത്തിലെ ענה + נפשׁ എന്ന പ്രയോഗം ഉപവാസം ഉൾക്കൊള്ളുന്നതായി ചരിത്രപരമായി മനസ്സിലാക്കിയിട്ടുണ്ടെങ്കിലും അത് ഉപവാസത്തിനുള്ള നേരിട്ടുള്ള ക്രിയയല്ല. അതിനാൽ പ്രധാന പാഠത്തിൽ വിശാലമായ അർഥം നിലനിർത്തുകയും പദാനുസൃതമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാ ശൈലി. ‘ശബ്ബത്ത്’ എന്ന സ്ഥിരസംജ്ഞ നിലനിർത്തി; എബ്രായത്തിലെ ആവർത്തന ഊന്നൽ ‘സമ്പൂർണ വിശ്രമം’ എന്നു സ്വാഭാവികമാക്കി.
