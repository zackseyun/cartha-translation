source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֶלְיָקִ֣ים בֶּן חִלְקִיָּ֣ה אֲשֶׁר עַל הַ֠/בַּיִת וְ/שֶׁבְנָ֨א הַ/סֹּפֵ֜ר וְ/יוֹאָ֨ח בֶּן אָסָ֧ף הַ/מַּזְכִּ֛יר אֶל חִזְקִיָּ֖הוּ קְרוּעֵ֣י בְגָדִ֑ים וַ/יַּגִּ֣דוּ ל֔/וֹ דִּבְרֵ֖י רַב שָׁקֵֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: ml
  text: അപ്പോൾ കൊട്ടാരത്തിന്റെ ചുമതലക്കാരനായ ഹിൽക്കീയാവിന്റെ മകൻ എല്യാക്കീമും, ലേഖകനായ ശെബ്നായും, രേഖാധികാരിയായ ആസാഫിന്റെ മകൻ യോവാഹും വസ്ത്രങ്ങൾ കീറിയ നിലയിൽ ഹിസ്കീയാവിന്റെ അടുക്കൽ വന്ന് റബ്-ശാക്കേയുടെ[a] വാക്കുകൾ അദ്ദേഹത്തോട് അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘റബ്-ശാക്കേ’ എന്നത് ഒരു അസീറിയൻ ഔദ്യോഗിക പദവിയാണ്. ഇതിന് ‘മുഖ്യ പാനപാത്രവാഹകൻ’ എന്ന അർഥം ഉണ്ടായിരിക്കാം; രാജാവിന്റെ വക്താവായും ഈ ഉദ്യോഗസ്ഥൻ പ്രവർത്തിച്ചിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അപ്പോൾ ... വന്നു
  rationale: ആഖ്യാനത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്ന waw-നെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകി. ഹീബ്രുവിൽ ക്രിയ ഏകവചനത്തിലാണെങ്കിലും പിന്നാലെ സംയുക്ത കർത്താവ് വരുന്നതിനാൽ മലയാളത്തിൽ ആ മുഴുവൻ സംഘത്തെയും ഉൾക്കൊള്ളുന്ന പ്രയോഗമാണ് ഉപയോഗിച്ചത്.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: രാജഗൃഹത്തിന്റെ മേൽവിചാരകനായ
  rationale: ഇത് രാജകുടുംബത്തിന്റെയോ കൊട്ടാരഭരണത്തിന്റെയോ ചുമതലയുള്ള ഔദ്യോഗിക പദവിയാണ്. ‘രാജഗൃഹം’ എന്നത് സന്ദർഭം വ്യക്തമാക്കുകയും ‘മേൽവിചാരകൻ’ ഭരണചുമതല നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַסֹּפֵר
  choice: എഴുത്തുകാരൻ
  rationale: രാജസഭയിലെ എഴുത്ത്-ഭരണകാര്യ ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന പദം. ലളിതവും അർഥസുതാര്യവുമായ മലയാളരൂപം തെരഞ്ഞെടുത്തു; ‘കാര്യദർശി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കി.
- source_word: הַמַּזְכִּיר
  choice: രേഖാധികാരി
  rationale: രാജസഭയിലെ ഔദ്യോഗിക രേഖകളും ഓർമക്കുറിപ്പുകളും കൈകാര്യം ചെയ്യുന്ന പദവിയുടെ ഭരണപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: קְרוּעֵי בְגָדִים
  choice: വസ്ത്രങ്ങൾ കീറിയ നിലയിൽ
  rationale: ദുഃഖമോ ഞെട്ടലോ പ്രകടിപ്പിക്കുന്ന അവരുടെ ദൃശ്യാവസ്ഥയെ മൂലപാഠത്തോട് അടുത്തും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּגִּדוּ לוֹ
  choice: അദ്ദേഹത്തെ അറിയിച്ചു
  rationale: രാജാവിനോടുള്ള ഔദ്യോഗിക റിപ്പോർട്ടിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം നൽകി.
- source_word: דִּבְרֵי
  choice: വാക്കുകൾ
  rationale: അവർ കേട്ട പ്രസംഗം അതേപടി അറിയിക്കുന്ന ആശയം നിലനിർത്തുന്ന നേരിട്ടുള്ള വിവർത്തനം.
- source_word: רַב שָׁקֵה
  choice: റബ്-ശാക്കേ
  rationale: ഇത് അസീറിയൻ ഔദ്യോഗിക പദവിയായതിനാൽ വ്യക്തിനാമമായോ ‘മുഖ്യ പാനപാത്രവാഹകൻ’ പോലുള്ള ഒരു നിർദിഷ്ട പദവിയായോ ഉറപ്പിച്ച് വ്യാഖ്യാനിക്കാതെ ലിപ്യന്തരണം നിലനിർത്തി; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
