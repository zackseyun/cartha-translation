translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. രാജസഭാപദവികളുടെ ഔദ്യോഗിക ഭാവം നിലനിർത്തിയെങ്കിലും അത്യന്തം പുരാതനമോ അപരിചിതമോ ആയ പദങ്ങൾ ഒഴിവാക്കി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നം തെറ്റായി ‘ഹിൽക്കീയാവ്’ എന്ന പേരിനു ശേഷമാണെങ്കിലും, അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കത്തിനനുസരിച്ച് മലയാളത്തിൽ അത് ‘റബ്-ശാക്കേ’യ്ക്കു ശേഷമാണ് ചേർത്തത്.
