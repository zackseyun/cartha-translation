translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഭരണവർഷങ്ങളുടെ സമകാലികത വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ സജീവക്രിയയും തുടർന്ന് വരുന്ന കർമണിപ്രയോഗവും വേർതിരിച്ചുതന്നെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
