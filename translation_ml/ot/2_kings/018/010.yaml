  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
translation:
  language: ml
  text: മൂന്നു വർഷം തികഞ്ഞപ്പോൾ അവർ അതു പിടിച്ചെടുത്തു. ഹിസ്കീയാവിന്റെ ആറാം ഭരണവർഷത്തിൽ—അത് ഇസ്രായേൽ രാജാവായ ഹോശേയയുടെ ഒൻപതാം വർഷമായിരുന്നു—ശമര്യ പിടിക്കപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മൂന്നു വർഷത്തിനൊടുവിൽ അവർ അതു പിടിച്ചെടുത്തു.” എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “മൂന്നു വർഷത്തിന്റെ അവസാനം” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  choice: അവർ അതു പിടിച്ചെടുത്തു
  rationale: לכד എന്ന ക്രിയയുടെ കാൽ രൂപത്തിലുള്ള മൂന്നാം പുരുഷ ബഹുവചനവും സ്ത്രീലിംഗ ഏകവചന പ്രത്യയവും നിലനിർത്തുന്നു; ‘അത്’ മുൻസന്ദർഭത്തിലെ ശമര്യയെ സൂചിപ്പിക്കുന്നു.
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: മൂന്നു വർഷം തികഞ്ഞപ്പോൾ
  rationale: കാലയളവിനോടു ചേർന്ന מקצה എന്ന പ്രയോഗത്തിന്റെ ‘മൂന്നു വർഷത്തിന്റെ അവസാനം’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  choice: ഹിസ്കീയാവിന്റെ ഭരണത്തിന്റെ ആറാം വർഷത്തിൽ
  rationale: രാജാവിന്റെ വാഴ്ചയിലെ വർഷം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘ഭരണത്തിന്റെ’ ചേർത്തു.
- source_word: הִיא
  choice: അത് ... ആയിരുന്നു
  rationale: രണ്ടു രാജാക്കന്മാരുടെ ഭരണവർഷങ്ങളെ തമ്മിൽ ഒത്തുനോക്കുന്ന സർവനാമത്തിന്റെ സമാനാധികരണബന്ധം നിലനിർത്തുന്നു.
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ ഹോശേയയുടെ ഒൻപതാം വർഷം
  rationale: രണ്ടാമത്തെ ഭരണവർഷസൂചനയും ‘ഇസ്രായേൽരാജാവ്’ എന്ന വിശേഷണവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  choice: ശമര്യ പിടിക്കപ്പെട്ടു
  rationale: നിഫാൽ പൂർത്തിക്രിയയുടെ കർമണിപ്രയോഗവും ആദ്യവാക്യത്തിലെ לכד എന്ന ക്രിയയുടെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: שֹׁמְרוֹן
  choice: ശമര്യ
  rationale: നഗരനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾരൂപം ഉപയോഗിക്കുന്നു.
