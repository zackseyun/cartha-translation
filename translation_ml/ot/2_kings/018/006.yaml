  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
translation:
  language: ml
  text: അവൻ യഹ്‌വെയോടു പറ്റിച്ചേർന്നു[a]; അവനെ അനുഗമിക്കുന്നതിൽനിന്ന് അവൻ പിന്മാറിയില്ല; യഹ്‌വെ മോശയോടു കല്പിച്ച കല്പനകൾ അവൻ പാലിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന് “മുറുകെപ്പിടിച്ചു” അല്ലെങ്കിൽ “ചേർന്നുനിന്നു” എന്നും അർഥമാകാം; ഇവിടെ ഈ ക്രിയ ശക്തമായ ഉടമ്പടി വിശ്വസ്തതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדְבַּק
  choice: പറ്റിച്ചേർന്നു
  rationale: דבק എന്ന ക്രിയ ശക്തമായി ചേർന്നുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് ശാരീരികമായ ഒട്ടിച്ചേരലിനേക്കാൾ യഹ്‌വെയോടുള്ള ദൃഢമായ ഉടമ്പടി വിശ്വസ്തതയും അചഞ്ചലമായ അടുപ്പവും പ്രകടമാക്കുന്നു.
- source_word: בַּיהוָה
  choice: യഹ്‌വെയോടു
  rationale: בְ എന്ന ഉപസർഗം ഇവിടെ ചേർന്നുനിൽക്കലിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു. יְהוָה എന്ന ഉടമ്പടിനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לֹא סָר מֵאַחֲרָיו
  choice: അവനെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്മാറാതെ
  rationale: סור מן + אחרי എന്ന പ്രയോഗം ഒരാളെ പിന്തുടരുന്നതിൽനിന്നോ അയാളോടുള്ള കൂറിൽനിന്നോ മാറിപ്പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അനുഗമനത്തിന്റെയും വിശ്വസ്തതയുടെയും ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁמֹר
  choice: പാലിച്ചു
  rationale: കല്പനകളോടൊപ്പം שׁמר ഉപയോഗിക്കുമ്പോൾ അവ അനുസരിച്ച് ആചരിക്കുക എന്ന അർഥമാണ്; ‘പാലിച്ചു’ ആ നിയമപരവും ഉടമ്പടിപരവുമായ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִצְוֺתָיו
  choice: അവന്റെ കല്പനകൾ
  rationale: מִצְוָה ദൈവിക ആജ്ഞയെയോ കല്പനയെയോ സൂചിപ്പിക്കുന്നു; സർവനാമപ്രത്യയം യഹ്‌വെയെ പരാമർശിക്കുന്നതിനാൽ ‘അവന്റെ’ നിലനിർത്തി.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹ്‌വെ മോശയോടു കല്പിച്ച
  rationale: ഈ ബന്ധവാക്യം കല്പനകളെ മോശയ്ക്കു യഹ്‌വെ നൽകിയവയായി തിരിച്ചറിയുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യക്രമം പിന്തുടർന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: דבק എന്ന ക്രിയയിലെ ഉടമ്പടിവിശ്വസ്തത
  choice: പറ്റിച്ചേർന്നു
  alternative: മുറുകെപ്പിടിച്ചു; ചേർന്നുനിന്നു
  rationale: മൂലക്രിയയുടെ ശക്തമായ അടുപ്പവും വിശ്വസ്തതയും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അതിന്റെ ഉടമ്പടിപരമായ വ്യാപ്തി വ്യക്തമാക്കുന്നു, എന്നാൽ വാക്യത്തിൽ അതിനെ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പറ്റിച്ചേർന്നു’ എന്ന ശക്തമായ ക്രിയ മൂലപാഠത്തിലെ ദൃഢബന്ധം നിലനിർത്തുന്നു; ശേഷിക്കുന്ന വാക്യം സാധാരണ വായനക്കാർക്കു വ്യക്തമായിരിക്കാനായി സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ നൽകി.
