- from: ഹിസ്കീയാവ് നിങ്ങളെ യഹോവയിൽ ആശ്രയിക്കാൻ പ്രേരിപ്പിച്ചുകൊണ്ട്, ‘യഹോവ തീർച്ചയായും നമ്മെ രക്ഷിക്കും; ഈ നഗരം അശ്ശൂർരാജാവിന്റെ കൈയിൽ ഏല്പിക്കപ്പെടുകയില്ല’ എന്നു പറയാൻ ഇടവരുത്തരുത്.[a]
