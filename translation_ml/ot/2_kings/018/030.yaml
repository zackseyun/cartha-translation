source:
  edition: WLC
  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ אֶת הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
translation:
  language: ml
  text: ഹിസ്കീയാവ്, ‘യഹോവ തീർച്ചയായും[a] നമ്മെ രക്ഷിക്കും; ഈ നഗരം അശ്ശൂർ രാജാവിന്റെ കൈയിൽ ഏൽപ്പിക്കപ്പെടുകയില്ല,’ എന്നു പറഞ്ഞ് നിങ്ങളെ യഹോവയിൽ ആശ്രയിക്കാൻ പ്രേരിപ്പിക്കാൻ അനുവദിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘രക്ഷിച്ചുതന്നെ രക്ഷിക്കും’ എന്ന ഊന്നൽരൂപം; അതിന്റെ അർഥം ‘തീർച്ചയായും രക്ഷിക്കും’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  choice: നിങ്ങളെ ... ആശ്രയിക്കാൻ പ്രേരിപ്പിച്ചുകൊണ്ട് ... പറയാൻ ഇടവരുത്തരുത്
  rationale: בטח എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും നേരിട്ടുള്ള കർമപ്രത്യയവും ഹിസ്കീയാവ് ജനങ്ങളെ ആശ്രയിക്കാൻ പ്രേരിപ്പിക്കുന്ന കാരണാർഥം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ആ ആശയം നിലനിർത്തുന്നു.
- source_word: חִזְקִיָּהוּ
  choice: ഹിസ്കീയാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: אֶל יְהוָה
  choice: യഹോവയിൽ
  rationale: אֶל എന്നത് അക്ഷരാർഥത്തിൽ ‘നേരെ/അടുത്തേക്ക്’ എന്നായാലും בטח-യോടൊപ്പം ആശ്രയത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘യഹോവയിൽ ആശ്രയിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: തീർച്ചയായും നമ്മെ രക്ഷിക്കും
  rationale: ക്രിയാനാമത്തിന്റെ പരമരൂപവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ‘തീർച്ചയായും’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלֹא תִנָּתֵן
  choice: ഏല്പിക്കപ്പെടുകയില്ല
  rationale: נתן എന്നതിന്റെ നിഫാൽ രൂപം ശത്രുവിന്റെ അധികാരത്തിലേക്ക് കൈമാറപ്പെടുന്ന നിഷ്ക്രിയ ആശയം വഹിക്കുന്നു.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവിന്റെ കൈയിൽ
  rationale: അധികാരത്തെയും നിയന്ത്രണത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ ‘കൈയിൽ’ എന്ന പ്രയോഗത്തിന്റെ ദൃശ്യബലം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മലയാളത്തിലും വ്യക്തമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ, മലയാള വായനക്കാർക്ക് പരിചിതമായ വ്യക്തിനാമരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. നേരിട്ടുള്ള പ്രസംഗവും ‘കൈയിൽ’ എന്ന മൂലഭാഷാചിത്രവും സംരക്ഷിച്ചു; എബ്രായ ഊന്നൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
