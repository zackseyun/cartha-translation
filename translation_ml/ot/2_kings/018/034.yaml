reference: 2 Kings 18:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַיֵּה֩ אֱלֹהֵ֨י חֲמָ֜ת וְ/אַרְפָּ֗ד אַיֵּ֛ה אֱלֹהֵ֥י סְפַרְוַ֖יִם הֵנַ֣ע וְ/עִוָּ֑ה כִּֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
translation:
  language: ml
  text: ഹമാത്തിലെയും അർപ്പാദിലെയും ദേവന്മാർ എവിടെ? സെഫർവയീമിലെയും ഹേനയിലെയും ഇവ്വായിലെയും[a] ദേവന്മാർ എവിടെ? അവർ ശമര്യയെ എന്റെ കൈയിൽനിന്ന് വിടുവിച്ചോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ സ്ഥലനാമം ‘അവ്വാ’ എന്നും ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: എവിടെ?
  rationale: സ്ഥാനം ചോദിക്കുന്ന പദം. ദേവന്മാരെ പരിഹസിച്ചുകൊണ്ടുള്ള ആവർത്തിത ചോദ്യത്തിന്റെ മൂർച്ച നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי
  choice: ദേവന്മാർ
  rationale: ഇത് אֱלֹהִים എന്ന പദത്തിന്റെ ബഹുവചന construct രൂപമാണ്. മലയാളത്തിൽ സ്ഥലബന്ധം ‘-ലെയും’ എന്ന വിഭക്തിയിലൂടെ പ്രകടമാക്കി.
- source_word: חֲמָת וְאַרְפָּד
  choice: ഹമാത്തിലെയും അർപ്പാദിലെയും
  rationale: സ്ഥലനാമങ്ങൾ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; construct ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ സ്ഥലവിഭക്തിയാൽ വ്യക്തമാക്കി.
- source_word: סְפַרְוַיִם הֵנַע וְעִוָּה
  choice: സെഫർവയീമിലെയും ഹേനയിലെയും ഇവ്വായിലെയും
  rationale: മൂന്നും സ്ഥലനാമങ്ങളായി ലിപ്യന്തരിച്ചു. עִוָּה എന്ന പേരിന്റെ വായനാപാരമ്പര്യത്തിലെ വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: כִּי
  choice: —
  rationale: ഇവിടെ തുടർന്നുവരുന്ന വാക്യത്തെ പരിഹാസാത്മകമായ ചോദ്യമാക്കുന്ന പ്രയോഗമായി മനസ്സിലാക്കി; മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ ചോദ്യരൂപത്തിലൂടെ അർത്ഥം പ്രകടമാക്കി.
- source_word: הִצִּילוּ
  choice: വിടുവിച്ചോ
  rationale: נצל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അപകടത്തിൽനിന്നോ അധികാരത്തിൽനിന്നോ രക്ഷിക്കുക/വിടുവിക്കുക എന്നർത്ഥം നൽകുന്നു. സൈനിക-രാഷ്ട്രീയ സന്ദർഭത്തിന് ‘വിടുവിച്ചോ’ യോജിക്കുന്നു.
- source_word: שֹׁמְרוֹן
  choice: ശമര്യയെ
  rationale: സ്ഥിരമായി ഉപയോഗിക്കപ്പെടുന്ന മലയാള ബൈബിൾ സ്ഥലനാമരൂപം സ്വീകരിച്ചു.
- source_word: מִיָּדִי
  choice: എന്റെ കൈയിൽനിന്ന്
  rationale: അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം വ്യക്തമായതിനാൽ അതിന്റെ ദൃശ്യബലം നിലനിർത്തി.
theological_decisions:
- issue: വിജയിക്കപ്പെട്ട ജനതകളുടെ ദേവന്മാരെക്കുറിച്ചുള്ള പ്രഭാഷകന്റെ വെല്ലുവിളി
  choice: പേരെടുത്തുപറഞ്ഞ സ്ഥലങ്ങളിലെ ദേവന്മാർക്ക് ശമര്യയെ അശ്ശൂർ രാജാവിന്റെ കൈയിൽനിന്ന് വിടുവിക്കാൻ കഴിഞ്ഞോ എന്ന പരിഹാസാത്മക വീമ്പായി വിവർത്തനം ചെയ്തു.
  alternative: ഇത് ആ പ്രത്യേക ദേവന്മാരെക്കുറിച്ചുള്ള ചരിത്രവാദമെന്നതിലുപരി എല്ലാ ദേശീയദേവന്മാരെയും പൊതുവായി പരിഹസിക്കുന്ന വാക്കുകളായി വായിക്കാം.
  rationale: ഹീബ്രു പാഠം സ്ഥലങ്ങളിലെ ദേവന്മാരെ നേരിട്ട് പരാമർശിച്ച് ‘എന്റെ കൈയിൽനിന്ന്’ ശമര്യയെ വിടുവിച്ചോ എന്നു ചോദിക്കുന്നു. ആ ദേവന്മാരുടെ യാഥാർഥ്യമോ ശക്തിയോ സംബന്ധിച്ച് പാഠം പറയാത്ത ഒരു സിദ്ധാന്തനിഗമനവും വിവർത്തനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യഘടന ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന ‘എവിടെ?’ എന്ന പരിഹാസപ്രയോഗവും ‘എന്റെ കൈയിൽനിന്ന്’ എന്ന അധികാരരൂപകവും നിലനിർത്തി; സ്ഥലനാമങ്ങളുടെ പട്ടികയിലെ യഥാർഥ ഘടന അമിതമായി വ്യാഖ്യാനിച്ചില്ല.
