translation_notes:
  register: ആധുനിക നിലവാരമുള്ളതും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. രാജഭരണവർഷങ്ങളുടെ ചരിത്രസൂത്രവാക്യം വ്യക്തമായി നിലനിർത്തി; അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. മുഖ്യവാക്യത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട പദവികൽപ്പത്തെ സൂചിപ്പിക്കുന്നു.
