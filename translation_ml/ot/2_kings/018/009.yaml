base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
translation:
  language: ml
  text: ഹിസ്കീയാരാജാവിന്റെ ഭരണത്തിന്റെ നാലാം ആണ്ടിൽ—അത് ഏലായുടെ മകനും ഇസ്രായേൽരാജാവുമായ ഹോശേയയുടെ ഏഴാം ആണ്ടായിരുന്നു—അശ്ശൂർരാജാവായ ശൽമനേസർ ശമര്യയ്ക്കെതിരെ പടയെടുത്തു വന്ന് അതിനെ ഉപരോധിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശമര്യയ്ക്കെതിരെ ചെന്നു അതിന്മേൽ ഉപരോധം ഏർപ്പെടുത്തി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആണ്ടിൽ … ഉപരോധിച്ചു
  rationale: ഹീബ്രു ചരിത്രാഖ്യാനത്തിലെ സംഭവാവതാരക പ്രയോഗം മലയാളത്തിൽ വേറിട്ട് ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ കാലസൂചനയോടുകൂടിയ സ്വാഭാവിക വാക്യഘടനയിലൂടെ പ്രകടിപ്പിച്ചു.
- source_word: בַּשָּׁנָה הָרְבִיעִית לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: ഹിസ്കീയാരാജാവിന്റെ നാലാം ആണ്ടിൽ
  rationale: രാജഭരണകാലം കണക്കാക്കുന്ന സൂത്രവാക്യം മലയാളത്തിൽ വ്യക്തവും പരമ്പരാഗതമായി പരിചിതവുമായ രീതിയിൽ നൽകി.
- source_word: הִיא הַשָּׁנָה הַשְּׁבִיעִית לְהוֹשֵׁעַ בֶּן אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: അത് ഏലായുടെ മകനും ഇസ്രായേൽരാജാവുമായ ഹോശേയയുടെ ഏഴാം ആണ്ടായിരുന്നു
  rationale: രണ്ട് രാജാക്കന്മാരുടെ ഭരണവർഷങ്ങളെ ബന്ധിപ്പിക്കുന്ന הִיא എന്ന സർവനാമത്തിന്റെ പുനരാരംഭ സ്വഭാവം ‘അത് … ആയിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: עָלָה … עַל שֹׁמְרוֹן
  choice: ശമര്യയ്ക്കെതിരെ പടയെടുത്തു വന്നു
  rationale: സൈനികസന്ദർഭത്തിലെ עלה hostile campaign സൂചിപ്പിക്കുന്നു; ‘പടയെടുത്തു വന്നു’ ലക്ഷ്യത്തിനെതിരായ സൈനികനീക്കവും ദിശാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: שַׁלְמַנְאֶסֶר מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവായ ശൽമനേസർ
  rationale: രാജാവിന്റെ പേരും പദവിയും മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണഘടനയിൽ നൽകി; പേരുകൾ ഹീബ്രു രൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണത്തിലാണ്.
- source_word: וַיָּצַר עָלֶיהָ
  choice: അതിനെ ഉപരോധിച്ചു
  rationale: צור എന്ന ക്രിയയുടെ നഗരത്തെ വളഞ്ഞ് ആക്രമിക്കുന്ന സൈനിക അർഥം സംക്ഷിപ്തവും കൃത്യവുമായി നൽകുന്നു.
