translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രാജസഭാ വിനയഭാവം ‘അടിയങ്ങൾ’, ‘സംസാരിക്കണമേ’, ‘സംസാരിക്കരുതേ’ എന്നീ പ്രയോഗങ്ങളിലൂടെ നിലനിർത്തി; സ്ഥാനപ്പേരും ഭാഷാനാമത്തിലെ ഉറവിടസൂക്ഷ്മതയും സംരക്ഷിച്ചു.
