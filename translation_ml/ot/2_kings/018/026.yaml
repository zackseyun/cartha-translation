source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶלְיָקִ֣ים בֶּן חִ֠לְקִיָּהוּ וְ/שֶׁבְנָ֨ה וְ/יוֹאָ֜ח אֶל רַב שָׁקֵ֗ה דַּבֶּר נָ֤א אֶל עֲבָדֶ֨י/ךָ֙ אֲרָמִ֔ית כִּ֥י שֹׁמְעִ֖ים אֲנָ֑חְנוּ וְ/אַל תְּדַבֵּ֤ר עִמָּ֨/נוּ֙ יְהוּדִ֔ית בְּ/אָזְנֵ֣י הָ/עָ֔ם אֲשֶׁ֖ר עַל הַ/חֹמָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
translation:
  language: ml
  text: 'അപ്പോൾ ഹിൽക്കീയാവിന്റെ മകൻ എല്യാക്കീമും ശെബ്നയും യോവാഹും റബ്-ശാക്കേയോട് പറഞ്ഞു: “ദയവായി അടിയങ്ങളോട് അരാമ്യഭാഷയിൽ സംസാരിക്കണമേ; ഞങ്ങൾക്ക് അതു മനസ്സിലാകും. മതിലിന്മേലുള്ള ജനങ്ങൾ കേൾക്കെ ഞങ്ങളോട് യെഹൂദാഭാഷയിൽ[a] സംസാരിക്കരുതേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എബ്രായഭാഷയിൽ’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദമായ יְהוּדִית അക്ഷരാർഥത്തിൽ ‘യെഹൂദായുടെ ഭാഷ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: റബ്-ശാക്കേ
  rationale: ഇത് ഒരു അസീറിയൻ ഔദ്യോഗിക സ്ഥാനപ്പേരാണ്; കൃത്യമായ ചുമതല ഉറപ്പില്ലാത്തതിനാൽ ‘മുഖ്യ പാനപാത്രവാഹകൻ’ എന്നിങ്ങനെ അർഥം നിർണയിക്കാതെ സ്ഥാനപ്പേര് ലിപ്യന്തരണം ചെയ്തു.
- source_word: דַּבֶּר נָא
  choice: ദയവായി ... സംസാരിക്കണമേ
  rationale: ആജ്ഞാരൂപത്തോടു ചേർന്ന נָא വിനീതമായ അപേക്ഷ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആദരവുള്ള അഭ്യർഥനയായി നൽകി.
- source_word: עֲבָדֶיךָ
  choice: അടിയങ്ങളോട്
  rationale: നയതന്ത്രപരമായ ഈ സംഭാഷണത്തിൽ പദം അടിമത്തത്തെ ഊന്നുന്നതല്ല, സ്വയം താഴ്ത്തിപ്പറയുന്ന രാജസഭാ പ്രയോഗമാണ്; ‘അടിയങ്ങൾ’ ആ ഭാവം സ്വാഭാവികമായി പകരുന്നു.
- source_word: אֲרָמִית
  choice: അരാമ്യഭാഷയിൽ
  rationale: ഭാഷയെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണ പ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: ഞങ്ങൾക്ക് അതു മനസ്സിലാകും
  rationale: שׁמע എന്നതിന് ‘കേൾക്കുക’ എന്നും ‘മനസ്സിലാക്കുക’ എന്നും അർഥമുണ്ട്; ഇവിടെ ഭാഷാജ്ഞാനമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: יְהוּדִית
  choice: യെഹൂദാഭാഷയിൽ
  rationale: പദം അക്ഷരാർഥത്തിൽ യെഹൂദായിലെ ഭാഷയെ സൂചിപ്പിക്കുന്നു; സാങ്കേതികമായി ‘എബ്രായഭാഷ’ എന്നു മാത്രം നിർണയിക്കാതെ ഉറവിടരൂപത്തോട് ചേർന്ന പരിഭാഷ നൽകി.
- source_word: בְּאָזְנֵי
  choice: കേൾക്കെ
  rationale: അക്ഷരാർഥത്തിലെ ‘ചെവികളിൽ’ എന്ന ശൈലി, ജനങ്ങൾക്ക് കേൾക്കാവുന്ന വിധത്തിൽ എന്ന ശ്രവണഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമായി നൽകി.
- source_word: הָעָם אֲשֶׁר עַל הַחֹמָה
  choice: മതിലിന്മേലുള്ള ജനങ്ങൾ
  rationale: മൂലപാഠം ‘ജനം’ എന്നാണ് പറയുന്നത്; ‘പടയാളികൾ’ എന്നു പരിമിതപ്പെടുത്താതെ സ്ഥലസൂചനയും നിലനിർത്തി.
- source_word: וַיֹּאמֶר ... אֶל
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത ഘട്ടം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ സ്വാഭാവികമായ മലയാള ആഖ്യാനബന്ധം ഉപയോഗിച്ചു.
