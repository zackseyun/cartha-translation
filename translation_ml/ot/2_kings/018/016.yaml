- from: ആ സമയത്ത് യെഹൂദാരാജാവായ ഹിസ്കീയാവ് താൻ പൊതിഞ്ഞിരുന്ന യഹ്‌വേയുടെ ആലയത്തിന്റെ വാതിലുകളും വാതിൽപ്പടികളും[a] വെട്ടിയെടുത്ത് അശ്ശൂർരാജാവിനു കൊടുത്തു.
