source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא קִצַּ֨ץ חִזְקִיָּ֜ה אֶת דַּלְת֨וֹת הֵיכַ֤ל יְהוָה֙ וְ/אֶת הָ/אֹ֣מְנ֔וֹת אֲשֶׁ֣ר צִפָּ֔ה חִזְקִיָּ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וַֽ/יִּתְּנֵ֖/ם לְ/מֶ֥לֶךְ אַשּֽׁוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/016.yaml
  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
translation:
  language: ml
  text: ആ സമയത്ത് യെഹൂദാരാജാവായ ഹിസ്കീയാവ് യഹ്‌വേയുടെ ആലയത്തിന്റെ വാതിലുകളും, യെഹൂദാരാജാവായ ഹിസ്കീയാവ് മേൽപ്പാളി പൊതിഞ്ഞിരുന്ന വാതിൽക്കമ്പുകളും[a] വെട്ടിമാറ്റി അശ്ശൂർരാജാവിനു കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വാതിൽച്ചട്ടക്കൂടുകൾ” അല്ലെങ്കിൽ “തൂണുകൾ”; എബ്രായപദം അപൂർവമാണ്. ആലയവാതിലുകളോടു ബന്ധപ്പെട്ട ഘടനാപരമായ താങ്ങുകളെ പൊതുവായി ഇതു സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: ആ സമയത്ത്
  rationale: ആഖ്യാനത്തിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: קִצַּץ
  choice: വെട്ടിയെടുത്ത്
  rationale: വെട്ടിമാറ്റുക എന്ന മൂർത്തമായ പ്രവൃത്തി നിലനിർത്തുകയും നീക്കിയ ഭാഗങ്ങൾ രാജാവിനു കൊടുത്തുവെന്ന സന്ദർഭത്തോട് സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: דַּלְתוֹת
  choice: വാതിലുകൾ
  rationale: ക്ഷേത്രവാതിലുകളെയോ അവയുടെ പാളികളെയോ സൂചിപ്പിക്കുന്ന സാധാരണ നാമത്തിന്റെ വ്യക്തമായ മലയാളപരിഭാഷ.
- source_word: הֵיכַל יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: ഈ സന്ദർഭത്തിൽ הֵיכַל യെരൂശലേമിലെ ദേവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; יְהוָה എന്ന ദൈവനാമം യഹ്‌വേ എന്നു ലിപ്യന്തരം ചെയ്തു.
- source_word: הָאֹמְנוֹת
  choice: വാതിൽപ്പടികൾ
  rationale: അപൂർവമായ ഈ വാസ്തുശില്പപദം വാതിലുകളോടു ബന്ധപ്പെട്ട താങ്ങുകളെയോ ചട്ടക്കൂടുകളെയോ സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠത്തിൽ സന്ദർഭോചിതമായ അർഥം നൽകി അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: צִפָּה
  choice: പൊതിഞ്ഞിരുന്ന
  rationale: ലോഹംകൊണ്ട് മേൽപ്പാളി ഇടുക എന്ന അർഥം നൽകുന്നു; ഈ വാക്യം വസ്തു വ്യക്തമാക്കാത്തതിനാൽ അതു ചേർത്തിട്ടില്ല.
- source_word: וַיִּתְּנֵם
  choice: കൊടുത്തു
  rationale: ലളിതമായ എബ്രായ ആഖ്യാനക്രിയയെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവിനു
  rationale: എബ്രായ ഘടനയുടെ വ്യക്തവും പതിവുമായ മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ അംഗീകരിക്കപ്പെട്ട ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ചുള്ള ‘ഹിസ്കീയാവ്’ മലയാളത്തിൽ ഭാരമുള്ളതിനാൽ ‘യെഹൂദാരാജാവായ ഹിസ്കീയാവ് താൻ’ എന്ന ഘടനയിലൂടെ ഒരേ വ്യക്തിയാണെന്ന വിവരം വ്യക്തമായി നിലനിർത്തി.
