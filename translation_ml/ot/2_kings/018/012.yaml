  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַ֣ל אֲשֶׁ֣ר לֹֽא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעַבְרוּ֙ אֶת בְּרִית֔/וֹ אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וְ/לֹ֥א שָׁמְע֖וּ וְ/לֹ֥א עָשֽׂוּ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ ശബ്ദം കേൾക്കാതിരിക്കുകയും[a] അവന്റെ ഉടമ്പടി—യഹ്‌വെയുടെ ദാസനായ മോശ കൽപിച്ചതെല്ലാം—ലംഘിക്കുകയും ചെയ്തതിനാലായിരുന്നു ഇത്.[b] അവർ കേൾക്കുകയോ അതു ചെയ്യുകയോ ചെയ്തില്ല.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ ശബ്ദം അനുസരിക്കാതിരിക്കുകയും.’ ‘ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന് പലപ്പോഴും അനുസരിക്കുക എന്ന അർത്ഥവുമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ ഉടമ്പടി ലംഘിച്ചു’ എന്നത് ‘അവന്റെ ഉടമ്പടി ഭേദിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘കേൾക്കുക’ എന്ന ക്രിയയുടെ ആവർത്തനം എബ്രായ മൂലത്തിൽ ഊന്നൽ നൽകുന്നു; അവർ കേൾക്കാതെയും അത് ചെയ്യാതെയും ഇരുന്നതിനെ ഇത് ശക്തമായി അടിവരയിടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: עַל אֲשֶׁר
  choice: …തിനാലായിരുന്നു ഇത്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സംഭവത്തിന്റെ കാരണം ഈ വാക്യം നൽകുന്നു. മലയാളത്തിൽ കാരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: שָׁמְעוּ בְּקוֹל
  choice: ശബ്ദം കേൾക്കുക
  rationale: ഈ എബ്രായ പ്രയോഗത്തിൽ കേൾക്കലും അനുസരണവും ഉൾപ്പെടുന്നു. മൂലത്തിലെ ദൃശ്യമായ പ്രയോഗവും അതിലെ അർത്ഥവ്യാപ്തിയും നിലനിർത്താൻ ‘ശബ്ദം കേൾക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ ഉച്ചാരണരൂപമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיַּעַבְרוּ אֶת בְּרִיתוֹ
  choice: അവന്റെ ഉടമ്പടി ലംഘിച്ചു
  rationale: ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ עבר എന്ന ക്രിയയ്ക്ക് അതിരുകടക്കുക എന്ന അക്ഷരാർഥത്തേക്കാൾ ‘ലംഘിക്കുക’ എന്ന നൈതികവും ഉടമ്പടിപരവുമായ അർത്ഥമാണ് യോജിച്ചത്.
- source_word: אֵת כָּל אֲשֶׁר צִוָּה
  choice: കല്പിച്ചതൊക്കെയും
  rationale: കല്പിക്കപ്പെട്ടതിന്റെ സമഗ്രത സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: യഹ്‌വെയുടെ ദാസനായ മോശ
  rationale: עֶבֶד ഇവിടെ മോശയുടെ മാന്യവും ഔദ്യോഗികവുമായ പദവിയാണ്; അതിനാൽ ‘ദാസൻ’ യോജിക്കുന്നു.
- source_word: וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ
  choice: അവർ കേൾക്കുകയോ അതനുസരിച്ച് പ്രവർത്തിക്കുകയോ ചെയ്തില്ല
  rationale: ആദ്യ ക്രിയയുടെ ആവർത്തനം നിലനിർത്തുകയും עשה ഇവിടെ കല്പനകൾ പ്രാവർത്തികമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ഉച്ചാരണരൂപത്തിൽ നിലനിർത്തി.
- issue: שׁמע എന്ന ക്രിയയെ ‘അനുസരിക്കുക’ എന്നു വ്യക്തമാക്കണമോ
  choice: ശബ്ദം കേൾക്കുക
  alternative: അനുസരിക്കുക
  rationale: ഈ എബ്രായ പ്രയോഗത്തിൽ അനുസരണത്തിന്റെ ഭാവമുണ്ടെങ്കിലും, ‘കേൾക്കുക’ എന്ന മൂലരൂപം നിലനിർത്തുന്നത് വാക്യത്തിലെ ആവർത്തനവും അർത്ഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു; ഉടമ്പടി ലംഘിച്ചുവെന്ന തുടർവാക്യം അനുസരണക്കേട് വ്യക്തമാക്കുന്നു.
- issue: אֵת כָּל אֲשֶׁר צִוָּה എന്ന ഭാഗത്തിന്റെ ബന്ധം
  choice: ‘ഉടമ്പടി’യെ വിശദീകരിക്കുന്ന ഇടച്ചേർത്ത പ്രയോഗമായി അവതരിപ്പിച്ചു
  alternative: ‘ലംഘിച്ചു’ എന്ന ക്രിയയുടെ വേറിട്ട സമാന്തര കർമമായി വായിക്കുക
  rationale: എബ്രായ വാക്യഘടനയിൽ ഈ ഭാഗം ഉടമ്പടിയുടെ ഉള്ളടക്കത്തെ വിശദീകരിക്കുന്നതായോ ലംഘനത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്നതായോ വായിക്കാം. ദീർഘരേഖകൾ ഈ ബന്ധം സൂചിപ്പിച്ചുകൊണ്ട് അടിസ്ഥാനപരമായ സാന്ദ്രത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായത്തിലെ കാരണബന്ധം, ഉടമ്പടിപദാവലി, ‘കേൾക്കുക’ എന്ന ആവർത്തനം എന്നിവ സംരക്ഷിച്ചു; ദീർഘരേഖകൾ സങ്കീർണ്ണമായ വാക്യബന്ധം വായിക്കാൻ സഹായിക്കുന്നു.
