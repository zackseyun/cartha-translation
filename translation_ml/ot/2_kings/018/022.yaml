source:
  edition: WLC
  text: וְ/כִי תֹאמְר֣וּ/ן אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵי֙ הַ/מִּזְבֵּ֣חַ הַ/זֶּ֔ה תִּֽשְׁתַּחֲו֖וּ בִּ/ירוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ എന്നോടു, ‘ഞങ്ങൾ ഞങ്ങളുടെ ദൈവമായ യഹോവയിൽ ആശ്രയിക്കുന്നു’ എന്നു പറഞ്ഞാൽ, ഹിസ്കീയാവ് അവന്റെ പൂജാഗിരികളും ബലിപീഠങ്ങളും നീക്കിക്കളയുകയും യെഹൂദയോടും യെരൂശലേമിനോടും, ‘യെരൂശലേമിലെ ഈ ബലിപീഠത്തിന്റെ മുമ്പിൽ നിങ്ങൾ ആരാധിക്കണം’ എന്നു പറയുകയും ചെയ്തത് ഇതേ യഹോവയല്ലേ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּמֹתָיו
  choice: അവന്റെ പൂജാഗിരികൾ
  rationale: במה എന്നത് ഉയർന്ന സ്ഥലത്തുള്ള ആരാധനാകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് ആരാധനാസംബന്ധമായ അർഥം വ്യക്തമാക്കാൻ ‘പൂജാഗിരി’ ഉപയോഗിച്ചു.
- source_word: תִּשְׁתַּחֲווּ
  choice: നിങ്ങൾ ആരാധിക്കണം
  rationale: ക്രിയയുടെ അടിസ്ഥാനഭാവം കുനിഞ്ഞുവണങ്ങുക എന്നതാണെങ്കിലും ഇവിടെ ബലിപീഠത്തിനു മുമ്പിലുള്ള ദൈവാരാധനയാണ് സന്ദർഭാർത്ഥം.
- source_word: בָטָחְנוּ
  choice: ഞങ്ങൾ ... ആശ്രയിക്കുന്നു
  rationale: בטח എന്ന ക്രിയ വിശ്വാസപൂർവമായ ആശ്രയം സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: റബ്-ശാക്കെയുടെ വാദത്തിൽ പൂജാഗിരികളും ബലിപീഠങ്ങളും യഹോവയുടേതെന്ന അവകാശവാദം
  choice: ‘അവന്റെ പൂജാഗിരികളും ബലിപീഠങ്ങളും’ എന്ന് നേരിട്ട് നിലനിർത്തി
  alternative: ഹിസ്കീയാവ് നീക്കിയത് അനധികൃത ആരാധനാകേന്ദ്രങ്ങളാണെന്ന് വിശദീകരിച്ച് വാദം തിരുത്തുക
  rationale: സംസാരകന്റെ തെറ്റിദ്ധാരണയോ പ്രചാരണതന്ത്രമോ വാക്യത്തിന്റെ ഭാഗമാണ്; വിവർത്തനം അതിനെ നിശ്ശബ്ദമായി ശരിപ്പെടുത്തരുത്.
- issue: ‘അവൻ’ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: അവസാനത്തിൽ ‘ഇതേ യഹോവ’ എന്നു വ്യക്തമാക്കി
  alternative: ‘അവൻ തന്നെയല്ലേ?’ എന്ന സർവനാമം മാത്രം ഉപയോഗിക്കുക
  rationale: ഹീബ്രുവിൽ സൂചിതവ്യക്തി യഹോവയാണ്; ദീർഘമായ മലയാളവാക്യത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് ആവർത്തിക്കുന്നത് അർഥം മാറ്റാതെ വ്യക്തത നൽകുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ഉദ്ധരണിക്കുള്ളിലെ പരിഹാസാത്മക ചോദ്യം നിലനിർത്തിയിട്ടുണ്ട്; മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
