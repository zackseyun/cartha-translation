reference: 2 Kings 18:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רַב שָׁקֵ֔ה אִמְרוּ נָ֖א אֶל חִזְקִיָּ֑הוּ כֹּֽה אָמַ֞ר הַ/מֶּ֤לֶךְ הַ/גָּדוֹל֙ מֶ֣לֶךְ אַשּׁ֔וּר מָ֧ה הַ/בִּטָּח֛וֹן הַ/זֶּ֖ה אֲשֶׁ֥ר בָּטָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: ml
  text: 'അപ്പോൾ റബ്-ശാക്കേ അവരോടു പറഞ്ഞു: “ഹിസ്കീയാവിനോടു ദയവായി ഇങ്ങനെ പറയുക: ‘മഹാരാജാവായ അശ്ശൂർരാജാവ് ഇപ്രകാരം പറയുന്നു: നീ ആശ്രയിച്ചിരിക്കുന്ന ഈ ആത്മവിശ്വാസം എന്താണ്?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: റബ്-ശാക്കേ
  rationale: അശ്ശൂർ രാജസഭയിലെ ഒരു സ്ഥാനപ്പേരായതിനാൽ അർത്ഥം അനുമാനിച്ച് പരിഭാഷപ്പെടുത്താതെ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: אִמְרוּ נָא
  choice: ദയവായി ഇങ്ങനെ പറയുക
  rationale: נָא നൽകുന്ന വിനയപൂർവമായ അഭ്യർത്ഥനാഭാവം നിലനിർത്തി; ബഹുവചന ആജ്ഞ മലയാളത്തിൽ സാഹചര്യാനുസൃതമായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: മഹാരാജാവ്
  rationale: ‘വലിയ രാജാവ്’ എന്ന പദശഃപ്രയോഗത്തേക്കാൾ രാജകീയ ബഹുമതിപ്പേരിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מָה הַבִּטָּחוֹן הַזֶּה
  choice: ഈ ആത്മവിശ്വാസം എന്താണ്?
  rationale: בִּטָּחוֹן എന്നത് ഇവിടെ ആശ്രയം, ഉറപ്പ്, ആത്മവിശ്വാസം എന്നീ അർത്ഥവലയങ്ങൾക്കുള്ളതാണ്; തുടർന്ന് വരുന്ന בָּטַח എന്ന ക്രിയയുമായുള്ള പദബന്ധവും സാധ്യമായത്ര നിലനിർത്തി.
- source_word: אֲשֶׁר בָּטָחְתָּ
  choice: നീ ആശ്രയിച്ചിരിക്കുന്ന
  rationale: ഹീബ്രു സമ്പൂർണ്ണക്രിയയുടെ മുൻപ് ആരംഭിച്ച് ഇപ്പോഴും പ്രസക്തമായ ആശ്രയത്തെ മലയാളത്തിലെ സ്വാഭാവിക വർത്തമാന-പൂർണ്ണ ഭാവത്തിൽ നൽകി; ‘ഇതിൽ’ എന്നൊരു അധിക ആശ്രയവസ്തു ചേർത്തില്ല.
theological_decisions:
- issue: അശ്ശൂർരാജാവിന്റെ അവകാശവാദത്തിന്റെ സ്വരം
  choice: ‘മഹാരാജാവായ അശ്ശൂർരാജാവ് ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു’ എന്ന ഔദ്യോഗികവും അഹങ്കാരസൂചകവുമായ പ്രഖ്യാപനരൂപം നിലനിർത്തി.
  alternative: ‘അശ്ശൂരിലെ വലിയ രാജാവ് പറയുന്നു’ എന്ന സാധാരണ വിവരണം.
  rationale: മൂലത്തിലെ രാജകീയ ദൂതവാക്യശൈലിയും അശ്ശൂർരാജാവിന്റെ സ്വയംമഹത്വവത്കരണവും മൃദൂകരിക്കാതിരിക്കാനാണ് ഈ രൂപം.
- issue: בִּטָּחוֹן / בָּטַח പദബന്ധം
  choice: ‘ആത്മവിശ്വാസം’ / ‘ആശ്രയിച്ചിരിക്കുന്ന’ എന്ന് നൽകി അർത്ഥവ്യത്യാസവും ബന്ധവും ഒരുമിച്ച് സംരക്ഷിച്ചു.
  alternative: രണ്ടും ‘വിശ്വാസം’ എന്ന ഒരേ പദംകൊണ്ട് നൽകി പദാവർത്തനം കൃത്യമായി അനുകരിക്കുക.
  rationale: മലയാളത്തിൽ ഒരേ പദത്തിന്റെ നിർബന്ധിത ആവർത്തനം അസ്വാഭാവികവും അർത്ഥം ചുരുക്കുന്നതുമായിരിക്കും; എന്നാൽ വാക്യത്തിലെ പരിഹാസാത്മക ചോദ്യം പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. രാജകീയ ദൂതവാക്യത്തിന് യോജിച്ച ഔദ്യോഗിക ശൈലി പാലിച്ചു. മൂലപാഠത്തിൽ അഭിസംബോധന ഏകവചനത്തിലേക്ക് മാറുന്നതിനാൽ ‘നീ’ നിലനിർത്തി. അടിക്കുറിപ്പുകളില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളില്ല.
