  text: וְ/הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ בְּ/כֹ֥ל אֲשֶׁר יֵצֵ֖א יַשְׂכִּ֑יל וַ/יִּמְרֹ֥ד בְּ/מֶֽלֶךְ אַשּׁ֖וּר וְ/לֹ֥א עֲבָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
translation:
  language: ml
  text: യഹോവ അവനോടുകൂടെ ഉണ്ടായിരുന്നു; അവൻ ഏറ്റെടുത്ത എല്ലാ കാര്യങ്ങളിലും[a] വിജയിച്ചു. അവൻ അശ്ശൂർരാജാവിനെതിരെ കലാപം നടത്തി; അവനെ സേവിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ എവിടേക്കു പുറപ്പെട്ടാലും”; “അവൻ ചെയ്ത എല്ലാറ്റിലും വിവേകത്തോടെ പ്രവർത്തിച്ചു.” എബ്രായപദം വിവേകത്തോടെ പ്രവർത്തിക്കുന്നതിന്റെയും അതിലൂടെ ലഭിക്കുന്ന വിജയത്തിന്റെയും ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ സുപരിചിതവും നേരിട്ടുള്ളതുമായ ‘യഹോവ’ എന്നു നൽകി.
- source_word: וְהָיָה ... עִמּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: തുടർച്ചയായ ദൈവസാന്നിധ്യവും അനുഗ്രഹവും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּכֹל אֲשֶׁר יֵצֵא
  choice: അവൻ ഏറ്റെടുത്ത എല്ലാ കാര്യത്തിലും
  rationale: അക്ഷരാർഥത്തിൽ ‘അവൻ പുറപ്പെട്ട എല്ലാറ്റിലും’ എന്നാണെങ്കിലും, ഇവിടെ രാജാവിന്റെ പ്രവർത്തനങ്ങളെയും സൈനിക സംരംഭങ്ങളെയും ഉൾക്കൊള്ളുന്ന വിപുലമായ പ്രയോഗമാണ്.
- source_word: יַשְׂכִּיל
  choice: വിജയിച്ചു
  rationale: שׂכל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വിവേകത്തോടെ പ്രവർത്തിക്കുക, അതിലൂടെ വിജയം നേടുക എന്നീ ആശയങ്ങൾ ചേർത്തുവഹിക്കുന്നു; രാജകീയ വിവരണത്തിൽ ഫലമായ വിജയത്തിന് മുൻതൂക്കം നൽകി, ആശയവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיִּמְרֹד
  choice: മത്സരിച്ചു
  rationale: സാമ്രാജ്യത്വ അധികാരത്തിനെതിരായ രാഷ്ട്രീയ കലാപമോ കീഴടങ്ങാതിരിക്കലോ സൂചിപ്പിക്കുന്നു.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവിനോടു
  rationale: രാഷ്ട്രീയ എതിർപ്പിന്റെ ലക്ഷ്യത്തെ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְלֹא עֲבָדוֹ
  choice: അയാളെ സേവിക്കാതിരിക്കുകയും ചെയ്തു
  rationale: വ്യക്തിയെ കർമമായി സ്വീകരിക്കുന്ന עבד എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സാമന്തരാജാവായുള്ള കീഴ്സേവനത്തെയും കപ്പം നൽകലിനെയും സൂചിപ്പിക്കാം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രത്യേക നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവായ നാമരൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എല്ലാ കാര്യത്തിലും വിജയിച്ചു’ എന്ന സ്വാഭാവിക പ്രയോഗം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച്, എബ്രായത്തിലെ ‘പുറപ്പെടുക’ എന്ന ദൃശ്യവും ജ്ഞാനം–വിജയം എന്ന അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
