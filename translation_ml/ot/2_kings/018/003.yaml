id: 2KI.18.3
reference: 2 Kings 18:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥ד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/003.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: ml
  text: അവൻ തന്റെ പിതാവായ ദാവീദ് ചെയ്തതെല്ലാംപോലെ യഹോവയുടെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘പിതാവ്’ എന്നത് ഹിസ്കീയാവിന്റെ അടുത്ത ജനകനെയല്ല, ദാവീദീയ വംശത്തിലെ പൂർവികനായ ദാവീദിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ചെയ്തു
  rationale: עשה എന്ന ക്രിയയുടെ ഖാൽ വയ്യിഖ്തോൽ രൂപം തുടർന്നുള്ള ആഖ്യാനപ്രവർത്തനം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ഹീബ്രു സംയോജകം പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ സ്വാഭാവികമായി പ്രവർത്തനം രേഖപ്പെടുത്തുന്നു.
- source_word: הַיָּשָׁר
  choice: ശരിയായതു
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ വിശേഷണം നാമവൽക്കരിച്ച് ‘ശരിയായ കാര്യം’ എന്ന ധാർമ്മിക വിലയിരുത്തൽ സൂചിപ്പിക്കുന്നു; ‘ശരിയായതു’ അതിനെ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: യഹോവയുടെ കാഴ്ചപ്പാടിലോ വിലയിരുത്തലിലോ എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗം. ‘ദൃഷ്ടിയിൽ’ മൂലരൂപകം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: ചെയ്തതെല്ലാംപോലെ
  rationale: כְּ + כֹל + אֲשֶׁר ഒരു മാതൃകയോടുള്ള പൂർണമായ അനുരൂപത വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ ‘ചെയ്തതെല്ലാംപോലെ’ ഈ താരതമ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: דָּוִד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദ്
  rationale: ‘പിതാവ്’ എന്ന മൂലപദവും ദാവീദീയ വംശബന്ധം സൂചിപ്പിക്കുന്ന രാജകീയ സൂത്രവാക്യവും നിലനിർത്തുന്നു; ഇവിടെ അടുത്ത ജനകനെക്കാൾ പൂർവികനാണ് ഉദ്ദേശ്യമെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുർവ്യഞ്ജനം നേരിട്ട് വരുന്നതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ കൊണ്ട് പകരാതെ ദൈവനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: ‘ദാവീദ് തന്റെ പിതാവ്’ എന്നതിലെ പിതാവ് എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘തന്റെ പിതാവായ ദാവീദ്’ നിലനിർത്തുക
  alternative: തന്റെ പൂർവികനായ ദാവീദ്
  rationale: ഈ രാജകീയ സൂത്രവാക്യം ദാവീദീയ വംശബന്ധവും ദാവീദിനെ മാതൃകയാക്കുന്നതും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. മൂലത്തിന്റെ ‘പിതാവ്’ എന്ന പദം നിലനിർത്തി വിപുലമായ വംശപരമായ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ വിലയിരുത്തൽപ്രയോഗവും ദാവീദീയ രാജകീയ സൂത്രവാക്യവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
