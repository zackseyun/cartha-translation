source:
  edition: WLC
  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
translation:
  language: ml
  text: ഞാൻ വന്ന് നിങ്ങളെ നിങ്ങളുടെ സ്വന്തം ദേശംപോലെയുള്ള ഒരു ദേശത്തേക്കു കൊണ്ടുപോകുംവരെ, ധാന്യവും പുതുവീഞ്ഞുമുള്ള ദേശത്തേക്കു[a], അപ്പവും മുന്തിരിത്തോട്ടങ്ങളുമുള്ള ദേശത്തേക്കു, ഒലിവെണ്ണയും തേനും ഉള്ള ദേശത്തേക്കു[b] വരുവിൻ; അങ്ങനെ നിങ്ങൾ ജീവിക്കയും മരിക്കാതിരിക്കയും ചെയ്യും. ഹിസ്കീയാവിന്റെ വാക്കു കേൾക്കരുത്; ‘യഹ്‌വേ നമ്മെ വിടുവിക്കും’ എന്നു പറഞ്ഞ് അവൻ നിങ്ങളെ വഴിതെറ്റിക്കുകയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുതുവീഞ്ഞ്’ എന്നതിനു പകരം ‘വീഞ്ഞ്’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദമായ תִּירוֹשׁ പ്രത്യേകിച്ച് പുതിയതോ പുതുതായി ഉത്പാദിപ്പിച്ചതോ ആയ വീഞ്ഞിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ഒലിവിന്റെ വിളവും എണ്ണയും ചേർത്തു സൂചിപ്പിക്കുന്ന ചുരുക്കിയ പ്രയോഗമാണിവിടെ; അതിനെ സ്വാഭാവികമായി ‘ഒലിവെണ്ണ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: ഞാൻ വന്ന് … വരെ
  rationale: ഭാവിയിൽ വക്താവ് എത്തുന്നതുവരെയുള്ള കാലപരിധിയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. മുൻവാക്യത്തിൽ ആരംഭിച്ച ആഹ്വാനത്തിന്റെ തുടർച്ചയായതിനാൽ, മലയാളത്തിൽ വാക്യം പൂർണമാക്കാൻ ‘കാത്തിരിക്കുക’ ചേർത്തിരിക്കുന്നു.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: നിങ്ങളെ … കൊണ്ടുപോകുക
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ നിർബന്ധിതമായ ദേശമാറ്റത്തിന്റെ സാഹചര്യത്തിൽ ‘കൊണ്ടുപോകുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: നിങ്ങളുടെ സ്വന്തം ദേശംപോലെയുള്ള ഒരു ദേശത്തേക്ക്
  rationale: כְ എന്ന ഉപസർഗം സമാനതയാണ് സൂചിപ്പിക്കുന്നത്; പുതിയ ദേശം യെഹൂദാദേശം തന്നെയാണെന്നല്ല, അതുപോലെയായിരിക്കുമെന്ന പ്രചാരണവാദം നിലനിർത്തുന്നു.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: ധാന്യവും പുതുവീഞ്ഞുമുള്ള ദേശം
  rationale: דגן പൊതുവായി ധാന്യവിളകളെയും תירוש സാധാരണയായി പുതിയ വീഞ്ഞിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: അപ്പവും മുന്തിരിത്തോട്ടങ്ങളുമുള്ള ദേശം
  rationale: לחם എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘അപ്പം’ നിലനിർത്തുന്നു; כרמים മുന്തിരിപ്പഴമല്ല, മുന്തിരിത്തോട്ടങ്ങളാണ്.
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  choice: ഒലിവെണ്ണയും തേനും ഉള്ള ദേശം
  rationale: זית יצהר എന്നത് ഒലിവും എണ്ണയും സംബന്ധിച്ച ചുരുക്കിയ എബ്രായപ്രയോഗമാണ്; സന്ദർഭത്തിലെ സ്വാഭാവിക അർഥം ‘ഒലിവെണ്ണ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וִחְיוּ וְלֹא תָמֻתוּ
  choice: അങ്ങനെ നിങ്ങൾ ജീവിക്കും; മരിക്കുകയില്ല
  rationale: ആഹ്വാനത്തിന്റെ പ്രതീക്ഷിത ഫലം വ്യക്തമാക്കുകയും ‘ജീവിക്കുക/മരിക്കാതിരിക്കുക’ എന്ന എബ്രായ വിരുദ്ധജോടി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: ഹിസ്കീയാവിന്റെ വാക്കു കേൾക്കരുത്
  rationale: שמע אל ഇവിടെ ഒരാളുടെ ഉപദേശം ചെവിക്കൊള്ളുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ ‘വാക്കു കേൾക്കുക’ സ്വാഭാവികമാണ്.
- source_word: כִּי יַסִּית אֶתְכֶם
  choice: അവൻ നിങ്ങളെ വഴിതെറ്റിക്കുകയാണ്
  rationale: Hiphil രൂപത്തിലുള്ള סות പ്രേരിപ്പിക്കുക, വശീകരിക്കുക, വഴിതെറ്റിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. വക്താവിന്റെ ആരോപണം അതിരുകടക്കാതെ ‘വഴിതെറ്റിക്കുക’ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יַצִּילֵנוּ
  choice: നമ്മെ വിടുവിക്കും
  rationale: נצל എന്ന Hiphil ക്രിയയ്ക്ക് അപകടത്തിൽനിന്നോ ശത്രുവിൽനിന്നോ രക്ഷിച്ചു വിടുവിക്കുക എന്ന അർഥമുണ്ട്; സൈനികസന്ദർഭത്തിനും ദൈവിക വിടുതൽ എന്ന ആശയത്തിനും ‘വിടുവിക്കുക’ യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. സമൃദ്ധിയെ ഊന്നുന്ന ആവർത്തിത ‘ദേശം’ ഘടനയും റബ്-ശാക്കേയുടെ പ്രചാരണസ്വരവും പരമാവധി നിലനിർത്തിയിരിക്കുന്നു. മൂലവാക്യം മുൻസന്ദർഭത്തിൽനിന്ന് തുടരുന്നതിനാൽ മലയാളവാക്യത്തിന്റെ വ്യാകരണപൂർണതയ്ക്കായി ‘കാത്തിരിക്കുക’ ഉപയോഗിച്ചു.
