revisions:
- from: ഞാൻ വന്ന് നിങ്ങളെ നിങ്ങളുടെ സ്വന്തം ദേശംപോലെയുള്ള ഒരു ദേശത്തേക്കു കൊണ്ടുപോകുന്നതുവരെ—ധാന്യവും പുതുവീഞ്ഞുമുള്ള ദേശം[a], അപ്പവും മുന്തിരിത്തോട്ടങ്ങളുമുള്ള ദേശം, ഒലിവെണ്ണയും തേനും ഉള്ള ദേശം[b]—കാത്തിരിക്കുക. അങ്ങനെ നിങ്ങൾ ജീവിക്കും; മരിക്കുകയില്ല. ഹിസ്കീയാവിന്റെ വാക്കു കേൾക്കരുത്; ‘യഹ്‌വേ നമ്മെ വിടുവിക്കും’ എന്നു പറഞ്ഞ് അവൻ നിങ്ങളെ വഴിതെറ്റിക്കുകയാണ്.
  to: ഞാൻ വന്ന് നിങ്ങളെ നിങ്ങളുടെ സ്വന്തം ദേശംപോലെയുള്ള ഒരു ദേശത്തേക്കു കൊണ്ടുപോകുംവരെ, ധാന്യവും പുതുവീഞ്ഞുമുള്ള ദേശത്തേക്കു[a], അപ്പവും മുന്തിരിത്തോട്ടങ്ങളുമുള്ള ദേശത്തേക്കു, ഒലിവെണ്ണയും തേനും ഉള്ള ദേശത്തേക്കു[b] വരുവിൻ; അങ്ങനെ നിങ്ങൾ ജീവിക്കയും മരിക്കാതിരിക്കയും ചെയ്യും. ഹിസ്കീയാവിന്റെ വാക്കു കേൾക്കരുത്; ‘യഹ്‌വേ നമ്മെ വിടുവിക്കും’ എന്നു പറഞ്ഞ് അവൻ നിങ്ങളെ വഴിതെറ്റിക്കുകയാണ്.
