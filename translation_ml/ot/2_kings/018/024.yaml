id: 2KI.18.24
reference: 2 Kings 18:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְּטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: ml
  text: അങ്ങനെയിരിക്കെ, രഥങ്ങൾക്കും കുതിരപ്പടയാളികൾക്കുംവേണ്ടി ഈജിപ്തിനെ ആശ്രയിക്കുന്ന നിനക്ക്, എന്റെ യജമാനന്റെ ഏറ്റവും താഴ്ന്ന പദവിയിലുള്ള ദാസന്മാരിൽപ്പെട്ട ഒരു അധികാരിയെപ്പോലും[b] എങ്ങനെ ചെറുത്തുനിൽക്കാനാകും?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥത്തിൽ ‘മുഖം തിരിച്ചുവിടുക’; അതായത് ‘ചെറുക്കുക’, ‘തടഞ്ഞുനിർത്തുക’ അല്ലെങ്കിൽ ‘പിന്തിരിപ്പിക്കുക’.
    reason: lexical_alternative
  - marker: b
    text: ‘അധികാരി’ എന്നത് ‘ഭരണാധികാരി’ അല്ലെങ്കിൽ ‘സൈനികമേധാവി’ എന്നിങ്ങനെയും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഒരു പ്രവിശ്യാഭരണാധികാരിയെയോ സൈനികോദ്യോഗസ്ഥനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: ചെറുത്തുനിൽക്കാൻ
  rationale: ‘മുഖം തിരിച്ചയയ്ക്കുക’ എന്ന എബ്രായ പ്രയോഗം ഈ സൈനികസന്ദർഭത്തിൽ ഒരാളെ തടയുക, പിന്തിരിപ്പിക്കുക, ചെറുക്കുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ‘ചെറുത്തുനിൽക്കുക’ ആ ആശയം വ്യക്തമായി നൽകുന്നു; പദാനുപദരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: פַחַת
  choice: അധികാരി
  rationale: ഈ പദത്തിന് പ്രവിശ്യാഭരണാധികാരിയെയോ സൈനികോദ്യോഗസ്ഥനെയോ സൂചിപ്പിക്കാം. സന്ദർഭം സൈനികമാണെങ്കിലും കൃത്യമായ പദവി ഉറപ്പില്ലാത്തതിനാൽ വിശാലമായ ‘അധികാരി’ തിരഞ്ഞെടുത്തു.
- source_word: אַחַד
  choice: ഒരുവനായ ഒരു ... പോലും
  rationale: ഒരൊറ്റ താഴ്ന്ന പദവിയിലുള്ള ഉദ്യോഗസ്ഥനെപ്പോലും നേരിടാനാവില്ലെന്ന പരിഹാസത്തിന്റെ ഊന്നൽ ‘പോലും’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  choice: എന്റെ യജമാനന്റെ ഏറ്റവും താഴ്ന്ന പദവിയിലുള്ള ദാസന്മാർ
  rationale: ‘ചെറിയവർ’ എന്ന ശാരീരിക അർഥമല്ല, പദവിയിലും പ്രാധാന്യത്തിലും താഴ്ന്നവർ എന്ന ആശയമാണ് ഇവിടെ. אֲדֹנִי മനുഷ്യനായ മേലധികാരിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്റെ യജമാനൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: നീ ഈജിപ്തിൽ ആശ്രയിക്കുന്നുവല്ലോ
  rationale: בטח על എന്നത് ആശ്രയിക്കുക/വിശ്വാസം വെക്കുക എന്നർഥം. പരിഹാസാത്മകമായ കാരണബന്ധവും വാക്യത്തിന്റെ വാഗ്‌ഭാവവും ‘ആശ്രയിക്കുന്നുവല്ലോ’ എന്ന രൂപം നൽകുന്നു.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: രഥങ്ങൾക്കും കുതിരപ്പടയാളികൾക്കുംവേണ്ടി
  rationale: ഈജിപ്തിൽനിന്ന് പ്രതീക്ഷിച്ച സൈനികസഹായത്തിന്റെ രണ്ടു ഘടകങ്ങളെയും നേരിട്ട് വ്യക്തമാക്കുന്നു.
