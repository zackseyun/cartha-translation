- from: അങ്ങനെയെങ്കിൽ, എന്റെ യജമാനന്റെ ഏറ്റവും താഴ്ന്ന പദവിയിലുള്ള ദാസന്മാരിൽ ഒരുവനായ ഒരു അധികാരിയെപ്പോലും[b] നിനക്ക് എങ്ങനെ ചെറുത്തുനിൽക്കാൻ കഴിയും?[a] രഥങ്ങൾക്കും കുതിരപ്പടയാളികൾക്കുംവേണ്ടി നീ ഈജിപ്തിൽ ആശ്രയിക്കുന്നുവല്ലോ.
  to: അങ്ങനെയിരിക്കെ, രഥങ്ങൾക്കും കുതിരപ്പടയാളികൾക്കുംവേണ്ടി ഈജിപ്തിനെ ആശ്രയിക്കുന്ന നിനക്ക്, എന്റെ യജമാനന്റെ ഏറ്റവും താഴ്ന്ന പദവിയിലുള്ള ദാസന്മാരിൽപ്പെട്ട ഒരു അധികാരിയെപ്പോലും[b] എങ്ങനെ ചെറുത്തുനിൽക്കാനാകും?[a]
  rationale: പരിഷ്കരണം അർഥം മാറ്റുന്നില്ല. മലയാള വ്യാകരണവും സ്വാഭാവികതയും ഉറപ്പാക്കാൻ ‘ഈജിപ്തിൽ’ എന്നത് ‘ഈജിപ്തിനെ’ ആക്കുകയും, ‘ഒരുവനായ ഒരു’ എന്ന ആവർത്തനം നീക്കി ഉദ്യോഗസ്ഥൻ യജമാനന്റെ താഴ്ന്ന പദവിയിലുള്ള ദാസന്മാരിൽപ്പെട്ടവനാണെന്ന ഉറവിടബന്ധം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്തു. എബ്രായ വാക്യത്തിലെ സഹവർത്തി/പരിഹാസബന്ധം ‘ആശ്രയിക്കുന്ന നിനക്ക്’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
