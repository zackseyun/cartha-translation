  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. അസീറിയൻ ദൂതന്റെ പരിഹാസവും വെല്ലുവിളിയും നിലനിർത്താൻ ‘ഒരുവനായ ... പോലും’, ‘ആശ്രയിക്കുന്നുവല്ലോ’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു; ഉദ്യോഗസ്ഥന്റെ കൃത്യമായ പദവി അനാവശ്യമായി നിർണയിച്ചിട്ടില്ല.
