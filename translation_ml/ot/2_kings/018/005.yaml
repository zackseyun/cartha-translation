language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּטָ֑ח וְ/אַחֲרָ֞י/ו לֹא הָיָ֣ה כָמֹ֗/הוּ בְּ/כֹל֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/005.yaml
  text: He trusted in Yahweh[a], the God of Israel. After him there was none like him among all the kings of Judah, nor among those who were before him.
translation:
  language: ml
  text: അവൻ ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെയിൽ[a] ആശ്രയിച്ചു. അവനുശേഷം യെഹൂദാരാജാക്കന്മാരിൽ അവനെപ്പോലെ ആരും ഉണ്ടായിരുന്നില്ല; അവനുമുമ്പുള്ളവരിലും ആരുമുണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ഇവിടെ ദൈവത്തിന്റെ വ്യക്തിനാമമായ יהוה (യഹ്‌വെ) ആണ്.
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപം വ്യക്തമാക്കാൻ
lexical_decisions:
- source_word: בַּיהוָה
  choice: യഹ്‌വെയിൽ
  rationale: ב എന്ന ഉപസർഗം ആശ്രയത്തിന്റെ ലക്ഷ്യത്തെ ‘-യിൽ’ എന്നു സൂചിപ്പിക്കുന്നു; יְהוָה എന്ന ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: സംയുക്തനാമഘടന യഹ്‌വെയെ ഇസ്രായേലിന്റെ ദൈവമായി തിരിച്ചറിയുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ സമാനാധികരണപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: בָּטָח
  choice: ആശ്രയിച്ചു
  rationale: בטח എന്ന ക്രിയയുടെ ‘വിശ്വസിച്ച് ആശ്രയിക്കുക, ഭരമേൽപ്പിക്കുക’ എന്ന അർഥം സന്ദർഭോചിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְאַחֲרָיו לֹא הָיָה כָמֹהוּ
  choice: അവനുശേഷം വന്ന ... അവനെപ്പോലെ ആരും ഉണ്ടായിരുന്നില്ല
  rationale: കാലസൂചനയും താരതമ്യത്തിലൂടെ പ്രകടമാകുന്ന അതുല്യതയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּכֹל מַלְכֵי יְהוּדָה וַאֲשֶׁר הָיוּ לְפָנָיו
  choice: എല്ലാ യെഹൂദാരാജാക്കന്മാരിലും അവനുമുമ്പുണ്ടായിരുന്നവരിലും
  rationale: בְּ എന്നത് താരതമ്യസംഘത്തിനുള്ളിലെ ‘-ഇൽ’ എന്ന അർഥത്തിൽ നൽകി; അവസാന ബന്ധവാക്യം മുൻകാല യെഹൂദാരാജാക്കന്മാരെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അംഗീകരിക്കപ്പെട്ട മലയാള ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- issue: ഹിസ്കീയാവിന്റെ അതുല്യതയുടെ പരിധി
  choice: അവനുമുമ്പും ശേഷവും ഉണ്ടായിരുന്ന യെഹൂദാരാജാക്കന്മാരുമായുള്ള താരതമ്യം
  alternative: എല്ലാ രാജാക്കന്മാരിലും നിരുപാധികമായ അതുല്യത
  rationale: വാക്യത്തിന്റെ താരതമ്യം ‘യെഹൂദാരാജാക്കന്മാർ’ എന്ന വ്യക്തമായ പരിധിക്കുള്ളിൽ തന്നെയാക്കി; പാഠം പറയുന്നതിലധികം ദൈവശാസ്ത്രപരമായ അവകാശവാദം ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ആശ്രയിച്ചു’ എന്നത് വിശ്വാസവും ഭരമേൽപ്പിക്കലും ഉൾക്കൊള്ളുന്നു. താരതമ്യവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നതിനായി ശേഷമുള്ളവരെയും മുമ്പുള്ളവരെയും സമാന്തരമായി ക്രമപ്പെടുത്തി.
