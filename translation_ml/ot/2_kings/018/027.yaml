  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם רַב שָׁקֵ֗ה הַ/עַ֨ל אֲדֹנֶ֤י/ךָ וְ/אֵלֶ֨י/ךָ֙ שְׁלָחַ֣/נִי אֲדֹנִ֔/י לְ/דַבֵּ֖ר אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/לֹ֣א עַל הָ/אֲנָשִׁ֗ים הַ/יֹּֽשְׁבִים֙ עַל הַ֣/חֹמָ֔ה לֶ/אֱכֹ֣ל אֶת חרי/הם וְ/לִ/שְׁתּ֛וֹת אֶת שיני/הם עִמָּ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
translation:
  language: ml
  text: 'അപ്പോൾ റബ്-ശാക്കേ അവരോടു പറഞ്ഞു: “ഈ വാക്കുകൾ പറയാൻ എന്റെ യജമാനൻ എന്നെ നിന്റെ യജമാനന്റെയും നിന്റെയും അടുക്കലേക്കാണോ അയച്ചത്? നിങ്ങളോടൊപ്പം സ്വന്തം മലം തിന്നുകയും സ്വന്തം മൂത്രം കുടിക്കുകയും ചെയ്യേണ്ടിവരുന്ന, മതിലിന്മേൽ ഇരിക്കുന്ന പുരുഷന്മാരുടെ അടുക്കലേക്കും എന്നെ അയച്ചതല്ലയോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു എഴുത്തുരൂപത്തിൽ ഇവിടെ ഉപരോധകാലത്തെ പരുഷമായ ദൃശ്യഭാഷയാണ്: “സ്വന്തം മലം തിന്നുകയും സ്വന്തം മൂത്രം കുടിക്കുകയും.” പരമ്പരാഗത വായനാരൂപം രണ്ടാമത്തെ പ്രയോഗത്തെ സൗമ്യമാക്കി, “തങ്ങളുടെ കാലുകളുടെ വെള്ളം കുടിക്കുക” എന്നു പറയുന്നു.'
    reason: ഹീബ്രു എഴുത്തുരൂപവും പരമ്പരാഗത വായനാരൂപവും തമ്മിലുള്ള പദവ്യത്യാസം അറിയിക്കാനും മൂലത്തിലെ പരുഷത സംരക്ഷിക്കാനും.
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: റബ്-ശാക്കേ
  rationale: അശ്ശൂർ രാജാവിന്റെ ഒരു ഉന്നത ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന പദവിയാണിത്. ചുമതല കൃത്യമായി നിർവചിക്കാതെ, ആഖ്യാനത്തിൽ പേരുപോലെ പ്രവർത്തിക്കുന്ന പരമ്പരാഗത പദവി ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַעַל אֲדֹנֶיךָ וְאֵלֶיךָ שְׁלָחַנִי אֲדֹנִי
  choice: എന്റെ യജമാനൻ എന്നെ അയച്ചത് നിന്റെ യജമാനന്റെയും നിന്റെയും അടുക്കലേക്കു മാത്രമാണോ?
  rationale: ഹീബ്രുവിലെ ആദ്യ ചോദ്യം പ്രകടിപ്പിക്കുന്ന പരിമിതമായ ലക്ഷ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘മാത്രമാണോ’ ഉപയോഗിച്ചു; പിന്നാലെയുള്ള ‘അടുക്കലേക്കല്ലയോ?’ എന്ന ചോദ്യം ഈ വൈരുധ്യം ഉറപ്പിക്കുന്നു. ഇരുവശത്തുമുള്ള രാഷ്ട്രീയ-സാമൂഹിക അർഥത്തിന് ‘യജമാനൻ’ യോജിക്കുന്നു.
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ പറയാൻ
  rationale: ഹീബ്രുവിലെ ‘ഈ വാക്കുകൾ സംസാരിക്കുക’ എന്ന നേരിട്ടുള്ള പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നൽകി.
- source_word: הֲלֹא עַל הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחֹמָה
  choice: മതിലിന്മേൽ ഇരിക്കുന്ന മനുഷ്യരുടെയും അടുക്കലേക്കല്ലയോ?
  rationale: הֲלֹא അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്. ‘അവരിലേക്കും എന്നെ അയച്ചതല്ലയോ?’ എന്ന ആശയം മുൻചോദ്യത്തിൽനിന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി പൂരിപ്പിക്കപ്പെടുന്നു.
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: തിന്നുകയും ... കുടിക്കുകയും ചെയ്യേണ്ടിവരും
  rationale: ഉപരോധത്തിന്റെ നിർബന്ധിതവും ഭീകരവുമായ പരിണതിയാണ് അനന്തക്രിയകൾ സൂചിപ്പിക്കുന്നത്. ‘ചെയ്യേണ്ടിവരും’ ആ ഫലം ദൈവിക മുൻനിശ്ചയമായി വ്യാഖ്യാനിക്കാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: חרי/הם
  choice: സ്വന്തം മലം
  rationale: ഉപരോധഭീഷണിയുടെ മനപ്പൂർവം അശ്ലീലവും അപമാനകരവുമായ ഭാഷ മൃദൂകരിക്കാതെ, സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകി.
- source_word: שיני/הם
  choice: സ്വന്തം മൂത്രം
  rationale: എഴുത്തുരൂപത്തിലെ പരുഷമായ പദത്തിന്റെ സന്ദർഭാർഥം നേരിട്ട് നൽകി; പരമ്പരാഗത വായനയിലെ സൗമ്യപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: עִמָּכֶם
  choice: നിങ്ങളോടൊപ്പം അവരും
  rationale: അഭിസംബോധിതരായ ഉദ്യോഗസ്ഥരും മതിലിലുള്ളവരും ഒരേ ദുരിതം പങ്കിടുമെന്ന അനുഗമനാർഥം വ്യക്തമാക്കി; ഹീബ്രുവിലെ ബഹുവചനത്തെ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ഉദ്യോഗപദവി ലിപ്യന്തരണം ചെയ്തു. റബ്-ശാക്കേയുടെ പരിഹാസഭീഷണിയിലെ പരുഷത മൃദൂകരിച്ചിട്ടില്ല; എന്നാൽ അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി. ആദ്യ അഭിസംബോധനയിലെ ഹീബ്രു ഏകവചനം ‘നിന്റെ’ എന്നും അവസാനത്തെ ബഹുവചനം ‘നിങ്ങളോടൊപ്പം’ എന്നും വേർതിരിച്ചു നിലനിർത്തി.
