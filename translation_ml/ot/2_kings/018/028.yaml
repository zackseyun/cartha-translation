translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. രാജകീയ വിളംബരത്തിന്റെ ഔപചാരികസ്വരം ‘കേൾക്കുവിൻ’, ‘മഹാരാജാവ്’, ‘വചനം’ എന്നീ പദങ്ങളിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
