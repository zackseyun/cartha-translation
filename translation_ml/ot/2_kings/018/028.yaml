  naturalness: The proposed revision is fluent modern standard Malayalam and maintains the formal heraldic register. ‘യെഹൂദാഭാഷ’ is clearer and more natural than ‘യെഹൂദ്യഭാഷ’ while retaining the historically specific sense.
  terminology: ‘രബ്-ശാക്കേ’ appropriately preserves the Assyrian title; ‘മഹാരാജാവായ അശ്ശൂർരാജാവ്’ reflects ‘the great king, the king of Assyria’ naturally. ‘വചനം’ and ‘കേൾക്കുവിൻ’ suitably convey the formal royal proclamation.
  issues:
