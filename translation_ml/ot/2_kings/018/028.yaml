  text: וַֽ/יַּעֲמֹד֙ רַב שָׁקֵ֔ה וַ/יִּקְרָ֥א בְ/קוֹל גָּד֖וֹל יְהוּדִ֑ית וַ/יְדַבֵּ֣ר וַ/יֹּ֔אמֶר שִׁמְע֛וּ דְּבַר הַ/מֶּ֥לֶךְ הַ/גָּד֖וֹל מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/028.yaml
  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
translation:
  language: ml
  text: 'അപ്പോൾ രബ്-ശാക്കേ നിന്നു; അവൻ ഉച്ചത്തിൽ യെഹൂദാഭാഷയിൽ[a] വിളിച്ചുപറഞ്ഞു: “മഹാരാജാവായ അശ്ശൂർരാജാവിന്റെ വചനം കേൾക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എബ്രായഭാഷയിൽ.” എബ്രായപദം കൂടുതൽ കൃത്യമായി യെഹൂദാ ദേശത്തിന്റെ ഭാഷയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: എഴുന്നേറ്റുനിന്ന്
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ പൊതുജനങ്ങളെ അഭിസംബോധന ചെയ്യാൻ നിന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; വെറും ‘നിന്നു’ എന്നും സാധ്യമാണ്.
- source_word: רַב שָׁקֵה
  choice: രബ്-ശാക്കേ
  rationale: അശ്ശൂർ രാജസഭയിലെ ചരിത്രപരമായ സ്ഥാനപ്പേരിനെ വിവർത്തനം ചെയ്ത് അർഥം പരിമിതപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיִּקְרָא בְקוֹל גָּדוֹל
  choice: ഉച്ചത്തിൽ ... വിളിച്ചുപറഞ്ഞു
  rationale: പൊതുവായി ശബ്ദമുയർത്തി വിളിച്ചറിയിക്കുന്നതെന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוּדִית
  choice: യെഹൂദ്യഭാഷയിൽ
  rationale: പിന്നീടുള്ള വിശാലമായ ‘എബ്രായഭാഷ’ എന്ന പേരിനേക്കാൾ, യെഹൂദാ ദേശത്തിന്റെ ഭാഷയെന്ന ചരിത്രപരമായ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  choice: വിളിച്ചുപറഞ്ഞു
  rationale: എബ്രായത്തിലെ ഇരട്ട വാക്യാരംഭത്തെ മലയാളത്തിൽ കൃത്രിമമാകാതെ ഏകീകൃതമായ സംസാരക്രിയയായി നൽകുന്നു; വിളിച്ചു സംസാരിച്ചതിന്റെ ഭാവം മുൻക്രിയയോടൊപ്പം നിലനിൽക്കുന്നു.
- source_word: שִׁמְעוּ
  choice: കേൾക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞയും ഔദ്യോഗിക വിളംബരത്തിന്റെ ഗൗരവമുള്ള സ്വരവും നിലനിർത്തുന്നു.
- source_word: דְּבַר
  choice: വചനം
  rationale: രാജാവിന്റെ ഔദ്യോഗിക പ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്ന ഔപചാരികവും പരിചിതവുമായ പദം.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: മഹാരാജാവ്
  rationale: അശ്ശൂർ രാജകീയ സ്ഥാനവിശേഷണമായ ‘വലിയ രാജാവ്’ എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവ്
  rationale: എബ്രായ ഘടനയുടെ അർഥം വ്യക്തവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
