translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. രാജവാഴ്ചാ രേഖയുടെ സംക്ഷിപ്ത സ്വഭാവം നിലനിർത്തി; അനാവശ്യ വിശദീകരണങ്ങളോ മതവിഭാഗപരമായ പദപ്രയോഗങ്ങളോ ചേർത്തിട്ടില്ല.
