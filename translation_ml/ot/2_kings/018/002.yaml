id: 2KI.18.2
reference: 2 Kings 18:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וְ/עֶשְׂרִ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ אֲבִ֖י בַּת זְכַרְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/002.yaml
  text: He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abi daughter of Zechariah.
translation:
  language: ml
  text: അവൻ രാജാവായപ്പോൾ ഇരുപത്തഞ്ചു വയസ്സായിരുന്നു. അവൻ യെരൂശലേമിൽ ഇരുപത്തൊമ്പതു വർഷം ഭരിച്ചു. അവന്റെ അമ്മയുടെ പേര് സെഖര്യാവിന്റെ മകളായ അബി എന്നായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: ഇരുപത്തഞ്ചു വയസ്സായിരുന്നു
  rationale: ഇത് പ്രായം സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പ്രയോഗമാണ്. അക്ഷരാർഥത്തിലുള്ള ‘ഇരുപത്തഞ്ചു വർഷങ്ങളുടെ മകൻ’ എന്ന രൂപത്തിനു പകരം സ്വാഭാവികമായ മലയാള പ്രയോഗം സ്വീകരിച്ചു.
- source_word: הָיָה בְמָלְכוֹ
  choice: അവൻ രാജാവായപ്പോൾ
  rationale: ഈ പ്രയോഗം രാജാവായി അധികാരമേറ്റ സമയത്തെ പ്രായം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും അർഥസൂക്ഷ്മത കാത്തുസൂക്ഷിക്കുന്നതുമായ രൂപമാണിത്.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: രാജത്വം പ്രയോഗിച്ചതിനെയും രാജാവായി വാണതിനെയും സൂചിപ്പിക്കുന്ന ക്രിയയ്ക്ക് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാള പദം.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: ഭരണത്തിന്റെ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലവാചകപ്രയോഗം; പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് … എന്നായിരുന്നു
  rationale: അമ്മയെ പേരുപറഞ്ഞ് പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രവാക്യത്തിന്റെ സ്വാഭാവിക മലയാള രൂപം.
- source_word: אֲבִי
  choice: അബി
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בַּת זְכַרְיָה
  choice: സെഖര്യാവിന്റെ മകളായ
  rationale: എബ്രായ നിർമിതബന്ധം മാതാപിതൃബന്ധം സൂചിപ്പിക്കുന്നു; അബിയെ വിശേഷിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ഘടനയിൽ അവതരിപ്പിച്ചു.
