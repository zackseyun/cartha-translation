- from: 'നീ പറയുന്നു: ‘അത് വെറും അധരവാക്കു മാത്രം’—എന്നാൽ യുദ്ധത്തിന് ആലോചനയും ശക്തിയും വേണം. ഇപ്പോൾ നീ ആരിൽ ആശ്രയിച്ചിട്ടാണ് എന്നോടു മത്സരിച്ചത്?'
