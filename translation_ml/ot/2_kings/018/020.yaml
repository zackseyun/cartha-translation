id: 2KI.18.20
reference: 2 Kings 18:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָמַ֨רְתָּ֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: ml
  text: 'നീ പറയുന്നു: ‘അത് വെറും അധരവാക്കു മാത്രം’—എന്നാൽ യുദ്ധത്തിനുള്ളത് ആലോചനയും ശക്തിയുമാണ്. ഇപ്പോൾ നീ ആരിൽ ആശ്രയിച്ചിട്ടാണ് എന്നോടു കലാപം ചെയ്തത്?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ דְּבַר שְׂפָתַיִם
  choice: വെറും അധരവാക്കു മാത്രം
  rationale: ‘അധരങ്ങളുടെ വാക്ക്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകഭാവം നിലനിർത്തിക്കൊണ്ട് אַךְ എന്നതിന്റെ നിയന്ത്രക അർഥം ‘വെറും… മാത്രം’ എന്നു നൽകി.
- source_word: עֵצָה
  choice: ആലോചന
  rationale: യുദ്ധതന്ത്രപരമായ വിവേകം/പദ്ധതി എന്ന അർഥമുള്ള പദത്തെ സന്ദർഭത്തിന് സ്വാഭാവികമായ പൊതുപദത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: גְבוּרָה
  choice: ശക്തി
  rationale: സൈനിക ബലം, പ്രാപ്തി എന്നീ സാധ്യതകൾ ഉൾക്കൊള്ളുന്ന വിശാലമായ തത്തുല്യപദം.
- source_word: בָטַחְתָּ
  choice: ആശ്രയിച്ചിട്ടാണ്
  rationale: വിശ്വാസം വെക്കുക, ആശ്രയിക്കുക എന്ന അർഥങ്ങളിൽ രാഷ്ട്രീയ-സൈനിക ആശ്രയത്വം ഈ സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מָרַדְתָּ
  choice: മത്സരിച്ചത്
  rationale: രാജാധികാരത്തിനെതിരായ കലാപം/ധിക്കാരം സൂചിപ്പിക്കുന്ന പദത്തിന് dignified Malayalam; ‘എന്നോടു മത്സരിക്കുക’ എന്നത് കീഴടങ്ങൽ നിരസിച്ച രാഷ്ട്രീയ നടപടി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ആദ്യ വാക്യഘടകത്തിന്റെ വ്യാകരണപരമായ അവ്യക്തത
  choice: ഉദ്ധരിച്ച അവകാശവാദത്തിനു പിന്നാലെ ‘എന്നാൽ’ ചേർത്ത് ആലോചനയും ശക്തിയും യുദ്ധത്തിന് ആവശ്യമാണെന്ന വിരുദ്ധാഭാസമായി അവതരിപ്പിച്ചു.
  alternative: ‘അധരവാക്കു മാത്രമാണ് ആലോചനയും യുദ്ധശക്തിയും’ എന്ന ഒരൊറ്റ ഉദ്ധരണിയായി വായിക്കുക.
  rationale: മസൊററ്റിക് ഘടന സംക്ഷിപ്തവും ദുഷ്കരവുമാണ്; ഇംഗ്ലീഷ് പരിശോധനാപാഠത്തിന്റെ വായന പിന്തുടരുമ്പോഴും എബ്രായത്തിലെ പരിഹാസപരമായ സംഘർഷം നിലനിർത്തുന്നു. പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘അധരവാക്ക്’ എന്ന അല്പം ശാബ്ദികമായ രൂപകം മൂലപാഠത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു; ശേഷിച്ച വാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാക്കി.
