  yaml_path: translation/ot/2_kings/018/031.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
translation:
  language: ml
  text: '“ഹിസ്കീയാവിനെ കേൾക്കരുത്; അശ്ശൂർരാജാവ് ഇങ്ങനെ പറയുന്നു: ‘എന്നോടു സമാധാനം ചെയ്യുക[a]; എന്റെ അടുക്കലേക്കു പുറത്തുവരുക; നിങ്ങളിൽ ഓരോരുത്തനും അവനവന്റെ മുന്തിരിവള്ളിയിൽനിന്നും അത്തിവൃക്ഷത്തിൽനിന്നും ഭക്ഷിക്കുകയും അവനവന്റെ ജലസംഭരണിയിലെ വെള്ളം കുടിക്കുകയും ചെയ്യട്ടെ,’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “എന്നോടൊപ്പം ഒരു അനുഗ്രഹം ഉണ്ടാക്കുക.” സമാധാനം ചെയ്യുക, അഥവാ ഒത്തുതീർപ്പിലെത്തുക എന്ന അർഥമുള്ള ഒരു പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: വാക്കു കേൾക്കുക
  rationale: ശׁמע എന്ന ക്രിയ אֶל എന്ന പൂർവപ്രത്യയത്തോടുകൂടെ ഇവിടെ ഒരാളുടെ വാക്കു ശ്രദ്ധിച്ചു സ്വീകരിക്കുക എന്ന അർഥം നൽകുന്നു. ‘അനുസരിക്കുക’ എന്നു പറഞ്ഞാൽ ആശയം കൂടുതൽ വ്യാഖ്യാനിച്ചുപോകും; ‘വാക്കു കേൾക്കുക’ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: חִזְקִיָּהוּ
  choice: ഹിസ്കീയാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: כִּי כֹה אָמַר מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവ് ഇങ്ങനെ പറയുന്നു
  rationale: നേരിട്ടുള്ള പ്രസംഗം അവതരിപ്പിക്കുന്ന എബ്രായ സൂത്രവാക്യത്തെ ചുരുക്കവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിച്ചു.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: എന്നോടു സമാധാനത്തിലാകുക
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്നോടുകൂടെ ഒരു അനുഗ്രഹം ഉണ്ടാക്കുക’ എന്ന അസാധാരണ പ്രയോഗമാണെങ്കിലും, ഉപരോധത്തിന്റെ സന്ദർഭത്തിൽ അനുകൂല വ്യവസ്ഥകളിൽ ഒത്തുതീർപ്പിലാകുക എന്നതാണ് അതിന്റെ പ്രയോഗാർഥം. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וּצְאוּ אֵלַי
  choice: എന്റെ അടുക്കൽ പുറത്തുവരുക
  rationale: יצא എന്നതിന്റെ മൂർത്തമായ ‘പുറത്തുവരുക’ എന്ന അർഥം നിലനിർത്തി. കീഴടങ്ങുക എന്ന സൂചന സന്ദർഭത്തിലുണ്ടെങ്കിലും അത് മുഖ്യപാഠത്തിൽ വിശദീകരിച്ചിട്ടില്ല.
- source_word: אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: നിങ്ങളിൽ ഓരോരുത്തനും അവനവന്റെ മുന്തിരിവള്ളിയിൽനിന്നും അത്തിവൃക്ഷത്തിൽനിന്നും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന אִישׁ വിതരണാർഥത്തിലാണ്. മലയാളത്തിൽ ‘ഓരോരുത്തനും അവനവന്റെ’ എന്ന പ്രയോഗം ആ വിതരണാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מֵי בוֹרוֹ
  choice: അവനവന്റെ ജലസംഭരണിയിലെ വെള്ളം
  rationale: בּוֹר ഇവിടെ ഉറവുള്ള കിണറിനെക്കാൾ മഴവെള്ളമോ മറ്റോ ശേഖരിക്കുന്ന കുഴി അഥവാ cistern ആണ്; ‘ജലസംഭരണി’ അതിനെ കൃത്യവും വായനാസൗഹൃദവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: വിതരണാർഥത്തിൽ ആവർത്തിക്കുന്ന אִישׁ എന്ന പുല്ലിംഗ നാമം
  choice: നിങ്ങളിൽ ഓരോരുത്തനും / അവനവന്റെ
  alternative: ഓരോ പുരുഷനും / അവന്റെ
  rationale: എബ്രായ പുല്ലിംഗ ഏകവചനം ഇവിടെ ഓരോ കുടുംബാംഗത്തെയും വ്യക്തിയെയും പ്രതിനിധീകരിക്കുന്ന വിതരണപ്രയോഗമാണ്. മലയാളത്തിലെ ‘ഓരോരുത്തൻ’ ഉറവിടത്തിന്റെ ഏകവചന വിതരണബലം നിലനിർത്തുകയും അനാവശ്യമായി പുരുഷന്മാർക്കു മാത്രം അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: עֲשׂוּ אִתִּי בְרָכָה എന്ന രാഷ്ട്രീയ പ്രയോഗം
  choice: എന്നോടു സമാധാനത്തിലാകുക
  alternative: എന്നോടുകൂടെ ഒരു അനുഗ്രഹം ഉണ്ടാക്കുക / എന്നോടു ധാരണയിലെത്തുക
  rationale: ഇവിടെ ‘അനുഗ്രഹം’ ഒരു സിദ്ധാന്തപരമായ ദൈവശാസ്ത്രപദമായി ഉപയോഗിക്കുന്നില്ല; അശ്ശൂർരാജാവുമായി അനുകൂല ഒത്തുതീർപ്പിൽ പ്രവേശിക്കാനുള്ള ആഹ്വാനമാണ്. പ്രയോഗാർഥം മുഖ്യപാഠത്തിലും അസാധാരണമായ അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി സ്വീകരിച്ചു. ‘അശ്ശൂർരാജാവ്,’ ‘ഹിസ്കീയാവ്’ എന്നീ പരിചിതമായ ബൈബിൾ പേരുരൂപങ്ങൾ നിലനിർത്തി. തുടർന്നുള്ള വാക്യത്തിലേക്കു പ്രസംഗം നീളുന്നതിനാൽ അവസാനത്തിൽ പ്രസംഗതുടർച്ച സൂചിപ്പിക്കുന്ന വിരാമചിഹ്നം ഉപയോഗിച്ചു.
