source:
  edition: WLC
  text: הַ/הַצֵּ֥ל הִצִּ֛ילוּ אֱלֹהֵ֥י הַ/גּוֹיִ֖ם אִ֣ישׁ אֶת אַרְצ֑/וֹ מִ/יַּ֖ד מֶ֥לֶךְ אַשּֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/033.yaml
  text: Have the gods of the nations ever delivered[a], each one, his land from the hand of the king of Assyria?
translation:
  language: ml
  text: ജനതകളുടെ ദേവന്മാരിൽ ഓരോരുത്തനും തന്റെ ദേശത്തെ അശ്ശൂർ രാജാവിന്റെ കൈയിൽനിന്ന് ഒരിക്കലെങ്കിലും വിടുവിച്ചിട്ടുണ്ടോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ഇവിടെ ഊന്നൽ നൽകുന്ന ഒരു ക്രിയാരൂപമുണ്ട്; അക്ഷരാർഥത്തിൽ, ‘ജനതകളുടെ ദേവന്മാർ തീർച്ചയായും വിടുവിച്ചിട്ടുണ്ടോ?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהַצֵּל הִצִּילוּ
  choice: ഒരിക്കലെങ്കിലും വിടുവിച്ചിട്ടുണ്ടോ?
  rationale: נצל എന്ന ക്രിയയുടെ infinitive absolute-ഉം finite verb-ഉം ചേർന്ന ഊന്നൽ വെല്ലുവിളി നിറഞ്ഞ ചോദ്യമായി വരുന്നു. മലയാളത്തിൽ ‘ഒരിക്കലെങ്കിലും ...ിട്ടുണ്ടോ?’ എന്നത് അസ്വാഭാവികമായ പദാവർത്തനം കൂടാതെ ആ ഊന്നലും വാചാടോപചോദ്യത്തിന്റെ ശക്തിയും നൽകുന്നു.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: ജനതകളുടെ ദേവന്മാർ
  rationale: ബഹുവചന construct രൂപവും הַגּוֹיִם എന്നതിന്റെ ‘ജനതകൾ/രാഷ്ട്രങ്ങൾ’ എന്ന അർഥവും നേരിട്ട് സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ വിവിധ ജനതകളുടെ പ്രാദേശിക ദേവന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אִישׁ
  choice: ആരെങ്കിലും
  rationale: ഇവിടെ אִישׁ പുരുഷവ്യക്തിയെ സൂചിപ്പിക്കുന്നതല്ല, മറിച്ച് ‘ഓരോരുത്തൻ/ആരെങ്കിലും’ എന്ന വിതരണാർഥത്തിലാണ്. നിഷേധം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യത്തിൽ ‘ആരെങ്കിലും’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֶת אַרְצוֹ
  choice: തന്റെ ദേശത്തെ
  rationale: വിതരണാർഥമുള്ള אִישׁ-നോടു ചേർന്ന ഏകവചന പ്രത്യയം ഓരോ ദേവന്റെയും അതത് ദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘തന്റെ ദേശം’ ഈ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: അധികാരത്തിൽനിന്നോ പിടിയിൽനിന്നോ വിടുവിക്കൽ എന്ന എബ്രായ രൂപകം സംരക്ഷിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിലും മനസ്സിലാകുന്ന പ്രയോഗമാണ്.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവ്
  rationale: എബ്രായ construct പ്രയോഗത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അശ്ശൂർ പ്രതിനിധിയുടെ പരിഹാസവും വെല്ലുവിളിയും ചോദ്യരൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു; ‘കൈയിൽനിന്ന്’ എന്ന ഉറവിടരൂപകവും സംരക്ഷിച്ചു.
