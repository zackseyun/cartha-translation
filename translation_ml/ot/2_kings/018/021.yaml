  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. രാജസദസ്സിലെ പരിഹാസത്തിന്റെ നേരിട്ടുള്ള മൂർച്ചയും ഒടിഞ്ഞ ഞാങ്ങണ കൈ തുളയ്ക്കുന്ന ദൃശ്യത്തിന്റെ ശക്തിയും നിലനിർത്തി.
