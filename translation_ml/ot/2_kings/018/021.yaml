source:
  edition: WLC
  text: עַתָּ֡ה הִנֵּ֣ה בָטַ֣חְתָּ לְּ/ךָ֡ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: ml
  text: നോക്കൂ, ഈ ഒടിഞ്ഞ[a] ഞാങ്ങണവടിയായ ഈജിപ്തിലാണ് നീ ആശ്രയിക്കുന്നത്. ഒരാൾ[b] അതിന്മേൽ ഊന്നിയാൽ, അത് അയാളുടെ കൈപ്പത്തിയിൽ കയറി അതിനെ തുളയ്ക്കും. ഈജിപ്തിലെ രാജാവായ ഫറവോൻ തന്നിൽ ആശ്രയിക്കുന്ന എല്ലാവർക്കും അങ്ങനെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചതഞ്ഞ ഞാങ്ങണവടി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ വിശേഷണം ചതഞ്ഞത്, ഞെരിഞ്ഞത്, ഒടിഞ്ഞത് എന്നിവയെ സൂചിപ്പിക്കാം; ഊന്നുന്നവന്റെ കൈ തുളയ്ക്കുന്ന താങ്ങ് എന്ന ദൃശ്യത്തിന് ‘ഒടിഞ്ഞ’ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ഒരു പുരുഷൻ അതിന്മേൽ ഊന്നിയാൽ.’ ഇവിടെ ഏകവചന പുല്ലിംഗപ്രയോഗം പൊതുവായി ഏതൊരാളെയും സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָטַחְתָּ לְּךָ עַל מִצְרַיִם
  choice: ഈജിപ്തിന്മേലാണ് നീ ആശ്രയിക്കുന്നത്
  rationale: בטח ആശ്രയവും ഭരമേൽപ്പിക്കലും സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ പരിഹാസപ്രയോഗത്തിൽ പൂർത്തിക്രിയയ്ക്ക് വർത്തമാനകാല പ്രാബല്യമുണ്ട്; על എന്നത് ആശ്രയത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഈജിപ്തിന്മേൽ’ എന്നു നൽകി.
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: ഒടിഞ്ഞ ഞാങ്ങണവടി
  rationale: מִשְׁעֶנֶת ഊന്നാൻ ഉപയോഗിക്കുന്ന വടിയെയോ താങ്ങിനെയോ സൂചിപ്പിക്കുന്നു; קָנֶה ഞാങ്ങണയും רָצוּץ ചതഞ്ഞത്, ഒടിഞ്ഞത് എന്നീ അർഥങ്ങളും നൽകുന്നു. പരിക്കേൽപ്പിക്കുന്ന താങ്ങ് എന്ന ദൃശ്യത്തിന് ‘ഒടിഞ്ഞ ഞാങ്ങണവടി’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: ഒരാൾ അതിന്മേൽ ഊന്നിയാൽ
  rationale: נפעל രൂപത്തിലുള്ള סמך താങ്ങിനായി ഊന്നുന്നതാണ്. ആപേക്ഷികവാക്യത്തിലെ നിബന്ധനാഭാവം മലയാളത്തിൽ ‘ഊന്നിയാൽ’ എന്നു വ്യക്തമായി പ്രകടിപ്പിച്ചു; אִישׁ പൊതുവായ അർഥത്തിൽ ‘ഒരാൾ’ എന്നു നൽകി.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: അയാളുടെ ഉള്ളംകൈയിൽ കയറി അതിനെ തുളച്ചുകളയും
  rationale: כַּף ഇവിടെ കൈയുടെ ഉള്ളംഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; בוא കടന്നുകയറുന്നതും נקב തുളയ്ക്കുന്നതുമാണ്. സ്ത്രീലിംഗ പ്രത്യയം ഉള്ളംകൈയിലേക്കു മടങ്ങുന്നതായി നിലനിർത്തി.
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם לְכָל הַבֹּטְחִים עָלָיו
  choice: ഈജിപ്തിലെ രാജാവായ ഫറവോൻ തന്നിൽ ആശ്രയിക്കുന്ന എല്ലാവർക്കും അങ്ങനെയാണ്
  rationale: כֵּן ഉപമയുടെ നിഗമനം അടയാളപ്പെടുത്തുന്നു. לְ ബന്ധമോ ഫലമോ സൂചിപ്പിക്കുന്നതിനാൽ ‘എല്ലാവർക്കും’ എന്നും, עָלָיו ഫറവോനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കാൻ ‘തന്നിൽ’ എന്നും നൽകി.
