  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: ml
  text: ഇപ്പോൾ, ദയവായി, എന്റെ യജമാനനായ അശ്ശൂർരാജാവുമായി ഒരു പന്തയം വെക്കൂ[a]; അവയുടെ മേൽ കയറാൻ നിനക്കായി സവാരിക്കാരെ ഒരുക്കാൻ കഴിയുമെങ്കിൽ, ഞാൻ നിനക്കു രണ്ടായിരം കുതിരകളെ തരാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “എന്റെ യജമാനനുമായി ഒരു ഉടമ്പടിയിൽ ഏർപ്പെടൂ” അല്ലെങ്കിൽ “എന്റെ യജമാനനുമായി ഒരു കരാർ ഉറപ്പിക്കൂ.” എബ്രായക്രിയയ്ക്ക് ഒരു ധാരണയിൽ ഏർപ്പെടുക, സ്വയം പണയംവെക്കുക എന്നീ അർഥങ്ങൾ വരാം; എന്നാൽ ഇവിടെ പരിഹാസത്തോടെയുള്ള ഒരു പന്തയമോ വെല്ലുവിളിയോ ആയിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב נָא
  choice: ഒരു പന്തയം വെക്കൂ
  rationale: ഈ പരിഹാസപരമായ വെല്ലുവിളിയുടെ സന്ദർഭത്തിൽ ഹിത്പയേൽ ക്രിയ ഒരു സാധാരണ ഉടമ്പടിയേക്കാൾ പന്തയമോ വെല്ലുവിളിയോ സൂചിപ്പിക്കുന്നു. נָא കല്പനയെ മയപ്പെടുത്തുന്നുവെങ്കിലും മലയാളത്തിൽ ‘ദയവായി’ എന്നു ചേർത്താൽ പരിഹാസസ്വരം അസ്വാഭാവികമാകാം; അഭ്യർഥനാഭാവം ക്രിയാരൂപത്തിലൂടെ സൂക്ഷിച്ചു.
- source_word: אֶת אֲדֹנִי אֶת מֶלֶךְ אַשּׁוּר
  choice: എന്റെ യജമാനനായ അശ്ശൂർരാജാവുമായി
  rationale: אֶת ഇവിടെ ‘കൂടെ/മായി’ എന്ന ബന്ധം നൽകുന്നു. אֲדֹנִי ദൈവിക ശീർഷകമല്ല, പ്രസംഗകന്റെ മേലധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘യജമാനൻ’ തെരഞ്ഞെടുത്തു.
- source_word: וְאֶתְּנָה לְךָ אַלְפַּיִם סוּסִים
  choice: ഞാൻ നിനക്ക് രണ്ടായിരം കുതിരകളെ തരാം
  rationale: സന്ദർഭത്തിലെ പരിഹാസപരമായ വാഗ്ദാനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: אִם תּוּכַל לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: നിനക്കുവേണ്ടി അവയുടെമേൽ കയറ്റാൻ ആളുകളെ ഒരുക്കാൻ കഴിയുമെങ്കിൽ
  rationale: അക്ഷരാർഥം ‘നിനക്കായി അവയുടെമേൽ സവാരിക്കാരെ കൊടുക്കാൻ’ എന്നാണ്. യെഹൂദയ്ക്ക് മതിയായ കുതിരപ്പടയാളികളില്ലെന്ന പരിഹാസം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളത്തിൽ ‘ആളുകളെ ഒരുക്കുക’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. പ്രസംഗത്തിലെ പരിഹാസസ്വരം നിലനിർത്താൻ ഏകവചന അനൗപചാരിക അഭിസംബോധനയായ ‘നിനക്ക്’ മൂലപാഠത്തിനനുസരിച്ച് സൂക്ഷിച്ചു; നിർണായകമായ ശബ്ദാർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ നൽകി.
