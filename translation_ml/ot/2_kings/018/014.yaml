  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദാരാജാവായ ഹിസ്കീയാവ് ലാഖീശിൽ ഉണ്ടായിരുന്ന[a] അശ്ശൂർരാജാവിന്റെ അടുക്കൽ ആളയച്ചു: “ഞാൻ പാപം ചെയ്തിരിക്കുന്നു. എന്നെ വിട്ടു പിന്മാറണമേ. അങ്ങ് എന്റെമേൽ ചുമത്തുന്നതെന്തും[b] ഞാൻ വഹിച്ചുകൊള്ളാം” എന്നു പറഞ്ഞു. അങ്ങനെ അശ്ശൂർരാജാവ് യെഹൂദാരാജാവായ ഹിസ്കീയാവിന്റെമേൽ മുന്നൂറു താലന്ത് വെള്ളിയും മുപ്പതു താലന്ത് സ്വർണവും ചുമത്തി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ലാഖീശിലേക്കു.” സ്ഥലനാമത്തോടു ചേർന്ന എബ്രായരൂപം അവിടേക്കുള്ള ഗതി സൂചിപ്പിക്കാം; ഇവിടെ അശ്ശൂർരാജാവ് ലാഖീശിൽ ഉണ്ടായിരുന്നുവെന്ന അർഥവും സാധ്യമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അങ്ങ് എന്റെമേൽ വെക്കുന്നതെന്തും ഞാൻ ചുമന്നുകൊള്ളാം/കൊടുത്തുകൊള്ളാം.” എബ്രായം ചുമത്തപ്പെടുന്ന ഭാരമോ കപ്പമോ വഹിക്കുന്നതിനെക്കുറിച്ചാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ചു
  rationale: നേരിട്ട് സന്ദേശം അയച്ചതോ ദൂതന്മാരെ അയച്ചതോ എന്ന് എബ്രായം വ്യക്തമാക്കുന്നില്ല. മലയാളത്തിൽ ആശയവിനിമയത്തിനായി ആളെ അയച്ചുവെന്ന സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: לָכִישָׁה
  choice: ലാഖീശിൽ ഉണ്ടായിരുന്ന
  rationale: ദിശാസൂചകമായ രൂപം അക്ഷരാർഥത്തിൽ ‘ലാഖീശിലേക്കു’ എന്നാകാമെങ്കിലും, വാക്യസന്ദർഭത്തിൽ അശ്ശൂർരാജാവിന്റെ അന്നത്തെ സ്ഥാനം വ്യക്തമാക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം; മറ്റുവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: חָטָאתִי
  choice: ഞാൻ തെറ്റു ചെയ്തിരിക്കുന്നു
  rationale: രാഷ്ട്രീയ കീഴടങ്ങലിന്റെ സാഹചര്യത്തിൽ ‘കുറ്റം/തെറ്റ് ചെയ്തു’ എന്ന സമ്മതമാണ് നേരിട്ടുള്ള പ്രയോഗാർഥം. അതേസമയം ധാർമിക ഭാരം പൂർണമായി മായാത്ത വിധം ‘തെറ്റു ചെയ്തു’ എന്നു നൽകി; ‘പാപം ചെയ്തു’ എന്ന സാധ്യത വ്യാഖ്യാനപരമായി കൂടുതൽ മതപരമായി കേൾക്കും.
- source_word: שׁוּב מֵעָלַי
  choice: എന്നെ വിട്ടു പിന്മാറണമേ
  rationale: ശത്രുതാപരമായ സൈനിക സമ്മർദത്തിൽനിന്നു തിരിഞ്ഞുപോകണമെന്ന അപേക്ഷ മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായി നൽകുന്നു.
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי
  choice: അങ്ങ് എന്റെമേൽ ചുമത്തുന്നതെന്തും
  rationale: ചുങ്കം, പിഴ, കപ്പം എന്നിവയിൽ ഒന്നായി അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ, മേൽ ചുമത്തുന്ന ബാധ്യത എന്ന വിശാലമായ എബ്രായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: אֶשָּׂא
  choice: ഞാൻ വഹിച്ചുകൊള്ളാം
  rationale: נשא എന്ന ക്രിയയുടെ ‘വഹിക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പണം കൊടുക്കുമെന്ന അർഥം ഉൾപ്പെടുന്നുവെങ്കിലും അതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: וַיָּשֶׂם ... עַל
  choice: മേൽ ... ചുമത്തി
  rationale: മുൻവാക്യത്തിലെ ബാധ്യത ചുമത്തൽ എന്ന ഭാഷയുമായി പദസമന്വയം പുലർത്തുകയും കപ്പം നിർണയിച്ചതെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: כִּכַּר
  choice: താലന്ത്
  rationale: പുരാതന ഭാരമാനത്തിന്റെ പരമ്പരാഗത ബൈബിൾ പദം; സംഖ്യയും ലോഹവും ഭാരപ്രകാരം കണക്കാക്കിയതാണെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: כֶּסֶף / זָהָב
  choice: വെള്ളി / സ്വർണം
  rationale: പണമായി പൊതുവാക്കാതെ മൂലപാഠം പറയുന്ന പ്രത്യേക ലോഹങ്ങൾ കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഹിസ്കീയാവിന്റെ സമ്മതത്തിലെ ധാർമികവും രാഷ്ട്രീയവുമായ ഭാരം
  choice: “ഞാൻ തെറ്റു ചെയ്തിരിക്കുന്നു”
  alternative: “ഞാൻ പാപം ചെയ്തിരിക്കുന്നു” / “ഞാൻ കുറ്റം ചെയ്തിരിക്കുന്നു”
  rationale: חטא സാധാരണയായി ‘പാപം ചെയ്യുക’ എന്ന ശക്തമായ അർഥം വഹിക്കുമെങ്കിലും, ഇവിടെ മേലധികാരിയോടുള്ള രാഷ്ട്രീയ ലംഘനം സമ്മതിക്കുന്ന നയതന്ത്രസന്ദർഭമാണ്. ‘തെറ്റു ചെയ്തു’ എന്നത് ആ സന്ദർഭത്തിൽ സ്വാഭാവികവും ധാർമിക ഉത്തരവാദിത്വം നിലനിർത്തുന്നതുമാണ്; പ്രത്യേക മതശാസ്ത്ര വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- issue: ചുമത്തപ്പെടുന്ന ബാധ്യതയുടെ സ്വഭാവം
  choice: “ചുമത്തുന്നതെന്തും ഞാൻ വഹിച്ചുകൊള്ളാം”
  alternative: “ചുമത്തുന്ന കപ്പം ഞാൻ കൊടുക്കാം” / “വിധിക്കുന്ന പിഴ ഞാൻ അടയ്ക്കാം”
  rationale: മൂലപാഠം ആദ്യം ബാധ്യതയെ വിശാലമായി അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള വെള്ളിയുടെയും സ്വർണത്തിന്റെയും അളവുകളാണ് അത് സാമ്പത്തിക കപ്പമാണെന്ന് വ്യക്തമാക്കുന്നത്. അതിനാൽ ആദ്യവാചകത്തിൽ അർഥം അനാവശ്യമായി ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. രാജാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ എന്നും അപേക്ഷയിൽ ‘ണമേ’ എന്നും ഉപയോഗിച്ചു. പുരാതന ഭാരമാനം ‘താലന്ത്’ എന്ന പരമ്പരാഗത രൂപത്തിൽ നിലനിർത്തി; യഥാർഥ അസ്പഷ്ടതകൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
