  text: In the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ രാജാവായ ഏലായുടെ മകൻ ഹോശേയയുടെ ഭരണകാലത്തിന്റെ മൂന്നാം വർഷത്തിൽ, ആഹാസിന്റെ മകൻ ഹിസ്കീയാവ് യെഹൂദയുടെ രാജാവായി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഭരിക്കാൻ തുടങ്ങി.” ഹീബ്രുവിലെ ഈ രാജഭരണസൂത്രത്തിലെ ക്രിയ ഹിസ്കീയാവ് സിംഹാസനമേറി ഭരണം ആരംഭിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ കാലസൂചനയുള്ള വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: ഇവിടെ ഈ രൂപം പുതിയ വിവരണഘട്ടത്തിലേക്കുള്ള ആഖ്യാനപരമായ ബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; മൂലത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലക്രിയാവിശേഷണം ഇല്ലാത്തതിനാൽ മലയാളത്തിൽ ‘ഇപ്പോൾ’ എന്ന പദം ചേർത്തില്ല.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: മൂന്നാം വർഷത്തിൽ
  rationale: രാജാക്കന്മാരുടെ ഭരണവർഷം സൂചിപ്പിക്കുന്ന പതിവ് കാലനിർണ്ണയപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְהוֹשֵׁעַ בֶּן אֵלָה
  choice: ഏലായുടെ മകൻ ഹോശേയയുടെ ഭരണത്തിന്റെ
  rationale: לְ ഇവിടെ ഭരണവർഷത്തിന്റെ അവലംബം സൂചിപ്പിക്കുന്നു. ‘ഭരണത്തിന്റെ’ എന്നു വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ ‘മൂന്നാം വർഷം’ ആരുടെ ഭരണകാലത്തേതാണെന്ന് അനായാസം ഗ്രഹിക്കാൻ സഹായിക്കുന്നു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ
  rationale: ഹോശേയയുടെ പദവിയും രാജ്യവും വ്യക്തമാക്കുന്ന വിശേഷണഘടന സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: രാജസിംഹാസനാരോഹണം സൂചിപ്പിക്കുന്ന ഈ ഭരണസൂത്രവാക്യത്തിന്റെ ആരംഭാർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ‘ഭരിച്ചു’ എന്നു മാത്രം പറഞ്ഞാൽ പ്രവേശനഘട്ടം മങ്ങിപ്പോകാം.
- source_word: חִזְקִיָּה
  choice: ഹിസ്കീയാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: בֶן אָחָז
  choice: ആഹാസിന്റെ മകൻ
  rationale: പിതൃബന്ധം നേരായും സ്വാഭാവികമായും രേഖപ്പെടുത്തുന്നു.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദയുടെ രാജാവായി
  rationale: ഹീബ്രുവിലെ പദവിസൂചനയെ മലയാളത്തിൽ ആവർത്തനമില്ലാതെ ഹിസ്കീയാവിന്റെ സിംഹാസനാരോഹണവുമായി ചേർത്തു.
