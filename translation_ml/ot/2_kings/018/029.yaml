  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ אַל יַשִּׁ֥יא לָ/כֶ֖ם חִזְקִיָּ֑הוּ כִּי לֹ֣א יוּכַ֔ל לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
translation:
  language: ml
  text: 'രാജാവ് ഇപ്രകാരം പറയുന്നു: ഹിസ്കീയാവ് നിങ്ങളെ വഞ്ചിക്കാൻ അനുവദിക്കരുത്[a], കാരണം അവന്റെ കൈയിൽനിന്ന് നിങ്ങളെ വിടുവിക്കാൻ ഹിസ്കീയാവിന് കഴിയുകയില്ല[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഹിസ്കീയാവ് നിങ്ങളെ വഴിതെറ്റിക്കാൻ അനുവദിക്കരുത്.’ ഹീബ്രു ക്രിയയ്ക്ക് വഴിതെറ്റിക്കുക അല്ലെങ്കിൽ വഞ്ചിക്കുക എന്നർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, ‘അവന്റെ കൈയിൽനിന്ന്’; ഇത് ഒരാളുടെ അധികാരത്തിൽനിന്ന് എന്നർഥമുള്ള പ്രയോഗമാണ്. യെശയ്യാവ് 36:14-ലെ സമാന്തരപാഠത്തിൽ ‘എന്റെ കൈയിൽനിന്ന്’ എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: രാജാവ് ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ഔദ്യോഗിക രാജകീയ പ്രഖ്യാപനത്തിന്റെ ദൂതസൂത്രം നിലനിർത്തുന്നു. ‘അരുളിച്ചെയ്യുന്നു’ ആധുനിക മലയാളത്തിൽ ഗൗരവമുള്ള രാജകീയ ഭാഷയായി സ്വാഭാവികമാണ്.
- source_word: אַל יַשִּׁיא לָכֶם
  choice: നിങ്ങളെ വഞ്ചിക്കാതിരിക്കട്ടെ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘വഴിതെറ്റിക്കുക/വഞ്ചിക്കുക’ എന്ന ആശയം വ്യക്തമാക്കുന്നു; ഇവിടെ തെറ്റായ പ്രത്യാശ നൽകുന്നു എന്ന ആരോപണത്തിന് ‘വഞ്ചിക്കുക’ യോജിക്കുന്നു.
- source_word: חִזְקִיָּהוּ
  choice: ഹിസ്കീയാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിക്കുന്നു.
- source_word: כִּי לֹא יוּכַל
  choice: കഴിയുകയില്ല
  rationale: അസമർഥതയെക്കുറിച്ചുള്ള ഭാവിമുഖമായ ഉറച്ച അവകാശവാദം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לְהַצִּיל
  choice: വിടുവിക്കാൻ
  rationale: സൈനിക-രാഷ്ട്രീയ അപകടത്തിൽനിന്നുള്ള മോചനത്തെ സൂചിപ്പിക്കുകയും ബൈബിൾ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുകയും ചെയ്യുന്നു.
- source_word: מִיָּדוֹ
  choice: അവന്റെ കൈയിൽനിന്ന്
  rationale: ഹീബ്രു പാഠത്തിലെ മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും ‘കൈ’ എന്ന അധികാരസൂചക രൂപകവും അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: מִיָּדוֹ എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ‘അവന്റെ കൈയിൽനിന്ന്’ എന്ന് ഹീബ്രു WLC പാഠത്തിലെ മൂന്നാംപുരുഷ രൂപം പിന്തുടരുന്നു.
  alternative: യെശയ്യാവ് 36:14-ലെ സമാന്തരപാഠംപോലെ ‘എന്റെ കൈയിൽനിന്ന്’; അല്ലെങ്കിൽ അർത്ഥവ്യാഖ്യാനമായി ‘അവന്റെ അധികാരത്തിൽനിന്ന്’.
  rationale: നൽകിയിരിക്കുന്ന മൂലപാഠത്തെ സമാന്തരവാക്യത്തോട് ഒത്തുചേർക്കാതെ പിന്തുടരുന്നു. ‘കൈ’ അധികാരത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും രൂപകം നിലനിർത്തുന്നത് പാഠത്തിന്റെ ഭാഷയും സാധ്യതയുള്ള സൂചനയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. രാജകീയ പ്രഖ്യാപനത്തിന് ‘ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചു. ‘അവന്റെ കൈയിൽനിന്ന്’ എന്ന ഹീബ്രു രൂപകം സംരക്ഷിച്ചു; അടിക്കുറിപ്പുകൾ [a], [b] പ്രധാന പാഠത്തിൽ ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
