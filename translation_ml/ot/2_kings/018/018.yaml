source:
  edition: WLC
  text: וַֽ/יִּקְרְאוּ֙ אֶל הַ/מֶּ֔לֶךְ וַ/יֵּצֵ֧א אֲלֵ/הֶ֛ם אֶלְיָקִ֥ים בֶּן חִלְקִיָּ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/שֶׁבְנָה֙ הַ/סֹּפֵ֔ר וְ/יוֹאָ֥ח בֶּן אָסָ֖ף הַ/מַּזְכִּֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/018.yaml
  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
translation:
  language: ml
  text: അവർ രാജാവിനെ വിളിച്ചു. അപ്പോൾ കൊട്ടാരത്തിന്റെ ചുമതലയുള്ള[b] ഹിൽക്കീയാവിന്റെ മകൻ എല്യാക്കീമും, ലേഖകനായ ശെബ്നയും[a], രേഖാപാലകനായ ആസാഫിന്റെ മകൻ യോവാഹും അവരുടെ അടുക്കലേക്കു പുറത്തുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലേഖകൻ’ എന്നതിന് ‘കാര്യദർശി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘കൊട്ടാരത്തിന്റെ ചുമതലയുള്ളവൻ’ എന്നത് ഒരു രാജകീയ ഭരണപദവിയാണ്; അക്ഷരാർഥത്തിൽ, ‘വീടിന്റെ മേൽ ഉള്ളവൻ.’
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  choice: അവർ രാജാവിനെ വിളിച്ചു
  rationale: קרא אל എന്നത് ഒരാളോടു വിളിക്കുക എന്നോ ഒരാളെ വരാൻ വിളിക്കുക എന്നോ അർഥമാക്കാം. ഈ നയതന്ത്രസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘രാജാവിനെ വിളിച്ചു’ എന്നത് ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וַיֵּצֵא אֲלֵהֶם
  choice: അവരുടെ അടുക്കൽ പുറത്തേക്കു വന്നു
  rationale: יצא എന്നതിന് ‘പുറത്തേക്കു പോകുക/വരുക’ എന്ന ഇരുവിധ ദൃഷ്ടികോണപ്രയോഗവും സാധ്യമാണ്. നഗരത്തിനകത്തുനിന്ന് പ്രതിനിധികളുടെ അടുക്കലേക്കുള്ള നീക്കം വ്യക്തമാക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: ഹിൽക്കീയാവിന്റെ മകൻ എല്യാക്കീം
  rationale: എബ്രായ പിതൃനാമഘടന മലയാളത്തിലെ സ്വാഭാവിക ബന്ധിവിഭക്തിയിലൂടെ സംരക്ഷിച്ചു; പേരുകൾ ലിപ്യന്തരിച്ചു.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: കൊട്ടാരത്തിന്റെ ചുമതലക്കാരനായ
  rationale: ഇത് രാജകീയ ഭരണപദവിയാണ്. ‘വീടിന്റെ മേൽ’ എന്ന പദാനുപദ രൂപത്തേക്കാൾ സന്ദർഭത്തിലെ രാജകൊട്ടാരഭരണ ചുമതല സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: הַסֹּפֵר
  choice: എഴുത്തുകാരനായ
  rationale: סֹפֵר രാജസഭയിലെ എഴുത്ത്/സെക്രട്ടേറിയൽ ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു. ‘എഴുത്തുകാരൻ’ സുതാര്യമായ പരമ്പരാഗത പദമാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וְיוֹאָח בֶּן אָסָף
  choice: ആസാഫിന്റെ മകൻ യോവാഹും
  rationale: പേരുകൾ ലിപ്യന്തരിച്ചു; എബ്രായ പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
- source_word: הַמַּזְכִּיר
  choice: രേഖാപാലകനായ
  rationale: രാജകീയ രേഖകളും ഔദ്യോഗിക സ്മരണപ്പത്രങ്ങളും കൈകാര്യം ചെയ്ത ഉദ്യോഗസ്ഥപദവിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
