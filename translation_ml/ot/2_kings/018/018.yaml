translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും എളുപ്പം മനസ്സിലാക്കാവുന്നതുമായ ശൈലി. ഉദ്യോഗപ്പേരുകൾ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കി; മൂലത്തിലെ നീണ്ട ഏകവാക്യം മലയാളവായനാസൗകര്യത്തിന് രണ്ട് വാക്യങ്ങളാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പ്രധാനവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
