source:
  edition: WLC
  text: וַ/יִּתֵּן֙ חִזְקִיָּ֔ה אֶת כָּל הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בֵית יְהוָ֑ה וּ/בְ/אֹצְר֖וֹת בֵּ֥ית הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/015.yaml
  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
translation:
  language: ml
  text: അങ്ങനെ ഹിസ്കീയാവ് യഹോവയുടെ ആലയത്തിലും രാജകൊട്ടാരത്തിലെ ഭണ്ഡാരങ്ങളിലും ഉണ്ടായിരുന്ന വെള്ളി മുഴുവനും കൊടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വെള്ളി’ എന്നതിന് ‘പണം’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘യഹോവയുടെ ആലയം’, ‘രാജകൊട്ടാരം’ എന്നിവയുടെ അക്ഷരാർഥം യഥാക്രമം ‘യഹോവയുടെ ഭവനം’, ‘രാജാവിന്റെ ഭവനം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ ‘കൊടുക്കുക/കൈമാറുക’ എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; കപ്പം നൽകിയ പശ്ചാത്തലം ഉണ്ടെങ്കിലും ‘അടച്ചു’ എന്ന് ഇടപാടിന്റെ സ്വഭാവം അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: חִזְקִיָּה
  choice: ഹിസ്കീയാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: כָּל
  choice: മുഴുവനും
  rationale: സ്രോതസ്സിലെ സമഗ്രത വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הַכֶּסֶף
  choice: വെള്ളി
  rationale: כֶּסֶף എന്ന പദത്തിന്റെ പ്രാഥമികവും മൂർത്തവുമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘പണം’ എന്നും മനസ്സിലാക്കാം.
- source_word: הַנִּמְצָא
  choice: ഉണ്ടായിരുന്ന
  rationale: നിഫാൽ പങ്കാളിപദത്തിന്റെ ‘കണ്ടെത്തപ്പെട്ടത്/ലഭ്യമായിരുന്നത്’ എന്ന ഫലം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; യാദൃച്ഛികമായി കണ്ടെത്തി എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: בֵית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: അക്ഷരാർഥം ‘യഹോവയുടെ ഭവനം’ ആണെങ്കിലും ഇവിടെ ദേവാലയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘ആലയം’ സ്വീകരിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וּבְאֹצְרוֹת
  choice: ഭണ്ഡാരങ്ങളിലും
  rationale: אֹצָר എന്നത് സമ്പത്ത് സൂക്ഷിക്കുന്ന ഭണ്ഡാരത്തെയോ കലവറയെയോ സൂചിപ്പിക്കാം; സാമ്പത്തിക സന്ദർഭത്തിൽ ‘ഭണ്ഡാരം’ യോജിക്കുന്നു.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജകൊട്ടാരത്തിലെ
  rationale: അക്ഷരാർഥം ‘രാജാവിന്റെ ഭവനം’; ഈ സന്ദർഭത്തിൽ രാജകീയ കൊട്ടാരസമുച്ചയം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: സ്രോതസ്സ് വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം നിലനിർത്തി.
- issue: בֵית יְהוָה എന്ന പ്രയോഗം
  choice: യഹോവയുടെ ആലയം
  alternative: യഹോവയുടെ ഭവനം
  rationale: ‘ഭവനം’ എന്ന രൂപകം സാധ്യമാണെങ്കിലും ചരിത്രസന്ദർഭത്തിലെ ദേവാലയത്തെ സാധാരണ വായനക്കാരന് വ്യക്തമായി അറിയിക്കാൻ ‘ആലയം’ ഉപയോഗിച്ചു; പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആലയം’, ‘രാജകൊട്ടാരം’ എന്നിവ അക്ഷരഘടനയെക്കാൾ സന്ദർഭാർഥത്തിന് മുൻഗണന നൽകുന്നു; [a] സ്രോതസ്സിലെ പദരൂപങ്ങളും כֶּסֶף എന്നതിന്റെ അർഥവൈകല്യവും രേഖപ്പെടുത്തുന്നു.
