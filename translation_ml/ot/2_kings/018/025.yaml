id: 2KI.18.25
reference: 2 Kings 18:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה לְ/הַשְׁחִת֑/וֹ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה עַל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: ml
  text: 'ഇപ്പോൾ[a], യഹോവയെ കൂടാതെയാണോ ഞാൻ ഈ സ്ഥലത്തിനെതിരെ കയറിവന്ന് അതിനെ നശിപ്പിക്കാൻ വന്നത്? യഹോവ എന്നോടു പറഞ്ഞു: ‘ഈ ദേശത്തിനെതിരെ ചെന്ന് അതിനെ നശിപ്പിക്കുക.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയില്ലാതെ’ അല്ലെങ്കിൽ ‘യഹോവയിൽനിന്ന് സ്വതന്ത്രമായി’.
    reason: ‘യഹോവയെ കൂടാതെ’ എന്നതിന് സാധ്യമായ പദാർഥപരമായ ബദലുകൾ.
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: യഹോവയെ കൂടാതെയാണോ
  rationale: ചോദ്യകണമായ הֲയും מִבַּלְעֲדֵיയും ചേർന്നുള്ള ആലങ്കാരിക ചോദ്യം നിലനിർത്തുന്നു; ദൈവത്തിൽനിന്ന് സ്വതന്ത്രമായാണോ എന്ന ആശയവും വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം സാധാരണ മലയാള ബൈബിൾ പ്രയോഗത്തിന് യോജിച്ച വിധത്തിൽ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: עָלִיתִי
  choice: വന്നത്
  rationale: עלה എന്നതിന്റെ ‘കയറിവരുക/വരുക’ എന്ന ചലനാർഥം സംസാരിക്കുന്നവന്റെ കാഴ്ചപ്പാടിൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അതിനെതിരെ’ എന്ന ഘടന സൈനികസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലം
  rationale: മָקוֹם എന്ന പൊതുവായ പദം യെരൂശലേം എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: לְהַשְׁחִיתוֹ
  choice: അതിനെ നശിപ്പിക്കാൻ
  rationale: שׁחת എന്ന ഹിഫീൽ രൂപത്തിന്റെ നാശകപ്രവർത്തനാർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אָמַר אֵלַי
  choice: എന്നോട് അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ നേരിട്ടുള്ള വാക്കെന്ന അവകാശവാദം മാന്യമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: עֲלֵה
  choice: ചെന്ന്
  rationale: עלה എന്ന ആജ്ഞാരൂപത്തിന്റെ മുന്നേറ്റാർഥം ‘ഈ ദേശത്തിനെതിരെ’ എന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഭൂമിശാസ്ത്രപരമായ ‘മുകളിലേക്ക്’ എന്നത് അനാവശ്യമായി മുൻനിറുത്തുന്നില്ല.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശം
  rationale: אֶרֶץ എന്നത് ഈ അധിനിവേശസന്ദർഭത്തിൽ ‘ദേശം’ എന്നു നൽകുന്നു; ‘ഈ സ്ഥലം’ എന്ന മുൻപത്തെ വ്യത്യസ്ത നാമപദത്തിൽനിന്നുള്ള ഭേദം നിലനിർത്തുന്നു.
- source_word: וְהַשְׁחִיתָהּ
  choice: അതിനെ നശിപ്പിക്കുക
  rationale: മുൻപത്തെ שׁחת രൂപവുമായുള്ള പദബന്ധം ആവർത്തിച്ചുള്ള ‘നശിപ്പിക്കുക’ വഴി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപദത്തിനു പകരം മലയാളത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം നിലനിർത്തുന്നു.
- issue: ‘ഈ സ്ഥലം’, ‘ഈ ദേശം’ എന്നിവയുടെ സൂചിതാർത്ഥം പരിഭാഷയിൽ വ്യക്തമാക്കണമോ
  choice: മൂലത്തിലെ പൊതുവായ പ്രയോഗങ്ങൾ നിലനിർത്തുക
  alternative: യെരൂശലേം; യെഹൂദാ
  rationale: മൂലപാഠത്തിലെ מָקוֹם, אֶרֶץ എന്നീ വ്യത്യസ്ത പദങ്ങൾ സംരക്ഷിക്കുകയും സൂചിതസ്ഥലത്തെ വ്യാഖ്യാനപരമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: അശ്ശൂർ പ്രതിനിധിയുടെ ദൈവിക അധികാരവാദത്തിന്റെ സത്യാവസ്ഥ
  choice: അവകാശവാദം നേരിട്ടുള്ള ഉദ്ധരണിയായി മാത്രം അവതരിപ്പിക്കുക
  alternative: അത് സത്യമാണെന്നോ വ്യാജമാണെന്നോ പരിഭാഷയിൽ സൂചിപ്പിക്കുക
  rationale: വാക്യം പ്രസംഗകന്റെ അവകാശവാദം രേഖപ്പെടുത്തുന്നു; അതിന്റെ സത്യാവസ്ഥയെ പരിഭാഷ സ്വയം വിധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള പ്രസംഗശൈലി. ‘അരുളിച്ചെയ്തു’ ദൈവവചനസന്ദർഭത്തിലെ ഗൗരവം നൽകുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതാണ്.
