  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ֚י בְּ/כָל אֱלֹהֵ֣י הָֽ/אֲרָצ֔וֹת אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/035.yaml
  text: Who among all the gods of the lands has delivered their land from my hand[a], that Yahweh should deliver Jerusalem from my hand?
translation:
  language: ml
  text: ദേശങ്ങളിലെ[a] സകല ദേവന്മാരിലും ആരാണ് അവരവരുടെ ദേശത്തെ എന്റെ കൈയിൽനിന്ന് രക്ഷിച്ചിട്ടുള്ളത്—യാഹ്‌വേ യെരൂശലേമിനെ എന്റെ കൈയിൽനിന്ന് രക്ഷിക്കുമെന്നോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദേശങ്ങൾ’ എന്നത് ‘രാജ്യങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  choice: ദേശങ്ങളിലെ സകല ദേവന്മാരിലും ആരാണ്
  rationale: מִי എന്ന ചോദ്യംചെയ്യുന്ന സർവനാമവും בְּכָל എന്ന ഭാഗികാർഥവും സ്വാഭാവിക മലയാളത്തിൽ ‘സകല ... ദേവന്മാരിലും ആരാണ്’ എന്നു നൽകി. הָאֲרָצוֹת ഇവിടെ ഭൂമി മുഴുവനെയല്ല, വിവിധ ദേശങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הִצִּילוּ אֶת אַרְצָם
  choice: തങ്ങളുടെ ദേശത്തെ രക്ഷിച്ചിട്ടുള്ളത്
  rationale: נצל എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ ‘രക്ഷിക്കുക/വിടുവിക്കുക’ എന്ന അർഥം ‘രക്ഷിക്കുക’ എന്നു നൽകി. ബഹുവചനപ്രത്യയമുള്ള אַרְצָם വിവിധ ദേവന്മാരുമായി ബന്ധപ്പെട്ട ദേശങ്ങളെ വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നതിനാൽ ‘തങ്ങളുടെ ദേശത്തെ’ എന്നു നിലനിർത്തി.
- source_word: מִיָּדִי
  choice: എന്റെ കൈയിൽനിന്ന്
  rationale: അധികാരത്തെയും നിയന്ത്രണത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും വ്യക്തമായതിനാൽ അക്ഷരാർഥത്തിലുള്ള പ്രയോഗം നിലനിർത്തി.
- source_word: כִּי יַצִּיל
  choice: —രക്ഷിക്കുമെന്നോ?
  rationale: כִּי ഇവിടെ റബ്-ശാക്കെയുടെ പരിഹാസപൂർണമായ വെല്ലുവിളിയുടെ നിഗമനത്തിലേക്ക് നയിക്കുന്നു. യַצִּיל എന്ന അപൂർണക്രിയയുടെ പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവിക്രിയ സ്വാഭാവികമായ ചോദ്യംരൂപത്തിൽ നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: יְרוּשָׁלִַם
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ രൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവെക്കാതെ ലിപ്യന്തരിച്ചു.
- issue: വിദേശദേവന്മാരുടെ രക്ഷാശക്തിയെക്കുറിച്ചുള്ള പ്രസ്താവന
  choice: പരിഹാസപൂർണമായ വാചാടോപചോദ്യമായി നിലനിർത്തി
  alternative: ഒരു ദൈവത്തിനും രക്ഷിക്കാനായില്ലെന്ന വിശദീകരണപ്രസ്താവന
  rationale: വക്താവിന്റെ അഹങ്കാരപരമായ വെല്ലുവിളിയാണ് പാഠത്തിൽ ഉള്ളത്; അതിനെ വിവർത്തകൻ അംഗീകരിക്കുന്ന ദൈവശാസ്ത്രപ്രസ്താവനയായി മാറ്റാതെ ചോദ്യരൂപവും സംഘർഷവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും വായനാസൗകര്യമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. രണ്ട് ഘടകങ്ങളുള്ള ഏക വാചാടോപചോദ്യത്തിന്റെ തീവ്രത ദീർഘവിരാമചിഹ്നത്തിലൂടെ നിലനിർത്തി; ‘എന്റെ കൈയിൽനിന്ന്’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ ഊന്നലിനായി സംരക്ഷിച്ചു.
