  text: וַ/יֶּ֧גֶל מֶֽלֶךְ אַשּׁ֛וּר אֶת יִשְׂרָאֵ֖ל אַשּׁ֑וּרָ/ה וַ/יַּנְחֵ֞/ם בַּ/חְלַ֧ח וּ/בְ/חָב֛וֹר נְהַ֥ר גּוֹזָ֖ן וְ/עָרֵ֥י מָדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/011.yaml
  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
translation:
  language: ml
  text: അശ്ശൂർ രാജാവ് ഇസ്രായേലിനെ[b] അശ്ശൂരിലേക്കു നാടുകടത്തി; അവരെ ഹലഹിലും ഗോസാനിലെ നദിയായ ഹാബോറിലും[a] മേദ്യരുടെ നഗരങ്ങളിലും പാർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഹലഹിലും ഗോസാനിലെ ഹാബോർ നദിയുടെ സമീപത്തും.” സ്ഥലസൂചകത്തിന്റെ അർഥം ‘കരയിൽ,’ ‘സമീപത്ത്,’ അല്ലെങ്കിൽ ‘പ്രദേശത്ത്’ എന്നിങ്ങനെ മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ഇസ്രായേൽ” എന്നു പറയുന്നത് വടക്കൻ രാജ്യത്തെയും നാടുകടത്തപ്പെട്ട അതിലെ ജനങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: നാടുകടത്തി
  rationale: גלה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ബലമായി സ്വദേശത്തുനിന്ന് നീക്കി പ്രവാസത്തിലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നാടുകടത്തി’ ഈ രാഷ്ട്രീയവും നിർബന്ധിതവുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവ്
  rationale: എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ
  rationale: വടക്കൻ രാജ്യം എന്ന സമൂഹ-രാഷ്ട്രീയ ഏകകത്തെ സൂചിപ്പിക്കുന്ന ‘ഇസ്രായേൽ’ എന്ന മൂലപദത്തിന്റെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: אַשּׁוּרָה
  choice: അശ്ശൂരിലേക്കു
  rationale: ദിശാസൂചകമായ ה പ്രത്യയം അശ്ശൂരിലേക്കുള്ള നീക്കത്തെ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּנְחֵם
  choice: അവരെ … പാർപ്പിച്ചു
  rationale: നിർബന്ധിതമായി മാറ്റിക്കൊണ്ടുവന്ന ജനങ്ങളെ നിശ്ചിത സ്ഥലങ്ങളിൽ താമസിപ്പിച്ചുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּחְלַח
  choice: ഹലഹിൽ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: וּבְחָבוֹר
  choice: ഹാബോർ നദിക്കരയിൽ
  rationale: തുടർന്നുള്ള ‘നദി’ എന്ന സമാനാധികരണത്തെ മുൻനിർത്തി, ഭൂമിശാസ്ത്രപരമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഹാബോറിൽ’ എന്നും വ്യാഖ്യാനിക്കാം.
- source_word: נְהַר גּוֹזָן
  choice: ഗോസാനിലെ ഹാബോർ നദി
  rationale: നിർമാണബന്ധം ഹാബോർ നദിയെ ഗോസാനുമായി ബന്ധിപ്പിക്കുന്നു. ‘ഗോസാനിലെ’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമാണ്.
- source_word: וְעָרֵי מָדָי
  choice: മേദ്യരുടെ പട്ടണങ്ങളിൽ
  rationale: മൂലത്തിലെ ജനവിഭാഗസൂചന നേരിട്ട് നിലനിർത്തുന്നു; ‘മേദ്യദേശത്തിലെ പട്ടണങ്ങളിൽ’ എന്നതും സാധ്യമാണ്.
