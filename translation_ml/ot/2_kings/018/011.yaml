translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിർബന്ധിത പ്രവാസത്തിന്റെ രാഷ്ട്രീയസ്വഭാവം ‘നാടുകടത്തി’ എന്നും പുനരധിവാസം ‘പാർപ്പിച്ചു’ എന്നും നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
