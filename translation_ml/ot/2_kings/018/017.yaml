source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֡וּר אֶת תַּרְתָּ֥ן וְ/אֶת רַב סָרִ֣יס וְ/אֶת רַב שָׁקֵ֨ה מִן לָכִ֜ישׁ אֶל הַ/מֶּ֧לֶךְ חִזְקִיָּ֛הוּ בְּ/חֵ֥יל כָּבֵ֖ד יְרוּשָׁלִָ֑ם וַֽ/יַּעֲלוּ֙ וַ/יָּבֹ֣אוּ יְרוּשָׁלִַ֔ם וַ/יַּעֲל֣וּ וַ/יָּבֹ֗אוּ וַ/יַּֽעַמְדוּ֙ בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָֽ/עֶלְיוֹנָ֔ה אֲשֶׁ֕ר בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
translation:
  language: ml
  text: അപ്പോൾ അശ്ശൂർരാജാവ് തർത്താനെയും[a] റബ്-സാരീസിനെയും റബ്-ശാക്കേയെയും ലാഖീശിൽനിന്ന് ഒരു വലിയ സൈന്യത്തോടുകൂടെ യെരൂശലേമിലുള്ള ഹിസ്കീയാരാജാവിന്റെ അടുക്കലേക്ക് അയച്ചു. അവർ കയറിച്ചെന്ന് യെരൂശലേമിൽ എത്തി; അവർ കയറിവന്ന് അലക്കുകാരന്റെ വയലിലെ പെരുവഴിയിലുള്ള മേൽക്കുളത്തിന്റെ ജലവാഹിനിക്കരികിൽ നിന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തർത്താൻ,” “റബ്-സാരീസ്,” “റബ്-ശാക്കേ” എന്നിവ വ്യക്തിനാമങ്ങളേക്കാൾ അശ്ശൂർ ഉദ്യോഗപദവികളായിരിക്കാം. അവ യഥാക്രമം “സർവസൈന്യാധിപൻ,” “മുഖ്യ ഉദ്യോഗസ്ഥൻ/മുഖ്യ ഷണ്ഡൻ,” “മുഖ്യ പാനപാത്രവാഹകൻ” അല്ലെങ്കിൽ മറ്റൊരു ഉന്നത ഉദ്യോഗസ്ഥൻ എന്നിങ്ങനെ അർഥമാക്കാം.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ, “വസ്ത്രം വെളുപ്പിക്കുന്നവന്റെ വയൽ”; പരമ്പരാഗതമായി “അലക്കുകാരന്റെ വയൽ” എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְתָּן
  choice: തർത്താൻ
  rationale: കൃത്യമായ ചുമതല അനിശ്ചിതമായതിനാൽ അശ്ശൂർ ഭരണപദവി ലിപ്യന്തരണം ചെയ്തു.
- source_word: רַב סָרִיס
  choice: റബ്-സാരീസ്
  rationale: ‘മുഖ്യ ഷണ്ഡൻ’ എന്നോ ‘മുഖ്യ ഉദ്യോഗസ്ഥൻ’ എന്നോ തീർപ്പാക്കാതെ വിദേശ രാജസദസ്സിലെ പദവി നിലനിർത്തുന്നു.
- source_word: רַב שָׁקֵה
  choice: റബ്-ശാക്കേ
  rationale: പ്രവർത്തനപരമായ തർജമകൾ വ്യത്യസ്തമായതിനാൽ അശ്ശൂർ പദവി ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּחֵיל כָּבֵד
  choice: ഒരു വലിയ സൈന്യത്തോടുകൂടെ
  rationale: സൈനികസന്ദർഭത്തിലെ חַיִל-നെയും അതിന്റെ വലുപ്പം ഊന്നുന്ന כָּבֵד-നെയും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ
  choice: അവർ കയറിച്ചെന്ന് ... എത്തി; അവർ കയറിവന്ന്
  rationale: യെരൂശലേമിലേക്കുള്ള കയറ്റവും എബ്രായത്തിലെ ആവർത്തനവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: תְעָלַת
  choice: ജലവാഹിനി
  rationale: കുളവുമായി ബന്ധപ്പെട്ട വെള്ളച്ചാൽ അഥവാ conduit എന്ന ഭൂപ്രകൃതിപരമായ അർഥം നൽകുന്നു.
- source_word: הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: മേൽക്കുളം
  rationale: സ്ഥിരമായ ഭൂപ്രദേശനാമത്തിന് സംക്ഷിപ്തവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: מְסִלַּת
  choice: പാത
  rationale: നിർമിതമായ റോഡ്/പെരുവഴി എന്ന ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׂדֵה כוֹבֵס
  choice: അലക്കുകാരന്റെ വയൽ
  rationale: വസ്ത്രം കഴുകുകയോ വെളുപ്പിക്കുകയോ ചെയ്യുന്ന തൊഴിലാളിയെ ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു.
