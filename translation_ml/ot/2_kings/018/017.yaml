translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള കഥനശൈലി ഉപയോഗിച്ചു. അശ്ശൂർ ഭരണപദവികളുടെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണത്തിലൂടെയും അടിക്കുറിപ്പിൽ സാധ്യതയുള്ള അർഥങ്ങളിലൂടെയും സംരക്ഷിച്ചു. എബ്രായത്തിലെ ഇരട്ട ചലനവിവരണത്തിന്റെ ആവർത്തനം ഭാഗികമായി നിലനിർത്തി.
