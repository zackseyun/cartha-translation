  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: ml
  text: ഹിസ്കീയാ രാജാവിന്റെ പതിനാലാം ഭരണവർഷത്തിൽ, അശ്ശൂർരാജാവായ സൻഹേരീബ് യെഹൂദയിലെ കോട്ടയുള്ള എല്ലാ പട്ടണങ്ങൾക്കും എതിരായി വന്ന് അവ പിടിച്ചടക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּה
  choice: ഹിസ്കീയാരാജാവിന്റെ പതിനാലാം ഭരണവർഷത്തിൽ
  rationale: രാജാവിന്റെ വാഴ്ചയുടെ പതിനാലാം വർഷത്തെ സൂചിപ്പിക്കുന്ന ഭരണവർഷസൂത്രം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു. തുടക്കത്തിലെ וּ എന്ന ബന്ധകത്തിന് സന്ദർഭത്തിൽ പ്രത്യേകമായ ‘ഇപ്പോൾ’ എന്ന അർഥമില്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: עָלָה ... עַל
  choice: എതിരായി വന്ന്
  rationale: עלה എന്നതിന്റെ അടിസ്ഥാനമായ ‘കയറിവരുക/ചെല്ലുക’ എന്ന ചലനഭാവവും עַל ചേർന്ന സൈനികാക്രമണസന്ദർഭവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവായ സൻഹേരീബ്
  rationale: രാജാവിന്റെ പേരും പദവിയും മലയാളത്തിലെ സ്വാഭാവിക സമാനാധികരണഘടനയിൽ നൽകുന്നു; സൻഹേരീബ് എന്നത് പ്രചാരമുള്ള മലയാള ലിപ്യന്തരണമാണ്.
- source_word: כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: യെഹൂദയിലെ ഉറപ്പുള്ള എല്ലാ പട്ടണങ്ങൾക്കും
  rationale: הַבְּצֻרוֹת എന്നത് പ്രതിരോധമതിലുകളും സൈനികസുരക്ഷയും ഉള്ള പട്ടണങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘ഉറപ്പുള്ള പട്ടണങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പരമ്പരാഗത മലയാളപ്രയോഗമാണ്.
- source_word: וַיִּתְפְּשֵׂם
  choice: അവ പിടിച്ചടക്കി
  rationale: നഗരങ്ങളെ യുദ്ധത്തിൽ കൈവശപ്പെടുത്തുക എന്ന ക്രിയയുടെ സൈനികാർഥം ‘പിടിച്ചടക്കി’ കൃത്യമായി നൽകുന്നു; ‘അവ’ എന്നത് പട്ടണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
