  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ചരിത്രവിവരണശൈലി. മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും സൈനികഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
