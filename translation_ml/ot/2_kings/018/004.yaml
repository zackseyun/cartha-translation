source:
  edition: WLC
  text: ה֣וּא הֵסִ֣יר אֶת הַ/בָּמ֗וֹת וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּבֹ֔ת וְ/כָרַ֖ת אֶת הָֽ/אֲשֵׁרָ֑ה וְ/כִתַּת֩ נְחַ֨שׁ הַ/נְּחֹ֜שֶׁת אֲשֶׁר עָשָׂ֣ה מֹשֶׁ֗ה כִּ֣י עַד הַ/יָּמִ֤ים הָ/הֵ֨מָּה֙ הָי֤וּ בְנֵֽי יִשְׂרָאֵל֙ מְקַטְּרִ֣ים ל֔/וֹ וַ/יִּקְרָא ל֖/וֹ נְחֻשְׁתָּֽן׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
translation:
  language: ml
  text: അവൻ ഉന്നതാരാധനാസ്ഥലങ്ങൾ നീക്കിക്കളഞ്ഞു; ആരാധനാസ്തംഭങ്ങൾ തകർത്തു; അശേരാ വെട്ടിവീഴ്ത്തി[a]; മോശെ ഉണ്ടാക്കിയിരുന്ന വെങ്കലസർപ്പത്തെ തുണ്ടുതുണ്ടാക്കി തകർത്തു. കാരണം, ആ നാളുകൾവരെ ഇസ്രായേൽമക്കൾ അതിന് ധൂപം അർപ്പിച്ചുപോന്നു. അതിന് നെഹുഷ്താൻ എന്നു പേരുണ്ടായിരുന്നു[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അശേരാ തൂൺ” അല്ലെങ്കിൽ “വിശുദ്ധ തൂൺ.”
    reason: lexical_alternative
  - marker: b
    text: “നെഹുഷ്താൻ” എന്ന പേര് “വെങ്കലം” എന്ന ഹീബ്രു പദത്തെ ആധാരമാക്കിയുള്ള വാക്കുകളിയായിരിക്കാം; “വെറുമൊരു വെങ്കലക്കഷണം” എന്ന ധ്വനിയും അതിനുണ്ടാകാം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “അവൻ അതിനെ നെഹുഷ്താൻ എന്നു വിളിച്ചു.” ഹീബ്രുവിൽ പേരിട്ടത് ആരാണെന്നത് ഇവിടെ പൂർണമായി വ്യക്തമല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵסִיר
  choice: നീക്കിക്കളഞ്ഞു
  rationale: ആരാധനാകേന്ദ്രങ്ങൾ ഇല്ലാതാക്കിയ പരിഷ്കരണസന്ദർഭത്തിൽ, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും പ്രവൃത്തിയുടെ നിർണായകത വ്യക്തമാക്കുന്നതുമായ പ്രയോഗം.
- source_word: הַבָּמוֹת
  choice: പൂജാഗിരികൾ
  rationale: പ്രാദേശിക ആരാധനയ്ക്കുള്ള ഉയർന്ന സ്ഥലങ്ങൾ എന്ന പുരാതന ആരാധനാസംബന്ധിയായ അർഥം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: הַמַּצֵּבֹת
  choice: പൂജാസ്തംഭങ്ങൾ
  rationale: സാധാരണ കെട്ടിടസ്തംഭങ്ങളല്ല, ആരാധനയുമായി ബന്ധപ്പെട്ടുനിന്ന കൽത്തൂണുകളാണെന്ന് വ്യക്തമാക്കാൻ 'പൂജാ-' ചേർത്തു.
- source_word: כָרַת ... הָאֲשֵׁרָה
  choice: അശേരാപ്രതിഷ്ഠ വെട്ടിവീഴ്ത്തി
  rationale: വെട്ടാവുന്ന ആരാധനാവസ്തുവാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; അതേസമയം അശേരാ എന്ന പുരാതന മതപരമായ നാമം നിലനിർത്തുന്നു.
- source_word: כִתַּת
  choice: കഷണങ്ങളാക്കി തകർത്തു
  rationale: വെറുതെ പൊട്ടിച്ചതിനപ്പുറം പൂർണമായി നശിപ്പിച്ചുവെന്ന ക്രിയയുടെ തീവ്രത പകർത്തുന്നു.
- source_word: נְחַשׁ הַנְּחֹשֶׁת
  choice: വെങ്കലസർപ്പം
  rationale: ലോഹവും സർപ്പരൂപവും കൃത്യമായി സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിലും സ്വാഭാവികമായ സംയുക്തപദം.
- source_word: מְקַטְּרִים לוֹ
  choice: അതിനു ധൂപം കാട്ടിവന്നിരുന്നു
  rationale: തുടർച്ചയായി ധൂപാർപ്പണം നടത്തിയിരുന്നുവെന്ന ആരാധനാപ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധപരമായ പ്രയോഗം നിലനിർത്തുകയും ആ സമൂഹത്തെ മുഴുവനായി ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: അതിന് നെഹുഷ്താൻ എന്നു പേരുണ്ടായിരുന്നു
  rationale: പേരിട്ടത് ആരാണെന്ന കാര്യത്തിൽ ഹീബ്രു വാക്യം അനുവദിക്കുന്ന അനിശ്ചിതത്വം മലയാളത്തിൽ നിലനിർത്തുന്ന കർത്തൃനിരപേക്ഷ പ്രയോഗം.
theological_decisions:
- issue: אֲשֵׁרָה എന്ന പദത്തിന്റെ സൂചന
  choice: അശേരാപ്രതിഷ്ഠ
  alternative: അശേരാത്തൂൺ; വിശുദ്ധത്തൂൺ
  rationale: ഭൗതികമായി വെട്ടിവീഴ്ത്താവുന്ന ആരാധനാവസ്തുവാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു. എന്നാൽ അതിനെ വെറും പൊതുവായ തൂണാക്കി ചുരുക്കാതെ അശേരാ എന്ന പുരാതന മതപരമായ സൂചനയും നിലനിർത്തുന്നു.
- issue: וַיִּקְרָא לוֹ נְחֻשְׁתָּן എന്നതിലെ കർത്താവ്
  choice: കർത്തൃനിരപേക്ഷമായി ‘അതിന് ... എന്നു പേരുണ്ടായിരുന്നു’
  alternative: ‘അവൻ അതിനെ നെഹുഷ്താൻ എന്നു വിളിച്ചു’
  rationale: ഹീബ്രു ക്രിയ ഏകവചനത്തിലാണെങ്കിലും ഈ സംക്ഷിപ്ത പ്രസ്താവനയിലെ കർത്താവ് ഹിസ്കീയാവാണോ പൊതുവായ ആളുകളാണോ എന്നു നിർബന്ധമായി തീരുമാനിക്കാതിരിക്കാനാണ് കർത്തൃനിരപേക്ഷമായ മലയാളരൂപം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. പുരാതന ആരാധനാസംബന്ധിയായ സാങ്കേതിക പദങ്ങൾക്ക് ആവശ്യമായിടത്ത് ‘പൂജാ-’ ചേർത്ത് വ്യക്തത നൽകി; അശേരാ, നെഹുഷ്താൻ എന്നീ ചരിത്രനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
