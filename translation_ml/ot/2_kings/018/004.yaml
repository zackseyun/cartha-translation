revisions:
- from: അവൻ പൂജാഗിരികൾ നീക്കിക്കളഞ്ഞു; പൂജാസ്തംഭങ്ങൾ തകർത്തു; അശേരാപ്രതിഷ്ഠ വെട്ടിവീഴ്ത്തി[a]; മോശെ ഉണ്ടാക്കിയിരുന്ന വെങ്കലസർപ്പത്തെ കഷണങ്ങളാക്കി തകർത്തു. കാരണം, ആ നാളുകൾവരെ ഇസ്രായേൽമക്കൾ അതിനു ധൂപം കാട്ടിവന്നിരുന്നു. അതിന് നെഹുഷ്താൻ എന്നു പേരുണ്ടായിരുന്നു[b][c].
  to: അവൻ ഉന്നതാരാധനാസ്ഥലങ്ങൾ നീക്കിക്കളഞ്ഞു; ആരാധനാസ്തംഭങ്ങൾ തകർത്തു; അശേരാ വെട്ടിവീഴ്ത്തി[a]; മോശെ ഉണ്ടാക്കിയിരുന്ന വെങ്കലസർപ്പത്തെ തുണ്ടുതുണ്ടാക്കി തകർത്തു. കാരണം, ആ നാളുകൾവരെ ഇസ്രായേൽമക്കൾ അതിന് ധൂപം അർപ്പിച്ചുപോന്നു. അതിന് നെഹുഷ്താൻ എന്നു പേരുണ്ടായിരുന്നു[b][c].
  rationale: The revision removes an unwarranted narrowing of ‘Asherah,’ improves the rendering of incense offering, and replaces terminology that can misleadingly imply mountainous locations. It preserves the source order, the destruction imagery, the historical names, and the ambiguity regarding who called the object Nehushtan. All footnote anchors are retained and correctly supplied.
