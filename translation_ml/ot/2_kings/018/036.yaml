source:
  edition: WLC
  text: וְ/הֶחֱרִ֣ישׁוּ הָ/עָ֔ם וְ/לֹֽא עָנ֥וּ אֹת֖/וֹ דָּבָ֑ר כִּי מִצְוַ֨ת הַ/מֶּ֥לֶךְ הִ֛יא לֵ/אמֹ֖ר לֹ֥א תַעֲנֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/036.yaml
  text: But the people kept silent and did not answer him a word[a], for the king’s command was, “Do not answer him.”
translation:
  language: ml
  text: എന്നാൽ ജനം മിണ്ടാതിരുന്നു; അവർ അവനോട് ഒരു വാക്കുപോലും മറുപടി പറഞ്ഞില്ല[a]. കാരണം, “അവനോട് മറുപടി പറയരുത്” എന്നായിരുന്നു രാജാവിന്റെ കല്പന.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അവർ അവനോട് ഒരു വാക്ക് മറുപടി പറഞ്ഞില്ല”; അതായത്, അവർ യാതൊരു മറുപടിയും നൽകിയില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ
  choice: മിണ്ടാതിരുന്നു
  rationale: חרשׁ എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ മൗനം പാലിക്കുക എന്ന അർഥത്തിലാണ്. ‘മിണ്ടാതിരുന്നു’ എന്നത് സന്ദർഭത്തിലെ തുടർച്ചയായ ആത്മനിയന്ത്രണവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: עַם എന്നതിന്റെ സാധാരണ അർഥം ‘ജനം’ എന്നാണ്; ഇവിടെ മതിലിന്മേൽ കേട്ടുകൊണ്ടിരുന്ന യെഹൂദ്യജനത്തെ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കാതെ സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  choice: അവർ അവനോട് ഒരു വാക്കുപോലും മറുപടി പറഞ്ഞില്ല
  rationale: ענה എന്നത് ‘മറുപടി പറയുക’ എന്നും דָבָר ഇവിടെ ‘ഒരു വാക്ക്/ഒന്നും’ എന്ന ഊന്നൽ നൽകുന്ന പ്രയോഗവുമാണ്. മലയാളത്തിലെ ‘ഒരു വാക്കുപോലും’ മൂലഭാഷയുടെ രൂപവും പൂർണമായ മൗനത്തിന്റെ ആശയവും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഇവിടെ כִּי ജനത്തിന്റെ മൗനത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്നു; ‘കാരണം’ ആ കാരണബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: രാജാവിന്റെ കല്പന
  rationale: מִצְוָה എന്നത് അധികാരപൂർവമായ കല്പനയെയോ ഉത്തരവിനെയോ സൂചിപ്പിക്കുന്നു; ‘രാജാവിന്റെ കല്പന’ കൃത്യവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: הִיא לֵאמֹר
  choice: എന്നായിരുന്നു
  rationale: സർവനാമവും אמר എന്ന ധാതുവിന്റെ infinitive-ഉം ചേർന്ന ഘടന ഉദ്ധരിച്ച ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ഉദ്ധരണിക്കുശേഷമുള്ള ‘എന്നായിരുന്നു’ ഇതിനെ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: לֹא תַעֲנֻהוּ
  choice: അവനോട് മറുപടി പറയരുത്
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തോടുള്ള നിഷേധം സമൂഹത്തോടുള്ള രാജാവിന്റെ വിലക്ക് പ്രകടമാക്കുന്നു. മലയാളത്തിൽ കൂട്ടത്തോടുള്ള കല്പനയിൽ ഈ രൂപം സ്വാഭാവികമാണ്; ആവർത്തിക്കുന്ന ענה എന്ന ക്രിയയുമായി പൊരുത്തവും നിലനിർത്തുന്നു.
