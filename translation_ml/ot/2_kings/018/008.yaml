  yaml_path: translation/ot/2_kings/018/008.yaml
  text: He struck the Philistines as far as Gaza and its territory[b][a], from watchtower to fortified city.
translation:
  language: ml
  text: അവൻ ഫെലിസ്ത്യരെ തോൽപ്പിച്ചു—ഗസ്സ വരെയും അതിന്റെ പ്രദേശം വരെയും, നിരീക്ഷണഗോപുരം മുതൽ കോട്ടമതിലുള്ള നഗരം വരെ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിരീക്ഷണഗോപുരം മുതൽ കോട്ടമതിലുള്ള നഗരം വരെ” എന്ന എബ്രായപ്രയോഗം ചെറിയ കാവൽസ്ഥാനങ്ങൾ മുതൽ വലിയ പ്രതിരോധനഗരങ്ങൾ വരെയുള്ള എല്ലായിടങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “അതിന്റെ അതിർത്തികൾ വരെയും.” എബ്രായപദത്തിന് അതിർത്തിരേഖകളെയോ ഒരു നഗരത്തിന്റേതായ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: അവൻ
  rationale: എബ്രായകഥനത്തിലെ ഊന്നലുള്ള വ്യക്തമായ കർത്തൃസർവനാമം നിലനിർത്തുന്നു.
- source_word: הִכָּה
  choice: തോൽപ്പിച്ചു
  rationale: נכה എന്നതിന് ‘അടിക്കുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും ഇവിടെ സൈനികസന്ദർഭത്തിൽ ‘തോൽപ്പിക്കുക’ എന്ന വിപുലാർഥമാണ് സ്വാഭാവികം; മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരെ
  rationale: ജനവിഭാഗത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളനാമം.
- source_word: עַד עַזָּה
  choice: ഗസ്സവരെയും
  rationale: עַד സൂചിപ്പിക്കുന്ന വ്യാപ്തിയുടെ അറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאֶת גְּבוּלֶיהָ
  choice: അതിന്റെ പ്രദേശത്തെയും
  rationale: גְּבוּל എന്നത് അതിർത്തിയോ അധീനപ്രദേശമോ ആകാം; ഇവിടെ ഗസ്സയോടു ചേർന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ കൊടുക്കുകയും മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: കാവൽഗോപുരംമുതൽ
  rationale: കാവൽക്കാർ നിരീക്ഷിക്കുന്ന ഗോപുരം എന്ന എബ്രായപ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עַד עִיר מִבְצָר
  choice: കോട്ടകെട്ടിയ നഗരംവരെ
  rationale: പ്രതിരോധസംവിധാനമുള്ള നഗരമെന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷയിൽ നൽകുന്നു.
