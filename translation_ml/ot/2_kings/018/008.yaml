- from: അവൻ ഫെലിസ്ത്യരെ ഗസ്സവരെയും അതിന്റെ പ്രദേശത്തെയും[b] കാവൽഗോപുരംമുതൽ കോട്ടകെട്ടിയ നഗരംവരെ[a] തോൽപ്പിച്ചു.
  to: അവൻ ഫെലിസ്ത്യരെ തോൽപ്പിച്ചു—ഗസ്സ വരെയും അതിന്റെ പ്രദേശം വരെയും, നിരീക്ഷണഗോപുരം മുതൽ കോട്ടമതിലുള്ള നഗരം വരെ.[a][b]
  rationale: The revision clarifies that Gaza and its territory define the reach of Hezekiah’s defeat of the Philistines, rather than additional entities defeated. It also restores normal Malayalam spacing, improves the idiomatic wording for the merism, and retains both supplied footnote functions. The dash marks the appositional extent phrase naturally without adding interpretation.
