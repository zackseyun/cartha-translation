  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
translation:
  language: ml
  text: അവൻ നിങ്ങൾക്കുവേണ്ടി എഴുതിയ ചട്ടങ്ങളും ന്യായവിധികളും ന്യായപ്രമാണവും കല്പനയും[a] നിങ്ങൾ എക്കാലവും പാലിച്ച് അനുഷ്ഠിക്കണം[b]. അന്യദേവന്മാരെ ഭയപ്പെടരുത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചട്ടങ്ങൾ … ന്യായവിധികൾ … ന്യായപ്രമാണം … കല്പന’ എന്നിടത്ത് ‘നിയമനിർദേശങ്ങൾ … നീതിനിയമങ്ങൾ … ഉപദേശം … ആജ്ഞ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായം പരസ്പരം അർഥസാമ്യമുള്ളതും എന്നാൽ വ്യത്യസ്ത നിയമഭാവങ്ങളുള്ളതുമായ ഉടമ്പടി-നിയമ പദങ്ങളുടെ ഒരു നിര ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് അടുത്ത്: ‘ചെയ്യേണ്ടതിന് നിങ്ങൾ കാത്തുപാലിക്കണം.’ എബ്രായപ്രയോഗം സൂക്ഷിച്ചു പാലിക്കുന്നതും പ്രാവർത്തികമാക്കുന്നതും ചേർത്തുപറയുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘ഭയപ്പെടുക’ എന്നതിൽ ദേവന്മാരോടുള്ള ഭക്തിപൂർവമായ വിധേയത്വത്തിന്റെയോ ആരാധനാപരമായ ഭയത്തിന്റെയോ അർഥവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിർണയിച്ച നിയമവ്യവസ്ഥകളെയോ ചട്ടങ്ങളെയോ സൂചിപ്പിക്കുന്ന ഔപചാരിക നിയമപദമായി തിരഞ്ഞെടുത്തു.
- source_word: הַמִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: നിയമപരമായ വിധികളുടെയും നീതിനിയമങ്ങളുടെയും ഭാവം നിലനിർത്തുകയും മുൻപുള്ള ‘ചട്ടങ്ങൾ’ എന്ന പദത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַתּוֹרָה
  choice: ന്യായപ്രമാണം
  rationale: തോറാ എന്ന പദത്തിന് ‘ഉപദേശം’ എന്നും അർഥമുണ്ടെങ്കിലും, ഈ ഉടമ്പടി-നിയമ പട്ടികയിൽ അതിന്റെ സ്ഥാപിതമായ നിയമപരമായ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: הַמִּצְוָה
  choice: കല്പന
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപം നിലനിർത്തുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
- source_word: אֲשֶׁר כָּתַב לָכֶם
  choice: അവൻ നിങ്ങൾക്കുവേണ്ടി എഴുതിയ
  rationale: എബ്രായത്തിലെ പരോക്ഷമായ ഏകവചന കർത്താവിനെ ‘അവൻ’ എന്നു നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് യഹോവയെ സൂചിപ്പിക്കുന്നു, എന്നാൽ വാക്യത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കുന്നില്ല.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: പാലിച്ച് അനുഷ്ഠിക്കണം
  rationale: ‘കാത്തുപാലിക്കുക’ എന്നും ‘ചെയ്യുക’ എന്നും ഉള്ള ഇരട്ട ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הַיָּמִים
  choice: എക്കാലവും
  rationale: അക്ഷരാർഥമായ ‘എല്ലാ ദിവസങ്ങളിലും’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ തുടർച്ചയായ കാലഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: תִירְאוּ
  choice: ഭയപ്പെടരുത്
  rationale: അടിസ്ഥാനമായ ‘ഭയപ്പെടുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ഇവിടെ അതിൽ ഭക്തിപൂർവമായ വിധേയത്വത്തിന്റെയും ആരാധനാപരമായ ഭയത്തിന്റെയും ഭാവമുണ്ട്.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാർ
  rationale: യഹോവയല്ലാത്ത ദേവന്മാരെ സൂചിപ്പിക്കുന്ന എബ്രായത്തിലെ പതിവുപ്രയോഗത്തിന് സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: ഉടമ്പടി-നിയമ പദങ്ങളുടെ നിര വേർതിരിച്ചു നിലനിർത്തൽ
  choice: ചട്ടങ്ങൾ, ന്യായവിധികൾ, ന്യായപ്രമാണം, കല്പന എന്നീ നാല് പദങ്ങളും പ്രത്യേകം നിലനിർത്തി.
  alternative: ‘നിയമങ്ങളും കല്പനകളും’ എന്ന പൊതുവായ ചുരുക്കം.
  rationale: എബ്രായം ഉദ്ദേശപൂർവം അടുക്കിവയ്ക്കുന്ന നാല് നിയമപദങ്ങളുടെ വാചകഭാരവും ഭാഗികമായ അർഥവ്യത്യാസങ്ങളും ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: ‘എഴുതിയ’ എന്ന ക്രിയയുടെ കർത്താവ്
  choice: ‘അവൻ’ എന്നു തന്നെയാക്കി.
  alternative: ‘യഹോവ നിങ്ങൾക്കുവേണ്ടി എഴുതിയ’ എന്നു വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം കർത്താവിനെ യഹോവയായി തിരിച്ചറിയുന്നുവെങ്കിലും, ഈ വാക്യത്തിലെ എബ്രായരൂപത്തിൽ നാമം പ്രത്യക്ഷമല്ല; അതിനാൽ വ്യാഖ്യാനപരമായ വ്യക്തീകരണം മുഖ്യവാചകത്തിൽ ചേർത്തില്ല.
- issue: ‘ഭയപ്പെടുക’ എന്നതിന്റെ ആരാധനാപരമായ ഭാവം
  choice: മുഖ്യവാചകത്തിൽ ‘ഭയപ്പെടരുത്’ നിലനിർത്തി, ഭക്തിപൂർവമായ വിധേയത്വത്തിന്റെ ഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ആരാധിക്കരുത്’ അല്ലെങ്കിൽ ‘ഭക്തി കാണിക്കരുത്’.
  rationale: ‘ഭയം’ എന്ന മൂലരൂപകവും ഉടമ്പടിപരമായ അർഥവ്യാപ്തിയും നിലനിർത്തി, അതിനെ ആരാധന എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ഉടമ്പടി ശൈലി സ്വീകരിച്ചു. നാല് എബ്രായ നിയമപദങ്ങളും വേർതിരിച്ചു; എന്നാൽ ‘എല്ലാ ദിവസങ്ങളിലും’ എന്ന അക്ഷരാനുകരണം ഒഴിവാക്കി അതിന്റെ തുടർച്ചയായ കാലഭാവം ‘എക്കാലവും’ എന്നു സ്വാഭാവികമാക്കി.
