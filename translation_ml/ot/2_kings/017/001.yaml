  text: In the twelfth year of Ahaz king of Judah, Hoshea son of Elah began to reign in Samaria over Israel, and he reigned nine years.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ ആഹാസിന്റെ പന്ത്രണ്ടാം ആണ്ടിൽ ഏലായുടെ മകനായ ഹോശേയ ശമര്യയിൽ ഇസ്രായേലിനെ ഭരിക്കാൻ തുടങ്ങി; അവൻ ഒൻപത് വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: ഭരിക്കാൻ തുടങ്ങി; ... ഭരിച്ചു
  rationale: ആദ്യ പ്രയോഗം രാജഭരണത്തിന്റെ ആരംഭം സൂചിപ്പിക്കുന്ന കാലനിർണ്ണയസന്ദർഭത്തിൽ വരുന്നതിനാൽ ‘ഭരിക്കാൻ തുടങ്ങി’ എന്നും, കാലദൈർഘ്യത്തോടുകൂടിയ രണ്ടാം പ്രയോഗം സ്വാഭാവികമായി ‘ഭരിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: בְ/שֹׁמְרוֹן עַל יִשְׂרָאֵל
  choice: ശമര്യയിൽ ഇസ്രായേലിനെ
  rationale: ഭരണകേന്ദ്രമായ ശമര്യയും ഭരണവിധേയമായ ഇസ്രായേലും തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: שְׁתֵּים עֶשְׂרֵה ... תֵּשַׁע שָׁנִים
  choice: പന്ത്രണ്ടാം ആണ്ടിൽ ... ഒൻപത് വർഷം
  rationale: ഹീബ്രു ക്രമസംഖ്യയും ഭരണകാലദൈർഘ്യവും ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ചരിത്രവിവരണരീതിയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
