  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּֽלְכוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/כָל חַטֹּ֥אות יָרָבְעָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה לֹא סָ֖רוּ מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/022.yaml
  text: And the children of Israel walked in all the sins that Jeroboam had committed[a]; they did not turn away from them.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ യൊരോബെയാം ചെയ്ത സകല പാപങ്ങളിലും നടന്നു; അവർ അതിൽനിന്ന്[a] വിട്ടുമാറിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ ഏകവചനം: ‘അതിൽനിന്ന്.’ ഇത് മുമ്പു പറഞ്ഞ പാപപൂർണമായ വഴിയെയോ പെരുമാറ്റരീതിയെയോ കൂട്ടമായി സൂചിപ്പിച്ചേക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: നടന്നു
  rationale: הלך എന്ന ക്രിയ ב എന്ന ഉപസർഗത്തോടൊപ്പം ഒരു ജീവിതരീതിയെയോ പെരുമാറ്റപാതയെയോ പിന്തുടരുക എന്ന അർഥത്തിൽ വരുന്നു. ‘നടന്നു’ എന്നത് എബ്രായ രൂപകം നിലനിർത്തുകയും മലയാളത്തിൽ ധാർമിക പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ദേശീയവും ഉടമ്പടിസംബന്ധവുമായ എബ്രായ പ്രയോഗം സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּכָל חַטֹּאות
  choice: സകല പാപങ്ങളിലും
  rationale: בְּכָל എന്നതിന്റെ സമഗ്രതയും חַטֹּאות എന്ന ബഹുവചനത്തിന്റെ വ്യക്തമായ ധാർമിക അർഥവും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר עָשָׂה
  choice: ചെയ്ത
  rationale: עָשָׂה എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘പാപം ചെയ്യുക’ സ്വാഭാവികമായ പ്രയോഗമാണ്.
- source_word: לֹא סָרוּ
  choice: വിട്ടുമാറിയില്ല
  rationale: סור എന്നതിലെ മാറിനിൽക്കുക, ഉപേക്ഷിക്കുക എന്നീ ആശയങ്ങൾ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִמֶּנָּה
  choice: അതിൽനിന്ന്
  rationale: മൂലപാഠത്തിലെ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ബഹുവചനമായ ‘പാപങ്ങൾ’ എന്നതോട് വ്യാകരണപരമായി നേരിട്ട് പൊരുത്തപ്പെടുന്നില്ല. അതിനാൽ ഏകവചനം നിലനിർത്തി, മുമ്പു പറഞ്ഞ പാപപൂർണമായ വഴിയെയോ രീതിയെയോ കൂട്ടമായി സൂചിപ്പിക്കുന്ന യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: מִמֶּנָּה എന്ന അവസാന ഏകവചന പ്രത്യയത്തിന്റെ സൂചിതവിഷയം
  choice: ‘അതിൽനിന്ന്’ എന്നു വിവർത്തനം ചെയ്ത് എബ്രായത്തിലെ ഏകവചനം നിലനിർത്തുക
  alternative: ‘അവയിൽനിന്ന്’ എന്നു വിവർത്തനം ചെയ്ത് മുമ്പുള്ള ബഹുവചനമായ പാപങ്ങളെ നേരിട്ട് സൂചിപ്പിക്കുക
  rationale: മൂലപാഠം സ്ത്രീലിംഗ ഏകവചനമാണ് ഉപയോഗിക്കുന്നത്; അത് മുമ്പു വിവരിച്ച പാപപൂർണമായ വഴിയെയോ പെരുമാറ്റരീതിയെയോ കൂട്ടമായി സൂചിപ്പിച്ചേക്കാം. ബഹുവചനമാക്കി വ്യാഖ്യാനം ഉറപ്പിക്കുന്നതിനുപകരം ഏകവചനം നിലനിർത്തുന്നത് പാഠത്തിലെ യഥാർഥ വ്യാകരണ-അർഥസമ്മർദം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘നടന്നു’ എന്ന ബൈബിൾപരമായ രൂപകം നിലനിർത്തിയിട്ടുണ്ടെങ്കിലും വാക്യം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ‘യൊരോബെയാം’ എന്ന രൂപം ഹീബ്രു יָרָבְעָם എന്ന പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണത്തോട് ചേർന്നതാണ്.
