source:
  edition: WLC
  text: כִּֽי קָרַ֣ע יִשְׂרָאֵ֗ל מֵ/עַל֙ בֵּ֣ית דָּוִ֔ד וַ/יַּמְלִ֖יכוּ אֶת יָרָבְעָ֣ם בֶּן נְבָ֑ט ו/ידא יָרָבְעָ֤ם אֶת יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/הֶחֱטֵיאָ֖/ם חֲטָאָ֥ה גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
translation:
  language: ml
  text: കാരണം, അവൻ ഇസ്രായേലിനെ ദാവീദിന്റെ ഭവനത്തിൽനിന്ന് പിളർത്തിമാറ്റി; അവർ നെബാത്തിന്റെ മകനായ യൊരോബെയാമിനെ രാജാവാക്കി. യൊരോബെയാം ഇസ്രായേലിനെ യഹ്‌വെയെ അനുഗമിക്കുന്നതിൽനിന്ന് അകറ്റി[a]; അവരെക്കൊണ്ട് വലിയൊരു പാപം ചെയ്യിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയെ അനുഗമിക്കുന്നതിൽനിന്ന് ഇസ്രായേലിനെ വഴിതെറ്റിച്ചു.” എബ്രായ ക്രിയയ്ക്ക് അകറ്റുക എന്നും വഴിതെറ്റിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַע
  choice: പിളർന്നുമാറി
  rationale: ‘കീറുക/പിളർക്കുക’ എന്ന സജീവ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് ദാവീദീയ ഭരണത്തിൽനിന്നുള്ള രാഷ്ട്രീയ വേർപാടിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: מֵעַל בֵּית דָּוִד
  choice: ദാവീദുഗൃഹത്തിൽനിന്ന്
  rationale: ‘ദാവീദിന്റെ ഭവനം’ എന്നത് ദാവീദീയ രാജവംശത്തെയും അതിന്റെ അധികാരത്തെയും സൂചിപ്പിക്കുന്നു; വേർപാടിന്റെ അർഥം ‘-ത്തിൽനിന്ന്’ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּמְלִיכוּ
  choice: അവർ രാജാവാക്കി
  rationale: מלך എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘രാജാവായി വാഴിക്കുക/നിയമിക്കുക’ എന്ന കാരണാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיַּדַּח
  choice: അകറ്റി
  rationale: ഈ ക്രിയയ്ക്ക് ബലമായി അകറ്റുക എന്നും വഴിതെറ്റിക്കുക എന്നും അർഥസാധ്യതയുണ്ട്. മുഖ്യപാഠത്തിലെ ‘അകറ്റി’ ദിശയും കാരണപ്രവർത്തനവും നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: യഹ്‌വെയെ അനുഗമിക്കുന്നതിൽനിന്ന്
  rationale: ‘യഹ്‌വെയുടെ പിന്നാലെ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഉടമ്പടിപരമായ അനുസരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְהֶחֱטִיאָם
  choice: അവരെക്കൊണ്ട് ... ചെയ്യിക്കുകയും ചെയ്തു
  rationale: חטא എന്ന ധാതുവിന്റെ ഹിഫീൽ കാരണാർഥം—അവരെ പാപം ചെയ്യാൻ ഇടയാക്കിയത്—വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חֲטָאָה גְדוֹלָה
  choice: വലിയൊരു പാപം
  rationale: പാപത്തിന്റെ ഗൗരവം സൂചിപ്പിക്കുന്ന നാമ-വിശേഷണ ഘടനയെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ നേരിട്ട് പകരുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം ഉപയോഗിക്കുന്നതിനാൽ അത് സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: യൊരോബെയാം ഇസ്രായേലിന്മേൽ ചെലുത്തിയ പ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: അകറ്റി
  alternative: വഴിതെറ്റിച്ചു
  rationale: נדח എന്ന ക്രിയയിൽ ബലമായി അകറ്റുന്നതിന്റെയും വഴിതെറ്റിക്കുന്നതിന്റെയും അർഥസാധ്യതകളുണ്ട്. മുഖ്യപാഠം ഒന്നാമത്തെ ദൃശ്യരൂപം നിലനിർത്തുകയും അടിക്കുറിപ്പ് രണ്ടാമത്തേത് രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദാവീദുഗൃഹം’ രാജവംശത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപരമായ സംക്ഷിപ്തപ്രയോഗമായി നിലനിർത്തി; വാക്യത്തിന്റെ കാരണബന്ധവും യൊരോബെയാമിന്റെ കാരണപ്രവർത്തനവും വ്യക്തമായി പ്രകടിപ്പിച്ചു.
