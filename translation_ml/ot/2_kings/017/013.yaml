  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣עַד יְהוָ֡ה בְּ/יִשְׂרָאֵ֣ל וּ/בִ/יהוּדָ֡ה בְּ/יַד֩ כָּל נביא/ו כָל חֹזֶ֜ה לֵ/אמֹ֗ר שֻׁ֝֠בוּ מִ/דַּרְכֵי/כֶ֤ם הָֽ/רָעִים֙ וְ/שִׁמְרוּ֙ מִצְוֺתַ֣/י חֻקּוֹתַ֔/י כְּ/כָ֨ל הַ/תּוֹרָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבֹֽתֵי/כֶ֑ם וַֽ/אֲשֶׁר֙ שָׁלַ֣חְתִּי אֲלֵי/כֶ֔ם בְּ/יַ֖ד עֲבָדַ֥/י הַ/נְּבִיאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
translation:
  language: ml
  text: എന്നാൽ യഹോവ തന്റെ എല്ലാ പ്രവാചകന്മാരിലൂടെയും എല്ലാ ദർശകന്മാരിലൂടെയും ഇസ്രായേലിനും യെഹൂദയ്ക്കും ഗൗരവമായി മുന്നറിയിപ്പു നൽകി:[a] “നിങ്ങളുടെ ദുഷ്ടവഴികളിൽനിന്ന് പിന്തിരിഞ്ഞ്, ഞാൻ നിങ്ങളുടെ പിതാക്കന്മാരോടു[b] കൽപ്പിച്ചതും എന്റെ ദാസന്മാരായ പ്രവാചകന്മാരിലൂടെ[c] നിങ്ങൾക്ക് അയച്ചതുമായ ന്യായപ്രമാണം മുഴുവനും അനുസരിച്ച് എന്റെ കൽപ്പനകളും ചട്ടങ്ങളും പാലിക്കുവിൻ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിനും യെഹൂദയ്ക്കും എതിരായി സാക്ഷ്യം പറഞ്ഞു.” ഹീബ്രു ക്രിയയ്ക്ക് ഗൗരവമുള്ള മുന്നറിയിപ്പിന്റെയും ഔപചാരിക സാക്ഷ്യത്തിന്റെയും അർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: “പിതാക്കന്മാർ” എന്നത് “പൂർവികർ” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “എന്റെ ദാസന്മാരായ പ്രവാചകന്മാരുടെ മുഖാന്തരം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד
  choice: ഗൗരവമായി മുന്നറിയിപ്പു നൽകി
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള עוּד ഇവിടെ ഔപചാരികമായ സാക്ഷ്യപ്പെടുത്തലിന്റെയും ശക്തമായ മുന്നറിയിപ്പിന്റെയും അർഥം വഹിക്കുന്നു. തുടർന്നുവരുന്ന ആഹ്വാനത്തോടും ന്യായവിധിയുടെ പശ്ചാത്തലത്തോടും യോജിക്കുന്ന സ്വാഭാവിക മലയാളമാണിത്; ‘എതിരായി സാക്ഷ്യം പറഞ്ഞു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: ഇസ്രായേലിനും യെഹൂദയ്ക്കും
  rationale: ב എന്ന ഉപസർഗം ഇവിടെ മുന്നറിയിപ്പിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു. ദിശാസൂചന മലയാളത്തിൽ വ്യക്തമായി വരുന്നതിനായി ദാതൃവിഭക്തി ഉപയോഗിച്ചു; ‘എതിരായി’ എന്ന അർഥം മുഖ്യവാചകത്തിൽ അമിതമായി നിശ്ചയിച്ചിട്ടില്ല.
- source_word: בְּיַד כָּל נביאו כָל חֹזֶה
  choice: എല്ലാ പ്രവാചകന്മാരിലൂടെയും എല്ലാ ദർശകന്മാരിലൂടെയും
  rationale: ביד എന്നത് ‘മുഖാന്തരം/വഴി’ എന്ന ഉപകരണാർഥമുള്ള പ്രയോഗമാണ്. כָּל ... כָּל എന്ന വിതരണാത്മക ആവർത്തനം നിലനിർത്തുകയും נָבִיא, חֹזֶה എന്നീ വ്യത്യസ്ത പദങ്ങൾ ഒന്നാക്കാതിരിക്കുകയും ചെയ്തു.
- source_word: חֹזֶה
  choice: ദർശകൻ
  rationale: ദർശനം കാണുന്ന പ്രവാചകവ്യക്തിയെ സൂചിപ്പിക്കുന്ന പ്രത്യേക പദമായതിനാൽ പൊതുവായ ‘പ്രവാചകൻ’ എന്നതിൽ ലയിപ്പിച്ചില്ല.
- source_word: שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים
  choice: നിങ്ങളുടെ ദുഷ്ടവഴികളിൽനിന്നു പിന്തിരിയുവിൻ
  rationale: שׁוּב എന്നതിന്റെ അടിസ്ഥാന ചലനരൂപകം നിലനിർത്തുന്നു. ‘മാനസാന്തരപ്പെടുവിൻ’ എന്ന ദൈവശാസ്ത്രപരമായി വികസിച്ച പദത്തെക്കാൾ ഉറവിടത്തിന്റെ നേരിട്ടുള്ള രൂപമാണിത്.
- source_word: וְשִׁמְרוּ מִצְוֺתַי חֻקּוֹתַי
  choice: എന്റെ കല്പനകളും ചട്ടങ്ങളും പാലിക്കുവിൻ
  rationale: שׁמר എന്നതിന്റെ നിയമപരമായ ‘പാലിക്കുക’ എന്ന അർഥവും מִצְוֹת, חֻקּוֹת എന്നീ രണ്ടു നിയമപദങ്ങളുടെ വ്യത്യാസവും സൂക്ഷിച്ചു.
- source_word: כְּכָל הַתּוֹרָה
  choice: ന്യായപ്രമാണം മുഴുവനും അനുസരിച്ച്
  rationale: ഈ ഉടമ്പടി-നിയമ പശ്ചാത്തലത്തിൽ תּוֹרָהയ്ക്ക് ‘ന്യായപ്രമാണം’ യോജിക്കുന്നു. כָּל എന്ന സമഗ്രത ‘മുഴുവനും’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר צִוִּיתִי אֶת אֲבֹתֵיכֶם
  choice: ഞാൻ നിങ്ങളുടെ പിതാക്കന്മാരോടു കല്പിച്ചത്
  rationale: אָבוֹת എന്ന പുരുഷലിംഗ ബഹുവചനത്തിന്റെ നേരിട്ടുള്ള ഉടമ്പടി-ചരിത്രപര പദം നിലനിർത്തി; വിപുലമായ ‘പൂർവികർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַאֲשֶׁר שָׁלַחְתִּי אֲלֵיכֶם בְּיַד עֲבָדַי הַנְּבִיאִים
  choice: എന്റെ ദാസന്മാരായ പ്രവാചകന്മാരിലൂടെ നിങ്ങൾക്ക് അയച്ചുതന്നത്
  rationale: ബന്ധവാക്യം ന്യായപ്രമാണം/ഉടമ്പടി-നിർദേശം എന്ന മുൻഗാമിയോടു ചേർന്നുനിൽക്കാൻ അനുവദിച്ചു. ביד എന്ന ഉപകരണാർഥം ‘പ്രവാചകന്മാരിലൂടെ’ എന്ന് സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: ‘നിങ്ങൾക്ക് അയച്ചുതന്നത്’ എന്ന ബന്ധവാക്യത്തിന്റെ സൂചകം
  choice: ബന്ധവാക്യം സ്വാഭാവികമായി ‘ന്യായപ്രമാണം’ അഥവാ ഉടമ്പടി-നിർദേശം എന്നതിനെ വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ നിലനിർത്തി.
  alternative: ഇത് പ്രവാചകസന്ദേശങ്ങളെ പൊതുവായി സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ ‘പിന്തിരിഞ്ഞ്... പാലിക്കുവിൻ’ എന്ന മുഴുവൻ ആജ്ഞയെ വീണ്ടും എടുത്തുപറയാം.
  rationale: ഹീബ്രു വാക്യഘടന മുൻപുള്ള תּוֹרָהയുമായുള്ള ബന്ധത്തെ പിന്തുണയ്ക്കുന്നു; എന്നിരുന്നാലും മറ്റു സാധ്യതകളെ ഇല്ലാതാക്കുന്ന വിശദീകരണപദങ്ങൾ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: עוּד എന്ന ക്രിയയിലെ മുന്നറിയിപ്പും പ്രതികൂലസാക്ഷ്യവും
  choice: മുഖ്യവാചകത്തിൽ ‘ഗൗരവമായി മുന്നറിയിപ്പു നൽകി’ എന്നു നൽകി.
  alternative: ‘ഇസ്രായേലിനും യെഹൂദയ്ക്കും എതിരായി സാക്ഷ്യം പറഞ്ഞു.’
  rationale: തുടർന്നുള്ള നേരിട്ടുള്ള ആഹ്വാനത്തിൽ മുന്നറിയിപ്പിന്റെ ആശയം പ്രധാനമാണ്; എന്നാൽ ന്യായവിധിസംബന്ധമായ സാക്ഷ്യത്തിന്റെ ഛായ യഥാർത്ഥമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. നേരിട്ടുള്ള ദൈവവചനത്തിൽ മാന്യവും സ്വാഭാവികവുമായ ബഹുവചന ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചു. ‘പ്രവാചകൻ/ദർശകൻ’, ‘കല്പന/ചട്ടം’ എന്നീ ഉറവിടപദവ്യത്യാസങ്ങൾ നിലനിർത്തി; അമിതമായ സംസ്കൃതവൽക്കരണവും വിഭാഗീയ പദപ്രയോഗവും ഒഴിവാക്കി.
