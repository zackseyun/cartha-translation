revisions:
- from: എന്നാൽ യഹോവ എല്ലാ പ്രവാചകന്മാരിലൂടെയും എല്ലാ ദർശകന്മാരിലൂടെയും ഇസ്രായേലിനും യെഹൂദയ്ക്കും ഗൗരവമായി മുന്നറിയിപ്പു നൽകി:[a] “നിങ്ങളുടെ ദുഷ്ടവഴികളിൽനിന്നു പിന്തിരിഞ്ഞ്, ഞാൻ നിങ്ങളുടെ പിതാക്കന്മാരോടു[b] കല്പിച്ചതും എന്റെ ദാസന്മാരായ പ്രവാചകന്മാരിലൂടെ[c] നിങ്ങൾക്ക് അയച്ചുതന്നതുമായ ന്യായപ്രമാണം മുഴുവനും അനുസരിച്ച് എന്റെ കല്പനകളും ചട്ടങ്ങളും പാലിക്കുവിൻ.”
