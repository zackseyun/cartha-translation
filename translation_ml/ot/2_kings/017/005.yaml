  text: וַ/יַּ֥עַל מֶֽלֶךְ אַשּׁ֖וּר בְּ/כָל הָ/אָ֑רֶץ וַ/יַּ֨עַל֙ שֹׁמְר֔וֹן וַ/יָּ֥צַר עָלֶ֖י/הָ שָׁלֹ֥שׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/005.yaml
  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
translation:
  language: ml
  text: അപ്പോൾ അശ്ശൂർരാജാവ് ദേശമെങ്ങും പടനീങ്ങി. പിന്നെ അവൻ ശമര്യയ്ക്കെതിരെ ചെന്ന്[a] മൂന്നു വർഷം അതിനെ ഉപരോധിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശമര്യയിലേക്കു കയറിച്ചെന്നു.” എബ്രായപ്രയോഗത്തിന് സാധാരണ കയറിച്ചെല്ലലിനെയോ സൈനികമുന്നേറ്റത്തെയോ സൂചിപ്പിക്കാം; എന്നാൽ തുടർന്നുള്ള “ഉപരോധിച്ചു” എന്ന ക്രിയ ഇവിടെ ശത്രുതാപരമായ അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: പടനീങ്ങി
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കയറിച്ചെല്ലുക’ എന്നാണെങ്കിലും, ഈ സൈനികസന്ദർഭത്തിൽ അത് ആക്രമണോദ്ദേശ്യത്തോടെയുള്ള മുന്നേറ്റത്തെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ആ സന്ദർഭാർഥം ‘പടനീങ്ങി’ വ്യക്തമാക്കുന്നു.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവ്
  rationale: എബ്രായ ഘടനയുടെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം; സന്ദർഭത്തിൽ നിർദിഷ്ടനായ രാജാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּכָל הָאָרֶץ
  choice: ദേശമെങ്ങും
  rationale: בְּ എന്ന ഉപസർഗം ഇവിടെ ദേശത്തിലൂടെയോ ദേശമാകെയോ ഉള്ള മുന്നേറ്റത്തിന്റെ വ്യാപ്തി സൂചിപ്പിക്കുന്നു. ‘ദേശമെങ്ങും’ പ്രവർത്തനത്തിന്റെ കൃത്യരീതി അനാവശ്യമായി നിർണയിക്കാതെ ആ വ്യാപ്തി നൽകുന്നു.
- source_word: וַיַּעַל שֹׁמְרוֹן
  choice: ശമര്യയ്ക്കെതിരെ ചെന്ന്
  rationale: നഗരത്തെ തുടർന്നു ഉപരോധിക്കുന്ന സൈനികവിവരണത്തിൽ עלה ശത്രുതാപരമായി മുന്നേറുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എതിരെ ചെന്ന്’ ആ സന്ദർഭാർഥം വ്യക്തമാക്കുമ്പോഴും ‘ആക്രമിച്ചു’ എന്നതുപോലെ അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: וַיָּצַר עָלֶיהָ
  choice: അതിനെ ഉപരോധിച്ചു
  rationale: צור എന്ന ക്രിയ ഇവിടെ ഒരു നഗരത്തെ സൈനികമായി വളഞ്ഞ് ഉപരോധിക്കുക എന്ന അർഥത്തിലാണ്. ‘ഉപരോധിച്ചു’ കൃത്യവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: മൂന്നു വർഷം
  rationale: പ്രവർത്തനത്തിന്റെ ദൈർഘ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് രേഖപ്പെടുത്തുന്നു.
