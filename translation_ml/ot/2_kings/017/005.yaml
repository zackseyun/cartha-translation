translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള וַיַּעַל എന്ന പ്രയോഗം മലയാളത്തിൽ യഥാക്രമം ‘പടനീങ്ങി’, ‘എതിരെ ചെന്ന്’ എന്നു സന്ദർഭാനുസൃതമായി നൽകിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
