  terminology: ‘പതിവുരീതി’ appropriately preserves the contextual range of מִשְׁפָּט as customary practice without prematurely narrowing it to a formal religious rite. The footnote retains ‘ചട്ടം’ and ‘നിയമം’ as lexical alternatives.
