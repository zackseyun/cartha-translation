  text: וַ/יְהִ֗י בִּ/תְחִלַּת֙ שִׁבְתָּ֣/ם שָׁ֔ם לֹ֥א יָרְא֖וּ אֶת יְהוָ֑ה וַ/יְשַׁלַּ֨ח יְהוָ֤ה בָּ/הֶם֙ אֶת הָ֣/אֲרָי֔וֹת וַ/יִּֽהְי֥וּ הֹרְגִ֖ים בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
translation:
  language: ml
  text: അവർ അവിടെ താമസിക്കാൻ തുടങ്ങിയ കാലത്ത് യഹ്‌വെയെ ഭയപ്പെട്ടില്ല[a]. അതുകൊണ്ട് യഹ്‌വെ അവരുടെ ഇടയിൽ സിംഹങ്ങളെ അയച്ചു; അവ അവരിൽ ചിലരെ കൊന്നുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയെ ഭക്ത്യാദരത്തോടെ മാനിച്ചില്ല.” ഇവിടെ “ഭയപ്പെടുക” എന്ന എബ്രായപ്രയോഗത്തിൽ വെറും പേടി മാത്രമല്ല, ഭക്ത്യാദരവും ദൈവത്തോടുള്ള വിശ്വസ്തമായ പ്രതികരണവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם שָׁם
  choice: അവർ അവിടെ താമസിക്കാൻ തുടങ്ങിയ കാലത്ത്
  rationale: താമസത്തിന്റെ ആരംഭഘട്ടം സൂചിപ്പിക്കുന്ന എബ്രായ ഘടനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘താമസം’ എന്ന ആശയവും ആരംഭകാലത്തിന്റെ സമയസൂചനയും നിലനിർത്തുന്നു.
- source_word: יָרְאוּ אֶת־יְהוָה
  choice: യഹ്‌വെയെ ഭയപ്പെട്ടില്ല
  rationale: ירא എന്ന പദത്തിന്റെ അടിസ്ഥാനരൂപമായ ‘ഭയപ്പെടുക’ നിലനിർത്തുന്നു. ഇവിടെ അത് വെറും പേടിയല്ല, ദൈവത്തോടുള്ള ഭക്ത്യാദരവും അംഗീകാരവും ഉൾക്കൊള്ളുന്നതിനാൽ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ഉച്ചാരണസഹജമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיְשַׁלַּח יְהוָה בָּהֶם אֶת הָאֲרָיוֹת
  choice: യഹ്‌വെ അവരുടെ ഇടയിലേക്കു സിംഹങ്ങളെ അയച്ചു
  rationale: בָּהֶם ഇവിടെ സിംഹങ്ങളെ അവരുടെ മധ്യത്തിലേക്ക് അയച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘ഇടയിലേക്കു’ സന്ദർഭത്തിന് സ്വാഭാവികവും അർത്ഥസുതാര്യവുമാണ്.
- source_word: וַיִּהְיוּ הֹרְגִים בָּהֶם
  choice: അവ അവരിൽ ചിലരെ കൊന്നുകൊണ്ടിരുന്നു
  rationale: היה + കർത്തൃവാചക കൃത്തിനാമം ആവർത്തിച്ചോ തുടർന്നോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കൊന്നുകൊണ്ടിരുന്നു’ ആ ഭാവം നിലനിർത്തുന്നു. בָּהֶם-ന്റെ ഭാഗിക അർത്ഥം ‘അവരിൽ ചിലരെ’ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ സംരക്ഷിക്കുന്നു. ‘യഹ്‌വെ’ എന്ന രൂപം Yahweh എന്ന സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമാണ്.
- issue: ‘യഹ്‌വെയെ ഭയപ്പെടുക’ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: ‘ഭയപ്പെടുക’ എന്ന മൂലരൂപം നിലനിർത്തി അടിക്കുറിപ്പിൽ ഭക്ത്യാദരത്തിന്റെ അർത്ഥം വ്യക്തമാക്കുക
  alternative: യഹ്‌വെയെ ഭക്ത്യാദരത്തോടെ മാനിച്ചില്ല
  rationale: മൂലത്തിലെ ഭയം–ഭക്ത്യാദരം എന്നീ അർത്ഥങ്ങൾക്കിടയിലെ ഉദ്ദേശപൂർവമായ വ്യാപ്തി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു; ‘ആരാധിച്ചില്ല’ എന്നു മാത്രം പറയുന്നത് അർത്ഥത്തെ അനാവശ്യമായി പരിമിതപ്പെടുത്തും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ആവർത്തിത പ്രവൃത്തിയുടെ ഭാവം ‘കൊന്നുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തി; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
