  to: അപ്പോൾ ശമര്യയിൽനിന്ന് അവർ നാടുകടത്തിയ പുരോഹിതന്മാരിൽ ഒരാൾ വന്ന് ബേഥേലിൽ താമസിച്ചു. എങ്ങനെ യാഹ്‌വെയെ[a] ഭയപ്പെടണം എന്ന് അവൻ അവരെ പഠിപ്പിച്ചു.
  rationale: മൂലത്തിലെ ആഖ്യാനക്രമവും വ്യക്തമാക്കാത്ത ബഹുവചനകർത്താവായ ‘അവർ’ എന്നതും നിലനിർത്തി. പഠിപ്പിക്കലിന്റെ കാലഭാവത്തെ അനാവശ്യമായി ശക്തമാക്കാതെ ലളിതമായ ഭൂതകാലരൂപം ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് മുഖ്യപാഠത്തിലെ യാഹ്‌വെ എന്ന രൂപത്തോടു യോജിക്കുന്നവിധം വ്യക്തമാക്കി.
