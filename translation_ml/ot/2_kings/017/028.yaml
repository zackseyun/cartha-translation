reference: 2 Kings 17:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֞א אֶחָ֣ד מֵ/הַ/כֹּהֲנִ֗ים אֲשֶׁ֤ר הִגְלוּ֙ מִ/שֹּׁ֣מְר֔וֹן וַ/יֵּ֖שֶׁב בְּ/בֵֽית אֵ֑ל וַֽ/יְהִי֙ מוֹרֶ֣ה אֹתָ֔/ם אֵ֖יךְ יִֽירְא֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
translation:
  language: ml
  text: അപ്പോൾ ശമര്യയിൽനിന്ന് അവർ നാടുകടത്തിയ പുരോഹിതന്മാരിൽ ഒരാൾ വന്ന് ബേഥേലിൽ താമസിച്ചു. എങ്ങനെ യാഹ്‌വെയെ[a] ഭയപ്പെടണം എന്ന് അവൻ അവരെ പഠിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’—ദൈവനാമം; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പരമ്പരാഗത പരിഭാഷയും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അപ്പോൾ ... വന്നു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിന്റെ ക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ ഈ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: പുരോഹിതന്മാരിൽ ഒരാൾ
  rationale: ഒരു വലിയ കൂട്ടത്തിൽനിന്നുള്ള ഒരാളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരായ മലയാളരൂപം.
- source_word: אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן
  choice: ശമര്യയിൽനിന്ന് അവർ നാടുകടത്തിയ
  rationale: הגלה എന്ന ഹിഫീൽ രൂപം ബലമായി പ്രവാസത്തിലാക്കുക എന്നർഥം നൽകുന്നു. ക്രിയയുടെ വ്യക്തമാക്കാത്ത ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നു നിലനിർത്തി.
- source_word: וַיֵּשֶׁב בְּבֵית אֵל
  choice: ബേഥേലിൽ താമസിച്ചു
  rationale: ישב ഇവിടെ അവിടെ വസിക്കാൻ തുടങ്ങുന്നതിനെയോ വസിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; ‘താമസിച്ചു’ സ്വാഭാവികവും അതിരുകടന്ന സ്ഥിരത സൂചിപ്പിക്കാത്തതുമാണ്.
- source_word: וַיְהִי מוֹרֶה
  choice: പഠിപ്പിച്ചുപോന്നു
  rationale: היה + കർത്തൃവാചക രൂപം തുടരുന്ന അഥവാ പതിവായ പ്രവർത്തനം സൂചിപ്പിക്കാം; ‘പഠിപ്പിച്ചുപോന്നു’ അതിന്റെ ദൈർഘ്യഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵיךְ יִירְאוּ
  choice: എങ്ങനെ ഭയപ്പെടണമെന്ന്
  rationale: വെറും ഭയം അനുഭവിക്കുക എന്നതിലുപരി, യാഹ്‌വെയോടുള്ള ശരിയായ ഭക്തിഭയം എങ്ങനെയായിരിക്കണം എന്ന നിർദേശാത്മക അർഥം ഈ രൂപം തുറന്നുവെക്കുന്നു.
- source_word: אֶת יְהוָה
  choice: യാഹ്‌വെയെ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു സ്ഥാനപദംകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരണം ചെയ്തു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പേരിന്റെ സ്വഭാവം നിലനിർത്താൻ ‘യാഹ്‌വെ’ എന്ന് ശബ്ദാന്തരണം ചെയ്തു; പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ നൽകി.
- issue: יִירְאוּ എന്നതിലെ ‘ഭയം’
  choice: ഭയപ്പെടുക
  alternative: ഭക്തിയോടെ ആരാധിക്കുക; ബഹുമാനിക്കുക
  rationale: ‘ഭയപ്പെടുക’ എന്ന അടിസ്ഥാനരൂപം മൂലപദത്തിന്റെ അർഥവ്യാപ്തിയും ദൈവഭയത്തെ ചുറ്റിയുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; അതിനെ ‘ആരാധിക്കുക’ എന്നൊന്നിലേക്ക് ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ആഖ്യാനക്രമം സ്വാഭാവികമാക്കി; വ്യക്തമാക്കാത്ത ‘അവർ’ എന്ന കർത്താവും പഠിപ്പിക്കൽ തുടരുന്ന ഭാവവും മൂലപാഠാനുസൃതമായി നിലനിർത്തി.
