    rationale: וַיְהִי מוֹרֶה ഒരു പതിവായ/സ്വഭാവസൂചക പഠിപ്പിക്കൽ അനുവദിക്കുന്നെങ്കിലും, ‘-ച്ചുപോന്നു’ പ്രവൃത്തിയുടെ ദൈർഘ്യവും പുരോഗതിയും താരതമ്യേന ശക്തമായി സൂചിപ്പിക്കുന്നു. ‘പഠിപ്പിച്ചു’ സന്ദർഭത്തിനും മൂലത്തിന്റെ വ്യാപ്തിക്കും കൂടുതൽ നിഷ്പക്ഷമാണ്.
