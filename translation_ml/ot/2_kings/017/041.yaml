base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
translation:
  language: ml
  text: അങ്ങനെ ഈ ജനതകൾ യഹോവയെ ഭയപ്പെട്ടിരുന്നു; എങ്കിലും അവർ തങ്ങളുടെ കൊത്തുപ്രതിമകളെ[a] സേവിച്ചുകൊണ്ടിരുന്നു. അവരുടെ മക്കളും അവരുടെ മക്കളുടെ മക്കളും, അവരുടെ പിതാക്കന്മാർ ചെയ്തതുപോലെ, ഇന്നുവരെയും ചെയ്തുകൊണ്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ വിഗ്രഹങ്ങളെ.” എബ്രായപദം പ്രത്യേകമായി കൊത്തിയുണ്ടാക്കിയ ആരാധനാബിംബങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: അങ്ങനെ ... ഭയപ്പെട്ടിരുന്നു
  rationale: വാവ്-തുടർച്ച ഇവിടെ വിവരണത്തിന്റെ സമാപനഫലം സംഗ്രഹിക്കുന്നു; അതിനാൽ വെറും ‘അവർ’ എന്നതിനെക്കാൾ ‘അങ്ങനെ’ സ്വാഭാവികമാണ്.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ഈ ജനതകൾ
  rationale: ശമര്യയിൽ പാർപ്പിക്കപ്പെട്ട വിവിധ വിദേശ ജനവിഭാഗങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘ജനതകൾ’ ഈ ബഹുവചനവും വംശീയ-സാമൂഹിക അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: യഹോവയെ ഭയപ്പെട്ടിരുന്നു
  rationale: യഹോവയോടുള്ള മതപരമായ ഭയം/ഭക്ത്യാദരം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു; അതിന്റെ സ്വഭാവത്തെ കൂടുതൽ വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְאֶת פְּסִילֵיהֶם
  choice: എന്നിട്ടും തങ്ങളുടെ കൊത്തിയുണ്ടാക്കിയ വിഗ്രഹങ്ങളെ
  rationale: פְּסִילִים കൊത്തിയുണ്ടാക്കിയ ആരാധനാബിംബങ്ങളാണ്. ‘എന്നിട്ടും’ ഭയപ്പെടലും വിഗ്രഹസേവയും ഒരുമിച്ചുണ്ടായിരുന്ന വിരോധാഭാസം വ്യക്തമാക്കുന്നു; അതിനെ ഇല്ലാതാക്കുന്നില്ല.
- source_word: הָיוּ עֹבְדִים
  choice: സേവിച്ചുകൊണ്ടിരുന്നു
  rationale: പരിപ്രാസ്തിക രൂപത്തിന്റെ പതിവായും തുടർന്നും നടന്ന പ്രവൃത്തി എന്ന ഭാവം നൽകുന്നു; ‘സേവിക്കുക’ עבד എന്ന പദത്തിന്റെ വിശാലമായ ആരാധനാസേവന അർത്ഥം സൂക്ഷിക്കുന്നു.
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: അവരുടെ മക്കളും മക്കളുടെ മക്കളും
  rationale: തലമുറകളുടെ തുടർച്ച വ്യക്തമാക്കുകയും ‘മക്കളുടെ മക്കൾ’ എന്ന എബ്രായ ആവർത്തനഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: അവരുടെ പിതാക്കന്മാർ ചെയ്തതുപോലെ
  rationale: പൂർവികരോടുള്ള താരതമ്യം നേരിട്ടും മാന്യമായും നൽകുന്നു.
- source_word: הֵם עֹשִׂים
  choice: അവർ ചെയ്തുകൊണ്ടിരിക്കുന്നു
  rationale: കർത്തൃസർവനാമത്തിലെ ഊന്നലും വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തി എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: എബ്രായ കാലസൂത്രത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാളരൂപം.
theological_decisions:
- issue: യഹോവാഭയവും വിഗ്രഹസേവയും ഒരുമിച്ചു പറയുന്നത്
  choice: ‘യഹോവയെ ഭയപ്പെട്ടിരുന്നു; എന്നിട്ടും ... വിഗ്രഹങ്ങളെ സേവിച്ചുകൊണ്ടിരുന്നു’ എന്ന വൈരുധ്യം നിലനിർത്തി.
  alternative: അവർ യഹോവയെ യഥാർഥമായി ആരാധിച്ചില്ല എന്നോ യഹോവാഭയം നടിച്ചതേയുള്ളൂ എന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായപാഠം രണ്ടു പ്രവൃത്തികളും പ്രസ്താവിക്കുന്നുവെങ്കിലും അവരുടെ ഭയം ആത്മാർഥമോ ബാഹ്യമോ സമ്മിശ്രാരാധനാപരമോ എന്ന് ഇവിടെ തീർപ്പാക്കുന്നില്ല. വിവർത്തനം ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. തുടർച്ചയായ പ്രവൃത്തിയെ ‘-കൊണ്ടിരുന്നു/കൊണ്ടിരിക്കുന്നു’ രൂപങ്ങൾകൊണ്ട് പ്രകടിപ്പിച്ചു. പ്രധാന പാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
