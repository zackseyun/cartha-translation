  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ സകല കൽപ്പനകളും ഉപേക്ഷിച്ചു; തങ്ങൾക്കായി ലോഹം വാർത്ത് രണ്ടു കാളക്കുട്ടികളെ ഉണ്ടാക്കി; ഒരു അശേരാ[a] ഉണ്ടാക്കി; ആകാശസൈന്യത്തെ മുഴുവനും കുനിഞ്ഞ് നമസ്കരിച്ചു; ബാലിനെ സേവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശേരാ സ്തംഭം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ ‘അശേരാ’ എന്ന പദം കനാന്യദേവിയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: ഉപേക്ഷിച്ചു
  rationale: עזב ഇവിടെ സാധാരണയായി വിട്ടുപോകുക എന്നതിലുപരി ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയും പൂർണമായ തിരിഞ്ഞുപോക്കും സൂചിപ്പിക്കുന്നു.
- source_word: כָּל מִצְוֺת
  choice: സകല കല്പനകളും
  rationale: ‘സകല’ എന്ന സമഗ്രതയും מִצְוֺת എന്ന ഉടമ്പടിസംബന്ധിയായ കല്പനകളുടെ അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദൈവമായ യഹ്‌വെ
  rationale: ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു നൽകുകയും ബന്ധസൂചകമായ ‘അവരുടെ ദൈവം’ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיַּעֲשׂוּ לָהֶם מַסֵּכָה שנים עֲגָלִים
  choice: തങ്ങൾക്കായി ലോഹം വാർത്ത് രണ്ടു കാളക്കുട്ടികളുടെ രൂപങ്ങൾ ഉണ്ടാക്കി
  rationale: מַסֵּכָהയുടെ ലോഹം വാർക്കുന്ന നിർമാണരീതിയും לָהֶם എന്ന ‘തങ്ങൾക്കായി’ എന്ന ആശയവും രണ്ടു കാളക്കുട്ടികൾ എന്ന തിരിച്ചറിയലും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ഏകവചന-ബഹുവചന ഘടന മലയാളത്തിൽ അസ്വാഭാവികമായി പകർത്തുന്നില്ല.
- source_word: אֲשֵׁירָה
  choice: ഒരു അശേര
  rationale: ദേവിയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാവുന്ന എബ്രായപദത്തിന്റെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: കുമ്പിട്ട് നമസ്കരിച്ചു
  rationale: വെറും പൊതുവായ ‘ആരാധിച്ചു’ എന്നതിലേക്കു ചുരുക്കാതെ ശരീരം കുനിച്ച് പ്രണമിക്കുന്ന പ്രവൃത്തി പ്രകടമാക്കുന്നു.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: ആകാശസൈന്യം മുഴുവനെയും
  rationale: നക്ഷത്രാദിയായ ആകാശഗോളങ്ങളെ ഒരു സൈന്യമായി കാണുന്ന മൂലഭാഷയിലെ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיַּעַבְדוּ אֶת הַבָּעַל
  choice: ബാലിനെ സേവിച്ചു
  rationale: עבד സൂചിപ്പിക്കുന്ന ആരാധനാപരമായ സേവനം മുൻപത്തെ പ്രണാമപ്രവൃത്തിയിൽനിന്ന് വേർതിരിച്ചുനിർത്തുന്നു; הַבָּעַל സ്വാഭാവികമായി ‘ബാൽ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אֲשֵׁירָהയുടെ അർഥപരിധി
  choice: അശേര
  alternative: അശേരാദേവി / അശേരാസ്തംഭം
  rationale: ‘ഉണ്ടാക്കി’ എന്ന ക്രിയ ആരാധനാവസ്തുവിനെ സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ടെങ്കിലും പദം ദേവിയെയും അവളുടെ ആരാധനാവസ്തുവിനെയും സൂചിപ്പിക്കാം; അതിനാൽ മുഖ്യപാഠം ഒന്നിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. തുടർച്ചയായ പ്രവൃത്തികളെ ചെറുവാക്യങ്ങളും അർധവിരാമങ്ങളും ഉപയോഗിച്ച് വ്യക്തമായി ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ആശയപരമായി ബന്ധപ്പെട്ട ‘അശേര’ എന്ന പദത്തിനുശേഷം തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
