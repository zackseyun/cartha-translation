  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളോടു ചെയ്ത ഉടമ്പടി[a] നിങ്ങൾ മറക്കരുത്[b]; മറ്റു ദേവന്മാരെ ഭയപ്പെടരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഞാൻ നിങ്ങളോടുകൂടെ വെട്ടിയ ഉടമ്പടി.’ ഉടമ്പടി സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി സ്വാഭാവിക മലയാളത്തിൽ ‘ചെയ്ത ഉടമ്പടി’ എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘നിങ്ങൾ മറക്കുകയില്ല.’ ഇവിടെ എബ്രായരൂപം സന്ദർഭത്തിൽ നിരോധനമായതിനാൽ ‘മറക്കരുത്’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרִית
  choice: ഉടമ്പടി
  rationale: ദൈവം സ്ഥാപിച്ച ബന്ധത്തിന്റെ ഔപചാരികവും ദൈവശാസ്ത്രപരവുമായ അർഥം നിലനിർത്തുന്നതിനാൽ ‘കരാർ’ എന്നതിനെക്കാൾ ‘ഉടമ്പടി’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: ഞാൻ നിങ്ങളോടു ചെയ്ത
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘നിങ്ങളോടുകൂടെ വെട്ടിയ’ എന്ന ഉടമ്പടി-സ്ഥാപന ശൈലിയാണ്; സ്വാഭാവിക മലയാളത്തിൽ ‘നിങ്ങളോടു ചെയ്ത’ എന്ന് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לֹא תִשְׁכָּחוּ
  choice: നിങ്ങൾ മറക്കരുത്
  rationale: לֹא ചേർന്ന imperfect ഇവിടെ നിരോധനാത്മക നിർദേശമാണ്. ‘മറക്കരുത്’ ആജ്ഞയുടെ സ്വാഭാവിക മലയാളരൂപമാണ്; ബഹുവചന അഭിസംബോധന ‘നിങ്ങൾ’ വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא תִירְאוּ
  choice: ഭയപ്പെടുകയും അരുത്
  rationale: יָרֵא എന്നത് ഭയം, ഭക്തിപൂർവമായ ആദരം, മതപരമായ വിധേയത്വം എന്നിവ സൂചിപ്പിക്കാം. ‘ഭയപ്പെടുക’ മൂലപദത്തിന്റെ വിശാലതയും ബൈബിൾപരമായ ഉടമ്പടി പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: മറ്റു ദേവന്മാരെ
  rationale: യിസ്രായേലിന്റെ ദൈവത്തിനു പുറമേയുള്ള ദേവന്മാരെ സൂചിപ്പിക്കുന്ന പതിവ് ഉടമ്പടി പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപമാണിത്.
theological_decisions:
- issue: ഉടമ്പടി-ശൈലിയും നിരോധനങ്ങളുടെ സ്വരവും
  choice: ‘ഞാൻ നിങ്ങളോടു ചെയ്ത ഉടമ്പടി നിങ്ങൾ മറക്കരുത്; മറ്റു ദേവന്മാരെ ഭയപ്പെടുകയും അരുത്.’
  alternative: ‘ഞാൻ നിങ്ങളോടു ചെയ്ത ഉടമ്പടി നിങ്ങൾ മറക്കുകയില്ല; മറ്റു ദേവന്മാരെ ഭയപ്പെടുകയുമില്ല.’
  rationale: എബ്രായ imperfect രൂപങ്ങൾക്ക് ഭാവികാല പ്രസ്താവനയുടെ രൂപം നൽകാനാകുമെങ്കിലും, ഈ സന്ദർഭത്തിൽ അവ നിരോധനാത്മക ഉടമ്പടി നിർദേശങ്ങളാണ്. മലയാളത്തിൽ ‘അരുത്’ അതിനെ സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
- issue: יָרֵא എന്നതിന്റെ മതപരമായ അർഥവ്യാപ്തി
  choice: ‘ഭയപ്പെടുക’
  alternative: ‘ആരാധിക്കുക’ അല്ലെങ്കിൽ ‘ഭക്ത്യാദരത്തോടെ വണങ്ങുക’
  rationale: സന്ദർഭത്തിൽ മതപരമായ വിധേയത്വം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, ‘ആരാധിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലത്തിലെ ഭയം/ഭക്ത്യാദരം എന്ന അർഥവ്യാപ്തിയെ അനാവശ്യമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉടമ്പടി’, ‘മറ്റു ദേവന്മാർ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി. ആവർത്തിതമായ എബ്രായ നിരോധനഘടന മലയാളത്തിൽ ‘മറക്കരുത്; ... ഭയപ്പെടുകയും അരുത്’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
