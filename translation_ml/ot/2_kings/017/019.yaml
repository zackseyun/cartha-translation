reference: 2 Kings 17:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: גַּם יְהוּדָ֕ה לֹ֣א שָׁמַ֔ר אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יֵּ֣לְכ֔וּ בְּ/חֻקּ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
translation:
  language: ml
  text: യെഹൂദപോലും[a] തങ്ങളുടെ ദൈവമായ യഹ്‌വേയുടെ കൽപ്പനകൾ പാലിച്ചില്ല; ഇസ്രായേൽ ഉണ്ടാക്കിയ ചട്ടങ്ങളനുസരിച്ച് അവർ നടന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെഹൂദയും’ എന്നും പരിഭാഷപ്പെടുത്താം. വാക്യാരംഭത്തിലെ പദം ഇസ്രായേലിനെപ്പോലെ യെഹൂദയും കുറ്റക്കാരായിരുന്നുവെന്ന് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇസ്രായേലിന്റെ ചട്ടങ്ങൾ പിന്തുടർന്നു’ എന്നോ ‘ഇസ്രായേൽ ആചരിച്ചിരുന്ന പതിവുകൾ പിന്തുടർന്നു’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: പോലും
  rationale: സന്ദർഭത്തിൽ ഇസ്രായേൽ മാത്രമല്ല, യെഹൂദയും അതേ കുറ്റത്തിൽ പങ്കാളിയായിരുന്നുവെന്ന ഊന്നൽ നൽകുന്നു. ‘പോലും’ ഈ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְהוּדָה
  choice: യെഹൂദ
  rationale: തെക്കൻ രാജ്യത്തിന്റെ പേരായതിനാൽ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: שָׁמַר
  choice: പാലിച്ചില്ല
  rationale: കല്പനകളോടൊപ്പം വരുമ്പോൾ ‘അനുസരിക്കുക/പാലിക്കുക’ എന്ന ഉടമ്പടിപരമായ അർഥമാണ്. ആധുനിക മലയാളത്തിൽ ‘കല്പനകൾ പാലിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִצְוֺת
  choice: കല്പനകൾ
  rationale: നിയമപരവും ഉടമ്പടിപരവുമായ ഭാവം നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദൈവമായ
  rationale: എബ്രായത്തിലെ മൂന്നാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം നിലനിർത്തുന്നു; ‘യെഹൂദ’ ഇവിടെ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന കൂട്ടനാമമാണ്.
- source_word: וַיֵּלְכוּ
  choice: അവർ നടന്നു
  rationale: הלך എന്ന ക്രിയയുടെ ‘ജീവിതാചരണത്തിൽ ഒരു മാർഗം പിന്തുടരുക’ എന്ന രൂപകം നിലനിർത്തി. വാക്യത്തിലെ വിരോധഭാവം മലയാളത്തിലെ അർധവിരാമവും വാക്യക്രമവും വ്യക്തമാക്കുന്നു.
- source_word: בְּחֻקּוֹת
  choice: ചട്ടങ്ങളനുസരിച്ച്
  rationale: חֻקּוֹת എന്നത് ചട്ടങ്ങൾ, നിയമങ്ങൾ, സ്ഥാപിത ആചാരങ്ങൾ എന്നിവ സൂചിപ്പിക്കാം. בְ എന്നതിന് ഇവിടെ ‘അനുസരിച്ച്’ എന്നു നൽകുന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: സന്ദർഭത്തിൽ വടക്കൻ രാജ്യത്തെ സൂചിപ്പിക്കുന്ന പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: אֲשֶׁר עָשׂוּ
  choice: ഇസ്രായേൽ ഉണ്ടാക്കിയ
  rationale: ബഹുവചനക്രിയയുടെ കർത്താവായി കൂട്ടനാമമായ ‘ഇസ്രായേൽ’ മനസ്സിലാക്കാം. ചട്ടങ്ങൾ ഉണ്ടാക്കുക/സ്ഥാപിക്കുക എന്ന സാധ്യമായ അർഥം പ്രധാനവാചകത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה തന്നെയാണ് ഉള്ളത്. അതിനാൽ സ്ഥാനപ്പേരിലേക്കു മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: אֲשֶׁר עָשׂוּ എന്നതിന്റെ കർത്താവും അർഥവും
  choice: ഇസ്രായേൽ ഉണ്ടാക്കിയ
  alternative: അവർ ആചരിച്ച; ഇസ്രായേലിന്റെ ചട്ടങ്ങൾ അനുസരിച്ച്
  rationale: എബ്രായ ബഹുവചനക്രിയയ്ക്ക് കൂട്ടനാമമായ ഇസ്രായേൽ കർത്താവാകാം; עשה ഇവിടെ ചട്ടങ്ങൾ സ്ഥാപിക്കുക എന്നോ അവ ആചരിക്കുക എന്നോ ഗ്രഹിക്കാം. പ്രധാനവാചകം ആദ്യസാധ്യത സ്വീകരിക്കുകയും അടിക്കുറിപ്പ് മറ്റുസാധ്യതകൾ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘അവർ നടന്നു’ എന്ന എബ്രായ ജീവിതാചരണരൂപകം നിലനിർത്തിയെങ്കിലും ‘ചട്ടങ്ങളനുസരിച്ച്’ എന്ന പ്രയോഗം അർഥം വ്യക്തമാക്കുന്നു. ‘യെഹൂദ’ കൂട്ടനാമമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ബഹുവചനസൂചനയുള്ള ‘തങ്ങളുടെ/അവർ’ നിലനിർത്തി.
