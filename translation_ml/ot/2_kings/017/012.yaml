id: 2KI.17.12
reference: 2 Kings 17:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּֽעַבְד֖וּ הַ/גִּלֻּלִ֑ים אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם לֹ֥א תַעֲשׂ֖וּ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/012.yaml
  text: They served the idols[a], concerning which Yahweh had said to them, “You shall not do this thing.”
translation:
  language: ml
  text: അവർ വിഗ്രഹങ്ങളെ[a] സേവിച്ചു; അവയെക്കുറിച്ച് യഹ്‌വെ അവരോട്, “നിങ്ങൾ ഈ കാര്യം ചെയ്യരുത്” എന്നു പറഞ്ഞിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിഗ്രഹങ്ങൾ” എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം നിന്ദാസൂചനയുള്ളതാണ്; “മലിനവിഗ്രഹങ്ങൾ” അഥവാ “ചാണകവിഗ്രഹങ്ങൾ” എന്നതുപോലുള്ള അവഹേളനഭാവം അതിനുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: അവർ … സേവിച്ചു
  rationale: עבד എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘സേവിക്കുക’ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അത് ആരാധനാപരമായ സേവനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: הַגִּלֻּלִים
  choice: വിഗ്രഹങ്ങളെ[a]
  rationale: വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായ ‘വിഗ്രഹങ്ങൾ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; എബ്രായപദത്തിന്റെ ശക്തമായ നിന്ദാസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: אֲשֶׁר
  choice: അവയെക്കുറിച്ച്
  rationale: തുടർന്നുവരുന്ന ദൈവിക വിലക്ക് വിഗ്രഹങ്ങളെയും അവയോടുള്ള സേവനത്തെയും സംബന്ധിക്കുന്നുവെന്ന ബന്ധം, അമിതമായി വ്യാഖ്യാനിക്കാതെ, സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָמַר יְהוָה לָהֶם
  choice: യഹ്‌വെ അവരോട് … എന്നു പറഞ്ഞിരുന്നു
  rationale: പ്രധാന ആഖ്യാനക്രിയയ്ക്കു മുമ്പുണ്ടായ ദൈവിക കല്പനയെ ‘പറഞ്ഞിരുന്നു’ എന്നു സൂചിപ്പിക്കുന്നു; יהוה എന്ന ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לֹא תַעֲשׂוּ אֶת־הַדָּבָר הַזֶּה
  choice: നിങ്ങൾ ഈ കാര്യം ചെയ്യരുത്
  rationale: നിഷേധകല്പനയുടെ ബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും דָּבָר എന്നതിന്റെ വിശാലമായ അർഥം ‘കാര്യം’ എന്ന പദത്തിലൂടെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പദവിയാക്കി മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ ‘Yahweh’ എന്ന ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: വിഗ്രഹാരാധനയെ സൂചിപ്പിക്കുന്ന עבד എന്ന ക്രിയ
  choice: സേവിച്ചു
  alternative: ആരാധിച്ചു
  rationale: മതപരമായ അർഥം സന്ദർഭത്തിൽ വ്യക്തമായിരിക്കെ, ‘സേവിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും ഉടമ്പടിപരമായ സേവനഭാഷയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ബന്ധവാക്യം അർധവിരാമത്തിലൂടെ സ്വാഭാവികമാക്കി; വിലക്കിന്റെ വിഷയബന്ധം ‘അവയെക്കുറിച്ച്’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തി.
