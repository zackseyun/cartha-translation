  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
translation:
  language: ml
  text: അതിനാൽ യഹ്‌വെ ഇസ്രായേലിനോട് അത്യന്തം കോപിച്ച് അവരെ തന്റെ സന്നിധിയിൽനിന്ന് നീക്കിക്കളഞ്ഞു[a]. യെഹൂദാഗോത്രം മാത്രമേ ശേഷിച്ചിരുന്നുള്ളു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ മുഖത്തിന്റെ മുമ്പിൽനിന്ന്.’ ഹീബ്രുവിലെ അക്ഷരാർഥം ഇതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַנַּף ... מְאֹד
  choice: അത്യന്തം കോപിച്ച്
  rationale: התאנף എന്ന ക്രിയയുടെ ശക്തമായ കോപഭാവവും מְאֹד എന്ന തീവ്രതാസൂചകവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ അംഗീകരിക്കപ്പെട്ട ശബ്ദലിപ്യന്തരണം മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനോട്
  rationale: കോപത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന בְ എന്ന ഉപസർഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഇവിടെ ഇസ്രായേൽ വടക്കൻ രാജ്യത്തെയും അതിലെ ജനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: וַיְסִרֵם
  choice: അവരെ ... നീക്കിക്കളഞ്ഞു
  rationale: סור എന്ന ക്രിയയുടെ കാരണകർത്തൃപ്രയോഗം ‘നീക്കുക’ എന്ന് നേരിട്ട് നൽകുന്നു; പ്രവാസം എന്ന സന്ദർഭസൂചന ക്രിയയിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: מֵעַל פָּנָיו
  choice: തന്റെ സന്നിധിയിൽനിന്ന്
  rationale: ഹീബ്രുവിലെ ‘തന്റെ മുഖത്തിന്റെ മുമ്പിൽനിന്ന്’ എന്ന രൂപകപ്രയോഗത്തിന്റെ സാന്നിധ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לֹא נִשְׁאַר רַק שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: യെഹൂദാഗോത്രം മാത്രമല്ലാതെ ആരും ശേഷിച്ചില്ല
  rationale: നിഷേധം, ഒഴിവാക്കൽ, ‘ഒറ്റയ്ക്ക്/മാത്രം’ എന്ന ഊന്നൽ എന്നിവ മലയാളത്തിലെ സ്വാഭാവിക നിഷേധഘടനയിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: מֵעַל פָּנָיו എന്നതിലെ ദൈവമുഖത്തെക്കുറിച്ചുള്ള മാനവരൂപക ഭാഷ
  choice: പ്രധാനവാക്യത്തിൽ ‘തന്റെ സന്നിധിയിൽനിന്ന്’; അടിക്കുറിപ്പിൽ അക്ഷരാർഥം
  alternative: തന്റെ മുഖത്തിന്റെ മുമ്പിൽനിന്ന്
  rationale: ഹീബ്രു ദൈവത്തിന്റെ ‘മുഖം’ എന്ന സജീവമായ രൂപകഭാഷ ഉപയോഗിക്കുന്നു. മലയാളത്തിൽ അക്ഷരാർഥം പ്രധാനവാക്യത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ സാന്നിധ്യാർഥം നൽകി, ഉറവിടത്തിലെ രൂപകം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
- issue: ‘ഇസ്രായേൽ’ എന്നതിന്റെ സന്ദർഭസൂചിത അർഥം
  choice: പദം വിശദീകരിക്കാതെ ‘ഇസ്രായേൽ’ എന്നുതന്നെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വടക്കൻ രാജ്യവും ജനവുമാണ്
  alternative: ഇസ്രായേൽ മുഴുവൻ ഉടമ്പടിജനതയെയും വിശാലമായി സൂചിപ്പിക്കുന്നു
  rationale: 2 രാജാക്കന്മാർ 17-ന്റെ അടിയന്തര ചരിത്രസന്ദർഭം വടക്കൻ രാജ്യത്തിന്റെ വീഴ്ചയും നാടുകടത്തലുമാണ്. വിവർത്തനം ആ പേരിനെ വികസിപ്പിച്ച് വ്യാഖ്യാനിക്കാതെ മൂലപാഠത്തിന്റെ പരിധി പാലിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യഹ്‌വെ’ ദൈവനാമത്തിന്റെ ലിപ്യന്തരണമായി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ശക്തമായ കോപം, നീക്കിക്കളയൽ, യെഹൂദ മാത്രം ശേഷിച്ചെന്ന ഊന്നൽ എന്നിവ സംക്ഷിപ്തമായി നിലനിർത്തി; [a] എന്ന അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
