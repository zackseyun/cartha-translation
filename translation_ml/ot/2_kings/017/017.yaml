- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְהַכְעִיסוֹ
  choice: അവിടത്തെ കോപിപ്പിച്ചു
  rationale: ദൈവത്തെ കോപിപ്പിക്കാൻ ഇടയാക്കിയെന്ന ഹിഫീൽ രൂപത്തിന്റെ കാരണാർത്ഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: മക്കളെ തീയിലൂടെ കടത്തിയ ആചാരത്തിന്റെ സ്വഭാവം
  choice: മുഖ്യവാചകത്തിൽ ‘തീയിലൂടെ കടത്തിവിട്ടു’ എന്ന എബ്രായ ഭാഷാശൈലി നിലനിർത്തുക.
  alternative: ‘തങ്ങളുടെ പുത്രന്മാരെയും പുത്രിമാരെയും തീയിൽ ബലിയർപ്പിച്ചു’ അഥവാ ‘തീയിൽ ചുട്ടുകളഞ്ഞു’.
  rationale: സന്ദർഭം ശിശുബലിയെയോ അതുമായി ബന്ധപ്പെട്ട അഗ്നിയാചാരത്തെയോ ശക്തമായി സൂചിപ്പിച്ചാലും, എബ്രായവാചകം ആചാരത്തിന്റെ കൃത്യരൂപം തുറന്നുപറയുന്നില്ല. അതിനാൽ സാധ്യതയുള്ള വ്യക്തമായ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: വ്യക്തിനാമത്തെ സ്ഥാനപ്പേരായി മാറ്റാതെ, സാധ്യതയുള്ള ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിനിധാനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. എബ്രായത്തിന്റെ ദൃശ്യരൂപകങ്ങൾ സാധ്യമായിടത്ത് നിലനിർത്തി; ദിവ്യജ്ഞാനവും ശകുനവ്യാഖ്യാനവും വേർതിരിച്ചു. ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കാൻ ‘അവിടത്തെ’ ഉപയോഗിച്ചു.
