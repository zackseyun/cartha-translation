  choice: തീയിലൂടെ കടത്തിവിട്ടു
  rationale: ‘തീയിലൂടെ കടത്തുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അന്തർപാഠബന്ധവും നിലനിർത്തുന്നു; ആചാരത്തിന്റെ കൃത്യരൂപം മുഖ്യവാചകത്തിൽ അതിയായി നിർവചിക്കുന്നില്ല.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: തങ്ങളുടെ പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: എബ്രായത്തിൽ ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പറയുന്നതിനാൽ ആ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וַיִּקְסְמוּ קְסָמִים
  choice: ദിവ്യജ്ഞാനം നടത്തി
  rationale: ഭാവിയോ മറഞ്ഞ കാര്യങ്ങളോ അനുഷ്ഠാനപരമായി അറിയാൻ ശ്രമിക്കുന്ന നിരോധിത പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיְנַחֵשׁוּ
  choice: ശകുനങ്ങൾ വ്യാഖ്യാനിച്ചു
  rationale: അടയാളങ്ങളിൽനിന്ന് ശകുനം വായിക്കുന്ന പ്രവൃത്തിയെ മുൻപുള്ള ദിവ്യജ്ഞാനത്തിൽനിന്ന് വേർതിരിച്ചും വ്യക്തമായും അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּתְמַכְּרוּ
  choice: തങ്ങളെത്തന്നെ വിറ്റുകളഞ്ഞ്
  rationale: തിന്മയ്ക്കുള്ള സ്വമേധയായ കീഴടങ്ങലും സ്വയം അടിമപ്പെടുത്തലും വ്യക്തമാക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു.
- source_word: לַעֲשׂוֹת הָרַע
  choice: തിന്മയായതു ചെയ്യാൻ
