  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ പുത്രന്മാരെയും പുത്രിമാരെയും തീയിലൂടെ കടത്തിവിട്ടു[a]; ഭവിഷ്യവത്കരണം നടത്തുകയും ശകുനങ്ങൾ വ്യാഖ്യാനിക്കുകയും ചെയ്തു. യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മ ചെയ്യാൻ അവർ തങ്ങളെത്തന്നെ വിറ്റുകളഞ്ഞു; അങ്ങനെ അവിടത്തെ കോപിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “തങ്ങളുടെ പുത്രന്മാരെയും പുത്രിമാരെയും തീയിൽ ബലിയർപ്പിച്ചു.” എബ്രായ ഭാഷാശൈലിയുടെ അക്ഷരാർഥം “തീയിലൂടെ കടത്തിവിട്ടു” എന്നാണ്.'
    reason: lexical_alternative
