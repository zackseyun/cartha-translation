revisions:
- from: 'യഹോവ അവരുമായി ഒരു ഉടമ്പടി ചെയ്തു; അവരോടു കല്പിച്ചത്: “നിങ്ങൾ അന്യദേവന്മാരെ ഭയപ്പെടരുത്; അവരെ കുമ്പിടുകയോ സേവിക്കുകയോ അവർക്കു ബലിയർപ്പിക്കുകയോ അരുത്.”'
  to: 'യാഹ്‌വേ അവരുമായി ഒരു ഉടമ്പടി ചെയ്തു; അവരോടു ഇങ്ങനെ കല്പിച്ചു: “നിങ്ങൾ മറ്റു ദേവന്മാരെ ഭയപ്പെടരുത്; അവർക്കു നമസ്കരിക്കരുത്, അവരെ സേവിക്കരുത്, അവർക്കു ബലിയർപ്പിക്കരുത്.”'
  rationale: മുഖ്യവാക്യത്തിന്റെ വ്യാകരണപരമായ അപൂർണത പരിഹരിച്ചു. ദൈവനാമം ഇംഗ്ലീഷ് POB-യുടെ ‘Yahweh’ തീരുമാനത്തോടും മൂലനാമത്തിന്റെ സ്വഭാവത്തോടും പൊരുത്തപ്പെടുത്തി. ‘മറ്റു ദേവന്മാർ’ എന്നതിലൂടെ אֲחֵרִים-ന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി; നാല് നിരോധനങ്ങളും വേർതിരിച്ചതിലൂടെ മൂലപാഠത്തിലെ ആവർത്തനവും അർഥവ്യത്യാസങ്ങളും വ്യക്തമാക്കി.
