id: 2KI.17.35
reference: 2 Kings 17:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: ml
  text: 'യാഹ്‌വേ അവരുമായി ഒരു ഉടമ്പടി ചെയ്തു; അവരോടു ഇങ്ങനെ കല്പിച്ചു: “നിങ്ങൾ മറ്റു ദേവന്മാരെ ഭയപ്പെടരുത്; അവർക്കു നമസ്കരിക്കരുത്, അവരെ സേവിക്കരുത്, അവർക്കു ബലിയർപ്പിക്കരുത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: ഒരു ഉടമ്പടി ചെയ്തു
  rationale: כרת ברית എന്ന എബ്രായ ശൈലിയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്യുക’ എന്നാണ്; പദശഃ ‘മുറിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ആശയം വ്യക്തമാക്കില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: അവരോടു കല്പിച്ചത്
  rationale: ‘അവരെ കല്പിച്ചു, പറഞ്ഞുകൊണ്ട്’ എന്ന ഉറവിടഘടനയുടെ ആജ്ഞാഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം നൽകുന്നു.
- source_word: לֹא תִירְאוּ
  choice: ഭയപ്പെടരുത്
  rationale: ירא എന്ന ക്രിയയുടെ ‘ഭയപ്പെടുക/ഭക്ത്യാദരത്തോടെ ഭയപ്പെടുക’ എന്ന അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള ആരാധനാക്രിയകളുമായി ഇതിനെ ലയിപ്പിക്കുന്നില്ല.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാർ
  rationale: ‘മറ്റു ദേവന്മാർ’ എന്ന അർഥം covenantal നിരോധനത്തിന്റെ സ്വാഭാവിക മലയാളശൈലിയിൽ ‘അന്യദേവന്മാർ’ എന്നു നൽകുന്നു.
- source_word: תִשְׁתַּחֲווּ
  choice: കുമ്പിടുക
  rationale: ശരീരം കുനിച്ച് നമസ്കരിക്കുന്ന ദൃശ്യമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘ആരാധിക്കുക’ എന്ന പദത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: תַעַבְדוּם
  choice: സേവിക്കുക
  rationale: עבד എന്ന പദത്തിന്റെ സേവനം എന്ന അടിസ്ഥാനാർഥവും മതപരമായ സന്ദർഭവും സംരക്ഷിക്കുന്നു; സമീപത്തെ മറ്റു ആരാധനാക്രിയകളിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: תִזְבְּחוּ לָהֶם
  choice: അവർക്കു ബലിയർപ്പിക്കുക
  rationale: זבח സൂചിപ്പിക്കുന്ന ബലിയർപ്പണപ്രവൃത്തി വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഉറവിടത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്; അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപം ഉപയോഗിക്കുന്നു.
- issue: ഉടമ്പടിസന്ദർഭത്തിലെ നിരോധനങ്ങളുടെ ഭാവം
  choice: ഭയപ്പെടരുത് ... അരുത്
  alternative: ഭയപ്പെടുകയില്ല ... ചെയ്യുകയില്ല
  rationale: ലֹא + അപൂർണ്ണക്രിയയുടെ നിർബന്ധാത്മക നിരോധനം ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ ‘അരുത്’ ഘടനയിലൂടെ നൽകുന്നു.
- issue: ‘ഭയം’ ആരാധനയാണോ എന്ന വ്യാഖ്യാനസാധ്യത
  choice: ഭയപ്പെടരുത്
  alternative: ആരാധിക്കരുത്
  rationale: ഉറവിടത്തിലെ ירא എന്ന ക്രിയയെ ‘ആരാധിക്കുക’ എന്നു വ്യാഖ്യാനിച്ച് ലയിപ്പിക്കാതെ, തുടർന്ന് പ്രത്യേകം പറയുന്ന കുമ്പിടൽ, സേവനം, ബലിയർപ്പണം എന്നിവയോടുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ ഗൗരവമുള്ള ഉടമ്പടി-ആജ്ഞാശൈലി. ഏകവചന ബഹുമാനപ്രയോഗത്തിനു പകരം എബ്രായത്തിലെ ബഹുവചന അഭിസംബോധന അനുസരിച്ച് ‘നിങ്ങൾ’ ഉപയോഗിച്ചു. പട്ടികയിലെ ആവർത്തിത നിരോധനങ്ങൾ മലയാളത്തിൽ ‘-യോ ... -യോ ... അരുത്’ എന്ന ഏകോപിത ഘടനയിൽ സ്വാഭാവികമാക്കി.
