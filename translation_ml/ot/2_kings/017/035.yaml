  revised_text: 'യാഹ്‌വേ അവരുമായി ഒരു ഉടമ്പടി ചെയ്തു; അവരോടു ഇങ്ങനെ കല്പിച്ചു: “നിങ്ങൾ മറ്റു ദേവന്മാരെ ഭയപ്പെടരുത്; അവർക്കു നമസ്കരിക്കരുത്, അവരെ സേവിക്കരുത്, അവർക്കു ബലിയർപ്പിക്കരുത്.”'
