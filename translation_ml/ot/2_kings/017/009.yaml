  to: ഇസ്രായേൽമക്കൾ തങ്ങളുടെ ദൈവമായ യഹോവയ്ക്കെതിരായി ശരിയല്ലാത്ത കാര്യങ്ങൾ രഹസ്യമായി ചെയ്തു[a]. കാവൽഗോപുരം മുതൽ കോട്ടകെട്ടിയ നഗരം വരെ[c], തങ്ങളുടെ എല്ലാ പട്ടണങ്ങളിലും അവർ തങ്ങൾക്കായി പൂജാമേടുകൾ[b] പണിതു.
