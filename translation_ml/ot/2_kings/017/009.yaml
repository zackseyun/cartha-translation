  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְחַפְּא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל דְּבָרִים֙ אֲשֶׁ֣ר לֹא כֵ֔ן עַל יְהוָ֖ה אֱלֹהֵי/הֶ֑ם וַ/יִּבְנ֨וּ לָ/הֶ֤ם בָּמוֹת֙ בְּ/כָל עָ֣רֵי/הֶ֔ם מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ തങ്ങളുടെ ദൈവമായ യഹോവയ്ക്കെതിരായി ശരിയല്ലാത്ത കാര്യങ്ങൾ രഹസ്യമായി ചെയ്തു[a]. കാവൽഗോപുരം മുതൽ കോട്ടകെട്ടിയ നഗരം വരെ[c], തങ്ങളുടെ എല്ലാ പട്ടണങ്ങളിലും അവർ തങ്ങൾക്കായി പൂജാമേടുകൾ[b] പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തങ്ങളുടെ ദൈവമായ യഹോവയെക്കുറിച്ചുള്ള ശരിയല്ലാത്ത കാര്യങ്ങൾ അവർ മറച്ചുവെച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ അപൂർവമാണ്; അതിന് മറച്ചുവെക്കുക എന്നോ രഹസ്യമായി പ്രവർത്തിക്കുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “പൂജാമേടുകൾ” പ്രാദേശിക ആരാധനാസ്ഥലങ്ങളായിരുന്നു; അവ പലപ്പോഴും അംഗീകൃതമല്ലാത്ത ആരാധനയുമായി ബന്ധപ്പെട്ടിരുന്നു.
    reason: cultural_note
  - marker: c
    text: “കാവൽഗോപുരം മുതൽ കോട്ടകെട്ടിയ നഗരം വരെ” എന്നത് ചെറിയ കാവൽകേന്ദ്രങ്ങൾ മുതൽ ഉറപ്പുള്ള നഗരങ്ങൾ വരെ ദേശമെങ്ങും എന്നർഥമുള്ള പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  choice: രഹസ്യമായി ചെയ്തു
  rationale: അപൂർവമായ חפא എന്ന ക്രിയയിൽ മറച്ചുവെക്കുക, രഹസ്യമായി പ്രവർത്തിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ ‘കാര്യങ്ങൾ’ എന്ന കർമപദത്തോടൊപ്പം വരുന്നതിനാൽ ‘രഹസ്യമായി ചെയ്തു’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  choice: ശരിയല്ലാത്ത കാര്യങ്ങൾ
  rationale: വാക്കുതോറ്റമുള്ള ‘അങ്ങനെ അല്ലാത്ത കാര്യങ്ങൾ’ മലയാളത്തിൽ അവ്യക്തമാകും. ഈ പ്രയോഗത്തിലെ ധാർമിക വിലയിരുത്തൽ അമിതമായി വിശദീകരിക്കാതെ ‘ശരിയല്ലാത്ത കാര്യങ്ങൾ’ വ്യക്തമാക്കുന്നു.
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദൈവമായ യഹോവയ്ക്കെതിരായി
  rationale: വിഗ്രഹാരാധനയും ഉടമ്പടിവിശ്വാസലംഘനവും വിവരിക്കുന്ന സന്ദർഭത്തിൽ עַל എന്നതിന് വിരോധാർഥമാണ് ഏറ്റവും യോജിച്ചത്. ദിവ്യനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיִּבְנוּ לָהֶם בָּמוֹת
  choice: അവർ തങ്ങൾക്കായി പൂജാമേടുകൾ പണിതു
  rationale: במות പ്രാദേശിക ആരാധനാസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്ന സാംസ്കാരിക-ആരാധനാപദമാണ്. ‘പൂജാമേടുകൾ’ ഉയർന്ന സ്ഥലത്തിന്റെ രൂപകവും ആരാധനാപരമായ പ്രവർത്തനവും ചുരുക്കമായി അറിയിക്കുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּכָל עָרֵיהֶם
  choice: തങ്ങളുടെ എല്ലാ പട്ടണങ്ങളിലും
  rationale: עָרִים എന്നതിന് ഇവിടെ വലിയ നഗരങ്ങൾ മാത്രമല്ല, വിവിധ വലിപ്പത്തിലുള്ള ജനവാസകേന്ദ്രങ്ങളും ഉൾപ്പെടുന്നതിനാൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: מִמִּגְדַּל נוֹצְרִים עַד עִיר מִבְצָר
  choice: കാവൽഗോപുരംമുതൽ കോട്ടകെട്ടിയ നഗരംവരെ
  rationale: ചെറിയ കാവൽകേന്ദ്രം മുതൽ ഉറപ്പുള്ള നഗരംവരെയുള്ള മുഴുവൻ ദേശത്തെയും സൂചിപ്പിക്കുന്ന ദ്വന്ദ്വപ്രയോഗം രൂപകസൂചന നിലനിർത്തി വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ പ്രവൃത്തികളിലെ രഹസ്യസ്വഭാവവും ദൈവവിരോധവും
  choice: യഹോവയ്ക്കെതിരായി ശരിയല്ലാത്ത കാര്യങ്ങൾ അവർ രഹസ്യമായി ചെയ്തു
  alternative: യഹോവയെക്കുറിച്ച് ശരിയല്ലാത്ത കാര്യങ്ങൾ അവർ മറച്ചുവെച്ചു
  rationale: അപൂർവക്രിയയുടെ അർഥം പൂർണമായി ഉറപ്പില്ലെങ്കിലും, പിന്നാലെ വരുന്ന പൂജാമേടുകളുടെ നിർമാണം യഥാർഥ ആരാധനാപ്രവൃത്തികളെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ രഹസ്യപ്രവർത്തനവും ഉടമ്പടിവിരോധവും മുഖ്യവാചകത്തിൽ നിലനിർത്തി; ‘മറച്ചുവെച്ചു/യഹോവയെക്കുറിച്ച്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അപൂർവ എബ്രായക്രിയയിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. പ്രധാന വാചകത്തിലെ അടിക്കുറിപ്പുകൾ അവ വിശദീകരിക്കുന്ന ഘടകങ്ങൾക്ക് പിന്നാലെ ക്രമപ്പെടുത്തി.
