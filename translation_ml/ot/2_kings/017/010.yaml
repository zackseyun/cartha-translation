source:
  edition: WLC
  text: וַ/יַּצִּ֧בוּ לָ/הֶ֛ם מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/010.yaml
  text: They set up for themselves pillars and Asherah poles on every high hill and under every green tree[a].
translation:
  language: ml
  text: അവർ തങ്ങൾക്കുവേണ്ടി എല്ലാ ഉയർന്ന കുന്നുകളിലും എല്ലാ പച്ചപ്പുള്ള വൃക്ഷങ്ങളുടെയും കീഴിലും സ്തംഭങ്ങളും അശേരാപ്രതീകങ്ങളും[a] സ്ഥാപിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അശേരീം”; അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെയാണ് ഹീബ്രുപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצִּבוּ
  choice: സ്ഥാപിച്ചു
  rationale: ഹിഫീൽ രൂപം ആരാധനാസംബന്ധമായ വസ്തുക്കൾ നാട്ടുകയോ സ്ഥാപിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: לָהֶם
  choice: തങ്ങൾക്കുവേണ്ടി
  rationale: ദാതൃസർവനാമത്തിലെ സ്വപ്രയോജനാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַצֵּבוֹת
  choice: സ്തംഭങ്ങൾ
  rationale: നാട്ടിനിർത്തിയ ആരാധനാസംബന്ധമായ ശിലാസ്തംഭങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭം ആരാധനാപരമായ അർഥം വ്യക്തമാക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ അധിക വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: וַאֲשֵׁרִים
  choice: അശേരാപ്രതീകങ്ങൾ
  rationale: അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെ സൂചിപ്പിക്കുന്ന പദമാണിത്; അവ നിർബന്ധമായും തൂണുകളായിരുന്നു എന്നു ഉറപ്പിക്കാതെ അശേരയുമായുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: എല്ലാ ഉയർന്ന കുന്നുകളിലും
  rationale: ഭൗതിക ദൃശ്യവും ആവർത്തിതമായ ആരാധനാസ്ഥലസൂത്രവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: എല്ലാ പച്ചപ്പുള്ള വൃക്ഷങ്ങളുടെയും കീഴിലും
  rationale: רַעֲנָן എന്നതിലെ പച്ചപ്പും തഴച്ച വളർച്ചയും സൂചിപ്പിച്ച് ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֲשֵׁרִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അശേരാപ്രതീകങ്ങൾ
  alternative: അശേരീം; അശേരാത്തൂണുകൾ
  rationale: ഹീബ്രു ബഹുവചനം അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. അവയുടെ കൃത്യരൂപം നിർണ്ണയിക്കാതെ ബന്ധവും ആരാധനാസന്ദർഭവും നിലനിർത്തുന്ന വിവർത്തനമാണിത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രുവിലെ സ്ഥലക്രമവും ആരാധനാസംബന്ധമായ പദങ്ങളുടെ പ്രത്യേകതയും നിലനിർത്തി; വസ്തുക്കളുടെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
