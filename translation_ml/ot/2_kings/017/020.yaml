    text: അഥവാ, ‘യിസ്രായേലിന്റെ സകല വംശജരെയും’; എബ്രായത്തിൽ ‘യിസ്രായേലിന്റെ സകല വിത്തിനെയും/സന്തതിയെയും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കൊള്ളക്കാരുടെ അധികാരത്തിന് അവരെ വിട്ടുകൊടുത്തു.’
    reason: lexical_alternative
  - marker: c
