source:
  edition: WLC
  text: וַ/יִּמְאַ֨ס יְהוָ֜ה בְּ/כָל זֶ֤רַע יִשְׂרָאֵל֙ וַ/יְעַנֵּ֔/ם וַֽ/יִּתְּנֵ֖/ם בְּ/יַד שֹׁסִ֑ים עַ֛ד אֲשֶׁ֥ר הִשְׁלִיכָ֖/ם מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
translation:
  language: ml
  text: യഹ്‌വെ യിസ്രായേലിന്റെ സകല സന്തതിയെയും[a] തള്ളിക്കളഞ്ഞു; അവരെ കഷ്ടപ്പെടുത്തുകയും കൊള്ളക്കാരുടെ കൈയിൽ ഏല്പിക്കുകയും ചെയ്തു, തന്റെ സന്നിധിയിൽനിന്ന് അവരെ എറിഞ്ഞുകളയുന്നതുവരെ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യിസ്രായേലിന്റെ സകല വംശജരെയും’; എബ്രായത്തിൽ ‘യിസ്രായേലിന്റെ സകല വിത്തിനെയും/സന്തതിയെയും.’
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘തന്റെ മുമ്പിൽനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: തള്ളിക്കളഞ്ഞു
  rationale: מָאַס എന്നത് നിരസിക്കുക, ഉപേക്ഷിക്കുക എന്ന അർഥം നൽകുന്നു. ന്യായവിധിയുടെ പശ്ചാത്തലത്തിലെ നിർണായകമായ നിരസനം സ്വാഭാവിക മലയാളത്തിൽ ‘തള്ളിക്കളഞ്ഞു’ വ്യക്തമാക്കുന്നു; ‘വെറുത്തു’ എന്നതിലെ വികാരപരമായ അധികഭാരം ഒഴിവാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി പദത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതവും ഉച്ചാരണസഹജവുമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ സകല സന്തതിയെയും
  rationale: זֶרַע എന്ന കൂട്ടവാചകത്തിന്റെ ‘വിത്ത്/സന്തതി/വംശജർ’ എന്ന അർഥവ്യാപ്തിയിൽ ‘സന്തതി’ കൂട്ടായ ഏകവചനഭാവം നിലനിർത്തുന്നു. ‘സകല’ എന്നത് כָל-ന്റെ സമഗ്രത സംരക്ഷിക്കുന്നു; പരിധി വടക്കൻ രാജ്യമായി വിവർത്തനത്തിൽ ചുരുക്കുന്നില്ല.
- source_word: וַיְעַנֵּם
  choice: അവരെ കഷ്ടപ്പെടുത്തി
  rationale: Piel രൂപത്തിലുള്ള ענה പീഡിപ്പിക്കുക, താഴ്ത്തുക, കഷ്ടപ്പെടുത്തുക എന്നീ അർഥങ്ങൾക്കിടയിലാണ്. ‘കഷ്ടപ്പെടുത്തി’ സാമൂഹിക അടിച്ചമർത്തലിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ പൊതുവായ ദുരിതം സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: കൊള്ളക്കാരുടെ കൈയിൽ ഏല്പിച്ചു
  rationale: נתן ביד എന്നത് മറ്റൊരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുക എന്ന പ്രയോഗമാണ്. ‘കൈയിൽ ഏല്പിച്ചു’ എബ്രായ രൂപകം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: שֹׁסִים
  choice: കൊള്ളക്കാർ
  rationale: שסס-ൽനിന്നുള്ള ഈ കർത്തൃവാചക രൂപം കൊള്ളയടിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു. ‘കൊള്ളക്കാർ’ വ്യക്തവും ആധുനികവുമായ മലയാളമാണ്.
- source_word: עַד אֲשֶׁר
  choice: ഒടുവിൽ
  rationale: തുടർച്ചയായ നടപടികളുടെ പര്യവസാനം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. വ്യാകരണപരമായ ‘വരെ’ രൂപം ഉപയോഗിച്ചാൽ വാക്യം ഭാരമുള്ളതാകുന്നതിനാൽ, അന്തിമപരിധിയുടെ ആശയം ‘ഒടുവിൽ’ മുഖേന നിലനിർത്തി.
- source_word: הִשְׁלִיכָם
  choice: അവരെ ... എറിഞ്ഞുകളഞ്ഞു
  rationale: השליך എന്ന ക്രിയയുടെ ‘എറിയുക/വലിച്ചെറിയുക’ എന്ന ശക്തമായ ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു; വെറും ‘നീക്കിക്കളഞ്ഞു’ എന്നതിനേക്കാൾ മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: מִפָּנָיו
  choice: തന്റെ സന്നിധിയിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ മുമ്പിൽനിന്ന്’ എന്ന പ്രയോഗം സാന്നിധ്യത്തിൽനിന്നുള്ള പുറത്താക്കലിനെ സൂചിപ്പിക്കുന്നു. ‘സന്നിധിയിൽനിന്ന്’ ബന്ധപരവും ന്യായവിധിപരവുമായ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ‘യിസ്രായേലിന്റെ സകല സന്തതി’ എന്നതിന്റെ വ്യാപ്തി
  choice: മൂലപാഠത്തിലെ സമഗ്രമായ പ്രയോഗം അതേപടി നിലനിർത്തുക
  alternative: വടക്കൻ രാജ്യത്തിലെ ജനങ്ങൾ മാത്രമെന്ന് വ്യക്തമാക്കുക; യാക്കോബിന്റെ ഓരോ വംശജനെയും നിരപേക്ഷമായി ഉൾക്കൊള്ളുന്നതായി വ്യക്തമാക്കുക
  rationale: ചരിത്രസന്ദർഭം യിസ്രായേൽരാജ്യത്തെ സംബന്ധിച്ചെങ്കിലും, זֶרַע יִשְׂרָאֵל എന്ന വാക്കിന്റെ വ്യാപ്തി വിവർത്തനം തന്നെ തീർപ്പാക്കുന്നില്ല.
- issue: השליך എന്ന ന്യായവിധിപ്രയോഗത്തിന്റെ ശക്തി
  choice: എറിഞ്ഞുകളഞ്ഞു
  alternative: നീക്കിക്കളഞ്ഞു; പുറത്താക്കി
  rationale: ദൈവിക നിരസനത്തിന്റെ ശക്തമായ രൂപകം നിലനിർത്തുന്നു; എന്നാൽ ഇതിന് അതീതമായ ശാശ്വതപരിത്യാഗത്തെ വിവർത്തനം പ്രത്യേകം പ്രഖ്യാപിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സഭാപരമായ അതിപുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കിയ ഗൗരവമുള്ള മലയാളം. ‘യിസ്രായേൽ’, ‘സന്നിധി’ എന്നിവ ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായിരിക്കെ സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്നതാണ്. തുടർച്ചയായ എബ്രായ ക്രിയകളെ ചെറുതും വ്യക്തവുമായ രണ്ട് മലയാളവാക്യങ്ങളാക്കി.
