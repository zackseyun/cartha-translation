revisions:
- from: അങ്ങനെ യഹ്‌വെ യിസ്രായേലിന്റെ സകല സന്തതിയെയും[a] തള്ളിക്കളഞ്ഞു. അവരെ കഷ്ടപ്പെടുത്തി, കൊള്ളക്കാരുടെ കൈയിൽ ഏല്പിച്ചു[b]; ഒടുവിൽ അവരെ തന്റെ സന്നിധിയിൽനിന്ന്[c] എറിഞ്ഞുകളഞ്ഞു.
  to: യഹ്‌വെ യിസ്രായേലിന്റെ സകല സന്തതിയെയും[a] തള്ളിക്കളഞ്ഞു; അവരെ കഷ്ടപ്പെടുത്തുകയും കൊള്ളക്കാരുടെ കൈയിൽ ഏല്പിക്കുകയും ചെയ്തു, തന്റെ സന്നിധിയിൽനിന്ന് അവരെ എറിഞ്ഞുകളയുന്നതുവരെ[c].
  rationale: 'The sole substantive revision replaces ‘ഒടുവിൽ’ with an explicit ‘until’ clause, preserving the temporal endpoint expressed by עַד אֲשֶׁר. Footnote b is retained because it documents the idiomatic alternative for ‘gave them into the hand of,’ even though no footnote marker is needed in the revised running text; to preserve anchor integrity, its marker should be placed after ‘ഏല്പിക്കുകയും ചെയ്തു’ if the publication system requires every supplied footnote to have an in-text anchor. Recommended fully anchored punctuation: ‘...കൊള്ളക്കാരുടെ കൈയിൽ ഏല്പിക്കുകയും ചെയ്തു[b], തന്റെ സന്നിധിയിൽനിന്ന് അവരെ എറിഞ്ഞുകളയുന്നതുവരെ[c].’'
