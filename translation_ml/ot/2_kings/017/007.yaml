revisions:
- from: ഇതു സംഭവിച്ചത് ഇസ്രായേൽമക്കൾ തങ്ങളുടെ ദൈവമായ യഹ്‌വേയോടു പാപം ചെയ്തതുകൊണ്ടാണ്. അവിടുന്നാണ് അവരെ ഈജിപ്തുദേശത്തുനിന്ന്, ഈജിപ്തുരാജാവായ ഫറവോന്റെ കൈക്കീഴിൽനിന്ന്[a], പുറപ്പെടുവിച്ചത്. എന്നിട്ടും അവർ അന്യദേവന്മാരെ ഭയപ്പെട്ടു[b].
  to: ഇസ്രായേൽമക്കൾ തങ്ങളുടെ ദൈവമായ യഹ്‌വേക്കു പാപം ചെയ്തതുകൊണ്ടാണ് ഇതു സംഭവിച്ചത്; അവിടുന്ന് അവരെ ഈജിപ്തുദേശത്തുനിന്ന്, ഈജിപ്തുരാജാവായ ഫറവോന്റെ കൈക്കീഴിൽനിന്ന്[a] പുറപ്പെടുവിച്ചു; അവർ മറ്റു ദേവന്മാരെ ഭയപ്പെട്ടു[b].
  rationale: The revision removes the unsupported concessive «എന്നിട്ടും», retains the Hebrew's coordinated sequence, and changes «അന്യദേവന്മാർ» to «മറ്റു ദേവന്മാർ» for a closer rendering of “other gods.” The existing footnotes remain useful and are retained with the corresponding wording updated in note b.
