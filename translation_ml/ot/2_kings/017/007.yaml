reference: 2 Kings 17:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי חָטְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/יהוָ֣ה אֱלֹהֵי/הֶ֔ם הַ/מַּעֲלֶ֤ה אֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/תַּ֕חַת יַ֖ד פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יִּֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ തങ്ങളുടെ ദൈവമായ യഹ്‌വേക്കു പാപം ചെയ്തതുകൊണ്ടാണ് ഇതു സംഭവിച്ചത്; അവിടുന്ന് അവരെ ഈജിപ്തുദേശത്തുനിന്ന്, ഈജിപ്തുരാജാവായ ഫറവോന്റെ കൈക്കീഴിൽനിന്ന്[a] പുറപ്പെടുവിച്ചു; അവർ മറ്റു ദേവന്മാരെ ഭയപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഫറവോന്റെ അധികാരത്തിൽനിന്ന്.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “ഫറവോന്റെ കൈക്കീഴിൽനിന്ന്” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മറ്റു ദേവന്മാരെ ആരാധിച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയയ്ക്ക് ഭയപ്പെടുക, ഭക്തിയോടെ ആദരിക്കുക എന്നീ അർഥങ്ങളുണ്ട്; ഈ സന്ദർഭത്തിൽ ആരാധനാപരമായ വിധേയത്വവും അതിൽ ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ഇതു സംഭവിച്ചത് ... കൊണ്ടാണ്
  rationale: വിവരണാത്മകമായ കഥാസന്ദർഭവും כִּיയുടെ കാരണാർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חָטְאוּ ... לַיהוָה
  choice: യഹ്‌വേയോടു പാപം ചെയ്തു
  rationale: חטא + ל എന്ന പ്രയോഗത്തിന്റെ ‘ഒരാളോടു/ഒരാൾക്കെതിരെ പാപം ചെയ്യുക’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ദേശീയവും ഉടമ്പടിസംബന്ധവുമായ പരമ്പരാഗത പ്രയോഗം സംക്ഷിപ്തവും മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: הַמַּעֲלֶה אֹתָם
  choice: അവരെ ... പുറപ്പെടുവിച്ചത്
  rationale: ‘കയറ്റിക്കൊണ്ടുവന്നവൻ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ഈജിപ്തിൽനിന്നുള്ള വിടുതൽ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; കർത്താവിനെ വിശേഷിപ്പിക്കുന്ന എബ്രായ കൃതന്തത്തിന്റെ പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: מִתַּחַת יַד פַּרְעֹה
  choice: ഫറവോന്റെ കൈക്കീഴിൽനിന്ന്
  rationale: ആധിപത്യമെന്ന അർഥമുള്ള എബ്രായ ദൃശ്യപ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּירְאוּ אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരെ ഭയപ്പെട്ടു
  rationale: ירא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘ഭയപ്പെടുക’ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ആരാധനാഭക്തി ഉൾപ്പെടാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പേരായിത്തന്നെ നൽകുന്നു; പകരം ഒരു ബിരുദമോ പാരമ്പര്യപരമായ മറ്റൊരു ലിപ്യന്തരണരൂപമോ ഉപയോഗിക്കുന്നില്ല.
- issue: അന്യദേവന്മാരോടുള്ള ירא എന്ന ക്രിയ
  choice: ഭയപ്പെട്ടു
  alternative: ആരാധിച്ചു / ഭക്തിയോടെ വണങ്ങി
  rationale: ഭയവും ഭക്തിപൂർവമായ ആദരവും തമ്മിലുള്ള മൂലപാഠത്തിലെ അർഥവ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി മൂന്നു വാക്യങ്ങളാക്കി; കാരണബന്ധവും വിടുതൽപ്രവൃത്തിയും അതിനെ തുടർന്നുള്ള വിഗ്രഹഭക്തിയുടെ വൈരുധ്യവും സംരക്ഷിച്ചു.
