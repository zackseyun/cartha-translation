  text: וְ/אַנְשֵׁ֣י בָבֶ֗ל עָשׂוּ֙ אֶת סֻכּ֣וֹת בְּנ֔וֹת וְ/אַנְשֵׁי כ֔וּת עָשׂ֖וּ אֶת נֵֽרְגַ֑ל וְ/אַנְשֵׁ֥י חֲמָ֖ת עָשׂ֥וּ אֶת אֲשִׁימָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
translation:
  language: ml
  text: ബാബേൽനിവാസികൾ സുക്കോത്ത്-ബെനോത്ത്[a] ഉണ്ടാക്കി; കൂത്ത്‌നിവാസികൾ നേർഗൽ ഉണ്ടാക്കി; ഹമാത്ത്‌നിവാസികൾ അശീമാ[b] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സുക്കോത്ത്-ബെനോത്ത് ഒരു വിദേശദേവതയുടെയോ ആരാധനാവസ്തുവിന്റെയോ പേരായിരിക്കാം. പേരിന്റെ അർഥം അനിശ്ചിതമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ബാബേലിലെ പുരുഷന്മാർ … കൂത്തിലെ പുരുഷന്മാർ … ഹമാത്തിലെ പുരുഷന്മാർ.’ ഇവിടെ ‘നിവാസികൾ’ എന്നത് കൂട്ടായ അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: നിവാസികൾ
  rationale: ഓരോ സ്ഥലത്തോടും ചേർന്നിരിക്കുന്ന പുരുഷന്മാരെയോ ജനങ്ങളെയോ സൂചിപ്പിക്കുന്ന construct plural ആണ്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ കൂട്ടായ അർഥം നൽകാൻ ‘നിവാസികൾ’ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ പദം അക്ഷരാർഥത്തിൽ ‘പുരുഷന്മാർ’ ആണെന്നത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: עָשׂוּ
  choice: ഉണ്ടാക്കി
  rationale: עשה എന്ന സാധാരണ ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘make/do’ നിലനിർത്തുന്നു. ‘പ്രതിഷ്ഠിച്ചു’ എന്നത് മൂലപാഠത്തേക്കാൾ പ്രത്യേകമായ വ്യാഖ്യാനം ചേർക്കും.
- source_word: סֻכּוֹת בְּנוֹת
  choice: സുക്കോത്ത്-ബെനോത്ത്
  rationale: വിദേശദേവതയുടെയോ ആരാധനാവസ്തുവിന്റെയോ അനിശ്ചിതാർഥമുള്ള പേരായി കണ്ട് വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: כּוּת
  choice: കൂത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ ഹീബ്രു ഉച്ചാരണത്തെ പിന്തുടർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: נֵרְגַל
  choice: നേർഗൽ
  rationale: മെസൊപ്പൊത്താമ്യ ദേവതയുടെ പേരായതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: חֲמָת
  choice: ഹമാത്ത്
  rationale: സ്ഥലനാമം ഹീബ്രുവിനോട് ചേർന്ന മലയാള ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: אֲשִׁימָא
  choice: അശീമ
  rationale: വിദേശദേവതയുടെ പേരായതിനാൽ ഊഹാധിഷ്ഠിതമായ വിവർത്തനം ഒഴിവാക്കി ലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: עָשׂוּ എന്ന ക്രിയയുടെ കർമങ്ങളായ പേരുകൾക്ക് ‘വിഗ്രഹം’ അല്ലെങ്കിൽ ‘ദേവൻ’ എന്നു ചേർക്കണമോ
  choice: പ്രധാനപാഠത്തിൽ പേരുകൾ മാത്രം നിലനിർത്തി; ‘വിഗ്രഹം/ദേവൻ’ ചേർത്തില്ല.
  alternative: ‘സുക്കോത്ത്-ബെനോത്ത് എന്ന വിഗ്രഹം ഉണ്ടാക്കി’ അല്ലെങ്കിൽ ‘സുക്കോത്ത്-ബെനോത്തിനെ ദേവനാക്കി’
  rationale: ഹീബ്രു പാഠത്തിൽ ‘ഉണ്ടാക്കി’ എന്ന ക്രിയയ്ക്കുശേഷം പേരുകൾ നേരിട്ടുള്ള കർമങ്ങളായി മാത്രമാണ് വരുന്നത്. സന്ദർഭം ആരാധനാവസ്തുക്കളെയോ ദേവതകളെയോ സൂചിപ്പിച്ചാലും, പ്രധാനപാഠത്തിൽ അതു വ്യക്തമാക്കുന്നത് മൂലപാഠത്തെക്കാൾ അധികമായ വ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആവർത്തിക്കുന്ന ഹീബ്രു ഘടന സാധ്യമായത്ര നിലനിർത്തിയെങ്കിലും ‘നിവാസികൾ’ ഉപയോഗിച്ച് കൂട്ടായ അർഥം വ്യക്തവും വായനാസൗകര്യമുള്ളതുമാക്കി. പട്ടികയുടെ പ്രവാഹത്തിനായി രണ്ടാം, മൂന്നാം കർമങ്ങളോടൊപ്പം ‘-യെയും’ ചേർത്തു.
