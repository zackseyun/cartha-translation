id: 2KI.17.3
reference: 2 Kings 17:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עָלָ֣י/ו עָלָ֔ה שַׁלְמַנְאֶ֖סֶר מֶ֣לֶךְ אַשּׁ֑וּר וַֽ/יְהִי ל֤/וֹ הוֹשֵׁ֨עַ֙ עֶ֔בֶד וַ/יָּ֥שֶׁב ל֖/וֹ מִנְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/003.yaml
  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
translation:
  language: ml
  text: അശ്ശൂർരാജാവായ ശൽമനേസെർ ഹോശേയയ്ക്കെതിരെ പടയെടുത്തു. അപ്പോൾ ഹോശേയ അവന്റെ ദാസനായിത്തീർന്ന്[a] അവനു കപ്പം കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ സാമന്തരാജാവായിത്തീർന്ന്.’ എബ്രായമൂലത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവന്റെ ദാസനായിത്തീർന്നു’ എന്നാണ്; രാഷ്ട്രീയമായ അധീനതയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  choice: ഹോശേയയ്ക്കെതിരെ പടയെടുത്തു
  rationale: സൈനികസന്ദർഭത്തിൽ ഈ പ്രയോഗം ഒരാൾക്കെതിരെ സൈന്യവുമായി മുന്നേറുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ആക്രമിച്ചു’ എന്നു പറയുന്നത് സംഭവത്തെ ആവശ്യത്തിലധികം നിർണയിച്ചേക്കാം; ‘പടയെടുത്തു’ മുന്നേറ്റത്തിന്റെ സൈനികസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שַׁלְמַנְאֶסֶר
  choice: ശൽമനേസെർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവായ
  rationale: ശൽമനേസെറിന്റെ പദവിയും രാജ്യവും സൂചിപ്പിക്കുന്ന സംയുക്തപദം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണപ്രയോഗമായി നൽകി.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: അവന്റെ ദാസനായിത്തീർന്ന്
  rationale: ഈ നിർമാണം ഹോശേയയുടെ നിലയിൽ വന്ന മാറ്റവും രാഷ്ട്രീയ അധീനതയും സൂചിപ്പിക്കുന്നു. ‘ദാസൻ’ മൂലപദത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; ഇവിടെ വ്യക്തിപരമായ അടിമത്തമല്ല, സാമന്തരാഷ്ട്രീയ കീഴ്വഴക്കമാണ് ഉദ്ദേശ്യമെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: וַיָּשֶׁב לוֹ מִנְחָה
  choice: അവനു കപ്പം കൊടുത്തു
  rationale: രാഷ്ട്രീയസന്ദർഭത്തിൽ മിൻഹാ അധീനരാജാവ് മേലധികാരിയായ രാജാവിനു നൽകുന്ന കപ്പമാണ്. ‘കപ്പം കൊടുത്തു’ ആ ആശയം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִנְחָה
  choice: കപ്പം
  rationale: മറ്റു സന്ദർഭങ്ങളിൽ ‘സമ്മാനം’ അല്ലെങ്കിൽ ‘വഴിപാട്’ എന്നർഥമുണ്ടാകാമെങ്കിലും, ഇവിടെ രാജ്യാന്തര അധീനതയുടെ പശ്ചാത്തലം നിർബന്ധിത രാഷ്ട്രീയ കപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദാസൻ’ എന്ന മൂലരൂപകം പ്രധാനവാചകത്തിൽ നിലനിർത്തി, ‘സാമന്തരാജാവ്’ എന്ന കൂടുതൽ സാങ്കേതികമായ രാഷ്ട്രീയ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
