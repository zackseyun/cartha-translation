source:
  edition: WLC
  text: וַ/יִּמְאֲס֣וּ אֶת חֻקָּ֗י/ו וְ/אֶת בְּרִית/וֹ֙ אֲשֶׁ֣ר כָּרַ֣ת אֶת אֲבוֹתָ֔/ם וְ/אֵת֙ עֵֽדְוֺתָ֔י/ו אֲשֶׁ֥ר הֵעִ֖יד בָּ֑/ם וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י הַ/הֶ֨בֶל֙ וַ/יֶּהְבָּ֔לוּ וְ/אַחֲרֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתָ֔/ם אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֹתָ֔/ם לְ/בִלְתִּ֖י עֲשׂ֥וֹת כָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/015.yaml
  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
translation:
  language: ml
  text: അവർ അവന്റെ ചട്ടങ്ങളും, അവൻ അവരുടെ പിതാക്കന്മാരുമായി ചെയ്ത ഉടമ്പടിയും, അവർക്കു താക്കീത് നൽകിയ അവന്റെ സാക്ഷ്യങ്ങളും[c] തള്ളിക്കളഞ്ഞു. അവർ വ്യർത്ഥമായതിന്റെ[a] പിന്നാലെ പോയി വ്യർത്ഥരായിത്തീർന്നു[b]. തങ്ങളുടെ ചുറ്റുമുണ്ടായിരുന്ന ജനതകളുടെ പിന്നാലെയും അവർ പോയി; അവരെപ്പോലെ ചെയ്യരുതെന്ന് യഹോവ അവരോടു കല്പിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വ്യർത്ഥമായത്’ എന്നതിനുള്ള എബ്രായപദത്തിന് ‘ശൂന്യമായത്,’ ‘വിലയില്ലാത്തത്’ എന്നും ഈ സന്ദർഭത്തിൽ സൂചനയായി ‘വിഗ്രഹങ്ങൾ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായയിൽ ബന്ധമുള്ള പദങ്ങൾകൊണ്ടുള്ള പ്രയോഗമുണ്ട്: അവർ ‘വ്യർത്ഥമായതിന്റെ പിന്നാലെ പോയി,’ അങ്ങനെ തങ്ങൾതന്നെ ‘വ്യർത്ഥരായിത്തീർന്നു’—അതായത്, തങ്ങൾ പിന്തുടർന്നതുപോലെ ശൂന്യരും വിലയില്ലാത്തവരുമായി.'
    reason: lexical_alternative
  - marker: c
    text: 'മറ്റൊരു പരിഭാഷ: ‘അവർക്കെതിരെ അവൻ സാക്ഷ്യം പറഞ്ഞ അവന്റെ സാക്ഷ്യങ്ങൾ’ അല്ലെങ്കിൽ ‘അവർക്കു താക്കീത് നൽകാൻ അവൻ ഉപയോഗിച്ച അവന്റെ മുന്നറിയിപ്പുകൾ.’'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: തള്ളിക്കളഞ്ഞു
  rationale: מָאַס എന്ന ക്രിയയിലെ നിരസിക്കുക, ഉപേക്ഷിക്കുക എന്ന ശക്തമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חֻקָּיו
  choice: അവന്റെ ചട്ടങ്ങൾ
  rationale: ദൈവം നിർദേശിച്ച നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ വ്യവസ്ഥകൾ എന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּרִיתוֹ אֲשֶׁר כָּרַת
  choice: അവൻ ... ചെയ്ത ഉടമ്പടി
  rationale: ‘ഉടമ്പടി മുറിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരരൂപം ഒഴിവാക്കി അതിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകുന്നു.
- source_word: אֲבוֹתָם
  choice: അവരുടെ പിതാക്കന്മാർ
  rationale: എബ്രായയിലെ പുരുഷലിംഗ ബഹുവചനവും ഉടമ്പടിസൂത്രവാക്യത്തിലെ പരമ്പരാഗത സൂചനയും നിലനിർത്തുന്നു.
- source_word: עֵדְוֹתָיו אֲשֶׁר הֵעִיד בָּם
  choice: അവരെ താക്കീതുചെയ്യാൻ അവൻ നൽകിയ സാക്ഷ്യങ്ങൾ
  rationale: עֵדוֹת എന്നതിലെ ‘സാക്ഷ്യങ്ങൾ’ എന്ന പദാർഥവും הֵעִיד എന്നതിലെ മുന്നറിയിപ്പ്/താക്കീത് എന്ന പ്രയോഗബലവും ഒരുമിച്ചു സൂക്ഷിക്കുന്നു.
- source_word: הַהֶבֶל ... וַיֶּהְבָּלוּ
  choice: വ്യർത്ഥമായതിന്റെ പിന്നാലെ പോയി വ്യർത്ഥരായിത്തീർന്നു
  rationale: הבל എന്ന നാമത്തിനും അതിൽനിന്നുള്ള ക്രിയയ്ക്കും ഇടയിലെ ഉദ്ദേശ്യപൂർവമായ പദപ്രയോഗം മലയാളത്തിലും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבֹתָם
  choice: തങ്ങളുടെ ചുറ്റുമുണ്ടായിരുന്ന ജനതകൾ
  rationale: സന്ദർഭത്തിലെ അയൽജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: לְבִלְתִּי עֲשׂוֹת כָּהֶם
  choice: അവരെപ്പോലെ ചെയ്യരുത്
  rationale: എബ്രായയിലെ സംക്ഷിപ്തമായ താരതമ്യം അധിക വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ വ്യഞ്ജനനാമമായ YHWH-നെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ ദിവ്യനാമരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: הֶבֶל എന്നത് വിഗ്രഹങ്ങളെയാണോ പൊതുവായ വ്യർത്ഥതയെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: വ്യർത്ഥമായത്
  alternative: വിഗ്രഹങ്ങൾ / ശൂന്യമായത്
  rationale: സന്ദർഭത്തിൽ വിഗ്രഹങ്ങൾ ഉൾക്കൊള്ളാമെങ്കിലും മൂലപദത്തിന്റെ വിശാലമായ ‘ശൂന്യം, നിഷ്ഫലം, വിലയില്ലാത്തത്’ എന്ന രൂപകവും തുടർന്നുള്ള ക്രിയയുമായുള്ള പദപ്രയോഗവും തുറന്നുവെക്കുന്നു.
- issue: עֵדְוֹתָיו ... הֵעִיד בָּם എന്നതിന്റെ പ്രവർത്തനം
  choice: താക്കീതുചെയ്യാൻ നൽകിയ സാക്ഷ്യങ്ങൾ
  alternative: അവർക്കെതിരെ സാക്ഷ്യം പറഞ്ഞ സാക്ഷ്യങ്ങൾ / അവർക്കു നൽകിയ മുന്നറിയിപ്പുകൾ
  rationale: ഉടമ്പടിസാക്ഷ്യം എന്ന പദബന്ധവും അതിന്റെ മുന്നറിയിപ്പുസ്വഭാവവും ഒന്നും നഷ്ടപ്പെടുത്താതെ അവതരിപ്പിക്കുന്നു.
- issue: ദിവ്യനാമമായ יְהוָה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ നേരിട്ട് വരുന്ന ഉടമ്പടിനാമത്തെ പദവിയാൽ പകരാതെ പേരായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. നിയമ-ഉടമ്പടി പദസഞ്ചയം വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു; ‘വ്യർത്ഥമായത്/വ്യർത്ഥരായിത്തീർന്നു’ എന്ന ആവർത്തനം മൂലത്തിലെ പദപ്രയോഗം ബോധപൂർവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കരികെ ക്രമപ്പെടുത്തി.
