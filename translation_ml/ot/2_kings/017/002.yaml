source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
translation:
  language: ml
  text: അവൻ യാഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മ ചെയ്തു; എങ്കിലും,[a] അവൻ തനിക്കുമുമ്പുണ്ടായിരുന്ന ഇസ്രായേൽ രാജാക്കന്മാരെപ്പോലെ ആയിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാത്രം, തനിക്കുമുമ്പുണ്ടായിരുന്ന ഇസ്രായേൽ രാജാക്കന്മാരെപ്പോലെ ആയിരുന്നില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായ പദമായ רַק (‘മാത്രം’) മുൻപത്തെ വിലയിരുത്തലിന് ഒരു പരിമിതി ചേർക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: അവൻ തിന്മയായതു ചെയ്തു
  rationale: עשה എന്ന ക്രിയയും substantival adjective ആയ הָרַעയും ചേർന്ന പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘തിന്മയായതു ചെയ്തു’ എന്നു നൽകി; തുടക്കത്തിലെ וַ- ആഖ്യാനതുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം ‘അങ്ങനെ/പിന്നെ’ എന്നു ചേർത്തില്ല.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘കണ്ണുകളിൽ’ എന്ന ദൃശ്യരൂപം മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ, ഒരാളുടെ വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന പതിവായ ‘ദൃഷ്ടിയിൽ’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ, അതിന്റെ അംഗീകരിക്കപ്പെട്ട മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: רַק
  choice: എങ്കിലും
  rationale: മുൻപത്തെ നിഷേധാത്മക വിലയിരുത്തലിന് പിന്നാലെ വരുന്ന പരിമിതപ്പെടുത്തുന്ന വൈരുധ്യഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘മാത്രം’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: לֹא כְּמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരെപ്പോലെ ആയിരുന്നില്ല
  rationale: നിഷേധത്തോടുകൂടിയ താരതമ്യമായ כְּ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു; മലയാളവാക്യം പൂർണമാക്കാൻ ‘ആയിരുന്നില്ല’ ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: തനിക്കുമുമ്പുണ്ടായിരുന്ന
  rationale: മുൻകാല രാജാക്കന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത്; ‘അവന്റെ മുമ്പിൽ ഉണ്ടായിരുന്ന’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി കാലപരമായ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാൽ പകരാതെ, Yahweh എന്ന പുനർനിർമിത ഉച്ചാരണത്തിന് യോജിച്ച മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: ഹോശേയയുടെ തിന്മയെ മുൻ രാജാക്കന്മാരുടേതുമായി താരതമ്യം ചെയ്യുന്ന വാക്യത്തിന്റെ ശക്തി
  choice: തിന്മ ചെയ്തെങ്കിലും മുൻ രാജാക്കന്മാരെപ്പോലെ ആയിരുന്നില്ല
  alternative: തിന്മ ചെയ്തു; എന്നാൽ മുൻ രാജാക്കന്മാരെക്കാൾ കുറവായിരുന്നു
  rationale: മൂലപാഠം തിന്മയുടെ അളവ് കൃത്യമായി പറയുന്നില്ല; വെറും താരതമ്യനിഷേധമാണ് നൽകുന്നത്. അതിനാൽ ‘കുറവ്’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും രാജവൃത്താന്തത്തിന്റെ ഗൗരവത്തിന് യോജിച്ചതുമായ ശൈലി. ‘ദൃഷ്ടിയിൽ’ എന്ന പരിചിതമായ ബൈബിൾപ്രയോഗം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി.
