id: 2KI.17.27
reference: 2 Kings 17:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַ֨ו מֶֽלֶךְ אַשּׁ֜וּר לֵ/אמֹ֗ר הֹלִ֤יכוּ שָׁ֨מָּ/ה֙ אֶחָ֤ד מֵ/הַ/כֹּֽהֲנִים֙ אֲשֶׁ֣ר הִגְלִיתֶ֣ם מִ/שָּׁ֔ם וְ/יֵלְכ֖וּ וְ/יֵ֣שְׁבוּ שָׁ֑ם וְ/יֹרֵ֕/ם אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
translation:
  language: ml
  text: 'അപ്പോൾ അശ്ശൂർരാജാവ് ഇങ്ങനെ കല്പിച്ചു: “നിങ്ങൾ അവിടെനിന്ന് നാടുകടത്തിയ[b] പുരോഹിതന്മാരിൽ ഒരാളെ അവിടേക്കു കൊണ്ടുപോകുവിൻ[a]. അവൻ അവിടെ ചെന്നു താമസിക്കട്ടെ[c]; ആ ദേശത്തിന്റെ ദേവന്റെ ആചാരം[d][e] അവരെ പഠിപ്പിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവിടേക്കു അയയ്ക്കുവിൻ’ എന്നോ ‘അവിടെ എത്തിക്കുവിൻ’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങൾ അവിടെനിന്ന് നാടുകടത്തിയ’ എന്നതിന് ‘നിങ്ങൾ അവിടെനിന്ന് പ്രവാസത്തിലാക്കിയ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ‘അവർ ചെല്ലട്ടെ, അവർ അവിടെ താമസിക്കട്ടെ’ എന്നിങ്ങനെ ഇവിടെ ഹീബ്രായത്തിൽ ബഹുവചനക്രിയകളാണ്; എന്നാൽ ‘പുരോഹിതന്മാരിൽ ഒരാൾ’ എന്നും തുടർന്ന് ‘അവൻ അവരെ പഠിപ്പിക്കട്ടെ’ എന്നും വരുന്നതിനാൽ ഉദ്ദേശിച്ച അർഥം ഏകവചനമാണ്.
    reason: textual_or_grammatical_note
  - marker: d
    text: ‘ആചാരം’ എന്നതിന് ‘നിയമം’ എന്നോ ‘നിബന്ധന’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: e
    text: ‘ആ ദേശത്തിന്റെ ദൈവം’ എന്നും വായിക്കാം. മുഖ്യപാഠത്തിലെ ‘ദേവൻ’ അശ്ശൂർരാജാവിന്റെ പ്രദേശദേവസങ്കൽപ്പത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ രാജകീയ ആജ്ഞാഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവ്
  rationale: ഹീബ്രായ സംയുക്തപദത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക രാജപദവിയായി നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന ഹീബ്രായ സൂത്രവാക്യത്തെ മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം കൂടാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הֹלִיכוּ שָׁמָּה
  choice: അവിടേക്കു കൊണ്ടുപോകുവിൻ
  rationale: הלך എന്നതിന്റെ ഹിഫീൽ രൂപം ‘പോകാൻ ഇടയാക്കുക’ എന്ന വിശാല അർഥമുള്ളതാണ്; കല്പന ലഭിച്ചവർ പുരോഹിതനെ അവിടേക്കു മാറ്റുന്നതിനെ ‘കൊണ്ടുപോകുവിൻ’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. ‘അയയ്ക്കുവിൻ’ എന്നതും സാധ്യമാണ്.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: പുരോഹിതന്മാരിൽ ഒരാളെ
  rationale: ഭാഗസൂചക ഘടനയെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  choice: നിങ്ങൾ അവിടെനിന്ന് നാടുകടത്തിയ
  rationale: גלה എന്ന ഹിഫീൽ രൂപത്തിലെ ബലപ്രയോഗത്തോടെയുള്ള ദേശനീക്കത്തിന്റെ അർഥം നിലനിർത്തുന്നു; ‘പ്രവാസത്തിലാക്കിയ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് നേരിട്ടു മനസ്സിലാകും.
- source_word: וְיֵלְכוּ וְיֵשְׁבוּ שָׁם
  choice: അവൻ അവിടെ ചെന്ന് താമസിക്കുകയും
  rationale: മസോരറ്റിക് പാഠത്തിലെ ക്രിയകൾ ബഹുവചനമാണെങ്കിലും മുൻപുള്ള ‘ഒരാൾ’, പിന്നാലെയുള്ള ഏകവചനക്രിയ എന്നിവ ഉദ്ദേശിക്കുന്ന ഏകവചന അർഥം മുഖ്യപാഠത്തിൽ നൽകുന്നു; രൂപവൈരുധ്യം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: וְיֹרֵם
  choice: അവരെ പഠിപ്പിക്കുകയും ചെയ്യട്ടെ
  rationale: ירה എന്ന ഹിഫീൽ ക്രിയയുടെ ‘പഠിപ്പിക്കുക/ബോധിപ്പിക്കുക’ എന്ന അർഥവും -ם എന്ന ബഹുവചന കർമപ്രത്യയവും വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁפַּט
  choice: ആചാരം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് പ്രാദേശിക ദേവനു നൽകേണ്ട ആരാധനാക്രമമോ നിർദിഷ്ട അനുഷ്ഠാനമോ ആയതിനാൽ ‘ആചാരം’ സന്ദർഭോചിതമാണ്; ‘നിയമം’ അല്ലെങ്കിൽ ‘നിബന്ധന’ എന്നും ഗ്രഹിക്കാം.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: ആ ദേശത്തിന്റെ ദേവൻ
  rationale: അശ്ശൂർരാജാവിന്റെ പ്രദേശാധിഷ്ഠിത ദേവസങ്കൽപ്പത്തെ പ്രതിഫലിപ്പിക്കുന്ന വിധത്തിൽ ‘ദേവൻ’ ഉപയോഗിക്കുന്നു; ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് വസ്തുതയിൽ പരാമർശിക്കുന്നതെന്ന വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֱלֹהֵי הָאָרֶץ എന്ന പ്രയോഗത്തിൽ ദൈവിക തിരിച്ചറിയൽ
  choice: ആ ദേശത്തിന്റെ ദേവൻ
  alternative: ആ ദേശത്തിന്റെ ദൈവം
  rationale: പ്രസ്താവകന്റെ പുറജാതീയ പ്രദേശദേവസങ്കൽപ്പമാണ് മുഖ്യപാഠത്തിലെ ‘ദേവൻ’ പ്രതിഫലിപ്പിക്കുന്നത്. അതേസമയം പരാമർശിക്കപ്പെടുന്നത് ഇസ്രായേലിന്റെ ദൈവമാണെന്ന ആഖ്യാനതലത്തിലുള്ള തിരിച്ചറിയൽ സാധ്യമായതിനാൽ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: וְיֵלְכוּ / וְיֵשְׁבוּ എന്ന ക്രിയകളുടെ ബഹുവചനരൂപവും ഏകവചനസന്ദർഭവും
  choice: 'ഏകവചന അർഥം: ‘അവൻ ... ചെന്ന് താമസിക്കുകയും’'
  alternative: 'രൂപാനുസൃത ബഹുവചനം: ‘അവർ ... ചെന്ന് താമസിക്കുകയും’'
  rationale: ‘പുരോഹിതന്മാരിൽ ഒരാൾ’ എന്ന ഏകവചന പൂർവപദവും തുടർന്ന് വരുന്ന ഏകവചന וְיֹרֵם ഉം ഉദ്ദേശിച്ച അർഥം ഏകവചനമാണെന്ന് കാണിക്കുന്നു. വായനാസൗകര്യത്തിന് മുഖ്യപാഠത്തിൽ ഏകവചനം സ്വീകരിച്ച് ഹീബ്രായത്തിലെ രൂപവൈരുധ്യം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. രാജകല്പനയ്ക്ക് ‘കൊണ്ടുപോകുവിൻ’ എന്ന മാന്യ ബഹുവചന ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ലֵאמֹר എന്ന സൂത്രവാക്യം പദാനുപദമായി ‘പറഞ്ഞുകൊണ്ട്’ എന്നു നൽകാതെ സ്വാഭാവികമായ ‘ഇങ്ങനെ കല്പിച്ചു’ എന്നു ചേർത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനങ്ങളിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
