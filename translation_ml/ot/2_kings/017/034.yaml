source:
  edition: WLC
  text: עַ֣ד הַ/יּ֤וֹם הַ/זֶּה֙ הֵ֣ם עֹשִׂ֔ים כַּ/מִּשְׁפָּטִ֖ים הָ/רִֽאשֹׁנִ֑ים אֵינָ֤/ם יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֵינָ֣/ם עֹשִׂ֗ים כְּ/חֻקֹּתָ/ם֙ וּ/כְ/מִשְׁפָּטָ֔/ם וְ/כַ/תּוֹרָ֣ה וְ/כַ/מִּצְוָ֗ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁר שָׂ֥ם שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
translation:
  language: ml
  text: ഇന്നുവരെയും അവർ പഴയ ആചാരങ്ങൾക്കനുസരിച്ചാണ് പ്രവർത്തിക്കുന്നത്.[a] അവർ യഹ്‌വെയെ ഭയപ്പെടുന്നില്ല.[b] അവരുടെ ചട്ടങ്ങളും വിധികളും അനുസരിച്ചോ, യഹ്‌വെ ഇസ്രായേൽ എന്നു പേരിട്ട യാക്കോബിന്റെ പുത്രന്മാരോടു[c][d] കല്പിച്ച ന്യായപ്രമാണവും കല്പനയും അനുസരിച്ചോ അവർ പ്രവർത്തിക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പഴയ വിധിവിധാനങ്ങൾക്കനുസരിച്ച്’ എന്നോ ‘പഴയ രീതികൾക്കനുസരിച്ച്’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘യഹ്‌വെയെ ഭയപ്പെടുക’ എന്ന എബ്രായ പ്രയോഗത്തിൽ ഭയത്തോടൊപ്പം ഭക്ത്യാദരവും ഉടമ്പടിയോടുള്ള വിശ്വസ്തതയും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ‘യാക്കോബിന്റെ പുത്രന്മാർ’; യാക്കോബിൽനിന്നു വന്ന ജനത്തെ സമൂഹമായി ഇത് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: d
    text: അതായത്, യാക്കോബിന്; ഉല്പത്തി 32:28; 35:10 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  choice: പഴയ ആചാരങ്ങൾക്കനുസരിച്ച്
  rationale: ഇവിടെ מִשְׁפָּטִים മുമ്പ് വിവരിച്ച മതപരമായ പതിവുകളെയും ആചരണരീതികളെയും സൂചിപ്പിക്കുന്നു; നിയമവിധികൾ എന്നതിനെക്കാൾ ‘ആചാരങ്ങൾ’ സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: യഹ്‌വെയെ ഭയപ്പെടുക
  rationale: ഈ എബ്രായ പ്രയോഗത്തിൽ ഭയവും ഭക്ത്യാദരവും ഉടമ്പടിയോടുള്ള വിശ്വസ്തതയും ഉൾക്കൊള്ളുന്നു; പരിചിതമായ ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  choice: അവരുടെ ചട്ടങ്ങളും ന്യായവിധികളും അനുസരിച്ച്
  rationale: മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയമായ ‘അവരുടെ’ നിലനിർത്തുകയും നിയമ-ഉടമ്പടി സ്വരമുള്ള സമാന്തര പദജോടി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וְכַתּוֹרָה וְכַמִּצְוָה
  choice: ന്യായപ്രമാണവും കല്പനയും
  rationale: രണ്ടു ഏകവചന നാമങ്ങളുടെയും നിയമ-ഉടമ്പടി സ്വരം നിലനിർത്തുന്നു; നിഷേധത്തിന്റെ പരിധി വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘അനുസരിച്ചോ’ ആവർത്തിക്കുന്നു.
- source_word: בְּנֵי יַעֲקֹב
  choice: യാക്കോബിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചനം ഔപചാരികമായി നിലനിർത്തുന്നു; ഇത് യാക്കോബിൽനിന്നുള്ള ജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  choice: യാക്കോബിനാണ് അവിടുന്ന് ഇസ്രായേൽ എന്നു പേരിട്ടത്
  rationale: പേരുമാറ്റം യാക്കോബിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഉല്പത്തി 32:28; 35:10-ലെ സംഭവത്തോടുള്ള സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- issue: ‘അവരുടെ ചട്ടങ്ങളും ന്യായവിധികളും’ എന്നതിന്റെ സൂചന
  choice: മൂന്നാംപുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം അതേപടി നിലനിർത്തി
  alternative: യഹ്‌വെയുടെ ചട്ടങ്ങളും ന്യായവിധികളും എന്നു വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക
  rationale: ഹീബ്രുവിൽ ‘അവരുടെ’ എന്നാണ്; പിന്നാലെ യഹ്‌വെ കല്പിച്ച ന്യായപ്രമാണവും കല്പനയും പ്രത്യേകം വരുന്നു. വ്യാഖ്യാനപരമായ പിരിമുറുക്ക് പരിഭാഷയിൽ ഇല്ലാതാക്കുന്നില്ല.
- issue: ഇസ്രായേൽ എന്നു പേരിട്ടത് ആരെ
  choice: യാക്കോബിനെ
  alternative: യാക്കോബിന്റെ പുത്രന്മാരെ സമൂഹമായി ഇസ്രായേൽ എന്നു വിളിച്ചു
  rationale: ഏകവചന ക്രിയയും ‘അവന്റെ പേര്’ എന്ന രൂപവും യാക്കോബിന്റെ വ്യക്തിപരമായ പേരുമാറ്റത്തെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ബന്ധപ്പെട്ട ഉല്പത്തി വാക്യങ്ങളും ഇതിനെ പിന്തുണയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ആദരവുള്ള മലയാളം. നിയമ-ഉടമ്പടി പദസമ്പത്ത് നിലനിർത്തിക്കൊണ്ട് വാക്യഘടന സ്വാഭാവികമാക്കി; ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
