id: 2KI.17.39
reference: 2 Kings 17:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֛י אִֽם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּירָ֑אוּ וְ/הוּא֙ יַצִּ֣יל אֶתְ/כֶ֔ם מִ/יַּ֖ד כָּל אֹיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/039.yaml
  text: But Yahweh your God you shall fear[a], and he will deliver you from the hand of all your enemies.
translation:
  language: ml
  text: മറിച്ച്, നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെയെ നിങ്ങൾ ഭയപ്പെടണം; അവൻ നിങ്ങളുടെ സകല ശത്രുക്കളുടെയും കൈയിൽനിന്ന്[a] നിങ്ങളെ വിടുവിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നിങ്ങളുടെ സകല ശത്രുക്കളുടെയും കൈയിൽനിന്ന്’; അവരുടെ അധികാരത്തിൽനിന്നോ നിയന്ത്രണത്തിൽനിന്നോ എന്നർഥമുള്ള ഒരു ഹീബ്രു പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: മറിച്ച്
  rationale: മുൻവാക്യത്തിലെ അന്യദേവന്മാരെ ഭയപ്പെടരുതെന്ന വിലക്കിനോടുള്ള വൈരുധ്യവും യാഹ്‌വെയിലേക്കുള്ള ഏകാഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: ഇവിടെ യാഹ്‌വെയെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യാകരണരൂപം ഏകവചന അർഥത്തിലാണ്; മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ദൈവമായ’ എന്നു നൽകി.
- source_word: תִּירָאוּ
  choice: നിങ്ങൾ ഭയപ്പെടണം
  rationale: നിയമനിർദേശത്തിന്റെ ബാധ്യതയും ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു; ‘ആദരിക്കുക’ എന്നു മാത്രം പറഞ്ഞ് അർഥം മൃദുവാക്കുന്നില്ല.
- source_word: וְהוּא
  choice: അവൻ
  rationale: ഹീബ്രുവിലെ വ്യക്തമായ സർവനാമം നിലനിർത്തുന്നു; അനാവശ്യമായി ‘അവൻതന്നെ’ എന്ന അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: יַצִּיל
  choice: വിടുവിക്കും
  rationale: נצל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള അപകടത്തിൽനിന്നോ അധികാരത്തിൽനിന്നോ രക്ഷിച്ചു വിടുക എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: ശത്രുക്കളുടെ അധികാരമോ നിയന്ത്രണമോ സൂചിപ്പിക്കുന്ന ഹീബ്രു ദൃശ്യപ്രയോഗം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: כָּל אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ സകല ശത്രുക്കളുടെയും
  rationale: כָּל എന്ന സമഗ്രതയും ബഹുവചനമായ ‘ശത്രുക്കൾ’ എന്ന അർഥവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു ബിരുദമായി മാറ്റാതെ, ‘Yahweh’ എന്ന രൂപത്തിന് അനുസൃതമായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: תִּירָאוּ എന്നതിലെ ‘ഭയം’
  choice: ഭയപ്പെടണം
  alternative: ഭക്തിയോടെ ആദരിക്കണം
  rationale: സന്ദർഭത്തിൽ ഭക്തിപൂർവമായ ആദരം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, മൂലക്രിയയിലെ യഥാർഥ ‘ഭയം’ എന്ന ഘടകം നഷ്ടപ്പെടാതിരിക്കാൻ നേരിട്ടുള്ള പദം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൈയിൽനിന്ന്’ എന്ന ബൈബിൾ ദൃശ്യപ്രയോഗം നിലനിർത്തി അതിന്റെ ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
