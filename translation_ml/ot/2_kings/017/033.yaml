  text: אֶת יְהוָ֖ה הָי֣וּ יְרֵאִ֑ים וְ/אֶת אֱלֹֽהֵי/הֶם֙ הָי֣וּ עֹֽבְדִ֔ים כְּ/מִשְׁפַּט֙ הַ/גּוֹיִ֔ם אֲשֶׁר הִגְל֥וּ אֹתָ֖/ם מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
translation:
  language: ml
  text: അവർ യഹ്‌വെയെ ഭയപ്പെട്ടിരുന്നു; എന്നാൽ, അവിടെനിന്ന് പ്രവാസത്തിലാക്കപ്പെട്ട ജനതകളുടെ ആചാരപ്രകാരം അവർ തങ്ങളുടെ ദേവന്മാരെ സേവിച്ചിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവർ യഹ്‌വെയെ ഭയപ്പെട്ടിരുന്നു; തങ്ങളുടെ ദേവന്മാരെ സേവിച്ചിരുന്നു.” ഹീബ്രുവിലെ ബന്ധകം അക്ഷരാർഥത്തിൽ “ഉം/കൂടാതെ” എന്നാണ്; സന്ദർഭത്തിലെ വൈരുധ്യം വ്യക്തമാക്കാൻ പ്രധാനവാക്യത്തിൽ “എന്നാൽ” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: הָיוּ יְרֵאִים
  choice: ഭയപ്പെട്ടിരുന്നു
  rationale: היה + കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന പതിവായോ തുടർച്ചയായോ ഉള്ള നില മലയാളത്തിലെ ഭൂതകാല തുടർച്ചാഭാവത്തിൽ നൽകി; ഭക്തിപൂർവമായ ഭയം എന്ന അർഥസാധ്യത നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദേവന്മാരെയും
  rationale: സർവനാമപ്രത്യയം സൂചിപ്പിക്കുന്ന ഉടമസ്ഥത വ്യക്തമാക്കി; ‘യും’ ഹീബ്രുവിലെ ബന്ധകമായ וְ-യെ പ്രതിഫലിപ്പിക്കുകയും ഇരട്ടാരാധനയെ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: הָיוּ עֹבְדִים
  choice: സേവിച്ചിരുന്നു
  rationale: ദേവതകളെ സംബന്ധിച്ച עבד ആരാധനാപരമായ സേവനത്തെ സൂചിപ്പിക്കുന്നു; ‘സേവിക്കുക’ മൂലപദത്തോടടുത്തതും മലയാളത്തിൽ ഗ്രാഹ്യവുമാണ്.
- source_word: כְּמִשְׁפַּט
  choice: ആചാരമനുസരിച്ച്
  rationale: ഇവിടെ നിയമവിധിയേക്കാൾ പതിവ് ആചാരമോ സമ്പ്രദായമോ ആണ് ഉദ്ദേശ്യം.
- source_word: הַגּוֹיִם
  choice: ജനതകൾ
  rationale: ചരിത്രസന്ദർഭത്തിലെ വിവിധ വംശീയ-രാഷ്ട്രീയ ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്ന നിഷ്പക്ഷമായ മലയാളപദം.
- source_word: אֲשֶׁר הִגְלוּ אֹתָם מִשָּׁם
  choice: തങ്ങളെ പ്രവാസത്തിലാക്കിയ ദേശങ്ങളിലെ
  rationale: ഹീബ്രുവിലെ അക്ഷരാർഥഘടന ‘അവർ അവരെ അവിടെനിന്ന് പ്രവാസത്തിലാക്കി’ എന്നതാണ്. കർത്താവ് വ്യക്തമല്ലാത്തതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടന ഉപയോഗിച്ച് ബലമായ സ്ഥലംമാറ്റം വ്യക്തമാക്കി.
theological_decisions:
- issue: യഹ്‌വെയെ ഭയപ്പെടുന്നതും സ്വന്തം ദേവന്മാരെ സേവിക്കുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: പ്രധാനവാക്യത്തിൽ ‘എന്നാൽ’ ഉപയോഗിച്ച് സന്ദർഭത്തിലെ വൈരുധ്യം വ്യക്തമാക്കി; ‘ദേവന്മാരെയും’ എന്ന് ചേർത്ത് ഇരട്ടസേവനം നിലനിർത്തി.
  alternative: ഹീബ്രു ബന്ധകത്തെ അക്ഷരാർഥത്തിൽ ‘അവർ യഹ്‌വെയെ ഭയപ്പെട്ടിരുന്നു; തങ്ങളുടെ ദേവന്മാരെയും സേവിച്ചിരുന്നു’ എന്നു നൽകുക.
  rationale: വ്യാകരണപരമായി וְ ലളിതമായ ‘ഉം/കൂടാതെ’ ആണ്; എന്നാൽ സമീപസന്ദർഭം ഈ രണ്ട് പ്രവൃത്തികളിലുമുള്ള മതപരമായ പൊരുത്തക്കേട് ഊന്നുന്നു. വ്യാഖ്യാനസാധ്യത മറയ്ക്കാതിരിക്കാൻ അക്ഷരാർഥവായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യഹ്‌വെ’, ‘പ്രവാസം’, ‘ജനതകൾ’, ‘ആചാരം’ എന്നീ പദങ്ങൾ ചരിത്ര-ആരാധനാസന്ദർഭം വ്യക്തമാക്കുന്നു; ഹീബ്രുവിലെ തുടരുന്ന പതിവുഭാവം ‘ഭയപ്പെട്ടിരുന്നു/സേവിച്ചിരുന്നു’ എന്ന രൂപങ്ങളിൽ സൂക്ഷിച്ചു.
