  to: പിന്നെ അശ്ശൂരിന്റെ രാജാവ് ബാബേൽ, കൂഥാ, അവ്വാ[a], ഹമാത്ത്, സെഫർവയീം എന്നിവിടങ്ങളിൽനിന്ന് ആളുകളെ കൊണ്ടുവന്ന് യിസ്രായേൽമക്കൾക്കു പകരം[b] ശമര്യയിലെ പട്ടണങ്ങളിൽ പാർപ്പിച്ചു. അവർ ശമര്യ കൈവശമാക്കി അതിന്റെ പട്ടണങ്ങളിൽ പാർത്തു.
