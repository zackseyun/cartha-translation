id: 2KI.17.24
reference: 2 Kings 17:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֵ֣א מֶֽלֶךְ אַשּׁ֡וּר מִ/בָּבֶ֡ל וּ֠/מִ/כּוּ֠תָ/ה וּ/מֵ/עַוָּ֤א וּ/מֵֽ/חֲמָת֙ וּ/סְפַרְוַ֔יִם וַ/יֹּ֨שֶׁב֙ בְּ/עָרֵ֣י שֹֽׁמְר֔וֹן תַּ֖חַת בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּֽרְשׁוּ֙ אֶת שֹׁ֣מְר֔וֹן וַ/יֵּֽשְׁב֖וּ בְּ/עָרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
translation:
  language: ml
  text: പിന്നെ അശ്ശൂരിന്റെ രാജാവ് ബാബേൽ, കൂഥാ, അവ്വാ[a], ഹമാത്ത്, സെഫർവയീം എന്നിവിടങ്ങളിൽനിന്ന് ആളുകളെ കൊണ്ടുവന്ന് യിസ്രായേൽമക്കൾക്കു പകരം[b] ശമര്യയിലെ പട്ടണങ്ങളിൽ പാർപ്പിച്ചു. അവർ ശമര്യ കൈവശമാക്കി അതിന്റെ പട്ടണങ്ങളിൽ പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇംഗ്ലീഷ് ലിപ്യന്തരണത്തിൽ ‘Awwa’ എന്നും എഴുതാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യിസ്രായേല്യർക്കു പകരം’ അല്ലെങ്കിൽ ‘യിസ്രായേൽജനത്തിനു പകരം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: ആളുകളെ കൊണ്ടുവന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘കൊണ്ടുവരുക’ എന്നാണ്. ഹീബ്രു വാക്യത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും, പട്ടികപ്പെടുത്തിയ സ്ഥലങ്ങളിൽനിന്ന് കൊണ്ടുവന്നത് കുടിയേറ്റക്കാരെയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ആളുകളെ’ എന്നു ചേർത്തു.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവ്
  rationale: ഹീബ്രു സംയുക്തപദത്തിന്റെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്ന മലയാളരൂപം.
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  choice: ബാബേൽ, കൂഥാ, അവ്വാ, ഹമാത്ത്, സെഫർവയീം എന്നിവിടങ്ങളിൽനിന്ന്
  rationale: ഇവ സ്ഥലനാമങ്ങളായതിനാൽ വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണം ഉപയോഗിച്ചു. ‘എന്നിവിടങ്ങളിൽനിന്ന്’ എന്നത് പട്ടികയിലെ എല്ലാം സ്ഥലങ്ങളാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֹּשֶׁב
  choice: പാർപ്പിച്ചു
  rationale: ישׁב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം—അവരെ അവിടെ വസിപ്പിച്ചു—‘പാർപ്പിച്ചു’ കൃത്യമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: ശമര്യയിലെ പട്ടണങ്ങളിൽ
  rationale: עָרֵי എന്ന ബഹുവചനം ‘പട്ടണങ്ങൾ’ എന്നു നിലനിർത്തി. ഇവിടെ ശമര്യ എന്നത് തലസ്ഥാനത്തെ മാത്രം അല്ല, അതിന്റെ പ്രദേശത്തെയും സൂചിപ്പിക്കുന്നതായി ബഹുവചനം വ്യക്തമാക്കുന്നു.
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾക്കു പകരം
  rationale: תַּחַת ഇവിടെ ‘പകരം’ എന്നാണ്. בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ പദസമീപതയും ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും ‘യിസ്രായേൽമക്കൾ’ നിലനിർത്തുന്നു.
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  choice: അവർ ശമര്യ കൈവശമാക്കി
  rationale: ירשׁ കുടിയേറ്റത്തിന്റെയും അധീനതയുടെയും ഈ സന്ദർഭത്തിൽ ‘കൈവശമാക്കുക’ എന്നാണ്; ‘അവകാശമായി ലഭിക്കുക’ എന്ന അർഥം ഇവിടെ തെറ്റായ നിയമപരമോ ദൈവശാസ്ത്രപരമോ ആയ ധ്വനി നൽകാം.
- source_word: וַיֵּשְׁבוּ בְּעָרֶיהָ
  choice: അതിലെ പട്ടണങ്ങളിൽ പാർത്തു
  rationale: ישׁב എന്ന ക്രിയയുടെ കാൽ രൂപം ഇവിടെ ലളിതമായി ‘പാർക്കുക’ എന്നാണ്. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ശമര്യയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിലെ’ എന്നു നൽകി.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗരൂപമുള്ള ജനവിഭാഗനാമം
  choice: യിസ്രായേൽമക്കൾ
  alternative: യിസ്രായേല്യർ; യിസ്രായേൽജനം
  rationale: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘യിസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, മുഴുവൻ ജനവിഭാഗത്തെയും പ്രതിനിധീകരിക്കുന്നു. ‘യിസ്രായേൽമക്കൾ’ പദസമീപതയും സമൂഹാർഥവും ഒരുപോലെ നിലനിർത്തുന്നു; കൂടുതൽ സുതാര്യമായ ജനവിഭാഗപരമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. ‘പാർപ്പിച്ചു/പാർത്തു’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ישׁב എന്ന ഒരേ ധാതുവിന്റെ കാരണാർഥ-ലളിതരൂപ വ്യത്യാസം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പ് സൂചകങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മലയാളത്തിൽ ‘അവ്വാ’യ്ക്ക് [a]യും ‘യിസ്രായേൽമക്കൾക്കു പകരം’ എന്നതിന് [b]യും യുക്തമായി ചേർത്തു.
