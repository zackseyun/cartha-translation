  source_fidelity: 'മുഖ്യവാക്യം ഹീബ്രു മൂലപാഠത്തോട് വിശ്വസ്തമാണ്: രാജാവാണ് ആളുകളെ കൊണ്ടുവന്ന് പാർപ്പിക്കുന്നത് എന്ന ഹിഫീൽ കാരണാർഥവും, ശമര്യയിലെ പട്ടണങ്ങൾ എന്ന ബഹുവചനവും, ‘പകരം’ എന്ന സ്ഥാനാപന്നാർഥവും, തുടർന്ന് കുടിയേറ്റക്കാർ ശമര്യ കൈവശമാക്കി അവിടത്തെ പട്ടണങ്ങളിൽ പാർത്തതും വ്യക്തമായി പ്രതിഫലിക്കുന്നു.'
  naturalness: വാക്യക്രമവും ചരിത്രവിവരണശൈലിയും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘അശ്ശൂരിന്റെ രാജാവ്’ എന്ന രൂപം സംയുക്തരൂപത്തേക്കാൾ അല്പം സുതാര്യമാണ്; ‘അതിന്റെ പട്ടണങ്ങളിൽ’ എന്നത് ശമര്യയിലേക്കുള്ള സൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
  terminology: സ്ഥലനാമങ്ങളും ‘യിസ്രായേൽമക്കൾ’ എന്ന പദസമീപമായ ജനവിഭാഗപ്രയോഗവും യോജിച്ചതാണ്. എന്നാൽ [a]യിലെ ‘അവ്വ’ എന്ന മലയാളരൂപം ഇംഗ്ലീഷ് ലിപ്യന്തരണവ്യത്യാസമായ Awwa-യെ കൃത്യമായി സൂചിപ്പിക്കുന്നില്ല; അതിനെ ഇംഗ്ലീഷ് ലിപ്യന്തരണത്തിന്റെ വ്യത്യാസമായി വ്യക്തമാക്കണം.
