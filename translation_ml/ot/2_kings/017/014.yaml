  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּקְשׁ֤וּ אֶת עָרְפָּ/ם֙ כְּ/עֹ֣רֶף אֲבוֹתָ֔/ם אֲשֶׁר֙ לֹ֣א הֶאֱמִ֔ינוּ בַּֽ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/014.yaml
  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
translation:
  language: ml
  text: എന്നാൽ അവർ കേൾക്കാൻ കൂട്ടാക്കിയില്ല; യഹോവയായ തങ്ങളുടെ ദൈവത്തിൽ വിശ്വസിക്കാതിരുന്ന തങ്ങളുടെ പിതാക്കന്മാരുടെ കഴുത്തുപോലെ അവർ തങ്ങളുടെ കഴുത്തു കടുപ്പിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തങ്ങളുടെ ദൈവമായ യഹോവയെ ആശ്രയിച്ചില്ല.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് ഉടമ്പടിബന്ധത്തിന്റെ സന്ദർഭത്തിൽ ‘വിശ്വസിക്കുക’ എന്നോ ‘ആശ്രയിക്കുക’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: കേൾക്കാൻ കൂട്ടാക്കിയില്ല
  rationale: ശמע എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കേൾക്കുക/ശ്രദ്ധിക്കുക’ നിലനിർത്തുകയും, നിഷേധത്തോടൊപ്പം സന്ദർഭത്തിലുള്ള മനഃപൂർവമായ നിരാകരണം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: അവർ തങ്ങളുടെ കഴുത്തും കടുപ്പിച്ചു
  rationale: ‘കഴുത്ത് കടുപ്പിക്കുക’ എന്ന എബ്രായ രൂപകം വ്യാഖ്യാനിച്ച് ‘ദുശ്ശാഠ്യം കാണിച്ചു’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു; താരതമ്യത്തിൽ മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘-ഉം’ ചേർത്തിരിക്കുന്നു.
- source_word: כְּעֹרֶף אֲבוֹתָם
  choice: തങ്ങളുടെ പിതാക്കന്മാരുടെ കഴുത്തുപോലെ
  rationale: പിതാക്കന്മാരുടെ പെരുമാറ്റത്തോടു മാത്രമല്ല, അവരുടെ ‘കഴുത്തിനോടു’ തന്നെയുള്ള മൂലപാഠത്തിലെ വ്യക്തമായ താരതമ്യം സംരക്ഷിക്കുന്നു.
- source_word: הֶאֱמִינוּ
  choice: വിശ്വസിച്ചില്ല
  rationale: ב എന്ന ഉപസർഗത്തോടുകൂടിയ אמן എന്ന ക്രിയയ്ക്ക് ഇവിടെ ‘ഒരാളിൽ വിശ്വസിക്കുക/ആശ്രയിക്കുക’ എന്ന അർഥമുണ്ട്. പ്രധാന പാഠത്തിൽ നേരിട്ടുള്ള ‘വിശ്വസിക്കുക’ സ്വീകരിച്ച് ‘ആശ്രയിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בַּיהוָה אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദൈവമായ യഹോവയിൽ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും, ב എന്ന ഉപസർഗവും ‘അവരുടെ ദൈവം’ എന്ന ഉടമ്പടിബന്ധസൂചനയും വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְלֹא
  choice: എന്നാൽ ... ഇല്ല
  rationale: മുൻസന്ദർഭത്തോടുള്ള വിരോധഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘എന്നാൽ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ചതുർക്ഷര ദൈവനാമം ഒരു പദവിയായി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: אמן എന്ന ക്രിയയെ ‘വിശ്വസിക്കുക’ എന്നോ ‘ആശ്രയിക്കുക’ എന്നോ പരിഭാഷപ്പെടുത്തൽ
  choice: വിശ്വസിച്ചില്ല
  alternative: ആശ്രയിച്ചില്ല
  rationale: രണ്ടു അർഥങ്ങളും സന്ദർഭത്തിൽ സാധുവാണ്. ב എന്ന ഉപസർഗത്തോടുകൂടിയ എബ്രായ ഘടനയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കാൻ ‘യഹോവയിൽ വിശ്വസിച്ചില്ല’ പ്രധാന പാഠത്തിൽ സ്വീകരിക്കുന്നു; ഉടമ്പടിപരമായ ആശ്രയബോധം നഷ്ടപ്പെടാതിരിക്കാൻ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ‘കഴുത്ത് കടുപ്പിക്കുക’ എന്ന ദൃശ്യരൂപകം സംരക്ഷിച്ചിട്ടുണ്ട്. ദീർഘമായ ബന്ധവാക്യം ഒഴിവാക്കി വായനാസൗകര്യത്തിനായി അവസാന ആശയം വേറൊരു വാക്യമായി നൽകിയെങ്കിലും പിതാക്കന്മാരെ സൂചിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
