  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
translation:
  language: ml
  text: അപ്പോൾ അശ്ശൂർരാജാവ് ഹോശേയയുടെ ഒരു ഗൂഢാലോചന കണ്ടെത്തി[a]. കാരണം, ഹോശേയ ഈജിപ്തുരാജാവായ സോവിന്റെ അടുക്കൽ ദൂതന്മാരെ അയച്ചിരുന്നു[b]; കൂടാതെ, വർഷംതോറും നൽകിയിരുന്നതുപോലെ അശ്ശൂർരാജാവിന് കപ്പം കൊടുത്തതുമില്ല[c]. അതിനാൽ അശ്ശൂർരാജാവ് അവനെ തടഞ്ഞുവെക്കുകയും തടവറയിൽ ബന്ധിച്ചിടുകയും ചെയ്തു[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹോശേയയിൽ രാജദ്രോഹം കണ്ടെത്തി.” അക്ഷരാർഥത്തിൽ എബ്രായപാഠം “ഹോശേയയിൽ ഗൂഢാലോചന കണ്ടെത്തി” എന്നാണ്; അവനിൽ വിശ്വാസവഞ്ചകമായ ഒരു രഹസ്യനീക്കം കണ്ടെത്തിയെന്ന ആശയമാണ് ഈ പ്രയോഗത്തിനുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: “സോ” എന്നത് എബ്രായനാമത്തിന്റെ ലിപ്യന്തരണമാണ്. ഈ ഈജിപ്തുരാജാവ് ചരിത്രപരമായി ആരായിരുന്നു എന്നത് അനിശ്ചിതമാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “കപ്പം കൊണ്ടുചെന്നു നൽകിയില്ല.” ഇവിടെ “കൊടുത്തില്ല” എന്നത് എബ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവികമായ അർഥമാണ്.
    reason: lexical_alternative
  - marker: d
    text: 'എബ്രായപാഠം രണ്ടു നടപടികളെ വേർതിരിക്കുന്നു: അശ്ശൂർരാജാവ് ആദ്യം ഹോശേയയെ തടഞ്ഞുവെച്ചു; തുടർന്ന് അവനെ തടവറയിൽ ബന്ധിച്ചിട്ടു.'
    reason: lexical_alternative
lexical_decisions:
