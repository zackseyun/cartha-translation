  choice: ഹോശേയയിൽ ഒരു ഗൂഢാലോചന കണ്ടെത്തി
  rationale: ‘കണ്ടെത്തി’ എന്നത് וַיִּמְצָאയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ‘ഹോശേയയിൽ ... ഗൂഢാലോചന’ എന്ന പ്രയോഗം അവനിൽ വിശ്വാസവഞ്ചകമായ രഹസ്യനീക്കം കണ്ടെത്തിയെന്ന എബ്രായ ശൈലി സംരക്ഷിക്കുന്നു.
- source_word: שָׁלַח מַלְאָכִים
  choice: ദൂതന്മാരെ അയച്ചിരുന്നു
  rationale: מַלְאָכִים എന്നതിന് പൊതുവായ അർഥം ‘ദൂതന്മാർ’; ഇവിടെ നയതന്ത്രസന്ദർഭം വാക്യത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: סוֹא
  choice: സോ
  rationale: ചരിത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ എബ്രായ നാമത്തിന്റെ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: מִנְחָה
  choice: കപ്പം
  rationale: സാമന്തരാജാവും അശ്ശൂരും തമ്മിലുള്ള രാഷ്ട്രീയസന്ദർഭത്തിൽ ഇത് നിർബന്ധിതമായി നൽകുന്ന tribute എന്ന അർഥത്തിലാണ്.
- source_word: לֹא הֶעֱלָה
  choice: കൊടുത്തതുമില്ല
  rationale: അക്ഷരാർഥം ‘കയറ്റിക്കൊണ്ടുവന്നില്ല’ എന്നാണെങ്കിലും കപ്പം സംബന്ധിച്ച സന്ദർഭത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാളം ‘കൊടുത്തില്ല’ എന്നാണ്.
- source_word: כְּשָׁנָה בְשָׁנָה
  choice: വർഷംതോറും ചെയ്തിരുന്നതുപോലെ
  rationale: പതിവായ വാർഷിക ആവർത്തനം വ്യക്തമാക്കുന്നു; സന്ദർഭം ആവശ്യപ്പെടുന്ന ‘ചെയ്തിരുന്നത്’ മലയാളത്തിൽ സ്വാഭാവികമായി പൂർത്തിയാക്കുന്നു.
- source_word: וַיַּעַצְרֵהוּ
  choice: അവനെ തടഞ്ഞുവെക്കുകയും
  rationale: തടങ്കലിലാക്കുക/നിയന്ത്രിക്കുക എന്ന ആദ്യ നടപടിയെ തുടർന്നുള്ള ബന്ധനത്തിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: וַיַּאַסְרֵהוּ בֵּית כֶּלֶא
  choice: കാരാഗൃഹത്തിൽ ബന്ധിച്ചിടുകയും ചെയ്തു
  rationale: וַיַּאַסְרֵהוּയുടെ ‘ബന്ധിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും בֵּית כֶּלֶאയുടെ തടവിടവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
