  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. ‘കപ്പം’, ‘ഗൂഢാലോചന’, ‘കാരാഗൃഹം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ മൂലപാഠത്തിന്റെ രാഷ്ട്രീയവും നിയമപരവുമായ ഭാവം നിലനിർത്തുന്നു.
