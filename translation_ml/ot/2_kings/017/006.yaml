  text: In the ninth year of Hoshea[a], the king of Assyria captured Samaria and carried Israel away to Assyria, and settled them in Halah, and on the Habor, the river of Gozan[b], and in the cities of Media.
translation:
  language: ml
  text: ഹോശേയയുടെ ഒൻപതാം വർഷത്തിൽ അശ്ശൂർ രാജാവ് ശമര്യ പിടിച്ചടക്കി. അവൻ ഇസ്രായേലിനെ അശ്ശൂരിലേക്കു പ്രവാസത്തിലേക്കു കൊണ്ടുപോയി[a]; ഹലഹിലും ഗോസാനിലെ നദിയായ ഹാബോരിലും മേദ്യയിലെ പട്ടണങ്ങളിലും അവരെ പാർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേലിനെ അശ്ശൂരിലേക്കു നാടുകടത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ നിർബന്ധിതമായി പ്രവാസത്തിലേക്കു നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
