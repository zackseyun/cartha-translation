  text: עַ֠ד אֲשֶׁר הֵסִ֨יר יְהוָ֤ה אֶת יִשְׂרָאֵל֙ מֵ/עַ֣ל פָּנָ֔י/ו כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד כָּל עֲבָדָ֣י/ו הַ/נְּבִיאִ֑ים וַ/יִּ֨גֶל יִשְׂרָאֵ֜ל מֵ/עַ֤ל אַדְמָת/וֹ֙ אַשּׁ֔וּרָ/ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
translation:
  language: ml
  text: തന്റെ ദാസന്മാരായ സകല പ്രവാചകന്മാർ മുഖാന്തരം[b] അവൻ അരുളിച്ചെയ്തതുപോലെ, യഹ്‌വെ ഇസ്രായേലിനെ തന്റെ മുമ്പിൽനിന്ന്[a] നീക്കിക്കളയുന്നതുവരെ ഇതു തുടർന്നു. അങ്ങനെ ഇസ്രായേൽ സ്വന്തം ദേശത്തുനിന്ന് അശ്ശൂരിലേക്കു പ്രവാസത്തിലാക്കപ്പെട്ടു; ഇന്നുവരെയും അങ്ങനെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘തന്റെ മുഖത്തിനുമുമ്പിൽനിന്ന്’; യഹ്‌വെയുടെ മുമ്പിൽനിന്നോ സന്നിധിയിൽനിന്നോ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലി.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘തന്റെ ദാസന്മാരായ സകല പ്രവാചകന്മാരുടെയും കൈയാൽ’; അതായത്, അവർ മുഖാന്തരം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: നീക്കിക്കളഞ്ഞു
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ കാരണാർത്ഥം നിലനിർത്തിക്കൊണ്ട്, ന്യായവിധിയുടെ ഫലമായി ഇസ്രായേലിനെ തന്റെ മുമ്പിൽനിന്ന് അകറ്റിയതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ YHWH-നെ ‘യാഹ്‌വെ/Yahweh’ എന്ന ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘കർത്താവ്’ എന്ന പദവിയായി മാറ്റുന്നില്ല.
- source_word: מֵעַל פָּנָיו
  choice: തന്റെ മുമ്പിൽനിന്ന്
  rationale: അക്ഷരാർഥമായ ‘തന്റെ മുഖത്തിനുമുമ്പിൽനിന്ന്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ വ്യക്തിപരവും ന്യായവിധിപരവുമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളം നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: അവൻ അരുളിച്ചെയ്തതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר എന്ന താരതമ്യബലവും പ്രവാചകന്മാർ മുഖാന്തരം മുമ്പേ അറിയിച്ച വാക്കിന്റെ നിവൃത്തിയും പ്രകടമാക്കുന്നു.
- source_word: בְּיַד
  choice: മുഖാന്തരം
  rationale: പ്രതിനിധിത്വം അഥവാ മാധ്യമം സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയെ സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘കൈയാൽ’ എന്ന അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: തന്റെ ദാസന്മാരായ സകല പ്രവാചകന്മാർ
  rationale: പ്രവാചകന്മാരെ യഹ്‌വെയുടെ ദാസന്മാരായി തിരിച്ചറിയുന്ന അനുബന്ധപ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וַיִּגֶל
  choice: പ്രവാസത്തിലാക്കപ്പെട്ടു
  rationale: גלה ഇവിടെ ബലമായ ദേശനിരാസത്തെയും നാടുകടത്തലിനെയും സൂചിപ്പിക്കുന്നു; കർത്താവായ കൂട്ടനാമം ‘ഇസ്രായേൽ’ ആയതിനാൽ കർമണി പ്രയോഗം യോജിക്കുന്നു.
- source_word: אַדְמָתוֹ
  choice: സ്വന്തം ദേശം
  rationale: ഇസ്രായേൽ എന്ന ജനതയോടു ചേർന്ന പ്രദേശിക അർഥം നൽകുന്നു; ‘മണ്ണ്’ എന്ന ഭൗതികാർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: אַשּׁוּרָה
  choice: അശ്ശൂരിലേക്ക്
  rationale: ദിശ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രത്യയം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കമായി മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും അങ്ങനെതന്നെ തുടരുന്നു
  rationale: വിവരണകർത്താവിന്റെ കാലംവരെ പ്രവാസാവസ്ഥ തുടർന്നുവെന്ന കാലസൂത്രത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പുതിയ ചരിത്രവിവരം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: מֵעַל פָּנָיו എന്ന പ്രയോഗത്തിൽ ദൈവസന്നിധിയും ന്യായവിധിയും തമ്മിലുള്ള ബന്ധം
  choice: തന്റെ മുമ്പിൽനിന്ന്
  alternative: തന്റെ സന്നിധിയിൽനിന്ന് / തന്റെ മുഖത്തിനുമുമ്പിൽനിന്ന്
  rationale: ദൈവത്തിന്റെ ന്യായവിധിയാൽ ഇസ്രായേൽ അവന്റെ മുമ്പിൽനിന്ന് നീക്കപ്പെടുന്നു എന്ന വ്യക്തിപരമായ ഭാവം സംരക്ഷിക്കുന്നു. ‘സന്നിധി’ സാധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും അതിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല; അക്ഷരാർഥത്തിന്റെ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ഇസ്രായേലിന്റെ പ്രവാസം വിവരിക്കുന്ന וַיִּגֶל എന്ന രൂപത്തിലെ പ്രവർത്തകന്റെ പരോക്ഷത
  choice: പ്രവാസത്തിലാക്കപ്പെട്ടു
  alternative: പ്രവാസത്തിലേക്കു പോയി / കൊണ്ടുപോകപ്പെട്ടു
  rationale: ഹീബ്രുവിലെ നിർബന്ധിത ദേശനിരാസത്തിന്റെ ചരിത്രഭാവം നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ പ്രവർത്തകനെ പേരെടുത്ത് ചേർക്കാതെ മൂലപാഠത്തിലെ പരോക്ഷത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യത്തിന്റെ തുടക്കത്തിലുള്ള עַד־אֲשֶׁר മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്നതിനാൽ ‘ഇതു തുടർന്നു’ എന്ന് കുറഞ്ഞപക്ഷം വ്യക്തമാക്കിയിട്ടുണ്ട്. പ്രവാചകവചനത്തിന് ‘അരുളിച്ചെയ്തു’ എന്ന ഉയർന്നെങ്കിലും പരിചിതമായ ബൈബിൾ രജിസ്റ്റർ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനങ്ങളിൽ ചേർത്തിട്ടുണ്ട്.
