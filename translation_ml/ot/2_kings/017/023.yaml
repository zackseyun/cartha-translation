revisions:
- from: യഹ്‌വെ ഇസ്രായേലിനെ തന്റെ മുമ്പിൽനിന്ന്[a] നീക്കിക്കളയുന്നതുവരെ ഇതു തുടർന്നു. തന്റെ ദാസന്മാരായ സകല പ്രവാചകന്മാരിലൂടെയും[b] അവൻ അരുളിച്ചെയ്തതുപോലെതന്നെ അതു സംഭവിച്ചു. അങ്ങനെ ഇസ്രായേൽ സ്വന്തം ദേശത്തുനിന്ന് അശ്ശൂരിലേക്കു പ്രവാസത്തിലാക്കപ്പെട്ടു; ഇന്നുവരെയും അങ്ങനെതന്നെ തുടരുന്നു.
  to: തന്റെ ദാസന്മാരായ സകല പ്രവാചകന്മാർ മുഖാന്തരം[b] അവൻ അരുളിച്ചെയ്തതുപോലെ, യഹ്‌വെ ഇസ്രായേലിനെ തന്റെ മുമ്പിൽനിന്ന്[a] നീക്കിക്കളയുന്നതുവരെ ഇതു തുടർന്നു. അങ്ങനെ ഇസ്രായേൽ സ്വന്തം ദേശത്തുനിന്ന് അശ്ശൂരിലേക്കു പ്രവാസത്തിലാക്കപ്പെട്ടു; ഇന്നുവരെയും അങ്ങനെതന്നെ.
  rationale: The revision preserves the necessary contextual continuation implied by the verse’s opening “until,” but removes the added independent assertion “that happened.” It restores the Hebrew relationship in which the continuation is according to Yahweh’s prior speech through the prophets, while keeping modern, dignified Malayalam and the existing idiom notes.
