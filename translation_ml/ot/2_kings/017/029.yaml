id: 2KI.17.29
reference: 2 Kings 17:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ עֹשִׂ֔ים גּ֥וֹי גּ֖וֹי אֱלֹהָ֑י/ו וַ/יַּנִּ֣יחוּ בְּ/בֵ֣ית הַ/בָּמ֗וֹת אֲשֶׁ֤ר עָשׂוּ֙ הַ/שֹּׁ֣מְרֹנִ֔ים גּ֥וֹי גּוֹי֙ בְּ/עָ֣רֵי/הֶ֔ם אֲשֶׁ֛ר הֵ֥ם יֹשְׁבִ֖ים שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/029.yaml
  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
translation:
  language: ml
  text: എന്നാൽ ഓരോ ജനതയും തങ്ങളുടെതായ ദേവന്മാരെ ഉണ്ടാക്കിക്കൊണ്ടിരുന്നു; അവയെ ശമര്യയിലെ ജനങ്ങൾ[a] പണിത ഉന്നതാരാധനാസ്ഥലങ്ങളിലെ ആരാധനാമന്ദിരങ്ങളിൽ സ്ഥാപിച്ചു—ഓരോ ജനതയും തങ്ങൾ പാർത്തിരുന്ന നഗരങ്ങളിൽ അങ്ങനെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ശമര്യക്കാർ.”
    reason: הַשֹּׁמְרֹנִים എന്ന പദത്തിന്റെ കൂടുതൽ നേരിട്ടുള്ള, എന്നാൽ പിന്നീട് രൂപപ്പെട്ട മതസമുദായത്തെ ഓർമ്മിപ്പിക്കാവുന്ന പരിഭാഷ.
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  choice: ഉണ്ടാക്കിക്കൊണ്ടിരുന്നു
  rationale: היה + കർത്തൃവാചക കൃദന്തം ഭൂതകാലത്തിലെ തുടർച്ചയായതോ പതിവായതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം ആ തുടർച്ച സംരക്ഷിക്കുന്നു.
- source_word: גּוֹי גּוֹי
  choice: ഓരോ ജനതയും
  rationale: 'ആവർത്തനം വിതരണാർഥകമാണ്: വ്യത്യസ്ത ജനതകളിൽ ഓരോന്നും പ്രത്യേകം പ്രവർത്തിച്ചു. വാക്യത്തിന്റെ അവസാനഭാഗത്തും ഈ ആശയം ആവർത്തിച്ച് നിലനിർത്തിയിരിക്കുന്നു.'
- source_word: אֱלֹהָיו
  choice: തങ്ങളുടെതായ ദേവന്മാരെ
  rationale: വിതരണാർഥത്തിൽ ഉപയോഗിച്ച ഏകവചന സമൂഹനാമമായ גּוֹי-യിലേക്കാണ് പ്രത്യയം മടങ്ങുന്നത്. ഓരോ ജനതയ്ക്കും വേറിട്ട ദേവന്മാർ ഉണ്ടായിരുന്നുവെന്ന ഭേദം ‘തങ്ങളുടെതായ’ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּנִּיחוּ
  choice: സ്ഥാപിച്ചു
  rationale: ആരാധനാസംബന്ധമായ ഇടത്തിൽ വസ്തുക്കളെ വെക്കുക എന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു.
- source_word: בְּבֵית הַבָּמוֹת
  choice: പൂജാമേടുകളിലെ ആരാധനാമന്ദിരങ്ങളിൽ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘പൂജാമേടുകളുടെ വീട്’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കി, പൂജാമേടുകളോടു ബന്ധപ്പെട്ട ആരാധനാകെട്ടിടം എന്ന പ്രയോഗാർഥം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים
  choice: ശമര്യയിലെ ജനങ്ങൾ പണിതിരുന്ന
  rationale: പിന്നീടുണ്ടായ മതസമുദായത്തെ അനിവാര്യമായി സൂചിപ്പിക്കാതെ, ചരിത്രപരമായി ശമര്യയിലെ നിവാസികളെ സൂചിപ്പിക്കുന്നു. കെട്ടിടങ്ങളെ സംബന്ധിച്ച് עשה-യ്ക്ക് ‘പണിത’ സ്വാഭാവികമാണ്.
- source_word: בְּעָרֵיהֶם אֲשֶׁר הֵם יֹשְׁבִים שָׁם
  choice: തങ്ങൾ പാർത്തിരുന്ന നഗരങ്ങളിൽ
  rationale: ജനതകൾ താമസിച്ചിരുന്ന നഗരങ്ങളെയാണ് വാക്യം തിരിച്ചറിയിക്കുന്നത്; ആവർത്തനമുള്ള എബ്രായ സ്ഥലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി ചുരുക്കുന്നു.
theological_decisions:
- issue: הַשֹּׁמְרֹנִים എന്നതിന്റെ ചരിത്രപരമായ തിരിച്ചറിയൽ
  choice: ശമര്യയിലെ ജനങ്ങൾ
  alternative: ശമര്യക്കാർ
  rationale: സന്ദർഭം ശമര്യ പ്രദേശത്തെ അന്നത്തെ നിവാസികളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശമര്യയിലെ ജനങ്ങൾ’ എന്നത് പിന്നീടുള്ള പ്രത്യേക മതസമുദായത്തിന്റെ അർഥം അനാവശ്യമായി ആരോപിക്കാതെ ചരിത്രപരമായ പരാമർശം നിലനിർത്തുന്നു.
- issue: אֱלֹהָיו എന്ന ബഹുവചന ദൈവപരാമർശം
  choice: തങ്ങളുടെതായ ദേവന്മാരെ
  alternative: തങ്ങളുടെ ദൈവങ്ങളെ
  rationale: ഇവിടെ വിവിധ ജനതകൾ നിർമ്മിച്ച അനേകം ആരാധനാമൂർത്തികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ഏകദൈവവിശ്വാസപരമായ വ്യാഖ്യാനം ചേർക്കാതെയും അവയ്ക്ക് യാഥാർഥ ദൈവത്വം വിധിക്കാതെയും മൂലത്തിലെ ബഹുവചനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പൂജാമേടുകൾ’ പുരാതന ഉയർന്ന ആരാധനാസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘ആരാധനാമന്ദിരങ്ങൾ’ അവിടെയുള്ള കെട്ടിടങ്ങളെ വ്യക്തമാക്കുന്നു. മൂലത്തിലെ വിതരണാർഥക ആവർത്തനം അവസാനത്തെ ‘ഓരോ ജനതയും’ വഴി സംരക്ഷിച്ചിരിക്കുന്നു.
