  naturalness: ‘പൂജാഗിരികൾ’ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്ഥാപിതമായ തിരുവെഴുത്തു സാങ്കേതികപദമല്ല; ‘ഉന്നതസ്ഥലങ്ങൾ’ കൂടുതൽ സ്വാഭാവികവും രാജാക്കന്മാർ പുസ്തകത്തിലെ ആരാധനാകേന്ദ്രാർഥം വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്. വാക്യം പൂർണമായി പുനഃക്രമീകരിക്കുന്നത് താരതമ്യബന്ധം സ്വാഭാവികമാക്കുന്നു.
