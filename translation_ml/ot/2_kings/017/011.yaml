  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְקַטְּרוּ שָׁם֙ בְּ/כָל בָּמ֔וֹת כַּ/גּוֹיִ֕ם אֲשֶׁר הֶגְלָ֥ה יְהוָ֖ה מִ/פְּנֵי/הֶ֑ם וַֽ/יַּעֲשׂוּ֙ דְּבָרִ֣ים רָעִ֔ים לְ/הַכְעִ֖יס אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
translation:
  language: ml
  text: അവിടെ അവർ എല്ലാ ഉന്നതസ്ഥലങ്ങളിലും ധൂപം കത്തിച്ചു; യാഹ്‌വേ അവരുടെ മുമ്പിൽനിന്ന് നീക്കിക്കളഞ്ഞ ജനതകളെപ്പോലെതന്നെ അവർ ചെയ്തു.[a] യാഹ്‌വേയെ കോപിപ്പിക്കാൻ അവർ ദുഷ്ടകാര്യങ്ങൾ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യാഹ്‌വേ അവരുടെ മുമ്പിൽനിന്ന് നാടുകടത്തിയ ജനതകളെപ്പോലെ.’ എബ്രായ ക്രിയയ്ക്ക് ‘നാടുകടത്തുക’ എന്നും ‘നീക്കിക്കളയുക’ എന്നും അർഥമുണ്ടാകാം; ഇവിടെ ദേശത്തുനിന്ന് പുറത്താക്കപ്പെട്ട ജനതകളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  choice: അവർ ധൂപം കത്തിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള קטר ആരാധനാസന്ദർഭത്തിൽ യാഗധൂമം ഉയർത്തുന്നതിനെ, പലപ്പോഴും പ്രത്യേകിച്ച് ധൂപം കത്തിക്കുന്നതിനെ, സൂചിപ്പിക്കുന്നു. ഇവിടെ പൂജാഗിരികളിലെ അനധികൃത ആരാധനയാണ് സന്ദർഭം.
- source_word: שָׁם
  choice: അവിടെ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ആരാധനാസ്ഥലങ്ങളിലേക്കു വിരൽചൂണ്ടുന്ന എബ്രായ സ്ഥലക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: בְּכָל בָּמוֹת
  choice: സകല പൂജാഗിരികളിലും
  rationale: במות എന്നത് ഉയർന്ന സ്ഥലങ്ങളിലുള്ള ആരാധനാകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. 'പൂജാഗിരികൾ' ഉയരവും ആരാധനാപരമായ അർഥവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: כַּגּוֹיִם
  choice: ജനതകളെപ്പോലെതന്നെ
  rationale: ഇവിടെ גוים ദേശത്തുനിന്നു നീക്കപ്പെട്ട ജനവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; പിൽക്കാല മതപരമായ വേർതിരിവ് സൂചിപ്പിക്കുന്ന പദം ഒഴിവാക്കി.
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  choice: യഹോവ അവരുടെ മുമ്പിൽനിന്ന് നീക്കിക്കളഞ്ഞ
  rationale: הגלה എന്ന ക്രിയയ്ക്ക് നാടുകടത്തുക, മാറ്റിനീക്കുക എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. ഈ ദേശാധികാരസന്ദർഭത്തിൽ 'നീക്കിക്കളഞ്ഞ' എന്നത് ജനതകളുടെ പുറത്താക്കലിനെ സ്വാഭാവികമായി അറിയിക്കുകയും മൂലപദത്തിന്റെ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന 'യഹോവ' എന്ന വ്യക്തിനാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; പദവിയായ 'കർത്താവ്' എന്നു പകരംവയ്ക്കുന്നില്ല.
- source_word: וַיַּעֲשׂוּ דְּבָרִים רָעִים
  choice: അവർ ദുഷ്കാര്യങ്ങൾ ചെയ്തു
  rationale: വ്യാപകമായ ധാർമിക കുറ്റാരോപണം സംരക്ഷിക്കുന്ന, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: לְהַכְעִיס
  choice: കോപിപ്പിക്കേണ്ടതിന്
  rationale: כעס എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം കോപമുണ്ടാക്കുക അഥവാ കോപിപ്പിക്കുക എന്നാണ്. ഉദ്ദേശ്യാർഥമുള്ള לְ ഘടനയും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ദൈവനാമരൂപം നിലനിർത്തി.
- issue: ദേശാധികാരസന്ദർഭത്തിലെ הֶגְלָה എന്നതിന്റെ അർഥം
  choice: നീക്കിക്കളഞ്ഞ
  alternative: നാടുകടത്തിയ; പുറത്താക്കിയ
  rationale: ക്രിയയ്ക്ക് നാടുകടത്തലും നീക്കംചെയ്യലും സൂചിപ്പിക്കാനാകും. ഇവിടെ ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് ജനതകൾ ദേശത്തുനിന്നു മാറ്റപ്പെട്ടതാണ് കേന്ദ്ര ആശയം; 'നീക്കിക്കളഞ്ഞ' ആ ആശയം നൽകുകയും ലെക്സിക്കൽ വ്യാപ്തി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ മലയാളം. 'പൂജാഗിരികൾ' എന്ന പദം സാധാരണ ഉയർന്ന പ്രദേശമെന്നതിലുപരി ആരാധനാകേന്ദ്രം എന്ന സാങ്കേതിക അർഥം വ്യക്തമാക്കാൻ തിരഞ്ഞെടുത്തു. മൂലപാഠത്തിലെ വാക്യക്രമവും കാരണോദ്ദേശബന്ധവും കഴിയുന്നത്ര നിലനിർത്തി.
