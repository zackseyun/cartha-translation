source:
  edition: WLC
  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
translation:
  language: ml
  text: എന്നാൽ ഈജിപ്തുദേശത്തുനിന്ന് വലിയ ശക്തിയാലും നീട്ടിയ ഭുജത്താലും നിങ്ങളെ കൊണ്ടുവന്ന യഹ്‌വെയെ[a] നിങ്ങൾ ഭയപ്പെടണം[b]; അവിടുത്തെ മുമ്പിൽ കുമ്പിടുകയും അവിടുത്തേക്കു ബലിയർപ്പിക്കുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ എബ്രായപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ യഹ്‌വെ എന്നാണ്.
    reason: divine_name
  - marker: b
    text: ഇവിടത്തെ ‘ഭയപ്പെടുക’ എന്നത് വെറും പേടിയല്ല; ഭക്ത്യാദരവും വിശ്വസ്തതയും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: എന്നാൽ
  rationale: മറ്റു ദേവന്മാരെ ഭയപ്പെടരുതെന്ന മുൻനിഷേധത്തിനു വിരുദ്ധമായി യഹ്‌വെയെ മാത്രം ഭയപ്പെടേണ്ടതിനെ അവതരിപ്പിക്കുന്ന വൈരുധ്യാത്മക പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הֶעֱלָה אֶתְכֶם
  choice: നിങ്ങളെ കൊണ്ടുവന്ന
  rationale: പദശഃ ‘മുകളിലേക്കു കൊണ്ടുവന്നു’ എന്ന ദൃശ്യഭാവമുണ്ടെങ്കിലും പുറപ്പാട് സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു; ഈജിപ്തുദേശത്തുനിന്ന് എന്ന ഘടകം വിടുതലിന്റെ അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: בְּכֹחַ גָּדוֹל
  choice: വലിയ ശക്തിയാൽ
  rationale: בְ എന്ന ഉപസർഗത്തിന്റെ കരണാർഥവും ‘വലിയ ശക്തി’ എന്ന മൂലപദപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: നീട്ടിയ ഭുജത്താലും
  rationale: പുറപ്പാടുമായി ബന്ധപ്പെട്ട ദൈവിക രക്ഷാശക്തിയുടെ പരമ്പരാഗത ദൃശ്യരൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֹתוֹ תִירָאוּ
  choice: അവിടുത്തെ നിങ്ങൾ ഭയപ്പെടണം
  rationale: മൂലത്തിലെ മുൻനിർത്തിയ കർമപദത്തിന്റെ ഊന്നൽ കഴിയുന്നത്ര നിലനിർത്തി; ‘ഭയപ്പെടുക’ എന്ന പദം ഭക്ത്യാദരവും ഉടമ്പടി വിശ്വസ്തതയും ഉൾക്കൊള്ളുന്നെങ്കിലും അതിലെ ഗൗരവവും സംഘർഷവും ചുരുക്കിയില്ല.
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  choice: അവിടുത്തെ മുമ്പിൽ കുമ്പിടുകയും
  rationale: ശരീരം കുനിച്ച് പ്രണമിക്കുന്ന ആരാധനാക്രിയയുടെ ദൃശ്യഭാവം ‘ആരാധിക്കുക’ എന്ന പൊതുപദത്തിലേക്ക് ലയിപ്പിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: וְלוֹ תִזְבָּחוּ
  choice: അവിടുത്തേക്കു ബലിയർപ്പിക്കുകയും
  rationale: ബലി അർപ്പിക്കുന്ന നിർദിഷ്ട ആരാധനാക്രിയയും അതിന്റെ ഏക സ്വീകർത്താവിനുള്ള ഊന്നലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ സ്ഥാനപ്പേരിനു പകരം അതിന്റെ സാധാരണ പണ്ഡിതലിപ്യന്തരണത്തോട് ചേർന്ന മലയാളരൂപം സ്വീകരിച്ചു.
- issue: ירא എന്ന ക്രിയയുടെ ആരാധനാസന്ദർഭത്തിലെ അർത്ഥം
  choice: ഭയപ്പെടണം
  alternative: ഭക്ത്യാദരത്തോടെ ഭയപ്പെടണം; ആദരിക്കണം
  rationale: ഇവിടെ ഭയം വെറും ഭീതിയല്ല, ഭക്ത്യാദരവും ഉടമ്പടി വിശ്വസ്തതയും ഉൾക്കൊള്ളുന്നു. എങ്കിലും മൂലത്തിലെ ബഹുവർണതയും ദൈവഭയത്തിന്റെ തീവ്രതയും നിലനിർത്താൻ ‘ഭയപ്പെടണം’ പ്രധാനപാഠത്തിൽ സൂക്ഷിച്ച് വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
- issue: כִּי אִם എന്ന പ്രയോഗത്തിന്റെ വൈരുധ്യശക്തി
  choice: എന്നാൽ
  alternative: മറിച്ച്; അല്ല, ... മാത്രം
  rationale: മറ്റു ദേവന്മാർക്കു പകരം യഹ്‌വെ മാത്രമാണ് ഭയത്തിന്റെയും ആരാധനയുടെയും ബലിയുടെയും അവകാശി എന്ന സന്ദർഭപരമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ‘മാത്രം’ എന്ന ആശയം വാക്യത്തിൽ പരോക്ഷമായി നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചക ഏകവചനരൂപങ്ങൾ ഉപയോഗിച്ചു. സമാന്തരമായ മൂന്ന് ആജ്ഞകൾ മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ ബന്ധിപ്പിച്ചപ്പോൾ, യഹ്‌വെയിലേക്കുള്ള ആവർത്തിത ഊന്നൽ സർവനാമങ്ങളിലൂടെ നിലനിർത്തി.
