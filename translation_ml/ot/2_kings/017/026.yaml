source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ לְ/מֶ֣לֶךְ אַשּׁוּר֮ לֵ/אמֹר֒ הַ/גּוֹיִ֗ם אֲשֶׁ֤ר הִגְלִ֨יתָ֙ וַ/תּ֨וֹשֶׁב֙ בְּ/עָרֵ֣י שֹׁמְר֔וֹן לֹ֣א יָֽדְע֔וּ אֶת מִשְׁפַּ֖ט אֱלֹהֵ֣י הָ/אָ֑רֶץ וַ/יְשַׁלַּח בָּ֣/ם אֶת הָ/אֲרָי֗וֹת וְ/הִנָּ/ם֙ מְמִיתִ֣ים אוֹתָ֔/ם כַּ/אֲשֶׁר֙ אֵינָ֣/ם יֹדְעִ֔ים אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അശ്ശൂർരാജാവിനോടു പറഞ്ഞു: “നീ നാടുകടത്തി ശമര്യയിലെ പട്ടണങ്ങളിൽ പാർപ്പിച്ച ജനതകൾക്ക് ദേശത്തിന്റെ ദൈവത്തിന്റെ[a] ആരാധനക്രമം[b] അറിയില്ല. അതുകൊണ്ട് അവൻ അവരുടെ ഇടയിലേക്കു സിംഹങ്ങളെ അയച്ചിരിക്കുന്നു; ഇതാ, അവ അവരെ കൊന്നുകൊണ്ടിരിക്കുന്നു; കാരണം, അവർ ദേശത്തിന്റെ ദൈവത്തിന്റെ ആരാധനക്രമം അറിയുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പ്രയോഗം യിസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കാമെങ്കിലും, സംസാരിക്കുന്നവർ അവനെ ആ പ്രദേശത്തോടു ബന്ധപ്പെട്ട ദൈവമായി കാണുന്ന കാഴ്ചപ്പാടാണ് ഇതിൽ പ്രതിഫലിക്കുന്നത്.
    reason: theological_ambiguity
  - marker: b
    text: എബ്രായപദം “നിയമം,” “ചട്ടം,” “ആചാരം,” അല്ലെങ്കിൽ “നിശ്ചിത രീതി” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ദേശത്തിന്റെ ദൈവത്തെ ആരാധിക്കേണ്ട രീതിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹיִם
  choice: ജനതകൾ
  rationale: അശ്ശൂർ പല പ്രദേശങ്ങളിൽനിന്ന് നിർബന്ധമായി മാറ്റിപ്പാർപ്പിച്ച വിവിധ ജനസമൂഹങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘ജാതികൾ’ എന്നതിലുണ്ടാകാവുന്ന ആധുനിക സാമൂഹിക അർഥഭാരം ഇതിലൂടെ ഒഴിവാക്കുന്നു.
- source_word: הִגְלִיתָ
  choice: നാടുകടത്തി
  rationale: גלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള നിർബന്ധിത ദേശനീക്കത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַתּוֹשֶׁב
  choice: പാർപ്പിച്ച
  rationale: ישׁב എന്നതിന്റെ കാരകഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: ശമര്യയിലെ പട്ടണങ്ങളിൽ
  rationale: ഇവിടെ ശമര്യ എന്ന പ്രദേശത്തിലെ അനേകം പട്ടണങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്; തലസ്ഥാനനഗരം മാത്രം അല്ല.
- source_word: מִשְׁפַּט
  choice: ആരാധനക്രമം
  rationale: ഈ സന്ദർഭത്തിൽ പദം ഒരു നിയമവിധിയെയല്ല, ദേശത്തിന്റെ ദൈവത്തിനു നൽകേണ്ട ആരാധനയുടെ നിശ്ചിത രീതിയെയോ ആവശ്യകതയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: ആ ദേശത്തിന്റെ ദൈവം
  rationale: ഏകവചനസംബന്ധിയായ ആശയം നിലനിർത്തുകയും, ദൈവത്തെ പ്രദേശബന്ധിതനായി കാണുന്ന സംസാരിക്കുന്നവരുടെ കാഴ്ചപ്പാട് സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְשַׁלַּח בָּם אֶת־הָאֲרָיוֹת
  choice: അവരുടെ ഇടയിലേക്കു സിംഹങ്ങളെ അയച്ചിരിക്കുന്നു
  rationale: בם എന്നതിന്റെ സാഹചര്യാർഥവും റിപ്പോർട്ട് ചെയ്യുന്ന സമയത്ത് തുടരുന്ന ഫലവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וְהִנָּם מְמִיתִים אוֹתָם
  choice: ഇതാ, അവ അവരെ കൊന്നുകൊണ്ടിരിക്കുന്നു
  rationale: הִנֵּה എന്ന ശ്രദ്ധാകർഷക ഘടകവും പങ്കുവാചകരൂപം സൂചിപ്പിക്കുന്ന തുടരുന്ന പ്രവൃത്തിയും നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר אֵינָם יֹדְעִים
  choice: അറിയാത്തതുകൊണ്ടാണിത്
  rationale: സിംഹങ്ങളുടെ ആക്രമണത്തിന് സംസാരിക്കുന്നവർ നൽകുന്ന കാരണബന്ധം വ്യക്തമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ദേശത്തിന്റെ ദൈവം’ എന്ന പ്രയോഗം യിസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്നതോ ഒരു പ്രദേശിക ദേവനെക്കുറിച്ചുള്ള വിജാതീയ ധാരണയോ എന്നത്
  choice: മുഖ്യപാഠത്തിൽ ‘ആ ദേശത്തിന്റെ ദൈവം’
  alternative: ‘ആ ദേശത്തിന്റെ ദൈവമായ യഹോവ’ അല്ലെങ്കിൽ വെറും ‘ദൈവം’
  rationale: എബ്രായപ്രയോഗത്തിന്റെ സൂചന യിസ്രായേലിന്റെ ദൈവത്തിലേക്കാണെങ്കിലും, സംസാരിക്കുന്നവർ അവനെ പ്രദേശബന്ധിത ദൈവമായി മനസ്സിലാക്കുന്ന സംഘർഷം പാഠത്തിൽ നിലനിർത്തുന്നു. മലയാളത്തിൽ വലിയക്ഷരം–ചെറിയക്ഷരം വ്യത്യാസമില്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ഈ ദൃഷ്ടികോണം വ്യക്തമാക്കുന്നു.
- issue: מִשְׁפַּט എന്നത് പൊതുവായ നിയമമോ ആരാധനാസംബന്ധമായ നിശ്ചിത രീതിയോ എന്നത്
  choice: ആരാധനക്രമം
  alternative: നിയമം, ചട്ടം, ആചാരം
  rationale: സന്ദർഭം ദേശത്തിന്റെ ദൈവത്തെ എങ്ങനെ ആരാധിക്കണം എന്ന അറിവിനെക്കുറിച്ചാണ്. ‘ആരാധനക്രമം’ ആ പ്രത്യേക അർഥം നൽകുന്നു; എന്നാൽ പദത്തിന്റെ നിയമപരമായ ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘ഇതാ’ എന്നത് മൂലപാഠത്തിലെ ശ്രദ്ധാകർഷകത നിലനിർത്തുന്നു. ആവർത്തനം എബ്രായവാക്യത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ ഘടനയായതിനാൽ സംരക്ഷിച്ചു.
