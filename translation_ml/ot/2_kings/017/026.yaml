  to: 'അപ്പോൾ അവർ അശ്ശൂർരാജാവിനോടു പറഞ്ഞു: “നീ നാടുകടത്തി ശമര്യയിലെ പട്ടണങ്ങളിൽ പാർപ്പിച്ച ജനതകൾക്ക് ദേശത്തിന്റെ ദൈവത്തിന്റെ[a] ആരാധനക്രമം[b] അറിയില്ല. അതുകൊണ്ട് അവൻ അവരുടെ ഇടയിലേക്കു സിംഹങ്ങളെ അയച്ചിരിക്കുന്നു; ഇതാ, അവ അവരെ കൊന്നുകൊണ്ടിരിക്കുന്നു; കാരണം, അവർ ദേശത്തിന്റെ ദൈവത്തിന്റെ ആരാധനക്രമം അറിയുന്നില്ല.”'
  rationale: മൂലത്തിലെ ആവർത്തിത കാരണവാക്യം നേരിട്ടുള്ള രൂപത്തിൽ പുനഃസ്ഥാപിച്ചു. ‘ദേശത്തിന്റെ ദൈവം’ എന്ന പ്രയോഗത്തിൽ സംസാരിക്കുന്നവരുടെ കാഴ്ചപ്പാട് നിലനിർത്തി; അടിക്കുറിപ്പിലെ നിശ്ചയവാചകം സാധ്യതാസൂചകമായി മാറ്റി, വിവാദസാധ്യതയുള്ള വ്യാഖ്യാനം പാഠത്തിന്മേൽ അടിച്ചേൽപ്പിക്കുന്നത് ഒഴിവാക്കി. മറ്റെല്ലാ പ്രധാന പദതിരഞ്ഞെടുപ്പുകളും നിലനിർത്തി.
