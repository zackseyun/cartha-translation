  source_fidelity: 'മുഖ്യവാക്യം എബ്രായ ഘടനയും അർഥവും വിശ്വസ്തമായി നൽകുന്നു: വാഗ്ദത്തദേശത്തുനിന്ന് യാഹ്‌വെ നീക്കിക്കളഞ്ഞ ജനതകളുടെ ചട്ടങ്ങൾ ഇസ്രായേൽ പിന്തുടർന്നു; കൂടാതെ ഇസ്രായേൽ രാജാക്കന്മാർ ഏർപ്പെടുത്തിയ/നടപ്പാക്കിയ രീതികളും പിന്തുടർന്നു. הוֹרִישׁ എന്നതിലെ പുറത്താക്കൽ/അവകാശഭൂമിയിൽനിന്നുള്ള നീക്കം ‘നീക്കിക്കളഞ്ഞ’ എന്നതിൽ സ്വീകാര്യമായി പ്രതിഫലിക്കുന്നു. അവസാനത്തെ സംക്ഷിപ്തമായ എബ്രായ പ്രയോഗം ‘നടപ്പാക്കിയ ആചാരങ്ങൾ’ എന്നതിലൂടെ വായനാസൗകര്യത്തോടെ പൂരിപ്പിച്ചിട്ടുണ്ട്; സന്ദർഭത്തിൽ ഇത് ന്യായമാണ്.'
