id: 2KI.17.8
reference: 2 Kings 17:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּֽלְכוּ֙ בְּ/חֻקּ֣וֹת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/מַלְכֵ֥י יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/008.yaml
  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
translation:
  language: ml
  text: അവർ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന് യാഹ്‌വെ നീക്കിക്കളഞ്ഞ ജനതകളുടെ ചട്ടങ്ങളനുസരിച്ചും[a][b][c] ഇസ്രായേൽരാജാക്കന്മാർ നടപ്പാക്കിയ ആചാരങ്ങളനുസരിച്ചും ജീവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ജനതകളുടെ ആചാരങ്ങൾ പിന്തുടർന്നു.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘യാഹ്‌വെ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളഞ്ഞ.’'
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ മക്കൾ’; അതായത്, ഇസ്രായേല്യർ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: ജീവിച്ചു
  rationale: הלך എന്നതിന്റെ അക്ഷരാർഥം ‘നടന്നു’ എന്നാണെങ്കിലും ഇവിടെ അത് ജീവിതരീതിയെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്ന രൂപകമാണ്. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ജീവിച്ചു’ എന്നു നൽകുന്നു.
- source_word: בְּחֻקּוֹת
  choice: ചട്ടങ്ങളനുസരിച്ച്
  rationale: חֻקּוֹת നിശ്ചിത ചട്ടങ്ങളെയോ പതിവുകളെയോ സൂചിപ്പിക്കുന്നു. בְּ എന്ന ഉപസർഗത്തിന്റെ അനുസരണാർഥം വ്യക്തമാക്കാൻ ‘ചട്ടങ്ങളനുസരിച്ച്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַגּוֹיִם
  choice: ജനതകൾ
  rationale: ഇവിടെ גּוֹיִם ദേശത്തിലെ ഇസ്രായേല്യേതര ജനവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ജനതകൾ’ നിഷ്പക്ഷവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי
  choice: യാഹ്‌വെ ... മുമ്പിൽനിന്ന് നീക്കിക്കളഞ്ഞ
  rationale: הוֹרִישׁ എന്ന ഹിഫീൽ രൂപത്തിന് അവകാശഭൂമിയിൽനിന്ന് പുറത്താക്കുക, നീക്കിക്കളയുക എന്നീ അർഥങ്ങളുണ്ട്. ‘നീക്കിക്കളഞ്ഞ’ ഈ അർഥം ലളിതമായി നൽകുന്നു; ‘ഓടിച്ചുകളഞ്ഞ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന വംശീയ പ്രയോഗത്തിന്റെ രൂപഭാവം ‘ഇസ്രായേൽമക്കൾ’ നിലനിർത്തുന്നു; ഉദ്ദേശ്യം ഇസ്രായേല്യർ ആണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  choice: ഇസ്രായേൽരാജാക്കന്മാർ നടപ്പാക്കിയ ആചാരങ്ങൾ
  rationale: എബ്രായത്തിലെ അവസാന ഭാഗം സംക്ഷിപ്തവും വ്യാകരണപരമായി അർഥപൂരണം ആവശ്യപ്പെടുന്നതുമാണ്. മുമ്പത്തെ ‘ചട്ടങ്ങളനുസരിച്ച് ജീവിച്ചു’ എന്ന ആശയം തുടരുന്നതിനാൽ രാജാക്കന്മാർ ഉണ്ടാക്കിയതോ നടപ്പാക്കിയതോ ആയ രീതികൾ എന്ന സൂചന ‘നടപ്പാക്കിയ ആചാരങ്ങൾ’ എന്നു സ്വാഭാവികമായി നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ അത് ശീർഷകമാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: അവസാനത്തെ אֲשֶׁר עָשׂוּ എന്ന സംക്ഷിപ്ത പ്രയോഗത്തിന്റെ അർഥപൂരണം
  choice: രാജാക്കന്മാർ നടപ്പാക്കിയ ആചാരങ്ങൾ
  alternative: രാജാക്കന്മാർ ചെയ്ത കാര്യങ്ങൾ
  rationale: വാക്യത്തിന്റെ തുടക്കത്തിലെ ‘ചട്ടങ്ങളനുസരിച്ച് ജീവിച്ചു’ എന്ന ഘടന അവസാന ഭാഗത്തും അർഥത്തിൽ തുടരുന്നു. രാജകീയ പ്രവൃത്തികളോ ഏർപ്പെടുത്തിയ രീതികളോ എന്ന അസ്പഷ്ടത പൂർണമായി ഇല്ലാതാക്കാതെ ‘ആചാരങ്ങൾ’ എന്നു നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ചരിത്രവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘നടന്നു’ എന്ന എബ്രായ രൂപകം വാക്കുതോറും നിലനിർത്തുന്നതിനുപകരം അതിന്റെ ധാർമ്മിക-ജീവിതരീതിയിലുള്ള അർഥം ‘ജീവിച്ചു’ എന്നു നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യവാക്യഭാഗത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
