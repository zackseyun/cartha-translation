  text: וַ/יִּהְי֥וּ יְרֵאִ֖ים אֶת יְהוָ֑ה וַ/יַּעֲשׂ֨וּ לָ/הֶ֤ם מִ/קְצוֹתָ/ם֙ כֹּהֲנֵ֣י בָמ֔וֹת וַ/יִּהְי֛וּ עֹשִׂ֥ים לָ/הֶ֖ם בְּ/בֵ֥ית הַ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
translation:
  language: ml
  text: 'അവർ യാഹ്‌വെയെ ഭയപ്പെട്ടു. തങ്ങൾക്കുവേണ്ടി, തങ്ങളുടെ ഇടയിൽനിന്ന്[a] ഉന്നതസ്ഥലങ്ങളിലെ പുരോഹിതന്മാരെ[b] നിയമിച്ചു. ആ പുരോഹിതന്മാർ ഉന്നതസ്ഥലങ്ങളുടെ മന്ദിരങ്ങളിൽ അവർക്കുവേണ്ടി ശുശ്രൂഷ ചെയ്തുപോന്നു.


    [a] “അവരുടെ എല്ലാ വിഭാഗങ്ങളിൽനിന്നും” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ഒരു ശൈലീപ്രയോഗമാണ്; വേണ്ട യോഗ്യതാവ്യത്യാസം നോക്കാതെ ജനങ്ങളിൽനിന്നു പൊതുവേ ആളുകളെ തിരഞ്ഞെടുത്തുവെന്ന സൂചന അതിനുണ്ടാകാം.


    [b] അതായത്, കേന്ദ്രവിശുദ്ധമന്ദിരത്തിലല്ലാതെ പ്രാദേശിക ആരാധനാസ്ഥലങ്ങളിൽ സേവിച്ചിരുന്ന പുരോഹിതന്മാർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവരുടെ എല്ലാ വിഭാഗങ്ങളിൽനിന്നും” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ഒരു ശൈലീപ്രയോഗമാണ്; വേണ്ട യോഗ്യതാവ്യത്യാസം നോക്കാതെ ജനങ്ങളിൽനിന്നു പൊതുവേ ആളുകളെ തിരഞ്ഞെടുത്തുവെന്ന സൂചന അതിനുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, കേന്ദ്രവിശുദ്ധമന്ദിരത്തിലല്ലാതെ പ്രാദേശിക ആരാധനാസ്ഥലങ്ങളിൽ സേവിച്ചിരുന്ന പുരോഹിതന്മാർ.
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: യാഹ്‌വെയെ ഭയപ്പെട്ടു
  rationale: ‘ഭയപ്പെടുക’ എന്ന അടിസ്ഥാനാർഥവും ഭക്ത്യാദരത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു; യാഹ്‌വെയോടുള്ള ഭയവും അനധികൃത ആരാധനാചാരവും തമ്മിലുള്ള വാക്യസന്ദർഭത്തിലെ സംഘർഷം മായ്ച്ചുകളയുന്നില്ല.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, എബ്രായ ചതുരക്ഷരനാമത്തിന്റെ അംഗീകൃത ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מִקְצוֹתָם
  choice: തങ്ങളുടെ ഇടയിൽനിന്നുതന്നെ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ അറ്റങ്ങളിൽനിന്ന്’ എന്ന ആശയം ഉൾക്കൊള്ളുന്ന ദുർഗ്രഹമായ ശൈലീപ്രയോഗമാണിത്. വിവാദമായ ‘ഏറ്റവും താഴ്ന്നവരിൽനിന്ന്’ എന്ന അർഥം അടിച്ചേൽപ്പിക്കാതെ, സ്വന്തം ജനക്കൂട്ടത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് സ്വാഭാവികമായി അറിയിക്കുന്നു; മറ്റു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: പൂജാഗിരികളിലെ പുരോഹിതന്മാർ
  rationale: ബാമോത്ത് എന്ന സാങ്കേതിക പദം സൂചിപ്പിക്കുന്ന പ്രാദേശിക ഉയർന്ന ആരാധനാസ്ഥലങ്ങളും അവിടത്തെ പുരോഹിതസ്ഥാനവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: തങ്ങൾക്കുവേണ്ടി ... നിയമിച്ചു
  rationale: ഒരു സ്ഥാനത്തേക്ക് ആളുകളെ ‘ഉണ്ടാക്കുക’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം ‘നിയമിക്കുക’ എന്നാണ്; לָהֶם സൂചിപ്പിക്കുന്ന സ്വപ്രയോജനവും നിലനിർത്തുന്നു.
- source_word: וַיִּהְיוּ עֹשִׂים לָהֶם
  choice: അവർക്കുവേണ്ടി ശുശ്രൂഷ ചെയ്തുപോന്നു
  rationale: തുടർച്ചയായിരുന്ന ആരാധനാസേവനം ക്രിയയുടെ പര്യായഘടനയിൽനിന്ന് വ്യക്തമാക്കുന്നു; വ്യക്തമാക്കിയിട്ടില്ലാത്ത പ്രത്യേക അനുഷ്ഠാനങ്ങൾ വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- source_word: בְּבֵית הַבָּמוֹת
  choice: പൂജാഗിരികളിലെ ആരാധനാലയങ്ങളിൽ
  rationale: ഏകവചന നിർമാണം കൂട്ടാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നതായി ഗ്രഹിച്ച്, പൂജാഗിരികളോടു ബന്ധപ്പെട്ട ആരാധനാകെട്ടിടങ്ങളെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാഹ്‌വെയെ ഭയപ്പെടുന്നതും അനധികൃത പൂജാഗിരിവഴിപാട് നടത്തുന്നതും തമ്മിലുള്ള സംഘർഷം
  choice: രണ്ടു പ്രവൃത്തികളും വിശദീകരണമോ ന്യായീകരണമോ കൂടാതെ ചേർത്തുവെക്കുന്നു
  alternative: ‘എന്നിട്ടും’ ചേർത്ത് വൈരുധ്യം വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ‘യാഹ്‌വെയെ ആരാധിച്ചു’ എന്നു വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക
  rationale: എബ്രായത്തിലെ സാധാരണ ബന്ധകത്തെ പിന്തുടർന്ന് വൈരുധ്യം വായനക്കാരന് അനുഭവപ്പെടാൻ അനുവദിക്കുന്നു. ‘ഭയപ്പെട്ടു’ എന്ന പദം നിലനിർത്തുന്നതിനാൽ ഭക്ത്യാദരവും വിഗ്രഹാരാധനയോടു കലർന്ന ആചാരവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പൂജാഗിരി’ പഴയനിയമത്തിലെ പ്രാദേശിക ഉയർന്ന ആരാധനാസ്ഥലങ്ങൾക്ക് പരിചിതമായ സാങ്കേതിക പദമായി ഉപയോഗിച്ചു; ‘ആരാധനാലയം’ ബന്ധപ്പെട്ട കെട്ടിടത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. എബ്രായത്തിലെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി, എന്നാൽ കർത്തൃബന്ധം വ്യക്തമായി നിലനിർത്തി.
