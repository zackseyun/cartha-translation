  to: 'അവർ യാഹ്‌വെയെ ഭയപ്പെട്ടു. തങ്ങൾക്കുവേണ്ടി, തങ്ങളുടെ ഇടയിൽനിന്ന്[a] ഉന്നതസ്ഥലങ്ങളിലെ പുരോഹിതന്മാരെ[b] നിയമിച്ചു. ആ പുരോഹിതന്മാർ ഉന്നതസ്ഥലങ്ങളുടെ മന്ദിരങ്ങളിൽ അവർക്കുവേണ്ടി ശുശ്രൂഷ ചെയ്തുപോന്നു.


