id: 2KI.17.31
reference: 2 Kings 17:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/עַוִּ֛ים עָשׂ֥וּ נִבְחַ֖ז וְ/אֶת תַּרְתָּ֑ק וְ/הַ/סְפַרְוִ֗ים שֹׂרְפִ֤ים אֶת בְּנֵי/הֶם֙ בָּ/אֵ֔שׁ לְ/אַדְרַמֶּ֥לֶךְ וַֽ/עֲנַמֶּ֖לֶךְ אלה ספרים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
translation:
  language: ml
  text: അവ്വീയർ[a] നിബ്ഹസിനെയും തർത്തക്കിനെയും ഉണ്ടാക്കി; സെഫർവയീമുകാർ തങ്ങളുടെ പുത്രന്മാരെ അദ്രമ്മേലെക്കിനും അനമ്മേലെക്കിനും വേണ്ടി തീയിൽ ദഹിപ്പിച്ചുകൊണ്ടിരുന്നു—അവർ സെഫർവയീമിന്റെ ദേവന്മാരായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവ്വീം.’
    reason: ജനനാമത്തിന്റെ ഒരു പകര ലിപ്യന്തരരൂപം.
  - marker: b
    text: അതായത്, ഈ ദേവന്മാർക്കു ബലിയായി അവർ തങ്ങളുടെ പുത്രന്മാരെ തീയിൽ ദഹിപ്പിക്കുകയായിരുന്നു.
    reason: വാക്യത്തിലെ തീയിൽ ദഹിപ്പിക്കൽ സമർപ്പണബലിയെ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യക്തമാക്കുന്ന സാംസ്കാരിക കുറിപ്പ്; ‘പുത്രന്മാർ’ എന്ന മൂലപാഠത്തിലെ ലിംഗനിർദിഷ്ടത നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: הָעַוִּים
  choice: അവ്വ്യർ
  rationale: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനനാമം മലയാളത്തിൽ സ്വാഭാവികമായ ജനനാമരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ‘അവ്വീം’ എന്ന നേരിട്ടുള്ള രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: עָשׂוּ
  choice: ഉണ്ടാക്കി
  rationale: പേരെടുത്ത ദേവതകളെയോ അവയുടെ ആരാധനാരൂപങ്ങളെയോ നിർമിച്ചതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘വിഗ്രഹങ്ങൾ’ എന്ന പദം ചേർത്തിട്ടില്ല.
- source_word: נִבְחַז וְאֶת־תַּרְתָּק
  choice: നിബ്ഹസിനെയും തർത്തക്കിനെയും
  rationale: രണ്ട് ദേവനാമങ്ങളും മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്ത് സംയുക്ത കർമമായി അവതരിപ്പിച്ചു.
- source_word: הַסְפַרְוִים
  choice: സെഫർവയീമ്യർ
  rationale: സെഫർവയീമിലെ നിവാസികളെ സൂചിപ്പിക്കുന്ന ജനനാമം; ഭൂമിശാസ്ത്രനാമവുമായുള്ള ബന്ധം വ്യക്തമാകുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: שֹׂרְפִים
  choice: ചുട്ടുകൊണ്ടിരുന്നു
  rationale: ഹീബ്രു കർത്തൃവാചകത്തിന്റെ തുടരുന്ന അഥവാ പതിവായ പ്രവൃത്തിയുടെ ഭാവം മലയാളത്തിലെ പുരോഗമന ഭൂതകാലത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֶת־בְּנֵיהֶם בָּאֵשׁ
  choice: തങ്ങളുടെ പുത്രന്മാരെ … തീയിൽ
  rationale: בנים എന്ന ലിംഗനിർദിഷ്ട പദം ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി; ബലി അർപ്പിച്ചുള്ള ദഹനസന്ദർഭത്തിലെ בָּאֵשׁ ‘തീയിൽ’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ
  choice: അദ്രമ്മേലെക്കിനും അനമ്മേലെക്കിനും വേണ്ടി
  rationale: לְ എന്ന സമർപ്പണ/സ്വീകർത്തൃബന്ധം മലയാളത്തിൽ ‘വേണ്ടി’ എന്നു വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിച്ചു.
- source_word: אלה ספרים
  choice: സെഫർവയീമിന്റെ ദേവന്മാരായ
  rationale: അദ്രമ്മേലെക്കും അനമ്മേലെക്കും സെഫർവയീമുമായി ബന്ധപ്പെട്ട ദേവന്മാരാണെന്ന് നിർവചിക്കുന്ന സംയുക്തപദബന്ധം മലയാളവാക്യത്തിൽ വിശേഷണരൂപത്തിൽ ചേർത്തു.
theological_decisions:
- issue: നിബ്ഹസും തർത്തക്കും ദേവതകളോ അവയുടെ വിഗ്രഹങ്ങളോ ആണെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘നിബ്ഹസിനെയും തർത്തക്കിനെയും ഉണ്ടാക്കി’ എന്ന മൂലത്തോടടുത്ത രൂപം നിലനിർത്തി.
  alternative: ‘നിബ്ഹസിന്റെയും തർത്തക്കിന്റെയും വിഗ്രഹങ്ങൾ ഉണ്ടാക്കി’
  rationale: ആരാധനയ്ക്കുള്ള രൂപങ്ങൾ നിർമിച്ചതാണെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘വിഗ്രഹങ്ങൾ’ എന്ന നാമം ഹീബ്രു പാഠത്തിൽ വ്യക്തമല്ല; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർത്തില്ല.
- issue: בְּנֵיהֶם എന്നത് പൊതുവായി ‘മക്കൾ’ എന്നു നൽകണമോ
  choice: ‘പുത്രന്മാർ’ എന്നു ലിംഗനിർദിഷ്ടമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മക്കൾ’
  rationale: ഹീബ്രുവിലെ പദം ഇവിടെ വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമാണ്; സന്ദർഭം അതിനെ പൊതുവാക്കാൻ നിർബന്ധിക്കുന്നില്ല.
- issue: שֹׂרְפִים എന്ന കർത്തൃവാചകത്തിന്റെ കാലഭാവം
  choice: ‘ചുട്ടുകൊണ്ടിരുന്നു’ എന്ന തുടരുന്ന/പതിവായ പ്രവൃത്തിയുടെ രൂപം ഉപയോഗിച്ചു.
  alternative: ‘ചുട്ടു’
  rationale: കർത്തൃവാചകം ആ സമൂഹത്തിന്റെ തുടരുന്ന ആരാധനാചാരത്തെ വിവരിക്കാം; ലളിതഭൂതകാലത്തിലേക്ക് ചുരുക്കാതെ ഈ അർഥസാധ്യത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പേരുകൾ മൂലഹീബ്രുവിനോട് അടുത്ത് ലിപ്യന്തരണം ചെയ്തു. ആരാധനാചാരത്തിന്റെ ഭീകരത മറയ്ക്കാതെയും മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യവാക്യത്തിൽ ചേർക്കാതെയും പരിഭാഷപ്പെടുത്തി.
