    issue: “കൈമുഖാന്തരം” is awkward and its footnote inaccurately presents it as a literal Hebrew expression.
    rationale: בְּיַד literally contains “hand” (“by/through the hand of”) but functions idiomatically to mark agency. Malayalam “മുഖാന്തരം” communicates that agency naturally; the note should gloss the Hebrew as “കൈയാൽ/കൈവഴി,” not “കൈമുഖാന്തരം.”
