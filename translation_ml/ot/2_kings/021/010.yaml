  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה בְּ/יַד עֲבָדָ֥י/ו הַ/נְּבִיאִ֖ים לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/010.yaml
  text: And Yahweh spoke by the hand of his servants the prophets[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വെ തന്റെ ദാസന്മാരായ പ്രവാചകന്മാർ മുഖാന്തരം[a] ഇങ്ങനെ അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘കൈയാൽ’ അഥവാ ‘കൈവഴി’; ഇവിടെ അതിന്റെ അർഥം ‘മുഖാന്തരം’ അല്ലെങ്കിൽ ‘വഴിയായി’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: דבר എന്ന ക്രിയയുടെ ‘സംസാരിക്കുക’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, ദൈവം പ്രവാചകന്മാർ മുഖാന്തരം അറിയിക്കുന്ന സന്ദേശത്തിന് യോജിച്ച മാന്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּיַד
  choice: കൈമുഖാന്തരം
  rationale: ‘കൈയാൽ/കൈമുഖാന്തരം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകഭാവം നിലനിർത്തുന്നു; ഇവിടെ അത് ‘വഴിയായി’ അഥവാ ‘മുഖാന്തരം’ എന്ന കർത്തൃത്വമാധ്യമത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: עֲבָדָיו
  choice: തന്റെ ദാസന്മാരായ
  rationale: ദൈവത്തിന്റെ നിയോഗിത സേവകരെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കാൻ ‘ദാസന്മാർ’ ഉപയോഗിച്ചു; ‘അടിമകൾ’ എന്നത് ഇവിടെ അനാവശ്യമായി ബന്ധിതാവസ്ഥയെ മുൻനിർത്തും.
- source_word: הַנְּבִיאִים
  choice: പ്രവാചകന്മാർ
  rationale: നിശ്ചിത ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ; ഇവരാണ് ‘ദാസന്മാർ’ എന്ന് സമാനാധികരണമായി വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ദൈവവചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി പകരാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തോട് ചേർന്ന മലയാളരൂപമായ ‘യഹ്‌വെ’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വായിക്കാൻ കഴിയുന്ന വിധത്തിൽ വാക്യക്രമം സ്വാഭാവികമാക്കി. ‘അരുളിച്ചെയ്തു’ എന്നത് മാന്യമായ തിരുവെഴുത്തുഭാഷ നിലനിർത്തുന്നു; ‘കൈമുഖാന്തരം’ എന്ന മൂലഭാഷയുടെ സവിശേഷ പ്രയോഗം അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
