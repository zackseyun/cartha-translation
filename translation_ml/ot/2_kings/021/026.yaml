  text: And they buried him in his tomb in the garden of Uzza[b][a], and Josiah his son became king in his place.
translation:
  language: ml
  text: അവർ അവനെ ഉസ്സയുടെ തോട്ടത്തിലുള്ള അവന്റെ കല്ലറയിൽ അടക്കം ചെയ്തു.[a][b] അവന്റെ മകനായ യോശീയാവ് അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അവൻ അവനെ അടക്കം ചെയ്തു.’ സന്ദർഭത്തിൽ കർത്താവ് വ്യക്തമല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ‘അവർ’ എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘കല്ലറ’ എന്നതിന് ‘അടക്കസ്ഥലം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: അവർ ... അടക്കം ചെയ്തു
  rationale: ക്രിയാരൂപം വ്യാകരണപരമായി മൂന്നാംപുരുഷ ഏകവചനമാണെങ്കിലും, ആരാണ് അടക്കം ചെയ്തതെന്ന് സന്ദർഭത്തിൽ വ്യക്തമല്ല. മലയാളത്തിൽ അജ്ഞാതമായ കൂട്ടായ കർത്താവിനെ സൂചിപ്പിക്കാൻ ‘അവർ’ സ്വാഭാവികമാണ്; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: קְבֻרָתוֹ
  choice: അവന്റെ കല്ലറയിൽ
  rationale: ഈ നാമം അടക്കസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ‘കല്ലറ’ ആ അർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു; ‘അവന്റെ’ എന്നത് പ്രത്യയം വ്യക്തമാക്കുന്നു.
- source_word: גַן עֻזָּא
  choice: ഉസ്സയുടെ തോട്ടത്തിലുള്ള
  rationale: എബ്രായത്തിലെ construct ബന്ധം സ്വാഭാവിക മലയാളത്തിലെ ഉടമസ്ഥബന്ധമായി നിലനിർത്തുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജ്യാവകാശക്രമത്തിന്റെ ഈ സന്ദർഭത്തിൽ ക്രിയ ഭരണകാലത്തെ മുഴുവനല്ല, രാജപദവിയിലേക്കുള്ള പ്രവേശനമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: മുൻരാജാവിന്റെ സ്ഥാനത്തെ മകൻ ഏറ്റെടുത്തുവെന്ന രാജ്യാവകാശ അർഥം നേരിട്ട് നൽകുന്നു.
