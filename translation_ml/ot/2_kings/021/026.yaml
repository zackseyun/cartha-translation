translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ‘ഉസ്സ’, ‘യോശീയാവ്’ എന്നീ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനു പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
