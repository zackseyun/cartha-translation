  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
translation:
  language: ml
  text: കൂടാതെ, യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്യാൻ യെഹൂദയെ പാപം ചെയ്യിച്ച അവന്റെ പാപത്തിനു പുറമേ, മനശ്ശെ കുറ്റമില്ലാത്തവരുടെ രക്തം വളരെയധികം ചൊരിഞ്ഞു; യെരൂശലേമിനെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ[a] നിറയ്ക്കുന്നതുവരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘വായ്മുതൽ വായ്വരെ’; നഗരമൊട്ടാകെ, ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ എന്നർഥമുള്ള ഭാഷാശൈലി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: കൂടാതെ
  rationale: മുൻവിവരണത്തോടു മറ്റൊരു ഗുരുതര കുറ്റം കൂട്ടിച്ചേർക്കുന്ന സംയോജകവും ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: דָּם נָקִי
  choice: കുറ്റമില്ലാത്തവരുടെ രക്തം
  rationale: വധശിക്ഷ അർഹിക്കുന്ന കുറ്റം ചെയ്യാത്തവരെ കൊല്ലുന്നതിന്റെ നിയമപരവും ധാർമികവുമായ ഭാരം വ്യക്തമാക്കുന്നു.
- source_word: שָׁפַךְ
  choice: ചൊരിഞ്ഞു
  rationale: രക്തം ചൊരിയുക എന്ന മലയാള പ്രയോഗം നിയമവിരുദ്ധമായ കൊലപാതകത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഭാഷാശൈലിയോട് അടുത്തുനിൽക്കുന്നു.
- source_word: הַרְבֵּה מְאֹד
  choice: വളരെയധികം
  rationale: ഇരട്ട ഊന്നൽ അസ്വാഭാവികമാകാതെ ശക്തമായി പകർന്നുനൽകുന്നു.
- source_word: עַד אֲשֶׁר מִלֵּא אֶת יְרוּשָׁלִַם פֶּה לָפֶה
  choice: യെരൂശലേമിനെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ അവൻ രക്തംകൊണ്ടു നിറച്ചു
  rationale: വാക്യത്തിൽ പ്രത്യക്ഷ കർമം രക്തമായതിനാൽ മലയാളത്തിൽ അത് വ്യക്തമാക്കി; 'വായ്മുതൽ വായ്വരെ' എന്ന അക്ഷരാർഥ ഭാഷാശൈലിയുടെ നഗരമൊട്ടാകെ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְבַד מֵחַטָּאתוֹ
  choice: ഇതിനു പുറമേ ... പാപവും
  rationale: രക്തച്ചൊരിച്ചിൽ, യെഹൂദയെ പാപത്തിലാക്കിയ കുറ്റത്തിനു പുറമേയുള്ളതാണെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു; എബ്രായ ഏകവചനം സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יְהוּדָה
  choice: യെഹൂദയെ പാപത്തിലാക്കിയ
  rationale: ഹിഫീൽ ക്രിയാരൂപത്തിന്റെ കാരണാർത്ഥം നേരിട്ട് സംരക്ഷിക്കുകയും മനശ്ശെയുടെ സജീവ ഉത്തരവാദിത്വം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לַעֲשׂוֹת הָרַע
  choice: തിന്മയായതു ചെയ്യാൻ
  rationale: എബ്രായ ഉദ്ദേശ്യ/ഫല സൂചകമായ അനന്തരൂപം മലയാളത്തിലെ 'ചെയ്യാൻ' എന്ന ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: എബ്രായ വിലയിരുത്തൽ ഭാഷാശൈലിയുടെ രൂപകവും അർഥവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: הֶחֱטִיא എന്ന ക്രിയയിലെ മനശ്ശെയുടെ ഉത്തരവാദിത്വത്തിന്റെ ശക്തി
  choice: യെഹൂദയെ പാപത്തിലാക്കിയ
  alternative: യെഹൂദയെ പാപത്തിലേക്കു നയിച്ച
  rationale: കാരണാർത്ഥ ക്രിയാരൂപം മനശ്ശെയുടെ സജീവ പങ്ക് പ്രകടമാക്കുന്നു; എന്നാൽ യെഹൂദയുടെ സ്വന്തം ധാർമിക ഉത്തരവാദിത്വത്തെക്കുറിച്ച് മൂലപാഠത്തിന് അപ്പുറമുള്ള നിഗമനം ചേർക്കുന്നില്ല.
- issue: לְבַד מֵחַטָּאתוֹ എന്നതിലെ ഏകവചനമായ 'പാപം'
  choice: പാപവും
  alternative: പാപങ്ങൾക്കും പുറമേ
  rationale: മൂലത്തിലെ ഏകവചനം നിലനിർത്തുന്നു; ഇത് ഒരു പ്രത്യേക കുറ്റത്തെയോ അവന്റെ കുറ്റകരമായ പ്രവർത്തനഗതിയുടെ സംഗ്രഹത്തെയോ സൂചിപ്പിക്കാമെന്ന അവ്യക്തത പരിഹരിക്കാതെ വിടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവനാമത്തിന് ‘യഹോവ’ ഉപയോഗിച്ചു. ദീർഘമായ എബ്രായ വാക്യബന്ധം വ്യക്തമാക്കാൻ രണ്ട് വാക്യങ്ങളാക്കി; എന്നാൽ കൂട്ടിച്ചേർക്കലിന്റെ ആശയബന്ധവും കാരണാർത്ഥവും സംരക്ഷിച്ചു.
