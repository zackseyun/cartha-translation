id: 2KI.21.22
reference: 2 Kings 21:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲזֹ֕ב אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑י/ו וְ/לֹ֥א הָלַ֖ךְ בְּ/דֶ֥רֶךְ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
translation:
  language: ml
  text: അവൻ തന്റെ പിതാക്കന്മാരുടെ ദൈവമായ യഹോവയെ ഉപേക്ഷിച്ചു[a]; യഹോവയുടെ വഴിയിൽ നടന്നതുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിട്ടുകളഞ്ഞു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: ഉപേക്ഷിച്ചു
  rationale: עזב എന്ന ക്രിയയ്ക്ക് ‘വിട്ടുകളയുക, ഉപേക്ഷിക്കുക’ എന്നർഥമുണ്ട്. ‘ഉപേക്ഷിച്ചു’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഇവിടെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ അവിശ്വസ്തത വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരുടെ ദൈവമായ
  rationale: എബ്രായത്തിലെ ബന്ധസൂചക പ്രയോഗമായ ‘അവന്റെ പിതാക്കന്മാരുടെ ദൈവം’ എന്ന ആശയം നിലനിർത്തുന്നു. മലയാളത്തിലെ പരാമർശബന്ധം വ്യക്തമാക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: וְלֹא הָלַךְ
  choice: നടന്നതുമില്ല
  rationale: הלך എന്നതിലെ ‘നടക്കുക’ എന്ന ബൈബിൾരൂപകം സംരക്ഷിക്കുന്നു; മുൻവാക്യത്തോടുള്ള കൂട്ടിച്ചേർക്കൽ ‘-തുമില്ല’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בְּדֶרֶךְ יְהוָה
  choice: യഹോവയുടെ വഴിയിൽ
  rationale: דרך ഇവിടെ ജീവിതരീതിയെയോ ഉടമ്പടിയനുസൃതമായ പാതയെയോ സൂചിപ്പിക്കുന്ന രൂപകമാണ്. ‘വഴിയിൽ’ എന്നത് ആ രൂപകവും അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന നാമരൂപം ഉപയോഗിച്ചു.
- issue: אֲבֹתָיו എന്ന പൂർവികസംബന്ധിയായ പുരുഷലിംഗ പ്രയോഗം
  choice: തന്റെ പിതാക്കന്മാരുടെ
  alternative: തന്റെ പൂർവികരുടെ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനവും കുടുംബ-ഉടമ്പടി ഭാഷയും നിലനിർത്താൻ ‘പിതാക്കന്മാർ’ തെരഞ്ഞെടുത്തു; ‘പൂർവികർ’ വിശാലമായ അർഥസാധ്യതയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വഴിയിൽ നടന്നു’ എന്ന തിരുവെഴുത്തിലെ ജീവിതരൂപകം നിലനിർത്തിയിരിക്കുന്നു; വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
