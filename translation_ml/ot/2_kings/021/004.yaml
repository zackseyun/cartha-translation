id: 2KI.21.4
reference: 2 Kings 21:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָנָ֥ה מִזְבְּחֹ֖ת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֖ם אָשִׂ֥ים אֶת שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
translation:
  language: ml
  text: “യെരൂശലേമിൽ ഞാൻ എന്റെ നാമം വെക്കും” എന്നു യാഹ്‌വേ അരുളിച്ചെയ്ത ആലയത്തിൽ[a] അവൻ ബലിപീഠങ്ങൾ പണിതു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഹ്‌വേയുടെ ഭവനത്തിൽ.” എബ്രായത്തിൽ അക്ഷരാർഥം “യാഹ്‌വേയുടെ ഭവനം” എന്നാണ്; ഇവിടെ അത് ദേവാലയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “എന്റെ നാമം വെക്കും” എന്നത് യാഹ്‌വേ തന്റെ നാമവുമായി ബന്ധിപ്പിക്കാൻ തിരഞ്ഞെടുത്ത സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ദേവാലയ-ഉടമ്പടി പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָה
  choice: അവൻ ... പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ ഖൽ രൂപം തുടർകഥയിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രാരംഭ ‘പിന്നെ’ ചേർക്കാതെ സ്വാഭാവികമായി ക്രിയ അവതരിപ്പിച്ചു.
- source_word: מִזְבְּחֹת
  choice: ബലിപീഠങ്ങൾ
  rationale: മൃഗബലികളുമായി ബന്ധപ്പെട്ട പീഠങ്ങളെ സൂചിപ്പിക്കുന്ന מִזְבֵּחַ എന്ന പദത്തിന്റെ ബഹുവചനം; ആധുനിക മലയാളത്തിൽ വ്യക്തവും പതിവുമായ രൂപം.
- source_word: בְּבֵית יְהוָה
  choice: യഹോവയുടെ ആലയത്തിൽ
  rationale: בֵּית എന്നതിന്റെ അക്ഷരാർഥം ‘ഭവനം’ ആണെങ്കിലും ഈ സന്ദർഭത്തിൽ യെരൂശലേം ദേവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആലയം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: ആ ആലയത്തെക്കുറിച്ച് യഹോവ അരുളിച്ചെയ്തിരുന്നത്
  rationale: ബന്ധവാക്യം ‘യഹോവയുടെ ആലയം’ എന്ന മുൻപദത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മുൻകാല ദൈവവചനമാണെന്നത് ‘അരുളിച്ചെയ്തിരുന്നത്’ വ്യക്തമാക്കുന്നു.
- source_word: בִּירוּשָׁלַם
  choice: യെരൂശലേമിൽ
  rationale: בְּ സ്ഥലസൂചകമാണ്; എബ്രായത്തിലെ മുൻനിലയും ഊന്നലും നിലനിർത്തി ഉദ്ധരണിയുടെ തുടക്കത്തിൽ വെച്ചു.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: ഞാൻ എന്റെ നാമം സ്ഥാപിക്കും
  rationale: ശാബ്ദികമായി ‘എന്റെ നാമം വെക്കും’ എന്നാണ്. എന്നാൽ മലയാളത്തിൽ ‘നാമം സ്ഥാപിക്കും’ എന്നത് ദൈവം തിരഞ്ഞെടുത്ത സ്ഥലവുമായി തന്റെ നാമത്തെ ബന്ധിപ്പിക്കുന്ന ദേവാലയ-ഉടമ്പടി പ്രയോഗം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിച്ചില്ല. മലയാള വായനക്കാർക്ക് വ്യാപകമായി തിരിച്ചറിയാവുന്ന ദൈവനാമരൂപമായി ‘യഹോവ’ സ്വീകരിച്ചു.
- issue: ‘ഞാൻ എന്റെ നാമം സ്ഥാപിക്കും’ എന്ന ദേവാലയ-നാമ പ്രയോഗം
  choice: മൂലത്തിലെ നാമപ്രയോഗം നിലനിർത്തുക
  alternative: ഞാൻ എന്റെ സാന്നിധ്യം സ്ഥാപിക്കും; എന്റെ നാമം അവിടെ വസിപ്പിക്കും
  rationale: ഈ വാക്യം ദൈവത്തിന്റെ നാമത്തെയും തിരഞ്ഞെടുത്ത സ്ഥലത്തെയും ബന്ധിപ്പിക്കുന്നു; എന്നാൽ ‘സാന്നിധ്യം’ എന്ന വ്യാഖ്യാനപദം മൂലത്തിൽ നേരിട്ട് ഇല്ല. അതിനാൽ ദൈവസാന്നിധ്യം, ഉടമസ്ഥത, തിരഞ്ഞെടുപ്പ് എന്നിവയിലെ അർഥസമ്പുഷ്ടത അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിച്ച് മുഖ്യപാഠത്തിലെ രൂപകം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ആലയം’, ‘അരുളിച്ചെയ്തു’, ‘നാമം സ്ഥാപിക്കുക’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തിന്റെ ഔന്നത്യം നിലനിർത്തുമ്പോഴും അത്യന്തം പുരാതനമായ വാക്യഘടന ഒഴിവാക്കുന്നു.
