id: 2KI.21.12
reference: 2 Kings 21:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
translation:
  language: ml
  text: 'അതുകൊണ്ട്, ഇസ്രായേലിന്റെ ദൈവമായ യാഹ്‌വേ ഇപ്രകാരം പറയുന്നു: ഇതാ, ഞാൻ യെരൂശലേമിന്മേലും യെഹൂദാമേലും ഒരു ദുരന്തം വരുത്തുന്നു[a]. അതിനെക്കുറിച്ച് കേൾക്കുന്ന ഏവരുടെയും രണ്ടു ചെവികളും മുഴങ്ങും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദുരന്തം” എന്നതിന് “അനർത്ഥം” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഹീബ്രു പദം ധാർമിക തിന്മയെയല്ല, ന്യായവിധിയായി വരുന്ന വിനാശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “അവന്റെ രണ്ടു ചെവികളും മുഴങ്ങും.” കേൾക്കുന്ന വാർത്തയാൽ ഉണ്ടാകുന്ന ഞെട്ടലോ ഭീതിയോ പ്രകടിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണിത്.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞതിന്റെ അനന്തരഫലം അവതരിപ്പിക്കുന്ന നിഗമനസൂചക പദത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകസന്ദേശത്തിന്റെ ഔപചാരിക പ്രഖ്യാപനസൂത്രം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ
  rationale: വരാനിരിക്കുന്ന ദൈവിക നടപടിയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്നതും അതിന് ഊന്നൽ നൽകുന്നതുമായ ഹീബ്രു പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: מֵבִיא רָעָה
  choice: ഒരു ദുരന്തം വരുത്തുന്നു
  rationale: ഇവിടെ רָעָה ധാർമിക തിന്മയെയല്ല, ന്യായവിധിയായി വരുന്ന വിനാശകരമായ അനർത്ഥത്തെയാണ് സൂചിപ്പിക്കുന്നത്; കാരണകർത്താവായുള്ള ദൈവിക നടപടി 'വരുത്തുന്നു' വ്യക്തമാക്കുന്നു.
- source_word: עַל יְרוּשָׁלַם וִיהוּדָה
  choice: യെരൂശലേമിന്റെയും യെഹൂദയുടെയുംമേൽ
  rationale: വിധി ഈ സ്ഥലങ്ങളുടെമേൽ പതിക്കുന്നു എന്ന עַל-ന്റെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל שֹׁמְעָיו
  choice: അതിനെക്കുറിച്ചു കേൾക്കുന്ന ഏവരുടെയും
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം വരാനിരിക്കുന്ന ദുരന്തത്തെക്കുറിച്ചുള്ള വാർത്തയെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: രണ്ടു ചെവികളും തരിച്ചുപോകും
  rationale: ഞെട്ടലോ ഭീതിയോ ഉളവാക്കുന്ന വാർത്തയെ സൂചിപ്പിക്കുന്ന ദൃശ്യാത്മക ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ അടുത്ത രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവം വരുത്തുന്ന רָעָה എന്നതിന്റെ അർത്ഥം
  choice: ദുരന്തം
  alternative: തിന്മ; അനർത്ഥം
  rationale: സന്ദർഭം ദൈവത്തിന്റെ ധാർമിക തിന്മയെക്കുറിച്ചല്ല, ശിക്ഷാത്മക ന്യായവിധിയായി വരുന്ന വിനാശത്തെക്കുറിച്ചാണ്. 'ദുരന്തം' ആ അർത്ഥം വ്യക്തമായി നൽകുന്നു; ദൈവിക വിധിയുടെ കാഠിന്യം മയപ്പെടുത്തുന്നുമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ‘അരുളിച്ചെയ്യുന്നു’, ‘ഇതാ’ എന്നിവ ഉപയോഗിച്ചു; അപൂർവമോ അത്യന്തം പുരാതനമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
