source:
  edition: WLC
  text: וַ/יָּ֗שָׁב וַ/יִּ֨בֶן֙ אֶת הַ/בָּמ֔וֹת אֲשֶׁ֥ר אִבַּ֖ד חִזְקִיָּ֣הוּ אָבִ֑י/ו וַ/יָּ֨קֶם מִזְבְּחֹ֜ת לַ/בַּ֗עַל וַ/יַּ֤עַשׂ אֲשֵׁרָה֙ כַּ/אֲשֶׁ֣ר עָשָׂ֗ה אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יִּשְׁתַּ֨חוּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַֽ/יַּעֲבֹ֖ד אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: ml
  text: തന്റെ അപ്പനായ ഹിസ്കീയാവ് നശിപ്പിച്ചുകളഞ്ഞ പൂജാഗിരികൾ അവൻ വീണ്ടും പണിതു. അവൻ ബാലിന് ബലിപീഠങ്ങൾ സ്ഥാപിക്കുകയും, ഇസ്രായേലിന്റെ രാജാവായ ആഹാബ് ചെയ്തതുപോലെ ഒരു അശേരാ ഉണ്ടാക്കുകയും ചെയ്തു. ആകാശത്തിലെ സകല സൈന്യത്തെയും അവൻ കുമ്പിട്ടാരാധിക്കുകയും സേവിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: പൂജാഗിരികൾ
  rationale: ബാമോത്ത് എന്നത് സാധാരണ ഉയർന്ന സ്ഥലങ്ങളിലുള്ള ആരാധനാകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളവായനക്കാർക്ക് സ്ഥലവും ആരാധനാപരമായ ഉപയോഗവും ഒരുമിച്ച് വ്യക്തമാക്കുന്ന പദം.
- source_word: מִזְבְּחֹת לַבַּעַל
  choice: ബാലിനു ബലിപീഠങ്ങൾ
  rationale: ലַ എന്ന ദാതൃ/ബന്ധസൂചക പ്രയോഗം നിലനിർത്തി, ബാൽ ആരാധനയ്ക്കായി സമർപ്പിച്ച ബലിപീഠങ്ങൾ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֵׁרָה
  choice: അശേരാപ്രതിഷ്ഠ
  rationale: ഇവിടെ നിർമിക്കാവുന്ന ആരാധനാവസ്തുവാണ് സന്ദർഭം; അശേരാ എന്ന പേര് നിലനിർത്തിക്കൊണ്ട് അത് ഒരു പ്രതിഷ്ഠയാണെന്ന് വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: כָל־צְבָא הַשָּׁמַיִם
  choice: ആകാശത്തിലെ സകല സൈന്യം
  rationale: നക്ഷത്രങ്ങൾ ഉൾപ്പെടുന്ന ആകാശീയ ഗണത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁתַּחוּ ... וַיַּעֲבֹד
  choice: കുമ്പിട്ടാരാധിക്കുകയും സേവിക്കുകയും ചെയ്തു
  rationale: ശാരീരികമായി കുമ്പിടുന്നതും ആരാധനാപരമായി സേവിക്കുന്നതുമായ രണ്ടു വ്യത്യസ്ത ക്രിയകളും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അശേരാ എന്നത് ദേവതയെയോ ആരാധനാപ്രതിഷ്ഠയെയോ സൂചിപ്പിക്കുന്നതാണോ
  choice: അശേരാപ്രതിഷ്ഠ
  alternative: അശേരാ
  rationale: וַיַּעַשׂ (‘ഉണ്ടാക്കി’) എന്ന ക്രിയ ഇവിടെ നിർമിച്ച ആരാധനാവസ്തുവിലേക്കാണ് കൂടുതൽ നേരിട്ട് വിരൽചൂണ്ടുന്നത്; എങ്കിലും അശേരാ എന്ന പ്രത്യേക നാമം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- issue: ‘ആകാശസൈന്യം’ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ആകാശത്തിലെ സകല സൈന്യം
  alternative: ആകാശത്തിലെ സകല നക്ഷത്രങ്ങളും
  rationale: മൂലപാഠത്തിലെ വിശാലവും ചില അളവിൽ ദ്വയാർഥവുമായ രൂപകം ചുരുക്കി നക്ഷത്രങ്ങളായി മാത്രം നിർവചിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. തുടർച്ചയായ ഹീബ്രു ക്രിയകളുടെ ആവർത്തനഭാരം കുറച്ചെങ്കിലും ഓരോ പ്രവൃത്തിയും വ്യക്തമായി സംരക്ഷിച്ചു; മതവിഭാഗ-വിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
