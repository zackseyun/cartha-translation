  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּתְעֵ֤/ם מְנַשֶּׁה֙ לַ/עֲשׂ֣וֹת אֶת הָ/רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
translation:
  language: ml
  text: എന്നാൽ അവർ ചെവികൊടുത്തില്ല. യാഹ്‌വെ ഇസ്രായേൽമക്കളുടെ[b] മുമ്പിൽനിന്ന് നശിപ്പിച്ച ജനതകളെക്കാൾ അധികം തിന്മ ചെയ്യാൻ[a] മനശ്ശെ അവരെ വഴിതെറ്റിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജനതകൾ ചെയ്തതിനെക്കാൾ തിന്മ ചെയ്യാൻ.” എബ്രായയിൽ താരതമ്യം അക്ഷരാർഥത്തിൽ “ജനതകളിൽനിന്ന്/ജനതകളെക്കാൾ” എന്ന രൂപത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇസ്രായേല്യർ.” എബ്രായയിൽ അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ മക്കൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: ചെവികൊടുത്തില്ല
  rationale: ശ്രവിക്കുന്നതും അതനുസരിക്കാൻ മനസ്സുവയ്ക്കുന്നതും ഉൾക്കൊള്ളുന്ന שׁמע എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി ഈ പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘അനുസരിച്ചില്ല’ എന്നു മാത്രം പറഞ്ഞ് അർഥം അമിതമായി നിർണയിക്കുന്നില്ല.
- source_word: וַיַּתְעֵם
  choice: അവരെ വഴിതെറ്റിച്ചു
  rationale: תעה എന്ന ധാതുവിന്റെ കാരണാർത്ഥരൂപം മനശ്ശെ ജനത്തെ ധാർമികമായും ആത്മീയമായും തെറ്റായ വഴിയിലേക്കു നയിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לַעֲשׂוֹת אֶת הָרָע
  choice: അധികം തിന്മ ചെയ്യാൻ
  rationale: തുടർന്നുവരുന്ന מִן താരതമ്യം സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ താരതമ്യത്തിന്റെ ശക്തി വ്യക്തമാക്കാൻ ‘അധികം’ ചേർത്തു.
- source_word: מִן הַגּוֹיִם
  choice: ജനതകളെക്കാൾ
  rationale: ഇവിടെ מִן വേർപാടിനെയല്ല, താരതമ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. גּוֹיִם ചരിത്രസന്ദർഭത്തിലെ ജനതകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הִשְׁמִיד
  choice: നശിപ്പിച്ച
  rationale: ഈ ക്രിയ സമൂലമായ നാശത്തെ സൂചിപ്പിക്കുന്നു; ‘നശിപ്പിച്ച’ ശക്തവും dignified ആയ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מִפְּנֵי
  choice: മുമ്പിൽനിന്ന്
  rationale: ജയിച്ചടക്കലിന്റെ ഈ സന്ദർഭത്തിൽ ജനതകളെ ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് നീക്കിക്കളഞ്ഞു എന്ന എബ്രായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികവും പരിചിതവുമായ സംയുക്തപദം ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രതിനിധാനപരമായ പുരുഷലിംഗപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു; അതേസമയം ഇത് ഉടമ്പടിജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പ്രതിനിധാനപ്രയോഗമാണെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ചെവികൊടുത്തില്ല’ എന്നത് കേൾവിയുടെയും അനുസരണത്തിന്റെയും സംയുക്തഭാവം നിലനിർത്തുന്നു. എബ്രായയിലെ താരതമ്യഘടനയുടെ ചെറിയ അസ്പഷ്ടത പ്രധാനപാഠത്തിൽ പരിഹരിക്കാതെ, സ്വാഭാവികമായ വായന നൽകി മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
