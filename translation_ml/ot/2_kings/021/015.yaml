  yaml_path: translation/ot/2_kings/021/015.yaml
  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, അവർ എന്റെ ദൃഷ്ടിയിൽ തിന്മ പ്രവർത്തിക്കുകയും, അവരുടെ പിതാക്കന്മാർ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ട നാൾമുതൽ ഇന്നുവരെയും എന്നെ പ്രകോപിപ്പിച്ചുകൊണ്ടുമിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ പൂർവികർ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ട നാൾമുതൽ ഇന്നുവരെയും.” എബ്രായപാഠത്തിൽ മുൻതലമുറകളെ സൂചിപ്പിക്കാൻ “അവരുടെ പിതാക്കന്മാർ” എന്ന പുരുഷലിംഗ ബന്ധുപദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിൽ പ്രഖ്യാപിച്ച ന്യായവിധിയുടെ കാരണം അവതരിപ്പിക്കുന്ന ഹേതുബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עָשׂוּ אֶת־הָרַע
  choice: തിന്മയായത് ചെയ്യുകയും
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ അർഥം ‘തിന്മ ചെയ്യുക’ എന്നതാണ്; ഏകകാലിക സംഭവമെന്നതിലുപരി തുടർന്നുവരുന്ന കുറ്റത്തിന്റെ പശ്ചാത്തലത്തിൽ മലയാള ക്രിയാസംയോജനം ഉപയോഗിച്ചു.
- source_word: בְּעֵינַי
  choice: എന്റെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തൽ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം, മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സമാനപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: וַיִּהְיוּ מַכְעִסִים אֹתִי
  choice: എന്നെ പ്രകോപിപ്പിച്ചുകൊണ്ടിരിക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: היה + കർത്തൃവാചക രൂപം സൂചിപ്പിക്കുന്ന നിരന്തരമോ പതിവായതോ ആയ പ്രവൃത്തിയെ ‘കൊണ്ടിരിക്കുക’ എന്ന ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: מִן־הַיּוֹם אֲשֶׁר
  choice: നാൾമുതൽ
  rationale: തുടർച്ചയായ പ്രവൃത്തിയുടെ ആരംഭബിന്ദു ചുരുക്കമായും സ്വാഭാവികമായും അടയാളപ്പെടുത്തുന്നു.
- source_word: יָצְאוּ אֲבוֹתָם מִמִּצְרַיִם
  choice: അവരുടെ പിതാക്കന്മാർ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ട
  rationale: יצא എന്ന പുറപ്പാട്-ക്രിയയും אבותם എന്ന പുരുഷലിംഗ ബന്ധുപദവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: എബ്രായ കാലപരിധിയുടെ തുടരുന്ന ശക്തി മലയാളത്തിലെ പതിവായ പ്രയോഗത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പുറപ്പാടുമുതലുള്ള ഇസ്രായേലിന്റെ കൂട്ടായ ചരിത്രപരമായ കുറ്റതുടർച്ച
  choice: പിതാക്കന്മാർ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ട നാൾമുതൽ ഇന്നുവരെ എന്ന കാലപരിധി വ്യക്തമായി നിലനിർത്തി.
  alternative: ഇത് സമീപകാല രാജാക്കന്മാരുടെ പാപങ്ങളെക്കുറിച്ചുള്ള അലങ്കാരപരമായ സംഗ്രഹമായി മാത്രം അവതരിപ്പിക്കുക.
  rationale: വാക്യം മുൻതലമുറകളുടെ കാലംമുതലുള്ള പ്രകോപനത്തെ തുറന്നുപറയുന്നു; അതിലെ ഉടമ്പടി-ചരിത്രപരമായ സംഘർഷം വിശദീകരിച്ച് ലഘൂകരിക്കാതെ വിവർത്തനം സംരക്ഷിക്കുന്നു.
- issue: אֲבוֹתָם എന്ന ബന്ധുപദത്തിന്റെ പരിഭാഷ
  choice: അവരുടെ പിതാക്കന്മാർ
  alternative: അവരുടെ പൂർവികർ
  rationale: മൂലപദം വ്യാകരണപരമായി പുരുഷലിംഗത്തിലുള്ള ബന്ധുപദമാണ്. മുഖ്യപാഠത്തിൽ അതിന്റെ രൂപം നിലനിർത്തുകയും വിപുലമായ തലമുറാസൂചന അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ഗദ്യം. ‘എന്റെ ദൃഷ്ടിയിൽ’ എന്ന രൂപകം നിലനിർത്തി; ‘പ്രകോപിപ്പിച്ചുകൊണ്ടിരിക്കുകയും’ എന്ന രൂപം പ്രവൃത്തിയുടെ ദീർഘകാല തുടർച്ച വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
