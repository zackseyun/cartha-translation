id: 2KI.21.13
reference: 2 Kings 21:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָטִ֣יתִי עַל יְרוּשָׁלִַ֗ם אֵ֚ת קָ֣ו שֹֽׁמְר֔וֹן וְ/אֶת מִשְׁקֹ֖לֶת בֵּ֣ית אַחְאָ֑ב וּ/מָחִ֨יתִי אֶת יְרוּשָׁלִַ֜ם כַּֽ/אֲשֶׁר יִמְחֶ֤ה אֶת הַ/צַּלַּ֨חַת֙ מָחָ֔ה וְ/הָפַ֖ךְ עַל פָּנֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
translation:
  language: ml
  text: ഞാൻ യെരൂശലേമിന്മേൽ ശമര്യയുടെ അളവുനൂലും ആഹാബിന്റെ ഭവനത്തിന്റേതായ തൂക്കുകട്ടിയും നീട്ടും[a]. ഒരാൾ ഒരു പാത്രം തുടച്ച് അതിനെ കമഴ്ത്തുന്നതുപോലെ ഞാൻ യെരൂശലേമിനെ തുടച്ചുകളയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അളവുനൂൽ” എന്നത് “നിർമാണനൂൽ” എന്നും “തൂക്കുകട്ടി” എന്നത് “ലംബം നോക്കുന്ന തൂക്കുകട്ടി” അഥവാ “തൂക്കുനൂൽ” എന്നും വിവർത്തനം ചെയ്യാം. ശമര്യയ്ക്കും ആഹാബിന്റെ ഭവനത്തിനും എതിരെ ഉപയോഗിച്ച അതേ മാനദണ്ഡപ്രകാരം യെരൂശലേമിനെയും വിധിക്കുന്നതാണ് ഈ ദൃശ്യം.
    reason: lexical_alternative
  - marker: b
    text: “പാത്രം” എന്നതിന് “തളിക” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי
  choice: ഞാൻ ... നീട്ടും
  rationale: נטה എന്ന ക്രിയയുടെ ‘നീട്ടുക’ എന്ന മൂർത്തമായ അർഥവും അളവുനൂൽ നഗരത്തിന്മേൽ നീട്ടുന്ന ന്യായവിധിയുടെ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: קָו
  choice: അളവുനൂൽ
  rationale: അളക്കുന്നതിനോ നിർമാണപരിശോധനയ്ക്കോ ഉപയോഗിക്കുന്ന നൂൽ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מִשְׁקֹלֶת
  choice: തൂക്കുനൂൽ
  rationale: ലംബം പരിശോധിക്കാൻ ഭാരക്കട്ടിയോടുകൂടി ഉപയോഗിക്കുന്ന ഉപകരണത്തെ സൂചിപ്പിക്കുന്നു; കָו എന്നതോടൊപ്പം വരുന്ന അളക്കൽ-ന്യായവിധി രൂപകം നിലനിർത്തുന്നു.
- source_word: בֵּית אַחְאָב
  choice: ആഹാബിന്റെ ഭവനം
  rationale: രാജവംശത്തെ സൂചിപ്പിക്കുന്ന ‘ഭവനം’ എന്ന ബൈബിൾപ്രയോഗം സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וּמָחִיתִי
  choice: തുടച്ചുകളയും
  rationale: തുടർന്നുവരുന്ന പാത്രം തുടയ്ക്കുന്ന ഉപമയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും നാശത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת
  choice: ഒരാൾ ഒരു പാത്രം തുടയ്ക്കുന്നതുപോലെ
  rationale: അനിശ്ചിത കർത്താവിനെ ‘ഒരാൾ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; צלחת എന്ന പദത്തിന്റെ വിശാലമായ പാത്രം/തളിക അർഥം ‘പാത്രം’ സംരക്ഷിക്കുന്നു.
- source_word: מָחָה וְהָפַךְ עַל פָּנֶיהָ
  choice: അതു തുടച്ചശേഷം കമഴ്ത്തിവെക്കും
  rationale: പാത്രം തുടച്ച് അതിന്റെ മുഖത്തിന്മേൽ മറിച്ചിടുന്ന ക്രമവും സമ്പൂർണ ശൂന്യമാക്കലിന്റെ ദൃശ്യവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שֹׁמְרוֹן / יְרוּשָׁלִַם
  choice: ശമര്യ / യെരൂശലേം
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ സ്ഥലനാമരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ശമര്യയുടെയും ആഹാബിന്റെ ഭവനത്തിന്റെയും അളവുപകരണങ്ങളുടെ രൂപകം
  choice: അവർക്കെതിരെ പ്രയോഗിച്ച അതേ ന്യായവിധിയുടെ മാനദണ്ഡം യെരൂശലേമിന്മേലും പ്രയോഗിക്കുന്നതായി വിവർത്തനം സൂചിപ്പിക്കുന്നു.
  alternative: മറ്റു സന്ദർഭങ്ങളിലെപ്പോലെ ഇത് പുനർനിർമാണത്തിനായുള്ള അളക്കലായി വായിക്കാം.
  rationale: ഉടൻ പിന്നാലെയുള്ള പാത്രം തുടച്ച് കമഴ്ത്തുന്ന ഉപമ ഇവിടെ നാശകരമായ ന്യായവിധിയാണെന്ന് വ്യക്തമാക്കുന്നു; എങ്കിലും ആ വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ അധികമായി ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘അളവുനൂൽ’, ‘തൂക്കുനൂൽ’ എന്നീ പദങ്ങൾ മൂലത്തിലെ നിർമാണ-ന്യായവിധി രൂപകം സംരക്ഷിക്കുന്നു. മുഖ്യവാക്യത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട അടിക്കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
