revisions:
- from: ഞാൻ ശമര്യയുടെ അളവുനൂലും ആഹാബിന്റെ ഭവനത്തിന്റെ തൂക്കുനൂലും യെരൂശലേമിന്മേൽ നീട്ടും[a]. ഒരാൾ ഒരു പാത്രം തുടയ്ക്കുന്നതുപോലെ ഞാൻ യെരൂശലേമിനെ തുടച്ചുകളയും[b]; അതു തുടച്ചശേഷം കമഴ്ത്തിവെക്കും.
  to: ഞാൻ യെരൂശലേമിന്മേൽ ശമര്യയുടെ അളവുനൂലും ആഹാബിന്റെ ഭവനത്തിന്റേതായ തൂക്കുകട്ടിയും നീട്ടും[a]. ഒരാൾ ഒരു പാത്രം തുടച്ച് അതിനെ കമഴ്ത്തുന്നതുപോലെ ഞാൻ യെരൂശലേമിനെ തുടച്ചുകളയും[b].
  rationale: പരിഷ്കാരം മൂലത്തിലെ പാത്രം-ഉപമയുടെ ആവർത്തനാത്മകമായ പ്രവർത്തനദൃശ്യം ‘തുടച്ച് അതിനെ കമഴ്ത്തുന്നതുപോലെ’ എന്ന ഒറ്റ സ്വാഭാവിക മലയാളഘടനയിൽ പുനഃസ്ഥാപിക്കുന്നു; ഉറപ്പില്ലാത്ത കാലക്രമം ചേർക്കുന്നില്ല. מִשְׁקֹלֶת-ന്റെ കൃത്യമായ ഉപകരണാർഥം ‘തൂക്കുകട്ടി’ ഉപയോഗിച്ച് മെച്ചപ്പെടുത്തി. ന്യായവിധിയുടെ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അധികമായി ഉൾപ്പെടുത്താതെ അടിക്കുറിപ്പിൽ മാത്രം വിശദമാക്കുന്നു.
