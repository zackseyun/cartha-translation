base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: ml
  text: 'അവൻ ഉണ്ടാക്കിയ അശേരയുടെ കൊത്തുപ്രതിമ[a] അവൻ ആ ആലയത്തിൽ സ്ഥാപിച്ചു. ആ ആലയത്തെക്കുറിച്ച് യഹോവ ദാവീദിനോടും അവന്റെ മകനായ ശലോമോനോടും ഇങ്ങനെ അരുളിച്ചെയ്തിരുന്നു: “ഈ ആലയത്തിലും ഇസ്രായേലിന്റെ സകല ഗോത്രങ്ങളിൽനിന്നും ഞാൻ തിരഞ്ഞെടുത്ത യെരൂശലേമിലും ഞാൻ എന്റെ നാമം എന്നേക്കുമായി സ്ഥാപിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അശേരയുടെ പ്രതിമ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപാഠം ‘കൊത്തുപ്രതിമ’ എന്നും ‘അശേര’ എന്നും ചേർത്തുപയോഗിക്കുന്നു; അതിനാൽ ഇവിടെ ‘അശേരാസ്തംഭം’ എന്നു മാത്രം പറയുന്നത് അത്യന്തം നിർദ്ദിഷ്ടമായിരിക്കും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: സ്ഥാപിച്ചു
  rationale: ഒരു ആരാധനാവസ്തുവിനെ ആലയത്തിനുള്ളിൽ വെച്ച പ്രവൃത്തിയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: פֶּסֶל הָאֲשֵׁרָה
  choice: അശേരയുടെ കൊത്തുപ്രതിമ
  rationale: פֶּסֶל എന്നതിന്റെ കൊത്തിയുണ്ടാക്കിയ പ്രതിമ എന്ന മൂർത്തമായ അർഥവും אֲשֵׁרָהയോടുള്ള ബന്ധവും നിലനിർത്തുന്നു; ‘അശേരാസ്തംഭം’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: בַּבַּיִת
  choice: ആ ആലയത്തിൽ
  rationale: മൂലപദം ‘ഭവനം’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ യെരൂശലേം ദേവാലയമാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ ‘ആലയം’ സ്വാഭാവികമാണ്, തുടർന്നുള്ള ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു; ഒരു സ്ഥാനപ്പേര് കൊണ്ട് പകരുന്നില്ല.
- source_word: בְנוֹ
  choice: അവന്റെ മകനായ
  rationale: പ്രത്യയം ദാവീദിനെ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സകല ഗോത്രങ്ങളിൽനിന്നും ഞാൻ തിരഞ്ഞെടുത്ത
  rationale: מן സഹിതമുള്ള בחר എന്ന ക്രിയയുടെ, ഒരു സമൂഹത്തിൽനിന്ന് തിരഞ്ഞെടുക്കുക എന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: ഞാൻ എന്റെ നാമം സ്ഥാപിക്കും
  rationale: ആലയവുമായി ബന്ധപ്പെട്ട ഉടമ്പടി ഭാഷയിലെ ‘നാമം വെക്കുക’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְעוֹלָם
  choice: എന്നേക്കുമായി
  rationale: കാലപരിധിയില്ലാത്ത തുടർച്ചയെ സൂചിപ്പിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിന്റെ സ്വഭാവം
  choice: അശേരയുടെ കൊത്തുപ്രതിമ
  alternative: അശേരാസ്തംഭം
  rationale: വാക്യത്തിൽ פֶּסֶל എന്ന ‘കൊത്തുപ്രതിമ’ വ്യക്തമാക്കിയിരിക്കുന്നതിനാൽ വസ്തുവിനെ വെറും തൂൺ അഥവാ സ്തംഭം എന്നു നിർണ്ണയിക്കുന്നത് മൂലപാഠത്തേക്കാൾ ഇടുങ്ങിയ വ്യാഖ്യാനമാകും.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഇവിടെ എബ്രായമൂലത്തിൽ വ്യക്തിനാമമാണ്; അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപം ഉപയോഗിക്കുന്നു.
- issue: ദൈവത്തിന്റെ നാമം സ്ഥാപിക്കൽ
  choice: എന്റെ നാമം സ്ഥാപിക്കും
  alternative: ഞാൻ വസിക്കും
  rationale: മൂലപാഠത്തിലെ നാമഭാഷയെ നേരിട്ട് നിലനിർത്തുന്നു; അതിനെ ദൈവസാന്നിധ്യത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക വ്യാഖ്യാനമായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ആലയം’, ‘അരുളിച്ചെയ്തിരുന്നു’, ‘നാമം’ എന്നിവ തിരുവെഴുത്തിന്റെ ഔന്നത്യം നിലനിർത്തുമ്പോഴും പഴഞ്ചൻ പദസാന്ദ്രത ഒഴിവാക്കുന്നു. അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
