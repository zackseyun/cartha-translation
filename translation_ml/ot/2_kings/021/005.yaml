- issue: צְבָא הַשָּׁמַיִם എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: ആകാശസൈന്യം
  alternative: ആകാശത്തിലെ നക്ഷത്രങ്ങൾ; മുഴുവൻ സ്വർഗീയസൈന്യം
  rationale: ഈ പ്രയോഗം ആകാശഗോളങ്ങളെയോ സ്വർഗീയ ശക്തികളെയോ ഉൾക്കൊള്ളാവുന്നതാണ്. മുഖ്യപാഠത്തിൽ മൂലത്തിലെ പ്രയോഗം സംരക്ഷിച്ച്, സന്ദർഭപരമായ സാധ്യത അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ക്ഷേത്രസന്ദർഭത്തിന് ‘പ്രാകാരം’, ‘ആലയം’, ‘യാഗപീഠം’ എന്നീ സ്വാഭാവിക പദങ്ങൾ തിരഞ്ഞെടുത്തു; മൂലത്തിലെ മതപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
