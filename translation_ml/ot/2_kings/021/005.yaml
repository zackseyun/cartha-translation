lexical_decisions:
- source_word: וַיִּבֶן
  choice: അവൻ ... പണിതു
  rationale: בנה എന്ന ധാതുവിന്റെ ഖാൽ വയിക്തോൽ രൂപം തുടർച്ചയായ ഭൂതകാല ആഖ്യാനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ വേറൊരു ബന്ധകപദം ചേർക്കാതെ ക്രിയയെ ഭൂതകാലത്തിൽ നൽകി.
- source_word: מִזְבְּחוֹת
