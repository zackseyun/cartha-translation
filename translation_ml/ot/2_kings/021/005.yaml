- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: ആകാശസൈന്യത്തിനെല്ലാം വേണ്ടി
  rationale: ‘ആകാശത്തിന്റെ സൈന്യം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൂട്ടായതും ആരാധനാസംബന്ധവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; അതിനെ ‘നക്ഷത്രങ്ങൾ’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: രണ്ടു പ്രാകാരങ്ങളിലും
  rationale: שְׁתֵּי എന്ന സംഖ്യ രണ്ടു പ്രാകാരങ്ങളെയും വ്യക്തമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘രണ്ടു ...-ങ്ങളിലും’ എന്നത് രണ്ടിടങ്ങളിലും പണിതുവെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: בֵּית എന്നതിന്റെ ക്ഷേത്രസന്ദർഭത്തിലെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ആലയം’ എന്നു നൽകി; יְהוָה എന്ന ദൈവനാമം ശീർഷകമായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
