  text: അവൻ യഹ്‌വേയുടെ ആലയത്തിലെ രണ്ടു പ്രാകാരങ്ങളിലും ആകാശസൈന്യത്തിനാകെ വേണ്ടി യാഗപീഠങ്ങൾ പണിതു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുഴുവൻ സ്വർഗീയസൈന്യത്തിനും വേണ്ടി’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘ആകാശസൈന്യം’ എന്ന എബ്രായ പ്രയോഗം സ്വർഗീയ ഗണത്തെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ നക്ഷത്രാരാധനയിൽ വണങ്ങപ്പെട്ടിരുന്ന ആകാശഗോളങ്ങളെയോ ശക്തികളെയോ ഉദ്ദേശിച്ചിരിക്കാം.
