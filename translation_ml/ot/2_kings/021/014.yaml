  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
translation:
  language: ml
  text: എന്റെ അവകാശത്തിൽ ശേഷിച്ചവരെ[b] ഞാൻ ഉപേക്ഷിക്കുകയും[a] അവരെ അവരുടെ ശത്രുക്കളുടെ കയ്യിൽ ഏൽപ്പിക്കുകയും ചെയ്യും. അവർ അവരുടെ എല്ലാ ശത്രുക്കൾക്കും കൊള്ളയും കവർച്ചവസ്തുവും ആയിത്തീരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉപേക്ഷിക്കുകയും’ എന്നതിന് ‘കൈവിടുകയും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ അവകാശം’ എന്നതിന് ‘എന്റെ ഓഹരി’ എന്നും പരിഭാഷപ്പെടുത്താം; ദൈവത്തിനുള്ളതായി കണക്കാക്കപ്പെടുന്ന ജനത്തെയോ സ്വത്തിനെയോ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ ഭാഷയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  choice: ഞാൻ ഉപേക്ഷിക്കുകയും
  rationale: נטשׁ എന്നത് ഉപേക്ഷിക്കുക, കൈവിടുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. ന്യായവിധിയുടെ ഗൗരവം നിലനിർത്തുന്നതിനൊപ്പം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായതിനാൽ ‘ഉപേക്ഷിക്കുക’ തിരഞ്ഞെടുത്തു.
- source_word: שְׁאֵרִית
  choice: ശേഷിപ്പിനെ
  rationale: ന്യായവിധിക്കുശേഷം ശേഷിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രധാന പദമായ שְׁאֵרִית-ന്റെ അർഥം ‘ശേഷിപ്പ്’ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: נַחֲלָתִי
  choice: എന്റെ അവകാശത്തിന്റെ
  rationale: נחלה ദൈവത്തിനുള്ളതായി കണക്കാക്കപ്പെടുന്ന ഓഹരി, അവകാശം, ജനത എന്നിവയെ സൂചിപ്പിക്കാം. ‘എന്റെ അവകാശം’ ഉടമ്പടിപരമായ ഉടമസ്ഥബന്ധം നിലനിർത്തുന്നു; ജനമോ ദേശമോ എന്ന് പരിഭാഷയിൽ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וּנְתַתִּים בְּיַד
  choice: അവരെ ... കയ്യിൽ ഏല്പിക്കുകയും ചെയ്യും
  rationale: ‘കയ്യിൽ കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗം അധികാരത്തിന് കീഴിലാക്കുക എന്നർഥം വഹിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും മൂലരൂപകത്തോട് അടുത്തതുമായ ‘കയ്യിൽ ഏല്പിക്കുക’ ഉപയോഗിച്ചു.
- source_word: אֹיְבֵיהֶם
  choice: അവരുടെ ശത്രുക്കൾ
  rationale: אויבים എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ; രണ്ടു പ്രയോഗങ്ങളിലും ശത്രുക്കൾ എന്ന ആശയം ഒരേപോലെ നിലനിർത്തി.
- source_word: וְהָיוּ
  choice: ആയിത്തീരും
  rationale: היה ഇവിടെ ഏല്പിക്കപ്പെട്ടതിന്റെ ഫലമായി പുതിയ അവസ്ഥയിൽ എത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘ആയിരിക്കും’ എന്നതിനെക്കാൾ ‘ആയിത്തീരും’ യോജിക്കുന്നു.
- source_word: לְבַז
  choice: കൊള്ള
  rationale: בז ശത്രുക്കൾ പിടിച്ചെടുക്കുന്ന കൊള്ളയെ സൂചിപ്പിക്കുന്നു. ‘കൊള്ള’ വ്യക്തവും ആധുനിക മലയാളത്തിൽ സാധാരണവുമാണ്.
- source_word: וְלִמְשִׁסָּה
  choice: കവർച്ചവസ്തു
  rationale: משסה കൊള്ളയിടപ്പെടുന്നതോ കവർന്നെടുക്കപ്പെടുന്നതോ ആയ വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ‘കൊള്ളയും കവർച്ചവസ്തുവും’ എന്ന അടുത്ത അർഥമുള്ള ഇരട്ടപ്രയോഗം എബ്രായത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: לְכָל אֹיְבֵיהֶם
  choice: തങ്ങളുടെ എല്ലാ ശത്രുക്കൾക്കും
  rationale: 'לְ ഇവിടെ ബന്ധമോ പ്രയോജനമോ സൂചിപ്പിക്കുന്നു: അവർ എല്ലാ ശത്രുക്കൾക്കും കൊള്ളയായി മാറും. ‘എല്ലാ’ എന്ന വ്യാപ്തിയും നിലനിർത്തി.'
theological_decisions:
- issue: ‘എന്റെ അവകാശം’ എന്നതിലെ ഉടമ്പടിപരമായ സൂചന
  choice: ‘എന്റെ അവകാശത്തിന്റെ ശേഷിപ്പ്’ എന്ന് നിലനിർത്തി; അത് ദൈവത്തിനുള്ള ജനമോ ഓഹരിയോ ആണെന്ന ബന്ധം സംരക്ഷിച്ചു.
  alternative: ‘എന്റെ ജനത്തിൽ ശേഷിച്ചവർ’ അല്ലെങ്കിൽ ‘എന്റെ സമ്പത്തിന്റെ ശേഷിപ്പ്’
  rationale: മൂലപദം ദൈവത്തിനുള്ള ഓഹരി/അവകാശം എന്ന ആശയം നൽകുന്നു. അതിനെ ‘ജനം’ എന്നോ ‘ദേശം’ എന്നോ മാത്രം നിർണയിക്കാതെ മൂലത്തിലെ അർഥവ്യാപ്തിയും ദൈവവുമായുള്ള ഉടമസ്ഥബന്ധവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘കയ്യിൽ ഏല്പിക്കുക’ എന്ന മൂലരൂപകം നിലനിർത്തുകയും ‘കൊള്ളയും കവർച്ചവസ്തുവും’ എന്ന ഇരട്ടപ്രയോഗത്തിലൂടെ എബ്രായത്തിലെ കാവ്യാത്മക ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്തു.
