translation:
  language: ml
  text: അവൻ തന്റെ പിതാവായ മനശ്ശെ ചെയ്തതുപോലെ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: ‘യഹോവയുടെ കണ്ണുകളിൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: തിന്മയായതു ചെയ്തു
  rationale: עשה הרע എന്ന എബ്രായ പ്രയോഗം ‘തിന്മ ചെയ്യുക’ എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹോവയുടെ കണ്ണുകളിൽ’ എന്ന മൂലഭാഷാ രൂപകത്തിന്റെ വിലയിരുത്തൽസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: ചെയ്തതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר സൂചിപ്പിക്കുന്ന വ്യക്തമായ താരതമ്യശക്തി ‘പോലെതന്നെ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: מְנַשֶּׁה אָבִיו
  choice: തന്റെ അപ്പനായ മനശ്ശെ
  rationale: മനശ്ശെ എന്ന വ്യക്തിനാമവും אָבִיו എന്ന ബന്ധസൂചനയും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ നിലനിർത്തുന്നു; മലയാള വായനക്കാർക്കു പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചരിത്രവിവരണത്തിന്റെ ലളിതമായ ശൈലി നിലനിർത്തിയിരിക്കുന്നു.
