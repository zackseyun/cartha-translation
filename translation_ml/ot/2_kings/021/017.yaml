id: 2KI.21.17
reference: 2 Kings 21:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י מְנַשֶּׁה֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וְ/חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/017.yaml
  text: The rest of the acts of Manasseh, and all that he did, and his sin that he committed—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: മനശ്ശെയുടെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്തതൊക്കെയും അവൻ ചെയ്ത പാപവും യെഹൂദാരാജാക്കന്മാരുടെ വൃത്താന്തപുസ്തകത്തിൽ[a] എഴുതപ്പെട്ടിട്ടില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദാരാജാക്കന്മാരുടെ രാജവാർഷികരേഖയിൽ.’ എബ്രായപ്രയോഗം ഒരു രാജകീയ രേഖാസ്രോതസ്സിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ יֶתֶר דִּבְרֵי എന്ന പ്രയോഗം ശേഷിച്ച വാക്കുകളെയല്ല, രാജാവിന്റെ ശേഷിച്ച പ്രവൃത്തികളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ശേഷിച്ച പ്രവൃത്തികൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: എബ്രായ ആപേക്ഷികവാക്യത്തിന്റെ സമഗ്രത നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: അവൻ ചെയ്ത പാപവും
  rationale: മൂലത്തിലെ നാമ-ക്രിയ സമാനധാതുപ്രയോഗം മലയാളത്തിൽ അക്ഷരാർഥമായി ആവർത്തിച്ചാൽ അസ്വാഭാവികമാകും. ‘അവൻ ചെയ്ത പാപം’ എന്നത് ഉടമസ്ഥതയും നൈതിക-മതപരമായ ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: എഴുതപ്പെട്ടിട്ടില്ലയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന മൂലത്തിലെ നിഷേധാത്മക അലങ്കാരചോദ്യരൂപം പ്രസ്താവനയാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ വൃത്താന്തപുസ്തകത്തിൽ
  rationale: עַל סֵפֶר എന്ന രേഖാസന്ദർഭത്തിന് മലയാളത്തിൽ ‘പുസ്തകത്തിൽ’ സ്വാഭാവികമാണ്. דִּבְרֵי הַיָּמִים രാജകീയ രേഖകളെയോ വാർഷികവൃത്താന്തങ്ങളെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘വൃത്താന്തപുസ്തകം’ തിരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗത ബൈബിൾ നാമരൂപമായ ‘മനശ്ശെ’യും ഭൂമിശാസ്ത്രനാമമായ ‘യെഹൂദാ’യും ഉപയോഗിച്ചു; അനാവശ്യമായ പുരാതന വാക്യക്രമം ഒഴിവാക്കി.
