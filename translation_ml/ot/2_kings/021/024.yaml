id: 2KI.21.24
reference: 2 Kings 21:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּךְ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
translation:
  language: ml
  text: എന്നാൽ ദേശത്തിലെ ജനം ആമോൻ രാജാവിനെതിരെ ഗൂഢാലോചന നടത്തിയ എല്ലാവരെയും കൊന്നുകളഞ്ഞു; ദേശത്തിലെ ജനം അവന്റെ മകനായ യോശിയാവിനെ അവനു പകരം രാജാവാക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: കൊന്നുകളഞ്ഞു
  rationale: נכה എന്ന ക്രിയ ഈ സന്ദർഭത്തിൽ ഗൂഢാലോചനക്കാരെ വധിച്ചതിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കൊന്നുകളഞ്ഞു’ എന്നത് മാരകമായ നടപടിയെ വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַם הָאָרֶץ
  choice: ദേശത്തിലെ ജനം
  rationale: ഈ എബ്രായ പ്രയോഗം പൊതുജനത്തെയോ സാമൂഹിക-രാഷ്ട്രീയ സ്വാധീനമുള്ള നാട്ടുകാരെയോ സൂചിപ്പിക്കാം. അർഥപരിധി ചുരുക്കാതെ, ആവർത്തനം നിലനിർത്തുന്ന സ്വാഭാവികമായ വിവർത്തനമാണിത്.
- source_word: כָּל הַקֹּשְׁרִים
  choice: ഗൂഢാലോചന നടത്തിയ എല്ലാവരെയും
  rationale: קשר എന്ന ധാതുവിൽനിന്നുള്ള കർത്തൃവാചക രൂപം ഗൂഢാലോചനയിൽ ഏർപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു. ക്രിയാത്മക ഭാവം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: ആമോൻ രാജാവിനെതിരെ
  rationale: קשר എന്നതിനോടൊപ്പം עַל വരുമ്പോൾ ഒരാൾക്കെതിരായ ശത്രുതാപരമായ ഗൂഢാലോചനയാണ് അർഥം.
- source_word: וַיַּמְלִיכוּ
  choice: രാജാവാക്കി
  rationale: מלך എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഒരാളെ രാജാവാക്കുക എന്നതാണ്. അഭിഷേകം, കിരീടധാരണം തുടങ്ങിയ ചടങ്ങുകൾ മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ അവ ചേർക്കുന്നില്ല.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: അവന്റെ മകനായ യോശിയാവിനെ
  rationale: ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: രാജകീയ പിൻഗാമിത്വത്തിൽ ഒരാളുടെ സ്ഥാനത്ത് മറ്റൊരാൾ അധികാരമേൽക്കുന്നതിനെ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
- source_word: וַ
  choice: എന്നാൽ
  rationale: വാവ്-തുടർച്ചയെ മുൻവാക്യത്തിലെ ആമോന്റെ വധത്തോടുള്ള ജനങ്ങളുടെ പ്രതികാരനടപടിയുമായി ബന്ധിപ്പിക്കുന്ന വൈരുധ്യസൂചകമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ദേശത്തിലെ ജനം’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കാൻ നിലനിർത്തി. ഇംഗ്ലീഷ് കുറിപ്പിലെ ‘all the conspirators’ എന്നത് മലയാള മുഖ്യവാചകത്തിലെ ‘ഗൂഢാലോചന നടത്തിയ എല്ലാവരെയും’ എന്നതിനോട് അർഥപരമായി തുല്യമായതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
