id: 2KI.21.21
reference: 2 Kings 21:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/כָל הַ/דֶּ֖רֶךְ אֲשֶׁר הָלַ֣ךְ אָבִ֑י/ו וַֽ/יַּעֲבֹ֗ד אֶת הַ/גִּלֻּלִים֙ אֲשֶׁ֣ר עָבַ֣ד אָבִ֔י/ו וַ/יִּשְׁתַּ֖חוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/021.yaml
  text: He walked in all the way that his father had walked[a], and he served the idols that his father had served, and bowed down to them.
translation:
  language: ml
  text: അവൻ തന്റെ അപ്പൻ നടന്ന വഴിയിലൊക്കെയും നടന്നു; തന്റെ അപ്പൻ സേവിച്ച വിഗ്രഹങ്ങളെ[a] അവനും സേവിക്കുകയും അവയുടെ മുമ്പിൽ കുമ്പിടുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിഗ്രഹങ്ങൾ” എന്നതിനുള്ള എബ്രായപദം അവയെ അവഹേളിക്കുന്ന നിന്ദാസൂചക പദമാണ്; “ചാണകവിഗ്രഹങ്ങൾ” എന്നോ “അറപ്പുളവാക്കുന്ന വിഗ്രഹങ്ങൾ” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ אָבִיו
  choice: അവൻ തന്റെ അപ്പൻ നടന്ന വഴിയിലൊക്കെയും നടന്നു
  rationale: הלך എന്ന പദത്തിന്റെ ‘നടക്കുക’ എന്ന രൂപകവും דֶּרֶךְ എന്ന ഏകവചന ‘വഴി’യും നിലനിർത്തുന്നു; ഇവിടെ ഇത് ജീവിതരീതിയെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּעֲבֹד
  choice: സേവിക്കുകയും
  rationale: עבד എന്നത് അടിസ്ഥാനമായി ‘സേവിക്കുക’ എന്നാണ്. തുടർന്നുള്ള കുമ്പിടൽ എന്ന പ്രവൃത്തിയിൽനിന്നുള്ള പദവ്യത്യാസം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: הַגִּלֻּלִים
  choice: വിഗ്രഹങ്ങളെ
  rationale: പരാമർശിക്കപ്പെടുന്ന വസ്തുക്കളെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്ന സാധാരണ പദം. എബ്രായത്തിലെ നിന്ദാസൂചക ഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: അവയുടെ മുമ്പിൽ കുമ്പിടുകയും ചെയ്തു
  rationale: ശരീരം കുനിച്ച് ആദരിക്കുകയോ ആരാധിക്കുകയോ ചെയ്യുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; മുൻപുള്ള ‘സേവിച്ചു’ എന്ന ക്രിയയുമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: אָבִיו
  choice: തന്റെ അപ്പൻ
  rationale: പിതാവിനുള്ള നേരിട്ടുള്ള പരാമർശം; എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിലും രണ്ടിടത്തും നിലനിർത്തുന്നു.
theological_decisions:
- issue: גִּלֻּלִים എന്ന നിന്ദാസൂചക വിഗ്രഹപദത്തിന്റെ പരിഭാഷ
  choice: മുഖ്യവാചകത്തിൽ ‘വിഗ്രഹങ്ങൾ’; നിന്ദാസൂചകത അടിക്കുറിപ്പിൽ
  alternative: ‘അറപ്പുളവാക്കുന്ന വിഗ്രഹങ്ങൾ’ അല്ലെങ്കിൽ അക്ഷരാർഥത്തോടടുത്ത ‘ചാണകവിഗ്രഹങ്ങൾ’
  rationale: മുഖ്യവാചകത്തിൽ സ്വാഭാവികതയും അർഥവ്യക്തതയും നിലനിർത്തുമ്പോൾ, മൂലപദത്തിലെ ശക്തമായ അവഹേളനഭാവം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വഴിയിൽ നടക്കുക’ എന്ന തിരുവെഴുത്തിലെ പെരുമാറ്റരൂപകം നിലനിർത്തി; ‘സേവിക്കുക’, ‘കുമ്പിടുക’ എന്നീ വ്യത്യസ്ത ആരാധനാപ്രവൃത്തികളും വേർതിരിച്ചു.
