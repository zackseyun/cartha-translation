source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָמ֖וֹן אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: The rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: ആമോന്റെ ശേഷിച്ച പ്രവൃത്തികൾ[a]—അവൻ ചെയ്തവ—യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[b] എഴുതപ്പെട്ടിട്ടില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രവൃത്തികൾ’ എന്നതിന് ‘കാര്യങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ דִּבְרֵי പദശഃ ‘വാക്കുകൾ’ അല്ലെങ്കിൽ ‘കാര്യങ്ങൾ’ എന്നാണ്; എന്നാൽ രാജാവിനെക്കുറിച്ചുള്ള ഈ സംഗ്രഹസൂത്രത്തിൽ അവന്റെ രേഖപ്പെടുത്തിയ പ്രവൃത്തികളെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘പുസ്തകം’ എന്നത് പുരാതനമായ ഒരു എഴുത്തുരേഖയെ—സാധ്യതയനുസരിച്ച് ഒരു ചുരുളിനെ—സൂചിപ്പിക്കുന്നു. ഈ പദസമുച്ചയം ‘യെഹൂദാരാജാക്കന്മാരുടെ വാർഷികവൃത്താന്തം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר
  choice: മറ്റുള്ള
  rationale: יֶתֶר എന്നത് ‘ശേഷിക്കുന്ന ഭാഗം/മറ്റുള്ളവ’ എന്നാണ്. രാജഭരണസംഗ്രഹത്തിലെ പരിവർത്തനസൂചകമായ וְ മലയാളത്തിൽ പ്രത്യേകം ‘ഇപ്പോൾ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: דִּבְרֵי
  choice: പ്രവൃത്തികൾ
  rationale: പദശഃ ‘വാക്കുകൾ/കാര്യങ്ങൾ’ എന്നാണെങ്കിലും, രാജാവിനെക്കുറിച്ചുള്ള ഈ സ്ഥിരസൂത്രത്തിൽ അവന്റെ രേഖപ്പെടുത്തിയ പ്രവൃത്തികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אָמ֖וֹן
  choice: ആമോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲשֶׁר עָשָׂה
  choice: ആമോൻ ചെയ്ത
  rationale: ‘അവൻ ചെയ്തവ’ എന്ന ബന്ധവാക്യം മലയാളത്തിൽ നാമത്തിനു മുമ്പിൽ ചേർത്ത് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; അർഥം മാറ്റുന്നില്ല.
- source_word: הֲלֹא
  choice: ഇല്ലയോ?
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക അലങ്കാരചോദ്യത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: הֵם כְּתוּבִים
  choice: എഴുതപ്പെട്ടിട്ടില്ലയോ
  rationale: כְּתוּבִים എന്ന നിഷ്ക്രിയരൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും അലങ്കാരചോദ്യവുമായി സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: പദശഃ ‘പുസ്തകത്തിന്മേൽ/ചുരുളിന്മേൽ’ എന്നാണെങ്കിലും, ഒരു രേഖയുടെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ‘പുസ്തകത്തിൽ’ സ്വാഭാവികമാണ്.
- source_word: דִּבְרֵי הַיָּמִים
  choice: ദിനവൃത്താന്ത
  rationale: രാജകീയ സംഭവങ്ങളുടെ ഔദ്യോഗിക കാലക്രമരേഖയെയോ വാർഷികവൃത്താന്തത്തെയോ സൂചിപ്പിക്കുന്ന ശീർഷകപരമായ പ്രയോഗം.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ
  rationale: ഈ രേഖയുടെ ശീർഷകത്തിൽ לְ ബന്ധത്തെയോ വിഷയത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഷഷ്ഠീവ്യാകരണരൂപം സ്വാഭാവികമാണ്.
