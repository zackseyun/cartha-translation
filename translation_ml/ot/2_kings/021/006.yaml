- from: അവൻ തന്റെ മകനെ തീയിലൂടെ കടത്തുകയും[a], ശകുനം നോക്കുകയും ലക്ഷണം നിരീക്ഷിക്കുകയും[b], വെളിച്ചപ്പാടന്മാരുമായും ആത്മവിദ്യക്കാരുമായും ഇടപെടുകയും[c] ചെയ്തു. യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്തുകൊണ്ട് അവൻ അതു പെരുപ്പിച്ചു; അങ്ങനെ യഹോവയെ കോപിപ്പിച്ചു.
  to: അവൻ തന്റെ മകനെ തീയിലൂടെ കടത്തുകയും[a], ശകുനം നോക്കുകയും നിമിത്തങ്ങൾ വ്യാഖ്യാനിക്കുകയും[b], വെളിച്ചപ്പാടന്മാരുമായും ആത്മവിദ്യക്കാരുമായും ഇടപെടുകയും[c] ചെയ്തു. യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായവൻ വളരെയധികം ചെയ്തു; അങ്ങനെ യഹോവയെ കോപിപ്പിച്ചു.
  rationale: The revision retains the Hebrew idiom for the fire rite and the broad ambiguity of involvement with mediums and spiritists. It replaces the weak “observed signs” wording with explicit omen interpretation and recasts the intensifying final clause into natural Malayalam that conveys doing evil in abundance, without imposing a more specific interpretation.
