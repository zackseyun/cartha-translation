source:
  edition: WLC
  text: וְ/הֶעֱבִ֤יר אֶת בְּנ/וֹ֙ בָּ/אֵ֔שׁ וְ/עוֹנֵ֣ן וְ/נִחֵ֔שׁ וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעֹנִ֑ים הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִֽיס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
translation:
  language: ml
  text: അവൻ തന്റെ മകനെ തീയിലൂടെ കടത്തുകയും[a], ശകുനം നോക്കുകയും നിമിത്തങ്ങൾ വ്യാഖ്യാനിക്കുകയും[b], വെളിച്ചപ്പാടന്മാരുമായും ആത്മവിദ്യക്കാരുമായും ഇടപെടുകയും[c] ചെയ്തു. യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായവൻ വളരെയധികം ചെയ്തു; അങ്ങനെ യഹോവയെ കോപിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “തന്റെ മകനെ തീയിൽ ബലിയർപ്പിച്ചു.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “തന്റെ മകനെ തീയിലൂടെ കടത്തി” എന്നാണ്.'
    reason: alternative_reading
  - marker: b
    text: “നിമിത്തങ്ങൾ വ്യാഖ്യാനിച്ചു” എന്നത് “ശകുനങ്ങളിലൂടെ ഭാവി നിർണയിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “വെളിച്ചപ്പാടന്മാരോടും ആത്മവിദ്യക്കാരോടും ആലോചന ചോദിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്; അവരുമായുള്ള കൂടുതൽ വ്യാപകമായ ഇടപെടലിനെയും അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר אֶת־בְּנוֹ בָּאֵשׁ
  choice: തന്റെ മകനെ തീയിലൂടെ കടത്തി
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള עבר എന്ന ക്രിയയും ‘മകൻ’, ‘തീയിൽ/തീയിലൂടെ’ എന്നീ പദങ്ങളും ചേർന്നുള്ള എബ്രായ പ്രയോഗം അതേ രൂപത്തിൽ നിലനിർത്തുന്നു; ഇത് ശിശുബലിയെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും മുഖ്യവാചകത്തിൽ ആചാരത്തിന്റെ കൃത്യസ്വഭാവം അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: וְעוֹנֵן
  choice: ശകുനം നോക്കി
  rationale: ഭാവി അറിയാൻ ശ്രമിക്കുന്ന നിരോധിത ഗൂഢാചാരത്തെ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְנִחֵשׁ
  choice: ലക്ഷണം നിരീക്ഷിച്ചു
  rationale: נחשׁ ഇവിടെ ശകുനങ്ങളിലൂടെയോ ലക്ഷണങ്ങളിലൂടെയോ ദിവ്യജ്ഞാനം തേടുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുൻപത്തെ ക്രിയയുമായുള്ള സാമ്യം നിലനിൽക്കുന്നുവെങ്കിലും വേറിട്ട പദപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: וְעָשָׂה אוֹב וְיִדְּעֹנִים
  choice: വെളിച്ചപ്പാടന്മാരുമായും ആത്മവിദ്യക്കാരുമായും ഇടപെട്ടു
  rationale: അക്ഷരാർഥത്തിൽ ദുഷ്കരമായ ‘ചെയ്തു/ഉണ്ടാക്കി’ എന്ന പ്രയോഗത്തെ, ഇത്തരം ആത്മമാധ്യമങ്ങളുമായുള്ള വ്യാപകമായ ബന്ധമോ ഉപയോഗമോ സൂചിപ്പിക്കുന്ന വിധത്തിൽ തുറന്നുവെക്കുന്നു; വെറും ‘ആലോചിച്ചു’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: ചെയ്തുകൊണ്ട് അവൻ അതു പെരുപ്പിച്ചു
  rationale: רבה എന്ന ഹിഫീൽ ക്രിയയിലെ വർധനയുടെയും ധാരാളമാക്കലിന്റെയും ഊന്നൽ നിലനിർത്തുന്നു; ‘വളരെ തിന്മ ചെയ്തു’ എന്നതിലുപരി ആവർത്തിച്ചും വർധിപ്പിച്ചും ചെയ്തതിന്റെ ഭാവം നൽകുന്നു.
- source_word: הָרַע
  choice: തിന്മയായത്
  rationale: നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ ധാർമ്മിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: എബ്രായ വിലയിരുത്തൽപ്രയോഗത്തിന്റെ അർഥവും മാന്യമായ മലയാള ശൈലിയും സംരക്ഷിക്കുന്നു; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְהַכְעִיס
  choice: യഹോവയെ കോപിപ്പിച്ചു
  rationale: കാരണപ്രയോഗത്തിന്റെ ശക്തിയും ക്രിയയുടെ ലക്ഷ്യം/ഫലവും വ്യക്തമായി നൽകുന്നു; മലയാളത്തിൽ അസ്പഷ്ടമായ സർവനാമം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ശിശുബലിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ വ്യക്തത
  choice: ‘തന്റെ മകനെ തീയിലൂടെ കടത്തി’ എന്ന എബ്രായ പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി
  alternative: ‘തന്റെ മകനെ തീയിൽ ബലിയർപ്പിച്ചു’ അല്ലെങ്കിൽ ‘തീയിൽ ദഹിപ്പിച്ചു’
  rationale: സന്ദർഭം ശിശുബലിയെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും എബ്രായ വാചകം ആചാരത്തെ വിശകലനാത്മകമായി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ സാധ്യതയുള്ള അർഥം അടിക്കുറിപ്പിൽ നൽകി മുഖ്യവാചകത്തിലെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- issue: וְעָשָׂה אוֹב וְיִדְּעֹנִים എന്ന ദുഷ്കരമായ പ്രയോഗം
  choice: ‘വെളിച്ചപ്പാടന്മാരുമായും ആത്മവിദ്യക്കാരുമായും ഇടപെട്ടു’
  alternative: ‘അവരോട് ആലോചന ചോദിച്ചു’ അല്ലെങ്കിൽ ‘അവരെ നിയമിച്ചു’
  rationale: എബ്രായത്തിലെ עשה ഇവിടെ കൃത്യമായി ഏതു തരത്തിലുള്ള പങ്കാളിത്തമാണെന്ന് വ്യക്തമാക്കുന്നില്ല. ‘ഇടപെട്ടു’ എന്നത് ആലോചന, ഉപയോഗം, പരിപോഷണം തുടങ്ങിയ സാധ്യതകളെ അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘തീയിലൂടെ കടത്തി’ എന്ന മൂലപ്രയോഗവും ‘പെരുപ്പിച്ചു’ എന്ന വർധനാഭാവവും ഉദ്ദേശപൂർവം നിലനിർത്തി. occult പദങ്ങൾക്ക് അത്യന്തം സാങ്കേതികമോ പ്രത്യേക മതവിഭാഗപരമോ ആയ ഭാഷ ഒഴിവാക്കി.
