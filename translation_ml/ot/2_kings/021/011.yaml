  text: יַעַן֩ אֲשֶׁ֨ר עָשָׂ֜ה מְנַשֶּׁ֤ה מֶֽלֶךְ יְהוּדָה֙ הַ/תֹּעֵב֣וֹת הָ/אֵ֔לֶּה הֵרַ֕ע מִ/כֹּ֛ל אֲשֶׁר עָשׂ֥וּ הָ/אֱמֹרִ֖י אֲשֶׁ֣ר לְ/פָנָ֑י/ו וַ/יַּחֲטִ֥א גַֽם אֶת יְהוּדָ֖ה בְּ/גִלּוּלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/011.yaml
  text: Because Manasseh king of Judah has done these abominations[a], and has done more evil than all the Amorites who were before him did, and has also caused Judah to sin with his idols,
translation:
  language: ml
  text: “യെഹൂദാരാജാവായ മനശ്ശെ വെറുക്കത്തക്ക ഈ പ്രവൃത്തികൾ ചെയ്തതിനാലും, തനിക്കുമുമ്പുണ്ടായിരുന്ന അമോര്യർ ചെയ്ത എല്ലാറ്റിനെക്കാളും അധികം തിന്മ പ്രവർത്തിച്ചതിനാലും, തന്റെ വിഗ്രഹങ്ങൾകൊണ്ട്[a] യെഹൂദയെയും പാപം ചെയ്യിച്ചതിനാലും,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിഗ്രഹങ്ങൾ” എന്നതിനുള്ള എബ്രായപദം നിന്ദാസൂചകമാണ്; “അശുദ്ധവിഗ്രഹങ്ങൾ” എന്നോ, കൂടുതൽ തീവ്രമായി, “ചാണക-വിഗ്രഹങ്ങൾ” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: ചെയ്തതുകൊണ്ടും
  rationale: അടുത്ത വാക്യത്തിൽ പ്രസ്താവിക്കുന്ന ന്യായവിധിയുടെ കാരണങ്ങൾ ഇവിടെ നിരത്തുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ കാരണാർഥക ഘടന ഉപയോഗിച്ചു. വാക്യം തുടരുമെന്ന സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: מְנַשֶּׁה מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ മനശ്ശെ
  rationale: രാജപദവിയെയും വ്യക്തിനാമത്തെയും സ്വാഭാവികമായ മലയാള പ്രയോഗത്തിൽ ചേർത്തു.
- source_word: הַתֹּעֵבוֹת הָאֵלֶּה
  choice: ഈ മ്ലേച്ഛകാര്യങ്ങൾ
  rationale: തീവ്രമായ ധാർമ്മിക-ആരാധനാപര വെറുപ്പ് സൂചിപ്പിക്കുന്ന תּוֹעֵבָהയുടെ ഭാരം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം നിലനിർത്തുന്നു.
- source_word: הֵרַע מִכֹּל אֲשֶׁר עָשׂוּ
  choice: ചെയ്ത എല്ലാറ്റിനെക്കാളും അധികം തിന്മ പ്രവർത്തിച്ചു
  rationale: ഹിഫീൽ ക്രിയയുടെ ‘തിന്മ പ്രവർത്തിക്കുക’ എന്ന അർഥവും מִן സൂചിപ്പിക്കുന്ന താരതമ്യവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യർ
  rationale: ഏകവചനരൂപത്തിലുള്ള ജനനാമം ഇവിടെ സമൂഹവാചകമായതിനാൽ മലയാളത്തിൽ ബഹുവചനമായി നൽകി.
- source_word: אֲשֶׁר לְפָנָיו
  choice: തനിക്കുമുമ്പുണ്ടായിരുന്ന
  rationale: മനശ്ശെയ്ക്കു മുമ്പ് ദേശത്തുണ്ടായിരുന്ന ജനത്തെ സൂചിപ്പിക്കുന്ന കാലപരമായ അർഥം, അനാവശ്യ വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיַּחֲטִא גַם אֶת יְהוּדָה
  choice: യെഹൂദയെയും പാപം ചെയ്യിച്ചു
  rationale: 'חטאയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു: യെഹൂദ പാപം ചെയ്തു എന്നതിലുപരി മനശ്ശെ അവരെ പാപം ചെയ്യിച്ചു.'
- source_word: בְּגִלּוּלָיו
  choice: തന്റെ വിഗ്രഹങ്ങൾകൊണ്ട്
  rationale: בְּയുടെ ഉപകരണാർഥം ‘കൊണ്ട്’ എന്നതിലൂടെ വ്യക്തമാക്കി; അടിസ്ഥാന അർഥം മുഖ്യപാഠത്തിൽ നൽകി, ഹീബ്രു പദത്തിന്റെ നിന്ദാസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: גִּלּוּלִים എന്ന പദത്തിന്റെ നിന്ദാസൂചന
  choice: വിഗ്രഹങ്ങൾ
  alternative: അശുദ്ധവിഗ്രഹങ്ങൾ; ചാണകവിഗ്രഹങ്ങൾ
  rationale: മുഖ്യപാഠത്തിൽ വ്യക്തവും മാന്യവുമായ സാധാരണ പദം ഉപയോഗിച്ചു; മൂലപദത്തിലെ ശക്തമായ അവഹേളനഭാവം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി, അതിനെ മൃദൂകരിക്കാതെയും മുഖ്യപാഠത്തിൽ അതിവ്യാഖ്യാനം വരുത്താതെയും സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രവാചക കുറ്റാരോപണശൈലി. അടുത്ത വാക്യത്തിലെ ന്യായവിധിയിലേക്കു നീളുന്ന കാരണവാക്യമായതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം കോമ നിലനിർത്തി.
