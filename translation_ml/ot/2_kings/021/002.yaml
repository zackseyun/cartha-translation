id: 2KI.21.2
reference: 2 Kings 21:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: ml
  text: യഹ്‌വെ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന് പുറത്താക്കിയ ജനതകളുടെ വെറുക്കത്തക്ക ആചാരങ്ങൾക്കനുസരിച്ച്[a], അവൻ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജനതകളുടെ വെറുക്കത്തക്ക ആചാരങ്ങൾപോലെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: അവൻ ... തിന്മയായതു ചെയ്തു
  rationale: עשה הרע എന്ന സ്ഥിരപ്രയോഗം അക്ഷരാർഥത്തിലുള്ള ‘തിന്മ ചെയ്തു’ എന്നതിലുപരി ‘തിന്മയായതു ചെയ്തു’ എന്ന ദൈവിക വിലയിരുത്തലാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായും ആ ആശയം നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ‘യഹ്‌വെയുടെ കണ്ണുകളിൽ’ എന്ന വാക്കുതോറുമുള്ള രൂപത്തിനു പകരം ദൈവിക വിലയിരുത്തൽ വ്യക്തമാക്കുന്ന, എന്നാൽ കാഴ്ചയുടെ രൂപകം ഭാഗികമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כְּתוֹעֲבֹת
  choice: വെറുക്കത്തക്ക ആചാരങ്ങൾക്കനുസരിച്ച്
  rationale: תועבות എന്നത് ഇവിടെ ജാതികളുടെ മതപരവും ധാർമികവുമായ നിന്ദ്യപ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു. ‘ആചാരങ്ങൾ’ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; כְ എന്ന ഉപസർഗത്തിന്റെ അനുരൂപതാബോധം ‘അനുസരിച്ച്’ നൽകുന്നു.
- source_word: הַגּוֹיִם
  choice: ജനതകൾ
  rationale: ഈ ചരിത്രസന്ദർഭത്തിൽ ഇസ്രായേലേതര ദേശജനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ജനതകൾ’ അനാവശ്യ മതവിഭാഗാർഥം വരുത്താതെ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: הוֹרִישׁ
  choice: പുറത്താക്കിയ
  rationale: ירש എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ അവകാശം നഷ്ടപ്പെടുത്തി ദേശത്തുനിന്ന് നീക്കുക എന്നർഥത്തിലാണ്; ‘പുറത്താക്കിയ’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִפְּנֵי
  choice: മുമ്പിൽനിന്ന്
  rationale: എബ്രായപ്രയോഗത്തിലെ ‘അവരുടെ മുമ്പിൽനിന്ന്/സാന്നിധ്യത്തിൽനിന്ന്’ എന്ന സ്ഥലബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഘടനയുടെ കുടുംബബന്ധസൂചന നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ പതിവും സ്വാഭാവികവുമായ രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് നൽകുന്നത്. അതിനാൽ ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു; പരമ്പരാഗത സ്വരരൂപം നിർബന്ധിച്ച് അടിച്ചേൽപ്പിച്ചില്ല.
- issue: כְּתוֹעֲבֹת എന്നതിലെ താരതമ്യമോ അനുരൂപതയോ
  choice: വെറുക്കത്തക്ക ആചാരങ്ങൾക്കനുസരിച്ച്
  alternative: ജനതകളുടെ വെറുക്കത്തക്ക ആചാരങ്ങൾപോലെ
  rationale: כְ എന്നത് ‘പോലെ’ എന്ന താരതമ്യവും ‘അനുസരിച്ച്’ എന്ന പെരുമാറ്റാനുരൂപതയും അനുവദിക്കുന്നു. മുഖ്യപാഠത്തിൽ സന്ദർഭത്തിന് യോജിച്ച അനുരൂപത തിരഞ്ഞെടുത്തു; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കൂട്ടനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വംശബന്ധപരമായ പ്രയോഗം പൂർണമായി ലിംഗനിരപേക്ഷമാക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക കൂട്ടനാമത്തിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. രാജാക്കന്മാരിലെ ദൈവിക വിലയിരുത്തൽ സൂത്രവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. ദുഷ്കരമായ സംസ്കൃതപദങ്ങൾ ഒഴിവാക്കി, ‘ദൃഷ്ടിയിൽ’ പോലുള്ള പരിചിതമായ തിരുവെഴുത്തുശൈലി മാത്രം സ്വാഭാവികതയ്ക്കായി ഉപയോഗിച്ചു.
