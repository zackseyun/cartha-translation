translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രാജഭരണവിവരത്തിന്റെ സൂത്രഘടന നിലനിർത്തിയെങ്കിലും അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി. ഇംഗ്ലീഷ് കരടിൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘ഭരണം ആരംഭിച്ചു’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് ഹെഫ്സീബാ എന്ന പേരിന്റെ അർഥത്തെക്കുറിച്ചായതിനാൽ ചിഹ്നം ആ പേരിനോടു ചേർത്തു.
