language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בֶּן שְׁתֵּ֨ים עֶשְׂרֵ֤ה שָׁנָה֙ מְנַשֶּׁ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֥ם אִמּ֖/וֹ חֶפְצִי בָֽהּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
translation:
  language: ml
  text: മനശ്ശെ രാജാവായപ്പോൾ അവന് പന്ത്രണ്ടു വയസ്സായിരുന്നു. അവൻ യെരൂശലേമിൽ അമ്പത്തഞ്ചു വർഷം ഭരിച്ചു. അവന്റെ അമ്മയുടെ പേര് ഹെഫ്സീബാ[a] എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹെഫ്സീബാ എന്ന പേരിന്റെ ഏകദേശ അർഥം: “എന്റെ ആനന്ദം അവളിലാണ്.”'
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: അവന് പന്ത്രണ്ടു വയസ്സായിരുന്നു
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: ഭരണം ആരംഭിച്ച സമയത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: מְנַשֶּׁה
  choice: മനശ്ശെ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന് മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: അമ്പത്തഞ്ചു വർഷം
  rationale: എബ്രായത്തിലെ ‘അമ്പതും അഞ്ചും’ എന്ന സംയുക്തസംഖ്യ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: രാജകീയ ഭരണത്തെ സൂചിപ്പിക്കുന്ന מלך എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ മലയാള തുല്യപദം.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലസൂചകമായ ב എന്ന ഉപസർഗവും സ്ഥലനാമവും നേരിട്ട് മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് … എന്നായിരുന്നു
  rationale: എബ്രായ അറിയിപ്പുസൂത്രത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാള വാക്യഘടന ഉപയോഗിക്കുന്നു.
- source_word: חֶפְצִי בָהּ
  choice: ഹെഫ്സീബാ
  rationale: പേരിനെ പരിഭാഷപ്പെടുത്താതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തവിധം ലിപ്യന്തരം ചെയ്യുന്നു; പേരിന്റെ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
