  text: וְ/לֹ֣א אֹסִ֗יף לְ/הָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לַֽ/אֲבוֹתָ֑/ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת כְּ/כֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔י/ם וּ/לְ/כָל הַ֨/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה אֹתָ֖/ם עַבְדִּ֥/י מֹשֶֽׁה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
translation:
  language: ml
  text: ഞാൻ അവരുടെ പിതാക്കന്മാർക്കു[b] നൽകിയ ദേശത്തുനിന്ന് ഇസ്രായേലിന്റെ കാൽ വീണ്ടും അലഞ്ഞുപോകാൻ ഇടയാക്കുകയില്ല[a]—ഞാൻ അവരോടു കല്പിച്ചതൊക്കെയും, എന്റെ ദാസനായ മോശ അവരോടു കല്പിച്ച ന്യായപ്രമാണം[c] മുഴുവനും അനുസരിച്ച് പ്രവർത്തിക്കാൻ അവർ ശ്രദ്ധിച്ചാൽ മാത്രം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഇസ്രായേലിന്റെ കാൽ അലഞ്ഞുപോകാൻ ഇടയാക്കുക.’ ‘ഇസ്രായേലിനെ ദേശത്തുനിന്ന് നീക്കുക’ എന്നും അർഥമാക്കാം; മൂലപാഠം സ്ഥാനചലനത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പിതാക്കന്മാർ’ എന്നത് ഇസ്രായേലിന്റെ പൂർവപിതാക്കളെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ പ്രയോഗമാണ്; ‘പൂർവികർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘ന്യായപ്രമാണം’ എന്നതിന് ‘ഉപദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ മോശയിലൂടെ കല്പിക്കപ്പെട്ട തോറായെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹסִיף
  choice: ഇനി ... ഇടയാക്കുകയില്ല
  rationale: לֹא + יסף എന്ന പ്രയോഗം ഒരു പ്രവൃത്തി വീണ്ടും ചെയ്യുകയില്ലെന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘ഇനി ... ഇല്ല’ സ്വാഭാവികമായി ആ ഭാവം പ്രകടിപ്പിക്കുന്നു.
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ കാൽ ... അലഞ്ഞുപോകാൻ ഇടയാക്കുക
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘കാൽ’ എന്ന ദൃശ്യരൂപവും നിർബന്ധിത സ്ഥാനചലനത്തിന്റെ ആശയവും നിലനിർത്തുന്നു; ‘നീക്കിക്കളയുക’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷയിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: הָאֲדָמָה
  choice: ദേശം
  rationale: പിതാക്കന്മാർക്കു നൽകിയ ഉടമ്പടിദേശമാണ് സന്ദർഭം; അതിനാൽ ‘മണ്ണ്’ എന്നതിനെക്കാൾ ‘ദേശം’ യോജിക്കുന്നു.
- source_word: נָתַתִּי לַאֲבוֹתָם
  choice: അവരുടെ പിതാക്കന്മാർക്കു നൽകിയ
  rationale: ‘പിതാക്കന്മാർ’ എന്നത് ഇസ്രായേലിന്റെ പൂർവപിതാക്കളെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: רַק אִם
  choice: ശ്രദ്ധിച്ചാൽ മാത്രം
  rationale: നിബന്ധനയുടെ നിയന്ത്രകശക്തി വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: ചെയ്യാൻ അവർ ശ്രദ്ധിച്ചാൽ
  rationale: שמר + infinitive എന്നത് ജാഗ്രതയോടെ അനുഷ്ഠിക്കുക എന്ന ആശയം നൽകുന്നു; ‘ശ്രദ്ധിക്കുക’ ആ അർഥഘടകം സൂക്ഷിക്കുന്നു.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִים
  choice: ഞാൻ അവരോടു കല്പിച്ചതൊക്കെയും ... അനുസരിച്ച്
  rationale: כְּ എന്ന അനുരൂപതാസൂചകത്തിന്റെ ‘അനുസരിച്ച്’ എന്ന അർഥവും കല്പനകളുടെ സമഗ്രതയും പ്രകടമാക്കുന്നു.
- source_word: וּלְכָל הַתּוֹרָה
  choice: ന്യായപ്രമാണം മുഴുവനും അനുസരിച്ച്
  rationale: മോശയിലൂടെ നൽകിയ תּוֹרָהയെ ഈ ഉടമ്പടിസന്ദർഭത്തിൽ ‘ന്യായപ്രമാണം’ എന്നു നൽകുന്നു; ‘ഉപദേശം’ എന്ന വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַבְדִּי מֹשֶׁה
  choice: എന്റെ ദാസനായ മോശ
  rationale: ബഹുമാനസൂചകമായ മൂലപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദേശത്ത് ഇസ്രായേൽ തുടർന്നിരിക്കാനുള്ള നിബന്ധന
  choice: ദൈവത്തിന്റെ കല്പനകളും മോശയുടെ ന്യായപ്രമാണവും ശ്രദ്ധയോടെ അനുഷ്ഠിക്കുന്നത് യഥാർഥ നിബന്ധനയായി അവതരിപ്പിച്ചു.
  alternative: നിബന്ധനയെ വെറും വാചാടോപമായി കാണുക, അല്ലെങ്കിൽ നിരുപാധിക വാഗ്ദാനവുമായി പൊരുത്തപ്പെടുത്താൻ അതിന്റെ ശക്തി മൃദുവാക്കുക.
  rationale: רַק אִם വ്യക്തമായ നിയന്ത്രിത നിബന്ധനയാണ്. നിരുപാധിക വാഗ്ദാനപരമ്പരകളുമായുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഭാഷ സ്വയം പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ ഏകവചന ദൃശ്യപ്രയോഗമായ ‘ഇസ്രായേലിന്റെ കാൽ’ സംരക്ഷിച്ചു. ദീർഘവാക്യത്തിന്റെ ബന്ധം വ്യക്തമാക്കാൻ ഡാഷ് ഉപയോഗിച്ചു; അടിക്കുറിപ്പുകളുടെ ക്രമം അവ സൂചിപ്പിക്കുന്ന പദങ്ങളോട് ചേർത്തു.
