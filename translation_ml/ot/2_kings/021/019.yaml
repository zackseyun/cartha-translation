  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. രാജവാഴ്ചയുടെ ഔപചാരിക സൂത്രവാക്യത്തെ പദാനുപദമായി കടുപ്പിക്കാതെ അതിന്റെ മുഴുവൻ വിവരവും ക്രമവും നിലനിർത്തിയിരിക്കുന്നു.
