  yaml_path: translation/ot/2_kings/021/019.yaml
  text: Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem. His mother’s name was Meshullemeth daughter of Haruz, from Jotbah.
translation:
  language: ml
  text: ആമോൻ രാജാവായപ്പോൾ അവന് ഇരുപത്തിരണ്ടു വയസ്സായിരുന്നു. അവൻ യെരൂശലേമിൽ രണ്ടു വർഷം ഭരിച്ചു. അവന്റെ അമ്മയുടെ പേര് മെശുല്ലെമെത്ത് എന്നായിരുന്നു; അവൾ യൊത്ബായിൽനിന്നുള്ള ഹാരൂസിന്റെ മകളായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: അവന് ഇരുപത്തിരണ്ടു വയസ്സായിരുന്നു
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയെ സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: രാജ്യാരോഹണസമയം സൂചിപ്പിക്കുന്ന בְ + infinitive construct എന്ന ഘടനയെ മലയാളത്തിലെ സ്വാഭാവിക കാലപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: രാജത്വം പ്രയോഗിച്ചു എന്ന ക്രിയാർഥം കൃത്യമായി നൽകുന്ന സാധാരണ മലയാളപദം.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലസൂചന മലയാളത്തിലെ -ഇൽ വിഭക്തിയിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് ... എന്നായിരുന്നു
  rationale: വംശാവലിസംബന്ധമായ അറിയിപ്പ് സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: מְשֻׁלֶּמֶת
  choice: മെശുല്ലേമെത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ കഴിയുന്നത്ര അടുപ്പത്തോടെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בַּת חָרוּץ
  choice: ഹാരൂസിന്റെ മകൾ
  rationale: പിതൃബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: מִן יָטְבָה
  choice: യൊത്ബയിൽനിന്നുള്ള
  rationale: מִן സൂചിപ്പിക്കുന്ന ഉത്ഭവസ്ഥലത്തെ വ്യക്തമായി നിലനിർത്തുന്നു; സ്ഥലനാമം എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്യുന്നു.
