  text: וַ/יִּשְׁכַּ֤ב מְנַשֶּׁה֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר בְּ/גַן בֵּית֖/וֹ בְּ/גַן עֻזָּ֑א וַ/יִּמְלֹ֛ךְ אָמ֥וֹן בְּנ֖/וֹ תַּחְתָּֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
translation:
  language: ml
  text: മനശ്ശെ തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു[a]. അവനെ അവന്റെ വീട്ടിലെ തോട്ടത്തിൽ, ഉസ്സയുടെ തോട്ടത്തിൽ, അടക്കം ചെയ്തു. അവന്റെ മകനായ ആമോൻ അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘തന്റെ പിതാക്കന്മാരോടൊപ്പം കിടന്നു’; രാജാവിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു
  rationale: രാജാവിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗം സംരക്ഷിക്കുന്നു; വെറും ‘മരിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, ആധുനിക മലയാളത്തിൽ മാന്യവും ഗ്രാഹ്യവുമായ രൂപം ഉപയോഗിച്ചു.
- source_word: וַיִּקָּבֵר
  choice: അടക്കം ചെയ്തു
  rationale: എബ്രായ നിഫാൽ രൂപത്തിന്റെ നിർജീവാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּגַן בֵּיתוֹ
  choice: അവന്റെ വീട്ടിലെ തോട്ടത്തിൽ
  rationale: בַּיִת എന്നത് ഇവിടെ ‘വീട്’ എന്നുതന്നെ പരിഭാഷപ്പെടുത്തി; രാജവസതി ഉദ്ദേശിച്ചിരിക്കാമെങ്കിലും മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘അരമന’ എന്ന വിശേഷണം ചേർത്തില്ല.
- source_word: בְּגַן עֻזָּא
  choice: ഉസ്സയുടെ തോട്ടത്തിൽ
  rationale: ആദ്യത്തെ സ്ഥലവിവരണത്തെ കൂടുതൽ തിരിച്ചറിയിക്കുന്ന ആവർത്തിത പ്രയോഗം നിലനിർത്തി; പേരിനെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: ഈ പിന്തുടർച്ചാസൂത്രത്തിൽ ക്രിയ ഭരണകാലത്തെക്കാൾ രാജസ്ഥാനാരോഹണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: മുൻഗാമിയുടെ സ്ഥാനം ഏറ്റെടുത്തുള്ള രാജവംശപരമായ പിന്തുടർച്ച സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
