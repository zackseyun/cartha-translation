  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ രാജമരണസൂത്രവും സ്ഥലനാമത്തിന്റെ ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തി.
