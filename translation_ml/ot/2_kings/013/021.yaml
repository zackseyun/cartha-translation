  source_fidelity: 'ഹീബ്രു സംഭവക്രമം കൃത്യമായി പിന്തുടരുന്നു: അടക്കത്തിനിടയിൽ കൊള്ളസംഘത്തെ കാണുന്നു, മൃതദേഹം എലീശയുടെ കല്ലറയിലേക്കു എറിയുന്നു, മനുഷ്യൻ എലീശയുടെ അസ്ഥികളിൽ തൊടുന്നു, ജീവൻ പ്രാപിച്ച് സ്വന്തം കാലിൽ എഴുന്നേൽക്കുന്നു. וַיֵּלֶךְ וַיִּגַּע എന്ന അസാധാരണമായ ‘ചെന്നു ... തൊട്ടപ്പോൾ’ ഘടനയും ഒഴിവാക്കാതെ സൂക്ഷിച്ചിരിക്കുന്നു; ഇംഗ്ലീഷ് POB audit trail-ലുമുള്ള ‘went and touched’ എന്ന തീരുമാനത്തോടു യോജിക്കുന്നു.'
