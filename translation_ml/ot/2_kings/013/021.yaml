  text: וַ/יְהִ֞י הֵ֣ם קֹבְרִ֣ים אִ֗ישׁ וְ/הִנֵּה֙ רָא֣וּ אֶֽת הַ/גְּד֔וּד וַ/יַּשְׁלִ֥יכוּ אֶת הָ/אִ֖ישׁ בְּ/קֶ֣בֶר אֱלִישָׁ֑ע וַ/יֵּ֜לֶךְ וַ/יִּגַּ֤ע הָ/אִישׁ֙ בְּ/עַצְמ֣וֹת אֱלִישָׁ֔ע וַ/יְחִ֖י וַ/יָּ֥קָם עַל רַגְלָֽי/ו׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: ml
  text: അവർ ഒരാളെ അടക്കം ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ, അതാ, ഒരു കൊള്ളസംഘത്തെ കണ്ടു. അതിനാൽ അവർ ആ മനുഷ്യനെ എലീശയുടെ കല്ലറയിലേക്ക് എറിഞ്ഞു. ആ മനുഷ്യൻ ചെന്നു എലീശയുടെ അസ്ഥികളിൽ തൊട്ടപ്പോൾ, അയാൾ ജീവൻ പ്രാപിച്ച് സ്വന്തം കാലിൽ എഴുന്നേറ്റുനിന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגְּדוּד
  choice: ഒരു കൊള്ളസംഘം
  rationale: ശത്രുപ്രദേശത്ത് ആക്രമണവും കൊള്ളയും നടത്തുന്ന സായുധസംഘത്തെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: וַיַּשְׁלִיכוּ
  choice: എറിഞ്ഞു
  rationale: മൂലപദത്തിലെ പെട്ടെന്നുള്ളതും ശക്തവുമായ പ്രവൃത്തിയെ മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ וַיִּגַּע
  choice: ചെന്നു ... തൊട്ടപ്പോൾ
  rationale: വയേലെഖ് എന്ന ക്രിയയെ ഒഴിവാക്കാതെ 'ചെന്നു' എന്നു നിലനിർത്തുന്നു; തുടർന്നുള്ള സ്പർശത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וַיְחִי
  choice: ജീവൻ പ്രാപിച്ച്
  rationale: മരിച്ച മനുഷ്യൻ വീണ്ടും ജീവനിലേക്കു വന്നുവെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיָּקָם עַל רַגְלָיו
  choice: സ്വന്തം കാലിൽ എഴുന്നേറ്റുനിന്നു
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യതയും പൂർണമായ ശാരീരിക പുനരുജ്ജീവനത്തിന്റെ വിവരണവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: എലീശയുടെ അസ്ഥികളുമായുള്ള സമ്പർക്കവും ജീവൻ പ്രാപിക്കലും തമ്മിലുള്ള ബന്ധം
  choice: 'സംഭവക്രമം മാത്രം നേരിട്ട് പ്രസ്താവിച്ചു: അസ്ഥികളിൽ തൊട്ടപ്പോൾ അയാൾ ജീവൻ പ്രാപിച്ചു'
  alternative: അസ്ഥികൾ തന്നെയാണ് ജീവൻ നൽകിയതെന്നോ, ദൈവം പ്രത്യേകം ഇടപെട്ടുവെന്നോ വിശദീകരിച്ച് വിവർത്തനം ചെയ്യുക
  rationale: മൂലവാക്യം കാരണം സംബന്ധിച്ച ദൈവശാസ്ത്ര വിശദീകരണം നൽകാതെ സംഭവങ്ങൾ വിവരിക്കുന്നു; അതിനാൽ വിവർത്തനം അതിലപ്പുറം പോകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള 'വ-' ഘടനകൾ മലയാളത്തിലെ സ്വാഭാവിക സംഭവക്രമമായി അവതരിപ്പിച്ചെങ്കിലും 'അതാ' എന്ന ശ്രദ്ധാകർഷക പ്രയോഗം നിലനിർത്തി.
