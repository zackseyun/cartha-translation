  yaml_path: translation/ot/2_kings/013/002.yaml
  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
translation:
  language: ml
  text: അവൻ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു. ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച നെബാത്തിന്റെ മകനായ യൊരോബെയാമിന്റെ പാപങ്ങളെ അവൻ പിന്തുടർന്നു; അവയിൽനിന്ന് അവൻ വിട്ടുമാറിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അതിൽനിന്ന് അവൻ വിട്ടുമാറിയില്ല.” എബ്രായപാഠത്തിലെ പ്രത്യയം സ്ത്രീലിംഗ ഏകവചനമാണ്; അത് യൊരോബെയാമിന്റെ പാപരീതിയെ സമാഹാരമായി സൂചിപ്പിക്കുന്നതാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה
  choice: അവൻ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്തു
  rationale: രാജാക്കന്മാരുടെ പുസ്തകത്തിലെ സ്ഥിരമായ ധാർമിക വിലയിരുത്തൽ സൂത്രവാക്യം സ്വാഭാവികവും ഔപചാരിക ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവായ വ്യക്തിനാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיֵּלֶךְ אַחַר
  choice: പിന്തുടർന്നു
  rationale: അക്ഷരാർഥത്തിലെ ‘പിന്നാലെ നടന്നു’ എന്ന രൂപകത്തിന്റെ ആശയം—ഒരു മാതൃകയോ വഴിയോ അനുസരിക്കുക—ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: חַטֹּאת יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകനായ യൊരോബെയാമിന്റെ പാപങ്ങൾ
  rationale: ബഹുവചനമായ ‘പാപങ്ങൾ’ നിലനിർത്തുകയും എബ്രായ പിതൃനാമഘടന വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകഭാവം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: לֹא סָר מִמֶּנָּה
  choice: അവയിൽനിന്ന് അവൻ വിട്ടുമാറിയില്ല
  rationale: סור എന്നതിന്റെ ‘വിട്ടുമാറുക’ എന്ന ആശയം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ യൊരോബെയാമിന്റെ പാപങ്ങളെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന സർവനാമം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം ഉപയോഗിച്ചു.
- issue: מִמֶּנָּה എന്ന സ്ത്രീലിംഗ ഏകവചന പ്രത്യയത്തിന്റെ സൂചന
  choice: അവയിൽനിന്ന്
  alternative: അതിൽനിന്ന്
  rationale: എബ്രായത്തിൽ പ്രത്യയം സ്ത്രീലിംഗ ഏകവചനമാണെങ്കിലും, അത് യൊരോബെയാമിന്റെ പാപരീതിയെ സമാഹാരമായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം. മലയാളത്തിൽ അടുത്തുള്ള ബഹുവചനമായ ‘പാപങ്ങൾ’ എന്നതിലേക്ക് വ്യക്തമായി ചൂണ്ടാൻ ‘അവയിൽനിന്ന്’ ഉപയോഗിച്ചു; ഔപചാരിക ഏകവചനരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. രാജകീയ വിലയിരുത്തൽ സൂത്രവാക്യത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തിയപ്പോൾ ‘പിന്തുടർന്നു’, ‘വിട്ടുമാറിയില്ല’ തുടങ്ങിയ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗങ്ങൾ തെരഞ്ഞെടുത്തു.
