  text: אַ֠ךְ לֹֽא סָ֜רוּ מֵ/חַטֹּ֧אות בֵּית יָרָבְעָ֛ם אֲשֶׁר החטי אֶת יִשְׂרָאֵ֖ל בָּ֣/הּ הָלָ֑ךְ וְ/גַם֙ הָ/אֲשֵׁרָ֔ה עָמְדָ֖ה בְּ/שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
translation:
  language: ml
  text: എന്നിട്ടും അവർ യൊരോബെയാമിന്റെ ഗൃഹത്തിന്റെ പാപങ്ങളിൽനിന്ന് വിട്ടുമാറിയില്ല—അവയാൽ അവൻ ഇസ്രായേലിനെ പാപം ചെയ്യിച്ചു; അതിൽ അവൻ നടന്നു. അശേരപോലും[a] ശമര്യയിൽ നിലകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശേരാസ്തംഭം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം കനാന്യദേവിയായ അശേരയെയോ—ഇവിടെ കൂടുതൽ സാദ്ധ്യതയുള്ളതുപോലെ—അവളുടെ ആരാധനയുമായി ബന്ധപ്പെട്ട ഒരു പ്രതിഷ്ഠിത വസ്തുവെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എന്നിട്ടും
  rationale: മുൻസന്ദർഭത്തിലെ വിടുതലിനും തുടർന്ന പാപത്തിനും ഇടയിലെ വിരോധാത്മകമായ ഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא סָרוּ מֵחַטֹּאות
  choice: പാപങ്ങളിൽനിന്ന് വിട്ടുമാറിയില്ല
  rationale: מִן സഹിതമുള്ള סור എന്ന ക്രിയയുടെ ‘ഒന്നിൽനിന്ന് മാറുക/ഉപേക്ഷിക്കുക’ എന്ന ധാർമിക അർഥവും ബഹുവചനമായ ‘പാപങ്ങൾ’ എന്ന രൂപവും നിലനിർത്തുന്നു.
- source_word: בֵּית יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ ഗൃഹം
  rationale: ‘വംശം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, യൊരോബെയാമുമായി ബന്ധപ്പെട്ട വംശപരവും മതപരവുമായ പാരമ്പര്യം ഉൾക്കൊള്ളാവുന്ന എബ്രായ പ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר החטי אֶת יִשְׂרָאֵל
  choice: അവയാൽ അവൻ ഇസ്രായേലിനെ പാപം ചെയ്യിച്ചു
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥം വ്യക്തമായി നൽകുന്നു; ‘അവയാൽ’ എന്നത് പാപങ്ങളെയോ അവയുടെ സമഗ്രമായ പാപരീതിയെയോ സൂചിപ്പിക്കാവുന്ന ഉപകരണഭാവം സംരക്ഷിക്കുന്നു.
- source_word: בָּהּ הָלָךְ
  choice: അവയിൽത്തന്നെ അവൻ നടന്നു
  rationale: ‘നടക്കുക’ എന്ന ജീവിതശൈലി സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു; എബ്രായത്തിലെ ഏകവചന പ്രത്യയം പാപരീതിയെ സമാഹാരമായി സൂചിപ്പിക്കാമെങ്കിലും മലയാളത്തിൽ മുൻപുള്ള ബഹുവചനത്തോട് സ്വാഭാവികമായി പൊരുത്തപ്പെടുത്തുന്നു.
- source_word: הָאֲשֵׁרָה
  choice: അശേര
  rationale: ദേവിയെയോ അവളുടെ ആരാധനയുമായി ബന്ധപ്പെട്ട പ്രതിഷ്ഠിത വസ്തുവെയോ സൂചിപ്പിക്കാവുന്ന എബ്രായപദത്തിന്റെ യഥാർത്ഥ അനിശ്ചിതത്വം പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָמְדָה בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ നിലകൊണ്ടു
  rationale: ‘നിന്നു/നിലനിന്നു’ എന്ന ദൃശ്യവും തുടർന്ന സാന്നിധ്യവും ഒരുപോലെ പ്രകടമാക്കുന്ന സ്വാഭാവിക മലയാളം.
theological_decisions:
- issue: הָאֲשֵׁרָה എന്നതിന്റെ സൂചന
  choice: പ്രധാനവാചകത്തിൽ ‘അശേര’ എന്ന് ലിപ്യന്തരണം ചെയ്തു; അടിക്കുറിപ്പിൽ സാദ്ധ്യമായ അർഥങ്ങൾ വിശദീകരിച്ചു.
  alternative: ‘അശേരാദേവി’, ‘അശേരാസ്തംഭം’, അല്ലെങ്കിൽ ‘വിശുദ്ധസ്തംഭം’ എന്നു നിർണ്ണയിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ‘ശമര്യയിൽ നിലകൊണ്ടു’ എന്ന പ്രസ്താവന ആരാധനാവസ്തുവിനെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും പദത്തിന് ദേവിയെയും അവളുമായി ബന്ധപ്പെട്ട ആരാധനാചിഹ്നത്തെയും സൂചിപ്പിക്കാൻ കഴിയുന്നതിനാൽ പ്രധാനവാചകം അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- issue: בָּהּ הָלָךְ എന്ന ഏകവചന ക്രിയയിലെ കർത്താവ്
  choice: ‘അവൻ നടന്നു’ എന്ന് ഏകവചനത്തിൽ നിലനിർത്തി.
  alternative: സന്ദർഭാനുസൃതമായി ‘അവർ നടന്നു’ എന്ന് ബഹുവചനമാക്കുക.
  rationale: മസൊററ്റിക് വാചകത്തിലെ הָלָךְ വ്യക്തമായി ഏകവചനമാണ്; അതിനാൽ പാഠത്തിലെ വ്യാകരണപരമായ സംഘർഷം തിരുത്താതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഗൃഹം’, ‘നടന്നു’ എന്നീ ബൈബിൾരൂപകങ്ങൾ ഉറവിടത്തിന്റെ രൂപവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കാൻ നിലനിർത്തി; കൃത്രിമമായ പഴയ ഭാഷ ഒഴിവാക്കി.
