- from: എന്നിട്ടും അവർ യൊരോബെയാമിന്റെ ഗൃഹത്തിന്റെ പാപങ്ങളിൽനിന്ന് വിട്ടുമാറിയില്ല—അവയാൽ അവൻ ഇസ്രായേലിനെ പാപം ചെയ്യിച്ചു; അവയിൽത്തന്നെ അവൻ നടന്നു. അശേരയും[a] ശമര്യയിൽ നിലകൊണ്ടു.
  to: എന്നിട്ടും അവർ യൊരോബെയാമിന്റെ ഗൃഹത്തിന്റെ പാപങ്ങളിൽനിന്ന് വിട്ടുമാറിയില്ല—അവയാൽ അവൻ ഇസ്രായേലിനെ പാപം ചെയ്യിച്ചു; അതിൽ അവൻ നടന്നു. അശേരപോലും[a] ശമര്യയിൽ നിലകൊണ്ടിരുന്നു.
