  yaml_path: translation/ot/2_kings/013/001.yaml
  text: In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu began to reign over Israel in Samaria, and he reigned seventeen years.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ അഹസ്യാവിന്റെ മകൻ യോവാശിന്റെ ഇരുപത്തിമൂന്നാം ഭരണവർഷത്തിൽ, യേഹൂവിന്റെ മകൻ യെഹോവാഹാസ് ഇസ്രായേലിന് രാജാവായി ശമര്യയിൽ വാഴ്ച ആരംഭിച്ചു; അവൻ പതിനേഴു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לְיוֹאָשׁ
  choice: യോവാശിന്റെ ഇരുപത്തിമൂന്നാം ഭരണവർഷത്തിൽ
  rationale: ഹീബ്രായ കാലനിർണ്ണയസൂത്രത്തിലെ ‘വർഷത്തിൽ’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഭരണവർഷം’ ഉപയോഗിച്ചു.
- source_word: מָלַךְ ... עַל־יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ ഭരിക്കാൻ തുടങ്ങി
  rationale: രാജാവായി വാഴ്ച ആരംഭിച്ചു എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള ഭരണകാല പ്രസ്താവനയുമായുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: ഭരണകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലനാമം പതിവ് മലയാളരൂപത്തിൽ നൽകി.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: പതിനേഴു വർഷം
  rationale: ഹീബ്രായത്തിലെ ഭരണകാലദൈർഘ്യം നേരിട്ട് വിവർത്തനം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. പേരുകൾ മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു; അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
