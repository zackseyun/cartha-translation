revisions:
- from: 'പിന്നെ അവൻ ഇസ്രായേൽരാജാവിനോട് പറഞ്ഞു: “വില്ലിന്മേൽ കൈ വെക്കുക.” രാജാവ് അങ്ങനെ കൈ വെച്ചു. എലീശാ തന്റെ കൈകൾ രാജാവിന്റെ കൈകളിന്മേൽ വെച്ചു.'
  to: 'പിന്നെ അവൻ ഇസ്രായേൽ രാജാവിനോട് പറഞ്ഞു: “വില്ലിന്മേൽ കൈ വെക്കുക.” രാജാവ് തന്റെ കൈ വില്ലിന്മേൽ വെച്ചു. എലീശാ തന്റെ കൈകൾ രാജാവിന്റെ കൈകളിന്മേൽ വെച്ചു.'
