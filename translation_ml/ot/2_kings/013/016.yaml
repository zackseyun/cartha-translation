  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הַרְכֵּ֤ב יָֽדְ/ךָ֙ עַל הַ/קֶּ֔שֶׁת וַ/יַּרְכֵּ֖ב יָד֑/וֹ וַ/יָּ֧שֶׂם אֱלִישָׁ֛ע יָדָ֖י/ו עַל יְדֵ֥י הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/016.yaml
  text: Then he said to the king of Israel[a], “Put your hand on the bow.” So he put his hand on it, and Elisha laid his hands on the king’s hands.
translation:
  language: ml
  text: 'പിന്നെ അവൻ ഇസ്രായേൽ രാജാവിനോട് പറഞ്ഞു: “വില്ലിന്മേൽ കൈ വെക്കുക.” രാജാവ് തന്റെ കൈ വില്ലിന്മേൽ വെച്ചു. എലീശാ തന്റെ കൈകൾ രാജാവിന്റെ കൈകളിന്മേൽ വെച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְכֵּב
  choice: വെക്കുക
  rationale: רכב എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം ഇവിടെ കൈ വില്ലിന്മേൽ വയ്ക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തോട് അടുത്ത ‘കയറ്റുക’ ഈ സന്ദർഭത്തിൽ അസ്വാഭാവികമായതിനാൽ സ്വാഭാവികമായ ‘വെക്കുക’ തിരഞ്ഞെടുത്തു.
- source_word: יָדְךָ עַל הַקֶּשֶׁת
  choice: വില്ലിന്മേൽ കൈ
  rationale: עַל എന്ന സ്ഥാനബന്ധം വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: וַיַּרְכֵּב יָדוֹ
  choice: രാജാവ് അങ്ങനെ കൈ വെച്ചു
  rationale: എബ്രായത്തിൽ കർത്താവ് സർവനാമത്തിലൂടെ സൂചിതമാണ്; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘രാജാവ്’ വ്യക്തമാക്കി. ആവർത്തിക്കാത്ത ‘വില്ല്’ അനാവശ്യമായി ചേർക്കാതെ ‘അങ്ങനെ’ മുൻ ആജ്ഞയിലേക്കു ചൂണ്ടുന്നു.
- source_word: וַיָּשֶׂם
  choice: വെച്ചു
  rationale: שׂים എന്ന സാധാരണ ക്രിയയുടെ ‘വയ്ക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; പ്രവൃത്തിക്ക് മൂലപാഠത്തിൽ ഇല്ലാത്ത ആചാരപരമായ ഭാവം ചേർക്കുന്നില്ല.
- source_word: יָדָיו עַל יְדֵי הַמֶּלֶךְ
  choice: തന്റെ കൈകൾ രാജാവിന്റെ കൈകളിന്മേൽ
  rationale: എലീശായുടെ ‘കൈകൾ’ എന്ന ബഹുവചനവും രാജാവിന്റെ കൈകളുമായുള്ള സ്ഥാനബന്ധവും ദൃശ്യമായി സംരക്ഷിക്കുന്നു.
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  choice: പിന്നെ അവൻ ഇസ്രായേൽരാജാവിനോട് പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ കഥാക്രമം ‘പിന്നെ’ സ്വാഭാവികമായി നൽകുന്നു; മുൻസന്ദർഭത്തിലെ എലീശായെ ‘അവൻ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: എലീശാ രാജാവിന്റെ കൈകളിന്മേൽ കൈകൾ വെച്ചതിന്റെ പ്രാധാന്യം
  choice: പ്രവൃത്തി വ്യാഖ്യാനമില്ലാതെ നേരിട്ട് വിവരിക്കുക
  alternative: പ്രവാചകീയ ശക്തിപകർച്ചയോ യുദ്ധത്തിലെ ദൈവിക മാർഗനിർദേശമോ എന്നു മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക
  rationale: ഈ വാക്യം പ്രതീകാത്മക പ്രവൃത്തി വിവരിക്കുന്നുവെങ്കിലും അതിന്റെ അർഥം ഇവിടെ തുറന്നു പറയുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘ഇസ്രായേൽരാജാവ്’ എന്ന രൂപം സുതാര്യമായി ഉപയോഗിച്ചു. ഈ കരടിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല; അതിനാൽ മുഖ്യവാചകത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളില്ല.
