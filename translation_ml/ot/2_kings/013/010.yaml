translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ രാജവാഴ്ചാ അറിയിപ്പ്. പേരുകളുടെ എബ്രായ അക്ഷരവ്യത്യാസം മലയാളത്തിലും നിലനിർത്തി. ‘ഭരണവർഷം’ ചേർത്ത് കാലനിർണ്ണയസൂത്രത്തിന്റെ അർഥം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കിയിരിക്കുന്നു.
