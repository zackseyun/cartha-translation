  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֶׁ֨בַע֙ שָׁנָ֔ה לְ/יוֹאָ֖שׁ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ יְהוֹאָ֨שׁ בֶּן יְהוֹאָחָ֤ז עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/010.yaml
  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ യോവാശിന്റെ മുപ്പത്തിയേഴാം ഭരണവർഷത്തിൽ[a], യെഹോവാഹാസിന്റെ മകനായ യെഹോവാശ് ശമര്യയിൽ ഇസ്രായേലിന്റെ രാജാവായി; അവൻ പതിനാറു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പാഠം യെഹൂദാരാജാവിന്റെ പേര് יוֹאָשׁ (യോവാശ്) എന്നും ഇസ്രായേൽരാജാവിന്റെ പേര് יְהוֹאָשׁ (യെഹോവാശ്) എന്നും വേർതിരിക്കുന്നു; ചില വിവർത്തനപാരമ്പര്യങ്ങളിൽ രണ്ടുപേരും ഒരേ രൂപത്തിൽ എഴുതപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֶׁבַע שָׁנָה
  choice: മുപ്പത്തിയേഴാം ഭരണവർഷത്തിൽ
  rationale: ബְּ + שְׁנַת എന്ന രാജവാഴ്ചാ കാലനിർണ്ണയസൂത്രവും സംഖ്യയും ചേർന്ന് രാജാവിന്റെ ഭരണത്തിലെ മുപ്പത്തിയേഴാം വർഷത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഭരണവർഷത്തിൽ’ എന്നു വ്യക്തമാക്കുന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְיוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ യോവാശിന്റെ
  rationale: לְ ഇവിടെ രാജവാഴ്ചയുടെ കാലഗണനയ്ക്കുള്ള അവലംബം സൂചിപ്പിക്കുന്നു. מֶלֶךְ יְהוּדָה യോവാശിനെ സമാനാധികരണമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: രാജവാഴ്ചാ അറിയിപ്പുകളിൽ Qal perfect ആയ מָלַךְ അധികാരാരോഹണം സൂചിപ്പിക്കാം. പിന്നാലെ ഭരണകാലദൈർഘ്യം വേറിട്ട് പറയുന്നതിനാൽ ‘രാജാവായി’ എന്നത് ആ ആരംഭാർഥം നിലനിർത്തുന്നു.
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: യെഹോവാഹാസിന്റെ മകനായ യെഹോവാശ്
  rationale: വടക്കൻ രാജാവിന്റെ יְהוֹאָשׁ എന്ന രൂപത്തെ ‘യെഹോവാശ്’ എന്നും പിതാവായ יְהוֹאָחָזനെ ‘യെഹോവാഹാസ്’ എന്നും ലിപ്യന്തരണം ചെയ്യുന്നു; ഇതിലൂടെ മുമ്പുള്ള യെഹൂദാരാജാവായ יוֹאָשׁ (‘യോവാശ്’) എന്ന പേരുമായുള്ള എബ്രായ വ്യത്യാസം നിലനിൽക്കുന്നു.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ രാജാവായി
  rationale: מָלַךְ എന്ന ക്രിയയോടുകൂടിയ עַל ഒരു ജനത്തിന്മേലുള്ള ഭരണം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഇസ്രായേലിന്റെ രാജാവായി’ എന്ന പ്രയോഗം സ്വാഭാവികമായി അതേ ബന്ധം നൽകുന്നു.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: בְּ സ്ഥലസൂചനയാണ്; ശമര്യ വടക്കൻ രാജ്യത്തിന്റെ രാജധാനിയായിരുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: പതിനാറു വർഷം ഭരിച്ചു
  rationale: ഈ സംഖ്യാവാക്യം രാജവാഴ്ചയുടെ ദൈർഘ്യം നൽകുന്നു. മലയാളത്തിലെ രാജവാഴ്ചാ വിവരണത്തിൽ ‘പതിനാറു വർഷം ഭരിച്ചു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
