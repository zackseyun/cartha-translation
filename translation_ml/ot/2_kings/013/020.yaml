  yaml_path: translation/ot/2_kings/013/020.yaml
  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
translation:
  language: ml
  text: പിന്നെ എലീശാ മരിച്ചു; അവർ അവനെ അടക്കം ചെയ്തു. മോവാബ്യരുടെ കവർച്ചാസംഘങ്ങൾ വർഷാരംഭസമയത്ത്[a] ദേശത്തേക്ക് കടന്നുവരാറുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വസന്തകാലത്ത്.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘വർഷം വരുമ്പോൾ’ എന്നാണ്; വർഷം തിരിയുന്ന സമയത്തെയോ, സാധാരണയായി സൈനികനീക്കങ്ങൾ പുനരാരംഭിച്ചിരുന്ന വസന്തകാലത്തെയോ സൂചിപ്പിക്കാവുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: പിന്നെ ... മരിച്ചു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘പിന്നെ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אֱלִישָׁע
  choice: എലീശാ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ പേരുരൂപം.
- source_word: וַיִּקְבְּרֻהוּ
  choice: അവർ അവനെ അടക്കം ചെയ്തു
  rationale: എബ്രായത്തിലെ സജീവ ബഹുവചനക്രിയയും മൂന്നാംപുരുഷ ഏകവചന കർമപ്രത്യയവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: גְדוּדֵי מוֹאָב
  choice: മോവാബിലെ കൊള്ളസംഘങ്ങൾ
  rationale: גְדוּד formal സൈന്യത്തേക്കാൾ കൊള്ളയിടാൻ വരുന്ന ആക്രമണസംഘങ്ങളെ സൂചിപ്പിക്കാം; construct ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יָבֹאוּ
  choice: കടന്നുവരാറുണ്ടായിരുന്നു
  rationale: ഇവിടെ imperfect ആവർത്തിച്ചുണ്ടായിരുന്ന പതിവുപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; בוא എന്നതിലെ പ്രവേശനഭാവവും ‘കടന്നുവരുക’ വ്യക്തമാക്കുന്നു.
- source_word: בָאָרֶץ
  choice: ദേശത്തേക്കു
  rationale: בוא എന്ന ചലനക്രിയയോടൊപ്പം ഭൂമിയിലേക്കോ ദേശത്തേക്കോ ഉള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നു.
- source_word: בָּא שָׁנָה
  choice: വർഷം പിറക്കുന്ന സമയത്ത്
  rationale: ‘വർഷം വരുമ്പോൾ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകത്വം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു; വസന്തകാലം എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
