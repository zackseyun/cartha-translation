- from: പിന്നെ എലീശാ മരിച്ചു; അവർ അവനെ അടക്കം ചെയ്തു. മോവാബിലെ കൊള്ളസംഘങ്ങൾ വർഷം പിറക്കുന്ന സമയത്ത്[a] ദേശത്തേക്കു കടന്നുവരാറുണ്ടായിരുന്നു.
