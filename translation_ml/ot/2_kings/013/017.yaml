  rationale: 'The revision clarifies the divine-source relation in the first arrow declaration and recasts the final clause into natural Malayalam while preserving the Hebrew sequence: striking Aram at Aphek until its complete end. The lexical alternative footnote remains anchored at the paired ‘arrow of victory’ declaration.'
