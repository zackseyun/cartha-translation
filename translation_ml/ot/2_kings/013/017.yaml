id: 2KI.13.17
reference: 2 Kings 13:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר פְּתַ֧ח הַ/חַלּ֛וֹן קֵ֖דְמָ/ה וַ/יִּפְתָּ֑ח וַ/יֹּ֤אמֶר אֱלִישָׁ֤ע יְרֵה֙ וַ/יּ֔וֹר וַ/יֹּ֗אמֶר חֵץ תְּשׁוּעָ֤ה לַֽ/יהוָה֙ וְ/חֵ֣ץ תְּשׁוּעָ֣ה בַֽ/אֲרָ֔ם וְ/הִכִּיתָ֧ אֶת אֲרָ֛ם בַּ/אֲפֵ֖ק עַד כַּלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “കിഴക്കോട്ടുള്ള ജനൽ തുറക്കുക.” അവൻ അതു തുറന്നു. പിന്നെ എലീശാ പറഞ്ഞു: “അമ്പെയ്യുക.” അവൻ അമ്പെയ്തു. അപ്പോൾ എലീശാ പറഞ്ഞു: “യഹോവയിൽനിന്നുള്ള വിജയത്തിന്റെ അമ്പ്—അരാമിനെതിരായ വിജയത്തിന്റെ അമ്പ്![a] നീ അഫേക്കിൽ അരാമിനെ പൂർണമായി നശിപ്പിക്കുന്നതുവരെ അതിനെ ആക്രമിച്ചുകൊണ്ടിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയിൽനിന്നുള്ള രക്ഷയുടെ അമ്പ്, അരാമിനെതിരായ രക്ഷയുടെ അമ്പ്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് “രക്ഷ,” “വിടുതൽ,” “വിജയം” എന്നീ അർഥങ്ങൾ വരാം.
    reason: תְּשׁוּעָה എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും לַיהוָה എന്നതിന്റെ ഉറവിടസൂചനയും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: פְּתַח הַחַלּוֹן קֵדְמָה
  choice: കിഴക്കോട്ടുള്ള ജനൽ തുറക്കുക
  rationale: കֵדְמָה ദിശയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കിഴക്കോട്ടുള്ള ജനൽ’ എന്നത് സ്വാഭാവികവും മൂലവാക്യത്തിന്റെ അർഥം കൃത്യമായി നൽകുന്നതുമാണ്.
- source_word: יְרֵה
  choice: അമ്പെയ്യുക
  rationale: വില്ലിൽനിന്ന് എയ്യുന്ന സന്ദർഭം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കാൻ ‘അമ്പെയ്യുക’ സ്വാഭാവികമാണ്; മൂലത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും ക്രിയയിൽ അമ്പിന്റെ ആശയം ഉൾക്കൊള്ളുന്നു.
- source_word: חֵץ תְּשׁוּעָה לַיהוָה
  choice: യഹോവയുടെ വിജയത്തിന്റെ അമ്പ്
  rationale: സൈനികസന്ദർഭത്തിൽ תְּשׁוּעָה എന്നതിന് ‘വിജയം’ യോജിക്കുന്നു. לַיהוָה-യെ ഉടമസ്ഥത/ഉറവിടം സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: וְחֵץ תְּשׁוּעָה בַאֲרָם
  choice: അരാമിനെതിരായ വിജയത്തിന്റെ അമ്പ്
  rationale: രണ്ടാമത്തെ പ്രയോഗം ആദ്യത്തേതിനെ വിശദീകരിക്കുന്നു; ב ഇവിടെ പ്രതികൂലബന്ധത്തിൽ ‘എതിരായ’ എന്നു നൽകുന്നു.
- source_word: וְהִכִּיתָ אֶת אֲרָם בַאֲפֵק
  choice: നീ അഫേക്കിൽവെച്ച് അരാമിനെ തോൽപ്പിക്കും
  rationale: נכה-യുടെ അടിസ്ഥാനരൂപകം ‘അടിക്കുക’ എന്നാണെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ ‘തോൽപ്പിക്കുക’ സാധാരണ മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു; സമ്പൂർണ നാശം അടുത്ത പ്രയോഗത്തിൽ പ്രത്യേകം നിലനിർത്തുന്നു.
- source_word: עַד כַּלֵּה
  choice: പൂർണമായി നശിപ്പിക്കുന്നതുവരെ
  rationale: ഇവിടെ כלה ശത്രുവിനെ അന്ത്യംവരെ നശിപ്പിക്കുന്ന സൈനിക അർഥം നൽകുന്നു; ‘പൂർണമായി’ സമാപ്തിയുടെ ബലം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തിന്റെ മലയാളത്തിൽ വ്യാപകമായ നേരിട്ടുള്ള രൂപമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: സൈനിക പ്രവചനത്തിൽ תְּשׁוּעָה എന്ന പദത്തിന്റെ അർഥം
  choice: വിജയം
  alternative: രക്ഷ / വിടുതൽ
  rationale: അമ്പെയ്യുന്ന പ്രതീകാത്മക പ്രവൃത്തിയും അരാമിനെ തോൽപ്പിക്കുമെന്ന വാഗ്ദാനവും ഉള്ള തത്സന്ദർഭത്തിൽ ‘വിജയം’ ഏറ്റവും വ്യക്തമാണ്; പദത്തിന്റെ വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: לַיהוָה എന്ന ബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: യഹോവയുടെ
  alternative: യഹോവയിൽനിന്നുള്ള
  rationale: ഹീബ്രു ലാമെദ് ഉടമസ്ഥത, ഉറവിടം, പ്രവർത്തകത്വം എന്നിവ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘യഹോവയുടെ’ തെരഞ്ഞെടുത്തു; ഉറവിടസാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആവർത്തനവും പ്രതീകാത്മക പ്രഖ്യാപനത്തിന്റെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
