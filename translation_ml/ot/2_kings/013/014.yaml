  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וֶֽ/אֱלִישָׁע֙ חָלָ֣ה אֶת חָלְי֔/וֹ אֲשֶׁ֥ר יָמ֖וּת בּ֑/וֹ וַ/יֵּ֨רֶד אֵלָ֜י/ו יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל וַ/יֵּ֤בְךְּ עַל פָּנָי/ו֙ וַ/יֹּאמַ֔ר אָבִ֣/י אָבִ֔/י רֶ֥כֶב יִשְׂרָאֵ֖ל וּ/פָרָשָֽׁי/ו־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/014.yaml
  text: Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
translation:
  language: ml
  text: 'എലീശാവിന് താൻ മരിക്കാനിരുന്ന രോഗം ബാധിച്ചിരുന്നു. ഇസ്രായേൽരാജാവായ യോവാശ് അദ്ദേഹത്തിന്റെ അടുക്കലേക്കു ഇറങ്ങിച്ചെന്ന്, അദ്ദേഹത്തെച്ചൊല്ലി കരഞ്ഞുകൊണ്ട് പറഞ്ഞു: “എന്റെ പിതാവേ[a], എന്റെ പിതാവേ! ഇസ്രായേലിന്റെ രഥവും അതിന്റെ കുതിരപ്പടയാളികളും!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ നിലവിളി 2 രാജാക്കന്മാർ 2:12-ൽ ഏലിയാവിനെക്കുറിച്ച് എലീശാ പറഞ്ഞ അതേ വാക്കുകളെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: חָלָה אֶת חָלְיוֹ
  choice: രോഗം ബാധിച്ച് കിടപ്പിലായി
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്നുള്ള എബ്രായ പ്രയോഗം രോഗബാധയെ ഊന്നുന്നു. മലയാളത്തിൽ പദാവർത്തനം ഒഴിവാക്കി, സന്ദർഭത്തിനു യോജിച്ച സ്വാഭാവിക പ്രയോഗം ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: താൻ മരിക്കാനിടയാകുന്ന
  rationale: ആ രോഗം മരണത്തിലേക്കു നയിക്കുമെന്ന ആഖ്യാനത്തിലെ മുന്നോട്ടുനോക്കുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: וַיֵּרֶד אֵלָיו
  choice: അദ്ദേഹത്തിന്റെ അടുക്കലേക്കു ഇറങ്ങിച്ചെന്ന്
  rationale: ירד എന്ന ക്രിയയിലെ താഴേക്കുള്ള ദിശാസൂചന വിവർത്തനത്തിൽ നിലനിർത്തി.
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  choice: അദ്ദേഹത്തിന്റെ മുഖത്തിനുമീതെ കുനിഞ്ഞ് കരഞ്ഞുകൊണ്ട്
  rationale: അക്ഷരാർഥമായ ‘അവന്റെ മുഖത്തിനുമീതെ കരഞ്ഞു’ എന്ന ദൃശ്യവിവരം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നവിധം അവതരിപ്പിക്കുന്നു; ‘കുനിഞ്ഞ്’ എന്നത് ഭാവസൂചനയായതിനാൽ കൂടുതൽ വ്യാഖ്യാനം ചേർക്കാതെ ദൃശ്യം വ്യക്തമാക്കുന്നു.
- source_word: אָבִי אָבִי
  choice: എന്റെ പിതാവേ, എന്റെ പിതാവേ!
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും ദുഃഖനിലവിളിയുടെ വികാരതീവ്രതയും നിലനിർത്തുന്നു.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: ഇസ്രായേലിന്റെ രഥവും അതിന്റെ കുതിരപ്പടയാളികളും
  rationale: רֶכֶב എന്ന ഏകവചനരൂപവും തുടർന്നുള്ള ബഹുവചന പദവും കഴിയുന്നത്ര അടുത്തായി നിലനിർത്തി; പ്രവാചകന്റെ പ്രാധാന്യത്തെ സൂചിപ്പിക്കുന്ന രൂപകം വിശദീകരിച്ച് തീർക്കാതെ സംരക്ഷിച്ചു.
theological_decisions:
- issue: ‘ഇസ്രായേലിന്റെ രഥവും അതിന്റെ കുതിരപ്പടയാളികളും’ എന്ന പ്രയോഗത്തിന്റെ രൂപകാർഥം
  choice: എലീശായോടുള്ള നേരിട്ടുള്ള നിലവിളിയായി രൂപകം മാറ്റമില്ലാതെ നിലനിർത്തി.
  alternative: എലീശാ ഇസ്രായേലിന്റെ യഥാർഥ പ്രതിരോധശക്തിയാണെന്ന് വ്യാഖ്യാനിച്ച് പരാവർത്തനം ചെയ്യുക; അല്ലെങ്കിൽ സ്വർഗീയ രഥങ്ങളുടെ ദർശനമായി അവതരിപ്പിക്കുക.
  rationale: ഈ വാക്കുകൾ 2 രാജാക്കന്മാർ 2:12-നെ പ്രതിധ്വനിപ്പിക്കുകയും പ്രവാചകന്റെ പ്രാധാന്യം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. എന്നാൽ രൂപകം കൃത്യമായി എങ്ങനെ മനസ്സിലാക്കണമെന്നത് പാഠം തുറന്നുവെക്കുന്നതിനാൽ വിവർത്തനം അതിനെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിനെയും പ്രവാചകനെയും സൂചിപ്പിക്കുമ്പോൾ ‘അദ്ദേഹം’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിച്ചു. മൂലത്തിലെ ആരംഭക וַ־യ്ക്ക് പ്രത്യേകമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പ് അടയാളവുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
