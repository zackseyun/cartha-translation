  text: וַ/יִּשְׁכַּ֤ב יוֹאָשׁ֙ עִם אֲבֹתָ֔י/ו וְ/יָרָבְעָ֖ם יָשַׁ֣ב עַל כִּסְא֑/וֹ וַ/יִּקָּבֵ֤ר יוֹאָשׁ֙ בְּ/שֹׁ֣מְר֔וֹן עִ֖ם מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/013.yaml
  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
translation:
  language: ml
  text: യോവാശ് തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു[a], യൊരോബെയാം യോവാശിന്റെ സിംഹാസനത്തിൽ ഇരുന്നു. യോവാശിനെ ശമര്യയിൽ ഇസ്രായേൽരാജാക്കന്മാരോടുകൂടെ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ പിതാക്കന്മാരോടുകൂടെ കിടന്നു’; ഇത് ഒരു രാജാവിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: രാജാവിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗത്തിന്റെ രൂപകഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു; വെറും ‘മരിച്ചു’ എന്നാക്കി അർഥം ചുരുക്കുന്നില്ല.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ
  rationale: വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന പതിവ് രാജകീയ പ്രയോഗം മൂലപാഠത്തോട് അടുത്തായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് പൂർവികരെ ഉൾക്കൊള്ളുന്നു.
- source_word: יָשַׁב עַל כִּסְאוֹ
  choice: അവന്റെ സിംഹാസനത്തിൽ ഇരുന്നു
  rationale: അധികാരാവകാശത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യപ്രയോഗം വ്യാഖ്യാനിച്ച് ‘രാജാവായി’ എന്നു മാത്രം പറയാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וַיִּקָּבֵר
  choice: അടക്കം ചെയ്തു
  rationale: എബ്രായത്തിലെ നിഷ്ക്രിയരൂപത്തിന്റെ അർഥം മലയാളത്തിലെ സ്വാഭാവിക കർമണിപ്രയോഗത്തിലൂടെ നൽകുന്നു; അടക്കം ചെയ്തവരെ അനാവശ്യമായി നിർദേശിക്കുന്നില്ല.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: ב എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷയാണ്.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരോടുകൂടെ
  rationale: മുൻകാല ഇസ്രായേൽരാജാക്കന്മാരുടെ അടക്കസ്ഥലത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ‘കൂടെ’ എന്ന ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു’ എന്ന മരണപ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: എബ്രായത്തിലെ പതിവ് രാജകീയ മരണസൂത്രവാക്യം രൂപകസഹിതം നിലനിർത്തി.
  alternative: ‘മരിച്ചു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠം മരണാനന്തരാവസ്ഥയെ ഇവിടെ വിശദീകരിക്കുന്നില്ല; അതിനാൽ രൂപകത്തെ ഏതെങ്കിലും പ്രത്യേക ദൈവശാസ്ത്രസിദ്ധാന്തമായി വികസിപ്പിക്കാതെയും വെറും ‘മരിച്ചു’ എന്നാക്കി ചുരുക്കാതെയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ ചരിത്രവിവരണശൈലി. ‘നിദ്രപ്രാപിച്ചു’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ മരണരൂപകം നിലനിർത്തുന്നു; ‘സിംഹാസനത്തിൽ ഇരുന്നു’ എന്നത് രാജാവായി അധികാരമേറ്റതിന്റെ മൂലപാഠചിത്രം സംരക്ഷിക്കുന്നു.
