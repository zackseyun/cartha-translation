id: 2KI.13.24
reference: 2 Kings 13:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֖מָת חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֑ם וַ/יִּמְלֹ֛ךְ בֶּן הֲדַ֥ד בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/024.yaml
  text: Then Hazael king of Aram died[a], and Ben-hadad his son became king in his place.
translation:
  language: ml
  text: അരാംരാജാവായ ഹസായേൽ മരിച്ചു; അവന്റെ മകൻ ബെൻ-ഹദദ് അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ ഖാൽ വയ്യിഖ്തോൽ രൂപം കഥനത്തിലെ തുടർന്നുള്ള ഭൂതകാലസംഭവത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യക്രമവും അർദ്ധവിരാമവും സംഭവപരമ്പര സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേകമായി ‘പിന്നെ’ ചേർത്തിട്ടില്ല.
- source_word: חֲזָאֵל
  choice: ഹസായേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ אֲרָם
  choice: അരാംരാജാവ്
  rationale: אֲרָם ചരിത്രരാജ്യത്തിന്റെ പേരായതിനാൽ വ്യാഖ്യാനപരമായ ‘സിറിയ’ എന്നതിനു പകരം ‘അരാം’ നിലനിർത്തി; മലയാളത്തിൽ സ്വാഭാവികമായ സമാസരൂപം ഉപയോഗിച്ചു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: ഈ രാജാവകാശസന്ദർഭത്തിൽ מלך ഭരണകാലത്തിന്റെ ദൈർഘ്യത്തേക്കാൾ സിംഹാസനാരോഹണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘രാജാവായി’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בֶּן־הֲדַד
  choice: ബെൻ-ഹദദ്
  rationale: ഹീബ്രു പേരിന്റെ രണ്ടു ഘടകങ്ങൾ വ്യക്തമാക്കാൻ ഹൈഫനോടുകൂടിയ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: സർവനാമപ്രത്യയം ഹസായേലിനെയാണ് സൂചിപ്പിക്കുന്നത്; പിതൃപുത്രബന്ധം മൂലപാഠംപോലെ വ്യക്തമായി നിലനിർത്തി.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: രാജാവകാശസൂത്രവാക്യത്തിൽ תחתיו മുൻഗാമിയുടെ സ്ഥാനത്തെ പിൻഗാമി ഏറ്റെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അവനു പകരം’ അതിന്റെ അർത്ഥം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
