translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രകഥനശൈലി. ‘അരാം’ എന്ന മൂലപാഠത്തിലെ രാജ്യനാമം നിലനിർത്തിയതിനാൽ ഇംഗ്ലീഷിനാവശ്യമായിരുന്ന ‘Syria’ എന്ന പദവികല്പത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് മലയാള കരടിൽ അനിവാര്യമല്ല.
