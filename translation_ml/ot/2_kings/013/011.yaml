  text: וַ/יַּֽעֲשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּ֞אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל בָּ֥/הּ הָלָֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
translation:
  language: ml
  text: അവൻ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു. ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച നെബാത്തിന്റെ മകനായ യൊരോബെയാമിന്റെ പാപങ്ങളിലൊന്നിൽനിന്നുപോലും അവൻ പിന്മാറിയില്ല; അവൻ അവയിൽ നടന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവൻ അതിൽ നടന്നു.” എബ്രായപാഠത്തിലെ സർവനാമം ഏകവചനമാണ്; അത് യൊരോബെയാമിന്റെ പാപകരമായ വഴിയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: അവൻ തിന്മയായതു ചെയ്തു
  rationale: രാജാക്കന്മാരുടെ പുസ്തകത്തിലെ പതിവായ ധാർമിക വിലയിരുത്തൽപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും ‘ചെയ്തു’ എന്ന ക്രിയയും തിന്മ എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; יְהוָה എന്ന നാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: പാപങ്ങളിൽ ഒന്നിൽനിന്നുപോലും അവൻ പിന്മാറിയില്ല
  rationale: നിഷേധത്തോടുകൂടിയ מִכָּל എന്ന പ്രയോഗം ഇവിടെ ഒരു പാപവും ഉപേക്ഷിച്ചില്ലെന്ന സമഗ്രമായ അർഥം നൽകുന്നു. മലയാളത്തിലെ ‘ഒന്നിൽനിന്നുപോലും ... ഇല്ല’ അത് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകനായ യൊരോബെയാം
  rationale: പിതൃനാമബന്ധം നിലനിർത്തിക്കൊണ്ട് പേരുകൾ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം—ഇസ്രായേലിനെ പാപത്തിലേക്കു നയിച്ചത്—സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בָּהּ הָלָךְ
  choice: അവൻ അവയിൽത്തന്നെ നടന്നു
  rationale: הלך എന്ന പെരുമാറ്റരീതിയെ സൂചിപ്പിക്കുന്ന രൂപകം സംരക്ഷിക്കുന്നു. ഏകവചനത്തിലുള്ള എബ്രായ സർവനാമത്തെ മലയാളത്തിൽ മുൻപുള്ള ‘പാപങ്ങൾ’ എന്ന ആശയത്തോട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ബഹുവചനമായി നൽകുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പദവിയായി മാറ്റാതെ, Yahweh-നോടടുത്ത മലയാള ലിപ്യന്തരണമായി നൽകുന്നു.
- issue: രാജാക്കന്മാരിലെ ധാർമിക വിലയിരുത്തൽ
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്തു
  alternative: യഹ്‌വെയുടെ കണ്ണുകളിൽ ദോഷം ചെയ്തു
  rationale: മൂലത്തിലെ ദൈവിക വിധിനിർണയം മയപ്പെടുത്താതെയും അതിലേക്ക് വിശദീകരണം ചേർക്കാതെയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- issue: അവസാനത്തെ ഏകവചന സർവനാമത്തിന്റെ കൂട്ടാർഥം
  choice: അവയിൽത്തന്നെ നടന്നു
  alternative: അതിൽത്തന്നെ നടന്നു
  rationale: בָּהּ വ്യാകരണപരമായി സ്ത്രീലിംഗ ഏകവചനമാണെങ്കിലും, സന്ദർഭത്തിൽ യൊരോബെയാമിന്റെ പാപപഥത്തെ കൂട്ടമായി സൂചിപ്പിക്കാൻ കഴിയും. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ബഹുവചനം ഉപയോഗിച്ച് യഥാർഥ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൃഷ്ടിയിൽ’, ‘പിന്മാറിയില്ല’, ‘നടന്നു’ എന്നീ പദങ്ങൾ മൂലത്തിലെ വിലയിരുത്തലും വഴിനടപ്പിന്റെ രൂപകവും നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാപാരമ്പര്യ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കിയിരിക്കുന്നു.
