source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹאָחָז֙ עִם אֲבֹתָ֔י/ו וַֽ/יִּקְבְּרֻ֖/הוּ בְּ/שֹׁמְר֑וֹן וַ/יִּמְלֹ֛ךְ יוֹאָ֥שׁ בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/009.yaml
  text: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
translation:
  language: ml
  text: യെഹോവാഹാസ് തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു; അവർ അവനെ ശമര്യയിൽ അടക്കം ചെയ്തു. പിന്നെ അവന്റെ മകൻ യോവാശ്[a] അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പേര് ‘യെഹോവാശ്’ എന്നും എഴുതപ്പെടുന്നു.
    reason: വ്യക്തിനാമത്തിന്റെ അറിയപ്പെടുന്ന വ്യത്യസ്ത രൂപം വായനക്കാരനെ അറിയിക്കുന്നു.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: തന്റെ പൂർവികരോടൊപ്പം അന്ത്യവിശ്രമം പ്രാപിച്ചു
  rationale: ഇത് രാജാക്കന്മാരുടെ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗമാണ്. അക്ഷരാർഥത്തിലുള്ള ‘കിടന്നു’ മലയാളത്തിൽ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതിനാൽ, മരണസൂചനയും വിശ്രമത്തിന്റെ രൂപകവും നിലനിർത്തുന്ന സ്വാഭാവികമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: וַיִּקְבְּרֻהוּ
  choice: അവർ അവനെ ... അടക്കം ചെയ്തു
  rationale: മൂലപാഠത്തിലെ അനിശ്ചിത കർത്താവുള്ള മൂന്നാംപുരുഷ ബഹുവചന ക്രിയാരൂപം കർമണിപ്രയോഗമാക്കാതെ സജീവരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: בְּ ഇവിടെ അടക്കസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ‘ശമര്യയിൽ’ സ്വാഭാവികവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജവാഴ്ചയുടെ അവകാശക്രമം അറിയിക്കുന്ന ഈ സന്ദർഭത്തിൽ ക്രിയ അധികാരാരോഹണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘രാജാവായി’ അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: മുൻരാജാവിന്റെ സ്ഥാനത്തേക്കുള്ള രാജവംശീയ പിൻഗാമിത്വം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: יְהוֹאָחָז
  choice: യഹോവാഹാസ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തോട് ചേർന്ന ലിപ്യന്തരണം.
- source_word: יוֹאָשׁ
  choice: യോവാശ്
  rationale: ഈ വാക്യത്തിലെ ഹ്രസ്വ എബ്രായ നാമരൂപമായ יוֹאָשׁ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു; ദീർഘരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
