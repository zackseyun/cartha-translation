translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രാജവംശവിവരണ ശൈലി. പരമ്പരാഗത മരണസൂത്രത്തിന്റെ രൂപകം സാധ്യമായത്ര നിലനിർത്തിയിട്ടുണ്ട്; എന്നാൽ അക്ഷരാർഥപരമായ അസ്വാഭാവികത ഒഴിവാക്കി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പിന്റെ ചിഹ്നം തെറ്റായ സ്ഥാനത്താണെന്നു തോന്നുന്നതിനാൽ, അതിന്റെ ഉള്ളടക്കത്തിന് യോജിച്ചവിധം ‘യോവാശ്’ എന്ന പേരിനു ശേഷമാണ് [a] ചേർത്തത്.
