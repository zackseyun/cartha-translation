source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֤ה לְ/יִשְׂרָאֵל֙ מוֹשִׁ֔יעַ וַ/יֵּ֣צְא֔וּ מִ/תַּ֖חַת יַד אֲרָ֑ם וַ/יֵּשְׁב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/אָהֳלֵי/הֶ֖ם כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
translation:
  language: ml
  text: യഹോവ ഇസ്രായേലിന് ഒരു വിടുവിക്കുന്നവനെ[a] നൽകി; അങ്ങനെ അവർ അരാമിന്റെ കൈക്കീഴിൽനിന്ന്[b] പുറത്തുവന്നു; ഇസ്രായേൽമക്കൾ മുൻകാലങ്ങളിലെപ്പോലെ[c] തങ്ങളുടെ കൂടാരങ്ങളിൽ പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു രക്ഷകനെ.’ എബ്രായപദം രക്ഷയോ വിടുതലോ വരുത്തുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അരാമിന്റെ കൈക്കീഴിൽനിന്ന്’; അരാമിന്റെ അധികാരത്തിൽനിന്നുള്ള മോചനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘പണ്ടത്തെപ്പോലെ’ / ‘മുമ്പത്തെപ്പോലെ.’ അക്ഷരാർഥത്തിൽ, ‘ഇന്നലെ, അതിനുമുമ്പുള്ള ദിവസം’; മുൻകാലങ്ങളെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: מוֹשִׁיעַ
  choice: ഒരു വിടുവിക്കുന്നവൻ
  rationale: രക്ഷയോ വിടുതലോ വരുത്തുന്ന വ്യക്തിയെയാണ് എബ്രായ പദം സൂചിപ്പിക്കുന്നത്. ചരിത്രപരമായ ഈ സന്ദർഭത്തിൽ ‘വിടുവിക്കുന്നവൻ’ സ്വാഭാവികവും അനാവശ്യമായ പിൽക്കാല ദൈവശാസ്ത്രസൂചനകൾ ഒഴിവാക്കുന്നതുമാണ്.
- source_word: מִתַּחַת יַד אֲרָם
  choice: അരാമിന്റെ കൈക്കീഴിൽനിന്ന്
  rationale: അരാമിന്റെ അധികാരത്തിനോ ആധിപത്യത്തിനോ കീഴിലുള്ള അവസ്ഥയെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ സജീവമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: പിൽക്കാല ഭൂമിശാസ്ത്രനാമമായ ‘സിറിയ’ എന്നതിനു പകരം ബൈബിൾകാലത്തെ രാജ്യത്തിന്റെ ചരിത്രനാമം ഉപയോഗിക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബപരവും ഉടമ്പടിപരവുമായ എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּאָהֳלֵיהֶם
  choice: തങ്ങളുടെ കൂടാരങ്ങളിൽ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ ‘കൂടാരങ്ങൾ’ എന്ന ദൃശ്യപദം നിലനിർത്തുന്നു.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: മുമ്പത്തെപ്പോലെ
  rationale: അക്ഷരാർഥത്തിൽ പഴയ ദിവസങ്ങളെ പരാമർശിക്കുന്ന എബ്രായ ശൈലിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיֵּצְאוּ
  choice: അവർ പുറത്തുവന്നു
  rationale: יצא എന്ന ക്രിയയുടെ അടിസ്ഥാനചലനാർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘കൈക്കീഴിൽനിന്ന്’ എന്ന പ്രയോഗം അടിമത്തത്തിൽനിന്നുള്ള മോചനത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּשְׁבוּ
  choice: പാർത്തു
  rationale: ഇവിടെ ‘വസിച്ചു’ എന്ന അർഥമുള്ള ക്രിയയ്ക്ക് ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: מוֹשִׁיעַ എന്നത് ‘വിടുവിക്കുന്നവൻ’ എന്നോ ‘രക്ഷകൻ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: വിടുവിക്കുന്നവൻ
  alternative: രക്ഷകൻ
  rationale: ഉടൻ പ്രസക്തമായത് അരാമ്യ ആധിപത്യത്തിൽനിന്നുള്ള ചരിത്രപരമായ മോചനമാണ്. ‘വിടുവിക്കുന്നവൻ’ ആ അർഥം കൃത്യമായി നൽകുകയും പാഠം വ്യക്തമാക്കാത്ത മശീഹാപരമായ തിരിച്ചറിയൽ ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന കുടുംബപരമായ പദപ്രയോഗം എങ്ങനെ നിലനിർത്തണം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: മൂലപാഠത്തിലെ കുടുംബപരവും ഉടമ്പടിപരവുമായ വിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും തുലനം ചെയ്തു. ‘കൈക്കീഴിൽ,’ ‘ഇസ്രായേൽമക്കൾ,’ ‘കൂടാരങ്ങൾ’ എന്നീ മൂലപാഠസവിശേഷതകൾ നിലനിർത്തി; അപരിചിതമായ ഹീബ്രു കാലപ്രയോഗം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാക്കി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
