id: 2KI.13.22
reference: 2 Kings 13:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם לָחַ֖ץ אֶת יִשְׂרָאֵ֑ל כֹּ֖ל יְמֵ֥י יְהוֹאָחָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/022.yaml
  text: Hazael king of Aram oppressed Israel all the days of Jehoahaz[a].
translation:
  language: ml
  text: അരാംരാജാവായ ഹസായേൽ യെഹോവാഹാസിന്റെ കാലത്തുടനീളം ഇസ്രായേലിനെ പീഡിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַחֲזָאֵל
  choice: ഹസായേൽ
  rationale: വാവ് ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേകമായ ഒരു കാലസൂചകപദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ആ തുടർച്ച സ്വാഭാവികമായി നിലനിർത്തുന്നു. വ്യക്തിനാമം ഹീബ്രു രൂപത്തിനനുസരിച്ച് ലിപ്യന്തരിച്ചു.
- source_word: מֶלֶךְ אֲרָם
  choice: അരാംരാജാവായ
  rationale: അֲרָם എന്ന ഹീബ്രു സ്ഥലനാമം പാരമ്പര്യമായ ‘സിറിയ’ എന്നതിനു പകരം ‘അരാം’ എന്നു നൽകി; സംയുക്തപദപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לָחַץ
  choice: പീഡിപ്പിച്ചു
  rationale: രാഷ്ട്രീയ-സൈനികമായ ദീർഘകാല അടിച്ചമർത്തലും കഠിന സമ്മർദവും സൂചിപ്പിക്കുന്ന ക്രിയയ്ക്ക് പൊതുവായ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ തുല്യം.
- source_word: אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ
  rationale: നേരിട്ടുള്ള കർമത്തെ മലയാള വിഭക്തിയോടെ നൽകി; സന്ദർഭത്തിൽ ഇത് വടക്കൻ രാജ്യമായ ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: כֹּל יְמֵי
  choice: കാലത്തുടനീളം
  rationale: ‘എല്ലാ ദിവസങ്ങളിലും’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ ദൈർഘ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഇവിടെ യെഹോവാഹാസിന്റെ ഭരണകാലമാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: יְהוֹאָחָז
  choice: യെഹോവാഹാസ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
