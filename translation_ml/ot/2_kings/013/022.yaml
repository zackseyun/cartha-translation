  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി. മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ/അപ്പോൾ’ പോലുള്ള വ്യക്തമായ കാലസൂചകം ചേർത്തിട്ടില്ല.
