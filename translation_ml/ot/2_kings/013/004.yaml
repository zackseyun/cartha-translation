reference: 2 Kings 13:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְחַ֥ל יְהוֹאָחָ֖ז אֶת פְּנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ יְהוָ֔ה כִּ֤י רָאָה֙ אֶת לַ֣חַץ יִשְׂרָאֵ֔ל כִּֽי לָחַ֥ץ אֹתָ֖/ם מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/004.yaml
  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
translation:
  language: ml
  text: അപ്പോൾ യെഹോവാഹാസ് യഹ്‌വെയുടെ അനുകൂലം തേടി[a]; യഹ്‌വെ അവന് ചെവികൊടുത്തു, കാരണം അരാമിലെ രാജാവ് ഇസ്രായേല്യരെ ഞെരുക്കിയതിനാൽ ഇസ്രായേലിന്റെ പീഡനം അവിടുന്ന് കണ്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയോട് അപേക്ഷിച്ചു”; അക്ഷരാർഥത്തിൽ, “യഹ്‌വെയുടെ മുഖം മയപ്പെടുത്തി/ശാന്തമാക്കി.” ഇത് അവിടുത്തെ അനുകൂലം തേടുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “അരാം” എന്നത് പഴയ ചില പരിഭാഷകളിൽ “സിറിയ” എന്നു നൽകിയിട്ടുള്ള ഹീബ്രായ നാമമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: യഹ്‌വെയുടെ പ്രസാദം തേടി
  rationale: חלה את־פני എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘മുഖം മയപ്പെടുത്തുക’ എന്നതല്ല, ഒരാളുടെ പ്രസാദം തേടി അപേക്ഷിക്കുക എന്നാണ്. മലയാളത്തിൽ ‘പ്രസാദം തേടി’ എന്നത് ഈ ബന്ധപരവും അപേക്ഷാപരവുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ സാധാരണ സ്വീകരിക്കാവുന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: അവന്റെ അപേക്ഷ കേട്ടു
  rationale: שמע + אל ഇവിടെ വെറും ശബ്ദം കേൾക്കുന്നതിനെക്കാൾ അപേക്ഷ ശ്രദ്ധിച്ചു കേൾക്കുക എന്ന ആശയം നൽകുന്നു. സന്ദർഭത്തിൽ വ്യക്തതയ്ക്കായി ‘അപേക്ഷ’ ചേർത്തുവെങ്കിലും പ്രതികരണത്തിന്റെ ഫലം അതിലധികം നിർവചിച്ചിട്ടില്ല.
- source_word: לַחַץ ... לָחַץ
  choice: പീഡനം ... ഞെരുക്കിയതുമൂലം
  rationale: നാമത്തിന്റെയും ക്രിയയുടെയും ഒരേ മൂലപദബന്ധം മലയാളത്തിൽ കൃത്യമായി ആവർത്തിക്കുന്നത് അസ്വാഭാവികമാകുന്നതിനാൽ, രാഷ്ട്രീയ-സൈനിക അടിച്ചമർത്തലിനെ സൂചിപ്പിക്കുന്ന പരസ്പരം ബന്ധപ്പെട്ട സ്വാഭാവിക പദങ്ങൾ ഉപയോഗിച്ചു.
- source_word: יִשְׂרָאֵל ... אֹתָם
  choice: ഇസ്രായേൽ ... ഇസ്രായേല്യരെ
  rationale: ആദ്യ പ്രയോഗത്തിൽ രാജ്യം/ജനസമൂഹം എന്ന കൂട്ടായ നാമം നിലനിർത്തി; ബഹുവചന സർവനാമത്തിന്റെ സൂചന മലയാളത്തിൽ വ്യക്തമാക്കാൻ പിന്നീടത് ‘ഇസ്രായേല്യരെ’ എന്നു നൽകി.
- source_word: מֶלֶךְ אֲרָם
  choice: അരാംരാജാവ്
  rationale: ഹീബ്രായ സ്ഥലനാമമായ אֲרָם ‘സിറിയ’ എന്നു നവീകരിക്കാതെ ‘അരാം’ എന്നു ലിപ്യന്തരിച്ചു; മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ഇതിലൂടെ നിയമബന്ധപരമായ നാമസൂചന നിലനിൽക്കുന്നു.
- issue: וַיְחַל אֶת־פְּנֵי יְהוָה എന്ന ദൈവത്തോടുള്ള അപേക്ഷാപ്രയോഗം
  choice: യഹ്‌വെയുടെ പ്രസാദം തേടി
  alternative: യഹ്‌വെയോട് അപേക്ഷിച്ചു / യഹ്‌വെയുടെ മുഖം തേടി
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘മുഖം’ മലയാളത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കും. ‘പ്രസാദം തേടി’ എന്നത് ദൈവത്തെ പ്രീതിപ്പെടുത്താനുള്ള പ്രവൃത്തി എന്നതിലേക്കു മാത്രം ചുരുക്കാതെ, അവന്റെ അനുകൂല പ്രതികരണം അഭ്യർഥിക്കുന്ന പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവിടുന്ന്’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക സർവനാമമായി ഉപയോഗിച്ചു. കാരണബന്ധം വ്യക്തമാക്കാൻ രണ്ടാമത്തെ വാക്യം പുനഃക്രമീകരിച്ചെങ്കിലും ഹീബ്രായത്തിലെ രണ്ടു כִּי ഘടകങ്ങളുടെയും വിശദീകരണബന്ധം സംരക്ഷിച്ചു.
