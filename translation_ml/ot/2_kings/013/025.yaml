  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
translation:
  language: ml
  text: അപ്പോൾ യെഹോവാഹാസിന്റെ മകനായ യെഹോവാശ്, ഹസായേലിന്റെ മകനായ ബെൻ-ഹദദ് യുദ്ധത്തിൽ യെഹോവാശിന്റെ പിതാവായ യെഹോവാഹാസിന്റെ കൈയിൽനിന്ന് പിടിച്ചെടുത്തിരുന്ന പട്ടണങ്ങൾ ബെൻ-ഹദദിന്റെ കൈയിൽനിന്ന് വീണ്ടും പിടിച്ചെടുത്തു.[a] യോവാശ് അവനെ മൂന്നു പ്രാവശ്യം തോൽപ്പിച്ചു;[b] അങ്ങനെ അവൻ ഇസ്രായേലിന്റെ പട്ടണങ്ങൾ തിരികെ നേടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഈ വാക്യത്തിൽ ഒരേ രാജാവിന്റെ പേരിന്റെ രണ്ടു രൂപങ്ങൾ എബ്രായ പാഠം ഉപയോഗിക്കുന്നു: ആദ്യം ‘യെഹോവാശ്’, പിന്നീട് ‘യോവാശ്’.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവനെ പ്രഹരിച്ചു.’ എബ്രായ ക്രിയയ്ക്ക് യുദ്ധത്തിൽ പ്രഹരിക്കുക എന്നും സൈനികമായി തോൽപ്പിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיִּקַּח
  choice: വീണ്ടും പിടിച്ചെടുത്തു
  rationale: שׁוב സൂചിപ്പിക്കുന്ന വീണ്ടെടുപ്പും לקח സൂചിപ്പിക്കുന്ന കൈവശപ്പെടുത്തലും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു; രണ്ടു സമാന ക്രിയകൾ ചേർത്ത് അസ്വാഭാവിക ആവർത്തനം സൃഷ്ടിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: പുരാതന കാലത്തെ മതിലുകളുള്ള ജനവാസകേന്ദ്രങ്ങൾക്കും പൊതുവായ നഗരകേന്ദ്രങ്ങൾക്കും ചേരുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: അധികാരത്തിലോ കൈവശത്തിലോ നിന്നുള്ള മോചനം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മലയാളത്തിലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בֶּן־הֲדַד
  choice: ബെൻ-ഹദദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം പിന്തുടരുന്ന ലിപ്യന്തരണം.
- source_word: אֲשֶׁר לָקַח
  choice: പിടിച്ചെടുത്തിരുന്ന
  rationale: യെഹോവാശിന്റെ വീണ്ടെടുപ്പിനു മുമ്പ് നടന്ന പ്രവൃത്തിയാണെന്ന കാലബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: בַּמִּלְחָמָה
  choice: യുദ്ധത്തിൽ
  rationale: സൈനിക സാഹചര്യത്തെ സംക്ഷിപ്തമായും നേരിട്ടും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: മൂന്നു പ്രാവശ്യം
