- source_word: הִכָּהוּ
  choice: അവനെ തോൽപ്പിച്ചു
  rationale: נכה എന്ന ക്രിയ യുദ്ധസന്ദർഭത്തിൽ പ്രഹരിക്കുന്നതോടൊപ്പം സൈനികമായി പരാജയപ്പെടുത്തുന്നതും സൂചിപ്പിക്കാം; ഇവിടെ ആവർത്തിച്ച സൈനിക വിജയങ്ങൾ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു, എന്നാൽ പദത്തിന്റെ നേരിട്ടുള്ള അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: יוֹאָשׁ
  choice: യോവാശ്
  rationale: വാക്യത്തിന്റെ അവസാനഭാഗത്തെ ചുരുക്കിയ എബ്രായ നാമരൂപം അതേപടി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיָּשֶׁב אֶת עָרֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പട്ടണങ്ങൾ തിരികെ നേടി
  rationale: പട്ടണങ്ങൾ വീണ്ടും ഇസ്രായേൽ നിയന്ത്രണത്തിലായതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അവൻ പട്ടണങ്ങളെ ഭൗതികമായി മടക്കിക്കൊണ്ടുവന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യെഹോവാശ്/യോവാശ് എന്ന രണ്ടു നാമരൂപങ്ങൾ
  choice: എബ്രായ പാഠത്തിലെ ദീർഘരൂപവും ചുരുക്കരൂപവും വേർതിരിച്ച് നിലനിർത്തി
  alternative: രണ്ടിടത്തും ‘യെഹോവാശ്’ എന്ന ഏകീകൃതരൂപം ഉപയോഗിക്കുക
  rationale: ഇവ രണ്ടും ഒരേ രാജാവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപാഠത്തിലെ യഥാർഥ രൂപവ്യത്യാസം വായനക്കാരനിൽനിന്ന് മറയ്ക്കാതിരിക്കാൻ അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി. ‘കൈയിൽനിന്ന്’ എന്ന സെമിറ്റിക് ദൃശ്യപ്രയോഗം സുതാര്യതയ്ക്കായി നിലനിർത്തി; കാലബന്ധങ്ങൾ മലയാളത്തിൽ വ്യക്തമായി ക്രമപ്പെടുത്തി.
