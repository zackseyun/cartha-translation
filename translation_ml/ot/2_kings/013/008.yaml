source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹאָחָ֛ז וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבוּרָת֑/וֹ הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: The rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: യെഹോവാഹാസിന്റെ മറ്റു പ്രവൃത്തികളും, അവൻ ചെയ്തതൊക്കെയും, അവന്റെ ശക്തിയും[a] ഇസ്രായേൽ രാജാക്കന്മാരുടെ വൃത്താന്തപുസ്തകത്തിൽ[b] എഴുതിയിട്ടില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശക്തി” എന്നത് “പരാക്രമം,” “വീര്യം,” അല്ലെങ്കിൽ “വീരപ്രവൃത്തികൾ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഇസ്രായേൽ രാജാക്കന്മാരുടെ രാജവാർഷികരേഖയിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָחָז
  choice: യെഹോവാഹാസിന്റെ മറ്റു പ്രവൃത്തികളും
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ דִּבְרֵי എന്നത് വെറും വാക്കുകളെയല്ല, രാജാവിനെക്കുറിച്ചുള്ള പ്രവൃത്തികളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു. וְיֶתֶר എന്നതിന്റെ ‘ശേഷിച്ച/മറ്റു’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: എബ്രായ ആപേക്ഷികവാക്യത്തിന്റെ വിശാലമായ അർഥപരിധി ചുരുക്കാതെ നേരെയും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וּגְבוּרָתוֹ
  choice: അവന്റെ വീര്യവും
  rationale: גְּבוּרָה ശക്തി, വീര്യം, പരാക്രമം, ശക്തമായ പ്രവൃത്തികൾ എന്നിവ സൂചിപ്പിക്കാം. ‘വീര്യം’ ഈ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും ഒരു പരിധിവരെ കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടില്ലയോ?
  rationale: രാജാക്കന്മാരെക്കുറിച്ചുള്ള പതിവ് സമാപനസൂത്രത്തിലെ അലങ്കാരചോദ്യത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: വൃത്താന്തപുസ്തകത്തിൽ
  rationale: ഇവിടെ סֵפֶר ഒരു രേഖാഗ്രന്ഥത്തെയും דִּבְרֵי הַיָּמִים രാജകീയ വൃത്താന്തങ്ങളെയും സൂചിപ്പിക്കുന്നു; עַל എന്നത് മലയാളത്തിൽ സന്ദർഭോചിതമായി ‘പുസ്തകത്തിൽ’ എന്നു നൽകുന്നു.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ
  rationale: לְ ഇവിടെ ഉദ്ദേശ്യമല്ല, ബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ഗ്രന്ഥശീർഷകത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥബന്ധരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ അലങ്കാരചോദ്യരൂപവും גְּבוּרָה എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും നിലനിർത്തി; അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ചേർത്തു.
