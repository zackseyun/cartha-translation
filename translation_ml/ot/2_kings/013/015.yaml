- source_word: קַח
  choice: എടുക്കുക
  rationale: לקח എന്ന ക്രിയയുടെ ആജ്ഞാരൂപത്തിന് നേരിട്ടും മാന്യവുമായ സമാനപദം.
- source_word: קֶשֶׁת וְחִצִּים
  choice: ഒരു വില്ലും അമ്പുകളും
  rationale: ആയുധമായ വില്ലിനെയും ബഹുവചനത്തിലുള്ള അമ്പുകളെയും ഹീബ്രുവിലുള്ള ഏകോപനക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּקַּח
