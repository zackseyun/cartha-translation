  text: Then Elisha said to him[a], “Take a bow and arrows.” So he took a bow and arrows.
translation:
  language: ml
  text: 'അപ്പോൾ എലീശാ അവനോടു പറഞ്ഞു: “ഒരു വില്ലും അമ്പുകളും എടുക്കുക.” അവൻ ഒരു വില്ലും അമ്പുകളും അവന്റെ അടുക്കലേക്കു കൊണ്ടുവന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവൻ തനിക്കായി ഒരു വില്ലും അമ്പുകളും എടുത്തു.” എന്നാൽ ഹീബ്രുവിലെ കൂടുതൽ സ്വാഭാവികമായ വായന “അവന്റെ അടുക്കലേക്ക്” എന്നാണ്; ഇവിടെ അത് എലീശായെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
