base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
translation:
  language: ml
  text: എന്നാൽ യഹ്‌വേ അവരോടു കൃപ കാണിക്കുകയും അവരോടു കരുണ കാണിക്കുകയും ചെയ്തു. അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും ചെയ്ത തന്റെ ഉടമ്പടി നിമിത്തം[a] അവൻ അവരിലേക്കു തിരിഞ്ഞു. അവരെ നശിപ്പിക്കാൻ അവനു മനസ്സില്ലായിരുന്നു; ഇന്നുവരെ അവരെ തന്റെ സന്നിധിയിൽനിന്നു തള്ളിക്കളഞ്ഞതുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും ചെയ്ത തന്റെ ഉടമ്പടിക്കുവേണ്ടി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחָן
  choice: കൃപ കാണിച്ചു
  rationale: חנן സൂചിപ്പിക്കുന്ന അനുകൂലമായ കൃപയും ദയയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവികനാമമായ יהוה-യെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וַיְרַחֲמֵם
  choice: അവരോടു കരുണ തോന്നി
  rationale: רחם എന്ന പദത്തിലെ ആഴമുള്ള അനുകമ്പയുടെ ഭാവം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: וַיִּפֶן אֲלֵיהֶם
  choice: അവൻ അവരിലേക്കു തിരിഞ്ഞു
  rationale: അനുകൂലമായ ശ്രദ്ധയെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ‘തിരിയുക’ എന്ന ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: לְמַעַן בְּרִיתוֹ
  choice: തന്റെ ഉടമ്പടി നിമിത്തം
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനത്തിന്റെ അടിസ്ഥാനമോ പ്രേരണയോ ഉടമ്പടിയാണെന്ന ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഉദ്ദേശ്യാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶת אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും ചെയ്ത
  rationale: ഹീബ്രായയിലെ സങ്കുചിത പ്രയോഗം പിതാക്കന്മാരോടു ചെയ്ത ഉടമ്പടിയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആവശ്യമായ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: וְלֹא אָבָה הַשְׁחִיתָם
  choice: അവരെ നശിപ്പിക്കാൻ അവനു മനസ്സില്ലായിരുന്നു
  rationale: אָבָה എന്ന ക്രിയയിലെ ഇച്ഛയുടെയോ സമ്മതത്തിന്റെയോ ഭാവം കേവലം ‘നശിപ്പിച്ചില്ല’ എന്നതിനെക്കാൾ കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  choice: അവരെ തന്റെ സന്നിധിയിൽനിന്നു തള്ളിക്കളഞ്ഞതുമില്ല
  rationale: ‘തന്റെ മുഖത്തുനിന്ന്/മുമ്പിൽനിന്ന് എറിഞ്ഞുകളയുക’ എന്ന ഹീബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: עַד עָתָּה
  choice: ഇന്നുവരെ
  rationale: വിവരകന്റെ കാലംവരെ അവസ്ഥ തുടർന്നുവെന്ന ആശയം മലയാളത്തിലെ പതിവായ പ്രയോഗത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവികനാമമായ יהוה-യുടെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ ‘Yahweh’ എന്ന രൂപത്തിന് അടുത്ത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ദൈവകരുണയുടെ ഉടമ്പടിപരമായ അടിസ്ഥാനം
  choice: തന്റെ ഉടമ്പടി നിമിത്തം
  alternative: തന്റെ ഉടമ്പടിക്കുവേണ്ടി
  rationale: לְמַעַן ഇവിടെ ദൈവത്തിന്റെ കൃപാപൂർവമായ പിന്തിരിയലിന് ഉടമ്പടി അടിസ്ഥാനമാണെന്നു സൂചിപ്പിക്കുന്നു. കാരണാർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചെങ്കിലും ഉദ്ദേശ്യ/ഹിതാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘കൃപ കാണിച്ചു’, ‘കരുണ തോന്നി’, ‘സന്നിധി’ തുടങ്ങിയ പൊതുവായി മനസ്സിലാകുന്ന വാക്കുകൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ആവർത്തനവും ദൈവത്തിന്റെ ഇച്ഛയെക്കുറിച്ചുള്ള സൂക്ഷ്മതയും നിലനിർത്തി.
