id: 2KI.13.19
reference: 2 Kings 13:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְצֹ֨ף עָלָ֜י/ו אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּ֨אמֶר֙ לְ/הַכּ֨וֹת חָמֵ֤שׁ אוֹ שֵׁשׁ֙ פְּעָמִ֔ים אָ֛ז הִכִּ֥יתָ אֶת אֲרָ֖ם עַד כַּלֵּ֑ה וְ/עַתָּ֕ה שָׁלֹ֥שׁ פְּעָמִ֖ים תַּכֶּ֥ה אֶת אֲרָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/019.yaml
  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
translation:
  language: ml
  text: 'അപ്പോൾ ദൈവപുരുഷൻ അവനോടു കോപിച്ചു പറഞ്ഞു[a]: “നീ അഞ്ചോ ആറോ പ്രാവശ്യം നിലത്ത് അടിക്കേണ്ടതായിരുന്നു; അപ്പോൾ അരാമിനെ പൂർണമായി പരാജയപ്പെടുത്തുംവരെ നീ അതിനെതിരെ പ്രഹരിക്കുമായിരുന്നു[b]. എന്നാൽ ഇപ്പോൾ നീ അരാമിനെതിരെ മൂന്നു പ്രാവശ്യം മാത്രം പ്രഹരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായമൂലത്തിൽ ഇവിടെ ‘അടിക്കാൻ’ എന്നു മാത്രമാണ് ഉള്ളത്; ‘നിലത്ത്’ എന്നത് 18-ാം വാക്യത്തിലെ തൊട്ടുമുമ്പുള്ള പ്രവൃത്തിയിൽനിന്ന് ചേർത്തതാണ്.
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘അരാമിന് അവസാനം വരുത്തുംവരെ’ / ‘അരാമിനെ പൂർണമായി പരാജയപ്പെടുത്തുംവരെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: കോപിച്ച്
  rationale: קצף കോപത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ശാസനയുടെ ശക്തി അതിരുകടക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: എബ്രായയിലെ സ്ഥിരപ്രയോഗമായ ‘ദൈവത്തിന്റെ പുരുഷൻ’ എന്നതിന്റെ മലയാള ബൈബിൾശൈലിയിലുള്ള സംക്ഷിപ്തവും മാന്യവുമായ രൂപം; ‘പ്രവാചകൻ’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: לְהַכּוֹת
  choice: നിലത്ത് അടിക്കേണ്ടതായിരുന്നു
  rationale: മൂലപാഠത്തിൽ കർമം പ്രസ്താവിച്ചിട്ടില്ലെങ്കിലും 18-ാം വാക്യത്തിലെ തൊട്ടുമുമ്പുള്ള പ്രവൃത്തിയിൽനിന്ന് ‘നിലത്ത്’ വ്യക്തമാണ്; മലയാളത്തിൽ വാക്യം സുഗ്രാഹ്യമാക്കാൻ അത് ചേർത്തിരിക്കുന്നു.
- source_word: חָמֵשׁ אוֹ שֵׁשׁ פְּעָמִים
  choice: അഞ്ചോ ആറോ പ്രാവശ്യം
  rationale: സംഖ്യാവാചകം നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִכִּיתָ אֶת אֲרָם
  choice: അരാമിനെ … തോൽപ്പിക്കുമായിരുന്നു
  rationale: נכה എന്ന ഒരേ ക്രിയ അടിക്കുന്നതിനും യുദ്ധത്തിൽ പ്രഹരിച്ച് കീഴടക്കുന്നതിനും ഉപയോഗിച്ചിരിക്കുന്നു. മലയാളത്തിൽ ‘അരാമിനെ അടിക്കുക’ അസ്വാഭാവികവും അർഥസന്ദിഗ്ധവുമായതിനാൽ സൈനികഫലം വ്യക്തമാക്കുന്ന ‘തോൽപ്പിക്കുക’ സ്വീകരിച്ചു.
- source_word: עַד כַּלֵּה
  choice: നിർമാർജനം ചെയ്യുന്നതുവരെ
  rationale: כלה ഇവിടെ അരാമിന്റെ സൈനികശക്തിയെ പൂർണമായി അവസാനിപ്പിക്കുന്ന ആശയം നൽകുന്നു; ‘പൂർണമായി നശിപ്പിക്കുക’ എന്നതിനെക്കാൾ കുറച്ച് നിയന്ത്രിതമായിട്ടും സമാപ്തിയുടെ ശക്തി നിലനിർത്തുന്ന പ്രയോഗം.
- source_word: וְעַתָּה
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: സാധ്യമായിരുന്ന പൂർണവിജയവും ഇനി സംഭവിക്കാനിരിക്കുന്ന പരിമിതവിജയവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  choice: നീ അരാമിനെ മൂന്നു പ്രാവശ്യം മാത്രമേ തോൽപ്പിക്കുകയുള്ളൂ
  rationale: അപൂർണക്രിയ ഇവിടെ പ്രവചനാത്മകമാണ്. അഞ്ചോ ആറോ പ്രാവശ്യത്തിനു വിരുദ്ധമായി പരിമിതി സൂചിപ്പിക്കുന്ന ‘മാത്രമേ’ സന്ദർഭത്തിൽ അന്തർനിഹിതമാണ്.
theological_decisions:
- issue: നിലത്ത് അടിക്കുന്ന പ്രതീകപ്രവൃത്തിയും അരാമിനെതിരായ വിജയങ്ങളും തമ്മിലുള്ള ബന്ധം
  choice: ആദ്യത്തേതിൽ ‘നിലത്ത് അടിക്കുക’ എന്നും സൈനികഫലത്തിൽ ‘അരാമിനെ തോൽപ്പിക്കുക’ എന്നും നൽകി.
  alternative: രണ്ടിടത്തും ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന ഒരേ ക്രിയ ഉപയോഗിക്കുക.
  rationale: മൂലത്തിലെ ക്രിയാപുനരാവർത്തനം പ്രതീകബന്ധം ഉറപ്പിക്കുന്നു. എങ്കിലും ‘അരാമിനെ അടിക്കുക’ സ്വാഭാവിക മലയാളമല്ല; ആവർത്തനസംഖ്യയും ചേർന്ന വാക്യഘടനയും ബന്ധം മതിയായ വിധം നിലനിർത്തുന്നു.
- issue: עַד כַּלֵּה എത്ര ശക്തമായി വിവർത്തനം ചെയ്യണം
  choice: നിർമാർജനം ചെയ്യുന്നതുവരെ
  alternative: പൂർണമായി നശിപ്പിക്കുന്നതുവരെ / അവസാനിപ്പിക്കുന്നതുവരെ
  rationale: പൂർണതയുടെയോ സമാപ്തിയുടെയോ ആശയം സംരക്ഷിക്കുമ്പോഴും ജനസമൂഹത്തിന്റെ സമ്പൂർണ ഉന്മൂലനം എന്നു നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല; സൈനികസന്ദർഭത്തിലെ അർഥവ്യാപ്തി തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദൈവപുരുഷൻ’ എന്ന പരിചിത ബൈബിൾപദം നിലനിർത്തി; യുദ്ധസന്ദർഭത്തിൽ അസ്വാഭാവികമായ പദാനുപദ വിവർത്തനത്തിനു പകരം ‘തോൽപ്പിക്കുക’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
