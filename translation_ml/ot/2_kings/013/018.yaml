  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
translation:
  language: ml
  text: 'പിന്നെ അവൻ പറഞ്ഞു: “അമ്പുകൾ എടുക്കുക.” രാജാവ് അവ എടുത്തു. അവൻ ഇസ്രായേൽ രാജാവിനോട്, “നിലത്തു അടിക്കുക” എന്നു പറഞ്ഞു. രാജാവ് മൂന്നു പ്രാവശ്യം അടിച്ചിട്ട് നിർത്തി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്നു”; ഹീബ്രു ക്രിയയുടെ പദശാബ്ദിക അർഥം “നിന്നു” എന്നാണ്. ഇവിടെ മൂന്നു പ്രാവശ്യം അടിച്ചതിനുശേഷം അവൻ നിർത്തിയെന്ന അർഥത്തിലാണ് അത് പ്രയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: എടുക്കുക
  rationale: לקח എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം; കല്പനയുടെ നേരിട്ടുള്ള സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַחִצִּים
  choice: അമ്പുകൾ
  rationale: നിശ്ചിത ബഹുവചന നാമം. മുൻസന്ദർഭത്തിൽ അറിയപ്പെടുന്ന അമ്പുകളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ പ്രത്യേക നിർദേശപദം ചേർക്കാതെ സ്വാഭാവികമായി പറയുന്നു.
- source_word: וַיִּקָּח
  choice: രാജാവ് അവ എടുത്തു
  rationale: ഹീബ്രുവിൽ കർത്താവ് സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നു; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘രാജാവ്’ എന്നും, അമ്പുകളെ സൂചിപ്പിക്കാൻ ‘അവ’ എന്നും വ്യക്തമാക്കുന്നു.
- source_word: לְמֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവിനോട്
  rationale: പദബന്ധത്തിന്റെ അർഥം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַךְ
  choice: അടിക്കുക
  rationale: נכה എന്ന ക്രിയ ഇവിടെ ശക്തിയായി പ്രഹരിക്കാനുള്ള ആജ്ഞയാണ്. ‘എയ്യുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലത്തിൽ വ്യക്തമല്ലാത്ത പ്രവർത്തനം ചേർക്കും; ‘അടിക്കുക’ നിലത്തോടുള്ള ക്രിയാബന്ധം സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: אַרְצָה
  choice: നിലത്ത്
  rationale: ദിശാസൂചക രൂപം താഴെയുള്ള ഭൂതലത്തിലേക്കുള്ള പ്രഹരത്തെ സൂചിപ്പിക്കുന്നു; ‘നിലത്ത്’ ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיַּךְ
  choice: അടിച്ചു
  rationale: ആജ്ഞയിലെ അതേ പ്രവർത്തനം ആവർത്തിക്കുന്നു; മലയാളത്തിൽ ‘നിലത്ത്’ എന്ന കർമബന്ധം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ വീണ്ടും ചേർക്കേണ്ടതില്ല.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: മൂന്നു പ്രാവശ്യം
  rationale: സംഖ്യയും ആവർത്തനവും വ്യക്തമാക്കുന്ന സാധാരണ മലയാള പ്രയോഗം.
- source_word: וַיַּעֲמֹד
  choice: നിർത്തി
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘നിന്നു’ എന്നാണെങ്കിലും, ആവർത്തിച്ചുള്ള അടിക്കലിനു ശേഷം ഇവിടെ പ്രവർത്തനം അവസാനിപ്പിച്ചു എന്ന സന്ദർഭാർഥമാണ് സ്വാഭാവികം; പദശാബ്ദിക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
