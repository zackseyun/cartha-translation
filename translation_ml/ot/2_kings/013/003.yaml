source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֗ם וּ/בְ/יַ֛ד בֶּן הֲדַ֥ד בֶּן חֲזָאֵ֖ל כָּל הַ/יָּמִֽים־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
translation:
  language: ml
  text: അങ്ങനെ യഹ്‌വേയുടെ കോപം ഇസ്രായേലിനെതിരെ ജ്വലിച്ചു. അവൻ അവരെ അരാംരാജാവായ ഹസായേലിന്റെ കൈയിലും ഹസായേലിന്റെ മകനായ ബെൻ-ഹദദിന്റെ കൈയിലും[a] ആ കാലമത്രയും[b] ഏൽപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൈയിൽ” എന്നത് ഒരാളുടെ അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിൽ എന്നർഥമുള്ള എബ്രായ ശൈലിയാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'പദശഃ: “എല്ലാ ദിവസങ്ങളിലും”; അതായത്, ആ കാലഘട്ടം മുഴുവനും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: കോപം ... ജ്വലിച്ചു
  rationale: കോപം ‘ജ്വലിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിലെ സജീവമായ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവികനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെ
  rationale: കോപം സൂചിപ്പിക്കുന്ന ക്രിയയോടൊപ്പം ഈ മുൻപ്രത്യയം കോപം ആരുടെ നേരെയാണെന്നത് വ്യക്തമാക്കുന്നു.
- source_word: וַיִּתְּנֵם
  choice: അവിടുന്ന് അവരെ ... ഏല്പിച്ചു
  rationale: സൈനിക ന്യായവിധിയുടെ സന്ദർഭത്തിൽ ‘കൈയിൽ കൊടുത്തു’ എന്ന ആശയം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּיַד
  choice: കൈയിൽ
  rationale: അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിൽ എന്ന എബ്രായ ശൈലി അതിന്റെ മൂലദൃശ്യത്തോടെ നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: അരാംരാജാവായ ഹസായേൽ
  rationale: ഭൂനാമമായ അരാം നേരിട്ട് നിലനിർത്തുകയും വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: בֶּן־הֲדַד בֶּן־חֲזָאֵל
  choice: ഹസായേലിന്റെ മകനായ ബെൻ-ഹദദ്
  rationale: പേരും പിതൃബന്ധവും മൂലപാഠത്തിലെന്നപോലെ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: כָּל הַיָּמִים
  choice: അക്കാലമൊക്കെയും
  rationale: ആ കാലഘട്ടം മുഴുവനും എന്ന കാലദൈർഘ്യം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവികനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ അതിനെ ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ കോപം ജ്വലിക്കുന്ന രൂപകവും ‘കൈയിൽ’ എന്ന അധികാരശൈലിയും നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പുകളുടെ മാർക്കർ-ഉള്ളടക്ക പൊരുത്തക്കേട് മൂലപാഠത്തിന്റെ അടിസ്ഥാനത്തിൽ തിരുത്തി; ‘അരാം’ നേരിട്ട് പാഠത്തിൽ ഉള്ളതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
