source:
  edition: WLC
  text: כִּ֣י לֹא֩ הִשְׁאִ֨יר לִ/יהוֹאָחָ֜ז עָ֗ם כִּ֣י אִם חֲמִשִּׁ֤ים פָּֽרָשִׁים֙ וַ/עֲשָׂ֣רָה רֶ֔כֶב וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים רַגְלִ֑י כִּ֤י אִבְּדָ/ם֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יְשִׂמֵ֥/ם כֶּֽ/עָפָ֖ר לָ/דֻֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
translation:
  language: ml
  text: അവൻ യെഹോവാഹാസിന് അമ്പത് കുതിരപ്പടയാളികളും പത്തു രഥങ്ങളും പതിനായിരം കാലാൾപ്പടയാളികളും അല്ലാതെ സൈന്യമായി ഒന്നും ശേഷിപ്പിച്ചില്ല; അരാംരാജാവ് അവരെ നശിപ്പിച്ച് മെതിക്കാനുള്ള പൊടിപോലെയാക്കിയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മെതിക്കപ്പെടേണ്ട പൊടിപോലെ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് ധാന്യം മെതിക്കുന്നതിന്റെയും ചവിട്ടുന്നതിന്റെയും ദൃശ്യബിംബം നൽകാൻ കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁאִיר
  choice: ശേഷിപ്പിച്ചില്ല
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘ശേഷിക്കാൻ ഇടയാക്കുക/ശേഷിപ്പിക്കുക’ എന്ന ഫലകാരണ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עָם
  choice: സൈനികരാരെയും
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ജനം/ആളുകൾ’ ആണെങ്കിലും, പിന്നാലെ കുതിരപ്പടയാളികൾ, രഥങ്ങൾ, കാലാൾപ്പടയാളികൾ എന്നിങ്ങനെ കൊടുക്കുന്ന സൈനിക പട്ടിക ഇവിടെ സൈന്യത്തിലെ ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כִּי אִם
  choice: അല്ലാതെ
  rationale: നിഷേധവാക്യത്തിനു ശേഷം ശേഷിച്ച ഏക വിഭാഗത്തെ അവതരിപ്പിക്കുന്ന ‘ഒഴികെ/അല്ലാതെ’ എന്ന അർഥം ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: פָּרָשִׁים
  choice: കുതിരപ്പടയാളികൾ
  rationale: കുതിരപ്പുറത്തു പോരാടുന്ന സൈനികരെ സാധാരണ വായനക്കാർക്കു വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: רֶכֶב
  choice: രഥങ്ങൾ
  rationale: ഏകവചനരൂപം ഇവിടെ സംഖ്യയോടുകൂടെ സൈനിക രഥങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: רַגְלִי
  choice: കാലാൾപ്പടയാളികൾ
  rationale: കാൽനടയായി യുദ്ധം ചെയ്യുന്ന സൈനികർ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אִבְּדָם
  choice: അവരെ നശിപ്പിച്ച്
  rationale: പീയേൽ രൂപത്തിലെ ശക്തമായ നാശാർഥം നിലനിർത്തുന്നു; കർമപ്രത്യയം യെഹോവാഹാസിന്റെ സൈനികരെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיְשִׂמֵם
  choice: അവരെ ... പോലെയാക്കിയിരുന്നു
  rationale: തുടർന്നുവരുന്ന ഉപമയോടൊപ്പം ‘ഒരു അവസ്ഥയിലാക്കുക’ എന്ന שׂים എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כֶּעָפָר לָדוּשׁ
  choice: മെതിക്കുമ്പോഴുള്ള പൊടിപോലെ
  rationale: ധാന്യം മെതിക്കുന്നതും ചവിട്ടുന്നതുമായ ദൃശ്യബിംബം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു; ഹീബ്രു പ്രയോഗത്തിന്റെ മറ്റൊരു ഘടനാപരമായ വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: הִשְׁאִיר എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: അവൻ
  alternative: അരാംരാജാവ്
  rationale: ഹീബ്രു വാക്യത്തിലെ ആദ്യക്രിയയ്ക്ക് കർത്താവിനെ പേരെടുത്ത് വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ മലയാളത്തിലും സർവനാമം ഉപയോഗിച്ച് പാഠത്തിലെ സൂചനാത്മകത നിലനിർത്തുന്നു; പിന്നീട് അരാംരാജാവിനെ വ്യക്തമായി പേരെടുക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സഭാവായനയ്ക്കും സാധാരണ വായനയ്ക്കും അനുയോജ്യമായ ഗൗരവമുള്ള മലയാളം. സൈനിക പദങ്ങൾ വ്യക്തതയ്ക്കായി സന്ദർഭാനുസൃതമായി നൽകിയിരിക്കുന്നു; വ്യക്തമാക്കാത്ത കർത്താവിനെ അനാവശ്യമായി നിർണയിച്ചിട്ടില്ല.
