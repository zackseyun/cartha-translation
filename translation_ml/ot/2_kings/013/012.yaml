source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י יוֹאָשׁ֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְב֣וּרָת֔/וֹ אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: The rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: യോവാശിന്റെ ശേഷിച്ച പ്രവൃത്തികളും, അവൻ ചെയ്തതൊക്കെയും, യെഹൂദാരാജാവായ അമസ്യാവിനെതിരെ അവൻ പോരാടിയ അവന്റെ പരാക്രമവും[a]—അവ ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[b] എഴുതിയിട്ടില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദാരാജാവായ അമസ്യാവിനോടു പോരാടിയ വിധവും.” എബ്രായത്തിലെ ഉപസർഗത്തിന് അക്ഷരാർഥത്തിൽ “കൂടെ/ഒപ്പം” എന്നാണെങ്കിലും, ഈ സൈനികസന്ദർഭത്തിൽ അത് ശത്രുതാപരമായ ഏറ്റുമുട്ടലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ പറയുന്ന “ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം” രാജാക്കന്മാരുടെ ഗ്രന്ഥത്തിൽ ഉദ്ധരിക്കപ്പെടുന്ന രാജകീയ രേഖാസമാഹാരമാണ്; അത് ബൈബിളിലെ ദിനവൃത്താന്തപുസ്തകമല്ല.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: യോവാശിന്റെ ശേഷിച്ച പ്രവൃത്തികളും
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ דִּבְרֵי എന്നത് വെറും ‘വാക്കുകൾ’ എന്നതിലുപരി രാജാവിന്റെ പ്രവൃത്തികളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു; וְיֶתֶר ശേഷിച്ചവയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: כָל എന്നതിന്റെ സമഗ്രതയും עָשָׂה എന്ന പൊതുവായ ക്രിയയുടെ വ്യാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּגְבוּרָתוֹ
  choice: അവൻ പ്രകടമാക്കിയ വീര്യവും
  rationale: גְבוּרָה ശക്തി, വീര്യം, പരാക്രമം എന്നിവ സൂചിപ്പിക്കാം. തുടർന്നുള്ള യുദ്ധസന്ദർഭവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘പ്രകടമാക്കിയ വീര്യം’ എന്നു നൽകി.
- source_word: אֲשֶׁר נִלְחַם עִם
  choice: പോരാടിയപ്പോൾ
  rationale: ബന്ധവാക്യം അവന്റെ വീര്യം യുദ്ധത്തിൽ പ്രകടമായതിനെ വിവരിക്കുന്നു. עִם അക്ഷരാർഥത്തിൽ ‘കൂടെ/ഒപ്പം’ എന്നായാലും ഇവിടെ ശത്രുതാപരമായ ഏറ്റുമുട്ടലാണ് ഉദ്ദേശ്യം; അതിനാൽ പ്രതിയോഗിയെ ‘എതിരെ’ എന്നു വ്യക്തമാക്കി.
- source_word: אֲמַצְיָה מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ അമസ്യാവ്
  rationale: വ്യക്തിനാമവും രാജപദവിയും സാധാരണ മലയാള വാക്യഘടനയിൽ ചേർത്തു.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: അവ ... എഴുതിയിട്ടില്ലയോ?
  rationale: മൂലത്തിലെ നിഷേധരൂപത്തിലുള്ള ആലങ്കാരിക ചോദ്യവും ബഹുവചന സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ
  rationale: עַל എന്നത് എഴുത്തുസ്രോതസ്സിനെക്കുറിച്ച് മലയാളത്തിൽ സ്വാഭാവികമായ ‘-ത്തിൽ’ ആയി നൽകി; ദർബാർ രേഖാസമാഹാരത്തിന്റെ പരമ്പരാഗത ശീർഷകസ്വഭാവം ‘ദിനവൃത്താന്തപുസ്തകം’ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. രാജഭരണസംഗ്രഹത്തിന്റെ ആലങ്കാരിക ചോദ്യരൂപം നിലനിർത്തി; അനാവശ്യമായ ആരംഭകാലസൂചകം ചേർത്തിട്ടില്ല.
