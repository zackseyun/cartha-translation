  source_fidelity: The draft accurately preserves the regnal-summary formula, the rhetorical question, the annalistic source, and the adversarial sense of עִם. However, “പോരാടിയപ്പോൾ അവൻ പ്രകടമാക്കിയ വീര്യം” recasts the Hebrew relative clause as a temporal clause (‘when he fought’) and adds ‘expressed/displayed,’ which is not stated in the source. The clause should more directly qualify Joash’s might/valor as that with which he fought Amaziah.
