  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
translation:
  language: ml
  text: അപ്പോൾ ഏലായുടെ മകനായ ഹോശേയ, രെമല്യാവിന്റെ മകനായ പേക്കഹിനെതിരെ ഗൂഢാലോചന നടത്തി[a]. അവൻ പേക്കഹിനെ അടിച്ചുവീഴ്ത്തി കൊന്നു; അവന്റെ സ്ഥാനത്ത് രാജാവായി. ഉസ്സീയാവിന്റെ മകനായ യോഥാമിന്റെ ഇരുപതാം ഭരണവർഷത്തിലായിരുന്നു ഇത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥത്തിൽ ‘ഗൂഢാലോചന ഗൂഢാലോചിച്ചു’ എന്ന ഒരേ ധാതുവിലുള്ള ക്രിയയും നാമവും ചേർന്ന ഊന്നൽപ്രയോഗമാണ്; രാജാവിനെതിരെയുള്ള ഉറച്ച ഗൂഢപദ്ധതിയെ ഇതു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠം ‘ഉസ്സീയാവിന്റെ മകനായ യോഥാമിന്റെ ഇരുപതാം ഭരണവർഷത്തിൽ’ എന്നാണ്. രാജാക്കന്മാരിലെ മറ്റു ഭരണകാലവിവരങ്ങളുമായി ഇത് ഒരു കാലക്രമപ്രശ്നം സൃഷ്ടിക്കുന്നു. ചിലർ ഇതിനെ ആഹാസിന്റെ ഭരണകാലവുമായി പൊരുത്തപ്പെടുത്താൻ ശ്രമിക്കുന്നുവെങ്കിലും, പരിഭാഷ എബ്രായപാഠത്തിലെ വാക്കുകൾ തന്നെയാണ് പിന്തുടരുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  choice: ഗൂഢാലോചന നടത്തി
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയും നാമവും ചേർന്ന എബ്രായ ഊന്നൽപ്രയോഗം മലയാളത്തിൽ അതേപടി ആവർത്തിച്ചാൽ അസ്വാഭാവികമാകും. അർത്ഥവും ഗൗരവവും സ്വാഭാവികമായി അറിയിക്കാൻ ‘ഗൂഢാലോചന നടത്തി’ എന്നു പരിഭാഷപ്പെടുത്തി; മൂലഭാഷയിലെ ഘടന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: הוֹשֵׁעַ בֶּן אֵלָה
  choice: ഏലായുടെ മകനായ ഹോശേയ
  rationale: വ്യക്തിനാമങ്ങളും പിതൃപരാമർശവും ചരിത്രപരമായ തിരിച്ചറിയലിനായി നിലനിർത്തി.
- source_word: עַל פֶּקַח בֶּן רְמַלְיָהוּ
  choice: രെമല്യാവിന്റെ മകനായ പേക്കഹിനെതിരെ
  rationale: ഗൂഢാലോചനയുടെ സന്ദർഭത്തിൽ עַל ശത്രുതാപരമായ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘എതിരെ’ എന്നു നൽകി.
- source_word: וַיַּכֵּהוּ וַיְמִיתֵהוּ
  choice: അവൻ പേക്കഹിനെ വീഴ്ത്തി കൊന്നശേഷം
  rationale: ആക്രമിച്ചു വീഴ്ത്തുന്നതും മരണത്തിനിടയാക്കുന്നതുമായ തുടർച്ച നിലനിർത്തുന്നു. മലയാളത്തിൽ അനാവശ്യമായ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ പേക്കഹിന്റെ പേര് ആവർത്തിച്ചു.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: അവനു പകരം രാജാവായി
  rationale: രാജ്യാധികാരത്തിലെ അനന്തരാവകാശം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  choice: ഉസ്സീയാവിന്റെ മകനായ യോഥാമിന്റെ ഇരുപതാം ഭരണവർഷത്തിൽ
  rationale: രാജഭരണവർഷം സൂചിപ്പിക്കുന്ന എബ്രായ കാലനിർണ്ണയസൂത്രം അതിലെ കാലക്രമപ്രശ്നം പരിഹരിക്കാൻ ശ്രമിക്കാതെ നേരിട്ട് നിലനിർത്തി.
theological_decisions:
- issue: രാജഭരണകാലസൂത്രത്തിലെ കാലക്രമപരമായ സംഘർഷം
  choice: ‘ഉസ്സീയാവിന്റെ മകനായ യോഥാമിന്റെ ഇരുപതാം ഭരണവർഷം’ എന്ന മസൊരറ്റിക് വായന അതേപടി പരിഭാഷപ്പെടുത്തി.
  alternative: ആഹാസിന്റെ ഭരണകാലവുമായി പരോക്ഷമായി പൊരുത്തപ്പെടുത്തുകയോ പാഠം തിരുത്തുകയോ ചെയ്യുക.
  rationale: രാജാക്കന്മാരിലെ മറ്റു ഭരണകാലവിവരങ്ങളുമായി ഇവിടെ ഒരു കാലക്രമപ്രശ്നമുണ്ട്. വ്യക്തമായ പാഠസാക്ഷ്യമില്ലാതെ പ്രധാനപാഠം തിരുത്തുകയോ സംഘർഷം മറച്ചുവയ്ക്കുകയോ ചെയ്യാതെ, പ്രശ്നം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനാത്മക ഊന്നൽ മലയാളത്തിലെ അസ്വാഭാവിക പദാവർത്തനമായി നൽകാതെ അടിക്കുറിപ്പിൽ സുതാര്യമാക്കി. കാലക്രമപരമായ സംഘർഷം പ്രധാനപാഠത്തിൽ പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
