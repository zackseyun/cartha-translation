id: 2KI.15.26
reference: 2 Kings 15:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י פְקַחְיָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/026.yaml
  text: The rest of the acts of Pekahiah[a], and all that he did, behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ml
  text: പെക്കഹ്യാവിന്റെ ശേഷിച്ച പ്രവൃത്തികളും[a] അവൻ ചെയ്തതൊക്കെയും ഇതാ, ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പെക്കഹ്യാവിന്റെ ശേഷിച്ച ഭരണകാര്യങ്ങളും ... ഇസ്രായേൽരാജാക്കന്മാരുടെ വൃത്താന്തങ്ങളിൽ എഴുതിയിരിക്കുന്നുവല്ലോ.”
    reason: דִּבְרֵי എന്നത് ‘പ്രവൃത്തികൾ’ എന്നതിനുപുറമേ ‘കാര്യങ്ങൾ’ എന്നും, הִנָּם എന്നത് ‘ഇതാ’ എന്നതിനുപകരം ഉറപ്പുനൽകുന്ന ഭാവത്തിലും മനസ്സിലാക്കാം; രേഖയുടെ പേര് ‘ദിനവൃത്താന്തപുസ്തകം’ എന്നതിനുപകരം ‘വൃത്താന്തങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: ശേഷിച്ച പ്രവൃത്തികളും
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ ഈ പ്രയോഗം രാജാവിന്റെ ശേഷിച്ച വാക്കുകളെയല്ല, പ്രവൃത്തികളെയും ഭരണകാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു. വാക്യത്തിലെ ‘-ഉം’ എബ്രായ സംയോജകത്തിന്റെ ബന്ധകശക്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: פְקַחְיָה
  choice: പെക്കഹ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ ബൈബിൾനാമരീതിക്ക് യോജിച്ചവിധം ലിപ്യന്തരിച്ചു.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: עשה എന്ന ക്രിയയുടെ വിശാലമായ അർഥപരിധി ചുരുക്കാതെ ബന്ധവാക്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הִנָּם
  choice: ഇതാ
  rationale: തുടർന്ന് പറയുന്ന രേഖയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ അവതരണകണത്തിന്റെ അടയാളപ്പെടുത്തിയ വാചകബലം സംരക്ഷിക്കുന്നു.
- source_word: כְּתוּבִים
  choice: എഴുതിയിരിക്കുന്നു
  rationale: നിഷ്ക്രിയ കൃതന്തത്തിന്റെ അർഥം നേരിട്ട് നൽകുകയും രേഖയിൽ ഇപ്പോഴും ഉള്ളതായി സൂചിപ്പിക്കുന്ന നിലപാട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘പുസ്തകത്തിന്മേൽ’ എന്നു വരാമെങ്കിലും രേഖാസൂത്രവാക്യത്തിൽ മലയാളത്തിന്റെ സ്വാഭാവിക പ്രയോഗം ‘പുസ്തകത്തിൽ’ എന്നതാണ്.
- source_word: דִּבְרֵי הַיָּמִים
  choice: ദിനവൃത്താന്ത
  rationale: ദിവസങ്ങളിലെ സംഭവങ്ങളുടെ ഔദ്യോഗിക വാർഷികരേഖയെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം സംക്ഷിപ്തവും പരിചിതവുമായി നൽകുന്നു.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ
  rationale: രേഖയുടെ ശീർഷകബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥസംബന്ധരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ രാജവൃത്താന്തശൈലി. ‘ഇതാ’ എന്ന അടയാളപ്പെടുത്തിയ അവതരണപദം മൂലപാഠത്തിന്റെ വാചകബലം കാത്തുസൂക്ഷിക്കാനായി നിലനിർത്തി; മുന്നിൽ സ്വതന്ത്രമായ ‘ഇപ്പോൾ’ പോലുള്ള കാലസൂചകം ചേർത്തിട്ടില്ല.
