  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. രാഷ്ട്രീയ പിന്തുണയെ സൂചിപ്പിക്കുന്ന ‘കൈ കൂടെയായിരിക്കുക’ എന്ന ഹീബ്രായ രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അതിന്റെ ഭാവാർഥം അടിക്കുറിപ്പിൽ നൽകി. ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് ക്രമത്തിലെ അസ്വാഭാവികത തിരുത്തി ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങൾക്ക് പിന്നാലെ [b], [a] എന്നിങ്ങനെ ചേർത്തു.
