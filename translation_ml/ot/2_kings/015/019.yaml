  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
translation:
  language: ml
  text: അശ്ശൂർരാജാവായ പൂൽ ദേശത്തിനെതിരെ വന്നു.[b] മെനഹേം പൂലിന് ആയിരം താലന്ത് വെള്ളി കൊടുത്തു; മെനഹേമിന്റെ കൈവശം രാജഭരണം ഉറപ്പിക്കുന്നതിന് പൂലിന്റെ കൈ മെനഹേമിനോടുകൂടെ ഉണ്ടായിരിക്കേണ്ടതിനായിരുന്നു അത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഭാവാർഥമായി: ‘മെനഹേമിന്റെ നിയന്ത്രണത്തിലുള്ള രാജഭരണം ഉറപ്പിക്കുന്നതിൽ പൂൽ മെനഹേമിനെ പിന്തുണയ്ക്കേണ്ടതിനായിരുന്നു അത്.’ ഹീബ്രായപാഠം അക്ഷരാർഥത്തിൽ, ‘രാജഭരണം അവന്റെ കയ്യിൽ ഉറപ്പിക്കാൻ അവന്റെ കൈ അവനോടുകൂടെ ഉണ്ടായിരിക്കേണ്ടതിന്’ എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ‘ദേശം’ എന്നത് സാധ്യതയേറിയവിധം ഇസ്രായേൽദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: בָּא
  choice: വന്നു
  rationale: കഥനസന്ദർഭത്തിലെ Qal perfect സ്വാഭാവികമായി ‘വന്നു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: פ֤וּל
  choice: പൂൽ
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: מֶֽלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവായ
  rationale: ഹീബ്രായ construct ബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ദേശത്തിനെതിരെ
  rationale: സൈനിക നീക്കത്തെ സൂചിപ്പിക്കുന്ന בוא-യോടൊപ്പമുള്ള עַל ഇവിടെ ശത്രുതാപൂർവമായ വരവ് എന്ന അർഥം നൽകുന്നു; הָאָרֶץ എന്നതിനെ അതിലധികം വ്യക്തമാക്കാതെ ‘ദേശം’ എന്നു നിലനിർത്തി.
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; രാഷ്ട്രീയ കപ്പം/പിന്തുണവില എന്ന ആശയം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: אֶלֶף כִּכַּר כָּסֶף
  choice: ആയിരം താലന്ത് വെള്ളി
  rationale: പുരാതന ഭാരമാനമായ כִּכָּר-ന് പ്രചാരത്തിലുള്ള ബൈബിൾ പദമായ ‘താലന്ത്’ ഉപയോഗിച്ചു.
- source_word: לִהְיוֹת יָדָיו אִתּוֹ
  choice: പൂലിന്റെ കൈ തനിക്കൊപ്പം ഉണ്ടായിരിക്കേണ്ടതിന്
  rationale: ‘അവന്റെ കൈ അവനോടൊപ്പം ആയിരിക്കുക’ എന്ന ഹീബ്രായ രൂപകം നിലനിർത്തുകയും സർവനാമങ്ങളുടെ പരാമർശം മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും ചെയ്തു.
- source_word: לְהַחֲזִיק
  choice: ഉറപ്പിക്കാൻ
  rationale: Hiphil രൂപത്തിന്റെ ‘ദൃഢമാക്കുക/സ്ഥിരപ്പെടുത്തുക’ എന്ന അർഥം രാജഭരണം ഉറപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַמַּמְלָכָה
  choice: രാജ്യം
  rationale: מַמְלָכָה എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം; ഇവിടെ മെനഹേമിന്റെ രാജഭരണത്തെയും സൂചിപ്പിക്കാം.
- source_word: בְּיָדוֹ
  choice: തന്റെ കൈവശമുള്ള
  rationale: ‘അവന്റെ കയ്യിൽ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിലെ നിയന്ത്രണം/അധികാരം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
