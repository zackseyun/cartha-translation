id: 2KI.15.3
reference: 2 Kings 15:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/003.yaml
  text: He did what was right in the eyes of Yahweh, according to all that Amaziah his father had done.
translation:
  language: ml
  text: അവൻ തന്റെ അപ്പനായ അമസ്യാവ് ചെയ്തതുപോലെ എല്ലാറ്റിലും യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ചെയ്തു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ ക്രിയ ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തി അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ തുടക്കത്തിലെ ‘അങ്ങനെ/പിന്നെ’ നിർബന്ധമല്ല.
- source_word: הַיָּשָׁר
  choice: ശരിയായതു
  rationale: നിശ്ചയോപപദമുള്ള വിശേഷണം നാമവാചകമായി പ്രവർത്തിച്ച് ‘ശരിയായ കാര്യം’ എന്ന അർഥം നൽകുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: യഹ്‌വെയുടെ വിലയിരുത്തലിൽ എന്നർഥമുള്ള എബ്രായ പ്രയോഗം; ‘ദൃഷ്ടിയിൽ’ എന്നത് രൂപകത്തെ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כְּכֹל אֲשֶׁר
  choice: ചെയ്തതുപോലെ എല്ലാറ്റിലും
  rationale: പിതാവിന്റെ മുഴുവൻ പ്രവർത്തനരീതിയോടുള്ള അനുരൂപത സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വാക്യക്രമത്തിനായി താരതമ്യഘടകം മുൻപാക്കി.
- source_word: עָשָׂה
  choice: ചെയ്ത
  rationale: അമസ്യാവിന്റെ മുൻകാല പ്രവൃത്തിയെ സംബന്ധവാക്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക പൂർവഭൂതകാലരൂപം ആവശ്യമില്ല.
- source_word: אֲמַצְיָהוּ
  choice: അമസ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אָבִיו
  choice: തന്റെ അപ്പനായ
  rationale: അടുത്ത വംശാവലിസന്ദർഭത്തിൽ ഇത് നേരിട്ടുള്ള പിതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തന്റെ’ കർത്താവുമായുള്ള ബന്ധം വ്യക്തമായി കാണിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം നാമത്തിന്റെ ലിപ്യന്തരണം ഉപയോഗിച്ചു; ‘യഹോവ’യെക്കാൾ എബ്രായ നാമത്തിന്റെ സാധാരണ പുനർനിർമാണത്തോട് ‘യഹ്‌വെ’ അടുത്തുനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ രാജവൃത്താന്തശൈലി. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കെ, ‘തന്റെ അപ്പനായ’ എന്ന രൂപം ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു. മൂലത്തിലെ ‘യഹ്‌വെയുടെ കണ്ണുകളിൽ’ എന്ന ശാരീരിക രൂപകത്തിന് പകരം മലയാളത്തിൽ പതിവായ ‘ദൃഷ്ടിയിൽ’ ഉപയോഗിച്ചു.
