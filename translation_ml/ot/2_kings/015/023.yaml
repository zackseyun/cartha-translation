id: 2KI.15.23
reference: 2 Kings 15:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/שְׁנַת֙ חֲמִשִּׁ֣ים שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פְּקַֽחְיָ֨ה בֶן מְנַחֵ֧ם עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן שְׁנָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ അസര്യാവിന്റെ വാഴ്ചയുടെ അമ്പതാം വർഷത്തിൽ, മെനഹേമിന്റെ മകനായ പെക്കഹ്യാവ് ശമര്യയിൽ ഇസ്രായേലിന്മേൽ രാജാവായി; അവൻ രണ്ടു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת ... חֲמִשִּׁים שָׁנָה
  choice: വാഴ്ചയുടെ അമ്പതാം ആണ്ടിൽ
  rationale: എബ്രായ രാജവാഴ്ചാകാല നിർണ്ണയസൂത്രം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി നൽകാൻ ‘വാഴ്ചയുടെ’ എന്ന് വ്യക്തമാക്കി; ‘അമ്പതാം ആണ്ടിൽ’ മൂലത്തിലെ കാലസൂചന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: לַ/עֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ അസര്യാവിന്റെ
  rationale: לְ രാജാവിന്റെ വാഴ്ചയെ കാലഗണനയുടെ ആധാരമാക്കുന്നു; പദവിയും രാജ്യവും മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണഘടനയിൽ ചേർത്തു.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: രാജവാഴ്ചാ അറിയിപ്പിൽ ഈ ക്രിയ അധികാരാരോഹണം സൂചിപ്പിക്കുന്നു. തുടർന്ന് ഭരണകാലം വേർതിരിച്ച് പറയുന്നതിനാൽ ‘ഭരിച്ചു’ എന്ന് ആവർത്തിക്കാതെ പ്രവേശനസംഭവം വ്യക്തമാക്കി.
- source_word: פְּקַחְיָה בֶן מְנַחֵם
  choice: മെനഹേമിന്റെ മകനായ പെക്കഹ്യാവ്
  rationale: വ്യക്തിനാമങ്ങൾ മൂലരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണത്തിൽ നൽകി; പുത്രബന്ധം ഔപചാരിക രാജവൃത്താന്തത്തിന്റെ ഭാഗമായി നിലനിർത്തി.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെമേൽ
  rationale: עַל ഭരണാധികാരത്തിന്റെ പരിധി സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇസ്രായേലിന്റെമേൽ’ എന്ന നേരിട്ടുള്ള രൂപം സ്വീകരിച്ചു.
- source_word: בְּ/שֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: സ്ഥാനസൂചകമായ בְ രാജധാനിയായ ശമര്യയിലെ ഭരണാസനം സൂചിപ്പിക്കുന്നു.
- source_word: שְׁנָתָיִם
  choice: രണ്ടു വർഷം
  rationale: ദ്വിവചനരൂപത്തിന്റെ അർഥം നേരിട്ട് നൽകി; മലയാളത്തിൽ പൂർണ്ണവാക്യമാക്കാൻ ‘അവൻ ... ഭരിച്ചു’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും രാജവൃത്താന്തത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആണ്ട്’ രാജവാഴ്ചാകാല നിർണ്ണയത്തിൽ സ്വാഭാവികമായ ഔപചാരിക പ്രയോഗമായി ഉപയോഗിച്ചു; വിഭാഗീയ വ്യാഖ്യാനങ്ങൾ ചേർത്തിട്ടില്ല.
