  text: Then Menahem struck Tiphsah[a], and all who were in it, and its territory from Tirzah, because it had not opened to him; and he struck it[c][b], ripping open all its pregnant women.
translation:
  language: ml
  text: അപ്പോൾ മെനഹേം തിഫ്സഹിനെയും അതിലുള്ള എല്ലാവരെയും അതിന്റെ അതിർത്തിപ്രദേശങ്ങളെയും, തിര്‍സാമുതൽ, ആക്രമിച്ചു. നഗരം അവന് കവാടം തുറന്നുകൊടുക്കാതിരുന്നതിനാൽ[a] അവൻ അതിനെ ആക്രമിച്ചു; അവിടെയുള്ള ഗർഭിണികളായ എല്ലാവരുടെയും വയർ പിളർത്തി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കവാടം തുറന്നുകൊടുക്കുക’ എന്നത് മെനഹേമിനെ നഗരത്തിൽ പ്രവേശിപ്പിക്കുകയോ അവനു കീഴടങ്ങുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: ‘വയർ പിളർത്തി’ എന്നതിന് ‘പിളർന്നുതുറന്നു’ അഥവാ ‘കീറിത്തുറന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ ബലംപ്രയോഗിച്ചുള്ള ക്രൂരമായ പിളർക്കലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികമായ മലയാള ആഖ്യാനബന്ധകം.
- source_word: יַכֶּה / וַיַּךְ
  choice: ആക്രമിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; രണ്ടു രൂപങ്ങൾക്കും ഒരേ പദം ഉപയോഗിച്ച് ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: תִּפְסַח
  choice: തിഫ്സഹ്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: כָּל אֲשֶׁר בָּהּ
  choice: അതിലുള്ള എല്ലാവരെയും
  rationale: വാക്യഘടനയ്ക്ക് വിശാലമായ ‘അതിലുള്ള സകലവും’ എന്ന അർഥസാധ്യതയുണ്ടെങ്കിലും നഗരാക്രമണസന്ദർഭത്തിൽ നിവാസികളാണ് മുഖ്യമായി സൂചിപ്പിക്കപ്പെടുന്നത്.
- source_word: גְּבוּלֶיהָ
  choice: അതിന്റെ പ്രദേശത്തെയും
  rationale: ഇവിടെ גְּבוּל അതിർത്തിരേഖയെക്കാൾ നഗരത്തിനധീനമായ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מִתִּרְצָה
  choice: തിർസ്സയിൽനിന്നു
  rationale: מן എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; യാത്രയുടെ ആരംഭസ്ഥാനമോ ആക്രമണത്തിന്റെ ദിശയോ സംബന്ധിച്ച അസ്പഷ്ടത പരിഹരിക്കുന്നില്ല.
- source_word: כִּי לֹא פָתַח
  choice: നഗരം അവനുവേണ്ടി കവാടം തുറന്നുകൊടുക്കാതിരുന്നതിനാൽ
  rationale: അക്ഷരാർഥമായ ‘തുറന്നില്ല’ എന്ന പ്രയോഗത്തിന്റെ സൈനികസന്ദർഭത്തിലുള്ള ആശയം—പ്രവേശനം അനുവദിക്കാതിരിക്കുക അല്ലെങ്കിൽ കീഴടങ്ങാതിരിക്കുക—വ്യക്തമാക്കുന്നു.
- source_word: הֶהָרוֹתֶיהָ
  choice: അവിടെയുള്ള ഗർഭിണികളെയെല്ലാം
  rationale: നഗരത്തോടു ബന്ധിപ്പിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം സ്വാഭാവിക മലയാളത്തിൽ ‘അവിടെയുള്ള’ എന്നു നൽകി.
- source_word: בִּקֵּעַ
  choice: വയറുപിളർക്കുകയും ചെയ്തു
  rationale: Piel രൂപത്തിലുള്ള ക്രിയ സൂചിപ്പിക്കുന്ന ക്രൂരമായ പിളർക്കൽ നേരിട്ടും വ്യക്തമായും നൽകുന്നു; ഗർഭിണികളെ സംബന്ധിച്ച സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമാണിത്.
