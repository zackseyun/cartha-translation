translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി സ്വീകരിച്ചു. അക്രമത്തിന്റെ ഭീകരത Euphemism ഇല്ലാതെ അറിയിച്ചു; എന്നാൽ അനാവശ്യമായി ദൃശ്യവൽക്കരിച്ചില്ല. WLC വാചകക്രമത്തെ മാനിച്ചുകൊണ്ട് മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘നഗരം’ എന്നും ‘കവാടം’ എന്നും സന്ദർഭസൂചനയായി ചേർത്തു.
