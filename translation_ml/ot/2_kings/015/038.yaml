source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יוֹתָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ אָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/038.yaml
  text: And Jotham lay down with his fathers and was buried with his fathers in the city of David his father[b][a], and Ahaz his son reigned in his place.
translation:
  language: ml
  text: യോഥാം മരിച്ചു തന്റെ പിതാക്കന്മാരോടുചേർന്നു[a]. തന്റെ പിതാവായ ദാവീദിന്റെ നഗരത്തിൽ അവൻ തന്റെ പിതാക്കന്മാരോടുകൂടെ അടക്കം ചെയ്യപ്പെട്ടു[b]. അവന്റെ മകനായ ആഹാസ് അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ പൂർവികരോടുചേർന്നു.’ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘തന്റെ പിതാക്കന്മാരോടുകൂടെ കിടന്നു’ എന്നാണ്; ഇത് മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവായ രാജകീയ പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘തന്റെ പിതാവായ ദാവീദ്’ എന്നതിലെ ‘പിതാവ്’ നേരിട്ടുള്ള ജനകനെ അല്ല, രാജവംശപരമായ പൂർവികനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: ‘തന്റെ പിതാക്കന്മാരോടുകൂടെ’ എന്ന പ്രയോഗത്തോടു ചേർന്നുള്ള ശכב എന്ന എബ്രായ ക്രിയ രാജാവിന്റെ മരണത്തെ അറിയിക്കുന്ന പതിവുശൈലിയാണ്. ‘നിദ്രപ്രാപിച്ചു’ എന്നത് മരണസൂചന വ്യക്തമാക്കുന്നതിനൊപ്പം മൂലത്തിലെ നിദ്രാരൂപകവും നിലനിർത്തുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ
  rationale: രാജകീയ മരണവിവരണത്തിലെ പതിവുപ്രയോഗമായതിനാൽ എബ്രായത്തിലെ ‘പിതാക്കന്മാർ’ എന്ന രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; ഇവിടെ ഉദ്ദേശിക്കുന്നത് പൂർവികരെയാണ്.
- source_word: וַיִּקָּבֵר
  choice: അവനെ ... അടക്കം ചെയ്തു
  rationale: എബ്രായത്തിലെ നിഷ്ക്രിയക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ കർമണിപ്രയോഗത്തിലൂടെ അറിയിച്ചു.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദിന്റെ നഗരത്തിൽ
  rationale: മൂലത്തിലെ ബന്ധപദവും വാക്യഘടനയും കഴിയുന്നത്ര നിലനിർത്തുന്നു. ‘പിതാവ്’ ഇവിടെ നേരിട്ടുള്ള ജനകൻ എന്നല്ല, ദാവീദിക വംശത്തിലെ പൂർവികൻ എന്ന അർഥത്തിലാണ്; അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജകീയ പിൻഗാമിത്വസന്ദർഭത്തിൽ מלך എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളപ്രയോഗം; തുടർന്നുള്ള ‘അവനു പകരം’ ഭരണം ഏറ്റെടുത്ത അർഥം വ്യക്തമാക്കുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: മുൻരാജാവിന്റെ സ്ഥാനത്ത് പിൻഗാമി വരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: ‘തന്റെ പിതാവായ ദാവീദ്’ എന്നതിലെ ‘പിതാവ്’ എന്ന പദത്തിന്റെ അർഥം
  choice: ദാവീദിക വംശത്തിലെ പൂർവികൻ
  alternative: നേരിട്ടുള്ള ജനകൻ
  rationale: യോഥാമിന്റെ നേരിട്ടുള്ള പിതാവ് ഉസ്സീയാവ്/അസര്യാവായിരുന്നു. അതിനാൽ രാജവംശപരമായ പ്രയോഗത്തിൽ ദാവീദിനെ പൂർവികൻ എന്നു വിളിക്കുന്നതാണ് ഇവിടെ അർഥം. എന്നാൽ എബ്രായത്തിലെ ബന്ധപദം മുഖ്യപാഠത്തിൽ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി സ്വീകരിച്ചു. രാജകീയ മരണവിവരണത്തിന്റെ ആവർത്തനഘടനയും എബ്രായത്തിലെ ബന്ധപദങ്ങളും നിലനിർത്തി; തെറ്റിദ്ധാരണയ്ക്കിടയുള്ളിടത്ത് അടിക്കുറിപ്പുകൾ ചേർത്തു.
