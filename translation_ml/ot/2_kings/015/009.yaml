  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָ֑י/ו לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
translation:
  language: ml
  text: തന്റെ പിതാക്കന്മാർ ചെയ്തതുപോലെതന്നെ, അവൻ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു. യിസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച നെബാത്തിന്റെ മകൻ യൊരോബെയാമിന്റെ പാപങ്ങളിൽനിന്ന്[a] അവൻ പിന്മാറിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നെബാത്തിന്റെ മകൻ യൊരോബെയാം യിസ്രായേലിനെ പാപം ചെയ്യാൻ ഇടയാക്കിയ പാപങ്ങളിൽനിന്ന്.” എബ്രായ ബന്ധവാക്യം യൊരോബെയാമിനെത്തന്നെ വിശേഷിപ്പിക്കുന്നതായോ, അവനോടു ബന്ധപ്പെട്ട പാപങ്ങളെ വിശേഷിപ്പിക്കുന്നതായോ വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה
  choice: അവൻ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്തു
  rationale: എബ്രായ ചരിത്രാഖ്യാനത്തിലെ പതിവ് വിലയിരുത്തൽസൂത്രത്തിന്റെ അർഥവും ‘ദൃഷ്ടിയിൽ’ എന്ന ദൃശ്യപ്രയോഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ ശബ്ദാന്തരണം ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാർ ചെയ്തതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר എന്ന താരതമ്യത്തിന്റെ ഊന്നൽ ‘പോലെതന്നെ’ എന്നും, രാജവംശപരമായ പുരുഷലിംഗ ബഹുവചനമായ אֲבֹתָיו ‘പിതാക്കന്മാർ’ എന്നും നിലനിർത്തുന്നു.
- source_word: לֹא סָר
  choice: അവൻ പിന്മാറിയില്ല
  rationale: ഒരു പാപമാർഗമോ പ്രവൃത്തിരീതിയോ ഉപേക്ഷിക്കാതിരിക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מֵחַטֹּאות יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകൻ യൊരോബെയാമിന്റെ പാപങ്ങളിൽനിന്ന്
  rationale: മൂലത്തിലെ ബഹുവചനമായ ‘പാപങ്ങൾ’ നിലനിർത്തുകയും പേരുകളെയും പിതൃനാമബന്ധത്തെയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: യിസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരണാർഥം വ്യക്തമായി നൽകുന്നു; പ്രധാനവാചകത്തിൽ ബന്ധവാക്യം യൊരോബെയാമിനെ വിശേഷിപ്പിക്കുന്ന സ്വാഭാവിക വായന സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുകയും ഒരു പദവിപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: אֲבֹתָיו എന്ന പുരുഷലിംഗ ബന്ധപദം
  choice: തന്റെ പിതാക്കന്മാർ
  alternative: തന്റെ പൂർവികർ
  rationale: രാജകീയ സന്ദർഭത്തിലെ വ്യക്തമായ പുരുഷലിംഗ ബഹുവചനത്തെ പൊതുവായ ലിംഗനിരപേക്ഷ പദമാക്കി വിപുലീകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: אֲשֶׁר എന്ന ബന്ധസർവനാമത്തിന്റെ ബന്ധം
  choice: യിസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച യൊരോബെയാം
  alternative: യൊരോബെയാം യിസ്രായേലിനെ പാപം ചെയ്യിക്കാൻ ഇടയാക്കിയ പാപങ്ങൾ
  rationale: ക്രിയ പുരുഷലിംഗ ഏകവചനമായതിനാൽ യൊരോബെയാമാണ് സ്വാഭാവിക വ്യാകരണകർത്താവ്; എങ്കിലും ബന്ധവാക്യം ‘പാപങ്ങൾ’ എന്ന അടുത്ത പദവുമായി ആശയപരമായി ചേർന്നു വായിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ഗദ്യശൈലി. ‘യഹ്‌വെ’, ‘യൊരോബെയാം’, ‘നെബാത്ത്’, ‘യിസ്രായേൽ’ എന്നീ രൂപങ്ങൾ പേരുകളുടെ ശബ്ദാന്തരണമായി ഉപയോഗിച്ചു; മൂലത്തിലെ ആവർത്തനവും ധാർമ്മിക വിലയിരുത്തലും ചുരുക്കാതെ സൂക്ഷിച്ചു.
