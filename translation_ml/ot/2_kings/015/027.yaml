id: 2KI.15.27
reference: 2 Kings 15:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פֶּ֣קַח בֶּן רְמַלְיָ֧הוּ עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן עֶשְׂרִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ അസര്യാവിന്റെ അമ്പത്തിരണ്ടാം ഭരണവർഷത്തിൽ, രെമല്യാവിന്റെ മകനായ പേക്കഹ് ശമര്യയിൽ ഇസ്രായേലിന്റെ രാജാവായി; അവൻ ഇരുപതു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת חֲמִשִּׁים וּ/שְׁתַּיִם שָׁנָה
  choice: അമ്പത്തിരണ്ടാം ഭരണവർഷത്തിൽ
  rationale: രാജാക്കന്മാരുടെ ഭരണകാലം കണക്കാക്കുന്ന പതിവ് എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി നൽകാൻ ‘ഭരണവർഷം’ ചേർത്തു.
- source_word: לַ/עֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ അസര്യാവിന്റെ
  rationale: അസര്യാവിന്റെ ഭരണവർഷത്തെയാണ് തീയതി സൂചിപ്പിക്കുന്നത്; രാജപദവിയും രാജ്യനാമവും വ്യക്തമായി നിലനിർത്തി.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: ഇവിടത്തെ ക്രിയ രാജസ്ഥാനാരോഹണത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ഭരണദൈർഘ്യവിവരണത്തിൽനിന്ന് വേർതിരിച്ചറിയാൻ ‘രാജാവായി’ എന്നു നൽകി.
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  choice: രെമല്യാവിന്റെ മകനായ പേക്കഹ്
  rationale: എബ്രായ പിതൃനാമബന്ധം സ്വാഭാവികമായ മലയാളക്രമത്തിൽ സംരക്ഷിച്ചു.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ രാജാവായി
  rationale: מלך എന്ന ക്രിയയോടൊപ്പമുള്ള עַל ഇസ്രായേലിന്മേലുള്ള രാജാധികാരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇസ്രായേലിന്റെ രാജാവായി’ എന്നു നൽകി.
- source_word: בְּ/שֹׁמְרֹון
  choice: ശമര്യയിൽ
  rationale: ഭരണത്തിന്റെ ആസ്ഥാനസ്ഥലം സൂചിപ്പിക്കുന്ന സ്ഥാനവാചകം നേരിട്ട് വിവർത്തനം ചെയ്തു.
- source_word: עֶשְׂרִים שָׁנָה
  choice: ഇരുപതു വർഷം
  rationale: ഭരണദൈർഘ്യം നേരിട്ട് നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ രാജവംശവിവരണ ശൈലി. ‘ഭരണവർഷം’ കാലനിർണ്ണയം വ്യക്തമാക്കുന്നു; ‘രാജാവായി’യും ‘ഭരിച്ചു’യും ഉപയോഗിച്ച് സ്ഥാനാരോഹണവും ഭരണദൈർഘ്യവും വേർതിരിച്ചു.
