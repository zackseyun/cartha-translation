  text: וַ/יִּשְׁכַּ֤ב עֲזַרְיָה֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ יוֹתָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/007.yaml
  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
translation:
  language: ml
  text: അസര്യാവ് തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു[a]. അവർ അവനെ ദാവീദിന്റെ നഗരത്തിൽ അവന്റെ പിതാക്കന്മാരോടുകൂടെ അടക്കംചെയ്തു. അവന്റെ മകൻ യോഥാം അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ പൂർവികരോടുകൂടെ നിദ്രപ്രാപിച്ചു.’ ‘തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു’ എന്ന എബ്രായ ശൈലിപ്രയോഗം മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിപ്രയോഗത്തിന്റെ സൗമ്യവും മാന്യവുമായ ഭാവം നിലനിർത്തുന്നു; വെറും ‘മരിച്ചു’ എന്നു പറഞ്ഞ് അതിനെ പരത്തുന്നില്ല.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ
  rationale: രാജാക്കന്മാരെക്കുറിച്ചുള്ള പതിവ് മരണ-സംസ്കാര സൂത്രവാക്യവും മുൻതലമുറകളുമായുള്ള ബന്ധവും ഔപചാരികമായി നിലനിർത്തുന്നു; ഇവിടെ ‘പൂർവികർ’ എന്നും അർഥമാകാം.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: അവർ അവനെ ... അടക്കംചെയ്തു
  rationale: വിഷയം വ്യക്തമാക്കാത്ത എബ്രായ ബഹുവചന കർത്തൃപ്രയോഗം സജീവവാക്യമായി സംരക്ഷിക്കുന്നു.
- source_word: בְּעִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരത്തിൽ
  rationale: സ്ഥലനാമത്തെ വ്യക്തവും മലയാളത്തിൽ സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജസ്ഥാനമേറ്റുള്ള പിൻഗാമിത്വസന്ദർഭത്തിൽ ‘രാജാവായി’ എന്നത് സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്; ‘ഭരിച്ചു’ എന്നതിനെക്കാൾ സ്ഥാനാരോഹണത്തിന്റെ അർഥം ഇവിടെ വ്യക്തമായി നൽകുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: കാലക്രമം മാത്രമല്ല, രാജസ്ഥാനത്തിലെ പിൻഗാമിത്വവും കൃത്യമായി സൂചിപ്പിക്കുന്നു.
