translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രാഖ്യാന ശൈലി. ‘നിദ്രപ്രാപിച്ചു’ എന്ന പരമ്പരാഗത പദം മൂലഭാഷയിലെ മരണസൗമ്യോക്തി നിലനിർത്തുന്നതിനായി ഉപയോഗിച്ചു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
