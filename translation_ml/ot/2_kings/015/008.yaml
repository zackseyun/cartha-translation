  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ זְכַרְיָ֨הוּ בֶן יָרָבְעָ֧ם עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן שִׁשָּׁ֥ה חֳדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/008.yaml
  text: In the thirty-eighth year of Azariah king of Judah, Zechariah son of Jeroboam became king over Israel in Samaria for six months.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ അസര്യാവിന്റെ ഭരണത്തിന്റെ മുപ്പത്തെട്ടാം വർഷത്തിൽ, യൊരോബെയാമിന്റെ മകൻ സെഖര്യാവ് ശമര്യയിൽ ഇസ്രായേലിന്റെ രാജാവായി ആറു മാസം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה לַעֲזַרְיָהוּ
  choice: അസര്യാവിന്റെ ഭരണത്തിന്റെ മുപ്പത്തെട്ടാം വർഷത്തിൽ
  rationale: രാജഭരണകാലം കണക്കാക്കുന്ന എബ്രായ കാലസൂചന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; കാർഡിനൽ രൂപത്തിന് ഇവിടെ ക്രമസംഖ്യാ അർഥമാണ്.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ
  rationale: അസര്യാവിന്റെ പദവിയും രാജ്യവും ചുരുക്കമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: מָלַךְ
  choice: രാജാവായി; അവൻ ... ഭരിച്ചു
  rationale: ക്രിയയുടെ രാജസ്ഥാനാരോഹണസൂചനയും പിന്നാലെയുള്ള ആറുമാസത്തെ ഭരണദൈർഘ്യവും മലയാളത്തിൽ അസന്ദിഗ്ധമായി വേർതിരിച്ചു നൽകുന്നു.
- source_word: זְכַרְיָהוּ בֶן יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ മകൻ സെഖര്യാവ്
  rationale: പിതൃപരിചയം മലയാളത്തിന്റെ സ്വാഭാവിക പദക്രമത്തിൽ നൽകി, പേരുകളുടെ പ്രചാരത്തിലുള്ള ബൈബിൾരൂപങ്ങൾ നിലനിർത്തുന്നു.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ രാജാവായി
  rationale: מלך എന്ന ക്രിയയോടൊപ്പമുള്ള עַל ഭരണാധികാരം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇസ്രായേലിന്റെ രാജാവായി’ എന്നത് സ്വാഭാവിക തുല്യപ്രയോഗമാണ്.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽവെച്ച്
  rationale: ഭരണത്തിന്റെ ആസ്ഥാനസ്ഥലം സൂചിപ്പിക്കുന്ന സ്ഥലവാചകം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שִׁשָּׁה חֳדָשִׁים
  choice: ആറുമാസം ഭരിച്ചു
  rationale: എബ്രായത്തിലെ ദൈർഘ്യസൂചക കർമവിഭക്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലദൈർഘ്യപ്രയോഗമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും വചനശൈലിക്ക് യോജിച്ച മാന്യമായതുമായ ഭാഷ. മൂലത്തിലെ രാജഭരണകാലസൂത്രവും ഭരണസ്ഥലവും കാലദൈർഘ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്.
