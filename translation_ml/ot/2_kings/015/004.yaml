  yaml_path: translation/ot/2_kings/015/004.yaml
  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
translation:
  language: ml
  text: എന്നാൽ പൂജാഗിരികൾ നീക്കം ചെയ്യപ്പെട്ടില്ല; ജനം അപ്പോഴും പൂജാഗിരികളിൽ ബലിയർപ്പിക്കുകയും ധൂപം കത്തിക്കുകയും[a] ചെയ്തുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വഴിപാടുകൾ പുകയായി അർപ്പിക്കുകയും.” എബ്രായ ക്രിയയ്ക്ക് പ്രത്യേകമായി “ധൂപം കത്തിക്കുക” എന്നോ, കൂടുതൽ വിശാലമായി ഒരു വഴിപാട് പുകയായി അർപ്പിക്കുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: രാജാവിനെക്കുറിച്ചുള്ള അനുകൂല വിലയിരുത്തലിനുള്ള ഒരു അപവാദം സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ വിരുദ്ധബന്ധപദം ഉപയോഗിച്ചു.
- source_word: הַבָּמוֹת
  choice: പൂജാഗിരികൾ
  rationale: ഉയർന്ന സ്ഥലങ്ങളിലെ പ്രാദേശിക ആരാധനാകേന്ദ്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും ‘ക്ഷേത്രങ്ങൾ’ എന്നതിനെക്കാൾ സ്ഥലത്തിന്റെ ഉയരവും ആരാധനാസ്വഭാവവും ഈ പദം നിലനിർത്തുന്നു.
- source_word: לֹא סָרוּ
  choice: നീക്കം ചെയ്യപ്പെട്ടില്ല
  rationale: പൂജാഗിരികൾ തുടർന്നും നിലനിന്നുവെന്ന ആശയം സ്വാഭാവികമായ മലയാള കർമണിപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: עוֹד
  choice: അപ്പോഴും
  rationale: മുൻപുണ്ടായിരുന്ന ആചാരം തുടർന്നുകൊണ്ടിരുന്നുവെന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും മാന്യവുമായ പൊതുപദം.
- source_word: מְזַבְּחִים
  choice: ബലിയർപ്പിക്കുകയും
  rationale: זבח എന്ന ക്രിയയുടെ ബലിയർപ്പിക്കൽ എന്ന അടിസ്ഥാന ആരാധനാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: וּמְקַטְּרִים
  choice: ധൂപം കത്തിക്കുകയും
  rationale: ആരാധനാസന്ദർഭത്തിലെ קטר എന്ന ക്രിയയുടെ സാധാരണ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പുക ഉയരുന്ന വഴിപാടെന്ന വിശാല സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בַּבָּמוֹת
  choice: പൂജാഗിരികളിൽ
  rationale: ആ ആരാധനാകേന്ദ്രങ്ങളിലാണ് പ്രവർത്തനങ്ങൾ നടന്നതെന്ന സ്ഥാനാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൂജാഗിരികളിൽ നടന്ന ആരാധനയുടെ സ്വഭാവം
  choice: അനുമതിയില്ലാത്ത പ്രാദേശിക ആരാധന തുടർന്നുവെന്ന് മാത്രം രേഖപ്പെടുത്തുന്നു; ആരാധിക്കപ്പെട്ട ദൈവം ആരെന്ന് വ്യക്തമാക്കുന്നില്ല.
  alternative: അവിടെ നടന്നതെല്ലാം വിഗ്രഹാരാധനയായിരുന്നു എന്നോ, യഹോവയോടുള്ളതെങ്കിലും തെറ്റായ സ്ഥലത്തെ ആരാധന മാത്രമായിരുന്നു എന്നോ വ്യക്തമായി പറയുക.
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠം ബലിയർപ്പിക്കലും പുക ഉയർത്തുന്ന ആരാധനാക്രിയയും മാത്രം പറയുന്നു; ആരാധനയുടെ ലക്ഷ്യത്തെ നിർണ്ണയിക്കാത്തതിനാൽ വിവർത്തനവും ആ മൗനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പൂജാഗിരികൾ’ എന്ന പദം ചരിത്രപരമായ ഉയർന്ന ആരാധനാസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
