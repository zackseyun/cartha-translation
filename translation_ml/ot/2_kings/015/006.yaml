  source_fidelity: ഹീബ്രു രാജഭരണ-സംഗ്രഹസൂത്രവാക്യത്തോടു വിശ്വസ്തമാണ്. יֶתֶר דִּבְרֵי എന്നത് ‘ശേഷിച്ച പ്രവൃത്തികൾ’ എന്നും, וְכָל אֲשֶׁר עָשָׂה ‘അവൻ ചെയ്തതൊക്കെയും’ എന്നും യോജ്യമായി നൽകിയിരിക്കുന്നു. הֲלֹא הֵם כְּתוּבִים എന്ന അലങ്കാരചോദ്യം ‘എഴുതിയിട്ടുണ്ടല്ലോ?’ എന്നതിൽ സ്വാഭാവികമായും മതിയായും പ്രതിഫലിക്കുന്നു.
