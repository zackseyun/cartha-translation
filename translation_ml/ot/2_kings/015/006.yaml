translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, രാജഭരണസംഗ്രഹത്തിന്റെ ഗൗരവമുള്ളതും ആവർത്തനാത്മകവുമായ ശൈലി നിലനിർത്തി. മൂലത്തിൽ പ്രത്യേകമായ കാലസൂചകപദമില്ലാത്തതിനാൽ വാക്യത്തിന്റെ തുടക്കത്തിൽ ‘ഇനി’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർത്തിട്ടില്ല. എല്ലാ പാഠക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
