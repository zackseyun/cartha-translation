source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י עֲזַרְיָ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/006.yaml
  text: The rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: അസർയ്യാവിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്തതൊക്കെയും യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ എഴുതിയിട്ടുണ്ടല്ലോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം’ എന്നത് രാജാക്കന്മാരുടെ പുസ്തകത്തിൽ പലവട്ടം ഉദ്ധരിക്കപ്പെടുന്ന ഒരു രാജകീയ രേഖയെയോ വാർഷികവൃത്താന്തത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי עֲזַרְיָהוּ
  choice: അസർയ്യാവിന്റെ ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ വരുന്ന സൂത്രവാക്യത്തിൽ דִּבְרֵי എന്നത് വെറും വാക്കുകളെയല്ല, രാജാവിന്റെ രേഖപ്പെടുത്തപ്പെട്ട പ്രവൃത്തികളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികമായ ‘പ്രവൃത്തികൾ’ തിരഞ്ഞെടുത്തു.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: ഹീബ്രു ബന്ധവാക്യത്തിന്റെ വ്യാപക അർഥവും സംക്ഷിപ്തമായ ചരിത്രശൈലിയും നിലനിർത്തുന്നു.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടുണ്ടല്ലോ?
  rationale: പ്രതീക്ഷിക്കുന്ന അനുകൂല ഉത്തരമുള്ള ഹീബ്രു അലങ്കാരചോദ്യത്തെ സ്വാഭാവിക മലയാളചോദ്യമായി നിലനിർത്തുന്നു; כְּתוּבִים എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘എഴുതിയിരിക്കുക’ സംരക്ഷിക്കുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: ദിനവൃത്താന്തപുസ്തകത്തിൽ
  rationale: עַל־סֵפֶר എന്ന രേഖാശൈലി മലയാളത്തിൽ ‘പുസ്തകത്തിൽ’ എന്നു സ്വാഭാവികമാണ്; דִּבְרֵי הַיָּמִים എന്ന രാജകീയ രേഖയുടെ ശീർഷകം ‘ദിനവൃത്താന്തം’ എന്നു നൽകി.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ
  rationale: ഇവിടെ לְ രേഖയുടെ ശീർഷകത്തിലുള്ള ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ഉടമസ്ഥബന്ധരൂപം യോജിക്കുന്നു.
