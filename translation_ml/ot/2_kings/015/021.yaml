id: 2KI.15.21
reference: 2 Kings 15:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י מְנַחֵ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: The rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: മെനഹേമിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്ത സകലവും ഇസ്രായേൽ രാജാക്കന്മാരുടെ ദിനവൃത്താന്തങ്ങളുടെ പുസ്തകത്തിൽ[a] എഴുതിയിട്ടില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേൽ രാജാക്കന്മാരുടെ വാർഷികരേഖകളുടെ പുസ്തകം.’
    reason: סֵפֶר דִּבְרֵי הַיָּמִים എന്ന പദസമുച്ചയം ‘ദിനവൃത്താന്തങ്ങളുടെ പുസ്തകം’ എന്നും ഔദ്യോഗിക ‘വാർഷികരേഖകളുടെ പുസ്തകം’ എന്നും സ്വാഭാവികമായി മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַחֵם
  choice: മെനഹേമിന്റെ ശേഷിച്ച പ്രവൃത്തികളും
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ דִּבְרֵי എന്നത് വെറും വാക്കുകളെയല്ല, രേഖപ്പെടുത്തിയ പ്രവൃത്തികളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു. וְ എന്ന സംയോജകം മലയാളത്തിലെ തുടർന്നുള്ള ‘-ഉം’ രൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്ത സകലവും
  rationale: എബ്രായ ആപേക്ഷികവാക്യത്തിന്റെ സമഗ്രതയും സൂത്രവാക്യശൈലിയും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടില്ലേ?
  rationale: ഹֲלוֹא അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്; ‘എഴുതിയിട്ടില്ലേ?’ അതിന്റെ ചോദ്യസ്വഭാവവും ഉറപ്പിന്റെ ഭാവവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: עַל അക്ഷരാർഥത്തിൽ ‘മേൽ’ എന്നായാലും രേഖാഗ്രന്ഥത്തെ പരാമർശിക്കുന്ന ഈ പ്രയോഗത്തിൽ മലയാളത്തിൽ ‘പുസ്തകത്തിൽ’ എന്നാണ് സ്വാഭാവികം.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം
  rationale: ഔദ്യോഗിക രാജകീയ രേഖയെ സൂചിപ്പിക്കുന്ന ശീർഷകമായി പരിചിതവും കൃത്യവുമായ രൂപം; ‘വാർഷികരേഖകളുടെ പുസ്തകം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ രാജഭരണസംഗ്രഹശൈലി ഉപയോഗിച്ചു. മൂലത്തിലുള്ള അലങ്കാരചോദ്യം പ്രസ്താവനയാക്കി മാറ്റാതെ നിലനിർത്തി; ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുസൂചകം പേരിനുശേഷം വന്നിരുന്നെങ്കിലും, അതിന്റെ ഉള്ളടക്കം ഗ്രന്ഥശീർഷകത്തിന്റെ പദവികൽപത്തെക്കുറിച്ചായതിനാൽ ബന്ധപ്പെട്ട ശീർഷകത്തിനുശേഷം സ്ഥാപിച്ചു.
