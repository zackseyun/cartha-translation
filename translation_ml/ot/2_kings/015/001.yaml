  yaml_path: translation/ot/2_kings/015/001.yaml
  text: In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah, king of Judah, began to reign.
translation:
  language: ml
  text: ഇസ്രായേൽ രാജാവായ യൊരോബെയാമിന്റെ ഇരുപത്തേഴാം ഭരണവർഷത്തിൽ, യെഹൂദാ രാജാവായ അമസ്യാവിന്റെ മകൻ അസര്യാവ് രാജാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת עֶשְׂרִים וָ/שֶׁבַע שָׁנָה
  choice: വാഴ്ചയുടെ ഇരുപത്തേഴാം വർഷത്തിൽ
  rationale: രാജവാഴ്ചയിലെ വർഷം സൂചിപ്പിക്കുന്ന എബ്രായ കാലനിർണ്ണയ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ ക്രമസംഖ്യാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; ‘വാഴ്ചയുടെ’ എന്നത് വർഷം രാജഭരണവുമായി ബന്ധപ്പെട്ടതാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: לְ/יָרָבְעָם מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ യൊരോബെയാമിന്റെ
  rationale: לְ ഇവിടെ ആരുടെ ഭരണവർഷമാണ് എണ്ണുന്നതെന്ന് സൂചിപ്പിക്കുന്നു. രാജപദവിയും പേരും മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയിൽ ചേർത്തിരിക്കുന്നു.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: രാജാരോഹണവിവരണത്തിലെ ഈ ക്രിയ പുതിയ വാഴ്ചയുടെ ആരംഭം സൂചിപ്പിക്കുന്നു. ‘രാജാവായി’ എന്ന മലയാളപ്രയോഗം ആ പ്രവേശനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֲזַרְיָה
  choice: അസര്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: בֶן אֲמַצְיָה
  choice: അമസ്യാവിന്റെ മകൻ
  rationale: വംശബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പുത്രപ്രയോഗം നേരിട്ട്, സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ
  rationale: അസര്യാവിനെ തിരിച്ചറിയിക്കുന്ന രാജപദവിയും രാജ്യവും മലയാളത്തിലെ വിശേഷണഘടനയായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി. മൂലത്തിലെ രാജവാഴ്ചാ കാലനിർണ്ണയസൂത്രം നിലനിർത്തിക്കൊണ്ട് മലയാളവാക്യക്രമം സ്വാഭാവികമാക്കി. പാഠവ്യത്യാസമോ വിശദീകരണം ആവശ്യമായ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
