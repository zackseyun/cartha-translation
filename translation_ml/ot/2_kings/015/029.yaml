  choice: ഗലീല
  rationale: പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: כֹּל אֶרֶץ נַפְתָּלִי
  choice: നഫ്താലിയുടെ ദേശം മുഴുവനും
  rationale: മുൻപുള്ള സ്ഥലപ്പട്ടികയെ സംഗ്രഹിക്കുന്ന സമാനാധികരണ പ്രയോഗവും ‘ദേശം മുഴുവനും’ എന്ന വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: וַיַּגְלֵם
  choice: അവിടത്തെ ജനങ്ങളെ ... കൊണ്ടുപോയി
  rationale: ഹിഫിൽ ക്രിയ സൂചിപ്പിക്കുന്ന നിർബന്ധിത പ്രവാസത്തിന്റെ അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്. എബ്രായത്തിലെ ‘അവരെ’ എന്ന പ്രത്യയം മലയാളത്തിൽ അസ്പഷ്ടമാകാതിരിക്കാൻ ഉദ്ദേശിക്കപ്പെടുന്ന പ്രദേശവാസികളെ ‘അവിടത്തെ ജനങ്ങൾ’ എന്നു വ്യക്തമാക്കി; കൂടുതൽ സാങ്കേതികമായ ‘നാടുകടത്തി’ എന്ന പദം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: אַשּׁוּרָה
  choice: അസീറിയയിലേക്കു
  rationale: ദിശാസൂചകമായ എബ്രായ രൂപം ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ‘-യിലേക്കു’ എന്ന മലയാളപ്രത്യയത്തിലൂടെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
