  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി സ്വീകരിച്ചു. രാജപദവികൾ പേരുകളോട് ചേർത്ത് സ്വാഭാവികമായി നൽകി; സ്ഥലനാമപ്പട്ടികയുടെ ഘടനയും നഫ്താലിദേശത്തെക്കുറിച്ചുള്ള സംഗ്രഹവാക്യവും നിലനിർത്തി.
