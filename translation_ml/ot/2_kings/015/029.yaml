  text: בִּ/ימֵ֞י פֶּ֣קַח מֶֽלֶךְ יִשְׂרָאֵ֗ל בָּא֮ תִּגְלַ֣ת פִּלְאֶסֶר֮ מֶ֣לֶךְ אַשּׁוּר֒ וַ/יִּקַּ֣ח אֶת עִיּ֡וֹן וְ/אֶת אָבֵ֣ל בֵּֽית מַעֲכָ֡ה וְ/אֶת יָ֠נוֹחַ וְ/אֶת קֶ֨דֶשׁ וְ/אֶת חָצ֤וֹר וְ/אֶת הַ/גִּלְעָד֙ וְ/אֶת הַ/גָּלִ֔ילָ/ה כֹּ֖ל אֶ֣רֶץ נַפְתָּלִ֑י וַ/יַּגְלֵ֖/ם אַשּֽׁוּרָ/ה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/029.yaml
  text: In the days of Pekah king of Israel[a], Tiglath-pileser king of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee—all the land of Naphtali—and he carried them away to Assyria.
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ രാജാവായ പേക്കഹിന്റെ കാലത്ത് അശ്ശൂർരാജാവായ തിഗ്ലത്ത്-പിലേസർ വന്ന് ഈയോൻ, ആബേൽ-ബേത്ത്-മാഖാ, യാനോഹ്, കേദെശ്, ഹാസോർ, ഗിലെയാദ്, ഗലീല, നഫ്താലിയുടെ ദേശം മുഴുവനും പിടിച്ചടക്കി; അവിടത്തെ ജനങ്ങളെ അശ്ശൂരിലേക്കു നാടുകടത്തി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ അശ്ശൂരിലേക്കു കൊണ്ടുപോയി” / “അവരെ അശ്ശൂരിലേക്കു ബലമായി മാറ്റിപ്പാർപ്പിച്ചു.”
    reason: וַיַּגְלֵם എന്ന ഹിഫിൽ ക്രിയ ജനങ്ങളെ നിർബന്ധിതമായി പ്രവാസത്തിലേക്കു മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിലെ “നാടുകടത്തി” ആ അർഥം വ്യക്തമായി നൽകുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ പൊതുവായതും സാങ്കേതികവുമായ ബദലുകൾ നൽകുന്നു.
