- source_word: אָבֵל בֵּית מַעֲכָה
  choice: ആബേൽ-ബേത്ത്-മയഖാ
  rationale: സംയുക്ത സ്ഥലനാമം ഒറ്റ നാമമായി തിരിച്ചറിയാൻ ഹൈഫനുകളോടെ ലിപ്യന്തരിച്ചു.
