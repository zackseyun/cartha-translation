id: 2KI.15.34
reference: 2 Kings 15:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה עֻזִיָּ֥הוּ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/034.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done.
translation:
  language: ml
  text: അവൻ തന്റെ പിതാവായ ഉസ്സീയാവ്[a] ചെയ്തതെല്ലാം അനുസരിച്ച് യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘ഉസ്സീയാവ്.’ മറ്റിടങ്ങളിൽ ഈ രാജാവിനെ ‘അസര്യാവ്’ എന്നും വിളിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ചെയ്തു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ഒറ്റപ്പെട്ട വാക്യത്തിൽ മലയാളത്തിന്റെ സ്വാഭാവിക ശൈലിക്കായി ആരംഭത്തിലെ ‘പിന്നെ/അപ്പോൾ’ ഒഴിവാക്കി ഭൂതകാലക്രിയയായി വിവർത്തനം ചെയ്തു.
- source_word: הַיָּשָׁר
  choice: ശരിയായതു
  rationale: עשה הישר എന്ന പ്രയോഗം ‘ശരിയായത്/നീതിയായത് ചെയ്യുക’ എന്നാണ്. ഇവിടെ ദൈവിക വിലയിരുത്തലിന്റെ ആശയം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: כְּכֹל אֲשֶׁר
  choice: ചെയ്തതെല്ലാം അനുസരിച്ച്
  rationale: כֹּל സൂചിപ്പിക്കുന്ന സമഗ്രതയും മുൻ മാതൃകയോടുള്ള അനുരൂപതയും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: עֻזִיָּהוּ
  choice: ഉസ്സീയാവ്
  rationale: ഈ വാക്യത്തിലെ എബ്രായ പാഠം עֻזִיָּהוּ എന്ന പേരാണ് നൽകുന്നത്; മറ്റിടങ്ങളിലെ ‘അസര്യാവ്’ എന്ന പേരുമായി ഏകീകരിച്ചിട്ടില്ല.
- source_word: אָבִיו
  choice: തന്റെ പിതാവായ
  rationale: ഇവിടെ നേരിട്ടുള്ള പിതൃബന്ധമാണ് ഉദ്ദേശിക്കുന്നത്; പ്രതിഫലന സർവനാമം മലയാളത്തിൽ ആരുടെ പിതാവാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עָשָׂה ... עָשָׂה
  choice: ചെയ്തതെല്ലാം ... ചെയ്തു
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ച ക്രിയയുടെ ബന്ധം മലയാളത്തിൽ നിലനിർത്തുന്നു; ഉസ്സീയാവിന്റെ മുൻകാല പ്രവൃത്തികളും ഇപ്പോഴത്തെ രാജാവിന്റെ പ്രവൃത്തിയും സന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയായി മാറ്റാതെ, ദൈവത്തിന്റെ വ്യക്തിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ദൈവിക വിലയിരുത്തൽ സൂചിപ്പിക്കുന്ന ‘ദൃഷ്ടിയിൽ’ എന്ന രൂപകവും כֹּל എന്ന പദത്തിന്റെ സമഗ്രതയും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പുസൂചിക ദൈവനാമത്തിനു പിന്നാലെയാണെങ്കിലും അടിക്കുറിപ്പ് ഉസ്സീയാവിന്റെ പേരിനെക്കുറിച്ചായതിനാൽ, ആശയപരമായി ശരിയായ സ്ഥാനമായ ‘ഉസ്സീയാവ്’ എന്ന പേരിനു പിന്നാലെ [a] ചേർത്തു.
