lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: ശׁכב എന്ന ക്രിയയും ‘തന്റെ പിതാക്കന്മാരോടുകൂടെ’ എന്ന പ്രയോഗവും ചേർന്ന് രാജാവിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ സൂത്രവാക്യമാണ്. ‘നിദ്രപ്രാപിച്ചു’ മരണാർഥം വ്യക്തമാക്കുന്നതിനൊപ്പം മൂലത്തിലെ നിദ്രാരൂപകവും നിലനിർത്തുന്നു.
- source_word: עִם אֲבֹתָיו
