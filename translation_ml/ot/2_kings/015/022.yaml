- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: ഇവിടത്തെ രാജാവകാശക്രമസൂത്രത്തിൽ ക്രിയ ഭരണാരോഹണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവനു പകരം രാജാവായി’ എന്നത് സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: פְּקַחְיָה
  choice: പെക്കഹ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְנוֹ
  choice: അവന്റെ മകനായ
  rationale: പിതൃപുത്രബന്ധം മൂലപാഠപ്രകാരം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: രാജകീയ പിൻഗാമിത്വത്തിൽ മുൻരാജാവിന്റെ സ്ഥാനമേറ്റെടുക്കുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
