  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രവിവരണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ രാജഭരണസംഗ്രഹസൂത്രം തിരിച്ചറിയാവുന്ന വിധത്തിൽ നിലനിർത്തിയപ്പോൾ അസ്വാഭാവികമായ പദാവർത്തനം അടിക്കുറിപ്പിലേക്കു മാറ്റി.
