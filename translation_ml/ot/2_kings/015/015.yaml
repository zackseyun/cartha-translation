base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/015.yaml
  text: The rest of the acts of Shallum[a], and the conspiracy that he conspired—behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ml
  text: ശല്ലൂമിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ നടത്തിയ ഗൂഢാലോചനയും[a]—ഇതാ,[b] അവ ഇസ്രായേൽ രാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[c] എഴുതിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവന്റെ ഗൂഢാലോചന, അവൻ ഗൂഢാലോചിച്ചത്.” ഊന്നലിനായി എബ്രായത്തിൽ ഒരേ ധാതുവിൽനിന്നുള്ള നാമവും ക്രിയയും ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ഇതാ, അവ എഴുതിയിരിക്കുന്നു” എന്നത് രാജകീയ രേഖകളിലേക്കു ചൂണ്ടുന്ന പതിവുപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: രാജാക്കന്മാരുടെ പുസ്തകത്തിൽ ആവർത്തിച്ചു പരാമർശിക്കുന്ന ഔദ്യോഗിക രാജകീയ വാർഷികരേഖയാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שַׁלּוּם
  choice: ശല്ലൂമിന്റെ ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ דִּבְרֵי എന്നത് വെറും ‘വാക്കുകൾ’ എന്നതിലുപരി രാജാവിന്റെ പ്രവൃത്തികളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ശേഷിച്ച പ്രവൃത്തികൾ’ എന്നു നൽകി.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: അവൻ നടത്തിയ ഗൂഢാലോചന
  rationale: קשר എന്ന നാമവും അതേ ധാതുവിലുള്ള ക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗം ഊന്നൽ നൽകുന്നു. മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തനം ഒഴിവാക്കി അർത്ഥം വ്യക്തമായി നൽകി; മൂലത്തിലെ ആവർത്തനം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: הִנָּם
  choice: ഇതാ, അവ
  rationale: הִנֵּה എന്ന ചൂണ്ടിക്കാണിക്കൽ കണികയും ബഹുവചന സർവനാമബലവും സംരക്ഷിക്കുന്നതിനായി ‘ഇതാ, അവ’ എന്നു നൽകി. ഇത് രാജകീയ രേഖകളിലേക്കു വായനക്കാരനെ ചൂണ്ടുന്ന സൂത്രപ്രയോഗവുമാണ്.
- source_word: כְּתֻבִים
  choice: എഴുതിയിരിക്കുന്നു
  rationale: ‘എഴുതപ്പെട്ടിരിക്കുന്നു’ എന്ന കൃത്രിമമായ രൂപത്തേക്കാൾ സ്വാഭാവികമായ മലയാളത്തിൽ മൂലത്തിലെ നിഷ്ക്രിയഫലം കൃത്യമായി അറിയിക്കുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ
  rationale: ഇത് രാജാക്കന്മാരെക്കുറിച്ചുള്ള ഔദ്യോഗിക വാർഷികരേഖയുടെ പതിവുപേരാണ്. עַל എന്നത് പുസ്തകത്തിൽ രേഖപ്പെടുത്തിയ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘-ത്തിൽ’ സ്വാഭാവികമാണ്.
