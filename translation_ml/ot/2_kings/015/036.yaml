  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹתָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/036.yaml
  text: The rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: യോഥാം ചെയ്ത മറ്റു പ്രവൃത്തികൾ യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[a] എഴുതപ്പെട്ടിട്ടുണ്ടല്ലോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദിനവൃത്താന്തപുസ്തകം’ എന്നു പറയുന്നത് രാജാക്കന്മാരുടെ ഭരണകാലസംഭവങ്ങൾ രേഖപ്പെടുത്തിയ ഒരു രാജകീയ വാർഷികരേഖയെയാണ് സൂചിപ്പിക്കുന്നത്; അത് ബൈബിളിലെ ദിനവൃത്താന്തങ്ങൾ എന്ന ഗ്രന്ഥം തന്നെയായിരിക്കണമെന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: യോഥാമിന്റെ മറ്റെല്ലാ പ്രവൃത്തികളും
  rationale: יֶתֶר എന്നത് ശേഷിക്കുന്ന ഭാഗത്തെയും דִּבְרֵי എന്നത് ഈ രാജഭരണസംഗ്രഹസൂത്രത്തിൽ രാജാവിന്റെ പ്രവൃത്തികളെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ഉടമസ്ഥതാസംബന്ധം പ്രകടമാക്കുന്നു.
- source_word: אֲשֶׁר עָשָׂה
  choice: യോഥാം ചെയ്ത
  rationale: എബ്രായത്തിലെ ബന്ധവാക്യത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ആവർത്തനദോഷമില്ലാത്ത സ്വാഭാവിക വിശേഷണവാക്യമായി മുൻവശത്ത് ചേർത്തു.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടുണ്ടല്ലോ?
  rationale: הֲלֹא അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്. മലയാളത്തിലെ ‘ഉണ്ടല്ലോ?’ അതിന്റെ ചോദ്യരൂപവും പ്രതീക്ഷിത സമ്മതവും നിലനിർത്തുന്നു; כְּתוּבִים എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘എഴുതപ്പെട്ടത്’ സംരക്ഷിക്കുന്നു.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘പുസ്തകത്തിന്മേൽ’ എന്നായാലും രേഖയിൽ ഉൾപ്പെട്ടിരിക്കുന്നു എന്ന അർഥത്തിൽ മലയാളത്തിൽ ‘പുസ്തകത്തിൽ’ സ്വാഭാവികമാണ്.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം
  rationale: ഇത് യെഹൂദാരാജാക്കന്മാരെ സംബന്ധിച്ച രാജകീയ വാർഷികരേഖയുടെ ശീർഷകസദൃശമായ പരാമർശമാണ്. ‘ദിനവൃത്താന്തപുസ്തകം’ പരമ്പരാഗത പരിചിതത്വവും ഉറവിടത്തിലെ ഘടനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദിനവൃത്താന്തപുസ്തകം’ എന്ന രേഖയുടെ തിരിച്ചറിയൽ
  choice: വാക്യത്തിൽ ശീർഷകസദൃശമായ പൊതുവായ രാജകീയ രേഖാപരാമർശമായി നിലനിർത്തി
  alternative: ബൈബിളിലെ ‘ദിനവൃത്താന്തങ്ങൾ’ എന്ന ഗ്രന്ഥമായി വ്യക്തമായി തിരിച്ചറിയുക
  rationale: ഉറവിടം ഒരു രാജകീയ വാർഷികരേഖയെ ഉദ്ദേശിക്കാം; അതിനെ കാനോനിക ദിനവൃത്താന്തഗ്രന്ഥവുമായി നിർബന്ധമായി സമീകരിക്കാൻ പാഠം ആവശ്യപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. രാജഭരണസംഗ്രഹത്തിന്റെ ഔപചാരിക ഭാവവും അലങ്കാരചോദ്യത്തിന്റെ രൂപവും നിലനിർത്തി. വ്യക്തിനാമം ‘യോഥാം’ എന്നും യെഹൂദാ എന്ന സ്ഥലനാമം പരിചിതമായ മലയാള ബൈബിൾരീതിയിലും നൽകി.
