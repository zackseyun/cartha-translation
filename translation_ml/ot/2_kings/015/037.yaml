id: 2KI.15.37
reference: 2 Kings 15:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֗ה לְ/הַשְׁלִ֨יחַ֙ בִּֽ/יהוּדָ֔ה רְצִ֖ין מֶ֣לֶךְ אֲרָ֑ם וְ/אֵ֖ת פֶּ֥קַח בֶּן רְמַלְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/037.yaml
  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
translation:
  language: ml
  text: ആ നാളുകളിൽ യഹ്‌വെ അരാം[b] രാജാവായ റെസീനെയും രെമല്യാവിന്റെ മകനായ പേക്കഹിനെയും യെഹൂദയ്ക്കെതിരെ[a] അയയ്ക്കാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യെഹൂദയിലേക്ക്’; ഇവിടെ എബ്രായത്തിലെ പ്രയോഗത്തിന് ശത്രുതാപരമായ അർഥം ഉണ്ടായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘അരാം’; പരമ്പരാഗതമായി ‘സിറിയ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: ആ നാളുകളിൽ
  rationale: ചരിത്രത്തിലെ ഒരു കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗത്തിന്റെ ബഹുവചനരൂപവും സ്വാഭാവികമായ മലയാളശൈലിയും നിലനിർത്തുന്നു.
- source_word: הֵחֵל
  choice: തുടങ്ങി
  rationale: ഒരു പ്രവർത്തനത്തിന്റെ ആരംഭം സൂചിപ്പിക്കുന്ന ക്രിയയെ ലളിതവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְהַשְׁלִיחַ ... בִּיהוּדָה
  choice: യെഹൂദയ്ക്കെതിരെ അയയ്ക്കാൻ
  rationale: שלח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തുന്നു; ശത്രുതാപരമായ സൈനിക-രാഷ്ട്രീയ പശ്ചാത്തലത്തിൽ בִּיהוּדָה ലക്ഷ്യത്തിനെതിരായ നീക്കത്തെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നു, അതേസമയം മറ്റൊരു സാദ്ധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: അരാം രാജാവായ റെസീൻ
  rationale: വ്യക്തിനാമവും ദേശനാമവും എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്യുകയും മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധഘടന ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וְאֵת פֶּקַח בֶּן רְמַלְיָהוּ
  choice: രെമല്യാവിന്റെ മകനായ പേക്കഹിനെയും
  rationale: രണ്ടാമത്തെ നേരിട്ടുള്ള കർമത്തെ ആദ്യത്തേതിനോട് ഏകോപിപ്പിക്കുകയും בן എന്ന വംശപരിചയത്തെ വ്യക്തമായ മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; സ്വരീകരണത്തിലെ ചരിത്രപരമായ അനിശ്ചിതത്വം കണക്കിലെടുത്ത് സാധാരണ പണ്ഡിതപ്രയോഗത്തോട് ചേർന്ന രൂപം സ്വീകരിക്കുന്നു.
- issue: ദൈവം ശത്രുരാജാക്കന്മാരെ അയയ്ക്കാൻ ‘തുടങ്ങി’ എന്ന പ്രസ്താവന
  choice: വാക്യത്തിലെ നേരിട്ടുള്ള ദൈവിക പ്രവർത്തനഭാഷ നിലനിർത്തി
  alternative: അവർ വരാൻ ദൈവം അനുവദിച്ചു
  rationale: ഹിഫിൽ ക്രിയ ദൈവത്തെ പ്രവർത്തനത്തിന്റെ കാരണക്കാരനായി അവതരിപ്പിക്കുന്നു. ‘അനുവദിച്ചു’ എന്നു മാറ്റുന്നത് മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ ശക്തിയും സംഘർഷവും അനാവശ്യമായി ലഘൂകരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. ‘ആ നാളുകളിൽ’ എന്ന രൂപം എബ്രായ ബഹുവചനപ്രയോഗം നിലനിർത്തുന്നു. വ്യക്തിനാമങ്ങൾ വായിക്കാൻ എളുപ്പമുള്ള മലയാളലിപ്യന്തരണത്തിൽ നൽകി; വാക്യഘടന അനാവശ്യമായി സംസ്കൃതവത്കരിച്ചിട്ടില്ല.
