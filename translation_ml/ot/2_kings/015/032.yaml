  yaml_path: translation/ot/2_kings/015/032.yaml
  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
translation:
  language: ml
  text: രെമല്യാവിന്റെ മകനും ഇസ്രായേലിന്റെ രാജാവുമായ പേക്കഹിന്റെ ഭരണത്തിന്റെ രണ്ടാം വർഷത്തിൽ, ഉസ്സീയാവിന്റെ[b] മകനായ യോഥാം യെഹൂദയുടെ രാജാവായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭരണം ആരംഭിച്ചു.” എബ്രായ ക്രിയയ്ക്ക് രാജാവാകുക എന്നോ ഭരണം ആരംഭിക്കുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഉസ്സീയാവ് മറ്റിടങ്ങളിൽ അസര്യാവ് എന്നും അറിയപ്പെടുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/פֶקַח
  choice: പേക്കഹിന്റെ ഭരണത്തിന്റെ രണ്ടാം വർഷത്തിൽ
  rationale: ഇത് രാജാവിന്റെ ഭരണവർഷം സൂചിപ്പിക്കുന്ന എബ്രായ കാലനിർണ്ണയപ്രയോഗമാണ്. שְׁתַּיִם രൂപത്തിൽ ‘രണ്ട്’ എന്നാണെങ്കിലും ഇവിടെ ‘രണ്ടാം’ എന്ന ക്രമസംഖ്യാർഥത്തിലാണ്.
- source_word: בֶּן רְמַלְיָהוּ
  choice: രെമല്യാവിന്റെ മകൻ
  rationale: ചരിത്രപരമായ കൃത്യത നിലനിർത്തുന്ന സാധാരണ പിതൃനാമപ്രയോഗം.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ
  rationale: പേക്കഹിന്റെ രാജത്വമേഖല വ്യക്തമാക്കുന്ന പദവി മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: ഈ രാജാരോഹണവിവരണത്തിൽ ക്രിയ രാജാവാകുന്നതിനെ അഥവാ ഭരണം ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘രാജാവായി’ എന്നത് സന്ദർഭത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: יוֹתָם
  choice: യോഥാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן עֻזִיָּהוּ
  choice: ഉസ്സീയാവിന്റെ മകൻ
  rationale: ഈ വാക്യത്തിലെ עֻזִּיָּהוּ എന്ന പേരിനെ നേരിട്ട് ലിപ്യന്തരിച്ചു; ഇതേ രാജാവ് മറ്റിടങ്ങളിൽ അസര്യാവ് എന്നും അറിയപ്പെടുന്നു.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ
  rationale: യോഥാമിന്റെ രാജത്വമേഖല വ്യക്തമാക്കുന്ന മൂലപാഠത്തിലെ പദവി നിലനിർത്തി.
theological_decisions:
- issue: מָלַךְ എന്ന ക്രിയയുടെ രാജാരോഹണാർഥവും ഭരണാരംഭാർഥവും
  choice: രാജാവായി
  alternative: ഭരണം ആരംഭിച്ചു
  rationale: രണ്ടു ആശയങ്ങളും എബ്രായ ക്രിയയിൽ ഉൾക്കൊള്ളാവുന്നതാണ്. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ രാജാരോഹണാർഥം നൽകി, മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. രാജപദവികൾ ബന്ധപ്പെട്ട പേരുകളോട് നേരിട്ട് ചേർത്തതിനാൽ വാക്യബന്ധം വ്യക്തമാണ്; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
