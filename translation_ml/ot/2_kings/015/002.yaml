id: 2KI.15.2
reference: 2 Kings 15:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בֶּן שֵׁ֨שׁ עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְכָלְיָ֖הוּ מִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/002.yaml
  text: He was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah of Jerusalem.
translation:
  language: ml
  text: അവൻ രാജാവായപ്പോൾ പതിനാറു വയസ്സായിരുന്നു. അവൻ യെരൂശലേമിൽ അമ്പത്തിരണ്ടു വർഷം ഭരിച്ചു. യെരൂശലേം സ്വദേശിനിയായ[a] അവന്റെ അമ്മയുടെ പേര് യെഖല്യാഹു എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെരൂശലേമിൽനിന്നുള്ളവളായ.”
    reason: מִן എന്ന എബ്രായ ഉപസർഗം ‘സ്വദേശിയായ’ എന്നും കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘നിന്നുള്ള’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: പതിനാറു വയസ്സായിരുന്നു
  rationale: ‘പതിനാറു വർഷത്തിന്റെ മകൻ’ എന്ന എബ്രായ പ്രായപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: הָיָה בְמָלְכוֹ
  choice: അവൻ രാജാവായപ്പോൾ
  rationale: അധികാരമേറ്റ സമയത്തെ പ്രായമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘രാജാവായപ്പോൾ’ അതിന്റെ കാലസംബന്ധമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה מָלַךְ
  choice: അമ്പത്തിരണ്ടു വർഷം ഭരിച്ചു
  rationale: ഭരണകാലത്തിന്റെ ദൈർഘ്യവും מָלַךְ എന്ന ക്രിയയുടെ രാജഭരണസംബന്ധമായ അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בִּירוּשָׁלָם
  choice: യെരൂശലേമിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് … എന്നായിരുന്നു
  rationale: രാജാക്കന്മാരുടെ പുസ്തകത്തിലെ പതിവു വിവരസൂത്രത്തെ അർഥനിഷ്ഠവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְכָלְיָהוּ
  choice: യെഖല്യാഹു
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מִירוּשָׁלָם
  choice: യെരൂശലേം സ്വദേശിനിയായ
  rationale: מִן ഇവിടെ ചലനത്തേക്കാൾ ഉത്ഭവസ്ഥലമോ സ്വദേശമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘സ്വദേശിനിയായ’ എന്നത് സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ഭരണകാല കണക്കിന്റെ അവതരണം
  choice: മൂലപാഠത്തിലുള്ള ‘അമ്പത്തിരണ്ടു വർഷം’ മാറ്റമില്ലാതെ നിലനിർത്തി
  alternative: മറ്റു കാലഗണനകളുമായി പൊരുത്തപ്പെടുത്തുന്ന വിശദീകരണം ചേർക്കുക
  rationale: വാക്യം നൽകുന്ന രാജവാഴ്ചയുടെ കാലദൈർഘ്യം അതേപടി പരിഭാഷപ്പെടുത്തുകയും പുറംകാലഗണനയുടെ അടിസ്ഥാനത്തിൽ പാഠത്തെ വ്യാഖ്യാനിച്ച് മാറ്റാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. എബ്രായ രാജവാഴ്ചാ സൂത്രത്തിന്റെ വിവരക്രമം പരമാവധി നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി.
