  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֜ה אֶת הַ/מֶּ֗לֶךְ וַ/יְהִ֤י מְצֹרָע֙ עַד י֣וֹם מֹת֔/וֹ וַ/יֵּ֖שֶׁב בְּ/בֵ֣ית הַ/חָפְשִׁ֑ית וְ/יוֹתָ֤ם בֶּן הַ/מֶּ֨לֶךְ֙ עַל הַ/בַּ֔יִת שֹׁפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
translation:
  language: ml
  text: യഹോവ രാജാവിനെ ബാധിച്ചു; അവൻ തന്റെ മരണദിവസംവരെ കുഷ്ഠരോഗിയായി[a] ഒരു ഒറ്റപ്പെട്ട ഭവനത്തിൽ താമസിച്ചു.[b] രാജാവിന്റെ മകനായ യോഥാം രാജഭവനത്തിന്റെ മേൽനോട്ടം വഹിക്കുകയും ദേശത്തിലെ ജനത്തിനു ന്യായവിധി നടത്തുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘കുഷ്ഠരോഗിയായി’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ആധുനിക കുഷ്ഠരോഗത്തെ മാത്രം സൂചിപ്പിക്കണമെന്നില്ല; ഗുരുതരമായ മറ്റൊരു ചർമരോഗവും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; ‘വേർതിരിവിന്റെ ഭവനത്തിൽ’ അല്ലെങ്കിൽ ‘പ്രത്യേക ഭവനത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. രോഗബാധിതനെ വേർതിരിച്ചു പാർപ്പിച്ച വസതിയായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ മലയാളത്തിലെ സുപരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: וַיְנַגַּע
  choice: ബാധിച്ചു
  rationale: ദൈവിക പ്രവർത്തനം വ്യക്തമാക്കുകയും പ്രഹരത്തിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מְצֹרָע
  choice: കുഷ്ഠരോഗിയായി
  rationale: പരമ്പരാഗതവും സംക്ഷിപ്തവുമായ വിവർത്തനം; ആധുനിക ഹാൻസൻസ് രോഗം മാത്രമാണ് ഉദ്ദേശ്യമെന്ന് ഉറപ്പിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: עַד יוֹם מֹתוֹ
  choice: മരിക്കുന്ന ദിവസംവരെ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ഗൗരവമുള്ള ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּבֵית הַחָפְשִׁית
  choice: ഒരു ഒറ്റപ്പെട്ട ഭവനത്തിൽ
  rationale: ദുഷ്കരമായ എബ്രായ പ്രയോഗം സാമൂഹികമായി വേർതിരിച്ച പാർപ്പിടത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭാനുസൃതമായി നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: עַל הַבַּיִת
  choice: രാജകുടുംബത്തിന്റെ ചുമതല വഹിച്ചുകൊണ്ട്
  rationale: രാജധാനിയുടെയോ രാജഗൃഹത്തിന്റെയോ ഭരണചുമതലയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: שֹׁפֵט
  choice: ന്യായപാലനം നടത്തി
  rationale: തുടർച്ചയായ ന്യായവിധി-ഭരണ ഉത്തരവാദിത്വം സൂചിപ്പിക്കുന്നു.
- source_word: עַם הָאָרֶץ
  choice: ദേശത്തിലെ ജനം
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ പൊതുജനസൂചന നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
theological_decisions:
- issue: מְצֹרָע എന്ന പദം സൂചിപ്പിക്കുന്ന രാജാവിന്റെ രോഗാവസ്ഥ
  choice: മുഖ്യപാഠത്തിൽ പരമ്പരാഗതമായ ‘കുഷ്ഠരോഗിയായി’ എന്ന പ്രയോഗം നിലനിർത്തി, രോഗത്തിന്റെ കൃത്യമായ ആധുനിക വൈദ്യനിർണയം അനിശ്ചിതമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ഗുരുതരമായ ചർമരോഗം ബാധിച്ചവനായി
  rationale: പാഠം ഒരു നിർദിഷ്ട ആധുനിക രോഗനിർണയം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ പരിചിതമായ പദം ഉപയോഗിക്കുമ്പോഴും അതിന്റെ വിശാലമായ പുരാതന അർഥപരിധി സംരക്ഷിക്കുന്നു.
- issue: בְּבֵית הַחָפְשִׁית എന്ന ദുഷ്കരമായ പ്രയോഗത്തിന്റെ അർഥം
  choice: ഒറ്റപ്പെട്ട ഭവനം
  alternative: വേർതിരിവിന്റെ ഭവനം / പ്രത്യേക ഭവനം
  rationale: രോഗാവസ്ഥമൂലമുള്ള വേർതിരിച്ച താമസമാണ് സന്ദർഭത്തിൽ ഏറ്റവും സാധ്യതയുള്ളത്; എങ്കിലും പ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം ഉറപ്പില്ലാത്തതിനാൽ അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകൾ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ദൈവിക പ്രവർത്തനം, രാജാവിന്റെ നില, യോഥാമിന്റെ ഭരണ-ന്യായപാലന ചുമതല എന്നിവ വ്യക്തമായി നിലനിർത്തി.
