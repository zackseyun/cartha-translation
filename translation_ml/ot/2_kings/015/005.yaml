  to: യഹോവ രാജാവിനെ ബാധിച്ചു; അവൻ തന്റെ മരണദിവസംവരെ കുഷ്ഠരോഗിയായി[a] ഒരു ഒറ്റപ്പെട്ട ഭവനത്തിൽ താമസിച്ചു.[b] രാജാവിന്റെ മകനായ യോഥാം രാജഭവനത്തിന്റെ മേൽനോട്ടം വഹിക്കുകയും ദേശത്തിലെ ജനത്തിനു ന്യായവിധി നടത്തുകയും ചെയ്തു.
  rationale: രാജകുടുംബം എന്ന വ്യാഖ്യാനപരമായ പരിമിതി ഒഴിവാക്കി, രാജഭവനത്തിന്റെ ഭരണ-മേൽനോട്ടം എന്ന എബ്രായപ്രയോഗത്തിന്റെ സാധാരണ അർഥം നൽകിയിരിക്കുന്നു. രോഗപദത്തിന്റെ വിശദീകരണമായ അടിക്കുറിപ്പ് അതേ പദത്തിലേക്കു മാറ്റി. മറ്റെല്ലാ ദുഷ്കരമായ അർഥങ്ങളും അടിക്കുറിപ്പുകളിൽ യഥോചിതമായി സംരക്ഷിച്ചിട്ടുണ്ട്.
