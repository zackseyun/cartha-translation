source:
  edition: WLC
  text: ה֣וּא דְבַר יְהוָ֗ה אֲשֶׁ֨ר דִּבֶּ֤ר אֶל יֵהוּא֙ לֵ/אמֹ֔ר בְּנֵ֣י רְבִיעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל וַֽ/יְהִי כֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: ml
  text: 'യഹ്‌വേ യേഹൂവിനോടു പറഞ്ഞ വചനം ഇതായിരുന്നു: “നിന്റെ പുത്രന്മാർ നാലാം തലമുറവരെ ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരിക്കും.” അങ്ങനെതന്നെ സംഭവിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא דְבַר יְהוָה
  choice: യഹ്‌വെയുടെ വചനം ഇതായിരുന്നു
  rationale: הוּא മുൻവിവരണത്തിലെ സംഭവത്തെ ചൂണ്ടിക്കാട്ടി പഴയ ദൈവവചനത്തിന്റെ നിവൃത്തി തിരിച്ചറിയിക്കുന്നു. ‘വചനം ഇതായിരുന്നു’ എന്ന പ്രയോഗം ആ സൂചനയും ദൈവിക പ്രഖ്യാപനത്തിന്റെ ഭാരവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר דִּבֶּר אֶל יֵהוּא לֵאמֹר
  choice: യേഹൂവിനോട് അരുളിച്ചെയ്ത
  rationale: דִּבֶּר אֶל എന്നത് ‘സംസാരിച്ചു/പറഞ്ഞു’ എന്നാണ്; ദൈവത്തിന്റെ ഔദ്യോഗിക പ്രഖ്യാപനമെന്ന സന്ദർഭത്തിൽ ‘അരുളിച്ചെയ്ത’ മാന്യവും മലയാള ബൈബിൾശൈലിക്ക് യോജിച്ചതുമാണ്. לֵאמֹר ഉദ്ധരണി ആരംഭിക്കുന്ന ഘടകമായതിനാൽ തുടർന്നുള്ള നേരിട്ടുള്ള ഉദ്ധരണിയിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: בְּנֵי רְבִיעִים
  choice: നിന്റെ പുത്രന്മാർ നാലാം തലമുറവരെ
  rationale: ഹീബ്രായ പ്രയോഗം യേഹൂവിന്റെ പുത്രപരമ്പര നാല് തലമുറവരെ തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സന്തതികൾ’ എന്നു പൊതുവാക്കാതെ പുത്രബന്ധം നിലനിർത്തുകയും മലയാളത്തിൽ അർത്ഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരിക്കും
  rationale: സിംഹാസനത്തിൽ ‘ഇരിക്കുക’ എന്ന രാജത്വരൂപകം അതേപടി നിലനിർത്തുന്നു; ‘ഭരിക്കും’ എന്ന് വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല. לְךָ വംശപരമായ തുടർച്ചയുടെ ആശയത്തിൽ മലയാളവാക്യത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: וַיְהִי כֵן
  choice: അങ്ങനെതന്നെ സംഭവിച്ചു
  rationale: പ്രഖ്യാപനം കൃത്യമായി നിവൃത്തിയായി എന്ന സമാപനസൂത്രത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു. ‘യഹ്‌വെ’ എന്നത് Yahweh എന്ന പുനർനിർമിത ഉച്ചാരണത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- issue: ദൈവവചനത്തിന്റെ നിവൃത്തി
  choice: മുൻസംഭവത്തെ യഹ്‌വെയുടെ വചനത്തിന്റെ നിവൃത്തിയായി നേരിട്ട് ബന്ധിപ്പിക്കുന്നു
  alternative: ഇത് ഒരു പൊതുവായ ചരിത്രപരാമർശമായി മാത്രം അവതരിപ്പിക്കുക
  rationale: הוּא എന്ന ചൂണ്ടുപദവും וַיְהִי כֵן എന്ന സമാപനവും ചേർന്ന് മുൻവിവരിച്ച രാജവംശീയ സംഭവത്തെ ദൈവിക പ്രഖ്യാപനത്തിന്റെ നിവൃത്തിയായി അവതരിപ്പിക്കുന്നു; പാഠത്തിന്റെ ഈ ദൈവശാസ്ത്രപരമായ ബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. ‘അരുളിച്ചെയ്ത’, ‘വചനം’, ‘സിംഹാസനം’ എന്നീ പദങ്ങൾ മാന്യമായ തിരുവെഴുത്ത് രജിസ്റ്റർ നിലനിർത്തുമ്പോഴും വാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
