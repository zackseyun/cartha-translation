  text: שַׁלּ֤וּם בֶּן יָבֵישׁ֙ מָלַ֔ךְ בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה לְ/עֻזִיָּ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ יֶֽרַח יָמִ֖ים בְּ/שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/013.yaml
  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ ഉസ്സീയാവിന്റെ വാഴ്ചയുടെ മുപ്പത്തൊമ്പതാം ആണ്ടിൽ യാബേശിന്റെ മകൻ ശല്ലൂം രാജാവായി; അവൻ ശമര്യയിൽ ഒരു മാസക്കാലം[a] വാണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളുടെ ഒരു മാസം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: നിശ്ചിത ഭരണവർഷത്തിൽ ശല്ലൂം സിംഹാസനമേറ്റതിനെ സൂചിപ്പിക്കുന്നതിനാൽ, കേവലം ‘വാണു’ എന്നതിനെക്കാൾ ‘രാജാവായി’ പ്രവേശനാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה לְעֻזִיָּה מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ ഉസ്സീയാവിന്റെ വാഴ്ചയുടെ മുപ്പത്തൊമ്പതാം ആണ്ടിൽ
  rationale: രാജാക്കന്മാരുടെ ഭരണകാലങ്ങളെ തമ്മിൽ ബന്ധിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; לְ എന്നത് ഉസ്സീയാവിന്റെ ഭരണത്തിൽ എണ്ണപ്പെടുന്ന വർഷത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: അവൻ … വാണു
  rationale: രാജാവായതിനു പിന്നാലെ അവന്റെ ഭരണത്തിന്റെ ദൈർഘ്യം വിവരിക്കുന്ന ആഖ്യാനക്രമം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: יֶרַח יָמִים
  choice: ഒരു മാസക്കാലം[a]
  rationale: ‘ദിവസങ്ങളുടെ ഒരു മാസം’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന മലയാളത്തിൽ നൽകുന്നു; ഉറവിടത്തിന്റെ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: സ്ഥലസൂചകമായ בְ നേരിട്ട് ‘യിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി, അവൻ ഭരിച്ചിരുന്ന തലസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
