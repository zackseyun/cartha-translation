translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങൾ സ്വീകരിച്ചു; എബ്രായത്തിലെ സംക്ഷിപ്തത അർധവിരാമത്തിലൂടെ നിലനിർത്തി.
