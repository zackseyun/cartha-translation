  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘പ്രബലർ’ എന്ന പദം ഹീബ്രു പ്രയോഗത്തിലെ സൈനിക, സാമൂഹിക, സാമ്പത്തിക സാധ്യതകൾ പൂർണമായി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു; ആവശ്യമായ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
