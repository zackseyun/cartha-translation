  text: וַ/יֹּצֵא֩ מְנַחֵ֨ם אֶת הַ/כֶּ֜סֶף עַל יִשְׂרָאֵ֗ל עַ֚ל כָּל גִּבּוֹרֵ֣י הַ/חַ֔יִל לָ/תֵת֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר חֲמִשִּׁ֧ים שְׁקָלִ֛ים כֶּ֖סֶף לְ/אִ֣ישׁ אֶחָ֑ד וַ/יָּ֨שָׁב֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹא עָ֥מַד שָׁ֖ם בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
translation:
  language: ml
  text: അപ്പോൾ മെനഹേം അശ്ശൂർരാജാവിന് കൊടുക്കാനായി ഇസ്രായേലിൽ പ്രബലരായ എല്ലാവരിൽനിന്നും[a] ആളൊന്നിന് അമ്പത് ശേക്കെൽ വെള്ളി വീതം നിർബന്ധമായി പിരിച്ചെടുത്തു. അങ്ങനെ അശ്ശൂർരാജാവ് മടങ്ങിപ്പോയി; അവൻ അവിടെ ദേശത്ത് തങ്ങിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സമ്പന്നരായ എല്ലാവരിൽനിന്നും’ അല്ലെങ്കിൽ ‘ശൂരന്മാരായ എല്ലാവരിൽനിന്നും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പ്രയോഗം സൈനികശക്തിയോ സാമൂഹികപ്രാബല്യമോ സമ്പത്തോ ഉള്ളവരെ സൂചിപ്പിക്കാം; നികുതി പിരിക്കുന്ന ഈ സന്ദർഭം സാമ്പത്തികശേഷിയുള്ളവരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന ധാരണയ്ക്കു കൂടുതൽ അനുകൂലമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא ... הַכֶּסֶף עַל־יִשְׂרָאֵל
  choice: പണം ... നിർബന്ധമായി പിരിച്ചെടുത്തു
  rationale: יצא എന്ന ക്രിയയുടെ കാരണാർഥരൂപം അക്ഷരാർഥത്തിൽ ‘പുറപ്പെടുവിച്ചു’ എന്നാണെങ്കിലും, כסף എന്നും עַל־יִשְׂרָאֵל എന്നും ചേർന്ന ഈ നികുതിസന്ദർഭത്തിൽ നിർബന്ധിത പിരിവാണ് സൂചിപ്പിക്കുന്നത്. ‘നിർബന്ധമായി പിരിച്ചെടുത്തു’ എന്നത് ആ ധനഭാരവും ബലപ്രയോഗസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  choice: ഇസ്രായേലിലെ പ്രബലരായ എല്ലാവരിൽനിന്നും[a]
  rationale: ഈ പ്രയോഗം സൈനികശക്തിയുള്ളവർ, സാമൂഹികപ്രാബല്യമുള്ളവർ, അല്ലെങ്കിൽ സമ്പന്നർ എന്നിവരെ സൂചിപ്പിക്കാം. ‘പ്രബലർ’ മൂലത്തിലെ വിശാലത ഒരു പരിധിവരെ നിലനിർത്തുന്നു; നികുതിസന്ദർഭം സമ്പന്നരെയോ സാമ്പത്തികശേഷിയുള്ളവരെയോ ഉദ്ദേശിക്കുന്നതായി സൂചിപ്പിക്കുന്നതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לָתֵת לְמֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവിനു കൊടുക്കേണ്ട
  rationale: ലക്ഷ്യം സൂചിപ്പിക്കുന്ന ഹീബ്രു അനന്തരൂപം മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ‘കൊടുക്കേണ്ട’ എന്നു ചേർത്തു; പിരിച്ചെടുത്ത പണത്തിന്റെ ഉദ്ദേശ്യം ഇതിലൂടെ വ്യക്തമാണ്.
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף לְאִישׁ אֶחָד
  choice: ആളൊന്നിന് അമ്പത് ശേക്കെൽ വെള്ളിവീതം
  rationale: തൂക്കവും ലോഹവും വ്യക്തമാക്കുന്ന മൂലപ്രയോഗം ‘അമ്പത് ശേക്കെൽ വെള്ളി’ എന്ന് നിലനിർത്തി. לְאִישׁ אֶחָד ഓരോ യോഗ്യനായ വ്യക്തിക്കും ചുമത്തിയ തുകയായതിനാൽ ‘ആളൊന്നിന് ... വീതം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיָּשָׁב מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവ് മടങ്ങിപ്പോയി
  rationale: שׁוב ഇവിടെ പണം ലഭിച്ചതിനു ശേഷമുള്ള പിൻവാങ്ങലിനെയോ മടങ്ങിപ്പോക്കിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  choice: അവൻ അവിടെ ദേശത്തു താമസിച്ചില്ല
  rationale: עמד എന്നതിന്റെ അക്ഷരാർഥം ‘നിന്നു’ എന്നാണെങ്കിലും ഇവിടെ തുടർന്നു തങ്ങുക എന്ന അർഥമാണ്. ‘താമസിച്ചില്ല’ ഈ സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
