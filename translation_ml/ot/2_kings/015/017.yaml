source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ מְנַחֵ֨ם בֶּן גָּדִ֧י עַל יִשְׂרָאֵ֛ל עֶ֥שֶׂר שָׁנִ֖ים בְּ/שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/017.yaml
  text: In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ അസര്യാവിന്റെ മുപ്പത്തൊൻപതാം ഭരണവർഷത്തിൽ ഗാദിയുടെ മകനായ മെനഹേം ഇസ്രായേലിന്റെ രാജാവായി; അവൻ ശമര്യയിൽ പത്തു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: മുപ്പത്തൊൻപതാം ഭരണവർഷത്തിൽ
  rationale: രാജഭരണകാലത്തെ അടിസ്ഥാനമാക്കിയുള്ള കാലസൂചനയാണ് ഇവിടെ; മലയാളത്തിൽ ‘ഭരണവർഷം’ ചേർക്കുന്നത് ക്രമസംഖ്യയുടെ അർത്ഥം സ്വാഭാവികവും വ്യക്തവുമാക്കുന്നു.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ അസര്യാവിന്റെ
  rationale: ל ഇവിടെ അസര്യാവിന്റെ ഭരണവർഷത്തെ സൂചിപ്പിക്കുന്നു; രാജപദവിയോടുകൂടിയ സ്വാഭാവിക മലയാളപ്രയോഗം സ്വീകരിച്ചു.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: തുടർന്ന് ഭരണകാലദൈർഘ്യം പ്രത്യേകം പറയുന്നതിനാൽ, ഇവിടെ ക്രിയ അധികാരാരോഹണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: ഗാദിയുടെ മകനായ മെനഹേം
  rationale: בן എന്ന ബന്ധസൂചന വ്യക്തമായി നിലനിർത്തി പേരുകൾ ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ രാജാവായി
  rationale: מלך ... על എന്നത് ഇസ്രായേലിന്മേലുള്ള രാജഭരണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ രാജപദവി പ്രയോഗിച്ചു.
- source_word: עֶשֶׂר שָׁנִים
  choice: പത്തു വർഷം
  rationale: ഭരണകാലത്തിന്റെ ദൈർഘ്യം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: ഭരണത്തിന്റെ ആസ്ഥാനമായ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനവാചകം; പരമ്പരാഗതവും പരിചിതവുമായ മലയാള നാമരൂപം ഉപയോഗിച്ചു.
