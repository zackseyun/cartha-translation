  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. ഒരേ ഹീബ്രു ക്രിയയുടെ പ്രവേശനവും ഭരണദൈർഘ്യവും മലയാളത്തിൽ ‘രാജാവായി’, ‘ഭരിച്ചു’ എന്നു വേർതിരിച്ച് വ്യക്തമാക്കിയിരിക്കുന്നു.
