  text: וְ/יֶ֖תֶר דִּבְרֵ֣י זְכַרְיָ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/011.yaml
  text: The rest of the acts of Zechariah—behold[a], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ml
  text: സെഖര്യാവിന്റെ ശേഷിച്ച പ്രവൃത്തികൾ—ഇതാ, അവ ഇസ്രായേൽ രാജാക്കന്മാരുടെ ദിനവൃത്താന്തഗ്രന്ഥത്തിൽ[a] എഴുതപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേൽ രാജാക്കന്മാരുടെ വാർഷികവൃത്താന്തഗ്രന്ഥത്തിൽ.’
    reason: ദിനവൃത്താന്തഗ്രന്ഥം എന്ന ശീർഷകസദൃശ പ്രയോഗത്തിന് രാജകീയ വാർഷികരേഖകൾ/വൃത്താന്തങ്ങൾ എന്ന അർഥം വ്യക്തമാക്കുന്ന പരിഭാഷാവികൽപം.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: മറ്റു പ്രവൃത്തികൾ
  rationale: രാജഭരണത്തിന്റെ ശേഷിക്കുന്ന കാര്യങ്ങളെയും ചെയ്തികളെയും സൂചിപ്പിക്കുന്ന ആവർത്തിത ചരിത്രസംഗ്രഹശൈലി സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; വാക്യാരംഭത്തിലെ וְ-യ്ക്ക് സന്ദർഭത്തിൽ പ്രത്യേകമായ കാലസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: זְכַרְיָה
  choice: സെഖര്യാവ്
  rationale: മലയാള ബൈബിൾവായനയിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: הִנָּם
  choice: ഇതാ, അവ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ സൂചകകണത്തിന്റെ അടയാളപ്പെടുത്തിയ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: כְּתוּבִים
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: എബ്രായത്തിലെ കർമണിപങ്കാളിത്തരൂപത്തിന്റെ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: ദിനവൃത്താന്തഗ്രന്ഥത്തിൽ
  rationale: രാജകീയ രേഖാസമാഹാരത്തെ സൂചിപ്പിക്കുന്ന ശീർഷകസദൃശ പ്രയോഗം; עַל סֵפֶר എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഗ്രന്ഥത്തിൽ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ
  rationale: രേഖയുടെ ശീർഷകബന്ധം മലയാളത്തിലെ ഉടമസ്ഥബന്ധരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
