  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
translation:
  language: ml
  text: അപ്പോൾ യാബേശിന്റെ മകനായ ശല്ലൂം അവനെതിരെ ഗൂഢാലോചന നടത്തി, ജനത്തിന്റെ മുമ്പിൽവെച്ച്[a] അവനെ അടിച്ചു കൊന്നു; അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരസ്യമായി’ / ‘സഭയുടെ മുമ്പിൽവെച്ച്.’ കָבָל־עָם എന്ന എബ്രായപ്രയോഗത്തിന്റെ അർഥം ദുഷ്കരമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: അവനെതിരെ ഗൂഢാലോചന നടത്തി
  rationale: രാജകീയ അധികാരത്തിനെതിരായ രഹസ്യനീക്കമെന്ന രാഷ്ട്രീയ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שַׁלֻּם בֶּן־יָבֵשׁ
  choice: യാബേശിന്റെ മകനായ ശല്ലൂം
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ പാരമ്പര്യത്തിന് യോജിച്ച രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും בֶּן എന്ന വംശാവലിസൂത്രം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: וַיַּכֵּהוּ
  choice: അവനെ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ അക്രമപരമായ പ്രഹരാർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള മരണകാരകക്രിയയിൽനിന്ന് ഇതിനെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: קָבָל־עָם
  choice: ജനത്തിന്റെ മുമ്പിൽവെച്ച്
  rationale: ദുഷ്കരവും അപൂർവവുമായ പ്രയോഗത്തെ വാച്യരൂപത്തോട് അടുത്തുനിന്ന് ജനസാന്നിധ്യത്തിലുള്ള പരസ്യസംഭവമായി അവതരിപ്പിക്കുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיְמִיתֵהוּ
  choice: കൊന്നു
  rationale: מות എന്ന ഹിഫീൽ രൂപത്തിന്റെ മരണകാരകമായ അർഥം വ്യക്തമായി നൽകുന്നു; മുൻക്രിയയിലെ ആക്രമണത്തോട് ലയിപ്പിക്കാതെ പ്രവർത്തനക്രമം നിലനിർത്തുന്നു.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: അവനു പകരം രാജാവായി
  rationale: സിംഹാസനാവകാശത്തിലെ മാറ്റം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
