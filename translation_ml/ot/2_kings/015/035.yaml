  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
translation:
  language: ml
  text: എന്നിരുന്നാലും, ഉന്നത ആരാധനാസ്ഥലങ്ങൾ നീക്കംചെയ്യപ്പെട്ടില്ല; ജനങ്ങൾ അപ്പോഴും ഉന്നത ആരാധനാസ്ഥലങ്ങളിൽ യാഗങ്ങൾ അർപ്പിക്കുകയും ധൂപം കത്തിക്കുകയും ചെയ്തിരുന്നു[a]. യഹോവയുടെ ആലയത്തിന്റെ മുകളിലെ കവാടം അവൻ പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉന്നത ആരാധനാസ്ഥലങ്ങളിൽ യാഗങ്ങൾ അർപ്പിക്കുകയും വഴിപാടുകൾ കത്തിച്ചു പുകയായി ഉയർത്തുകയും ചെയ്തിരുന്നു.’ എബ്രായ ക്രിയയ്ക്ക് പ്രത്യേകമായി ധൂപം കത്തിക്കുക എന്നോ, കൂടുതൽ വിശാലമായി ഒരു വഴിപാട് കത്തിച്ചു പുകയായി ഉയർത്തുക എന്നോ അർഥമാകാം.
