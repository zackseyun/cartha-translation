- source_word: שַׁעַר בֵּית יְהוָה הָעֶלְיוֹן
  choice: യഹോവയുടെ ആലയത്തിന്റെ മുകളിലെ കവാടം
  rationale: ‘യഹോവയുടെ ഭവനം’ എന്നത് മലയാളത്തിലെ സ്വാഭാവികമായ ദേവാലയപ്രയോഗമായ ‘യഹോവയുടെ ആലയം’ എന്നു നൽകി, കവാടത്തിന്റെ ഉയർന്ന സ്ഥാനം സൂചിപ്പിക്കുന്ന വിശേഷണം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമത്തെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവനാമം നേരിട്ട് ഉള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം ഉപയോഗിച്ചു.
- issue: בָּמוֹת എന്ന ആരാധനാസ്ഥലത്തിന്റെ സ്വഭാവം
  choice: പൂജാഗിരികൾ
  alternative: ഉന്നതസ്ഥലങ്ങൾ
  rationale: ഇവ വെറും ഭൂമിശാസ്ത്രപരമായ ഉയരങ്ങളല്ല, ആരാധനാകേന്ദ്രങ്ങളാണ് എന്ന ആശയം വ്യക്തമാക്കുന്നു; അവയുടെ നിയമാനുസൃതതയെക്കുറിച്ച് പദത്തിൽ അധികമായി വിധിനിർണയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘പൂജാഗിരികൾ’ ആരാധനാസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘പണിതത് അവനായിരുന്നു’ എന്ന രൂപം മൂലത്തിലെ സർവനാമ ഊന്നൽ നിലനിർത്തുന്നു.
