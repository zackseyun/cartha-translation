source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֣ר עָלָי/ו֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ שָׁלִישׁ֗/וֹ וַ/יַּכֵּ֨/הוּ בְ/שֹׁמְר֜וֹן בְּ/אַרְמ֤וֹן בֵּית מלך אֶת אַרְגֹּ֣ב וְ/אֶת הָ/אַרְיֵ֔ה וְ/עִמּ֛/וֹ חֲמִשִּׁ֥ים אִ֖ישׁ מִ/בְּנֵ֣י גִלְעָדִ֑ים וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
translation:
  language: ml
  text: അപ്പോൾ രെമല്യാവിന്റെ മകനായ പേക്കഹ്—അവന്റെ ഉന്നത സൈനികോദ്യോഗസ്ഥൻ[a]—അവനെതിരെ ഗൂഢാലോചന നടത്തി. പേക്കഹ് അർഗോബിനെയും അരിയേഹിനെയും[c] കൂടെക്കൊണ്ടും ഗിലെയാദ്യരിൽനിന്നുള്ള അമ്പതുപേരോടൊപ്പവും ശമര്യയിലെ രാജമന്ദിരത്തിന്റെ കോട്ടയിൽ[b] വെച്ച് അവനെ പ്രഹരിച്ച് വീഴ്ത്തി. അങ്ങനെ അവനെ കൊന്നു; അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവന്റെ സേനാനായകൻ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഉയർന്ന പദവിയിലുള്ള ഒരു സൈനികോദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ പദവി വ്യക്തമല്ല.
    reason: lexical_alternative
  - marker: b
    text: “രാജമന്ദിരത്തിലെ കൊട്ടാരത്തിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് കൊട്ടാരം, കോട്ട, അല്ലെങ്കിൽ ഉറപ്പുള്ള രാജവസതി എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: c
    text: അരിയേഹ് ഇവിടെ അർഗോബിനോടൊപ്പം വരുന്ന ഒരു വ്യക്തിനാമമായാണ് മനസ്സിലാക്കുന്നത്. ഈ എബ്രായപദത്തിന് സാധാരണയായി “സിംഹം” എന്നും അർഥമുണ്ട്. അർഗോബിന്റെയും അരിയേഹിന്റെയും ഈ വാക്യത്തിലെ കൃത്യമായ പങ്ക് എബ്രായവാക്യഘടനയിൽ പ്രയാസകരമാണ്; ഇവിടെ അവർ പേക്കഹിനോടൊപ്പം ഉണ്ടായിരുന്നവരായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: അവനെതിരെ ഗൂഢാലോചന നടത്തി
  rationale: രാജാവിനെതിരായ രാഷ്ട്രീയ ഗൂഢാലോചനയെയോ രാജ്യദ്രോഹപരമായ നീക്കത്തെയോ സൂചിപ്പിക്കുന്ന קשר എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ സ്വാഭാവിക പരിഭാഷ.
- source_word: שָׁלִישׁוֹ
  choice: അവന്റെ ഉന്നത സൈനികോദ്യോഗസ്ഥൻ
  rationale: കൃത്യമായ പദവി അനിശ്ചിതമാണെങ്കിലും രാജാവിനോടു ചേർന്ന ഉയർന്ന സൈനികോദ്യോഗസ്ഥനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ഒരു നിർദിഷ്ട ആധുനിക റാങ്ക് ചുമത്തിയിട്ടില്ല.
- source_word: וַיַּכֵּהוּ
  choice: അവനെ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/വീഴ്ത്തുക’ എന്ന ശക്തമായ അർഥം നിലനിർത്തുകയും പിന്നാലെയുള്ള וַיְמִיתֵהוּ എന്ന ‘കൊന്നു’ എന്ന ക്രിയയുമായി പൂർണമായി ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  choice: രാജമന്ദിരത്തിന്റെ കോട്ടയിൽ
  rationale: אַרְמוֹן കൊട്ടാരം, കോട്ട, സുരക്ഷിത രാജവസതി എന്നിവ സൂചിപ്പിക്കാം. ‘രാജമന്ദിരത്തിന്റെ കോട്ട’ എന്നത് രാജകീയ സമുച്ചയത്തിനുള്ളിലെ ഉറപ്പുള്ള ഭാഗമെന്ന സാധ്യത നിലനിർത്തുന്നു.
- source_word: אֶת אַרְגֹּב וְאֶת הָאַרְיֵה
  choice: അർഗോബിനോടും അരിയേഹിനോടുംകൂടെ അവനെ
  rationale: אֵת അടയാളപ്പെടുത്തിയ ഈ രണ്ടു പേരുകളും അടിക്കപ്പെട്ടവന്റെ സമാന്തര കർമങ്ങളായി വായിക്കപ്പെടുന്നു. ‘അവരോടൊപ്പം അവനെയും’ എന്ന ഘടന മൂവരും ആക്രമണത്തിന് ഇരയായെന്ന സ്വാഭാവിക അർഥം നൽകുന്നു; പേരുകളുടെ പങ്കിനെക്കുറിച്ച് മൂലവാക്യത്തിലുള്ള സംക്ഷിപ്തത അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  choice: പേക്കഹ് അമ്പത് ഗിലെയാദ്യരോടൊപ്പം
  rationale: വാക്യക്രമത്തിൽ ‘അവനോടൊപ്പം അമ്പത് ഗിലെയാദ്യർ’ എന്ന സാഹചര്യമൊഴിയാണ്; മലയാളത്തിൽ ആരോടൊപ്പമാണെന്ന് ആശയക്കുഴപ്പം വരാതിരിക്കാൻ പേക്കഹിന്റെ പേര് ആവർത്തിച്ചു.
- source_word: וַיְמִיתֵהוּ
  choice: കൊന്നു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ഇവിടെ നേരിട്ടുള്ള ‘കൊല്ലുക’ എന്ന അർഥമാണ്; മുൻക്രിയയോടൊപ്പം ‘വെട്ടിവീഴ്ത്തി കൊന്നു’ എന്ന സ്വാഭാവിക മലയാള ക്രമം ലഭിക്കുന്നു.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: അവനു പകരം രാജാവായി
  rationale: രാജാക്കന്മാരിലെ പതിവ് അധികാരാവകാശ സൂത്രവാക്യം മലയാളത്തിൽ ലളിതവും കൃത്യവുമായി അവതരിപ്പിക്കുന്നു.
