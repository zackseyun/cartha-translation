id: 2KI.15.24
reference: 2 Kings 15:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/024.yaml
  text: He did what was evil in the eyes of Yahweh[a]. He did not turn away from the sins of Jeroboam son of Nebat[b], who caused Israel to sin.
translation:
  language: ml
  text: അവൻ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു. ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച നെബാത്തിന്റെ മകൻ യൊരോബെയാമിന്റെ പാപങ്ങളിൽനിന്ന് അവൻ വിട്ടുമാറിയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: തിന്മയായതു ചെയ്തു
  rationale: രാജാവിനെ വിലയിരുത്തുന്ന പതിവു എബ്രായ പ്രയോഗത്തിന്റെ അർഥവും ഗൗരവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ദൈവനാമം പദവിപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֹא סָר מֵחַטֹּאות
  choice: പാപങ്ങളിൽനിന്ന് അവൻ വിട്ടുമാറിയില്ല
  rationale: סור എന്ന ക്രിയ ഇവിടെ ഒരു പാപപദ്ധതിയിൽനിന്ന് പിന്മാറാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിട്ടുമാറിയില്ല’ ആ ആശയം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകൻ യൊരോബെയാം
  rationale: എബ്രായ പിതൃനാമഘടന മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം വ്യക്തമായി സംരക്ഷിക്കുന്നു; വെറും ‘പാപത്തിലേക്കു നയിച്ചു’ എന്നതിനെക്കാൾ മൂലരൂപത്തോട് അടുത്തതാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിപ്പേരുകൊണ്ട് പകരാതെ, സാധാരണ പണ്ഡിത ലിപ്യന്തരത്തോട് ചേർന്ന മലയാളരൂപത്തിൽ നൽകുന്നു.
- issue: യൊരോബെയാം ഇസ്രായേലിനെ പാപം ചെയ്യിച്ചതിന്റെ കാരണാർഥം
  choice: പാപം ചെയ്യിച്ച
  alternative: പാപത്തിലേക്കു നയിച്ച
  rationale: ഹിഫീൽ ക്രിയാരൂപത്തിന്റെ യഥാർഥ കാരണാർഥം നിലനിർത്തുന്നു; എങ്ങനെ അതു സംഭവിച്ചു എന്നത് പാഠം ഇവിടെ വിശദീകരിക്കാത്തതിനാൽ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ രാജകീയ വിലയിരുത്തൽസൂത്രവും കാരണാർഥക്രിയയും സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ [a] അടിക്കുറിപ്പിന്റെ സ്ഥാനം അതിന്റെ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ അത് പിന്തുടർന്നില്ല; മലയാള കരടിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
