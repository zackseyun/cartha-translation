source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְרוּשָׁ֖א בַּת צָדֽוֹק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/033.yaml
  text: He was twenty-five years old when he began to reign[a], and he reigned sixteen years in Jerusalem. His mother’s name was Jerusha daughter of Zadok.
translation:
  language: ml
  text: അവൻ രാജാവായപ്പോൾ അവന് ഇരുപത്തഞ്ചു വയസ്സായിരുന്നു. അവൻ യെരൂശലേമിൽ പതിനാറു വർഷം ഭരിച്ചു. അവന്റെ അമ്മയുടെ പേര് സാദോക്കിന്റെ മകളായ യെരൂശാ എന്നായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: അവന് ഇരുപത്തഞ്ചു വയസ്സായിരുന്നു
  rationale: ‘ഇരുപത്തഞ്ചു വയസ്സുള്ള മകൻ’ എന്ന അക്ഷരാർഥരൂപത്തിനു പകരം, പ്രായം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: הָיָה בְמָלְכוֹ
  choice: അവൻ രാജാവായപ്പോൾ
  rationale: രാജ്യാരോഹണസമയത്തെ പ്രായം അറിയിക്കുന്ന ഹീബ്രു രാജവാഴ്ചാ സൂത്രവാക്യത്തെ സ്വാഭാവികമായും കൃത്യമായും അവതരിപ്പിക്കുന്നു.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: അവൻ ... പതിനാറു വർഷം ഭരിച്ചു
  rationale: ഭരണകാലത്തിന്റെ ദൈർഘ്യം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നൽകുന്നു.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണവും ‘ൽ’ വിഭക്തിയും ഉപയോഗിച്ചു.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് ... എന്നായിരുന്നു
  rationale: ഹീബ്രു വംശാവലി-രാജവാഴ്ചാ സൂത്രവാക്യത്തിന്റെ അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יְרוּשָׁא
  choice: യെരൂശാ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בַּת צָדוֹק
  choice: സാദോക്കിന്റെ മകളായ
  rationale: കുടുംബബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു; മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ചേരുന്നതിനായി വിശേഷണരൂപം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ രാജവാഴ്ചാ രേഖാശൈലി. ഇംഗ്ലീഷ് വിവർത്തനത്തിലെ ‘Jerusha/Jerushah’ എന്ന ഇംഗ്ലീഷ് അക്ഷരവിന്യാസവ്യത്യാസം മലയാളത്തിൽ പ്രസക്തമായ അർഥവ്യത്യാസമുണ്ടാക്കാത്തതിനാൽ അടിക്കുറിപ്പായി ഉൾപ്പെടുത്തിയിട്ടില്ല.
