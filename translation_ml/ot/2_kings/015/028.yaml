  terminology: ‘യാഹ്‌വെ’ consistently renders the Tetragrammaton, and ‘പാപം ചെയ്യിച്ച’ properly conveys the Hiphil causative. The patronymic and the relative clause are clear and preserve the source’s attribution of culpability to Jeroboam.
