id: 2KI.15.28
reference: 2 Kings 15:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִן חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: ml
  text: അവൻ യാഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു. ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച നെബാത്തിന്റെ മകൻ യൊരോബെയാമിന്റെ പാപങ്ങളിൽനിന്ന് അവൻ പിന്തിരിഞ്ഞില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: അവൻ തിന്മയായതു ചെയ്തു
  rationale: രാജാവിനെ വിലയിരുത്തുന്ന പതിവ് എബ്രായ പ്രയോഗത്തിന്റെ അർഥവും സ്വാഭാവികമായ മലയാള വാക്യഘടനയും നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യാഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ ഉടമ്പടിനാമം പദവിനാമമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֹא סָר מִן חַטֹּאות
  choice: പാപങ്ങളിൽനിന്ന് അവൻ പിന്തിരിഞ്ഞില്ല
  rationale: סור מן എന്നത് ഒരു പ്രവൃത്തിമാർഗത്തിൽനിന്ന് മാറുകയോ പിന്തിരിയുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ധാർമികസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകൻ യൊരോബെയാം
  rationale: എബ്രായ പിതൃനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും പേരുകൾ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം നേരിട്ട് സംരക്ഷിക്കുകയും യൊരോബെയാമിന്റെ ഉത്തരവാദിത്വം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഈ വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അതിനെ പദവിനാമംകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: യൊരോബെയാം ഇസ്രായേലിനെ പാപത്തിലാക്കിയതിലെ കാരണാർഥം
  choice: പാപം ചെയ്യിച്ച
  alternative: പാപത്തിലേക്ക് നയിച്ച
  rationale: മൂലത്തിലെ ഹിഫീൽ രൂപം വ്യക്തമായ കാരണാർഥമുള്ളതാണ്; അതിനെ വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. രാജഭരണവിലയിരുത്തലിന്റെ ആവർത്തിത സൂത്രവാക്യം തിരിച്ചറിയാവുന്ന വിധത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
