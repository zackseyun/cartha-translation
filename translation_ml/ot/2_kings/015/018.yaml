id: 2KI.15.18
reference: 2 Kings 15:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֠ר מֵ/עַ֨ל חַטֹּ֜אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
translation:
  language: ml
  text: അവൻ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്തു. നെബാത്തിന്റെ മകനായ യൊരോബെയാമിന്റെ[a] പാപങ്ങളിൽനിന്ന് അവൻ തന്റെ ആയുഷ്കാലമൊക്കെയും വിട്ടുമാറിയില്ല; അവയാൽ യൊരോബെയാം ഇസ്രായേലിനെ പാപം ചെയ്യിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, എബ്രായത്തിലെ ബന്ധവാക്യം ‘പാപങ്ങൾ’ എന്നതിനുപകരം ‘യൊരോബെയാം’ എന്നതോടു ബന്ധിപ്പിച്ചു വായിക്കാം: “ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച നെബാത്തിന്റെ മകനായ യൊരോബെയാം.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: അവൻ തിന്മയായതു ചെയ്തു
  rationale: രാജാക്കന്മാരിൽ ആവർത്തിക്കുന്ന ദൈവിക ധാർമിക വിലയിരുത്തലിനെ സ്വാഭാവികവും അർത്ഥസമീപവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തൽ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ദൈവനാമം ശീർഷകമായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֹא סָר מֵעַל חַטֹּאות
  choice: പാപങ്ങളിൽനിന്ന് ... വിട്ടുമാറിയില്ല
  rationale: סור എന്ന പദത്തിലെ അകന്നുമാറുക എന്ന രൂപകവും പാപരീതി ഉപേക്ഷിക്കാതിരുന്നതെന്ന ആശയവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകനായ യൊരോബെയാം
  rationale: പേരുകളും പിതൃബന്ധവും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: അവയാൽ യൊരോബെയാം ഇസ്രായേലിനെ പാപം ചെയ്യിച്ചു
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകഭാവം വ്യക്തമാക്കുകയും ബന്ധവാക്യത്തെ അടുത്തുള്ള ‘പാപങ്ങൾ’ എന്ന പദത്തോടു ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל יָמָיו
  choice: തന്റെ ആയുഷ്കാലമൊക്കെയും
  rationale: ജീവിതകാലം മുഴുവൻ എന്ന കാലവ്യാപ്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל എന്ന ബന്ധവാക്യത്തിന്റെ പൂർവപദം
  choice: '‘പാപങ്ങൾ’ എന്നതോടു ബന്ധപ്പെടുത്തി: ‘അവയാൽ യൊരോബെയാം ഇസ്രായേലിനെ പാപം ചെയ്യിച്ചു’'
  alternative: '‘യൊരോബെയാം’ എന്നതോടു നേരിട്ട് ബന്ധപ്പെടുത്തി: ‘ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച നെബാത്തിന്റെ മകനായ യൊരോബെയാം’'
  rationale: എബ്രായത്തിൽ രണ്ടു ബന്ധങ്ങളും സാധ്യമാണ്. മുഖ്യപാഠം പാപങ്ങളെ സമീപപൂർവപദമായി സ്വീകരിക്കുന്നു; മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. രാജാക്കന്മാരിലെ ആവർത്തിത വിലയിരുത്തൽ സൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്തിയിട്ടുണ്ട്; വ്യാകരണപരമായ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
