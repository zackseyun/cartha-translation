- from: അപ്പോൾ ഗാദിയുടെ മകൻ മെനഹേം തിർസയിൽനിന്ന് പുറപ്പെട്ട് ശമര്യയിലേക്കു ചെന്നു. അവിടെവെച്ച് യാബേശിന്റെ മകൻ ശല്ലൂമിനെ വെട്ടിവീഴ്ത്തി കൊന്നു; അവനു പകരം രാജാവായി.
