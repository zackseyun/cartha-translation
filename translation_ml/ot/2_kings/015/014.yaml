id: 2KI.15.14
reference: 2 Kings 15:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעַל֩ מְנַחֵ֨ם בֶּן גָּדִ֜י מִ/תִּרְצָ֗ה וַ/יָּבֹא֙ שֹׁמְר֔וֹן וַ/יַּ֛ךְ אֶת שַׁלּ֥וּם בֶּן יָבֵ֖ישׁ בְּ/שֹׁמְר֑וֹן וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: ml
  text: അപ്പോൾ ഗാദിയുടെ മകൻ മെനഹേം തിർസയിൽനിന്ന് കയറി ശമര്യയിൽ എത്തി. ശമര്യയിൽവെച്ച് യാബേശിന്റെ മകൻ ശല്ലൂമിനെ അടിച്ചു കൊന്നു; അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: പുറപ്പെട്ട്
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കയറിച്ചെല്ലുക’ എന്നാണെങ്കിലും, ഇവിടെ സ്ഥലത്തുനിന്നുള്ള യാത്രയെ സ്വാഭാവിക മലയാളത്തിൽ ‘പുറപ്പെട്ട്’ എന്നു നൽകി; സൈനികനീക്കം എന്ന വ്യാഖ്യാനം അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: ഗാദിയുടെ മകൻ മെനഹേം
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്കു പരിചിതമായ ശബ്ദരൂപത്തിൽ ലിപ്യന്തരിച്ചു; പിതൃബന്ധം പൂർണമായി നിലനിർത്തി.
- source_word: מִתִּרְצָה
  choice: തിർസയിൽനിന്ന്
  rationale: מן ഉറവിടസ്ഥലം സൂചിപ്പിക്കുന്നതിനാൽ ‘യിൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: ശമര്യയിലേക്കു ചെന്നു
  rationale: בוא + സ്ഥലനാമം ലക്ഷ്യസ്ഥാനത്തെത്തുക എന്ന ആശയം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം സ്വീകരിച്ചു.
- source_word: וַיַּךְ אֶת
  choice: വെട്ടിവീഴ്ത്തി
  rationale: נכה ഇവിടെ രാജവധത്തിന്റെ സന്ദർഭത്തിൽ മാരകമായി പ്രഹരിക്കുക എന്നർഥം നൽകുന്നു. തുടർന്നുള്ള ‘കൊന്നു’ എന്ന ക്രിയയിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് അക്രമപ്രവൃത്തി പ്രകടമാക്കുന്നു.
- source_word: שַׁלּוּם בֶּן יָבֵישׁ
  choice: യാബേശിന്റെ മകൻ ശല്ലൂം
  rationale: വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരിച്ചു; പിതൃബന്ധം നിലനിർത്തി.
- source_word: בְּשֹׁמְרוֹן
  choice: അവിടെവെച്ച്
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ച സ്ഥലസൂചനയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കാൻ മുൻപറഞ്ഞ ശമര്യയെ സൂചിപ്പിക്കുന്ന സർവനാമപ്രയോഗം സ്വീകരിച്ചു.
- source_word: וַיְמִיתֵהוּ
  choice: കൊന്നു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം മരണത്തിന് ഇടയാക്കുക എന്നർഥമുള്ളതാണ്; സന്ദർഭത്തിൽ ‘കൊന്നു’ എന്നത് കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: അവനു പകരം രാജാവായി
  rationale: מלך രാജാവായി ഭരിക്കുക എന്നും תחתיו സ്ഥാനമേറ്റെടുക്കൽ എന്നും സൂചിപ്പിക്കുന്നു; അധികാരപിന്തുടർച്ച വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
