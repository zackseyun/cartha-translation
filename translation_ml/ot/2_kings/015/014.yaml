translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ വാവ്-ക്രമം മലയാളത്തിലെ വാക്യബന്ധവും അർധവിരാമവും ഉപയോഗിച്ച് സ്വാഭാവികമാക്കി. പേരുകളുടെ രൂപങ്ങൾ: മെനഹേം, ഗാദി, തിർസ, ശമര്യ, യാബേശ്, ശല്ലൂം.'
