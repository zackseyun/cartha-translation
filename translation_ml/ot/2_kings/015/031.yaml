translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ചരിത്രവിവരണശൈലി. ‘അതാ’ എന്ന പദം മൂലത്തിലെ അവതരണഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് അതു വിശദീകരിക്കുന്ന ‘ദിനവൃത്താന്തപുസ്തകം’ എന്ന പദത്തിന് പിന്നാലെ വെച്ചിരിക്കുന്നു.
