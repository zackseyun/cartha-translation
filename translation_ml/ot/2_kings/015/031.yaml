source:
  edition: WLC
  text: וְ/יֶ֥תֶר דִּבְרֵי פֶ֖קַח וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/031.yaml
  text: The rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ml
  text: പെക്കഹിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്തതൊക്കെയും—ഇതാ, അവ ഇസ്രായേൽ രാജാക്കന്മാരുടെ ദിനവൃത്താന്തങ്ങളുടെ പുസ്തകത്തിൽ[a] എഴുതിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേൽ രാജാക്കന്മാരുടെ വാർഷികരേഖയിൽ.’
    reason: דִּבְרֵי הַיָּמִים എന്ന രാജകീയ രേഖാപദത്തിന് ‘ദിനവൃത്താന്തങ്ങൾ’ എന്നും ‘വാർഷികരേഖ’ എന്നും അർഥസാധ്യതയുണ്ട്.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי פֶקַח
  choice: പെക്കഹിന്റെ ശേഷിച്ച പ്രവൃത്തികളും
  rationale: יֶתֶר എന്നത് ‘ശേഷിച്ചവ’ എന്നും, രാജാവിനെക്കുറിച്ചുള്ള ഈ പതിവു ചരിത്രസംഗ്രഹപ്രയോഗത്തിൽ דִּבְרֵי എന്നത് അവന്റെ ‘പ്രവൃത്തികൾ/കാര്യങ്ങൾ’ എന്നും സ്വാഭാവികമായി അർഥമാക്കുന്നു. തുടക്കത്തിലെ וְ സംയോജകഭാവം ‘-ഉം’ മുഖേന നിലനിർത്തുന്നു; ഹീബ്രുവിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: כָל എന്നതിന്റെ സമഗ്രതയും עָשָׂה എന്ന ലളിതക്രിയയുടെ അർഥവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: הִנָּם
  choice: അതാ, അവ
  rationale: പ്രത്യയത്തോടുകൂടിയ הִנֵּה ദൃഷ്ടിക്ഷണിക്കുന്ന അവതരണപ്രയോഗമാണ്. ‘അതാ’ അതിന്റെ ഊന്നലും ഔപചാരിക ചരിത്രശൈലിയും നിലനിർത്തുന്നു; ബഹുവചനസൂചന ‘അവ’യിൽ വ്യക്തമാകുന്നു.
- source_word: כְּתוּבִים
  choice: എഴുതിയിരിക്കുന്നു
  rationale: ‘എഴുതപ്പെട്ടിരിക്കുന്നു’ എന്ന കൂടുതൽ ഭാരമുള്ള രൂപത്തിനുപകരം, രേഖയിൽ എഴുതിയിട്ടുണ്ടെന്ന സ്ഥിതിവാചക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: ദിനവൃത്താന്തപുസ്തകത്തിൽ
  rationale: עַל סֵפֶר ഇവിടെ ഒരു രേഖയ്ക്കുള്ളിലെ എഴുത്തിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുസ്തകത്തിൽ’ എന്നാണ്. דִּבְרֵי הַיָּמִים രാജകീയ വാർഷികരേഖകളെ സൂചിപ്പിക്കുന്ന പതിവുപദമായതിനാൽ ‘ദിനവൃത്താന്തം’ എന്ന് നൽകിയിരിക്കുന്നു.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ
  rationale: לְ ഇവിടെ ആ രാജാക്കന്മാരെ സംബന്ധിക്കുന്ന രേഖയുടെ ശീർഷകബന്ധം സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ ഉടമസ്ഥ/ബന്ധസൂചകമായ ‘-യുടെ’ യോജിക്കുന്നു.
