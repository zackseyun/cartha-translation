id: 2KI.24.19
reference: 2 Kings 24:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה יְהוֹיָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/019.yaml
  text: He did what was evil in the eyes of Yahweh, according to all that Jehoiakim had done.
translation:
  language: ml
  text: യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് അവൻ ചെയ്തു; യെഹോയാക്കീം ചെയ്തതെല്ലാംപോലെതന്നെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ചെയ്തു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ ക്രിയ ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തി അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യാരംഭത്തിൽ ‘അങ്ങനെ/പിന്നെ’ ചേർക്കാതെ തന്നെ സന്ദർഭബന്ധം സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: הָרַע
  choice: തിന്മയായത്
  rationale: עשה הרע എന്ന പതിവുശൈലി ‘തിന്മയായത് ചെയ്യുക’ എന്നർഥം നൽകുന്നു; ‘തിന്മയെ ചെയ്തു’ എന്ന അക്ഷരാർഥപ്രയോഗത്തേക്കാൾ ഇത് സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: ‘കണ്ണുകളിൽ’ എന്ന ഹീബ്രു രൂപകം ഒരാളുടെ വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്നു. ‘ദൃഷ്ടിയിൽ’ ആ രൂപകത്തിന്റെ ആശയം dignified, സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: כְּכֹל אֲשֶׁר
  choice: ചെയ്തതെല്ലാംപോലെതന്നെ
  rationale: כֹּל എന്നതിന്റെ സമഗ്രതയും כְּ എന്നതിന്റെ താരതമ്യബലവും ‘എല്ലാംപോലെതന്നെ’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: עָשָׂה
  choice: ചെയ്ത
  rationale: യെഹോയാക്കീമിന്റെ മുൻകാല പ്രവൃത്തിയെ മലയാളത്തിലെ ഭൂതകാല കൃതന്തം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; പ്രത്യേക പൂർവഭൂതകാലരൂപം ആവശ്യമില്ല.
- source_word: יְהוֹיָקִים
  choice: യെഹോയാക്കീം
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ വ്യക്തമായി പകർന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ച് ദൈവനാമത്തിന്റെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രു വാക്യത്തിന്റെ നൈതിക വിലയിരുത്തലും യെഹോയാക്കീമിനോടുള്ള പൂർണമായ താരതമ്യവും സംക്ഷിപ്തമായി നിലനിർത്തിയിരിക്കുന്നു.
