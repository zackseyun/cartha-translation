source:
  edition: WLC
  text: וַ/יְשַׁלַּ֣ח יְהוָ֣ה בּ֡/וֹ אֶת גְּדוּדֵ֣י כַשְׂדִּים֩ וְ/אֶת גְּדוּדֵ֨י אֲרָ֜ם וְ/אֵ֣ת גְּדוּדֵ֣י מוֹאָ֗ב וְ/אֵת֙ גְּדוּדֵ֣י בְנֵֽי עַמּ֔וֹן וַ/יְשַׁלְּחֵ֥/ם בִּֽ/יהוּדָ֖ה לְ/הַֽאֲבִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/002.yaml
  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
translation:
  language: ml
  text: യഹോവ യെഹോയാക്കീമിനെതിരെ കൽദയരുടെ സംഘങ്ങളെയും[a] അരാമ്യരുടെ സംഘങ്ങളെയും മോവാബ്യരുടെ സംഘങ്ങളെയും അമ്മോന്യരുടെ സംഘങ്ങളെയും അയച്ചു. യെഹൂദയെ നശിപ്പിക്കാനായി അവൻ അവരെ യെഹൂദയിലേക്കു അയച്ചു. തന്റെ ദാസന്മാരായ പ്രവാചകന്മാർ മുഖാന്തരം അവൻ അരുളിച്ചെയ്ത യഹോവയുടെ വചനപ്രകാരമായിരുന്നു ഇത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആക്രമണസംഘങ്ങൾ’ അല്ലെങ്കിൽ ‘കൊള്ളസംഘങ്ങൾ.’
    reason: גְּדוּדִים എന്ന പദം ചെറു സൈനികസംഘങ്ങളെയും, ഈ സന്ദർഭത്തിൽ ആക്രമണത്തിനോ കൊള്ളയ്ക്കോ പുറപ്പെടുന്ന സംഘങ്ങളെയും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: അയച്ചു
  rationale: ആഖ്യാനഗദ്യത്തിൽ שלח എന്ന ക്രിയയുടെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തിന്റെ മലയാളത്തിൽ സുപരിചിതവും ഉറവിടരൂപത്തെ സൂചിപ്പിക്കുന്നതുമായ ലിപ്യന്തരണം.
- source_word: בּוֹ
  choice: യെഹോയാക്കീമിനെതിരെ
  rationale: ശത്രുതാപരമായ ഈ സന്ദർഭത്തിൽ בְּ പ്രവർത്തനം അയാൾക്കെതിരെ തിരിയുന്നതിനെ സൂചിപ്പിക്കുന്നു; മുൻവാക്യത്തിലെ വ്യക്തിയെ വ്യക്തതയ്ക്കായി പേരെടുത്തുപറയുന്നു.
- source_word: גְּדוּדֵי
  choice: കൊള്ളസംഘങ്ങൾ / സംഘങ്ങൾ
  rationale: പൂർണ സൈന്യങ്ങളെക്കാൾ ആക്രമണത്തിനും കൊള്ളയ്ക്കുമായി നീങ്ങുന്ന ചെറുസൈനിക കൂട്ടങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ആദ്യപ്രയോഗത്തിൽ അർത്ഥം വ്യക്തമാക്കി, ആവർത്തനങ്ങളിൽ സ്വാഭാവികതയ്ക്കായി ‘സംഘങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: כַשְׂדִּים
  choice: കൽദയർ
  rationale: ‘ബാബിലോന്യർ’ എന്ന ചരിത്രപരമായ സമാനീകരണത്തിനു പകരം എബ്രായ ജനനാമം നിലനിർത്തുന്നു.
- source_word: אֲרָם
  choice: അരാമ്യർ
  rationale: ‘സിറിയക്കാർ’ എന്ന പരമ്പരാഗത പകരത്തിനുപകരം ഉറവിടത്തിലെ അരാം എന്ന ജനനാമം നിലനിർത്തുന്നു.
- source_word: מְוֹאָב
  choice: മോവാബ്യർ
  rationale: മോവാബ് ജനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ജനനാമം.
- source_word: בְנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: അക്ഷരാർഥമായ ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്നതിനു പകരം ആ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപം.
- source_word: וַיְשַׁלְּחֵם
  choice: അവിടന്ന് അവരെ ... അയച്ചു
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ച ക്രിയ ഊന്നലും ആഖ്യാനപുരോഗതിയും നൽകുന്നതിനാൽ പരിഭാഷയിലും നിലനിർത്തി.
- source_word: בִּיהוּדָה
  choice: അതിനെതിരെ
  rationale: യെഹൂദയാണ് ശത്രുതാപരമായ സൈനികനടപടിയുടെ ലക്ഷ്യം; മലയാളത്തിൽ ‘യെഹൂദയെ ... അതിനെതിരെ’ എന്നത് ആ ദിശ വ്യക്തമാക്കുന്നു.
- source_word: לְהַאֲבִידוֹ
  choice: യെഹൂദയെ നശിപ്പിക്കാനായി
  rationale: പ്രത്യയത്തിന്റെ സൂചിതവസ്തു വ്യാകരണപരമായി യെഹോയാക്കീമോ യെഹൂദയോ ആകാം. അടുത്ത് പരാമർശിക്കപ്പെടുന്ന യെഹൂദയെയും വിശാലസന്ദർഭത്തിലെ ദേശവിധിയെയും അടിസ്ഥാനമാക്കി മുഖ്യവാചകത്തിൽ യെഹൂദയെ സ്വീകരിച്ചു; മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: כִּדְבַר יְהוָה
  choice: യഹോവ ... അരുളിച്ചെയ്ത വചനപ്രകാരം
  rationale: പ്രവാചകവചനവും അതിന്റെ നിവൃത്തിയും തമ്മിലുള്ള ബന്ധം ഔപചാരികവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: തന്റെ ദാസന്മാരായ പ്രവാചകന്മാർ മുഖാന്തരം
  rationale: ‘കൈയാൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഉപകരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘മുഖാന്തരം’ എന്നു നൽകി.
theological_decisions:
- issue: לְהַאֲבִידוֹ എന്നതിലെ ഏകവചന പുൽലിംഗ പ്രത്യയത്തിന്റെ സൂചിതവസ്തു
  choice: യെഹൂദയെ നശിപ്പിക്കുക
  alternative: യെഹോയാക്കീമിനെ നശിപ്പിക്കുക
  rationale: ഉടൻ മുമ്പുള്ള യെഹൂദയും തുടർന്നുള്ള സന്ദർഭത്തിലെ യെഹൂദയ്ക്കെതിരായ വിധിയും ആദ്യവായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും വ്യാകരണപരമായി യെഹോയാക്കീമിനെ സൂചിപ്പിക്കാനും കഴിയുന്നതിനാൽ ആ യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ആവർത്തിച്ച ‘അയച്ചു’ എന്ന ക്രിയ ഉറവിടത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. ജനനാമങ്ങൾ കൽദയർ, അരാമ്യർ, മോവാബ്യർ, അമ്മോന്യർ എന്നിങ്ങനെ ഉറവിടത്തോട് ചേർന്ന രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
