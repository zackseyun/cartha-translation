source:
  edition: WLC
  text: וַ/יָּבֹ֛א נְבוּכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַל הָ/עִ֑יר וַ/עֲבָדָ֖י/ו צָרִ֥ים עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/011.yaml
  text: And Nebuchadnezzar king of Babylon came against the city while his servants were besieging it[a][b].
translation:
  language: ml
  text: ബാബേൽരാജാവായ നെബൂഖദ്‌നേസർ നഗരത്തിനെതിരെ വന്നു; അവന്റെ ഭൃത്യന്മാർ അതിനെ ഉപരോധിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവന്റെ ഭൃത്യന്മാർ അതിനെ വളഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ഭൃത്യന്മാർ’ എന്നത് രാജാവിന്റെ ഉദ്യോഗസ്ഥരെയോ പ്രതിനിധികളെയോ രാജസേവനത്തിലുള്ള സൈനികരെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം ‘വന്നു’ എന്നാണ്; עַל הָעִיר എന്ന പ്രയോഗവും ഉപരോധസന്ദർഭവും ചേർന്ന് ശത്രുതാപരമായ വരവ് വ്യക്തമാക്കുന്നു.
- source_word: נְבוּכַדְנֶאצַּר
  choice: നെബൂഖദ്‌നേസർ
  rationale: ബാബേൽരാജാവിന്റെ പേരിന് മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവായ
  rationale: രാജപദവിയും രാജ്യവും സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന സ്വാഭാവികമായ മലയാള വിശേഷണഘടനയിൽ നൽകി.
- source_word: עַל הָעִיר
  choice: നഗരത്തിനെതിരെ
  rationale: സൈനികവും ഉപരോധപരവുമായ സന്ദർഭത്തിൽ עַל നിഷ്പക്ഷമായ ‘നഗരത്തിലേക്ക്’ എന്നതിലുപരി ‘നഗരത്തിനെതിരെ’ എന്ന ശത്രുതാപരമായ അർഥം നൽകുന്നു.
- source_word: וַעֲבָדָיו
  choice: അവന്റെ ഭൃത്യന്മാർ
  rationale: עבדים എന്നതിന്റെ രാജസേവനസന്ദർഭത്തിലുള്ള വിശാലത നിലനിർത്തുന്നു; ഇത് ഉദ്യോഗസ്ഥരെയോ പ്രതിനിധികളെയോ സൈനികരെയോ സൂചിപ്പിക്കാം.
- source_word: צָרִים
  choice: ഉപരോധിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: צור എന്ന ക്രിയയുടെ പങ്കാളിത്തരൂപം നടന്നുകൊണ്ടിരുന്ന ഉപരോധപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; നെബൂഖദ്‌നേസറിന്റെ വരവിനോടുള്ള സമകാലികതയും ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: עָלֶיהָ
  choice: അതിനെ
  rationale: സ്ത്രീലിംഗമായ ‘നഗരം’ എന്ന മുൻപദത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; ‘ഉപരോധിക്കുക’ എന്ന മലയാള ക്രിയയോടൊപ്പം നേരിട്ടുള്ള കർമരൂപം സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഭൃത്യന്മാർ’ എന്ന പദം മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; സാധ്യതയുള്ള രാജകീയ-സൈനിക അർഥങ്ങൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
