base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ യെഹോയാഖീനും അവന്റെ അമ്മയും ഭൃത്യന്മാരും അധികാരികളും കൊട്ടാര ഉദ്യോഗസ്ഥന്മാരും[a] ബാബേൽ രാജാവിന്റെ അടുക്കലേക്കു പുറത്തുചെന്നു; ബാബേൽ രാജാവ് തന്റെ വാഴ്ചയുടെ എട്ടാം വർഷത്തിൽ യെഹോയാഖീനെ പിടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഷണ്ഡന്മാരും.” എബ്രായപദം അക്ഷരാർഥത്തിൽ ഷണ്ഡന്മാരെയോ പൊതുവായി രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥന്മാരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא ... עַל מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവിന്റെ അടുക്കലേക്കു പുറത്തുചെന്നു
  rationale: יצא എന്ന ക്രിയയുടെ ‘പുറത്തുചെല്ലുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ഉപരോധസന്ദർഭത്തിൽ കീഴടങ്ങിയെന്ന ആശയം സൂചിപ്പിക്കാമെങ്കിലും അത് നേരിട്ട് വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല. על ഇവിടെ രാജാവിന്റെ അടുക്കലേക്കുള്ള നീക്കമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הוּא וְאִמּוֹ וַעֲבָדָיו וְשָׂרָיו וְסָרִיסָיו
  choice: അവന്റെ അമ്മയും ഭൃത്യന്മാരും പ്രഭുക്കന്മാരും കൊട്ടാര ഉദ്യോഗസ്ഥന്മാരും അവനോടൊപ്പമുണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ അനുഗമിച്ച സംഘത്തെ സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു. עֲבָדָיו എന്നതിന് ‘ഭൃത്യന്മാർ’, שָׂרָיו എന്നതിന് ഉന്നതസ്ഥാനക്കാരെ സൂചിപ്പിക്കുന്ന ‘പ്രഭുക്കന്മാർ’ എന്നു നൽകി.
- source_word: סָרִיסָיו
  choice: കൊട്ടാര ഉദ്യോഗസ്ഥന്മാർ
  rationale: סָרִיס് എന്ന പദത്തിന് ഷണ്ഡന്മാർ എന്നും രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥന്മാർ എന്നും അർഥമാകാം. സന്ദർഭത്തിൽ വ്യാപകമായ ഔദ്യോഗിക അർഥം മുഖ്യപാഠത്തിൽ നൽകി, കൂടുതൽ നിർദ്ദിഷ്ടമായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיִּקַּח אֹתוֹ
  choice: യെഹോയാഖീനെ പിടിച്ചു
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ ആണെങ്കിലും ഇവിടെ രാജാവിനെ ബാബേൽരാജാവ് തന്റെ അധീനതയിലാക്കിയ സംഭവമാണ്. ‘പിടിച്ചു’ എന്നത് ‘പിടികൂടി’ എന്നതിനെക്കാൾ കുറച്ച് വ്യാഖ്യാനാത്മകവും മലയാളത്തിൽ വ്യക്തവുമാണ്.
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  choice: തന്റെ ഭരണത്തിന്റെ എട്ടാം വർഷത്തിൽ
  rationale: സമീപസ്ഥനായ കർത്താവായ ബാബേൽരാജാവിനെയാണ് ഏകവചന പ്രത്യയം സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭവും രാജവത്സരക്രമവും പിന്തുണയ്ക്കുന്നു. ‘ഭരണം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ‘അവന്റെ ഭരണത്തിന്റെ’ എന്ന കാലസൂചനയിലെ സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ബാബേൽരാജാവിന്റെ ഭരണം
  alternative: യെഹോയാഖീന്റെ ഭരണം
  rationale: തൊട്ടുമുമ്പുള്ള ഏകവചന കർത്താവ് ബാബേൽരാജാവാണ്; അധ്യായത്തിലെ ചരിത്രകാലക്രമവും നെബൂഖദ്‌നേസറിന്റെ എട്ടാം ഭരണവർഷത്തെയാണ് പിന്തുണയ്ക്കുന്നത്. ‘തന്റെ’ എന്ന പ്രയോഗം ഈ ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- issue: യെഹോയാഖീന്റെ പുറത്തുചെല്ലലിന്റെ സ്വഭാവം
  choice: പുറത്തുചെന്നു
  alternative: കീഴടങ്ങി
  rationale: ഉപരോധസന്ദർഭത്തിൽ ഈ പ്രവൃത്തി കീഴടങ്ങലായിരിക്കാമെങ്കിലും എബ്രായക്രിയ അത് നേരിട്ട് നിർവചിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമോ ചരിത്രപരമോ ആയ അധിക നിഗമനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘പുറത്തുചെന്നു’ എന്നത് മൂലപാഠത്തിന്റെ സംയമനം നിലനിർത്തുന്നു; അനുഗമിച്ചവരുടെ പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമാകാൻ വേറൊരു ഉപവാക്യമായി ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി യഥാർഥത്തിൽ ബന്ധപ്പെട്ട ‘കൊട്ടാര ഉദ്യോഗസ്ഥന്മാർ’ എന്ന പദത്തിനുശേഷമാണ് നൽകിയിരിക്കുന്നത്.
