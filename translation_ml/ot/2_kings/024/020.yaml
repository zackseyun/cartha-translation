  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָיְתָ֤ה בִ/ירוּשָׁלִַ֨ם֙ וּ/בִ֣/יהוּדָ֔ה עַד הִשְׁלִכ֥/וֹ אֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
translation:
  language: ml
  text: യഹ്‌വേയുടെ കോപം നിമിത്തം, അവൻ അവരെ തന്റെ സന്നിധിയിൽനിന്ന് തള്ളിക്കളയുന്നതുവരെ യെരൂശലേമിലും യെഹൂദയിലും ഇങ്ങനെ സംഭവിച്ചു.[a] സിദെക്കീയാവ് ബാബേൽ രാജാവിനെതിരെ മത്സരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യഹ്‌വേയുടെ കോപം യെരൂശലേമിനും യെഹൂദയ്ക്കും എതിരായിരുന്നു; അവൻ അവരെ തന്റെ മുമ്പിൽനിന്ന് തള്ളിക്കളയുന്നതുവരെ അത് തുടർന്നു.” ആദ്യ ഉപവാക്യത്തിലെ എബ്രായ വാക്യഘടന സങ്കുചിതമാണ്; കൂടുതൽ പദാനുപദമായ ഈ പരിഭാഷയും സാധ്യമാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: നിമിത്തം
  rationale: മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധവും കാരണാർഥവും മലയാളവാക്യഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; പ്രത്യേകം ‘എന്തെന്നാൽ’ ചേർത്താൽ വാക്യം ഭാരമുള്ളതാകും.
- source_word: עַל אַף יְהוָה
  choice: യഹ്‌വേയുടെ കോപം നിമിത്തം
  rationale: עַל אַף എന്ന പ്രയോഗത്തിന്റെ ദൈവിക കോപമെന്ന അർഥം നിലനിർത്തുകയും יהוה എന്ന ഉടമ്പടിനാമം ‘യഹ്‌വേ’യായി നേരിട്ട് നൽകുകയും ചെയ്യുന്നു.
- source_word: הָיְתָה
  choice: ഇങ്ങനെ സംഭവിച്ചു
  rationale: പ്രകടമായ കർത്താവില്ലാത്ത സ്ത്രീലിംഗ ഏകവചനക്രിയയെ അവ്യക്തമായ ‘ആയിരുന്നു’ എന്നതിനു പകരം സന്ദർഭത്തിലെ സ്ഥിതിവിശേഷത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בִירוּשָׁלִַם וּבִיהוּדָה
  choice: യെരൂശലേമിലും യെഹൂദയിലും
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ പ്രാഥമിക സ്ഥാനാർഥം സംരക്ഷിക്കുന്നു.
- source_word: עַד הִשְׁלִכוֹ אֹתָם
  choice: ഒടുവിൽ അവൻ അവരെ ... തള്ളിക്കളഞ്ഞു
  rationale: עַד സൂചിപ്പിക്കുന്ന അന്തിമപരിധിയും הִשְׁלִיךְ എന്ന ക്രിയയുടെ ശക്തമായ പുറത്താക്കൽഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: מֵעַל פָּנָיו
  choice: തന്റെ സന്നിധിയിൽനിന്ന്
  rationale: ‘തന്റെ മുഖത്തിനുമുമ്പിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּמְרֹד
  choice: മത്സരിച്ചു
  rationale: മർദ്ദ് എന്ന ക്രിയയുടെ രാഷ്ട്രീയ കലാപം/ധിക്കാരം എന്ന അർഥം മലയാളത്തിലെ പതിവായ ബൈബിൾ-ചരിത്രപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവിനെതിരെ
  rationale: מרד-നോടൊപ്പമുള്ള ב ഇവിടെ എതിർപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: צִדְקִיָּהוּ
  choice: സിദെക്കീയാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ നാമരൂപം.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ കാരണവും ഫലവും തമ്മിലുള്ള ബന്ധം
  choice: യഹ്‌വേയുടെ കോപം മൂലം യെരൂശലേമിലും യെഹൂദയിലും ഈ സ്ഥിതി സംഭവിച്ച് ഒടുവിൽ പുറത്താക്കലിൽ കലാശിച്ചു
  alternative: യഹ്‌വേയുടെ കോപം യെരൂശലേമിനും യെഹൂദയ്ക്കും എതിരായിരുന്നു; അവൻ അവരെ തള്ളിക്കളയുന്നതുവരെ അത് തുടർന്നു
  rationale: എബ്രായവാക്യം സങ്കുചിതവും വ്യാകരണപരമായി ദ്വയാർഥസാധ്യതയുള്ളതുമാണ്. മുഖ്യപാഠം സ്ഥാനാർഥം സൂക്ഷിക്കുന്നു; എതിർദിശയിലുള്ള കൂടുതൽ ഔപചാരിക വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ പൊതുവെ അംഗീകരിക്കപ്പെട്ട ശബ്ദരൂപത്തിൽ നേരിട്ട് നൽകുന്നു; പദവിനാമമായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സന്നിധി’, ‘കോപം’, ‘മത്സരിച്ചു’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ചരിത്ര-ദൈവശാസ്ത്ര ഗൗരവം നിലനിർത്തുന്നതുമാണ്.
