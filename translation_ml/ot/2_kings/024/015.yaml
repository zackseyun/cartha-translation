  language: ml
  text: അവൻ യെഹോയാഖീനെ ബാബേലിലേക്കു നാടുകടത്തി. രാജാവിന്റെ അമ്മയെയും[c] രാജാവിന്റെ ഭാര്യമാരെയും അവന്റെ കൊട്ടാര ഉദ്യോഗസ്ഥരെയും[a] ദേശത്തെ പ്രമുഖരെയും[b] അവൻ യെരൂശലേമിൽനിന്ന് ബാബേലിലേക്കു പ്രവാസികളായി കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
