translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ രണ്ടു സംഖ്യാകൂട്ടങ്ങളും അവയെ സംഗ്രഹിക്കുന്ന സൈനികയോഗ്യതാ പ്രസ്താവനയും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനവൈകല്യം ഉറവിടപദങ്ങളനുസരിച്ച് തിരുത്തി.
