source:
  edition: WLC
  text: וְ/אֵת֩ כָּל אַנְשֵׁ֨י הַ/חַ֜יִל שִׁבְעַ֣ת אֲלָפִ֗ים וְ/הֶ/חָרָ֤שׁ וְ/הַ/מַּסְגֵּר֙ אֶ֔לֶף הַ/כֹּ֕ל גִּבּוֹרִ֖ים עֹשֵׂ֣י מִלְחָמָ֑ה וַ/יְבִיאֵ֧/ם מֶֽלֶךְ בָּבֶ֛ל גּוֹלָ֖ה בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/016.yaml
  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
translation:
  language: ml
  text: പരാക്രമശാലികളായ എല്ലാ പുരുഷന്മാരിലും ഏഴായിരം പേരെയും, ശില്പികളും ലോഹപ്പണിക്കാരും ഉൾപ്പെട്ട ആയിരം പേരെയും—അവരെല്ലാവരും യുദ്ധം ചെയ്യാൻ പ്രാപ്തരായ വീരന്മാർ—ബാബേൽ രാജാവ് പ്രവാസികളായി ബാബേലിലേക്കു കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  choice: പരാക്രമശാലികളായ പുരുഷന്മാർ
  rationale: ഈ പ്രയോഗം ശക്തിയും സൈനികശേഷിയുമുള്ള പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു. ‘പരാക്രമശാലികൾ’ എന്നത് അതിന്റെ ആശയബലം നിലനിർത്തുന്നു; ‘പുരുഷന്മാർ’ എബ്രായത്തിലെ ലിംഗസൂചന വ്യക്തമാക്കുന്നു.
- source_word: שִׁבְעַת אֲלָפִים
  choice: ഏഴായിരം പേർ
  rationale: എണ്ണത്തെ സ്വാഭാവികമായ മലയാള പ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הֶחָרָשׁ
  choice: ശില്പികൾ
  rationale: മരം, കല്ല്, ലോഹം തുടങ്ങിയ വസ്തുക്കളിൽ വൈദഗ്ധ്യത്തോടെ പണിയുന്നവരെ സൂചിപ്പിക്കാവുന്ന വിശാലമായ പദമാണിത്; ഒരു പ്രത്യേക തൊഴിൽ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: הַמַּסְגֵּר
  choice: ലോഹപ്പണിക്കാർ
  rationale: പദം കൊല്ലന്മാരെയോ പൊതുവായി ലോഹപ്പണി ചെയ്യുന്നവരെയോ സൂചിപ്പിക്കാം. ‘ലോഹപ്പണിക്കാർ’ അർഥപരിധി അനാവശ്യമായി ചുരുക്കാതെ ആ സാധ്യത നിലനിർത്തുന്നു.
- source_word: אֶלֶף
  choice: ആയിരം പേർ
  rationale: ശില്പികളും ലോഹപ്പണിക്കാരും ഉൾപ്പെട്ട കൂട്ടത്തിന്റെ സംഖ്യ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּל
  choice: അവരെല്ലാവരും
  rationale: മുൻപു പറഞ്ഞ നാടുകടത്തപ്പെട്ട കൂട്ടങ്ങളെ സംഗ്രഹിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: גִּבּוֹרִים
  choice: വീരന്മാർ
  rationale: ശക്തരും സൈനികപ്രാപ്തിയുള്ളവരുമായ പുരുഷന്മാർ എന്ന യുദ്ധസംബന്ധമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֹשֵׂי מִלְחָמָה
  choice: യുദ്ധം ചെയ്യാൻ പ്രാപ്തരായ
  rationale: അക്ഷരാർഥത്തിൽ ‘യുദ്ധം ചെയ്യുന്നവർ’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ സൈനികസേവനത്തിന് കഴിവുള്ളവർ എന്ന ആശയമാണ്; മലയാളത്തിൽ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיְבִיאֵם
  choice: കൊണ്ടുപോയി
  rationale: പ്രവാസത്തിലാക്കി ബാബേലിലേക്കു മാറ്റിയ സന്ദർഭത്തിൽ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നിർബന്ധിത നീക്കം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: גּוֹלָה
  choice: പ്രവാസികളായി
  rationale: അവർ ബാബേലിലേക്കു കൊണ്ടുപോകപ്പെട്ട അവസ്ഥയും ഫലവും സൂചിപ്പിക്കുന്നു.
- source_word: בָּבֶלָה
  choice: ബാബേലിലേക്കു
  rationale: ദിശാസൂചകമായ എബ്രായരൂപം ബാബേലിലേക്കുള്ള നീക്കത്തെ വ്യക്തമാക്കുന്നു.
