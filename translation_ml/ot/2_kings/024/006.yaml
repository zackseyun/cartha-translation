  yaml_path: translation/ot/2_kings/024/006.yaml
  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
translation:
  language: ml
  text: യെഹോയാക്കീം തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു[a]. അവന്റെ മകനായ യെഹോയാഖീൻ അവന്റെ സ്ഥാനത്ത് രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, വ്യാഖ്യാനപരമായി: ‘മരിച്ചു.’ ‘തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു’ എന്നത് ഒരു രാജാവിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: ‘തന്റെ പിതാക്കന്മാരോടൊപ്പം’ എന്ന പ്രയോഗത്തോടു ചേർന്നുള്ള ശׁכב രാജാവിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ ശൈലിയാണ്. ‘നിദ്രപ്രാപിച്ചു’ മൂലത്തിലെ രൂപകം നിലനിർത്തുകയും മലയാളത്തിൽ ഗൗരവമുള്ള മരണപ്രയോഗമായി സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടൊപ്പം
  rationale: മൂലത്തിലെ സ്ഥിരപ്രയോഗത്തെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു. ഇവിടെ ‘പിതാക്കന്മാർ’ എന്നത് മുൻഗാമികളെയും സൂചിപ്പിക്കാം; എന്നാൽ മുഖ്യപാഠത്തിൽ പദരൂപം നിലനിർത്തുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: ഇവിടെ ക്രിയ ഭരണകാലത്തിന്റെ ദൈർഘ്യത്തേക്കാൾ സിംഹാസനാരോഹണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘രാജാവായി’ ആ സ്ഥാനലാഭം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകനായ
  rationale: പുത്രബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: രാജകീയ പിന്തുടർച്ചയുടെ സന്ദർഭത്തിൽ മുൻരാജാവിന്റെ സ്ഥാനത്ത് വന്നതിനെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוֹיָקִים / יְהוֹיָכִין
  choice: യഹോയാക്കീം / യഹോയാഖീൻ
  rationale: എബ്രായ വ്യക്തിനാമങ്ങളുടെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണം.
theological_decisions:
- issue: രാജാവിന്റെ മരണത്തെക്കുറിച്ചുള്ള പതിവ് പ്രയോഗം സംസ്കാരവിവരമായി അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതിരിക്കുക
  choice: ‘തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘മരിച്ചു’ എന്നു വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക; അല്ലെങ്കിൽ മൂലത്തിൽ ഇല്ലാത്ത ‘പിതാക്കന്മാരോടൊപ്പം അടക്കം ചെയ്യപ്പെട്ടു’ എന്നു ചേർക്കുക.
  rationale: എബ്രായ പാഠം രാജാവിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ശൈലി ഉപയോഗിക്കുന്നുവെങ്കിലും സംസ്കാരത്തെ ഈ വാക്യത്തിൽ പ്രത്യേകം പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ രൂപകം നിലനിർത്തുന്നത് മൂലപാഠത്തോടുള്ള വിശ്വസ്തതയും ചരിത്രവിവരത്തിൽ ആവശ്യമായ സംയമനവും പാലിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
