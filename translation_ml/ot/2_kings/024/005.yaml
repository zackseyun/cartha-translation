reference: 2 Kings 24:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְהוֹיָקִ֖ים וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/005.yaml
  text: The rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: യെഹോയാക്കീമിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്തതൊക്കെയും യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[a] എഴുതപ്പെട്ടിട്ടില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദാരാജാക്കന്മാരുടെ രാജവൃത്താന്തങ്ങളിൽ.’ എബ്രായ ശീർഷകം രാജാക്കന്മാരുടെ പുസ്തകത്തിൽ പലവട്ടം ഉദ്ധരിക്കപ്പെടുന്ന ഒരു രാജകീയ രേഖാസ്രോതസ്സിനെയാണ് സൂചിപ്പിക്കുന്നത്; അത് കാനോനിക ദിനവൃത്താന്തപുസ്തകം തന്നെയാകണമെന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ יֶתֶר എന്നത് ശേഷിക്കുന്ന കാര്യങ്ങളെയും דִּבְרֵי എന്നത് രാജാവിന്റെ രേഖപ്പെടുത്തിയ പ്രവൃത്തികളെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוֹיָקִים
  choice: യെഹോയാക്കീം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ ലിപ്യന്തരണം.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: അവന്റെ പ്രവർത്തനങ്ങളുടെ വിശാലമായ പരിധി വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: הֲלֹא ... כְּתוּבִים
  choice: എഴുതപ്പെട്ടിട്ടില്ലയോ?
  rationale: എബ്രായത്തിലെ പതിവായ അലങ്കാരപ്രശ്നത്തിന്റെ ചോദ്യംചെയ്യുന്ന സ്വഭാവവും നിഷേധരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘പുസ്തകത്തിന്മേൽ’ എന്നാണെങ്കിലും, ഒരു രേഖയിൽ ഉള്ളടക്കം എഴുതിയിരിക്കുന്നു എന്ന അർഥത്തിന് മലയാളത്തിൽ ‘പുസ്തകത്തിൽ’ സ്വാഭാവികമാണ്.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം
  rationale: രാജാക്കന്മാരെ സംബന്ധിച്ച ഔദ്യോഗിക കാലാനുക്രമരേഖയുടെ ശീർഷകസ്വഭാവം നിലനിർത്തുന്നു; കാനോനിക ദിനവൃത്താന്തപുസ്തകവുമായി നിർബന്ധമായി തുല്യപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: ഉദ്ധരിച്ചിരിക്കുന്ന രേഖയുടെ തിരിച്ചറിയൽ
  choice: ‘യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം’ എന്ന് പരിഭാഷപ്പെടുത്തി, അതിനെ പൊതുവായ രാജകീയ രേഖാസ്രോതസ്സായി തുറന്നുവെക്കുന്നു.
  alternative: ഇത് കാനോനിക ദിനവൃത്താന്തപുസ്തകമാണെന്ന് നേരിട്ട് തിരിച്ചറിയുക.
  rationale: എബ്രായ ശീർഷകം രാജകീയ രേഖയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഇന്നത്തെ കാനോനിക ദിനവൃത്താന്തപുസ്തകം തന്നെയാണെന്ന് വാക്യം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. അലങ്കാരപ്രശ്നത്തിന്റെ രൂപം നിലനിർത്തി.
