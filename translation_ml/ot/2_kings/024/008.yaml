source:
  edition: WLC
  text: בֶּן שְׁמֹנֶ֨ה עֶשְׂרֵ֤ה שָׁנָה֙ יְהוֹיָכִ֣ין בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֣ה חֳדָשִׁ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ נְחֻשְׁתָּ֥א בַת אֶלְנָתָ֖ן מִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/008.yaml
  text: Jehoiachin was eighteen years old when he began to reign[a], and he reigned three months in Jerusalem. His mother’s name was Nehushta daughter of Elnathan, from Jerusalem.
translation:
  language: ml
  text: യഹോയാഖീൻ രാജാവായപ്പോൾ അവന് പതിനെട്ട് വയസ്സായിരുന്നു. അവൻ യെരൂശലേമിൽ മൂന്നു മാസം ഭരിച്ചു. അവന്റെ അമ്മയുടെ പേര് നെഹുഷ്താ എന്നായിരുന്നു; അവൾ യെരൂശലേമിൽനിന്നുള്ള എൽനാഥാന്റെ മകളായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: അവന് പതിനെട്ട് വയസ്സായിരുന്നു
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയുടെ സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാളരൂപം.
- source_word: בְּמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: സിംഹാസനാരോഹണത്തിന്റെ സമയം സൂചിപ്പിക്കുന്ന ബ് + ക്രിയാരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: ‘രാജാവായി വാഴുക/ഭരിക്കുക’ എന്ന ക്രിയാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: മൂന്നു മാസം
  rationale: ഭരണകാലത്തിന്റെ ദൈർഘ്യം സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בִּירוּשָׁלָם
  choice: യെരൂശലേമിൽ
  rationale: നഗരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലവാചകത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് ... എന്നായിരുന്നു
  rationale: വംശാവലിസൂത്രത്തിന്റെ വിവരഘടന നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: נְחֻשְׁתָּא
  choice: നെഹുഷ്താ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בַת אֶלְנָתָן
  choice: എൽനാഥാന്റെ മകൾ
  rationale: നിർമാണബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പദസമുച്ചയത്തെ സ്വാഭാവിക മലയാള ഉടമസ്ഥരൂപത്തിൽ നൽകുന്നു.
- source_word: מִירוּשָׁלָם
  choice: യെരൂശലേമിൽനിന്നുള്ള
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ഉറവിടം/ദേശം എന്ന അടിസ്ഥാനാർഥം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ രാജവൃത്താന്തശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ‘യെരൂശലേമിൽനിന്ന്’ എന്ന ദേശസൂചന നെഹുഷ്തായെയോ എൽനാഥാനെയോ വ്യാകരണപരമായി ബന്ധിപ്പിക്കാവുന്നുവെങ്കിലും, മലയാളത്തിൽ ഏറ്റവും സ്വാഭാവികമായി നെഹുഷ്തായെ ‘യെരൂശലേമിൽനിന്നുള്ള എൽനാഥാന്റെ മകൾ’ എന്നു അവതരിപ്പിച്ചു; ആശയത്തിൽ അനാവശ്യമായ വിശദീകരണം ചേർത്തിട്ടില്ല.
