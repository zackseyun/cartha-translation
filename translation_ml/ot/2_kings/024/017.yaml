base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/017.yaml
  text: And the king of Babylon made Mattaniah[a], his uncle, king in his place, and changed his name to Zedekiah.
translation:
  language: ml
  text: ബാബേൽരാജാവ് യെഹോയാഖീന്റെ സ്ഥാനത്ത് അവന്റെ പിതൃസഹോദരനായ മത്ഥന്യാവിനെ രാജാവാക്കി[a]; അവന്റെ പേര് സിദെക്കീയാവ് എന്നു മാറ്റുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മത്ഥന്യാവിനെ രാജാവായി നിയമിച്ചു.’ ഹീബ്രുക്രിയ കാരണാർത്ഥകമാണ്; ബാബേൽരാജാവ് അവനെ ഭരണാധികാരിയായി സ്ഥാപിച്ചു എന്നാണ് അർത്ഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: രാജാവാക്കി
  rationale: 'מלך എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ കാരണാർത്ഥകമാണ്: ബാബേൽരാജാവ് മത്ഥന്യാവിനെ ഭരണാധികാരിയായി നിയമിച്ചതാണ് സൂചിപ്പിക്കുന്നത്.'
- source_word: מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവ്
  rationale: സംബന്ധപദഘടനയെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מַתַּנְיָה
  choice: മത്ഥന്യാവ്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ നാമരൂപങ്ങളുടെ ശൈലിക്കനുസരിച്ച് ലിപ്യന്തരണം ചെയ്തു.
- source_word: דֹדוֹ
  choice: അവന്റെ പിതൃസഹോദരനായ
  rationale: דּוֹד എന്ന പദത്തിന് 'അമ്മാവൻ/ചിറ്റപ്പൻ/ബന്ധു' തുടങ്ങിയ അർത്ഥസാധ്യതകളുണ്ടെങ്കിലും, ഈ ചരിത്രസന്ദർഭത്തിൽ മത്ഥന്യാവ് യെഹോയാഖീന്റെ പിതാവിന്റെ സഹോദരനാണ്; മലയാളത്തിൽ ബന്ധം കൃത്യമായി വ്യക്തമാക്കാൻ 'പിതൃസഹോദരൻ' ഉപയോഗിച്ചു.
- source_word: תַּחְתָּיו
  choice: യെഹോയാഖീന്റെ സ്ഥാനത്ത്
  rationale: രാജസ്ഥാനാരോഹണസന്ദർഭത്തിൽ പകരംവരവ് സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ സർവനാമത്തിന്റെ സൂചിതവ്യക്തിയെ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പേരോടെ അവതരിപ്പിച്ചു.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ
  choice: അവന്റെ പേര് ... എന്നു മാറ്റുകയും ചെയ്തു
  rationale: പേരോടൊപ്പം വരുന്ന סבב എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർത്ഥം പേരുമാറ്റുക എന്നതാണ്.
- source_word: צִדְקִיָּהוּ
  choice: സിദെക്കീയാവ്
  rationale: സ്ഥിരപ്രചാരമുള്ള മലയാള ബൈബിൾ നാമരൂപം ഉപയോഗിച്ചു.
