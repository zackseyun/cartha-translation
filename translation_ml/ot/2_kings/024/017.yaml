translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഹീബ്രുവിലെ കാരണാർത്ഥകക്രിയ നിലനിർത്താൻ ‘രാജാവാക്കി’ എന്നും, ബന്ധം ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാക്കാൻ ‘പിതൃസഹോദരൻ’ എന്നും ഉപയോഗിച്ചു. മുൻവാക്യസന്ദർഭമില്ലാതെയും വാക്യം വ്യക്തമായിരിക്കാനായി תַּחְתָּיוയിലെ സർവനാമസൂചന ‘യെഹോയാഖീന്റെ’ എന്നു തുറന്നുപറഞ്ഞു.
