source:
  edition: WLC
  text: וַ/יּוֹצֵ֣א מִ/שָּׁ֗ם אֶת כָּל אוֹצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֽוֹצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְקַצֵּ֞ץ אֶת כָּל כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר עָשָׂ֜ה שְׁלֹמֹ֤ה מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/הֵיכַ֣ל יְהוָ֔ה כַּֽ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
translation:
  language: ml
  text: അവൻ അവിടെനിന്ന് യഹോവയുടെ ആലയത്തിലെ സകല നിധികളും രാജകൊട്ടാരത്തിലെ നിധികളും എടുത്തുകൊണ്ടുപോയി[a]. ഇസ്രായേൽരാജാവായ ശലോമോൻ യഹോവയുടെ മന്ദിരത്തിൽ ഉണ്ടാക്കിയിരുന്ന സകല സ്വർണപാത്രങ്ങളും അവൻ വെട്ടി കഷണങ്ങളാക്കി[b]—യഹോവ അരുളിച്ചെയ്തിരുന്നതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവിടെനിന്ന് പുറത്തെടുത്തു’ അല്ലെങ്കിൽ ‘അവിടെനിന്ന് എടുത്തു.’
    reason: lexical_alternative
  - marker: b
    text: വാക്യത്തിന്റെ ആദ്യഭാഗത്ത് ‘യഹോവയുടെ ആലയം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രു പദത്തിൽനിന്ന് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന പദം വ്യത്യസ്തമാണ്; ഇവിടത്തെ പദം പലപ്പോഴും ആലയഘടനയെയോ വിശുദ്ധമന്ദിരത്തെയോ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  choice: അവിടെനിന്ന് ... എടുത്തുകൊണ്ടുപോയി
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വസ്തുക്കളെ ഒരു സ്ഥലത്തുനിന്ന് പുറത്തേക്കു നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കൊള്ളയടിച്ചു കൊണ്ടുപോകുന്ന ഈ സന്ദർഭത്തിൽ ‘എടുത്തുകൊണ്ടുപോയി’ സ്വാഭാവികവും കൃത്യവുമാണ്; ‘പുറത്തെടുത്തു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אוֹצְרוֹת
  choice: നിക്ഷേപങ്ങൾ
  rationale: ഇവിടെ സംഭരണശാലകളെയല്ല, അവയിൽ സൂക്ഷിച്ചിരുന്ന വിലപിടിപ്പുള്ള സമ്പത്തിനെയാണ് നേരിട്ടുള്ള കർമമായി സൂചിപ്പിക്കുന്നത്.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: ദൈവാരാധനയ്ക്കുള്ള വിശുദ്ധ ഭവനം എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പിന്നാലെയുള്ള הֵיכַל എന്ന വ്യത്യസ്ത പദത്തോട് ‘മന്ദിരം’ എന്നു വേർതിരിച്ചിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוהയെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി പകർത്തുന്നു.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജകൊട്ടാരം
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘രാജാവിന്റെ ഭവനം’ ഈ സന്ദർഭത്തിൽ രാജാവിന്റെ കൊട്ടാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘രാജകൊട്ടാരം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיְקַצֵּץ
  choice: വെട്ടി കഷണങ്ങളാക്കി
  rationale: קצץ എന്ന പീയേൽ രൂപത്തിലെ മുറിച്ചുതുണ്ടാക്കുന്ന ഭൗതിക പ്രവൃത്തി വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: כְּלֵי הַזָּהָב
  choice: സ്വർണപാത്രങ്ങൾ
  rationale: ക്ഷേത്രസന്ദർഭത്തിൽ כְּלִי സൂചിപ്പിക്കുന്ന ഉപകരണങ്ങളെയോ പാത്രങ്ങളെയോ മലയാളത്തിൽ മാന്യവും പരിചിതവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കിയിരുന്ന
  rationale: ശലോമോന്റെ നിർമാണം ഇപ്പോഴത്തെ നശിപ്പിക്കലിനു മുമ്പ് നടന്നതാണെന്ന കാലബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּהֵיכַל יְהוָה
  choice: യഹോവയുടെ മന്ദിരത്തിൽ
  rationale: הֵיכַל ഇവിടെ ആലയഘടനയെയോ വിശുദ്ധമന്ദിരത്തെയോ സൂചിപ്പിക്കുന്നു. മുൻപുള്ള בֵּית എന്ന പദത്തിൽനിന്നുള്ള ഹീബ്രു പദവ്യത്യാസം ‘മന്ദിരം’ വഴി സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: യഹോവ അരുളിച്ചെയ്തിരുന്നതുപോലെതന്നെ
  rationale: മുൻപ് പ്രസ്താവിച്ച ദൈവവചനത്തിന്റെ പൂർത്തീകരണമെന്ന ഭാവം ‘പോലെതന്നെ’ കൊണ്ടും ദൈവിക പ്രസ്താവനയുടെ മാന്യസ്വരം ‘അരുളിച്ചെയ്തു’ കൊണ്ടും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം നാലക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുവായ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
- issue: മുൻപ്രവചനത്തിന്റെ പൂർത്തീകരണഭാവം
  choice: യഹോവ അരുളിച്ചെയ്തിരുന്നതുപോലെതന്നെ
  alternative: യഹോവ പറഞ്ഞതുപോലെ
  rationale: כַּאֲשֶׁר എന്നത് സംഭവവും മുൻവചനവും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം സൂചിപ്പിക്കുന്നു; എന്നാൽ ഏത് പ്രത്യേക പ്രവചനമാണെന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അതു ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ നീണ്ട സംയുക്തവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; പ്രവർത്തനക്രമവും പ്രവചനപൂർത്തീകരണത്തിന്റെ ഊന്നലും മാറ്റിയിട്ടില്ല. ‘ആലയം/മന്ദിരം’ എന്ന വ്യത്യാസത്തിലൂടെ בַּיִת/הֵיכַל പദവ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തി.
