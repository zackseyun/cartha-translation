revisions:
- from: അവൻ അവിടെനിന്ന് യഹോവയുടെ ആലയത്തിലെ സകല നിക്ഷേപങ്ങളും രാജകൊട്ടാരത്തിലെ നിക്ഷേപങ്ങളും എടുത്തുകൊണ്ടുപോയി[a]. ഇസ്രായേൽരാജാവായ ശലോമോൻ യഹോവയുടെ മന്ദിരത്തിൽ ഉണ്ടാക്കിയിരുന്ന സകല സ്വർണപാത്രങ്ങളും അവൻ വെട്ടി കഷണങ്ങളാക്കി[b]—യഹോവ അരുളിച്ചെയ്തിരുന്നതുപോലെതന്നെ.
  to: അവൻ അവിടെനിന്ന് യഹോവയുടെ ആലയത്തിലെ സകല നിധികളും രാജകൊട്ടാരത്തിലെ നിധികളും എടുത്തുകൊണ്ടുപോയി[a]. ഇസ്രായേൽരാജാവായ ശലോമോൻ യഹോവയുടെ മന്ദിരത്തിൽ ഉണ്ടാക്കിയിരുന്ന സകല സ്വർണപാത്രങ്ങളും അവൻ വെട്ടി കഷണങ്ങളാക്കി[b]—യഹോവ അരുളിച്ചെയ്തിരുന്നതുപോലെതന്നെ.
  rationale: ‘നിക്ഷേപങ്ങൾ’ എന്ന ആധുനിക മലയാളത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാവുന്ന പദം ‘നിധികൾ’ എന്നാക്കി മാറ്റി. ഇതിലൂടെ אוֹצְרוֹת എന്നതിന്റെ ‘വിലപിടിപ്പുള്ള സമ്പത്ത്/treasures’ എന്ന അർഥം കൃത്യമായി ലഭിക്കുന്നു; വാക്യത്തിന്റെ അർഥം, പ്രവർത്തനക്രമം, ആലയം–മന്ദിരം പദവ്യത്യാസം, അടിക്കുറിപ്പുകൾ എന്നിവ മാറ്റിയിട്ടില്ല.
