id: 2KI.24.9
reference: 2 Kings 24:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/009.yaml
  text: And he did what was evil in the eyes of Yahweh, according to all that his father had done.
translation:
  language: ml
  text: അവൻ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് തന്റെ പിതാവ് ചെയ്തതൊക്കെയും പോലെ ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ചെയ്തു
  rationale: עשה എന്ന ക്രിയയുടെ ഖാൽ wayyiqtol രൂപം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ഭൂതകാലക്രിയയാണ്. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘അവൻ’ സ്വാഭാവികമായ ആഖ്യാനബന്ധം നിലനിർത്തുന്നു; ഹീബ്രുവിലെ וַ־ പ്രത്യേകം ‘എന്നിട്ട്’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: הָרַע
  choice: തിന്മയായതു
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ വിശേഷണം ഇവിടെ നാമവൽക്കരിക്കപ്പെട്ട് ‘തിന്മയായത്’ എന്ന അർഥം നൽകുന്നു. രാജാക്കന്മാരിലെ സ്ഥിരപ്രയോഗത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: അക്ഷരാർഥം ‘കണ്ണുകളിൽ’ എന്നാണെങ്കിലും, ഒരാളുടെ വിലയിരുത്തലിൽ അഥവാ കാഴ്ചപ്പാടിൽ എന്ന ഹീബ്രു പ്രയോഗാർഥം മലയാളത്തിൽ ‘ദൃഷ്ടിയിൽ’ എന്ന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ പ്രകടമാകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: כְּכֹל אֲשֶׁר
  choice: ചെയ്തതുപോലെ എല്ലാം
  rationale: כְּ־യുടെ താരതമ്യബലവും כֹּל־ന്റെ സമഗ്രതയും നിലനിർത്താൻ മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ ‘ചെയ്തതുപോലെ എല്ലാം’ എന്നു നൽകി.
- source_word: עָשָׂה
  choice: ചെയ്ത
  rationale: പിതാവിന്റെ മുൻകാല പ്രവൃത്തിയെ ബന്ധക ഭൂതകാലരൂപം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക പൂർവഭൂതകാലസഹായക്രിയ ആവശ്യമില്ല.
- source_word: אָבִיו
  choice: തന്റെ അപ്പൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം കർത്താവിലേക്കു തിരിച്ചുനിൽക്കുന്നതിനാൽ ‘തന്റെ’ എന്ന സ്വാഭാവിക പ്രതിഫലനസർവനാമം ഉപയോഗിച്ചു. ‘അപ്പൻ’ സാധാരണക്കാർക്ക് വ്യക്തവും dignified biblical register-ലും സ്വീകാര്യവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ വ്യാപകവും തിരിച്ചറിയാവുന്നതുമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു. ഉച്ചാരണത്തിന്റെ പുനർനിർമാണമായി ‘യാഹ്‌വെ’ എന്ന രൂപവും സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, രാജാക്കന്മാരിലെ ദൈവിക വിലയിരുത്തൽസൂത്രത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന സംക്ഷിപ്ത ശൈലി. ‘കണ്ണുകളിൽ’ എന്ന പദാനുപദരൂപത്തിനു പകരം സ്വാഭാവികമായ ‘ദൃഷ്ടിയിൽ’ ഉപയോഗിച്ചു. മൂലത്തിലെ താരതമ്യവും സമഗ്രതയും ഒരുമിച്ച് സൂക്ഷിക്കാൻ ‘ചെയ്തതുപോലെ എല്ലാം’ എന്ന ക്രമം തിരഞ്ഞെടുത്തു.
