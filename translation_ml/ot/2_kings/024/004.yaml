  terminology: ‘യഹ്‌വെ,’ ‘നിരപരാധികളുടെ രക്തം,’ ‘ക്ഷമിക്കുക’ എന്നിവ ഉചിതമാണ്. ‘സന്നദ്ധനായില്ല’ ദൈവത്തിന്റെ ക്ഷമിക്കാനുള്ള ഇച്ഛാപൂർവകമായ നിരസനം സൂചിപ്പിക്കുന്നു; കഴിവില്ലായ്മയോ അനിയന്ത്രിതമായ മാനസികാവസ്ഥയോ സൂചിപ്പിക്കുന്നില്ല.
