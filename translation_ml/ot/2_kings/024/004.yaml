  to: അവൻ ചൊരിഞ്ഞ നിരപരാധികളുടെ രക്തം നിമിത്തവും[a]—അവൻ യെരൂശലേമിനെ നിരപരാധികളുടെ രക്തംകൊണ്ട് നിറച്ചിരുന്നു—യഹ്‌വെ ക്ഷമിക്കാൻ സന്നദ്ധനായില്ല.[b]
