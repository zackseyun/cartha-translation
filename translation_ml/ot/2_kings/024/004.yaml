source:
  edition: WLC
  text: וְ/גַ֤ם דַּֽם הַ/נָּקִי֙ אֲשֶׁ֣ר שָׁפָ֔ךְ וַ/יְמַלֵּ֥א אֶת יְרוּשָׁלִַ֖ם דָּ֣ם נָקִ֑י וְ/לֹֽא אָבָ֥ה יְהוָ֖ה לִ/סְלֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/004.yaml
  text: and also for the innocent blood that he had shed[a], for he had filled Jerusalem with innocent blood[b], and Yahweh was not willing to forgive.
translation:
  language: ml
  text: അവൻ ചൊരിഞ്ഞ നിരപരാധികളുടെ രക്തം നിമിത്തവും[a]—അവൻ യെരൂശലേമിനെ നിരപരാധികളുടെ രക്തംകൊണ്ട് നിറച്ചിരുന്നു—യഹ്‌വെ ക്ഷമിക്കാൻ സന്നദ്ധനായില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിരപരാധരക്തം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യഹ്‌വെ ക്ഷമിക്കാൻ വിസമ്മതിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: നിമിത്തവും
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ന്യായവിധിയുടെ കാരണങ്ങളോട് മറ്റൊരു കാരണംകൂടി ചേർക്കുന്ന അനുബന്ധ-യോഗാത്മക ബലം സന്ദർഭസഹിതം പ്രകടമാക്കുന്നു.
- source_word: דַּם הַנָּקִי
  choice: നിരപരാധികളുടെ രക്തം
  rationale: അന്യായമായി കൊല്ലപ്പെട്ട നിരപരാധികളുടെ രക്തത്തെയും അതുമൂലമുള്ള രക്തപാതകക്കുറ്റത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אֲשֶׁר שָׁפָךְ
  choice: അവൻ ചൊരിഞ്ഞ
  rationale: രക്തത്തോടൊപ്പം שׁפך ഉപയോഗിക്കുമ്പോൾ ‘രക്തം ചൊരിയുക’ എന്ന പതിവുപ്രയോഗമാണ്; കർത്താവായ ‘അവൻ’ മനശ്ശെയെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  choice: അവൻ യെരൂശലേമിനെ നിരപരാധരക്തംകൊണ്ട് നിറച്ചിരുന്നു
  rationale: ‘യെരൂശലേമിനെ നിരപരാധരക്തംകൊണ്ട് നിറച്ചു’ എന്ന മൂലരൂപം സംരക്ഷിക്കുന്നു; ‘നിറച്ചിരുന്നു’ മുൻകാല പ്രവൃത്തിയുടെ വിശദീകരണസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא אָבָה
  choice: മനസ്സായില്ല
  rationale: אָבָה എന്ന പദത്തിന്റെ സമ്മതം/സന്നദ്ധത എന്ന അർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വെറും ഭാവികാല നിഷേധമായി ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לִסְלֹחַ
  choice: ക്ഷമിക്കാൻ
  rationale: ദൈവിക പാപമോചനത്തിന്റെ സന്ദർഭത്തിൽ סלח എന്ന ക്രിയയുടെ വ്യക്തവും സാധാരണവുമായ മലയാള തത്തുല്യം.
theological_decisions:
- issue: മനശ്ശെയുടെ രക്തപാതകത്തിന്റെ പശ്ചാത്തലത്തിൽ ദൈവം ക്ഷമിക്കാൻ മനസ്സാകാതിരുന്നത്
  choice: നിരപരാധരക്തംകൊണ്ട് യെരൂശലേം നിറഞ്ഞതിനാൽ ഈ ഘട്ടത്തിൽ യഹ്‌വെ ക്ഷമിക്കാൻ മനസ്സായില്ലെന്ന് നേരിട്ട് പ്രസ്താവിക്കുന്നു.
  alternative: യഹ്‌വെ യെഹൂദയെ പൊതുവിൽ ക്ഷമിക്കുകയില്ലായിരുന്നു; അല്ലെങ്കിൽ ഇത് ന്യായവിധിയെക്കുറിച്ചുള്ള അതിശയോക്തിയാണ്.
  rationale: എബ്രായപാഠം ക്ഷമിക്കാനുള്ള മനസ്സില്ലായ്മയെ നേരിട്ട് യഹ്‌വെയോട് ബന്ധിപ്പിക്കുന്നു. അതിന്റെ കാഠിന്യം മയപ്പെടുത്താതെയും വാക്യം പറയുന്നതിലപ്പുറം വ്യാപിപ്പിക്കാതെയും ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നിരപരാധികളുടെ രക്തം’ സ്വാഭാവിക മലയാളവും ‘നിരപരാധരക്തം’ ആവർത്തനത്തിലെ എബ്രായ സാന്ദ്രതയും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
