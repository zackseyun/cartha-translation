  yaml_path: translation/ot/2_kings/024/018.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
translation:
  language: ml
  text: സിദെക്കീയാവ് രാജാവായപ്പോൾ അവന് ഇരുപത്തിയൊന്ന് വയസ്സായിരുന്നു; അവൻ യെരൂശലേമിൽ പതിനൊന്ന് വർഷം ഭരിച്ചു. അവന്റെ അമ്മയുടെ പേര് ലിബ്നക്കാരനായ യിരെമ്യാവിന്റെ മകളായ ഹമൂതൽ[a] എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പേര് ചില ഇംഗ്ലീഷ് പരിഭാഷകളിൽ ‘ഹമീതൽ’ എന്നും എഴുതിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: അവന് ഇരുപത്തിയൊന്ന് വയസ്സായിരുന്നു
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: ב ചേർന്ന infinitive construct രാജസ്ഥാനാരോഹണത്തിന്റെ സമയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ കാലപ്രയോഗം.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: രാജാവായി വാഴുക/ഭരിക്കുക എന്ന ക്രിയാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: ב എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് … എന്നായിരുന്നു
  rationale: രാജവംശവിവരണങ്ങളിൽ കാണുന്ന സൂത്രവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חמיטל
  choice: ഹമൂതൽ
  rationale: വ്യക്തിനാമം എബ്രായ വ്യഞ്ജന-സ്വരരൂപമായ Ḥămûṭal അനുസരിച്ച് ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: בַּת יִרְמְיָהוּ
  choice: യിരെമ്യാവിന്റെ മകൾ
  rationale: മാതാപിതൃബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ വംശാവലിപ്രയോഗം.
- source_word: מִלִּבְנָה
  choice: ലിബ്നക്കാരനായ
  rationale: മൂലസ്ഥലം/ദേശബന്ധം സൂചിപ്പിക്കുന്ന מִן എന്ന ഉപസർഗം യിരെമ്യാവിനോടാണ് ബന്ധപ്പെടുന്നത്; മലയാളത്തിൽ ദേശനാമവിശേഷണമായി സ്വാഭാവികമായി നൽകുന്നു.
