source:
  edition: WLC
  text: בְּ/יָמָ֣י/ו עָלָ֔ה נְבֻכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יְהִי ל֨/וֹ יְהוֹיָקִ֥ים עֶ֨בֶד֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יָּ֖שָׁב וַ/יִּמְרָד בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
translation:
  language: ml
  text: അവന്റെ കാലത്ത് ബാബേൽ രാജാവായ നെബൂഖദ്‌നേസർ വന്നു[a]. യെഹോയാക്കീം മൂന്നു വർഷം അവന്റെ ദാസനായിത്തീർന്നു[b]. പിന്നീട് അവൻ തിരിഞ്ഞ് നെബൂഖദ്‌നേസർക്കെതിരെ കലാപം നടത്തി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പടയെടുത്തുവന്നു.’ ഇവിടെ ‘വന്നു’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായക്രിയ സൈനിക മുന്നേറ്റത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവന്റെ അധീനനായ രാജാവായി.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവന് ഒരു ദാസനായിത്തീർന്നു’ എന്നാണ്; ഒരു മേലധികാരിയായ രാജാവിനോടുള്ള രാഷ്ട്രീയവിധേയത്വം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘തിരിഞ്ഞ് അവനെതിരെ മത്സരിച്ചു.’ ‘തിരിഞ്ഞ്’ എന്ന ക്രിയ കലാപത്തിനു മുമ്പുണ്ടായ വിധേയത്വത്തിൽനിന്നുള്ള മാറ്റത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: അവന്റെ കാലത്ത്
  rationale: മുമ്പ് പരാമർശിച്ച രാജാവിന്റെ ഭരണകാലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עָלָה
  choice: വന്നു
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കയറിവരുക/വരുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സൈനിക മുന്നേറ്റം സൂചിപ്പിക്കാമെങ്കിലും മുഖ്യവാചകത്തിൽ അത് അതിവ്യക്തമാക്കുന്നില്ല.
- source_word: נְבֻכַדְנֶאצַּר
  choice: നെബൂഖദ്‌നേസർ
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും മൂലനാമത്തോട് യോജിച്ചതുമായ ലിപ്യന്തരണം.
- source_word: מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവായ
  rationale: എബ്രായ സംയുക്തപദപ്രയോഗം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: അവന്റെ ദാസനായിത്തീർന്നു
  rationale: നിലവിലെ അവസ്ഥയേക്കാൾ പുതിയ അധീനബന്ധത്തിലേക്കുള്ള പ്രവേശനമാണ് ആഖ്യാനരൂപം സൂചിപ്പിക്കുന്നത്; ‘ആയിത്തീർന്നു’ ആ മാറ്റം പ്രകടമാക്കുന്നു.
- source_word: עֶבֶד
  choice: ദാസൻ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു. ഇവിടെ ഒരു രാജാവ് മേൽക്കോയ്മയുള്ള മറ്റൊരു രാജാവിനു രാഷ്ട്രീയമായി കീഴടങ്ങിയ സ്ഥിതിയാണ്; ‘സാമന്തൻ’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: മൂന്നു വർഷം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיָּשָׁב
  choice: പിന്നീട് അവൻ തിരിഞ്ഞ്
  rationale: שוב എന്ന ക്രിയയിലെ ‘തിരിയുക/മടങ്ങുക’ എന്ന അർഥം സംരക്ഷിക്കുകയും മുൻവിധേയത്വത്തിൽനിന്നുള്ള കൂറുമാറ്റം സൂചിപ്പിക്കുന്ന സാധ്യത തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּמְרָד בּוֹ
  choice: നെബൂഖദ്‌നേസരിനോടു മത്സരിച്ചു
  rationale: מרד ב എന്നത് മേലധികാരിക്കെതിരായ കലാപത്തെയോ മത്സരത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മത്സരിച്ചു’ രാജാവിനെതിരായ എതിർപ്പിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു; സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പ്രതിനായകന്റെ പേര് ആവർത്തിക്കുന്നു.
