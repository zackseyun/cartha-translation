translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രാഷ്ട്രീയ ‘ദാസൻ’ രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു. ‘തിരിഞ്ഞ്’ എന്നതിലെ യഥാർഥ പദസാന്നിധ്യവും അർഥസാധ്യതയും സംരക്ഷിച്ചിരിക്കുന്നു.
