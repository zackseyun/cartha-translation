id: 2KI.24.10
reference: 2 Kings 24:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא עלה עַבְדֵ֛י נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָ֑ם וַ/תָּבֹ֥א הָ/עִ֖יר בַּ/מָּצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/010.yaml
  text: At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem[b][a], and the city came under siege.
translation:
  language: ml
  text: ആ കാലത്ത് ബാബേൽരാജാവായ നെബൂഖദ്‌നേസറിന്റെ ദാസന്മാർ യെരൂശലേമിനെതിരെ കയറിവന്നു[a]; നഗരം ഉപരോധത്തിലായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘യെരൂശലേമിലേക്കു കയറിവന്നു.’ എബ്രായപ്രയോഗം ഉയരത്തിലേക്കുള്ള യാത്രയെയും സൈനിക മുന്നേറ്റത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘നഗരം ഉപരോധിക്കപ്പെട്ടു.’ എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘നഗരം ഉപരോധത്തിലേക്കു വന്നു’ എന്നാണ്; ഇത് ഉപരോധത്തിന്റെ ആരംഭത്തിന് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: ആ കാലത്ത്
  rationale: ചരിത്രസന്ദർഭം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം; എബ്രായത്തിലെ കാലസൂചന നിലനിർത്തുന്നു.
- source_word: עָלָה
  choice: കയറിവന്നു
  rationale: യെരൂശലേമിലേക്കുള്ള ഉയർച്ചയും സൈനിക മുന്നേറ്റവും ഉൾക്കൊള്ളുന്ന എബ്രായപ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തുന്നു; ശത്രുതാപരമായ ലക്ഷ്യം ‘എതിരെ’ എന്നതിലൂടെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: עַבְדֵי
  choice: ദാസന്മാർ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം സംരക്ഷിക്കുന്നു. ഇവിടെ രാജാവിന്റെ അധികാരത്തിൻ കീഴിലുള്ള സൈനിക ഏജന്റുമാരാകാമെങ്കിലും, മൂലപാഠം ‘സൈന്യം’ എന്നോ ‘ഉദ്യോഗസ്ഥർ’ എന്നോ പ്രത്യേകം പറയുന്നില്ല.
- source_word: נְבֻכַדְנֶאצַּר
  choice: നെബൂഖദ്‌നേസർ
  rationale: മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ പേരുരൂപം ഉപയോഗിക്കുന്നു.
- source_word: מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവ്
  rationale: എബ്രായത്തിലെ രാജകീയ പദവി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יְרוּשָׁלִָם
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾപരമ്പരയിൽ പൊതുവായി പരിചിതമായ സ്ഥലനാമരൂപം.
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: നഗരം ഉപരോധത്തിലായി
  rationale: ‘നഗരം ഉപരോധത്തിലേക്കു വന്നു’ എന്ന അക്ഷരാർഥത്തിലെ ഉപരോധത്തിന്റെ ആരംഭഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מָצוֹר
  choice: ഉപരോധം
  rationale: സൈനികമായി ഒരു നഗരത്തെ വളഞ്ഞടയ്ക്കുന്ന അവസ്ഥയ്ക്കുള്ള വ്യക്തവും സാധാരണവുമായ മലയാളപദം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദാസന്മാർ’ എന്നത് മൂലപാഠത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു; സൈനികർ എന്ന അമിതവ്യക്തീകരണം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
