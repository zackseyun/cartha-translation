base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
translation:
  language: ml
  text: തീർച്ചയായും, യാഹ്‌വെയുടെ കൽപ്പനപ്രകാരം ഇതു യെഹൂദയുടെമേൽ വന്നു; മനശ്ശെയുടെ പാപങ്ങൾ നിമിത്തം, അവൻ ചെയ്ത സകലത്തിനും തക്കവണ്ണം, അവരെ തന്റെ മുഖത്തിനുമുമ്പിൽനിന്ന്[a] നീക്കിക്കളയേണ്ടതിനായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ സന്നിധിയിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: തീർച്ചയായും
  rationale: ഇവിടെ ഈ പദം നിയന്ത്രണം സൂചിപ്പിക്കുന്ന ‘മാത്രം’ എന്ന അർഥത്തിലല്ല, മുൻവിവരണത്തെ ഊന്നിപ്പറയുന്ന ഉറപ്പായ പ്രസ്താവനയായാണ് പ്രവർത്തിക്കുന്നത്.
- source_word: עַל פִּי
  choice: കല്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘വായനുസരിച്ച്’ എന്നെങ്കിലും, ഒരാളുടെ വാക്കോ കല്പനയോ അനുസരിച്ചുള്ള സംഭവത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമത്തിന്റെ എബ്രായ ഉച്ചാരണത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: הָיְתָה בִּיהוּדָה
  choice: ഇതു യെഹൂദയ്ക്കു സംഭവിച്ചു
  rationale: സ്ത്രീലിംഗ ക്രിയയുടെ വ്യക്തമായ കർത്താവ് വാക്യത്തിൽ ഇല്ല; സന്ദർഭത്തിൽ മുമ്പ് വിവരിച്ച ന്യായവിധിയാണ് സൂചിതം. ‘ഇതു’ ആ സൂചന നിലനിർത്തുന്നു, പ്രത്യേക അനർത്ഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: לְהָסִיר
  choice: നീക്കിക്കളയേണ്ടതിന്
  rationale: סור എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപം കാരണകമായ നീക്കലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ലക്ഷ്യാർഥവും ശക്തിയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵעַל פָּנָיו
  choice: തന്റെ മുഖത്തിനുമുമ്പിൽനിന്ന്
  rationale: ദൈവസന്നിധിയിൽനിന്നുള്ള പുറത്താക്കലിനെ സൂചിപ്പിക്കുന്ന എബ്രായത്തിലെ ‘മുഖം’ എന്ന ദൃശ്യപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּחַטֹּאת
  choice: അവന്റെ പാപങ്ങൾ നിമിത്തം
  rationale: בְּ ഇവിടെ കാരണാർഥത്തിലാണ്; മനശ്ശെയുടെ കുറ്റങ്ങളുടെ സമഗ്രത മലയാളത്തിലെ ബഹുവചനത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: മനശ്ശെ ചെയ്ത സകലത്തിനും തക്കവണ്ണം
  rationale: כְּכֹל സൂചിപ്പിക്കുന്ന അനുരൂപതയോ അളവോ ‘തക്കവണ്ണം’ നിലനിർത്തുന്നു; സർവനാമത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ മനശ്ശെയുടെ പേര് ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിയെക്കുറിച്ചുള്ള അപൂർണ്ണവാക്യത്തിലെ സൂചിത കർത്താവും കർമവും
  choice: മുമ്പ് വിവരിച്ച സംഭവം യെഹൂദയ്ക്കു സംഭവിച്ചുവെന്നും നീക്കപ്പെടേണ്ടവർ യെഹൂദയിലെ ജനങ്ങളാണെന്നും സന്ദർഭാനുസൃതമായി ‘ഇതു’, ‘അവരെ’ എന്നു നൽകി.
  alternative: കർമം ചേർക്കാതെ ‘തന്റെ മുഖത്തിനുമുമ്പിൽനിന്ന് നീക്കേണ്ടതിന്’ എന്ന അപൂർണ്ണ ഘടന നിലനിർത്തുക.
  rationale: എബ്രായം നേരിട്ടുള്ള കർമം വ്യക്തമാക്കുന്നില്ലെങ്കിലും ചുറ്റുപാടുള്ള വാക്യങ്ങൾ യെഹൂദയെയും യെരൂശലേമിനെയും പുറത്താക്കുന്നതിനെക്കുറിച്ചാണ്. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘അവരെ’ ആവശ്യമാണ്; എന്നാൽ ന്യായവിധിയുടെ രൂപം കൂടുതൽ നിർവചിച്ചിട്ടില്ല.
- issue: ദൈവസന്നിധിയെ സൂചിപ്പിക്കുന്ന മാനവരൂപക ഭാഷ
  choice: ‘തന്റെ മുഖത്തിനുമുമ്പിൽനിന്ന്’ എന്ന ദൃശ്യപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘തന്റെ സന്നിധിയിൽനിന്ന്’.
  rationale: എബ്രായത്തിലെ ‘മുഖം’ എന്ന രൂപകം ഇല്ലാതാക്കാതെ, ദൈവസന്നിധിയിൽനിന്നുള്ള പുറത്താക്കലിന്റെ ഭാരം നിലനിർത്തുന്നു; സ്വാഭാവികമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ അപൂർണ്ണത ‘ഇതു’ എന്നു സൂക്ഷിക്കുകയും സന്ദർഭം ആവശ്യപ്പെടുന്ന കർമം ‘അവരെ’ എന്നു നൽകുകയും ചെയ്തു. ‘മുഖം’ എന്ന മൂലരൂപകം മുഖ്യപാഠത്തിലും കൂടുതൽ സ്വാഭാവികമായ പ്രയോഗം അടിക്കുറിപ്പിലും നിലനിർത്തി.
