  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
translation:
  language: ml
  text: ഈജിപ്തിലെ രാജാവ് പിന്നീട് തന്റെ ദേശത്തുനിന്ന് പുറപ്പെട്ടില്ല; കാരണം, ഈജിപ്തിലെ നീർച്ചാലിൽ[a] നിന്ന് യൂഫ്രട്ടീസ് നദിവരെ ഈജിപ്തിലെ രാജാവിനുണ്ടായിരുന്നതെല്ലാം ബാബിലോൺ രാജാവ് കൈവശപ്പെടുത്തിയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈജിപ്തിലെ വാടി.” എബ്രായപദം കാലാവസ്ഥാനുസൃതമായ ഒരു നീർച്ചാലിനെയോ അതിന്റെ വരണ്ട പാതയെയോ സൂചിപ്പിക്കാം; ഇവിടെ “നദി” എന്നു പരിഭാഷപ്പെടുത്തുന്നത് യോജിച്ചതല്ല, കാരണം അത് നൈൽ നദിയുമായി തെറ്റിദ്ധരിക്കപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹסִיף עוֹד ... לָצֵאת
  choice: പിന്നീടൊരിക്കലും ... പുറപ്പെട്ടില്ല
  rationale: הוסיף + infinitive എന്ന പ്രയോഗം, לאയും עודയും ചേർന്ന ഇവിടെ, ഒരു പ്രവർത്തനം ഇനി ആവർത്തിക്കുകയോ തുടരുകയോ ചെയ്തില്ലെന്ന അർഥം നൽകുന്നു. സൈനിക നീക്കത്തിന്റെ സൂചന സന്ദർഭത്തിൽ നിലനിൽക്കുമ്പോഴും, മൂലത്തിലെ പൊതുവായ ‘പുറപ്പെടുക’ എന്ന ആശയം അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: מֵאַרְצוֹ
  choice: തന്റെ ദേശത്തുനിന്നു
  rationale: ‘അവന്റെ ദേശത്തുനിന്ന്’ എന്ന മൂലാർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഈജിപ്തുരാജാവ് ഇനി പുറപ്പെടാതിരുന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ കാരണാർഥം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: לָקַח
  choice: കൈവശപ്പെടുത്തിയിരുന്നു
  rationale: לקח എന്നത് അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണ്; ഇവിടെ പ്രദേശിക-രാജകീയ നിയന്ത്രണം ഏറ്റെടുത്തതിനെ സൂചിപ്പിക്കുന്ന ‘കൈവശപ്പെടുത്തുക’ സ്വാഭാവികമാണ്. മുൻപ് പൂർത്തിയായ പ്രവൃത്തിയെന്ന ബന്ധം ‘-യിരുന്നു’ കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: מִנַּחַל מִצְרַיִם
  choice: ഈജിപ്തിന്റെ അരുവി
  rationale: נחל സാധാരണയായി വാടി, നീർച്ചാൽ, അരുവി എന്നിവയെ സൂചിപ്പിക്കുന്നു; നൈൽപോലുള്ള വലിയ നദിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് പരിചിതവും വായനാസൗകര്യമുള്ളതുമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: עַד נְהַר פְּרָת
  choice: യൂഫ്രട്ടീസ് നദിവരെ
  rationale: נהר എന്ന ‘നദി’യും פרת എന്ന സ്ഥലനാമവും ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകുന്നു.
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തുരാജാവിനുണ്ടായിരുന്നതെല്ലാം
  rationale: മൂലത്തിലെ വിശാലമായ ഉടമസ്ഥതാ/അധീനതാ പ്രയോഗം നിലനിർത്തുന്നു; ഭൂമിശാസ്ത്രപരമായ സന്ദർഭം പ്രദേശിക നിയന്ത്രണം സൂചിപ്പിച്ചാലും, വിവർത്തനം അതിനെ ‘പ്രദേശം’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
