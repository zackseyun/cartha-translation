translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജകീയ-സൈനിക പശ്ചാത്തലം നിലനിർത്തിയെങ്കിലും ‘march’ പോലുള്ള അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല. ഭൂമിശാസ്ത്രപരമായ അതിരുകൾ വ്യക്തമായി അവതരിപ്പിച്ചു.
