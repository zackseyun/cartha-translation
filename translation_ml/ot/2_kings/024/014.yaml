  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ പട്ടികാസ്വഭാവവും ആവർത്തിക്കുന്ന ‘സകല’ എന്ന ഊന്നലും നിലനിർത്തി; ദുഷ്കരമായ തൊഴിൽപദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
