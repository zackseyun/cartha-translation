  text: וְ/הִגְלָ֣ה אֶת כָּל יְ֠רוּשָׁלִַם וְֽ/אֶת כָּל הַ/שָּׂרִ֞ים וְ/אֵ֣ת כָּל גִּבּוֹרֵ֣י הַ/חַ֗יִל עשרה אֲלָפִים֙ גּוֹלֶ֔ה וְ/כָל הֶ/חָרָ֖שׁ וְ/הַ/מַּסְגֵּ֑ר לֹ֣א נִשְׁאַ֔ר זוּלַ֖ת דַּלַּ֥ת עַם הָ/אָֽרֶץ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/014.yaml
  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
translation:
  language: ml
  text: അവൻ യെരൂശലേം മുഴുവനെയും[a], സകല ഭരണാധികാരികളെയും, സകല വീരന്മാരെയും, ശില്പികളെയും ലോഹപ്പണിക്കാരെയും ഉൾപ്പെടെ ആകെ പതിനായിരം പേരെ പ്രവാസത്തിലേക്കു കൊണ്ടുപോയി. ദേശത്തെ ജനങ്ങളിൽ ഏറ്റവും ദരിദ്രരായവർ ഒഴികെ ആരും ശേഷിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘യെരൂശലേം മുഴുവനെയും’ എന്നത് നഗരത്തിലെ ജനങ്ങളെയും ഭരണനേതൃത്വത്തെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ഭൗതിക നഗരത്തെ അല്ല.
    reason: metonymy_clarification
lexical_decisions:
- source_word: וְהִגְלָה
  choice: പ്രവാസത്തിലേക്കു കൊണ്ടുപോയി
  rationale: גלה എന്ന ധാതുവിന്റെ ഹിഫ്ഇൽ രൂപം നിർബന്ധിതമായി നാടുകടത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം പ്രവാസവും ബലമായ നീക്കവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל יְרוּשָׁלִַם
  choice: യെരൂശലേമിനെ മുഴുവനും
  rationale: എബ്രായത്തിലെ സ്ഥലനാമപ്രയോഗം അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ നഗരം ഭൗതികമായി മാറ്റിയെന്നല്ല, അതിലെ ജനസമൂഹത്തെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: הַשָּׂרִים
  choice: ഉദ്യോഗസ്ഥർ
  rationale: שׂרים എന്നത് പ്രഭുക്കന്മാർ, ഭരണാധികാരികൾ, ഉദ്യോഗസ്ഥർ എന്നിവരെ സൂചിപ്പിക്കാം. രാജകുമാരന്മാർക്ക് മാത്രമായി അർഥം ചുരുക്കാതെ ഭരണനേതൃത്വത്തെ സൂചിപ്പിക്കാൻ ‘ഉദ്യോഗസ്ഥർ’ തിരഞ്ഞെടുത്തു.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: വീരശൂരന്മാർ
  rationale: പ്രാപ്തരും ധീരരുമായ യോദ്ധാക്കളെ സൂചിപ്പിക്കുന്ന ഉയർന്ന ഭാവമുള്ള പ്രയോഗമാണ്; മലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ സമാനപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: עשרה אֲלָפִים גּוֹלֶה
  choice: പതിനായിരം പ്രവാസികൾ
  rationale: גולה ഇവിടെ നാടുകടത്തപ്പെട്ടവരുടെ സമൂഹത്തെ കൂട്ടവാചകമായി സൂചിപ്പിക്കുന്നു. ‘പ്രവാസികൾ’ നിർബന്ധിത നാടുകടത്തലിന്റെ ചരിത്രസന്ദർഭവുമായി യോജിക്കുന്നു; എണ്ണത്തിന്റെ വാക്യഘടനാപരമായ ബന്ധം അമിതമായി വിശദീകരിക്കാതിരിക്കാൻ എബ്രായക്രമത്തോടു ചേർന്ന രൂപം നിലനിർത്തി.
- source_word: הֶחָרָשׁ
  choice: ശില്പികൾ
  rationale: חרש പൊതുവായി വൈദഗ്ധ്യമുള്ള കരകൗശലത്തൊഴിലാളിയെയോ ശില്പിയെയോ സൂചിപ്പിക്കുന്നു; ഒരു പ്രത്യേക തൊഴിൽമേഖലയിലേക്ക് അർഥം ചുരുക്കിയിട്ടില്ല.
- source_word: הַמַּסְגֵּר
  choice: ലോഹപ്പണിക്കാർ
  rationale: ഈ പദം ഒരു പ്രത്യേക വൈദഗ്ധ്യമുള്ള തൊഴിലാളിവർഗത്തെ, സാധ്യതയോടെ ലോഹപ്പണിക്കാരെ, സൂചിപ്പിക്കുന്നു. കൃത്യമായ തൊഴിൽവിഭാഗം അനിശ്ചിതമായതിനാൽ അത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: לֹא נִשְׁאַר
  choice: ആരും ശേഷിച്ചില്ല
  rationale: നിഫ്അൽ രൂപത്തിന്റെ ‘പിന്നിൽ ശേഷിക്കുക’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: זוּלַת דַּלַּת עַם הָאָרֶץ
  choice: ദേശത്തെ ജനങ്ങളിൽ ഏറ്റവും ദരിദ്രരായവർ ഒഴികെ
  rationale: דלת ദരിദ്രരും സാമൂഹികമായി ദുർബലരുമായ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ഭാഗികത സൂചിപ്പിക്കുന്ന എബ്രായഘടന മലയാളത്തിൽ സംരക്ഷിച്ചു.
