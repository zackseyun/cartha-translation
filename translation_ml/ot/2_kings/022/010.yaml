  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגֵּ֞ד שָׁפָ֤ן הַ/סֹּפֵר֙ לַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר סֵ֚פֶר נָ֣תַן לִ֔/י חִלְקִיָּ֖ה הַ/כֹּהֵ֑ן וַ/יִּקְרָאֵ֥/הוּ שָׁפָ֖ן לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/010.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book.” And Shaphan read it before the king.
translation:
  language: ml
  text: 'അപ്പോൾ ലേഖകനായ ശാഫാൻ രാജാവിനെ ഇങ്ങനെ അറിയിച്ചു: “പുരോഹിതനായ ഹിൽക്കീയാവ് എനിക്ക് ഒരു പുസ്തകം[a] തന്നിരിക്കുന്നു.” തുടർന്ന് ശാഫാൻ അത് രാജാവിന്റെ സന്നിധിയിൽ വായിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു ചുരുൾ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദത്തിന് പൊതുവായി ഒരു ലിഖിതരേഖയെ സൂചിപ്പിക്കാം; അതിന്റെ ഭൗതികരൂപം ആ പദംതന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: അറിയിച്ചു
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു കാര്യം അറിയിക്കുക എന്ന അർഥത്തിലാണ്. രാജസദസ്സിലെ വിവരണത്തിന് യോജിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: הַסֹּפֵר
  choice: ലേഖകൻ
  rationale: סֹפֵר എന്നത് എഴുത്തുമായി ബന്ധപ്പെട്ട രാജകീയ ഉദ്യോഗസ്ഥനെയോ സെക്രട്ടറിയെയോ സൂചിപ്പിക്കാം. ചരിത്രപരമായ പദവിയുടെ വിശാലത നിലനിർത്തിക്കൊണ്ട് ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദമാണ് ‘ലേഖകൻ’.
- source_word: סֵפֶר
  choice: ഒരു പുസ്തകം
  rationale: סֵפֶר പൊതുവായി ഒരു ലിഖിതരേഖയെയോ പുസ്തകത്തെയോ സൂചിപ്പിക്കുന്നു; അതിന്റെ ഭൗതികരൂപം പദംതന്നെ നിർണയിക്കുന്നില്ല. ഹീബ്രുവിൽ നിർദ്ദിഷ്ടതയില്ലാത്തതിനാൽ ‘ഒരു’ ചേർത്തു.
- source_word: נָתַן לִי
  choice: എനിക്ക് ... തന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിക്ക് സംസാരസമയത്തുള്ള പ്രസക്തി ഹീബ്രു പൂർണക്രിയയിൽ പ്രകടമാണ്; ‘തന്നിരിക്കുന്നു’ അത് മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיִּקְרָאֵהוּ
  choice: അത് ... വായിച്ചു
  rationale: എഴുതപ്പെട്ട ഒരു വസ്തു കർമ്മമായി വരുമ്പോൾ קרא എന്നത് വായിക്കുക, സന്ദർഭത്തിൽ ശബ്ദമായി വായിക്കുക, എന്നാണ്. ‘രാജാവിന്റെ സന്നിധിയിൽ’ എന്ന തുടർപ്രയോഗം ശബ്ദമായി വായിച്ചതാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ സന്നിധിയിൽ
  rationale: ഒരാളുടെ മുമ്പാകെയോ സാന്നിധ്യത്തിലോ ഒരു പ്രവൃത്തി ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപമാണിത്.
- source_word: חִלְקִיָּה
  choice: ഹിൽക്കീയാവ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: שָׁפָן
  choice: ശാഫാൻ
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. പഴഞ്ചനായ ഔദ്യോഗിക പദങ്ങൾ ഒഴിവാക്കി, രാജസദസ്സിലെ ചരിത്രപരമായ പശ്ചാത്തലം നിലനിർത്താൻ ‘ലേഖകൻ’, ‘സന്നിധിയിൽ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. മൂലത്തിലെ വാക്യക്രമവും നേരിട്ടുള്ള ഉദ്ധരണിയും കഴിയുന്നത്ര വ്യക്തമായി സൂക്ഷിച്ചു.
