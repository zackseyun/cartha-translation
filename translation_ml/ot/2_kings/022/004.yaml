source:
  edition: WLC
  text: עֲלֵ֗ה אֶל חִלְקִיָּ֨הוּ֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וְ/יַתֵּ֣ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה אֲשֶׁ֥ר אָסְפ֛וּ שֹׁמְרֵ֥י הַ/סַּ֖ף מֵ/אֵ֥ת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/004.yaml
  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
translation:
  language: ml
  text: “മഹാപുരോഹിതനായ ഹിൽക്കീയാവിന്റെ അടുക്കലേക്കു കയറിച്ചെല്ലുക. യഹ്‌വേയുടെ ആലയത്തിലേക്കു കൊണ്ടുവന്നതും ഉമ്മരപ്പടിയുടെ കാവൽക്കാർ[a] ജനത്തിൽനിന്ന് ശേഖരിച്ചതുമായ വെള്ളി അദ്ദേഹം ആകെ കണക്കാക്കട്ടെ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വാതിൽകാവൽക്കാർ”; പദശഃ “ഉമ്മരപ്പടിയുടെ കാവൽക്കാർ.”
    reason: שֹׁמְרֵי הַסַּף എന്ന പ്രയോഗത്തിന്റെ പദശഃ രൂപവും പ്രവർത്തനപരമായ അർഥവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: עֲלֵה
  choice: കയറിച്ചെല്ലുക
  rationale: സ്ഥലപരമായ ഉയർച്ച സൂചിപ്പിക്കുന്ന Qal ആജ്ഞാരൂപത്തിന്റെ ദിശാസൂചന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חִלְקִיָּהוּ
  choice: ഹിൽക്കീയാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: മഹാപുരോഹിതൻ
  rationale: മുഖ്യ പുരോഹിതപദവിയെ സൂചിപ്പിക്കുന്ന മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: וְיַתֵּם
  choice: കണക്കാക്കി തിട്ടപ്പെടുത്തട്ടെ
  rationale: Hiphil രൂപം ഇവിടെ ആലയനിധിയിലെ വെള്ളി എണ്ണി ആകെ തുക ഉറപ്പാക്കുക എന്ന ഭരണപരമായ അർഥം നൽകുന്നു; 'കണക്കാക്കി തിട്ടപ്പെടുത്തുക' പൂർത്തീകരണഭാവവും ധനകാര്യസന്ദർഭവും സംരക്ഷിക്കുന്നു.
- source_word: הַכֶּסֶף
  choice: വെള്ളി
  rationale: പണമായി ഉപയോഗിച്ചിരുന്ന വെള്ളിയെയാണ് സൂചിപ്പിക്കുന്നത്; 'പണം' എന്നു വ്യാഖ്യാനിക്കാതെ മൂലപദത്തിന്റെ വസ്തുസൂചന നിലനിർത്തുന്നു.
- source_word: הַמּוּבָא
  choice: കൊണ്ടുവന്നത്
  rationale: Hophal കർമ്മണി പങ്കാളിത്തരൂപത്തിന്റെ അർഥം സ്വാഭാവികമായ ഭൂതകാലബന്ധത്തിൽ നൽകുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: സ്ഥാപിതമായ ആരാധനാലയസന്ദർഭത്തിൽ 'ആലയം' സ്വാഭാവികമാണ്; ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אָסְפוּ
  choice: ശേഖരിച്ചത്
  rationale: ജനത്തിൽനിന്നു ധനം സമാഹരിച്ച പൂർത്തിയായ പ്രവൃത്തിയെ ധനകാര്യസന്ദർഭത്തിന് യോജിച്ചവിധം വ്യക്തമാക്കുന്നു.
- source_word: שֹׁמְרֵי הַסַּף
  choice: ഉമ്മരപ്പടി കാവൽക്കാർ
  rationale: പദശഃ അർഥം പ്രധാനവാക്യത്തിൽ സംരക്ഷിക്കുന്നു; ഇവർ വാതിൽകാവൽക്കാരായിരുന്നെന്ന പ്രവർത്തനപരമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מֵאֵת הָעָם
  choice: ജനത്തിൽനിന്ന്
  rationale: മൂലത്തിലെ പൊതുവായ ജനസൂചന ചുരുക്കാതെയും വികസിപ്പിക്കാതെയും നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാൽ പകരാതെ നിലനിർത്തുന്നു; മലയാളത്തിൽ സാധാരണ ഗ്രഹിക്കാവുന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്നതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ധനകാര്യപ്രവർത്തനത്തെ സൂചിപ്പിക്കാൻ 'കണക്കാക്കി തിട്ടപ്പെടുത്തുക' ഉപയോഗിച്ചു; ശബ്ദാർഥവും സ്വാഭാവികതയും തമ്മിൽ സമതുലനം പാലിച്ചു.
