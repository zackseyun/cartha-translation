    issue: The main-text phrase ‘ഉമ്മരപ്പടി കാവൽക്കാർ’ lacks the genitive relationship expressed in the Hebrew construct phrase.
    rationale: שֹׁמְרֵי הַסַּף literally means ‘keepers of the threshold’; ‘ഉമ്മരപ്പടിയുടെ കാവൽക്കാർ’ represents this relationship clearly and naturally.
  - severity: low
