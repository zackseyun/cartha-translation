id: 2KI.22.16
reference: 2 Kings 22:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹֽשְׁבָ֑י/ו אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר קָרָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/016.yaml
  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
translation:
  language: ml
  text: 'യാഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘ഇതാ, ഞാൻ ഈ സ്ഥലത്തിന്മേലും അതിലെ നിവാസികളുടെമേലും അനർഥം[a] വരുത്തുന്നു—യെഹൂദാരാജാവ് വായിച്ച പുസ്തകത്തിലെ സകല വചനങ്ങളും.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദുരന്തം’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ധാർമിക തിന്മയെ അല്ല, ന്യായവിധിയായി വരുന്ന അനർഥത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതസൂത്രത്തിന്റെ ഗൗരവവും നേരിട്ടുള്ള ദൈവിക പ്രഖ്യാപനത്തിന്റെ സ്വരവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: הִנְנִי
  choice: ഇതാ
  rationale: പ്രഖ്യാപനത്തിന്റെ അടിയന്തരതയും ഗൗരവപൂർണമായ ശ്രദ്ധാകർഷണവും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵבִיא
  choice: വരുത്തുന്നു
  rationale: ഹീബ്രു കൃതന്തം സൂചിപ്പിക്കുന്ന ആസന്നവും ഉറപ്പുള്ളതുമായ പ്രവൃത്തിയെ മലയാള വർത്തമാനരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: רָעָה
  choice: അനർഥം
  rationale: ഇവിടെ ധാർമിക തിന്മയല്ല, ദൈവവിധിയായി വരുന്ന വിനാശകരമായ ദുരന്തമാണ് ഉദ്ദേശിക്കുന്നത്; ‘അനർഥം’ ആ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: ഈ സ്ഥലത്തിന്മേലും അതിലെ നിവാസികളിന്മേലും
  rationale: വിധി സ്ഥലത്തെയും അവിടെ പാർക്കുന്നവരെയും ലക്ഷ്യമാക്കുന്നു എന്ന ദിശാബോധം ഔപചാരികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: ഈ പുസ്തകത്തിലെ സകല വചനങ്ങളും അനുസരിച്ച്
  rationale: אֵת ഘടന വ്യാകരണപരമായി ദുഷ്കരവും പാഠപരമായി അസാധാരണവുമാണ്; പ്രഖ്യാപിച്ച പുസ്തകവചനങ്ങൾ ന്യായവിധിയിൽ നിറവേറുന്നു എന്ന സന്ദർഭബന്ധം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം തിരഞ്ഞെടുത്തു.
- source_word: אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവ് വായിച്ച
  rationale: ബന്ധവാക്യം ‘പുസ്തകത്തെ’ വിശേഷിപ്പിക്കുന്ന വിധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘ഉച്ചത്തിൽ വായിച്ച’ എന്നത് ഹീബ്രുവിൽ നിർബന്ധമായും വ്യക്തമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: רָעָה എന്ന ദൈവവിധിപദത്തിന്റെ വിവർത്തനം
  choice: അനർഥം
  alternative: തിന്മ; ദുരന്തം
  rationale: ഈ സന്ദർഭത്തിൽ യഹോവ വരുത്തുന്നത് ധാർമിക തിന്മയല്ല, നിയമലംഘനത്തിനുള്ള ന്യായവിധിയായ വിപത്താണ്. ‘അനർഥം’ ആ വ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പൊതുപദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: אֵת כָּל דִּבְרֵי הַסֵּפֶר എന്ന അസാധാരണ ഘടനയുടെ ബന്ധം
  choice: പുസ്തകത്തിലെ വചനങ്ങൾക്കനുസരിച്ച് അനർഥം വരുത്തുന്നു
  alternative: പുസ്തകത്തിലെ സകല വചനങ്ങളെയും വരുത്തുന്നു/നിറവേറ്റുന്നു
  rationale: אֵת സാധാരണ നേരിട്ടുള്ള കർമചിഹ്നമാണെങ്കിലും ‘വചനങ്ങൾ വരുത്തുന്നു’ എന്ന അക്ഷരാനുസൃത രൂപം മലയാളത്തിൽ അസ്പഷ്ടമാണ്. ഇവിടെ പുസ്തകത്തിലെ ന്യായവിധിവചനങ്ങൾ സംഭവമായി നിറവേറുന്നു എന്ന അർത്ഥം ഉദ്ദേശിക്കുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു; അതിനാൽ ബന്ധം വ്യക്തമാക്കി, ഉള്ളടക്കം അധികമായി നിർണ്ണയിക്കാതെ വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രവാചകശൈലി. ‘അരുളിച്ചെയ്യുന്നു’, ‘ഇതാ’, ‘സകല വചനങ്ങളും’ എന്നിവ ഉയർന്നെങ്കിലും സാധാരണ വായനക്കാർക്ക് പരിചിതമായ ബൈബിൾഭാഷ നിലനിർത്തുന്നു.
