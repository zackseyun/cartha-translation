id: 2KI.22.2
reference: 2 Kings 22:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ דָּוִ֣ד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
translation:
  language: ml
  text: അവൻ യഹോവയുടെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്തു. തന്റെ പിതാവായ ദാവീദിന്റെ[a] വഴിയിലൊക്കെയും നടന്നു; വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിഞ്ഞുമാറിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘തന്റെ പിതാവായ ദാവീദ്’ എന്നാണ്. ഇവിടെ ‘പിതാവ്’ എന്നത് പൂർവപിതാവ് അഥവാ രാജവംശത്തിന്റെ പിതാവ് എന്ന വിശാലമായ അർഥത്തിലാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: ശരിയായതു ചെയ്തു
  rationale: നാമവൽക്കരിക്കപ്പെട്ട വിശേഷണമായ הַיָּשָׁר-ന്റെ ധാർമിക വിലയിരുത്തൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കണ്ണുകളിൽ’ എന്നതിനുപകരം, ദൈവത്തിന്റെ വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവവും അർഥവും മലയാളത്തിലെ സ്വാഭാവികമായ ‘ദൃഷ്ടിയിൽ’ എന്ന പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവായ ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: വഴിയിലൊക്കെയും നടന്നു
  rationale: ജീവിതനടത്തത്തെ ഒരു വഴിയിലൂടെ നടക്കുന്നതായി അവതരിപ്പിക്കുന്ന മൂലപാഠത്തിലെ രൂപകം നിലനിർത്തുന്നു; ‘ഒക്കെയും’ സമ്പൂർണമായ അനുസരണത്തിന്റെ ആശയം നൽകുന്നു.
- source_word: דָּוִד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദിന്റെ
  rationale: ‘പിതാവ്’ എന്ന മൂലപദം സംരക്ഷിക്കുന്നു; ഇവിടെ അത് അടുത്ത പിതാവിനെയല്ല, പൂർവപിതാവിനെയോ രാജവംശത്തിന്റെ പിതാവിനെയോ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിഞ്ഞുമാറിയില്ല
  rationale: ശരിയായ വഴിയിൽനിന്ന് ഒരു ദിശയിലേക്കും വ്യതിചലിക്കാതിരുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗവും വഴിയുടെ രൂപകവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ ഒരു പദവിയല്ല, ദൈവത്തിന്റെ പ്രത്യേക നാമമാണ് നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ നാമത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: ദാവീദിനെ യോശീയാവിന്റെ ‘പിതാവ്’ എന്നു വിളിക്കുന്നത്
  choice: പിതാവ് എന്ന മൂലപ്രയോഗം നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശാലമായ അർഥം വ്യക്തമാക്കുന്നു
  alternative: പൂർവപിതാവ് എന്നു മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: രാജവംശപരമായ ബന്ധം പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സംരക്ഷിക്കുമ്പോഴും, ദാവീദ് യോശീയാവിന്റെ നേരിട്ടുള്ള പിതാവാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൃഷ്ടിയിൽ’, ‘വഴിയിലൊക്കെയും നടന്നു’, ‘തിരിഞ്ഞുമാറിയില്ല’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിലെ വിലയിരുത്തലും വഴിയുടെ രൂപകവും നിലനിർത്തുന്നു.
