source:
  edition: WLC
  text: ו/יתנ/ה עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים ב/בית יְהוָ֑ה וְ/יִתְּנ֣וּ אֹת֗/וֹ לְ/עֹשֵׂ֤י הַ/מְּלָאכָה֙ אֲשֶׁר֙ בְּ/בֵ֣ית יְהוָ֔ה לְ/חַזֵּ֖ק בֶּ֥דֶק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
translation:
  language: ml
  text: അവൻ അത് യാഹ്‌വേയുടെ ആലയത്തിൽ ചുമതലപ്പെടുത്തിയ പണിക്കാരുടെ കൈയിൽ ഏൽപ്പിക്കട്ടെ;[a] അവർ അത് യാഹ്‌വേയുടെ ആലയത്തിലുള്ള പണിക്കാർക്കു കൊടുക്കട്ടെ, ആലയത്തിന്റെ കേടുപാടുകൾ തീർക്കാൻ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അവൻ അത് പണിക്കാരുടെ കൈമേൽ കൊടുക്കട്ടെ.” ഇവിടെ ഉദ്ദേശിക്കുന്നത് അത് അവരുടെ ചുമതലയിൽ ഏൽപ്പിക്കുകയാണ്.'
    reason: lexical_alternative
  - marker: b
    text: “ആലയത്തിന്റെ കേടുപാടുകൾ തീർക്കാൻ” എന്നത് അക്ഷരാർഥത്തിൽ “ആലയത്തിന്റെ കേടുപാട് ബലപ്പെടുത്താൻ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתנה ... עַל יַד
  choice: അവൻ അത് ... കൈയിൽ ഏൽപ്പിക്കട്ടെ
  rationale: נתן എന്നത് അടിസ്ഥാനമായി ‘കൊടുക്കുക’ എന്നാണ്; എന്നാൽ עַל יַד എന്ന പ്രയോഗത്തോടൊപ്പം ഇവിടെ പണം ഒരാളുടെ നിയന്ത്രണത്തിലോ സംരക്ഷണത്തിലോ ഏൽപ്പിക്കുന്നതാണ് അർഥം. നിർദേശാത്മക ക്രിയാഭാവം ‘ഏൽപ്പിക്കട്ടെ’ എന്നു നൽകി.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: പണിക്കാർ / പണിചെയ്യുന്നവർ
  rationale: അക്ഷരാർഥത്തിൽ ‘പണി ചെയ്യുന്നവർ.’ ആവർത്തനത്തിൽ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് ആദ്യത്തേതിൽ ‘പണിക്കാർ’ എന്നും രണ്ടാമത്തേതിൽ ‘പണിചെയ്യുന്നവർ’ എന്നും നൽകി.
- source_word: הַמֻּפְקָדִים
  choice: ചുമതല ഏൽപ്പിക്കപ്പെട്ട
  rationale: פקד എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപത്തിലുള്ള നിഷ്ക്രിയഭാവം നിലനിർത്തുന്നു; അവരുടെ കൃത്യമായ ഔദ്യോഗിക പദവി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: בבית יהוה
  choice: യഹോവയുടെ ആലയത്തിൽ
  rationale: בית എന്നത് അക്ഷരാർഥത്തിൽ ‘വീട്’ ആണെങ്കിലും ഇവിടെ ദേവാലയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ‘ആലയം’ ഉപയോഗിച്ചു. יהוה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: ויתנו אתו
  choice: അവർ അത് ... കൊടുക്കട്ടെ
  rationale: נתן എന്ന ക്രിയയുടെ സാധാരണ അർഥവും ബഹുവചന നിർദേശാത്മക ഭാവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אשר בבית יהוה
  choice: യഹോവയുടെ ആലയത്തിൽ പണിചെയ്യുന്നവർ
  rationale: എബ്രായത്തിൽ ‘ആലയത്തിലുള്ളവർ’ എന്നാണ് അക്ഷരാർഥം; മുൻപുള്ള עֹשֵׂי הַמְּלָאכָה കാരണം ‘പണിചെയ്യുന്നവർ’ എന്നു പറയുന്നത് വ്യക്തവും സന്ദർഭസിദ്ധവുമാണ്.
- source_word: לחזק בדק הבית
  choice: ആലയത്തിനുണ്ടായ കേടുപാടുകൾ തീർക്കാൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘ആലയത്തിന്റെ കേട്/പൊട്ടൽ ബലപ്പെടുത്താൻ.’ കെട്ടിടത്തിന്റെ അറ്റകുറ്റപ്പണി സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘കേടുപാടുകൾ തീർക്കാൻ’ എന്നു നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ നിയമനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തി. മലയാള ബൈബിൾ വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ രൂപം ‘യഹോവ’ ആണ്; ‘യാഹ്‌വേ’ കൂടുതൽ സാധ്യതയുള്ള പണ്ഡിതോചിത ഉച്ചാരണരൂപമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ dignified, പൊതുവായ ബൈബിൾ ശൈലി. ‘ആലയം,’ ‘ചുമതല ഏൽപ്പിക്കപ്പെട്ട,’ ‘കേടുപാടുകൾ തീർക്കുക’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലഭാഷയിലെ ചുമതലാക്രമവും അറ്റകുറ്റപ്പണിയുടെ ആശയവും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
