  to: അവൻ അത് യാഹ്‌വേയുടെ ആലയത്തിൽ ചുമതലപ്പെടുത്തിയ പണിക്കാരുടെ കൈയിൽ ഏൽപ്പിക്കട്ടെ;[a] അവർ അത് യാഹ്‌വേയുടെ ആലയത്തിലുള്ള പണിക്കാർക്കു കൊടുക്കട്ടെ, ആലയത്തിന്റെ കേടുപാടുകൾ തീർക്കാൻ.[b]
