  text: לֶ/חָ֣רָשִׁ֔ים וְ/לַ/בֹּנִ֖ים וְ/לַ/גֹּֽדְרִ֑ים וְ/לִ/קְנ֤וֹת עֵצִים֙ וְ/אַבְנֵ֣י מַחְצֵ֔ב לְ/חַזֵּ֖ק אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/006.yaml
  text: for the craftsmen[a], and for the builders, and for the masons[c][b], and for buying timber and quarried stone to strengthen the house.
translation:
  language: ml
  text: ശില്പികൾക്കും കെട്ടിടപ്പണിക്കാർക്കും മതിൽ പണിയുന്നവർക്കും[c], മരവും ഖനിയിൽനിന്ന് എടുത്ത കല്ലുകളും[b] വാങ്ങുന്നതിനും, ഭവനത്തെ[a] ബലപ്പെടുത്തുന്നതിനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭത്തിൽ ‘ഭവനം’ എന്നത് യഹോവയുടെ ആലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cross_reference
  - marker: b
    text: അഥവാ ‘ചെത്തിയ കല്ല്’ / ‘വെട്ടിയ കല്ല്.’
    reason: lexical_alternative
  - marker: c
    text: മൂലപദം കൂടുതൽ അക്ഷരാർഥത്തിൽ മതിലുകളോ ചുറ്റുമതിലുകളോ പണിയുകയോ അറ്റകുറ്റം തീർക്കുകയോ ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחָרָשִׁים
  choice: ശില്പികൾക്കും
  rationale: חָרָשִׁים എന്നത് മരപ്പണിക്കാർക്കു മാത്രമല്ല, വിവിധ വൈദഗ്ധ്യമുള്ള തൊഴിലാളികൾക്കും ബാധകമാണ്; അതിനാൽ വിശാലമായ അർഥമുള്ള ‘ശില്പികൾ’ സ്വീകരിച്ചു.
- source_word: וְלַבֹּנִים
  choice: കെട്ടിടപ്പണിക്കാർക്കും
  rationale: בנה എന്ന ധാതുവിൽനിന്നുള്ള ഈ പദം പണിയുന്നവരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ തൊഴിൽപ്പട്ടികയുടെ പശ്ചാത്തലത്തിൽ ‘കെട്ടിടപ്പണിക്കാർ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְלַגֹּדְרִים
  choice: മതിൽ പണിയുന്നവർക്കും
  rationale: גדר എന്ന പദത്തിന്റെ അടിസ്ഥാനചിത്രം മതിലോ ചുറ്റുമതിലോ പണിയുകയോ അറ്റകുറ്റം തീർക്കുകയോ ചെയ്യുന്നതാണ്. പൊതുവായ ‘കൽപ്പണിക്കാർ’ എന്നതിനെക്കാൾ ഈ വിവർത്തനം മൂലപദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: וְלִקְנוֹת
  choice: വാങ്ങുന്നതിനും
  rationale: ל ചേർന്ന infinitive construct പണം വിനിയോഗിക്കുന്ന തുടർച്ചയായ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ‘വാങ്ങുന്നതിനും’ മുൻപുള്ള ദാതൃരൂപങ്ങളുമായി യോജിക്കുന്നു.
- source_word: עֵצִים
  choice: മരം
  rationale: നിർമാണസാമഗ്രികളുടെ പശ്ചാത്തലത്തിൽ ജീവിച്ചിരിക്കുന്ന വൃക്ഷങ്ങളല്ല, പണിക്കുള്ള മരമാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ ‘മരം’ സ്വാഭാവികമാണ്.
- source_word: וְאַבְנֵי מַחְצֵב
  choice: ഖനിയിൽനിന്നു വെട്ടിയെടുത്ത കല്ല്
  rationale: מַחְצֵב കല്ല് ഖനനം ചെയ്യുന്ന സ്ഥലത്തെയോ അവിടെനിന്നെടുത്ത കല്ലിനെയോ സൂചിപ്പിക്കുന്നു. ‘ഖനിയിൽനിന്നു വെട്ടിയെടുത്ത കല്ല്’ ആ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: לְחַזֵּק
  choice: ബലപ്പെടുത്താൻ
  rationale: חזק എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘ശക്തമാക്കുക/ബലപ്പെടുത്തുക’ എന്നതാണ്. അറ്റകുറ്റപ്പണി എന്ന സന്ദർഭാർഥം മാത്രം സ്വീകരിക്കാതെ മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തി.
- source_word: אֶת־הַבָּיִת
  choice: ഭവനം
  rationale: בַּיִת അക്ഷരാർഥത്തിൽ ‘വീട്/ഭവനം’ എന്നാണ്; സന്ദർഭത്തിൽ ഇത് യഹോവയുടെ ആലയത്തെ സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിൽ മൂലരൂപം നിലനിർത്തി അടിക്കുറിപ്പിൽ സൂചിതാർഥം വ്യക്തമാക്കി.
