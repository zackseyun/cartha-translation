translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, മുൻവാക്യത്തിലെ പണം നൽകുന്നതിനെ തുടർന്നുവരുന്ന ഉദ്ദേശ്യപ്പട്ടികയായ മൂലവാക്യഘടന നിലനിർത്തി. തൊഴിൽപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാനും സാങ്കേതിക കൃത്യത നഷ്ടപ്പെടാതിരിക്കാനും ശ്രദ്ധിച്ചു.
