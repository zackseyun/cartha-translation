id: 2KI.22.15
reference: 2 Kings 22:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/015.yaml
  text: 'And she said to them, “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: ml
  text: 'അവൾ അവരോടു പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ ഇപ്രകാരം പറയുന്നു: നിങ്ങളെ എന്റെ അടുക്കൽ അയച്ച ആ മനുഷ്യനോടു പറയുക:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶם
  choice: അവൾ അവരോടു പറഞ്ഞു
  rationale: ഹുൽദയുടെ മറുപടിയെ പരിചയപ്പെടുത്തുന്ന എബ്രായ ആഖ്യാനക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം പറയുന്നു
  rationale: പ്രവാചകസന്ദേശത്തിന്റെ പതിവു ദൂതസൂത്രം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; എബ്രായത്തിലെ perfect രൂപത്തെ മലയാളത്തിൽ ഭൂതകാലമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ ഉച്ചാരണസഹജമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: യഹ്‌വേ ആരാണെന്ന് സമാനാധികരണമായി വ്യക്തമാക്കുന്ന എബ്രായ construct ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִמְרוּ
  choice: പറയുക
  rationale: പ്രതിനിധിസംഘത്തോടുള്ള ബഹുവചന ആജ്ഞയാണ്; മലയാളത്തിൽ സംഖ്യ അടയാളപ്പെടുത്താത്ത സ്വാഭാവിക ആജ്ഞാരൂപം ഉപയോഗിക്കുന്നു.
- source_word: לָאִישׁ
  choice: ആ മനുഷ്യനോടു
  rationale: സന്ദർഭത്തിൽ ഒരു നിർദിഷ്ട പുരുഷനെ സൂചിപ്പിക്കുന്ന אִישׁ എന്ന പദം വ്യക്തമായി നിലനിർത്തുന്നു; മലയാളത്തിലെ ‘മനുഷ്യൻ’ ഇവിടെ പുരുഷലിംഗ ഏകവചനമാണ്.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: നിങ്ങളെ എന്റെ അടുക്കൽ അയച്ച
  rationale: ബന്ധവാക്യവും ഹുൽദയിലേക്കുള്ള ദിശയും കൃത്യമായി സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരം ചെയ്തു; ‘യഹ്‌വേ’ എന്ന രൂപം Yahweh എന്ന പുനർനിർമിത ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: אִישׁ എന്ന ലിംഗസൂചക നാമം
  choice: ആ മനുഷ്യൻ
  alternative: ആ വ്യക്തി
  rationale: എബ്രായപദം പുരുഷലിംഗ ഏകവചനമാണ്; സന്ദർഭത്തിലും അയച്ചയാൾ യോശീയാവ് രാജാവായതിനാൽ ലിംഗസൂചന നിഷ്പക്ഷമാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. പ്രവാചകസൂത്രത്തിന് ‘ഇപ്രകാരം പറയുന്നു’ ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തെ ഉദ്ധരണിയും വാക്യഘടനയും ഉദ്ദേശപൂർവം തുറന്ന നിലയിലാണ്.
