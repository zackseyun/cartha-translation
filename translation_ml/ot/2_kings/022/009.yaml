revisions:
- from: 'പിന്നെ ശാഫാൻ എന്ന എഴുത്തുകാരൻ രാജാവിന്റെ അടുക്കൽ വന്ന് രാജാവിനെ വിവരം അറിയിച്ചു: “അങ്ങയുടെ ദാസന്മാർ ആലയത്തിൽ കണ്ടെത്തിയ വെള്ളി പുറത്തെടുത്ത്[a] യഹ്‌വേയുടെ ആലയത്തിലെ പണിയുടെ ചുമതല ഏൽപ്പിക്കപ്പെട്ട തൊഴിലാളികളുടെ കൈയിൽ ഏൽപ്പിച്ചിരിക്കുന്നു[b].”'
  to: 'പിന്നെ ശാഫാൻ എന്ന എഴുത്തുകാരൻ രാജാവിന്റെ അടുക്കൽ വന്ന് രാജാവിനെ വിവരം അറിയിച്ചു: “അങ്ങയുടെ ദാസന്മാർ ആലയത്തിൽ കണ്ടെത്തിയ വെള്ളി പുറത്തെടുത്ത്[a] യഹ്‌വേയുടെ ആലയത്തിന്റെ മേൽനോട്ടത്തിനായി നിയമിക്കപ്പെട്ട തൊഴിലാളികളുടെ കൈയിൽ ഏൽപ്പിച്ചിരിക്കുന്നു[b].”'
