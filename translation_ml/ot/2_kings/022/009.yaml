source:
  edition: WLC
  text: וַ/יָּבֹ֞א שָׁפָ֤ן הַ/סֹּפֵר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֥שֶׁב אֶת הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֗אמֶר הִתִּ֤יכוּ עֲבָדֶ֨י/ךָ֙ אֶת הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֣א בַ/בַּ֔יִת וַֽ/יִּתְּנֻ֗/הוּ עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
translation:
  language: ml
  text: 'പിന്നെ ശാഫാൻ എന്ന എഴുത്തുകാരൻ രാജാവിന്റെ അടുക്കൽ വന്ന് രാജാവിനെ വിവരം അറിയിച്ചു: “അങ്ങയുടെ ദാസന്മാർ ആലയത്തിൽ കണ്ടെത്തിയ വെള്ളി പുറത്തെടുത്ത്[a] യഹ്‌വേയുടെ ആലയത്തിന്റെ മേൽനോട്ടത്തിനായി നിയമിക്കപ്പെട്ട തൊഴിലാളികളുടെ കൈയിൽ ഏൽപ്പിച്ചിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒഴിച്ചെടുത്തു”; എബ്രായക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ “ഒഴിച്ചു” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അവരുടെ കൈയിൽ വെച്ചിരിക്കുന്നു”; അതായത്, അവരുടെ ചുമതലയിൽ ഏൽപ്പിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: എഴുത്തുകാരൻ
  rationale: രാജസദസ്സിലെ എഴുത്തുകാരൻ/കാര്യദർശി എന്ന ഔദ്യോഗിക അർത്ഥം സന്ദർഭത്തിലുണ്ടെങ്കിലും, എബ്രായപദത്തിന്റെ അടിസ്ഥാനരൂപം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: വിവരം അറിയിച്ചു
  rationale: തിരികെ വിവരം നൽകുക എന്ന എബ്രായ ശൈലിയുടെ സന്ദർഭാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הִתִּיכוּ
  choice: പുറത്തെടുത്തു
  rationale: ശേഖരിച്ച വെള്ളി പാത്രത്തിൽനിന്നോ സംഭരണസ്ഥാനത്തുനിന്നോ ഒഴിച്ചെടുത്ത് കൈമാറുന്നതാണ് സന്ദർഭം; ഉരുക്കുക എന്ന ലോഹശാസ്ത്രാർഥം ഇവിടെ യോജിക്കുന്നില്ല. 'ഒഴിച്ചെടുത്തു' എന്ന കൂടുതൽ ദൃശ്യമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הַכֶּסֶף
  choice: വെള്ളി
  rationale: പണം എന്ന വിപുലാർഥം സാധ്യമെങ്കിലും, മൂലപദത്തിന്റെ 'വെള്ളി' എന്ന വ്യക്തമായ രൂപം നിലനിർത്തുന്നു.
- source_word: הַנִּמְצָא בַּבַּיִת
  choice: ആലയത്തിൽ കണ്ടെത്തിയ
  rationale: ഇവിടെ 'വീട്' എന്നത് യഹ്‌വേയുടെ ആലയത്തെയാണ് സന്ദർഭപരമായി സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ 'ആലയം' ഉപയോഗിച്ചു.
- source_word: וַיִּתְּנֻהוּ עַל יַד
  choice: കൈയിൽ ഏൽപ്പിച്ചിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിലെ 'കൈയിൽ വെക്കുക' എന്ന ദൃശ്യവും ചുമതലപ്പെടുത്തി കൈമാറുക എന്ന പ്രയോഗാർഥവും മലയാളത്തിൽ ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים
  choice: പണിയുടെ ചുമതല ഏൽപ്പിക്കപ്പെട്ട തൊഴിലാളികൾ
  rationale: പ്രവൃത്തി ചെയ്യുന്നവരെയും അവർക്ക് ഔദ്യോഗിക ചുമതല നൽകിയിരിക്കുന്നതെയും മൂലത്തിലെ നിഷ്ക്രിയഭാവത്തോടെ വ്യക്തമാക്കുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: ക്ഷേത്രസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം; 'വീട്' എന്ന അക്ഷരരൂപത്തേക്കാൾ ഉദ്ദേശ്യസ്ഥലം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ടെട്രഗ്രാമറ്റൺ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ, സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. രാജാവിനോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ “അങ്ങയുടെ” ഉപയോഗിച്ചു. മൂലത്തിലെ ഭരണകാര്യഭാഷ സ്വാഭാവികമാക്കിയെങ്കിലും വെള്ളി, കൈയിൽ ഏൽപ്പിക്കൽ, ചുമതലപ്പെടുത്തൽ എന്നീ പ്രധാന ദൃശ്യങ്ങളും ആശയങ്ങളും നിലനിർത്തി.
