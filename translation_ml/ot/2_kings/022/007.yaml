id: 2KI.22.7
reference: 2 Kings 22:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֚ךְ לֹא יֵחָשֵׁ֣ב אִתָּ֔/ם הַ/כֶּ֖סֶף הַ/נִּתָּ֣ן עַל יָדָ֑/ם כִּ֥י בֶ/אֱמוּנָ֖ה הֵ֥ם עֹשִֽׂים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/007.yaml
  text: But the silver that is put into their hands is not to be counted with them[b][a], for they are acting faithfully.
translation:
  language: ml
  text: എന്നാൽ അവരുടെ കൈയിൽ ഏൽപ്പിക്കുന്ന വെള്ളിയുടെ[a] കണക്ക് അവരോടു ചോദിക്കേണ്ടതില്ല[b]; കാരണം അവർ വിശ്വസ്തതയോടെയാണ് പ്രവർത്തിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പണത്തിന്റെ.” സാമ്പത്തികസന്ദർഭങ്ങളിൽ എബ്രായത്തിലെ “വെള്ളി” എന്ന പദം സാധാരണയായി പണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ആ വെള്ളി അവരോടൊപ്പം കണക്കാക്കേണ്ടതില്ല.” അതായത്, പണം കൈകാര്യം ചെയ്തവരിൽനിന്ന് കണക്ക് ആവശ്യപ്പെട്ടിരുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻ നിർദേശത്തിന് ഒരു ഒഴിവോ പരിധിയോ അവതരിപ്പിക്കുന്ന വിരുദ്ധബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֵחָשֵׁב אִתָּם
  choice: കണക്ക് അവരോടു ചോദിക്കേണ്ടതില്ല
  rationale: സാമ്പത്തികസന്ദർഭത്തിൽ നിഫാൽ രൂപം കണക്കു ബോധിപ്പിക്കുകയോ കണക്ക് ആവശ്യപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; അർത്ഥം വ്യക്തമാക്കിക്കൊണ്ട് എബ്രായത്തിലെ ഉത്തരവാദിത്വക്കണക്കിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: הַכֶּסֶף
  choice: വെള്ളി
  rationale: പദത്തിന്റെ അക്ഷരാർഥവും ചരിത്രപരമായ ഭാവവും നിലനിർത്തുന്നു; ഈ സാമ്പത്തികസന്ദർഭത്തിൽ അത് പണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: הַנִּתָּן עַל יָדָם
  choice: അവരുടെ കൈയിൽ ഏൽപ്പിക്കുന്ന
  rationale: അവർക്കു കൈമാറി ഭരമേൽപ്പിക്കുന്നതെന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവവും സന്ദർഭാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: കണക്ക് ചോദിക്കേണ്ടതില്ലെന്ന നിർദേശത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: בֶאֱמוּנָה
  choice: വിശ്വസ്തതയോടെ
  rationale: ഇവിടെ സിദ്ധാന്തപരമായ വിശ്വാസമല്ല, പെരുമാറ്റത്തിലെ വിശ്വാസ്യതയും സത്യസന്ധതയുമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: הֵם עֹשִׂים
  choice: അവർ ... പ്രവർത്തിക്കുന്നു
  rationale: അവർ ജോലി നിർവഹിക്കുകയും പണം കൈകാര്യം ചെയ്യുകയും ചെയ്യുന്ന രീതിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ വിവർത്തനം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ആദരണീയ മലയാളം. ‘വെള്ളി’ എന്ന മൂലപദം നിലനിർത്തിയിട്ട് സാമ്പത്തിക അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി; അസ്വാഭാവികമായ പദാനുപദരൂപത്തിന് പകരം ‘കണക്ക് ചോദിക്കുക’ എന്ന സ്വാഭാവിക ഭരണ-സാമ്പത്തിക പ്രയോഗം ഉപയോഗിച്ചു.
