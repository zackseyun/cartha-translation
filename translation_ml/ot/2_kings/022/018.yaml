id: 2KI.22.18
reference: 2 Kings 22:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְרֹ֣שׁ אֶת יְהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
translation:
  language: ml
  text: 'എന്നാൽ യഹോവയോട് ചോദിച്ചറിയാൻ നിങ്ങളെ അയച്ച യെഹൂദാരാജാവിനോട് നിങ്ങൾ ഇങ്ങനെ പറയണം: “ഇസ്രായേലിന്റെ ദൈവമായ യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘നീ കേട്ട വാക്കുകളെക്കുറിച്ച്—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീ കേട്ട വാക്കുകളെക്കുറിച്ച്—” എന്ന എബ്രായ ഉപവാക്യം ഇവിടെ അപൂർണമായി നിൽക്കുന്നു; അടുത്ത വാക്യത്തിലാണ് അത് പൂർത്തിയാകുന്നത്.
    reason: മൂലപാഠത്തിലെ തൂങ്ങിയ വാക്യഘടന വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וְאֶל
  choice: എന്നാൽ … രാജാവിനോട്
  rationale: മുൻവാക്യത്തിൽനിന്ന് യെഹൂദാരാജാവിലേക്കുള്ള വിഷയമാറ്റവും אֶל എന്നതിന്റെ ദിശാസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവ്
  rationale: എബ്രായ സംയുക്തപദപ്രയോഗത്തിന്റെ വ്യക്തവും മലയാളത്തിൽ സ്വാഭാവികവുമായ രൂപം.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: നിങ്ങളെ അയച്ച
  rationale: ആരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്ന വിശേഷണാത്മക കൃദന്തരൂപം ഭൂതകാല ആപേക്ഷികപ്രയോഗമായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: യഹോവയോട് ചോദിച്ചറിയാൻ
  rationale: ഈ പ്രവാചകീയ ആലോചനാസന്ദർഭത്തിൽ דרשׁ ദൈവഹിതം അന്വേഷിച്ചറിയുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ചോദിച്ചറിയാൻ’ അതിനെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: അവനോട് നിങ്ങൾ ഇങ്ങനെ പറയണം
  rationale: സന്ദേശം അറിയിക്കാനുള്ള നിർദേശത്തിന്റെ ബലവും כֹּה എന്നതിന്റെ സന്ദേശപരിചയപ്പെടുത്തൽ സ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകസന്ദേശത്തിന്റെ പതിവ് ദൂതസൂത്രം മാന്യവും പരിചിതവുമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: ഉടമസ്ഥബന്ധവും ഇസ്രായേലുമായുള്ള ദൈവത്തിന്റെ തിരിച്ചറിയലും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: നീ കേട്ട വാക്കുകളെക്കുറിച്ച്—
  rationale: അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന തൂങ്ങിയ വിഷയഘടന പരിഹരിക്കാതെ അതേ പ്രതീക്ഷാഭാവത്തോടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: അവസാന ഉപവാക്യത്തിന്റെ അപൂർണ ഘടന
  choice: ‘നീ കേട്ട വാക്കുകളെക്കുറിച്ച്—’ എന്ന തൂങ്ങിയ ഘടന നിലനിർത്തി
  alternative: അടുത്ത വാക്യത്തിലെ ആശയം ചേർത്ത് ഇവിടെത്തന്നെ വാക്യം പൂർത്തിയാക്കുക
  rationale: എബ്രായത്തിൽ ഈ വിഷയം അടുത്ത വാക്യത്തിലാണ് വ്യാകരണപരമായി പൂർത്തിയാകുന്നത്; അതിനാൽ ഈ വാക്യത്തിൽ ആശയബന്ധം മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പ്രവാചകസന്ദേശസൂത്രത്തിൽ ‘അരുളിച്ചെയ്യുന്നു’ എന്ന ബൈബിൾപരിചിതമായ ഔപചാരികപ്രയോഗം നിലനിർത്തിയെങ്കിലും ശേഷിച്ച വാക്യത്തിൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ള ഭാഷ ഉപയോഗിച്ചു.
