  variant: modern standard Malayalam
source:
  edition: WLC
  text: בֶּן שְׁמֹנֶ֤ה שָׁנָה֙ יֹאשִׁיָּ֣הוּ בְ/מָלְכ֔/וֹ וּ/שְׁלֹשִׁ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְדִידָ֥ה בַת עֲדָ֖יָה מִ/בָּצְקַֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/001.yaml
  text: Josiah was eight years old when he began to reign, and he reigned thirty-one years in Jerusalem. His mother’s name was Jedidah daughter of Adaiah, from Bozkath.
translation:
  language: ml
  text: യോശീയാവ് രാജാവായപ്പോൾ അവന് എട്ടു വയസ്സായിരുന്നു. അവൻ യെരൂശലേമിൽ മുപ്പത്തൊന്ന് വർഷം ഭരിച്ചു. അവന്റെ അമ്മയുടെ പേര് യെദീദാ എന്നായിരുന്നു; അവൾ ബൊസ്കത്തിൽനിന്നുള്ള അദായാവിന്റെ മകളായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה שָׁנָה
  choice: അവന് എട്ടു വയസ്സായിരുന്നു
  rationale: ‘എട്ടു വർഷത്തിന്റെ മകൻ’ എന്ന എബ്രായ പ്രയോഗം പ്രായം സൂചിപ്പിക്കുന്ന പതിവുശൈലിയാണ്; കൃത്യമായ പ്രായം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: בְמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: രാജാധികാരത്തിലേറിയ സമയത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം. ‘ഭരിക്കാൻ തുടങ്ങിയപ്പോൾ’ എന്നതിനെക്കാൾ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളമാണിത്.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: രാജപദവി വഹിച്ചതുമാത്രമല്ല, രാജാവായി ഭരണം നടത്തിയതും ക്രിയ സൂചിപ്പിക്കുന്നു.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: മുപ്പത്തൊന്ന് വർഷം
  rationale: എബ്രായത്തിലെ ‘മുപ്പതും ഒരു വർഷവും’ എന്ന എണ്ണൽരീതി അർഥനഷ്ടമില്ലാതെ സാധാരണ മലയാള സംഖ്യാരൂപത്തിൽ നൽകി.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: ഭരണത്തിന്റെ ആസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനവാചക പ്രയോഗം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് ... എന്നായിരുന്നു
  rationale: വംശാവലി-രാജവിവരണങ്ങളിൽ കാണുന്ന സൂത്രവാക്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തി.
- source_word: יְדִידָה
  choice: യെദീദാ
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
- source_word: בַת עֲדָיָה
  choice: അദായാവിന്റെ മകൾ
  rationale: പിതൃബന്ധം വ്യക്തമാക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥരൂപത്തിൽ നൽകി; വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: מִבָּצְקַת
  choice: ബൊസ്കത്തിൽനിന്നുള്ള
  rationale: מִן എന്ന ഉപസർഗം ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിന്നുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി; സ്ഥലനാമം ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ രാജവിവരണശൈലി ഉപയോഗിച്ചു. പേരുകൾ മൂല എബ്രായരൂപങ്ങളെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; വാക്യത്തിന്റെ വിവരക്രമവും കൃത്യമായ സംഖ്യകളും സംരക്ഷിച്ചു.
