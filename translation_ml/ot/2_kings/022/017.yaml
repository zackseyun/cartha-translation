  to: അവർ എന്നെ ഉപേക്ഷിക്കുകയും തങ്ങളുടെ കൈകളുടെ സകല പ്രവൃത്തികളാലും എന്നെ കോപിപ്പിക്കാനായി അന്യദേവന്മാർക്കു വഴിപാടുകൾ അർപ്പിക്കുകയും[a] ചെയ്തതുകൊണ്ട്, എന്റെ ഉഗ്രകോപം ഈ സ്ഥലത്തിനെതിരെ ജ്വലിച്ചിരിക്കുന്നു; അത് അണഞ്ഞുപോകുകയുമില്ല.
  rationale: അർഥപരമായ മാറ്റമൊന്നും ആവശ്യമായില്ല. കטר എന്ന ക്രിയയുമായി ബന്ധപ്പെട്ട ലെക്സിക്കൽ ബദൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നതിനായി അടിക്കുറിപ്പടയാളം ‘വഴിപാടുകൾ അർപ്പിക്കുകയും’ എന്നിടത്തേക്കു മാറ്റി.
