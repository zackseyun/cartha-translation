  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וְ/נִצְּתָ֧ה חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
translation:
  language: ml
  text: അവർ എന്നെ ഉപേക്ഷിക്കുകയും തങ്ങളുടെ കൈകളുടെ സകല പ്രവൃത്തികളാലും എന്നെ കോപിപ്പിക്കാനായി അന്യദേവന്മാർക്കു വഴിപാടുകൾ അർപ്പിക്കുകയും[a] ചെയ്തതുകൊണ്ട്, എന്റെ ഉഗ്രകോപം ഈ സ്ഥലത്തിനെതിരെ ജ്വലിച്ചിരിക്കുന്നു; അത് അണഞ്ഞുപോകുകയുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പ്രത്യേകമായി: ‘അന്യദേവന്മാർക്കു ധൂപം കത്തിച്ചു.’'
    reason: קטר എന്ന ക്രിയ ദഹിപ്പിച്ചുള്ള വഴിപാടിനെ സൂചിപ്പിക്കുന്നു; പല സന്ദർഭങ്ങളിലും അത് പ്രത്യേകിച്ച് ധൂപം കത്തിക്കുന്നതിനെയാണ് കുറിക്കുന്നത്.
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: ചെയ്തതുകൊണ്ട്
  rationale: ഈ എബ്രായ പ്രയോഗത്തിന്റെ കാരണസൂചകമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֲזָבוּנִי
  choice: അവർ എന്നെ ഉപേക്ഷിക്കുകയും
  rationale: עזב എന്ന പദത്തിന്റെ ബന്ധപരവും ഉടമ്പടിസംബന്ധവുമായ ഗൗരവം ‘ഉപേക്ഷിക്കുക’ നിലനിർത്തുന്നു.
- source_word: וַיְקַטְּרוּ
  choice: വഴിപാടുകൾ അർപ്പിക്കുകയും
  rationale: പീയേൽ രൂപത്തിലുള്ള קטר ദഹിപ്പിച്ചുള്ള ആരാധനാർപ്പണത്തെ സൂചിപ്പിക്കുന്നു; അത് എല്ലായിടത്തും ധൂപത്തിൽ മാത്രം പരിമിതമാണെന്ന് ഉറപ്പില്ലാത്തതിനാൽ പ്രധാനവാചകത്തിൽ വിശാലമായ പദം സ്വീകരിച്ചു.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാർക്കു
  rationale: യഹോവയല്ലാത്ത മറ്റു ദേവന്മാരെയാണ് പ്രയോഗം നേരിട്ട് സൂചിപ്പിക്കുന്നത്.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: എന്നെ കോപിപ്പിക്കാനായി
  rationale: ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന לְמַעַן എന്നതും ‘കോപത്തിനു പ്രേരിപ്പിക്കുക’ എന്ന הכעיס-ന്റെ ശക്തിയും സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  choice: തങ്ങളുടെ കൈകളുടെ സകല പ്രവൃത്തികളാലും
  rationale: വിഗ്രഹാരാധനാപരമായ മനുഷ്യനിർമിതികളെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയും അതിന്റെ വിമർശനധ്വനിയും നിലനിർത്തുന്നു.
- source_word: וְנִצְּתָה חֲמָתִי
  choice: എന്റെ ഉഗ്രകോപം ... ജ്വലിച്ചിരിക്കുന്നു
  rationale: חֵמָהയുടെ തീവ്രതയും יצת സൃഷ്ടിക്കുന്ന അഗ്നിരൂപകവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലത്തിനെതിരെ
  rationale: പദാനുപദമായി ‘ഈ സ്ഥലത്ത്’ എന്നായാലും, കോപത്തിന്റെ ന്യായവിധിപരമായ ലക്ഷ്യം മലയാളത്തിൽ ‘എതിരെ’ എന്നതിലൂടെ വ്യക്തമായി വരുന്നു.
- source_word: וְלֹא תִכְבֶּה
  choice: അത് അണഞ്ഞുപോകുകയുമില്ല
  rationale: മുൻപുള്ള ‘ജ്വലിച്ചിരിക്കുന്നു’ എന്ന അഗ്നിരൂപകത്തെ തുടർന്നുകൊണ്ട് ന്യായവിധിയുടെ അണയാത്ത സ്വഭാവം പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവകോപത്തെ മനുഷ്യവികാരഭാഷയിൽ അവതരിപ്പിക്കുന്നത്
  choice: ‘എന്നെ കോപിപ്പിക്കാനായി’, ‘എന്റെ ഉഗ്രകോപം’ എന്നീ വ്യക്തിപരമായ ഭാഷകൾ നിലനിർത്തി
  alternative: വ്യക്തിത്വരഹിതമായ ന്യായവിധിഭാഷയായി മൃദൂകരിക്കുക
  rationale: എബ്രായപാഠം ദൈവത്തിന്റെ ന്യായവിധിയെ ബന്ധപരവും വികാരാത്മകവുമായ ഭാഷയിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു; ആ സംഘർഷം മൃദൂകരിക്കാതെ നിലനിർത്തണം.
- issue: ദൈവിക ന്യായവിധിയുടെ അഗ്നിരൂപകം
  choice: ‘ജ്വലിച്ചിരിക്കുന്നു’, ‘അണഞ്ഞുപോകുകയുമില്ല’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ശിക്ഷ ഉറപ്പാണെന്ന വ്യാഖ്യാനാത്മക പ്രസ്താവന മാത്രം നൽകുക
  rationale: കോപം തീപോലെ ജ്വലിക്കുകയും അണയാതിരിക്കുകയും ചെയ്യുന്ന മൂലപാഠത്തിന്റെ രൂപകം പിന്നീടുള്ള പ്രത്യേക സിദ്ധാന്തങ്ങൾ ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘കൈകളുടെ സകല പ്രവൃത്തികൾ’, ‘ഉഗ്രകോപം ജ്വലിച്ചു’, ‘അണഞ്ഞുപോകുകയില്ല’ എന്നീ മൂലപാഠത്തിലെ മുഖ്യരൂപകങ്ങൾ നിലനിർത്തി.
