id: 2KI.22.3
reference: 2 Kings 22:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ שָׁלַ֣ח הַ֠/מֶּלֶךְ אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֤הוּ בֶן מְשֻׁלָּם֙ הַ/סֹּפֵ֔ר בֵּ֥ית יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: In the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
translation:
  language: ml
  text: 'യോശീയാ രാജാവിന്റെ പതിനെട്ടാം ഭരണവർഷത്തിൽ, രാജാവ് മെശുല്ലാമിന്റെ മകനായ അസല്യാവിന്റെ മകൻ ശാഫാൻ എന്ന എഴുത്തുകാരനെ യഹ്‌വേയുടെ ആലയത്തിലേക്ക്[a] അയച്ച് ഇങ്ങനെ പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘യഹ്‌വേയുടെ ഭവനത്തിലേക്ക്.’'
    reason: ‘ആലയം’ എന്ന സന്ദർഭോചിത പരിഭാഷയ്ക്കു പിന്നിലെ എബ്രായ രൂപകപ്രയോഗം സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וַיְהִי
  choice: —ത്തിൽ
  rationale: ഇത് പുതിയ സംഭവഘട്ടത്തിലേക്കുള്ള എബ്രായ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിൽ കൃത്രിമമായ ‘അപ്പോൾ സംഭവിച്ചതെന്തെന്നാൽ’ എന്ന പ്രയോഗത്തിനുപകരം കാലസൂചനയുള്ള വാക്യഘടനയിൽ അതിന്റെ ആഖ്യാനപ്രവാഹം സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: യോശീയാ രാജാവിന്റെ പതിനെട്ടാം ഭരണവർഷത്തിൽ
  rationale: രാജാവിന്റെ വാഴ്ച കണക്കാക്കുന്ന പതിവ് കാലനിർണ്ണയസൂത്രമാണിത്. ‘ഭരണവർഷം’ എന്ന് വ്യക്തമാക്കുന്നത് ആധുനിക വായനക്കാരന് അർഥം സുതാര്യമാക്കുന്നു.
- source_word: שָׁלַח הַמֶּלֶךְ
  choice: രാജാവ് … അയച്ച്
  rationale: മൂലപാഠത്തിൽ യോശീയാവിനെ പരാമർശിച്ചതിനു പിന്നാലെ ‘രാജാവ്’ എന്ന പദം ആവർത്തിക്കുന്നതിനാൽ ആ ആവർത്തനം നിലനിർത്തി. തുടർന്നുള്ള വാക്യത്തിലെ നേരിട്ടുള്ള നിർദേശവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘അയച്ച്’ എന്നു പ്രയോഗിച്ചു.
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ בֶן מְשֻׁלָּם
  choice: മെശുല്ലാമിന്റെ മകനായ അസല്യാവിന്റെ മകൻ ശാഫാൻ
  rationale: എബ്രായ വംശാവലിശൃംഖലയുടെ ബന്ധങ്ങൾ വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളക്രമം.
- source_word: הַסֹּפֵר
  choice: എഴുത്തുകാരൻ
  rationale: ഈ പദത്തിന് രാജകീയ കാര്യദർശി അഥവാ ലേഖകൻ എന്ന ഔദ്യോഗിക അർഥവും വരാം. എന്നാൽ സന്ദർഭം നിർബന്ധിക്കുന്നതിലധികം പ്രത്യേകത ചേർക്കാതിരിക്കാൻ വിശാലവും സുതാര്യവുമായ ‘എഴുത്തുകാരൻ’ സ്വീകരിച്ചു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: അക്ഷരാർഥം ‘യഹ്‌വേയുടെ ഭവനം’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ ദേവാലയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായ ‘ആലയം’ മുഖ്യപാഠത്തിൽ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അംഗീകരിക്കപ്പെട്ട മലയാള ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തി.
- source_word: לֵאמֹר
  choice: 'ഇങ്ങനെ പറഞ്ഞു:'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന സന്ദേശത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സംസാരസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; ഇതിലൂടെ പാഠത്തിലെ ഉടമ്പടിനാമത്തിന്റെ സ്വഭാവം നിലനിൽക്കുന്നു.
- issue: בֵּית יְהוָה എന്നതിലെ ‘ഭവനം/ആലയം’
  choice: യഹ്‌വേയുടെ ആലയം
  alternative: യഹ്‌വേയുടെ ഭവനം
  rationale: ‘ഭവനം’ അക്ഷരാർഥമാണെങ്കിലും ഇവിടെ ശലോമോന്റെ ദേവാലയമാണ് ഉദ്ദേശ്യം. വ്യാഖ്യാനപരമായ അധികവിശദീകരണം ചേർക്കാതെ ആ സന്ദർഭാർഥം വ്യക്തമാക്കുന്ന ‘ആലയം’ ഉപയോഗിക്കുകയും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. രാജഭരണകാല നിർണ്ണയം വ്യക്തമാക്കാൻ ‘ഭരണവർഷം’ ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ വായനയിൽ തിരിച്ചറിയാവുന്ന രൂപങ്ങളിൽ നൽകി; അനാവശ്യമായി പുരാതനമോ സഭാവിഭാഗസവിശേഷമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
