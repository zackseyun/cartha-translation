source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ חִלְקִיָּ֣הוּ הַ֠/כֹּהֵן וַ/אֲחִיקָ֨ם וְ/עַכְבּ֜וֹר וְ/שָׁפָ֣ן וַ/עֲשָׂיָ֗ה אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תִּקְוָ֗ה בֶּן חַרְחַס֙ שֹׁמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַֽ/יְדַבְּר֖וּ אֵלֶֽי/הָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
translation:
  language: ml
  text: അപ്പോൾ പുരോഹിതനായ ഹിൽക്കീയാവും അഹീക്കാമും അക്ബോരും ശാഫാനും അസായാവും പ്രവാചകിയായ ഹുൽദയുടെ അടുക്കൽ ചെന്നു. അവൾ വസ്ത്രങ്ങളുടെ സൂക്ഷിപ്പുകാരനായ ഹർഹസിന്റെ മകൻ തിക്വയുടെ മകൻ ശല്ലൂമിന്റെ ഭാര്യയായിരുന്നു. അവൾ യെരൂശലേമിലെ രണ്ടാം നഗരഭാഗത്ത്[a] താമസിച്ചിരുന്നു; അവർ അവളോടു സംസാരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രണ്ടാം ജില്ലയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം യെരൂശലേമിലെ ഒരു പ്രത്യേക ഭാഗത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അപ്പോൾ ... ചെന്നു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ ‘അപ്പോൾ’ സ്വാഭാവികമായി സംഭവക്രമം അറിയിക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: എബ്രായപാഠത്തിൽ ‘മഹാപുരോഹിതൻ’ എന്നല്ല, ‘പുരോഹിതൻ’ എന്നു മാത്രമാണ്; അതിനാൽ സന്ദർഭത്തിൽനിന്ന് ഉയർന്ന പദവി ചേർത്തിട്ടില്ല.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: പ്രവാചകിയായ ഹുൽദ
  rationale: മൂലപദം സ്ത്രീലിംഗമാണ്; ‘പ്രവാചകി’ അതിനെ വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: שֹׁמֵר הַבְּגָדִים
  choice: വസ്ത്രങ്ങളുടെ സൂക്ഷിപ്പുകാരൻ
  rationale: ‘വസ്ത്രങ്ങൾ സൂക്ഷിക്കുന്നവൻ’ എന്ന പദാർത്ഥം ഔദ്യോഗിക ചുമതലയുടെ സാധ്യത അനാവശ്യമായി വിപുലീകരിക്കാതെ നേരിട്ട് നൽകുന്നു.
- source_word: וְהִיא יֹשֶׁבֶת
  choice: അവൾ ... താമസിച്ചിരുന്നു
  rationale: יָשַׁב ഇവിടെ ഇരിക്കുക എന്നതിലുപരി ഒരു സ്ഥലത്ത് വസിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: בַּמִּשְׁנֶה
  choice: രണ്ടാം പ്രദേശത്ത്
  rationale: യെരൂശലേമിലെ ഒരു പ്രത്യേക ഭാഗത്തെയോ ജില്ലയെയോ സൂചിപ്പിക്കുന്ന സ്ഥലനാമസദൃശ പ്രയോഗമായി വായിക്കുന്നു; കൃത്യമായ സ്വഭാവം അനിശ്ചിതമായതിനാൽ കുറിപ്പിൽ മറ്റൊരു സാധ്യത നൽകുന്നു.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  choice: അവർ അവളോടു സംസാരിച്ചു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയെയോ സംഭാഷണത്തെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ഹിൽക്കീയാവിന്റെ പദവി ഉയർത്തിക്കാണിക്കണമോ
  choice: പുരോഹിതൻ
  alternative: മഹാപുരോഹിതൻ
  rationale: ഈ വാക്യം പറയുന്നതു മാത്രം പിന്തുടർന്ന്, മറ്റു സന്ദർഭങ്ങളിൽനിന്നോ പാരമ്പര്യത്തിൽനിന്നോ ‘മഹാ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
- issue: ഹുൽദയുടെ പ്രവാചകപദവിയിലെ സ്ത്രീലിംഗം
  choice: പ്രവാചകി
  alternative: പ്രവാചകൻ
  rationale: എബ്രായരൂപം വ്യക്തമായി സ്ത്രീലിംഗമായതിനാൽ അതു മലയാളത്തിലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പേരുകളുടെ വംശാവലിബന്ധം വ്യക്തമായി നിലനിർത്തിയിട്ടുണ്ട്; പദവികളും സ്ഥലസൂചനയും മൂലപാഠത്തേക്കാൾ നിർദ്ദിഷ്ടമാക്കിയിട്ടില്ല.
