  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് പുരോഹിതനായ ഹിൽക്കീയാവിനോടും[a] ശാഫാന്റെ മകനായ അഹീക്കാമിനോടും മീഖായാവിന്റെ മകനായ അഖ്ബോരിനോടും ലേഖകനായ ശാഫാനോടും[b] രാജാവിന്റെ സേവകനായ അസായാവിനോടും[c] ഇങ്ങനെ കല്പിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠത്തിൽ ‘പുരോഹിതനായ ഹിൽക്കീയാവ്’ എന്നാണ്; ‘മഹാപുരോഹിതൻ’ എന്ന് വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കാര്യദർശിയായ ശാഫാൻ.’ ഹീബ്രുപദം ഒരു ലേഖകനെയോ ഭരണകാര്യദർശിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘രാജാവിന്റെ ഉദ്യോഗസ്ഥനായ അസായാവ്.’ ഹീബ്രുവിൽ അക്ഷരാർഥം ‘സേവകൻ’ എന്നാണ്; രാജസഭാ പശ്ചാത്തലത്തിൽ രാജസേവനത്തിലുള്ള ഒരു ഉദ്യോഗസ്ഥനെയും ഈ പദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ രാജകീയ അധികാരഭാവം വ്യക്തമായി നിലനിർത്തുകയും ഭൂതകാല ആഖ്യാനത്തിന് സ്വാഭാവികമായ മലയാളരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിതനാമത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: חִלְקִיָּה הַכֹּהֵן
  choice: പുരോഹിതനായ ഹിൽക്കീയാവ്
  rationale: ഹീബ്രുവിൽ ‘പുരോഹിതൻ’ എന്നേ ഉള്ളൂ; ‘മഹാപുരോഹിതൻ’ എന്ന ഉയർന്ന പദവി ഈ വാക്യത്തിൽ പ്രകടമായി പറയുന്നില്ല.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: ശാഫാന്റെ മകനായ അഹീക്കാം
  rationale: בן എന്ന ബന്ധസൂചന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: עַכְבּוֹר בֶּן מִיכָיָה
  choice: മീഖായാവിന്റെ മകനായ അഖ്ബോർ
  rationale: വ്യക്തിനാമങ്ങളെ ഹീബ്രു രൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാവുന്ന ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: שָׁפָן הַסֹּפֵר
  choice: രാജലേഖകനായ ശാഫാൻ
  rationale: രാജസഭാ പശ്ചാത്തലത്തിൽ סֹפֵר എഴുത്തും ഭരണകാര്യങ്ങളും നിർവഹിക്കുന്ന ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കാം; ‘രാജലേഖകൻ’ ഈ പശ്ചാത്തലം ചുരുക്കമായി വ്യക്തമാക്കുന്നു.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: രാജാവിന്റെ സേവകനായ അസായാവ്
  rationale: עֶבֶד എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘സേവകൻ’ നിലനിർത്തുന്നു; രാജസഭയിൽ ഇത് ഒരു ഔദ്യോഗിക സ്ഥാനത്തെയും സൂചിപ്പിക്കാം.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന കല്പനയുടെ ഉള്ളടക്കത്തിലേക്ക് സ്വാഭാവികമായി നയിക്കുന്ന മലയാള പ്രയോഗം; ഹീബ്രുവിലെ ‘പറഞ്ഞുകൊണ്ട്/പറയാൻ’ എന്ന അവതാരകപ്രയോഗത്തിന്റെ പ്രവർത്തനം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഹിൽക്കീയാവിന്റെ പുരോഹിതപദവി
  choice: പുരോഹിതൻ
  alternative: മഹാപുരോഹിതൻ
  rationale: സന്ദർഭത്തിൽ അദ്ദേഹം മുഖ്യ പുരോഹിതനായിരിക്കാമെങ്കിലും ഈ വാക്യത്തിലെ הַכֹּהֵן എന്ന പദം ‘മഹാപുരോഹിതൻ’ എന്ന് വ്യക്തമായി പറയുന്നില്ല; അതിനാൽ പാഠത്തിലുള്ള പരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. വ്യക്തികളുടെ പട്ടികയിലെ ആവർത്തിത ബന്ധം ‘-നോടും’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു. അടുത്ത വാക്യത്തിലേക്ക് കല്പനയുടെ ഉള്ളടക്കം തുടരുമെന്നത് അവസാനത്തെ ദ്വിബിന്ദുവിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു.
