source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/פְּנֵ֣י יְהוָ֗ה בְּֽ/שָׁמְעֲ/ךָ֡ אֲשֶׁ֣ר דִּבַּרְתִּי֩ עַל הַ/מָּק֨וֹם הַ/זֶּ֜ה וְ/עַל יֹשְׁבָ֗י/ו לִ/הְי֤וֹת לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֔ה וַ/תִּקְרַע֙ אֶת בְּגָדֶ֔י/ךָ וַ/תִּבְכֶּ֖ה לְ/פָנָ֑/י וְ/גַ֧ם אָנֹכִ֛י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: ml
  text: “നിന്റെ ഹൃദയം മൃദുവായിരുന്നു; ഈ സ്ഥലത്തിനും അതിലെ നിവാസികൾക്കും എതിരായി, അവർ നാശാവശിഷ്ടവും[a] ശാപവും ആകുമെന്ന് ഞാൻ പറഞ്ഞതു നീ കേട്ടപ്പോൾ, നീ യഹ്‌വെയുടെ മുമ്പാകെ നിന്നെത്തന്നെ താഴ്ത്തി; നിന്റെ വസ്ത്രങ്ങൾ കീറി എന്റെ മുമ്പാകെ കരഞ്ഞു. അതുകൊണ്ട് ഞാനും കേട്ടിരിക്കുന്നു,” എന്ന് യഹ്‌വെ അരുളിച്ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭീതിവിസ്മയത്തിന്റെ വസ്തുവും ശാപവും.’ എബ്രായപദം שַׁמָּה ന്യായവിധിയുടെ സന്ദർഭങ്ങളിൽ നാശാവസ്ഥ, ഭീതി, അല്ലെങ്കിൽ വിസ്മയത്തിന്റെ വസ്തു എന്ന ആശയം സൂചിപ്പിക്കാം.
    reason: שַׁמָּה എന്ന പദത്തിന്റെ സന്ദർഭാനുസൃതമായ അർഥവൈവിധ്യം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: יַעַן
  choice: …തിനാലും …തിനാലും
  rationale: ദൈവിക പ്രതികരണത്തിന്റെ കാരണങ്ങൾ അവതരിപ്പിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ സമാന്തര കാരണവാക്യങ്ങളായി നിലനിർത്തുന്നു.
- source_word: רַךְ לְבָבְךָ
  choice: നിന്റെ ഹൃദയം മൃദുവായതിനാൽ
  rationale: ബലഹീനതയല്ല, ഉള്ളിലെ ആർദ്രതയും പ്രതികരണസന്നദ്ധതയും സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: וַתִּכָּנַע
  choice: നീ നിന്നെത്തന്നെ താഴ്ത്തി
  rationale: ദൈവസന്നിധിയിൽ സ്വമേധയാ വിനയപ്പെട്ടതിന്റെ ആത്മവാചകഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: מִפְּנֵי יְהוָה
  choice: യഹ്‌വെയുടെ മുമ്പാകെ
  rationale: ദൈവസന്നിധിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר דִּבַּרְתִּי עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: ഈ സ്ഥലവും അതിലെ നിവാസികളും … ആകുമെന്ന് ഞാൻ പറഞ്ഞത്
  rationale: ന്യായവിധിയുടെ പ്രഖ്യാപനം സ്ഥലത്തെയും നിവാസികളെയും സംബന്ധിക്കുന്നതാണെന്ന് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
  choice: ശൂന്യതയ്ക്കും ശാപത്തിനും പാത്രമാകുക
  rationale: വിധിയുടെ ഫലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുമ്പോൾ שַׁמָּה എന്ന പദത്തിന്റെ മുഖ്യസാധ്യതയായ നാശശൂന്യത നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: നിന്റെ വസ്ത്രങ്ങൾ കീറി
  rationale: ദുഃഖത്തിന്റെയും അനുതാപത്തിന്റെയും പരമ്പരാഗത ബാഹ്യചിഹ്നം നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: וַתִּבְכֶּה לְפָנָי
  choice: എന്റെ മുമ്പാകെ കരഞ്ഞു
  rationale: ദൈവസന്നിധിയിലെ ദുഃഖവും അനുതാപവും ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: ഞാനും കേട്ടിരിക്കുന്നു
  rationale: എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ‘പ്രാർഥന’യോ ‘അപേക്ഷ’യോ ചേർക്കാതെ ദൈവത്തിന്റെ പ്രത്യുത്തരം സൂചിപ്പിക്കുന്ന അർത്ഥസാന്ദ്രത നിലനിർത്തുന്നു.
- source_word: נְאֻם יְהוָה
  choice: എന്ന് യഹ്‌വെ അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകീയ പ്രഖ്യാപനസൂത്രത്തിന്റെ ഗൗരവം ആധുനിക മാനക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളലിപിയിൽ പ്രതിലിപീകരിക്കുന്നു.
- issue: ദൈവം ‘കേട്ടത്’ എന്തെന്ന ചോദ്യം
  choice: കർമം ചേർക്കാതെ ‘ഞാനും കേട്ടിരിക്കുന്നു’
  alternative: ഞാൻ നിന്റെ അപേക്ഷയും കേട്ടിരിക്കുന്നു
  rationale: സന്ദർഭം യോശീയാവിന്റെ പ്രതികരണത്തെ സൂചിപ്പിച്ചാലും എബ്രായപാഠം കർമം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ പ്രാർഥനയോ അപേക്ഷയോ എന്ന് നിർണ്ണയിക്കാതെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ച കാരണഘടന ‘…തിനാലും’ എന്ന സമാന്തരരൂപത്തിൽ നിലനിർത്തി. ദൈവനാമം ‘യഹ്‌വെ’ എന്ന് പ്രതിലിപീകരിച്ചു; വ്യക്തമല്ലാത്ത കർമം വ്യാഖ്യാനിച്ച് ചേർത്തിട്ടില്ല.
