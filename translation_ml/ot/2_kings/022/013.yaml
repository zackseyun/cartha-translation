  to: “പോകുവിൻ; എനിക്കുവേണ്ടിയും ജനത്തിനുവേണ്ടിയും മുഴുവൻ യെഹൂദയ്ക്കുവേണ്ടിയും, കണ്ടെത്തിയ ഈ പുസ്തകത്തിലെ വചനങ്ങളെക്കുറിച്ച് യഹ്‌വേയോടു ചോദിച്ചറിയുവിൻ[a]. നമ്മുടെ പിതാക്കന്മാർ[b] ഈ പുസ്തകത്തിലെ വചനങ്ങൾ ശ്രദ്ധിച്ചു കേൾക്കാതിരുന്നതുകൊണ്ട്, നമ്മെക്കുറിച്ച് എഴുതിയിരിക്കുന്ന സകലത്തിനും അനുസരിച്ച് പ്രവർത്തിക്കേണ്ടതിന്, നമുക്കെതിരെ ജ്വലിച്ചിരിക്കുന്ന യഹ്‌വേയുടെ ക്രോധം വലുതാണ്.”
