source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֣/י וּ/בְעַד הָ/עָ֗ם וּ/בְעַד֙ כָּל יְהוּדָ֔ה עַל דִּבְרֵ֛י הַ/סֵּ֥פֶר הַ/נִּמְצָ֖א הַ/זֶּ֑ה כִּֽי גְדוֹלָ֞ה חֲמַ֣ת יְהוָ֗ה אֲשֶׁר הִיא֙ נִצְּתָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹֽא שָׁמְע֜וּ אֲבֹתֵ֗י/נוּ עַל דִּבְרֵי֙ הַ/סֵּ֣פֶר הַ/זֶּ֔ה לַ/עֲשׂ֖וֹת כְּ/כָל הַ/כָּת֥וּב עָלֵֽי/נוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
translation:
  language: ml
  text: “പോകുവിൻ; എനിക്കുവേണ്ടിയും ജനത്തിനുവേണ്ടിയും മുഴുവൻ യെഹൂദയ്ക്കുവേണ്ടിയും, കണ്ടെത്തിയ ഈ പുസ്തകത്തിലെ വചനങ്ങളെക്കുറിച്ച് യഹ്‌വേയോടു ചോദിച്ചറിയുവിൻ[a]. നമ്മുടെ പിതാക്കന്മാർ[b] ഈ പുസ്തകത്തിലെ വചനങ്ങൾ ശ്രദ്ധിച്ചു കേൾക്കാതിരുന്നതുകൊണ്ട്, നമ്മെക്കുറിച്ച് എഴുതിയിരിക്കുന്ന സകലത്തിനും അനുസരിച്ച് പ്രവർത്തിക്കേണ്ടതിന്, നമുക്കെതിരെ ജ്വലിച്ചിരിക്കുന്ന യഹ്‌വേയുടെ ക്രോധം വലുതാണ്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേയെ അന്വേഷിക്കുവിൻ” അല്ലെങ്കിൽ “യഹ്‌വേയോടു ആലോചന ചോദിക്കുവിൻ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ ദൈവത്തെ പൊതുവായി അന്വേഷിക്കുന്നതിനെയും അവനിൽനിന്ന് മാർഗനിർദേശം ചോദിക്കുന്നതിനെയും സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ ഔപചാരികമായ അന്വേഷണം ഉദ്ദേശിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നമ്മുടെ പൂർവികർ.” എബ്രായപദം അക്ഷരാർഥത്തിൽ “നമ്മുടെ പിതാക്കന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: യഹ്‌വേയോട് അരുളപ്പാട് ചോദിക്കുവിൻ
  rationale: ദൈവത്തിൽനിന്ന് മാർഗനിർദേശമോ അരുളപ്പാടോ ഔപചാരികമായി അന്വേഷിക്കുന്നതാണ് സന്ദർഭം. ‘അരുളപ്പാട് ചോദിക്കുക’ എന്ന പ്രയോഗം ആ പ്രത്യേക അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പൊതുവായ ഭക്തിപരമായ ‘അന്വേഷിക്കുക’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ യ്ഹ്‌വ്ഹ് ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ പേരായിത്തന്നെ മലയാളലിപിയിൽ നൽകുന്നു.
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל־יְהוּדָה
  choice: എനിക്കുവേണ്ടിയും ജനത്തിനുവേണ്ടിയും മുഴുവൻ യെഹൂദയ്ക്കുവേണ്ടിയും
  rationale: בְּעַד ഇവിടെ പ്രതിനിധിത്വത്തെയോ മറ്റൊരാൾക്കുവേണ്ടിയുള്ള അന്വേഷണത്തെയോ സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന ‘വേണ്ടിയും’ മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: עַל דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה
  choice: കണ്ടെത്തിയ ഈ പുസ്തകത്തിലെ വചനങ്ങളെക്കുറിച്ച്
  rationale: ‘വചനങ്ങൾ’ എന്നത് എഴുത്തിലെ പ്രസ്താവനകളിലേക്കുള്ള ശ്രദ്ധ സൂക്ഷിക്കുന്നു; പങ്കാളിക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ ‘കണ്ടെത്തിയ’ എന്നു നൽകുന്നു.
- source_word: חֲמַת יְהוָה
  choice: യഹ്‌വേയുടെ ക്രോധം
  rationale: חֵמָה ശക്തവും ന്യായവിധിപരവുമായ കോപത്തെ സൂചിപ്പിക്കുന്നു; ‘ക്രോധം’ അതിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: נִצְּתָה בָנוּ
  choice: നമ്മുടെ നേരെ ജ്വലിച്ചിരിക്കുന്ന
  rationale: יצת എന്ന ക്രിയയിലെ തീപിടിപ്പിക്കപ്പെടുക, ജ്വലിക്കുക എന്ന രൂപകം നിലനിർത്തുകയും בָנוּ എന്നതിന്റെ പ്രതികൂല ദിശ ‘നമ്മുടെ നേരെ’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  choice: നമ്മുടെ പിതാക്കന്മാർ ... ശ്രദ്ധിച്ചുകേൾക്കാതിരുന്നതുകൊണ്ട്
  rationale: שׁמע കേൾക്കലിനൊപ്പം അനുസരണവും ഉൾക്കൊള്ളാം. ‘ശ്രദ്ധിച്ചുകേൾക്കുക’ കേൾവിയുടെ അർഥം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള ‘ചെയ്യേണ്ടതിന്’ അനുസരണത്തിന്റെ വശം വ്യക്തമാക്കുന്നു.
- source_word: לַעֲשׂוֹת כְּכָל־הַכָּתוּב
  choice: അതിൽ ... എഴുതിയിരിക്കുന്നതെല്ലാം ചെയ്യേണ്ടതിന്
  rationale: לַעֲשׂוֹת എന്ന ലക്ഷ്യാർഥവും כְּכָל എന്ന സമഗ്രതയും മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു. ‘അതിൽ’ പുസ്തകത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: עָלֵינוּ
  choice: നമ്മെക്കുറിച്ച്
  rationale: എഴുതിയിരിക്കുന്നത് ഇപ്പോഴത്തെ സമൂഹത്തിന് ബാധകമാണെന്ന അർഥം നിലനിർത്തുന്നു; അത് ‘നമുക്കുവേണ്ടി’യോ ‘നമുക്കെതിരെ’യോ എന്ന് അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാൽ പകരാതെ പേരായി നിലനിർത്തുന്നു.
- issue: אֲבֹתֵינוּ എന്ന പുരുഷലിംഗ ബഹുവചനത്തിന്റെ അവതരണം
  choice: നമ്മുടെ പിതാക്കന്മാർ
  alternative: നമ്മുടെ പൂർവികർ
  rationale: മൂലത്തിലെ വ്യക്തമായ പുരുഷലിംഗ പരാമർശം മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുന്നു; കൂടുതൽ ലിംഗനിരപേക്ഷമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: עָלֵינוּ എന്നതിന്റെ പ്രയോഗപരിധി
  choice: നമ്മെക്കുറിച്ച്
  alternative: നമുക്കെതിരെ; നമുക്കുവേണ്ടി
  rationale: സന്ദർഭം ന്യായവിധിയെ സൂചിപ്പിച്ചാലും, ഈ മുൻവിന്യാസം സ്വതവേ കൂടുതൽ വ്യാപകമാണ്. അതിനാൽ ദിശ അനാവശ്യമായി നിർണയിക്കാതെ സമൂഹത്തിനുള്ള ബാധകത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രാജകീയ കല്പനയുടെ ബഹുവചനരൂപം ‘പോകുവിൻ ... ചോദിക്കുവിൻ’ എന്നു നിലനിർത്തി. നീണ്ട എബ്രായ വാക്യത്തിന്റെ കാരണം–ഫലം ബന്ധം മലയാളത്തിൽ വ്യക്തമായി വരാൻ വാക്യക്രമം സ്വാഭാവികമാക്കി; എന്നാൽ ആവർത്തനവും ദൈവക്രോധത്തിന്റെ തീരൂപകവും സംരക്ഷിച്ചു.
