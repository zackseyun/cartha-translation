  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
translation:
  language: ml
  text: “അതുകൊണ്ട് ഇതാ, ഞാൻ നിന്നെ നിന്റെ പിതാക്കന്മാരോടു ചേർക്കും; നീ നിന്റെ കല്ലറകളിൽ സമാധാനത്തിൽ[a] അടക്കം ചെയ്യപ്പെടും. ഞാൻ ഈ സ്ഥലത്തിന്മേൽ വരുത്തുന്ന സകല അനർഥവും നിന്റെ കണ്ണുകൾ കാണുകയില്ല.” അവർ രാജാവിന് ഈ സന്ദേശം കൊണ്ടുചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
