  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ הַ/מֶּ֔לֶךְ אֶת דִּבְרֵ֖י סֵ֣פֶר הַ/תּוֹרָ֑ה וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/011.yaml
  text: And when the king heard the words of the Book of the Law[a], he tore his clothes.
translation:
  language: ml
  text: രാജാവ് ന്യായപ്രമാണപുസ്തകത്തിന്റെ[a] വാക്കുകൾ കേട്ടപ്പോൾ തന്റെ വസ്ത്രങ്ങൾ കീറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായപ്രമാണച്ചുരുളിന്റെ.’ എബ്രായത്തിലെ סֵפֶר എന്ന പദം എഴുതപ്പെട്ട ഒരു ചുരുളിനെയോ പുസ്തകരൂപത്തിലുള്ള രേഖയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: וַיְהִי ആഖ്യാനത്തിന്റെ പുരോഗതി സൂചിപ്പിക്കുകയും כִּ + infinitive construct സമയസാഹചര്യം രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു. മലയാളത്തിൽ ‘കേട്ടപ്പോൾ’ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വേറൊരു ‘സംഭവിച്ചു’ ചേർക്കേണ്ടതില്ല.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിതത്വമുള്ള നാമത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: דִּבְרֵי
  choice: വാക്കുകൾ
  rationale: കണ്ടെത്തിയ രേഖ വായിച്ചുകേൾപ്പിച്ചപ്പോൾ രാജാവ് കേട്ട വാചകങ്ങളെയോ ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വാക്കുകൾ’ എബ്രായരൂപത്തോടുള്ള ഔപചാരികബന്ധവും നിലനിർത്തുന്നു.
- source_word: סֵפֶר הַתּוֹרָה
  choice: ന്യായപ്രമാണപുസ്തകം
  rationale: סֵפֶר എന്നത് പുസ്തകമോ ചുരുളായ രേഖയോ ആകാം; תּוֹרָה ഇവിടെ ഉടമ്പടിസംബന്ധമായ നിയമസംഹിതയെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ പ്രയോഗത്തിൽ വ്യക്തവും മാന്യവുമായ ‘ന്യായപ്രമാണപുസ്തകം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; രേഖയുടെ ഭൗതികരൂപത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיִּקְרַע
  choice: കീറി
  rationale: קרע വസ്ത്രം കീറുക എന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ദുഃഖത്തിന്റെയും ഞെട്ടലിന്റെയും ആചാരപരമായ പ്രതികരണം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ
  rationale: ബഹുവചനവും രാജാവിലേക്കുള്ള സ്വത്തുബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
