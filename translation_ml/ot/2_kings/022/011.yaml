  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ പദം സന്ദർഭത്തിലെ നിയമസംഹിതാഭാവം വ്യക്തമാക്കുന്നു; ‘പുസ്തകം/ചുരുൾ’ എന്ന യഥാർത്ഥ പദസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
