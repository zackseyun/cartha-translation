  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
translation:
  language: ml
  text: 'അപ്പോൾ മഹാപുരോഹിതനായ ഹിൽക്കീയാവ് ലേഖകനായ ശാഫാനോട് പറഞ്ഞു: “യാഹ്‌വേയുടെ ഭവനത്തിൽ[b] ഞാൻ ന്യായപ്രമാണപുസ്തകം[a] കണ്ടെത്തിയിരിക്കുന്നു.” ഹിൽക്കീയാവ് ആ പുസ്തകം ശാഫാനു കൊടുത്തു; അവൻ അത് വായിച്ചു.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ന്യായപ്രമാണച്ചുരുൾ.” סֵפֶר എന്ന ഹീബ്രുപദം ചുരുളിനെയോ പുസ്തകരൂപത്തിലുള്ള രേഖയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “യാഹ്‌വേയുടെ ഭവനത്തിൽ”; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ദേവാലയമാണ്.'
    reason: cultural_note
  - marker: c
    text: അഥവാ, സാധ്യത കുറവാണെങ്കിലും, “അവൻ അതിൽനിന്ന് വായിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: മഹാപുരോഹിതൻ
  rationale: സന്ദർഭത്തിലെ മുഖ്യ പുരോഹിതപദവിക്കുള്ള സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: הַסֹּפֵר
  choice: ലേഖകൻ
  rationale: സֹפֵר എന്നത് എഴുത്തും ഭരണകാര്യങ്ങളും നിർവഹിച്ച ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു; ‘ലേഖകൻ’ ചരിത്രപരമായ പദത്തെ അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: סֵפֶר הַתּוֹרָה
  choice: ന്യായപ്രമാണപുസ്തകം
  rationale: ഈ നിയമ-ഉടമ്പടി സന്ദർഭത്തിൽ תּוֹרָהയ്ക്ക് ‘ന്യായപ്രമാണം’ യോജിക്കുന്നു; סֵפֶר പുസ്തകമോ ചുരുളോ ആയ രേഖയെ സൂചിപ്പിക്കാം, അതിനാൽ മറ്റുവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מָצָאתִי
  choice: ഞാൻ ... കണ്ടെത്തിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ കണ്ടെത്തലിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി ഹീബ്രു പൂർണ്ണക്രിയയ്ക്കനുസരിച്ച് പ്രകടമാക്കുന്നു.
- source_word: בְּבֵית יְהוָה
  choice: യഹോവയുടെ ഭവനത്തിൽ
  rationale: ‘യഹോവയുടെ ഭവനം’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ദേവാലയമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר
  choice: ആ പുസ്തകം ... കൊടുത്തു
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളപരിഭാഷ.
- source_word: וַיִּקְרָאֵהוּ
  choice: അവൻ അത് വായിച്ചു
  rationale: പ്രത്യയമുള്ള ക്രിയയുടെ സ്വാഭാവിക അർഥം ‘അത് വായിച്ചു’ എന്നാണ്. ‘അവൻ’ എന്നത് ഹീബ്രുവിലെ പ്രസ്താവിക്കാത്ത പുരുഷലിംഗ ഏകവചന കർത്താവിന്റെ ചെറിയ അവ്യക്തത നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സാധാരണയായി ശാഫാനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം നിലനിർത്തുന്നു.
- issue: וַיִּקְרָאֵהוּ എന്നതിലെ കർത്താവ്
  choice: ‘അവൻ’ എന്ന സർവനാമം ഉപയോഗിച്ച് അവ്യക്തത നിലനിർത്തുന്നു
  alternative: ‘ശാഫാൻ അത് വായിച്ചു’ എന്നു കർത്താവിനെ വ്യക്തമാക്കുക
  rationale: സന്ദർഭത്തിൽ ശാഫാൻ എന്ന വായനയാണ് ഏറ്റവും സ്വാഭാവികം; എങ്കിലും ഹീബ്രുവിൽ കർത്താവിന്റെ പേര് ആവർത്തിക്കാത്തതിനാൽ മലയാളത്തിലും അതിനെ അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘മഹാപുരോഹിതൻ,’ ‘ലേഖകൻ,’ ‘ന്യായപ്രമാണപുസ്തകം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗത്തിനരികിൽ ചേർത്തിരിക്കുന്നു.
