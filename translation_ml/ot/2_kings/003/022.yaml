source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הַ/שֶּׁ֖מֶשׁ זָרְחָ֣ה עַל הַ/מָּ֑יִם וַ/יִּרְא֨וּ מוֹאָ֥ב מִ/נֶּ֛גֶד אֶת הַ/מַּ֖יִם אֲדֻמִּ֥ים כַּ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/022.yaml
  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
translation:
  language: ml
  text: അവർ അതിരാവിലെ എഴുന്നേറ്റു; സൂര്യൻ വെള്ളത്തിന്മേൽ പ്രകാശിച്ചു. മോവാബ്യർ[a] തങ്ങളുടെ എതിർവശത്തുള്ള വെള്ളം രക്തംപോലെ ചുവന്നതായി കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലപാഠത്തിൽ ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ‘മോവാബ്’ എന്നാണ്. ‘തങ്ങളുടെ എതിർവശത്തുള്ള’ എന്ന സ്ഥലസൂചനയെ ‘തങ്ങളുടെ മറുവശത്തുള്ള’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: അവർ അതിരാവിലെ എഴുന്നേറ്റു
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരത്തേ എഴുന്നേൽക്കുക എന്ന ആശയം നൽകുന്നു; בַבֹּקֶר സമയത്തെ വ്യക്തമാക്കുന്നു. ‘അതിരാവിലെ എഴുന്നേറ്റു’ സ്വാഭാവികമായ മലയാളത്തിൽ ഈ സമയഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  choice: സൂര്യൻ വെള്ളത്തിന്മേൽ പ്രകാശിച്ചു
  rationale: זרח എന്നത് ഉദിക്കുക എന്നും പ്രകാശിക്കുക എന്നും അർഥമാക്കാം. ഇവിടെ വെള്ളത്തിൽ പതിച്ച സൂര്യപ്രകാശം തുടർന്നുള്ള ദൃശ്യത്തിന് കാരണമാകുന്നതിനാൽ ‘പ്രകാശിച്ചു’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: וַיִּרְאוּ מוֹאָב
  choice: മോവാബ്യർ കണ്ടു
  rationale: മൂലപാഠത്തിലെ ഏകവചന ദേശനാമമായ ‘മോവാബ്’ ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആളുകളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമായി അറിയിക്കാൻ ‘മോവാബ്യർ’ എന്നു നൽകി.
- source_word: מִנֶּגֶד
  choice: തങ്ങളുടെ എതിർവശത്തുള്ള
  rationale: מִנֶּגֶד എതിർവശത്ത് അഥവാ മറുവശത്ത് എന്ന സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നു. ‘തങ്ങളുടെ എതിർവശത്തുള്ള’ എന്നത് കാഴ്ചക്കാരുമായുള്ള ആ ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת הַמַּיִם אֲדֻמִּים כַּדָּם
  choice: വെള്ളം രക്തംപോലെ ചുവന്നതായി
  rationale: אֲדֻמִּים എന്ന വിശേഷണം വെള്ളത്തിന്റെ ചുവന്ന ദൃശ്യഭാവം വ്യക്തമാക്കുന്നു; כַּדָּם എന്ന ഉപമ ‘രക്തംപോലെ’ എന്ന് നേരിട്ട് നിലനിർത്തുന്നു.
