reference: 2 Kings 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט יֵ֥שׁ אוֹת֖/וֹ דְּבַר יְהוָ֑ה וַ/יֵּרְד֣וּ אֵלָ֗י/ו מֶ֧לֶךְ יִשְׂרָאֵ֛ל וִ/יהוֹשָׁפָ֖ט וּ/מֶ֥לֶךְ אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/012.yaml
  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
translation:
  language: ml
  text: 'യെഹോശാഫാത്ത് പറഞ്ഞു: “യഹ്‌വെയുടെ വചനം അവന്റെ പക്കലുണ്ട്.”[a] അങ്ങനെ ഇസ്രായേൽ രാജാവും യെഹോശാഫാത്തും എദോം രാജാവും അവന്റെ അടുക്കലേക്ക് ഇറങ്ങിച്ചെന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയിൽനിന്നുള്ള ഒരു വചനം അവന്റെ പക്കലുണ്ട്.”
    reason: יֵשׁ אֹתוֹ דְּבַר יְהוָה എന്ന പ്രയോഗം യഹ്‌വെയുടെ വചനം അവനോടു ലഭ്യമാണ് എന്നോ, അവന് യഹ്‌വെയിൽനിന്നുള്ള ഒരു പ്രവാചകസന്ദേശമുണ്ട് എന്നോ അർഥമാക്കാം.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ ആഖ്യാനക്രിയയെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: יֵשׁ אֹתוֹ
  choice: അവനോടുകൂടെയുണ്ട്
  rationale: יֵשׁ + אֹתוֹ എന്ന ഘടന സാന്നിധ്യമോ കൈവശമോ സൂചിപ്പിക്കാം. ‘അവനോടുകൂടെയുണ്ട്’ എന്നത് മൂലത്തിലെ സാന്നിധ്യഭാവം നിലനിർത്തുകയും പ്രവാചകനിലൂടെ ദൈവിക വെളിപ്പാട് ലഭ്യമാണെന്ന സന്ദർഭസൂചന നൽകുകയും ചെയ്യുന്നു.
- source_word: דְּבַר יְהוָה
  choice: യഹ്‌വെയുടെ വചനം
  rationale: പ്രവാചകസന്ദർഭത്തിലെ സ്ഥിരപ്രയോഗത്തെ മാനിച്ച് ‘വചനം’ എന്നു പരിഭാഷപ്പെടുത്തി; ഒരു പ്രത്യേക സന്ദേശമോ ദൈവിക വെളിപ്പാടിന്റെ സാന്നിധ്യമോ എന്ന സൂക്ഷ്മമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוהയെ പദവിനാമം കൊണ്ട് പകരാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיֵּרְדוּ
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: ירד എന്ന ക്രിയയിലെ താഴോട്ടുള്ള ചലനം നിലനിർത്തിക്കൊണ്ട് ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്ര സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֵלָיו
  choice: അവന്റെ അടുക്കലേക്ക്
  rationale: אֵלָיו സൂചിപ്പിക്കുന്ന ‘അവന്റെ അടുത്തേക്ക്/അവനിലേക്കു’ എന്ന ദിശ വ്യക്തമായി നൽകുന്നു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: രാജപദവിയും ദേശനാമവും സ്വാഭാവികമായ മലയാള സംയുക്തരൂപത്തിൽ നൽകുന്നു.
- source_word: וִיהוֹשָׁפָט
  choice: യെഹോശാഫാത്ത്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തോട് അടുത്തുനിൽക്കുന്ന പതിവ് മലയാള ലിപ്യന്തരണം.
- source_word: וּמֶלֶךְ אֱדוֹם
  choice: എദോംരാജാവ്
  rationale: മൂലത്തിലെ സമാന്തര പട്ടികാക്രമം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള രൂപം.
theological_decisions:
- issue: എലീശയോടുള്ള ബന്ധത്തിൽ דְּבַר יְהוָה എന്ന പ്രവാചകപ്രയോഗത്തിന്റെ അർഥം
  choice: യഹ്‌വെയുടെ വചനം അവനോടുകൂടെയുണ്ട്
  alternative: യഹ്‌വെയിൽനിന്നുള്ള ഒരു അരുളപ്പാട് അവന്റെ പക്കലുണ്ട്
  rationale: മുഖ്യപാഠം ദൈവവചനത്തിന്റെ സാന്നിധ്യം എന്ന ഹീബ്രു പ്രയോഗത്തെ അടുത്തായി നിലനിർത്തുന്നു. എന്നാൽ എലീശയ്ക്ക് ഇപ്പോൾ ഒരു പ്രത്യേക പ്രവാചകസന്ദേശം ലഭ്യമാണെന്ന കൈവശഭാവവും വ്യാകരണപരമായി സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പൊതുവായ പദവിനാമമായി മാറ്റാതെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ‘അവനോടുകൂടെയുണ്ട്’ എന്ന രൂപം മൂലത്തിലെ ഭാഷാഭാവം നിലനിർത്തുന്നു; ‘ഇറങ്ങിച്ചെന്നു’ ദിശയും യാത്രയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു. പേരുകൾ ഹീബ്രു രൂപങ്ങളോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണത്തിലാണ്.
