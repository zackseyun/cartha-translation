  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
translation:
  language: ml
  text: യുദ്ധം തനിക്കു താങ്ങാനാവാത്തത്ര ശക്തമായെന്ന് മോവാബ് രാജാവ് കണ്ടപ്പോൾ, അവൻ വാൾ ഊരിയ എഴുനൂറുപേരെ കൂട്ടിക്കൊണ്ട് ഏദോംരാജാവിന്റെ അടുക്കലേക്കു[a] തുളച്ചുകയറാൻ ശ്രമിച്ചു; എന്നാൽ അവർക്ക് അതിനു കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഏദോംരാജാവിനെതിരെ തുളച്ചുകയറാൻ.’ ഈ സൈനികസന്ദർഭത്തിൽ എബ്രായ മുൻപ്രത്യയത്തിന് ‘അടുക്കലേക്ക്/നേരെ’ എന്ന ദിശാസൂചനയോ ‘എതിരെ’ എന്ന ശത്രുതാപരമായ അർഥമോ നൽകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  choice: യുദ്ധം തനിക്കു താങ്ങാവുന്നതിലും ശക്തമായി
  rationale: חזק എന്ന ‘ശക്തമായിരിക്കുക’ എന്ന ആശയവും מן + സർവനാമം സൂചിപ്പിക്കുന്ന താരതമ്യവും നിലനിർത്തിക്കൊണ്ട്, യുദ്ധം രാജാവിന്റെ കഴിവിനെ അതിക്രമിച്ചുവെന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֹתוֹ
  choice: അവൻ ... കൂട്ടിക്കൊണ്ട്
  rationale: וַיִּקַּח എന്ന ക്രിയയ്ക്കുശേഷമുള്ള ഈ രൂപം ഇവിടെ സൈന്യത്തെ തന്നോടൊപ്പം കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കൂട്ടിക്കൊണ്ട്’ എന്നത് മലയാളത്തിൽ ഈ സഹഗമനാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: എഴുനൂറുപേർ
  rationale: സൈനികസന്ദർഭത്തിലെ എണ്ണൽപ്രയോഗമാണിത്. ‘പേർ’ മൂലത്തിലെ വ്യക്തികളെ സൂചിപ്പിക്കുകയും ‘സൈനികർ’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: שֹׁלֵף חֶרֶב
  choice: വാളൂരിയ
  rationale: അക്ഷരാർഥത്തിൽ ‘വാൾ ഊരുന്ന’ എന്ന സൈനികചിത്രം മലയാളത്തിലെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: לְהַבְקִיעַ
  choice: തുളച്ചുകയറാൻ
  rationale: בקע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ശത്രുനിരയിൽ വിടവുണ്ടാക്കി കടന്നുകയറുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘തുളച്ചുകയറുക’ ആ സൈനികപ്രവർത്തനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: ഏദോംരാജാവിന്റെ അടുക്കലേക്കു
  rationale: אֶל എന്ന പദത്തിന്റെ പ്രാഥമികമായ ദിശാസൂചന നിലനിർത്തുന്നു. ഈ സൈനികസന്ദർഭത്തിൽ അതിന് ‘എതിരെ’ എന്ന ശത്രുതാപരമായ അർഥവും സാധ്യമായതിനാൽ ആ വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וְלֹא יָכֹלוּ
  choice: എന്നാൽ അവർക്കതു കഴിഞ്ഞില്ല
  rationale: ബഹുവചനക്രിയ രാജാവും കൂടെയുള്ളവരും ചേർന്ന സംഘത്തെ സൂചിപ്പിക്കുന്നു. ‘അതു’ തുളച്ചുകയറാനുള്ള പ്രവൃത്തിയിലേക്കു വ്യക്തമായി മടങ്ങിച്ചൂണ്ടുന്നു; വിജയിച്ചില്ലെന്നതിലുപരി കഴിവില്ലായ്മയെ സൂചിപ്പിക്കുന്ന മൂലപ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. യുദ്ധവിവരണത്തിന്റെ ചുരുക്കവും ചലനവും നിലനിർത്താൻ ‘വാളൂരിയ’, ‘തുളച്ചുകയറാൻ’ എന്നീ സജീവപ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; אֶל എന്നതിലെ യഥാർഥ ദ്വയാർഥസാധ്യത മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
