  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി. പേരുകൾ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകി; ആവർത്തിച്ച מלך ക്രിയയുടെ അധികാരാരോഹണവും ഭരണദൈർഘ്യവും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തി.
