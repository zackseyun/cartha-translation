source:
  edition: WLC
  text: וִ/יהוֹרָ֣ם בֶּן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ שְׁתֵּים עֶשְׂרֵ֥ה שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/001.yaml
  text: Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
translation:
  language: ml
  text: ആഹാബിന്റെ മകനായ യെഹോരാം, യെഹൂദാരാജാവായ യെഹോശാഫാത്തിന്റെ പതിനെട്ടാം ഭരണവർഷത്തിൽ ശമര്യയിൽ ഇസ്രായേലിന്റെ രാജാവായി[a]. അവൻ പന്ത്രണ്ടു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ പദാനുസൃതമായി, വാക്യം ഒരു എബ്രായ ബന്ധകത്തോടെ ആരംഭിക്കുന്നു; അതിനെ ‘എന്നിട്ട്, ആഹാബിന്റെ മകനായ യെഹോരാം …’ എന്നിങ്ങനെ നൽകാം.
    reason: വാക്യാരംഭത്തിലെ וְ എന്ന എബ്രായ ബന്ധകത്തിന്റെ പദാനുസൃതമായ ബദൽ രേഖപ്പെടുത്തുന്നു. മുഖ്യപാഠത്തിൽ സ്വാഭാവിക മലയാളത്തിനായി അതിനെ പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല.
lexical_decisions:
- source_word: וִ/יהוֹרָם
  choice: യെഹോരാം
  rationale: പേരിനെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി. തുടക്കത്തിലെ וְ ആഖ്യാനത്തുടർച്ച സൂചിപ്പിക്കാമെങ്കിലും സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം ‘എന്നാൽ/അപ്പോൾ’ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ തുടർച്ച നിലനിർത്തി.
- source_word: בֶּן אַחְאָב
  choice: ആഹാബിന്റെ മകനായ
  rationale: പിതൃബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ രേഖപ്പെടുത്തി.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ രാജാവായി
  rationale: ഇവിടെയുള്ള ക്രിയ രാജഭരണത്തിന്റെ ദൈർഘ്യത്തേക്കാൾ അധികാരാരോഹണം സൂചിപ്പിക്കുന്നു; അതിനാൽ പിന്നീടുള്ള ‘ഭരിച്ചു’ എന്ന പ്രയോഗത്തിൽനിന്ന് വേർതിരിച്ചു.
- source_word: בְּ/שֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: സ്ഥാനസൂചകമായ בְ സ്വാഭാവികമായി ‘-യിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി; ഇവിടെ ശമര്യ തലസ്ഥാനനഗരമാണ്.
- source_word: בִּ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה
  choice: പതിനെട്ടാം ഭരണവർഷത്തിൽ
  rationale: രാജാക്കന്മാരുടെ കാലസമന്വയസൂത്രം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കാൻ ‘ഭരണവർഷം’ ഉപയോഗിച്ചു.
- source_word: לִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ യെഹോശാഫാത്തിന്റെ
  rationale: ഈ രാജവർഷസൂത്രത്തിലെ לְ, യെഹോശാഫാത്തിന്റെ ഭരണത്തിലെ വർഷത്തെ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിലെ ഷഷ്ഠിവിഭക്തിയിൽ നൽകി.
- source_word: וַ/יִּמְלֹךְ שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: അവൻ പന്ത്രണ്ടു വർഷം ഭരിച്ചു
  rationale: ഇവിടെ מלך ഭരണകാലത്തിന്റെ ദൈർഘ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭരിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
