source:
  edition: WLC
  text: וַ/יֵּ֡לֶךְ וַ/יִּשְׁלַח֩ אֶל יְהוֹשָׁפָ֨ט מֶֽלֶךְ יְהוּדָ֜ה לֵ/אמֹ֗ר מֶ֤לֶךְ מוֹאָב֙ פָּשַׁ֣ע בִּ֔/י הֲ/תֵלֵ֥ךְ אִתִּ֛/י אֶל מוֹאָ֖ב לַ/מִּלְחָמָ֑ה וַ/יֹּ֣אמֶר אֶעֱלֶ֔ה כָּמ֧וֹ/נִי כָמ֛וֹ/ךָ כְּ/עַמִּ֥/י כְ/עַמֶּ֖/ךָ כְּ/סוּסַ֥/י כְּ/סוּסֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
translation:
  language: ml
  text: 'അങ്ങനെ അവൻ പോയി യെഹൂദാരാജാവായ യെഹോശാഫാത്തിന് സന്ദേശം അയച്ച് ഇങ്ങനെ അറിയിച്ചു: “മോവാബ്‌രാജാവ് എനിക്കെതിരേ കലാപം ചെയ്തിരിക്കുന്നു[a]. മോവാബിനെതിരെ യുദ്ധം ചെയ്യാൻ നീ എന്നോടൊപ്പം പോകുമോ?” അതിന് യെഹോശാഫാത്ത് പറഞ്ഞു: “ഞാൻ പോകും[b]. നിന്നെപ്പോലെ ഞാനും; എന്റെ ജനം നിന്റെ ജനംപോലെ, എന്റെ കുതിരകൾ നിന്റെ കുതിരകൾപോലെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നിൽനിന്ന് വിട്ടുമാറിയിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ഹീബ്രു ക്രിയ രാഷ്ട്രീയ കലാപത്തെയോ വിധേയത്വബന്ധം ലംഘിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ മോവാബ് ഇസ്രായേലിന്റെ ആധിപത്യം തള്ളിക്കളഞ്ഞതിനെയാണ് പരാമർശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഞാൻ കയറിപ്പോകും.” ഈ ക്രിയ യുദ്ധത്തിനായുള്ള നീക്കത്തെയോ ഉയർന്ന പ്രദേശത്തേക്കുള്ള യാത്രയെയോ പലപ്പോഴും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അങ്ങനെ അവൻ പോയി
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അങ്ങനെ’ സ്വാഭാവികമായ സംഭവക്രമം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁלַח אֶל ... לֵאמֹר
  choice: ആളയച്ച് ഇങ്ങനെ അറിയിച്ചു
  rationale: ഉദ്ധരിക്കപ്പെടുന്ന സന്ദേശത്തോടൊപ്പം വന്നതിനാൽ, ഒരാളെ അയച്ച് സന്ദേശം അറിയിച്ചതെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ യെഹോശാഫാത്ത്
  rationale: വ്യക്തിനാമവും രാജപദവിയും മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും വ്യക്തവുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: פָּשַׁע בִּי
  choice: എന്നോടു മത്സരിച്ചിരിക്കുന്നു
  rationale: അധീനത തള്ളിക്കളഞ്ഞുള്ള രാഷ്ട്രീയ കലാപമാണ് സന്ദർഭം; ‘മത്സരിക്കുക’ ആ ആശയം dignified Malayalam-ൽ നൽകുന്നു, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הֲתֵלֵךְ אִתִּי
  choice: നീ എന്നോടൊപ്പം പോകുമോ?
  rationale: הלך എന്ന ക്രിയയുടെ അടിസ്ഥാന ദിശയായ ‘പോകുക’ നിലനിർത്തുകയും കൂട്ടായ സൈനികയാത്ര വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל מוֹאָב לַמִּלְחָמָה
  choice: മോവാബിനോടു യുദ്ധം ചെയ്യാൻ
  rationale: മോവാബിനെതിരായ സൈനികലക്ഷ്യം മലയാളത്തിൽ സ്വാഭാവികമായും സംക്ഷിപ്തമായും വ്യക്തമാക്കുന്നു.
- source_word: אֶעֱלֶה
  choice: ഞാൻ പോകാം
  rationale: עלה അക്ഷരാർഥത്തിൽ ‘കയറിപ്പോകുക’ എന്നാണെങ്കിലും ഇവിടെ സൈനികയാത്രയ്ക്കുള്ള സമ്മതമാണ് പ്രധാന അർഥം; ദിശാസൂചന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: כָּמוֹנִי כָמוֹךָ כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  choice: നിന്നെപ്പോലെ ഞാനും; എന്റെ ജനം നിന്റെ ജനംപോലെ, എന്റെ കുതിരകൾ നിന്റെ കുതിരകൾപോലെ
  rationale: ഹീബ്രുവിലെ സംക്ഷിപ്ത സമാന്തരവാക്യഘടനയും പൂർണ ഐക്യദാർഢ്യത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമാകുന്ന വാക്യക്രമം ഉപയോഗിച്ചെങ്കിലും ഹീബ്രുവിലെ സമാന്തര ഐക്യപ്രഖ്യാപനം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
