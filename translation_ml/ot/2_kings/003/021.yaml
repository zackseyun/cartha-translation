  text: וְ/כָל מוֹאָב֙ שָֽׁמְע֔וּ כִּֽי עָל֥וּ הַ/מְּלָכִ֖ים לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִּצָּעֲק֗וּ מִ/כֹּ֨ל חֹגֵ֤ר חֲגֹרָה֙ וָ/מַ֔עְלָ/ה וַ/יַּעַמְד֖וּ עַֽל הַ/גְּבֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: All Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
translation:
  language: ml
  text: മോവാബ്യരെല്ലാം രാജാക്കന്മാർ തങ്ങളോടു യുദ്ധം ചെയ്യാൻ കയറിവന്നുവെന്ന് കേട്ടു. അപ്പോൾ അരപ്പട്ട കെട്ടുന്ന പ്രായത്തിലുള്ളവർ മുതൽ അതിലേറെ പ്രായമുള്ളവരെ വരെ എല്ലാവരെയും വിളിച്ചുകൂട്ടി[a][b]; അവർ അതിർത്തിയിൽ നിലയുറപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിളിച്ചുകൂട്ടി’ എന്നതിന് ‘യുദ്ധത്തിനായി അണിനിരത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായക്രിയ വെറുതെയുള്ള നിലവിളിയെയല്ല, ആളുകളെ സമാഹരിക്കുന്നതിനെയാണു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘അരപ്പട്ട കെട്ടുന്ന ഏവൻമുതൽ മുകളിലോട്ട്’; സൈനികപ്രായത്തിലെത്തിയവരെയും അതിൽ മുതിർന്നവരെയും സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מוֹאָב
  choice: മോവാബ്യരെല്ലാം
  rationale: മോവാബ് എന്ന സമൂഹവാചക നാമം ജനതയെ മുഴുവനായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മോവാബ്യരെല്ലാം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: שָׁמְעוּ
  choice: കേട്ടു
  rationale: റിപ്പോർട്ട് അറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כִּי עָלוּ הַמְּלָכִים לְהִלָּחֶם בָּם
  choice: രാജാക്കന്മാർ തങ്ങളോടു യുദ്ധം ചെയ്യാൻ വന്നിരിക്കുന്നുവെന്ന്
  rationale: עלה എന്നതിന്റെ സഞ്ചാരഭാവം ‘വന്നിരിക്കുന്നു’ എന്നതിലൂടെ സ്വാഭാവികമായി നൽകുന്നു; ഭൂമിശാസ്ത്രപരമായ ‘കയറിവരുക’ എന്ന അർഥം അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല. בהם എന്ന സർവനാമം മോവാബ്യരിലേക്കു തിരിച്ചുകാട്ടാൻ ‘തങ്ങളോട്’ ഉപയോഗിച്ചു.
- source_word: וַיִּצָּעֲקוּ
  choice: വിളിച്ചുകൂട്ടി
  rationale: ഇവിടെ ക്രിയ ജനങ്ങളെ യുദ്ധത്തിനായി സമാഹരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; വെറുതെ ‘നിലവിളിച്ചു’ എന്നല്ല. മലയാളത്തിലെ സകർമകമായ അനിശ്ചിത-കർത്തൃപ്രയോഗം സന്ദർഭത്തിലെ പൊതുവായ ആഹ്വാനത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  choice: അരപ്പട്ട കെട്ടാൻ പ്രായമായവർമുതൽ അതിനു മുകളിലുള്ള എല്ലാവരെയും
  rationale: എബ്രായത്തിലെ അരപ്പട്ട കെട്ടുന്നവൻ എന്ന ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, അത് പ്രായപരിധി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെന്ന് മലയാളവായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  choice: അവർ അതിർത്തിയിൽ നിലയുറപ്പിച്ചു
  rationale: യുദ്ധസന്ദർഭത്തിലെ עמד എന്നതിന്റെ സ്ഥാനമേറ്റുനിൽക്കുന്ന ഭാവം ‘നിലയുറപ്പിച്ചു’ എന്നതിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
