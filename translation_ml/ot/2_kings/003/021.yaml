translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ പ്രായസൂചക ദൃശ്യപ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, അതിന്റെ സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. ഇംഗ്ലീഷ് consultation layer-യിലെ അടിക്കുറിപ്പ് അക്ഷരങ്ങളുടെ ഉള്ളടക്കക്രമം തെറ്റിയിരുന്നതിനാൽ, മലയാളത്തിൽ ബന്ധപ്പെട്ട പദങ്ങൾക്കരികിൽ ശരിയായ കുറിപ്പുകൾ ചേർത്തു.
