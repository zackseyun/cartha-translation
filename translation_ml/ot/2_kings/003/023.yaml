translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. നേരിട്ടുള്ള സംഭാഷണത്തിലെ ആശ്ചര്യവും യുദ്ധവിളിയുടെ അടിയന്തരതയും നിലനിർത്തി. മൂലത്തിലെ ഊന്നൽഘടനയ്ക്ക് ഒരേയൊരു നിർബന്ധിത വ്യാഖ്യാനം നൽകാതെ മറ്റൊരു സാധുവായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
