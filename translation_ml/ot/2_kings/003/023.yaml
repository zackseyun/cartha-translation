base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു[a]: “ഇത് രക്തമാണ്! രാജാക്കന്മാർ തീർച്ചയായും പരസ്പരം പോരാടി, ഓരോരുത്തനും തന്റെ കൂട്ടുകാരനെ പ്രഹരിച്ചിരിക്കുന്നു. ഇപ്പോൾ, മോവാബേ[b], കൊള്ളയിലേക്ക്!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജാക്കന്മാർ പരസ്പരം പൂർണമായി നശിപ്പിച്ചിരിക്കുന്നു.” ‘നശിക്കുക/ശൂന്യമാകുക’ എന്നർഥമുള്ള എബ്രായ ക്രിയ ഇവിടെ ഊന്നൽരൂപത്തിലാണ്; സന്ദർഭത്തിൽ രാജാക്കന്മാർ പരസ്പരം ആക്രമിച്ചുവെന്നാണ് അവർ കരുതുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മോവാബ്യരേ, കൊള്ളയിലേക്ക്!”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּם זֶה
  choice: ഇത് രക്തമാണ്!
  rationale: ക്രിയയില്ലാത്ത എബ്രായ ആശ്ചര്യവാക്യത്തിന്റെ ഊന്നലും זֶה എന്ന സൂചകപദത്തിന്റെ അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָחֳרֵב נֶחֶרְבוּ
  choice: തമ്മിൽ പോരാടി
  rationale: חרב എന്ന ധാതുവിന്റെ infinitive absolute + finite verb ഘടന ശക്തമായ ഊന്നൽ നൽകുന്നു. സഖ്യരാജാക്കന്മാർ തമ്മിൽ തിരിഞ്ഞ് നാശകരമായി പോരാടിയെന്ന മോവാബ്യരുടെ അനുമാനം സന്ദർഭാനുസൃതമായി നൽകുന്നു; പദപ്രയോഗത്തിന്റെ നാശസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: הַמְּלָכִים
  choice: രാജാക്കന്മാർ
  rationale: മുമ്പ് പരാമർശിച്ച സഖ്യഭരണാധികാരികളെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട ബഹുവചനം; മലയാളത്തിൽ സന്ദർഭം നിർദിഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: וַיַּכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: പരസ്പരം വെട്ടിവീഴ്ത്തിയിരിക്കുന്നു
  rationale: אישׁ את־רעהו എന്നത് പരസ്പരപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. യുദ്ധസന്ദർഭത്തിൽ נכה എന്ന ക്രിയയുടെ മാരകമായ പ്രഹരാർഥം ‘വെട്ടിവീഴ്ത്തുക’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: കണ്ട കാഴ്ചയിൽനിന്ന് ആവേശഭരിതമായ ആഹ്വാനത്തിലേക്കുള്ള പെട്ടെന്നുള്ള മാറ്റം ലളിതവും ശക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַשָּׁלָל
  choice: കൊള്ളയിലേക്ക്
  rationale: ל എന്ന ഉപസർഗത്തിന്റെ ദിശാസൂചന നിലനിർത്തിക്കൊണ്ട് കൊള്ളയടിക്കാനായി മുന്നേറാനുള്ള യുദ്ധവിളി സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: מוֹאָב
  choice: മോവാബേ
  rationale: ജനതയുടെ പേര് സംബോധനയായി ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായരൂപം നിലനിർത്തുന്നു; മലയാളത്തിലെ സംബോധനപ്രത്യയം അതിന്റെ വിളിയർഥം വ്യക്തമാക്കുന്നു.
