revisions:
- from: അവർ പട്ടണങ്ങൾ ഇടിച്ചുതകർത്തു. ഫലഭൂയിഷ്ഠമായ ഓരോ ഭൂഭാഗത്തിലും[a] ഓരോരുത്തൻ ഓരോ കല്ല് എറിഞ്ഞ് അതിനെ കല്ലുകൾകൊണ്ട് നിറച്ചു. അവർ എല്ലാ നീരുറവുകളും അടച്ചുകളയുകയും നല്ല മരങ്ങളെല്ലാം[b] വെട്ടിവീഴ്ത്തുകയും ചെയ്തു. ഒടുവിൽ കീർ-ഹരേശെത്തിൽ[c] അതിന്റെ കല്ലുകൾ മാത്രമേ ശേഷിച്ചുള്ളൂ. പിന്നെ കവിണക്കാരൻമാർ അതിനെ വളഞ്ഞ് ആക്രമിച്ചു[d].
  to: അവർ പട്ടണങ്ങൾ ഇടിച്ചുതകർത്തു. ഓരോ നല്ല ഭൂഭാഗത്തിലും[a] ഓരോരുത്തൻ ഓരോ കല്ല് എറിഞ്ഞ് അതിനെ കല്ലുകൾകൊണ്ട് നിറച്ചു. അവർ എല്ലാ നീരുറവുകളും അടച്ചുകളയുകയും നല്ല മരങ്ങളെല്ലാം[b] വെട്ടിവീഴ്ത്തുകയും ചെയ്തു. കീർ-ഹരേശെത്തിൽ[c] അതിന്റെ കല്ലുകൾ മാത്രം ശേഷിക്കുന്നതുവരെ അവർ ഇതു ചെയ്തു. പിന്നെ കവിണക്കാർ അതിനെ വളഞ്ഞ് ആക്രമിച്ചു[d].
  rationale: The revision replaces the overly specific “ഫലഭൂയിഷ്ഠമായ” with “നല്ല,” retaining the Hebrew’s broader description of valuable or productive land. It also makes the temporal force of עַד (“until”) explicit in the clause concerning the stones at Kir-hareseth and uses the more idiomatic “കവിണക്കാർ.” No theological or interpretive expansion has been introduced.
