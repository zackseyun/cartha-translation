source:
  edition: WLC
  text: וְ/הֶ/עָרִ֣ים יַהֲרֹ֡סוּ וְ/כָל חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ אַבְנ֜/וֹ וּ/מִלְא֗וּ/הָ וְ/כָל מַעְיַן מַ֤יִם יִסְתֹּ֨מוּ֙ וְ/כָל עֵֽץ ט֣וֹב יַפִּ֔ילוּ עַד הִשְׁאִ֧יר אֲבָנֶ֛י/הָ בַּ/קִּ֖יר חֲרָ֑שֶׂת וַ/יָּסֹ֥בּוּ הַ/קַּלָּעִ֖ים וַ/יַּכּֽוּ/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
translation:
  language: ml
  text: അവർ പട്ടണങ്ങൾ ഇടിച്ചുതകർത്തു. ഓരോ നല്ല ഭൂഭാഗത്തിലും[a] ഓരോരുത്തൻ ഓരോ കല്ല് എറിഞ്ഞ് അതിനെ കല്ലുകൾകൊണ്ട് നിറച്ചു. അവർ എല്ലാ നീരുറവുകളും അടച്ചുകളയുകയും നല്ല മരങ്ങളെല്ലാം[b] വെട്ടിവീഴ്ത്തുകയും ചെയ്തു. കീർ-ഹരേശെത്തിൽ[c] അതിന്റെ കല്ലുകൾ മാത്രം ശേഷിക്കുന്നതുവരെ അവർ ഇതു ചെയ്തു. പിന്നെ കവിണക്കാർ അതിനെ വളഞ്ഞ് ആക്രമിച്ചു[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഫലഭൂയിഷ്ഠമായ ഓരോ വയലിലും’ എന്നും പരിഭാഷപ്പെടുത്താം. חֶלְקָה എന്ന ഹീബ്രായപദം ഭൂമിയുടെ ഒരു ഭാഗത്തെയോ വിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘നല്ല മരം’; വിലപിടിപ്പുള്ളതോ വിളവുതരുന്നതോ ആയ മരങ്ങളെ ഇത് സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: c
    text: കീർ-ഹരേശെത്ത് ഒരു സ്ഥലനാമമാണ്; ഈ സന്ദർഭത്തിൽ അത് മോവാബിന്റെ പ്രധാന കോട്ടനഗരമായിരിക്കാം.
    reason: cultural_note
  - marker: d
    text: ‘അതിനെ പ്രഹരിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായക്രിയയുടെ അടിസ്ഥാനാർഥം ‘അടിക്കുക, പ്രഹരിക്കുക’ എന്നാണ്; ഇവിടെ അത് നഗരത്തിനെതിരായ സൈനികാക്രമണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים יַהֲרֹסוּ
  choice: അവർ പട്ടണങ്ങൾ ഇടിച്ചുതകർത്തു
  rationale: עִיר എന്നത് പട്ടണമോ നഗരമോ ആകാം; ഈ വിവരണത്തിൽ സ്വാഭാവികമായ ‘പട്ടണങ്ങൾ’ തിരഞ്ഞെടുത്തു. הרס-ന്റെ കെട്ടിടങ്ങൾ പൊളിച്ചുകളയുക എന്ന മൂർത്തമായ അർഥം ‘ഇടിച്ചുതകർത്തു’ നിലനിർത്തുന്നു.
- source_word: כָל חֶלְקָה טוֹבָה
  choice: ഫലഭൂയിഷ്ഠമായ ഓരോ ഭൂഭാഗത്തിലും
  rationale: חֶלְקָה ഒരു ഭൂമിത്തുണ്ട് അഥവാ വിഹിതം സൂചിപ്പിക്കുന്നു. കൃഷിനാശത്തിന്റെ സന്ദർഭത്തിൽ טוֹבָה-യുടെ പ്രായോഗിക ഭാവം ‘ഫലഭൂയിഷ്ഠമായ’ എന്ന് വ്യക്തമാക്കുന്നു; ‘വയൽ’ എന്ന കൂടുതൽ നിർദിഷ്ട സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יַשְׁלִיכוּ אִישׁ אַבְנוֹ וּמִלְאוּהָ
  choice: ഓരോരുത്തൻ ഓരോ കല്ല് എറിഞ്ഞ് അതിനെ കല്ലുകൾകൊണ്ട് നിറച്ചു
  rationale: ഹീബ്രായിലെ വിതരണാത്മക ഏകവചനം ‘ഓരോരുത്തൻ’ എന്നു നിലനിർത്തി. וּמִלְאוּהָ മുൻപ്രവൃത്തിയുടെ ഫലമായി ഭൂഭാഗം കല്ലുകൾകൊണ്ട് നിറച്ചതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: כָל מַעְיַן מַיִם יִסְתֹּמוּ
  choice: എല്ലാ നീരുറവുകളും അടച്ചുകളഞ്ഞു
  rationale: מַעְיַן സ്വാഭാവിക ജലസ്രോതസ്സായ ഉറവിനെയും סתם അതിനെ തടസ്സപ്പെടുത്തി അടയ്ക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: כָל עֵץ טוֹב יַפִּילוּ
  choice: നല്ല മരങ്ങളെല്ലാം വെട്ടിവീഴ്ത്തി
  rationale: עֵץ טוֹב അക്ഷരാർഥത്തിൽ ‘നല്ല മരം’ ആണ്; ഫലവൃക്ഷം എന്നു നിർബന്ധിച്ച് ചുരുക്കാതെ മുഖ്യപാഠത്തിൽ വിശാലത നിലനിർത്തി. Hiphil രൂപം മരങ്ങളെ വീഴ്ത്തിയ പ്രവൃത്തി സൂചിപ്പിക്കുന്നതിനാൽ ‘വെട്ടിവീഴ്ത്തി’ സ്വാഭാവികമാണ്.
- source_word: עַד הִשְׁאִיר אֲבָנֶיהָ בַּקִּיר חֲרָשֶׂת
  choice: ഒടുവിൽ കീർ-ഹരേശെത്തിൽ അതിന്റെ കല്ലുകൾ മാത്രമേ ശേഷിച്ചുള്ളൂ
  rationale: സംഖ്യാമാറ്റമുള്ള ഹീബ്രായിലെ ഫലവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കി; നാശത്തിനുശേഷം അവിടെ കല്ലുകൾ മാത്രം ശേഷിച്ചുവെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: הַקַּלָּעִים
  choice: കവിണക്കാരൻമാർ
  rationale: യുദ്ധത്തിൽ കവിണ ഉപയോഗിക്കുന്ന സൈനികരെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്.
- source_word: וַיָּסֹבּוּ ... וַיַּכּוּהָ
  choice: അതിനെ വളഞ്ഞ് ആക്രമിച്ചു
  rationale: סבב വളയുന്നതിനെയും נכה അക്ഷരാർഥത്തിൽ അടിക്കുകയോ പ്രഹരിക്കുകയോ ചെയ്യുന്നതിനെയും സൂചിപ്പിക്കുന്നു; നഗരത്തിനെതിരായ സൈനികപ്രവർത്തനത്തിൽ ‘ആക്രമിച്ചു’ സ്വാഭാവികമായ സന്ദർഭാർഥം നൽകുന്നു.
theological_decisions:
- issue: עַד הִשְׁאִיר എന്ന ഏകവചനരൂപവും കല്ലുകൾ ശേഷിച്ചതിന്റെ കൃത്യമായ ബന്ധവും
  choice: ഒടുവിൽ കീർ-ഹരേശെത്തിൽ അതിന്റെ കല്ലുകൾ മാത്രമേ ശേഷിച്ചുള്ളൂ
  alternative: കീർ-ഹരേശെത്തിന്റെ കല്ലുകൾ മാത്രം ശേഷിക്കുന്നതുവരെ
  rationale: ഹീബ്രായിലെ ഏകവചനത്തെ പ്രത്യേക കർത്താവുമായി ബന്ധപ്പെടുത്തി വ്യാഖ്യാനിക്കാതെ ഫലാവസ്ഥയായി വിവർത്തനം ചെയ്തു. ഇതിലൂടെ പാഠത്തിന്റെ സംക്ഷിപ്തതയും പരാമർശത്തിലെ ചെറിയ അനിശ്ചിതത്വവും അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ‘കവിണക്കാരൻമാർ’, ‘നീരുറവുകൾ’, ‘ഇടിച്ചുതകർത്തു’ എന്നീ പദങ്ങൾ യുദ്ധവിവരണത്തിന്റെ മൂർത്തത നിലനിർത്തുന്നു; അതേസമയം അത്യന്തം പുരാതനമോ പ്രാദേശികമോ ആയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
