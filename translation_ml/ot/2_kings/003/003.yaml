id: 2KI.3.3
reference: 2 Kings 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֠ק בְּ/חַטֹּ֞אות יָרָבְעָ֧ם בֶּֽן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל דָּבֵ֑ק לֹא סָ֖ר מִמֶּֽ/נָּה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
translation:
  language: ml
  text: എന്നാൽ[a] നെബാത്തിന്റെ മകനായ യൊരോബെയാം ഇസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച പാപങ്ങളോടു അവൻ പറ്റിനിന്നു; അവയിൽനിന്ന് അവൻ പിന്തിരിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എങ്കിലും’ / ‘ഇതൊന്നൊഴിച്ചാൽ’. മുൻപത്തെ അനുകൂല വിലയിരുത്തലിന് ഒരു പരിമിതി ചൂണ്ടിക്കാണിക്കുന്ന പദമാണ് എബ്രായത്തിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ അനുകൂലമായ രാജവിലയിരുത്തലിന് ഒരു പരിമിതിയോ വിരുദ്ധവശമോ അവതരിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘എന്നാൽ’ സ്വാഭാവികമായി ഈ മാറ്റം സൂചിപ്പിക്കുന്നു.
- source_word: בְּחַטֹּאות
  choice: പാപങ്ങളോട്
  rationale: דבק എന്ന ‘പറ്റിച്ചേരുക’ എന്ന ക്രിയയോടൊപ്പം, സ്ഥലം എന്നതിനേക്കാൾ ഉറച്ച അനുബന്ധമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ മലയാളത്തിലെ ‘-ഓട്’ സ്വാഭാവികമാണ്.
- source_word: חַטֹּאות
  choice: പാപങ്ങൾ
  rationale: യൊരോബെയാമിന്റെ മതപരമായ ലംഘനങ്ങളെയും നയങ്ങളെയും സൂചിപ്പിക്കുന്ന നൈതിക-ദൈവശാസ്ത്രപരമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകനായ യൊരോബെയാം
  rationale: വ്യക്തിനാമവും പിതൃനാമവും മലയാളത്തിലെ സ്വാഭാവിക തിരിച്ചറിയൽക്രമത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു; യൊരോബെയാമിന്റെ പ്രവൃത്തികൾ ഇസ്രായേലിനെ പാപത്തിലാക്കിയെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: דָּבֵק
  choice: പറ്റിച്ചേർന്നുനിന്നു
  rationale: ഉറച്ചതും തുടർച്ചയുള്ളതുമായ അനുബന്ധം സൂചിപ്പിക്കുന്നു; വെറും പിന്തുടരൽ എന്നതിലുപരി ദൃഢമായി ചേർന്നുനിന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: לֹא סָר
  choice: പിന്തിരിഞ്ഞില്ല
  rationale: ഒരു തെറ്റായ പ്രവർത്തനപാത ഉപേക്ഷിക്കാതിരിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: מִמֶּנָּה
  choice: അവയിൽനിന്ന്
  rationale: പ്രത്യയം രൂപപരമായി ഏകവചന സ്ത്രീലിംഗമാണെങ്കിലും ആശയപരമായ മുൻപദം ‘പാപങ്ങൾ’ ആണ്; മലയാളത്തിൽ ബഹുവചനസൂചന സ്വാഭാവികവും വ്യക്തവുമാണ്.
theological_decisions:
- issue: രാജാവിന്റെ വിശ്വാസത്യാഗത്തെക്കുറിച്ചുള്ള വിലയിരുത്തൽസൂത്രം
  choice: ‘പാപങ്ങൾ’, ‘പാപം ചെയ്യിച്ച’ എന്നീ വ്യക്തമായ നൈതിക പദങ്ങൾ നിലനിർത്തി.
  alternative: ‘ആചാരങ്ങൾ’, ‘തെറ്റിലേക്ക് നയിച്ചു’ എന്നിങ്ങനെ മൃദുവാക്കുക.
  rationale: എബ്രായപാഠം യൊരോബെയാമിന്റെ മാതൃകയെ വ്യക്തമായി പാപമായി വിലയിരുത്തുന്നു; അതിനെ രാഷ്ട്രീയമോ ആരാധനാക്രമപരമോ ആയ വ്യതിയാനമായി മാത്രം അവതരിപ്പിക്കുന്നത് പാഠത്തിന്റെ സ്വന്തം ദൈവശാസ്ത്രപരമായ വിധിയെ ക്ഷയിപ്പിക്കും.
- issue: ബന്ധവാക്യത്തിന്റെ സൂചന
  choice: ‘ഇസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച പാപങ്ങൾ’ എന്ന രൂപത്തിൽ പാപങ്ങളെ ബന്ധവാക്യത്തിന്റെ മുൻപദമായി നിലനിർത്തി.
  alternative: ‘അവയിലൂടെ അവൻ ഇസ്രായേലിനെ പാപത്തിലേക്കു നയിച്ചു’ എന്ന ഉപകരണാർത്ഥ വ്യാഖ്യാനം.
  rationale: אֲשֶׁר എന്ന ബന്ധസർവനാമത്തിന്റെ സൂചനയിൽ ചെറിയ ഘടനാപരമായ അസ്പഷ്ടതയുണ്ടെങ്കിലും, പാപങ്ങളോടുള്ള നേരിട്ടുള്ള ബന്ധം നിലനിർത്തുന്ന രൂപം എബ്രായ വാക്യക്രമത്തോട് അടുത്തതാണ്; കാരണാർത്ഥക്രിയയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പറ്റിച്ചേർന്നുനിന്നു’ എന്നത് דבק എന്ന ക്രിയയുടെ ദൃഢവും തുടർച്ചയുള്ളതുമായ അർത്ഥം നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നമായ [a] മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
