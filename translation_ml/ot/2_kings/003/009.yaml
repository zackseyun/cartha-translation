  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേൽ രാജാവ് യെഹൂദാ രാജാവിനോടും എദോം രാജാവിനോടുംകൂടെ പുറപ്പെട്ടു. അവർ ഏഴു ദിവസത്തെ യാത്രാമാർഗത്തിലൂടെ ചുറ്റി സഞ്ചരിച്ചു; എന്നാൽ പാളയത്തിനും അവരോടൊപ്പമുണ്ടായിരുന്ന മൃഗങ്ങൾക്കും[a] വെള്ളമില്ലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവരുടെ കാലടിയിൽ ഉണ്ടായിരുന്ന മൃഗങ്ങൾ’; അവരോടൊപ്പം സഞ്ചരിച്ച മൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പുറപ്പെട്ടു
  rationale: הלך എന്ന സാധാരണ ഗതിവാചകത്തിന് ഇവിടെ ഒരു യാത്രയുടെയോ സൈനികനീക്കത്തിന്റെയോ തുടക്കം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ‘പടനീങ്ങി’ എന്ന അധിക സൈനികനിറം ചേർക്കുന്നില്ല.
- source_word: מֶלֶךְ יִשְׂרָאֵל ... וּמֶלֶךְ יְהוּדָה ... וּמֶלֶךְ אֱדוֹם
  choice: ഇസ്രായേൽരാജാവും യെഹൂദാരാജാവും എദോംരാജാവും
  rationale: മൂന്നു രാജാക്കന്മാരെയും പ്രത്യേകം പരാമർശിക്കുന്ന എബ്രായ ഏകോപനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּסֹבּוּ
  choice: അവർ ... ചുറ്റിസഞ്ചരിച്ചു
  rationale: סבב സൂചിപ്പിക്കുന്ന നേരിട്ടല്ലാത്ത, ചുറ്റിയുള്ള യാത്രയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസത്തെ വഴി
  rationale: דֶּרֶךְ എന്നതിലെ ‘വഴി/യാത്ര’ എന്ന അർഥവ്യാപ്തിയും ഏഴു ദിവസത്തെ യാത്രാദൈർഘ്യവും അമിതമായി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא הָיָה מַיִם
  choice: വെള്ളമുണ്ടായിരുന്നില്ല
  rationale: അസ്തിത്വനിഷേധവാക്യത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: לַמַּחֲנֶה
  choice: പാളയത്തിന്
  rationale: מַחֲנֶה എന്നതിന് സന്ദർഭോചിതമായ പൊതുവായ അർഥം; ‘സൈനികപ്പാളയം’ എന്ന് അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: וְלַבְּהֵמָה
  choice: കന്നുകാലികൾക്ക്
  rationale: സൈന്യത്തോടൊപ്പം വന്ന വളർത്തുമൃഗങ്ങളെയും ചുമട്ടുമൃഗങ്ങളെയും കൂട്ടമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: അവരോടൊപ്പമുണ്ടായിരുന്ന
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ കാലടിയിൽ ഉണ്ടായിരുന്ന’ എന്ന എബ്രായ ശൈലിയുടെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥചിത്രം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
