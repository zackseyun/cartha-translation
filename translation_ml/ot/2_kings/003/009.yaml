  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ചുറ്റിയുള്ള ഏഴുദിവസത്തെ യാത്രയും വെള്ളത്തിന്റെ പൂർണ അഭാവവും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചേരേണ്ടത് ‘കന്നുകാലികൾ’ എന്ന പ്രയോഗത്തോടായതിനാൽ അതിന്റെ പിന്നാലെയാണ് [a] നൽകിയിരിക്കുന്നത്.
