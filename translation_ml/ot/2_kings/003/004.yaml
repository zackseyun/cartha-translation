  text: Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
translation:
  language: ml
  text: മോവാബ് രാജാവായ മേശാ ആടുവളർത്തുകാരനായിരുന്നു. അവൻ യിസ്രായേൽ രാജാവിന് കപ്പമായി ഒരു ലക്ഷം കുഞ്ഞാടുകളെയും ഒരു ലക്ഷം ആട്ടുകൊറ്റന്മാരിൽനിന്നുള്ള കമ്പിളിരോമവും കൊടുത്തുപോന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഒരു ലക്ഷം ആട്ടുകൊറ്റന്മാർ, കമ്പിളിരോമം.” ഈ ചുരുക്കപ്രയോഗത്തിന് “കമ്പിളിരോമമുള്ള ഒരു ലക്ഷം ആട്ടുകൊറ്റന്മാർ” എന്നോ, സന്ദർഭത്തിൽ കൂടുതൽ സാധ്യതയുള്ളതുപോലെ, “ഒരു ലക്ഷം ആട്ടുകൊറ്റന്മാരിൽനിന്നുള്ള കമ്പിളിരോമം” എന്നോ അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹקֵד
  choice: ആടുവളർത്തുകാരൻ
  rationale: ആടുകളെ വളർത്തുന്ന തൊഴിലിലും സമ്പദ്‌വ്യവസ്ഥയിലും ഏർപ്പെട്ടിരുന്ന ഒരാളെ സൂചിപ്പിക്കുന്ന പദം. പഴഞ്ചൻ തൊഴിൽപ്പേരിനു പകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളം ഉപയോഗിച്ചു.
- source_word: וְהֵשִׁיב
  choice: കൊടുത്തുപോന്നു
  rationale: ഇവിടെ ഹിഫീൽ രൂപം രാജാവിന് പതിവായി കപ്പം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയുടെ ഭാവം ‘കൊടുത്തുപോന്നു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מֵאָה אֶלֶף כָּרִים
  choice: ഒരു ലക്ഷം കുഞ്ഞാടുകൾ
  rationale: כָּרִים എന്നത് കുഞ്ഞാടുകളെയോ പ്രായം കുറഞ്ഞ ആൺചെമ്മരിയാടുകളെയോ സൂചിപ്പിക്കാം; കപ്പപ്പട്ടികയുടെ സന്ദർഭത്തിൽ ‘കുഞ്ഞാടുകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֵילִים צָמֶר
  choice: ഒരു ലക്ഷം ആട്ടുകൊറ്റന്മാരിൽനിന്നുള്ള കമ്പിളിരോമം
  rationale: എബ്രായത്തിൽ ‘ആട്ടുകൊറ്റന്മാർ, കമ്പിളിരോമം’ എന്ന ചുരുക്കപ്രയോഗമാണ്. ആട്ടുകൊറ്റന്മാരെ തന്നെയല്ല, അവയിൽനിന്നുള്ള കമ്പിളിരോമമാണ് കപ്പമായി നൽകിയതെന്ന സന്ദർഭസാധ്യമായ അർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മൂലത്തിലെ ചുരുക്കം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ מוֹאָב / מֶלֶךְ יִשְׂרָאֵל
  choice: മോവാബ് രാജാവ് / യിസ്രായേൽ രാജാവ്
  rationale: എബ്രായത്തിലെ ഘടകബന്ധത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; രാജപദവി വിവർത്തനം ചെയ്യുകയും സ്ഥല-ജനനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
