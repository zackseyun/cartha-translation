translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിൽ വ്യക്തമായ കാലസൂചകപദമില്ലാത്തതിനാൽ വാക്യാരംഭത്തിൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. കപ്പം പതിവായി നൽകിയിരുന്നതിന്റെ ഭാവം ‘കൊടുത്തുപോന്നു’ എന്നതിലൂടെ പ്രകടമാക്കി. അടിക്കുറിപ്പ് യഥാർത്ഥത്തിൽ വിശദീകരിക്കുന്ന ‘കമ്പിളിരോമം’ എന്ന പ്രയോഗത്തിനുശേഷമാണ് [a] നൽകിയിരിക്കുന്നത്.
