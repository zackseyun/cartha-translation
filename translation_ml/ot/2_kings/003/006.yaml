  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ശമര്യ’ എന്ന പരമ്പരാഗതവും വ്യാപകമായി മനസ്സിലാകുന്നതുമായ സ്ഥലനാമരൂപവും ‘യെഹോരാം’ എന്ന ലിപ്യന്തരണവും ഉപയോഗിച്ചു; פקד എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
