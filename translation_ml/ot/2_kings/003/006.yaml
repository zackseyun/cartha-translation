  text: So King Jehoram went out from Samaria that day and mustered all Israel[a].
translation:
  language: ml
  text: അന്നു യെഹോരാം രാജാവ് ശമര്യയിൽനിന്ന് പുറപ്പെട്ട് ഇസ്രായേലിനെ മുഴുവൻ അണിനിരത്തി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേലിനെ മുഴുവൻ എണ്ണിത്തിട്ടപ്പെടുത്തി’ അല്ലെങ്കിൽ ‘പരിശോധിച്ചു.’ എബ്രായക്രിയയ്ക്ക് ആളുകളെ എണ്ണുക എന്നോ സൈന്യത്തെ കണക്കെടുത്ത് അണിനിരത്തുക എന്നോ അർഥമാകാം; ഇവിടെ യുദ്ധസന്ദർഭം സൈനികമായ അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ഗതിയർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സൈനികഭാവം അടുത്ത ക്രിയയിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ ഇവിടെ അതു അധികമായി ചേർക്കുന്നില്ല.
- source_word: הַמֶּלֶךְ יְהוֹרָם
  choice: യെഹോരാം രാജാവ്
  rationale: എബ്രായത്തിലെ പദക്രമം മലയാളത്തിലെ സ്വാഭാവികമായ സ്ഥാനപ്പേരോടുകൂടിയ നാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നു
  rationale: ‘ആ ദിവസം’ എന്ന കാലസൂചനയെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: מִשֹּׁמְרוֹן
  choice: ശമര്യയിൽനിന്ന്
  rationale: מן സൂചിപ്പിക്കുന്ന പുറപ്പെടുന്ന സ്ഥലത്തെ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּפְקֹד
  choice: സൈനികസേവനത്തിനായി അണിനിരത്തി
  rationale: פקד എന്നതിന് എണ്ണുക, പരിശോധിക്കുക, സൈന്യത്തെ കണക്കെടുത്ത് അണിനിരത്തുക എന്നീ അർഥങ്ങളുണ്ട്. തുടർന്നുള്ള യുദ്ധസന്ദർഭത്തിൽ സൈനികമായ അർഥമാണ് മുൻതൂക്കം; മലയാളത്തിൽ ‘അണിനിരത്തി’ മാത്രം സൈനികസന്ദർഭം എല്ലായ്പ്പോഴും വ്യക്തമാക്കാത്തതിനാൽ ഉദ്ദേശ്യം സൂചിപ്പിച്ചു.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ മുഴുവൻ
  rationale: ജനതയെയോ രാജ്യത്തിന്റെ സൈനികശേഷിയെയോ കൂട്ടായ നിലയിൽ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം നിലനിർത്തുന്നു.
