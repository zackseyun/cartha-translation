reference: 2 Kings 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣לֶךְ יִשְׂרָאֵ֑ל אֲהָ֕הּ כִּֽי קָרָ֣א יְהוָ֗ה לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽ രാജാവ് പറഞ്ഞു: “അയ്യോ! ഈ മൂന്ന് രാജാക്കന്മാരെ മോവാബിന്റെ കൈയിൽ ഏൽപ്പിക്കാൻ യഹ്‌വേ വിളിച്ചിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിളിച്ചിരിക്കുന്നു” എന്നതിന് “വിളിച്ചുകൂട്ടിയിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രു ക്രിയയുടെ അടിസ്ഥാനാർഥം “വിളിക്കുക” എന്നാണ്. “മോവാബിന്റെ കൈയിൽ” എന്നത് “മോവാബിന്റെ അധികാരത്തിൽ” എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗമാണ്.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: ഹീബ്രു സംയുക്തപ്രയോഗത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം; ഈ വാക്യത്തിൽ പേര് പറയാത്തതിനാൽ പദവി നിലനിർത്തുന്നു.
- source_word: אֲהָהּ
  choice: അയ്യോ!
  rationale: ദുഃഖവും പരിഭ്രമവും പ്രകടിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള ആശ്ചര്യോദ്ഗാരം.
- source_word: קָרָא
  choice: വിളിച്ചുകൂട്ടിയിരിക്കുന്നു
  rationale: ഇവിടെ മൂന്നു രാജാക്കന്മാരെ ഒരുമിച്ചു വരുത്തിയതിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിത രൂപം; ‘വിളിച്ചു’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ഈ മൂന്നു രാജാക്കന്മാരെയും
  rationale: നിശ്ചിതമായ മൂവർ അടങ്ങുന്ന സഖ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ കർമവിഭക്തി തുടർന്നുള്ള ക്രിയയുമായി യോജിക്കുന്നു.
- source_word: לָתֵת אֹתָם
  choice: ഏല്പിക്കാനായി
  rationale: ശത്രുവിന്റെ അധികാരത്തിന് കീഴിൽ കൈമാറുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּיַד מוֹאָב
  choice: മോവാബിന്റെ കൈയിൽ
  rationale: ‘മോവാബിന്റെ അധികാരത്തിൽ’ എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗത്തിലെ ‘കൈ’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്; അത് സ്ഥാനപ്പേരായി പകരാതെ മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം നിലനിർത്തുന്നു.
- issue: קָרָא ദൈവിക വിളിയെയോ ഒരുമിച്ചുകൂട്ടലിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: വിളിച്ചുകൂട്ടിയിരിക്കുന്നു
  alternative: വിളിച്ചിരിക്കുന്നു
  rationale: ‘വിളിക്കുക’ എന്ന ശാബ്ദിക അർഥവും ഈ മൂന്നു രാജാക്കന്മാർ ഒരുമിച്ചു വന്നിരിക്കുന്ന സന്ദർഭവും ഒരുമിച്ച് പ്രതിഫലിപ്പിക്കുന്നു; രാജാവിന്റെ നിരാശാഭരിതമായ വ്യാഖ്യാനത്തെ വിവർത്തകന്റെ വസ്തുനിഷ്ഠ പ്രസ്താവനയാക്കി മാറ്റുന്നില്ല.
- issue: രാജാവിന്റെ പ്രസ്താവന ദൈവിക ഉദ്ദേശ്യത്തെ വസ്തുതയായി ഉറപ്പിക്കുന്നുണ്ടോ
  choice: നേരിട്ടുള്ള പ്രസംഗമായി അതേ ആരോപണം നിലനിർത്തുന്നു
  alternative: യഹോവ അങ്ങനെ ചെയ്തുവെന്ന് ആഖ്യാതാവ് ഉറപ്പിക്കുന്നു എന്ന രീതിയിൽ പുനരാഖ്യാനം
  rationale: ഇത് ഇസ്രായേൽരാജാവിന്റെ ഭീതിപൂർണമായ വിലയിരുത്തലാണ്; വിവർത്തനം അതിന്റെ വക്താവിനെയും ദൈവശാസ്ത്രപരമായ സംഘർഷത്തെയും നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ആഖ്യാനശൈലി. ‘അയ്യോ’ സംസാരത്തിന്റെ വികാരതീവ്രത നൽകുന്നു; ‘മോവാബിന്റെ കൈയിൽ’ മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം സംരക്ഷിക്കുന്നു.
