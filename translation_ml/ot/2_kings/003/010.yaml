  source_fidelity: The draft accurately retains the speaker, the three kings, and the purpose of their being handed over to Moab. However, ‘വിളിച്ചുകൂട്ടിയിരിക്കുന്നു’ expands קָרָא (‘has called’) to ‘has gathered/called together,’ an interpretation the Hebrew verb itself does not state. The divine name should also follow the audit trail’s Yahweh rendering rather than use the distinct traditional form ‘യഹോവ.’
