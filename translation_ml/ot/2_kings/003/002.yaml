source:
  edition: WLC
  text: וַ/יַּעֲשֶׂ֤ה הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֥א כְ/אָבִ֖י/ו וּ/כְ/אִמּ֑/וֹ וַ/יָּ֨סַר֙ אֶת מַצְּבַ֣ת הַ/בַּ֔עַל אֲשֶׁ֥ר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
translation:
  language: ml
  text: അവൻ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മ പ്രവർത്തിച്ചു; എന്നാൽ തന്റെ അപ്പനെയും അമ്മയെയുംപോലെയല്ല.[a] തന്റെ അപ്പൻ ഉണ്ടാക്കിയ ബാലിന്റെ ആരാധനാസ്തംഭം[b] അവൻ നീക്കിക്കളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “മാത്രം, തന്റെ അപ്പനെയും അമ്മയെയുംപോലെയല്ല.” ഇവിടെ എബ്രായപദം മുൻപുള്ള വിലയിരുത്തലിനെ പരിമിതപ്പെടുത്തുന്നു: അവൻ തിന്മ പ്രവർത്തിച്ചു, എന്നാൽ അവന്റെ തിന്മ മാതാപിതാക്കളുടെ തിന്മപോലെ ആയിരുന്നില്ല.'
    reason: lexical_alternative
  - marker: b
    text: “ബാലിന്റെ വിശുദ്ധസ്തംഭം” അല്ലെങ്കിൽ “ബാലിന്റെ നിവർന്നുനിൽക്കുന്ന കല്ല്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ബാൽ ആരാധനയുമായി ബന്ധപ്പെട്ട ഒരു ആരാധനാസ്തംഭത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: അവൻ തിന്മയായതു ചെയ്തു
  rationale: עשה + הרע എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ധാർമിക വിലയിരുത്തൽ നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ‘കണ്ണുകളിൽ’ എന്ന പദാനുപദ രൂപത്തിനു പകരം, യഹ്‌വെയുടെ വിലയിരുത്തലിൽ എന്ന അർഥം നൽകുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള ശബ്ദലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: רַק לֹא כְאָבִיו וּכְאִמּוֹ
  choice: എങ്കിലും തന്റെ അപ്പനെയും അമ്മയെയുംപോലെയല്ല
  rationale: רַק ഇവിടെ മുൻപുള്ള പ്രതികൂല വിലയിരുത്തലിനെ പരിമിതപ്പെടുത്തുന്നു. അവൻ തിന്മ ചെയ്തെങ്കിലും മാതാപിതാക്കളെപ്പോലെ ആയിരുന്നില്ല എന്ന വൈരുധ്യം ‘എങ്കിലും’ വ്യക്തമാക്കുന്നു.
- source_word: וַיָּסַר
  choice: അവൻ നീക്കിക്കളഞ്ഞു
  rationale: മൂലപാഠത്തിലെ സാധാരണ കഥനബന്ധം നിലനിർത്തി ‘നീക്കി’ എന്ന അർഥം നൽകുന്നു; വിശദീകരണബന്ധം നിർബന്ധമായി ചേർക്കുന്ന ‘കാരണം’ എന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: מַצְּבַת הַבַּעַל
  choice: ബാലിന്റെ സ്തംഭം
  rationale: מַצֵּבָה എന്നത് നിർത്തിയ കല്ലിനെയോ ആരാധനാസംബന്ധിയായ സ്തംഭത്തെയോ സൂചിപ്പിക്കുന്നു. ‘സ്തംഭം’ ചുരുക്കവും കൃത്യവുമാണ്; ആരാധനാസന്ദർഭം ‘ബാൽ’ എന്ന പേരിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: אֲשֶׁר עָשָׂה אָבִיו
  choice: തന്റെ അപ്പൻ ഉണ്ടാക്കിയ
  rationale: പ്രധാന സംഭവത്തിനു മുമ്പ് അപ്പൻ നിർമ്മിച്ച സ്തംഭത്തെയാണ് ബന്ധവാക്യം തിരിച്ചറിയിക്കുന്നത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ ദൈവനാമത്തിന്റെ ശബ്ദലിപ്യന്തരണം നൽകുന്നു; ‘യഹോവ’യെക്കാൾ എബ്രായ ഉച്ചാരണത്തിന്റെ പുനർനിർമാണത്തോട് ‘യഹ്‌വെ’ അടുത്തുനിൽക്കുന്നു.
- issue: യെഹോരാമിന്റെ തിന്മയുടെ അളവിനെക്കുറിച്ചുള്ള പ്രസ്താവന
  choice: തിന്മ ചെയ്തെങ്കിലും അപ്പനെയും അമ്മയെയുംപോലെയല്ല
  alternative: അപ്പനെയും അമ്മയെയുംപോലെ തിന്മ ചെയ്തില്ല
  rationale: വാക്യം ആദ്യം അവൻ തിന്മ ചെയ്തുവെന്ന് വ്യക്തമായി വിധിക്കുകയും തുടർന്ന് അതിനെ പരിമിതപ്പെടുത്തുകയും ചെയ്യുന്നു. വിവർത്തനം ഈ ധാർമിക സംഘർഷം ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘ദൃഷ്ടിയിൽ’ എന്ന പരിചിതമായ ബൈബിൾപ്രയോഗം നിലനിർത്തുമ്പോഴും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ സ്ഥാപിച്ചു.
