id: 2KI.3.15
reference: 2 Kings 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֖ה קְחוּ לִ֣/י מְנַגֵּ֑ן וְ/הָיָה֙ כְּ/נַגֵּ֣ן הַֽ/מְנַגֵּ֔ן וַ/תְּהִ֥י עָלָ֖י/ו יַד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
translation:
  language: ml
  text: “എന്നാൽ ഇപ്പോൾ, ഒരു വാദ്യക്കാരനെ[a] എന്റെ അടുക്കൽ കൊണ്ടുവരൂ.” വാദ്യക്കാരൻ വായിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, യാഹ്‌വെയുടെ കൈ[b] അവന്റെമേൽ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വാദ്യം വായിക്കുന്ന ഒരാൾ.” ഏത് വാദ്യമാണെന്ന് എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: “യാഹ്‌വെയുടെ കൈ” എന്നത് ദൈവിക ശക്തിയെയോ പ്രവാചകപ്രേരണയെയോ സൂചിപ്പിക്കാവുന്ന എബ്രായ ഭാഷാശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻവാക്കുകളിൽനിന്ന് ഉടൻ ചെയ്യേണ്ട കാര്യത്തിലേക്കുള്ള തിരിവ് സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ ഇപ്പോൾ’ എന്നത് ആ സന്ദർഭമാറ്റം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: קְחוּ לִי
  choice: എന്റെ അടുക്കൽ കൊണ്ടുവരൂ
  rationale: ബഹുവചന ആജ്ഞയും ദാതൃസർവനാമവും ചേർന്ന പ്രയോഗം സംസാരിക്കുന്നവന്റെ അടുക്കൽ ഒരാളെ കൊണ്ടുവരുക എന്ന അർഥത്തിലാണ്.
- source_word: מְנַגֵּן
  choice: ഒരു വാദ്യക്കാരൻ
  rationale: נגן എന്ന ധാതുവിൽനിന്നുള്ള ഈ പദം ഒരു സംഗീതോപകരണം വായിക്കുന്നയാളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; പ്രത്യേക വാദ്യം മൂലപാഠത്തിൽ പറയുന്നില്ല.
- source_word: וְהָיָה כְּנַגֵּן הַמְנַגֵּן
  choice: വാദ്യക്കാരൻ വായിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: അടുത്ത സംഭവം നടന്ന സമയസാഹചര്യം ഈ ഘടന വ്യക്തമാക്കുന്നു; എബ്രായ ആഖ്യാനസൂത്രം യാന്ത്രികമായി പകർത്താതെ അതിന്റെ കാലസംബന്ധമായ അർഥം നിലനിർത്തുന്നു.
- source_word: יַד יְהוָה
  choice: യാഹ്‌വെയുടെ കൈ
  rationale: ദൈവിക ശക്തിയെയോ പ്രവാചകസ്വാധീനത്തെയോ സൂചിപ്പിക്കാവുന്ന എബ്രായ ഭാഷാശൈലിയാണിത്; ‘കൈ’ എന്ന ബിംബം നിലനിർത്തുന്നത് അർഥം അനാവശ്യമായി ചുരുക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ ഉച്ചാരണത്തെ മലയാളത്തിൽ അടുപ്പിച്ച് നൽകുന്നു.
- source_word: וַתְּהִי עָלָיו
  choice: അവന്റെമേൽ വന്നു
  rationale: ദൈവിക പ്രവർത്തനമോ പ്രവാചകപ്രേരണയോ ഒരാളിൽ ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സംഭവാത്മക പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവികൊണ്ട് പകരാതെ സംരക്ഷിക്കുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യാഹ്‌വെ’ ഹീബ്രു നാമത്തിന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് അടുത്തതാണ്.
- issue: יַד יְהוָה എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: യാഹ്‌വെയുടെ കൈ അവന്റെമേൽ വന്നു
  alternative: യാഹ്‌വെയുടെ ശക്തി അവന്റെമേൽ വന്നു; യാഹ്‌വെയുടെ പ്രവാചകപ്രേരണ അവനുണ്ടായി
  rationale: സന്ദർഭത്തിൽ ഇത് പ്രവാചകപ്രേരണയെയോ ദൈവിക ശക്തിയെയോ സൂചിപ്പിച്ചേക്കാം; എന്നാൽ മൂലപാഠത്തിന്റെ ബിംബവും അർഥവ്യാപ്തിയും നിലനിർത്താൻ അതിനെ കൂടുതൽ നിർദിഷ്ടമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സംഗീതജ്ഞൻ’ എന്ന വിശാലപദത്തിനുപകരം ഉപകരണം വായിക്കുന്നയാൾ എന്ന മൂലാർത്ഥം വ്യക്തമാക്കാൻ ‘വാദ്യക്കാരൻ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനം ഭാഗികമായി നിലനിർത്തിയും മലയാളത്തിലെ അനാവശ്യ ഭാരത്വം ഒഴിവാക്കിയും വാക്യം രൂപപ്പെടുത്തി.
