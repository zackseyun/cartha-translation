  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ കഥനത്തിന്റെ ലളിതമായ മുന്നേറ്റവും ചോദ്യോത്തരഘടനയും നിലനിർത്തി.
