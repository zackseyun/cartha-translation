language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֵי זֶ֥ה הַ/דֶּ֖רֶךְ נַעֲלֶ֑ה וַ/יֹּ֕אמֶר דֶּ֖רֶךְ מִדְבַּ֥ר אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/008.yaml
  text: And he said[a], “Which way shall we go up?” And he said, “By the way of the wilderness of Edom.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നാം ഏത് വഴിയിലൂടെ കയറിപ്പോകും?” അവൻ പറഞ്ഞു: “ഏദോമിന്റെ മരുഭൂമിയിലൂടെയുള്ള വഴി.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഏദോമിന്റെ മരുഭൂമിവഴി.”'
    reason: דֶּרֶךְ מִדְבַּר אֱדוֹם എന്ന എബ്രായ പ്രയോഗത്തിലെ വഴിയെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തമായ മറ്റൊരു മലയാളരൂപം.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ ചോദിച്ചു / അവൻ മറുപടി പറഞ്ഞു
  rationale: ആദ്യ സന്ദർഭത്തിൽ നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ ‘ചോദിച്ചു’ എന്നും രണ്ടാമത്തേതിൽ അതിനുള്ള ഉത്തരം വരുന്നതിനാൽ ‘മറുപടി പറഞ്ഞു’ എന്നും സ്വാഭാവികമായി വ്യക്തമാക്കി; രണ്ടും אמר എന്ന ക്രിയയുടെ സന്ദർഭാനുസൃത പ്രയോഗങ്ങളാണ്.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: ഏതു വഴിയിലൂടെ
  rationale: אֵי זֶה എന്ന ചോദ്യം ഇവിടെ പല വഴികളിൽ ഏതാണ് ഉദ്ദേശിക്കുന്നത് എന്നു ചോദിക്കുന്നു; ‘ഏതു വഴിയിലൂടെ’ എന്നത് ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: נַעֲלֶה
  choice: നാം ... കയറിപ്പോകണം
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ എന്ന അടിസ്ഥാനചലനം നിലനിർത്തുന്നു; ‘പടയേറുക’ എന്നു വിവർത്തനം ചെയ്ത് സൈനികസൂചന അധികമായി ചേർക്കുന്നില്ല.
- source_word: דֶּרֶךְ מִדְבַּר אֱדוֹם
  choice: ഏദോം മരുഭൂമിയിലൂടെയുള്ള വഴി
  rationale: ക്രിയയില്ലാത്ത എബ്രായ മറുപടി ഒരു യാത്രാമാർഗം നിർദേശിക്കുന്നു. ‘മരുഭൂമി’ מִדְבַּר എന്നതിന്റെ സാധാരണ സമാനപദമാണ്; construct ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱדוֹם
  choice: ഏദോം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
