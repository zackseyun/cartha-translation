  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלִישָׁ֜ע אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ מַה לִּ֣/י וָ/לָ֔/ךְ לֵ֚ךְ אֶל נְבִיאֵ֣י אָבִ֔י/ךָ וְ/אֶל נְבִיאֵ֖י אִמֶּ֑/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אַ֗ל כִּֽי קָרָ֤א יְהוָה֙ לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: ml
  text: 'എലീശാ ഇസ്രായേൽ രാജാവിനോട് പറഞ്ഞു: “എനിക്കും നിനക്കും തമ്മിൽ എന്ത് കാര്യം?[a] നിന്റെ അപ്പന്റെ പ്രവാചകന്മാരുടെയും നിന്റെ അമ്മയുടെ പ്രവാചകന്മാരുടെയും അടുക്കൽ ചെല്ലുക.” എന്നാൽ ഇസ്രായേൽ രാജാവ് അവനോട് പറഞ്ഞു: “അല്ല, കാരണം[b] ഈ മൂന്നു രാജാക്കന്മാരെയും മോവാബിന്റെ കൈയിൽ ഏല്പിക്കാനായി യഹ്‌വെ വിളിച്ചുകൂട്ടിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “എനിക്കും നിനക്കും എന്ത്?” അകലം പാലിക്കലോ നിരാകരണമോ പ്രകടിപ്പിക്കുന്ന ഒരു എബ്രായ പ്രയോഗമാണിത്.'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ദയവായി അരുതേ; കാരണം.” എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; ഇതിനെ തുറന്ന എതിർപ്പോ അപേക്ഷാപൂർവമായ അഭ്യർഥനയോ ആയി മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: എനിക്കും നിനക്കും തമ്മിൽ എന്ത് കാര്യം?
  rationale: അകലം പാലിക്കലോ നിരാകരണമോ പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകവും താക്കീതിന്റെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֵךְ
  choice: ചെല്ലുക
  rationale: ലളിതമായ ആജ്ഞാരൂപം മാന്യവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് പകർത്തുന്നു.
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  choice: നിന്റെ അപ്പന്റെ പ്രവാചകന്മാരുടെയും നിന്റെ അമ്മയുടെ പ്രവാചകന്മാരുടെയും അടുക്കൽ
  rationale: രാജകുടുംബവുമായി ബന്ധപ്പെട്ട പ്രവാചകരെക്കുറിച്ചുള്ള മൂർച്ചയുള്ള പരാമർശം പൊതുവാക്കാതെ നിലനിർത്തുന്നു.
- source_word: אַל כִּי
  choice: അരുതേ;
  rationale: ദുഷ്കരവും സംക്ഷിപ്തവുമായ പ്രയോഗത്തെ എലീശായുടെ നിരാകരണത്തോടുള്ള പ്രതിഷേധമോ അപേക്ഷയോ ആയി വായിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിക്കുന്നു; അടിക്കുറിപ്പിൽ മറ്റു സാധ്യത വ്യക്തമാക്കുന്നു.
- source_word: קָרָא
  choice: വിളിച്ചുകൂട്ടിയത്
  rationale: ഇവിടെ മൂന്നു രാജാക്കന്മാരെയും ഒന്നിച്ചു വരുത്തിയെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; വെറും ‘വിളിച്ചു’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ഈ മൂന്നു രാജാക്കന്മാരെയും
  rationale: സംഖ്യയും സൂചകപദവും രാജാക്കന്മാർ എന്ന പദവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: לָתֵת אוֹתָם
  choice: ഏല്പിക്കാനാണ്
  rationale: തുടർന്നുള്ള ‘കൈയിൽ’ എന്ന അധികാരരൂപകത്തോടൊപ്പം ഉദ്ദേശ്യം/ഫലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּיַד מוֹאָב
  choice: മോവാബിന്റെ കൈയിൽ
  rationale: മോവാബിന്റെ അധികാരത്തിൽ ഏല്പിക്കപ്പെടുക എന്ന അർഥമുള്ള എബ്രായ കൈ-രൂപകം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രഗ്രാമറ്റോൺ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: אַל כִּי എന്ന രാജാവിന്റെ മറുപടിയുടെ ഭാവം
  choice: ‘അരുതേ’—എലീശായുടെ നിരാകരണത്തോടുള്ള അപേക്ഷാപൂർവമായ പ്രതിഷേധം
  alternative: ‘ഇല്ല, കാരണം’; ‘അയ്യോ, കാരണം’
  rationale: എബ്രായം ദുഷ്കരവും അർഥസങ്കുചിതവുമാണ്. സന്ദർഭത്തിൽ രാജാവ് എലീശായുടെ തള്ളിക്കളയലിനെ എതിർക്കുന്നു; അപേക്ഷയും പ്രതിഷേധവും തമ്മിലുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അപ്പൻ/അമ്മ’ എന്ന നേരിട്ടുള്ള കുടുംബപദങ്ങൾ മൂലത്തിന്റെ മൂർച്ച നിലനിർത്തുന്നു; ‘പ്രവാചകന്മാർ’ ബൈബിൾപരമായ ഗൗരവം കാത്തുസൂക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
