revisions:
- from: 'എലീശാ ഇസ്രായേൽരാജാവിനോട് പറഞ്ഞു: “എനിക്കും നിനക്കും തമ്മിൽ എന്ത് കാര്യം?[a] നിന്റെ അപ്പന്റെ പ്രവാചകന്മാരുടെയും നിന്റെ അമ്മയുടെ പ്രവാചകന്മാരുടെയും അടുക്കൽ ചെല്ലുക.” എന്നാൽ ഇസ്രായേൽരാജാവ് അവനോട് പറഞ്ഞു: “അരുതേ;[b] യഹ്‌വെ ഈ മൂന്നു രാജാക്കന്മാരെയും മോവാബിന്റെ കൈയിൽ ഏല്പിക്കാനാണ് വിളിച്ചുകൂട്ടിയത്.”'
  to: 'എലീശാ ഇസ്രായേൽ രാജാവിനോട് പറഞ്ഞു: “എനിക്കും നിനക്കും തമ്മിൽ എന്ത് കാര്യം?[a] നിന്റെ അപ്പന്റെ പ്രവാചകന്മാരുടെയും നിന്റെ അമ്മയുടെ പ്രവാചകന്മാരുടെയും അടുക്കൽ ചെല്ലുക.” എന്നാൽ ഇസ്രായേൽ രാജാവ് അവനോട് പറഞ്ഞു: “അല്ല, കാരണം[b] ഈ മൂന്നു രാജാക്കന്മാരെയും മോവാബിന്റെ കൈയിൽ ഏല്പിക്കാനായി യഹ്‌വെ വിളിച്ചുകൂട്ടിയിരിക്കുന്നു.”'
  rationale: ദുഷ്കരമായ אַל כִּי-യ്ക്ക് സന്ദർഭത്തിൽ കൂടുതൽ സാധ്യതയുള്ള പ്രതിഷേധവായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; അപേക്ഷാപരമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. കൂടാതെ, സംയുക്തനാമത്തിന്റെ എഴുത്തുരീതി സാധാരണ ആധുനിക മലയാളരീതിയിലാക്കി; മറ്റു പ്രധാന പദങ്ങളും രൂപകങ്ങളും നിലനിർത്തി.
