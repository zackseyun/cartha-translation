lexical_decisions:
- source_word: מַחֲנֵה
  choice: പാളയം
  rationale: യുദ്ധസന്ദർഭത്തിലെ സൈനിക താവളത്തെ സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּקֻמוּ
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ദൃശ്യമായ ആഖ്യാനചലനം നിലനിർത്തുന്നു; ‘ആക്രമിക്കാൻ തുടങ്ങി’ എന്നു വ്യാഖ്യാനിച്ച് വിപുലീകരിക്കുന്നില്ല.
- source_word: וַיַּכּוּ
  choice: ആക്രമിച്ചു
