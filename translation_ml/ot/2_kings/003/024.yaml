- source_word: וַיָּנֻסוּ מִפְּנֵיהֶם
  choice: അവരുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി
  rationale: എബ്രായ പ്രയോഗത്തിലെ ‘അവരുടെ സന്നിധിയിൽനിന്ന്/മുമ്പിൽനിന്ന്’ എന്ന ചിത്രവും സൈനിക പരാജയോടലിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: וַיָּבֹאוּ בָהּ
  choice: അതിലേക്കു കടന്നുചെന്ന്
  rationale: בוא എന്നതിന്റെ പ്രവേശനചലനവും בָהּ എന്ന സ്ത്രീലിംഗ ഏകവചന പ്രത്യയത്തിന്റെ വ്യക്തമാക്കാത്ത പൂർവപദവും സംരക്ഷിക്കുന്നു.
- source_word: וְהַכּוֹת
  choice: ആക്രമിച്ചുകൊണ്ടിരുന്നു
  rationale: തുടർന്നുനിൽക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ക്രിയാരൂപത്തിന്റെ ദൈർഘ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מוֹאָב
  choice: മോവാബ് / മോവാബ്യർ
  rationale: രാജ്യത്തെയോ ജനസമൂഹത്തെയോ സൂചിപ്പിക്കുന്ന സന്ദർഭാനുസൃത കൂട്ടർഥം നിലനിർത്തുന്നു; സർവനാമങ്ങളുടെ കർത്താക്കൾ മാറുന്നതിനാൽ വ്യക്തത ആവശ്യമായിടത്ത് ‘മോവാബ്യർ’ ഉപയോഗിക്കുന്നു.
