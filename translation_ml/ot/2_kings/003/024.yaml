  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
translation:
  language: ml
  text: മോവാബ്യർ ഇസ്രായേലിന്റെ പാളയത്തിലെത്തിയപ്പോൾ, ഇസ്രായേല്യർ എഴുന്നേറ്റ് മോവാബിനെ ആക്രമിച്ചു; മോവാബ്യർ അവരുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി. തുടർന്ന് ഇസ്രായേല്യർ അതിലേക്കു കടന്നുചെന്ന്[a] മോവാബിനെ ആക്രമിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവർ ദേശത്തേക്കു കടന്നുചെന്നു’ അല്ലെങ്കിൽ ‘അവർ മോവാബിലേക്കു മുന്നേറി.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘അവർ അതിലേക്കു കടന്നുചെന്നു’ എന്നാണ്. അവിടെയുള്ള സ്ത്രീലിംഗ ഏകവചനപ്രത്യയം ജനത്തെക്കാൾ ദേശത്തെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നതാകാനാണ് കൂടുതൽ സാധ്യത.
