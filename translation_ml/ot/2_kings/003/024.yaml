translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിൽ ആവർത്തിക്കുന്ന സർവനാമങ്ങളുടെ കർത്താക്കൾ മാറുന്നതിനാൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘മോവാബ്യർ’, ‘ഇസ്രായേല്യർ’ എന്നിവ ആവശ്യമായിടത്ത് വ്യക്തമാക്കിയിരിക്കുന്നു. എന്നാൽ ബָהּ എന്ന പ്രത്യയത്തിന്റെ അവ്യക്തമായ പൂർവപദം പ്രധാനപാഠത്തിൽ ‘അതിലേക്കു’ എന്നു നിലനിർത്തി അടിക്കുറിപ്പിൽ സാധ്യതകൾ നൽകിയിരിക്കുന്നു.
