source:
  edition: WLC
  text: וַ/יְהִ֤י בַ/בֹּ֨קֶר֙ כַּ/עֲל֣וֹת הַ/מִּנְחָ֔ה וְ/הִנֵּה מַ֥יִם בָּאִ֖ים מִ/דֶּ֣רֶךְ אֱד֑וֹם וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ אֶת הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/020.yaml
  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
translation:
  language: ml
  text: രാവിലെ, ധാന്യയാഗം അർപ്പിക്കുന്ന സമയത്ത്[a], ഇതാ, ഏദോമിന്റെ ദിശയിൽനിന്ന്[b] വെള്ളം വന്നുകൊണ്ടിരുന്നു; ആ പ്രദേശം ആ വെള്ളംകൊണ്ട് നിറഞ്ഞു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ധാന്യയാഗം അർപ്പിക്കപ്പെട്ടപ്പോൾ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ധാന്യയാഗം ഉയരുന്ന സമയത്ത്’ എന്നാണ്; യാഗപീഠത്തിൽ അതു സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന യാഗഭാഷയാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഏദോമിന്റെ ഭാഗത്തുനിന്ന്’ / ‘ഏദോംവഴിയായി.’
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ, ‘ആ പ്രദേശം ആ വെള്ളംകൊണ്ട് നിറഞ്ഞു’; ഇവിടെ മുമ്പ് പറഞ്ഞ വെള്ളത്തെയാണ് നിർദ്ദിഷ്ടമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: രാവിലെ
  rationale: തുടർന്നുണ്ടായ സംഭവം അവതരിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനരൂപമാണ്. മലയാളത്തിൽ പ്രത്യേകമായി ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ കാലസൂചനയോടെ വാക്യം ആരംഭിക്കുന്നത് സ്വാഭാവികമായ ആഖ്യാനശൈലിയാണ്.
- source_word: בַבֹּקֶר
  choice: രാവിലെ
  rationale: സംഭവത്തിന്റെ സമയം സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പ്രയോഗം.
- source_word: כַּעֲלוֹת הַמִּנְחָה
  choice: ധാന്യയാഗം അർപ്പിക്കുന്ന സമയത്ത്
  rationale: ‘ധാന്യയാഗം ഉയരുമ്പോൾ’ എന്ന അക്ഷരാർഥത്തിനുള്ള യാഗാർപ്പണസൂചന നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: അപ്രതീക്ഷിതമായ കാഴ്ചയിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ നിപാതത്തിന്റെ ജീവന്തതയും സാഹിത്യഭാവവും നിലനിർത്തുന്നു.
- source_word: מַיִם בָּאִים
  choice: വെള്ളം വന്നുകൊണ്ടിരുന്നു
  rationale: מַיִם മലയാളത്തിൽ ഏകവചനസമൂഹനാമമായ ‘വെള്ളം’ എന്നും, പങ്കാളിത്തരൂപമായ בָּאִים കാണപ്പെടുന്ന തുടർച്ചയായ നീക്കത്തെ ‘വന്നുകൊണ്ടിരുന്നു’ എന്നും നൽകുന്നു.
- source_word: מִדֶּרֶךְ אֱדוֹם
  choice: ഏദോമിന്റെ ദിശയിൽനിന്ന്
  rationale: דֶּרֶךְ എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘വഴി’ ആണെങ്കിലും, ഇവിടെ വെള്ളം വന്ന ഭൂമിശാസ്ത്രപരമായ ദിശയോ പാതയോ ആണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֶת הַמָּיִם
  choice: ആ പ്രദേശം വെള്ളംകൊണ്ട് നിറഞ്ഞു
  rationale: הָאָרֶץ ഇവിടെ ഭൂമി മുഴുവനെയല്ല, ചുറ്റുമുള്ള നിലമോ പ്രദേശമോ സൂചിപ്പിക്കുന്നു. ‘വെള്ളംകൊണ്ട് നിറഞ്ഞു’ എന്നത് ഫലാവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
