  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷകപ്രയോഗവും യാഗസംബന്ധമായ ഭാഷയും നിലനിർത്തിയിരിക്കുന്നു; ദുഷ്കരമായ അക്ഷരാനുകരണം ഒഴിവാക്കി മൂലത്തിലെ ദൈർഘ്യഭാവവും ഭൂമിശാസ്ത്രപരമായ സൂചനയും സംരക്ഷിച്ചിരിക്കുന്നു.
