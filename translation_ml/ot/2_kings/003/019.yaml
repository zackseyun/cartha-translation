translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പ്രവചനസ്വഭാവമുള്ള നിർദേശത്തിന് ഭാവികാലരൂപം നിലനിർത്തി. മൂലപാഠത്തിലെ ആവർത്തിച്ചുള്ള ‘എല്ലാ’ എന്ന സമഗ്രത സംരക്ഷിച്ചു; അപൂർവമായ അവസാനത്തെ എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
