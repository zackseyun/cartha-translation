  text: וְ/הִכִּיתֶ֞ם כָּל עִ֤יר מִבְצָר֙ וְ/כָל עִ֣יר מִבְח֔וֹר וְ/כָל עֵ֥ץ טוֹב֙ תַּפִּ֔ילוּ וְ/כָל מַעְיְנֵי מַ֖יִם תִּסְתֹּ֑מוּ וְ/כֹל֙ הַ/חֶלְקָ֣ה הַ/טּוֹבָ֔ה תַּכְאִ֖בוּ בָּ/אֲבָנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
translation:
  language: ml
  text: കോട്ടകെട്ടിയ എല്ലാ നഗരങ്ങളെയും ശ്രേഷ്ഠമായ എല്ലാ നഗരങ്ങളെയും[a] നിങ്ങൾ ആക്രമിക്കും; എല്ലാ നല്ല വൃക്ഷങ്ങളും വെട്ടിവീഴ്ത്തും; എല്ലാ നീരുറവുകളും അടച്ചുകളയും; എല്ലാ നല്ല വയലുകളും കല്ലുകൾകൊണ്ട് നശിപ്പിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തിരഞ്ഞെടുക്കപ്പെട്ട എല്ലാ നഗരങ്ങളെയും” അല്ലെങ്കിൽ “ഏറ്റവും നല്ല എല്ലാ നഗരങ്ങളെയും.”'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായയിൽ അക്ഷരാർഥം: “കല്ലുകൾകൊണ്ട് വേദനിപ്പിക്കും.” വയലിലാകെ കല്ലുകൾ വിതറി കൃഷിക്ക് ഉപയോഗിക്കാനാകാത്തവിധം നശിപ്പിക്കുന്നതിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  choice: നിങ്ങൾ ആക്രമിക്കും
  rationale: נכה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം സൈനികസന്ദർഭത്തിൽ ‘പ്രഹരിക്കുക/ആക്രമിക്കുക’ എന്നാണ്. നഗരങ്ങൾ കർമമായതിനാൽ ആധുനിക മലയാളത്തിൽ ‘ആക്രമിക്കും’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്; ‘കീഴടക്കും’ എന്ന ഫലം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: עִיר מִבְצָר
  choice: കോട്ടകെട്ടിയ നഗരം
  rationale: מִבְצָר കോട്ടയോ പ്രതിരോധസംവിധാനമോ ഉള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ‘കോട്ടകെട്ടിയ നഗരം’ സൈനിക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: עִיר מִבְחוֹר
  choice: ശ്രേഷ്ഠമായ നഗരം
  rationale: מִבְחוֹר തിരഞ്ഞെടുക്കപ്പെട്ടത്, വിശിഷ്ടമായത്, ഏറ്റവും നല്ലത് എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. കൃത്യമായി ഏത് ഗുണത്തിലാണ് നഗരം വിശിഷ്ടമെന്ന് മൂലപാഠം പറയാത്തതിനാൽ ‘ശ്രേഷ്ഠമായ’ ആ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: תַּפִּילוּ
  choice: വെട്ടിവീഴ്ത്തും
  rationale: נפל എന്നതിന്റെ ഹിഫീൽ ഇവിടെ വൃക്ഷങ്ങളെ വീഴ്ത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വൃക്ഷങ്ങളുടെ കാര്യത്തിൽ ‘വെട്ടിവീഴ്ത്തുക’ സ്വാഭാവികവും പ്രവൃത്തിയെ വ്യക്തമായി അറിയിക്കുന്നതുമാണ്.
- source_word: כָּל עֵץ טוֹב
  choice: നല്ല എല്ലാ വൃക്ഷങ്ങളും
  rationale: טוֹב എന്ന വിശാലമായ പദത്തെ ‘ഫലവൃക്ഷം’ എന്നാക്കി ചുരുക്കാതെ ‘നല്ല’ എന്നു നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിലയേറിയതോ പ്രയോജനകരമോ ആയ വൃക്ഷങ്ങൾ ഉൾപ്പെടാം.
- source_word: מַעְיְנֵי מַיִם
  choice: എല്ലാ നീരുറവുകളും
  rationale: מַעְיָן സ്വാഭാവിക ജലസ്രോതസ്സായ ഉറവിനെ സൂചിപ്പിക്കുന്നു. ‘നീരുറവ്’ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: תִּסְתֹּמוּ
  choice: അടച്ചുകളയും
  rationale: סתם ഉറവുകളെയോ കിണറുകളെയോ തടയുക, അടയ്ക്കുക എന്ന അർഥത്തിലാണ്. ‘അടച്ചുകളയും’ പ്രവർത്തിയുടെ സമ്പൂർണതയും വൈരസൈനിക ഉദ്ദേശ്യവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַחֶלְקָה הַטּוֹבָה
  choice: നല്ല എല്ലാ വയലുകളും
  rationale: חֶלְקָה ഭൂമിയുടെ ഒരു ഭാഗത്തെയോ കൃഷിയിടത്തെയോ സൂചിപ്പിക്കുന്നു. ഈ കൃഷിസന്ദർഭത്തിൽ ‘വയൽ’ സ്വാഭാവികമാണ്; ‘ഫലഭൂയിഷ്ഠം’ എന്നു പറഞ്ഞ് טוֹב-ന്റെ അർഥം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  choice: കല്ലുകൾകൊണ്ട് നശിപ്പിക്കും
  rationale: כאֹב എന്ന അപൂർവ ഹിഫീൽ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘വേദനിപ്പിക്കുക’ എന്ന ആശയം നൽകുന്നു; ഇവിടെ വയലിൽ കല്ലുകൾ വിതറി കൃഷിക്ക് കേടുവരുത്തുന്നതാണ് സന്ദർഭാർഥം. ‘നശിപ്പിക്കും’ ഫലം വ്യക്തമായി പറയുന്നു; അക്ഷരാർഥവും പ്രവൃത്തിയും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
