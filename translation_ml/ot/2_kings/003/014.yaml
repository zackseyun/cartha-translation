reference: 2 Kings 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֗ע חַי יְהוָ֤ה צְבָאוֹת֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו כִּ֗י לוּלֵ֛י פְּנֵ֛י יְהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֲנִ֣י נֹשֵׂ֑א אִם אַבִּ֥יט אֵלֶ֖י/ךָ וְ/אִם אֶרְאֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/014.yaml
  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
translation:
  language: ml
  text: 'എലീശാ പറഞ്ഞു: “ഞാൻ ആരുടെ സന്നിധിയിൽ നിൽക്കുന്നുവോ ആ സൈന്യങ്ങളുടെ യാഹ്‌വെ ജീവിച്ചിരിക്കുന്നു എന്നു സത്യം; യെഹൂദാരാജാവായ യെഹോശാഫാത്തിനോട് ഞാൻ പരിഗണന കാണിക്കുന്നില്ലായിരുന്നെങ്കിൽ[b], ഞാൻ നിന്നെ നോക്കുകയോ കാണുകയോ ചെയ്യുമായിരുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: എബ്രായത്തിൽ ‘യെഹോശാഫാത്തിന്റെ മുഖം ഉയർത്തുക’ എന്ന പ്രയോഗമാണ്; ഒരാളോട് അനുകൂല പരിഗണനയോ ആദരവോ കാണിക്കുക എന്നാണ് അതിന്റെ ആശയം. അതിനാൽ ‘യെഹൂദാരാജാവായ യെഹോശാഫാത്തിനോട് എനിക്ക് പരിഗണന ഇല്ലായിരുന്നെങ്കിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ യാഹ്‌വെ ജീവിച്ചിരിക്കുന്നതാണേ
  rationale: എബ്രായത്തിലെ സത്യപ്രതിജ്ഞാസൂത്രത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പ്രതിജ്ഞാരൂപം ഉപയോഗിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ
  rationale: സ്വർഗീയ സൈന്യങ്ങൾ, ദൂതഗണങ്ങൾ, ദൈവിക ശക്തികൾ എന്നിവയിൽ ഏതെങ്കിലും ഒന്നിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ ബഹുവചനത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: ഞാൻ ആരുടെ സന്നിധിയിൽ നിൽക്കുന്നുവോ
  rationale: ദൈവസന്നിധിയിൽ നിൽക്കുന്ന പ്രവാചകന്റെ ദൃശ്യവും സേവനസൂചനയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: לוּלֵי
  choice: മാനിക്കുന്നില്ലായിരുന്നെങ്കിൽ
  rationale: തുടർന്നുവരുന്ന ഫലം നിഷേധാത്മകമായതിനാൽ, ഒഴിവാക്കാനാവാത്ത വ്യവസ്ഥയെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: פְּנֵי יְהוֹשָׁפָט ... נֹשֵׂא
  choice: യെഹോശാഫാത്തിനെ ഞാൻ മാനിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖം ഉയർത്തുക’ എന്ന പ്രയോഗം ഇവിടെ ഒരാളെ പരിഗണിക്കുക, ആദരിക്കുക, അനുകൂലമായി കാണുക എന്ന ആശയം നൽകുന്നു; ‘മാനിക്കുക’ സന്ദർഭത്തിന് യോജിച്ച സംക്ഷിപ്ത മലയാളമാണ്.
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָ
  choice: ഞാൻ നിന്നെ നോക്കുകയോ കാണുകയോ ചെയ്യുമായിരുന്നില്ല
  rationale: പ്രതിജ്ഞാഘടനയിൽ ഉൾക്കൊള്ളുന്ന നിഷേധം വ്യക്തമാക്കുകയും ‘നോക്കുക’, ‘കാണുക’ എന്നീ രണ്ടു ക്രിയകളുടെ ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ദൈവസന്നിധിയിലെ പ്രവാചകന്റെ നില
  choice: ആരുടെ സന്നിധിയിൽ ഞാൻ നിൽക്കുന്നുവോ
  alternative: ആരെ ഞാൻ സേവിക്കുന്നുവോ
  rationale: ഈ പ്രയോഗത്തിന് പ്രവാചകസേവനം സൂചിപ്പിക്കാമെങ്കിലും, മുഖ്യപാഠം അക്ഷരദൃശ്യവും ആശയവ്യാപ്തിയും നിലനിർത്തുന്നു.
- issue: യെഹോശാഫാത്തിന്റെ ‘മുഖം ഉയർത്തുക’ എന്ന പ്രയോഗം
  choice: യെഹോശാഫാത്തിനെ മാനിക്കുക
  alternative: യെഹോശാഫാത്തിന്റെ സാന്നിധ്യത്തെ പരിഗണിക്കുക
  rationale: ഇത് മുഖത്തിന്റെ ശാരീരിക ദൃശ്യത്തെക്കാൾ അനുകൂല പരിഗണനയെയോ ആദരവിനെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; വിശദാംശം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. സത്യപ്രതിജ്ഞയുടെ ശക്തിയും എലീശായുടെ കടുത്ത നിരാകരണവും സംരക്ഷിച്ചിരിക്കുന്നു; അസ്വാഭാവികമായ അക്ഷരാനുവാദങ്ങൾ അടിക്കുറിപ്പിലൂടെ രേഖപ്പെടുത്തി.
