    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ആരുടെ മുമ്പിൽ ഞാൻ നിൽക്കുന്നുവോ.’ ഈ പ്രയോഗത്തിന് ‘ആരെ ഞാൻ സേവിക്കുന്നുവോ’ എന്ന പ്രവാചകസേവനത്തിന്റെ അർഥവും സൂചിപ്പിക്കാം.'
