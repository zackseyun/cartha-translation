id: 2KI.3.17
reference: 2 Kings 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה לֹֽא תִרְא֥וּ ר֨וּחַ֙ וְ/לֹֽא תִרְא֣וּ גֶ֔שֶׁם וְ/הַ/נַּ֥חַל הַ/ה֖וּא יִמָּ֣לֵא מָ֑יִם וּ/שְׁתִיתֶ֛ם אַתֶּ֥ם וּ/מִקְנֵי/כֶ֖ם וּֽ/בְהֶמְתְּ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
translation:
  language: ml
  text: 'യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: “നിങ്ങൾ കാറ്റ് കാണുകയില്ല; മഴയും കാണുകയില്ല. എങ്കിലും ആ നീർച്ചാൽ[a] വെള്ളംകൊണ്ടു നിറയും. നിങ്ങളും നിങ്ങളുടെ കന്നുകാലികളും മറ്റു മൃഗങ്ങളും വെള്ളം കുടിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആ താഴ്‌വര” അല്ലെങ്കിൽ “ആ വരണ്ട തോട്.” എബ്രായത്തിലെ נחל പലപ്പോഴും മഴക്കാലത്തു മാത്രം വെള്ളമൊഴുകുന്ന ഒരു ജലപാതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ ഉച്ചാരണസഹായകമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: כִּי כֹה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ദൈവിക പ്രഖ്യാപനസൂത്രം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תִרְאוּ
  choice: കാണുകയില്ല
  rationale: സന്ദർഭത്തിൽ ഭാവിയിൽ ദൃശ്യമാകാത്ത കാര്യങ്ങളെയാണ് അപൂർണക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: רוּחַ
  choice: കാറ്റ്
  rationale: മഴയോടുള്ള സമാന്തരപ്രയോഗവും കാലാവസ്ഥാസന്ദർഭവും കാരണം ഇവിടെ അർഥം ‘കാറ്റ്’ എന്നാണ്.
- source_word: גֶשֶׁם
  choice: മഴ
  rationale: കാലാവസ്ഥാസന്ദർഭത്തിലെ സാധാരണവും വ്യക്തവുമായ പദം.
- source_word: הַנַּחַל הַהוּא
  choice: ആ നീർച്ചാൽ
  rationale: נחל വരണ്ട കാലത്ത് വെള്ളമില്ലാത്തതാകാവുന്ന കാലിക ജലപാതയെ സൂചിപ്പിക്കാം; ‘നീർച്ചാൽ’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും ഭൂമിശാസ്ത്രപരമായ ആശയം ഏറെക്കുറെ നിലനിർത്തുന്നതുമാണ്. മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יִמָּלֵא מָיִם
  choice: വെള്ളംകൊണ്ടു നിറയും
  rationale: നിഫാൽ രൂപത്തിന്റെ ഫലാവസ്ഥയായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּשְׁתִיתֶם
  choice: വെള്ളം കുടിക്കും
  rationale: വാഗ്ദാനം ചെയ്ത സംഭവങ്ങളുടെ തുടർച്ച ലളിതഭാവികാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִקְנֵיכֶם
  choice: നിങ്ങളുടെ കന്നുകാലികൾ
  rationale: പൊതുവായ സ്വത്തുക്കളല്ല, ഉടമസ്ഥതയിലുള്ള മൃഗക്കൂട്ടങ്ങളാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: בְהֶמְתְּכֶם
  choice: നിങ്ങളുടെ മറ്റു മൃഗങ്ങൾ
  rationale: മുൻപുള്ള ‘കന്നുകാലികൾ’ എന്ന പദത്തോടൊപ്പം വരുന്ന രണ്ടാമത്തെ മൃഗപദത്തിന്റെ വിശാലമായ സൂചന സ്വാഭാവിക മലയാളത്തിൽ വേർതിരിച്ചുകാട്ടുന്നു; വിഭാഗങ്ങളുടെ കൃത്യമായ അതിരുകൾ മൂലപാഠത്തിൽ വ്യക്തമല്ല.
theological_decisions:
- issue: YHWH എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം יְהוָה എന്ന വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലരൂപത്തെ സുതാര്യമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ദൈവിക പ്രസ്താവനയ്ക്ക് ‘അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചു; കാലാവസ്ഥാസംബന്ധിയായ നിഷേധങ്ങളുടെ ആവർത്തനവും വാഗ്ദാനത്തിന്റെ വൈരുധ്യവും നിലനിർത്തി.
