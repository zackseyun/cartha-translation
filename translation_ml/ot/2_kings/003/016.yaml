base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/016.yaml
  text: 'And he said[c][b][a], “Thus says Yahweh: Make this wadi full of pits.”'
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “യാഹ്‌വേ ഇപ്രകാരം പറയുന്നു: ഈ അരുവിപ്പാതയിൽ കുഴികൾ കുഴികളായി ഉണ്ടാക്കുക.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അരുവിപ്പാത” എന്ന എബ്രായപദം “താഴ്‌വര,” “തോടിന്റെ പാത,” അല്ലെങ്കിൽ കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന ചാൽ എന്നും അർഥമാക്കാം. “കുഴികൾ കുഴികളായി” എന്നത് മൂലപാഠത്തിലെ ആവർത്തനമാണ്; അരുവിപ്പാതയിലുടനീളം അനേകം കുഴികൾ ഉണ്ടാക്കുക എന്ന ഊന്നലാണ് അതു നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വയിക്തോൽ ആഖ്യാനരൂപം നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനക്രമം നിലനിർത്തുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ ഔപചാരിക പ്രഖ്യാപനശൈലി നിലനിർത്തുന്നു; ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: עָשֹׂה
  choice: ഉണ്ടാക്കുക
  rationale: עשה എന്ന ക്രിയയുടെ വിശാലമായ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘കുഴിക്കുക’ എന്നു വിവക്ഷയെ അതിയായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: הַנַּחַל הַזֶּה
  choice: ഈ നീർച്ചാലിൽ
  rationale: נחל ഇവിടെ കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന ചാൽ അഥവാ വരണ്ട അരുവിപ്പാതയെ സൂചിപ്പിക്കാം; ‘നീർച്ചാൽ’ സാധാരണ മലയാളത്തിൽ ഗ്രാഹ്യമാണ്.
- source_word: גֵּבִים גֵּבִים
  choice: കുഴികൾ കുഴികളായി
  rationale: എബ്രായത്തിലെ പദാവർത്തനം അനേകം കുഴികൾ എല്ലായിടത്തും ഉണ്ടാകണമെന്ന വിതരണാത്മക ഊന്നൽ നൽകുന്നു; ആവർത്തനം മലയാളത്തിലും ദൃശ്യമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രവാചകപ്രഖ്യാപനശൈലി. മൂലപാഠത്തിലെ ‘കുഴികൾ’ എന്ന ആവർത്തനം നിലനിർത്തി; ഭൂമിശാസ്ത്രപരമായ പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകി.
