source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשָׁפָ֗ט הַ/אֵ֨ין פֹּ֤ה נָבִיא֙ לַֽ/יהוָ֔ה וְ/נִדְרְשָׁ֥ה אֶת יְהוָ֖ה מֵ/אוֹת֑/וֹ וַ֠/יַּעַן אֶחָ֞ד מֵ/עַבְדֵ֤י מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר פֹּ֚ה אֱלִישָׁ֣ע בֶּן שָׁפָ֔ט אֲשֶׁר יָ֥צַק מַ֖יִם עַל יְדֵ֥י אֵלִיָּֽהוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
translation:
  language: ml
  text: 'യഹോശാഫാത്ത് ചോദിച്ചു: “യഹ്‌വേയുടെ ഒരു പ്രവാചകൻ ഇവിടെ ഇല്ലേ? അദ്ദേഹത്തിലൂടെ നമുക്ക് യഹ്‌വേയോടു ചോദിച്ചറിയാൻ?” അപ്പോൾ ഇസ്രായേൽരാജാവിന്റെ സേവകരിൽ ഒരാൾ മറുപടി പറഞ്ഞു: “ശാഫാത്തിന്റെ മകനായ എലീശാ ഇവിടെയുണ്ട്[a]. അദ്ദേഹം ഏലിയാവിന്റെ കൈകളിൽ വെള്ളം ഒഴിച്ചുകൊടുക്കാറുണ്ടായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൈകളിൽ വെള്ളം ഒഴിച്ചുകൊടുക്കുക” എന്നത് കൈകഴുകാൻ വെള്ളം പകർന്നുകൊടുത്ത് ഏലിയാവിനെ വ്യക്തിപരമായി ശുശ്രൂഷിച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הַאֵין
  choice: ആരും ഇവിടെ ഇല്ലേ?
  rationale: ചോദ്യകണവും നിഷേധവും ചേർന്ന എബ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; ഒരു പ്രവാചകനെ തേടുന്ന ചോദ്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: נָבִיא לַיהוָה
  choice: യഹ്‌വേയുടെ പ്രവാചകൻ
  rationale: לַיהוָה സൂചിപ്പിക്കുന്ന ബന്ധം/ഉടമസ്ഥത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം പൊതുപദവിയാക്കി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאוֹתוֹ
  choice: അദ്ദേഹത്തിലൂടെ നമുക്ക് യഹ്‌വേയോട് അരുളപ്പാട് ചോദിക്കാമല്ലോ
  rationale: דרשׁ എന്നതിലെ അന്വേഷിക്കുക/ചോദിച്ചറിയുക എന്ന ആശയവും מֵאוֹתוֹയിലെ പ്രവാചകമധ്യസ്ഥതയും സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭത്തിൽ ദൈവിക മാർഗനിർദേശം ചോദിക്കുന്നതാണെന്ന് ‘അരുളപ്പാട്’ വ്യക്തമാക്കുന്നു.
- source_word: אֶחָד מֵעַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവിന്റെ സേവകരിൽ ഒരാൾ
  rationale: രാജസദസ്സിലെ സേവകൻ/പരിചാരകൻ എന്ന സന്ദർഭാർത്ഥം നൽകുന്നു; അടിമത്തം എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: אֲשֶׁר יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ
  choice: അദ്ദേഹം ഏലിയാവിന്റെ കൈകളിൽ വെള്ളം ഒഴിച്ചുകൊടുക്കാറുണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ ദൃശ്യരൂപം സംരക്ഷിക്കുകയും ഏലിയാവിനെ വ്യക്തിപരമായി ശുശ്രൂഷിച്ചിരുന്ന പതിവിനെ ‘ഒഴിച്ചുകൊടുക്കാറുണ്ടായിരുന്നു’ എന്നതിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: പ്രവാചകനിലൂടെയുള്ള ദൈവാന്വേഷണം
  choice: അദ്ദേഹത്തിലൂടെ നമുക്ക് യഹ്‌വേയോട് അരുളപ്പാട് ചോദിക്കാം
  alternative: അദ്ദേഹത്തിൽനിന്ന് നമുക്ക് യഹ്‌വേയെ അന്വേഷിക്കാം
  rationale: ചോദ്യം യഹ്‌വേയോടാണ്, പ്രവാചകൻ അതിന്റെ മാധ്യമമാണ് എന്ന വ്യാകരണബന്ധം നിലനിർത്തുന്നു; പ്രവാചകനാണ് അരുളപ്പാടിന്റെ ഉറവിടം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. രാജസദസ്സിന്റെ സന്ദർഭത്തിന് ‘സേവകർ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ കൈകളിൽ വെള്ളമൊഴിക്കുന്ന ദൃശ്യരൂപം മുഖ്യവാക്യത്തിൽ നിലനിർത്തി സാംസ്കാരിക അർത്ഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
