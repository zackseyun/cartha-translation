  to: 'യഹോശാഫാത്ത് ചോദിച്ചു: “യഹ്‌വേയുടെ ഒരു പ്രവാചകൻ ഇവിടെ ഇല്ലേ? അദ്ദേഹത്തിലൂടെ നമുക്ക് യഹ്‌വേയോടു ചോദിച്ചറിയാൻ?” അപ്പോൾ ഇസ്രായേൽരാജാവിന്റെ സേവകരിൽ ഒരാൾ മറുപടി പറഞ്ഞു: “ശാഫാത്തിന്റെ മകനായ എലീശാ ഇവിടെയുണ്ട്[a]. അദ്ദേഹം ഏലിയാവിന്റെ കൈകളിൽ വെള്ളം ഒഴിച്ചുകൊടുക്കാറുണ്ടായിരുന്നു.”'
  rationale: The revision removes the added specification ‘oracle’ and the rhetorical particle, rendering the inquiry broadly as ‘ask/inquire of Yahweh’ through the prophet. It also adds ‘ഒരു’ to represent the singular indefinite prophet. The culturally significant image of pouring water on Elijah’s hands, including its likely sense of personal attendance, remains unchanged and is explained by the anchored footnote.
  reviewer_model: gpt-5.6-terra
