source:
  edition: WLC
  text: וְ/נָקַ֥ל זֹ֖את בְּ/עֵינֵ֣י יְהוָ֑ה וְ/נָתַ֥ן אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/018.yaml
  text: And this is a small thing in the eyes of Yahweh[a]; he will also give Moab into your hand.
translation:
  language: ml
  text: ഇത് യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ ഒരു ചെറിയ കാര്യം മാത്രമാണ്[a]; അവിടുന്ന് മോവാബിനെ നിങ്ങളുടെ കൈയിൽ ഏൽപ്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഇത് യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ എളുപ്പമാണ്.”'
    reason: וְנָקַל എന്ന പദത്തിന് ‘ചെറിയ കാര്യം’ എന്നും ‘എളുപ്പം’ എന്നും സന്ദർഭയോഗ്യമായ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: וְנָקַל
  choice: ഒരു ചെറിയ കാര്യം മാത്രമാണ്
  rationale: קל എന്ന ധാതുവിന്റെ ഇവിടെ കാണുന്ന സ്ഥിതിവാചക അർഥം ‘ലഘുവായത്, എളുപ്പമായത്, നിസ്സാരമായത്’ എന്നാണ്. ‘ഒരു ചെറിയ കാര്യം മാത്രമാണ്’ എന്ന പ്രയോഗം വിലയിരുത്തൽസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘എളുപ്പമാണ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: זֹאת
  choice: ഇത്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ വെള്ളം ലഭ്യമാക്കുന്ന പ്രവൃത്തിയെയാണ് സൂചകസർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: അക്ഷരാർഥം ‘കണ്ണുകളിൽ’ എന്നാണെങ്കിലും, വിലയിരുത്തലിനെയോ കണക്കാക്കലിനെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘ദൃഷ്ടിയിൽ’ എന്ന പ്രയോഗം നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְנָתַן
  choice: അവിടുന്ന് ... ഏല്പിക്കും
  rationale: പ്രവാചകപ്രസംഗത്തിലെ ഈ രൂപത്തിന് സന്ദർഭത്തിൽ ഭാവികാലസൂചനയുണ്ട്. ബഹുമാനസൂചകമായ ‘അവിടുന്ന്’ സ്വാഭാവിക മലയാളശൈലി നൽകുന്നു.
- source_word: אֶת מוֹאָב
  choice: മോവാബിനെയും
  rationale: നാടിനെയോ ജനതയെയോ സമുച്ചയമായി സൂചിപ്പിക്കുന്ന ‘മോവാബ്’ എന്ന മൂലപദം നിലനിർത്തുന്നു; ‘-ഉം’ അധികമായി നടക്കാനിരിക്കുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു.
- source_word: בְּיֶדְכֶם
  choice: നിങ്ങളുടെ കൈയിൽ
  rationale: ഒരാളുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന എബ്രായ രൂപകം മലയാളത്തിലും മനസ്സിലാകുന്നതിനാൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: മോവാബിനെ ‘കൈയിൽ ഏല്പിക്കുക’ എന്നതിന്റെ അർഥം
  choice: രൂപകം അതേപടി നിലനിർത്തുന്നു
  alternative: നിങ്ങളുടെ അധികാരത്തിൽ ഏല്പിക്കും
  rationale: ഇത് യുദ്ധത്തിൽ മറ്റൊരാളുടെ അധികാരത്തിന് കീഴിലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ശൈലിയാണ്; മലയാളത്തിലും രൂപകം വ്യക്തമായതിനാൽ അതിനെ വിശദീകരിച്ച് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ’ എന്നത് മൂലത്തിലെ വിലയിരുത്തൽശൈലി സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു; ‘നിങ്ങളുടെ കൈയിൽ’ എന്ന ബൈബിൾരൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
