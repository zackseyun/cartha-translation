  text: וַ/יִּקַּח֩ אֶת בְּנ֨/וֹ הַ/בְּכ֜וֹר אֲשֶׁר יִמְלֹ֣ךְ תַּחְתָּ֗י/ו וַ/יַּעֲלֵ֤/הוּ עֹלָה֙ עַל הַ֣/חֹמָ֔ה וַ/יְהִ֥י קֶצֶף גָּד֖וֹל עַל יִשְׂרָאֵ֑ל וַ/יִּסְעוּ֙ מֵֽ/עָלָ֔י/ו וַ/יָּשֻׁ֖בוּ לָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
translation:
  language: ml
  text: അപ്പോൾ അവൻ തനിക്കു പകരം വാഴേണ്ടിയിരുന്ന തന്റെ ആദ്യജാതനായ മകനെ എടുത്ത് മതിലിന്മേൽ ദഹനയാഗമായി അർപ്പിച്ചു. ഇസ്രായേലിനെതിരെ വലിയ ക്രോധം ഉണ്ടായി[a]. അവർ അവനെ വിട്ട് പിൻവാങ്ങി തങ്ങളുടെ നാട്ടിലേക്കു മടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ക്രോധം ആരുടേതാണെന്ന് ഹീബ്രു പാഠം വ്യക്തമാക്കുന്നില്ല. ഇത് ദൈവത്തിന്റെ ക്രോധമോ, മോവാബ്യരുടെ രോഷമോ, യാഗത്തെത്തുടർന്ന് ഇസ്രായേലിനുണ്ടായ ഭീതിയോ മനോവീര്യനഷ്ടമോ എന്നു വ്യാഖ്യാതാക്കൾ വ്യത്യസ്തമായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  choice: തന്റെ ആദ്യജാതനായ മകൻ
  rationale: בְּכוֹר എന്നത് പ്രായത്തിൽ മൂത്തവൻ എന്നതിലുപരി ആദ്യജാതനെയും അവകാശിയെന്ന നിലയെയും സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  choice: തനിക്കു പകരം വാഴേണ്ടിയിരുന്ന
  rationale: നിയുക്ത പിൻഗാമിയെന്ന ആശയവും תַּחְתָּיו എന്നതിലെ ‘അവന്റെ സ്ഥാനത്ത്’ എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּעֲלֵהוּ עֹלָה
  choice: ദഹനയാഗമായി അർപ്പിച്ചു
  rationale: עֹלָה എന്ന യാഗപദത്തിന്റെ സവിശേഷ അർഥവും പ്രവൃത്തിയുടെ ഭീകരതയും മയപ്പെടുത്താതെ വ്യക്തമാക്കുന്നു.
- source_word: עַל הַחֹמָה
  choice: മതിലിന്മേൽ
  rationale: മൂലപാഠത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് നഗരമതിലാണെന്ന് മനസ്സിലാക്കാം.
- source_word: קֶצֶף גָּדוֹל
  choice: വലിയ ക്രോധം
  rationale: ക്രോധം/രോഷം എന്ന ശക്തമായ അർഥം നേരിട്ട് നൽകുകയും അതിന്റെ ഉറവിടത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെ
  rationale: ക്രോധം ഇസ്രായേലിനുനേരെ തിരിഞ്ഞിരുന്നുവെന്ന ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּסְעוּ מֵעָלָיו
  choice: അവനെ വിട്ട് പിൻവാങ്ങി
  rationale: נסע എന്നതിന്റെ പാളയം പിരിച്ച് നീങ്ങുക എന്ന അടിസ്ഥാനഭാവം സൈനികസന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיָּשֻׁבוּ לָאָרֶץ
  choice: തങ്ങളുടെ നാട്ടിലേക്കു മടങ്ങി
  rationale: സഖ്യസേന സ്വന്തം ദേശങ്ങളിലേക്കു മടങ്ങിയെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ഇസ്രായേലിനെതിരെ വലിയ ക്രോധം’ എന്നതിന്റെ ഉറവിടം
  choice: ക്രോധം ആരുടേതാണെന്ന് പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കാതെ മൂലപാഠത്തിലെ അവ്യക്തത നിലനിർത്തി.
  alternative: ദൈവക്രോധം; മോവാബ്യരുടെ രോഷം; യാഗം കണ്ട ഇസ്രായേലിന്റെ ഭീതിയോ മനോവീര്യനഷ്ടമോ എന്നു വ്യാഖ്യാനിക്കുക.
  rationale: ഹീബ്രു പാഠം ക്രോധത്തിന്റെ കർത്താവിനെയോ ഉറവിടത്തെയോ പറയുന്നില്ല. അതിനാൽ വിവാദമായ വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ പരിഭാഷയിൽ ഉറപ്പിക്കുന്നത് ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. യാഗസാങ്കേതിക പദമായി ‘ദഹനയാഗം’ ഉപയോഗിച്ചു; വ്യാഖ്യാനപരമായി വിവാദമായ ക്രോധത്തിന്റെ ഉറവിടം പ്രധാനപാഠത്തിൽ നിർണ്ണയിച്ചിട്ടില്ല. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] ‘മകൻ’ എന്നതിനുശേഷം കണ്ടുവെങ്കിലും അടിക്കുറിപ്പ് ക്രോധത്തെക്കുറിച്ചായതിനാൽ അർഥബന്ധമുള്ള സ്ഥാനത്ത്, ‘ക്രോധം ഉണ്ടായി’ എന്നതിനുശേഷം, അടയാളം ചേർത്തു.
