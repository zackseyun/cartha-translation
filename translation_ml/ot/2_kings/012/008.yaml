source:
  edition: WLC
  text: וַ/יִּקְרָא֩ הַ/מֶּ֨לֶךְ יְהוֹאָ֜שׁ לִ/יהוֹיָדָ֤ע הַ/כֹּהֵן֙ וְ/לַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם מַדּ֛וּעַ אֵינְ/כֶ֥ם מְחַזְּקִ֖ים אֶת בֶּ֣דֶק הַ/בָּ֑יִת וְ/עַתָּ֗ה אַל תִּקְחוּ כֶ֨סֶף֙ מֵ/אֵ֣ת מַכָּֽרֵי/כֶ֔ם כִּֽי לְ/בֶ֥דֶק הַ/בַּ֖יִת תִּתְּנֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹോവാശ് രാജാവ് യെഹോയാദാ പുരോഹിതനെയും പുരോഹിതന്മാരെയും വിളിച്ചുവരുത്തി അവരോടു പറഞ്ഞു: “നിങ്ങൾ ആലയത്തിലെ[a] കേടുപാടുകൾ നന്നാക്കാത്തത് എന്തുകൊണ്ട്? ഇപ്പോൾ നിങ്ങളുടെ പരിചയമുള്ളവരിൽനിന്ന്[b] പണം വാങ്ങരുത്; ആലയത്തിന്റെ അറ്റകുറ്റപ്പണിക്കായി അത് നൽകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘വീട്’; ഇവിടെ യഹോവയുടെ ആലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായപദത്തിന്റെ അർഥം ദുഷ്കരമാണ്. കൂടുതൽ പദാനുസൃതമായി ‘നിങ്ങൾക്കു പരിചയമുള്ളവർ’ എന്നും, സന്ദർഭാനുസൃതമായി ‘നിങ്ങളുടെ സംഭാവനക്കാർ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ച്
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ קרא ഒരാളെ വിളിച്ചുവരുത്തുക എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘വിളിച്ച്’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: הַמֶּלֶךְ יְהוֹאָשׁ
  choice: യെഹോവാശ് രാജാവ്
  rationale: പേര് ലിപ്യന്തരണം ചെയ്തു; മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ രാജപദവി പേരിനു ശേഷം ചേർത്തു.
- source_word: לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים
  choice: യെഹോയാദാ പുരോഹിതനെയും മറ്റു പുരോഹിതന്മാരെയും
  rationale: യെഹോയാദാവിനോടൊപ്പം പുരോഹിതരുടെ സംഘത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആവർത്തനം ആശയക്കുഴപ്പം ഉണ്ടാക്കാതിരിക്കാൻ ‘മറ്റു’ ചേർത്തത് സ്വാഭാവികമായ വ്യക്തീകരണമാണ്.
- source_word: אֵינְכֶם מְחַזְּקִים אֶת בֶּדֶק הַבָּיִת
  choice: നിങ്ങൾ ആലയത്തിന്റെ കേടുപാടുകൾ തീർക്കാത്തത്
  rationale: חזק എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘ബലപ്പെടുത്തുക’ ആണെങ്കിലും בדק הבית എന്ന സംയോജനത്തിൽ കെട്ടിടത്തിന്റെ കേടുകൾ നന്നാക്കുന്നതാണ് ഉദ്ദേശ്യം. ‘കേടുപാടുകൾ തീർക്കുക’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְעַתָּה
  choice: ഇനിമുതൽ
  rationale: ശാസനയിൽനിന്ന് പുതിയ ഭരണനിർദേശത്തിലേക്കുള്ള മാറ്റവും തുടർന്നുള്ള വിലക്കും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַל תִּקְחוּ כֶסֶף
  choice: പണം വാങ്ങരുത്
  rationale: כֶּסֶף ഇവിടെ വെള്ളി എന്ന വസ്തുവിനേക്കാൾ ധനസമാഹാരത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘പണം’ പ്രസക്തമാണ്.
- source_word: מֵאֵת מַכָּרֵיכֶם
  choice: നിങ്ങളുടെ പരിചയക്കാരിൽനിന്ന്
  rationale: מַכָּר എന്ന ദുഷ്കരപദത്തിന്റെ ഏറ്റവും പദാനുസൃതമായ അർഥം ‘അറിയപ്പെടുന്നവർ/പരിചയക്കാർ’ എന്നാണ്. ദാതാക്കൾ എന്ന സന്ദർഭാനുമാനം മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കാതെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
- source_word: כִּי לְבֶדֶק הַבַּיִת תִּתְּנֻהוּ
  choice: ആലയത്തിന്റെ കേടുപാടുകൾ തീർക്കുന്നതിനായി അത് ഏൽപ്പിച്ചുകൊടുക്കുക
  rationale: לְ ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്നു; תִּתְּנֻהוּയിലെ സർവനാമപ്രത്യയം പണത്തെ പരാമർശിക്കുന്നു. ‘ഏൽപ്പിച്ചുകൊടുക്കുക’ എന്നത് അറ്റകുറ്റപ്പണിക്കായി തുക കൈമാറുന്നതിന്റെ ഭരണപരമായ ഭാവം നൽകുന്നു.
