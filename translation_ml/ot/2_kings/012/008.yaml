translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ‘വീട്’ എന്ന സാംസ്കാരിക പ്രയോഗം വായനാസ്പഷ്ടതയ്ക്കായി മുഖ്യവാചകത്തിൽ ‘ആലയം’ എന്നു നൽകി, പദാനുസൃത രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. ദുഷ്കരമായ מַכָּרֵיכֶם എന്ന പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
