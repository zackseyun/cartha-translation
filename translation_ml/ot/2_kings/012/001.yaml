translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ രാജത്വാരംഭ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുകയും നാമത്തിന്റെ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
