  text: യെഹോവാശ് രാജാവായപ്പോൾ അവന് ഏഴു വയസ്സായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘യെഹോവാശ്’; പരമ്പരാഗതമായി ‘യോവാശ്’ എന്നും നൽകാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: അവന് ഏഴു വയസ്സായിരുന്നു
  rationale: בֶּן + സംഖ്യ + שָׁנִים എന്നത് പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവന് ഏഴു വയസ്സായിരുന്നു’ എന്നു നൽകുന്നു.
- source_word: יְהוֹאָשׁ
  choice: യെഹോവാശ്
  rationale: എബ്രായ നാമരൂപമായ יְהוֹאָשׁ-നെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בְּמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: בְּ + מלך എന്ന ക്രിയയുടെ infinitive construct-ഉം മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും ചേർന്ന കാലസൂചക പ്രയോഗം ‘അവൻ രാജാവായപ്പോൾ’ എന്നാണ്; മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ രൂപം തിരഞ്ഞെടുത്തു.
