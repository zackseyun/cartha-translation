language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/שְׁנַת שֶׁ֤בַע לְ/יֵהוּא֙ מָלַ֣ךְ יְהוֹאָ֔שׁ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּ/ירֽוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/002.yaml
  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: ml
  text: യേഹൂവിന്റെ ഏഴാം ഭരണവർഷത്തിൽ യെഹോവാശ് രാജാവായി; അദ്ദേഹം യെരൂശലേമിൽ നാൽപ്പത് വർഷം ഭരിച്ചു. അദ്ദേഹത്തിന്റെ അമ്മയുടെ പേര് ബേർഷേബയിൽ നിന്നുള്ള സിബ്യാ എന്നായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  choice: യേഹൂവിന്റെ ഏഴാം ഭരണവർഷത്തിൽ
  rationale: രാജാക്കന്മാരുടെ ഭരണകാലത്തെ ആധാരമാക്കിയുള്ള എബ്രായ കാലനിർണയസൂത്രം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מָלַךְ יְהוֹאָשׁ
  choice: യെഹോവാശ് രാജാവായി
  rationale: ഇവിടെ מָלַךְ സിംഹാസനാരോഹണം സൂചിപ്പിക്കുന്നതിനാൽ, തുടർന്നുള്ള ഭരണകാലദൈർഘ്യ പ്രസ്താവനയിൽനിന്ന് വേർതിരിച്ച് ‘രാജാവായി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ
  choice: അദ്ദേഹം ... നാല്പതു വർഷം ഭരിച്ചു
  rationale: ഇവിടെ ക്രിയ ഭരണത്തിന്റെ ദൈർഘ്യമാണ് സൂചിപ്പിക്കുന്നത്; ‘ഭരിച്ചു’ എന്നത് കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: בְּ എന്ന സ്ഥലസൂചക ഉപസർഗത്തെ മലയാളത്തിലെ ‘-ൽ’ വിഭക്തിയാൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: וְשֵׁם אִמּוֹ
  choice: അദ്ദേഹത്തിന്റെ അമ്മയുടെ പേര് ... എന്നായിരുന്നു
  rationale: അമ്മയുടെ തിരിച്ചറിയൽ രേഖപ്പെടുത്തുന്ന എബ്രായ വാക്യഘടനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: צִבְיָה
  choice: സിബ്യാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: מִבְּאֵר שָׁבַע
  choice: അവൾ ബേർഷേബക്കാരിയായിരുന്നു
  rationale: מִן ഇവിടെ ജന്മദേശം അഥവാ സ്വദേശബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തിയുടെ സ്ഥലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ബേർഷേബക്കാരി’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണ ശൈലി. സിംഹാസനാരോഹണവും ഭരണകാലദൈർഘ്യവും വ്യക്തമായി വേർതിരിച്ചിരിക്കുന്നു. സർവനാമത്തിൽ ആദരസൂചകമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു.
