  text: And his servants rose up and conspired a conspiracy[a], and they struck down Joash at Beth-millo, on the descent to Silla.
translation:
  language: ml
  text: അവന്റെ ഭൃത്യന്മാർ എഴുന്നേറ്റ് ഗൂഢാലോചന നടത്തി; അവർ സില്ലായിലേക്കുള്ള ഇറക്കുവഴിയിലെ ബേത്ത്-മില്ലോവിൽ[a] യോവാശിനെ അടിച്ചുവീഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സില്ലായിലേക്കു ഇറങ്ങിപ്പോകുന്ന വഴിയിലുള്ള ബേത്ത്-മില്ലോവിൽ” / “സില്ലായിലേക്കുള്ള ഇറക്കത്തിൽ.” എബ്രായ പ്രയോഗം സില്ലായിലേക്കുള്ള താഴോട്ടുള്ള സമീപനവഴിയുമായി ബന്ധപ്പെട്ട സ്ഥലത്തെയാണ് കൂടുതൽ അക്ഷരാർഥത്തിൽ വിവരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: അവന്റെ ഭൃത്യന്മാർ
  rationale: രാജധാനിയുടെ പശ്ചാത്തലത്തിൽ രാജാവിന്റെ കീഴിലുള്ള സേവകരെയോ അനുചരന്മാരെയോ സൂചിപ്പിക്കാൻ ‘ഭൃത്യന്മാർ’ സ്വാഭാവികമാണ്; ‘ഉദ്യോഗസ്ഥർ’ എന്നു പറയുന്നത് മൂലപദത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനപരമാകും.
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  choice: ഗൂഢാലോചന നടത്തി
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന എബ്രായ പ്രയോഗം രാജദ്രോഹപരമായ ഗൂഢാലോചനയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം കൂടാതെ അതിന്റെ പൂർണ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּכּוּ
  choice: അടിച്ചുവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന അർഥവും ഈ സന്ദർഭത്തിലെ മാരകമായ ആക്രമണത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു; ‘കൊന്നു’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ ക്രിയ മൂലത്തിൽ ഇല്ല.
- source_word: בֵּית מִלֹּא
  choice: ബേത്ത്-മില്ലോ
  rationale: അറിയപ്പെടുന്ന സ്ഥലനാമമായി പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַיּוֹרֵד סִלָּא
  choice: സില്ലായിലേക്കുള്ള ഇറക്കത്തിൽ
  rationale: നിശ്ചയാർഥക ലേഖനത്തോടുകൂടിയ കർത്തൃവാചക രൂപം സില്ലായോടു ബന്ധപ്പെട്ട താഴോട്ടുള്ള സമീപനവഴിയെയോ ഇറക്കത്തെയോ വിവരിക്കുന്നു. മലയാളത്തിൽ ഭൂപ്രകൃതിസംബന്ധമായ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: סִלָּא
  choice: സില്ലാ
  rationale: സ്ഥലനാമമായതിനാൽ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
