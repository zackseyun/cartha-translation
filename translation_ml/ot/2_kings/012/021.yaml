translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ക്രിയ–സജാതീയ നാമ ആവർത്തനം യാന്ത്രികമായി പകർത്താതെ ‘ഗൂഢാലോചന നടത്തി’ എന്നു നൽകി. സ്ഥലവിവരണത്തിന്റെ ഘടനാപരമായ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
