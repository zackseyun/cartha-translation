source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁנַ֨ת עֶשְׂרִ֧ים וְ/שָׁלֹ֛שׁ שָׁנָ֖ה לַ/מֶּ֣לֶךְ יְהוֹאָ֑שׁ לֹֽא חִזְּק֥וּ הַ/כֹּהֲנִ֖ים אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/007.yaml
  text: It happened in the twenty-third year of King Jehoash that the priests had not repaired the damage to the house[a].
translation:
  language: ml
  text: യെഹോവാശ് രാജാവിന്റെ വാഴ്ചയുടെ ഇരുപത്തിമൂന്നാം ആണ്ടായപ്പോൾ, പുരോഹിതന്മാർ ആലയത്തിന്റെ കേടുപാടുകൾ തീർത്തിരുന്നില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആലയത്തിലെ വിള്ളലുകൾ’ അല്ലെങ്കിൽ ‘പൊളിവുകൾ.’
    reason: ബֶּדֶק എന്ന പദം പൊതുവായി കേടുപാടിനെയും കൂടുതൽ പ്രത്യേകമായി കെട്ടിടത്തിലെ വിള്ളൽ അല്ലെങ്കിൽ പൊളിവിനെയും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിട്ടും
  rationale: വിവരണത്തിലെ പുതിയ ഘട്ടം അവതരിപ്പിക്കുന്ന wayyiqtol രൂപം. തുടർന്നുള്ള לֹא കൊണ്ടുള്ള പ്രതീക്ഷാവിരുദ്ധ സ്ഥിതി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കാൻ കാലസൂചനയോടു ചേർത്ത് ‘ആയിട്ടും’ എന്നു നൽകി.
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לַמֶּלֶךְ יְהוֹאָשׁ
  choice: യെഹോവാശ് രാജാവിന്റെ വാഴ്ചയുടെ ഇരുപത്തിമൂന്നാം ആണ്ട്
  rationale: രാജവാഴ്ചയിലെ വർഷം സൂചിപ്പിക്കുന്ന പതിവ് പ്രയോഗം; ‘വാഴ്ചയുടെ’ എന്നത് മലയാളത്തിൽ ഉദ്ദേശിച്ച കാലഗണന വ്യക്തമാക്കുന്നു.
- source_word: לֹא חִזְּקוּ
  choice: തീർത്തിരുന്നില്ല
  rationale: חזק എന്നതിന് അടിസ്ഥാനമായി ‘ബലപ്പെടുത്തുക’ എന്ന അർഥമുണ്ടെങ്കിലും, בדק הבית എന്ന പദസമുച്ചയത്തോടൊപ്പം കെട്ടിടത്തിന്റെ കേടുകൾ പരിഹരിക്കുക എന്നാണ് സന്ദർഭാർഥം. പൂർത്തിയാകാതെ തുടരുന്ന മുൻകാലാവസ്ഥ വ്യക്തമാക്കാൻ ‘തീർത്തിരുന്നില്ല’ ഉപയോഗിച്ചു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള, നിലവാരമുള്ള മലയാള പരിഭാഷ.
- source_word: בֶּדֶק הַבָּיִת
  choice: ആലയത്തിന്റെ കേടുപാടുകൾ
  rationale: בֶּדֶק എന്നത് വിള്ളൽ, പൊളിവ്, അറ്റകുറ്റം ആവശ്യമായ കേടായ അവസ്ഥ എന്നിവ സൂചിപ്പിക്കുന്നു. הַבַּיִת അക്ഷരാർഥത്തിൽ ‘ഭവനം’ ആണെങ്കിലും ഇവിടെ യഹോവയുടെ ആലയത്തെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തതയ്ക്കായി ‘ആലയം’ നൽകി.
