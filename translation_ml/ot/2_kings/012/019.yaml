  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ശൈലി. നീണ്ട ഹീബ്രു വാക്യം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി. രാജാക്കന്മാരുടെ പട്ടിക ഡാഷുകൾക്കുള്ളിൽ നൽകി ബന്ധം വ്യക്തമാക്കി; യഥാർഥ വംശബന്ധത്തിലെ വിശാല അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
