  text: וַ/יִּקַּ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יְהוּדָ֗ה אֵ֣ת כָּל הַ/קֳּדָשִׁ֡ים אֲשֶׁר הִקְדִּ֣ישׁוּ יְהוֹשָׁפָ֣ט וִ/יהוֹרָם֩ וַ/אֲחַזְיָ֨הוּ אֲבֹתָ֜י/ו מַלְכֵ֤י יְהוּדָה֙ וְ/אֶת קֳדָשָׁ֔י/ו וְ/אֵ֣ת כָּל הַ/זָּהָ֗ב הַ/נִּמְצָ֛א בְּ/אֹצְר֥וֹת בֵּית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח לַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יַּ֖עַל מֵ/עַ֥ל יְרוּשָׁלִָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
translation:
  language: ml
  text: അപ്പോൾ യെഹൂദാരാജാവായ യെഹോവാശ്, തന്റെ പൂർവികരായ യെഹൂദാരാജാക്കന്മാരായ യെഹോശാഫാത്തും യെഹോരാമും അഹസ്യാവും സമർപ്പിച്ചിരുന്ന സകല വിശുദ്ധവസ്തുക്കളും തന്റെ വിശുദ്ധവസ്തുക്കളും യഹ്‌വേയുടെ ആലയത്തിലെയും രാജകൊട്ടാരത്തിലെയും ഭണ്ഡാരങ്ങളിൽ ഉണ്ടായിരുന്ന സകല സ്വർണവും എടുത്ത് അരാംരാജാവായ ഹസായേലിന് അയച്ചു. തുടർന്ന് ഹസായേൽ യെരൂശലേമിൽനിന്ന് പിന്മാറി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി, “അവൻ യെരൂശലേമിന്റെമേൽനിന്ന് കയറിപ്പോയി” എന്നാണ്. ഈ പ്രയോഗം ഹസായേൽ യെരൂശലേമിനെതിരായ തന്റെ മുന്നേറ്റം അവസാനിപ്പിച്ച് പിന്മാറിയെന്ന അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ബലപ്രയോഗമോ ശേഖരണപ്രക്രിയയോ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: הַקֳּדָשִׁים / קֳדָשָׁיו
  choice: വിശുദ്ധവസ്തുക്കൾ / താൻ സമർപ്പിച്ച വിശുദ്ധവസ്തുക്കൾ
  rationale: വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിക്കപ്പെട്ട വസ്തുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. രണ്ടാമത്തെ പ്രയോഗത്തിലെ പ്രത്യയം യെഹോവാശ് തന്നെയാണ് അവ സമർപ്പിച്ചതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: הִקְדִּישׁוּ
  choice: യഹ്‌വേക്കു സമർപ്പിച്ചിരുന്ന
  rationale: קדש എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വിശുദ്ധ ഉപയോഗത്തിനായി സമർപ്പിക്കുക എന്ന അർഥം നൽകുന്നു; സന്ദർഭത്തിൽ സമർപ്പണത്തിന്റെ സ്വീകർത്താവായ യഹ്‌വേ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲבֹתָיו
  choice: തന്റെ പൂർവികരായ
  rationale: രാജവംശപരമായ ഈ സന്ദർഭത്തിൽ 'പിതാക്കന്മാർ' എന്ന അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമായി മുൻഗാമികളായ രാജാക്കന്മാരെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּאֹצְרוֹת
  choice: ഭണ്ഡാരങ്ങളിൽ
  rationale: ആലയത്തിലെയും കൊട്ടാരത്തിലെയും വിലപിടിപ്പുള്ള വസ്തുക്കൾ സൂക്ഷിച്ചിരുന്ന treasury rooms എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: അക്ഷരാർഥം 'യഹ്‌വേയുടെ ഭവനം' എന്നാണെങ്കിലും ഇവിടെ ദേവാലയമാണ് ഉദ്ദേശ്യം; ആലയം മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജകൊട്ടാരം
  rationale: അക്ഷരാർഥമായ 'രാജാവിന്റെ ഭവനം' ഇവിടെ രാജകീയ കൊട്ടാരത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ഇത് കൂടുതൽ വ്യക്തമാണ്.
- source_word: וַיִּשְׁלַח לַחֲזָאֵל
  choice: ഹസായേലിന് അയച്ചുകൊടുത്തു
  rationale: മുൻപറഞ്ഞ സമ്പത്തുകളെല്ലാം ഹസായേലിനു കൈമാറിയ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  choice: അവൻ യെരൂശലേമിൽനിന്ന് പിന്മാറി
  rationale: അക്ഷരരൂപം 'യെരൂശലേമിന്റെ മുകളിൽനിന്ന്/എതിരിൽനിന്ന് കയറിപ്പോയി' എന്നതോട് അടുത്തതാണെങ്കിലും ഈ പ്രയോഗം നഗരത്തിനെതിരായ നീക്കം അവസാനിപ്പിച്ച് മാറിപ്പോയതിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലെ വ്യക്തിനാമമായ יהוהയെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ദൈവനാമമായി നിലനിർത്തുന്നു.
- issue: വിശുദ്ധവസ്തുക്കളുടെ സമർപ്പണത്തിന്റെ ലക്ഷ്യം
  choice: യഹ്‌വേക്കു സമർപ്പിച്ചിരുന്ന
  alternative: സമർപ്പിച്ചിരുന്ന
  rationale: വസ്തുക്കൾ ആലയഭണ്ഡാരവുമായി ബന്ധപ്പെട്ട വിശുദ്ധ സമർപ്പണങ്ങളാണ്; മലയാളത്തിലെ സകർമക പ്രയോഗത്തിൽ ലക്ഷ്യം വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്, എന്നാൽ പുതിയൊരു ദൈവശാസ്ത്രപരമായ പ്രത്യേകത ചേർക്കുന്നില്ല.
