translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ഭരണപരമായ സന്ദർഭം നിലനിർത്തിക്കൊണ്ട് ഇടിയത്തിന്റെ അർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
