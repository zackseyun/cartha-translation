id: 2KI.12.9
reference: 2 Kings 12:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּאֹ֖תוּ הַ/כֹּֽהֲנִ֑ים לְ/בִלְתִּ֤י קְחַת כֶּ֨סֶף֙ מֵ/אֵ֣ת הָ/עָ֔ם וּ/לְ/בִלְתִּ֥י חַזֵּ֖ק אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/009.yaml
  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
translation:
  language: ml
  text: എന്നാൽ ജനങ്ങളിൽനിന്ന് പണം വാങ്ങാതിരിക്കാനും ആലയത്തിന്റെ കേടുപാടുകൾ തീർക്കാതിരിക്കാനും പുരോഹിതന്മാർ സമ്മതിച്ചു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ആലയത്തിന്റെ കേടുപാടുകൾ ബലപ്പെടുത്താതിരിക്കാനും’; ഇത് ആലയത്തിലെ കേടുപാടുകൾ അറ്റകുറ്റം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ആലയം’ എന്നത് യഹോവയുടെ ഭവനമായ ദേവാലയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  choice: സമ്മതിച്ചു
  rationale: אבה എന്ന ക്രിയ ഇവിടെ സമ്മതം അഥവാ സന്നദ്ധത സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള നിഷേധാർഥക ക്രിയാരൂപങ്ങളോടൊപ്പം ‘സമ്മതിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: ആലയനിർവഹണത്തിന്റെ ഈ പശ്ചാത്തലത്തിൽ כֹּהֲנִים എന്നതിന്റെ സാധാരണയും വ്യക്തവുമായ പരിഭാഷ.
- source_word: לְבִלְתִּי קְחַת
  choice: വാങ്ങാതിരിക്കാനും
  rationale: לְבִלְתִּי കൂടിയ ക്രിയാനാമരൂപം ഒരു പ്രവൃത്തി ചെയ്യാതിരിക്കാനുള്ള സമ്മതത്തെ സൂചിപ്പിക്കുന്നു. പണം ജനങ്ങളിൽനിന്ന് സ്വീകരിക്കുന്ന ഭരണപരമായ സന്ദർഭത്തിൽ ‘വാങ്ങുക’ യോജിക്കുന്നു.
- source_word: כֶּסֶף
  choice: പണം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘വെള്ളി’ ആണെങ്കിലും സാമ്പത്തിക-ഭരണപരമായ ഈ സന്ദർഭത്തിൽ ‘പണം’ തന്നെയാണ് ഉദ്ദേശ്യാർഥം.
- source_word: מֵאֵת הָעָם
  choice: ജനങ്ങളിൽനിന്ന്
  rationale: മൂലഭാഷയിലെ മുൻവ്യയപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: וּלְבִלְתִּי חַזֵּק
  choice: തീർക്കാതിരിക്കാനും
  rationale: חזק എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ബലപ്പെടുത്തുക’ എന്നാണെങ്കിലും בדק הבית എന്ന പ്രയോഗത്തോടൊപ്പം കേടുപാടുകൾ അറ്റകുറ്റം ചെയ്യുക എന്ന ആശയമാണ്. ‘കേടുപാടുകൾ തീർക്കുക’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת בֶּדֶק הַבָּיִת
  choice: ആലയത്തിന്റെ കേടുപാടുകൾ
  rationale: בדק എന്നത് വിള്ളൽ, പൊട്ടൽ, അറ്റകുറ്റം ആവശ്യമായ കേട് എന്നിവയെ സൂചിപ്പിക്കുന്നു. הבית ഈ സന്ദർഭത്തിൽ യഹോവയുടെ ആലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ആലയം’ ആശയം ഉടൻ വ്യക്തമാക്കുന്നു.
