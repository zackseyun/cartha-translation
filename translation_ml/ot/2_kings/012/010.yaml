  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
translation:
  language: ml
  text: അപ്പോൾ പുരോഹിതനായ യെഹോയാദാ ഒരു പെട്ടി എടുത്ത് അതിന്റെ മൂടിയിൽ[a] ഒരു ദ്വാരം ഉണ്ടാക്കി. യാഹ്‌വെയുടെ ആലയത്തിലേക്കു ഒരാൾ പ്രവേശിക്കുമ്പോൾ വലതുവശത്ത്, യാഗപീഠത്തിനരികെ, അവൻ അതു വെച്ചു. വാതിൽപ്പടി കാക്കുന്ന പുരോഹിതന്മാർ യാഹ്‌വെയുടെ ആലയത്തിലേക്കു കൊണ്ടുവന്ന വെള്ളി മുഴുവൻ[b] അതിൽ ഇട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ വാതിലിൽ’; ഇവിടെ പെട്ടിയുടെ മൂടിയോ തുറക്കാവുന്ന ഭാഗമോ ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വെള്ളി’ എന്ന ഹീബ്രു പദത്തിന് ‘പണം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: പെട്ടി
  rationale: ഇവിടെ ആലയനിധി ശേഖരിക്കാനുള്ള പണപ്പെട്ടിയാണ് ഉദ്ദേശിക്കുന്നത്; ‘പെട്ടി’ സ്വാഭാവികവും നിയമപെട്ടകത്തെക്കുറിച്ചുള്ള തെറ്റായ ധാരണ ഒഴിവാക്കുന്നതുമാണ്.
- source_word: וַיִּקֹּב חֹר
  choice: ഒരു ദ്വാരം ഉണ്ടാക്കി
  rationale: נקב എന്ന ക്രിയയും חור എന്ന നാമവും ചേർന്ന് ഒരു തുറവ് തുളച്ചുണ്ടാക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּדַלְתּוֹ
  choice: അതിന്റെ മൂടിയിൽ
  rationale: דלת എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വാതിൽ’ എന്നാണെങ്കിലും, പെട്ടിയുടെ സാഹചര്യത്തിൽ തുറക്കാവുന്ന മൂടിയാണ് ഏറ്റവും സാദ്ധ്യമായ സൂചന.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനരികെ
  rationale: אצל സമീപസ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘അരികെ’ സ്ഥാനം വ്യക്തമായി നൽകുന്നു.
- source_word: בימין בְּבוֹא אִישׁ בֵּית יְהוָה
  choice: യാഹ്‌വെയുടെ ആലയത്തിലേക്ക് ഒരാൾ പ്രവേശിക്കുമ്പോൾ വലതുവശത്തായി
  rationale: പ്രവേശിക്കുന്ന വ്യക്തിയുടെ കാഴ്ചപ്പാടിൽ പെട്ടി വലതുവശത്തായിരുന്നുവെന്ന ദിശാസൂചന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שֹׁמְרֵי הַסַּף
  choice: വാതിൽപ്പടി കാവൽനിന്നിരുന്നവർ
  rationale: പദശഃ ‘വാതിൽപ്പടിയുടെ കാവൽക്കാർ’; പുരോഹിതന്മാരുടെ കവാടസംരക്ഷണ ചുമതല ഈ പ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כָּל הַכֶּסֶף
  choice: വെള്ളി മുഴുവൻ
  rationale: כֶּסֶף എന്നത് ഇവിടെ സംഭാവനയുടെ ഭൗതിക മാധ്യമമായ വെള്ളിയെ സൂചിപ്പിക്കാം; ‘പണം’ എന്ന വിപുലാർഥവും അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בֵּית יְהוָה
  choice: യാഹ്‌വെയുടെ ആലയം
  rationale: ‘യാഹ്‌വെയുടെ ഭവനം’ എന്ന പദശഃ രൂപത്തേക്കാൾ ആരാധനാസ്ഥലം എന്ന സന്ദർഭം ആധുനിക മലയാളത്തിൽ ‘ആലയം’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ പേരായി നിലനിർത്തുന്നു.
- issue: പ്രവേശിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന אִישׁ
  choice: ഒരാൾ
  alternative: ഒരു പുരുഷൻ / ഒരു മനുഷ്യൻ
  rationale: ഈ ഏകവചനപ്രയോഗം ദിശ നിർണ്ണയിക്കുന്ന പൊതുവായ ഉദാഹരണമാണ്; ‘ഒരാൾ’ അതിന്റെ പൊതുവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു, പ്രത്യേകമായി പുരുഷലിംഗത്തെ ഊന്നുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആലയസന്ദർഭത്തിന് യോജിച്ച ‘യാഗപീഠം’, ‘വാതിൽപ്പടി’, ‘ആലയം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; അസ്വാഭാവികമായ പദശഃ ക്രമം ഒഴിവാക്കിയെങ്കിലും സ്ഥലദിശയും പ്രവർത്തനക്രമവും സംരക്ഷിച്ചു.
