source:
  edition: WLC
  text: וְ/לַ/גֹּֽדְרִים֙ וּ/לְ/חֹצְבֵ֣י הָ/אֶ֔בֶן וְ/לִ/קְנ֤וֹת עֵצִים֙ וְ/אַבְנֵ֣י מַחְצֵ֔ב לְ/חַזֵּ֖ק אֶת בֶּ֣דֶק בֵּית יְהוָ֑ה וּ/לְ/כֹ֛ל אֲשֶׁר יֵצֵ֥א עַל הַ/בַּ֖יִת לְ/חָזְקָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
translation:
  language: ml
  text: ചുമർപ്പണിക്കാർക്കും[a] കല്ലുവെട്ടുകാർക്കും, യഹ്‌വേയുടെ ആലയത്തിലെ കേടുപാടുകൾ നന്നാക്കാൻ മരവസ്തുക്കളും ഖനിയിൽനിന്നുള്ള കല്ലുകളും[b] വാങ്ങാനും, ആലയം നന്നാക്കുന്നതിനുവേണ്ടിയുള്ള മറ്റെല്ലാ ചെലവുകൾക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിർമാണത്തൊഴിലാളികൾ.” ഹീബ്രു പദം ചുമർ കെട്ടുകയോ അറ്റകുറ്റപ്പണി നടത്തുകയോ ചെയ്യുന്നവരെ കൂടുതൽ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ചെത്തിയ കല്ലുകൾ” അല്ലെങ്കിൽ “വെട്ടിയ കല്ലുകൾ.”
    reason: lexical_alternative
  - marker: c
    text: പദശഃ, “ആലയത്തിന്മേൽ പുറപ്പെടുന്നതെല്ലാം”; അതായത്, ആലയം നന്നാക്കുന്നതിനായി വരുന്ന എല്ലാ ചെലവുകളും.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּדְרִים
  choice: ചുമർപ്പണിക്കാർ
  rationale: ഗדר എന്ന ധാതുവിൽനിന്നുള്ള ഈ പദം ചുമർ കെട്ടുകയോ അറ്റകുറ്റപ്പണി നടത്തുകയോ ചെയ്യുന്ന തൊഴിലാളികളെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ പൊതുവായ ‘നിർമാണത്തൊഴിലാളികൾ’ എന്നതിനെക്കാൾ ‘ചുമർപ്പണിക്കാർ’ കൃത്യമാണ്.
- source_word: חֹצְבֵי הָאֶבֶן
  choice: കല്ലുവെട്ടുകാർ
  rationale: കല്ല് വെട്ടുകയോ ഖനനം ചെയ്യുകയോ ചെയ്യുന്ന തൊഴിലാളികളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പദമാണിത്.
- source_word: לִקְנוֹת עֵצִים
  choice: മരത്തടികൾ വാങ്ങാൻ
  rationale: നിർമാണസന്ദർഭത്തിൽ עֵצִים പൊതുവായ വിറകിനെയല്ല, നിർമാണത്തിനുള്ള മരവസ്തുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אַבְנֵי מַחְצֵב
  choice: ഖനിയിൽനിന്നു വെട്ടിയെടുത്ത കല്ലുകൾ
  rationale: മַחְצֵב ഖനിയെയോ കല്ലുവെട്ടുന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കുന്നു. ഈ വിവർത്തനം കല്ലുകളുടെ ഉറവിടവും അവ വെട്ടിയെടുത്തവയാണെന്ന ആശയവും വ്യക്തമാക്കുന്നു.
- source_word: לְחַזֵּק אֶת בֶּדֶק
  choice: കേടുപാടുകൾ തീർക്കാൻ
  rationale: പദശഃ ‘വിള്ളൽ/കേട് ബലപ്പെടുത്തുക’ എന്ന ഘടന മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ഇവിടെ חזק ഘടനാപരമായി ഉറപ്പാക്കുന്ന അറ്റകുറ്റപ്പണിയെയും בֶּדֶק പരിഹരിക്കേണ്ട കേടിനെയും സൂചിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം സന്ദർഭാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: ‘യഹ്‌വേയുടെ ഭവനം’ എന്ന പദശഃ രൂപത്തേക്കാൾ ക്ഷേത്രസന്ദർഭത്തിൽ ‘ആലയം’ സ്വാഭാവികമാണ്; ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  choice: ആലയം നന്നാക്കുന്നതിനുവേണ്ടിവരുന്ന മറ്റെല്ലാ ചെലവുകൾക്കും
  rationale: ‘ആലയത്തിന്മേൽ പുറപ്പെടുന്നതെല്ലാം’ എന്ന ഹീബ്രു സാമ്പത്തിക പ്രയോഗം ആലയത്തിനായി ഉണ്ടാകുന്ന ചെലവുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ആവർത്തിക്കുന്ന അറ്റകുറ്റപ്പണി-ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തമായി ചേർത്തിരിക്കുന്നു.
- source_word: לְחָזְקָה
  choice: ആലയം നന്നാക്കുന്നതിന്
  rationale: അവസാനത്തെ חזק രൂപം ആലയത്തെ പുനരുറപ്പിക്കുന്നതിനുള്ള ചെലവുകളുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; ‘നന്നാക്കുക’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: ഹീബ്രുവിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്തു. ഇതിലൂടെ മൂലപാഠത്തിലെ ‘യഹ്‌വേയുടെ ആലയം’ എന്ന ബന്ധം നിലനിൽക്കുന്നു.
- issue: בֵּית എന്നതിന്റെ ക്ഷേത്രസന്ദർഭത്തിലുള്ള വിവർത്തനം
  choice: ആലയം
  alternative: ഭവനം
  rationale: ‘ഭവനം’ പദശഃ അടുത്തതാണെങ്കിലും ഇവിടെ യെരൂശലേം ക്ഷേത്രമാണ് ഉദ്ദേശ്യം. ‘ആലയം’ സാധാരണ വായനക്കാർക്ക് സന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു; പ്രത്യേക മതവിഭാഗത്തിന്റെ വ്യാഖ്യാനം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, മാന്യമായ മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിലെ പണത്തിന്റെ വിനിയോഗത്തെ തുടർന്നുപറയുന്നതിനാൽ മലയാളത്തിൽ സമ്പൂർണവും സ്വാഭാവികവുമായ വാക്യമായി ‘ആ പണം ഉപയോഗിച്ചു’ എന്നു ചേർത്തു. കൂലി കൊടുക്കൽ എന്ന ആശയം ഹീബ്രുവിലെ ദാതിവ് ഘടനയിൽ സന്ദർഭസൂചനയായി ഉൾപ്പെട്ടിരിക്കുന്നു. പദശഃ അസ്വാഭാവികമായ ‘കേടിനെ ബലപ്പെടുത്തുക’ എന്ന രൂപം ഒഴിവാക്കി അറ്റകുറ്റപ്പണിയുടെ അർത്ഥം നിലനിർത്തി.
