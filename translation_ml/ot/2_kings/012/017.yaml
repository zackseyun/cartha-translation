id: 2KI.12.17
reference: 2 Kings 12:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֶּ֤סֶף אָשָׁם֙ וְ/כֶ֣סֶף חַטָּא֔וֹת לֹ֥א יוּבָ֖א בֵּ֣ית יְהוָ֑ה לַ/כֹּהֲנִ֖ים יִהְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/017.yaml
  text: Money from a guilt offering and money from sin offerings was not to be brought into the house of Yahweh[b][a]; it belonged to the priests.
translation:
  language: ml
  text: കുറ്റയാഗത്തിന്റെ പണവും പാപയാഗങ്ങളുടെ പണവും യഹ്‌വേയുടെ ആലയത്തിലേക്കു കൊണ്ടുവരാൻ പാടില്ലായിരുന്നു; അവ പുരോഹിതന്മാർക്കുള്ളതായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶּסֶף
  choice: പണം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘വെള്ളി’ എന്നാണെങ്കിലും, ഇവിടെ ആലയസംബന്ധമായ ധനകാര്യക്രമമാണ് വിഷയം; അതിനാൽ പ്രവർത്തനപരമായ അർഥം വ്യക്തമാക്കാൻ ‘പണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אָשָׁם
  choice: കുറ്റയാഗം
  rationale: യാഗസന്ദർഭത്തിൽ ഈ പദം കുറ്റം സംബന്ധിച്ച പ്രായശ്ചിത്ത/പരിഹാരയാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ ശൈലിയിൽ വ്യക്തവും സംക്ഷിപ്തവുമായ ‘കുറ്റയാഗം’ തിരഞ്ഞെടുത്തു.
- source_word: חַטָּאוֹת
  choice: പാപയാഗങ്ങൾ
  rationale: ഇവിടെ ബഹുവചനം അമൂർത്തമായ ‘പാപങ്ങൾ’ അല്ല, ഒരു യാഗവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘പാപയാഗങ്ങൾ’ എന്നു നൽകി.
- source_word: לֹא יוּבָא
  choice: കൊണ്ടുവരേണ്ടതില്ലായിരുന്നു
  rationale: നിഷേധത്തോടുകൂടിയ ഹോഫാൽ രൂപം ഈ പണം എങ്ങനെ കൈകാര്യം ചെയ്യണമെന്ന വ്യവസ്ഥയെ സൂചിപ്പിക്കുന്നു. കഥനസന്ദർഭത്തിൽ സ്വാഭാവികമായി ആ നിയമം പ്രകടിപ്പിക്കാൻ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: ‘യഹ്‌വേയുടെ ഭവനം’ എന്ന അക്ഷരാർഥത്തെക്കാൾ ഇവിടെ ഉദ്ദേശിക്കുന്ന ദേവാലയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകാൻ ‘ആലയം’ ഉപയോഗിച്ചു; ദൈവനാമം യഹ്‌വേ എന്നു നിലനിർത്തി.
- source_word: לַכֹּהֲנִים יִהְיוּ
  choice: അതു പുരോഹിതന്മാർക്കുള്ളതായിരുന്നു
  rationale: ഈ വാക്യഭാഗം ഉടമസ്ഥതയെയോ നിശ്ചിത വിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പണം’ ഏകവചനസമൂഹനാമമായി വരുന്നതിനാൽ ‘അതു’ എന്ന രൂപം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: חַטָּאוֹת എന്ന പദത്തിന്റെ യാഗപരമായ അർഥം
  choice: പാപയാഗങ്ങൾ
  alternative: ശുദ്ധീകരണയാഗങ്ങൾ
  rationale: പുരോഹിതീയ പ്രയോഗത്തിൽ ‘ശുദ്ധീകരണയാഗങ്ങൾ’ എന്ന വ്യാഖ്യാനം സാധ്യമാണെങ്കിലും, ഈ വാക്യത്തിലെ അംഗീകൃത യാഗവിഭാഗവും അതുമായി ബന്ധപ്പെട്ട പണവുമാണ് പ്രധാനം; അതിനാൽ പരമ്പരാഗതവും വ്യക്തവുമായ ‘പാപയാഗങ്ങൾ’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി പാലിച്ചു. ‘പണം’ എന്നത് ധനകാര്യസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘ആലയം’ എന്നത് בַּיִת എന്ന പദത്തിന്റെ ഇവിടെ ഉദ്ദേശിക്കുന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
