id: 2KI.12.20
reference: 2 Kings 12:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹאָ֖שׁ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/020.yaml
  text: The rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: യോവാശിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്ത സകലവും യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[a] എഴുതിയിരിക്കുന്നില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദാരാജാക്കന്മാരുടെ രാജകീയ രേഖകളിൽ.’ എബ്രായപ്രയോഗം ഔദ്യോഗിക രാജരേഖയെയോ ദിനവൃത്താന്തത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: യോവാശിന്റെ ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: יֶתֶר എന്നത് ശേഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. דִּבְרֵי എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വാക്കുകൾ/കാര്യങ്ങൾ’ എന്നാകാമെങ്കിലും, രാജഭരണസംഗ്രഹത്തിന്റെ ഈ പതിവുശൈലിയിൽ രാജാവിന്റെ ശേഷിച്ച പ്രവർത്തനങ്ങളാണ് ഉദ്ദേശ്യം; അതിനാൽ ‘ശേഷിച്ച പ്രവൃത്തികൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്ത സകലവും
  rationale: כָל എന്നതിന്റെ സമഗ്രതയും എബ്രായത്തിലെ ബന്ധവാക്യഘടനയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: എഴുതിയിരിക്കുന്നില്ലയോ?
  rationale: സമ്മതാർഥമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ ആലങ്കാരികചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു. כְּתוּבִים എന്ന നിഷ്പന്നാവസ്ഥയും ‘എഴുതിയിരിക്കുന്നു’ എന്ന പ്രയോഗത്തിൽ പ്രതിഫലിക്കുന്നു.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘പുസ്തകത്തിന്മേൽ/ചുരുളിന്മേൽ’ എന്നാണെങ്കിലും, രേഖയിൽ എഴുതിയിരിക്കുന്നു എന്ന മലയാള പ്രയോഗത്തിൽ ‘പുസ്തകത്തിൽ’ സ്വാഭാവികമാണ്.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം
  rationale: דִּבְרֵי הַיָּמִים രാജാക്കന്മാരെക്കുറിച്ചുള്ള കാലാനുക്രമ ഔദ്യോഗിക രേഖകളെയോ വാർഷികവൃത്താന്തങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘ദിനവൃത്താന്തപുസ്തകം’ തലക്കെട്ടുപോലുള്ള ഘടനയും ചരിത്രരേഖ എന്ന ആശയവും കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ രാജഭരണസംഗ്രഹശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ആലങ്കാരികചോദ്യം പ്രസ്താവനയാക്കി മാറ്റാതെ നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ സൂചകം അത് വിശദീകരിക്കുന്ന ‘ദിനവൃത്താന്തപുസ്തകം’ എന്ന പദത്തിനുശേഷം ചേർത്തു.
