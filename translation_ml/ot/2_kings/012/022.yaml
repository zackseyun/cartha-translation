  register: ആധുനിക നിലവാരമലയാളത്തിൽ dignified narrative register ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾ സാധാരണ മലയാള ബൈബിൾ ലിപ്യന്തരണരീതിയോട് ചേർത്ത് നൽകി. ചെറുവാക്യങ്ങളിലൂടെ ഹീബ്രു കഥനക്രമം വ്യക്തമായി നിലനിർത്തി; ‘പിതാക്കന്മാരോടൊപ്പം’ എന്ന രാജവംശീയ പ്രയോഗം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
