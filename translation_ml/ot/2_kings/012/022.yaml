  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
translation:
  language: ml
  text: ശിമെയാത്തിന്റെ മകനായ യോസാബാദും ശോമേരിന്റെ മകനായ യെഹോസാബാദും—അവന്റെ ദാസന്മാർ[a]—അവനെ പ്രഹരിച്ചു; അവൻ മരിച്ചു. അവർ അവനെ ദാവീദിന്റെ നഗരത്തിൽ അവന്റെ പിതാക്കന്മാരോടൊപ്പം അടക്കം ചെയ്തു. അവന്റെ മകനായ അമസ്യാവ് അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ ഉദ്യോഗസ്ഥർ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം സന്ദർഭമനുസരിച്ച് ദാസന്മാരെയോ രാജകൊട്ടാരത്തിലെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹזָבָד בֶּן שִׁמְעָת
  choice: ശിമെയാത്തിന്റെ മകനായ യോസാബാദ്
  rationale: പേരുകൾ മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി; בֶּן എന്ന വംശബന്ധം വ്യക്തമായി പ്രകടിപ്പിച്ചു.
- source_word: וִיהוֹזָבָד בֶּן שֹׁמֵר
  choice: ശോമേരിന്റെ മകനായ യെഹോസാബാദ്
  rationale: രണ്ടാമത്തെ വ്യക്തിയെയും സമാന്തരമായ വാക്യഘടനയിൽ നൽകി, ഹീബ്രു സംയോജനം നിലനിർത്തി.
- source_word: עֲבָדָיו
  choice: അവന്റെ ദാസന്മാർ
  rationale: עֶבֶד എന്ന പദത്തിന് ദാസൻ, സേവകൻ, രാജകൊട്ടാര ഉദ്യോഗസ്ഥൻ എന്നീ അർഥസാധ്യതകളുണ്ട്. സന്ദർഭം കൊട്ടാരസേവകരെ സൂചിപ്പിക്കാമെങ്കിലും, മൂലത്തിലെ വിശാലമായ അർഥപരിധി നിലനിർത്താൻ ‘ദാസന്മാർ’ സ്വീകരിച്ചു.
- source_word: הִכֻּהוּ
  choice: അവനെ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ ശക്തമായ ആക്രമണഭാവം പ്രകടിപ്പിക്കുകയും, തുടർന്നുള്ള ‘അവൻ മരിച്ചു’ എന്ന സ്വതന്ത്ര പ്രസ്താവന ആവർത്തനമാകാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיָּמֹת
  choice: അവൻ മരിച്ചു
  rationale: ഹീബ്രു കഥനക്രമത്തിലെ തുടർച്ചയായ സംഭവത്തെ ലളിതമായ സ്വതന്ത്ര വാക്യമായി നിലനിർത്തി.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: അവർ അവനെ ... അടക്കം ചെയ്തു
  rationale: ബഹുവചന കർത്താവും ഏകവചന കർമവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עִם אֲבֹתָיו
  choice: അവന്റെ പിതാക്കന്മാരോടൊപ്പം
  rationale: രാജവംശീയ ശവസംസ്കാരത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപവും ഭാവവും സംരക്ഷിച്ചു; ‘പൂർവികർ’ എന്നതും അർഥസാധ്യമാണ്.
- source_word: בְּעִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരത്തിൽ
  rationale: ചരിത്രഗ്രന്ഥങ്ങളിലെ സ്ഥിരമായ സ്ഥലനാമപ്രയോഗത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו
  choice: അവന്റെ മകനായ അമസ്യാവ് അവനു പകരം രാജാവായി
  rationale: രാജ്യാവകാശക്രമത്തിലെ ingressive അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ഭരിച്ചു’ എന്നതിലുപരി സ്ഥാനാരോഹണമാണ് ഇവിടെ മുൻനിൽക്കുന്നത്.
