translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അരാം’ എന്ന മൂലഭാഷയിലെ ദേശനാമം നിലനിർത്തി. ഹീബ്രായ ശൈലിയുടെ അക്ഷരരൂപം മുഖ്യവാചകത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ അർഥം വാചകത്തിലും രൂപം അടിക്കുറിപ്പിലും നൽകി.
