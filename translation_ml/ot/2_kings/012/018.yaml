  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
translation:
  language: ml
  text: അപ്പോൾ അരാമിന്റെ രാജാവായ ഹസായേൽ[b] കയറിച്ചെന്ന് ഗത്തിനെതിരെ യുദ്ധംചെയ്ത് അതു പിടിച്ചെടുത്തു. തുടർന്ന് ഹസായേൽ യെരൂശലേമിനെതിരെ കയറിച്ചെല്ലാൻ മനസ്സുറച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “യെരൂശലേമിനെതിരെ കയറിച്ചെല്ലാൻ തന്റെ മുഖം വെച്ചു”; അഥവാ, അങ്ങനെ ചെയ്യാൻ തീരുമാനിച്ചു.'
    reason: lexical_alternative
  - marker: b
    text: ‘അരാം’ എന്നത് ഹീബ്രായ നാമമാണ്; പരമ്പരാഗതമായി ഇത് പലപ്പോഴും ‘സിറിയ’ എന്നു വിവർത്തനം ചെയ്യപ്പെടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന കാലസൂചകമായി സ്വാഭാവികമായ ആധുനിക മലയാളം.
- source_word: יַעֲלֶה
  choice: കയറി
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക/കയറുക’ എന്ന അടിസ്ഥാനാർഥവും സൈനിക മുന്നേറ്റത്തിന്റെ സന്ദർഭവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: അരാംരാജാവായ ഹസായേൽ
  rationale: ഹീബ്രായ ethnogeographic നാമമായ ‘അരാം’ നേരിട്ട് നിലനിർത്തുകയും വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: וַיִּלָּחֶם עַל
  choice: എതിരെ യുദ്ധംചെയ്ത്
  rationale: לחם + על എന്ന സൈനിക പ്രയോഗത്തിന്റെ ‘എതിരെ യുദ്ധം ചെയ്യുക’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: גַּת
  choice: ഗത്ത്
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּלְכְּדָהּ
  choice: അതു പിടിച്ചെടുത്തു
  rationale: നഗരം കീഴടക്കി കൈവശമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന לכד എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ പരിഭാഷ.
- source_word: וַיָּשֶׂם ... פָּנָיו
  choice: മനസ്സുറച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖം വെച്ചു’ എന്ന ഹീബ്രായ ശൈലി ഇവിടെ ദൃഢനിശ്ചയത്തോടെ ഒരു ലക്ഷ്യത്തിലേക്കു തിരിയുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ പ്രവർത്തനാർഥം നൽകുന്നു.
- source_word: לַעֲלוֹת עַל יְרוּשָׁלִָם
  choice: യെരൂശലേമിനെതിരെ കയറിച്ചെല്ലാൻ
  rationale: നഗരത്തിലേക്കുള്ള കയറ്റവും അതിനെതിരായ സൈനിക മുന്നേറ്റവും നിലനിർത്തുന്നു; നടന്നതായി പറയാത്ത ആക്രമണത്തെ മുൻകൂട്ടി ഉറപ്പിക്കുന്നില്ല.
