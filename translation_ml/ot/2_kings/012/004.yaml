source:
  edition: WLC
  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/004.yaml
  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
translation:
  language: ml
  text: എന്നിരുന്നാലും, ഉയർന്ന ആരാധനാസ്ഥലങ്ങൾ നീക്കം ചെയ്യപ്പെട്ടില്ല; ജനം ഇപ്പോഴും ആ ഉയർന്ന ആരാധനാസ്ഥലങ്ങളിൽ ബലിയർപ്പിക്കുകയും ധൂപം കത്തിക്കുകയും ചെയ്തുപോന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ അനുകൂല വിലയിരുത്തലിന് ഒരു പരിമിതിയോ അപവാദമോ അവതരിപ്പിക്കുന്ന വിരുദ്ധാർഥക പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַבָּמוֹת
  choice: പൂജാഗിരികൾ
  rationale: ഉയർന്ന സ്ഥലങ്ങളിലുള്ള പ്രാദേശിക ആരാധനാകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന ബാമോത് എന്ന ആരാധനാസംബന്ധിയായ സാങ്കേതിക പദത്തിന്റെ ഭൂപ്രകൃതിപരവും മതപരവുമായ അർഥങ്ങൾ ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: לֹא סָרוּ
  choice: നീക്കംചെയ്യപ്പെട്ടില്ല
  rationale: പൂജാഗിരികൾ തുടർന്നും നിലനിന്നുവെന്ന എബ്രായ പ്രയോഗത്തിന്റെ പ്രായോഗിക അർഥം സ്വാഭാവികമായ കർമണിപ്രയോഗത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עוֹד
  choice: അപ്പോഴും
  rationale: മുൻപറഞ്ഞ അനുകൂല സാഹചര്യത്തിനിടയിലും ആരാധനാപ്രവർത്തനങ്ങൾ തുടർന്നുവെന്ന ആശയം നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന നാമത്തിന് ലളിതവും മാന്യവുമായ മലയാളരൂപം.
- source_word: מְזַבְּחִים
  choice: ബലിയർപ്പിക്കുകയും
  rationale: എബ്രായ വർത്തമാനകൃദന്തരൂപം സൂചിപ്പിക്കുന്ന പതിവായും തുടർച്ചയായും നടന്ന പ്രവൃത്തിയെ തുടർന്നുള്ള ക്രിയയോടൊപ്പം ‘ചെയ്തുപോന്നു’ എന്ന ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: וּמְקַטְּרִים
  choice: ധൂപം കത്തിക്കുകയും
  rationale: ആരാധനാസന്ദർഭത്തിൽ קטר സാധാരണയായി ധൂപമോ സുഗന്ധദ്രവ്യമോ പുകയാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ബലിയർപ്പിക്കലിനോടൊപ്പം ഇവിടെ ഏറ്റവും സ്വാഭാവികമായ അർഥം ഇതാണ്.
- source_word: בַּבָּמוֹת
  choice: പൂജാഗിരികളിൽ
  rationale: ആ ആരാധനാകേന്ദ്രങ്ങളിലാണ് പ്രവൃത്തികൾ നടന്നതെന്ന് സ്ഥലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: പൂജാഗിരികളിലെ ആരാധനയെക്കുറിച്ചുള്ള വിലയിരുത്തൽ
  choice: ‘പൂജാഗിരികൾ’ എന്ന ചരിത്രപരവും ആരാധനാപരവുമായ പദം മുഖ്യവാചകത്തിൽ വിശദീകരണമോ മൃദൂകരണവുമില്ലാതെ നിലനിർത്തി.
  alternative: ‘ആരാധനാകേന്ദ്രങ്ങൾ നീക്കംചെയ്യപ്പെട്ടില്ല; ജനം അവിടെ തുടർന്നും ബലിയർപ്പിക്കുകയും ധൂപം കത്തിക്കുകയും ചെയ്തു.’
  rationale: അനധികൃത ആരാധനാസ്ഥലങ്ങളെക്കുറിച്ചുള്ള വിമർശനപരമായ പശ്ചാത്തലം വാക്യം അനുമാനിക്കുന്നുണ്ടെങ്കിലും ഇവിടെ അതിനപ്പുറം വ്യക്തമായ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല. അതിനാൽ ചരിത്ര-മതപരമായ പ്രത്യേകതയും വാചകത്തിലെ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. തുടർച്ചയായ പതിവുപ്രവൃത്തിയെ ‘ചെയ്തുപോന്നു’ എന്ന ഘടനയിലൂടെ പ്രകടിപ്പിച്ചു; സാങ്കേതിക ആരാധനാപദമായ ‘പൂജാഗിരികൾ’ അടിക്കുറിപ്പോടെ നിലനിർത്തി.
