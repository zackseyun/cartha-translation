source:
  edition: WLC
  text: יִקְח֤וּ לָ/הֶם֙ הַ/כֹּ֣הֲנִ֔ים אִ֖ישׁ מֵ/אֵ֣ת מַכָּר֑/וֹ וְ/הֵ֗ם יְחַזְּקוּ֙ אֶת בֶּ֣דֶק הַ/בַּ֔יִת לְ/כֹ֛ל אֲשֶׁר יִמָּצֵ֥א שָׁ֖ם בָּֽדֶק־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
translation:
  language: ml
  text: പുരോഹിതന്മാർ ഓരോരുത്തരും താന്താങ്ങളുടെ ദാതാവിൽനിന്ന് സ്വീകരിച്ചുകൊള്ളട്ടെ[a]. ദേവാലയത്തിൽ കണ്ടെത്തുന്ന എല്ലാ കേടുപാടുകളും അവർ നന്നാക്കട്ടെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘താന്താങ്ങളുടെ പരിചയക്കാരിൽനിന്ന്.’ എബ്രായപദം കൂടുതൽ അക്ഷരാർഥത്തിൽ തനിക്ക് പരിചയമുള്ള ഒരാളെ സൂചിപ്പിക്കാം; എന്നാൽ സംഭാവന ശേഖരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ഓരോ പുരോഹിതനും സംഭാവന സ്വീകരിച്ച വ്യക്തിയെയാണ് ഇതു സൂചിപ്പിക്കുന്നത് എന്നു മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഭവനം’ എന്നാണ്; ഇവിടെ അത് ദേവാലയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יִקְחוּ לָהֶם
  choice: അതു സ്വീകരിക്കട്ടെ
  rationale: നിർദേശാത്മകമായ ക്രിയാഭാവം ‘സ്വീകരിക്കട്ടെ’ എന്നു നൽകി; לָהֶם സൂചിപ്പിക്കുന്ന പുരോഹിതന്മാരിലേക്കുള്ള സ്വീകരണം മലയാളവാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു. സന്ദർഭത്തിൽ പണമാണ് ഉദ്ദേശ്യമെങ്കിലും മൂലപാഠത്തിൽ ഇവിടെ ‘പണം’ എന്ന പദമില്ലാത്തതിനാൽ ‘അതു’ എന്നു നിലനിർത്തി.
- source_word: הַכֹּהֲנִים אִישׁ
  choice: പുരോഹിതന്മാർ ഓരോരുത്തരും
  rationale: אִישׁ ഇവിടെ ബഹുവചനകർത്താവിനെ വ്യക്തിവ്യക്തിയായി വിതരണം ചെയ്യുന്ന പ്രയോഗമാണ്; ‘ഓരോരുത്തരും’ അതു സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵאֵת מַכָּרוֹ
  choice: താന്താങ്ങളുടെ ദാതാവിൽനിന്ന്
  rationale: പിരിവിന്റെ ഈ സന്ദർഭത്തിൽ מַכָּר പുരോഹിതന് സംഭാവന നൽകുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം. എന്നാൽ ‘പരിചയക്കാരൻ’ എന്ന കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וְהֵם יְחַזְּקוּ
  choice: അവർതന്നെ അതു നന്നാക്കട്ടെ
  rationale: וְהֵם എന്ന ഊന്നൽ ‘അവർതന്നെ’ എന്നു പ്രകടിപ്പിച്ചു. ‘ബലപ്പെടുത്തുക’ എന്ന അടിസ്ഥാനാർഥമുള്ള חזק കെട്ടിടപരിപാലനസന്ദർഭത്തിൽ ‘നന്നാക്കുക’ എന്നാണ് സ്വാഭാവികം.
- source_word: בֶּדֶק הַבַּיִת
  choice: ആലയത്തിന് ... കേടുപാട്
  rationale: בֶּדֶק കേടോ അറ്റകുറ്റം ആവശ്യമായ തകരാറോ സൂചിപ്പിക്കുന്നു. הַבַּיִת അക്ഷരാർഥത്തിൽ ‘വീട്/ഭവനം’ ആണെങ്കിലും ഈ സന്ദർഭത്തിൽ ദേവാലയകെട്ടിടമായതിനാൽ ‘ആലയം’ എന്നു നൽകി.
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  choice: എവിടെയെല്ലാം കേടുപാട് കണ്ടെത്തുന്നുവോ അവിടെയെല്ലാം
  rationale: കണ്ടെത്തുന്ന എല്ലാ കേടുപാടുകളും അറ്റകുറ്റം ചെയ്യണമെന്ന സമഗ്രവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. നിർദേശാത്മക ഭാവവും പുരോഹിതന്മാർക്കുള്ള ഊന്നലും നിലനിർത്തി; മַכָּר എന്ന പദത്തിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
