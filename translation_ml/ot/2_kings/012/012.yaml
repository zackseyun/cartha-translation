id: 2KI.12.12
reference: 2 Kings 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתְנוּ֙ אֶת הַ/כֶּ֣סֶף הַֽ/מְתֻכָּ֔ן עַל יד עֹשֵׂ֣י הַ/מְּלָאכָ֔ה ה/פקדים בֵּ֣ית יְהוָ֑ה וַ/יּוֹצִיאֻ֜/הוּ לְ/חָרָשֵׁ֤י הָ/עֵץ֙ וְ/לַ/בֹּנִ֔ים הָ/עֹשִׂ֖ים בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
translation:
  language: ml
  text: അവർ തൂക്കി തിട്ടപ്പെടുത്തിയ വെള്ളി[a] യഹ്‌വെയുടെ ആലയത്തിന്റെ മേൽനോട്ടത്തിനായി നിയമിക്കപ്പെട്ട പണിക്കാരുടെ കൈയിൽ ഏൽപ്പിച്ചു[b]. അവർ അത് യഹ്‌വെയുടെ[c] ആലയത്തിന്റെ പണിയിൽ ഏർപ്പെട്ടിരുന്ന മരപ്പണിക്കാർക്കും കെട്ടിടപ്പണിക്കാർക്കും കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അളന്നു തിട്ടപ്പെടുത്തിയ വെള്ളി’ എന്നോ ‘എണ്ണിത്തിട്ടപ്പെടുത്തിയ പണം’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘കൈയിൽ കൊടുത്തു’; അതായത്, അവരുടെ ചുമതലയിൽ ഏൽപ്പിച്ചു.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപാഠത്തിൽ YHWH എന്ന ദൈവനാമമാണ്. ഇവിടെ അത് ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു; ‘യഹോവ’ എന്ന രൂപവും പരമ്പരാഗതമായി ഉപയോഗിക്കപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  choice: തൂക്കി തിട്ടപ്പെടുത്തിയ വെള്ളി
  rationale: מְתֻכָּן അളന്നോ തൂക്കിയോ കൃത്യമായി നിശ്ചയിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ആലയപ്പണിക്കായി വിതരണം ചെയ്യുന്ന വെള്ളി എന്ന സാഹചര്യത്തിൽ ‘തൂക്കി തിട്ടപ്പെടുത്തിയ’ എന്നത് കൃത്യമായ അളവും വിതരണത്തിനുള്ള ഒരുക്കവും വ്യക്തമാക്കുന്നു; ‘വെള്ളി’ എന്നത് כֶּסֶף എന്ന പദത്തിന്റെ വസ്തുസംബന്ധിയായ രൂപം നിലനിർത്തുന്നു.
- source_word: עַל יַד
  choice: കൈയിൽ ഏൽപ്പിച്ചു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കൈയിൽ’ എന്ന ദൃശ്യഭാവവും ഒരാളുടെ ചുമതലയിൽ ഏൽപ്പിക്കുക എന്ന എബ്രായ ശൈലിയുടെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: പണിക്കാർ
  rationale: ആലയത്തിലെ പ്രവൃത്തി നിർവഹിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന പൊതുവായതും സ്വാഭാവികവുമായ പദം.
- source_word: הַפְּקֻדִים בֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ആലയത്തിന്റെ മേൽനോട്ടത്തിനു നിയമിക്കപ്പെട്ട
  rationale: פקד എന്ന ധാതുവിന്റെ നിയമനം/ചുമതല ഏൽപ്പിക്കൽ എന്ന ആശയവും ഇവർക്കുണ്ടായിരുന്ന മേൽനോട്ടച്ചുമതലയും പ്രകടമാക്കുന്നു.
- source_word: וַיּוֹצִיאֻהוּ
  choice: അവർ അത് ... കൊടുത്തു
  rationale: അക്ഷരാർഥത്തിൽ ‘പുറത്തുകൊണ്ടുവന്നു’ എന്നാണെങ്കിലും ധനകാര്യസന്ദർഭത്തിൽ പണം വിതരണം ചെയ്യുകയോ നൽകുകയോ ചെയ്യുന്നതാണ് ഉദ്ദേശ്യം. ‘കൊടുത്തു’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: לְחָרָשֵׁי הָעֵץ
  choice: മരപ്പണിക്കാർക്ക്
  rationale: ‘മരത്തിലെ ശില്പികൾ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാള സമാനപദം.
- source_word: וְלַבֹּנִים
  choice: കെട്ടിടപ്പണിക്കാർക്ക്
  rationale: בנים പൊതുവായി നിർമാണം നടത്തുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കൽപ്പണിക്കാർ’ എന്ന് അനാവശ്യമായി ചുരുക്കാതെ നിർമാണസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: הָעֹשִׂים בֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ആലയത്തിൽ പണിയെടുത്തിരുന്ന
  rationale: ആലയത്തിന്മേൽ പ്രവൃത്തി നടത്തിയിരുന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വിശാലസന്ദർഭം അറ്റകുറ്റപ്പണിയാണെങ്കിലും ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘അറ്റകുറ്റപ്പണി’ നേരിട്ട് ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ വ്യഞ്ജനരൂപമായ YHWH സൂചിപ്പിക്കുന്ന ദൈവനാമം ഒരു പദവിനാമംകൊണ്ട് മാറ്റിസ്ഥാപിക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിനാമമാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു. കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലെന്ന വസ്തുത അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ധനവിതരണത്തിന്റെ ആശയം സ്വാഭാവികമാക്കുമ്പോഴും ‘കൈയിൽ’ എന്ന എബ്രായ ശൈലിയുടെ ദൃശ്യഭാവം നിലനിർത്തി. ‘ആലയം’ ക്ഷേത്രസന്ദർഭത്തിന് യോജിച്ചും സഭാപാരമ്പര്യങ്ങൾക്ക് അതീതമായും ഉപയോഗിച്ചു.
