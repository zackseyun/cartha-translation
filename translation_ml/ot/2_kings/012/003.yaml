language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוֹאָ֧שׁ הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כָּל יָמָ֑י/ו אֲשֶׁ֣ר הוֹרָ֔/הוּ יְהוֹיָדָ֖ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/003.yaml
  text: Jehoash did what was right in the eyes of Yahweh all his days[a], because Jehoiada the priest instructed him.
translation:
  language: ml
  text: പുരോഹിതനായ യെഹോയാദാ അവനെ ഉപദേശിച്ചിരുന്ന കാലമൊക്കെയും[a] യെഹോവാശ് യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യെഹോവാശ് തന്റെ ജീവിതകാലം മുഴുവൻ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്തു; കാരണം പുരോഹിതനായ യെഹോയാദാ അവനെ ഉപദേശിച്ചു.”'
    reason: אֲשֶׁר എന്ന ബന്ധകത്തെ കാലപരിധിയായോ കാരണബന്ധമായോ മനസ്സിലാക്കാവുന്ന മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: ശരിയായതു ചെയ്തു
  rationale: עשה എന്ന ക്രിയയും substantival adjective ആയ הַיָּשָׁר-വും ചേർന്ന രാജാക്കന്മാരിലെ പതിവ് ധാർമിക വിലയിരുത്തൽ സ്വാഭാവികമായും അടുപ്പമായും പകരുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: എബ്രായത്തിലെ വിലയിരുത്തൽപ്രയോഗത്തിന്റെ അർഥവും ദൃശ്യരൂപകവും നിലനിർത്തുന്നു; ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ പകർന്നു.
- source_word: כָּל יָמָיו אֲשֶׁר הוֹרָהוּ
  choice: അവനെ ഉപദേശിച്ചിരുന്ന കാലമൊക്കെയും
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അവന്റെ എല്ലാ ദിവസങ്ങളും—അവനെ ഉപദേശിച്ച’ എന്ന ഘടന മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ബന്ധവാക്യം കാലപരിധിയെ വിശേഷിപ്പിക്കുന്ന സാധ്യത പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായി പകരുന്നു; മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: הוֹרָהוּ
  choice: അവനെ ഉപദേശിച്ചിരുന്ന
  rationale: ירה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ പഠിപ്പിക്കുക, നിർദേശം നൽകുക എന്ന ആശയം വഹിക്കുന്നു; പുരോഹിതനായ യെഹോയാദായുടെ മാർഗനിർദേശഭൂമികയ്ക്ക് ‘ഉപദേശിച്ചു’ യോജിക്കുന്നു.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: പുരോഹിതനായ യെഹോയാദാ
  rationale: പേരിനോടൊപ്പമുള്ള പദവി മലയാളത്തിലെ സ്വാഭാവിക appositional രൂപത്തിൽ പകർന്നു.
theological_decisions:
- issue: യെഹോവാശിന്റെ നീതിപൂർവമായ പ്രവർത്തനത്തിന്റെ കാലപരിധി
  choice: യെഹോയാദാ ഉപദേശിച്ചിരുന്ന കാലത്തോട് പ്രസ്താവനയെ ബന്ധിപ്പിക്കുന്ന വായന
  alternative: യെഹോവാശ് ജീവിതകാലം മുഴുവൻ ശരിയായതു ചെയ്തു; അതിന് കാരണം യെഹോയാദായുടെ ഉപദേശം ആയിരുന്നു
  rationale: אֲשֶׁר എന്ന ബന്ധകത്തിന്റെ കൃത്യബന്ധം വ്യാകരണപരമായി കുറച്ചൊന്നു അവ്യക്തമാണ്. ദിനങ്ങളോട് അതിനെ ബന്ധിപ്പിക്കുന്ന വായന തുടർന്നുള്ള ആഖ്യാനത്തിലെ സംഘർഷം നിലനിർത്തുന്നു; കാരണാർഥവായനയും സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യഹ്‌വെ’ എന്ന വ്യക്തിനാമവും ‘ദൃഷ്ടിയിൽ’ എന്ന എബ്രായ രൂപകവും നിലനിർത്തി; ദുഷ്കരമായ ബന്ധവാക്യം വായനാസൗകര്യത്തോടെ പകർന്നെങ്കിലും പകരംവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
