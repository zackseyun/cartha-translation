source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹאָ֜שׁ אֶל הַ/כֹּהֲנִ֗ים כֹּל֩ כֶּ֨סֶף הַ/קֳּדָשִׁ֜ים אֲשֶׁר יוּבָ֤א בֵית יְהוָה֙ כֶּ֣סֶף עוֹבֵ֔ר אִ֕ישׁ כֶּ֥סֶף נַפְשׁ֖וֹת עֶרְכּ֑/וֹ כָּל כֶּ֗סֶף אֲשֶׁ֤ר יַֽעֲלֶה֙ עַ֣ל לֶב אִ֔ישׁ לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/005.yaml
  text: And Jehoash said to the priests[a], “All the money of the holy things that is brought into the house of Yahweh—the money from each man who is counted, the money of the valuation of persons[c][b], and all the money that comes up on a man’s heart to bring into the house of Yahweh—”
translation:
  language: ml
  text: 'യെഹോവാശ് പുരോഹിതന്മാരോടു പറഞ്ഞു: “യഹോവയുടെ ആലയത്തിലേക്കു കൊണ്ടുവരുന്ന വിശുദ്ധ സമർപ്പണങ്ങളുടെ പണമെല്ലാം—എണ്ണപ്പെടുന്ന ഓരോ പുരുഷനിൽനിന്നുമുള്ള പണം[a], ആളുകളുടെ മൂല്യനിർണയത്തുക[b], ഒരാൾ യഹോവയുടെ ആലയത്തിലേക്കു കൊണ്ടുവരാൻ മനസ്സിൽ ഉദ്ദേശിക്കുന്ന പണമെല്ലാം[c]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “കടന്നുപോകുന്ന ഓരോ പുരുഷന്റെയും പണം.” എണ്ണപ്പെടുന്ന പുരുഷന്മാരിൽനിന്ന് ഈടാക്കിയിരുന്ന പിരിവിനെയാകാം ഇത് സൂചിപ്പിക്കുന്നത് (പുറപ്പാട് 30:13–16 താരതമ്യം ചെയ്യുക).
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ആളുകളുടെ മൂല്യനിർണയത്തുക.” നേർച്ചകളോടു ബന്ധപ്പെട്ട വ്യക്തികളുടെ മൂല്യനിർണയത്തുകകളെയാകാം ഇത് സൂചിപ്പിക്കുന്നത് (ലേവ്യർ 27:2–8 താരതമ്യം ചെയ്യുക).
    reason: cross_reference
  - marker: c
    text: “ഒരാളുടെ ഹൃദയത്തിന്മേൽ ഉയരുന്ന” എന്നാണ് എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം; ഒരാൾ സ്വമേധയാ നൽകാൻ മനസ്സിൽ ഉദ്ദേശിക്കുന്നതിനെ അതു സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  choice: വിശുദ്ധവസ്തുക്കളുടെ പണമെല്ലാം
  rationale: വിശുദ്ധമോ സമർപ്പിതമോ ആയ വസ്തുക്കളുമായി ബന്ധപ്പെട്ട പണം എന്ന എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; തുടർന്ന് വരുന്ന വിവിധ വരുമാനവിഭാഗങ്ങൾക്കുള്ള പൊതുതലക്കെട്ടായും സ്വാഭാവികമാണ്.
- source_word: יוּבָא בֵית יְהוָה
  choice: യഹോവയുടെ ആലയത്തിലേക്കു കൊണ്ടുവരുന്ന
  rationale: בוא എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപത്തിലുള്ള കർമണ്യാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഈ സന്ദർഭത്തിൽ ‘യഹോവയുടെ ഭവനം’ എന്നതിനെക്കാൾ ‘യഹോവയുടെ ആലയം’ വ്യക്തവും പ്രചാരമുള്ളതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  choice: എണ്ണപ്പെടുന്ന ഓരോ പുരുഷനിൽനിന്നുമുള്ള പണം
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കടന്നുപോകുന്നവന്റെ പണം’ എന്ന ദുഷ്കരപ്രയോഗം പുറപ്പാട് 30:13–16-ലെ എണ്ണപ്പെടുന്നവരുടെ പിരിവിനെയാകാം സൂചിപ്പിക്കുന്നത്. സന്ദർഭാർഥം മുഖ്യവാക്യത്തിൽ നൽകി അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: ആളുകളുടെ മൂല്യനിർണയപ്രകാരമുള്ള പണം
  rationale: വ്യക്തികളെ സംബന്ധിച്ച നിശ്ചിത മൂല്യനിർണയത്തിൽനിന്നുള്ള പണം എന്ന സംക്ഷിപ്തമായ ആരാധനാ-നിയമ പ്രയോഗം നിലനിർത്തുന്നു; മുഖ്യവാക്യത്തിൽ ‘നേർച്ച’ എന്നു ചേർത്ത് അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ
  choice: ഒരാളുടെ ഹൃദയത്തിൽ തോന്നുന്ന പണമെല്ലാം
  rationale: ‘ഒരാളുടെ ഹൃദയത്തിന്മേൽ ഉയരുക’ എന്ന എബ്രായ പ്രയോഗം സ്വമേധയാ മനസ്സിൽ ഉദ്ദേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഹൃദയത്തിൽ തോന്നുന്ന’ എന്നത് രൂപകത്തിന്റെ ഘടകം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לְהָבִיא בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയത്തിലേക്കു കൊണ്ടുവരാൻ
  rationale: ഹൃദയപ്രയോഗത്തിനു പിന്നാലെയുള്ള ഉദ്ദേശ്യസൂചക അനന്തരൂപം വ്യക്തമായി നൽകുകയും മുമ്പത്തെ ദിശാസൂചക പ്രയോഗവുമായി സമാന്തരത പാലിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: כֶּסֶף עוֹבֵר אִישׁ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: എണ്ണപ്പെടുന്ന ഓരോ പുരുഷനിൽനിന്നുമുള്ള പണം
  alternative: കടന്നുപോകുന്ന ഓരോ പുരുഷന്റെയും പണം
  rationale: പുറപ്പാട് 30:13–16-ലെ എണ്ണലിനോടു ബന്ധമുള്ള ക്ഷേത്രപ്പിരിവ് ഇവിടെ സൂചിപ്പിക്കപ്പെടാൻ സാധ്യതയുണ്ട്. എങ്കിലും അക്ഷരാർഥത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
- issue: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ എന്ന സംക്ഷിപ്ത നിയമപ്രയോഗം
  choice: ആളുകളുടെ മൂല്യനിർണയപ്രകാരമുള്ള പണം
  alternative: ആളുകൾക്കു നിശ്ചയിച്ച മൂല്യത്തിന്റെ പണം
  rationale: ലേവ്യർ 27:2–8-ലെ നേർച്ചാമൂല്യനിർണയവുമായി ബന്ധമുണ്ടാകാം; എന്നാൽ മൂലപാഠം ഇവിടെ ‘നേർച്ച’ എന്നു വ്യക്തമാക്കാത്തതിനാൽ പ്രധാനവാക്യത്തിൽ അത് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആരാധനാ-നിയമപരമായ പദങ്ങളുടെ കൃത്യത കാത്തുകൊണ്ട് സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന രൂപങ്ങൾ തെരഞ്ഞെടുത്തു. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനം ദീർഘരേഖ നിലനിർത്തി.
