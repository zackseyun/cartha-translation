id: 2KI.12.14
reference: 2 Kings 12:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
translation:
  language: ml
  text: എന്നാൽ യഹോവയുടെ ആലയത്തിലേക്കു കൊണ്ടുവന്ന പണംകൊണ്ട് യഹോവയുടെ ആലയത്തിനായി വെള്ളിപ്പാത്രങ്ങളോ[a] വിളക്കുതിരി വെട്ടാനുള്ള ഉപകരണങ്ങളോ[b] തളിക്കാനുള്ള പാത്രങ്ങളോ[c] കാഹളങ്ങളോ സ്വർണംകൊണ്ടുള്ള ഒരു ഉപകരണമോ വെള്ളികൊണ്ടുള്ള ഒരു ഉപകരണമോ ഉണ്ടാക്കിയിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെള്ളിക്കിണ്ണങ്ങൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തിരി മുറിക്കുന്ന കത്രികകൾ.’ എബ്രായപദം വിളക്കുകൾ പരിപാലിക്കാൻ ഉപയോഗിച്ചിരുന്ന ഒരു ഉപകരണത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘കിണ്ണങ്ങൾ.’ ഇവിടെ നൽകിയിരിക്കുന്ന പരിഭാഷ അതിന്റെ സാദ്ധ്യമായ ആചാരപരമായ ഉപയോഗം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יֵעָשֶׂה
  choice: ഉണ്ടാക്കിയിരുന്നില്ല
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണി അർഥവും ഇവിടെ വിവരിക്കുന്ന പതിവ് നടപടിയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: ക്ഷേത്രസന്ദർഭം വ്യക്തമായി നൽകുകയും ദൈവനാമം നേരിട്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: סִפּוֹת כֶּסֶף
  choice: വെള്ളിപ്പാത്രങ്ങൾ
  rationale: סִפּוֹת എന്ന പൊതുവായ പാത്രപദം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള מִזְרָקוֹת എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: מְזַמְּרוֹת
  choice: വിളക്കുതിരി വെട്ടാനുള്ള ഉപകരണങ്ങൾ
  rationale: വിളക്കുകൾ പരിപാലിക്കാൻ ഉപയോഗിച്ച ഉപകരണമെന്ന സാദ്ധ്യത സ്വാഭാവികവും മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִזְרָקוֹת
  choice: തളിക്കാനുള്ള പാത്രങ്ങൾ
  rationale: ആചാരപരമായ ഉപയോഗസാദ്ധ്യത പ്രകടമാക്കുന്നു; പദത്തിന്റെ പൊതുവായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: חֲצֹצְרוֹת
  choice: കാഹളങ്ങൾ
  rationale: ആരാധനാസന്ദർഭത്തിലെ ലോഹക്കാഹളങ്ങൾക്ക് സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  choice: സ്വർണംകൊണ്ടോ വെള്ളികൊണ്ടോ ഉള്ള മറ്റേതെങ്കിലും ഉപകരണം
  rationale: כְּלִי എന്ന പദത്തിന്റെ വിശാലമായ അർഥം ഉൾക്കൊള്ളുകയും പട്ടികയിലെ വിതരണാത്മകമായ ആശയം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: מִן הַכֶּסֶף הַמּוּבָא
  choice: കൊണ്ടുവന്ന പണംകൊണ്ട്
  rationale: ഈ ഭരണപരമായ സന്ദർഭത്തിൽ כֶּסֶף ധനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പണം’ യോജിക്കുന്നു; ഉപാധി/സ്രോതസ്സ് ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: എബ്രായപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. പാത്രങ്ങളുടെ സാങ്കേതിക നാമങ്ങളിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു; മുഖ്യവാചകത്തിൽ നീണ്ട അപൂർവപദങ്ങൾ ഒഴിവാക്കി.
