  text: כִּֽי לְ/עֹשֵׂ֥י הַ/מְּלָאכָ֖ה יִתְּנֻ֑/הוּ וְ/חִזְּקוּ ב֖/וֹ אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/015.yaml
  text: for they gave it to those doing the work[a], and with it they repaired the house of Yahweh.
translation:
  language: ml
  text: കാരണം, അവർ അത് പണി ചെയ്യുന്നവർക്ക് കൊടുത്തു; അതുപയോഗിച്ച് യഹോവയുടെ ഭവനം[a] അറ്റകുറ്റപ്പണി ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘യഹോവയുടെ ഭവനം’; ഇവിടെ യഹോവയുടെ ദേവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ കണക്കു ചോദിക്കാതിരുന്നതിന്റെ കാരണം വിശദീകരിക്കുന്ന ബന്ധകമായി ഇവിടെ വരുന്നു.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: പണിചെയ്യുന്നവർക്കു
  rationale: ‘പണി ചെയ്യുന്നവർ’ എന്ന എബ്രായ പങ്കാളിത്തരൂപത്തിന്റെ അർഥം സ്വാഭാവികവും ലിംഗനിരപേക്ഷവുമായി നൽകുന്നു.
- source_word: יִתְּנֻהוּ
  choice: അവർ ആ പണം ... കൊടുത്തു
  rationale: ആവർത്തിതമായ ഭൂതകാലപ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായ ലളിതഭൂതകാലത്തിൽ നൽകുന്നു. സർവനാമം സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ പണത്തെയാണ് സൂചിപ്പിക്കുന്നത് എന്നതിനാൽ വ്യക്തതയ്ക്കായി ‘ആ പണം’ എന്നു പറഞ്ഞു.
- source_word: וְחִזְּקוּ
  choice: അറ്റകുറ്റപ്പണി ചെയ്തു
  rationale: അടിസ്ഥാനാർഥം ‘ബലപ്പെടുത്തി’ എന്നാണെങ്കിലും കെട്ടിടസന്ദർഭത്തിൽ കേടുപാടുകൾ തീർത്ത് ഉറപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: בּוֹ
  choice: അതുകൊണ്ട്
  rationale: മുമ്പ് പരാമർശിച്ച പണം ഉപയോഗിച്ചാണ് പണി നടത്തിയതെന്ന ഉപകരണാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: അക്ഷരാർഥം ‘യഹോവയുടെ ഭവനം’ എന്നാണെങ്കിലും ഇവിടെ ദേവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആലയം’ ആ സന്ദർഭാർഥം വ്യക്തവും മാന്യവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കെട്ടിടപ്പണിയുടെ സന്ദർഭത്തിൽ ‘അറ്റകുറ്റപ്പണി ചെയ്തു’ എന്നും ആരാധനാലയത്തെ സൂചിപ്പിക്കാൻ ‘ആലയം’ എന്നും ഉപയോഗിച്ചു.
