translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. പണം ചുമതലയിൽ ഏൽപ്പിക്കുന്നതിനെക്കുറിച്ചുള്ള എബ്രായ ശൈലി ഭാഗികമായി നിലനിർത്തിയപ്പോൾ, കണക്കെടുപ്പും തൊഴിലാളികളും സംബന്ധിച്ച പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന രീതിയിൽ നൽകി. മൂലത്തിലെ പുരുഷലിംഗസൂചനയും אֱמוּנָה എന്ന പദത്തിന്റെ ധാർമിക വ്യാപ്തിയും സംരക്ഷിച്ചു.
