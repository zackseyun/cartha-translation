translation:
  language: ml
  text: പണിക്കാർക്കു നൽകാനായി പണം ആരുടെ കൈയിൽ ഏൽപ്പിച്ചുവോ[b], ആ പുരുഷന്മാരിൽനിന്ന് അവർ കണക്കു ചോദിച്ചില്ല[a]; കാരണം അവർ വിശ്വസ്തതയോടെയാണ് പ്രവർത്തിച്ചിരുന്നത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആ പുരുഷന്മാരുമായി അവർ കണക്കു തീർത്തില്ല.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവരുടെ കൈയിൽ’ എന്നാണ്; ഒരാളുടെ ചുമതലയിൽ എന്തെങ്കിലും ഏൽപ്പിക്കുക എന്നതാണ് ഇവിടെ അർഥം.
    reason: cultural_note
  - marker: c
    text: ‘വിശ്വസ്തതയോടെ’ എന്നത് ‘സത്യസന്ധമായി’ എന്നോ ‘നേരോടെ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַשְּׁבוּ
  choice: കണക്കു ചോദിച്ചില്ല
  rationale: പിയേൽ രൂപം ഇവിടെ പണത്തിന്റെ കണക്കു തീർക്കുകയോ കണക്കു ബോധിപ്പിക്കാൻ ആവശ്യപ്പെടുകയോ ചെയ്യുന്ന അർഥത്തിലാണ്. സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണിത്; ‘കണക്കു നോക്കിയില്ല’ എന്നതിനെക്കാൾ ഉത്തരവാദിത്വം ചോദിക്കാതിരുന്നതെന്ന ആശയം നന്നായി വ്യക്തമാക്കുന്നു.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാരിൽനിന്ന്
  rationale: ഇവിടെ പണം കൈകാര്യം ചെയ്യാൻ ചുമതലപ്പെടുത്തിയ പ്രത്യേക പുരുഷന്മാരെയാണ് ബഹുവചനനാമം സൂചിപ്പിക്കുന്നത്. അതിനാൽ മൂലഭാഷയിലെ ലിംഗസൂചന നിലനിർത്തി.
- source_word: יִתְּנוּ ... עַל יָדָם
  choice: ആരുടെ കൈയിൽ ഏൽപ്പിച്ചുവോ
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ ദൃശ്യവും ഒരാളുടെ ചുമതലയിൽ ഏൽപ്പിക്കുക എന്ന പ്രയോഗാർഥവും ഒരുമിച്ച് സ്വാഭാവികമായി പകരുന്നു.
- source_word: הַכֶּסֶף
  choice: പണം
  rationale: כֶּסֶף എന്നതിന് ‘വെള്ളി’ എന്നും ‘പണം’ എന്നും അർഥമുണ്ടെങ്കിലും, ദേവാലയ അറ്റകുറ്റപ്പണിക്കുള്ള ധനത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘പണം’ ആണ് ഉദ്ദേശ്യം വ്യക്തമായി അറിയിക്കുന്നത്.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: പണിക്കാർക്ക്
  rationale: പണി നിർവഹിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചക പ്രയോഗത്തിന് ആധുനിക മലയാളത്തിലെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗം.
- source_word: בֶאֱמֻנָה
  choice: വിശ്വസ്തതയോടെ
  rationale: ധനം കൈകാര്യം ചെയ്യുന്നതിലെ സത്യസന്ധത, ആശ്രയയോഗ്യത, ഉത്തരവാദിത്വബോധം എന്നിവ ഉൾക്കൊള്ളുന്ന אֱמוּנָה എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: הֵם עֹשִׂים
  choice: അവർ ... പ്രവർത്തിച്ചിരുന്നത്
  rationale: അവർ ചുമതല നിർവഹിച്ച രീതിയെ സംഗ്രഹിക്കുന്ന മൂലപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു; സന്ദർഭത്തിലെ തുടർച്ചയായ വിശ്വസ്തമായ നടത്തിപ്പും സൂചിപ്പിക്കുന്നു.
