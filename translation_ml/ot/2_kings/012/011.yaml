id: 2KI.12.11
reference: 2 Kings 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/רְאוֹתָ֔/ם כִּֽי רַ֥ב הַ/כֶּ֖סֶף בָּֽ/אָר֑וֹן וַ/יַּ֨עַל סֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וְ/הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וַ/יָּצֻ֨רוּ֙ וַ/יִּמְנ֔וּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֥א בֵית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/011.yaml
  text: And whenever they saw that there was much silver in the chest, the king’s scribe and the high priest came up and tied up and counted the silver found in the house of the LORD.
translation:
  language: ml
  text: പെട്ടിയിൽ വെള്ളി വളരെയുണ്ടെന്ന് അവർ കാണുമ്പോഴൊക്കെയും രാജാവിന്റെ എഴുത്തുകാരനും മഹാപുരോഹിതനും വന്ന് കർത്താവിന്റെ ആലയത്തിൽ ലഭിച്ച വെള്ളി കെട്ടുകളാക്കി എണ്ണിത്തിട്ടപ്പെടുത്തുമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּרְאוֹתָם
  choice: അവർ കാണുമ്പോഴൊക്കെയും
  rationale: כ־യുടെ കാലസൂചനയും ആവർത്തനസന്ദർഭവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַכֶּסֶף
  choice: വെള്ളി
  rationale: ഇവിടെ ക്ഷേത്രത്തിലേക്കു ലഭിച്ച വെള്ളിനാണയങ്ങളെയോ വെള്ളിമൂല്യത്തെയോ സൂചിപ്പിക്കുന്ന പൊതുപദം; ‘പണം’ എന്നതിനെക്കാൾ ലോഹസൂചന നിലനിർത്തുന്നു.
- source_word: סֹפֵר הַמֶּלֶךְ
  choice: രാജാവിന്റെ എഴുത്തുകാരൻ
  rationale: രാജകീയ ഉദ്യോഗസ്ഥന്റെ പദവി നേരിട്ട് സംരക്ഷിക്കുന്നു; കൂടുതൽ നിർദിഷ്ടമായ ‘കാര്യദർശി’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: וַיָּצֻרוּ
  choice: കെട്ടുകളാക്കി
  rationale: צרר എന്ന ക്രിയയുടെ ‘കെട്ടുക/പൊതിയുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സഞ്ചിയിലാക്കിയെന്നു മൂലത്തിൽ ഇല്ലാത്ത വസ്തു വ്യക്തമാക്കുന്നില്ല.
- source_word: וַיִּמְנוּ
  choice: എണ്ണിത്തിട്ടപ്പെടുത്തി
  rationale: വെള്ളി ഔദ്യോഗികമായി എണ്ണിയ പ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בֵית יְהוָה
  choice: കർത്താവിന്റെ ആലയം
  rationale: יהוה എന്ന ദൈവനാമത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ വ്യാപകമായ പ്രതിനിധാനം ഉപയോഗിക്കുകയും ‘വീട്’ എന്നതിനു സന്ദർഭോചിതമായി ‘ആലയം’ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: കർത്താവ്
  alternative: യഹോവ / യഹ്‌വെ
  rationale: പൊതുവായ മലയാള തിരുവെഴുത്തുപാരമ്പര്യത്തിലെ മാന്യമായ പ്രതിനിധാനം സ്വീകരിക്കുന്നു; പ്രത്യേക ഉച്ചാരണത്തെ നിർബന്ധിക്കുന്നില്ല.
- issue: הַכֹּהֵן הַגָּדוֹל എന്ന പദവി
  choice: മഹാപുരോഹിതൻ
  alternative: പ്രധാന പുരോഹിതൻ
  rationale: പദവിയുടെ പരമ്പരാഗതവും വ്യക്തവുമായ മലയാളരൂപം; വാക്യത്തിൽ ദൈവശാസ്ത്രപരമായ അധികവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ ആവർത്തിത സംഭവവിവരണം മലയാളത്തിൽ ‘കാണുമ്പോഴൊക്കെയും … ചെയ്യുമായിരുന്നു’ എന്ന ഘടനയിൽ നൽകി. വാക്യത്തിന്റെ പ്രവാഹത്തിനായി ‘വന്നു/കയറിവന്നു’ പ്രത്യേകം പറഞ്ഞിട്ടില്ല; ഹീബ്രുവിലെ ויעל ഉദ്യോഗസ്ഥർ പെട്ടിയിലേക്കോ ആലയത്തിലേക്കോ എത്തുന്നതിനെ സൂചിപ്പിക്കാമെങ്കിലും ദിശ നിർണയിച്ച് ചേർക്കാതിരിക്കാൻ ശ്രദ്ധിച്ചു.
