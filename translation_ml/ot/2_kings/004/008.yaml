translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. എലീശായെ സൂചിപ്പിക്കാൻ ബഹുമാനസൂചകമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. മൂലത്തിലെ സാമൂഹികസ്ഥാനസംബന്ധമായ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
