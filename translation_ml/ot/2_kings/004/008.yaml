base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
translation:
  language: ml
  text: ഒരു ദിവസം എലീശാ ശൂനേമിലൂടെ കടന്നുപോയി. അവിടെ സമൂഹത്തിൽ ഉന്നതസ്ഥാനമുള്ള ഒരു സ്ത്രീ ഉണ്ടായിരുന്നു.[a] ഭക്ഷണം കഴിക്കാൻ അവൾ അദ്ദേഹത്തെ നിർബന്ധപൂർവം ക്ഷണിച്ചു. പിന്നീട് അദ്ദേഹം അതുവഴി കടന്നുപോകുമ്പോഴെല്ലാം, ഭക്ഷണം കഴിക്കാൻ[b] അവിടേക്കു തിരിയുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായത്തിൽ ‘ഒരു വലിയ സ്ത്രീ’; ഈ പ്രയോഗം അവളുടെ സാമൂഹിക പ്രാമുഖ്യമോ സാമ്പത്തികശേഷിയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രായത്തിൽ ‘അപ്പം കഴിക്കാൻ’; ഭക്ഷണം കഴിക്കുക എന്ന അർഥത്തിലുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ഒരു ദിവസം
  rationale: ഹീബ്രായ കഥനത്തിലെ കാലസൂചകമായ ആരംഭം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּעֲבֹר אֱלִישָׁע אֶל שׁוּנֵם
  choice: എലീശാ ശൂനേമിലൂടെ കടന്നുപോയി
  rationale: യാത്രാസന്ദർഭത്തിലെ עבר എന്ന ക്രിയയുടെ അർഥവും സ്ഥലത്തിലൂടെയുള്ള സഞ്ചാരവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אִשָּׁה גְדוֹלָה
  choice: സമൂഹത്തിൽ ഉന്നതസ്ഥാനമുള്ള ഒരു സ്ത്രീ
  rationale: വാച്യമായ ‘വലിയ സ്ത്രീ’ എന്നതിനു പകരം സാമൂഹിക പദവിയോ പ്രാമുഖ്യമോ സൂചിപ്പിക്കുന്നു; സമ്പന്നയായിരുന്നു എന്ന് മാത്രം ഉറപ്പിച്ച് പറയുന്നില്ല.
- source_word: וַתַּחֲזֶק בּוֹ
  choice: അവൾ അദ്ദേഹത്തെ നിർബന്ധിച്ചു
  rationale: ആതിഥ്യം സ്വീകരിക്കാൻ ശക്തമായി പ്രേരിപ്പിച്ചു എന്ന സന്ദർഭാർഥം നൽകുന്നു; വെറും അഭ്യർഥനയെക്കാൾ മൂലത്തിലെ ശക്തി നിലനിർത്തുന്നു.
- source_word: לֶאֱכָל לָחֶם
  choice: ഭക്ഷണം കഴിക്കാൻ
  rationale: לֶחֶם വാച്യമായി ‘അപ്പം’ ആണെങ്കിലും ഇവിടെ ഭക്ഷണമോ ഊണോ കഴിക്കുക എന്ന പൊതുവായ പ്രയോഗമാണ്.
- source_word: מִדֵּי עָבְרוֹ
  choice: അദ്ദേഹം അതുവഴി കടന്നുപോകുമ്പോഴെല്ലാം
  rationale: ആവർത്തിച്ച് സംഭവിക്കുന്ന അവസരം സൂചിപ്പിക്കുന്ന ഹീബ്രായ ഘടനയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: יָסֻר שָׁמָּה
  choice: അവിടെ കയറുമായിരുന്നു
  rationale: വഴിയിൽനിന്ന് മാറി ആ വീട്ടിൽ ചെന്നുകയറി തങ്ങുന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
