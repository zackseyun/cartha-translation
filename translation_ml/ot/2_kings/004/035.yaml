  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
translation:
  language: ml
  text: പിന്നെ അവൻ മടങ്ങിവന്ന് വീട്ടിനുള്ളിൽ ഒരിക്കൽ ഇങ്ങോട്ടും ഒരിക്കൽ അങ്ങോട്ടും നടന്നു.[a] തുടർന്ന് അവൻ മുകളിലേക്കു ചെന്നു ബാലന്റെമേൽ കുനിഞ്ഞു.[b] ബാലൻ ഏഴു പ്രാവശ്യം തുമ്മി; പിന്നെ ബാലൻ കണ്ണുകൾ തുറന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അങ്ങോട്ടും ഇങ്ങോട്ടും.’ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഒരിക്കൽ ഇങ്ങോട്ട്, ഒരിക്കൽ അങ്ങോട്ട്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ബാലന്റെമേൽ വളഞ്ഞു.’ എബ്രായക്രിയയ്ക്ക് ഒരാളുടെമേൽ കുനിയുക അഥവാ വളയുക എന്ന അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: പിന്നെ അവൻ മടങ്ങിവന്ന്
  rationale: שׁוּב എന്ന ക്രിയയുടെ ‘മടങ്ങിവരുക’ എന്ന അർഥവും wayyiqtol രൂപത്തിന്റെ കഥാക്രമവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּלֶךְ בַּבַּיִת
  choice: വീട്ടിനുള്ളിൽ ... നടന്നു
  rationale: הלך-യോടൊപ്പമുള്ള സ്ഥാനസൂചക പ്രയോഗം വീടിനകത്തെ സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. ‘നടന്നു’ എന്നത് ‘ഉലാത്തി’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദങ്ങളെക്കാൾ നേരിട്ടുള്ളതാണ്.
- source_word: אַחַת הֵנָּה וְאַחַת הֵנָּה
  choice: ഒരിക്കൽ ഇങ്ങോട്ടും ഒരിക്കൽ അങ്ങോട്ടും
  rationale: എബ്രായത്തിലെ ആവർത്തനവും ദിശാചിത്രവും നിലനിർത്തുന്നു; ആശയം ‘അങ്ങോട്ടും ഇങ്ങോട്ടും’ എന്നതാണ്.
- source_word: וַיַּעַל
  choice: തുടർന്ന് അവൻ മുകളിലേക്കു ചെന്നു
  rationale: עלה-യുടെ സ്ഥലപരമായ ‘മുകളിലേക്കു ചെല്ലുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് മുകളിലെ മുറിയിലേക്കോ ബാലൻ കിടന്നിരുന്ന സ്ഥലത്തേക്കോ ഉള്ള നീക്കമാണ്.
- source_word: וַיִּגְהַר עָלָיו
  choice: ബാലന്റെമേൽ കുനിഞ്ഞു
  rationale: גהר ഒരാളുടെമേൽ കുനിയുകയോ വളയുകയോ ചെയ്യുന്ന ശരീരഭാവത്തെ സൂചിപ്പിക്കുന്നു. മൂലപാഠം പറയുന്നതിലധികം ശരീരസ്ഥിതി നിർണയിക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: וַיְזוֹרֵר
  choice: തുമ്മി
  rationale: അപൂർവമായ ഈ ക്രിയയുടെ പരമ്പരാഗതവും നിഘണ്ടുസമ്മതവുമായ അർഥം ‘തുമ്മുക’ എന്നാണ്; തുടർന്നുള്ള എണ്ണൽ ആവർത്തിച്ച തുമ്മലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַנַּעַר
  choice: ബാലൻ
  rationale: ഇവിടെ ശൂനേമ്യസ്ത്രീയുടെ മകനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ബാലൻ’ ആധുനികവും മാന്യവും സന്ദർഭോചിതവുമാണ്.
- source_word: עַד שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: עַד പദത്തിന് ‘വരെ’ എന്ന സാധ്യതയുണ്ടെങ്കിലും, എണ്ണപ്പെട്ട സംഭവങ്ങളുടെ ഈ പ്രയോഗത്തിൽ പൂർത്തിയായ ആകെ എണ്ണം—ഏഴ്—ആണ് സ്വാഭാവിക അർഥം.
- source_word: וַיִּפְקַח ... אֶת עֵינָיו
  choice: കണ്ണുകൾ തുറന്നു
  rationale: פקח עיניים എന്ന സ്ഥിരപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്.
theological_decisions:
- issue: എലീശാ ബാലന്റെമേൽ നടത്തിയ ശാരീരിക പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: പ്രവൃത്തിയെ ‘ബാലന്റെമേൽ കുനിഞ്ഞു’ എന്ന് വിവരണാത്മകമായി അവതരിപ്പിച്ചു.
  alternative: ‘ബാലന്റെമേൽ നീണ്ടുകിടന്നു’ അല്ലെങ്കിൽ ‘ബാലന്റെമേൽ കിടന്നു’ എന്ന് വിവർത്തനം ചെയ്യുക.
  rationale: എബ്രായപാഠം ശരീരഭാവം വിവരിക്കുന്നുവെങ്കിലും അതിനെ അത്ഭുതത്തിന്റെ മാന്ത്രികമോ കൂദാശാപരമോ ആയ കാരണമായി വിശദീകരിക്കുന്നില്ല. അതിനാൽ സംഭവത്തെ മാത്രം രേഖപ്പെടുത്തി പ്രവർത്തനരീതി സംബന്ധിച്ച ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ സംഭവക്രമം ‘പിന്നെ’, ‘തുടർന്ന്’ എന്നിവയിലൂടെ സ്വാഭാവികമാക്കി; ആവർത്തിച്ച ‘ബാലൻ’ എന്ന നാമപ്രയോഗം മൂലപാഠത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ സംരക്ഷിച്ചു.
