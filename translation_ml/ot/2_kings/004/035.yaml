revisions:
- from: പിന്നെ അവൻ മടങ്ങിവന്ന് വീട്ടിനുള്ളിൽ ഒരിക്കൽ ഇങ്ങോട്ടും ഒരിക്കൽ അങ്ങോട്ടും നടന്നു.[a] തുടർന്ന് അവൻ മുകളിലേക്കു ചെന്നു ബാലന്റെമേൽ കുനിഞ്ഞു.[b] ബാലൻ ഏഴു പ്രാവശ്യം തുമ്മി; പിന്നെ ബാലൻ കണ്ണുകൾ തുറന്നു.
  to: പിന്നെ അവൻ മടങ്ങിവന്ന് വീട്ടിനുള്ളിൽ ഒരിക്കൽ ഇങ്ങോട്ടും ഒരിക്കൽ അങ്ങോട്ടും നടന്നു.[a] തുടർന്ന് അവൻ മുകളിലേക്കു ചെന്നു ബാലന്റെമേൽ കുനിഞ്ഞു.[b] ബാലൻ ഏഴു പ്രാവശ്യം തുമ്മി; പിന്നെ ബാലൻ കണ്ണുകൾ തുറന്നു.
  rationale: മുഖ്യവിവർത്തനത്തിൽ മാറ്റം ആവശ്യമില്ല. മൂല എബ്രായത്തിലെ ശരീരഭാവത്തെക്കുറിച്ചുള്ള അർഥപരിധി കൃത്യമായി നിലനിർത്തുന്നതിനായി അടിക്കുറിപ്പ് b മാത്രം തിരുത്തി; ഇതിലൂടെ ‘കിടക്കുക’ എന്ന അനാവശ്യമായ കൂടുതൽ നിർണായക ശരീരസ്ഥിതി ഒഴിവാക്കുന്നു.
