revisions:
- from: 'അപ്പോൾ അവൻ പറഞ്ഞു: “അടുത്ത വർഷം ഇതേ നിശ്ചിത സമയത്ത്[a] നീ ഒരു മകനെ കൈകളിൽ ചേർത്തുപിടിച്ചുകൊണ്ടിരിക്കും.” എന്നാൽ അവൾ പറഞ്ഞു: “അരുതേ, എന്റെ യജമാനനേ, ദൈവപുരുഷാ! അങ്ങയുടെ ദാസിയെ വഞ്ചിക്കരുതേ.”'
  to: 'അപ്പോൾ അവൻ പറഞ്ഞു: “അടുത്ത വർഷം ഇതേ നിശ്ചിത സമയത്ത്[a] നീ ഒരു മകനെ കൈകളിൽ പിടിച്ചുകൊണ്ടിരിക്കും.” എന്നാൽ അവൾ പറഞ്ഞു: “അല്ലേ, എന്റെ പ്രഭോ, ദൈവപുരുഷാ! അങ്ങയുടെ ദാസിയെ വഞ്ചിക്കരുതേ.”'
