language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לַ/מּוֹעֵ֤ד הַ/זֶּה֙ כָּ/עֵ֣ת חַיָּ֔ה אתי חֹבֶ֣קֶת בֵּ֑ן וַ/תֹּ֗אמֶר אַל אֲדֹנִ/י֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אַל תְּכַזֵּ֖ב בְּ/שִׁפְחָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “അടുത്ത വർഷം ഇതേ നിശ്ചിത സമയത്ത്[a] നീ ഒരു മകനെ കൈകളിൽ പിടിച്ചുകൊണ്ടിരിക്കും.” എന്നാൽ അവൾ പറഞ്ഞു: “അല്ലേ, എന്റെ പ്രഭോ, ദൈവപുരുഷാ! അങ്ങയുടെ ദാസിയെ വഞ്ചിക്കരുതേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ജീവനുള്ള സമയത്തുപോലെ”; സന്ദർഭത്തിൽ ഇതേ സമയത്ത് അടുത്ത വർഷം എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה
  choice: ഇതേ നിശ്ചിത സമയത്ത്
  rationale: מוֹעֵד നിശ്ചയിക്കപ്പെട്ടതോ നിർണയിക്കപ്പെട്ടതോ ആയ സമയത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ‘ഇതേ’ എന്ന ആവർത്തനബോധവും നിലനിർത്തുന്നു.
- source_word: כָּעֵת חַיָּה
  choice: അടുത്ത വർഷം
  rationale: ഈ പ്രസവപ്രഖ്യാപനസന്ദർഭത്തിൽ പ്രയോഗം അടുത്ത വർഷം ഇതേ കാലത്തെ സൂചിപ്പിക്കുന്നു. പദാനുപദരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: אתי
  choice: നീ
  rationale: സ്വതന്ത്ര സർവനാമം ഊന്നൽ നൽകുന്നു; മലയാളത്തിലെ വ്യക്തമായ ‘നീ’ അത് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: חֹבֶקֶת
  choice: കൈകളിൽ ചേർത്തുപിടിച്ചുകൊണ്ടിരിക്കും
  rationale: ക്രിയയുടെ ആലിംഗനം ചെയ്യുക, കൈകളിൽ പിടിക്കുക എന്ന ദൃശ്യമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בֵּן
  choice: ഒരു മകനെ
  rationale: എബ്രായപദം പൊതുവായ ‘കുഞ്ഞ്’ എന്നല്ല, വ്യക്തമായി ‘മകൻ’ എന്നാണ്.
- source_word: אַל
  choice: അരുതേ
  rationale: ആദ്യത്തെ אַל വികാരഭരിതമായ നിരാകരണവും അപേക്ഷയും പ്രകടിപ്പിക്കുന്നു; ‘അരുതേ’ ആ സ്വരം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനനേ
  rationale: എലീശയോടുള്ള ആദരപൂർവമായ മാനുഷിക അഭിസംബോധനയാണ്; ദൈവിക ശീർഷകമെന്ന ധ്വനി നൽകാതെ ബഹുമാനം നിലനിർത്തുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷാ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ എബ്രായ ശീർഷകത്തിന്റെ കൃത്യവും മലയാളത്തിൽ പരിചിതവുമായ രൂപം.
- source_word: תְּכַזֵּב
  choice: വഞ്ചിക്കരുതേ
  rationale: നുണ പറയുക, തെറ്റിദ്ധരിപ്പിക്കുക, പറഞ്ഞത് വ്യാജമായി തീരുക എന്നീ അർഥസാധ്യതകളുണ്ട്; വ്യാജപ്രതീക്ഷ നൽകരുതെന്ന അപേക്ഷയുടെ ശക്തി ‘വഞ്ചിക്കരുതേ’ ഉൾക്കൊള്ളുന്നു.
- source_word: בְּשִׁפְחָתֶךָ
  choice: അങ്ങയുടെ ദാസിയെ
  rationale: സ്ത്രീലിംഗരൂപം വ്യക്തമായി നിലനിർത്തുകയും വിനയപൂർവമായ സ്വയംവിശേഷണം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: אֲדֹנִי എന്ന ആദരസൂചകമായ മാനുഷിക അഭിസംബോധന
  choice: എന്റെ യജമാനനേ
  alternative: എന്റെ നാഥാ / സാർ
  rationale: ഇത് ദൈവത്തോടല്ല, എലീശയോടുള്ള അഭിസംബോധനയാണ്. ‘യജമാനൻ’ സാമൂഹിക ബഹുമാനം സംരക്ഷിക്കുമ്പോൾ ദൈവിക അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. സ്ത്രീയുടെ ഞെട്ടലും അപേക്ഷയും പ്രകടമാക്കാൻ ‘അരുതേ’ ഉപയോഗിച്ചു; സ്ത്രീലിംഗമായ שִׁפְחָה ‘ദാസിയെ’ എന്ന് വ്യക്തമായി നിലനിർത്തി.
