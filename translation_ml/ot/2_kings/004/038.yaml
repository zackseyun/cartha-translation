base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
translation:
  language: ml
  text: എലീശാ ഗിൽഗാലിലേക്കു മടങ്ങിവന്നു; ദേശത്ത് ക്ഷാമമുണ്ടായിരുന്നു. പ്രവാചകന്മാരുടെ പുത്രന്മാർ[a] അവന്റെ മുമ്പിൽ ഇരിക്കുകയായിരുന്നു. അവൻ തന്റെ പരിചാരകനോട്, “വലിയ പാചകക്കലം അടുപ്പത്തുവെച്ച് പ്രവാചകന്മാരുടെ പുത്രന്മാർക്കുവേണ്ടി കറി വേവിക്കുക” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പ്രവാചകന്മാരുടെ ശിഷ്യന്മാർ”; ഈ പ്രയോഗം ഒരു പ്രവാചകസമൂഹത്തിലെ അംഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: ഹീബ്രായ കുടുംബബന്ധരൂപകത്തിന്റെ സ്ഥാപനപരമായ അർഥം വ്യക്തമാക്കുന്ന പദപരമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: שָׁב
  choice: മടങ്ങിവന്നു
  rationale: שוב എന്ന ക്രിയയുടെ ഖാൽ സമാപികാരൂപം മുമ്പുണ്ടായിരുന്ന സ്ഥലത്തേക്കുള്ള മടങ്ങിവരവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മടങ്ങിവന്നു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַגִּלְגָּלָה
  choice: ഗിൽഗാലിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה ചലനം ഗിൽഗാലിലേക്കാണെന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְהָרָעָב בָּאָרֶץ
  choice: അപ്പോൾ ദേശത്ത് ക്ഷാമമുണ്ടായിരുന്നു
  rationale: ക്രിയയില്ലാത്ത ഈ ഉപവാക്യം കഥയുടെ പശ്ചാത്തല സാഹചര്യം നൽകുന്നു. ‘അപ്പോൾ’ ആ സാഹചര്യബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ക്ഷാമമുണ്ടായിരുന്നു’ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: בְנֵי הַנְּבִיאִים
  choice: പ്രവാചകന്മാരുടെ പുത്രന്മാർ
  rationale: ഹീബ്രായ കുടുംബബന്ധരൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. ഇത് ജൈവപുത്രന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നതല്ലെന്നും പ്രവാചകശിഷ്യസമൂഹത്തെ സൂചിപ്പിക്കാമെന്നും അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: יֹשְׁבִים לְפָנָיו
  choice: അവന്റെ മുമ്പിൽ ഇരിക്കുകയായിരുന്നു
  rationale: വർത്തമാനകൃദന്തരൂപം തുടരുന്ന രംഗാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; לְפָנָיו സാന്നിധ്യത്തിലും ശിഷ്യസ്ഥാനത്തിലും അവന്റെ മുമ്പിലുള്ള ഇരിപ്പിനെ നിലനിർത്തുന്നു.
- source_word: לְנַעֲרוֹ
  choice: തന്റെ പരിചാരകനോട്
  rationale: נַעַר എന്നതിന് യുവാവ്, ദാസൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ഏല്പിക്കപ്പെട്ട സേവനചുമതല കണക്കിലെടുത്ത് ‘പരിചാരകൻ’ യോജിക്കുന്നു; പ്രായത്തെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: שְׁפֹת הַסִּיר הַגְּדוֹלָה
  choice: വലിയ പാചകക്കലം അടുപ്പത്തുവെച്ച്
  rationale: שפת ഇവിടെ കലം പാചകത്തിനായി തീയിൽ വെക്കുന്നതാണ്. ‘അടുപ്പത്തുവെച്ച്’ മലയാളവായനക്കാരന് ഉദ്ദേശിച്ച പ്രവൃത്തി വ്യക്തമായി നൽകുന്നു; סִיר എന്നത് പാചകക്കലമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וּבַשֵּׁל נָזִיד
  choice: കൂട്ടുകറി വേവിക്കുക
  rationale: נָזִיד തിളപ്പിച്ചുണ്ടാക്കുന്ന കട്ടിയുള്ള ഭക്ഷണം അഥവാ stew ആണ്. ‘കൂട്ടുകറി’ മധുരവിഭവമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി ആ പൊതുവായ ഭക്ഷണവിഭാഗം സൂചിപ്പിക്കുന്നു; בשל എന്നതിനു ‘വേവിക്കുക’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: בְנֵי הַנְּבִיאִים എന്ന സ്ഥാപനപരമായ കുടുംബബന്ധരൂപകം
  choice: മുഖ്യപാഠത്തിൽ ‘പ്രവാചകന്മാരുടെ പുത്രന്മാർ’
  alternative: ‘പ്രവാചകന്മാരുടെ ശിഷ്യന്മാർ’ അഥവാ ‘പ്രവാചകസമൂഹത്തിലെ അംഗങ്ങൾ’
  rationale: മൂലഭാഷയിലെ രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുമ്പോഴും, അത് ജൈവവംശബന്ധം നിർബന്ധമായി സൂചിപ്പിക്കുന്നുവെന്ന വ്യാഖ്യാനം ഒഴിവാക്കാൻ അർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പഴഞ്ചനായ ‘പായസം’ പോലുള്ള പദം ഒഴിവാക്കി, נָזִיד എന്ന പൊതുവായ വേവിച്ച ഭക്ഷണത്തിന് ‘കൂട്ടുകറി’ സ്വീകരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം വിശദീകരിക്കപ്പെടുന്ന ‘പ്രവാചകന്മാരുടെ പുത്രന്മാർ’ എന്ന പ്രയോഗത്തോടുതന്നെ ചേർത്തിരിക്കുന്നു.
