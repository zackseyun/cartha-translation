  text: עַתָּה֮ רֽוּץ נָ֣א לִ/קְרָאתָ/הּ֒ וֶ/אֱמָר לָ֗/הּ הֲ/שָׁל֥וֹם לָ֛/ךְ הֲ/שָׁל֥וֹם לְ/אִישֵׁ֖/ךְ הֲ/שָׁל֣וֹם לַ/יָּ֑לֶד וַ/תֹּ֖אמֶר שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/026.yaml
  text: Now please run to meet her and say to her[a], ‘Is it well with you? Is it well with your husband? Is it well with the child?’ And she said[b], ‘It is well.’
translation:
  language: ml
  text: 'ഇപ്പോൾ ദയവായി അവളെ എതിരേൽക്കാൻ ഓടിച്ചെന്ന് അവളോടു പറയുക: “നിനക്കു സുഖമാണോ?[a] നിന്റെ ഭർത്താവിനു സുഖമാണോ? കുട്ടിക്കു[b] സുഖമാണോ?” അവൾ പറഞ്ഞു: “സുഖമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഈ വാക്യത്തിൽ നാലുതവണ വരുന്ന എബ്രായപദമായ ശാലോം സമാധാനം, സമ്പൂർണത, ക്ഷേമം എന്നിവയെ സൂചിപ്പിക്കാം. ഇവിടെ അത് ഒരാളുടെ അവസ്ഥയെയോ ക്ഷേമത്തെയോ കുറിച്ചാണ്: “സുഖമാണോ?” / “സുഖമാണ്.”'
    reason: lexical_alternative
  - marker: b
    text: “ആൺകുട്ടിക്കു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ യെലെദ് എന്ന പദത്തിന് “കുട്ടി” എന്നോ “ആൺകുട്ടി” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: ഇപ്പോൾ
  rationale: അടിയന്തരമായ നിർദേശം ആരംഭിക്കുന്ന കാലസൂചക ക്രിയാവിശേഷണം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: רוּץ נָא
  choice: ദയവായി ഓടിച്ചെന്ന്
  rationale: רוּץ എന്ന ആജ്ഞയുടെ ശക്തിയും נָא നൽകുന്ന വിനയമോ അഭ്യർഥനാഭാവമോ ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: לִקְרָאתָהּ
  choice: അവളെ എതിരേറ്റ്
  rationale: ഒരാളെ സ്വീകരിക്കാനായി അയാളുടെ നേരെ ചെല്ലുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദിശാബോധം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וֶאֱמָר לָהּ
  choice: അവളോട് ചോദിക്കൂ
  rationale: മൂലത്തിൽ അക്ഷരാർഥം ‘അവളോട് പറയുക’ എന്നാണെങ്കിലും പിന്നാലെയുള്ള വാക്കുകൾ ചോദ്യങ്ങളായതിനാൽ മലയാളത്തിൽ ‘ചോദിക്കൂ’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הֲשָׁלוֹם לָךְ
  choice: നിനക്കു സുഖമാണോ?
  rationale: שָׁלוֹם ഇവിടെ ആരോഗ്യത്തിൽ മാത്രം ഒതുങ്ങാത്ത ക്ഷേമത്തെക്കുറിച്ചുള്ള അന്വേഷണമാണ്; ആവർത്തിതമായ ഹീബ്രു ഘടനയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֲשָׁלוֹם לְאִישֵׁךְ
  choice: നിന്റെ ഭർത്താവിനു സുഖമാണോ?
  rationale: സ്ത്രീയോടുള്ള ബന്ധത്തിൽ אִישׁ ഇവിടെ ‘ഭർത്താവ്’ എന്നാണ്; മുൻചോദ്യത്തിന്റെ സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
- source_word: הֲשָׁלוֹם לַיָּלֶד
  choice: കുട്ടിക്കു സുഖമാണോ?
  rationale: יֶלֶד എന്നത് ‘കുട്ടി’ എന്നും ‘ആൺകുട്ടി’ എന്നും അർഥമാക്കാം; മൂലത്തിലെ പൊതുവായ പദം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַתֹּאמֶר שָׁלוֹם
  choice: 'അവൾ പറഞ്ഞു: “സുഖമാണ്.”'
  rationale: ഒറ്റവാക്കായ שָׁלוֹם എന്ന മറുപടിയുടെ ചുരുക്കവും ‘ക്ഷേമമാണ്/എല്ലാം നന്നാണ്’ എന്ന സന്ദർഭാർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
