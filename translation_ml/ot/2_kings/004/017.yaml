  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
translation:
  language: ml
  text: അങ്ങനെ ആ സ്ത്രീ ഗർഭം ധരിച്ച്, എലീശാ അവളോടു പറഞ്ഞതുപോലെതന്നെ, നിശ്ചയിക്കപ്പെട്ട ആ സമയത്ത്—അടുത്ത വർഷം ഇതേ സമയത്ത്[a]—ഒരു മകനെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ അക്ഷരാർഥം: “നിശ്ചയിക്കപ്പെട്ട ഈ സമയത്ത്, ജീവന്റെ കാലത്ത്”; അടുത്ത വർഷം ഏകദേശം ഇതേ സമയത്ത് എന്നർഥമുള്ള ഒരു പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: ഗർഭം ധരിച്ചു
  rationale: הרה എന്ന ക്രിയ ഗർഭിണിയാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണിത്.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: മുൻസന്ദർഭത്തിൽ തിരിച്ചറിയപ്പെട്ട ശൂനേംകാരിയായ സ്ത്രീയെയാണ് നിർദ്ദിഷ്ട പദം സൂചിപ്പിക്കുന്നത്; ‘ഭാര്യ’ എന്ന അർഥം ഇവിടെ നിർബന്ധമല്ല.
- source_word: וַתֵּלֶד בֵּן
  choice: ഒരു മകനെ പ്രസവിച്ചു
  rationale: ילד + בן എന്ന പ്രസവസംബന്ധമായ സാധാരണ എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לַמּוֹעֵד הַזֶּה
  choice: നിശ്ചയിക്കപ്പെട്ട ആ സമയത്ത്
  rationale: מוֹעֵד മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ട സമയത്തെ സൂചിപ്പിക്കുന്നു; കഥനത്തിന്റെ പിന്നോട്ടുള്ള പരാമർശത്തിന് മലയാളത്തിൽ ‘ആ’ സ്വാഭാവികമാണ്.
- source_word: כָּעֵת חַיָּה
  choice: അടുത്ത വർഷം ഇതേ കാലത്തോടടുത്ത്
  rationale: അടുത്ത വർഷത്തെ ഏകദേശം ഇതേ കാലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ אֱלִישָׁע
  choice: എലീശാ അവളോടു പറഞ്ഞതുപോലെതന്നെ
  rationale: മുൻപ് എലീശാ പറഞ്ഞ വാക്കിന്റെ കൃത്യമായ നിവൃത്തിയാണ് ആപേക്ഷിക ഉപവാക്യം സൂചിപ്പിക്കുന്നത്.
- source_word: אֱלִישָׁע
  choice: എലീശാ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ പേരിന്റെ ലിപ്യന്തരണം.
