  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ സമയപ്രയോഗത്തിന്റെ അർഥം മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കുകയും അതിന്റെ അസാധാരണമായ അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
