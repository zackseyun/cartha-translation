source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלֶ֤י/הָ אֱלִישָׁע֙ מָ֣ה אֶֽעֱשֶׂה לָּ֔/ךְ הַגִּ֣ידִי לִ֔/י מַה יֶּשׁ ל/כי בַּ/בָּ֑יִת וַ/תֹּ֗אמֶר אֵ֣ין לְ/שִׁפְחָתְ/ךָ֥ כֹל֙ בַּ/בַּ֔יִת כִּ֖י אִם אָס֥וּךְ שָֽׁמֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/002.yaml
  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
translation:
  language: ml
  text: 'എലീശാ അവളോടു പറഞ്ഞു: “ഞാൻ നിനക്കുവേണ്ടി എന്തു ചെയ്യണം? പറയൂ, നിന്റെ വീട്ടിൽ എന്തുണ്ട്?” അവൾ പറഞ്ഞു: “അങ്ങയുടെ ദാസിക്ക് വീട്ടിൽ ഒരു എണ്ണപ്പാത്രം[a] അല്ലാതെ മറ്റൊന്നുംതന്നെയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു ഭരണി എണ്ണ” അല്ലെങ്കിൽ “ഒരു ചെറിയ കുപ്പി എണ്ണ”; אָסוּךְ എന്ന എബ്രായപദം എണ്ണയ്ക്കുള്ള ഒരു ചെറിയ പാത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: ഞാൻ നിനക്കുവേണ്ടി എന്തു ചെയ്യണം?
  rationale: לְ എന്ന ഘടകം അവൾക്കുവേണ്ടിയുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; അപൂർണക്രിയയുടെ ആലോചനാത്മക ഭാവം ‘എന്തു ചെയ്യണം?’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַגִּידִי לִי
  choice: പറയൂ
  rationale: നגד എന്ന ക്രിയയുടെ സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപത്തെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആജ്ഞയായി പരിഭാഷപ്പെടുത്തി; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ദയവായി’ ചേർത്തിട്ടില്ല.
- source_word: מַה יֶּשׁ לָכִי בַּבָּיִת
  choice: നിന്റെ വീട്ടിൽ എന്തുണ്ട്?
  rationale: יֵשׁ + ל എന്ന ഉടമസ്ഥതാസൂചക പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ചോദ്യംകൊണ്ട് അവതരിപ്പിക്കുകയും വീട്ടിലെ വസ്തു എന്ന പശ്ചാത്തലം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לְשִׁפְחָתְךָ
  choice: അങ്ങയുടെ ദാസിക്ക്
  rationale: שִׁפְחָה സ്ത്രീലിംഗ സേവികയെ സൂചിപ്പിക്കുന്നു; ‘ദാസി’ ലിംഗസൂചനയും അവളുടെ വിനയപൂർവമായ സ്വയംപരാമർശവും നിലനിർത്തുന്നു. ‘അങ്ങയുടെ’ ആദരസൂചകമാണ്.
- source_word: אֵין ... כֹל
  choice: മറ്റൊന്നുംതന്നെയില്ല
  rationale: നിഷേധത്തിന്റെ ഊന്നൽ ‘ഒന്നുംതന്നെ’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ പ്രകടമാക്കുന്നു; തുടർന്നുള്ള ഏക അപവാദവുമായി ഇത് ചേർന്നു നിൽക്കുന്നു.
- source_word: כִּי אִם
  choice: അല്ലാതെ
  rationale: മുമ്പുള്ള സമ്പൂർണ നിഷേധത്തിൽനിന്നുള്ള ഏക അപവാദം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אָסוּךְ שָׁמֶן
  choice: ഒരു കുപ്പി എണ്ണ
  rationale: אָסוּךְ എണ്ണ സൂക്ഷിക്കുന്ന ചെറിയ പാത്രത്തെ സൂചിപ്പിക്കുന്ന അപൂർവപദമാണ്. ‘കുപ്പി’ പാത്രത്തിന്റെ കൃത്യമായ ആകൃതിയോ വസ്തുവോ അനാവശ്യമായി നിശ്ചയിക്കാതെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പരിഭാഷയാണ്; വലിപ്പത്തിലും രൂപത്തിലും ഉള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
