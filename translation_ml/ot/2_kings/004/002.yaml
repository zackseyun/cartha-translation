translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. പ്രവാചകന്റെ നേരിട്ടുള്ള ചോദ്യം ലളിതമായി നിലനിർത്തി; വിധവയുടെ വിനയപൂർവമായ സ്വയംപരാമർശത്തിന് ‘അങ്ങയുടെ ദാസി’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘എണ്ണ’ എന്ന പദത്തോടു ചേർത്തിരിക്കുന്നു.
