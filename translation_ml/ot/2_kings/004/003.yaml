id: 2KI.4.3
reference: 2 Kings 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לְכִ֨י שַׁאֲלִי לָ֤/ךְ כֵּלִים֙ מִן הַ/ח֔וּץ מֵ/אֵ֖ת כָּל שכנ/כי כֵּלִ֥ים רֵקִ֖ים אַל תַּמְעִֽיטִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/003.yaml
  text: Then he said[a], “Go, borrow vessels for yourself from outside, from all your neighbors—empty vessels[b]. Do not gather only a few.”
translation:
  language: ml
  text: 'അപ്പോൾ അദ്ദേഹം പറഞ്ഞു: “പോയി, പുറത്തുപോയി നിന്റെ എല്ലാ അയൽക്കാരിൽനിന്നും നിനക്കായി പാത്രങ്ങൾ കടം വാങ്ങൂ—ഒഴിഞ്ഞ പാത്രങ്ങൾ. കുറച്ചുമാത്രം കടം വാങ്ങരുത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכִי
  choice: പോയി
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞയുടെ സ്വാഭാവിക മലയാളരൂപം; സ്ത്രീയെ പ്രവർത്തിക്കാൻ അയയ്ക്കുന്നതാണ് സന്ദർഭം.
- source_word: שַׁאֲלִי
  choice: കടം ചോദിക്കൂ
  rationale: ക്രിയയ്ക്ക് പൊതുവായി ‘ചോദിക്കുക’ എന്നർഥമുണ്ടെങ്കിലും അയൽക്കാരിൽനിന്ന് താൽക്കാലിക ഉപയോഗത്തിനായി പാത്രങ്ങൾ നേടുന്ന സന്ദർഭത്തിൽ ‘കടം ചോദിക്കുക’ എന്നത് യോജിക്കുന്നു.
- source_word: כֵּלִים
  choice: പാത്രങ്ങൾ
  rationale: എണ്ണ സൂക്ഷിക്കാവുന്ന പലതരം പാത്രങ്ങളെയും ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ വിശാലപദം; ‘കുടങ്ങൾ’ എന്നു പറഞ്ഞ് രൂപം അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: לָךְ
  choice: നിനക്കായി
  rationale: വ്യക്തിപരമായ പ്രയോജനമോ പങ്കാളിത്തമോ സൂചിപ്പിക്കുന്ന ദാതൃഭാവം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מִן הַחוּץ
  choice: പുറത്തുനിന്ന്
  rationale: ‘പുറത്തുനിന്ന്’ എന്ന എബ്രായ പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; തുടർന്ന് വരുന്ന അയൽക്കാരെക്കുറിച്ചുള്ള വാക്യഭാഗം അതിന്റെ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: מֵאֵת כָּל שכנכי
  choice: നിന്റെ അയൽക്കാരിൽ എല്ലാവരോടും
  rationale: സ്ത്രീയുടെ സമീപവാസികളെ സമഗ്രമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כֵּלִים רֵקִים
  choice: ഒഴിഞ്ഞ പാത്രങ്ങൾ
  rationale: പാത്രങ്ങൾ എണ്ണ നിറയ്ക്കാൻ ഒഴിഞ്ഞവയായിരിക്കണമെന്ന നിർദേശം വ്യക്തമാക്കുകയും എബ്രായത്തിലെ ‘പാത്രങ്ങൾ’ എന്ന ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אַל תַּמְעִיטִי
  choice: കുറച്ചുമാത്രം വാങ്ങരുത്
  rationale: അക്ഷരാർഥത്തിലെ ‘കുറവാക്കരുത്’ എന്ന ആശയം സന്ദർഭാനുസൃതമായി, പാത്രങ്ങളുടെ എണ്ണം കുറവായിരിക്കരുതെന്ന വ്യക്തമായ നിർദേശമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘പാത്രങ്ങൾ’ എന്നത് മൂലത്തിലെ വിശാലത കാത്തുസൂക്ഷിക്കുന്നു; വാക്യത്തിലെ ആവർത്തനവും ഊന്നലും സാധ്യമായത്ര നിലനിർത്തിയിരിക്കുന്നു.
