translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിർദേശഭാഷ. ‘പുത്രന്മാർ’ മൂലപാഠത്തിലെ ലിംഗനിർദേശം കൃത്യമായി നിലനിർത്തുന്നു; ‘പാത്രങ്ങൾ’ പരമ്പരാഗത ഗൗരവവും സന്ദർഭത്തിലെ വിശാല അർഥവും സംരക്ഷിക്കുന്നു.
