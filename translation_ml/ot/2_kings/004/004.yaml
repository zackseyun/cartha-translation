  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
translation:
  language: ml
  text: പിന്നെ നീയും നിന്റെ പുത്രന്മാരും അകത്തു കയറിയശേഷം വാതിൽ അടയ്ക്കുക. ഈ പാത്രങ്ങളിലെല്ലാം എണ്ണ ഒഴിക്കുക; നിറഞ്ഞ പാത്രങ്ങൾ മാറ്റിവെക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിറഞ്ഞത് മാറ്റുക”; എബ്രായത്തിലെ ഏകവചനം ഓരോ നിറഞ്ഞ പാത്രത്തെയും പൊതുവായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאת
  choice: പിന്നെ അകത്തു കയറി
  rationale: בוא ഇവിടെ വീട്ടിനകത്തേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു; തുടർച്ചയായ പ്രവൃത്തിക്രമം സ്വാഭാവിക മലയാളത്തിൽ ‘പിന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: וְסָגַרְתְּ הַדֶּלֶת בַּעֲדֵךְ וּבְעַד בָּנַיִךְ
  choice: നീയും നിന്റെ പുത്രന്മാരും അകത്തായിരിക്കെ വാതിൽ അടയ്ക്കുക
  rationale: വാതിൽ അവളുടെയും പുത്രന്മാരുടെയും പിന്നിൽ അടയ്ക്കുക എന്ന സ്ഥലപരമായ അർഥവും മറ്റുള്ളവരെ പുറത്തുനിർത്തുന്ന സാഹചര്യവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְיָצַקְתְּ עַל
  choice: എണ്ണ ഒഴിക്കുക
  rationale: יצק എന്നത് ‘ഒഴിക്കുക’ എന്നാണ്. ലക്ഷ്യപാത്രങ്ങൾ തുടർന്നുള്ള പദത്തിൽ വ്യക്തമാകുന്നതിനാൽ എണ്ണ എന്ന കർമം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായി ചേർത്തിരിക്കുന്നു.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: ഈ പാത്രങ്ങളിലെല്ലാം
  rationale: כְּלִים വിവിധതരം ധാരകപാത്രങ്ങളെ സൂചിപ്പിക്കാവുന്ന വിശാലപദമാണ്; ‘പാത്രങ്ങൾ’ ആ വിശാലതയും മലയാളത്തിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: וְהַמָּלֵא תַּסִּיעִי
  choice: നിറയുന്നവ മാറ്റിവെക്കുക
  rationale: നിറഞ്ഞ പാത്രം ഒഴിക്കുന്നിടത്തുനിന്ന് നീക്കി വേറെയിടുക എന്ന പ്രായോഗിക അർഥം നൽകുന്നു. എബ്രായ ഏകവചന വിശേഷണം ഇവിടെ ഓരോ നിറഞ്ഞ പാത്രത്തെയും പൊതുവായി സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
