  text: וַ/יָּבֹ֥א אֱלִישָׁ֖ע הַ/בָּ֑יְתָ/ה וְ/הִנֵּ֤ה הַ/נַּ֨עַר֙ מֵ֔ת מֻשְׁכָּ֖ב עַל מִטָּתֽ/וֹ־׃
