translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. הִנֵּהയുടെ ശ്രദ്ധാകർഷകശക്തിക്ക് ‘അതാ’ ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിൽ നിഷ്ക്രിയ-ഫലാവസ്ഥ നിലനിർത്തുകയും യഥാർഥമായ നിലാവസ്ഥാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
