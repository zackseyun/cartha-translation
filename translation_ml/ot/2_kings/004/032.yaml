  to: എലീശാ വീട്ടിൽ പ്രവേശിച്ചപ്പോൾ, അതാ, ബാലൻ മരിച്ച നിലയിൽ അവന്റെ കിടക്കമേൽ കിടത്തപ്പെട്ടിരുന്നു.[a]
  rationale: The revision renders מֵת explicitly as a state ('മരിച്ച നിലയിൽ') and retains the passive-resultative sense of מֻשְׁכָּב in the main text. 'വീട്ടിൽ പ്രവേശിച്ചപ്പോൾ' clearly conveys entry while remaining idiomatic. The footnote offers the legitimate state-oriented alternative without adding an unsupported 'stretched out' nuance.
