  language: en
  yaml_path: translation/ot/2_kings/004/032.yaml
  text: When Elisha came into the house[a], behold, the boy was dead, laid on his bed.
translation:
  language: ml
  text: എലീശാ വീട്ടിൽ പ്രവേശിച്ചപ്പോൾ, അതാ, ബാലൻ മരിച്ച നിലയിൽ അവന്റെ കിടക്കമേൽ കിടത്തപ്പെട്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവന്റെ കിടക്കമേൽ കിടന്നിരുന്നു.” എബ്രായ കൃതന്തരൂപം കിടത്തപ്പെട്ട നിലയെയോ കിടന്നിരുന്ന അവസ്ഥയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നപ്പോൾ
  rationale: വയ്യക്ഷോൽ രൂപം കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. ദിശാസൂചകമായ ה സഹിതമുള്ള ‘വീട്’ എന്ന പദത്തോടൊപ്പം ചേർന്ന് വീട്ടിനകത്തേക്കുള്ള വരവ് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֱלִישָׁע
  choice: എലീശാ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: הַבָּיְתָה
  choice: വീട്ടിനകത്തു
  rationale: בית എന്ന നാമത്തോടു ചേർന്ന ദിശാസൂചക ה വീട്ടിലേക്കോ വീട്ടിനകത്തേക്കോ ഉള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘വീട്ടിനകത്തു’ അത് വ്യക്തമായി പകരുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: എലീശാ കണ്ട കാഴ്ചയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ സജീവമായ അവതരണശക്തി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַנַּעַר
  choice: ബാലൻ
  rationale: ഇവിടെ ശൂനേംകാരിയുടെ മകനെയാണ് נַעַר സൂചിപ്പിക്കുന്നത്; ‘ബാലൻ’ സന്ദർഭോചിതവും മാന്യവുമാണ്.
- source_word: מֵת
  choice: മരിച്ച്
  rationale: ബാലൻ മരിച്ച നിലയിലാണെന്ന വാക്യഘടകത്തിന്റെ അർഥം അടുത്തുള്ള ‘കിടത്തപ്പെട്ടിരുന്നു’ എന്ന ക്രിയയോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; മുൻസംഭവത്തെ മാത്രം ഊന്നാതെ എത്തിയപ്പോൾ കണ്ട അവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: מֻשְׁכָּב
  choice: കിടത്തപ്പെട്ടിരുന്നു
  rationale: 'ശכבയുടെ ഹോഫാൽ കൃതന്തം സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ-ഫലാവസ്ഥയെ നേരിട്ട് പകരുന്നു: ബാലനെ കിടക്കമേൽ കിടത്തിയ നില. ‘കിടക്കുകയായിരുന്നു’ എന്ന നിലാവസ്ഥാപരമായ പരിഭാഷയും സാധ്യമാണ്.'
- source_word: עַל מִטָּתוֹ
  choice: അവന്റെ കിടക്കമേൽ
  rationale: സർവനാമപ്രത്യയവും עַל എന്ന സ്ഥാനബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
