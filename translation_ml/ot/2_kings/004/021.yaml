id: 2KI.4.21
reference: 2 Kings 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּ֨עַל֙ וַ/תַּשְׁכִּבֵ֔/הוּ עַל מִטַּ֖ת אִ֣ישׁ הָ/אֱלֹהִ֑ים וַ/תִּסְגֹּ֥ר בַּעֲד֖/וֹ וַ/תֵּצֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/021.yaml
  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
translation:
  language: ml
  text: പിന്നെ അവൾ മുകളിലേക്കു ചെന്ന് അവനെ ദൈവപുരുഷന്റെ കിടക്കയിൽ കിടത്തി. അവനെ അകത്താക്കി വാതിൽ അടച്ചശേഷം[a] അവൾ പുറത്തേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവന്റെ പിന്നിൽ വാതിൽ അടച്ചിട്ട്.” എബ്രായപ്രയോഗം അവനെ മുറിക്കുള്ളിലാക്കി വാതിൽ അടച്ചു എന്ന അർഥവും നൽകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: മുകളിലേക്കു ചെന്ന്
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറിപ്പോകുക/മുകളിലേക്കു പോകുക’ എന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മുകളിലെ മുറിയിലേക്കുള്ള നീക്കമാണിത്.
- source_word: וַתַּשְׁכִּבֵהוּ
  choice: അവനെ ... കിടത്തി
  rationale: שׁכב എന്നതിന്റെ കാരകപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘കിടത്തി’ എന്നു നൽകുന്നു.
- source_word: מִטַּת אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷന്റെ കിടക്കയിൽ
  rationale: מִטָּה എന്നത് ഇവിടെ ‘കിടക്ക’; אִישׁ הָאֱלֹהִים എന്ന എബ്രായ സ്ഥാനപ്പേര് വ്യാഖ്യാനിച്ച് ‘പ്രവാചകൻ’ എന്നു മാറ്റാതെ ‘ദൈവപുരുഷൻ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  choice: അവനെ അകത്താക്കി വാതിൽ അടച്ചശേഷം
  rationale: סגר + בְּעַד എന്ന പ്രയോഗം അവൻ മുറിക്കുള്ളിലായിരിക്കെ പ്രവേശനം അടച്ചുവെന്ന അർഥത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. എബ്രായത്തിൽ ‘വാതിൽ’ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും ക്രിയാപ്രയോഗത്തിൽ അത് ഉൾക്കൊള്ളപ്പെടുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַתֵּצֵא
  choice: അവൾ പുറത്തേക്കു പോയി
  rationale: יצא എന്നതിന്റെ വ്യക്തമായ സ്ഥലചലനം ‘പുറത്തേക്കു പോയി’ എന്നു നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും ലളിതവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ പ്രവൃത്തികൾ മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി സ്വാഭാവികമാക്കി; ‘ദൈവപുരുഷൻ’ എന്ന ഉറവിടത്തിലെ സ്ഥാനപ്പേര് അതേപടി സംരക്ഷിച്ചു.
