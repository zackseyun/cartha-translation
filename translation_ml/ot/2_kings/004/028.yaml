  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. സ്ത്രീയുടെ ദുഃഖവും മുൻകാല പ്രതിഷേധത്തിന്റെ തീവ്രതയും ആലങ്കാരിക ചോദ്യങ്ങളിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ഉദ്ധരണിക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
