source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר הֲ/שָׁאַ֥לְתִּי בֵ֖ן מֵ/אֵ֣ת אֲדֹנִ֑/י הֲ/לֹ֣א אָמַ֔רְתִּי לֹ֥א תַשְׁלֶ֖ה אֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/028.yaml
  text: She said[a], “Did I ask my lord for a son? Did I not say, ‘Do not deceive me’?”
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “ഞാൻ എന്റെ പ്രഭുവിനോട് ഒരു മകനെ ചോദിച്ചിരുന്നോ? ‘എന്നെ വഞ്ചിക്കരുത്’[a] എന്ന് ഞാൻ പറഞ്ഞില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെ തെറ്റിദ്ധരിപ്പിക്കരുത്” അല്ലെങ്കിൽ “എനിക്ക് വ്യർഥമായ പ്രതീക്ഷ നൽകരുത്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് ഒരാളെ തെറ്റിദ്ധരിപ്പിക്കുക എന്നർഥമുണ്ട്; ഈ സന്ദർഭത്തിൽ, ഒടുവിൽ ശൂന്യമായി തീരുന്ന പ്രതീക്ഷ ജനിപ്പിക്കുക എന്ന ആശയവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അവൾ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ אמר അവളുടെ വാക്കുകൾ അവതരിപ്പിക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിൽ തുടക്കത്തിലെ ‘അപ്പോൾ/എന്നിട്ട്’ നിർബന്ധമല്ല.
- source_word: הֲשָׁאַלְתִּי
  choice: ഞാൻ ... ചോദിച്ചിരുന്നോ?
  rationale: ചോദ്യം വാസ്തവത്തിൽ അഭ്യർഥിച്ചില്ലെന്ന ഊന്നലുള്ള ആലങ്കാരിക ചോദ്യമാണ്; മുൻകാല സംഭവത്തെ ഓർമിപ്പിക്കുന്നതിനാൽ ‘ചോദിച്ചിരുന്നോ’ സ്വാഭാവികമാണ്.
- source_word: בֵן
  choice: ഒരു മകനെ
  rationale: בֵן വ്യക്തമായി ‘മകൻ’ എന്നാണ്; പൊതുവായ ‘കുഞ്ഞ്’ എന്നാക്കി ലിംഗസൂചന നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: מֵאֵת אֲדֹנִי
  choice: എന്റെ യജമാനനോട്
  rationale: മൂലത്തിലെ ‘എന്റെ യജമാനനിൽനിന്ന്’ എന്ന ബന്ധം മലയാളത്തിലെ ‘ചോദിക്കുക’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായി ദാതൃവിഭക്തിയിൽ വരുന്നു. ഇത് എലീശായോടുള്ള ആദരസംബോധനയാണ്, ദൈവിക പദവിയല്ല.
- source_word: הֲלֹא אָמַרְתִּי
  choice: ഞാൻ പറഞ്ഞില്ലേ?
  rationale: മുമ്പ് പറഞ്ഞ പ്രതിഷേധത്തെ ഓർമിപ്പിക്കുന്ന രണ്ടാമത്തെ ആലങ്കാരിക ചോദ്യം; ആരോടാണ് പറഞ്ഞതെന്നത് സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ അധികമായി ചേർത്തിട്ടില്ല.
- source_word: לֹא תַשְׁלֶה אֹתִי
  choice: എനിക്ക് വ്യാമോഹം ജനിപ്പിക്കരുത്
  rationale: ശൂന്യമായി തീരാവുന്ന പ്രതീക്ഷ ഉണർത്തി തെറ്റിദ്ധരിപ്പിക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു; നേരിട്ടുള്ള ‘വഞ്ചിക്കരുത്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
