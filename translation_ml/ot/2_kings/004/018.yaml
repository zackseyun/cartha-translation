- from: ആ ബാലൻ വളർന്നു. ഒരു ദിവസം അവൻ കൊയ്ത്തുകാരോടൊപ്പമുണ്ടായിരുന്ന തന്റെ അപ്പന്റെ അടുക്കലേക്കു പുറപ്പെട്ടുപോയി.
  to: ആ ബാലൻ വളർന്നു. ഒരു ദിവസം അവൻ പുറത്തേക്കു പോയി, തന്റെ അപ്പന്റെ അടുത്തേക്കു, കൊയ്ത്തുകാരുടെ അടുത്തേക്കു.
  rationale: The revision removes the added assertion that the father was 'with' the reapers and preserves the Hebrew's two successive אֶל phrases ('to his father, to the reapers'). 'പുറത്തേക്കു പോയി' retains the outward-motion nuance of וַיֵּצֵא, while the rest remains clear, natural modern Malayalam.
