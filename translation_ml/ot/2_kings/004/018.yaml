source:
  edition: WLC
  text: וַ/יִּגְדַּ֖ל הַ/יָּ֑לֶד וַ/יְהִ֣י הַ/יּ֔וֹם וַ/יֵּצֵ֥א אֶל אָבִ֖י/ו אֶל הַ/קֹּצְרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/018.yaml
  text: And the boy grew[a], and one day he went out to his father[b], to the reapers.
translation:
  language: ml
  text: ആ ബാലൻ വളർന്നു. ഒരു ദിവസം അവൻ പുറത്തേക്കു പോയി, തന്റെ അപ്പന്റെ അടുത്തേക്കു, കൊയ്ത്തുകാരുടെ അടുത്തേക്കു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: വളർന്നു
  rationale: גדל എന്ന ക്രിയ ഇവിടെ ബാലന്റെ ശാരീരിക വളർച്ചയെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തേക്കാൾ കൂടുതൽ പ്രായപൂർത്തിയുടെ ആശയം ചേർക്കാതെ ലളിതമായി അർഥം നൽകുന്നു.
- source_word: הַיָּלֶד
  choice: ആ ബാലൻ
  rationale: יֶלֶד എന്നതിന് ‘കുട്ടി’ എന്നും ‘ബാലൻ’ എന്നും അർഥമാകാം. ഇവിടെ ആൺകുട്ടിയെയാണ് കഥ സൂചിപ്പിക്കുന്നത്; മുൻസന്ദർഭത്തിൽ പരിചയപ്പെടുത്തിയ കുട്ടിയായതിനാൽ ‘ആ ബാലൻ’ സ്വാഭാവികമാണ്.
- source_word: וַיְהִי הַיּוֹם
  choice: ഒരു ദിവസം
  rationale: ഒരു പ്രത്യേക സംഭവാവസരം അവതരിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടുപോയി
  rationale: יצא എന്ന ക്രിയയിലെ പുറത്തേക്കുള്ള ഗതിയുടെ ഭാവം നിലനിർത്തുകയും ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל אָבִיו אֶל הַקֹּצְרִים
  choice: കൊയ്ത്തുകാരോടൊപ്പമുണ്ടായിരുന്ന തന്റെ അപ്പന്റെ അടുക്കലേക്കു
  rationale: ആവർത്തിക്കുന്ന אֶל ഘടന അപ്പൻ കൊയ്ത്തുകാരുടെ അടുത്തോ അവരുടെ കൂട്ടത്തിലോ ഉണ്ടായിരുന്നുവെന്ന ബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കി സ്വാഭാവികമാക്കാൻ ബന്ധം ഇങ്ങനെ പ്രകടമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പിതാവ്’ എന്നതിനെക്കാൾ കുടുംബകഥനത്തിൽ സാധാരണവും ഊഷ്മളവുമായ ‘അപ്പൻ’ തെരഞ്ഞെടുത്തു; കൃഷിസന്ദർഭത്തിന് പരിചിതമായ ‘കൊയ്ത്തുകാർ’ ഉപയോഗിച്ചു.
