translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. മൂലത്തിലെ പ്രവർത്തനക്രമവും ‘വിളിക്കുക’ എന്ന ക്രിയയുടെ ആവർത്തനവും സംരക്ഷിച്ചു. ‘ശൂനേംകാരി’ എന്ന സ്ത്രീലിംഗ രൂപം മൂലത്തിലെ feminine gentilic നേരിട്ടു വ്യക്തമാക്കുന്നതിനാൽ ഇംഗ്ലീഷിലുള്ള വിശദീകരണ അടിക്കുറിപ്പ് മലയാളത്തിൽ ആവശ്യമില്ല.
