  source_fidelity: 'എബ്രായ മൂലത്തിലെ പ്രവർത്തനക്രമം കൃത്യമായി നിലനിർത്തിയിട്ടുണ്ട്: എലീശാ ഗേഹസിയെ വിളിക്കുന്നു, ശൂനേംകാരിയെ വിളിക്കാൻ കല്പിക്കുന്നു, ഗേഹസി അവളെ വിളിക്കുന്നു, അവൾ അവന്റെ അടുക്കൽ വരുന്നു, തുടർന്ന് മകനെ എടുത്തുകൊള്ളാൻ പറയപ്പെടുന്നു. קרא എന്ന ക്രിയയുടെ ആവർത്തനവും שְׂאִי בְנֵךְ എന്ന സ്ത്രീലിംഗ ഏകവചന ആജ്ഞയും ‘നിന്റെ മകനെ എടുത്തുകൊൾക’ എന്നതിലൂടെ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു.'
  naturalness: ‘പിന്നെ അവൻ ഗേഹസിയെ വിളിച്ച് പറഞ്ഞു’യും ‘അവൾ അവന്റെ അടുക്കൽ വന്നു’യും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായ കഥനശൈലിയാണ്. ‘ഈ ശൂനേംകാരിയെ’ എന്ന പ്രയോഗം സ്ത്രീലിംഗ ജനപദനാമത്തെയും ‘ഈ’ എന്ന നിർദേശകത്തെയും വ്യക്തമായി അറിയിക്കുന്നു. ‘എടുത്തുകൊൾക’ ഗൗരവമുള്ള തിരുവെഴുത്തു-രജിസ്റ്ററിന് അനുയോജ്യമാണ്.
  terminology: ‘ഗേഹസി’ എന്ന പേരിന്റെ ലിപ്യന്തരണം സ്വീകരിക്കാവുന്നതാണ്. ‘ശൂനേംകാരി’ എന്നത് שׁוּנַמִּית എന്ന സ്ത്രീലിംഗ ജനപദനാമത്തിനു യോജിച്ച, വ്യക്തവും സ്വാഭാവികവുമായ മലയാള രൂപമാണ്. ‘മകൻ’ בן എന്ന പദത്തിന്റെ നിർദിഷ്ട അർഥം സംരക്ഷിക്കുന്നു.
