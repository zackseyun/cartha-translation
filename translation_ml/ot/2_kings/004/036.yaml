translation:
  language: ml
  text: 'പിന്നെ അവൻ ഗേഹസിയെ വിളിച്ച് പറഞ്ഞു: “ഈ ശൂനേംകാരിയെ വിളിക്കൂ.” അവൻ അവളെ വിളിച്ചു; അവൾ അവന്റെ അടുക്കൽ വന്നു. അപ്പോൾ അവൻ പറഞ്ഞു: “നിന്റെ മകനെ എടുത്തുകൊൾക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֶל גֵּיחֲזִי
  choice: പിന്നെ അവൻ ഗേഹസിയെ വിളിച്ച്
  rationale: കഥനത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്ന wayyiqtol രൂപത്തെ സ്വാഭാവികമായ മലയാള കഥനശൈലിയിൽ ‘പിന്നെ’ എന്നു നൽകി; קרא എന്നതിന്റെ ആവർത്തനം വാക്യത്തിലുടനീളം നിലനിർത്തി.
- source_word: גֵּיחֲזִי
  choice: ഗേഹസി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: קְרָא
  choice: വിളിക്കൂ
  rationale: קרא എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം സന്ദർഭത്തിൽ നേരിട്ട് വിളിച്ചുവരുത്തുക എന്ന അർഥത്തിലാണ്; ആധുനികവും സ്വാഭാവികവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു.
- source_word: הַשֻּׁנַמִּית הַזֹּאת
  choice: ഈ ശൂനേംകാരിയെ
  rationale: സ്ത്രീലിംഗ ജനപദനാമം ശൂനേമിൽനിന്നുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-കാരി’ രൂപം സ്ത്രീയെയും സ്വദേശബന്ധത്തെയും വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘സ്ത്രീ’ എന്ന പദം വേറിട്ട് ചേർക്കേണ്ടതില്ല; הַזֹּאת എന്നത് ‘ഈ’ ആയി നിലനിർത്തി.
- source_word: וַיִּקְרָאֶהָ
  choice: അവൻ അവളെ വിളിച്ചു
  rationale: ഗേഹസിയുടെ അനുസരണം എബ്രായപാഠം പ്രത്യേകം വിവരിക്കുന്നതിനാൽ קרא എന്ന ക്രിയയുടെ ആവർത്തനം ചുരുക്കാതെ നിലനിർത്തി.
- source_word: וַתָּבֹא אֵלָיו
  choice: അവൾ അവന്റെ അടുക്കൽ വന്നു
  rationale: בוא + אֶל എന്നത് ഒരാളുടെ അടുക്കലേക്കുള്ള ചലനമാണ്; മുറിയിലേക്കു പ്രവേശിച്ചു എന്ന അധിക ആശയം ചേർക്കാതെ വിവർത്തനം ചെയ്തു.
- source_word: שְׂאִי
  choice: എടുത്തുകൊൾക
  rationale: נשׂא എന്ന ക്രിയയുടെ സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപം ഇവിടെ പുനർജീവിച്ച മകനെ എടുത്തുകൊള്ളാൻ അമ്മയോടു പറയുന്നതാണ്. ‘എടുത്തുകൊൾക’ അർഥവും ഗൗരവമുള്ള ഭാഷാശൈലിയും നിലനിർത്തുന്നു.
- source_word: בְנֵךְ
  choice: നിന്റെ മകനെ
  rationale: בן എന്ന പദത്തിന്റെ ‘മകൻ’ എന്ന നിർദിഷ്ട അർഥവും രണ്ടാം പുരുഷ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയവും കൃത്യമായി നിലനിർത്തി.
