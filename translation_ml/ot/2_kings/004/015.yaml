  text: וַ/יֹּ֖אמֶר קְרָא לָ֑/הּ וַ/יִּקְרָא לָ֔/הּ וַֽ/תַּעֲמֹ֖ד בַּ/פָּֽתַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/015.yaml
  text: Then he said[a], “Call her.” So he called her, and she stood in the doorway.
translation:
  language: ml
  text: അപ്പോൾ അവൻ, “അവളെ വിളിക്കൂ” എന്നു പറഞ്ഞു. അവൻ അവളെ വിളിച്ചു; അവൾ വാതിൽക്കൽ[a] നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പ്രവേശനസ്ഥാനത്ത്.” എബ്രായപദം വാതിൽത്തുറവിനെയോ പ്രവേശനഭാഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവൻ ... എന്നു പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ക്രമാനുഗതമായ നീക്കം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קְרָא לָהּ
  choice: അവളെ വിളിക്കൂ
  rationale: പുരുഷ ഏകവചനത്തോടുള്ള നേരിട്ടുള്ള കല്പനയാണ്; ‘വിളിക്കൂ’ സാധാരണവും സന്ദർഭോചിതവുമായ പ്രയോഗമാണ്.
- source_word: וַיִּקְרָא לָהּ
  choice: അവൻ അവളെ വിളിച്ചു
  rationale: കല്പനയ്ക്കു പിന്നാലെയുള്ള പ്രവർത്തിയെ ലളിതമായി പ്രതിഫലിപ്പിക്കുന്നു; മൂലപാഠം പറയാത്ത ‘വരുത്തി’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: וַתַּעֲמֹד
  choice: അവൾ ... നിന്നു
  rationale: עמד എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘നിൽക്കുക’ നിലനിർത്തുന്നു; ‘വന്നു നിന്നു’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: בַּפָּתַח
  choice: വാതിൽക്കൽ
  rationale: פתח വാതിൽത്തുറവിനെയോ പ്രവേശനസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം; ‘വാതിൽക്കൽ’ ആ സ്ഥാനത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും പദത്തിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ സർവനാമപരമായ പരാമർശം നിലനിർത്തിയിട്ടുണ്ട്; സന്ദർഭത്തിൽ ഇല്ലാത്ത വ്യക്തിനാമങ്ങൾ ചേർത്തിട്ടില്ല. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പിന്റെ അടയാളം ‘said’ എന്നതിനു പിന്നാലെയാണെങ്കിലും അടിക്കുറിപ്പ് בַּפָּתַח എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ അത് ‘വാതിൽക്കൽ’ എന്നതിനു പിന്നാലെ സ്ഥാപിച്ചു.
