  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
translation:
  language: ml
  text: 'അങ്ങനെ അവൾ പുറപ്പെട്ട് കർമ്മേൽമലയിൽ ദൈവപുരുഷന്റെ അടുക്കൽ എത്തി. ദൈവപുരുഷൻ അവളെ ദൂരെനിന്ന്[a] കണ്ടപ്പോൾ തന്റെ ശുശ്രൂഷകനായ ഗേഹസിയോട് പറഞ്ഞു: “അതാ, ആ ശൂനേംകാരി!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അകലെനിന്ന്.” അവൾ ഇനിയും കുറെ അകലെയായിരിക്കുമ്പോൾ അവൻ അവളെ കണ്ടുവെന്നാണ് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: അങ്ങനെ അവൾ പുറപ്പെട്ട് ... എത്തി
  rationale: തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനങ്ങളെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘പോയി വന്നു’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കി പുറപ്പെടലും ലക്ഷ്യസ്ഥാനത്തെത്തലും നിലനിർത്തുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: എലീശായെ ‘പ്രവാചകൻ’ എന്ന് വ്യാഖ്യാനിച്ച് മാറ്റാതെ എബ്രായ ശീർഷകത്തെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: കർമ്മേൽമലയിൽ
  rationale: ദൈവപുരുഷൻ ഉണ്ടായിരുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നതായി സന്ദർഭാനുസൃതമായി നൽകുന്നു.
- source_word: מִנֶּגֶד
  choice: ദൂരെനിന്ന്
  rationale: അവൾ ഇനിയും അകലെയായിരിക്കുമ്പോൾ അവൻ കണ്ടുവെന്ന സ്ഥലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: נַעֲרוֹ
  choice: തന്റെ ശുശ്രൂഷകനായ
  rationale: അക്ഷരാർഥത്തിലെ ‘യുവാവ്’ എന്നതിലുപരി ഇവിടെ ഗേഹസിയുടെ പരിചാരകപങ്കാണ് ഉദ്ദേശിക്കുന്നത്; ‘ശുശ്രൂഷകൻ’ ആ പങ്ക് മാന്യവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: הִנֵּה
  choice: അതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ദൈക്തികബലം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: הַשּׁוּנַמִּית הַלָּז
  choice: ആ ശൂനേംകാരി
  rationale: അകലെയുള്ള നിർദിഷ്ട സ്ത്രീയെ ചൂണ്ടിക്കാണിക്കുന്ന സൂചനയും അവളുടെ സ്ഥലപരമായ തിരിച്ചറിയലും നിലനിർത്തുന്നു.
