source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל גֵּחֲזִ֣י נַעֲר֔/וֹ קְרָ֖א לַ/שּׁוּנַמִּ֣ית הַ/זֹּ֑את וַ/יִּקְרָא לָ֔/הּ וַֽ/תַּעֲמֹ֖ד לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/012.yaml
  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ തന്റെ ശുശ്രൂഷകനായ ഗേഹസിയോടു പറഞ്ഞു: “ഈ ശൂനേമ്യസ്ത്രീയെ[a] വിളിക്കൂ.” ഗേഹസി അവളെ വിളിച്ചു; അവൾ അവന്റെ മുമ്പിൽ നിന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഈ ശൂനേമ്യയെ”; ഹീബ്രുവിൽ അവളെ അവളുടെ സ്വദേശമായ ശൂനേമിനെ അടിസ്ഥാനമാക്കി തിരിച്ചറിയിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവൻ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: גֵּחֲזִי
  choice: ഗേഹസി
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയനുസരിച്ച് നൽകി.
- source_word: נַעֲרוֹ
  choice: തന്റെ ശുശ്രൂഷകൻ
  rationale: נַעַר എന്നതിന് യുവാവ്, ദാസൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ എലീശയെ സേവിക്കുന്ന ഗേഹസിയുടെ ചുമതലയാണ് സന്ദർഭത്തിൽ പ്രധാനമായതിനാൽ ‘ശുശ്രൂഷകൻ’ എന്നു നൽകി.
- source_word: קְרָא
  choice: വിളിക്കൂ
  rationale: ഒരാളെ തന്റെ സന്നിധിയിലേക്കു വിളിക്കുക എന്ന സന്ദർഭാർഥം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  choice: ആ ശൂനേംകാരിയെ
  rationale: സ്ത്രീയെ ശൂനേം സ്വദേശിനിയായി തിരിച്ചറിയിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ നാമരൂപമായി സ്വാഭാവികമായി നൽകി; הַזֹּאת എന്ന സമീപസൂചന സംഭാഷണസന്ദർഭത്തിൽ മലയാളത്തിലെ ‘ആ’ കൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: וַיִּקְרָא לָהּ
  choice: അവൻ അവളെ വിളിച്ചു
  rationale: ആജ്ഞയിലെ קרא എന്ന ക്രിയയുടെ ആവർത്തനം നിലനിർത്തി; കർത്താവ് ഗേഹസിയാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: וַתַּעֲמֹד
  choice: വന്നു നിന്നു
  rationale: עמד അടിസ്ഥാനമായി ‘നിൽക്കുക’ എന്നാണ്; വിളിക്കപ്പെട്ട സ്ത്രീ സന്നിധിയിൽ നിലകൊള്ളുന്ന രംഗം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘വന്നു’ ചേർത്തു, എന്നാൽ അവൾ നിന്നു എന്ന മുഖ്യപ്രവൃത്തി നിലനിർത്തി.
- source_word: לְפָנָיו
  choice: അവന്റെ മുമ്പിൽ
  rationale: സ്ഥലപരമായോ സാന്നിധ്യപരമായോ ഉള്ള ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
