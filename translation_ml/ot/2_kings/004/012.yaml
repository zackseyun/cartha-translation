translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സംഭാഷണത്തിൽ സ്വാഭാവികമായ ‘വിളിക്കൂ’ ഉപയോഗിച്ചു; ആഖ്യാനശൈലി സംക്ഷിപ്തമായി നിലനിർത്തി.
