id: 2KI.4.9
reference: 2 Kings 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אִישָׁ֔/הּ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים קָד֣וֹשׁ ה֑וּא עֹבֵ֥ר עָלֵ֖י/נוּ תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
translation:
  language: ml
  text: 'അവൾ തന്റെ ഭർത്താവിനോടു പറഞ്ഞു: “ഇതാ, നമ്മുടെ അടുക്കൽക്കൂടി പതിവായി[a] കടന്നുപോകുന്ന ഇദ്ദേഹം വിശുദ്ധനായ ഒരു ദൈവപുരുഷനാണെന്ന് എനിക്കു മനസ്സിലായി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എപ്പോഴും.”
    reason: תָּמִיד എന്ന പദത്തിന് പതിവായ ആവർത്തനത്തെയും തുടർച്ചയെയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ പ്രസക്തമായ പരിഭാഷാവികൽപം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־אִישָׁהּ
  choice: അവൾ തന്റെ ഭർത്താവിനോടു പറഞ്ഞു
  rationale: വിവരണത്തിന്റെ തുടർച്ച നിലനിർത്തുകയും, ഈ ഗാർഹികസന്ദർഭത്തിൽ אִישָׁהּ എന്നത് സ്വാഭാവികമായി ‘അവളുടെ ഭർത്താവ്’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: הִנֵּה נָא
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗത്തിന്റെ ഭാവം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നുനൽകുന്നു; נָאയുടെ മൃദുവാക്കുന്ന സൂക്ഷ്മഭാവം സന്ദർഭത്തിലും വാക്യശൈലിയിലും നിലനിൽക്കുന്നു.
- source_word: יָדַעְתִּי
  choice: എനിക്കു മനസ്സിലായി
  rationale: ആവർത്തിച്ചുള്ള നിരീക്ഷണത്തിലൂടെ ലഭിച്ച ഉറച്ച തിരിച്ചറിവാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ ‘മനസ്സിലായി’ ഈ സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: אִישׁ אֱלֹהִים קָדוֹשׁ
  choice: വിശുദ്ധനായ ഒരു ദൈവപുരുഷൻ
  rationale: אִישׁ אֱלֹהִים എന്ന അംഗീകൃത പദവിയെ ‘ദൈവപുരുഷൻ’ എന്നു നിലനിർത്തുകയും קָדוֹשׁ എന്ന വിശേഷണം വ്യക്തമായി അതിനോടു ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: עֹבֵר עָלֵינוּ
  choice: നമ്മുടെ അടുക്കൽക്കൂടി കടന്നുപോകുന്ന
  rationale: യാത്രാസന്ദർഭത്തിൽ അവരുടെ താമസസ്ഥലത്തിനരികിലൂടെ കടന്നുപോകുന്നതാണ് അർഥം; ‘അടുക്കൽക്കൂടി’ ഈ സ്ഥലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תָּמִיד
  choice: പതിവായി
  rationale: തടസ്സമില്ലാത്ത നിരന്തരപ്രവൃത്തി എന്നതിലുപരി ആവർത്തിച്ചുള്ള പതിവിനെ സന്ദർഭം സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘പതിവായി’ കൃത്യവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: אִישׁ אֱלֹהִים എന്ന പദവിയുടെ പരിഭാഷ
  choice: ദൈവപുരുഷൻ
  alternative: ദൈവഭക്തനായ മനുഷ്യൻ
  rationale: ഈ പ്രയോഗം പ്രവാചകനെയോ ദൈവികമായി നിയോഗിക്കപ്പെട്ട വ്യക്തിയെയോ സൂചിപ്പിക്കുന്ന അംഗീകൃത പദവിയാണ്. ‘ദൈവപുരുഷൻ’ അതിന്റെ സാഹിത്യ-ദൈവശാസ്ത്രപരമായ ശക്തി നിലനിർത്തുന്നു; ‘ദൈവഭക്തനായ മനുഷ്യൻ’ എന്നത് പദവിയെ സ്വഭാവവിവരണമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘ദൈവപുരുഷൻ’ എന്ന ബൈബിൾപദവി നിലനിർത്തി; അപരിചിതമായ പദാനുപദക്രമം ഒഴിവാക്കി അർഥബന്ധങ്ങൾ വ്യക്തമായി ക്രമപ്പെടുത്തി.
