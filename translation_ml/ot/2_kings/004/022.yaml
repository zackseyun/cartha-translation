translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദൈവപുരുഷൻ’ എന്ന മൂലപദപ്രയോഗം നിലനിർത്തി; യാത്രാസന്ദർഭത്തിൽ അസ്വാഭാവികമാകാവുന്ന അക്ഷരാർഥമായ ‘ഓടുക’ മുഖ്യവാചകത്തിൽ ‘വേഗം പോകുക’ എന്നാക്കി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
