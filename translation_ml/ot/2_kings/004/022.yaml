  text: וַ/תִּקְרָא֮ אֶל אִישָׁ/הּ֒ וַ/תֹּ֗אמֶר שִׁלְחָ֨/ה נָ֥א לִ/י֙ אֶחָ֣ד מִן הַ/נְּעָרִ֔ים וְ/אַחַ֖ת הָ/אֲתֹנ֑וֹת וְ/אָר֛וּצָה עַד אִ֥ישׁ הָ/אֱלֹהִ֖ים וְ/אָשֽׁוּבָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/022.yaml
  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ ഭർത്താവിനെ വിളിച്ച് പറഞ്ഞു: “ദയവായി യുവാക്കളിൽ ഒരാളെയും പെൺകഴുതകളിൽ ഒന്നിനെയും എനിക്ക് അയച്ചുതരൂ. ഞാൻ ദൈവപുരുഷന്റെ അടുക്കലേക്ക് ഓടിച്ചെന്ന്[a] മടങ്ങിവരാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവപുരുഷന്റെ അടുക്കലേക്ക് വേഗം പോയി മടങ്ങിവരാം.” എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം “ഓടുക” എന്നാണ്; ഇവിടെ അത് അടിയന്തരത പ്രകടമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶל אִישָׁהּ
  choice: അപ്പോൾ അവൾ ഭർത്താവിനെ വിളിച്ച്
  rationale: വയ്യക്ഷോൽ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമാണ്; ഗൃഹസന്ദർഭത്തിൽ אִישָׁהּ എന്നത് ‘അവളുടെ ഭർത്താവ്’ എന്നാണ്.
- source_word: שִׁלְחָה נָא לִי
  choice: ദയവായി ... എനിക്ക് അയച്ചുതരൂ
  rationale: ആജ്ഞാരൂപത്തോടുകൂടിയ נָא വിനീതമായ അഭ്യർഥനയാണ്; മലയാളത്തിൽ ‘ദയവായി ... അയച്ചുതരൂ’ അതിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: אֶחָד מִן הַנְּעָרִים
  choice: വേലക്കാരിൽ ഒരാളെ
  rationale: נַעַר എന്നതിന് യുവാവ്, പരിചാരകൻ, വേലക്കാരൻ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. യാത്രയ്ക്കായി ആളെയും മൃഗത്തെയും അയയ്ക്കുന്ന ഈ ഗൃഹസന്ദർഭത്തിൽ ‘വേലക്കാരൻ’ സ്വാഭാവികമാണ്.
- source_word: וְאַחַת הָאֲתֹנוֹת
  choice: പെൺകഴുതകളിൽ ഒന്നിനെ
  rationale: אָתוֹן പെൺകഴുതയെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു; മൂലഭാഷയിലെ ലിംഗവ്യത്യാസം പരിഭാഷയിൽ നിലനിർത്തി.
- source_word: וְאָרוּצָה
  choice: ഞാൻ ... വേഗം പോയി
  rationale: רוּץ എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘ഓടുക’ എന്നാണെങ്കിലും മൃഗപ്പുറത്തുള്ള യാത്രയെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ അത് അടിയന്തരതയോടെ വേഗം പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വേഗം പോയി’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: עַד אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷന്റെ അടുക്കലേക്ക്
  rationale: ചലനസന്ദർഭത്തിലെ עַד ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; אִישׁ הָאֱלֹהִים എന്ന എബ്രായ സ്ഥാനപ്പേര് ‘ദൈവപുരുഷൻ’ എന്നു നേരിട്ട് നിലനിർത്തി.
- source_word: וְאָשׁוּבָה
  choice: മടങ്ങിവരാം
  rationale: ഒന്നാംപുരുഷ cohortative ഉദ്ദേശിച്ച തുടർപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘മടങ്ങിവരാം’ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ആ ഉദ്ദേശ്യം നൽകുന്നു.
