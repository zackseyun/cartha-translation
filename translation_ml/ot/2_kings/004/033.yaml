id: 2KI.4.33
reference: 2 Kings 4:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֕א וַ/יִּסְגֹּ֥ר הַ/דֶּ֖לֶת בְּעַ֣ד שְׁנֵי/הֶ֑ם וַ/יִּתְפַּלֵּ֖ל אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/033.yaml
  text: He went in and shut the door behind the two of them[a], and prayed to Yahweh.
translation:
  language: ml
  text: അവൻ അകത്തു കടന്ന് അവർ ഇരുവരുടെയും പിന്നിൽ വാതിൽ അടച്ചു[a]; പിന്നെ യഹ്‌വേയോടു പ്രാർഥിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവർ ഇരുവരെയും അകത്താക്കി വാതിൽ അടച്ചു”; അതായത്, മുറിയിൽ അവനും കുട്ടിയും മാത്രം ഉണ്ടായിരിക്കത്തക്കവിധം വാതിൽ അടച്ചു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അവൻ അകത്തു കടന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ അനുക്രമകഥനരൂപം മുറിയിലേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘അകത്തു കടന്ന്’ സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  choice: വാതിൽ അടച്ചു
  rationale: סגר എന്നതിന് ഇവിടെ ‘അടയ്ക്കുക’ എന്നാണ് അർഥം; നിർദിഷ്ടമായ דלת ‘വാതിൽ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: בְּעַד שְׁנֵיהֶם
  choice: അവർ ഇരുവരുടെയും പിന്നിൽ
  rationale: വാതിൽ അടയ്ക്കുന്ന സന്ദർഭത്തിൽ בְּעַד എന്നത് ‘പിന്നിൽ’ എന്നും, രണ്ടുപേരെയും അകത്താക്കി അടച്ചു എന്നും മനസ്സിലാക്കാം. മുഖ്യപാഠം എബ്രായപ്രയോഗത്തിന്റെ രൂപവും യഥാർഥമായ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; കൂടുതൽ വ്യക്തമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיִּתְפַּלֵּל
  choice: പിന്നെ ... പ്രാർഥിച്ചു
  rationale: פלל എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ഇവിടെ ‘പ്രാർഥിക്കുക’ എന്നാണ്. ‘പിന്നെ’ കഥയിലെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വേയോട്
  rationale: אֶל എന്നത് പ്രാർഥനയുടെ അഭിമുഖത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-യോട്’ എന്നു പരിഭാഷപ്പെടുത്തി. יהוה എന്ന ദൈവനാമം പദവിനാമമാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമമായ יהוה നേരിട്ട് വന്നിരിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിനാമംകൊണ്ട് പകരാതെ മലയാളത്തിൽ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: בְּעַד שְׁנֵיהֶם ആരെ സൂചിപ്പിക്കുന്നു എന്നത്
  choice: ‘അവർ ഇരുവരുടെയും പിന്നിൽ’ എന്ന രൂപത്തിൽ പാഠത്തിലെ സൂചന നിലനിർത്തി
  alternative: ‘താനും കുട്ടിയും മാത്രം അകത്തായിരിക്കത്തക്കവിധം’ എന്നു വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: സന്ദർഭത്തിൽ ഇരുവരും എലീശയും കുട്ടിയുമാണെങ്കിലും, പരിഭാഷയിൽ വിശദീകരണം ചേർത്ത് മൂലവാക്യത്തെക്കാൾ നിർണായകമാക്കാതെ, വിശദത അടിക്കുറിപ്പിലേക്കു മാറ്റി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ അനുക്രമപ്രവർത്തനങ്ങൾ വ്യക്തമായി നിലനിർത്തിയിട്ടുണ്ട്; അപൂർവമായ בְּעַד പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
