  yaml_path: translation/ot/2_kings/004/019.yaml
  text: And he said to his father[a], “My head, my head!” Then he said to the young man, “Carry him to his mother.”
translation:
  language: ml
  text: അവൻ തന്റെ അപ്പനോട്, “എന്റെ തല! എന്റെ തല!” എന്നു പറഞ്ഞു. അപ്പോൾ അപ്പൻ ആ യുവാവിനോട്[a], “അവനെ അവന്റെ അമ്മയുടെ അടുത്തേക്ക് എടുത്തുകൊണ്ടുപോകുക” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യുവാവിനോട്” എന്നതിന് “പരിചാരകനോട്” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ נַעַר എന്ന പദം സന്ദർഭമനുസരിച്ച് ബാലൻ, യുവാവ്, പരിചാരകൻ, സേവകൻ എന്നീ അർഥങ്ങളിൽ ഉപയോഗിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אָבִיו
  choice: അവൻ തന്റെ അപ്പനോട് ... എന്നു പറഞ്ഞു
  rationale: אָמַר എന്നത് സാധാരണയായി ‘പറയുക’ എന്നാണ്; സന്ദർഭത്തിലെ വേദന ആവർത്തിച്ചുള്ള നിലവിളിയിലൂടെ തന്നെ വ്യക്തമാകുന്നതിനാൽ ‘നിലവിളിച്ചു’ എന്ന ആശയം കൂട്ടിച്ചേർത്തില്ല. אָבִיו എന്ന ബന്ധപദത്തിന് സ്വാഭാവികമായ ‘തന്റെ അപ്പനോട്’ ഉപയോഗിച്ചു.
- source_word: רֹאשִׁי רֹאשִׁי
  choice: എന്റെ തല! എന്റെ തല!
  rationale: ഒന്നാംപുരുഷ പ്രത്യയമുള്ള ‘തല’ എന്ന പദത്തിന്റെ ആവർത്തനം അതേപടി നിലനിർത്തി; ‘തല വേദനിക്കുന്നു’ എന്ന വിശദീകരണം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തില്ല.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അപ്പൻ ... എന്നു പറഞ്ഞു
  rationale: രണ്ടാമത്തെ wayyiqtol കഥയുടെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അപ്പോൾ’ സ്വാഭാവികമായ ക്രമബന്ധം നൽകുന്നു. കർത്താവ് പിതാവാണെന്ന് സന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അപ്പൻ’ ആവർത്തിച്ചു.
- source_word: אֶל הַנַּעַר
  choice: ആ യുവാവിനോട്
  rationale: נַעַר എന്ന പദത്തിന് ബാലൻ, യുവാവ്, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. കുട്ടിയെ എടുത്തുകൊണ്ടുപോകാൻ കഴിയുന്ന കൂടെയുണ്ടായിരുന്ന പുരുഷനെ സൂചിപ്പിക്കുന്നതിനാൽ, സേവകസ്ഥാനം തീർച്ചപ്പെടുത്താതെ ‘യുവാവ്’ എന്നു നൽകി; മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: שָׂאֵהוּ
  choice: അവനെ ... എടുത്തുകൊണ്ടുപോകുക
  rationale: נשׂא എന്ന ക്രിയ ഇവിടെ കുട്ടിയെ ശാരീരികമായി എടുത്ത് കൊണ്ടുപോകാനുള്ള കല്പനയാണ്. മലയാളത്തിൽ ‘എടുത്തുകൊണ്ടുപോകുക’ ഈ പ്രവൃത്തിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶל אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ അടുക്കൽ
  rationale: ലളിതമായ ബന്ധപദം നേരിട്ട് പരിഭാഷപ്പെടുത്തി; ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന אֶל എന്നതിന് ‘അടുക്കൽ’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. കുട്ടിയുടെ വാക്കുകളിലെ അടിയന്തരത പദാവർത്തനവും ആശ്ചര്യചിഹ്നങ്ങളുംകൊണ്ട് നിലനിർത്തി. ‘അപ്പൻ’ എന്നത് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കഥനത്തിന് യോജിച്ചതുമാണ്.
