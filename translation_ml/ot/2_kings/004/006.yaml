id: 2KI.4.6
reference: 2 Kings 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/מְלֹ֣את הַ/כֵּלִ֗ים וַ/תֹּ֤אמֶר אֶל בְּנָ/הּ֙ הַגִּ֨ישָׁ/ה אֵלַ֥/י עוֹד֙ כֶּ֔לִי וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אֵ֥ין ע֖וֹד כֶּ֑לִי וַֽ/יַּעֲמֹ֖ד הַ/שָּֽׁמֶן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/006.yaml
  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
translation:
  language: ml
  text: പാത്രങ്ങൾ നിറഞ്ഞപ്പോൾ[a] അവൾ മകനോട്, “ഇനിയും ഒരു പാത്രം എന്റെ അടുത്തേക്കു കൊണ്ടുവരിക” എന്നു പറഞ്ഞു. അവൻ അവളോട്, “ഇനി ഒരു പാത്രവും ഇല്ല” എന്നു പറഞ്ഞു. അപ്പോൾ എണ്ണ ഒഴുകുന്നത് നിലച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാത്രങ്ങൾ നിറച്ചുതീർന്നപ്പോൾ.”
    reason: grammatical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “എണ്ണ നിന്നു.” ഇവിടെ എണ്ണയുടെ ഒഴുക്ക് നിലച്ചുവെന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְלֹאת
  choice: നിറഞ്ഞപ്പോൾ
  rationale: כְּ ചേർന്ന infinitive construct ഇവിടെ സമയസൂചക ഉപവാക്യം രൂപപ്പെടുത്തുന്നു. പാത്രങ്ങൾ നിറഞ്ഞ അവസ്ഥയിലെത്തിയ സമയം സ്വാഭാവികമായ മലയാളത്തിൽ ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: הַכֵּלִים / כֶּלִי
  choice: പാത്രങ്ങൾ / പാത്രം
  rationale: כְּלִי എന്നത് പലതരം ഉപകരണങ്ങളെയോ കൊള്ളിപ്പാത്രങ്ങളെയോ സൂചിപ്പിക്കാവുന്ന വിശാലപദമാണ്. എണ്ണ ശേഖരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘പാത്രം’ സ്വാഭാവികവും ആവശ്യത്തിന് വിശാലവുമാണ്; ‘ഭരണി’ ഒരു പ്രത്യേക രൂപം അനാവശ്യമായി നിർദേശിക്കും.
- source_word: הַגִּישָׁה אֵלַי
  choice: എന്റെ അടുത്തേക്കു കൊണ്ടുവരിക
  rationale: נגשׁ എന്ന ധാതുവിന്റെ ഹിഫീൽ ആജ്ഞാരൂപം അടുത്തേക്ക് കൊണ്ടുവരുക അല്ലെങ്കിൽ സമർപ്പിക്കുക എന്നർഥം നൽകുന്നു. മകൻ മറ്റൊരു പാത്രം കൈമാറുന്ന സന്ദർഭം ഈ വിവർത്തനം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: עוֹד כֶּלִי
  choice: ഇനിയും ഒരു പാത്രം
  rationale: ഏകവചനമായ כֶּלִיയോടുകൂടിയ עוֹד അതേ തരത്തിലുള്ള മറ്റൊന്ന് എന്ന ആശയം നൽകുന്നു. ‘ഇനിയും ഒരു പാത്രം’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אֵין עוֹד כֶּלִי
  choice: ഇനി ഒരു പാത്രവും ഇല്ല
  rationale: אֵין അസ്തിത്വമില്ലായ്മ സൂചിപ്പിക്കുന്നു. ലഭ്യമായ മറ്റൊരു പാത്രവും ശേഷിച്ചിട്ടില്ലെന്ന ആശയം മലയാളത്തിലെ നിഷേധരൂപം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  choice: എണ്ണ ഒഴുകുന്നത് നിലച്ചു
  rationale: עמד എന്നതിന്റെ അക്ഷരാർഥം ‘നിന്നു’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ എണ്ണയുടെ ഒഴുക്ക് അവസാനിച്ചതാണ് ഉദ്ദേശ്യം. അർഥം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘ഒഴുകുന്നത് നിലച്ചു’ എന്നു നൽകിയിരിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പാത്രം’ എന്ന സാധാരണപദം മൂലഭാഷയിലെ വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു; എണ്ണ ‘നിന്നു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കി, അതിന്റെ രൂപകം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
