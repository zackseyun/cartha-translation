  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
translation:
  language: ml
  text: പിന്നെ അവൻ കയറിച്ചെന്ന് ബാലന്റെമേൽ കിടന്നു; തന്റെ വായ് ബാലന്റെ വായിന്മേലും, തന്റെ കണ്ണുകൾ ബാലന്റെ കണ്ണുകളിന്മേലും, തന്റെ ഉള്ളംകൈകൾ ബാലന്റെ ഉള്ളംകൈകളിന്മേലും വെച്ചു. അവൻ ബാലന്റെമേൽ കുനിഞ്ഞു[a]; ബാലന്റെ ദേഹം ചൂടുപിടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെമേൽ ശരീരം നീട്ടിക്കിടന്നു.” എബ്രായക്രിയ അപൂർവമാണ്; ബാലന്റെമേൽ കുനിയുന്നതോ ശരീരം നീട്ടിക്കിടക്കുന്നതോ ആയ ഭാവം ഇതു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: പിന്നെ അവൻ കയറിച്ചെന്ന്
  rationale: עלה എന്നത് അടിസ്ഥാനമായി ‘കയറുക’ എന്നാണ്. മുകളിലെ മുറിയിലേക്കാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണെങ്കിലും വാക്യത്തിൽ ആ സ്ഥലം വീണ്ടും പറയാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  choice: ബാലന്റെമേൽ കിടന്നു
  rationale: ശരീരസമ്പർക്കമുള്ള പ്രവൃത്തി വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: וַיָּשֶׂם פִּיו עַל פִּיו
  choice: തന്റെ വായ് അവന്റെ വായിന്മേൽ വെച്ചു
  rationale: שׂים എന്ന സാധാരണ ക്രിയയുടെ ‘വെക്കുക’ എന്ന നേരിട്ടുള്ള അർഥവും ശരീരഭാഗങ്ങളുടെ കൃത്യമായ പൊരുത്തവും സൂക്ഷിക്കുന്നു.
- source_word: וְעֵינָיו עַל עֵינָיו
  choice: തന്റെ കണ്ണുകൾ അവന്റെ കണ്ണുകളിന്മേൽ
  rationale: മുൻപത്തെ ‘വെച്ചു’ എന്ന ക്രിയയോടു ചേർന്ന ക്രിയാരഹിത തുടർച്ചയായി വിവർത്തനം ചെയ്ത് എബ്രായ സമാന്തരഘടന നിലനിർത്തുന്നു.
- source_word: וְכַפָּיו עַל כַּפָּיו
  choice: തന്റെ ഉള്ളംകൈകൾ അവന്റെ ഉള്ളംകൈകളിന്മേൽ
  rationale: כַּף എന്നത് പൊതുവായ ‘കൈ’ എന്നതിനെക്കാൾ പ്രത്യേകമായി കൈയുടെ ഉള്ളം സൂചിപ്പിക്കുന്നു; ‘ഉള്ളംകൈ’ ആ ശരീരപരമായ കൃത്യത നിലനിർത്തുന്നു.
- source_word: וַיִּגְהַר עָלָיו
  choice: അവന്റെമേൽ കുനിഞ്ഞുകിടന്നു
  rationale: അപൂർവമായ גהר ഇവിടെ കുട്ടിയുടെമേൽ കുനിയുകയോ ശരീരം നീട്ടിക്കിടക്കുകയോ ചെയ്യുന്ന ഭാവം സൂചിപ്പിക്കുന്നു. മുൻപുള്ള ‘കിടന്നു’ എന്ന പ്രവൃത്തിയുമായി ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  choice: ബാലന്റെ ശരീരം ചൂടുപിടിച്ചു
  rationale: חם എന്നത് ചൂടാകുന്നതെയും בשר ഇവിടെ ബാലന്റെ ദേഹത്തെയും സൂചിപ്പിക്കുന്നു. ‘ശരീരം ചൂടുപിടിച്ചു’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ദൃശ്യവുമായ പ്രയോഗമാണ്.
- source_word: הַיֶּלֶד / הַיָּלֶד
  choice: ബാലൻ
  rationale: സന്ദർഭത്തിലെ മകനെ സൂചിപ്പിക്കുന്നതിനാൽ יֶלֶד എന്നതിന് ‘ബാലൻ’ കൃത്യവും മാന്യവുമായ ആധുനിക മലയാളപദമാണ്.
theological_decisions:
- issue: മരിച്ച ബാലനോടുള്ള എലീശയുടെ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: ശരീരപരമായ പ്രവൃത്തികൾ വ്യക്തമായി വിവരിക്കുക; അവയുടെ പ്രവർത്തനരീതി വ്യാഖ്യാനിക്കാതിരിക്കുക.
  alternative: ഇത് കൃത്രിമശ്വാസം നൽകലാണെന്നോ പ്രത്യേക കൂദാശാപരമായ പ്രവൃത്തിയാണെന്നോ അവതരിപ്പിക്കുക.
  rationale: എബ്രായ പാഠം പ്രവൃത്തികളുടെ ക്രമം വിവരിക്കുന്നുവെങ്കിലും അവയുടെ രീതി അല്ലെങ്കിൽ ദൈവശാസ്ത്രപരമായ യന്ത്രണം വിശദീകരിക്കുന്നില്ല. അതിനാൽ കാലാനന്തര വൈദ്യശാസ്ത്രപരമോ സഭാപാരമ്പര്യപരമോ ആയ ആശയങ്ങൾ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ശരീരഭാഗങ്ങളുടെ ആവർത്തനവും എബ്രായത്തിലെ സമാന്തരഘടനയും കഴിയുന്നത്ര നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി.
