source:
  edition: WLC
  text: וַ/יִּֽצְק֥וּ לַ/אֲנָשִׁ֖ים לֶ/אֱכ֑וֹל וַ֠/יְהִי כְּ/אָכְלָ֨/ם מֵ/הַ/נָּזִ֜יד וְ/הֵ֣מָּה צָעָ֗קוּ וַ/יֹּֽאמְרוּ֙ מָ֤וֶת בַּ/סִּיר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים וְ/לֹ֥א יָכְל֖וּ לֶ/אֱכֹֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
translation:
  language: ml
  text: 'അങ്ങനെ അവർ ആ പുരുഷന്മാർക്കു ഭക്ഷിക്കാനായി അതു കോരിയൊഴിച്ചു. എന്നാൽ അവർ ആ കൂട്ട് കഴിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അവർ നിലവിളിച്ചുപറഞ്ഞു: “ദൈവപുരുഷാ, കലത്തിൽ മരണം!” അവർക്കു കഴിക്കാൻ കഴിഞ്ഞില്ല.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְקוּ
  choice: കോരിയൊഴിച്ചു
  rationale: יצק എന്ന ക്രിയയുടെ ‘ഒഴിക്കുക’ എന്ന മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; പാകംചെയ്ത ദ്രവസ്വഭാവമുള്ള ഭക്ഷണം പാത്രങ്ങളിൽ പകർന്നുകൊടുക്കുന്ന സന്ദർഭത്തിൽ ‘കോരിയൊഴിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: לַאֲנָשִׁים
  choice: ആ പുരുഷന്മാർക്കു
  rationale: אֲנָשִׁים ഇവിടെ കൂടിയിരുന്ന പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ലിംഗസൂചന ഒഴിവാക്കാതെ വിവർത്തനം ചെയ്തു.
- source_word: מֵהַנָּזִיד
  choice: ആ കൂട്ട്
  rationale: נָזִיד വേവിച്ചുണ്ടാക്കുന്ന കട്ടിയുള്ള വിഭവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ എളുപ്പം മനസ്സിലാകുകയും സന്ദർഭത്തിന് ചേരുകയും ചെയ്യുന്ന പൊതുപദമാണ് ‘കൂട്ട്’.
- source_word: צָעָקוּ
  choice: നിലവിളിച്ചുകൊണ്ട്
  rationale: ഭയവും അടിയന്തരതയും നിറഞ്ഞ ഉച്ചത്തിലുള്ള പ്രതികരണമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: מָוֶת בַּסִּיר
  choice: കലത്തിൽ മരണം
  rationale: എബ്രായത്തിലെ ശക്തമായ ദൃശ്യപ്രയോഗം വ്യാഖ്യാനിച്ച് ‘വിഷം’ എന്നു മാറ്റാതെ അക്ഷരാർഥത്തിൽ നിലനിർത്തി.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷാ
  rationale: എലീശയ്ക്കുള്ള പതിവായ സ്ഥാനപ്പേര് നേരിട്ടുള്ള സംബോധനരൂപത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: וְלֹא יָכְלוּ לֶאֱכֹל
  choice: അവർക്കു കഴിക്കാൻ കഴിഞ്ഞില്ല
  rationale: മൂലപാഠത്തിൽ കർമം ആവർത്തിക്കുന്നില്ല; മലയാളത്തിലും അത് ചേർക്കാതെ ആശയം വ്യക്തമായി നിലനിർത്തി.
