translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ഭാഷ ഉപയോഗിച്ചു. ‘കലത്തിൽ മരണം’ എന്ന മൂലപാഠത്തിലെ ദൃശ്യപ്രയോഗവും അതിലെ വ്യാഖ്യാനസാധ്യതയും അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
