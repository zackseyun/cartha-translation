  text: וְ/אִ֨ישׁ בָּ֜א מִ/בַּ֣עַל שָׁלִ֗שָׁה וַ/יָּבֵא֩ לְ/אִ֨ישׁ הָ/אֱלֹהִ֜ים לֶ֤חֶם בִּכּוּרִים֙ עֶשְׂרִֽים לֶ֣חֶם שְׂעֹרִ֔ים וְ/כַרְמֶ֖ל בְּ/צִקְלֹנ֑/וֹ וַ/יֹּ֕אמֶר תֵּ֥ן לָ/עָ֖ם וְ/יֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
translation:
  language: ml
  text: 'ബാൽ-ശാലീശയിൽനിന്ന് ഒരാൾ വന്ന് ദൈവപുരുഷന് ആദ്യഫലങ്ങളിൽനിന്നുള്ള അപ്പവും യവംകൊണ്ടുള്ള ഇരുപത് അപ്പങ്ങളും പുത്തൻ ധാന്യവും[a] തന്റെ സഞ്ചിയിൽ[b] കൊണ്ടുവന്നു. അവൻ പറഞ്ഞു: “ജനത്തിന് കൊടുക്കുക; അവർ ഭക്ഷിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വറുത്ത ധാന്യം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം വെറും പുത്തൻ ധാന്യത്തെയല്ല, ഭക്ഷിക്കാനായി തയ്യാറാക്കിയ ധാന്യത്തെയും സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സഞ്ചി’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം അപൂർവവും അർഥം അനിശ്ചിതവുമാണ്; അത് ഒരു സഞ്ചിയെയോ പൊതിയെയോ, ഒരുപക്ഷേ ധാന്യത്തിന്റെ തൊലിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: സന്ദർഭത്തിൽ ഒരു പുരുഷനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ആധുനിക മലയാളത്തിൽ വ്യക്തിയെ സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്ന രൂപമാണ് ‘ഒരാൾ’; പുരുഷലിംഗം തുടർന്നുള്ള ‘അവൻ’ വ്യക്തമാക്കുന്നു.
- source_word: מִבַּעַל שָׁלִשָׁה
  choice: ബാൽ-ശാലീശയിൽനിന്ന്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; വിഭക്തി ചേർത്ത് സ്വാഭാവിക മലയാളവാക്യമാക്കി.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷന്
  rationale: ‘പ്രവാചകൻ’ എന്നു വ്യാഖ്യാനിക്കാതെ എബ്രായത്തിലെ സ്ഥിരമായ വിശേഷണം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לֶחֶם בִּכּוּרִים
  choice: ആദ്യഫലങ്ങളിൽനിന്നുള്ള അപ്പം
  rationale: ആദ്യഫലവുമായി അപ്പത്തിനുള്ള ബന്ധം വ്യക്തമാക്കുന്നു; എന്നാൽ അതിന്റെ ആരാധനാക്രമപരമായ സൂക്ഷ്മത അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: עֶשְׂרִים לֶחֶם שְׂעֹרִים
  choice: യവംകൊണ്ടുള്ള ഇരുപത് അപ്പങ്ങൾ
  rationale: എണ്ണപ്പെടുന്ന לֶחֶם ഇവിടെ അപ്പങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു.
- source_word: כַרְמֶל
  choice: പുത്തൻ ധാന്യം
  rationale: ഇവിടെ കർമ്മേൽ പർവതമല്ല, പുതുതായോ ഭക്ഷണത്തിനായി തയ്യാറാക്കിയ നിലയിലോ ഉള്ള ധാന്യമാണ്. തയ്യാറാക്കൽരീതി ഉറപ്പില്ലാത്തതിനാൽ വിശാലമായ പദം മുഖ്യപാഠത്തിൽ നൽകി.
- source_word: בְּצִקְלֹנוֹ
  choice: തന്റെ സഞ്ചിയിൽ
  rationale: അപൂർവവും അർഥം അനിശ്ചിതവുമായ നാമം ധാന്യം കൊണ്ടുവന്ന ഒരു പാത്രമോ പൊതിയോ എന്ന സാദ്ധ്യതയിൽ ‘സഞ്ചി’യായി നൽകി; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: ജനത്തിന് കൊടുക്കുക; അവർ ഭക്ഷിക്കട്ടെ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ക്രിയ ഉദ്ദേശ്യമോ ഉദ്ദേശിച്ച ഫലമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ അനുമതിയോടുകൂടിയ ആജ്ഞാരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: וַיֹּאמֶר എന്ന ക്രിയയുടെ അപ്രകടമായ കർത്താവ്
  choice: അവൻ പറഞ്ഞു
  alternative: ദൈവപുരുഷൻ പറഞ്ഞു
  rationale: എബ്രായപാഠം കർത്താവിന്റെ പേര് ആവർത്തിക്കുന്നില്ല. സന്ദർഭം ദൈവപുരുഷനെ ഉദ്ദേശിക്കുന്നതായി മനസ്സിലാക്കാമെങ്കിലും, മുഖ്യപാഠത്തിൽ പേര് ചേർത്ത് ആ സൂചന നിർബന്ധിതമാക്കാതെ സർവനാമം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ഉറവിടത്തിലെ പട്ടികാസ്വഭാവം നിലനിർത്തി; അപൂർവപദങ്ങളുടെ അനിശ്ചിതത്വം മുഖ്യപാഠം ഭാരപ്പെടുത്താതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ സൂചിപ്പിച്ച പദങ്ങളിൽനിന്ന് മാറിപ്പോയിരുന്നതിനാൽ, [a] ‘പുത്തൻ ധാന്യം’ എന്നതിനും [b] ‘സഞ്ചി’ എന്നതിനും പിന്നാലെ ഉറവിടസാക്ഷ്യത്തിന് യോജിച്ചവിധം സ്ഥാപിച്ചു.
