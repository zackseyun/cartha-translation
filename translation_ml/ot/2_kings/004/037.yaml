  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
translation:
  language: ml
  text: അപ്പോൾ അവൾ വന്ന് അവന്റെ കാൽക്കൽ വീണു നിലത്തു സാഷ്ടാംഗം വീണു.[a] പിന്നെ അവൾ തന്റെ മകനെ എടുത്ത് പുറത്തേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിലംവരെ കുനിഞ്ഞു നമസ്കരിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ ചില സന്ദർഭങ്ങളിൽ ‘ആരാധിച്ചു’ എന്നും അർഥമാക്കാം; ഇവിടെ എലീശായോടുള്ള ആഴമായ ആദരത്തിന്റെ പ്രവൃത്തിയെയാണ് മിക്കവാറും സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: അപ്പോൾ അവൾ അകത്തുവന്ന്
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ മുറിയിലേക്കുള്ള പ്രവേശനമായതിനാൽ ‘അകത്തുവന്ന്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: അവന്റെ കാൽക്കൽ വീണു
  rationale: എലീശായുടെ മുമ്പിലുള്ള വിനയവും ആഴമായ ആദരവും പ്രകടിപ്പിക്കുന്ന പ്രയോഗമാണിത്; അക്ഷരാർഥത്തിലുള്ള ‘കാലുകളുടെമേൽ’ എന്നതിനെക്കാൾ ‘കാൽക്കൽ’ സ്വാഭാവിക മലയാളമാണ്.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: നിലംവരെ കുനിഞ്ഞു നമസ്കരിച്ചു
  rationale: שׁחה ശരീരം കുനിച്ച് സാഷ്ടാംഗം ചെയ്യുന്നതിനെയോ നമസ്കരിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ ദൈവാരാധനയെന്ന് നിർണയിക്കാതെ ശാരീരിക ഭാവവും ആഴമായ ആദരവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַתִּשָּׂא אֶת בְּנָהּ
  choice: തന്റെ മകനെ എടുത്തുകൊണ്ട്
  rationale: נשא എന്നതിന് ഉയർത്തുക, എടുക്കുക, വഹിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. പുനർജീവിച്ച മകനെ എടുത്ത് കൊണ്ടുപോകുന്ന ദൃശ്യത്തിൽ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: וַתֵּצֵא
  choice: പുറത്തേക്കു പോയി
  rationale: יצא എന്ന ലളിതമായ പുറപ്പെടൽചലനം നേരിട്ട് പകർത്തുന്നു.
theological_decisions:
- issue: എലീശായോടുള്ള וַתִּשְׁתַּחוּ എന്ന പ്രവൃത്തിയുടെ അർഥം
  choice: ആഴമായ ആദരത്തോടെ നിലംവരെ കുനിഞ്ഞു നമസ്കരിച്ച പ്രവൃത്തിയായി വിവർത്തനം ചെയ്തു.
  alternative: ‘ആരാധിച്ചു’ എന്നായി വിവർത്തനം ചെയ്യുക; അല്ലെങ്കിൽ ‘നിലത്ത് സാഷ്ടാംഗം വീണു’ എന്ന് കൂടുതൽ ശാരീരികമായി പറയുക.
  rationale: ഹീബ്രു ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ആരാധനയെയോ മനുഷ്യനോടുള്ള ആദരപൂർവമായ സാഷ്ടാംഗത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ എലീശായാണ് മുമ്പിലുള്ളത്; അതിനാൽ ‘ആരാധിച്ചു’ എന്ന ദൈവാരാധനാസൂചന നിർബന്ധിക്കാതെ, പദത്തിന്റെ ആദരവും ശാരീരിക ഭാവവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നമസ്കരിച്ചു’ എന്നത് ഇവിടെ ആദരപൂർവം കുനിയുന്നതിനെ സൂചിപ്പിക്കുന്നു; ദൈവാരാധനയെന്ന് പ്രത്യേകം നിർണയിക്കുന്നില്ല.
