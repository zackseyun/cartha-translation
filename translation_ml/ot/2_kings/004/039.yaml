source:
  edition: WLC
  text: וַ/יֵּצֵ֨א אֶחָ֣ד אֶל הַ/שָּׂדֶה֮ לְ/לַקֵּ֣ט אֹרֹת֒ וַ/יִּמְצָא֙ גֶּ֣פֶן שָׂדֶ֔ה וַ/יְלַקֵּ֥ט מִמֶּ֛/נּוּ פַּקֻּעֹ֥ת שָׂדֶ֖ה מְלֹ֣א בִגְד֑/וֹ וַ/יָּבֹ֗א וַ/יְפַלַּ֛ח אֶל סִ֥יר הַ/נָּזִ֖יד כִּֽי לֹ֥א יָדָֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
translation:
  language: ml
  text: പിന്നെ ഒരാൾ ഇലക്കറികൾ[a] ശേഖരിക്കാൻ വയലിലേക്കു പോയി. അവൻ ഒരു കാട്ടുവള്ളി കണ്ടെത്തി, അതിൽനിന്ന് തന്റെ വസ്ത്രം നിറയെ കാട്ടുകായകൾ[b] പറിച്ചെടുത്തു. അവൻ മടങ്ങിവന്ന് അവ അരിഞ്ഞ് കൂട്ടുകറിയുടെ കലത്തിൽ ഇട്ടു; കാരണം അവ എന്താണെന്ന് അവർക്ക് അറിയില്ലായിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പച്ചിലകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. വയലിൽനിന്ന് ഭക്ഷണത്തിനായി ശേഖരിച്ച സസ്യങ്ങളെയാണ് എബ്രായപദം പൊതുവായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വയലിലെ ഒരു വള്ളി’ എന്നും ‘വയലിലെ കായകൾ’ എന്നും; അതായത്, കൃഷിചെയ്യാത്ത തുറസ്സായ സ്ഥലത്ത് വളർന്ന വള്ളിയും അതിലെ കായകളും. ഇവ കൊളോസിന്ത് പോലുള്ള കാട്ടുകായകളായിരിക്കാം, എന്നാൽ കൃത്യമായ തിരിച്ചറിയൽ ഉറപ്പില്ല.
    reason: lexical_alternative
  - marker: c
    text: ‘അവ എന്താണെന്ന് അവർക്ക് അറിയാതിരുന്നതിനാൽ’ അല്ലെങ്കിൽ ‘അവർക്ക് അറിയില്ലായിരുന്നതിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ ബന്ധകപദം വിശദീകരണാത്മകമായോ കാരണാത്മകമായോ വായിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד
  choice: ഒരാൾ
  rationale: കൂട്ടത്തിലെ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പദം; മലയാളത്തിൽ സ്വാഭാവികവും പുരുഷനെ പ്രത്യേകം അനാവശ്യമായി ഊന്നാത്തതുമാണ്.
- source_word: לְלַקֵּט אֹרֹת
  choice: ഇലക്കറികൾ ശേഖരിക്കാൻ
  rationale: אֹרֹת വയലിൽനിന്ന് ഭക്ഷണത്തിനായി ശേഖരിക്കുന്ന സസ്യങ്ങളെയോ പച്ചിലകളെയോ വിശാലമായി സൂചിപ്പിക്കുന്നു; ‘ഇലക്കറികൾ’ ഈ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: גֶּפֶן שָׂדֶה
  choice: ഒരു കാട്ടുവള്ളി
  rationale: അക്ഷരാർഥമായ ‘വയലിലെ വള്ളി’ എന്നതിനെക്കാൾ കൃഷിചെയ്യാതെ വളരുന്ന വള്ളി എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: פַּקֻּעֹת שָׂדֶה
  choice: കാട്ടുകായകൾ
  rationale: കൃത്യമായ സസ്യവർഗം ഉറപ്പില്ലാത്തതിനാൽ ‘കൊളോസിന്ത്’ പോലുള്ള അതിവിശദമായ തിരിച്ചറിയൽ ഒഴിവാക്കി, വള്ളിയിൽ വളർന്ന കാട്ടുകായകൾ എന്ന പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: מְלֹא בִגְדוֹ
  choice: തന്റെ വസ്ത്രം നിറയെ
  rationale: പുറങ്കുപ്പായം ഒരു ശേഖരണപ്പാത്രമായി ഉപയോഗിച്ച് നിറച്ചെന്ന എബ്രായ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
- source_word: וַיְפַלַּח
  choice: അവ അരിഞ്ഞ്
  rationale: ക്രിയയുടെ പിളർക്കുക/അരിയുക എന്ന അർഥം ഭക്ഷണം പാകം ചെയ്യുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കർമം മുൻവാക്യത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: סִיר הַנָּזִיד
  choice: പായസക്കലം
  rationale: നന്നായി വേവിച്ച കട്ടിയുള്ള ഭക്ഷണമുള്ള കലം എന്ന പരമ്പരാഗതവും വായനാസൗകര്യമുള്ളതുമായ മലയാളപ്രയോഗം; ഇവിടെ ‘പായസം’ മധുരപലഹാരം എന്ന ആധുനിക പരിമിതാർഥത്തിൽ അല്ല.
- source_word: כִּי לֹא יָדָעוּ
  choice: എന്നാൽ അവ എന്താണെന്ന് അവർക്ക് അറിയില്ലായിരുന്നു
  rationale: അറിവില്ലായ്മയും പ്രവർത്തിയും തമ്മിലുള്ള വിരോധഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; כִּי എന്നതിന്റെ വിശദീകരണാത്മക വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
