translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘കാട്ടുകായകൾ’ എന്ന പൊതുപദം സസ്യത്തിന്റെ അനിശ്ചിത തിരിച്ചറിയൽ സംരക്ഷിക്കുന്നു. മുഖ്യപാഠത്തിലെ ‘എന്നാൽ’ കഥനത്തിലെ വിരോധഭാവം പ്രകടിപ്പിക്കുമ്പോൾ, എബ്രായ כִּי-യുടെ കാരണാത്മക/വിശദീകരണാത്മക സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
