translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. എബ്രായത്തിലെ പരോക്ഷസംഭാഷണക്രമവും മറുപടിയുടെ സംക്ഷിപ്തതയും നിലനിർത്തിയിരിക്കുന്നു; സൂചനാപരമായ അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിതമായി ചേർക്കാതെ കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
