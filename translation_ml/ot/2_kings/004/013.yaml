source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ אֱמָר נָ֣א אֵלֶי/הָ֮ הִנֵּ֣ה חָרַ֣דְתְּ אֵלֵי/נוּ֮ אֶת כָּל הַ/חֲרָדָ֣ה הַ/זֹּאת֒ מֶ֚ה לַ/עֲשׂ֣וֹת לָ֔/ךְ הֲ/יֵ֤שׁ לְ/דַבֶּר לָ/ךְ֙ אֶל הַ/מֶּ֔לֶךְ א֖וֹ אֶל שַׂ֣ר הַ/צָּבָ֑א וַ/תֹּ֕אמֶר בְּ/ת֥וֹךְ עַמִּ֖/י אָנֹכִ֥י יֹשָֽׁבֶת־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “ദയവായി അവളോടു പറയുക: ‘നോക്കൂ, ഞങ്ങൾക്കുവേണ്ടി നീ ഇത്രയധികം ശ്രദ്ധയും കരുതലും കാണിച്ചിരിക്കുന്നു.[a] നിനക്കുവേണ്ടി എന്താണ് ചെയ്യേണ്ടത്? രാജാവിനോടോ സൈന്യാധിപനോടോ നിനക്കുവേണ്ടി എന്തെങ്കിലും സംസാരിക്കേണ്ടതുണ്ടോ?’” അവൾ പറഞ്ഞു: “ഞാൻ എന്റെ ജനത്തിന്റെ ഇടയിൽ താമസിക്കുന്നു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഈ സകല ഉത്കണ്ഠയും നീ ഞങ്ങൾക്കുവേണ്ടി കാണിച്ചിരിക്കുന്നു.” എബ്രായത്തിലെ ആവർത്തനപ്രയോഗം അവൾ അവർക്കുവേണ്ടി വളരെയധികം കരുതലും പ്രയത്നവും കാണിച്ചു എന്ന ആശയമാണ് നൽകുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: “ഞാൻ എന്റെ ജനത്തിന്റെ ഇടയിൽ താമസിക്കുന്നു” എന്ന മറുപടി, അവൾ തന്റെ സമൂഹത്തിൽ സുരക്ഷിതമായി കഴിയുന്നതിനാൽ രാജാവിന്റെയോ സൈന്യാധിപന്റെയോ പ്രത്യേക സഹായം തേടുന്നില്ല എന്നു സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: חָרַדְתְּ / חֲרָדָה
  choice: ഞങ്ങൾക്കുവേണ്ടി നീ ഇത്രയധികം ബുദ്ധിമുട്ടിയിരിക്കുന്നു
  rationale: പദങ്ങൾക്ക് അക്ഷരാർഥത്തിൽ വിറയൽ, ഉത്കണ്ഠ, ശ്രദ്ധാപൂർവമായ പരിചരണം എന്നീ ആശയങ്ങളുണ്ട്. ഇവിടെ ആതിഥ്യമര്യാദയ്ക്കായി അവൾ എടുത്ത വലിയ പ്രയത്നത്തെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: തുടർന്ന് പറയുന്നതിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: מֶה לַעֲשׂוֹת לָךְ
  choice: നിനക്കുവേണ്ടി എന്താണ് ചെയ്യേണ്ടത്?
  rationale: എബ്രായത്തിലെ കർത്താവിനെ വ്യക്തമാക്കാത്ത infinitive ഘടനയും ആദരപൂർവമായ ചോദ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: הֲיֵשׁ לְדַבֶּר לָךְ
  choice: നിനക്കുവേണ്ടി എന്തെങ്കിലും സംസാരിക്കേണ്ടതുണ്ടോ?
  rationale: അവൾക്കുവേണ്ടി അധികാരികളോടു സംസാരിക്കുകയോ അപേക്ഷിക്കുകയോ ചെയ്യുക എന്ന ആശയം അടുത്ത വാക്യഭാഗത്തിന്റെ വെളിച്ചത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שַׂר הַצָּבָא
  choice: സൈന്യാധിപൻ
  rationale: സൈന്യത്തിന്റെ മുഖ്യ അധികാരിയെ സൂചിപ്പിക്കുന്ന വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളപദം.
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  choice: ഞാൻ എന്റെ സ്വന്തം ജനത്തിന്റെ ഇടയിൽ താമസിക്കുന്നു
  rationale: അവൾ സ്വന്തം സമൂഹത്തിനുള്ളിൽ പാർക്കുന്നു എന്ന നേർവാചകാർഥം നിലനിർത്തുന്നു; സുരക്ഷയും സംതൃപ്തിയും പ്രത്യേക സഹായം ആവശ്യമില്ലെന്ന സൂചനയും വ്യാഖ്യാനക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: נָא
  choice: ദയവായി
  rationale: കല്പനയെ മൃദുവാക്കുന്ന വിനയസൂചക കണത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
