translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മക്കൾ’ എന്നതിനെക്കാൾ ലിംഗസൂചനയുള്ള בָּנִים കൃത്യമായി പ്രതിഫലിപ്പിക്കാൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു. തുടർച്ചയായ രണ്ട് പങ്കാളിക്രിയകളുടെ സമകാലികവും ആവർത്തിതവുമായ സ്വഭാവം ‘കൊണ്ടുവന്നുകൊണ്ടിരുന്നു’, ‘ഒഴിച്ചുകൊണ്ടിരുന്നു’ എന്നിവകൊണ്ട് നിലനിർത്തി.
