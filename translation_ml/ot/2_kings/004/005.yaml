    rationale: וְהִיא מֹצֶקֶת says simply ‘and she was pouring’; its object is implicit. Context supports oil, but the translation’s established practice marks contextual object-supplies, as it does for ‘പാത്രങ്ങൾ.’ Omitting the addition preserves the source’s ellipsis without reducing intelligibility.
  - severity: low
    issue: The phrase for shutting the door behind herself and her sons is not idiomatic Malayalam.
    rationale: ‘തന്റെയും തന്റെ പുത്രന്മാരുടെയും പിന്നിൽ’ uses a genitive coordination where Malayalam naturally uses dative persons with ‘പിന്നിൽ’ in this construction. ‘തനിക്കും തന്റെ പുത്രന്മാർക്കും പിന്നിൽ’ conveys the intended enclosure naturally.
