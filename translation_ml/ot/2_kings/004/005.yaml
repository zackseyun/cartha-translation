  yaml_path: translation/ot/2_kings/004/005.yaml
  text: So she went from him and shut the door behind herself and behind her sons; they were bringing the vessels to her[a], and she was pouring.
translation:
  language: ml
  text: അങ്ങനെ അവൾ അവന്റെ അടുക്കൽനിന്ന് പോയി, തനിക്കും തന്റെ പുത്രന്മാർക്കും പിന്നിൽ വാതിൽ അടച്ചു. അവർ അവളുടെ അടുക്കൽ പാത്രങ്ങൾ കൊണ്ടുവന്നുകൊണ്ടിരുന്നു[a]; അവൾ ഒഴിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായമൂലത്തിൽ ‘അവർ അവളുടെ അടുക്കൽ കൊണ്ടുവന്നുകൊണ്ടിരുന്നു’ എന്നു മാത്രമേയുള്ളൂ; മുൻവാക്യങ്ങളിൽ പറഞ്ഞ ഒഴിഞ്ഞ പാത്രങ്ങളെ ഉദ്ദേശിക്കുന്നതിനാൽ ‘പാത്രങ്ങൾ’ എന്നു സന്ദർഭത്തിൽനിന്ന് ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: അങ്ങനെ അവൾ അവന്റെ അടുക്കൽനിന്ന് പോയി
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; מֵאִתּוֹ എന്നത് അവൾ എലീശായുടെ സന്നിധിയിൽനിന്ന് പിരിഞ്ഞുപോയതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַתִּסְגֹּר הַדֶּלֶת
  choice: വാതിൽ അടച്ചു
  rationale: סגר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  choice: തന്റെയും തന്റെ പുത്രന്മാരുടെയും പിന്നിൽ
  rationale: വാതിൽ അടയ്ക്കുന്നതിനോടൊപ്പം בְּעַד എന്ന പദം അകത്തുള്ളവരുടെ പിന്നിൽ വാതിൽ അടയ്ക്കുക എന്ന ആശയം നൽകുന്നു; ആവർത്തിത ഹീബ്രു ഘടനയും നിലനിർത്തുന്നു.
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  choice: അവർ അവളുടെ അടുക്കൽ പാത്രങ്ങൾ കൊണ്ടുവന്നുകൊണ്ടിരുന്നു
  rationale: പങ്കാളിക്രിയ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കർമം ഹീബ്രുവിൽ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻവാക്യങ്ങളിലെ ഒഴിഞ്ഞ പാത്രങ്ങൾ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ വായനാസൗകര്യത്തിനായി ‘പാത്രങ്ങൾ’ ചേർത്തിരിക്കുന്നു; ഇത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהִיא מיצקת
  choice: അവൾ എണ്ണ ഒഴിച്ചുകൊണ്ടിരുന്നു
  rationale: പങ്കാളിക്രിയ പുത്രന്മാരുടെ പ്രവൃത്തിയോടൊപ്പം തുടരുന്ന പ്രക്രിയയെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിൽ കർമം പറഞ്ഞിട്ടില്ലെങ്കിലും ഉടൻമുമ്പുള്ള നിർദേശത്തിലെ എണ്ണയാണ് ഒഴിക്കുന്നത് എന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിനായി ‘എണ്ണ’ ചേർത്തിരിക്കുന്നു.
