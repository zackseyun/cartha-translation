  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גֵחֲזִ֞י עָבַ֣ר לִ/פְנֵי/הֶ֗ם וַ/יָּ֤שֶׂם אֶת הַ/מִּשְׁעֶ֨נֶת֙ עַל פְּנֵ֣י הַ/נַּ֔עַר וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין קָ֑שֶׁב וַ/יָּ֤שָׁב לִ/קְרָאת/וֹ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר לֹ֥א הֵקִ֖יץ הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
translation:
  language: ml
  text: 'ഗേഹസി അവർക്കു മുമ്പേ പോയി, വടി ബാലന്റെ മുഖത്തിന്മേൽ വെച്ചു. എന്നാൽ ശബ്ദമോ പ്രതികരണമോ ഉണ്ടായില്ല.[a] അതുകൊണ്ട് അവൻ അവനെ എതിരേൽക്കാൻ മടങ്ങിച്ചെന്ന് അവനോടു പറഞ്ഞു: “ബാലൻ ഉണർന്നിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ശബ്ദമില്ല; ശ്രദ്ധയോ കേൾവിയോ ഇല്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  choice: അവർക്കു മുമ്പേ പോയി
  rationale: ഗേഹസി എലീശയ്ക്കും സ്ത്രീക്കും മുന്നിലായി പോയെന്ന ദിശാസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמִּשְׁעֶנֶת
  choice: വടി
  rationale: ഈ സന്ദർഭത്തിലെ പ്രവാചകന്റെ കൈവടിയെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ പദം.
- source_word: עַל פְּנֵי הַנַּעַר
  choice: ബാലന്റെ മുഖത്തിന്മേൽ
  rationale: פָּנִים എന്നതിന്റെ ‘മുഖം’ എന്ന അക്ഷരാർഥവും נַעַר എന്നതിന്റെ സന്ദർഭോചിതമായ ‘ബാലൻ’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: וְאֵין קוֹל
  choice: ശബ്ദമോ ... ഉണ്ടായില്ല
  rationale: קוֹל എന്നത് ഇവിടെ ശബ്ദം അല്ലെങ്കിൽ സ്വരം എന്നാണ്; ‘ശബ്ദം’ മൂലപദത്തോട് അടുത്തതും സ്വാഭാവികവുമാണ്.
- source_word: וְאֵין קָשֶׁב
  choice: പ്രതികരണമോ ഉണ്ടായില്ല
  rationale: קָשֶׁב ശ്രദ്ധയെയോ കേൾവിയോടെയുള്ള പ്രതികരണത്തെയോ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ ‘പ്രതികരണം’ ആശയം വ്യക്തമായി നൽകുന്നു, കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וַיָּשָׁב לִקְרָאתוֹ
  choice: അവനെ എതിരേൽക്കാൻ മടങ്ങിച്ചെന്ന്
  rationale: ഗേഹസി മടങ്ങിപ്പോയി അവനെ കാണാൻ ചെന്നെന്ന ചലനം നിലനിർത്തുന്നു; ഹീബ്രുവിലെ സർവനാമം പേരാക്കി വിശദീകരിക്കാതെ അതിന്റെ രൂപവും സന്ദർഭപരമായ സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: അറിയിച്ചു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിക്കു മുമ്പുള്ള ഹീബ്രു റിപ്പോർട്ടിംഗ് സൂത്രത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: לֹא הֵקִיץ הַנָּעַר
  choice: ബാലൻ ഉണർന്നിട്ടില്ല
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ഉണരുക/ഉണർന്നിരിക്കുക എന്ന ഫലാവസ്ഥയെ അറിയിക്കുന്നു; വർത്തമാനസംബന്ധമായ പൂർത്തിഫലം മലയാളത്തിലെ ‘ഉണർന്നിട്ടില്ല’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അവൻ/അവനെ’ എന്ന സർവനാമപ്രയോഗം മൂലപാഠത്തിലെ സൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ രണ്ടാമത്തേത് എലീശയെ സൂചിപ്പിക്കുന്നു.
