source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ וּ/קְחוּ קֶ֔מַח וַ/יַּשְׁלֵ֖ךְ אֶל הַ/סִּ֑יר וַ/יֹּ֗אמֶר צַ֤ק לָ/עָם֙ וְ/יֹאכֵ֔לוּ וְ/לֹ֥א הָיָ֛ה דָּבָ֥ר רָ֖ע בַּ/סִּֽיר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/041.yaml
  text: Then he said[a], “Bring some flour.” And he threw it into the pot and said, “Pour it out for the people[b], so that they may eat.” And there was nothing harmful in the pot.
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “കുറച്ച് മാവ് കൊണ്ടുവരുവിൻ.” അവൻ അത് പാചകപ്പാത്രത്തിൽ എറിഞ്ഞു. പിന്നെ അവൻ പറഞ്ഞു: “ജനങ്ങൾക്കു വിളമ്പിക്കൊടുക്കുവിൻ; അവർ ഭക്ഷിക്കട്ടെ.” പാചകപ്പാത്രത്തിൽ ദോഷകരമായ ഒന്നും ഉണ്ടായിരുന്നില്ല.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത നടപടിയെ സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: וּקְחוּ קֶמַח
  choice: കുറച്ച് മാവ് കൊണ്ടുവരുവിൻ
  rationale: לקח എന്ന ബഹുവചന ആജ്ഞ സന്ദർഭത്തിൽ ആവശ്യമായ വസ്തു കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; അളവ് വ്യക്തമല്ലാത്തതിനാൽ ‘കുറച്ച്’ സ്വാഭാവികമാണ്.
- source_word: וַיַּשְׁלֵךְ אֶל־הַסִּיר
  choice: അവൻ അത് കലത്തിൽ ഇട്ടു
  rationale: שלך എന്നതിന് അക്ഷരാർഥത്തിൽ ‘എറിഞ്ഞു’ എന്നാകാമെങ്കിലും, മാവ് പാചകകലത്തിൽ ചേർക്കുന്ന പ്രവൃത്തിക്ക് ‘ഇട്ടു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും അർഥവിശ്വസ്തവുമാണ്.
- source_word: צַק לָעָם
  choice: ജനങ്ങൾക്കു വിളമ്പിക്കൊടുക്കുവിൻ
  rationale: יצק എന്ന ക്രിയയുടെ അടിസ്ഥാനധാരണ ഒഴിക്കുക എന്നതാണെങ്കിലും, ഇവിടെ കലത്തിലുള്ള ഭക്ഷണം വിതരണം ചെയ്യുന്നതാണ് സന്ദർഭാർഥം; ‘വിളമ്പിക്കൊടുക്കുവിൻ’ അത് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וְיֹאכֵלוּ
  choice: അവർ ഭക്ഷിക്കട്ടെ
  rationale: ആജ്ഞയെ തുടർന്നുള്ള അപൂർണ്ണക്രിയ അനുവദനീയമായ/ഉദ്ദേശ്യപരമായ ഫലം സൂചിപ്പിക്കുന്നു; ‘ഭക്ഷിക്കട്ടെ’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְלֹא הָיָה דָבָר רָע בַּסִּיר
  choice: കലത്തിൽ ദോഷകരമായ ഒന്നും ഉണ്ടായിരുന്നില്ല
  rationale: דָבָר רָע അക്ഷരാർഥത്തിൽ ‘ചീത്ത/തിന്മയായ കാര്യം’ എന്നാണെങ്കിലും വിഷബാധയുള്ള പായസത്തിന്റെ സന്ദർഭത്തിൽ ശാരീരികമായി ഹാനികരമായ ഒന്നിനെയാണ് സൂചിപ്പിക്കുന്നത്.
