translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ബഹുവചന ആജ്ഞയ്ക്ക് ‘കൊണ്ടുവരുവിൻ/വിളമ്പിക്കൊടുക്കുവിൻ’ എന്ന ഗ്രന്ഥോചിത രൂപം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചു.
