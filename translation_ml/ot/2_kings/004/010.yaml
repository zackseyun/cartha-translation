  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
translation:
  language: ml
  text: “നമുക്ക് ചുവരിന്മേൽ ഒരു ചെറിയ മാളികമുറി പണിയാമല്ലോ[a]. അവിടെ അദ്ദേഹത്തിനായി ഒരു കട്ടിലും മേശയും കസേരയും വിളക്കുതണ്ടും വെക്കാം. അദ്ദേഹം നമ്മുടെ അടുക്കൽ വരുമ്പോഴെല്ലാം അവിടെ കയറി തങ്ങാം[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ചുവരോടുകൂടിയ ഒരു ചെറിയ മാളികമുറി” അല്ലെങ്കിൽ ലളിതമായി “ഒരു ചെറിയ മാളികമുറി.” എബ്രായ പ്രയോഗം സങ്കുചിതമായതിനാൽ മുറി ചുവരിന്മേലാണോ, ചുവരോടുചേർന്നതാണോ, അതോ ചുവരുകളുള്ളതാണോ എന്നു വ്യത്യസ്തമായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവിടേക്കു മാറാം” അല്ലെങ്കിൽ “അവിടേക്കു തിരിയാം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയുടെ അടിസ്ഥാനാർഥം “വഴിമാറുക” എന്നതാണ്; ഈ സന്ദർഭത്തിൽ താമസിക്കാനായി അവിടെ കയറുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  choice: നമുക്ക് … പണിയാമല്ലോ
  rationale: ഒന്നാം പുരുഷ ബഹുവചനത്തിലെ നിർദേശഭാവവും נָא നൽകുന്ന സൗമ്യമായ അഭ്യർഥനാഭാവവും സ്വാഭാവികമായ മലയാള നിർദേശരൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עֲלִיַּת קִיר קְטַנָּה
  choice: ചുവരിന്മേൽ ഒരു ചെറിയ മാളികമുറി
  rationale: עֲלִיָּה എന്നത് മുകളിലത്തെ മുറിയെയും קִיר ‘ചുവർ’ എന്നതിനെയും സൂചിപ്പിക്കുന്നു. എബ്രായ പ്രയോഗത്തിന്റെ സങ്കുചിതത്വവും സ്ഥലസംബന്ധമായ ദൃശ്യഭാവവും നിലനിർത്തുന്നു; മറ്റു വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְנָשִׂים לוֹ שָׁם
  choice: അവിടെ അദ്ദേഹത്തിനായി … വെക്കാം
  rationale: שִׂים എന്നതിന്റെ സാധാരണ അർഥമായ ‘വെക്കുക’യും തുടർന്നുവരുന്ന നിർദേശഭാവവും സ്ഥലവും പരോക്ഷകർമവും നിലനിർത്തുന്നു.
- source_word: מִטָּה
  choice: കട്ടിൽ
  rationale: താമസത്തിനായി ഒരുക്കുന്ന ഭൗതിക ശയനോപകരണത്തെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: שֻׁלְחָן
  choice: മേശ
  rationale: ഗൃഹോപകരണസന്ദർഭത്തിലെ നേരിട്ടുള്ള ആധുനിക സമാനപദം.
- source_word: כִסֵּא
  choice: കസേര
  rationale: പൊതുവായ ‘ഇരിപ്പിടം’ എന്നതിനെക്കാൾ ഈ ഗൃഹോപകരണപ്പട്ടികയിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מְנוֹרָה
  choice: വിളക്കുതാങ്ങി
  rationale: വെറും വിളക്കല്ല, വിളക്ക് താങ്ങിനിർത്തുന്ന ഉപകരണമെന്ന പദത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- source_word: וְהָיָה בְּבֹאוֹ אֵלֵינוּ
  choice: അദ്ദേഹം നമ്മുടെ അടുക്കൽ വരുമ്പോഴെല്ലാം
  rationale: ഭാവിയിൽ ആവർത്തിച്ചുണ്ടാകുന്ന സന്ദർഭത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; എബ്രായ ഇടിയത്തിന്റെ ഭാരമുള്ള അക്ഷരാർഥരൂപം ഒഴിവാക്കുന്നു.
- source_word: יָסוּר שָׁמָּה
  choice: അവിടെ കയറി തങ്ങാം
  rationale: യാത്രാമധ്യേ വഴിമാറി ഒരു സ്ഥലത്ത് പ്രവേശിച്ച് താമസിക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘കയറി’ എന്നത് മാളികമുറിയുമായും യോജിക്കുന്നു.
