- from: 'അവൾ പെൺകഴുതയ്ക്കു കോപ്പിട്ടശേഷം തന്റെ വേലക്കാരനോടു പറഞ്ഞു: “അതിനെ തെളിച്ചുകൊണ്ടു മുന്നോട്ടുപോകുക. ഞാൻ നിന്നോടു പറയുന്നതുവരെ എനിക്കുവേണ്ടി യാത്രയുടെ വേഗം കുറയ്ക്കരുത്.”'
  to: 'അവൾ പെൺകഴുതയെ കോപ്പിട്ടു തന്റെ പരിചാരകനോടു പറഞ്ഞു: “അതിനെ തെളിച്ചു മുന്നോട്ടുപോകുക. ഞാൻ നിന്നോടു പറയുന്നതുവരെ എനിക്കുവേണ്ടി വേഗം കുറയ്ക്കരുത്.”[a]'
