  yaml_path: translation/ot/2_kings/004/024.yaml
  text: Then she saddled the donkey and said to her servant[a], “Drive on and go; do not slow down for me unless I tell you.”
translation:
  language: ml
  text: 'അവൾ പെൺകഴുതയെ കോപ്പിട്ടു തന്റെ പരിചാരകനോടു പറഞ്ഞു: “അതിനെ തെളിച്ചു മുന്നോട്ടുപോകുക. ഞാൻ നിന്നോടു പറയുന്നതുവരെ എനിക്കുവേണ്ടി വേഗം കുറയ്ക്കരുത്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘ഞാൻ സവാരി ചെയ്യുന്നതിനായി എനിക്കുവേണ്ടി തടയരുത്/നിർത്തരുത്’; അവൾ പറയുന്നതുവരെ അവളുടെ കാരണത്താൽ വേഗം കുറയ്ക്കുകയോ നിർത്തുകയോ ചെയ്യരുത് എന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  choice: അവൾ പെൺകഴുതയ്ക്കു കോപ്പിട്ടശേഷം
  rationale: חבש ഇവിടെ സവാരിക്കായി മൃഗത്തെ ഒരുക്കുക, അഥവാ കോപ്പിടുക എന്ന അർഥത്തിലാണ്. אָתוֹן പെൺകഴുതയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ആ വിവരം നിലനിർത്തി.
- source_word: נַעֲרָהּ
  choice: തന്റെ വേലക്കാരനോട്
  rationale: נַעַר എന്നത് ഇവിടെ അവളോടൊപ്പമുള്ള യുവാവായ സേവകനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പങ്കുസൂചക പദമായി ‘വേലക്കാരൻ’ ഉപയോഗിച്ചു.
- source_word: נְהַג וָלֵךְ
  choice: അതിനെ തെളിച്ചുകൊണ്ടു മുന്നോട്ടുപോകുക
  rationale: נהג മൃഗത്തെ തെളിച്ചു നയിക്കുന്നതും וָלֵךְ മുന്നോട്ടുള്ള തുടർച്ചയായ നീക്കവും സൂചിപ്പിക്കുന്നു.
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  choice: എനിക്കുവേണ്ടി യാത്രയുടെ വേഗം കുറയ്ക്കരുത്
  rationale: עצר എന്നതിന് തടയുക, നിർത്തുക, പിടിച്ചുനിർത്തുക എന്നീ അർഥങ്ങളുണ്ട്. സവാരിയുടെ സന്ദർഭത്തിൽ അവളുടെ കാരണത്താൽ വേഗം കുറയ്ക്കരുതെന്ന സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  choice: ഞാൻ നിന്നോടു പറയുന്നതുവരെ
  rationale: 'നിഷേധാത്മക കല്പനയ്ക്കുശേഷമുള്ള כִּי אִם ഒരു ഒഴിവുനിബന്ധന നൽകുന്നു: അവൾ പറഞ്ഞാൽ മാത്രം വേഗം കുറയ്ക്കണം. മലയാളത്തിൽ ‘പറയുന്നതുവരെ’ ഇത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.'
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. അടിയന്തരത വ്യക്തമാക്കാൻ ‘തെളിച്ചുകൊണ്ടു മുന്നോട്ടുപോകുക’ എന്നും, ദുഷ്കരമായ ഹീബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമാക്കാൻ ‘യാത്രയുടെ വേഗം കുറയ്ക്കരുത്’ എന്നും നൽകി.
