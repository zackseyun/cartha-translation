source:
  edition: WLC
  text: וַ/יְהִ֥י הַ/יּ֖וֹם וַ/יָּ֣בֹא שָׁ֑מָּ/ה וַ/יָּ֥סַר אֶל הָ/עֲלִיָּ֖ה וַ/יִּשְׁכַּב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/011.yaml
  text: One day he came there[a], turned aside into the upper room, and lay down there.
translation:
  language: ml
  text: ഒരു ദിവസം അവൻ അവിടെ വന്നു; മുകളിലത്തെ മുറിയിലേക്കു മാറിച്ചെന്ന് അവിടെ കിടന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടെ ഉറങ്ങി.” എബ്രായ ക്രിയയ്ക്ക് ‘കിടക്കുക’ എന്നോ ‘ഉറങ്ങുക’ എന്നോ അർഥമാകാം; ഈ സന്ദർഭം കൂടുതൽ നിർദിഷ്ടമായ അർഥം നിർബന്ധിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ഒരു ദിവസം
  rationale: ഈ എബ്രായ പ്രയോഗം കഥയിലെ ഒരു സന്ദർഭത്തെ പരിചയപ്പെടുത്തുന്നു. അക്ഷരാർഥത്തിലുള്ള ദീർഘമായ ഘടനയ്ക്കുപകരം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സമയസൂചന നിലനിർത്തുന്നു.
- source_word: וַיָּבֹא שָׁמָּה
  choice: അവൻ അവിടെ വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘വരുക’യും ആവർത്തിച്ചുള്ള שָׁמָּה എന്ന സ്ഥലസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיָּסַר
  choice: തിരിഞ്ഞുകയറി
  rationale: סור ഇവിടെ പ്രധാന വഴിയിൽനിന്നോ ഗതിയിൽനിന്നോ മാറി ഒരുക്കിയ സ്ഥലത്തേക്കു പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തിരിഞ്ഞുകയറി’ എന്നത് മാറിച്ചെല്ലലും മുറിയിലേക്കുള്ള പ്രവേശനവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֶל הָעֲלִיָּה
  choice: മുകളിലത്തെ മുറിയിലേക്കു
  rationale: עֲלִיָּה ഒരു കെട്ടിടത്തിന്റെ മുകളിലുള്ള മുറിയെയാണ് സൂചിപ്പിക്കുന്നത്. ഈ തിരഞ്ഞെടുപ്പ് അതിന്റെ വാസ്തുശില്പപരമായ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁכַּב שָׁמָּה
  choice: അവിടെ കിടന്നു
  rationale: שׁכב എന്ന ക്രിയയ്ക്ക് ‘കിടക്കുക’ എന്നും സന്ദർഭാനുസരണം ‘ഉറങ്ങുക’ എന്നും അർഥമാകാം. ‘കിടന്നു’ എന്നത് ഉറങ്ങിയെന്ന കൂടുതൽ നിർദിഷ്ടമായ അർഥം നിർബന്ധിക്കാതെ മൂലഭാഷയിലെ വിശാലത നിലനിർത്തുന്നു.
