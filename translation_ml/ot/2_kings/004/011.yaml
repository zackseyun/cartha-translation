translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. മൂലപാഠത്തിലെ ചുരുക്കവും ‘അവിടെ’ എന്ന ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
