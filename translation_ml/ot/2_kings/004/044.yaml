  yaml_path: translation/ot/2_kings/004/044.yaml
  text: So he set it before them[a], and they ate and had some left over, according to the word of Yahweh.
translation:
  language: ml
  text: അവൻ അത് അവരുടെ മുമ്പിൽ വെച്ചു; അവർ ഭക്ഷിച്ചു; യഹ്‌വെയുടെ വചനപ്രകാരം കുറെ മിച്ചം വെക്കുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുറെ ശേഷിക്കുകയും ചെയ്തു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: അവൻ അത് ... വെച്ചു
  rationale: נתן എന്ന ക്രിയയ്ക്ക് ‘കൊടുത്തു/വെച്ചു’ എന്നർഥമുണ്ട്. לִפְנֵיהֶם എന്ന പ്രയോഗത്തോടൊപ്പം ഭക്ഷണം വിളമ്പുന്ന ഈ സന്ദർഭത്തിൽ ‘അവരുടെ മുമ്പിൽ വെച്ചു’ എന്നത് സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്. ‘അത്’ മുൻവാക്യത്തിലെ ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭത്തിൽനിന്ന് ചേർത്തിരിക്കുന്നു.
- source_word: לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പിൽ
  rationale: പദശഃ ‘അവരുടെ മുമ്പിൽ/അവരുടെ മുന്നിൽ’; ഭക്ഷണം വിളമ്പുന്ന സാഹചര്യത്തിലും സ്വാഭാവികമായ പ്രയോഗം.
- source_word: וַיֹּאכְלוּ
  choice: അവർ ഭക്ഷിച്ചു
  rationale: אכל എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുള്ളതുമായ വിവർത്തനം.
- source_word: וַיּוֹתִרוּ
  choice: കുറെ മിച്ചംവെക്കുകയും ചെയ്തു
  rationale: יתר എന്ന ഹിഫീൽ രൂപം ‘ശേഷിപ്പിക്കുക, മിച്ചംവെക്കുക’ എന്നർഥം നൽകുന്നു. ഭക്ഷിച്ചതിനുശേഷവും കുറെ ശേഷിച്ചെന്ന ആശയം ഇത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ക്രിയയുടെ കാരകഭാവവും നിലനിർത്തുന്നു.
- source_word: כִּדְבַר
  choice: വചനപ്രകാരം
  rationale: ‘വചനത്തിന് അനുസരിച്ച്/വചനപ്രകാരം’ എന്ന ഔപചാരിക ബന്ധം നിലനിർത്തുന്നു; ദൈവികമായി അരുളിച്ചെയ്ത വാക്കുമായുള്ള ബന്ധം വെറും ‘പറഞ്ഞതുപോലെ’ എന്നാക്കി ദുർബലപ്പെടുത്തുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, ആ വ്യക്തിനാമത്തിന്റെ ആധുനിക മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ ഒരു ബിരുദമായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരിച്ചു. ‘യഹ്‌വെ’ എന്ന രൂപം സാധാരണ പണ്ഡിതീയ പുനർനിർമാണമായ Yahweh-നോട് ചേരുന്നു.
- issue: וַיּוֹתִרוּ എന്ന ക്രിയയിലെ ശേഷിപ്പിക്കൽ/ശേഷിക്കൽ ഭാവം
  choice: കുറെ മിച്ചംവെക്കുകയും ചെയ്തു
  alternative: കുറെ ശേഷിക്കുകയും ചെയ്തു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരകസ്വഭാവം പ്രധാന പാഠത്തിൽ നിലനിർത്തി. എങ്കിലും ഫലാവസ്ഥയെ മുൻനിർത്തിയുള്ള ‘ശേഷിച്ചു’ എന്ന വായനയും പ്രസക്തമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ചെറുവാക്യങ്ങളിലൂടെ എബ്രായ ആഖ്യാനക്രമം നിലനിർത്തി; ദൈവിക വചനവുമായി ബന്ധപ്പെട്ട ഔപചാരിക പ്രയോഗവും സംരക്ഷിച്ചു.
