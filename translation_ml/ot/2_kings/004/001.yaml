  edition: WLC
  text: וְ/אִשָּׁ֣ה אַחַ֣ת מִ/נְּשֵׁ֣י בְנֵֽי הַ֠/נְּבִיאִים צָעֲקָ֨ה אֶל אֱלִישָׁ֜ע לֵ/אמֹ֗ר עַבְדְּ/ךָ֤ אִישִׁ/י֙ מֵ֔ת וְ/אַתָּ֣ה יָדַ֔עְתָּ כִּ֣י עַבְדְּ/ךָ֔ הָיָ֥ה יָרֵ֖א אֶת יְהוָ֑ה וְ/הַ֨/נֹּשֶׁ֔ה בָּ֗א לָ/קַ֜חַת אֶת שְׁנֵ֧י יְלָדַ֛/י ל֖/וֹ לַ/עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/001.yaml
  text: One woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as servants.”
translation:
  language: ml
  text: 'പ്രവാചകശിഷ്യന്മാരുടെ ഭാര്യമാരിൽ ഒരുവൾ എലീശയോടു നിലവിളിച്ചു: “അങ്ങയുടെ ദാസനായ എന്റെ ഭർത്താവ് മരിച്ചുപോയി. അങ്ങയുടെ ദാസൻ യഹ്‌വെയെ ഭയപ്പെട്ടിരുന്നുവെന്ന് അങ്ങേക്ക് അറിയാമല്ലോ. കടം നൽകിയവൻ എന്റെ രണ്ടു കുട്ടികളെയും[a] തന്റെ ദാസന്മാരാക്കാൻ കൊണ്ടുപോകാനെത്തിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ രണ്ടു പുത്രന്മാരെയും.’ എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘കുട്ടികൾ’ എന്നാണ്; സന്ദർഭത്തിൽ അത് പുത്രന്മാരെ കൂടുതൽ നിർദിഷ്ടമായി സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת
  choice: ഒരുവൾ
  rationale: പുതിയ സംഭവത്തിലെ അനിശ്ചിത സ്ത്രീവിഷയത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ വ്യക്തമായ കാലസൂചകപദമില്ലാത്തതിനാൽ തുടക്കത്തിൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  choice: പ്രവാചകശിഷ്യന്മാരുടെ ഭാര്യമാരിൽ
  rationale: ‘പ്രവാചകന്മാരുടെ പുത്രന്മാർ’ എന്ന എബ്രായ സാമൂഹികപ്രയോഗം പ്രവാചകസമൂഹത്തിലെ അംഗങ്ങളെയോ ശിഷ്യന്മാരെയോ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥം സൃഷ്ടിക്കുന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: צָעֲקָה
  choice: നിലവിളിച്ചു
  rationale: സ്ത്രീയുടെ അടിയന്തര ദുരിതവും സഹായത്തിനായുള്ള തീവ്രമായ അഭ്യർഥനയും സംരക്ഷിക്കുന്നു.
- source_word: עַבְדְּךָ אִישִׁי
  choice: അങ്ങയുടെ ദാസനായ എന്റെ ഭർത്താവ്
  rationale: എലീശയോടുള്ള ഭർത്താവിന്റെ ബന്ധവും സ്ത്രീയോടുള്ള വിവാഹബന്ധവും ഒരുപോലെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מֵת
  choice: മരിച്ചുപോയി
  rationale: പൂർത്തിയായ മരണസംഭവത്തിന്റെ ഇപ്പോഴും തുടരുന്ന പ്രത്യാഘാതം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יָדַעְתָּ
  choice: അങ്ങേക്ക് അറിയാമല്ലോ
  rationale: എലീശയ്ക്ക് ഇതിനകം അറിയാവുന്ന കാര്യം സാക്ഷ്യമായി അഭ്യർഥിക്കുന്ന സ്ത്രീയുടെ ഭാവം മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: യഹ്‌വെയെ ഭയപ്പെട്ടിരുന്നു
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയം സൂചിപ്പിക്കുന്ന പതിവ് ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַנֹּשֶׁה
  choice: കടം നൽകിയവൻ
  rationale: കടം തിരിച്ചുകിട്ടാനുള്ള അവകാശമുള്ള വ്യക്തിയെയാണ് പങ്കാളുരൂപം സൂചിപ്പിക്കുന്നത്; ‘കടക്കാരൻ’ എന്ന മലയാളപദത്തിനുള്ള കടക്കാരൻ/കടയുടമ എന്നീ ആശയക്കുഴപ്പങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: בָּא לָקַחַת
  choice: കൊണ്ടുപോകാനെത്തിയിരിക്കുന്നു
  rationale: ഭീഷണി ഇതിനകം വാതിൽക്കൽ എത്തിയിരിക്കുന്നുവെന്ന പൂർത്തിയായ പ്രവൃത്തിയുടെ വർത്തമാന പ്രസക്തി പ്രകടമാക്കുന്നു.
- source_word: שְׁנֵי יְלָדַי
  choice: എന്റെ രണ്ടു കുട്ടികളെയും
  rationale: എബ്രായം ലിംഗനിർണ്ണയം നിർബന്ധമാക്കാതെ ‘കുട്ടികൾ’ എന്നു പറയുന്നു; സാധ്യതയുള്ള കൂടുതൽ നിർദിഷ്ട അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לוֹ לַעֲבָדִים
  choice: തന്റെ ദാസന്മാരാക്കാൻ
  rationale: കടം നൽകിയവൻ കുട്ടികളെ സ്വന്തം സേവനത്തിനായി കൈവശപ്പെടുത്താൻ ഉദ്ദേശിക്കുന്നുവെന്ന സ്വാർഥപ്രയോജനഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ‘പ്രവാചകന്മാരുടെ പുത്രന്മാർ’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രവാചകശിഷ്യന്മാർ
  alternative: പ്രവാചകന്മാരുടെ പുത്രന്മാർ
  rationale: ഇത് ജൈവപുത്രത്വം നിർബന്ധമാക്കാത്ത, പ്രവാചകസമൂഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; പ്രത്യേക സമ്പ്രദായപരമായ ഘടന ഇറക്കുമതി ചെയ്യാതെ സാമൂഹിക അർഥം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. എലീശയെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ ഉപയോഗിച്ച് ബഹുമാനം സൂചിപ്പിച്ചു. നിയമ-സാമ്പത്തിക അർഥം വ്യക്തമാക്കാൻ അസ്പഷ്ടമായ ‘കടക്കാരൻ’ എന്നതിനുപകരം ‘കടം നൽകിയവൻ’ തിരഞ്ഞെടുത്തു.
