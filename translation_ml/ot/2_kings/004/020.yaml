  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
translation:
  language: ml
  text: അവൻ ബാലനെ ചുമന്നുകൊണ്ടുവന്ന് അവന്റെ അമ്മയുടെ അടുക്കൽ എത്തിച്ചു. ബാലൻ ഉച്ചവരെ അവളുടെ മടിയിൽ[a] ഇരുന്നു; പിന്നെ അവൻ മരിച്ചു.
  philosophy: optimal-equivalence
