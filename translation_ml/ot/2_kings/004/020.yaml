translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മുൻവാക്യത്തിലെ ഭൃത്യനിൽനിന്ന് ബാലനിലേക്കുള്ള സർവനാമമാറ്റം ആശയക്കുഴപ്പം ഉണ്ടാക്കാതിരിക്കാൻ രണ്ടാമത്തെ ഘട്ടത്തിൽ ‘ബാലൻ’ എന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു. പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ ‘മടിയിൽ’ ഉപയോഗിക്കുകയും എബ്രായത്തിലെ ശരീരഭാഗസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
