lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  choice: ബാലനെ എടുത്ത്
  rationale: נשׂא എന്ന ക്രിയയ്ക്ക് ‘എടുക്കുക, ഉയർത്തുക, ചുമക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ബാലനെ അമ്മയുടെ അടുക്കൽ എത്തിക്കുന്ന പ്രവൃത്തിയുടെ ആരംഭവും തുടർച്ചയും സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘എടുത്ത്’ യോജിക്കുന്നു.
- source_word: וַיְבִיאֵהוּ
  choice: കൊണ്ടുവന്നു
  rationale: ביא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം സാധാരണയായി ‘കൊണ്ടുവരുക’ എന്നാണ്; അമ്മയിലേക്കുള്ള ദിശ ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: אֶל אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ അടുക്കൽ
  rationale: ബന്ധവും ദിശയും വ്യക്തമായി സൂചിപ്പിക്കുന്ന, dignified modern Malayalam phrasing.
- source_word: וַיֵּשֶׁב
  choice: ഇരുന്നു
  rationale: ישׁב ഇവിടെ ഇരിക്കുന്ന ശാരീരികാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഇരുന്നു’ എന്നത് ആ അവസ്ഥയുടെ തുടർച്ചയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עַל בִּרְכֶּיהָ
  choice: അവളുടെ മടിയിൽ
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവളുടെ മുട്ടുകളിന്മേൽ’ എന്നാണ്. ഈ സാഹചര്യത്തിൽ മലയാളത്തിലെ സ്വാഭാവികവും അർഥസമാനവുമായ പ്രയോഗം ‘മടിയിൽ’ എന്നതാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: עַד הַצָּהֳרַיִם
  choice: ഉച്ചവരെ
  rationale: צָהֳרַיִם ഉച്ചയെയോ മധ്യാഹ്നത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ഉച്ചവരെ’ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וַיָּמֹת
  choice: പിന്നെ അവൻ മരിച്ചു
  rationale: വാവ്-തുടർച്ചാവിന്യാസം കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ‘പിന്നെ’ കാലക്രമം വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത കാരണബന്ധം ചേർക്കുന്നില്ല.
