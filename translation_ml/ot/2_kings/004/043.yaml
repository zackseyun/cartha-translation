id: 2KI.4.43
reference: 2 Kings 4:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ מְשָׁ֣רְת֔/וֹ מָ֚ה אֶתֵּ֣ן זֶ֔ה לִ/פְנֵ֖י מֵ֣אָה אִ֑ישׁ וַ/יֹּ֗אמֶר תֵּ֤ן לָ/עָם֙ וְ/יֹאכֵ֔לוּ כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה אָכֹ֥ל וְ/הוֹתֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
translation:
  language: ml
  text: 'എന്നാൽ അവന്റെ ശുശ്രൂഷകൻ പറഞ്ഞു[a]: “നൂറുപേർക്കു വിളമ്പാൻ ഇതെങ്ങനെ മതിയാകും?” അവൻ പറഞ്ഞു: “അതു ജനത്തിനു കൊടുക്കുക; അവർ ഭക്ഷിക്കട്ടെ[b]. എന്തെന്നാൽ യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘അവർ ഭക്ഷിക്കും; ആഹാരം ശേഷിക്കും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇതു ഞാൻ എങ്ങനെ നൂറുപേർക്കു കൊടുക്കും?” എബ്രായത്തിൽ അക്ഷരാർഥം: “ഇതു ഞാൻ നൂറുപേരുടെ മുമ്പിൽ എന്തു കൊടുക്കും?”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഭക്ഷിക്കുകയും ശേഷിപ്പിക്കുകയും ചെയ്യുക’ എന്നാണ്; അവർ ഭക്ഷിച്ചശേഷം ആഹാരം ശേഷിക്കുമെന്നതാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  choice: അവന്റെ ശുശ്രൂഷകൻ
  rationale: വ്യക്തിപരമായോ ഔദ്യോഗികമായോ സേവിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു; എലീശായുടെ കീഴിൽ സേവിക്കുന്ന വ്യക്തിയെന്ന സന്ദർഭത്തിന് ‘ശുശ്രൂഷകൻ’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  choice: നൂറുപേർക്കു വിളമ്പാൻ ഇതെങ്ങനെ മതിയാകും?
  rationale: എബ്രായത്തിലെ ‘അവരുടെ മുമ്പിൽ വെക്കുക’ എന്ന ഭക്ഷണസന്ദർഭത്തിലെ ദൃശ്യത്തെ ‘വിളമ്പാൻ’ സ്വാഭാവികമായി പകർന്നുകൊണ്ട്, ശുശ്രൂഷകന്റെ സംശയവും അളവിന്റെ അപര്യാപ്തതയും പ്രകടമാക്കുന്നു.
- source_word: אִישׁ
  choice: പേർ
  rationale: സംഖ്യയ്ക്കുശേഷമുള്ള വിതരണാർഥക പ്രയോഗം മലയാളത്തിൽ ‘നൂറുപേർ’ എന്നു സ്വാഭാവികമായി വരുന്നു; സന്ദർഭത്തിലെ മനുഷ്യരുടെ എണ്ണം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: תֵּן לָעָם
  choice: അതു ജനത്തിനു കൊടുക്കുക
  rationale: עָם കൂട്ടത്തെ സമാഹാരമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനം’ യോജിക്കുന്നു; മുൻവാക്യത്തിലെ വ്യക്തിഗണനയിൽനിന്നുള്ള എബ്രായ പദമാറ്റവും നിലനിർത്തുന്നു.
- source_word: וְיֹאכֵלוּ
  choice: അവർ ഭക്ഷിക്കട്ടെ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ജസ്സീവ്/ഫലസൂചക ക്രിയയുടെ അനുവദനാത്മക-ആജ്ഞാത്മക ബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: എന്തെന്നാൽ യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചക സന്ദേശസൂത്രത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുകയും, ദൈവനാമമായ יהוהയെ ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: אָכֹל וְהוֹתֵר
  choice: അവർ ഭക്ഷിക്കും; ശേഷിക്കുകയും ചെയ്യും
  rationale: ഭക്ഷിച്ചശേഷം ആഹാരം ശേഷിക്കുമെന്ന ഉറപ്പുള്ള പ്രവചനഫലം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; എന്താണ് ശേഷിക്കുന്നതെന്നത് മൂലപാഠത്തെപ്പോലെ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കാൻ വിടുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ നാലക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ച് അതിനെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: אָכֹל וְהוֹתֵר എന്ന പ്രവചനവാക്യത്തിന്റെ ഉറപ്പ്
  choice: അവർ ഭക്ഷിക്കും; ശേഷിക്കുകയും ചെയ്യും
  alternative: അവർ ഭക്ഷിച്ചു ശേഷിപ്പിക്കും
  rationale: ആഹാരം കഴിക്കുന്നവർ മനഃപൂർവം ശേഷിപ്പിക്കുന്നു എന്ന ഭാവം നിർബന്ധിക്കാതെ, ഭക്ഷണത്തിനുശേഷം ശേഷിപ്പുണ്ടാകുമെന്ന ഫലത്തെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അരുളിച്ചെയ്യുന്നു’ പ്രവാചകസൂത്രത്തിന്റെ ഗൗരവം സൂക്ഷിക്കുന്നു; അനാവശ്യമായ പുരാതന പദക്രമം ഒഴിവാക്കിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
