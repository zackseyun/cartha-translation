  text: וַ/יֹּ֨אמֶר לְ/גֵיחֲזִ֜י חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ/קַ֨ח מִשְׁעַנְתִּ֣/י בְ/יָדְ/ךָ֮ וָ/לֵךְ֒ כִּֽי תִמְצָ֥א אִישׁ֙ לֹ֣א תְבָרְכֶ֔/נּוּ וְ/כִֽי יְבָרֶכְ/ךָ֥ אִ֖ישׁ לֹ֣א תַעֲנֶ/נּ֑וּ וְ/שַׂמְתָּ֥ מִשְׁעַנְתִּ֖/י עַל פְּנֵ֥י הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
translation:
  language: ml
  text: 'അവൻ ഗേഹസിയോടു പറഞ്ഞു: “വസ്ത്രം അരയിൽ കെട്ടിയൊരുങ്ങുക,[a] എന്റെ വടി കൈയിലെടുത്ത് പോകുക. ആരെയെങ്കിലും കണ്ടാൽ അഭിവാദ്യം ചെയ്യരുത്; ആരെങ്കിലും നിന്നെ അഭിവാദ്യം ചെയ്താൽ മറുപടി പറയരുത്.[b] എന്റെ വടി ബാലന്റെ മുഖത്തിന്മേൽ വെക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥം “നിന്റെ അര കെട്ടുക.” നീണ്ട വസ്ത്രം അരയിൽ ഉറപ്പിച്ച് വേഗത്തിൽ പ്രവർത്തിക്കാൻ ഒരുങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: “അനുഗ്രഹിക്കരുത് / ആരെങ്കിലും നിന്നെ അനുഗ്രഹിച്ചാൽ” എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ വഴിയിൽ അഭിവാദ്യം കൈമാറുന്നതായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  choice: വസ്ത്രം അരയിൽ കെട്ടിയൊരുങ്ങുക
  rationale: അക്ഷരാർഥത്തിൽ ‘അര കെട്ടുക’; നീണ്ട വസ്ത്രം അരയിൽ ഉറപ്പിച്ച് അടിയന്തര പ്രവർത്തനത്തിന് ഒരുങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. തിരക്കിന്റെയും സന്നദ്ധതയുടെയും ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִשְׁעַנְתִּי
  choice: എന്റെ വടി
  rationale: ആശ്രയിക്കാനോ നടക്കാനോ ഉപയോഗിക്കുന്ന വടിയെ സൂചിപ്പിക്കുന്നു; ഈ വിവരണസന്ദർഭത്തിൽ ‘വടി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וָלֵךְ
  choice: പോകുക
  rationale: ചലനത്തിനുള്ള നേരിട്ടുള്ള ആജ്ഞ; കല്പനകളുടെ വേഗമേറിയ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: כִּי תִמְצָא אִישׁ
  choice: വഴിയിൽ ആരെയെങ്കിലും കണ്ടാൽ
  rationale: אִישׁ എന്നത് രൂപത്തിൽ ‘പുരുഷൻ’ ആണെങ്കിലും ഇവിടെ യാത്രാമധ്യേ കണ്ടുമുട്ടുന്ന ഏതൊരു വ്യക്തിയെയും പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘വഴിയിൽ’ എന്നത് സന്ദർഭത്തിൽ അന്തർനിഹിതമായ കൂടിക്കാഴ്ച വ്യക്തമാക്കുന്നു.
- source_word: לֹא תְבָרְכֶנּוּ / וְכִי יְבָרֶכְךָ אִישׁ
  choice: അഭിവാദ്യം ചെയ്യരുത് / അഭിവാദ്യം ചെയ്താൽ
  rationale: ברך എന്നതിന് അക്ഷരാർഥത്തിൽ ‘അനുഗ്രഹിക്കുക’ എന്നാകാമെങ്കിലും, വഴിയിൽ ആളുകൾ കണ്ടുമുട്ടുന്ന ഈ സാമൂഹിക സന്ദർഭത്തിൽ അഭിവാദ്യം കൈമാറുക എന്ന അർഥമാണ് ഏറെ സാധ്യതയുള്ളത്. മൂലത്തിലെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לֹא תַעֲנֶנּוּ
  choice: മറുപടി പറയുകയും അരുത്
  rationale: ‘ഉത്തരം പറയുക/പ്രതികരിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം നൽകുകയും കല്പനയുടെ കർശനത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְשַׂמְתָּ ... עַל פְּנֵי הַנָּעַר
  choice: എന്റെ വടി ബാലന്റെ മുഖത്തിന്മേൽ വെക്കുക
  rationale: שׂים എന്നത് ‘വെക്കുക’; עַל־פְּנֵי എന്നത് ‘മുഖത്തിന്മേൽ’ എന്ന നിലയിൽ അടുത്തായി പരിഭാഷപ്പെടുത്തി. അവസാന വാക്യം അനാവശ്യമായ കാലസൂചകപദം ചേർക്കാതെ മൂലത്തിലെ തുടർച്ചയായ ആജ്ഞയായി നൽകിയിരിക്കുന്നു.
- source_word: הַנָּעַר
  choice: ബാലൻ
  rationale: נַעַר എന്നതിന് ബാലൻ, യുവാവ്, ദാസൻ തുടങ്ങിയ അർഥങ്ങളുണ്ടാകാം; ഇവിടെ ശൂനേംകാരിയുടെ മകനായ കുട്ടിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ബാലൻ’ യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. അടിയന്തരത പ്രകടമാക്കുന്ന ഹ്രസ്വ ആജ്ഞകൾ നിലനിർത്തി. പൊതുവായ അർഥമുള്ള אִישׁ ലിംഗനിരപേക്ഷമായി ‘ആരെങ്കിലും’ എന്നു നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാചകഭാഗങ്ങളിൽ ചേർത്തിട്ടുണ്ട്.
