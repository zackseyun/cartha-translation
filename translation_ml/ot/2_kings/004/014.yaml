id: 2KI.4.14
reference: 2 Kings 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר וּ/מֶ֖ה לַ/עֲשׂ֣וֹת לָ֑/הּ וַ/יֹּ֣אמֶר גֵּיחֲזִ֗י אֲבָ֛ל בֵּ֥ן אֵֽין לָ֖/הּ וְ/אִישָׁ֥/הּ זָקֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/014.yaml
  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു[a]: “അവൾക്കുവേണ്ടി എന്താണ് ചെയ്യേണ്ടത്?” ഗേഹസി പറഞ്ഞു: “എന്നാൽ അവൾക്കു മകനില്ല[b]; അവളുടെ ഭർത്താവും വൃദ്ധനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അപ്പോൾ അവൻ ചോദിച്ചു.”'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അവൾക്കു മകൻ ഇല്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവൻ ചോദിച്ചു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികവും സന്ദർഭസത്യവുമാണ്.
- source_word: וּמֶה לַעֲשׂוֹת לָהּ
  choice: അവൾക്കുവേണ്ടി എന്താണ് ചെയ്യേണ്ടത്?
  rationale: ലְ + ക്രിയാനാമരൂപം ഇവിടെ അവൾക്കായി ചെയ്യേണ്ട കാര്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ കർത്താവില്ലാത്ത ഈ പ്രയോഗം എബ്രായത്തിലെ തുറന്ന ഘടന നിലനിർത്തുന്നു.
- source_word: גֵּיחֲזִי
  choice: ഗേഹസി
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ള രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֲבָל
  choice: എന്നാൽ
  rationale: ഇവിടെ ഈ കണം മുൻസംഭാഷണത്തോട് ഒരു തിരിവോടെ ഗേഹസിയുടെ നിർണായക നിരീക്ഷണം അവതരിപ്പിക്കുന്നു; ‘എന്നാൽ’ ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֵּן אֵין לָהּ
  choice: അവൾക്കു മകനില്ല
  rationale: എബ്രായത്തിലെ അസ്തിത്വ-ദാതൃഘടന മലയാളത്തിലും ഏറെ സ്വാഭാവികമായി നിലനിർത്താം; בֵּן എന്നത് പൊതുവായ ‘കുട്ടി’യല്ല, പ്രത്യേകമായി ‘മകൻ’ ആണ്.
- source_word: וְאִישָׁהּ זָקֵן
  choice: അവളുടെ ഭർത്താവോ വൃദ്ധനാണ്
  rationale: സന്ദർഭത്തിൽ אִישָׁהּ ‘അവളുടെ ഭർത്താവ്’ എന്നാണ്. ‘-ഓ’ ഘടകം രണ്ടാമത്തെ സാഹചര്യത്തെ ശ്രദ്ധേയമായി കൂട്ടിച്ചേർക്കുന്നു; זָקֵן നേരിട്ട് ‘വൃദ്ധൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അവൾക്കുവേണ്ടി എന്താണ് ചെയ്യേണ്ടത്?’ എന്ന രൂപം മൂലത്തിലെ ഉദ്ദേശ്യ/ബാധ്യതാഭാവം നിലനിർത്തുന്നു. ‘മകൻ’ എന്ന ലിംഗനിർദ്ദിഷ്ട പദവും ഭർത്താവിന്റെ വാർധക്യവും ചുരുക്കാതെ സംരക്ഷിച്ചു.
