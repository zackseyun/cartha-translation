id: 2KI.4.30
reference: 2 Kings 4:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֵ֣ם הַ/נַּ֔עַר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּ֖קָם וַ/יֵּ֥לֶךְ אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
translation:
  language: ml
  text: 'അപ്പോൾ ബാലന്റെ അമ്മ പറഞ്ഞു[a]: “യഹോവ ജീവിച്ചിരിക്കുന്നതുപോലെയും അങ്ങ് ജീവിച്ചിരിക്കുന്നതുപോലെയും, ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല.” അപ്പോൾ അദ്ദേഹം എഴുന്നേറ്റ് അവളുടെ പിന്നാലെ പോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിലെ ശപഥസൂത്രം അക്ഷരാർഥത്തിൽ: “യഹോവ ജീവിക്കുന്നതുപോലെയും അങ്ങയുടെ ജീവൻ ജീവിക്കുന്നതുപോലെയും”; അർഥം: “യഹോവ ജീവിക്കുന്നതും അങ്ങ് ജീവിക്കുന്നതും എത്ര ഉറപ്പോ, അത്ര ഉറപ്പായി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵם הַנַּעַר
  choice: ബാലന്റെ അമ്മ
  rationale: എബ്രായത്തിലെ നിർമാണബന്ധത്തെ സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: യഹോവ ജീവിക്കുന്നതുപോലെയും അങ്ങയുടെ ജീവൻ നിലനിൽക്കുന്നതുപോലെയും
  rationale: യഹോവയുടെയും അഭിസംബോധിതന്റെയും ജീവനെ ആധാരമാക്കിയ എബ്രായ ശപഥസൂത്രത്തിന്റെ രൂപവും ഗൗരവവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല
  rationale: ശപഥത്തിനു ശേഷമുള്ള אִם ഇവിടെ ശക്തമായ നിഷേധപ്രതിജ്ഞയാണ്; അക്ഷരാർഥത്തിലുള്ള വ്യവസ്ഥാവാക്യം മലയാളത്തിൽ ഉദ്ദേശം മറയ്ക്കുമെന്നതിനാൽ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: וַיָּקָם
  choice: അദ്ദേഹം എഴുന്നേറ്റ്
  rationale: കർത്താവ് എലീശയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു; ആദരസൂചക സർവനാമത്തോടൊപ്പം ക്രമാനുസൃത ആഖ്യാനചലനം നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ אַחֲרֶיהָ
  choice: അവളുടെ പിന്നാലെ പോയി
  rationale: ‘അവളുടെ പിറകെ പോയി’ എന്ന എബ്രായ ദൃശ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശപഥസൂത്രത്തിലെ יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: וְחֵי נַפְשְׁךָ എന്നതിലെ נֶפֶשׁ
  choice: അങ്ങയുടെ ജീവൻ നിലനിൽക്കുന്നതുപോലെയും
  alternative: അങ്ങയുടെ ആത്മാവ് ജീവിക്കുന്നതുപോലെയും
  rationale: ഈ ശപഥസൂത്രത്തിൽ נֶפֶשׁ മുഴുവൻ വ്യക്തിയുടെ ജീവനെ സൂചിപ്പിക്കുന്നു; ‘ആത്മാവ്’ എന്നു നൽകിയാൽ ശരീരം–ആത്മാവ് വിഭജനത്തെ അനാവശ്യമായി സൂചിപ്പിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എലീശയെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്/അങ്ങയെ’ എന്നും അദ്ദേഹത്തെ സൂചിപ്പിക്കാൻ ‘അദ്ദേഹം’ എന്നും ഉപയോഗിച്ചു. ശപഥത്തിന്റെ അപരിചിതമായ രൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കി.
