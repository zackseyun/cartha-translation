id: 2KI.4.23
reference: 2 Kings 4:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מַ֠דּוּעַ אתי הלכתי אֵלָי/ו֙ הַ/יּ֔וֹם לֹֽא חֹ֖דֶשׁ וְ/לֹ֣א שַׁבָּ֑ת וַ/תֹּ֖אמֶר שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/023.yaml
  text: And he said[a], “Why are you going to him today? It is neither new moon nor Sabbath.” And she said, “Peace.”
translation:
  language: ml
  text: 'അവൻ ചോദിച്ചു: “ഇന്ന് നീ അദ്ദേഹത്തിന്റെ അടുക്കൽ പോകുന്നത് എന്തിനാണ്? ഇന്ന് അമാവാസിയുമല്ല, ശബ്ബത്തുമല്ലല്ലോ.” അവൾ പറഞ്ഞു: “സമാധാനം.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എല്ലാം സുഖമാണ്” അല്ലെങ്കിൽ “സുഖംതന്നെ.” എബ്രായപദത്തിന്റെ അക്ഷരാർഥം “സമാധാനം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: എന്തിനാണ്
  rationale: കാരണമോ ഉദ്ദേശ്യമോ ചോദിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: אתי הלכתי
  choice: നീ ... പോകുന്നത്
  rationale: സ്ത്രീ ഏകവചനത്തെ അഭിസംബോധന ചെയ്യുന്ന, ഉടൻ നടക്കാനിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ചോദ്യം; മലയാളത്തിൽ ഈ രൂപം സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: אֵלָיו
  choice: അദ്ദേഹത്തിന്റെ അടുക്കൽ
  rationale: സന്ദർഭത്തിൽ എലീശായെ സൂചിപ്പിക്കുന്ന സർവനാമം തന്നെയാണ് മൂലപാഠത്തിലുള്ളത്; പേര് ചേർത്ത് അമിതമായി വ്യക്തമാക്കുന്നില്ല. ആദരസൂചക രൂപം മലയാളത്തിൽ പ്രവാചകനെക്കുറിച്ചുള്ള സ്വാഭാവിക പരാമർശമാണ്.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചക ക്രിയാവിശേഷണത്തിന്റെ വ്യക്തവും സാധാരണവുമായ മലയാളരൂപം.
- source_word: לֹא חֹדֶשׁ וְלֹא שַׁבָּת
  choice: ഇന്ന് അമാവാസിയുമല്ല, ശബ്ബത്തുമല്ലല്ലോ
  rationale: ഇരട്ട നിഷേധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ഭർത്താവിന്റെ ചോദ്യത്തിന് പിന്നിലെ ആശ്ചര്യഭാവം ‘അല്ലല്ലോ’ വഴി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: חֹדֶשׁ
  choice: അമാവാസി
  rationale: ഇവിടെ ‘മാസം’ എന്നതിലുപരി പുതുചന്ദ്രദിനാചരണമാണ് ഉദ്ദേശ്യം; മലയാള ബൈബിൾ-സാംസ്കാരിക ഭാഷയിൽ ‘അമാവാസി’ വ്യക്തമാണ്.
- source_word: שַׁבָּת
  choice: ശബ്ബത്ത്
  rationale: ഇസ്രായേലിന്റെ വിശുദ്ധ വിശ്രമദിനത്തിനുള്ള അംഗീകൃത ബൈബിൾ പദം.
- source_word: שָׁלוֹם
  choice: സമാധാനം
  rationale: മൂലപദത്തിന്റെ നിഘണ്ടുപരമായ സുതാര്യത നിലനിർത്തുന്നു; ഈ ഹ്രസ്വ മറുപടിയിലെ ‘എല്ലാം സുഖമാണ്’ എന്ന പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലപാഠത്തിലെ ഹ്രസ്വതയും സംഭാഷണസ്വഭാവവും നിലനിർത്തിയിരിക്കുന്നു; ശָׁלוֹם എന്ന പദത്തിന്റെ അക്ഷരാർഥം മുഖ്യപാഠത്തിലും സന്ദർഭോചിത അർഥം അടിക്കുറിപ്പിലും നൽകിയിരിക്കുന്നു.
