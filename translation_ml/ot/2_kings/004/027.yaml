  text: וַ/תָּבֹ֞א אֶל אִ֤ישׁ הָֽ/אֱלֹהִים֙ אֶל הָ/הָ֔ר וַֽ/תַּחֲזֵ֖ק בְּ/רַגְלָ֑י/ו וַ/יִּגַּ֨שׁ גֵּֽיחֲזִ֜י לְ/הָדְפָ֗/הּ וַ/יֹּאמֶר֩ אִ֨ישׁ הָ/אֱלֹהִ֤ים הַרְפֵּֽה לָ/הּ֙ כִּֽי נַפְשָׁ֣/הּ מָֽרָה לָ֔/הּ וַֽ/יהוָה֙ הֶעְלִ֣ים מִמֶּ֔/נִּי וְ/לֹ֥א הִגִּ֖יד לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
translation:
  language: ml
  text: 'അവൾ മലയിൽ ദൈവപുരുഷന്റെ അടുക്കൽ എത്തിയപ്പോൾ[a] അവന്റെ കാലുകൾ മുറുകെപ്പിടിച്ചു. അവളെ തള്ളിമാറ്റാൻ ഗേഹസി അടുത്തുവന്നു. എന്നാൽ ദൈവപുരുഷൻ പറഞ്ഞു: “അവളെ വിട്ടേക്കൂ. അവളുടെ ഉള്ളിൽ കടുത്ത വ്യഥയുണ്ട്[b]. യഹ്‌വെ അത് എന്നിൽനിന്ന് മറച്ചുവെച്ചിരിക്കുന്നു; എന്നോട് അറിയിച്ചിട്ടുമില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മലയിലേക്കു.”'
    reason: എബ്രായ אֶל സന്ദർഭത്തിൽ ലക്ഷ്യസ്ഥാനത്തെയോ അവിടേക്കുള്ള ചലനത്തെയോ സൂചിപ്പിക്കാം.
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: “അവളുടെ പ്രാണൻ അവൾക്കു കയ്പേറിയിരിക്കുന്നു”; ഇത് കടുത്ത ആന്തരിക വ്യഥയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: മുഖ്യപാഠം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രയോഗത്തിന്റെ അർഥം നൽകുന്നു; അടിക്കുറിപ്പ് എബ്രായത്തിലെ ‘പ്രാണൻ’ എന്നും ‘കയ്പ്’ എന്നും ഉള്ള രൂപകം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന എബ്രായ പദവിയുടെ രൂപകം നിലനിർത്തുന്ന, മലയാളത്തിൽ മനസ്സിലാകുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: אֶל הָהָר
  choice: മലയിൽ
  rationale: അവൾ എലീശാ ഉണ്ടായിരുന്ന മലയിൽ എത്തുന്നതാണ് സന്ദർഭം; ലക്ഷ്യസ്ഥലത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  choice: അവന്റെ കാലുകൾ മുറുകെപ്പിടിച്ചു
  rationale: חזק എന്ന ക്രിയയിലെ ഉറച്ച പിടിത്തവും പ്രവൃത്തിയുടെ അടിയന്തരതയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְהָדְפָהּ
  choice: അവളെ തള്ളിമാറ്റാൻ
  rationale: ബലമായി അകറ്റാനുള്ള ശ്രമത്തെ വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַרְפֵּה לָהּ
  choice: അവളെ വിടൂ
  rationale: അവളിൽ ഇടപെടുന്നത് നിർത്താൻ ഗേഹസിയോടുള്ള കല്പന സന്ദർഭോചിതമായി അറിയിക്കുന്നു.
- source_word: נַפְשָׁהּ מָרָה לָהּ
  choice: അവളുടെ ഉള്ളം കയ്പേറിയിരിക്കുന്നു
  rationale: נפשׁ സൂചിപ്പിക്കുന്ന ആന്തരിക വ്യക്തിത്വവും ‘കയ്പ്’ എന്ന എബ്രായ ദൃശ്യവും നിലനിർത്തി കടുത്ത ആന്തരിക വ്യഥ പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: הֶעְלִים מִמֶּנִּי
  choice: അത് എന്നിൽനിന്ന് മറച്ചുവെച്ചിരിക്കുന്നു
  rationale: കാര്യം ദൈവം എലീശായ്ക്ക് വെളിപ്പെടുത്തിയില്ലെന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְלֹא הִגִּיד לִי
  choice: എന്നോട് അറിയിച്ചിട്ടുമില്ല
  rationale: മുൻ വാക്യഭാഗത്തോടുള്ള സമാന്തരതയും ഇതുവരെ വെളിപ്പെടുത്തപ്പെട്ടിട്ടില്ലെന്ന പ്രസക്തിയും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു.
- issue: נֶפֶשׁ എന്ന മനുഷ്യശാസ്ത്രപരമായ പദം
  choice: അവളുടെ ഉള്ളം കയ്പേറിയിരിക്കുന്നു
  alternative: അവൾ കടുത്ത ദുഃഖത്തിലാണ് / അവളുടെ പ്രാണൻ അവൾക്കു കയ്പേറിയിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘പ്രാണൻ’ ഇവിടെ അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമാണ്; ‘ഉള്ളം’ ആന്തരിക വ്യഥയെ പ്രകടിപ്പിക്കുമ്പോൾ ‘കയ്പ്’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു.
- issue: എലീശായ്ക്ക് കാര്യം അറിയിക്കപ്പെടാതിരുന്നത്
  choice: യഹ്‌വെ അത് എന്നിൽനിന്ന് മറച്ചുവെച്ചിരിക്കുന്നു; എന്നോട് അറിയിച്ചിട്ടുമില്ല
  alternative: യഹ്‌വെ അത് എന്നിൽനിന്ന് മറച്ചു
  rationale: ദൈവിക വെളിപ്പെടുത്തലിന്റെ പരിധിയെക്കുറിച്ചുള്ള വാക്യത്തിന്റെ തുറന്ന പ്രസ്താവന വിശദീകരിച്ചോ ലഘൂകരിച്ചോ മാറ്റാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. വിവരണത്തിൽ ലളിതമായ ഭൂതകാലവും സംഭാഷണത്തിൽ സ്വാഭാവികമായ കല്പനാരൂപവും ഉപയോഗിച്ചു; എബ്രായത്തിലെ ‘കയ്പ്’ എന്ന രൂപകം നിലനിർത്തി.
