  yaml_path: translation/ot/2_kings/004/007.yaml
  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
translation:
  language: ml
  text: 'പിന്നെ അവൾ ദൈവപുരുഷന്റെ അടുക്കൽ ചെന്ന് വിവരം അറിയിച്ചു. അദ്ദേഹം പറഞ്ഞു: “പോയി എണ്ണ വിറ്റ് നിന്റെ കടങ്ങൾ[a] വീട്ടുക; ശേഷിക്കുന്നതുകൊണ്ട് നീയും നിന്റെ പുത്രന്മാരും ജീവിക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിനക്കു കടം കൊടുത്തവനു പണം കൊടുക്കുക.” മൂലരൂപം ബാധ്യതയെയാണോ പണം ലഭിക്കേണ്ട വ്യക്തിയെയാണോ സൂചിപ്പിക്കുന്നത് എന്നതനുസരിച്ചുള്ള മറ്റൊരു പരിഭാഷ.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ശേഷിപ്പുകൊണ്ട് നീയും നിന്റെ പുത്രന്മാരും ജീവിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא וַתַּגֵּד
  choice: ചെന്ന് വിവരം അറിയിച്ചു
  rationale: തുടർച്ചയായ ഈ ക്രിയകൾ ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം നിലനിർത്താൻ ‘ചെന്ന് വിവരം അറിയിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷന്റെ അടുക്കൽ
  rationale: എബ്രായ ശീർഷകത്തിന്റെ അക്ഷരാർഥമായ ‘ദൈവപുരുഷൻ’ നിലനിർത്തുന്നു; ‘പ്രവാചകൻ’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: מִכְרִי אֶת־הַשֶּׁמֶן
  choice: എണ്ണ വിറ്റ്
  rationale: שֶׁמֶן എന്നത് സന്ദർഭത്തിൽ സസ്യഎണ്ണയെയോ ഒലിവെണ്ണയെയോ സൂചിപ്പിക്കാമെങ്കിലും, മൂലപാഠം വ്യക്തമാക്കുന്നതിലധികം പ്രത്യേകത ചേർക്കാതെ ‘എണ്ണ’ എന്നു നൽകി.
- source_word: וְשַׁלְּמִי אֶת־נִשְׁיֵךְ
  choice: നിന്റെ കടങ്ങൾ വീട്ടുക
  rationale: സാമ്പത്തിക സന്ദർഭത്തിൽ שׁלם കടം തീർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. നാമരൂപത്തെ ബാധ്യതകളായി എടുത്ത് ബഹുവചനസൂചന നിലനിർത്തി; വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ‘കടക്കാരൻ/കടം കൊടുത്തവൻ’ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וְאַתְּ וּבָנַיִךְ
  choice: നീയും നിന്റെ പുത്രന്മാരും
  rationale: בנים ഇവിടെ വ്യക്തമായി ‘പുത്രന്മാർ’ എന്നാണ്; പൊതുവായ ‘മക്കൾ’ എന്ന് മാറ്റാതെ ലിംഗസൂചന സംരക്ഷിച്ചു.
- source_word: תִּחְיִי בַּנּוֹתָר
  choice: ശേഷിക്കുന്നതുകൊണ്ട് … ജീവിക്കുക
  rationale: ശേഷിച്ച തുക അവരുടെ ഉപജീവനത്തിനായിരിക്കുമെന്ന ഫലവും നിർദേശസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥഘടന അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
