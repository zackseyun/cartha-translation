  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ദൈവപുരുഷൻ’ എന്ന പരമ്പരാഗതവും സുതാര്യവുമായ പദപ്രയോഗം നിലനിർത്തി; കടത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിലെ സാധ്യതയുള്ള അർഥഭേദം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
