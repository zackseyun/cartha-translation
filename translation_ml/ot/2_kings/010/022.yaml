  text: וַ/יֹּ֗אמֶר לַֽ/אֲשֶׁר֙ עַל הַ/מֶּלְתָּחָ֔ה הוֹצֵ֣א לְב֔וּשׁ לְ/כֹ֖ל עֹבְדֵ֣י הַ/בָּ֑עַל וַ/יֹּצֵ֥א לָ/הֶ֖ם הַ/מַּלְבּֽוּשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/022.yaml
  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
translation:
  language: ml
  text: അവൻ വസ്ത്രസംഭരണശാലയുടെ ചുമതലക്കാരനോട്, “ബാലിന്റെ എല്ലാ ആരാധകർക്കും[b] വസ്ത്രങ്ങൾ[a] പുറത്തുകൊണ്ടുവരിക” എന്നു പറഞ്ഞു. അങ്ങനെ അവൻ അവർക്കായി വസ്ത്രങ്ങൾ പുറത്തുകൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിൽ ‘ഉടുപ്പുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ബാലിന്റെ ആരാധകർ’ എന്നത് അക്ഷരാർഥത്തിൽ ‘ബാലിന്റെ സേവകർ’ എന്നാണ്; ആരാധനയിൽ ബാലിന്റെ സേവനത്തിനായി സമർപ്പിതരായവരെയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְתָּחָה
  choice: വസ്ത്രസംഭരണശാല
  rationale: വസ്ത്രങ്ങളുമായി ബന്ധപ്പെട്ട സംഭരണസ്ഥലത്തെയോ വിഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വസ്ത്രശാല’ എന്നത് ആധുനിക മലയാളത്തിൽ വസ്ത്രവ്യാപാരസ്ഥാപനം എന്നും ധരിക്കപ്പെടാം; അതിനാൽ ‘വസ്ത്രസംഭരണശാല’ സന്ദർഭം കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  choice: വസ്ത്രസംഭരണശാലയുടെ ചുമതലക്കാരനോട്
  rationale: ‘അതിന്റെ മേൽ ഉണ്ടായിരുന്നവൻ’ എന്ന എബ്രായ ഭരണപര പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הוֹצֵא
  choice: പുറത്തുകൊണ്ടുവരിക
  rationale: יצא എന്ന ക്രിയയുടെ കാരണകർത്തൃ ആജ്ഞാരൂപം; സംഭരണസ്ഥലത്തുനിന്ന് വസ്ത്രങ്ങൾ കൊണ്ടുവരാനുള്ള കല്പനയെ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: לְבוּשׁ / הַמַּלְבּוּשׁ
  choice: വസ്ത്രങ്ങൾ
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപങ്ങൾ ഇവിടെ സമൂഹവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു. മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികവും വിതരണസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: עֹבְדֵי הַבָּעַל
  choice: ബാലിന്റെ ആരാധകർ
  rationale: עבד എന്ന പദത്തിന് ‘ദാസൻ/സേവകൻ’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും ദൈവാരാധനാസന്ദർഭത്തിൽ ഒരു ദേവനെ ആരാധനാപൂർവം സേവിക്കുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആരാധകർ’ ആ അർഥം സാധാരണ വായനക്കാർക്ക് നേരിട്ട് നൽകുന്നു.
- source_word: וַיֹּצֵא לָהֶם הַמַּלְבּוּשׁ
  choice: അങ്ങനെ അവൻ അവർക്കായി വസ്ത്രങ്ങൾ പുറത്തുകൊണ്ടുവന്നു
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും സമൂഹവാചകമായ നാമത്തിന്റെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘വസ്ത്രശാല’ എന്നതിന്റെ വ്യാപാരസ്ഥാപനസൂചന ഒഴിവാക്കാൻ ‘വസ്ത്രസംഭരണശാല’ ഉപയോഗിച്ചു; എബ്രായത്തിലെ സമൂഹവാചക ഏകവചനങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകി.
