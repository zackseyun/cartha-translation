  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അവരെ ജീവനോടെ പിടിക്കുവിൻ.” അങ്ങനെ അവർ അവരെ ജീവനോടെ പിടിച്ചു; ബേത്ത്-ഏക്കെദിലെ[a] കുഴിക്കരികിൽ വെച്ച്[b] നാല്പത്തിരണ്ടു പുരുഷന്മാരെയും അറുത്തുകൊന്നു. അവരിൽ ഒരുവനെയും അവൻ ശേഷിപ്പിച്ചില്ല.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബേത്ത്-ഏക്കെദ് ഒരു സ്ഥലനാമമാണ്. അതിന് ‘കെട്ടുന്ന/കൂട്ടിച്ചേർക്കുന്ന വീട്’ എന്നതുപോലുള്ള അടിസ്ഥാനാർഥം ഉണ്ടായിരിക്കാമെങ്കിലും ഇവിടെ അത് സ്ഥലനാമമായിട്ടാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: ‘കുഴിക്കരികിൽ വെച്ച്’ എന്നതിന് ‘കുഴിയിൽ വെച്ച്’ അല്ലെങ്കിൽ ‘കുഴിയിലേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെയുള്ള എബ്രായ മുൻപ്രത്യയം ഒന്നിലധികം സ്ഥലബന്ധങ്ങൾ സൂചിപ്പിക്കാൻ കഴിയും.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘അവരിൽ ഒരു പുരുഷനെയും അവൻ ശേഷിപ്പിച്ചില്ല’; ആരും രക്ഷപ്പെട്ടില്ലെന്നതിന് ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם
  choice: അവരെ പിടിക്കുവിൻ
  rationale: תפשׂ എന്ന ക്രിയയുടെ ‘പിടിക്കുക/കൈയടക്കുക’ എന്ന അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള ‘ജീവനോടെ’ എന്നത് ഉടൻ കൊല്ലാതെ പിടിക്കണമെന്ന കല്പന വ്യക്തമാക്കുന്നു.
- source_word: חַיִּים
  choice: ജീവനോടെ
  rationale: കല്പനയിലും അതിന്റെ നിർവഹണത്തിലും ഈ പദം ക്രിയാവിശേഷണപരമായി വരുന്നു; അതിനാൽ ‘ജീവനോടെ’ എന്നത് കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּשְׁחָטוּם
  choice: അറുത്തുകൊന്നു
  rationale: שׁחט ഒരു പൊതുവായ ‘കൊല്ലുക’ എന്നതിനെക്കാൾ ശക്തവും അറുക്കലിനെ സൂചിപ്പിക്കുന്നതുമായ ക്രിയയാണ്; സംഭവത്തിന്റെ ക്രൂരത മയപ്പെടുത്താതെ മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: אֶל־בּוֹר
  choice: കുഴിക്കരികിൽവെച്ച്
  rationale: אֶל സാധാരണയായി ദിശയെയോ സമീപനത്തെയോ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഇവിടെ വധം നടന്ന സ്ഥലബന്ധം ഉദ്ദേശിക്കാം. ‘കുഴിക്കരികിൽവെച്ച്’ സ്വാഭാവികമായ വായനയാണ്; ‘കുഴിയിൽവെച്ച്/കുഴിയിലേക്ക്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בֵּית עֵקֶד
  choice: ബേത്ത്-ഏക്കെദ്
  rationale: ഇവിടെ ഇത് ഒരു സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אַרְבָּעִים וּשְׁנַיִם אִישׁ
  choice: നാല്പത്തിരണ്ടു പുരുഷന്മാർ
  rationale: אִישׁ ഇവിടെ എണ്ണപ്പെടുന്ന പ്രായപൂർത്തിയായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു; ‘പുരുഷന്മാർ’ ലിംഗസൂചനയും സ്വാഭാവിക മലയാളവും നിലനിർത്തുന്നു.
- source_word: וְלֹא הִשְׁאִיר אִישׁ מֵהֶם
  choice: അവരിൽ ഒരുവനെയും അവൻ ശേഷിപ്പിച്ചില്ല
  rationale: ഏകവചന ക്രിയയുടെ കർത്താവായ ‘അവൻ’ നിലനിർത്തുകയും ഒരാൾപോലും ശേഷിച്ചില്ലെന്ന സമ്പൂർണത പ്രകടമാക്കുകയും ചെയ്യുന്നു.
