  text: וַ/יֹּ֨אמֶר֙ תִּפְשׂ֣וּ/ם חַיִּ֔ים וַֽ/יִּתְפְּשׂ֖וּ/ם חַיִּ֑ים וַֽ/יִּשְׁחָט֞וּ/ם אֶל בּ֣וֹר בֵּֽית עֵ֗קֶד אַרְבָּעִ֤ים וּ/שְׁנַ֨יִם֙ אִ֔ישׁ וְ/לֹֽא הִשְׁאִ֥יר אִ֖ישׁ מֵ/הֶֽם־־־׃ס
base_translation:
