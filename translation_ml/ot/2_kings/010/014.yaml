translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. കല്പനയിൽ ‘പിടിക്കുവിൻ’ എന്ന മാന്യമായ ബഹുവചനരൂപവും വിവരണത്തിൽ ലളിതമായ വാക്യഘടനയും ഉപയോഗിച്ചു. ശേഖരണസ്ഥാനത്തിന്റെ സ്ഥലബന്ധത്തിലുള്ള എബ്രായ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
