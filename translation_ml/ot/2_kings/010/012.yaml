    text: ‘ബേത്ത്-ഏക്കെദ്’ എന്ന സ്ഥലനാമത്തിന് ‘ബന്ധിക്കുന്നതിന്റെ വീട്’ എന്നതുപോലുള്ള അർഥമുണ്ടാകാം; ചില വ്യാഖ്യാനങ്ങളിൽ ഇത് ഇടയന്മാർ ആടുകളെ രോമം മുറിക്കാനോ കെട്ടാനോ കൂട്ടിയിരുന്ന സ്ഥലവുമായി ബന്ധിപ്പിക്കുന്നു. ഹീബ്രായത്തിലെ കൃത്യമായ അർഥം അനിശ്ചിതമായതിനാൽ മുഖ്യപാഠത്തിൽ ഇതിനെ സ്ഥലനാമമായിത്തന്നെ നൽകിയിരിക്കുന്നു.
