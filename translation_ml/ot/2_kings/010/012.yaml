  text: പിന്നെ അവൻ എഴുന്നേറ്റ് ശമര്യയിലേക്കു പുറപ്പെട്ടു. വഴിയിൽ, ഇടയന്മാരുടെ ബേത്ത്-ഏക്കെദിൽ[a] അവൻ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
