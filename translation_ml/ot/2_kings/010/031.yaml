  source_fidelity: 'മുഖ്യപരിഭാഷ എബ്രായ പാഠത്തോട് വിശ്വസ്തമാണ്: וְയുടെ സന്ദർഭാനുസൃതമായ വൈരുധ്യം ‘എന്നാൽ’ പ്രകടിപ്പിക്കുന്നു; שָׁמַר + infinitive-ന്റെ ശ്രദ്ധാപൂർവമായ അനുസരണാർഥം, ‘പൂർണഹൃദയത്തോടെ,’ യഹോവയുടെ ന്യായപ്രമാണം, യൊരോബെയാം ഇസ്രായേലിനെ പാപം ചെയ്യിച്ചത്, അവന്റെ പാപങ്ങളിൽനിന്ന് യേഹൂ പിന്തിരിയാതിരുന്നത് എന്നിവയെല്ലാം ശരിയായി പ്രതിഫലിക്കുന്നു. ചെറിയ ക്രമീകരണം എബ്രായത്തിലെ ‘ന്യായപ്രമാണത്തിൽ നടക്കുക’ എന്ന രൂപകത്തോട് കൂടുതൽ അടുത്തും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.'
  naturalness: ‘ന്യായപ്രമാണത്തിൽ ... നടക്കാൻ’ എന്ന പ്രയോഗം തിരുവെഴുത്തുരൂപകം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളമാണ്. നിലവിലെ അടിക്കുറിപ്പ് a-യിലെ ‘നടക്കുന്നത് അവൻ പാലിച്ചില്ല’ എന്ന പ്രയോഗം അസ്വാഭാവികവും ആശയപരമായി മങ്ങിയതുമാണ്; അത് വ്യക്തതയ്ക്കായി തിരുത്തുന്നു.
  terminology: ‘യേഹൂ,’ ‘യൊരോബെയാം,’ ‘യഹോവ,’ ‘ന്യായപ്രമാണം,’ ‘പാപങ്ങൾ’ എന്നീ പദങ്ങൾ സ്ഥിരതയോടെയും ഉചിതമായ ഗൗരവമുള്ള ശൈലിയോടെയും ഉപയോഗിച്ചിരിക്കുന്നു. ‘യഹോവ’ എന്ന നാമപ്രയോഗം നൽകിയിരിക്കുന്ന പദ്ധതിയുടെ നാമനയത്തോടു യോജിക്കുന്നു.
