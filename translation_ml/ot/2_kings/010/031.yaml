id: 2KI.10.31
reference: 2 Kings 10:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֵה֗וּא לֹ֥א שָׁמַ֛ר לָ/לֶ֛כֶת בְּ/תֽוֹרַת יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בְּ/כָל לְבָב֑/וֹ לֹ֣א סָ֗ר מֵ/עַל֙ חַטֹּ֣אות יָֽרָבְעָ֔ם אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
translation:
  language: ml
  text: എന്നാൽ യേഹൂ ഇസ്രായേലിന്റെ ദൈവമായ യഹോവയുടെ ന്യായപ്രമാണത്തിൽ തന്റെ പൂർണഹൃദയത്തോടെ നടക്കാൻ ശ്രദ്ധിച്ചില്ല.[a] യൊരോബെയാം ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച പാപങ്ങളിൽനിന്ന് അവൻ പിന്തിരിഞ്ഞില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയുടെ ന്യായപ്രമാണത്തിൽ നടക്കുന്നതിൽ അവൻ ജാഗ്രത പുലർത്തിയില്ല.’ എബ്രായ ക്രിയ ശ്രദ്ധാപൂർവമായ അനുഷ്ഠാനത്തിന് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: രാജാക്കന്മാരുടെ പുസ്തകങ്ങളിൽ ആവർത്തിച്ചുവരുന്ന ഈ പ്രയോഗം യൊരോബെയാം സ്ഥാപിച്ച വിഗ്രഹാരാധനാസമ്പ്രദായത്തോടു ബന്ധപ്പെട്ട മതപരമായ പാപങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: שָׁמַר לָלֶכֶת
  choice: നടക്കാൻ ശ്രദ്ധിച്ചില്ല
  rationale: שׁמר + infinitive എന്ന ഘടന ശ്രദ്ധാപൂർവമായ അനുസരണത്തെ സൂചിപ്പിക്കുന്നു. 'ശ്രദ്ധിച്ചില്ല' എന്നത് വെറും അനുസരണക്കേടിനപ്പുറം വേണ്ട ജാഗ്രത കാണിക്കാത്തതും വ്യക്തമാക്കുന്നു.
- source_word: לָלֶכֶת
  choice: നടക്കാൻ
  rationale: പെരുമാറ്റത്തെയും ജീവിതരീതിയെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; മലയാള ബൈബിൾ ശൈലിയിലും ഇത് ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: תּוֹרַת
  choice: ന്യായപ്രമാണം
  rationale: ഇവിടെ യഹോവയുടെ ഉടമ്പടിസംബന്ധമായ നിയമവും ഉപദേശവും ഉദ്ദേശിക്കപ്പെടുന്നു; 'ന്യായപ്രമാണം' ആ സന്ദർഭാർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּכָל לְבָבוֹ
  choice: തന്റെ പൂർണഹൃദയത്തോടെ
  rationale: സമ്പൂർണമായ ആന്തരിക സമർപ്പണം സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: סָר מֵעַל
  choice: പാപങ്ങളിൽനിന്ന് ... പിന്തിരിഞ്ഞില്ല
  rationale: ഒന്നിൽനിന്ന് വിട്ടുമാറുകയോ തിരിഞ്ഞുപോകുകയോ ചെയ്യുക എന്ന അർത്ഥം മത-ധാർമിക സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חַטֹּאות
  choice: പാപങ്ങൾ
  rationale: എബ്രായ ബഹുവചനം നേരിട്ട് നിലനിർത്തുകയും രാജാക്കന്മാരിൽ ആവർത്തിക്കുന്ന യൊരോബെയാമിന്റെ മതപരമായ ലംഘനങ്ങളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകഭാവം ചുരുക്കമായും നേരിട്ടും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְיֵהוּא
  choice: എന്നാൽ യേഹൂ
  rationale: മുൻസന്ദർഭത്തിലെ ബാൽവിരുദ്ധ നടപടികളോടുള്ള വൈരുധ്യം ബന്ധകം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേഹൂവിന്റെ ഉടമ്പടിവിശ്വസ്തതയെക്കുറിച്ചുള്ള വിലയിരുത്തൽ
  choice: മുൻപ് നടത്തിയ പരിഷ്കാരങ്ങൾ ഉണ്ടായിരുന്നിട്ടും യേഹൂ പൂർണഹൃദയത്തോടെയുള്ള അനുസരണത്തിൽ പരാജയപ്പെട്ടതായി വാക്യം അവതരിപ്പിക്കുന്നു.
  alternative: ഇത് വ്യക്തിപരമായ ഭക്തിയെക്കാൾ അപൂർണമായ രാഷ്ട്രീയ പരിഷ്കാരത്തെ മാത്രം വിമർശിക്കുന്നു എന്ന വായന.
  rationale: '''പൂർണഹൃദയത്തോടെ'' എന്നും ''യൊരോബെയാമിന്റെ പാപങ്ങളിൽനിന്ന് ... പിന്തിരിഞ്ഞില്ല'' എന്നും ഉള്ള വാക്യങ്ങൾ ഉടമ്പടിപരവും ധാർമിക-മതപരവുമായ വിലയിരുത്തലാണ് നൽകുന്നത്. പരിഭാഷ ഈ സംഘർഷം നിലനിർത്തുന്നു; പാഠം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.'
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. 'നടക്കുക' എന്ന തിരുവെഴുത്തുരൂപകം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. ദൈവനാമം 'യഹോവ' എന്നും രാജനാമങ്ങൾ 'യേഹൂ', 'യൊരോബെയാം' എന്നും നൽകിയിരിക്കുന്നു.
