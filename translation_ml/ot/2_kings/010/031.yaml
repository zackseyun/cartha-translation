revisions:
- from: എന്നാൽ യേഹൂ തന്റെ പൂർണഹൃദയത്തോടെ ഇസ്രായേലിന്റെ ദൈവമായ യഹോവയുടെ ന്യായപ്രമാണമനുസരിച്ച് നടക്കാൻ ശ്രദ്ധിച്ചില്ല.[a] ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച യൊരോബെയാമിന്റെ പാപങ്ങളിൽനിന്ന് അവൻ പിന്തിരിഞ്ഞില്ല.[b]
  to: എന്നാൽ യേഹൂ ഇസ്രായേലിന്റെ ദൈവമായ യഹോവയുടെ ന്യായപ്രമാണത്തിൽ തന്റെ പൂർണഹൃദയത്തോടെ നടക്കാൻ ശ്രദ്ധിച്ചില്ല.[a] യൊരോബെയാം ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച പാപങ്ങളിൽനിന്ന് അവൻ പിന്തിരിഞ്ഞില്ല.[b]
  rationale: പ്രധാനവാക്യത്തിലെ പദക്രമം ‘ന്യായപ്രമാണത്തിൽ നടക്കുക’ എന്ന എബ്രായ രൂപകത്തെ കൂടുതൽ അടുത്ത് പ്രതിഫലിപ്പിക്കാനായി ക്രമപ്പെടുത്തി. യൊരോബെയാമിന്റെ കാരകപ്രവൃത്തി പാപങ്ങളോടുള്ള ബന്ധത്തിൽ വ്യക്തമായി കാണിക്കുന്നതിന് ആ വാക്യഭാഗവും സ്വാഭാവികമായി പുനഃക്രമീകരിച്ചു. ഘടനാപരമായോ അർഥപരമായോ മാറ്റമില്ല; അടിക്കുറിപ്പ് a മാത്രം സ്വാഭാവികവും വ്യക്തവുമായ ബദൽവാചകമായി പരിഷ്കരിച്ചു.
