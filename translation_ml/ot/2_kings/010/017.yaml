  yaml_path: translation/ot/2_kings/010/017.yaml
  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
translation:
  language: ml
  text: അവൻ ശമര്യയിൽ എത്തിയപ്പോൾ, ശമര്യയിൽ ആഹാബിന് അവശേഷിച്ചിരുന്ന എല്ലാവരെയും വധിച്ചു; അവരെ പൂർണമായി നശിപ്പിക്കുന്നതുവരെ[a], യഹോവ ഏലിയാവിനോടു പറഞ്ഞ വചനപ്രകാരം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിനെ പൂർണമായി നശിപ്പിക്കുന്നതുവരെ.” എബ്രായത്തിലെ പ്രത്യയം ഏകവചനമാണ്; അത് ആഹാബിന്റെ ഭവനത്തെ ഒരു സമഗ്രഘടകമായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: അവൻ ശമര്യയിൽ എത്തിയപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; പിന്നാലെയുള്ള പ്രവൃത്തിയുമായുള്ള സമയബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַיַּךְ
  choice: വധിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ נכה മാരകമായ ആക്രമണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വധിച്ചു’ അതിന്റെ ഗൗരവവും ഫലവും വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל הַנִּשְׁאָרִים לְאַחְאָב
  choice: ആഹാബിനോടു ബന്ധപ്പെട്ട് ... ശേഷിച്ചിരുന്ന എല്ലാവരെയും
  rationale: לְאַחְאָב ബന്ധമോ ചേർച്ചയോ സൂചിപ്പിക്കുന്നു. ‘കുടുംബം’ എന്നു മാത്രം ചുരുക്കാതെ ആഹാബിന്റെ വംശത്തോടും ഭവനത്തോടും പക്ഷത്തോടും ബന്ധപ്പെട്ടവരെ ഉൾക്കൊള്ളാവുന്ന മൂലപാഠത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: עַד הִשְׁמִידוֹ
  choice: അവരെ പൂർണമായി നശിപ്പിക്കുന്നതുവരെ
  rationale: שׁמד സമൂലനാശത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ബഹുവചന സർവനാമം മുൻപുള്ള ‘എല്ലാവരെയും’ സ്വാഭാവികമായി പിന്തുടരുന്നു; എബ്രായത്തിലെ ഏകവചന പ്രത്യയത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כִּדְבַר יְהוָה
  choice: യഹോവ ... പറഞ്ഞ വചനം
  rationale: דבר എന്ന പ്രവചനനിവൃത്തി സൂത്രവാക്യത്തിന്റെ ‘വചനം’ എന്ന ആശയം നിലനിർത്തുകയും יהוה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു നേരിട്ട് നൽകുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר דִּבֶּר אֶל אֵלִיָּהוּ
  choice: ഏലിയാവിനോടു പറഞ്ഞ
  rationale: ബന്ധവാക്യത്തിന്റെ നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വരുന്ന ദൈവത്തിന്റെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നൽകുന്നു.
- issue: ആഹാബുമായി ബന്ധപ്പെട്ട ശേഷിപ്പിന്റെ പരിധി
  choice: ആഹാബിനോടു ബന്ധപ്പെട്ട് ശേഷിച്ചിരുന്ന എല്ലാവരും
  alternative: ആഹാബിന്റെ കുടുംബത്തിൽ ശേഷിച്ചിരുന്ന എല്ലാവരും
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ബന്ധം നിലനിർത്തുന്നു; ‘കുടുംബം’ എന്നു മാത്രം പറഞ്ഞ് വംശമോ ഭവനമോ അനുയായികളോ എന്ന സാധ്യത അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- issue: הִשְׁמִידוֹ എന്നതിലെ ഏകവചന പ്രത്യയം
  choice: പ്രധാനവാക്യത്തിൽ മുൻപുള്ള ആളുകളെ സൂചിപ്പിക്കുന്ന ബഹുവചനമായി നൽകി, ഏകവചനസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി
  alternative: ‘അതിനെ നശിപ്പിക്കുന്നതുവരെ’—ആഹാബിന്റെ ഭവനത്തെ ഒരു സമഗ്രഘടകമായി സൂചിപ്പിക്കൽ
  rationale: വാക്യത്തിന്റെ സ്വാഭാവിക മലയാളവായന നിലനിർത്തുമ്പോഴും മൂലപാഠത്തിലെ വ്യാകരണപരമായ സംഘർഷവും കൂട്ടായ ഏകവചനവായനയും മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വചനം നിറവേറി’ എന്ന അവസാനവാക്യം ഹീബ്രുവിലെ ‘യഹോവയുടെ വചനപ്രകാരം’ എന്ന ഫലബന്ധം വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു; പ്രവചനനിവൃത്തിയുടെ ആശയം അധികമായി വികസിപ്പിക്കുന്നില്ല.
