  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
translation:
  language: ml
  text: അങ്ങനെ യേഹൂ യിസ്രെയേലിൽ ആഹാബിന്റെ വംശത്തിൽ ശേഷിച്ചിരുന്ന എല്ലാവരെയും, ആഹാബിന്റെ സകല പ്രമുഖരെയും[a], അടുപ്പക്കാരെയും[b], പുരോഹിതന്മാരെയും വധിച്ചു; അവന് ഒരു ശേഷിപ്പുപോലും ബാക്കിവെച്ചില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രഭുക്കന്മാരെയും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പരിചിതരെയും’ അല്ലെങ്കിൽ ‘അന്തരംഗികളെയും.’
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘അവന് ഒരു ശേഷിപ്പിനെയും ബാക്കിവെച്ചില്ല.’ ഇവിടെ ‘അവന്’ എന്നത് ആഹാബിനെയോ ആഹാബിന്റെ വംശത്തെയോ സൂചിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  choice: വധിച്ചു
  rationale: ഈ വിവരണസന്ദർഭത്തിൽ נכה മാരകമായ പ്രഹരത്തെയും കൊലപ്പെടുത്തലിനെയും സൂചിപ്പിക്കുന്നു. ‘വധിച്ചു’ എന്നത് അർത്ഥത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַנִּשְׁאָרִים
  choice: ശേഷിച്ചിരുന്ന എല്ലാവരെയും
  rationale: שׁאר എന്ന ധാതുവിൽനിന്നുള്ള ഈ പദം ജീവനോടെ ശേഷിച്ചവരെ സൂചിപ്പിക്കുന്നു. ക്രിയാവിശേഷണ ഉപവാക്യരൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לְבֵית אַחְאָב
  choice: ആഹാബിന്റെ വംശത്തിൽ
  rationale: בֵּית ഇവിടെ ഒരു കെട്ടിടത്തെയല്ല, ആഹാബിന്റെ രാജകുടുംബത്തെയും വംശപരമ്പരയെയും സൂചിപ്പിക്കുന്നു. ‘വംശം’ ഈ രാജവംശീയ അർത്ഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: בְּיִזְרְעֶאל
  choice: യിസ്രെയേലിൽ
  rationale: നഗരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനവാചക പ്രയോഗം മലയാളത്തിൽ ‘-യിൽ’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി വരുന്നു.
- source_word: גְּדֹלָיו
  choice: അവന്റെ സകല പ്രമുഖരെയും
  rationale: ഈ പദം ആഹാബിനോടു ബന്ധപ്പെട്ട സാമൂഹികമായോ രാഷ്ട്രീയമായോ ഉന്നതസ്ഥാനക്കാരെ സൂചിപ്പിക്കുന്നു. ‘പ്രമുഖർ’ അർത്ഥം വ്യക്തമായി നൽകുന്നു; ‘പ്രഭുക്കന്മാർ’ എന്നതും സാധ്യമാണ്.
- source_word: מְיֻדָּעָיו
  choice: അടുത്ത പരിചയക്കാരെയും
  rationale: ידע-യിൽനിന്നുള്ള ഈ രൂപം ഒരാൾക്ക് പരിചിതരായവരെയോ അടുപ്പമുള്ളവരെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ ബന്ധപരവും രാഷ്ട്രീയവുമായ അടുപ്പം ‘അടുത്ത പരിചയക്കാർ’ സംരക്ഷിക്കുന്നു.
- source_word: כֹהֲנָיו
  choice: അവന്റെ പുരോഹിതന്മാരെയും
  rationale: ഹീബ്രുവിന്റെ നേരായ അർത്ഥം ‘അവന്റെ പുരോഹിതന്മാർ’ എന്നാണ്; അതിനെ കൂടുതൽ ചുരുക്കിയോ പ്രത്യേക വിഭാഗമായി വ്യാഖ്യാനിച്ചോ മാറ്റേണ്ടതില്ല.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: അവന് ഒരു ശേഷിപ്പുപോലും ബാക്കിവെച്ചില്ല
  rationale: ഈ പ്രയോഗം സമ്പൂർണ നശീകരണത്തെ സൂചിപ്പിക്കുന്നു. לוֹ എന്ന ഏകവചന സർവനാമത്തിന്റെ ചുരുക്കരൂപം ‘അവന്’ എന്നു നിലനിർത്തിയിരിക്കുന്നു; ശൈലീസ്വാഭാവികതയ്ക്കായി ഫലവാക്യമായി അവതരിപ്പിച്ചു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ לוֹ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ‘അവന്’ എന്നു നിലനിർത്തി; സന്ദർഭത്തിൽ ആഹാബിനെയോ ആഹാബിന്റെ വംശത്തെയോ സൂചിപ്പിക്കുന്നു
  alternative: ‘ആഹാബിന്’ എന്നു വ്യക്തമായി വികസിപ്പിക്കുക, അല്ലെങ്കിൽ വംശത്തെ സൂചിപ്പിച്ച് ‘അതിന്’ എന്നു വിവർത്തനം ചെയ്യുക
  rationale: ഹീബ്രു ഏകവചന സർവനാമത്തിന്റെ സൂചിതൻ ചുരുക്കമായും അല്പം ദ്വയാർഥമായും നിലകൊള്ളുന്നു. ‘അവന്’ എന്ന വിവർത്തനം മൂലരൂപവും അതിലെ അർത്ഥസമ്മർദവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. രാജവംശീയ ‘ഭവനം’ എന്ന ഹീബ്രു പ്രയോഗം തെറ്റായി കെട്ടിടമെന്നു വായിക്കപ്പെടാതിരിക്കാൻ ‘വംശം’ എന്നു വ്യക്തമാക്കി. അതേസമയം അവസാന സർവനാമത്തിലെ യഥാർഥ ദ്വയാർഥത അടിക്കുറിപ്പോടെ നിലനിർത്തി.
