  text: וַ/יֵּ֣לֶךְ מִ/שָּׁ֡ם וַ/יִּמְצָ֣א אֶת יְהוֹנָדָב֩ בֶּן רֵכָ֨ב לִ/קְרָאת֜/וֹ וַֽ/יְבָרְכֵ֗/הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו הֲ/יֵ֧שׁ אֶת לְבָבְ/ךָ֣ יָשָׁ֗ר כַּ/אֲשֶׁ֤ר לְבָבִ/י֙ עִם לְבָבֶ֔/ךָ וַ/יֹּ֨אמֶר יְהוֹנָדָ֥ב יֵ֛שׁ וָ/יֵ֖שׁ תְּנָ֣/ה אֶת יָדֶ֑/ךָ וַ/יִּתֵּ֣ן יָד֔/וֹ וַ/יַּעֲלֵ֥/הוּ אֵלָ֖י/ו אֶל הַ/מֶּרְכָּבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/015.yaml
  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
translation:
  language: ml
  text: 'അവൻ അവിടെനിന്ന് യാത്ര തുടർന്നു. അവനെ എതിരേൽക്കാൻ വന്ന രേഖാബിന്റെ മകനായ യെഹോനാദാബിനെ അവൻ കണ്ടു. അവൻ യെഹോനാദാബിനെ അഭിവാദ്യംചെയ്ത് അവനോടു ചോദിച്ചു[a]: “എന്റെ ഹൃദയം നിന്റെ ഹൃദയത്തോടൊപ്പമിരിക്കുന്നതുപോലെ, നിന്റെ ഹൃദയം നേരായതാണോ?”[b] യെഹോനാദാബ് പറഞ്ഞു: “അതെ, അതെ.”[c] അപ്പോൾ അവൻ പറഞ്ഞു: “നിന്റെ കൈ എനിക്കു തരിക.” യെഹോനാദാബ് തന്റെ കൈ അവനു കൊടുത്തു; അവൻ യെഹോനാദാബിനെ തന്റെ അടുക്കലേക്കു രഥത്തിൽ കയറ്റി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ അനുഗ്രഹിച്ചു.” എബ്രായ ക്രിയയ്ക്ക് ‘അനുഗ്രഹിക്കുക’ എന്നർഥമുണ്ടെങ്കിലും, ഈ കൂടിക്കാഴ്ചാസന്ദർഭത്തിൽ അത് അഭിവാദനം സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “എന്റെ ഹൃദയം നിന്റെ ഹൃദയത്തോടുകൂടെ ആയിരിക്കുന്നതുപോലെ നിന്റെ ഹൃദയം നേരായതാണോ?” ഈ പ്രയോഗം പരസ്പര നിഷ്ഠയെയോ ലക്ഷ്യത്തിലെ യോജിപ്പിനെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “ഉണ്ട്, ഉണ്ട്”—ഊന്നിപ്പറയുന്ന സമ്മതം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: അവൻ അവിടെനിന്ന് യാത്ര തുടർന്നു
  rationale: הלך എന്ന ക്രിയയും מִשָּׁם എന്ന പ്രയോഗവും മുൻസംഭവത്തിൽനിന്നുള്ള യാത്രയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിൽ അത് വ്യക്തമാക്കുന്നു.
- source_word: וַיִּמְצָא אֶת יְהוֹנָדָב בֶּן רֵכָב לִקְרָאתוֹ
  choice: തന്നെ എതിരേൽക്കാൻ വന്ന രേഖാബിന്റെ മകനായ യെഹോനാദാബിനെ അവൻ കണ്ടു
  rationale: מצא എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘കണ്ടു’ നിലനിർത്തുകയും לִקְרָאתוֹ യിലെ സമീപിച്ചുവരുന്ന കൂടിക്കാഴ്ചയുടെ ഭാവം ‘എതിരേൽക്കാൻ വന്ന’ എന്നു പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְבָרְכֵהוּ
  choice: അവൻ യെഹോനാദാബിനെ അഭിവാദ്യം ചെയ്തു
  rationale: ברך എന്നതിന് ‘അനുഗ്രഹിക്കുക’ എന്നും അർഥമുണ്ടെങ്കിലും, ഈ കൂടിക്കാഴ്ചാസന്ദർഭത്തിൽ അഭിവാദനം ചെയ്യുക എന്ന പ്രയോഗാർഥമാണ് കൂടുതൽ യോജിച്ചത്; മറ്റർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הֲיֵשׁ אֶת לְבָבְךָ יָשָׁר
  choice: നിന്റെ ഹൃദയം പരമാർഥമാണോ?
  rationale: יָשָׁר എന്ന ‘നേരായ/ശരിയായ’ ആശയം ഇവിടെ ആന്തരിക നിഷ്ഠയെയും സത്യസന്ധമായ ഉദ്ദേശ്യത്തെയും സൂചിപ്പിക്കുന്നു. ‘പരമാർഥം’ ഹൃദയത്തിന്റെ സത്യസന്ധതയും വിശ്വസ്തതയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: כַּאֲשֶׁר לְבָבִי עִם לְבָבֶךָ
  choice: എന്റെ ഹൃദയം നിന്റെ ഹൃദയത്തോടുകൂടെ ആയിരിക്കുന്നതുപോലെ
  rationale: രണ്ടിടത്തുമുള്ള ‘ഹൃദയം’ എന്ന രൂപകം നിലനിർത്തുകയും עִם എന്നതിന്റെ ‘കൂടെ’ എന്ന ബന്ധാർഥം വ്യാഖ്യാനിച്ച് തീർക്കാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: יֵשׁ וָיֵשׁ
  choice: അതെ, അതെ
  rationale: ആവർത്തനം നൽകുന്ന ഊന്നൽ മലയാളത്തിലും ആവർത്തനത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: תְּנָה אֶת יָדֶךָ
  choice: നിന്റെ കൈ എനിക്കു തരിക
  rationale: മൂലത്തിലെ ‘കൈ തരുക’ എന്ന പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ഇത് സമ്മതത്തിന്റെയോ സഹായത്തിന്റെയോ ചിഹ്നമാകാമെങ്കിലും വാചകത്തിൽ അത് വിശദീകരിക്കുന്നില്ല.
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל הַמֶּרְכָּבָה
  choice: അവൻ യെഹോനാദാബിനെ തന്റെ അടുക്കലേക്ക് രഥത്തിൽ കയറ്റി
  rationale: עלה എന്ന ഹിഫീൽ രൂപത്തിലെ ‘കയറ്റുക’ എന്ന കാരണാർഥവും אֵלָיו എന്ന ‘തന്റെ അടുക്കലേക്ക്’ എന്ന ഘടകവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘ഹൃദയം നേരായിരിക്കുക’ എന്നതിന്റെ ബന്ധപരമായ അർഥം
  choice: ‘ഹൃദയം പരമാർഥമാണോ’ എന്നു നൽകി, ഹൃദയരൂപകവും നിഷ്ഠ/സത്യസന്ധതയുടെ തുറന്ന അർഥപരിധിയും നിലനിർത്തി
  alternative: ‘നിന്റെ ഉദ്ദേശ്യം എന്റേതിനോട് യോജിക്കുന്നുവോ?’
  rationale: മാറ്റുവിവർത്തനം പരസ്പര രാഷ്ട്രീയലക്ഷ്യങ്ങളിലെ യോജിപ്പായി മാത്രം അർഥം ചുരുക്കും. മൂലപാഠം ധാർമ്മിക നേരിനെയും ബന്ധപരമായ നിഷ്ഠയെയും ഒരുമിച്ച് തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പേരുകൾ ‘യെഹോനാദാബ്’, ‘രേഖാബ്’ എന്ന മലയാള ബൈബിൾപരമ്പരയോട് ചേർന്ന രൂപങ്ങളിൽ നൽകി. ഹീബ്രുവിലെ സർവനാമങ്ങൾ മലയാളത്തിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കുന്നിടത്ത് ‘യെഹോനാദാബ്’ ആവർത്തിച്ചു; യേഹൂവിന്റെ പേര് ഈ വാക്യത്തിൽ ഹീബ്രു വീണ്ടും പറയാത്തതിനാൽ വാചകത്തിൽ ചേർത്തിട്ടില്ല.
