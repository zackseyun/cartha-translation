  text: וַ/יְהִ֤י בַ/בֹּ֨קֶר֙ וַ/יֵּצֵ֣א וַֽ/יַּעֲמֹ֔ד וַ/יֹּ֨אמֶר֙ אֶל כָּל הָ/עָ֔ם צַדִּקִ֖ים אַתֶּ֑ם הִנֵּ֨ה אֲנִ֜י קָשַׁ֤רְתִּי עַל אֲדֹנִ/י֙ וָ/אֶהְרְגֵ֔/הוּ וּ/מִ֥י הִכָּ֖ה אֶת כָּל אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/009.yaml
  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
translation:
  language: ml
  text: 'രാവിലെ അവൻ പുറത്തുവന്ന് നിന്നു സകല ജനത്തോടും പറഞ്ഞു: “നിങ്ങൾ കുറ്റമില്ലാത്തവർ[a]. ഇതാ, ഞാൻ എന്റെ യജമാനനെതിരെ ഗൂഢാലോചന നടത്തി അവനെ കൊന്നു; എന്നാൽ ഇവരെയെല്ലാം കൊന്നത് ആര്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിങ്ങൾ നീതിമാന്മാർ” / “നിങ്ങളുടെ ഭാഗത്താണ് ന്യായം.” ഹീബ്രായ പദത്തിന് നീതിയുള്ളവർ എന്നും കുറ്റത്തിൽനിന്ന് ഒഴിവുള്ളവർ എന്നും അർത്ഥമാകാം; ഇവിടെ പൊതുനീതിന്യായ സന്ദർഭം “കുറ്റമില്ലാത്തവർ” എന്ന അർത്ഥത്തെ അനുകൂലിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: രാവിലെ
  rationale: ഹീബ്രായ ആഖ്യാനസൂത്രമായ וַיְהִי മലയാളത്തിൽ പ്രത്യേകം പദാനുപദമായി ചേർക്കാതെ സമയസൂചനയിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: അവൻ പുറത്തുവന്ന് അവിടെ നിന്നുകൊണ്ട്
  rationale: തുടർച്ചയായ പ്രവൃത്തികളെ സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുമ്പോഴും പൊതുജനത്തിനു മുമ്പിലുള്ള ഔപചാരിക നില്പ് നിലനിർത്തുന്നു.
- source_word: כָּל הָעָם
  choice: സകല ജനത്തോടും
  rationale: പൊതുജനസമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്നതിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: צַדִּקִים אַתֶּם
  choice: നിങ്ങൾ കുറ്റമില്ലാത്തവർ
  rationale: 'צדיק എന്ന പദത്തിന്റെ നീതിന്യായപരമായ അർത്ഥം ഈ സാഹചര്യത്തിൽ മുൻനിർത്തുന്നു: യേഹൂ ജനത്തെ ഈ കൊലകളുടെ കുറ്റത്തിൽനിന്ന് ഒഴിവാക്കുകയാണ്; ധാർമ്മിക പരിപൂർണത പ്രഖ്യാപിക്കുന്നില്ല.'
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രായ സൂചകത്തിന്റെ ഗൗരവവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: קָשַׁרְתִּי עַל
  choice: എതിരെ ഗൂഢാലോചന നടത്തി
  rationale: קשר על എന്ന രാഷ്ട്രീയ ഗൂഢാലോചനാസൂചക പ്രയോഗത്തിന്റെ നേരായ മലയാള രൂപം.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനനെ
  rationale: ഇവിടെ ദൈവിക ബിരുദമല്ല, രാജകീയ മേലധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘കർത്താവ്’ ഒഴിവാക്കുന്നു.
- source_word: וָאֶהְרְגֵהוּ
  choice: അവനെ കൊന്നു
  rationale: הרג എന്ന ക്രിയയുടെ വ്യക്തവും ആധുനികവുമായ മലയാള പരിഭാഷ.
- source_word: וּמִי הִכָּה
  choice: എന്നാൽ ... കൊന്നത് ആര്?
  rationale: വാവിന്റെ സന്ദർഭോചിതമായ വിരുദ്ധത ‘എന്നാൽ’കൊണ്ട് വ്യക്തമാക്കുന്നു; נכה ഇവിടെ മരണകാരകമായി അടിച്ചുവീഴ്ത്തുക എന്ന അർത്ഥമുള്ളതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘കൊന്നു’ എന്ന് നൽകുന്നു.
- source_word: כָּל אֵלֶּה
  choice: ഇവരെയെല്ലാം
  rationale: സന്ദർഭത്തിൽ കൊല്ലപ്പെട്ട വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക സർവനാമരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: צַדִּקִים എന്നതിന്റെ ധാർമ്മികമോ നീതിന്യായപരമോ ആയ അർത്ഥം
  choice: കുറ്റമില്ലാത്തവർ
  alternative: നീതിമാന്മാർ / നിങ്ങൾ പറയുന്നതാണ് ശരി
  rationale: യേഹൂ താൻ ഒരാളെ കൊന്നതായി സമ്മതിച്ച് അനേകരുടെ മരണത്തിന് ഉത്തരവാദി ആരെന്ന് ചോദിക്കുന്ന പൊതുനീതിന്യായ സന്ദർഭം, ജനത്തിന് കുറ്റമില്ലെന്ന അർത്ഥത്തെ അനുകൂലിക്കുന്നു; പദത്തിന്റെ വിശാല അർത്ഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാന ശൈലി. ‘ഇതാ’ ഔപചാരിക ശ്രദ്ധാകർഷണം നിലനിർത്തുന്നു; അത്യന്തം പുരാതനമോ സഭാവിഭാഗസവിശേഷമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
