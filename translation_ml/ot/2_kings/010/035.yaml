id: 2KI.10.35
reference: 2 Kings 10:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יֵהוּא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֖/וֹ בְּ/שֹׁמְר֑וֹן וַ/יִּמְלֹ֛ךְ יְהוֹאָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/035.yaml
  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: ml
  text: യേഹൂ തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു; അവർ അവനെ ശമര്യയിൽ അടക്കം ചെയ്തു. അവന്റെ മകനായ യെഹോവാഹാസ് അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: ശׁכב എന്ന ക്രിയ രാജാക്കന്മാരുടെ ചരമവിവരണങ്ങളിൽ മരണത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്. മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമായ ‘നിദ്രപ്രാപിച്ചു’ എന്ന പ്രയോഗം മരണാർഥം വ്യക്തമാക്കിക്കൊണ്ട് മൂലത്തിലെ രൂപകഭാഷ നിലനിർത്തുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ
  rationale: രാജവംശപരമായ ചരമസൂത്രത്തിലെ പൂർവികബന്ധം ഔപചാരികമായി നിലനിർത്തുന്നു; ‘പൂർവികരോടുകൂടെ’ എന്നതും സാധ്യമാണെങ്കിലും ‘പിതാക്കന്മാർ’ മൂലപദത്തോട് കൂടുതൽ അടുത്തതാണ്.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: അവർ അവനെ അടക്കം ചെയ്തു
  rationale: എബ്രായത്തിലെ വ്യക്തമാക്കാത്ത കർത്താവോടുകൂടിയ മൂന്നാം പുരുഷ ബഹുവചന സജീവരൂപം അതേപടി സംരക്ഷിക്കുന്നു; അടക്കം ചെയ്തവർ ആരെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: ב എന്ന സ്ഥലസൂചക അവ്യയത്തിന് സ്വാഭാവികമായ മലയാളരൂപം; സംസ്കാരപരമായി പരിചിതമായ സ്ഥലനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: ഇവിടെ מלך ഭരണകാലത്തിന്റെ ദൈർഘ്യത്തേക്കാൾ രാജസ്ഥാനാരോഹണത്തെ സൂചിപ്പിക്കുന്നു. ‘രാജാവായി’ അധികാരത്തിലെ തുടർച്ച സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: മുൻരാജാവിന്റെ സ്ഥാനത്ത് മകൻ അധികാരമേറ്റെന്ന സ്ഥാനപകരത്തെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: יֵהוּא
  choice: യേഹൂ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് ചേർന്നതും മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതവുമായ ലിപ്യന്തരണം.
- source_word: יְהוֹאָחָז
  choice: യെഹോവാഹാസ്
  rationale: എബ്രായ നാമത്തിന്റെ ഘടന തിരിച്ചറിയാവുന്ന വിധത്തിൽ നിലനിർത്തുന്ന, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
theological_decisions:
- issue: ‘പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു’ എന്ന ചരമസൂത്രത്തിന്റെ അർഥം
  choice: മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകപ്രയോഗമായി നിലനിർത്തി
  alternative: ‘മരിച്ചു’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  rationale: ഈ വാക്യം മരണാനന്തരാവസ്ഥയെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ രൂപകത്തെ ഇല്ലാതാക്കുകയോ അതിൽ പ്രത്യേകമായ ഒരു മരണാനന്തര സിദ്ധാന്തം ചേർക്കുകയോ ചെയ്യാതെ മൂലത്തിലെ പരമ്പരാഗത ഭാഷ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ രാജകീയ ചരമവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ സജീവ ബഹുവചനം, രാജവംശപരമായ സ്ഥിരപ്രയോഗം, സ്ഥാനപകരം എന്നിവ സംരക്ഷിച്ചു.
