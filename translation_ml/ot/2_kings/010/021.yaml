  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
translation:
  language: ml
  text: അങ്ങനെ യേഹൂ യിസ്രായേലിലെങ്ങും ആളയച്ചു. ബാലിനെ ആരാധിക്കുന്ന എല്ലാവരും വന്നു; വരാതിരുന്ന ഒരുത്തൻപോലും ശേഷിച്ചില്ല. അവർ ബാലിന്റെ ആലയത്തിൽ പ്രവേശിച്ചു; ബാലിന്റെ ആലയം അറ്റംമുതൽ അറ്റംവരെ നിറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘വായ്മുതൽ വായുവരെ’; ആലയം പൂർണമായി നിറഞ്ഞു എന്നർഥമുള്ള എബ്രായ ശൈലി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח יֵהוּא בְּכָל יִשְׂרָאֵל
  choice: യേഹൂ യിസ്രായേലിലെങ്ങും ആളയച്ചു
  rationale: שׁלח എന്ന ക്രിയയും בְּכָל יִשְׂרָאֵל എന്ന പരിധിസൂചക പ്രയോഗവും ചേർന്ന്, യേഹൂ യിസ്രായേൽ മുഴുവനിലും ആളയച്ച് അറിയിപ്പ് നൽകിയെന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ‘ആളയച്ചു’ സ്വാഭാവികവും മൂലപാഠത്തിലെ കർമത്തിന്റെ അഭാവം അനാവശ്യമായി പൂരിപ്പിക്കാത്തതുമാണ്.
- source_word: עֹבְדֵי הַבַּעַל
  choice: ബാലിനെ ആരാധിക്കുന്നവർ
  rationale: עבד എന്നതിന് ‘സേവിക്കുക’ എന്നും അർഥമുണ്ടെങ്കിലും ഇവിടെ ആരാധനാസന്ദർഭമായതിനാൽ ‘ആരാധിക്കുന്നവർ’ ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  choice: വരാതിരുന്ന ഒരുത്തൻപോലും ശേഷിച്ചില്ല
  rationale: ആരും വിട്ടുനിന്നില്ലെന്ന സമഗ്രത ഊന്നിപ്പറയുന്ന എബ്രായ നിഷേധഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു; אִישׁ എന്ന ഏകവചന പുരുഷരൂപത്തിന്റെ പ്രതിനിധാനസ്വഭാവവും ‘ഒരുത്തൻപോലും’ നിലനിർത്തുന്നു.
- source_word: בֵּית הַבַּעַל
  choice: ബാലിന്റെ ആലയം
  rationale: בַּיִת അക്ഷരാർഥത്തിൽ ‘വീട്’ ആണെങ്കിലും ഇവിടെ ആരാധനയ്ക്കുള്ള ക്ഷേത്രത്തെ സൂചിപ്പിക്കുന്നു. ‘ആലയം’ മൂലരൂപത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് ആ ആരാധനാസ്ഥലത്തെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּמָּלֵא
  choice: നിറഞ്ഞു
  rationale: מלא എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ ആലയം നിറഞ്ഞ അവസ്ഥയിലായതിനെ സൂചിപ്പിക്കുന്നു; ‘നിറഞ്ഞു’ മലയാളത്തിലെ നേരായ സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: פֶּה לָפֶה
  choice: അറ്റംമുതൽ അറ്റംവരെ
  rationale: അക്ഷരാർഥത്തിൽ ‘വായ്മുതൽ വായുവരെ’ എന്ന ഈ എബ്രായ ശൈലി സ്ഥലം മുഴുവനും നിറഞ്ഞുവെന്ന ആശയം നൽകുന്നു. ‘അറ്റംമുതൽ അറ്റംവരെ’ അതിന്റെ ദൃശ്യശക്തി സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אִישׁ എന്ന പദത്തിലെ പ്രതിനിധാനപരമായ പുരുഷ ഏകവചനം
  choice: വരാതിരുന്ന ഒരുത്തൻപോലും ശേഷിച്ചില്ല
  alternative: വരാത്ത ആരും ശേഷിച്ചില്ല
  rationale: മൂലപാഠത്തിലെ പുരുഷ ഏകവചന രൂപം പ്രതിനിധാനപരമായി നിലനിർത്തുന്നു; അതേസമയം ഈ വാക്യം ആരാധകരുടെ സമ്പൂർണ ഹാജറിനെയാണ് ഊന്നുന്നതെന്നും പ്രത്യേക ഉപദേശപരമായ നിഗമനം ചേർക്കുന്നില്ലെന്നും ഉറപ്പാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ആളയച്ചു,’ ‘ആലയം,’ ‘അറ്റംമുതൽ അറ്റംവരെ’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ രൂപവും സാധാരണ വായനക്കാരന്റെ ഗ്രാഹ്യതയും തുലനം ചെയ്യുന്നു. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന פֶּה לָפֶה എന്ന പ്രയോഗത്തിനരികിലാണ് [a] ചിഹ്നം നൽകിയിരിക്കുന്നത്.
