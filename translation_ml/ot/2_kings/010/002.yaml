translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഔപചാരികവും സ്വാഭാവികവുമായ ഗദ്യശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്ന വ്യവസ്ഥാപൂർവക ഘടനയായതിനാൽ അവസാനത്തിൽ അർധവിരാമമോ പൂർണ്ണവിരാമമോ ഇടാതെ കോമ നിലനിർത്തി. ‘നിങ്ങളുടെ പക്കൽ’ എന്ന ഘടന, എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള וְאִתְּכֶם പട്ടികയിലെ എല്ലാ സൈനിക-രാഷ്ട്രീയ വിഭവങ്ങളോടും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
