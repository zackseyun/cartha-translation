  yaml_path: translation/ot/2_kings/010/002.yaml
  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
translation:
  language: ml
  text: ഇപ്പോൾ ഈ കത്ത് നിങ്ങളുടെ അടുക്കൽ എത്തുമ്പോൾ[a], നിങ്ങളുടെ യജമാനന്റെ പുത്രന്മാരും[b] രഥങ്ങളും കുതിരകളും കോട്ടമതിലുള്ള ഒരു നഗരവും[c] ആയുധങ്ങളും നിങ്ങളുടെ പക്കൽ ഉള്ളതിനാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ രേഖ നിങ്ങളുടെ അടുക്കൽ എത്തുമ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘നിങ്ങളുടെ യജമാനന്റെ പുത്രന്മാർ’; അതായത്, കത്ത് ലഭിച്ചവർ സേവിച്ചിരുന്ന രാജാവിന്റെ പുത്രന്മാർ.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘ഒരു കോട്ടനഗരം.’ കത്ത് ലഭിച്ചവരുടെ നിയന്ത്രണത്തിലുള്ള പ്രതിരോധസജ്ജമായ നഗരത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: തുടർന്നുള്ള സന്ദേശഘട്ടം അവതരിപ്പിക്കുന്ന വ്യവഹാരസൂചകം; മുൻപിലെ സംയോജകം മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളാം.
- source_word: כְּבֹא הַסֵּפֶר הַזֶּה אֲלֵיכֶם
  choice: ഈ കത്ത് നിങ്ങളുടെ അടുക്കൽ എത്തുമ്പോൾ
  rationale: כְּ + infinitive construct കാലസൂചന നൽകുന്നു. രാജകീയ കത്തിടപാടിന്റെ പശ്ചാത്തലത്തിൽ סֵפֶר എന്നത് ‘കത്ത്’ എന്നാണ് സ്വാഭാവികം.
- source_word: וְאִתְּכֶם
  choice: നിങ്ങളുടെ പക്കൽ ഉള്ളതിനാൽ
  rationale: ആവർത്തിച്ചുവരുന്ന ‘നിങ്ങളോടുകൂടെ’ എന്ന സാഹചര്യപ്രയോഗത്തെ മലയാളത്തിൽ പട്ടികയുടെ എല്ലാ ഘടകങ്ങളോടും ബന്ധിപ്പിച്ച് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּנֵי אֲדֹנֵיכֶם
  choice: നിങ്ങളുടെ യജമാനന്റെ പുത്രന്മാർ
  rationale: രാഷ്ട്രീയ-രാജകീയ ബന്ധത്തിലെ אֲדֹנֵיכֶם എന്നതിന് ദൈവിക പദവിയുമായി ആശയക്കുഴപ്പം വരാത്ത ‘യജമാനൻ’ യോജിക്കുന്നു.
- source_word: הָרֶכֶב וְהַסּוּסִים
  choice: രഥങ്ങളും കുതിരകളും
  rationale: സൈനിക വിഭവങ്ങളെ സൂചിപ്പിക്കുന്ന കൂട്ടനാമങ്ങളെ നേരായും വായനാസൗകര്യമുള്ളതായും വിവർത്തനം ചെയ്യുന്നു.
- source_word: עִיר מִבְצָר
  choice: ഉറപ്പുള്ള ഒരു നഗരം
  rationale: പ്രതിരോധസജ്ജമായ നഗരത്തെ സൂചിപ്പിക്കുന്ന construct പ്രയോഗം; ‘കോട്ടനഗരം’ എന്നതിലേക്കു അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: הַנָּשֶׁק
  choice: ആയുധങ്ങൾ
  rationale: പൊതുവായ ആയുധസാമഗ്രികളെ സൂചിപ്പിക്കുന്നു; ‘കവചം’ എന്ന ചുരുങ്ങിയ അർഥം ഒഴിവാക്കുന്നു.
