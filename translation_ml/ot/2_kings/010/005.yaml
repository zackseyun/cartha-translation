  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജകൊട്ടാരത്തിന്റെ ചുമതല വഹിച്ചിരുന്നവനും നഗരത്തിന്റെ ചുമതല വഹിച്ചിരുന്നവനും മൂപ്പന്മാരും സംരക്ഷകരും[a] യേഹൂവിന് ഇങ്ങനെ സന്ദേശമയച്ചു: “ഞങ്ങൾ അങ്ങയുടെ ദാസന്മാരാണ്. അങ്ങ് ഞങ്ങളോടു പറയുന്നതെല്ലാം ഞങ്ങൾ ചെയ്യും. ഞങ്ങൾ ആരെയും രാജാവാക്കുകയില്ല. അങ്ങയുടെ ദൃഷ്ടിയിൽ നല്ലത് ചെയ്യുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വളർത്തുപിതാക്കന്മാർ” അല്ലെങ്കിൽ “പരിപാലകർ.” രാജകുമാരന്മാരുടെ പരിപാലനച്ചുമതല ഏൽപ്പിക്കപ്പെട്ടവരെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: രാജകൊട്ടാരത്തിന്റെ ചുമതല വഹിച്ചിരുന്നവൻ
  rationale: രാജകീയ പശ്ചാത്തലത്തിൽ ഈ എബ്രായ പ്രയോഗം രാജഭവനത്തിന്റെയോ കൊട്ടാരത്തിന്റെയോ മേൽനോട്ടം വഹിച്ചിരുന്ന ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു. ഔദ്യോഗിക പദവി അനാവശ്യമായി കൃത്യമാക്കാതെ ഭരണപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וַאֲשֶׁר עַל הָעִיר
  choice: നഗരത്തിന്റെ ചുമതല വഹിച്ചിരുന്നവൻ
  rationale: എബ്രായം ഒരു ഔദ്യോഗിക പദവിപ്പേരിനേക്കാൾ ചുമതലയുടെ വിവരണമാണ് നൽകുന്നത്; അതിനാൽ ‘നഗരാധിപൻ’ എന്ന് അധികമായി നിർവചിക്കാതെ മൂലരൂപത്തിന്റെ തുറന്ന സ്വഭാവം സൂക്ഷിക്കുന്നു.
- source_word: הַזְּקֵנִים
  choice: മൂപ്പന്മാർ
  rationale: സാമൂഹികവും രാഷ്ട്രീയവുമായ നേതൃത്വപങ്ക് സൂചിപ്പിക്കുന്ന ഈ പദത്തിന് മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണ ഉപയോഗത്തിലുമുള്ള സ്വാഭാവിക സമാനപദമാണിത്.
- source_word: הָאֹמְנִים
  choice: സംരക്ഷകർ
  rationale: രാജകുമാരന്മാരുടെ പരിപാലനച്ചുമതല ഏൽപ്പിക്കപ്പെട്ടവരെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. ‘സംരക്ഷകർ’ എന്നത് വളർത്തുപിതാക്കന്മാർ, പരിചാരകർ തുടങ്ങിയ സാധ്യതകൾ ഉൾക്കൊള്ളുന്ന വിശാലവും സ്വാഭാവികവുമായ പദമാണ്.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർ
  rationale: ഇവിടെ പദം അടിമത്തത്തെ ഊന്നുന്നതല്ല, രാഷ്ട്രീയ കീഴടങ്ങലും ആദരപൂർവമായ സ്വയംവിശേഷണവുമാണ് പ്രകടിപ്പിക്കുന്നത്. അതിനാൽ ‘ദാസന്മാർ’ അനുയോജ്യം.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלֵינוּ נַעֲשֶׂה
  choice: അങ്ങ് ഞങ്ങളോടു പറയുന്നതെല്ലാം ഞങ്ങൾ ചെയ്യും
  rationale: അനുസരണത്തിന്റെ നേരിട്ടുള്ള പ്രതിജ്ഞ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: לֹא נַמְלִיךְ אִישׁ
  choice: ഞങ്ങൾ ആരെയും രാജാവാക്കുകയില്ല
  rationale: מלך എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘രാജാവായി വാഴിക്കുക/ആക്കുക’ എന്ന കാരണാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ നല്ലത്
  rationale: ‘കണ്ണുകളിൽ നല്ലത്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകസ്വഭാവം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം സംരക്ഷിക്കുന്നു; ‘അങ്ങേക്കു ശരിയെന്നു തോന്നുന്നത്’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: עֲשֵׂה
  choice: ചെയ്യുക
  rationale: വാക്യാവസാനത്തിലെ ഹ്രസ്വവും നേരിട്ടുള്ളതുമായ എബ്രായ ആജ്ഞാരൂപം നിലനിർത്തുന്നു.
