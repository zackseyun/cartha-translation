translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഇംഗ്ലീഷ് അടിക്കുറിപ്പിലെ സാധ്യത മുഖ്യവാക്യത്തിൽ തന്നെ സ്വാഭാവികമായി ഉൾപ്പെടുത്തിയതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല.
