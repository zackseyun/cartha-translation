id: 2KI.10.20
reference: 2 Kings 10:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יֵה֗וּא קַדְּשׁ֧וּ עֲצָרָ֛ה לַ/בַּ֖עַל וַ/יִּקְרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/020.yaml
  text: Then Jehu said[a], “Consecrate a solemn assembly for Baal.” So they proclaimed it.
translation:
  language: ml
  text: 'അപ്പോൾ യേഹൂ പറഞ്ഞു: “ബാലിനുവേണ്ടി ഒരു വിശുദ്ധ സമ്മേളനം വേർതിരിച്ചു നിശ്ചയിക്കുവിൻ.” അങ്ങനെ അവർ അതു പ്രഖ്യാപിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: יֵהוּא
  choice: യേഹൂ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: קַדְּשׁוּ
  choice: വിശുദ്ധസഭ പ്രഖ്യാപിക്കുവിൻ
  rationale: קדשׁ എന്ന ബഹുവചന ആജ്ഞാരൂപത്തിന് ഇവിടെ സഭയെ ആരാധനയ്ക്കായി വിശുദ്ധമായി നിശ്ചയിക്കുക/പ്രഖ്യാപിക്കുക എന്ന ആചാരപരമായ അർഥമുണ്ട്. മലയാളത്തിൽ ‘വിശുദ്ധസഭ പ്രഖ്യാപിക്കുവിൻ’ എന്നത് עֲצָרָהയോടൊപ്പം ഈ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עֲצָרָה
  choice: ഒരു വിശുദ്ധസഭ
  rationale: ഔപചാരികമായ മതസമ്മേളനത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘വിശുദ്ധസഭ’ അതിന്റെ ആരാധനാപരമായ ഭാവം സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: לַבַּעַל
  choice: ബാലിനുവേണ്ടി
  rationale: ל ഇവിടെ ബന്ധമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു—ബാലിന്റെ ആരാധനയ്ക്കായുള്ള സമ്മേളനം. ‘ബാലിനുവേണ്ടി’ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּקְרָאוּ
  choice: അങ്ങനെ അവർ അതു പ്രഖ്യാപിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ קרא പൊതുവായി അറിയിക്കുക എന്നതാണ്. മുൻവാക്യത്തിലെ സഭയാണ് സൂചിത കർമം; അതിനാൽ മലയാളത്തിൽ ‘അതു’ ചേർത്തു.
