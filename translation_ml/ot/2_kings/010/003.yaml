language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/רְאִיתֶ֞ם הַ/טּ֤וֹב וְ/הַ/יָּשָׁר֙ מִ/בְּנֵ֣י אֲדֹנֵי/כֶ֔ם וְ/שַׂמְתֶּ֖ם עַל כִּסֵּ֣א אָבִ֑י/ו וְ/הִֽלָּחֲמ֖וּ עַל בֵּ֥ית אֲדֹנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/003.yaml
  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
translation:
  language: ml
  text: അപ്പോൾ നിങ്ങളുടെ യജമാനന്റെ പുത്രന്മാരിൽ നല്ലവനും നേരുള്ളവനുമായവനെ തിരഞ്ഞെടുത്ത്[a] അവന്റെ പിതാവിന്റെ സിംഹാസനത്തിൽ ഇരുത്തുക; നിങ്ങളുടെ യജമാനന്റെ ഭവനത്തിനുവേണ്ടി[b] പോരാടുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിങ്ങളുടെ യജമാനന്റെ പുത്രന്മാരിൽ നല്ലവനും നേരുള്ളവനുമായവനെ നോക്കിക്കണ്ട്.’ എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘കാണുക’ എന്നാണെങ്കിലും, ഇവിടെ പരിശോധിച്ചശേഷം തിരഞ്ഞെടുക്കുക എന്ന ആശയമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഭവനം’ ഇവിടെ ഒരു കെട്ടിടത്തെ മാത്രമല്ല, യജമാനന്റെ രാജകുടുംബത്തെയോ രാജവംശത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: തിരഞ്ഞെടുത്ത്
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘കാണുക’ എന്നാണെങ്കിലും, പുത്രന്മാരിൽ ഒരാളെ പരിശോധിച്ച് തിരഞ്ഞെടുക്കാനുള്ള ആഹ്വാനമാണ് സന്ദർഭത്തിലെ അർഥം. ‘തിരഞ്ഞെടുത്ത്’ എന്നത് ആ പ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: ഏറ്റവും നല്ലവനും നേരുള്ളവനുമായവനെ
  rationale: പല പുത്രന്മാരിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പായതിനാൽ സന്ദർഭസൂചിതമായ ശ്രേഷ്ഠത ‘ഏറ്റവും’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു. טוֹב എന്നതിന്റെ ഗുണമേന്മയും יָשָׁר എന്നതിന്റെ ധാർമികമായ ‘നേരുള്ള’ അർഥവും നിലനിർത്തുന്നു.
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  choice: നിങ്ങളുടെ യജമാനന്റെ പുത്രന്മാരിൽ
  rationale: מן ഇവിടെ കൂട്ടത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്നു. אֲדֹנֵיכֶם ദൈവനാമമല്ല, മനുഷ്യനായ രാജാധികാരിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യജമാനൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְשַׂמְתֶּם עַל כִּסֵּא אָבִיו
  choice: അവന്റെ അപ്പന്റെ സിംഹാസനത്തിൽ ഇരുത്തുക
  rationale: ഇത് പിതാവിന്റെ പിൻഗാമിയായി രാജസ്ഥാനത്ത് സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘സിംഹാസനത്തിൽ ഇരുത്തുക’ മലയാളത്തിൽ സ്വാഭാവികവും രാജാഭിഷേകത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: וְהִלָּחֲמוּ עַל בֵּית אֲדֹנֵיכֶם
  choice: നിങ്ങളുടെ യജമാനന്റെ ഭവനത്തിനുവേണ്ടി പോരാടുക
  rationale: עַל ഇവിടെ ‘വേണ്ടി/പക്ഷമായി’ എന്ന അർഥത്തിൽ എടുത്തിരിക്കുന്നു. בֵּית എന്ന ‘ഭവനം’ ഭൗതിക കെട്ടിടത്തേക്കാൾ രാജകുടുംബത്തെയോ രാജവംശത്തെയോ സൂചിപ്പിക്കുന്നു; മൂലരൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: אֲדֹנֵיכֶם എന്ന മനുഷ്യാധികാരിയുടെ വിശേഷണം
  choice: യജമാനൻ
  alternative: കർത്താവ് / പ്രഭു
  rationale: ഈ കഥാസന്ദർഭത്തിൽ പദം യഹോവയെ അല്ല, മനുഷ്യനായ രാജാധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ദൈവിക വിശേഷണമായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ ‘യജമാനൻ’ ഉപയോഗിച്ചു.
- issue: בֵּית എന്നതിന്റെ രാജവംശപരമായ അർഥം
  choice: ഭവനം എന്ന രൂപകം നിലനിർത്തി അടിക്കുറിപ്പിൽ രാജകുടുംബം/രാജവംശം എന്നു വിശദീകരിക്കുക
  alternative: മുഖ്യവാചകത്തിൽ നേരിട്ട് ‘രാജവംശം’ എന്നു നൽകുക
  rationale: ‘ഭവനം’ എന്ന ബൈബിൾപരമായ രൂപകം വംശത്തെയും രാജകുടുംബത്തെയും ഉൾക്കൊള്ളുന്നു. രൂപകം സംരക്ഷിക്കുമ്പോഴും വായനക്കാരൻ അതിനെ കെട്ടിടമായി മാത്രം ഗ്രഹിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. രാജകീയ പശ്ചാത്തലത്തിന് യോജിച്ച ‘സിംഹാസനം’, ‘ഭവനം’ എന്നീ പദങ്ങൾ നിലനിർത്തി; അപരിചിതമാകാവുന്ന വംശപരമായ രൂപകം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
