    issue: The translation lacks the lexical-alternative footnote for കִנְאָה.
    rationale: The supplied translation rationale explicitly identifies ‘അസൂയ’ as a viable lexical alternative, and the English audit trail preserves that ambiguity in a footnote. A Malayalam anchor and note should likewise be supplied.
