  yaml_path: translation/ot/2_kings/010/016.yaml
  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
translation:
  language: ml
  text: 'പിന്നെ അവൻ പറഞ്ഞു: “എന്നോടൊപ്പം വരിക; യഹ്‌വേയോടുള്ള എന്റെ ആവേശം കാണുക.”[a] അങ്ങനെ അവർ അവനെ യേഹൂവിന്റെ രഥത്തിൽ കയറ്റി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യഹ്‌വേയോടുള്ള എന്റെ അസൂയ.’ എബ്രായപദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ആവേശം’ അല്ലെങ്കിൽ ‘അസൂയ’ എന്ന അർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה אִתִּי
  choice: എന്നോടൊപ്പം വരിക
  rationale: הלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ ക്ഷണമോ ആഹ്വാനമോ ആയി പ്രയോഗിച്ചിരിക്കുന്നു; אִתִּי കൂടെയുണ്ടാകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וּרְאֵה
  choice: കാണുക
  rationale: ראה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ആജ്ഞാഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּקִנְאָתִי
  choice: എന്റെ തീക്ഷ്ണത
  rationale: קִנְאָה എന്ന പദത്തിന് തീക്ഷ്ണത, അസൂയ എന്നീ അർഥങ്ങൾ വരാം. യഹ്‌വേയോടുള്ള സമർപ്പിതമായ ഉത്സാഹം അവകാശപ്പെടുന്ന ഈ സന്ദർഭത്തിൽ ‘തീക്ഷ്ണത’ സ്വാഭാവികമാണ്; പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേയോടുള്ള
  rationale: לְ ഇവിടെ തീക്ഷ്ണതയുടെ ലക്ഷ്യത്തെയോ വിഷയത്തെയോ അടയാളപ്പെടുത്തുന്നു; יהוה എന്ന ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיַּרְכִּיבוּ אֹתוֹ
  choice: അവർ അവനെ ... കയറ്റി
  rationale: רכב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘സവാരി ചെയ്യാൻ ഇടയാക്കുക/വാഹനത്തിൽ കയറ്റുക’ എന്ന കാരണാർത്ഥം നൽകുന്നു. മലയാളത്തിൽ ‘രഥത്തിൽ കയറ്റി’ സ്വാഭാവികവും അർഥസൂക്ഷ്മവുമാണ്.
- source_word: בְּרִכְבּוֹ
  choice: അവന്റെ രഥത്തിൽ
  rationale: רֶכֶב ഇവിടെ രഥത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം രഥം അവന്റേതാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠത്തിൽ ദൈവത്തിന്റെ സവിശേഷ നാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ അതിനെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: קִנְאָה എന്ന പദത്തിലെ തീക്ഷ്ണത/അസൂയ അർഥദ്വന്ദ്വം
  choice: പ്രധാനപാഠത്തിൽ ‘തീക്ഷ്ണത’
  alternative: എന്റെ അസൂയ
  rationale: സന്ദർഭത്തിൽ യേഹൂ തന്റെ യഹ്‌വേ-ഭക്തിയുടെ ഉത്സാഹം പ്രകടമാക്കുകയാണ്; അതിനാൽ ‘തീക്ഷ്ണത’ അനുയോജ്യം. എന്നാൽ മൂലപദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി മറച്ചുവയ്ക്കാതിരിക്കാൻ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകേണ്ടതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായവാക്യത്തിന്റെ നേരിട്ടുള്ള ആജ്ഞാഭാവവും കാരണാർത്ഥക ക്രിയയും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ഉൾപ്പെടുത്തിയിട്ടില്ലാത്തതിനാൽ പ്രധാനപാഠത്തിൽ മാർക്കറും ചേർത്തിട്ടില്ല.
