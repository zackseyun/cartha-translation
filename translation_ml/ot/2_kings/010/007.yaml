base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/007.yaml
  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
translation:
  language: ml
  text: ആ കത്ത് അവരുടെ അടുക്കൽ എത്തിയപ്പോൾ, അവർ രാജാവിന്റെ പുത്രന്മാരായ എഴുപതു പുരുഷന്മാരെ പിടിച്ചെടുത്തു അറുത്തുകൊന്നു. അവരുടെ തലകൾ കൊട്ടകളിൽ[a] വെച്ച് യിസ്രെയേലിൽ അവന്റെ അടുക്കലേക്ക് അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാത്രങ്ങളിൽ’ അല്ലെങ്കിൽ ‘കലങ്ങളിൽ’; എബ്രായപദം പൊതുവായി സംഭരണപാത്രങ്ങളെ സൂചിപ്പിക്കുന്നു; നെയ്ത കൊട്ടകളെ മാത്രമാണ് സൂചിപ്പിക്കുന്നതെന്ന് ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: ആ കത്ത്
  rationale: സന്ദർഭത്തിൽ ഇത് യേഹൂ അയച്ച എഴുതിയ സന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘കത്ത്’ സ്വാഭാവികവും നിർദിഷ്ടവുമാണ്.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ പുത്രന്മാർ
  rationale: രാജാവിന്റെ പുരുഷസന്തതിയെയും രാജവംശബന്ധത്തെയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁחֲטוּ
  choice: അറുത്തുകൊന്നു
  rationale: שׁחט എന്ന ക്രിയയിലെ അറുക്കലിന്റെയും ക്രൂരമായ കൊലപാതകത്തിന്റെയും ശക്തി ‘കൊന്നു’ എന്നതിലുപരി പ്രകടമാക്കുന്നു.
- source_word: שִׁבְעִים אִישׁ
  choice: ആ എഴുപതുപേരെയും
  rationale: രാജാവിന്റെ പുത്രന്മാരുടെ എണ്ണമാണ് ഇവിടെ പറയുന്നത്; മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: רָאשֵׁיהֶם
  choice: അവരുടെ തലകൾ
  rationale: മൂലപാഠത്തിലെ വ്യക്തവും ഭീകരവുമായ ദൃശ്യത്തെ മയപ്പെടുത്താതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: בַּדּוּדִים
  choice: കുട്ടകളിൽ
  rationale: തലകൾ കൊണ്ടുപോകാൻ ഉപയോഗിച്ച വലിയ കൈമാറ്റപാത്രങ്ങൾ എന്ന സന്ദർഭത്തിന് ‘കുട്ടകൾ’ യോജിക്കുന്നു; എന്നാൽ എബ്രായപദം നെയ്ത കുട്ടകളെ മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ലാത്തതിനാൽ അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകൾ നൽകിയിരിക്കുന്നു.
- source_word: אֵלָיו
  choice: അവന്റെ അടുക്കൽ
  rationale: സമീപസന്ദർഭത്തിൽ സർവനാമം യേഹൂവിനെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ സർവനാമരൂപം നിലനിർത്തുന്നു.
- source_word: יִזְרְעֶאלָה
  choice: യിസ്രെയേലിലുള്ള
  rationale: ദിശാസൂചക രൂപം യിസ്രെയേലിലേക്കുള്ള അയക്കലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വീകർത്താവിന്റെ അന്നത്തെ സ്ഥാനം വ്യക്തമാക്കുന്ന സ്വാഭാവിക ഘടനയാണിത്.
