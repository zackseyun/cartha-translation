  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി ഉപയോഗിച്ചു. അക്രമത്തിന്റെ തീവ്രത മയപ്പെടുത്താതെ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വാക്യഘടന നിലനിർത്തി.
