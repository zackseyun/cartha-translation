source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֥י יֵה֛וּא וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/כָל גְּבוּרָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/034.yaml
  text: The rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: യേഹൂവിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്തതൊക്കെയും അവന്റെ സകല പരാക്രമവും—ഇസ്രായേൽരാജാക്കന്മാരുടെ വൃത്താന്തപുസ്തകത്തിൽ[b] എഴുതിയിട്ടില്ലയോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ സകല വീരപ്രവൃത്തികളും.”
    reason: lexical_alternative
  - marker: b
    text: ഇത് രാജാക്കന്മാരുടെ ഭരണസംഭവങ്ങൾ രേഖപ്പെടുത്തിയിരുന്ന ഒരു രാജകീയ വൃത്താന്തഗ്രന്ഥത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വിശുദ്ധഗ്രന്ഥത്തിലെ ‘ദിനവൃത്താന്തം’ എന്ന പുസ്തകത്തെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  choice: യേഹൂവിന്റെ ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ דִּבְרֵי എന്നത് വാക്കുകളെക്കാൾ രാജാവിന്റെ പ്രവൃത്തികളെയോ കാര്യങ്ങളെയോ സൂചിപ്പിക്കുന്നു; וְיֶתֶר എന്നതിന് സ്വാഭാവികമായി ‘ശേഷിച്ച’ എന്നു നൽകി.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: כָל എന്ന സമഗ്രതയും എബ്രായ ബന്ധവാക്യത്തിന്റെ അർഥവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: അവന്റെ സകല വീര്യവും
  rationale: גְּבוּרָה ശക്തി, വീര്യം, വീരപ്രവൃത്തികൾ എന്നിവ സൂചിപ്പിക്കാം. ‘വീര്യം’ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; പ്രവൃത്തികളെന്ന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടില്ലയോ?
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന മൂലപാഠത്തിലെ ആലങ്കാരിക ചോദ്യരൂപം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: വൃത്താന്തപുസ്തകത്തിൽ
  rationale: രാജകീയ രേഖയെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ശീർഷകസദൃശ പ്രയോഗം; עַל സന്ധർഭാനുസൃതമായി ‘പുസ്തകത്തിൽ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ
  rationale: ശീർഷകത്തിൽ לְ ബന്ധമോ അനുബന്ധമോ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഉടമസ്ഥബന്ധമായി നൽകുന്നത് സ്വാഭാവികമാണ്.
