translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രാജഭരണസംഗ്രഹത്തിന്റെ ഔപചാരിക ഭാവവും മൂലത്തിലെ ആലങ്കാരിക ചോദ്യവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
