translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി ഉപയോഗിച്ചു. സൈനിക പദവികളുടെ അനിശ്ചിതത്വം അതിയായി നിർവചിക്കാതെ പ്രവർത്തനപരമായി പരിഭാഷപ്പെടുത്തി; അപൂർവമായ അവസാന വാക്യഭാഗത്തിന്റെ അർഥവൈകല്യം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
