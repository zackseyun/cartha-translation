source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/כַלֹּת֣/וֹ לַ/עֲשׂ֣וֹת הָ/עֹלָ֗ה וַ/יֹּ֣אמֶר יֵ֠הוּא לָ/רָצִ֨ים וְ/לַ/שָּׁלִשִׁ֜ים בֹּ֤אוּ הַכּוּ/ם֙ אִ֣ישׁ אַל יֵצֵ֔א וַ/יַּכּ֖וּ/ם לְ/פִי חָ֑רֶב וַ/יַּשְׁלִ֗כוּ הָֽ/רָצִים֙ וְ/הַ/שָּׁ֣לִשִׁ֔ים וַ/יֵּלְכ֖וּ עַד עִ֥יר בֵּית הַ/בָּֽעַל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
translation:
  language: ml
  text: 'ഹോമയാഗം അർപ്പിച്ചുതീർന്നപ്പോൾ, യേഹൂ കാവൽക്കാരോടും സൈനിക ഉദ്യോഗസ്ഥരോടും പറഞ്ഞു: “അകത്തു കടന്ന് അവരെ വെട്ടിവീഴ്ത്തുക; ഒരുവനും പുറത്തുവരരുത്.” അങ്ങനെ അവർ വാളിന്റെ വായ്ത്തലയാൽ അവരെ വെട്ടിവീഴ്ത്തി. കാവൽക്കാരും സൈനിക ഉദ്യോഗസ്ഥരും അവരെ പുറത്തേക്ക് എറിഞ്ഞശേഷം ബാൽക്ഷേത്രത്തിന്റെ ഉൾക്കോട്ടവരെ[a] ചെന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ “ബാലിന്റെ ഭവനത്തിന്റെ നഗരംവരെ” എന്നാണ്; ഇത് ക്ഷേത്രസമുച്ചയത്തിനുള്ളിലെ കോട്ടകെട്ടിയ ഭാഗത്തെയോ ഉൾവിശുദ്ധസ്ഥാനത്തെയോ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לַעֲשׂוֹת הָעֹלָה
  choice: ഹോമയാഗം അർപ്പിച്ചുതീർന്നപ്പോൾ
  rationale: כְּ + infinitive construct expresses the time when the action was completed; ‘അർപ്പിക്കുക’ naturally conveys the sacrificial idiom עשה + עֹלָה, and ‘ഹോമയാഗം’ is the established Malayalam cultic term.
- source_word: לָרָצִים
  choice: കാവൽക്കാരോട്
  rationale: רָצִים is literally ‘runners’ but in royal narratives commonly denotes guards or attendants; the functional Malayalam term avoids the misleading literal ‘ഓട്ടക്കാർ’.
- source_word: לַשָּׁלִשִׁים
  choice: സൈനിക ഉദ്യോഗസ്ഥരോട്
  rationale: שָׁלִישׁ denotes a military officer, perhaps originally a chariot officer; this broad rendering avoids imposing an uncertain precise rank.
- source_word: בֹּאוּ הַכּוּם
  choice: അകത്തു കടന്ന് അവരെ വെട്ടിവീഴ്ത്തുക
  rationale: The context gives בוא the sense of entering the temple area, while נכה here denotes lethal striking; the Malayalam phrasing is forceful and natural.
- source_word: אִישׁ אַל־יֵצֵא
  choice: ഒരുവനും പുറത്തുവരരുത്
  rationale: The singular אִישׁ has distributive force in the negative command; this preserves its masculine wording and emphatic prohibition.
- source_word: לְפִי חָרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ
  rationale: This preserves the vivid Hebrew idiom ‘by the mouth/edge of the sword’ in an intelligible Malayalam expression.
- source_word: וַיַּשְׁלִכוּ
  choice: അവരെ പുറത്തേക്ക് എറിഞ്ഞശേഷം
  rationale: The verb means ‘threw/cast’; the victims are the contextually implied object, and ‘പുറത്തേക്ക്’ expresses the likely disposal movement without naming ‘bodies,’ which is not explicit.
- source_word: עַד עִיר בֵּית־הַבָּעַל
  choice: ബാൽക്ഷേത്രത്തിന്റെ ഉൾക്കോട്ടവരെ
  rationale: עִיר ordinarily means ‘city’ and may here refer to an enclosed or fortified inner area of the Baal temple complex. ‘ഉൾക്കോട്ട’ suits the architectural movement in context while the literal ambiguity is retained in a footnote.
