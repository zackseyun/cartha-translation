  terminology: ‘ഹോമയാഗം,’ ‘ബാൽക്ഷേത്രം,’ and the military terminology are consistent and comprehensible. The rendering ‘ഉൾക്കോട്ട’ is interpretive but suitably qualified by the footnote, which retains the literal ‘city’ wording and the architectural uncertainty.
