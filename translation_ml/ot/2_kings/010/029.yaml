source:
  edition: WLC
  text: רַ֠ק חֲטָאֵ֞י יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל לֹֽא סָ֥ר יֵה֖וּא מֵ/אַֽחֲרֵי/הֶ֑ם עֶגְלֵי֙ הַ/זָּהָ֔ב אֲשֶׁ֥ר בֵּֽית אֵ֖ל וַ/אֲשֶׁ֥ר בְּ/דָֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
translation:
  language: ml
  text: എന്നിരുന്നാലും, നെബാത്തിന്റെ മകനായ യൊരോബെയാം ഇസ്രായേലിനെ പാപം ചെയ്യാൻ ഇടയാക്കിയ പാപങ്ങളിൽനിന്ന് യേഹൂ പിന്തിരിഞ്ഞില്ല[a]—ബേഥേലിലും ദാനിലും ഉണ്ടായിരുന്ന സ്വർണക്കാളക്കുട്ടികൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവയുടെ പിന്നാലെനിന്ന് മാറിയില്ല’; അതായത്, അവയെ ഉപേക്ഷിച്ചില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ യേഹൂവിന്റെ നടപടികൾക്ക് ഒരു നിയന്ത്രകമായ വിരുദ്ധവശം അവതരിപ്പിക്കുന്നതിനാൽ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘എന്നാൽ’ തിരഞ്ഞെടുത്തു.
- source_word: חֲטָאֵי
  choice: പാപങ്ങളിൽനിന്ന്
  rationale: യൊരോബെയാമുമായി ബന്ധപ്പെട്ട പ്രത്യേക ആരാധനാപരമായ പാപങ്ങളെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; סור מן എന്ന ഘടനയോടു ചേർന്ന് ‘പാപങ്ങളിൽനിന്ന് പിന്തിരിയുക’ സ്വാഭാവികമാണ്.
- source_word: הֶחֱטִיא
  choice: ഇസ്രായേലിനെക്കൊണ്ട് ചെയ്യിച്ച
  rationale: חטא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരകഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לֹא סָר ... מֵאַחֲרֵיהֶם
  choice: പിന്തിരിഞ്ഞില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘അവയുടെ പിന്നാലെനിന്ന് മാറിയില്ല’ എന്ന എബ്രായ പ്രയോഗം ഒരു പ്രവൃത്തി ഉപേക്ഷിക്കാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പിന്തിരിഞ്ഞില്ല’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֶגְלֵי הַזָּהָב
  choice: സ്വർണക്കാളക്കുട്ടികൾ
  rationale: യൊരോബെയാമിന്റെ പാപങ്ങളെ വിശദീകരിക്കുന്ന മൂർത്തമായ ആരാധനാവസ്തുക്കളെ നേരിട്ട് തിരിച്ചറിയിക്കുന്നു.
- source_word: אֲשֶׁר בֵּית אֵל וַאֲשֶׁר בְּדָן
  choice: ബേഥേലിലും ദാനിലും ഉണ്ടായിരുന്ന
  rationale: രണ്ട് കാളക്കുട്ടികളുടെ സ്ഥലങ്ങൾ സമാന്തരമായി വ്യക്തമാക്കുകയും എബ്രായത്തിലെ ബന്ധവാക്യങ്ങളുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: דָּן
  choice: ദാൻ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
theological_decisions:
- issue: ‘യൊരോബെയാമിന്റെ പാപങ്ങൾ’ എന്നതും ‘സ്വർണക്കാളക്കുട്ടികൾ’ എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ഡാഷിന് ശേഷമുള്ള ‘സ്വർണക്കാളക്കുട്ടികൾ’ മുൻപറഞ്ഞ പാപങ്ങളെ വിശദീകരിക്കുന്ന സമാനാധികരണ പ്രയോഗമായി നൽകി.
  alternative: വാക്യഘടനയിലെ ഇടവേളയ്ക്കുശേഷമുള്ള പുനരുക്ത വിശദീകരണമായി വേർതിരിക്കാം.
  rationale: എബ്രായവാക്യം അമൂർത്തമായ ‘പാപങ്ങൾ’ എന്നതിൽനിന്ന് അവയുടെ മൂർത്തമായ ആരാധനാപരമായ പ്രകടനങ്ങളിലേക്കു നീങ്ങുന്നു; ഡാഷ് ഈ വിശദീകരണബന്ധം അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ കാരകഭാവവും നിയന്ത്രകമായ വിരുദ്ധതയും നിലനിർത്തി; സങ്കീർണമായ എബ്രായ പ്രയോഗം അടിക്കുറിപ്പിൽ അക്ഷരാർഥത്തോടെ സൂചിപ്പിച്ചു.
