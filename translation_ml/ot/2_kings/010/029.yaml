    rationale: The Hebrew names ‘the golden calves’ as the concrete explanatory specification following the reference to Jeroboam's sins; it is not a separately repeated prepositional complement in Malayalam.
  - severity: low
    issue: ‘ഇസ്രായേലിനെക്കൊണ്ട് ചെയ്യിച്ച’ is awkward for the Hiphil ‘caused Israel to sin.’
    rationale: A Malayalam causative construction with ‘പാപം ചെയ്യാൻ ഇടയാക്കിയ’ is clearer and preserves the source's causative force without adding interpretation.
