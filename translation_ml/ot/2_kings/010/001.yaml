  text: Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
translation:
  language: ml
  text: 'ശമര്യയിൽ ആഹാബിന് എഴുപത് പുത്രന്മാർ ഉണ്ടായിരുന്നു. യേഹൂ കത്തുകൾ എഴുതി ശമര്യയിലേക്കു അയച്ചു; യിസ്രെയേലിലെ അധികാരികൾക്കും[a] മൂപ്പന്മാർക്കും ആഹാബിന്റെ പുത്രന്മാരുടെ സംരക്ഷകർക്കും[b] ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായ പാഠത്തിൽ ‘യിസ്രെയേലിലെ അധികാരികൾ’ എന്നാണ്. കത്തുകൾ ശമര്യയിലേക്കാണ് അയച്ചതെന്നതിനാൽ, ഇത് ശമര്യയിൽ താമസിച്ചിരുന്ന യിസ്രെയേലുമായി ബന്ധപ്പെട്ട അധികാരികളെ സൂചിപ്പിക്കുന്നതാണെന്ന് ചിലർ മനസ്സിലാക്കുന്നു; ചില പുരാതന വിവർത്തനങ്ങളും വ്യാഖ്യാതാക്കളും ‘ശമര്യയിലെ അധികാരികൾ’ എന്നു വായിക്കുന്നു. മുഖ്യവാചകം മസോരറ്റിക് പാഠം നിലനിർത്തുന്നു.
    reason: textual_variant
  - marker: b
    text: ‘സംരക്ഷകർ’ എന്നതിന് ‘വളർത്തച്ഛന്മാർ’ എന്നോ ‘പരിപാലകർ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ആഹാബിന്റെ പുത്രന്മാരെ വളർത്തുകയോ അവരുടെ മേൽനോട്ടം വഹിക്കുകയോ ചെയ്തവരെയാണ് ഹീബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַחְאָב
  choice: ആഹാബിന് ... ഉണ്ടായിരുന്നു
  rationale: ലാമെദ് ഉപയോഗിച്ചുള്ള ഹീബ്രായ ഉടമസ്ഥതാപ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; വാവിന്റെ സന്ദർഭമാറ്റശക്തി അനാവശ്യമായ കാലസൂചകപദം ചേർക്കാതെ സന്ദർഭത്തിൽ വിടുന്നു.
- source_word: שִׁבְעִים בָּנִים
  choice: എഴുപത് പുത്രന്മാർ
  rationale: രാജകീയ പിന്തുടർച്ചയുടെ സന്ദർഭത്തിൽ בָּנִים എന്നതിന്റെ പുരുഷലിംഗാർത്ഥം പ്രസക്തമായതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: സ്ഥലസൂചനയായ בְּ-യെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּכְתֹּב ... סְפָרִים
  choice: കത്തുകൾ എഴുതി
  rationale: ഇവിടെ סְפָרִים അയയ്ക്കപ്പെടുന്ന ലിഖിതസന്ദേശങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּשְׁלַח שֹׁמְרוֹן
  choice: ശമര്യയിലേക്ക് ... അയച്ചു
  rationale: മുൻവാക്യത്തിലെ കത്തുകളാണ് അയച്ചതെന്ന് മലയാളവാക്യഘടനയിൽ വ്യക്തമാണ്.
- source_word: אֶל שָׂרֵי יִזְרְעֶאל
  choice: യിസ്രെയേലിലെ പ്രഭുക്കന്മാർക്ക്
  rationale: שָׂרִים അധികാരസ്ഥാനത്തുള്ള നേതാക്കളെയോ ഭരണാധികാരികളെയോ സൂചിപ്പിക്കുന്നു. സ്ഥലപ്പേരിലെ മസോരറ്റിക് വായനയായ ‘യിസ്രെയേൽ’ സംശയകരമെങ്കിലും മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: הַזְּקֵנִים
  choice: മൂപ്പന്മാർക്ക്
  rationale: വയോധികരെ മാത്രം അല്ല, അംഗീകൃത സാമൂഹിക-നാഗരിക നേതാക്കളെയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: הָאֹמְנִים אַחְאָב
  choice: ആഹാബിന്റെ പുത്രന്മാരുടെ സംരക്ഷകർക്ക്
  rationale: אמן ധാതുവിൽനിന്നുള്ള രൂപം വളർത്തലിന്റെയോ മേൽനോട്ടത്തിന്റെയോ ചുമതലയുള്ളവരെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അവരുടെ ഉത്തരവാദിത്തം പുത്രന്മാരോടാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: 'അവയിൽ ഇങ്ങനെ എഴുതിയിരുന്നു:'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന കത്തിന്റെ ഉള്ളടക്കത്തിലേക്കുള്ള മാറ്റം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘പറഞ്ഞുകൊണ്ട്’ ഇവിടെ അസ്വാഭാവികമാണ്.
