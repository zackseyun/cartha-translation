translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. ‘യിസ്രെയേലിലെ പ്രഭുക്കന്മാർ’ എന്ന മസോരറ്റിക് വായന പ്രധാനവാചകത്തിൽ സംരക്ഷിച്ചു. ലഭിച്ച ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളിൽ [a] എന്നതിന്റെ ഉള്ളടക്കം യഥാർത്ഥത്തിൽ ‘യിസ്രെയേലിലെ പ്രഭുക്കന്മാർ’ എന്ന പാഠപ്രശ്നത്തെയാണ് വിവരിക്കുന്നത്, എന്നാൽ അതിന്റെ മാർക്കർ തെറ്റായി ആദ്യവാക്യത്തിന് ശേഷം നൽകിയിരിക്കുന്നു; പ്രസിദ്ധീകരണയോഗ്യമായ കരടിൽ തെറ്റായ സ്ഥാനത്തുള്ള കുറിപ്പ് ആവർത്തിക്കാതെ, ഉറപ്പുള്ള ശബ്ദാർത്ഥപരമായ കുറിപ്പ് മാത്രമാണ് [a] ആയി ചേർത്തത്.
