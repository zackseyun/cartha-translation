base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/033.yaml
  text: from the Jordan eastward[a], all the land of Gilead—the Gadites, the Reubenites, and the Manassites—from Aroer, which is by the Arnon Valley, even Gilead and Bashan.
translation:
  language: ml
  text: യോർദ്ദാനിൽനിന്ന് കിഴക്കോട്ടുള്ള ഗിലെയാദ് ദേശം മുഴുവനും—ഗാദ്യരുടെയും രൂബേന്യരുടെയും മനശ്ശെയരുടെയും പ്രദേശം—അർന്നോൻ താഴ്‌വരയ്ക്കരികെയുള്ള[a] അരോവേർ മുതൽ ഗിലെയാദും ബാശാനും വരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അർന്നോന്റെ തീരത്തുള്ള.’ എബ്രായത്തിലെ נַחַל എന്ന പദത്തിന് തോടുപാത, വാദി, താഴ്‌വര എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ
  choice: യോർദ്ദാൻമുതൽ കിഴക്കോട്ടുള്ള
  rationale: מִן അതിർത്തിയുടെ ആരംഭസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; ‘സൂര്യോദയദിക്കിലേക്ക്’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ഭൂമിശാസ്ത്രപരമായ ‘കിഴക്കോട്ട്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אֵת כָּל אֶרֶץ הַגִּלְעָד
  choice: ഗിലെയാദ് ദേശം മുഴുവനും
  rationale: മുൻവാക്യത്തിലെ ക്രിയയുടെ കർമമായി വരുന്ന മുഴുവൻ പ്രദേശവും വ്യക്തമായി സൂചിപ്പിക്കുന്നു; പ്രാദേശിക നാമം നിലനിർത്തുന്നു.
- source_word: הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי
  choice: ഗാദ്യരുടെയും രൂബേന്യരുടെയും മനശ്ശെയരുടെയും പ്രദേശം
  rationale: ഏകവചനരൂപത്തിലുള്ള ഗോത്രവിശേഷണങ്ങൾ സമൂഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഉടമസ്ഥതാസംബന്ധം ചേർത്തത് ഭൂവിഭാഗവുമായി അവയുടെ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: מֵעֲרֹעֵר
  choice: അരോവേർമുതൽ
  rationale: പ്രദേശത്തിന്റെ അതിർത്തി ആരംഭിക്കുന്ന സ്ഥലമായി അരോവേറിനെ അടയാളപ്പെടുത്തുന്നു.
- source_word: אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: അർന്നോൻ താഴ്‌വരയ്ക്കരികെയുള്ള
  rationale: עַל ഇവിടെ സ്ഥലസാമീപ്യം സൂചിപ്പിക്കുന്നതായി എടുത്തു; נַחַל എന്ന പദത്തിന്റെ താഴ്‌വര/തോടുപാത എന്ന അർഥവ്യാപ്തി കണക്കിലെടുത്ത് വായനാസൗകര്യമുള്ള ‘താഴ്‌വര’ ഉപയോഗിച്ചു.
- source_word: וְהַגִּלְעָד וְהַבָּשָׁן
  choice: ഗിലെയാദും ബാശാനുംവരെ
  rationale: പട്ടികയുടെ അവസാനത്തിൽ വരുന്ന രണ്ടു പ്രദേശങ്ങളെയും ഭൂവിസ്തൃതിയുടെ പരിധിയിൽ ഉൾപ്പെടുത്തി സ്വാഭാവിക മലയാളവാക്യമായി അവതരിപ്പിക്കുന്നു; ‘വരെ’ ആരംഭബിന്ദുവായ מֵעֲרֹעֵר-നോടു ചേർന്ന അതിർത്തിഭാവം വ്യക്തമാക്കുന്നു.
