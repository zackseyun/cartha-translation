translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി സ്വീകരിച്ചു. വാക്യം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ഭാഗമാണെന്ന ഘടന നിലനിർത്തി; ഗോത്രനാമങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ബഹുവചനസമൂഹരൂപത്തിൽ നൽകി.
