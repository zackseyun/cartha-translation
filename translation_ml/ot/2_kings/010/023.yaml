  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֥א יֵה֛וּא וִ/יהוֹנָדָ֥ב בֶּן רֵכָ֖ב בֵּ֣ית הַ/בָּ֑עַל וַ/יֹּ֜אמֶר לְ/עֹבְדֵ֣י הַ/בַּ֗עַל חַפְּשׂ֤וּ וּ/רְאוּ֙ פֶּן יֶשׁ פֹּ֤ה עִמָּ/כֶם֙ מֵ/עַבְדֵ֣י יְהוָ֔ה כִּ֛י אִם עֹבְדֵ֥י הַ/בַּ֖עַל לְ/בַדָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
translation:
  language: ml
  text: 'അപ്പോൾ യേഹൂവും രേഖാബിന്റെ മകനായ യെഹോനാദാബും ബാലിന്റെ ഭവനത്തിൽ[a] പ്രവേശിച്ചു. യേഹൂ ബാലിനെ ആരാധിക്കുന്നവരോടു പറഞ്ഞു: “നിങ്ങളുടെ ഇടയിൽ യഹോവയുടെ ദാസന്മാരിൽ ആരും ഇല്ലെന്നും ബാലിനെ ആരാധിക്കുന്നവർ മാത്രമേ ഉള്ളൂ എന്നും അന്വേഷിച്ച് ഉറപ്പാക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ബാലിന്റെ ക്ഷേത്രത്തിൽ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ബാലിന്റെ ഭവനത്തിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: പ്രവേശിച്ചു
  rationale: בוא എന്ന ക്രിയയ്ക്ക് വരുക, പോകുക, അകത്തു കടക്കുക എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ലക്ഷ്യസ്ഥാനം ഒരു കെട്ടിടമായതിനാൽ ‘പ്രവേശിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בֵּית הַבָּעַל
  choice: ബാലിന്റെ ഭവനം
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘ബാലിന്റെ വീട്/ഭവനം’ നിലനിർത്തുന്നു; ആരാധനാലയം എന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֹבְדֵי הַבַּעַל
  choice: ബാലിനെ ആരാധിക്കുന്നവർ
  rationale: עבד എന്ന പദത്തിന് ‘ദാസന്മാർ’ എന്നും ആരാധനാസന്ദർഭത്തിൽ ‘ആരാധകർ’ എന്നും അർഥമുണ്ട്. ബാലിന്റെ ആരാധനാലയത്തിൽ കൂടിയിരിക്കുന്ന മതാനുയായികളെയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ഈ രൂപം മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: חַפְּשׂוּ וּרְאוּ
  choice: അന്വേഷിച്ച് ഉറപ്പാക്കുക
  rationale: രണ്ട് ആജ്ഞകളും സൂചിപ്പിക്കുന്ന സൂക്ഷ്മപരിശോധനയും സ്ഥിരീകരണവും സ്വാഭാവികമായ മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: פֶּן יֶשׁ פֹּה
  choice: ആരും ഇല്ലെന്ന്
  rationale: മൂലത്തിലെ മുൻകരുതൽസൂചകമായ ‘ഒരുപക്ഷേ ഇവിടെ ഉണ്ടായിരിക്കാതിരിക്കാൻ’ എന്ന ആശയം, ആജ്ഞയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇല്ലെന്ന് ഉറപ്പാക്കുക’ എന്നു നൽകുന്നു.
- source_word: מֵעַבְדֵי יְהוָה
  choice: യഹോവയുടെ ദാസന്മാരിൽ ആരും
  rationale: മൂലത്തിലെ ഭാഗിക ബഹുവചനം (‘യഹോവയുടെ ദാസന്മാരിൽ ആരെങ്കിലും’) നിലനിർത്തുന്നു; עבד എന്ന സ്ഥിരപ്രയോഗത്തിന് ഇവിടെ ‘ദാസൻ’ അനുയോജ്യമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ ദൈവനാമത്തിന്റെ പരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു; ഇത് ബാലിന്റെ പേരിനോടുള്ള വ്യക്തിനാമപരമായ വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: כִּי אִם ... לְבַדָּם
  choice: മാത്രമേ ഉള്ളൂ
  rationale: ഒഴിവാക്കലും ഏകാന്തമായ ഉൾപ്പെടുത്തലും സൂചിപ്പിക്കുന്ന എബ്രായ ഘടനയുടെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ് / യാഹ്‌വെ
  rationale: ഈ വാക്യം യഹോവയോടുള്ള കൂറും ബാലിനോടുള്ള കൂറും തമ്മിൽ വേർതിരിക്കുന്നു. വ്യക്തിനാമരൂപം ആ വൈരുധ്യം നിലനിർത്തുന്നു; ‘യഹോവ’ സാധാരണ മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപമാണ്.
- issue: עבדי എന്ന പദത്തിന്റെ വ്യത്യസ്ത സന്ദർഭങ്ങളിലെ വിവർത്തനം
  choice: ബാലിനെ സംബന്ധിച്ച് ‘ആരാധിക്കുന്നവർ’; യഹോവയെ സംബന്ധിച്ച് ‘ദാസന്മാർ’
  alternative: രണ്ടിടത്തും ‘ദാസന്മാർ’ അല്ലെങ്കിൽ രണ്ടിടത്തും ‘ആരാധകർ’
  rationale: ഒരേ മൂലധാതുവിന്റെ പദപ്രയോഗബന്ധം ഭാഗികമായി കുറയുന്നുവെങ്കിലും, ബാലിന്റെ ആലയത്തിൽ കൂടിയ മതാനുയായികളെ ‘ആരാധിക്കുന്നവർ’ എന്നു പറയുന്നത് വ്യക്തമാണ്; ‘യഹോവയുടെ ദാസന്മാർ’ എന്നത് സ്ഥാപിതമായ വിശാല അർഥമുള്ള പ്രയോഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പേരുകൾ മലയാള ബൈബിൾ പ്രയോഗത്തിന് ചേർന്ന രൂപത്തിൽ നൽകി. മൂലത്തിലെ ഏകവചനമായ ‘അവൻ പറഞ്ഞു’ എന്നതിന്റെ സൂചന വ്യക്തമാക്കാൻ രണ്ടാം വാക്യത്തിൽ ‘യേഹൂ’ ആവർത്തിച്ചു.
