translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘യാഗം,’ ‘ഹോമയാഗം,’ ‘കൈകളിൽ ഏൽപ്പിക്കുക’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] എൺപതു പേരിനു പിന്നാലെയുണ്ടെങ്കിലും അതിന്റെ കുറിപ്പ് נַפְשׁוֹ תַּחַת נַפְשׁוֹ എന്ന അവസാന പ്രയോഗത്തെ വിശദീകരിക്കുന്നതിനാൽ അടയാളം അതിനോടു ചേർത്തു.
