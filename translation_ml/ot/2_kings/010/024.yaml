  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
translation:
  language: ml
  text: 'അവർ യാഗങ്ങളും ഹോമയാഗങ്ങളും അർപ്പിക്കാൻ അകത്തു ചെന്നു. യേഹൂ തനിക്കായി പുറത്തു എൺപതു പേരെ കാവലിന് നിർത്തിയിരുന്നു. അവൻ അവരോടു പറഞ്ഞു: “ഞാൻ നിങ്ങളുടെ കൈകളിൽ ഏൽപ്പിക്കുന്ന ആ ആളുകളിൽ ഒരാളെയെങ്കിലും രക്ഷപ്പെടാൻ അനുവദിക്കുന്നവൻ, രക്ഷപ്പെട്ടവന്റെ ജീവനു പകരം സ്വന്തം ജീവൻ കൊടുക്കേണ്ടിവരും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ, “അവന്റെ ജീവനു പകരം അവന്റെ ജീവൻ.” രക്ഷപ്പെടാൻ അനുവദിച്ച കാവൽക്കാരൻ രക്ഷപ്പെട്ടവന്റെ ജീവനു പകരം സ്വന്തം ജീവൻ നഷ്ടപ്പെടുത്തുമെന്നാണ് സന്ദർഭത്തിലെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: അകത്തു ചെന്നു
  rationale: בוא എന്ന ക്രിയ സന്ദർഭാനുസരണം വരുക, പോകുക, പ്രവേശിക്കുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. ഇവിടെ ആരാധനാകർമത്തിനായി അകത്തേക്കുള്ള ചലനമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלוֹת
  choice: യാഗങ്ങളും ഹോമയാഗങ്ങളും അർപ്പിക്കാൻ
  rationale: עשה എന്നത് അക്ഷരാർഥത്തിൽ ‘ചെയ്യുക’ എന്നാണെങ്കിലും യാഗങ്ങളുടെ കൂടെ വരുമ്പോൾ ‘അർപ്പിക്കുക’ എന്നതാണ് സ്വാഭാവികമായ ആചാരപരമായ അർഥം. עֹלוֹת പൂർണമായി ദഹിപ്പിക്കുന്ന ഹോമയാഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  choice: പുറത്തു എൺപതു പേരെ കാവലിനു നിർത്തിയിരുന്നു
  rationale: שׂים എന്ന ‘വെക്കുക/നിർത്തുക’ എന്ന ക്രിയയ്ക്ക് ഈ സുരക്ഷാസന്ദർഭത്തിൽ ‘കാവലിനു നിർത്തുക’ എന്ന പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമാണ്. אִישׁ എന്നത് സൈനികർ എന്നു നിർദിഷ്ടമാക്കാത്തതിനാൽ ‘പേർ’ എന്നു നിലനിർത്തി.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל יְדֵיכֶם
  choice: ഞാൻ നിങ്ങളുടെ കൈകളിൽ ഏൽപ്പിക്കുന്ന
  rationale: ‘കൈകളിലേക്കു കൊണ്ടുവരുക’ എന്ന എബ്രായ പ്രയോഗം ഒരാളുടെ അധികാരത്തിലോ കാവലിലോ ഏൽപ്പിക്കുക എന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ കൈ എന്ന രൂപകവും നിലനിർത്തുന്നു.
- source_word: הָאִישׁ אֲשֶׁר יִמָּלֵט מִן הָאֲנָשִׁים
  choice: ഈ ആളുകളിൽ ഒരാളെയെങ്കിലും രക്ഷപ്പെടാൻ അനുവദിക്കുന്നവൻ
  rationale: Niphal രൂപമായ יִמָּלֵט ‘രക്ഷപ്പെടുക’ എന്നാണ്. കാവൽക്കാരോടുള്ള മുന്നറിയിപ്പെന്ന സന്ദർഭം അവരുടെ ഉത്തരവാദിത്വം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘രക്ഷപ്പെടാൻ അനുവദിക്കുന്നവൻ’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  choice: രക്ഷപ്പെട്ടവന്റെ ജീവനു പകരം സ്വന്തം ജീവൻ കൊടുക്കേണ്ടിവരും
  rationale: נפש ഇവിടെ ‘ജീവൻ’ എന്നാണ്; תחת പകരംവയ്ക്കലിനെ സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന സർവനാമങ്ങളുടെ അവ്യക്തത ഒഴിവാക്കാൻ കാവൽക്കാരന്റെയും രക്ഷപ്പെട്ടവന്റെയും ജീവൻ വ്യക്തമായി വേർതിരിച്ചു.
