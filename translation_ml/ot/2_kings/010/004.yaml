id: 2KI.10.4
reference: 2 Kings 10:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽרְאוּ֙ מְאֹ֣ד מְאֹ֔ד וַ/יֹּ֣אמְר֔וּ הִנֵּה֙ שְׁנֵ֣י הַ/מְּלָכִ֔ים לֹ֥א עָמְד֖וּ לְ/פָנָ֑י/ו וְ/אֵ֖יךְ נַעֲמֹ֥ד אֲנָֽחְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/004.yaml
  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
translation:
  language: ml
  text: 'എന്നാൽ അവർ വളരെ, വളരെ ഭയപ്പെട്ടു. അവർ പറഞ്ഞു: “നോക്കൂ, ആ രണ്ടു രാജാക്കന്മാർക്കും അവന്റെ മുമ്പിൽ നിൽക്കാൻ കഴിഞ്ഞില്ല; പിന്നെ നമുക്ക് എങ്ങനെ നിൽക്കാൻ കഴിയും?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “അവനെ എതിർത്തുനിൽക്കാൻ കഴിഞ്ഞില്ല; പിന്നെ നമുക്ക് എങ്ങനെ അവനെ എതിർത്തുനിൽക്കാൻ കഴിയും?” രണ്ടു വാക്യഭാഗങ്ങളിലും എബ്രായം “നിൽക്കുക” എന്ന ഒരേ ക്രിയയാണ് ഉപയോഗിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: അവർ ഭയപ്പെട്ടു
  rationale: ירא എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം സൂചിപ്പിക്കുന്ന ഭയപ്രതികരണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: מְאֹד מְאֹד
  choice: വളരെ, വളരെ
  rationale: എബ്രായത്തിലെ ഇരട്ട ആവർത്തനവും അതിന്റെ ഊന്നലും ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: തുടർന്നുവരുന്ന കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ ദെയ്ക്റ്റിക് ശക്തി പഴഞ്ചൻ ശൈലിയില്ലാതെ നൽകുന്നു.
- source_word: שְׁנֵי הַמְּלָכִים
  choice: ആ രണ്ടു രാജാക്കന്മാർ
  rationale: മുമ്പ് പരാമർശിക്കപ്പെട്ട നിർദിഷ്ട രാജാക്കന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ആ’ ഈ പരാമർശബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא עָמְדוּ לְפָנָיו
  choice: അവന്റെ മുമ്പിൽ നിൽക്കാൻ കഴിഞ്ഞില്ല
  rationale: സന്ദർഭത്തിൽ വിജയകരമായി എതിർത്തുനിൽക്കാനാകാത്തതാണു സൂചന. ‘നിൽക്കുക’ എന്ന എബ്രായ പ്രതിച്ഛായയും തുടർന്നുള്ള അതേ ക്രിയയുമായുള്ള സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  choice: പിന്നെ നമുക്ക് എങ്ങനെ നിൽക്കാൻ കഴിയും?
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള നിഗമനബന്ധം ‘പിന്നെ’ വ്യക്തമാക്കുന്നു; עמד എന്ന ഒരേ ക്രിയയുടെ ആവർത്തനം ‘നിൽക്കുക’ വഴി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ആവർത്തനവും ‘നിൽക്കുക’ എന്ന രൂപകവും സംരക്ഷിച്ചിരിക്കുന്നു; സന്ദർഭാർഥമായ ‘എതിർത്തുനിൽക്കുക’ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
