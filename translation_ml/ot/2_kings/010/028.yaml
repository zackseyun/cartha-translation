source:
  edition: WLC
  text: וַ/יַּשְׁמֵ֥ד יֵה֛וּא אֶת הַ/בַּ֖עַל מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/028.yaml
  text: So Jehu destroyed Baal from Israel[a][b].
translation:
  language: ml
  text: അങ്ങനെ യേഹൂ ഇസ്രായേലിൽനിന്ന് ബാലിനെ നശിപ്പിച്ചു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തുടച്ചുനീക്കി’ അല്ലെങ്കിൽ ‘നിർമാർജനം ചെയ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ നാശമോ നീക്കമോ വരുത്തുക എന്ന ആശയം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ആ ബാൽ’ എന്നാണ്; മലയാളത്തിൽ ദേവന്റെ പേരിനൊപ്പം ആ നിർദേശകപദം സാധാരണയായി ചേർക്കാറില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: നശിപ്പിച്ചുകളഞ്ഞു
  rationale: ശׁמד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നാശമോ നീക്കമോ വരുത്തുക എന്ന ശക്തമായ അർഥം നൽകുന്നു. ‘നശിപ്പിച്ചുകളഞ്ഞു’ എന്നത് അതിന്റെ ശക്തിയും സന്ദർഭത്തിലെ നീക്കംചെയ്യൽഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יֵהוּא
  choice: യേഹൂ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്നുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: הַבַּעַל
  choice: ബാലിനെ
  rationale: എബ്രായത്തിൽ നിർദേശക ഉപപദത്തോടുകൂടിയ ‘ബാൽ’ ആണ്. ഇവിടെ ദേവന്റെ/ആരാധനാസമ്പ്രദായത്തിന്റെ പേര് വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്ന്
  rationale: מִן വേർപാടിനെയോ നീക്കത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേലിൽനിന്ന്’ അതിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: വാവ് കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുകയും മുൻസന്ദർഭത്തിന്റെ ഫലഭാവം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ‘അങ്ങനെ’ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ബാൽ’ എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: ദേവന്റെ/ആരാധനാസമ്പ്രദായത്തിന്റെ പേര് വികസിപ്പിക്കാതെ ‘ബാൽ’ എന്നു നിലനിർത്തി.
  alternative: ‘ബാൽ ആരാധന’ അല്ലെങ്കിൽ ‘ബാലിന്റെ ആരാധന’
  rationale: എബ്രായ മൂലപാഠത്തിലെ കർമം ‘ബാൽ’ എന്നതുമാത്രമാണ്. ആരാധനാസമ്പ്രദായത്തിന്റെ അടിച്ചമർത്തൽ സന്ദർഭത്തിൽ ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, അത് മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് വ്യാഖ്യാനപരമായ വികസനമായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും ശക്തിയും സൂക്ഷിച്ചിരിക്കുന്നു; ‘ബാൽ ആരാധന’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി.
