  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יֵה֗וּא יַ֤עַן אֲשֶׁר הֱטִיבֹ֨תָ֙ לַ/עֲשׂ֤וֹת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י כְּ/כֹל֙ אֲשֶׁ֣ר בִּ/לְבָבִ֔/י עָשִׂ֖יתָ לְ/בֵ֣ית אַחְאָ֑ב בְּנֵ֣י רְבִעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֥א יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/030.yaml
  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
translation:
  language: ml
  text: 'യഹ്‌വേ യേഹൂവിനോടു പറഞ്ഞു: “എന്റെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്യുന്നതിൽ നീ നന്നായി പ്രവർത്തിച്ചതിനാലും, എന്റെ ഹൃദയത്തിലുണ്ടായിരുന്നതുപോലെ എല്ലാം നീ ആഹാബിന്റെ ഭവനത്തോടു ചെയ്തതിനാലും, നിന്റെ പുത്രന്മാർ നാലാം തലമുറവരെ[a] ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “നാലാം തലമുറകളുടെ പുത്രന്മാർ”; നാലു തലമുറ നീളുന്ന ഒരു രാജവംശത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമത്തെ ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റാതെ, ഹീബ്രു നാമത്തിന്റെ സാധാരണ പണ്ഡിതീയ ഉച്ചാരണത്തോട് അടുത്ത മലയാളലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: יַעַן אֲשֶׁר
  choice: ചെയ്തതിനാൽ
  rationale: ദൈവിക പ്രഖ്യാപനത്തിനുള്ള കാരണം സൂചിപ്പിക്കുന്ന ഹീബ്രു ബന്ധകത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֱטִיבֹתָ לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: എന്റെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്യുന്നതിൽ നീ നന്നായി പ്രവർത്തിക്കുകയും
  rationale: Jehuവിന്റെ നിർദിഷ്ട പ്രവൃത്തിയെ അഭിനന്ദിക്കുന്ന הֱטִיבֹתָ എന്ന രൂപവും ‘എന്റെ ദൃഷ്ടിയിൽ ശരിയായത്’ എന്ന ഹീബ്രു വിലയിരുത്തൽപ്രയോഗവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: כְּכֹל אֲשֶׁר בִּלְבָבִי
  choice: എന്റെ ഹൃദയത്തിലുണ്ടായിരുന്നതെല്ലാം അനുസരിച്ച്
  rationale: לֵבָב ഉദ്ദേശ്യം, ഇച്ഛ, അന്തർനിശ്ചയം എന്നിവ സൂചിപ്പിക്കാമെങ്കിലും, മൂലത്തിലെ ‘ഹൃദയം’ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: עָשִׂיתָ לְבֵית אַחְאָב
  choice: ആഹാബിന്റെ ഭവനത്തോടു ചെയ്യുകയും
  rationale: ‘ഭവനം’ എന്നത് ഇവിടെ ആഹാബിന്റെ രാജവംശത്തെയും കുടുംബരേഖയെയും സൂചിപ്പിക്കുന്ന രൂപകമാണ്; എന്താണ് ചെയ്തതെന്ന് അധികമായി വിശദീകരിക്കാതെ ഹീബ്രുവിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: בְּנֵי רְבִעִים
  choice: നിന്റെ പുത്രന്മാർ നാലാം തലമുറവരെ
  rationale: അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമായ ‘നാലാമന്മാരുടെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രാജവംശപരമായ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘പുത്രന്മാർ’ എന്ന മൂലപദവും നിലനിർത്തുന്നു.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരിക്കും
  rationale: രാജഭരണത്തെ സൂചിപ്പിക്കുന്ന ‘സിംഹാസനത്തിൽ ഇരിക്കുക’ എന്ന മൂലരൂപകം നിലനിർത്തുന്നു; לְךָയുടെ രാജവംശപരമായ ഗുണഭോക്തൃഭാവം ‘നിന്റെ പുത്രന്മാർ’ എന്നതിലൂടെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
theological_decisions:
- issue: യേഹൂവിന്റെ പ്രവൃത്തികൾക്കുള്ള ദൈവിക അംഗീകാരം
  choice: ആഹാബിന്റെ ഭവനത്തോടു ചെയ്ത കാര്യവുമായി ബന്ധപ്പെട്ട ദൈവിക അഭിനന്ദനം വാക്യം പറയുന്നതുപോലെ നേരിട്ട് നിലനിർത്തി.
  alternative: യേഹൂവിന്റെ പ്രവൃത്തികളിലെ ധാർമിക സംഘർഷം കുറയ്ക്കാൻ അഭിനന്ദനം മയപ്പെടുത്തുക, അല്ലെങ്കിൽ അവന്റെ മുഴുവൻ ഭരണത്തിനുമുള്ള സമഗ്ര അംഗീകാരമായി വികസിപ്പിക്കുക.
  rationale: ഹീബ്രു പാഠം ആഹാബിന്റെ ഭവനത്തിനെതിരായ വിധി നടപ്പാക്കിയ പ്രത്യേക കാര്യത്തിൽ യേഹൂ നന്നായി പ്രവർത്തിച്ചുവെന്ന് പറയുന്നു. അതിനെ മയപ്പെടുത്തുകയോ യേഹൂവിന്റെ എല്ലാ പ്രവൃത്തികളിലേക്കും വ്യാപിപ്പിക്കുകയോ ചെയ്യാതെ പാഠത്തിന്റെ പരിധിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം ഉപയോഗിച്ചു. ‘ദൃഷ്ടി,’ ‘ഹൃദയം,’ ‘ഭവനം,’ ‘സിംഹാസനത്തിൽ ഇരിക്കുക’ എന്നീ പ്രധാന ഹീബ്രു രൂപകങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ അടയാളം അത് വിശദീകരിക്കുന്ന ‘നാലാം തലമുറവരെ’ എന്ന വാക്യഭാഗത്തോടു ചേർത്തു.
