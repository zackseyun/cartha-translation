id: 2KI.10.32
reference: 2 Kings 10:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֔ה לְ/קַצּ֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יַּכֵּ֥/ם חֲזָאֵ֖ל בְּ/כָל גְּב֥וּל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/032.yaml
  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
translation:
  language: ml
  text: അക്കാലത്ത് യഹ്‌വേ ഇസ്രായേലിനെ വെട്ടിക്കുറയ്ക്കാൻ തുടങ്ങി.[a] ഹസായേൽ ഇസ്രായേലിന്റെ പ്രദേശത്തെങ്ങും[b] അവരെ പ്രഹരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേലിന്റെ ഭാഗങ്ങൾ വെട്ടിമാറ്റാൻ തുടങ്ങി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ ഇവിടെ ഇസ്രായേൽ ക്രമേണ ചെറുതാകാൻ തുടങ്ങിയതിനെ—സാധ്യതയനുസരിച്ച് പ്രദേശങ്ങൾ നഷ്ടപ്പെട്ടതിനെ—സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ അതിർത്തിയിലുടനീളം’ എന്നും വരാം. എബ്രായപദത്തിന് ‘അതിർത്തി’ എന്നും ‘പ്രദേശം’ എന്നും അർഥമുണ്ട്; ഇവിടെ ഇസ്രായേലിന്റെ അധീനപ്രദേശത്തിന്റെ മുഴുവൻ വ്യാപ്തിയെയാണ് സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: അക്കാലത്ത്
  rationale: ബഹുവചനരൂപമുള്ള എബ്രായ കാലസൂചനയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הֵחֵל
  choice: തുടങ്ങി
  rationale: പ്രവൃത്തിയുടെ ആരംഭം സൂചിപ്പിക്കുന്ന ഹിഫീൽ രൂപത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ വെട്ടിക്കുറയ്ക്കാൻ
  rationale: പൂർണനാശത്തേക്കാൾ ക്രമേണ ഭാഗങ്ങൾ നഷ്ടപ്പെടുത്തി ചെറുതാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന വെട്ടൽരൂപകം നിലനിർത്തുന്നു; ബാധിക്കപ്പെടുന്ന വസ്തുവായി ഇസ്രായേലിനെ അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּכֵּם
  choice: അവരെ പ്രഹരിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ ശക്തിയും മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയവും നിലനിർത്തുന്നു; ‘തോൽപ്പിച്ചു’ എന്നതിനെക്കാൾ മൂലത്തിലെ പ്രഹരരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: חֲזָאֵל
  choice: ഹസായേൽ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ശബ്ദരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പ്രദേശത്തെങ്ങും
  rationale: גְּבוּל എന്ന പദത്തിന് അതിർത്തി എന്നും അധീനപ്രദേശം എന്നും അർഥമാകാം; സൈനിക-ഭൗമിക സന്ദർഭത്തിൽ ആക്രമണം ഇസ്രായേലിന്റെ അധീനപ്രദേശത്തിന്റെ വ്യാപ്തിയിലാകെ നടന്നതായി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കുന്നില്ല; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ഹീബ്രു നാമത്തിന്റെ സാധ്യതയേറിയ ഉച്ചാരണത്തെ ‘യഹ്‌വേ’ അടുത്തായി പ്രതിനിധീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വെട്ടിക്കുറയ്ക്കാൻ’ എന്ന രൂപകം മൂലത്തിലെ ക്രമേണയുള്ള കുറവ് നിലനിർത്തുന്നു; അടിക്കുറിപ്പുകൾ യഥാർത്ഥ പദാർഥവൈകല്യങ്ങൾ തുറന്നുവെക്കുന്നു.
