id: 2KI.10.27
reference: 2 Kings 10:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּתְּצ֔וּ אֵ֖ת מַצְּבַ֣ת הַ/בָּ֑עַל וַֽ/יִּתְּצוּ֙ אֶת בֵּ֣ית הַ/בַּ֔עַל וַ/יְשִׂמֻ֥/הוּ ל/מחראות עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/027.yaml
  text: They tore down the pillar of Baal[a], and they tore down the house of Baal, and made it a latrine to this day.
translation:
  language: ml
  text: ബാലിന്റെ സ്തംഭം അവർ ഇടിച്ചുതകർത്തു. ബാലിന്റെ ഭവനവും[a] അവർ ഇടിച്ചുതകർത്ത് അതിനെ മലവിസർജനസ്ഥലമാക്കി; ഇന്നുവരെയും അങ്ങനെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബാലിന്റെ ക്ഷേത്രം.” എബ്രായത്തിൽ അക്ഷരാർഥം, “ബാലിന്റെ ഭവനം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּצוּ
  choice: ഇടിച്ചുതകർത്തു
  rationale: נתץ ഒരു ഘടനയെയോ ആരാധനാസംബന്ധമായ വസ്തുവെയോ ബലമായി തകർത്തുകളയുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്തംഭത്തിനും ആലയത്തിനും യോജിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: מַצְּבַת
  choice: സ്തംഭം
  rationale: מַצֵּבָה ഇവിടെ ബാലിനോടു ബന്ധപ്പെട്ട ആരാധനാപരമായ നാട്ടുകല്ലിനെയോ സ്തംഭത്തെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭം അതിന്റെ ആരാധനാപരമായ സ്വഭാവം വ്യക്തമാക്കുന്നതിനാൽ ലളിതമായ ‘സ്തംഭം’ മതിയാകുന്നു.
- source_word: הַבָּעַל
  choice: ബാൽ
  rationale: ഇവിടെ בעל കനാന്യദേവന്റെ പേരോ സ്ഥാനപ്പേരോ ആണ്; അതിനാൽ പേര് ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֵּית הַבַּעַל
  choice: ബാലിന്റെ ആലയം
  rationale: בַּיִת എന്നതിന്റെ അക്ഷരാർഥം ‘ഭവനം’ ആണെങ്കിലും ആരാധനാസന്ദർഭത്തിൽ അത് ക്ഷേത്രത്തെയോ ആരാധനാലയത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ആലയം’ അർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥവും മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיְשִׂמֻהוּ
  choice: അതിനെ ... ആക്കി
  rationale: שׂוּם + ל എന്ന ഘടന എന്തിനെയെങ്കിലും മറ്റൊന്നാക്കി മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഏകവചന പ്രത്യയം അടുത്തുള്ള ബാലിന്റെ ആലയത്തെയോ ആ സ്ഥലത്തെയോ തിരിച്ചുസൂചിപ്പിക്കുന്നു.
- source_word: למחראות
  choice: ഒരു കക്കൂസാക്കി
  rationale: ഈ പദം മലവിസർജനസ്ഥലത്തെയോ ശൗചാലയത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കക്കൂസ്’ സാധാരണക്കാർക്ക് വ്യക്തവും മൂലപാഠത്തിലെ മനഃപൂർവമായ അശുദ്ധീകരണത്തിന്റെ ശക്തി മറച്ചുവയ്ക്കാത്തതുമാണ്.
- source_word: עַד הַיּוֹם
  choice: ഇന്നുവരെയും
  rationale: വിവരിക്കുന്ന അവസ്ഥ ആഖ്യാതാവിന്റെ കാലംവരെ തുടർന്നുവെന്നു സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ ശൈലിയാണിത്.
theological_decisions:
- issue: ബാലിന്റെ ആരാധനാലയത്തെ സൂചിപ്പിക്കുന്ന בֵּית הַבַּעַל എന്ന പ്രയോഗം
  choice: ബാലിന്റെ ആലയം
  alternative: ബാലിന്റെ ക്ഷേത്രം; അക്ഷരാർഥത്തിൽ ‘ബാലിന്റെ ഭവനം’
  rationale: ആരാധനാസന്ദർഭം വ്യക്തമായി നൽകുന്നതിനൊപ്പം ‘ക്ഷേത്രം’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ വാസ്തുശാസ്ത്രപദം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതിരിക്കാനാണ് ‘ആലയം’ തെരഞ്ഞെടുത്തത്. എബ്രായത്തിലെ രൂപകം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: למחראות എന്ന അശുദ്ധീകരണപദത്തിന്റെ വിവർത്തനം
  choice: ഒരു കക്കൂസാക്കി
  alternative: ഒരു ശൗചാലയമാക്കി; മലവിസർജനസ്ഥലമാക്കി
  rationale: ബാൽ ആരാധനാസ്ഥലത്തിന്റെ സമ്പൂർണ അപമാനവും അശുദ്ധീകരണവും പാഠം നേരിട്ട് പറയുന്നു. അതിന്റെ ശക്തി മയപ്പെടുത്താതെയും പുരാതനപദം ഉപയോഗിക്കാതെയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള നശിപ്പിക്കൽ ക്രിയ മലയാളത്തിലും നിലനിർത്തി. അവസാനത്തെ ഏകവചനസൂചനയുടെ സാധ്യത അനാവശ്യമായി വിശദീകരിക്കാതെ ‘അതിനെ’ എന്നു സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പുസൂചകം ആശയപരമായി തെറ്റായ സ്ഥാനത്താണെന്നു തോന്നുന്നതിനാൽ, അതിന്റെ ഉള്ളടക്കവുമായി യോജിക്കുന്ന ‘ബാലിന്റെ ആലയം’ എന്ന പ്രയോഗത്തിനു പിന്നാലെ [a] ചേർത്തു.
