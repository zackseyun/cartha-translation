- from: ബാലിന്റെ സ്തംഭം അവർ ഇടിച്ചുതകർത്തു. ബാലിന്റെ ആലയവും[a] അവർ ഇടിച്ചുതകർത്ത് അതിനെ ഒരു കക്കൂസാക്കി; ഇന്നുവരെയും അത് അങ്ങനെതന്നെ തുടരുന്നു.
  to: ബാലിന്റെ സ്തംഭം അവർ ഇടിച്ചുതകർത്തു. ബാലിന്റെ ഭവനവും[a] അവർ ഇടിച്ചുതകർത്ത് അതിനെ മലവിസർജനസ്ഥലമാക്കി; ഇന്നുവരെയും അങ്ങനെതന്നെ.
