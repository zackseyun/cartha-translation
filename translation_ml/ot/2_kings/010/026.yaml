source:
  edition: WLC
  text: וַ/יֹּצִ֛אוּ אֶת מַצְּב֥וֹת בֵּית הַ/בַּ֖עַל וַֽ/יִּשְׂרְפֽוּ/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/026.yaml
  text: Then they brought out the pillars of the house of Baal and burned them[a][b][c].
translation:
  language: ml
  text: പിന്നെ അവർ ബാലിന്റെ ആലയത്തിലെ സ്തംഭങ്ങൾ[a][b] പുറത്തുകൊണ്ടുവന്ന് അവയെ ചുട്ടുകളഞ്ഞു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പൂജാസ്തംഭങ്ങൾ’ അല്ലെങ്കിൽ ‘നാട്ടിയ കല്ലുകൾ.’ എബ്രായപദം ആരാധനയുമായി ബന്ധപ്പെട്ട് നാട്ടിയ കൽസ്തംഭങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ബാലിന്റെ വീട്’; അഥവാ ‘ബാലിന്റെ ക്ഷേത്രം.’
    reason: lexical_alternative
  - marker: c
    text: ‘ചുട്ടുകളഞ്ഞു’ എന്ന ക്രിയയോടു ചേർന്ന എബ്രായ കർമപ്രത്യയം ഏകവചനത്തിലാണ് (‘അതിനെ ചുട്ടുകളഞ്ഞു’), എന്നാൽ അതിനു മുമ്പുള്ള ‘സ്തംഭങ്ങൾ’ ബഹുവചനമാണ്. ഇവിടെ അവയെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം; അതിനാൽ മുഖ്യവാചകത്തിൽ ‘അവയെ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצִאוּ
  choice: പിന്നെ അവർ ... പുറത്തുകൊണ്ടുവന്നു
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘പുറത്തുകൊണ്ടുവരുക’ എന്നാണ്; തുടർച്ചയായ കഥാക്രമം സ്വാഭാവിക മലയാളത്തിൽ ‘പിന്നെ’ എന്നു നൽകി.
- source_word: מַצְּבוֹת
  choice: സ്തംഭങ്ങൾ
  rationale: ഈ പദം ആരാധനയുമായി ബന്ധപ്പെട്ട് നാട്ടിയ കല്ലുകളെയോ പൂജാസ്തംഭങ്ങളെയോ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ‘സ്തംഭങ്ങൾ’ ഉപയോഗിച്ച് കൂടുതൽ വ്യക്തമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: בֵּית הַבַּעַל
  choice: ബാലിന്റെ ആലയം
  rationale: בַּיִת അക്ഷരാർഥത്തിൽ ‘വീട്’ എന്നാണെങ്കിലും ആരാധനാസന്ദർഭത്തിൽ ക്ഷേത്രത്തെയോ ആലയത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ബാലിന്റെ ആലയം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וַיִּשְׂרְפוּהָ
  choice: അവയെ ചുട്ടുകളഞ്ഞു
  rationale: എബ്രായ ക്രിയയിലെ കർമപ്രത്യയം ഏകവചന സ്ത്രീലിംഗമാണെങ്കിലും മുമ്പുള്ള ‘സ്തംഭങ്ങൾ’ ബഹുവചനമാണ്. ഉദ്ദേശ്യം വ്യക്തമായി അറിയിക്കാൻ മലയാളത്തിൽ ബഹുവചനമായ ‘അവയെ’ സ്വീകരിച്ചു; രൂപപരമായ പൊരുത്തക്കേട് അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥാശൈലി. മൂലത്തിലെ ആരാധനാസംബന്ധമായ സാങ്കേതിക പദത്തിന്റെയും ഏകവചന കർമപ്രത്യയത്തിന്റെയും അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
