  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ יֵהוּא֙ עַל יִשְׂרָאֵ֔ל עֶשְׂרִ֥ים וּ/שְׁמֹנֶֽה שָׁנָ֖ה בְּ/שֹׁמְרֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/036.yaml
  text: The time that Jehu reigned over Israel was twenty-eight years in Samaria.
translation:
  language: ml
  text: യേഹൂ ശമര്യയിൽ ഇസ്രായേലിനെ ഭരിച്ച കാലം ഇരുപത്തെട്ട് വർഷമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: കാലം
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങൾ’ എന്നാണെങ്കിലും, രാജവാഴ്ചയുടെ ദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഈ എബ്രായ പ്രയോഗത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ സമാനരൂപം ‘കാലം’ ആണ്.
- source_word: אֲשֶׁר מָלַךְ
  choice: ഭരിച്ച
  rationale: മָלַךְ രാജാവായി വാഴുകയോ ഭരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; വാക്യത്തിൽ യേഹൂവിന്റെ രാജവാഴ്ചയെ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കാൻ ‘ഭരിച്ച’ എന്നു നൽകി.
- source_word: יֵהוּא
  choice: യേഹൂ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തോടു ചേർന്ന ലിപ്യന്തരണം.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ
  rationale: מָלַךְ എന്ന ക്രിയയോടുകൂടിയ עַל ഇവിടെ ഭരണാധികാരത്തിന്റെ വിഷയമായ ജനതയെയോ രാജ്യത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇസ്രായേലിനെ ഭരിച്ചു’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: עֶשְׂרִים וּשְׁמֹנֶה שָׁנָה
  choice: ഇരുപത്തിയെട്ടു വർഷം
  rationale: രാജവാഴ്ചയുടെ ദൈർഘ്യം വ്യക്തമാക്കുന്ന സംഖ്യാവാക്യത്തിന്റെ നേരിട്ടുള്ള മലയാള പരിഭാഷ.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: בְּ സ്ഥലം സൂചിപ്പിക്കുന്നു; ശമര്യ യേഹൂവിന്റെ ഭരണകേന്ദ്രമായിരുന്നുവെന്ന അർഥത്തിൽ ‘ശമര്യയിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ രാജവാഴ്ചാ-സംഗ്രഹ സൂത്രവാക്യത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് ‘ദിവസങ്ങൾ’ എന്ന അക്ഷരാർഥത്തിനു പകരം സ്വാഭാവികമായ ‘കാലം’ ഉപയോഗിച്ചു. ‘ശമര്യയിൽ’ എന്നത് യേഹൂ ഭരിച്ച സ്ഥലത്തോട് വ്യക്തമായി ബന്ധിപ്പിച്ചു.
