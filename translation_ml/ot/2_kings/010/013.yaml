translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും രാജകീയ വിവരണത്തിന് യോജിച്ച മാന്യമായ ശൈലി പാലിച്ചു. സംഭാഷണം സ്വാഭാവികമാക്കി; ഉറവിടത്തിലെ ബന്ധുത്വപദം, ഭൂമിശാസ്ത്രപരമായ ‘ഇറങ്ങിവരൽ’, രാജസഭാപദവി എന്നിവ സംരക്ഷിച്ചു.
