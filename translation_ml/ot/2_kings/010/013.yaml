  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֵה֗וּא מָצָא֙ אֶת אֲחֵי֙ אֲחַזְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּ֖אמֶר מִ֣י אַתֶּ֑ם וַ/יֹּאמְר֗וּ אֲחֵ֤י אֲחַזְיָ֨הוּ֙ אֲנַ֔חְנוּ וַ/נֵּ֛רֶד לִ/שְׁל֥וֹם בְּנֵֽי הַ/מֶּ֖לֶךְ וּ/בְנֵ֥י הַ/גְּבִירָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
translation:
  language: ml
  text: 'യെഹൂദാരാജാവായ അഹസ്യാവിന്റെ സഹോദരന്മാരെ[a] യേഹൂ കണ്ടു. അവൻ അവരോട്, “നിങ്ങൾ ആരാണ്?” എന്നു ചോദിച്ചു. അവർ പറഞ്ഞു: “ഞങ്ങൾ അഹസ്യാവിന്റെ സഹോദരന്മാരാണ്. രാജാവിന്റെ പുത്രന്മാരുടെയും രാജമാതാവിന്റെ[c] പുത്രന്മാരുടെയും ക്ഷേമം അന്വേഷിക്കാൻ[b] ഞങ്ങൾ ഇറങ്ങിവന്നതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അഹസ്യാവിന്റെ സഹോദരന്മാർ’ എന്നാണ് എബ്രായത്തിൽ. രാജകീയ വിവരണങ്ങളിൽ ഈ പ്രയോഗം സ്വന്തം സഹോദരന്മാരെ മാത്രമല്ല, അടുത്ത ബന്ധുക്കളെയോ കുടുംബാംഗങ്ങളെയോ കൂടി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘രാജാവിന്റെ പുത്രന്മാരും രാജമാതാവിന്റെ പുത്രന്മാരും സുഖമായിരിക്കുന്നുവോ എന്നു കാണാൻ.’
    reason: lexical_alternative
  - marker: c
    text: ‘രാജമാതാവ്’ എന്നത് എബ്രായത്തിലെ ഗെവീരാ എന്ന പദത്തിന്റെ പരിഭാഷയാണ്; രാജാവിന്റെ അമ്മയ്ക്കുള്ള രാജസഭാപദവിയാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: מָצָא
  choice: കണ്ടു
  rationale: ഇവിടെ ക്രിയ യേഹൂ അവരെ വഴിയിൽ കണ്ടെത്തിയതോ നേരിട്ടതോ സൂചിപ്പിക്കുന്നു. അന്വേഷിച്ചു കണ്ടെത്തി എന്ന അധികധ്വനി ഒഴിവാക്കി, സ്വാഭാവികവും നേരിട്ടതുമായ ‘കണ്ടു’ സ്വീകരിച്ചു.
- source_word: אֲחֵי אֲחַזְיָהוּ
  choice: അഹസ്യാവിന്റെ സഹോദരന്മാർ
  rationale: എബ്രായപദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘സഹോദരന്മാർ’ നിലനിർത്തുന്നു; രാജകീയ വിവരണത്തിൽ അത് അടുത്ത ബന്ധുക്കളെയും സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവ്
  rationale: രാജകീയ പദവിയെ മലയാളത്തിൽ സ്വാഭാവികമായ സമാസരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִי אַתֶּם
  choice: നിങ്ങൾ ആരാണ്?
  rationale: എബ്രായത്തിലെ ലളിതവും നേരിട്ടതുമായ ചോദ്യത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: וַנֵּרֶד
  choice: ഞങ്ങൾ ഇറങ്ങിവന്നതാണ്
  rationale: സംസാരിക്കുന്നവരുടെ ഇപ്പോഴത്തെ സ്ഥാനത്തേക്കുള്ള ഭൂമിശാസ്ത്രപരമായ ഇറക്കം സൂക്ഷിക്കുന്നു.
- source_word: לִשְׁלוֹם
  choice: ക്ഷേമം അന്വേഷിക്കാൻ
  rationale: വെറും അഭിവാദ്യം ചെയ്യുക എന്നതിലുപരി അവരുടെ സുഖവിവരം അന്വേഷിക്കുക എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു; അടുത്ത അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ പുത്രന്മാർ
  rationale: ‘പുത്രന്മാർ’ എന്ന എബ്രായത്തിലെ ലിംഗനിർദിഷ്ട പദം പൊതുവായ ‘മക്കൾ’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: הַגְּבִירָה
  choice: രാജമാതാവ്
  rationale: യെഹൂദയിലെ രാജസഭാസന്ദർഭത്തിൽ രാജാവിന്റെ അമ്മയ്ക്കുള്ള ഔദ്യോഗിക പദവിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: וּבְנֵי הַגְּבִירָה
  choice: രാജമാതാവിന്റെ പുത്രന്മാർ
  rationale: ‘രാജാവിന്റെ പുത്രന്മാർ’ എന്ന മുൻവാക്യാംശത്തോടുള്ള എബ്രായ സമാന്തരഘടന നിലനിർത്തുന്നു.
