- from: “ഇപ്പോൾ ബാലിന്റെ എല്ലാ പ്രവാചകന്മാരെയും അവന്റെ എല്ലാ ആരാധകരെയും എല്ലാ പുരോഹിതന്മാരെയും എന്റെ അടുക്കൽ വിളിച്ചുകൂട്ടുക. ഒരാൾപോലും വിട്ടുപോകരുത്; കാരണം ഞാൻ ബാലിന് ഒരു മഹായാഗം അർപ്പിക്കാനിരിക്കുന്നു. വരാതിരിക്കുന്ന ആരും ജീവനോടെ ഇരിക്കുകയില്ല.” എന്നാൽ ബാലിന്റെ ആരാധകരെ നശിപ്പിക്കേണ്ടതിന് യേഹൂ ഇത് വഞ്ചനയോടെ[a] ചെയ്തതായിരുന്നു.
