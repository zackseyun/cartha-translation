  text: וְ/עַתָּ֣ה כָל נְבִיאֵ֣י הַ/בַּ֡עַל כָּל עֹבְדָ֣י/ו וְ/כָל כֹּהֲנָי/ו֩ קִרְא֨וּ אֵלַ֜/י אִ֣ישׁ אַל יִפָּקֵ֗ד כִּי֩ זֶ֨בַח גָּד֥וֹל לִ/י֙ לַ/בַּ֔עַל כֹּ֥ל אֲשֶׁר יִפָּקֵ֖ד לֹ֣א יִֽחְיֶ֑ה וְ/יֵהוּא֙ עָשָׂ֣ה בְ/עָקְבָּ֔ה לְמַ֥עַן הַאֲבִ֖יד אֶת עֹבְדֵ֥י הַ/בָּֽעַל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
translation:
  language: ml
  text: “ഇപ്പോൾ ബാലിന്റെ എല്ലാ പ്രവാചകന്മാരെയും അവന്റെ എല്ലാ ആരാധകരെയും അവന്റെ എല്ലാ പുരോഹിതന്മാരെയും എന്റെ അടുക്കൽ വിളിച്ചുകൂട്ടുക. ഒരാൾപോലും കാണാതിരിക്കരുത്; കാരണം ബാലിനുവേണ്ടി എനിക്ക് ഒരു വലിയ ബലിയുണ്ട്. കാണാതിരിക്കുന്ന ആരും ജീവനോടെ ഇരിക്കുകയില്ല.” എന്നാൽ ബാലിന്റെ ആരാധകരെ നശിപ്പിക്കേണ്ടതിന് യേഹൂ ഇത് വഞ്ചനയോടെ[a] ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കപടതയോടെ” / “തന്ത്രപൂർവം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: വാക്യാരംഭത്തിലെ וְעַתָּה എന്ന വ്യക്തമായ കാലസൂചകത്തെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: נְבִיאֵי הַבַּעַל
  choice: ബാലിന്റെ എല്ലാ പ്രവാചകന്മാരെയും
  rationale: Construct ബന്ധവും ആരാധനാസംബന്ധിയായ സൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עֹבְדָיו
  choice: അവന്റെ എല്ലാ ആരാധകരെയും
  rationale: ഇവിടെ עבד ബാലിനോടുള്ള ആരാധനാപരമായ സേവനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ ‘ആരാധകർ’ വ്യക്തമാണ്.
- source_word: כֹּהֲנָיו
  choice: എല്ലാ പുരോഹിതന്മാരെയും
  rationale: ബാലിന്റെ ആരാധനാക്രമത്തിലെ ഔദ്യോഗിക ശുശ്രൂഷകരെ സൂചിപ്പിക്കുന്ന പതിവ് പദം.
- source_word: קִרְאוּ אֵלַי
  choice: എന്റെ അടുക്കൽ വിളിച്ചുകൂട്ടുക
  rationale: ആളുകളെ യേഹൂവിന്റെ സന്നിധിയിലേക്ക് വിളിച്ചുവരുത്തുന്ന ബഹുവചന ആജ്ഞയുടെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִישׁ אַל יִפָּקֵד
  choice: ഒരാൾപോലും വിട്ടുപോകരുത്
  rationale: ഹാജർപരിശോധനയിൽ ഒരാളും കാണാതിരിക്കരുത് എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഏകവചനത്തിന്റെ വ്യക്തിവ്യക്തിയായ ഊന്നൽ ‘ഒരാൾപോലും’ നിലനിർത്തുന്നു.
- source_word: זֶבַח גָּדוֹל
  choice: ഒരു മഹായാഗം
  rationale: യാഗത്തിന്റെ വലിപ്പമോ പ്രാധാന്യമോ സൂചിപ്പിക്കുന്ന ഗָּדוֹל എന്ന പദത്തിന്റെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പരിഭാഷ.
- source_word: כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  choice: വരാതിരിക്കുന്ന ആരും ജീവനോടെ ഇരിക്കുകയില്ല
  rationale: മുമ്പത്തെ ഹാജർസന്ദർഭത്തിലെ פקד-ന്റെ അർത്ഥം നിലനിർത്തുകയും ഭീഷണിയുടെ കടുപ്പം നേരിട്ട് പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בְעָקְבָה
  choice: വഞ്ചനയോടെ
  rationale: ഈ അപൂർവ നാമത്തിന്റെ ‘വഞ്ചന/കപടത/തന്ത്രം’ എന്ന അർത്ഥപരിധിയിൽ നാരായകന്റെ പ്രതികൂല വിലയിരുത്തൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לְמַעַן הַאֲבִיד
  choice: നശിപ്പിക്കേണ്ടതിന്
  rationale: Hiphil infinitive ഉൾപ്പെട്ട ഉദ്ദേശ്യവാക്യം ശക്തവും നേരിട്ടുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: യേഹൂവിന്റെ നടപടിയെക്കുറിച്ചുള്ള നാരായകന്റെ വിലയിരുത്തൽ
  choice: യേഹൂ ഇത് വഞ്ചനയോടെ ചെയ്തതായിരുന്നു
  alternative: യേഹൂ ഇത് തന്ത്രപൂർവം ചെയ്തതായിരുന്നു
  rationale: בְעָקְבָה എന്നത് വെറും ബുദ്ധികൗശലമല്ല, വഞ്ചനാപരമായ തന്ത്രവും സൂചിപ്പിക്കുന്നു. യേഹൂവിന്റെ പ്രവൃത്തിയെ ന്യായീകരിക്കാതെ പാഠത്തിലെ നൈതിക സംഘർഷം നിലനിർത്തുന്നു.
- issue: אִישׁ എന്ന ഏകവചന പുല്ലിംഗരൂപം
  choice: ഒരാൾപോലും വിട്ടുപോകരുത്
  alternative: ആരും വിട്ടുപോകരുത്
  rationale: മലയാളത്തിൽ അനാവശ്യമായി ലിംഗം ചേർക്കാതെ, ഓരോ വ്യക്തിയെയും പ്രത്യേകം ഉൾക്കൊള്ളുന്ന എബ്രായ ഏകവചനത്തിന്റെ ഊന്നൽ ‘ഒരാൾപോലും’ വഴി സംരക്ഷിക്കുന്നു.
- issue: ലക്ഷ്യമിട്ടവരുടെ മതപരമായ തിരിച്ചറിയൽ
  choice: ബാലിന്റെ ആരാധകർ
  alternative: ബാലിന്റെ ദാസന്മാർ
  rationale: עבד എന്ന പദത്തിന്റെ പൊതുവായ ‘സേവിക്കുക’ എന്ന അർത്ഥത്തേക്കാൾ ഈ സന്ദർഭത്തിലെ ആരാധനാപരമായ അർത്ഥം വ്യക്തമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള കഥനശൈലി. ആജ്ഞയും ഭീഷണിയും നേരിട്ട് നിലനിർത്തിയിട്ടുണ്ട്. WLC-യിലെ വ്യക്തമായ וְעַתָּה പരിഗണിച്ച് ‘ഇപ്പോൾ’ ഉൾപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
