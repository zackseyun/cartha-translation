  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֤א הַ/מַּלְאָךְ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר הֵבִ֖יאוּ רָאשֵׁ֣י בְנֵֽי הַ/מֶּ֑לֶךְ וַ/יֹּ֗אמֶר שִׂ֣ימוּ אֹתָ֞/ם שְׁנֵ֧י צִבֻּרִ֛ים פֶּ֥תַח הַ/שַּׁ֖עַר עַד הַ/בֹּֽקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/008.yaml
  text: The messenger came and told him[a], saying, “They have brought the heads of the king’s sons.” And he said, “Put them in two heaps at the entrance of the gate until morning.”
translation:
  language: ml
  text: 'സന്ദേശവാഹകൻ വന്ന് അവനോട് ഇങ്ങനെ അറിയിച്ചു: “രാജാവിന്റെ പുത്രന്മാരുടെ തലകൾ കൊണ്ടുവന്നിരിക്കുന്നു.” അപ്പോൾ അവൻ പറഞ്ഞു: “അവയെ രണ്ടു കൂമ്പാരങ്ങളായി[a] കവാടത്തിന്റെ പ്രവേശനത്തിങ്കൽ പ്രഭാതംവരെ വയ്ക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “രണ്ടു കൂമ്പാരങ്ങളാക്കി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: സന്ദേശവാഹകൻ
  rationale: സന്ദർഭത്തിൽ ഇതു വാർത്ത അറിയിക്കുന്ന മനുഷ്യദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൂതൻ’ എന്നു മാത്രം പറഞ്ഞാൽ അതിമാനുഷദൂതൻ എന്ന തെറ്റിദ്ധാരണ ഉണ്ടാകാം.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: അവനോട് ഇങ്ങനെ അറിയിച്ചു
  rationale: അറിയിക്കൽക്രിയയും ‘പറഞ്ഞുകൊണ്ട്’ എന്ന എബ്രായ പ്രയോഗവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു.
- source_word: הֵבִיאוּ
  choice: കൊണ്ടുവന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി—തലകൾ എത്തിച്ചേർന്നിരിക്കുന്നു—വ്യക്തമാക്കുന്നു; കർത്താവ് എബ്രായത്തിലെന്നപോലെ നിർദിഷ്ടമല്ല.
- source_word: רָאשֵׁי בְנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ പുത്രന്മാരുടെ തലകൾ
  rationale: ബഹുവചനവും ഉടമസ്ഥബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ അറുത്തെടുത്ത തലകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: שִׂימוּ אֹתָם
  choice: അവയെ ... വയ്ക്കുക
  rationale: നേരിട്ടുള്ള ബഹുവചന ആജ്ഞയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שְׁנֵי צִבֻּרִים
  choice: രണ്ടു കൂമ്പാരങ്ങളായി
  rationale: צִבֻּרִים എന്നത് കൂട്ടിയിട്ട കൂമ്പാരങ്ങളെയോ കൂനകളെയോ സൂചിപ്പിക്കുന്നു; ദൃശ്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: פֶּתַח הַשַּׁעַר
  choice: കവാടത്തിന്റെ പ്രവേശനത്തിൽ
  rationale: ‘കവാടത്തിന്റെ തുറമുഖം/പ്രവേശനസ്ഥലം’ എന്ന സ്ഥലസൂചനയെ അധിക വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: עַד הַבֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: അടുത്ത പ്രഭാതംവരെയുള്ള കാലദൈർഘ്യം കൃത്യവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ നിർദിഷ്ടമല്ലാത്ത കർത്താവിനെയും ക്രൂരമായ ദൃശ്യത്തിന്റെ നേരിട്ടുള്ള ഭാഷയെയും മൃദൂകരിക്കാതെ നിലനിർത്തി.
