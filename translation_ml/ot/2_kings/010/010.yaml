id: 2KI.10.10
reference: 2 Kings 10:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
translation:
  language: ml
  text: 'അതുകൊണ്ട് അറിയുക: ആഹാബിന്റെ ഭവനത്തിനെതിരെ യഹോവ അരുളിച്ചെയ്ത വചനത്തിൽനിന്ന് ഒരു വാക്കുപോലും നിലത്തു വീഴുകയില്ല[a]. യഹോവ തന്റെ ദാസനായ ഏലിയാവിലൂടെ അരുളിച്ചെയ്തത് നിറവേറ്റിയിരിക്കുന്നു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിലത്തു വീഴുക” എന്നത് “പരാജയപ്പെടുക” അല്ലെങ്കിൽ “നിറവേറാതെ പോകുക” എന്നർഥമുള്ള എബ്രായ ശൈലീപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'പദശഃ: “തന്റെ ദാസനായ ഏലിയാവിന്റെ കൈയാൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹא
  choice: അതുകൊണ്ട് അറിയുക
  rationale: ബഹുവചന ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തിയും אֵפוֹאയുടെ നിഗമനാത്മകമായ ബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא יִפֹּל ... אַרְצָה
  choice: ഒന്നും നിലത്തു വീഴുകയില്ല
  rationale: ‘പരാജയപ്പെടുക/നിറവേറാതിരിക്കുക’ എന്ന അർഥമുള്ള എബ്രായ ദൃശ്യപ്രയോഗം വ്യാഖ്യാനിച്ച് പരത്താതെ നിലനിർത്തുന്നു.
- source_word: מִדְּבַר יְהוָה
  choice: യഹോവയുടെ വചനത്തിൽ ഒന്നും
  rationale: ഭാഗികത സൂചിപ്പിക്കുന്ന מִן പ്രതിഫലിപ്പിച്ച്, പ്രവചനവചനത്തിന്റെ ഒരു ഭാഗംപോലും പരാജയപ്പെടുകയില്ലെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: עַל בֵּית אַחְאָב
  choice: ആഹാബിന്റെ ഭവനത്തിനെതിരെ
  rationale: ന്യായവിധിയുടെ സാഹചര്യത്തിൽ עַל എന്നതിന്റെ വിരുദ്ധതാസൂചക അർഥം നൽകുന്നു; ‘ഭവനം’ കുടുംബവംശം/രാജവംശം എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיהוָה עָשָׂה
  choice: യഹോവ നിറവേറ്റിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെ പ്രസംഗസന്ദർഭത്തിലെ നിലവിലെ പ്രസക്തിയോടെ അറിയിക്കുന്നു; മലയാളത്തിൽ ‘ചെയ്തിരിക്കുന്നു’ എന്നതിനെക്കാൾ പ്രവചനനിവൃത്തിയുടെ ആശയം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  choice: തന്റെ ദാസനായ ഏലിയാവിലൂടെ
  rationale: പ്രവാചകമധ്യസ്ഥതയിലെ ഏജൻസിയെ സൂചിപ്പിക്കുന്ന בְּיַד എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിലെ പരിചിതമായ ദൈവനാമരൂപം ഉപയോഗിക്കുന്നു.
- issue: പ്രവചനനിവൃത്തിയുടെ ദൃശ്യപ്രയോഗം
  choice: വചനത്തിൽ ഒന്നും നിലത്തു വീഴുകയില്ല
  alternative: ഒരു വചനവും നിറവേറാതെ പോകുകയില്ല
  rationale: പ്രവചനം തീർച്ചയായും നിറവേറും എന്ന ആശയം വ്യക്തമാകുന്ന വിധത്തിൽ എബ്രായത്തിലെ ശക്തമായ ദൃശ്യരൂപവും നിലനിർത്തുന്നു.
- issue: וַיהוָה עָשָׂה എന്ന വാക്യത്തിന്റെ പ്രവചനസന്ദർഭം
  choice: യഹോവ നിറവേറ്റിയിരിക്കുന്നു
  alternative: യഹോവ ചെയ്തിരിക്കുന്നു
  rationale: עָשָׂה പദശഃ ‘ചെയ്തു’ എന്നാണെങ്കിലും ഇവിടെ മുമ്പ് അരുളിച്ചെയ്ത ന്യായവിധി നടപ്പാക്കിയതാണ് സൂചന; ‘നിറവേറ്റി’ ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അരുളിച്ചെയ്യുക’, ‘വചനം’, ‘ഭവനം’ എന്നീ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന ലളിതമായി സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
