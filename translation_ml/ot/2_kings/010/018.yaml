id: 2KI.10.18
reference: 2 Kings 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ יֵהוּא֙ אֶת כָּל הָ/עָ֔ם וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַחְאָ֕ב עָבַ֥ד אֶת הַ/בַּ֖עַל מְעָ֑ט יֵה֖וּא יַעַבְדֶ֥/נּוּ הַרְבֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/018.yaml
  text: Then Jehu gathered all the people and said to them[a], “Ahab served Baal a little[b]; Jehu will serve him much.”
translation:
  language: ml
  text: 'പിന്നെ യേഹൂ ജനത്തെയെല്ലാം ഒരുമിച്ചുകൂട്ടി അവരോടു പറഞ്ഞു[a]: “ആഹാബ് ബാലിനെ അല്പമേ സേവിച്ചുള്ളൂ[b]; യേഹൂ അവനെ വളരെ സേവിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സന്ദർഭത്തിൽ യേഹൂവിന്റെ ഈ പ്രസ്താവന പരിഹാസാത്മകമാണ്: താൻ ബാലിനെ ‘വളരെ’ സേവിക്കുമെന്ന് അവൻ പറയുന്നു; എന്നാൽ ബാലിന്റെ ആരാധകരെ ഒരുമിച്ചുകൂട്ടാനുള്ള ഒരു തന്ത്രമായിരുന്നു അതെന്ന് തുടർന്നുള്ള വിവരണം കാണിക്കുന്നു.'
    reason: cross_reference
  - marker: b
    text: ‘ബാലിനെ അല്പമേ ആരാധിച്ചുള്ളൂ; യേഹൂ അവനെ വളരെ ആരാധിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘സേവിക്കുക’ എന്ന എബ്രായക്രിയ മതപരമായ ആരാധനാസേവനത്തിനും ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ഒരുമിച്ചുകൂട്ടി
  rationale: קבץ ആളുകളെ ഒരിടത്ത് കൂട്ടിച്ചേർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഒരുമിച്ചുകൂട്ടി’ സ്വാഭാവികവും പ്രവൃത്തിയുടെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്.
- source_word: כָּל הָעָם
  choice: ജനത്തെയെല്ലാം
  rationale: വ്യാപകമായ ‘സകല ജനവും’ എന്ന സൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇല്ലാത്ത കൂടുതൽ പരിമിതി ചേർക്കുന്നില്ല.
- source_word: עָבַד אֶת הַבַּעַל
  choice: ബാലിനെ ... സേവിച്ചു
  rationale: ദേവതയോടുള്ള עבד ആരാധനാപരമായ സേവനത്തെ സൂചിപ്പിക്കാം. ‘സേവിച്ചു’ എബ്രായരൂപത്തോട് അടുത്തുനിൽക്കുകയും മതപരമായ അർഥം സന്ദർഭത്തിൽ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: מְעָט
  choice: അല്പമേ
  rationale: അളവിലെ കുറവ് സൂചിപ്പിക്കുന്ന പദം; പിന്നാലെയുള്ള ‘വളരെ’ എന്നതുമായുള്ള ചുരുക്കമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: יַעַבְדֶנּוּ
  choice: അവനെ ... സേവിക്കും
  rationale: പ്രത്യയം ബാലിനെ സൂചിപ്പിക്കുന്നതിനാൽ എബ്രായത്തിലെ സർവനാമഘടനയും ഭാവികാലസൂചനയും നിലനിർത്തുന്നു.
- source_word: הַרְבֵּה
  choice: വളരെ
  rationale: ക്രിയാവിശേഷണമായി അളവ് സൂചിപ്പിക്കുന്നു; מְעָט എന്നതിനോടുള്ള ‘അല്പം ... വളരെ’ എന്ന സമാന്തരവൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: יֵהוּא
  choice: യേഹൂ
  rationale: പേരിന്റെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: הַבַּעַל
  choice: ബാൽ
  rationale: നിശ്ചയാർഥകപ്രത്യയം ഉണ്ടായിട്ടും ഇവിടെ ദേവനാമമായാണ് ഉപയോഗം; മലയാളത്തിൽ സ്വാഭാവികമായി നാമം മാത്രം നൽകുന്നു.
theological_decisions:
- issue: ബാലിനെ സേവിക്കുമെന്ന യേഹൂവിന്റെ പ്രഖ്യാപനം
  choice: പ്രസ്താവനയെ പ്രധാനപാഠത്തിൽ നേരിട്ടുള്ള അവകാശവാദമായി തന്നേ പരിഭാഷപ്പെടുത്തി; വഞ്ചനയോ പരിഹാസമോ സൂചിപ്പിക്കുന്ന വാക്കുകൾ ചേർത്തില്ല.
  alternative: ‘സേവിക്കുമെന്ന് നടിച്ചു’ അല്ലെങ്കിൽ ‘സേവിക്കുമെന്ന് അവകാശപ്പെട്ടു’ എന്നു വ്യാഖ്യാനസൂചന ചേർക്കുക.
  rationale: തുടർന്നുള്ള വിവരണം യേഹൂവിന്റെ വാക്കുകൾ ഒരു തന്ത്രമാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും, ഈ വാക്യത്തിലെ എബ്രായപാഠം അവന്റെ പ്രസംഗം നേരിട്ട് മാത്രമാണ് രേഖപ്പെടുത്തുന്നത്. അതിനാൽ ആഖ്യാനത്തിലെ പരിഹാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അല്പമേ ... വളരെ’ എന്ന മൂലപാഠത്തിലെ ചുരുക്കമായ വൈരുധ്യം സംരക്ഷിച്ചു; പ്രധാനപാഠത്തിൽ ആഖ്യാനപരമായ വഞ്ചന മുൻകൂട്ടി വ്യാഖ്യാനിച്ചിട്ടില്ല.
