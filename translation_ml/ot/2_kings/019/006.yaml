source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹֽנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֗עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶֽלֶךְ אַשּׁ֖וּר אֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: ml
  text: 'യെശയ്യാവ് അവരോടു പറഞ്ഞു: “നിങ്ങൾ നിങ്ങളുടെ യജമാനനോടു ഇങ്ങനെ പറയണം: ‘യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: നീ കേട്ടിട്ടുള്ള, അശ്ശൂർരാജാവിന്റെ സേവകർ[a] എന്നെ നിന്ദിച്ച വാക്കുകൾ നിമിത്തം ഭയപ്പെടേണ്ടാ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അശ്ശൂർരാജാവിന്റെ യുവാക്കൾ.” ഹീബ്രുപദം യുവാക്കളെ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ രാജാവിന്റെ പരിചാരകരെയോ ഉദ്യോഗസ്ഥരെയോ ഉദ്ദേശിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സാധാരണ ഭൂതകാല പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ലളിതമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֲדֹנֵיכֶם
  choice: നിങ്ങളുടെ യജമാനൻ
  rationale: ഇവിടെ ഹിസ്കീയാവിനെ ദൂതന്മാരുടെ മേലധികാരിയായി സൂചിപ്പിക്കുന്നു; ദൈവിക ബിരുദവുമായി ആശയക്കുഴപ്പം ഉണ്ടാകാതിരിക്കാൻ ‘യജമാനൻ’ തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുബിരുദമാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אַל־תִּירָא
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധാത്മക ആജ്ഞയുടെ ആശ്വാസദായകമായ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִפְּנֵי הַדְּבָרִים
  choice: വാക്കുകൾ നിമിത്തം
  rationale: മുൻപു കേട്ട ഭീഷണിവാക്കുകളാണ് ഭയത്തിന്റെ കാരണമെന്ന് സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം കൃത്യമായി നൽകുന്നു.
- source_word: שָׁמַעְתָּ
  choice: നീ കേട്ട
  rationale: പൂർത്തിയായെങ്കിലും ഇപ്പോഴും പ്രസക്തമായ കേൾവിയെ സന്ദർഭത്തിന് യോജിച്ച ലളിതമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: גִּדְּפוּ
  choice: ദുഷിച്ചിരിക്കുന്നു
  rationale: ദൈവത്തിനെതിരായ നിന്ദാപരവും അവഹേളനപരവുമായ സംസാരത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള കർമത്തോടൊപ്പം സ്വാഭാവികമാണ്.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവിന്റെ സേവകർ
  rationale: נַעַר എന്ന പദത്തിന് ‘യുവാക്കൾ’ എന്ന അർഥമുണ്ടെങ്കിലും രാജസഭാ-ദൂതസന്ദർഭത്തിൽ രാജാവിനെ സേവിക്കുന്ന പ്രതിനിധികളെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കുന്നതാണ് സാധ്യത.
- source_word: אֹתִי
  choice: എന്നെ
  rationale: നിന്ദയുടെ നേരിട്ടുള്ള ലക്ഷ്യം യഹ്‌വെ തന്നെയാണെന്ന വ്യക്തിപരമായ ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായി വരുന്ന ഉടമ്പടിനാമത്തെ പൊതുബിരുദംകൊണ്ട് പകരാതെ, ‘Yahweh’ എന്ന അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തിന് സമീപമായ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: גִּדְּפוּ എന്ന ക്രിയയുടെ ദൈവത്തിനെതിരായ ശക്തി
  choice: എന്നെ ദുഷിച്ചിരിക്കുന്നു
  alternative: എന്നെ നിന്ദിച്ചിരിക്കുന്നു; എന്നെ പരിഹസിച്ചിരിക്കുന്നു; ദൈവദൂഷണം പറഞ്ഞിരിക്കുന്നു
  rationale: വെറും പരിഹാസത്തെക്കാൾ ശക്തമായ ദൈവവിരുദ്ധ അവഹേളനം പ്രകടമാക്കുകയും, മൂലത്തിലെ നേരിട്ടുള്ള ‘എന്നെ’ എന്ന കർമം നിലനിർത്തുകയും ചെയ്യുന്നു; പ്രത്യേക സാങ്കേതിക പദം ചേർത്ത് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. രാജകീയ സന്ദേശത്തിന്റെ ഔപചാരികതയ്ക്കായി ‘ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു’ നിലനിർത്തി. ബഹുവചനമായ ദൂതന്മാരോട് ‘നിങ്ങൾ’ എന്നും ഹിസ്കീയാവിനെ അഭിസംബോധന ചെയ്യുന്ന ഉദ്ധരണിയിൽ ഏകവചനമായ ‘നീ’ എന്നും വ്യത്യാസപ്പെടുത്തി.
