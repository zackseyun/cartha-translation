  source_fidelity: 'The main sense is conveyed accurately: the inhabitants lack power, are dismayed and shamed, and are compared with vulnerable vegetation. The final Hebrew agricultural image is compressed and permits a cautious rendering such as vegetation scorched before it stands/grows. The revision improves the Malayalam expression without making the implicit agricultural referent more specific than the Hebrew requires.'
