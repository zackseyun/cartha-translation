    rationale: “വളർന്നു നിൽക്കുന്നതിനു മുമ്പേ കരിഞ്ഞുപോയ സസ്യം” is close in sense, but “വളർന്നുനിൽക്കുന്നതിനു മുമ്പേ കരിഞ്ഞുപോകുന്ന സസ്യം” more naturally represents the image of premature scorching and does not overstate a completed historical event.
