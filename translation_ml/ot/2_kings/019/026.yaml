  terminology: “ശക്തിയില്ലാത്തവർ” clearly conveys the Hebrew idiom קִצְרֵי יָד; its literal form remains appropriately documented in the footnote. “പച്ചച്ചെടികൾ” is natural modern Malayalam for fresh green vegetation. The revised final line retains “സസ്യം,” avoiding an unjustified decision that the referent must be grain.
