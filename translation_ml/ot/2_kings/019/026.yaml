  text: וְ/יֹֽשְׁבֵי/הֶן֙ קִצְרֵי יָ֔ד חַ֖תּוּ וַ/יֵּבֹ֑שׁוּ הָי֞וּ עֵ֤שֶׂב שָׂדֶה֙ וִ֣/ירַק דֶּ֔שֶׁא חֲצִ֣יר גַּגּ֔וֹת וּ/שְׁדֵפָ֖ה לִ/פְנֵ֥י קָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/026.yaml
  text: Therefore their inhabitants were short of strength[a]; they were dismayed and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and scorched before it is grown.
translation:
  language: ml
  text: അതുകൊണ്ട് അവയിലെ നിവാസികൾ ശക്തിയില്ലാത്തവരായിരുന്നു[a]; അവർ പരിഭ്രാന്തരായി ലജ്ജിതരായി. അവർ വയലിലെ പുല്ലും പച്ചച്ചെടികളുംപോലെയും, മേൽക്കൂരകളിലെ പുല്ലുപോലെയും[b], വളർന്നുനിൽക്കുന്നതിനു മുമ്പേ കരിഞ്ഞുപോകുന്ന സസ്യംപോലെയും[c] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ ഭാഷയിൽ അക്ഷരാർഥം ‘കൈ കുറവുള്ളവർ’; ശക്തിയോ കഴിവോ ഇല്ലാത്തവരെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: പുരാതന വീടുകളുടെ പരന്ന മേൽക്കൂരകളിലെ നേർത്ത മണ്ണിൽ മുളയ്ക്കുന്ന പുല്ല് വേഗം ഉണങ്ങിപ്പോകുമായിരുന്നു.
    reason: cultural_context
  - marker: c
    text: അവസാനത്തെ എബ്രായ പ്രയോഗം സങ്കുചിതമായ ഒരു കാർഷികചിത്രമാണ്. ഇതിനെ ‘കതിരായി നിൽക്കുന്നതിനു മുമ്പുള്ള കരിച്ചിൽ’ എന്നും ‘മുളച്ചുയരുന്നതിനു മുമ്പേ കരിഞ്ഞുപോകുന്ന വളർച്ച’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹשְׁבֵיהֶן
  choice: അവയിലെ നിവാസികൾ
  rationale: സന്ദർഭത്തിലെ പട്ടണങ്ങളെയോ ദേശങ്ങളെയോ സൂചിപ്പിക്കുന്ന ബഹുവചന പ്രത്യയം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: קִצְרֵי יָד
  choice: ശക്തിയറ്റവരായി
  rationale: അക്ഷരാർഥത്തിൽ ‘കൈ കുറവുള്ളവർ’ എന്ന ഹീബ്രു ശൈലി പ്രവർത്തിക്കാൻ കഴിവോ ശക്തിയോ ഇല്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: חַתּוּ
  choice: പരിഭ്രാന്തരാകുകയും
  rationale: തകർന്ന മനോനില, ഭീതി, നിരാശ എന്നിവ ഉൾക്കൊള്ളാവുന്ന ക്രിയയ്ക്ക് സന്ദർഭോചിതമായ സ്വാഭാവിക പരിഭാഷ; കൂടുതൽ ശക്തമായ ‘തകർന്നുപോയി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיֵּבֹשׁוּ
  choice: ലജ്ജിതരാകുകയും ചെയ്തു
  rationale: അപമാനിതരായ ഫലാവസ്ഥയെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: עֵשֶׂב שָׂדֶה וִירַק דֶּשֶׁא
  choice: വയലിലെ പുല്ലും പച്ചത്തളിരുംപോലെയും
  rationale: രണ്ട് സസ്യചിത്രങ്ങളെയും വേർതിരിച്ചും കാവ്യാത്മകമായ സമാന്തരത നിലനിർത്തിയും അവതരിപ്പിക്കുന്നു.
- source_word: חֲצִיר גַּגּוֹת
  choice: മേൽക്കൂരകളിലെ പുല്ലുപോലെയും
  rationale: ആഴം കുറഞ്ഞ മണ്ണിൽ വളർന്ന് വേഗം വാടുന്ന മേൽക്കൂരപ്പുല്ലിന്റെ ദൃശ്യരൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּשְׁדֵפָה לִפְנֵי קָמָה
  choice: വളർന്നു നിൽക്കുന്നതിനു മുമ്പേ കരിഞ്ഞുപോയ സസ്യംപോലെയും
  rationale: ഹീബ്രുവിലെ സങ്കുചിതമായ കാർഷികചിത്രം മലയാളത്തിൽ മനസ്സിലാകുന്നവിധം നൽകുന്നു; ‘കതിരായി നിൽക്കുന്നതിനു മുമ്പുള്ള കരിച്ചിൽ’ എന്ന കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
