- from: 'നിന്റെ ദൂതന്മാർ മുഖാന്തരം നീ കർത്താവിനെ നിന്ദിച്ചു[a]. നീ പറഞ്ഞു: ‘എന്റെ അനേകം രഥങ്ങളുമായി ഞാൻതന്നെ പർവതശിഖരങ്ങളിലേക്കും ലെബാനോന്റെ അതിദൂരഭാഗങ്ങളിലേക്കും കയറിച്ചെന്നു. അതിലെ ഉയരമേറിയ ദേവദാരുക്കളും ഏറ്റവും നല്ല സരളവൃക്ഷങ്ങളും ഞാൻ വെട്ടിവീഴ്ത്തും; അതിന്റെ അങ്ങേയറ്റത്തെ വിശ്രമസ്ഥാനത്ത്, അതിന്റെ സമൃദ്ധവനത്തിൽ, ഞാൻ പ്രവേശിക്കും.’'
  to: 'നിന്റെ ദൂതന്മാർ മുഖാന്തരം നീ കർത്താവിനെ നിന്ദിച്ചു[a]. നീ പറഞ്ഞു: ‘എന്റെ അനേകം രഥങ്ങളുമായി ഞാൻ തന്നെ പർവതങ്ങളുടെ ഉയരങ്ങളിലേക്കും ലെബാനോന്റെ അതിദൂരഭാഗങ്ങളിലേക്കും കയറിച്ചെന്നു. അതിലെ ഉയരമേറിയ ദേവദാരുക്കളും ഏറ്റവും നല്ല സരളവൃക്ഷങ്ങളും[b] ഞാൻ വെട്ടിവീഴ്ത്തും; അതിന്റെ അങ്ങേയറ്റത്തെ വിശ്രമസ്ഥാനത്ത്, അതിന്റെ സമൃദ്ധവനത്തിൽ, ഞാൻ പ്രവേശിക്കും.’'
