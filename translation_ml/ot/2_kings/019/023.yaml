  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/יַ֣ד מַלְאָכֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר ב/רכב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְח֣וֹר בְּרֹשָׁ֔י/ו וְ/אָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔/ה יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
translation:
  language: ml
  text: 'നിന്റെ ദൂതന്മാർ മുഖാന്തരം നീ കർത്താവിനെ നിന്ദിച്ചു[a]. നീ പറഞ്ഞു: ‘എന്റെ അനേകം രഥങ്ങളുമായി ഞാൻ തന്നെ പർവതങ്ങളുടെ ഉയരങ്ങളിലേക്കും ലെബാനോന്റെ അതിദൂരഭാഗങ്ങളിലേക്കും കയറിച്ചെന്നു. അതിലെ ഉയരമേറിയ ദേവദാരുക്കളും ഏറ്റവും നല്ല സരളവൃക്ഷങ്ങളും[b] ഞാൻ വെട്ടിവീഴ്ത്തും; അതിന്റെ അങ്ങേയറ്റത്തെ വിശ്രമസ്ഥാനത്ത്, അതിന്റെ സമൃദ്ധവനത്തിൽ, ഞാൻ പ്രവേശിക്കും.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അധിക്ഷേപിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: חרף എന്ന ക്രിയയിൽ നിന്ദ, അധിക്ഷേപം, ധിക്കാരപൂർവമായ പരിഹാസം എന്നീ അർഥഭാവങ്ങൾ ഉൾപ്പെടുന്നു.
  - marker: b
    text: ‘ഏറ്റവും നല്ല ദേവദാരുവർഗവൃക്ഷങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായ വൃക്ഷപ്പേരിന്റെ കൃത്യമായ ഇനം ഉറപ്പില്ല.
    reason: בְּרוֹשׁ ഒരു ശങ്കുവൃക്ഷത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ ആധുനിക ഇനം വിവാദവിഷയമാണ്.
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  choice: നിന്റെ ദൂതന്മാർ മുഖാന്തരം
  rationale: בְּיַד എന്ന ഹീബ്രായ പ്രയോഗം ഇവിടെ പ്രവർത്തനമാധ്യമത്തെയോ ഏജൻസിയെയോ സൂചിപ്പിക്കുന്നു. രാഷ്ട്രീയ-സൈനിക പശ്ചാത്തലത്തിൽ מַלְאָכִים എന്നത് ‘ദൂതന്മാർ’ എന്നാണ്.
- source_word: חֵרַפְתָּ
  choice: നിന്ദിച്ചു
  rationale: ഈ ക്രിയയിൽ പരിഹാസം, അധിക്ഷേപം, ധിക്കാരപൂർവമായ അവമതിപ്പ് എന്നീ അർഥഭാവങ്ങളുണ്ട്; ‘നിന്ദിച്ചു’ അവയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: אֲדֹנָי
  choice: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ യഹ്‌വേ എന്ന ദൈവനാമമല്ല, אֲדֹנָי എന്ന സ്ഥാനപ്പേരാണ്; അതിനാൽ വേർതിരിവ് നിലനിർത്തി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּרֹב רִכְבִּי
  choice: എന്റെ അനേകം രഥങ്ങളുമായി
  rationale: רֹב രഥങ്ങളുടെ ബാഹുല്യത്തെ സൂചിപ്പിക്കുന്നു; സൈനികശക്തിയെക്കുറിച്ചുള്ള വീമ്പ് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲנִי עָלִיתִי
  choice: ഞാൻതന്നെ ... കയറിച്ചെന്നു
  rationale: സ്വതന്ത്ര സർവനാമമായ אֲנִי നൽകുന്ന ഊന്നൽ ‘ഞാൻതന്നെ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; സൈനിക മുന്നേറ്റത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘കയറിച്ചെന്നു’ സ്വാഭാവികമാണ്.
- source_word: מְרוֹם הָרִים
  choice: പർവതശിഖരങ്ങൾ
  rationale: പർവതങ്ങളുടെ ഉയർന്ന ഇടങ്ങൾ എന്ന ദൃശ്യരൂപം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: ലെബാനോന്റെ അതിദൂരഭാഗങ്ങൾ
  rationale: יַרְכְּתֵי അങ്ങേയറ്റത്തെയോ വിദൂരമായ ഉൾഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ഭൂമിശാസ്ത്രപരമായ കടന്നുകയറ്റത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: קוֹמַת אֲרָזָיו
  choice: അതിലെ ഉയരമേറിയ ദേവദാരുക്കൾ
  rationale: קוֹמָה ഉയരത്തെയോ തലയെടുപ്പിനെയോ സൂചിപ്പിക്കുന്നു; ലെബാനോന്റെ വൃക്ഷങ്ങളോടുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: מִבְחוֹר בְּרֹשָׁיו
  choice: ഏറ്റവും നല്ല സരളവൃക്ഷങ്ങൾ
  rationale: מִבְחוֹר ‘തിരഞ്ഞെടുത്തത്/ഏറ്റവും നല്ലത്’ എന്നാണ്. בְּרוֹשׁ ഒരു ശങ്കുവൃക്ഷത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും കൃത്യമായ ഇനം അനിശ്ചിതമാണ്; പ്രധാനപാഠത്തിൽ പരിചിതമായ പൊതുപദം ഉപയോഗിച്ച് അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: מְלוֹן קִצֹּה
  choice: അതിന്റെ അങ്ങേയറ്റത്തെ വിശ്രമസ്ഥാനം
  rationale: מָלוֹן താമസിക്കാനോ തങ്ങാനോ ഉള്ള ഇടമാണ്; קִצּוֹ അതിന്റെ അറ്റം/അങ്ങേയറ്റം സൂചിപ്പിക്കുന്നു. അപൂർവമായ ഹീബ്രായ ദൃശ്യരൂപം അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: അതിന്റെ സമൃദ്ധവനം
  rationale: כַּרְמֶל ഇവിടെ ഫലഭൂയിഷ്ഠമോ സമൃദ്ധമോ ആയ വനപ്രദേശത്തിന്റെ ഗുണം സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാം; ‘സമൃദ്ധവനം’ സ്വാഭാവികമായി ആ ഭാവം നൽകുന്നു.
theological_decisions:
- issue: אֲדֹנָי എന്ന സ്ഥാനപ്പേരിനെ യഹ്‌വേ എന്ന ദൈവനാമത്തിൽനിന്ന് വേർതിരിക്കൽ
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: ഈ വാക്യത്തിലെ ഹീബ്രായ പാഠം אֲדֹנָי എന്നാണ് വായിക്കുന്നത്, ചതുർക്ഷര ദൈവനാമമല്ല. അതിനാൽ മൂലപാഠത്തിലെ വ്യത്യാസം മായ്ച്ചുകളയാതെ സ്ഥാനപ്പേരായി പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. രാജാവിന്റെ വീമ്പ് പ്രകടമാക്കാൻ ‘ഞാൻതന്നെ’ നിലനിർത്തി. അപൂർവമായ ‘അങ്ങേയറ്റത്തെ വിശ്രമസ്ഥാനം’ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിച്ചു.
