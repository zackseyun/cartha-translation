reference: 2 Kings 19:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנְ/נִ֨י נֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב לְ/אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
translation:
  language: ml
  text: ഇതാ, ഞാൻ അവനിൽ ഒരു ആത്മാവിനെ വെക്കുന്നു[a]; അവൻ ഒരു വാർത്ത[b] കേട്ട് തന്റെ നാട്ടിലേക്കു മടങ്ങും; അവന്റെ നാട്ടിൽ ഞാൻ അവനെ വാളാൽ വീഴ്ത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു മനോഭാവം” അല്ലെങ്കിൽ “ഒരു പ്രേരണ.” എബ്രായപദത്തിന് “കാറ്റ്,” “ശ്വാസം” എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഒരു അറിയിപ്പ്” അല്ലെങ്കിൽ “ഒരു അഭ്യൂഹം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: ഇതാ
  rationale: ദൈവിക പ്രഖ്യാപനത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נֹתֵן
  choice: ഞാൻ ... വെക്കുന്നു
  rationale: הִנְנִי എന്നതിനുശേഷമുള്ള കർത്തൃവാചക പങ്കാളിത്തരൂപം ആസന്നമായ പ്രവൃത്തിയെ സജീവമായി അവതരിപ്പിക്കുന്നു.
- source_word: רוּחַ
  choice: ഒരു ആത്മാവ്
  rationale: ഉള്ളിലെ പ്രേരണയെയോ മനോഭാവത്തെയോ സൂചിപ്പിക്കാവുന്നുവെങ്കിലും, 'ആത്മാവ്' എന്ന നേരിട്ടുള്ള പരിഭാഷ എബ്രായപദത്തിന്റെ അർഥവ്യാപ്തിയും പ്രവർത്തനവിധിയെക്കുറിച്ചുള്ള അവ്യക്തതയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: שְׁמוּעָה
  choice: ഒരു വാർത്ത
  rationale: കേട്ട വിവരം, അറിയിപ്പ്, അഭ്യൂഹം എന്നീ സാധ്യതകൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവികമായ പൊതുപദമാണ്.
- source_word: וְשָׁב לְאַרְצוֹ
  choice: തന്റെ നാട്ടിലേക്കു മടങ്ങിപ്പോകും
  rationale: മടങ്ങുക എന്ന ദിശാബോധവും മൂന്നാംപുരുഷ ഉടമസ്ഥപ്രത്യയവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהִפַּלְתִּיו
  choice: ഞാൻ അവനെ ... വീഴ്ത്തും
  rationale: נפל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം നിലനിർത്തുന്നു; കൊല്ലപ്പെടുമെന്ന ഫലത്തെ അതിലധികം വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: בַּחֶרֶב
  choice: വാളാൽ
  rationale: ആയുധമോ അക്രമമരണമോ സൂചിപ്പിക്കുന്ന ഉപകരണാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּאַרְצוֹ
  choice: അവന്റെ സ്വന്തം നാട്ടിൽവെച്ചുതന്നെ
  rationale: ഉടമസ്ഥപ്രത്യയം വ്യക്തമാക്കുകയും അവന്റെ വീഴ്ച സ്വന്തം നാട്ടിൽ സംഭവിക്കുമെന്ന വിരോധാഭാസപരമായ ഊന്നൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയുടെ അരുളപ്പാടിൽ רוּחַ എന്നതിന്റെ അർഥം
  choice: ഒരു ആത്മാവ്
  alternative: ഒരു മനോഭാവം / ഒരു പ്രേരണ / ഒരു കാറ്റ്
  rationale: സന്ദർഭത്തിൽ ദൈവം അശ്ശൂർരാജാവിനെ ഒരു വാർത്ത കേട്ട് മടങ്ങാൻ ഇടയാക്കുന്നു. 'ഒരു ആത്മാവ്' എന്നത് ദൈവിക പ്രവർത്തനത്തെ നിലനിർത്തുമ്പോഴും അതിന്റെ കൃത്യമായ പ്രവർത്തനവിധി നിർവചിക്കാതെ എബ്രായത്തിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പ്രവചനത്തിന്റെ തത്സമയത്വം 'ഇതാ' എന്നും വർത്തമാനകാലരൂപമായ 'വെക്കുന്നു' എന്നും നൽകി നിലനിർത്തി. അവസാന ഭാഗത്തിലെ ആവർത്തനവും ഊന്നലും മലയാളത്തിൽ 'സ്വന്തം നാട്ടിൽവെച്ചുതന്നെ' എന്നു പ്രകടമാക്കി.
