id: 2KI.19.9
reference: 2 Kings 19:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע אֶל תִּרְהָ֤קָה מֶֽלֶך כּוּשׁ֙ לֵ/אמֹ֔ר הִנֵּ֥ה יָצָ֖א לְ/הִלָּחֵ֣ם אִתָּ֑/ךְ וַ/יָּ֨שָׁב֙ וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים אֶל חִזְקִיָּ֖הוּ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/009.yaml
  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
translation:
  language: ml
  text: 'കൂശ് രാജാവായ തിർഹാക്കയെക്കുറിച്ച്, “ഇതാ, അവൻ നിന്നോടു യുദ്ധം ചെയ്യാൻ പുറപ്പെട്ടിരിക്കുന്നു” എന്നു അവൻ കേട്ടപ്പോൾ, അവൻ മടങ്ങി, ഹിസ്കീയാവിന്റെ അടുക്കലേക്ക് ദൂതന്മാരെ അയച്ച് ഇപ്രകാരം പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: കുറിച്ച് ... കേട്ടപ്പോൾ
  rationale: ശ്രവിച്ചതിനെ തുടർന്നുള്ള പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലബന്ധത്തോടെ അവതരിപ്പിക്കുന്നു; אֶל ഇവിടെ കേട്ട വാർത്തയുടെ വിഷയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: תִּרְהָקָה
  choice: തിർഹാക്ക
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ כּוּשׁ
  choice: കൂശ് രാജാവ്
  rationale: പുരാതന ഭൂനാമമായ כּוּשׁ നേരിട്ട് നിലനിർത്തുന്നു; ആധുനിക എത്യോപ്യയുമായി തെറ്റായി സമീകരിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ നിപാതത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാള സമാനപദം.
- source_word: יָצָא לְהִלָּחֵם אִתָּךְ
  choice: നിന്നോടു യുദ്ധം ചെയ്യാൻ പുറപ്പെട്ടിരിക്കുന്നു
  rationale: സൈനിക ഏറ്റുമുട്ടലിന്റെ ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു; יָצָא എന്നതിന്റെ പുറപ്പെടൽ അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: וַיָּשָׁב
  choice: മടങ്ങിച്ചെന്ന്
  rationale: ‘മടങ്ങുക/തിരിയുക’ എന്ന അടിസ്ഥാന അർത്ഥം നിലനിർത്തുന്നു; സൈനികമായി പിൻവാങ്ങിയെന്ന് മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: ദൂതന്മാരെ അയച്ച്
  rationale: ഈ നയതന്ത്ര-സൈനിക സന്ദർഭത്തിൽ מַלְאָכִים മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶל חִזְקִיָּהוּ
  choice: ഹിസ്കീയാവിന്റെ അടുക്കൽ
  rationale: ലക്ഷ്യദിശ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗവും വ്യക്തിനാമത്തിന്റെ പതിവ് മലയാള രൂപവും.
- source_word: לֵאמֹר
  choice: ഇപ്രകാരം പറയിച്ചു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള സന്ദേശത്തിന് അവതാരികയായി പ്രവർത്തിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
