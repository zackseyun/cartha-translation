translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി. ‘കൂശ്’ എന്ന പുരാതന ഭൂനാമം മൂലഭാഷാനുസൃതമായി നിലനിർത്തി. മുഖ്യവാക്യത്തിൽ ആവശ്യമായ [a] അടയാളം ഉൾപ്പെടുത്തി.
