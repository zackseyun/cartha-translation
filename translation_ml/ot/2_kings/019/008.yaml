  text: So the Rabshakeh returned and found the king of Assyria fighting against Libnah[a], for he had heard that he had departed from Lachish.
translation:
  language: ml
  text: അങ്ങനെ റബ്-ശാക്കേ മടങ്ങിച്ചെന്ന് അശ്ശൂർരാജാവിനെ ലിബ്നയ്ക്കെതിരെ യുദ്ധം ചെയ്യുന്നതായി കണ്ടെത്തി. അശ്ശൂർരാജാവ് ലാഖീശിൽനിന്ന് പുറപ്പെട്ടിരുന്നു[a] എന്ന് അവൻ കേട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ലാഖീശിൽനിന്ന് യാത്ര പുറപ്പെട്ടിരുന്നു.” സൈനികസന്ദർഭത്തിൽ ഹീബ്രു ക്രിയയ്ക്ക് ഒരു സ്ഥലം വിടുക, യാത്ര പുറപ്പെടുക, അല്ലെങ്കിൽ പാളയം പൊളിച്ച് നീങ്ങുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിച്ചെന്നപ്പോൾ
  rationale: שׁוּב എന്ന ക്രിയയുടെ ‘മടങ്ങുക’ എന്ന ചലനാർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള സംഭവവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ ‘മടങ്ങിച്ചെന്നപ്പോൾ’ എന്നു നൽകി.
- source_word: רַב שָׁקֵה
  choice: റബ്-ശാക്കേ
  rationale: ഇത് അസ്സീറിയൻ സ്ഥാനപ്പേരായി, ഈ വിവരണത്തിൽ പേരുപോലെ ഉപയോഗിക്കപ്പെടുന്നു. തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ഔദ്യോഗിക ചുമതലാവിവർത്തനത്തിന് പകരം ലിപ്യന്തരണം നിലനിർത്തി.
- source_word: וַיִּמְצָא אֶת
  choice: കണ്ടു
  rationale: מָצָאയുടെ അടിസ്ഥാനാർഥമായ ‘കണ്ടെത്തുക/കാണുക’ ഇവിടെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘കണ്ടു’ എന്നു നൽകി; രാജാവിനെ അന്വേഷിച്ച് കണ്ടെത്തിയെന്ന ആശയം അനാവശ്യമായി ശക്തമാക്കിയിട്ടില്ല.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവ്
  rationale: ഹീബ്രു സംയുക്തപദപ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും മലയാളത്തിൽ സ്വാഭാവികവുമായ രൂപം.
- source_word: נִלְחָם עַל
  choice: ലിബ്നയ്ക്കെതിരെ യുദ്ധം ചെയ്യുന്നതായി
  rationale: പങ്കാളിക്രിയ ongoing action സൂചിപ്പിക്കുന്നു; עַל നഗരത്തിനെതിരായ സൈനികാക്രമണത്തിന്റെ ദിശ വ്യക്തമാക്കുന്നു.
- source_word: לִבְנָה
  choice: ലിബ്ന
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
- source_word: כִּי שָׁמַע
  choice: എന്ന് അവൻ കേട്ടിരുന്നു
  rationale: പ്രധാന സംഭവത്തിനു മുമ്പുണ്ടായ അറിവിനെ മലയാളത്തിലെ ഭൂതകാലരൂപം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘അവൻ’ റബ്-ശാക്കേയെയാണു സമീപസന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: כִּי נָסַע
  choice: പുറപ്പെട്ടുപോയി
  rationale: נָסַע സൈനികസന്ദർഭത്തിൽ സ്ഥലം വിടുക, പാളയം പൊളിച്ച് പുറപ്പെടുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു; ‘പുറപ്പെട്ടുപോയി’ ഈ ചലനാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: מִלָּכִישׁ
  choice: ലാഖീശിൽനിന്നു
  rationale: സ്ഥലനാമവും prefixed preposition-ഉം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
