translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. അസ്സീറിയൻ സ്ഥാനപ്പേര് വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു. ഹീബ്രുവിലെ സർവനാമങ്ങളുടെ സ്വാഭാവിക സന്ദർഭാർഥം അനുസരിച്ച് പുറപ്പെട്ടത് അശ്ശൂർരാജാവാണെന്ന് പ്രധാനവാക്യത്തിൽ വ്യക്തമാക്കി; കേട്ടത് റബ്-ശാക്കേയാണെന്ന് ‘അവൻ’ സൂചിപ്പിക്കുന്നു.
