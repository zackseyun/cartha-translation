revisions:
- from: “നീ കേട്ടിട്ടില്ലയോ? പണ്ടേ ഞാൻ അതു ചെയ്തു[a]; പുരാതനകാലംമുതലേ ഞാൻ അതു രൂപപ്പെടുത്തി. ഇപ്പോൾ ഞാൻ അതു നടപ്പാക്കിയിരിക്കുന്നു; കോട്ടകെട്ടിയ നഗരങ്ങളെ നീ ശൂന്യമാക്കി നാശക്കൂമ്പാരങ്ങളാക്കേണ്ടതിനുതന്നെ.”
  to: “നീ കേട്ടിട്ടില്ലയോ? പണ്ടേ ഞാൻ അതു ചെയ്തു[a]; പുരാതനകാലം മുതലേ ഞാൻ അതു രൂപപ്പെടുത്തി. ഇപ്പോൾ ഞാൻ അതു നടപ്പാക്കിയിരിക്കുന്നു; അങ്ങനെ നീ കോട്ടകെട്ടിയ നഗരങ്ങളെ നാശക്കൂമ്പാരങ്ങളാക്കാൻ[b].”
  rationale: അവസാന ഉപവാക്യത്തിലെ അസ്വാഭാവികമായ ‘-േണ്ടതിനുതന്നെ’ ഒഴിവാക്കി ഫല/ഉദ്ദേശ്യബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കി. രണ്ട് വ്യത്യസ്ത പാഠവൈകല്യ-വിവരണങ്ങളെ വേർതിരിച്ച അടിക്കുറിപ്പുകളാക്കി, ഓരോന്നിനും അതത് വാചകസ്ഥാനത്ത് നങ്കൂരം ചേർത്തു. അർഥത്തിൽ മാറ്റമില്ല.
