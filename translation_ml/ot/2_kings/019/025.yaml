id: 2KI.19.25
reference: 2 Kings 19:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ/לֹֽא שָׁמַ֤עְתָּ לְ/מֵֽ/רָחוֹק֙ אֹתָ֣/הּ עָשִׂ֔יתִי לְ/מִ֥/ימֵי קֶ֖דֶם וִֽ/יצַרְתִּ֑י/הָ עַתָּ֣ה הֲבֵיאתִ֗י/הָ וּ/תְהִ֗י לַ/הְשׁ֛וֹת גַּלִּ֥ים נִצִּ֖ים עָרִ֥ים בְּצֻרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/025.yaml
  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: ml
  text: “നീ കേട്ടിട്ടില്ലയോ? പണ്ടേ ഞാൻ അതു ചെയ്തു[a]; പുരാതനകാലം മുതലേ ഞാൻ അതു രൂപപ്പെടുത്തി. ഇപ്പോൾ ഞാൻ അതു നടപ്പാക്കിയിരിക്കുന്നു; അങ്ങനെ നീ കോട്ടകെട്ടിയ നഗരങ്ങളെ നാശക്കൂമ്പാരങ്ങളാക്കാൻ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പണ്ടേ” എന്നതിന് പദപ്രകാരം “ദൂരത്തുനിന്ന്” എന്നും വരാം; എന്നാൽ ഇവിടെ അതിന് കാലസൂചനയായ അർഥമാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദസമുച്ചയം ദുഷ്കരമാണ്. “നാശക്കൂമ്പാരങ്ങൾ” എന്നതിനു പകരം “നിൽക്കുന്ന കൂമ്പാരങ്ങൾ” എന്നും ഗ്രഹിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  choice: നീ കേട്ടിട്ടില്ലയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ വാചാടോപചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְמֵרָחוֹק
  choice: പണ്ടേ
  rationale: പദപ്രകാരം ‘ദൂരത്തുനിന്ന്’ എന്ന സ്ഥലസൂചന സാധ്യമെങ്കിലും, പിന്നാലെയുള്ള ‘പുരാതനകാലംമുതലേ’ എന്ന സമാന്തരപ്രയോഗം ഇവിടെ വിദൂരമായ ഭൂതകാലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עָשִׂיתִי
  choice: ഞാൻ അതു ചെയ്തു
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയെ ലളിതമായി നിലനിർത്തുന്നു; ദൈവത്തിന്റെ പണ്ടേയുള്ള നിർണയത്തെ ‘പദ്ധതിയിട്ടു’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: לִימֵי קֶדֶם וִיצַרְתִּיהָ
  choice: പുരാതനകാലംമുതലേ ഞാൻ അതു രൂപപ്പെടുത്തി
  rationale: יצר എന്നതിലെ രൂപംകൊടുക്കുക, മെനയുക എന്ന ഭാവം കാത്തുസൂക്ഷിക്കുകയും കാലപരമായ സമാന്തരത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַתָּה הֲבֵיאתִיהָ
  choice: ഇപ്പോൾ ഞാൻ അതു നടപ്പാക്കിയിരിക്കുന്നു
  rationale: പണ്ടേ രൂപപ്പെടുത്തിയ കാര്യം ഇപ്പോൾ യാഥാർഥ്യമാക്കിയെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַהְשׁוֹת
  choice: നീ ശൂന്യമാക്കി
  rationale: ഹിഫീൽ രൂപത്തിലെ നാശത്തിനും ശൂന്യമാക്കലിനുമുള്ള കാരകഭാവം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עָרִים בְּצֻרוֹת
  choice: കോട്ടകെട്ടിയ നഗരങ്ങളെ
  rationale: പ്രതിരോധത്തിനായി ഉറപ്പിക്കപ്പെട്ട നഗരങ്ങൾ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: גַּלִּים נִצִּים
  choice: നാശക്കൂമ്പാരങ്ങളാക്കേണ്ടതിനുതന്നെ
  rationale: പ്രയാസമുള്ള എബ്രായ സംയുക്തത്തിന്റെ പൊതുചിത്രമായ നശിച്ച നഗരങ്ങളുടെ കൂമ്പാരങ്ങൾ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: അശ്ശൂരിന്റെ ജയങ്ങളിന്മേലുള്ള ദൈവിക പരമാധികാരം
  choice: അശ്ശൂർരാജാവിന്റെ നശീകരണവിജയം ദൈവം പണ്ടേ രൂപപ്പെടുത്തി ഇപ്പോൾ നടപ്പാക്കിയ കാര്യത്തിനുള്ളിൽ സംഭവിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: ഇത് വെറും മുൻകൂട്ടിയറിവായി മൃദൂകരിക്കുക, അല്ലെങ്കിൽ പാഠം പറയുന്നതിലപ്പുറം സമഗ്ര നിർണയവാദമായി വികസിപ്പിക്കുക.
  rationale: എബ്രായപാഠം ദൈവത്തിന്റെ മുൻകാല പ്രവർത്തനവും രൂപപ്പെടുത്തലും ഇപ്പോഴത്തെ നടപ്പാക്കലും ശക്തമായി പറയുന്നു; എന്നാൽ അശ്ശൂരിന്റെ ക്രൂരതയ്ക്ക് ധാർമിക അംഗീകാരം നൽകുകയോ അതിലപ്പുറം ദാർശനിക നിഗമനം ചേർക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; ദൈവിക പ്രസംഗത്തിന്റെ ഗൗരവം കാത്തുകൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടന. മൂലപാഠത്തിലെ ഏക വാചാടോപചോദ്യവും കാലവിരുദ്ധതയും—പണ്ടേ രൂപപ്പെടുത്തൽ, ഇപ്പോഴത്തെ നടപ്പാക്കൽ—നിലനിർത്തി.
