id: 2KI.19.18
reference: 2 Kings 19:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתְנ֥וּ אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
translation:
  language: ml
  text: അവരുടെ ദേവന്മാരെ അവർ തീയിലിട്ടു[a], കാരണം അവ ദേവന്മാരായിരുന്നില്ല; മനുഷ്യരുടെ കൈപ്പണിയായ മരവും കല്ലും മാത്രമായിരുന്നു. അതുകൊണ്ട് അവർ അവയെ നശിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ദേവന്മാരെ അവർ തീയിൽ വെച്ചു.’ എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘കൊടുത്തു/വെച്ചു’ എന്നാണ്; ഇവിടെ അത് തീയിലിടുക എന്ന അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: അവർ തീയിലിട്ടു
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കൊടുക്കുക/വയ്ക്കുക’ എന്നാണെങ്കിലും, തീയുമായി ചേർന്ന ഈ പ്രയോഗത്തിൽ ‘തീയിലിടുക’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; ‘എറിഞ്ഞു’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ വിശാലതയും ഇത് നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵיהֶם
  choice: അവരുടെ ദേവന്മാരെ
  rationale: വസ്തുക്കൾ യഥാർഥ ദേവന്മാരല്ലെന്ന് അടുത്ത വാക്യഭാഗം നിഷേധിക്കുന്നതിനാൽ, ‘വിഗ്രഹങ്ങൾ’ എന്നു മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ മൂലത്തിലെ ‘അവരുടെ ദേവന്മാർ’ എന്ന അവകാശവാദഭാഷ നിലനിർത്തുന്നു.
- source_word: בָּאֵשׁ
  choice: തീയിലിട്ടു
  rationale: ചലനവും തീയിലേക്കുള്ള ഇടലും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘തീയിലിട്ടു’ എന്നു ചേർത്ത് പരിഭാഷപ്പെടുത്തി.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: കാരണം, അവ ദേവന്മാരായിരുന്നില്ല
  rationale: മുൻപ്രവൃത്തിയുടെ കാരണം വ്യക്തമാക്കുകയും കഥാചരിത്രത്തിലെ ഭൂതകാലചട്ടക്കൂട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כִּי אִם
  choice: മാത്രമായിരുന്നു
  rationale: ‘ദേവന്മാരല്ല, മറിച്ച് ... മാത്രം’ എന്ന ശക്തമായ വിരോധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: മനുഷ്യരുടെ കൈപ്പണി
  rationale: മനുഷ്യർ നിർമിച്ച വസ്തുക്കൾ എന്ന അർഥം സംക്ഷിപ്തവും ലിംഗനിരപേക്ഷവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עֵץ וָאֶבֶן
  choice: മരവും കല്ലും
  rationale: വിഗ്രഹങ്ങളുടെ വസ്തുസ്വഭാവം നേരിട്ട് വ്യക്തമാക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: וַיְאַבְּדוּם
  choice: അതുകൊണ്ട് അവർ അവയെ നശിപ്പിച്ചു
  rationale: ക്രിയയെ 3-ാം പുരുഷ ബഹുവചന കർത്താവും ബഹുവചന കർമവും ഉള്ള സകർമക രൂപമായി എടുത്ത്, മുൻവാക്യത്തിൽനിന്നുള്ള ഫലബന്ധം ‘അതുകൊണ്ട്’ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אֱלֹהֵיהֶם എന്നതിന്റെ അവതരണം
  choice: അവരുടെ ദേവന്മാർ
  alternative: അവരുടെ വിഗ്രഹങ്ങൾ
  rationale: ജനതകൾ ദേവന്മാർ എന്നു കരുതിയവയെ ആദ്യം അതേ പേരിൽ സൂചിപ്പിച്ചശേഷം അവ യഥാർഥ ദേവന്മാരല്ലെന്ന് പാഠം തന്നെ പ്രഖ്യാപിക്കുന്ന വാഗ്‌രൂപം സംരക്ഷിക്കുന്നു.
- issue: אָדָם എന്ന പൊതുവാചകത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യരുടെ
  alternative: മനുഷ്യന്റെ
  rationale: ഇവിടെ ഒരു പ്രത്യേക പുരുഷനെയല്ല, മനുഷ്യനിർമാണത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘മനുഷ്യരുടെ’ എന്നത് അർഥം വ്യക്തമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ദേവന്മാർ’ എന്ന പദം നിലനിർത്തി തുടർന്നുള്ള നിഷേധത്തിന്റെ വാഗ്‌ബലം സംരക്ഷിച്ചിരിക്കുന്നു; അനാവശ്യമായി സഭാവിഭാഗപരമായ പദങ്ങൾ ചേർത്തിട്ടില്ല.
