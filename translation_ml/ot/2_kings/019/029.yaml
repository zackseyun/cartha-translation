  source_fidelity: The Malayalam accurately represents the sign formula, the first-year spontaneous growth (סָפִיחַ), the obscure second-year growth (סָחִישׁ), and the third-year sequence of sowing, reaping, planting vineyards, and eating their fruit. The singular address in ‘നിനക്കുള്ള’ is retained; the subsequent unmarked Malayalam imperatives suitably avoid forcing a person/number distinction while reflecting the Hebrew plural imperatives.
