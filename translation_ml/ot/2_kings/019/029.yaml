id: 2KI.19.29
reference: 2 Kings 19:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֣ הָ/א֔וֹת אָכ֤וֹל הַ/שָּׁנָה֙ סָפִ֔יחַ וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית סָחִ֑ישׁ וּ/בַ/שָּׁנָ֣ה הַ/שְּׁלִישִׁ֗ית זִרְע֧וּ וְ/קִצְר֛וּ וְ/נִטְע֥וּ כְרָמִ֖ים וְ/אִכְל֥וּ פִרְיָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
translation:
  language: ml
  text: '“ഇത് നിനക്കുള്ള അടയാളമായിരിക്കും: ഈ വർഷം തനിയെ മുളച്ചുവളരുന്നത് ഭക്ഷിക്കുക[a]; രണ്ടാം വർഷം അതിൽനിന്നു വീണ്ടും മുളച്ചുവളരുന്നതും ഭക്ഷിക്കുക[b]. മൂന്നാം വർഷം വിതച്ച് കൊയ്യുക; മുന്തിരിത്തോട്ടങ്ങൾ നട്ട് അവയുടെ ഫലം ഭക്ഷിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വയം വളർന്ന വിള’ എന്നും പരിഭാഷപ്പെടുത്താം; വിതയ്ക്കാതെ മുളച്ചുവരുന്ന വിളവിനെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ എബ്രായപദം അപൂർവമാണ്. മുൻവർഷത്തെ വിതയ്ക്കാത്ത വിളയിൽനിന്ന് രണ്ടാം വർഷം മുളച്ചുവരുന്ന ‘രണ്ടാം വളർച്ച’ എന്നായിരിക്കാം അതിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: അടയാളം
  rationale: പ്രവാചകീയ ഉറപ്പിന്റെ സ്ഥിരീകരണമായി אוֹת ഇവിടെ ‘അടയാളം’ എന്ന സാധാരണ അർഥത്തിലാണ്.
- source_word: אָכוֹל
  choice: ഭക്ഷിക്കുക
  rationale: ഇവിടത്തെ infinitive absolute നിർദേശാത്മകമായോ പ്രവചനാത്മകമായോ ഗ്രഹിക്കാം. തുടർന്നുള്ള ബഹുവചന ആജ്ഞകളോട് യോജിക്കുന്ന വിധത്തിൽ നിർദേശാത്മക രൂപം സ്വീകരിച്ചു.
- source_word: סָפִיחַ
  choice: തനിയെ മുളച്ചുവളരുന്നത്
  rationale: വിതയ്ക്കാതെ സ്വയം മുളച്ചുവരുന്ന വിളവിനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; സാങ്കേതിക പദത്തേക്കാൾ ഈ വിവരണം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: סָחִישׁ
  choice: അതിൽനിന്നു വീണ്ടും മുളച്ചുവളരുന്നത്
  rationale: അപൂർവമായ ഈ പദം മുൻവർഷത്തെ സ്വയം വളർന്ന വിളയിൽനിന്നുണ്ടാകുന്ന രണ്ടാം വർഷത്തെ വളർച്ചയെ സൂചിപ്പിക്കുന്നതാകാം. പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: വിതച്ച് കൊയ്യുക
  rationale: ധാന്യകൃഷിയിലെ പ്രവർത്തനക്രമം മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: וְנִטְעוּ כְרָמִים
  choice: മുന്തിരിത്തോട്ടങ്ങൾ നട്ട്
  rationale: כְרָמִים എന്ന ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാള പരിഭാഷയാണ്.
- source_word: וְאִכְלוּ פִרְיָם
  choice: അവയുടെ ഫലം ഭക്ഷിക്കുക
  rationale: ബഹുവചന പ്രത്യയം മുന്തിരിത്തോട്ടങ്ങളിലേക്കാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ‘ഫലം ഭക്ഷിക്കുക’ മൂലപാഠത്തോട് അടുത്തുനിൽക്കുന്നു.
theological_decisions:
- issue: ദൈവിക അടയാളത്തിന്റെ നിർദേശാത്മകവും പ്രവചനാത്മകവുമായ സ്വഭാവം
  choice: കൃഷിപ്രവർത്തനങ്ങളെ നിർദേശാത്മക രൂപത്തിൽ അവതരിപ്പിച്ചു
  alternative: ‘നിങ്ങൾ ഭക്ഷിക്കും/വിതയ്ക്കും/കൊയ്യും’ എന്ന പ്രവചനാത്മക രൂപം
  rationale: אָכוֹל എന്ന രൂപത്തിന് നിർദേശാത്മകവും പ്രവചനാത്മകവുമായ ഭാവങ്ങൾ സാധ്യമാണ്; തുടർന്നുള്ള വ്യക്തമായ ബഹുവചന ആജ്ഞാരൂപങ്ങൾ നിർദേശാത്മക പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു. ഇതിലൂടെ പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. לְךָ എന്ന ഏകവചന അഭിസംബോധന ‘നിനക്കുള്ള’ എന്നായി നിലനിർത്തി; തുടർന്നുള്ള കൃഷിനിർദേശങ്ങളിൽ മലയാളത്തിലെ വ്യക്തിവ്യത്യാസം വ്യക്തമാക്കാത്ത ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചതിനാൽ എബ്രായത്തിലെ ഏകവചനത്തിൽനിന്നുള്ള ബഹുവചനമാറ്റം അനാവശ്യമായി വിശദീകരിച്ചില്ല.
