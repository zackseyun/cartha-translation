- source_word: וּבֹאֲךָ
  choice: നീ അകത്തുവരുന്നത്
  rationale: בוא എന്ന ധാതുവിൽനിന്ന്; ‘പുറപ്പെടുന്നതും അകത്തുവരുന്നതും’ എന്ന സമഗ്രത സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: יָדָעְתִּי
  choice: ഞാൻ അറിയുന്നു
  rationale: ידע എന്ന ധാതുവിന്റെ Qal perfect ഒന്നാംപുരുഷ ഏകവചനരൂപം. സന്ദർഭത്തിൽ ദൈവത്തിന്റെ സ്ഥിരവും സമഗ്രവുമായ അറിവാണ് ഊന്നുന്നത്; അതിനാൽ മലയാളത്തിലെ വർത്തമാനകാലം സ്വാഭാവികമാണ്.
- source_word: הִתְרַגֶּזְךָ
  choice: നിന്റെ ക്രോധാവേശം
  rationale: רגז എന്ന ധാതുവിന്റെ Hitpael രൂപം; അസ്വസ്ഥത, ഇളക്കം, ക്രോധം എന്നിവയുടെ അർത്ഥവ്യാപ്തിയുണ്ട്. ഇവിടെ ദൈവത്തോടുള്ള ശത്രുതാപരമായ വികാരം വ്യക്തമാക്കാനും അതേസമയം പദത്തിന്റെ അർത്ഥവ്യാപ്തി അടച്ചുപൂട്ടാതിരിക്കാനും ‘ക്രോധാവേശം’ ഉപയോഗിച്ചു.
- source_word: אֵלַי
  choice: എനിക്കെതിരെയുള്ള
  rationale: אל അടിസ്ഥാനമായി ‘എന്നിലേക്കു/എന്നോടു’ എന്നാണെങ്കിലും, ക്രോധാവേശത്തിന്റെ സന്ദർഭത്തിൽ മലയാളത്തിൽ ശത്രുതാപരമായ ദിശ വ്യക്തമാക്കാൻ ‘എനിക്കെതിരെയുള്ള’ സ്വാഭാവികമാണ്.
- source_word: וְאֵת
  choice: -വും
  rationale: സംയോജകവും നേരിട്ടുള്ള കർമചിഹ്നവും ചേർന്ന രൂപം അവസാന കർമത്തെ ‘ഞാൻ അറിയുന്നു’ എന്ന ക്രിയയോട് ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-വും’ എന്ന സമുച്ചയപ്രത്യയം സ്വാഭാവികമായി ഈ ബന്ധം വഹിക്കുന്നു.
