base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
translation:
  language: ml
  text: 'ഹിസ്കീയാവ് യഹ്‌വേയുടെ സന്നിധിയിൽ പ്രാർഥിച്ചു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ, കെരൂബുകളുടെ മീതെ സിംഹാസനസ്ഥനായിരിക്കുന്നവനേ[a], ഭൂമിയിലെ സകല രാജ്യങ്ങൾക്കുംമേൽ ദൈവമായിരിക്കുന്നത് അങ്ങു മാത്രമാണ്. ആകാശവും ഭൂമിയും ഉണ്ടാക്കിയത് അങ്ങാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കെരൂബുകളുടെ ഇടയിൽ വസിക്കുന്നവനേ.” എബ്രായത്തിൽ “കെരൂബുകളുടെ മേൽ/ഇടയിൽ” എന്ന സ്ഥാനസൂചക പദം വ്യക്തമല്ല; “കെരൂബുകളോടു ബന്ധപ്പെട്ട് ഇരിക്കുന്നവൻ/വസിക്കുന്നവൻ” എന്നാണ് പ്രയോഗം. യഹ്‌വേ രാജാവായി സിംഹാസനസ്ഥനായിരിക്കുന്നതിന്റെ ആരാധനാപരമായ പ്രതീകമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: പ്രാർഥിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘പ്രാർഥിക്കുക’ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: ‘മുമ്പാകെ/സന്നിധിയിൽ’ എന്ന സ്ഥലപരവും ബന്ധപരവുമായ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ നേരിട്ടുള്ള അർഥം; ഇവിടെ സംബോധനരൂപത്തിൽ ഉപയോഗിച്ചു.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: കെരൂബുകളുടെ മീതെ സിംഹാസനസ്ഥനായിരിക്കുന്നവൻ
  rationale: രാജകീയ-ആരാധനാപരമായ പശ്ചാത്തലത്തിലെ സിംഹാസനാരോഹണ പ്രതീകം വ്യക്തമാക്കുന്നു; കൃത്യമായ സ്ഥലബന്ധത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: ദൈവം അങ്ങു മാത്രമാണ്
  rationale: പ്രത്യേക സർവനാമവും ‘മാത്രം’ എന്ന പദവും നൽകുന്ന ഏകത്വത്തിന്റെയും ഊന്നലിന്റെയും ശക്തി സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: ഭൂമിയിലെ സകല രാജ്യങ്ങൾക്കും
  rationale: എബ്രായ לְ എന്ന വിശാലബന്ധസൂചകത്തെ നേരിട്ട് ‘രാജ്യങ്ങൾക്കും’ എന്നു നൽകുന്നു; ‘മേൽ’ ചേർത്ത് ആധിപത്യാർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: עָשִׂיתָ
  choice: ഉണ്ടാക്കിയത്
  rationale: עָשָׂה എന്നതിന്റെ സാധാരണ അർഥമായ ‘ഉണ്ടാക്കുക’ സംരക്ഷിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേക സൃഷ്ടിക്രിയാപദം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ആകാശവും ഭൂമിയും
  rationale: പ്രചാരത്തിലുള്ള സൃഷ്ടിസൂത്രം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; എബ്രായത്തിലെ ‘ആകാശങ്ങൾ’ എന്ന രൂപം മലയാളത്തിൽ സാധാരണയായി ഏകവചനസമൂഹാർഥത്തിൽ വരുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ദൈവത്തിന്റെ ഏകത്വവും സർവരാജ്യങ്ങളോടുള്ള ബന്ധവും
  choice: ഭൂമിയിലെ സകല രാജ്യങ്ങൾക്കും ദൈവം അങ്ങു മാത്രമാണ്
  alternative: ഭൂമിയിലെ സകല രാജ്യങ്ങളുടെയും മേൽ ദൈവം അങ്ങു മാത്രമാണ്
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ വിശാലത നിലനിർത്തിക്കൊണ്ട് യഹ്‌വേ മാത്രം ദൈവമാണെന്ന വാക്യത്തിന്റെ വ്യക്തമായ ഊന്നൽ സംരക്ഷിക്കുന്നു; ‘മേൽ’ എന്ന ആധിപത്യവ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- issue: കെരൂബുകളോടുള്ള ദൈവത്തിന്റെ സ്ഥാനബന്ധം
  choice: കെരൂബുകളുടെ മീതെ സിംഹാസനസ്ഥനായിരിക്കുന്നവൻ
  alternative: കെരൂബുകളുടെ ഇടയിൽ/മീതെ ഇരിക്കുന്നവൻ അഥവാ വസിക്കുന്നവൻ
  rationale: പെട്ടകത്തിന്റെയും കെരൂബുകളുടെയും രാജകീയ-ആരാധനാപരമായ പ്രതീകം മുഖ്യപാഠത്തിൽ വ്യക്തമായി നൽകുന്നു; എബ്രായപ്രയോഗത്തിന്റെ സ്ഥലപരമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രാർഥനാശൈലി സ്വീകരിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ‘കെരൂബ്’ എന്ന സ്ഥാപിത ബൈബിൾ പദം നിലനിർത്തി; അതിന്റെ ബഹുവചനം ‘കെരൂബുകൾ’ എന്നു സ്വാഭാവികമാക്കി.
