  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּךְ֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה שְׁמוֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
translation:
  language: ml
  text: ആ രാത്രിയിൽ യഹ്‌വേയുടെ ദൂതൻ പുറപ്പെട്ട് അശ്ശൂരിന്റെ പാളയത്തിൽ ഒരുലക്ഷത്തി എൺപത്തയ്യായിരം പേരെ സംഹരിച്ചു. അതിരാവിലെ അവർ എഴുന്നേറ്റപ്പോൾ[a], അതാ, അവരെല്ലാവരും മരിച്ചുകിടക്കുന്ന ശവങ്ങളായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവർ പ്രഭാതത്തിൽ നേരത്തെ എഴുന്നേറ്റു.’ ‘അവർ’ ആരെന്നത് എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: ‘ശവങ്ങൾ, മരിച്ചവ’—വധിക്കപ്പെട്ടവരുടെ അവസ്ഥയെ ഊന്നിപ്പറയുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: ആ രാത്രിയിൽ
  rationale: എബ്രായ ആഖ്യാനസൂത്രത്തിലെ ‘സംഭവിച്ചു’ എന്ന ഘടകം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ചുരുക്കി, സമയബന്ധം നിലനിർത്തുന്നു.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വേയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നത് ദൂതൻ/സന്ദേശവാഹകൻ എന്നർഥമുള്ളതാണെങ്കിലും, ഇവിടെ അതിമാനുഷികമായ ദൈവിക പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്; ദൈവനാമം യഹ്‌വേ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ട്
  rationale: יצא എന്ന ക്രിയയുടെ ‘പുറപ്പെടുക’ എന്ന ചലനാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיַּךְ
  choice: സംഹരിച്ചു
  rationale: נכה ഇവിടെ മരണത്തിൽ കലാശിക്കുന്ന ദൈവിക പ്രഹരത്തെ സൂചിപ്പിക്കുന്നു; ‘സംഹരിച്ചു’ പ്രഹരത്തിന്റെ മാരകഫലം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: അശ്ശൂർപാളയത്തിലെ
  rationale: ‘അശ്ശൂരിന്റെ പാളയത്തിൽ’ എന്ന മൂലഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; അശ്ശൂർ സൈന്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף
  choice: ഒരുലക്ഷത്തി എൺപത്തയ്യായിരം പേരെ
  rationale: 185,000 എന്ന സംഖ്യ സാധാരണ മലയാള സംഖ്യാവ്യവഹാരത്തിൽ നൽകുന്നു; കൊല്ലപ്പെട്ട മനുഷ്യരെ സൂചിപ്പിക്കാൻ ‘പേരെ’ ചേർക്കുന്നത് ലക്ഷ്യഭാഷയിൽ ആവശ്യമായ സ്വാഭാവികത നൽകുന്നു.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: അതിരാവിലെ അവർ എഴുന്നേറ്റപ്പോൾ
  rationale: മൂലത്തിലെ മൂന്നാംപുരുഷ ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നു നിലനിർത്തുന്നു; കർത്താവ് ആരെന്നത് വ്യാഖ്യാനിച്ച് നിശ്ചയിക്കുന്നില്ല. השׁכים എന്നതിലെ നേരത്തേ എഴുന്നേൽക്കുക എന്ന ഭാവം ‘അതിരാവിലെ’ നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: അപ്രതീക്ഷിതമായ ദൃശ്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ ആഖ്യാനശക്തി സ്വാഭാവിക മലയാള ബൈബിൾശൈലിയിൽ നിലനിർത്തുന്നു.
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: അവരെല്ലാവരും മരിച്ചുകിടക്കുന്ന ശവങ്ങളായിരുന്നു
  rationale: ‘അവരെല്ലാവരും’ സമഗ്രത നിലനിർത്തുന്നു; ‘ശവങ്ങൾ, മരിച്ചവർ’ എന്ന ഊന്നലുള്ള ഇരട്ടപ്രയോഗത്തിന്റെ ഭാരം ‘മരിച്ചുകിടക്കുന്ന ശവങ്ങൾ’ എന്ന സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ രൂപം നിർബന്ധിക്കുന്നില്ല.
- issue: מַלְאַךְ יְהוָה എന്ന പ്രയോഗത്തിന്റെ നിർവചിതത്വം
  choice: യഹ്‌വേയുടെ ദൂതൻ
  alternative: യഹ്‌വേയുടെ ഒരു ദൂതൻ
  rationale: എബ്രായ നിർമാണം മലയാളത്തിൽ സ്വാഭാവികമായി നിർവചിത പ്രയോഗമായി വായിക്കാം; ദൂതന്റെ ontological identityയെക്കുറിച്ച് അധിക സിദ്ധാന്തനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതാ’ എന്ന ശ്രദ്ധാകർഷക പദം മൂലത്തിന്റെ നാടകീയത നിലനിർത്തുന്നു. കർത്താവ് വ്യക്തമല്ലാത്തിടത്ത് അതിനെ വ്യാഖ്യാനിച്ച് പൂരിപ്പിക്കാതെ അടിക്കുറിപ്പിലൂടെ അസ്പഷ്ടത രേഖപ്പെടുത്തി.
