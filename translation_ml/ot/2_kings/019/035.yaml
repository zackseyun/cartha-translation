revisions:
- from: ആ രാത്രിയിൽ യഹ്‌വേയുടെ ദൂതൻ പുറപ്പെട്ട് അശ്ശൂർപാളയത്തിലെ ഒരുലക്ഷത്തി എൺപത്തയ്യായിരം പേരെ സംഹരിച്ചു. അതിരാവിലെ അവർ എഴുന്നേറ്റപ്പോൾ[a], അതാ, അവരെല്ലാവരും മരിച്ചുകിടക്കുന്ന ശവങ്ങളായിരുന്നു[b].
  to: ആ രാത്രിയിൽ യഹ്‌വേയുടെ ദൂതൻ പുറപ്പെട്ട് അശ്ശൂരിന്റെ പാളയത്തിൽ ഒരുലക്ഷത്തി എൺപത്തയ്യായിരം പേരെ സംഹരിച്ചു. അതിരാവിലെ അവർ എഴുന്നേറ്റപ്പോൾ[a], അതാ, അവരെല്ലാവരും മരിച്ചുകിടക്കുന്ന ശവങ്ങളായിരുന്നു[b].
  rationale: 'വാക്യത്തിന്റെ അർഥവും ആഖ്യാനത്തിലെ അസ്പഷ്ടതയും മാറ്റാതെ, അശ്ശൂർപാളയത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം വായനാസുതാര്യമാക്കി. പ്രധാനമായി, ഇരു അടിക്കുറിപ്പുകളും എബ്രായപാഠത്തിന്റെ യഥാർഥ ഘടകങ്ങൾ രേഖപ്പെടുത്തുന്നവിധം തിരുത്തി: a-യിൽ പ്രഭാതസൂചന ഉൾപ്പെടുത്തി; b-യിൽ ‘ശവങ്ങൾ’ എന്ന നാമവും അതിന്റെ ‘മരിച്ചവ’ എന്ന വിശേഷണവും വേർതിരിച്ചു വ്യക്തമാക്കി.'
