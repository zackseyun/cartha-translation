id: 2KI.19.20
reference: 2 Kings 19:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֶל חִזְקִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֨ר הִתְפַּלַּ֧לְתָּ אֵלַ֛/י אֶל סַנְחֵרִ֥ב מֶֽלֶךְ אַשּׁ֖וּר שָׁמָֽעְתִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: ml
  text: 'അപ്പോൾ ആമോസിന്റെ മകനായ യെശയ്യാവ് ഹിസ്കീയാവിന് ഈ സന്ദേശം അയച്ചു: “യിസ്രായേലിന്റെ ദൈവമായ യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘അശ്ശൂർരാജാവായ സൻഹേരീബിനെക്കുറിച്ച് നീ എന്നോടു പ്രാർഥിച്ചതിനാൽ, ഞാൻ കേട്ടിരിക്കുന്നു.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ഈ സന്ദേശം അയച്ചു
  rationale: ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ ‘അയച്ചു’ എന്നാണ്; ഇവിടെ തുടർന്നുവരുന്ന ദൈവവചനം ഹിസ്കീയാവിനെ അറിയിക്കാൻ ആളെയോ സന്ദേശത്തെയോ അയച്ചതാണെന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകസൂത്രവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; ദൈവനാമമായ יהוה പൊതുവേ അംഗീകരിക്കപ്പെട്ട മലയാളരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֲשֶׁר הִתְפַּלַּלְתָ אֵלַי
  choice: നീ എന്നോടു പ്രാർഥിച്ചതിനാൽ
  rationale: אֲשֶׁר എന്ന ബന്ധകത്തിന്റെ സാഹചര്യപരമായ കാരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പ്രാർഥന കേട്ടെന്ന തുടർവാക്യവുമായി ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: שָׁמָעְתִּי
  choice: ഞാൻ കേട്ടിരിക്കുന്നു
  rationale: പൂർണ്ണക്രിയയുടെ പൂർത്തിയായ പ്രവർത്തനവും അതിന്റെ നിലവിലുള്ള പ്രസക്തിയും സംരക്ഷിക്കുന്നു; മൂലത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്ത ‘നിന്റെ പ്രാർഥന’ എന്ന കർമം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവനാമം יהוה എങ്ങനെ നൽകണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു.
- issue: אֲשֶׁר എന്നതിന്റെ ബന്ധം
  choice: കാരണം സൂചിപ്പിക്കുന്ന ‘പ്രാർഥിച്ചതിനാൽ’
  alternative: ‘നീ എന്നോടു പ്രാർഥിച്ചതു ഞാൻ കേട്ടിരിക്കുന്നു’
  rationale: മസോററ്റിക് പാഠത്തിലെ വാക്യഘടനയും ഇംഗ്ലീഷ് ഓഡിറ്റ് പാളിയിലെ കാരണാർഥ വായനയും പിന്തുടരുന്നു; എങ്കിലും ദൈവം കേട്ടത് പ്രാർഥന തന്നെയാണെന്ന സ്വാഭാവിക ആശയം മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പേരുകൾ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകി; അനാവശ്യമായ പഴഞ്ചൊല്ലുകളും വിഭാഗീയ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
