id: 2KI.19.22
reference: 2 Kings 19:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָ קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ עַל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
translation:
  language: ml
  text: “നീ ആരെ നിന്ദിക്കുകയും ദൈവദൂഷണം ചെയ്യുകയും ചെയ്തു?[a] നീ ആർക്കെതിരെ ശബ്ദമുയർത്തി, ആർക്കെതിരെ നിന്റെ കണ്ണുകൾ ഉയരത്തിലേക്കുയർത്തി?[b] ഇസ്രായേലിന്റെ പരിശുദ്ധനെതിരെ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്ദിക്കുകയും ദൈവദൂഷണം ചെയ്യുകയും’ എന്നതിന് ‘പരിഹസിക്കുകയും അധിക്ഷേപിക്കുകയും’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ രണ്ടു ക്രിയകളും നിന്ദാപൂർവവും അവഹേളനപരവുമായ സംസാരത്തെ സൂചിപ്പിക്കുന്ന അടുത്ത അർഥമുള്ള പദങ്ങളാണ്; രണ്ടാമത്തേത് പ്രത്യേകിച്ച് ദൈവത്തിനെതിരായ ദൂഷണത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ കണ്ണുകൾ ഉയരത്തിലേക്കുയർത്തി.’ അഹങ്കാരത്തെയോ സ്വയം ഉന്നതനാക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: പരിഹസിച്ചു
  rationale: ദൈവത്തെ ലക്ഷ്യമാക്കിയ നിന്ദയും അവഹേളനവും സൂചിപ്പിക്കുന്ന ക്രിയ. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും തുടർന്നുള്ള ശക്തമായ ക്രിയയോടു ചേരുന്നതുമാണ്.
- source_word: גִדַּפְתָּ
  choice: ദൈവദൂഷണം പറഞ്ഞു
  rationale: ഇവിടെ ആത്യന്തികമായി ഇസ്രായേലിന്റെ പരിശുദ്ധനെതിരായ നിന്ദാവാക്കുകളായതിനാൽ, എബ്രായ ക്രിയയുടെ ദൈവവിരുദ്ധമായ ഗൗരവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הֲרִימוֹתָ קּוֹל
  choice: ശബ്ദമുയർത്തി
  rationale: ‘ശബ്ദം ഉയർത്തുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളസമാനത; ഉച്ചത്തിലുള്ള ധിക്കാരവെല്ലുവിളി സന്ദർഭത്തിൽ പ്രകടമാകുന്നു.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: അഹങ്കാരത്തോടെ കണ്ണുയർത്തി
  rationale: അക്ഷരാർഥചിത്രം പൂർണമായി അനുകരിക്കുന്നതിനേക്കാൾ, കണ്ണുകൾ ഉയരത്തിലേക്ക് ഉയർത്തുക എന്ന എബ്രായ ശൈലി സൂചിപ്പിക്കുന്ന അഹങ്കാരം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: קְדֹושׁ יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പരിശുദ്ധൻ
  rationale: സ്ഥിരമായ ദൈവിക വിശേഷനാമം നേരിട്ടും മാന്യമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: עַל
  choice: എതിരായി / എതിരെ
  rationale: രണ്ടിടത്തും ശത്രുതാപരമായ ലക്ഷ്യദിശയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളവാക്യഘടന അനുസരിച്ച് വിഭക്തിരൂപം മാറ്റിയിരിക്കുന്നു.
- source_word: מִי
  choice: ആരെ / ആർക്ക്
  rationale: ക്രിയയുടെയും ബന്ധപദത്തിന്റെയും കർമമായ ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിനെതിരായ വാക്കുകളുടെ ദൈവശാസ്ത്രപരമായ ഗൗരവം നിലനിർത്തൽ
  choice: גִדַּפְתָּ എന്നതിന് ‘ദൈവദൂഷണം പറഞ്ഞു’ എന്നും അവസാനത്തിൽ ‘ഇസ്രായേലിന്റെ പരിശുദ്ധനെതിരെ’ എന്നും ഉപയോഗിച്ചു.
  alternative: ‘നിന്ദിച്ചു’ അല്ലെങ്കിൽ ‘അധിക്ഷേപിച്ചു’ എന്ന പൊതുവായ പദങ്ങൾ ഉപയോഗിക്കുക.
  rationale: സൻഹേരീബിന്റെ കുറ്റം രാഷ്ട്രീയ അഹങ്കാരം മാത്രമല്ല, ഇസ്രായേലിന്റെ ദൈവത്തിനെതിരായ നിന്ദയുമാണെന്ന് പദവും സന്ദർഭവും സൂചിപ്പിക്കുന്നു. ‘ദൈവദൂഷണം’ ആ ഗൗരവം അധിക വ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ദൈവിക അഭിസംബോധനയുടെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. എബ്രായത്തിലെ ആവർത്തിച്ച ചോദ്യഘടനയും അവസാനത്തെ ശക്തമായ തിരിച്ചറിയലും സംരക്ഷിച്ചു; അവസാനത്തിൽ ‘അല്ലോ’ ചേർത്ത് എതിരാളിയുടെ കുറ്റം ഉറപ്പിക്കുന്ന വാക്യബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കി.
