  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: ml
  text: 'നിങ്ങൾ യെഹൂദാരാജാവായ ഹിസ്കീയാവിനോടു ഇപ്രകാരം പറയണം: ‘നീ ആശ്രയിക്കുന്ന നിന്റെ ദൈവം[a], “യെരൂശലേം അശ്ശൂർ രാജാവിന്റെ കൈയിൽ ഏൽപ്പിക്കപ്പെടുകയില്ല” എന്നു പറഞ്ഞ് നിന്നെ വഞ്ചിക്കാൻ അനുവദിക്കരുത്.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ ദേവൻ.” എബ്രായ ലിപിയിൽ വലിയക്ഷര-ചെറിയക്ഷര വ്യത്യാസം അടയാളപ്പെടുത്തുന്നില്ല; അസ്സീറിയൻ വക്താവ് ഹിസ്കീയാവിന്റെ ആശ്രയത്തെ പരിഹസിക്കുകയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  choice: നിങ്ങൾ ... ഇപ്രകാരം പറയണം
  rationale: כֹּה എന്ന സന്ദേശസൂത്രത്തിന്റെ ഔപചാരിക ഭാവവും നിർദേശാർഥത്തിലുള്ള ബഹുവചന ക്രിയയുടെ ശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ ഹിസ്കീയാവ്
  rationale: പേരിനോടു ചേർന്ന രാജകീയ പദവി മലയാളത്തിൽ സ്വാഭാവികമായ സമാനാധികരണരൂപത്തിൽ നൽകുന്നു.
- source_word: אַל יַשִּׁאֲךָ
  choice: നിന്നെ വഞ്ചിക്കാതിരിക്കട്ടെ
  rationale: נשׁא എന്ന ക്രിയയുടെ ‘വഞ്ചിക്കുക/തെറ്റിദ്ധരിപ്പിക്കുക’ എന്ന അർഥവും אַל ചേർന്ന നിരോധനഭാവവും നിലനിർത്തുന്നു; അസ്സീറിയൻ പരിഹാസത്തിന്റെ മൂർച്ചയും സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവം
  rationale: ഹിസ്കീയാവിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന ഉടമസ്ഥരൂപം നേരിട്ട് പകരുന്നു. എബ്രായലിപിയിൽ വലിയക്ഷര-ചെറിയക്ഷര വ്യത്യാസമില്ലാത്തതിനാൽ പരിഹാസസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בּוֹ
  choice: നീ ആശ്രയിക്കുന്ന
  rationale: בטח ב എന്നത് ഒരാളിൽ വിശ്വാസമർപ്പിക്കുക/ആശ്രയിക്കുക എന്നർഥം നൽകുന്നു; ഇവിടെ ‘ആശ്രയിക്കുക’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: לֵאמֹר
  choice: എന്നു പറഞ്ഞ്
  rationale: വഞ്ചന നടക്കുന്നതായി പ്രസംഗകൻ ആരോപിക്കുന്ന വാക്കുകളുടെ ഉള്ളടക്കവുമായി ക്രിയയെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: לֹא תִנָּתֵן
  choice: ഏല്പിക്കപ്പെടുകയില്ല
  rationale: נתן എന്ന ക്രിയയുടെ നിഫാൽ നിഷ്ക്രിയരൂപം സംരക്ഷിക്കുന്നു; നഗരത്തെ ശത്രുവിന്റെ അധികാരത്തിലേക്ക് കൈമാറുക എന്ന സന്ദർഭാർഥം വ്യക്തമാണ്.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവിന്റെ കൈയിൽ
  rationale: നിയന്ത്രണത്തിലോ അധികാരത്തിലോ ഏല്പിക്കപ്പെടുക എന്ന എബ്രായ രൂപകം മലയാളത്തിലും ഗ്രാഹ്യമായതിനാൽ ‘കൈയിൽ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: അസ്സീറിയൻ രാജാവിന്റെ വാക്കുകളിൽ אֱלֹהֶיךָ എന്നതിന്റെ അവതരണം
  choice: നിന്റെ ദൈവം
  alternative: നിന്റെ ദേവൻ
  rationale: പരാമർശം ഹിസ്കീയാവും യെഹൂദയും ആരാധിക്കുന്ന ദൈവത്തോടായതിനാൽ മുഖ്യപാഠത്തിൽ പതിവായ ‘ദൈവം’ സ്വീകരിക്കുന്നു. എന്നാൽ സംസാരിക്കുന്നവന്റെ ശത്രുതാപരവും പരിഹാസപരവുമായ ഭാവം പദത്തെ നിന്ദാസൂചകമായി ഗ്രഹിക്കാൻ ഇടനൽകുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഔപചാരികവും മാന്യവുമായ ശൈലി. രാജസന്ദേശത്തിന്റെ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ പദക്രമം ഉപയോഗിച്ചു; എബ്രായയിലെ ‘കൈയിൽ’ എന്ന അധികാരരൂപകം സംരക്ഷിച്ചു.
