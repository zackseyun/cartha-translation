id: 2KI.19.16
reference: 2 Kings 19:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שֲׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖י/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שְׁלָח֔/וֹ לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
translation:
  language: ml
  text: യഹ്‌വേ, അങ്ങയുടെ ചെവി ചായിച്ചു കേൾക്കണമേ; യഹ്‌വേ, അങ്ങയുടെ കണ്ണുകൾ തുറന്നു കാണണമേ; ജീവനുള്ള ദൈവത്തെ നിന്ദിക്കാനായി[a] സൻഹേരീബ് അയച്ച വാക്കുകൾ കേൾക്കണമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജീവനുള്ള ദൈവത്തെ വെല്ലുവിളിക്കാനായി”; എബ്രായക്രിയയ്ക്ക് നിന്ദിക്കുക, അധിക്ഷേപിക്കുക, വെല്ലുവിളിക്കുക എന്നീ അർഥഭാവങ്ങൾ ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: അങ്ങയുടെ ചെവി ചായിച്ചു
  rationale: ‘ചെവി ചായിക്കുക’ എന്ന പ്രയോഗം ശ്രദ്ധയോടെ കേൾക്കണമെന്ന എബ്രായ ശൈലിയുടെ അർഥവും പ്രാർഥനയുടെ ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וּשֲׁמָע
  choice: കേൾക്കണമേ
  rationale: ശמע എന്ന ക്രിയയുടെ ആവർത്തനം വാക്യത്തിന്റെ ആരംഭത്തിലും അവസാനത്തിലും നിലനിർത്തുകയും അപേക്ഷാഭാവം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: פְּקַח ... עֵינֶיךָ וּרְאֵה
  choice: അങ്ങയുടെ കണ്ണുകൾ തുറന്നു കാണണമേ
  rationale: കണ്ണുകൾ തുറക്കുക, കാണുക എന്നീ സമാന്തര ആജ്ഞാരൂപങ്ങൾ നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: സൻഹേരീബിന്റെ വാക്കുകൾ
  rationale: דִּבְרֵי എന്ന ബഹുവചനം ‘വാക്കുകൾ’ എന്നു നേരിട്ട് നൽകുകയും രാജാവിന്റെ പേര് പ്രചാരത്തിലുള്ള മലയാളരൂപത്തിൽ എഴുതുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: സൻഹേരീബ് അയച്ച
  rationale: എബ്രായത്തിലെ പ്രത്യയത്തിന്റെ വാക്യഘടന മലയാളത്തിൽ അക്ഷരാർഥമായി അസ്വാഭാവികമാകുന്നതിനാൽ, അയച്ച സന്ദേശത്തെയോ വാക്കുകളെയോ സൂചിപ്പിക്കുന്ന വിധത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְחָרֵף
  choice: നിന്ദിക്കാനായി
  rationale: חרף എന്ന ക്രിയയിലെ അപമാനിക്കൽ, അധിക്ഷേപിക്കൽ എന്നീ മുഖ്യഭാവങ്ങൾ ‘നിന്ദിക്കുക’ വ്യക്തമായി നൽകുന്നു; വെല്ലുവിളിക്കുക എന്ന സാദ്ധ്യമായ ഭാവം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֱלֹהִים חָי
  choice: ജീവനുള്ള ദൈവം
  rationale: വിഗ്രഹങ്ങളുടെ ജീവനില്ലായ്മയോടുള്ള പശ്ചാത്തലവൈരുധ്യം സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബൈബിൾ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ആ പേര് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: לְחָרֵף എന്ന ക്രിയയുടെ ദൈവത്തോടുള്ള പ്രയോഗം
  choice: ജീവനുള്ള ദൈവത്തെ നിന്ദിക്കാനായി
  alternative: ജീവനുള്ള ദൈവത്തെ വെല്ലുവിളിക്കാനായി; ജീവനുള്ള ദൈവത്തെ അധിക്ഷേപിക്കാനായി
  rationale: ക്രിയയുടെ മുഖ്യമായ പരിഹാസ-അപമാന ഭാവം ‘നിന്ദിക്കുക’ നിലനിർത്തുന്നു; ഏറ്റുമുട്ടലിന്റെയോ ധിക്കാരത്തിന്റെയോ സാദ്ധ്യമായ ഭാവം അടിക്കുറിപ്പിലൂടെ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. ദൈവത്തോടുള്ള ആദരസൂചക ഏകവചനമായി ‘അങ്ങ്’ സ്വീകരിച്ചു; മൂലത്തിലെ ‘കേൾക്കുക’ എന്ന ആവർത്തനവും കണ്ണ്–ചെവി സമാന്തരതയും നിലനിർത്തി.
