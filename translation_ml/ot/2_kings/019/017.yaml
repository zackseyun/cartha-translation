    rationale: The Hiphil of חרב denotes causing devastation or desolation; “വിജനമാക്കിയിരിക്കുന്നു” preserves that sense more precisely.
  revised_text: തീർച്ചയായും, യാഹ്‌വേ, അശ്ശൂർ രാജാക്കന്മാർ ജനതകളെയും അവരുടെ ദേശങ്ങളെയും വിജനമാക്കിയിരിക്കുന്നു[a].
