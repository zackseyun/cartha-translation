source:
  edition: WLC
  text: אָמְנָ֖ם יְהוָ֑ה הֶחֱרִ֜יבוּ מַלְכֵ֥י אַשּׁ֛וּר אֶת הַ/גּוֹיִ֖ם וְ/אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/017.yaml
  text: Truly[a], O Yahweh[b], the kings of Assyria have laid waste the nations and their lands.
translation:
  language: ml
  text: തീർച്ചയായും, യാഹ്‌വേ, അശ്ശൂർ രാജാക്കന്മാർ ജനതകളെയും അവരുടെ ദേശങ്ങളെയും വിജനമാക്കിയിരിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തീർച്ചയായും’ എന്നതിന് ‘തീർച്ചയായും’/‘നിശ്ചയമായും’ എന്നർഥമുള്ള ഊന്നൽപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: സത്യംതന്നെ
  rationale: മുമ്പു പറഞ്ഞ അവകാശവാദത്തിന്റെ സത്യത്തെ ഊന്നിപ്പറയുന്ന ആരംഭപ്രയോഗം; ‘തീർച്ചയായും’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: יְהוָה
  choice: യഹോവേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; സംബോധനാവിഭക്തി അനുസരിച്ച് ‘യഹോവേ’ എന്നു നൽകി.
- source_word: הֶחֱרִיבוּ
  choice: നശിപ്പിച്ചുകളഞ്ഞു
  rationale: ഹിഫിൽ രൂപം യുദ്ധത്തിലൂടെ ശൂന്യമാക്കുകയോ തകർത്തുകളയുകയോ ചെയ്യുന്ന ശക്തമായ അർഥം നൽകുന്നു.
- source_word: מַלְכֵי אַשּׁוּר
  choice: അശ്ശൂർരാജാക്കന്മാർ
  rationale: എബ്രായ നിർമാണബന്ധത്തെ സ്വാഭാവികവും സുതാര്യവുമായ മലയാള സംയുക്തപദമായി നൽകി.
- source_word: הַגּוֹיִם
  choice: ജനതകളെ
  rationale: ഇവിടെ അശ്ശൂർ കീഴടക്കിയ രാഷ്ട്രീയ-ജനസമൂഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ജാതികൾ’ എന്നതിനെക്കാൾ ഇന്നത്തെ മലയാളത്തിൽ ‘ജനതകൾ’ വ്യക്തമാണ്.
- source_word: אַרְצָם
  choice: അവരുടെ ദേശങ്ങളെ
  rationale: മൂലത്തിൽ ഏകവചനമായ ‘അവരുടെ ദേശം’ എന്ന രൂപമാണെങ്കിലും, ബഹുവചനമായ ജനതകളെ സംബന്ധിക്കുന്ന വിതരണാത്മക/സമൂഹാത്മക അർഥം സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനമായി പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ ലിപ്യന്തരിച്ചു. മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതവും മാന്യവുമായ ‘യഹോവ’ സ്വീകരിച്ചു; ‘യാഹ്‌വെ’ ശാസ്ത്രീയ പുനർനിർമാണത്തോട് അടുത്ത മറ്റൊരു സാധ്യതയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ പ്രാർഥനാസന്ദർഭത്തിന് യോജിച്ച ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യക്രമം കൃത്രിമമായി പകർത്താതെ, ആരംഭത്തിലെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി വാക്യാവസാനത്ത് ‘സത്യംതന്നെ’ എന്നു നിലനിർത്തി.
