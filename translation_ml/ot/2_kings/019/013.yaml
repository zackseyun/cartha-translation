id: 2KI.19.13
reference: 2 Kings 19:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַיּ֤/וֹ מֶֽלֶךְ חֲמָת֙ וּ/מֶ֣לֶךְ אַרְפָּ֔ד וּ/מֶ֖לֶךְ לָעִ֣יר סְפַרְוָ֑יִם הֵנַ֖ע וְ/עִוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, Hena, and Ivvah?
translation:
  language: ml
  text: ഹമാത്തിലെ രാജാവും അർപ്പാദിലെ രാജാവും സെഫർവയീം നഗരത്തിലെയും ഹേനയിലെയും ഇവ്വായിലെയും രാജാവും എവിടെ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַיּוֹ
  choice: എവിടെ?
  rationale: മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ചോദ്യം; പരാമർശിക്കപ്പെടുന്ന രാജാക്കന്മാരുടെ ഇപ്പോഴത്തെ സ്ഥിതിയോ അന്തിമഗതിയോ പരിഹാസത്തോടെ ചോദിക്കുന്നു. മലയാളത്തിൽ ഓരോ ഘടകത്തോടും ‘എവിടെ?’ ആവർത്തിക്കുന്നത് ഹീബ്രുവിലെ ആശ്രിത പട്ടികയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: പദത്തിന്റെ സാധാരണ മലയാള സമാനപദം. ഹീബ്രുവിൽ മൂന്നു പ്രാവശ്യം വരുന്ന ആവർത്തനം വാക്യത്തിന്റെ വാചാടോപബലം നിലനിർത്താൻ സംരക്ഷിച്ചു.
- source_word: חֲמָת
  choice: ഹമാത്ത്
  rationale: സ്ഥലനാമം ഹീബ്രു വ്യഞ്ജനരൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: אַרְפָּד
  choice: അർപ്പാദ്
  rationale: സ്ഥലനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തായി മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: לָעִיר
  choice: പട്ടണത്തിലെ
  rationale: לָעִיר എന്നത് ‘പട്ടണത്തിന്റെ/പട്ടണത്തിലെ’ എന്ന ബന്ധം സൂചിപ്പിക്കുന്നതായി എടുത്തു; തുടർന്നുള്ള സ്ഥലനാമങ്ങളെയും ഒരേ രാജാവിന്റെ അധികാരപരിധിയിലുള്ള പട്ടികയായി വായിക്കാവുന്ന ഘടന നിലനിർത്തി.
- source_word: סְפַרְוָיִם
  choice: സെഫർവയീം
  rationale: സ്ഥലനാമം ഉറവിടരൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: הֵנַע
  choice: ഹേന
  rationale: സ്ഥലനാമം മസോററ്റിക് സ്വരീകരണത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: וְעִוָּה
  choice: ഇവ്വ
  rationale: സ്ഥലനാമം മലയാളത്തിൽ സ്വാഭാവികമായ ഇരട്ട വ്യഞ്ജനത്തോടെ ലിപ്യന്തരിച്ചു; മുൻപുള്ള ‘രാജാവ്’ എന്നതിന്റെ പരിധിയിൽ തുടരുന്ന പട്ടികയായി ബന്ധിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഹീബ്രുവിലെ രാജാവ് എന്ന പദത്തിന്റെ ത്രിവട്ട ആവർത്തനം സംരക്ഷിച്ചു; എന്നാൽ അവസാനത്തെ മൂന്ന് സ്ഥലനാമങ്ങളുടെ വ്യാകരണബന്ധത്തിലെ യഥാർത്ഥ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
