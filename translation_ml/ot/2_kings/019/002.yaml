id: 2KI.19.2
reference: 2 Kings 19:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/שֶׁבְנָ֣א הַ/סֹּפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּֽהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ הַ/נָּבִ֖יא בֶּן אָמֽוֹץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/002.yaml
  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
translation:
  language: ml
  text: അവൻ കൊട്ടാരത്തിന്റെ മേൽവിചാരകനായ[a] എല്യാക്കീമിനെയും, ലേഖകനായ ശെബ്നയെയും, പുരോഹിതന്മാരിലെ മൂപ്പന്മാരെയും—രട്ടുടുത്തവരായി[b]—ആമോസിന്റെ മകനായ യെശയ്യാ പ്രവാചകന്റെ അടുക്കൽ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ ‘ഭവനത്തിന്മേലുള്ളവൻ’; രാജകൊട്ടാരത്തിന്റെയോ രാജകുടുംബകാര്യങ്ങളുടെയോ ചുമതലയുള്ള ഉന്നത ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന ഔദ്യോഗിക പദവിയാണിത്.
    reason: cultural_note
  - marker: b
    text: ‘രട്ടുകൊണ്ട് തങ്ങളെത്തന്നെ മൂടിക്കൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ കൃദന്തം മൂടുന്ന പ്രവൃത്തിക്കോ അതിന്റെ ഫലമായ വസ്ത്രധാരണനിലയ്ക്കോ ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അവൻ ... അയച്ചു
  rationale: വാവ്-തുടർച്ചാക്രിയ കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. മലയാളത്തിൽ മുൻസന്ദർഭത്തോടുള്ള ബന്ധം സ്വാഭാവികമായ വാക്യക്രമത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ നിർബന്ധമായി ‘പിന്നെ’ ചേർത്തിട്ടില്ല.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: കൊട്ടാരത്തിന്റെ മേൽവിചാരകനായ
  rationale: പദശഃ ‘ഭവനത്തിന്മേലുള്ളവൻ’ എന്നതായിരുന്നാലും, ഇവിടെ രാജഭവനത്തിന്റെ ചുമതലയുള്ള ഉന്നത ഉദ്യോഗസ്ഥനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മേൽവിചാരകൻ’ ഔദ്യോഗിക ചുമതല നിലനിർത്തുന്നു.
- source_word: הַסֹּפֵר
  choice: ലേഖകനായ
  rationale: സֹפֵר എന്ന പദത്തിന് എഴുത്തുകാരൻ, ലേഖകൻ, രാജകാര്യദർശി തുടങ്ങിയ അർഥവ്യാപ്തിയുണ്ട്. ‘ലേഖകൻ’ പദത്തിന്റെ നേരിട്ടുള്ള അർഥം സൂക്ഷിക്കുകയും പദവിയെ അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: പുരോഹിതന്മാരിലെ മൂപ്പന്മാർ
  rationale: പുരോഹിതസമൂഹത്തിലെ മൂപ്പന്മാർ എന്ന ഘടന സംരക്ഷിക്കുന്നു; ‘പ്രമുഖ പുരോഹിതന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി രണ്ടു ആശയങ്ങളെയും ഒന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: രട്ടുടുത്തവരായി
  rationale: ഹിത്പഅേൽ വർത്തമാനകൃദന്തം അവർ രട്ടുകൊണ്ട് തങ്ങളെത്തന്നെ മൂടുന്ന പ്രവൃത്തിയെയോ അങ്ങനെ വസ്ത്രം ധരിച്ച നിലയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം സ്വാഭാവികമായി ആ നിലയെ അവതരിപ്പിക്കുന്നു; പകരമുള്ള സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: യെശയ്യാ പ്രവാചകൻ
  rationale: പേരിനോടു ചേർന്ന സ്ഥാനവിശേഷണം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בֶּן אָמוֹץ
  choice: ആമോസിന്റെ മകനായ
  rationale: വംശപരമായ തിരിച്ചറിയൽ സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായനാസൗകര്യമുള്ളതുമായ മലയാളം ഉപയോഗിച്ചു. ‘രട്ട്’ ദുഃഖത്തിന്റെയും താഴ്മയുടെയും ബൈബിൾകാല വസ്ത്രചിഹ്നം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. ബഹുവചന കൃദന്തം അയക്കപ്പെട്ട എല്ലാവരെയും സംബന്ധിക്കുന്നുവെന്ന് വ്യക്തമാക്കാൻ ഇടവരകൾ ഉപയോഗിച്ച് വാക്യഘടന ക്രമപ്പെടുത്തി.
