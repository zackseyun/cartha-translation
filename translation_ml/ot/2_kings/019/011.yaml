revisions:
- from: ഇതാ, അശ്ശൂർരാജാക്കന്മാർ സകല ദേശങ്ങളെയും സമൂലം നശിപ്പിച്ചുകൊണ്ട് അവയോട് ചെയ്തതെന്തെന്ന് നീ കേട്ടിട്ടുണ്ടല്ലോ; എന്നിട്ട് നീ രക്ഷപ്പെടുമെന്നോ?[a]
  to: ഇതാ, അശ്ശൂർരാജാക്കന്മാർ സകല ദേശങ്ങളെയും നാശത്തിനായി സമർപ്പിച്ച് എങ്ങനെ നശിപ്പിച്ചെന്നു നീ കേട്ടിട്ടുണ്ടല്ലോ; നീയോ രക്ഷപ്പെടുമെന്നോ?[a]
  rationale: The revision restores a clear syntactic connection between the Assyrian kings’ action and the lands, retains the plural political-geographical referent, and renders החרים with its ‘devotion to destruction’ nuance. “നീയോ” explicitly reflects the Hebrew contrastive pronoun and sustains the taunting rhetorical question.
