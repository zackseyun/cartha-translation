  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֵת֩ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַֽחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
translation:
  language: ml
  text: ഇതാ, അശ്ശൂർരാജാക്കന്മാർ സകല ദേശങ്ങളെയും നാശത്തിനായി സമർപ്പിച്ച് എങ്ങനെ നശിപ്പിച്ചെന്നു നീ കേട്ടിട്ടുണ്ടല്ലോ; നീയോ രക്ഷപ്പെടുമെന്നോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സകല ദേശങ്ങളെയും സമൂലം നശിപ്പിച്ച്.” ഹീബ്രായത്തിൽ നാശത്തിനായി സമർപ്പിക്കുക, അഥവാ നിരോധനത്തിന് കീഴിലാക്കുക, എന്ന ആശയമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള പരിഹാസചോദ്യത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: שָׁמַעְתָּ
  choice: നീ കേട്ടിട്ടുണ്ടല്ലോ
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തെയും മുമ്പ് കേട്ട വിവരം ഇപ്പോൾ പ്രസക്തമാണെന്ന ആശയത്തെയും പ്രകടമാക്കുന്നു; ‘അല്ലോ’ സന്ദർഭത്തിലെ ഊന്നലും പങ്കുവെച്ച അറിവും സൂചിപ്പിക്കുന്നു.
- source_word: אֵת אֲשֶׁר עָשׂוּ
  choice: ചെയ്തതെന്തെന്ന്
  rationale: കർമസൂചകത്തോടുകൂടിയ ബന്ധവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מַלְכֵי אַשּׁוּר
  choice: അശ്ശൂർരാജാക്കന്മാർ
  rationale: ഹീബ്രായ സംയുക്തഘടനയുടെ വ്യക്തവും പതിവുമായ മലയാളരൂപം.
- source_word: לְכָל הָאֲרָצוֹת
  choice: സകല ദേശങ്ങളെയും ... അവയോട്
  rationale: אָרֶץ എന്ന പദത്തിന്റെ ഇവിടെ ഉദ്ദേശിക്കുന്ന രാഷ്ട്രീയ-ഭൗമിക പ്രദേശങ്ങൾ എന്ന ബഹുവചനാർഥം നിലനിർത്തുന്നു; മലയാള വാക്യഘടനയ്ക്കായി കർമവും ബന്ധവും വ്യക്തമായി രേഖപ്പെടുത്തുന്നു.
- source_word: לְהַחֲרִימָם
  choice: സമൂലം നശിപ്പിച്ചുകൊണ്ട്
  rationale: חרם എന്നതിന്റെ യുദ്ധസന്ദർഭത്തിലെ പൂർണനാശാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; അതിന്റെ പ്രത്യേക സമർപ്പണ/നിരോധന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְאַתָּה תִּנָּצֵל
  choice: എന്നിട്ട് നീ രക്ഷപ്പെടുമെന്നോ?
  rationale: സ്വതന്ത്ര സർവനാമം സൃഷ്ടിക്കുന്ന ‘നീയോ?’ എന്ന വൈരുധ്യവും പരിഹാസഭരിതമായ വാചാടോപചോദ്യവും സംരക്ഷിക്കുന്നു; നിഫാൽ രൂപത്തിന്റെ രക്ഷിക്കപ്പെടുക/രക്ഷപ്പെടുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സൈനിക ന്യായവിധിസന്ദർഭത്തിലെ חרם ഭാഷയുടെ പരിഭാഷ
  choice: പ്രധാനവാക്യത്തിൽ ‘സമൂലം നശിപ്പിച്ചുകൊണ്ട്’, അടിക്കുറിപ്പിൽ ‘നാശത്തിനായി മാറ്റിവെക്കുക’ എന്ന പ്രത്യേക ആശയം
  alternative: ‘നാശത്തിനായി മാറ്റിവെച്ചുകൊണ്ട്’ അല്ലെങ്കിൽ ‘നിരോധനത്തിന് കീഴിലാക്കിക്കൊണ്ട്’
  rationale: ഹീബ്രായപദം സാധാരണ നശിപ്പിക്കൽ മാത്രമല്ല, നാശത്തിനായി പൂർണമായി മാറ്റിവെക്കുന്ന ആശയവും വഹിക്കുന്നു. പ്രധാനവാക്യം സുതാര്യമായിരിക്കാനും പ്രത്യേക മത-ന്യായവിധി സൂക്ഷ്മത നഷ്ടപ്പെടാതിരിക്കാനും അതിനെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. അസ്സീറിയൻ ദൂതന്റെ ഭീഷണിയും പരിഹാസചോദ്യത്തിന്റെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
