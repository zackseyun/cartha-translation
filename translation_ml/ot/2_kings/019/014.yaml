  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
translation:
  language: ml
  text: പിന്നെ ഹിസ്കീയാവ് സന്ദേശവാഹകരുടെ കൈയിൽനിന്ന്[b] കത്തുകൾ[a] വാങ്ങി അവ വായിച്ചു. തുടർന്ന് അവൻ യഹ്‌വേയുടെ ആലയത്തിലേക്കു കയറിച്ചെന്ന്, ആ എഴുത്ത്[c] യഹ്‌വേയുടെ സന്നിധിയിൽ വിരിച്ചുവെച്ചു.
  philosophy: optimal-equivalence
