  rationale: עלה എന്ന ക്രിയയിലെ ‘മുകളിലേക്കു പോകുക’ എന്ന ഭാവം ‘കയറിച്ചെന്ന്’ നിലനിർത്തുന്നു; בית എന്നത് അക്ഷരാർഥത്തിൽ ‘ഭവനം’ ആണെങ്കിലും ഈ ചരിത്രസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം ‘ആലയം’ ആണ്.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: ആ എഴുത്ത് നിവർത്തിവെച്ചു
  rationale: פרשׂ എഴുതിയ വസ്തു തുറന്നോ വിരിച്ചോ മുമ്പിൽ വെക്കുന്ന ശാരീരിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ഏകവചന പ്രത്യയം മുൻപുള്ള ബഹുവചന എഴുത്തുകളെ ഒരു സംയുക്ത സന്ദേശമായി കാണുന്നതാകാം; ഈ വ്യത്യാസം വിവർത്തനത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: ദൈവസാന്നിധ്യത്തിൽ ഒരു കാര്യം വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ സ്ഥാനനാമമല്ല, ചതുർവ്യഞ്ജന ദൈവനാമം തന്നെയാണ് ഉള്ളത്. അതിനെ ഒരു പദവികൊണ്ട് പകരാതെ, സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് ചേർന്ന മലയാളരൂപത്തിൽ നൽകുന്നു.
- issue: എഴുത്ത് യഹ്‌വേയുടെ സന്നിധിയിൽ വെച്ച പ്രവൃത്തിയുടെ അർഥം
  choice: ശാരീരിക പ്രവൃത്തി മാത്രം മുഖ്യപാഠത്തിൽ പ്രസ്താവിക്കുന്നു
  alternative: പ്രാർഥനയായി യഹ്‌വേയുടെ മുമ്പിൽ സമർപ്പിച്ചു
  rationale: തുടർന്നുള്ള സന്ദർഭം ഇത് പ്രാർഥനയുമായി ബന്ധപ്പെട്ട പ്രവൃത്തിയാണെന്ന് കാണിച്ചാലും, ഈ വാക്യത്തിലെ ക്രിയ നേരിട്ട് എഴുത്ത് നിവർത്തിവെച്ചതിനെ മാത്രമാണ് പറയുന്നത്; വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിന്റെ ദൃശ്യസ്വഭാവം ‘കൈയിൽനിന്ന്,’ ‘കയറിച്ചെന്ന്,’ ‘നിവർത്തിവെച്ചു’ എന്നീ പ്രയോഗങ്ങളിൽ നിലനിർത്തിയിട്ടുണ്ട്; എന്നാൽ സ്വാഭാവികതയ്ക്കായി בית יהוה എന്നത് ‘യഹ്‌വേയുടെ ആലയം’ എന്നു നൽകിയിരിക്കുന്നു.
