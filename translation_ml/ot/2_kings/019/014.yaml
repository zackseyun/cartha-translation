- source_word: מִיַּד הַמַּלְאָכִים
  choice: സന്ദേശവാഹകരുടെ കൈയിൽനിന്ന്
  rationale: ‘കൈയിൽനിന്ന്’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു; מַלְאָכִים ഇവിടെ സ്വർഗീയ ദൂതന്മാരെയല്ല, മനുഷ്യ സന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּקְרָאֵם
  choice: അവ വായിച്ചു
  rationale: ക്രിയയോടു ചേർന്ന സർവനാമപ്രത്യയം ബഹുവചനമാണ്; മുൻപുള്ള ‘കത്തുകൾ’ എന്നതുമായി ഇത് പൊരുത്തപ്പെടുന്നു.
- source_word: וַיַּעַל בֵּית יְהוָה
