source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת כָּל דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
translation:
  language: ml
  text: ഒരുപക്ഷേ നിന്റെ ദൈവമായ യഹ്‌വേ, തന്റെ യജമാനനായ അശ്ശൂർരാജാവ് ജീവനുള്ള ദൈവത്തെ നിന്ദിക്കാൻ അയച്ച റബ്-ശാക്കേയുടെ[a] വാക്കുകളെല്ലാം കേൾക്കുകയും, നിന്റെ ദൈവമായ യഹ്‌വേ കേട്ട ആ വാക്കുകളെക്കുറിച്ച് ശാസിക്കുകയും[b] ചെയ്യും. അതുകൊണ്ട്, ഇപ്പോഴും ശേഷിച്ചിരിക്കുന്ന ജനശേഷിപ്പിനുവേണ്ടി പ്രാർത്ഥന ഉയർത്തുക.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “റബ്-ശാക്കേ” ഒരുപക്ഷേ ഒരു അസ്സീറിയൻ ഔദ്യോഗിക പദവിയാണ്; “മുഖ്യ പാനപാത്രവാഹകൻ” എന്നും ഇതിനെ വ്യാഖ്യാനിക്കാറുണ്ട്.
    reason: cultural_note
  - marker: b
    text: “ശാസിക്കുകയും” എന്നതിന് “ശാസിക്കുക,” “കുറ്റം ചുമത്തുക,” അല്ലെങ്കിൽ “തിരുത്തുക” എന്നും അർഥമാകാം. എബ്രായത്തിൽ ശാസനയുടെ ലക്ഷ്യം വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ “പ്രാർത്ഥന ഉയർത്തുക”; അതായത്, “പ്രാർത്ഥിക്കുക” അല്ലെങ്കിൽ “പ്രാർത്ഥന അർപ്പിക്കുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: ഒരുപക്ഷേ ... കേൾക്കുകയും ... ചെയ്യും
  rationale: പ്രതീക്ഷയോടുകൂടിയ സാധ്യതയാണ് ഈ ഘടന സൂചിപ്പിക്കുന്നത്; ഉറപ്പായി സംഭവിക്കുമെന്ന അർഥം നൽകാതെ സ്വാഭാവികമായ മലയാളത്തിൽ അത് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: רַב שָׁקֵה
  choice: റബ്-ശാക്കേ
  rationale: ഇത് ഒരു അസ്സീറിയൻ ഔദ്യോഗിക പദവിയാണെന്ന സാധ്യതയുള്ളതിനാൽ വിവാദമായ പദവിയർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതെ ലിപ്യന്തരം ചെയ്തു.
- source_word: לְחָרֵף
  choice: നിന്ദിക്കാൻ
  rationale: ജീവനുള്ള ദൈവത്തിനെതിരായ അവഹേളനവും വെല്ലുവിളിയും ഉൾക്കൊള്ളുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദം.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: ആ വാക്കുകൾ നിമിത്തം അവനെ ശാസിക്കുകയും
  rationale: הוכיח എന്ന ക്രിയയുടെ ശാസിക്കുക/കുറ്റപ്പെടുത്തുക എന്ന ആശയവും בְּ എന്നതിന്റെ കാരണസൂചനയും നൽകുന്നു; സന്ദർഭത്തിൽ ശാസനയുടെ ലക്ഷ്യം പ്രസംഗകനാണെന്ന് വ്യക്തമാക്കാൻ ‘അവനെ’ ചേർത്തു.
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: പ്രാർഥന ഉയർത്തുക
  rationale: ‘പ്രാർഥന ഉയർത്തുക’ എന്ന എബ്രായ രൂപകം മലയാളത്തിലും ഗ്രാഹ്യമായതിനാൽ നിലനിർത്തുന്നു.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: ശേഷിച്ചിരിക്കുന്ന ശേഷിപ്പ്
  rationale: ശേഷിപ്പിന്റെ ആശയം ആവർത്തനസഹിതം സംരക്ഷിക്കുകയും തിരുവെഴുത്തിലെ പ്രധാന പദത്തിന്റെ അനുരണനം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരം ചെയ്തു.
- issue: הַשְּׁאֵרִית എന്ന പദത്തിന്റെ അർഥം
  choice: ശേഷിപ്പ്
  alternative: രക്ഷപ്പെട്ടവർ; ശേഷിച്ചവർ
  rationale: ഇവിടെ അവശേഷിച്ച ജനത്തെ സൂചിപ്പിക്കുമ്പോഴും പദത്തിന്റെ വിശാലമായ തിരുവെഴുത്തുപരമായ അനുരണനം നഷ്ടമാകാതിരിക്കാൻ ‘ശേഷിപ്പ്’ സ്വീകരിച്ചു.
- issue: וְהוֹכִיחַ എന്നതിന്റെ പരോക്ഷ കർമം
  choice: അവനെ ശാസിക്കുകയും
  alternative: ആ വാക്കുകളെ ശാസിക്കുകയും; ആ വാക്കുകൾ നിമിത്തം വിധി നടത്തുകയും
  rationale: എബ്രായത്തിൽ കർമം തുറന്നുപറയുന്നില്ല. സന്ദർഭത്തിൽ റബ്-ശാക്കേയെയോ അവനെ അയച്ച അധികാരത്തെയോ ശാസിക്കുന്നതാണ് സ്വാഭാവിക ഗ്രഹണം; ‘അവനെ’ ചേർക്കുന്നത് മലയാളവാക്യം വ്യക്തമാക്കുന്നു, എന്നാൽ അടിക്കുറിപ്പ് വ്യാകരണപരമായ തുറന്ന നില സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരം ചെയ്തു; ഔദ്യോഗിക പദവിയായിരിക്കാവുന്ന ‘റബ്-ശാക്കേ’യും ലിപ്യന്തരം ചെയ്ത് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. എബ്രായത്തിലെ സാധ്യതാസൂചനയും הוכיח എന്ന ക്രിയയിലെ കർമസംബന്ധമായ തുറന്ന നിലയും പരമാവധി സംരക്ഷിച്ചു.
