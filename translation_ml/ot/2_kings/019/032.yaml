id: 2KI.19.32
reference: 2 Kings 19:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עָלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
translation:
  language: ml
  text: 'അതുകൊണ്ട് അശ്ശൂർരാജാവിനെക്കുറിച്ച് യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: “അവൻ ഈ നഗരത്തിൽ പ്രവേശിക്കുകയില്ല; ഇവിടെ ഒരു അമ്പുപോലും എയ്യുകയില്ല; പരിചയുമായി ഇതിനെ സമീപിക്കുകയില്ല[a]; ഇതിനെതിരെ ഉപരോധമേട് പണിയുകയുമില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പരിചയുടെ മറവിൽ ഇതിനെതിരെ മുന്നേറുകയില്ല.” ഉപരോധയുദ്ധത്തിൽ പരിചയുടെ സംരക്ഷണത്തിൽ നഗരത്തെ സമീപിക്കുന്നതായിരിക്കാം ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ഇതിനെതിരെ ഉപരോധത്തിനുള്ള മൺചരിവ് ഉയർത്തുകയില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ദൈവിക അരുളപ്പാടിൽനിന്ന് ഈ പ്രഖ്യാപനം നിഗമനമായി വരുന്നതാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകസന്ദേശത്തിന്റെ പതിവ് ദൂതസൂത്രം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ഹീബ്രു ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവിനെക്കുറിച്ച്
  rationale: ഇവിടെ אֶל രാജാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയെക്കാൾ അവനെ സംബന്ധിച്ച അരുളപ്പാടിന്റെ വിഷയം അവതരിപ്പിക്കുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു.
- source_word: לֹא יָבֹא אֶל הָעִיר הַזֹּאת
  choice: അവൻ ഈ നഗരത്തിൽ പ്രവേശിക്കുകയില്ല
  rationale: നഗരത്തിനകത്തേക്കുള്ള ചലനത്തെ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יוֹרֶה שָׁם חֵץ
  choice: ഇവിടെ ഒരു അമ്പുപോലും എയ്യുകയില്ല
  rationale: ירה എന്ന ക്രിയയുടെ സൈനിക അർഥം ‘എയ്യുക’ എന്നു നൽകുന്നു; ‘പോലും’ നിഷേധത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְקַדְּמֶנָּה מָגֵן
  choice: പരിചയുമായി ഇതിനെ സമീപിക്കുകയില്ല
  rationale: קדמ എന്നതിലെ മുമ്പോട്ടുവന്ന് നേരിടുക/സമീപിക്കുക എന്ന ആശയം നിലനിർത്തുന്നു; ഉപരോധത്തിൽ പരിചയുടെ മറവിൽ മുന്നേറുന്നതെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה
  choice: ഇതിനെതിരെ ഉപരോധമേട് പണിയുകയുമില്ല
  rationale: ‘ഒഴിക്കുക’ എന്ന പദാനുപദ രൂപത്തിനു പകരം സൈനികസന്ദർഭത്തിൽ മണ്ണ് കൂട്ടി ഉപരോധനിർമാണം നടത്തുന്നതെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: סֹלְלָה
  choice: ഉപരോധമേട്
  rationale: നഗരമതിലിനെതിരെ ഉയർത്തുന്ന മൺനിർമാണത്തെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു; ‘മൺചരിവ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രത്യേക നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: അശ്ശൂർരാജാവിനോടോ അവനെക്കുറിച്ചോ എന്ന אֶל-ന്റെ ബന്ധം
  choice: അശ്ശൂർരാജാവിനെക്കുറിച്ച്
  alternative: അശ്ശൂർരാജാവിനോട്
  rationale: തുടർന്നുള്ള വാക്കുകൾ രാജാവിനെ മൂന്നാംപുരുഷനായി പരാമർശിക്കുന്നതിനാൽ അവനെ സംബന്ധിച്ചുള്ള പ്രഖ്യാപനം എന്ന വായന സന്ദർഭത്തിന് യോജിക്കുന്നു; വ്യാകരണപരമായ മറ്റൊരു സാധ്യത നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ പ്രവാചകശൈലി. സൈനിക സാങ്കേതികപദങ്ങൾ അമിതമായി ഉപയോഗിക്കാതെ ഉപരോധസന്ദർഭം വ്യക്തമാക്കിയിരിക്കുന്നു; ഹീബ്രുവിലെ യഥാർഥ വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
