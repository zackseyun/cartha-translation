  text: אֲנִ֣י קַ֔רְתִּי וְ/שָׁתִ֖יתִי מַ֣יִם זָרִ֑ים וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
translation:
  language: ml
  text: “ഞാൻ കുഴിച്ച് വിദേശജലം കുടിച്ചു; എന്റെ പാദതലങ്ങൾകൊണ്ട് ഈജിപ്തിലെ സകല നീർച്ചാലുകളും[a] ഞാൻ വറ്റിക്കുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈജിപ്തിലെ സകല കനാലുകളും/നൈൽ ജലച്ചാലുകളും.” എബ്രായപദം പ്രത്യേകിച്ച് നൈലുമായി ബന്ധപ്പെട്ട ജലമാർഗങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: ഞാൻതന്നെ
  rationale: ക്രിയയിൽ ഉൾപ്പെട്ടിരിക്കുന്ന കർത്താവിനു പുറമേ പ്രത്യക്ഷമായി വന്നിരിക്കുന്ന സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തി രാജാവിന്റെ ആത്മപ്രശംസ പ്രകടമാക്കുന്നു.
- source_word: קַרְתִּי
  choice: കുഴിച്ചെടുത്ത്
  rationale: ജലസ്രോതസ്സുകൾ കുഴിച്ചുണ്ടാക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘കിണർ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: מַיִם זָרִים
  choice: പരദേശങ്ങളിലെ വെള്ളം
  rationale: זָרִים എന്നതിന്റെ ‘അന്യമായ/പരദേശീയമായ’ അർഥവും വിദേശദേശങ്ങൾ കീഴടക്കിയെന്ന വീമ്പിന്റെ സന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְאַחְרִב
  choice: ഞാൻ വറ്റിച്ചുകളയും
  rationale: ജലമാർഗങ്ങളാണ് കർമം എന്നതിനാൽ חרב എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘വറ്റിക്കുക’ എന്ന അർഥം ഏറ്റവും യോജിക്കുന്നു. അപൂർണക്രിയാരൂപത്തിന്റെ ഭാവിദിശയും ഭീഷണിസ്വരവും നിലനിർത്തുന്നു.
- source_word: בְּכַף פְּעָמַי
  choice: എന്റെ പാദതലങ്ങൾകൊണ്ട്
  rationale: כַּף എന്നത് പാദത്തോടൊപ്പം വരുമ്പോൾ പാദത്തിന്റെ അടിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; അനായാസമായ ആധിപത്യത്തിന്റെ ദൃശ്യരൂപം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יְאֹרֵי
  choice: നീർച്ചാലുകൾ
  rationale: יְאֹר എന്ന പദത്തിന് നദി, കനാൽ, പ്രത്യേകിച്ച് നൈൽ ജലമാർഗം എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. ‘നീർച്ചാലുകൾ’ വായനാസൗകര്യത്തോടെ ഈ അർഥവ്യാപ്തി ഭാഗികമായി നിലനിർത്തുന്നു; പ്രത്യേക നൈൽസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מָצוֹר
  choice: ഈജിപ്ത്
  rationale: יְאֹרֵי എന്നതോടുള്ള ഈ സംയോജനത്തിൽ מָצוֹר ഈജിപ്തിന്റെ കാവ്യനാമമായി മനസ്സിലാക്കുന്നതാണ് സന്ദർഭോചിതം; ഭൂമിശാസ്ത്രപരമായ സൂചന വായനക്കാരന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഒന്നാംപുരുഷ പ്രസംഗത്തിന്റെ സൂചിതവ്യക്തിയും വാചാടോപശക്തിയും
  choice: രാജകീയമായ അഹങ്കാരവീമ്പായി, വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ വിവർത്തനം ചെയ്തു.
  alternative: ഇത് അശ്ശൂർരാജാവിന്റെ വാക്കുകളാണെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുകയോ വെറും സൈനിക അതിശയോക്തിയായി വ്യാഖ്യാനിക്കുകയോ ചെയ്യുക.
  rationale: സന്ദർഭം പ്രസംഗകനെ തിരിച്ചറിയുന്നുവെങ്കിലും വാക്യം തന്നെയുള്ള ഒന്നാംപുരുഷ വീമ്പും ശക്തമായ ദൃശ്യഭാഷയും വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ നിലനിർത്തുന്നതാണ് ഉചിതം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പാദതലങ്ങൾ’ എന്ന ദൃശ്യപദം മൂലത്തിലെ ശക്തമായ രൂപകം നിലനിർത്തുന്നു; ‘കിണർ’ പോലുള്ള വ്യക്തമല്ലാത്ത കർമം ചേർത്തിട്ടില്ല. അവസാന ക്രിയയെ ഭാവിദിശയുള്ള വീമ്പും ഭീഷണിയും പ്രകടമാക്കാൻ ‘വറ്റിച്ചുകളയും’ എന്നു പരിഭാഷപ്പെടുത്തി.
