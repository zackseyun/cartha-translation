id: 2KI.19.33
reference: 2 Kings 19:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר יָבֹ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָבֹ֖א נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/033.yaml
  text: By the way that he came[a], by it he will return, and he will not come to this city, declares Yahweh.
translation:
  language: ml
  text: അവൻ വന്ന അതേ വഴിയിലൂടെ മടങ്ങിപ്പോകും; ഈ നഗരത്തിലേക്കു വരികയില്ല—യഹ്‌വേയുടെ അരുളപ്പാട്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ
  choice: അവൻ വന്ന അതേ വഴിയിലൂടെ
  rationale: ദֶּרֶךְ എന്നത് ‘വഴി/പാത’ എന്നും, בָּהּ അതേ വഴിയെ തിരിച്ചും സൂചിപ്പിക്കുന്നു. ആവർത്തനം യാന്ത്രികമായി നിലനിർത്താതെ ‘അതേ വഴിയിലൂടെ’ എന്നു നൽകുന്നത് എബ്രായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יָשׁוּב
  choice: മടങ്ങിപ്പോകും
  rationale: ശׁוּב ഇവിടെ വന്ന വഴിയിലൂടെ തിരികെ പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘മടങ്ങിപ്പോകും’ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  choice: ഈ നഗരത്തിലേക്കു വരികയില്ല
  rationale: മൂലത്തിലെ ‘ഈ നഗരത്തിലേക്ക് അവൻ വരികയില്ല’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘പ്രവേശിക്കുകയില്ല’ എന്ന കൂടുതൽ ശക്തമായ ആശയം ചേർക്കുന്നില്ല.
- source_word: נְאֻם יְהוָה
  choice: യഹോവയുടെ അരുളപ്പാട്
  rationale: נְאֻם എന്ന പ്രവാചക പ്രഖ്യാപനസൂത്രത്തിന്റെ ഗൗരവവും ദൈവിക പ്രസ്താവന എന്ന സ്വഭാവവും ‘അരുളപ്പാട്’ സംക്ഷിപ്തമായി നൽകുന്നു; יְהוָה വ്യക്തിനാമമായി ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ ടെട്രാഗ്രാമറ്റൺ നേരിട്ട് വരുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേരാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ പതിവുള്ള ‘യഹോവ’ എന്ന രൂപം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രവാചകപ്രഖ്യാപന ശൈലി. ‘വന്ന അതേ വഴിയിലൂടെ’ എന്ന പ്രയോഗം മൂലത്തിലെ അനാഫോറയെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; അതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
