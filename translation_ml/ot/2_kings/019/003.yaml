  to: 'അവർ അദ്ദേഹത്തോടു പറഞ്ഞു: “ഹിസ്കീയാവ് ഇപ്രകാരം പറയുന്നു: ഇന്ന് കഷ്ടത്തിന്റെയും ശാസനയുടെയും നിന്ദയുടെയും ദിവസമാണ്. കുഞ്ഞുങ്ങൾ ജനിക്കേണ്ട നിർണായകഘട്ടത്തിലെത്തിയിരിക്കുന്നു[a]; എന്നാൽ പ്രസവിക്കാൻ ശക്തിയില്ല.”'
  rationale: Only the childbirth clause is revised, to make its syntax and metaphor natural in modern Malayalam. “ജനിക്കേണ്ട നിർണായകഘട്ടം” expresses the intended crisis point without treating the difficult term מַשְׁבֵּר as definitively either a physical birthstool or merely a time; that unresolved detail remains noted in the footnote.
