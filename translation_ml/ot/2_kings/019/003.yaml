source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
translation:
  language: ml
  text: 'അവർ അദ്ദേഹത്തോടു പറഞ്ഞു: “ഹിസ്കീയാവ് ഇപ്രകാരം പറയുന്നു: ഇന്ന് കഷ്ടത്തിന്റെയും ശാസനയുടെയും നിന്ദയുടെയും ദിവസമാണ്. കുഞ്ഞുങ്ങൾ ജനിക്കേണ്ട നിർണായകഘട്ടത്തിലെത്തിയിരിക്കുന്നു[a]; എന്നാൽ പ്രസവിക്കാൻ ശക്തിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപദമായ מַשְׁבֵּר പ്രസവത്തിന്റെ നിർണായക നിമിഷത്തെയോ പ്രസവസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം. മറ്റൊരു പരിഭാഷ: “കുഞ്ഞുങ്ങൾ പ്രസവസ്ഥാനത്തെത്തിയിരിക്കുന്നു.” പ്രസവം പൂർത്തിയാകേണ്ട ഘട്ടത്തിൽ ശക്തി ക്ഷയിച്ചുപോകുന്നതാണ് ഈ ദൃശ്യം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം പറയുന്നു
  rationale: രാജാവിന്റെ സന്ദേശം കൈമാറുന്ന പതിവ് ദൂതസൂത്രത്തിന്റെ ഗൗരവവും വർത്തമാനപ്രാബല്യവും നിലനിർത്തുന്നു.
- source_word: יוֹם צָרָה
  choice: കഷ്ടത്തിന്റെ ദിവസം
  rationale: സമ്മർദവും ദുരിതവും സൂചിപ്പിക്കുന്ന צָרָהയെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְתוֹכֵחָה
  choice: ശാസനം
  rationale: കുറ്റപ്പെടുത്തൽ, ശാസന, തിരുത്തൽ എന്നീ അർഥസാധ്യതകളുള്ള പദത്തിന് സന്ദർഭോചിതവും സംക്ഷിപ്തവുമായ തർജമ.
- source_word: וּנְאָצָה
  choice: നിന്ദ
  rationale: അവഹേളനം, ധിക്കാരം, അപമാനം എന്നീ അർഥവ്യാപ്തി തുറന്നുവെക്കുകയും ‘ദൈവദൂഷണം’ എന്ന കൂടുതൽ സങ്കുചിതമായ വ്യാഖ്യാനം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: എബ്രായത്തിലെ സൂചക ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: പ്രസവസമയംവരെ കുഞ്ഞുങ്ങൾ എത്തിയിരിക്കുന്നു
  rationale: പ്രസവം നിർണായക ഘട്ടത്തിലെത്തിയിട്ടും പൂർത്തിയാക്കാൻ കഴിയാത്ത പ്രതിസന്ധിയുടെ രൂപകം വ്യക്തമായി നിലനിർത്തുന്നു; മַשְׁבֵּר എന്ന ദുഷ്കരപദത്തിന്റെ കൃത്യമായ സ്ഥലം/നിമിഷം സംബന്ധിച്ച അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: എന്നാൽ പ്രസവിക്കാൻ ശക്തിയില്ല
  rationale: പ്രക്രിയ നിർണായക നിമിഷത്തിലെത്തിയിട്ടും പ്രസവം പൂർത്തിയാക്കാനുള്ള ശക്തി ഇല്ലെന്ന രൂപകത്തിന്റെ പരമാവധി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בָנִים
  choice: കുഞ്ഞുങ്ങൾ
  rationale: രൂപകത്തിൽ ഉദ്ദേശിക്കുന്നത് ആൺമക്കളെ പ്രത്യേകിച്ച് അല്ല, ജനിക്കാനിരിക്കുന്ന സന്താനങ്ങളെയാണ്; അതിനാൽ ലിംഗനിരപേക്ഷമായ സന്ദർഭാർഥം സ്വീകരിക്കുന്നു.
