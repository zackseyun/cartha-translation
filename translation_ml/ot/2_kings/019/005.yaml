source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ עַבְדֵ֛י הַ/מֶּ֥לֶךְ חִזְקִיָּ֖הוּ אֶל יְשַֽׁעַיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/005.yaml
  text: So the servants of King Hezekiah came to Isaiah.
translation:
  language: ml
  text: അങ്ങനെ ഹിസ്കീയാരാജാവിന്റെ ദാസന്മാർ യെശയ്യാവിന്റെ അടുക്കൽ വന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: അങ്ങനെ ... വന്നു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ‘അങ്ങനെ’ സ്വാഭാവികമായ കഥാപുരോഗതി നൽകുന്നു; ‘വന്നു’ בוא എന്ന ക്രിയയുടെ നേരായ അർഥമാണ്.
- source_word: עַבְדֵי
  choice: ദാസന്മാർ
  rationale: עבד എന്ന പദത്തിന്റെ ബഹുവചന നിർമാണരൂപം രാജാവിന്റെ ദാസന്മാരെയോ രാജസേവകരെയോ സൂചിപ്പിക്കാം. ‘ദാസന്മാർ’ മൂലപദത്തിന്റെ രൂപവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു; ‘ഉദ്യോഗസ്ഥർ’ എന്നു പറഞ്ഞാൽ കൂടുതൽ വ്യാഖ്യാനാത്മകമാകും.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: ഹിസ്കീയാരാജാവിന്റെ
  rationale: ഹിസ്കീയാവിന്റെ രാജപദവി സ്വാഭാവികമായ മലയാള സംയുക്തരൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל
  choice: അടുക്കൽ
  rationale: ഒരു വ്യക്തിയിലേക്കുള്ള ഗതിയും സമീപനവും സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘അടുക്കൽ’ സ്വാഭാവികമാണ്.
- source_word: יְשַׁעְיָהוּ
  choice: യെശയ്യാവ്
  rationale: പ്രവാചകന്റെ പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജസദസ്സിലെ പദവിയെ കൂടുതൽ വ്യാഖ്യാനിച്ച് ‘ഉദ്യോഗസ്ഥർ’ എന്നു മാറ്റാതെ മൂലത്തിലെ ‘ദാസന്മാർ’ നിലനിർത്തി.
