  text: וַ/יְהִי֩ ה֨וּא מִֽשְׁתַּחֲוֶ֜ה בֵּ֣ית נִסְרֹ֣ךְ אֱלֹהָ֗י/ו וְֽ/אַדְרַמֶּ֨לֶךְ וְ/שַׂרְאֶ֤צֶר הִכֻּ֣/הוּ בַ/חֶ֔רֶב וְ/הֵ֥מָּה נִמְלְט֖וּ אֶ֣רֶץ אֲרָרָ֑ט וַ/יִּמְלֹ֛ךְ אֵֽסַר חַדֹּ֥ן בְּנ֖/וֹ תַּחְתָּֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
translation:
  language: ml
  text: 'അങ്ങനെ സംഭവിച്ചു: അവൻ തന്റെ ദേവനായ നിസ്രോകിന്റെ[a] ആലയത്തിൽ ആരാധിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അദ്രമ്മേലെക്കും ശരേസെരും അവനെ വാൾകൊണ്ട് വെട്ടിവീഴ്ത്തി. അവർ അരാരാത്ത് ദേശത്തേക്ക് രക്ഷപ്പെട്ടു. അവന്റെ മകനായ ഏസർ-ഹദ്ദോൻ അവനു പകരം രാജാവായി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: “നിസ്രോക്”; പരമ്പരാഗതമായി “നിസ്രോക്ക്” എന്നും എഴുതാറുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ഒരിക്കൽ
  rationale: സംഭവം അവതരിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനപ്രയോഗം. അക്ഷരാർഥമായ ദീർഘരൂപം ഒഴിവാക്കി അതിന്റെ ആഖ്യാനധർമ്മം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִשְׁתַּחֲוֶה
  choice: ആരാധിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ദേവന്റെ ആലയമെന്ന ആരാധനാപരമായ സന്ദർഭത്തിൽ ഈ പദം വെറും കുമ്പിടലല്ല, ആരാധനയാണ് സൂചിപ്പിക്കുന്നത്; എബ്രായത്തിലെ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയും മലയാളരൂപം വ്യക്തമാക്കുന്നു.
- source_word: בֵּית
  choice: ആലയത്തിൽ
  rationale: അക്ഷരാർഥം ‘ഭവനം’ എന്നാണെങ്കിലും ഇവിടെ ദേവന്റെ ആരാധനാസ്ഥലമാണ് ഉദ്ദേശ്യം; ‘ആലയം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: נִסְרֹךְ
  choice: നിസ്രോക്
  rationale: എബ്രായരൂപത്തോട് ചേർന്ന ലിപ്യന്തരണം; പരിചിതമായ മറ്റൊരു ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֱלֹהָיו
  choice: തന്റെ ദേവനായ
  rationale: മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം സൻഹേരീബിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യാവർത്തകമായ ‘തന്റെ’ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: അവനെ വാൾകൊണ്ട് വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന പദത്തിന്റെ ‘അടിക്കുക/വീഴ്ത്തുക’ എന്ന ദൃശ്യഭാവവും വാൾ ഉപകരണമാണെന്നതും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മരണഫലം വ്യക്തമാണ്.
- source_word: נִמְלְטוּ
  choice: രക്ഷപ്പെട്ടു
  rationale: വധത്തിനുശേഷം വിജയകരമായി കടന്നുകളഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന നിഫാൽ രൂപത്തിന്റെ ഫലഭാവം നൽകുന്നു.
- source_word: אֶרֶץ אֲרָרָט
  choice: അരാരാത്ത് ദേശത്തേക്ക്
  rationale: ഭൂമിശാസ്ത്രപരമായ ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സംയുക്തപദത്തിന്റെ സുതാര്യമായ വിവർത്തനം.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജവാഴ്ചയിലെ പിൻഗാമിത്വസന്ദർഭത്തിൽ מלך എന്ന ക്രിയ ‘രാജാവായി’ എന്ന അർഥം നൽകുന്നു; തുടർന്നുള്ള ‘അവനു പകരം’ അതിനെ വ്യക്തമാക്കുന്നു.
- source_word: אֵסַר חַדֹּן
  choice: ഏസർ-ഹദ്ദോൻ
  rationale: എബ്രായത്തിലെ രണ്ടുഭാഗമുള്ള രാജനാമത്തിന്റെ വായനാസൗകര്യമുള്ള ലിപ്യന്തരണം.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: രാജവംശീയ പിൻഗാമിത്വം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
