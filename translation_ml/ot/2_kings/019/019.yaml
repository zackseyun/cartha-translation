source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֥/נוּ נָ֖א מִ/יָּד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּ֥י אַתָּ֛ה יְהוָ֥ה אֱלֹהִ֖ים לְ/בַדֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
translation:
  language: ml
  text: ഇപ്പോൾ, ഞങ്ങളുടെ ദൈവമായ യഹ്‌വേ, ദയവായി ഞങ്ങളെ അവന്റെ കൈയിൽനിന്ന് രക്ഷിക്കണമേ[a]. അങ്ങനെ ഭൂമിയിലെ സകല രാജ്യങ്ങളും[b] യഹ്‌വേയായ അങ്ങ് മാത്രമാണ് ദൈവമെന്ന് അറിയട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവന്റെ കൈയിൽനിന്ന്’; അവന്റെ അധികാരത്തിൽനിന്നോ പിടിയിൽനിന്നോ വിടുവിക്കുക എന്നർഥമുള്ള പ്രയോഗം.
    reason: cultural_note
  - marker: b
    text: ‘ദേശത്തിലെ സകല രാജ്യങ്ങളും’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ വിവിധ ജനതകളെ ഉൾക്കൊള്ളുന്ന സന്ദർഭമായതിനാൽ ‘ഭൂമിയിലെ’ എന്നാണ് നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: പ്രാർഥനയിലെ നിർണായക അപേക്ഷയിലേക്കു കടക്കുന്ന കാലസൂചക പ്രയോഗം. മലയാളത്തിൽ ‘ഇപ്പോൾ’ സ്വാഭാവികമായി ഈ മാറ്റം അറിയിക്കുന്നു; മുൻസന്ദർഭത്തോടുള്ള ബന്ധം വാക്യക്രമത്തിൽ നിലനിൽക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു.
- source_word: אֱלֹהֵינוּ
  choice: ഞങ്ങളുടെ ദൈവമായ
  rationale: ഒന്നാം പുരുഷ ബഹുവചന പ്രത്യയമുള്ള രൂപത്തിന്റെ അർഥം നിലനിർത്തുകയും ‘ഞങ്ങളുടെ ദൈവമായ യഹ്‌വേ’ എന്ന സ്വാഭാവിക മലയാള അഭിസംബോധന രൂപപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: הוֹשִׁיעֵנוּ נָא
  choice: ദയവായി ഞങ്ങളെ ... രക്ഷിക്കണമേ
  rationale: ഹിഫീൽ ആജ്ഞാരൂപത്തിന്റെ രക്ഷിക്കണമെന്ന അപേക്ഷയും נָא സൂചിപ്പിക്കുന്ന വിനീതമായ അടിയന്തര അഭ്യർഥനയും ചേർത്തു നൽകുന്നു.
- source_word: מִיָּדוֹ
  choice: അവന്റെ കൈയിൽനിന്ന്
  rationale: മറ്റൊരാളുടെ അധികാരത്തിൽനിന്നോ പിടിയിൽനിന്നോ വിടുവിക്കൽ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം വാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְיֵדְעוּ
  choice: അപ്പോൾ ... അറിയട്ടെ
  rationale: അപേക്ഷയുടെ ഉദ്ദേശ്യമോ പ്രതീക്ഷിക്കുന്ന ഫലമോ പ്രകടിപ്പിക്കുന്ന ക്രിയാഭാവം മലയാളത്തിലെ ആശംസാ/ഉദ്ദേശ്യ രൂപത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: ഭൂമിയിലെ സകല രാജ്യങ്ങളും
  rationale: അശ്ശൂരും വിവിധ ജനതകളും ഉൾപ്പെടുന്ന അന്തർദേശീയ സന്ദർഭത്തിൽ הָאָרֶץ എന്നത് ‘ഭൂമി’ എന്ന വിശാല അർഥത്തിൽ എടുത്തു.
- source_word: כִּי אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: യഹ്‌വേയായ അങ്ങ് മാത്രമാണ് ദൈവമെന്ന്
  rationale: അറിയേണ്ട ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന כִּי, യഹ്‌വേ എന്ന നാമം, ദൈവമാണെന്ന വിധേയപ്രസ്താവം, לְבַדֶּךָയുടെ ഏകത്വ ഊന്നൽ എന്നിവ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ ശബ്ദാന്തരം ചെയ്യുന്നു.
- issue: לְבַדֶּךָ നൽകുന്ന ഏകത്വ ഊന്നൽ
  choice: യഹ്‌വേയായ അങ്ങ് മാത്രമാണ് ദൈവം
  alternative: അങ്ങ് യഹ്‌വേ, ഏക ദൈവമാണ്
  rationale: യഹ്‌വേ മാത്രമാണ് ദൈവം എന്ന മൂലവാക്യത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു; ‘ഏക ദൈവം’ എന്നു മാറ്റി ആശയത്തെ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുന്നില്ല.
- issue: וְיֵדְעוּ എന്ന ക്രിയയുടെ ഉദ്ദേശ്യ/ഫല ഭാവം
  choice: അപ്പോൾ ... അറിയട്ടെ
  alternative: അങ്ങനെ ... അറിയും; ... അറിയേണ്ടതിന്
  rationale: രക്ഷയ്ക്കായുള്ള അപേക്ഷയുടെ ലക്ഷ്യം പ്രകടമാക്കുകയും അത് നിർബന്ധമായ പ്രവചനമായി മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും പ്രാർഥനാസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളം. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ‘കൈയിൽനിന്ന്’ എന്ന എബ്രായ രൂപകം പ്രധാനവാചകത്തിൽ സൂക്ഷിച്ച് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
