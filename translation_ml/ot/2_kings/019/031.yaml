source:
  edition: WLC
  text: כִּ֤י מִ/ירוּשָׁלִַ֨ם֙ תֵּצֵ֣א שְׁאֵרִ֔ית וּ/פְלֵיטָ֖ה מֵ/הַ֣ר צִיּ֑וֹן קִנְאַ֛ת יְהוָ֥ה תַּֽעֲשֶׂה זֹּֽאת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/031.yaml
  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
translation:
  language: ml
  text: എന്തെന്നാൽ, യെരൂശലേമിൽനിന്ന് ഒരു ശേഷിപ്പ് പുറപ്പെട്ടുവരും; സീയോൻ പർവതത്തിൽനിന്ന് രക്ഷപ്പെട്ടവരും പുറപ്പെട്ടുവരും. യഹ്‌വേയുടെ തീക്ഷ്ണത[a] ഇതു ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹ്‌വേയുടെ അസൂയ’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായ നാമത്തിന് ‘തീക്ഷ്ണത’ എന്നും ‘അസൂയ’ എന്നും അർഥമാകാം; ഇവിടെ യെരൂശലേമിന്റെ വിടുതൽ നടപ്പാക്കാനുള്ള യഹ്‌വേയുടെ തീവ്രമായ പ്രതിബദ്ധതയെയാണ് അതു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുമ്പുള്ള വാഗ്ദാനത്തിന് അടിസ്ഥാനമോ ഉറപ്പോ നൽകുന്ന കാരണസൂചകപ്രയോഗമായി ഇവിടെ പ്രവർത്തിക്കുന്നു.
- source_word: מִירוּשָׁלִַם
  choice: യെരൂശലേമിൽനിന്ന്
  rationale: מִן ഉത്ഭവസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: תֵּצֵא
  choice: പുറപ്പെട്ടുവരും
  rationale: יצא എന്ന ക്രിയയുടെ സഞ്ചാരദൃശ്യം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി ഭാവികാലം പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: שְׁאֵרִית
  choice: ഒരു ശേഷിപ്പ്
  rationale: ന്യായവിധിക്കോ പ്രതിസന്ധിക്കോ ശേഷം അവശേഷിക്കുന്ന സമൂഹം എന്ന പ്രവാചകപരമായ ആശയം ‘ശേഷിപ്പ്’ നിലനിർത്തുന്നു.
- source_word: וּפְלֵיטָה
  choice: രക്ഷപ്പെട്ടവരും
  rationale: അപകടത്തിൽനിന്ന് ഒഴിഞ്ഞുമാറി ജീവനോടെ ശേഷിച്ചവരെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്; സമാന്തരവാക്യത്തിൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: מֵהַר צִיּוֹן
  choice: സീയോൻ പർവതത്തിൽനിന്ന്
  rationale: ഉത്ഭവസ്ഥാനം സൂചിപ്പിക്കുന്ന ഘടനയും യെരൂശലേമുമായുള്ള സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: קִנְאַת
  choice: തീക്ഷ്ണത
  rationale: קִנְאָה എന്ന പദത്തിന്റെ ‘zeal’ എന്ന അർഥം, വിടുതൽ നടപ്പാക്കാനുള്ള യഹ്‌വേയുടെ ഉജ്ജ്വലവും അചഞ്ചലവുമായ പ്രതിബദ്ധതയായി ഇവിടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘അസൂയ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവിക നാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: ഇതു ചെയ്യും
  rationale: പ്രസ്താവിച്ച ഫലം യഹ്‌വേയുടെ തീക്ഷ്ണത നടപ്പാക്കും എന്ന നേരിട്ടുള്ള ഹീബ്രു പ്രയോഗം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവിക നാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: קִנְאַת יְהוָה എന്ന പ്രയോഗത്തിന്റെ അർഥനിറം
  choice: യഹ്‌വേയുടെ തീക്ഷ്ണത
  alternative: യഹ്‌വേയുടെ അസൂയ
  rationale: ഈ സന്ദർഭത്തിൽ യെരൂശലേമിന്റെ വിടുതൽ നടപ്പാക്കാനുള്ള ദൈവത്തിന്റെ തീവ്രമായ പ്രതിബദ്ധതയ്ക്കാണ് മുൻതൂക്കം; എന്നാൽ പദത്തിന്റെ ‘അസൂയ’ എന്ന യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ സമാന്തരഘടന വ്യക്തമാക്കാൻ രണ്ടാമത്തെ ഖണ്ഡത്തിൽ മലയാളത്തിൽ ആവശ്യമായ ‘വരും’ ചേർത്തു; ഇതിലൂടെ പുതിയ അർഥം ചേർക്കാതെ ആദ്യ ക്രിയയുടെ ആശയം പൂരിപ്പിക്കുന്നു. ‘ശേഷിപ്പ്’ എന്ന പ്രവാചക-ദൈവശാസ്ത്രപരമായ പദം നിലനിർത്തി.
