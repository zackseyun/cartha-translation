  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
translation:
  language: ml
  text: 'അവനെക്കുറിച്ച് യഹ്‌വെ അരുളിച്ചെയ്ത വചനം ഇതാണ്:

    “കന്യകയായ സീയോൻപുത്രി നിന്നെ അവജ്ഞയോടെ കാണുന്നു;

    അവൾ നിന്നെ പരിഹസിക്കുന്നു.

    യെരൂശലേംപുത്രി നിന്റെ പിന്നാലെ തല കുലുക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തല കുലുക്കുന്നു” എന്നത് ഇവിടെ അവജ്ഞയും പരിഹാസവും പ്രകടിപ്പിക്കുന്ന ഒരു ആംഗ്യമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: വചനം
  rationale: പ്രവാചക അരുളപ്പാടിനെ പരിചയപ്പെടുത്തുന്ന ഈ പ്രയോഗത്തിൽ ‘വചനം’ ദൈവിക ഉച്ചാരണത്തിന്റെ ഔപചാരിക ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: דִּבֶּר יְהוָה עָלָיו
  choice: അവനെക്കുറിച്ച് യഹ്‌വെ അരുളിച്ചെയ്ത
  rationale: עַל ഇവിടെ അരുളപ്പാടിന്റെ വിഷയമായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവനെക്കുറിച്ച്’ എന്നു നൽകി; സന്ദർഭം പ്രതികൂലമാണെങ്കിലും ‘അവനെതിരെ’ എന്ന അർഥം നിർബന്ധമായി ചേർത്തിട്ടില്ല. ദൈവിക സംസാരത്തിന് മാന്യവും സ്വാഭാവികവുമായ ‘അരുളിച്ചെയ്ത’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ പാഠത്തിലെ ദൈവനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മറയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בָּזָה
  choice: അവജ്ഞയോടെ കാണുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ contempt/despising സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘നിന്ദിക്കുന്നു’ എന്നത് വാക്കാലുള്ള അധിക്ഷേപം എന്ന ചുരുങ്ങിയ അർഥത്തിലേക്ക് നീങ്ങാമെന്നതിനാൽ ഒഴിവാക്കി.
- source_word: לָעֲגָה
  choice: പരിഹസിക്കുന്നു
  rationale: കളിയാക്കുകയും അപഹസിക്കുകയും ചെയ്യുക എന്ന ക്രിയയുടെ അർഥം വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: കന്യകയായ സീയോൻപുത്രി
  rationale: സീയോനെ സ്ത്രീയായി വ്യക്തിവൽക്കരിക്കുന്ന കാവ്യാത്മക ശീർഷകത്തിലെ ‘കന്യക’, ‘പുത്രി’ എന്നീ രണ്ടു ഘടകങ്ങളും നിലനിർത്തുന്നു.
- source_word: אַחֲרֶיךָ
  choice: നിന്റെ പിന്നാലെ
  rationale: ശത്രു മടങ്ങിപ്പോകുമ്പോൾ അവന്റെ പിന്നിൽ പരിഹാസപൂർവം തല കുലുക്കുന്ന ദൃശ്യത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: רֹאשׁ הֵנִיעָה
  choice: തല കുലുക്കുന്നു
  rationale: എബ്രായത്തിലെ ശരീരഭാഷ നേരിട്ട് നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അത് പരിഹാസത്തിന്റെയും അവജ്ഞയുടെയും ആംഗ്യമാണ്.
- source_word: בַּת יְרוּשָׁלִָם
  choice: യെരൂശലേംപുത്രി
  rationale: നഗരത്തെ സ്ത്രീയായി വ്യക്തിവൽക്കരിക്കുന്ന സമാന്തര കാവ്യപ്രയോഗം ചുരുക്കത്തോടെയും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ ലിപ്യന്തരണം വഴി നിലനിർത്തി; പ്രത്യേക സമുദായപരമായ പരമ്പരാഗത രൂപം നിർബന്ധിച്ചിട്ടില്ല.
- issue: സീയോന്റെ ‘കന്യക’ എന്ന വ്യക്തിവൽക്കരണം
  choice: കന്യകയായ സീയോൻപുത്രി
  alternative: സീയോൻപുത്രി / സുന്ദരിയായ സീയോൻകന്യക
  rationale: മൂലപാഠത്തിലുള്ള בְּתוּלָה എന്ന ഘടകം മയപ്പെടുത്താതെയും അതിന് ‘സുന്ദരി’ പോലുള്ള ഇല്ലാത്ത ഗുണം ചേർക്കാതെയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ കാവ്യഗദ്യം സ്വീകരിച്ചു. സമാന്തരഘടനയും സീയോൻ/യെരൂശലേം എന്നീ നഗരങ്ങളുടെ സ്ത്രീരൂപത്തിലുള്ള വ്യക്തിവൽക്കരണവും നിലനിർത്തി. എബ്രായത്തിലെ പൂർത്തീകരിച്ച ക്രിയാരൂപങ്ങൾ പരിഹാസവചനത്തിന്റെ സജീവത കാക്കാൻ സന്ദർഭോചിതമായ മലയാള വർത്തമാനകാലത്തിൽ നൽകി.
