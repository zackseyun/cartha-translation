  text: യൂദാഗൃഹത്തിലെ രക്ഷപ്പെട്ടു ശേഷിച്ച ശിഷ്ടം വീണ്ടും താഴേക്ക് വേരൂന്നുകയും മുകളിലേക്ക് ഫലം കായ്ക്കുകയും ചെയ്യും.[a]
