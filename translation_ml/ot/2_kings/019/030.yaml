    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָסְפָה
  choice: വീണ്ടും
  rationale: יסף എന്ന ക്രിയ ഇവിടെ തുടർന്നുള്ള പ്രവർത്തനത്തിന്റെ പുതുക്കലിനെ സൂചിപ്പിക്കുന്നു; ന്യായവിധിക്കുശേഷമുള്ള പുനഃസ്ഥാപനസന്ദർഭത്തിൽ ‘വീണ്ടും’ സ്വാഭാവികവും യോജിച്ചതുമാണ്.
- source_word: פְּלֵיטַת ... הַנִּשְׁאָרָה
  choice: ശേഷിച്ചിരിക്കുന്ന രക്ഷിതശിഷ്ടം
  rationale: פְּלֵיטָה രക്ഷപ്പെട്ട് ശേഷിച്ചവരെയും הַנִּשְׁאָרָה ശേഷിച്ചിരിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു. ‘രക്ഷിതശിഷ്ടം’ ശേഷിപ്പെന്ന ബൈബിൾ ആശയവും ദുരന്തത്തിൽനിന്നുള്ള രക്ഷപ്പെടലും ഒരുമിച്ച് നിലനിർത്തുന്നു; അനുബന്ധ വിശേഷണം ആവർത്തനത്തിന്റെ ഉറവിടരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: בֵּית יְהוּדָה
  choice: യൂദാഗൃഹത്തിൽ
  rationale: ‘യൂദാഗൃഹം’ എന്ന ഉടമ്പടി-ചരിത്രപരമായ പ്രയോഗം ചുരുക്കാതെ നിലനിർത്തുന്നു; മലയാളത്തിലെ ബന്ധസൂചന സന്ദർഭാനുസൃതമായി ‘-ത്തിൽ’ ഉപയോഗിച്ച് സ്വാഭാവികമാക്കുന്നു.
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: താഴേക്ക് വേരൂന്നുക
  rationale: നാമരൂപമായ שֹׁרֶשׁ ഇവിടെ സസ്യരൂപകത്തിൽ ക്രിയാത്മകമായി പ്രവർത്തിക്കുന്നു. ‘വേരൂന്നുക’ സ്വാഭാവിക മലയാളമാണ്; לְמָטָּהയുടെ ദിശാസൂചന ‘താഴേക്ക്’ എന്നു നിലനിർത്തുന്നു.
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: മുകളിലേക്ക് ഫലം കായ്ക്കുക
  rationale: עָשָׂה פְרִי എന്നത് ഫലം ഉൽപ്പാദിപ്പിക്കുക/കായ്ക്കുക എന്ന സസ്യപ്രയോഗമാണ്. ‘ഫലം കായ്ക്കുക’ രൂപകം സംരക്ഷിക്കുകയും ‘മുകളിലേക്ക്’ താഴേക്ക്–മുകളിലേക്ക് എന്ന കാവ്യസമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
