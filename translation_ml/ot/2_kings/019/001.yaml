source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/001.yaml
  text: And when King Hezekiah heard it, he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: ml
  text: ഹിസ്കീയാരാജാവ് അതു കേട്ടപ്പോൾ തന്റെ വസ്ത്രങ്ങൾ കീറി, ചാക്കുവസ്ത്രം ധരിച്ച് യാഹ്‌വെയുടെ ആലയത്തിൽ പ്രവേശിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: ഹീബ്രു ആഖ്യാനസൂത്രം സൂചിപ്പിക്കുന്ന സമയബന്ധവും സംഭവക്രമവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്ന വാക്കുതോറ്റ പരിഭാഷ ഒഴിവാക്കുന്നു.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: ഹിസ്കീയാരാജാവ്
  rationale: പദവിയും പേരും ചേർക്കുന്ന സ്വാഭാവിക മലയാളരൂപം; ഹീബ്രുവിലെ രാജപദവി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ കീറി
  rationale: ദുഃഖവും വിനയവും പ്രകടിപ്പിക്കുന്ന ആചാരപരമായ പ്രവൃത്തി കൃത്യവും സുതാര്യവുമായി നൽകുന്നു.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: ചാക്കുവസ്ത്രം ധരിച്ച്
  rationale: പ്രത്യാവർത്തക ക്രിയയുടെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ദുഃഖാചരണത്തിനുള്ള പരുക്കൻ വസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത പദം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയത്തിൽ പ്രവേശിച്ചു
  rationale: בוא എന്ന ക്രിയയിലെ അകത്തേക്കുള്ള ചലനം ‘പ്രവേശിച്ചു’ എന്ന് വ്യക്തമാക്കുന്നു; ‘വീട്’ എന്ന വാക്കുതോറ്റ രൂപത്തേക്കാൾ ഇവിടെ ദേവാലയത്തെ സൂചിപ്പിക്കുന്ന ‘ആലയം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ദീർഘകാലമായി പരിചിതമായ നാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പദവിയായി മാറ്റാതെ നിലനിർത്തുന്നു. മലയാള ക്രൈസ്തവ വായനയിൽ സുപരിചിതവും dignified ആയ രൂപം ‘യഹോവ’യാണ്; ‘യാഹ്‌വെ’ മൂലോച്ചാരണത്തെ കൂടുതൽ അടുപ്പിച്ച് പ്രതിനിധീകരിക്കുന്ന മറ്റൊരു സാധുവായ രൂപമാണ്.
- issue: בֵּית יְהוָה എന്ന പ്രയോഗം
  choice: യഹോവയുടെ ആലയം
  alternative: യഹോവയുടെ ഭവനം
  rationale: സന്ദർഭത്തിൽ ഈ പ്രയോഗം ദേവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആലയം’ അർത്ഥം വ്യക്തമായി നൽകുന്നു; ‘ഭവനം’ ഹീബ്രു രൂപകത്തെ കൂടുതൽ നേരിട്ട് നിലനിർത്തുമെങ്കിലും ആധുനിക വായനയിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദുഃഖാചരണത്തിന്റെ സാംസ്കാരിക സൂചനകൾ വിശദീകരിക്കാതെ വാക്യത്തിൽ കൃത്യമായി നിലനിർത്തിയിരിക്കുന്നു.
