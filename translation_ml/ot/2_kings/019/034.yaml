id: 2KI.19.34
reference: 2 Kings 19:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַנּוֹתִ֛י אֶל הָ/עִ֥יר הַ/זֹּ֖את לְ/הֽוֹשִׁיעָ֑/הּ לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/034.yaml
  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
translation:
  language: ml
  text: ഈ നഗരത്തെ രക്ഷിക്കാനായി ഞാൻ അതിനെ പ്രതിരോധിക്കും[a]—എന്റെ നിമിത്തവും എന്റെ ദാസനായ ദാവീദിന്റെ നിമിത്തവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സംരക്ഷിക്കും.’ ഹീബ്രായ ക്രിയയ്ക്ക് സംരക്ഷിക്കുക, മൂടിക്കാക്കുക എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: ഞാൻ അതിനെ കാത്തുരക്ഷിക്കും
  rationale: גנן എന്ന ക്രിയയ്ക്ക് മൂടിക്കാക്കുക, സംരക്ഷിക്കുക എന്ന അർഥമുണ്ട്. ഭീഷണിയിലായ യെരൂശലേമിന്റെ സൈനികസന്ദർഭത്തിൽ ‘കാത്തുരക്ഷിക്കും’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: ഈ നഗരത്തെ ... അതിനെ
  rationale: גנן-നോടൊപ്പം אֶל സംരക്ഷണപ്രവർത്തനം ലക്ഷ്യമാക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ക്രിയയുടെ കർമമായി നൽകുന്നത് സ്വാഭാവികമാണ്; ആവർത്തനം ഒഴിവാക്കാൻ തുടർന്ന് ‘അതിനെ’ ഉപയോഗിച്ചു.
- source_word: לְהוֹשִׁיעָהּ
  choice: രക്ഷിക്കേണ്ടതിന്
  rationale: ישע എന്ന ധാതു അപകടത്തിൽനിന്ന് രക്ഷിക്കുക/വിടുവിക്കുക എന്ന അർഥം നൽകുന്നു. ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന לְ രൂപം ‘രക്ഷിക്കേണ്ടതിന്’ എന്നു നിലനിർത്തി.
- source_word: לְמַעֲנִי
  choice: എന്നെപ്രതി
  rationale: ദൈവത്തിന്റെ സ്വന്തം ഉദ്ദേശ്യമാണ് പ്രവർത്തനത്തിന്റെ ഒരു അടിസ്ഥാനമെന്ന് ചുരുക്കമായും ഗൗരവത്തോടെയും പ്രകടിപ്പിക്കുന്നു.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: എന്റെ ദാസനായ ദാവീദിനെപ്രതിയും
  rationale: രണ്ടാമത്തെ לְמַעַן അടിസ്ഥാനവും ‘എന്റെ ദാസനായ ദാവീദ്’ എന്ന വിശേഷണബന്ധവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യെരൂശലേമിനെ രക്ഷിക്കുന്നതിനുള്ള ദൈവിക പ്രേരണ
  choice: ദൈവം സ്വന്തം നിമിത്തവും തന്റെ ദാസനായ ദാവീദിന്റെ നിമിത്തവും നഗരത്തെ രക്ഷിക്കുമെന്ന് പ്രസ്താവിക്കുന്നു.
  alternative: ദാവീദിനെക്കുറിച്ചുള്ള പരാമർശം മുൻകാല വാഗ്ദാനങ്ങളിലേക്കുള്ള സൂചനയായി മാത്രം വ്യക്തമാക്കുക.
  rationale: ഹീബ്രായ പാഠം לְמַעַן ഉപയോഗിച്ച് രണ്ടു കാരണങ്ങളും സമാന്തരമായി നൽകുന്നു. ഉടമ്പടിസംബന്ധമായ സൂചന നിലനിൽക്കുന്നുവെങ്കിലും അതിനെ വ്യാഖ്യാനപരമായി വികസിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എന്നെപ്രതി’ എന്ന രൂപം ആവർത്തിക്കുന്ന לְמַעַן ഘടനയെ ചുരുക്കമായി പ്രതിഫലിപ്പിക്കുന്നു; രക്ഷയും സംരക്ഷണവും തമ്മിലുള്ള ഹീബ്രായ പാഠത്തിലെ ഉദ്ദേശ്യബന്ധം നിലനിർത്തുന്നു.
