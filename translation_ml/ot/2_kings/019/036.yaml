  text: So Sennacherib king of Assyria departed and went and returned, and he lived in Nineveh.
translation:
  language: ml
  text: അങ്ങനെ അശ്ശൂർ രാജാവായ സൻഹേരീബ് പുറപ്പെട്ടു, പോയി, മടങ്ങി, നിനവേയിൽ താമസിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע וַיֵּלֶךְ וַיָּשָׁב
  choice: അവിടെനിന്ന് പുറപ്പെട്ടുപോയി മടങ്ങി
  rationale: മൂന്നു തുടർച്ചയായ ക്രിയകളായ ‘പുറപ്പെടുക, പോകുക, മടങ്ങുക’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ചുരുക്കമില്ലാതെ നിലനിർത്തുന്നു; ‘അവിടെനിന്ന്’ പുറപ്പെടലിന്റെ സന്ദർഭസൂചന വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ഇവിടെ രാജാവ് നിനവേയിൽ വസിച്ചതിനെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘താമസിച്ചു’ സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മതയ്ക്ക് യോജിച്ചതുമാണ്.
- source_word: בְּנִינְוֵה
  choice: നിനവേയിൽ
  rationale: സ്ഥലനാമത്തിന്റെ പരിചിതമായ മലയാള ലിപ്യന്തരണവും സ്ഥാനവിഭക്തിയും ഉപയോഗിച്ചു.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവായ സൻഹേരീബ്
  rationale: എബ്രായത്തിലെ പദബന്ധം സ്വാഭാവിക മലയാള നാമവിശേഷണഘടനയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. എബ്രായത്തിലെ ക്രിയാക്രമം സംരക്ഷിച്ചെങ്കിലും മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനഭാവം ഒഴിവാക്കി.
