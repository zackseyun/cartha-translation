source:
  edition: WLC
  text: הַ/הִצִּ֨ילוּ אֹתָ֜/ם אֱלֹהֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר שִׁחֲת֣וּ אֲבוֹתַ֔/י אֶת גּוֹזָ֖ן וְ/אֶת חָרָ֑ן וְ/רֶ֥צֶף וּ/בְנֵי עֶ֖דֶן אֲשֶׁ֥ר בִּ/תְלַאשָּֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
translation:
  language: ml
  text: എന്റെ പിതാക്കന്മാർ നശിപ്പിച്ച ജാതികളുടെ ദേവന്മാർ അവരെ വിടുവിച്ചോ—ഗോസാൻ, ഹാരാൻ, രെസെഫ്, തെലസ്സാറിലുണ്ടായിരുന്ന ഏദെന്റെ മക്കൾ[a] എന്നിവരെ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തെലസ്സാറിലുണ്ടായിരുന്ന ഏദെൻനിവാസികൾ.” എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “ഏദെന്റെ മക്കൾ” എന്നാണ്; ഇത് ഏദെനിലെ ജനങ്ങളെയോ നിവാസികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: വിടുവിച്ചോ
  rationale: നצל എന്ന ധാതുവിന്റെ ഹിഫീൽ പൂർണ്ണരൂപം ഇവിടെ ഭൂതകാലത്തെക്കുറിച്ചുള്ള ആലങ്കാരിക ചോദ്യമാണ്; ‘വിടുവിച്ചോ’ രക്ഷിക്കുക/മോചിപ്പിക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֹתָם
  choice: അവരെ
  rationale: തുടർന്ന് പേരെടുത്തുപറയുന്ന ജനങ്ങളെയും സ്ഥലങ്ങളിലെ നിവാസികളെയും സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: ജാതികളുടെ ദേവന്മാർ
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ നേരിട്ടുള്ള അർഥം; വിവിധ ജാതികൾ ആരാധിച്ചിരുന്ന ദേവന്മാരെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי
  choice: എന്റെ പിതാക്കന്മാർ നശിപ്പിച്ച
  rationale: ശחת എന്ന പീയേൽ രൂപത്തിന് സൈനികസന്ദർഭത്തിൽ ‘നശിപ്പിക്കുക’ യോജിക്കുന്നു; אֲבוֹתַי എന്നതിന്റെ ‘എന്റെ പിതാക്കന്മാർ’ എന്ന രൂപവും രാജാവിന്റെ മുൻഗാമികളെ സൂചിപ്പിക്കുന്ന ഭാഷാശൈലിയും നിലനിർത്തുന്നു.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: ഗോസാൻ, ഹാരാൻ, രേസെഫ്
  rationale: സ്ഥലനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: וּבְנֵי עֶדֶן
  choice: ഏദെന്റെ മക്കൾ
  rationale: ബെനേ എന്നതിന്റെ അക്ഷരാർഥമായ ‘മക്കൾ’ നിലനിർത്തുന്നത് മൂലപാഠത്തിന്റെ രൂപവും അതിലുള്ള ജനവിഭാഗ/വംശജ അർഥസാധ്യതയും സംരക്ഷിക്കുന്നു; ‘ഏദെൻനിവാസികൾ’ എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר בִּתְלַאשָּׂר
  choice: തെലസ്സാറിലുണ്ടായിരുന്ന
  rationale: സ്ഥലനാമത്തോടുകൂടിയ ב എന്ന ഉപസർഗവും ബന്ധവാക്യവും സ്വാഭാവിക മലയാളത്തിൽ ‘തെലസ്സാറിലുണ്ടായിരുന്ന’ എന്നു നൽകിയിരിക്കുന്നു.
