translation_notes:
  register: ആലങ്കാരിക ചോദ്യത്തിന്റെ പരിഹാസഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം ഉപയോഗിച്ചു. അക്ഷരാർഥവും സന്ദർഭാർഥവും തമ്മിലുള്ള യഥാർഥ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
