  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
translation:
  language: ml
  text: നീ എനിക്കെതിരെ ക്രോധിച്ചതും നിന്റെ ആത്മസംതൃപ്തിയും[a] എന്റെ ചെവികളിൽ എത്തിയിരിക്കയാൽ, ഞാൻ എന്റെ കൊളുത്ത് നിന്റെ മൂക്കിലും എന്റെ കടിഞ്ഞാൺ നിന്റെ ചുണ്ടുകളിലും ഇടും; നീ വന്ന വഴിയിലൂടെതന്നെ ഞാൻ നിന്നെ മടക്കിയയക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്റെ അലംഭാവം,” “നിന്റെ അഹങ്കാരം,” അല്ലെങ്കിൽ “നിന്റെ ആത്മവിശ്വാസം.” ഹീബ്രുപദം സ്വസ്ഥതയെയോ താൻ സുരക്ഷിതനാണെന്ന ഉറച്ച ബോധത്തെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് ധിക്കാരപരമായ സന്ദർഭത്തിലാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: എത്തിയിരിക്കയാൽ
  rationale: വരാനിരിക്കുന്ന ന്യായവിധിയുടെ കാരണം വ്യക്തമാക്കുന്ന ഹീബ്രു കാരണബന്ധം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: നീ എനിക്കെതിരെ ക്രോധംകൊണ്ടത്
  rationale: רָגַז എന്ന ക്രിയയുടെ ആത്മനേപദരൂപം സൂചിപ്പിക്കുന്ന ശത്രുതാപരമായ ക്ഷോഭവും ക്രോധവും വ്യക്തമാക്കുന്നു.
- source_word: שַׁאֲנַנְךָ
  choice: നിന്റെ അഹങ്കാരനിർഭരമായ നിർഭയത്വം
  rationale: ഈ പദത്തിന്റെ അടിസ്ഥാനമായ സ്വസ്ഥത, സുരക്ഷിതത്വബോധം, ആത്മവിശ്വാസം എന്നിവയും സന്ദർഭത്തിലെ ധിക്കാരപരമായ ഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: עָלָה בְאָזְנָי
  choice: എന്റെ ചെവികളിൽ എത്തിയിരിക്കുന്നു
  rationale: ദൈവം അതു കേട്ടുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകിക്കൊണ്ട് ചെവികളുടെ ദൃശ്യരൂപകം നിലനിർത്തുന്നു.
- source_word: חַחִי בְּאַפֶּךָ
  choice: എന്റെ കൊളുത്ത് നിന്റെ മൂക്കിൽ
  rationale: മൃഗത്തെയോ തടവുകാരനെയോ നിയന്ത്രിക്കാൻ ഉപയോഗിക്കുന്ന കൊളുത്തിന്റെ അപമാനകരവും ശക്തവുമായ രൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: എന്റെ കടിഞ്ഞാൺ നിന്റെ ചുണ്ടുകളിൽ
  rationale: מֶתֶג സൂചിപ്പിക്കുന്ന നിയന്ത്രണോപകരണം മലയാളത്തിൽ പരിചിതമായ ‘കടിഞ്ഞാൺ’ എന്നു നൽകി, ഹീബ്രുവിലെ ‘ചുണ്ടുകൾ’ എന്ന ശരീരഭാഗം നിലനിർത്തുന്നു.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: ഞാൻ നിന്നെ മടക്കിയയക്കും
  rationale: שׁוב എന്ന ക്രിയയുടെ കാരകഭാവവും ശത്രുവിന്റെ പിന്മാറ്റത്തിന്മേലുള്ള ദൈവിക നിയന്ത്രണവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: നീ വന്ന വഴിയിലൂടെതന്നെ
  rationale: ആക്രമണത്തിനായി വന്ന അതേ വഴിയിലൂടെ മടങ്ങേണ്ടിവരുമെന്ന ന്യായവിധിയുടെ സമമിതി സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവം കേൾക്കുന്നതും അശ്ശൂർരാജാവിനെ നിയന്ത്രിക്കുന്നതുമായി ബന്ധപ്പെട്ട മനുഷ്യരൂപക ഭാഷ
  choice: ‘എന്റെ ചെവികൾ,’ ‘എന്റെ കൊളുത്ത്,’ ‘എന്റെ കടിഞ്ഞാൺ’ എന്നീ ദൃശ്യരൂപങ്ങൾ സംരക്ഷിച്ചു.
  alternative: ‘ഞാൻ അതു കേട്ടു,’ ‘ഞാൻ നിന്നെ നിയന്ത്രിക്കും’ എന്നിങ്ങനെ അമൂർത്തമായി ചുരുക്കുക.
  rationale: ദൈവത്തിന്റെ അറിവും പരമാധികാരവും ധിക്കാരിയായ രാജാവിന്റെ അപമാനകരമായ കീഴടക്കവും പ്രവചനത്തിലെ ശക്തമായ രൂപകങ്ങളിലൂടെ പ്രകടമാകുന്നു; അവയെ വ്യാഖ്യാനാത്മകമായി മങ്ങിക്കരുത്.
- issue: שַׁאֲנַנְךָ എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: ‘അഹങ്കാരനിർഭരമായ നിർഭയത്വം’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ‘അലംഭാവം,’ ‘അഹങ്കാരം,’ അല്ലെങ്കിൽ ‘ആത്മവിശ്വാസം.’
  rationale: പദം അടിസ്ഥാനമായി സ്വസ്ഥമായ സുരക്ഷിതത്വത്തെയും ആത്മനിശ്ചയത്തെയും സൂചിപ്പിക്കുന്നു; ഈ ശത്രുതാപരമായ സന്ദർഭത്തിൽ അത് ധിക്കാരപരമാണ്. ഒറ്റ മലയാളപദം മുഴുവൻ വ്യാപ്തിയും പിടിക്കാത്തതിനാൽ സംയുക്തപ്രയോഗവും അടിക്കുറിപ്പും ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രവചനശൈലി. ഹീബ്രുവിലെ മൂക്ക്, ചുണ്ടുകൾ, കൊളുത്ത്, കടിഞ്ഞാൺ എന്നീ സാക്ഷാത് ദൃശ്യങ്ങൾ നിലനിർത്തിയപ്പോൾ, പദക്രമം മലയാളവായനയ്ക്ക് സ്വാഭാവികമാക്കി.
