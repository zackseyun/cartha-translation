- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: അവൻ ... ഒരു വർഷം ഭരിച്ചു
  rationale: ഭരണകാലത്തിന്റെ ദൈർഘ്യം നേരായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണവും മൂലത്തിലെ സ്ഥാനിക അർഥവും നിലനിർത്തുന്നു.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് ... എന്നായിരുന്നു
  rationale: എബ്രായ നാമകരണസൂത്രത്തെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֲתַלְיָהוּ
  choice: അഥല്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בַּת עָמְרִי
  choice: ഒമ്രിയുടെ മകൾ
  rationale: בַּת എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മകൾ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; വിശാലമായ വംശപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ
  rationale: ഒമ്രിയുടെ രാജപദവി സ്വാഭാവികമായ മലയാള വിശേഷണഘടനയിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ഒമ്രിയുടെ മകൾ’ എന്ന വംശാവലിപ്രയോഗം
  choice: മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള ബന്ധപദമായ ‘മകൾ’ നിലനിർത്തുക
  alternative: ‘ഒമ്രിയുടെ വംശജ’ അഥവാ ‘ഒമ്രിയുടെ രാജവംശത്തിൽപ്പെട്ടവൾ’
  rationale: എബ്രായ ബന്ധപദത്തിന് ചില സന്ദർഭങ്ങളിൽ വിശാലമായ വംശപരമോ രാജവംശപരമോ ആയ അർഥമുണ്ടാകാം. എന്നാൽ ഇവിടെ ആ സാധ്യത നിർബന്ധമായി തീർപ്പാക്കാതെ, പദത്തിന്റെ നേരിട്ടുള്ള അർഥം മുഖ്യപാഠത്തിലും മറ്റുസാധ്യത അടിക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. രാജസ്ഥാനാരോഹണവും ഭരണകാലവും സംബന്ധിച്ച സൂത്രവാക്യങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകിയിരിക്കുന്നു; വംശാവലിപദത്തിലെ യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
