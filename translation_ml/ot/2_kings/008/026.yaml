  text: Ahaziah was twenty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother's name was Athaliah, the daughter of Omri king of Israel.
translation:
  language: ml
  text: അഹസ്യാവ് രാജാവായപ്പോൾ അവന് ഇരുപത്തിരണ്ടു വയസ്സായിരുന്നു. അവൻ യെരൂശലേമിൽ ഒരു വർഷം ഭരിച്ചു. അവന്റെ അമ്മയുടെ പേര് അഥല്യാവ് എന്നായിരുന്നു; അവൾ ഇസ്രായേൽരാജാവായ ഒമ്രിയുടെ മകളായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒമ്രിയുടെ വംശജ.” എബ്രായത്തിലെ “മകൾ” എന്ന പദം ചിലപ്പോൾ നേരിട്ടുള്ള മകളെയല്ല, ഒരു സ്ത്രീ വംശജയെയോ രാജവംശത്തിലെ അംഗത്തെയോ സൂചിപ്പിക്കാം.
