source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל חֲזָהאֵ֗ל קַ֤ח בְּ/יָֽדְ/ךָ֙ מִנְחָ֔ה וְ/לֵ֕ךְ לִ/קְרַ֖את אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/דָרַשְׁתָּ֨ אֶת יְהוָ֤ה מֵֽ/אוֹת/וֹ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
translation:
  language: ml
  text: 'രാജാവ് ഹസായേലിനോടു പറഞ്ഞു: “ഒരു സമ്മാനം കൈയിൽ എടുത്ത് ദൈവപുരുഷനെ കാണാൻ പോകുക; അവൻ മുഖാന്തരം യാഹ്‌വേയോടു ചോദിക്കുക: ‘ഞാൻ ഈ രോഗത്തിൽനിന്ന് സുഖം പ്രാപിക്കുമോ?[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ഈ രോഗത്തിൽനിന്ന് ജീവനോടെ രക്ഷപ്പെടുമോ?” എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം “ജീവിക്കുക” എന്നാണ്; ഇവിടെ രോഗത്തെ അതിജീവിക്കുകയോ സുഖം പ്രാപിക്കുകയോ ചെയ്യുക എന്ന അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: സമ്മാനം
  rationale: ഈ സന്ദർഭത്തിൽ പ്രവാചകനെ സമീപിക്കുമ്പോൾ കൊണ്ടുപോകുന്ന കാഴ്ചയാണ് ഉദ്ദേശിക്കുന്നത്; ആരാധനാപരമായ യാഗമോ വഴിപാടോ അല്ല.
- source_word: לִקְרַאת
  choice: കാണാൻ
  rationale: ‘പോകുക’ എന്ന ക്രിയയ്ക്കു പിന്നാലെ ലക്ഷ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗം; ആധുനിക മലയാളത്തിൽ ‘ദൈവപുരുഷനെ കാണാൻ പോകുക’ സ്വാഭാവികമാണ്.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന എബ്രായ ബിരുദത്തിന്റെ രൂപവും ആഖ്യാനപരമായ പ്രാധാന്യവും നിലനിർത്തുന്നു.
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  choice: അവൻ മുഖാന്തരം യഹോവയോട് അരുളപ്പാട് അന്വേഷിക്കുക
  rationale: യഹോവയിൽനിന്നുള്ള മറുപടി പ്രവാചകൻ മുഖേന തേടുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; വെറും പൊതുവായ അന്വേഷണം എന്നതിലുപരി ദൈവിക അരുളപ്പാടാണ് സന്ദർഭം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַאֶחְיֶה
  choice: ഞാൻ സുഖം പ്രാപിക്കുമോ?
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘ജീവിക്കുമോ’ എന്നാണെങ്കിലും രോഗസന്ദർഭത്തിൽ സുഖം പ്രാപിക്കുകയോ അതിജീവിക്കുകയോ ചെയ്യുമോ എന്നതാണ് സ്വാഭാവിക അർഥം; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מֵחֳלִי זֶה
  choice: ഈ രോഗത്തിൽനിന്ന്
  rationale: രാജാവിന്റെ ഇപ്പോഴത്തെ അസുഖത്തെ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּיָדְךָ
  choice: നിന്റെ കൈയിൽ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യത നിലനിർത്തുന്നു; മലയാളത്തിലും ഇത് മനസ്സിലാകുന്ന സ്വാഭാവിക പ്രയോഗമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു ബിരുദമായി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- issue: പ്രവാചകൻ മുഖേന യഹോവയോട് അന്വേഷിക്കൽ
  choice: അവൻ മുഖാന്തരം യഹോവയോട് അരുളപ്പാട് അന്വേഷിക്കുക
  alternative: അവനോട് യഹോവയെക്കുറിച്ച് ചോദിക്കുക
  rationale: מֵאֹתוֹ പ്രവാചകന്റെ മധ്യസ്ഥപങ്ക് സൂചിപ്പിക്കുന്നു; എങ്കിലും പ്രവാചകൻ തന്നെയാണ് ഉത്തരത്തിന്റെ ഉറവിടം എന്നു വരാത്തവിധം യഹോവയെയാണ് അന്വേഷിക്കുന്നത് എന്ന് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘ദൈവപുരുഷൻ’ എന്ന പരമ്പരാഗത ബൈബിൾ ബിരുദം നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ചോദ്യത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
