source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קְצֵה֙ שֶׁ֣בַע שָׁנִ֔ים וַ/תָּ֥שָׁב הָ/אִשָּׁ֖ה מֵ/אֶ֣רֶץ פְּלִשְׁתִּ֑ים וַ/תֵּצֵא֙ לִ/צְעֹ֣ק אֶל הַ/מֶּ֔לֶךְ אֶל בֵּיתָ֖/הּ וְ/אֶל שָׂדָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/003.yaml
  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
translation:
  language: ml
  text: ഏഴു വർഷം അവസാനിച്ചപ്പോൾ ആ സ്ത്രീ ഫെലിസ്ത്യരുടെ ദേശത്തുനിന്ന് മടങ്ങിവന്നു. തന്റെ വീടിനും വയലിനുംവേണ്ടി രാജാവിന്റെ അടുക്കൽ നിലവിളിക്കാൻ[a] അവൾ പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജാവിനോടു അപേക്ഷിക്കാൻ” അല്ലെങ്കിൽ “രാജാവിനോടു നീതി അപേക്ഷിക്കാൻ.”
    reason: צָעַק എന്ന എബ്രായ ക്രിയയുടെ അടിസ്ഥാന അർഥം “നിലവിളിക്കുക” എന്നാണ്; ഈ സന്ദർഭത്തിൽ സഹായത്തിനോ നീതിക്കോ വേണ്ടിയുള്ള അടിയന്തര അപേക്ഷ എന്ന അർഥവും ഉണ്ടായേക്കാം.
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  choice: ഏഴു വർഷം കഴിഞ്ഞപ്പോൾ
  rationale: ഒരു കാലയളവിന്റെ അവസാനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתָּשָׁב
  choice: മടങ്ങിവന്നു
  rationale: മുൻപ് പാർത്തിരുന്ന ഫെലിസ്ത്യരുടെ ദേശത്തുനിന്നുള്ള തിരിച്ചുവരവിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ ദേശം
  rationale: ‘ഫെലിസ്ത്യ’ എന്ന ഭൂമിശാസ്ത്രനാമത്തേക്കാൾ മൂലപാഠത്തിലെ ‘ഫെലിസ്ത്യരുടെ ദേശം’ എന്ന ഘടന സംരക്ഷിക്കുന്നു.
- source_word: וַתֵּצֵא
  choice: ചെന്നു
  rationale: ഇവിടെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള പുറപ്പെടൽ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘പുറപ്പെട്ടു ചെന്നു’ എന്നു പറയുന്നത് അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: לִצְעֹק אֶל־הַמֶּלֶךְ
  choice: രാജാവിനോടു സങ്കടം ബോധിപ്പിക്കാൻ
  rationale: צעק എന്ന ക്രിയയുടെ ‘നിലവിളിക്കുക/സഹായത്തിനായി മുറവിളി കൂട്ടുക’ എന്ന ശക്തിയും രാജാവിനോടുള്ള നീതിനിവേദനത്തിന്റെ സന്ദർഭവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: אֶל בֵּיתָהּ וְאֶל שָׂדָהּ
  choice: തന്റെ വീടും വയലും തിരികെ ലഭിക്കാനായി
  rationale: സ്വത്തുക്കളെ സംബന്ധിച്ച അവളുടെ അപേക്ഷയാണ് ഉദ്ദേശ്യമെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘വീടിനും വയലിനും വേണ്ടി’ എന്നതിനെക്കാൾ അർഥം തെളിഞ്ഞതാണ്; ‘വീട്’, ‘വയൽ’ എന്നീ നിർദിഷ്ട പദങ്ങൾ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി. നിയമപരമായ അപേക്ഷയുടെ ഭാവവും മൂലക്രിയയുടെ വികാരതീവ്രതയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
