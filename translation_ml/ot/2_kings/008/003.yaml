revisions:
- from: ഏഴു വർഷം കഴിഞ്ഞപ്പോൾ ആ സ്ത്രീ ഫെലിസ്ത്യരുടെ ദേശത്തുനിന്നു മടങ്ങിവന്നു. തന്റെ വീടും വയലും തിരികെ ലഭിക്കാനായി അവൾ രാജാവിനോടു സങ്കടം ബോധിപ്പിക്കാൻ[a] ചെന്നു.
  to: ഏഴു വർഷം അവസാനിച്ചപ്പോൾ ആ സ്ത്രീ ഫെലിസ്ത്യരുടെ ദേശത്തുനിന്ന് മടങ്ങിവന്നു. തന്റെ വീടിനും വയലിനുംവേണ്ടി രാജാവിന്റെ അടുക്കൽ നിലവിളിക്കാൻ[a] അവൾ പുറപ്പെട്ടു.
  rationale: The revision gives the main text the direct, emotionally forceful sense of צָעַק (‘cry out’) and preserves וַתֵּצֵא with «പുറപ്പെട്ടു». It also removes the slightly more interpretive statement that she went specifically ‘to get [the properties] back,’ while retaining the source’s explicit objects, her house and field. The footnote preserves the contextually plausible legal-petition nuance without replacing the primary sense in the text.
