translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ അലങ്കാരചോദ്യം പ്രസ്താവനയാക്കി മാറ്റാതെ ‘എഴുതിയിട്ടുണ്ടല്ലോ?’ എന്നു നിലനിർത്തി; ആരംഭത്തിലെ וְ-യ്ക്ക് മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
