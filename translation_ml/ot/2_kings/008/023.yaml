id: 2KI.8.23
reference: 2 Kings 8:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹרָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/023.yaml
  text: The rest of the acts of Yoram[b][a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: യോരാമിന്റെ[b] ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്ത സകലവും യൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[a] എഴുതിയിട്ടുണ്ടല്ലോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യൂദാരാജാക്കന്മാരുടെ വാർഷികരേഖകളുടെ പുസ്തകം.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘യോരാം’; പരമ്പരാഗതമായി ‘യെഹോരാം.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: יֶתֶר എന്നത് ‘ശേഷിച്ചവ’ എന്നും, രാജഭരണസംഗ്രഹങ്ങളിൽ דִּבְרֵי എന്നത് രാജാവിന്റെ പ്രവൃത്തികളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ശേഷിച്ച പ്രവൃത്തികൾ’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: יוֹרָם
  choice: യോരാം
  rationale: ഹീബ്രു രൂപമായ יוֹרָם-നെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്ന ആധുനിക മലയാള ലിപ്യന്തരണം.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്ത സകലവും
  rationale: മൂലത്തിലെ സമഗ്രതയും ആപേക്ഷികവാക്യഘടനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടുണ്ടല്ലോ?
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഹീബ്രു അലങ്കാരചോദ്യത്തിന്റെ ഭാവം മലയാളത്തിലെ ‘അല്ലോ’ ഘടനയിലൂടെ സ്വാഭാവികമായി പകരുന്നു.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: പദശഃ ‘പുസ്തകത്തിന്മേൽ/ചുരുളിന്മേൽ’ എന്നായാലും, ഒരു രേഖയിൽ ഉള്ളടക്കം രേഖപ്പെടുത്തിയതായി പറയാൻ മലയാളത്തിൽ ‘പുസ്തകത്തിൽ’ എന്നതാണ് സ്വാഭാവികം.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: യൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം
  rationale: രാജാക്കന്മാരെ സംബന്ധിച്ച ഔദ്യോഗിക കാലക്രമരേഖയെ സൂചിപ്പിക്കുന്ന ശീർഷകസദൃശ പ്രയോഗം; ‘ദിനവൃത്താന്തം’ דִּבְרֵי הַיָּמִים എന്നതിന്റെ പരമ്പരാഗതവും അർത്ഥസൂചകവുമായ മലയാള പരിഭാഷയാണ്.
