source:
  edition: WLC
  text: בִּ/שְׁנַת֙ שְׁתֵּים עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/יוֹרָ֥ם בֶּן אַחְאָ֖ב מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ אֲחַזְיָ֥הוּ בֶן יְהוֹרָ֖ם מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/025.yaml
  text: In the twelfth year of Joram son of Ahab[a], king of Israel, Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: ml
  text: ഇസ്രായേൽരാജാവായ ആഹാബിന്റെ മകൻ യോരാമിന്റെ[a] വാഴ്ചയുടെ പന്ത്രണ്ടാം വർഷത്തിൽ, യെഹൂദാരാജാവായ യെഹോരാമിന്റെ മകൻ അഹസ്യാവ് രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇസ്രായേൽരാജാവിന്റെ പേര് എബ്രായത്തിൽ ‘യോരാം’ എന്നും യെഹൂദാരാജാവിന്റെ പേര് ‘യെഹോരാം’ എന്നും വരുന്നു; ഇവ ഒരേ പേരിന്റെ ബന്ധമുള്ള രൂപങ്ങളാണ്, ചില വിവർത്തനങ്ങളിൽ രണ്ടും ‘യോരാം’ എന്ന് നൽകിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: വാഴ്ചയുടെ പന്ത്രണ്ടാം വർഷത്തിൽ
  rationale: എബ്രായ രാജവാഴ്ചാ കാലഗണനാശൈലിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മൂലത്തിൽ പരോക്ഷമായിരിക്കുന്ന ‘വാഴ്ച’ അർത്ഥം സന്ദർഭാനുസൃതമായി വെളിപ്പെടുത്തുന്നു.
- source_word: לְ/יוֹרָם
  choice: യോരാമിന്റെ
  rationale: രാജവാഴ്ചാ വർഷം ആരുടേതാണെന്ന് സൂചിപ്പിക്കുന്ന לְ എന്ന ഉപസർഗത്തിന്റെ സ്വാഭാവിക മലയാള തത്തുല്യം.
- source_word: בֶּן אַחְאָב
  choice: ആഹാബിന്റെ മകൻ
  rationale: പിതൃനാമബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ
  rationale: രാജപദവിയും രാജ്യനാമവും സ്വാഭാവികമായ മലയാള വിശേഷണഘടനയിൽ നൽകുന്നു.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: ഈ അധികാരാരോഹണ അറിയിപ്പിൽ ക്രിയ പുതിയ ഭരണം ആരംഭിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘രാജാവായി’ എന്നത് അത് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: אֲחַזְיָהוּ
  choice: അഹസ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: בֶן יְהוֹרָם
  choice: യെഹോരാമിന്റെ മകൻ
  rationale: മൂലത്തിലെ יְהוֹרָם എന്ന ദീർഘ നാമരൂപം നിലനിർത്തുകയും മുമ്പുള്ള ഇസ്രായേൽരാജാവായ יוֹרָם എന്ന പേരിൽനിന്ന് വേർതിരിച്ചറിയാൻ സഹായിക്കുകയും ചെയ്യുന്നു.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ
  rationale: രാജപദവിയും രാജ്യനാമവും നേരിട്ട്, സ്വാഭാവിക മലയാള ഘടനയിൽ വിവർത്തനം ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. ‘ഇസ്രായേൽരാജാവായ’, ‘യെഹൂദാരാജാവായ’ എന്നീ ഘടനകൾ വാക്യം സുഗമമാക്കുന്നു; പേരുകളുടെ മൂലഭാഷാഭേദം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
