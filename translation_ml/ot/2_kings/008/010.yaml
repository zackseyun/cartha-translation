id: 2KI.8.10
reference: 2 Kings 8:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱלִישָׁ֔ע לֵ֥ךְ אֱמָר לא חָיֹ֣ה תִחְיֶ֑ה וְ/הִרְאַ֥/נִי יְהוָ֖ה כִּֽי מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
translation:
  language: ml
  text: 'എലീശാ അവനോടു പറഞ്ഞു: “നീ ചെന്ന് അവനോട്, ‘അങ്ങ് തീർച്ചയായും സുഖം പ്രാപിക്കും[a]’ എന്നു പറയുക. എന്നാൽ അവൻ തീർച്ചയായും മരിക്കുമെന്ന് യഹോവ എനിക്കു വെളിപ്പെടുത്തിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠം അക്ഷരാർഥത്തിൽ, “അങ്ങ് തീർച്ചയായും ജീവിക്കുകയില്ല” എന്നാണ്. ഇവിടത്തെ ഹീബ്രു പ്രയാസകരമാണ്; തുടർന്നുള്ള വെളിപ്പാടിനോടുള്ള വൈരുധ്യം കണക്കിലെടുത്ത് പലരും ഇതിന്റെ ഉദ്ദേശ്യം “അങ്ങ് തീർച്ചയായും സുഖം പ്രാപിക്കും” എന്നാണ് മനസ്സിലാക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  choice: എലീശാ അവനോടു പറഞ്ഞു
  rationale: ഹീബ്രു വാക്യത്തിലെ കർത്താവായ എലീശായെ വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാള പദക്രമം സ്വീകരിച്ചു.
- source_word: לֵךְ אֱמָר
  choice: നീ ചെന്ന് ... പറയുക
  rationale: തുടർച്ചയായ രണ്ടു ആജ്ഞകളുടെ ബലം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: לא חָיֹה תִחְיֶה
  choice: അങ്ങ് തീർച്ചയായും സുഖം പ്രാപിക്കും
  rationale: രോഗസന്ദർഭത്തിൽ חיה എന്നതിന്റെ ഉദ്ദേശ്യാർഥം ‘സുഖം പ്രാപിക്കുക’ എന്നാണ്; infinitive absolute + imperfect ഉറപ്പിനെ ഊന്നുന്നു. മസോററ്റിക് രൂപത്തിലെ לא മൂലമുള്ള പ്രയാസകരമായ നിഷേധാർഥം അടിക്കുറിപ്പിൽ സുതാര്യമായി സൂക്ഷിച്ചു.
- source_word: וְהִרְאַנִי יְהוָה
  choice: എന്നാൽ ... യഹോവ എനിക്കു വെളിപ്പെടുത്തിയിരിക്കുന്നു
  rationale: മുൻപ് അറിയിക്കേണ്ട സന്ദേശവും ദൈവിക വെളിപ്പാടും തമ്മിലുള്ള വൈരുധ്യം וְ ഇവിടെ സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി; causative רא״ה-യ്ക്ക് സന്ദർഭോചിതമായി ‘വെളിപ്പെടുത്തി’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തിന്റെ വ്യക്തിപരമായ രൂപം മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: כִּי מוֹת יָמוּת
  choice: അവൻ തീർച്ചയായും മരിക്കുമെന്ന്
  rationale: מות എന്ന infinitive absolute + imperfect നൽകുന്ന ഊന്നിയ ഉറപ്പ് ‘തീർച്ചയായും’ എന്നതിലൂടെ പ്രകടമാക്കി.
theological_decisions:
- issue: לא חיה תחיה എന്ന പ്രയാസകരമായ വാക്യഭാഗത്തിന്റെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ ‘അങ്ങ് തീർച്ചയായും സുഖം പ്രാപിക്കും’ എന്നു നൽകി; അക്ഷരാർഥത്തിലുള്ള നിഷേധവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
  alternative: മസോററ്റിക് സ്വരചിഹ്നങ്ങളനുസരിച്ച് ‘അങ്ങ് തീർച്ചയായും ജീവിക്കുകയില്ല’ അഥവാ രോഗത്തിൽനിന്ന് രക്ഷപ്പെടുകയില്ല.
  rationale: നൽകേണ്ട മറുപടിയും പിന്നാലെയുള്ള ‘എന്നാൽ’ എന്ന വൈരുധ്യവും, രോഗം സ്വയം മാരകമല്ലെങ്കിലും ബെൻ-ഹദദ് പിന്നീട് കൊല്ലപ്പെടുന്ന കഥാസന്ദർഭവും, സുഖപ്രാപ്തിയുടെ വായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും മസോററ്റിക് പാഠത്തിലെ യഥാർഥ അനിശ്ചിതത്വം മറച്ചുവെക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. രാജാവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ഉദ്ധരണിയിൽ ബഹുമാനസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; വിവരണഭാഗത്ത് ലളിതമായ ‘അവൻ’ നിലനിർത്തി.
