translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. പേരുകൾ മൂലഭാഷയോട് ചേർന്ന രൂപത്തിൽ നൽകി. ‘ഇറങ്ങിച്ചെന്നു’ എന്ന പ്രയോഗം ഭൂമിശാസ്ത്രപരമായ ദിശാസൂചന നിലനിർത്തുന്നു; രോഗാവസ്ഥയെ മുറിവുകളുമായി ഒന്നാക്കാതെ എബ്രായത്തിലെ വ്യത്യാസവും സംരക്ഷിച്ചു.
