base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/029.yaml
  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
translation:
  language: ml
  text: അപ്പോൾ യോരാം രാജാവ്, അരാംരാജാവായ ഹസായേലിനെതിരെ യുദ്ധം ചെയ്തപ്പോൾ രാമയിൽവെച്ച് അരാമ്യർ[b] ഏൽപ്പിച്ച മുറിവുകളിൽനിന്ന് സുഖം പ്രാപിക്കാൻ[a] യിസ്രെയേലിലേക്കു മടങ്ങി. യെഹൂദാരാജാവായ യെഹോരാമിന്റെ മകൻ അഹസ്യാവ്, അഹാബിന്റെ മകൻ യോരാമിനെ കാണാൻ[c] യിസ്രെയേലിലേക്കു ഇറങ്ങിച്ചെന്നു; യോരാം രോഗിയായിരുന്നതിനാൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൗഖ്യം ലഭിക്കാൻ.’
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായം: ‘അരാമ്യർ’; പരമ്പരാഗത പരിഭാഷകളിൽ ‘സുറിയാനികൾ.’'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘യോരാമിനെ സന്ദർശിക്കാൻ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘യോരാമിനെ കാണാൻ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങി
  rationale: ശൂബ് എന്ന ക്രിയയുടെ ആഖ്യാനസന്ദർഭത്തിലെ സ്വാഭാവിക അർഥമായ ‘തിരികെപ്പോയി/മടങ്ങി’ എന്ന ആശയം നൽകുന്നു.
- source_word: לְהִתְרַפֵּא
  choice: സുഖം പ്രാപിക്കാൻ
  rationale: ഹിത്പഅേൽ രൂപം സ്വയം ചികിത്സിച്ചു എന്ന നിർബന്ധിത അർഥമില്ലാതെ മുറിവുകളിൽനിന്നുള്ള സുഖപ്രാപ്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: מִן הַמַּכִּים
  choice: മുറിവുകളിൽനിന്നു
  rationale: പദം അക്ഷരാർഥത്തിൽ അടികളെയോ പ്രഹരങ്ങളെയോ സൂചിപ്പിക്കാമെങ്കിലും, യുദ്ധത്തിനുശേഷമുള്ള ചികിത്സാസന്ദർഭത്തിൽ അവ മൂലമുണ്ടായ മുറിവുകളാണ് ഉദ്ദേശ്യം.
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: അരാമ്യർ ഏല്പിച്ച
  rationale: അരാമ്യർ അവനെ പ്രഹരിച്ചതിലൂടെ ഉണ്ടായ മുറിവുകൾ എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בָּרָמָה
  choice: രാമയിൽവെച്ച്
  rationale: യുദ്ധവും മുറിവേൽക്കലും നടന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ב എന്ന ഉപസർഗത്തിന്റെ സന്ദർഭോചിതമായ പരിഭാഷ.
- source_word: בְּהִלָּחֲמוֹ
  choice: യുദ്ധം ചെയ്തപ്പോൾ
  rationale: ב ചേർന്ന ക്രിയാനാമരൂപം മുറിവേറ്റ സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു.
- source_word: אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  choice: അരാംരാജാവായ ഹസായേലിനോടു
  rationale: לחם എന്ന ക്രിയയോടൊപ്പം വരുന്ന എതിരാളിയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘അരാം’ എന്ന പുരാതന ദേശനാമവും നിലനിർത്തുന്നു.
- source_word: וַאֲחַזְיָהוּ...יָרַד
  choice: അഹസ്യാവ്...ഇറങ്ങിച്ചെന്നു
  rationale: ആഖ്യാനത്തിന്റെ തുടർച്ചയും ירד എന്ന ക്രിയയിലെ താഴോട്ടുള്ള ദിശാസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: യോരാമിനെ കാണാൻ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥം നിലനിർത്തുന്നു; രോഗിയായ ഒരാളെ സന്ദർശിക്കുക എന്ന സന്ദർഭാർഥം മലയാളത്തിലും സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: כִּי חֹלֶה הוּא
  choice: കാരണം, അവൻ രോഗിയായിരുന്നു
  rationale: חֹלֶה അവന്റെ അന്നത്തെ രോഗാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മുറിവേറ്റവൻ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി അർഥം ചുരുക്കുന്നില്ല.
