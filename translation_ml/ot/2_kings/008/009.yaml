  text: וַ/יֵּ֣לֶךְ חֲזָאֵל֮ לִ/קְרָאת/וֹ֒ וַ/יִּקַּ֨ח מִנְחָ֤ה בְ/יָד/וֹ֙ וְ/כָל ט֣וּב דַּמֶּ֔שֶׂק מַשָּׂ֖א אַרְבָּעִ֣ים גָּמָ֑ל וַ/יָּבֹא֙ וַ/יַּעֲמֹ֣ד לְ/פָנָ֔י/ו וַ/יֹּ֗אמֶר בִּנְ/ךָ֨ בֶן הֲדַ֤ד מֶֽלֶךְ אֲרָם֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
translation:
  language: ml
  text: 'അപ്പോൾ ഹസായേൽ അദ്ദേഹത്തെ കാണാൻ ചെന്നു. അവൻ കൈയിൽ ഒരു സമ്മാനവും—അതായത്, ദമസ്കോസിലെ സകല നല്ല വസ്തുക്കളും, നാൽപ്പത് ഒട്ടകങ്ങൾക്കുള്ള ചുമടും—കൊണ്ടുപോയി. അവൻ വന്ന് അദ്ദേഹത്തിന്റെ മുമ്പിൽ നിന്നു പറഞ്ഞു: “അങ്ങയുടെ മകനായ[a] അരാമിന്റെ രാജാവായ ബെൻ-ഹദദ് എന്നെ അങ്ങയുടെ അടുക്കൽ ഇങ്ങനെ പറഞ്ഞ് അയച്ചിരിക്കുന്നു: ‘ഈ രോഗത്തിൽനിന്ന് ഞാൻ സുഖം പ്രാപിക്കുമോ?’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അങ്ങയുടെ മകൻ” എന്നത് ബഹുമാനിക്കപ്പെടുന്ന ഒരു മേലധികാരിയോടുള്ള വിനയപൂർവമായ ആദരപ്രയോഗമാണ്; ഇത് യഥാർഥ പുത്രത്വത്തെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല.
    reason: cultural_note
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഈ രോഗത്തിൽനിന്ന് ഞാൻ ജീവിക്കുമോ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  choice: അദ്ദേഹത്തെ കാണാൻ ചെന്നു
  rationale: ലְ + קרא എന്ന പ്രയോഗത്തിലെ ഒരാളെ ചെന്നുകാണുക/എതിരേൽക്കുക എന്ന ദിശാസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ ഔപചാരികമായ ‘സ്വീകരിക്കാൻ’ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: מִנְחָה
  choice: ഒരു സമ്മാനം
  rationale: ഇവിടെ ആരാധനാസംബന്ധമായ വഴിപാടല്ല, രാജാവിന്റെ ദൂതൻ പ്രവാചകനു കൊണ്ടുവരുന്ന ആദരസൂചകമായ സമ്മാനമാണ്.
- source_word: בְיָדוֹ
  choice: കൈയിൽ
  rationale: എബ്രായത്തിലെ ദൃശ്യവും മൂർത്തവുമായ പ്രയോഗം നിലനിർത്തുന്നു; പിന്നാലെ പറയുന്ന വലിയ ചരക്കിനെ പരിഗണിച്ച് ‘കൈയിൽ ... കൊണ്ടാണ്’ എന്നത് വ്യക്തിപരമായി കൊണ്ടുവന്നുവെന്ന സ്വാഭാവിക അർഥത്തിലും വായിക്കാം.
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  choice: അതായത്, ദമസ്കോസിലെ സകല നല്ല വസ്തുക്കളും
  rationale: സമ്മാനം എന്തായിരുന്നുവെന്ന് വിശദീകരിക്കുന്ന അനുബന്ധഘടകമായി വാക്യം അവതരിപ്പിക്കുന്നു; טוּב സൂചിപ്പിക്കുന്ന മേന്മയുള്ള ഉത്പന്നങ്ങളുടെയും സാധനങ്ങളുടെയും സമൃദ്ധി നിലനിർത്തുന്നു.
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  choice: നാൽപ്പത് ഒട്ടകങ്ങൾക്കുള്ള ചുമട്
  rationale: ചരക്കിന്റെ അളവ് നാൽപ്പത് ഒട്ടകങ്ങളിൽ ചുമത്താവുന്നതായിരുന്നു എന്ന അർഥം നൽകുന്നു; ‘നാൽപ്പത് ഒട്ടകങ്ങളുടെ ചുമട്’ എന്നതിലെ ഉടമസ്ഥതാഭാവം ഒഴിവാക്കുന്നു.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: അദ്ദേഹത്തിന്റെ മുമ്പിൽ നിന്നുകൊണ്ട്
  rationale: ഔപചാരിക സദസ്സിലെ നില്പ് വ്യക്തമാക്കുന്ന എബ്രായ പ്രയോഗം അധിക വ്യാഖ്യാനം കൂടാതെ സംരക്ഷിക്കുന്നു.
- source_word: בִּנְךָ
  choice: അങ്ങയുടെ മകനായ
  rationale: അക്ഷരാർഥമായ കുടുംബരൂപകം നിലനിർത്തുന്നു; ഇത് യഥാർഥ പുത്രത്വമെന്നു നിർബന്ധിക്കാതെ ആദരവിന്റെയും വിനയത്തിന്റെയും പ്രയോഗമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: שְׁלָחַנִי אֵלֶיךָ
  choice: എന്നെ അങ്ങയുടെ അടുക്കൽ അയച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ അയയ്ക്കലിന് ഇപ്പോഴത്തെ സംഭാഷണത്തിൽ പ്രസക്തിയുള്ളതിനാൽ മലയാളത്തിലെ പൂർത്തീകരണരൂപം സ്വാഭാവികമാണ്.
- source_word: הַאֶחְיֶה
  choice: ഞാൻ സുഖം പ്രാപിക്കുമോ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഞാൻ ജീവിക്കുമോ’ എന്നാണെങ്കിലും രോഗത്തിൽനിന്നുള്ള വിടുതലിനെക്കുറിച്ചുള്ള ചോദ്യത്തിൽ ‘സുഖം പ്രാപിക്കുക’ എന്നത് സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: מֵחֳלִי זֶה
  choice: ഈ രോഗത്തിൽനിന്ന്
  rationale: מִן എന്ന മുൻപ്രത്യയത്തിന്റെ ‘നിന്ന്’ എന്ന വിടുതൽസൂചനയും חֳלִיയുടെ രോഗം എന്ന അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: പിന്നീടുള്ള ഭൂരാഷ്ട്രീയ നാമമായ ‘സിറിയ’ ഉപയോഗിക്കാതെ പുരാതന ദേശനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: בִּנְךָ എന്ന ആദരസൂചക കുടുംബരൂപകം
  choice: മുഖ്യപാഠത്തിൽ ‘അങ്ങയുടെ മകനായ’ എന്നു നിലനിർത്തി സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘അങ്ങയുടെ ദാസനായ’ എന്നു വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠത്തിലെ യഥാർഥ രൂപകം മായ്ച്ചുകളയാതെയും ബെൻ-ഹദദ് എലീശയുടെ ജൈവപുത്രനാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കിയും ഇരുവശവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എലീശയെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അദ്ദേഹം’, നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ എന്നിവ ഉപയോഗിച്ചു. ദീർഘമായ ചരക്കുവിവരണം വായനാസൗകര്യത്തിനായി വ്യാഖ്യാനചിഹ്നങ്ങൾക്കുള്ളിൽ നൽകിയെങ്കിലും എബ്രായത്തിലെ അനുബന്ധ വിശദീകരണബന്ധം നിലനിർത്തി.
