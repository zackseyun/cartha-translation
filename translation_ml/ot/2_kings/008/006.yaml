base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/006.yaml
  text: The king asked the woman, and she told him. Then the king appointed an official[a] for her, saying, “Restore everything that belongs to her, along with all the yield of the field from the day she left the land until now.”
translation:
  language: ml
  text: 'രാജാവ് ആ സ്ത്രീയോടു ചോദിച്ചു; അവൾ അദ്ദേഹത്തോടു കാര്യം വിവരിച്ചു. അപ്പോൾ രാജാവ് അവൾക്കുവേണ്ടി ഒരു ഉദ്യോഗസ്ഥനെ[a] നിയോഗിച്ച് അവനോടു പറഞ്ഞു: “അവൾക്കുള്ളതെല്ലാം, അവൾ ദേശം വിട്ടുപോയ ദിവസംമുതൽ ഇന്നുവരെ വയലിൽനിന്നു ലഭിച്ച വിളവെല്ലാം സഹിതം, അവൾക്കു തിരിച്ചുകൊടുക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഷണ്ഡനെ.’ ഈ രാജകീയ പദം അക്ഷരാർഥത്തിൽ ഷണ്ഡനെയോ പൊതുവായി ഒരു രാജോദ്യോഗസ്ഥനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל הַמֶּלֶךְ לָאִשָּׁה
  choice: രാജാവ് ആ സ്ത്രീയോടു ചോദിച്ചു
  rationale: സന്ദർഭത്തിൽ മുമ്പേ പരാമർശിക്കപ്പെട്ട ശൂനേംകാരിയായ സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്. אִשָּׁה എന്നത് ഇവിടെ വൈവാഹിക നിലയെക്കാൾ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സ്ത്രീ’ യോജിക്കുന്നു.
- source_word: וַתְּסַפֶּר לוֹ
  choice: അവൾ അദ്ദേഹത്തോടു വിവരിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള ספר നടന്ന കാര്യം വിവരിക്കുക/പറഞ്ഞുകേൾപ്പിക്കുക എന്ന ആശയം നൽകുന്നു; ‘വിവരിച്ചു’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ അർഥം വഹിക്കുന്നു.
- source_word: וַיִּתֶּן לָהּ הַמֶּלֶךְ סָרִיס אֶחָד
  choice: രാജാവ് അവൾക്കുവേണ്ടി ഒരു ഉദ്യോഗസ്ഥനെ നിയോഗിച്ചു
  rationale: ഉത്തരവ് നടപ്പാക്കാൻ രാജാവ് ഒരാളെ ചുമതലപ്പെടുത്തിയതാണു നിർമാണത്തിന്റെ ആശയം. סָרִיס രാജധാനിയിലെ ഉദ്യോഗസ്ഥനെയോ അക്ഷരാർഥത്തിൽ ഷണ്ഡനെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ പ്രവർത്തനപരമായ ‘ഉദ്യോഗസ്ഥൻ’ സ്വീകരിച്ച് മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָשֵׁיב אֶת כָּל אֲשֶׁר לָהּ
  choice: അവൾക്കുള്ളതെല്ലാം ... അവൾക്കു തിരിച്ചുകൊടുക്കുക
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം സ്വത്ത് തിരികെ നൽകാൻ കല്പിക്കുന്നു. ‘തിരിച്ചുകൊടുക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כָּל תְּבוּאֹת הַשָּׂדֶה
  choice: വയലിൽനിന്നു ലഭിച്ച വിളവെല്ലാം
  rationale: תְּבוּאָה കാർഷിക ഉൽപ്പന്നത്തെയോ വിളവിനെയോ സൂചിപ്പിക്കുന്നു. ബഹുവചനവും כָּל എന്ന സമഗ്രതയും ‘വിളവെല്ലാം’ വഴി പ്രകടമാക്കുന്നു.
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  choice: അവൾ ദേശം വിട്ടുപോയ ദിവസംമുതൽ ഇന്നുവരെ
  rationale: אֶרֶץ എന്നതിനെ പ്രദേശമോ രാജ്യമോ എന്നു അനാവശ്യമായി ചുരുക്കാതെ ‘ദേശം’ എന്നു നൽകുന്നു; കാലപരിധി മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
