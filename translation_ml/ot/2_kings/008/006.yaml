translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രു വാക്യത്തിന്റെ ഭരണപരവും കാർഷികവുമായ അർഥങ്ങൾ വ്യക്തമായി നിലനിർത്തി; סָרִיס എന്ന പദത്തിലെ യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
