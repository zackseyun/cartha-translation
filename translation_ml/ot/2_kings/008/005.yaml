  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
translation:
  language: ml
  text: 'അവൻ മരിച്ചവനെ എങ്ങനെ വീണ്ടും ജീവിപ്പിച്ചുവെന്ന്[a] രാജാവിനോടു വിവരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഇതാ, അവൻ മകനെ വീണ്ടും ജീവിപ്പിച്ച ആ സ്ത്രീ തന്റെ വീടിനും വയലിനും വേണ്ടി രാജാവിനോടു നിലവിളിച്ചുകൊണ്ടിരുന്നു. ഗേഹസി പറഞ്ഞു: “എന്റെ പ്രഭുവായ രാജാവേ, ഇതാ ആ സ്ത്രീ; എലീശാ വീണ്ടും ജീവിപ്പിച്ച അവളുടെ മകനും ഇതാ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീണ്ടും ജീവിപ്പിച്ചു’ എന്നതിന് ‘ജീവനിലേക്കു തിരികെ കൊണ്ടുവന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രുവിൽ ‘ജീവിക്കുക’ എന്ന ക്രിയയുടെ കാരകരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר לַמֶּלֶךְ
  choice: അവൻ ... രാജാവിനോടു വിവരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: וַיְהִי എന്ന ആഖ്യാനഘടനയും തുടർച്ചയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന מְסַפֵּר എന്ന കൃതന്തവും സ്വാഭാവികമായ മലയാള കാലസാഹചര്യവാക്യത്തിലൂടെ നൽകുന്നു.
- source_word: אֵת אֲשֶׁר הֶחֱיָה אֶת הַמֵּת
  choice: മരിച്ചവനെ എങ്ങനെ വീണ്ടും ജീവിപ്പിച്ചുവെന്ന്
  rationale: הֶחֱיָה എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘ജീവിക്കാൻ ഇടയാക്കുക/ജീവനിലേക്കു തിരികെ കൊണ്ടുവരുക’ എന്ന കാരകബലം ‘വീണ്ടും ജീവിപ്പിച്ചു’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; הַמֵּת ഏകവചനമായതിനാൽ ‘മരിച്ചവനെ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ആ സ്ത്രീ അതേ നിമിഷം പ്രത്യക്ഷപ്പെടുന്നതിലെ അപ്രതീക്ഷിതവും ശ്രദ്ധേയവുമായ യാദൃച്ഛികതയെ ഈ ആഖ്യാനസൂചകം പ്രകടമാക്കുന്നു.
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  choice: രാജാവിനോടു നീതിക്കായി നിലവിളിച്ചുകൊണ്ട്
  rationale: צעק സഹായത്തിനോ നീതിക്കോ വേണ്ടിയുള്ള ശക്തമായ നിലവിളിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭം സ്വത്തുവീണ്ടെടുപ്പിനായുള്ള അപേക്ഷയായതിനാൽ ‘നീതിക്കായി’ അർത്ഥം വ്യക്തമാക്കുന്നു, എന്നാൽ അതിനെ ഔദ്യോഗികമായ ‘അപേക്ഷിച്ചു’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  choice: തന്റെ വീടിനെയും വയലിനെയും സംബന്ധിച്ച്
  rationale: עַל അപേക്ഷയുടെ വിഷയത്തെ സൂചിപ്പിക്കുന്നു; שָׂדֶה എന്നതിന്റെ പ്രത്യേക അർത്ഥമായ ‘വയൽ’ നിലനിർത്തുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: യജമാനനായ രാജാവേ
  rationale: രാജസദസ്സിലെ ആദരപൂർവമായ സംബോധന മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: זֹאת הָאִשָּׁה וְזֶה בְּנָהּ
  choice: ഇതാ ആ സ്ത്രീ; ... അവളുടെ മകനും ഇതാ
  rationale: സന്നിഹിതരായ വ്യക്തികളെ ചൂണ്ടിക്കാണിക്കുന്ന ഹീബ്രു നിർദേശസർവനാമങ്ങളുടെ സജീവത നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  choice: എലീശാ വീണ്ടും ജീവിപ്പിച്ച
  rationale: വാക്യത്തിൽ ആവർത്തിക്കുന്ന അതേ ഹീബ്രു ക്രിയയ്ക്ക് ഒരേ മലയാള പ്രയോഗം ഉപയോഗിച്ച് പദസമന്വയം പാലിക്കുന്നു.
