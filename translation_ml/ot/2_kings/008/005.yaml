  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജസദസ്സിലെ സംബോധനയ്ക്ക് ഗൗരവം നിലനിർത്തി; സ്വത്തുസംബന്ധമായ സ്ത്രീയുടെ നിലവിളിയുടെ അടിയന്തരതയും ‘ഇതാ’ എന്ന ആഖ്യാനസൂചകത്തിന്റെ സജീവതയും സംരക്ഷിച്ചു.
