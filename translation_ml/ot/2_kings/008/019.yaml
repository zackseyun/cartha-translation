reference: 2 Kings 8:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֤ה יְהוָה֙ לְ/הַשְׁחִ֣ית אֶת יְהוּדָ֔ה לְמַ֖עַן דָּוִ֣ד עַבְדּ֑/וֹ כַּ/אֲשֶׁ֣ר אָֽמַר ל֗/וֹ לָ/תֵ֨ת ל֥/וֹ נִ֛יר לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
translation:
  language: ml
  text: എന്നിട്ടും, യഹോവ തന്റെ ദാസനായ ദാവീദിന്റെ നിമിത്തം യെഹൂദയെ നശിപ്പിക്കാൻ മനസ്സായില്ല. അവന്റെ പുത്രന്മാർക്കായി എല്ലാക്കാലത്തും അവന് ഒരു ദീപം നൽകുമെന്ന് അവനോടു പറഞ്ഞിരുന്നതുപോലെ ആയിരുന്നു അത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദീപം’ എന്നത് ദാവീദിന്റെ രാജവംശം തുടർന്നുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന രാജകീയ രൂപകമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: എന്നിട്ടും ... മനസ്സായില്ല
  rationale: മുൻസന്ദർഭത്തിലെ ന്യായവിധിയോടുള്ള വൈരുധ്യം ‘എന്നിട്ടും’ വ്യക്തമാക്കുന്നു; אָבָה വെറും ഭാവിനിഷേധമല്ല, മനസ്സോ സന്നദ്ധതയോ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ വ്യാപകമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു; പദവിനാമമാക്കി മാറ്റുന്നില്ല.
- source_word: לְהַשְׁחִית אֶת־יְהוּדָה
  choice: യെഹൂദയെ നശിപ്പിക്കാൻ
  rationale: ഹിഫീൽ രൂപം ഇവിടെ യെഹൂദയ്ക്കെതിരായ വിനാശകരമായ ന്യായവിധിയെ സൂചിപ്പിക്കുന്നു; ‘നശിപ്പിക്കുക’ സ്വാഭാവികവും ശക്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  choice: തന്റെ ദാസനായ ദാവീദിനെപ്രതി
  rationale: ദാവീദിനോടുള്ള പരിഗണനയും അവന്റെ ദാസസ്ഥാനവും സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: അവിടന്ന് അവനോടു പറഞ്ഞിരുന്നതുപോലെ
  rationale: മൂലത്തിലെ ‘പറഞ്ഞു’ എന്ന പദം നിലനിർത്തി, ഉടമ്പടിസന്ദർഭത്തിൽ അത് വാഗ്ദാനമായി പ്രവർത്തിക്കുന്നുവെന്നത് നിർബന്ധമായി വ്യാഖ്യാനിക്കാതെ വിടുന്നു.
- source_word: נִיר
  choice: ഒരു ദീപം
  rationale: ദാവീദിക രാജവംശത്തിന്റെ തുടർച്ചയെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ രാജകീയ രൂപകം നിലനിർത്തുന്നു.
- source_word: לְבָנָיו כָּל־הַיָּמִים
  choice: അവന്റെ പുത്രന്മാർക്കും എല്ലാക്കാലത്തും
  rationale: לְ എന്നതിന്റെ നേരിട്ടുള്ള ഗുണഭോക്തൃഭാവം നിലനിർത്തുന്നു; രാജകീയ അവകാശപരമ്പരയുടെ പുരുഷസന്ദർഭം കാരണം ‘പുത്രന്മാർ’ ഉപയോഗിക്കുന്നു. כָּל־הַיָּמִים എന്ന ഇടിയത്തിന്റെ ദീർഘകാല തുടർച്ച സ്വാഭാവിക മലയാളത്തിൽ ‘എല്ലാക്കാലത്തും’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: נִיר എന്ന ദാവീദിക വംശരൂപകം
  choice: ഒരു ദീപം
  alternative: ഒരു വെളിച്ചം; ഒരു രാജവംശം
  rationale: ‘ദീപം’ എന്ന മൂർത്തരൂപകം അന്തർപാഠബന്ധവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു; ‘രാജവംശം’ എന്നു മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിച്ചുമാറ്റുന്നില്ല.
- issue: ദൈവനാമമായ יהוה
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ദാവീദിനും പുത്രന്മാർക്കും ദീപം നൽകുന്നതിന്റെ ബന്ധം
  choice: ദാവീദിനും അവന്റെ പുത്രന്മാർക്കും
  alternative: അവന്റെ പുത്രന്മാരിലൂടെ
  rationale: ഹീബ്രുവിലെ ആവർത്തിത לְ രൂപങ്ങളെ അടുത്ത് പിന്തുടരുകയും ‘മുഖാന്തരം’ എന്ന ഉപകരണാർഥം അനാവശ്യമായി ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ദീർഘമായ ഹീബ്രു വാക്യം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ആവർത്തനത്തിലെ സൂചനകൾ വ്യക്തമാക്കാൻ ‘ദാവീദിനും’ എന്നു രണ്ടാം വാക്യത്തിൽ ചേർത്തു. മുഖ്യവാചകത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം കൃത്യമായി ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
