revisions:
- from: എന്നിട്ടും യഹോവ തന്റെ ദാസനായ ദാവീദിനെപ്രതി യെഹൂദയെ നശിപ്പിക്കാൻ മനസ്സായില്ല. ദാവീദിനും അവന്റെ പുത്രന്മാർക്കും എല്ലാക്കാലത്തും ഒരു ദീപം നൽകുമെന്ന് അവിടന്ന് അവനോടു പറഞ്ഞിരുന്നതുപോലെയായിരുന്നു അത്.[a]
  to: എന്നിട്ടും, യഹോവ തന്റെ ദാസനായ ദാവീദിന്റെ നിമിത്തം യെഹൂദയെ നശിപ്പിക്കാൻ മനസ്സായില്ല. അവന്റെ പുത്രന്മാർക്കായി എല്ലാക്കാലത്തും അവന് ഒരു ദീപം നൽകുമെന്ന് അവനോടു പറഞ്ഞിരുന്നതുപോലെ ആയിരുന്നു അത്.[a]
  rationale: 'The revision improves Malayalam idiom and, more importantly, preserves the Hebrew syntax and referents: Yahweh spoke to David and promised to give him a lamp for his sons throughout all days. The English audit trail’s footnote labeling is internally inconsistent, but the Malayalam footnote is correctly anchored to ‘ദീപം’ and requires no additional lexical-alternative note.'
