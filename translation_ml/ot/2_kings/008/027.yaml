  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
translation:
  language: ml
  text: അവൻ ആഹാബിന്റെ ഭവനത്തിന്റെ വഴിയിൽ നടന്നു; ആഹാബിന്റെ ഭവനത്തെപ്പോലെ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മ ചെയ്തു. കാരണം, അവൻ ആഹാബിന്റെ ഭവനത്തിലെ മരുമകനായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആഹാബിന്റെ ഭവനവുമായി വിവാഹബന്ധമുള്ളവനായിരുന്നു.” എബ്രായപദം വിവാഹത്തിലൂടെയുള്ള ബന്ധത്തെ കൂടുതൽ പൊതുവായി സൂചിപ്പിക്കാനും കഴിയും; ഇവിടെ “മരുമകൻ” എന്നതാണ് ഏറ്റവും നിർദിഷ്ടമായി യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: വഴിയിൽ നടന്നു
  rationale: പദപ്രയോഗം ജീവിതരീതിയെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലും രൂപകം നിലനിർത്തുന്നു.
- source_word: בֵּית אַחְאָב
  choice: ആഹാബിന്റെ ഭവനം
  rationale: കുടുംബത്തെയും രാജവംശത്തെയും ഉൾക്കൊള്ളാവുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: וַיַּעַשׂ הָרַע
  choice: തിന്മയായതു ചെയ്തു
  rationale: രാജാക്കന്മാരിൽ ആവർത്തിക്കുന്ന ധാർമിക വിലയിരുത്തൽസൂത്രത്തിന്റെ വസ്തുനിഷ്ഠ ഘടന നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിന്റെ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമത്തെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണത്തിലൂടെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: כְּבֵית אַחְאָב
  choice: ആഹാബിന്റെ ഭവനത്തെപ്പോലെ
  rationale: താരതമ്യത്തിന്റെ സംക്ഷിപ്തതയും കുടുംബ/രാജവംശ സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള ധാർമിക വിലയിരുത്തലിന് പിന്നാലെയുള്ള കാരണബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חֲתַן בֵּית אַחְאָב
  choice: ആഹാബിന്റെ ഭവനത്തിന്റെ മരുമകൻ
  rationale: חֲתַן എന്ന പദത്തിന്റെ ഇവിടെ ഏറ്റവും നിർദിഷ്ടമായ അർഥം നൽകുന്നു; വിവാഹബന്ധം പൊതുവായി സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായി വരുന്ന ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നൽകുന്നു.
- issue: ആഹാബിന്റെ ഭവനവുമായി ഉള്ള ബന്ധത്തിന്റെ നിർവചനം
  choice: മരുമകൻ
  alternative: വിവാഹബന്ധമുള്ളവൻ
  rationale: ചരിത്രസന്ദർഭത്തിലും പുല്ലിംഗ ഏകവചനത്തിലും ‘മരുമകൻ’ ഏറ്റവും യോജിക്കുന്നു; എങ്കിലും എബ്രായപദത്തിന്റെ വിശാലമായ വിവാഹബന്ധാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘വഴിയിൽ നടന്നു’, ‘ഭവനം’ എന്നീ ബൈബിൾ രൂപകങ്ങൾ കുടുംബം/രാജവംശം, ജീവിതരീതി എന്നീ അർഥവ്യാപ്തികൾ നിലനിർത്താൻ ഉപയോഗിച്ചു.
