source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חֲזָאֵ֔ל מַדּ֖וּעַ אֲדֹנִ֣/י בֹכֶ֑ה וַ/יֹּ֡אמֶר כִּֽי יָדַ֡עְתִּי אֵ֣ת אֲשֶׁר תַּעֲשֶׂה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֜ל רָעָ֗ה מִבְצְרֵי/הֶ֞ם תְּשַׁלַּ֤ח בָּ/אֵשׁ֙ וּ/בַחֻֽרֵי/הֶם֙ בַּ/חֶ֣רֶב תַּהֲרֹ֔ג וְ/עֹלְלֵי/הֶ֣ם תְּרַטֵּ֔שׁ וְ/הָרֹתֵי/הֶ֖ם תְּבַקֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/012.yaml
  text: 'Hazael said[a], “Why is my lord weeping?” And he said, “Because I know the evil that you will do to the sons of Israel: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces[b], and rip open their pregnant women.”'
translation:
  language: ml
  text: 'ഹസായേൽ ചോദിച്ചു: “എന്റെ യജമാനനേ, അങ്ങ് കരയുന്നത് എന്തിന്?” അദ്ദേഹം പറഞ്ഞു: “നീ ഇസ്രായേൽമക്കളോടു ചെയ്യാനിരിക്കുന്ന തിന്മ എനിക്കറിയാം. നീ അവരുടെ കോട്ടകൾക്കു തീയിടും; അവരുടെ യുവാക്കളെ വാളാൽ കൊല്ലും; അവരുടെ കൊച്ചുകുട്ടികളെ അടിച്ചുതകർക്കും; അവരുടെ ഗർഭിണികളുടെ വയർ പിളർക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: യജമാനനേ
  rationale: എലീശയോടുള്ള ആദരപൂർവമായ സംബോധനയാണ്; ദൈവിക ബിരുദമല്ല. ആ സാമൂഹിക ആദരവ് സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֹכֶה
  choice: കരയുന്നത്
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പങ്കുപദത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כִּי יָדַעְתִּי
  choice: എനിക്കറിയാം
  rationale: ഹസായേലിന്റെ ചോദ്യത്തിനുള്ള കാരണം വ്യക്തമാക്കുകയും, വർത്തമാനപ്രസക്തിയുള്ള ഹീബ്രു പൂർണ്ണക്രിയയുടെ അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോട്
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപവും ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന അർഥവും മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: רָעָה
  choice: തിന്മ
  rationale: തുടർന്ന് വിവരിക്കുന്ന ക്രൂരകൃതികളുടെ ധാർമിക ഗൗരവം ‘ദോഷം’ അല്ലെങ്കിൽ ‘ദുരന്തം’ എന്നതിനെക്കാൾ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ
  choice: അവരുടെ കോട്ടകൾക്കു തീയിടും
  rationale: അക്ഷരാർഥത്തിൽ ‘കോട്ടകളെ തീയിലേക്ക് അയയ്ക്കുക’ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: וּבַחֻרֵיהֶם
  choice: അവരുടെ യുവാക്കളെ
  rationale: യൗവനപ്രായത്തിലുള്ള പുരുഷന്മാരെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; യുദ്ധസന്ദർഭം വാളാൽ കൊല്ലുന്നതിൽനിന്നു വ്യക്തമാകുന്നു.
- source_word: בַּחֶרֶב תַּהֲרֹג
  choice: വാളാൽ കൊല്ലും
  rationale: ഹീബ്രുവിലെ ഉപകരണസൂചനയും പ്രവൃത്തിയുടെ നേരിട്ടുള്ള ക്രൂരതയും നിലനിർത്തുന്നു.
- source_word: עֹלְלֵיהֶם
  choice: അവരുടെ കൊച്ചുകുട്ടികളെ
  rationale: ശിശുക്കളെയോ വളരെ ചെറിയ കുട്ടികളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പരിധി അമിതമായി ചുരുക്കാതെ അവരുടെ നിസ്സഹായത പ്രകടമാക്കുന്നു.
- source_word: תְּרַטֵּשׁ
  choice: അടിച്ചുതകർക്കും
  rationale: യുദ്ധത്തിലെ ക്രൂരമായ ഇടിച്ചുതകർക്കലിനെ ശക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הָרֹתֵיהֶם תְּבַקֵּעַ
  choice: അവരുടെ ഗർഭിണികളുടെ വയർ പിളർക്കും
  rationale: ഗർഭിണികളെ പിളർക്കുക എന്ന ഹീബ്രുവിലെ ഭീകരമായ ദൃശ്യത്തെ euphemism ഇല്ലാതെ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽമക്കളോട്
  alternative: ഇസ്രായേൽജനത്തോട് / ഇസ്രായേല്യരോട്
  rationale: ഹീബ്രുവിലെ കുടുംബ-ജനതാ പ്രയോഗം നിലനിർത്തുന്നു; ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, ഇസ്രായേൽ ജനസമൂഹത്തെയാണ് സംയുക്തമായി സൂചിപ്പിക്കുന്നത്.
- issue: പ്രവചനവാക്കുകളിലെ തുറന്ന ക്രൂരത
  choice: അതിക്രമങ്ങളെ മറച്ചുവയ്ക്കാതെ വ്യക്തമായി പരിഭാഷപ്പെടുത്തുക
  alternative: ‘ഉപദ്രവിക്കും’ പോലുള്ള മൃദുവായ പൊതുപദങ്ങൾ ഉപയോഗിക്കുക
  rationale: മൂലപാഠം ഉദ്ദേശപൂർവം ഭീകരവും ധാർമികഭാരമുള്ളതുമാണ്; അതിന്റെ ആഘാതവും പ്രവചനത്തിലെ സംഘർഷവും മൃദൂകരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ശൈലി. ആദരസംബോധനയ്ക്ക് ‘അങ്ങ്’ ഉപയോഗിച്ചു; ക്രൂരത വിവരിക്കുന്ന പദങ്ങൾ മൂലപാഠത്തിന്റെ തീവ്രത അനാവശ്യമായി കൂട്ടാതെയും കുറയ്ക്കാതെയും നേരിട്ട് നൽകി.
