  yaml_path: translation/ot/2_kings/008/022.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
translation:
  language: ml
  text: അങ്ങനെ എദോം യെഹൂദയുടെ അധീനതയിൽനിന്ന് കലാപം നടത്തി; ഇന്നുവരെയും അങ്ങനെതന്നെ തുടരുന്നു.[a] അപ്പോൾ ലിബ്നയും കലാപം നടത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കലാപം നടത്തി” എന്നതിന് “മത്സരിച്ചു,” “വിമതമായി,” അല്ലെങ്കിൽ “വിട്ടുമാറി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ ഇവിടെ ഒരു ഭരണാധികാരത്തിനെതിരായ രാഷ്ട്രീയ കലാപത്തെയോ വേർപെടലിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: മത്സരിച്ച് ... സ്വതന്ത്രമായി നിലകൊള്ളുന്നു
  rationale: രാഷ്ട്രീയ ഭരണത്തിനെതിരായ കലാപവും അതിൽനിന്നുള്ള വേർപെടലും സൂചിപ്പിക്കുന്ന פשע എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള ‘ഇന്നുവരെ’ എന്ന പ്രയോഗത്തോടു ചേർന്ന് നിലനിൽക്കുന്ന ഫലവും പ്രകടമാക്കുന്നു.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: യെഹൂദയുടെ അധീനതയിൽനിന്ന്
  rationale: ‘യെഹൂദയുടെ കൈക്കീഴിൽനിന്ന്’ എന്ന എബ്രായ രൂപകം രാഷ്ട്രീയ അധികാരത്തെയും നിയന്ത്രണത്തെയും സൂചിപ്പിക്കുന്നു. ‘അധീനതയിൽനിന്ന്’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: എഴുത്തുകാരന്റെ കാലംവരെ ആ സ്ഥിതി തുടർന്നുവെന്ന സാധാരണ എബ്രായ കാലസൂത്രവാക്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: אָז
  choice: അക്കാലത്ത്
  rationale: തുടർന്നുള്ള സംഭവം അതേ ചരിത്രസമയത്താണ് നടന്നതെന്ന് സൂചിപ്പിക്കുന്നു; בָּעֵת הַהִיא എന്ന കാലപ്രയോഗത്തോടൊപ്പം മലയാളത്തിൽ ഒരൊറ്റ സ്വാഭാവിക പദപ്രയോഗമായി നൽകുന്നു.
- source_word: תִּפְשַׁע
  choice: മത്സരിച്ചു
  rationale: ആദ്യത്തെ פשע ക്രിയയോടുള്ള പദസാമ്യം നിലനിർത്തുകയും ഭരണത്തിനെതിരായ രാഷ്ട്രീയ കലാപം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לִבְנָה
  choice: ലിബ്ന
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בָּעֵת הַהִיא
  choice: അക്കാലത്ത്
  rationale: ലിബ്നയുടെ മത്സരത്തെ അതേ ചരിത്രകാലഘട്ടത്തിൽ സ്ഥാപിക്കുന്ന കാലപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
