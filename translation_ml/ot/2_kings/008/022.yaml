translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായയിലെ ‘കൈക്കീഴിൽ’ എന്ന രൂപകം അക്ഷരാർഥത്തിൽ നിലനിർത്താതെ അതിന്റെ രാഷ്ട്രീയ അർഥമായ ‘അധീനത’ ഉപയോഗിച്ചു. ആദ്യവാക്യത്തിലെ ക്രിയയ്ക്ക് ഫലാവസ്ഥ വ്യക്തമാക്കുന്ന ചെറിയ വിപുലീകരണം നൽകിയെങ്കിലും പാദക്കുറിപ്പിൽ പദത്തിന്റെ പരിഭാഷാസാധ്യതകൾ സംരക്ഷിച്ചു.
