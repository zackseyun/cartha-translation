    issue: The phrase “സ്വതന്ത്രമായി നിലകൊള്ളുന്നു” is an interpretive expansion.
    rationale: The Hebrew states Edom's rebellion/breakaway from Judah and its continuance “to this day”; it does not explicitly characterize Edom as “standing independently.” The added wording should be removed to retain source-level restraint.
