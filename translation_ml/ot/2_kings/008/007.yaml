  text: וַ/יָּבֹ֤א אֱלִישָׁע֙ דַּמֶּ֔שֶׂק וּ/בֶן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם חֹלֶ֑ה וַ/יֻּגַּד ל֣/וֹ לֵ/אמֹ֔ר בָּ֛א אִ֥ישׁ הָ/אֱלֹהִ֖ים עַד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
translation:
  language: ml
  text: പിന്നെ എലീശാ ദമസ്കോസിൽ വന്നു. അപ്പോൾ അരാമിന്റെ[a] രാജാവായ ബെൻ-ഹദദ് രോഗിയായിരുന്നു. “ദൈവപുരുഷൻ ഇവിടെ വന്നിരിക്കുന്നു” എന്ന് അദ്ദേഹത്തെ അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സിറിയയുടെ രാജാവ്.” എബ്രായപാഠത്തിൽ “അരാം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: പിന്നെ ... വന്നു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘പിന്നെ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אֱלִישָׁע
  choice: എലീശാ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: דַּמֶּשֶׂק
  choice: ദമസ്കോസ്
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം; വിഭക്തിയോടെ ‘ദമസ്കോസിൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: וּבֶן־הֲדַד
  choice: അപ്പോൾ ... ബെൻ-ഹദദ്
  rationale: വാവ് ഇവിടെ അടുത്ത സംഭവത്തേക്കാൾ പശ്ചാത്തലസാഹചര്യം അവതരിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: מֶלֶךְ אֲרָם
  choice: അരാമിന്റെ രാജാവ്
  rationale: മൂലപാഠത്തിലെ വംശ-ഭൂമിശാസ്ത്രനാമമായ ‘അരാം’ നിലനിർത്തുന്നു; പരമ്പരാഗതമായ ‘സിറിയ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: חֹלֶה
  choice: രോഗിയായിരുന്നു
  rationale: ബെൻ-ഹദദിന്റെ അന്നത്തെ അവസ്ഥ വ്യക്തമാക്കുന്ന വിധേയക കൃദന്തരൂപത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וַיֻּגַּד לוֹ
  choice: അദ്ദേഹത്തെ അറിയിച്ചു
  rationale: എബ്രായത്തിലെ കർമണിപ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ രൂപം ഉപയോഗിക്കുന്നു; അറിയിച്ച വ്യക്തിയെ മൂലപാഠം വ്യക്തമാക്കുന്നില്ല.
- source_word: לֵאמֹר
  choice: എന്ന്
  rationale: ഉദ്ധരണി അവതരിപ്പിക്കുന്ന എബ്രായ സൂത്രവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്ന്’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בָּא
  choice: വന്നിരിക്കുന്നു
  rationale: പൂർണക്രിയ ഇവിടെ സംഭവിച്ച വരവിന്റെയും ഇപ്പോഴത്തെ സാന്നിധ്യത്തിന്റെയും ഫലം സൂചിപ്പിക്കുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന എബ്രായ ബിരുദത്തിന്റെ രൂപവും ആഖ്യാനപ്രതിധ്വനിയും പരമാവധി നിലനിർത്തുന്നു.
- source_word: עַד הֵנָּה
  choice: ഇവിടെ
  rationale: സംസാരിക്കുന്നവന്റെ സ്ഥലത്തേക്കുള്ള വരവ് സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
