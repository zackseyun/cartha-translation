  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָֽיְתָה לּ֖/וֹ לְ/אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/018.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife, and he did what was evil in the eyes of Yahweh.
translation:
  language: ml
  text: അവൻ യിസ്രായേൽ രാജാക്കന്മാരുടെ വഴിയിൽ നടന്നു; ആഹാബിന്റെ ഭവനം ചെയ്തതുപോലെ. ആഹാബിന്റെ മകൾ അവന്റെ ഭാര്യയായിരുന്നു. അവൻ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: വഴിയിൽ നടന്നു
  rationale: ജീവിതരീതിയെയോ പെരുമാറ്റമാതൃകയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്. മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന ‘വഴിയിൽ നടന്നു’ എന്ന രൂപം മൂലത്തിലെ രൂപകം നിലനിർത്തുന്നു.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽരാജാക്കന്മാർ
  rationale: വടക്കൻ രാജ്യത്തിലെ രാജാക്കന്മാരെ പെരുമാറ്റത്തിന്റെ മാതൃകയായി സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ബന്ധപ്രയോഗം.
- source_word: בֵּית אַחְאָב
  choice: ആഹാബിന്റെ രാജവംശക്കാർ
  rationale: രാജകീയ പശ്ചാത്തലത്തിൽ בַּיִת എന്നത് കുടുംബത്തെയോ രാജവംശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘രാജവംശക്കാർ’ എന്നത് കെട്ടിടമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും עָשׂוּ എന്ന ബഹുവചന ക്രിയയോട് സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: അവൻ ആഹാബിന്റെ രാജവംശത്തിന്റെ മാതൃക പിന്തുടർന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: בַּת אַחְאָב
  choice: ആഹാബിന്റെ മകൾ
  rationale: എബ്രായത്തിലെ ബന്ധനിർമാണത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: അവന്റെ ഭാര്യയായിരുന്നു
  rationale: ‘അവന് ഭാര്യയായി ഉണ്ടായിരുന്നു’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ നിലവിലുള്ള വിവാഹബന്ധത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ രൂപമാണ് വ്യക്തവും സ്വാഭാവികവും.
- source_word: וַיַּעַשׂ הָרַע
  choice: തിന്മയായതു ചെയ്തു
  rationale: നിശ്ചയാർഥകമായ הָרַע എന്ന രൂപത്തെ പ്രതിഫലിപ്പിക്കുകയും രാജാക്കന്മാരുടെ പുസ്തകങ്ങളിലെ പതിവ് ധാർമ്മിക വിലയിരുത്തൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യരൂപകം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ദൃഷ്ടിയിൽ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ സവിശേഷ ഉടമ്പടിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ, അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ഉച്ചാരണസമീപമായ രൂപത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘വഴിയിൽ നടന്നു’ എന്ന മൂലരൂപകം നിലനിർത്തിയപ്പോൾ, ‘ആഹാബിന്റെ രാജവംശക്കാർ’ എന്ന് നൽകി രാജകീയ ‘ഭവനം’ എന്ന ആശയം സാധാരണ വായനക്കാരന് വ്യക്തമായി അവതരിപ്പിച്ചു.
