  choice: അവന്റെ കാലത്ത്
  rationale: രാജാവിന്റെ ഭരണകാലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
