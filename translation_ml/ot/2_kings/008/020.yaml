translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. രാഷ്ട്രീയ അധീനതയെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ‘കൈക്കീഴിൽ’ എന്ന ഉപമ പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചു; അടിക്കുറിപ്പിൽ അതിന്റെ ചലനാത്മക അർഥം വ്യക്തമാക്കി.
