source:
  edition: WLC
  text: בְּ/יָמָי/ו֙ פָּשַׁ֣ע אֱד֔וֹם מִ/תַּ֖חַת יַד יְהוּדָ֑ה וַ/יַּמְלִ֥כוּ עֲלֵי/הֶ֖ם מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/020.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: ml
  text: അവന്റെ കാലത്ത് എദോം യെഹൂദയുടെ കൈക്കീഴിൽനിന്ന് കലാപം ചെയ്തു; അവർ തങ്ങൾക്കു രാജാവായി ഒരാളെ നിയമിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അർഥവ്യക്തമായി: “എദോം യെഹൂദയുടെ ആധിപത്യത്തിൽനിന്ന് കലാപം നടത്തി.” എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “യെഹൂദയുടെ കൈക്കീഴിൽനിന്ന് കലാപം ചെയ്തു” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
