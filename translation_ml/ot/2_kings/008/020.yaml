revisions:
- from: അവന്റെ കാലത്ത് എദോം യെഹൂദയുടെ കൈക്കീഴിൽനിന്ന് മത്സരിച്ച് തങ്ങൾക്കായി ഒരു രാജാവിനെ വാഴിച്ചു.[a]
  to: അവന്റെ കാലത്ത് എദോം യെഹൂദയുടെ കൈക്കീഴിൽനിന്ന് കലാപം ചെയ്തു; അവർ തങ്ങൾക്കു രാജാവായി ഒരാളെ നിയമിച്ചു.[a]
  rationale: The revision preserves the Hebrew idiom ‘from under the hand of Judah,’ uses an unambiguous modern Malayalam expression for political rebellion, and renders the Hiphil construction as appointing a person as king for/over the Edomites. The footnote gives the dynamic political sense without adding an unnecessary assertion of independence.
