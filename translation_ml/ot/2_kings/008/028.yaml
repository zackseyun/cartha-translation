  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും എബ്രായരൂപങ്ങളോട് സുതാര്യമായി ചേർന്ന് നിൽക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ‘മുറിവേൽപ്പിച്ചു’, ‘അരാമ്യർ’ എന്നീ ഘടകങ്ങൾക്ക് പിന്നാലെ ക്രമീകരിച്ചിരിക്കുന്നു.
