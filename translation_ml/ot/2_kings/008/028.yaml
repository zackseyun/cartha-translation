  text: וַ/יֵּ֜לֶךְ אֶת יוֹרָ֣ם בֶּן אַחְאָ֗ב לַ/מִּלְחָמָ֛ה עִם חֲזָהאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמֹ֣ת גִּלְעָ֑ד וַ/יַּכּ֥וּ אֲרַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/028.yaml
  text: He went with Joram son of Ahab to war against Hazael king of Aram at Ramoth-gilead[b][a], and the Arameans wounded Joram.
translation:
  language: ml
  text: അവൻ ആഹാബിന്റെ മകനായ യോരാമിനോടൊപ്പം അരാമിന്റെ രാജാവായ ഹസായേലിനെതിരെ രാമോത്ത്-ഗിലെയാദിൽ യുദ്ധത്തിനു പോയി. അരാമ്യർ[b] യോരാമിനെ മുറിവേൽപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യോരാമിനെ പ്രഹരിച്ചു.’ എബ്രായക്രിയയ്ക്ക് പൊതുവായി ‘പ്രഹരിക്കുക’ എന്നർത്ഥവും വരാം; എന്നാൽ യുദ്ധസന്ദർഭവും സമാന്തരവിവരണവും ഇവിടെ മരണത്തെയല്ല, പരിക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി ‘സിറിയാരാജാവ്’ എന്നും ‘സിറിയക്കാർ’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്; എബ്രായമൂലത്തിൽ ‘അരാം’ എന്നും ‘അരാമ്യർ’ എന്നുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അവൻ ... പോയി
  rationale: הלך എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനരൂപം; സൈനികസന്ദർഭം തുടർന്നുള്ള പദങ്ങൾ വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവികമായ ‘പോയി’ മതിയാകുന്നു.
- source_word: אֶת יוֹרָם
  choice: യോരാമിനോടൊപ്പം
  rationale: הלך എന്ന ക്രിയയ്ക്കു ശേഷം אֵת സഹഗമനത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘യോരാമിനോടൊപ്പം’ എന്നതാണ് അർത്ഥസുതാര്യമായ മലയാളം.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധത്തിനു
  rationale: യുദ്ധത്തിൽ പങ്കെടുക്കാനായി പോകുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗം.
- source_word: עִם חֲזָהאֵל
  choice: ഹസായേലിനെതിരെ
  rationale: עִם സാധാരണയായി ‘കൂടെ’ എന്നാണെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ എതിർപക്ഷത്തോടുള്ള പോരാട്ടം സൂചിപ്പിക്കുന്നു.
- source_word: מֶלֶךְ אֲרָם
  choice: അരാംരാജാവായ
  rationale: പരമ്പരാഗതമായ ‘സിറിയ’ എന്നതിനുപകരം എബ്രായ ജനഭൂമിശാസ്ത്രനാമമായ ‘അരാം’ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְּרָמֹת גִּלְעָד
  choice: ഗിലെയാദിലെ രാമോത്തിൽ
  rationale: യുദ്ധം നടന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രദേശബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന രൂപം.
- source_word: וַיַּכּוּ
  choice: മുറിവേൽപ്പിച്ചു
  rationale: נכה എന്നതിന് പൊതുവായി ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്നർത്ഥമുണ്ടെങ്കിലും യുദ്ധസന്ദർഭവും തുടർന്നുള്ള വിവരണവും ഇവിടെ പരിക്കേൽപ്പിച്ചതാണെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: אֲרַמִּים
  choice: അരാമ്യർ
  rationale: അരാം ജനതയെ സൂചിപ്പിക്കുന്ന ബഹുവചന ജനനാമം; ‘അരാം’ എന്ന ഭൂനാമവുമായി പൊരുത്തപ്പെടുന്നു.
- source_word: יוֹרָם
  choice: യോരാം
  rationale: ഈ വാക്യത്തിലെ എബ്രായരൂപമായ יוֹרָם നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
