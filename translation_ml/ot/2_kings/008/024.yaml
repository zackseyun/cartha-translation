  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
translation:
  language: ml
  text: യോരാം[b] തന്റെ പിതാക്കന്മാരോടൊപ്പം കിടന്നു[a]; അവനെ ദാവീദിന്റെ നഗരത്തിൽ അവന്റെ പിതാക്കന്മാരോടൊപ്പം അടക്കം ചെയ്തു. അവന്റെ മകൻ അഹസ്യാവ് അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘തന്റെ പിതാക്കന്മാരോടൊപ്പം കിടന്നു.’ രാജാവിന്റെ മരണത്തെ അറിയിക്കാൻ ഹീബ്രുവിൽ ഉപയോഗിക്കുന്ന പതിവുപ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: യോരാം എന്ന പേര് ചില വിവർത്തനങ്ങളിൽ ‘യെഹോരാം’ എന്നും നൽകിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: ശാഖവ് എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കിടക്കുക’ എന്നാണ്; ഇവിടെ രാജാവിന്റെ മരണത്തെ അറിയിക്കുന്ന പതിവുശൈലിയിലാണ് അത് ഉപയോഗിച്ചിരിക്കുന്നത്. മലയാളത്തിൽ ‘നിദ്രപ്രാപിച്ചു’ ആ മരണസൂചന നിലനിർത്തുകയും ‘മരിച്ചു’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടൊപ്പം
  rationale: രാജവംശപരമായ പതിവുപ്രയോഗത്തിന്റെ കുടുംബബന്ധവും ആവർത്തനവും നിലനിർത്തുന്നു; ‘പൂർവികർ’ എന്നത് സ്വാഭാവികമായ മറ്റൊരു സാധ്യതയാണെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: וַיִּקָּבֵר
  choice: അവനെ ... അടക്കം ചെയ്തു
  rationale: ഹീബ്രു നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּעִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരത്തിൽ
  rationale: അംഗീകൃതമായ സ്ഥലനാമപ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: അധികാരാവകാശത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘രാജാവായി’ എന്നത് സ്വാഭാവികമാണ്; രാജഭരണത്തിന്റെ തുടർച്ചയെ അടുത്തുള്ള ‘അവനു പകരം’ വ്യക്തമാക്കുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: രാജകീയ പിന്തുടർച്ചയിൽ ‘അവന്റെ സ്ഥാനത്ത്’ എന്ന അർഥം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יוֹרָם
  choice: യോരാം
  rationale: ഹീബ്രു പാഠത്തിലെ യോറാം എന്ന രൂപത്തെ നേരിട്ട് പിന്തുടരുന്നു; ചില പാരമ്പര്യങ്ങളിൽ കാണുന്ന ‘യെഹോരാം’ എന്ന വികസിതരൂപത്തിലേക്ക് ഏകീകരിക്കുന്നില്ല.
- source_word: אֲחַזְיָהוּ
  choice: അഹസ്യാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിക്കുന്നു.
