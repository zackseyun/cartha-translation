  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יִּקַּ֤ח הַ/מַּכְבֵּר֙ וַ/יִּטְבֹּ֣ל בַּ/מַּ֔יִם וַ/יִּפְרֹ֥שׂ עַל פָּנָ֖י/ו וַ/יָּמֹ֑ת וַ/יִּמְלֹ֥ךְ חֲזָהאֵ֖ל תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/015.yaml
  text: And it happened on the next day that he took the covering cloth[a], dipped it in water, and spread it over his face, and he died[b]. Then Hazael reigned in his place.
translation:
  language: ml
  text: പിറ്റേന്ന് അവൻ ആ മൂടിത്തുണി[a] എടുത്ത് വെള്ളത്തിൽ മുക്കി, അവന്റെ മുഖത്തിന്മേൽ വിരിച്ചു; അവൻ മരിച്ചു.[b] പിന്നെ ഹസായേൽ അവന്റെ സ്ഥാനത്ത് രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കിടക്കവിരി,’ ‘പുതപ്പ്,’ അല്ലെങ്കിൽ ‘നെയ്ത/വലപോലുള്ള തുണി’ എന്നും വരാം; എബ്രായപദം അപൂർവമായതിനാൽ ഏതു തരത്തിലുള്ള തുണിയാണെന്ന് കൃത്യമായി അറിയില്ല.
    reason: lexical_alternative
  - marker: b
    text: ഈ പ്രവൃത്തികൾ ചെയ്തത് ആരാണെന്ന് എബ്രായപാഠം പേരെടുത്ത് പറയുന്നില്ല. സന്ദർഭത്തിൽ അത് ഹസായേൽ ആണെന്ന് പലരും മനസ്സിലാക്കുന്നു; എന്നാൽ അവസാന ഉപവാക്യത്തിൽ ഹസായേലിന്റെ പേര് പറയുന്നതുവരെ മൂലപാഠം മൂന്നാംപുരുഷ ഏകവചനരൂപം മാത്രമാണ് ഉപയോഗിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: പിറ്റേന്ന്
  rationale: മുൻവിവരിച്ച സംഭവങ്ങളുടെ അടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: הַמַּכְבֵּר
  choice: ആ മൂടുതുണി
  rationale: അപൂർവമായ എബ്രായപദം ഒരു മൂടുപടമോ നെയ്ത തുണിയോ സൂചിപ്പിക്കുന്നു; കൃത്യമായ ഇനം അനിശ്ചിതമായതിനാൽ ‘പുതപ്പ്’ പോലുള്ള അതിവിശദമായ പദം ഒഴിവാക്കി പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന പൊതുപദം തിരഞ്ഞെടുത്തു.
- source_word: וַיִּטְבֹּל בַּמַּיִם
  choice: വെള്ളത്തിൽ മുക്കി
  rationale: മുക്കുക അഥവാ നിമജ്ജനം ചെയ്യുക എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ വിവർത്തനം.
- source_word: וַיִּפְרֹשׂ עַל־פָּנָיו
  choice: അയാളുടെ മുഖത്തിന്മേൽ വിരിച്ചു
  rationale: വിരിക്കുക/പരത്തുക എന്ന ഭൗതികപ്രവൃത്തി നിലനിർത്തുന്നു. മലയാളത്തിൽ രണ്ട് പുരുഷ സർവനാമങ്ങൾ ഉപയോഗിച്ച് പ്രവർത്തകനെയും മരണപ്പെട്ട വ്യക്തിയെയും വേർതിരിച്ചറിയാൻ സഹായിക്കുന്നു, പേരുകൾ ചേർക്കാതെ മൂലപാഠത്തിലെ അനിശ്ചിതത്വം കാക്കുന്നു.
- source_word: וַיָּמֹת
  choice: അയാൾ മരിച്ചു
  rationale: എബ്രായത്തിലെ ലളിതമായ ആഖ്യാനതുടർച്ചയായ ‘അവൻ മരിച്ചു’ എന്നത് കാരണം സൂചിപ്പിക്കുന്ന അധികബന്ധം ചേർക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  choice: പിന്നെ ഹസായേൽ അയാൾക്കു പകരം രാജാവായി
  rationale: രാജ്യാധികാരത്തിലേക്കുള്ള പിന്‍ഗാമിത്വം വ്യക്തമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പിന്നെ’ ആഖ്യാനത്തിന്റെ പുരോഗതി കാണിക്കുന്നു.
theological_decisions:
- issue: ‘എടുത്തു,’ ‘മുക്കി,’ ‘വിരിച്ചു’ എന്നീ ക്രിയകളുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: പ്രധാനപാഠത്തിൽ കർത്താവിനെ പേരുകൊണ്ട് തിരിച്ചറിയാതെ ‘അവൻ’ എന്നു നിലനിർത്തി
  alternative: കർത്താവ് ഹസായേൽ ആണെന്ന് പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുക
  rationale: എബ്രായ ക്രിയാരൂപങ്ങളിൽ കർത്താവ് ഉൾക്കൊള്ളുന്നുണ്ടെങ്കിലും ഈ വാക്യത്തിൽ പേര് പറയുന്നില്ല; അവസാന ഉപവാക്യത്തിലാണ് ഹസായേലിന്റെ പേര് പ്രത്യക്ഷപ്പെടുന്നത്. സന്ദർഭത്തിൽ കർത്താവ് ഹസായേൽ ആണെന്ന് പലരും മനസ്സിലാക്കുന്നുവെങ്കിലും മൂലപാഠത്തേക്കാൾ കൂടുതൽ ഉറപ്പ് വിവർത്തനത്തിൽ ചേർക്കാതിരിക്കാൻ അനിശ്ചിതത്വം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അവൻ’ എന്നത് വ്യക്തമാക്കാത്ത പ്രവർത്തകനും ‘അയാൾ’ എന്നത് മുഖം മൂടപ്പെട്ട് മരിച്ച വ്യക്തിക്കും ഉപയോഗിച്ച് മലയാളത്തിൽ ആവശ്യമായ പരാമർശവ്യത്യാസം വരുത്തിയെങ്കിലും ആരുടെയും പേര് മുൻകൂട്ടി ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
