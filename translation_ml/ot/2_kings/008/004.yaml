id: 2KI.8.4
reference: 2 Kings 8:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/מֶּ֗לֶךְ מְדַבֵּר֙ אֶל גֵּ֣חֲזִ֔י נַ֥עַר אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹ֑ר סַפְּרָ/ה נָּ֣א לִ֔/י אֵ֥ת כָּל הַ/גְּדֹל֖וֹת אֲשֶׁר עָשָׂ֥ה אֱלִישָֽׁע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/004.yaml
  text: The king was speaking with Gehazi[a], the servant of the man of God, saying, “Please tell me all the great things that Elisha has done.”
translation:
  language: ml
  text: 'രാജാവ് ദൈവപുരുഷന്റെ ശുശ്രൂഷകനായ[a] ഗേഹസിയോടു സംസാരിക്കുകയായിരുന്നു: “എലീശാ ചെയ്ത സകല മഹാകാര്യങ്ങളും ദയവായി എനിക്കു വിവരിച്ചുതരൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവപുരുഷന്റെ പരിചാരകൻ’ എന്നോ ‘ദൈവപുരുഷന്റെ യുവാവ്’ എന്നോ വിവർത്തനം ചെയ്യാം; നַעַר എന്ന ഹീബ്രുപദം സന്ദർഭമനുസരിച്ച് ശുശ്രൂഷകൻ, പരിചാരകൻ, യുവാവ് എന്നീ അർഥങ്ങൾ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֵּר
  choice: സംസാരിക്കുകയായിരുന്നു
  rationale: ഹീബ്രു കർത്തൃവാചക ക്രിയാവിശേഷണം ഇവിടെ പശ്ചാത്തലത്തിൽ നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ഭൂതകാല തുടർച്ചാരൂപം സ്വീകരിച്ചു.
- source_word: גֵּחֲזִי
  choice: ഗേഹസി
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: נַעַר
  choice: ശുശ്രൂഷകൻ
  rationale: ഈ സന്ദർഭത്തിൽ ഗേഹസിക്ക് ദൈവപുരുഷനോടുള്ള ഔദ്യോഗിക ബന്ധമാണ് പ്രധാനമായും സൂചിപ്പിക്കുന്നത്. എന്നാൽ യുവാവ്, പരിചാരകൻ എന്നീ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ഹീബ്രു വിശേഷണം അതിന്റെ രൂപകവും പദപ്രയോഗവും സംരക്ഷിച്ചുകൊണ്ട് വിവർത്തനം ചെയ്തു.
- source_word: סַפְּרָה נָּא לִי
  choice: ദയവായി എനിക്കു വിവരിച്ചുതരൂ
  rationale: ספר എന്ന ആജ്ഞയുടെ ‘വിവരിക്കുക/വിവരിച്ചുപറയുക’ എന്ന അർഥവും נָא നൽകുന്ന വിനയപൂർവമായ അഭ്യർഥനാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: כָּל הַגְּדֹלוֹת
  choice: സകല മഹാകാര്യങ്ങളും
  rationale: വിശേഷണം നാമവൽക്കരിച്ചാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; പ്രവൃത്തികളുടെ സ്വഭാവം അതിരുകടന്ന് നിർവചിക്കാതെ അവയുടെ മഹത്ത്വം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: עָשָׂה
  choice: ചെയ്ത
  rationale: എലീശാ നിർവഹിച്ച പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു സമ്പൂർണക്രിയയ്ക്ക് സ്വാഭാവികമായ മലയാള ഭൂതകാലബന്ധരൂപം ഉപയോഗിച്ചു.
- source_word: וְהַמֶּלֶךְ
  choice: രാജാവ്
  rationale: ആദ്യത്തെ waw ആഖ്യാനബന്ധം വഹിക്കുന്നു; മലയാളത്തിൽ സന്ദർഭമില്ലാതെ അധികമായ ‘ഇപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായി വാക്യം ആരംഭിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. നേരിട്ടുള്ള ഉദ്ധരണിക്ക് മുമ്പുള്ള ഹീബ്രു לֵאמֹר മലയാളത്തിൽ അനാവശ്യമായി ‘എന്നു പറഞ്ഞുകൊണ്ട്’ ആവർത്തിക്കാതെ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
