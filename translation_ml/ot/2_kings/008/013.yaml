  text: וַ/יֹּ֣אמֶר חֲזָהאֵ֔ל כִּ֣י מָ֤ה עַבְדְּ/ךָ֙ הַ/כֶּ֔לֶב כִּ֣י יַעֲשֶׂ֔ה הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע הִרְאַ֧/נִי יְהוָ֛ה אֹתְ/ךָ֖ מֶ֥לֶךְ עַל אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
translation:
  language: ml
  text: 'ഹസായേൽ പറഞ്ഞു: “എന്നാൽ, ഈ വലിയ കാര്യം ചെയ്യാൻ അങ്ങയുടെ ദാസനായ ഈ നായ എന്തുള്ളവനാണ്?” എലീശാ പറഞ്ഞു: “യഹ്‌വേ എനിക്കു കാണിച്ചുതന്നിരിക്കുന്നു: നീ അരാമിന്മേൽ രാജാവാകും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അരാമിന്റെ രാജാവ്”; എബ്രായത്തിൽ അക്ഷരാർഥം “അരാമിന്മേൽ രാജാവ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי מָה
  choice: എന്നാൽ ... എന്തുള്ളവനാണ്
  rationale: സന്ദർഭത്തിലെ ഹസായേലിന്റെ അവിശ്വാസവും എതിർപ്പിന്റെ ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: നിയമപരമായ അടിമസ്ഥിതി നിർബന്ധമായി സൂചിപ്പിക്കാതെ, ആദരപൂർവമായ സ്വയംതാഴ്ത്തൽ നിലനിർത്തുന്നു.
- source_word: הַכֶּלֶב
  choice: ഈ നായയായ
  rationale: എബ്രായത്തിലെ ശക്തമായ സ്വയംനിന്ദയുടെ രൂപകം ഉപമയാക്കി മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: כִּי יַעֲשֶׂה
  choice: ചെയ്യാൻ
  rationale: ഇത്ര വലിയ പ്രവൃത്തി ചെയ്യാൻ താൻ ആരാണെന്ന അവിശ്വാസപൂർവമായ വാചാടോപചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കഴിവോ ഭാവികാലമോ മാത്രം എന്നു തീർപ്പാക്കുന്നില്ല.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: ഈ വലിയ കാര്യം
  rationale: דבר എന്ന പദത്തിന്റെ കാര്യം/പ്രവൃത്തി എന്ന വിശാലതയും גדול എന്നതിന്റെ വലുപ്പമോ ഗൗരവമോ സംബന്ധിച്ച തുറന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: הִרְאַנִי
  choice: എനിക്കു കാണിച്ചുതന്നിരിക്കുന്നു
  rationale: ലഭിച്ച വെളിപ്പാടിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി വ്യക്തമാക്കുന്ന പൂർത്തികൃത്യഭാവം നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പൊതുപദവിയാൽ പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: מֶלֶךְ עַל אֲרָם
  choice: അരാമിന്മേൽ രാജാവ്
  rationale: עַל എന്നതിന്റെ ‘മേൽ’ എന്ന നേരിട്ടുള്ള ബന്ധം നിലനിർത്തുകയും അֲרָם എന്ന പുരാതന സ്ഥലനാമം ‘അരാം’ ആയി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ ആധാരമാക്കി ലിപ്യന്തരം ചെയ്തു.
- issue: മֶלֶךְ עַל אֲרָם എന്ന ഭരണബന്ധം
  choice: അരാമിന്മേൽ രാജാവ്
  alternative: അരാമിന്റെ രാജാവ്
  rationale: രാജത്വത്തിന്റെ സ്വഭാവത്തെ അധികമായി വ്യാഖ്യാനിക്കാതെ എബ്രായത്തിലെ עַל എന്ന പൂർവപ്രത്യയത്തിന്റെ രൂപം സംരക്ഷിച്ചു; സാധാരണ മലയാളപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ഹസായേലിന്റെ സ്വയംനിന്ദയും അവിശ്വാസവും മയപ്പെടുത്താതെ, എന്നാൽ അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കി. ‘വലിയ കാര്യം’ എന്നത് സന്ദർഭത്തിൽ ഭീകരപ്രവൃത്തികളെ സൂചിപ്പിച്ചാലും, മൂലത്തിലെ പദത്തിന്റെ മൂല്യനിർണയപരമായ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
