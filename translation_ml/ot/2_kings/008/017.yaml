  variant: modern standard Malayalam
source:
  edition: WLC
  text: בֶּן שְׁלֹשִׁ֥ים וּ/שְׁתַּ֛יִם שָׁנָ֖ה הָיָ֣ה בְ/מָלְכ֑/וֹ וּ/שְׁמֹנֶ֣ה שנה מָלַ֖ךְ בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/017.yaml
  text: He was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: ml
  text: അവൻ രാജാവായപ്പോൾ അവന് മുപ്പത്തിരണ്ടു വയസ്സായിരുന്നു. അവൻ യെരൂശലേമിൽ എട്ടു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: മുപ്പത്തിരണ്ടു വയസ്സായിരുന്നു
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ അക്ഷരാർഥത്തിലുള്ള ‘മകൻ’ എന്നല്ല, സ്വാഭാവികമായ മലയാള പ്രായപ്രയോഗമായി പരിഭാഷപ്പെടുത്തി.
- source_word: הָיָה בְמָלְכוֹ
  choice: അവൻ രാജാവായപ്പോൾ
  rationale: രാജഭരണം ആരംഭിച്ച സമയത്തെ സൂചിപ്പിക്കുന്ന ഘടനയെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וּשְׁמֹנֶה שנה
  choice: എട്ടു വർഷം
  rationale: ഭരണകാലത്തിന്റെ കൃത്യമായ ദൈർഘ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: രാജാവെന്ന പദവി വഹിച്ചതിലുപരി രാജഭരണം നടത്തിയെന്ന ക്രിയാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: ഭരണത്തിന്റെ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സ്ഥാനസൂചക മുൻപ്രത്യയത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു വാക്യത്തിലെ രണ്ടു ഘടകങ്ങൾ മലയാളത്തിലെ സ്വാഭാവികമായ രണ്ടു വാക്യങ്ങളായി നൽകിയിരിക്കുന്നു.
