translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ സൈനിക പശ്ചാത്തലവും ദുഷ്കരമായ സ്ഥലനാമവായനയും സംരക്ഷിച്ചു; ‘തോൽപ്പിച്ചു’ പോലുള്ള ഫലം അതിരുകടന്ന് വ്യക്തമാക്കുന്ന ഭാഷ ഒഴിവാക്കി.
