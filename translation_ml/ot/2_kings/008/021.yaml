base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
translation:
  language: ml
  text: അങ്ങനെ യോരാം തന്റെ എല്ലാ രഥങ്ങളുമായി സായീരിലേക്കു[a] കടന്നുചെന്നു. പിന്നെ അവൻ രാത്രിയിൽ എഴുന്നേറ്റ് തന്നെ വളഞ്ഞിരുന്ന എദോമ്യരെയും രഥസേനാധിപന്മാരെയും ആക്രമിച്ചു; എന്നാൽ ജനം തങ്ങളുടെ കൂടാരങ്ങളിലേക്കു ഓടിപ്പോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സേയീരിലേക്കു’ എന്നും വായിക്കാം. צָעִירָה എന്ന എബ്രായ സ്ഥലനാമം ദുഷ്കരമാണ്; ചിലർ ഇതിനെ വേറിട്ട സായീർ എന്ന സ്ഥലനാമമായല്ല, സേയീർ/എദോം എന്ന പേരുമായി ബന്ധപ്പെട്ട ഒരു രൂപമായാണ് മനസ്സിലാക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ‘തങ്ങളുടെ കൂടാരങ്ങളിലേക്കു ഓടിപ്പോയി’ എന്നത് അവർ ചിതറിപ്പിരിഞ്ഞ് സ്വന്തം വീടുകളിലേക്കു മടങ്ങി എന്നർഥമുള്ള ഒരു എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: കടന്നുചെന്നു
  rationale: സൈനികനീക്കത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘കടക്കുക/കടന്നുപോകുക’ എന്ന അടിസ്ഥാനാർഥം സ്വാഭാവികമായി നൽകുന്നു; യാത്രാമാർഗത്തെക്കുറിച്ച് അനാവശ്യ നിഗമനം ചേർക്കുന്നില്ല.
- source_word: צָעִירָה
  choice: സായീരിലേക്കു
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങളെ അനുസരിച്ച് ഇതിനെ സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു. സേയീർ/എദോം എന്ന പേരുമായി ബന്ധമുള്ള ദുഷ്കരമായ വായനയാകാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: הָרֶכֶב
  choice: രഥങ്ങൾ
  rationale: ഈ പദത്തിന് രഥസേനയെ കൂട്ടമായി സൂചിപ്പിക്കാമെങ്കിലും, ‘രഥങ്ങൾ’ എന്നത് എബ്രായ രൂപത്തോട് അടുത്തതും മലയാളത്തിൽ വ്യക്തവുമാണ്.
- source_word: קָם לַיְלָה
  choice: രാത്രിയിൽ എഴുന്നേറ്റ്
  rationale: രാത്രിയിലെ നടപടിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ക്രമവും അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּכֶּה
  choice: ആക്രമിച്ചു
  rationale: נכה എന്ന പദത്തിന്റെ പ്രഹരിക്കുക/ആക്രമിക്കുക എന്ന വിശാലമായ സൈനിക അർഥം നൽകുന്നു; സമ്പൂർണമായി തോൽപ്പിച്ചു എന്ന ഫലം അനാവശ്യമായി പ്രസ്താവിക്കുന്നില്ല.
- source_word: אֱדוֹם הַסֹּבֵיב אֵלָיו
  choice: തന്നെ വളഞ്ഞിരുന്ന എദോമ്യർ
  rationale: എദോം എന്ന ജനനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചന ജനസൂചനയായി നൽകി, അവനെ ചുറ്റിവളഞ്ഞിരുന്നെന്ന സൈനിക ചിത്രം നിലനിർത്തുന്നു.
- source_word: שָׂרֵי הָרֶכֶב
  choice: രഥസേനാധിപന്മാർ
  rationale: രഥസേനയുടെ മേൽനോട്ടമുള്ള സൈനിക അധികാരികളെ സംക്ഷിപ്തവും വ്യക്തവുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּנָס הָעָם לְאֹהָלָיו
  choice: ജനം തങ്ങളുടെ കൂടാരങ്ങളിലേക്കു ഓടിപ്പോയി
  rationale: הָעָם എന്ന വിശാലമായ ‘ജനം’ എന്ന പദവും ‘കൂടാരങ്ങളിലേക്കു’ എന്ന എബ്രായ ചിത്രവും സംരക്ഷിക്കുന്നു; അതിന്റെ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
