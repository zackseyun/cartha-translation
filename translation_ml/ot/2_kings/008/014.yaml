  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
translation:
  language: ml
  text: 'അങ്ങനെ അവൻ എലീശായുടെ അടുക്കൽനിന്ന് പോയി തന്റെ യജമാനന്റെ അടുക്കൽ ചെന്നു. യജമാനൻ അവനോട്, “എലീശാ നിന്നോട് എന്തു പറഞ്ഞു?” എന്നു പറഞ്ഞു. അവൻ മറുപടി പറഞ്ഞു: “എലീശാ എന്നോടു, ‘അങ്ങ് തീർച്ചയായും സുഖം പ്രാപിക്കും’ എന്നു പറഞ്ഞു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങ് നിശ്ചയമായും ജീവിക്കും.” ഹീബ്രുവിൽ ഊന്നലിനായി ക്രിയ ആവർത്തിച്ചിരിക്കുന്നു; അക്ഷരാർഥം “ജീവിച്ചുതന്നെ ജീവിക്കും” എന്നാണ്. ഈ സന്ദർഭത്തിൽ അത് രോഗത്തിൽനിന്നുള്ള സുഖപ്രാപ്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  choice: അവൻ എലീശായുടെ അടുക്കൽനിന്നു പോയി
  rationale: הלך എന്ന ക്രിയയും מֵאֵת എന്ന വേർപാടുസൂചക പ്രയോഗവും ചേർന്നുള്ള യാത്രാവിവരണം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ അടുക്കൽ ചെന്നു
  rationale: בוא + אֶל എന്നത് എത്തിച്ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു; אֲדֹנָיו ഇവിടെ ദൈവിക പദവിയല്ല, ഹസായേലിന്റെ മേലധികാരിയായ രാജാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מָה אָמַר לְךָ אֱלִישָׁע
  choice: എലീശാ നിന്നോട് എന്തു പറഞ്ഞു?
  rationale: ഹീബ്രു ചോദ്യത്തിന്റെ ക്രമവും അർഥവും ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: אָמַר לִי
  choice: അദ്ദേഹം എന്നോടു പറഞ്ഞു
  rationale: ആദരസൂചകമായ മൂന്നാംപുരുഷ സർവനാമം രാജാവിനോട് എലീശായെപ്പറ്റി പറയുന്ന രാജസഭാസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: חָיֹה תִחְיֶה
  choice: അങ്ങ് തീർച്ചയായും സുഖം പ്രാപിക്കും
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് + ഇംപർഫെക്റ്റ് ആവർത്തനം ഉറപ്പിനെ ഊന്നുന്നു. രോഗസന്ദർഭത്തിൽ ‘ജീവിക്കും’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ‘സുഖം പ്രാപിക്കും’ ഉദ്ദേശ്യാർഥം വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֲדֹנָיו എന്നതിന്റെ ദൈവേതര രാജസഭാപരമായ അർഥം
  choice: തന്റെ യജമാനൻ
  alternative: തന്റെ നാഥൻ
  rationale: ഇവിടെ ഈ പദം ഹസായേലിന്റെ മനുഷ്യനായ മേലധികാരിയെ സൂചിപ്പിക്കുന്നു. ‘യജമാനൻ’ ദൈവിക ബിരുദമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും സാമൂഹികബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: חָיֹה תִחְיֶה എന്ന ഊന്നൽപ്രയോഗം
  choice: അങ്ങ് തീർച്ചയായും സുഖം പ്രാപിക്കും
  alternative: അങ്ങ് നിശ്ചയമായും ജീവിക്കും
  rationale: മുഖ്യപാഠം രോഗമുക്തിയുടെ സന്ദർഭാർഥം നൽകുന്നു; ‘ജീവിച്ചുതന്നെ ജീവിക്കും’ എന്ന ഹീബ്രു രൂപത്തിന്റെ അക്ഷരാർഥവും ഊന്നലും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി വ്യാഖ്യാനപരമായ സുതാര്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു; സംഭാഷണത്തിന്റെ വ്യക്തതയ്ക്കായി നീണ്ട ഹീബ്രു സംയുക്തവാക്യം മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി.
