  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. കഥനത്തിന്റെ അനുക്രമവും ‘പരദേശി’ എന്ന സാമൂഹിക സൂക്ഷ്മതയും സംരക്ഷിച്ചിരിക്കുന്നു; അനാവശ്യമായ മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
