  yaml_path: translation/ot/2_kings/008/002.yaml
  text: So the woman arose and did according to the word of the man of God. She went[a], she and her household, and lived as a foreign resident in the land of the Philistines for seven years.
translation:
  language: ml
  text: അപ്പോൾ ആ സ്ത്രീ എഴുന്നേറ്റ് ദൈവപുരുഷൻ പറഞ്ഞതനുസരിച്ച് ചെയ്തു. അവളും അവളുടെ വീട്ടുകാരും പോയി ഫെലിസ്ത്യരുടെ ദേശത്ത് ഏഴു വർഷം പരദേശിയായി താമസിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പരമ്പരാഗതമായി: ‘ഫെലിസ്ത്യരുടെ ദേശത്ത് ഏഴു വർഷം പരദേശവാസം ചെയ്തു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ അനുക്രമകഥനരൂപം സ്ത്രീയുടെ ഉടനെയുള്ള പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു; ‘എഴുന്നേറ്റ്’ ആ ക്രമവും മിതമായ ഔപചാരികതയും നിലനിർത്തുന്നു.
- source_word: וַתַּעַשׂ כִּדְבַר
  choice: പറഞ്ഞതനുസരിച്ച് ചെയ്തു
  rationale: ഒരാളുടെ വാക്കോ നിർദേശമോ അനുസരിച്ച് പ്രവർത്തിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: ദൈവത്താൽ നിയോഗിക്കപ്പെട്ട പ്രവാചകനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബൈബിൾ പദവിയുടെ സുതാര്യമായ പരിഭാഷയാണിത്.
- source_word: וַתֵּלֶךְ הִיא וּבֵיתָהּ
  choice: അവളും അവളുടെ വീട്ടുകാരും പോയി
  rationale: בַּיִת ഇവിടെ കെട്ടിടത്തെയല്ല, അവളുടെ കുടുംബത്തെയോ ഗൃഹാംഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ഹീബ്രുവിലെ ‘അവൾ, അവളുടെ ഭവനവും’ എന്ന ഊന്നൽ ഈ വാക്യഘടന നിലനിർത്തുന്നു.
- source_word: וַתָּגָר
  choice: പരദേശിയായി താമസിച്ചു
  rationale: גור സാധാരണ താമസത്തെക്കാൾ, സ്വന്തം ദേശത്തിനു പുറത്തു സ്ഥിരാവകാശമില്ലാത്ത വിദേശവാസിയുടെ നിലയിൽ പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ ദേശത്ത്
  rationale: ജനവിഭാഗത്തെയും അവരുടെ ദേശത്തെയും വ്യക്തമാക്കുന്ന ഹീബ്രു ഘടന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: שֶׁבַע שָׁנִים
  choice: ഏഴു വർഷം
  rationale: താമസത്തിന്റെ ദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
