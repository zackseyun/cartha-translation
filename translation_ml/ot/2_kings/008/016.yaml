id: 2KI.8.16
reference: 2 Kings 8:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת חָמֵ֗שׁ לְ/יוֹרָ֤ם בֶּן אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה מָלַ֛ךְ יְהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
translation:
  language: ml
  text: ഇസ്രായേൽരാജാവായ അഹാബിന്റെ മകൻ യോരാമിന്റെ വാഴ്ചയുടെ അഞ്ചാം ആണ്ടിൽ, യെഹൂദാരാജാവായ യെഹോശാഫാത്ത് വാഴുമ്പോൾ[a], യെഹോശാഫാത്തിന്റെ മകൻ യെഹോരാം[b] യെഹൂദാരാജാവായി വാഴാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യെഹൂദാരാജാവായ യെഹോശാഫാത്തും.” എബ്രായ വാക്യഭാഗം സംക്ഷിപ്തമാണ്; ഇത് സഹഭരണത്തിന്റെ ഒരു കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: എബ്രായ പാഠം ഇസ്രായേൽരാജാവിന്റെ പേര് “യോരാം” എന്നും യെഹോശാഫാത്തിന്റെ മകനായ യെഹൂദാരാജാവിന്റെ പേര് “യെഹോരാം” എന്നും വ്യത്യസ്ത രൂപങ്ങളിൽ നൽകുന്നു; ഈ രണ്ടു പേരുകളും അടുത്ത ബന്ധമുള്ള രൂപങ്ങളാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת חָמֵשׁ
  choice: വാഴ്ചയുടെ അഞ്ചാം ആണ്ടിൽ
  rationale: സംയോജകവും കാലസൂചകമായ മുൻപ്രത്യയവും രാജവാഴ്ചയുടെ വർഷം പരിചയപ്പെടുത്തുന്നു. സ്വാഭാവിക മലയാളത്തിലെ ക്രമസംഖ്യ ഉപയോഗിച്ച് രാജകാലഗണന വ്യക്തമാക്കുന്നു.
- source_word: לְ/יוֹרָם בֶּן אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ അഹാബിന്റെ മകൻ യോരാമിന്റെ
  rationale: യോരാമിന്റെ രാജവാഴ്ചയെ അടിസ്ഥാനമാക്കിയുള്ള വർഷഗണനയും പിതൃനാമവും രാജപദവിയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ യെഹോശാഫാത്ത് വാഴുമ്പോൾ
  rationale: ക്രിയയില്ലാത്തതും സംക്ഷിപ്തവുമായ എബ്രായ വാക്യഭാഗത്തെ സ്വാഭാവികമായ കാലസാഹചര്യമായി അവതരിപ്പിക്കുന്നു; സഹഭരണം എന്ന് മുഖ്യപാഠത്തിൽ നിർണയിക്കുന്നില്ല.
- source_word: מָלַךְ
  choice: വാഴാൻ തുടങ്ങി
  rationale: രാജവാഴ്ചാസൂചനകളിൽ ഈ ക്രിയ സിംഹാസനാരോഹണം അഥവാ ഭരണാരംഭം സൂചിപ്പിക്കുന്നു; മുഴുവൻ ഭരണകാലത്തെയും സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ആരംഭഭാവം വ്യക്തമാക്കുന്നു.
- source_word: יְהוֹרָם
  choice: യെഹോരാം
  rationale: ഈ വാക്യത്തിലെ യെഹൂദാരാജാവിന്റെ എബ്രായ നാമരൂപം ഇസ്രായേൽരാജാവായ יוֹרָם (യോരാം) എന്ന രൂപത്തിൽനിന്ന് വേർതിരിച്ച് നിലനിർത്തുന്നു.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: യെഹോശാഫാത്തിന്റെ മകൻ … യെഹൂദാരാജാവായി
  rationale: പിതൃനാമവും യെഹൂദയുടെ രാജാവെന്ന അന്തിമ തിരിച്ചറിയലും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യെഹോശാഫാത്തിന്റെ ഭരണവും യെഹോരാമിന്റെ ഭരണാരംഭവും ഉൾപ്പെടുന്ന സംക്ഷിപ്ത കാലക്രമവാക്യം
  choice: “യെഹോശാഫാത്ത് വാഴുമ്പോൾ” എന്ന കാലസൂചക രൂപം ഉപയോഗിച്ചു; സഹഭരണം എന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിയില്ല.
  alternative: “യെഹൂദാരാജാവായ യെഹോശാഫാത്തും” എന്ന് കൂടുതൽ അക്ഷരാർഥത്തിൽ നൽകുക, അല്ലെങ്കിൽ സഹഭരണമാണെന്ന് വ്യാഖ്യാനിച്ച് തുറന്നുപറയുക.
  rationale: എബ്രായ പാഠം സഹഭരണം എന്ന് നേരിട്ട് പറയുന്നില്ല. കാലസൂചക വിവർത്തനം വായനാസൗകര്യം നൽകുമ്പോഴും വിശാലമായ കാലക്രമപ്രശ്നത്തിന് സിദ്ധാന്തപരമായ പരിഹാരം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. രാജകാലഗണന വ്യക്തമായി നൽകുകയും മൂലപാഠത്തിലെ പേരുവ്യത്യാസവും കാലക്രമത്തിലെ സംക്ഷിപ്തതയും സംരക്ഷിക്കുകയും ചെയ്തു.
