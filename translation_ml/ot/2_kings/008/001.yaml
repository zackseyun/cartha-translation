  text: וֶ/אֱלִישָׁ֡ע דִּבֶּ֣ר אֶל הָ/אִשָּׁה֩ אֲשֶׁר הֶחֱיָ֨ה אֶת בְּנָ֜/הּ לֵ/אמֹ֗ר ק֤וּמִי וּ/לְכִי֙ אתי וּ/בֵיתֵ֔/ךְ וְ/ג֖וּרִי בַּ/אֲשֶׁ֣ר תָּג֑וּרִי כִּֽי קָרָ֤א יְהוָה֙ לָֽ/רָעָ֔ב וְ/גַם בָּ֥א אֶל הָ/אָ֖רֶץ שֶׁ֥בַע שָׁנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
translation:
  language: ml
  text: 'എലീശാ തന്റെ മകനെ ജീവനിലേക്കു തിരികെ കൊണ്ടുവന്ന സ്ത്രീയോടു പറഞ്ഞിരുന്നു: “നീയും നിന്റെ വീട്ടുകാരും എഴുന്നേറ്റു പോകുക; നിനക്കു താമസിക്കാവുന്നിടത്തെല്ലാം താമസിക്കുക.[a] കാരണം യഹോവ ക്ഷാമത്തെ വിളിച്ചുവരുത്തിയിരിക്കുന്നു; അത് ഏഴു വർഷത്തേക്ക് ദേശത്തിന്മേൽ വന്നിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “താമസിക്കുക” എന്നതിന് “താത്കാലികമായി പാർക്കുക” അല്ലെങ്കിൽ “പരദേശിയായി വസിക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ആവർത്തിക്കുന്ന എബ്രായ ക്രിയയായ גור, സ്വന്തം സ്ഥിരവാസസ്ഥലത്തിനു പുറത്തു താത്കാലിക താമസക്കാരനായി കഴിയുന്നതിനെ പലപ്പോഴും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר
  choice: പറഞ്ഞിരുന്നു
  rationale: ചുറ്റുമുള്ള ആഖ്യാനസംഭവങ്ങൾക്കു മുമ്പ് ഈ വാക്കുകൾ പറഞ്ഞതാണെന്ന സന്ദർഭസൂചന മലയാളത്തിലെ പൂർവഭൂതകാലരൂപം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר הֶחֱיָה אֶת־בְּנָהּ
  choice: താൻ ജീവനിലേക്കു തിരികെ കൊണ്ടുവന്ന മകന്റെ അമ്മയായ
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരണാർഥവും മുൻപ് മരിച്ച മകനെ ജീവിപ്പിച്ച സംഭവവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: קוּמִי וּלְכִי אַתִּי וּבֵיתֵךְ
  choice: നീയും നിന്റെ വീട്ടുകാരും എഴുന്നേറ്റു പോകുക
  rationale: സ്ത്രീയോടുള്ള ഏകവചന കല്പനയും בַּיִת എന്ന പദത്തിന്റെ കുടുംബാംഗങ്ങൾ എന്ന സാമൂഹിക അർഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  choice: നിങ്ങൾക്കു താമസിക്കാൻ കഴിയുന്നിടത്ത് താത്കാലികമായി പാർക്കുക
  rationale: גור എന്ന ആവർത്തിത ക്രിയയിലെ സ്വന്തം നാട്ടിനു പുറത്തുള്ള താത്കാലിക വാസത്തിന്റെ സൂചന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അസ്വാഭാവികമായ പദാവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: כִּי קָרָא יְהוָה לָרָעָב
  choice: കാരണം യഹോവ ക്ഷാമത്തെ വിളിച്ചുവരുത്തിയിരിക്കുന്നു
  rationale: קרא ל എന്ന പ്രയോഗത്തിലെ വിളിക്കുക/വരുത്തുക എന്ന രൂപകവും ദൈവിക പ്രവർത്തനശേഷിയും സംരക്ഷിക്കുന്നു.
- source_word: וְגַם בָּא אֶל־הָאָרֶץ שֶׁבַע שָׁנִים
  choice: അത് ഏഴു വർഷത്തേക്ക് ദേശത്തിന്മേൽ വരുകയും ചെയ്യുന്നു
  rationale: ക്ഷാമം ദേശത്തിന്മേൽ വരുന്നു എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; പ്രവചനസന്ദർഭത്തിലെ പൂർത്തീകരണനിശ്ചയം മലയാളത്തിൽ സ്വാഭാവികമായ വർത്തമാനരൂപത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ദീർഘകാലമായി പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ നൽകുന്നു.
- issue: ക്ഷാമവുമായി ബന്ധപ്പെട്ട ദൈവിക പ്രവർത്തനം
  choice: യഹോവ ക്ഷാമത്തെ വിളിച്ചുവരുത്തിയിരിക്കുന്നു
  alternative: യഹോവ ക്ഷാമം പ്രഖ്യാപിച്ചിരിക്കുന്നു
  rationale: קרא ל എന്നതിലെ ‘വിളിക്കുക/വിളിച്ചുവരുത്തുക’ എന്ന വ്യക്തിവൽക്കരിച്ച ഭാഷ സംരക്ഷിക്കുന്നു; ദൈവം വെറും അറിയിപ്പ് നൽകിയതാണെന്നോ ക്ഷാമത്തിന്റെ എല്ലാ ഇടനിലകാരണങ്ങളും പ്രത്യേകം നിർവചിക്കുന്നുവെന്നോ ചേർത്തുപറയുന്നില്ല.
- issue: בָּא എന്ന പൂർത്തക്രിയയുടെ കാലസൂചന
  choice: വരുകയും ചെയ്യുന്നു
  alternative: വന്നിരിക്കുന്നു
  rationale: സംഭാഷണസമയത്ത് ക്ഷാമം ഇനിയും ആരംഭിക്കാനിരിക്കാമെന്ന സന്ദർഭവും എബ്രായ പൂർത്തക്രിയ നൽകുന്ന സംഭവത്തിന്റെ നിശ്ചയത്വവും ഒരുമിച്ച് മാനിക്കുന്നു; അതിനെ നിർബന്ധമായി കഴിഞ്ഞ സംഭവമോ ലളിതഭാവിയോ ആക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘എഴുന്നേറ്റു പോകുക’ എന്നത് കല്പനയുടെ അടിയന്തരത നിലനിർത്തുന്നു; ‘വീട്ടുകാർ’ സാധാരണ വായനക്കാർക്ക് ‘ഭവനം’ എന്നതിനെക്കാൾ ഉദ്ദേശിച്ച കുടുംബസമൂഹത്തെ വ്യക്തമായി അറിയിക്കുന്നു.
