revisions:
- from: 'എലീശാ താൻ ജീവനിലേക്കു തിരികെ കൊണ്ടുവന്ന മകന്റെ അമ്മയായ സ്ത്രീയോടു പറഞ്ഞിരുന്നു: “നീയും നിന്റെ വീട്ടുകാരും എഴുന്നേറ്റു പോകുക; നിങ്ങൾക്കു താമസിക്കാൻ കഴിയുന്നിടത്ത് താത്കാലികമായി പാർക്കുക.[a] കാരണം യഹോവ ക്ഷാമത്തെ വിളിച്ചുവരുത്തിയിരിക്കുന്നു; അത് ഏഴു വർഷത്തേക്ക് ദേശത്തിന്മേൽ വരുകയും ചെയ്യുന്നു.”'
  to: 'എലീശാ തന്റെ മകനെ ജീവനിലേക്കു തിരികെ കൊണ്ടുവന്ന സ്ത്രീയോടു പറഞ്ഞിരുന്നു: “നീയും നിന്റെ വീട്ടുകാരും എഴുന്നേറ്റു പോകുക; നിനക്കു താമസിക്കാവുന്നിടത്തെല്ലാം താമസിക്കുക.[a] കാരണം യഹോവ ക്ഷാമത്തെ വിളിച്ചുവരുത്തിയിരിക്കുന്നു; അത് ഏഴു വർഷത്തേക്ക് ദേശത്തിന്മേൽ വന്നിരിക്കുന്നു.”'
  rationale: The revision removes an unnatural and redundant identification of the woman, simplifies the residence command while retaining the lexical nuance in the anchored footnote, and renders the final Hebrew perfect with Malayalam perfect aspect. No doctrinal interpretation has been added.
