id: 2KI.8.11
reference: 2 Kings 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲמֵ֥ד אֶת פָּנָ֖י/ו וַ/יָּ֣שֶׂם עַד בֹּ֑שׁ וַ/יֵּ֖בְךְּ אִ֥ישׁ הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/011.yaml
  text: And he fixed his gaze and stared until he was ashamed[a], and the man of God wept.
translation:
  language: ml
  text: അവൻ തന്റെ മുഖം ഉറപ്പിച്ചുനിർത്തി, ലജ്ജ തോന്നുന്നതുവരെ അങ്ങനെതന്നെ നിന്നു[a]. ദൈവപുരുഷൻ കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹസായേലിന് ലജ്ജ തോന്നുന്നതുവരെ.” ആർക്കാണ് ലജ്ജ തോന്നിയതെന്ന് എബ്രായപാഠം വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת־פָּנָיו
  choice: തന്റെ മുഖം അനക്കാതെ നിർത്തി
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ ‘മുഖത്തെ ഉറപ്പിച്ചു നിർത്തുക’ എന്ന ആശയവും എബ്രായത്തിലെ ‘മുഖം’ എന്ന ദൃശ്യബിംബവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּשֶׂם
  choice: ഉറ്റുനോക്കി
  rationale: അക്ഷരാർഥമായ ‘വെച്ചു/സ്ഥാപിച്ചു’ എന്നതിനെക്കാൾ, മുൻവാക്യത്തോടു ചേർന്നുള്ള സ്ഥിരമായ നോട്ടത്തിന്റെ സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עַד־בֹּשׁ
  choice: ലജ്ജ തോന്നുന്നതുവരെ
  rationale: בוש എന്ന ക്രിയയിലെ ലജ്ജയുടെയോ അസ്വസ്ഥതയുടെയോ ആശയം നൽകുന്നു; ആർക്കാണ് ലജ്ജ തോന്നിയതെന്ന അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּבְךְּ
  choice: കരഞ്ഞു
  rationale: בכה എന്നതിന്റെ നേരിട്ടുള്ള അർഥം; സന്ദർഭത്തിന്റെ ഗൗരവത്തിന് യോജിച്ച സാധാരണ മലയാളപ്രയോഗം.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനായ എലീശായ്ക്കുള്ള മൂലപാഠത്തിലെ പതിവുപദവി വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: עַד־בֹּשׁ എന്നതിൽ ലജ്ജ അനുഭവിക്കുന്ന വ്യക്തി ആരെന്ന അവ്യക്തത
  choice: പ്രധാനപാഠത്തിൽ ‘ലജ്ജ തോന്നുന്നതുവരെ’ എന്നു നൽകി വ്യക്തിയുടെ പേര് ചേർക്കാതിരിക്കുന്നു.
  alternative: ‘ഹസായേലിന് ലജ്ജ തോന്നുന്നതുവരെ’ അല്ലെങ്കിൽ ‘എലീശായ്ക്ക് ലജ്ജ തോന്നുന്നതുവരെ’.
  rationale: എബ്രായപാഠം ലജ്ജ അനുഭവിക്കുന്ന വ്യക്തിയെ ഇംഗ്ലീഷിലും മലയാളത്തിലും പതിവായി പ്രതീക്ഷിക്കുന്നത്ര വ്യക്തമായി നിർദേശിക്കുന്നില്ല. അതിനാൽ ഹസായേലിനെയോ എലീശായെയോ പ്രധാനപാഠത്തിൽ നിർബന്ധമായി നിശ്ചയിക്കാതെ യഥാർഥ വ്യാഖ്യാനസാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുഖം അനക്കാതെ നിർത്തി’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ ‘മുഖം’ എന്ന ബിംബം സംരക്ഷിക്കുമ്പോൾ, ‘ഉറ്റുനോക്കി’ പ്രവർത്തിയുടെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
