- from: അവൻ തന്റെ മുഖം അനക്കാതെ നിർത്തി, ലജ്ജ തോന്നുന്നതുവരെ ഉറ്റുനോക്കി[a]. ദൈവപുരുഷൻ കരഞ്ഞു.
  to: അവൻ തന്റെ മുഖം ഉറപ്പിച്ചുനിർത്തി, ലജ്ജ തോന്നുന്നതുവരെ അങ്ങനെതന്നെ നിന്നു[a]. ദൈവപുരുഷൻ കരഞ്ഞു.
