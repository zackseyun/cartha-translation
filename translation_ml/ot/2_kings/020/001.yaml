source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּבֹ֣א אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
translation:
  language: ml
  text: 'ആ കാലത്ത് ഹിസ്കീയാവിനു രോഗം പിടിപെട്ട് അവൻ മരണാസന്നനായി. അപ്പോൾ ആമോത്സിന്റെ മകനായ യെശയ്യാ പ്രവാചകൻ അവന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘നിന്റെ വീട്ടുകാര്യങ്ങൾ ക്രമത്തിലാക്കുക; നീ മരിക്കാൻ പോകുകയാണ്[a], നീ ജീവിച്ചിരിക്കുകയില്ല.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദശഃ: “നീ മരിച്ചുകൊണ്ടിരിക്കുകയാണ്” അല്ലെങ്കിൽ “നീ മരിച്ചവനാണ്.” എബ്രായപ്രയോഗം ഉറപ്പുള്ള, ആസന്നമായ മരണത്തെ പ്രഖ്യാപിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: ആ കാലത്ത്
  rationale: കഥയുടെ സമയപശ്ചാത്തലം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: ഹിസ്കീയാവിനു രോഗം പിടിപെട്ട് അവൻ മരണാസന്നനായി
  rationale: חָלָה എന്നതിലെ രോഗം വരുന്നതിന്റെ ഭാവവും לָמוּת സൂചിപ്പിക്കുന്ന മരണസമീപമായ ഗുരുതരാവസ്ഥയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: ആമോത്സിന്റെ മകനായ യെശയ്യാ പ്രവാചകൻ
  rationale: പേര്, പിതൃപരാമർശം, പ്രവാചകപദവി എന്നിവയെല്ലാം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം സ്വീകരിക്കുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ ഔപചാരിക പ്രഖ്യാപനശൈലി നിലനിർത്തുകയും ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: צַו לְבֵיתֶךָ
  choice: നിന്റെ വീട്ടുകാര്യങ്ങൾ ക്രമത്തിലാക്കുക
  rationale: മരണത്തിനു മുമ്പായി കുടുംബത്തെയും ഗൃഹകാര്യങ്ങളെയും സംബന്ധിച്ച ആവശ്യമായ നിർദേശങ്ങളും ക്രമീകരണങ്ങളും ചെയ്യുക എന്ന പ്രയോഗാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּי מֵת אַתָּה
  choice: നീ മരിക്കാൻ പോകുകയാണ്
  rationale: പദശഃ ‘നീ മരിക്കുന്നവനാണ്/മരിച്ചവനാണ്’ എന്ന ഘടന ഇവിടെ ഉറപ്പും ആസന്നതയും ഉള്ള മരണപ്രഖ്യാപനമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ പൂർത്തിയായ മരണം തെറ്റായി സൂചിപ്പിക്കാതെ ആ ബലം നൽകുന്നു.
- source_word: וְלֹא תִחְיֶה
  choice: നീ ജീവിച്ചിരിക്കുകയില്ല
  rationale: തുടർന്നുള്ള ജീവൻ നേരിട്ട് നിഷേധിക്കുന്ന മൂലവാക്യത്തെ ‘സുഖപ്പെടുകയില്ല’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പരിചിതവും മൂലരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- issue: മരണപ്രഖ്യാപനത്തിന്റെ കാലഭാവം
  choice: നീ മരിക്കാൻ പോകുകയാണ്
  alternative: നീ മരിക്കുന്നു; നീ മരിക്കും; നീ മരിച്ചവനാണ്
  rationale: מֵת എന്ന രൂപത്തിലെ പദശഃ ഉള്ള സംഘർഷം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചുകൊണ്ട്, സന്ദർഭത്തിൽ അത് പൂർത്തിയായ മരണമല്ല, ഉറപ്പുള്ള ആസന്നമരണമാണ് പ്രഖ്യാപിക്കുന്നതെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പ്രവാചകപ്രഖ്യാപനത്തിന് ആവശ്യമായ ഔപചാരികത നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കി.
