  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി. ഉറവിടത്തിൽ ഇല്ലാത്ത ആരംഭകാലസൂചകപദം ചേർത്തിട്ടില്ല. അലങ്കാരപ്രശ്നവും ജലനിർമാണവുമായി ബന്ധപ്പെട്ട പദങ്ങളുടെ അർഥവ്യാപ്തിയും നിലനിർത്തിയിരിക്കുന്നു.
