  text: וְ/יֶ֨תֶר דִּבְרֵ֤י חִזְקִיָּ֨הוּ֙ וְ/כָל גְּב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר עָשָׂ֗ה אֶת הַ/בְּרֵכָה֙ וְ/אֶת הַ/תְּעָלָ֔ה וַ/יָּבֵ֥א אֶת הַ/מַּ֖יִם הָ/עִ֑ירָ/ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: The rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: ഹിസ്കീയാവിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവന്റെ സകല പരാക്രമവും, അവൻ കുളവും[a] ജലവാഹിനിയും[b] ഉണ്ടാക്കി വെള്ളം നഗരത്തിനകത്തേക്ക് കൊണ്ടുവന്നതും[c]—അവയെല്ലാം യെഹൂദാരാജാക്കന്മാരുടെ വൃത്താന്തപുസ്തകത്തിൽ എഴുതിയിട്ടില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജലസംഭരണി’; എബ്രായപദം നിർമിച്ച ജലസംഭരണിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ജലച്ചാൽ’; എബ്രായപദം വെള്ളം ഒഴുകുന്നതിനായി നിർമിച്ച ചാലിനെയോ ജലമാർഗത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഇത് യെരൂശലേമിലെ ഹിസ്കീയാവിന്റെ പ്രസിദ്ധമായ ജലനിർമാണപ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നതാകാം; 2 ദിനവൃത്താന്തം 32:30 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: രാജാക്കന്മാരിലെ പതിവ് ചരിത്രരചനാ സമാപനസൂത്രമാണിത്. דְּבָרִים എന്നതിന്റെ വിശാല അർഥം സന്ദർഭാനുസൃതമായി രാജാവിന്റെ പ്രവൃത്തികൾ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גְּבוּרָתוֹ
  choice: അവന്റെ സകല വീര്യം
  rationale: ബലം, പരാക്രമം, ശക്തമായ നേട്ടങ്ങൾ എന്നിവ സൂചിപ്പിക്കാവുന്ന അമൂർത്ത നാമത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള ജലനിർമാണം അതിന്റെ ഉദാഹരണമായി വായിക്കാം.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: അവൻ ... നിർമിച്ച്
  rationale: ഹിസ്കീയാവിന്റെ നേട്ടങ്ങളിൽ ഒരു നിർദിഷ്ട പ്രവൃത്തി അവതരിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: הַבְּרֵכָה
  choice: കുളം
  rationale: നിർമിത ജലസംഭരണിയെ സൂചിപ്പിക്കുന്ന പദത്തിന് ലളിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ തുല്യപദം; ‘ജലസംഭരണി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הַתְּעָלָה
  choice: ജലവാഹിനി
  rationale: വെള്ളം കൊണ്ടുപോകുന്ന നിർമിത ചാൽ അഥവാ മാർഗം എന്ന അർഥം വ്യക്തമായി നൽകുന്ന ആധുനിക മലയാളപദം.
- source_word: וַיָּבֵא אֶת־הַמַּיִם הָעִירָה
  choice: വെള്ളം നഗരത്തിനകത്തേക്ക് കൊണ്ടുവന്നു
  rationale: עִירָהയിലെ ദിശാസൂചക രൂപം നഗരത്തിന്റെ അകത്തേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്നു; നിർദിഷ്ടമായ ‘വെള്ളം’ നിലനിർത്തുന്നു.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: അവയെല്ലാം ... എഴുതിയിട്ടില്ലയോ?
  rationale: എബ്രായത്തിലെ പതിവ് അലങ്കാരപ്രശ്നവും ബഹുവചന സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ വൃത്താന്തപുസ്തകം
  rationale: രാജകീയ രേഖാസ്രോതസ്സിന്റെ ശീർഷകം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; കാനോനിക ദിനവൃത്താന്തപുസ്തകവുമായി അനാവശ്യമായി സമീകരിക്കുന്നില്ല.
