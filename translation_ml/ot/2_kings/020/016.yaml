reference: 2 Kings 20:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְשַׁעְיָ֖הוּ אֶל חִזְקִיָּ֑הוּ שְׁמַ֖ע דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/016.yaml
  text: Then Isaiah said to Hezekiah[a], “Hear the word of Yahweh.”
translation:
  language: ml
  text: 'അപ്പോൾ യെശയ്യാവ് ഹിസ്കീയാവിനോടു പറഞ്ഞു: “യാഹ്‌വേയുടെ[a] വചനം കേൾക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പരമ്പരാഗത പരിഭാഷാരീതിയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: יְשַׁעְיָהוּ
  choice: യെശയ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: אֶל חִזְקִיָּהוּ
  choice: ഹിസ്കീയാവിനോടു
  rationale: സംസാരത്തിന്റെ ദിശ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദം മലയാളത്തിൽ സ്വാഭാവികമായ ‘-നോടു’ എന്ന രൂപത്തിൽ നൽകി; വ്യക്തിനാമത്തിന് പ്രചാരമുള്ള മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: שְׁמַע
  choice: കേൾക്കുക
  rationale: ഏകവചന ആജ്ഞാരൂപത്തിന്റെ ഗൗരവവും പ്രവാചകീയ ആഹ്വാനത്തിന്റെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: דְּבַר
  choice: വചനം
  rationale: ദൈവത്തിൽനിന്നുള്ള പ്രവാചകീയ അരുളപ്പാടിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ ബൈബിൾ പ്രയോഗം; ‘സന്ദേശം’ എന്നതിനെക്കാൾ ഉറവിടപദത്തോട് അടുത്തതാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ നാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമസ്വഭാവം സംരക്ഷിക്കുന്നതിനായി ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിച്ചില്ല. മലയാള വായനക്കാർക്കിടയിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ മുഖ്യപാഠത്തിൽ നൽകി; ഉച്ചാരണപുനർനിർമാണമായ ‘യാഹ്‌വേ’ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രവാചകീയ ശൈലി. ‘കേൾക്കുക’ എന്ന രൂപം ആജ്ഞയുടെ ഔപചാരിക ഭാരം നിലനിർത്തുന്നു; വാക്യത്തിന്റെ സംക്ഷിപ്തത മൂലപാഠത്തിനനുസരിച്ചാണ്.
