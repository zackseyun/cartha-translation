  to: 'അപ്പോൾ ഹിസ്കീയാവ് യെശയ്യാവിനോട് പറഞ്ഞു: “നീ പ്രസ്താവിച്ച യഹോവയുടെ വചനം നല്ലതാണ്.” പിന്നെ അവൻ പറഞ്ഞു: “എന്റെ ജീവിതകാലത്ത് സമാധാനവും സുസ്ഥിരതയും ഉണ്ടായിരിക്കുമെങ്കിൽ, അതു നല്ലതല്ലേ?”[a]'
