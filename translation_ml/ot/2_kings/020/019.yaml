source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַֽׁעְיָ֔הוּ ט֥וֹב דְּבַר יְהוָ֖ה אֲשֶׁ֣ר דִּבַּ֑רְתָּ וַ/יֹּ֕אמֶר הֲ/ל֛וֹא אִם שָׁל֥וֹם וֶ/אֱמֶ֖ת יִהְיֶ֥ה בְ/יָמָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
translation:
  language: ml
  text: 'അപ്പോൾ ഹിസ്കീയാവ് യെശയ്യാവിനോട് പറഞ്ഞു: “നീ പ്രസ്താവിച്ച യഹോവയുടെ വചനം നല്ലതാണ്.” പിന്നെ അവൻ പറഞ്ഞു: “എന്റെ ജീവിതകാലത്ത് സമാധാനവും സുസ്ഥിരതയും ഉണ്ടായിരിക്കുമെങ്കിൽ, അതു നല്ലതല്ലേ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “എന്റെ ദിവസങ്ങളിൽ സമാധാനവും സത്യവും ഉണ്ടായിരിക്കുമല്ലോ?” ഇവിടെ “സത്യം” എന്നു പരിഭാഷപ്പെടുത്താവുന്ന אֱמֶת എന്ന പദത്തിന് “വിശ്വസ്തത,” “ഉറപ്പ്,” അല്ലെങ്കിൽ സന്ദർഭത്തിൽ “സുസ്ഥിരത” എന്നും അർഥമാകാം.'
    reason: אֱמֶת എന്ന പദത്തിന്റെ യഥാർഥമായ പദാർഥവൈവിധ്യവും പരമ്പരാഗത പരിഭാഷയും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: טוֹב
  choice: നല്ലതാണ്
  rationale: പ്രഖ്യാപിക്കപ്പെട്ട വചനത്തെ ചുരുക്കമായി വിലയിരുത്തുന്ന മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഹിസ്കീയാവിന്റെ ഉദ്ദേശ്യം അനാവശ്യമായി അനുകൂലമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: דְּבַר יְהוָה
  choice: യഹോവയുടെ വചനം
  rationale: പ്രവാചകസന്ദർഭത്തിലെ דָּבָר എന്ന പദത്തിന്റെ ഔപചാരിക ബന്ധം ‘വചനം’ നിലനിർത്തുന്നു; ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: דִּבַּרְתָּ
  choice: നീ പ്രസ്താവിച്ച
  rationale: യെശയ്യാവ് ദൈവിക വചനം അറിയിച്ച പ്രവാചകനാണെന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം; നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: הֲלוֹא אִם
  choice: ഉണ്ടായിരിക്കുമല്ലോ?
  rationale: ഹീബ്രുവിലെ സംക്ഷിപ്തവും അപൂർണ്ണവുമായ ചോദ്യഘടനയുടെ ഉറപ്പു പ്രതീക്ഷിക്കുന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; അതിനെ ഉള്ളിലെ ചിന്തയായി മാറ്റാതെ וַיֹּאמֶר എന്ന ‘അവൻ പറഞ്ഞു’ നിലനിർത്തുന്നു.
- source_word: שָׁלוֹם
  choice: സമാധാനം
  rationale: സാമൂഹിക ശാന്തിയും ക്ഷേമവും ഉൾക്കൊള്ളാവുന്ന വിശാലവും സാധാരണവുമായ സമാനപദം.
- source_word: אֱמֶת
  choice: സുസ്ഥിരത
  rationale: ഈ രാജകീയ-ദേശീയ സന്ദർഭത്തിൽ വിശ്വസനീയമായ നിലനിൽപ്പിനെയും ഉറച്ച ക്രമത്തെയും സൂചിപ്പിക്കുന്നു; ‘സത്യം/വിശ്വസ്തത’ എന്ന കൂടുതൽ ഔപചാരിക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְיָמָי
  choice: എന്റെ ജീവിതകാലത്ത്
  rationale: ‘എന്റെ ദിവസങ്ങളിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കാലസൂചന സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ഹിസ്കീയാവിന്റെ അവസാന വാക്കുകൾ ഹീബ്രുവിൽ വ്യാകരണപരമായി സംക്ഷിപ്തവും അർഥപൂർത്തിയില്ലാത്തതുമാണ്; അവ പറഞ്ഞ വാക്കുകളായോ അവന്റെ മനോഭാവത്തെ വിശദീകരിക്കുന്ന വിവരണമായോ വായിക്കാം.
  choice: 'וַיֹּאמֶר എന്ന ക്രിയയെ മാനിച്ച് രണ്ടാമത്തെ ഭാഗവും നേരിട്ടുള്ള വാക്കായി നൽകി: “പിന്നെ അവൻ പറഞ്ഞു: ‘എന്റെ ജീവിതകാലത്ത് സമാധാനവും സുസ്ഥിരതയും ഉണ്ടായിരിക്കുമല്ലോ?’”'
  alternative: “കാരണം, ‘എന്റെ ജീവിതകാലത്ത് സമാധാനവും സുസ്ഥിരതയും ഉണ്ടായിരിക്കുമല്ലോ’ എന്ന് അവൻ ചിന്തിച്ചു.”
  rationale: മൂലപാഠത്തിലെ ‘അവൻ പറഞ്ഞു’ എന്ന വ്യക്തമായ സൂചന സംരക്ഷിക്കുകയും הֲלוֹא എന്ന ഉറപ്പു പ്രതീക്ഷിക്കുന്ന ചോദ്യഭാവം മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു. അതേസമയം, വരാനിരിക്കുന്ന ന്യായവിധി തന്റെ ജീവിതകാലത്തിനു ശേഷമാണെന്നതുകൊണ്ടാണോ അവൻ വചനത്തെ നല്ലതെന്നു വിളിച്ചതെന്ന ധാർമ്മിക പിരിമുറുക്കം വിശദീകരിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഔപചാരിക ഭാവത്തിനായി ‘വചനം’, ‘പ്രസ്താവിച്ച’ എന്നിവ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ സംക്ഷിപ്തത സ്വാഭാവികമാക്കുമ്പോഴും ധാർമ്മിക അസ്പഷ്ടത നീക്കിയിട്ടില്ല.
