  to: ഹിസ്കീയാവ് അവർക്കു ചെവികൊടുത്തു[a]. തന്റെ നിധിശാല മുഴുവനും—വെള്ളിയും സ്വർണവും സുഗന്ധദ്രവ്യങ്ങളും മേന്മയേറിയ എണ്ണയും തന്റെ ആയുധശാല[c]യും തന്റെ ഭണ്ഡാരങ്ങളിൽ ഉണ്ടായിരുന്നതെല്ലാം—അവർക്കു കാണിച്ചുകൊടുത്തു. തന്റെ ഭവനത്തിലോ തന്റെ ഭരണപ്രദേശത്തെങ്ങുമോ[d] ഹിസ്കീയാവ് അവർക്കു കാണിച്ചുകൊടുക്കാത്തതായി ഒന്നും ഉണ്ടായിരുന്നില്ല.
