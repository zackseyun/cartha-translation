  text: וַ/יִּשְׁמַ֣ע עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת כָּל בֵּ֣ית נְכֹתֹ֡/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת שֶׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֽוֹצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
translation:
  language: ml
  text: ഹിസ്കീയാവ് അവർക്കു ചെവികൊടുത്തു[a]. തന്റെ നിധിശാല മുഴുവനും—വെള്ളിയും സ്വർണവും സുഗന്ധദ്രവ്യങ്ങളും മേന്മയേറിയ എണ്ണയും തന്റെ ആയുധശാല[c]യും തന്റെ ഭണ്ഡാരങ്ങളിൽ ഉണ്ടായിരുന്നതെല്ലാം—അവർക്കു കാണിച്ചുകൊടുത്തു. തന്റെ ഭവനത്തിലോ തന്റെ ഭരണപ്രദേശത്തെങ്ങുമോ[d] ഹിസ്കീയാവ് അവർക്കു കാണിച്ചുകൊടുക്കാത്തതായി ഒന്നും ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരെ കേട്ടു” എന്നും “അവരെ അനുകൂലമായി സ്വീകരിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ പ്രയോഗത്തിന് ഒരാൾക്കു ചെവികൊടുക്കുക, കൂടിക്കാഴ്ച നൽകുക എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “തന്റെ ഉപകരണശാല”; പദശഃ, “തന്റെ ഉപകരണങ്ങളുടെ വീട്.” സന്ദർഭത്തിൽ ആയുധങ്ങളോ സൈനിക ഉപകരണങ്ങളോ ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ “തന്റെ അധീനപ്രദേശത്തെങ്ങും” അല്ലെങ്കിൽ “തന്റെ അധികാരപരിധിയിലെങ്ങും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  choice: അവരുടെ വാക്കുകൾ ശ്രദ്ധയോടെ കേട്ടു
  rationale: ശാരീരികമായി കേട്ടു എന്നതിലുപരി അനുകൂലമായി ചെവികൊടുക്കുക അഥവാ അവർക്കു കൂടിക്കാഴ്ച അനുവദിക്കുക എന്ന സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּרְאֵם / הֶרְאָם
  choice: അവർക്കു കാണിച്ചുകൊടുത്തു
  rationale: ראה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ‘കാണിക്കുക’ എന്നാണ്; വാക്യത്തിലെ ആവർത്തനവും ഒരേ രീതിയിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: בֵּית נְכֹתֹה
  choice: തന്റെ വിലപിടിപ്പുള്ള വസ്തുക്കളുടെ കലവറ
  rationale: വിലയേറിയ സാധനങ്ങൾ സൂക്ഷിച്ചിരുന്ന സ്ഥലം എന്ന ഘടനാപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: הַכֶּסֶף
  choice: വെള്ളി
  rationale: ഇവിടെ ആധുനിക അർഥത്തിലുള്ള പണമല്ല, സൂക്ഷിച്ചുവെച്ച വിലയേറിയ ലോഹമാണ് ഉദ്ദേശ്യം.
- source_word: הַזָּהָב
  choice: സ്വർണം
  rationale: രാജഭണ്ഡാരത്തിലെ വിലയേറിയ ലോഹത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: הַבְּשָׂמִים
  choice: സുഗന്ധദ്രവ്യങ്ങൾ
  rationale: വിലയേറിയ സുഗന്ധമുള്ള പദാർഥങ്ങളെ ഉൾക്കൊള്ളുന്ന വിശാലവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: שֶׁמֶן הַטּוֹב
  choice: മേന്മയേറിയ എണ്ണ
  rationale: അക്ഷരാർഥമായ ‘നല്ല എണ്ണ’ ഇവിടെ ഉന്നത ഗുണമേന്മയുള്ള അഥവാ വിലയേറിയ എണ്ണയെ സൂചിപ്പിക്കുന്നു; അതിന്റെ ഉപയോഗം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: בֵּית כֵּלָיו
  choice: തന്റെ ആയുധശാല
  rationale: രാജകീയ സംഭരണപ്പട്ടികയുടെ പശ്ചാത്തലത്തിൽ כֵּלִים ആയുധങ്ങളെയോ സൈനിക ഉപകരണങ്ങളെയോ സൂചിപ്പിക്കാം; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: തന്റെ ഭണ്ഡാരങ്ങളിൽ ഉണ്ടായിരുന്നതെല്ലാം
  rationale: אֹצָר എന്നത് ഭണ്ഡാരം അഥവാ സംഭരണശാല എന്നർഥം നൽകുന്നു; ബഹുവചനവും സമഗ്രതയും സൂക്ഷിക്കുന്നു.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: കാണിച്ചുകൊടുക്കാത്തതായി ഒന്നും ഉണ്ടായിരുന്നില്ല
  rationale: എബ്രായത്തിലെ ഇരട്ട നിഷേധം നൽകുന്ന സമ്പൂർണതയും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּבֵיתוֹ
  choice: തന്റെ അരമനയിൽ
  rationale: പദശഃ ‘തന്റെ വീട്ടിൽ’ എന്നാണെങ്കിലും രാജാവിന്റെ വസതിയും രാജകീയ സമുച്ചയവും ഉദ്ദേശിക്കുന്ന സന്ദർഭത്തിൽ ‘അരമന’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְכָל מֶמְשַׁלְתּוֹ
  choice: തന്റെ ഭരണപ്രദേശത്തെങ്ങും
  rationale: അവന്റെ അധികാരത്തിനും ഭരണത്തിനും കീഴിലുള്ള മുഴുവൻ പ്രദേശത്തെയും സൂചിപ്പിക്കുന്നു; ‘രാജ്യം’ എന്ന് പരിമിതപ്പെടുത്തുന്നില്ല.
