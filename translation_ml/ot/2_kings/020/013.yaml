  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിന്റെ സമഗ്രത സൂചിപ്പിക്കുന്ന ആവർത്തനവും അവസാനത്തെ ഊന്നിയ നിഷേധവും നിലനിർത്തി. സാങ്കേതികമോ അതിപുരാതനമോ ആയ പദങ്ങൾ ഒഴിവാക്കി; സ്രോതസ്സിലെ യഥാർഥ പദാർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
