source:
  edition: WLC
  text: וַ/יִּקְרָ֛א יְשַׁעְיָ֥הוּ הַ/נָּבִ֖יא אֶל יְהוָ֑ה וַ/יָּ֣שֶׁב אֶת הַ/צֵּ֗ל בַּֽ֠/מַּעֲלוֹת אֲשֶׁ֨ר יָרְדָ֜ה בְּ/מַעֲל֥וֹת אָחָ֛ז אֲחֹֽרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
translation:
  language: ml
  text: യെശയ്യാ പ്രവാചകൻ യഹോവയോടു നിലവിളിച്ചു. അപ്പോൾ യഹോവ നിഴലിനെ, ആഹാസിന്റെ പടികളിലൂടെ അത് ഇറങ്ങിപ്പോയിരുന്ന പത്ത് പടികൾ, പിന്നോട്ടു കൊണ്ടുവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പത്ത് അംശങ്ങൾ.’ എബ്രായത്തിൽ ‘പത്ത് പടികൾ/കയറ്റങ്ങൾ’ (മഅലോത്ത്) എന്നാണ്. ഇത് നിഴൽ അളക്കാനുള്ള ഒരു ഘടനയുടെ ഭാഗമായിരുന്നുവെന്ന് ചിലർ പരമ്പരാഗതമായി മനസ്സിലാക്കുന്നതിനാൽ, ‘ആഹാസിന്റെ സൂര്യഘടികാരം’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: നിലവിളിച്ചു
  rationale: യഹോവയോടുള്ള ശക്തമായ വിളിയെ സൂചിപ്പിക്കുന്നു; ‘പ്രാർഥിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ മൂലക്രിയയുടെ സജീവത നിലനിർത്തുന്നു.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: യെശയ്യാ പ്രവാചകൻ
  rationale: വ്യക്തിനാമത്തിന്റെ സാധാരണ മലയാളരൂപവും പദവിയുടെ നേരിട്ടുള്ള പരിഭാഷയും.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: וַיָּשֶׁב
  choice: പിന്നോട്ടു കൊണ്ടുവന്നു
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥവും തിരിച്ചുള്ള ചലനവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֶת הַצֵּל
  choice: നിഴൽ
  rationale: കാരണാർത്ഥക്രിയയുടെ നേരിട്ടുള്ള കർമം; അടയാളത്തിൽ ചലിക്കുന്നത് നിഴലാണ്.
- source_word: בַּמַּעֲלוֹת / עֶשֶׂר מַעֲלוֹת
  choice: പടികളിൽ / പത്തു പടികൾ
  rationale: מַעֲלוֹת എന്നതിന്റെ അടിസ്ഥാന അർത്ഥമായ ‘പടികൾ/കയറ്റങ്ങൾ’ നിലനിർത്തുന്നു; ഘടനയെ സൂര്യഘടികാരമെന്നു മുഖ്യപാഠത്തിൽ നിർണയിക്കുന്നില്ല.
- source_word: אֲשֶׁר יָרְדָה
  choice: ഇറങ്ങിപ്പോയിരുന്ന
  rationale: നിഴലിന്റെ മുമ്പുണ്ടായ താഴോട്ടുള്ള ചലനം പൂർത്തിയായ പ്രവൃത്തിയായി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּמַעֲלוֹת אָחָז
  choice: ആഹാസിന്റെ പടികളിൽ
  rationale: ആഹാസുമായി ബന്ധപ്പെട്ട ഘടനയെക്കുറിച്ചുള്ള എബ്രായവാചകത്തിന്റെ പൊതുവായ വിവരണം നിലനിർത്തുന്നു.
- source_word: אֲחֹרַנִּית
  choice: പിന്നോട്ടു
  rationale: നിഴലിന്റെ വിപരീതദിശയിലുള്ള ചലനം ലളിതവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പൊതുവായ പദവികൊണ്ട് പകരാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: מַעֲלוֹת אָחָז സൂചിപ്പിക്കുന്ന ഘടനയുടെ സ്വഭാവം
  choice: ആഹാസിന്റെ പടികൾ
  alternative: ആഹാസിന്റെ സൂര്യഘടികാരം
  rationale: എബ്രായപാഠം ‘പടികൾ/കയറ്റങ്ങൾ’ എന്നു പറയുന്നു; അത് ഒരു നിഴൽമാപിനിയാണോ പടിക്കെട്ടാണോ എന്ന ചരിത്രപരമായ അനിശ്ചിതത്വം മുഖ്യപാഠം തീർപ്പാക്കുന്നില്ല.
- issue: וַיָּשֶׁב എന്ന ക്രിയയുടെ പരാമർശവിഷയം
  choice: അവൻ
  alternative: യഹോവ
  rationale: എബ്രായത്തിൽ പുതിയ നാമവിഷയം ആവർത്തിക്കാതെ മൂന്നാംപുരുഷ ഏകവചന ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. സന്ദർഭത്തിൽ യഹോവയാണ് സ്വാഭാവിക പരാമർശമെങ്കിലും, സർവനാമം ഉപയോഗിച്ച് മൂലവാചകത്തിന്റെ രൂപവും ചെറിയ പരാമർശസാദ്ധ്യതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പടികൾ’ എന്ന ദൃശ്യവും പൊതുവുമായ പദം ഉപയോഗിച്ച് ചരിത്രഘടനയെ അനാവശ്യമായി നിർവചിക്കുന്നത് ഒഴിവാക്കി. വാക്യത്തിന്റെ ദൈർഘ്യം നിയന്ത്രിക്കാൻ രണ്ടു വാക്യങ്ങളാക്കി.
