- from: യെശയ്യാ പ്രവാചകൻ യഹോവയോടു നിലവിളിച്ചു. അപ്പോൾ ആഹാസിന്റെ പടികളിൽ നിഴൽ ഇറങ്ങിപ്പോയിരുന്ന പത്തു പടികൾ[a] അവൻ അതിനെ പിന്നോട്ടു കൊണ്ടുവന്നു.
  to: യെശയ്യാ പ്രവാചകൻ യഹോവയോടു നിലവിളിച്ചു. അപ്പോൾ യഹോവ നിഴലിനെ, ആഹാസിന്റെ പടികളിലൂടെ അത് ഇറങ്ങിപ്പോയിരുന്ന പത്ത് പടികൾ, പിന്നോട്ടു കൊണ്ടുവന്നു.[a]
