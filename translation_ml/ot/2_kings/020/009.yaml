  text: וַ/יֹּ֣אמֶר יְשַׁעְיָ֗הוּ זֶה לְּ/ךָ֤ הָ/אוֹת֙ מֵ/אֵ֣ת יְהוָ֔ה כִּ֚י יַעֲשֶׂ֣ה יְהוָ֔ה אֶת הַ/דָּבָ֖ר אֲשֶׁ֣ר דִּבֵּ֑ר הָלַ֤ךְ הַ/צֵּל֙ עֶ֣שֶׂר מַֽעֲל֔וֹת אִם יָשׁ֖וּב עֶ֥שֶׂר מַעֲלֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
translation:
  language: ml
  text: 'യെശയ്യാവ് പറഞ്ഞു: “യഹോവ താൻ പറഞ്ഞ കാര്യം ചെയ്യുമെന്നതിന്, യഹോവയിൽനിന്ന് നിനക്കുള്ള അടയാളം ഇതാണ്: നിഴൽ പത്തു പടികൾ[a] മുന്നോട്ടു പോകണമോ, അതോ പത്തു പടികൾ പിന്നോട്ടു മടങ്ങണമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഡിഗ്രികൾ.” എബ്രായപദത്തിന്റെ അക്ഷരാർഥം “പടികൾ” അല്ലെങ്കിൽ “കയറ്റങ്ങൾ” എന്നാണ്; എന്നാൽ ആഹാസുമായി ബന്ധപ്പെട്ട പടിക്കെട്ടിലോ ഉപകരണത്തിലോ നിഴലിന്റെ നീക്കത്തെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ഇതിനെ പരമ്പരാഗതമായി “ഡിഗ്രികൾ” എന്നു വിവർത്തനം ചെയ്യാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: അടയാളം
  rationale: אוֹת ഇവിടെ ഹിസ്കീയാവിന് ഉറപ്പായി നൽകപ്പെടുന്ന അത്ഭുതചിഹ്നത്തെ സൂചിപ്പിക്കുന്നു; ‘അടയാളം’ സ്വാഭാവികവും പതിവുമായ മലയാളപദമാണ്.
- source_word: מֵאֵת יְהוָה
  choice: യഹോവയിൽനിന്ന്
  rationale: מֵאֵת ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; ദൈവനാമം ലിപ്യന്തരിച്ചു ചേർത്തപ്പോൾ ഈ രൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: כִּי
  choice: എന്നതിന്
  rationale: ഇവിടെ כִּי അടയാളം ഉറപ്പുനൽകുന്ന ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. ‘എന്നതിന്’ ആ സ്ഥിരീകരണബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יַעֲשֶׂה ... אֶת־הַדָּבָר אֲשֶׁר דִּבֵּר
  choice: താൻ അരുളിച്ചെയ്ത കാര്യം ചെയ്യും
  rationale: דָּבָר എന്നതിന്റെ ‘കാര്യം’ എന്ന അർഥവും, മുമ്പ് ദൈവം പറഞ്ഞതിനെ നടപ്പാക്കുമെന്ന ആശയവും നിലനിർത്തുന്നു. ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്ത’ എന്നത് മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: הָלַךְ הַצֵּל
  choice: നിഴൽ ... മുന്നോട്ടു പോകണമോ
  rationale: രൂപത്തിൽ perfect ആയ הָלַךְ ഇവിടെ രണ്ട് സാധ്യതകൾ മുന്നോട്ടുവയ്ക്കുന്ന ചോദ്യത്തിൽ ഭാവിസംബന്ധമായ അർഥം വഹിക്കുന്നു; ‘മുന്നോട്ടു പോകുക’ എന്നത് יָשׁוּב എന്ന വിരുദ്ധചലനവുമായി വ്യക്തമായ വൈരുധ്യം സൃഷ്ടിക്കുന്നു.
- source_word: מַעֲלוֹת
  choice: പടികൾ
  rationale: מַעֲלוֹת എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘പടികൾ/കയറ്റങ്ങൾ’ എന്നാണ്. ഉപകരണത്തിലെ അളവുഭാഗങ്ങളായി വ്യാഖ്യാനിക്കാതെ ഉറവിടഭാഷയോട് അടുത്ത രൂപം സ്വീകരിച്ചു.
- source_word: אִם
  choice: അതോ
  rationale: രണ്ട് പര്യായസാധ്യതകളുള്ള ചോദ്യത്തിൽ אִם രണ്ടാമത്തെ സാധ്യത അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അതോ’ ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יָשׁוּב
  choice: പിന്നോട്ടു മടങ്ങണമോ
  rationale: שׁוּב മടങ്ങുക/തിരികെ വരുക എന്നർഥം നൽകുന്നു; നിഴലിന്റെ ദിശ തിരിച്ചാകുന്നതിനെ ‘പിന്നോട്ടു മടങ്ങുക’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: എബ്രായപാഠം നിയമനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. ഒരു പൊതുപദവിയാൽ പകരംവയ്ക്കാതെ ദൈവനാമം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. ചോദ്യം രണ്ട് സാധ്യതകളെയും തുല്യമായി തുറന്നുവയ്ക്കുന്നു. מַעֲלוֹת എന്ന പദത്തിന്റെ വസ്തുനിഷ്ഠമായ അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സന്ദർഭപരമായ മറ്റൊരു ധാരണ അടിക്കുറിപ്പിൽ നൽകി.
