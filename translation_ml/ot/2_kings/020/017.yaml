revisions:
- from: ഇതാ, നിന്റെ കൊട്ടാരത്തിലുള്ള സകലതും നിന്റെ പിതാക്കന്മാർ ഇന്നുവരെ ശേഖരിച്ചുവെച്ചതും ബാബേലിലേക്കു കൊണ്ടുപോകപ്പെടുന്ന ദിവസങ്ങൾ വരുന്നു. ഒന്നും ശേഷിക്കുകയില്ല എന്ന് യഹോവ അരുളിച്ചെയ്യുന്നു.
  to: ഇതാ, നിന്റെ കൊട്ടാരത്തിലുള്ള സകലവും നിന്റെ പിതാക്കന്മാർ ഇന്നുവരെ ശേഖരിച്ചുവെച്ചിട്ടുള്ളതെല്ലാം ബാബേലിലേക്കു കൊണ്ടുപോകപ്പെടുന്ന ദിവസങ്ങൾ വരുന്നു. ഒന്നുപോലും ശേഷിക്കുകയില്ല എന്ന് യഹോവ അരുളിച്ചെയ്യുന്നു.
