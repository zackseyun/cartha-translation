  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑לָ/ה לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: ml
  text: ഇതാ, നിന്റെ കൊട്ടാരത്തിലുള്ള സകലവും നിന്റെ പിതാക്കന്മാർ ഇന്നുവരെ ശേഖരിച്ചുവെച്ചിട്ടുള്ളതെല്ലാം ബാബേലിലേക്കു കൊണ്ടുപോകപ്പെടുന്ന ദിവസങ്ങൾ വരുന്നു. ഒന്നുപോലും ശേഷിക്കുകയില്ല എന്ന് യഹോവ അരുളിച്ചെയ്യുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: വരാനിരിക്കുന്ന വിധിയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു അവതരണപദത്തിന്റെ ഗൗരവവും ഊന്നലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּבֵיתֶךָ
  choice: നിന്റെ കൊട്ടാരത്തിലുള്ള
  rationale: രാജാവായ ഹിസ്കീയാവിനോടുള്ള സന്ദർഭത്തിൽ בַּיִת എന്നത് സ്വകാര്യവീടിനെക്കാൾ രാജകൊട്ടാരവും അതിലെ ഭണ്ഡാരവും സൂചിപ്പിക്കുന്നു.
- source_word: אָצְרוּ
  choice: ശേഖരിച്ചുവെച്ചത്
  rationale: സമ്പത്ത് ഭണ്ഡാരത്തിൽ സൂക്ഷിച്ചുവെക്കുക എന്ന ക്രിയയുടെ അർഥം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: וְנִשָּׂא
  choice: കൊണ്ടുപോകപ്പെടുന്ന
  rationale: ഹീബ്രു നിഫാൽ രൂപത്തിലെ കർമ്മണിപ്രയോഗം സംരക്ഷിക്കുന്നു; ബാബേലിലേക്കുള്ള കൊള്ളയടിച്ചുകൊണ്ടുപോകൽ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: דָּבָר
  choice: ഒന്നും
  rationale: നിഷേധവാക്യത്തിൽ ‘ഒരു വസ്തുപോലും’ എന്ന സമഗ്രമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: വിധിപ്രഖ്യാപനത്തിന്റെ ഉറപ്പും സമയത്തിലെ അനിശ്ചിതത്വവും
  choice: ‘ദിവസങ്ങൾ വരുന്നു’ എന്നും ‘കൊണ്ടുപോകപ്പെടുന്ന’ എന്നും പരിഭാഷപ്പെടുത്തി
  alternative: സംഭവം ഉടൻ നടക്കുമെന്നോ കൃത്യകാലം നിശ്ചയിച്ചെന്നോ വ്യക്തമാക്കുക
  rationale: മൂലപാഠം ഭാവിയിലെ വിധി ഉറപ്പാണെന്ന് പ്രഖ്യാപിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യസമയം പറയുന്നില്ല; ആ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. രാജസന്ദർഭം വ്യക്തമാക്കാൻ ‘വീട്’ എന്നതിനു പകരം ‘കൊട്ടാരം’ ഉപയോഗിച്ചു. വാക്യത്തിലെ പ്രവാചകീയ ഊന്നലും സംക്ഷിപ്തതയും നിലനിർത്തി.
