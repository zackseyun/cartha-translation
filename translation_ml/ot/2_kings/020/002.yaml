  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּסֵּ֥ב אֶת פָּנָ֖י/ו אֶל הַ/קִּ֑יר וַ/יִּ֨תְפַּלֵּ֔ל אֶל יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/002.yaml
  text: Then he turned his face to the wall and prayed to Yahweh[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ തന്റെ മുഖം ചുമരിനുനേരെ തിരിച്ചു യഹ്‌വെയോടു[a] പ്രാർഥിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: യഹ്‌വെ (YHWH). യഹൂദ വായനാപാരമ്പര്യത്തെ പിന്തുടർന്ന് പല പരിഭാഷകളും ഇവിടെ ‘കർത്താവ്’ എന്നു നൽകുന്നു.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും അതിന്റെ ലിപ്യന്തരണവും പരമ്പരാഗത പകരവായനയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: അപ്പോൾ ... തിരിച്ച്
  rationale: ഹിഫീൽ വയ്യിഖ്തോൽ രൂപം തുടർന്നുണ്ടായ ഭൂതകാല പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആഖ്യാനത്തിന്റെ ക്രമം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: פָּנָיו
  choice: അവൻ മുഖം
  rationale: പദത്തിന്റെ സാക്ഷാൽ അർഥമായ ‘മുഖം’ നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל הַקִּיר
  choice: ചുമരിലേക്കു
  rationale: אֶל ദിശയെയും קִיר ചുമരിനെയും സൂചിപ്പിക്കുന്നു; ‘ചുമരിലേക്കു’ എന്നത് ഈ ദിശാബോധം കൃത്യമായി നൽകുന്നു.
- source_word: וַיִּתְפַּלֵּל
  choice: പ്രാർഥിച്ചു
  rationale: פלל എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം ഇവിടെ ദൈവത്തോടു പ്രാർഥിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വെയോടു
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത്, പ്രാർഥനയുടെ സ്വീകർത്താവിനെ മലയാളത്തിലെ ‘-ഓടു’ വിഭക്തിയാൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: 'പ്രാർഥിച്ചു:'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന പ്രാർഥനാവാക്കുകളെ പരിചയപ്പെടുത്തുന്ന לֵאמֹר എന്ന രൂപത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ഉദ്ധരണിക്കു മുമ്പുള്ള ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; വേറിട്ട് ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർക്കുന്നത് അനാവശ്യമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: എബ്രായപാഠത്തിൽ പൊതുവായ ഒരു സ്ഥാനനാമമല്ല, നാല് അക്ഷരങ്ങളുള്ള വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്ത് മൂലപാഠത്തിലെ വ്യത്യാസം നിലനിർത്തുന്നു; വായനാപാരമ്പര്യമായ ‘കർത്താവ്’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘മുഖം ചുമരിലേക്കു തിരിച്ച്’ എന്ന പ്രയോഗം മൂലത്തിലെ ദൃശ്യബിംബം നിലനിർത്തുന്നു; לֵאמֹר-ന്റെ പ്രസംഗപരിചയപ്പെടുത്തൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമാക്കി.
