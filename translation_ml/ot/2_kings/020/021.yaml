source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֥ב חִזְקִיָּ֖הוּ עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/021.yaml
  text: And Hezekiah lay down with his fathers[a], and Manasseh his son became king in his place.
translation:
  language: ml
  text: ഹിസ്കീയാവ് തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു[a]. അവന്റെ മകനായ മനശ്ശെ അവന്റെ സ്ഥാനത്ത് രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തന്റെ പിതാക്കന്മാരോടുകൂടെ കിടന്നു.’ ഹീബ്രുവിൽ ഇത് രാജാക്കന്മാരുടെ മരണത്തെ അറിയിക്കുന്ന പതിവ് പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: שׁכב എന്ന ക്രിയയുടെ അടിസ്ഥാനചിത്രം കിടക്കുക/ഉറങ്ങുക എന്നതാണ്; ‘തന്റെ പിതാക്കന്മാരോടുകൂടെ’ എന്ന പ്രയോഗത്തോടൊപ്പം ഇത് മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് രാജകീയ സൂത്രവാക്യമാണ്. ‘നിദ്രപ്രാപിച്ചു’ ആ മരണാർഥവും ഹീബ്രു രൂപകവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ
  rationale: ഹീബ്രുവിലെ പതിവ് മരണ-അടക്ക സൂത്രവാക്യം ഔപചാരികമായി സംരക്ഷിക്കുന്നു; ഇവിടെ אָבוֹת എന്ന പുല്ലിംഗ ബഹുവചനത്തിന് ‘പിതാക്കന്മാർ’ നേരിട്ടുള്ള യോജിച്ച പരിഭാഷയാണ്.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: ഈ രാജാവകാശസൂത്രത്തിൽ מלך ഭരണകാലത്തിന്റെ ദൈർഘ്യമല്ല, സിംഹാസനാരോഹണമാണ് സൂചിപ്പിക്കുന്നത്; ‘രാജാവായി’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מְנַשֶּׁה
  choice: മനശ്ശെ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: בְנוֹ
  choice: അവന്റെ മകനായ
  rationale: പുത്രബന്ധം മൂലപാഠത്തിൽ വ്യക്തമായതിനാൽ അത് തുറന്നുവെക്കുന്നു; മലയാളവാക്യത്തിൽ പേരിനോടു സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: രാജാവകാശസന്ദർഭത്തിൽ תחת ‘അവന്റെ സ്ഥാനത്ത്/അവനു പകരം’ എന്നാണ്; ‘അവനു പകരം’ പിന്തുടർച്ചയുടെ ആശയം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: മരണസൂത്രവാക്യത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘നിദ്രപ്രാപിച്ചു’ എന്ന രൂപകം നിലനിർത്തി
  alternative: ‘മരിച്ചു’ എന്ന് നേരിട്ട് വിവർത്തനം ചെയ്യുക
  rationale: ഇത് മരണത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണെങ്കിലും, മൂലപാഠത്തിലെ ഉറക്കം/കിടപ്പ് എന്ന ചിത്രം ഇല്ലാതാക്കാതെ അർഥം അറിയിക്കുന്നു; മരണാനന്തരാവസ്ഥയെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ രാജകീയ ചരിത്രവിവരണശൈലി. ‘നിദ്രപ്രാപിച്ചു’ എന്ന പരിചിതമായ ഔപചാരിക പ്രയോഗം ഹീബ്രു രൂപകവും മരണാർഥവും സംരക്ഷിക്കുന്നു.
