source:
  edition: WLC
  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יקח וְ/הָיוּ֙ סָֽרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: ml
  text: നിന്നിൽനിന്ന് ജനിക്കുന്ന, നീ പിതാവാകുന്ന നിന്റെ പുത്രന്മാരിൽ ചിലരെ കൊണ്ടുപോകും; അവർ ബാബേൽ രാജാവിന്റെ കൊട്ടാരത്തിൽ ഷണ്ഡന്മാരായിത്തീരും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥർ’ അല്ലെങ്കിൽ ‘കൊട്ടാര ഉദ്യോഗസ്ഥർ’; എബ്രായപദം അക്ഷരാർഥത്തിൽ ഷണ്ഡന്മാരെയോ ചില സന്ദർഭങ്ങളിൽ രാജസേവകരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: നിന്റെ പുത്രന്മാരിൽ ചിലരെ
  rationale: ഭാഗികത സൂചിപ്പിക്കുന്ന מִן കാരണം ‘പുത്രന്മാരിൽ ചിലരെ’ എന്നു പരിഭാഷപ്പെടുത്തി. സന്ദർഭം രാജവംശത്തിലെ പിൻതലമുറയെയും ഉൾക്കൊള്ളാമെങ്കിലും, בָּנִים എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തി.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: നിന്നിൽനിന്നു ജനിക്കുന്ന
  rationale: ശാരീരിക വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന ‘നിന്നിൽനിന്നു പുറപ്പെടുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: אֲשֶׁר תּוֹלִיד
  choice: നീ പിതാവാകുന്ന
  rationale: പുരുഷനെ അഭിസംബോധന ചെയ്യുന്ന ילד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ പിതൃത്വപരമായ അർഥം നിലനിർത്തുന്നു; മുൻവാക്യഭാഗത്തോടുള്ള ആവർത്തനവും പൂർണമായി നീക്കുന്നില്ല.
- source_word: יקח
  choice: കൊണ്ടുപോകും
  rationale: മസോററ്റിക് പാഠത്തിൽ ക്രിയ ഏകവചന കർത്തൃപ്രയോഗമായതിനാൽ വ്യക്തമായി പറയാത്ത കർത്താവോടുകൂടിയ ‘കൊണ്ടുപോകും’ എന്നു നൽകി. പുത്രന്മാരാണ് അതിന്റെ കർമമെന്ന് മലയാളത്തിലെ ‘ചിലരെ’ വ്യക്തമാക്കുന്നു.
- source_word: וְהָיוּ
  choice: ആയിത്തീരും
  rationale: നാടുകടത്തപ്പെട്ടശേഷം ലഭിക്കുന്ന പുതിയ നിലയെ സന്ദർഭം സൂചിപ്പിക്കുന്നതിനാൽ ‘ആയിരിക്കും’ എന്നതിനെക്കാൾ ഫലാവസ്ഥ വ്യക്തമാക്കുന്ന ‘ആയിത്തീരും’ സ്വീകരിച്ചു.
- source_word: סָרִיסִים
  choice: ഷണ്ഡന്മാർ
  rationale: പദത്തിന്റെ പ്രാഥമികവും ഈ ന്യായവിധിസന്ദർഭത്തിൽ ഗൗരവമുള്ളതുമായ അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; രാജകൊട്ടാര ഉദ്യോഗസ്ഥർ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בְּהֵיכַל
  choice: കൊട്ടാരത്തിൽ
  rationale: ‘ബാബേൽരാജാവ്’ എന്ന ബന്ധത്തിൽ הֵיכָל രാജകൊട്ടാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവിന്റെ
  rationale: എബ്രായ സംയുക്തനാമഘടനയുടെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: കൊട്ടാരസന്ദർഭത്തിലെ סָרִיסִים എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ഷണ്ഡന്മാർ’
  alternative: ‘രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥർ’ അല്ലെങ്കിൽ ‘കൊട്ടാര ഉദ്യോഗസ്ഥർ’
  rationale: ഈ പദം അക്ഷരാർഥത്തിൽ ഷണ്ഡന്മാരെയും ചില സന്ദർഭങ്ങളിൽ രാജസേവകരെയും സൂചിപ്പിക്കാം. ഇവിടെ തടവിലാക്കപ്പെടുന്ന രാജസന്തതിയെക്കുറിച്ചുള്ള ന്യായവിധിയുടെ ഗൗരവത്തോട് അക്ഷരാർഥം യോജിക്കുന്നു; എന്നാൽ മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘പുത്രന്മാരിൽ ചിലരെ’ എന്ന രൂപം എബ്രായത്തിലെ ഭാഗികതയും, ‘നിന്നിൽനിന്നു ജനിക്കുന്ന, നീ പിതാവാകുന്ന’ എന്ന രൂപം മൂലപാഠത്തിലെ വംശപരവും പിതൃത്വപരവുമായ ഇരട്ടപ്രയോഗവും നിലനിർത്തുന്നു.
