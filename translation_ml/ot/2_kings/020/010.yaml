source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְחִזְקִיָּ֔הוּ נָקֵ֣ל לַ/צֵּ֔ל לִ/נְט֖וֹת עֶ֣שֶׂר מַעֲל֑וֹת לֹ֣א כִ֔י יָשׁ֥וּב הַ/צֵּ֛ל אֲחֹרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/010.yaml
  text: And Hezekiah said, “It is an easy thing for the shadow to stretch forward ten steps. No, but let the shadow go back ten steps.”
translation:
  language: ml
  text: 'ഹിസ്കീയാവ് പറഞ്ഞു: “നിഴൽ പത്തു പടികൾ[a] മുന്നോട്ടു നീളുന്നത് എളുപ്പമാണ്. അല്ല; നിഴൽ പത്തു പടികൾ പിന്നോട്ടു പോകട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പത്തു ഡിഗ്രികൾ.” എബ്രായപദത്തിന് “പടികൾ” അഥവാ “കയറ്റങ്ങൾ” എന്നർഥമുണ്ട്; അത് ആഹാസിന്റെ നിഴൽ അളക്കുന്ന ഉപകരണത്തിലെ പടികളെയോ അളവടയാളങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: എളുപ്പമാണ്
  rationale: ഈ വിശേഷണം ‘ലഘുവായിരിക്കുക/എളുപ്പമായിരിക്കുക’ എന്ന ആശയം നൽകുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം ‘എളുപ്പമാണ്’ എന്നാണ്.
- source_word: הַצֵּל / לַצֵּל
  choice: നിഴൽ
  rationale: צֵל എന്ന പദത്തിന്റെ സാധാരണ അർഥം ‘നിഴൽ’ ആണ്; നിർദിഷ്ടമായ നിഴലാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: לִנְטוֹת
  choice: മുന്നോട്ടു നീളുന്നത്
  rationale: נטה എന്ന ക്രിയയ്ക്ക് ‘നീട്ടുക, നീളുക, ചായുക’ തുടങ്ങിയ അർഥങ്ങളുണ്ട്. ഇവിടെ നിഴലിന്റെ സാധാരണ ദിശയിലുള്ള വ്യാപനം സൂചിപ്പിക്കാൻ ‘മുന്നോട്ടു നീളുന്നത്’ സ്വാഭാവികവും ദൃശ്യബിംബത്തോട് ചേർന്നതുമാണ്.
- source_word: מַעֲלוֹת
  choice: പടികൾ
  rationale: ഈ നാമം അടിസ്ഥാനപരമായി ‘കയറ്റങ്ങൾ/പടികൾ’ എന്നാണ്. ആഹാസിന്റെ നിഴൽസൂചകത്തിലെ പടികളെയോ അളവടയാളങ്ങളെയോ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לֹא כִּי
  choice: വേണ്ടാ;
  rationale: ആദ്യസാധ്യത നിരസിച്ച് മറ്റൊന്ന് ആവശ്യപ്പെടുന്ന ശക്തമായ വിരുദ്ധത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יָשׁוּב ... אֲחֹרַנִּית
  choice: പിന്നോട്ടു പോകട്ടെ
  rationale: שׁוב എന്നത് ‘മടങ്ങുക/തിരിഞ്ഞുപോകുക’ എന്നും אֲחֹרַנִּית ‘പിന്നോട്ട്’ എന്നും അർഥമാക്കുന്നു; അഭ്യർഥനയുടെ ഭാവം ‘പോകട്ടെ’ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. നിഴൽ അളക്കപ്പെട്ട ഉപകരണം കൃത്യമായി എന്തായിരുന്നുവെന്നത് മുഖ്യവാക്യത്തിൽ നിർണ്ണയിക്കാതെ, എബ്രായത്തിലെ ‘പടികൾ/കയറ്റങ്ങൾ’ എന്ന ദൃശ്യബിംബം നിലനിർത്തി.
