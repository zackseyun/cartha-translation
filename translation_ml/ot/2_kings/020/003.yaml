id: 2KI.20.3
reference: 2 Kings 20:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָנָּ֣ה יְהוָ֗ה זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵבָ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
translation:
  language: ml
  text: “യഹോവേ, അങ്ങയുടെ മുമ്പാകെ ഞാൻ വിശ്വസ്തതയോടെ[a], പൂർണഹൃദയത്തോടെ[b] നടന്നതും അങ്ങയുടെ ദൃഷ്ടിയിൽ നല്ലതു ചെയ്തതും ദയവായി ഓർക്കണമേ.” പിന്നെ ഹിസ്കീയാവ് വളരെയധികം കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സത്യത്തോടെ.” എബ്രായപദത്തിന് സത്യസന്ധതയെയോ വിശ്വസ്തതയെയോ സൂചിപ്പിക്കാം; ഇവിടെ അത് ദൈവത്തിന്റെ മുമ്പാകെയുള്ള ഹിസ്കീയാവിന്റെ വിശ്വസ്തമായ ജീവിതത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവിഭക്തഹൃദയത്തോടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָּה ... נָא
  choice: ദയവായി ... ഓർക്കണമേ
  rationale: രണ്ട് അപേക്ഷാസൂചക ഘടകങ്ങളുടെയും വിനയവും തീവ്രതയും സ്വാഭാവികമായ ആധുനിക മലയാള പ്രാർഥനാഭാഷയിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവികനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റിസ്ഥാപിക്കാതെ മലയാളത്തിൽ പതിവുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: അങ്ങയുടെ മുമ്പാകെ ഞാൻ ... നടന്നത്
  rationale: ദൈവസന്നിധിയിലെ ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിലും അത് ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: בֶּאֱמֶת
  choice: വിശ്വസ്തതയോടെ
  rationale: ഇവിടെ പദം വസ്തുതാപരമായ സത്യം മാത്രമല്ല, ജീവിതത്തിലെ സത്യസന്ധതയും വിശ്വസ്തതയും സൂചിപ്പിക്കുന്നു; ‘സത്യത്തോടെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: പൂർണഹൃദയത്തോടെ
  rationale: שָׁלֵם സൂചിപ്പിക്കുന്ന സമഗ്രവും വിഭജിക്കപ്പെടാത്തതുമായ ഭക്തിയെ പാപരഹിത പൂർണതയായി വ്യാഖ്യാനിക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ നല്ലതു ചെയ്തത്
  rationale: നന്മയുടെ മാനദണ്ഡം ദൈവത്തിന്റെ വിലയിരുത്തലാണെന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഘടനയും ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: വളരെയധികം കരഞ്ഞു
  rationale: ക്രിയയെയും അതേ ധാതുവിൽനിന്നുള്ള നാമത്തെയും ചേർത്തുള്ള തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘കയ്പോടെ’ എന്ന വികാരനിറം ചേർക്കുന്നില്ല.
- source_word: חִזְקִיָּהוּ
  choice: ഹിസ്കീയാവ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവികനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: നേരിട്ടുള്ള പ്രാർഥനയിൽ വരുന്ന ദൈവത്തിന്റെ വ്യക്തിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: שָׁלֵם ഉപയോഗിച്ചുള്ള ഹിസ്കീയാവിന്റെ സ്വയംവിവരണം
  choice: പൂർണഹൃദയത്തോടെ
  alternative: അവിഭക്തഹൃദയത്തോടെ
  rationale: അവന്റെ അവകാശവാദം പാപരഹിതത്വത്തെക്കുറിച്ചല്ല, സമഗ്രമായ വിശ്വസ്തതയെക്കുറിച്ചാണെന്ന പദാർഥപരിധി സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: בְּכִי גָדוֹל എന്ന തീവ്രപ്രയോഗം
  choice: വളരെയധികം കരഞ്ഞു
  alternative: കയ്പോടെ കരഞ്ഞു
  rationale: എബ്രായത്തിലെ അളവ്/തീവ്രത നേരിട്ട് പകരുന്നു; ‘കയ്പോടെ’ എന്നത് സ്വാഭാവികമായ വ്യാഖ്യാനമാണെങ്കിലും മൂലപദത്തിൽ വ്യക്തമല്ലാത്ത വികാരഗുണം ചേർക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്’ രൂപം സ്വീകരിച്ചു. ‘നടന്നു’ എന്ന ബൈബിൾരൂപകം വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി; കരച്ചിലിന്റെ തീവ്രത അലങ്കാരമില്ലാതെ പറഞ്ഞു.
