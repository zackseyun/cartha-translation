id: 2KI.20.6
reference: 2 Kings 20:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֹסַפְתִּ֣י עַל יָמֶ֗י/ךָ חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִי֙ עַל הָ/עִ֣יר הַ/זֹּ֔את לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
translation:
  language: ml
  text: ഞാൻ നിന്റെ ആയുസ്സിലേക്ക് പതിനഞ്ചു വർഷം കൂടി ചേർക്കും[a]. അശ്ശൂർ രാജാവിന്റെ കൈയിൽനിന്ന്[b] നിന്നെയും ഈ നഗരത്തെയും ഞാൻ വിടുവിക്കും. എന്റെ നിമിത്തവും എന്റെ ദാസനായ ദാവീദിന്റെ നിമിത്തവും ഞാൻ ഈ നഗരത്തെ കാത്തുരക്ഷിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നിന്റെ നാളുകളോട് പതിനഞ്ചു വർഷം ചേർക്കും.’'
    reason: source_idiom
  - marker: b
    text: 'അഥവാ ‘അശ്ശൂർ രാജാവിന്റെ അധികാരത്തിൽനിന്ന്’; അക്ഷരാർഥം: ‘അശ്ശൂർ രാജാവിന്റെ കൈയിൽനിന്ന്.’'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ഈ നഗരത്തെ പ്രതിരോധിക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: ഞാൻ നിന്റെ ആയുസ്സിനോട് പതിനഞ്ചു വർഷംകൂടി ചേർക്കും
  rationale: ‘നിന്റെ നാളുകളോടു കൂട്ടും’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ആയുസ്സിനോട് ... ചേർക്കും’ എന്നു നൽകി; ‘ചേർക്കും’ എന്നത് יסף എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു.
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവിന്റെ കൈയിൽനിന്ന്
  rationale: כַּף എന്ന ‘കൈ’ അധികാരത്തെയോ പിടിയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകമാണ്. മലയാളത്തിലും ഈ പ്രയോഗം ഗ്രാഹ്യമായതിനാൽ രൂപകം നിലനിർത്തി.
- source_word: אַצִּילְךָ וְאֵת הָעִיר הַזֹּאת
  choice: നിന്നെയും ഈ നഗരത്തെയും ഞാൻ വിടുവിക്കും
  rationale: נצל എന്ന ക്രിയ ഇവിടെ ശത്രുവിന്റെ അധികാരത്തിൽനിന്നുള്ള രക്ഷയെ സൂചിപ്പിക്കുന്നു. ‘വിടുവിക്കും’ സൈനിക-രാഷ്ട്രീയ പശ്ചാത്തലത്തിനും രണ്ടു കർമങ്ങളായ ‘നിന്നെയും ഈ നഗരത്തെയും’ എന്ന ഘടനയ്ക്കും യോജിക്കുന്നു.
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  choice: ഞാൻ ഈ നഗരത്തെ കാത്തുരക്ഷിക്കും
  rationale: גנן മൂടുക, സംരക്ഷിക്കുക, പ്രതിരോധിക്കുക എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു. ‘കാത്തുരക്ഷിക്കും’ സംരക്ഷണത്തിന്റെയും പ്രതിരോധത്തിന്റെയും ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְמַעֲנִי וּלְמַעַן דָּוִד עַבְדִּי
  choice: എന്റെ നിമിത്തവും എന്റെ ദാസനായ ദാവീദിന്റെ നിമിത്തവും
  rationale: ദൈവത്തിന്റെ സ്വന്തം നിമിത്തവും ദാസനായ ദാവീദിന്റെ നിമിത്തവും എന്ന പാഠത്തിലെ ഇരട്ട പ്രേരണ വികസിപ്പിക്കാതെയും ലഘൂകരിക്കാതെയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യെരൂശലേമിനെ സംരക്ഷിക്കുന്നതിനുള്ള ദൈവിക കാരണം
  choice: എന്റെ നിമിത്തവും എന്റെ ദാസനായ ദാവീദിന്റെ നിമിത്തവും
  alternative: എന്നെപ്രതിയും ദാവീദിനെപ്രതിയും
  rationale: ദൈവം തന്റെ തന്നെ നിമിത്തവും തന്റെ ദാസനായ ദാവീദിന്റെ നിമിത്തവും നഗരത്തെ സംരക്ഷിക്കുമെന്ന് എബ്രായപാഠം വ്യക്തമായി പറയുന്നു. ഉടമ്പടിസംബന്ധമായ സൂചനയെ പാഠത്തിൽ ഉള്ളതിലധികം വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾഭാഷയാണ് ഉപയോഗിച്ചത്. ‘ആയുസ്സ്’, ‘വിടുവിക്കും’, ‘കാത്തുരക്ഷിക്കും’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലപാഠത്തിലെ രൂപകവും ദൈവശാസ്ത്രപരമായ കാരണഘടനയും നിലനിർത്തുന്നു.
