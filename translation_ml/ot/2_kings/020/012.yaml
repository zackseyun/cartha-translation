reference: 2 Kings 20:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֡יא שָׁלַ֡ח בְּרֹאדַ֣ךְ בַּ֠לְאֲדָן בֶּֽן בַּלְאֲדָ֧ן מֶֽלֶךְ בָּבֶ֛ל סְפָרִ֥ים וּ/מִנְחָ֖ה אֶל חִזְקִיָּ֑הוּ כִּ֣י שָׁמַ֔ע כִּ֥י חָלָ֖ה חִזְקִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
translation:
  language: ml
  text: ആ സമയത്ത് ബാബേൽ രാജാവായ ബലദാന്റെ മകൻ ബെരോദക്ക്-ബലദാൻ[a] ഹിസ്കീയാവിന് കത്തുകളും ഒരു സമ്മാനവും അയച്ചു; കാരണം, ഹിസ്കീയാവ് രോഗിയായിരുന്നെന്ന് അവൻ കേട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ മസോരറ്റിക് പാഠത്തിൽ പേര് ‘ബെരോദക്ക്-ബലദാൻ’ എന്നാണ്. യെശയ്യാവ് 39:1-ൽ ‘മെരോദക്ക്-ബലദാൻ’ എന്ന രൂപം കാണുന്നു; പുരാതന പാഠപരമ്പരകളും പല പരിഭാഷകളും ആ രൂപം പിന്തുടരുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: ആ സമയത്ത്
  rationale: കഥാഖ്യാനത്തിലെ സാധാരണ കാലസൂചകപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
  choice: ബെരോദക്ക്-ബലദാൻ
  rationale: WLC-യിലെ മസോരറ്റിക് വ്യഞ്ജനപാഠം നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു; യെശയ്യാവ് 39:1-ലെ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בֶּן בַּלְאֲדָן
  choice: ബലദാന്റെ മകൻ
  rationale: പിതൃനാമബന്ധം മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥ-ബന്ധഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവ്
  rationale: രാജപദവിയും രാജ്യവും സൂചിപ്പിക്കുന്ന സംയുക്തഘടന; ബൈബിൾഭൂനാമമായ בָּבֶל എന്ന രൂപത്തോടു ചേർന്ന ലിപ്യന്തരണം.
- source_word: סְפָרִים
  choice: എഴുത്തുകൾ
  rationale: പദത്തിന്റെ ബഹുവചനവും എഴുതപ്പെട്ട സന്ദേശങ്ങൾ/രേഖകൾ എന്ന വിശാല അർത്ഥവും കാത്തുസൂക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇവ കത്തുകളായിരിക്കാം.
- source_word: וּמִנְחָה
  choice: ഒരു സമ്മാനവും
  rationale: מִנְחָה എന്നത് സമ്മാനം, കാഴ്ച, കപ്പം എന്നിവ സൂചിപ്പിക്കാം; ഈ നയതന്ത്രസന്ദർഭത്തിൽ ‘സമ്മാനം’ ഏറ്റവും നിഷ്പക്ഷമാണ്.
- source_word: כִּי שָׁמַע
  choice: കാരണം ... അവൻ കേട്ടിരുന്നു
  rationale: ആദ്യ כִּי കാരണത്തെ അവതരിപ്പിക്കുന്നു; മുൻകഴിഞ്ഞ കേൾവിയെ മലയാളത്തിലെ ഭൂതപൂർവകാലം വ്യക്തമാക്കുന്നു.
- source_word: כִּי חָלָה חִזְקִיָּהוּ
  choice: ഹിസ്കീയാവ് രോഗിയായിരുന്നെന്ന്
  rationale: രണ്ടാമത്തെ כִּי കേട്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; പൂർത്തിയായ രോഗാവസ്ഥയെ സന്ദർഭാനുസൃതമായി പ്രകടിപ്പിക്കുന്നു.
