  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥാഖ്യാനശൈലി. മൂലപാഠത്തിലെ പേരുരൂപത്തിന് മുഖ്യപാഠത്തിൽ മുൻഗണന നൽകി; പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
