base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
translation:
  language: ml
  text: '“തിരിച്ചുചെന്ന് എന്റെ ജനത്തിന്റെ നേതാവായ ഹിസ്കീയാവിനോടു പറയുക: ‘നിന്റെ പിതാവായ ദാവീദിന്റെ ദൈവമായ യഹ്വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: നിന്റെ പ്രാർഥന ഞാൻ കേട്ടു; നിന്റെ കണ്ണുനീർ ഞാൻ കണ്ടു. ഇതാ, ഞാൻ നിന്നെ സൗഖ്യമാക്കുന്നു.[a] മൂന്നാം ദിവസം നീ യഹ്വേയുടെ ആലയത്തിലേക്കു കയറിച്ചെല്ലും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞാൻ നിന്നെ സൗഖ്യമാക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഇതാ, ഞാൻ നിന്നെ സൗഖ്യമാക്കുന്നു” എന്നാണ്; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന കൃദ്‌രൂപം ആസന്നമായ പ്രവർത്തനത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
