  rationale: עלהയുടെ ‘കയറിപ്പോകുക’ എന്ന ദിശാഭാവം നിലനിർത്തുന്നു; ഇവിടെ ‘യഹ്വേയുടെ ഭവനം’ ദേവാലയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ആലയം’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: רֹפֶא എന്ന കർത്തൃവാചകത്തിന്റെ കാലഭാവം
  choice: ഞാൻ നിന്നെ സൗഖ്യമാക്കുന്നു
  alternative: ഞാൻ നിന്നെ സൗഖ്യമാക്കും
  rationale: ഹീബ്രുവിലെ കർത്തൃവാചകം ദൈവത്തിന്റെ ആസന്നമായ പ്രവർത്തനത്തെ ഊന്നുന്നു. സന്ദർഭം ഭാവിഫലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ഭാവികാലപരിഭാഷയും സാധ്യമാണ്; ആ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: בֵּית יְהוָה എന്ന പ്രയോഗം
  choice: യഹ്വേയുടെ ആലയം
  alternative: യഹ്വേയുടെ ഭവനം
  rationale: അക്ഷരാർഥം ‘യഹ്വേയുടെ ഭവനം’ ആണെങ്കിലും ഈ സന്ദർഭത്തിൽ അത് ദേവാലയത്തെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്; ‘ആലയം’ സാധാരണ മലയാളവായനക്കാരന് ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ പ്രവാചകശൈലി. പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കിയെങ്കിലും ‘ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു’ എന്ന സന്ദേശസൂത്രത്തിന്റെ ഔപചാരിക ഗൗരവം നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അത് വിശദീകരിക്കുന്ന സൗഖ്യപ്രഖ്യാപനത്തിനുതന്നെ പിന്നാലെ ചേർത്തിരിക്കുന്നു.
