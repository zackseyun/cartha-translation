  text: וַ/יָּבֹא֙ יְשַֽׁעְיָ֣הוּ הַ/נָּבִ֔יא אֶל הַ/מֶּ֖לֶךְ חִזְקִיָּ֑הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו מָ֥ה אָמְר֣וּ הָ/אֲנָשִׁ֣ים הָ/אֵ֗לֶּה וּ/מֵ/אַ֨יִן֙ יָבֹ֣אוּ אֵלֶ֔י/ךָ וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ מֵ/אֶ֧רֶץ רְחוֹקָ֛ה בָּ֖אוּ מִ/בָּבֶֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/014.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him[a], “What did these men say, and where did they come from to you?” And Hezekiah said, “They came to me from a distant land[b], from Babylon.”
translation:
  language: ml
  text: 'അപ്പോൾ യെശയ്യാ പ്രവാചകൻ ഹിസ്കീയാരാജാവിന്റെ അടുക്കൽ വന്ന് അവനോടു ചോദിച്ചു[a]: “ഈ മനുഷ്യർ എന്താണ് പറഞ്ഞത്? അവർ എവിടെനിന്നാണ് നിന്റെ അടുക്കൽ വന്നത്?” ഹിസ്കീയാവ് മറുപടി പറഞ്ഞു: “അവർ ദൂരദേശത്തുനിന്ന്[b], ബാബേലിൽനിന്നാണ് വന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: “അവനോടു പറഞ്ഞു.” തുടർന്ന് ചോദ്യം വരുന്നതിനാൽ മുഖ്യപാഠത്തിൽ “ചോദിച്ചു” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “ദൂരദേശത്തുനിന്ന്” എന്നു ആദ്യം പറഞ്ഞശേഷം “ബാബേലിൽനിന്ന്” എന്നു സ്ഥലം വ്യക്തമാക്കുന്നു. സന്ദർശകർ വളരെ ദൂരത്തുനിന്നുള്ളവരാണെന്ന ഹിസ്കീയാവിന്റെ ഊന്നൽ ഇതിലൂടെ നിലനിൽക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അപ്പോൾ ... വന്ന്
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: യെശയ്യാ പ്രവാചകൻ
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപവും അവന്റെ നിർദ്ദിഷ്ട സ്ഥാനപ്പേരും നിലനിർത്തുന്നു.
- source_word: אֶל־הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: ഹിസ്കീയാരാജാവിന്റെ അടുക്കൽ
  rationale: രാജപദവിയും വ്യക്തിനാമവും സ്വാഭാവിക മലയാളത്തിൽ ചേർത്തു നൽകുന്നു; אֶל എന്ന ദിശാസൂചനയും പ്രകടമാക്കുന്നു.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: അവനോടു ചോദിച്ചു
  rationale: പദശഃ ‘അവനോടു പറഞ്ഞു’ എന്നാണെങ്കിലും തുടർന്ന് നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് പ്രസംഗക്രിയയുടെ സ്വാഭാവിക സന്ദർഭാർഥമാണ്.
- source_word: מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה
  choice: ഈ മനുഷ്യർ എന്താണ് പറഞ്ഞത്?
  rationale: אֲנָשִׁים എന്ന പുരുഷബഹുവചനവും പൂർത്തിയായ പ്രസംഗത്തെക്കുറിച്ചുള്ള ചോദ്യം എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: അവർ എവിടെനിന്നാണ് നിന്റെ അടുക്കൽ വന്നത്?
  rationale: ഇംപെർഫെക്റ്റ് രൂപത്തിന്റെ ഔപചാരിക വർത്തമാനസാധ്യത നിലനിൽക്കുന്നുവെങ്കിലും കഥാസന്ദർഭം കഴിഞ്ഞുവരവിനെയാണ് സൂചിപ്പിക്കുന്നത്; אֵלֶיךָ എന്നത് ‘നിന്റെ അടുക്കൽ’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: ദൂരദേശത്തുനിന്ന്
  rationale: ഭൗമിക അകലം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: מִבָּבֶל
  choice: ബാബേലിൽനിന്ന്
  rationale: സ്ഥലനാമത്തിന്റെ പരിചിതമായ മലയാള ബൈബിൾരൂപം ഉപയോഗിച്ച് ഉത്ഭവസ്ഥലം വ്യക്തമാക്കുന്നു.
