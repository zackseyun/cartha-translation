id: 2KI.20.8
reference: 2 Kings 20:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַׁעְיָ֔הוּ מָ֣ה א֔וֹת כִּֽי יִרְפָּ֥א יְהוָ֖ה לִ֑/י וְ/עָלִ֛יתִי בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
translation:
  language: ml
  text: 'ഹിസ്കീയാവ് യെശയ്യാവിനോടു പറഞ്ഞു: “യഹ്‌വെ എന്നെ സൗഖ്യമാക്കുകയും മൂന്നാം ദിവസം ഞാൻ യഹ്‌വെയുടെ ആലയത്തിലേക്കു[a] കയറിച്ചെല്ലുകയും ചെയ്യുമെന്നതിന്റെ അടയാളം എന്താണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “യഹ്‌വെയുടെ ഭവനം.”'
    reason: בֵּית יְהוָה എന്നതിന്റെ അക്ഷരാർഥം ‘യഹ്‌വെയുടെ ഭവനം’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് യഹ്‌വെയുടെ ആലയത്തെ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: തുടർച്ചയായ എബ്രായ ആഖ്യാനത്തിലെ ഭൂതകാലക്രിയയെ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു; പ്രത്യേകമായ കാലക്രമസൂചന അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: חִזְקִיָּהוּ
  choice: ഹിസ്കീയാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും ആധുനികവുമായ ലിപ്യന്തരണം.
- source_word: יְשַׁעְיָהוּ
  choice: യെശയ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: אוֹת
  choice: ഉറപ്പിക്കുന്ന അടയാളം
  rationale: ദൈവിക വാഗ്ദാനം സത്യമാണെന്ന് സ്ഥിരീകരിക്കുന്ന സൂചനയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ‘അടയാളം’ എന്ന പ്രധാന അർഥം നിലനിർത്തിക്കൊണ്ട് സന്ദർഭപരമായ സ്ഥിരീകരണഭാവം വ്യക്തമാക്കുന്നു.
- source_word: יִרְפָּא
  choice: സൗഖ്യമാക്കും
  rationale: അപൂർണക്രിയയുടെ ഭാവികാലസൂചനയും രോഗശാന്തിയുടെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരോ പദവിയോ ഉപയോഗിച്ച് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וְעָלִיתִי
  choice: ഞാൻ ... കയറിപ്പോകും
  rationale: עלה എന്ന ക്രിയയിലെ മുകളിലേക്കുള്ള യാത്രയുടെ ദിശാഭാവം നിലനിർത്തുന്നു; ദേവാലയത്തിലേക്കുള്ള യാത്ര എന്ന സന്ദർഭത്തിലും ഇത് സ്വാഭാവികമാണ്.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: എബ്രായ കാലസൂചനയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ആലയം
  rationale: ‘യഹ്‌വെയുടെ ഭവനം’ എന്ന അക്ഷരാർഥം ദേവാലയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ആലയം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു.
- issue: അടയാളം ഉറപ്പിക്കുന്ന കാര്യങ്ങളുടെ ബന്ധം
  choice: സൗഖ്യമാക്കലും മൂന്നാം ദിവസം ആലയത്തിലേക്കു പോകലും ഒരേ അടയാളം സ്ഥിരീകരിക്കുന്ന രണ്ട് ബന്ധപ്പെട്ട കാര്യങ്ങളായി അവതരിപ്പിച്ചു
  alternative: അടയാളം സൗഖ്യമാക്കലിനെ മാത്രം സ്ഥിരീകരിക്കുന്നതായി വായിക്കുക
  rationale: כִּי എന്നതിനു പിന്നാലെ יִרְפָּא എന്നും וְעָלִיתִי എന്നും ഏകോപിപ്പിച്ചിരിക്കുന്നതിനാൽ രണ്ടും അഭ്യർഥിച്ച അടയാളത്തിന്റെ ഉള്ളടക്കത്തിൽ ഉൾപ്പെടുന്നു; ഈ വ്യാകരണബന്ധം മലയാളത്തിൽ ‘എന്നും ... എന്നും’ ഉപയോഗിച്ച് വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങൾ പരിചിതമായ മലയാളരൂപത്തിൽ നൽകി; ദൈവനാമം ലിപ്യന്തരം ചെയ്തു. മൂലത്തിലെ ചോദ്യഘടന നിലനിർത്തിക്കൊണ്ട് അതിന്റെ സ്ഥിരീകരണഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കാൻ ‘ഉറപ്പിക്കുന്ന’ എന്നു ചേർത്തു.
