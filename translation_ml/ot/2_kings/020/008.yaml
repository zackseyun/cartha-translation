  terminology: ‘യഹ്‌വെ’ appropriately renders יהוה as a personal name. ‘ആലയം’ is an appropriate contextual rendering of בֵּית יְהוָה; the literal ‘ഭവനം’ is retained in the footnote. The personal names are acceptable established Malayalam forms.
