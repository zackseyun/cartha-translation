translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ആവർത്തനവും സമഗ്രതയും നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളവാക്യക്രമം ഉപയോഗിച്ചു.
