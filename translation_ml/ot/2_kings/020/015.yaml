  text: וַ/יֹּ֕אמֶר מָ֥ה רָא֖וּ בְּ/בֵיתֶ֑/ךָ וַ/יֹּ֣אמֶר חִזְקִיָּ֗הוּ אֵ֣ת כָּל אֲשֶׁ֤ר בְּ/בֵיתִ/י֙ רָא֔וּ לֹא הָיָ֥ה דָבָ֛ר אֲשֶׁ֥ר לֹֽא הִרְאִיתִ֖/ם בְּ/אֹצְרֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/015.yaml
  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
translation:
  language: ml
  text: 'അവൻ ചോദിച്ചു: “അവർ നിന്റെ വീട്ടിൽ[a] എന്താണ് കണ്ടത്?” ഹിസ്കീയാവ് പറഞ്ഞു: “എന്റെ വീട്ടിലുള്ളതെല്ലാം അവർ കണ്ടു. എന്റെ ഭണ്ഡാരങ്ങളിൽ[b] ഞാൻ അവർക്കു കാണിച്ചുകൊടുക്കാതിരുന്ന ഒന്നും ഉണ്ടായിരുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൊട്ടാരത്തിൽ.” എബ്രായത്തിൽ “വീട്ടിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “സംഭരണശാലകളിൽ.” എബ്രായപദം വിലപിടിപ്പുള്ള വസ്തുക്കളോ മറ്റു സാധനങ്ങളോ സൂക്ഷിക്കുന്ന ഇടങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: എന്താണ്
  rationale: യെശയ്യാവിന്റെ നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: רָאוּ
  choice: കണ്ടത് / കണ്ടു
  rationale: ראה എന്ന സാധാരണ കാണൽക്രിയയുടെ ഭൂതകാല അർഥം സന്ദർഭാനുസൃതമായി നിലനിർത്തുന്നു.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: നിന്റെ വീട്ടിൽ / എന്റെ വീട്ടിലുള്ള
  rationale: בַּיִת എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘വീട്’ നിലനിർത്തുന്നു; രാജസന്ദർഭത്തിൽ ‘കൊട്ടാരം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: חִזְקִיָּהוּ
  choice: ഹിസ്കീയാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: എന്റെ വീട്ടിലുള്ളതെല്ലാം
  rationale: כָּל אֲשֶׁר നൽകുന്ന സമഗ്രത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא הָיָה דָבָר
  choice: ഒന്നും ഉണ്ടായിരുന്നില്ല
  rationale: ഹീബ്രു അസ്തിത്വനിഷേധഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אֲשֶׁר לֹא הִרְאִיתִם
  choice: ഞാൻ അവർക്കു കാണിച്ചുകൊടുക്കാത്തതായി
  rationale: ראה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘കാണാൻ ഇടയാക്കുക/കാണിച്ചുകൊടുക്കുക’ എന്ന കാരകാർഥവും ബഹുവചന കർമസർവനാമവും നിലനിർത്തുന്നു.
- source_word: בְּאֹצְרֹתָי
  choice: എന്റെ ഭണ്ഡാരങ്ങളിൽ
  rationale: אֹצָר വിലപിടിപ്പുള്ള വസ്തുക്കളോ സംഭരണസാധനങ്ങളോ സൂക്ഷിക്കുന്ന ഇടത്തെ സൂചിപ്പിക്കുന്നു; രാജസന്ദർഭത്തിൽ ‘ഭണ്ഡാരം’ യോജിക്കുന്നു.
