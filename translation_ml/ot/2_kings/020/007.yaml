source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְשַֽׁעְיָ֔הוּ קְח֖וּ דְּבֶ֣לֶת תְּאֵנִ֑ים וַ/יִּקְח֛וּ וַ/יָּשִׂ֥ימוּ עַֽל הַ/שְּׁחִ֖ין וַ/יֶּֽחִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/007.yaml
  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
translation:
  language: ml
  text: 'അപ്പോൾ യെശയ്യാവ് പറഞ്ഞു: “അമർത്തിയ അത്തിപ്പഴക്കട്ട എടുക്കുക.” അവർ അതെടുത്ത് പരുവിന്മേൽ വെച്ചു; അവൻ സുഖം പ്രാപിച്ചു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “അവൻ ജീവിച്ചു”; ഈ സന്ദർഭത്തിൽ അവൻ സുഖം പ്രാപിച്ചു എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ സംഭവക്രമം വ്യക്തമാക്കുന്നു.
- source_word: יְשַׁעְיָהוּ
  choice: യെശയ്യാവ്
  rationale: പ്രവാചകന്റെ പേരിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള സുപരിചിത രൂപം.
- source_word: קְחוּ
  choice: എടുക്കുക
  rationale: לקח എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപത്തിന് നേരിട്ടുള്ള തുല്യം; മൂലത്തിൽ ഇല്ലാത്ത ദിശാസൂചന ‘കൊണ്ടുവരുക’ എന്നതുപോലെ ചേർക്കുന്നില്ല.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: അത്തിപ്പഴം അമർത്തിയുണ്ടാക്കിയ ഒരു കട്ട
  rationale: דבלה ഉണക്കിയ പഴങ്ങൾ അമർത്തിയുണ്ടാക്കിയ കട്ടയെയോ പിണ്ഡത്തെയോ സൂചിപ്പിക്കുന്നു; תאנים അതിനെ അത്തിപ്പഴമെന്ന് വ്യക്തമാക്കുന്നു. ‘അത്തിപ്പഴക്കട്ട’ എന്നതിനെക്കാൾ ഈ രൂപം സാധാരണ വായനക്കാർക്ക് വസ്തുവിന്റെ സ്വഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּקְחוּ
  choice: അവർ അതെടുത്തു
  rationale: ക്രിയ ബഹുവചനമാണ്; മുൻ ആജ്ഞയിലെ വസ്തു മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘അത്’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וַיָּשִׂימוּ עַל
  choice: മേൽ വെച്ചു
  rationale: שים എന്ന പൊതുവായ സ്ഥാപിക്കൽക്രിയയ്ക്കും על എന്ന സ്ഥാനസൂചകത്തിനും സ്വാഭാവികവും അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമായ മലയാളം.
- source_word: הַשְּׁחִין
  choice: പരു
  rationale: שחין ഒരു തിളച്ചുയർന്ന, വീക്കമുള്ള ചർമ്മവ്രണമോ പരുവോ സൂചിപ്പിക്കുന്നു; ‘പരു’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാള പദമാണ്.
- source_word: וַיֶּחִי
  choice: അങ്ങനെ അവൻ സുഖം പ്രാപിച്ചു
  rationale: חיה എന്നതിന്റെ അക്ഷരാർഥം ‘ജീവിച്ചു’ എന്നാണെങ്കിലും, ഈ രോഗശാന്തിസന്ദർഭത്തിൽ ആരോഗ്യം വീണ്ടെടുത്തതാണു സൂചിപ്പിക്കുന്നത്. ‘അങ്ങനെ’ പ്രയോഗത്തിനുശേഷമുള്ള ഫലം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: וַיֶּחִי സൂചിപ്പിക്കുന്ന ഫലത്തിന്റെ സ്വഭാവം
  choice: അവൻ സുഖം പ്രാപിച്ചു
  alternative: അവൻ ജീവിച്ചു
  rationale: മൂലക്രിയയുടെ അക്ഷരാർഥം ‘ജീവിച്ചു’ എന്നാകാമെങ്കിലും, ഹിസ്കീയാവിന്റെ രോഗത്തിനും പരുവിന്മേലുള്ള പ്രയോഗത്തിനും ഉള്ള ഉടൻസന്ദർഭം രോഗമുക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. പുനരുത്ഥാനമോ മറ്റൊരു പ്രത്യേക സിദ്ധാന്തമോ ഇതിൽ ചേർക്കുന്നില്ല; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആഖ്യാനത്തിന്റെ ലളിതമായ ഒഴുക്ക് നിലനിർത്തി; അത്തിപ്പഴക്കട്ടയുടെ സ്വഭാവം ചുരുക്കത്തിൽ തുറന്നുപറഞ്ഞു. മൂലത്തിലെ ‘ജീവിച്ചു’ എന്ന ഭാഷാപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
