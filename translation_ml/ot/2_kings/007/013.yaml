  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ ദാസന്മാരിൽ ഒരാൾ മറുപടി പറഞ്ഞു: “ദയവായി, ശേഷിച്ചിരിക്കുന്നതും അതിൽ[a] ബാക്കിയായിരിക്കുന്നതുമായ കുതിരകളിൽ അഞ്ചെണ്ണം അവർ എടുത്തുകൊള്ളട്ടെ. ഇതാ, അവ അതിൽ ശേഷിച്ചിരിക്കുന്ന ഇസ്രായേൽജനസമൂഹം മുഴുവനെയുംപോലെയാണ്; ഇതാ, അവ നശിച്ചുപോയ ഇസ്രായേൽജനസമൂഹം മുഴുവനെയുംപോലെയാണ്.[b] നമുക്ക് അയച്ചു നോക്കാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിൽ’ എന്ന എബ്രായ സർവനാമം ശമര്യനഗരത്തെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഈ വാക്യത്തിൽ ‘നഗരം’ എന്ന നാമം വീണ്ടും പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: 'ഈ വാക്യത്തിലെ എബ്രായ താരതമ്യം ദുഷ്കരവും ആവർത്തനപരവുമാണ്: ‘അതിൽ ശേഷിച്ചിരിക്കുന്ന ഇസ്രായേൽജനസമൂഹം മുഴുവനെയുംപോലെ ... നശിച്ചുപോയ ഇസ്രായേൽജനസമൂഹം മുഴുവനെയുംപോലെ.’ ഈ ആവർത്തനം ലളിതമാക്കി മാറ്റാതെ പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നു.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵעֲבָדָיו וַיֹּאמֶר
  choice: അവന്റെ ദാസന്മാരിൽ ഒരാൾ മറുപടി പറഞ്ഞു
  rationale: രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിലും עֶבֶד എന്ന പദത്തിന്റെ വിശാലമായ അർഥപരിധി നിലനിർത്താൻ ‘ദാസൻ’ ഉപയോഗിച്ചു; ענה ... ויאמר എന്ന സാധാരണ എബ്രായ വാക്യാരംഭം സ്വാഭാവിക മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്നു നൽകി.
- source_word: וְיִקְחוּ נָא
  choice: അവർ എടുത്തുകൊള്ളട്ടെ
  rationale: ജസ്സീവ് രൂപവും നָא നൽകുന്ന വിനീതമായ അഭ്യർഥനാഭാവവും മലയാളത്തിലെ ‘-ട്ടെ’ രൂപത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: חֲמִשָּׁה מִן הַסּוּסִים
  choice: കുതിരകളിൽ അഞ്ചെണ്ണം
  rationale: ഭാഗസൂചകമായ מִן മലയാളത്തിൽ സ്വാഭാവികമായി ‘-കളിൽ അഞ്ചെണ്ണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ בָהּ
  choice: ശേഷിച്ചിരിക്കുന്നതും അതിൽ ബാക്കിയായിരിക്കുന്നതുമായ
  rationale: שׁאר ധാതുവിന്റെ ആവർത്തനം പൂർണമായി ഒഴിവാക്കാതെ ‘ശേഷിച്ചിരിക്കുന്നതും ... ബാക്കിയായിരിക്കുന്നതുമായ’ എന്ന സമാന്തര പ്രയോഗത്തിൽ നിലനിർത്തി; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം സൂചിപ്പിക്കുന്ന നാമം മൂലപാഠത്തിൽ ചേർത്തിട്ടില്ലാത്തതിനാൽ ‘അതിൽ’ എന്നു തന്നെയാക്കി.
- source_word: הִנָּם
  choice: ഇതാ, അവ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּה ഘടകത്തിന്റെ ശക്തി നിലനിർത്താൻ ആധുനികവും മാന്യവുമായ ‘ഇതാ’ ഉപയോഗിച്ചു; ആവർത്തനം രണ്ടിടത്തും സംരക്ഷിച്ചു.
- source_word: כְּכָל הֲמוֹן יִשְׂרָאֵל
  choice: ഇസ്രായേൽജനസമൂഹം മുഴുവനെയുംപോലെ
  rationale: הָמוֹן എന്ന കൂട്ടസൂചക പദത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ജനസമൂഹം’ തെരഞ്ഞെടുത്തു; כְּכָל എന്ന സമഗ്രമായ താരതമ്യം ‘മുഴുവനെയുംപോലെ’ എന്ന് നിലനിർത്തി.
- source_word: אֲשֶׁר תָּמּוּ
  choice: നശിച്ചുപോയ
  rationale: ക്ഷാമത്തിന്റെയും മരണത്തിന്റെയും പശ്ചാത്തലത്തിൽ תָּמּוּ സൂചിപ്പിക്കുന്ന ‘അവസാനിച്ചുപോകുക/നശിക്കുക’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְנִשְׁלְחָה וְנִרְאֶה
  choice: നമുക്ക് ആളയച്ചു നോക്കാം
  rationale: രണ്ട് ഒന്നാംപുരുഷ ബഹുവചന കോഹോർട്ടേറ്റീവുകളുടെ നിർദേശഭാവം ‘നമുക്ക് ... നോക്കാം’ എന്നു നൽകി; ‘അയയ്ക്കുക’ എന്നതിന് ആവശ്യമായ കർമം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ആൾ’ ചേർത്തു.
