translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ അസാധാരണവും ആവർത്തനപരവുമായ താരതമ്യം വ്യാഖ്യാനിച്ച് മിനുക്കാതെ സംരക്ഷിച്ചു; ‘അതിൽ’ എന്ന സർവനാമത്തിന്റെ സാധ്യതയുള്ള സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
