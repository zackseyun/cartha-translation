  terminology: ‘ദാസന്മാർ,’ ‘കുതിരകൾ,’ ‘ഇസ്രായേൽജനസമൂഹം,’ and ‘നശിച്ചുപോയ’ are suitable in register and sense. The wording maintains the difficult repeated comparison without doctrinal or explanatory smoothing.
