id: 2KI.7.1
reference: 2 Kings 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע שִׁמְע֖וּ דְּבַר יְהוָ֑ה כֹּ֣ה אָמַ֣ר יְהוָ֗ה כָּ/עֵ֤ת מָחָר֙ סְאָֽה סֹ֣לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל בְּ/שַׁ֥עַר שֹׁמְרֽוֹן־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
translation:
  language: ml
  text: 'അപ്പോൾ എലീശാ പറഞ്ഞു: “യഹ്‌വേയുടെ വചനം കേൾക്കുക. യഹ്‌വേ ഇപ്രകാരം പറയുന്നു: നാളെ ഏകദേശം ഈ സമയത്ത്, ശമര്യയുടെ കവാടത്തിൽ ഒരു ശേക്കെലിന് ഒരു സെയാ[a] നന്നായി അരച്ച മാവും, ഒരു ശേക്കെലിന് രണ്ട് സെയാ യവവും ലഭിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സെയാ’ പുരാതനകാലത്തെ ഉണങ്ങിയ സാധനങ്ങൾ അളക്കാനുള്ള ഒരു അളവായിരുന്നു; എബ്രായപാഠം പൊതുവായ ‘അളവ്’ എന്നതിനു പകരം ഈ നിർദിഷ്ട അളവുപദമാണ് ഉപയോഗിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ ക്രമബോധം നിലനിർത്തുന്നു.
- source_word: שִׁמְעוּ
  choice: കേൾക്കുക
  rationale: ബഹുവചന ആജ്ഞയുടെ പ്രവാചകീയ ആഹ്വാനം ലളിതവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: דְּבַר יְהוָה
  choice: യഹ്‌വേയുടെ വചനം
  rationale: പ്രവാചകീയ സൂത്രവാക്യത്തിലെ ‘വചനം’ എന്ന ആശയവും ദൈവനാമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വേ ഇപ്രകാരം പറയുന്നു
  rationale: പരമ്പരാഗത പ്രവാചക-ദൂതസൂത്രത്തിന്റെ ഔപചാരിക ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: כָּעֵת מָחָר
  choice: നാളെ ഈ സമയത്തോടടുത്ത്
  rationale: כְּ സൂചിപ്പിക്കുന്ന ഏകദേശ സമയാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: סְאָה / סָאתַיִם
  choice: ഒരു സെയാ / രണ്ടു സെയാ
  rationale: പൊതുവായ ‘അളവ്’ എന്നതിനു പകരം നിർദിഷ്ട പുരാതന ഉണങ്ങിയ അളവുപദം ലിപ്യന്തരണം ചെയ്ത് സാമ്പത്തിക വിശദാംശം സംരക്ഷിക്കുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: സാധാരണ മാവല്ല, നന്നായി അരിച്ച സൂക്ഷ്മമായ മാവാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: בְּשֶׁקֶל
  choice: ഒരു ശേക്കെലിന്
  rationale: വിപണിവില സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׂעֹרִים
  choice: യവം
  rationale: ധാന്യപദത്തിന്റെ കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: ശമര്യയുടെ കവാടത്തിൽ
  rationale: നഗരകവാടം വ്യാപാരവും പൊതുപ്രവർത്തനവും നടന്ന സ്ഥലമായിരുന്നുവെന്ന പശ്ചാത്തലത്തോട് യോജിക്കുന്ന നേരിട്ടുള്ള വിവർത്തനം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: പ്രഖ്യാപിച്ച വിപണിവിലയുടെ ഉറപ്പും ഭാവികാലവും
  choice: ലഭിക്കും
  alternative: വിലയായിരിക്കും
  rationale: എബ്രായ നാമവാക്യം നാളത്തെ വിപണി ലഭ്യതയും വിലയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. ‘ലഭിക്കും’ ക്ഷാമസന്ദർഭത്തിലെ സമൃദ്ധിയുടെ അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുമ്പോഴും നിർദിഷ്ട വിലകൾ മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രവാചകീയ ശൈലി സ്വീകരിച്ചു. അത്യന്തം പഴയ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി; ദൈവനാമവും പുരാതന അളവുകളും ലിപ്യന്തരണം ചെയ്തു.
