  text: וַ/יִּקְרָ֖א הַ/שֹּֽׁעֲרִ֑ים וַ/יַּגִּ֕ידוּ בֵּ֥ית הַ/מֶּ֖לֶךְ פְּנִֽימָה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/011.yaml
  text: Then the gatekeepers called out and reported it inside the king’s house[a].
translation:
  language: ml
  text: അപ്പോൾ കവാടകാവൽക്കാർ വിളിച്ചുപറഞ്ഞു; അവർ ആ വിവരം രാജഭവനത്തിനുള്ളിലേക്ക് അറിയിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രാജാവിന്റെ വീട്ടിനകത്തേക്ക് അറിയിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിൽ അക്ഷരാർഥം ‘രാജാവിന്റെ വീടിനകത്തേക്ക്’ എന്നാണ്. ഇത് രാജഭവനത്തെയോ അവിടെയുള്ള രാജകീയ ഗൃഹവ്യവസ്ഥയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ചുപറഞ്ഞു
  rationale: קרא എന്ന ക്രിയ ഇവിടെ വാർത്ത അറിയിക്കാനായി ഉറക്കെ വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ക്രിയ ഏകവചനത്തിലാണെങ്കിലും പിന്നാലെയുള്ള ‘പടിവാതിൽകാവൽക്കാർ’ എന്ന കൂട്ടത്തെ സമാഹാരമായി കാണുന്നു.
- source_word: הַשֹּׁעֲרִים
  choice: പടിവാതിൽകാവൽക്കാർ
  rationale: നഗരവാതിലിൽ കാവൽനിന്നവരെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ചുമതല വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക രൂപമാണിത്.
- source_word: וַיַּגִּידוּ
  choice: ആ വിവരം … അറിയിച്ചു
  rationale: נגד ഇവിടെ അറിഞ്ഞ കാര്യം ഔദ്യോഗികമായി അറിയിക്കുകയോ റിപ്പോർട്ട് ചെയ്യുകയോ ചെയ്യുന്നതാണ്. എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽനിന്ന് ‘ആ വിവരം’ ചേർക്കുന്നത് മലയാളത്തിൽ വ്യക്തത നൽകുന്നു.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജഭവനം
  rationale: അക്ഷരാർഥം ‘രാജാവിന്റെ വീട്’ എന്നാണ്. ഇവിടെ രാജാവിന്റെ വസതിയോ അതുമായി ബന്ധപ്പെട്ട അകത്തെ ആളുകളോ ഉദ്ദേശിക്കാം; ‘രാജഭവനം’ സ്വാഭാവികമാണെങ്കിലും അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: פְּנִימָה
  choice: അകത്തേക്ക്
  rationale: വാതിലിൽനിന്ന് രാജഭവനത്തിന്റെ ഉൾഭാഗത്തേക്കുള്ള ദിശയെയോ വാർത്ത അകത്തേക്കു കൈമാറിയതിനെയോ സൂചിപ്പിക്കുന്നതിനാൽ ദിശാബോധമുള്ള ഈ രൂപം തെരഞ്ഞെടുത്തു.
