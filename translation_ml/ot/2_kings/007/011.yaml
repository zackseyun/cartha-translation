translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പടിവാതിൽകാവൽക്കാർ’ നഗരവാതിലിലെ ഉദ്യോഗസ്ഥരെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ഏകവചന ക്രിയയും പിന്നാലെയുള്ള ബഹുവചന സമാഹാരനാമവും മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനമായി അവതരിപ്പിച്ചു; בֵּית הַמֶּלֶךְ എന്നതിലെ കെട്ടിടം/രാജകുടുംബം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
