source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ לֹֽא כֵ֣ן אֲנַ֣חְנוּ עֹשִׂ֗ים הַ/יּ֤וֹם הַ/זֶּה֙ יוֹם בְּשֹׂרָ֣ה ה֔וּא וַ/אֲנַ֣חְנוּ מַחְשִׁ֗ים וְ/חִכִּ֛ינוּ עַד א֥וֹר הַ/בֹּ֖קֶר וּ/מְצָאָ֣/נוּ עָו֑וֹן וְ/עַתָּה֙ לְכ֣וּ וְ/נָבֹ֔אָה וְ/נַגִּ֖ידָה בֵּ֥ית הַ/מֶּֽלֶךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ പരസ്പരം പറഞ്ഞു: “നാം ചെയ്യുന്നത് ശരിയല്ല. ഇന്ന് നല്ല വാർത്തയുടെ ദിവസമാണ്; നാമോ മിണ്ടാതിരിക്കുന്നു. പ്രഭാതവെളിച്ചംവരെ കാത്തിരുന്നാൽ കുറ്റം നമ്മെ തേടിയെത്തും[a]. ഇപ്പോൾ വരൂ, നമുക്ക് പോയി രാജാവിന്റെ ഭവനത്തിൽ ഈ വിവരം അറിയിക്കാം[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശിക്ഷ നമ്മെ തേടിയെത്തും” അല്ലെങ്കിൽ “നാം കുറ്റക്കാരായിത്തീരും.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “കുറ്റം/അകൃത്യം നമ്മെ കണ്ടെത്തും” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “രാജാവിന്റെ ഭവനം” എന്നത് രാജാവിന്റെ ഭവനം, രാജകുടുംബം/രാജപരിവാരം, അല്ലെങ്കിൽ രാജകൊട്ടാരം എന്നിങ്ങനെയും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֲנַחְנוּ עֹשִׂים
  choice: നാം ചെയ്യുന്നത് ശരിയല്ല
  rationale: ‘നാം ഇങ്ങനെ ചെയ്യുന്നത് ശരിയല്ല’ എന്ന ധാർമിക വിലയിരുത്തൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יוֹם בְּשֹׂרָה
  choice: സുവാർത്തയുടെ ദിവസം
  rationale: בְּשֹׂרָה ഇവിടെ വിടുതലിനെക്കുറിച്ചുള്ള നല്ല വാർത്തയെ സൂചിപ്പിക്കുന്നു; ‘സുവാർത്ത’ ചുരുക്കവും സാഹചര്യോചിതവുമാണ്.
- source_word: מַחְשִׁים
  choice: മിണ്ടാതിരിക്കുന്നു
  rationale: വാർത്ത മനപ്പൂർവം വെളിപ്പെടുത്താതെ തുടരുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְחִכִּינוּ עַד אוֹר הַבֹּקֶר
  choice: പ്രഭാതവെളിച്ചംവരെ കാത്തിരുന്നാൽ
  rationale: സന്ദർഭത്തിലെ വ്യവസ്ഥാർഥവും ‘പ്രഭാതത്തിന്റെ വെളിച്ചം’ എന്ന ദൃശ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: וּמְצָאנוּ עָוֹן
  choice: കുറ്റം നമ്മെ തേടിയെത്തും
  rationale: ‘കുറ്റം/അകൃത്യം നമ്മെ കണ്ടെത്തും’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകവും കുറ്റബാധ്യതയോ അതിന്റെ ശിക്ഷയോ എന്ന അർഥവ്യാപ്തിയും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: לְכוּ וְנָבֹאָה
  choice: വരൂ, നമുക്ക് പോയി
  rationale: ഉടൻ പ്രവർത്തിക്കാനുള്ള ആഹ്വാനം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְנַגִּידָה
  choice: അറിയിക്കാം
  rationale: അധികാരപ്പെട്ടവരോട് അടിയന്തരവാർത്ത അറിയിക്കുന്ന സന്ദർഭത്തിന് യോജിച്ച ലളിതമായ പ്രയോഗമാണ്.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജഗൃഹത്തെ
  rationale: ‘രാജാവിന്റെ ഭവനം’ എന്ന അക്ഷരാർഥത്തോടൊപ്പം രാജകുടുംബം, രാജപരിവാരം, കൊട്ടാരം എന്നീ സാധ്യതകളും തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: עָוֹן എന്ന പദം കുറ്റത്തെയോ അതിന്റെ ശിക്ഷയെയോ സൂചിപ്പിക്കുന്നതാണോ
  choice: കുറ്റം നമ്മെ തേടിയെത്തും
  alternative: ശിക്ഷ നമ്മെ തേടിയെത്തും; നാം കുറ്റക്കാരായിത്തീരും
  rationale: മൂലപാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തി മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘പ്രഭാതവെളിച്ചം,’ ‘കുറ്റം നമ്മെ തേടിയെത്തും,’ ‘രാജഗൃഹം’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യഭാവവും യഥാർഥ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
