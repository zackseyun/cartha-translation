revisions:
- from: 'അപ്പോൾ അവർ പരസ്പരം പറഞ്ഞു: “നാം ചെയ്യുന്നത് ശരിയല്ല. ഇന്ന് സുവാർത്തയുടെ ദിവസമാണ്; നാമോ മിണ്ടാതിരിക്കുന്നു. പ്രഭാതവെളിച്ചംവരെ കാത്തിരുന്നാൽ കുറ്റം നമ്മെ തേടിയെത്തും[a]. ഇപ്പോൾ വരൂ, നമുക്ക് പോയി രാജഗൃഹത്തെ[b] അറിയിക്കാം.”'
  to: 'അപ്പോൾ അവർ പരസ്പരം പറഞ്ഞു: “നാം ചെയ്യുന്നത് ശരിയല്ല. ഇന്ന് നല്ല വാർത്തയുടെ ദിവസമാണ്; നാമോ മിണ്ടാതിരിക്കുന്നു. പ്രഭാതവെളിച്ചംവരെ കാത്തിരുന്നാൽ കുറ്റം നമ്മെ തേടിയെത്തും[a]. ഇപ്പോൾ വരൂ, നമുക്ക് പോയി രാജാവിന്റെ ഭവനത്തിൽ ഈ വിവരം അറിയിക്കാം[b].”'
  rationale: The revision replaces potentially technical religious terminology with the ordinary modern Malayalam equivalent for good news and makes the final reporting clause idiomatic. It otherwise retains the draft’s faithful handling of the Hebrew wording and its ambiguity regarding עָוֹן.
