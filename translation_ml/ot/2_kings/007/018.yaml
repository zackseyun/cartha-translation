- from: 'ദൈവപുരുഷൻ രാജാവിനോടു പറഞ്ഞതുപോലെതന്നെ സംഭവിച്ചു[a]. അദ്ദേഹം പറഞ്ഞത്: “നാളെ ഏകദേശം ഈ സമയത്ത് ശമര്യയുടെ പടിവാതിൽക്കൽ രണ്ടു സെയാ യവം ഒരു ശേക്കെലിനും ഒരു സെയാ നേരിയ മാവ് ഒരു ശേക്കെലിനും ലഭിക്കും[b].”'
  to: 'ദൈവപുരുഷൻ രാജാവിനോടു പറഞ്ഞതുപോലെതന്നെ സംഭവിച്ചു[a]. അദ്ദേഹം ഇപ്രകാരം പറഞ്ഞിരുന്നു: “നാളെ ഏകദേശം ഈ സമയത്ത് ശമര്യയുടെ നഗരകവാടത്തിൽ രണ്ടു സെയാ യവം ഒരു ശേക്കെലിന്, ഒരു സെയാ നന്നായി അരിച്ച മാവ് ഒരു ശേക്കെലിന് ലഭിക്കും[b].”'
  rationale: മൂലപാഠത്തിലെ പ്രവചനനിറവേറ്റൽ, അളവ്-വിലസമാന്തരത, ‘fine flour’ എന്ന പ്രത്യേകത, നഗരകവാടത്തിന്റെ പൊതുവ്യാപാരസന്ദർഭം എന്നിവ കൂടുതൽ കൃത്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കാൻ ചെറിയ തിരുത്തലുകൾ വരുത്തി. അടിക്കുറിപ്പുകളുടെ ആങ്കറുകളും അർഥവും നിലനിർത്തി.
