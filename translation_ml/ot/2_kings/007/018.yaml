reference: 2 Kings 7:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֶל הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר סָאתַ֨יִם שְׂעֹרִ֜ים בְּ/שֶׁ֗קֶל וּֽ/סְאָה סֹ֨לֶת֙ בְּ/שֶׁ֔קֶל יִהְיֶה֙ כָּ/עֵ֣ת מָחָ֔ר בְּ/שַׁ֖עַר שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
translation:
  language: ml
  text: 'ദൈവപുരുഷൻ രാജാവിനോടു പറഞ്ഞതുപോലെതന്നെ സംഭവിച്ചു[a]. അദ്ദേഹം ഇപ്രകാരം പറഞ്ഞിരുന്നു: “നാളെ ഏകദേശം ഈ സമയത്ത് ശമര്യയുടെ നഗരകവാടത്തിൽ രണ്ടു സെയാ യവം ഒരു ശേക്കെലിന്, ഒരു സെയാ നന്നായി അരിച്ച മാവ് ഒരു ശേക്കെലിന് ലഭിക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ദൈവപുരുഷന്റെ മുൻപ്രസ്താവന കൃത്യമായി നിറവേറിയതാണെന്ന് എബ്രായ വാക്യഘടന ഊന്നിപ്പറയുന്നു.
    reason: discourse_clarification
  - marker: b
    text: '‘സെയാ’ പുരാതനകാലത്തെ ഉണങ്ങിയ വസ്തുക്കളുടെ അളവായിരുന്നു. എബ്രായപാഠം അളവുകൾ നേരിട്ട് പറയുന്നു: രണ്ടു സെയാ യവവും ഒരു സെയാ നന്നായി അരിച്ച മാവും. നഗരകവാടം വ്യാപാരത്തിന്റെയും ന്യായവിധിയുടെയും പൊതുസ്ഥലമായിരുന്നു.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: പറഞ്ഞതുപോലെതന്നെ സംഭവിച്ചു
  rationale: כְּ + infinitive construct ഇവിടെ സംഭവവും മുൻപ്രസ്താവനയും തമ്മിലുള്ള പൊരുത്തം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പൂർത്തീകരണഭാവത്തോടെ വിവർത്തനം ചെയ്തു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: എബ്രായത്തിലെ സ്ഥിരമായ വിശേഷണം നേരിട്ട് നിലനിർത്തുന്നു; വ്യാഖ്യാനാത്മകമായി ‘പ്രവാചകൻ’ എന്നു മാറ്റുന്നില്ല.
- source_word: סָאתַיִם
  choice: രണ്ടു സെയാ
  rationale: പുരാതന ഉണങ്ങിയ വസ്തുക്കളുടെ അളവായ סאהയുടെ ദ്വിവചനരൂപം; സാമ്പത്തിക കൃത്യത നിലനിർത്താൻ മൂല അളവുപേര് സൂക്ഷിച്ചു.
- source_word: שְׂעֹרִים
  choice: യവം
  rationale: ധാന്യമായ barley-യുടെ പ്രചാരമുള്ള മാന്യമായ മലയാള പദം.
- source_word: בְּשֶׁקֶל
  choice: ഒരു ശേക്കെലിന്
  rationale: വില സൂചിപ്പിക്കുന്ന ב മലയാളത്തിലെ വിപണിവിലപ്രയോഗമായി അവതരിപ്പിച്ചു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: സാധാരണ മാവിൽനിന്ന് വ്യത്യസ്തമായ നന്നായി അരിച്ച fine flour എന്ന അർഥവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: כָּעֵת מָחָר
  choice: നാളെ ഏകദേശം ഈ സമയത്ത്
  rationale: כയുടെ ഏകദേശ/താരതമ്യ സൂക്ഷ്മതയും നാളത്തെ സമാന സമയവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: ശമര്യയുടെ പടിവാതിൽക്കൽ
  rationale: നഗരവാതിലിനോടു ചേർന്ന വ്യാപാര-പൊതുസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള സ്ഥലംപ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പുരാതന അളവും നാണയവും ലിപ്യന്തരണം ചെയ്ത് സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി; വാക്യത്തിലെ പ്രവചനനിറവേറ്റൽ ഊന്നൽ നിലനിർത്തി.
