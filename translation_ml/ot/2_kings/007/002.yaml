source:
  edition: WLC
  text: וַ/יַּ֣עַן הַ/שָּׁלִ֡ישׁ אֲשֶׁר לַ/מֶּלֶךְ֩ נִשְׁעָ֨ן עַל יָד֜/וֹ אֶת אִ֣ישׁ הָ/אֱלֹהִים֮ וַ/יֹּאמַר֒ הִנֵּ֣ה יְהוָ֗ה עֹשֶׂ֤ה אֲרֻבּוֹת֙ בַּ/שָּׁמַ֔יִם הֲ/יִהְיֶ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יֹּ֗אמֶר הִנְּ/כָ֤ה רֹאֶה֙ בְּ/עֵינֶ֔י/ךָ וּ/מִ/שָּׁ֖ם לֹ֥א תֹאכֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
translation:
  language: ml
  text: 'അപ്പോൾ, രാജാവ് ആരുടെ കൈയിൽ ചാരിയിരുന്നുവോ ആ ഉദ്യോഗസ്ഥൻ ദൈവപുരുഷനോടു പറഞ്ഞു: “നോക്കൂ, യാഹ്‌വേ ആകാശത്തിൽ കിളിവാതിലുകൾ ഉണ്ടാക്കിയാലും ഇക്കാര്യം സംഭവിക്കുമോ?” ദൈവപുരുഷൻ പറഞ്ഞു: “നോക്കൂ, നീ സ്വന്തം കണ്ണുകൊണ്ട് അതു കാണും; എന്നാൽ അതിൽനിന്ന് നീ ഭക്ഷിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: ഉദ്യോഗസ്ഥൻ
  rationale: കൃത്യമായ പദവി സന്ദർഭത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ, ഉന്നത സൈനികനെയോ രാജകീയ ഉദ്യോഗസ്ഥനെയോ സൂചിപ്പിക്കാവുന്ന പൊതുവായ ആധുനിക പദം തിരഞ്ഞെടുത്തു.
- source_word: נִשְׁעָן עַל יָדוֹ
  choice: ആരുടെ കൈമേൽ ചാരിയിരുന്നുവോ
  rationale: יָד എന്ന ‘കൈ’ എന്ന ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനുള്ള സ്ഥിരമായ എബ്രായ വിശേഷണം വ്യാഖ്യാനിച്ച് ‘പ്രവാചകൻ’ എന്നു മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും വെല്ലുവിളിപരമായ സംഭാഷണഭാവം നിലനിർത്തുകയും ചെയ്യുന്ന ആധുനിക പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: ആകാശത്തിൽ കിളിവാതിലുകൾ ഉണ്ടാക്കിയാലും
  rationale: അസാധാരണമായ സ്വർഗീയ സമൃദ്ധിയുടെ രൂപകമായ ‘തുറപ്പുകൾ/കിളിവാതിലുകൾ’ എന്ന ദൃശ്യഭാഷ നിലനിർത്തുന്നു; സാങ്കൽപ്പിക നിബന്ധന മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  choice: ഇക്കാര്യം സംഭവിക്കുമോ?
  rationale: സംഭവത്തിന്റെ സാധ്യതയെ പരിഹസിച്ചുകൊണ്ടുള്ള അവിശ്വാസം നേരിട്ട് പകരുന്നു.
- source_word: הִנְּכָה רֹאֶה בְּעֵינֶיךָ
  choice: നീ സ്വന്തം കണ്ണുകൊണ്ട് അതു കാണും
  rationale: രണ്ടാംപുരുഷ ഊന്നലും കണ്ണാൽ നേരിട്ട് കാണുമെന്ന ആശയവും മലയാളത്തിലെ സ്വാഭാവിക ശൈലിയിൽ സംരക്ഷിക്കുന്നു.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: എന്നാൽ അതിൽനിന്ന് നീ ഭക്ഷിക്കുകയില്ല
  rationale: വാഗ്ദത്തമായ ആഹാരസമൃദ്ധി കാണുമെങ്കിലും അതിൽ പങ്കുചേരില്ലെന്ന വിരോധാഭാസം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: വ്യക്തിനാമത്തെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ സംരക്ഷിക്കുന്നു; സാധാരണ മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപമാണ് ‘യഹോവ’.
- issue: ഉദ്യോഗസ്ഥന്റെ വാക്കിലെ സാങ്കൽപ്പികത
  choice: ഉണ്ടാക്കിയാലും ... സംഭവിക്കുമോ?
  alternative: ഉണ്ടാക്കുന്നു എങ്കിൽ ... സംഭവിക്കുമോ?
  rationale: വാക്കുകളുടെ പരിഹാസപരമായ അവിശ്വാസം വ്യക്തമാക്കുന്നു; ദൈവത്തിന് അത് ചെയ്യാനാകില്ലെന്ന വ്യാഖ്യാനം അധികമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ദൃശ്യരൂപങ്ങളും ആവർത്തിച്ചുള്ള ‘നോക്കൂ’ എന്ന സംഭാഷണസൂചനയും നിലനിർത്തി; കൃത്രിമമായ പദാനുപദ ശൈലി ഒഴിവാക്കി.
