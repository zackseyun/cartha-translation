  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
translation:
  language: ml
  text: അങ്ങനെ അവർ അവരുടെ പിന്നാലെ യോർദ്ദാൻവരെ പോയി. അതാ, അരാം[b] തിടുക്കത്തിൽ വലിച്ചെറിഞ്ഞ വസ്ത്രങ്ങളും സാമഗ്രികളും[a]കൊണ്ട് മുഴുവൻ വഴിയും നിറഞ്ഞിരുന്നു. ദൂതന്മാർ[c] മടങ്ങിവന്ന് രാജാവിനോടു വിവരം അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സാമഗ്രികൾ’ എന്നതിന് ‘സാധനങ്ങൾ,’ ‘ഉപകരണങ്ങൾ,’ അല്ലെങ്കിൽ ‘സജ്ജീകരണങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദമായ כֵלִים വിവിധ വസ്തുക്കളെയോ ഉപകരണങ്ങളെയോ സൂചിപ്പിക്കുന്ന വിശാലാർഥമുള്ള പദമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ‘അരാം’; സന്ദർഭത്തിൽ ഈ പേര് അരാമ്യരെ സമൂഹമായി സൂചിപ്പിക്കുന്നു. ചില പരിഭാഷകൾ ഇവിടെ ‘അരാമ്യർ’ എന്നു നൽകുന്നു.
    reason: alternative_reading
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘ദൂതന്മാർ’ അഥവാ ‘സന്ദേശവാഹകർ.’ സന്ദർഭത്തിൽ, സ്ഥിതിഗതികൾ അന്വേഷിക്കാൻ അയയ്ക്കപ്പെട്ട ആളുകളെയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘നിരീക്ഷകർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵיהֶם
  choice: അങ്ങനെ അവർ അവരുടെ പിന്നാലെ പോയി
  rationale: തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനവും പിന്തുടരൽ എന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַד הַיַּרְדֵּן
  choice: യോർദ്ദാൻവരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന യാത്രയുടെ പരിധി കൃത്യമായി നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ഹീബ്രുവിലെ ശ്രദ്ധയാകർഷിക്കുന്ന, പെട്ടെന്നുള്ള കണ്ടെത്തലിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ ചൈതന്യം സംരക്ഷിക്കുന്നു.
- source_word: כָל הַדֶּרֶךְ מְלֵאָה
  choice: വഴിയിലുടനീളം നിറഞ്ഞിരുന്നു
  rationale: അക്ഷരാർഥമായ ‘മുഴുവൻ വഴിയും നിറഞ്ഞിരുന്നു’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְגָדִים וְכֵלִים
  choice: വസ്ത്രങ്ങളും സാമഗ്രികളും
  rationale: בְגָדִים വസ്ത്രങ്ങളെയും כֵלִים വിശാലമായ അർഥത്തിൽ സാധനങ്ങൾ, ഉപകരണങ്ങൾ, സൈനികസാമഗ്രികൾ എന്നിവയെയും സൂചിപ്പിക്കുന്നു; ‘സാമഗ്രികൾ’ അർഥപരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: אֲשֶׁר הִשְׁלִיכוּ
  choice: വലിച്ചെറിഞ്ഞ
  rationale: ഒളിച്ചോടുന്നതിനിടെ സാധനങ്ങൾ ഉപേക്ഷിച്ചതിനെ നേരിട്ടും സജീവമായും അവതരിപ്പിക്കുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: പിന്നീടുള്ള ഭൗമരാഷ്ട്രീയനാമം ഉപയോഗിക്കാതെ മൂലപാഠത്തിലെ ജനത/രാജ്യനാമം അതേപടി നിലനിർത്തുന്നു; ഇവിടെ അത് സമൂഹവാചകമായി പ്രവർത്തിക്കുന്നു.
- source_word: בְחָפְזָם
  choice: തിടുക്കത്തിൽ
  rationale: സമ്മർദത്തിനിടയിലെ വേഗത്തെ സൂചിപ്പിക്കുന്നു; ‘പരിഭ്രാന്തിയിൽ’ എന്നു വിവർത്തനം ചെയ്ത് മൂലപാഠത്തേക്കാൾ അധികം വ്യാഖ്യാനിക്കുന്നതു ഒഴിവാക്കുന്നു.
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: ദൂതന്മാർ മടങ്ങിവന്നു
  rationale: מַלְאָכִים എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘സന്ദേശവാഹകർ’ നിലനിർത്തുന്നു; ‘ചാരന്മാർ’ എന്ന സന്ദർഭാധിഷ്ഠിത വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וַיַּגִּדוּ לַמֶּלֶךְ
  choice: രാജാവിനെ വിവരം അറിയിച്ചു
  rationale: അവർ കണ്ടെത്തിയ കാര്യം രാജാവിനോടു റിപ്പോർട്ട് ചെയ്തു എന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
