id: 2KI.7.16
reference: 2 Kings 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/עָ֔ם וַ/יָּבֹ֕זּוּ אֵ֖ת מַחֲנֵ֣ה אֲרָ֑ם וַ/יְהִ֨י סְאָה סֹ֜לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל כִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
translation:
  language: ml
  text: അപ്പോൾ ജനം പുറപ്പെട്ട് അരാമിന്റെ പാളയം കൊള്ളയടിച്ചു. യഹോവയുടെ വചനപ്രകാരം, ഒരു ശേക്കെലിന് ഒരു സേയാ[a] നേർമാവും രണ്ടു സേയാ യവവും ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സേയാ’ പുരാതനകാലത്തെ ഒരു ഉണങ്ങിയ അളവാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  choice: അപ്പോൾ ജനം പുറപ്പെട്ടു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: וַיָּבֹזּוּ
  choice: കൊള്ളയടിച്ചു
  rationale: בזז ശത്രുപാളയത്തിൽനിന്ന് കൊള്ളയെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ സൈനികസന്ദർഭം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מַחֲנֵה אֲרָם
  choice: അരാമ്യരുടെ പാളയം
  rationale: അക്ഷരാർഥം ‘അരാമിന്റെ പാളയം’ എന്നാണെങ്കിലും, അരാമിന്റെ സൈനികപാളയം എന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുന്ന മലയാളപ്രയോഗമാണിത്; ‘സിറിയ’ എന്ന് ആധുനികവത്കരിച്ചിട്ടില്ല.
- source_word: וַיְהִי
  choice: വില … ആയി
  rationale: ധാന്യങ്ങളുടെ വിപണിവില നിലവിൽ വന്നതിനെ സന്ദർഭം സൂചിപ്പിക്കുന്നു. ‘വിറ്റു’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത പ്രവർത്തനം നേരിട്ട് ചേർക്കാതെ വിലസ്ഥിതി വ്യക്തമാക്കുന്നു.
- source_word: סְאָה / סָאתַיִם
  choice: ഒരു സേയാ / രണ്ടു സേയാ
  rationale: നിർദിഷ്ടമായ പുരാതന ഉണങ്ങിയ അളവിന്റെ പേരും ദ്വിവചനത്തിലെ കൃത്യമായ എണ്ണവും സംരക്ഷിക്കുന്നു.
- source_word: סֹלֶת
  choice: നേർമാവ്
  rationale: സാധാരണ മാവല്ല, നന്നായി അരിച്ചെടുത്ത നേർത്ത മാവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: שְׂעֹרִים
  choice: യവം
  rationale: ധാന്യവസ്തുവായ barley-യുടെ പ്രചാരത്തിലുള്ള മാനക മലയാളപദം.
- source_word: בְּשֶׁקֶל
  choice: ഒരു ശേക്കെൽ
  rationale: പുരാതന തൂക്ക/നാണയപദം സംരക്ഷിക്കുകയും വിലപ്രസ്താവനയിൽ സ്വാഭാവികമായി ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: כִּדְבַר יְהוָה
  choice: യഹോവയുടെ വചനപ്രകാരം തന്നെ
  rationale: മുൻപ് പ്രസ്താവിച്ച ദൈവവചനത്തിന്റെ കൃത്യമായ നിവൃത്തിയെന്ന ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָה-യുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: כִּדְבַר יְהוָה എന്നതിലെ നിവൃത്തി
  choice: യഹോവയുടെ വചനപ്രകാരം തന്നെ
  alternative: യഹോവ അരുളിച്ചെയ്തതുപോലെ
  rationale: ഇത് മുൻ പ്രവചനത്തിന്റെ നിവൃത്തിയാണെന്ന സന്ദർഭം സൂചിപ്പിക്കുമ്പോഴും, ‘അരുളിച്ചെയ്തു’ എന്ന ക്രിയ മൂലവാക്യത്തിൽ ചേർക്കാതെ ‘വചനം’ എന്ന നാമരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാതന അളവുകളും സ്ഥല/ജനനാമവും ലിപ്യന്തരണം ചെയ്ത് ആവശ്യമായ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
