translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ഹീബ്രു വാക്യത്തിന്റെ സജീവത ‘ഇതാ’ എന്നതിലൂടെ നിലനിർത്തിയപ്പോൾ, മലയാളത്തിൽ ദുർഗ്രഹമാകുന്ന റിപ്പോർട്ടിങ് ആവർത്തനങ്ങൾ ചുരുക്കി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനവൈരുധ്യം തിരുത്തി: അരാം സംബന്ധിച്ച കുറിപ്പ് പേരിനോടും ‘ശബ്ദം/സ്വരം’ സംബന്ധിച്ച കുറിപ്പ് അതത് പദപ്രയോഗത്തോടും ചേർത്തു.'
