  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
translation:
  language: ml
  text: 'അങ്ങനെ അവർ വന്ന് നഗരകവാടത്തിലെ കാവൽക്കാരെ വിളിച്ച് അവരോടു പറഞ്ഞു: “ഞങ്ങൾ അരാമിന്റെ പാളയത്തിൽ[a] ചെന്നു. ഇതാ, അവിടെ ആരും ഉണ്ടായിരുന്നില്ല; മനുഷ്യരുടെ ഒരു ശബ്ദംപോലും[b] ഇല്ലായിരുന്നു. കെട്ടിയിട്ടിരുന്ന കുതിരകളും കെട്ടിയിട്ടിരുന്ന കഴുതകളും കൂടാരങ്ങൾ അവ ഉണ്ടായിരുന്നതുപോലെതന്നെയും മാത്രമേ അവിടെ ഉണ്ടായിരുന്നുള്ളൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗത പരിഭാഷകളിൽ “സിറിയക്കാരുടെ പാളയം” എന്നും കാണാം.
    reason: alternative_reading
  - marker: b
    text: “മനുഷ്യരുടെ സ്വരംപോലും” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദത്തിന് മനുഷ്യസ്വരത്തെയോ കൂടുതൽ പൊതുവായി മനുഷ്യർ ഉണ്ടാക്കുന്ന ശബ്ദത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  choice: നഗരകവാടത്തിലെ കാവൽക്കാർ
  rationale: രൂപത്തിൽ ഏകവചനമാണെങ്കിലും തുടർന്നുള്ള ബഹുവചന സർവനാമവും സന്ദർഭവും ഇത് കവാടസംരക്ഷണച്ചുമതലയുള്ളവരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി കാണിക്കുന്നു.
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  choice: അവരോടു പറഞ്ഞു
  rationale: ഹീബ്രു റിപ്പോർട്ടിങ് സൂത്രത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘പറഞ്ഞുകൊണ്ട് അറിയിച്ചു’ എന്ന അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: מַחֲנֵה אֲרָם
  choice: അരാമിന്റെ പാളയം
  rationale: അരാം എന്ന ഹീബ്രു സ്ഥലനാമം നേരിട്ട് നിലനിർത്തുന്നു; പിൽക്കാല ഭൂമിശാസ്ത്രനാമമായ ‘സിറിയ’ മുഖ്യപാഠത്തിൽ പകരുന്നില്ല.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: സംഭവത്തെ സജീവമായി മുന്നിൽ അവതരിപ്പിക്കുന്ന ഹീബ്രു വ്യവഹാരസൂചകത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: אֵין שָׁם אִישׁ
  choice: അവിടെ ആരും ഉണ്ടായിരുന്നില്ല
  rationale: אִישׁ ഇവിടെ പുരുഷനെ മാത്രമല്ല, ആരെങ്കിലും എന്ന പൊതുവായ അർഥത്തിലാണ്.
- source_word: וְקוֹל אָדָם
  choice: മനുഷ്യരുടെ ഒരു ശബ്ദംപോലും ഇല്ലായിരുന്നു
  rationale: קוֹל എന്നതിന് ‘ശബ്ദം’ എന്നും ‘സ്വരം’ എന്നും അർഥമാകാം. വിശാലമായ അർഥം മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുകയും പ്രത്യേകമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: כִּי אִם
  choice: മാത്രമേ
  rationale: മുമ്പു പറഞ്ഞ അഭാവത്തിന് ശേഷമുള്ള ഏക അപവാദങ്ങളെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַסּוּס אָסוּר ... וְהַחֲמוֹר אָסוּר
  choice: കെട്ടിയിട്ടിരുന്ന കുതിരകളും കെട്ടിയിട്ടിരുന്ന കഴുതകളും
  rationale: ഏകവചന നാമങ്ങൾ ഇവിടെ ഇനങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; אָסוּר മൃഗങ്ങളുടെ സന്ദർഭത്തിൽ ‘കെട്ടിയിട്ടിരുന്ന’ എന്ന് വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: וְאֹהָלִים כַּאֲשֶׁר הֵמָּה
  choice: ഉണ്ടായിരുന്നതുപോലെ തന്നെയുള്ള കൂടാരങ്ങൾ
  rationale: കൂടാരങ്ങൾ ഉപേക്ഷിക്കപ്പെട്ടപ്പോൾ ഉണ്ടായിരുന്ന നിലയിൽത്തന്നെ ശേഷിച്ചുവെന്ന ആശയം, അതിലധികം വിശദീകരണം ചേർക്കാതെ, നിലനിർത്തുന്നു.
