  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם אָמַרְנוּ֩ נָב֨וֹא הָ/עִ֜יר וְ/הָ/רָעָ֤ב בָּ/עִיר֙ וָ/מַ֣תְנוּ שָׁ֔ם וְ/אִם יָשַׁ֥בְנוּ פֹ֖ה וָ/מָ֑תְנוּ וְ/עַתָּ֗ה לְכוּ֙ וְ/נִפְּלָה֙ אֶל מַחֲנֵ֣ה אֲרָ֔ם אִם יְחַיֻּ֣/נוּ נִֽחְיֶ֔ה וְ/אִם יְמִיתֻ֖/נוּ וָ/מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
translation:
  language: ml
  text: “‘നമുക്ക് നഗരത്തിൽ പ്രവേശിക്കാം’ എന്നു പറഞ്ഞാൽ, നഗരത്തിൽ ക്ഷാമമുള്ളതിനാൽ നാം അവിടെ മരിക്കും. ഇവിടെത്തന്നെ ഇരുന്നാലും നാം മരിക്കും. അതുകൊണ്ട് ഇപ്പോൾ വരൂ; നമുക്ക് അരാമിന്റെ[b] പാളയത്തിലേക്കു ചെന്ന് അവർക്കു കീഴടങ്ങാം.[a] അവർ നമ്മെ ജീവനോടെ വിട്ടാൽ നാം ജീവിക്കും; അവർ നമ്മെ കൊന്നാൽ നാം മരിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവരുടെ അടുക്കലേക്കു വീഴാം” എന്നാണ് ഹീബ്രു പ്രയോഗത്തിന്റെ പദാനുപദ രൂപം; സൈനികസന്ദർഭത്തിൽ അതിന് എതിർപക്ഷത്തേക്കു ചെന്നു കീഴടങ്ങുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: “അരാം” എന്ന ഹീബ്രു പേര് പലപ്പോഴും “സിറിയ” എന്നും അവിടുത്തെ ജനത്തെ “അരാമ്യർ” എന്നും വിളിക്കാറുണ്ട്.
    reason: cultural_note
lexical_decisions:
- source_word: נָבוֹא הָעִיר
  choice: നമുക്ക് നഗരത്തിൽ പ്രവേശിക്കാം
  rationale: നിർദേശരൂപത്തിലുള്ള ഉദ്ധൃതവാക്കായി വരുന്ന ഒന്നാംപുരുഷ ബഹുവചന ക്രിയയെ സ്വാഭാവികമായ മലയാള ആഹ്വാനരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; עִיר എന്ന പൊതുനാമത്തെ ‘നഗരം’ എന്നു നിലനിർത്തുന്നു.
- source_word: הָרָעָב בָּעִיר
  choice: നഗരത്തിൽ ക്ഷാമമുള്ളതിനാൽ
  rationale: רָעָב ഇവിടെ വ്യക്തിപരമായ വിശപ്പല്ല, ഉപരോധം മൂലമുള്ള ക്ഷാമമാണ്. തുടർന്നുള്ള മരണത്തിന്റെ കാരണബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: יָשַׁבְנוּ פֹה
  choice: ഇവിടെത്തന്നെ ഇരുന്നാലും
  rationale: ישב എന്നതിന്റെ ദൃശ്യമായ ‘ഇരിക്കുക’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, ഇതും മരണത്തിലേക്കു നയിക്കുന്ന മറ്റൊരു സാധ്യതയാണെന്ന conditional force വ്യക്തമാക്കുന്നു.
- source_word: וְעַתָּה לְכוּ
  choice: അതുകൊണ്ട് ഇപ്പോൾ വരൂ
  rationale: മുൻപു പരിഗണിച്ച വഴികളിൽനിന്ന് ഒരു തീരുമാനത്തിലേക്കുള്ള നിഗമനവും, കൂട്ടരോടുള്ള ആഹ്വാനവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְנִפְּלָה אֶל
  choice: ചെന്ന് അവർക്കു കീഴടങ്ങാം
  rationale: സൈനികസന്ദർഭത്തിൽ נפל אל എന്ന പ്രയോഗം എതിർപക്ഷത്തേക്കു ചെന്നു കീഴടങ്ങുക എന്ന അർഥം വഹിക്കുന്നു. മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു; പദാനുപദമായ ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מַחֲנֵה אֲרָם
  choice: അരാമിന്റെ പാളയം
  rationale: אֲרָם എന്ന സ്ഥലനാമം ‘സിറിയ’ എന്നു മാറ്റാതെ അരാം എന്നുതന്നെ നൽകുകയും construct ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יְחַיֻּנוּ נִחְיֶה
  choice: അവർ നമ്മെ ജീവനോടെ വിട്ടാൽ നാം ജീവിക്കും
  rationale: ‘ജീവനോടെ നിലനിർത്തുക/വിടുക’ എന്നും ‘ജീവിക്കുക’ എന്നും വരുന്ന ഹീബ്രു ആവർത്തനം മലയാളത്തിലും സംരക്ഷിക്കുന്നു.
- source_word: יְמִיתֻנוּ וָמָתְנוּ
  choice: അവർ നമ്മെ കൊന്നാൽ നാം മരിക്കും
  rationale: מות എന്ന ക്രിയയുടെ causative രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കൊല്ലുക’ എന്നു നൽകുന്നു; ഫലവാക്യത്തിലെ ‘മരിക്കും’ എന്ന ആവർത്തനം നിലനിർത്തുന്നു.
