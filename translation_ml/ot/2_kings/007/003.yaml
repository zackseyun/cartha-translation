source:
  edition: WLC
  text: וְ/אַרְבָּעָ֧ה אֲנָשִׁ֛ים הָי֥וּ מְצֹרָעִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מָ֗ה אֲנַ֛חְנוּ יֹשְׁבִ֥ים פֹּ֖ה עַד מָֽתְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/003.yaml
  text: There were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
translation:
  language: ml
  text: 'കവാടത്തിന്റെ പ്രവേശനത്തിൽ ചർമ്മരോഗമുള്ള[a] നാലു പുരുഷന്മാർ ഉണ്ടായിരുന്നു. അവർ പരസ്പരം പറഞ്ഞു: “നാം മരിക്കുന്നതുവരെ ഇവിടെ ഇരിക്കുന്നത് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി “കുഷ്ഠരോഗമുള്ള” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്. ഹീബ്രായപദം צָרַעַת-നോടു ബന്ധപ്പെട്ട ഒരു ചർമ്മരോഗാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; അത് ആധുനിക കുഷ്ഠരോഗം (ഹാൻസൻ രോഗം) തന്നെയായിരിക്കണമെന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעָה אֲנָשִׁים הָיוּ
  choice: നാലു പുരുഷന്മാർ ഉണ്ടായിരുന്നു
  rationale: ഹീബ്രായ വാക്യം പുതിയ രംഗത്തിലെ ആളുകളെ പരിചയപ്പെടുത്തുന്നു. ‘പുരുഷന്മാർ’ എന്നത് אֲנָשִׁים എന്ന പുല്ലിംഗ ബഹുവചനത്തെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ അസ്തിത്വപ്രയോഗമായി ‘ഉണ്ടായിരുന്നു’ ഉപയോഗിച്ചു.
- source_word: מְצֹרָעִים
  choice: ത്വഗ്രോഗമുള്ള
  rationale: ഈ പദം צָרַעַת-നോടു ബന്ധപ്പെട്ട അവസ്ഥയുള്ളവരെ സൂചിപ്പിക്കുന്നു; അത് ആധുനിക ഹാൻസൻ രോഗത്തോട് നിർബന്ധമായും തുല്യമല്ല. അതിനാൽ തെറ്റായ വൈദ്യശാസ്ത്രപരമായ കൃത്യത ഒഴിവാക്കുന്ന വിശാലമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: פֶּתַח הַ/שָּׁעַר
  choice: കവാടത്തിന്റെ പ്രവേശനത്തിങ്കൽ
  rationale: നിർമ്മിതബന്ധത്തിന്റെ അർഥം ‘കവാടത്തിന്റെ തുറവ്/പ്രവേശനം’ എന്നാണ്. സ്ഥലസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַ/יֹּאמְרוּ אִישׁ אֶל רֵעֵהוּ
  choice: അവർ പരസ്പരം പറഞ്ഞു
  rationale: ‘ഓരോരുത്തൻ തന്റെ കൂട്ടുകാരനോട്’ എന്ന വിതരണ ഏകവചന ശൈലി ഇവിടെ പരസ്പരസംഭാഷണത്തെ സൂചിപ്പിക്കുന്നു; ‘പരസ്പരം’ സ്വാഭാവികമായ മലയാള തുല്യപ്രയോഗമാണ്.
- source_word: מָה אֲנַחְנוּ יֹשְׁבִים פֹּה
  choice: നാം ഇവിടെ ഇരിക്കുന്നത് എന്തിന്?
  rationale: ചോദ്യത്തിലെ מָה കാരണത്തെ ചോദിക്കുന്നതിനാൽ ‘എന്തിന്’ എന്നു പരിഭാഷപ്പെടുത്തി. വർത്തമാന കൃതന്തം സൂചിപ്പിക്കുന്ന തുടരുന്ന ഇരിപ്പും നിഷ്ക്രിയതയും ‘ഇരിക്കുന്നത്’ നിലനിർത്തുന്നു.
- source_word: עַד מָתְנוּ
  choice: മരിക്കുന്നതുവരെ
  rationale: അവിടെ തുടരുന്നതിന്റെ അന്തിമപരിധിയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായി ‘മരിക്കുന്നതുവരെ’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യാരംഭത്തിലെ וְ-ന് പ്രത്യേക കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. രോഗനാമത്തിൽ അനാവശ്യമായ ആധുനിക വൈദ്യശാസ്ത്രപരമായ നിർണ്ണയം ഒഴിവാക്കി.
