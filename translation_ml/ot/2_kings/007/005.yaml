id: 2KI.7.5
reference: 2 Kings 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּק֣וּמוּ בַ/נֶּ֔שֶׁף לָ/ב֖וֹא אֶל מַחֲנֵ֣ה אֲרָ֑ם וַ/יָּבֹ֗אוּ עַד קְצֵה֙ מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֖ם אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
translation:
  language: ml
  text: അങ്ങനെ അവർ സന്ധ്യാസമയത്ത് അരാമ്യരുടെ പാളയത്തിലേക്കു പോകാൻ എഴുന്നേറ്റു. അവർ അരാമ്യരുടെ പാളയത്തിന്റെ അരികിലെത്തിയപ്പോൾ, അതാ, അവിടെ ആരും ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֣וּמוּ
  choice: അതിനാൽ അവർ ... എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ wayyiqtol രൂപം കഥയിലെ അടുത്ത നടപടി മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മുൻസന്ദർഭത്തിൽ എടുത്ത തീരുമാനത്തിന്റെ ഫലമായ തുടർച്ച ‘അതിനാൽ’ വ്യക്തമാക്കുന്നു; ‘എഴുന്നേറ്റ്’ സ്വാഭാവികമായ ആഖ്യാനഭാഷയാണ്.
- source_word: בַנֶּשֶׁף
  choice: സന്ധ്യാസമയത്ത്
  rationale: ഈ സന്ദർഭത്തിൽ נֶשֶׁף വെളിച്ചം മങ്ങുന്ന സന്ധ്യയെയോ സന്ധ്യാമയക്കത്തെയോ സൂചിപ്പിക്കുന്നു. ‘സന്ധ്യാസമയത്ത്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לָבוֹא אֶל
  choice: '...ലേക്കു പോയി'
  rationale: בוא എന്ന infinitive ഇവിടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. കഥാകൃത്തിന്റെ ദൃഷ്ടികോണത്തിൽ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം മലയാളത്തിൽ ‘പോയി’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം.
- source_word: מַחֲנֵה אֲרָם
  choice: അരാമ്യരുടെ പാളയം
  rationale: אֲרָם ഇവിടെ അരാം ജനതയുടെ സൈനികപാളയത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ പതിവും വ്യക്തവുമായ ജനനാമരൂപം ഉപയോഗിച്ചു.
- source_word: עַד קְצֵה
  choice: അരികിലെത്തി
  rationale: קָצֶה പുറത്തെ അറ്റത്തെയോ അതിരിനെയോ സൂചിപ്പിക്കുന്നു. ‘അരികിലെത്തി’ പാളയത്തിന്റെ പുറംഭാഗം വരെ എത്തിയെന്ന ആശയം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: הִנֵּה അപ്രതീക്ഷിതമായ കണ്ടെത്തലിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്നു. ‘അതാ’ അതിന്റെ ആഖ്യാനപരമായ ആശ്ചര്യബലം നിലനിർത്തുന്നു.
- source_word: אֵין שָׁם אִישׁ
  choice: അവിടെ ആരും ഉണ്ടായിരുന്നില്ല
  rationale: വാക്കുതോറും ‘അവിടെ ഒരു മനുഷ്യനും ഇല്ല’ എന്നാണെങ്കിലും, אִישׁ ഇവിടെ ആരും ഇല്ലെന്ന പൊതുവായ അർഥത്തിലാണ്. ‘ആരും ഉണ്ടായിരുന്നില്ല’ ലിംഗവ്യത്യാസം അനാവശ്യമായി മുൻനിർത്താതെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളം നൽകുന്നു.
theological_decisions:
- issue: אִישׁ എന്ന പുല്ലിംഗ ഏകവചനത്തിന്റെ പൊതുവായ പ്രയോഗം
  choice: അവിടെ ആരും ഉണ്ടായിരുന്നില്ല
  alternative: അവിടെ ഒരു മനുഷ്യനും ഉണ്ടായിരുന്നില്ല
  rationale: ഈ സന്ദർഭത്തിൽ പാളയത്തിൽ ഒരാളുപോലും ഇല്ലെന്ന സമ്പൂർണ അഭാവമാണ് ഉദ്ദേശ്യം; പുരുഷന്മാർ മാത്രം ഇല്ലെന്നല്ല. അതിനാൽ പൊതുവായ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ആഖ്യാനത്തിന്റെ തുടർച്ചയും ‘അതാ’ നൽകുന്ന അപ്രതീക്ഷിത കണ്ടെത്തലിന്റെ ഭാവവും സംരക്ഷിച്ചു; അനാവശ്യമായ പദാനുപദ കാഠിന്യം ഒഴിവാക്കി.
