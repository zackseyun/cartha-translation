translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ക്രിയാവർത്തനം നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാർഥപ്രയോഗങ്ങൾ മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമാക്കി, അവയുടെ രൂപം അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
