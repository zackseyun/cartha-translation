  yaml_path: translation/ot/2_kings/007/007.yaml
  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
translation:
  language: ml
  text: അങ്ങനെ അവർ എഴുന്നേറ്റ് സന്ധ്യാസമയത്ത്[a] ഓടിപ്പോയി. അവർ തങ്ങളുടെ കൂടാരങ്ങളും കുതിരകളും കഴുതകളും, പാളയം അതേപടി[b] വിട്ട്, ജീവൻ രക്ഷിക്കാൻ ഓടിപ്പോയി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സന്ധ്യാമയക്കത്തിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘പാളയം എങ്ങനെയായിരുന്നോ അങ്ങനെതന്നെ’; അതായത്, അതേ നിലയിൽ വിട്ടു.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘തങ്ങളുടെ ജീവനിലേക്കു ഓടിപ്പോയി’; ജീവൻ രക്ഷിക്കാനായി പലായനം ചെയ്തു എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַנֶּשֶׁף
  choice: സന്ധ്യാസമയത്ത്
  rationale: נֶשֶׁף വെളിച്ചം മങ്ങുന്ന സന്ധ്യയെയോ സന്ധ്യാമയക്കത്തെയോ സൂചിപ്പിക്കുന്നു. കഥാസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ് ‘സന്ധ്യാസമയത്ത്’; പദത്തിലെ മങ്ങിയ വെളിച്ചത്തിന്റെ ഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּעַזְבוּ
  choice: ഉപേക്ഷിച്ച് ... വിട്ടിട്ട്
  rationale: עזב എന്നത് വിടുക, ഉപേക്ഷിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. പെട്ടെന്നുള്ള സൈനികപലായനത്തിന്റെ ശക്തി ‘ഉപേക്ഷിച്ച്’ വ്യക്തമാക്കുന്നു; പാളയത്തിന്റെ നിലയെ വിവരിക്കുന്ന തുടർവാക്യത്തിൽ ‘വിട്ടിട്ട്’ സ്വാഭാവികമാണ്.
- source_word: אָהֳלֵיהֶם
  choice: തങ്ങളുടെ കൂടാരങ്ങൾ
  rationale: സൈനികപാളയത്തിന്റെ സന്ദർഭത്തിൽ אֹהֶל എന്നതിന്റെ നേരിട്ടും സാധാരണവുമായ മലയാള തുല്യപദം ‘കൂടാരം’ ആണ്.
- source_word: סוּסֵיהֶם
  choice: കുതിരകൾ
  rationale: סוּס എന്നതിന്റെ നേരിട്ടുള്ള ആധുനിക മലയാള തുല്യപദം.
- source_word: חֲמֹרֵיהֶם
  choice: കഴുതകൾ
  rationale: חֲמוֹר എന്ന വീട്ടുവളർത്തു ചുമട്ടുമൃഗത്തിന്റെ സാധാരണ മലയാളപദം ‘കഴുത’ ആണ്.
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  choice: പാളയം ഉണ്ടായിരുന്നതുപോലെതന്നെ
  rationale: പാളയത്തെ യാതൊരു മാറ്റവും വരുത്താതെ അതേ നിലയിൽ വിട്ടുവെന്ന ആശയം അടുത്തായി നിലനിർത്തുന്നു. ‘കേടുകൂടാതെ’ എന്നത് വ്യാഖ്യാനാത്മകമായതിനാൽ ഒഴിവാക്കി.
- source_word: וַיָּנֻסוּ אֶל נַפְשָׁם
  choice: ജീവൻ രക്ഷിക്കാൻ ഓടിപ്പോയി
  rationale: അക്ഷരാർഥത്തിൽ ‘തങ്ങളുടെ ജീവനിലേക്കു ഓടിപ്പോയി’ എന്ന ഹീബ്രു പ്രയോഗം ജീവൻ സംരക്ഷിക്കാനുള്ള പലായനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ജീവൻ രക്ഷിക്കാൻ ഓടിപ്പോയി’ അതിന്റെ അടിയന്തരത സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיָּקוּמוּ
  choice: അവർ എഴുന്നേറ്റ്
  rationale: קום ഇവിടെ അടിയന്തരമായ പ്രവർത്തനത്തിന്റെ തുടക്കം അടയാളപ്പെടുത്തുന്നു. ‘എഴുന്നേറ്റ്’ ഉറവിടത്തിന്റെ ആഖ്യാനക്രമവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: וַיָּנ֣וּסוּ ... וַיָּנֻסוּ
  choice: ഓടിപ്പോയി ... ഓടിപ്പോയി
  rationale: ഹീബ്രുവിൽ נוס എന്ന ഒരേ ക്രിയ രണ്ടുതവണ ആവർത്തിക്കുന്നു. ആ തിടുക്കവും ശൈലിയും നിലനിർത്താൻ മലയാളത്തിലും ആവർത്തനം സൂക്ഷിച്ചു.
