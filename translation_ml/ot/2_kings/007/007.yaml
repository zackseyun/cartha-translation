  source_fidelity: 'The draft conveys the sequence and all principal Hebrew elements: rising, fleeing at twilight, abandoning tents/horses/donkeys, leaving the camp as it was, and fleeing for their lives. However, the paired wording “ഉപേക്ഷിച്ച് ... വിട്ടിട്ട്” makes the syntax needlessly repetitive and weakens the appositional force of “the camp as it was.”'
