  terminology: “കൂടാരങ്ങൾ,” “കുതിരകൾ,” “കഴുതകൾ,” and “ജീവൻ രക്ഷിക്കാൻ” are appropriate modern-standard Malayalam choices. “സന്ധ്യാസമയത്ത്” is acceptable for the deliberately non-specific נֶשֶׁף; the alternative is properly retained in a footnote.
