  text: וַ/יָּבֹאוּ֩ הַֽ/מְצֹרָעִ֨ים הָ/אֵ֜לֶּה עַד קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה וַ/יָּבֹ֜אוּ אֶל אֹ֤הֶל אֶחָד֙ וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֔וּ וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם כֶּ֤סֶף וְ/זָהָב֙ וּ/בְגָדִ֔ים וַ/יֵּלְכ֖וּ וַ/יַּטְמִ֑נוּ וַ/יָּשֻׁ֗בוּ וַ/יָּבֹ֨אוּ֙ אֶל אֹ֣הֶל אַחֵ֔ר וַ/יִּשְׂא֣וּ מִ/שָּׁ֔ם וַ/יֵּלְכ֖וּ וַ/יַּטְמִֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
translation:
  language: ml
  text: ആ ത്വഗ്രോഗികൾ[a] പാളയത്തിന്റെ അറ്റത്തെത്തിയപ്പോൾ ഒരു കൂടാരത്തിൽ കടന്ന് തിന്നുകയും കുടിക്കുകയും ചെയ്തു. അവിടെനിന്ന് വെള്ളിയും പൊന്നും വസ്ത്രങ്ങളും എടുത്തുകൊണ്ടുപോയി ഒളിപ്പിച്ചു. പിന്നെ അവർ മടങ്ങിവന്ന് മറ്റൊരു കൂടാരത്തിൽ കടന്നു; അവിടെനിന്നും സാധനങ്ങൾ എടുത്തുകൊണ്ടുപോയി ഒളിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ത്വഗ്രോഗികൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രുപദം പരമ്പരാഗതമായി ‘കുഷ്ഠരോഗികൾ’ എന്നു വിവർത്തനം ചെയ്യാറുണ്ട്. എന്നാൽ പുരാതന പദം ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ കുഷ്ഠരോഗം മാത്രമല്ല, കൂടുതൽ വിപുലമായ ത്വഗ്രോഗാവസ്ഥകളെയും സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  choice: ആ ത്വഗ്രോഗികൾ
  rationale: צָרַעַת ബാധിച്ചവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; അത് ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ കുഷ്ഠരോഗത്തോട് മാത്രം തുല്യമല്ല. അതിനാൽ തെറ്റായ വൈദ്യപരമായ കൃത്യത ഒഴിവാക്കി സ്വാഭാവികമായ പൊതുപദം ഉപയോഗിച്ചു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: קְצֵה הַמַּחֲנֶה
  choice: പാളയത്തിന്റെ അറ്റം
  rationale: קָצֶה എന്നതിന്റെ സ്ഥലപരമായ ‘അറ്റം/അരിക്’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֹהֶל אֶחָד
  choice: ഒരു കൂടാരം
  rationale: സംഖ്യാത്മകമായി അടയാളപ്പെടുത്തിയ അനിശ്ചിത പ്രയോഗം മലയാളത്തിലെ ‘ഒരു കൂടാരം’ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: തിന്നുകയും കുടിക്കുകയും ചെയ്തു
  rationale: ഹീബ്രു കഥനത്തിലെ ലളിതമായ ക്രിയാക്രമം അധിക ഭാവസൂചന ചേർക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: അവിടെനിന്ന് എടുത്തുകൊണ്ടുപോയി
  rationale: נשא ഇവിടെ വസ്തുക്കൾ എടുത്ത് മാറ്റിക്കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സുതാര്യവും സന്ദർഭോചിതവുമായ പ്രയോഗം.
- source_word: כֶּסֶף וְזָהָב וּבְגָדִים
  choice: വെള്ളിയും പൊന്നും വസ്ത്രങ്ങളും
  rationale: ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള ബന്ധകഘടന നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിലെ സാധാരണ പദങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: וַיַּטְמִנוּ
  choice: ഒളിപ്പിച്ചു
  rationale: ക്രിയയുടെ പൊതുവായ ‘മറയ്ക്കുക/ഒളിപ്പിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘കുഴിച്ചിട്ടു’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: וַיָּשֻׁבוּ
  choice: പിന്നെ അവർ മടങ്ങിവന്ന്
  rationale: കഥനക്രമത്തിന്റെ തുടർച്ച സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֹהֶל אַחֵר
  choice: മറ്റൊരു കൂടാരം
  rationale: אַחֵר എന്നതിന്റെ ‘വേറൊരു/മറ്റൊരു’ എന്ന അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּשְׂאוּ מִשָּׁם (second occurrence)
  choice: അവിടെനിന്നും സാധനങ്ങൾ എടുത്തുകൊണ്ടുപോയി
  rationale: രണ്ടാം പ്രയോഗത്തിൽ കർമം ഹീബ്രുവിൽ വ്യക്തമാക്കിയിട്ടില്ല. മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കാൻ ‘സാധനങ്ങൾ’ എന്നു പൊതുവായി ചേർത്തു; ഏതൊക്കെ സാധനങ്ങളെന്ന് നിർദിഷ്ടമാക്കിയിട്ടില്ല.
