  to: 'കർത്താവ് അരാമിന്റെ പാളയത്തെ രഥങ്ങളുടെ ശബ്ദവും കുതിരകളുടെ ശബ്ദവും ഒരു വലിയ സൈന്യത്തിന്റെ ശബ്ദവും കേൾപ്പിച്ചിരുന്നു. അവർ പരസ്പരം പറഞ്ഞു: “നോക്കൂ, ഇസ്രായേൽരാജാവ് നമുക്കെതിരെ വരാൻ ഹിത്യരുടെ രാജാക്കന്മാരെയും ഈജിപ്തിലെ രാജാക്കന്മാരെയും കൂലിക്കെടുത്തിരിക്കുന്നു.”'
  rationale: The revision restores the source’s collective expression ‘camp of Aram’ rather than specifying its occupants and removes the added consequential connector. All other established lexical choices are retained, including the Hebrew sound-repetition, the plural kings, and the non-interpretive ‘come against us.’
