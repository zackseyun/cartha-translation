reference: 2 Kings 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
translation:
  language: ml
  text: 'കർത്താവ് അരാമിന്റെ പാളയത്തെ രഥങ്ങളുടെ ശബ്ദവും കുതിരകളുടെ ശബ്ദവും ഒരു വലിയ സൈന്യത്തിന്റെ ശബ്ദവും കേൾപ്പിച്ചിരുന്നു. അവർ പരസ്പരം പറഞ്ഞു: “നോക്കൂ, ഇസ്രായേൽരാജാവ് നമുക്കെതിരെ വരാൻ ഹിത്യരുടെ രാജാക്കന്മാരെയും ഈജിപ്തിലെ രാജാക്കന്മാരെയും കൂലിക്കെടുത്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאדֹנָי
  choice: കർത്താവ്
  rationale: ഇവിടെ אֲדֹנָי ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ദൈവിക സ്ഥാനപ്പേരാണ്; മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പരമ്പരാഗത തുല്യം ‘കർത്താവ്’ ആണ്.
- source_word: הִשְׁמִיעַ
  choice: കേൾപ്പിച്ചിരുന്നു
  rationale: שׁמע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം നിലനിർത്തുന്നു; ചുറ്റുപാടിലുള്ള സംഭവത്തിന്റെ കാരണം പശ്ചാത്തലമായി വിവരിക്കുന്നതിനാൽ ഭൂതകാലപൂർണതയുടെ ഭാവവും നൽകുന്നു.
- source_word: מַחֲנֵה אֲרָם
  choice: അരാമ്യപാളയത്തിലുള്ളവരെ
  rationale: വ്യാകരണപരമായി പാളയമാണ് കേൾക്കുന്നതായി പറയുന്നതെങ്കിലും ഉദ്ദേശിക്കുന്നത് അതിലുള്ള സൈനികരാണ്; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി പങ്കാളികളെ വ്യക്തമാക്കുന്നു, ‘അരാം’ എന്ന പുരാതന നാമത്തിന്റെ വിശേഷണരൂപം നിലനിർത്തുന്നു.
- source_word: קוֹל רֶכֶב קוֹל סוּס קוֹל חַיִל גָּדוֹל
  choice: രഥങ്ങളുടെ ശബ്ദവും കുതിരകളുടെ ശബ്ദവും ഒരു വലിയ സൈന്യത്തിന്റെ ശബ്ദവും
  rationale: മൂന്നു പ്രാവശ്യം വരുന്ന קוֹל എന്ന പദത്തിന്റെ ആവർത്തനവും സൈനിക ദൃശ്യഭാവവും പൂർണമായി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל אָחִיו
  choice: അവർ പരസ്പരം പറഞ്ഞു
  rationale: അക്ഷരാർഥം ‘ഓരോരുത്തൻ തന്റെ സഹോദരനോട് പറഞ്ഞു’ എന്നാണെങ്കിലും ഇത് പരസ്പരസംഭാഷണം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; മലയാളത്തിലെ സ്വാഭാവിക തുല്യം ഉപയോഗിക്കുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ദൈക്തിക ശക്തി ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: שָׂכַר עָלֵינוּ
  choice: നമുക്കെതിരെ വരാൻ ... കൂലിക്കെടുത്തിരിക്കുന്നു
  rationale: שׂכר എന്നതിന്റെ ‘കൂലിക്കെടുക്കുക’ എന്ന അർഥവും עַל നൽകുന്ന ശത്രുതാഭാവവും സംരക്ഷിക്കുന്നു; തുടർന്നുള്ള לָבוֹא עָלֵינוּ വാക്യഘടകത്തോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: מַלְכֵי הַחִתִּים
  choice: ഹിത്യരുടെ രാജാക്കന്മാർ
  rationale: മൂലത്തിലെ ബഹുവചനം നിലനിർത്തുകയും ജനനാമം നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מַלְכֵי מִצְרַיִם
  choice: ഈജിപ്തിലെ രാജാക്കന്മാർ
  rationale: ചരിത്രപരമായി അസാധാരണമായി തോന്നിയാലും മൂലപാഠത്തിലെ ബഹുവചനം മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: לָבוֹא עָלֵינוּ
  choice: നമുക്കെതിരെ വരാൻ
  rationale: ശത്രുതാപരമായ വരവ് എന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു; ‘ആക്രമിക്കാൻ’ എന്ന് കൂടുതൽ വ്യാഖ്യാനിച്ചു പറയുന്നില്ല.
theological_decisions:
- issue: אֲדֹנָי എന്ന ദൈവിക സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഈ സന്ദർഭത്തിൽ പരാമർശിക്കുന്നത് ഇസ്രായേലിന്റെ ദൈവത്തെയാണ്. എന്നാൽ മൂലത്തിൽ ചതുർക്ഷര ദൈവനാമമല്ല, אֲדֹנָי എന്ന സ്ഥാനപ്പേരായതിനാൽ അതിനനുസരിച്ചുള്ള ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായെങ്കിലും തിരുവെഴുത്തിന്റെ ആഖ്യാനത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ഹീബ്രുവിലെ ‘ശബ്ദം’ എന്ന ത്രിവിധ ആവർത്തനവും ‘രാജാക്കന്മാർ’ എന്ന അസാധാരണ ബഹുവചനവും നിലനിർത്തിയിരിക്കുന്നു.
