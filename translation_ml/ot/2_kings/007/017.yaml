base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/017.yaml
  text: The king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
translation:
  language: ml
  text: രാജാവ് ആരുടെ കൈയിൽ ചാരിയിരുന്നോ[b], ആ ഉദ്യോഗസ്ഥനെ[a] കവാടത്തിന്റെ ചുമതല ഏൽപ്പിച്ചിരുന്നു. എന്നാൽ ജനം കവാടത്തിൽവെച്ച് അവനെ ചവിട്ടിമെതിച്ചു; അവൻ മരിച്ചു—രാജാവ് തന്റെ അടുക്കൽ ഇറങ്ങിവന്നപ്പോൾ ദൈവപുരുഷൻ പറഞ്ഞിരുന്നതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സേനാനായകൻ’ അല്ലെങ്കിൽ ‘രാജാവിന്റെ ഉന്നത സഹായി’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ שָׁלִישׁ രാജാവിനോടടുത്ത ഉന്നത ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ആരുടെ കൈയിൽ അവൻ ചാരിയിരുന്നോ’; ഇത് രാജാവിനോടടുത്ത ഉന്നത സഹായിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: הִפְקִיד
  choice: ചുമതല ഏൽപ്പിച്ചിരുന്നു
  rationale: ഹിഫിൽ രൂപം ഇവിടെ ഒരാളെ മേൽനോട്ടച്ചുമതല ഏൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ മുൻകാല നിയമനം വ്യക്തമാക്കാൻ പൂർവപൂർണകാലസദൃശമായ പ്രയോഗം സ്വീകരിച്ചു.
- source_word: הַשָּׁלִישׁ
  choice: ഉദ്യോഗസ്ഥൻ
  rationale: രാജാവിനോടടുത്ത ഉന്നത സൈനികനെയോ രാജസഹായിയെയോ സൂചിപ്പിക്കാം; നിശ്ചിത പദവി അനാവശ്യമായി ഉറപ്പിക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נִשְׁעָן עַל יָדוֹ
  choice: ആരുടെ കൈയിൽ ചാരിയിരുന്നോ
  rationale: יָד എന്ന ‘കൈ’ എന്ന ദൃശ്യരൂപവും രാജാവിനോടടുത്ത പരിചാരകനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: עַל הַשַּׁעַר
  choice: കവാടത്തിന്റെ ചുമതല
  rationale: הִפְקִיד എന്ന ക്രിയയോടൊപ്പം עַל ഇവിടെ സ്ഥലമാത്രമല്ല, മേൽനോട്ടച്ചുമതലയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּרְמְסֻהוּ
  choice: അവനെ ചവിട്ടിമെതിച്ചു
  rationale: רמס എന്ന ക്രിയയുടെ ശക്തമായ ചവിട്ടൽ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: പട്ടണവാസികൾ കൂട്ടമായി കവാടത്തിലൂടെ പാഞ്ഞ സാഹചര്യത്തിലും ‘ജനങ്ങൾ’ എന്ന അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു.
- source_word: בַּשַּׁעַר
  choice: കവാടത്തിൽവെച്ച്
  rationale: സംഭവം നടന്നത് കവാടപ്രദേശത്തിനുള്ളിലോ അവിടെത്തന്നെയോ ആണെന്ന സ്ഥലസൂചന വ്യക്തമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: പറഞ്ഞിരുന്നതുപോലെതന്നെ
  rationale: മുൻപ് പ്രസ്താവിച്ച പ്രവചനവാക്ക് കൃത്യമായി നിറവേറിയെന്ന ആഖ്യാനഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: ‘ദൈവത്തിന്റെ മനുഷ്യൻ’ എന്ന സ്ഥിരമായ എബ്രായ സ്ഥാനപ്പേരിന്റെ അർഥവും ബൈബിൾപരമായ ഗൗരവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּרֶדֶת הַמֶּלֶךְ אֵלָיו
  choice: രാജാവ് തന്റെ അടുക്കൽ ഇറങ്ങിവന്നപ്പോൾ
  rationale: בְּ ചേർന്ന ക്രിയാനാമരൂപത്തിന്റെ കാലസൂചനയും അֵלָיו എന്ന ‘അവന്റെ അടുക്കൽ’ എന്ന ബന്ധവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: പ്രവചനനിവൃത്തിയുടെ സൂത്രവാക്യം
  choice: ഉദ്യോഗസ്ഥന്റെ മരണം ദൈവപുരുഷൻ മുമ്പ് പറഞ്ഞ വാക്കുപോലെതന്നെ സംഭവിച്ചതായി നേരിട്ട് ബന്ധിപ്പിച്ചു.
  alternative: മുൻപ്രവചനവുമായി വ്യക്തമായ ബന്ധം കാണിക്കാതെ ഉദ്യോഗസ്ഥന്റെ മരണം മാത്രം വിവരിക്കാമായിരുന്നു.
  rationale: כַּאֲשֶׁר דִּבֶּר എന്നതും ആവർത്തിക്കുന്ന דִּבֶּר ഘടനയും ഈ സംഭവത്തെ മുൻവാക്കിന്റെ നിവൃത്തിയായി ഊന്നിപ്പറയുന്നു; അതിലധികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ ആ ഊന്നൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഉദ്യോഗസ്ഥൻ’ എന്ന പൊതുപദം പദവിയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം നിലനിർത്തുന്നു; ‘കൈയിൽ ചാരിയിരുന്നോ’ എന്ന രൂപം മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം സംരക്ഷിക്കുന്നു. പ്രവചനനിവൃത്തിയുടെ അവസാനവാക്യം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ഡാഷ് ഉപയോഗിച്ച് ബന്ധിപ്പിച്ചു.
