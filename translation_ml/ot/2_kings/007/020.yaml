  text: וַ/יְהִי ל֖/וֹ כֵּ֑ן וַ/יִּרְמְס֨וּ אֹת֥/וֹ הָ/עָ֛ם בַּ/שַּׁ֖עַר וַ/יָּמֹֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/020.yaml
  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
translation:
  language: ml
  text: 'അങ്ങനെതന്നെ അവന് സംഭവിച്ചു[a]: കവാടത്തിൽവെച്ച്[b] ജനം അവനെ ചവിട്ടിമെതിച്ചു; അവൻ മരിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന് അങ്ങനെതന്നെയായി.’ മുമ്പ് അറിയിച്ചതുപോലെതന്നെ സംഭവങ്ങൾ നടന്നുവെന്നതാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കവാടത്തിനരികിൽ’ അല്ലെങ്കിൽ ‘കവാടസമുച്ചയത്തിൽ.’ എബ്രായപദം നഗരകവാടത്തെയോ അതുമായി ബന്ധപ്പെട്ട വിശാലമായ പ്രവേശനപ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  choice: അങ്ങനെതന്നെ അവന് സംഭവിച്ചു
  rationale: היה + לְ + സർവനാമം, כֵן എന്നിവ ചേർന്ന ഈ പ്രയോഗം, മുമ്പ് പറഞ്ഞതുപോലെതന്നെ കാര്യം അവന് സംഭവിച്ചുവെന്ന് സൂചിപ്പിക്കുന്നു. പ്രവചനനിവൃത്തിയുടെ ആശയം വിശദീകരണം കൂട്ടാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּרְמְסוּ
  choice: ചവിട്ടിമെതിച്ചു
  rationale: רמס എന്ന ക്രിയ കാലുകൊണ്ട് ചവിട്ടിമെതിക്കുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സംഭവത്തിന്റെ ശക്തിയും മരണത്തിലേക്കുള്ള പശ്ചാത്തലബന്ധവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: עַם എന്ന സാധാരണ നാമത്തിന്റെ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ കവാടത്തിലൂടെ തള്ളിക്കയറിയ നഗരജനത്തെ സൂചിപ്പിക്കുന്നു. ‘ജനക്കൂട്ടം’ സന്ദർഭസൂചന കൂടുതൽ വ്യക്തമാക്കുമെങ്കിലും മൂലപദത്തേക്കാൾ വ്യാഖ്യാനപരമാണ്.
- source_word: בַּשַּׁעַר
  choice: കവാടത്തിൽവെച്ച്
  rationale: שַׁעַר നഗരകവാടത്തെയോ അതിന്റെ കവാടസമുച്ചയത്തെയോ സൂചിപ്പിക്കാം. ‘കവാടത്തിൽവെച്ച്’ സ്ഥലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും പദത്തിന്റെ സ്ഥലപരമായ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיָּמֹת
  choice: അവൻ മരിച്ചു
  rationale: തുടർസംഭവം രേഖപ്പെടുത്തുന്ന ലളിതമായ ക്രിയാരൂപം നേരിട്ട് പരിഭാഷപ്പെടുത്തി. ചവിട്ടിമെതിക്കപ്പെട്ടതിന്റെ ഫലമായാണ് മരണം സംഭവിച്ചതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ‘അതുകൊണ്ട്’ എന്ന കാരണസൂചകം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ന്യായവിധിയും പ്രവചനനിവൃത്തിയും സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: മുമ്പ് അറിയിച്ചതുപോലെ ഉദ്യോഗസ്ഥന്റെ വിധി സംഭവിച്ചുവെന്ന് സൂചിപ്പിക്കുന്നുവെങ്കിലും, മുഖ്യവാക്യത്തിൽ വിശദമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
  alternative: ‘അങ്ങനെ ദൈവവിധി അവന്റെമേൽ വന്നു’ എന്നതുപോലെ ന്യായവിധിയെ നേരിട്ട് മുൻനിർത്താം.
  rationale: സമീപസന്ദർഭം എലീശായുടെ വാക്കിന്റെ നിവൃത്തിയും യഹോവയുടെ ന്യായവിധിയും വ്യക്തമാക്കുന്നു. എന്നാൽ ഈ വാക്യം സംഭവം ആഖ്യാനരൂപത്തിലാണ് പ്രസ്താവിക്കുന്നത്; അതിനാൽ മൂലപാഠത്തിലെ ആഖ്യാനസ്വഭാവവും സൂചനാത്മകമായ ദൈവശാസ്ത്രഭാരവും അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ചവിട്ടിമെതിച്ചു’ എന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മൂലക്രിയയുടെ തീവ്രതയ്ക്ക് യോജിച്ചതുമാണ്. പ്രവചനനിവൃത്തി സൂചിപ്പിക്കാൻ ‘അങ്ങനെതന്നെ’ ഉപയോഗിച്ചെങ്കിലും വ്യാഖ്യാനാത്മകമായ ദൈവശാസ്ത്രവാക്കുകൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
