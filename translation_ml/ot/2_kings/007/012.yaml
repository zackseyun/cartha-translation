  choice: രാജാവ് രാത്രിയിൽ എഴുന്നേറ്റ്
  rationale: രാത്രിയിലെ വിശ്രമത്തിൽനിന്ന് എഴുന്നേൽക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: עֲבָדָיו
  choice: തന്റെ ഭൃത്യന്മാരോട്
  rationale: രാജസഭാ പശ്ചാത്തലത്തിൽ രാജാവിനെ സേവിക്കുന്നവരെയോ പരിചാരകരെയോ സൂചിപ്പിക്കുന്ന വിശാലമായ പദമാണ്; ‘ഭൃത്യന്മാർ’ ഈ അർഥം നിലനിർത്തുന്നു.
- source_word: אַגִּידָה נָּא לָכֶם
  choice: ഞാൻ നിങ്ങളോടു പറയട്ടെ
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിന്റെയും נָא എന്ന വിനയപൂർവമായ അഭ്യർഥനാകണത്തിന്റെയും ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר עָשׂוּ לָנוּ אֲרָם
  choice: അരാം നമ്മോടു ചെയ്തിരിക്കുന്നത്
  rationale: ഭൂവിഭാഗത്തിന്റെയോ ജനതയുടെയോ പേരായ അരാം അതിന്റെ ജനത്തെയോ സൈന്യത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു; തുടർന്നുള്ള ബഹുവചന സർവനാമം കൂട്ടായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יָדְעוּ כִּי רְעֵבִים אֲנַחְנוּ
  choice: നാം വിശന്നിരിക്കുന്നുവെന്ന് അവർ അറിയുന്നു
  rationale: രാജാവ് ശത്രുക്കളുടെ ഇപ്പോഴത്തെ അറിവും പദ്ധതിയും വിശദീകരിക്കുന്നതിനാൽ വർത്തമാനകാലം സന്ദർഭോചിതമാണ്.
- source_word: וַיֵּצְאוּ מִן הַמַּחֲנֶה
  choice: അവർ പാളയത്തിൽനിന്നു പുറപ്പെട്ട്
  rationale: സൈനിക പാളയം വിട്ടുപോയ സമീപകാല പ്രവൃത്തിയെ മലയാളത്തിലെ തുടർക്രിയ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: לְהֵחָבֵה בַשָּׂדֶה
  choice: വയലിൽ ഒളിച്ചിരിക്കുകയാണ്
  rationale: സ്വയം ഒളിച്ചിരിക്കുന്നതെന്ന പ്രത്യാവർത്തക അർഥവും നഗരത്തിനു പുറത്തുള്ള പതിയിരിപ്പിടവും വ്യക്തമാക്കുന്നു.
- source_word: כִּי יֵצְאוּ מִן הָעִיר
  choice: അവർ നഗരത്തിൽനിന്നു പുറത്തുവരുമ്പോൾ
  rationale: പതിയിരിപ്പു പദ്ധതിയിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന സാഹചര്യം ‘വരുമ്പോൾ’ എന്ന കാലബന്ധത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְנִתְפְּשֵׂם חַיִּים
  choice: നാം അവരെ ജീവനോടെ പിടിച്ച്
  rationale: പെട്ടെന്നുള്ള പിടിച്ചടക്കലിനെയും חַיִּים എന്ന ‘ജീവനോടെ’ എന്ന നിലയെയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וְאֶל הָעִיר נָבֹא
  choice: നഗരത്തിൽ കടക്കും
  rationale: ഒളിച്ചിരിക്കുന്നവരുടെ സങ്കൽപ്പിത പദ്ധതിയുടെ അവസാന നടപടിയെ ചുരുക്കവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു.
