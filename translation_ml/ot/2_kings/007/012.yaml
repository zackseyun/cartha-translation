  revised_text: 'അപ്പോൾ രാജാവ് രാത്രിയിൽ എഴുന്നേറ്റ് തന്റെ ഭൃത്യന്മാരോടു പറഞ്ഞു: “അരാം[a] നമ്മോടു ചെയ്തിരിക്കുന്നത് എന്താണെന്ന് ഞാൻ നിങ്ങളോടു ഒന്നു പറയട്ടെ. നാം വിശന്നിരിക്കുന്നുവെന്ന് അവർ അറിയുന്നു. അതുകൊണ്ട്, ‘അവർ നഗരത്തിൽനിന്നു പുറത്തുവരുമ്പോൾ നാം അവരെ ജീവനോടെ പിടിച്ച് നഗരത്തിൽ കടക്കും’ എന്നു പറഞ്ഞ് അവർ പാളയത്തിൽനിന്നു പുറപ്പെട്ട് വയലിൽ ഒളിച്ചിരിക്കുന്നു.”'
