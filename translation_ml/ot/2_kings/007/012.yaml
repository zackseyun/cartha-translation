  source_fidelity: 'മുഖ്യ അർഥം സംരക്ഷിച്ചിരിക്കുന്നു: രാജാവിന്റെ സംശയാധിഷ്ഠിതമായ അരാമ്യരുടെ പതിയിരിപ്പു പദ്ധതി, ജീവനോടെ പിടികൂടൽ, നഗരത്തിൽ പ്രവേശിക്കൽ എന്നിവയെല്ലാം വ്യക്തമാണ്. എന്നാൽ “ഒളിച്ചിരിക്കുകയാണ്” എന്നും “അവർ പറയുന്നത്” എന്നും ഉള്ള തുടരുന്ന വർത്തമാനരൂപങ്ങൾ എബ്രായത്തിലെ പൂർത്തിയായ പുറപ്പെടലിനെയും ഒളിച്ചിരിപ്പിനെയും പദ്ധതിയെ പരിചയപ്പെടുത്തുന്ന לֵאמֹר-നെയും കുറച്ചുകൂടി സജീവമായ ഇപ്പോഴത്തെ പ്രവൃത്തിയായി മാറ്റുന്നു. “നിങ്ങളോടു” എന്നതിനു ശേഷം “ഒന്നു” ചേർക്കുന്നതിലൂടെ נָאയുടെ വിനയ/അടിയന്തര ഭാവവും കൂടുതൽ പ്രതിഫലിക്കുന്നു.'
