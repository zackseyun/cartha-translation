base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് രാത്രിയിൽ എഴുന്നേറ്റ് തന്റെ ഭൃത്യന്മാരോടു പറഞ്ഞു: “അരാം[a] നമ്മോടു ചെയ്തിരിക്കുന്നത് എന്താണെന്ന് ഞാൻ നിങ്ങളോടു ഒന്നു പറയട്ടെ. നാം വിശന്നിരിക്കുന്നുവെന്ന് അവർ അറിയുന്നു. അതുകൊണ്ട്, ‘അവർ നഗരത്തിൽനിന്നു പുറത്തുവരുമ്പോൾ നാം അവരെ ജീവനോടെ പിടിച്ച് നഗരത്തിൽ കടക്കും’ എന്നു പറഞ്ഞ് അവർ പാളയത്തിൽനിന്നു പുറപ്പെട്ട് വയലിൽ ഒളിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അരാമ്യർ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അരാം എന്ന സ്ഥലനാമം/ജനനാമം അരാമിലെ ജനത്തെയോ സൈന്യത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
