translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സൈനികസന്ദർഭം വ്യക്തമാക്കുമ്പോഴും മൂലത്തിലെ ചുരുക്കവും പദപ്രയോഗത്തിലെ അനിശ്ചിതത്വവും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
