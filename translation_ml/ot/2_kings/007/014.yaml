id: 2KI.7.14
reference: 2 Kings 7:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְח֕וּ שְׁנֵ֖י רֶ֣כֶב סוּסִ֑ים וַ/יִּשְׁלַ֨ח הַ/מֶּ֜לֶךְ אַחֲרֵ֧י מַחֲנֵֽה אֲרָ֛ם לֵ/אמֹ֖ר לְכ֥וּ וּ/רְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/014.yaml
  text: So they took two chariots with horses[a], and the king sent them after the camp of Aram, saying, “Go and see.”
translation:
  language: ml
  text: അങ്ങനെ അവർ കുതിരകളോടുകൂടിയ രണ്ടു രഥങ്ങൾ[a] എടുത്തു. രാജാവ് അവരെ അരാമിന്റെ പാളയത്തിനു പിന്നാലെ അയച്ചുകൊണ്ട്, “പോയി നോക്കുക” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘കുതിരകളുടെ രണ്ടു രഥങ്ങൾ’; കുതിരകൾ വലിക്കുന്ന രണ്ടു രഥങ്ങളെയോ രണ്ടു രഥസംഘങ്ങളെയോ സൂചിപ്പിക്കുന്ന ചുരുക്കപ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: അങ്ങനെ അവർ എടുത്തു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; സന്ദർഭത്തിലെ ഫലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘അങ്ങനെ’ വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵי רֶכֶב סוּסִים
  choice: കുതിരകളോടുകൂടിയ രണ്ടു രഥങ്ങൾ
  rationale: എബ്രായ പ്രയോഗം ചുരുക്കിയതും അല്പം ദ്വയാർഥസാധ്യതയുള്ളതുമാണ്. കുതിരകൾ വലിക്കുന്ന രണ്ടു രഥങ്ങളെയോ രണ്ടു രഥസംഘങ്ങളെയോ സൂചിപ്പിക്കാം; പ്രധാന പാഠത്തിൽ വ്യക്തത നിലനിർത്തിക്കൊണ്ട് അടിക്കുറിപ്പിൽ രൂപപരമായ അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ
  choice: രാജാവ് അവരെ ... അയച്ചു
  rationale: ‘അവരെ’ എന്ന കർമം എബ്രായത്തിൽ പരോക്ഷമാണെങ്കിലും തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ചേർത്തിരിക്കുന്നു.
- source_word: אַחֲרֵי מַחֲנֵה אֲרָם
  choice: അരാമിന്റെ പാളയത്തിനു പിന്നാലെ
  rationale: אַחֲרֵי എന്നതിന്റെ ദിശാസൂചകമായ ‘പിന്നാലെ’ എന്ന അർഥവും מַחֲנֶה എന്നതിന്റെ ‘പാളയം’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: പുരാതന രാജ്യനാമം ആധുനിക ‘സിറിയ’യായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֵאמֹר
  choice: എന്നു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന എബ്രായ ഘടനയ്ക്ക് സ്വാഭാവികമായ മലയാള സമാനരൂപം.
- source_word: לְכוּ וּרְאוּ
  choice: പോയി നോക്കുക
  rationale: രണ്ടു ലളിത ആജ്ഞകളും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ראה എന്നതിന്റെ സന്ദർഭോചിതമായ പൊതുവായ അർഥം ‘നോക്കുക’ ആണ്.
