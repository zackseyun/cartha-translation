reference: 2 Kings 7:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן הַ/שָּׁלִ֜ישׁ אֶת אִ֣ישׁ הָ/אֱלֹהִים֮ וַ/יֹּאמַר֒ וְ/הִנֵּ֣ה יְהוָ֗ה עֹשֶׂ֤ה אֲרֻבּוֹת֙ בַּ/שָּׁמַ֔יִם הֲ/יִהְיֶ֖ה כַּ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יֹּ֗אמֶר הִנְּ/ךָ֤ רֹאֶה֙ בְּ/עֵינֶ֔י/ךָ וּ/מִ/שָּׁ֖ם לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/019.yaml
  text: Then the officer answered the man of God and said[a], “If Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you will see it with your own eyes, but you will not eat from it.”
translation:
  language: ml
  text: 'അപ്പോൾ ആ ഉദ്യോഗസ്ഥൻ ദൈവപുരുഷനോടു മറുപടിയായി പറഞ്ഞു: “യാഹ്‌വെ ആകാശത്തിൽ ജാലകങ്ങൾ തുറന്നാലും ഇങ്ങനെയൊരു കാര്യം സംഭവിക്കുമോ?” ദൈവപുരുഷൻ പറഞ്ഞു: “നോക്കൂ, നീ അതു സ്വന്തം കണ്ണുകളാൽ കാണും; എന്നാൽ അതിൽനിന്ന് നീ ഭക്ഷിക്കുകയില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അതിൽനിന്ന്” എന്നത് ഇവിടെ ലഭിക്കാനിരുന്ന ആഹാരസമൃദ്ധിയെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “അവിടെനിന്ന്” എന്നാണ്.
    reason: clarifies_reference
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: ആ ഉദ്യോഗസ്ഥൻ
  rationale: ഉന്നത സൈനികനെയോ രാജസേവകനെയോ സൂചിപ്പിക്കുന്ന പദം. കൃത്യമായ പദവി അനാവശ്യമായി നിർണയിക്കാതെ സന്ദർഭത്തിന് യോജിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബൈബിൾ പദവി ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: ആകാശത്തിൽ കിളിവാതിലുകൾ ഉണ്ടാക്കിയാലും
  rationale: אֲרֻבּוֹת എന്നതിന്റെ ‘ജാലകങ്ങൾ/തുറവുകൾ’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; സോപാധികമായ സംശയപ്രശ്നം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הֲיִהְיֶה כַּדָּבָר הַזֶּה
  choice: ഇങ്ങനെയൊരു കാര്യം സംഭവിക്കുമോ?
  rationale: പ്രവചനത്തിന്റെ നിവൃത്തിയെക്കുറിച്ചുള്ള സംശയം വ്യക്തമാക്കുന്ന സ്വാഭാവിക ചോദ്യരൂപം.
- source_word: הִנְּךָ רֹאֶה בְּעֵינֶיךָ
  choice: നീ അതു സ്വന്തം കണ്ണുകൊണ്ടു കാണും
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന കണികയുടെ പ്രാബല്യവും പ്രവചനാത്മകമായ പങ്കാളിക്രിയയുടെ ഭാവികാല അർഥവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: എന്നാൽ അതിൽനിന്ന് നീ ഭക്ഷിക്കുകയില്ല
  rationale: מִשָּׁם എന്നതിന്റെ അക്ഷരാർഥമായ ‘അവിടെനിന്ന്’ എന്ന സൂചനയെ വാഗ്ദത്തമായ ആഹാരവുമായി ബന്ധപ്പെടുത്തി, അവ്യക്തത കുറയുന്ന വിധത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: നാലക്ഷര ദൈവനാമത്തെ ‘കർത്താവ്’ എന്ന സ്ഥാനപദംകൊണ്ട് മാറ്റാതെ പേരായി നിലനിർത്തുന്നു; മലയാള ബൈബിൾ വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ രൂപം തിരഞ്ഞെടുത്തു.
- issue: അധികാരിയുടെ വാക്കിലെ സോപാധികതയും സംശയവും
  choice: ‘ഉണ്ടാക്കിയാലും ... സംഭവിക്കുമോ?’ എന്ന അസാധ്യത സൂചിപ്പിക്കുന്ന ചോദ്യം
  alternative: ‘ഉണ്ടാക്കുകയാണെങ്കിൽ ... സംഭവിക്കുമോ?’
  rationale: ഹീബ്രു വാക്യം സങ്കൽപ്പിത സാഹചര്യം ഉന്നയിച്ച് പ്രവചനത്തെ സംശയിക്കുന്നു. ദൈവശക്തിയെക്കുറിച്ചുള്ള നിഗമനം വ്യാഖ്യാനമായി കൂട്ടിച്ചേർക്കാതെ ആ പരിഹാസാത്മക സംശയം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ‘ദൈവപുരുഷൻ’ എന്ന പരമ്പരാഗത പ്രവാചകപദവിയും ആകാശത്തിലെ തുറവുകളുടെ മൂലദൃശ്യവും നിലനിർത്തി; ഉദ്യോഗസ്ഥന്റെ സംശയവും പ്രവാചകന്റെ വിധിപ്രഖ്യാപനവും മൃദൂകരിച്ചിട്ടില്ല.
