id: 2KI.6.20
reference: 2 Kings 6:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֮ כְּ/בֹאָ֣/ם שֹׁמְרוֹן֒ וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע יְהוָ֕ה פְּקַ֥ח אֶת עֵינֵֽי אֵ֖לֶּה וְ/יִרְא֑וּ וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵ֣ינֵי/הֶ֔ם וַ/יִּרְא֕וּ וְ/הִנֵּ֖ה בְּ/ת֥וֹךְ שֹׁמְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
translation:
  language: ml
  text: 'അവർ ശമര്യയിൽ എത്തിയപ്പോൾ എലീശാ പറഞ്ഞു: “യഹ്‌വേ, ഇവരുടെ[a] കണ്ണുകൾ തുറക്കണമേ; അവർ കാണട്ടെ.” യഹ്‌വേ അവരുടെ കണ്ണുകൾ തുറന്നു. അവർ കണ്ടു—അതാ, അവർ ശമര്യയുടെ നടുവിലായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിൽ അക്ഷരാർഥം ‘ഇവർ’; സന്ദർഭത്തിൽ അരാമ്യ സൈനികരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: സൂചകസർവനാമത്തിന്റെ പദശക്തിയും സന്ദർഭത്തിലെ വ്യക്തമായ സൂചനയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  choice: അവർ ... എത്തിയപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സംഭവക്രമവും കാലസംബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘സംഭവിച്ചു’ എന്ന പദം പ്രത്യേകം ചേർക്കേണ്ടതില്ല.
- source_word: שֹׁמְרוֹן
  choice: ശമര്യ
  rationale: ഇവിടെ പ്രദേശത്തെയല്ല, നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ഒരു സ്ഥാനപ്പേര് ഉപയോഗിക്കാതെ എബ്രായ ദൈവനാമമായ യ്ഹ്വ്ഹിനെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: פְּקַח אֶת עֵינֵי
  choice: കണ്ണുകൾ തുറക്കണമേ
  rationale: ദൈവം വരുത്തിയിരുന്ന കാണായ്മയോ തിരിച്ചറിയാനാകാത്ത അവസ്ഥയോ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ രൂപകം നിലനിർത്തുന്നു.
- source_word: אֵלֶּה
  choice: ഇവരുടെ
  rationale: ‘ഇവർ’ എന്ന സൂചകസർവനാമം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് അരാമ്യ സൈനികരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְיִרְאוּ
  choice: അവർ കാണട്ടെ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ക്രിയയിൽ ഉദ്ദേശ്യത്തിന്റെയും അനുവദനത്തിന്റെയും ഭാവം ഉണ്ടാകാം; മലയാളത്തിലെ ഈ രൂപം അതിനെ അനാവശ്യമായി ചുരുക്കിത്തീർക്കുന്നില്ല.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള തിരിച്ചറിവിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരസൂചകത്തിന്റെ നാടകീയബലം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּתוֹךְ שֹׁמְרוֹן
  choice: ശമര്യയുടെ നടുവിൽ
  rationale: അവർ നഗരത്തിനുള്ളിൽ, അതിന്റെ മധ്യഭാഗത്ത് എത്തിയെന്ന നാടകീയമായ അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വന്നിരിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമത്തിന്റെ ലിപ്യന്തരണം ഉപയോഗിച്ചു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ എബ്രായ നാമത്തിന്റെ സാധ്യതയുള്ള ഉച്ചാരണത്തോട് ‘യഹ്‌വേ’ അടുത്തുനിൽക്കുന്നു.
- issue: കണ്ണുകൾ തുറക്കുക എന്നതിന്റെ സ്വഭാവം
  choice: രൂപകം അതേപടി നിലനിർത്തി
  alternative: അവർക്ക് കാഴ്ച തിരികെ നൽകുക / തിരിച്ചറിയാൻ ഇടയാക്കുക
  rationale: സംഭവം ശാരീരിക കാഴ്ചയെയും ദൈവികമായി തടഞ്ഞ തിരിച്ചറിവിനെയും ഒരുമിച്ച് സൂചിപ്പിക്കാവുന്നതിനാൽ അതിനെ ഒരു അർഥത്തിലേക്ക് മാത്രം ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ആഖ്യാനത്തിന്റെ വേഗവും ‘അതാ’ എന്ന ശ്രദ്ധാകർഷക പ്രയോഗത്തിന്റെ നാടകീയതയും നിലനിർത്തി; അമിതമായ പഴയ ശൈലി ഒഴിവാക്കി.
