  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
translation:
  language: ml
  text: 'അവർ അവന്റെ നേരെ ഇറങ്ങിവന്നപ്പോൾ, എലീശാ യഹ്‌വേയോടു പ്രാർഥിച്ചു: “ദയവായി ഈ ജനത്തെ അന്ധതകൊണ്ട് പ്രഹരിക്കണമേ.” അപ്പോൾ യഹ്‌വേ എലീശായുടെ വാക്കുപ്രകാരം അവരെ അന്ധതകൊണ്ട് പ്രഹിച്ചു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അന്ധത’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം, ആളുകൾക്ക് ശരിയായി കാണാനോ തിരിച്ചറിയാനോ കഴിയാതാക്കുന്ന ദൈവികമായ കാഴ്ചക്കുഴപ്പത്തെയും സൂചിപ്പിക്കാം; അത് നിർബന്ധമായും പൂർണമായോ സ്ഥിരമായോ ഉള്ള അന്ധതയാകണമെന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  choice: അവർ അവന്റെ നേരെ ഇറങ്ങിവന്നപ്പോൾ
  rationale: ירד എന്നത് ‘ഇറങ്ങിവരുക’ എന്നും אֶל സമീപനവും സന്ദർഭത്തിലെ ശത്രുതയും സൂചിപ്പിക്കുന്നു. ‘അവന്റെ നേരെ’ സൈനികമായ നീക്കത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע אֶל יְהוָה
  choice: എലീശാ യഹ്‌വേയോടു പ്രാർഥിച്ചു
  rationale: התפלל എന്ന സാധാരണ പ്രാർഥനാക്രിയയും യְהוָה എന്ന ദൈവനാമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַךְ נָא
  choice: ദയവായി ... പ്രഹരിക്കണമേ
  rationale: נכה എന്നതിന്റെ ‘പ്രഹരിക്കുക’ എന്ന ശക്തിയും נָאയുടെ വിനീതമായ അപേക്ഷാഭാവവും മലയാള പ്രാർഥനാശൈലിയിൽ നിലനിർത്തുന്നു.
- source_word: הַגּוֹי הַזֶּה
  choice: ഈ ജനത്തെ
  rationale: גוי ‘ജനം/ജനത/രാഷ്ട്രം’ എന്നർഥമുള്ളതാണ്. ഇവിടെ അരാമ്യസേനയെ കൂട്ടമായി പരാമർശിക്കുന്നതിനാൽ ‘ഈ ജനത്തെ’ കൂടുതൽ സ്വാഭാവികമാണ്; ‘രാജ്യം’ എന്നു പറഞ്ഞാൽ മുഴുവൻ രാഷ്ട്രീയ ഘടനയെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാം.
- source_word: בַּסַּנְוֵרִים
  choice: അന്ധതകൊണ്ട്
  rationale: ദൈവികമായി വരുത്തപ്പെട്ട കാഴ്ചവൈകല്യത്തെ സൂചിപ്പിക്കുന്ന അപൂർവ പദത്തിന് സുതാര്യമായ മലയാളസമാനത. പൂർണവും സ്ഥിരവുമായ അന്ധത മാത്രം നിർബന്ധമല്ലെന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיַּכֵּם
  choice: അപ്പോൾ ... അവൻ അവരെ ... പ്രഹിച്ചു
  rationale: സന്ദർഭത്തിൽ ഏകവചന കർത്താവ് യഹ്‌വേയാണ്. ‘അപ്പോൾ’ പ്രാർഥനയ്ക്കുള്ള പ്രതികരണമായ ആഖ്യാനക്രമം വ്യക്തമാക്കുന്നു.
- source_word: כִּדְבַר אֱלִישָׁע
  choice: എലീശായുടെ വാക്കുപ്രകാരം
  rationale: דבר എന്ന ‘വാക്ക്/ഉച്ചാരണം’ എന്ന അർഥവും പ്രവാചകന്റെ അപേക്ഷയും ദൈവിക പ്രവർത്തനവും തമ്മിലുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി പ്രതിനിധീകരിക്കുന്നു.
- issue: പ്രഹരിച്ചവന്റെ തിരിച്ചറിയൽ
  choice: അവൻ എന്ന സർവനാമം യഹ്‌വേയെയാണ് സൂചിപ്പിക്കുന്നത്
  alternative: യഹ്‌വേ എന്ന പേര് വീണ്ടും വ്യക്തമാക്കുക
  rationale: ഹീബ്രു പാഠം ക്രിയയിലെ ഏകവചന കർത്താവിനെ മാത്രം നൽകുന്നു; ഉടൻമുമ്പുള്ള പ്രാർഥനാസന്ദർഭം യഹ്‌വേയെയാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ മൂലത്തിന്റെ സർവനാമസദൃശമായ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, എന്നാൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആഖ്യാന-പ്രാർഥനാശൈലി. ‘പ്രഹരിക്കണമേ’ വിനീത അപേക്ഷയും മൂലത്തിലെ ശക്തമായ ക്രിയയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
