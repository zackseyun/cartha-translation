translation_notes:
  register: ആധുനികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ സംഭവക്രമം സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കി. ‘കയറിച്ചെന്ന്’ എന്നത് וַיַּעַל എന്ന മേലോട്ടുള്ള നീക്കത്തിന്റെ സൂചന നിലനിർത്തുന്നു.
