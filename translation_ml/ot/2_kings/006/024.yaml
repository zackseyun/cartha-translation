id: 2KI.6.24
reference: 2 Kings 6:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יִּקְבֹּ֛ץ בֶּן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם אֶת כָּל מַחֲנֵ֑/הוּ וַ/יַּ֕עַל וַ/יָּ֖צַר עַל שֹׁמְרֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/024.yaml
  text: And it happened after this that Ben-hadad king of Aram gathered all his army[b][a], and he went up and besieged Samaria.
translation:
  language: ml
  text: അതിനു ശേഷം, അരാം[b] രാജാവായ ബെൻ-ഹദദ് തന്റെ സൈന്യത്തെ മുഴുവൻ[a] ഒരുമിച്ചുകൂട്ടി; അവൻ ശമര്യയിലേക്കു കയറിച്ചെന്ന് അതിനെ ഉപരോധിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ സൈനികശക്തിയെ മുഴുവൻ”; എബ്രായത്തിൽ അക്ഷരാർഥം “തന്റെ പാളയം മുഴുവൻ.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “അരാം”; പരമ്പരാഗതമായി “സിറിയ” എന്നും വിവർത്തനം ചെയ്തിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: അതിനു ശേഷം
  rationale: പിന്നീടുണ്ടായ സംഭവത്തിലേക്കുള്ള എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ കാലക്രമബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘സംഭവിച്ചു’ എന്ന പദം നിർബന്ധമായി ചേർത്ത് വാക്യം കൃത്രിമമാക്കുന്നില്ല.
- source_word: וַיִּקְבֹּץ
  choice: ഒരുമിച്ചുകൂട്ടി
  rationale: ‘കൂട്ടിച്ചേർക്കുക/സമാഹരിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നേരിട്ട് നൽകുന്നു; സൈനികസന്ദർഭം നാമപദത്തിൽനിന്നു വ്യക്തമാണ്.
- source_word: בֶּן הֲדַד
  choice: ബെൻ-ഹദദ്
  rationale: വ്യക്തിനാമത്തിന്റെ എബ്രായരൂപം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מֶלֶךְ אֲרָם
  choice: അരാം രാജാവ്
  rationale: പരമ്പരാഗതമായ ‘സിറിയ’ എന്ന തിരിച്ചറിയലിനു പകരം മൂലപാഠത്തിലെ സ്ഥലനാമമായ അരാം നിലനിർത്തുന്നു.
- source_word: כָּל מַחֲנֵהוּ
  choice: തന്റെ സൈന്യത്തെ മുഴുവൻ
  rationale: מַחֲנֶה എന്നതിന് പാളയം, സൈന്യം, സൈനികസംഘം എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; യുദ്ധസന്ദർഭത്തിൽ ‘സൈന്യം’ വ്യക്തവും സ്വാഭാവികവുമാണ്, എന്നാൽ പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്ന്
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള മേലോട്ടുള്ള സൈനികനീക്കത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തുന്നു; ‘പടനീങ്ങി’ എന്നു വിവർത്തനം ചെയ്ത് മൂലത്തിൽ ഇല്ലാത്ത സാങ്കേതിക സൈനികനിറം കൂട്ടുന്നില്ല.
- source_word: וַיָּצַר עַל
  choice: ഉപരോധിച്ചു
  rationale: ഒരു നഗരത്തെ വളഞ്ഞ് ഉപരോധിക്കുക എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം സംക്ഷിപ്തമായും കൃത്യമായും നൽകുന്നു.
- source_word: שֹׁמְרוֹן
  choice: ശമര്യ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു.
