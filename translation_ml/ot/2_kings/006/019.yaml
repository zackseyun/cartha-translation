  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
translation:
  language: ml
  text: 'എലീശാ അവരോടു പറഞ്ഞു: “ഇതല്ല വഴി; ഇതല്ല നഗരം. എന്നെ അനുഗമിക്കൂ[a]; നിങ്ങൾ അന്വേഷിക്കുന്ന മനുഷ്യന്റെ അടുക്കലേക്ക് ഞാൻ നിങ്ങളെ നയിക്കും.” അങ്ങനെ അവൻ അവരെ ശമര്യയിലേക്കു നയിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എന്റെ പിന്നാലെ പോകൂ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדֶּרֶךְ
  choice: വഴി
  rationale: ദֶּרֶךְ എന്ന പദത്തിന്റെ സാധാരണ അർഥമായ ‘വഴി’ സന്ദർഭത്തിലെ നിർദിഷ്ടമായ സഞ്ചാരമാർഗത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָעִיר
  choice: നഗരം
  rationale: עִיר എന്നതിന്റെ സാധാരണ അർഥമായ ‘നഗരം’ നിലനിർത്തുകയും ‘ഇതല്ല’ എന്ന ചൂണ്ടിക്കാട്ടലോടുള്ള ബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: לְכוּ אַחֲרַי
  choice: എന്നെ അനുഗമിക്കൂ
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ പിന്നാലെ പോകൂ’ എന്നാണെങ്കിലും, കൂട്ടത്തോടുള്ള ആജ്ഞ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘എന്നെ അനുഗമിക്കൂ’ എന്നു നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְאוֹלִיכָה אֶתְכֶם
  choice: ഞാൻ നിങ്ങളെ നയിക്കാം
  rationale: הלך എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘നയിക്കുക/പോകുമാറാക്കുക’ എന്ന കാരകഭാവം വ്യക്തവും സ്വാഭാവികവുമായി പകർത്തുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: പുരുഷലിംഗ ഏകവചനമായ אִישׁ എന്നതും എലീശാ തന്നെക്കുറിച്ച് പരോക്ഷമായി പറയുന്നതിലെ ആഖ്യാനപരമായ വിരോധാഭാസവും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר תְּבַקֵּשׁוּן
  choice: നിങ്ങൾ അന്വേഷിക്കുന്ന
  rationale: בקשׁ എന്നതിന്റെ ‘അന്വേഷിക്കുക’ എന്ന അർഥവും അപ്പോൾ നടന്നുകൊണ്ടിരുന്ന തിരച്ചിലിന്റെ സ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיֹּלֶךְ אוֹתָם
  choice: അവൻ അവരെ … നയിച്ചു
  rationale: മുൻവാക്യത്തിലെ അതേ കാരകക്രിയയുമായുള്ള പദസാമ്യം നിലനിർത്തി, വഴികാട്ടിക്കൊണ്ടുപോയതിനെ വ്യക്തമാക്കുന്നു.
- source_word: שֹׁמְרוֹנָה
  choice: ശമര്യയിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה־യെ മലയാളത്തിൽ ‘-യിലേക്ക്’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: അരാമ്യരോടുള്ള എലീശായുടെ പ്രസ്താവനയിലെ വഞ്ചനാസ്വഭാവം
  choice: “ഇതല്ല വഴി; ഇതല്ല നഗരം” എന്ന വാക്കുകൾ വിശദീകരണമോ നൈതിക വിലയിരുത്തലോ ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് ഭാഗികസത്യമാണെന്നോ തുറന്ന വഞ്ചനയാണെന്നോ വ്യാഖ്യാനിക്കുന്ന പരാവർത്തനം.
  rationale: മൂലപാഠം പ്രസ്താവനയുടെ നൈതികമോ ദൈവശാസ്ത്രപരമോ ആയ വിലയിരുത്തൽ ഇവിടെ നിർവഹിക്കുന്നില്ല; അതിനാൽ അതിലെ സംഘർഷവും ആഖ്യാനപരമായ അനിശ്ചിതത്വവും പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സംഭാഷണത്തിൽ സ്വാഭാവികമായ ബഹുവചന ആജ്ഞാരൂപവും ആഖ്യാനത്തിൽ ലളിതമായ ഭൂതകാലരൂപവും ഉപയോഗിച്ചു.
