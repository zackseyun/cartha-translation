  rationale: The revision removes an unnecessary causal inference, restores the Hebrew attention marker, and makes the result expressed by עַד הֱיוֹת explicit in idiomatic Malayalam. It also improves readability of the debated phrase while retaining its literal rendering in the text and its ambiguity in the footnote.
