id: 2KI.6.25
reference: 2 Kings 6:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֨י רָעָ֤ב גָּדוֹל֙ בְּ/שֹׁ֣מְר֔וֹן וְ/הִנֵּ֖ה צָרִ֣ים עָלֶ֑י/הָ עַ֣ד הֱי֤וֹת רֹאשׁ חֲמוֹר֙ בִּ/שְׁמֹנִ֣ים כֶּ֔סֶף וְ/רֹ֛בַע הַ/קַּ֥ב חרי יונים בַּ/חֲמִשָּׁה כָֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/025.yaml
  text: And there was a great famine in Samaria; and behold[a], they were besieging it until a donkey’s head was eighty pieces of silver, and a fourth of a kab of dove’s dung was five pieces of silver.
translation:
  language: ml
  text: ശമര്യയിൽ വലിയൊരു ക്ഷാമം ഉണ്ടായി; ഇതാ, ശത്രുക്കൾ അതിനെ ഉപരോധിച്ചുകൊണ്ടിരുന്നു; ഒരു കഴുതയുടെ തല എൺപതു വെള്ളിക്കാശിനും ഒരു കബിന്റെ നാലിലൊന്ന് പ്രാവിന്റെ കാഷ്ഠം[a] അഞ്ചു വെള്ളിക്കാശിനും വിറ്റുപോകുന്നത്ര സ്ഥിതി വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാടപ്രാവിന്റെ കാഷ്ഠം.’ ചിലർ ഇതിനെ അക്ഷരാർഥത്തിലുള്ള പ്രാവിന്റെ കാഷ്ഠമായിത്തന്നെ മനസ്സിലാക്കുന്നു; മറ്റു ചിലർ ക്ഷാമകാലത്ത് വിറ്റിരുന്ന വിലകുറഞ്ഞ ഒരു ഭക്ഷ്യവസ്തുവിന്റെയോ സസ്യോൽപ്പന്നത്തിന്റെയോ പേരായിരിക്കാമെന്നു കരുതുന്നു.
    reason: חרי יונים എന്ന പ്രയോഗത്തിന്റെ അർഥത്തെക്കുറിച്ചുള്ള യഥാർഥ പദവ്യാഖ്യാനഭിന്നത സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וַיְהִי רָעָב גָּדוֹל
  choice: വലിയൊരു ക്ഷാമം ഉണ്ടായി
  rationale: സംഭവപശ്ചാത്തലം അവതരിപ്പിക്കുന്ന וַיְהִי എന്ന പ്രയോഗവും ക്ഷാമത്തിന്റെ തീവ്രത സൂചിപ്പിക്കുന്ന רָעָב גָּדוֹל എന്ന വാക്യഭാഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: നഗരത്തിനുള്ളിലെ സ്ഥിതി സൂചിപ്പിക്കുന്ന സ്ഥലവാചകത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה צָרִים עָלֶיהָ
  choice: ശത്രുക്കൾ അതിനെ ഉപരോധിച്ചുകൊണ്ടിരുന്നതിനാൽ
  rationale: צָרִים എന്ന കർത്താവ് മൂലപാഠത്തിൽ അനിർദ്ദിഷ്ടമായതിനാൽ സന്ദർഭാനുസൃതമായി ‘ശത്രുക്കൾ’ എന്നു നൽകി; കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവർത്തനം ‘ഉപരോധിച്ചുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ സൂചിപ്പിക്കുന്നു. וְהִנֵּהയുടെ ശ്രദ്ധാകർഷകബലം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ സാഹചര്യത്തിന്റെ ഊന്നലിലൂടെ കൈമാറുന്നു.
- source_word: עַד הֱיוֹת
  choice: … വിലയായി
  rationale: ഉപരോധത്തിന്റെ ഫലമായി വില അതിരൂക്ഷമായിത്തീർന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: רֹאשׁ חֲמוֹר
  choice: ഒരു കഴുതയുടെ തല
  rationale: ക്ഷാമത്തിന്റെ ഭീകരത പ്രകടമാക്കുന്ന ഞെട്ടിക്കുന്ന ദൃശ്യത്തെ അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: בִּשְׁמֹנִים כֶּסֶף
  choice: എൺപതു വെള്ളിക്കാശ്
  rationale: മൂലപാഠത്തിൽ നാണയഘടകത്തിന്റെ പേര് വ്യക്തമല്ല; അതിനാൽ ‘ശേക്കെൽ’ എന്നു അധികമായി നിർണ്ണയിക്കാതെ പൊതുവായ ധനമൂല്യപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: רֹבַע הַקַּב
  choice: ഒരു കബിന്റെ നാലിലൊന്ന്
  rationale: പുരാതന അളവായ קַב അതേപടി ലിപ്യന്തരിച്ചു, ഉറപ്പില്ലാത്ത ആധുനിക അളവിലേക്കുള്ള പരിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: חרי יונים
  choice: പ്രാവിൻകാഷ്ഠം
  rationale: പദസമുച്ചയത്തിന്റെ ഏറ്റവും നേരിട്ടുള്ള അർഥം സ്വീകരിക്കുന്നു; ഭക്ഷ്യവസ്തുവിന്റെയോ സസ്യോൽപ്പന്നത്തിന്റെയോ പേരായിരിക്കാമെന്ന വ്യാഖ്യാനഭിന്നത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בַּחֲמִשָּׁה כָסֶף
  choice: അഞ്ചു വെള്ളിക്കാശ്
  rationale: ആദ്യ വിലപ്രയോഗത്തോടു സമാന്തരമായി, വ്യക്തമാക്കാത്ത നാണയഘടകത്തെ അതിരുകടന്ന് നിർണ്ണയിക്കാതെ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. പുരാതന അളവ് ‘കബ്’ നിലനിർത്തി; വിലയുടെ അതിരൂക്ഷത വ്യക്തമാക്കുന്നതിനായി മലയാളത്തിൽ ‘വിലയായി’ ചേർത്തു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദത്തിനുതന്നെ ചേർത്തിരിക്കുന്നു.
