translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അത് നിനക്കായി എടുത്തുകൊള്ളുക.[a]” അപ്പോൾ അവൻ കൈ നീട്ടി അതെടുത്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത് നിനക്കായി ഉയർത്തിയെടുക്കുക.” എബ്രായ ആജ്ഞാരൂപം കൂടുതൽ അക്ഷരാർഥത്തിൽ “ഉയർത്തുക” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വയിക്തോൽ ആഖ്യാനക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ലളിതമായി നിലനിർത്തുന്നു; സന്ദർഭം ആവശ്യപ്പെടാത്ത അധികമായ ബന്ധപദം ചേർക്കുന്നില്ല.
- source_word: הָרֶם
  choice: എടുത്തുകൊൾക
  rationale: רוּם/הֵרִים എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം അക്ഷരാർഥത്തിൽ ‘ഉയർത്തുക’ എന്നാണെങ്കിലും, വെള്ളത്തിൽ പൊങ്ങിവന്ന ഇരുമ്പുതല കൈവശമാക്കാൻ പറയുന്ന ഈ സന്ദർഭത്തിൽ ‘എടുത്തുകൊൾക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לָךְ
  choice: നീ തന്നെ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള לְ ഇവിടെ ആ വ്യക്തിയുടെ സ്വന്തം പ്രവർത്തനമോ പങ്കാളിത്തമോ ഊന്നുന്നു; ‘നീ തന്നെ’ അത് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: അവൻ കൈ നീട്ടി
  rationale: എന്തെങ്കിലും പിടിക്കാനായി കൈ നീട്ടുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיִּקָּחֵהוּ
  choice: അതെടുത്തു
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘എടുക്കുക’ സംക്ഷിപ്തമായി നിലനിർത്തുകയും പുരുഷലിംഗ ഏകവചന കർമപ്രത്യയത്തെ സന്ദർഭാനുസൃതമായ ‘അത്’ എന്നു നൽകുകയും ചെയ്യുന്നു.
