source:
  edition: WLC
  text: עוֹדֶ֨/נּוּ֙ מְדַבֵּ֣ר עִמָּ֔/ם וְ/הִנֵּ֥ה הַ/מַּלְאָ֖ךְ יֹרֵ֣ד אֵלָ֑י/ו וַ/יֹּ֗אמֶר הִנֵּֽה זֹ֤את הָֽ/רָעָה֙ מֵ/אֵ֣ת יְהוָ֔ה מָֽה אוֹחִ֥יל לַ/יהוָ֖ה עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
translation:
  language: ml
  text: 'അവൻ അവരോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അതാ, ദൂതൻ അവന്റെ അടുക്കലേക്ക് ഇറങ്ങിവന്നു പറഞ്ഞു: “ഇതാ, ഈ അനർഥം യഹ്‌വേയിൽനിന്നാണ്. ഇനി ഞാൻ യഹ്‌വേക്കായി കാത്തിരിക്കേണ്ടതെന്തിന്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇനി ഞാൻ യഹ്‌വേയിൽ എന്തു പ്രത്യാശ വെക്കണം?” എബ്രായക്രിയയ്ക്ക് ‘കാത്തിരിക്കുക’ എന്നും ‘പ്രത്യാശിക്കുക’ എന്നും അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: അവൻ അവരോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ
  rationale: עוֹדֶנּוּ എന്ന പ്രയോഗത്തിന്റെ ‘അപ്പോഴും/ആ പ്രവൃത്തി തുടരുമ്പോൾ’ എന്ന അർഥവും מְדַבֵּר എന്ന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמַּלְאָךְ
  choice: ദൂതൻ
  rationale: സന്ദർഭത്തിൽ ഇത് രാജാവ് അയച്ച മനുഷ്യദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൂതൻ’ എന്നത് പദത്തിന്റെ അർഥം നിലനിർത്തുകയും സ്വർഗീയ ദൂതനെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: יֹרֵד אֵלָיו
  choice: അവന്റെ അടുക്കലേക്ക് ഇറങ്ങിവന്നു
  rationale: ירד എന്നതിലെ താഴേക്കുള്ള ചലനവും ലക്ഷ്യസ്ഥാനമായ ‘അവന്റെ അടുക്കൽ’ എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: הִנֵּה
  choice: അതാ / ഇതാ
  rationale: ആഖ്യാനത്തിലെ ആദ്യപ്രയോഗത്തിന് ‘അതാ’ എന്നും നേരിട്ടുള്ള പ്രസ്താവനയിലെ രണ്ടാം പ്രയോഗത്തിന് ‘ഇതാ’ എന്നും നൽകി, ശ്രദ്ധ ക്ഷണിക്കുന്ന ദൈക്തികശക്തി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: זֹאת הָרָעָה
  choice: ഈ അനർഥം
  rationale: רָעָה ഇവിടെ നിലവിലുള്ള ദുരന്തത്തെയോ വിപത്തിനെയോ സൂചിപ്പിക്കുന്നു. ‘അനർഥം’ അതിന്റെ പ്രതികൂലതയും കുറ്റാരോപണസ്വരവും നിലനിർത്തുന്നു; ധാർമിക തിന്മ മാത്രമെന്ന തെറ്റായ പരിമിതി ഒഴിവാക്കുന്നു.
- source_word: מֵאֵת יְהוָה
  choice: യഹ്‌വേയിൽനിന്നാണ്
  rationale: מֵאֵת സൂചിപ്പിക്കുന്ന ഉറവിടം/കർത്തൃത്വം വ്യക്തമായി നൽകുന്നു; ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מָה אוֹחִיל לַיהוָה עוֹד
  choice: ഇനി ഞാൻ യഹ്‌വേക്കായി കാത്തിരിക്കുന്നതെന്തിന്?
  rationale: יחל എന്ന ക്രിയയുടെ ‘കാത്തിരിക്കുക’ എന്ന അർഥവും עוֹד എന്നതിന്റെ ‘ഇനി/ഇനിയും’ എന്ന കാലസൂചനയും നൽകുന്നു. ‘പ്രത്യാശിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: എബ്രായമൂലത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ടുള്ളതിനാൽ, അതിനെ പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: יחל എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി
  choice: കാത്തിരിക്കുക
  alternative: പ്രത്യാശിക്കുക
  rationale: രാജാവിന്റെ മടുത്ത പരാതിയിൽ തുടർന്നും ദൈവിക ഇടപെടലിനായി കാത്തിരിക്കുന്നതിനെ നിരസിക്കുന്ന പ്രായോഗികഭാവം ‘കാത്തിരിക്കുക’ വ്യക്തമാക്കുന്നു. എന്നാൽ പ്രത്യാശയുടെ സൂക്ഷ്മാർഥം യഥാർത്ഥമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: רָעָהയുടെ സാഹചര്യാർഥം
  choice: അനർഥം
  alternative: തിന്മ / ദുരന്തം / വിപത്ത്
  rationale: ക്ഷാമവും നഗരത്തിന്റെ ദുരവസ്ഥയും പശ്ചാത്തലമായതിനാൽ ഇവിടെ ധാർമിക തിന്മയെക്കാൾ സംഭവിച്ച വിപത്താണ് പ്രധാനമായും ഉദ്ദേശിക്കുന്നത്; അതേസമയം പ്രസ്താവനയിലെ ദൈവത്തോടുള്ള കുറ്റാരോപണത്തിന്റെ മൂർച്ച മങ്ങാതിരിക്കാൻ ‘അനർഥം’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതാ/ഇതാ’ എന്നിവ മൂലത്തിലെ הִנֵּהയുടെ ആവർത്തനവും വാക്ചാതുര്യവും സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
