  source_fidelity: 'പ്രധാനപാഠം എബ്രായവാക്യത്തിന്റെ ക്രമവും ആശയവും നന്നായി പിന്തുടരുന്നു: തുടരുന്ന സംസാരം, ദൂതന്റെ വരവ്, യഹ്‌വേയിൽനിന്നുള്ള വിപത്ത്, ഇനി കാത്തിരിക്കില്ലെന്ന പരാതിസ്വരം എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ מָה אוֹחִיל എന്ന അപൂർണക്രിയയ്ക്ക് ‘കാത്തിരിക്കുന്നതെന്തിന്?’ എന്നതിനെക്കാൾ ‘കാത്തിരിക്കേണ്ടതെന്തിന്?’ എന്ന രൂപമാണ് കൂടുതൽ കൃത്യമായ ഭാവി/ഉദ്ദേശ്യപരമായ വാചാടോപചോദ്യം നൽകുന്നത്.'
  naturalness: ‘അവൻ അവരോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അതാ’ എന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനരീതിയാണ്. ‘ഇനി ഞാൻ യഹ്‌വേക്കായി കാത്തിരിക്കേണ്ടതെന്തിന്?’ എന്ന തിരുത്തൽ രാജാവിന്റെ അസഹിഷ്ണുതയും മൂലത്തിലെ ചോദ്യരൂപവും കൂടുതൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
