translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. മൂലപാഠത്തിലെ ‘കുതിരകൾ’, ‘രഥങ്ങൾ’ എന്നീ ദൃശ്യമായ സൈനികപദങ്ങൾ നിലനിർത്തി; חַיִל כָּבֵד എന്ന ശൈലീപ്രയോഗം വായനാസൗകര്യത്തിനായി ‘വലിയ സൈന്യം’ എന്നു നൽകി, അതിന്റെ അക്ഷരാർഥവും മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
