id: 2KI.6.14
reference: 2 Kings 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַח שָׁ֛מָּ/ה סוּסִ֥ים וְ/רֶ֖כֶב וְ/חַ֣יִל כָּבֵ֑ד וַ/יָּבֹ֣אוּ לַ֔יְלָה וַ/יַּקִּ֖פוּ עַל הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/014.yaml
  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
translation:
  language: ml
  text: അങ്ങനെ അവൻ അവിടേക്ക് കുതിരകളെയും രഥങ്ങളെയും ഒരു വലിയ സൈന്യത്തെയും[a] അയച്ചു; അവർ രാത്രിയിൽ വന്ന് പട്ടണത്തെ വളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഒരു വലിയ സൈനികസംഘത്തെ.” എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “ഭാരമേറിയ ഒരു സൈനികശക്തി” എന്നാണ്; ഗണ്യമായ ഒരു സൈനികസംഘത്തെ സൂചിപ്പിക്കുന്ന ശൈലീപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയുടെ സാധാരണ കഥനരൂപം; അരാംരാജാവിന്റെ തുടർന്നുള്ള നടപടി ലളിതമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: שָׁמָּה
  choice: അവിടേക്ക്
  rationale: മുൻവാക്യത്തിൽ സൂചിപ്പിച്ച സ്ഥലത്തേക്കുള്ള ദിശ വ്യക്തമാക്കുന്ന ക്രിയാവിശേഷണം.
- source_word: סוּסִים
  choice: കുതിരകളെ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘കുതിരകൾ’ എന്നാണ്; സൈനികസന്ദർഭം കുതിരപ്പടയെ സൂചിപ്പിക്കാമെങ്കിലും മൂലപാഠത്തിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: וְרֶכֶב
  choice: രഥങ്ങളെ
  rationale: രഥങ്ങളെയോ രഥപ്പടയെയോ സൂചിപ്പിക്കാവുന്ന പദം; ഇവിടെ വ്യക്തവും മൂലപാഠത്തോട് അടുത്തതുമായ ‘രഥങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: וְחַיִל כָּבֵד
  choice: ഒരു വലിയ സൈന്യത്തെ
  rationale: സൈനികസന്ദർഭത്തിൽ חַיִל എന്നത് സൈന്യം/സൈനികശക്തി എന്നും כָּבֵד അക്ഷരാർഥത്തിൽ ‘ഭാരമുള്ള’ എന്നാണെങ്കിലും പ്രയോഗത്തിൽ വലുതോ ഗണ്യമോ ആയ സൈനികസംഘത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבֹאוּ לַיְלָה
  choice: അവർ രാത്രിയിൽ വന്ന്
  rationale: രാത്രിയിലുള്ള അവരുടെ വരവ് സ്വാഭാവികമായ മലയാള കഥനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּקִּפוּ עַל הָעִיר
  choice: പട്ടണത്തെ വളഞ്ഞു
  rationale: സൈനികമായി ഒരു പട്ടണത്തെ ചുറ്റിവളയുക എന്ന ക്രിയയുടെ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
