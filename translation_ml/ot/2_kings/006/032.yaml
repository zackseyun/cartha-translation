base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
translation:
  language: ml
  text: 'എലീശാ തന്റെ വീട്ടിൽ ഇരിക്കുകയായിരുന്നു; മൂപ്പന്മാരും അവനോടൊപ്പം ഇരിക്കുകയായിരുന്നു. രാജാവ് തനിക്കു മുമ്പായി ഒരാളെ അയച്ചു. എന്നാൽ ദൂതൻ[b] എലീശായുടെ അടുക്കൽ എത്തുന്നതിനുമുമ്പ്, എലീശാ മൂപ്പന്മാരോടു പറഞ്ഞു: “ഈ കൊലയാളിയുടെ മകൻ എന്റെ തല നീക്കിക്കളയാൻ[a] ആളയച്ചിരിക്കുന്നത് നിങ്ങൾ കാണുന്നില്ലേ? നോക്കൂ, ദൂതൻ വരുമ്പോൾ വാതിൽ അടച്ച് അവനെ വാതിൽക്കൽ തടഞ്ഞുനിർത്തുക. അവന്റെ യജമാനന്റെ കാലടിശബ്ദം അവന്റെ പിന്നാലെ കേൾക്കുന്നില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം “എന്റെ തല നീക്കിക്കളയാൻ”; ശിരഛേദം ചെയ്ത് കൊല്ലുക എന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ “ദൂതൻ” രാജാവയച്ച മനുഷ്യനായ സന്ദേശവാഹകനെയാണ് സൂചിപ്പിക്കുന്നത്, ദൈവദൂതനെയല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  choice: ഇരിക്കുകയായിരുന്നു / ഇരിക്കുകയായിരുന്നു
  rationale: വർത്തമാനകൃദ്‌രൂപങ്ങൾ നടന്നുകൊണ്ടിരിക്കുന്ന രംഗം ചിത്രീകരിക്കുന്നതിനാൽ മലയാളത്തിലെ ഭൂതകാല തുടർച്ചാരൂപം ഉപയോഗിച്ചു.
- source_word: וַיִּשְׁלַח אִישׁ מִלְּפָנָיו
  choice: രാജാവ് തനിക്കു മുമ്പായി ഒരാളെ അയച്ചു
  rationale: മുൻസന്ദർഭത്തിൽനിന്ന് കർത്താവ് രാജാവാണെന്ന് വ്യക്തമാകുന്നു; מִלְּפָנָיו ദൂതൻ രാജാവിനു മുമ്പേ പുറപ്പെട്ടുവെന്ന സ്ഥലകാല അർഥം നൽകുന്നു.
- source_word: הַמַּלְאָךְ
  choice: ദൂതൻ
  rationale: ഇവിടെ രാജാവിന്റെ മനുഷ്യദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ‘ദൂതൻ’ ഈ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: בֶּן הַמְרַצֵּחַ הַזֶּה
  choice: ഈ കൊലയാളിയുടെ മകൻ
  rationale: രാജാവിനെ നിന്ദാപൂർവം വിശേഷിപ്പിക്കുന്ന ഹീബ്രു ഘടനയും പിതാവിന്റെ രക്തപാതകത്തിലേക്കുള്ള സൂചനയും നിലനിർത്തുന്നു.
- source_word: לְהָסִיר אֶת רֹאשִׁי
  choice: എന്റെ തല നീക്കിക്കളയാൻ
  rationale: ഹീബ്രുവിന്റെ അക്ഷരാർഥത്തോട് അടുത്തുനിൽക്കുകയും ശിരഛേദം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു; വ്യക്തമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  choice: അവനെ വാതിൽക്കൽ തടഞ്ഞുനിർത്തുക
  rationale: വാതിൽ കടന്ന് അകത്തു പ്രവേശിക്കാതിരിക്കാൻ അമർത്തി തടയുക എന്ന സന്ദർഭാർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו
  choice: അവന്റെ യജമാനന്റെ കാലടിശബ്ദം അവന്റെ പിന്നാലെ കേൾക്കുന്നില്ലേ?
  rationale: ചോദ്യത്തിന്റെ വാചാടോപസ്വഭാവവും രാജാവ് ദൂതന്റെ തൊട്ടുപിന്നാലെ വരുന്നുവെന്ന ആശയവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: וַיִּשְׁלַח എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: രാജാവ് ... അയച്ചു
  alternative: അവൻ ... അയച്ചു
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭം ഇസ്രായേൽരാജാവിനെയാണ് കർത്താവായി തിരിച്ചറിയുന്നത്; മലയാളത്തിൽ അത് വ്യക്തമാക്കുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- issue: מַלְאָךְ എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: മനുഷ്യനായ രാജദൂതൻ
  alternative: ദൈവദൂതൻ
  rationale: രാജാവിന്റെ കല്പന നടപ്പാക്കാൻ അയക്കപ്പെട്ട വ്യക്തിയാണ് സന്ദർഭത്തിലെ സൂചന; അതിനാൽ ദൈവദൂതൻ എന്ന വായന ഇവിടെ യോജിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ അടിയന്തരതയും നിന്ദാപൂർവമായ അഭിസംബോധനയും വാചാടോപചോദ്യങ്ങളും നിലനിർത്തി; അനാവശ്യമായ ആരംഭകാലസൂചകം ചേർത്തിട്ടില്ല.
