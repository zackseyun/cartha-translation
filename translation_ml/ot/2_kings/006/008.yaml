language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ אֲרָ֔ם הָיָ֥ה נִלְחָ֖ם בְּ/יִשְׂרָאֵ֑ל וַ/יִּוָּעַץ֙ אֶל עֲבָדָ֣י/ו לֵ/אמֹ֗ר אֶל מְק֛וֹם פְּלֹנִ֥י אַלְמֹנִ֖י תַּחֲנֹתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/008.yaml
  text: The king of Aram was warring against Israel, and he consulted with his servants, saying, “At such-and-such a place shall be my camp.”
translation:
  language: ml
  text: 'അരാമിലെ രാജാവ് ഇസ്രായേലിനെതിരെ യുദ്ധം ചെയ്തുകൊണ്ടിരുന്നു. അവൻ തന്റെ സേവകരുമായി ആലോചിച്ചു: “അമുകം സ്ഥലത്ത് എന്റെ പാളയം ഉണ്ടാകും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: അരാംരാജാവ്
  rationale: אֲרָם എന്ന സ്ഥലനാമം ‘സിറിയ’ എന്നു പകരാതെ ‘അരാം’ എന്നു നിലനിർത്തുന്നു. തുടക്കത്തിലെ וּ കഥയുടെ ബന്ധസൂചകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ/അപ്പോൾ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: הָיָה נִלְחָם
  choice: യുദ്ധം ചെയ്തുകൊണ്ടിരുന്നു
  rationale: היה സഹിതമുള്ള പങ്കാളിക്രിയ ഭൂതകാലത്തിലെ തുടർച്ചയായോ ആവർത്തിച്ചോ നടന്ന യുദ്ധത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ചെയ്തുകൊണ്ടിരുന്നു’ ആ ദൈർഘ്യഭാവം നിലനിർത്തുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെ
  rationale: נלחם എന്ന ക്രിയയോടൊപ്പം בְ എതിരാളിയെ സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേലിനെതിരെ’ എന്നത് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּוָּעַץ אֶל עֲבָדָיו
  choice: അവൻ തന്റെ ഭൃത്യന്മാരുമായി ആലോചിച്ച്
  rationale: വാക്യം രാജാവ് തന്റെ സേവകരുമായി കൂടിയാലോചിച്ചതായി പറയുന്നു. עֲבָדִים എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്താൻ കൂടുതൽ നിർദിഷ്ടമായ ‘ഉദ്യോഗസ്ഥർ’ എന്നതിനു പകരം ‘ഭൃത്യന്മാർ’ സ്വീകരിച്ചു.
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  choice: ഇന്നയിന്ന സ്ഥലത്ത്
  rationale: פְּלֹנִי אַלְמֹנִי പേരുപറയാത്തതോ നിർദിഷ്ടമായി വെളിപ്പെടുത്താത്തതോ ആയ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. ‘ഇന്നയിന്ന സ്ഥലം’ അതിന്റെ ഉദ്ദേശപൂർവമായ അനിർദിഷ്ടത മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תַּחֲנֹתִי
  choice: എന്റെ പാളയം
  rationale: ആദ്യപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയമുള്ള ഈ രൂപം രാജാവിന്റെ സൈനിക പാളയത്തെയോ പാളയമിടലിനെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘എന്റെ പാളയം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. യുദ്ധത്തിന്റെ തുടർച്ചാഭാവവും പേരുപറയാത്ത സ്ഥലത്തെക്കുറിച്ചുള്ള ഹീബ്രു പ്രയോഗത്തിന്റെ അനിർദിഷ്ടതയും നിലനിർത്തി.
