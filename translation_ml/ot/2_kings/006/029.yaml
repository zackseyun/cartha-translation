translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സംഭവത്തിന്റെ ഞെട്ടിക്കുന്ന നേർവിവരണം മയപ്പെടുത്താതെ അവതരിപ്പിച്ചു. ‘പുഴുങ്ങി’, ‘തിന്നു’, ‘മകൻ’ എന്നീ സാധാരണവും മാന്യമായ വിവരണശൈലിക്ക് യോജിച്ചതുമായ പദങ്ങൾ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ സാധ്യതയുള്ള അർഥവ്യത്യാസങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
