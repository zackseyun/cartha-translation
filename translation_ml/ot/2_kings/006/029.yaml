source:
  edition: WLC
  text: וַ/נְּבַשֵּׁ֥ל אֶת בְּנִ֖/י וַ/נֹּֽאכְלֵ֑/הוּ וָ/אֹמַ֨ר אֵלֶ֜י/הָ בַּ/יּ֣וֹם הָ/אַחֵ֗ר תְּנִ֤י אֶת בְּנֵ/ךְ֙ וְ/נֹ֣אכְלֶ֔/נּוּ וַ/תַּחְבִּ֖א אֶת בְּנָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
translation:
  language: ml
  text: അങ്ങനെ ഞങ്ങൾ എന്റെ മകനെ പുഴുങ്ങി തിന്നു.[a] പിറ്റേന്ന് ഞാൻ അവളോട്, ‘നിന്റെ മകനെ തരൂ; നമുക്ക് അവനെ തിന്നാം’[b] എന്നു പറഞ്ഞു. എന്നാൽ അവൾ തന്റെ മകനെ ഒളിപ്പിച്ചുവച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ മകനെ വേവിച്ചു തിന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നാം അവനെ തിന്നും.” ‘തരൂ’ എന്ന ആജ്ഞയ്ക്കു ശേഷമുള്ള ഹീബ്രുരൂപം ഇവിടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം; അതിനെ ലളിതമായ ഭാവികാലമായും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  choice: ഞങ്ങൾ ... പുഴുങ്ങി
  rationale: בשׁל ഇവിടെ ഭക്ഷണം പാകം ചെയ്യുക, പ്രത്യേകിച്ച് പുഴുങ്ങുക/വേവിക്കുക എന്ന അർഥത്തിലാണ്. സന്ദർഭത്തിന്റെ ഭീകരമായ നേർസാക്ഷ്യം നിലനിർത്താൻ ‘പുഴുങ്ങി’ തിരഞ്ഞെടുത്തു.
- source_word: בְּנִי
  choice: എന്റെ മകനെ
  rationale: בן എന്നത് ഇവിടെ പൊതുവായ ‘കുട്ടി’ എന്നതിലുപരി വ്യക്തമായി ‘മകൻ’ എന്നാണ്; ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും നിലനിർത്തുന്നു.
- source_word: וַנֹּאכְלֵהוּ
  choice: തിന്നു
  rationale: אכל എന്നതിന്റെ ലളിതമായ അർഥം ‘തിന്നുക’ എന്നാണ്. മലയാളവാക്യത്തിൽ സംയുക്ത കർത്താവും പുരുഷലിംഗ ഏകവചന കർമവും മുൻപേ വ്യക്തമായതിനാൽ സ്വാഭാവികമായി ‘തിന്നു’ എന്നു നൽകി.
- source_word: וָאֹמַר אֵלֶיהָ
  choice: ഞാൻ അവളോട് ... എന്നു പറഞ്ഞു
  rationale: സംഭവക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; സ്ത്രീലിംഗ ഏകവചന പരാമർശം ‘അവളോട്’ എന്നു സംരക്ഷിച്ചു.
- source_word: בַּיּוֹם הָאַחֵר
  choice: പിറ്റേന്ന്
  rationale: ‘അടുത്ത ദിവസം’ എന്ന അർഥം നൽകുന്ന സ്വാഭാവികവും ആധുനികവുമായ മലയാളപ്രയോഗം.
- source_word: תְּנִי
  choice: തരൂ
  rationale: נתן എന്ന ക്രിയയുടെ സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּנֵךְ
  choice: നിന്റെ മകനെ
  rationale: ‘മകൻ’ എന്ന കൃത്യമായ ബന്ധപദവും രണ്ടാംപുരുഷ സ്ത്രീലിംഗ ഏകവചന ഉടമസ്ഥതയും നിലനിർത്തുന്നു.
- source_word: וְנֹאכְלֶנּוּ
  choice: നമുക്ക് അവനെ തിന്നാം
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള രൂപം ഉദ്ദേശ്യം/നിർദേശിത ഫലം സൂചിപ്പിക്കാം. മലയാളത്തിൽ ‘നമുക്ക് ... തിന്നാം’ ആ ക്ഷണാത്മക-ഉദ്ദേശ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു; ലളിത ഭാവികാലസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וַתַּחְבִּא
  choice: എന്നാൽ അവൾ ... ഒളിപ്പിച്ചുവച്ചു
  rationale: ഹീബ്രു വാവ് അടിസ്ഥാനമായി തുടർച്ച സൂചിപ്പിച്ചാലും, ഇവിടെ മുൻകൂട്ടിയുള്ള ധാരണയ്ക്ക് വിരുദ്ധമായ പ്രവൃത്തി വ്യക്തമാണ്; ‘എന്നാൽ’ സന്ദർഭത്തിലെ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: בְּנָהּ
  choice: തന്റെ മകനെ
  rationale: בן എന്നത് ‘മകൻ’ എന്നാണ്. ഒരേ വാക്യത്തിലെ കർത്താവിലേക്കുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു.
