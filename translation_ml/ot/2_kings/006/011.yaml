  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. രാജസദസ്സിന്റെ സന്ദർഭം വ്യക്തമാക്കാൻ ‘സേവകർ’ ഉപയോഗിച്ചു; മൂലത്തിലെ ഹൃദയരൂപകവും ചോദ്യംരൂപവും നിലനിർത്തി.
