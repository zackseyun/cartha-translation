  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסָּעֵר֙ לֵ֣ב מֶֽלֶךְ אֲרָ֔ם עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יִּקְרָ֤א אֶל עֲבָדָי/ו֙ וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם הֲ/לוֹא֙ תַּגִּ֣ידוּ לִ֔/י מִ֥י מִ/שֶּׁ/לָּ֖/נוּ אֶל מֶ֥לֶךְ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
translation:
  language: ml
  text: 'ഈ കാര്യത്തെച്ചൊല്ലി അരാം രാജാവിന്റെ ഹൃദയം അത്യന്തം കലങ്ങി. അവൻ തന്റെ സേവകരെ വിളിച്ച് അവരോടു ചോദിച്ചു: “നമ്മുടെ ഇടയിൽ ആരാണ് ഇസ്രായേൽരാജാവിന്റെ പക്ഷത്തുള്ളതെന്ന് നിങ്ങൾ എന്നോടു പറയുകയില്ലേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסָּעֵר
  choice: അത്യന്തം അസ്വസ്ഥമായി
  rationale: ഈ ക്രിയ ശക്തമായ ആന്തരിക കലക്കത്തെയോ പ്രക്ഷുബ്ധതയെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ കോപം ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും അതിൽ മാത്രം അർഥം ചുരുക്കാതെ രാജാവിന്റെ കടുത്ത മനോവ്യാകുലത സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לֵב
  choice: ഹൃദയം
  rationale: എബ്രായപ്രയോഗത്തിൽ വികാരവും ചിന്തയും ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലും ഈ രൂപകം സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം നിമിത്തം
  rationale: דָּבָר ഇവിടെ ഒരു സംഭവസ്ഥിതിയെയോ വിഷയത്തെയോ സൂചിപ്പിക്കുന്നു; ‘കാര്യം’ സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്.
- source_word: עֲבָדָיו
  choice: തന്റെ സേവകരെ
  rationale: രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിൽ രാജാവിനെ സേവിക്കുന്ന ഉദ്യോഗസ്ഥരെയോ പരിചാരകരെയോ ഈ പദം സൂചിപ്പിക്കാം. ‘സേവകർ’ മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: הֲלוֹא תַּגִּידוּ לִי
  choice: നിങ്ങൾ എന്നോടു പറയുകയില്ലേ?
  rationale: നിഷേധത്തോടുകൂടിയ ചോദ്യം അടിയന്തരമായ ആവശ്യവും ശാസനാഭാവവും പ്രകടിപ്പിക്കുന്നു; അതിന്റെ ചോദ്യംരൂപം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִי מִשֶּׁלָּנוּ
  choice: നമ്മുടെ ഇടയിൽ ആരാണ്
  rationale: അരാമ്യപാളയത്തിനുള്ളിലെ ഒരാളെ സംശയിക്കുന്നതാണെന്ന ആശയം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവിന്റെ പക്ഷത്തുള്ളത്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേൽരാജാവിങ്കലേക്ക്/ഇസ്രായേൽരാജാവിനോട്’ എന്ന ചുരുക്കപ്രയോഗമാണിത്. സന്ദർഭത്തിൽ വിശ്വസ്തതയോ രഹസ്യസഹകരണമോ സംശയിക്കുന്നതായി ‘പക്ഷത്തുള്ളത്’ വ്യക്തമാക്കുന്നു; അർഥത്തിലെ ചുരുക്കം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
