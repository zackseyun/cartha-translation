  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: ml
  text: 'രാജാവ് അവളോട്, “നിനക്ക് എന്താണ് പ്രശ്നം?” എന്നു ചോദിച്ചു. അവൾ പറഞ്ഞു: “ഈ സ്ത്രീ എന്നോട്, ‘നിന്റെ മകനെ തരൂ; നമുക്ക് ഇന്ന് അവനെ തിന്നാം. നാളെ എന്റെ മകനെ തിന്നാം’ എന്നു പറഞ്ഞു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לָּךְ
  choice: നിനക്ക് എന്താണ് പ്രശ്നം?
  rationale: അക്ഷരാർഥത്തിൽ ‘നിനക്ക് എന്ത്?’ എന്ന ഹീബ്രായ പ്രയോഗം സന്ദർഭത്തിൽ പരാതിയുടെ കാരണമോ പ്രശ്നമോ ചോദിക്കുന്നതാണ്; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അതേ അർഥം നൽകുന്നു.
- source_word: תְּנִי אֶת־בְּנֵךְ
  choice: നിന്റെ മകനെ തരൂ
  rationale: ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ളതും ഞെട്ടിപ്പിക്കുന്നതുമായ സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: וְנֹאכְלֶנּוּ
  choice: നമുക്ക് ... അവനെ തിന്നാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന cohortative അർഥവും പുരുഷ ഏകവചന പ്രത്യയവും വ്യക്തമായി പകർത്തുന്നു.
- source_word: וְאֶת־בְּנִי נֹאכַל מָחָר
  choice: നാളെ എന്റെ മകനെ തിന്നാം
  rationale: മൂലത്തിലെ സമയവ്യത്യാസവും സമാന്തര ഘടനയും ലളിതമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
