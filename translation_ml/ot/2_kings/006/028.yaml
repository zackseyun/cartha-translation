  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഉപരോധകാലത്തെ ഭീകരത മൃദൂകരിക്കാതെ മൂലവാക്യത്തിന്റെ നേരിട്ടുള്ള ഭാഷ നിലനിർത്തിയിരിക്കുന്നു.
