id: 2KI.6.22
reference: 2 Kings 6:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לֹ֣א תַכֶּ֔ה הַ/אֲשֶׁ֥ר שָׁבִ֛יתָ בְּ/חַרְבְּ/ךָ֥ וּֽ/בְ/קַשְׁתְּ/ךָ֖ אַתָּ֣ה מַכֶּ֑ה שִׂים֩ לֶ֨חֶם וָ/מַ֜יִם לִ/פְנֵי/הֶ֗ם וְ/יֹֽאכְלוּ֙ וְ/יִשְׁתּ֔וּ וְ/יֵלְכ֖וּ אֶל אֲדֹנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു: “അവരെ വധിക്കരുത്. നിന്റെ വാളും വില്ലുംകൊണ്ട് നീ തടവിലാക്കിയവരെ നീ വധിക്കുമോ?[a] അവരുടെ മുമ്പിൽ അപ്പവും വെള്ളവും വെക്കുക[b], അവർ തിന്നുകയും കുടിക്കുകയും തങ്ങളുടെ യജമാനന്മാരുടെ അടുക്കലേക്കു പോകുകയും ചെയ്യട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായവാക്യം ഒരു അലങ്കാരചോദ്യമാണ്; അവരെ കൊല്ലരുതെന്ന കല്പനയ്ക്ക് ഇത് ഊന്നൽ നൽകുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘അപ്പവും വെള്ളവും’ എന്നത് അടിസ്ഥാന ഭക്ഷണസാധനങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം; എന്നാൽ എബ്രായത്തിൽ ഇവ രണ്ടും വ്യക്തമായി പേരെടുത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכֶּה / מַכֶּה
  choice: വധിക്കരുത് / വധിക്കുമോ
  rationale: נכה എന്ന ക്രിയയ്ക്ക് അടിക്കുക, പ്രഹരിക്കുക, കൊല്ലുക എന്നീ അർഥങ്ങൾ സന്ദർഭാനുസരണം വരാം. ഇവിടെ തടവുകാരെ കൊല്ലുന്നതാണ് രാജാവ് ഉദ്ദേശിക്കുന്നതെന്നതിനാൽ ‘വധിക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവും ആണ്; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പദം നിലനിർത്തി എബ്രായത്തിലെ ആവർത്തനം സംരക്ഷിക്കുന്നു.
- source_word: הַאֲשֶׁר שָׁבִיתָ
  choice: നീ പിടിച്ചെടുത്തവരെ
  rationale: שבה യുദ്ധസന്ദർഭത്തിൽ തടവിലാക്കുകയോ പിടിച്ചെടുക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പിടിച്ചെടുത്തവർ’ സൈനികസന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  choice: നിന്റെ വാളും വില്ലുംകൊണ്ട്
  rationale: രാജാവിന്റെ സ്വന്തം സൈനികവിജയത്തിലൂടെ ഇവരെ പിടിച്ചതല്ലെന്ന ചോദ്യത്തിന്റെ ന്യായം വ്യക്തമാകുന്നതിനാൽ രണ്ടു ആയുധങ്ങളും ഉറവിടത്തിലെപ്പോലെ നിലനിർത്തുന്നു.
- source_word: שִׂים
  choice: വെക്കുക
  rationale: നേരിട്ടുള്ള കല്പനയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לֶחֶם וָמַיִם
  choice: അപ്പവും വെള്ളവും
  rationale: לֶחֶם ചിലപ്പോൾ ഭക്ഷണത്തെ പൊതുവായി സൂചിപ്പിക്കാമെങ്കിലും, എബ്രായം അപ്പവും വെള്ളവും വ്യക്തമായി പേരെടുക്കുന്നതിനാൽ ആ മൂർത്തമായ പദങ്ങൾ നിലനിർത്തുന്നു.
- source_word: לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പിൽ
  rationale: ഭക്ഷണം ഒരാളുടെ മുമ്പിൽ വെക്കുക എന്ന ഉറവിടഭാഷയിലെ സാധാരണ പ്രയോഗത്തിന് മലയാളത്തിലും സ്വാഭാവികമായ തുല്യപ്രയോഗമാണിത്.
- source_word: וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ
  choice: അവർ തിന്നുകയും കുടിക്കുകയും ചെയ്തശേഷം ... പോകട്ടെ
  rationale: കല്പനയുടെ ഉദ്ദേശ്യവും സംഭവക്രമവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഭക്ഷിച്ചും കുടിച്ചും കഴിഞ്ഞ് അവരെ മടങ്ങിപ്പോകാൻ അനുവദിക്കണമെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: തങ്ങളുടെ യജമാനന്റെ അടുക്കലേക്ക്
  rationale: אֲדֹנֵיהֶם രൂപപരമായി ബഹുവചനസ്വഭാവമുള്ളതായിരുന്നാലും ഈ സന്ദർഭത്തിൽ അരാം സൈനികരുടെ മേലധികാരിയായ രാജാവിനെ ഏകവചനത്തിൽ സൂചിപ്പിക്കാം. ‘യജമാനൻ’ അധികാരബന്ധം നിലനിർത്തുകയും അനാവശ്യമായി ‘സേനാനായകൻ’ എന്ന് പ്രത്യേകീകരിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: എലീശയുടെ ചോദ്യത്തിന്റെ പ്രാബല്യം
  choice: 'ചോദ്യം അലങ്കാരചോദ്യമായി വിവർത്തനം ചെയ്തു: സ്വന്തം വാളും വില്ലുംകൊണ്ട് പിടിച്ച തടവുകാരെയെന്നപോലും സാധാരണയായി വധിക്കില്ല; അതിനാൽ അത്ഭുതകരമായി തന്റെ കയ്യിലെത്തിയ ഇവരെ രാജാവ് വധിക്കരുത്.'
  alternative: ചോദ്യമല്ലാത്ത ഒരു പ്രസ്താവനയായി വായിക്കുക, അല്ലെങ്കിൽ സ്വന്തം യുദ്ധത്തിൽ പിടിച്ചവരെക്കുറിച്ചുള്ള പരിമിതമായ നിയമമായി മാത്രം മനസ്സിലാക്കുക.
  rationale: ഹീബ്രു വാക്യഘടന നിരോധനത്തിനു പിന്നാലെയുള്ള അലങ്കാരചോദ്യത്തെ സ്വാഭാവികമായി പിന്തുണയ്ക്കുന്നു. ഇത് കഥയിലെ ന്യായം സംരക്ഷിക്കുമ്പോൾ ഈ വാക്യത്തിനപ്പുറമുള്ള ഒരു പൊതുനിയമം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: אֲדֹנֵיהֶם എന്നതിന്റെ സംഖ്യ
  choice: സന്ദർഭത്തിലെ അരാംരാജാവിനെ സൂചിപ്പിക്കുന്നതായി ‘തങ്ങളുടെ യജമാനൻ’ എന്ന ഏകവചനം ഉപയോഗിച്ചു.
  alternative: ‘തങ്ങളുടെ യജമാനന്മാർ’ അല്ലെങ്കിൽ ‘മേലധികാരികൾ’.
  rationale: ഹീബ്രുരൂപം ‘അവരുടെ പ്രഭു/പ്രഭുക്കന്മാർ’ എന്ന സംഖ്യാഭേദം അനുവദിക്കാം. സമീപകഥാസന്ദർഭത്തിൽ സൈനികരെ അയച്ച അരാംരാജാവാണ് ഏറ്റവും സ്വാഭാവികമായ ഏകവചന സൂചന; എങ്കിലും രൂപപരമായ സാധ്യത കുറിപ്പുകളില്ലാതെ പൂർണമായി ഇല്ലാതാക്കാതിരിക്കാൻ തീരുമാനം രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘വധിക്കുക’ എന്ന പദം സന്ദർഭത്തിലെ മരണകരമായ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; ‘അപ്പവും വെള്ളവും’ ഉറവിടത്തിലെ മൂർത്തഭാഷ നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
