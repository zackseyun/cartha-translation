base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
translation:
  language: ml
  text: 'അപ്പോൾ എലീശാ പ്രാർഥിച്ചു: “യഹ്‌വേ[b], അവൻ കാണേണ്ടതിന് അവന്റെ കണ്ണുകൾ ദയവായി തുറക്കണമേ.” അപ്പോൾ യഹ്‌വേ ആ യുവാവിന്റെ[a] കണ്ണുകൾ തുറന്നു. അവൻ കണ്ടു; അതാ, എലീശായെ ചുറ്റി മല കുതിരകളാലും അഗ്നിരഥങ്ങളാലും നിറഞ്ഞിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യുവാവ്” എന്നതിനു പകരം “പരിചാരകൻ” എന്നും വിവർത്തനം ചെയ്യാം; ഹീബ്രു നഅർ എന്ന പദം സന്ദർഭമനുസരിച്ച് ഒരു യുവാവിനെയോ പരിചാരകനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രു പാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ YHWH ആണ്; പരമ്പരാഗതമായി ഇത് “കർത്താവ്” എന്നു നൽകാറുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: പ്രാർഥിച്ചു
  rationale: פלל എന്ന ധാതുവിന്റെ ഹിത്പഅേൽ രൂപം ഇവിടെ ദൈവത്തോടുള്ള പ്രാർഥനയെ സൂചിപ്പിക്കുന്നു; ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ יהוהയെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: פְּקַח נָא
  choice: ദയവായി ... തുറക്കണമേ
  rationale: פקח എന്നത് കണ്ണുകൾ ‘തുറക്കുക’ എന്നും נא ഇവിടെ സമയസൂചനയേക്കാൾ വിനീതമായ അപേക്ഷയെന്നും ഗ്രഹിച്ച് സ്വാഭാവിക മലയാള പ്രാർഥനാശൈലിയിൽ നൽകി.
- source_word: וְיִרְאֶה
  choice: ഇവൻ കാണട്ടെ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ഉദ്ദേശ്യം/ഫലം നിലനിർത്തുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ രൂപം.
- source_word: הַנַּעַר
  choice: ആ യുവാവ്
  rationale: נער എന്ന പദത്തിന് യുവാവ്, ബാലൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ഈ വാക്യത്തിൽ സാമൂഹികപദവി നിർബന്ധമായി ചേർക്കാതെ അടിസ്ഥാന lexical അർഥം നിലനിർത്തി.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: കാഴ്ചയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുകയും അതിശയം പ്രകടമാക്കുകയും ചെയ്യുന്ന הנהയുടെ ആഖ്യാനപ്രഭാവം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הָהָר מָלֵא
  choice: മലയിൽ ... നിറയെ ... ഉണ്ടായിരുന്നു
  rationale: ‘മല നിറഞ്ഞിരുന്നു’ എന്ന ഹീബ്രു പ്രസ്താവനയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായ അസ്തിത്വഘടനയിലൂടെ അറിയിച്ചു.
- source_word: סוּסִים וְרֶכֶב אֵשׁ
  choice: കുതിരകളും അഗ്നിരഥങ്ങളും
  rationale: ‘അഗ്നി’ എന്ന നിർദേശം വ്യാകരണപരമായി രഥത്തോടു ചേർന്നിരിക്കുന്നതു നിലനിർത്തി; കുതിരകളും അഗ്നിമയമാണെന്ന് വിവർത്തനത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
- source_word: סְבִיבֹת אֱלִישָׁע
  choice: എലീശായുടെ ചുറ്റും
  rationale: എലീശായെ സമഗ്രമായി ചുറ്റിയുള്ള സംരക്ഷകസാന്നിധ്യം നേരിട്ട് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലുള്ള വ്യക്തിനാമം സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്തു; പരമ്പരാഗത പ്രതിസ്ഥാപനം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: കാഴ്ചയുടെ സ്വഭാവം
  choice: ദൈവം കാഴ്ച പ്രാപ്തമാക്കിയപ്പോൾ യുവാവ് കണ്ടതായി മാത്രം പ്രസ്താവിക്കുന്നു
  alternative: അക്ഷരാർഥത്തിലുള്ള ദൂതസൈന്യം; അല്ലെങ്കിൽ പൂർണമായും പ്രതീകാത്മകമായ ദർശനം
  rationale: കുതിരകളും അഗ്നിരഥങ്ങളും യാഥാർഥ്യത്തിൽ എങ്ങനെയുള്ളവയായിരുന്നു എന്ന് ഹീബ്രു പാഠം നിർവചിക്കുന്നില്ല. അതിനാൽ അവയുടെ സത്തയെക്കുറിച്ചുള്ള വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. പ്രാർഥനയിൽ ‘തുറക്കണമേ’ എന്ന ആദരസൂചക രൂപവും ദൃശ്യവിവരണത്തിൽ ‘അതാ’ എന്ന ശ്രദ്ധാകർഷകവും ഉപയോഗിച്ചു. സാങ്കേതികമോ സഭാവിഭാഗസവിശേഷമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
