  text: അങ്ങനെ അവൻ അവരോടൊപ്പം പോയി. അവർ യോർദാനിലെത്തി മരങ്ങൾ[a] മുറിച്ചുവീഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവർ തടി മുറിച്ചു.” എബ്രായ നാമപദത്തിന് മരങ്ങളെയോ തടിയെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ വെട്ടിവീഴ്ത്തുന്ന മരങ്ങൾ എന്നാണ് കൂടുതൽ സാധ്യത.
