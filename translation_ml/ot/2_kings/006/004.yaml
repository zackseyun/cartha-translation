lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അങ്ങനെ അവൻ … പോയി
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ അഭ്യർഥനയോടുള്ള പ്രതികരണവും തുടർച്ചയും ‘അങ്ങനെ’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אִתָּם
  choice: അവരോടൊപ്പം
  rationale: മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയത്തോടുകൂടിയ അനുഗമനാർഥക പദത്തിന്റെ നേരായ മലയാളരൂപം.
- source_word: וַיָּבֹאוּ
  choice: അവർ … എത്തി
  rationale: בוא എന്ന ക്രിയ ഇവിടെ ലക്ഷ്യസ്ഥാനത്തെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാള ആഖ്യാനത്തിൽ ‘എത്തി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַיַּרְדֵּנָה
  choice: യോർദാനിലേക്ക്
  rationale: ദിശാസൂചകമായ ה യോർദാനിലേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു. ‘യോർദാൻ നദി’ എന്ന് വിപുലീകരിക്കാതെ എബ്രായരൂപത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: וַיִּגְזְרוּ
  choice: മുറിച്ചുവീഴ്ത്തി
  rationale: ഈ സന്ദർഭത്തിൽ തടി ശേഖരിക്കാനായി നിൽക്കുന്ന മരങ്ങൾ വെട്ടിവീഴ്ത്തുന്നതാണ് ഉദ്ദേശ്യം; ‘മുറിച്ചു’ എന്നതിനെക്കാൾ ‘മുറിച്ചുവീഴ്ത്തി’ സന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: הָעֵצִים
  choice: മരങ്ങൾ
  rationale: עֵץ എന്ന പദത്തിന് ‘മരങ്ങൾ’ എന്നും ‘മരം/തടി’ എന്നും അർഥമാകാം. ഇവിടെ വെട്ടിവീഴ്ത്തുന്ന പ്രവൃത്തിയുടെ സന്ദർഭത്തിൽ നിൽക്കുന്ന മരങ്ങൾ എന്ന അർഥമാണ് കൂടുതൽ യോജിച്ചത്; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
