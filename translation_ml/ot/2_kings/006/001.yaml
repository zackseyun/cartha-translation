source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ בְנֵֽי הַ/נְּבִיאִ֖ים אֶל אֱלִישָׁ֑ע הִנֵּֽה נָ֣א הַ/מָּק֗וֹם אֲשֶׁ֨ר אֲנַ֜חְנוּ יֹשְׁבִ֥ים שָׁ֛ם לְ/פָנֶ֖י/ךָ צַ֥ר מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: The sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
translation:
  language: ml
  text: 'പ്രവാചകശിഷ്യന്മാർ[a] എലീശയോടു പറഞ്ഞു: “ദയവായി നോക്കൂ, അങ്ങയുടെ സന്നിധിയിൽ[b] ഞങ്ങൾ പാർക്കുന്ന സ്ഥലം ഞങ്ങൾക്കു പോരാത്തത്ര ഇടുങ്ങിയതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “പ്രവാചകന്മാരുടെ പുത്രന്മാർ”; പ്രവാചകസമൂഹത്തിലെ ശിഷ്യന്മാരെയോ അംഗങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: “അങ്ങയുടെ സന്നിധിയിൽ” എന്നത് “അങ്ങയുടെ മുമ്പിൽ” എന്നോ “അങ്ങയുടെ മേൽനോട്ടത്തിൽ” എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: പ്രവാചകശിഷ്യന്മാർ
  rationale: ‘പ്രവാചകന്മാരുടെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ ജൈവപുത്രന്മാരെന്ന തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാം. സന്ദർഭത്തിൽ പ്രവാചകസമൂഹത്തിലെ ശിഷ്യരെയോ അംഗങ്ങളെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്; പര്യായം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הִנֵּה נָא
  choice: ദയവായി നോക്കൂ
  rationale: הִנֵּה ശ്രദ്ധ ക്ഷണിക്കുകയും נָא അഭ്യർഥനയെ മൃദുവാക്കുകയും ചെയ്യുന്നു; ഈ രണ്ടു ഭാവങ്ങളും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַמָּקוֹם
  choice: സ്ഥലം
  rationale: കെട്ടിടത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർണ്ണയിക്കാതെ മൂലത്തിലെ പൊതുവായ നാമം നിലനിർത്തുന്നു.
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  choice: അങ്ങയുടെ സന്നിധിയിൽ ഞങ്ങൾ പാർക്കുന്ന
  rationale: יֹשְׁבִים എന്നതിന് ഇവിടെ താമസിക്കുക/പാർക്കുക എന്ന അർഥമാണ് യോജിച്ചത്. שָׁם മലയാളവാക്യത്തിൽ പ്രത്യേകം ‘അവിടെ’ എന്നു ചേർത്താൽ അനാവശ്യ ആവർത്തനമാകുന്നതിനാൽ ബന്ധവാക്യത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു. לְפָנֶיךָ-യുടെ സാന്നിധ്യമോ മേൽനോട്ടമോ ഉൾപ്പെടാവുന്ന അർഥം ‘അങ്ങയുടെ സന്നിധിയിൽ’ സംരക്ഷിക്കുന്നു.
- source_word: צַר מִמֶּנּוּ
  choice: ഞങ്ങൾക്കു വളരെ ഇടുങ്ങിയതാണ്
  rationale: צַר-ന്റെ സ്ഥലപരമായ ‘ഇടുങ്ങിയ’ എന്ന അർഥം നിലനിർത്തി, താരതമ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി അപര്യാപ്തമായ ഇടം എന്ന നിലയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיֹּאמְרוּ
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ ആഖ്യാനഗതി മലയാളത്തിൽ വാക്യക്രമംകൊണ്ട് വ്യക്തമാകുന്നതിനാൽ മൂലത്തിൽ സ്വതന്ത്രമായ കാലസൂചകപദമില്ലാത്ത ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: לְפָנֶיךָ എന്നതിലെ ബന്ധത്തിന്റെ സ്വഭാവം
  choice: അങ്ങയുടെ സന്നിധിയിൽ
  alternative: അങ്ങയുടെ മേൽനോട്ടത്തിൽ / അങ്ങയുടെ മുമ്പിൽ
  rationale: ഈ പ്രയോഗം ശാരീരിക സാന്നിധ്യത്തെയോ എലീശയുടെ മേൽനോട്ടത്തിലുള്ള സമൂഹജീവിതത്തെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠം ഈ രണ്ടിലും ഒന്നിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല; അടിക്കുറിപ്പ് സാധ്യത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എലീശയോടുള്ള ആദരസൂചകമായി ‘അങ്ങ്’ ഉപയോഗിച്ചു. പ്രധാനപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കിനോ വാക്യത്തിനോ ചേർത്തിരിക്കുന്നു.
