translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. הִנֵּהയുടെ ശ്രദ്ധാകർഷണബലം ‘അതാ’ എന്നതിലൂടെ സംരക്ഷിച്ചു; מִבָּיִת എന്നതിലെ സംക്ഷിപ്തതയും ചെറിയ അസ്പഷ്ടതയും മുഖ്യപാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ സന്ദർഭാർഥം വിശദീകരിച്ചു.
