source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דִּבְרֵ֤י הָֽ/אִשָּׁה֙ וַ/יִּקְרַ֣ע אֶת בְּגָדָ֔י/ו וְ/ה֖וּא עֹבֵ֣ר עַל הַ/חֹמָ֑ה וַ/יַּ֣רְא הָ/עָ֔ם וְ/הִנֵּ֥ה הַ/שַּׂ֛ק עַל בְּשָׂר֖/וֹ מִ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/030.yaml
  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
translation:
  language: ml
  text: രാജാവ് ആ സ്ത്രീയുടെ വാക്കുകൾ കേട്ടപ്പോൾ, മതിലിന്മേലൂടെ നടന്നുപോകുന്നതിനിടെ തന്റെ വസ്ത്രങ്ങൾ കീറി. അപ്പോൾ ജനം കണ്ടു; അതാ, അവന്റെ ശരീരത്തിൽ, പുറംവസ്ത്രങ്ങൾക്കടിയിൽ, ചാക്കുതുണി ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അകത്തുനിന്ന്’ അഥവാ ‘ഉള്ളിൽനിന്ന്’ എന്നാണ്; ചാക്കുതുണി പുറംവസ്ത്രങ്ങൾക്കടിയിൽ ധരിച്ചിരുന്നതാണ് സന്ദർഭാർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: כ സഹിതമുള്ള infinitive construct കാലസൂചക ഉപവാക്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കേട്ടപ്പോൾ’ സ്വാഭാവികമായി സംഭവക്രമം നിലനിർത്തുന്നു.
- source_word: דִּבְרֵי הָאִשָּׁה
  choice: ആ സ്ത്രീയുടെ വാക്കുകൾ
  rationale: ഇവിടെ דְּבָרִים സ്ത്രീ പറഞ്ഞ കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വാക്കുകൾ’ നേരിട്ടും സന്ദർഭോചിതവുമാണ്.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ കീറി
  rationale: ദുഃഖമോ ഞെട്ടലോ പ്രകടിപ്പിക്കുന്ന പ്രവൃത്തിയെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהוּא עֹבֵר עַל־הַחֹמָה
  choice: മതിലിന്മേലൂടെ നടന്നുപോകുന്നതിനിടെ
  rationale: ഈ circumstantial clause രാജാവ് നഗരമതിലിന്റെ മുകളിലൂടെ നീങ്ങിക്കൊണ്ടിരുന്ന സമയത്താണ് വസ്ത്രം കീറിയതെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּרְא הָעָם וְהִנֵּה
  choice: അപ്പോൾ ജനം നോക്കി; അതാ
  rationale: ראה എന്ന കാണൽപ്രവൃത്തിയും הִנֵּה നൽകുന്ന പെട്ടെന്നുള്ള ശ്രദ്ധാകർഷണവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַשַּׂק
  choice: ചാക്കുതുണി
  rationale: വിലാപത്തിന്റെ അടയാളമായി ധരിച്ചിരുന്ന പരുക്കൻ തുണിയെയോ അതുകൊണ്ടുള്ള വസ്ത്രത്തെയോ സൂചിപ്പിക്കുന്ന പരിചിതമായ ബൈബിൾപ്രയോഗം.
- source_word: עַל־בְּשָׂרוֹ
  choice: അയാളുടെ ശരീരത്തിന്മേൽ
  rationale: בשר എന്നതിന്റെ ശരീരസംബന്ധമായ അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘മാംസത്തിന്മേൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: מִבָּיִת
  choice: ഉള്ളിൽ
  rationale: അക്ഷരാർഥം ‘അകത്ത്/ഉള്ളിൽ’ എന്നാണ്; പുറംവസ്ത്രത്തിനടിയിൽ ചാക്കുതുണി ധരിച്ചിരുന്നുവെന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു, മുഖ്യപാഠത്തിൽ മൂലഭാഷയുടെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
