  text: וַ/יֹּ֕אמֶר כֹּֽה יַעֲשֶׂה לִּ֥/י אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑ף אִֽם יַעֲמֹ֞ד רֹ֣אשׁ אֱלִישָׁ֧ע בֶּן שָׁפָ֛ט עָלָ֖י/ו הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/031.yaml
  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ശാഫാത്തിന്റെ മകനായ എലീശയുടെ തല ഇന്ന് അവന്റെമേൽ ഇരിക്കുന്നുവെങ്കിൽ[a], ദൈവം എന്നോട് ഇതും ഇതിലധികവും ചെയ്യട്ടെ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ശാഫാത്തിന്റെ മകനായ എലീശയുടെ തല ഇന്ന് അവന്റെമേൽ നിൽക്കുന്നുവെങ്കിൽ’—അതായത്, ഇന്ന് എലീശയുടെ തല അവന്റെ ശരീരത്തിൽത്തന്നെ ഇരിക്കുന്നുവെങ്കിൽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִף
  choice: ദൈവം എന്നോട് ഇതും ഇതിലധികവും ചെയ്യട്ടെ
  rationale: ഇത് സ്വയം ശാപം വിളിച്ചുവരുത്തുന്ന സ്ഥിരമായ എബ്രായ ശപഥസൂത്രമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ അതിന്റെ ഗൗരവവും ശാപാർഥവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ഇവിടെ ഏകവചനത്തിലുള്ള ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ശപഥസൂത്രത്തിന്റെ സന്ദർഭവും അതുതന്നെയാണ് കാണിക്കുന്നത്.
- source_word: אִם
  choice: എങ്കിൽ
  rationale: ശപഥവാക്യത്തിൽ ഇത് പരോക്ഷമായ നിഷേധാർഥം വഹിക്കാമെങ്കിലും, എബ്രായത്തിലെ വ്യവസ്ഥാരൂപവും ഭീഷണിയുടെ സൂചനയും നിലനിർത്താൻ ‘എങ്കിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יַעֲמֹד
  choice: ശേഷിക്കുന്നുവെങ്കിൽ
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘നിൽക്കുക’ എന്നാണെങ്കിലും, തല ശരീരത്തിൽ തുടരുന്നതിനെ സൂചിപ്പിക്കുന്ന ഈ ഭീഷണിയിൽ ‘ശേഷിക്കുക’ എന്നത് മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: רֹאשׁ אֱלִישָׁע
  choice: എലീശയുടെ തല
  rationale: എബ്രായ ഘടനയുടെ നേരിട്ടുള്ള അർഥവും വധഭീഷണിയുടെ തീക്ഷ്ണതയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עָלָיו
  choice: അവന്റെമേൽ
  rationale: സർവനാമം സ്വാഭാവികമായി എലീശയെ തന്നെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശരീരത്തിന്മേൽ’ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തവും ദൃശ്യവുമായ പ്രയോഗം സംരക്ഷിച്ചു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: ശപഥത്തിന്റെ അടിയന്തരത വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ശപഥസൂത്രത്തിന്റെ ലക്ഷ്യവും ശക്തിയും
  choice: എലീശ അന്നുതന്നെ വധിക്കപ്പെടാത്തപക്ഷം തനിക്കു ദൈവശിക്ഷ വരട്ടെയെന്ന് പ്രസംഗകൻ സ്വയം ശാപം വിളിച്ചുവരുത്തുന്ന ഔപചാരിക ശപഥം ചെയ്യുന്നു.
  alternative: പൂർണമായ ശപഥബലമില്ലാത്ത ഒരു കോപപ്രകടനം.
  rationale: ‘ദൈവം എന്നോട് ഇതും ഇതിലധികവും ചെയ്യട്ടെ’ എന്ന സൂത്രം എബ്രായ ബൈബിളിലെ പതിവായ രാജകീയ ശപഥപ്രയോഗമാണ്; അതിനെ വെറും കോപവാക്കായി മൃദൂകരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ശപഥത്തിന്റെ ഔപചാരികതയും വധഭീഷണിയുടെ തീക്ഷ്ണതയും മൂലത്തിലെ ‘അവന്റെമേൽ’ എന്ന സംക്ഷിപ്ത പ്രയോഗവും നിലനിർത്തി; അതിന്റെ ഉദ്ദേശാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
