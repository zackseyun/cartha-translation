id: 2KI.6.15
reference: 2 Kings 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ֠/יַּשְׁכֵּם מְשָׁרֵ֨ת אִ֥ישׁ הָֽ/אֱלֹהִים֮ לָ/קוּם֒ וַ/יֵּצֵ֕א וְ/הִנֵּה חַ֛יִל סוֹבֵ֥ב אֶת הָ/עִ֖יר וְ/ס֣וּס וָ/רָ֑כֶב וַ/יֹּ֨אמֶר נַעֲר֥/וֹ אֵלָ֛י/ו אֲהָ֥הּ אֲדֹנִ֖/י אֵיכָ֥ה נַֽעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
translation:
  language: ml
  text: ദൈവപുരുഷന്റെ ശുശ്രൂഷകൻ അതിരാവിലെ എഴുന്നേറ്റ് പുറത്തേക്കു ചെന്നപ്പോൾ, ഇതാ, കുതിരകളും രഥങ്ങളുമുള്ള ഒരു സൈന്യം നഗരത്തെ വളഞ്ഞുനിൽക്കുന്നു. അവന്റെ ഭൃത്യൻ അവനോട്, “അയ്യോ, യജമാനനേ! നാം എന്തു ചെയ്യും?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... לָקוּם
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: ശׁכם എന്ന ക്രിയാരൂപത്തിലെ നേരത്തെയുള്ള സമയസൂചനയും קום എന്നതിലെ എഴുന്നേൽക്കൽ അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു.
- source_word: מְשָׁרֵת
  choice: ശുശ്രൂഷകൻ
  rationale: വ്യക്തിപരമായോ ഔദ്യോഗികമായോ സേവിക്കുന്നയാളെ സൂചിപ്പിക്കുന്ന പദം; പ്രവാചകന്റെ സഹായിയായി സേവിക്കുന്ന വ്യക്തിക്ക് മാന്യവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: എബ്രായ ബൈബിളിലെ സ്ഥിരമായ പ്രവാചകപദവി; അതിന്റെ അന്തർപാഠബന്ധം നിലനിർത്തുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: וַיֵּצֵא
  choice: പുറത്തേക്കു ചെന്നപ്പോൾ
  rationale: അകത്തുനിന്ന് പുറത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുകയും തുടർന്നുള്ള അപ്രതീക്ഷിത കാഴ്ചയുമായി വാക്യം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പെട്ടെന്നുള്ള ദർശനവും ആശ്ചര്യവും സൂചിപ്പിക്കുന്ന എബ്രായ വ്യവഹാരചിഹ്നത്തിന്റെ സജീവത നിലനിർത്തുന്നു.
- source_word: חַיִל
  choice: ഒരു സൈന്യം
  rationale: ഇവിടത്തെ സൈനികസന്ദർഭത്തിൽ ആയുധസജ്ജമായ സേനയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: סוֹבֵב
  choice: വളഞ്ഞുനിൽക്കുന്നു
  rationale: ശുശ്രൂഷകൻ കണ്ട സമയത്ത് തുടരുന്ന ഉപരോധാവസ്ഥയെ പങ്കാളിവാചകത്തിന്റെ പുരോഗമനഭാവത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: וְסוּס וָרָכֶב
  choice: കുതിരകളും രഥങ്ങളുമുള്ള
  rationale: സൈന്യത്തിന്റെ സൈനികസജ്ജീകരണം വ്യക്തമാക്കുന്ന വിധത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: נַעֲרוֹ
  choice: അവന്റെ ഭൃത്യൻ
  rationale: נַעַר എന്നതിന് യുവാവ്, ഭൃത്യൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; ഇവിടെ മുമ്പേ സേവനബന്ധം വ്യക്തമാക്കിയതിനാൽ ‘ഭൃത്യൻ’ പ്രസക്തമായ അർഥം നൽകുന്നു, എന്നാൽ പ്രായസൂചന നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: אֲהָהּ
  choice: അയ്യോ
  rationale: ഭീതിയും വ്യാകുലതയും പ്രകടിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ള മലയാള വ്യാക്ഷേപം.
- source_word: אֲדֹנִי
  choice: യജമാനനേ
  rationale: ഇത് ദൈവിക അഭിസംബോധനയല്ല, സേവകൻ മേലധികാരിയെ ആദരപൂർവം വിളിക്കുന്നതാണ്; ‘യജമാനനേ’ ആ സാമൂഹികബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אֵיכָה נַעֲשֶׂה
  choice: നാം ഇനി എന്തു ചെയ്യും?
  rationale: ഭീതിയിൽ ഉയരുന്ന ‘എങ്ങനെ ചെയ്യും/എന്തു ചെയ്യും’ എന്ന ചോദ്യത്തിന്റെ പ്രായോഗിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ഇനി’ സാഹചര്യത്തിന്റെ അടിയന്തരത സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘ദൈവപുരുഷൻ’ എന്ന സ്ഥാപിത പ്രവാചകപദവി നിലനിർത്തി; വിവരണത്തിലെ പെട്ടെന്നുള്ള കാഴ്ചയ്ക്ക് ‘ഇതാ’യും ഭൃത്യന്റെ പരിഭ്രമത്തിന് ‘അയ്യോ’യും ഉപയോഗിച്ചു.
