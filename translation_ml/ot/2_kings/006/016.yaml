language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אַל תִּירָ֑א כִּ֤י רַבִּים֙ אֲשֶׁ֣ר אִתָּ֔/נוּ מֵ/אֲשֶׁ֖ר אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/016.yaml
  text: He said[a], “Do not be afraid, for those who are with us are more than those who are with them.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ; കാരണം, നമ്മോടുകൂടെയുള്ളവർ അവരോടുകൂടെയുള്ളവരെക്കാൾ അധികമാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവരോടുകൂടെയുള്ളവരെക്കാൾ, നമ്മോടുകൂടെയുള്ളവർ അനേകരാണ്.”'
    reason: רַבִּים എന്നതിന്റെ ‘അനേകർ’ എന്ന അടിസ്ഥാനാർഥവും താരതമ്യഘടനയും കൂടുതൽ അക്ഷരാർഥത്തിൽ കാണിക്കുന്ന മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ ഭൂതകാലക്രിയ ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ ‘അവൻ പറഞ്ഞു’ എന്നത് ക്രിയയുടെ അർഥവും പ്രവാഹവും നിലനിർത്തുന്നു.
- source_word: אַל תִּירָא
  choice: ഭയപ്പെടേണ്ടാ
  rationale: אַל സഹിതമുള്ള ക്രിയ ഇവിടെ വിലക്കിനെ സൂചിപ്പിക്കുന്നു. ഏകവചനത്തിലുള്ള അഭിസംബോധനയും ആശ്വസിപ്പിക്കുന്ന സ്വരവും സ്വാഭാവിക മലയാളത്തിൽ ഈ പ്രയോഗം നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഭയപ്പെടരുതെന്ന നിർദേശത്തിനുള്ള കാരണം ഇവിടെ כִּי അവതരിപ്പിക്കുന്നു.
- source_word: רַבִּים
  choice: അധികമാണ്
  rationale: מֵאֲשֶׁר എന്ന താരതമ്യഘടനയോടൊപ്പം רַבִּים ‘കൂടുതൽ/അധികം’ എന്ന താരതമ്യാർഥം നൽകുന്നു. ആളുകളുടെ എണ്ണത്തെക്കുറിച്ചുള്ള താരതമ്യം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: אֲשֶׁר אִתָּנוּ
  choice: നമ്മോടുകൂടെയുള്ളവർ
  rationale: ബന്ധസൂചകപദവും ‘നമ്മോടുകൂടെ’ എന്ന പദബന്ധവും ചേർന്ന് വ്യക്തികളെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ രൂപം എബ്രായഘടനയും സ്വാഭാവിക മലയാളവും സംരക്ഷിക്കുന്നു.
- source_word: מֵאֲשֶׁר אוֹתָם
  choice: അവരോടുകൂടെയുള്ളവരെക്കാൾ
  rationale: מן ചേർന്ന ബന്ധസൂചകപദം താരതമ്യത്തിന്റെ മറുവശം അവതരിപ്പിക്കുന്നു. മുൻവാക്യഘടകത്തിലെ ‘കൂടെ’ എന്ന ആശയം എബ്രായത്തിൽ സംക്ഷിപ്തമായിരിക്കുമ്പോഴും മലയാളത്തിൽ സമാന്തരത വ്യക്തമായി നൽകേണ്ടതിനാൽ അത് പൂരിപ്പിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: ‘നമ്മോടുകൂടെയുള്ളവർ’ എന്ന വലിയ സംഘത്തിന്റെ തിരിച്ചറിയൽ
  choice: എബ്രായവാക്യംപോലെ അവരുടെ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല.
  alternative: തുടർന്നുള്ള സന്ദർഭത്തിന്റെ അടിസ്ഥാനത്തിൽ അവരെ സ്വർഗീയസൈന്യമെന്നോ ദൂതന്മാരെന്നോ വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം ആ സംഘത്തെ പേരെടുത്തു പറയുന്നില്ല; തുടർന്നുള്ള വിവരണം അവരുടെ സ്വഭാവം വെളിപ്പെടുത്തുന്നു. അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ മൂലപാഠത്തിന്റെ സംയമനം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘നമ്മോടുകൂടെയുള്ളവർ’ / ‘അവരോടുകൂടെയുള്ളവർ’ എന്ന സമാന്തരഘടന മൂലപാഠത്തിലെ വിരുദ്ധത വ്യക്തമായി നിലനിർത്തുന്നു.
