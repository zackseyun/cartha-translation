translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്ത് ശൈലി. രാജാവിന്റെ ബഹുവചന ആജ്ഞയ്ക്ക് ‘നോക്കുവിൻ’ ഉപയോഗിച്ചു. നിഷ്ക്രിയ റിപ്പോർട്ട് ഘടനയും ഉദ്ദേശ്യം/തുടർച്ച എന്ന വ്യാകരണസാധ്യതയും കഴിയുന്നത്ര സംരക്ഷിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
