  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לְכ֤וּ וּ/רְאוּ֙ אֵיכֹ֣ה ה֔וּא וְ/אֶשְׁלַ֖ח וְ/אֶקָּחֵ֑/הוּ וַ/יֻּגַּד ל֥/וֹ לֵ/אמֹ֖ר הִנֵּ֥ה בְ/דֹתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/013.yaml
  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു[a]: “പോയി അവൻ എവിടെയാണെന്ന് നോക്കുവിൻ; ഞാൻ അയച്ച് അവനെ പിടികൂടേണ്ടതിന്.” “ഇതാ[b], അവൻ ദോഥാനിലുണ്ട്” എന്ന് അവന് വിവരം അറിയിക്കപ്പെട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഞാൻ അയച്ച് അവനെ പിടികൂടും.” ഹീബ്രായ വാക്യാനുക്രമം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; ഇവിടെ അത് ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: ദോഥാൻ ശമര്യയ്ക്കു വടക്കുള്ള ഒരു പട്ടണമായിരുന്നു; യോസേഫിന്റെ ചരിത്രത്തിലും ഈ സ്ഥലം പരാമർശിക്കപ്പെടുന്നു (ഉല്പത്തി 37:17).
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol രൂപം; സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലി നിലനിർത്തുന്നു.
- source_word: לְכוּ וּרְאוּ
  choice: പോയി … നോക്കുവിൻ
  rationale: രണ്ട് ബഹുവചന ആജ്ഞാരൂപങ്ങളെയും മാന്യവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ അന്വേഷണഭാവം അമിതമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: אֵיכֹה הוּא
  choice: അവൻ എവിടെയാണെന്ന്
  rationale: സ്ഥലത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവികമായ പരോക്ഷവാക്യഘടനയിൽ നൽകുന്നു.
- source_word: וְאֶשְׁלַח וְאֶקָּחֵהוּ
  choice: ഞാൻ ആളയച്ച് അവനെ പിടിക്കട്ടെ
  rationale: വ്യക്തമാക്കാത്ത കർമം മലയാളത്തിൽ ആവശ്യമായതിനാൽ ‘ആൾ’ ചേർക്കുന്നു; ഈ ശത്രുതാപരമായ സന്ദർഭത്തിൽ לקח എന്നത് പിടികൂടുക എന്ന അർഥം നൽകുന്നു. ‘-ട്ടെ’ ഉദ്ദേശ്യഭാവം സൂചിപ്പിക്കുമ്പോഴും ഹീബ്രായ അനുക്രമത്തിന്റെ സാധ്യത തുറന്നുവയ്ക്കുന്നു.
- source_word: וַיֻּגַּד לוֹ
  choice: അവന് അറിവു ലഭിച്ചു
  rationale: ആരാണ് അറിയിച്ചതെന്ന് പറയാത്ത ഹോഫാൽ നിഷ്ക്രിയരൂപത്തിന്റെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לֵאמֹר
  choice: എന്ന്
  rationale: ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള സമാനരൂപം.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന deictic കണികയെ ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְדֹתָן
  choice: ദോഥാനിലുണ്ട്
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ב എന്ന സ്ഥലസൂചക ഉപസർഗം ‘-യിൽ’ എന്ന അർഥത്തിൽ നൽകുകയും ചെയ്യുന്നു.
