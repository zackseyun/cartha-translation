reference: 2 Kings 6:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַל יוֹשִׁעֵ֣/ךְ יְהוָ֔ה מֵ/אַ֖יִן אֽוֹשִׁיעֵ֑/ךְ הֲ/מִן הַ/גֹּ֖רֶן א֥וֹ מִן הַ/יָּֽקֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/027.yaml
  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “യഹ്‌വെ നിന്നെ സഹായിക്കുന്നില്ലെങ്കിൽ, എവിടെനിന്നാണ് എനിക്ക് നിന്നെ സഹായിക്കാനാകുക? മെതിക്കളത്തിൽനിന്നോ മുന്തിരിച്ചക്കിൽനിന്നോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹായിക്കുക” എന്നതിന് “രക്ഷിക്കുക” അല്ലെങ്കിൽ “വിടുവിക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം; രണ്ടു വാക്യഭാഗങ്ങളിലും ഒരേ ഹീബ്രായ ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ലളിതമായി അവതരിപ്പിക്കുന്നു.
- source_word: אַל יוֹשִׁעֵךְ יְהוָה
  choice: യഹ്‌വെ നിന്നെ സഹായിക്കുന്നില്ലെങ്കിൽ
  rationale: ഇവിടെ אַל തുടർന്നുള്ള ചോദ്യത്തോടൊപ്പം നിബന്ധനാപരമായ നിരാശാഭാവം പ്രകടിപ്പിക്കുന്നു. ישׁע എന്ന ക്രിയയുടെ ‘സഹായിക്കുക/രക്ഷിക്കുക/വിടുവിക്കുക’ എന്ന അർഥവ്യാപ്തിയിൽ, ക്ഷാമസാഹചര്യത്തിന് ‘സഹായിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מֵאַיִן אֹושִׁיעֵךְ
  choice: ഞാൻ എവിടെനിന്ന് നിന്നെ സഹായിക്കും?
  rationale: മൂലത്തിലെ ഉറവിടത്തെക്കുറിച്ചുള്ള മֵאַיִן എന്ന ചോദ്യംയും ആദ്യ ക്രിയയുമായുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: הֲמִן הַגֹּרֶן
  choice: മെതിക്കളത്തിൽനിന്നോ
  rationale: ധാന്യം ലഭിക്കേണ്ട ഇടമായ threshing floor-നെ സൂചിപ്പിക്കുന്ന ഗֹּרֶן എന്ന പദത്തിന് സാധാരണവും കൃത്യവുമായ മലയാളം.
- source_word: מִן הַיָּקֶב
  choice: മുന്തിരിച്ചക്കിൽനിന്നോ
  rationale: יֶקֶב മുന്തിരി ചതച്ച് നീരെടുക്കുന്ന ചക്കയെയോ അതോടനുബന്ധിച്ച സംഭരണകുഴിയെയോ സൂചിപ്പിക്കാം; ധാന്യവും വീഞ്ഞും ലഭിക്കുന്ന ഉറവിടങ്ങളുടെ സമാന്തരത ഇവിടെ ‘മുന്തിരിച്ചക്ക്’ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതവും സ്രോതസ്സിനോട് അടുത്തതുമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ישׁע എന്ന ക്രിയയുടെ അർഥം
  choice: സഹായിക്കുക
  alternative: രക്ഷിക്കുക; വിടുവിക്കുക
  rationale: ക്ഷാമത്തിൽ പ്രായോഗിക ആശ്വാസം നൽകുന്നതാണ് ഉടൻ പ്രസക്തമായത്. എങ്കിലും ‘രക്ഷിക്കുക/വിടുവിക്കുക’ എന്ന യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിന്റെ നിരാശാഭരിതമായ ആലങ്കാരിക ചോദ്യം നിലനിർത്തിയിരിക്കുന്നു; അസ്പഷ്ടമായ ക്രിയാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
