id: 2KI.6.9
reference: 2 Kings 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח אִ֣ישׁ הָ/אֱלֹהִ֗ים אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר הִשָּׁ֕מֶר מֵ/עֲבֹ֖ר הַ/מָּק֣וֹם הַ/זֶּ֑ה כִּֽי שָׁ֖ם אֲרָ֥ם נְחִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/009.yaml
  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
translation:
  language: ml
  text: 'അപ്പോൾ ദൈവപുരുഷൻ ഇസ്രായേൽ രാജാവിന് സന്ദേശം അയച്ചു: “ഈ സ്ഥലത്തുകൂടി കടന്നുപോകാതിരിക്കാൻ സൂക്ഷിക്കുക; കാരണം അരാമ്യർ അവിടെ ഇറങ്ങിവരുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അരാമ്യർ അവിടെ ഇറങ്ങുന്നു.”
    reason: നְחִתִּים എന്ന ക്രിയാരൂപത്തിന് ‘ഇറങ്ങുന്നു/താഴേക്കു വരുന്നു’ എന്ന നേരിട്ടുള്ള അർഥസാധ്യത രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: സന്ദേശമയച്ചു
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘അയച്ചു’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ദൈവപുരുഷൻ രാജാവിന് ഒരു മുന്നറിയിപ്പുസന്ദേശം അയയ്ക്കുന്നതാണ്; മലയാളത്തിൽ ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: എബ്രായത്തിലെ സ്ഥിരമായ വിശേഷണം വ്യാഖ്യാനിച്ച് ‘പ്രവാചകൻ’ എന്നു മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: രാജകീയ പദവിയുടെയും ജനനാമത്തിന്റെയും നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: הִשָּׁמֶר מֵעֲבֹר
  choice: കടന്നുപോകാതിരിക്കാൻ സൂക്ഷിക്കുക
  rationale: നിഫാൽ ആജ്ഞയുടെ മുന്നറിയിപ്പുസ്വഭാവവും מִן ചേർന്ന ക്രിയയുടെ ഒഴിവാക്കൽഭാവവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലം
  rationale: നിർദേശകസർവനാമത്തോടുകൂടിയ പദപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: אֲרָם
  choice: അരാമ്യർ
  rationale: ഇവിടെ ദേശനാമമായ അരാം അതിന്റെ സൈന്യത്തെയോ ജനത്തെയോ സൂചിപ്പിക്കുന്നു; കാലവിരുദ്ധമായ ‘സുറിയാക്കാർ’ എന്നതിനെക്കാൾ മൂലപാഠത്തോട് അടുത്തത്.
- source_word: נְחִתִּים
  choice: ഇറങ്ങിവരുന്നു
  rationale: നחת എന്ന ക്രിയയുടെ ‘ഇറങ്ങുക’ എന്ന അർഥവും വർത്തമാന പങ്കാളിയുടെ തുടരുന്ന സൈനികനീക്കഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘ദൈവപുരുഷൻ’ എന്ന മൂലപാഠത്തിലെ വിശേഷണം നിലനിർത്തി; സൈനികയാത്രാസന്ദർഭത്തിലെ മുന്നറിയിപ്പ് വ്യക്തവും സ്വാഭാവികവുമാക്കി.
