translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘തുലാം’ എന്നത് നിർമാണത്തിനുപയോഗിക്കുന്ന നീളൻ തടിയെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ അഭ്യർഥനാഭാവവും അവസാനത്തെ ചുരുക്കമായ അനുമതിയും സംരക്ഷിച്ചിട്ടുണ്ട്.
