source:
  edition: WLC
  text: נֵֽלְכָה נָּ֣א עַד הַ/יַּרְדֵּ֗ן וְ/נִקְחָ֤ה מִ/שָּׁם֙ אִ֚ישׁ קוֹרָ֣ה אֶחָ֔ת וְ/נַעֲשֶׂה לָּ֥/נוּ שָׁ֛ם מָק֖וֹם לָ/שֶׁ֣בֶת שָׁ֑ם וַ/יֹּ֖אמֶר לֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/002.yaml
  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
translation:
  language: ml
  text: '“ദയവായി നമുക്ക് യോർദ്ദാനിലേക്കു പോകാം; അവിടെനിന്ന് ഓരോരുത്തരും ഓരോ തടി എടുക്കട്ടെ. നമുക്കു അവിടെ താമസിക്കാൻ അവിടെ ഒരു സ്ഥലം ഉണ്ടാക്കാം.” അവൻ പറഞ്ഞു: “പോകൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵלְכָה נָּא
  choice: ദയവായി ഞങ്ങൾ ... പോകട്ടെ
  rationale: ഒന്നാം പുരുഷ ബഹുവചന കോഹോർട്ടേറ്റീവും נָא എന്ന അഭ്യർഥനാകണികയും ചേർന്നുള്ള വിനീതമായ അപേക്ഷ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַד הַיַּרְדֵּן
  choice: യോർദ്ദാനിലേക്കു
  rationale: യാത്രാസന്ദർഭത്തിൽ עַד എന്നത് ‘വരെ/അടുക്കൽ/ലേക്ക്’ എന്ന ലക്ഷ്യാർഥം നൽകുന്നു; ഇവിടെ നദിയെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ‘യോർദ്ദാൻ’ മാത്രം മതിയായും സ്വാഭാവികമായും ഗ്രഹിക്കപ്പെടുന്നു.
- source_word: וְנִקְחָה מִשָּׁם אִישׁ קוֹרָה אֶחָת
  choice: അവിടെനിന്ന് ഓരോരുത്തരും ഓരോ തുലാം എടുത്തുകൊണ്ടുവരട്ടെ
  rationale: אִישׁ ... אֶחָת എന്ന വിതരണപ്രയോഗം ഓരോ വ്യക്തിയും ഓരോ നിർമ്മാണത്തടി എടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കെട്ടിടനിർമാണസന്ദർഭത്തിൽ קוֹרָהയ്ക്ക് ‘തുലാം’ യോജിക്കുന്നു; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള കൊണ്ടുവരൽ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְנַעֲשֶׂה לָּנוּ שָׁם מָקוֹם
  choice: ഞങ്ങൾക്കു ... അവിടെ ഒരു സ്ഥലം ഉണ്ടാക്കാം
  rationale: עשה എന്ന പൊതുവായ ‘ഉണ്ടാക്കുക/ചെയ്യുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘പണിയുക’ എന്ന് അമിതമായി നിർവചിക്കുന്നില്ല.
- source_word: לָשֶׁבֶת שָׁם
  choice: താമസിക്കാൻ
  rationale: ישב ഇവിടെ ഇരിക്കുക എന്നല്ല, പാർക്കുക/താമസിക്കുക എന്ന അർഥത്തിലാണ്; ആവർത്തിച്ചുള്ള ‘അവിടെ’ മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ ഒരിക്കൽ മാത്രം നൽകി.
- source_word: וַיֹּאמֶר לֵכוּ
  choice: 'അപ്പോൾ അവൻ പറഞ്ഞു: “പോകുവിൻ.”'
  rationale: അനുമതി നൽകുന്ന ഹ്രസ്വമായ ആജ്ഞയുടെ ശക്തിയും വിവരണത്തിന്റെ ലാളിത്യവും നിലനിർത്തുന്നു.
