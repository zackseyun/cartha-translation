- from: അപ്പോൾ ദൈവപുരുഷൻ തന്നോടു പറഞ്ഞ് മുന്നറിയിപ്പു നൽകിയ സ്ഥലത്തേക്ക് ഇസ്രായേൽരാജാവ് ആളയച്ചു[a]; അവിടെ അദ്ദേഹം മുൻകരുതലെടുത്തു[b]—ഒന്നോ രണ്ടോ തവണയല്ല.
