translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദൈവപുരുഷൻ’ എന്ന പരമ്പരാഗതവും ഉറവിടസന്നിഹിതവുമായ പദവി നിലനിർത്തി. വַיִּשְׁלַח എന്നതിലെ അപ്രകട കർമവും וְנִשְׁמַר എന്നതിലെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
