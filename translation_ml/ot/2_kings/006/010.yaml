  yaml_path: translation/ot/2_kings/006/010.yaml
  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
translation:
  language: ml
  text: അപ്പോൾ ദൈവപുരുഷൻ രാജാവിനോടു പറഞ്ഞുകൊടുക്കുകയും അദ്ദേഹത്തിനു മുന്നറിയിപ്പ് നൽകുകയും ചെയ്ത സ്ഥലത്തേക്ക് ഇസ്രായേൽരാജാവ് അയച്ചു[a]; അവിടെ അദ്ദേഹം മുൻകരുതലുകൾ എടുത്തു[b]—ഒന്നോ രണ്ടോ തവണയല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘സ്ഥലത്തേക്ക് അയച്ചു’; ആരെയോ എന്തിനെയോ അയച്ചുവെന്നത് ഹീബ്രുവിൽ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവിടെ അദ്ദേഹം ജാഗ്രത പാലിച്ചു.’ ഇത് രാജാവ് സ്വയം സൂക്ഷിച്ചതിനെയോ ആ സ്ഥലത്ത് മുൻകരുതലുകൾ എടുത്തതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ചു
  rationale: ഹീബ്രു ക്രിയ അക്ഷരാർഥത്തിൽ ‘അയച്ചു’ എന്നാണ്; കർമം വ്യക്തമാക്കിയിട്ടില്ല. മലയാളത്തിൽ സ്ഥലത്തേക്ക് അയയ്ക്കുന്നതെന്ന സന്ദർഭം സ്വാഭാവികമാക്കാൻ ‘ആളയച്ചു’ എന്നു നൽകി, എന്നാൽ ഈ പൂരണം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: הַמָּקוֹם
  choice: സ്ഥലത്തേക്ക്
  rationale: നിശ്ചിതമായ, മുമ്പ് സൂചിപ്പിച്ച സ്ഥലത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר אָמַר לוֹ אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ തന്നോടു പറഞ്ഞ ... സ്ഥലത്തേക്ക്
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തുകയും ‘ദൈവപുരുഷൻ’ എന്ന ഉറവിടത്തിലെ പദവി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִזְהִירֹה
  choice: മുന്നറിയിപ്പു നൽകിയ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘മുന്നറിയിപ്പ് നൽകുക/ജാഗ്രതപ്പെടുത്തുക’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; സർവനാമപ്രത്യയം രാജാവിനെ സൂചിപ്പിക്കുന്നതായി സ്വീകരിച്ചു.
- source_word: וְנִשְׁמַר
  choice: മുൻകരുതലെടുത്തു
  rationale: നിഫാൽ രൂപം ഇവിടെ സ്വയം സൂക്ഷിക്കുക, ജാഗ്രത പാലിക്കുക, മുൻകരുതൽ എടുക്കുക എന്നീ അർഥങ്ങൾ അനുവദിക്കുന്നു. സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: മുന്നറിയിപ്പ് ലഭിച്ച സ്ഥലത്തെയാണ് ലളിതമായി തിരിച്ചുസൂചിപ്പിക്കുന്നത്.
- source_word: לֹא אַחַת וְלֹא שְׁתָּיִם
  choice: ഒന്നോ രണ്ടോ തവണയല്ല
  rationale: ഇത് ആവർത്തിത സംഭവത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; രൂപവും ഊന്നലും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
