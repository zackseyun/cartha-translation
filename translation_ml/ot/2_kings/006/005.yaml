  text: וַ/יְהִ֤י הָֽ/אֶחָד֙ מַפִּ֣יל הַ/קּוֹרָ֔ה וְ/אֶת הַ/בַּרְזֶ֖ל נָפַ֣ל אֶל הַ/מָּ֑יִם וַ/יִּצְעַ֥ק וַ/יֹּ֛אמֶר אֲהָ֥הּ אֲדֹנִ֖/י וְ/ה֥וּא שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/005.yaml
  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
translation:
  language: ml
  text: 'എന്നാൽ ഒരാൾ ഒരു തടി വെട്ടിവീഴ്ത്തിക്കൊണ്ടിരിക്കുമ്പോൾ, ഇരുമ്പ്[a] വെള്ളത്തിൽ വീണു. അവൻ നിലവിളിച്ചു: “അയ്യോ, എന്റെ യജമാനനേ! അതു കടം വാങ്ങിയതായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇരുമ്പ്’ എന്നാണ്; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഉപകരണത്തിന്റെ ഇരുമ്പുഭാഗമായ കോടാലിത്തലയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפִּיל
  choice: വെട്ടിവീഴ്ത്തിക്കൊണ്ടിരിക്കുമ്പോൾ
  rationale: נפל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ തടി വെട്ടി വീഴ്ത്തുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണിത്.
- source_word: הַקּוֹרָה
  choice: ഒരു തടി
  rationale: קוֹרָה എന്നത് കെട്ടിടനിർമാണത്തിനുള്ള തടി, ഉത്തരം, അല്ലെങ്കിൽ മരത്തടി എന്നിവയെ സൂചിപ്പിക്കാം. വെട്ടുന്ന ഘട്ടത്തിൽ മലയാളത്തിൽ ‘ഒരു തടി’ സ്വാഭാവികവും അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: הַבַּרְזֶל
  choice: ഇരുമ്പ്
  rationale: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘ഇരുമ്പ്’ എന്നാണ് പറയുന്നത്; സന്ദർഭത്തിൽ അത് കോടാലിയുടെ ഇരുമ്പുതലയെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ മൂലരൂപം നിലനിർത്തി അടിക്കുറിപ്പിൽ അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּצְעַק
  choice: അവൻ നിലവിളിച്ചു
  rationale: നഷ്ടത്തെത്തുടർന്നുള്ള പെട്ടെന്നുള്ള പരിഭ്രമവും ദുഃഖവും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: אֲהָהּ
  choice: അയ്യോ
  rationale: വ്യസനവും പരിഭ്രമവും പ്രകടിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാള വിസ്മയപ്രയോഗം.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനനേ
  rationale: എലീശയെ മേലധികാരിയും ഗുരുവുമായാണ് അഭിസംബോധന ചെയ്യുന്നത്. ‘എന്റെ’ എന്ന ഘടകം മൂലപാഠത്തിലെ പ്രത്യയം സംരക്ഷിക്കുന്നു.
- source_word: שָׁאוּל
  choice: കടം വാങ്ങിയതായിരുന്നു
  rationale: ഇവിടെ പദം വസ്തു മറ്റൊരാളിൽനിന്ന് ഉപയോഗത്തിനായി വാങ്ങിയതാണെന്ന അർത്ഥത്തിലാണ്; നഷ്ടത്തെക്കുറിച്ചുള്ള സംസാരിക്കുന്നവന്റെ ആശങ്കയും ഇതിലൂടെ വ്യക്തമാകുന്നു.
