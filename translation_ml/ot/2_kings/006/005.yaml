translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ ‘ഇരുമ്പ്’ എന്ന ലക്ഷണപ്രയോഗം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
