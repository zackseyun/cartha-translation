translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അരാം’ എന്ന മൂലഭാഷാനാമം നിലനിർത്തി; പഴയ വിവർത്തനങ്ങളിലെ ‘സിറിയ’ സ്വീകരിച്ചിട്ടില്ല. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ [c] കുറിപ്പ് മലയാള മുഖ്യപാഠത്തിൽ വേറൊരു അടിക്കുറിപ്പായി ആവശ്യമില്ല, കാരണം ‘അരാം’ നേരിട്ടുതന്നെ ഉപയോഗിച്ചിട്ടുണ്ട്.
