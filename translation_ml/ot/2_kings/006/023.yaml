  source_fidelity: 'മുഖ്യപാഠം എബ്രായ വാക്യക്രമത്തെയും അർത്ഥത്തെയും വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു: വലിയ വിരുന്നൊരുക്കൽ, ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്യൽ, അവരെ പറഞ്ഞയക്കൽ, യജമാനന്റെ അടുക്കലേക്കുള്ള മടക്കം, അരാമിന്റെ കൊള്ളസംഘങ്ങൾ പിന്നീട് ഇസ്രായേൽദേശത്തേക്കു വരാതിരിക്കൽ എന്നിവയെല്ലാം വ്യക്തമാണ്. ‘യജമാനന്റെ’ എന്ന ഏകവചനപ്രയോഗം സന്ദർഭത്തിൽ അരാംരാജാവിനെ സൂചിപ്പിക്കാനുള്ള സാധ്യതയെ ഉചിതമായി പ്രതിഫലിപ്പിക്കുന്നു; അടിക്കുറിപ്പ് ശേഷിക്കുന്ന രൂപപരമായ/സന്ദർഭപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.'
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാക്യങ്ങൾ സ്വാഭാവികവും വായനാസുഗമവുമാണ്. ‘വിരുന്നൊരുക്കി,’ ‘പറഞ്ഞയച്ചു,’ ‘കൊള്ളസംഘങ്ങൾ,’ ‘ഇസ്രായേൽദേശത്തേക്കു’ എന്നിവ മാന്യമായ ആഖ്യാനരജിസ്റ്ററിന് യോജിക്കുന്നു.
  terminology: ‘അരാം’ എന്ന മൂലഭാഷാനാമം നിലനിർത്തിയിരിക്കുന്നു. גְּדוּדֵי എന്നതിന് ‘കൊള്ളസംഘങ്ങൾ’ എന്നത് ഔപചാരിക സൈന്യത്തെയല്ല, ആക്രമണ-കൊള്ളയടിക്കൽ സ്വഭാവമുള്ള ചെറുസംഘങ്ങളെയാണു സൂചിപ്പിക്കുന്നത്. ‘യജമാനൻ’ ഇവിടെ അനാവശ്യ ദൈവിക/സഭാപരമായ അർത്ഥഭാരം ഒഴിവാക്കുന്നു.
