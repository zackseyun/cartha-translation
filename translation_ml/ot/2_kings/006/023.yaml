source:
  edition: WLC
  text: וַ/יִּכְרֶ֨ה לָ/הֶ֜ם כֵּרָ֣ה גְדוֹלָ֗ה וַ/יֹּֽאכְלוּ֙ וַ/יִּשְׁתּ֔וּ וַֽ/יְשַׁלְּחֵ֔/ם וַ/יֵּלְכ֖וּ אֶל אֲדֹֽנֵי/הֶ֑ם וְ/לֹֽא יָ֤סְפוּ עוֹד֙ גְּדוּדֵ֣י אֲרָ֔ם לָ/ב֖וֹא בְּ/אֶ֥רֶץ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/023.yaml
  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
translation:
  language: ml
  text: അങ്ങനെ അവൻ അവർക്കായി ഒരു വലിയ വിരുന്നൊരുക്കി[a]. അവർ തിന്നുകയും കുടിക്കുകയും ചെയ്തു. പിന്നെ അവൻ അവരെ പറഞ്ഞയച്ചു; അവർ തങ്ങളുടെ യജമാനന്റെ അടുക്കലേക്കു പോയി[b]. അതിനുശേഷം അരാമ്യരുടെ കൊള്ളസംഘങ്ങൾ ഇസ്രായേൽദേശത്തേക്കു വീണ്ടും വന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു വലിയ സദ്യയൊരുക്കി.’ സമൃദ്ധമായ ഭക്ഷണം ഒരുക്കുന്നതിനെ സൂചിപ്പിക്കാൻ എബ്രായത്തിൽ ഒരേ ധാതുവിലുള്ള ക്രിയയും നാമവും ചേർന്ന പ്രയോഗമാണിവിടെ.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തങ്ങളുടെ പ്രഭുവിന്റെ അടുക്കലേക്ക്.’ ഇത് അരാംരാജാവിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֶה ... כֵּרָה גְדוֹלָה
  choice: ഒരു വലിയ വിരുന്നൊരുക്കി
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന എബ്രായ പ്രയോഗം സമൃദ്ധമായ ഭക്ഷണമോ വിരുന്നോ ഒരുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വലിയ വിരുന്നൊരുക്കി’ എന്നത് ഊന്നലും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: לָהֶם
  choice: അവർക്കായി
  rationale: സർവനാമം പിടിക്കപ്പെട്ട അരാമ്യരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ലളിതവും വ്യക്തവുമായ രൂപം.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: അവർ തിന്നുകയും കുടിക്കുകയും ചെയ്തു
  rationale: ജോടിയായ രണ്ടു ക്രിയകളെയും നേരിട്ട്, സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וַיְשַׁלְּחֵם
  choice: അവരെ പറഞ്ഞയച്ചു
  rationale: അവരെ വിട്ടയച്ച് മടങ്ങാൻ അയച്ചുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: തങ്ങളുടെ യജമാനന്റെ അടുക്കലേക്ക്
  rationale: രൂപത്തിൽ ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും മഹത്ത്വസൂചകമായ ഏകവചനപ്രയോഗമായി, സന്ദർഭത്തിൽ അരാംരാജാവിനെ സൂചിപ്പിക്കുന്നതായാണ് സാധ്യത; ‘യജമാനൻ’ ദൈവിക പദവിയുടെ അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
- source_word: וְלֹא יָסְפוּ עוֹד
  choice: വീണ്ടും വന്നില്ല
  rationale: יסף കൂടെ עוד എന്ന പ്രയോഗം ഒരു പ്രവൃത്തി ഇനി ആവർത്തിക്കാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘വരുക’ എന്ന ക്രിയയുമായി ചേർന്ന് ഈ പരിഭാഷ സ്വാഭാവികമാണ്.
- source_word: גְּדוּדֵי אֲרָם
  choice: അരാമ്യരുടെ കൊള്ളസംഘങ്ങൾ
  rationale: גְּדוּדֵי ഔപചാരിക സൈന്യത്തേക്കാൾ ആക്രമിച്ച് കൊള്ളയടിക്കുന്ന സംഘങ്ങളെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്; אֲרָם എന്ന സ്ഥലനാമത്തെ മലയാളത്തിൽ ‘അരാം’ എന്നും ജനസംബന്ധിയായ രൂപത്തിൽ ‘അരാമ്യർ’ എന്നും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לָבוֹא בְּאֶרֶץ יִשְׂרָאֵל
  choice: ഇസ്രായേൽദേശത്തേക്ക് ... വന്നില്ല
  rationale: בוא കൂടെ ב ദേശത്തിനുള്ളിലേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേൽദേശത്തേക്ക്’ ആ ദിശാബോധവും പ്രദേശസൂചനയും നിലനിർത്തുന്നു.
