  text: And as the king of Israel was passing by on the wall[a], a woman cried out to him, saying, “Help, my lord the king!”
translation:
  language: ml
  text: 'ഇസ്രായേലിന്റെ രാജാവ് മതിലിന്മേൽ കടന്നുപോകുമ്പോൾ, ഒരു സ്ത്രീ അവനോടു നിലവിളിച്ചു: “എന്റെ പ്രഭുവായ രാജാവേ, സഹായിക്കണമേ!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ പ്രഭുവായ രാജാവേ, രക്ഷിക്കണമേ!” എബ്രായത്തിലെ ആജ്ഞാരൂപത്തിന്റെ അക്ഷരാർഥം “രക്ഷിക്കുക” എന്നാണ്; എന്നാൽ ഇവിടെ അത് സഹായത്തിനായുള്ള അടിയന്തര അപേക്ഷയായി പ്രവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... עֹבֵר
  choice: കടന്നുപോകുമ്പോൾ
  rationale: വിവരണത്തിലെ പശ്ചാത്തലസാഹചര്യവും തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയും സ്വാഭാവികമായ മലയാള കാലവാക്യത്തിലൂടെ അറിയിക്കുന്നു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: രാജാവിനെ ഇസ്രായേലുമായി ബന്ധിപ്പിക്കുന്ന എബ്രായ സംയുക്തഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: עַל הַחֹמָה
  choice: മതിലിന്മേൽക്കൂടി
  rationale: עַל എന്നതിന്റെ ‘മേൽ’ എന്ന അടിസ്ഥാനാർഥവും രാജാവ് മതിലിലൂടെ നീങ്ങുന്ന സന്ദർഭവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: וְאִשָּׁה צָעֲקָה אֵלָיו
  choice: ഒരു സ്ത്രീ അവനോടു നിലവിളിച്ചു
  rationale: സ്ത്രീയെ ആദ്യമായി അനിശ്ചിതമായി അവതരിപ്പിക്കുകയും צעק എന്ന ക്രിയയിലെ ഉച്ചത്തിലുള്ള അടിയന്തരവിളി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הוֹשִׁיעָה
  choice: എന്നെ സഹായിക്കണമേ
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘രക്ഷിക്കുക’ ആണെങ്കിലും, രാജാവിന്റെ ഇടപെടൽ അഭ്യർഥിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘സഹായിക്കണമേ’ സ്വാഭാവികമാണ്; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: യജമാനനായ രാജാവേ
  rationale: രാജാവിനോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയും അപ്പൊസിഷണൽ രാജപദവിയും dignified modern Malayalam-ൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പരമ്പരാഗതമായി അത്യധികം പഴമ തോന്നിക്കുന്ന പ്രയോഗങ്ങൾ ഒഴിവാക്കി; രാജാവിനോടുള്ള ആദരസൂചക അഭിസംബോധന നിലനിർത്തി.
