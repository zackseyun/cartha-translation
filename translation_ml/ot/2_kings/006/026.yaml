revisions:
- from: 'ഇസ്രായേൽരാജാവ് മതിലിന്മേൽക്കൂടി കടന്നുപോകുമ്പോൾ ഒരു സ്ത്രീ അവനോടു നിലവിളിച്ചു: “യജമാനനായ രാജാവേ, എന്നെ സഹായിക്കണമേ![a]”'
  to: 'ഇസ്രായേലിന്റെ രാജാവ് മതിലിന്മേൽ കടന്നുപോകുമ്പോൾ, ഒരു സ്ത്രീ അവനോടു നിലവിളിച്ചു: “എന്റെ പ്രഭുവായ രാജാവേ, സഹായിക്കണമേ!”[a]'
  rationale: The revision makes the king’s location on the wall explicit without suggesting that he crossed over it, and it replaces a less natural royal address with an idiomatic modern Malayalam equivalent. The main rendering and footnote continue to distinguish the contextual sense “help” from the literal sense “save,” without adding doctrinal content.
