  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ יִשְׂרָאֵל֙ אֶל אֱלִישָׁ֔ע כִּ/רְאֹת֖/וֹ אוֹתָ֑/ם הַ/אַכֶּ֥ה אַכֶּ֖ה אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/021.yaml
  text: Then the king of Israel said to Elisha when he saw them[a], “Shall I strike them down? Shall I strike them down[b], my father?”
translation:
  language: ml
  text: 'അവരെ കണ്ടപ്പോൾ ഇസ്രായേൽരാജാവ് എലീശയോടു ചോദിച്ചു: “അവരെ ഞാൻ കൊന്നുകളയട്ടെയോ? കൊന്നുകളയട്ടെയോ, എന്റെ പിതാവേ?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ക്രിയ ഊന്നലിനായി ആവർത്തിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “എന്റെ പിതാവേ” എന്നത് എലീശയോടുള്ള ആദരസൂചക അഭിസംബോധനയാണ്; ജൈവിക പിതൃത്വം ഉദ്ദേശിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ചോദിച്ചു
  rationale: വാക്കിന്റെ അടിസ്ഥാനാർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും പിന്നാലെ നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ ആ സംസാരപ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു വ്യക്തമാക്കി.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: ഹീബ്രു സംയുക്തനാമത്തിന്റെ അർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֶל אֱלִישָׁע
  choice: എലീശയോടു
  rationale: אֶל ഇവിടെ അഭിസംബോധനയുടെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിലില്ലാത്ത ‘പ്രവാചകൻ’ പോലുള്ള വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: כִּרְאֹתוֹ אֹתָם
  choice: അവരെ കണ്ടപ്പോൾ
  rationale: כְּ ചേർന്ന infinitive construct കാലസംബന്ധമായ ഉപവാക്യമാണ്; സന്ദർഭത്തിൽ കാണുന്നവൻ രാജാവാണെന്നത് മലയാളവാക്യഘടനയിൽ വ്യക്തമാണ്.
- source_word: הַאַכֶּה אַכֶּה
  choice: ഞാൻ അവരെ വെട്ടിവീഴ്ത്തട്ടെയോ? വെട്ടിവീഴ്ത്തട്ടെയോ?
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികവും മാരകവുമായ സന്ദർഭാർഥം ‘വെട്ടിവീഴ്ത്തുക’ നൽകുന്നു. finite verb-നോടൊപ്പം വന്ന infinitive absolute നൽകുന്ന ഊന്നൽ ചോദ്യം ആവർത്തിച്ചുകൊണ്ട് സംരക്ഷിച്ചു.
- source_word: אָבִי
  choice: എന്റെ പിതാവേ
  rationale: ഇത് എലീശയോടുള്ള ആദരസൂചക അഭിസംബോധനയാണ്. ‘യജമാനനേ’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റാതെ മൂലത്തിലെ കുടുംബബന്ധരൂപകം നിലനിർത്തി.
theological_decisions:
- issue: എലീശയോടുള്ള ആദരസൂചക അഭിസംബോധന
  choice: എന്റെ പിതാവേ
  alternative: യജമാനനേ / അങ്ങുന്നേ
  rationale: ഹീബ്രു പദം അക്ഷരാർഥത്തിൽ ‘എന്റെ പിതാവ്’ എന്നാണ്. ഇവിടെ ജൈവിക പിതൃത്വമല്ല, പ്രവാചകനോടുള്ള ആദരവും ആശ്രയബോധവും പ്രകടമാക്കുന്ന അഭിസംബോധനയാണെങ്കിലും, മൂലപാഠത്തിലെ ബന്ധഭാഷ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ചോദ്യം രണ്ടുതവണ നൽകിയത് ഹീബ്രുവിലെ ഊന്നൽ നിലനിർത്താനാണ്; അഭിസംബോധന മൂലപാഠത്തിലെ സ്ഥാനക്രമം അനുസരിച്ച് അവസാനം വെച്ചു.
