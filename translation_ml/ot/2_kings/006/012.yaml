  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַחַ֣ד מֵֽ/עֲבָדָ֔י/ו ל֖וֹא אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ כִּֽי אֱלִישָׁ֤ע הַ/נָּבִיא֙ אֲשֶׁ֣ר בְּ/יִשְׂרָאֵ֔ל יַגִּיד֙ לְ/מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר בַּ/חֲדַ֥ר מִשְׁכָּבֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/012.yaml
  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: ml
  text: 'എന്നാൽ അവന്റെ ഭൃത്യന്മാരിൽ ഒരാൾ അവനോടു പറഞ്ഞു: “അല്ല, എന്റെ യജമാനനായ രാജാവേ; ഇസ്രായേലിലുള്ള എലീശാ പ്രവാചകൻ അങ്ങ് ശയനമുറിയിൽ സംസാരിക്കുന്ന വാക്കുകൾ ഇസ്രായേൽ രാജാവിനോടു പറഞ്ഞുകൊടുക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: അങ്ങനെയല്ല
  rationale: രാജാവിന്റെ സംശയത്തെ നിഷേധിക്കുന്ന സന്ദർഭത്തിൽ വെറും ‘അല്ല’ എന്നതിനെക്കാൾ സ്വാഭാവികവും അർത്ഥവ്യക്തവുമാണ്.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: യജമാനനായ രാജാവേ
  rationale: ആദരസൂചകമായ അഭിസംബോധനയും ‘എന്റെ യജമാനൻ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: יַגִּיד
  choice: അറിയിക്കുന്നു
  rationale: വിവരം പറഞ്ഞുകൊടുക്കുക/അറിയിക്കുക എന്ന സജീവ അർത്ഥം സന്ദർഭാനുസൃതമായി നൽകുന്നു.
- source_word: בַּחֲדַר מִשְׁכָּבֶךָ
  choice: അങ്ങ് ശയനമുറിയിൽവെച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കിടപ്പുമുറിയിൽ’; രാജാവിനോടുള്ള ആദരഭാഷ നിലനിർത്തി സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു.
- source_word: הַדְּבָרִים אֲשֶׁר תְּדַבֵּר
  choice: അങ്ങ് ... സംസാരിക്കുന്ന കാര്യങ്ങൾ
  rationale: ‘നീ സംസാരിക്കുന്ന വാക്കുകൾ/കാര്യങ്ങൾ’ എന്ന മൂലവാചകത്തെ ആവർത്തനഭാരം കൂടാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ഗദ്യശൈലി. രാജാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ച് ആദരഭാവം സംരക്ഷിച്ചു; മൂലത്തിലെ ഊന്നൽ പ്രകടമാക്കാൻ ‘പോലും’ ചേർത്തു.
