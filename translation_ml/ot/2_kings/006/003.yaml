  yaml_path: translation/ot/2_kings/006/003.yaml
  text: Then one said[a], “Please be willing to go with your servants.” And he said, “I will go.”
translation:
  language: ml
  text: 'അപ്പോൾ അവരിൽ ഒരാൾ പറഞ്ഞു: “അങ്ങയുടെ ദാസന്മാരോടൊപ്പം പോകാൻ ദയവായി സമ്മതിക്കണമേ.[a]” അദ്ദേഹം പറഞ്ഞു: “ഞാൻ പോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങയുടെ ദാസന്മാരോടൊപ്പം പോകാൻ ദയവായി മനസ്സുവയ്ക്കണമേ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֶחָד
  choice: അവരിൽ ഒരാൾ
  rationale: പദപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ആ ഒരാൾ’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ കൂട്ടത്തിലുണ്ടായിരുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവരിൽ ഒരാൾ’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הוֹאֶל נָא
  choice: ദയവായി സമ്മതിക്കണമേ
  rationale: הוֹאֶל എന്നതിലെ മനസ്സോടെയുള്ള സമ്മതത്തിന്റെ ഭാവവും נָא നൽകുന്ന വിനീതമായ അഭ്യർഥനയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וְלֵךְ
  choice: വരാൻ
  rationale: എബ്രായത്തിൽ അടിസ്ഥാനക്രിയ ‘പോകുക’ ആണെങ്കിലും, സംസാരിക്കുന്നവൻ തന്നെ പോകുന്ന സംഘത്തോടൊപ്പം എലീശാ ചേരണമെന്നു ക്ഷണിക്കുന്നതിനാൽ മലയാളത്തിലെ ദൈക്തിക പ്രയോഗത്തിൽ ‘വരാൻ’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: אֶת עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരോടൊപ്പം
  rationale: ചലനക്രിയയോടൊപ്പം אֶת സഹഗമനം സൂചിപ്പിക്കുന്നു. ഇവിടെ עֲבָדֶיךָ പ്രവാചകന്റെ അനുയായികൾ തങ്ങളെത്തന്നെ ആദരപൂർവം വിശേഷിപ്പിക്കുന്ന പദമായതിനാൽ ‘ദാസന്മാർ’ യോജിക്കുന്നു.
- source_word: אֲנִי אֵלֵךְ
  choice: ഞാൻ വരാം
  rationale: പ്രത്യക്ഷ സർവനാമം നൽകുന്ന നേരിയ ഊന്നൽ ‘ഞാൻ’ കൊണ്ട് നിലനിർത്തുന്നു. അഭ്യർഥനയ്ക്കുള്ള സമ്മതമായി മലയാളത്തിൽ ‘വരാം’ സ്വാഭാവികമാണ്; ഇത് നിർബന്ധമായ ഭാവിവചനത്തേക്കാൾ സന്നദ്ധതയും പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. എലീശായോടുള്ള ബഹുമാനം അറിയിക്കാൻ ‘അങ്ങ്’ രൂപവും വിനീതമായ ‘-ണമേ’ രൂപവും ഉപയോഗിച്ചു; ഹീബ്രുവിലെ ചലനദിശ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കാൻ ‘പോകുക’ എന്നതിനു പകരം ‘വരുക’ ഉപയോഗിച്ചു.
