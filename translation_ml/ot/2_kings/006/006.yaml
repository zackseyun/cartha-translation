  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
translation:
  language: ml
  text: 'അപ്പോൾ ദൈവപുരുഷൻ ചോദിച്ചു: “അത് എവിടെയാണ് വീണത്?” അവൻ ആ സ്ഥലം കാണിച്ചുകൊടുത്തു. ദൈവപുരുഷൻ ഒരു കമ്പ് വെട്ടിയെടുത്ത് അവിടെ എറിഞ്ഞു; ഇരുമ്പ്[a] പൊങ്ങിക്കിടന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഇരുമ്പ്.” സന്ദർഭത്തിൽ, മുൻവാക്യത്തിൽ പറഞ്ഞ ഇരുമ്പുകൊണ്ടുള്ള കോടാലിത്തലയെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ സ്ഥാനപ്പേര് അതിന്റെ രൂപകപ്രയോഗം സംരക്ഷിച്ചുകൊണ്ട് സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אָנָה נָפָל
  choice: അത് എവിടെയാണ് വീണത്?
  rationale: പൂർത്തിയായ വീഴ്ചയുടെ സ്ഥലം ചോദിക്കുന്നതായതിനാൽ മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാലചോദ്യം ഉപയോഗിച്ചു; ‘അത്’ മുൻവാക്യത്തിലെ ഇരുമ്പുകൊണ്ടുള്ള കോടാലിത്തലയെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּרְאֵהוּ אֶת־הַמָּקוֹם
  choice: അവൻ ആ സ്ഥലം കാണിച്ചുകൊടുത്തു
  rationale: ראה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘കാണിക്കുക’ എന്ന കാരകാർഥവും എബ്രായത്തിലെ തുടർച്ചയായ ആഖ്യാനക്രമവും നിലനിർത്തുന്നു.
- source_word: וַיִּקְצָב עֵץ
  choice: ഒരു കമ്പ് വെട്ടിയെടുത്തു
  rationale: קצב എന്നത് വെട്ടിയെടുക്കുന്നതും עץ ഇവിടെ വെള്ളത്തിലേക്ക് എറിയാവുന്ന ഒരു മരക്കമ്പിനെയും സൂചിപ്പിക്കുന്നു; വലുപ്പമോ ആകൃതിയോ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וַיַּשְׁלֶךְ שָׁמָּה
  choice: അവിടെ എറിഞ്ഞു
  rationale: ക്രിയയുടെ സാധാരണ അർഥവും സ്ഥലദിശ സൂചിപ്പിക്കുന്ന שָׁמָּה എന്ന പദവും ലളിതമായി സംരക്ഷിക്കുന്നു.
- source_word: וַיָּצֶף הַבַּרְזֶל
  choice: ഇരുമ്പ് പൊങ്ങിക്കിടന്നു
  rationale: ഇരുമ്പ് വെള്ളത്തിൽ പൊങ്ങിനിന്ന അത്ഭുതസംഭവം നേരിട്ട് വ്യക്തമാക്കുന്നു; ‘ഉപരിതലത്തിലേക്ക് ഉയർന്നു’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
- source_word: הַבַּרְזֶל
  choice: ഇരുമ്പ്
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘ഇരുമ്പ്’ നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ ഇരുമ്പുകൊണ്ടുള്ള കോടാലിത്തലയാണെന്ന സന്ദർഭവിവരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വിവരണത്തിലെ അത്ഭുതപ്രവൃത്തി
  choice: ‘ഇരുമ്പ് പൊങ്ങിക്കിടന്നു’ എന്ന് സംഭവം നേരിട്ട് അവതരിപ്പിച്ചു.
  alternative: ‘ഇരുമ്പ് ജലോപരിതലത്തിലേക്കു വന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം.
  rationale: മൂലവിവരണം സംഭവത്തെ അത്ഭുതമായി ലളിതമായി പ്രസ്താവിക്കുന്നു. വിവർത്തനം അതിനെ സ്വാഭാവിക കാരണത്തിലേക്ക് ചുരുക്കുകയോ അധികമായി അലങ്കരിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ സംഭവക്രമം ചെറുവാക്യങ്ങളിലൂടെ വ്യക്തമായി നിലനിർത്തി; അടിക്കുറിപ്പിന്റെ സൂചകം വിശദീകരിക്കപ്പെടുന്ന ‘ഇരുമ്പ്’ എന്ന പദത്തിനോടു ചേർത്തു.
