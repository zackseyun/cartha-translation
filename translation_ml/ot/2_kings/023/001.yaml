id: 2KI.23.1
reference: 2 Kings 23:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֖ח הַ/מֶּ֑לֶךְ וַ/יַּאַסְפ֣וּ אֵלָ֔י/ו כָּל זִקְנֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/001.yaml
  text: Then the king sent[a], and all the elders of Judah and Jerusalem were gathered to him.
translation:
  language: ml
  text: അപ്പോൾ രാജാവ് ആളയച്ചു[a]; യെഹൂദയിലെയും യെരൂശലേമിലെയും എല്ലാ മൂപ്പന്മാരും അവന്റെ അടുക്കൽ വന്നുകൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “അപ്പോൾ രാജാവ് യെഹൂദയിലെയും യെരൂശലേമിലെയും എല്ലാ മൂപ്പന്മാരെയും വിളിച്ചുവരുത്താൻ ആളയച്ചു; അവർ അവന്റെ അടുക്കൽ വന്നുകൂടി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ചു
  rationale: שׁלח എന്ന ക്രിയയ്ക്ക് ഇവിടെ ദൂതന്മാരെ അയയ്ക്കുകയോ വിളിച്ചുവരുത്താൻ സന്ദേശം നൽകുകയോ ചെയ്തുവെന്ന അർഥമാണ്. പ്രത്യക്ഷ കർമം എബ്രായത്തിൽ ഇല്ലാത്തതിനാൽ ആരെ വിളിപ്പിച്ചു എന്ന് മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ആളയച്ചു’ എന്നു നൽകി.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിതത്വസൂചകത്തോടുകൂടിയ പദം. സന്ദർഭത്തിൽ യോശീയാവാണെങ്കിലും മൂലവാക്യം പദവിയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ അതുതന്നെ നിലനിർത്തി.
- source_word: וַיַּאַסְפוּ אֵלָיו
  choice: അവന്റെ അടുക്കൽ വന്നുകൂടി
  rationale: ക്രിയ സജീവ ബഹുവചനത്തിലാണ്—‘അവർ കൂടിവന്നു’. മുൻപിലുള്ള ‘എല്ലാ മൂപ്പന്മാരും’ സ്വാഭാവികമായി കർത്താവാകുന്നതിനാൽ മലയാളത്തിലും സജീവരൂപം നിലനിർത്തി; אֶל സൂചിപ്പിക്കുന്ന അവന്റെ അടുക്കലേക്കുള്ള ചലനവും ‘വന്നുകൂടി’ വ്യക്തമാക്കുന്നു.
- source_word: כָּל
  choice: എല്ലാ
  rationale: സമൂഹത്തിന്റെ സമഗ്രത സൂചിപ്പിക്കുന്ന സാധാരണ മലയാള പരിഭാഷ.
- source_word: זִקְנֵי
  choice: മൂപ്പന്മാർ
  rationale: ഇവിടെ വെറും പ്രായമായ പുരുഷന്മാരെയല്ല, അംഗീകൃത സാമൂഹിക-ഭരണ നേതൃത്വത്തിലുള്ളവരെയാണ് ഉദ്ദേശിക്കുന്നത്; ‘മൂപ്പന്മാർ’ അതിന് യോജിച്ച സ്ഥാപിത പ്രയോഗമാണ്.
- source_word: יְהוּדָה
  choice: യെഹൂദ
  rationale: രാജ്യത്തിന്റെയും പ്രദേശത്തിന്റെയും പേരായുള്ള മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: וִירוּשָׁלִָם
  choice: യെരൂശലേം
  rationale: തലസ്ഥാനനഗരത്തിന്റെ പേരായുള്ള മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം; ‘യെഹൂദയിലെയും ... യെരൂശലേമിലെയും’ എന്ന രൂപം ഇരിടങ്ങളിൽനിന്നുമുള്ള മൂപ്പന്മാരെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ സജീവ ബഹുവചന ക്രിയ നിലനിർത്തിക്കൊണ്ട്, ‘അവന്റെ അടുക്കൽ’ എന്ന ദിശാഭാവവും പ്രകടമാക്കി. മുഖ്യവാക്യത്തിന്റെ സംക്ഷിപ്തത സംരക്ഷിക്കുകയും സന്ദർഭസൂചിതമായ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
