- from: അവനു മുമ്പ് അവനെപ്പോലെ ഒരു രാജാവും ഉണ്ടായിരുന്നില്ല; മോശെയുടെ ന്യായപ്രമാണം മുഴുവനും അനുസരിച്ച്, പൂർണഹൃദയത്തോടും പൂർണമനസ്സോടും പൂർണശക്തിയോടുംകൂടെ യഹ്‌വേയിലേക്കു തിരിഞ്ഞ[a] ഒരു രാജാവ്. അവനുശേഷവും അവനെപ്പോലെ ഒരാൾ ഉണ്ടായില്ല.[b]
  to: അവനുമുമ്പ്, മോശെയുടെ ന്യായപ്രമാണം മുഴുവനും അനുസരിച്ച് പൂർണഹൃദയത്തോടും പൂർണാത്മാവോടും പൂർണശക്തിയോടുംകൂടെ യഹ്‌വേയിലേക്കു തിരിഞ്ഞ[a] അവനെപ്പോലെയുള്ള ഒരു രാജാവും ഉണ്ടായിരുന്നില്ല.[b][c] അവനുശേഷവും അവനെപ്പോലെ ഒരു രാജാവും ഉണ്ടായില്ല.
