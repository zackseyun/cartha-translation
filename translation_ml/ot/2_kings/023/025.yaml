source:
  edition: WLC
  text: וְ/כָמֹ/הוּ֩ לֹֽא הָיָ֨ה לְ/פָנָ֜י/ו מֶ֗לֶךְ אֲשֶׁר שָׁ֤ב אֶל יְהוָה֙ בְּ/כָל לְבָב֤/וֹ וּ/בְ/כָל נַפְשׁ/וֹ֙ וּ/בְ/כָל מְאֹד֔/וֹ כְּ/כֹ֖ל תּוֹרַ֣ת מֹשֶׁ֑ה וְ/אַחֲרָ֖י/ו לֹֽא קָ֥ם כָּמֹֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/025.yaml
  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
translation:
  language: ml
  text: അവനുമുമ്പ്, മോശെയുടെ ന്യായപ്രമാണം മുഴുവനും അനുസരിച്ച് പൂർണഹൃദയത്തോടും പൂർണാത്മാവോടും പൂർണശക്തിയോടുംകൂടെ യഹ്‌വേയിലേക്കു തിരിഞ്ഞ[a] അവനെപ്പോലെയുള്ള ഒരു രാജാവും ഉണ്ടായിരുന്നില്ല.[b][c] അവനുശേഷവും അവനെപ്പോലെ ഒരു രാജാവും ഉണ്ടായില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേയിലേക്കു മടങ്ങിവന്ന.” എബ്രായ ക്രിയയ്ക്ക് അനുതാപത്തോടെയും ഉടമ്പടി-വിശ്വസ്തതയോടെയും ദൈവത്തിലേക്കു മടങ്ങുക എന്ന അർത്ഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: “പൂർണഹൃദയത്തോടും പൂർണാത്മാവോടും പൂർണശക്തിയോടുംകൂടെ” എന്ന പ്രയോഗം ആവർത്തനം 6:5-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: “പൂർണശക്തി” എന്നതിന് അഥവാ, “പൂർണകരുത്ത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָמֹהוּ לֹא הָיָה לְפָנָיו מֶלֶךְ
  choice: അവനു മുമ്പ് അവനെപ്പോലെ ഒരു രാജാവും ഉണ്ടായിരുന്നില്ല
  rationale: മുൻപുണ്ടായിരുന്ന രാജാക്കന്മാരിൽ യോശീയാവിന്റെ അതുല്യത ഊന്നിപ്പറയുന്ന മുൻനിര താരതമ്യം സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁב אֶל יְהוָה
  choice: യഹ്‌വേയിലേക്കു തിരിഞ്ഞ
  rationale: שׁוב എന്ന ക്രിയയുടെ ദിശാമാറ്റവും ദൈവത്തോടുള്ള ഉടമ്പടി-വിശ്വസ്തതയിലേക്കുള്ള മടങ്ങിവരവും ഉൾക്കൊള്ളുന്ന വിധത്തിൽ, അനുതാപം എന്ന് മാത്രം പരിമിതപ്പെടുത്താതെ പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּכָל לְבָבוֹ וּבְכָל נַפְשׁוֹ וּבְכָל מְאֹדוֹ
  choice: പൂർണഹൃദയത്തോടും പൂർണമനസ്സോടും പൂർണശക്തിയോടുംകൂടെ
  rationale: ആവർത്തിക്കുന്ന בְּכָל എന്ന സമഗ്രതയുടെ ഊന്നൽ ഓരോ ഘടകത്തിലും സൂക്ഷിച്ചു. נֶפֶשׁ ഇവിടെ മുഴുവൻ വ്യക്തിയെയും ജീവാത്മക സ്വത്വത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘മനസ്സ്’ തെരഞ്ഞെടുത്തു; מְאֹד സമ്പൂർണ ശേഷിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ശക്തി’ എന്നു നൽകി.
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  choice: മോശെയുടെ ന്യായപ്രമാണം മുഴുവനും അനുസരിച്ച്
  rationale: תּוֹרָהയുടെ ‘ഉപദേശം/നിയമം’ എന്ന അർത്ഥവ്യാപ്തിയിൽ, ഈ രാജകീയ വിലയിരുത്തൽ സന്ദർഭത്തിലെ മോശൈക നിയമസമാഹാരത്തെ വ്യക്തമാക്കാൻ പരിചിതമായ ‘ന്യായപ്രമാണം’ ഉപയോഗിച്ചു.
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  choice: അവനുശേഷവും അവനെപ്പോലെ ഒരാൾ ഉണ്ടായില്ല
  rationale: קָם എന്നതിന്റെ സന്ദർഭോചിതമായ ‘പ്രത്യക്ഷപ്പെടുക/ഉണ്ടാകുക’ എന്ന അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി; എബ്രായത്തിൽ രണ്ടാമത്തെ ഘടകത്തിൽ ‘രാജാവ്’ ആവർത്തിക്കാത്തത് പോലെ ഇവിടെ ‘ഒരാൾ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ആവർത്തനം 6:5-ലെ ഉടമ്പടി-ഭക്തിയുടെ പ്രതിധ്വനി
  choice: ‘പൂർണഹൃദയം… പൂർണമനസ്സ്… പൂർണശക്തി’ എന്ന ത്രയം പ്രധാനപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘മുഴുഹൃദയം… മുഴുദേഹം/ജീവൻ… മുഴുകഴിവ്’
  rationale: വാക്കുകളുടെ കൃത്യമായ അർത്ഥവ്യാപ്തി മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ടുതന്നെ, പൂർണസമർപ്പണത്തെ സൂചിപ്പിക്കുന്ന ത്രിഭാഗ ഘടനയും ആവർത്തനത്തിന്റെ പ്രതിധ്വനിയും സംരക്ഷിച്ചു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിച്ചു.
- issue: ശׁוב എന്ന ക്രിയയിലെ ഉടമ്പടി-മടങ്ങിവരവും അനുതാപവും
  choice: യഹ്‌വേയിലേക്കു തിരിഞ്ഞ
  alternative: യഹ്‌വേയിലേക്കു മടങ്ങിവന്ന; യഹ്‌വേയുടെ മുമ്പാകെ അനുതപിച്ച
  rationale: ‘തിരിഞ്ഞ’ എന്നത് ദിശാമാറ്റവും വിശ്വസ്തതയിലേക്കുള്ള മടങ്ങിവരവും ഒരുപോലെ അനുവദിക്കുന്നു; ‘അനുതപിച്ചു’ എന്നു മാത്രം നൽകുന്നത് മൂലത്തിലെ ബന്ധപരമായ അർത്ഥത്തെ അനാവശ്യമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായത്തിലെ താരതമ്യഘടനയും സമഗ്രത സൂചിപ്പിക്കുന്ന ആവർത്തനവും സംരക്ഷിച്ചുകൊണ്ട് അസ്വാഭാവിക പദാനുപദക്രമം ഒഴിവാക്കി.
