source:
  edition: WLC
  text: וַ/יַּמְלֵךְ֩ פַּרְעֹ֨ה נְכֹ֜ה אֶת אֶלְיָקִ֣ים בֶּן יֹאשִׁיָּ֗הוּ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יְהוֹאָחָ֣ז לָקָ֔ח וַ/יָּבֹ֥א מִצְרַ֖יִם וַ/יָּ֥מָת שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
translation:
  language: ml
  text: ഫറവോൻ നെഖോ യോശീയാവിന്റെ മകനായ എല്യാക്കീമിനെ അവന്റെ അപ്പനായ യോശീയാവിന്റെ സ്ഥാനത്ത് രാജാവാക്കി; അവന്റെ പേര് യെഹോയാക്കീം എന്നു മാറ്റി. എന്നാൽ യെഹോവാഹാസിനെ അവൻ കൊണ്ടുപോയി. യെഹോവാഹാസ് ഈജിപ്തിൽ എത്തി[a], അവിടെവെച്ചു മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഈജിപ്തിലേക്കു വന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: രാജാവാക്കി
  rationale: 'ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥം നിലനിർത്തുന്നു: നെഖോ എല്യാക്കീമിനെ രാജാവായി സ്ഥാപിച്ചു.'
- source_word: תַּחַת
  choice: സ്ഥാനത്ത്
  rationale: രാജാവകാശത്തിന്റെ ഈ സന്ദർഭത്തിൽ ഒരാളുടെ പകരം മറ്റൊരാൾ അധികാരമേൽക്കുന്നതാണ് അർഥം.
- source_word: אָבִיו
  choice: അവന്റെ അപ്പനായ
  rationale: പ്രത്യയം എല്യാക്കീമിനെയാണ് സൂചിപ്പിക്കുന്നത്; യോശീയാവ് അവന്റെ അപ്പനാണെന്ന ബന്ധം മൂലപാഠംപോലെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: അവന്റെ പേര് ... എന്നു മാറ്റി
  rationale: പേര് മാറ്റുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: יְהוֹיָקִים
  choice: യെഹോയാക്കീം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְאֶת־יְהוֹאָחָז לָקָח
  choice: എന്നാൽ യെഹോവാഹാസിനെ അവൻ കൊണ്ടുപോയി
  rationale: לָקָח എന്ന സാധാരണ ‘എടുക്കുക/കൊണ്ടുപോകുക’ എന്ന ക്രിയയെ സന്ദർഭോചിതമായി നൽകുന്നു; ‘പിടികൂടി’ എന്നു പരിഭാഷപ്പെടുത്തി തടവിലാക്കൽ അതിയായി വ്യക്തമാക്കുന്നത് ഒഴിവാക്കി.
- source_word: וַיָּבֹא מִצְרַיִם
  choice: യെഹോവാഹാസ് ഈജിപ്തിൽ എത്തി
  rationale: എബ്രായത്തിൽ സർവനാമവിഷയം മാത്രമാണെങ്കിലും മുൻപുള്ള കർമമായ യെഹോവാഹാസാണ് തുടർന്നുള്ള ക്രിയകളുടെ സ്വാഭാവിക വിഷയം. ‘എത്തി’ എന്നത് വന്നു/പോയി എന്ന ദൃഷ്ടികോണവ്യത്യാസം നിർബന്ധമായി തീർപ്പാക്കാതെ ലക്ഷ്യസ്ഥാനത്തെത്തിയതിനെ സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു.
- source_word: וַיָּמָת שָׁם
  choice: അവിടെവെച്ചു മരിച്ചു
  rationale: ഹ്രസ്വവും ശക്തവുമായ മൂലവാക്യത്തിന്റെ സമാപനം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന ‘യോശീയാവ്’ മൂലപാഠംപോലെ നിലനിർത്തി. അവസാന രണ്ടു ക്രിയകളുടെ വിഷയം ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാക്കാൻ ‘യെഹോവാഹാസ്’ വീണ്ടും ചേർത്തു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ സ്ഥാനവും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുണ്ടായതിനാൽ അവ പകർത്താതെ, എബ്രായത്തിലെ וַיָּבֹא എന്ന രൂപത്തെ സംബന്ധിക്കുന്ന പ്രസക്തമായ അടിക്കുറിപ്പ് മാത്രം ശരിയായ സ്ഥാനത്ത് ചേർത്തു.
