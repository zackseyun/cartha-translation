base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ ചോദിച്ചു: “ഞാൻ കാണുന്ന ആ സ്മാരകചിഹ്നം[a] എന്താണ്?” നഗരത്തിലെ ആളുകൾ അവനോടു പറഞ്ഞു: “അത് യെഹൂദയിൽനിന്നു വന്ന്, ബേഥേലിലെ യാഗപീഠത്തിനെതിരെ നീ ചെയ്ത ഈ കാര്യങ്ങൾ പ്രഖ്യാപിച്ച[b] ദൈവപുരുഷന്റെ കല്ലറയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അടയാളം,” “സ്മാരകശില,” അല്ലെങ്കിൽ “കല്ലറയുടെ അടയാളക്കല്ല്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: '“വിളിച്ചുപറഞ്ഞ” അല്ലെങ്കിൽ “എതിരെ വിളിച്ചുപറഞ്ഞ” എന്നും പരിഭാഷപ്പെടുത്താം; ഈ ക്രിയ ദൈവപുരുഷൻ യാഗപീഠത്തെക്കുറിച്ചു നടത്തിയ പ്രവാചകപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു (കാണുക: 1 രാജാക്കന്മാർ 13:1–2).'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיּוּן
  choice: സ്മാരകചിഹ്നം
  rationale: കാണാവുന്ന ഒരു അടയാളത്തെയോ സ്മാരകശിലയെയോ, ഈ സന്ദർഭത്തിൽ കല്ലറയെ തിരിച്ചറിയിക്കുന്ന ചിഹ്നത്തെയോ സൂചിപ്പിക്കുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: הַלָּז
  choice: ആ
  rationale: കാണുന്ന ഒരു വസ്തുവിലേക്കു വിരൽചൂണ്ടുന്ന എബ്രായ നിർദേശകപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֲנִי רֹאֶה
  choice: ഞാൻ കാണുന്ന
  rationale: എബ്രായ പങ്കാളിക്രിയയുടെ വർത്തമാനകാല ദൃശ്യസന്ദർഭം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַקֶּבֶר
  choice: കല്ലറ
  rationale: അടയാളപ്പെടുത്തിയ സംസ്കാരസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: എബ്രായത്തിലെ സ്ഥിരമായ ബഹുമാനപദവി പ്രവാചകൻ എന്നു ചുരുക്കിവ്യാഖ്യാനിക്കാതെ സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: מִיהוּדָה
  choice: യെഹൂദയിൽനിന്ന്
  rationale: ഭൂമിശാസ്ത്രപരമായ ഉത്ഭവം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְרָא
  choice: പ്രഖ്യാപിച്ച
  rationale: യാഗപീഠത്തെക്കുറിച്ചുള്ള പരസ്യമായ പ്രവാചകപ്രസ്താവനയുടെ ശക്തി നൽകുന്നു; എന്നാൽ മൂലപാഠത്തിലില്ലാത്ത വിശദാംശങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ഈ കാര്യങ്ങൾ
  rationale: പ്രഖ്യാപിച്ച വാക്കുകളെയും അവ സൂചിപ്പിക്കുന്ന സംഭവങ്ങളെയും ഉൾക്കൊള്ളാവുന്ന എബ്രായപ്രയോഗത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: നീ ചെയ്ത
  rationale: യോശീയാവിന്റെ പ്രവൃത്തികളെ നേരിട്ടും സ്വാഭാവികമായും അഭിസംബോധന ചെയ്യുന്നു.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനെതിരെ
  rationale: പശ്ചാത്തലത്തിലെ അപലപനവും നശീകരണവും കണക്കിലെടുത്ത് עַל എന്നതിന്റെ വിരുദ്ധദിശയിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
theological_decisions:
- issue: ഇവിടെ ഓർമിപ്പിക്കപ്പെടുന്ന പ്രവാചകപ്രഖ്യാപനത്തിന്റെ സ്വഭാവം
  choice: വַיִּקְרָא എന്ന ക്രിയയെ “പ്രഖ്യാപിച്ച” എന്നു പരിഭാഷപ്പെടുത്തി പ്രവാചകപ്രസ്താവനയുടെ സ്വഭാവം നിലനിർത്തി.
  alternative: “വിളിച്ചുപറഞ്ഞ” അല്ലെങ്കിൽ “എതിരെ വിളിച്ചുപറഞ്ഞ”
  rationale: വാക്യം ബേഥേലിലെ യാഗപീഠത്തിനെതിരായ മുൻപ്രവചനത്തെ സൂചിപ്പിക്കുന്നു. “പ്രഖ്യാപിച്ച” എന്നത് ആ പ്രവാചകധ്വനി വ്യക്തമാക്കുമ്പോഴും 1 രാജാക്കന്മാർ 13-ൽനിന്നുള്ള അധികവിശദാംശങ്ങൾ ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം ഉപയോഗിച്ചു. “ദൈവപുരുഷൻ,” “യാഗപീഠം” എന്നീ ബൈബിൾപരമായ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
