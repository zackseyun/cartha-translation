  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
translation:
  language: ml
  text: യഹോവയുടെ ആലയത്തിലുണ്ടായിരുന്ന പുരുഷ ക്ഷേത്രവേശ്യകളുടെ പാർപ്പിടങ്ങൾ അവൻ ഇടിച്ചുകളഞ്ഞു.[a] അവിടെ സ്ത്രീകൾ അശേരയ്ക്കുവേണ്ടി തൂക്കുവിരികൾ നെയ്തിരുന്നു.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം പുരുഷലിംഗ ബഹുവചനമാണ്; അനധികൃത ആരാധനാചാരങ്ങളിലെ ലൈംഗികപ്രവർത്തനത്തിൽ ഏർപ്പെട്ടിരുന്ന പുരുഷന്മാരെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘തൂക്കുവിരികൾ’ എന്നതിനു പിന്നിലെ എബ്രായനാമം പദശഃ ‘വീടുകൾ’ എന്നാണ്. അശേരയ്ക്കുവേണ്ടി നെയ്ത തൂക്കുവിരികളെയോ ആവരണങ്ങളെയോ കൂടാരസദൃശ ആരാധനാസംവിധാനങ്ങളെയോ ഇത് സൂചിപ്പിച്ചിരിക്കാം.
    reason: alternative_reading
  - marker: c
    text: ‘അശേര’ എന്നത് അശേരാദേവിയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  choice: അവൻ ഇടിച്ചുകളഞ്ഞു
  rationale: נתץ എന്ന ക്രിയ കെട്ടിടങ്ങളെയോ നിർമിതികളെയോ പൊളിച്ചുകളയുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ശക്തിയും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: בָּתֵּי
  choice: പാർപ്പിടങ്ങൾ
  rationale: പദശഃ ‘വീടുകൾ’ എന്നാണെങ്കിലും ആലയപരിസരത്തിലെ മുറികളെയോ താമസസ്ഥലങ്ങളെയോ ഉദ്ദേശിക്കുന്നതിനാൽ ‘പാർപ്പിടങ്ങൾ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: הַקְּדֵשִׁים
  choice: പുരുഷക്ഷേത്രവേശ്യകൾ
  rationale: പുരുഷലിംഗ ബഹുവചനമായ ഈ പദം ഇവിടെ അനധികൃത ആരാധനാചാരങ്ങളോടു ബന്ധപ്പെട്ട പുരുഷ ലൈംഗികപ്രവർത്തകരെ സൂചിപ്പിക്കുന്നു; ലിംഗസൂചന മറയ്ക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: בְּבֵית יְהוָה
  choice: യഹോവയുടെ ആലയത്തിൽ
  rationale: ‘യഹോവയുടെ ഭവനം’ എന്ന പദശഃ രൂപത്തേക്കാൾ ആധുനിക മലയാളത്തിൽ ‘ആലയം’ സ്വാഭാവികമാണ്; ദൈവനാമം യഹോവ എന്ന് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַנָּשִׁים אֹרְגוֹת שָׁם
  choice: അവിടെയാണ് സ്ത്രീകൾ ... നെയ്ത് ... ഉണ്ടാക്കിയിരുന്നത്
  rationale: സ്ത്രീകളുടെ തുടർച്ചയായ നെയ്ത്തുപ്രവൃത്തിയും שָׁם എന്ന സ്ഥലസൂചനയും നിലനിർത്തുന്നു.
- source_word: בָּתִּים
  choice: വസ്ത്രഗൃഹങ്ങൾ
  rationale: പദശഃ ‘വീടുകൾ’ എന്ന രൂപവും നെയ്തുണ്ടാക്കിയവയെന്ന സന്ദർഭസൂചനയും ഒരുമിച്ച് സംരക്ഷിക്കുന്ന ഉദ്ദേശപൂർവമായ സംയുക്തപദം; കൃത്യമായ വസ്തുവിനെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לָאֲשֵׁרָה
  choice: അശേരയ്ക്കുവേണ്ടി
  rationale: അശേര എന്നത് ദേവിയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാം; പ്രധാനപാഠം രണ്ടിലൊന്നായി നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: אֲשֵׁרָה എന്നതിന്റെ അർഥം
  choice: അശേര
  alternative: അശേരാദേവി / അശേരാപ്രതിഷ്ഠ
  rationale: പദം ദേവിയെയോ അവളോടു ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാവുന്നതിനാൽ പ്രധാനപാഠത്തിൽ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: הַקְּדֵשִׁים എന്നതിലെ ലിംഗസൂചന
  choice: പുരുഷക്ഷേത്രവേശ്യകൾ
  alternative: ക്ഷേത്രവേശ്യകൾ / സമർപ്പിതർ
  rationale: എബ്രായരൂപം പുരുഷലിംഗ ബഹുവചനമാണ്; ‘സമർപ്പിതർ’ എന്ന പദശഃ പരിഭാഷ സന്ദർഭത്തിലെ നിഷേധാത്മക ആരാധനാചാരാർഥം മറച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ആവർത്തനഭാരം ഒഴിവാക്കാതെ രണ്ട് വാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചു; വിവാദമായ ആരാധനാപദങ്ങളുടെ അവ്യക്തത അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
