translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ധനശേഖരണത്തിലെ നിർബന്ധത്തിന്റെ ഭാവം സൂക്ഷിച്ചിരിക്കുന്നു. ‘മൂല്യനിർണയം’ എന്ന പദത്തിന്റെ ആവർത്തനം ഒഴിവാക്കാൻ ആദ്യ ക്രിയയിൽ സന്ദർഭാനുസൃതമായ ‘നികുതി ചുമത്തി’ ഉപയോഗിച്ചു; യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്. എല്ലാ ഉപയോഗിച്ച അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു; നെഖോയുടെ ലിപ്യന്തരവിവരം മാത്രം മുഖ്യപാഠത്തെ ബാധിക്കാത്തതിനാൽ [c] ചിഹ്നം ‘നെഖോ’വിന് ചേർക്കേണ്ടതാണ്.
