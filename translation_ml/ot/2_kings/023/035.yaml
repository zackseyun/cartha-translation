  naturalness: ‘ഓരോരുത്തരുടെയും മൂല്യനിർണയമനുസരിച്ച്’ എന്ന പ്രയോഗം വ്യക്തിയുടെ മൂല്യം നിർണയിച്ചതുപോലെ കേൾക്കാം. നികുതി-സന്ദർഭത്തിൽ ‘ഓരോരുത്തർക്കും നിശ്ചയിച്ച കണക്കനുസരിച്ച്’ വ്യക്തിഗത വിലയിരുത്തൽ/വിഹിതം എന്ന ആശയം കൂടുതൽ സ്വാഭാവികമായി നൽകുന്നു. ‘ദേശം’ എന്നതിനു പകരം ‘ദേശത്തെ ജനങ്ങൾ’ ആധുനിക സാധാരണ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
