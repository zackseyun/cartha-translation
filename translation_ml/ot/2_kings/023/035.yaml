  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
translation:
  language: ml
  text: യെഹോയാക്കീം വെള്ളിയും സ്വർണവും ഫറവോന് കൊടുത്തു. എന്നാൽ ഫറവോന്റെ കൽപ്പനപ്രകാരം വെള്ളി കൊടുക്കേണ്ടതിന് അവൻ ദേശത്തിന്മേൽ നികുതി ചുമത്തി[a]. ദേശത്തെ ജനങ്ങളിൽനിന്ന്, ഓരോരുത്തർക്കും നിശ്ചയിച്ച കണക്കനുസരിച്ച്[b], വെള്ളിയും സ്വർണവും ഈടാക്കി ഫറവോൻ നെഖോവിന് കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശത്തെ വിലയിരുത്തി’ അല്ലെങ്കിൽ ‘ദേശത്തിന്മേൽ ഒരു വിഹിതം ചുമത്തി.’ പണം നൽകുന്നതിനായി ഒരു സാമ്പത്തിക ബാധ്യത നിശ്ചയിക്കുന്നതിനെ ഹീബ്രു ക്രിയ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഓരോരുത്തരുടെയും വിലയിരുത്തലിനനുസരിച്ച്’; കൂടുതൽ വ്യാഖ്യാനാത്മകമായി, ‘ഓരോരുത്തരുടെയും സാമ്പത്തികശേഷിയനുസരിച്ച്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱרִיךְ
  choice: ദേശത്തിന്മേൽ നികുതി ചുമത്തി
  rationale: ഹിഫീൽ രൂപവും പണം നൽകുന്ന സന്ദർഭവും ദേശത്തിന്മേൽ സാമ്പത്തിക ബാധ്യത ചുമത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നികുതി ചുമത്തി’ എന്നത് ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘മൂല്യനിർണയം നടത്തി’ എന്ന കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַל פִּי פַרְעֹה
  choice: ഫറവോന്റെ കല്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഫറവോന്റെ വായനുസരിച്ച്’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ രാജകല്പനയെയോ ഉത്തരവിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: אִישׁ כְּעֶרְכּוֹ
  choice: ഓരോരുത്തരുടെയും മൂല്യനിർണയമനുസരിച്ച്
  rationale: വ്യക്തിവ്യക്തിയായി നിശ്ചയിച്ച തുകയെന്ന ആശയം മൂലപദത്തോട് ചേർന്ന് നിലനിർത്തുന്നു; ‘സാമ്പത്തികശേഷിയനുസരിച്ച്’ എന്നത് സാധ്യമെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: נָגַשׂ
  choice: നിർബന്ധമായി പിരിച്ചെടുത്തു
  rationale: വെറും ‘പിരിച്ചെടുത്തു’ എന്നതിലുപരി സമ്മർദപൂർവമായ ഈടാക്കലിന്റെ ധ്വനി ക്രിയയ്ക്കുണ്ട്.
- source_word: עַם הָאָרֶץ
  choice: ദേശത്തിലെ ജനങ്ങൾ
  rationale: സാമൂഹിക-രാഷ്ട്രീയ സാങ്കേതിക അർഥം നിർബന്ധമായി ആരോപിക്കാതെ ഹീബ്രു പ്രയോഗത്തിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു.
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  choice: വെള്ളിയും സ്വർണവും
  rationale: വെള്ളി നാണയമായി പ്രവർത്തിച്ചിരിക്കാമെങ്കിലും, മൂലപാഠം വിലയേറിയ ലോഹങ്ങളെ നേരിട്ട് പേരെടുത്ത് പറയുന്നു; സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: פַרְעֹה נְכֹה
  choice: ഫറവോൻ നെഖോ
  rationale: ഹീബ്രു പേരിന്റെ മലയാള ലിപ്യന്തരണം; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
