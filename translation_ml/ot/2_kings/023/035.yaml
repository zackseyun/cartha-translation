  to: യെഹോയാക്കീം വെള്ളിയും സ്വർണവും ഫറവോന് കൊടുത്തു. എന്നാൽ ഫറവോന്റെ കൽപ്പനപ്രകാരം വെള്ളി കൊടുക്കേണ്ടതിന് അവൻ ദേശത്തിന്മേൽ നികുതി ചുമത്തി[a]. ദേശത്തെ ജനങ്ങളിൽനിന്ന്, ഓരോരുത്തർക്കും നിശ്ചയിച്ച കണക്കനുസരിച്ച്[b], വെള്ളിയും സ്വർണവും ഈടാക്കി ഫറവോൻ നെഖോവിന് കൊടുത്തു.
