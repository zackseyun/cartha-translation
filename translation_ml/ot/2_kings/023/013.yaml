source:
  edition: WLC
  text: וְֽ/אֶת הַ/בָּמ֞וֹת אֲשֶׁ֣ר עַל פְּנֵ֣י יְרוּשָׁלִַ֗ם אֲשֶׁר֮ מִ/ימִ֣ין לְ/הַר הַ/מַּשְׁחִית֒ אֲשֶׁ֣ר בָּ֠נָה שְׁלֹמֹ֨ה מֶֽלֶךְ יִשְׂרָאֵ֜ל לְ/עַשְׁתֹּ֣רֶת שִׁקֻּ֣ץ צִידֹנִ֗ים וְ/לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם תּוֹעֲבַ֣ת בְּנֵֽי עַמּ֑וֹן טִמֵּ֖א הַ/מֶּֽלֶךְ־׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
translation:
  language: ml
  text: യെരൂശലേമിന് എതിർവശത്തുള്ള[a] നാശത്തിന്റെ മലയുടെ[b] വലതുവശത്തുള്ള[d] ഉന്നത ആരാധനാസ്ഥലങ്ങളെ രാജാവ് അശുദ്ധമാക്കി. ഇസ്രായേലിന്റെ രാജാവായ ശലോമോൻ അവ പണിതത് സീദോന്യരുടെ അറപ്പായ അസ്തോരെത്തിനും, മോവാബിന്റെ അറപ്പായ കെമോശിനും, അമ്മോന്യരുടെ അറപ്പായ മിൽക്കോമിനും[c] വേണ്ടിയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘യെരൂശലേമിന്റെ മുമ്പിൽ’; ഈ സ്ഥലസൂചന ‘യെരൂശലേമിന് കിഴക്ക്’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘നാശത്തിന്റെ മല’; ഇത് പിന്നീട് ഒലിവുമല എന്നു തിരിച്ചറിയപ്പെട്ട കുന്നായിരിക്കാം.
    reason: cross_reference
  - marker: c
    text: എബ്രായപാഠത്തിൽ ‘മിൽക്കോം’; ചിലർ ഈ ദേവനെ ‘മോലെക്ക്’ എന്ന പേരുമായി ബന്ധപ്പെടുത്തുന്നു.
    reason: alternative_reading
  - marker: d
    text: ‘വലതുവശത്ത്’ എന്ന എബ്രായ ദിശാപ്രയോഗം, കിഴക്കോട്ട് മുഖംതിരിച്ചുള്ള ദിശാഭിമുഖ്യത്തിൽ, ‘തെക്കുവശത്ത്’ എന്ന് അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: പൂജാഗിരികൾ
  rationale: ആരാധനയ്ക്കായി ഉപയോഗിച്ചിരുന്ന ഉയർന്ന സ്ഥലങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. വെറും ‘ഉയർന്ന സ്ഥലങ്ങൾ’ എന്നതിനെക്കാൾ അതിന്റെ ആരാധനാസംബന്ധിയായ അർഥം ‘പൂജാഗിരികൾ’ വ്യക്തമാക്കുന്നു.
- source_word: עַל פְּנֵי יְרוּשָׁלִַם
  choice: യെരൂശലേമിന് അഭിമുഖമായി
  rationale: ‘മുമ്പിൽ/അഭിമുഖമായി’ എന്ന സ്ഥാനബന്ധം നിലനിർത്തുകയും ‘കിഴക്ക്’ എന്ന് മുഖ്യപാഠത്തിൽ തീർച്ചപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מִימִין לְהַר הַמַּשְׁחִית
  choice: നാശത്തിന്റെ മലയുടെ വലതുവശത്ത്
  rationale: മൂലപാഠത്തിലെ ‘വലത്’ എന്ന ദിശാപദം നേരിട്ട് നിലനിർത്തുന്നു; ഭൂപ്രദേശപരമായ ദിശാഭിമുഖ്യം മൂലം ‘തെക്ക്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַר הַמַּשְׁחִית
  choice: നാശത്തിന്റെ മല
  rationale: പദപ്രയോഗത്തിലെ നിന്ദാസൂചന നിലനിർത്തുന്നു; ഒലിവുമല എന്ന് മുഖ്യപാഠത്തിൽ സമീകരിക്കുന്നില്ല.
- source_word: לְעַשְׁתֹּרֶת
  choice: അസ്തോരെത്തിനും
  rationale: എബ്രായ രൂപത്തോട് ചേർന്ന ദേവനാമ ലിപ്യന്തരണം.
- source_word: שִׁקֻּץ צִידֹנִים
  choice: സീദോന്യരുടെ അറപ്പായ
  rationale: വിദേശാരാധനയെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ ശക്തമായ നിന്ദാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִכְמוֹשׁ
  choice: കെമോശിനും
  rationale: ദേവനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: שִׁקֻּץ מוֹאָב
  choice: മോവാബിന്റെ അറപ്പായ
  rationale: ആവർത്തിക്കുന്ന എബ്രായ പദത്തിന് സമാനമായ മലയാളപ്രയോഗം നൽകി.
- source_word: לְמִלְכֹּם
  choice: മിൽക്കോമിനും
  rationale: മസോററ്റിക് പാഠത്തിലെ മിൽക്കോം എന്ന പേരിനെ മോലെക്കുമായി മുഖ്യപാഠത്തിൽ കലർത്തുന്നില്ല.
- source_word: תּוֹעֲבַת בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ മ്ലേച്ഛതയായ
  rationale: മൂലത്തിലെ വ്യത്യസ്തമായെങ്കിലും സമാന ശക്തിയുള്ള നിന്ദാപദത്തെ ‘മ്ലേച്ഛത’ എന്നു നൽകി, ‘അമ്മോന്റെ മക്കൾ’ എന്ന വംശനാമം സ്വാഭാവികമായി ‘അമ്മോന്യർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: טִמֵּא
  choice: അശുദ്ധമാക്കി
  rationale: ആ ആരാധനാസ്ഥലങ്ങൾ ഉപയോഗശൂന്യമാക്കുന്ന ആചാരപരമായ അശുദ്ധീകരണമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ യോശീയാവാണെങ്കിലും മൂലവാക്യം ഉപയോഗിക്കുന്ന സ്ഥാനപ്പേര് തന്നെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിദേശദേവതകൾക്കുള്ള നിന്ദാസൂചക വിശേഷണങ്ങൾ
  choice: ‘അറപ്പ്’, ‘മ്ലേച്ഛത’ എന്നീ ശക്തമായ നിന്ദാപദങ്ങൾ നിലനിർത്തുക
  alternative: ‘വിഗ്രഹം’ അല്ലെങ്കിൽ ‘ദേവത’ എന്ന നിഷ്പക്ഷ പദം മാത്രം ഉപയോഗിക്കുക
  rationale: שִׁקּוּץ, תּוֹעֵבָה എന്നീ പദങ്ങളിലെ ഉദ്ദേശ്യപൂർവമായ മതപരമായ അപലപനം മൃദൂകരിക്കരുത്; അതേസമയം അവയെ നിർബന്ധമായി ഒരു പ്രതിമയായി വ്യാഖ്യാനിക്കുന്നതും ഒഴിവാക്കുന്നു.
- issue: הַר הַמַּשְׁחִית എന്ന സ്ഥലനാമത്തിന്റെ തിരിച്ചറിയൽ
  choice: ‘നാശത്തിന്റെ മല’ എന്നു പരിഭാഷപ്പെടുത്തുക
  alternative: ‘ഒലിവുമല’ എന്നു പകരംവയ്ക്കുക
  rationale: മൂലപാഠത്തിലെ നിന്ദാസൂചനയുള്ള പേര് നിലനിർത്തുന്നു; സാധ്യതയുള്ള ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു.
- issue: മിൽക്കോമും മോലെക്കും തമ്മിലുള്ള ബന്ധം
  choice: മുഖ്യപാഠത്തിൽ ‘മിൽക്കോം’ നിലനിർത്തുക
  alternative: ‘മോലെക്ക്’ എന്നു വായിക്കുക
  rationale: മസോററ്റിക് പാഠം മിൽക്കോം എന്നാണ് വായിക്കുന്നത്; ചരിത്രപരമോ വ്യാഖ്യാനപരമോ ആയ ബന്ധം പാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നീണ്ട എബ്രായവാക്യം വ്യക്തതയ്ക്കായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ബന്ധങ്ങളും ആവർത്തനവും നിലനിർത്തി. ദേവനാമങ്ങൾ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; നിന്ദാസൂചക മതഭാഷ മൃദൂകരിച്ചില്ല.
