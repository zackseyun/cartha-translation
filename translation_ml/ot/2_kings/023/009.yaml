id: 2KI.23.9
reference: 2 Kings 23:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֗ךְ לֹ֤א יַֽעֲלוּ֙ כֹּהֲנֵ֣י הַ/בָּמ֔וֹת אֶל מִזְבַּ֥ח יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם כִּ֛י אִם אָכְל֥וּ מַצּ֖וֹת בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/009.yaml
  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
translation:
  language: ml
  text: എന്നിരുന്നാലും, പൂജാമേടുകളിലെ പുരോഹിതന്മാർ[a] യെരൂശലേമിലുള്ള യഹ്‌വേയുടെ[b] യാഗപീഠത്തിലേക്കു കയറിച്ചെന്നില്ല; മറിച്ച് അവർ തങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽ[c] പുളിപ്പില്ലാത്ത അപ്പം കഴിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലപാഠത്തിലെ പ്രയോഗം ‘പൂജാമേടുപുരോഹിതന്മാർ’ എന്നും ചുരുക്കി പരിഭാഷപ്പെടുത്താം. ഇവിടെ പ്രാദേശിക പൂജാസ്ഥലങ്ങളിലെ പുരോഹിതന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ദൈവനാമം YHWH എന്നാണ്; പരമ്പരാഗതമായി ഇത് ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: alternative_reading
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘തങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽ’; സന്ദർഭത്തിൽ ഇത് അവരുടെ സഹപുരോഹിതന്മാരെയോ പുരോഹിതബന്ധുക്കളെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പരിഷ്കരണനടപടികൾക്ക് ഒരു പരിമിതിയോ അപവാദമോ അവതരിപ്പിക്കുന്ന വിരുദ്ധഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יַעֲלוּ
  choice: കയറിച്ചെന്നില്ല
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറിപ്പോകുക’ എന്ന അടിസ്ഥാനാർത്ഥവും യെരൂശലേമിലേക്കും യാഗപീഠത്തിലേക്കും പോകുന്നതിലെ ദിശാഭാവവും നിലനിർത്തുന്നു.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: പൂജാമേടുകളിലെ പുരോഹിതന്മാർ
  rationale: במות എന്നത് പ്രാദേശിക ആരാധനാകേന്ദ്രങ്ങളെയോ പൂജാസ്ഥലങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘പൂജാമേടുകൾ’ ഉയർന്ന സ്ഥലമെന്ന രൂപകവും ആരാധനാസന്ദർഭവും ഒരുമിച്ചു നൽകുന്നു.
- source_word: מִזְבַּח יְהוָה
  choice: യഹ്‌വേയുടെ യാഗപീഠം
  rationale: എബ്രായ സംയുക്തബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כִּי אִם
  choice: എങ്കിലും
  rationale: അവർ യെരൂശലേമിലെ യാഗപീഠത്തിലേക്കു കയറിച്ചെന്നില്ല എന്നതും അപ്പം ഭക്ഷിച്ചു എന്നതും തമ്മിലുള്ള വൈരുധ്യം മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; ‘അല്ലാതെ/മാത്രം’ എന്ന നിയന്ത്രണഭാവവും സന്ദർഭത്തിൽ സാദ്ധ്യമാണെന്നത് അംഗീകരിക്കുന്നു.
- source_word: אָכְלוּ מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം ഭക്ഷിച്ചു
  rationale: מַצּוֹת എന്ന പദത്തിന്റെ സാധാരണ ആചാരപരമായ അർത്ഥം വ്യക്തവും പരിചിതവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: തങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽ
  rationale: ‘അവരുടെ സഹോദരന്മാരുടെ മധ്യേ’ എന്ന എബ്രായപ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭം സഹപുരോഹിതന്മാരെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും മൂലപാഠത്തിൽ ‘പുരോഹിതന്മാർ’ വീണ്ടും ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: אֲחֵיהֶם എന്ന പുരുഷലിംഗ ബഹുവചന ബന്ധുപദം
  choice: തങ്ങളുടെ സഹോദരന്മാർ
  alternative: തങ്ങളുടെ സഹപുരോഹിതന്മാർ / ബന്ധുക്കൾ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ബന്ധുപദം സംരക്ഷിക്കുന്നു; അത് സഹപുരോഹിതന്മാരെയോ പുരോഹിതകുടുംബാംഗങ്ങളെയോ സൂചിപ്പിക്കുന്നുവെന്ന സന്ദർഭനിഗമനം മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
- issue: כִּי אִם എന്ന ഘടനയുടെ വൈരുധ്യ-നിയന്ത്രണഭാവം
  choice: എങ്കിലും
  alternative: അല്ലാതെ / മറിച്ച് / ഭക്ഷിക്കുകയേ ചെയ്തുള്ളൂ
  rationale: അവർ യാഗപീഠത്തിലേക്കു കയറിപ്പോയില്ലെങ്കിലും പുരോഹിതസമൂഹത്തിനുള്ളിൽ പുളിപ്പില്ലാത്ത അപ്പം ഭക്ഷിച്ചു എന്ന വൈരുധ്യം മുൻനിർത്തുന്നു; ‘മാത്രം’ എന്ന കൂടുതൽ നിയന്ത്രിത വായനയെ നിർബന്ധമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘പൂജാമേട്’, ‘യാഗപീഠം’, ‘പുളിപ്പില്ലാത്ത അപ്പം’ എന്നീ പദങ്ങൾ ആരാധനാസന്ദർഭം വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിലെ ബന്ധുപദവും ദൈവനാമവും പരമാവധി സംരക്ഷിച്ചിട്ടുണ്ട്.
