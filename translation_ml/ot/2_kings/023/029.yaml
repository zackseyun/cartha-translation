  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
translation:
  language: ml
  text: അവന്റെ കാലത്ത് ഈജിപ്തിലെ രാജാവായ ഫറവോൻ നെക്കോ[a] അശ്ശൂർരാജാവിനെതിരെ യൂഫ്രട്ടീസ് നദിയിലേക്ക് കയറിച്ചെന്നു. യോശീയാരാജാവ് അവനെ കാണാൻ ചെന്നു[b][c]; അവൻ അവനെ കണ്ടപ്പോൾ മെഗിദ്ദോയിൽവെച്ച് കൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: നെക്കോ; പരമ്പരാഗതമായി ‘നെഖോ’ എന്നും എഴുതാറുണ്ട്.'
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ വ്യക്തമായി വ്യാഖ്യാനിച്ചാൽ: ‘യോശീയാവ് അവനെ കാണാൻ ചെന്നപ്പോൾ ഫറവോൻ നെക്കോ യോശീയാവിനെ മെഗിദ്ദോയിൽവെച്ച് കൊന്നു.’ ഹീബ്രുവിൽ മൂന്നാം പുരുഷ സർവനാമങ്ങൾ അവ്യക്തമാണ്.'
    reason: alternative_reading
  - marker: c
    text: യോശീയാവിന്റെ മരണത്തെക്കുറിച്ചുള്ള സമാന്തര വിവരണത്തിന് 2 ദിനവൃത്താന്തം 35:20–24 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: בְּיָמָיו
  choice: അവന്റെ കാലത്ത്
  rationale: യോശീയാവിന്റെ ഭരണകാലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עָלָה
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്നതിന്റെ അടിസ്ഥാനമായ ‘കയറിപ്പോകുക’ എന്ന ഭാവവും സൈനിക മുന്നേറ്റത്തിന്റെ സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: פַרְעֹה נְכֹה
  choice: ഫറവോൻ നെക്കോ
  rationale: ഹീബ്രു നാമരൂപത്തോട് ചേർന്ന ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- source_word: עַל מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവിനെതിരെ
  rationale: സൈനിക സന്ദർഭത്തിൽ עלה ... על എന്ന ഘടനയുടെ സ്വാഭാവിക അർഥം ‘എതിരെ മുന്നേറുക’ എന്നാണ്; ചരിത്രപരമായ വ്യത്യസ്ത വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: עַל נְהַר פְּרָת
  choice: യൂഫ്രട്ടീസ് നദിവരെ
  rationale: ഇവിടെ രണ്ടാമത്തെ על ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לִקְרָאתוֹ
  choice: അവനെ നേരിടാൻ
  rationale: לקראת എന്നത് സന്ദർഭത്തിൽ നേരിൽ ചെന്നുകാണുക/എതിരിടുക എന്ന ഇരുവശവും ഉൾക്കൊള്ളാം; ‘നേരിടാൻ’ ഏറ്റുമുട്ടലിന്റെ പശ്ചാത്തലം സൂചിപ്പിച്ചാലും ഉദ്ദേശ്യം അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: וַיְמִיתֵהוּ
  choice: അവൻ അവനെ ... കൊന്നു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപമായ ‘മരിപ്പിക്കുക’ എന്ന അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു; സർവനാമങ്ങളുടെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: בִּמְגִדּוֹ
  choice: മെഗിദ്ദോയിൽവെച്ച്
  rationale: സംഭവസ്ഥലത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: כִּרְאֹתוֹ אֹתוֹ
  choice: അവൻ അവനെ കണ്ടപ്പോൾ
  rationale: രണ്ട് മൂന്നാംപുരുഷ ഏകവചന പുൽലിംഗ സർവനാമങ്ങളുടെയും സൂചിത വ്യക്തികൾ ആരെന്ന ഹീബ്രുവിലെ അവ്യക്തത അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യങ്ങളിലെ മൂന്നാംപുരുഷ സർവനാമങ്ങളുടെ അവ്യക്തത
  choice: ‘അവൻ അവനെ കണ്ടപ്പോൾ ... കൊന്നു’ എന്ന സർവനാമരൂപം നിലനിർത്തി
  alternative: ‘യോശീയാവ് അവനെ നേരിടാൻ ചെന്നപ്പോൾ ഫറവോൻ നെക്കോ യോശീയാവിനെ മെഗിദ്ദോയിൽവെച്ച് കൊന്നു’ എന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: ഹീബ്രു വാക്യത്തിൽ കർത്താവും കർമവും സർവനാമങ്ങളാൽ സംക്ഷിപ്തമായി വരുന്നതിനാൽ വ്യാകരണപരമായ അവ്യക്തതയുണ്ട്. 2 ദിനവൃത്താന്തം 35:20–24-ലെ സമാന്തരവിവരണം പരിഗണിച്ചുള്ള വ്യക്തീകരണം അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു; മുഖ്യപാഠം സംഘർഷം പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. സംയുക്ത രാജപദങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രീതിയിൽ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ സർവനാമാവ്യക്തത മുഖ്യപാഠത്തിൽ മനഃപൂർവം സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ എല്ലാം പാഠത്തിൽ ഉൾപ്പെടുത്തി.
