translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. രാജഭരണസൂത്രത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട് ആവർത്തനം ഒഴിവാക്കാൻ വാക്യങ്ങൾ സ്വാഭാവികമായി ക്രമപ്പെടുത്തി.
