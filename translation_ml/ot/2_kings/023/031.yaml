id: 2KI.23.31
reference: 2 Kings 23:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/שָׁלֹ֤שׁ שָׁנָה֙ יְהוֹאָחָ֣ז בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֣ה חֳדָשִׁ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ חֲמוּטַ֥ל בַּֽת יִרְמְיָ֖הוּ מִ/לִּבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/031.yaml
  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: ml
  text: യെഹോവാഹാസ് രാജാവായപ്പോൾ അവന് ഇരുപത്തിമൂന്ന് വയസ്സായിരുന്നു. അവൻ യെരൂശലേമിൽ മൂന്നുമാസം ഭരിച്ചു. അവന്റെ അമ്മയുടെ പേര് ഹമൂതൽ എന്നായിരുന്നു; അവൾ ലിബ്നക്കാരനായ യിരെമ്യാവിന്റെ മകളായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: അവന് ഇരുപത്തിമൂന്ന് വയസ്സായിരുന്നു
  rationale: ഹീബ്രായ പ്രായപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: പ്രത്യയത്തോടുകൂടിയ ക്രിയാനാമരൂപം അധികാരാരോഹണത്തിന്റെ സമയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ
  choice: മൂന്നുമാസം ഭരിച്ചു
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഹീബ്രായ പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: ഭരണസ്ഥലം സൂചിപ്പിക്കുന്ന ലളിതമായ സ്ഥലവാചകമാണ്.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് ... എന്നായിരുന്നു
  rationale: രാജാക്കന്മാരിലെ പതിവ് മാതൃനാമസൂത്രം അർഥം സംരക്ഷിച്ച് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חֲמוּטַל
  choice: ഹമൂതൽ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בַּת יִרְמְיָהוּ
  choice: യിരെമ്യാവിന്റെ മകൾ
  rationale: בַּת സൂചിപ്പിക്കുന്ന പിതൃപുത്രി ബന്ധം നേരിട്ട് നൽകുന്നു; പേര് ഹീബ്രായ രൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണത്തിലാണ്.
- source_word: מִלִּבְנָה
  choice: ലിബ്നക്കാരനായ
  rationale: מן ഇവിടെ യിരെമ്യാവിന്റെ സ്വദേശമോ സ്ഥലബന്ധമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തിയെ സ്ഥലത്തോടു ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക രൂപം ഉപയോഗിച്ചു.
