id: 2KI.23.5
reference: 2 Kings 23:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִשְׁבִּ֣ית אֶת הַ/כְּמָרִ֗ים אֲשֶׁ֤ר נָֽתְנוּ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/יְקַטֵּ֤ר בַּ/בָּמוֹת֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/מְסִבֵּ֖י יְרוּשָׁלִָ֑ם וְ/אֶת הַֽ/מְקַטְּרִ֣ים לַ/בַּ֗עַל לַ/שֶּׁ֤מֶשׁ וְ/לַ/יָּרֵ֨חַ֙ וְ/לַ/מַּזָּל֔וֹת וּ/לְ/כֹ֖ל צְבָ֥א הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
translation:
  language: ml
  text: യെഹൂദയിലെ നഗരങ്ങളിലും യെരൂശലേമിന്റെ ചുറ്റുപാടുകളിലുമുള്ള ഉന്നത ആരാധനാസ്ഥലങ്ങളിൽ ധൂപം അർപ്പിക്കാൻ യെഹൂദാരാജാക്കന്മാർ നിയമിച്ചിരുന്ന പുരോഹിതന്മാരെ[a] അവൻ നീക്കിക്കളഞ്ഞു. ബാലിനും സൂര്യനും ചന്ദ്രനും നക്ഷത്രരാശികൾക്കും[b] ആകാശത്തിലെ സകല സൈന്യത്തിനും[c] ധൂപം അർപ്പിച്ചിരുന്നവരെയും അവൻ നീക്കിക്കളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “വിഗ്രഹാരാധനാപുരോഹിതന്മാർ” അല്ലെങ്കിൽ “അന്യദേവാരാധനാപുരോഹിതന്മാർ.” എബ്രായപദം സാധാരണ യഹോവയുടെ നിയമാനുസൃത പുരോഹിതന്മാരിൽനിന്നു വേറിട്ട, അനധികൃത ആരാധനയുമായി ബന്ധപ്പെട്ട പുരോഹിതരെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “രാശിചിഹ്നങ്ങൾ.” എബ്രായപദം നക്ഷത്രക്കൂട്ടങ്ങളെയോ ജ്യോതിഷരാശികളെയോ സൂചിപ്പിച്ചേക്കാം.'
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: “ആകാശത്തിലെ സകല സൈന്യം.” ഇവിടെ ഈ പ്രയോഗം ആരാധിക്കപ്പെട്ട ആകാശഗോളങ്ങളെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהִשְׁבִּית
  choice: അവൻ നീക്കിക്കളഞ്ഞു
  rationale: שׁבת എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ പ്രവർത്തനം അവസാനിപ്പിക്കുക അഥവാ സ്ഥാനത്തുനിന്ന് നീക്കുക എന്ന ആശയം നൽകുന്നു. യോശീയാവിന്റെ പരിഷ്കാരനടപടിയുടെ പശ്ചാത്തലത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്; കൊല്ലുകയായിരുന്നുവെന്ന് അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: הַכְּמָרִים
  choice: അന്യദേവപുരോഹിതന്മാർ
  rationale: כְּמָרִים സാധുവായ യഹോവാപുരോഹിതന്മാരെയല്ല, അനധികൃതമോ അന്യദേവാരാധനയോടു ബന്ധപ്പെട്ടതോ ആയ പുരോഹിതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അന്യദേവപുരോഹിതന്മാർ’ ആ വ്യത്യാസം വ്യക്തമാക്കുന്നു; പദത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാർ നിയമിച്ചിരുന്ന
  rationale: ഈ ഘടനയിലെ נתן നിയമിക്കുക അഥവാ സ്ഥാനമേൽപ്പിക്കുക എന്നർഥമാണ്. മുൻകാലത്ത് നടന്ന നിയമനത്തെ ‘നിയമിച്ചിരുന്ന’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיְקַטֵּר / הַמְקַטְּרִים
  choice: ധൂപം അർപ്പിക്കാൻ / ധൂപം അർപ്പിച്ചിരുന്നവർ
  rationale: קטר ധൂപമോ പുകയുയരുന്ന വഴിപാടോ അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കാം. ആരാധനാസന്ദർഭത്തിൽ ‘ധൂപം അർപ്പിക്കുക’ വ്യക്തവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: בַּבָּמוֹת
  choice: പൂജാഗിരികളിൽ
  rationale: בָּמוֹת പ്രാദേശിക ആരാധനാകേന്ദ്രങ്ങളായ ‘ഉന്നതസ്ഥലങ്ങൾ’ സൂചിപ്പിക്കുന്നു. ‘പൂജാഗിരികൾ’ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഇവിടെ സ്ഥലത്തിന്റെയും ആരാധനയുടെയും ഭാവം ഒരുമിച്ച് നൽകുന്നതുമാണ്.
- source_word: בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם
  choice: യെഹൂദാനഗരങ്ങളിലെയും യെരൂശലേമിന്റെ ചുറ്റുപാടുകളിലെയും
  rationale: מְסִבֵּי യെരൂശലേമിനെ ചുറ്റിയുള്ള പ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്നു. സമാന്തര സ്ഥലബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
- source_word: לַבַּעַל
  choice: ബാൽദേവന്
  rationale: בעל ഇവിടെ ആരാധിക്കപ്പെട്ട ദേവന്റെ പേരാണ്. മലയാളവായനയിൽ സൂര്യൻ, ചന്ദ്രൻ എന്നിവയോടൊപ്പം വ്യക്തതയ്ക്കായി ‘ദേവൻ’ ചേർത്തിരിക്കുന്നു.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: സൂര്യനും ചന്ദ്രനും
  rationale: ആരാധനയുടെ വ്യത്യസ്ത ലക്ഷ്യങ്ങളായ സൂര്യനെയും ചന്ദ്രനെയും പട്ടികയുടെ ഭാഗമായി വ്യക്തമായി നൽകുന്നു.
- source_word: וְלַמַּזָּלוֹת
  choice: നക്ഷത്രരാശികൾക്ക്
  rationale: מַזָּלוֹת നക്ഷത്രക്കൂട്ടങ്ങളെയോ രാശിചിഹ്നങ്ങളെയോ സൂചിപ്പിച്ചേക്കാം. ‘നക്ഷത്രരാശികൾ’ ആവശ്യത്തിലധികം കൃത്യത അവകാശപ്പെടാതെ സാധ്യതയുള്ള അർഥം നൽകുന്നു.
- source_word: וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: ആകാശത്തിലെ സകല സൈന്യത്തിനും
  rationale: ഇത് എബ്രായത്തിലെ സ്ഥിരപ്രയോഗത്തിന്റെ രൂപകസ്വഭാവം നിലനിർത്തുന്നു. ഈ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് ആരാധിക്കപ്പെട്ട ആകാശഗോളങ്ങളാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: כְּמָרִים എന്ന പദം നിഷ്പക്ഷമായി ‘പുരോഹിതന്മാർ’ എന്നു മാത്രം നൽകണമോ, അനധികൃത ആരാധനയുമായുള്ള ബന്ധം വ്യക്തമാക്കണമോ
  choice: അന്യദേവപുരോഹിതന്മാർ
  alternative: പുരോഹിതന്മാർ; വിഗ്രഹാരാധനാപുരോഹിതന്മാർ
  rationale: രാജാക്കന്മാരുടെ പുസ്തകങ്ങളിലെ പ്രയോഗവും യോശീയാവിന്റെ ആരാധനാശുദ്ധീകരണസന്ദർഭവും ഈ പുരോഹിതന്മാർ യഹോവയുടെ അംഗീകൃത പുരോഹിതന്മാരല്ലെന്ന് കാണിക്കുന്നു. ‘അന്യദേവപുരോഹിതന്മാർ’ ആ വ്യത്യാസം നൽകുന്നു; ‘വിഗ്രഹാരാധന’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു.
- issue: צְבָא הַשָּׁמָיִם ആത്മീയ ദൂതസൈന്യമോ ആകാശഗോളങ്ങളുടെ നിരയോ എന്നു വ്യാഖ്യാനിക്കേണ്ട വിധം
  choice: ആകാശത്തിലെ സകല സൈന്യം; ഈ സന്ദർഭത്തിൽ ആകാശഗോളങ്ങൾ എന്നു അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു
  alternative: ആകാശഗോളങ്ങളെല്ലാം
  rationale: മുഖ്യവാചകം എബ്രായ രൂപകം നിലനിർത്തുന്നു; എന്നാൽ ജ്യോതിഷാരാധനയുടെ പട്ടികയായ ഈ സന്ദർഭം ഉദ്ദേശിക്കുന്നത് ആകാശഗോളങ്ങളാണെന്ന് അടിക്കുറിപ്പ് തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ ശൈലി. ദീർഘമായ എബ്രായവാക്യം വ്യക്തതയ്ക്കായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; രണ്ടാമത്തെ വാക്യത്തിൽ ക്രിയ ആവർത്തിച്ചെങ്കിലും പട്ടികയുടെ ഏകതയും അർഥവും നിലനിർത്തി. ‘പൂജാഗിരികൾ’, ‘ധൂപം അർപ്പിക്കുക’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ സ്വാഭാവികമായ വാക്യഘടനയിൽ ഉപയോഗിച്ചു.
