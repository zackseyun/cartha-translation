revisions:
- from: യെഹൂദാനഗരങ്ങളിലെയും യെരൂശലേമിന്റെ ചുറ്റുപാടുകളിലെയും പൂജാഗിരികളിൽ ധൂപം അർപ്പിക്കാൻ യെഹൂദാരാജാക്കന്മാർ നിയമിച്ചിരുന്ന അന്യദേവപുരോഹിതന്മാരെ[a] അവൻ നീക്കിക്കളഞ്ഞു. ബാൽദേവനും സൂര്യനും ചന്ദ്രനും നക്ഷത്രരാശികൾക്കും[b] ആകാശത്തിലെ സകല സൈന്യത്തിനും[c] ധൂപം അർപ്പിച്ചിരുന്നവരെയും അവൻ നീക്കിക്കളഞ്ഞു.
  to: യെഹൂദയിലെ നഗരങ്ങളിലും യെരൂശലേമിന്റെ ചുറ്റുപാടുകളിലുമുള്ള ഉന്നത ആരാധനാസ്ഥലങ്ങളിൽ ധൂപം അർപ്പിക്കാൻ യെഹൂദാരാജാക്കന്മാർ നിയമിച്ചിരുന്ന പുരോഹിതന്മാരെ[a] അവൻ നീക്കിക്കളഞ്ഞു. ബാലിനും സൂര്യനും ചന്ദ്രനും നക്ഷത്രരാശികൾക്കും[b] ആകാശത്തിലെ സകല സൈന്യത്തിനും[c] ധൂപം അർപ്പിച്ചിരുന്നവരെയും അവൻ നീക്കിക്കളഞ്ഞു.
  rationale: മൂലപാഠം വ്യക്തമാക്കാത്ത അന്യദേവാരാധനയെ ആദ്യ പുരോഹിതസംഘത്തിനു നേരിട്ട് ആരോപിക്കുന്നത് ഒഴിവാക്കി. ബാൽ എന്ന ദേവനാമത്തിലെ വിശദീകരണകൂട്ടിച്ചേർക്കൽ നീക്കി; ബാമോത്ത് എന്ന സാങ്കേതിക സ്ഥലപദം ആധുനിക മലയാളത്തിൽ കൂടുതൽ വ്യക്തമായി പരിഭാഷപ്പെടുത്തി. ശേഷിക്കുന്ന വാക്യഘടനയും അടിക്കുറിപ്പുകളും മൂലപാഠത്തിലെ പട്ടിക, ആവർത്തിച്ചുള്ള ആരാധനാലക്ഷ്യങ്ങൾ, അർഥപരമായ അനിശ്ചിതത്വം എന്നിവ സംരക്ഷിക്കുന്നു.
