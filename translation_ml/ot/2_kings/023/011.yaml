source:
  edition: WLC
  text: וַ/יַּשְׁבֵּ֣ת אֶת הַ/סּוּסִ֗ים אֲשֶׁ֣ר נָתְנוּ֩ מַלְכֵ֨י יְהוּדָ֤ה לַ/שֶּׁ֨מֶשׁ֙ מִ/בֹּ֣א בֵית יְהוָ֔ה אֶל לִשְׁכַּת֙ נְתַן מֶ֣לֶךְ הַ/סָּרִ֔יס אֲשֶׁ֖ר בַּ/פַּרְוָרִ֑ים וְ/אֶת מַרְכְּב֥וֹת הַ/שֶּׁ֖מֶשׁ שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
translation:
  language: ml
  text: യെഹൂദാരാജാക്കന്മാർ സൂര്യനു സമർപ്പിച്ചിരുന്ന കുതിരകളെ, യഹ്‌വെയുടെ ആലയത്തിന്റെ പ്രവേശനസ്ഥലം മുതൽ പുറംപരിസരങ്ങളിലുള്ള[b] രാജകൊട്ടാര ഉദ്യോഗസ്ഥനായ[a] നെഥൻ-മെലെക്കിന്റെ മുറിവരെ, അവൻ നീക്കിക്കളഞ്ഞു; സൂര്യരഥങ്ങളെ അവൻ തീയിൽ ചുട്ടുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഷണ്ഡൻ.” എബ്രായപദം ഷണ്ഡനെയോ രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “പുറംപരിസരങ്ങൾ” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം അപൂർവമാണ്. അത് ആലയസമുച്ചയത്തിന്റെ പുറംഭാഗത്തെയോ അതിരോടുചേർന്ന മേഖലയെയോ സൂചിപ്പിച്ചേക്കാം; “പുറപ്രദേശങ്ങൾ,” “തൂണുനിരകൾ” എന്നീ പരിഭാഷകളും നിർദേശിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  choice: നീക്കിക്കളഞ്ഞു
  rationale: שׁבת എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ‘പ്രവർത്തനം നിർത്തിച്ചു/ഇല്ലാതാക്കി’ എന്നർഥം നൽകുന്നു. ആരാധനാസംബന്ധമായ ഉപയോഗത്തിൽനിന്ന് കുതിരകളെ ഒഴിവാക്കിയതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘നീക്കിക്കളഞ്ഞു’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ
  choice: യെഹൂദാരാജാക്കന്മാർ സൂര്യനു സമർപ്പിച്ചിരുന്ന
  rationale: נתן എന്നത് അക്ഷരാർഥത്തിൽ ‘കൊടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ സൂര്യാരാധനയുമായി ബന്ധപ്പെട്ട കുതിരകളെ ആരാധനയ്ക്കായി നീക്കിവെച്ചതാണെന്ന സന്ദർഭം ‘സമർപ്പിച്ചിരുന്ന’ എന്ന പ്രയോഗം കൃത്യമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ഉച്ചാരണസമീപമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מִבֹּא בֵית יְהוָה אֶל לִשְׁכַּת נְתַן מֶלֶךְ
  choice: യഹ്‌വെയുടെ ആലയത്തിന്റെ പ്രവേശനസ്ഥലം മുതൽ ... നെഥൻ-മെലെക്കിന്റെ മുറിവരെയുള്ള ഭാഗത്ത്
  rationale: מִן...אֶל എന്ന സ്ഥലസൂചനയുടെ ആരംഭ-അവസാന ഘടന നിലനിർത്തുന്നു. മലയാളത്തിൽ സ്ഥാനം വ്യക്തമായി പറയാൻ വാക്യം രണ്ടായി വിഭജിച്ചു.
- source_word: הַסָּרִיס
  choice: രാജസേവകൻ
  rationale: סָרִיס എന്ന പദത്തിന് രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥൻ എന്നും ഷണ്ഡൻ എന്നും അർഥമാകാം. വ്യക്തിയുടെ ശാരീരികനില അനാവശ്യമായി ഉറപ്പിക്കാതെ ഔദ്യോഗികപങ്ക് സൂചിപ്പിക്കുന്ന പൊതുവായ രൂപം സ്വീകരിച്ചു; മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: בַּפַּרְוָרִים
  choice: പുറംപരിസരങ്ങളിൽ
  rationale: അപൂർവമായ ഈ സ്ഥലനാമപദം ആലയസമുച്ചയത്തിന്റെ പുറംഭാഗമോ അതിരോടുചേർന്ന മേഖലയോ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. ഉറപ്പില്ലായ്മ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: מַרְכְּבוֹת הַשֶּׁמֶשׁ
  choice: സൂര്യരഥങ്ങൾ
  rationale: സൂര്യാരാധനയുമായി ബന്ധപ്പെട്ട രഥങ്ങൾ എന്ന എബ്രായ രൂപകം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׂרַף בָּאֵשׁ
  choice: തീയിൽ ചുട്ടുകളഞ്ഞു
  rationale: എബ്രായത്തിലെ ‘തീകൊണ്ട്/തീയിൽ ചുട്ടു’ എന്ന ഊന്നൽ മലയാളത്തിലും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വന്നിരിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരിച്ചു. ‘യഹ്‌വെ’ എന്ന രൂപം സാധാരണ പണ്ഡിതാനുമാനത്തിലുള്ള ഉച്ചാരണത്തോട് കൂടുതൽ അടുത്തതാണ്.
- issue: സൂര്യനെ ദേവനാമമാക്കണമോ എന്നത്
  choice: സൂര്യൻ എന്ന സാധാരണ നാമം
  alternative: സൂര്യദേവൻ
  rationale: הַשֶּׁמֶשׁ സാധാരണ നാമമാണ്; ആരാധനാസന്ദർഭം വ്യക്തമായിരുന്നാലും മൂലപാഠം പറയുന്നതിലധികമായി ഒരു പ്രത്യേക ദേവനാമം ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. നീണ്ട എബ്രായവാക്യം സ്ഥലബന്ധം വ്യക്തമാക്കുന്നതിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ വിശദീകരിക്കുന്ന പദത്തിനോ വാക്യത്തിനോ ചേർത്തിരിക്കുന്നു.
