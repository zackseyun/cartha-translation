  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ֠/יִּזְבַּח אֶת כָּל כֹּהֲנֵ֨י הַ/בָּמ֤וֹת אֲשֶׁר שָׁם֙ עַל הַֽ/מִּזְבְּח֔וֹת וַ/יִּשְׂרֹ֛ף אֶת עַצְמ֥וֹת אָדָ֖ם עֲלֵי/הֶ֑ם וַ/יָּ֖שָׁב יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
translation:
  language: ml
  text: അവിടെയുണ്ടായിരുന്ന ഉന്നത ആരാധനാസ്ഥലങ്ങളിലെ സകല പുരോഹിതന്മാരെയും അവൻ യാഗപീഠങ്ങളുടെമേൽ അറുത്തുകൊന്നു[a]; അവൻ അവയുടെമേൽ മനുഷ്യരുടെ അസ്ഥികൾ ചുട്ടുകളഞ്ഞു. പിന്നെ അവൻ യെരൂശലേമിലേക്കു മടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉന്നത ആരാധനാസ്ഥലങ്ങളിലെ സകല പുരോഹിതന്മാരെയും അവൻ യാഗമായി അറുത്തു.” ഹീബ്രു ക്രിയയ്ക്ക് യാഗമായി അറുക്കുക എന്നും അറുത്തുകൊല്ലുക എന്നും അർഥമാകാം. ഇവിടെ അനധികൃത ആരാധന നീക്കിക്കളയുന്ന സന്ദർഭമായതിനാൽ മുഖ്യപാഠത്തിൽ “അറുത്തുകൊന്നു” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: അറുത്തുകൊന്നു
  rationale: זבח എന്ന ക്രിയയ്ക്ക് യാഗമായി അറുക്കുക എന്നും അറുത്തുകൊല്ലുക എന്നും അർഥമാകാം. ഇവിടെ അനധികൃത ആരാധനാകേന്ദ്രങ്ങൾ നീക്കിക്കളയുന്ന അക്രമാസക്തമായ നടപടിയാണ് സന്ദർഭം; ‘അറുത്തുകൊന്നു’ എന്നത് യാഗസംബന്ധിയായ ധ്വനി പൂർണമായി ഇല്ലാതാക്കാതെ, ഇത് യഹോവയ്ക്കുള്ള അംഗീകൃത യാഗമായിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നതും ഒഴിവാക്കുന്നു.
- source_word: כָּל
  choice: സകല
  rationale: ഒഴിവുകളില്ലാത്ത സമഗ്രത സൂചിപ്പിക്കുന്ന അളവുപദം; മലയാളത്തിലെ ഗൗരവമുള്ള വിവരണശൈലിയിൽ സ്വാഭാവികം.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: പൂജാഗിരികളിലെയും പുരോഹിതന്മാർ
  rationale: במות രാജാക്കന്മാരുടെ പുസ്തകങ്ങളിൽ പ്രാദേശിക ഉയർന്ന ആരാധനാസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. ‘പൂജാഗിരികൾ’ ഉയർന്ന സ്ഥലം എന്ന രൂപകവും ആരാധനാസ്ഥലം എന്ന പ്രവർത്തനവും സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: אֲשֶׁר שָׁם
  choice: അവിടെയുണ്ടായിരുന്ന
  rationale: പുരോഹിതന്മാർ ആ സ്ഥലങ്ങളിൽ സന്നിഹിതരായിരുന്നുവെന്ന സ്ഥലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל הַמִּזְבְּחוֹת
  choice: യാഗപീഠങ്ങളിന്മേൽ
  rationale: עַל എന്നതിന്റെ നേരിട്ടുള്ള സ്ഥലാർഥമായ ‘മേൽ’ നിലനിർത്തുന്നു; തുടർന്ന് അസ്ഥികൾ അവയുടെമേൽ ചുട്ടതുമായ വാക്യബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: וַיִּשְׂרֹף
  choice: ചുട്ടുകളഞ്ഞു
  rationale: שרף എന്ന ക്രിയയുടെ കത്തിച്ചു നശിപ്പിക്കൽ എന്ന ശക്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַצְמוֹת אָדָם
  choice: മനുഷ്യരുടെ അസ്ഥികൾ
  rationale: אָדָם ഇവിടെ പുരുഷനെ പ്രത്യേകമായി അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ബഹുവചന അസ്ഥികളോടു ചേർന്ന ഈ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: עֲלֵיהֶם
  choice: അവയുടെമേൽ
  rationale: ബഹുവചന സർവനാമം ഏറ്റവും സ്വാഭാവികമായി യാഗപീഠങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നിർജീവ ബഹുവചനത്തിന് ‘അവ’ യോജിക്കുന്നു.
- source_word: וַיָּשָׁב יְרוּשָׁלָם
  choice: പിന്നെ അവൻ യെരൂശലേമിലേക്കു മടങ്ങി
  rationale: വാവു-തുടർച്ചയുടെ ആഖ്യാനക്രമം ‘പിന്നെ’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ലക്ഷ്യസ്ഥാനം ‘-ലേക്ക്’ കൊണ്ട് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതന്മാരെ കൊല്ലുന്നതിനെ വിവരിക്കുന്ന וַיִּזְבַּח എന്ന ക്രിയയിലെ യാഗസംബന്ധിയായ സാധ്യത
  choice: ‘യാഗമർപ്പിച്ചു’ എന്നല്ല, ‘അറുത്തുകൊന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തി; പാഠത്തിലെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
  alternative: ‘പൂജാഗിരികളിലെ പുരോഹിതന്മാരെയെല്ലാം അവൻ യാഗമായി അർപ്പിച്ചു.’
  rationale: ഹീബ്രു ക്രിയയ്ക്ക് യാഗമായി അറുക്കുക എന്ന ധ്വനി ഉണ്ടെങ്കിലും, ‘യാഗമായി അർപ്പിച്ചു’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകിയാൽ ഈ പ്രവൃത്തി യഹോവയ്ക്കുള്ള അംഗീകൃത യാഗമായിരുന്നുവെന്ന ആശയം അനാവശ്യമായി വരാം. ‘അറുത്തുകൊന്നു’ ക്രൂരതയും അറുക്കലിന്റെ ധ്വനിയും സൂക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് യഥാർഥമായ ലെക്സിക്കൽ-ദൈവശാസ്ത്രപരമായ സംഘർഷം മറയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘പൂജാഗിരി’, ‘യാഗപീഠം’ തുടങ്ങിയ ചരിത്ര-ആരാധനാപര പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ കഠിനമായ അക്രമഭാഷ മൃദൂകരിച്ചിട്ടില്ല; അതേസമയം പ്രവൃത്തിക്ക് ദൈവിക അംഗീകാരം ഉണ്ടെന്ന വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
