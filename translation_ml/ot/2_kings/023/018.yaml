  text: וַ/יֹּ֨אמֶר֙ הַנִּ֣יחוּ ל֔/וֹ אִ֖ישׁ אַל יָנַ֣ע עַצְמֹתָ֑י/ו וַֽ/יְמַלְּטוּ֙ עַצְמֹתָ֔י/ו אֵ֚ת עַצְמ֣וֹת הַ/נָּבִ֔יא אֲשֶׁר בָּ֖א מִ/שֹּׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/018.yaml
  text: And he said[a], “Leave him alone; let no man disturb his bones.” So they let his bones alone, along with the bones of the prophet who had come from Samaria.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അവനെ അങ്ങനെതന്നെ വിടൂ; ആരും അവന്റെ അസ്ഥികൾ ഇളക്കരുത്.” അങ്ങനെ അവർ അവന്റെ അസ്ഥികളെയും ശമര്യയിൽനിന്ന് വന്ന പ്രവാചകന്റെ അസ്ഥികളെയും രക്ഷിച്ചു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അങ്ങനെ അവർ അവന്റെ അസ്ഥികളെയും ശമര്യയിൽനിന്ന് വന്ന പ്രവാചകന്റെ അസ്ഥികളെയും വെറുതെ വിട്ടു.”'
    reason: וַיְמַלְּטוּ എന്ന ക്രിയ ഇവിടെ അസ്ഥികളെ ‘രക്ഷിച്ചു/ഒഴിവാക്കി’ എന്നോ ‘വെറുതെ വിട്ടു’ എന്നോ സന്ദർഭാനുസൃതമായി അറിയിക്കാം.
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  choice: അവനെ തൊടരുത്
  rationale: മരിച്ചവന്റെ അസ്ഥികൾക്കെതിരെ തുടർനടപടി എടുക്കരുതെന്ന സന്ദർഭോചിതമായ കല്പന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ אַל יָנַע עַצְמֹתָיו
  choice: ആരും അവന്റെ അസ്ഥികൾ ഇളക്കരുത്
  rationale: אִישׁ ഇവിടെ പൊതുവായ നിഷേധത്തിൽ ‘ആരും’ എന്ന അർഥത്തിലാണ്; נוע അസ്ഥികൾ അവയുടെ സ്ഥാനത്തുനിന്ന് നീക്കുകയോ അലോസരപ്പെടുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיְמַלְּטוּ עַצְמֹתָיו
  choice: അവന്റെ അസ്ഥികളും ... അസ്ഥികളും കേടുകൂടാതെ സൂക്ഷിച്ചു
  rationale: פלט/מלט എന്ന ക്രിയയുടെ പിയേൽ രൂപം ഇവിടെ അസ്ഥികളെ നാശത്തിൽനിന്നോ അപമാനത്തിൽനിന്നോ ഒഴിവാക്കി സംരക്ഷിച്ചു എന്ന ആശയം നൽകുന്നു; ‘കേടുകൂടാതെ സൂക്ഷിച്ചു’ അത് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: אֵת עַצְמוֹת הַנָּבִיא
  choice: പ്രവാചകന്റെ അസ്ഥികളും
  rationale: രണ്ടാമത്തെ അസ്ഥിസമൂഹവും ക്രിയയുടെ വസ്തുവാണെന്ന ഹീബ്രു വാക്യഘടന മലയാളത്തിലെ ‘-ഉം ... -ഉം’ സമുച്ചയത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  choice: ശമര്യയിൽനിന്നു വന്ന
  rationale: മുൻപ് നടന്ന വരവിനെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല സംബന്ധക രൂപത്തിൽ നൽകുന്നു; שֹׁמְרוֹן എന്ന സ്ഥലനാമത്തിന് പതിവായ രൂപം ‘ശമര്യ’ ആണ്.
