source:
  edition: WLC
  text: וַ/יִּ֣פֶן יֹאשִׁיָּ֗הוּ וַ/יַּ֨רְא אֶת הַ/קְּבָרִ֤ים אֲשֶׁר שָׁם֙ בָּ/הָ֔ר וַ/יִּשְׁלַ֗ח וַ/יִּקַּ֤ח אֶת הָֽ/עֲצָמוֹת֙ מִן הַ/קְּבָרִ֔ים וַ/יִּשְׂרֹ֥ף עַל הַ/מִּזְבֵּ֖חַ וַֽ/יְטַמְּאֵ֑/הוּ כִּ/דְבַ֣ר יְהוָ֗ה אֲשֶׁ֤ר קָרָא֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר קָרָ֔א אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
translation:
  language: ml
  text: പിന്നെ യോശീയാവ് തിരിഞ്ഞ്, അവിടെയുള്ള മലയിൽ ഉണ്ടായിരുന്ന കല്ലറകൾ[a] കണ്ടു. അവൻ ആളയച്ച് കല്ലറകളിൽനിന്ന് അസ്ഥികൾ എടുപ്പിച്ച് യാഗപീഠത്തിന്മേൽ ചുട്ടു അതിനെ അശുദ്ധമാക്കി. ഈ കാര്യങ്ങൾ വിളിച്ചുപറഞ്ഞ[b] ദൈവപുരുഷൻ പ്രസ്താവിച്ച യഹ്‌വേയുടെ വചനപ്രകാരമായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ശവകുടീരങ്ങൾ’ അല്ലെങ്കിൽ ‘സംസ്കാരസ്ഥലങ്ങൾ.’ എബ്രായപദം പൊതുവായി സംസ്കാരസ്ഥലങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പ്രഖ്യാപിച്ച.’ എബ്രായക്രിയയ്ക്ക് പരസ്യമായി ഉച്ചത്തിൽ വിളിച്ചുപറയുന്ന ഭാവവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: തിരിഞ്ഞ്
  rationale: פנה എന്ന ക്രിയയുടെ സാധാരണമായ ശാരീരിക ചലനാർത്ഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള കാഴ്ചയ്ക്കു മുമ്പുള്ള തിരിവ് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַקְּבָרִים
  choice: കല്ലറകൾ
  rationale: קבר എന്നത് കല്ലറ, ശവകുടീരം, പൊതുവായി സംസ്കാരസ്ഥലം എന്നിവ സൂചിപ്പിക്കാം. മലയാളത്തിൽ ‘കല്ലറകൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; വിശാലമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בָּהָר
  choice: മലമുകളിൽ
  rationale: הַר എന്നത് മല അല്ലെങ്കിൽ കുന്ന് എന്ന വിശാല ഭൂപ്രകൃതിപദമാണ്. ‘മലമുകളിൽ’ സ്ഥലസൂചന സ്വാഭാവികമായി നൽകുന്നു; കുന്ന് എന്ന സാധ്യതയും അടിക്കുറിപ്പിൽ ഉൾപ്പെടുത്തുന്നു.
- source_word: הָעֲצָמוֹת
  choice: അസ്ഥികൾ
  rationale: עצמות എന്നതിന്റെ മൂർത്തവും നേരിട്ടുള്ളതുമായ അർത്ഥം നിലനിർത്തുന്നു; യാഗപീഠം അശുദ്ധമാക്കിയ പ്രവൃത്തിയിൽ മനുഷ്യ അസ്ഥികൾ നിർണായകമാണ്.
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ ചുട്ടുകളഞ്ഞ്
  rationale: അസ്ഥികൾ യാഗപീഠത്തിന്മേൽ ചുട്ടുവെന്ന ഞെട്ടിക്കുന്ന അശുദ്ധീകരണപ്രവൃത്തി വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: וַיְטַמְּאֵהוּ
  choice: അതിനെ അശുദ്ധമാക്കി
  rationale: טמא ആചാരപരമായ അശുദ്ധതയെ സൂചിപ്പിക്കുന്നു. ഏകവചന പ്രത്യയം ഏറ്റവും സ്വാഭാവികമായി അടുത്തുള്ള ‘യാഗപീഠത്തെ’ പരാമർശിക്കുന്നു.
- source_word: כִּדְבַר יְהוָה
  choice: യഹ്‌വേയുടെ വചനപ്രകാരം
  rationale: മുൻപ് നൽകിയ ദൈവിക വചനം നിറവേറിയതെന്ന ബന്ധം സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: എബ്രായത്തിലെ സ്ഥിരമായ പ്രവാചകപദവിയായ ‘ദൈവത്തിന്റെ മനുഷ്യൻ’ എന്ന പ്രയോഗത്തെ മലയാള ബൈബിൾശൈലിയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קָרָא
  choice: പ്രസ്താവിച്ച / വിളിച്ചുപറഞ്ഞ
  rationale: ആദ്യ പ്രയോഗത്തിൽ ‘പ്രസ്താവിച്ച’ എന്നത് ഔദ്യോഗിക പ്രവാചകപ്രഖ്യാപനം നൽകുന്നു; ആവർത്തിച്ച അന്തിമപ്രയോഗത്തിൽ ‘വിളിച്ചുപറഞ്ഞ’ എന്നത് ക്രിയയിലെ പരസ്യവും ഉച്ചത്തിലുള്ളതുമായ വിളിയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ഈ കാര്യങ്ങൾ
  rationale: דברים വാക്കുകളെയോ കാര്യങ്ങളെയോ സൂചിപ്പിക്കാം; ഇവിടെ മുൻകൂട്ടി പറഞ്ഞ് ഇപ്പോൾ സംഭവിച്ച പ്രവൃത്തികളെ ഉൾക്കൊള്ളുന്നതിനാൽ ‘ഈ കാര്യങ്ങൾ’ യോജിക്കുന്നു.
theological_decisions:
- issue: യോശീയാവിന്റെ പ്രവൃത്തിയും മുൻപ്രവചനവും തമ്മിലുള്ള നിറവേറൽബന്ധം
  choice: ‘ദൈവപുരുഷൻ പ്രസ്താവിച്ച യഹ്‌വേയുടെ വചനപ്രകാരമായിരുന്നു അത്’ എന്ന് നൽകി ദൈവവചനം ദൈവപുരുഷൻ മുഖേന പ്രസ്താവിക്കപ്പെട്ടതും ഇപ്പോൾ നിറവേറിയതുമായ ബന്ധം നിലനിർത്തി.
  alternative: ‘ദൈവപുരുഷൻ വിളിച്ചുപറഞ്ഞ യഹ്‌വേയുടെ വചനപ്രകാരം’ എന്ന കൂടുതൽ പദാനുപദ ഘടന.
  rationale: എബ്രായവാക്യത്തിന്റെ ബന്ധവാക്യക്രമം മലയാളത്തിൽ അസ്പഷ്ടമാകാതിരിക്കെ, യഹ്‌വേയുടെ വചനവും അതിന്റെ മനുഷ്യ മധ്യസ്ഥനും തമ്മിലുള്ള ബന്ധം അധിക വ്യാഖ്യാനം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്താൻ ദൈവനാമം ലിപ്യന്തരം ചെയ്തു; ഒരു പൊതുപദവിയാൽ പകരംവെച്ചില്ല.
- issue: וַיְטַמְּאֵהוּ എന്നതിലെ പ്രത്യയത്തിന്റെ സൂചകം
  choice: യാഗപീഠം
  alternative: മുൻസന്ദർഭത്തിലെ വിശാലമായ ആരാധനാസ്ഥലം
  rationale: അടുത്തുള്ള ഏകവചനനാമം യാഗപീഠമാണ്; മനുഷ്യ അസ്ഥികൾ അതിന്മേൽ ചുട്ടതിലൂടെ അതിനെ ആചാരപരമായി അശുദ്ധമാക്കുന്നതാണ് വാക്യത്തിന്റെ നേരിട്ടുള്ള പ്രവാഹം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘യാഗപീഠം,’ ‘ദൈവപുരുഷൻ,’ ‘അശുദ്ധമാക്കി’ എന്നീ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിന്റെ ആചാരപരവും പ്രവാചകപരവുമായ കൃത്യത നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
