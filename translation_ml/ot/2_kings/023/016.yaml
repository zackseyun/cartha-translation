revisions:
- from: പിന്നെ യോശീയാവ് തിരിഞ്ഞ്, അവിടെ മലമുകളിലുണ്ടായിരുന്ന കല്ലറകൾ[a] കണ്ടു. അവൻ ആളയച്ച് കല്ലറകളിൽനിന്ന് അസ്ഥികൾ എടുപ്പിച്ച് യാഗപീഠത്തിന്മേൽ ചുട്ടുകളഞ്ഞ് അതിനെ അശുദ്ധമാക്കി. ഈ കാര്യങ്ങൾ വിളിച്ചുപറഞ്ഞ[b] ദൈവപുരുഷൻ പ്രസ്താവിച്ച യഹ്‌വേയുടെ വചനപ്രകാരമായിരുന്നു അത്.
  to: പിന്നെ യോശീയാവ് തിരിഞ്ഞ്, അവിടെയുള്ള മലയിൽ ഉണ്ടായിരുന്ന കല്ലറകൾ[a] കണ്ടു. അവൻ ആളയച്ച് കല്ലറകളിൽനിന്ന് അസ്ഥികൾ എടുപ്പിച്ച് യാഗപീഠത്തിന്മേൽ ചുട്ടു അതിനെ അശുദ്ധമാക്കി. ഈ കാര്യങ്ങൾ വിളിച്ചുപറഞ്ഞ[b] ദൈവപുരുഷൻ പ്രസ്താവിച്ച യഹ്‌വേയുടെ വചനപ്രകാരമായിരുന്നു അത്.
  rationale: 'The revision narrows the footnote to its actual anchor, avoids specifying that the tombs were on the mountain’s summit, and uses a direct equivalent for ‘burned.’ The final clause continues to preserve the Hebrew’s twofold proclamation language: the man of God proclaimed Yahweh’s word and called out these things.'
  reviewer_model: gpt-5.6-terra
