id: 2KI.23.32
reference: 2 Kings 23:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/032.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that his fathers had done.
translation:
  language: ml
  text: അവൻ തന്റെ പിതാക്കന്മാർ[a] ചെയ്തതൊക്കെയും പോലെ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘അവന്റെ പിതാക്കന്മാർ’; ഇവിടെ പൂർവികരെയോ മുൻ ഭരണാധികാരികളെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ … ചെയ്തു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: הָרַע
  choice: തിന്മയായതു
  rationale: עשה הרע എന്ന സ്ഥിരപ്രയോഗം അക്ഷരാർഥത്തിലുള്ള ‘തിന്മ ചെയ്തു’ എന്നതിലുപരി ‘തിന്മയായതു ചെയ്തു’ എന്ന അർഥമാണ് നൽകുന്നത്.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: ‘കണ്ണുകളിൽ’ എന്ന ഹീബ്രു രൂപകത്തിന്റെ വിലയിരുത്തൽസംബന്ധിയായ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകി.
- source_word: כְּכֹל אֲשֶׁר
  choice: ചെയ്തതൊക്കെയും പോലെ
  rationale: כֹּל എന്ന പദത്തിന്റെ സമഗ്രതയും മുൻ പ്രവൃത്തികളുമായുള്ള താരതമ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָשׂוּ
  choice: ചെയ്ത
  rationale: പിതാക്കന്മാരുടെ പ്രവൃത്തികൾ രാജാവിന്റെ പ്രവൃത്തികൾക്കു മുമ്പുണ്ടായവയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ലളിതമായ ഭൂതകാലബന്ധരൂപം മതിയാകുന്നു.
- source_word: אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാർ
  rationale: ഹീബ്രുവിലെ അക്ഷരാർഥം സംരക്ഷിക്കുന്നു; രാജകീയ സന്ദർഭത്തിൽ പൂർവികരെയോ മുൻ ഭരണാധികാരികളെയോ സൂചിപ്പിക്കാവുന്ന വിശാലത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെയും ‘Jehovah’ എന്ന പിൽക്കാല രൂപം സ്വീകരിക്കാതെയും ‘Yahweh’ എന്നതിന്റെ മലയാള ലിപ്യന്തരണം നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഹീബ്രു വിലയിരുത്തൽപ്രയോഗത്തിന്റെ അർഥം ‘ദൃഷ്ടിയിൽ’ എന്നു നൽകി; താരതമ്യത്തിന്റെ സമഗ്രത ‘ചെയ്തതൊക്കെയും പോലെ’ എന്നതിലൂടെ നിലനിർത്തി.
