  text: וַ/יַּרְכִּבֻ֨/הוּ עֲבָדָ֥י/ו מֵת֙ מִ/מְּגִדּ֔וֹ וַ/יְבִאֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַֽ/יִּקְבְּרֻ֖/הוּ בִּ/קְבֻֽרָת֑/וֹ וַ/יִּקַּ֣ח עַם הָ/אָ֗רֶץ אֶת יְהֽוֹאָחָז֙ בֶּן יֹ֣אשִׁיָּ֔הוּ וַ/יִּמְשְׁח֥וּ אֹת֛/וֹ וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ תַּ֥חַת אָבִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
translation:
  language: ml
  text: അവന്റെ സേവകർ അവനെ മരിച്ച നിലയിൽ മെഗിദ്ദോയിൽനിന്ന് യെരൂശലേമിലേക്കു കൊണ്ടുവന്നു[a]; അവർ അവനെ അവന്റെ കല്ലറയിൽ അടക്കം ചെയ്തു. പിന്നെ ദേശത്തെ ജനങ്ങൾ[b] യോശീയാവിന്റെ മകനായ യെഹോവാഹാസിനെ എടുത്ത് അവനെ അഭിഷേകം ചെയ്യുകയും അവന്റെ പിതാവിന്റെ സ്ഥാനത്ത് രാജാവാക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം ‘അവനെ കയറ്റി യാത്ര ചെയ്യിച്ചു’; ഇവിടെ യോശീയാവിന്റെ മൃതദേഹം മെഗിദ്ദോയിൽനിന്ന് കൊണ്ടുവന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ദേശത്തെ ജനങ്ങൾ’ എന്നത് പ്രാദേശിക ജനസമൂഹം ഒരു രാഷ്ട്രീയ ഘടകമായി പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ സ്ഥിരപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ
  choice: അവനെ ... കൊണ്ടുപോയി
  rationale: ഹിഫീൽ രൂപത്തിന്റെ അക്ഷരാർഥം ‘അവനെ കയറ്റി യാത്ര ചെയ്യിച്ചു’ എന്നാണെങ്കിലും, മൃതശരീരം മെഗിദ്ദോയിൽനിന്ന് കൊണ്ടുപോയ സന്ദർഭം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עֲבָדָיו
  choice: അവന്റെ സേവകർ
  rationale: രാജാവിന്റെ സേവകരെയോ കൊട്ടാരപരിചാരകരെയോ സൂചിപ്പിക്കാവുന്ന പദം; ‘സേവകർ’ മൂലപദത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: מֵת
  choice: മൃതനായി
  rationale: കൊണ്ടുപോകുമ്പോൾ യോശീയാവ് മരിച്ച നിലയിലായിരുന്നുവെന്ന എബ്രായ പദത്തിന്റെ വ്യക്തമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: בִּקְבֻרָתוֹ
  choice: അവന്റെ കല്ലറയിൽ
  rationale: അടക്കസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന് രാജകീയ പശ്ചാത്തലത്തിലും സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: עַם הָאָרֶץ
  choice: ദേശത്തെ ജനം
  rationale: പ്രാദേശിക ജനസമൂഹം രാഷ്ട്രീയമായി പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം; ‘സാധാരണക്കാർ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: וַיִּקַּח
  choice: തിരഞ്ഞെടുത്ത്
  rationale: അക്ഷരാർഥം ‘എടുത്തു’ എന്നാണെങ്കിലും, രാജസ്ഥാനാരോഹണത്തിനായി യെഹോവാഹാസിനെ ജനങ്ങൾ സ്വീകരിച്ചു തിരഞ്ഞെടുത്തുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: അവനെ അഭിഷേകം ചെയ്യുകയും
  rationale: രാജസ്ഥാനാരോഹണത്തിലെ ഔപചാരിക അഭിഷേകത്തെ സൂചിപ്പിക്കുന്ന משׁח എന്ന ക്രിയയുടെ രാഷ്ട്രീയ-ആചാരപരമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: וַיַּמְלִיכוּ אֹתוֹ תַּחַת אָבִיו
  choice: അവന്റെ അപ്പനു പകരം രാജാവാക്കുകയും ചെയ്തു
  rationale: പിതാവിന്റെ സ്ഥാനത്ത് രാജാവാക്കിയെന്ന വംശാവലി-രാജകീയ ബന്ധം നേരിട്ട്, സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: രാജകീയ അഭിഷേകഭാഷ
  choice: അഭിഷേകം ചെയ്തു
  alternative: നിയമിച്ചു
  rationale: മൂലഭാഷയിൽ അഭിഷേകത്തിനുള്ള പ്രത്യേക ക്രിയ തന്നെയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനെ പൊതുവായ നിയമനമായി ലഘൂകരിക്കാതെ രാജകീയ ചടങ്ങിന്റെ പ്രാധാന്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. തുടർച്ചയായ എബ്രായ കഥനക്രിയകൾ മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധത്തിൽ അവതരിപ്പിച്ചു. പ്രധാന പാഠത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
