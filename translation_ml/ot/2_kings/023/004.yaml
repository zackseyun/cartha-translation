  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּהוּ֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶת כֹּהֲנֵ֣י הַ/מִּשְׁנֶה֮ וְ/אֶת שֹׁמְרֵ֣י הַ/סַּף֒ לְ/הוֹצִיא֙ מֵ/הֵיכַ֣ל יְהוָ֔ה אֵ֣ת כָּל הַ/כֵּלִ֗ים הָֽ/עֲשׂוּיִם֙ לַ/בַּ֣עַל וְ/לָֽ/אֲשֵׁרָ֔ה וּ/לְ/כֹ֖ל צְבָ֣א הַ/שָּׁמָ֑יִם וַֽ/יִּשְׂרְפֵ֞/ם מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ בְּ/שַׁדְמ֣וֹת קִדְר֔וֹן וְ/נָשָׂ֥א אֶת עֲפָרָ֖/ם בֵּֽית אֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
translation:
  language: ml
  text: അപ്പോൾ രാജാവ് മഹാപുരോഹിതനായ ഹിൽക്കീയാവിനോടും രണ്ടാം നിരയിലെ പുരോഹിതന്മാരോടും പടിവാതിൽ കാവൽക്കാരോടും യഹോവയുടെ ആലയത്തിൽനിന്ന് ബാലിനും അശേരയ്ക്കും[a] ആകാശത്തിലെ സകല സൈന്യത്തിനുവേണ്ടി ഉണ്ടാക്കിയിരുന്ന ഉപകരണങ്ങളെല്ലാം പുറത്തുകൊണ്ടുവരാൻ കല്പിച്ചു. അവൻ അവയെ യെരൂശലേമിനു പുറത്ത് കിദ്രോൻ വയലുകളിൽ വെച്ച് ചുട്ടുകളഞ്ഞു; അവയുടെ പൊടി ബേഥേലിലേക്കു കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അശേരാപ്രതിഷ്ഠയ്ക്ക്.” എബ്രായപദം അശേര എന്ന ദേവതയെയോ അവളുമായി ബന്ധപ്പെട്ട ഒരു ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: രാജാവിന്റെ അധികാരപൂർവമായ ആജ്ഞയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: മഹാപുരോഹിതൻ
  rationale: മുഖ്യ പുരോഹിതപദവിക്കുള്ള പ്രചാരത്തിലുള്ളതും സന്ദർഭോചിതവുമായ മലയാളപ്രയോഗം.
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  choice: രണ്ടാം നിരയിലെ പുരോഹിതന്മാർ
  rationale: מִשְׁנֶה സൂചിപ്പിക്കുന്ന രണ്ടാമത്തെ പദവി നിലനിർത്തുന്നു; സ്ഥാപനഘടനയെ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: שֹׁמְרֵי הַסַּף
  choice: പടിവാതിൽ കാവൽക്കാർ
  rationale: ക്ഷേത്രപ്രവേശനത്തിന്റെ പടിവാതിൽ കാക്കുന്ന ഔദ്യോഗിക ചുമതല സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵהֵיכַל יְהוָה
  choice: യഹോവയുടെ ആലയത്തിൽനിന്ന്
  rationale: ആരാധനോപകരണങ്ങളും പുരോഹിതന്മാരും ഉള്ള സന്ദർഭത്തിൽ הֵיכָל ദേവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: כָּל הַכֵּלִים
  choice: ഉപകരണങ്ങളെല്ലാം
  rationale: כְּלִים എന്ന പദത്തിന്റെ വിശാലമായ അർഥം സൂക്ഷിക്കുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: לַבַּעַל
  choice: ബാലിന്
  rationale: ഇവിടെ ദേവനാമമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ മലയാളത്തിൽ ബാലിന് എന്നു നൽകി.
- source_word: לָאֲשֵׁרָה
  choice: അശേരയ്ക്ക്
  rationale: ദേവതയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവെയോ സൂചിപ്പിക്കാവുന്ന എബ്രായപദത്തിന്റെ അവ്യക്തത മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: כֹל צְבָא הַשָּׁמָיִם
  choice: ആകാശത്തിലെ സകല സൈന്യം
  rationale: നക്ഷത്രാദി ആകാശഗണങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന രൂപകം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: בְּשַׁדְמוֹת קִדְרוֹן
  choice: കിദ്രോൻ വയലുകളിൽവെച്ച്
  rationale: שַׁדְמוֹת എന്ന ബഹുവചനത്തിന്റെ കൃഷിയിടങ്ങൾ/വയലുകൾ എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: עֲפָרָם
  choice: അവയുടെ പൊടി
  rationale: עָפָר എന്നത് ഇവിടെ ചുട്ടശേഷമുള്ള അവശിഷ്ടത്തെ സൂചിപ്പിച്ചാലും അടിസ്ഥാനാർഥമായ ‘പൊടി’ നിലനിർത്തുന്നു; ‘ചാരം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: എബ്രായപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പൊതുവായ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: אֲשֵׁרָה എന്ന പദത്തിന്റെ സൂചന
  choice: അശേര
  alternative: അശേരാപ്രതിഷ്ഠ; അശേരാത്തൂൺ
  rationale: ഈ പദം ദേവതയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവെയോ സൂചിപ്പിക്കാം. വാക്യഘടന ബാലിനും അശേരയ്ക്കും ആകാശസൈന്യത്തിനുംവേണ്ടി ഉണ്ടാക്കിയ ഉപകരണങ്ങളെപ്പറ്റി പറയുന്നതിനാൽ മുഖ്യപാഠത്തിൽ വ്യക്തിനാമം നിലനിർത്തി മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ഗദ്യശൈലി. പദവികളും ആരാധനാസംബന്ധിയായ വസ്തുക്കളും വ്യക്തമായി പറഞ്ഞിട്ടുണ്ടെങ്കിലും മൂലപാഠത്തിലെ അശേരാ-സംബന്ധമായ അവ്യക്തതയും ‘പൊടി’ എന്ന ദൃശ്യവും നിലനിർത്തിയിരിക്കുന്നു.
