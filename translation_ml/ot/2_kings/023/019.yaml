id: 2KI.23.19
reference: 2 Kings 23:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַם֩ אֶת כָּל בָּתֵּ֨י הַ/בָּמ֜וֹת אֲשֶׁ֣ר בְּ/עָרֵ֣י שֹׁמְר֗וֹן אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֤י יִשְׂרָאֵל֙ לְ/הַכְעִ֔יס הֵסִ֖יר יֹֽאשִׁיָּ֑הוּ וַ/יַּ֣עַשׂ לָ/הֶ֔ם כְּ/כָל הַֽ/מַּעֲשִׂ֔ים אֲשֶׁ֥ר עָשָׂ֖ה בְּ/בֵֽית אֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/019.yaml
  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
translation:
  language: ml
  text: കൂടാതെ, യിസ്രായേൽരാജാക്കന്മാർ കോപം ഉണർത്താൻ ശമര്യയിലെ പട്ടണങ്ങളിൽ പണിതിരുന്ന ഉന്നതസ്ഥലങ്ങളിലെ എല്ലാ മന്ദിരങ്ങളും യോശീയാവ് നീക്കിക്കളഞ്ഞു; ബേഥേലിൽ താൻ ചെയ്ത സകല പ്രവൃത്തികൾക്കും ഒത്തവണ്ണം അവയോടും പ്രവർത്തിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'വിശാലസന്ദർഭമനുസരിച്ച് കൂടുതൽ വ്യക്തമായി: “യഹോവയെ കോപിപ്പിക്കാൻ.”'
    reason: മൂലവാക്യത്തിൽ കോപിപ്പിക്കപ്പെടുന്ന വ്യക്തി പരോക്ഷമാണെങ്കിലും സന്ദർഭത്തിൽ അത് യഹോവയാണെന്ന് വ്യക്തമാകുന്നു.
lexical_decisions:
- source_word: וְגַם
  choice: -ഉം
  rationale: മുൻവിവരണത്തോടു ഈ നടപടിയെ കൂട്ടിച്ചേർക്കുന്ന പദത്തിന്റെ സങ്കലനബലം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രത്യയത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: בָּתֵּי הַבָּמוֹת
  choice: പൂജാഗിരിമന്ദിരങ്ങൾ
  rationale: במות എന്ന ആരാധനാസ്ഥലങ്ങളെയും בתי എന്ന കെട്ടിടസൂചനയെയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; വെറും ‘പൂജാഗിരികൾ’ എന്നു പറഞ്ഞാൽ മന്ദിരങ്ങളുടെ സൂചന നഷ്ടപ്പെടും.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: ശമര്യയിലെ പട്ടണങ്ങളിൽ
  rationale: ഇവിടെ ശമര്യ നഗരം മാത്രമല്ല, മുൻ വടക്കൻ രാജ്യത്തിന്റെ പ്രദേശം എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂമിശാസ്ത്രപ്രയോഗം.
- source_word: לְהַכְעִיס
  choice: കോപം ജ്വലിപ്പിക്കേണ്ടതിന്
  rationale: ഹിഫീൽ ക്രിയയുടെ പ്രകോപിപ്പിച്ച് കോപമുണർത്തുക എന്ന ഉദ്ദേശ്യബലം പ്രകടമാക്കുന്നു; കോപത്തിന്റെ വ്യക്തിയെ മൂലപാഠം പറയാത്തതിനാൽ പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: הֵסִיר
  choice: നീക്കിക്കളഞ്ഞു
  rationale: പരിഷ്കരണസന്ദർഭത്തിൽ ആരാധനാസ്ഥാപനങ്ങളെ ഇല്ലാതാക്കുന്നതിന്റെ ശക്തമായ, വ്യക്തമായ മലയാളപ്രയോഗം.
- source_word: וַיַּעַשׂ לָהֶם
  choice: അവയോടും ചെയ്തു
  rationale: മൂലത്തിലെ നേരിട്ടുള്ള പ്രയോഗവും തുടർന്നുള്ള താരതമ്യവാക്യവുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשָׂה
  choice: ചെയ്തതുപോലെതന്നെ
  rationale: എല്ലാ പ്രവൃത്തികളും എന്ന ആശയം മലയാളത്തിൽ ആവർത്തനഭാരമില്ലാതെ സമ്പൂർണ താരതമ്യമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּבֵית אֵל
  choice: ബേഥേലിൽ
  rationale: സ്ഥലനാമത്തോടുള്ള മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനവിഭക്തി; മുൻസന്ദർഭത്തിലെ യോശിയാവിന്റെ നടപടികളെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: לְהַכְעִיס എന്നതിലെ കോപത്തിന്റെ പരോക്ഷ കർമം
  choice: പ്രധാനവാചകത്തിൽ കർമം പറയാതെ ‘കോപം ജ്വലിപ്പിക്കേണ്ടതിന്’ എന്നു നിലനിർത്തി.
  alternative: ‘യഹോവയെ കോപിപ്പിക്കേണ്ടതിന്’
  rationale: വിശാലസന്ദർഭം യഹോവയെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ഈ എബ്രായവാക്യഭാഗം കർമം വ്യക്തമാക്കുന്നില്ല; ആ യഥാർഥ അപൂർണത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ‘പൂജാഗിരിമന്ദിരങ്ങൾ’ എന്ന സംയുക്തപദം പുരാതന ആരാധനാസ്ഥലങ്ങളിലെ കെട്ടിടങ്ങളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
