source:
  edition: WLC
  text: וְ/אֶֽת הַֽ/מִּזְבְּח֡וֹת אֲשֶׁ֣ר עַל הַ/גָּג֩ עֲלִיַּ֨ת אָחָ֜ז אֲשֶׁר עָשׂ֣וּ מַלְכֵ֣י יְהוּדָ֗ה וְ/אֶת הַֽ/מִּזְבְּחוֹת֙ אֲשֶׁר עָשָׂ֣ה מְנַשֶּׁ֔ה בִּ/שְׁתֵּ֛י חַצְר֥וֹת בֵּית יְהוָ֖ה נָתַ֣ץ הַ/מֶּ֑לֶךְ וַ/יָּ֣רָץ מִ/שָּׁ֔ם וְ/הִשְׁלִ֥יךְ אֶת עֲפָרָ֖/ם אֶל נַ֥חַל קִדְרֽוֹן־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
translation:
  language: ml
  text: ആഹാസിന്റെ മാളികമുറിയുടെ മേൽക്കൂരയിലുണ്ടായിരുന്നതും യെഹൂദാരാജാക്കന്മാർ പണിതിരുന്നതുമായ യാഗപീഠങ്ങളും, യഹ്‌വെയുടെ ആലയത്തിലെ രണ്ടു പ്രാകാരങ്ങളിൽ മനശ്ശെ പണിത യാഗപീഠങ്ങളും രാജാവ് ഇടിച്ചുതകർത്തു. അവിടെവെച്ച് അവയെ പൊടിച്ചശേഷം[b], അവയുടെ പൊടി കിദ്രോൻ താഴ്വരയിൽ[c] എറിഞ്ഞുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: എബ്രായരൂപം ഇവിടെ ദുഷ്കരമാണ്. മസോററ്റിക് സ്വരചിഹ്നങ്ങളോടുകൂടിയ വായനയ്ക്ക് ‘അവിടെനിന്ന് ഓടി’ എന്ന അർഥം വരാം; എന്നാൽ തുടർന്ന് ‘അവയുടെ പൊടി’ എന്നു വരുന്നതിനാൽ, പലരും ഇതിനെ רצץ (‘തകർക്കുക, പൊടിക്കുക’) എന്നതുമായി ബന്ധപ്പെടുത്തി ‘അവിടെവെച്ച് അവയെ പൊടിച്ചു’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: textual_ambiguity
  - marker: c
    text: അഥവാ, ‘കിദ്രോൻ തോട്ടിൽ’ അല്ലെങ്കിൽ ‘കിദ്രോൻ മലയിടുക്കിൽ.’ എബ്രായത്തിലെ נַחַל എന്ന പദത്തിന് തോടുപാത, മലയിടുക്ക്, താഴ്വര എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  choice: യാഗപീഠങ്ങൾ
  rationale: מִזְבֵּחַ എന്ന പദത്തിന്റെ സാധാരണ അർഥമായ ‘യാഗപീഠം’ നിലനിർത്തുകയും രണ്ടു പ്രയോഗങ്ങളിലെയും ബഹുവചനം കൃത്യമായി സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  choice: ആഹാസിന്റെ മാളികമുറിയുടെ മേൽക്കൂരയിൽ
  rationale: עֲלִיָּה മുകളിലത്തെ മുറിയെയോ മാളികമുറിയെയോ സൂചിപ്പിക്കാം. ‘മാളികമുറി’ വാസ്തുഘടനാസംബന്ധമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; പകരുവായന അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
- source_word: אֲשֶׁר עָשׂוּ מַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാർ പണിതിരുന്ന
  rationale: ഈ യാഗപീഠങ്ങൾ രാജാവിന്റെ നടപടിക്കുമുമ്പേ പണിതവയാണെന്ന ആഖ്യാനക്രമം ‘പണിതിരുന്ന’ വ്യക്തമാക്കുന്നു.
- source_word: בִּשְׁתֵּי חַצְרוֹת בֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ആലയത്തിലെ രണ്ടു പ്രാകാരങ്ങളിൽ
  rationale: חָצֵר എന്നതിനു ‘പ്രാകാരം’ എന്നും בֵּית יְהוָה എന്നത് സന്ദർഭാനുസൃതമായി ‘യഹ്‌വെയുടെ ആലയം’ എന്നും നൽകിയിരിക്കുന്നു. ഇത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ക്ഷേത്രസന്ദർഭത്തിൽ വ്യക്തവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാളരൂപമായി ‘യഹ്‌വെ’ നൽകിയിരിക്കുന്നു.
- source_word: נָתַץ
  choice: ഇടിച്ചുതകർത്തു
  rationale: നിർമിതികളെ പൊളിച്ചുകളയുക, ഇടിച്ചുതകർക്കുക എന്ന ക്രിയയുടെ ശക്തമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיָּרָץ מִשָּׁם
  choice: അവിടെവെച്ച് അവ പൊടിച്ചിട്ട്
  rationale: രൂപം പാഠപരമായി ദുഷ്കരമാണെങ്കിലും തുടർന്നുള്ള ‘അവയുടെ പൊടി’ എന്ന പ്രയോഗം തകർത്ത വസ്തുക്കൾ പൊടിച്ചതെന്ന സന്ദർഭാർഥത്തെ പിന്തുണയ്ക്കുന്നു. മസോററ്റിക് സ്വരീകരണം അനുവദിക്കുന്ന മറ്റൊരു വായന അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
- source_word: עֲפָרָם
  choice: അവയുടെ പൊടി
  rationale: עָפָר എന്ന പദത്തിന്റെ ‘പൊടി’ എന്ന ദൃശ്യചിത്രം നിലനിർത്തുന്നു; പൊതുവായ ‘അവശിഷ്ടങ്ങൾ’ എന്നാക്കി മൃദൂകരിക്കുന്നില്ല.
- source_word: נַחַל קִדְרוֹן
  choice: കിദ്രോൻ താഴ്വര
  rationale: נַחַל വറ്റിയ തോടുപാത, മലയിടുക്ക്, ഒഴുക്കുള്ള താഴ്വര എന്നിവയെ സൂചിപ്പിക്കാം. ഇവിടെ ‘കിദ്രോൻ താഴ്വര’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וְאֶת ... וְאֶת
  choice: …യാഗപീഠങ്ങളും …യാഗപീഠങ്ങളും
  rationale: എബ്രായത്തിലെ മുന്നോട്ടുവെച്ച രണ്ടു കർമങ്ങളെയും മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യക്രമത്തിൽ ‘-ഉം … -ഉം’ ഘടനയിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്. അതിനാൽ ഒരു ബിരുദമായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, Yahweh എന്നതിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപവും സ്വീകരിച്ചിട്ടില്ല.
- issue: בֵּית יְהוָה എന്ന പ്രയോഗം
  choice: യഹ്‌വെയുടെ ആലയം
  alternative: യഹ്‌വെയുടെ ഭവനം
  rationale: ഇവിടെ സൂചിപ്പിക്കുന്നത് യെരൂശലേം ദേവാലയത്തിന്റെ പ്രാകാരങ്ങളെയാണ്. അതിനാൽ ‘ആലയം’ സന്ദർഭം വ്യക്തമായി നൽകുന്നു; ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. രാജകീയ ആഖ്യാനത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. ദുഷ്കരമായ എബ്രായ ക്രിയയുടെ അനിശ്ചിതത്വവും נַחַל എന്ന ഭൂപ്രകൃതിപദത്തിന്റെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
