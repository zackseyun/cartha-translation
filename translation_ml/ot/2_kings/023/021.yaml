  yaml_path: translation/ot/2_kings/023/021.yaml
  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
translation:
  language: ml
  text: 'പിന്നെ രാജാവ് സകലജനത്തോടും ഇങ്ങനെ കല്പിച്ചു: “ഈ ഉടമ്പടിയുടെ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്നതുപോലെ, നിങ്ങളുടെ ദൈവമായ യഹ്‌വേക്കു പെസഹ ആചരിക്കുവിൻ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “പെസഹ ചെയ്യുവിൻ/ഉണ്ടാക്കുവിൻ”; ഇവിടെ അതിന്റെ അർഥം പെസഹ ആചരിക്കുക അഥവാ അനുഷ്ഠിക്കുക എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയ അധികാരപൂർവമായ ആജ്ഞയെ സൂചിപ്പിക്കുന്നു; രാജാവിന്റെ കല്പന എന്ന സന്ദർഭത്തിൽ ‘കല്പിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כָּל הָעָם
  choice: സകലജനത്തോടും
  rationale: עם ഇവിടെ ജനസമൂഹത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ പരോക്ഷസംബോധനഘടനയ്ക്ക് യോജിച്ച് ‘സകലജനത്തോടും’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עֲשׂוּ פֶסַח
  choice: പെസഹ ആചരിക്കുവിൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘പെസഹ ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, ഇത് പെസഹാനുഷ്ഠാനം പാലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. ‘ആചരിക്കുവിൻ’ ഉത്സവാനുഷ്ഠാനത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വേക്കു
  rationale: ל സമർപ്പണത്തെയോ ലക്ഷ്യത്തെയോ സൂചിപ്പിക്കുന്നു; ‘യഹ്‌വേക്കു’ അതു നിലനിർത്തുന്നു. אֱלֹהֵיכֶם എന്നത് ‘നിങ്ങളുടെ ദൈവം’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: כַּכָּתוּב
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: എഴുത്തിലുള്ള നിർദേശത്തോടുള്ള അനുരൂപത സൂചിപ്പിക്കുന്ന പതിവുഘടന; എബ്രായ കർമണപ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר הַבְּרִית הַזֶּה
  choice: ഈ ഉടമ്പടിയുടെ പുസ്തകത്തിൽ
  rationale: כתב എന്ന എഴുത്തുസൂത്രവാക്യത്തോടൊപ്പം עַל രേഖയിൽ ഉള്ളടക്കം എഴുതിയിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പുസ്തകത്തിൽ’ സ്വാഭാവികമാണ്. ‘ഈ’ എന്ന നിർദേശകപദവും ‘ഉടമ്പടി’ എന്ന ആശയവും നിലനിർത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പൊതുപദവിയായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; ഇതിലൂടെ ഉടമ്പടിനാമത്തിന്റെ പ്രത്യേകത നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. രാജകീയ കല്പനയുടെ ഭാവം നിലനിർത്താൻ ‘കല്പിച്ചു’, ബഹുവചന ആജ്ഞയ്ക്ക് ‘ആചരിക്കുവിൻ’ എന്നിവ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘പെസഹ ആചരിക്കുവിൻ’ എന്ന പ്രയോഗത്തിനുശേഷം ചേർത്തു.
