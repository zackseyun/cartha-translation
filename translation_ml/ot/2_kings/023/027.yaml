source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה גַּ֤ם אֶת יְהוּדָה֙ אָסִיר֙ מֵ/עַ֣ל פָּנַ֔/י כַּ/אֲשֶׁ֥ר הֲסִרֹ֖תִי אֶת יִשְׂרָאֵ֑ל וּ֠/מָאַסְתִּי אֶת הָ/עִ֨יר הַ/זֹּ֤את אֲשֶׁר בָּחַ֨רְתִּי֙ אֶת יְר֣וּשָׁלִַ֔ם וְ/אֶת הַ/בַּ֔יִת אֲשֶׁ֣ר אָמַ֔רְתִּי יִהְיֶ֥ה שְׁמִ֖/י שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
translation:
  language: ml
  text: 'യഹ്‌വെ അരുളിച്ചെയ്തു: “ഞാൻ ഇസ്രായേലിനെ എന്റെ സന്നിധിയിൽനിന്ന് നീക്കിക്കളഞ്ഞതുപോലെ, യെഹൂദയെയും നീക്കിക്കളയും. ഞാൻ തിരഞ്ഞെടുത്ത ഈ നഗരത്തെ—യെരൂശലേമിനെ—ഞാൻ തള്ളിക്കളയും[a]; ‘എന്റെ നാമം അവിടെ ഉണ്ടായിരിക്കും’ എന്നു ഞാൻ പറഞ്ഞ ആ ഭവനത്തെയും[b] തള്ളിക്കളയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഞാൻ തിരഞ്ഞെടുത്ത ഈ നഗരത്തെ—യെരൂശലേമിനെ—ഞാൻ തള്ളിക്കളഞ്ഞിരിക്കുന്നു.” ഹീബ്രു ക്രിയയെ പൂർത്തിയായ പ്രവൃത്തിയായും വായിക്കാം; ഇവിടെ ചുറ്റുമുള്ള ന്യായവിധിപ്രഖ്യാപനത്തോട് ചേർന്ന് ഭാവികാലത്തിൽ പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ: “ദേവാലയത്തെയും.” ഹീബ്രുവിൽ അക്ഷരാർഥം “ഭവനം”; ഇവിടെ യെരൂശലേമിലെ ദേവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തിന്റെ ഹീബ്രു രൂപത്തോടടുത്ത ലിപ്യന്തരണം ഉപയോഗിച്ച് ഉടമ്പടിനാമത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: אָסִיר / הֲסִרֹתִי
  choice: നീക്കിക്കളയും / നീക്കിക്കളഞ്ഞു
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘അകറ്റുക, നീക്കുക’ എന്ന കാരണാർത്ഥം നിലനിർത്തുകയും യെഹൂദയും ഇസ്രായേലും തമ്മിലുള്ള സമാന്തരത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מֵעַל פָּנַי
  choice: എന്റെ സന്നിധിയിൽനിന്ന്
  rationale: അക്ഷരാർഥമായ ‘എന്റെ മുഖത്തുനിന്ന്/എന്റെ മുമ്പിൽനിന്ന്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ബന്ധപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: גַּם
  choice: -യെയും
  rationale: ഇസ്രായേലിനുണ്ടായ വിധി യെഹൂദയ്ക്കും ബാധകമാകുമെന്ന് മലയാളത്തിലെ ചേർക്കൽപ്രത്യയം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: -തുപോലെ
  rationale: യെഹൂദയുടെ ഭാവിവിധിയെയും ഇസ്രായേലിന്റെ മുൻവിധിയെയും നേരിട്ട് താരതമ്യം ചെയ്യുന്നു.
- source_word: וּמָאַסְתִּי
  choice: ഞാൻ തള്ളിക്കളയും
  rationale: מאס എന്നതിന്റെ നിരസിക്കൽ/ഉപേക്ഷിക്കൽ ഭാവം നൽകുന്നു; സന്ദർഭത്തിലെ വരാനിരിക്കുന്ന ന്യായവിധിയുടെ പ്രവാഹത്തോട് ചേർന്ന് ഭാവികാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הָעִיר הַזֹּאת אֲשֶׁר בָּחַרְתִּי אֶת יְרוּשָׁלִַם
  choice: ഞാൻ തിരഞ്ഞെടുത്ത ഈ നഗരത്തെ—യെരൂശലേമിനെ—
  rationale: യെരൂശലേം ‘ഈ നഗരം’ എന്നതിന്റെ സമാനാധികരണ വിശദീകരണമാണെന്ന ഘടന ഡാഷുകൾകൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: הַבַּיִת
  choice: ഭവനം
  rationale: ഹീബ്രുവിലെ ‘വീട്/ഭവനം’ എന്ന മൂലപദം നിലനിർത്തുന്നു; ഇവിടെ അത് യെരൂശലേമിലെ ദേവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത് എന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: എന്റെ നാമം അവിടെ ഉണ്ടായിരിക്കും
  rationale: ദൈവനാമം തിരഞ്ഞെടുത്ത വിശുദ്ധസ്ഥാനത്തോടു ബന്ധപ്പെടുന്ന ആശയം വ്യാഖ്യാനാതിശയമില്ലാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിധിപ്രഖ്യാപനത്തിലെ וּמָאַסְתִּי എന്ന ഖാതൽ രൂപത്തിന്റെ കാലസൂചന
  choice: ഭാവികാലമായി ‘ഞാൻ തള്ളിക്കളയും’
  alternative: ‘ഞാൻ തള്ളിക്കളഞ്ഞിരിക്കുന്നു’ എന്ന പൂർത്തിയായ പ്രവൃത്തി
  rationale: രൂപശാസ്ത്രപരമായി പൂർത്തിയായ പ്രവൃത്തിയായി വായിക്കാമെങ്കിലും, ‘യെഹൂദയെയും നീക്കിക്കളയും’ എന്ന വരാനിരിക്കുന്ന വിധിപ്രഖ്യാപനത്തിന്റെ തുടർച്ചയായി ഭാവികാലം സ്വാഭാവികമാണ്. മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: הַבַּיִת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പ്രധാനപാഠത്തിൽ ‘ഭവനം’
  alternative: ‘ദേവാലയം’
  rationale: മൂലത്തിലെ ‘ഭവനം’ എന്ന രൂപകവും ദേവാലയദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ ‘ദേവാലയം’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവവചനം അവതരിപ്പിക്കാൻ ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചു; അനാവശ്യമായ പുരാതന വ്യാകരണരൂപങ്ങൾ ഒഴിവാക്കി. ആവർത്തിച്ചുള്ള ‘ഞാൻ’ എന്ന പ്രയോഗം ദൈവിക വിധിപ്രഖ്യാപനത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു.
