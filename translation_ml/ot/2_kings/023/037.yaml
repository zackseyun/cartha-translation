id: 2KI.23.37
reference: 2 Kings 23:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/037.yaml
  text: And he did what was evil in the sight of Yahweh[a], according to all that his fathers had done.
translation:
  language: ml
  text: തന്റെ പിതാക്കന്മാർ[a] ചെയ്തതൊക്കെയും പോലെ അവൻ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മ പ്രവർത്തിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പൂർവികർ’ അല്ലെങ്കിൽ ‘മുൻഗാമികൾ.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘പിതാക്കന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ചെയ്തു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ പ്രത്യേകമായി ‘എന്നിട്ട്’ ചേർക്കാതെ ക്രിയയുടെ ഭൂതകാലരൂപം തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: הָרַע
  choice: തിന്മയായതു
  rationale: עשה הרע എന്ന സ്ഥിരപ്രയോഗത്തെ അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമായ ‘തിന്മ ചെയ്തു’ എന്നു പറയാതെ, ധാർമ്മിക വിലയിരുത്തൽ വ്യക്തമാകുന്ന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: ഒരാളുടെ വിലയിരുത്തലിൽ അഥവാ കാഴ്ചപ്പാടിൽ എന്നർഥമുള്ള എബ്രായ പ്രയോഗത്തിന്റെ രൂപകഭാവവും അർഥവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כְּכֹל אֲשֶׁר
  choice: ചെയ്തതൊക്കെയും പോലെ
  rationale: മുൻഗാമികളുടെ മുഴുവൻ പെരുമാറ്റത്തോടുമുള്ള അനുരൂപത സൂചിപ്പിക്കുന്ന താരതമ്യശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָשׂוּ
  choice: ചെയ്ത
  rationale: അവന്റെ പ്രവൃത്തിക്ക് മുമ്പുണ്ടായ പിതാക്കന്മാരുടെ പ്രവൃത്തിയെ സന്ദർഭം വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ഭൂതകാല സംബന്ധകൃതി മതിയാകുന്നു.
- source_word: אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാർ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥം നിലനിർത്തുന്നു; രാജവംശസന്ദർഭത്തിൽ ‘പൂർവികർ’ എന്ന വിപുലാർഥം ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ സ്ഥാനപ്പേരായി മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ രാജവൃത്താന്തശൈലി. എബ്രായ വിലയിരുത്തൽസൂത്രത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് മലയാള വാക്യക്രമം സ്വാഭാവികമാക്കി.
