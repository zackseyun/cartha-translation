  source_fidelity: The principal actions and cultic terms are conveyed accurately. However, the final locative phrase is syntactically difficult in Hebrew and the draft turns the likely interpretation ('one entering') into the main text. The Hebrew only says, elliptically, 'on the left of a man at the city gate'; the direction of approach and the precise antecedent remain uncertain.
