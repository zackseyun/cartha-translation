  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
translation:
  language: ml
  text: അവൻ യെഹൂദായിലെ പട്ടണങ്ങളിൽനിന്ന് എല്ലാ പുരോഹിതന്മാരെയും കൊണ്ടുവന്നു. ഗേബാ മുതൽ ബേർ-ശേബവരെ പുരോഹിതന്മാർ ധൂപം കത്തിച്ചിരുന്ന ഉയർന്ന ആരാധനാസ്ഥലങ്ങളെ അവൻ അശുദ്ധമാക്കി. നഗരാധികാരിയായ യോശുവയുടെ കവാടത്തിന്റെ പ്രവേശനത്തിൽ ഉണ്ടായിരുന്ന കവാടങ്ങളിലെ ഉയർന്ന ആരാധനാസ്ഥലങ്ങളും[a] അവൻ ഇടിച്ചുകളഞ്ഞു. അവ നഗരകവാടത്തിൽ ഒരാളുടെ ഇടതുവശത്തായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ വ്യാഖ്യാനാത്മകമായി, “കവാടങ്ങളോടു ചേർന്ന ആരാധനാകേന്ദ്രങ്ങൾ.” എബ്രായത്തിൽ അക്ഷരാർഥം “കവാടങ്ങളുടെ ഉയർന്ന ആരാധനാസ്ഥലങ്ങൾ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ അവസാന പ്രയോഗം ദുഷ്കരമാണ്; അക്ഷരാർഥം ഏകദേശം “നഗരകവാടത്തിൽ ഒരു മനുഷ്യന്റെ ഇടതുവശത്ത്” എന്നാണ്. കവാടത്തിലേക്കു പ്രവേശിക്കുന്ന ഒരാളുടെ ഇടതുവശം ഉദ്ദേശിച്ചിരിക്കാം; എന്നാൽ ഇതിന്റെ കൃത്യമായ സൂചന വ്യക്തമായിട്ടില്ല.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיָּבֵא
  choice: കൊണ്ടുവന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ‘വരുത്തുക/കൊണ്ടുവരുക’ എന്ന നേരിട്ടുള്ള അർഥത്തിലാണ്.
- source_word: מֵעָרֵי יְהוּדָה
  choice: യെഹൂദാ പട്ടണങ്ങളിൽനിന്ന്
  rationale: עָרִים ചെറുതും വലുതുമായ നഗരവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കാം; ആധുനിക മലയാളത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികവും വിശാലവുമാണ്.
- source_word: וַיְטַמֵּא
  choice: അശുദ്ധമാക്കി
  rationale: പീയേൽ രൂപത്തിലുള്ള טמא ആരാധനാസ്ഥലങ്ങളെ ആചാരപരമായി അയോഗ്യമാക്കുകയോ മലിനമാക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַבָּמוֹת
  choice: പൂജാഗിരികൾ
  rationale: בָּמוֹת പ്രാദേശിക ആരാധനയ്ക്കുള്ള ഉയർന്ന സ്ഥലങ്ങളെയോ അവിടെയുള്ള ആരാധനാകേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘പൂജാഗിരികൾ’ ഭൗമികവും ആരാധനാപരവുമായ അർഥങ്ങൾ ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: קִטְּרוּ שָׁמָּה
  choice: ധൂപം കത്തിച്ചിരുന്ന
  rationale: קטר ധൂപമോ പുക ഉയരുന്ന വഴിപാടോ കത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ആവർത്തിച്ചിരുന്ന മുൻകാല പ്രവർത്തി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: מִגֶּבַע עַד בְּאֵר שָׁבַע
  choice: ഗേബമുതൽ ബേർ-ശേബവരെ
  rationale: യെഹൂദായുടെ വടക്കുമുതൽ തെക്കുവരെയുള്ള വ്യാപ്തി സൂചിപ്പിക്കുന്ന സ്ഥലപരിധി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְנָתַץ
  choice: ഇടിച്ചുകളഞ്ഞു
  rationale: נתץ കെട്ടിടങ്ങളെയോ ആരാധനാസ്ഥാപനങ്ങളെയോ പൊളിച്ചുനീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בָּמוֹת הַשְּׁעָרִים
  choice: കവാടങ്ങളിലെ പൂജാഗിരികൾ
  rationale: അവ്യക്തമായ എബ്രായ സംയുക്തപ്രയോഗത്തെ കഴിയുന്നത്ര അടുത്ത് നിലനിർത്തുന്നു; ‘കവാടങ്ങളോടു ചേർന്ന ആരാധനാകേന്ദ്രങ്ങൾ’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: שַׂר הָעִיר
  choice: നഗരാധികാരി
  rationale: שַׂר ഇവിടെ രാജകീയ പദവിയേക്കാൾ നഗരഭരണച്ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר
  choice: നഗരകവാടത്തിൽ പ്രവേശിക്കുന്ന ഒരാളുടെ ഇടതുവശത്ത്
  rationale: മൂലത്തിലെ ദുഷ്കരവും അപൂർണ്ണവുമായ ‘ഒരു മനുഷ്യന്റെ ഇടതുവശത്ത്’ എന്ന പ്രയോഗത്തിന്റെ സാധ്യതയേറിയ ദിശാസൂചന വ്യക്തമാക്കുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
