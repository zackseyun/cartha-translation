  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְהוָ֡ה וְ/כָל אִ֣ישׁ יְהוּדָה֩ וְ/כָל יֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אִתּ֗/וֹ וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/נְּבִיאִ֔ים וְ/כָל הָ/עָ֖ם לְ/מִ/קָּטֹ֣ן וְ/עַד גָּד֑וֹל וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בְּ/בֵ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
translation:
  language: ml
  text: പിന്നെ രാജാവ് യഹ്‌വേയുടെ ഭവനത്തിലേക്കു[b] കയറിപ്പോയി; അവനോടുകൂടെ യെഹൂദയിലെ എല്ലാ പുരുഷന്മാരും[a], യെരൂശലേം നിവാസികളെല്ലാം, പുരോഹിതന്മാരും പ്രവാചകന്മാരും, ചെറിയവർമുതൽ വലിയവർവരെയുള്ള[c] സകല ജനവും കയറിപ്പോയി. യഹ്‌വേയുടെ ഭവനത്തിൽ കണ്ടെത്തിയ ഉടമ്പടിയുടെ പുസ്തകത്തിലെ സകല വചനങ്ങളും അവൻ അവർ കേൾക്കെ വായിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, ‘യെഹൂദയിലെ എല്ലാ പുരുഷന്മാരും.’ ഈ പ്രയോഗം ജനസമൂഹത്തെ പ്രതിനിധീകരിച്ചേക്കാം; എങ്കിലും മൂലത്തിലെ പുരുഷലിംഗ പദപ്രയോഗം പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യഹ്‌വേയുടെ ആലയം.’ എബ്രായത്തിൽ അക്ഷരാർഥം, ‘യഹ്‌വേയുടെ ഭവനം.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഏറ്റവും എളിയവർമുതൽ ഏറ്റവും വലിയവർവരെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: ആലയത്തിലേക്കുള്ള ദിശയും ഉയർച്ചയും സൂചിപ്പിക്കുന്ന עלה എന്ന ക്രിയയുടെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ഭവനം
  rationale: എബ്രായത്തിലെ ‘യഹ്‌വേയുടെ വീട്/ഭവനം’ എന്ന രൂപകം നിലനിർത്തുന്ന, ഗൗരവമുള്ള മലയാളപ്രയോഗം; ‘ആലയം’ എന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כָל אִישׁ יְהוּדָה
  choice: യെഹൂദയിലെ എല്ലാ പുരുഷന്മാരും
  rationale: אִישׁ എന്ന പദത്തിന്റെ പുരുഷലിംഗരൂപവും ഇവിടെ അതിനുള്ള സമൂഹപ്രാതിനിധ്യ സാധ്യതയും മറച്ചുവയ്ക്കാതെ നിലനിർത്തുന്നു.
- source_word: כָל יֹשְׁבֵי יְרוּשָׁלַם
  choice: യെരൂശലേം നിവാസികൾ എല്ലാവരും
  rationale: ഒരു സ്ഥലത്തു പാർക്കുന്നവരെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്തരൂപത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളം.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: ആരാധനാസന്ദർഭത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ പതിവായ മലയാള പരിഭാഷ.
- source_word: הַנְּבִיאִים
  choice: പ്രവാചകന്മാർ
  rationale: נְבִיאִים എന്നതിന്റെ പതിവായ മലയാള പരിഭാഷ.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: ചെറിയവർമുതൽ വലിയവർവരെ
  rationale: ജനത്തിന്റെ മുഴുവൻ സാമൂഹിക വ്യാപ്തിയും സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി അടുത്തായി നിലനിർത്തുന്നു; പ്രായപരിധിയെന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: അവൻ അവർ കേൾക്കെ വായിച്ചു
  rationale: എഴുതപ്പെട്ട പുസ്തകമാണ് കർമമെന്നതിനാൽ ‘വായിച്ചു’ കൃത്യമാണ്; ‘അവരുടെ ചെവികളിൽ’ എന്ന എബ്രായ ശൈലിയുടെ പൊതുശ്രവണഭാവം ‘അവർ കേൾക്കെ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: סֵפֶר הַבְּרִית
  choice: ഉടമ്പടിയുടെ പുസ്തകം
  rationale: בְּרִית എന്ന ബന്ധപരവും നിയമപരവുമായ പദത്തെ ‘ഉടമ്പടി’ എന്നു കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ചതുരക്ഷര നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: כָל אִישׁ יְהוּדָה എന്ന ലിംഗസൂചക സമൂഹപ്രയോഗം
  choice: യെഹൂദയിലെ എല്ലാ പുരുഷന്മാരും
  alternative: യെഹൂദയിലെ സകല ജനവും
  rationale: മൂലത്തിലെ אִישׁ എന്ന പുരുഷലിംഗപദം നിലനിർത്തുന്നു; അത് വിശാല ജനസമൂഹത്തെ പ്രതിനിധീകരിച്ചിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് സ്വീകരിച്ചത്. പട്ടികയുടെ ദൈർഘ്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ഹീബ്രു വിവരണക്രമവും എല്ലാ ഘടകങ്ങളും നിലനിർത്തി. ‘അവർ കേൾക്കെ’ എന്നത് പൊതുവായ ശ്രവണവായനയുടെ ഭാവം ലളിതമായി നൽകുന്നു.
