  text: וְ/גַ֣ם אֶת הָ/אֹב֣וֹת וְ/אֶת הַ֠/יִּדְּעֹנִים וְ/אֶת הַ/תְּרָפִ֨ים וְ/אֶת הַ/גִּלֻּלִ֜ים וְ/אֵ֣ת כָּל הַ/שִּׁקֻּצִ֗ים אֲשֶׁ֤ר נִרְאוּ֙ בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בִ/יר֣וּשָׁלִַ֔ם בִּעֵ֖ר יֹֽאשִׁיָּ֑הוּ לְ֠מַעַן הָקִ֞ים אֶת דִּבְרֵ֤י הַ/תּוֹרָה֙ הַ/כְּתֻבִ֣ים עַל הַ/סֵּ֔פֶר אֲשֶׁ֥ר מָצָ֛א חִלְקִיָּ֥הוּ הַ/כֹּהֵ֖ן בֵּ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
translation:
  language: ml
  text: കൂടാതെ, യോശീയാവ് യെഹൂദാദേശത്തും യെരൂശലേമിലും കാണപ്പെട്ടിരുന്ന മരിച്ചവരുമായി ബന്ധപ്പെടുന്നവരെയും ആത്മവിദ്യക്കാരെയും ഗൃഹദേവന്മാരെയും വിഗ്രഹങ്ങളെയും സകല വെറുക്കപ്പെട്ട വസ്തുക്കളെയും നീക്കിക്കളഞ്ഞു; പുരോഹിതനായ ഹിൽക്കീയാവ് യഹോവയുടെ ആലയത്തിൽ കണ്ടെത്തിയ പുസ്തകത്തിൽ[a] എഴുതപ്പെട്ട ന്യായപ്രമാണത്തിലെ വചനങ്ങൾ പ്രാബല്യത്തിൽ വരുത്തേണ്ടതിനായി തന്നേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചുരുളിൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം ചുരുൾരൂപത്തിലുള്ള എഴുതപ്പെട്ട രേഖയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: കൂടാതെ
  rationale: മുൻവിവരണത്തോട് മറ്റൊരു പരിഷ്കരണനടപടി കൂട്ടിച്ചേർക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സംയോജകബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָאֹבוֹת
  choice: മരിച്ചവരുമായി ബന്ധപ്പെടുന്നവർ
  rationale: ഈ സന്ദർഭത്തിൽ മരിച്ചവരോട് ആലോചന ചോദിക്കുന്ന നിഗൂഢവിദ്യാപ്രവർത്തകരെയാണ് സൂചിപ്പിക്കുന്നത്; ആത്മാക്കളെത്തന്നെയെന്ന് നിർണയിക്കാതെ പ്രവർത്തകരെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: הַיִּדְּעֹנִים
  choice: ആത്മാക്കളോട് അരുളപ്പാട് ചോദിക്കുന്നവർ
  rationale: אֹבוֹת എന്നതിനോടു ചേർന്നുവരുന്ന മറ്റൊരു നിഗൂഢവിദ്യാപ്രവർത്തകവിഭാഗം; പഴഞ്ചൻ അല്ലെങ്കിൽ അസ്പഷ്ടമായ പദം ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് പ്രവർത്തനം ഗ്രഹിക്കാവുന്ന വിധം നൽകി.
- source_word: הַתְּרָפִים
  choice: ഗൃഹദേവന്മാർ
  rationale: വീട്ടാരാധനയുമായി ബന്ധപ്പെട്ട ദേവപ്രതിമകളെയോ ദൈവവസ്തുക്കളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പ്രവർത്തനപരമായ അർഥം നൽകുന്നു.
- source_word: הַגִּלֻּלִים
  choice: വിഗ്രഹങ്ങൾ
  rationale: പദത്തിലെ നിന്ദാസൂചന മുഴുവനായി സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കാൻ പ്രയാസമുള്ളതിനാൽ വ്യക്തവും പതിവുമായ മലയാള പദം ഉപയോഗിച്ചു.
- source_word: כָּל הַשִּׁקֻּצִים
  choice: സകല മ്ലേച്ഛവസ്തുക്കൾ
  rationale: ആരാധനാപരമായും ധാർമികമായും വെറുക്കപ്പെടുന്ന വസ്തുക്കളുടെ വിശാല വിഭാഗം നിലനിർത്തുന്നു.
- source_word: נִרְאוּ
  choice: കണ്ടിരുന്ന
  rationale: നിഫാൽ രൂപത്തിന്റെ ദൃശ്യമായിരിക്കുക/കാണപ്പെടുക എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בִּעֵר
  choice: നീക്കിക്കളഞ്ഞു
  rationale: മനുഷ്യരും വസ്തുക്കളും ഉൾപ്പെടുന്ന പട്ടികയായതിനാൽ ചുട്ടുകളഞ്ഞു എന്ന പ്രത്യേക രീതി ചുമത്താതെ സമഗ്രമായ ഉന്മൂലനം സൂചിപ്പിക്കുന്നു.
- source_word: לְמַעַן הָקִים
  choice: പ്രാബല്യത്തിൽ വരുത്തുന്നതിനായി
  rationale: ന്യായപ്രമാണവചനങ്ങളെ നിലനിറുത്തുക, നടപ്പാക്കുക എന്ന ലക്ഷ്യബലം നൽകുന്നു; പ്രവചനനിവൃത്തി എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: ന്യായപ്രമാണത്തിലെ വചനങ്ങൾ
  rationale: കണ്ടെത്തിയ രേഖയിലെ ഉടമ്പടിസംബന്ധമായ നിയമോപദേശത്തെ സന്ദർഭോചിതമായ മലയാള ബൈബിൾഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַכְּתֻבִים עַל הַסֵּפֶר
  choice: പുസ്തകത്തിൽ എഴുതിയിരുന്ന
  rationale: സാധാരണ വായനയ്ക്ക് സ്വാഭാവികമായ രൂപം; סֵפֶר ചുരുൾരേഖയെയും സൂചിപ്പിക്കാമെന്ന ഭൗതിക അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: ഇവിടെ ദൈവാലയമാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ 'ആലയം' സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്, അതേസമയം ദൈവനാമം പദ്ധതിയുടെ നയപ്രകാരം ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു; ഒരു പ്രത്യേക സമുദായത്തിന്റെ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: לְמַעַן הָקִים എന്നതിന്റെ നിയമശാസ്ത്രപരമായ ഭാവം
  choice: പ്രാബല്യത്തിൽ വരുത്തുന്നതിനായി
  alternative: നിവർത്തിക്കേണ്ടതിന്
  rationale: വചനങ്ങളെ നടപ്പാക്കുക/സ്ഥിരീകരിക്കുക എന്ന സന്ദർഭാർഥം നൽകുകയും പ്രവചനനിവൃത്തി എന്ന പരിമിതമായ ദൈവശാസ്ത്രവായന ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വ്യക്തതയും പാലിച്ചു. അപൂർവമായ നിഗൂഢവിദ്യാപദങ്ങൾക്ക് അസ്പഷ്ടമായ ലിപ്യന്തരണം പകരം പ്രവർത്തനവിവരണം നൽകി; വാക്യഭാരം കുറയ്ക്കാൻ രണ്ടാമത്തെ വാക്യത്തിൽ ലക്ഷ്യം വ്യക്തമാക്കി.
