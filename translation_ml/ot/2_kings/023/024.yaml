  to: കൂടാതെ, യോശീയാവ് യെഹൂദാദേശത്തും യെരൂശലേമിലും കാണപ്പെട്ടിരുന്ന മരിച്ചവരുമായി ബന്ധപ്പെടുന്നവരെയും ആത്മവിദ്യക്കാരെയും ഗൃഹദേവന്മാരെയും വിഗ്രഹങ്ങളെയും സകല വെറുക്കപ്പെട്ട വസ്തുക്കളെയും നീക്കിക്കളഞ്ഞു; പുരോഹിതനായ ഹിൽക്കീയാവ് യഹോവയുടെ ആലയത്തിൽ കണ്ടെത്തിയ പുസ്തകത്തിൽ[a] എഴുതപ്പെട്ട ന്യായപ്രമാണത്തിലെ വചനങ്ങൾ പ്രാബല്യത്തിൽ വരുത്തേണ്ടതിനായി തന്നേ.
