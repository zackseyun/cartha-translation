  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
translation:
  language: ml
  text: ബേഥേലിൽ, ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച നെബാത്തിന്റെ മകനായ യൊരോബെയാം നിർമിച്ച പൂജാഗിരിയിലുണ്ടായിരുന്ന യാഗപീഠവും—ആ യാഗപീഠവും പൂജാഗിരിയും—അവൻ ഇടിച്ചുകളഞ്ഞു. അവൻ പൂജാഗിരി ചുട്ട് പൊടിയാക്കി; അശേരായെയും[a] ചുട്ടുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അശേരാപ്രതിഷ്ഠ.” എബ്രായപദം അശേരാ ആരാധനയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പിക്കുന്ന പീഠത്തെ സൂചിപ്പിക്കുന്ന מִזְבֵּחַ എന്ന പദത്തിന്റെ സ്വാഭാവികവും പ്രചാരമുള്ളതുമായ മലയാളരൂപം.
- source_word: בְּבֵית אֵל
  choice: ബേഥേലിലുണ്ടായിരുന്ന
  rationale: സ്ഥലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും തുടർന്നുള്ള ബന്ധവാക്യവുമായി സുഗമമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: הַבָּמָה
  choice: പൂജാഗിരി
  rationale: בָּמָה സൂചിപ്പിക്കുന്ന ആരാധനയ്ക്കായുള്ള ഉയർന്ന സ്ഥലത്തിന്റെ സാങ്കേതിക മതപരമായ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; വെറും 'ഉയർന്ന സ്ഥലം' എന്നതിനെക്കാൾ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: עָשָׂה
  choice: നിർമിച്ച
  rationale: ആരാധനാസ്ഥലം സ്ഥാപിച്ചതിനെ ഇവിടെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ പൊതുവായ 'ഉണ്ടാക്കി' എന്ന ആശയം അനാവശ്യമായി വിപുലീകരിക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥം നേരിട്ട് നിലനിർത്തുന്നു; 'പാപത്തിലേക്കു നയിച്ച' എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: הַמִּזְבֵּחַ הַהוּא
  choice: അതേ യാഗപീഠം
  rationale: ഗַּם എന്ന ആവർത്തനവും നിർദേശകപദവും നൽകുന്ന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נָתָץ
  choice: ഇടിച്ചുകളഞ്ഞു
  rationale: ഒരു നിർമിതിയെ തകർത്തു നിലംപരിശാക്കുക എന്ന ക്രിയയുടെ ശക്തി വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּשְׂרֹף אֶת־הַבָּמָה
  choice: പൂജാഗിരി ചുട്ട്
  rationale: ഒരേ എബ്രായപദത്തിന് ഒരേ മലയാളപദം ഉപയോഗിച്ച് പദസുസ്ഥിരത പാലിക്കുന്നു; ഇവിടെ സ്ഥലത്തെ ആരാധനാസംവിധാനങ്ങളും ഉൾപ്പെടുന്ന വിശാല പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: הֵדַק לְעָפָר
  choice: പൊടിയാക്കി
  rationale: പൂർണമായി പൊടിച്ചുകളഞ്ഞ ഫലം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֵׁרָה
  choice: അശേരാ
  rationale: ദേവിയെയോ അവളുടെ ആരാധനയുമായി ബന്ധപ്പെട്ട പ്രതിഷ്ഠയെയോ സൂചിപ്പിക്കാവുന്ന എബ്രായപദത്തിന്റെ അർഥവ്യാപ്തി ചുരുക്കാതെ പേരുതന്നെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֲשֵׁרָה എന്നതിന്റെ സൂചന
  choice: അശേരാ
  alternative: അശേരാപ്രതിഷ്ഠ / വിശുദ്ധസ്തംഭം
  rationale: നശിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ അശേരാ ആരാധനയുമായി ബന്ധപ്പെട്ട മരനിർമിത വസ്തുവായിരിക്കാനാണ് കൂടുതൽ സാധ്യത. എങ്കിലും എബ്രായപദത്തിന് ദേവിയെയും ആരാധനാവസ്തുവിനെയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ മുഖ്യപാഠം ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; കൂടുതൽ വ്യക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ എബ്രായവാക്യത്തിന്റെ ബന്ധങ്ങൾ വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു. യൊരോബെയാം, നെബാത്ത്, ബേഥേൽ എന്നീ പരമ്പരാഗത ബൈബിൾ നാമരൂപങ്ങൾ നിലനിർത്തി; ആരാധനാസ്ഥലത്തിന്റെ മതപരമായ അർഥം വ്യക്തമാക്കാൻ 'പൂജാഗിരി' ഉപയോഗിച്ചു.
