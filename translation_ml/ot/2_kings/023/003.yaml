revisions:
- from: 'പിന്നെ രാജാവ് തൂണിനരികെ നിന്നുകൊണ്ട് യഹോവയുടെ സന്നിധിയിൽ ഉടമ്പടി ചെയ്തു: യഹോവയുടെ പിന്നാലെ നടക്കാനും, തന്റെ ഹൃദയം മുഴുവനോടും ജീവൻ മുഴുവനോടുംകൂടെ അവിടുത്തെ കല്പനകളും സാക്ഷ്യങ്ങളും ചട്ടങ്ങളും പാലിക്കാനും, ഈ പുസ്തകത്തിൽ[a] എഴുതിയിരുന്ന ഈ ഉടമ്പടിയുടെ വചനങ്ങൾ നടപ്പാക്കാനും. ജനമെല്ലാം ആ ഉടമ്പടിയിൽ ചേർന്നു[b].'
  to: 'പിന്നെ രാജാവ് തൂണിനരികെ നിന്നുകൊണ്ട് യഹോവയുടെ സന്നിധിയിൽ ഉടമ്പടി ചെയ്തു: യഹോവയുടെ പിന്നാലെ നടക്കാനും, തന്റെ പൂർണഹൃദയത്തോടും പൂർണജീവനോടുംകൂടെ അവിടുത്തെ കല്പനകളും സാക്ഷ്യങ്ങളും ചട്ടങ്ങളും പാലിക്കാനും, ഈ പുസ്തകത്തിൽ[a] എഴുതിയിരിക്കുന്ന ഈ ഉടമ്പടിയുടെ വചനങ്ങൾ നടപ്പാക്കാനും. ജനമെല്ലാം ആ ഉടമ്പടിയിൽ ചേർന്നു[b].'
  rationale: Only a safe grammatical and stylistic correction has been made. ‘പൂർണഹൃദയത്തോടും പൂർണജീവനോടുംകൂടെ’ faithfully preserves the Hebrew’s repeated ‘with all’ formulation and the distinct terms ‘heart’ and נפשׁ, while reading naturally in modern standard Malayalam. ‘എഴുതിയിരിക്കുന്ന’ is also used for the present textual state of the covenant words in the book. Footnote anchors remain correctly attached to ‘പുസ്തകത്തിൽ’ and to the people’s covenant response.
