reference: 2 Kings 23:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד הַ֠/מֶּלֶךְ עַֽל הָ֨/עַמּ֜וּד וַ/יִּכְרֹ֥ת אֶֽת הַ/בְּרִ֣ית לִ/פְנֵ֣י יְהוָ֗ה לָ/לֶ֜כֶת אַחַ֤ר יְהוָה֙ וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֜י/ו וְ/אֶת עֵדְוֺתָ֤י/ו וְ/אֶת חֻקֹּתָי/ו֙ בְּ/כָל לֵ֣ב וּ/בְ/כָל נֶ֔פֶשׁ לְ/הָקִ֗ים אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את הַ/כְּתֻבִ֖ים עַל הַ/סֵּ֣פֶר הַ/זֶּ֑ה וַ/יַּעֲמֹ֥ד כָּל הָ/עָ֖ם בַּ/בְּרִֽית־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
translation:
  language: ml
  text: 'പിന്നെ രാജാവ് തൂണിനരികെ നിന്നുകൊണ്ട് യഹോവയുടെ സന്നിധിയിൽ ഉടമ്പടി ചെയ്തു: യഹോവയുടെ പിന്നാലെ നടക്കാനും, തന്റെ പൂർണഹൃദയത്തോടും പൂർണജീവനോടുംകൂടെ അവിടുത്തെ കല്പനകളും സാക്ഷ്യങ്ങളും ചട്ടങ്ങളും പാലിക്കാനും, ഈ പുസ്തകത്തിൽ[a] എഴുതിയിരിക്കുന്ന ഈ ഉടമ്പടിയുടെ വചനങ്ങൾ നടപ്പാക്കാനും. ജനമെല്ലാം ആ ഉടമ്പടിയിൽ ചേർന്നു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ചുരുളിൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം ചുരുളിനെയോ പുസ്തകം/രേഖയെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ജനമെല്ലാം ഉടമ്പടിയിൽ നിന്നു.” ഈ പ്രയോഗം അവർ ഉടമ്പടി അംഗീകരിച്ച് അതിനോടു പ്രതിബദ്ധരായി എന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד ... עַל הָעַמּוּד
  choice: തൂണിനരികെ നിന്നുകൊണ്ട്
  rationale: עַל എന്ന പദത്തിന് ‘മേൽ’ എന്നും ‘അരികിൽ/അടുത്ത്’ എന്നും സ്ഥാനസൂചന നൽകാം. രാജകീയ ചടങ്ങിന്റെ സാഹചര്യത്തിൽ രാജാവ് തൂണിന്റെ മുകളിൽ നിന്നു എന്നതിനെക്കാൾ തൂണിനരികിലെ നിശ്ചിത സ്ഥാനത്ത് നിന്നു എന്നതാണ് സ്വാഭാവികം.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: ഉടമ്പടി ചെയ്തു
  rationale: כרת ברית എന്നത് അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിച്ചു’ എന്നായാലും, ഉടമ്പടി സ്ഥാപിക്കുകയോ ഔപചാരികമായി ഉറപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. ‘ഉടമ്പടി ചെയ്തു’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ഇവിടെ ‘മുമ്പാകെ/സന്നിധിയിൽ’ എന്നാണ്. ‘സന്നിധിയിൽ’ ചടങ്ങിന്റെ ഗൗരവവും ദൈവസാന്നിധ്യവും വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: לָלֶכֶת אַחַר יְהוָה
  choice: യഹോവയുടെ പിന്നാലെ നടക്കാനും
  rationale: ‘പിന്നാലെ നടക്കുക’ എന്ന ഹീബ്രു ഉടമ്പടിപ്രയോഗത്തിലെ നടപ്പിന്റെ രൂപകം നിലനിർത്തുന്നു; അതേസമയം ദൈവത്തെ അനുഗമിക്കുക എന്ന അർഥവും മലയാളത്തിൽ ഗ്രഹിക്കാം.
- source_word: מִצְוֺתָיו ... עֵדְוֺתָיו ... חֻקֹּתָיו
  choice: അവിടുത്തെ കല്പനകളും സാക്ഷ്യങ്ങളും ചട്ടങ്ങളും
  rationale: മൂന്നു വ്യത്യസ്ത നിയമപദങ്ങളെയും ഒന്നാക്കി ചുരുക്കാതെ വേർതിരിച്ചു നിലനിർത്തുന്നു. ‘കല്പനകൾ,’ ‘സാക്ഷ്യങ്ങൾ,’ ‘ചട്ടങ്ങൾ’ എന്നിവ യഥാക്രമം കല്പന, സാക്ഷ്യസ്വഭാവമുള്ള ഉടമ്പടിനിർദേശങ്ങൾ, നിശ്ചിത നിയമങ്ങൾ എന്നീ ആശയങ്ങൾ നൽകുന്നു.
- source_word: בְּכָל לֵב וּבְכָל נֶפֶשׁ
  choice: തന്റെ ഹൃദയം മുഴുവനോടും ജീവൻ മുഴുവനോടുംകൂടെ
  rationale: לֵב എന്നതിലെ ‘ഹൃദയം’ നിലനിർത്തുകയും נֶפֶשׁ എന്നതിന് സാഹചര്യത്തിൽ വ്യക്തിയുടെ ജീവൻ/സത്ത മുഴുവൻ എന്ന വ്യാപ്തിയുള്ള ‘ജീവൻ’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു. ഇതിലൂടെ സമ്പൂർണ സമർപ്പണം വ്യക്തമാകുന്നു.
- source_word: לְהָקִים
  choice: നടപ്പാക്കാനും
  rationale: ഇവിടെ ഉടമ്പടിവചനങ്ങളെ പ്രാബല്യത്തിൽ കൊണ്ടുവന്ന് അനുസരിക്കുക എന്നതാണ് ആശയം. ‘നടപ്പാക്കുക’ ആ പ്രവർത്തനപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: ഈ ഉടമ്പടിയുടെ വചനങ്ങൾ
  rationale: דִּבְרֵי എന്നതിന്റെ ‘വചനങ്ങൾ’ എന്ന രൂപം, തുടർന്ന് അവ എഴുതിയിരിക്കുന്നതായി പറയുന്ന പാഠകേന്ദ്രിതമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: ജനമെല്ലാം ആ ഉടമ്പടിയിൽ ചേർന്നു
  rationale: അക്ഷരാർഥത്തിലെ ‘ഉടമ്പടിയിൽ നിന്നു’ എന്ന പ്രയോഗത്തിന്റെ സാഹചര്യാർഥം ജനത്തിന്റെ കൂട്ടായ ഉടമ്പടി അംഗീകാരവും പ്രതിബദ്ധതയുമാണ്. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ച് അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ സവിശേഷ നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം നിലനിർത്തുന്നു.
- issue: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית എന്ന ഉടമ്പടി-പ്രതിബദ്ധതാ പ്രയോഗം
  choice: ജനമെല്ലാം ആ ഉടമ്പടിയിൽ ചേർന്നു
  alternative: ജനമെല്ലാം ഉടമ്പടിയിൽ നിന്നു
  rationale: ജനങ്ങൾ ഉടമ്പടി അംഗീകരിച്ച് അതിനോടു പ്രതിബദ്ധരായി എന്ന സാഹചര്യാർഥം സ്വാഭാവികമായി നൽകുന്നു. ‘നിന്നു’ എന്ന അക്ഷരരൂപത്തിൽ പ്രതിബദ്ധതയുടെ അധിക സൂചന ഉണ്ടായേക്കാമെന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഉടമ്പടി, കല്പന, സാക്ഷ്യം, ചട്ടം, വചനം തുടങ്ങിയ ബൈബിൾ-നിയമ പദങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന രീതിയിൽ നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലഹീബ്രുവും അടിക്കുറിപ്പുകളുടെ യഥാർഥ വിഷയവും അനുസരിച്ച് [a] ‘പുസ്തകം’ എന്നതിനുശേഷവും [b] ജനത്തിന്റെ ഉടമ്പടി പ്രവേശനത്തിനുശേഷവും സ്ഥാപിച്ചു.
