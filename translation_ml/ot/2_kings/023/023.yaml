id: 2KI.23.23
reference: 2 Kings 23:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֗י אִם בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹֽאשִׁיָּ֑הוּ נַעֲשָׂ֞ה הַ/פֶּ֧סַח הַ/זֶּ֛ה לַ/יהוָ֖ה בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/023.yaml
  text: but only in the eighteenth year of King Josiah was this Passover kept for Yahweh in Jerusalem[a].
translation:
  language: ml
  text: എന്നാൽ യോശീയാരാജാവിന്റെ പതിനെട്ടാം ഭരണവർഷത്തിൽ മാത്രമാണ് ഈ പെസഹ യെരൂശലേമിൽ യഹ്‌വേക്കായി ആചരിക്കപ്പെട്ടത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ചെയ്യപ്പെട്ടു”; സന്ദർഭത്തിൽ “ആചരിക്കപ്പെട്ടു” അഥവാ “അനുഷ്ഠിക്കപ്പെട്ടു” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: എന്നാൽ ... മാത്രമാണ്
  rationale: മുൻവാക്യത്തിൽ ഇത്തരമൊരു പെസഹ ആചരിക്കപ്പെട്ടിരുന്നില്ലെന്ന പ്രസ്താവനയോടുള്ള വിരുദ്ധവും പരിമിതപ്പെടുത്തുന്നതുമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: യോശീയാരാജാവിന്റെ പതിനെട്ടാം ഭരണവർഷത്തിൽ
  rationale: രാജാവിന്റെ ഭരണകാലം എണ്ണുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായി നൽകാൻ ‘ഭരണവർഷം’ ഉപയോഗിച്ചു.
- source_word: נַעֲשָׂה
  choice: ആചരിക്കപ്പെട്ടത്
  rationale: പദശഃ ‘ചെയ്യപ്പെട്ടു’ എന്നാണെങ്കിലും പെസഹയോടൊപ്പം ഉത്സവം അനുഷ്ഠിക്കുക/ആചരിക്കുക എന്ന സന്ദർഭാർഥമാണ്; ഹീബ്രുവിലെ കർമണിപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: הַפֶּסַח הַזֶּה
  choice: ഈ പെസഹ
  rationale: നിർദ്ദേശകപദം ഉൾപ്പെടുന്ന ഹീബ്രു പദസമുച്ചയത്തിന്റെ നേരിട്ടും നിലവാരമുള്ളതുമായ മലയാളരൂപം.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കായി
  rationale: לְ സമർപ്പണം അഥവാ ദിശ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആയി’ സ്വാഭാവികമാണ്; ദൈവനാമമായ יהוה ശീർഷകമാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലസൂചകമായ בְ-യുടെ അർഥം മലയാളത്തിലെ ‘-ൽ’ വിഭക്തിയിലൂടെ നൽകി; പേരിന് പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുശീർഷകമാക്കി മാറ്റാതെ ആധുനിക മലയാളത്തിൽ ഉച്ചാരണസഹായകമായി ലിപ്യന്തരിച്ചു; കൃത്യമായ പുരാതന ഉച്ചാരണം സംബന്ധിച്ച പരിമിതി അംഗീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘യോശീയാരാജാവ്’ എന്ന രൂപം സ്വാഭാവിക സംയുക്തമായി ഉപയോഗിച്ചു; കാലഗണന വ്യക്തമാക്കാൻ ‘ഭരണവർഷം’ ചേർത്തു. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
