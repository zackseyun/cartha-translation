id: 2KI.23.14
reference: 2 Kings 23:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּב֔וֹת וַ/יִּכְרֹ֖ת אֶת הָ/אֲשֵׁרִ֑ים וַ/יְמַלֵּ֥א אֶת מְקוֹמָ֖/ם עַצְמ֥וֹת אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/014.yaml
  text: He shattered the pillars[a], cut down the Asherim, and filled their places with human bones.
translation:
  language: ml
  text: അവൻ സ്തംഭങ്ങൾ തകർത്തു; അശേരീം[a] വെട്ടിവീഴ്ത്തി; അവയുടെ സ്ഥലങ്ങൾ മനുഷ്യ അസ്ഥികൾകൊണ്ട് നിറച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അശേരാ തൂണുകൾ.’ അശേരീം എന്ന ഹീബ്രുപദം അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെ സൂചിപ്പിക്കാം; അവയുടെ കൃത്യമായ രൂപം ഈ പദം മാത്രം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּר
  choice: തകർത്തു
  rationale: കഷണങ്ങളാക്കുന്ന തരത്തിലുള്ള ശക്തമായ നശിപ്പിക്കൽ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמַּצֵּבוֹת
  choice: സ്തംഭങ്ങൾ
  rationale: ആരാധനയുമായി ബന്ധപ്പെട്ട് നാട്ടിയിരുന്ന കൽസ്തംഭങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം വാക്യത്തിൽ ചേർക്കാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּכְרֹת
  choice: വെട്ടിവീഴ്ത്തി
  rationale: മരനിർമിതമോ വൃക്ഷസദൃശമോ ആയ ആരാധനാവസ്തുക്കളെ മുറിച്ചുനീക്കുന്ന പ്രവൃത്തി സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
- source_word: הָאֲשֵׁרִים
  choice: അശേരീം
  rationale: അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളുടെ കൃത്യമായ രൂപം ഈ പദം മാത്രം നിർണയിക്കുന്നില്ല; അതിനാൽ പ്രത്യേക ഹീബ്രു പദം ലിപ്യന്തരണം ചെയ്ത് അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: וַיְמַלֵּא
  choice: നിറച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘നിറയ്ക്കുക’ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מְקוֹמָם
  choice: അവയുടെ സ്ഥലങ്ങൾ
  rationale: നശിപ്പിക്കപ്പെട്ട ആരാധനാവസ്തുക്കൾ ഉണ്ടായിരുന്ന ഇടങ്ങളിലേക്കുള്ള ബഹുവചന സർവനാമബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: עַצְמוֹת אָדָם
  choice: മനുഷ്യ അസ്ഥികൾ
  rationale: אָדָם ഇവിടെ പുരുഷനെ പ്രത്യേകമായി സൂചിപ്പിക്കാതെ മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘മനുഷ്യ അസ്ഥികൾ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മനുഷ്യ അസ്ഥികൾ
  alternative: മനുഷ്യന്റെ അസ്ഥികൾ / പുരുഷന്റെ അസ്ഥികൾ
  rationale: സന്ദർഭത്തിൽ אָדָם ലിംഗവിശേഷമുള്ള പ്രായപൂർത്തിയായ പുരുഷനെയല്ല, മനുഷ്യനെ പൊതുവായാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗനിഷ്പക്ഷമായ പൊതുവർഗാർഥം നിലനിർത്തുന്നു.
- issue: אֲשֵׁרִים എന്ന ആരാധനാപദത്തിന്റെ രൂപം
  choice: അശേരീം എന്ന ലിപ്യന്തരണം
  alternative: അശേരാ തൂണുകൾ
  rationale: ഈ ഹീബ്രു ബഹുവചനപദം അശേരയുമായി ബന്ധപ്പെട്ട വിവിധ ആരാധനാവസ്തുക്കളെ സൂചിപ്പിക്കാം; അവ നിർബന്ധമായും തൂണുകളായിരുന്നു എന്നു പ്രധാനപാഠത്തിൽ തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. തുടർച്ചയായ മൂന്ന് പ്രവൃത്തികൾ അർധവിരാമങ്ങളാൽ വേർതിരിച്ച് മൂലവാക്യത്തിന്റെ താളം നിലനിർത്തി. പരിചിതമല്ലാത്ത ‘അശേരീം’ എന്ന പദത്തിന് അടിക്കുറിപ്പിൽ അർഥപരിധി നൽകി.
