source:
  edition: WLC
  text: וַ/יַּאַסְרֵ/הוּ֩ פַרְעֹ֨ה נְכֹ֤ה בְ/רִבְלָה֙ בְּ/אֶ֣רֶץ חֲמָ֔ת ב/מלך בִּ/ירוּשָׁלִָ֑ם וַ/יִּתֶּן עֹ֨נֶשׁ֙ עַל הָ/אָ֔רֶץ מֵאָ֥ה כִכַּר כֶּ֖סֶף וְ/כִכַּ֥ר זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
translation:
  language: ml
  text: ഫറവോൻ നെഖോ അവനെ ഹമാത്ത് ദേശത്തിലെ രിബ്ലായിൽ തടവിലാക്കി[a], അങ്ങനെ അവൻ യെരൂശലേമിൽ രാജാവായി വാഴാതിരിക്കേണ്ടതിന്[b]. അവൻ ദേശത്തിന്മേൽ നൂറു താലന്ത് വെള്ളിയും ഒരു താലന്ത് പൊന്നും കപ്പമായി[c] ചുമത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ ബന്ധിച്ചു’ അല്ലെങ്കിൽ ‘ബന്ധനത്തിലാക്കി.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ പ്രയോഗം ‘അവൻ യെരൂശലേമിൽ രാജാവായി വാഴാതിരിക്കേണ്ടതിന്,’ ‘അവനെ യെരൂശലേമിൽ രാജാവായി വാഴുന്നതിൽനിന്ന് തടഞ്ഞ്,’ അല്ലെങ്കിൽ ‘അവൻ യെരൂശലേമിൽ രാജാവായി വാഴുമ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: c
    text: ‘കപ്പമായി’ എന്നതിനുപകരം ‘ശിക്ഷയായി’ അല്ലെങ്കിൽ ‘പിഴയായി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  choice: അവനെ ... തടവിലാക്കി
  rationale: אסר എന്ന ക്രിയയ്ക്ക് ‘ബന്ധിക്കുക’, ‘തടവിലാക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. രാജകീയ-രാഷ്ട്രീയ സാഹചര്യത്തിൽ നിർബന്ധിത തടങ്കൽ വ്യക്തമാക്കാൻ ‘തടവിലാക്കി’ സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: פַרְעֹה נְכֹה
  choice: ഫറവോൻ നെഖോ
  rationale: ഭരണപദവിയായ ‘ഫറവോൻ’ നിലനിർത്തി, നെഖോ എന്ന വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: בְרִבְלָה
  choice: രിബ്ലായിൽ
  rationale: സംഭവം നടന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനവിഭക്തി ഉപയോഗിച്ചു.
- source_word: בְּאֶרֶץ חֲמָת
  choice: ഹമാത്ത് ദേശത്തിലെ
  rationale: אֶרֶץ ഇവിടെ ഭൂമിശാസ്ത്രപരമായ പ്രദേശമാണ്; രിബ്ലായുടെ സ്ഥാനം വ്യക്തമാക്കാൻ ‘ഹമാത്ത് ദേശത്തിലെ’ എന്നു നൽകി.
- source_word: במלך בִּירוּשָׁלָם
  choice: അങ്ങനെ അവൻ യെരൂശലേമിൽ രാജാവായി വാഴാതിരിക്കേണ്ടതിന്
  rationale: സന്ദർഭത്തിൽ ഈ പ്രയോഗം തടവിലാക്കിയതിന്റെ ലക്ഷ്യമോ ഫലമോ—യെരൂശലേമിൽ തുടർന്നു രാജാവായി വാഴുന്നത് തടയുക—സൂചിപ്പിക്കുന്നതായി ഗ്രഹിച്ചു. എബ്രായ ഘടനയുടെ മറ്റൊരു സാധ്യമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיִּתֶּן עֹנֶשׁ
  choice: കപ്പമായി ... ചുമത്തി
  rationale: עֹנֶשׁ ശിക്ഷ, പിഴ, നിർബന്ധിത പണം എന്നിവ സൂചിപ്പിക്കാം. രാജ്യത്തിന്മേൽ വെള്ളിയുടെയും പൊന്നിന്റെയും നിശ്ചിത അളവ് ചുമത്തുന്ന രാഷ്ട്രീയ സാഹചര്യത്തിൽ ‘കപ്പം’ യോജിക്കുന്നു; പിഴ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ദേശത്തിന്മേൽ
  rationale: ഇവിടെ הָאָרֶץ നികുതിഭാരം ചുമത്തപ്പെട്ട യെഹൂദാ ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; എബ്രായ രൂപവും കൂട്ടായ രാഷ്ട്രീയ അർഥവും നിലനിർത്തുന്നു.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: നൂറു താലന്ത് വെള്ളി
  rationale: כִּכָּר എന്ന പുരാതന തൂക്കയളവ് ആധുനിക അളവിലേക്ക് അനുമാനിച്ച് മാറ്റാതെ ‘താലന്ത്’ എന്നു നിലനിർത്തി.
- source_word: וְכִכַּר זָהָב
  choice: ഒരു താലന്ത് പൊന്ന്
  rationale: മൂലത്തിലെ ഏകവചനം നിലനിർത്തി; പുരാതന തൂക്കയളവിന് ‘താലന്ത്’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: യെരൂശലേമിലെ രാജവാഴ്ചയുമായി ബന്ധപ്പെട്ട ב + infinitive construct പ്രയോഗത്തിന്റെ ബന്ധം
  choice: 'തടങ്കലിന്റെ ലക്ഷ്യം/ഫലം സൂചിപ്പിക്കുന്നതായി: ‘വാഴാതിരിക്കേണ്ടതിന്’'
  alternative: ‘യെരൂശലേമിൽ വാഴുന്നതിൽനിന്ന്’
  rationale: നെഖോ രാജാവിനെ തടവിലാക്കിയതിന്റെ രാഷ്ട്രീയ ഫലമാണ് സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്. എങ്കിലും എബ്രായ പ്രയോഗത്തിന്റെ വ്യാകരണപരമായ വ്യത്യസ്ത അവതരണം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു; പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. പുരാതന തൂക്കയളവായ ‘താലന്ത്’ നിലനിർത്തി. സ്ഥലനാമങ്ങൾക്ക് ‘രിബ്ലാ’, ‘ഹമാത്ത്’, വ്യക്തിനാമത്തിന് ‘നെഖോ’ എന്നീ രൂപങ്ങൾ സ്വീകരിച്ചു. മൂലത്തിലെ അർഥസാധ്യതകൾ മുഖ്യവാചകത്തിൽ അമിതമായി വിശദീകരിക്കാതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
