  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
translation:
  language: ml
  text: എങ്കിലും യഹ്‌വെ തന്റെ ഉഗ്രമായ മഹാകോപത്തിൽനിന്ന് പിന്തിരിഞ്ഞില്ല[a]; മനശ്ശെ അവനെ പ്രകോപിപ്പിച്ച സകല പ്രകോപനങ്ങളും നിമിത്തം അവന്റെ കോപം യെഹൂദയ്ക്കെതിരെ[b] ജ്വലിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു വിവർത്തനം: “തന്റെ ജ്വലിക്കുന്ന മഹാകോപത്തിൽനിന്ന്.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ മൂക്ക്/കോപം ജ്വലിക്കുന്നതായി പറയുന്നു; അത് അതിതീവ്രമായ കോപത്തെ സൂചിപ്പിക്കുന്ന ശൈലിയാണ്.'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “യെഹൂദയിൽ.” എബ്രായ പൂർവപ്രത്യയത്തിന്റെ അക്ഷരാർഥം “യിൽ” എന്നാണ്; എന്നാൽ ഇവിടെ യെഹൂദയാണ് കോപത്തിന്റെ ലക്ഷ്യം.
    reason: lexical_alternative
lexical_decisions:
