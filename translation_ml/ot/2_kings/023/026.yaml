  choice: എങ്കിലും
  rationale: യോശീയാവിന്റെ പരിഷ്കാരങ്ങൾ വിവരിച്ച മുൻസന്ദർഭത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שָׁב
  choice: പിന്തിരിഞ്ഞില്ല
  rationale: ‘തിരിയുക/മടങ്ങുക’ എന്ന അടിസ്ഥാനരൂപകം നിലനിർത്തുന്നു; ‘ശമിച്ചില്ല’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം മുൻകൂട്ടി നിർണയിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ YHWH-യുടെ മലയാള ലിപ്യന്തരണം.
- source_word: מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  choice: തന്റെ ഉഗ്രമായ മഹാകോപത്തിൽനിന്ന്
  rationale: חֲרוֹן אַף എന്ന തീവ്രകോപസൂചകമായ എബ്രായ പ്രയോഗവും הַגָּדוֹל എന്ന വിശേഷണവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിലെ ദേഹരൂപകം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר חָרָה אַפּוֹ
  choice: അവന്റെ കോപം ... ജ്വലിച്ചിരുന്നു
  rationale: കോപം ‘ജ്വലിക്കുക’ എന്ന എബ്രായ ആവർത്തനചിത്രം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: בִּיהוּדָה
  choice: യെഹൂദയ്ക്കെതിരെ
  rationale: പൂർവപ്രത്യയം അക്ഷരാർഥത്തിൽ ‘യെഹൂദയിൽ’ എന്നാണെങ്കിലും, ഇവിടെ കോപത്തിന്റെ ലക്ഷ്യം യെഹൂദയാണെന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: עַל כָּל הַכְּעָסִים
  choice: സകല പ്രകോപനങ്ങളും നിമിത്തം
  rationale: കോപം ഉളവാക്കിയ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന ബഹുവചന നാമത്തിന്റെ കാരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: הִכְעִיסוֹ
  choice: അവനെ പ്രകോപിപ്പിച്ച
  rationale: ‘കോപിപ്പിക്കുക’ എന്ന ഹിഫീൽ കാരണാർഥം നിലനിർത്തുകയും മുൻപുള്ള ‘പ്രകോപനങ്ങൾ’ എന്ന പദവുമായി മൂലത്തിലെ പദബന്ധം പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מְנַשֶּׁה
  choice: മനശ്ശെ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾ രൂപം.
theological_decisions:
- issue: ദൈവത്തിന്റെ കോപത്തെക്കുറിച്ചുള്ള ദേഹരൂപക ഭാഷ
  choice: ‘ഉഗ്രമായ മഹാകോപം’, ‘കോപം ജ്വലിച്ചിരുന്നു’ എന്നീ ശക്തമായ കോപഭാഷ നിലനിർത്തി.
  alternative: ‘കടുത്ത അപ്രീതി’ എന്ന മൃദുവാക്കിയ രൂപം.
  rationale: മൂലപാഠം חֲרוֹן אַף, חָרָה אַפּוֹ എന്നീ ശക്തവും രൂപകാത്മകവുമായ പ്രയോഗങ്ങൾ ഉപയോഗിക്കുന്നു; അവയെ സിദ്ധാന്തപരമായി വിശദീകരിക്കുകയോ മൃദൂകരിക്കുകയോ ചെയ്യാതെ വിവർത്തനം ചെയ്യുന്നു.
- issue: ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: יְהוָה എന്ന വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ശൈലി. ‘പിന്തിരിഞ്ഞില്ല’ എന്നത് മൂലത്തിലെ ചലനരൂപകവും ‘ജ്വലിച്ചിരുന്നു’ എന്നത് ആവർത്തിച്ച അഗ്നിചിത്രവും നിലനിർത്തുന്നു. വാക്യത്തിലെ കാരണം–ഫലം ബന്ധവും മനശ്ശെയുടെ പ്രവൃത്തികൾക്കുള്ള ഊന്നലും സംരക്ഷിച്ചിട്ടുണ്ട്.
