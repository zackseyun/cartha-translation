id: 2KI.23.10
reference: 2 Kings 23:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/טִמֵּ֣א אֶת הַ/תֹּ֔פֶת אֲשֶׁ֖ר בְּ/גֵ֣י בני הִנֹּ֑ם לְ/בִלְתִּ֗י לְ/הַעֲבִ֨יר אִ֜ישׁ אֶת בְּנ֧/וֹ וְ/אֶת בִּתּ֛/וֹ בָּ/אֵ֖שׁ לַ/מֹּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
translation:
  language: ml
  text: അവൻ ബെൻ-ഹിന്നോം താഴ്വരയിലുള്ള തോഫെത്തിനെ അശുദ്ധമാക്കി; ആർക്കും[b] തന്റെ മകനെയോ മകളെയോ മോലെക്കിന്[c] തീയിൽക്കൂടി കടത്താതിരിക്കാൻ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ മകനെയോ മകളെയോ തീയിൽക്കൂടി കടത്തുക’ എന്നത് മോലെക്കുമായി ബന്ധപ്പെട്ട ഒരു ആരാധനാചാരത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; ഇത് സാധ്യതയേറിയ വിധത്തിൽ കുട്ടിബലിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഒരു പുരുഷനും’; ഇവിടെ ഹീബ്രു പുല്ലിംഗ ഏകവചനം പൊതുവായ അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ, സാധ്യത കുറവുള്ള വായന: ‘രാജാവിന്.’'
    reason: alternative_reading
lexical_decisions:
- source_word: וְטִמֵּא
  choice: അശുദ്ധമാക്കി
  rationale: טמא എന്ന ക്രിയയുടെ പീയേൽ രൂപം ‘അശുദ്ധമാക്കുക’ എന്നാണ്. യോശീയാവ് ആ ആരാധനാസ്ഥലം ആചാരപരമായി ഉപയോഗിക്കാനാകാത്തതാക്കിയ സന്ദർഭത്തിൽ ഈ പദം മൂലത്തിന്റെ ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַתֹּפֶת
  choice: തോഫെത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְּגֵי בני הִנֹּם
  choice: ബെൻ-ഹിന്നോം താഴ്വരയിൽ
  rationale: גֵי എന്നത് ‘താഴ്വര’; בני הִנֹּם പരമ്പരാഗത സ്ഥലനാമമായി ‘ബെൻ-ഹിന്നോം’ എന്നു നിലനിർത്തി. കെതീബ് രൂപത്തിലെ ‘ബനേ/പുത്രന്മാർ’ എന്ന ഘടകം സ്ഥലനാമപരമ്പരയിൽ ബെൻ-ഹിന്നോം ആയി വായിക്കപ്പെടുന്നു.
- source_word: לְבִלְתִּי לְהַעֲבִיר
  choice: അങ്ങനെ … കടത്താതിരിക്കേണ്ടതിന്
  rationale: നിഷേധാത്മക ഉദ്ദേശ്യം/തടയൽ സൂചിപ്പിക്കുന്ന ഘടനയാണ്. ‘കടത്തുക’ എന്നത് עבר-ന്റെ കാരകഭാവം നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ആരും
  rationale: ഇവിടെ ഏകവചന പുല്ലിംഗരൂപം പൊതുവായ അർഥത്തിലാണ്. മലയാളത്തിൽ നിഷേധവാക്യത്തോടൊപ്പം ‘ആരും’ എന്നത് ഈ പൊതുവായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנוֹ וְאֶת־בִּתּוֹ
  choice: തന്റെ മകനെയോ മകളെയോ
  rationale: നിഷേധാത്മക സന്ദർഭത്തിൽ രണ്ട് സാധ്യതകളെയും ഉൾക്കൊള്ളാൻ മലയാളത്തിൽ ‘-യോ … -യോ’ സ്വാഭാവികമാണ്.
- source_word: בָּאֵשׁ
  choice: തീയിൽക്കൂടി
  rationale: ‘കടത്തുക’ എന്ന ക്രിയയോടൊപ്പം ആചാരപരമായ ‘തീയിൽക്കൂടി കടത്തുക’ എന്ന ഹീബ്രു പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: לַמֹּלֶךְ
  choice: മോലെക്കിന്
  rationale: ആരാധനാചാരസന്ദർഭത്തിൽ ഇത് ദേവതയുടെ പേരായി മനസ്സിലാക്കുന്നതാണ് ഏറ്റവും സാധ്യതയുള്ള വായന.
theological_decisions:
- issue: കുട്ടികളെ തീയിൽക്കൂടി കടത്തുക എന്ന ആരാധനാചാരപ്രയോഗം
  choice: മൂലത്തിലെ ‘തീയിൽക്കൂടി കടത്തുക’ എന്ന പ്രയോഗം മുഖ്യവാക്യത്തിൽ നിലനിർത്തി
  alternative: ‘മകനെയോ മകളെയോ മോലെക്കിന് ബലിയർപ്പിക്കുക’
  rationale: ഈ പ്രയോഗം മോലെക്കുമായി ബന്ധപ്പെട്ട കുട്ടികളുടെ അർപ്പണാചാരത്തെ, സാധ്യതയേറിയ വിധത്തിൽ കുട്ടിബലിയെ, സൂചിപ്പിക്കുന്നു. എങ്കിലും ഹീബ്രു വാചകം ‘ബലിയർപ്പിക്കുക’ എന്ന് നേരിട്ട് പറയാത്തതിനാൽ അതിലെ അവ്യക്തത മുഖ്യവാക്യത്തിൽ സംരക്ഷിച്ചു.
- issue: אִישׁ എന്ന പൊതുവായ പുല്ലിംഗ ഏകവചനം
  choice: ആരും
  alternative: ഒരു പുരുഷനും
  rationale: ഇവിടെ പുരുഷന്മാരെ മാത്രം വേർതിരിച്ചുകാട്ടുന്നതല്ല, പൊതുവായ നിഷേധമാണ്. മലയാളത്തിലെ ‘ആരും’ ലിംഗവ്യത്യാസം അനാവശ്യമായി ചുമത്താതെ ആ പൊതുവായ അർഥം കൃത്യമായി നൽകുന്നു.
- issue: לַמֹּלֶךְ എന്നതിന്റെ വായന
  choice: മോലെക്കിന്
  alternative: രാജാവിന്
  rationale: ആരാധനാചാരസന്ദർഭവും പ്രചാരത്തിലുള്ള മസോരറ്റിക് സ്വരീകരണവും ‘മോലെക്ക്’ എന്ന ദേവനാമത്തെ അനുകൂലിക്കുന്നു; എന്നാൽ ‘രാജാവിന്’ എന്ന വ്യഞ്ജനാധിഷ്ഠിത വായന കുറച്ച് സാധ്യതയോടെ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സ്ഥലനാമങ്ങളും ദേവനാമവും മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; ആരാധനാചാരത്തിന്റെ ഹീബ്രു പ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ വാക്യത്തിൽ നിലനിർത്തി, വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
