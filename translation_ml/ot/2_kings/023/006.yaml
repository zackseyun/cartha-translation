id: 2KI.23.6
reference: 2 Kings 23:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּצֵ֣א אֶת הָ/אֲשֵׁרָה֩ מִ/בֵּ֨ית יְהוָ֜ה מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ אֶל נַ֣חַל קִדְר֔וֹן וַ/יִּשְׂרֹ֥ף אֹתָ֛/הּ בְּ/נַ֥חַל קִדְר֖וֹן וַ/יָּ֣דֶק לְ/עָפָ֑ר וַ/יַּשְׁלֵךְ֙ אֶת עֲפָרָ֔/הּ עַל קֶ֖בֶר בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
translation:
  language: ml
  text: അവൻ അശേരയെ[a] യഹ്‌വെയുടെ ആലയത്തിൽനിന്ന് പുറത്തെടുത്ത് യെരൂശലേമിനു വെളിയിൽ കിദ്രോൻ താഴ്‌വരയിലേക്കു കൊണ്ടുപോയി. കിദ്രോൻ താഴ്‌വരയിൽവെച്ച് അതിനെ ചുട്ടുകളഞ്ഞു, പൊടിയായി ഇടിച്ചുനുറുക്കി, അതിന്റെ പൊടി സാധാരണ ജനങ്ങളുടെ കല്ലറകളിന്മേൽ എറിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശേരാസ്തംഭം’ അല്ലെങ്കിൽ ‘അശേരാവിഗ്രഹം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം കനാന്യദേവിയായ അശേരയെയോ അവളുടെ ആരാധനയുമായി ബന്ധപ്പെട്ട പൂജാവസ്തുവിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ ആലയത്തിൽനിന്ന് നീക്കി നശിപ്പിച്ച വസ്തുവാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  choice: അശേര
  rationale: ഈ പദത്തിന് കനാന്യദേവിയായ അശേരയെയോ അവളുടെ ആരാധനയുമായി ബന്ധപ്പെട്ട പൂജാവസ്തുവിനെയോ സൂചിപ്പിക്കാം. ഇവിടെ പുറത്തെടുത്ത് നശിപ്പിക്കപ്പെടുന്ന വസ്തുവാണ് ഉദ്ദേശിക്കുന്നത്; അതിന്റെ രൂപം അനാവശ്യമായി നിർണയിക്കാതിരിക്കാൻ പേര് ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִבֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ആലയത്തിൽനിന്ന്
  rationale: ‘വീട്’ എന്ന അക്ഷരാർഥത്തെക്കാൾ ഈ സന്ദർഭത്തിൽ ദേവാലയത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന ‘ആലയം’ ഉപയോഗിച്ചു; ദൈവനാമം യഹ്‌വെ എന്നു നിലനിർത്തി.
- source_word: נַחַל קִדְרוֹן
  choice: കിദ്രോൻ താഴ്‌വര
  rationale: נחל എന്നത് കാലിക നീരൊഴുക്കുള്ള താഴ്‌വരയെയോ മലയിടുക്കിനെയോ സൂചിപ്പിക്കാം; ചരിത്ര-ഭൂമിശാസ്ത്ര സന്ദർഭത്തിൽ ‘താഴ്‌വര’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיָּדֶק לְעָפָר
  choice: പൊടിയായി ഇടിച്ചുനുറുക്കി
  rationale: ക്രിയ വസ്തുവിനെ അതിസൂക്ഷ്മ കണങ്ങളാക്കി തകർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; നശിപ്പിക്കൽപ്രക്രിയയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֲפָרָהּ
  choice: അതിന്റെ പൊടി
  rationale: עפר എന്നത് പ്രത്യേകമായി ‘ചാരം’ എന്നല്ല, ‘പൊടി’ എന്നാണ്; വസ്തു ചുട്ടശേഷം നുറുക്കിയതായതിനാൽ മൂലപദത്തിന്റെ വിശാല അർഥം നിലനിർത്തി.
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  choice: സാധാരണക്കാരുടെ കല്ലറകളിന്മേൽ
  rationale: בני העם ഇവിടെ ഉന്നതവർഗത്തിൽനിന്നു വ്യത്യസ്തരായ സാധാരണ ജനങ്ങളെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം; മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: אֲשֵׁרָה എന്ന ആരാധനാസംബന്ധിയായ പദത്തിന്റെ വിവർത്തനം
  choice: അശേര
  alternative: അശേരാവിഗ്രഹം; അശേരാസ്തംഭം
  rationale: എബ്രായപദം ദേവിയെയോ അവളുടെ ആരാധനയുമായി ബന്ധപ്പെട്ട വസ്തുവിനെയോ സൂചിപ്പിക്കാം. ഇവിടെ നശിപ്പിക്കപ്പെടുന്ന പൂജാവസ്തുവാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും അതിന്റെ കൃത്യരൂപം വാക്യം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ അവ്യക്തത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ പ്രവർത്തനക്രമവും കിദ്രോൻ താഴ്‌വര എന്ന ആവർത്തനവും നിലനിർത്തി; ആരാധനാവസ്തുവിന്റെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
