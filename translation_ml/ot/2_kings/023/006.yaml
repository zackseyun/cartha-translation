    issue: ‘വിതറി’ renders the final destruction action.
    rationale: The Hebrew וַיַּשְׁלֵךְ means ‘threw’ or ‘cast,’ not specifically ‘scattered.’ Replacing it with ‘എറിഞ്ഞു’ preserves the action without adding a manner of dispersal.
