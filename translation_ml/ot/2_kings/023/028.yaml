  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/028.yaml
  text: The rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: യോശീയാവിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്ത സകലവും യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[a] എഴുതിയിട്ടുണ്ടല്ലോ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദിനവൃത്താന്തപുസ്തകം” എന്നത് രാജാക്കന്മാരുടെ പുസ്തകത്തിൽ ഉദ്ധരിക്കപ്പെടുന്ന ഒരു രാജകീയ രേഖാസ്രോതസ്സാണ്; ഇന്നുള്ള 1–2 ദിനവൃത്താന്തപുസ്തകങ്ങളുടെ അന്തിമരൂപം തന്നെയെന്ന് നിർബന്ധമില്ല.
    reason: cross_reference
  - marker: b
    text: “എഴുതിയിട്ടുണ്ട്” എന്നതിന് “രേഖപ്പെടുത്തിയിട്ടുണ്ട്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ
  choice: യോശീയാവിന്റെ ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: രാജാവിനെക്കുറിച്ചുള്ള ചരിത്രസംഗ്രഹസൂത്രത്തിൽ יֶתֶר ശേഷിക്കുന്ന കാര്യങ്ങളെയും דִּבְרֵי അവന്റെ പ്രവൃത്തികളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്ത സകലവും
  rationale: עשה എന്ന ക്രിയയുടെ വിശാലവും ലളിതവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടുണ്ടല്ലോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ നിഷേധചോദ്യത്തിന്റെ ഭാവം മലയാളത്തിലെ ‘ഉണ്ടല്ലോ?’ എന്ന പ്രയോഗം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘മേൽ’ എന്നായാലും, രേഖ ഒരു ഗ്രന്ഥത്തിൽ എഴുതിയിരിക്കുന്നതിനെ മലയാളത്തിൽ ‘പുസ്തകത്തിൽ’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം
  rationale: രാജകീയ രേഖാസ്രോതസ്സിന്റെ ശീർഷകം സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; לְ എന്ന ബന്ധത്തെ ‘രാജാക്കന്മാരുടെ’ എന്നു സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: ‘ദിനവൃത്താന്തപുസ്തകം’ ഏത് ഗ്രന്ഥത്തെ സൂചിപ്പിക്കുന്നു
  choice: രാജാക്കന്മാരുടെ പുസ്തകത്തിൽ ഉദ്ധരിക്കപ്പെടുന്ന രാജകീയ രേഖാസ്രോതസ്സ് എന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി
  alternative: കാനോനികമായ 1–2 ദിനവൃത്താന്തപുസ്തകങ്ങളുമായി നേരിട്ട് സമീകരിക്കുക
  rationale: എബ്രായ ശീർഷകം ഒരു രാജകീയ വാർഷികരേഖയെ സൂചിപ്പിക്കുന്നു; അത് കാനോനിക ദിനവൃത്താന്തഗ്രന്ഥങ്ങളുടെ അന്തിമരൂപം തന്നെയാണെന്ന് വാക്യം ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. എബ്രായത്തിലെ വാക്യാരംഭക וְ പ്രത്യേകം ‘ഇപ്പോൾ’ എന്നു വികസിപ്പിച്ചിട്ടില്ല. നിഷേധചോദ്യത്തിന്റെ ഉറപ്പുനൽകുന്ന ഭാവം ‘ഉണ്ടല്ലോ?’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
