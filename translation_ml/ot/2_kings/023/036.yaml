id: 2KI.23.36
reference: 2 Kings 23:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָ֨ה יְהוֹיָקִ֣ים בְּ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ זבידה בַת פְּדָיָ֖ה מִן רוּמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/036.yaml
  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
translation:
  language: ml
  text: യെഹോയാക്കീം രാജാവായപ്പോൾ ഇരുപത്തഞ്ചു വയസ്സായിരുന്നു.[a] അവൻ യെരൂശലേമിൽ പതിനൊന്നു വർഷം ഭരിച്ചു. അവന്റെ അമ്മയുടെ പേര് സെബീദാ എന്നായിരുന്നു; അവൾ രൂമാ സ്വദേശിയായ പെദായാവിന്റെ മകളായിരുന്നു.[b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: ഇരുപത്തഞ്ചു വയസ്സായിരുന്നു
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: സിംഹാസനാരോഹണത്തിന്റെ സമയമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: രാജാധികാരം പ്രയോഗിച്ചു ഭരിച്ചതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: ഭരണകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലവാചകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് ... എന്നായിരുന്നു
  rationale: വംശാവലിസംബന്ധമായ എബ്രായ സൂത്രവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: זבידה
  choice: സെബീദാ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു; മറ്റൊരു പ്രചാരത്തിലുള്ള വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: בַת פְּדָיָה
  choice: പെദായാവിന്റെ മകൾ
  rationale: പിതൃബന്ധം വ്യക്തമാക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: מִן רוּמָה
  choice: രൂമാ സ്വദേശിയായ
  rationale: מִן ഇവിടെ ഉത്ഭവസ്ഥലമോ സ്വദേശമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘സ്വദേശിയായ’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, രാജവാഴ്ചയുടെ ഔപചാരിക രേഖാശൈലിക്കൊത്ത മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ഭാഷ ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങൾ സ്വീകരിച്ചു.
