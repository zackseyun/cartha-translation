source:
  edition: WLC
  text: כִּ֣י לֹ֤א נַֽעֲשָׂה֙ כַּ/פֶּ֣סַח הַ/זֶּ֔ה מִ/ימֵי֙ הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר שָׁפְט֖וּ אֶת יִשְׂרָאֵ֑ל וְ/כֹ֗ל יְמֵ֛י מַלְכֵ֥י יִשְׂרָאֵ֖ל וּ/מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/022.yaml
  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
translation:
  language: ml
  text: കാരണം, ഇസ്രായേലിനെ ന്യായംവിധിച്ച ന്യായാധിപന്മാരുടെ കാലം മുതൽ ഇസ്രായേൽ രാജാക്കന്മാരുടെയും യെഹൂദാ രാജാക്കന്മാരുടെയും എല്ലാ കാലത്തും ഇതുപോലൊരു പെസഹ ആചരിക്കപ്പെട്ടിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഈ പെസഹപോലെ”; അർഥം, “ഇതുപോലൊരു പെസഹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ യോശീയാവിന്റെ പെസഹയെ വിശദീകരിക്കുന്ന കാരണസൂചക ഭാവം നിലനിർത്തുന്നു.
- source_word: לֹא נַעֲשָׂה
  choice: ആചരിച്ചിരുന്നില്ല
  rationale: പെസഹയോടൊപ്പം עשה എന്ന ക്രിയയ്ക്കുള്ള അനുഷ്ഠാനപരമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഭൂതകാലത്തിലെ താരതമ്യവും പ്രകടമാക്കുന്നു.
- source_word: כַּפֶּסַח הַזֶּה
  choice: ഇതുപോലൊരു പെസഹ
  rationale: כ എന്ന താരതമ്യോപസർഗവും ‘ഈ പെസഹ’ എന്ന പ്രയോഗവും ചേർന്നുള്ള ‘ഈ പെസഹപോലെ’ എന്ന അർഥം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מִימֵי הַשֹּׁפְטִים
  choice: ന്യായാധിപന്മാരുടെ കാലംമുതൽ
  rationale: מן സൂചിപ്പിക്കുന്ന കാലാരംഭം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ ന്യായപാലനം ചെയ്ത
  rationale: ‘ന്യായാധിപന്മാർ’ എന്ന പദവും שׁפט എന്ന ക്രിയയും തമ്മിലുള്ള മൂലഭാഷയിലെ പദബന്ധം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെയും യെഹൂദാരാജാക്കന്മാരുടെയും കാലത്തൊന്നും
  rationale: തുടരുന്ന നിഷേധവും ഇരുരാജവംശങ്ങൾ തമ്മിലുള്ള വേർതിരിവും സംക്ഷിപ്തമായ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ചരിത്രപരമായ താരതമ്യത്തിന്റെ വ്യാപ്തി
  choice: ന്യായാധിപന്മാരുടെ കാലംമുതൽ ഇസ്രായേലിന്റെയും യെഹൂദയുടെയും രാജാക്കന്മാരുടെ കാലമൊട്ടാകെ യോശീയാവിന്റേതുപോലൊരു പെസഹ ആചരിക്കപ്പെട്ടിരുന്നില്ല എന്നാണ് വാക്യം പറയുന്നത്.
  alternative: ആ കാലത്ത് പെസഹ ഒട്ടും ആചരിക്കപ്പെട്ടിരുന്നില്ല എന്നോ, പ്രസ്താവന കർശനമായ ചരിത്രവിവരത്തിനു പകരം അതിശയോക്തി മാത്രമാണെന്നോ വായിക്കാം.
  rationale: כַּפֶּסַח הַזֶּה എന്ന താരതമ്യപ്രയോഗം പെസഹാചരണത്തിന്റെ പൂർണ അഭാവമല്ല, ‘ഇതുപോലൊരു’ പെസഹയുടെ അഭാവമാണ് സൂചിപ്പിക്കുന്നത്. ചരിത്രപ്രശ്നങ്ങൾ വാചകത്തിനു പുറത്തായി തീർപ്പാക്കാതെ ഈ സൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ചരിത്രപദവിയായ ‘ന്യായാധിപന്മാർ’ നിലനിർത്തുകയും ‘ന്യായപാലനം ചെയ്ത’ എന്ന ക്രിയയിലൂടെ എബ്രായത്തിലെ പദബന്ധം പ്രതിഫലിപ്പിക്കുകയും ചെയ്തു.
