source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אָחָ֜ז מַלְאָכִ֗ים אֶל תִּ֠גְלַת פְּלֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ לֵ/אמֹ֔ר עַבְדְּ/ךָ֥ וּ/בִנְ/ךָ֖ אָ֑נִי עֲלֵ֨ה וְ/הוֹשִׁעֵ֜/נִי מִ/כַּ֣ף מֶֽלֶךְ אֲרָ֗ם וּ/מִ/כַּף֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל הַ/קּוֹמִ֖ים עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
translation:
  language: ml
  text: 'അങ്ങനെ ആഹാസ് അശ്ശൂർരാജാവായ തിഗ്ലത്ത്-പിലേസറിന്റെ അടുക്കലേക്ക് ദൂതന്മാരെ അയച്ച് ഇങ്ങനെ പറഞ്ഞു: “ഞാൻ അങ്ങയുടെ ദാസനും മകനുമാണ്.[a] എനിക്കെതിരെ എഴുന്നേറ്റിരിക്കുന്ന അരാം[c]രാജാവിന്റെ കൈയിൽനിന്നും ഇസ്രായേൽരാജാവിന്റെ കൈയിൽനിന്നും[b] എന്നെ രക്ഷിക്കാൻ കയറിവന്ന് രക്ഷിക്കണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇവ രാഷ്ട്രീയ വിധേയത്വം പ്രകടിപ്പിക്കുന്ന നയതന്ത്രപദങ്ങളാണ്; അക്ഷരാർഥം: ‘അങ്ങയുടെ ദാസനും അങ്ങയുടെ മകനും.’ ‘അങ്ങയുടെ സാമന്തൻ’ എന്നും അർഥമാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘കൈയിൽനിന്ന്’; അതായത്, ‘അധികാരത്തിൽനിന്ന്’ അഥവാ ‘പിടിയിൽനിന്ന്.’'
    reason: lexical_alternative
  - marker: c
    text: ‘അരാം’ എന്നത് പരമ്പരാഗതമായി ‘സിറിയ’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: שלח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: രാഷ്ട്രീയസന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൂതന്മാർ’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תִּגְלַת פְּלֶסֶר
  choice: തിഗ്ലത്ത്-പിലേസർ
  rationale: അശ്ശൂർ രാജനാമത്തിന്റെ ഹീബ്രൂ രൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവ്
  rationale: രാജാവിനെയും രാജ്യത്തെയും തിരിച്ചറിയിക്കുന്ന നിർമാണബന്ധം സംക്ഷിപ്തമായും കൃത്യമായും നൽകുന്നു.
- source_word: עַבְדְּךָ וּבִנְךָ
  choice: അങ്ങയുടെ ദാസനും മകനും
  rationale: രാഷ്ട്രീയ കീഴടങ്ങലിന്റെ നയതന്ത്രഭാഷയാണെങ്കിലും, മൂലപാഠത്തിലെ സേവക-പുത്ര രൂപകങ്ങൾ അതേപടി നിലനിർത്തുന്നു.
- source_word: עֲלֵה
  choice: കയറിവരണമേ
  rationale: עלה എന്നതിന്റെ ‘കയറിവരുക’ എന്ന ദിശാബോധം നിലനിർത്തുകയും സൈനികസഹായത്തിനുള്ള വിനീത അഭ്യർഥന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהוֹשִׁיעֵנִי
  choice: എന്നെ രക്ഷിക്കാൻ
  rationale: ישע എന്ന ക്രിയയുടെ രക്ഷിക്കുക/വിടുവിക്കുക എന്ന അർഥം നിലനിർത്തുന്നു; ഇവിടെ സന്ദർഭം സൈനിക-രാഷ്ട്രീയ രക്ഷയാണെന്ന് വ്യക്തമാകുന്നു.
- source_word: מִכַּף
  choice: കൈയിൽനിന്ന്
  rationale: അധികാരമോ പിടിയോ സൂചിപ്പിക്കുന്ന ഹീബ്രൂവിലെ സജീവമായ ‘കൈ’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: പരമ്പരാഗതമായ ‘സിറിയ’ എന്നതിനു പകരം മൂലഭാഷയിലെ ചരിത്രനാമം നേരിട്ട് നൽകുന്നു.
- source_word: הַקּוֹמִים עָלַי
  choice: എനിക്കെതിരെ എഴുന്നേറ്റിരിക്കുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിലെ തുടരുന്ന ശത്രുതയും ‘എഴുന്നേൽക്കുക’ എന്ന ദൃശ്യരൂപകവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആഹാസിന്റെ രാഷ്ട്രീയ സ്വയംതാഴ്ത്തൽ
  choice: ‘അങ്ങയുടെ ദാസനും മകനും’ എന്ന അക്ഷരാർഥരൂപം
  alternative: ‘അങ്ങയുടെ സാമന്തൻ’ എന്ന വ്യാഖ്യാനാത്മക രാഷ്ട്രീയപദം
  rationale: ഈ ഭാഷ രാഷ്ട്രീയ വിധേയത്വം സൂചിപ്പിക്കുന്നുവെങ്കിലും, പാഠം ഉപയോഗിക്കുന്ന സേവക-പുത്ര ബന്ധഭാഷയെ മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നത് അതിന്റെ വാചകശക്തിയും ഉദ്ദേശപൂർവമായ അസ്വസ്ഥതയും സംരക്ഷിക്കുന്നു.
- issue: וְהוֹשִׁיעֵנִי എന്നതിന്റെ സൈനിക-രാഷ്ട്രീയ അർഥം
  choice: ‘എന്നെ രക്ഷിക്കാൻ’
  alternative: ‘എന്നെ വിടുവിക്കാൻ’
  rationale: ‘രക്ഷിക്കുക’ എന്നത് മൂലക്രിയയുടെ വിശാലമായ വേദപുസ്തക പ്രയോഗബന്ധം നിലനിർത്തുന്നു; ഇവിടെ അത് ആത്മീയരക്ഷയെക്കാൾ സൈനിക-രാഷ്ട്രീയ രക്ഷയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. രാജാവിനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ച് ആദരസൂചന നിലനിർത്തി. ഹീബ്രൂവിലെ ‘കൈ’യും ‘എഴുന്നേൽക്കുക’യും പോലുള്ള സജീവരൂപകങ്ങൾ സംരക്ഷിച്ചു; അടിക്കുറിപ്പുകളുടെ ക്രമം അവ സൂചിപ്പിക്കുന്ന വാചകഘടകങ്ങൾക്ക് അനുസരിച്ച് [a], [b], [c] ആയി ക്രമപ്പെടുത്തി.
