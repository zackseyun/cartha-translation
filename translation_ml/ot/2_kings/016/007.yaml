revisions:
- from: 'അങ്ങനെ ആഹാസ് അശ്ശൂർരാജാവായ തിഗ്ലത്ത്-പിലേസറിന്റെ അടുക്കൽ ദൂതന്മാരെ അയച്ച് ഇങ്ങനെ പറഞ്ഞു: “ഞാൻ അങ്ങയുടെ ദാസനും മകനുമാണ്.[a] എനിക്കെതിരെ എഴുന്നേറ്റിരിക്കുന്ന അരാംരാജാവിന്റെയും ഇസ്രായേൽരാജാവിന്റെയും കൈയിൽനിന്ന്[b] എന്നെ രക്ഷിക്കാൻ കയറിവരണമേ.”[c]'
  to: 'അങ്ങനെ ആഹാസ് അശ്ശൂർരാജാവായ തിഗ്ലത്ത്-പിലേസറിന്റെ അടുക്കലേക്ക് ദൂതന്മാരെ അയച്ച് ഇങ്ങനെ പറഞ്ഞു: “ഞാൻ അങ്ങയുടെ ദാസനും മകനുമാണ്.[a] എനിക്കെതിരെ എഴുന്നേറ്റിരിക്കുന്ന അരാം[c]രാജാവിന്റെ കൈയിൽനിന്നും ഇസ്രായേൽരാജാവിന്റെ കൈയിൽനിന്നും[b] എന്നെ രക്ഷിക്കാൻ കയറിവന്ന് രക്ഷിക്കണമേ.”'
  rationale: ‘അരാം’ എന്ന നാമവുമായി ബന്ധപ്പെട്ട [c] അതേ നാമത്തിനരികിലേക്കു മാറ്റി അടിക്കുറിപ്പ്-നങ്കൂരം ശരിയാക്കി. മൂലപാഠത്തിലെ ‘കൈയിൽനിന്ന്’ എന്ന പ്രയോഗത്തിന്റെ ആവർത്തനം നിലനിർത്തി. അപേക്ഷയെ സ്വാഭാവികമാക്കാൻ ക്രിയാബന്ധം പരിഷ്കരിച്ചു.
