  yaml_path: translation/ot/2_kings/016/016.yaml
  text: So Uriah the priest did according to all that King Ahaz had commanded.
translation:
  language: ml
  text: അങ്ങനെ പുരോഹിതനായ ഊരീയാവ് ആഹാസ് രാജാവ് കൽപിച്ചതെല്ലാം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന ക്രിയയ്ക്ക് ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന വിശാലമായ അർഥമുണ്ട്. ഇവിടെ കല്പനയോടുള്ള പൂർണ അനുസരണം സൂചിപ്പിക്കുന്ന ഘടനയോടൊപ്പം വരുന്നതിനാൽ ‘ചെയ്തു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אוּרִיָּה
  choice: ഊരീയാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ വ്യക്തമായി പകർന്നിരിക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ഊരീയാവിന്റെ ഔദ്യോഗിക പദവി സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമത്തിന്റെ നേരായ മലയാളരൂപം.
- source_word: כְּכֹל אֲשֶׁר
  choice: കല്പിച്ചതെല്ലാം അനുസരിച്ചു
  rationale: തുടർന്ന് പറയുന്ന കല്പനയോടുള്ള സമ്പൂർണ അനുരൂപതയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘എല്ലാം അനുസരിച്ചു’ എന്ന രൂപം ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചതെല്ലാം
  rationale: צוה എന്നത് അധികാരപൂർവം കല്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഭൂതകാല സംബന്ധവാചകരൂപം രാജാവിന്റെ കല്പന ഊരീയാവിന്റെ പ്രവൃത്തിക്ക് മുമ്പുണ്ടായിരുന്നുവെന്ന ക്രമം വ്യക്തമാക്കുന്നു.
- source_word: הַמֶּלֶךְ אָחָז
  choice: ആഹാസ് രാജാവ്
  rationale: പേരിനു പിന്നാലെ പദവി ചേർക്കുന്നത് സ്വാഭാവികമായ മലയാള ശൈലിയാണ്; എബ്രായത്തിലെ വ്യക്തിയെയും രാജപദവിയെയും കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഊരീയാവിന്റെ അനുസരണത്തെക്കുറിച്ചുള്ള ആഖ്യാനപരമായ വിലയിരുത്തൽ
  choice: വാക്യം ധാർമിക അംഗീകാരമോ അപലപനമോ കൂട്ടിച്ചേർക്കാതെ വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി.
  alternative: സന്ദർഭത്തിലെ പ്രതികൂല സൂചനയെ ഈ വാക്യത്തിന്റെ ഭാഷയിൽ തന്നെ തുറന്ന അപലപനമായി ചേർക്കുക.
  rationale: എബ്രായപാഠം ഊരീയാവ് ആഹാസിന്റെ കല്പന പൂർണമായി അനുസരിച്ചുവെന്നു മാത്രം രേഖപ്പെടുത്തുന്നു. വിശാലസന്ദർഭം പ്രതികൂലമായ വിലയിരുത്തലിന് ഇട നൽകുന്നുവെങ്കിലും ഈ വാക്യം അതു തുറന്നു പറയുന്നില്ല; അതിനാൽ ആഖ്യാനത്തിന്റെ സംയമനം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘അങ്ങനെ’ മുൻസന്ദർഭത്തിലെ പ്രവൃത്തിയുടെ തുടർച്ച പ്രകടമാക്കുന്നു. വാക്യത്തിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
