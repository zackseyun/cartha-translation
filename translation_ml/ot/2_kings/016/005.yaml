source:
  edition: WLC
  text: אָ֣ז יַעֲלֶ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֧הוּ מֶֽלֶךְ יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּצֻ֨רוּ֙ עַל אָחָ֔ז וְ/לֹ֥א יָכְל֖וּ לְ/הִלָּחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
translation:
  language: ml
  text: അപ്പോൾ അരാംരാജാവായ രെസീനും രെമല്യാവിന്റെ മകനും ഇസ്രായേൽരാജാവുമായ പേക്കഹും യുദ്ധത്തിനായി യെരൂശലേമിലേക്കു കയറിച്ചെന്നു. അവർ ആഹാസിനെ ഉപരോധിച്ചെങ്കിലും അവനോടു പോരാടാൻ അവർക്കു കഴിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെരൂശലേമിനെതിരെ പോരാടാൻ അവർക്കു കഴിഞ്ഞില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം; ‘പോരാടുക’ എന്നതിനു ശേഷം എബ്രായപാഠം കർമം ആവർത്തിക്കുന്നില്ല.
    reason: അവസാന ക്രിയയുടെ പറയാത്ത കർമം ആഹാസാണോ യെരൂശലേമാണോ എന്ന വ്യാകരണപരമായ അനിശ്ചിതത്വം.
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ അവതരിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലസൂചകപദം.
- source_word: יַעֲלֶה
  choice: കയറിച്ചെന്നു
  rationale: യെരൂശലേമിലേക്കുള്ള സൈനികനീക്കത്തിൽ ‘കയറിപ്പോകുക’ എന്ന עלה-യുടെ ദിശാഭാവവും യാത്രാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: അരാംരാജാവായ രെസീൻ
  rationale: അരാം എന്ന എബ്രായ ദേശനാമം നിലനിർത്തുകയും രാജപദവി സ്വാഭാവിക മലയാളത്തിൽ ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: രെമല്യാവിന്റെ മകനും ഇസ്രായേൽരാജാവുമായ പേക്കഹ്
  rationale: പിതൃനാമവും രാജപദവിയും വ്യക്തമായി പേക്കഹിനോടു ബന്ധിപ്പിക്കുന്ന മലയാളഘടന.
- source_word: יְרוּשָׁלַםִ לַמִּלְחָמָה
  choice: യുദ്ധത്തിനായി യെരൂശലേമിലേക്കു
  rationale: ലക്ഷ്യസ്ഥാനവും സൈനിക ഉദ്ദേശ്യവും അമിതവ്യാഖ്യാനം കൂടാതെ പ്രകടമാക്കുന്നു.
- source_word: וַיָּצֻרוּ עַל אָחָז
  choice: അവർ ആഹാസിനെ ഉപരോധിച്ചു
  rationale: צור על എന്ന സൈനികപ്രയോഗത്തിന് ‘ഉപരോധിക്കുക’ എന്നതാണ് കൃത്യവും സംക്ഷിപ്തവുമായ മലയാളം; വ്യാകരണപരമായ നേരിട്ടുള്ള ലക്ഷ്യം ആഹാസാണ്.
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  choice: എങ്കിലും അവനോടു പോരാടി ജയിക്കാൻ അവർക്കു കഴിഞ്ഞില്ല
  rationale: അവർക്ക് യുദ്ധത്തിൽ ലക്ഷ്യം നേടാനായില്ലെന്ന സന്ദർഭാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു; എബ്രായത്തിൽ infinitive-ന് ശേഷം കർമം ആവർത്തിക്കാത്തതിനാൽ അതിന്റെ അവലംബത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: അവസാന വാക്യഭാഗത്തിലെ പറയാത്ത കർമത്തിന്റെ അവലംബം
  choice: പ്രധാനപാഠത്തിൽ ‘അവനോടു’ എന്നു നൽകി ആഹാസിനെ അവലംബമാക്കുന്നു
  alternative: ‘അതിനെതിരെ’ എന്നു നൽകി യെരൂശലേമിനെ അവലംബമാക്കാം; അല്ലെങ്കിൽ കർമമില്ലാതെ ‘പോരാടാൻ കഴിഞ്ഞില്ല’ എന്നു പറയാം
  rationale: തൊട്ടുമുമ്പുള്ള עַל אָחָז (‘ആഹാസിനെതിരെ/ആഹാസിനെ’) പുരുഷവ്യക്തിയെയാണ് മുന്നിൽ നിർത്തുന്നത്; എന്നാൽ לְהִלָּחֵם എന്നതിന് ശേഷം എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ നഗരത്തെ ഉദ്ദേശിക്കുന്ന വായനയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു. ഇത് വ്യാകരണപരമായ തീരുമാനമാണ്, പ്രത്യേക ദൈവശാസ്ത്ര നിലപാടല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അരാം’ എന്ന മൂലദേശനാമം നിലനിർത്തി; ‘ഉപരോധിച്ചു’ എന്ന പൊതുവായി മനസ്സിലാകുന്ന സൈനികപദം ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചർച്ച ചെയ്യുന്ന സ്ഥലത്തുതന്നെ [a] അടയാളം ചേർത്തിരിക്കുന്നു.
