  source_fidelity: പ്രധാനപാഠത്തിലെ ‘പോരാടി ജയിക്കാൻ’ എബ്രായത്തിലെ לְהִלָּחֵם (‘പോരാടാൻ/യുദ്ധം ചെയ്യാൻ’) എന്നതിനെക്കാൾ അർഥം കൂട്ടിച്ചേർക്കുന്നു. ജയിക്കാനോ കീഴടക്കാനോ കഴിഞ്ഞില്ല എന്ന ആശയം ഈ ക്രിയയിൽ വ്യക്തമായി ഇല്ല. പറയാത്ത കർമത്തെ ‘അവനോടു’ എന്ന് മനസ്സിലാക്കുന്നത് സാധ്യമാണ്; നഗരത്തെ സൂചിപ്പിക്കുന്ന മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്താം.
  naturalness: ‘അപ്പോൾ അരാംരാജാവായ രെസീനും ... പേക്കഹും’ എന്ന ഘടനയും ‘ഉപരോധിച്ചു’ എന്ന സൈനികപദവും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘അവനോടു പോരാടാൻ അവർക്കു കഴിഞ്ഞില്ല’ എന്ന തിരുത്തൽ വ്യക്തവും അനാവശ്യമായ വ്യാഖ്യാനവർധനയില്ലാത്തതുമാണ്.
