  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב אָחָז֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ חִזְקִיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
translation:
  language: ml
  text: ആഹാസ് തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു; ദാവീദിന്റെ നഗരത്തിൽ തന്റെ പിതാക്കന്മാരോടുകൂടെ അടക്കപ്പെട്ടു.[a] അവന്റെ മകനായ ഹിസ്കീയാവ് അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു’ എന്നത് ആഹാസ് മരിച്ച് തന്റെ പൂർവികരോടു ചേർന്നു എന്നർഥമുള്ള, രാജാക്കന്മാരുടെ മരണവിവരണങ്ങളിൽ പതിവായി ഉപയോഗിക്കുന്ന എബ്രായ ശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: രാജകീയ മരണവിവരണങ്ങളിൽ שׁכב എന്ന പദം പിതാക്കന്മാരോടുകൂടെ എന്ന പ്രയോഗത്തോടു ചേർന്ന് മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവുശൈലിയാണ്. ‘നിദ്രപ്രാപിച്ചു’ അതിന്റെ രൂപകവും ആവർത്തിതമായ സൂത്രവാക്യസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ
  rationale: എബ്രായ രാജകീയ സൂത്രവാക്യത്തോടും വംശപരമായ സൂചനയോടും അടുത്തുനിൽക്കുന്ന പ്രയോഗമാണിത്; ഇവിടെ ‘പൂർവികർ’ എന്നും അർഥമാക്കാം.
- source_word: וַיִּקָּבֵר
  choice: അടക്കപ്പെട്ടു
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണി അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְּעִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരത്തിൽ
  rationale: സ്ഥലനാമത്തിന്റെ സുതാര്യവും മലയാളത്തിൽ സ്ഥാപിതവുമായ രൂപം.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജാവിന്റെ പിൻഗാമിയെ അറിയിക്കുന്ന സന്ദർഭത്തിൽ מלך അധികാരമേറ്റ് രാജാവാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘രാജാവായി’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: חִזְקִיָּהוּ
  choice: ഹിസ്കീയാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: בְּנוֹ
  choice: അവന്റെ മകനായ
  rationale: പുത്രബന്ധം മൂലപാഠപ്രകാരം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: രാജകീയ പിന്തുടർച്ചയുടെ സന്ദർഭത്തിൽ സ്ഥാനമേറ്റെടുക്കൽ എന്ന അർഥം കൃത്യമായി പ്രകടിപ്പിക്കുന്നു; ‘അവന്റെ സ്ഥാനത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ രാജകീയ മരണ-പിന്തുടർച്ചാ സൂത്രവാക്യത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നതിനൊപ്പം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു.
