  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֨ת הַ/מִּזְבַּ֣ח הַ/נְּחֹשֶׁת֮ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָה֒ וַ/יַּקְרֵ֗ב מֵ/אֵת֙ פְּנֵ֣י הַ/בַּ֔יִת מִ/בֵּין֙ הַ/מִּזְבֵּ֔חַ וּ/מִ/בֵּ֖ין בֵּ֣ית יְהוָ֑ה וַ/יִּתֵּ֥ן אֹת֛/וֹ עַל יֶ֥רֶךְ הַ/מִּזְבֵּ֖חַ צָפֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/014.yaml
  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
translation:
  language: ml
  text: യഹോവയുടെ മുമ്പിലുണ്ടായിരുന്ന വെങ്കല യാഗപീഠം[a] അവൻ ആലയത്തിന്റെ മുൻവശത്തുനിന്നും യാഗപീഠത്തിനും യഹോവയുടെ ആലയത്തിനും ഇടയിൽനിന്നും നീക്കി, യാഗപീഠത്തിന്റെ വടക്കുവശത്ത് വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ചെമ്പുകൊണ്ടുള്ള യാഗപീഠം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  choice: വെങ്കല യാഗപീഠം
  rationale: נְחֹשֶׁת ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം; ആലയോപകരണങ്ങളുടെ പശ്ചാത്തലത്തിൽ പരമ്പരാഗതവും സാദ്ധ്യതയേറിയതുമായ ‘വെങ്കലം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു, മറ്റർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിലുണ്ടായിരുന്ന
  rationale: לִפְנֵי എന്നതിന്റെ സ്ഥലസംബന്ധമായ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ആരാധനാസംബന്ധമായ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיַּקְרֵב מֵאֵת פְּנֵי הַבַּיִת
  choice: അവൻ ആലയത്തിന്റെ മുൻവശത്തുനിന്ന് ... മാറ്റി
  rationale: קרב അടിസ്ഥാനമായി ‘അടുത്തേക്കു കൊണ്ടുവരുക’ എന്നാണെങ്കിലും ഇവിടെ യാഗപീഠത്തിന്റെ സ്ഥാനമാറ്റമാണ് സന്ദർഭം; ‘മാറ്റി’ എന്നത് പ്രവർത്തനം വ്യക്തമായി പറയുന്നു. הַבַּיִת ഇവിടെ ആലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  choice: അതായത് യാഗപീഠത്തിനും യഹോവയുടെ ആലയത്തിനും ഇടയിൽനിന്ന്
  rationale: ആദ്യത്തെ ‘യാഗപീഠം’ പുതിയതായി നിർമിച്ച യാഗപീഠമെന്ന സന്ദർഭാർത്ഥവും ആവർത്തിച്ച מִבֵּין നൽകുന്ന കൃത്യമായ സ്ഥാനവും സംരക്ഷിക്കുന്നു; ‘അതായത്’ മുൻവാക്യഭാഗത്തെ ഈ സ്ഥാനം വിശദീകരിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: സ്ഥാപിച്ചു
  rationale: נתן ഇവിടെ ഒരു വസ്തുവിനെ നിശ്ചിത സ്ഥാനത്ത് വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സ്ഥാപിച്ചു’ dignifiedവും സ്വാഭാവികവുമാണ്.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  choice: പുതിയ യാഗപീഠത്തിന്റെ വടക്കുവശത്ത്
  rationale: יֶרֶךְ എന്ന ‘വശം/പാർശ്വം’ എന്ന അർത്ഥവും צָפוֹנָה എന്ന വടക്കോട്ടുള്ള ദിശയും നൽകുന്നു. രണ്ട് യാഗപീഠങ്ങൾ ഉള്ളതിനാൽ ലക്ഷ്യസ്ഥാനത്തെ യാഗപീഠം ‘പുതിയ’ എന്ന് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കി; ഇത് അടിക്കുറിപ്പിലും രേഖപ്പെടുത്തി.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: לִפְנֵי יְהוָהയുടെ സ്ഥലപരവും ആരാധനാപരവുമായ ഭാവം
  choice: യഹോവയുടെ സന്നിധിയിൽ
  alternative: യഹോവയുടെ മുമ്പിൽ
  rationale: ഇത് യാഗപീഠത്തിന്റെ ഭൗതിക സ്ഥാനം സൂചിപ്പിക്കുന്നതോടൊപ്പം ദൈവസന്നിധിയെന്ന ആരാധനാപരമായ ഭാവവും വഹിക്കുന്നു; ‘സന്നിധിയിൽ’ രണ്ടും തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘ആലയം’, ‘യാഗപീഠം’, ‘സന്നിധി’ തുടങ്ങിയ സുപരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി. മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും [a], [b] ആയി ചേർത്തിട്ടുണ്ട്.
