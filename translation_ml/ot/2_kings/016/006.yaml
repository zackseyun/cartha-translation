source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא הֵ֠שִׁיב רְצִ֨ין מֶֽלֶךְ אֲרָ֤ם אֶת אֵילַת֙ לַֽ/אֲרָ֔ם וַ/יְנַשֵּׁ֥ל אֶת הַ/יְהוּדִ֖ים מֵֽ/אֵיל֑וֹת ו/ארמים בָּ֣אוּ אֵילַ֔ת וַ/יֵּ֣שְׁבוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
translation:
  language: ml
  text: ആ കാലത്ത് അരാമിന്റെ രാജാവായ രെസീൻ ഏലാത്തിനെ അരാമിന്റെ അധീനതയിലേക്കു തിരിച്ചുകൊണ്ടുവന്നു. അവൻ ഏലാത്തിൽനിന്ന് യെഹൂദ്യരെ പുറത്താക്കി[b]. അരാമ്യർ[a] ഏലാത്തിലേക്കു വന്ന് ഇന്നുവരെയും അവിടെ താമസിച്ചുവരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അരാമ്യർ’ എന്നാണ്. എന്നാൽ ചില വ്യാഖ്യാതാക്കളും പുരാതന പാഠസാക്ഷ്യങ്ങളും ‘എദോമ്യർ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; വിശാലമായ ചരിത്രസന്ദർഭത്തോടും 2 ദിനവൃത്താന്തം 28:17-ലെ സമാന്തരവിവരണത്തോടും അത് കൂടുതൽ യോജിക്കുന്നതായി കരുതപ്പെടുന്നു.
    reason: textual_variant
  - marker: b
    text: ഈ വാക്യത്തിൽ സ്ഥലനാമം ഒരിടത്ത് ‘ഏലോത്ത്’ എന്ന വ്യത്യസ്ത എബ്രായരൂപത്തിലും കാണപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: അധീനതയിലേക്കു തിരികെ കൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപം ഏലാത്തിനെ വീണ്ടും അരാമിന്റെ നിയന്ത്രണത്തിലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; രാഷ്ട്രീയ-സൈനിക പശ്ചാത്തലം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֵילַת / אֵילוֹת
  choice: ഏലാത്ത്
  rationale: സ്ഥലനാമത്തിന്റെ രണ്ടു എബ്രായ രൂപങ്ങൾക്കും മുഖ്യപാഠത്തിൽ ഒരേ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു; രൂപവ്യത്യാസം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: לַאֲרָם
  choice: അരാമിന്റെ അധീനതയിലേക്ക്
  rationale: അരാമിലേക്കുള്ള ഉടമസ്ഥതാ/നിയന്ത്രണ കൈമാറ്റമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘സിറിയ’ എന്ന പിൽക്കാല നാമത്തിനുപകരം എബ്രായ നാമമായ ‘അരാം’ നിലനിർത്തി.
- source_word: וַיְנַשֵּׁל
  choice: പുറത്താക്കി
  rationale: ഒരു സ്ഥലത്തെ കൈവശത്തിൽനിന്നും വാസത്തിൽനിന്നും ബലമായി നീക്കുന്നതിന്റെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַיְהוּדִים
  choice: യെഹൂദ്യർ
  rationale: രാജത്വകാല പശ്ചാത്തലത്തിൽ യെഹൂദാ രാജ്യത്തിലെ ജനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; പിൽക്കാല മത-വംശീയ അർഥം മുൻനിർത്തുന്ന പദപ്രയോഗം ഒഴിവാക്കി.
- source_word: ו/ארמים
  choice: അരാമ്യർ
  rationale: മസോററ്റിക് വ്യഞ്ജനപാഠം ‘അരാമ്യർ’ എന്നു വായിക്കുന്നു; ‘എദോമ്യർ’ എന്ന ശ്രദ്ധേയമായ പാഠഭേദം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും അവിടെ താമസിച്ചുവരുന്നു
  rationale: വിവരിക്കപ്പെട്ട സംഭവകാലം മുതൽ എഴുത്തുകാരന്റെ വർത്തമാനകാലംവരെ തുടരുന്ന താമസത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: അവസാന ഭാഗത്തിലെ ജനനാമവുമായി ബന്ധപ്പെട്ട പാഠവിമർശനപ്രശ്നം
  choice: അരാമ്യർ ഏലാത്തിലേക്കു വന്നു
  alternative: എദോമ്യർ ഏലാത്തിലേക്കു വന്നു
  rationale: മസോററ്റിക് പാഠം ‘അരാമ്യർ’ എന്നാണ്; അതിനാൽ അതാണ് മുഖ്യപാഠത്തെ നയിക്കുന്നത്. എന്നാൽ ചരിത്രപരമായ പിരിമുറുക്കവും 2 ദിനവൃത്താന്തം 28:17-ലെ സമാന്തരസന്ദർഭവും ചില പുരാതന സാക്ഷ്യങ്ങളും കാരണം ‘എദോമ്യർ’ എന്ന വായന ശ്രദ്ധേയമായതിനാൽ അത് അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ചരിത്രപരമായ ജനനാമങ്ങൾക്ക് ‘അരാമ്യർ’, ‘യെഹൂദ്യർ’ എന്നിവയും സ്ഥലനാമത്തിന് ‘ഏലാത്ത്’ എന്ന ലിപ്യന്തരവും ഉപയോഗിച്ചു. പാഠഭേദം പരിഹരിച്ചുകളയാതെ അടിക്കുറിപ്പിൽ വ്യക്തമായി സൂക്ഷിച്ചു.
