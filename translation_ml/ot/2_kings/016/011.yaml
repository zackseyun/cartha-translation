  text: So Uriah the priest built the altar[a], according to all that King Ahaz had sent from Damascus; thus Uriah the priest did, until King Ahaz came from Damascus.
translation:
  language: ml
  text: ദമസ്കോസിൽനിന്ന് ആഹാസ് രാജാവ് അയച്ചതെല്ലാം അനുസരിച്ച് പുരോഹിതൻ ഊരീയാവ് യാഗപീഠം പണിതു. ആഹാസ് രാജാവ് ദമസ്കോസിൽനിന്ന് വരുവോളം പുരോഹിതൻ ഊരീയാവ് അങ്ങനെതന്നെ ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അപ്രകാരം ചെയ്തു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പ്രയോഗം, ഊരീയാവ് ആഹാസിന്റെ നിർദേശങ്ങൾ കൃത്യമായി പാലിച്ചെന്ന് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: പണിതു
  rationale: בנה എന്ന സാധാരണ നിർമാണക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യപദം.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: כהן എന്നതിന് സ്വാഭാവികമായ മലയാള പരിഭാഷ; ഊരീയാവിനോടൊപ്പമുള്ള ആവർത്തനം മൂലപാഠത്തിലെ ഊന്നൽ നിലനിർത്താൻ രണ്ടിടത്തും സൂക്ഷിച്ചു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: מזבח എന്ന ബലിപീഠത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ ബൈബിൾപദത്തിന് വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളം.
- source_word: כְּכֹל אֲשֶׁר שָׁלַח
  choice: അയച്ചുകൊടുത്ത എല്ലാ നിർദേശങ്ങൾക്കും അനുസരിച്ച്
  rationale: വാക്യസന്ദർഭത്തിൽ രാജാവ് അയച്ചത് യാഗപീഠത്തിന്റെ മാതൃകയോ നിർദേശങ്ങളോ ആണെന്ന് മുൻവാക്യം വ്യക്തമാക്കുന്നു; 'എല്ലാറ്റിനും അനുസരിച്ച്' എന്ന അസ്വാഭാവികത ഒഴിവാക്കി പൂർണമായ അനുരൂപത അറിയിച്ചു.
- source_word: מִדַּמֶּשֶׂק
  choice: ദമസ്കോസിൽനിന്ന്
  rationale: מן ഉറവിടത്തെയോ പുറപ്പെടുന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കുന്നു; രണ്ടു പ്രയോഗങ്ങളിലും ഇത് നിലനിർത്തി.
- source_word: כֵּן עָשָׂה
  choice: അങ്ങനെതന്നെ ചെയ്തു
  rationale: രാജാവിന്റെ നിർദേശങ്ങൾ ഊരീയാവ് കൃത്യമായി പാലിച്ചെന്ന അനുരൂപതയും ഹീബ്രു പ്രയോഗത്തിന്റെ ഊന്നലും പ്രകടമാക്കുന്നു.
- source_word: עַד בּוֹא
  choice: മടങ്ങിവരുന്നതിനുമുമ്പ്
  rationale: עַד + infinitive construct പ്രവൃത്തിയുടെ സമയപരിധി രാജാവിന്റെ വരവ് വരെയാണെന്ന് സൂചിപ്പിക്കുന്നു; ഈ പൂർത്തിയായ നിർമാണസന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളത്തിനായി 'വരുന്നതിനുമുമ്പ്' ഉപയോഗിച്ചു, വരവ് ദമസ്കോസിൽനിന്നായതിനാൽ 'മടങ്ങിവരുക' എന്നു വ്യക്തമാക്കി.
- source_word: הַמֶּלֶךְ אָחָז
  choice: ആഹാസ് രാജാവ്
  rationale: മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനക്രമത്തിൽ രാജപദവി പേരിനു ശേഷം നൽകി.
