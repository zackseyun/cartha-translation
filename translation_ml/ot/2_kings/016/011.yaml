translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ഗദ്യശൈലി. ദീർഘമായ ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; ആവർത്തനവും അനുരൂപതയിലെ ഊന്നലും നിലനിർത്തി. എല്ലാ പാഠക്കുറിപ്പ് അടയാളങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
