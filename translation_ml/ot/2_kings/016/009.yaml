  text: וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּעַל֩ מֶ֨לֶךְ אַשּׁ֤וּר אֶל דַּמֶּ֨שֶׂק֙ וַֽ/יִּתְפְּשֶׂ֔/הָ וַ/יַּגְלֶ֖/הָ קִ֑ירָ/ה וְ/אֶת רְצִ֖ין הֵמִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/009.yaml
  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
translation:
  language: ml
  text: അങ്ങനെ അശ്ശൂരിന്റെ രാജാവ് അവന്റെ വാക്കു കേട്ടു[a]. അശ്ശൂരിന്റെ രാജാവ് ദമസ്കൊസിനെതിരെ പടയെടുത്തു ചെന്നു അതു പിടിച്ചടക്കി; അവിടത്തെ ജനങ്ങളെ കീറിലേക്കു നാടുകടത്തി[b], രെസീനെ കൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ ശ്രദ്ധിച്ചു” അല്ലെങ്കിൽ “അവന്റെ വാക്കു ചെവിക്കൊണ്ടു.” എബ്രായക്രിയ കേൾക്കുന്നതിനോടൊപ്പം അതനുസരിച്ച് പ്രതികരിക്കുന്നതും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, “അതിനെ കീറിലേക്കു നാടുകടത്തി”; ഇവിടെ നഗരം അതിലെ ജനങ്ങളെ പ്രതിനിധാനം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: അവന്റെ അപേക്ഷ കേട്ടു
  rationale: ശׁמע എന്ന ക്രിയ אֶל-നോടുകൂടെ ഇവിടെ കേൾക്കുക മാത്രമല്ല, ആഹാസിന്റെ അപേക്ഷയ്ക്കു അനുകൂലമായി പ്രതികരിക്കുക എന്ന ആശയവും നൽകുന്നു. സന്ദർഭത്തിൽ വ്യക്തമാകുന്ന ‘അപേക്ഷ’ ചേർക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ പ്രതികരണാർഥം അറിയിക്കുന്നു; അടിക്കുറിപ്പ് പദപ്രയോഗത്തിന്റെ അടിസ്ഥാനരൂപം സൂചിപ്പിക്കുന്നു.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവ്
  rationale: എബ്രായ നിർമാണബന്ധത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം. മൂലത്തിലെ ആവർത്തനം നിലനിർത്താൻ രണ്ടു പ്രാവശ്യവും പൂർണപദം ഉപയോഗിച്ചു.
- source_word: וַיַּעַל ... אֶל דַּמֶּשֶׂק
  choice: ദമസ്കൊസിനെതിരെ പടയെടുത്തു ചെന്ന്
  rationale: സൈനികസന്ദർഭത്തിലെ עלה ... אֶל നഗരത്തിനെതിരെ നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്ന് പിടിച്ചടക്കൽ വരുന്നതിനാൽ ശത്രുതാപരമായ സൈനികനീക്കം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּתְפְּשֶׂהָ
  choice: അതു പിടിച്ചടക്കി
  rationale: സ്ത്രീലിംഗ പ്രത്യയം ദമസ്കൊസിനെ സൂചിപ്പിക്കുന്നു; תפשׂ ഇവിടെ നഗരത്തിന്റെ നിയന്ത്രണം കൈവശപ്പെടുത്തുക എന്നർഥത്തിലാണ്.
- source_word: וַיַּגְלֶהָ קִירָה
  choice: അവിടത്തെ ജനങ്ങളെ കീറിലേക്കു നാടുകടത്തി
  rationale: എബ്രായത്തിൽ വ്യാകരണപരമായി നഗരം തന്നെയാണ് കർമം; എന്നാൽ നഗരം അതിലെ ജനങ്ങളെ പ്രതിനിധാനം ചെയ്യുന്ന ലക്ഷണപ്രയോഗമാണിത്. മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി ജനങ്ങളെ എന്നു വ്യക്തമാക്കി. קִירָהയിലെ ദിശാസൂചകാന്ത്യം ‘കീറിലേക്കു’ എന്നു നൽകി.
- source_word: קִירָה
  choice: കീർ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാന്തരണം ചെയ്തു; വാക്യത്തിൽ ദിശാവിഭക്തിയോടെ ‘കീറിലേക്കു’ എന്നു വരുന്നു.
- source_word: וְאֶת רְצִין הֵמִית
  choice: രെസീനെ കൊന്നുകളഞ്ഞു
  rationale: המית എന്ന causative ക്രിയ ‘മരണത്തിന് ഇടയാക്കി/കൊന്നു’ എന്നാണ്. രാജാവിനെ വധിച്ച സൈനികസന്ദർഭത്തിൽ ‘കൊന്നുകളഞ്ഞു’ സ്വാഭാവികവും ശക്തവുമായ മലയാളപ്രയോഗമാണ്.
