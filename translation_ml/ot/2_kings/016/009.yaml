translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ചരിത്രവിവരണശൈലി. മൂലത്തിലെ അശ്ശൂർരാജാവ് എന്ന ആവർത്തനം സംരക്ഷിച്ചു; എബ്രായത്തിലെ നഗര-ജന ലക്ഷണപ്രയോഗം പ്രധാനവാചകത്തിൽ സ്വാഭാവികമാക്കി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
