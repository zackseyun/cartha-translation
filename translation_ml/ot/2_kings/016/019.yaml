  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. എബ്രായത്തിലെ രാജഭരണസംഗ്രഹസൂത്രവും അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യഭാവവും സംരക്ഷിച്ചു; ആവർത്തനസ്വഭാവമുള്ള ബന്ധവാക്യം മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണഘടനയാക്കി.
