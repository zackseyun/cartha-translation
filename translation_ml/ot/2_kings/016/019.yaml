  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָחָ֖ז אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/019.yaml
  text: The rest of the acts of Ahaz[a], which he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: ആഹാസ് ചെയ്ത മറ്റുള്ള പ്രവൃത്തികൾ യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[a] എഴുതിയിട്ടില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദാരാജാക്കന്മാരുടെ ചരിത്രരേഖയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: മറ്റുള്ള പ്രവൃത്തികൾ
  rationale: יֶתֶר എന്നത് ‘ശേഷിക്കുന്നവ/മറ്റുള്ളവ’ എന്നും, രാജഭരണസംഗ്രഹസൂത്രത്തിലെ דִּבְרֵי രാജാവിന്റെ പ്രവൃത്തികളെയും കാര്യങ്ങളെയും എന്നും സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇവ ചേർത്ത് ‘മറ്റുള്ള പ്രവൃത്തികൾ’ എന്നു നൽകി.
- source_word: אָחָז
  choice: ആഹാസ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲשֶׁר עָשָׂה
  choice: ആഹാസ് ചെയ്ത
  rationale: ബന്ധവാക്യം മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നാമത്തിന് മുമ്പായി നൽകി; ആശയം ഒഴിവാക്കിയിട്ടില്ല.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടില്ലേ?
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ ആലങ്കാരിക ചോദ്യം മലയാളത്തിലെ സ്വാഭാവിക നിഷേധചോദ്യരൂപത്തിൽ നിലനിർത്തി.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: രേഖയെ പരാമർശിക്കുന്ന ഈ സന്ദർഭത്തിൽ עַל എന്നതിന്റെ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘പുസ്തകത്തിൽ’ എന്നാണ്.
- source_word: דִּבְרֵי הַיָּמִים
  choice: ദിനവൃത്താന്തം
  rationale: പദശഃ ‘ദിവസങ്ങളുടെ കാര്യങ്ങൾ’ എന്ന പ്രയോഗം രാജകീയ കാലാനുക്രമരേഖയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദിനവൃത്താന്തം’ എന്നു നൽകി.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ
  rationale: രേഖയും യെഹൂദാരാജാക്കന്മാരും തമ്മിലുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന לְ മലയാളത്തിൽ ഉടമസ്ഥബന്ധരൂപത്തിൽ സ്വാഭാവികമായി നൽകി.
