  verdict: revise
  source_fidelity: 'മുഖ്യ ആശയം എബ്രായ പാഠത്തോട് വിശ്വസ്തമാണ്: രാജാക്കന്മാരുടെ വഴിയിൽ നടക്കുക എന്ന പെരുമാറ്റരൂപകവും, മകനെ തീയിലൂടെ കടത്തിക്കുക എന്ന അനുഷ്ഠാനസൂചക പ്രയോഗവും സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ ‘നീക്കിക്കളഞ്ഞ’ എന്നത് הורישׁ-ന്റെ ദേശത്തുനിന്നുള്ള പുറത്താക്കൽ/നിഷ്കാസന ആശയം കുറച്ചുകൂടി വ്യക്തമായി നൽകണം.'
  naturalness: ‘ഇസ്രായേൽരാജാക്കന്മാർ’ എന്നതിനു പദവിരാമം നൽകുന്നതും, ‘മ്ലേച്ഛാചാരങ്ങൾ’ എന്ന പഴഞ്ചനും സാമൂഹികമായി അനാവശ്യമായും വർണിതമായ പദത്തിനു പകരം ആധുനികവും സ്വാഭാവികവുമായ പ്രയോഗം ഉപയോഗിക്കുന്നതും ഉചിതമാണ്.
  terminology: תועבות എന്ന അപലപനാത്മക പദത്തിന് ‘വെറുപ്പുളവാക്കുന്ന ആചാരങ്ങൾ’ യോജിച്ചതാണ്; ഇത് മതപരമായ വിധിനിർണയം പാഠത്തിൽനിന്ന് നിലനിർത്തുന്നു, എന്നാൽ ‘മ്ലേച്ഛ’ എന്ന അധിക സാംസ്കാരിക/ജാതീയ നിറം ചേർക്കുന്നില്ല. യഹ്‌വെ, ഇസ്രായേൽമക്കൾ, തീയിലൂടെ കടത്തിച്ചു എന്നിവ നിലനിർത്താം.
