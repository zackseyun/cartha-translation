id: 2KI.16.3
reference: 2 Kings 16:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/דֶ֖רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֤ם אֶת בְּנ/וֹ֙ הֶעֱבִ֣יר בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁ֨ר הוֹרִ֤ישׁ יְהוָה֙ אֹתָ֔/ם מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: ml
  text: അവൻ ഇസ്രായേൽ രാജാക്കന്മാരുടെ വഴിയിൽ നടന്നു; യഹ്‌വെ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന് പുറത്താക്കിയ ജനതകളുടെ വെറുപ്പുളവാക്കുന്ന ആചാരങ്ങൾക്കൊത്തവണ്ണം, അവൻ തന്റെ മകനെപ്പോലും തീയിലൂടെ കടത്തിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തന്റെ മകനെ തീയിൽ അർപ്പിച്ചു.’ എബ്രായത്തിൽ അക്ഷരാർഥം, ‘തന്റെ മകനെ തീയിലൂടെ കടത്തിച്ചു,’ എന്നാണ്; അപലപിക്കപ്പെട്ട ഒരു വിജാതീയ അനുഷ്ഠാനവുമായി ബന്ധപ്പെട്ട പ്രയോഗമാണിത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: വഴിയിൽ നടന്നു
  rationale: הלך എന്ന ക്രിയയും דרך എന്ന നാമവും ചേർന്ന പ്രയോഗം ജീവിതരീതിയെയോ പെരുമാറ്റമാതൃകയെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘വഴിയിൽ നടന്നു’ എന്ന രൂപം എബ്രായ രൂപകവും അതിന്റെ ധാർമിക അർഥവും നിലനിർത്തുന്നു.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാർ
  rationale: വടക്കൻ രാജ്യമായ ഇസ്രായേലിന്റെ രാജാക്കന്മാരെയാണ് ധാർമികമായ താരതമ്യത്തിനായി സൂചിപ്പിക്കുന്നത്.
- source_word: וְגַם
  choice: മകനെപ്പോലും
  rationale: גַּם നൽകുന്ന വർധിത ഊന്നൽ മലയാളത്തിൽ ‘-പോലും’ എന്ന ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֶת־בְּנוֹ
  choice: സ്വന്തം മകനെ
  rationale: ഏകവചനമായ ‘അവന്റെ മകൻ’ നിലനിർത്തുന്നു; ‘സ്വന്തം’ സന്ദർഭത്തിലെ ഞെട്ടിപ്പിക്കുന്ന വ്യക്തിപരമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הֶעֱבִיר בָּאֵשׁ
  choice: തീയിലൂടെ കടത്തിച്ചു
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപവും ‘തീയിൽ/തീയിലൂടെ’ എന്ന ഘടകവും കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു. ഇത് ശിക്ഷിക്കപ്പെട്ട ഒരു വിജാതീയ അനുഷ്ഠാനത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; എന്നാൽ ഈ വാക്യം മാത്രം നൽകുന്നതിലധികം അനുഷ്ഠാനവിശദാംശങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: כְּתֹעֲבוֹת
  choice: മ്ലേച്ഛാചാരങ്ങൾക്കൊത്തവണ്ണം
  rationale: תועבות എന്ന പദത്തിന്റെ ശക്തമായ ധാർമിക-ആരാധനാപരമായ അപലപനം ‘മ്ലേച്ഛാചാരങ്ങൾ’ നൽകുന്നു; כְּ സൂചിപ്പിക്കുന്ന അനുരൂപത ‘-ക്കൊത്തവണ്ണം’ കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: הַגּוֹיִם
  choice: ജനതകൾ
  rationale: ദേശത്തിലെ ഇസ്രായേലേതര ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന നിഷ്പക്ഷവും ആധുനികവുമായ പദം.
- source_word: אֲשֶׁר הוֹרִישׁ
  choice: നീക്കിക്കളഞ്ഞ
  rationale: ഈ ചരിത്രസന്ദർഭത്തിൽ הורישׁ ദേശത്തുനിന്ന് പുറത്താക്കുകയോ അവകാശം നഷ്ടപ്പെടുത്തി നീക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന്
  rationale: מִפְּנֵי എന്നതിലെ ‘മുമ്പിൽനിന്ന്’ എന്ന ആശയവും בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിജനതാ പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: הֶעֱבִיר בָּאֵשׁ എന്നത് വ്യക്തമായ ശിശുബലിയായി വിവർത്തനം ചെയ്യണമോ, എബ്രായ പ്രയോഗം നിലനിർത്തണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘സ്വന്തം മകനെപ്പോലും തീയിലൂടെ കടത്തിച്ചു’ എന്ന പ്രയോഗം നിലനിർത്തി
  alternative: ‘സ്വന്തം മകനെ തീയിൽ അർപ്പിച്ചു’ അല്ലെങ്കിൽ ‘സ്വന്തം മകനെ തീയിൽ ദഹിപ്പിച്ചു’
  rationale: സന്ദർഭം ഈ വിജാതീയ അനുഷ്ഠാനത്തെ വ്യക്തമായി അപലപിക്കുന്നുവെങ്കിലും, എബ്രായ വാചകം അനുഷ്ഠാനത്തിന്റെ എല്ലാ വിശദാംശങ്ങളും സ്വതന്ത്രമായി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠം യഥാർഥ ഭാഷാപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യക്തമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘വഴിയിൽ നടന്നു’ എന്ന ബൈബിൾരൂപകം വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി; ആചാരത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള എബ്രായത്തിലെ യഥാർഥ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
