revisions:
- from: അവൻ ഇസ്രായേൽരാജാക്കന്മാരുടെ വഴിയിൽ നടന്നു. യഹ്‌വെ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന് നീക്കിക്കളഞ്ഞ ജനതകളുടെ മ്ലേച്ഛാചാരങ്ങൾക്കൊത്തവണ്ണം, അവൻ സ്വന്തം മകനെപ്പോലും തീയിലൂടെ കടത്തിച്ചു.[a]
  to: അവൻ ഇസ്രായേൽ രാജാക്കന്മാരുടെ വഴിയിൽ നടന്നു; യഹ്‌വെ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന് പുറത്താക്കിയ ജനതകളുടെ വെറുപ്പുളവാക്കുന്ന ആചാരങ്ങൾക്കൊത്തവണ്ണം, അവൻ തന്റെ മകനെപ്പോലും തീയിലൂടെ കടത്തിച്ചു.[a]
  rationale: എബ്രായത്തിലെ ക്രമവും ഊന്നലും നിലനിർത്തിക്കൊണ്ട്, ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികത മെച്ചപ്പെടുത്തി. ‘തീയിലൂടെ കടത്തിച്ചു’ എന്ന മുഖ്യപാഠം അനുഷ്ഠാനത്തിന്റെ കൃത്യസ്വഭാവത്തെക്കുറിച്ചുള്ള എബ്രായ പ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു; വ്യാഖ്യാനാത്മകമായ ‘തീയിൽ അർപ്പിച്ചു’ അടിക്കുറിപ്പിൽ മാത്രം നൽകിയിരിക്കുന്നു.
