  yaml_path: translation/ot/2_kings/016/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: ml
  text: അവൻ ഉന്നതസ്ഥാനങ്ങളിലും കുന്നുകളിലും പച്ചപിടിച്ച എല്ലാ വൃക്ഷങ്ങളുടെയും കീഴിലും ബലിയർപ്പിക്കുകയും ധൂപം കത്തിക്കുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇലനിറഞ്ഞ എല്ലാ വൃക്ഷങ്ങളുടെയും കീഴിൽ’ അല്ലെങ്കിൽ ‘തഴച്ചുവളർന്ന എല്ലാ വൃക്ഷങ്ങളുടെയും കീഴിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ വിശേഷണം പച്ചയായതോ പുതുമയുള്ളതോ തഴച്ചുവളർന്നതോ ആയ ഒന്നിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: ബലിയർപ്പിക്കുകയും ചെയ്തു
  rationale: זבח എന്ന ക്രിയ ബലിയർപ്പിക്കുന്ന ആരാധനാക്രിയയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ഈ പ്രയോഗം എബ്രായത്തിൽ വ്യക്തമാക്കാത്ത കർമം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וַיְקַטֵּר
  choice: ധൂപം കത്തിക്കുകയും ചെയ്തു
  rationale: ആരാധനാസന്ദർഭത്തിലെ קטר എന്ന ക്രിയ സാധാരണയായി ധൂപം കത്തിക്കുന്നതിനെയോ വഴിപാട് പുകയാക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ ആവർത്തിച്ചുവരുന്ന വിമർശനസൂത്രവാക്യത്തിന് 'ധൂപം കത്തിച്ചു' യോജിക്കുന്നു.
- source_word: בַּבָּמוֹת
  choice: പൂജാഗിരികളിൽ
  rationale: במות എന്നത് സാധാരണയായി ഉയർന്ന സ്ഥലങ്ങളിലുള്ള പ്രാദേശിക ആരാധനാകേന്ദ്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. 'പൂജാഗിരികൾ' അവയുടെ ആരാധനാപരമായ സ്വഭാവവും ഉയർന്ന സ്ഥലമെന്ന ആശയവും സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: וְעַל הַגְּבָעוֹת
  choice: കുന്നുകളിലും
  rationale: גבעות എന്നത് ഭൂമിശാസ്ത്രപരമായ കുന്നുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ആരാധനാകേന്ദ്രങ്ങളായ במות-ൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: പച്ചപിടിച്ച എല്ലാ വൃക്ഷങ്ങളുടെയും കീഴിലും
  rationale: רענן എന്ന വിശേഷണം പച്ചയായ, തഴച്ചുവളർന്ന, ഇലനിറഞ്ഞ എന്നിങ്ങനെ അർത്ഥമാക്കാം. 'പച്ചപിടിച്ച' എന്നത് പരിചിതമായ ബൈബിൾ ദൃശ്യവും എബ്രായത്തിന്റെ അർത്ഥവ്യാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അനുവദനീയമല്ലാത്ത ആരാധനയെ വിവരിക്കുന്ന സൂത്രവാക്യത്തിന്റെ പരിഭാഷ
  choice: ബലിയർപ്പിക്കൽ, ധൂപം കത്തിക്കൽ, പൂജാഗിരികൾ, കുന്നുകൾ, വൃക്ഷങ്ങളുടെ കീഴിലെ ഇടങ്ങൾ എന്നീ മൂർത്തമായ പ്രവൃത്തികളും സ്ഥലങ്ങളും നിലനിർത്തി.
  alternative: '''വിഗ്രഹാരാധന നടത്തി'' അല്ലെങ്കിൽ ''ജാതീയ ആരാധന നടത്തി'' എന്ന വ്യാഖ്യാനാത്മക രൂപം ഉപയോഗിക്കുക.'
  rationale: ഈ വാക്യം പ്രവൃത്തികളെയും സ്ഥലങ്ങളെയും പട്ടികപ്പെടുത്തുന്നു; അവയെ ഇവിടെ നേരിട്ട് 'ജാതീയ'മെന്നോ 'വിഗ്രഹാരാധന'യെന്നോ വിളിക്കുന്നില്ല. പ്രതികൂലമായ വിലയിരുത്തൽ വിശാലമായ സന്ദർഭത്തിൽനിന്ന് വായനക്കാരൻ ഗ്രഹിക്കട്ടെ.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആദ്യ സ്ഥലവാചകത്തോടൊപ്പം വരുന്ന രണ്ടു ക്രിയകൾ പിന്നാലെയുള്ള സമാന്തര സ്ഥലങ്ങൾക്കും ബാധകമാണെന്ന് വ്യക്തമാക്കാൻ ‘അങ്ങനെ ചെയ്തു’ ചേർത്തു; പുതിയ ആരാധനാക്രിയ ഒന്നും ഇതിലൂടെ കൂട്ടിച്ചേർത്തിട്ടില്ല.
