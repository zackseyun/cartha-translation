revisions:
- from: അവൻ പൂജാഗിരികളിൽ ബലിയർപ്പിക്കുകയും ധൂപം കത്തിക്കുകയും ചെയ്തു; കുന്നുകളിലും പച്ചപിടിച്ച എല്ലാ വൃക്ഷങ്ങളുടെയും കീഴിലും അങ്ങനെ ചെയ്തു.[a]
  to: അവൻ ഉന്നതസ്ഥാനങ്ങളിലും കുന്നുകളിലും പച്ചപിടിച്ച എല്ലാ വൃക്ഷങ്ങളുടെയും കീഴിലും ബലിയർപ്പിക്കുകയും ധൂപം കത്തിക്കുകയും ചെയ്തു.[a]
  rationale: The revision removes an added resumptive expression, restores a direct three-part location series governing both cultic verbs, and replaces the less idiomatic “പൂജാഗിരികൾ” with the established modern Malayalam biblical term “ഉന്നതസ്ഥാനങ്ങൾ.” It preserves the source’s noninterpretive wording and the lexical ambiguity of רַעֲנָן.
