id: 2KI.16.2
reference: 2 Kings 16:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֣ה הַ/יָּשָׁ֗ר בְּ/עֵינֵ֛י יְהוָ֥ה אֱלֹהָ֖י/ו כְּ/דָוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
translation:
  language: ml
  text: ആഹാസ് രാജാവായപ്പോൾ അവന് ഇരുപത് വയസ്സായിരുന്നു. അവൻ യെരൂശലേമിൽ പതിനാറു വർഷം ഭരിച്ചു. തന്റെ പിതാവായ ദാവീദ്[a] ചെയ്തതുപോലെ, യഹ്‌വെ തന്റെ ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ നേരായത്[b] അവൻ ചെയ്തില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘പിതാവ്’ എന്നത് ആഹാസിന്റെ നേരിട്ടുള്ള പിതാവിനെയല്ല, അവന്റെ രാജവംശപരമായ പൂർവികനായ ദാവീദിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘ശരിയായത്’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: അവന് ഇരുപത് വയസ്സായിരുന്നു
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാള തത്തുല്യം.
- source_word: בְּמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: അവൻ രാജത്വം ഏറ്റ സമയത്തെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: രാജാധികാരം പ്രയോഗിച്ചതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: ഭരണകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലവാചകം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: നേരായത് അവൻ ചെയ്തില്ല
  rationale: രാജാക്കന്മാരിലെ പതിവ് ധാർമിക വിലയിരുത്തൽസൂത്രം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: ഒരാളുടെ വിലയിരുത്തലിൽ അഥവാ കാഴ്ചപ്പാടിൽ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ മാന്യവും വ്യക്തവുമായ മലയാള രൂപം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהָיו
  choice: തന്റെ ദൈവമായ
  rationale: ആഹാസിനെ സൂചിപ്പിക്കുന്ന ഏകവചന പുരുഷലിംഗ പ്രത്യയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כְּדָוִד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദ് ചെയ്തതുപോലെ
  rationale: אָבִיו എന്ന ഉറവിടപദം നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ ‘ചെയ്തു’ എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ പേരിനെ ലിപ്യന്തരണം ചെയ്തു.
- issue: ‘അവന്റെ പിതാവായ ദാവീദ്’ എന്നതിന്റെ അർഥം
  choice: ‘പിതാവ്’ എന്ന ഉറവിടഭാഷ നിലനിർത്തി അടിക്കുറിപ്പിൽ രാജവംശപരമായ അർഥം വ്യക്തമാക്കുക
  alternative: അവന്റെ പൂർവപിതാവായ ദാവീദ്
  rationale: രാജവംശസന്ദർഭത്തിൽ ദാവീദ് ആഹാസിന്റെ നേരിട്ടുള്ള പിതാവല്ല, പൂർവികനാണ്; എന്നാൽ മൂലത്തിലെ ബന്ധപദം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ രാജവൃത്താന്തശൈലി. എബ്രായ വാക്യഘടന അനാവശ്യമായി പകർത്താതെ വിവരക്രമവും ദൈവശാസ്ത്രപരമായ വിലയിരുത്തലും സംരക്ഷിച്ചു; ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തി.
