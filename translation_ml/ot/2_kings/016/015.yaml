source:
  edition: WLC
  text: ו/יצו/הו הַ/מֶּֽלֶךְ אָ֠חָז אֶת אוּרִיָּ֨ה הַ/כֹּהֵ֜ן לֵ/אמֹ֗ר עַ֣ל הַ/מִּזְבֵּ֣חַ הַ/גָּד֡וֹל הַקְטֵ֣ר אֶת עֹֽלַת הַ/בֹּקֶר֩ וְ/אֶת מִנְחַ֨ת הָ/עֶ֜רֶב וְֽ/אֶת עֹלַ֧ת הַ/מֶּ֣לֶךְ וְ/אֶת מִנְחָת֗/וֹ וְ֠/אֵת עֹלַ֞ת כָּל עַ֤ם הָ/אָ֨רֶץ֙ וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֔ם וְ/כָל דַּ֥ם עֹלָ֛ה וְ/כָל דַּם זֶ֖בַח עָלָ֣י/ו תִּזְרֹ֑ק וּ/מִזְבַּ֧ח הַ/נְּחֹ֛שֶׁת יִֽהְיֶה לִּ֖/י לְ/בַקֵּֽר־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
translation:
  language: ml
  text: 'അപ്പോൾ ആഹാസ് രാജാവ് ഊരീയാ പുരോഹിതനോടു കല്പിച്ചു: “വലിയ യാഗപീഠത്തിന്മേൽ പ്രഭാതത്തിലെ ഹോമയാഗവും സായാഹ്നത്തിലെ ധാന്യയാഗവും രാജാവിന്റെ ഹോമയാഗവും അവന്റെ ധാന്യയാഗവും ദേശത്തിലെ സകലജനങ്ങളുടെയും ഹോമയാഗവും അവരുടെ ധാന്യയാഗങ്ങളും പാനീയയാഗങ്ങളും അർപ്പിക്കുക. ഹോമയാഗത്തിന്റെ രക്തം മുഴുവനും ബലിയുടെ രക്തം മുഴുവനും അതിന്മേൽ ചീറ്റണം. എന്നാൽ വെങ്കലയാഗപീഠം എനിക്ക് അന്വേഷിക്കാനായി ഇരിക്കട്ടെ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരിശോധിക്കാനായി,’ ‘പരിഗണിക്കാനായി,’ അല്ലെങ്കിൽ ഒരുപക്ഷേ ‘അതിലൂടെ മാർഗനിർദേശം തേടാനായി’ എന്നും വരാം. ഇവിടത്തെ ഹീബ്രു പ്രയോഗം ദുഷ്കരമാണ്; വെങ്കലയാഗപീഠത്തിന് ആഹാസ് നിശ്ചയിച്ച കൃത്യമായ ഉപയോഗം വ്യക്തമല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַוֵּהוּ הַמֶּלֶךְ אָחָז אֶת אוּרִיָּה הַכֹּהֵן
  choice: ആഹാസ് രാജാവ് ഊരീയാ പുരോഹിതനോടു കല്പിച്ചു
  rationale: രാജകല്പനയുടെ ആധികാരിക ഭാവം ‘കല്പിച്ചു’ നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിക്കുന്നു.
- source_word: עַל הַמִּזְבֵּחַ הַגָּדוֹל
  choice: വലിയ യാഗപീഠത്തിന്മേൽ
  rationale: הַגָּדוֹל എന്ന വിശേഷണം നേരിട്ട് നിലനിർത്തുകയും പുതുതായി നിർമിച്ച യാഗപീഠത്തെ വെങ്കലയാഗപീഠത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַקְטֵר
  choice: അർപ്പിക്കുക
  rationale: കത്തിച്ച് പുകയുയർത്തുന്ന യാഗക്രിയയെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ യാഗപരിഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: עֹלַת הַבֹּקֶר וְאֶת מִנְחַת הָעֶרֶב
  choice: പ്രഭാതത്തിലെ ഹോമയാഗവും സായാഹ്നത്തിലെ ധാന്യയാഗവും
  rationale: עֹלָהയെ മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗമായ ‘ഹോമയാഗം’ എന്നും, യാഗസന്ദർഭത്തിലെ מִנְחָהയെ ‘ധാന്യയാഗം’ എന്നും വേർതിരിക്കുന്നു.
- source_word: עֹלַת כָּל עַם הָאָרֶץ
  choice: ദേശത്തിലെ സകലജനങ്ങളുടെയും ഹോമയാഗം
  rationale: עַם הָאָרֶץ എന്ന കൂട്ടായ സാമൂഹിക-രാഷ്ട്രീയ പ്രയോഗത്തെ അനാവശ്യമായി ‘സാധാരണക്കാർ’ എന്നു പരിമിതപ്പെടുത്താതെ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: מִנְחָתָם וְנִסְכֵּיהֶם
  choice: അവരുടെ ധാന്യയാഗങ്ങളും പാനീയയാഗങ്ങളും
  rationale: ബഹുവചന പ്രത്യയങ്ങളും യാഗങ്ങളുടെ വ്യത്യസ്ത വിഭാഗങ്ങളും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְכָל דַּם עֹלָה וְכָל דַּם זֶבַח
  choice: ഹോമയാഗത്തിന്റെ രക്തം മുഴുവനും മറ്റു യാഗങ്ങളുടെ രക്തം മുഴുവനും
  rationale: עֹלָהയും പൊതുവായ זֶבַחയും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്താൻ രണ്ടാമത്തേതിനെ ‘മറ്റു യാഗങ്ങൾ’ എന്നു നൽകുന്നു.
- source_word: עָלָיו תִּזְרֹק
  choice: അതിന്മേൽ ചീറ്റണം
  rationale: זרק സൂചിപ്പിക്കുന്ന രക്തം എറിഞ്ഞൊഴിക്കുന്നതോ ശക്തിയായി തളിക്കുന്നതോ ആയ യാഗക്രിയയെ ‘ചീറ്റണം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സർവനാമം വലിയ യാഗപീഠത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: എന്നാൽ വെങ്കലയാഗപീഠം
  rationale: വാക്യത്തിലെ വിരുദ്ധഭാവവും യാഗപീഠത്തിന്റെ വസ്തുവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יִהְיֶה לִּי לְבַקֵּר
  choice: എനിക്ക് അന്വേഷിക്കാനായി ഇരിക്കട്ടെ
  rationale: ദുഷ്കരമായ לְבַקֵּר എന്ന പ്രയോഗത്തിന്റെ പരിശോധന, പരിഗണന, മാർഗനിർദേശം തേടൽ എന്നീ സാധ്യതകളെ പൂർണമായി അടച്ചുപൂട്ടാതെ ‘അന്വേഷിക്കുക’ എന്ന വിശാല പദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: വെങ്കലയാഗപീഠത്തിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന לְבַקֵּר എന്നതിന്റെ അർഥം
  choice: എനിക്ക് അന്വേഷിക്കാനായി
  alternative: എനിക്ക് പരിശോധിക്കാനായി; എനിക്ക് പരിഗണിക്കാനായി; അതിലൂടെ മാർഗനിർദേശം തേടാനായി
  rationale: ഹീബ്രു പ്രയോഗം ദുഷ്കരവും കൃത്യമായ പ്രവർത്തനം അനിശ്ചിതവുമാണ്. ‘അന്വേഷിക്കാനായി’ എന്നത് ആഹാസ് അതിനെ സ്വന്തം ഭാവിയിലെ ഉപയോഗത്തിനായി മാറ്റിവെക്കുന്നു എന്ന ആശയം നിലനിർത്തുന്നു; എന്നാൽ ഒരു പ്രത്യേക ദിവ്യജ്ഞാനരീതി പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആരാധനാപരവും ചരിത്രവിവരണത്തിന് യോജിച്ചതുമായ ഗൗരവമുള്ള ശൈലി. യാഗസാങ്കേതിക പദങ്ങൾക്ക് ‘ഹോമയാഗം,’ ‘ധാന്യയാഗം,’ ‘പാനീയയാഗം,’ ‘യാഗപീഠം’ എന്നിവ സ്ഥിരമായി ഉപയോഗിച്ചു. അന്തിമ പ്രയോഗത്തിലെ യഥാർഥ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
