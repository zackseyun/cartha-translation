  text: וְ/אֶת מיסך הַ/שַּׁבָּ֜ת אֲשֶׁר בָּנ֣וּ בַ/בַּ֗יִת וְ/אֶת מְב֤וֹא הַ/מֶּ֨לֶךְ֙ הַֽ/חִיצ֔וֹנָ/ה הֵסֵ֖ב בֵּ֣ית יְהוָ֑ה מִ/פְּנֵ֖י מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
