  yaml_path: translation/ot/2_kings/016/018.yaml
  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
translation:
  language: ml
  text: ആലയത്തിൽ അവർ പണിതിരുന്ന ശബ്ബത്തിനായുള്ള മൂടിയ വഴിയും[a] രാജാവിന്റെ പുറത്തെ പ്രവേശനകവാടവും[b] അവൻ യഹോവയുടെ ആലയത്തിൽനിന്ന് മാറ്റി[c]—അശ്ശൂർരാജാവിന്റെ കാരണത്താൽ.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശബ്ബത്തിനുള്ള മൂടിയ നിർമിതി,’ ‘ശബ്ബത്ത് മണ്ഡപം,’ അല്ലെങ്കിൽ ‘ശബ്ബത്ത് പൂമുഖം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം സൂചിപ്പിക്കുന്ന കൃത്യമായ വാസ്തുഘടകം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘രാജാവിന്റെ പുറംപ്രവേശനം’ അല്ലെങ്കിൽ ‘രാജാവിനുള്ള പുറത്തെ പ്രവേശനവഴി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘വഴിതിരിച്ചുവിട്ടു,’ ‘രൂപഭേദം വരുത്തി,’ ‘സ്ഥാനം മാറ്റി,’ അല്ലെങ്കിൽ ‘നീക്കംചെയ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ ഒന്നിനെ വഴിതിരിച്ചുവിടുന്നതിനെയോ അതിന്റെ ക്രമീകരണം മാറ്റുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: d
    text: ‘അശ്ശൂർരാജാവു നിമിത്തം’ എന്നും, ഒരുപക്ഷേ ‘അശ്ശൂർരാജാവിനെ ഭയന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשבת
  choice: ശബ്ബത്തിനായുള്ള മൂടിയ വഴി
  rationale: מיסך അപൂർവമായ ഒരു വാസ്തുശില്പപദമാണ്; ശബ്ബത്തുമായി ബന്ധപ്പെട്ട മേൽക്കൂരയുള്ള ഒരു നിർമിതിയെ ഇത് സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. കൃത്യമായ രൂപം അനിശ്ചിതമായതിനാൽ പൊതുവായതും സ്വാഭാവികവുമായ ഈ പ്രയോഗം സ്വീകരിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: אֲשֶׁר בָּנוּ בַבַּיִת
  choice: ആലയത്തിൽ അവർ പണിതിരുന്ന
  rationale: בָּנוּ എന്ന ബഹുവചന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവിനെ ‘അവർ’ എന്നു നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ בַּבַּיִת യഹോവയുടെ ആലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  choice: രാജാവിന്റെ പുറത്തെ പ്രവേശനകവാടം
  rationale: מְבוֹא പ്രവേശനസ്ഥലമോ പ്രവേശനവഴിയോ സൂചിപ്പിക്കുന്നു. രാജാവിനുള്ള പുറംപ്രവേശനം എന്ന ബന്ധം അധികമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: הֵסֵב
  choice: മാറ്റി
  rationale: סבב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് തിരിക്കുക, വഴിതിരിച്ചുവിടുക, സ്ഥാനം മാറ്റുക, രൂപഭേദം വരുത്തുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ‘മാറ്റി’ ഇവയിൽ ഒന്നിനെ അനാവശ്യമായി ഉറപ്പിക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: ക്ഷേത്രത്തെ സൂചിപ്പിക്കുന്ന בית יהוה എന്ന പതിവുപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവിനെപ്രതി
  rationale: מִפְּנֵי ഇവിടെ കാരണം, സമ്മർദം, അല്ലെങ്കിൽ ഭയം എന്നിവ സൂചിപ്പിക്കാം. ‘അശ്ശൂർരാജാവിനെപ്രതി’ പ്രേരണയെ അതിരുകടന്ന് നിർവചിക്കാതെ ആ ബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അശ്ശൂർരാജാവിനോടുള്ള ആഹാസിന്റെ പ്രേരണ
  choice: അശ്ശൂർരാജാവിനെപ്രതിയായിരുന്നു അത്
  alternative: അശ്ശൂർരാജാവിനെ ഭയന്നിട്ടായിരുന്നു അത്
  rationale: מִפְּנֵי കാരണം അല്ലെങ്കിൽ ഒരാളുടെ സാന്നിധ്യത്തെയോ സമ്മർദത്തെയോ അഭിമുഖീകരിക്കൽ സൂചിപ്പിക്കാം; ഭയം ഉണ്ടായിരുന്നുവെന്ന് മൂലപാഠം നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല.
- issue: ആലയഘടകങ്ങളിൽ വരുത്തിയ മാറ്റത്തിന്റെ സ്വഭാവം
  choice: മാറ്റി
  alternative: നീക്കംചെയ്തു / വഴിതിരിച്ചുവിട്ടു / സ്ഥാനം മാറ്റി
  rationale: הֵסֵב കൃത്യമായി നീക്കംചെയ്യലാണോ, വഴിതിരിച്ചുവിടലാണോ, സ്ഥാനം മാറ്റലാണോ എന്നത് അനിശ്ചിതമാണ്; അതിനാൽ വിശാലമായ പദം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. അപൂർവമായ വാസ്തുപദത്തിന്റെയും ക്രിയയുടെയും അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ പൊതുവായ പദങ്ങളിലൂടെയും അടിക്കുറിപ്പുകളിൽ മറ്റ് സാധ്യതകളിലൂടെയും സംരക്ഷിച്ചു. വാക്യാവസാനത്തിലെ ഡാഷ് കാരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
