source:
  edition: WLC
  text: וַ/יַּקְטֵ֤ר אֶת עֹֽלָת/וֹ֙ וְ/אֶת מִנְחָת֔/וֹ וַ/יַּסֵּ֖ךְ אֶת נִסְכּ֑/וֹ וַ/יִּזְרֹ֛ק אֶת דַּֽם הַ/שְּׁלָמִ֥ים אֲשֶׁר ל֖/וֹ עַל הַ/מִּזְבֵּֽחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
translation:
  language: ml
  text: അവൻ തന്റെ ഹോമയാഗവും ധാന്യയാഗവും ദഹിപ്പിച്ചു; തന്റെ പാനീയയാഗം ഒഴിച്ചു; തനിക്കുള്ള സമാധാനയാഗങ്ങളുടെ രക്തം യാഗപീഠത്തിന്മേൽ ചീറ്റിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൂട്ടായ്മയാഗങ്ങളുടെ രക്തം’ എന്നോ ‘ക്ഷേമയാഗങ്ങളുടെ രക്തം’ എന്നോ വിവർത്തനം ചെയ്യാം. എബ്രായത്തിലെ שְׁלָמִים ഒരു പ്രത്യേക യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: ധൂപമായി അർപ്പിച്ചു
  rationale: ഹിഫ്ഈൽ രൂപം യാഗവസ്തു പുക ഉയരുന്നവിധം യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന കർമത്തെ സൂചിപ്പിക്കുന്നു. വെറും ‘കത്തിച്ചു’ എന്നതിനെക്കാൾ യാഗപരമായ അർഥം ഇതിൽ വ്യക്തമാണ്.
- source_word: עֹלָתוֹ
  choice: തന്റെ ഹോമയാഗം
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന അംഗീകൃത യാഗവിഭാഗമാണ്; മലയാള ബൈബിൾ ഭാഷയിൽ ‘ഹോമയാഗം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִנְחָתוֹ
  choice: ധാന്യയാഗം
  rationale: ആരാധനാക്രമത്തിലെ מִנְחָה സാധാരണ സമ്മാനമല്ല, ധാന്യത്തിൽനിന്നുള്ള പ്രത്യേക യാഗവിഭാഗമാണ്.
- source_word: וַיַּסֵּךְ / נִסְכּוֹ
  choice: തന്റെ പാനീയയാഗം ഒഴിച്ചു
  rationale: נסך യാഗകർമമായി ദ്രാവകം ഒഴിക്കുന്നതിനെയും נֶסֶךְ ആ പാനീയയാഗത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּזְרֹק
  choice: തളിച്ചു
  rationale: യാഗരക്തം യാഗപീഠത്തിലേക്കോ അതിന്റെ വശങ്ങളിലേക്കോ ശക്തിയായി ചിതറിക്കുന്ന സാങ്കേതിക കർമമാണിത്. മലയാളത്തിൽ ‘തളിച്ചു’ സ്വാഭാവികമാണ്; മൃദുവായി തുള്ളിവീഴ്ത്തുക എന്ന അർഥം മാത്രം ഉദ്ദേശിക്കുന്നില്ല.
- source_word: דַּם הַשְּׁלָמִים
  choice: സമാധാനയാഗങ്ങളുടെ രക്തം
  rationale: שְׁלָמִים ഒരു പ്രത്യേക യാഗവിഭാഗമാണ്. ‘സമാധാനയാഗങ്ങൾ’ പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ പദപ്രയോഗമാണ്; പദത്തിന്റെ മറ്റ് സാധുവായ ആശയങ്ങൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר לוֹ
  choice: തനിക്കുള്ള
  rationale: യാഗങ്ങൾ അവന്റേതാണെന്ന ഉടമസ്ഥതയോ അവനുവേണ്ടിയുള്ളതാണെന്ന ബന്ധമോ എബ്രായപ്രയോഗത്തിൽ സാധ്യമാണ്; ചുരുക്കമായ ഈ രൂപം അതിനെ അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: עַל അടിസ്ഥാനമായി ‘മേൽ/മീതെ’ എന്നാണ്; זרק-നോടൊപ്പം രക്തം യാഗപീഠത്തിലേക്കോ അതിന്റെ വശങ്ങളിൽ പതിയുന്നവിധമോ തളിക്കുന്ന കർമത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ പേര്
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ; ക്ഷേമയാഗങ്ങൾ
  rationale: പദം സമാധാനം, സമഗ്രക്ഷേമം, കൂട്ടായ്മ എന്നിവയുമായി ബന്ധമുള്ള യാഗവിഭാഗത്തെ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ പരിചിതമായ രൂപം ഉപയോഗിച്ച് മറ്റ് സാധുവായ അർഥസൂചനകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ. യാഗവിഭാഗങ്ങൾക്ക് പരിചിതമായ മലയാള പദങ്ങൾ ഉപയോഗിച്ചു; അപരിചിതമായ സാങ്കേതികത ഒഴിവാക്കിക്കൊണ്ട് എബ്രായത്തിലെ കർമക്രമവും ആവർത്തിക്കുന്ന ‘തന്റെ/തനിക്കുള്ള’ ബന്ധവും സൂക്ഷിച്ചു.
