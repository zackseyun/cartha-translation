  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ക്ഷേത്രോപകരണങ്ങളെ വിവരിക്കാൻ യോജിച്ച ഗൗരവമുള്ള മലയാളം. വാക്യത്തിലെ ദീർഘമായ ഏകോപനഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; എല്ലാ പ്രവൃത്തികളുടെയും ക്രമം സംരക്ഷിച്ചു.
