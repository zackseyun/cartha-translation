  text: וַ/יְקַצֵּץ֩ הַ/מֶּ֨לֶךְ אָחָ֜ז אֶת הַ/מִּסְגְּר֣וֹת הַ/מְּכֹנ֗וֹת וַ/יָּ֤סַר מֵֽ/עֲלֵי/הֶם֙ ו/את הַ/כִּיֹּ֔ר וְ/אֶת הַ/יָּ֣ם הוֹרִ֔ד מֵ/עַ֛ל הַ/בָּקָ֥ר הַ/נְּחֹ֖שֶׁת אֲשֶׁ֣ר תַּחְתֶּ֑י/הָ וַ/יִּתֵּ֣ן אֹת֔/וֹ עַ֖ל מַרְצֶ֥פֶת אֲבָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
translation:
  language: ml
  text: പിന്നെ ആഹാസ് രാജാവ് താങ്ങുകളുടെ ചട്ടക്കൂടുകൾ മുറിച്ചുമാറ്റി, അവയുടെ മുകളിൽനിന്ന് ക്ഷാളനപാത്രം[a] നീക്കി. അതിന്റെ കീഴിലുണ്ടായിരുന്ന വെങ്കലക്കാളകളുടെ[c] മുകളിൽനിന്ന് കടലിനെ[b] ഇറക്കി, കല്ലുപാകിയ തറയിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ക്ഷേത്രശുശ്രൂഷയിൽ കഴുകുന്നതിനായി ഉപയോഗിച്ചിരുന്ന പാത്രം.
    reason: lexical_clarification
  - marker: b
    text: ശലോമോന്റെ ക്ഷേത്രത്തിനായി നിർമിച്ച വലിയ ജലപാത്രത്തിന്റെ പേരാണ് ‘കടൽ’ (1 രാജാക്കന്മാർ 7:23–26 കാണുക).
    reason: cross_reference
  - marker: c
    text: അഥവാ, ‘വെങ്കലക്കന്നുകാലികളുടെ.’ എബ്രായപദം കന്നുകാലികളെ പൊതുവായി സൂചിപ്പിക്കാം; ഈ ക്ഷേത്രസന്ദർഭത്തിൽ ‘കാളകൾ’ എന്നതാണ് പതിവായ ധാരണ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַצֵּץ
  choice: മുറിച്ചുമാറ്റി
  rationale: קצץ എന്ന ക്രിയ ഭാഗങ്ങൾ വെട്ടിയോ മുറിച്ചോ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ക്ഷേത്രോപകരണങ്ങൾ പൊളിച്ചുമാറ്റുന്ന സന്ദർഭത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַמִּסְגְּרוֹת
  choice: ചട്ടക്കൂടുകൾ
  rationale: מִסְגְּרוֹת എന്നത് ചുറ്റുമുള്ള ഫ്രെയിംപോലുള്ള ഘടനകളെയോ അതിരുകളെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘ചട്ടക്കൂടുകൾ’ നിഷ്പക്ഷമായ പരിഭാഷയാണ്.
- source_word: הַמְּכֹנוֹת
  choice: താങ്ങുകൾ
  rationale: ക്ഷേത്രത്തിലെ ക്ഷാളനപാത്രങ്ങൾ വഹിച്ചിരുന്ന ചക്രങ്ങളോടുകൂടിയ അടിത്തറകളെയാണ് מְכֹנוֹת സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് രൂപവും പ്രവർത്തനവും ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ‘താങ്ങുകൾ’ ഉപയോഗിച്ചു.
- source_word: הַכִּיּוֹר
  choice: ക്ഷാളനപാത്രം
  rationale: כִּיּוֹר ക്ഷേത്രശുശ്രൂഷയിലെ കഴുകലിനുള്ള പാത്രമാണ്. ‘ക്ഷാളനപാത്രം’ ആരാധനാസന്ദർഭവും വസ്തുവിന്റെ ഉപയോഗവും വ്യക്തമാക്കുന്നു.
- source_word: הַיָּם
  choice: കടൽ
  rationale: ശലോമോന്റെ ക്ഷേത്രത്തിലെ വലിയ ജലപാത്രത്തിന്റെ സ്ഥിരനാമമാണ് ‘കടൽ’; അതിനെ പൊതുവായ ഒരു ജലാശയമായി വ്യാഖ്യാനിക്കാതെ പേരിന്റെ രൂപം നിലനിർത്തി.
- source_word: הוֹרִיד
  choice: ഇറക്കി
  rationale: ירד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം പിന്താങ്ങിന്റെ മുകളിൽനിന്ന് താഴെയിറക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַבָּקָר הַנְּחֹשֶׁת
  choice: വെങ്കലക്കാളകൾ
  rationale: בָּקָר കന്നുകാലികളെ പൊതുവായി സൂചിപ്പിക്കാമെങ്കിലും ഈ ക്ഷേത്രനിർമാണസന്ദർഭത്തിൽ പാത്രം താങ്ങുന്ന കാളരൂപങ്ങളാണ് ഉദ്ദേശ്യം; נְחֹשֶׁת എന്നതിന് ഇവിടെ ‘വെങ്കലം’ യോജിക്കുന്നു.
- source_word: עַל מַרְצֶפֶת אֲבָנִים
  choice: കല്ലുപാകിയ തറയിൽ
  rationale: מַרְצֶפֶת אֲבָנִים കല്ലുകൾ പാകിയ ഉപരിതലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഉയർന്ന പീഠമെന്ന ആശയം ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ പരിഭാഷപ്പെടുത്തി.
