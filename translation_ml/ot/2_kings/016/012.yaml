  text: וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ מִ/דַּמֶּ֔שֶׂק וַ/יַּ֥רְא הַ/מֶּ֖לֶךְ אֶת הַ/מִּזְבֵּ֑חַ וַ/יִּקְרַ֥ב הַ/מֶּ֛לֶךְ עַל הַ/מִּזְבֵּ֖חַ וַ/יַּ֥עַל עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
translation:
  language: ml
  text: രാജാവ് ദമസ്കോസിൽനിന്നു വന്നപ്പോൾ, രാജാവ് യാഗപീഠം കണ്ടു; രാജാവ് യാഗപീഠത്തിനടുത്തേക്കു ചെന്ന് അതിന്മേൽ കയറി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഗപീഠത്തിനടുത്തേക്കു ചെന്ന് അതിന്മേൽ യാഗം അർപ്പിച്ചു.” “അതിന്മേൽ കയറി” എന്നതിനെ യാഗാർപ്പണപ്രവൃത്തി ആരംഭിക്കുന്നതിന്റെ ചുരുക്കപ്രയോഗമായി ചിലർ വ്യാഖ്യാനിക്കുന്നു; എങ്കിലും എബ്രായപാഠം കൂടുതൽ നേരിട്ടായി യാഗപീഠത്തിന്മേൽ കയറുന്നതാണ് പറയുന്നത്.
    reason: וַיַּעַל עָלָיו എന്ന പ്രയോഗത്തിന്റെ ശാരീരികവും യാഗപരവുമായ വായനകൾ സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നപ്പോൾ
  rationale: בוא എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘വരുക’ നിലനിർത്തുന്നു. തുടർന്നുള്ള പ്രവൃത്തിയുമായി സ്വാഭാവികമായ കാലബന്ധം പ്രകടമാക്കാൻ മലയാളത്തിൽ ‘വന്നപ്പോൾ’ എന്നു നൽകി.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: എബ്രായപാഠത്തിൽ ഈ നാമം മൂന്നു പ്രാവശ്യം ആവർത്തിക്കുന്നതിനാൽ, ആഹാസിന്റെ നേരിട്ടുള്ള പ്രവർത്തനങ്ങൾക്ക് നൽകുന്ന ഊന്നൽ നിലനിർത്താൻ മലയാളത്തിലും ആവർത്തിച്ചു.
- source_word: מִדַּמֶּשֶׂק
  choice: ദമസ്കോസിൽനിന്നു
  rationale: מִן ഉറവിടത്തെയോ പുറപ്പെടുന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം മലയാളത്തിലെ നിലവിലുള്ള രൂപത്തിൽ നൽകി.
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ראה ഇവിടെ നേരിട്ടുള്ള കാഴ്ചയെ സൂചിപ്പിക്കുന്നു; ‘കണ്ടു’ എന്നത് ലളിതവും കൃത്യവുമായ വിവർത്തനമാണ്.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: מִזְבֵּחַ എന്നതിന് ആരാധനാസന്ദർഭത്തിൽ വ്യക്തവും സാധാരണവുമായ മലയാളപദം.
- source_word: וַיִּקְרַב עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനടുത്തേക്കു ചെന്നു
  rationale: קרב എന്നത് അടുത്തുവരുക/സമീപിക്കുക എന്നാണ്; അതിനോടൊപ്പമുള്ള עַל ഇവിടെ ലക്ഷ്യത്തിലേക്കുള്ള സമീപനമായി സ്വാഭാവികമായി മനസ്സിലാക്കാം.
- source_word: וַיַּעַל עָלָיו
  choice: അതിന്മേൽ കയറി
  rationale: עלה + עַל എന്ന ഘടനയുടെ ഏറ്റവും നേരിട്ടുള്ള അർഥം യാഗപീഠത്തിന്മേലേക്കുള്ള കയറ്റമാണ്. യാഗാർപ്പണം എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: וַיַּעַל עָלָיו ശാരീരികമായി കയറിയതാണോ യാഗം അർപ്പിച്ചതാണോ
  choice: 'ശാരീരിക കയറ്റം: ‘അതിന്മേൽ കയറി’'
  alternative: ‘അതിന്മേൽ യാഗം അർപ്പിച്ചു’ അല്ലെങ്കിൽ ‘അതിനടുത്തേക്കു കയറിച്ചെന്നു’
  rationale: עלה എന്ന ക്രിയയും עַל എന്ന ഉപസർഗവും ചേർന്ന ഘടന നേരിട്ടായി കയറുന്നതിനെ സൂചിപ്പിക്കുന്നു. യാഗാർപ്പണത്തിന്റെ വിശദാംശങ്ങൾ അടുത്ത വാക്യത്തിൽ വരുന്നതിനാൽ അവ ഇവിടെ മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല; എങ്കിലും സാദ്ധ്യമായ യാഗപരമായ ചുരുക്കപ്രയോഗം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ‘രാജാവ്’ എന്ന മൂന്നു പ്രാവശ്യത്തെ ആവർത്തനം ശൈലിപരമായി നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ അടയാളം അതു വിശദീകരിക്കുന്ന ‘അതിന്മേൽ കയറി’ എന്ന വാക്യഭാഗത്തിനു പിന്നാലെ സ്ഥാപിച്ചു.
