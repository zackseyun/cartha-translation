id: 2KI.16.1
reference: 2 Kings 16:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/שְׁנַת֙ שְׁבַֽע עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/פֶ֖קַח בֶּן רְמַלְיָ֑הוּ מָלַ֛ךְ אָחָ֥ז בֶּן יוֹתָ֖ם מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/001.yaml
  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: ml
  text: രെമല്യാവിന്റെ മകനായ പേക്കഹിന്റെ പതിനേഴാം ഭരണവർഷത്തിൽ, യോഥാമിന്റെ മകനായ ആഹാസ് യെഹൂദാരാജാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: പതിനേഴാം ഭരണവർഷത്തിൽ
  rationale: രാജാക്കന്മാരുടെ ഭരണകാലം ഒത്തുനോക്കുന്ന ഈ തീയതിസൂത്രത്തിൽ בִּשְׁנַת എന്നത് ‘വർഷത്തിൽ’ എന്നും സംഖ്യാവാക്യം ക്രമസംഖ്യയായ ‘പതിനേഴാം’ എന്നും അർഥമാക്കുന്നു. മലയാളത്തിൽ ‘ഭരണവർഷം’ എന്നു പറയുന്നത് ആരുടെ വർഷമാണ് എണ്ണുന്നതെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לְ/פֶקַח בֶּן רְמַלְיָהוּ
  choice: രെമല്യാവിന്റെ മകനായ പേക്കഹിന്റെ
  rationale: לְ ഇവിടെ പേക്കഹിന്റെ ഭരണവർഷമാണ് എണ്ണുന്നതെന്ന് സൂചിപ്പിക്കുന്നു; בֶּן എന്ന പിതൃനാമബന്ധം സ്വാഭാവികമായ മലയാള ഷഷ്ഠീഘടനയിൽ നിലനിർത്തി.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: രാജഭരണസൂത്രങ്ങളിൽ מָלַךְ ഭരണാരോഹണത്തെ സൂചിപ്പിക്കുന്നു. ‘രാജാവായി’ എന്നത് തുടക്കഭാവം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; മുഴുവൻ ഭരണകാലത്തെയും സൂചിപ്പിക്കുന്ന ‘ഭരിച്ചു’ ഒഴിവാക്കി.
- source_word: אָחָז בֶּן יוֹתָם
  choice: യോഥാമിന്റെ മകൻ ആഹാസ്
  rationale: പിതൃനാമബന്ധം നേരിട്ട് നിലനിർത്തുകയും പേരുകൾ മലയാള ബൈബിൾ വായനയിൽ തിരിച്ചറിയാവുന്ന രൂപത്തിൽ ലിപ്യന്തരം ചെയ്യുകയും ചെയ്തു.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ
  rationale: ഈ സ്ഥാനപ്പേര് ആഹാസിനെ വിശേഷിപ്പിക്കുന്ന സമാനാധികരണ ഘടകമാണ്; മലയാളത്തിൽ ‘യെഹൂദാരാജാവായ’ എന്ന രൂപം അത് വ്യക്തവും സ്വാഭാവികവുമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ചരിത്രവിവരണത്തിന് യോജിച്ച ഗൗരവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ലാളിത്യവും പാലിച്ചു. മൂലത്തിലെ ഭരണകാല-സമന്വയ സൂത്രവും പിതൃനാമബന്ധങ്ങളും സംരക്ഷിച്ചു.
