  source_fidelity: 'വാക്യത്തിലെ പ്രധാന ഘടകങ്ങൾ ശരിയായി പ്രതിഫലിക്കുന്നു: ആഹാസിന്റെ ദമസ്കൊസിലേക്കുള്ള യാത്ര, അസ്സീറിയാരാജാവായ തിഗ്ലത്ത്-പിലേസെരുമായി കൂടിക്കാഴ്ച, അവിടത്തെ യാഗപീഠം കാണൽ, പുരോഹിതനായ ഊരീയാവിന് മാതൃകയും രൂപരേഖയും അയയ്ക്കൽ. എന്നാൽ «കണ്ടപ്പോൾ» എന്ന പ്രയോഗം ഹീബ്രുവിലെ തുടർച്ചയായ രണ്ടു പ്രവൃത്തികളെ കാരണ/കാലബന്ധമായി അവതരിപ്പിക്കുന്നു; അത് ഒഴിവാക്കുന്നതാണ് കൂടുതൽ കൃത്യം. «പണിപ്പാടുകൾ»ക്കു പകരം നിർമാണവിശദാംശങ്ങൾ എന്നത് מַעֲשֵׂהוּയുടെ ഈ സന്ദർഭത്തിലെ സാങ്കേതിക അർഥം കൂടുതൽ വ്യക്തമായി നൽകുന്നു.'
