  yaml_path: translation/ot/2_kings/016/010.yaml
  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: ml
  text: അസ്സീറിയാരാജാവായ തിഗ്ലത്ത്-പിലേസെരിനെ കണ്ടുമുട്ടാൻ ആഹാസ് രാജാവ് ദമസ്കൊസിലേക്കു പോയി. അവിടെയുണ്ടായിരുന്ന യാഗപീഠം അദ്ദേഹം കണ്ടു. ആഹാസ് രാജാവ് യാഗപീഠത്തിന്റെ മാതൃകയും അതിന്റെ സകല നിർമാണവിശദാംശങ്ങൾക്കും അനുസരിച്ചുള്ള രൂപരേഖയും പുരോഹിതനായ ഊരീയാവിന് അയച്ചുകൊടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרַאת
  choice: കാണാൻ
  rationale: ഇവിടെ രാജാവ് മറ്റൊരു രാജാവിനെ അഭിമുഖീകരിക്കാനോ സ്വീകരിക്കാനോ പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: דְּמוּת הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ മാതൃക
  rationale: דמות ഇവിടെ പകർത്തി നിർമിക്കാൻ അയച്ച പ്രതിരൂപം/മാതൃക എന്ന അർഥത്തിലാണ്.
- source_word: תַּבְנִיתוֹ
  choice: അതിന്റെ ... രൂപരേഖ
  rationale: വസ്തുവിന്റെ ഘടനാപരമായ രൂപമോ നിർമാണക്രമമോ സൂചിപ്പിക്കുന്ന പദം; 'മാതൃക'യോടുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: לְכָל מַעֲשֵׂהוּ
  choice: അതിന്റെ സകല പണിപ്പാടുകൾക്കും അനുസരിച്ചുള്ള
  rationale: യാഗപീഠത്തിന്റെ നിർമാണവിശദാംശങ്ങളും കരകൗശലവും മുഴുവനായി ഉൾപ്പെടുന്നു എന്ന ആശയം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ സംഭവക്രമം സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ നിലനിർത്തിയിരിക്കുന്നു; വ്യാഖ്യാനപരമായ വിലയിരുത്തൽ ചേർത്തിട്ടില്ല.
