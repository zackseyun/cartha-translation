  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
translation:
  language: ml
  text: ആഹാസ് യഹ്‌വേയുടെ ആലയത്തിലും രാജകൊട്ടാരത്തിലെ ഭണ്ഡാരങ്ങളിലും ഉണ്ടായിരുന്ന വെള്ളിയും പൊന്നും എടുത്ത് അശ്ശൂർരാജാവിന് കൈക്കൂലിയായി അയച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കപ്പമായി” അല്ലെങ്കിൽ “സമ്മാനമായി”; ഹീബ്രുപദത്തിന് സാധാരണയായി “കൈക്കൂലി” എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘എടുത്തു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: വെള്ളിയും പൊന്നും
  rationale: വിലയേറിയ ലോഹങ്ങളെ സൂചിപ്പിക്കുന്ന മൂലപദങ്ങളുടെ മൂർത്തമായ ഭാഷ നിലനിർത്തുന്നു.
- source_word: הַנִּמְצָא
  choice: ഉണ്ടായിരുന്ന
  rationale: מצא എന്ന നിഷ്ക്രിയ കൃദന്തം ഇവിടെ ആ സ്ഥലങ്ങളിൽ ലഭ്യമായിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഉണ്ടായിരുന്ന’ സ്വാഭാവികമാണ്.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: ‘യഹ്‌വേയുടെ ഭവനം’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ഈ സന്ദർഭത്തിൽ ‘ആലയം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്; ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: രാജകൊട്ടാരത്തിലെ ഭണ്ഡാരങ്ങളിലും
  rationale: അക്ഷരാർഥത്തിൽ ‘രാജാവിന്റെ ഭവനത്തിലെ ഭണ്ഡാരങ്ങൾ’; ഉദ്ദേശിക്കുന്ന രാജകീയ കൊട്ടാരവും അതിലെ ധനശേഖരങ്ങളും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּשְׁלַח לְמֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവിന് … അയച്ചു
  rationale: ഹീബ്രു വാക്യക്രമത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ നൽകുന്നു.
- source_word: שֹׁחַד
  choice: കൈക്കൂലിയായി
  rationale: ഈ പദത്തിന്റെ സാധാരണ നിഷേധാത്മക അർഥം നിലനിർത്തുന്നു; ‘കപ്പം’ അല്ലെങ്കിൽ ‘സമ്മാനം’ എന്ന വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: שֹׁחַד എന്ന പണമിടപാടിന്റെ സ്വഭാവം
  choice: കൈക്കൂലി
  alternative: കപ്പം / സമ്മാനം
  rationale: പദത്തിന്റെ സാധാരണ നിഷേധാത്മക ധ്വനി മറച്ചുവയ്ക്കാതെ സൂക്ഷിക്കുന്നു; രാഷ്ട്രീയ കപ്പം എന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിലൂടെ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ആലയം’, ‘രാജകൊട്ടാരം’, ‘ഭണ്ഡാരം’ എന്നീ പദങ്ങൾ ചരിത്രസന്ദർഭം വ്യക്തമായി നൽകുന്നു.
