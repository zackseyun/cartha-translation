source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהוֹאָ֜שׁ אֲשֶׁ֤ר עָשָׂה֙ וּ/גְב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: The rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: യെഹോവാശിന്റെ ശേഷിച്ച പ്രവൃത്തികളും, അവൻ ചെയ്തതൊക്കെയും, അവന്റെ പരാക്രമവും, യെഹൂദാരാജാവായ അമസ്യാവുമായി അവൻ യുദ്ധം ചെയ്തതും[a] ഇസ്രായേൽ രാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[b] എഴുതപ്പെട്ടിരിക്കുന്നില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദാരാജാവായ അമസ്യാവിനെതിരെ യുദ്ധം ചെയ്തതും.’ എബ്രായ മുൻനിലപദത്തിന്റെ അക്ഷരാർഥം ‘കൂടെ/മായി’ എന്നാണ്; എന്നാൽ യുദ്ധസന്ദർഭത്തിൽ അത് ശത്രുതാപരമായ എതിർപ്പിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇസ്രായേൽ രാജാക്കന്മാരുടെ രാജവൃത്താന്തങ്ങളുടെ പുസ്തകത്തിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָשׁ
  choice: യേഹോവാശിന്റെ ശേഷിച്ച പ്രവൃത്തികളും
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ דִּבְרֵי എന്നത് വെറും വാക്കുകളെയല്ല, രാജാവിന്റെ പ്രവൃത്തികളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു. ‘ശേഷിച്ച പ്രവൃത്തികൾ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: മൂലപാഠത്തിലെ ബന്ധവാക്യം ഒഴിവാക്കാതെ, മുൻപുള്ള ‘പ്രവൃത്തികൾ’ എന്ന പ്രയോഗത്തോടുള്ള ഉദ്ദേശ്യപൂർവമായ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: וּגְבוּרָתוֹ
  choice: അവന്റെ പരാക്രമവും
  rationale: גְּבוּרָה ഇവിടെ രാജാവിന്റെ ശക്തി, വീര്യം, സൈനിക മികവ് എന്നിവ ഉൾക്കൊള്ളുന്നു; ‘പരാക്രമം’ ഈ അർത്ഥവ്യാപ്തി മാന്യവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: וַאֲשֶׁר נִלְחַם עִם
  choice: യുദ്ധം ചെയ്തതും
  rationale: נלחם എന്ന ക്രിയയുടെ യുദ്ധസംബന്ധമായ അർത്ഥം നേരിട്ട് നൽകുന്നു; עִם എന്ന ‘കൂടെ/മായി’ എന്ന ബന്ധം അടുത്ത പദത്തിലെ ‘അമസ്യാവുമായി’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֲמַצְיָהוּ מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ അമസ്യാവുമായി
  rationale: രാജപദവി സ്വാഭാവികമായ മലയാള വിശേഷണഘടനയിൽ നൽകി, עִם എന്ന മുൻനിലപദത്തെ ‘-വുമായി’ എന്ന രൂപത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടുണ്ടല്ലോ?
  rationale: മൂലപാഠത്തിലെ പ്രതീക്ഷിത അനുകൂല ഉത്തരമുള്ള അലങ്കാരചോദ്യം മലയാളത്തിലെ ‘ഉണ്ടല്ലോ?’ എന്ന സ്വാഭാവിക ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ
  rationale: രാജാക്കന്മാരുടെ ഔദ്യോഗിക കാലാനുക്രമ രേഖയെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി. മൂലപാഠത്തിലെ പട്ടികാസ്വഭാവവും അലങ്കാരചോദ്യവും സംരക്ഷിച്ചു; അനാവശ്യമായ ആരംഭകാലസൂചകം ചേർത്തിട്ടില്ല.
