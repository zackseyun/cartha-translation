  yaml_path: translation/ot/2_kings/014/021.yaml
  text: Then all the people of Judah took Azariah—he was sixteen years old—and made him king in place of his father Amaziah[a].
translation:
  language: ml
  text: അപ്പോൾ യെഹൂദയിലെ ജനമെല്ലാം പതിനാറു വയസ്സുള്ള അസര്യാവിനെ എടുത്ത്, അവന്റെ പിതാവായ അമസ്യാവിനു പകരം അവനെ രാജാവാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അസര്യാവ് മറ്റിടങ്ങളിൽ ഉസ്സീയാവ് എന്നും വിളിക്കപ്പെടുന്നു; ഇവിടെ എബ്രായപാഠത്തിൽ അസര്യാവ് എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: തിരഞ്ഞെടുത്ത്
  rationale: לקח എന്നതിന് അക്ഷരാർഥത്തിൽ ‘എടുക്കുക’ എന്നാണ്; എന്നാൽ രാജസ്ഥാനാരോഹണസന്ദർഭത്തിൽ മലയാളത്തിലെ ‘എടുത്ത്’ അസ്വാഭാവികവും അവ്യക്തവുമാകാം. ജനങ്ങൾ അസര്യാവിനെ രാജാവാകാൻ മുന്നോട്ടുകൊണ്ടുവന്ന രാഷ്ട്രീയപ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കാൻ ‘തിരഞ്ഞെടുത്ത്’ ഉപയോഗിച്ചു.
- source_word: כָּל עַם יְהוּדָה
  choice: യെഹൂദയിലെ ജനമെല്ലാം
  rationale: ‘യെഹൂദയിലെ സകലജനവും’ എന്ന ആശയം വ്യക്തമായി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: עֲזַרְיָה
  choice: അസര്യാവ്
  rationale: ഈ വാക്യത്തിലെ എബ്രായരൂപമായ അസര്യാവിനെ പിന്തുടരുന്നു; മറ്റിടങ്ങളിലെ ഉസ്സീയാവ് എന്ന പേര് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: പതിനാറു വയസ്സുകാരനായ
  rationale: പ്രായസൂചനയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; അസര്യാവിന്റെ പ്രായം പതിനാറായിരുന്നു എന്ന അർഥം പൂർണമായി നിലനിൽക്കുന്നു.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: രാജാവാക്കി
  rationale: מלך എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘രാജാവായി വാഴിച്ചു/രാജാവാക്കി’ എന്നാണ്. പറയാത്ത കിരീടധാരണച്ചടങ്ങോ വെറും പ്രഖ്യാപനമോ ചേർക്കാതെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: תַּחַת אָבִיו
  choice: അവന്റെ അപ്പനായ ... പകരം
  rationale: തחת ഇവിടെ രാജകീയ പിൻഗാമിത്വത്തിൽ ‘പകരം’ എന്നാണ്; വെറും കാലക്രമം സൂചിപ്പിക്കുന്ന ‘ശേഷം’ എന്നതിനെക്കാൾ സ്ഥാനമേറ്റെടുക്കൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲמַצְיָהוּ
  choice: അമസ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തോട് ചേർന്ന ലിപ്യന്തരണം.
