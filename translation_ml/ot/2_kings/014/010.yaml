source:
  edition: WLC
  text: הַכֵּ֤ה הִכִּ֨יתָ֙ אֶת אֱד֔וֹם וּֽ/נְשָׂאֲ/ךָ֖ לִבֶּ֑/ךָ הִכָּבֵד֙ וְ/שֵׁ֣ב בְּ/בֵיתֶ֔/ךָ וְ/לָ֤/מָּה תִתְגָּרֶה֙ בְּ/רָעָ֔ה וְ/נָ֣פַלְתָּ֔ה אַתָּ֖ה וִ/יהוּדָ֥ה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
translation:
  language: ml
  text: നീ ഏദോമിനെ നിശ്ചയമായും പരാജയപ്പെടുത്തി; നിന്റെ ഹൃദയം നിന്നെ ഉയർത്തിയിരിക്കുന്നു.[a] ആ ബഹുമതി അനുഭവിച്ചുകൊണ്ട് വീട്ടിൽത്തന്നെ കഴിയുക.[b] നീയും നിന്നോടൊപ്പം യെഹൂദയും വീണുപോകാൻ എന്തിനാണ് അനർത്ഥം വിളിച്ചുവരുത്തുന്നത്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘നിന്റെ ഹൃദയം നിന്നെ ഉയർത്തിയിരിക്കുന്നു.’ ഇത് അഹങ്കാരത്തെയോ സ്വയം ഉയർത്തലിനെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ബഹുമാനിതനായിരിക്കുക,’ ‘അതിൽ അഭിമാനിക്കുക.’ ജയത്തിൽനിന്നു ലഭിച്ച ബഹുമതി അനുഭവിക്കുക എന്നതാണ് സാധ്യതയുള്ള അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ
  choice: നിശ്ചയമായും പരാജയപ്പെടുത്തി
  rationale: ക്രിയാനാമത്തിന്റെ പരമരൂപവും സമാപികാക്രിയയും ചേർന്ന പ്രയോഗം ശക്തമായ ഊന്നൽ നൽകുന്നു. സൈനികസന്ദർഭത്തിൽ ‘പരാജയപ്പെടുത്തി’ സ്വാഭാവികമാണ്; ‘നിശ്ചയമായും’ ആ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  choice: നിന്റെ ഹൃദയം അഹങ്കാരത്താൽ ഉയർന്നിരിക്കുന്നു
  rationale: എബ്രായത്തിലെ ‘നിന്റെ ഹൃദയം നിന്നെ ഉയർത്തി’ എന്ന ദൃശ്യഭാഷ അഹങ്കാരത്തെയും സ്വയം ഉയർത്തലിനെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അർത്ഥം വ്യക്തമാക്കിയെങ്കിലും ‘ഹൃദയം’യും ‘ഉയരുക’ എന്ന ചിത്രവും നിലനിർത്തി.
- source_word: הִכָּבֵד
  choice: ആ ബഹുമതികൊണ്ട് തൃപ്തിപ്പെട്ട്
  rationale: നിഫാൽ ആജ്ഞാരൂപം ഇവിടെ നേടിയ ജയത്തിന്റെ ബഹുമതി അനുഭവിക്കുകയോ അതിൽ അഭിമാനിക്കുകയോ ചെയ്യുക എന്ന ആശയം നൽകുന്നു. ‘തൃപ്തിപ്പെട്ട്’ തുടർന്നുള്ള ‘വീട്ടിൽത്തന്നെ കഴിയുക’ എന്ന മുന്നറിയിപ്പുമായി സ്വാഭാവികമായി ബന്ധപ്പെടുന്നു; പദത്തിന്റെ ഭിന്നസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְשֵׁב בְּבֵיתֶךָ
  choice: വീട്ടിൽത്തന്നെ കഴിയുക
  rationale: കൂടുതൽ യുദ്ധത്തിന് ഇറങ്ങാതെ സ്വന്തം സ്ഥലത്ത് തുടരുക എന്ന പ്രയോഗാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תִתְגָּרֶה בְּרָעָה
  choice: അനർത്ഥം വിളിച്ചുവരുത്തുന്നു
  rationale: ഗ്രഹിത്പാഠത്തിലെ ആത്മനേപദീയ ക്രിയ സംഘർഷം ഇളക്കിവിടുന്നതിനെ സൂചിപ്പിക്കുന്നു; רָעָה ഇവിടെ ധാർമ്മിക തിന്മയേക്കാൾ ദുരന്തമോ വിനാശകരമായ ഫലമോ ആണ്. ‘വിളിച്ചുവരുത്തുക’ മുന്നറിയിപ്പിന്റെ ഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  choice: നീയും നിന്നോടൊപ്പം യെഹൂദയും വീണുപോകത്തക്കവിധം
  rationale: രാജാവിന്റെ വീഴ്ച ജനതയെയും കൂടെ വീഴ്ത്തുമെന്ന ഊന്നൽ നിലനിർത്തുകയും മുൻക്രിയയുടെ പ്രതീക്ഷിക്കപ്പെടുന്ന ഫലമായി വാക്യം ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
