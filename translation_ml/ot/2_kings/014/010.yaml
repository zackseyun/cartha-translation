  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. രാജാവിനോടുള്ള നേരിട്ടുള്ള പരിഹാസമിശ്രിത മുന്നറിയിപ്പിന്റെ ചുരുക്കവും ശക്തിയും നിലനിർത്തി; യഥാർഥ പദാർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
