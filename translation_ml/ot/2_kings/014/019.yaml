  text: וַ/יִּקְשְׁר֨וּ עָלָ֥י/ו קֶ֛שֶׁר בִּ/ירוּשָׁלִַ֖ם וַ/יָּ֣נָס לָכִ֑ישָׁ/ה וַ/יִּשְׁלְח֤וּ אַֽחֲרָי/ו֙ לָכִ֔ישָׁ/ה וַ/יְמִתֻ֖/הוּ שָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/019.yaml
  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
translation:
  language: ml
  text: അവർ യെരൂശലേമിൽ വെച്ച് അവനെതിരെ ഗൂഢാലോചന നടത്തി; അവൻ ലാഖീശിലേക്കു ഓടിപ്പോയി. അവർ അവന്റെ പിന്നാലെ ലാഖീശിലേക്കു അയച്ചു[a]; അവിടെ വെച്ച് അവനെ വധിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അവന്റെ പിന്നാലെ അയച്ചു.” ആരെയോ എന്തിനെയോ അയച്ചു എന്ന് എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല. “അവനെ പിന്തുടരാൻ ആളുകളെ അയച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: അവനെതിരെ ഗൂഢാലോചന നടത്തി
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന ഈ എബ്രായ പ്രയോഗം രാഷ്ട്രീയമായ ഗൂഢാലോചനയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും അതേ അർഥം നൽകുന്നു.
- source_word: בִּירוּשָׁלִַם
  choice: യെരൂശലേമിൽവെച്ച്
  rationale: സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുന്നു; ‘വെച്ച്’ സംഭവത്തിന്റെ സ്ഥലത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיָּנָס
  choice: ഓടിപ്പോയി
  rationale: נוּס എന്ന ക്രിയയുടെ ‘പലായനം ചെയ്യുക/ഓടിപ്പോകുക’ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָכִישָׁה
  choice: ലാഖീശിലേക്ക്
  rationale: ദിശാസൂചകമായ ഹേ പ്രത്യയം നഗരത്തിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  choice: അവന്റെ പിന്നാലെ … ആളയച്ചു[a]
  rationale: എബ്രായത്തിന്റെ അക്ഷരാർഥം ‘അവന്റെ പിന്നാലെ അയച്ചു’ എന്നാണ്; അയച്ചവരെ പാഠം വ്യക്തമാക്കുന്നില്ല. മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കാൻ ‘ആളയച്ചു’ ഉപയോഗിക്കുകയും ആ പൂരിപ്പിക്കൽ അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്തു.
- source_word: וַיְמִתֻהוּ
  choice: അവനെ വധിച്ചു
  rationale: מות എന്ന ധാതുവിന്റെ കാരണാർത്ഥക രൂപം ഉദ്ദേശപൂർവം മരണപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വധിച്ചു’ അതിന്റെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളരൂപമാണ്.
- source_word: שָׁם
  choice: അവിടെവെച്ച്
  rationale: ലാഖീശിനെ തിരിച്ചുസൂചിപ്പിക്കുന്ന സ്ഥലക്രിയാവിശേഷണം സ്വാഭാവികമായി നൽകുന്നു.
