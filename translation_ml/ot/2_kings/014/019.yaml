translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ സംയോജകപ്രവാഹം അർധവിരാമവും പുതിയ വാക്യവും ഉപയോഗിച്ച് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു; മൂലപാഠത്തിൽ ഇല്ലാത്ത വിരുദ്ധബന്ധം ചേർത്തിട്ടില്ല.
