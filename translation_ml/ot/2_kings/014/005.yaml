revisions:
- from: രാജ്യം അവന്റെ കൈയിൽ ഉറച്ചപ്പോൾ[a], തന്റെ പിതാവായ രാജാവിനെ കൊന്നുകളഞ്ഞ ഭൃത്യന്മാരെ അവൻ കൊന്നുകളഞ്ഞു.[b]
  to: അങ്ങനെ, രാജത്വം അവന്റെ കൈയിൽ ഉറച്ചുകഴിഞ്ഞപ്പോൾ[a], തന്റെ പിതാവായ രാജാവിനെ കൊന്ന തന്റെ സേവകരെ അവൻ കൊന്നു.[b]
  rationale: The revision improves idiomatic modern Malayalam, clarifies that the kingdom-language concerns secured royal authority, lightly represents the Hebrew narrative transition, and preserves the repeated source verb in both clauses. It does not alter the passage’s meaning or introduce interpretive detail.
