translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി. മൂലത്തിലെ ‘കൈയിൽ’ എന്ന അധികാരരൂപകവും ആവർത്തിച്ച ക്രിയയുടെ സാഹിത്യബന്ധവും നിലനിർത്തി.
