source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר חָזְקָ֥ה הַ/מַּמְלָכָ֖ה בְּ/יָד֑/וֹ וַ/יַּךְ֙ אֶת עֲבָדָ֔י/ו הַ/מַּכִּ֖ים אֶת הַ/מֶּ֥לֶךְ אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/005.yaml
  text: And it happened[a], as soon as the kingdom was firmly in his hand[b], that he struck down his servants who had struck down the king his father.
translation:
  language: ml
  text: അങ്ങനെ, രാജത്വം അവന്റെ കൈയിൽ ഉറച്ചുകഴിഞ്ഞപ്പോൾ[a], തന്റെ പിതാവായ രാജാവിനെ കൊന്ന തന്റെ സേവകരെ അവൻ കൊന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജാധികാരം അവന്റെ നിയന്ത്രണത്തിൽ ഉറപ്പിക്കപ്പെട്ടപ്പോൾ.” “അവന്റെ കൈയിൽ” എന്ന എബ്രായ പ്രയോഗം അവന്റെ ഭരണം സുരക്ഷിതമായി ഉറച്ചതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അമസ്യാവിന്റെ പ്രവൃത്തിക്കും സേവകരുടെ പ്രവൃത്തിക്കും എബ്രായത്തിൽ ഒരേ ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്: തന്റെ പിതാവിനെ “കൊന്നവരെ” അവൻ “കൊന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ഉറച്ചപ്പോൾ
  rationale: וַיְהִי എന്നത് എബ്രായ ആഖ്യാനത്തിന്റെ സംഭവക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ വേറെ പദമായി പരിഭാഷപ്പെടുത്താതെ കാലവാക്യത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി. כַּאֲשֶׁר ഇവിടെ പ്രവർത്തി നടന്ന സമയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: חָזְקָה הַמַּמְלָכָה בְּיָדוֹ
  choice: രാജ്യം അവന്റെ കൈയിൽ ഉറച്ചപ്പോൾ
  rationale: രാജാധികാരം സുരക്ഷിതമായി സ്ഥാപിതമായെന്ന ആശയം നൽകുന്നതിനൊപ്പം ‘അവന്റെ കൈയിൽ’ എന്ന എബ്രായ രൂപകവും നിലനിർത്തുന്നു.
- source_word: וַיַּךְ ... הַמַּכִּים
  choice: കൊന്നുകളഞ്ഞു ... കൊന്നുകളഞ്ഞ
  rationale: נכה എന്ന ഒരേ ധാതുവാണ് അമസ്യാവിന്റെ പ്രവൃത്തിക്കും ഭൃത്യന്മാരുടെ മുൻപ്രവൃത്തിക്കും ഉപയോഗിച്ചിരിക്കുന്നത്. ഈ സന്ദർഭത്തിൽ രണ്ടിടത്തും മരണമാണ് ഫലം; ഒരേ മലയാളപ്രയോഗം ആവർത്തിച്ച് മൂലത്തിലെ ബന്ധം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: עֲבָדָיו
  choice: ഭൃത്യന്മാരെ
  rationale: രാജസേവനത്തിലുള്ളവരെ സൂചിപ്പിക്കുന്ന עבד എന്ന പദത്തിന് സന്ദർഭോചിതവും ഗൗരവമുള്ളതുമായ മലയാളസമാനപദം.
- source_word: אֶת הַמֶּלֶךְ אָבִיו
  choice: തന്റെ പിതാവായ രാജാവിനെ
  rationale: എബ്രായത്തിലെ സമാനാധികരണബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
