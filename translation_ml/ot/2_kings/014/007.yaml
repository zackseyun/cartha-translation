  yaml_path: translation/ot/2_kings/014/007.yaml
  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
translation:
  language: ml
  text: അവൻ ഉപ്പുതാഴ്‌വരയിൽ എദോമ്യരായ പതിനായിരം പേരെ സംഹരിച്ചു; യുദ്ധത്തിൽ സേലാ[a] പിടിച്ചടക്കി, അതിന് യൊക്തെയേൽ എന്നു പേരിട്ടു. ഇന്നുവരെയും അതിന്റെ പേര് യൊക്തെയേൽ തന്നെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സേലാ” എന്നത് ഇവിടെ സ്ഥലനാമമായിരിക്കാനാണ് സാധ്യത; ഈ പദത്തിന് “പാറ” അല്ലെങ്കിൽ “ചെങ്കുത്തായ പാറ” എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: വധിച്ചു
  rationale: נכה എന്ന ക്രിയയ്ക്ക് യുദ്ധസന്ദർഭത്തിൽ മാരകമായി അടിച്ചുവീഴ്ത്തുക എന്ന അർഥമുണ്ട്. എണ്ണിപ്പറയുന്ന എദോമ്യർ ക്രിയയുടെ കർമമായതിനാൽ മലയാളത്തിൽ ‘വധിച്ചു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֱדוֹם
  choice: എദോമ്യരിൽ
  rationale: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘എദോം’ എന്നാണ്; എന്നാൽ പതിനായിരം എന്ന മനുഷ്യരുടെ എണ്ണത്തോടുകൂടി വരുന്നതിനാൽ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ‘എദോമ്യരിൽ’ എന്നു വ്യക്തമാക്കി.
- source_word: בְּגֵיא הַמֶּלַח
  choice: ഉപ്പുതാഴ്‌വരയിൽവെച്ച്
  rationale: ഭൂമിശാസ്ത്രനാമത്തിന്റെ ഘടനയും യുദ്ധം നടന്ന സ്ഥലമെന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: പതിനായിരം പേരെ
  rationale: സംഖ്യ കൃത്യമായി നിലനിർത്തി; മനുഷ്യരെ എണ്ണുന്നതിന് മലയാളത്തിൽ ‘പേർ’ ചേർത്തു.
- source_word: וְתָפַשׂ
  choice: പിടിച്ചടക്കി
  rationale: യുദ്ധത്തിൽ ഒരു സ്ഥലത്തെ കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന സൈനികസന്ദർഭത്തിന് യോജിച്ച പ്രയോഗം.
- source_word: הַסֶּלַע
  choice: സേലാ
  rationale: ഇവിടെ അറിയപ്പെടുന്ന സ്ഥലനാമമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത; ‘പാറ/ചെങ്കുത്തായ പാറ’ എന്ന പദാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: בַּמִּלְחָמָה
  choice: യുദ്ധത്തിൽ
  rationale: പിടിച്ചടക്കൽ നടന്ന സാഹചര്യത്തെ നേരിട്ടും സംക്ഷിപ്തമായും വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְרָא אֶת שְׁמָהּ
  choice: അതിന് … എന്നു പേരിട്ടു
  rationale: ഹീബ്രു നാമകരണസൂത്രത്തിന്റെ അർഥം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יָקְתְאֵל
  choice: യൊക്തെയേൽ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും അതാണ് അതിന്റെ പേര്
  rationale: ആ പേര് എഴുത്തുകാരന്റെ കാലംവരെ നിലനിന്നു എന്ന ഹീബ്രു കാലസൂത്രത്തിന്റെ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
