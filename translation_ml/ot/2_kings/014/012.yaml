  text: וַ/יִּנָּ֥גֶף יְהוּדָ֖ה לִ/פְנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּנֻ֖סוּ אִ֥ישׁ ל/אהל/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/012.yaml
  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: ml
  text: യിസ്രായേലിനുമുമ്പിൽ യെഹൂദാ തോറ്റു; ഓരോരുത്തനും അവനവന്റെ കൂടാരത്തിലേക്ക് ഓടിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഓരോരുത്തനും അവനവന്റെ വീട്ടിലേക്ക് ഓടിപ്പോയി.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഓരോരുത്തനും അവനവന്റെ കൂടാരത്തിലേക്ക്” എന്നാണ്; സ്വന്തം വാസസ്ഥലത്തേക്ക് പിരിഞ്ഞുപോകുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവുശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: തോറ്റു
  rationale: നָגַף എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ യുദ്ധത്തിൽ പരാജയപ്പെടുക എന്ന അർഥത്തിലാണ്; സ്വാഭാവികവും വ്യക്തവുമായ മലയാളമായി ‘തോറ്റു’ എന്നു നൽകി.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: തെക്കൻ രാജ്യത്തിന്റെ പേരിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപം.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ മുമ്പിൽ
  rationale: യുദ്ധസന്ദർഭത്തിലെ ‘എതിരാളിയുടെ മുമ്പിൽ പരാജയപ്പെടുക’ എന്ന എബ്രായ നിർമാണം നിലനിർത്തുന്നു; യിസ്രായേൽ ഇവിടെ വടക്കൻ രാജ്യമാണ്.
- source_word: וַיָּנֻסוּ
  choice: ഓടിപ്പോയി
  rationale: נוּס എന്നത് ഭീഷണിയിൽനിന്നോ യുദ്ധഭൂമിയിൽനിന്നോ പലായനം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: വിതരണാർഥമുള്ള ഏകവചനത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു; ഓരോ സൈനികനും പ്രത്യേകം പിരിഞ്ഞോടിയെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: לְאָהֳלוֹ
  choice: അവനവന്റെ കൂടാരത്തിലേക്ക്
  rationale: അക്ഷരാർഥമായ ‘തന്റെ കൂടാരത്തിലേക്ക്’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് വാസസ്ഥലത്തേക്കു മടങ്ങുക എന്ന പ്രയോഗാർഥവും വഹിക്കാം.
