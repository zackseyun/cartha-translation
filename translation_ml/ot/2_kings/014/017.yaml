  source_fidelity: 'ഹീബ്രു വാക്യത്തിലെ കാലക്രമവിവരം കൃത്യമായി പ്രതിഫലിക്കുന്നു: യൂദാരാജാവായ യോവാശിന്റെ മകൻ അമസ്യാവ്, ഇസ്രായേൽരാജാവായ യെഹോവാഹാസിന്റെ മകൻ യെഹോവാശിന്റെ മരണശേഷം പതിനഞ്ചു വർഷം ജീവിച്ചു. രണ്ടു വ്യത്യസ്ത ഹീബ്രു നാമരൂപങ്ങളും മലയാളത്തിൽ വേർതിരിച്ചു നിലനിർത്തിയിട്ടുണ്ട്.'
