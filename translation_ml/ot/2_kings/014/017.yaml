  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ രാജവംശചരിത്രരേഖയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ഹീബ്രുവിൽ വ്യത്യസ്തമായി എഴുതിയിരിക്കുന്ന יוֹאָשׁ, יְהוֹאָשׁ എന്നീ പേരുകൾ യഥാക്രമം ‘യോവാശ്’, ‘യെഹോവാശ്’ എന്ന് വേർതിരിച്ചതിനാൽ അധിക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
