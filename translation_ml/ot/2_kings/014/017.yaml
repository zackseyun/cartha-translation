id: 2KI.14.17
reference: 2 Kings 14:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְחִ֨י אֲמַצְיָ֤הוּ בֶן יוֹאָשׁ֙ מֶ֣לֶךְ יְהוּדָ֔ה אַֽחֲרֵ֣י מ֔וֹת יְהוֹאָ֥שׁ בֶּן יְהֽוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/017.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
translation:
  language: ml
  text: യൂദാരാജാവായ യോവാശിന്റെ മകൻ അമസ്യാവ്, ഇസ്രായേൽരാജാവായ യെഹോവാഹാസിന്റെ മകൻ യെഹോവാശ് മരിച്ചശേഷം പതിനഞ്ചു വർഷം ജീവിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: മറ്റൊരു രാജാവിന്റെ മരണശേഷമുള്ള നിശ്ചിത കാലയളവ് ജീവിച്ചിരുന്നതായി രേഖപ്പെടുത്തുന്ന സാധാരണ കാലക്രമപ്രയോഗം; ‘അതിജീവിച്ചു’ എന്നത് സാധ്യമെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: אֲמַצְיָהוּ
  choice: അമസ്യാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തോട് ചേർന്ന രൂപം.
- source_word: בֶן יוֹאָשׁ
  choice: യോവാശിന്റെ മകൻ
  rationale: രാജകീയ തിരിച്ചറിയലിലെ നേരിട്ടുള്ള പിതൃപുത്രബന്ധം വ്യക്തമാക്കുന്നു; ഈ സ്ഥലത്തെ ചുരുക്കിയ ഹീബ്രു നാമരൂപം ‘യോവാശ്’ എന്നു നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യൂദാരാജാവ്
  rationale: രാജപദവിയും രാജ്യവും സ്വാഭാവികമായ മലയാള സംയുക്തപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: אַחֲרֵי מוֹת
  choice: മരിച്ചശേഷം
  rationale: ഹീബ്രുവിലെ ‘മരണത്തിനു ശേഷം’ എന്ന നാമപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוֹאָשׁ
  choice: യെഹോവാശ്
  rationale: ഈ വാക്യത്തിലെ ദീർഘമായ ഹീബ്രു നാമരൂപം പ്രതിഫലിപ്പിക്കുകയും യൂദാരാജാവായ അമസ്യാവിന്റെ പിതാവായ യോവാശിൽനിന്ന് ഇസ്രായേൽരാജാവിനെ വേർതിരിച്ചറിയാൻ സഹായിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוֹאָחָז
  choice: യെഹോവാഹാസ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: രാജപദവിയും രാജ്യവും സ്വാഭാവികമായ മലയാള സംയുക്തപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: പതിനഞ്ചു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന സംഖ്യയും ‘വർഷം’ എന്ന പദവും നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
