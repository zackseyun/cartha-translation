reference: 2 Kings 14:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת בְּנֵ֥י הַ/מַּכִּ֖ים לֹ֣א הֵמִ֑ית כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יוּמְת֨וּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יוּמְת֣וּ עַל אָב֔וֹת כִּ֛י אִם אִ֥ישׁ בְּ/חֶטְא֖/וֹ ימות־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
translation:
  language: ml
  text: 'എന്നാൽ, കൊലയാളികളുടെ പുത്രന്മാരെ അവൻ വധിച്ചില്ല[a]; യഹോവ കൽപിച്ചതുപോലെ മോശെയുടെ ന്യായപ്രമാണപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്നതനുസരിച്ച്: “പുത്രന്മാർ നിമിത്തം പിതാക്കന്മാരെയോ പിതാക്കന്മാർ നിമിത്തം പുത്രന്മാരെയോ വധിക്കരുത്; മറിച്ച്, ഓരോരുത്തനും സ്വന്തം പാപം നിമിത്തം മരിക്കണം.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൊന്നവരുടെ മക്കളെ.” എബ്രായത്തിൽ അക്ഷരാർഥം “കൊന്നവരുടെ പുത്രന്മാർ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഈ ഉദ്ധരണി ആവർത്തനം 24:16-ൽ നിന്നുള്ളതാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  choice: കൊലയാളികളുടെ പുത്രന്മാർ
  rationale: בְּנֵי എന്നതിന്റെ പുരുഷലിംഗസൂചനയും הַמַּכִּים എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ ‘കൊന്നവർ’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: לֹא הֵמִית
  choice: വധിച്ചില്ല
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘മരിപ്പിക്കുക/വധിക്കുക’ എന്ന ന്യായവിധിപരമായ അർഥം നൽകുന്നു.
- source_word: כַּכָּתוּב
  choice: എഴുതിയിരിക്കുന്നു
  rationale: എഴുതപ്പെട്ട നിയമത്തോടുള്ള അനുസരണം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: മോശെയുടെ ന്യായപ്രമാണപുസ്തകത്തിൽ
  rationale: סֵפֶר, תּוֹרָה എന്നീ ഘടകങ്ങളെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്ന പരിചിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לֹא יוּמְתוּ
  choice: വധിക്കരുത്
  rationale: നിയമപരമായ നിരോധനം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ഇത് വെറും സ്വാഭാവികമരണത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയല്ല.
- source_word: אָבוֹת ... בָּנִים
  choice: പിതാക്കന്മാർ ... പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചനങ്ങളെ പൊതുവൽക്കരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: עַל
  choice: നിമിത്തം
  rationale: മറ്റൊരാളുടെ കുറ്റം ശിക്ഷയുടെ അടിസ്ഥാനമാകുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക നിയമപരമായ പ്രയോഗം.
- source_word: כִּי אִם
  choice: മറിച്ച്
  rationale: മുൻപത്തെ നിരോധനത്തിനു വിരുദ്ധമായി വ്യക്തിപരമായ ഉത്തരവാദിത്വത്തിന്റെ തത്ത്വം അവതരിപ്പിക്കുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തൻ
  rationale: വിതരണാത്മകമായ ഏകവചന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിലെ പുരുഷവാചക രൂപവും നിലനിൽക്കുന്നു.
- source_word: בְּחֶטְאוֹ
  choice: സ്വന്തം പാപം നിമിത്തം
  rationale: ഉടമസ്ഥപ്രത്യയം സൂചിപ്പിക്കുന്ന ‘സ്വന്തം’ എന്ന പദവും ശിക്ഷയുടെ അടിസ്ഥാനമെന്ന ആശയവും വ്യക്തമാക്കുന്നു.
- source_word: יָמוּת
  choice: മരിക്കണം
  rationale: മുൻവാക്യങ്ങളിലെ കാരക/നിഷ്ക്രിയ രൂപത്തിൽനിന്ന് വ്യത്യസ്തമായ കാൽ രൂപമായ ‘മരിക്കുക’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടിനിയമത്തിലെ വ്യക്തിപരവും കുടുംബപരവുമായ ശിക്ഷാബാധ്യത
  choice: പിതാവിന്റെ കുറ്റത്തിന് പുത്രനെയോ പുത്രന്റെ കുറ്റത്തിന് പിതാവിനെയോ നിയമപരമായി വധിക്കരുത്; ഓരോരുത്തനും സ്വന്തം പാപത്തിനാണ് ഉത്തരവാദി.
  alternative: പാപത്തിന്റെ എല്ലാ സാമൂഹികമോ കുടുംബപരമോ ആയ പരിണതഫലങ്ങളെയും ഈ വാക്യം നിഷേധിക്കുന്നു എന്ന വിശാലവായന.
  rationale: വാക്യത്തിന്റെ ഭാഷ നിയമപരമായ വധശിക്ഷയെയും വ്യക്തിപരമായ കുറ്റബാധ്യതയെയും സംബന്ധിക്കുന്നു. പാപത്തിന് സമൂഹത്തിൽ പരിണതഫലങ്ങളുണ്ടാകാമെന്ന മറ്റു തിരുവെഴുത്തുസാക്ഷ്യങ്ങളെ ഇത് സ്വതവേ നിഷേധിക്കുന്നതായി പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള നിയമ-ആഖ്യാന ശൈലി. ഉദ്ധരണിയിലെ സമാന്തരഘടനയും ‘വധിക്കുക’/‘മരിക്കുക’ എന്ന ക്രിയാരൂപവ്യത്യാസവും സംരക്ഷിച്ചിരിക്കുന്നു.
