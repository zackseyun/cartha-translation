revisions:
- from: 'എന്നാൽ കൊലയാളികളുടെ പുത്രന്മാരെ അവൻ വധിച്ചില്ല[a]. യഹോവ കല്പിച്ചപ്രകാരം മോശെയുടെ ന്യായപ്രമാണപുസ്തകത്തിൽ ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: “പുത്രന്മാർ നിമിത്തം പിതാക്കന്മാരെയോ പിതാക്കന്മാർ നിമിത്തം പുത്രന്മാരെയോ വധിക്കരുത്; മറിച്ച്, ഓരോരുത്തനും സ്വന്തം പാപം നിമിത്തം മരിക്കണം.”[b]'
  to: 'എന്നാൽ, കൊലയാളികളുടെ പുത്രന്മാരെ അവൻ വധിച്ചില്ല[a]; യഹോവ കൽപിച്ചതുപോലെ മോശെയുടെ ന്യായപ്രമാണപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്നതനുസരിച്ച്: “പുത്രന്മാർ നിമിത്തം പിതാക്കന്മാരെയോ പിതാക്കന്മാർ നിമിത്തം പുത്രന്മാരെയോ വധിക്കരുത്; മറിച്ച്, ഓരോരുത്തനും സ്വന്തം പാപം നിമിത്തം മരിക്കണം.”[b]'
