source:
  edition: WLC
  text: וְ/לֹא דִבֶּ֣ר יְהוָ֔ה לִ/מְחוֹת֙ אֶת שֵׁ֣ם יִשְׂרָאֵ֔ל מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וַ/יּ֣וֹשִׁיעֵ֔/ם בְּ/יַ֖ד יָרָבְעָ֥ם בֶּן יוֹאָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/027.yaml
  text: But Yahweh had not said that he would blot out the name of Israel from under heaven[b][a], so he saved them by the hand of Jeroboam son of Joash.
translation:
  language: ml
  text: എന്നാൽ യഹ്‌വേ ആകാശത്തിൻ കീഴിൽനിന്ന് ഇസ്രായേലിന്റെ പേര് മായിച്ചുകളയുമെന്ന് പറഞ്ഞിരുന്നില്ല[a]. അതിനാൽ അവൻ യോവാശിന്റെ മകനായ യൊരോബെയാമിന്റെ കൈയാൽ[b] അവരെ രക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘തുടച്ചുനീക്കുമെന്ന്’ അല്ലെങ്കിൽ ‘ഇല്ലാതാക്കുമെന്ന്.’'
    reason: lexical_alternative
  - marker: b
    text: ‘കൈയാൽ’ എന്നത് ‘മുഖാന്തരം’ അല്ലെങ്കിൽ ‘വഴിയായി’ എന്നർഥമുള്ള ഹീബ്രു ശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ഹീബ്രു രൂപത്തോടടുത്ത് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: דִבֶּר
  choice: പറഞ്ഞിരുന്നില്ല
  rationale: דבר എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘പറയുക’ നിലനിർത്തുകയും തുടർന്നുള്ള രക്ഷാപ്രവർത്തനത്തിനു മുമ്പുള്ള ദൈവിക പ്രഖ്യാപനത്തെ ഭൂതപൂർവകാലരൂപത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לִמְחוֹת
  choice: മായിച്ചുകളയുമെന്ന്
  rationale: മുഴുവനായി നീക്കിക്കളയുക എന്ന מחהയുടെ അർഥവും ‘പേര്’ എന്ന കർമത്തോടുള്ള ഹീബ്രു പ്രയോഗത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പേര്
  rationale: ഇസ്രായേലിന്റെ നിലനിൽപ്പും സ്വത്വവും സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: ആകാശത്തിൻകീഴിൽനിന്ന്
  rationale: മനുഷ്യലോകത്തിൽനിന്നുള്ള സമ്പൂർണ നീക്കത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ സ്ഥലരൂപകം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וַיּוֹשִׁיעֵם
  choice: അവരെ രക്ഷിച്ചു
  rationale: ישע എന്ന ക്രിയയുടെ രക്ഷിക്കുക/വിടുവിക്കുക എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; രക്ഷയുടെ രീതി അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: בְּיַד
  choice: കൈയാൽ
  rationale: മനുഷ്യപ്രതിനിധിയിലൂടെയുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലി നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יָרָבְעָם בֶּן יוֹאָשׁ
  choice: യോവാശിന്റെ മകനായ യൊരോബെയാം
  rationale: വ്യക്തിനാമങ്ങളും പിതൃപരിചയവും മലയാള ബൈബിൾ ശൈലിക്ക് യോജിച്ച വ്യക്തമായ രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനെ നിലനിർത്താനുള്ള ദൈവിക ഉദ്ദേശ്യവും പ്രവർത്തനവും
  choice: ഇസ്രായേലിനെ ഇല്ലാതാക്കുമെന്ന് യഹ്‌വെ പറഞ്ഞിരുന്നില്ല; അതിനാൽ യൊരോബെയാമിലൂടെ അവരെ രക്ഷിച്ചു എന്ന ആഖ്യാനബന്ധം പ്രകടമാക്കുന്നു.
  alternative: രണ്ടു വാക്യഭാഗങ്ങളെയും കാരണം–ഫലബന്ധം വ്യക്തമാക്കാതെ ‘എന്നിട്ട്/കൂടാതെ’ എന്ന സമന്വയത്തോടെ നൽകാം.
  rationale: ഹീബ്രുവിലെ ആദ്യ പ്രസ്താവനയെ തുടർന്നാണ് രക്ഷാപ്രവർത്തനം വരുന്നത്; ‘അതിനാൽ’ ഈ ആഖ്യാനയുക്തി വ്യക്തമാക്കുന്നു. അതേസമയം യൊരോബെയാമിനെ നൈതികമായി വിലയിരുത്താതെ, അവൻ ദൈവത്തിന്റെ മനുഷ്യോപാധിയായിരുന്നുവെന്ന പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘ഇസ്രായേലിന്റെ പേര്’, ‘ആകാശത്തിൻകീഴിൽനിന്ന്’, ‘കൈയാൽ’ എന്നീ മൂലഭാഷാ രൂപകങ്ങൾ സ്വാഭാവികത നഷ്ടപ്പെടാതെ സംരക്ഷിച്ചു; ഓരോ അടിക്കുറിപ്പ് ചിഹ്നവും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനടുത്ത് വെച്ചു.
