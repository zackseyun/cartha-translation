- from: അവൻ യഹോവയുടെ[a] ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്തു; എങ്കിലും തന്റെ പിതാവായ ദാവീദിനെപ്പോലെയല്ല[b]. തന്റെ പിതാവായ യോവാശ്[c] ചെയ്തതെല്ലാംപോലെ അവനും ചെയ്തു.
  to: അവൻ യഹോവയുടെ[a] ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്തു; എങ്കിലും, തന്റെ പിതാവായ ദാവീദിനെപ്പോലെ ചെയ്തില്ല[b]. തന്റെ പിതാവായ യോവാശ്[c] ചെയ്തതെല്ലാംപോലെ അവൻ ചെയ്തു.
