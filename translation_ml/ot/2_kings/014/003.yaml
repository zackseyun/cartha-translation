id: 2KI.14.3
reference: 2 Kings 14:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הַ/יָּשָׁר֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֖א כְּ/דָוִ֣ד אָבִ֑י/ו כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה יוֹאָ֥שׁ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
translation:
  language: ml
  text: അവൻ യഹോവയുടെ[a] ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്തു; എങ്കിലും, തന്റെ പിതാവായ ദാവീദിനെപ്പോലെ ചെയ്തില്ല[b]. തന്റെ പിതാവായ യോവാശ്[c] ചെയ്തതെല്ലാംപോലെ അവൻ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹോവ’ എന്നത് എബ്രായ മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה (YHWH) എന്നതിന്റെ മലയാളരൂപമാണ്.
    reason: lexical_note
  - marker: b
    text: ഇവിടെ ദാവീദിനെ ‘പിതാവ്’ എന്നു വിളിക്കുന്നത് നേരിട്ടുള്ള ജനകൻ എന്ന അർഥത്തിലല്ല, രാജവംശത്തിലെ പൂർവികൻ എന്ന അർഥത്തിലാണ്. ‘എങ്കിലും’ എന്നതിന് അടിസ്ഥാനമായ എബ്രായ רַק എന്ന പദം ‘മാത്രം—തന്റെ പിതാവായ ദാവീദിനെപ്പോലെ ചെയ്തില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: cultural_and_lexical_note
  - marker: c
    text: ‘യോവാശ്’ എന്ന പേര് ചില പരിഭാഷകളിൽ ‘യെഹോവാശ്’ എന്നും കാണാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: അവൻ ... ശരിയായതു ചെയ്തു
  rationale: രാജാവിന്റെ ഭരണത്തെ വിലയിരുത്തുന്ന രാജാക്കന്മാരിലെ പതിവുശൈലിയാണിത്. നാമവിശേഷണമായി ഉപയോഗിച്ചിരിക്കുന്ന הַיָּשָׁר എന്ന പദത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ശരിയായതു’ എന്നു നൽകി.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ പരക്കെ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: רַק
  choice: എങ്കിലും
  rationale: മുമ്പുള്ള അനുകൂല വിലയിരുത്തലിന് പരിധി നിർണയിക്കുന്ന വൈരുധ്യഭാവമാണ് ഇവിടെ. ‘എങ്കിലും’ ആ ഭാവം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ‘മാത്രം’ എന്ന പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: לֹא כְּדָוִד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദിനെപ്പോലെയല്ല
  rationale: അമസ്യാവ് ദാവീദിന്റെ നിലവാരത്തോട് ഒത്തില്ലെന്ന താരതമ്യം നിലനിർത്തുന്നു. אָבִיו എന്നത് ഇവിടെ നേരിട്ടുള്ള ജനകനെക്കാൾ വംശപൂർവികനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലത്തിലെ ‘പിതാവ്’ എന്ന ബന്ധപദം പാഠത്തിൽ സംരക്ഷിച്ചു.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: ചെയ്തതെല്ലാംപോലെ
  rationale: כְּכֹל אֲשֶׁר എന്ന ഘടന സമഗ്രമായ അനുകരണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ സംക്ഷിപ്തരൂപം ആ വ്യാപ്തിയും താരതമ്യവും നിലനിർത്തുന്നു.
- source_word: יוֹאָשׁ אָבִיו
  choice: തന്റെ പിതാവായ യോവാശ്
  rationale: സന്ദർഭത്തിൽ യോവാശ് അമസ്യാവിന്റെ നേരിട്ടുള്ള പിതാവാണ്. יוֹאָשׁ എന്ന എബ്രായ നാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: עָשָׂה
  choice: അവനും ചെയ്തു
  rationale: വാക്യാവസാനത്തിലെ ആവർത്തിച്ച ക്രിയയെ ഒഴിവാക്കാതെ നിലനിർത്തിയത് അമസ്യാവ് യോവാശിന്റെ മാതൃക പിന്തുടർന്നു എന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അനുകൂലമായ രാജകീയ വിലയിരുത്തലും അതിനുള്ള പരിമിതിയും
  choice: അമസ്യാവ് യഹോവയുടെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്തു എന്ന അനുകൂല വിലയിരുത്തൽ നിലനിർത്തുകയും, ദാവീദിനോട് ഒത്തില്ലെന്നും യോവാശിന്റെ മാതൃകയാണ് പിന്തുടർന്നതെന്നും വ്യക്തമാക്കുകയും ചെയ്തു.
  alternative: ആദ്യവാക്യത്തിലെ പ്രശംസയ്ക്ക് കൂടുതൽ ഊന്നൽ നൽകി ദാവീദുമായുള്ള വ്യത്യാസം മൃദുവാക്കുക; അല്ലെങ്കിൽ തുടക്കത്തിലെ പ്രശംസയെ വെറും ഔപചാരികതയായി കണ്ട് മുഴുവൻ വാക്യവും പ്രതികൂലമായി അവതരിപ്പിക്കുക.
  rationale: എബ്രായ വാക്യഘടന ആദ്യം യഥാർഥമായ അനുകൂല വിലയിരുത്തൽ നൽകുകയും തുടർന്ന് רַק മുഖേന അതിന് പരിധി നിർണയിക്കുകയും ചെയ്യുന്നു. അതിനാൽ പ്രശംസയും പരിമിതിയും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തി.
- issue: ദാവീദിനെ ‘പിതാവ്’ എന്നു വിളിക്കുന്നത്
  choice: മൂലപാഠത്തിലെ വംശപരമായ ബന്ധഭാഷ നിലനിർത്തി ‘തന്റെ പിതാവായ ദാവീദ്’ എന്നു പരിഭാഷപ്പെടുത്തി; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: പ്രധാന പാഠത്തിൽത്തന്നെ ‘പൂർവപിതാവായ ദാവീദ്’ എന്നു വിശദീകരിച്ച് നൽകുക.
  rationale: ബൈബിളിലെ രാജവംശഭാഷയിൽ ‘പിതാവ്’ എന്ന പദത്തിന് ജനകനെയും പൂർവികനെയും സൂചിപ്പിക്കാം. മൂലത്തിന്റെ സാംസ്കാരിക രൂപം പാഠത്തിൽ സൂക്ഷിക്കുകയും തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ കുറിപ്പ് നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. ‘ദൃഷ്ടിയിൽ’ എന്ന ബൈബിൾപ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നതുമാണ്. രണ്ട് വ്യത്യസ്ത അർഥവ്യാപ്തികളിൽ വരുന്ന ‘പിതാവ്’ എന്ന പദം മൂലപാഠത്തോടുള്ള ഔപചാരിക അടുപ്പത്തിനായി സംരക്ഷിച്ചു; ആവശ്യമായ വ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
