language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי רָאָ֧ה יְהוָ֛ה אֶת עֳנִ֥י יִשְׂרָאֵ֖ל מֹרֶ֣ה מְאֹ֑ד וְ/אֶ֤פֶס עָצוּר֙ וְ/אֶ֣פֶס עָז֔וּב וְ/אֵ֥ין עֹזֵ֖ר לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
translation:
  language: ml
  text: യിസ്രായേലിന്റെ ദുരിതം അത്യന്തം കഠിനമായിരുന്നുവെന്ന് യഹ്‌വെ കണ്ടു[a]; ബന്ധിതനോ സ്വതന്ത്രനോ ആരും ഉണ്ടായിരുന്നില്ല[b]; യിസ്രായേലിനെ സഹായിക്കാൻ ആരും ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അതിദാരുണമായിരുന്നു” അല്ലെങ്കിൽ “അത്യന്തം തീവ്രമായിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടത്തെ എബ്രായ പദപ്രയോഗം ദുഷ്കരമാണെങ്കിലും, യിസ്രായേലിന്റെ ദുരിതത്തിന്റെ തീവ്രത അതു വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തോട് അടുത്തായി, “ബന്ധിതനും ഇല്ല, ഉപേക്ഷിക്കപ്പെട്ടവനും ഇല്ല.” ആരുംതന്നെ ശേഷിച്ചിരുന്നില്ലെന്നോ എല്ലാ വിഭാഗങ്ങളും നിസ്സഹായരായിരുന്നെന്നോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമായിരിക്കാം ഇത്.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തിലെ നാല് എബ്രായ വ്യഞ്ജനാക്ഷരങ്ങളെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ അംഗീകരിക്കാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עֳנִי
  choice: ദുരിതം
  rationale: ദേശമൊട്ടാകെ അനുഭവിച്ച കഷ്ടപ്പാടും ദയനീയാവസ്ഥയും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: מֹרֶה מְאֹד
  choice: അത്യന്തം കഠിനമായിരുന്നു
  rationale: പദപ്രയോഗത്തിന്റെ കൃത്യമായ സൂക്ഷ്മാർഥം അനിശ്ചിതമാണെങ്കിലും, യിസ്രായേലിന്റെ ദുരിതത്തിന്റെ തീവ്രത വ്യക്തമാക്കുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶפֶס
  choice: ആരുമില്ലായിരുന്നു
  rationale: തുടർന്നുവരുന്ന പദങ്ങളോടൊപ്പം സമ്പൂർണ അഭാവം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עָצוּר
  choice: ബന്ധിതൻ
  rationale: വിവാദമുള്ള സ്ഥിരപ്രയോഗത്തിലെ ആദ്യപദത്തിന്റെ അടിസ്ഥാനരൂപകത്തെ നിലനിർത്തുകയും അതിന്റെ പ്രതിപദവുമായി സമാന്തരത പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: עָזוּב
  choice: സ്വതന്ത്രൻ
  rationale: ബന്ധിതൻ എന്നതിന്റെ പ്രതിപദമായി പ്രയോഗത്തെ ചുരുക്കത്തിലും വ്യക്തമായും നിലനിർത്തുന്നു; കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עֹזֵר
  choice: സഹായിക്കാൻ
  rationale: സഹായിക്കുന്ന ഒരാളുടെ അഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സന്ദർഭം ആവശ്യപ്പെടാത്ത ‘വിടുവിക്കുന്നവൻ’ എന്ന പ്രത്യേക അർഥം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: עָצוּר וְעָזוּב എന്ന ദുഷ്കരമായ എബ്രായ പ്രയോഗം
  choice: ബന്ധിതനോ സ്വതന്ത്രനോ ആരുമില്ലായിരുന്നു
  alternative: തടഞ്ഞുവെക്കപ്പെട്ടവനോ വിട്ടയക്കപ്പെട്ടവനോ ആരുമില്ലായിരുന്നു; അല്ലെങ്കിൽ ആരുംതന്നെ ശേഷിച്ചിരുന്നില്ല
  rationale: വാക്യജോടിയുടെ രൂപം മുഖ്യവാക്യത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ അത് സമൂഹത്തിലെ പ്രത്യേക രണ്ടു വിഭാഗങ്ങളെക്കുറിച്ചുള്ള സിദ്ധാന്തപ്രഖ്യാപനമെന്നതിലുപരി സമ്പൂർണ അഭാവം സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: מֹרֶה מְאֹד എന്ന പദപ്രയോഗത്തിന്റെ അർഥം
  choice: അത്യന്തം കഠിനമായിരുന്നു
  alternative: അതിദാരുണമായിരുന്നു; അത്യന്തം തീവ്രമായിരുന്നു
  rationale: എബ്രായരൂപം ദുഷ്കരമായതിനാൽ ഒരു സൂക്ഷ്മാർഥം ഉറപ്പിച്ചു പറയാതെ, ദുരിതത്തിന്റെ തീവ്രത വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദുഷ്കരമായ രണ്ട് എബ്രായ പ്രയോഗങ്ങളുടെ രൂപവും അനിശ്ചിതത്വവും കഴിയുന്നത്ര നിലനിർത്തി; വായനാസൗകര്യത്തിനായി ക്രിയാപ്രയോഗങ്ങൾ സ്വാഭാവിക മലയാളക്രമത്തിൽ ക്രമപ്പെടുത്തി.
