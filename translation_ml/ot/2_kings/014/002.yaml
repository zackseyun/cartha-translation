  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ രാജവംശവിവരണ ശൈലി. മൂലത്തിലെ മൂന്ന് വിവരഘടകങ്ങൾ—രാജാവായപ്പോഴത്തെ പ്രായം, ഭരണകാലവും സ്ഥലവും, അമ്മയുടെ പേരും സ്വദേശവും—വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
