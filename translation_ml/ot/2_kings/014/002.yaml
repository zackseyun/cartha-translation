  text: അവൻ രാജാവായപ്പോൾ ഇരുപത്തഞ്ചു വയസ്സായിരുന്നു. അവൻ യെരൂശലേമിൽ ഇരുപത്തൊമ്പതു വർഷം ഭരിച്ചു. യെരൂശലേമിൽനിന്നുള്ള അവന്റെ അമ്മയുടെ പേര് യെഹോവദ്ദീൻ[a] എന്നായിരുന്നു.
