translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ പതിവ് രാജവാഴ്ചാസംഗ്രഹസൂത്രവും അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യഭാവവും നിലനിർത്തി. അടിക്കുറിപ്പുസൂചകം അതിന്റെ യഥാർഥ പദവികല്പമായ ദിനവൃത്താന്തപുസ്തകത്തോടു ചേർത്തിരിക്കുന്നു.
