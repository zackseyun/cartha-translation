source:
  edition: WLC
  text: וְ/יֶ֖תֶר דִּבְרֵ֣י אֲמַצְיָ֑הוּ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/018.yaml
  text: The rest of the acts of Amaziah[a], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: അമസ്യാവിന്റെ ശേഷിച്ച പ്രവൃത്തികൾ യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[a] എഴുതപ്പെട്ടിരിക്കുന്നില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദാരാജാക്കന്മാരുടെ രാജവൃത്താന്തപുസ്തകത്തിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: ശേഷിച്ച
  rationale: יֶתֶר എന്നത് ‘ശേഷിപ്പ്/ബാക്കി’ എന്നർഥം നൽകുന്നു. വാക്യാരംഭത്തിലെ וְ ഈ പതിവ് രാജവാഴ്ചാസംഗ്രഹസൂത്രത്തിൽ ബന്ധകമായി പ്രവർത്തിക്കുന്നതിനാൽ, മലയാളത്തിൽ പ്രത്യേകമായി ‘ഇപ്പോൾ’ എന്ന കാലസൂചകം ചേർത്തിട്ടില്ല.
- source_word: דִּבְרֵי
  choice: പ്രവൃത്തികൾ
  rationale: ഇവിടെ പദം വെറും ‘വാക്കുകൾ’ എന്നല്ല, രാജാവിന്റെ ചെയ്തികളും ഭരണകാര്യങ്ങളും ഉൾപ്പെടുന്ന ചരിത്രരേഖയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲמַצְיָהוּ
  choice: അമസ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപാരമ്പര്യത്തോട് ചേർന്ന സ്വാഭാവിക ലിപ്യന്തരണം.
- source_word: הֲלֹא
  choice: ഇല്ലയോ
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ നിഷേധാത്മക വാചാടോപചോദ്യത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: הֵם כְּתוּבִים
  choice: എഴുതപ്പെട്ടിട്ടില്ലയോ
  rationale: നിഷ്ക്രിയ കൃതന്തമായ כְּתוּבִים എന്നതിന്റെ ‘എഴുതപ്പെട്ടിരിക്കുന്നു’ എന്ന അടിസ്ഥാനഭാവവും വാചാടോപചോദ്യരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘പുസ്തകത്തിന്മേൽ’ എന്നു വരാമെങ്കിലും രേഖാസൂചനയിൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘പുസ്തകത്തിൽ’ എന്നതാണ്.
- source_word: דִּבְרֵי הַיָּמִים
  choice: ദിനവൃത്താന്ത
  rationale: രാജകീയ സംഭവങ്ങളുടെ കാലാനുക്രമ രേഖയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും അർഥസമ്പന്നവുമായ മലയാള പദം; ‘രാജവൃത്താന്തം’ എന്നതും സാധ്യമാണ്.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ
  rationale: രേഖയുടെ ശീർഷകത്തിലുള്ള לְ സൂചിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിൽ ഷഷ്ഠിവിഭക്തിയിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
