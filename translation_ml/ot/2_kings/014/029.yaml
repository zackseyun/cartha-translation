id: 2KI.14.29
reference: 2 Kings 14:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יָֽרָבְעָם֙ עִם אֲבֹתָ֔י/ו עִ֖ם מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ זְכַרְיָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/029.yaml
  text: And Jeroboam slept with his fathers[a], with the kings of Israel[b], and Zechariah his son reigned in his place.
translation:
  language: ml
  text: യൊരോബെയാം തന്റെ പിതാക്കന്മാരോടൊപ്പം[a], യിസ്രായേൽരാജാക്കന്മാരോടൊപ്പം[b], നിദ്രപ്രാപിച്ചു. അവന്റെ മകനായ സെഖര്യാവ് അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ പിതാക്കന്മാരോടൊപ്പം കിടന്നു’; ഒരു രാജാവിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യിസ്രായേൽരാജാക്കന്മാരുടെ ഇടയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: ‘പിതാക്കന്മാരോടൊപ്പം’ എന്ന പ്രയോഗത്തോടു ചേരുന്ന പതിവ് രാജകീയ മരണസൂത്രമാണിത്. ‘മരിച്ചു’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷയ്ക്കുപകരം എബ്രായ രൂപകവും സാഹിത്യപരമായ ശൈലിയും നിലനിർത്തുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടൊപ്പം
  rationale: രാജാക്കന്മാരെക്കുറിച്ചുള്ള സമാപനവിവരണങ്ങളിൽ ആവർത്തിക്കുന്ന സ്ഥിരപ്രയോഗത്തെ ഔപചാരികമായി നിലനിർത്തുന്നു; ഇവിടെ ‘പിതാക്കന്മാർ’ എന്നത് പൂർവികരെ സൂചിപ്പിക്കുന്നു.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽരാജാക്കന്മാരോടൊപ്പം
  rationale: ആവർത്തിച്ചിരിക്കുന്ന עִם എന്ന മുൻവാക്കിനെ ‘ഒപ്പം’ എന്നു നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും മരണത്തിലും അടക്കത്തിലും രാജവംശത്തോടുള്ള ബന്ധം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജകീയ പിന്തുടർച്ചാസന്ദർഭത്തിൽ ഒരാൾ രാജത്വം ഏറ്റെടുത്തുവെന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: זְכַרְיָה
  choice: സെഖര്യാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: בְנוֹ
  choice: അവന്റെ മകനായ
  rationale: പുത്രബന്ധം വ്യക്തമായും സ്വാഭാവികമായ മലയാളവാക്യഘടനയിലും നൽകുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: രാജകീയ പിന്തുടർച്ചയിൽ മുൻരാജാവിന്റെ സ്ഥാനത്ത് മകൻ അധികാരമേറ്റുവെന്ന ആശയം നേരിട്ട് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മരണത്തെ സൂചിപ്പിക്കുന്ന രാജകീയ സ്ഥിരപ്രയോഗം
  choice: നിദ്രപ്രാപിച്ചു
  alternative: മരിച്ചു
  rationale: മരണമാണ് സന്ദർഭാർത്ഥമെങ്കിലും ‘മരിച്ചു’ എന്നു മാത്രം പറഞ്ഞ് എബ്രായ രൂപകം ഇല്ലാതാക്കാതെ, പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള അധിക വ്യാഖ്യാനവും ചേർക്കാതെ മൂലത്തിലെ സാഹിത്യപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. രാജകീയ മരണവിവരണത്തിന്റെ ഔപചാരിക സ്വരം നിലനിർത്തിയെങ്കിലും അത്യന്തം പഴയ ശൈലിയിലുള്ള ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി; ‘നിദ്രപ്രാപിച്ചു’ എന്ന പരിചിതമായ സാഹിത്യപ്രയോഗം മൂലരൂപകം സംരക്ഷിക്കുന്നു.
