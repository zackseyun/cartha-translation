id: 2KI.14.16
reference: 2 Kings 14:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יְהוֹאָשׁ֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ בְּ/שֹׁ֣מְר֔וֹן עִ֖ם מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ יָרָבְעָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: ml
  text: യഹോവാശ് തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു; അവനെ ശമര്യയിൽ ഇസ്രായേൽരാജാക്കന്മാരോടൊപ്പം അടക്കം ചെയ്തു. അവന്റെ മകനായ യൊരോബെയാം അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: രാജകീയ മരണവിവരണങ്ങളിൽ ‘പിതാക്കന്മാരോടൊപ്പം കിടന്നു’ എന്നത് മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവുശൈലിയാണ്. മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ‘നിദ്രപ്രാപിച്ചു’ ആ രൂപകവും സൂത്രവാക്യസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടൊപ്പം
  rationale: രാജാക്കന്മാരുടെ പുസ്തകത്തിലെ ആവർത്തിത മരണസൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്താൻ ‘പൂർവികർ’ എന്നതിനു പകരം മൂലപദത്തോട് അടുത്ത ‘പിതാക്കന്മാർ’ ഉപയോഗിച്ചു.
- source_word: וַיִּקָּבֵר
  choice: അവനെ ... അടക്കം ചെയ്തു
  rationale: ഹീബ്രു നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയ അർഥം മലയാളത്തിലെ സ്വാഭാവികമായ അനിശ്ചിതകർതൃപ്രയോഗത്തിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: ב ഇവിടെ സ്ഥലസൂചകമാണ്; സംസ്കാരസ്ഥലം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരോടൊപ്പം
  rationale: עִם എന്നതിന്റെ ‘ഒപ്പം’ എന്ന ബന്ധാർഥവും മുൻ ഇസ്രായേൽരാജാക്കന്മാരോടൊപ്പമുള്ള സംസ്കാരബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: അവകാശപിന്തുടർച്ചാവിവരണത്തിൽ מלך ഇവിടെ രാജസ്ഥാനാരോഹണം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവനു പകരം രാജാവായി’ എന്നത് വാക്യസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: വെറും കാലക്രമമായ ‘അവന്റെ ശേഷം’ എന്നതിനെക്കാൾ സ്ഥാനത്തുള്ള പകരക്കാരനെന്ന അവകാശപിന്തുടർച്ചാഭാവം കൃത്യമായി നൽകുന്നു.
