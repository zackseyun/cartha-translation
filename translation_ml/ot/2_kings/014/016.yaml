translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ചരിത്രവിവരണശൈലി. മരണത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രാജകീയസൂത്രത്തിന്റെ രൂപകസ്വഭാവം ‘നിദ്രപ്രാപിച്ചു’ എന്നതിലൂടെ നിലനിർത്തി; പേരുകൾ മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകി.
