  rationale: കുതിരകളെക്കുറിച്ചുള്ള ഹീബ്രു ബഹുവചനവും ഗതാഗതരീതിയുടെ അനിശ്ചിതത്വവും സംരക്ഷിച്ചുകൊണ്ട്, പ്രധാനപാഠത്തിലെ കൃത്രിമമായ ‘കുതിരകളിന്മേൽ’ എന്ന രൂപം കൂടുതൽ സ്വാഭാവികമായ ‘കുതിരകളുടെ പുറത്ത്’ എന്നാക്കി. അടിക്കുറിപ്പ് മൂലഭാഷയുടെ അക്ഷരാർഥവും സാദ്ധ്യമായ, എന്നാൽ അനിശ്ചിതമായ, വാഹകവ്യാഖ്യാനവും വ്യക്തമാക്കുന്നു. മറ്റെല്ലാ ഘടകങ്ങളും നിലനിർത്തി.
