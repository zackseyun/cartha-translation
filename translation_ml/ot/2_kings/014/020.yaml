  yaml_path: translation/ot/2_kings/014/020.yaml
  text: They carried him on horses[b][a], and he was buried in Jerusalem with his fathers in the city of David.
translation:
  language: ml
  text: അവർ അവനെ കുതിരകളുടെ പുറത്ത്[a] കൊണ്ടുപോയി. അവനെ യെരൂശലേമിൽ, ദാവീദിന്റെ നഗരത്തിൽ, അവന്റെ പിതാക്കന്മാരോടൊപ്പം[b] അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “കുതിരകളിന്മേൽ” എന്നാണ്. ശരീരം കുതിരകൾ വഹിച്ച ഏതെങ്കിലും വാഹനത്തിൽ കൊണ്ടുപോയതായിരിക്കാമെങ്കിലും, കൃത്യമായ ഗതാഗതരീതി വാചകം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: “പിതാക്കന്മാരോടൊപ്പം” എന്നത് പരമ്പരാഗതമായ ഒരു ശവസംസ്കാരപ്രയോഗമാണ്; രാജവംശത്തിലെ പൂർവികരോടൊപ്പം അടക്കം ചെയ്തു എന്നാണ് ഇവിടെ അർഥം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: അവർ അവനെ ... കൊണ്ടുപോയി
  rationale: נשׂא എന്ന ക്രിയയുടെ ‘വഹിക്കുക/കൊണ്ടുപോകുക’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; സർവനാമം അമസ്യാവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: עַל הַסּוּסִים
  choice: കുതിരകളിന്മേൽ
  rationale: עַל എന്ന ഉപസർഗത്തിന്റെയും ബഹുവചനമായ הַסּוּסִים എന്ന പദത്തിന്റെയും രൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു. ശവശരീരം കുതിരകൾ വഹിച്ച ഒരു വാഹനത്തിലോ മറ്റൊരു കുതിരസഹായ ഗതാഗതരീതിയിലോ കൊണ്ടുപോയതാകാം; മുഖ്യപാഠം അതിനെ നിർണയിക്കുന്നില്ല.
- source_word: וַיִּקָּבֵר
  choice: അവനെ ... അടക്കം ചെയ്തു
  rationale: ഹീബ്രു രൂപം കർമണിപ്രയോഗമാണെങ്കിലും, ‘അവൻ അടക്കം ചെയ്യപ്പെട്ടു’ എന്നതിനെക്കാൾ ഈ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്ന അനിശ്ചിതകർതൃ സകർമക ഘടന സ്വീകരിച്ചു.
- source_word: בִּירוּשָׁלַםִ
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമത്തിന്റെ അംഗീകൃത മലയാളരൂപവും സ്ഥാനസൂചക വിഭക്തിയും ഉപയോഗിക്കുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: അവന്റെ പിതാക്കന്മാരോടൊപ്പം
  rationale: രാജവംശീയ ശവസംസ്കാരസൂത്രത്തിന്റെ കുടുംബപരവും വംശപരവുമായ ധ്വനി നിലനിർത്താൻ ‘പൂർവികർ’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റാതെ ഉറവിടത്തിലെ ‘പിതാക്കന്മാർ’ സംരക്ഷിക്കുന്നു.
- source_word: בְּעִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരത്തിൽ
  rationale: യെരൂശലേമിനുള്ളിലെ ശവസംസ്കാരസ്ഥലം വ്യക്തമാക്കുന്ന സ്ഥലനാമം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
