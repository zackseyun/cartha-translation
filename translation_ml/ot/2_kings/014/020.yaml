  source_fidelity: ഹീബ്രുവിലെ עַל הַסּוּסִים എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ ബഹുവചനത്തിലുള്ള ‘കുതിരകളിന്മേൽ/കുതിരകളുടെ പുറത്ത്’ എന്നാണ്. അതിന്റെ കൃത്യമായ ഗതാഗതരീതി വ്യക്തമല്ല; മുഖ്യപാഠം അതിനെ വ്യാഖ്യാനിക്കാതെ നിലനിർത്തണം. ‘കുതിരപ്പുറത്ത്’ എന്ന മലയാള പ്രയോഗം സ്വാഭാവികമാണെങ്കിലും ബഹുവചനവും അസാധാരണത്വവും മങ്ങിക്കുന്നു. അതിനാൽ മുഖ്യപാഠത്തിൽ കൂടുതൽ നേരിട്ടുള്ള പ്രയോഗവും അടിക്കുറിപ്പിൽ സാധ്യതാവ്യാഖ്യാനവും ഉചിതമാണ്.
  naturalness: ‘കുതിരകളിന്മേൽ’ എന്ന രൂപം ആധുനിക മലയാളത്തിൽ അൽപം കൃത്രിമവും, ഒരാളെയോ ശരീരത്തെയോ ഒരേസമയം ഒന്നിലധികം കുതിരകളുടെ മേൽ വച്ചതായി കേൾക്കാവുന്നതുമാണ്. ‘കുതിരകളുടെ പുറത്ത്’ കൂടുതൽ വ്യക്തവും സ്വാഭാവികവുമാണ്, എങ്കിലും അസാധാരണമായ മൂലപ്രയോഗത്തിന്റെ സ്വഭാവം സംരക്ഷിക്കുന്നു. বাক്യത്തിലെ ശേഷിക്കുന്ന ഭാഗം സ്വാഭാവികവും മാന്യമായ വിവരണരജിസ്റ്ററിനൊത്തതുമാണ്.
  terminology: ‘അടക്കം ചെയ്തു,’ ‘യെരൂശലേം,’ ‘ദാവീദിന്റെ നഗരം,’ ‘പിതാക്കന്മാരോടൊപ്പം’ എന്നിവ യോജിച്ചിരിക്കുന്നു. ‘പിതാക്കന്മാരോടൊപ്പം’ എന്നത് വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന ശവസംസ്കാരസൂത്രമാണെന്ന അടിക്കുറിപ്പ് സഹായകരമാണ്. ‘രാജവംശത്തിലെ പൂർവികർ’ എന്ന വിശദീകരണം സന്ദർഭാനുസൃതമായി മതിയായും അതിരുകടക്കാതെയും ഉണ്ട്.
