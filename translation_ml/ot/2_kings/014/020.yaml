  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘കുതിരകളിന്മേൽ’ എന്ന അല്പം ഔപചാരികമായ പ്രയോഗം ഉറവിടത്തിലെ ബഹുവചനവും യഥാർഥമായ അനിശ്ചിതത്വവും നിലനിർത്താനാണ്; സാധ്യതയുള്ള ഗതാഗതരീതി അടിക്കുറിപ്പിൽ മാത്രം വിശദീകരിക്കുന്നു.
