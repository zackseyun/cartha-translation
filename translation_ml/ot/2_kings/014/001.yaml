source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/יוֹאָ֥שׁ בֶּן יוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ אֲמַצְיָ֥הוּ בֶן יוֹאָ֖שׁ מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/001.yaml
  text: In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah.
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ രാജാവായ യെഹോവാഹാസിന്റെ മകൻ യോവാശിന്റെ ഭരണത്തിന്റെ രണ്ടാം വർഷത്തിൽ, യോവാശിന്റെ മകൻ അമസ്യാവ് യെഹൂദയുടെ രാജാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: ഭരണത്തിന്റെ രണ്ടാം വർഷത്തിൽ
  rationale: രാജഭരണവർഷം സൂചിപ്പിക്കുന്ന എബ്രായ കാലനിർണ്ണയശൈലി മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു; שְׁתַּיִם ഇവിടെ പ്രയോഗപരമായി ‘രണ്ടാം’ എന്നാണ്.
- source_word: לְ/יוֹאָשׁ
  choice: യോവാശിന്റെ ഭരണത്തിന്റെ
  rationale: ഈ രാജഭരണകാലസൂത്രത്തിൽ לְ എന്നത് ആരുടെ ഭരണവർഷമാണ് എണ്ണുന്നതെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഭരണത്തിന്റെ’ എന്നു വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: בֶּן יוֹאָחָז מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ യെഹോവാഹാസിന്റെ മകൻ
  rationale: പിതൃനാമവും രാജപദവിയും രാജ്യവും മൂലപാഠത്തിലെ ബന്ധം നിലനിർത്തി മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ സിംഹാസനാരോഹണം അഥവാ രാജാവാകൽ സൂചിപ്പിക്കുന്നു; ‘രാജാവായി’ അത് സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֲמַצְיָהוּ בֶן יוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ യോവാശിന്റെ മകൻ അമസ്യാവ്
  rationale: അമസ്യാവിന്റെ പിതാവായ യോവാശിനെ യെഹൂദാരാജാവെന്നു തിരിച്ചറിയുന്ന മൂലപാഠഘടന സംരക്ഷിക്കുന്നു; ഇസ്രായേൽരാജാവായ യോവാശിൽനിന്നുള്ള വ്യത്യാസവും വ്യക്തമാകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. ഒരേ വാക്യത്തിൽ വരുന്ന രണ്ടു ‘യോവാശ്’ വ്യക്തികളെ അവരുടെ പിതൃനാമവും രാജ്യവും ഉപയോഗിച്ച് വ്യക്തമായി വേർതിരിച്ചിരിക്കുന്നു.
