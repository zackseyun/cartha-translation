  naturalness: ‘അരാബായുടെ കടൽ’ എന്ന ജനിതകപ്രയോഗം ‘അരാബാ കടൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികവും എബ്രായ നിർമിതിയോടു കൂടുതൽ സുതാര്യവുമാണ്. ‘തന്റെ ദാസനായ … മുഖാന്തരം അരുളിച്ചെയ്ത വചനപ്രകാരം’ എന്ന ക്രമം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
