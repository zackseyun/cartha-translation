  to: അവൻ ഇസ്രായേലിന്റെ അതിർത്തി ലെബോ-ഹമാത്ത്[a] മുതൽ അരാബായുടെ കടൽ[b] വരെ പുനഃസ്ഥാപിച്ചു. ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ തന്റെ ദാസനായ, അമിത്തായിയുടെ മകനായ, ഗത്ത്-ഹേഫെരിൽനിന്നുള്ള യോനാ പ്രവാചകൻ മുഖാന്തരം അരുളിച്ചെയ്ത വചനപ്രകാരമായിരുന്നു അത്.
  rationale: വാക്യം പുനഃക്രമീകരിച്ച് പുനഃസ്ഥാപനപ്രവൃത്തി യഹ്‌വെ അരുളിച്ചെയ്ത വചനപ്രകാരമായിരുന്നുവെന്ന മൂലപാഠത്തിലെ ബന്ധം വ്യക്തമായി. യോനായുടെ വിശേഷണങ്ങളും ഉത്ഭവസ്ഥലവും സ്വാഭാവിക മലയാളത്തിൽ, അർഥനഷ്ടമില്ലാതെ പുനഃസ്ഥാപിച്ചു. സ്ഥലനാമപരമായും സാധ്യതാപരമായും ഉള്ള അടിക്കുറിപ്പുകൾ അതേ അർഥത്തിൽ നിലനിർത്തി.
