id: 2KI.14.25
reference: 2 Kings 14:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
translation:
  language: ml
  text: അവൻ ഇസ്രായേലിന്റെ അതിർത്തി ലെബോ-ഹമാത്ത്[a] മുതൽ അരാബായുടെ കടൽ[b] വരെ പുനഃസ്ഥാപിച്ചു. ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ തന്റെ ദാസനായ, അമിത്തായിയുടെ മകനായ, ഗത്ത്-ഹേഫെരിൽനിന്നുള്ള യോനാ പ്രവാചകൻ മുഖാന്തരം അരുളിച്ചെയ്ത വചനപ്രകാരമായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പദശഃ: “ഹമാത്തിലേക്കുള്ള പ്രവേശനസ്ഥലം.”'
    reason: lexical_alternative
  - marker: b
    text: ഇത് മിക്കവാറും ചാവുകടലിനെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵשִׁיב
  choice: പുനഃസ്ഥാപിച്ചു
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ഇസ്രായേലിന്റെ പഴയ ഭൂപരിധി വീണ്ടും നിലവിൽ വരുത്തിയതിനെ സൂചിപ്പിക്കുന്നു; രാഷ്ട്രീയ-ഭൂമിശാസ്ത്രപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גְּבוּל
  choice: അതിർത്തി
  rationale: രാജ്യത്തിന്റെ ഭൂപരിധിയെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִלְּבוֹא חֲמָת
  choice: ലെബോ-ഹമാത്ത് മുതൽ
  rationale: പ്രയോഗത്തെ സ്ഥിരമായ സ്ഥലനാമമായി പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יָם הָעֲרָבָה
  choice: അരാബാ കടൽ
  rationale: എബ്രായ ഭൂമിശാസ്ത്രനാമം നേരിട്ട് സംരക്ഷിക്കുന്നു; ചാവുകടലെന്ന സാധ്യതയുള്ള തിരിച്ചറിയൽ അടിക്കുറിപ്പിലാക്കുന്നു.
- source_word: כִּדְבַר
  choice: വചനപ്രകാരം
  rationale: മുമ്പ് അരുളിച്ചെയ്ത ദൈവവചനത്തിന് അനുസൃതമായി സംഭവം നടന്നുവെന്ന ബന്ധം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיַד
  choice: മുഖാന്തരം
  rationale: ഇവിടെ പ്രവാചകൻ ദൈവിക സന്ദേശത്തിന്റെ മാധ്യമമാണെന്ന എബ്രായ കർത്തൃത്വപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַבְדּוֹ
  choice: തന്റെ ദാസൻ
  rationale: പ്രവാചക നിയോഗത്തിന്റെ പശ്ചാത്തലത്തിൽ ദൈവത്തോടുള്ള സേവനവും所属ബന്ധവും സൂചിപ്പിക്കുന്ന യോജിച്ച പദമാണ്.
- source_word: הַנָּבִיא
  choice: പ്രവാചകൻ
  rationale: യോനായുടെ ദൗത്യം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള സ്ഥാനനാമം.
- source_word: מִגַּת הַחֵפֶר
  choice: ഗത്ത്-ഹേഫെർ സ്വദേശി
  rationale: מן സൂചിപ്പിക്കുന്ന ഉത്ഭവസ്ഥലത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്താനും ഒരു സ്ഥാനപ്പേര് പകരംവെക്കാതിരിക്കാനും ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: יָם הָעֲרָבָה എന്ന സ്ഥലത്തിന്റെ തിരിച്ചറിയൽ
  choice: അരാബാ കടൽ
  alternative: ചാവുകടൽ
  rationale: പ്രധാനപാഠത്തിൽ എബ്രായ പ്രയോഗം അതേപടി പ്രതിഫലിപ്പിച്ച് ഭൂമിശാസ്ത്രപരമായ സാധ്യതയുള്ള തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യത്തിലെ ദൈവവചനത്തോടുള്ള അനുരൂപതയും പ്രവാചകന്റെ മാധ്യമസ്ഥിതിയും വ്യക്തമാക്കുന്നതിനായി അവസാന ഭാഗം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ പുനഃക്രമീകരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
