source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יָרָבְעָ֜ם וְ/כָל אֲשֶׁ֤ר עָשָׂה֙ וּ/גְבוּרָת֣/וֹ אֲשֶׁר נִלְחָ֔ם וַ/אֲשֶׁ֨ר הֵשִׁ֜יב אֶת דַּמֶּ֧שֶׂק וְ/אֶת חֲמָ֛ת לִ/יהוּדָ֖ה בְּ/יִשְׂרָאֵ֑ל הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: The rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: യൊരോബെയാമിന്റെ ശേഷിച്ച പ്രവൃത്തികളും, അവൻ ചെയ്ത സകലവും, അവന്റെ പരാക്രമവും, അവൻ എങ്ങനെ യുദ്ധം ചെയ്തുവെന്നും ദമസ്കൊസിനെയും ഹമാത്തിനെയും ഇസ്രായേലിൽ യെഹൂദായ്ക്ക് എങ്ങനെ പുനഃസ്ഥാപിച്ചുവെന്നും—ഇവ ഇസ്രായേൽരാജാക്കന്മാരുടെ വൃത്താന്തപുസ്തകത്തിൽ എഴുതിയിട്ടില്ലയോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ പതിവായി വരുന്ന സൂത്രവാക്യമാണിത്. דִּבְרֵי എന്നതിന്റെ അക്ഷരാർഥം ‘കാര്യങ്ങൾ/വാക്കുകൾ’ എന്നാണെങ്കിലും ഇവിടെ രാജാവിന്റെ പ്രവൃത്തികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്ത സകലവും
  rationale: עשה എന്ന ക്രിയയുടെ വിശാലമായ അർഥവ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവികമായ പരിഭാഷ.
- source_word: וּגְבוּרָתוֹ
  choice: അവന്റെ വീര്യം
  rationale: גְּבוּרָה ശക്തി, പരാക്രമം, വീരപ്രവൃത്തികൾ എന്നിവ സൂചിപ്പിക്കാം. പിന്നാലെയുള്ള യുദ്ധപരാമർശത്തിന്റെ വെളിച്ചത്തിൽ ‘വീര്യം’ സൈനികപരാക്രമത്തിന്റെ ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נִלְחָם
  choice: അവൻ എങ്ങനെ യുദ്ധം ചെയ്തുവെന്ന്
  rationale: മുൻപുള്ള ‘വീര്യം’ യുദ്ധത്തിൽ എങ്ങനെ പ്രകടമായെന്ന് വിശദീകരിക്കുന്ന ബന്ധവാക്യത്തിന്റെ സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַאֲשֶׁר הֵשִׁיב
  choice: എങ്ങനെ തിരികെനൽകിയെന്ന്
  rationale: הֵשִׁיב എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘തിരികെ കൊണ്ടുവരുക/തിരികെ നൽകുക’ നിലനിർത്തുന്നു; രാഷ്ട്രീയമായി ‘വീണ്ടെടുത്തു’ എന്ന് തീർപ്പാക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: אֶת דַּמֶּשֶׂק וְאֶת חֲמָת
  choice: ദമസ്കൊസിനെയും ഹമാത്തിനെയും
  rationale: സ്ഥലനാമങ്ങൾ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ രൂപങ്ങളിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לִיהוּדָה בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ യെഹൂദായ്ക്ക്
  rationale: ദുഷ്കരവും ചുരുക്കിയതുമായ എബ്രായപ്രയോഗത്തിന്റെ പദക്രമവും അവ്യക്തതയും കഴിയുന്നത്ര നിലനിർത്തുന്നു; ചരിത്ര-ഭൂമിശാസ്ത്രബന്ധം വിവർത്തനത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടില്ലയോ?
  rationale: രാജാക്കന്മാരുടെ പുസ്തകത്തിലെ പതിവായ അലങ്കാരചോദ്യരൂപവും ‘എഴുതപ്പെട്ടിരിക്കുന്നു’ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ വൃത്താന്തപുസ്തകത്തിൽ
  rationale: രാജകീയ രേഖാസമാഹാരത്തിന്റെ ശീർഷകം മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ചരിത്രാഖ്യാനശൈലി. എബ്രായത്തിലെ രാജഭരണസംഗ്രഹസൂത്രം സ്വാഭാവികമാക്കിയെങ്കിലും ദുഷ്കരമായ ഭൂമിശാസ്ത്രപ്രയോഗത്തിന്റെ യഥാർഥ അവ്യക്തത നിലനിർത്തി.
