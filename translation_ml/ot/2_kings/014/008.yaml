  yaml_path: translation/ot/2_kings/014/008.yaml
  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
translation:
  language: ml
  text: 'അപ്പോൾ അമസ്യാവ് യേഹൂവിന്റെ മകനായ യെഹോവാഹാസിന്റെ മകനും ഇസ്രായേൽരാജാവുമായ യെഹോവാശിന്റെ അടുക്കലേക്ക് ദൂതന്മാരെ അയച്ച് ഇങ്ങനെ പറഞ്ഞു: “വരൂ, നമുക്ക് മുഖാമുഖം കാണാം.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നമുക്ക് മുഖങ്ങൾ കാണാം.” ഇവിടെ ഈ ഹീബ്രു പ്രയോഗം നേരിട്ട് ഏറ്റുമുട്ടുന്നതിനെ—സന്ദർഭത്തിൽ സൈനിക ഏറ്റുമുട്ടലിനെ—സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
