  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്ന കാലക്രമസൂചകം.
- source_word: שָׁלַח ... מַלְאָכִים
  choice: ദൂതന്മാരെ അയച്ചു
