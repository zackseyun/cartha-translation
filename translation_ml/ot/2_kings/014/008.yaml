translation_notes:
  register: ആധുനികവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി. വാക്യത്തിലെ വെല്ലുവിളിയുടെ ഭാവം നിലനിർത്തിയിരിക്കുമ്പോഴും ‘യുദ്ധം ചെയ്യാം’ എന്ന് മുഖ്യപാഠത്തിൽ ചേർത്ത് ഹീബ്രു പ്രയോഗത്തിന്റെ സൂക്ഷ്മത ഇല്ലാതാക്കിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
