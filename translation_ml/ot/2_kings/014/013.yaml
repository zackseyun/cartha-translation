base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: ml
  text: ഇസ്രായേൽ രാജാവായ യെഹോവാശ്, യെഹോവാശിന്റെ മകനും അഹസ്യാവിന്റെ മകനുമായ യെഹൂദാരാജാവായ അമസ്യാവിനെ ബേത്ത്-ശേമെശിൽവെച്ച് പിടികൂടി. തുടർന്ന് അവൻ യെരൂശലേമിലേക്കു വന്നു[a]; എഫ്രയീം കവാടം മുതൽ കോണുകവാടം വരെ, നാനൂറ് മുഴം നീളത്തിൽ, യെരൂശലേമിന്റെ മതിലിൽ തകർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായ പാഠത്തിൽ “അവർ യെരൂശലേമിലേക്കു വന്നു” എന്നാണ്. എന്നാൽ സന്ദർഭവും തൊട്ടുപിന്നാലെയുള്ള ഏകവചന ക്രിയയും യെഹോവാശിനെ സൂചിപ്പിക്കുന്ന “അവൻ വന്നു” എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  choice: പിടികൂടി
  rationale: യുദ്ധത്തിൽ എതിരാളിയായ രാജാവിനെ തടവുകാരനായി പിടിച്ചതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: ബേത്ത്-ശേമെശിൽവെച്ച്
  rationale: പിടികൂടിയ സ്ഥലം വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക സ്ഥാനപ്രയോഗം.
- source_word: ו/יבאו
  choice: തുടർന്ന് അവൻ യെരൂശലേമിലേക്കു വന്ന്
  rationale: മസൊററ്റിക് വായനയിലെ സ്വരചിഹ്നങ്ങളും സന്ദർഭവും ഏകവചനമായ യെഹോവാശിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ വ്യഞ്ജനപാഠത്തിലെ ബഹുവചനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּפְרֹץ
  choice: ഇടിച്ചുകളഞ്ഞു
  rationale: മതിലിന്റെ ഒരു ഭാഗം തകർത്തുനീക്കിയ സൈനികപ്രവർത്തനം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּחוֹמַת יְרוּשָׁלַם
  choice: യെരൂശലേമിന്റെ മതിൽ
  rationale: ഹീബ്രായ പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിലെ സ്വാഭാവിക കർമഘടനയിൽ നൽകുന്നു.
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  choice: എഫ്രയീം കവാടംമുതൽ കോണിലെ കവാടംവരെ
  rationale: തകർത്ത മതിൽഭാഗത്തിന്റെ രണ്ട് അതിരുകളും വ്യക്തമായി കാണിക്കുന്ന മലയാളപ്രയോഗം.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: നാനൂറു മുഴം നീളത്തിൽ
  rationale: പുരാതന അളവായ 'മുഴം' നിലനിർത്തുകയും ഈ സംഖ്യ മതിൽഭാഗത്തിന്റെ നീളമാണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בֶּן ... בֶּן ...
  choice: അഹസ്യാവിന്റെ മകനായ യെഹോവാശിന്റെ മകൻ
  rationale: ആവർത്തിച്ചുള്ള ഹീബ്രായ വംശാവലിഘടന നിലനിർത്തുന്നു; 'കൊച്ചുമകൻ' എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
