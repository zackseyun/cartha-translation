- from: ഇസ്രായേൽരാജാവായ യെഹോവാശ്, അഹസ്യാവിന്റെ മകനായ യെഹോവാശിന്റെ മകൻ അമസ്യാവ് എന്ന യെഹൂദാരാജാവിനെ ബേത്ത്-ശേമെശിൽവെച്ച് പിടികൂടി. തുടർന്ന് അവൻ യെരൂശലേമിലേക്കു വന്ന്[a], എഫ്രയീം കവാടംമുതൽ കോണിലെ കവാടംവരെ നാനൂറു മുഴം നീളത്തിൽ യെരൂശലേമിന്റെ മതിൽ ഇടിച്ചുകളഞ്ഞു.
