    issue: Footnote claims that Masoretic vowel points support 'he came.'
    rationale: The Hebrew form ויבאו is plural ('and they came') in the transmitted text. The contextual singular rendering should be identified as a contextual inference, while the plural textual form must remain accurately described.
  - severity: low
    issue: '''മതിൽ ഇടിച്ചുകളഞ്ഞു'' can suggest demolition of the entire wall.'
    rationale: The Hebrew describes breaching/breaking down the wall over the stated extent. 'മതിലിൽ ... തകർത്തു' more directly conveys a breach in that stretch without overstating the action.
