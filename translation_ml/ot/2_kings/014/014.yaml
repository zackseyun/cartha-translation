  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ദുഷ്കരമായ എബ്രായ പ്രയോഗം മുഖ്യവാചകത്തിൽ അർഥസഹജമായി നൽകി, അതിന്റെ അക്ഷരാർഥവും അനിശ്ചിതത്വവും അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
