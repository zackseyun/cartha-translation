id: 2KI.14.14
reference: 2 Kings 14:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַ֣ח אֶת כָּל הַ/זָּהָב וְ֠/הַ/כֶּסֶף וְ/אֵ֨ת כָּל הַ/כֵּלִ֜ים הַ/נִּמְצְאִ֣ים בֵּית יְהוָ֗ה וּ/בְ/אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֵ֖ת בְּנֵ֣י הַ/תַּֽעֲרֻב֑וֹת וַ/יָּ֖שָׁב שֹׁמְרֽוֹנָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/014.yaml
  text: He took all the gold and silver[a], and all the vessels found in the house of Yahweh and in the treasuries of the king’s house, and the hostages, and returned to Samaria.
translation:
  language: ml
  text: അവൻ സ്വർണവും വെള്ളിയും മുഴുവനും, യഹോവയുടെ ആലയത്തിലും രാജകൊട്ടാരത്തിലെ ഭണ്ഡാരങ്ങളിലും ഉണ്ടായിരുന്ന സകല ഉപകരണങ്ങളും, പണയമായി പിടിച്ചുവെച്ചിരുന്നവരെയും[a] എടുത്തുകൊണ്ട് ശമര്യയിലേക്കു മടങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘പണയങ്ങളുടെ പുത്രന്മാർ’ അഥവാ ‘ജാമ്യക്കാരുടെ പുത്രന്മാർ’; സുരക്ഷയ്ക്കായി പിടിച്ചുവെച്ച ആളുകളെ—അതായത് ബന്ദികളെ—ഉദ്ദേശിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: അവൻ ... എടുത്തുകൊണ്ട്
  rationale: തുടർച്ചയായ ഭൂതകാല ആഖ്യാനക്രിയയെ സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ അടുത്ത ക്രിയയായ ‘മടങ്ങിപ്പോയി’യോട് ബന്ധിപ്പിക്കുന്നു.
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: സ്വർണവും വെള്ളിയും മുഴുവനും
  rationale: כָּל സൂചിപ്പിക്കുന്ന സമഗ്രത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כָּל הַכֵּלִים
  choice: സകല ഉപകരണങ്ങളും
  rationale: כֵּלִים എന്ന വിശാലപദം പാത്രങ്ങൾക്കു മാത്രമായി ചുരുക്കാതെ, ആലയത്തിലും രാജഭണ്ഡാരങ്ങളിലും ഉണ്ടായിരുന്ന വിവിധ വസ്തുക്കളെ ഉൾക്കൊള്ളുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: ‘യഹോവയുടെ ഭവനം’ എന്ന അക്ഷരാർഥം ഇവിടെ ദേവാലയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തവും സ്വാഭാവികവുമായ ‘ആലയം’ സ്വീകരിച്ചു; ദൈവനാമം യഹോവ എന്നു നിലനിർത്തി.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: രാജകൊട്ടാരത്തിലെ ഭണ്ഡാരങ്ങളിൽ
  rationale: ‘രാജാവിന്റെ ഭവനത്തിലെ ഭണ്ഡാരങ്ങൾ’ എന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായി നൽകുന്നു.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: പണയമായി പിടിച്ചുവെച്ചിരുന്നവർ
  rationale: ദുഷ്കരമായ എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭസഹജമായ അർഥം നൽകുന്നു; ‘ബന്ദികൾ’ എന്നതിനെക്കാൾ ഇവർ സുരക്ഷയ്ക്കോ ഉറപ്പിനോ വേണ്ടി പിടിച്ചുവെക്കപ്പെട്ടവരാണെന്ന ആശയം വ്യക്തമാക്കുന്നു. അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וַיָּשָׁב שֹׁמְרוֹנָה
  choice: ശമര്യയിലേക്കു മടങ്ങിപ്പോയി
  rationale: שוב എന്ന മടങ്ങിവരവ്/മടങ്ങിപ്പോക്ക് ക്രിയയും ലക്ഷ്യദിശ സൂചിപ്പിക്കുന്ന ശമര്യ എന്ന രൂപവും കൃത്യമായി നൽകുന്നു.
