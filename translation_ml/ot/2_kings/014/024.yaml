  to: അവൻ യാഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു. യിസ്രായേലിനെ പാപം ചെയ്യിച്ച നെബാത്തിന്റെ മകൻ യൊരോബെയാമിന്റെ പാപങ്ങളിലൊന്നിൽനിന്നും അവൻ പിന്തിരിഞ്ഞില്ല.[a]
  rationale: 'മുഖ്യപാഠത്തിന്റെ അർഥവും ക്രമവും നിലനിർത്തി, ‘തിന്മയായത്’ എന്ന നിലവാരരൂപം സ്വീകരിച്ചു. അടിക്കുറിപ്പ് മാത്രം പുനരാഖ്യാനം ചെയ്തു: ഇപ്പോൾ അതിലെ ബദൽ ഉദ്ധരണം പാപകരമായ ആചാരങ്ങളുമായുള്ള ആശയപരമായ ബന്ധം യഥാർഥത്തിൽ പ്രകടമാക്കുകയും, മുഖ്യവായനയെ അനാവശ്യമായി ദുർബലപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.'
