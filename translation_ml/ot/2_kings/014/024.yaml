id: 2KI.14.24
reference: 2 Kings 14:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
translation:
  language: ml
  text: അവൻ യാഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു. യിസ്രായേലിനെ പാപം ചെയ്യിച്ച നെബാത്തിന്റെ മകൻ യൊരോബെയാമിന്റെ പാപങ്ങളിലൊന്നിൽനിന്നും അവൻ പിന്തിരിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, ബന്ധവാക്യത്തെ യൊരോബെയാം നടപ്പാക്കിയ പാപകരമായ ആചാരങ്ങളുമായി ബന്ധപ്പെടുത്തി: “യിസ്രായേലിനെ പാപം ചെയ്യാൻ ഇടയാക്കിയ നെബാത്തിന്റെ മകൻ യൊരോബെയാമിന്റെ പാപങ്ങളിലൊന്നിൽനിന്നും അവൻ പിന്തിരിഞ്ഞില്ല.”'
    reason: എബ്രായ ബന്ധവാക്യം വ്യാകരണപരമായി യൊരോബെയാമിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം; എങ്കിലും സന്ദർഭത്തിൽ അവൻ സ്ഥാപിച്ച പാപകരമായ ആചാരങ്ങളിലേക്കുള്ള ആശയപരമായ ബന്ധവും സാധ്യമാണ്.
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: അവൻ തിന്മയായതു ചെയ്തു
  rationale: עשה הרע എന്ന സ്ഥിരപ്രയോഗത്തിന്റെ ധാർമിക വിലയിരുത്തൽ നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യാഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; יהוה എന്ന വ്യക്തിനാമം ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: പാപങ്ങളിലൊന്നിൽനിന്നും അവൻ പിന്തിരിഞ്ഞില്ല
  rationale: നിഷേധവാക്യത്തിലെ מִכָּל എന്ന സമഗ്രത മലയാളത്തിൽ ‘ഒന്നിൽനിന്നും ... ഇല്ല’ എന്ന സ്വാഭാവിക ഘടനയിലൂടെ കൃത്യമായി പ്രകടമാക്കുന്നു.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകൻ യൊരോബെയാം
  rationale: പേരുകളും പിതൃബന്ധവും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: യിസ്രായേലിനെ പാപം ചെയ്യിച്ച
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണാർത്ഥം ‘പാപം ചെയ്യിച്ചു’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു; പ്രധാന പാഠത്തിൽ ബന്ധവാക്യം യൊരോബെയാമിനെ സൂചിപ്പിക്കുന്നതായി വായിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל എന്ന ബന്ധവാക്യത്തിന്റെ സൂചിതപദം
  choice: യൊരോബെയാമിനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ‘യിസ്രായേലിനെ പാപം ചെയ്യിച്ച’
  alternative: യൊരോബെയാമിന്റെ പാപങ്ങളെയോ ആചാരങ്ങളെയോ ഉപാധിയായി സൂചിപ്പിക്കുന്ന വായന
  rationale: എബ്രായത്തിലെ ഏകവചന ബന്ധസർവനാമം അടുത്തുള്ള യൊരോബെയാമിനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും പാപങ്ങളുമായി ബന്ധിപ്പിക്കുന്ന ആശയവായന സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൃഷ്ടിയിൽ’, ‘പിന്തിരിഞ്ഞില്ല’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ മൂലപാഠത്തിന്റെ ഔപചാരിക ഭാവവും നിലനിർത്തുന്നു.
