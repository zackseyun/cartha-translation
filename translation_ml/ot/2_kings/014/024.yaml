    rationale: അടിക്കുറിപ്പ് ബന്ധവാക്യം ‘പാപങ്ങളെയോ പാപകരമായ ആചാരങ്ങളെയോ’ സൂചിപ്പിക്കാമെന്നു പറയുന്നു; എന്നാൽ ഉദ്ധരണിയിലെ ‘യൊരോബെയാം യിസ്രായേലിനെക്കൊണ്ട് ചെയ്യിച്ച’ എന്നത് യൊരോബെയാമിനെത്തന്നെ കർത്താവാക്കുന്നു. അതിനാൽ ബദൽവായന വ്യക്തമായി, എബ്രായത്തിലെ വ്യാകരണപരമായ അനിശ്ചിതത്വത്തെ അതിരുകടക്കാതെ രേഖപ്പെടുത്തണം.
