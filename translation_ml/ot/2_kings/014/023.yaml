translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രാജവംശവിവരണശൈലി. രണ്ടു യോവാശുമാരെ തെറ്റിദ്ധരിക്കാതിരിക്കാൻ മൂലപാഠത്തിലെ ബന്ധങ്ങളും രാജപദവികളും പൂർണമായി നിലനിർത്തി. അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
