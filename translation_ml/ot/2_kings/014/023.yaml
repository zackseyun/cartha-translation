  yaml_path: translation/ot/2_kings/014/023.yaml
  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ യോവാശിന്റെ മകൻ അമസ്യാവിന്റെ വാഴ്ചയുടെ പതിനഞ്ചാം ആണ്ടിൽ, യിസ്രായേൽരാജാവായ യോവാശിന്റെ മകൻ യൊരോബെയാം ശമര്യയിൽ രാജാവായി; അവൻ നാല്പത്തൊന്ന് വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: വാഴ്ചയുടെ പതിനഞ്ചാം ആണ്ടിൽ
  rationale: രാജവാഴ്ചയുടെ വർഷം സൂചിപ്പിക്കുന്ന കാലനിർണയസൂത്രമാണിത്. സംഖ്യാരൂപം ഇവിടെ ദൈർഘ്യമല്ല, ക്രമസംഖ്യയായാണ് പ്രവർത്തിക്കുന്നത്; ആരുടെ പതിനഞ്ചാം ആണ്ടെന്നത് മലയാളത്തിൽ വ്യക്തമായി വരാൻ ‘വാഴ്ചയുടെ’ എന്നു ചേർത്തു.
- source_word: לַ/אֲמַצְיָהוּ
  choice: അമസ്യാവിന്റെ
  rationale: രാജാവിന്റെ വാഴ്ചാവർഷത്തെ ആധാരമാക്കുന്ന ל; മലയാളത്തിലെ സ്വാഭാവിക ഷഷ്ഠീവ്യാകരണരൂപത്തിൽ നൽകി.
- source_word: בֶן יוֹאָשׁ
  choice: യോവാശിന്റെ മകൻ
  rationale: പിതൃനാമസൂചകമായ സാധാരണ ഘടന നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ
  rationale: അമസ്യാവിന്റെ പദവിയും രാജ്യവും വ്യക്തമാക്കുന്ന സംയുക്തഘടന; മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: ഈ രാജാരോഹണവിവരണത്തിൽ ക്രിയ അധികാരമേറ്റ് രാജാവായതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്ന് വരുന്ന ഭരണകാലദൈർഘ്യത്തിൽനിന്ന് വേർതിരിച്ചുനിർത്തുന്നു.
- source_word: יָרָבְעָם
  choice: യൊരോബെയാം
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: യിസ്രായേൽരാജാവായ
  rationale: യോവാശിന്റെ പദവിയും രാജ്യവും വ്യക്തമാക്കുന്ന സംയുക്തഘടന സ്വാഭാവിക മലയാള വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: בְּ/שֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: സ്ഥലസൂചകമായ ב തലസ്ഥാനനഗരമായ ശമര്യയിലെ രാജാരോഹണം/ഭരണം സൂചിപ്പിക്കുന്നു.
- source_word: אַרְבָּעִים וְ/אַחַת שָׁנָה
  choice: നാല്പത്തൊന്ന് വർഷം
  rationale: ഭരണകാലത്തിന്റെ ദൈർഘ്യം സൂചിപ്പിക്കുന്ന സംഖ്യയും നാമവും ആധുനിക മലയാളരീതിയിൽ നൽകി.
