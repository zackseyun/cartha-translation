translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദൃഷ്ടാന്തത്തിലെ ആവർത്തനവും മുള്ളിച്ചെടി–ദേവദാരു വൈരുധ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്. ലളിതമായ എബ്രായ ബന്ധകത്തെ അനാവശ്യമായ വിരുദ്ധാർഥത്തോടെ അവതരിപ്പിക്കാതെ ‘അപ്പോൾ’ എന്ന ആഖ്യാനബന്ധം ഉപയോഗിച്ചു.
