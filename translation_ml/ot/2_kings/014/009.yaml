  text: וַ/יִּשְׁלַ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָה֮ לֵ/אמֹר֒ הַ/ח֜וֹחַ אֲשֶׁ֣ר בַּ/לְּבָנ֗וֹן שָׁ֠לַח אֶל הָ/אֶ֜רֶז אֲשֶׁ֤ר בַּ/לְּבָנוֹן֙ לֵ/אמֹ֔ר תְּנָֽ/ה אֶת בִּתְּ/ךָ֥ לִ/בְנִ֖/י לְ/אִשָּׁ֑ה וַֽ/תַּעֲבֹ֞ר חַיַּ֤ת הַ/שָּׂדֶה֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וַ/תִּרְמֹ֖ס אֶת הַ/חֽוֹחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: ml
  text: 'ഇസ്രായേൽ രാജാവായ യെഹോവാശ് യെഹൂദാ രാജാവായ അമസ്യാവിന് ഇങ്ങനെ സന്ദേശമയച്ചു: “ലെബാനോനിലെ മുള്ളിച്ചെടി[a] ലെബാനോനിലെ ദേവദാരുവിനോട്, ‘നിന്റെ മകളെ എന്റെ മകനു ഭാര്യയായി തരിക’ എന്ന് പറഞ്ഞയച്ചു. ലെബാനോനിലെ ഒരു കാട്ടുമൃഗം[b] അതുവഴി കടന്നുപോയി മുള്ളിച്ചെടിയെ ചവിട്ടിമെതിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുള്ളുള്ള കുറ്റിച്ചെടി’ അല്ലെങ്കിൽ ‘മുള്ളുപടർപ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉദ്ദേശിക്കുന്ന മുള്ളുചെടിയുടെ കൃത്യമായ ഇനം വ്യക്തമല്ല.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘വയലിലെ ഒരു മൃഗം’; അതായത്, ഒരു വന്യമൃഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לֵאמֹר
  choice: ഇങ്ങനെ സന്ദേശമയച്ചു
  rationale: ആഖ്യാനത്തിന്റെ തുടർച്ചയും തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളുടെ ആമുഖവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: הַחוֹחַ
  choice: മുള്ളിച്ചെടി
  rationale: കൃത്യമായ സസ്യവർഗം നിർണയിക്കാതെ, താഴ്ന്നതും മുള്ളുള്ളതുമായ ചെടിയും മഹത്തായ ദേവദാരുവും തമ്മിലുള്ള ദൃഷ്ടാന്തപരമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: הָאֶרֶז
  choice: ദേവദാരു
  rationale: ലെബാനോനുമായി ബന്ധപ്പെട്ട אֶרֶז എന്ന വൃക്ഷനാമത്തിന്റെ പ്രചാരത്തിലുള്ളതും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: בַּלְּבָנוֹן
  choice: ലെബാനോനിലെ
  rationale: സ്ഥലസൂചന സ്വാഭാവികമായി നൽകുകയും എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: നിന്റെ മകളെ എന്റെ മകനു ഭാര്യയായി തരിക
  rationale: വിവാഹബന്ധത്തിനായുള്ള അഭ്യർഥനയിലെ കുടുംബ-വിവാഹ ഭാഷ നേരിട്ടും വ്യക്തമായും സൂക്ഷിക്കുന്നു.
- source_word: חַיַּת הַשָּׂדֶה
  choice: ഒരു കാട്ടുമൃഗം
  rationale: അക്ഷരാർഥത്തിലെ ‘വയലിലെ മൃഗം’ ഇവിടെ വന്യമൃഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം സ്വീകരിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַתַּעֲבֹר
  choice: അതുവഴി കടന്നുപോയി
  rationale: മൃഗം വഴിയേ കടന്നുപോകുന്നതിനിടയിൽ ചെടിയെ മെതിക്കുന്ന ദൃശ്യത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַתִּרְמֹס
  choice: ചവിട്ടിമെതിച്ചു
  rationale: רמס എന്ന ക്രിയയുടെ ശക്തവും ദൃശ്യവുമായ അർഥം സംക്ഷിപ്തമായി പകരുന്നു.
