  variant: modern standard Malayalam
source:
  edition: WLC
  text: ה֚וּא בָּנָ֣ה אֶת אֵילַ֔ת וַ/יְשִׁבֶ֖/הָ לִֽ/יהוּדָ֑ה אַחֲרֵ֥י שְׁכַֽב הַ/מֶּ֖לֶךְ עִם אֲבֹתָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/022.yaml
  text: He rebuilt Elath and restored it to Judah after the king lay down with his fathers.
translation:
  language: ml
  text: രാജാവ് തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചശേഷം, അവൻ ഏലത്ത് പുനർനിർമിച്ച് അതിനെ യെഹൂദയുടെ അധീനതയിലേക്കു തിരികെ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: പുനർനിർമിച്ച്
  rationale: സാധാരണ അർഥം ‘പണിതു’ എന്നാണെങ്കിലും, മുമ്പുണ്ടായിരുന്ന ഏലത്ത് നഗരത്തെ വീണ്ടും സ്ഥാപിച്ചെന്ന ചരിത്രസന്ദർഭം പുനർനിർമാണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיְשִׁבֶהָ לִיהוּדָה
  choice: അതിനെ വീണ്ടും യെഹൂദയോടു ചേർത്തു
  rationale: ഹിഫീൽ രൂപം ‘തിരികെ കൊണ്ടുവന്നു/പുനഃസ്ഥാപിച്ചു’ എന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ പ്രദേശത്തെ യെഹൂദയുടെ അധീനതയിലേക്കു തിരിച്ചുചേർത്തത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שָׁכַב ... עִם־אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചശേഷം
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സ്ഥിരപ്രയോഗത്തിന്റെ ഗൗരവവും രൂപകസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: אֵילַת
  choice: ഏലത്ത്
  rationale: സ്ഥലനാമത്തിന്റെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: ‘പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു’ എന്ന മരണപ്രയോഗം
  choice: രൂപകപ്രയോഗം നിലനിർത്തി
  alternative: മരിച്ചശേഷം
  rationale: മൂലപാഠത്തിന്റെ പരമ്പരാഗത രൂപകവും അതിലെ സാധ്യതയുള്ള ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: വാക്യത്തിലെ ‘രാജാവ്’ ആരെന്ന സൂചന
  choice: മൂലപാഠത്തിലെപ്പോലെ ‘രാജാവ്’ എന്നു മാത്രം നൽകി
  alternative: അവന്റെ പിതാവായ രാജാവ് മരിച്ചശേഷം
  rationale: സന്ദർഭം തിരിച്ചറിയൽ സാധ്യമാക്കുന്നുവെങ്കിലും ഈ വാക്യം വ്യക്തിയുടെ പേര് നൽകുന്നില്ല; അതിനാൽ വ്യക്തതയ്ക്കായി പേര് ഇറക്കുമതി ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ വാക്യക്രമവും മരണത്തെക്കുറിച്ചുള്ള രൂപകവും സാധ്യമായത്ര നിലനിർത്തി; ‘വീണ്ടും ചേർത്തു’ എന്നത് രാഷ്ട്രീയ പുനഃസ്ഥാപനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
