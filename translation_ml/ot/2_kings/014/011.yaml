base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/011.yaml
  text: But Amaziah would not listen[a], so Jehoash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh[b], which belongs to Judah.
translation:
  language: ml
  text: എന്നാൽ അമസ്യാവ് അതു ചെവിക്കൊണ്ടില്ല[a]. അപ്പോൾ ഇസ്രായേലിന്റെ രാജാവായ യെഹോവാശ് കയറിച്ചെന്നു; അവനും യെഹൂദയുടെ രാജാവായ അമസ്യാവും യെഹൂദയുടേതായ ബേത്ത്-ശേമെശിൽ നേർക്കുനേർ കണ്ടുമുട്ടി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശ്രദ്ധിച്ചില്ല” / “അനുസരിച്ചില്ല.” എബ്രായ ക്രിയയ്ക്ക് വെറും കേൾവി മാത്രമല്ല, കേട്ടതിനനുസരിച്ച് പ്രതികരിക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അവർ മുഖങ്ങൾ കണ്ടു”; നേരിട്ടുള്ള അഭിമുഖീകരണത്തെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: ചെവിക്കൊണ്ടില്ല
  rationale: മുന്നറിയിപ്പ് കേൾക്കുക മാത്രമല്ല, അതനുസരിച്ച് പ്രതികരിക്കുക എന്ന ആശയവും ഈ സന്ദർഭത്തിൽ ക്രിയയ്ക്കുണ്ട്. ‘ചെവിക്കൊണ്ടില്ല’ എന്നത് അനുസരിക്കാതിരുന്നതിന്റെ ഭാവം നിലനിർത്തുന്നു; മേലധികാരിയുടെ കല്പന അനുസരിച്ചില്ല എന്നത്ര ശക്തമായ അർഥം ചുമത്തുന്നില്ല.
- source_word: וַיַּעַל
  choice: പുറപ്പെട്ടു
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കയറിപ്പോകുക’ എന്നാണ്; ഇവിടെ സൈനിക നീക്കം സന്ദർഭത്തിൽ വ്യക്തമാണ്. മലയാളത്തിൽ ‘കയറിച്ചെന്നു’ എന്നു പറഞ്ഞാൽ ഭൂപ്രകൃതിയെക്കുറിച്ച് അനാവശ്യമായ ഊന്നൽ വരാം; ‘പുറപ്പെട്ടു’ സ്വാഭാവികമായി നീക്കം സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: നേർക്കുനേർ ഏറ്റുമുട്ടി
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖങ്ങൾ കണ്ടു’ എന്ന പ്രയോഗം ഇവിടെ ഇരുരാജാക്കന്മാരുടെയും നേരിട്ടുള്ള സൈനിക അഭിമുഖീകരണത്തെ സൂചിപ്പിക്കുന്നു. ‘നേർക്കുനേർ ഏറ്റുമുട്ടി’ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בֵּית שֶׁמֶשׁ
  choice: ബേത്ത്-ശേമെശ്
  rationale: സ്ഥലനാമം അർഥം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: യെഹൂദയ്ക്കുള്ള
  rationale: പട്ടണം യെഹൂദയുടെ പ്രദേശാധികാരത്തിൽ ഉൾപ്പെട്ടിരുന്നുവെന്ന ബന്ധം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא
  choice: എന്നാൽ
  rationale: മുൻപത്തെ മുന്നറിയിപ്പിനോടുള്ള അമസ്യാവിന്റെ പ്രതികരണവിരുദ്ധത വാവ് ഇവിടെ സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ യോജിക്കുന്നു.
