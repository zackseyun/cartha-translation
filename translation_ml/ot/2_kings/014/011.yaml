translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജപദവികൾ പേരുകളോട് ചേർത്തു; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു. സൈനിക സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കിയെങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത യുദ്ധവിവരങ്ങൾ ചേർത്തിട്ടില്ല.
