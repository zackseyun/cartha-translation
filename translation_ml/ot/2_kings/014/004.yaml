source:
  edition: WLC
  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/004.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: ml
  text: എങ്കിലും, ഉന്നതസ്ഥലങ്ങൾ[a] നീക്കം ചെയ്യപ്പെട്ടില്ല; ജനം അപ്പോഴും ഉന്നതസ്ഥലങ്ങളിൽ[b] യാഗങ്ങൾ അർപ്പിക്കുകയും ധൂപം കാട്ടുകയും ചെയ്തുപോന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രാദേശിക ആരാധനാസ്ഥലങ്ങൾ.’ എബ്രായപദം പലപ്പോഴും ഉയർന്ന പ്രദേശങ്ങളിലുണ്ടായിരുന്ന പ്രാദേശിക ആരാധനാകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആ ഉന്നതസ്ഥലങ്ങളിൽ.’ ഇവിടെ എബ്രായ ഉപസർഗം സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: എങ്കിലും
  rationale: മുൻവാക്യത്തിലെ രാജാവിനെക്കുറിച്ചുള്ള അനുകൂല വിലയിരുത്തലിന് ഒരു പരിമിതി ചേർക്കുന്ന വിരുദ്ധാർഥബലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַבָּמוֹת
  choice: പൂജാഗിരികൾ
  rationale: ഉയർന്ന പ്രദേശങ്ങളിലായിരിക്കാവുന്ന പ്രാദേശിക ആരാധനാസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും സംക്ഷിപ്തവുമായ മലയാളപദം; വെറും ഭൂമിശാസ്ത്രപരമായ കുന്നുകൾ എന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: לֹא סָרוּ
  choice: നീക്കം ചെയ്യപ്പെട്ടില്ല
  rationale: പൂജാഗിരികൾ ഇല്ലാതാക്കപ്പെടുകയോ നിർത്തലാക്കപ്പെടുകയോ ചെയ്തില്ല എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: עוֹד
  choice: അപ്പോഴും
  rationale: ആരാധനാപ്രവർത്തനങ്ങൾ തുടർന്നുകൊണ്ടിരുന്നു എന്ന കാലപരമായ തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: מְזַבְּחִים
  choice: യാഗങ്ങൾ അർപ്പിക്കുകയും ... ചെയ്തുപോന്നു
  rationale: ഹീബ്രു കർത്തൃവാചകത്തിന്റെ പതിവായും തുടർച്ചയായും നടന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּמְקַטְּרִים
  choice: ധൂപം കത്തിക്കുകയും ... ചെയ്തുപോന്നു
  rationale: ആരാധനാസന്ദർഭത്തിൽ ധൂപം കത്തിക്കുന്ന പ്രവൃത്തിയാണ് ഏറ്റവും സാധ്യതയുള്ള അർഥം; മുൻക്രിയയോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: בַּבָּמוֹת
  choice: പൂജാഗിരികളിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ അധികരണവിഭക്തിയാൽ നൽകുന്നു.
theological_decisions:
- issue: പൂജാഗിരികളിലെ ആരാധനയുടെ വിലയിരുത്തൽ
  choice: പ്രധാനപാഠത്തിൽ ചരിത്രവിവരണാത്മകമായ ‘പൂജാഗിരികൾ’ എന്ന പദം നിലനിർത്തി.
  alternative: അനധികൃത ആരാധനാസ്ഥലങ്ങൾ
  rationale: വിശാലമായ ആവർത്തനപുസ്തകീയ പശ്ചാത്തലം ഈ ആരാധനയെ അംഗീകരിക്കുന്നില്ലെങ്കിലും, ഈ വാക്യത്തിൽ നേരിട്ട് പറയുന്നതിലധികമായ വിധിനിർണയം പരിഭാഷയിൽ ചേർക്കാതിരിക്കാൻ.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ചെയ്തുപോന്നു’ എന്ന പ്രയോഗം ഹീബ്രു കർത്തൃവാചകങ്ങൾ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പതിവുപ്രവൃത്തി പ്രകടിപ്പിക്കുന്നു.
