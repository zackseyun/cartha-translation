  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വ്യക്തതയും പുലർത്തുന്ന മലയാളം ഉപയോഗിച്ചു. രാജസദസ്സിലെ പുരാതന പദവിയെ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ അവതരിപ്പിച്ചെങ്കിലും അതിന്റെ പദശഃ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
