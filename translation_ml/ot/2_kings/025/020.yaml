  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֹתָ֔/ם נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים וַ/יֹּ֧לֶךְ אֹתָ֛/ם עַל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: ml
  text: രാജകാവൽസേനയുടെ തലവനായ നെബൂസരദാൻ[b] അവരെ എടുത്ത് രിബ്ലയിലുള്ള ബാബേൽരാജാവിന്റെ അടുക്കൽ കൊണ്ടുചെന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രിബ്ലയിലുള്ള ബാബേൽരാജാവിന്റെ സന്നിധിയിലേക്ക് അവരെ കൊണ്ടുചെന്നു.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ പദശഃ “കൊല്ലുന്നവരുടെ തലവൻ”; ഇത് രാജകീയ സൈനിക-സുരക്ഷാ ഉദ്യോഗപദവിയായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: തന്റെ കസ്റ്റഡിയിൽ എടുത്ത്
  rationale: לקח എന്ന സാധാരണ ക്രിയയ്ക്ക് ഇവിടെ ‘എടുത്തു’ എന്നാണ് അടിസ്ഥാനാർഥം. ഇവർ ഇതിനകം തടവുകാരായിരിക്കുന്ന സന്ദർഭത്തിൽ, ബലം പ്രയോഗിച്ചു പിടികൂടി എന്ന അധികധ്വനി ചേർക്കാതെ നെബൂസരദാൻ അവരെ തന്റെ അധികാരത്തിൽ ഏറ്റെടുത്തുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נְבוּזַרְאֲדָן
  choice: നെബൂസരദാൻ
  rationale: എബ്രായ രൂപത്തെ ആധാരമാക്കി വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: רַב טַבָּחִים
  choice: രാജകാവൽസേനയുടെ തലവൻ
  rationale: പദശഃ ‘കൊല്ലുന്നവരുടെ തലവൻ’ എന്നർഥമുള്ള ഈ പ്രയോഗം നവബാബിലോന്യ രാജസദസ്സിലെ സൈനിക-സുരക്ഷാ ഉദ്യോഗപദവിയെയാണ് സൂചിപ്പിക്കുന്നത്. പദശഃ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി, മുഖ്യവാചകത്തിൽ ചുമതല വ്യക്തമാകുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു.
- source_word: וַיֹּלֶךְ
  choice: കൊണ്ടുചെന്നു
  rationale: הלך എന്ന ക്രിയയുടെ കാരകപ്രയോഗമായ ഇവിടെ, നേരിട്ടുള്ള കർമവും ലക്ഷ്യസ്ഥാനവും ഉള്ളതിനാൽ ‘പോകാൻ ഇടയാക്കി’ എന്നതിനെ സ്വാഭാവികമായി ‘കൊണ്ടുചെന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עַל
  choice: അടുക്കൽ
  rationale: ചലനക്രിയയോടും രാജാവിനെ സൂചിപ്പിക്കുന്ന പദത്തോടും ചേർന്ന עַל, ഒരാളുടെ സന്നിധിയിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. ‘അടുക്കൽ’ ഈ അർഥം വ്യാഖ്യാനാതിരേകം കൂടാതെ സ്വാഭാവികമായി നൽകുന്നു; ‘സന്നിധിയിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവ്
  rationale: എബ്രായത്തിലെ സംയുക്തനാമഘടനയെ മലയാളത്തിലെ സ്വാഭാവിക ഏകപദപ്രയോഗമായി നൽകി.
- source_word: רִבְלָתָה
  choice: രിബ്ലയിൽ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാ/സ്ഥാനസൂചക രൂപം, രാജാവ് ഉണ്ടായിരുന്ന സ്ഥലം വ്യക്തമാക്കുന്ന വിധത്തിൽ ‘രിബ്ലയിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
