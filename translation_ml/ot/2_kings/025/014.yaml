translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കത്തക്കവിധം, ക്ഷേത്രോപകരണങ്ങളുടെ പട്ടികയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി പാലിച്ചു. പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യഘടനയ്ക്കനുസരിച്ച് ക്രമപ്പെടുത്തി; മൂലത്തിലെ ഉപകരണപദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
