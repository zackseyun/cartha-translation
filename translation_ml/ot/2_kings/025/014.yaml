  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
translation:
  language: ml
  text: കലങ്ങളും ചാരുകോരികളും തിരിവെട്ടാനുള്ള കത്രികകളും[a] തളികകളും ശുശ്രൂഷയ്ക്കായി ഉപയോഗിച്ചിരുന്ന വെങ്കലോപകരണങ്ങളെല്ലാം അവർ എടുത്തുകൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കത്തികൾ’ എന്നോ ‘കൊമ്പുവെട്ടുകത്തികൾ’ എന്നോ ആകാം. എബ്രായപദം വെട്ടാനുള്ള ഒരു ഉപകരണത്തെ സൂചിപ്പിക്കാം; എന്നാൽ ക്ഷേത്രോപകരണങ്ങളുടെ ഈ സന്ദർഭത്തിൽ വിളക്കുതിരി വെട്ടിയൊരുക്കാനുള്ള ഉപകരണമെന്നാണ് സാധാരണയായി മനസ്സിലാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  choice: കലങ്ങൾ
  rationale: സִירוֹת എന്നത് സാധാരണയായി കലങ്ങളെയോ പാത്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ക്ഷേത്രോപകരണങ്ങളുടെ പട്ടികയിൽ ‘കലങ്ങൾ’ സ്വാഭാവികവും അതിരുകടന്ന് പ്രത്യേകീകരിക്കാത്തതുമായ പരിഭാഷയാണ്.
- source_word: הַיָּעִים
  choice: ചാരുകോരികൾ
  rationale: יָעִים ചാരമോ കനലോ നീക്കാനുള്ള കോരുപകരണങ്ങളാണ്; ക്ഷേത്രശുശ്രൂഷയുടെ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘ചാരുകോരികൾ’ യോജിക്കുന്നു.
- source_word: הַמְזַמְּרוֹת
  choice: തിരിവെട്ടുകത്രികകൾ
  rationale: ഈ പദം പൊതുവിൽ വെട്ടാനുള്ള ഉപകരണത്തെ സൂചിപ്പിക്കാമെങ്കിലും ക്ഷേത്രോപകരണങ്ങളുടെ പട്ടികയിൽ വിളക്കുതിരി വെട്ടിയൊരുക്കാനുള്ള ഉപകരണങ്ങളെന്ന പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥമാണ് പ്രധാനമായും സ്വീകരിച്ചത്; മൂലത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַכַּפּוֹת
  choice: തളികകൾ
  rationale: כַּף ചെറിയ പാത്രം, തളിക, ചട്ടിപോലുള്ള ഉപകരണം എന്നിവയെ സൂചിപ്പിക്കാം; ആകൃതി അനാവശ്യമായി നിർണയിക്കാതെ വായനാസൗകര്യം നൽകുന്ന പദമാണ് ‘തളികകൾ’.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: വെങ്കലോപകരണങ്ങളെല്ലാം
  rationale: כְּלִים എന്ന വിശാലപദത്തിന് പട്ടികയുടെ പശ്ചാത്തലത്തിൽ ‘ഉപകരണങ്ങൾ’ അനുയോജ്യമാണ്; נְחֹשֶׁת ഇവിടെ ‘വെങ്കലം’ എന്നാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: ശുശ്രൂഷയ്ക്കായി ഉപയോഗിച്ചിരുന്ന
  rationale: שרת ആരാധനാലയത്തിലെ ഔദ്യോഗിക സേവനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ നിർവചിക്കാത്ത ‘അവർ’ എന്ന കർത്താവിനെ ആവർത്തിക്കാതെ ഉപകരണങ്ങളുടെ ആരാധനാപരമായ ഉപയോഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לָקָחוּ
  choice: അവർ എടുത്തുകൊണ്ടുപോയി
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുത്തു’ എന്നാണെങ്കിലും ക്ഷേത്രോപകരണങ്ങൾ കൊള്ളയടിച്ചു നീക്കിയ സന്ദർഭത്തിൽ ‘എടുത്തുകൊണ്ടുപോയി’ ഉദ്ദേശിച്ച നീക്കം വ്യക്തമായി നൽകുന്നു.
