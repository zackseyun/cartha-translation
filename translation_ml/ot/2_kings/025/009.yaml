  text: וַ/יִּשְׂרֹ֥ף אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל בָּתֵּ֧י יְרוּשָׁלִַ֛ם וְ/אֶת כָּל בֵּ֥ית גָּד֖וֹל שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/009.yaml
  text: He burned the house of Yahweh[a], the king's house, all the houses of Jerusalem[b], and every great house with fire.
translation:
  language: ml
  text: അവൻ യഹ്‌വേയുടെ ഭവനവും[a] രാജാവിന്റെ ഭവനവും യെരൂശലേമിലെ എല്ലാ വീടുകളും എല്ലാ വലിയ വീടുകളും[b] തീകൊണ്ടു ചുട്ടുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ “യഹ്‌വേയുടെ ആലയം.” എബ്രായത്തിൽ അക്ഷരാർഥം: “യഹ്‌വേയുടെ ഭവനം.”'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “പ്രധാനപ്പെട്ട എല്ലാ വീടുകളും.” എബ്രായപ്രയോഗം വലിപ്പംകൊണ്ടോ പ്രാധാന്യംകൊണ്ടോ ശ്രദ്ധേയമായ വീടുകളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: അവൻ … ചുട്ടുകളഞ്ഞു
  rationale: שׂרף എന്ന ക്രിയയുടെ ഖാൽ വയ്യിഖ്തോൽ രൂപം തുടർന്നുള്ള ആഖ്യാനപ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കായി ആദ്യത്തെ וַ സ്വതന്ത്രമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ഭവനം
  rationale: ‘യഹ്‌വേയുടെ വീട്/ഭവനം’ എന്ന എബ്രായപ്രയോഗത്തെ നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ‘ആലയം’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജാവിന്റെ ഭവനം
  rationale: ‘രാജാവിന്റെ വീട്’ എന്ന മൂലപ്രയോഗം നിലനിർത്തുകയും മുമ്പുള്ള ‘യഹ്‌വേയുടെ ഭവനം’ എന്നതിനോടുള്ള സമാന്തരത സംരക്ഷിക്കുകയും ചെയ്യുന്നു; സന്ദർഭത്തിൽ ഇത് രാജകൊട്ടാരമാണ്.
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: യെരൂശലേമിലെ എല്ലാ വീടുകളും
  rationale: എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל בֵּית גָּדוֹל
  choice: വലുതായ എല്ലാ വീടുകളും
  rationale: כָּל-നുശേഷമുള്ള ഏകവചനത്തെ മലയാളത്തിൽ വിതരണാർഥമുള്ള ബഹുവചനമായി അവതരിപ്പിക്കുന്നു. גָּדוֹל വലിപ്പത്തെയോ പ്രാധാന്യത്തെയോ സൂചിപ്പിക്കാം; ആ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: שָׂרַף בָּאֵשׁ
  choice: തീകൊണ്ടു ചുട്ടുകളഞ്ഞു
  rationale: അവസാനത്തെ ക്രിയയും ഉപസർഗപ്രയോഗവും കത്തിച്ച പ്രവൃത്തിയെ ഊന്നിപ്പറയുന്നു; ‘തീകൊണ്ടു ചുട്ടുകളഞ്ഞു’ ഈ ആവർത്തനഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനനാമത്തിലൂടെ മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഭവനം’ എന്ന പദം എബ്രായത്തിലെ ആവർത്തിതമായ בֵּית എന്ന പദവും വാക്യത്തിലെ സമാന്തരതയും നിലനിർത്തുന്നു; സാധാരണ വായനക്കാർക്കുള്ള സന്ദർഭാർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
