  yaml_path: translation/ot/2_kings/025/005.yaml
  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: ml
  text: എന്നാൽ കൽദയരുടെ[a] സൈന്യം രാജാവിനെ പിന്തുടർന്ന് യെരീഹോയുടെ സമതലങ്ങളിൽവെച്ച്[b] അവനെ എത്തിപ്പിടിച്ചു; അവന്റെ സൈന്യമെല്ലാം അവനെ വിട്ട് ചിതറിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബാബിലോന്യരുടെ സൈന്യം.’ എബ്രായത്തിൽ ‘കൽദയരുടെ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യെരീഹോയുടെ സ്റ്റെപ്പുകളിൽവെച്ച്’ അല്ലെങ്കിൽ ‘യെരീഹോയുടെ മരുഭൂസമതലങ്ങളിൽവെച്ച്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: കൽദയരുടെ സൈന്യം
  rationale: חֵיל ഇവിടെ സൈനികശക്തിയെയോ സൈന്യത്തെയോ സൂചിപ്പിക്കുന്നു; כַּשְׂדִּים എന്ന എബ്രായ വംശ-രാഷ്ട്രീയ നാമം ‘കൽദയർ’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיִּרְדְּפוּ אַחַר הַמֶּלֶךְ
  choice: രാജാവിനെ പിന്തുടർന്ന്
  rationale: רדף എന്ന സൈനികസന്ദർഭത്തിലെ സജീവമായ പിന്തുടരൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; אַחַר എന്നതിന്റെ ആശയം ക്രിയയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  choice: അവനെ പിടികൂടി
  rationale: נשׂג ഇവിടെ പിന്തുടർന്ന് എത്തിപ്പിടിക്കുക എന്നർഥം നൽകുന്നു; ‘പിടികൂടി’ മലയാളത്തിൽ സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: യെരീഹോയുടെ സമതലങ്ങളിൽവെച്ച്
  rationale: עֲרָבוֹת സമതലമോ വരണ്ട പുൽമേടോ സൂചിപ്പിക്കാം; വായനാസൗകര്യത്തിനായി ‘സമതലങ്ങൾ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְכָל חֵילוֹ נָפֹצוּ מֵעָלָיו
  choice: അവന്റെ സൈന്യമെല്ലാം അവനെ വിട്ട് ചിതറിപ്പോയി
  rationale: ബഹുവചന ക്രിയയായ נָפֹצוּ സൈനികർ കൂട്ടമായി പിരിഞ്ഞുപോയതിനെ സൂചിപ്പിക്കുന്നു; מֵעָלָיו രാജാവിൽനിന്നുള്ള വേർപാട് പ്രകടമാക്കുന്നതിനാൽ ‘അവനെ വിട്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
