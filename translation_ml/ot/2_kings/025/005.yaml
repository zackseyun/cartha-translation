  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കൽദയർ’ എന്ന മൂലപാഠത്തിലെ പേരിനെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി. വാക്യത്തിലെ പിന്തുടരൽ, പിടികൂടൽ, സൈന്യത്തിന്റെ ചിതറിപ്പോകൽ എന്നീ പ്രവർത്തനങ്ങളുടെ ക്രമം സംരക്ഷിച്ചു.
