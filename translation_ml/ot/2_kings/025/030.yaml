source:
  edition: WLC
  text: וַ/אֲרֻחָת֗/וֹ אֲרֻחַ֨ת תָּמִ֧יד נִתְּנָה לּ֛/וֹ מֵ/אֵ֥ת הַ/מֶּ֖לֶךְ דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ כֹּ֖ל יְמֵ֥י חַיָּֽ/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/030.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king, the portion for each day on its day[b], all the days of his life.
translation:
  language: ml
  text: 'അവന്റെ വിഹിതം[a]—തുടർച്ചയായ വിഹിതം—രാജാവിൽനിന്ന് അവന് നൽകപ്പെട്ടു: ഓരോ ദിവസത്തെയും വിഹിതം അതതു ദിവസം[b], അവന്റെ ജീവിതകാലം മുഴുവൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭക്ഷണവിഹിതം,’ ‘ഓഹരി,’ അല്ലെങ്കിൽ ‘ഉപജീവനസഹായം.’ എബ്രായപദം അവനുവേണ്ടി നിശ്ചയിച്ചു നൽകിയ വിഭവത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു ദിവസത്തിന്റെ കാര്യം അതിന്റെ ദിവസത്തിൽ.’ ഓരോ ദിവസത്തേക്കും നിശ്ചയിച്ച വിഹിതം അതതു ദിവസം നൽകിയിരുന്നു എന്നർഥമുള്ള എബ്രായ ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: വിഹിതം
  rationale: രാജാവ് നിശ്ചയിച്ചു നൽകുന്ന ഉപജീവനസഹായമോ ഭക്ഷണവിഹിതമോ എന്ന ആശയം സൂചിപ്പിക്കുന്നു. ‘വിഹിതം’ അനുവദിച്ചുകൊടുക്കുന്ന നിശ്ചിത ഭാഗം എന്ന അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: תָּמִיד
  choice: തുടർച്ചയായ
  rationale: വിഹിതം ഇടവിടാതെ തുടർന്നിരുന്നുവെന്ന ആശയം നേരിട്ട് നൽകുന്നു.
- source_word: נִתְּנָה
  choice: ലഭിച്ചു / ലഭിച്ചുകൊണ്ടിരുന്നു
  rationale: എബ്രായത്തിലെ ‘നൽകപ്പെട്ടു’ എന്ന കർമണിപ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അവസാനത്തെ ആവർത്തനം ആജീവനാന്തമായ തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: രാജാവിൽനിന്ന്
  rationale: വിഹിതത്തിന്റെ ഉറവിടം രാജാവാണെന്ന മൂലപാഠത്തിലെ ആശയം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ഓരോ ദിവസത്തേക്കുള്ള ഓഹരി അതതു ദിവസംതോറും
  rationale: ‘ഒരു ദിവസത്തിന്റെ കാര്യം അതിന്റെ ദിവസത്തിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിതരണാത്മക അർഥം സംരക്ഷിക്കുമ്പോൾ, ദിവസേന അതതു വിഹിതം നൽകിയെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּל יְמֵי חַיָּו
  choice: അവന്റെ ആയുഷ്കാലമൊക്കെയും
  rationale: അവന്റെ ജീവിതകാലം മുഴുവനും എന്ന കാലദൈർഘ്യം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
