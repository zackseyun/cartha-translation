  text: And the firepans and the bowls—what was gold[d][c][b][a], and what was silver—the captain of the guard took.
translation:
  language: ml
  text: തീക്കനൽപാത്രങ്ങളും[a] കിണ്ണങ്ങളും[b]—പൊന്നായിരുന്നതു പൊന്നും വെള്ളിയായിരുന്നതു വെള്ളിയും[c]—അംഗരക്ഷകരുടെ തലവൻ[d] എടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ധൂപപാത്രങ്ങളും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തളിക്കുപാത്രങ്ങളും.”
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായത്തിൽ ലോഹങ്ങളുടെ പേരുകൾ ആവർത്തിക്കുന്നു: “പൊന്നായിരുന്നതു പൊന്ന്; വെള്ളിയായിരുന്നതു വെള്ളി.” വസ്തുക്കളെ അവയുടെ ലോഹമനുസരിച്ച് തരംതിരിക്കുന്നതിനു ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, “വധകരുടെ തലവൻ”; “രാജാവിന്റെ അംഗരക്ഷകരുടെ അധിപൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתּוֹת
  choice: തീക്കനലെടുക്കുന്ന പാത്രങ്ങൾ
  rationale: ക്ഷേത്രശുശ്രൂഷയിൽ തീക്കനലോ ധൂപമോ കൈകാര്യം ചെയ്യാൻ ഉപയോഗിച്ച പാത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ധൂപത്തിന്റെ ഉപയോഗം മാത്രം നിശ്ചയിക്കാതെ വസ്തുവിന്റെ പ്രാഥമിക പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: הַמִּזְרָקוֹת
  choice: കലശങ്ങൾ
  rationale: യാഗദ്രവ്യം സൂക്ഷിക്കാനോ തളിക്കാനോ ഉപയോഗിച്ച പാത്രങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപദം.
- source_word: אֲשֶׁר זָהָב זָהָב ... וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: പൊന്നുകൊണ്ടുള്ളവ പൊന്നായും വെള്ളികൊണ്ടുള്ളവ വെള്ളിയായും
  rationale: വസ്തുക്കളെ അവയുടെ ലോഹമനുസരിച്ച് തരംതിരിക്കുന്ന എബ്രായ ആവർത്തനം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
- source_word: לָקַח
  choice: എടുത്തുകൊണ്ടുപോയി
  rationale: അടിസ്ഥാന അർഥമായ ‘എടുത്തു’ എന്നതും കൊള്ളയായി കൊണ്ടുപോയ സന്ദർഭവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: רַב טַבָּחִים
  choice: അംഗരക്ഷകസേനാധിപൻ
  rationale: ബാബിലോന്യ രാജകീയ ഉദ്യോഗസ്ഥന്റെ ഔദ്യോഗിക പദവിയെ സന്ദർഭോചിതമായി നൽകുന്നു; പദത്തിന്റെ അക്ഷരാർഥവുമായി ബന്ധപ്പെട്ട മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
