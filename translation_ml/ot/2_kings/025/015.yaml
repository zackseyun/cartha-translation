  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ശൈലി. എബ്രായത്തിലെ ലോഹനാമങ്ങളുടെ ആവർത്തനവും വർഗീകരണഭാവവും അസ്വാഭാവികമായ പദാനുപദരൂപമാക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
