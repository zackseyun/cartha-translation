  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
translation:
  language: ml
  text: നഗരത്തിൽനിന്ന് അവൻ ഒരുദ്യോഗസ്ഥനെ[a] പിടിച്ചുകൊണ്ടുപോയി; അയാൾ യോദ്ധാക്കളുടെ മേൽനോട്ടം വഹിക്കാൻ നിയമിക്കപ്പെട്ടവനായിരുന്നു. നഗരത്തിൽ കണ്ടെത്തിയ, രാജാവിന്റെ മുഖം കാണുന്നവരിൽപ്പെട്ട അഞ്ചുപേരെയും[b], ദേശത്തിലെ ജനങ്ങളെ സൈനികസേവനത്തിനായി അണിനിരത്തിയിരുന്ന സൈനികമേധാവിയായ ലേഖകനെയും[c], നഗരത്തിൽ കണ്ടെത്തിയ ദേശത്തിലെ ജനങ്ങളിൽപ്പെട്ട അറുപതുപേരെയും അവൻ പിടിച്ചുകൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഷണ്ഡൻ.” എബ്രായപദം അക്ഷരാർഥത്തിൽ ഷണ്ഡനെയോ പൊതുവായി ഒരു രാജകീയ ഉദ്യോഗസ്ഥനെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: “രാജാവിന്റെ മുഖം കാണുന്നവർ” എന്നത് രാജാവിനെ നേരിട്ട് സമീപിക്കാൻ അനുവാദമുണ്ടായിരുന്ന കൊട്ടാരവൃത്തരെയോ പരിചാരകരെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: 'അല്ലെങ്കിൽ: “ദേശത്തിലെ ജനങ്ങളെ സൈനികസേവനത്തിനായി രജിസ്റ്റർ ചെയ്തിരുന്ന” അഥവാ “സൈന്യത്തിലേക്ക് ചേർത്തിരുന്ന.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: ഉദ്യോഗസ്ഥൻ
  rationale: ഈ പദത്തിന് അക്ഷരാർഥത്തിൽ ഷണ്ഡൻ എന്നും രാജകീയമോ ഭരണപരമോ ആയ ഉദ്യോഗസ്ഥൻ എന്നും അർഥമാകാം. ഇവിടെ ശാരീരികസ്ഥിതി ഉറപ്പിക്കാതെ ചുമതലയെ സൂചിപ്പിക്കുന്ന പൊതുവായ പദം സ്വീകരിച്ചു; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: യോദ്ധാക്കളുടെ മേൽനോട്ടം വഹിക്കാൻ നിയമിക്കപ്പെട്ടവൻ
  rationale: നിയമിക്കപ്പെട്ട ചുമതലയും സൈനികരിന്മേലുള്ള അധികാരവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ മുഖം കാണുന്നവർ
  rationale: രാജാവിനെ നേരിൽ സമീപിക്കാൻ അവകാശമുള്ള കൊട്ടാരവൃത്തരെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു; സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: הַסֹּפֵר שַׂר הַצָּבָא
  choice: സൈനികമേധാവിയായ ലേഖകൻ
  rationale: സംക്ഷിപ്തമായ എബ്രായ ഘടനയിലെ രണ്ടു പദവികളും ദൃശ്യമാക്കുന്നു. 'ലേഖകൻ' എന്നത് സൈനിക ഭരണകാര്യങ്ങളുമായി ബന്ധപ്പെട്ട ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കാം.
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: ദേശത്തിലെ ജനങ്ങളെ സൈനികസേവനത്തിനായി അണിനിരത്തിയിരുന്ന
  rationale: צָבָא എന്ന ധാതുവിന്റെ സൈനികമായി വിളിച്ചുകൂട്ടുക, രജിസ്റ്റർ ചെയ്യുക, അണിനിരത്തുക എന്നീ സാധ്യതകളെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; നിർബന്ധിത റിക്രൂട്ട്മെന്റ് എന്നു അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: עַם הָאָרֶץ
  choice: ദേശത്തിലെ ജനങ്ങൾ
  rationale: ജനസമൂഹത്തെയോ ചിലപ്പോൾ സാധാരണ പൗരജനത്തെയോ സൂചിപ്പിക്കാവുന്ന പ്രയോഗത്തിന്റെ സാമൂഹിക അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: נִמְצְאוּ / הַנִּמְצְאִים
  choice: കണ്ടെത്തിയ
  rationale: നഗരത്തിന്റെ വീഴ്ചയ്ക്കുശേഷം അവിടെ കണ്ടെത്തപ്പെട്ടവരെന്ന നിഷ്ക്രിയ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָקַח
  choice: പിടിച്ചുകൊണ്ടുപോയി
  rationale: സന്ദർഭത്തിൽ ഇവരെ തടവുകാരായി നഗരത്തിൽനിന്ന് കൊണ്ടുപോകുന്നതാണ്. വെറും 'എടുത്തു' എന്നതിനെക്കാൾ ഈ വിവർത്തനം മലയാളത്തിൽ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; കൊന്നു എന്നോ പ്രത്യേകമായ ബലം പ്രയോഗിച്ചു എന്നോ ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. നീണ്ട എബ്രായ പട്ടിക വായിക്കാൻ എളുപ്പമാക്കാൻ അർധവിരാമവും ആവർത്തിച്ച മുഖ്യക്രിയയും ഉപയോഗിച്ചു. രാജസഭാ പ്രയോഗവും പദങ്ങളുടെ യഥാർഥ അവ്യക്തതയും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
