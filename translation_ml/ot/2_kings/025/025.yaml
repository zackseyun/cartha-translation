  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְ֠תַנְיָה בֶּן אֱלִ֨ישָׁמָ֜ע מִ/זֶּ֣רַע הַ/מְּלוּכָ֗ה וַ/עֲשָׂרָ֤ה אֲנָשִׁים֙ אִתּ֔/וֹ וַ/יַּכּ֥וּ אֶת גְּדַלְיָ֖הוּ וַ/יָּמֹ֑ת וְ/אֶת הַ/יְּהוּדִים֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים אֲשֶׁר הָי֥וּ אִתּ֖/וֹ בַּ/מִּצְפָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
translation:
  language: ml
  text: ഏഴാം മാസത്തിൽ രാജവംശത്തിൽപ്പെട്ടവനായ[a] എലീശാമായുടെ മകൻ നെഥന്യാവിന്റെ മകൻ യിശ്മായേൽ പത്തു പുരുഷന്മാരോടൊപ്പം വന്നു. അവർ ഗെദല്യാവിനെ പ്രഹരിച്ചു; അവൻ മരിച്ചു. മിസ്പയിൽ അവനോടൊപ്പം ഉണ്ടായിരുന്ന യെഹൂദ്യരെയും കൽദയരെയും[b] അവർ പ്രഹരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “രാജകീയ സന്തതിയിൽനിന്നുള്ളവൻ.” അതായത്, യിശ്മായേൽ രാജകുടുംബത്തിന്റെ വംശപരമ്പരയിൽപ്പെട്ടവനായിരുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ഈ സന്ദർഭത്തിൽ “കൽദയർ” എന്നത് “ബാബിലോന്യർ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ഏഴാം മാസത്തിൽ
  rationale: ഹീബ്രായ ആഖ്യാനാരംഭമായ וַיְהִי വേറിട്ട് പരിഭാഷപ്പെടുത്താതെ, സ്വാഭാവികമായ മലയാള കാലസൂചനയിലൂടെ പുതിയ സംഭവം ആരംഭിക്കുന്നു.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: രാജവംശത്തിൽപ്പെട്ടവനായ
  rationale: അക്ഷരാർഥത്തിലെ ‘രാജകീയ വിത്ത്/സന്തതി’ എന്ന വംശപരമ്പരാസൂചന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: പത്തു പുരുഷന്മാരോടുകൂടെ
  rationale: ഇശ്മായേലിനൊപ്പമുള്ള സംഘത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ചലനക്രിയയോട് ചേർക്കുന്നു.
- source_word: וַיַּכּוּ
  choice: വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ ഹിംസാത്മകമായ ‘അടിച്ചുവീഴ്ത്തുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘കൊന്നു’ എന്നു മാത്രം പറഞ്ഞ് തുടർന്നുള്ള ‘അവൻ മരിച്ചു’ എന്ന വ്യത്യസ്ത ക്രിയയെ ലയിപ്പിക്കുന്നില്ല.
- source_word: וַיָּמֹת
  choice: അവൻ മരിച്ചു
  rationale: ഏകവചനക്രിയയുടെ സ്വാഭാവിക സൂച്യം ഗെദല്യാവാണ്; ഹീബ്രായത്തിലെ പ്രവർത്തനവും മരണവും എന്ന ക്രമം നിലനിർത്തുന്നു.
- source_word: הַיְּהוּדִים
  choice: യെഹൂദ്യർ
  rationale: രാജത്വകാല/പ്രവാസകാല ചരിത്രസന്ദർഭത്തിൽ യെഹൂദാ ദേശത്തെയോ ജനവിഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: הַכַּשְׂדִּים
  choice: കൽദയർ
  rationale: ഹീബ്രായ ജനനാമം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ബാബിലോന്യരെ സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בַּמִּצְפָּה
  choice: മിസ്പായിൽ
  rationale: സ്ഥലനാമത്തോടുള്ള ഹീബ്രായ സ്ഥാനസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
