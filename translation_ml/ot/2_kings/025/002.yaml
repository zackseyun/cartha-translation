translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഉപരോധത്തിലായിരുന്നു’ എന്ന പ്രയോഗം മൂലത്തിലെ ശൈലിയുടെ അവസ്ഥാസൂചന സ്വാഭാവികമായി പകരുന്നു; ‘ആണ്ട്’ രാജഭരണകാല നിർണ്ണയത്തിന് യോജിച്ച ബൈബിൾ-സാഹിത്യ രജിസ്റ്റർ നിലനിർത്തുന്നു.
