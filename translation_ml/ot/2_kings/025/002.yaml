source:
  edition: WLC
  text: וַ/תָּבֹ֥א הָ/עִ֖יר בַּ/מָּצ֑וֹר עַ֚ד עַשְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ צִדְקִיָּֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/002.yaml
  text: So the city remained under siege until the eleventh year of King Zedekiah[a].
translation:
  language: ml
  text: അങ്ങനെ സിദെക്കീയാ രാജാവിന്റെ പതിനൊന്നാം വർഷംവരെ നഗരം ഉപരോധത്തിലായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നഗരം ഉപരോധത്തിൽ വന്നു’; നഗരം ഉപരോധാവസ്ഥയിലായിരുന്നു എന്ന് അർഥമാക്കുന്ന ഒരു എബ്രായ ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: ആയിരുന്നു
  rationale: בוא എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘വന്നു/പ്രവേശിച്ചു’ എന്നാണെങ്കിലും, ഇവിടെ ‘നഗരം ഉപരോധത്തിൽ വന്നു’ എന്ന എബ്രായ പ്രയോഗം തുടർന്നുനിന്ന ഉപരോധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഉപരോധത്തിലായിരുന്നു’ എന്നത് ആ അവസ്ഥ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הָעִיר
  choice: നഗരം
  rationale: നിശ്ചയാർഥക ഘടകത്തോടുകൂടിയ עִיר എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ വിവർത്തനം.
- source_word: בַּמָּצוֹר
  choice: ഉപരോധത്തിൽ
  rationale: מָצוֹר ഉപരോധത്തെയോ ഉപരോധാവസ്ഥയെയോ സൂചിപ്പിക്കുന്നു; בוא-യോടുചേർന്ന ഈ പ്രയോഗത്തിൽ ‘ഉപരോധത്തിലായിരുന്നു’ എന്നതാണ് സ്വാഭാവിക മലയാളം.
- source_word: עַד
  choice: വരെ
  rationale: ഉപരോധാവസ്ഥയുടെ കാലപരമായ അവസാനപരിധി സൂചിപ്പിക്കുന്നു.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: പതിനൊന്നാം ആണ്ട്
  rationale: രാജഭരണകാലം കണക്കാക്കുന്ന ഈ പ്രയോഗത്തിലെ പതിനൊന്ന് എന്ന സംഖ്യ മലയാളത്തിൽ ക്രമസംഖ്യയായി നൽകുന്നതാണ് സ്വാഭാവികം.
- source_word: לַמֶּלֶךְ
  choice: രാജാവിന്റെ
  rationale: രാജവാഴ്ചയുടെ വർഷം സൂചിപ്പിക്കുന്ന לַמֶּלֶךְ എന്ന പ്രയോഗം മലയാളത്തിൽ ഉടമസ്ഥാവിഭക്തിയാൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: צִדְקִיָּהוּ
  choice: സിദെക്കീയാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
