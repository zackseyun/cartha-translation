translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ഒരേ പ്രവൃത്തിശൃംഖലയിലെ രണ്ടു ഹീബ്രായക്രിയകളുടെ വ്യത്യാസം നിലനിർത്തി. ‘യെഹൂദാ’ എന്ന നാമം ദേശം/ജനം എന്ന മൂലപാഠത്തിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
