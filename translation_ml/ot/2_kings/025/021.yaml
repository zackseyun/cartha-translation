  text: וַ/יַּ֣ךְ אֹתָ/ם֩ מֶ֨לֶךְ בָּבֶ֧ל וַ/יְמִיתֵ֛/ם בְּ/רִבְלָ֖ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יִּ֥גֶל יְהוּדָ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
translation:
  language: ml
  text: ബാബേൽരാജാവ് ഹമാത്ത് ദേശത്തിലെ രിബ്‌ലയിൽ അവരെ അടിച്ചുവീഴ്ത്തി കൊന്നു.[a] അങ്ങനെ യെഹൂദാ സ്വന്തം ദേശത്തുനിന്ന് പ്രവാസത്തിലേക്കു കൊണ്ടുപോകപ്പെട്ടു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ കൊന്നു.” ഹീബ്രായയിൽ “അടിച്ചു” എന്നും “കൊന്നു” എന്നും അർഥമുള്ള രണ്ടു ക്രിയകൾ തുടർച്ചയായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യെഹൂദാ സ്വന്തം ദേശത്തുനിന്ന് പ്രവാസത്തിലേക്കു പോയി.” സന്ദർഭത്തിൽ ഹീബ്രായക്രിയ സജീവമായോ കർമണിയായോ പരിഭാഷപ്പെടുത്താം; കർമണിപ്രയോഗം നിർബന്ധിത നാടുകടത്തലിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: അവരെ അടിച്ചുവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന അർഥം നിലനിർത്തുകയും, തുടർന്നുള്ള ‘കൊന്നുകളഞ്ഞു’ എന്ന ക്രിയയുമായി ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְמִיתֵם
  choice: കൊന്നുകളഞ്ഞു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘മരണത്തിനിടയാക്കുക/കൊല്ലുക’ എന്ന കാരകാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വധശിക്ഷ നടപ്പാക്കി’ എന്നത് സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവ്
  rationale: ഹീബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ അർഥം സംക്ഷിപ്തവും മലയാളത്തിൽ സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּרִבְלָה
  choice: രിബ്‌ലയിൽവെച്ച്
  rationale: സംഭവം നടന്ന സ്ഥലത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בְּאֶרֶץ חֲמָת
  choice: ഹമാത്ത് ദേശത്തിലെ
  rationale: ഭൂമിശാസ്ത്രപരമായ ബന്ധം നേരിട്ടും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: וַיִּגֶל
  choice: പ്രവാസത്തിലേക്കു കൊണ്ടുപോകപ്പെട്ടു
  rationale: പ്രവാസസന്ദർഭത്തിലെ גלה നിർബന്ധിത നാടുകടത്തലിനെ സൂചിപ്പിക്കുന്നു. കർമണിപ്രയോഗം അതു വ്യക്തമാക്കുന്നു; എന്നാൽ മൂലക്രിയ സജീവമായോ കർമണിയായോ പരിഭാഷപ്പെടുത്താവുന്നതാണ്.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: ദേശത്തെയോ ജനത്തെയോ സൂചിപ്പിക്കാവുന്ന മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: מֵעַל אַדְמָתוֹ
  choice: സ്വന്തം ദേശത്തുനിന്ന്
  rationale: אדמה എന്നതിന്റെ ‘മണ്ണ്/നിലം/ദേശം’ എന്നീ അർഥങ്ങളിൽ പ്രവാസസന്ദർഭത്തിന് ‘ദേശം’ യോജിക്കുന്നു; പ്രത്യയം ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘സ്വന്തം’ ഉപയോഗിച്ചു.
