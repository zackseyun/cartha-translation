translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പേരുകൾ എബ്രായരൂപങ്ങളോട് ചേർന്ന ലിപ്യന്തരണത്തിൽ നൽകി. ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; സമാനാധികരണ പട്ടികയുടെ ബന്ധം നിലനിർത്തി.
