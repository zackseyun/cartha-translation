  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
translation:
  language: ml
  text: 'സൈന്യാധിപന്മാർ എല്ലാവരും, അവരും അവരുടെ ആളുകളും, ബാബേൽരാജാവ് ഗെദല്യാവിനെ ചുമതല ഏൽപ്പിച്ചിരുന്നതായി[a] കേട്ടപ്പോൾ, അവർ മിസ്പയിൽ ഗെദല്യാവിന്റെ അടുക്കൽ വന്നു: നെഥന്യാവിന്റെ മകൻ യിശ്മായേൽ, കാരേഹിന്റെ മകൻ യോഹാനാൻ, നെതോഫാത്യനായ തൻഹൂമെത്തിന്റെ മകൻ സെരായാവ്, മയഖാത്യന്റെ മകൻ യഅസന്യാവ്—അവരും അവരുടെ ആളുകളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഗെദല്യാവിനെ നിയമിച്ചിരുന്നതായി.” എബ്രായ ക്രിയയ്ക്ക് ഒരാളെ മേൽനോട്ടത്തിനോ ഭരണനിർവഹണത്തിനോ നിയോഗിക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: സൈന്യാധിപന്മാർ
  rationale: שָׂרֵי നേതാക്കളെയോ അധികാരികളെയോ സൂചിപ്പിക്കുന്നു; הַחֲיָלִים ഇവിടെ സൈനികസേനകളെയാണ് സൂചിപ്പിക്കുന്നത്. പ്രത്യേക പദവി അനാവശ്യമായി നിർണയിക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ സൈനിക നേതൃത്വത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: הֵמָּה וְהָאֲנָשִׁים
  choice: അവരും അവരുടെ ആളുകളും
  rationale: ആവർത്തിച്ചുള്ള സർവനാമവും നാമവും അധിപന്മാരെയും അവരോടൊപ്പമുള്ള ആളുകളെയും വേർതിരിച്ചു ഊന്നുന്നു. സൈനികർ എന്നു കൂടുതൽ നിർവചിക്കാതെ മൂലപാഠത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: הִפְקִיד
  choice: അധികാരമേൽപ്പിച്ചിരിക്കുന്നു
  rationale: ഈ ക്രിയ നിയമിക്കുക, മേൽനോട്ടം ഏൽപ്പിക്കുക, ചുമതലപ്പെടുത്തുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്നു. ഗവർണറാക്കി എന്ന പ്രത്യേക പദവി ചേർക്കാതെ ഭരണചുമതലയുടെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּה
  choice: മിസ്പയിൽ ഗെദല്യാവിന്റെ അടുക്കൽ
  rationale: സ്ഥലനാമം ഗെദല്യാവ് ഉണ്ടായിരുന്ന ഇടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: הַנְּטֹפָתִי
  choice: നെതോഫാത്യനായ
  rationale: ഭൂമിശാസ്ത്രപരമോ ജനവിഭാഗപരമോ ആയ വിശേഷണം ലിപ്യന്തരണം ചെയ്ത് സംരക്ഷിക്കുന്നു.
- source_word: הַמַּעֲכָתִי
  choice: മയഖാത്യന്റെ
  rationale: മൂലത്തിലെ ജനവിഭാഗ/ദേശബന്ധ വിശേഷണം സംരക്ഷിക്കുന്നു. ഇവിടെ വിശേഷണം യയസന്യാവിന്റെ പിതാവിനോടാണ് വ്യാകരണപരമായി ചേർന്നിരിക്കുന്നത്.
- source_word: וַיָּבֹאוּ ... וְיִשְׁמָעֵאל ... וְיוֹחָנָן ...
  choice: വന്നു. ... എന്നിവരും ... ആയിരുന്നു അവർ
  rationale: ആദ്യം പൊതുവായ കർത്താവിനെ പറഞ്ഞശേഷം പേരുകളുടെ പട്ടിക സമാനാധികരണമായി നൽകുന്ന എബ്രായ ഘടന മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְאַנְשֵׁיהֶם
  choice: അവരുടെ ആളുകളും
  rationale: പേരെടുത്ത സൈന്യാധിപന്മാരോടൊപ്പം ഉണ്ടായിരുന്ന ആളുകളെ സൂചിപ്പിക്കുന്നു; കൂടെ എന്ന ബന്ധം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
