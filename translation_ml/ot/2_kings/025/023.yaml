revisions:
- from: സൈന്യാധിപന്മാർ എല്ലാവരും—അവരും അവരുടെ ആളുകളും—ബാബേൽരാജാവ് ഗെദല്യാവിനെ അധികാരമേൽപ്പിച്ചിരിക്കുന്നു[a] എന്നു കേട്ടപ്പോൾ മിസ്പയിൽ ഗെദല്യാവിന്റെ അടുക്കൽ വന്നു. നെഥന്യാവിന്റെ മകൻ യിശ്മായേൽ, കാരേഹിന്റെ മകൻ യോഹാനാൻ, നെതോഫാത്യനായ തൻഹൂമെത്തിന്റെ മകൻ സെരായാവ്, മയഖാത്യന്റെ മകൻ യയസന്യാവ് എന്നിവരും അവരുടെ ആളുകളുമായിരുന്നു അവർ.
  to: 'സൈന്യാധിപന്മാർ എല്ലാവരും, അവരും അവരുടെ ആളുകളും, ബാബേൽരാജാവ് ഗെദല്യാവിനെ ചുമതല ഏൽപ്പിച്ചിരുന്നതായി[a] കേട്ടപ്പോൾ, അവർ മിസ്പയിൽ ഗെദല്യാവിന്റെ അടുക്കൽ വന്നു: നെഥന്യാവിന്റെ മകൻ യിശ്മായേൽ, കാരേഹിന്റെ മകൻ യോഹാനാൻ, നെതോഫാത്യനായ തൻഹൂമെത്തിന്റെ മകൻ സെരായാവ്, മയഖാത്യന്റെ മകൻ യഅസന്യാവ്—അവരും അവരുടെ ആളുകളും.'
  rationale: The revision preserves the source's resumptive construction and makes the named commanders an appositional list after “they came.” It also uses a past-relative construction for the prior appointment and keeps the lexical footnote anchored to that expression. No office such as “governor” is added.
