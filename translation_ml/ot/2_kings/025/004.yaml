  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
translation:
  language: ml
  text: അപ്പോൾ നഗരത്തിൽ ഒരു ഭേദനം ഉണ്ടായി. യോദ്ധാക്കൾ എല്ലാവരും രാത്രിയിൽ, രാജാവിന്റെ തോട്ടത്തിനരികെയുള്ള രണ്ടു മതിലുകൾക്കിടയിലെ കവാടംവഴി പുറപ്പെട്ടുപോയി.[a] കൽദയർ[b] നഗരത്തെ ചുറ്റും വളഞ്ഞുനിന്നപ്പോൾ രാജാവ്[c] അരാബാവഴി പോയി.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുറപ്പെട്ടുപോയി’ എന്ന ക്രിയ ഹീബ്രു പാഠത്തിൽ പ്രത്യക്ഷമായി ഇല്ല; വാക്യഘടനയും സമാന്തരവിവരണവും അടിസ്ഥാനമാക്കി അർഥം പൂർത്തിയാക്കിയിരിക്കുന്നു.
    reason: textual_clarity
  - marker: b
    text: അഥവാ ‘ബാബിലോന്യർ.’ ഹീബ്രു പാഠത്തിൽ പ്രത്യേകമായി ‘കൽദയർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘അവൻ.’ ഹീബ്രുവിൽ കർത്താവ് വ്യക്തമാക്കപ്പെട്ടിട്ടില്ല; സന്ദർഭം രാജാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: d
    text: അരാബാ യോർദ്ദാൻ താഴ്‌വരയിൽനിന്ന് തെക്കോട്ടു നീളുന്ന ഭ്രംശതാഴ്‌വരപ്രദേശമാണ്; പരമ്പരാഗതമായി ‘സമതലം’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: നഗരം ഭേദിക്കപ്പെട്ടു
  rationale: നിഫാൽ രൂപം ഉപരോധത്തിൽ നഗരത്തിന്റെ പ്രതിരോധം തകർക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു. ‘നഗരം ഭേദിക്കപ്പെട്ടു’ എന്നത് മൂലപാഠത്തിലെ ‘നഗരം’ നിലനിർത്തിക്കൊണ്ട് സൈനികസന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: യോദ്ധാക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘യുദ്ധത്തിന്റെ പുരുഷന്മാർ’; ആധുനിക മലയാളത്തിൽ സൈനിക അർഥം വ്യക്തവും ഗൗരവമുള്ളതുമായി നൽകാൻ ‘യോദ്ധാക്കൾ’ തെരഞ്ഞെടുത്തു.
- source_word: הַלַּיְלָה
  choice: രാത്രിയിൽ
  rationale: ഇവിടെ പദം ക്രിയാവിശേഷണമായി ഉപയോഗിച്ചിരിക്കുന്നു; ‘രാത്രിയിൽ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: രണ്ടു മതിലുകൾക്കിടയിലെ കവാടംവഴി
  rationale: חֹמֹתַיִם എന്ന ദ്വിവചനരൂപം രണ്ടു മതിലുകളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; דֶּרֶךְ എന്ന വഴിസൂചനയും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: രാജാവിന്റെ തോട്ടത്തിനരികെയുള്ള
  rationale: ഇവിടെയുള്ള עַל സ്ഥലസാമീപ്യം സൂചിപ്പിക്കുന്നു; ‘അരികെയുള്ള’ ഭൂപ്രകൃതിസംബന്ധമായ വിവരണം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְכַשְׂדִּים
  choice: കൽദയർ
  rationale: മൂലഹീബ്രു പ്രത്യേകമായി ‘കൽദയർ’ എന്നു പറയുന്നു. ചരിത്രപരമായി ബാബിലോന്യ സൈന്യത്തെ സൂചിപ്പിച്ചാലും മൂലപദം പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
- source_word: עַל הָעִיר סָבִיב
  choice: നഗരത്തെ ചുറ്റും വളഞ്ഞിരുന്നു
  rationale: סָבִיב സൂചിപ്പിക്കുന്ന സമ്പൂർണ വളയം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: וַיֵּלֶךְ
  choice: രാജാവ് പോയി
  rationale: ക്രിയയുടെ കർത്താവ് ഹീബ്രുവിൽ പ്രത്യക്ഷമായി പറയുന്നില്ല; സന്ദർഭത്തിൽ അത് രാജാവാണെന്ന് വ്യക്തമായതിനാൽ മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമാക്കിയിരിക്കുന്നു, കൂടെ അടിക്കുറിപ്പിൽ മൂലത്തിലെ അവ്യക്തത രേഖപ്പെടുത്തി.
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: അരാബായിലേക്കുള്ള വഴിയിലൂടെ
  rationale: അരാബാ ഒരു ഭൂമിശാസ്ത്രനാമമായതിനാൽ ‘സമതലം’ എന്നു വ്യാഖ്യാനിക്കാതെ പേരായി നിലനിർത്തി. സന്ദർഭത്തിലെ രക്ഷപ്പെടൽദിശ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘അരാബായിലേക്കുള്ള വഴിയിലൂടെ’ ഉപയോഗിച്ചു.
