translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ചരിത്രാഖ്യാനശൈലി സ്വീകരിച്ചു. സൈനികവും ഭൂപ്രകൃതിസംബന്ധവുമായ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകി; ‘കൽദയർ,’ ‘അരാബാ’ എന്നീ മൂലസാംസ്കാരിക നാമങ്ങൾ നിലനിർത്തി.
