reference: 2 Kings 25:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בְּ/שִׁבְעָ֣ה לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבֻכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֞א נְבוּזַרְאֲדָ֧ן רַב טַבָּחִ֛ים עֶ֥בֶד מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
translation:
  language: ml
  text: അഞ്ചാം മാസത്തിൽ, ആ മാസത്തിന്റെ ഏഴാം ദിവസം—അത് ബാബേൽരാജാവായ നെബൂഖദ്നേസറിന്റെ ഭരണത്തിന്റെ പത്തൊൻപതാം വർഷമായിരുന്നു—ബാബേൽരാജാവിന്റെ സേവകനും രാജകാവൽപ്പടയുടെ തലവനുമായ[a] നെബൂസരദാൻ യെരൂശലേമിൽ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “കൊല്ലുന്നവരുടെ തലവൻ”; ഈ പദവി രാജകീയ കാവൽപ്പടയുടെയോ വധനിർവാഹകരുടെയോ മേധാവിയെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: അഞ്ചാം മാസത്തിൽ
  rationale: കഥനത്തിന്റെ തുടർച്ച മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ ആദ്യത്തെ וְ പ്രത്യേകം ‘അപ്പോൾ’ എന്നു ചേർക്കാതെ, മാസനിർദേശം ഔപചാരികമായി നിലനിർത്തി.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: ആ മാസത്തിന്റെ ഏഴാം ദിവസം
  rationale: എബ്രായ തീയതിപ്രയോഗത്തിൽ സൂചിതമായ ‘ദിവസം’ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചേർത്തു.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבֻכַדְנֶאצַּר
  choice: അത് ബാബേൽരാജാവായ നെബൂഖദ്നേസറിന്റെ ഭരണത്തിന്റെ പത്തൊൻപതാം വർഷമായിരുന്നു
  rationale: הִיאയുടെ വിശദീകരണസ്വഭാവം നിലനിർത്തുകയും לַמֶּלֶךְ സൂചിപ്പിക്കുന്ന ഭരണവർഷക്കണക്ക് മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്തു.
- source_word: נְבוּזַרְאֲדָן
  choice: നെബൂസരദാൻ
  rationale: പേരിന്റെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: רַב טַבָּחִים
  choice: രാജകാവൽപ്പടയുടെ തലവൻ
  rationale: അക്ഷരാർഥം ‘കൊല്ലുന്നവരുടെ തലവൻ’ എന്നാണെങ്കിലും രാജസദസ്സിലെ ഔദ്യോഗിക പദവിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; അക്ഷരാർഥവും മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവിന്റെ സേവകൻ
  rationale: עֶבֶד ഇവിടെ രാജാവിനു കീഴിൽ സേവിക്കുന്ന ഉദ്യോഗസ്ഥനെയോ സേവകനെയോ സൂചിപ്പിക്കാം; ‘സേവകൻ’ അടിമസ്ഥിതി അനാവശ്യമായി നിർണയിക്കാതെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: בָּא ... יְרוּשָׁלִָם
  choice: യെരൂശലേമിൽ വന്നു
  rationale: സാധാരണ കഥനക്രിയയായ בוא നേരിട്ട് ‘വന്നു’ എന്നും ലക്ഷ്യസ്ഥാനം മലയാളത്തിലെ അധികരണവിഭക്തിയോടെയും നൽകി.
