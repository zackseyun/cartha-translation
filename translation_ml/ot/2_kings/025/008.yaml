translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ ഗൗരവമുള്ള കഥനശൈലി. തീയതിവാക്യത്തിന്റെ വിശദീകരണഘടന ദീർഘരേഖകൾകൊണ്ട് നിലനിർത്തി; രാജസദസ്സിലെ പദവിയുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
