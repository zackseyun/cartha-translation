source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁנַ֨ת הַ/תְּשִׁיעִ֜ית לְ/מָלְכ֗/וֹ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִי֮ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֒ בָּ֠א נְבֻכַדְנֶאצַּ֨ר מֶֽלֶךְ בָּבֶ֜ל ה֧וּא וְ/כָל חֵיל֛/וֹ עַל יְרוּשָׁלִַ֖ם וַ/יִּ֣חַן עָלֶ֑י/הָ וַ/יִּבְנ֥וּ עָלֶ֖י/הָ דָּיֵ֥ק סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
translation:
  language: ml
  text: അവന്റെ ഭരണത്തിന്റെ ഒമ്പതാം വർഷത്തിൽ, പത്താം മാസം, ആ മാസത്തിന്റെ പത്താം ദിവസം, ബാബേൽരാജാവായ നെബൂഖദ്നേസർ[a] തന്റെ മുഴുവൻ സൈന്യവുമായി യെരൂശലേമിനെതിരെ വന്നു. അവർ അതിനെതിരെ പാളയമിറങ്ങി, അതിനു ചുറ്റും ഉപരോധമതിൽ[b] പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പേര് ചില ലിപ്യന്തരണരീതികളിൽ ‘നെബൂഖദ്രേസർ’ എന്നും എഴുതപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം നഗരത്തെ ഉപരോധിക്കാനായി പണിത സൈനിക നിർമിതിയെ സൂചിപ്പിക്കുന്നു; ‘ഉപരോധനിർമിതികൾ’ എന്നോ ‘ഉപരോധക്കര’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[കാലസൂചനയോടു ചേർന്ന നേരിട്ടുള്ള ആഖ്യാനാരംഭം]'
  rationale: ഹീബ്രു ചരിത്രാഖ്യാനത്തിലെ പതിവ് തുടർച്ചാസൂചകമാണിത്. മലയാളത്തിൽ ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു യാന്ത്രികമായി ചേർക്കാതെ തീയതിവിവരത്തോടെ വാക്യം ആരംഭിക്കുന്നത് സ്വാഭാവികവും അതേ ആഖ്യാനപ്രവാഹം നിലനിർത്തുന്നതുമാണ്.
- source_word: בִשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ
  choice: അവന്റെ ഭരണത്തിന്റെ ഒമ്പതാം വർഷം
  rationale: രാജാവിന്റെ ഭരണവർഷം സൂചിപ്പിക്കുന്ന പതിവ് പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ‘അവന്റെ’ എന്ന സർവനാമത്തിന്റെ സന്ദർഭാശ്രിതത്വവും സംരക്ഷിക്കുന്നു.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: പത്താം മാസം, ആ മാസത്തിന്റെ പത്താം ദിവസം
  rationale: മൂലത്തിലെ കലണ്ടർക്രമം നിലനിർത്തുകയും ആധുനിക മാസപ്പേര് അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: נְבֻכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവായ നെബൂഖദ്നേസർ
  rationale: രാജകീയ പദവിയും സ്ഥലനാമവും സ്വാഭാവിക മലയാളഘടനയിൽ ചേർത്തു; പേരിന് മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: הוּא וְכָל חֵילוֹ
  choice: തന്റെ മുഴുവൻ സൈന്യവുമായി
  rationale: രാജാവ് വ്യക്തിപരമായി മുഴുവൻ സൈന്യത്തോടുംകൂടെ വന്നുവെന്ന ഉൾക്കൊള്ളുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל יְרוּשָׁלַםִ
  choice: യെരൂശലേമിനെതിരെ
  rationale: സൈനിക നീക്കത്തിന്റെയും ഉപരോധത്തിന്റെയും പശ്ചാത്തലത്തിൽ עַל വിരോധാത്മക അർഥത്തിലാണ്.
- source_word: וַיִּחַן עָלֶיהָ
  choice: അതിനെതിരെ പാളയമിറങ്ങി
  rationale: നഗരത്തിനെതിരായ സൈനിക പാളയസ്ഥാപനമാണ് സൂചിപ്പിക്കുന്നത്; ‘പാളയമിറങ്ങി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: וַיִּבְנוּ
  choice: അവർ ... പണിതു
  rationale: മൂലത്തിലെ ബഹുവചനക്രിയ സംരക്ഷിച്ച് രാജാവും സൈന്യവും ചേർന്ന പ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു.
- source_word: דָּיֵק
  choice: ഉപരോധമതിൽ
  rationale: നഗരത്തിനെതിരെ നിർമിച്ച ഉപരോധസംവിധാനത്തെ വ്യക്തവും ദൃശ്യവുമായ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു; പദത്തിന്റെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി. തീയതിക്രമം, സന്ദർഭാശ്രിതമായ ‘അവന്റെ’, സൈനികവിരോധം, ബഹുവചന പ്രവർത്തനം എന്നിവ മൂലപാഠാനുസൃതമായി നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളുടെ മാർക്കറുകൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്ത സ്ഥാനങ്ങളിലായതിനാൽ, പേരിന്റെ പര്യായലിപ്യന്തരണം പേരിനോടും דָּיֵק എന്ന പദത്തിന്റെ പര്യായങ്ങൾ ‘ഉപരോധമതിൽ’ എന്നതിനോടും ബന്ധിപ്പിച്ചു.
