base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/006.yaml
  text: Then they captured the king and brought him up to the king of Babylon at Riblah[a], and they pronounced judgment on him.
translation:
  language: ml
  text: അവർ രാജാവിനെ പിടിച്ചു, രിബ്ലയിൽവെച്ച് ബാബേൽരാജാവിന്റെ അടുക്കലേക്ക് അവനെ കൊണ്ടുചെന്നു. അവർ അവന്റെമേൽ ന്യായവിധി പ്രസ്താവിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവർ അവനോടു ന്യായവിധി സംസാരിച്ചു”; അവന്റെമേൽ നീതിന്യായപരമായ വിധി പ്രഖ്യാപിച്ചു എന്നർഥമുള്ള ഒരു പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: പിടിച്ചു
  rationale: ഒളിച്ചോടിയ രാജാവിനെ വിജയകരമായി പിടികൂടിയതിനെ സൂചിപ്പിക്കുന്ന തפשׂ എന്ന ക്രിയയുടെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: הַמֶּלֶךְ
  choice: രാജാവിനെ
  rationale: മുൻസന്ദർഭത്തിൽ പരാമർശിക്കപ്പെട്ട സിദെക്കീയാവിനെയാണ് നിർദിഷ്ട നാമം സൂചിപ്പിക്കുന്നത്; മൂലപാഠം ഇവിടെ പേര് ആവർത്തിക്കാത്തതിനാൽ ‘രാജാവ്’ എന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: അവനെ കൊണ്ടുചെന്നു
  rationale: עלה എന്ന ക്രിയയിലെ ചലനാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ‘കയറ്റിക്കൊണ്ടുപോയി’ എന്നു പറഞ്ഞാൽ മൂലപാഠം നിർബന്ധിക്കാത്ത മലകയറ്റത്തിന്റെ ധ്വനി ഉണ്ടാകാനിടയുള്ളതിനാൽ ഒഴിവാക്കി.
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവിന്റെ അടുക്കലേക്ക്
  rationale: אֶל എന്നതിന്റെ ദിശാസൂചന നേരിട്ട് നിലനിർത്തുകയും, രാജാവിന്റെ സന്നിധിയിലേക്കു കൊണ്ടുചെന്നുവെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: רִבְלָתָה
  choice: രിബ്ലയിൽവെച്ച്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה־യെ മുഴുവൻ വാക്യസന്ദർഭത്തിൽ, ബാബേൽരാജാവ് ഉണ്ടായിരുന്ന സ്ഥലമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  choice: അവർ അവന്റെമേൽ ന്യായവിധി പ്രസ്താവിച്ചു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അവനോടു ന്യായവിധി സംസാരിച്ചു’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ സാധാരണ സംഭാഷണമല്ല, ഔദ്യോഗികമായ ന്യായവിധി പ്രഖ്യാപനമാണ് സൂചിപ്പിക്കുന്നത്. നിയമപരമായ അർഥം വ്യക്തമാക്കുമ്പോഴും ‘ന്യായവിധി’ എന്ന മൂലപദത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
