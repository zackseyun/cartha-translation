translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ഹീബ്രുവിലെ ക്രമബദ്ധമായ സംഭവവിവരണം നിലനിർത്തുന്നു. ന്യായവിധിയുമായി ബന്ധപ്പെട്ട പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും പ്രയോഗാർഥവും അടിക്കുറിപ്പിലൂടെ വേർതിരിച്ചു കാണിക്കുന്നു.
