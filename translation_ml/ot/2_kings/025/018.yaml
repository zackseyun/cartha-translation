  text: וַ/יִּקַּ֣ח רַב טַבָּחִ֗ים אֶת שְׂרָיָה֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וְ/אֶת צְפַנְיָ֖הוּ כֹּהֵ֣ן מִשְׁנֶ֑ה וְ/אֶת שְׁלֹ֖שֶׁת שֹׁמְרֵ֥י הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
translation:
  language: ml
  text: രാജകീയ കാവൽപ്പടയുടെ തലവൻ മുഖ്യപുരോഹിതനായ സെരായാവിനെയും[a] രണ്ടാം സ്ഥാനത്തുള്ള പുരോഹിതനായ സെഫന്യാവിനെയും[b] പടിവാതിൽ കാവൽക്കാരായ മൂന്നുപേരെയും കൂട്ടിക്കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മുഖ്യപുരോഹിതൻ” എന്നത് “മഹാപുരോഹിതൻ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിൽ അക്ഷരാർഥം “തലവനായ പുരോഹിതൻ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “രണ്ടാം സ്ഥാനത്തുള്ള പുരോഹിതൻ” എന്നത് “ഉപപുരോഹിതൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: അകമ്പടിപ്പടയുടെ തലവൻ
  rationale: പദത്തിന്റെ ഘടകങ്ങൾക്ക് അക്ഷരാർഥത്തിൽ ‘കൊല്ലുന്നവരുടെ തലവൻ’ എന്ന ആശയമുണ്ടെങ്കിലും, ബാബിലോന്യ രാജസൈനികസന്ദർഭത്തിൽ ഇത് രാജകീയ അകമ്പടിപ്പടയുടെ അധികാരിയെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ്.
- source_word: וַיִּקַּח
  choice: പിടിച്ചുകൊണ്ടുപോയി
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ തോറ്റ നഗരത്തിലെ ഉദ്യോഗസ്ഥരെ കസ്റ്റഡിയിലെടുത്ത് കൊണ്ടുപോകുന്നതാണ് സന്ദർഭം; അതിനാൽ ബലപ്രയോഗത്തിന്റെ സൂചന സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: മുഖ്യപുരോഹിതൻ
  rationale: അക്ഷരാർഥം ‘തലവനായ പുരോഹിതൻ’ എന്നാണ്. പ്രധാന പുരോഹിതപദവി സൂചിപ്പിക്കുമ്പോഴും പിൽക്കാല സാങ്കേതിക പ്രയോഗം അനാവശ്യമായി ശക്തിപ്പെടുത്താതിരിക്കാൻ ‘മുഖ്യപുരോഹിതൻ’ സ്വീകരിച്ചു.
- source_word: כֹּהֵן מִשְׁנֶה
  choice: രണ്ടാം സ്ഥാനത്തുള്ള പുരോഹിതൻ
  rationale: מִשְׁנֶה രണ്ടാം പദവിയെയോ ഉപസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പദവിക്രമം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: שֹׁמְרֵי הַסַּף
  choice: പടിവാതിൽ കാവൽക്കാർ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഉമ്മരപ്പടി/പടിവാതിൽ കാക്കുന്നവർ’ എന്നാണ്. ക്ഷേത്രപ്രവേശനത്തിന്റെ കാവൽക്കാരെ സൂചിപ്പിക്കുന്ന സജീവമായ മൂലരൂപകം നിലനിർത്തുന്നു.
- source_word: שְׁלֹשֶׁת
  choice: മൂന്നുപേർ
  rationale: നിശ്ചിതമായ ഒരു മൂന്നംഗസംഘത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: שְׂרָיָה
  choice: സെരായാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: צְפַנְיָהוּ
  choice: സെഫന്യാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: כֹּהֵן הָרֹאשׁ എന്ന പദവിയുടെ വിവർത്തനം
  choice: മുഖ്യപുരോഹിതൻ
  alternative: മഹാപുരോഹിതൻ
  rationale: ഹീബ്രുവിലെ ‘പുരോഹിതൻ, തലവൻ/മുഖ്യൻ’ എന്ന ഘടനയോട് അടുത്തുനിൽക്കുകയും പദവിയുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള സാധ്യതകൾ അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: כֹּהֵן מִשְׁנֶה എന്ന പദവിയുടെ കൃത്യസ്വഭാവം
  choice: രണ്ടാം സ്ഥാനത്തുള്ള പുരോഹിതൻ
  alternative: ഉപപുരോഹിതൻ
  rationale: മൂലപദം രണ്ടാം പദവിയെയോ പ്രതിനിധിസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം; ‘രണ്ടാം സ്ഥാനത്തുള്ള’ എന്നത് ഈ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ചരിത്രപരമായ സ്ഥാനപ്പേരുകളിൽ അക്ഷരാർഥവും സന്ദർഭാർഥവും സന്തുലിതമാക്കി; പേരുകൾ ഹീബ്രു രൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
