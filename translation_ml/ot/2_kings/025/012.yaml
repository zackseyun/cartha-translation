  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/דַּלַּ֣ת הָ/אָ֔רֶץ הִשְׁאִ֖יר רַב טַבָּחִ֑ים לְ/כֹֽרְמִ֖ים וּ/לְ/יֹגְבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/012.yaml
  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
translation:
  language: ml
  text: എന്നാൽ ദേശത്തിലെ ഏറ്റവും ദരിദ്രരിൽ ചിലരെ മുന്തിരിത്തോട്ടം പരിപാലിക്കുന്നവരായും കൃഷിപ്പണിക്കാരായും ഇരിക്കാനായി അംഗരക്ഷകസേനയുടെ തലവൻ അവിടെ ശേഷിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִדַּלַּת הָאָרֶץ
  choice: എന്നാൽ ദേശത്തിലെ ഏറ്റവും ദരിദ്രരായ ചിലരെ
  rationale: മുൻവാക്യത്തിലെ നാടുകടത്തലിനോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കാൻ וּ എന്ന ബന്ധകത്തെ ‘എന്നാൽ’ എന്നു നൽകി. מִן എന്ന ഭാഗികപ്രയോഗവും דַּלַּת എന്ന സമൂഹവാചകവും ചേർന്ന് ദരിദ്രവിഭാഗത്തിൽനിന്ന് ചിലരെ എന്ന ആശയം നൽകുന്നു; സന്ദർഭത്തിലെ ശക്തി ‘ഏറ്റവും ദരിദ്രരായ’ എന്നു സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הִשְׁאִיר
  choice: അവിടെ ശേഷിപ്പിച്ചു
  rationale: שׁאר എന്ന ധാതുവിന്റെ ഹിഫ്ഇൽ രൂപം ‘ശേഷിപ്പിക്കുക/വിട്ടേക്കുക’ എന്നാണ്. നാടുകടത്താതെ നാട്ടിൽത്തന്നെ പാർപ്പിച്ചുവെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കാൻ ‘അവിടെ ശേഷിപ്പിച്ചു’ എന്നു നൽകി.
- source_word: רַב טַבָּחִים
  choice: അംഗരക്ഷകസേനയുടെ തലവൻ
  rationale: പദശഃ ‘കൊല്ലുന്നവരുടെ തലവൻ’ എന്ന ബന്ധമുള്ള രാജകീയ പദവിയാണെങ്കിലും, ഈ ബാബിലോന്യ സൈനികസന്ദർഭത്തിൽ രാജകീയ അംഗരക്ഷകസേനയുടെ കമാൻഡറെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְכֹרְמִים
  choice: മുന്തിരിത്തോട്ടങ്ങളിൽ പണിയെടുക്കുന്നവർ
  rationale: כֹּרְמִים മുന്തിരിത്തോട്ടം പരിപാലിക്കുന്ന തൊഴിലാളികളെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന ആധുനിക മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: וּלְיֹגְבִים
  choice: കൃഷിപ്പണിക്കാർ
  rationale: അപൂർവമായ ഈ എബ്രായപദം മണ്ണിൽ കൃഷിപ്പണി ചെയ്യുന്നവരെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു. പ്രത്യേകിച്ച് ‘ഉഴുന്നവർ’ എന്നു ചുരുക്കാതെ വിശാലമായ കാർഷികാർഥം നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായവാക്യത്തിലെ കർത്താവിന്റെ വൈകിയ സ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമാക്കി; സൂചിത കർമമായ ‘ചിലരെ’ വ്യക്തമായി ചേർത്തു. അപൂർവമായ יֹגְבִים എന്ന പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
