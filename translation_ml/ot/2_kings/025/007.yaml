  text: וְ/אֶת בְּנֵי֙ צִדְקִיָּ֔הוּ שָׁחֲט֖וּ לְ/עֵינָ֑י/ו וְ/אֶת עֵינֵ֤י צִדְקִיָּ֨הוּ֙ עִוֵּ֔ר וַ/יַּאַסְרֵ֨/הוּ֙ בַֽ/נְחֻשְׁתַּ֔יִם וַ/יְבִאֵ֖/הוּ בָּבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
translation:
  language: ml
  text: അവർ സിദെക്കീയാവിന്റെ പുത്രന്മാരെ അവന്റെ കൺമുന്നിൽവെച്ച് അറുത്തുകൊന്നു. തുടർന്ന് അവൻ സിദെക്കീയാവിന്റെ കണ്ണുകൾ അന്ധമാക്കി[a]; അവനെ വെങ്കലവിലങ്ങുകളാൽ ബന്ധിച്ച് ബാബേലിലേക്കു കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സിദെക്കീയാവിനെ കുരുടനാക്കി.” എബ്രായ ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കുരുടനാക്കുക’ എന്നാണ്; ഇവിടെ കണ്ണുകൾ നശിപ്പിച്ച ശാരീരിക പ്രവൃത്തിയെയും ഈ പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחֲטוּ
  choice: അറുത്തുകൊന്നു
  rationale: കൊലയുടെ ക്രൂരവും അറവിനോടു ബന്ധപ്പെട്ടതുമായ ഭാവം നിലനിർത്തുന്നു; പൊതുവായ ‘കൊന്നു’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: לְעֵינָיו
  choice: അവന്റെ കൺമുന്നിൽവെച്ച്
  rationale: അവൻ നേരിട്ടു കാണുന്നിടത്തുവെച്ചാണ് സംഭവം നടന്നതെന്ന എബ്രായ ശൈലിയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: עִוֵּר
  choice: കണ്ണുകൾ കുത്തിപ്പൊട്ടിച്ചു
  rationale: ക്രൂരമായ ഈ സന്ദർഭത്തിൽ സിദെക്കീയാവിനെ കുരുടനാക്കാൻ നടത്തിയ ശാരീരിക പ്രവൃത്തിയെ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു; ‘കുരുടനാക്കി’ എന്ന പൊതുവായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּאַסְרֵהוּ
  choice: അവനെ ... ബന്ധിച്ച്
  rationale: തുടർന്നുവരുന്ന വിലങ്ങുകളെ ഉപകരണമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ബന്ധിച്ചു’ എന്നതാണ് നേരിട്ടുള്ള സന്ദർഭോചിതമായ പരിഭാഷ.
- source_word: בַנְחֻשְׁתַּיִם
  choice: വെങ്കലവിലങ്ങുകളാൽ
  rationale: ലോഹത്തിൽ നിർമിച്ച ബന്ധനോപകരണങ്ങളെയാണ് രൂപം സൂചിപ്പിക്കുന്നത്; ‘വിലങ്ങുകൾ’ ആ അർഥം സാധാരണ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: וַיְבִאֵהוּ בָּבֶל
  choice: ബാബേലിലേക്കു കൊണ്ടുപോയി
  rationale: ‘കൊണ്ടുവരുക/കൊണ്ടുപോകുക’ എന്ന സാധാരണ ക്രിയയുടെ ആഖ്യാനസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: സിദെക്കീയാവിന്റെ പുത്രന്മാർ
  rationale: എബ്രായ സംയുക്തബന്ധത്തെ അർഥനഷ്ടമില്ലാതെ സ്വാഭാവിക മലയാള ഉടമസ്ഥരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ക്രിയകളിലെ ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള കർത്തൃമാറ്റം
  choice: ആദ്യ പ്രവൃത്തിക്ക് ‘അവർ’; തുടർന്നുള്ള പ്രവൃത്തികൾക്ക് ‘അവൻ’
  alternative: എല്ലാ പ്രവൃത്തികൾക്കും ഒരേ ബഹുവചനകർത്താവിനെ ഉപയോഗിക്കുക
  rationale: שָׁחֲטוּ ബഹുവചനമാണെങ്കിലും עִוֵּר, וַיַּאַסְרֵהוּ, וַיְבִאֵהוּ എന്നിവ ഏകവചനമാണ്. ഈ ആഖ്യാനപരമായ മാറ്റം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാവുന്ന, എന്നാൽ ചരിത്രാഖ്യാനത്തിന്റെ ഗൗരവവും ക്രൂരതയും മങ്ങിക്കാണിക്കാത്ത ശൈലി. ‘പുത്രന്മാർ’, ‘വെങ്കലവിലങ്ങുകൾ’, ‘ബാബേൽ’ എന്നീ പദങ്ങൾ ഔപചാരികതയും വ്യക്തതയും ഒരുമിച്ചു നിലനിർത്തുന്നു.
