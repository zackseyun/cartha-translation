  yaml_path: translation/ot/2_kings/025/028.yaml
  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a][b].
translation:
  language: ml
  text: അവൻ യെഹോയാഖീനോടു ദയയോടെ സംസാരിച്ചു[a]; ബാബേലിൽ തന്നോടുകൂടെ ഉണ്ടായിരുന്ന രാജാക്കന്മാരുടെ സിംഹാസനങ്ങളെക്കാൾ ഉയർന്ന സ്ഥാനത്ത് യെഹോയാഖീന്റെ സിംഹാസനം സ്ഥാപിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവനോടു നല്ല കാര്യങ്ങൾ സംസാരിച്ചു”; അവനോടു അനുകൂലമായോ ദയാപൂർവമായോ സംസാരിച്ചു എന്നർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: “സിംഹാസനം” എന്നത് ഇവിടെ രാജകീയ ഇരിപ്പിടം എന്നും മനസ്സിലാക്കാം; ബാബേലിലുണ്ടായിരുന്ന മറ്റു രാജാക്കന്മാരെക്കാൾ ഉയർന്ന പദവി യെഹോയാഖീനു ലഭിച്ചു എന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: അവൻ യെഹോയാഖീനോടു ദയയോടെ സംസാരിച്ചു
  rationale: ‘നല്ല കാര്യങ്ങൾ സംസാരിച്ചു’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ അനുകൂലമായും ദയാപൂർവമായും സംസാരിച്ചതിനെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ കർത്താവിനെയും കർമത്തെയും വ്യക്തമാക്കാൻ ‘അവൻ’, ‘യെഹോയാഖീൻ’ എന്നിവ ചേർത്തു.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: അവന്റെ സിംഹാസനത്തിനു ... സ്ഥാനം നൽകി
  rationale: נתן എന്ന ക്രിയ ഇവിടെ സിംഹാസനം സമ്മാനിച്ചു എന്നതിലുപരി രാജകീയ ഇരിപ്പിടത്തിനും പദവിക്കും മുൻഗണന നിശ്ചയിച്ചതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כִּסְאוֹ
  choice: അവന്റെ സിംഹാസനം
  rationale: כִּסֵּא എന്ന പദത്തിന് ഇരിപ്പിടം എന്നും സിംഹാസനം എന്നും അർഥമുണ്ടാകാം; രാജാക്കന്മാരുടെ പശ്ചാത്തലത്തിൽ ‘സിംഹാസനം’ രാജകീയ സ്ഥാനമാനവും നിലനിർത്തുന്നു.
- source_word: מֵעַל כִּסֵּא הַמְּלָכִים
  choice: രാജാക്കന്മാരുടെ സിംഹാസനങ്ങളെക്കാൾ ഉയർന്ന സ്ഥാനം
  rationale: מֵעַל താരതമ്യപരമായ ഉയർച്ചയും മുൻഗണനയും സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ഏകവചനരൂപം കൂട്ടായ ഘടനയായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ഓരോ രാജാവിന്റെയും സിംഹാസനത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: തന്നോടുകൂടെ ഉണ്ടായിരുന്ന രാജാക്കന്മാർ
  rationale: ബന്ധവാക്യത്തിന്റെ നേരായ അർഥം നിലനിർത്തുന്നു; ‘തന്നോടുകൂടെ’ എന്നത് ബാബേൽരാജാവിന്റെ സന്നിധിയിലോ രാജസഭയിലോ ഉണ്ടായിരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּבָבֶל
  choice: ബാബേലിൽ
  rationale: സ്ഥലനാമത്തിന്റെ സാധാരണ മലയാള ബൈബിൾ രൂപവും സ്ഥാനസൂചക വിഭക്തിയും ഉപയോഗിച്ചു.
