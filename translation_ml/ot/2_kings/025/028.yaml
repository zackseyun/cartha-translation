translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായ പ്രയോഗത്തിന്റെ അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കിയിട്ടും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. ‘സിംഹാസനം’ എന്ന ദൃശ്യരൂപവും അതിലെ പദവിസൂചനയും ഒരുമിച്ച് നിലനിർത്തി.
