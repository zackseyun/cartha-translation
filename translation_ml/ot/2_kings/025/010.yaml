id: 2KI.25.10
reference: 2 Kings 25:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת חוֹמֹ֥ת יְרוּשָׁלִַ֖ם סָבִ֑יב נָֽתְצוּ֙ כָּל חֵ֣יל כַּשְׂדִּ֔ים אֲשֶׁ֖ר רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/010.yaml
  text: And all the army of the Chaldeans who were with the captain of the guard tore down the walls of Jerusalem all around[a].
translation:
  language: ml
  text: കാവൽസേനാധിപനോടൊപ്പമുണ്ടായിരുന്ന കൽദയരുടെ സൈന്യം മുഴുവനും യെരൂശലേമിന്റെ ചുറ്റുമുള്ള മതിലുകൾ ഇടിച്ചുകളഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പദവിയായ ‘രബ്-തബ്ബാഹീം’ എന്നതിന് ‘വധശിക്ഷകരുടെ തലവൻ’ എന്നോ ‘അംഗരക്ഷകസേനയുടെ അധിപൻ’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹת יְרוּשָׁלִַם
  choice: യെരൂശലേമിന്റെ ... മതിലുകൾ
  rationale: ബഹുവചനമായ חוֹמֹת നഗരത്തെ ചുറ്റിയ മതിലുകളെയോ പ്രതിരോധമതിലുകളെയോ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ നേരിട്ടുള്ള പദം ‘മതിലുകൾ’ ആണ്.
- source_word: סָבִיב
  choice: ചുറ്റുമുള്ള
  rationale: നഗരത്തെ വലയം ചെയ്തിരുന്ന മതിലുകളുടെ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נָתְצוּ
  choice: ഇടിച്ചുകളഞ്ഞു
  rationale: നിർമിതികളെ പൊളിച്ചുനീക്കുക എന്ന נתץ എന്ന ക്രിയയുടെ ശക്തമായ അർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: כָּל חֵיל
  choice: സൈന്യം മുഴുവനും
  rationale: כָּל എന്ന സമഗ്രതയും חֵיל എന്ന കൂട്ടായ സൈനികശക്തിയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כַּשְׂדִּים
  choice: കൽദയർ
  rationale: മൂലപാഠത്തിലെ ജനനാമത്തെ ‘ബാബിലോന്യർ’ എന്നു സന്ദർഭാനുസൃതമായി മാറ്റാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר רַב טַבָּחִים
  choice: കാവൽസേനാധിപനോടൊപ്പമുണ്ടായിരുന്ന
  rationale: ബന്ധസൂചകത്തിന്റെ സംക്ഷിപ്തമായ എബ്രായപ്രയോഗത്തിൽ മുൻവാക്യത്തിൽ പരാമർശിച്ച ഉദ്യോഗസ്ഥനുമായുള്ള സൈന്യത്തിന്റെ ബന്ധം ഉൾക്കൊള്ളുന്നു; പദവിയെ അമിതമായി വ്യാഖ്യാനിക്കാതെ സ്വാഭാവിക മലയാളമാക്കുന്നു.
- source_word: רַב טַבָּחִים
  choice: കാവൽസേനാധിപൻ
  rationale: രാജകീയ-സൈനിക സന്ദർഭത്തിൽ ഉന്നത കാവൽ ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന പദവിക്ക് വ്യക്തവും മാന്യവുമായ മലയാളസമാനത; കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
