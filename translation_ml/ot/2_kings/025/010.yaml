  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. എബ്രായ വാക്യത്തിലെ ക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യക്രമത്തിലാക്കി; ജനനാമവും പദവിയുടെ അർഥവൈവിധ്യവും സംരക്ഷിച്ചു.
