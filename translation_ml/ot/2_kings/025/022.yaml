  source_fidelity: 'അർഥഘടകങ്ങൾ പൊതുവേ കൃത്യമാണ്: യെഹൂദയിൽ ശേഷിച്ച ജനം, അവരെ അവിടെ വിട്ട നെബൂഖദ്നേസർ, ഗെദല്യാവിനെ അവരുടെമേൽ നിയമിച്ചത്, വംശാവലിക്കുറിപ്പ് എന്നിവ എല്ലാം ഉൾക്കൊള്ളുന്നു. എന്നാൽ കരടിലെ ബന്ധവാക്യത്തിനു പിന്നാലെയുള്ള ‘അവരുടെമേൽ’ ഘടനയിൽ ‘അവിടെ ശേഷിപ്പിച്ചിരുന്ന’ എന്ന ക്രിയയുടെ കർമബന്ധം ഉടൻ വ്യക്തമല്ല. ‘ആ ജനത്തിന്മേൽ’ എന്നു വ്യക്തമാക്കുന്നത് ഹീബ്രുവിലെ אֲשֶׁר הִשְׁאִיר ... עֲלֵיהֶם എന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തും.'
  naturalness: ‘ബാബേൽരാജാവായ നെബൂഖദ്നേസർ അവിടെ ശേഷിപ്പിച്ചിരുന്ന അവരുടെമേൽ’ എന്ന തുടർച്ച ആധുനിക മലയാളത്തിൽ അൽപം കെട്ടുറപ്പില്ലാത്തതാണ്. ‘ബാബേൽരാജാവായ നെബൂഖദ്നേസർ അവിടെ വിട്ടിരുന്ന ആ ജനത്തിന്മേൽ’ എന്ന പുനഃക്രമീകരണം സ്വാഭാവികവും വ്യക്തവുമാണ്.
