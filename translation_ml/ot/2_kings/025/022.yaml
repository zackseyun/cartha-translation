translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ചരിത്രാഖ്യാനശൈലി. ദീർഘമായ ഹീബ്രു വാക്യഘടന വായനാസൗകര്യത്തിനായി വിഷയമാറ്റം സൂചിപ്പിക്കുന്ന ഡാഷോടെ അവതരിപ്പിച്ചെങ്കിലും, ബന്ധവാക്യങ്ങളും ഭരണനിയമനത്തിന്റെ അർഥവും നിലനിർത്തിയിരിക്കുന്നു.
