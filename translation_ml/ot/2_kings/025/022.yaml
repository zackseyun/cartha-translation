  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: ml
  text: യെഹൂദാദേശത്ത് ശേഷിച്ചിരുന്ന[a] ജനത്തെക്കുറിച്ചാകട്ടെ—ബാബേൽരാജാവായ നെബൂഖദ്നേസർ അവിടെ വിട്ടിരുന്ന ആ ജനത്തിന്മേൽ ശാഫാന്റെ മകനായ അഹീക്കാമിന്റെ മകൻ ഗെദല്യാവിനെ അവൻ നിയമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിട്ടേക്കപ്പെട്ടിരുന്ന”; ഹീബ്രു കൃദന്തരൂപത്തിന് അവിടെ ശേഷിച്ചവർ എന്നും മറ്റൊരാളാൽ അവിടെ വിട്ടേക്കപ്പെട്ടവർ എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: ജനം
  rationale: ദേശത്ത് ശേഷിച്ചവരെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ കൂട്ടനാമം.
- source_word: הַנִּשְׁאָר
  choice: ശേഷിച്ചിരുന്ന
  rationale: שׁאר എന്ന ധാതുവിന്റെ നിഫാൽ കൃദന്തരൂപം ഇവിടെ നാടുകടത്തലിനുശേഷം അവിടെ തുടർന്നവരെ വിവരണാത്മകമായി സൂചിപ്പിക്കുന്നു; ദൈവശാസ്ത്രപരമായി ഭാരം കൂടിയ ‘ശേഷിപ്പ്’ എന്ന നാമരൂപം ഒഴിവാക്കുന്നു.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: യെഹൂദാദേശത്ത്
  rationale: ഭൂപ്രദേശപരമായ അർഥം കാത്തുസൂക്ഷിക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: אֲשֶׁר הִשְׁאִיר
  choice: അവിടെ ശേഷിപ്പിച്ചിരുന്ന
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർത്ഥം നിലനിർത്തി, നെബൂഖദ്നേസർ അവരെ ദേശത്തുതന്നെ വിട്ടുവെച്ചതായി വ്യക്തമാക്കുന്നു.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവായ നെബൂഖദ്നേസർ
  rationale: രാജപദവിയോടുകൂടിയ വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּפְקֵד עֲלֵיהֶם
  choice: അവരുടെമേൽ ... നിയമിച്ചു
  rationale: ഭരണപരമായ മേൽനോട്ടസ്ഥാനത്തേക്ക് നിയമിക്കുക എന്ന פקד + על പ്രയോഗത്തിന്റെ ഔദ്യോഗിക ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: גְּדַלְיָהוּ
  choice: ഗെദല്യാവ്
  rationale: ഹീബ്രു നാമത്തിന്റെ അവസാന ഘടകമായ -യാഹു പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: ശാഫാന്റെ മകനായ അഹീക്കാമിന്റെ മകൻ
  rationale: ഹീബ്രു വംശാവലിക്രമം കൃത്യമായി നിലനിർത്തുകയും ഗെദല്യാവിന്റെ പിതാവിനെയും പിതാമഹനെയും വ്യക്തമായി തിരിച്ചറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: וְ
  choice: …യെക്കുറിച്ചാകട്ടെ
  rationale: മുൻവിവരണത്തിൽനിന്ന് യെഹൂദയിൽ ശേഷിച്ച ജനത്തിലേക്കുള്ള വിഷയമാറ്റം മലയാളത്തിൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
