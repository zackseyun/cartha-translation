  source_fidelity: എബ്രായ പാഠത്തിലെ അളവുകൾ, ഒരു തൂണും അതിന്മേലുള്ള വെങ്കല മകുടവും, മകുടത്തിന്റെ മൂന്നുമുഴം ഉയരവും, ചുറ്റുമുള്ള വലപ്പണിയും മാതളപ്പഴരൂപങ്ങളും, അവയുടെ വെങ്കലനിർമിതത്വവും വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു. അവസാനത്തെ എലിപ്റ്റിക്കൽ വാക്യഭാഗം രണ്ടാമത്തെ തൂണിനും സമാന അലങ്കാരങ്ങൾ ഉണ്ടായിരുന്നുവെന്ന സ്വാഭാവികമായ, പാഠാനുസൃതമായ അർഥത്തിൽ വിവർത്തനം ചെയ്തിരിക്കുന്നു.
  naturalness: വിവർത്തനം ആധുനിക നിലവാരമലയാളത്തിൽ സുഗമവും ഗൗരവമുള്ളതുമാണ്. ‘വലപ്പണി’, ‘മാതളപ്പഴങ്ങളുടെ രൂപങ്ങൾ’, ‘വെങ്കലംകൊണ്ടുള്ളവ’ എന്നിവ വാസ്തുവിവരണസന്ദർഭത്തിൽ വ്യക്തമാണ്. ‘മകുടം’ ഇവിടെ തൂണിന്റെ അലങ്കാരമുകളറ്റം എന്ന സന്ദർഭാർഥത്തിൽ മനസ്സിലാക്കാവുന്നതാണ്.
  terminology: ‘തൂൺ’ (עַמּוּד), ‘ഉയരം’ (קוֹמַת), ‘മകുടം’ (כֹתֶרֶת), ‘വെങ്കലം’ (נְחֹשֶׁת), ‘വലപ്പണി’ (שְׂבָכָה) എന്നിവ യോജിച്ചതാണ്. רִמֹּנִים അലങ്കാരരൂപങ്ങളാണെന്ന സന്ദർഭാർഥം ‘മാതളപ്പഴങ്ങളുടെ രൂപങ്ങൾ’ എന്നതിലൂടെ ഉചിതമായി വ്യക്തമാകുന്നു.
