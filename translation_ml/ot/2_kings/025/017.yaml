translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാസ്തുവിവരണശൈലി. സാങ്കേതികതയും പൊതുവായ വായനാസൗകര്യവും തുലനം ചെയ്യാൻ ‘മകുടം’, ‘വലപ്പണി’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
