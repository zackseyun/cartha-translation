source:
  edition: WLC
  text: שְׁמֹנֶה֩ עֶשְׂרֵ֨ה אַמָּ֜ה קוֹמַ֣ת הָ/עַמּ֣וּד הָ/אֶחָ֗ד וְ/כֹתֶ֨רֶת עָלָ֥י/ו נְחֹשֶׁת֮ וְ/קוֹמַ֣ת הַ/כֹּתֶרֶת֮ שָׁלֹ֣שׁ אמה וּ/שְׂבָכָ֨ה וְ/רִמֹּנִ֧ים עַֽל הַ/כֹּתֶ֛רֶת סָבִ֖יב הַ/כֹּ֣ל נְחֹ֑שֶׁת וְ/כָ/אֵ֛לֶּה לַֽ/עַמּ֥וּד הַ/שֵּׁנִ֖י עַל הַ/שְּׂבָכָֽה׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
translation:
  language: ml
  text: ഒരു തൂണിന്റെ ഉയരം പതിനെട്ടു മുഴം ആയിരുന്നു.[a] അതിന്മേൽ വെങ്കലനിർമിതമായ ഒരു മകുടം ഉണ്ടായിരുന്നു. ആ മകുടത്തിന്റെ ഉയരം മൂന്നു മുഴം ആയിരുന്നു. മകുടത്തിനുചുറ്റും വലപ്പണിയും മാതളപ്പഴങ്ങളുടെ രൂപങ്ങളും ഉണ്ടായിരുന്നു; അവയെല്ലാം വെങ്കലംകൊണ്ടുള്ളവയായിരുന്നു. രണ്ടാമത്തെ തൂണിനും വലപ്പണിയോടുകൂടെ ഇതേ അലങ്കാരങ്ങൾ ഉണ്ടായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഒരു മുഴം ഏകദേശം 45 സെന്റിമീറ്റർ; അതിനാൽ പതിനെട്ടു മുഴം ഏകദേശം 8.1 മീറ്റർ.
    reason: അളവിന്റെ പുരാതന ഏകകത്തിന് ആധുനിക ഏകദേശമൂല്യം നൽകുന്നു.
  - marker: b
    text: അവസാന ഭാഗം എബ്രായത്തിൽ അപൂർണവാക്യരൂപത്തിലാണ്; അക്ഷരാർഥത്തിൽ, ‘വലപ്പണിയിന്മേൽ ഇവപോലെതന്നെ രണ്ടാമത്തെ തൂണിനും.’ രണ്ടാമത്തെ തൂണിലും സമാനമായ അലങ്കാരങ്ങൾ ഉണ്ടായിരുന്നുവെന്നാണ് ആശയം.
    reason: മൂലപാഠത്തിലെ വ്യാകരണപരമായ സംക്ഷിപ്തതയും അതിന്റെ സാധ്യതയുള്ള അർഥവും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: קוֹמַת
  choice: ഉയരം
  rationale: קוֹמָהയുടെ നിർമാണരൂപം ഇവിടെ തൂണിന്റെയും മകുടത്തിന്റെയും ലംബമായ അളവിനെ സൂചിപ്പിക്കുന്നു; ‘ഉയരം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עַמּוּד
  choice: തൂൺ
  rationale: ക്ഷേത്രവാസ്തുവിലെ സ്വതന്ത്രമായി നിൽക്കുന്ന വലിയ pillar/column എന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כֹתֶרֶת
  choice: മകുടം
  rationale: തൂണിന്റെ മുകളിലുള്ള അലങ്കാരഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മകുടം’ മാന്യവും വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ വാസ്തുശില്പപദമാണ്; രാജകിരീടം എന്ന അർഥമല്ലെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: പുരാതന ക്ഷേത്രോപകരണങ്ങളുടെ ലോഹത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും ചരിത്രപരമായി യോജിച്ചതുമായ മലയാളപദം; ‘പിച്ചള’ ഇവിടെ അനുപയോഗിയാണ്.
- source_word: שְׂבָכָה
  choice: വലപ്പണി
  rationale: വലപോലുള്ള അലങ്കാരഘടനയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൃത്യരൂപം പൂർണമായി നിശ്ചയിക്കാനാവാത്തതിനാൽ അടിക്കുറിപ്പിൽ ‘വലക്കെട്ട്’ എന്ന സാധ്യതയും നൽകുന്നു.
- source_word: רִמֹּנִים
  choice: മാതളപ്പഴങ്ങളുടെ രൂപങ്ങൾ
  rationale: പദത്തിന്റെ അക്ഷരാർഥമായ ‘മാതളപ്പഴങ്ങൾ’ നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ യഥാർഥ പഴങ്ങളല്ല അലങ്കാരരൂപങ്ങളാണെന്ന് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: അലങ്കാരങ്ങൾ മകുടത്തെ വലയം ചെയ്തിരുന്നുവെന്ന സ്ഥലപരമായ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: അവയെല്ലാം വെങ്കലംകൊണ്ടുള്ളവയായിരുന്നു
  rationale: വലപ്പണിയും മാതളരൂപങ്ങളും ഉൾപ്പെടുന്ന അലങ്കാരഘടകങ്ങളുടെ ലോഹഘടനയെ വ്യക്തമായി സംഗ്രഹിക്കുന്നു.
- source_word: וְכָאֵלֶּה ... עַל הַשְּׂבָכָה
  choice: രണ്ടാമത്തെ തൂണിനും വലപ്പണിയോടുകൂടെ ഇതേ അലങ്കാരങ്ങൾ ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ അപൂർണവാക്യരൂപം സൂചിപ്പിക്കുന്ന സാമ്യം വായനയോഗ്യമായി വ്യക്തമാക്കുന്നു; പുതിയ വിശദാംശം ചേർക്കാതെ ആദ്യ തൂണിന്റെ അലങ്കാരങ്ങളിലേക്കു തിരിച്ചുചൂണ്ടുന്നു.
