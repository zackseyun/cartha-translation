  to: 'ഗെദല്യാവ് അവരോടും അവരുടെ ആളുകളോടും ശപഥം ചെയ്തു. അവരോടു പറഞ്ഞു: “കൽദയരുടെ സേവകരെ ഭയപ്പെടേണ്ടാ. ദേശത്ത് പാർത്ത് ബാബേൽരാജാവിനെ സേവിക്കുക; അപ്പോൾ നിങ്ങൾക്കു നന്നായിരിക്കും.”'
