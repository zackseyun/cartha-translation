id: 2KI.25.24
reference: 2 Kings 25:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֨ע לָ/הֶ֤ם גְּדַלְיָ֨הוּ֙ וּ/לְ/אַנְשֵׁי/הֶ֔ם וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַל תִּֽירְא֖וּ מֵ/עַבְדֵ֣י הַ/כַּשְׂדִּ֑ים שְׁב֣וּ בָ/אָ֗רֶץ וְ/עִבְד֛וּ אֶת מֶ֥לֶךְ בָּבֶ֖ל וְ/יִטַ֥ב לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
translation:
  language: ml
  text: 'ഗെദല്യാവ് അവരോടും അവരുടെ ആളുകളോടും ശപഥം ചെയ്തു. അവരോടു പറഞ്ഞു: “കൽദയരുടെ സേവകരെ ഭയപ്പെടേണ്ടാ. ദേശത്ത് പാർത്ത് ബാബേൽരാജാവിനെ സേവിക്കുക; അപ്പോൾ നിങ്ങൾക്കു നന്നായിരിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: സത്യംചെയ്ത്
  rationale: നിഫാൽ രൂപത്തിലുള്ള שׁבע എന്ന ക്രിയയുടെ ‘സത്യം ചെയ്യുക/ശപഥം ചെയ്യുക’ എന്ന അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: וּלְאַנְשֵׁיהֶם
  choice: അവരുടെ ആളുകളോടും
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അവരുടെ പുരുഷന്മാർ’ എന്നതിനെക്കാൾ ആ നേതാക്കളോടൊപ്പമുള്ള ആളുകളെയോ അനുചരരെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; സൈനികർ എന്ന് അതിവ്യക്തമാക്കുന്നില്ല.
- source_word: אַל תִּירְאוּ
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധ ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്ന, dignified modern Malayalam rendering.
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  choice: കൽദയരുടെ സേവകരെ
  rationale: עבדים എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘സേവകർ’ നിലനിർത്തുന്നു; ഇവിടെ ഉദ്യോഗസ്ഥരോ പ്രതിനിധികളോ ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെങ്കിലും അത് മുഖ്യപാഠത്തിൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: הַכַּשְׂדִּים
  choice: കൽദയർ
  rationale: എബ്രായ വംശനാമം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ബാബിലോണ്യരെ സൂചിപ്പിക്കുന്നു.
- source_word: שְׁבוּ בָאָרֶץ
  choice: ദേശത്ത് പാർത്ത്
  rationale: ישב എന്നതിന്റെ താമസിക്കുക/പാർക്കുക എന്ന സന്ദർഭോചിത അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: ബാബേൽരാജാവിനെ സേവിക്കുക
  rationale: രാഷ്ട്രീയ കീഴ്വഴക്കത്തിന്റെ ഭാവം ഉൾക്കൊള്ളുന്ന עבד എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ‘സേവിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: וְיִטַב לָכֶם
  choice: അപ്പോൾ നിങ്ങൾക്കു നന്നായിരിക്കും
  rationale: ‘നിങ്ങൾക്കു നല്ലതായിരിക്കും/കാര്യങ്ങൾ നന്നായി നടക്കും’ എന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അപ്പോൾ’ ഫലബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൽദയർ’, ‘ബാബേൽരാജാവ്’ എന്നീ പരമ്പരാഗത ബൈബിൾ നാമരൂപങ്ങൾ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് സൂചകങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടുന്നില്ല: [a] ‘their men’ എന്നതിനു ശേഷം നൽകിയിട്ടും കുറിപ്പ് ‘servants of the Chaldeans’ വിശദീകരിക്കുന്നു; [b] ‘king of Babylon’ എന്നതിനു ശേഷം നൽകിയിട്ടും ‘Chaldeans’ വിശദീകരിക്കുന്നു. അതിനാൽ തെറ്റിദ്ധരിപ്പിക്കുന്ന അടിക്കുറിപ്പുകൾ ഉൾപ്പെടുത്തിയിട്ടില്ല.'
