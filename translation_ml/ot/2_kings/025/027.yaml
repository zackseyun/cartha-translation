  naturalness: വാക്യം ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ള ആഖ്യാനരജിസ്റ്ററിനൊത്തതുമാണ്. ദീർഘമായ ഹീബ്രു തീയതിസൂത്രം വ്യക്തമായി വായിക്കാനാകുന്നു.
