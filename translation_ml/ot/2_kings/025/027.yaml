  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וְ/שִׁבְעָ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מָלְכ֗/וֹ אֶת רֹ֛אשׁ יְהוֹיָכִ֥ין מֶֽלֶךְ יְהוּדָ֖ה מִ/בֵּ֥ית כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
translation:
  language: ml
  text: യഹൂദാരാജാവായ യെഹോയാഖീൻ പ്രവാസത്തിലായതിന്റെ മുപ്പത്തേഴാം വർഷം, പന്ത്രണ്ടാം മാസം, ആ മാസത്തിന്റെ ഇരുപത്തേഴാം ദിവസം, ബാബേൽരാജാവായ എവീൽ-മെരോദക്ക്[b] തന്റെ വാഴ്ചയുടെ വർഷത്തിൽ[c] യഹൂദാരാജാവായ യെഹോയാഖീന്റെ തല ഉയർത്തി[a] അവനെ കാരാഗൃഹത്തിൽനിന്നു പുറത്തുകൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തല ഉയർത്തി’ എന്നത് ഒരാളുടെ നില ഉയർത്തുകയോ അയാളോടു പ്രീതി കാണിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; ഇവിടെ യെഹോയാഖീനെ കാരാഗൃഹത്തിൽനിന്നു മോചിപ്പിച്ചതും അതിൽ ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എവീൽ-മെരോദക്ക് ചരിത്രരേഖകളിൽ അമേൽ-മർദുക്ക് എന്നും അറിയപ്പെടുന്നു.
    reason: cultural_note
  - marker: c
    text: ‘തന്റെ വാഴ്ചയുടെ വർഷത്തിൽ’ എന്നത് ‘തന്റെ വാഴ്ചയുടെ ഒന്നാം വർഷത്തിൽ’ എന്നർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: (മലയാളത്തിലെ കാലസൂചനാ വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി)
  rationale: പുതിയ സംഭവഘട്ടം അവതരിപ്പിക്കുന്ന ഹീബ്രു ആഖ്യാനരൂപമാണിത്. ‘സംഭവിച്ചു’ എന്ന് വേർതിരിച്ചു ചേർക്കുന്നതിനെക്കാൾ തീയതിവാക്യത്തോടു നേരിട്ട് സംഭവം ബന്ധിപ്പിക്കുന്നത് സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: לְגָלוּת
  choice: പ്രവാസത്തിലായതിന്റെ
  rationale: גָּלוּת നിർബന്ധിത നാടുകടത്തലിനെയും അതിന്റെ ഫലമായ പ്രവാസാവസ്ഥയെയും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ യെഹോയാഖീന്റെ പ്രവാസത്തിന്റെ കാലഗണനയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: יְהוֹיָכִין
  choice: യെഹോയാഖീൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: പന്ത്രണ്ടാം മാസം
  rationale: ഹീബ്രു തീയതിപ്രയോഗത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ
  choice: ആ മാസത്തിന്റെ ഇരുപത്തേഴാം ദിവസം
  rationale: ദിവസം എന്ന ആശയം വ്യക്തമായി ചേർത്ത് ഹീബ്രു തീയതിസൂത്രത്തിന്റെ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: אֱוִיל מְרֹדַךְ
  choice: എവീൽ-മെരോദക്ക്
  rationale: ഹീബ്രു പാഠത്തിലെ ബാബിലോന്യ രാജനാമത്തിന്റെ അടുത്ത മലയാള ലിപ്യന്തരണം; ചരിത്രപരമായ അക്കാദിയൻ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בִּשְׁנַת מָלְכוֹ
  choice: തന്റെ വാഴ്ചയുടെ വർഷത്തിൽ
  rationale: ‘അവന്റെ വാഴ്ചയുടെ/രാജത്വത്തിന്റെ വർഷത്തിൽ’ എന്ന ഹീബ്രു ഘടനയെ അതിരുകടന്ന് ‘ഒന്നാം വർഷം’ എന്നു മുഖ്യപാഠത്തിൽ നിർണ്ണയിക്കാതെ നിലനിർത്തുന്നു.
- source_word: נָשָׂא ... אֶת רֹאשׁ
  choice: തല ഉയർത്തി
  rationale: പദപ്രയോഗത്തിന്റെ രൂപകസ്വഭാവവും പദസമീപതയും സംരക്ഷിക്കുന്നു; ഇവിടെ പദവിയുയർത്തുകയോ പ്രീതി കാണിക്കുകയോ ചെയ്യുന്നതാണ് അർഥമെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: מִבֵּית כֶּלֶא
  choice: കാരാഗൃഹത്തിൽനിന്നു പുറത്തുകൊണ്ടുവന്നു
  rationale: തടവുസ്ഥലത്തിൽനിന്നുള്ള മോചനമാണ് സന്ദർഭാർഥം. ‘പുറത്തുകൊണ്ടുവന്നു’ എന്നത് ഹീബ്രു മുൻസർഗത്തിന്റെ ദിശാസൂചന മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘തല ഉയർത്തി’ എന്ന രാജകീയ പദപ്രയോഗത്തിന്റെ അർഥം
  choice: രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, മോചനവും പദവിയുയർത്തലും അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘പ്രീതി കാണിച്ച് മോചിപ്പിച്ചു’ അല്ലെങ്കിൽ ‘പദവി ഉയർത്തി’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: പദപ്രയോഗത്തിലെ രാജകീയ പുനഃസ്ഥാപനസൂചനയും അതിന്റെ അർഥവ്യാപ്തിയും നഷ്ടപ്പെടാതെ, സന്ദർഭത്തിലെ പ്രായോഗിക ഫലം വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- issue: בִּשְׁנַת מָלְכוֹ സൂചിപ്പിക്കുന്ന ഭരണവർഷം
  choice: ‘തന്റെ വാഴ്ചയുടെ വർഷത്തിൽ’ എന്ന നിർണ്ണയിക്കാത്ത രൂപം.
  alternative: ‘തന്റെ വാഴ്ചയുടെ ഒന്നാം വർഷത്തിൽ’ അല്ലെങ്കിൽ ‘രാജാവായ വർഷത്തിൽ’.
  rationale: ഒന്നാം ഭരണവർഷമാണ് ഉദ്ദേശ്യമെന്നത് സന്ദർഭത്തിലും സമാന്തരപാഠത്തിലും സാദ്ധ്യമാണെങ്കിലും, ലഭ്യമായ ഹീബ്രു പാഠത്തിൽ ‘ഒന്നാം’ എന്ന സംഖ്യ വ്യക്തമല്ല; അതിനാൽ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി സ്വീകരിച്ചു. തീയതിസൂത്രം വായിക്കാൻ സ്വാഭാവികമാക്കി; എന്നാൽ രാജകീയ പദപ്രയോഗവും ഭരണവർഷത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദങ്ങളുടെ പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
