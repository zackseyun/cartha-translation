  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
translation:
  language: ml
  text: അപ്പോൾ, ചെറിയവർ മുതൽ വലിയവർ വരെ, ജനമെല്ലാവരും സൈന്യാധിപന്മാരും എഴുന്നേറ്റ് ഈജിപ്തിലേക്കു പോയി; കാരണം, അവർ കൽദായരെ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ കഥനക്രമത്തിലുള്ള നിർണായക പ്രവർത്തനം നിലനിർത്തുന്നു; വെറും നിൽക്കുന്നതായോ പുറപ്പെടുന്നതായോ അർഥം ചുരുക്കുന്നില്ല.
- source_word: כָל הָעָם
  choice: ജനമെല്ലാവരും
  rationale: സമൂഹത്തിന്റെ സമഗ്രത വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: ചെറിയവൻമുതൽ വലിയവൻവരെ
  rationale: പ്രായം മാത്രമല്ല, പദവി, പ്രാധാന്യം, സാമൂഹികനില എന്നിവയിലുടനീളമുള്ള സമഗ്രത സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: וְשָׂרֵי הַחֲיָלִים
  choice: സൈന്യാധിപന്മാരും
  rationale: שָׂרֵי എന്നത് നേതാക്കളെയും חֲיָלִים ഇവിടെ സൈനികസേനകളെയും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: וַיָּבֹאוּ מִצְרָיִם
  choice: ഈജിപ്തിലേക്കു പോയി
  rationale: בוא അടിസ്ഥാനമായി വരുക/ചെന്നെത്തുക എന്നാണെങ്കിലും, കഥാകൃത്തിന്റെ ദൃഷ്ടികോണത്തിൽ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം മലയാളത്തിൽ ‘പോയി’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം.
- source_word: כִּי
  choice: കാരണം
  rationale: അവർ ഈജിപ്തിലേക്കു പോയതിന്റെ കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: יָרְאוּ
  choice: ഭയപ്പെട്ടു
  rationale: ഭയം സൂചിപ്പിക്കുന്ന ക്രിയയെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִפְּנֵי כַשְׂדִּים
  choice: കൽദയരെ
  rationale: ירא സഹിതമുള്ള מִפְּנֵי ഒരാളെ ഭയപ്പെടുക എന്ന ആശയം നൽകുന്നു; ‘കൽദയർ’ ചരിത്രപരമായ ജനനാമമായി നിലനിർത്തുന്നു.
