  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. വാക്യത്തിലെ സമഗ്രതയും കാരണബന്ധവും നിലനിർത്തിയിരിക്കുന്നു; മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
