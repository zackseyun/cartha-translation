translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായ വാക്യത്തിലെ പട്ടികക്രമം നിലനിർത്തി; സൈനിക-രാഷ്ട്രീയ പ്രയോഗത്തിന്റെ അർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
