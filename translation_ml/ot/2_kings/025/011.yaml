  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָפְלוּ֙ עַל הַ/מֶּ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הֶ/הָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
translation:
  language: ml
  text: നഗരത്തിൽ ശേഷിച്ച ജനത്തെയും, ബാബേൽ രാജാവിന്റെ പക്ഷത്തേക്കു കൂറുമാറിയവരെയും[a], ശേഷിച്ച ജനസമൂഹത്തെയും[c], അംഗരക്ഷകസേനയുടെ അധിപനായ[b] നെബൂസരദാൻ പ്രവാസത്തിലേക്കു കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബാബേൽ രാജാവിന്റെ പക്ഷത്തേക്കു ചേർന്നവർ’; അക്ഷരാർഥത്തിൽ, ‘ബാബേൽ രാജാവിന്റെ അടുക്കലേക്കു വീണവർ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘കൊല്ലുന്നവരുടെ തലവൻ’; രാജകീയ അംഗരക്ഷകസേനയുടെ അധിപനെ സൂചിപ്പിക്കുന്ന ഔദ്യോഗിക പദവിയായിരിക്കാം.
    reason: cultural_note
  - marker: c
    text: ‘ശേഷിച്ച ജനക്കൂട്ടം’ അല്ലെങ്കിൽ ‘ശേഷിച്ച ജനസംഖ്യ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: നഗരത്തിൽ ശേഷിച്ച ജനം
  rationale: ഉപരോധത്തിനും മുൻനടപടികൾക്കും ശേഷം നഗരത്തിൽ അവശേഷിച്ചവരെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל הַמֶּלֶךְ בָּבֶל
  choice: ബാബേൽ രാജാവിന്റെ പക്ഷത്തേക്കു കൂറുമാറിയവർ
  rationale: נפל על എന്നത് ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ‘വീഴുക’ എന്നല്ല, സൈനിക-രാഷ്ട്രീയ സാഹചര്യത്തിൽ മറുപക്ഷത്തേക്കു ചേരുക എന്ന പ്രയോഗമാണ്. ‘കൂറുമാറിയവർ’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: יֶתֶר הֶהָמוֹן
  choice: ശേഷിച്ച ജനസമൂഹം
  rationale: הָמוֹן ഒരു വലിയ ജനക്കൂട്ടത്തെയോ ജനസമൂഹത്തെയോ സൂചിപ്പിക്കാം. ‘ജനസമൂഹം’ സാമൂഹികവിഭാഗം അനാവശ്യമായി നിർണ്ണയിക്കാതെ വിശാലമായ കൂട്ടാർഥം നിലനിർത്തുന്നു.
- source_word: הֶגְלָה
  choice: പ്രവാസത്തിലേക്കു കൊണ്ടുപോയി
  rationale: ഹിഫീൽ രൂപം നിർബന്ധിത നാടുകടത്തലിനെ സൂചിപ്പിക്കുന്നു; ‘പ്രവാസത്തിലേക്കു കൊണ്ടുപോയി’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ ചലനവും ഫലവും പ്രകടിപ്പിക്കുന്നു.
- source_word: רַב טַבָּחִים
  choice: അംഗരക്ഷകസേനയുടെ അധിപൻ
  rationale: അക്ഷരാർഥം തെറ്റിദ്ധരിപ്പിക്കാൻ ഇടയുള്ളതിനാൽ ബാബിലോന്യ രാജകീയ ഉദ്യോഗപദവിയുടെ പ്രവർത്തനാർഥമാണ് മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നത്.
- source_word: נְבוּזַרְאֲדָן
  choice: നെബൂസരദാൻ
  rationale: പേരിന്റെ മലയാളത്തിലെ വ്യക്തവും പരമ്പരാഗതവുമായ ലിപ്യന്തരണം.
