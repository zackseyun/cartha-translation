  source_fidelity: എബ്രായത്തിലെ മൂന്ന് കർമഘടകങ്ങളും—നഗരത്തിൽ ശേഷിച്ച ജനം, ബാബേൽരാജാവിന്റെ പക്ഷത്തേക്കു കൂറുമാറിയവർ, ശേഷിച്ച ജനസമൂഹം—കൃത്യമായി പ്രതിഫലിക്കുന്നു. הֶגְלָהയുടെ നിർബന്ധിത നാടുകടത്തൽ അർഥം «പ്രവാസത്തിലേക്കു കൊണ്ടുപോയി» എന്നതിൽ നിലനിൽക്കുന്നു. רַב־טַבָּחִים എന്ന ഔദ്യോഗിക പദവിക്ക് സന്ദർഭോചിതമായ പ്രവർത്തനാർഥം നൽകിയിരിക്കുന്നു.
