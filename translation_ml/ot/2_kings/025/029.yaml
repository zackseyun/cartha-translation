  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായത്തിലെ ‘അപ്പം ഭക്ഷിച്ചു’ എന്ന പ്രയോഗം അക്ഷരാർഥമായി പകർത്താതെ ‘ഭക്ഷണം കഴിച്ചു’ എന്നു നൽകി; לְפָנָיו എന്നതിലെ വിശാലമായ അർഥം നിലനിർത്തി, രാജമേശയിലെ ഭക്ഷണസഹവാസമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
