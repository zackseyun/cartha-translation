  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שִׁנָּ֕א אֵ֖ת בִּגְדֵ֣י כִלְא֑/וֹ וְ/אָכַ֨ל לֶ֧חֶם תָּמִ֛יד לְ/פָנָ֖י/ו כָּל יְמֵ֥י חַיָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/029.yaml
  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
translation:
  language: ml
  text: അവൻ തന്റെ തടവിലെ വസ്ത്രങ്ങൾ മാറ്റി. തന്റെ ജീവിതകാലം മുഴുവൻ അവൻ എല്ലാ ദിവസവും രാജാവിന്റെ മുമ്പാകെ[a] ഭക്ഷണം കഴിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷ. “അവന്റെ മുമ്പാകെ.” ഈ പ്രയോഗം രാജാവിന്റെ സന്നിധിയിലോ രാജാവിന്റെ മേശയിൽ ഭക്ഷണം കഴിക്കുന്നതോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּא
  choice: അവൻ ... മാറ്റി
  rationale: പിയേൽ രൂപത്തിലുള്ള שׁנה ഇവിടെ ‘മാറ്റുക’ എന്നാണ്; തടവുവസ്ത്രങ്ങൾ മാറ്റിയെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בִּגְדֵי כִלְאוֹ
  choice: തന്റെ തടവുവസ്ത്രങ്ങൾ
  rationale: ‘തന്റെ തടവിന്റെ വസ്ത്രങ്ങൾ’ എന്ന എബ്രായ ഘടനയുടെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: וְאָכַל לֶחֶם
  choice: ഭക്ഷണം കഴിച്ചു
  rationale: അക്ഷരാർഥം ‘അപ്പം ഭക്ഷിച്ചു’ എന്നാണെങ്കിലും, ഇവിടെ പതിവായി ഭക്ഷണം കഴിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമായതിനാൽ സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു.
- source_word: תָּמִיד
  choice: പതിവായി
  rationale: രാജസന്നിധിയിൽ തുടർച്ചയായി ലഭിച്ചിരുന്ന നിത്യഭക്ഷണക്രമത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘പതിവായി’ ആവർത്തിച്ചുള്ള സ്ഥിരത വ്യക്തമാക്കുന്നു.
- source_word: לְפָנָיו
  choice: രാജാവിന്റെ മുമ്പാകെ
  rationale: അക്ഷരാർഥം ‘അവന്റെ മുമ്പാകെ’ എന്നാണ്. സന്ദർഭത്തിലെ വ്യക്തമായ സൂചിതനായ രാജാവിനെ മലയാളത്തിൽ വ്യക്തമാക്കിയെങ്കിലും, രാജാവിന്റെ മേശയിൽ ഭക്ഷിച്ചു എന്ന കൂടുതൽ പ്രത്യേകമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: כָּל יְמֵי חַיָּיו
  choice: തന്റെ ജീവിതകാലം മുഴുവൻ
  rationale: ജീവിതകാലം മുഴുവനുമുള്ള ദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപമാണിത്.
