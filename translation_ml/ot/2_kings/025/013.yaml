  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר בֵּית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
translation:
  language: ml
  text: യഹോവയുടെ ആലയത്തിലുണ്ടായിരുന്ന വെങ്കലത്തൂണുകളും താങ്ങുപീഠങ്ങളും[a], യഹോവയുടെ ആലയത്തിലുണ്ടായിരുന്ന വെങ്കലക്കടലും കൽദയർ[b] തുണ്ടുതുണ്ടാക്കി; അവയുടെ വെങ്കലം അവർ ബാബേലിലേക്കു കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താങ്ങുപീഠങ്ങൾ’ എന്നതിന് ‘അടിത്തറകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം (מְכֹנוֹת) ക്ഷേത്രത്തിലെ കഴുകുതൊട്ടികളെ താങ്ങിയിരുന്ന ഘടനകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കൽദയർ’ എന്നത് ഇവിടെ ബാബിലോണ്യ സൈന്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: വെങ്കലത്തൂണുകൾ
  rationale: עַמּוּדִים എന്നത് തൂണുകളെ സൂചിപ്പിക്കുന്നു; ക്ഷേത്രോപകരണങ്ങളുടെ സന്ദർഭത്തിൽ נְחֹשֶׁת എന്നതിന് സ്വാഭാവികമായ ആധുനിക പദം ‘വെങ്കലം’ ആണ്.
- source_word: אֲשֶׁר בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയത്തിലുണ്ടായിരുന്ന
  rationale: ക്രിയയില്ലാത്ത എബ്രായ ആപേക്ഷികവാക്യം ഇവിടെ വസ്തുക്കളുടെ സ്ഥാനം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർത്ഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַמְּכֹנוֹת
  choice: പീഠങ്ങൾ
  rationale: ക്ഷേത്രത്തിലെ കഴുകുതൊട്ടികളെ താങ്ങിയിരുന്ന ഘടനകളെയാണ് מְכֹנוֹת സൂചിപ്പിക്കുന്നത്; ‘പീഠങ്ങൾ’ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന സംക്ഷിപ്ത പദമാണ്.
- source_word: יָם הַנְּחֹשֶׁת
  choice: വെങ്കലക്കടൽ
  rationale: വലിയ ക്ഷേത്രജലസംഭരണിയുടെ സവിശേഷ നാമമായ ‘കടൽ’ നിലനിർത്തുന്നത് മൂലപാഠത്തിലെ ദൃശ്യരൂപവും പ്രത്യേക ഉപകരണനാമവും സംരക്ഷിക്കുന്നു.
- source_word: שִׁבְּרוּ
  choice: തകർത്തു കഷണങ്ങളാക്കി
  rationale: കൊണ്ടുപോകുന്നതിനായി വലിയ വെങ്കലവസ്തുക്കൾ പൊളിച്ചുതകർത്ത പ്രവൃത്തിയെ ഈ പ്രയോഗം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: כַשְׂדִּים
  choice: കൽദയർ
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ജനനാമം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അത് ബാബിലോണ്യ സൈന്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּשְׂאוּ
  choice: കൊണ്ടുപോയി
  rationale: נשא ഇവിടെ കൊള്ളവസ്തുവായി എടുത്തുകൊണ്ടുപോകുക എന്ന സന്ദർഭാർഥത്തിലാണ്.
- source_word: נְחֻשְׁתָּם
  choice: അവയിലെ വെങ്കലം
  rationale: മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം മുമ്പ് പറഞ്ഞ തകർക്കപ്പെട്ട വസ്തുക്കളിലേക്കാണ് മടങ്ങുന്നത്; ‘അവയിലെ വെങ്കലം’ മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בָּבֶלָה
  choice: ബാബേലിലേക്കു
  rationale: ദിശാസൂചകമായ -ה പ്രത്യയം ബാബേലിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം ഉപയോഗിച്ചു.
- issue: יָם എന്ന ക്ഷേത്രോപകരണനാമം
  choice: വെങ്കലക്കടൽ
  alternative: വെങ്കലത്തൊട്ടി
  rationale: ‘തൊട്ടി’ പ്രവർത്തനത്തെ വിശദീകരിക്കുമെങ്കിലും മൂലപാഠത്തിലെ ‘കടൽ’ എന്ന സവിശേഷ നാമവും പ്രതീകാത്മക ദൃശ്യരൂപവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ക്ഷേത്രസന്ദർഭത്തിലെ സാങ്കേതിക പദങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകിയിരിക്കുന്നു; മൂലത്തിലെ ‘കടൽ’ എന്ന പ്രത്യേക നാമവും ‘കൽദയർ’ എന്ന ജനനാമവും നിലനിർത്തി.
