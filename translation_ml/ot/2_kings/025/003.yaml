id: 2KI.25.3
reference: 2 Kings 25:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/תִשְׁעָ֣ה לַ/חֹ֔דֶשׁ וַ/יֶּחֱזַ֥ק הָ/רָעָ֖ב בָּ/עִ֑יר וְ/לֹא הָ֥יָה לֶ֖חֶם לְ/עַ֥ם הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/003.yaml
  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
translation:
  language: ml
  text: മാസത്തിന്റെ ഒൻപതാം ദിവസം നഗരത്തിൽ ക്ഷാമം രൂക്ഷമായി; ദേശത്തിലെ ജനങ്ങൾക്ക്[b] അപ്പം[a] ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഭക്ഷണം’; ‘അപ്പം’ എന്ന പദം ഉപജീവനത്തിനുള്ള ഭക്ഷണത്തെ പൊതുവായി സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
  - marker: b
    text: ‘ദേശത്തിലെ ജനങ്ങൾ’ എന്ന പ്രയോഗം ചില സന്ദർഭങ്ങളിൽ സാധാരണ ജനങ്ങളെയോ തദ്ദേശവാസികളെയോ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: മാസത്തിന്റെ ഒൻപതാം ദിവസം
  rationale: എബ്രായയിൽ അക്ഷരാർഥത്തിൽ ‘മാസത്തിന്റെ ഒൻപതാം തീയതിയിൽ’ എന്നാണുള്ളത്; സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിനായി ‘ദിവസം’ ചേർത്തു.
- source_word: וַיֶּחֱזַק
  choice: രൂക്ഷമായി
  rationale: חזק എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ശക്തമാകുക’ എന്നാണ്. ക്ഷാമത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘രൂക്ഷമായി’ എന്നത് അതിന്റെ തീവ്രത വർധിച്ചതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הָרָעָב
  choice: ക്ഷാമം
  rationale: ഉപരോധത്തിന്റെ ചരിത്രസന്ദർഭത്തിൽ רָעָב വെറും വിശപ്പല്ല, ഭക്ഷ്യക്ഷാമത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בָּעִיר
  choice: നഗരത്തിൽ
  rationale: സ്ഥാനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: അപ്പം ഉണ്ടായിരുന്നില്ല
  rationale: לֶחֶם എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘അപ്പം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി; ഇത് വിശാലമായി ‘ഭക്ഷണം’ എന്നും അർഥമാക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: לְעַם הָאָרֶץ
  choice: ദേശത്തിലെ ജനങ്ങൾക്ക്
  rationale: ‘ദേശത്തിലെ ജനങ്ങൾ’ എന്ന രൂപം എബ്രായപ്രയോഗത്തിന്റെ യഥാർഥ വ്യാപ്തി നിലനിർത്തുന്നു; ‘സാധാരണ ജനങ്ങൾ’ എന്ന കൂടുതൽ പരിമിതമായ സാമൂഹിക അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചുമത്തുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ദൃശ്യമായ ‘അപ്പം’ എന്ന പദവും ‘ദേശത്തിലെ ജനങ്ങൾ’ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തിയും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോട് പൊരുത്തപ്പെട്ടിരുന്നില്ല; അതിനാൽ [a] ‘അപ്പം’ എന്നതിനോടും [b] ‘ദേശത്തിലെ ജനങ്ങൾക്ക്’ എന്നതിനോടും ചേർത്തു.
