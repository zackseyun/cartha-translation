id: 2KI.25.16
reference: 2 Kings 25:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם הָֽ/אֶחָד֙ וְ/הַ/מְּכֹנ֔וֹת אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֹ֖שֶׁת כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/016.yaml
  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
translation:
  language: ml
  text: യഹോവയുടെ ആലയത്തിനായി ശലോമോൻ ഉണ്ടാക്കിയ രണ്ടു തൂണുകൾ, ഒരു ‘കടൽ’[a], താങ്ങുപീഠങ്ങൾ—ഈ എല്ലാ ഉപകരണങ്ങളുടെയും വെങ്കലം തൂക്കിയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കടൽ’ എന്നത് ആലയത്തിലെ വലിയ വെങ്കല ജലസംഭരണിയുടെ പേരാണ്.
    reason: സന്ദർഭത്തിൽ יָם സാധാരണ സമുദ്രത്തെയല്ല, പ്രത്യേകമായ ആലയോപകരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “ഈ എല്ലാ ഉപകരണങ്ങളുടെയും വെങ്കലത്തിന് തൂക്കമില്ലായിരുന്നു.” സന്ദർഭത്തിൽ, വെങ്കലം വളരെ അധികമായിരുന്നതിനാൽ അത് തൂക്കിയില്ല എന്നാണ് അർഥം.'
    reason: מִשְׁקָל എന്ന പദത്തിന് ‘തൂക്കം’ എന്നും ‘തൂക്കൽ’ എന്നും അർഥസാധ്യതയുള്ളതിനാൽ മൂലപാഠത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: രണ്ടു തൂണുകൾ
  rationale: עַמּוּדִים ആലയത്തിലെ ഘടനാപരവും അലങ്കാരപരവുമായ തൂണുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തൂണുകൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַיָּם הָאֶחָד
  choice: ഒരു ‘കടൽ’
  rationale: יָם ഇവിടെ ശലോമോന്റെ ആലയത്തിലെ വലിയ വെങ്കല ജലസംഭരണിയുടെ പ്രത്യേക പേരാണ്. ‘കടൽ’ എന്ന മൂലരൂപം നിലനിർത്തുകയും ഉദ്ധരണിച്ചിഹ്നം അതൊരു പേരാണെന്ന് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהַמְּכֹנוֹת
  choice: പീഠങ്ങൾ
  rationale: מְכֹנוֹת കഴുകുപാത്രങ്ങളെ താങ്ങിയിരുന്ന അടിത്തറകളെയോ താങ്ങുപീഠങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘പീഠങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദമാണ്.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה לְבֵית יְהוָה
  choice: യഹോവയുടെ ആലയത്തിനായി ശലോമോൻ ഉണ്ടാക്കിയ
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥവും ലക്ഷ്യസൂചകമായ לְ-യും നേരിട്ട് നിലനിർത്തുന്നു. בֵית ഇവിടെ സന്ദർഭാനുസൃതമായി ‘ആലയം’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: לֹא הָיָה מִשְׁקָל לִנְחֹשֶׁת
  choice: വെങ്കലത്തിന്റെ തൂക്കം കണക്കാക്കിയിരുന്നില്ല
  rationale: מִשְׁקָל എന്നത് ‘തൂക്കം’ എന്നും ‘തൂക്കൽ’ എന്നും ഗ്രഹിക്കാം. സന്ദർഭത്തിൽ വെങ്കലത്തിന്റെ അളവ് അതിവലുതായതിനാൽ അത് തൂക്കിക്കണക്കാക്കിയില്ല എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പദപ്രയോഗത്തിലെ വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: ഈ ഉപകരണങ്ങളുടെയെല്ലാം
  rationale: כֵּלִים എന്ന വിശാലപദം ഇവിടെ ആലയത്തിലെ മേൽപ്പറഞ്ഞ വസ്തുക്കളെ ഉൾക്കൊള്ളുന്നു; ‘ഉപകരണങ്ങൾ’ ആ വ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യത്തിലെ പട്ടികയും സമാപനപ്രസ്താവനയും വ്യക്തമായി വേർതിരിക്കാൻ ദീർഘവിരാമം ഉപയോഗിച്ചു; ആലയോപകരണങ്ങളുടെ സാങ്കേതിക സ്വഭാവം ആവശ്യമായിടത്ത് അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
