source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גֵּיחֲזִ֗י נַעַר֮ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִים֒ הִנֵּ֣ה חָשַׂ֣ךְ אֲדֹנִ֗/י אֶֽת נַעֲמָ֤ן הָֽ/אֲרַמִּי֙ הַ/זֶּ֔ה מִ/קַּ֥חַת מִ/יָּד֖/וֹ אֵ֣ת אֲשֶׁר הֵבִ֑יא חַי יְהוָה֙ כִּֽי אִם רַ֣צְתִּי אַחֲרָ֔י/ו וְ/לָקַחְתִּ֥י מֵ/אִתּ֖/וֹ מְאֽוּמָה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
translation:
  language: ml
  text: 'എന്നാൽ ദൈവപുരുഷനായ എലീശയുടെ ശുശ്രൂഷകനായ ഗേഹസി പറഞ്ഞു: “നോക്കൂ, ഈ അരാമ്യനായ നയമാൻ കൊണ്ടുവന്നത് അവന്റെ കൈയിൽനിന്ന് സ്വീകരിക്കാതെ എന്റെ യജമാനൻ അവനെ വെറുതെ വിട്ടിരിക്കുന്നു.[a] യഹ്‌വേ ജീവനുള്ളവനാണേ,[b] ഞാൻ അവന്റെ പിന്നാലെ ഓടിച്ചെന്ന് അവനിൽനിന്ന് എന്തെങ്കിലും എടുത്തുകൊള്ളും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “ഈ അരാമ്യനായ നയമാന്റെ കൈയിൽനിന്ന് അവൻ കൊണ്ടുവന്നത് എടുക്കാതിരുന്നതിലൂടെ എന്റെ യജമാനൻ അവനെ ഒഴിവാക്കിയിരിക്കുന്നു.”'
    reason: חָשַׂךְ ... מִקַּחַת എന്ന എബ്രായഘടന ‘എടുക്കുന്നതിൽനിന്ന് ഒഴിഞ്ഞുനിൽക്കുക/പിന്മാറുക’ എന്ന ആശയത്തിലൂടെ നയമാനെ സമ്മാനം നൽകുന്നതിൽനിന്ന് ഒഴിവാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
  - marker: b
    text: 'എബ്രായത്തിലെ ശപഥസൂത്രം; അക്ഷരാർഥം: “യഹ്‌വേ ജീവനുള്ളവൻ.”'
    reason: ഇത് യഹ്‌വേയുടെ ജീവനെ സാക്ഷിയാക്കി ഉദ്ദേശ്യം ഉറപ്പിക്കുന്ന ശപഥമാണ്.
lexical_decisions:
- source_word: נַעַר
  choice: ശുശ്രൂഷകൻ
  rationale: ഇവിടെ പ്രായത്തേക്കാൾ എലീശയോടുള്ള ഗേഹസിയുടെ സേവകസ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ ഈ പദം സ്വാഭാവികമാണ്.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബൈബിൾ വിശേഷണം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ഗേഹസിയുടെ വാക്കിലെ ഊന്നലും പ്രതികരണഭാവവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חָשַׂךְ
  choice: വിട്ടയച്ചിരിക്കുന്നു
  rationale: തുടർന്നുള്ള ‘സ്വീകരിക്കാതെ’ എന്ന പ്രയോഗത്തോടൊപ്പം, പ്രതിഫലം വാങ്ങാതിരുന്നതിലൂടെ നയമാനെ ഒഴിവാക്കി വിട്ടു എന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘തടഞ്ഞു’ എന്ന അക്ഷരാർഥം ഇവിടെ അസ്വാഭാവികമാണ്.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ദൈവത്തെയല്ല, ഗേഹസിയുടെ മനുഷ്യാധിപനായ എലീശയെ സൂചിപ്പിക്കുന്നു.
- source_word: הָאֲרַמִּי
  choice: അരാമ്യൻ
  rationale: എബ്രായ വംശ-ഭൗമിക നാമത്തെ ‘സിറിയക്കാരൻ’ എന്ന് കാലാനുസൃതമായി മാറ്റാതെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מִקַּחַת מִיָּדוֹ
  choice: അവന്റെ കൈയിൽനിന്ന് ... സ്വീകരിക്കാതെ
  rationale: സ്വീകരിക്കുന്ന പ്രവൃത്തിയിൽനിന്നുള്ള പിന്മാറ്റം സൂചിപ്പിക്കുന്ന എബ്രായ ഘടനയും ‘കൈയിൽനിന്ന്’ എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: חַי יְהוָה
  choice: യഹ്‌വേ ജീവനുള്ളവൻ എന്നാണേ
  rationale: ദൈവനാമം നിലനിർത്തിക്കൊണ്ട് എബ്രായ ശപഥസൂത്രത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: רַצְתִּי אַחֲרָיו
  choice: ഞാൻ അവന്റെ പിന്നാലെ ഓടിച്ചെന്ന്
  rationale: ഉടനെയുള്ള പിന്തുടരലിന്റെ സജീവത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלָקַחְתִּי מֵאִתּוֹ מְאוּמָה
  choice: അവനിൽനിന്ന് എന്തെങ്കിലും വാങ്ങും
  rationale: ലָקַח് എന്നത് അടിസ്ഥാനമായി ‘എടുക്കുക’ ആണെങ്കിലും, സമ്മാനം/സമ്പത്ത് കൈപ്പറ്റുന്ന ഈ സാഹചര്യത്തിൽ ‘വാങ്ങുക’ എന്നത് സ്വാഭാവികമായ സ്വീകരണാർഥം നൽകുന്നു; വിലകൊടുത്തു വാങ്ങുക എന്ന അർഥമല്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: חַי יְהוָה എന്ന ശപഥസൂത്രം
  choice: യഹ്‌വേ ജീവനുള്ളവൻ എന്നാണേ
  alternative: യഹ്‌വേ ജീവിക്കുന്നതുപോലെ / യഹ്‌വേ ജീവിക്കുന്നു
  rationale: ഇത് ഒരു പ്രസ്താവന മാത്രമല്ല, ഗേഹസി തന്റെ ഉദ്ദേശ്യം ഉറപ്പിക്കുന്ന ശപഥമാണെന്ന പ്രയോഗശക്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായനാസൗഹൃദവുമായ മലയാളം. ‘ദൈവപുരുഷൻ’, ‘യജമാനൻ’, ‘അരാമ്യൻ’ എന്നീ ബൈബിൾ-ചരിത്രപര പദങ്ങൾ നിലനിർത്തി. ഹീബ്രു വാക്യക്രമം മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നിടത്ത് മൃദുവാക്കി; എന്നാൽ ‘കൈയിൽനിന്ന്’ എന്ന മൂലരൂപവും ശപഥത്തിന്റെ തീവ്രതയും സംരക്ഷിച്ചു.
