- from: 'അപ്പോൾ എലീശാ അവന്റെ അടുക്കൽ ഒരു ദൂതനെ അയച്ച് ഇങ്ങനെ പറയിച്ചു: “നീ പോയി യോർദ്ദാനിൽ ഏഴു പ്രാവശ്യം കുളിക്കുക. അപ്പോൾ നിന്റെ മാംസം നിനക്കു തിരികെ ലഭിക്കും[a]; നീ ശുദ്ധനാകും[b].”'
  to: 'അപ്പോൾ എലീശാ അവന്റെ അടുക്കലേക്ക് ഒരു സന്ദേശവാഹകനെ അയച്ചു; സന്ദേശം ഇതായിരുന്നു: “നീ പോയി യോർദ്ദാനിൽ ഏഴു പ്രാവശ്യം കുളിക്കുക. അപ്പോൾ നിന്റെ മാംസം നിനക്കു പുനഃസ്ഥാപിക്കപ്പെടും[a]; നീ ശുദ്ധനാകും[b].”'
  rationale: മനുഷ്യനായ מַלְאָךְ-ന്റെ അർഥം വ്യക്തമായി നൽകുന്നതിനും, ‘മാംസം ... മടങ്ങിവരുക’ എന്ന എബ്രായ പ്രയോഗത്തിലെ ആരോഗ്യപുനഃസ്ഥാപനഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നതിനുമായി മാത്രം തിരുത്തി. സംഖ്യ, ആജ്ഞ, യോർദ്ദാൻ എന്ന നാമം, ശുദ്ധി എന്ന തുറന്ന ഫലഭാവം, അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനങ്ങൾ എന്നിവ സംരക്ഷിച്ചിരിക്കുന്നു.
