reference: 2 Kings 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו אֱלִישָׁ֖ע מַלְאָ֣ךְ לֵ/אמֹ֑ר הָל֗וֹךְ וְ/רָחַצְתָּ֤ שֶֽׁבַע פְּעָמִים֙ בַּ/יַּרְדֵּ֔ן וְ/יָשֹׁ֧ב בְּשָׂרְ/ךָ֛ לְ/ךָ֖ וּ/טְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
translation:
  language: ml
  text: 'അപ്പോൾ എലീശാ അവന്റെ അടുക്കലേക്ക് ഒരു സന്ദേശവാഹകനെ അയച്ചു; സന്ദേശം ഇതായിരുന്നു: “നീ പോയി യോർദ്ദാനിൽ ഏഴു പ്രാവശ്യം കുളിക്കുക. അപ്പോൾ നിന്റെ മാംസം നിനക്കു പുനഃസ്ഥാപിക്കപ്പെടും[a]; നീ ശുദ്ധനാകും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ മാംസം നിന്നിലേക്കു മടങ്ങിവരും.” എബ്രായ ശൈലി മുമ്പുണ്ടായിരുന്ന ആരോഗ്യാവസ്ഥയിലേക്കുള്ള പുനഃസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നീ ശുദ്ധീകരിക്കപ്പെടും.” ഈ ക്രിയയ്ക്ക് ശുദ്ധമാകുക, നിർമലമാകുക എന്നീ അർഥങ്ങളുണ്ട്; ഇവിടെ ശാരീരികവും ആചാരപരവുമായ അനുരണനങ്ങൾ ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו אֱלִישָׁע מַלְאָךְ
  choice: എലീശാ അവന്റെ അടുക്കൽ ഒരു ദൂതനെ അയച്ചു
  rationale: മַלְאָךְ ഈ മനുഷ്യസന്ദർഭത്തിൽ സ്വർഗീയദൂതനെയല്ല, സന്ദേശവാഹകനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ദൂതൻ’ സന്ദർഭത്തോടൊപ്പം ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറയിച്ചു
  rationale: എബ്രായത്തിലെ വാക്ക് ഉദ്ധരിച്ച സന്ദേശത്തെ പരിചയപ്പെടുത്തുന്നു. ദൂതൻ മുഖേന എലീശാ സന്ദേശം അറിയിച്ചുവെന്ന കാര്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָלוֹךְ וְרָחַצְתָּ
  choice: നീ പോയി ... കുളിക്കുക
  rationale: ഇവിടെ രൂപസംയോജനം ആജ്ഞാബലം നൽകുന്നു. ‘പോയി കുളിക്കുക’ പ്രവർത്തനങ്ങളുടെ ക്രമവും കല്പനയുടെ സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: സംഖ്യയും ആവർത്തനവും നേരിട്ട് പകർന്നിരിക്കുന്നു.
- source_word: בַּיַּרְדֵּן
  choice: യോർദ്ദാനിൽ
  rationale: നദിയുടെ പേരായ ‘യോർദ്ദാൻ’ സ്ഥലസൂചകപ്രത്യയത്തോടെ സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു; മൂലത്തിൽ ‘നദി’ എന്ന നാമം പ്രത്യേകം ഇല്ല.
- source_word: וְיָשֹׁב בְּשָׂרְךָ לְךָ
  choice: നിന്റെ മാംസം നിനക്കു തിരികെ ലഭിക്കും
  rationale: שׁוב എന്നതിന്റെ അടിസ്ഥാനമായ ‘തിരികെ വരുക’ എന്ന ഭാവവും לְךָയുടെ ‘നിനക്കു’ എന്ന സൂക്ഷ്മതയും നിലനിർത്തി, മുൻ ആരോഗ്യാവസ്ഥ പുനഃസ്ഥാപിക്കപ്പെടുന്നതിനെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം പറയുന്നു.
- source_word: וּטְהָר
  choice: നീ ശുദ്ധനാകും
  rationale: טהר ശുദ്ധമാകുക എന്ന ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ശുദ്ധനാകും’ ശാരീരിക സൗഖ്യത്തിന്റെയും ആചാരപരമായ ശുദ്ധിയുടെയും സാധ്യതയുള്ള അനുരണനങ്ങൾ നിർണയിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּשָׂרְךָ എന്നതിനെ ‘മാംസം’ എന്നോ കൂടുതൽ പൊതുവായി ‘ശരീരം’ എന്നോ നൽകുക
  choice: മാംസം
  alternative: ശരീരം
  rationale: മൂലത്തിലെ വ്യക്തമായ ദേഹപരമായ പദം നിലനിർത്തുകയും രോഗബാധിതമായ മാംസം പുനഃസ്ഥാപിക്കപ്പെടുന്ന ദൃശ്യത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: וּטְהָר എന്നതിൽ ശാരീരിക ശുദ്ധിയോ ആചാരപരമായ ശുദ്ധീകരണമോ മുൻനിർത്തുക
  choice: നീ ശുദ്ധനാകും
  alternative: നീ ശുദ്ധീകരിക്കപ്പെടും
  rationale: സന്ദർഭം സൗഖ്യപ്രാപ്തിയുടേതാണെങ്കിലും ക്രിയയ്ക്ക് ശുദ്ധി/പരിശുദ്ധി സംബന്ധമായ അനുരണനങ്ങളും ഉണ്ടാകാം. കർമണിപ്രയോഗത്തിലൂടെ ഒരു പ്രത്യേക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ ഫലാവസ്ഥ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘മാംസം,’ ‘ശുദ്ധനാകും’ എന്നീ പദങ്ങളിലൂടെ മൂലത്തിന്റെ ദേഹപരമായ ഭാഷയും അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങളായ [a], [b] മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടുണ്ട്.
