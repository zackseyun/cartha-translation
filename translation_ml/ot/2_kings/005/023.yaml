revisions:
- from: 'നയമാൻ പറഞ്ഞു: “ദയവായി രണ്ടു താലന്ത് സ്വീകരിക്കുക.” അവൻ ഗേഹസിയെ നിർബന്ധിച്ചു; രണ്ടു താലന്ത് വെള്ളി രണ്ടു സഞ്ചികളിലാക്കി കെട്ടി, കൂടെ രണ്ടു ജോഡി വസ്ത്രവും തന്റെ രണ്ടു ഭൃത്യന്മാരുടെ കൈയിൽ കൊടുത്തു. അവർ അവ ഗേഹസിയുടെ മുമ്പിലായി ചുമന്നുകൊണ്ടുപോയി.[a]'
  to: 'നയമാൻ പറഞ്ഞു: “ദയവായി രണ്ടു താലന്ത് സ്വീകരിക്കുക.” അവൻ ഗേഹസിയെ നിർബന്ധിച്ചു. പിന്നെ രണ്ടു താലന്ത് വെള്ളി രണ്ടു സഞ്ചികളിൽ കെട്ടിവെച്ചു; രണ്ടു മാറ്റുവസ്ത്രങ്ങളോടുകൂടെ അവ തന്റെ രണ്ടു സേവകർക്കു കൊടുത്തു. അവർ അവ ഗേഹസിയുടെ മുമ്പിൽ കൊണ്ടുപോയി.'
  rationale: വെള്ളി സഞ്ചികളിൽ കെട്ടിവെച്ചതായി ഹീബ്രു വാക്യഘടന വ്യക്തമാക്കുന്ന വിധം പുനഃക്രമീകരിച്ചു. മാറ്റിവയ്ക്കാവുന്ന വസ്ത്രസമുച്ചയങ്ങളുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി. പുനരുക്തിയും യഥാർഥ ബദൽവായനയില്ലാത്തതുമായ അടിക്കുറിപ്പ് ഒഴിവാക്കി; ‘ഗേഹസിയുടെ മുമ്പിൽ’ എന്ന മുഖ്യപാഠം സന്ദർഭസൂചന മതിയായവിധം വ്യക്തമാക്കുന്നു.
