    rationale: '''മുമ്പിലായി'' എന്നതിന് പ്രസക്തമായ ബദൽ ''മുന്നിൽ'' അല്ലെങ്കിൽ ''മുമ്പിൽ'' ആയിരിക്കും; നിലവിലെ കുറിപ്പ് അധിക വിവരമില്ലാതെ അതേ വാക്യം ആവർത്തിക്കുന്നു.'
  - severity: low
    issue: ‘രണ്ടു ജോഡി വസ്ത്രം’ എന്ന പ്രയോഗം കുറച്ച് അസ്വാഭാവികമാണ്.
    rationale: שְׁתֵּי חֲלִפוֹת בְּגָדִים എന്നതിന് ആധുനിക മലയാളത്തിൽ ‘രണ്ടു മാറ്റുവസ്ത്രങ്ങൾ’ സ്വാഭാവികവും അർഥവ്യക്തവുമാണ്.
  revised_text: 'നയമാൻ പറഞ്ഞു: “ദയവായി രണ്ടു താലന്ത് സ്വീകരിക്കുക.” അവൻ ഗേഹസിയെ നിർബന്ധിച്ചു. പിന്നെ രണ്ടു താലന്ത് വെള്ളി രണ്ടു സഞ്ചികളിൽ കെട്ടിവെച്ചു; രണ്ടു മാറ്റുവസ്ത്രങ്ങളോടുകൂടെ അവ തന്റെ രണ്ടു സേവകർക്കു കൊടുത്തു. അവർ അവ ഗേഹസിയുടെ മുമ്പിൽ കൊണ്ടുപോയി.'
