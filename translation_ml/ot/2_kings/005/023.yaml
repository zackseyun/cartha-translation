source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר נַעֲמָ֔ן הוֹאֵ֖ל קַ֣ח כִּכָּרָ֑יִם וַ/יִּפְרָץ בּ֗/וֹ וַ/יָּצַר֩ כִּכְּרַ֨יִם כֶּ֜סֶף בִּ/שְׁנֵ֣י חֲרִטִ֗ים וּ/שְׁתֵּי֙ חֲלִפ֣וֹת בְּגָדִ֔ים וַ/יִּתֵּן֙ אֶל שְׁנֵ֣י נְעָרָ֔י/ו וַ/יִּשְׂא֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
translation:
  language: ml
  text: 'നയമാൻ പറഞ്ഞു: “ദയവായി രണ്ടു താലന്ത് സ്വീകരിക്കുക.” അവൻ ഗേഹസിയെ നിർബന്ധിച്ചു. പിന്നെ രണ്ടു താലന്ത് വെള്ളി രണ്ടു സഞ്ചികളിൽ കെട്ടിവെച്ചു; രണ്ടു മാറ്റുവസ്ത്രങ്ങളോടുകൂടെ അവ തന്റെ രണ്ടു സേവകർക്കു കൊടുത്തു. അവർ അവ ഗേഹസിയുടെ മുമ്പിൽ കൊണ്ടുപോയി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹאֵל קַח
  choice: ദയവായി ... സ്വീകരിക്കുക
  rationale: הוֹאֵל അഭ്യർഥനയുടെ വിനയം പ്രകടിപ്പിക്കുന്നു; സമ്മാനം ഏറ്റുവാങ്ങുന്ന സന്ദർഭമായതിനാൽ קַח എന്നതിനു സ്വാഭാവിക മലയാളത്തിൽ ‘സ്വീകരിക്കുക’ യോജിക്കുന്നു.
- source_word: כִּכָּרָיִם
  choice: രണ്ടു താലന്ത്
  rationale: כִּכָּר പുരാതന ഭാരമാനമാണ്; ബൈബിൾപരമായ അളവുപേര് നിലനിർത്തുന്നത് കൃത്രിമമായ ആധുനിക പരിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וַיִּפְרָץ בּוֹ
  choice: അവൻ ഗേഹസിയെ നിർബന്ധിച്ചു
  rationale: സ്വീകരിക്കാൻ ശക്തമായി പ്രേരിപ്പിച്ചു/നിർബന്ധിച്ചു എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיָּצַר ... בִּשְׁנֵי חֲרִטִים
  choice: രണ്ടു സഞ്ചികളിലാക്കി കെട്ടി
  rationale: וַיָּצַר എന്നത് കെട്ടി ഭദ്രമാക്കുന്ന പ്രവൃത്തിയെയും חֲרִטִים പണമോ വിലപിടിപ്പുള്ള വസ്തുക്കളോ സൂക്ഷിക്കുന്ന സഞ്ചികളെയും സൂചിപ്പിക്കുന്നു.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: രണ്ടു ജോഡി വസ്ത്രം
  rationale: മാറ്റിയുടുക്കാനുള്ള രണ്ടു സമ്പൂർണ വസ്ത്രക്കൂട്ടങ്ങൾ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: שְׁנֵי נְעָרָיו
  choice: തന്റെ രണ്ടു ഭൃത്യന്മാർ
  rationale: נְעָרָיו എന്നതിന് യുവാക്കൾ എന്നും പരിചാരകർ എന്നും അർഥമാകാം; ഇവിടെ ചുമക്കാൻ നിയോഗിക്കപ്പെട്ട നയമാന്റെ കീഴിലുള്ളവരെന്ന പ്രവർത്തനപരമായ അർഥം ‘ഭൃത്യന്മാർ’ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׂאוּ לְפָנָיו
  choice: അവർ അവ ഗേഹസിയുടെ മുമ്പിലായി ചുമന്നുകൊണ്ടുപോയി
  rationale: ലְפָנָיו എന്നത് അവന്റെ മുമ്പിൽ/മുന്നിലായി എന്ന സ്ഥാനം സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സർവനാമം ഗേഹസിയെ സൂചിപ്പിക്കുന്നതായി പേരുപയോഗിച്ച് വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ മലയാളം. പുരാതന ഭാരമാനമായ ‘താലന്ത്’ നിലനിർത്തി; ‘ഗേഹസി’ എന്ന പേര് സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ ചേർത്തു. പ്രധാന പാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
