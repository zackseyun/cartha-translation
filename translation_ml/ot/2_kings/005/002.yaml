source:
  edition: WLC
  text: וַ/אֲרָם֙ יָצְא֣וּ גְדוּדִ֔ים וַ/יִּשְׁבּ֛וּ מֵ/אֶ֥רֶץ יִשְׂרָאֵ֖ל נַעֲרָ֣ה קְטַנָּ֑ה וַ/תְּהִ֕י לִ/פְנֵ֖י אֵ֥שֶׁת נַעֲמָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
translation:
  language: ml
  text: അരാമ്യരുടെ കൊള്ളസംഘങ്ങൾ പുറപ്പെട്ട് ഇസ്രായേൽദേശത്തുനിന്ന് ഒരു കൊച്ചുപെൺകുട്ടിയെ[a] ബന്ധികളാക്കി കൊണ്ടുപോയി. അവൾ നയമാന്റെ ഭാര്യയെ പരിചരിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ചെറിയ പെൺകുട്ടിയെ.” נַעֲרָה קְטַנָּה എന്ന എബ്രായപ്രയോഗം അവളുടെ ചെറുപ്രായത്തിനും ചെറിയവളെന്ന നിലയ്ക്കും ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവൾ നയമാന്റെ ഭാര്യയുടെ മുമ്പിൽ ആയിരുന്നു”; അതായത്, അവൾ നയമാന്റെ ഭാര്യയുടെ പരിചരണത്തിലും സേവനത്തിലും ആയിരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרָם ... גְדוּדִים
  choice: അരാമ്യരുടെ കൊള്ളസംഘങ്ങൾ
  rationale: ബഹുവചന ക്രിയയോടുകൂടിയ പ്രയോഗം അരാംദേശത്തുനിന്നുള്ള സായുധസംഘങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. גְדוּדִים എന്ന പദത്തിലെ ആക്രമണ/കൊള്ളയാത്രയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יָצְאוּ
  choice: പുറപ്പെട്ട്
  rationale: സംഘങ്ങൾ ആക്രമണയാത്രയ്ക്കായി പുറപ്പെട്ട പശ്ചാത്തലപ്രവൃത്തി ലളിതമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁבּוּ
  choice: പിടിച്ചുകൊണ്ടുപോയിരുന്നു
  rationale: വെറും പിടികൂടൽ മാത്രമല്ല, യുദ്ധത്തടവുകാരിയായി കൊണ്ടുപോകൽ എന്ന ക്രിയയുടെ അർഥം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: מֵאֶרֶץ יִשְׂרָאֵל
  choice: ഇസ്രായേൽദേശത്തുനിന്ന്
  rationale: ‘ഇസ്രായേൽദേശം’ എന്ന ഭൂമിശാസ്ത്രപരമായ പൂർണപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: נַעֲרָה קְטַנָּה
  choice: ഒരു കൊച്ചുപെൺകുട്ടിയെ
  rationale: പെൺകുട്ടിയുടെ ചെറുപ്രായവും ചെറിയവളെന്ന ഭാവവും സ്വാഭാവികമായി സംയോജിപ്പിക്കുന്നു; അവൾ നേരത്തേ ദാസിയായിരുന്നു എന്ന ആശയം പദത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וַתְּהִי לִפְנֵי
  choice: പരിചാരികയായി സേവിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘മുമ്പിൽ ആയിരുന്നു’ എന്നുള്ളത് ഇവിടെ വ്യക്തിപരമായി ശുശ്രൂഷിക്കുകയോ പരിചരിക്കുകയോ ചെയ്യുന്ന സേവനത്തെ സൂചിപ്പിക്കുന്ന ശൈലിയാണ്.
- source_word: אֵשֶׁת נַעֲמָן
  choice: നയമാന്റെ ഭാര്യ
  rationale: ഹീബ്രായ സംയുക്തബന്ധം സ്വാഭാവിക മലയാള ഉടമസ്ഥപ്രയോഗത്തിൽ നൽകുന്നു.
