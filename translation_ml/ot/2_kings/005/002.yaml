translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കൊള്ളസംഘങ്ങൾ’ സൈനിക റെയ്ഡിന്റെ ആശയം വ്യക്തമാക്കുന്നു; ‘പരിചാരികയായി സേവിച്ചു’ ഹീബ്രായ ശൈലിയുടെ പ്രവർത്തനാർഥം നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാക്യത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
