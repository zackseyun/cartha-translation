source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: When Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
translation:
  language: ml
  text: 'ദൈവപുരുഷനായ എലീശാ, ഇസ്രായേൽരാജാവ് തന്റെ വസ്ത്രങ്ങൾ കീറിയെന്നു കേട്ടപ്പോൾ, രാജാവിന്റെ അടുക്കൽ ആളയച്ചു പറഞ്ഞു: “അങ്ങ് വസ്ത്രങ്ങൾ കീറിയത് എന്തിന്? ദയവായി, അവൻ എന്റെ അടുക്കൽ വരട്ടെ[a]; അപ്പോൾ ഇസ്രായേലിൽ ഒരു പ്രവാചകൻ ഉണ്ടെന്ന് അവൻ അറിയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവൻ” എന്നു പറയുന്നത് ഇസ്രായേൽരാജാവിനെയല്ല, നയമാനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: referent_clarification
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ കാലബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വേറൊരു ‘അപ്പോൾ സംഭവിച്ചത്’ ചേർക്കേണ്ടതില്ല.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബൈബിൾപദവിയുടെ രൂപവും ദൈവത്തിന്റെ പ്രതിനിധിയെന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: קָרַע ... אֶת בְּגָדָיו
  choice: തന്റെ വസ്ത്രം കീറി
  rationale: ദുഃഖമോ കടുത്ത വ്യാകുലതയോ പ്രകടിപ്പിക്കുന്ന പതിവ് പ്രവൃത്തിയെ നേരിട്ടും സ്വാഭാവികമായും വിവർത്തനം ചെയ്യുന്നു.
- source_word: וַיִּשְׁלַח אֶל הַמֶּלֶךְ
  choice: രാജാവിന്റെ അടുക്കൽ ആളയച്ചു
  rationale: മലയാളത്തിൽ സന്ദേശം അയയ്ക്കുന്നതിന്റെ സ്വാഭാവിക പ്രയോഗം; ദൂതന്റെ പ്രത്യേക പദവിയോ എണ്ണമോ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: לָמָּה קָרַעְתָּ בְּגָדֶיךָ
  choice: അങ്ങ് വസ്ത്രം കീറിയത് എന്തിന്?
  rationale: രാജാവിനോടുള്ള ബഹുമാനസൂചക അഭിസംബോധനയും ചോദ്യത്തിന്റെ നേരിട്ടുള്ള ശക്തിയും നിലനിർത്തുന്നു.
- source_word: יָבֹא נָא אֵלַי
  choice: അവൻ എന്റെ അടുക്കൽ വരട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചനമായ ക്രിയ നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് രാജാവല്ല, നയമാനാണ്. נָאയുടെ വിനീതമായ ആഹ്വാനം മലയാളത്തിലെ ‘വരട്ടെ’യിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: וְיֵדַע
  choice: അപ്പോൾ ... അവൻ അറിയും
  rationale: വരുന്നതിന്റെ പ്രതീക്ഷിത ഫലം വ്യക്തമാക്കുന്നു; ഉദ്ദേശ്യമോ കല്പനയോ ആയി അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- source_word: כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ ഒരു പ്രവാചകൻ ഉണ്ടെന്ന്
  rationale: יֵשׁ സൂചിപ്പിക്കുന്ന അസ്തിത്വപ്രസ്താവനയും പ്രവാചകസാന്നിധ്യത്തിനുള്ള ഊന്നലും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים എന്ന പ്രവാചകപദവിയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം
  choice: ദൈവപുരുഷൻ
  alternative: ദൈവഭക്തനായ മനുഷ്യൻ / ദൈവത്തിന്റേതായ മനുഷ്യൻ
  rationale: ഇത് എലീശായുടെ ഭക്തിയെക്കുറിച്ചുള്ള സാധാരണ വിശേഷണം മാത്രമല്ല, ദൈവത്തിന്റെ പ്രവാചകപ്രതിനിധിയെന്ന നില സൂചിപ്പിക്കുന്ന പദവിയാണ്. ‘ദൈവപുരുഷൻ’ ആ സാഹിത്യ-ദൈവശാസ്ത്ര പ്രവർത്തനം നിലനിർത്തുന്നു.
- issue: וְיֵדַע എന്നതിലെ പ്രതീക്ഷിത ഫലവും ലക്ഷ്യവും
  choice: അപ്പോൾ ... അവൻ അറിയും
  alternative: അവൻ അറിയേണ്ടതിന് / അവൻ അറിയട്ടെ
  rationale: എബ്രായ അപൂർണ്ണക്രിയ ഫലമോ ലക്ഷ്യമോ സൂചിപ്പിക്കാൻ കഴിയുന്നുവെങ്കിലും, ഇവിടെ വരവിന്റെ പ്രതീക്ഷിത പരിണതഫലം എന്ന വായന സ്വാഭാവികമാണ്; കല്പനയായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിനോട് ‘അങ്ങ്’ എന്ന ബഹുമാനരൂപം ഉപയോഗിച്ചു. പ്രധാനവാക്യത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ നയമാന്റെ പേര് ചേർക്കാതെ എബ്രായത്തിലെ ‘അവൻ’ സംരക്ഷിക്കുകയും അടിക്കുറിപ്പിൽ സൂചകം വ്യക്തമാക്കുകയും ചെയ്തു.
