  to: 'ദൈവപുരുഷനായ എലീശാ, ഇസ്രായേൽരാജാവ് തന്റെ വസ്ത്രങ്ങൾ കീറിയെന്നു കേട്ടപ്പോൾ, രാജാവിന്റെ അടുക്കൽ ആളയച്ചു പറഞ്ഞു: “അങ്ങ് വസ്ത്രങ്ങൾ കീറിയത് എന്തിന്? ദയവായി, അവൻ എന്റെ അടുക്കൽ വരട്ടെ[a]; അപ്പോൾ ഇസ്രായേലിൽ ഒരു പ്രവാചകൻ ഉണ്ടെന്ന് അവൻ അറിയും.”'
