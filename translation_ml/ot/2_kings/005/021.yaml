translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. പേരുകൾ ‘ഗേഹസി’, ‘നയമാൻ’ എന്ന പ്രചാരത്തിലുള്ള രൂപങ്ങളിൽ നൽകി. ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നം ഓട്ടത്തെക്കുറിച്ചുള്ള വാക്യഭാഗത്തിനു ശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് הֲשָׁלוֹם എന്ന പദത്തെ വിശദീകരിക്കുന്നതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ബന്ധപ്പെട്ട ചോദ്യത്തിനു ശേഷമാണ് [a] ചേർത്തത്.
