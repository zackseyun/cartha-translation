base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
translation:
  language: ml
  text: 'അങ്ങനെ ഗേഹസി നയമാനെ പിന്തുടർന്നു. ഗേഹസി തന്റെ പിന്നാലെ ഓടിവരുന്നതു നയമാൻ കണ്ടപ്പോൾ, അവനെ എതിരേൽക്കാൻ രഥത്തിൽനിന്ന് ഇറങ്ങി ചോദിച്ചു: “എല്ലാം സുഖമാണോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: “സമാധാനമോ?” ഇവിടെ ശാലോം എന്ന പദം അഭിവാദനമായോ സുഖവിവരം അന്വേഷിക്കുന്ന ചോദ്യമായോ ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: പിന്തുടർന്നു
  rationale: רדף ഇവിടെ ഉദ്ദേശ്യപൂർവം പിന്നാലെ പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ശത്രുതാഭാവം അനാവശ്യമായി ശക്തമാക്കാതെ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: אַחֲרֵי
  choice: പിന്നാലെ
  rationale: ഒരാളുടെ പുറകെ നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וַיִּרְאֶה ... רָץ אַחֲרָיו
  choice: തന്റെ പിന്നാലെ അവൻ ഓടിവരുന്നതു ... കണ്ടപ്പോൾ
  rationale: നയമാൻ ഗേഹസിയെ ഓടിവരുന്ന നിലയിൽ കണ്ടുവെന്ന എബ്രായത്തിലെ ദൃശ്യവും തുടരുന്ന പ്രവൃത്തിയും നിലനിർത്തുന്നു; സർവനാമങ്ങളുടെ സൂചന മലയാളത്തിൽ വ്യക്തവുമാണ്.
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  choice: രഥത്തിൽനിന്ന് ഇറങ്ങി
  rationale: נפל എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വീഴുക’ എന്നുണ്ടെങ്കിലും ഈ സന്ദർഭത്തിൽ രഥത്തിൽനിന്ന് വേഗത്തിൽ ഇറങ്ങുക എന്ന ശൈലീപ്രയോഗമാണ്; അപകടമായി വീണുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: לִקְרָאתוֹ
  choice: അവനെ എതിരേൽക്കാൻ
  rationale: לקראת എന്നത് ഒരാളെ നേരിൽ ചെന്നു കാണുകയോ എതിരേൽക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘എതിരേൽക്കാൻ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הֲשָׁלוֹם
  choice: എല്ലാം സുഖമാണോ?
  rationale: שלום ഇവിടെ സമാധാനത്തെക്കുറിച്ചുള്ള സാങ്കേതിക ചോദ്യം അല്ല, കാര്യങ്ങൾ ക്ഷേമകരമാണോ എന്ന പതിവന്വേഷണമാണ്; ആ പ്രയോഗാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: ആദ്യത്തെ വാവ് കഥയുടെ തുടർച്ചയും മുൻസംഭവത്തിന്റെ ഫലമായ നീക്കവും സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെ’ ആ ബന്ധം സുഗമമായി പ്രകടിപ്പിക്കുന്നു.
