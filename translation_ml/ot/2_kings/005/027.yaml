  yaml_path: translation/ot/2_kings/005/027.yaml
  text: So Naaman’s skin disease will cling to you and to your offspring forever.” And he went out from his presence diseased[a], white as snow.
translation:
  language: ml
  text: “അതുകൊണ്ട് നയമാന്റെ ത്വഗ്രോഗം നിന്നോടും നിന്റെ സന്തതിയോടും എന്നേക്കും പറ്റിപ്പിടിച്ചിരിക്കും.” അപ്പോൾ അവൻ മഞ്ഞുപോലെ വെളുത്ത ത്വഗ്രോഗിയായി[a] അവന്റെ സന്നിധിയിൽനിന്ന് പുറത്തുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: “നയമാന്റെ കുഷ്ഠം നിന്നോടും … പറ്റിപ്പിടിച്ചിരിക്കും”; “കുഷ്ഠരോഗിയായി.” എന്നാൽ צָרַעַת / מְצֹרָע എന്നീ എബ്രായപദങ്ങൾ ആധുനിക കുഷ്ഠരോഗത്തെ മാത്രം സൂചിപ്പിക്കാതെ, കൂടുതൽ വിശാലമായി ഗുരുതരമായ ഒരു ത്വഗ്രോഗത്തെയോ ത്വക്‌സ്ഥിതിയെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: ത്വഗ്രോഗം
  rationale: ഈ എബ്രായപദം ആധുനിക കുഷ്ഠരോഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; വിവിധ ഗുരുതര ത്വക്‌സ്ഥിതികളെ ഉൾക്കൊള്ളാം. അതിനാൽ രോഗനിർണയം അനാവശ്യമായി ചുരുക്കാത്ത സ്വാഭാവിക പദം തിരഞ്ഞെടുത്തു.
- source_word: נַעֲמָן
  choice: നയമാൻ
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ വ്യക്തിനാമരൂപം നിലനിർത്തുന്നു.
- source_word: תִּדְבַּק
  choice: പറ്റിപ്പിടിച്ചിരിക്കും
  rationale: דבק എന്ന ക്രിയയിലെ ശക്തമായ ചേർന്നുനിൽക്കൽ എന്ന ദൃശ്യഭാവവും ഭാവികാല ശാപപ്രസ്താവത്തിന്റെ തുടർച്ചയും വ്യക്തമാക്കുന്നു.
- source_word: וּבְזַרְעֲךָ
  choice: നിന്റെ സന്തതിയോടും
  rationale: זֶרַע ഇവിടെ പിൻതലമുറയെ സൂചിപ്പിക്കുന്നു; ‘സന്തതി’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളമാണ്.
- source_word: לְעוֹלָם
  choice: എന്നേക്കും
  rationale: വിധിപ്രസ്താവത്തിലെ ദീർഘമായ തുടർച്ചയെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיֵּצֵא מִלְּפָנָיו
  choice: അവന്റെ സന്നിധിയിൽനിന്ന് പുറത്തുപോയി
  rationale: ‘അവന്റെ മുമ്പിൽനിന്ന്’ എന്ന അക്ഷരാർഥത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും എലീശായുടെ സന്നിധി വിട്ടുപോകുന്ന ചലനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: מְצֹרָע
  choice: ത്വഗ്രോഗിയായി
  rationale: צָרַעַת എന്ന മുൻപത്തെ പദവുമായുള്ള അർഥബന്ധം നിലനിർത്തുന്നു; ആധുനിക കുഷ്ഠരോഗമെന്ന അനാവശ്യ നിർണയം ഒഴിവാക്കുന്നു.
- source_word: כַּשָּׁלֶג
  choice: മഞ്ഞുപോലെ വെളുത്ത
  rationale: എബ്രായത്തിലെ ‘മഞ്ഞുപോലെ’ എന്ന ഉപമയിൽ സന്ദർഭം സൂചിപ്പിക്കുന്ന വെളുപ്പിന്റെ ആശയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: צָרַעַת / מְצֹרָע എന്ന പദങ്ങളുടെ വ്യാഖ്യാനം
  choice: ത്വഗ്രോഗം / ത്വഗ്രോഗിയായി
  alternative: കുഷ്ഠം / കുഷ്ഠരോഗിയായി
  rationale: വാചകം ദൈവികവിധിയായി വന്ന രോഗബാധയെയും അത് സന്തതിയിലേക്കു തുടരുന്നതിനെയും പറയുന്നു; എന്നാൽ അതിനെ ആധുനിക ഹാൻസൻസ് രോഗമായി കൃത്യമായി തിരിച്ചറിയാൻ എബ്രായപദങ്ങൾ നിർബന്ധിക്കുന്നില്ല. അതിനാൽ വിശാലമായ രോഗപദം മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ച് പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ശാപപ്രസ്താവത്തിന്റെ ശക്തി നിലനിർത്താൻ ‘പറ്റിപ്പിടിച്ചിരിക്കും’ ഉപയോഗിച്ചു. രോഗപദത്തിൽ അനാവശ്യമായ ആധുനിക വൈദ്യനിർണയം ഒഴിവാക്കി; പരമ്പരാഗത ‘കുഷ്ഠം’ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
