source:
  edition: WLC
  text: וַ/יָּבֹ֥א נַעֲמָ֖ן ב/סוס/ו וּ/בְ/רִכְבּ֑/וֹ וַ/יַּעֲמֹ֥ד פֶּֽתַח הַ/בַּ֖יִת לֶ/אֱלִישָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/009.yaml
  text: So Naaman came with his horses and chariots[a], and stood at the entrance of Elisha’s house.
translation:
  language: ml
  text: അങ്ങനെ നയമാൻ തന്റെ കുതിരകളോടും രഥങ്ങളോടുംകൂടെ[a] വന്ന് എലീശയുടെ വീടിന്റെ വാതിൽക്കൽ നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “തന്റെ കുതിരയോടും തന്റെ രഥത്തോടുംകൂടെ.” ഇവിടെ ഏകവചനരൂപങ്ങൾ സമൂഹവാചകമായി ഉപയോഗിച്ചിരിക്കാം; അതിനാലാണ് “കുതിരകളോടും രഥങ്ങളോടുംകൂടെ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നു
  rationale: ആഖ്യാനക്രമത്തിലെ בוא നയമാൻ എലീശയുടെ സ്ഥലത്ത് എത്തുന്നതിനെ ലളിതമായി സൂചിപ്പിക്കുന്നു; ‘വന്നു’ സ്വാഭാവികവും മൂലത്തിന്റെ ലാളിത്യം നിലനിർത്തുന്നതുമാണ്.
- source_word: נַעֲמָן
  choice: നയമാൻ
  rationale: മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- source_word: בְסוּסוֹ
  choice: തന്റെ കുതിരകളോടും
  rationale: രൂപം വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും, സന്ദർഭത്തിൽ അത് നയമാനോടൊപ്പമുള്ള കുതിരകളെ സമൂഹവാചകമായി സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ട്; യഥാർത്ഥ ഏകവചനവും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וּבְרִכְבּוֹ
  choice: രഥങ്ങളോടുംകൂടെ
  rationale: רֶכֶב ഏക രഥത്തെയോ സമൂഹമായി രഥസേനയെയോ സൂചിപ്പിക്കാം. കുതിരകളോടുള്ള സമാന്തരപ്രയോഗവും നയമാന്റെ ഔദ്യോഗിക പരിവാരവും പരിഗണിച്ച് സ്വാഭാവികമായ ബഹുവചനം തെരഞ്ഞെടുത്തു.
- source_word: וַיַּעֲמֹד
  choice: നിന്നു
  rationale: עמד എന്നതിന്റെ അടിസ്ഥാനദൃശ്യമായ ‘നിൽക്കുക’ നിലനിർത്തുന്നു; ‘നിർത്തി’ എന്നത് ചലനം അവസാനിപ്പിച്ചതിലേക്കു മാത്രം അർഥം ചുരുക്കും.
- source_word: פֶּתַח הַבַּיִת
  choice: വീടിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: פֶּתַח വീടിന്റെ തുറവിനെയോ പ്രവേശനസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘പ്രവേശനകവാടം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לֶאֱלִישָׁע
  choice: എലീശയുടെ
  rationale: ഇവിടെയുള്ള ל ഉടമസ്ഥതയെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു; അതിനാൽ വീട് എലീശയുടേതാണെന്ന അർഥം സ്വാഭാവികമായി നൽകി.
