  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ സംഭാഷണഭാവവും ശ്രദ്ധക്ഷണവും അഭ്യർഥനയുടെ വിനയവും നിലനിർത്തി; ആശയക്കുഴപ്പം സൃഷ്ടിക്കാവുന്ന സാങ്കേതിക പ്രയോഗങ്ങൾ അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു.
