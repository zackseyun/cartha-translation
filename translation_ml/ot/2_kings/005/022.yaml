source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם אֲדֹנִ/י֮ שְׁלָחַ֣/נִי לֵ/אמֹר֒ הִנֵּ֣ה עַתָּ֡ה זֶ֠ה בָּ֣אוּ אֵלַ֧/י שְׁנֵֽי נְעָרִ֛ים מֵ/הַ֥ר אֶפְרַ֖יִם מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים תְּנָ/ה נָּ֤א לָ/הֶם֙ כִּכַּר כֶּ֔סֶף וּ/שְׁתֵּ֖י חֲלִפ֥וֹת בְּגָדִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “എല്ലാം സുഖമാണ്.[a] എന്റെ യജമാനൻ എന്നെ അയച്ചിരിക്കുന്നു; അദ്ദേഹം പറഞ്ഞത് ഇതാണ്: ‘ഇതാ, ഇപ്പോൾത്തന്നെ എഫ്രയീം മലനാട്ടിൽനിന്ന് പ്രവാചകശിഷ്യന്മാരിൽപ്പെട്ട[b] രണ്ടു യുവാക്കൾ എന്റെ അടുക്കൽ വന്നിരിക്കുന്നു. ദയവായി അവർക്കു ഒരു താലന്ത്[c] വെള്ളിയും രണ്ട് മാറ്റുവസ്ത്രങ്ങളും കൊടുക്കണം.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സമാധാനം” / “എല്ലാം സുഖമാണ്.” ഇവിടെ എബ്രായപദമായ ശാലോം കുഴപ്പമൊന്നുമില്ലെന്ന ആശ്വാസവാക്കായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “പ്രവാചകന്മാരുടെ പുത്രന്മാർ”; പ്രവാചകസമൂഹത്തിലെ അംഗങ്ങളെയോ ശിഷ്യന്മാരെയോ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗം.
    reason: cultural_note
  - marker: c
    text: താലന്ത് വിലയേറിയ ലോഹങ്ങൾ തൂക്കുന്നതിനുള്ള വലിയൊരു അളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁלוֹם
  choice: എല്ലാം സുഖമാണ്
  rationale: ഇവിടെ ഈ പദം അഭിവാദനത്തേക്കാൾ, കുഴപ്പമൊന്നുമില്ലെന്ന ആശ്വാസവാക്കായാണ് പ്രവർത്തിക്കുന്നത്.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ഗേഹസി തന്റെ സേവക-യജമാന ബന്ധത്തിൽ എലീശയെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: שְׁלָחַנִי לֵאמֹר
  choice: എന്നെ അയച്ചിട്ട് ഇങ്ങനെ പറയാൻ പറഞ്ഞു
  rationale: അയച്ചതും കൈമാറേണ്ട സന്ദേശവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִנֵּה עַתָּה זֶה
  choice: ഇതാ, ഇപ്പോൾത്തന്നെ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഘടകവും സംഭവത്തിന്റെ അടിയന്തരതയും നിലനിർത്തുന്നു.
- source_word: נְעָרִים
  choice: യുവാക്കൾ
  rationale: പദത്തിന് ബാലന്മാർ, സേവകർ, യുവാക്കൾ എന്നീ അർഥസാധ്യതകളുണ്ടെങ്കിലും പ്രവാചകസമൂഹത്തിലെ അംഗങ്ങൾ എന്ന സന്ദർഭത്തിൽ ‘യുവാക്കൾ’ ഏറ്റവും നിഷ്പക്ഷമാണ്.
- source_word: מֵהַר אֶפְרַיִם
  choice: എഫ്രയീം മലനാട്ടിൽനിന്ന്
  rationale: ഒരൊറ്റ പർവതമല്ല, എഫ്രയീമിലെ ഉയർന്ന പ്രദേശമാണ് സാധാരണയായി ഉദ്ദേശിക്കുന്നത്.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: പ്രവാചകശിഷ്യന്മാരിൽപ്പെട്ട
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘പ്രവാചകന്മാരുടെ പുത്രന്മാർ’ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാം; പ്രവാചകസമൂഹത്തിലെ അംഗങ്ങൾ എന്ന സാങ്കേതിക അർഥം ഇതിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תְּנָה נָּא
  choice: ദയവായി ... കൊടുക്കണം
  rationale: കല്പനയോടൊപ്പമുള്ള വിനയസൂചക കണത്തിന്റെ അഭ്യർഥനാഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּכַּר כֶּסֶף
  choice: ഒരു താലന്ത് വെള്ളി
  rationale: വിലയേറിയ ലോഹങ്ങൾ തൂക്കുന്നതിനുള്ള വലിയ അളവായിരുന്ന പരമ്പരാഗത അളവുപദം സംരക്ഷിക്കുന്നു.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: രണ്ടു ജോഡി വസ്ത്രം
  rationale: മാറ്റിയുടുക്കാനുള്ള രണ്ടു സമ്പൂർണ വസ്ത്രസമുച്ചയങ്ങൾ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
