id: 2KI.5.12
reference: 2 Kings 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ/לֹ֡א טוֹב֩ אבנה וּ/פַרְפַּ֜ר נַהֲר֣וֹת דַּמֶּ֗שֶׂק מִ/כֹּל֙ מֵימֵ֣י יִשְׂרָאֵ֔ל הֲ/לֹֽא אֶרְחַ֥ץ בָּ/הֶ֖ם וְ/טָהָ֑רְתִּי וַ/יִּ֖פֶן וַ/יֵּ֥לֶךְ בְּ/חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
translation:
  language: ml
  text: “ദമസ്കൊസിലെ നദികളായ അബാനയും[a] ഫർപ്പറും ഇസ്രായേലിലെ സകല ജലങ്ങളെക്കാളും നല്ലവയല്ലേ? എനിക്കു അവയിൽ കഴുകി ശുദ്ധനാകാൻ കഴിയുമായിരുന്നില്ലേ[b]?” പിന്നെ അവൻ തിരിഞ്ഞ് ഉഗ്രകോപത്തോടെ പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചിലർ നദിയുടെ പേര് ‘അമാന’ എന്നു നൽകുന്നു; ഇത് പേരിന്റെ മറ്റൊരു പാരമ്പര്യരൂപത്തെ പിന്തുടരുന്നതാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘ശുദ്ധീകരിക്കപ്പെടുക’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദത്തിന് ശാരീരികമായ വൃത്തിയുടെയും കൂടുതൽ വിശാലമായ ശുദ്ധിയുടെയും ആശയങ്ങൾ പ്രകടിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: നല്ലവയല്ലേ? / ശുദ്ധനാകാമായിരുന്നില്ലേ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന രണ്ടു അലങ്കാരചോദ്യങ്ങളും സ്വാഭാവികമായ മലയാള ചോദ്യരൂപങ്ങളിൽ നിലനിർത്തുന്നു.
- source_word: טוֹב ... מִכֹּל
  choice: സകല ... ജലങ്ങളെക്കാളും നല്ലവ
  rationale: מִן ചേർന്ന താരതമ്യനിർമ്മിതി മലയാളത്തിലെ ‘-യെക്കാളും നല്ല’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കുന്നു; ‘സകല’ എന്നത് എബ്രായത്തിലെ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: אבנה
  choice: അബാന
  rationale: മസോററ്റിക് പാഠത്തിലെ ഭൂമിശാസ്ത്രനാമത്തിന്റെ രൂപം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘അമാന’ എന്ന പാരമ്പര്യരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וּפַרְפַּר
  choice: ഫർപ്പർ
  rationale: നദിയുടെ എബ്രായനാമം മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: נַהֲרוֹת דַּמֶּשֶׂק
  choice: ദമസ്കൊസിലെ നദികൾ
  rationale: എബ്രായത്തിലെ ബന്ധനിർമ്മിതി സ്വാഭാവികമായ മലയാള സ്ഥലബന്ധമായി നൽകുന്നു.
- source_word: מִכֹּל מֵימֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ സകല ജലങ്ങളെക്കാളും
  rationale: മൂലത്തിലെ പൊതുവായ ‘ജലങ്ങൾ’ എന്ന പദം ‘നദികൾ’ എന്ന് പരിമിതപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: אֶרְחַץ בָּהֶם
  choice: അവയിൽ കുളിച്ച്
  rationale: רחץ കഴുകുകയോ കുളിക്കുകയോ എന്നർഥമുള്ളതാണ്; നദികളിൽ ചെയ്യുന്ന പ്രവൃത്തിയായി ‘കുളിച്ച്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְטָהָרְתִּי
  choice: ശുദ്ധനാകാമായിരുന്നില്ലേ
  rationale: ശാരീരിക സൗഖ്യത്തിന്റെയും ശുദ്ധിയുടെയും അർഥവ്യാപ്തി ‘ശുദ്ധനാകുക’ നിലനിർത്തുന്നു; കർമ്മാനുഷ്ഠാനപരമായ അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: וַיִּפֶן וַיֵּלֶךְ
  choice: അവൻ തിരിഞ്ഞ് ... പോയി
  rationale: തുടർച്ചയായ രണ്ടു ചലനക്രിയകളും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּחֵמָה
  choice: ഉഗ്രകോപത്തോടെ
  rationale: חֵמָה സൂചിപ്പിക്കുന്ന തീവ്രമായ കോപം സാധാരണ ‘കോപം’ എന്നതിനെക്കാൾ ശക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ശുദ്ധീകരണഭാഷയുടെ സ്വഭാവം
  choice: ശുദ്ധനാകുക
  alternative: സൗഖ്യം പ്രാപിക്കുക / ശുദ്ധീകരിക്കപ്പെടുക
  rationale: നയമാന്റെ രോഗസന്ദർഭത്തോടൊപ്പം ശാരീരികവും വിശാലമായ ശുദ്ധിയുമായി ബന്ധപ്പെട്ടതുമായ അർഥസാധ്യതകൾ എബ്രായപദത്തിനുണ്ട്. ‘ശുദ്ധനാകുക’ ആ അർഥവ്യാപ്തി നിലനിർത്തുകയും രോഗസൗഖ്യം മാത്രമായോ ആചാരപരമായ ശുദ്ധീകരണം മാത്രമായോ ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. അലങ്കാരചോദ്യങ്ങളുടെ തീവ്രതയും നയമാന്റെ ഉഗ്രകോപവും നിലനിർത്തുന്നു; ഭൂമിശാസ്ത്രനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
