    rationale: The Hebrew verb can mean wash or bathe, but in this context a broader Malayalam 'കഴുകി' more closely reflects the source and preserves the cleansing terminology.
  - severity: low
    issue: '''ശുദ്ധനാകാമായിരുന്നില്ലേ?'' is less idiomatic as a rendering of the rhetorical potential.'
    rationale: '''എനിക്കു ... ശുദ്ധനാകാൻ കഴിയുമായിരുന്നില്ലേ?'' naturally expresses ''Could I not ... and be clean?'' while retaining the rhetorical question.'
