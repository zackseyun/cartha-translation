  revision_rationale: ലִקְרָאתֶךָ-യുടെ ‘എതിരേൽക്കുക’ എന്ന അർഥവും לָקַחַת-ന്റെ ‘സ്വീകരിക്കുക’ എന്ന അടിസ്ഥാനഅർഥവും വ്യക്തമായി സംരക്ഷിക്കാൻ രണ്ട് പരിമിതമായ തിരുത്തലുകൾ വരുത്തി. ഹൃദയം ‘പോകുക’ എന്ന എബ്രായ രൂപകവും, പേരുപറയാതെ ‘ആ മനുഷ്യൻ’ എന്നു പറയുന്ന അനിശ്ചിത/സൂചിത പരാമർശവും, സാമൂഹികപദങ്ങളുടെ ലിംഗജോടിയും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പുകൾ പുതുക്കിയ മുഖ്യവാക്യത്തിലെ പദപ്രയോഗത്തോടു ഒത്തുചേർത്തിരിക്കുന്നു.
