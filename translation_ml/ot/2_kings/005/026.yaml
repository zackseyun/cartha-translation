  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לֹא לִבִּ֣/י הָלַ֔ךְ כַּ/אֲשֶׁ֧ר הָֽפַךְ אִ֛ישׁ מֵ/עַ֥ל מֶרְכַּבְתּ֖/וֹ לִ/קְרָאתֶ֑/ךָ הַ/עֵ֞ת לָ/קַ֤חַת אֶת הַ/כֶּ֨סֶף֙ וְ/לָ/קַ֣חַת בְּגָדִ֔ים וְ/זֵיתִ֤ים וּ/כְרָמִים֙ וְ/צֹ֣אן וּ/בָקָ֔ר וַ/עֲבָדִ֖ים וּ/שְׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ അവനോട് പറഞ്ഞു: “ആ മനുഷ്യൻ തന്റെ രഥത്തിൽനിന്ന് തിരിഞ്ഞ് നിന്നെ എതിരേൽക്കാൻ വന്നപ്പോൾ എന്റെ ഹൃദയം നിന്നോടൊപ്പം പോയില്ലയോ?[a] വെള്ളിയും വസ്ത്രങ്ങളും ഒലിവുതോട്ടങ്ങളും മുന്തിരിത്തോട്ടങ്ങളും ആടുമാടുകളും ദാസന്മാരെയും ദാസിമാരെയും സ്വീകരിക്കാനുള്ള സമയമാണോ ഇത്?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: “ആ മനുഷ്യൻ തന്റെ രഥത്തിൽനിന്ന് തിരിഞ്ഞ് നിന്നെ എതിരേൽക്കാൻ വന്നപ്പോൾ ഞാൻ ആത്മാവിൽ അവിടെ ഉണ്ടായിരുന്നില്ലയോ?”'
    reason: lexical_alternative
  - marker: b
    text: “ദാസന്മാരും ദാസിമാരും” എന്നതിന് “അടിമകളായ പുരുഷന്മാരും സ്ത്രീകളും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי הָלַךְ
  choice: എന്റെ ഹൃദയം നിന്നോടൊപ്പം പോയില്ലയോ?
  rationale: എലീശയുടെ ആന്തരികമായ അറിവോ സാന്നിധ്യമോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു. മലയാളത്തിൽ അർഥം വ്യക്തമാകാൻ സന്ദർഭത്തിൽ അന്തർലീനമായ ‘നിന്നോടൊപ്പം’ ചേർത്തു; വ്യാഖ്യാനാത്മകമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: כַּאֲשֶׁר הָפַךְ אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ
  choice: ആ മനുഷ്യൻ തന്റെ രഥത്തിൽനിന്ന് തിരിഞ്ഞ് നിന്നെ കാണാൻ വന്നപ്പോൾ
  rationale: הָפַךְ എന്നതിന്റെ അടിസ്ഥാനമായ ‘തിരിയുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; לִקְרָאתֶךָ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ‘നിന്നെ കാണാൻ വന്നപ്പോൾ’ എന്നു നൽകി. വ്യക്തിയുടെ പേര് മൂലപാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- source_word: הָעֵת
  choice: സമയമാണോ ഇത്?
  rationale: പ്രത്യക്ഷമായ ചോദ്യംചിഹ്നപദം ഇല്ലെങ്കിലും സന്ദർഭത്തിലെ ശാസനാത്മക ചോദ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לָקַחַת אֶת הַכֶּסֶף ... וְלָקַחַת
  choice: വെള്ളിയും ... സമ്പാദിക്കാനുള്ള
  rationale: ആവർത്തിച്ച ‘എടുക്കുക’ എന്ന ക്രിയ ഇവിടെ തുടർന്നുവരുന്ന സമ്പത്തിന്റെ മുഴുവൻ പട്ടികയെയും നിയന്ത്രിക്കുന്നു. വെറും കൈപ്പറ്റലിനേക്കാൾ വിപുലമായ സമ്പാദനലക്ഷ്യം സൂചിപ്പിക്കാൻ പട്ടികയോടൊപ്പം ‘സമ്പാദിക്കുക’ സ്വാഭാവികമാണ്; כֶּסֶף എന്നത് ‘വെള്ളി’യായി നിലനിർത്തി.
- source_word: בְּגָדִים
  choice: വസ്ത്രങ്ങൾ
  rationale: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും മൂലപദത്തോട് അടുത്തതുമായ രൂപം.
- source_word: זֵיתִים וּכְרָמִים
  choice: ഒലിവുതോട്ടങ്ങളും മുന്തിരിത്തോട്ടങ്ങളും
  rationale: മുന്തിരിത്തോട്ടങ്ങൾ, കന്നുകാലികൾ, ഭൃത്യർ എന്നിവയോടൊപ്പം വരുന്ന സമ്പത്തിന്റെ പട്ടികയിൽ ഉൽപാദനസ്വത്തായ തോട്ടങ്ങളാണ് ഉദ്ദേശ്യമെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: צֹאן וּבָקָר
  choice: ആടുമാടുകൾ
  rationale: ചെറുകന്നുകാലികളും വലിയ കന്നുകാലികളും ചേർന്ന ജോടിയെ മലയാളത്തിലെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ കൂട്ടുപദംകൊണ്ട് അവതരിപ്പിക്കുന്നു.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: ദാസന്മാരും ദാസിമാരും
  rationale: മൂലത്തിലെ പുരുഷ-സ്ത്രീ വ്യത്യാസം സംരക്ഷിക്കുന്നു. ‘ദാസൻ/ദാസി’ സേവനവും അടിമസ്ഥിതിയും ഉൾക്കൊള്ളാവുന്ന ചരിത്രപരമായ പദമാണ്; കൂടുതൽ വ്യക്തമായ സാമൂഹിക പദവിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: לִבִּי הָלַךְ എന്ന പ്രയോഗത്തിലെ പ്രവാചകന്റെ അറിവ്/സാന്നിധ്യം
  choice: എന്റെ ഹൃദയം നിന്നോടൊപ്പം പോയില്ലയോ?
  alternative: ആ മനുഷ്യൻ തന്റെ രഥത്തിൽനിന്ന് തിരിഞ്ഞ് നിന്നെ കാണാൻ വന്നപ്പോൾ ഞാൻ ആത്മാവിൽ അവിടെ ഉണ്ടായിരുന്നില്ലയോ?
  rationale: മൂലത്തിലെ രൂപകം നിലനിർത്തുകയും, അതിനെ പ്രത്യേകമായ ഒരു പ്രവാചകശക്തിയെക്കുറിച്ചുള്ള സിദ്ധാന്തവാക്യമായി നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: עֲבָדִים וּשְׁפָחוֹת എന്ന സാമൂഹിക പദവികൾ
  choice: ദാസന്മാരും ദാസിമാരും
  alternative: അടിമകളായ പുരുഷന്മാരും സ്ത്രീകളും
  rationale: ലിംഗജോടിയും സമ്പത്തിന്റെ പട്ടികയിലെ സ്ഥാനവും സംരക്ഷിക്കുന്നു; ബന്ധിതാവസ്ഥയെ കൂടുതൽ വ്യക്തമായി പറയുന്ന സാധ്യത വായനക്കാരുടെ പരിശോധനയ്ക്കായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹൃദയം ‘പോകുക’ എന്ന എബ്രായ രൂപകം പ്രധാനവാചകത്തിൽ സംരക്ഷിച്ചു; അസ്വാഭാവികത കുറയ്ക്കാൻ ‘നിന്നോടൊപ്പം’ വ്യക്തമാക്കി. സമ്പത്തിന്റെ പട്ടിക മലയാളത്തിൽ ഒരൊറ്റ നിയന്ത്രകക്രിയയോടെ സ്വാഭാവികമാക്കി.
