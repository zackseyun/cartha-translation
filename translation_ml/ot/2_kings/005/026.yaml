    text: 'അല്ലെങ്കിൽ, കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: “ആ മനുഷ്യൻ തന്റെ രഥത്തിൽനിന്ന് തിരിഞ്ഞ് നിന്നെ എതിരേൽക്കാൻ വന്നപ്പോൾ ഞാൻ ആത്മാവിൽ അവിടെ ഉണ്ടായിരുന്നില്ലയോ?”'
