    rationale: എബ്രായ ക്രിയയുടെ അടിസ്ഥാനഅർഥം ‘എടുക്കുക/സ്വീകരിക്കുക’ ആണ്. ‘സമ്പാദിക്കുക’ എന്നത് സ്വത്ത് നേടിയെടുക്കൽ എന്ന കൂടുതൽ നിർദിഷ്ട അർഥം ചേർക്കുന്നു. പ്രവാചകന്റെ ശാസനയിൽ ഉദ്ദേശിക്കുന്ന കൈപ്പറ്റൽ നിലനിർത്താൻ ‘സ്വീകരിക്കുക’ സുരക്ഷിതമാണ്.
  revised_text: 'അപ്പോൾ അവൻ അവനോട് പറഞ്ഞു: “ആ മനുഷ്യൻ തന്റെ രഥത്തിൽനിന്ന് തിരിഞ്ഞ് നിന്നെ എതിരേൽക്കാൻ വന്നപ്പോൾ എന്റെ ഹൃദയം നിന്നോടൊപ്പം പോയില്ലയോ?[a] വെള്ളിയും വസ്ത്രങ്ങളും ഒലിവുതോട്ടങ്ങളും മുന്തിരിത്തോട്ടങ്ങളും ആടുമാടുകളും ദാസന്മാരെയും ദാസിമാരെയും സ്വീകരിക്കാനുള്ള സമയമാണോ ഇത്?[b]”'
