  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
translation:
  language: ml
  text: അങ്ങനെ അവൻ ഇറങ്ങിച്ചെന്ന് ദൈവപുരുഷന്റെ വചനപ്രകാരം യോർദാനിൽ ഏഴു പ്രാവശ്യം മുങ്ങി[a]. അപ്പോൾ അവന്റെ മാംസം ഒരു കൊച്ചുകുട്ടിയുടെ മാംസംപോലെ പൂർവസ്ഥിതിയിലായി; അവൻ ശുദ്ധനായിത്തീർന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്നെത്തന്നെ മുക്കി.” എബ്രായക്രിയയ്ക്ക് മുക്കുക, മുങ്ങുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവൻ ശുദ്ധീകരിക്കപ്പെട്ടു.” എബ്രായക്രിയയെ ശുദ്ധനായിത്തീർന്ന ഫലാവസ്ഥയായോ ശുദ്ധീകരിക്കപ്പെട്ടതായോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: അങ്ങനെ അവൻ ഇറങ്ങിച്ചെന്ന്
  rationale: വാവ് തുടർന്നുള്ള സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നതോടൊപ്പം മുൻനിർദേശത്തോടുള്ള പ്രതികരണവും സൂചിപ്പിക്കുന്നു; ירד എന്നതിലെ താഴേക്കുള്ള ചലനം നിലനിർത്തുന്നു.
- source_word: וַיִּטְבֹּל
  choice: മുങ്ങി
  rationale: טבל മുക്കുക അഥവാ മുങ്ങുക എന്ന ഭൗതികപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കർത്താവ് തന്നെയാണ് പ്രവൃത്തി ചെയ്യുന്നത് എന്ന സജീവരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בַּיַּרְדֵּן
  choice: യോർദാനിൽ
  rationale: നദിയുടെ പരമ്പരാഗത മലയാള നാമരൂപം ഉപയോഗിച്ചു; സന്ദർഭത്തിൽ ‘നദി’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: ആവർത്തിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സംഖ്യാവാക്യത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: כִּדְבַר אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷന്റെ വചനപ്രകാരം
  rationale: דבר എന്നതിന്റെ ‘വചനം/പറഞ്ഞത്’ എന്ന വ്യാപ്തിയും אִישׁ הָאֱלֹהִים എന്ന പ്രവാചകപദവിയുടെ ദൈവശാസ്ത്രഭാരവും സംരക്ഷിക്കുന്നു.
- source_word: וַיָּשָׁב בְּשָׂרוֹ
  choice: അവന്റെ മാംസം പൂർവസ്ഥിതിയിലായി
  rationale: שׁוב എന്ന ‘തിരികെയാകുക’ എന്ന ആശയം മലയാളത്തിൽ ഫലസൂചകമായി നൽകുന്നു; בשר എന്ന ശരീരസംബന്ധിയായ ദൃശ്യരൂപത്തിന് ‘മാംസം’ നിലനിർത്തുന്നു.
- source_word: כִּבְשַׂר נַעַר קָטֹן
  choice: ഒരു കൊച്ചുകുട്ടിയുടെ മാംസംപോലെ
  rationale: נער קטן ചെറുപ്പമുള്ള കുട്ടിയെ സൂചിപ്പിക്കുന്നു. ലിംഗം അനാവശ്യമായി കൂടുതൽ നിർണ്ണയിക്കാതെ vivid comparison നിലനിർത്താൻ ‘കൊച്ചുകുട്ടി’ ഉപയോഗിച്ചു.
- source_word: וַיִּטְהָר
  choice: അവൻ ശുദ്ധനായിത്തീർന്നു
  rationale: ക്രിയയുടെ ഫലാവസ്ഥയായ ‘ശുദ്ധനാകുക’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ശാരീരിക സൗഖ്യത്തെയും ശുദ്ധിയെയും ഒന്നിലൊന്ന് ലയിപ്പിക്കാതെ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: നയമാന്റെ പുനഃസ്ഥാപനത്തിന്റെ സ്വഭാവം
  choice: ശരീരത്തിന്റെ പൂർവസ്ഥിതിയും ശുദ്ധനായിത്തീർന്ന ഫലാവസ്ഥയും രണ്ടായി നിലനിർത്തി.
  alternative: ‘സൗഖ്യം പ്രാപിച്ചു’ എന്നു വൈദ്യപരമായി മാത്രം പറയുക, അല്ലെങ്കിൽ ‘ശുദ്ധീകരിക്കപ്പെട്ടു’ എന്നു ആചാരശുദ്ധിക്ക് കൂടുതൽ ഊന്നൽ നൽകുക.
  rationale: എബ്രായപാഠം ശരീരത്തിലെ മാറ്റവും ശുദ്ധിയുടെ ഫലാവസ്ഥയും പറയുന്നു. ഏതെങ്കിലും സാക്രമെന്റൽ, പ്രതീകാത്മക, അഥവാ കേവലം വൈദ്യപരമായ വ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ രണ്ടും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൈവപുരുഷൻ’, ‘വചനം’, ‘ശുദ്ധനായിത്തീർന്നു’ എന്നീ ബൈബിൾപരിചിത പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
