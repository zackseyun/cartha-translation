revisions:
- from: അവൻ അവനോട്, “സമാധാനത്തോടെ പോകുക” എന്നു പറഞ്ഞു. അങ്ങനെ അവൻ അവനെ വിട്ട് കുറച്ചു ദൂരം[a] പോയി.
  to: അവൻ അവനോട്, “സമാധാനത്തോടെ പോകുക” എന്നു പറഞ്ഞു. അങ്ങനെ അവൻ അവനിൽനിന്ന് ഒരു ദൂരം[a] പോയി.
  rationale: ‘ഒരു ദൂരം’ retains the Hebrew expression’s deliberately unspecified extent and avoids suggesting that Naaman traveled only a short distance. ‘അവനിൽനിന്ന്’ directly represents departure from Elisha’s presence. The revised footnote explains the expression idiomatically rather than presenting an unhelpful literal gloss.
