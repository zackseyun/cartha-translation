source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר ל֖/וֹ לֵ֣ךְ לְ/שָׁל֑וֹם וַ/יֵּ֥לֶךְ מֵ/אִתּ֖/וֹ כִּבְרַת אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/019.yaml
  text: And he said to him[a], “Go in peace.” So he went from him some distance.
translation:
  language: ml
  text: അവൻ അവനോട്, “സമാധാനത്തോടെ പോകുക” എന്നു പറഞ്ഞു. അങ്ങനെ അവൻ അവനിൽനിന്ന് ഒരു ദൂരം[a] പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായ പ്രയോഗം കൃത്യമായ അളവ് വ്യക്തമാക്കാതെ യാത്രചെയ്ത ഒരു ദൂരവ്യാപ്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לּוֹ
  choice: അവൻ അവനോട് … എന്നു പറഞ്ഞു
  rationale: ഹീബ്രായ കഥനത്തിന്റെ തുടർച്ചയും പരോക്ഷ കർമവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സംസാരിക്കുന്നത് എലീശാവും കേൾക്കുന്നത് നയമാനും ആണെങ്കിലും പേരുകൾ മൂലപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: לֵךְ לְשָׁלוֹם
  choice: സമാധാനത്തോടെ പോകുക
  rationale: അനുഗ്രഹത്തോടുകൂടിയ യാത്രയയപ്പായി ഉപയോഗിക്കുന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: וַיֵּלֶךְ מֵאִתּוֹ
  choice: അങ്ങനെ അവൻ അവനെ വിട്ട് … പോയി
  rationale: തുടർന്നുള്ള കഥനക്രമം വ്യക്തമാക്കുകയും എലീശാവിന്റെ സന്നിധിയിൽനിന്നുള്ള നയമാന്റെ പുറപ്പെടൽ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: כִּבְרַת אָרֶץ
  choice: കുറച്ചു ദൂരം
  rationale: കൃത്യമായ അളവ് നിർദേശിക്കാതെ യാത്രചെയ്ത ഒരു ദൂരവ്യാപ്തിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ പ്രയോഗം; ‘വളരെ ദൂരം’ എന്ന അതിശയോക്തി ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: രിമ്മോന്റെ ആലയത്തെക്കുറിച്ചുള്ള നയമാന്റെ അപേക്ഷയ്ക്കു ശേഷമുള്ള എലീശാവിന്റെ മറുപടിയുടെ ധാർമിക അർഥം
  choice: ‘സമാധാനത്തോടെ പോകുക’ എന്ന അനുഗ്രഹാത്മക യാത്രയയപ്പ് മാത്രം പരിഭാഷപ്പെടുത്തുന്നു.
  alternative: നയമാന്റെ നിർദേശിച്ച പ്രവൃത്തിക്ക് എലീശാവ് വ്യക്തമായ അംഗീകാരം നൽകിയെന്നോ അതിനെ നിരസിച്ചെന്നോ വ്യാഖ്യാനിച്ച് ചേർക്കുക.
  rationale: ഹീബ്രായ പാഠം അംഗീകാരമോ അപലപനമോ വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലപാഠത്തിലെ സർവനാമങ്ങൾ നിലനിർത്തിയതിനാൽ സന്ദർഭപരമായ അവ്യക്തത അനാവശ്യമായി പരിഹരിച്ചിട്ടില്ല; അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട ‘കുറച്ചു ദൂരം’ എന്ന പ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
