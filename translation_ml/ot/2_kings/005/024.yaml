source:
  edition: WLC
  text: וַ/יָּבֹא֙ אֶל הָ/עֹ֔פֶל וַ/יִּקַּ֥ח מִ/יָּדָ֖/ם וַ/יִּפְקֹ֣ד בַּ/בָּ֑יִת וַ/יְשַׁלַּ֥ח אֶת הָ/אֲנָשִׁ֖ים וַ/יֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/024.yaml
  text: When he came to the hill[a], he took them from their hands and deposited them in the house. Then he sent the men away[c][b], and they went.
translation:
  language: ml
  text: അവൻ ആ മേട്ടിൽ[a] എത്തിയപ്പോൾ, സാധനങ്ങൾ അവരുടെ കൈയിൽനിന്ന് വാങ്ങി വീട്ടിൽ സൂക്ഷിച്ചുവച്ചു. പിന്നെ അവൻ ആ ആളുകളെ പറഞ്ഞയച്ചു; അവർ പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മൺകൂന,’ ‘കോട്ടകെട്ടിയ കുന്ന്,’ അല്ലെങ്കിൽ ‘ഓഫേൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹפֶל
  choice: കുന്നിൻമേട്
  rationale: עֹפֶל ഉയർന്ന മേട്, മൺകൂന, അല്ലെങ്കിൽ കോട്ടകെട്ടിയ കുന്ന് എന്നിവയെ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ സ്ഥലരൂപത്തെ സൂചിപ്പിക്കുന്ന ‘കുന്നിൻമേട്’ സ്വാഭാവികമാണ്; അതിനെ നിർബന്ധമായി സ്ഥലനാമമായ ‘ഓഫേൽ’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: מִיָּדָם
  choice: അവരുടെ കൈയിൽനിന്ന്
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘കൈ’ ബഹുവചന പ്രത്യയത്തോടുകൂടി, ഒരാളിൽനിന്ന് നേരിട്ട് ഏറ്റുവാങ്ങുക എന്നർഥമുള്ള പ്രയോഗമാണ്. മലയാളത്തിലും ‘അവരുടെ കൈയിൽനിന്ന്’ സ്വാഭാവികമായി ആ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: וַיִּפְקֹד
  choice: സൂക്ഷിച്ചുവച്ചു
  rationale: פקד എന്ന ക്രിയയ്ക്ക് ശ്രദ്ധിക്കുക, ഏൽപ്പിക്കുക, നിയമിക്കുക, നിക്ഷേപിക്കുക തുടങ്ങിയ വിശാലമായ അർഥപരിധിയുണ്ട്. ഇവിടെ ഗേഹസി ഏറ്റുവാങ്ങിയ സാധനങ്ങൾ വീട്ടിനുള്ളിൽ സുരക്ഷിതമായി വെച്ചതിനെ ‘സൂക്ഷിച്ചുവച്ചു’ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: בַּבָּיִת
  choice: വീട്ടിൽ
  rationale: בית ഇവിടെ സാധനങ്ങൾ വെച്ച ഭൗതികമായ വീടിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: הָאֲנָשִׁים
  choice: ആ ആളുകളെ
  rationale: മൂലപാഠം പ്രത്യേകമായി ‘ദാസന്മാർ’ എന്നു പറയാതെ പൊതുവായ ‘ആളുകൾ/പുരുഷന്മാർ’ എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്. സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ചവരായതിനാൽ ‘ആ ആളുകളെ’ യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ വാക്യക്രമത്തിലെ തുടർച്ച നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമായ കാല-ബന്ധക പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. ‘സാധനങ്ങൾ’ എന്നത് മുൻസന്ദർഭത്തിലെ വെള്ളിയും വസ്ത്രങ്ങളും സൂചിപ്പിക്കുന്നതിനായി സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കപ്പെട്ട പൂരകമാണ്.
