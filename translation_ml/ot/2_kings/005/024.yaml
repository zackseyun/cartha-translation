  to: അവൻ ആ മേട്ടിൽ[a] എത്തിയപ്പോൾ, സാധനങ്ങൾ അവരുടെ കൈയിൽനിന്ന് വാങ്ങി വീട്ടിൽ സൂക്ഷിച്ചുവച്ചു. പിന്നെ അവൻ ആ ആളുകളെ പറഞ്ഞയച്ചു; അവർ പോയി.
