source:
  edition: WLC
  text: לַ/דָּבָ֣ר הַ/זֶּ֔ה יִסְלַ֥ח יְהוָ֖ה לְ/עַבְדֶּ֑/ךָ בְּ/ב֣וֹא אֲדֹנִ֣/י בֵית רִמּוֹן֩ לְ/הִשְׁתַּחֲוֺ֨ת שָׁ֜מָּ/ה וְ/ה֣וּא נִשְׁעָ֣ן עַל יָדִ֗/י וְ/הִֽשְׁתַּחֲוֵ֨יתִי֙ בֵּ֣ית רִמֹּ֔ן בְּ/הִשְׁתַּחֲוָיָ֨תִ/י֙ בֵּ֣ית רִמֹּ֔ן יִסְלַח נא יְהוָ֥ה לְ/עַבְדְּ/ךָ֖ בַּ/דָּבָ֥ר הַ/זֶּֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
translation:
  language: ml
  text: 'ഈ കാര്യത്തിൽ യഹോവ അങ്ങയുടെ ദാസനോടു ക്ഷമിക്കുമാറാകട്ടെ: എന്റെ യജമാനൻ രിമ്മോന്റെ ഭവനത്തിൽ കുമ്പിടാൻ[a] ചെല്ലുമ്പോൾ, അദ്ദേഹം എന്റെ കൈയിൽ ചാരുന്നു; അങ്ങനെ ഞാനും രിമ്മോന്റെ ഭവനത്തിൽ കുമ്പിടുന്നു. ഞാൻ രിമ്മോന്റെ ഭവനത്തിൽ കുമ്പിടുമ്പോൾ[b], ഈ കാര്യത്തിൽ യഹോവ അങ്ങയുടെ ദാസനോടു ദയവായി ക്ഷമിക്കുമാറാകട്ടെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആരാധിക്കാൻ’; എബ്രായ ക്രിയയ്ക്ക് ശാരീരികമായി കുമ്പിടുന്നതും ആരാധിക്കുന്നതും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘രിമ്മോന്റെ ഭവനം’ എന്നത് അരാമ്യദേവനായ രിമ്മോന്റെ ക്ഷേത്രത്തെയോ ആരാധനാലയത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יִסְלַח
  choice: ക്ഷമിക്കുമാറാകട്ടെ
  rationale: യാചനാത്മകമായ ക്രിയാഭാവം നിലനിർത്തുകയും ഒരു പ്രത്യേക കാര്യത്തിൽ ദൈവിക ക്ഷമ അഭ്യർഥിക്കുന്നതു സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: לְעַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജസദസ്സിലെ വിനയപൂർവമായ സ്വയംപരാമർശത്തിന് ‘ദാസൻ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בְּבוֹא אֲדֹנִי
  choice: എന്റെ യജമാനൻ ... ചെല്ലുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct-ന്റെ കാലസൂചനയും നയമാൻ സേവിക്കുന്ന രാജാവിനോടുള്ള ബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: בֵית רִמּוֹן
  choice: രിമ്മോന്റെ ഭവനം
  rationale: എബ്രായത്തിലെ ‘രിമ്മോന്റെ വീട്/ഭവനം’ എന്ന രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ക്ഷേത്രമോ ആരാധനാലയമോ ആണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: കുമ്പിടാൻ
  rationale: ശാരീരികമായി കുനിഞ്ഞു വണങ്ങുന്നതും ആരാധിക്കുന്നതും സൂചിപ്പിക്കാവുന്ന ക്രിയയുടെ അർഥവ്യാപ്തി പൂർണമായി ഒരുവശത്തേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: נִשְׁעָן עַל יָדִי
  choice: എന്റെ കൈയിൽ ചാരുന്നതിനാൽ
  rationale: പിന്തുണയ്ക്കായി കൈയിൽ ചാരുന്ന രാജാവിന്റെ പ്രവൃത്തിയെ മൂലരൂപത്തോട് ചേർന്ന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: ഞാനും ... കുമ്പിടേണ്ടിവരുന്നു
  rationale: യജമാനനെ താങ്ങുന്നതിനിടയിൽ നയമാനും ആ പ്രവൃത്തിയിൽ ഉൾപ്പെടുന്ന സന്ദർഭഫലം വ്യക്തമാക്കുന്നു; മനഃപൂർവ ആരാധനയാണെന്ന് വിധിക്കുന്നില്ല.
- source_word: נָא
  choice: ദയവായി
  rationale: അപേക്ഷയുടെ വിനയവും തീവ്രതയും ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: הִשְׁתַּחֲוָה എന്നത് വിഗ്രഹാരാധനാസന്ദർഭത്തിൽ ‘ആരാധിക്കുക’ എന്നോ ശാരീരികമായി ‘കുമ്പിടുക’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: കുമ്പിടുക
  alternative: ആരാധിക്കുക; സാഷ്ടാംഗം വീഴുക
  rationale: എബ്രായക്രിയയ്ക്ക് ആരാധനയും ശാരീരികമായ കുനിഞ്ഞു വണങ്ങലും സൂചിപ്പിക്കാം. നയമാന്റെ ആന്തരിക വിശ്വസ്തതയെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം തീരുമാനിക്കാതെ, ഔദ്യോഗിക ബാധ്യതയിൽ സംഭവിക്കുന്ന ബാഹ്യപ്രവൃത്തിയും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും ‘കുമ്പിടുക’ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവത്തോടുള്ള പരോക്ഷ അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. ആവർത്തനം മൂലപാഠത്തിലെ ഊന്നൽ കാത്തുസൂക്ഷിക്കാൻ നിലനിർത്തി; പ്രധാന പാഠത്തിൽ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ചേർത്തു.
