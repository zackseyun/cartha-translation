  revised_text: 'ഈ കാര്യത്തിൽ യഹോവ അങ്ങയുടെ ദാസനോടു ക്ഷമിക്കുമാറാകട്ടെ: എന്റെ യജമാനൻ രിമ്മോന്റെ ഭവനത്തിൽ കുമ്പിടാൻ[a] ചെല്ലുമ്പോൾ, അദ്ദേഹം എന്റെ കൈയിൽ ചാരുന്നു; അങ്ങനെ ഞാനും രിമ്മോന്റെ ഭവനത്തിൽ കുമ്പിടുന്നു. ഞാൻ രിമ്മോന്റെ ഭവനത്തിൽ കുമ്പിടുമ്പോൾ[b], ഈ കാര്യത്തിൽ യഹോവ അങ്ങയുടെ ദാസനോടു ദയവായി ക്ഷമിക്കുമാറാകട്ടെ.'
