revisions:
- from: 'ഈ കാര്യത്തിൽ യഹോവ അങ്ങയുടെ ദാസനോടു ക്ഷമിക്കുമാറാകട്ടെ: എന്റെ യജമാനൻ കുമ്പിടാൻ[a] രിമ്മോന്റെ ഭവനത്തിൽ ചെല്ലുമ്പോൾ, അദ്ദേഹം എന്റെ കൈയിൽ ചാരുന്നതിനാൽ ഞാനും രിമ്മോന്റെ ഭവനത്തിൽ കുമ്പിടേണ്ടിവരുന്നു—ഞാൻ രിമ്മോന്റെ ഭവനത്തിൽ കുമ്പിടുമ്പോൾ, ഈ കാര്യത്തിൽ യഹോവ അങ്ങയുടെ ദാസനോടു ദയവായി ക്ഷമിക്കുമാറാകട്ടെ. [b]'
  to: 'ഈ കാര്യത്തിൽ യഹോവ അങ്ങയുടെ ദാസനോടു ക്ഷമിക്കുമാറാകട്ടെ: എന്റെ യജമാനൻ രിമ്മോന്റെ ഭവനത്തിൽ കുമ്പിടാൻ[a] ചെല്ലുമ്പോൾ, അദ്ദേഹം എന്റെ കൈയിൽ ചാരുന്നു; അങ്ങനെ ഞാനും രിമ്മോന്റെ ഭവനത്തിൽ കുമ്പിടുന്നു. ഞാൻ രിമ്മോന്റെ ഭവനത്തിൽ കുമ്പിടുമ്പോൾ[b], ഈ കാര്യത്തിൽ യഹോവ അങ്ങയുടെ ദാസനോടു ദയവായി ക്ഷമിക്കുമാറാകട്ടെ.'
  rationale: മൂലപാഠം നേരിട്ട് പറയാത്ത ‘നിർബന്ധമായും ചെയ്യേണ്ടിവരുന്നു’ എന്ന ആശയം ഒഴിവാക്കി, നയമാന്റെ പ്രവൃത്തിയെ നേരിട്ടുള്ള രൂപത്തിൽ നൽകി. ആവർത്തനവും അപേക്ഷയുടെ വിനയവും നിലനിർത്തി; സാംസ്കാരിക അടിക്കുറിപ്പ് അതു വിശദീകരിക്കുന്ന പദസമുച്ചയത്തോടു ചേർത്തു.
