  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
translation:
  language: ml
  text: 'എന്നാൽ നയമാൻ കോപിച്ച് അവിടെനിന്ന് പോയി. അവൻ പറഞ്ഞു: “ഇതാ, ഞാൻ മനസ്സിൽ പറഞ്ഞു: ‘അവൻ തീർച്ചയായും എന്റെ അടുക്കലേക്ക് പുറത്തുവന്ന്, നിന്നുകൊണ്ട്, തന്റെ ദൈവമായ യഹ്‌വേയുടെ നാമം വിളിച്ചപേക്ഷിച്ച്, ആ സ്ഥലത്തിന്മേൽ കൈ വീശി കുഷ്ഠബാധിതനെ[a] സൗഖ്യമാക്കും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കുഷ്ഠസദൃശമായ ചർമ്മരോഗബാധ നീക്കും.” ഹീബ്രുവിൽ “കുഷ്ഠബാധിതൻ” എന്നർഥമുള്ള ഒരു പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എന്നാൽ ഈ പ്രയോഗത്തിൽ ക്രിയ രോഗബാധ നീക്കുന്നതിനെ സൂചിപ്പിക്കാം. ഇവിടെ “കുഷ്ഠം” എന്നത് ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ ഏതെങ്കിലും പ്രത്യേക രോഗനിർണയത്തെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: കോപിച്ച്
  rationale: קצף കോപത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികവും അതിശയോക്തിയില്ലാത്തതുമായ മലയാളപ്രയോഗം.
- source_word: וַיֵּלַךְ
  choice: അവിടെനിന്നു പോയി
  rationale: എലീശയുടെ വീട്ടിൽനിന്നുള്ള അമർഷപൂർവമായ പുറപ്പെടൽ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: הִנֵּה אָמַרְתִּי אֵלַי
  choice: ഞാൻ എന്നോടുതന്നെ പറഞ്ഞത്
  rationale: ‘ഞാൻ വിചാരിച്ചു’ എന്നു ലഘൂകരിക്കാതെ ഹീബ്രു ശൈലിയായ സ്വയംപറച്ചിൽ നിലനിർത്തുന്നു; הִנֵּהയുടെ ഊന്നൽ ഉദ്ധരണിയുടെ പ്രതീക്ഷാഭാവത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: יֵצֵא יָצוֹא
  choice: തീർച്ചയായും ... പുറത്തുവന്ന്
  rationale: ക്രിയയോടൊപ്പമുള്ള infinitive absolute നൽകുന്ന ശക്തമായ ഉറപ്പ് ‘തീർച്ചയായും’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: וְקָרָא בְּשֵׁם יְהוָה אֱלֹהָיו
  choice: തന്റെ ദൈവമായ യഹ്‌വേയുടെ നാമം വിളിച്ചപേക്ഷിക്കുകയും
  rationale: קרא בשם എന്ന ദൈവിക അഭ്യർഥനയുടെ പ്രയോഗം ‘നാമം വിളിച്ചപേക്ഷിക്കുക’ എന്ന് നൽകി; יהוה വ്യക്തിനാമമായി ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וְהֵנִיף יָדוֹ אֶל הַמָּקוֹם
  choice: രോഗബാധിതമായ സ്ഥലത്തിനുമീതെ കൈ വീശി
  rationale: הניף സൂചിപ്പിക്കുന്ന വീശൽചലനം നിലനിർത്തുന്നു; ‘സ്ഥലം’ രോഗബാധിത ഭാഗമാണെന്ന സന്ദർഭാർഥം വായനാസൗകര്യത്തിനായി വ്യക്തമാക്കുന്നു.
- source_word: וְאָסַף הַמְּצֹרָע
  choice: കുഷ്ഠരോഗിയെ സൗഖ്യമാക്കുകയും
  rationale: אסף ഇവിടെ ബാധ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; הַמְּצֹרָע വ്യാകരണപരമായി രോഗബാധിതനായ വ്യക്തിയെ സൂചിപ്പിക്കാവുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘കുഷ്ഠരോഗിയെ സൗഖ്യമാക്കുക’ എന്നു നൽകി, എന്നാൽ പദസംബന്ധമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർക്ഷര ദൈവനാമം പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: צרע പദകുടുംബത്തിന്റെ രോഗസൂചന
  choice: കുഷ്ഠരോഗി
  alternative: ചർമ്മരോഗബാധിതൻ
  rationale: ‘കുഷ്ഠം’ എന്ന പരമ്പരാഗത ബൈബിൾപദം വായനക്കാർക്ക് പരിചിതമാണ്; എന്നാൽ അത് ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ ഹാൻസൻസ് രോഗത്തോടു കൃത്യമായി തുല്യമെന്ന അവകാശവാദം ഉദ്ദേശിക്കുന്നില്ല.
- issue: וְאָסַף הַמְּצֹרָע എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: കുഷ്ഠരോഗിയെ സൗഖ്യമാക്കുക
  alternative: കുഷ്ഠബാധ നീക്കുക
  rationale: הַמְּצֹרָע രോഗബാധിതനായ വ്യക്തിയെയോ രോഗാവസ്ഥയെയോ സൂചിപ്പിക്കാമെന്ന വ്യാഖ്യാനസാധ്യത നിലനിൽക്കുന്നു; മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ വ്യക്തിസൂചന സ്വീകരിച്ച് മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള കഥനശൈലി. നയമാന്റെ ഉറച്ച പ്രതീക്ഷയും അമർഷവും നിലനിർത്തി; അസ്വാഭാവികമായ ഹീബ്രു പദാനുകരണം ഒഴിവാക്കിയെങ്കിലും പ്രധാന ശൈലീഘടകങ്ങളും യഥാർത്ഥ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
