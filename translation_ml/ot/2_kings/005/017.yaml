source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ נַעֲמָן֒ וָ/לֹ֕א יֻתַּן נָ֣א לְ/עַבְדְּ/ךָ֔ מַשָּׂ֥א צֶֽמֶד פְּרָדִ֖ים אֲדָמָ֑ה כִּ֡י לֽוֹא יַעֲשֶׂה֩ ע֨וֹד עַבְדְּ/ךָ֜ עֹלָ֤ה וָ/זֶ֨בַח֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים כִּ֖י אִם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
translation:
  language: ml
  text: 'അപ്പോൾ നയമാൻ പറഞ്ഞു: “അങ്ങനെയല്ലെങ്കിൽ, ഒരു ജോടി കോവർകഴുതകൾക്കു ചുമക്കാവുന്നത്ര മണ്ണ് അങ്ങയുടെ ദാസനു ദയവായി നൽകണമേ[a]. കാരണം, ഇനി അങ്ങയുടെ ദാസൻ മറ്റു ദേവന്മാർക്കു ഹോമയാഗമോ ബലിയോ അർപ്പിക്കുകയില്ല; യഹോവയ്ക്കു മാത്രമേ അർപ്പിക്കൂ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഒരു ജോടി കോവർകഴുതകളുടെ ചുമട് മണ്ണ്.” അതായത്, രണ്ടു കോവർകഴുതകൾക്കു ചുമക്കാവുന്നത്ര മണ്ണ്.
    reason: lexical_alternative
  - marker: b
    text: നയമാൻ ഇസ്രായേൽദേശത്തെ മണ്ണ് ആവശ്യപ്പെട്ടത്, പുരാതനകാലത്ത് ഒരു ദേവനെ ഒരു പ്രത്യേക ദേശവുമായി ബന്ധപ്പെടുത്തിയിരുന്നതുകൊണ്ടാകാം; അല്ലെങ്കിൽ ഇസ്രായേലിലെ മണ്ണിന്മേൽ യഹോവയെ ആരാധിക്കണമെന്ന ആഗ്രഹം കൊണ്ടാകാം. കൃത്യമായ കാരണം പാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וָלֹא
  choice: അങ്ങനെയെങ്കിൽ
  rationale: മുൻവാക്യത്തിൽ എലീശാ സമ്മാനം നിരസിച്ചതിനോടുള്ള നയമാന്റെ പ്രതികരണമാണ്; അക്ഷരാർഥമായ ‘അല്ലെങ്കിൽ’ എന്നതിനെക്കാൾ ഈ സോപാധിക പ്രയോഗം മലയാളത്തിൽ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനു ദയവായി നൽകണമേ
  rationale: നָא സൂചിപ്പിക്കുന്ന വിനയപൂർവമായ അപേക്ഷയും നയമാൻ സ്വയം ‘അങ്ങയുടെ ദാസൻ’ എന്നു വിളിക്കുന്ന ആദരഭാവവും നിലനിർത്തുന്നു; ഹീബ്രു കർമണിപ്രയോഗം മലയാളത്തിൽ പ്രകൃതിവിരുദ്ധമാകാതെ അഭ്യർഥനാരൂപത്തിൽ നൽകി.
- source_word: מַשָּׂא צֶמֶד פְּרָדִים אֲדָמָה
  choice: ഒരു ജോടി കോവർകഴുതകൾക്കു ചുമക്കാവുന്നത്ര മണ്ണ്
  rationale: മണ്ണിന്റെ അളവ് ഒരു ജോടി കോവർകഴുതകളുടെ ചുമടിനൊത്തതാണെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כִּי לֹא יַעֲשֶׂה עוֹד עַבְדְּךָ
  choice: കാരണം, ഇനി അങ്ങയുടെ ദാസൻ ... അർപ്പിക്കുകയില്ല
  rationale: യാഗസന്ദർഭത്തിൽ עשה എന്നത് ‘ചെയ്യുക’ എന്നതിലുപരി ‘അർപ്പിക്കുക’ എന്ന അർഥം നൽകുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക യാഗപദപ്രയോഗം സ്വീകരിച്ചു.
- source_word: עֹלָה וָזֶבַח
  choice: ഹോമയാഗമോ ബലിയോ
  rationale: עֹלָה എന്ന സമ്പൂർണ ദഹനയാഗത്തിന് നിലവിലുള്ള വ്യക്തമായ മലയാളപദമായ ‘ഹോമയാഗം’ ഉപയോഗിച്ചു; זֶבַח പൊതുവായി ‘ബലി’ എന്നു നൽകി.
- source_word: לֵאלֹהִים אֲחֵרִים כִּי אִם לַיהוָה
  choice: യഹോവയ്ക്കല്ലാതെ മറ്റു ദേവന്മാർക്ക്
  rationale: כִּי אִם സൂചിപ്പിക്കുന്ന ശക്തമായ ഒഴിവാക്കലും യഹോവയോടുള്ള ഏകഭക്തിയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; יהוה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- issue: ഇസ്രായേൽദേശത്തെ മണ്ണ് നയമാൻ ആവശ്യപ്പെടുന്നതിന്റെ കാരണം
  choice: അവന്റെ ഉദ്ദേശ്യം മുഖ്യപാഠത്തിൽ വിശദീകരിക്കാതെ നേരിട്ടുള്ള അഭ്യർഥനയായി നിലനിർത്തി
  alternative: യാഗപീഠത്തിനായുള്ള മണ്ണെന്നോ ഇസ്രായേൽമണ്ണിൽ മാത്രമേ യഹോവയെ ആരാധിക്കാനാകൂ എന്ന വിശ്വാസമെന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: മണ്ണിനുള്ള അപേക്ഷയെ തുടർന്നുള്ള ഏകദൈവാരാധനാ പ്രഖ്യാപനവുമായി പാഠം ബന്ധിപ്പിക്കുന്നുണ്ടെങ്കിലും അതിന്റെ കൃത്യമായ കാരണം പറയുന്നില്ല; അതിനാൽ സാധ്യതകൾ അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നയമാന്റെ വിനയഭാവം ‘അങ്ങയുടെ ദാസൻ’, ‘ദയവായി’, ‘നൽകണമേ’ എന്നിവയിലൂടെ സൂക്ഷിച്ചു; മണ്ണിനുള്ള അപേക്ഷയുടെ അപ്രസ്തുതമാക്കിയിട്ടില്ലാത്ത ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
