  naturalness: “പൊയ്ക്കൊള്ളൂ” is natural modern Malayalam in this context. “കൈയിൽ എടുത്തുകൊണ്ടുപോയി” retains the concrete Hebrew expression while reading more smoothly than a separated “പോയി; ... കൈയിൽ എടുത്തു.” “വസ്ത്രസമുച്ചയങ്ങൾ” clearly conveys complete changes/sets of clothing.
  terminology: “അരാമിലെ രാജാവ്,” “താലന്ത്,” and “സ്വർണക്കഷണങ്ങൾ” are suitable. The note on “സ്വർണക്കഷണങ്ങൾ” properly states that the Hebrew does not name the counted unit. No theological terminology is at issue.
