  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പുരാതന അളവായ ‘താലന്ത്’ നിലനിർത്തുകയും, മൂലപാഠത്തിലെ അസ്പഷ്ടത സ്വർണത്തിന്റെ ഘടകത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
