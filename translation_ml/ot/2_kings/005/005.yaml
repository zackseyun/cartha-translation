base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
translation:
  language: ml
  text: 'അപ്പോൾ അരാമിലെ രാജാവ് പറഞ്ഞു: “പൊയ്ക്കൊള്ളൂ[a]; ഞാൻ ഇസ്രായേൽരാജാവിന് ഒരു കത്ത് അയച്ചുകൊടുക്കാം.” അങ്ങനെ അവൻ പത്ത് താലന്ത് വെള്ളിയും ആറായിരം സ്വർണക്കഷണങ്ങളും[b] മാറി ധരിക്കാനുള്ള പത്ത് വസ്ത്രസമുച്ചയങ്ങളും കൈയിൽ എടുത്തുകൊണ്ടുപോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘പോകുക, വരുക’; യാത്ര പുറപ്പെടാനുള്ള ഉടനടി അനുമതിയോ പ്രോത്സാഹനമോ സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ആറായിരം സ്വർണം’ എന്നു മാത്രമാണ് ഉള്ളത്; എണ്ണപ്പെട്ട പ്രത്യേക ഘടകം വ്യക്തമാക്കിയിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ בֹּא
  choice: പോയിവരൂ
  rationale: എബ്രായത്തിലെ ‘പോകുക, വരുക’ എന്ന രണ്ടു ആജ്ഞാരൂപങ്ങളും മലയാളത്തിലെ സ്വാഭാവികമായ സംയുക്തപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; യാത്രയ്ക്കുള്ള അനുമതിയും പ്രോത്സാഹനവും ഇതിൽ വ്യക്തമാകുന്നു.
- source_word: סֵפֶר
  choice: ഒരു കത്ത്
  rationale: ഒരു രാജാവിൽനിന്ന് മറ്റൊരു രാജാവിലേക്കുള്ള നയതന്ത്രപരമായ എഴുത്തുസന്ദേശമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: בְּיָדוֹ
  choice: കൈയിൽ എടുത്തു
  rationale: ‘അവന്റെ കൈയിൽ’ എന്ന മൂലപാഠത്തിലെ ദൃശ്യപ്രയോഗം സംരക്ഷിക്കുമ്പോൾ, സാധനങ്ങൾ കൂടെ കൊണ്ടുപോയെന്ന അർഥവും സ്വാഭാവികമായി ലഭിക്കുന്നു.
- source_word: כִּכְּרֵי כֶסֶף
  choice: താലന്തു വെള്ളി
  rationale: പുരാതന ഭാരയളവായ ‘താലന്ത്’ അനുമാനപരമായ ആധുനിക പരിവർത്തനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: שֵׁשֶׁת אֲלָפִים זָהָב
  choice: ആറായിരം സ്വർണക്കഷണങ്ങൾ
  rationale: എബ്രായത്തിൽ എണ്ണപ്പെടുന്ന ഘടകത്തിന്റെ പേര് വ്യക്തമാക്കിയിട്ടില്ല; വായനാസൗകര്യത്തിനായി ‘കഷണങ്ങൾ’ ചേർക്കുന്നു, എന്നാൽ ‘ശേക്കെൽ’ പോലൊരു നിർദ്ദിഷ്ട അളവ് അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: മാറിയുടുക്കാനുള്ള പത്തു കൂട്ടം വസ്ത്രങ്ങൾ
  rationale: മാറ്റി ധരിക്കാവുന്ന സമ്പൂർണ വസ്ത്രസമുച്ചയങ്ങളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായ ഭാഷ ഉപയോഗിക്കുന്നു.
- source_word: מֶלֶךְ אֲרָם
  choice: അരാംരാജാവ്
  rationale: പിന്നീടുള്ള ഭൂമിശാസ്ത്രനാമമായ ‘സിറിയ’ എന്നതിനു പകരം മൂലപാഠത്തിലെ അരാം എന്ന പേരുതന്നെ നിലനിർത്തുന്നു.
