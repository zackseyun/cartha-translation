    issue: “പോയിവരൂ” for לֶךְ בֹּא
    rationale: In ordinary modern Malayalam, this means ‘go and come back,’ which supplies a return action not expressed by the Hebrew. The paired Hebrew imperatives are idiomatic and likely communicate authorization or encouragement to depart.
