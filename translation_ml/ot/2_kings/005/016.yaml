source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר חַי יְהוָ֛ה אֲשֶׁר עָמַ֥דְתִּי לְ/פָנָ֖י/ו אִם אֶקָּ֑ח וַ/יִּפְצַר בּ֥/וֹ לָ/קַ֖חַת וַ/יְמָאֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/016.yaml
  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു[a]: “ഞാൻ ആരുടെ സന്നിധിയിൽ നിൽക്കുന്നുവോ ആ യഹോവ ജീവിച്ചിരിക്കുന്നതുപോലെ, ഞാൻ അത് സ്വീകരിക്കുകയില്ല.” അത് സ്വീകരിക്കണമെന്ന് അവൻ അവനെ ശക്തമായി നിർബന്ധിച്ചു; പക്ഷേ അവൻ വിസമ്മതിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇത് ഒരു ഹീബ്രായ ശപഥസൂത്രമാണ്. അക്ഷരാർഥത്തിൽ: “യഹോവ ജീവിച്ചിരിക്കുന്നതുപോലെ ... ഞാൻ സ്വീകരിച്ചാൽ.” ശപഥസന്ദർഭത്തിൽ “എങ്കിൽ” എന്നത് ശക്തമായ നിഷേധം സൂചിപ്പിക്കുന്നു: “ഞാൻ തീർച്ചയായും സ്വീകരിക്കുകയില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: യഹോവ ജീവിക്കുന്നതാണേ
  rationale: ഹീബ്രായ ശപഥസൂത്രത്തിന്റെ ഗൗരവവും ജീവിക്കുന്ന ദൈവത്തെ സാക്ഷിയാക്കുന്ന ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: ഞാൻ സന്നിധിയിൽ നിൽക്കുന്ന
  rationale: ദൈവസന്നിധിയിൽ നിൽക്കുക എന്ന പ്രവാചക-രാജസഭാ പ്രയോഗം സംരക്ഷിക്കുന്നു; ‘ഞാൻ സേവിക്കുന്ന’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: אִם אֶקָּח
  choice: ഞാൻ അത് സ്വീകരിക്കുകയില്ല
  rationale: ശപഥവാക്യത്തിൽ אִם ശക്തമായ നിഷേധം സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ സമ്മാനം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അത്’ എന്നു വ്യക്തമാക്കുന്നു; לקח ഇവിടെ സ്വീകരിക്കൽ എന്ന അർഥത്തിലാണ്.
- source_word: וַיִּפְצַר בּוֹ
  choice: അവൻ അവനെ വളരെ നിർബന്ധിച്ചു
  rationale: פצר എന്ന ക്രിയയിലെ ശക്തമായ സമ്മർദത്തിന്റെയും ആവർത്തിച്ച അഭ്യർഥനയുടെയും ഭാവം ‘വളരെ നിർബന്ധിച്ചു’ വ്യക്തമാക്കുന്നു.
- source_word: לָקַחַת
  choice: അത് സ്വീകരിക്കണമെന്ന്
  rationale: സന്ദർഭത്തിൽ സമ്മാനം കൈക്കൊള്ളുന്നതാണ് ഉദ്ദേശ്യം; ‘സ്വീകരിക്കുക’ ആ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיְמָאֵן
  choice: അവൻ നിരസിച്ചു
  rationale: מאן സൂചിപ്പിക്കുന്ന വ്യക്തമായ വിസമ്മതം നേരായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ അത് പേരായിത്തന്നെ നിലനിർത്തുന്നു.
- issue: ദൈവസന്നിധിയിൽ ‘നിൽക്കുക’ എന്ന പ്രയോഗം
  choice: ഞാൻ സന്നിധിയിൽ നിൽക്കുന്ന
  alternative: ഞാൻ സേവിക്കുന്ന
  rationale: സേവനം എന്ന ആശയം ഉൾക്കൊള്ളാമെങ്കിലും, മൂലത്തിലെ സന്നിധി-പ്രയോഗവും അതിലെ പ്രവാചകപരമായ തീവ്രതയും വിവർത്തനത്തിൽ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ മലയാളം. ശപഥത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ‘ജീവിക്കുന്നതാണേ’ ഉപയോഗിച്ചു; പ്രവാചകസേവനത്തിന്റെ രൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ ‘സന്നിധിയിൽ നിൽക്കുന്ന’ എന്നു സൂക്ഷിച്ചു.
