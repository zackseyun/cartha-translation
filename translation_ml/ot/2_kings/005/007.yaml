base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
translation:
  language: ml
  text: 'ഇസ്രായേൽരാജാവ് ആ കത്ത് വായിച്ചപ്പോൾ തന്റെ വസ്ത്രങ്ങൾ കീറി പറഞ്ഞു: “കൊല്ലാനും ജീവിപ്പിക്കാനും ഞാൻ ദൈവമാണോ? ഒരു മനുഷ്യനെ അവന്റെ കുഷ്ഠരോഗത്തിൽനിന്ന് സൗഖ്യമാക്കാൻ ഈ മനുഷ്യൻ അവനെ എന്റെ അടുക്കലേക്ക് അയയ്ക്കുന്നു![a] ദയവായി ശ്രദ്ധിച്ചു നോക്കുവിൻ; അവൻ എനിക്കെതിരെ കലഹത്തിനുള്ള അവസരം തേടുകയാണെന്ന് കാണാം.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ צָרַעַת എന്ന പദം ഇന്നത്തെ ഹാൻസൻസ് രോഗത്തെ മാത്രം സൂചിപ്പിക്കണമെന്നില്ല; ഗുരുതരമായ പലതരം ചർമരോഗങ്ങളെയും അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അവൻ എനിക്കെതിരെ ഒരു കാരണം അന്വേഷിക്കുകയാണ്” / “എനിക്കെതിരെ ഒരു ന്യായം കണ്ടെത്താൻ നോക്കുകയാണ്.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: ആ കത്ത്
  rationale: മുൻസന്ദർഭത്തിൽ അരാംരാജാവ് അയച്ച എഴുത്തായതിനാൽ, പൊതുവായ ‘രേഖ’ എന്നതിനെക്കാൾ ‘കത്ത്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: വസ്ത്രം കീറിക്കൊണ്ട്
  rationale: കടുത്ത വ്യാകുലതയും ഭീതിയും പ്രകടിപ്പിക്കുന്ന പതിവു പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַאֱלֹהִים אָנִי
  choice: ഞാൻ ദൈവമാണോ?
  rationale: കൊല്ലുകയും ജീവിപ്പിക്കുകയും ചെയ്യുന്നത് ദൈവത്തിന്റെ അധികാരമാണെന്ന വാക്യത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: לְהָמִית וּלְהַחֲיוֹת
  choice: കൊല്ലാനും ജീവിപ്പിക്കാനും
  rationale: എബ്രായത്തിലെ സമാന്തര ക്രിയാജോടിയുടെ സംക്ഷിപ്തതയും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ
  choice: ഈ മനുഷ്യൻ തന്റെ കുഷ്ഠരോഗത്തിൽനിന്ന് സൗഖ്യം പ്രാപിക്കേണ്ടതിന്
  rationale: אָסַף מן എന്ന പ്രയോഗം രോഗാവസ്ഥ നീങ്ങുക അഥവാ അതിൽനിന്നു വീണ്ടെടുക്കപ്പെടുക എന്ന സന്ദർഭാർഥത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: צָּרַעַת
  choice: കുഷ്ഠരോഗം
  rationale: പരമ്പരാഗതവും വായനക്കാർക്കു പരിചിതവുമായ പദം നിലനിർത്തുന്നു; എബ്രായപദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: דְּעוּ נָא וּרְאוּ
  choice: ദയവായി ശ്രദ്ധിച്ചുകാണുവിൻ
  rationale: ‘അറിയുക, കാണുക’ എന്ന ഇരട്ട ആഹ്വാനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ശ്രദ്ധാക്ഷണമായി നൽകുന്നു.
- source_word: מִתְאַנֶּה הוּא לִי
  choice: അവൻ എന്നോടു കലഹിക്കാൻ അവസരം അന്വേഷിക്കുകയാണ്
  rationale: ഹിത്പയേൽ രൂപം സൂചിപ്പിക്കുന്ന പ്രകോപനാവസരം അഥവാ വിരോധത്തിനുള്ള ന്യായം തേടുന്ന ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: הָאֱלֹהִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഞാൻ ദൈവമാണോ?
  alternative: ഞാൻ ഒരു ദേവനാണോ?
  rationale: ജീവനും മരണവും സംബന്ധിച്ച അതുല്യമായ ദൈവിക അധികാരത്തോടാണ് രാജാവ് തന്റെ അശക്തിയെ താരതമ്യം ചെയ്യുന്നത്; അതിനാൽ ഏകദൈവസൂചനയുള്ള രൂപം സന്ദർഭത്തിന് യോജിക്കുന്നു.
- issue: צָּרַעַת എന്ന രോഗനാമത്തിന്റെ വിവർത്തനം
  choice: കുഷ്ഠരോഗം
  alternative: ഗുരുതരമായ ചർമരോഗം
  rationale: കഥയിലെ പരമ്പരാഗത പദം മുഖ്യവാചകത്തിൽ നിലനിർത്തിയെങ്കിലും ആധുനിക ഹാൻസൻസ് രോഗം മാത്രമെന്ന വൈദ്യശാസ്ത്രപരമായ കൃത്യത അവകാശപ്പെടാതിരിക്കാൻ വിശാല അർഥം അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
