revisions:
- from: 'ഇസ്രായേൽരാജാവ് ആ കത്ത് വായിച്ചപ്പോൾ വസ്ത്രം കീറിക്കൊണ്ട് പറഞ്ഞു: “കൊല്ലാനും ജീവിപ്പിക്കാനും ഞാൻ ദൈവമാണോ? ഇതാ, ഈ മനുഷ്യൻ തന്റെ കുഷ്ഠരോഗത്തിൽനിന്ന് സൗഖ്യം പ്രാപിക്കേണ്ടതിന് അവനെ എന്റെ അടുക്കൽ അയയ്ക്കുന്നു! അവൻ എന്നോടു കലഹിക്കാൻ അവസരം അന്വേഷിക്കുകയാണെന്ന് ദയവായി ശ്രദ്ധിച്ചുകാണുവിൻ.”[a][b]'
  to: 'ഇസ്രായേൽരാജാവ് ആ കത്ത് വായിച്ചപ്പോൾ തന്റെ വസ്ത്രങ്ങൾ കീറി പറഞ്ഞു: “കൊല്ലാനും ജീവിപ്പിക്കാനും ഞാൻ ദൈവമാണോ? ഒരു മനുഷ്യനെ അവന്റെ കുഷ്ഠരോഗത്തിൽനിന്ന് സൗഖ്യമാക്കാൻ ഈ മനുഷ്യൻ അവനെ എന്റെ അടുക്കലേക്ക് അയയ്ക്കുന്നു![a] ദയവായി ശ്രദ്ധിച്ചു നോക്കുവിൻ; അവൻ എനിക്കെതിരെ കലഹത്തിനുള്ള അവസരം തേടുകയാണെന്ന് കാണാം.”[b]'
