  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. രാജാവിന്റെ പരിഭ്രമം ചോദ്യത്തിലും ആശ്ചര്യവാക്യത്തിലും പ്രകടമാക്കുന്നു. അടിക്കുറിപ്പുകളുടെ [a], [b] ചിഹ്നങ്ങൾ പ്രധാനവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
