  text: וַ/יָּבֵ֣א הַ/סֵּ֔פֶר אֶל מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר וְ/עַתָּ֗ה כְּ/ב֨וֹא הַ/סֵּ֤פֶר הַ/זֶּה֙ אֵלֶ֔י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ אֶת נַעֲמָ֣ן עַבְדִּ֔/י וַ/אֲסַפְתּ֖/וֹ מִ/צָּרַעְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
translation:
  language: ml
  text: 'അവൻ ആ കത്ത് ഇസ്രായേൽരാജാവിന്റെ അടുക്കൽ കൊണ്ടുചെന്നു. അതിൽ ഇപ്രകാരം എഴുതിയിരുന്നു: “ഇപ്പോൾ, ഈ കത്ത് അങ്ങേക്കു ലഭിക്കുമ്പോൾ, ഇതാ, എന്റെ ദാസനായ നയമാനെ ഞാൻ അങ്ങയുടെ അടുക്കൽ അയച്ചിരിക്കുന്നു; അവനെ അവന്റെ ചർമരോഗം[a] നീക്കി സൗഖ്യമാക്കേണ്ടതിനായി[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി “കുഷ്ഠരോഗം.” എന്നാൽ എബ്രായത്തിലെ צָרַעַת എന്ന പദം ആധുനിക ഹാൻസൻസ് രോഗത്തിൽ മാത്രം ഒതുങ്ങാത്ത വിവിധ ചർമബാധകളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “അവന്റെ ചർമരോഗത്തിൽനിന്ന് അവനെ കൂട്ടിച്ചേർക്കുക” എന്ന അപൂർവ പ്രയോഗമാണ്; സന്ദർഭത്തിലെ അർഥം രോഗം നീക്കി അവനെ സൗഖ്യമാക്കുക എന്നതാണ്.
    reason: source_idiom
lexical_decisions:
- source_word: וַיָּבֵא
  choice: കൊണ്ടുചെന്നു
  rationale: ഹിഫീൽ രൂപത്തിൽ ‘കത്ത്’ കർമമായതിനാൽ, കാരണാർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הַסֵּפֶר
  choice: കത്ത്
  rationale: രാജാക്കന്മാർ തമ്മിലുള്ള ഈ ഔദ്യോഗിക എഴുത്തുസന്ദേശത്തിന് ആധുനിക മലയാളത്തിൽ ഏറ്റവും യോജിച്ച പദം.
- source_word: לֵאמֹר
  choice: അതിൽ ഇങ്ങനെ എഴുതിയിരുന്നു
  rationale: ഉദ്ധരണി കത്തിലെ ഉള്ളടക്കമാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ഉദ്ധരണി-ആമുഖത്തിന്റെ പ്രവർത്തനം സംരക്ഷിക്കുന്നു.
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: രാജകീയ കത്തിലെ സംവാദസൂചകം ലളിതവും ഔപചാരികവുമായി നൽകുന്നു.
- source_word: כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ
  choice: ഈ കത്ത് അങ്ങേക്കു ലഭിക്കുമ്പോൾ
  rationale: כְּ + infinitive construct സൂചിപ്പിക്കുന്ന കാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ നിപാതത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു.
- source_word: שָׁלַחְתִּי
  choice: ഞാൻ ... അയച്ചിരിക്കുന്നു
  rationale: കത്ത് ലഭിക്കുന്ന സമയത്ത് അയച്ചതിന്റെ ഫലം നിലനിൽക്കുന്നതു സൂചിപ്പിക്കുന്ന പൂർണകാലഭാവം നൽകുന്നു.
- source_word: נַעֲמָן
  choice: നയമാൻ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ പേരിന്റെ ലിപ്യന്തരണം.
- source_word: עַבְדִּי
  choice: എന്റെ ദാസൻ
  rationale: രാജസദസ്സിലെ കീഴുദ്യോഗസ്ഥനെയും സേവകനെയും സൂചിപ്പിക്കാവുന്ന עבד എന്ന പദത്തിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וַאֲסַפְתּוֹ
  choice: സൗഖ്യമാക്കേണ്ടതിനാണ്
  rationale: אסף എന്ന ക്രിയയുടെ സാധാരണ അർഥം ‘കൂട്ടിച്ചേർക്കുക/ശേഖരിക്കുക’ എന്നാണെങ്കിലും, מן + രോഗം എന്ന ഈ അപൂർവ പ്രയോഗം സന്ദർഭത്തിൽ രോഗം നീക്കി സൗഖ്യമാക്കുക എന്ന ഫലമാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യവാക്യം സ്വാഭാവികമാക്കി, അസാധാരണമായ മൂലപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: מִצָּרַעְתּוֹ
  choice: അവന്റെ ചർമരോഗം
  rationale: צָרַעַת ആധുനിക ഹാൻസൻസ് രോഗത്തേക്കാൾ വിശാലമായ രോഗവിഭാഗം സൂചിപ്പിക്കുന്നതിനാൽ തെറ്റായ വൈദ്യശാസ്ത്രപരമായ കൃത്യത ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: צָרַעַת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ചർമരോഗം
  alternative: കുഷ്ഠരോഗം
  rationale: എബ്രായപദം ആധുനികമായി നിർവചിക്കുന്ന കുഷ്ഠരോഗത്തിൽ മാത്രം ഒതുങ്ങുന്നില്ല. അതിനാൽ മുഖ്യവാക്യത്തിൽ വിശാലമായ പദം ഉപയോഗിച്ച് പരമ്പരാഗത വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ എന്ന അപൂർവ പ്രയോഗം
  choice: അവന്റെ ചർമരോഗം സൗഖ്യമാക്കേണ്ടതിനാണ്
  alternative: അവന്റെ ചർമരോഗത്തിൽനിന്ന് അവനെ കൂട്ടിച്ചേർക്കേണ്ടതിനാണ്
  rationale: പദാനുപദരൂപം മലയാളത്തിൽ അർഥശൂന്യമോ തെറ്റിദ്ധരിപ്പിക്കുന്നതോ ആയേക്കും. സന്ദർഭാർഥം മുഖ്യവാക്യത്തിൽ നൽകുകയും മൂലത്തിലെ അസാധാരണ ദൃശ്യഭാഷ അടിക്കുറിപ്പിൽ വെളിപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ ഔദ്യോഗിക ശൈലി. രാജാവിനോടുള്ള അഭിസംബോധനയിൽ “അങ്ങ്” ഉപയോഗിച്ചു. എബ്രായവാക്യഘടന മലയാളത്തിൽ അനാവശ്യമായി കൃത്രിമമാകാതെ, അതിലെ ശ്രദ്ധാസൂചകമായ “ഇതാ”യും കത്തിലെ ഔപചാരിക ഭാവവും നിലനിർത്തി.
