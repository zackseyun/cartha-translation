id: 2KI.5.13
reference: 2 Kings 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֣וּ עֲבָדָי/ו֮ וַ/יְדַבְּר֣וּ אֵלָי/ו֒ וַ/יֹּאמְר֗וּ אָבִי֙ דָּבָ֣ר גָּד֗וֹל הַ/נָּבִ֛יא דִּבֶּ֥ר אֵלֶ֖י/ךָ הֲ/ל֣וֹא תַעֲשֶׂ֑ה וְ/אַ֛ף כִּֽי אָמַ֥ר אֵלֶ֖י/ךָ רְחַ֥ץ וּ/טְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ ദാസന്മാർ അടുത്തുവന്ന് അവനോടു പറഞ്ഞു: “എന്റെ പിതാവേ, പ്രവാചകൻ അങ്ങയോടു വലിയൊരു കാര്യം പറഞ്ഞിരുന്നെങ്കിൽ, അങ്ങ് അതു ചെയ്യുമായിരുന്നില്ലേ? എങ്കിൽ, ‘കഴുകി ശുദ്ധനാകുക[a]’ എന്ന് അങ്ങയോടു പറയുമ്പോൾ എത്രയധികം അതു ചെയ്യേണ്ടതാണ്!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുദ്ധീകരിക്കപ്പെടുക.” എബ്രായപദത്തിന് ‘ശുദ്ധനാകുക’ എന്നോ ‘ശുദ്ധീകരിക്കപ്പെടുക’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: അടുത്തുവന്നു
  rationale: נגשׁ എന്ന ക്രിയയുടെ സമീപിക്കുക, അടുത്തുവരുക എന്ന അർഥം സ്വാഭാവികമായ ആഖ്യാനഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: עֲבָדָיו
  choice: അവന്റെ ദാസന്മാർ
  rationale: עבד എന്നതിന് ദാസൻ, സേവകൻ, അടിമ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ നയമാന്റെ കീഴിലുള്ളവർ ആദരവോടെ സംസാരിക്കുന്നതിനാൽ ‘ദാസന്മാർ’ ബന്ധത്തിലെ കീഴ്വഴക്കം വ്യക്തമാക്കുന്നു; നിയമപരമായ അടിമസ്ഥിതി അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: אָבִי
  choice: എന്റെ പിതാവേ
  rationale: ഇത് യഥാർഥ പിതൃത്വമല്ല, കീഴിലുള്ളവർ മേലധികാരിയെ ആദരവോടെയും അടുപ്പത്തോടെയും വിളിക്കുന്ന രൂപകപ്രയോഗമാണ്. എബ്രായത്തിലെ ഏകവചനരൂപം മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: דָּבָר גָּדוֹל
  choice: വലിയൊരു കാര്യം
  rationale: പ്രയാസകരമോ ശ്രദ്ധേയമോ ആയ ഒരു നിർദേശം എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അതിന്റെ കൃത്യമായ സ്വഭാവം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: הֲלוֹא תַעֲשֶׂה
  choice: അങ്ങ് അതു ചെയ്യുമായിരുന്നില്ലേ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: וְאַף כִּי
  choice: അപ്പോൾപ്പിന്നെ ... ചെയ്യേണ്ടതല്ലേ?
  rationale: വലിയതിൽനിന്ന് ചെറിയതിലേക്കുള്ള ‘എത്രയധികം’ എന്ന വാദഗതി മലയാളത്തിലെ സ്വാഭാവിക അലങ്കാരചോദ്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: רְחַץ
  choice: കുളിച്ച്
  rationale: നയമാനോടു നൽകിയ ലളിതമായ കഴുകൽ/കുളിക്കൽ കല്പനയെ സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: וּטְהָר
  choice: ശുദ്ധനാകുക
  rationale: טהר സൂചിപ്പിക്കുന്ന ശാരീരിക സൗഖ്യത്തിന്റെയും ശുദ്ധിയുടെയും ഇരട്ട അനുരണനം നിലനിർത്തുന്നു; ആചാരപരമോ പിൽക്കാല ദൈവശാസ്ത്രപരമോ ആയ അർഥം മാത്രം അടിച്ചേൽപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: നയമാന്റെ സൗഖ്യത്തിൽ טהר എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ശുദ്ധനാകുക
  alternative: ശുദ്ധീകരിക്കപ്പെടുക
  rationale: ഈ സന്ദർഭത്തിൽ ത്വഗ്രോഗത്തിൽനിന്നുള്ള സൗഖ്യവും ശുദ്ധിയും ഒരുമിച്ച് അനുരണിക്കുന്നു. ‘ശുദ്ധനാകുക’ ഫലാവസ്ഥയെ ചുരുക്കമായി നൽകുന്നു; കർമ്മണിപ്രയോഗമായ ‘ശുദ്ധീകരിക്കപ്പെടുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നയമാനോടുള്ള ആദരം സൂചിപ്പിക്കാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ‘എന്റെ പിതാവേ’ എന്ന അഭിസംബോധനയുടെ അസാധാരണത എബ്രായത്തിലെ രൂപകവും ഏകവചനവും സംരക്ഷിക്കാനായി നിലനിർത്തി.
