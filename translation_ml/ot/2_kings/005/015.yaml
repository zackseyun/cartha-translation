  text: וַ/יָּשָׁב֩ אֶל אִ֨ישׁ הָ/אֱלֹהִ֜ים ה֣וּא וְ/כָֽל מַחֲנֵ֗/הוּ וַ/יָּבֹא֮ וַ/יַּעֲמֹ֣ד לְ/פָנָי/ו֒ וַ/יֹּ֗אמֶר הִנֵּה נָ֤א יָדַ֨עְתִּי֙ כִּ֣י אֵ֤ין אֱלֹהִים֙ בְּ/כָל הָ/אָ֔רֶץ כִּ֖י אִם בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּ֛ה קַח נָ֥א בְרָכָ֖ה מֵ/אֵ֥ת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
translation:
  language: ml
  text: 'പിന്നെ അവനും അവന്റെ മുഴുവൻ സംഘവും ദൈവപുരുഷന്റെ അടുക്കൽ മടങ്ങിവന്നു. അവൻ വന്ന് അദ്ദേഹത്തിന്റെ മുമ്പിൽ നിന്നുകൊണ്ട് പറഞ്ഞു: “ഇതാ, ഇസ്രായേലിലല്ലാതെ ഭൂമിയിലെങ്ങും ദൈവമില്ലെന്ന് ഇപ്പോൾ ഞാൻ അറിയുന്നു. അതുകൊണ്ട് അങ്ങയുടെ ദാസനിൽനിന്ന് ഒരു സമ്മാനം[a] ദയവായി സ്വീകരിക്കണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ ‘ഒരു അനുഗ്രഹം.’ ഇവിടെ എബ്രായപദം ഒരു സമ്മാനത്തെയോ ഉപഹാരത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെയോ ദൈവിക സന്ദേശവാഹകനെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ശീർഷകത്തിന്റെ സാഹിത്യപരമായ രൂപം നിലനിർത്തുന്നു; ‘ദൈവത്തിന്റെ പ്രവാചകൻ’ എന്ന വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: מַחֲנֵהוּ
  choice: അവന്റെ മുഴുവൻ സംഘം
  rationale: പദശഃ ‘അവന്റെ പാളയം’ എന്നാണെങ്കിലും ഇവിടെ നയമാനോടൊപ്പമുള്ള പരിവാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സംഘം’ ആ കൂട്ടായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: അദ്ദേഹത്തിന്റെ മുമ്പിൽ നിന്നുകൊണ്ട്
  rationale: ഒരാളുടെ സന്നിധിയിൽ വന്നു നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം നേരിട്ടും വായനാസൗകര്യത്തോടെയും നിലനിർത്തുന്നു.
- source_word: הִנֵּה נָא
  choice: ഇതാ ... ഇപ്പോൾ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: יָדַעְתִּי
  choice: ഞാൻ അറിയുന്നു
  rationale: അനുഭവത്തിലൂടെ ലഭിച്ച തിരിച്ചറിവിൽനിന്നുണ്ടായ ഇപ്പോഴത്തെ ഉറച്ച അറിവിനെയാണ് ക്രിയാരൂപം ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: אֵין אֱלֹהִים בְּכָל הָאָרֶץ כִּי אִם בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിലല്ലാതെ ഭൂമിയിലെങ്ങും ദൈവമില്ല
  rationale: ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ അതുല്യതയെക്കുറിച്ചുള്ള ശക്തമായ പ്രഖ്യാപനം മയപ്പെടുത്താതെയും ‘ഇസ്രായേലിന്റെ ദൈവം’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത വാക്കുകൾ ചേർക്കാതെയും നിലനിർത്തുന്നു.
- source_word: בְרָכָה
  choice: സമ്മാനം
  rationale: പദശഃ ‘അനുഗ്രഹം’ എന്നാണെങ്കിലും സമ്മാനം നൽകുന്ന ഈ സന്ദർഭത്തിൽ വാക്ക് ഒരു ഉപഹാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പദശഃ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ഇവിടെ അടിമസ്ഥിതിയേക്കാൾ ആദരപൂർവമായ സ്വയംവിശേഷണമാണ് മുൻനിൽക്കുന്നത്; ‘ദാസൻ’ ആ സാമൂഹിക ഭാവം നിലനിർത്തുന്നു.
- source_word: קַח נָא
  choice: ദയവായി സ്വീകരിക്കണമേ
  rationale: പദശഃ ‘ദയവായി എടുക്കുക’ എന്ന കല്പനയുടെ സന്ദർഭോചിതമായ അർഥം സമ്മാനം സ്വീകരിക്കാനുള്ള വിനീത അഭ്യർഥനയാണ്.
theological_decisions:
- issue: ഇസ്രായേലിലല്ലാതെ ദൈവമില്ലെന്ന നയമാന്റെ പ്രഖ്യാപനം
  choice: ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ അതുല്യതയെക്കുറിച്ചുള്ള നേരിട്ടുള്ള പ്രഖ്യാപനമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഇസ്രായേലിന്റെ ദൈവമല്ലാതെ മറ്റൊരു ദൈവവുമില്ല’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുക.
  rationale: എബ്രായപാഠം ‘ഇസ്രായേലിൽ’ എന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു. അതിന്റെ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഭാഷയിൽ സംരക്ഷിക്കുകയും മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം ഒഴിവാക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങയുടെ’ എന്നും അഭ്യർഥനയിൽ ‘സ്വീകരിക്കണമേ’ എന്നും ഉപയോഗിച്ചു; അനാവശ്യമായ പുരാതനഭാഷ ഒഴിവാക്കി.
