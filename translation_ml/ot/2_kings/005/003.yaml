  text: וַ/תֹּ֨אמֶר֙ אֶל גְּבִרְתָּ֔/הּ אַחֲלֵ֣י אֲדֹנִ֔/י לִ/פְנֵ֥י הַ/נָּבִ֖יא אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן אָ֛ז יֶאֱסֹ֥ף אֹת֖/וֹ מִ/צָּרַעְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/003.yaml
  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
translation:
  language: ml
  text: 'അവൾ തന്റെ യജമാനത്തിയോടു പറഞ്ഞു: “എന്റെ യജമാനൻ സമര്യയിലുള്ള പ്രവാചകന്റെ അടുക്കൽ പോയിരുന്നെങ്കിൽ! അപ്പോൾ ആ പ്രവാചകൻ അദ്ദേഹത്തെ കുഷ്ഠരോഗത്തിൽനിന്ന്[b] സുഖപ്പെടുത്തുമായിരുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘കൂട്ടിച്ചേർക്കുക’ അഥവാ ‘അകത്തേക്കു ചേർക്കുക’ എന്നാണ്; ഇവിടെ രോഗം നീക്കി സുഖപ്പെടുത്തുക എന്ന അർഥത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘കുഷ്ഠരോഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായ പദം צָרַעַת (ത്സാരാഅത്ത്) ആണ്. ഇത് ആധുനികമായി ഹാൻസെൻസ് രോഗം എന്നു തിരിച്ചറിയുന്ന രോഗം മാത്രമല്ല, വിവിധ ത്വക്രോഗങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  choice: തന്റെ യജമാനത്തിയോട്
  rationale: വീട്ടിലെ സ്ത്രീയായ മേലധികാരിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; സാമൂഹികബന്ധം വ്യക്തമായി നിലനിർത്താൻ ‘യജമാനത്തി’ ഉപയോഗിച്ചു.
- source_word: אַחֲלֵי
  choice: ഒന്ന് എത്തിയിരുന്നെങ്കിൽ!
  rationale: ആഗ്രഹവും വാഞ്ഛയും പ്രകടിപ്പിക്കുന്ന ആശംസാർഥക ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: പെൺകുട്ടി നയമാനെ ആദരപൂർവം പരാമർശിക്കുന്നു; ഉടമ/മേലധികാരി എന്ന ബന്ധവും ബഹുമാനവും ഈ പദം സൂക്ഷിക്കുന്നു.
- source_word: לִפְנֵי
  choice: സന്നിധിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖത്തിനു മുമ്പിൽ’ എന്ന എബ്രായ പ്രയോഗം ഒരാളുടെ സാന്നിധ്യത്തിൽ എത്തുക എന്ന അർഥത്തിലാണ്.
- source_word: הַנָּבִיא
  choice: പ്രവാചകൻ
  rationale: മൂലപാഠം എലീശയുടെ പേര് പറയാതെ പദവി തന്നെയാണ് ഉപയോഗിക്കുന്നത്.
- source_word: בְּשֹׁמְרוֹן
  choice: സമര്യയിലുള്ള
  rationale: സ്ഥലനാമവും അവിടെ പ്രവാചകൻ ഉണ്ടെന്ന ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אָז
  choice: അപ്പോൾ
  rationale: ആഗ്രഹിച്ച സാഹചര്യം ഉണ്ടായാൽ സംഭവിക്കാവുന്ന ഫലത്തെ അടയാളപ്പെടുത്തുന്നു.
- source_word: יֶאֱסֹף
  choice: സുഖപ്പെടുത്തുമായിരുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കൂട്ടിച്ചേർക്കുക/അകത്താക്കുക’ എന്നാണെങ്കിലും രോഗസന്ദർഭത്തിൽ രോഗം നീക്കി സുഖപ്പെടുത്തുക എന്ന പ്രയോഗാർഥമാണ് ഉദ്ദേശിക്കുന്നത്; അക്ഷരചിത്രം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: מִצָּרַעְתּוֹ
  choice: കുഷ്ഠരോഗത്തിൽനിന്ന്
  rationale: צָרַעַת എന്ന പരമ്പരാഗത ബൈബിൾ പദത്തിന് പരിചിതമായ മലയാളരൂപം ഉപയോഗിച്ചു; അത് ആധുനിക ഹാൻസൻസ് രോഗത്തേക്കാൾ വിശാലമായ ചർമ്മരോഗവിഭാഗത്തെ സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
