  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിന്റെ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ അതിലെ റിപ്പോർട്ടിംഗ് ഘടനയും സംഗ്രഹപ്രയോഗവും സംരക്ഷിച്ചു.
