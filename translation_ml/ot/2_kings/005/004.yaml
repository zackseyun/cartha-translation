  yaml_path: translation/ot/2_kings/005/004.yaml
  text: So he went in and told his master[a], saying, “Thus and thus spoke the girl who is from the land of Israel.”
translation:
  language: ml
  text: 'അവൻ അകത്തു ചെന്ന് തന്റെ യജമാനനോട് ഇങ്ങനെ അറിയിച്ചു: “ഇസ്രായേൽദേശത്തുനിന്നുള്ള പെൺകുട്ടി ഇങ്ങനെയിങ്ങനെ[a] പറഞ്ഞു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇങ്ങനെയിങ്ങനെ’ എന്നത് അവൾ പറഞ്ഞത് വാക്കുതോറും ആവർത്തിക്കാതെ സംഗ്രഹിക്കുന്ന ഒരു ഹീബ്രു പ്രയോഗമാണ്; ‘ഇതും അതും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അവൻ അകത്തു ചെന്ന്
  rationale: בוא എന്ന ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘വരുക,’ ‘പോകുക,’ ‘പ്രവേശിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം. യജമാനന്റെ സന്നിധിയിൽ റിപ്പോർട്ട് ചെയ്യാൻ പ്രവേശിക്കുന്നതായി ഈ പ്രയോഗം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּגֵּד
  choice: അറിയിച്ചു
  rationale: Hiphil രൂപത്തിലുള്ള נגד എന്നത് അറിയിക്കുക, പറയുക, റിപ്പോർട്ട് ചെയ്യുക എന്നർഥം നൽകുന്നു. ഇവിടെ ഒരു വിവരം മേലധികാരിയെ അറിയിക്കുന്ന ഭാവം ‘അറിയിച്ചു’ വ്യക്തമാക്കുന്നു.
- source_word: לַאדֹנָיו
  choice: തന്റെ യജമാനനോട്
  rationale: אָדוֹן എന്നതിന് കർത്താവ്, യജമാനൻ, ഉടമ എന്നീ അർഥങ്ങൾ വരാം. അധികാരബന്ധമുള്ള ഈ സന്ദർഭത്തിൽ ‘യജമാനൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന ഹീബ്രു സൂത്രപ്രയോഗമാണിത്. മലയാളത്തിൽ ഉദ്ധരണിക്കു മുമ്പുള്ള ‘ഇങ്ങനെ അറിയിച്ചു’ അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: כָּזֹאת וְכָזֹאת
  choice: ഇന്നിന്ന കാര്യങ്ങളാണ്
  rationale: പറഞ്ഞത് വാക്കുതോറും ആവർത്തിക്കാതെ അതിന്റെ ഉള്ളടക്കം സംഗ്രഹിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്. ‘ഇന്നിന്ന കാര്യങ്ങൾ’ ആ സംഗ്രഹഭാവം ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: דִּבְּרָה
  choice: പറഞ്ഞത്
  rationale: דבר എന്ന സാധാരണ സംസാരക്രിയയെ മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും ‘പറഞ്ഞത്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: הַנַּעֲרָה
  choice: പെൺകുട്ടി
  rationale: נַעֲרָה ഒരു പെൺകുട്ടിയെയോ യുവതിയെയോ സൂചിപ്പിക്കുന്നു. ഈ പദം ഇവിടെ ദാസ്യസ്ഥിതി നേരിട്ട് അടയാളപ്പെടുത്താത്തതിനാൽ ‘പെൺകുട്ടി’ എന്ന നേരിട്ടുള്ള പരിഭാഷ സ്വീകരിച്ചു.
- source_word: אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל
  choice: ഇസ്രായേൽദേശത്തുനിന്നുള്ള
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാള വിശേഷണഘടനയിൽ നൽകിയിരിക്കുന്നു; אֶרֶץ എന്ന ‘ദേശം’ എന്ന ഘടകവും നിലനിർത്തുന്നു.
