id: 2KI.5.1
reference: 2 Kings 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
translation:
  language: ml
  text: അരാം[c] രാജാവിന്റെ സൈന്യാധിപനായ നയമാൻ തന്റെ യജമാനന്റെ മുമ്പിൽ പ്രമുഖനും ഏറെ ആദരിക്കപ്പെട്ടവനും ആയിരുന്നു; കാരണം, അവനിലൂടെ യഹ്‌വെ അരാമിന് വിജയം[a] നൽകിയിരുന്നു. അവൻ വീരനായ ഒരു യോദ്ധാവായിരുന്നു; എങ്കിലും അവൻ കുഷ്ഠരോഗബാധിതനായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിജയം’ എന്നതിന് ‘വിടുതൽ’ അല്ലെങ്കിൽ ‘രക്ഷ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് വിശാലമായ അർഥമുണ്ടെങ്കിലും ഇവിടെ അത് സൈനികവിജയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘കുഷ്ഠരോഗി.’ പുരാതനകാലത്തെ ഈ പദം ഗുരുതരമായ പലതരം ത്വക്കുരോഗങ്ങളെ സൂചിപ്പിച്ചിരിക്കാം; ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ ഹാൻസൻസ് രോഗത്തോട് ഇത് കൃത്യമായി ഒത്തുപോകണമെന്നില്ല.
    reason: cultural_note
  - marker: c
    text: പരമ്പരാഗതമായി ‘സിറിയ’; എബ്രായത്തിൽ ‘അരാം.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַעֲמָן
  choice: നയമാൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു. തുടക്കത്തിലെ וְ പുതിയ സംഭവഭാഗത്തിലേക്കുള്ള ആഖ്യാനബന്ധമാണ്; മലയാളത്തിൽ അനാവശ്യമായ ‘ഇപ്പോൾ’ ചേർക്കാതെ വാക്യപ്രവാഹത്തിലൂടെ അത് സൂചിപ്പിക്കുന്നു.
- source_word: שַׂר צְבָא מֶלֶךְ אֲרָם
  choice: അരാം രാജാവിന്റെ സൈന്യാധിപൻ
  rationale: שַׂר צְבָא സൈന്യത്തിന്റെ പരമാധികാരിയായ ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു. אֲרָם എന്നത് പരമ്പരാഗതമായ ‘സിറിയ’ എന്നതിനുപകരം മൂലപാഠാനുസൃതമായി ‘അരാം’ എന്നു നൽകി.
- source_word: הָיָה אִישׁ גָּדוֹל לִפְנֵי אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ മുമ്പിൽ പ്രമുഖൻ ആയിരുന്നു
  rationale: אִישׁ גָּדוֹל ഇവിടെ ശരീരവലിപ്പത്തെയല്ല, പദവിയെയും സാമൂഹിക പ്രാധാന്യത്തെയും സൂചിപ്പിക്കുന്നു. לִפְנֵי എന്നതിന്റെ രാജസദസ്സിലെ ബന്ധസൂചന ‘മുമ്പിൽ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: וּנְשֻׂא פָנִים
  choice: ഏറെ ആദരിക്കപ്പെട്ടവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖം ഉയർത്തപ്പെട്ടവൻ’ എന്ന ഈ പ്രയോഗം ബഹുമാനവും അംഗീകാരവും ലഭിച്ചവനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ആശയം നൽകി.
- source_word: כִּי בוֹ נָתַן יְהוָה תְּשׁוּעָה לַאֲרָם
  choice: കാരണം, അവനിലൂടെ യഹ്‌വെ അരാമിന് വിജയം നൽകിയിരുന്നു
  rationale: בוֹ എന്നത് ഉപകരണാർഥത്തിൽ ‘അവനിലൂടെ’ എന്നു നൽകി. സൈനികസന്ദർഭത്തിൽ תְּשׁוּעָה ‘വിജയം’ എന്നു പരിഭാഷപ്പെടുത്തി; അതിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: גִּבּוֹר חַיִל
  choice: വീരനായ ഒരു യോദ്ധാവ്
  rationale: ഈ പദസമുച്ചയം സൈനികശക്തിയും തെളിയിക്കപ്പെട്ട ധീരതയും സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളം ഉപയോഗിച്ചു.
- source_word: מְצֹרָע
  choice: കുഷ്ഠരോഗബാധിതൻ
  rationale: צָרַעַת ബാധിച്ച ഒരാളെ സൂചിപ്പിക്കുന്ന പദം പരമ്പരാഗത തിരിച്ചറിയൽ നിലനിർത്തി പരിഭാഷപ്പെടുത്തി; എന്നാൽ അത് ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ ഹാൻസൻസ് രോഗത്തോട് കൃത്യമായി ഒത്തുപോകണമെന്നില്ലെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റിയില്ല. ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനുപകരം Yahweh എന്ന പുനർനിർമിത ഉച്ചാരണത്തോട് ചേർന്ന മലയാളരൂപം ഉപയോഗിച്ചു.
- issue: അരാം എന്ന അന്യരാജ്യത്തിന് യഹ്‌വെ വിജയം നൽകുന്നു എന്ന പ്രസ്താവന
  choice: അവനിലൂടെ യഹ്‌വെ അരാമിന് വിജയം നൽകിയിരുന്നു
  alternative: അവനിലൂടെ യഹ്‌വെ അരാമിനെ വിടുവിച്ചിരുന്നു
  rationale: ഇസ്രായേലിനു പുറത്തുള്ള ഒരു രാജ്യത്തിന്റെ സൈനികവിജയവും യഹ്‌വെയുടെ പ്രവർത്തനമായി മൂലപാഠം അവതരിപ്പിക്കുന്നു. ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം മയപ്പെടുത്താതെയും വിശദീകരിച്ച് തീർക്കാതെയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. രാജസദസ്സിന്റെയും സൈനികപദവിയുടെയും ഔപചാരികത നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ പ്രയോഗങ്ങൾ ഒഴിവാക്കി. മൂലപാഠത്തിലെ ‘എങ്കിലും’ എന്ന ശക്തമായ വൈരുധ്യം അവസാനവാക്യത്തിൽ വ്യക്തമായി സൂക്ഷിച്ചു.
