  source_fidelity: 'മൂലഎബ്രായത്തിന്റെ പ്രധാന അർഥഘടകങ്ങൾ വിശ്വസ്തമായി നിലനിർത്തിയിരിക്കുന്നു: നയമാന്റെ അരാംരാജാവിന്റെ സൈന്യാധിപത്യമെന്ന പദവി, യജമാനന്റെ മുമ്പിലെ ഉയർന്ന സ്ഥാനം, ആദരം, യഹ്‌വെ അവനിലൂടെ അരാമിന് വിജയം നൽകിയെന്ന പ്രസ്താവന, അവന്റെ യോദ്ധൃവീര്യം, ഒടുവിലെ വൈരുധ്യസൂചകമായ രോഗബാധ എന്നിവ എല്ലാം യഥാവിധി പ്രതിഫലിക്കുന്നു. ‘വിജയം’ സൈനികസന്ദർഭത്തിന് അനുയോജ്യമാണ്; അതിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.'
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനരീതിയിലാണ്. ‘പ്രമുഖനും ഏറെ ആദരിക്കപ്പെട്ടവനും’, ‘അവനിലൂടെ’, ‘എങ്കിലും’ എന്നിവ സന്ദർഭത്തിനും വാക്യപ്രവാഹത്തിനും യോജിക്കുന്നു. ‘വീരനായ ഒരു യോദ്ധാവ്’ അല്പം ആവർത്തനസ്വഭാവമുള്ളതാണെങ്കിലും ഗിബ്ബോർ-ഹയിലിന്റെ ശക്തിയും ധീരതയും വ്യക്തമായി നൽകുന്നതിനാൽ പരിഷ്കരണം അനിവാര്യമല്ല.
  terminology: ‘അരാം’, ‘യഹ്‌വെ’, ‘സൈന്യാധിപൻ’ എന്നീ തിരഞ്ഞെടുപ്പുകൾ മൂലപാഠപ്രാഥമികതയ്ക്കും ലക്ഷ്യഭാഷയിലെ വ്യക്തതയ്ക്കും യോജിക്കുന്നു. ‘കുഷ്ഠരോഗബാധിതൻ’ എന്ന പരമ്പരാഗതമായി തിരിച്ചറിയാവുന്ന രൂപത്തോടൊപ്പം അതിന്റെ ആധുനിക രോഗനിർണയസമത്വം ഉറപ്പില്ലെന്ന വിശദീകരണം നൽകുന്ന അടിക്കുറിപ്പ് ഉചിതമാണ്. എല്ലാ അടിക്കുറിപ്പ് ആങ്കറുകളും ശരിയായ സ്ഥാനത്തും അർഥബന്ധത്തോടെയും ഉണ്ട്.
