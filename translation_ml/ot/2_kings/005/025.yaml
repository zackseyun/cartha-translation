id: 2KI.5.25
reference: 2 Kings 5:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הוּא בָא֙ וַ/יַּעֲמֹ֣ד אֶל אֲדֹנָ֔י/ו וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱלִישָׁ֔ע מ/אן גֵּחֲזִ֑י וַ/יֹּ֕אמֶר לֹֽא הָלַ֥ךְ עַבְדְּ/ךָ֖ אָ֥נֶה וָ/אָֽנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/025.yaml
  text: But he went in and stood before his master[a], and Elisha said to him, “Where have you been, Gehazi?” And he said[b], “Your servant did not go anywhere.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അകത്തുവന്ന് തന്റെ യജമാനന്റെ മുമ്പിൽ നിന്നു. എലീശാ അവനോട്, “ഗേഹസീ, നീ എവിടെയായിരുന്നു?[a]” എന്നു ചോദിച്ചു. അവൻ മറുപടി പറഞ്ഞു: “അങ്ങയുടെ ദാസൻ എങ്ങോട്ടും പോയിട്ടില്ല.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: “ഗേഹസീ, എവിടെനിന്ന്?”'
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു ശൈലി: “അങ്ങയുടെ ദാസൻ ഇങ്ങോട്ടോ അങ്ങോട്ടോ പോയിട്ടില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא בָא
  choice: എന്നാൽ അവൻ അകത്തുവന്ന്
  rationale: മുൻവിവരണത്തോടുള്ള നേരിയ വൈരുധ്യം ‘എന്നാൽ’ സൂചിപ്പിക്കുന്നു. בָא എന്നത് അടിസ്ഥാനമായി ‘വന്നു’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ എലീശായുടെ സന്നിധിയിലേക്കുള്ള പ്രവേശനം വ്യക്തമാക്കാൻ സ്വാഭാവികമായ ‘അകത്തുവന്ന്’ ഉപയോഗിച്ചു.
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ മുമ്പിൽ നിന്നു
  rationale: ശുശ്രൂഷകനായ ഗേഹസീ മേലധികാരിയായ എലീശായുടെ സന്നിധിയിൽ നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ദൈവിക ബഹുമതിപ്പദമല്ലാത്തതിനാൽ ‘യജമാനൻ’ അനുയോജ്യം.
- source_word: מֵאָן
  choice: നീ എവിടെയായിരുന്നു?
  rationale: അക്ഷരാർഥം ‘എവിടെനിന്ന്?’ എന്നാണെങ്കിലും, സമീപകാലത്തെ ഗേഹസിയുടെ സ്ഥലം ചോദിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാള പ്രയോഗം തെരഞ്ഞെടുത്തു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: גֵּחֲזִי
  choice: ഗേഹസീ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ വ്യക്തവും ഉറവിടത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: לֹא הָלַךְ עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ ... പോയിട്ടില്ല
  rationale: ഗേഹസിയുടെ ആദരസൂചകമായ സ്വയംപരാമർശം ‘ഞാൻ’ എന്നു ലഘൂകരിക്കാതെ സംരക്ഷിച്ചു.
- source_word: אָנֶה וָאָנָה
  choice: എങ്ങോട്ടും
  rationale: ‘ഇങ്ങോട്ടോ അങ്ങോട്ടോ’ എന്ന ഹീബ്രു ദ്വിപദപ്രയോഗത്തിന്റെ നിഷേധവാക്യത്തിലെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; മൂലപ്രയോഗം അടിക്കുറിപ്പിൽ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. യജമാനൻ–ദാസൻ ബന്ധത്തിലെ ആദരഭാവം ‘അങ്ങയുടെ ദാസൻ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി; മൂലഭാഷയിലെ സംക്ഷിപ്ത ചോദ്യവും ദ്വിപദപ്രയോഗവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
