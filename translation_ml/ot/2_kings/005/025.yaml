  terminology: ‘യജമാനൻ’ appropriately represents Elisha as Gehazi’s human superior, without importing a divine-title sense. ‘ദാസൻ’ preserves the source’s respectful self-designation. The name ‘ഗേഹസീ’ is a clear, source-near Malayalam transliteration.
