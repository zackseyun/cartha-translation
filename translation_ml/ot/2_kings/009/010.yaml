translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. പ്രവചനവിധിയുടെ ഹ്രസ്വതയും കാഠിന്യവും നിലനിർത്തിയിരിക്കുന്നു; חֵלֶק എന്ന പദത്തിന്റെ സ്ഥലവ്യാപ്തിയിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
