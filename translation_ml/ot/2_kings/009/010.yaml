  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת אִיזֶ֜בֶל יֹאכְל֧וּ הַ/כְּלָבִ֛ים בְּ/חֵ֥לֶק יִזְרְעֶ֖אל וְ/אֵ֣ין קֹבֵ֑ר וַ/יִּפְתַּ֥ח הַ/דֶּ֖לֶת וַ/יָּנֹֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/010.yaml
  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
translation:
  language: ml
  text: യിസ്രെയേലിന്റെ പ്രദേശത്ത് ഈസേബെലിനെ നായ്ക്കൾ തിന്നും[a]; അവളെ അടക്കംചെയ്യാൻ ആരും ഉണ്ടാകുകയില്ല.” പിന്നെ അവൻ വാതിൽ തുറന്ന് ഓടിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യിസ്രെയേലിന്റെ ഭൂവിഭാഗത്തിൽ’ അല്ലെങ്കിൽ ‘യിസ്രെയേലിന്റെ നിലത്തിൽ.’ എബ്രായ חֵלֶק ഒരു ഓഹരി, ഭൂവിഭാഗം, അല്ലെങ്കിൽ പ്രത്യേക സ്ഥലഭാഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ
  choice: തിന്നുകളയും
  rationale: אכל എന്ന ക്രിയയുടെ ലളിതമായ ഭാവികാല അർഥം നിലനിർത്തുന്നു; വിധിപ്രഖ്യാപനത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ‘തിന്നുകളയും’ യോജിക്കുന്നു.
- source_word: הַכְּלָבִים
  choice: നായ്ക്കൾ
  rationale: നിശ്ചിതത്വം സന്ദർഭത്തിൽ വ്യക്തമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി ‘നായ്ക്കൾ’ എന്നു നൽകുന്നു.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: യിസ്രയേലിന്റെ പ്രദേശത്ത്
  rationale: חֵלֶק എന്നത് ഭൂമിയുടെ ഓഹരി, ഭാഗം, അല്ലെങ്കിൽ പ്രത്യേക ഭൂവിഭാഗം സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികവും വിശാലവുമായ ‘പ്രദേശം’ ഉപയോഗിച്ച് കൂടുതൽ കൃത്യമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְאֵין קֹבֵר
  choice: അവളെ അടക്കംചെയ്യാൻ ആരും ഉണ്ടാകുകയില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘അടക്കംചെയ്യുന്നവൻ ഇല്ല’ എന്ന നാമവാക്യമാണ്; പ്രവചനസന്ദർഭത്തിലെ ഭാവിയർഥവും സന്ദർഭത്തിൽനിന്നുള്ള സ്ത്രീലിംഗ കർമവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּפְתַּח הַדֶּלֶת
  choice: പിന്നെ അവൻ വാതിൽ തുറന്ന്
  rationale: വയിഖ്തോൽ രൂപം കഥയുടെ അടുത്ത പ്രവൃത്തി മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘പിന്നെ’ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיָּנֹס
  choice: ഓടിപ്പോയി
  rationale: נוס എന്നതിന്റെ ‘പലായനം ചെയ്യുക’ എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ അടിയന്തരതയോടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: אִיזֶבֶל
  choice: ഈസബെൽ
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി പകർത്തുന്നു.
