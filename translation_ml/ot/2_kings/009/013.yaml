  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְמַהֲר֗וּ וַ/יִּקְחוּ֙ אִ֣ישׁ בִּגְד֔/וֹ וַ/יָּשִׂ֥ימוּ תַחְתָּ֖י/ו אֶל גֶּ֣רֶם הַֽ/מַּעֲל֑וֹת וַֽ/יִּתְקְעוּ֙ בַּ/שּׁוֹפָ֔ר וַ/יֹּאמְר֖וּ מָלַ֥ךְ יֵהֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/013.yaml
  text: Then they hurried[a], and each man took his garment and put it under him on the bare steps, and they blew the horn and said[b], “Jehu is king!”
translation:
  language: ml
  text: അപ്പോൾ അവർ വേഗത്തിൽ, ഓരോരുത്തരും തങ്ങളുടെ മേലങ്കി എടുത്ത് യേഹൂവിന്റെ കീഴിൽ പടിക്കെട്ടിലെ വെറും പടികളിൽ വിരിച്ചു.[a] അവർ കാഹളം ഊതി,[b] “യേഹൂ രാജാവായിരിക്കുന്നു!” എന്നു വിളിച്ചുപറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പടികളുടെ മുകൾഭാഗത്ത്” എന്നോ “പടിക്കെട്ടിന്റെ തട്ടിൽ” എന്നോ പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപ്രയോഗം അപൂർവമായതിനാൽ അതിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ശോഫാർ; അടയാളം നൽകാൻ ഉപയോഗിച്ചിരുന്ന കൊമ്പുവാദ്യം. പരമ്പരാഗതമായി “കാഹളം” എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: അപ്പോൾ അവർ തിടുക്കത്തിൽ
  rationale: מהר എന്ന ക്രിയയുടെ വേഗത്തിലും ഉടനടിയുമുള്ള പ്രതികരണം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; തുടർച്ചയായ ആഖ്യാനബന്ധം ‘അപ്പോൾ’ സൂചിപ്പിക്കുന്നു.
- source_word: אִישׁ בִּגְדוֹ
  choice: ഓരോരുത്തരും താന്താങ്ങളുടെ മേലങ്കി എടുത്ത്
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തരും’ എന്നാണ്. בגד എന്നത് സന്ദർഭത്തിൽ പുറമേ ധരിക്കുന്ന വസ്ത്രമായതിനാൽ ‘മേലങ്കി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: യേഹൂവിന്റെ കീഴിൽ ... വിരിച്ചു
  rationale: תחתיוയിലെ സർവനാമം യേഹൂവിനെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു. വസ്ത്രങ്ങൾ വെച്ച പ്രവൃത്തിക്ക് മലയാളത്തിൽ ‘വിരിച്ചു’ സ്വാഭാവികമാണെങ്കിലും അവ ക്രമീകരിച്ച കൃത്യരീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  choice: പടിക്കെട്ടിന്റെ വെറും പ്രതലത്തിൽ
  rationale: അപൂർവമായ גרם എന്ന പദത്തിന്റെ ‘വെറും/തുറന്ന പ്രതലം’ എന്ന സാധ്യത നിലനിർത്തുന്നു; പടിയുടെ മുകൾഭാഗമോ പടിത്തട്ടോ എന്ന കൃത്യസ്ഥാനം പാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ വ്യത്യസ്ത സാധ്യതകൾ നൽകുന്നു.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: അവർ കാഹളം ഊതി
  rationale: שׁוֹפָר അടയാളം നൽകാൻ ഊതുന്ന കൊമ്പുവാദ്യമാണ്. സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പരമ്പരാഗത മലയാളപദമായ ‘കാഹളം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച് ഉപകരണത്തിന്റെ സ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיֹּאמְרוּ
  choice: എന്നു വിളിച്ചുപറഞ്ഞു
  rationale: അക്ഷരാർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും കാഹളം ഊതിയുള്ള പൊതുപ്രഖ്യാപനത്തിന്റെ സന്ദർഭത്തിൽ ‘വിളിച്ചുപറഞ്ഞു’ സ്വാഭാവികമായി ആശയം നൽകുന്നു.
- source_word: מָלַךְ יֵהוּא
  choice: യേഹൂ രാജാവായിരിക്കുന്നു!
  rationale: מָלַךְ എന്ന പൂർണ്ണക്രിയയുടെ സ്ഥാനാരോഹണം സംഭവിച്ചുകഴിഞ്ഞുവെന്ന സംഭവാർഥം സംരക്ഷിക്കുന്നു; വെറും നിലാവസ്ഥയായ ‘യേഹൂ രാജാവാണ്’ എന്നതിനെക്കാൾ ഇത് മൂലഭാഷയോട് അടുത്തതാണ്.
theological_decisions:
- issue: מָלַךְ എന്ന പൂർണ്ണക്രിയയിൽ രാജത്വത്തിന്റെ നിലയോ സ്ഥാനാരോഹണസംഭവമോ മുൻനിൽക്കുന്നതാണോ
  choice: യേഹൂ രാജാവായിരിക്കുന്നു!
  alternative: യേഹൂ രാജാവാണ്!
  rationale: പ്രഖ്യാപനം യേഹൂവിന്റെ രാജസ്ഥാനാരോഹണം ഇപ്പോൾ സംഭവിച്ചുകഴിഞ്ഞതായി അറിയിക്കുന്നതിനാൽ സംഭവാർഥം നിലനിർത്തി; ദൈവശാസ്ത്രപരമായ അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. അപൂർവമായ സ്ഥലസൂചകപ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു; രാജസ്ഥാനാരോഹണത്തിന്റെ സംഭവാർഥവും പൊതുപ്രഖ്യാപനത്തിന്റെ ഊർജവും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
