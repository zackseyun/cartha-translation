  to: അപ്പോൾ അവർ വേഗത്തിൽ, ഓരോരുത്തരും തങ്ങളുടെ മേലങ്കി എടുത്ത് യേഹൂവിന്റെ കീഴിൽ പടിക്കെട്ടിലെ വെറും പടികളിൽ വിരിച്ചു.[a] അവർ കാഹളം ഊതി,[b] “യേഹൂ രാജാവായിരിക്കുന്നു!” എന്നു വിളിച്ചുപറഞ്ഞു.
