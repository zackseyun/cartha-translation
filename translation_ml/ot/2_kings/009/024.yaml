  source_fidelity: മൂലത്തിലെ വില്ല് മുഴുവൻ വലിക്കുക, യെഹോരാമിനെ കൈകൾ/ഭുജങ്ങൾക്കിടയിൽ അമ്പെയ്യുക, അമ്പ് ഹൃദയഭാഗത്തുകൂടി പുറത്തുവരുക, രഥത്തിൽ കുഴഞ്ഞുവീഴുക എന്നീ ഘടകങ്ങൾ വിശ്വസ്തമായി പ്രതിഫലിപ്പിച്ചിട്ടുണ്ട്. בֵּין זְרֹעָיו എന്ന പ്രയോഗത്തിലെ ശരീരഭാഗ-അവ്യക്തതയും നിലനിർത്തിയിരിക്കുന്നു.
