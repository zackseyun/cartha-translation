source:
  edition: WLC
  text: וְ/יֵה֞וּא מִלֵּ֧א יָד֣/וֹ בַ/קֶּ֗שֶׁת וַ/יַּ֤ךְ אֶת יְהוֹרָם֙ בֵּ֣ין זְרֹעָ֔י/ו וַ/יֵּצֵ֥א הַ/חֵ֖צִי מִ/לִּבּ֑/וֹ וַ/יִּכְרַ֖ע בְּ/רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
translation:
  language: ml
  text: യേഹൂ വില്ല് പൂർണമായി വലിച്ച് യെഹോരാമിന്റെ കൈകൾക്കിടയിൽ[a] അമ്പെയ്തു. അമ്പ് അവന്റെ ഹൃദയത്തിലൂടെ പുറത്തുവന്നു; അവൻ തന്റെ രഥത്തിൽ കുഴഞ്ഞുവീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തോളുകൾക്കിടയിൽ’ / ‘തോളെല്ലുകൾക്കിടയിൽ.’ എബ്രായയിൽ അക്ഷരാർഥം ‘കൈകൾക്കിടയിൽ’ എന്നാണ്; സന്ദർഭത്തിൽ ഇത് മേൽമുതുകിനെയോ തോളുകളുടെ ഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַקֶּשֶׁת
  choice: വില്ല് പൂർണമായി വലിച്ച്
  rationale: ‘വില്ലുകൊണ്ട് കൈ നിറച്ചു’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം അമ്പെയ്യാൻ വില്ല് പൂർണമായി വലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: וַיַּךְ
  choice: അമ്പെയ്തു
  rationale: മൂലക്രിയയ്ക്ക് ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന വിശാലാർഥമുണ്ടെങ്കിലും ഇവിടെ വില്ലും അമ്പുമാണ് ഉപകരണം; സംഭവത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֵּין זְרֹעָיו
  choice: കൈകൾക്കിടയിൽ
  rationale: זְרוֹעַ സാധാരണയായി ‘കൈ/ഭുജം’ എന്നാണ്. മൂലപാഠത്തിന്റെ ശരീരശാസ്ത്രപരമായ അവ്യക്തത മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സന്ദർഭസാധ്യമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  choice: അമ്പ് അവന്റെ ഹൃദയത്തിലൂടെ പുറത്തുവന്നു
  rationale: മരണകരമായ മുറിവിന്റെ സന്ദർഭത്തിൽ לֵב ശരീരത്തിലെ ഹൃദയത്തെ സൂചിപ്പിക്കുന്നു; അമ്പ് ശരീരത്തിലൂടെ കടന്നുപോയെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיִּכְרַע
  choice: കുഴഞ്ഞുവീണു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കുനിയുക/മുട്ടുകുത്തുക’ എന്നാണെങ്കിലും, മാരകമായി മുറിവേറ്റ ശരീരം രഥത്തിൽ തളർന്നുവീഴുന്നതാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: בְּרִכְבּוֹ
  choice: തന്റെ രഥത്തിൽ
  rationale: പ്രത്യയം യെഹോരാമിന്റെ ഉടമസ്ഥത സൂചിപ്പിക്കുന്നതിനാൽ ‘തന്റെ രഥത്തിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
