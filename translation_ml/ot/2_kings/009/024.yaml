  terminology: യേഹൂ, യെഹോരാം എന്നീ പേരുകളുടെ രൂപങ്ങൾ അനുയോജ്യമാണ്. ‘കൈകൾക്കിടയിൽ’ മൂലപാഠത്തോടു ചേർന്നുനിൽക്കുന്നു; അടിക്കുറിപ്പ് ‘തോളുകൾക്കിടയിൽ/തോളെല്ലുകൾക്കിടയിൽ’ എന്ന സന്ദർഭസാധ്യമായ ബദൽ അർഥം നൽകുന്നു, എന്നാൽ അതിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
