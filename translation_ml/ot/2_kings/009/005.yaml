source:
  edition: WLC
  text: וַ/יָּבֹ֗א וְ/הִנֵּ֨ה שָׂרֵ֤י הַ/חַ֨יִל֙ יֹֽשְׁבִ֔ים וַ/יֹּ֕אמֶר דָּבָ֥ר לִ֛/י אֵלֶ֖י/ךָ הַ/שָּׂ֑ר וַ/יֹּ֤אמֶר יֵהוּא֙ אֶל מִ֣י מִ/כֻּלָּ֔/נוּ וַ/יֹּ֖אמֶר אֵלֶ֥י/ךָ הַ/שָּֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/005.yaml
  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
translation:
  language: ml
  text: 'അങ്ങനെ അവൻ വന്നു; അവിടെ സൈന്യാധിപന്മാർ ഇരിക്കുകയായിരുന്നു. അവൻ പറഞ്ഞു: “സൈന്യാധിപാ, അങ്ങയോടു പറയാൻ എനിക്കൊരു വാക്കുണ്ട്.[a]” യേഹൂ ചോദിച്ചു: “ഞങ്ങളിൽ ആരോടാണ്?” അവൻ പറഞ്ഞു: “അങ്ങയോടുതന്നെ, സൈന്യാധിപാ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “സൈന്യാധിപാ, അങ്ങേക്കായി എന്റെ പക്കൽ ഒരു സന്ദേശമുണ്ട്.” എബ്രായത്തിൽ അക്ഷരാർഥം: “സൈന്യാധിപാ, എനിക്ക് അങ്ങയിലേക്ക് ഒരു വാക്കുണ്ട്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അങ്ങനെ അവൻ അകത്തു ചെന്നു
  rationale: വാവു-തുടർച്ചാരൂപം കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; സന്ദർഭത്തിൽ മുറിയിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നതിനാൽ ‘അകത്തു ചെന്നു’ സ്വാഭാവികമാണ്.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ... കണ്ടു
  rationale: הִנֵּה നൽകുന്ന പെട്ടെന്നുള്ള ദൃശ്യാവതരണവും ശ്രദ്ധാകർഷണവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: שָׂרֵי הַחַיִל
  choice: സൈന്യാധിപന്മാർ
  rationale: സൈനികസന്ദർഭത്തിലെ ബഹുവചന നേതാക്കളെ പദവിയുടെ അതിരുകവിഞ്ഞ കൃത്യതയില്ലാതെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: יֹשְׁבִים
  choice: ഇരിക്കുന്നതു
  rationale: പങ്കുപദം സൂചിപ്പിക്കുന്ന തുടരുന്ന അവസ്ഥ ദൃശ്യവിവരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: דָּבָר לִי אֵלֶיךָ
  choice: അങ്ങയോടു പറയാൻ എനിക്കൊരു കാര്യമുണ്ട്
  rationale: അക്ഷരാർഥത്തിൽ ‘എനിക്ക് അങ്ങയിലേക്ക് ഒരു വാക്കുണ്ട്’ എന്ന ഹീബ്രു പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിലാക്കുന്നു; דָּבָר എന്നതിലെ ‘വാക്ക്/സന്ദേശം/കാര്യം’ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַשָּׂר
  choice: സൈന്യാധിപാ
  rationale: സൈനികനായ നേതാവിനോടുള്ള നേരിട്ടുള്ള സംബോധനയാണ്; ‘പ്രഭോ’ എന്ന അസൈനികമോ സാമൂഹികമോ ആയ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: אֶל־מִי מִכֻּלָּנוּ
  choice: ഞങ്ങളിൽ ആരോടാണ്?
  rationale: אֶל എന്ന ദിശാസൂചക ഭാവവും מִכֻּלָּנוּ എന്ന സംഘത്തിനുള്ളിലെ തിരഞ്ഞെടുപ്പും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֵלֶיךָ הַשָּׂר
  choice: അങ്ങയോടുതന്നെ, സൈന്യാധിപാ
  rationale: ഉദ്ദേശിക്കപ്പെട്ട വ്യക്തിയെ വ്യക്തമാക്കുന്ന മറുപടിയുടെ ഊന്നൽ ‘തന്നെ’ വഴി നൽകുന്നു; אֶל എന്നതിന്റെ ദിശാഭാവം ‘അങ്ങയോട്’ നിലനിർത്തുന്നു.
