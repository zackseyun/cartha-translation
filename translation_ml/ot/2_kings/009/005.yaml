translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. സൈനിക പദാവലി വ്യക്തമായി നിലനിർത്തി; ‘ഇതാ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ അവതരണത്തിനു പകരം הִנֵּהയുടെ ദൃശ്യപ്രഭാവം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ നൽകി.
