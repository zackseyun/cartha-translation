base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ എഴുന്നേറ്റ് വീട്ടിനകത്തേക്കു ചെന്നു. യുവപ്രവാചകൻ അവന്റെ തലയിൽ എണ്ണ ഒഴിച്ച് അവനോടു പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘യഹ്‌വെയുടെ ജനത്തിന്മേൽ, ഇസ്രായേലിന്മേൽ, രാജാവായി ഞാൻ നിന്നെ അഭിഷേകം ചെയ്തിരിക്കുന്നു[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യഹ്‌വെയുടെ ജനത്തിന്മേൽ, ഇസ്രായേലിന്മേൽ, രാജാവായി ഞാൻ നിന്നെ അഭിഷേകം ചെയ്യുന്നു.” ഈ അഭിഷേകപ്രഖ്യാപനത്തിൽ ഹീബ്രു perfect രൂപം, ആ വാക്കുകൾ ഉച്ചരിക്കുന്നതിലൂടെ നിയമനം പ്രാബല്യത്തിൽ വരുത്തുന്ന പ്രയോഗമായി മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם וַיָּבֹא הַבַּיְתָה
  choice: അവൻ എഴുന്നേറ്റ് വീടിനകത്തേക്കു ചെന്നു
  rationale: തുടർച്ചയായ ആഖ്യാനക്രിയകളെയും הַבַּיְתָה എന്ന ദിശാസൂചക രൂപത്തിന്റെ ‘വീടിനകത്തേക്ക്’ എന്ന അർഥത്തെയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  choice: പ്രവാചകൻ അവന്റെ തലയിൽ എണ്ണ ഒഴിച്ചിട്ട്
  rationale: יצק എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘ഒഴിക്കുക’ സംരക്ഷിക്കുന്നു. മലയാളത്തിൽ രണ്ട് പുരുഷ സർവനാമങ്ങൾ ആശയക്കുഴപ്പം സൃഷ്ടിക്കുന്നതിനാൽ മുൻസന്ദർഭത്തിൽ വ്യക്തമായ കർത്താവിനെ ‘പ്രവാചകൻ’ എന്നു ആവർത്തിക്കുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ സ്ഥിരസൂത്രവാക്യത്തിന് യോജിച്ച, ഗൗരവമുള്ളതും ഇന്നത്തെ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളപ്രയോഗം; ദൈവനാമം പേരായിത്തന്നെ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: ഹീബ്രു സംയുക്തപദബന്ധം നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מְשַׁחְתִּיךָ
  choice: ഞാൻ നിന്നെ അഭിഷേകം ചെയ്തിരിക്കുന്നു
  rationale: എണ്ണ ഒഴിച്ച പ്രവൃത്തി ഇപ്പോൾ പൂർത്തിയായതും അതിന്റെ ഫലം നിലനിൽക്കുന്നതുമായ ഭാവം ഹീബ്രു perfect-നോട് ചേർന്ന് പ്രകടിപ്പിക്കുന്നു; ‘അഭിഷേകം’ രാജനിയമനത്തിന്റെ ആചാരപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: לְמֶלֶךְ
  choice: രാജാവായി
  rationale: അഭിഷേകത്തിന്റെ ഫലമായ പദവിയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֶל עַם יְהוָה אֶל יִשְׂרָאֵל
  choice: യഹ്‌വെയുടെ ജനത്തിന്മേൽ, ഇസ്രായേലിന്മേൽ
  rationale: രാജകീയ അധികാരത്തിന്റെ പരിധിയെ സൂചിപ്പിക്കുന്ന אֶל എന്നതിനെ ‘മേൽ’ എന്നു നൽകുകയും ആവർത്തനവും സമാന്തരഘടനയും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ വ്യക്തിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: מְשַׁחְתִּיךָ എന്ന perfect രൂപത്തിന്റെ പ്രാബല്യം
  choice: ഞാൻ നിന്നെ അഭിഷേകം ചെയ്തിരിക്കുന്നു
  alternative: ഞാൻ നിന്നെ അഭിഷേകം ചെയ്യുന്നു
  rationale: എണ്ണ ഒഴിക്കൽ തൊട്ടുമുമ്പ് പൂർത്തിയായതിനെ മുഖ്യവായന പ്രതിഫലിപ്പിക്കുന്നു; എന്നാൽ ഈ നിയമനവാക്യത്തിൽ perfect-ന് കർമ്മനിർവഹണപരമായ വർത്തമാനപ്രാബല്യം ഉണ്ടാകാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: אֶל עַם יְהוָה എന്നതിലെ രാജകീയ ബന്ധം
  choice: യഹ്‌വെയുടെ ജനത്തിന്മേൽ ... രാജാവായി
  alternative: യഹ്‌വെയുടെ ജനത്തിനുവേണ്ടി ... രാജാവായി
  rationale: സന്ദർഭം രാജാവായുള്ള നിയമനമായതിനാൽ ഭരണാധികാരത്തിന്റെ പരിധിയാണ് മുഖ്യമായി സൂചിപ്പിക്കുന്നത്; ദൈവജനത്തിന്മേലുള്ള രാജത്വം എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയും പ്രവാചകവചനത്തിന് യോജിച്ച ഗൗരവമുള്ള ഭാഷയും ചേർത്തിരിക്കുന്നു. സർവനാമപരമായ അവ്യക്തത ഒഴിവാക്കാൻ രണ്ടാം വാക്യത്തിൽ മുൻസന്ദർഭത്തിൽ തിരിച്ചറിയപ്പെട്ട യുവപ്രവാചകനെ ‘പ്രവാചകൻ’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ഇംഗ്ലീഷ് consultation layer-ലുള്ള സ്ഥാനത്തല്ല, അതിന്റെ ഉള്ളടക്കവുമായി യഥാർഥമായി ബന്ധപ്പെട്ട ‘അഭിഷേകം ചെയ്തിരിക്കുന്നു’ എന്ന വാക്യഭാഗത്തിനുശേഷമാണ് നൽകിയിരിക്കുന്നത്.
