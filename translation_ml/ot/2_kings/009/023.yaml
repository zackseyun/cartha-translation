translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. മൂലത്തിലെ അസാധാരണമായ ‘കൈകൾ തിരിച്ചു’ എന്ന ദൃശ്യപ്രയോഗം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തി; ആവശ്യമായ സന്ദർഭവിവരണം അടിക്കുറിപ്പിൽ നൽകി. നേരിട്ടുള്ള വിളിയിലെ അടിയന്തരതയ്ക്കായി ഹ്രസ്വമായ ‘ചതി!’ തിരഞ്ഞെടുത്തു.
