source:
  edition: WLC
  text: וַ/יַּהֲפֹ֧ךְ יְהוֹרָ֛ם יָדָ֖י/ו וַ/יָּנֹ֑ס וַ/יֹּ֥אמֶר אֶל אֲחַזְיָ֖הוּ מִרְמָ֥ה אֲחַזְיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/023.yaml
  text: Then Jehoram turned his hands and fled[a], and said to Ahaziah, “Treachery[b], Ahaziah!”
translation:
  language: ml
  text: അപ്പോൾ യെഹോരാം തന്റെ കൈകൾ തിരിച്ചു[a]; ഓടിപ്പോയി. അവൻ അഹസ്യാവിനോട്, “വഞ്ചന[b], അഹസ്യാവേ!” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ കൈകൾ തിരിച്ചു.” ഈ പ്രയോഗം കൈകൾകൊണ്ട് കടിഞ്ഞാൺ നിയന്ത്രിച്ച് രഥം തിരിച്ചതിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം; എന്നാൽ ഇവിടെ എബ്രായപാഠം കടിഞ്ഞാണിനെയോ രഥത്തെയോ വ്യക്തമായി പരാമർശിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ചതി!”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: തിരിച്ച്
  rationale: הפך എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘തിരിക്കുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ രഥം തിരിച്ചതായിരിക്കാമെങ്കിലും മൂലപാഠത്തിൽ രഥമോ കടിഞ്ഞാണോ ഇവിടെ വ്യക്തമായി പറയുന്നില്ല.
- source_word: יָדָיו
  choice: തന്റെ കൈകൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനമായ ‘അവന്റെ കൈകൾ’ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. ഇത് കടിഞ്ഞാൺ കൈകാര്യം ചെയ്തതിനെ സൂചിപ്പിക്കാമെങ്കിലും ‘കടിഞ്ഞാൺ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്ത വസ്തുവിനെ വ്യക്തമാക്കും.
- source_word: וַיָּנֹס
  choice: ഓടിപ്പോയി
  rationale: നോസ് എന്ന ക്രിയയുടെ അപകടത്തിൽനിന്നുള്ള പെട്ടെന്നുള്ള പലായനഭാവം സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִרְמָה
  choice: ചതി
  rationale: വഞ്ചനയെയോ വിശ്വാസവഞ്ചനയെയോ സൂചിപ്പിക്കുന്ന പദമാണിത്. ഇവിടെ മുന്നറിയിപ്പായുള്ള ഹ്രസ്വവും അടിയന്തരവുമായ വിളിയായി ‘ചതി!’ സ്വാഭാവികമാണ്; ‘രാജദ്രോഹം’ എന്നത് മൂലപദത്തേക്കാൾ രാഷ്ട്രീയമായി നിർദിഷ്ടമാണ്.
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  choice: അഹസ്യാവ് / അഹസ്യാവേ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നൽകുകയും നേരിട്ടുള്ള സംബോധനയിൽ സ്വാഭാവികമായ ‘അഹസ്യാവേ’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיֹּאמֶר אֶל אֲחַזְיָהוּ ... אֲחַזְיָה
  choice: അവൻ അഹസ്യാവിനോട്, “ചതി, അഹസ്യാവേ!” എന്നു പറഞ്ഞു
  rationale: അഹസ്യാവിന്റെ പേര് വിവരണത്തിലും നേരിട്ടുള്ള സംബോധനയിലും ആവർത്തിക്കുന്ന എബ്രായഘടനയും അതിലെ അടിയന്തരതയും സംരക്ഷിക്കുന്നു.
