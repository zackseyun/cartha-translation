    rationale: A semicolon clarifies that Jehoram first ‘turned his hands’ and then fled, without interpreting ‘hands’ as reins or adding a chariot.
  - severity: low
    issue: Footnote a is anchored after ‘ഓടിപ്പോയി’ rather than the unusual expression it discusses.
    rationale: Placing the marker immediately after ‘തന്റെ കൈകൾ തിരിച്ചു’ makes the lexical note’s referent unambiguous.
  - severity: low
    issue: ‘ചതി!’ is somewhat narrower and more colloquial than the source term in this context.
    rationale: ‘വഞ്ചന!’ naturally covers deceit/treachery and preserves the terse alarmed exclamation.
