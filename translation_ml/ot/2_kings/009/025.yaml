- source_word: שָׂא הַשְׁלִכֵהוּ
  choice: അവനെ എടുത്ത് ... എറിഞ്ഞുകളയുക
  rationale: ശരീരം എടുത്തുമാറ്റി നിലത്തിലേക്ക് എറിയാനുള്ള രണ്ട് ആജ്ഞകളുടെയും നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു.
- source_word: בְּחֶלְקַת שְׂדֵה
  choice: വയൽഭാഗത്തിലേക്ക്
  rationale: חלקה എന്ന ഭൂമിയുടെ നിശ്ചിത ഭാഗവും שדה എന്ന വയൽഭൂമിയും സ്വാഭാവികമായ ഒറ്റ മലയാളപ്രയോഗത്തിൽ അറിയിക്കുന്നു.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: യിസ്രെയേല്യനായ നാബോത്ത്
  rationale: വ്യക്തിനാമവും ദേശജനനാമവും മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ രൂപത്തിൽ നൽകി.
- source_word: רֹכְבִים צְמָדִים
  choice: ജോടിയായി സഞ്ചരിക്കുമ്പോൾ
  rationale: അക്ഷരാർഥം ‘ജോടികളായി/ജോടിയായി സവാരി ചെയ്യുന്നവർ’; അവർ ആഹാബിന്റെ പിന്നാലെ ഒരുമിച്ച് സഞ്ചരിച്ചെന്ന ആശയം നൽകുകയും സവാരിയുടെ കൃത്യരൂപം അനാവശ്യമായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אַחֲרֵי אַחְאָב אָבִיו
  choice: അവന്റെ അപ്പനായ ആഹാബിന്റെ പിന്നാലെ
  rationale: ‘അവന്റെ’ എന്നത് കൊല്ലപ്പെട്ട യോരാമിനെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു; אחרי എന്നതിന്റെ സ്ഥാനപരവും അനുചരപരവുമായ അർഥം ‘പിന്നാലെ’ നിലനിർത്തുന്നു.
- source_word: וַיהוָה
  choice: യഹ്‌വെ
  rationale: വാചകത്തിലുള്ള ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: נָשָׂא עָלָיו אֶת־הַמַּשָּׂא הַזֶּה
  choice: അവനെതിരെ ഈ ദൈവവചനം അരുളിച്ചെയ്തു
  rationale: מַשָּׂא എന്നത് ഭാരമേറിയ പ്രവാചക പ്രഖ്യാപനം/അരുളപ്പാട് എന്ന അർഥത്തിൽ; ‘അവനെതിരെ’ എന്ന ന്യായവിധിപരമായ ദിശ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം സീനായിൽ വെളിപ്പെടുത്തപ്പെട്ട ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: מַשָּׂא എന്ന പ്രവാചകപദത്തിന്റെ സ്വഭാവം
  choice: ദൈവവചനം
  alternative: അരുളപ്പാട് / ഭാരം
  rationale: ഇത് ദൈവത്തിൽനിന്നുള്ള ഗൗരവമേറിയ, പ്രതികൂലമായ പ്രഖ്യാപനമാണെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു. പ്രധാനവാചകത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ദൈവവചനം’ നൽകി; പദത്തിന്റെ ഭാരമേറിയ പ്രവാചകസ്വരം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആജ്ഞയുടെ കാഠിന്യവും പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ന്യായവിധിസ്വരവും നിലനിർത്തിയിട്ടുണ്ട്. ‘ജോടിയായി സഞ്ചരിക്കുക’ എന്നത് മൂലത്തിലെ അനിശ്ചിതത്വം പൂർണമായി പരിഹരിക്കാതെ വായനാസൗകര്യം നൽകുന്നു.
