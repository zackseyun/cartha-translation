  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ തന്റെ ഉദ്യോഗസ്ഥനായ ബിദ്കരിനോടു[a] പറഞ്ഞു: “അവനെ എടുത്ത് യിസ്രെയേല്യനായ നാബോത്തിന്റെ വയൽഭാഗത്തിലേക്ക് എറിഞ്ഞുകളയുക. ഓർക്കുക: ഞാനും നീയും ഇവന്റെ പിതാവായ ആഹാബിന്റെ പിന്നാലെ ജോടിയായി സവാരി ചെയ്തിരുന്നതു[b]; യഹ്‌വെ അവനെതിരെ ഈ പ്രവാചകപ്രഖ്യാപനം[c] ഉച്ചരിച്ചിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ മൂന്നാമൻ.” ഇത് ബിദ്കരിന്റെ പദവിയെയോ സ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്ന ഒരു സാങ്കേതിക പ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ “ജോടികളായി സവാരി ചെയ്യുന്നവർ” എന്നാണ്; യേഹൂവും ബിദ്കരും ആഹാബിന്റെ പിന്നാലെ ഒരുമിച്ച് സഞ്ചരിച്ചിരുന്നതിനെ ഇത് സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “അരുളപ്പാട്” അല്ലെങ്കിൽ “ഭാരം.” എബ്രായപദം ഗൗരവമേറിയ ഒരു പ്രവാചകപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
