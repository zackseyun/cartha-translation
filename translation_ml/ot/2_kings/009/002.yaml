  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
translation:
  language: ml
  text: നീ അവിടെ എത്തുമ്പോൾ, നിംശിയുടെ മകനായ യെഹോശാഫാത്തിന്റെ മകൻ യേഹൂവിനെ അന്വേഷിക്കുക. അകത്തുചെന്ന്, അവന്റെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന് അവനെ എഴുന്നേൽപ്പിച്ച് ഒരു അകത്തെ മുറിയിലേക്കു[a] കൊണ്ടുപോകുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഒരു മുറിക്കുള്ളിലെ മുറി”; അതായത്, സ്വകാര്യമായ ഒരു അകത്തെ അറ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  choice: നീ അവിടെ എത്തുമ്പോൾ
  rationale: בוא എന്ന ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് വരുക, പോകുക, എത്തുക എന്നീ അർഥങ്ങൾ വരാം. തുടർന്നുള്ള നിർദേശങ്ങൾക്ക് മുമ്പുള്ള സ്ഥലപ്രാപ്തി സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അവിടെ എത്തുമ്പോൾ’ എന്നു നൽകി.
- source_word: וּרְאֵה שָׁם
  choice: അന്വേഷിക്കുക
  rationale: ראה അക്ഷരാർഥത്തിൽ ‘കാണുക’ എന്നാണെങ്കിലും, പിന്നാലെ പേരുപറയുന്ന വ്യക്തിയെ കണ്ടെത്തുക എന്നതാണ് ഈ നിർദേശസന്ദർഭത്തിലെ അർഥം. ‘അന്വേഷിക്കുക’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘അവിടെ’ മുൻവാക്യത്തിൽ നിലനിൽക്കുന്നതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി.
- source_word: יֵהוּא בֶן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: നിംശിയുടെ മകനായ യെഹോശാഫാത്തിന്റെ മകൻ യേഹൂ
  rationale: എബ്രായ വംശാവലിക്രമത്തിലെ ബന്ധം മലയാളത്തിൽ ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാക്കാൻ പൂർവികനിൽനിന്ന് വ്യക്തിയിലേക്കുള്ള സ്വാഭാവിക ഘടന ഉപയോഗിച്ചു.
- source_word: וּבָאתָ
  choice: അകത്തുചെന്ന്
  rationale: യേഹൂ ഉള്ള കൂട്ടത്തിലേക്കു പ്രവേശിച്ചശേഷമുള്ള പ്രവൃത്തിയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; അതിനാൽ ചലനവും തുടർന്നുള്ള പ്രവർത്തനവും ചേർത്ത് സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: וַהֲקֵמֹתוֹ
  choice: അവനെ എഴുന്നേൽപ്പിച്ച്
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഒരാളെ എഴുന്നേൽക്കാൻ ഇടയാക്കുക എന്നർഥം നൽകുന്നു. ‘എഴുന്നേൽപ്പിച്ച്’ രൂപവും സന്ദർഭവും നേരിട്ട് സൂക്ഷിക്കുന്നു.
- source_word: מִתּוֹךְ אֶחָיו
  choice: അവന്റെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന്
  rationale: אחים എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘സഹോദരന്മാർ’ നിലനിർത്തി. ഇവിടെ സഹപ്രവർത്തകരെയോ സൈനികസഹചാരികളെയോ സൂചിപ്പിക്കാമെങ്കിലും, സന്ദർഭം അതിനെ നിർബന്ധിതമായി തീർപ്പാക്കാത്തതിനാൽ മൂലത്തിലെ വിശാലത സംരക്ഷിച്ചു.
- source_word: וְהֵבֵיאתָ אֹתוֹ
  choice: കൊണ്ടുപോകുക
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘കൊണ്ടുവരുക/കൊണ്ടുപോകുക’ എന്നർഥം നൽകുന്നു. നിർദേശം നൽകുന്നവന്റെ സ്ഥാനത്തുനിന്ന് അകലെയുള്ള മുറിയിലേക്കുള്ള നീക്കം മലയാളത്തിൽ ‘കൊണ്ടുപോകുക’ എന്ന് സ്വാഭാവികമാണ്.
- source_word: חֶדֶר בְּחָדֶר
  choice: ഒരു അകത്തെ മുറിയിലേക്ക്
  rationale: അക്ഷരാർഥത്തിലെ ‘മുറിക്കുള്ളിലെ മുറി’ സ്വകാര്യമായ അകത്തെ അറയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. വ്യക്തമായ മലയാളത്തിനായി ‘അകത്തെ മുറി’ എന്നു നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
