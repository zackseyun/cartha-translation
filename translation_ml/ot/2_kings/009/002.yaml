translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾ സാധാരണ മലയാള ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് ചേർന്ന് നൽകി. മൂലത്തിലെ ‘സഹോദരന്മാർ’ എന്ന പദത്തിന്റെ സന്ദർഭപരമായ സാധ്യതകൾ തീർപ്പാക്കാതെ നിലനിർത്തി.
