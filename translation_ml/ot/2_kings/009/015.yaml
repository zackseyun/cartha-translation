id: 2KI.9.15
reference: 2 Kings 9:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּשָׁב֩ יְהוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בִ/יְזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֣ר יַכֻּ֣/הוּ אֲרַמִּ֔ים בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/יֹּ֤אמֶר יֵהוּא֙ אִם יֵ֣שׁ נַפְשְׁ/כֶ֔ם אַל יֵצֵ֤א פָלִיט֙ מִן הָ/עִ֔יר לָ/לֶ֖כֶת ל/גיד בְּ/יִזְרְעֶֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram. Jehu said, “If this is your wish, let no one escape from the city to go and report it in Jezreel.”
translation:
  language: ml
  text: 'യോരാം രാജാവ് അരാംരാജാവായ ഹസായേലിനോടു യുദ്ധം ചെയ്തപ്പോൾ അരാമ്യർ ഏൽപ്പിച്ച മുറിവുകളിൽനിന്നു സുഖം പ്രാപിക്കാൻ യിസ്രെയേലിലേക്കു മടങ്ങിയിരുന്നു. യേഹൂ പറഞ്ഞു: “ഇതാണ് നിങ്ങളുടെ ആഗ്രഹമെങ്കിൽ, നഗരത്തിൽനിന്ന് ആരും രക്ഷപ്പെട്ട് യിസ്രെയേലിൽ ചെന്നു വിവരം അറിയിക്കരുത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിയിരുന്നു
  rationale: മുൻസന്ദർഭത്തിൽ നടന്ന യോരാമിന്റെ മടങ്ങിവരവ് സൂചിപ്പിക്കാൻ മലയാളത്തിലെ പൂർവഭൂതകാലരൂപം സ്വാഭാവികമാണ്.
- source_word: לְהִתְרַפֵּא
  choice: സുഖം പ്രാപിക്കാൻ
  rationale: ഹിത്പയേൽ രൂപം മുറിവുകളിൽനിന്നുള്ള സുഖപ്രാപ്തിയെ സൂചിപ്പിക്കുന്നു; സ്വയം ചികിത്സിച്ചു എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: מִן הַמַּכִּים אֲשֶׁר יַכֻּהוּ
  choice: ഏൽപ്പിച്ച മുറിവുകളിൽനിന്ന്
  rationale: അക്ഷരാർഥമായ അടികളേക്കാൾ യുദ്ധത്തിൽ ഉണ്ടായ പരിക്കുകളാണ് സന്ദർഭാർഥം; 'ഏൽപ്പിച്ച' കാരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲרַמִּים
  choice: അരാമ്യർ
  rationale: ചരിത്രപരമായ അരാംജനതയെ തന്നെയാണ് സൂചിപ്പിക്കുന്നത്; അനാകാലികമായ 'സിറിയക്കാർ' ഒഴിവാക്കുന്നു.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָאֵל
  choice: ഹസായേലിനോടു യുദ്ധം ചെയ്തപ്പോൾ
  rationale: ב prefixed infinitive construct സാഹചര്യകാലത്തെ സൂചിപ്പിക്കുന്നു; എതിരാളിത്തം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  choice: ഇതാണ് നിങ്ങളുടെ ആഗ്രഹമെങ്കിൽ
  rationale: സംഘത്തിന്റെ ഇഷ്ടമോ സമ്മതമോ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയെ അക്ഷരാർഥമായ 'നിങ്ങളുടെ പ്രാണൻ' എന്നു പറയാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַל יֵצֵא פָלִיט
  choice: ആരും രക്ഷപ്പെട്ട് ... പോകരുത്
  rationale: פָלִיט ഇവിടെ സ്ഥിരമായൊരു 'അഭയാർഥി' വിഭാഗമല്ല, നഗരത്തിൽനിന്നു രക്ഷപ്പെട്ടു പോകുന്ന ആരെയുമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לָלֶכֶת לְהַגִּיד
  choice: ചെന്നു വിവരം അറിയിക്കരുത്
  rationale: യാത്രചെയ്ത് വാർത്ത അറിയിക്കുന്ന അനുക്രമപ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּיִזְרְעֶאל
  choice: യിസ്രെയേലിൽ
  rationale: ב ഇവിടെ ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനിക പ്രയോഗമാണ്.
