translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകി. മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണങ്ങളോ മതവിഭാഗസവിശേഷമായ വ്യാഖ്യാനങ്ങളോ ചേർത്തിട്ടില്ല.
