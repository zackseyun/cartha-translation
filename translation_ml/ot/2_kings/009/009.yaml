id: 2KI.9.9
reference: 2 Kings 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָֽתַתִּי֙ אֶת בֵּ֣ית אַחְאָ֔ב כְּ/בֵ֖ית יָרָבְעָ֣ם בֶּן נְבָ֑ט וּ/כְ/בֵ֖ית בַּעְשָׁ֥א בֶן אֲחִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
translation:
  language: ml
  text: ഞാൻ ആഹാബിന്റെ ഭവനത്തെ നെബാത്തിന്റെ മകനായ യൊരോബെയാമിന്റെ ഭവനംപോലെയും അഹീയാവിന്റെ മകനായ ബയെശായുടെ ഭവനംപോലെയും ആക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആഹാബിന്റെ രാജവംശത്തെ ... യൊരോബെയാമിന്റെ രാജവംശംപോലെയും ... ബയെശായുടെ രാജവംശംപോലെയും.” ഇവിടെ “ഭവനം” എന്ന ഹീബ്രായ പ്രയോഗം ഒരു രാജവംശത്തെയോ രാജകുടുംബപരമ്പരയെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָֽתַתִּי
  choice: ഞാൻ ... ആക്കും
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കൊടുക്കുക/വെക്കുക’ എന്നാണെങ്കിലും, നേരിട്ടുള്ള കർമത്തോടും തുടർന്നുള്ള ഉപമകളോടും കൂടിയ ഈ ന്യായവിധിവാക്യത്തിൽ ‘...പോലെ ആക്കും’ എന്നത് കാരണാർത്ഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בֵּית אַחְאָב
  choice: ആഹാബിന്റെ ഭവനം
  rationale: בַּיִת എന്ന പദത്തിന്റെ ‘ഭവനം’ എന്ന രൂപകം നിലനിർത്തുന്നു; ഇവിടെ അത് രാജവംശത്തെയോ രാജകുടുംബപരമ്പരയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: כְּ/בֵית ... וּ/כְ/בֵית
  choice: ഭവനംപോലെയും ... ഭവനംപോലെയും
  rationale: כְּ എന്ന താരതമ്യപ്രത്യയം ‘പോലെ’ എന്നു വിവർത്തനം ചെയ്യുകയും രണ്ട് സമാന്തര ഉപമകളുടെയും ഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകനായ യൊരോബെയാം
  rationale: ഹീബ്രായ പുത്രബന്ധഘടന വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: അഹീയാവിന്റെ മകനായ ബയെശ
  rationale: പേരുകളും പുത്രബന്ധവും സംരക്ഷിച്ച് മുൻകാലത്ത് ന്യായവിധിക്കിരയായ രാജവംശത്തിലേക്കുള്ള ചരിത്രസൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: രാജവംശത്തിന്മേലുള്ള ന്യായവിധിവാക്യത്തിന്റെ വിവർത്തനം
  choice: ആഹാബിന്റെ ഭവനം ... യൊരോബെയാമിന്റെ ഭവനംപോലെയും ... ബയെശയുടെ ഭവനംപോലെയും
  alternative: ആഹാബിന്റെ രാജവംശം ... യൊരോബെയാമിന്റെ രാജവംശംപോലെയും ... ബയെശയുടെ രാജവംശംപോലെയും
  rationale: ‘ഭവനം’ എന്ന ഹീബ്രായ രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നത് വേദപുസ്തകത്തിലെ പരസ്പരബന്ധിതമായ പ്രയോഗങ്ങൾ സംരക്ഷിക്കുന്നു; ‘രാജവംശം’ എന്ന വ്യാഖ്യാനപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഹീബ്രായത്തിലെ രാജവംശരൂപകമായ ‘ഭവനം’ നിലനിർത്തി, അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകി.
