  yaml_path: translation/ot/2_kings/009/029.yaml
  text: In the eleventh year of Joram son of Ahab[a], Ahaziah became king over Judah.
translation:
  language: ml
  text: ആഹാബിന്റെ മകനായ യോരാമിന്റെ പതിനൊന്നാം ഭരണവർഷത്തിൽ[a] അഹസ്യാവ് യെഹൂദായുടെ രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യോരാമിന്റെയും അഹസ്യാവിന്റെയും ഭരണകാലങ്ങളെക്കുറിച്ച് രാജാക്കന്മാരിലും ദിനവൃത്താന്തങ്ങളിലും കാണുന്ന കാലസൂചനകൾ പരസ്പരം പൊരുത്തപ്പെടുത്തുക പ്രയാസമാണ്. കാലക്രമം മുഖ്യപാഠത്തിൽ പരിഹരിക്കാൻ ശ്രമിക്കാതെ, ഈ പരിഭാഷ എബ്രായപാഠം എഴുതപ്പെട്ടിരിക്കുന്നതുപോലെ നൽകുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: ഭരണവർഷത്തിൽ
  rationale: വാക്യാരംഭത്തിലെ וּ സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല; בִשְׁנַת എന്ന കാലസൂചകപ്രയോഗം രാജഭരണകാലഗണനയാണെന്ന് വ്യക്തമാക്കാൻ ‘ഭരണവർഷത്തിൽ’ എന്നു നൽകി.
- source_word: אַחַת עֶשְׂרֵה שָׁנָה
  choice: പതിനൊന്നാം
  rationale: രാജാക്കന്മാരുടെ വർഷഗണനയിൽ ഈ എബ്രായ സംഖ്യാഘടന ക്രമസംഖ്യയായി ‘പതിനൊന്നാം’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുന്നു.
- source_word: לְיוֹרָם
  choice: യോരാമിന്റെ
  rationale: രാജവർഷസൂത്രത്തിൽ לְ മറ്റൊരു രാജാവിന്റെ ഭരണത്തെ കാലഗണനയുടെ ആധാരമാക്കുന്നു; മലയാളത്തിലെ സംബന്ധികാവിഭക്തി അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בֶּן אַחְאָב
  choice: ആഹാബിന്റെ മകനായ
  rationale: ഏത് യോരാമാണെന്ന് വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള പിതൃനാമസൂചന.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: ഇവിടെ ക്രിയ ഭരണകാലത്തിന്റെ മുഴുവൻ ദൈർഘ്യമല്ല, സിംഹാസനാരോഹണം സൂചിപ്പിക്കുന്നു; ‘രാജാവായി’ ഈ ആരംഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲחַזְיָה
  choice: അഹസ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപം.
- source_word: עַל יְהוּדָה
  choice: യെഹൂദായുടെ രാജാവായി
  rationale: מָלַךְ עַל എന്നത് ഒരു രാജ്യത്തിന്മേലുള്ള ഭരണം സൂചിപ്പിക്കുന്നു; ‘യെഹൂദായുടെ രാജാവായി’ എന്ന മലയാളപ്രയോഗം അതേ ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: യോരാമിന്റെയും അഹസ്യാവിന്റെയും ഭരണകാലങ്ങളെ സംബന്ധിക്കുന്ന കാലക്രമപ്രശ്നം
  choice: എബ്രായ പാഠത്തിൽ ഉള്ളതുപോലെ ‘യോരാമിന്റെ പതിനൊന്നാം ഭരണവർഷത്തിൽ’ എന്നു നിലനിർത്തി.
  alternative: രാജാക്കന്മാരിലെയും ദിനവൃത്താന്തങ്ങളിലെയും മറ്റു കാലസൂചനകളുമായി പൊരുത്തപ്പെടുത്താൻ വർഷം വ്യാഖ്യാനിച്ചോ തിരുത്തിയോ നൽകുക.
  rationale: മൂലപാഠത്തിലെ കാലസൂചനയെ നിശ്ശബ്ദമായി ഏകീകരിക്കുകയോ തിരുത്തുകയോ ചെയ്യാതെ, യഥാർത്ഥ പാഠവും അതിലെ കാലക്രമപിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ രാജവംശകാലസൂചന. ‘ഭരണവർഷം’ കാലഗണന വ്യക്തമാക്കുന്നു; ‘രാജാവായി’ സിംഹാസനാരോഹണത്തിന്റെ ആരംഭാർഥം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
