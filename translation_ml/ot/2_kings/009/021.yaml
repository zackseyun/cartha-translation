  yaml_path: translation/ot/2_kings/009/021.yaml
  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
translation:
  language: ml
  text: അപ്പോൾ യെഹോരാം പറഞ്ഞു[a], “രഥം കെട്ടുക!” അവർ അവന്റെ രഥം കെട്ടി. പിന്നെ ഇസ്രായേൽരാജാവായ യെഹോരാമും യെഹൂദാരാജാവായ അഹസ്യാവും അവരവരുടെ രഥങ്ങളിൽ യേഹുവിനെ കാണാൻ പുറപ്പെട്ടു. യിസ്രെയേൽ സ്വദേശിയായ നാബോത്തിന്റെ ഭൂവിഭാഗത്തിൽവെച്ച് അവർ അവനെ കണ്ടുമുട്ടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായമൂലത്തിൽ തുടർന്നുള്ള വാക്യം അക്ഷരാർഥത്തിൽ “അവൻ തന്റെ രഥം കെട്ടി” എന്നാണ്; രാജാവിന്റെ ആജ്ഞ പരിചാരകർ നടപ്പാക്കിയതായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹר
  choice: രഥം കെട്ടുക!
  rationale: രഥസന്ദർഭത്തിൽ ഈ ആജ്ഞ കുതിരകളെ രഥത്തോടു ബന്ധിച്ച് യാത്രയ്ക്കൊരുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘രഥം കെട്ടുക’ എന്നത് സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണ്.
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  choice: അവർ അവന്റെ രഥം കെട്ടി
  rationale: എബ്രായ ക്രിയ വ്യാകരണപരമായി ഏകവചന പുരുഷലിംഗത്തിലാണ്; എങ്കിലും രാജാവിന്റെ ആജ്ഞ പരിചാരകർ നടപ്പാക്കിയതാണെന്ന കഥാസന്ദർഭം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ബഹുവചനം ഉപയോഗിച്ചു. മൂലരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אִישׁ בְּרִכְבּוֹ
  choice: അവരവരുടെ രഥത്തിൽ
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തനും’ എന്നാണ്; രണ്ടു രാജാക്കന്മാരും പ്രത്യേകം രഥങ്ങളിലായിരുന്നുവെന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ ‘അവരവരുടെ’ എന്ന രൂപം നൽകുന്നു.
- source_word: לִקְרַאת יֵהוּא
  choice: യേഹുവിനെ എതിരേൽക്കാൻ
  rationale: לקראת ഒരാളുടെ നേരെ ചെന്നു കാണുക/എതിരേൽക്കുക എന്നർഥം നൽകുന്നു. ഇവിടെ ‘എതിരേൽക്കാൻ’ ഉദ്ദേശ്യവും മുന്നോട്ടുള്ള നീക്കവും നിലനിർത്തുന്നു.
- source_word: וַיִּמְצָאֻהוּ
  choice: അവർ അവനെ കണ്ടുമുട്ടി
  rationale: מצא എന്നത് ഈ ആഖ്യാനസന്ദർഭത്തിൽ കണ്ടെത്തുക എന്നതിലുപരി ചെന്നെത്തി അഭിമുഖീകരിക്കുക എന്ന അർഥവും വഹിക്കുന്നു; ‘കണ്ടുമുട്ടി’ ആ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּחֶלְקַת נָבוֹת
  choice: നാബോത്തിന്റെ നിലത്തുവെച്ച്
  rationale: חֶלְקָה ഒരു നിർദിഷ്ട ഭൂവിഭാഗത്തെയോ സ്ഥലഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. ‘നിലം’ വായനാസൗകര്യത്തോടെ ഭൂസ്വത്തുസംബന്ധമായ പശ്ചാത്തലം നിലനിർത്തുന്നു.
- source_word: הַיִּזְרְעֵאלִי
  choice: യിസ്രെയേല്യനായ
  rationale: ഈ ജാതിവാചകം/ദേശനാമവിശേഷണം നാബോത്തിനെ യിസ്രെയേൽ സ്വദേശിയായി തിരിച്ചറിയിക്കുന്നു; സ്ഥാപിതമായ പേരുരൂപം നിലനിർത്തി.
