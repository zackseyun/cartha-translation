  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. രാജപദവികൾ വ്യക്തിനാമങ്ങളോടു ചേർത്ത് നൽകി; രഥസജ്ജീകരണത്തിന്റെ സാങ്കേതികത അമിതമായി വിശദീകരിക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തത സൂക്ഷിച്ചു.
