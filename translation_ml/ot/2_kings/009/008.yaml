  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
translation:
  language: ml
  text: ആഹാബിന്റെ ഗൃഹം മുഴുവനും നശിച്ചുപോകും; ഇസ്രായേലിൽ ആഹാബിന്റെ ഗൃഹത്തിൽനിന്ന് സകല പുരുഷന്മാരെയും[a]—അടിമയെയും സ്വതന്ത്രനെയും[b]—ഞാൻ വെട്ടിമാറ്റും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ചുമരിന്മേൽ മൂത്രമൊഴിക്കുന്ന ഏവനെയും’; പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന പരുഷമായൊരു ശൈലി.'
    reason: lexical_alternative
  - marker: b
    text: ‘അടിമയെയും സ്വതന്ത്രനെയും’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായ പദജോടിയുടെ അക്ഷരാർഥം ‘അടച്ചുവെക്കപ്പെട്ടവനെയും വിട്ടയക്കപ്പെട്ടവനെയും’ എന്നാണ്; അതിന്റെ കൃത്യമായ സൂചന അനിശ്ചിതമാണ്.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאָבַד
  choice: നശിച്ചുപോകും
  rationale: പ്രവചനസന്ദർഭത്തിൽ ഭാവികാല വിധിയെ സൂചിപ്പിക്കുന്ന ക്രിയാരൂപം; നാശം വ്യക്തമാക്കുമ്പോഴും കർത്തൃത്വം അനാവശ്യമായി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: כָּל בֵּית אַחְאָב
  choice: ആഹാബിന്റെ ഗൃഹം മുഴുവനും
  rationale: രാജവംശത്തെയും കുടുംബത്തെയും സൂചിപ്പിക്കുന്ന ‘ഗൃഹം’ എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וְהִכְרַתִּי
  choice: ഞാൻ ഛേദിച്ചുകളയും
  rationale: כרת എന്ന ക്രിയയുടെ വിധിന്യായപരമായ ‘ഛേദിക്കുക, ഇല്ലാതാക്കുക’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: לְאַחְאָב
  choice: ആഹാബിന്റെ വംശത്തിൽപ്പെട്ട
  rationale: ഇവിടത്തെ לְ ബന്ധവും ഉടമസ്ഥതയും സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ആഹാബിന്റെ വംശത്തോടുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: מַשְׁתִּין בְּקִיר
  choice: സകല പുരുഷന്മാരെയും
  rationale: അക്ഷരാർഥത്തിൽ പരുഷമായ ഈ എബ്രായ ശൈലി പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു; മുഖ്യവാചകത്തിൽ അർഥം വ്യക്തമായി നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְעָצוּר וְעָזוּב
  choice: അടിമയെയും സ്വതന്ത്രനെയും
  rationale: എല്ലാ സാമൂഹിക നിലകളിലുള്ള പുരുഷന്മാരെയും ഉൾക്കൊള്ളുന്ന ദ്വന്ദ്വപ്രയോഗമായി വായിക്കുന്നു; എബ്രായ പദജോടിയുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: വിധി ബാധകമാകുന്ന സ്ഥലം സൂചിപ്പിക്കുന്ന പ്രയോഗമായി പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: രാജവംശത്തിനെതിരായ വിധിന്യായസൂത്രത്തിന്റെ പരിഭാഷ
  choice: ‘ആഹാബിന്റെ ഗൃഹം’ എന്നും ‘ഛേദിച്ചുകളയും’ എന്നും നിലനിർത്തി, പരുഷമായ പുരുഷസൂചക ശൈലി മുഖ്യവാചകത്തിൽ ‘സകല പുരുഷന്മാരെയും’ എന്നു നൽകി.
  alternative: ‘ആഹാബിന്റെ കുടുംബത്തെ പൂർണമായി തുടച്ചുനീക്കും’ എന്ന് മുഴുവനായി ആശയപരിഭാഷ ചെയ്യുക.
  rationale: തിരുവെഴുത്തിലെ രാജവംശീയ വിധിന്യായഭാഷയുടെ രൂപകവും ഗൗരവവും സംരക്ഷിക്കുമ്പോൾ സാധാരണ വായനക്കാർക്ക് അർഥം വ്യക്തമായി നൽകുന്നു.
- issue: וְעָצוּר וְעָזוּב എന്ന പദജോടിയുടെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘അടിമയെയും സ്വതന്ത്രനെയും’ എന്നു നൽകി, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘അടച്ചുവെക്കപ്പെട്ടവനെയും വിട്ടയക്കപ്പെട്ടവനെയും’ എന്ന് അക്ഷരാർഥത്തിൽ നൽകുക, അല്ലെങ്കിൽ ‘സംരക്ഷിക്കപ്പെട്ടവനെയും ഉപേക്ഷിക്കപ്പെട്ടവനെയും’ എന്ന് വായിക്കുക.
  rationale: സന്ദർഭത്തിൽ ഇത് ആരെയും ഒഴിവാക്കാത്ത സമഗ്രത സൂചിപ്പിക്കുന്ന ദ്വന്ദ്വപ്രയോഗമാണ്; എന്നാൽ കൃത്യമായ സാമൂഹിക വിഭാഗീകരണം എബ്രായത്തിൽ നിർവിവാദമല്ലാത്തതിനാൽ മറ്റുവായനകൾ മറച്ചുവെക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം; ‘ഗൃഹം’, ‘ഛേദിച്ചുകളയും’ എന്നീ പദങ്ങൾ രാജവംശീയ വിധിന്യായഭാഷയുടെ ബൈബിൾഗൗരവം നിലനിർത്തുന്നു. അവ്യക്തവും പരുഷവുമായ എബ്രായ പ്രയോഗങ്ങൾ വായനാസൗകര്യത്തിനായി മുഖ്യവാചകത്തിൽ അർഥപരമായി നൽകി, ഉറവിടരൂപവും അനിശ്ചിതത്വവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
