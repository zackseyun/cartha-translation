  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח רֹכֵ֣ב סוּס֮ שֵׁנִי֒ וַ/יָּבֹ֣א אֲלֵ/הֶ֔ם וַ/יֹּ֛אמֶר כֹּֽה אָמַ֥ר הַ/מֶּ֖לֶךְ שָׁל֑וֹם וַ/יֹּ֧אמֶר יֵה֛וּא מַה לְּ/ךָ֥ וּ/לְ/שָׁל֖וֹם סֹ֥ב אֶֽל אַחֲרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ രണ്ടാമത്തെ കുതിരസവാരിക്കാരനെ അയച്ചു. അവൻ അവരുടെ അടുക്കൽ വന്നു പറഞ്ഞു: “രാജാവ് ഇപ്രകാരം പറയുന്നു: ‘സമാധാനമാണോ?[a]’” എന്നാൽ യേഹു പറഞ്ഞു: “നിനക്ക് സമാധാനവുമായി എന്തു കാര്യം? തിരിഞ്ഞ് എന്റെ പിന്നാലെ വരിക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “എല്ലാം സുഖമാണോ?” ഹീബ്രു ‘ശാലോം’ എന്നതിന് സമാധാനം, ക്ഷേമം, സുഖസ്ഥിതി എന്നീ അർഥങ്ങളുണ്ടാകാം.
    reason: The note preserves the lexical range of שָׁלוֹם while the main text retains ‘സമാധാനം’ in both the king’s question and Jehu’s reply.
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  choice: കുതിരപ്പുറത്തുള്ള രണ്ടാമത്തെ ദൂതൻ
  rationale: അക്ഷരാർഥം ‘രണ്ടാമത്തെ കുതിരസവാരിക്കാരൻ’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ രാജാവിന്റെ സന്ദേശവുമായി അയയ്ക്കപ്പെട്ട ആളായതിനാൽ ‘ദൂതൻ’ ചേർക്കുന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്; ‘രണ്ടാമത്തെ’ എന്ന ക്രമസൂചന നിലനിർത്തുന്നു.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: രാജാവ് ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: രാജകീയ ദൂതസൂത്രത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്ന മാന്യവും പരിചിതവുമായ മലയാളപ്രയോഗം.
- source_word: שָׁלוֹם
  choice: സമാധാനം
  rationale: ഈ പദത്തിന് സമാധാനം, ക്ഷേമം, എല്ലാം സുഖമാണെന്ന അവസ്ഥ എന്നീ അർഥങ്ങളുണ്ട്. ചോദ്യം-മറുപടിയിലെ പദാവർത്തനം സംരക്ഷിക്കാൻ ‘സമാധാനം’ ഉപയോഗിച്ചു.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: നിനക്ക് സമാധാനവുമായി എന്തു കാര്യം?
  rationale: ദൂതന്റെ അന്വേഷണത്തെ തള്ളിക്കളയുന്ന ഹീബ്രു ശൈലിയുടെ നേരിട്ടുള്ളതും ഏറ്റുമുട്ടൽഭാവമുള്ളതുമായ മലയാളരൂപം; ‘സമാധാനം’ എന്ന ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: סֹב אֶל אַחֲרָי
  choice: തിരിഞ്ഞ് എന്റെ പിന്നാലെ നിൽക്കുക
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘തിരിയുക’ എന്നും ‘എന്റെ പിന്നിലേക്ക്’ എന്നും ഉള്ള ഘടകങ്ങൾ സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ദൂതൻ യേഹുവിന്റെ സംഘത്തിന്റെ പിന്നിൽ ചേരണമെന്ന നിർദേശം സൂചിപ്പിക്കുന്നതിനാൽ ‘നിൽക്കുക’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ സ്ഥാനനിർദേശം വ്യക്തമാക്കുന്നു; വെറും ‘എന്നെ അനുഗമിക്കുക’ എന്ന വിപുലീകരണം ഒഴിവാക്കുന്നു.
