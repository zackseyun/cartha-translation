translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. രാജകീയ സന്ദേശത്തിന് ഔപചാരികത നൽകിയപ്പോൾ യേഹുവിന്റെ മറുപടിയുടെ മൂർച്ചയും ഹീബ്രുവിലെ ‘സമാധാനം’ എന്ന പദാവർത്തനവും നിലനിർത്തി.
