  to: 'അപ്പോൾ അവൻ രണ്ടാമത്തെ കുതിരസവാരിക്കാരനെ അയച്ചു. അവൻ അവരുടെ അടുക്കൽ വന്നു പറഞ്ഞു: “രാജാവ് ഇപ്രകാരം പറയുന്നു: ‘സമാധാനമാണോ?[a]’” എന്നാൽ യേഹു പറഞ്ഞു: “നിനക്ക് സമാധാനവുമായി എന്തു കാര്യം? തിരിഞ്ഞ് എന്റെ പിന്നാലെ വരിക.”'
  rationale: The revision removes an unsupported role specification, uses contemporary formal Malayalam for the royal formula, and corrects the final command to express turning and going behind Jehu. It retains the Hebrew repetition of ‘peace’ and supplies a clearly anchored lexical-alternative note.
