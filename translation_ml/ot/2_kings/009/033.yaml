base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/033.yaml
  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അവളെ താഴേക്കു തള്ളിയിടുക!” അവർ അവളെ താഴേക്കു തള്ളിയിട്ടു. അവളുടെ രക്തത്തിൽ ചിലത് മതിലിന്മേലും കുതിരകളിന്മേലും തെറിച്ചു[a]; അവൻ അവളെ ചവിട്ടിമെതിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളുടെ രക്തം മതിലിന്മേലും കുതിരകളിന്മേലും തെറിച്ചു.” എബ്രായഭാഷയിൽ അക്ഷരാർഥമായി, “അവളുടെ രക്തത്തിൽനിന്ന് മതിലിലേക്കും കുതിരകളിലേക്കും തെറിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שמטהו / וישמטוה
  choice: “അവളെ താഴേക്ക് തള്ളിയിടുക!” / “അവർ അവളെ താഴേക്ക് തള്ളിയിട്ടു”
  rationale: ശמט എന്ന ഒരേ ധാതു കല്പനയിലും അതിന്റെ നിർവഹണത്തിലും ആവർത്തിക്കുന്നതിനാൽ, ആ ബന്ധം മലയാളത്തിലും ഒരേ ക്രിയ ഉപയോഗിച്ച് നിലനിർത്തുന്നു. ജനാലയിൽനിന്ന് ബലമായി താഴെയിടുന്ന സന്ദർഭത്തിന് ‘താഴേക്ക് തള്ളിയിടുക’ സ്വാഭാവികവും ശക്തവുമാണ്.
- source_word: ויז מדמה
  choice: അവളുടെ രക്തത്തിൽ കുറെ ... തെറിച്ചു
  rationale: מן ചേർന്ന ‘അവളുടെ രക്തം’ എന്ന പ്രയോഗത്തിന് ഇവിടെ ഭാഗികമായ അർഥമുണ്ട്; അതിനാൽ ‘രക്തത്തിൽ കുറെ’ എന്നു നൽകിയിരിക്കുന്നു. ויז സൂചിപ്പിക്കുന്ന ചിതറിത്തെറിക്കൽ ‘തെറിച്ചു’ എന്ന ക്രിയ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אל הקיר ואל הסוסים
  choice: മതിലിന്മേലും കുതിരകളിന്മേലും
  rationale: രക്തം ചെന്നുപതിച്ച ഉപരിതലങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻസർഗത്തിന്റെ സന്ദർഭാർഥം മലയാളത്തിലെ ‘-ന്മേൽ’ വഴി വ്യക്തമാക്കുന്നു; രണ്ട് ലക്ഷ്യങ്ങളുടെയും സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
- source_word: וירמסנה
  choice: അവൻ അവളെ ചവിട്ടിമെതിച്ചു
  rationale: רמס എന്നത് ചവിട്ടിമെതിക്കുക എന്നാണ്. ഏകവചന പുള്ളിംഗ ക്രിയാവിഷയം നിലനിർത്താൻ ‘അവൻ’ എന്നു നൽകിയിരിക്കുന്നു; കുതിരകളാണെന്ന് വ്യാകരണപരമായി മാറ്റിയിട്ടില്ല.
theological_decisions:
- issue: וירמסנה എന്ന ഏകവചന ക്രിയയുടെ കർത്താവ്
  choice: ‘അവൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി; സന്ദർഭത്തിൽ ഇത് യേഹൂവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘കുതിരകൾ അവളെ ചവിട്ടിമെതിച്ചു’ അല്ലെങ്കിൽ ‘അവർ അവളെ ചവിട്ടിമെതിച്ചു.’
  rationale: എബ്രായ ക്രിയ ഏകവചന പുള്ളിംഗത്തിലാണ്. അതിനാൽ കുതിരകളെയോ സംഘത്തെയോ വ്യാകരണകർത്താവാക്കി മാറ്റാതെ മൂലപാഠത്തിന്റെ രൂപവും അതിലുള്ള സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം ഉപയോഗിച്ചു. അക്രമത്തിന്റെ തീവ്രത മൃദൂകരിക്കാതെ ‘തള്ളിയിടുക’, ‘തെറിച്ചു’, ‘ചവിട്ടിമെതിച്ചു’ എന്നീ നേരിട്ടുള്ള പദങ്ങൾ തെരഞ്ഞെടുത്തു. മൂലപാഠത്തിലെ ആവർത്തനവും ഏകവചന കർത്താവും സംരക്ഷിച്ചു.
