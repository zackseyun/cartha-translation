source:
  edition: WLC
  text: וַ/יִּתְקַשֵּׁ֗ר יֵה֛וּא בֶּן יְהוֹשָׁפָ֥ט בֶּן נִמְשִׁ֖י אֶל יוֹרָ֑ם וְ/יוֹרָם֩ הָיָ֨ה שֹׁמֵ֜ר בְּ/רָמֹ֣ת גִּלְעָ֗ד ה֚וּא וְ/כָל יִשְׂרָאֵ֔ל מִ/פְּנֵ֥י חֲזָאֵ֖ל מֶֽלֶךְ אֲרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
translation:
  language: ml
  text: അങ്ങനെ, നിംശിയുടെ മകനായ യെഹോശാഫാത്തിന്റെ മകൻ യേഹൂ യോരാമിനെതിരെ ഗൂഢാലോചന നടത്തി. യോരാമും ഇസ്രായേൽ മുഴുവനും[b] അരാം[c]രാജാവായ ഹസായേൽ നിമിത്തം ഗിലെയാദിലെ രാമോത്തിൽ കാവൽ നിൽക്കുകയായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാവൽ നിൽക്കുകയായിരുന്നു’ എന്നതിനു പകരം ‘സംരക്ഷിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രു ക്രിയയ്ക്ക് സൈനികസന്ദർഭത്തിൽ കാക്കുക, കാവൽ നിൽക്കുക, സംരക്ഷിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ സൈനികസന്ദർഭത്തിൽ ‘ഇസ്രായേൽ മുഴുവനും’ എന്നത് ഇസ്രായേൽരാജ്യത്തെയോ അതിന്റെ സൈന്യത്തെയോ സൂചിപ്പിക്കുന്നു; ഹീബ്രുവിൽ അക്ഷരാർഥമായി ‘ഇസ്രായേൽ മുഴുവനും’ എന്നാണ്.
    reason: cultural_note
  - marker: c
    text: '‘അരാം’ എന്നതിന് പരമ്പരാഗതമായി ‘സിറിയ’ എന്നും ഉപയോഗിച്ചിട്ടുണ്ട്. ഹീബ്രു: ‘അരാം.’'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר
  choice: ഗൂഢാലോചന നടത്തി
  rationale: קשר എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ഇവിടെ രാജാവിനെതിരായ രാഷ്ട്രീയ ഗൂഢാലോചനയെയോ കലാപപദ്ധതിയെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഗൂഢാലോചന നടത്തി’ സ്വാഭാവികവും ശത്രുതാപരമായ രാഷ്ട്രീയ അർഥം വ്യക്തവുമാണ്.
- source_word: בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: നിംശിയുടെ മകനായ യെഹോശാഫാത്തിന്റെ മകൻ
  rationale: ആവർത്തിച്ചിരിക്കുന്ന בֶּן അടുത്ത പിതൃവംശബന്ധം വ്യക്തമാക്കുന്നു; അതിനാൽ രണ്ടു തലമുറകളും കൃത്യമായി നിലനിർത്തി.
- source_word: אֶל יוֹרָם
  choice: യോരാമിനെതിരെ
  rationale: קשר എന്ന ഗൂഢാലോചനാസന്ദർഭത്തിൽ אֶל പദ്ധതിയുടെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രതികൂലബന്ധം ‘എതിരെ’ എന്നു വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: הָיָה שֹׁמֵר
  choice: കാവൽ നിന്നുവരികയായിരുന്നു
  rationale: הָיָה + വർത്തമാനകൃദന്തം പശ്ചാത്തലത്തിൽ തുടർന്നിരുന്ന ഭൂതകാലപ്രവർത്തനം സൂചിപ്പിക്കുന്നു. ‘കാവൽ നിന്നുവരികയായിരുന്നു’ കാവൽ, നിരീക്ഷണം, സൈനിക പ്രതിരോധം എന്നീ സാധ്യതകളെ അമിതമായി ചുരുക്കാതെ നൽകുന്നു.
- source_word: בְּרָמֹת גִּלְעָד
  choice: ഗിലെയാദിലെ രാമോത്തിൽ
  rationale: സ്ഥലനാമത്തിലെ രണ്ടു ഘടകങ്ങളും നിലനിർത്തിക്കൊണ്ട്, ‘ഗിലെയാദിലെ രാമോത്ത്’ എന്നു മലയാളത്തിൽ സ്വാഭാവികമായ സ്ഥലബന്ധമായി അവതരിപ്പിച്ചു.
- source_word: הוּא וְכָל יִשְׂרָאֵל
  choice: യോരാമും ഇസ്രായേൽ മുഴുവനും
  rationale: ഹീബ്രുവിലെ ‘അവനും ഇസ്രായേൽ മുഴുവനും’ എന്ന ദേശീയപ്രയോഗം നിലനിർത്തി; മലയാളത്തിൽ സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘യോരാം’ ആവർത്തിച്ചു. സൈന്യത്തെ സൂചിപ്പിക്കാമെങ്കിലും മുഖ്യവാചകത്തിൽ അർഥം അതിലേക്കു മാത്രം ചുരുക്കിയില്ല.
- source_word: מִפְּנֵי
  choice: നിമിത്തം
  rationale: ഹസായേലിൽനിന്നുള്ള ഭീഷണിയാണ് കാവലിന്റെ കാരണമെന്ന് ഇവിടെ സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ കാരണബന്ധം സ്വാഭാവികമായി നൽകുന്നു; ‘ഭയന്ന്’ എന്നു പറഞ്ഞ് വികാരം അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: מֶלֶךְ אֲרָם
  choice: അരാംരാജാവായ ഹസായേൽ
  rationale: ചരിത്രപരമായി പിൽക്കാലത്തെ ‘സിറിയ’ എന്ന പേരിനു പകരം ഹീബ്രുവിലെ אֲרָם എന്ന ജനഭൂമിശാസ്ത്രനാമം ‘അരാം’ എന്നു നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രു വാക്യത്തിന്റെ പശ്ചാത്തലവിവരണ സ്വഭാവം തുടർച്ചാഭൂതകാലരൂപത്തിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പുകൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് തൊട്ടുപിന്നിൽ ചേർത്തു.
