  source_fidelity: 'മുഖ്യവാചകം ഹീബ്രു പാഠത്തിന്റെ അടിസ്ഥാനാർത്ഥം വിശ്വസ്തമായി നൽകുന്നു: യേഹൂവിന്റെ യോരാമിനെതിരായ ഗൂഢാലോചന, യെഹോശാഫാത്ത്–നിംശി വംശബന്ധം, രാമോത്ത്-ഗിലെയാദിലെ സൈനിക കാവൽ, ഹസായേലുമായി ബന്ധപ്പെട്ട കാരണം എന്നിവ നിലനിൽക്കുന്നു. എന്നാൽ ‘הָיָה שֹׁמֵר’ എന്ന പശ്ചാത്തല തുടർച്ചാഭൂതകാലത്തിന് ‘കാവൽ നിൽക്കുകയായിരുന്നു’ കൂടുതൽ നേരിട്ടതും അനാവശ്യമായ ‘നിന്നുവരിക’ എന്ന ദീർഘകാല സൂചന ഒഴിവാക്കുന്നതുമാണ്.'
  naturalness: ‘കാവൽ നിന്നുവരികയായിരുന്നു’ എന്ന പ്രയോഗം ഈ സന്ദർഭത്തിൽ അല്പം ഭാരമുള്ളതും സൂചിപ്പിക്കാത്ത ദീർഘകാല തുടർച്ച ഉണർത്തുന്നതുമാണ്. ‘കാവൽ നിൽക്കുകയായിരുന്നു’ ആധുനിക പ്രമാണമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘അരാം’ എന്ന പദത്തെ വിശദീകരിക്കുന്ന അടിക്കുറിപ്പിന്റെ ചിഹ്നം അതിനോട് നേരിട്ട് ചേർക്കണം.
