  to: 'യിസ്രെയേലിലെ ഗോപുരത്തിന്മേൽ കാവൽക്കാരൻ നിൽക്കുന്നുണ്ടായിരുന്നു. യേഹൂ അടുത്തുവരുമ്പോൾ, കാവൽക്കാരൻ യേഹൂവിന്റെ സംഘത്തെ കണ്ടു പറഞ്ഞു: “ഞാൻ ഒരു സംഘം വരുന്നതു കാണുന്നു.” അപ്പോൾ യെഹോരാം പറഞ്ഞു: “ഒരു കുതിരസവാരിക്കാരനെ തിരഞ്ഞെടുത്ത് അവരെ എതിരേൽക്കാൻ അയയ്ക്കുക; അവൻ, ‘സമാധാനമാണോ?’[a] എന്നു ചോദിക്കട്ടെ.”'
