source:
  edition: WLC
  text: וְ/הַ/צֹּפֶה֩ עֹמֵ֨ד עַֽל הַ/מִּגְדָּ֜ל בְּ/יִזְרְעֶ֗אל וַ/יַּ֞רְא אֶת שִׁפְעַ֤ת יֵהוּא֙ בְּ/בֹא֔/וֹ וַ/יֹּ֕אמֶר שִׁפְעַ֖ת אֲנִ֣י רֹאֶ֑ה וַ/יֹּ֣אמֶר יְהוֹרָ֗ם קַ֥ח רַכָּ֛ב וּֽ/שְׁלַ֥ח לִ/קְרָאתָ֖/ם וְ/יֹאמַ֥ר הֲ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/017.yaml
  text: The watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
translation:
  language: ml
  text: 'യിസ്രെയേലിലെ ഗോപുരത്തിന്മേൽ കാവൽക്കാരൻ നിൽക്കുന്നുണ്ടായിരുന്നു. യേഹൂ അടുത്തുവരുമ്പോൾ, കാവൽക്കാരൻ യേഹൂവിന്റെ സംഘത്തെ കണ്ടു പറഞ്ഞു: “ഞാൻ ഒരു സംഘം വരുന്നതു കാണുന്നു.” അപ്പോൾ യെഹോരാം പറഞ്ഞു: “ഒരു കുതിരസവാരിക്കാരനെ തിരഞ്ഞെടുത്ത് അവരെ എതിരേൽക്കാൻ അയയ്ക്കുക; അവൻ, ‘സമാധാനമാണോ?’[a] എന്നു ചോദിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യവഹാരികമായി: “എല്ലാം സുഖമാണോ?”'
    reason: הֲשָׁלוֹם എന്ന സംക്ഷിപ്ത ചോദ്യം ക്ഷേമത്തെയോ സമാധാനപരമായ ഉദ്ദേശ്യത്തെയോ അന്വേഷിക്കാം. പ്രധാനപാഠം ഈ ഭാഗത്ത് ആവർത്തിക്കുന്ന ‘സമാധാനം’ എന്ന പദം നിലനിർത്തുന്നു; കുറിപ്പ് സ്വാഭാവികമായ മറ്റൊരു വായന നൽകുന്നു.
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: കാവൽക്കാരൻ
  rationale: ഗോപുരത്തിൽനിന്ന് നിരീക്ഷിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപദം; ഇവിടെ പ്രവാചകസൂചന ചേർക്കുന്നില്ല.
- source_word: עֹמֵד
  choice: നിൽക്കുന്നുണ്ടായിരുന്നു
  rationale: എബ്രായ പങ്കാളിത്തരൂപത്തിന്റെ തുടർന്നുകൊണ്ടിരുന്ന പശ്ചാത്തലഭാവം നിലനിർത്തുന്നു.
- source_word: הַמִּגְדָּל
  choice: ഗോപുരം
  rationale: മൂലപദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ഗോപുരം’ ആണ്; സന്ദർഭത്തിൽ കാവൽഗോപുരമാണെങ്കിലും ആ വിശദീകരണം പദത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- source_word: בְּיִזְרְעֶאל
  choice: യിസ്രെയേലിൽ
  rationale: സ്ഥലനാമത്തിന്റെ സാധാരണ മലയാള ലിപ്യന്തരണം.
- source_word: שִׁפְעַת
  choice: സംഘം
  rationale: അടുത്തുവരുന്ന ആളുകളുടെ ദൃശ്യമായ കൂട്ടത്തെ സൈനികസന്ദർഭത്തിന് അനുയോജ്യമായി സൂചിപ്പിക്കുന്നു; വലിപ്പം അതിശയിപ്പിക്കുന്നില്ല.
- source_word: יֵהוּא
  choice: യേഹൂ
  rationale: വ്യക്തിനാമത്തിന്റെ സാധാരണ മലയാള ലിപ്യന്തരണം.
- source_word: בְּבֹאוֹ
  choice: യേഹൂ അടുത്തുവരുമ്പോൾ
  rationale: യേഹൂവിന്റെ സമീപനത്തോടൊപ്പമുള്ള സമയബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שִׁפְעַת אֲנִי רֹאֶה
  choice: ഞാൻ ഒരു സംഘം വരുന്നതു കാണുന്നു
  rationale: ശִׁפְעַת എന്ന പദത്തിന്റെ ആവർത്തനം ‘സംഘം’ എന്നു നിലനിർത്തുന്നു; ദൃശ്യസാഹചര്യത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ്.
- source_word: קַח רַכָּב
  choice: ഒരു കുതിരപ്പടയാളിയെ അയയ്ക്കുക
  rationale: רַכָּב എന്ന ഏകവചനം ഇവിടെ കുതിരപ്പുറത്ത് പോകുന്ന ഒരൊറ്റ ദൂതനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കല്പനയുടെ പ്രായോഗിക ഉദ്ദേശ്യം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וּשְׁלַח לִקְרָאתָם
  choice: അവൻ അവരെ എതിരേറ്റുചെന്ന്
  rationale: മസോററ്റിക് പാഠത്തിലെ ബഹുവചനപ്രത്യയം അനുസരിച്ച് ‘അവരെ’ നിലനിർത്തുന്നു; കാണപ്പെട്ട സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְיֹאמַר
  choice: എന്നു ചോദിക്കട്ടെ
  rationale: കല്പനയെ തുടർന്നുള്ള ജസ്സീവ് ഭാവം മലയാളത്തിലെ പരോക്ഷ കല്പനയായി സ്വാഭാവികമായി നൽകുന്നു; ചോദ്യം പറയുക എന്ന സാഹചര്യാർഥവും വ്യക്തമാകുന്നു.
- source_word: הֲשָׁלוֹם
  choice: സമാധാനമാണോ?
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ ‘സമാധാനം?’ എന്ന ചോദ്യം, ഈ ഭാഗത്തിലെ ആവർത്തിത സമാധാനപ്രമേയം സഹിതം, കഴിയുന്നത്ര ചുരുക്കമായി നിലനിർത്തുന്നു.
