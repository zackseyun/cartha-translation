source:
  edition: WLC
  text: וַ/יָּב֥וֹא יֵה֖וּא יִזְרְעֶ֑אלָ/ה וְ/אִיזֶ֣בֶל שָׁמְעָ֗ה וַ/תָּ֨שֶׂם בַּ/פּ֤וּךְ עֵינֶ֨י/הָ֙ וַ/תֵּ֣יטֶב אֶת רֹאשָׁ֔/הּ וַ/תַּשְׁקֵ֖ף בְּעַ֥ד הַ/חַלּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/030.yaml
  text: When Jehu came to Jezreel[a], Jezebel heard of it. She painted her eyes with kohl, adorned her head[b], and looked out through the window.
translation:
  language: ml
  text: യേഹൂ യിസ്രെയേലിലേക്കു വന്നു; ഈസേബെൽ അതു കേട്ടു. അവൾ കണ്ണുകളിൽ കൺമഷി പുരട്ടി[a], തല അലങ്കരിച്ച്[b] ജനലിലൂടെ പുറത്തേക്കു നോക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവൾ തന്റെ കണ്ണുകളിൽ കൺമഷി വെച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: ‘മുടി ഒതുക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘തന്റെ തലയെ നല്ലതാക്കി/ഭംഗിയാക്കി’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא יֵהוּא יִזְרְעֶאלָה
  choice: യേഹൂ യിസ്രെയേലിൽ എത്തിയപ്പോൾ
  rationale: ദിശാസൂചകമായ ־ָה യിസ്രെയേലിലേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിന് ‘യിസ്രെയേലിൽ എത്തി’ എന്നു നൽകി; സമയബന്ധം ‘എത്തിയപ്പോൾ’ എന്നതിലൂടെ പ്രകടമാക്കി.
- source_word: וְאִיזֶבֶל שָׁמְעָה
  choice: ഈസബെൽ അതു കേട്ടു
  rationale: שׁמע എന്ന ക്രിയയുടെ കർമം മൂലപാഠത്തിൽ പരോക്ഷമാണ്; മുൻവാക്യത്തിലെ യേഹൂവിന്റെ വരവിനെയാണ് ‘അതു’ സൂചിപ്പിക്കുന്നത്. ഇതു മലയാളത്തിൽ സ്വാഭാവികവും അധിക വിവരം ചേർക്കാത്തതുമാണ്.
- source_word: וַתָּשֶׂם בַּפּוּךְ עֵינֶיהָ
  choice: അവൾ കണ്ണുകളിൽ കൺമഷി പുരട്ടി
  rationale: פּוּךְ കണ്ണുകളിൽ ഉപയോഗിച്ചിരുന്ന ഇരുണ്ട സൗന്ദര്യവർധക വസ്തുവാണ്. ‘കൺമഷി’ ആ പ്രയോഗത്തെ സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ശരീരത്തിന്റെ മറ്റുഭാഗം ചായം പൂശിയെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: וַתֵּיטֶב אֶת־רֹאשָׁהּ
  choice: തല അലങ്കരിച്ച്
  rationale: പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘തന്റെ തലയെ നല്ലതാക്കി/ഭംഗിയാക്കി’ എന്നാണ്. മുടി മാത്രം എന്നു അനാവശ്യമായി ചുരുക്കാതെ, ശിരസ്സിന്റെ ഒരുക്കമോ അലങ്കാരമോ ഉൾക്കൊള്ളുന്ന വിശാലത നിലനിർത്തുന്നു.
- source_word: וַתַּשְׁקֵף בְּעַד הַחַלּוֹן
  choice: ജനലിലൂടെ പുറത്തേക്കു നോക്കി
  rationale: שׁקף ഇവിടെ ഉയർന്ന തുറവിൽനിന്ന് പുറത്തേക്കു നോക്കുന്നതും בְּעַד ആ തുറവിലൂടെ നോക്കുന്നതും സൂചിപ്പിക്കുന്നു. ഈ സ്ഥലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു.
