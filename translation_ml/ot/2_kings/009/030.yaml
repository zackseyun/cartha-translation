translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കൺമഷി’ പൊതുവായ വായനക്കാർക്കു മനസ്സിലാകുന്നതും പുരാതന സൗന്ദര്യവർധക പ്രയോഗം വ്യക്തമാക്കുന്നതുമാണ്. പേരുകൾ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ‘യേഹൂ’, ‘യിസ്രെയേൽ’, ‘ഈസബെൽ’ എന്ന രൂപങ്ങളിൽ നൽകി.
