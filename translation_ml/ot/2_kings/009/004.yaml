  yaml_path: translation/ot/2_kings/009/004.yaml
  text: So the young man, the young prophet, went to Ramoth-gilead.
translation:
  language: ml
  text: അങ്ങനെ ആ യുവാവ്—ആ യുവപ്രവാചകൻ[a]—രാമോത്ത്-ഗിലെയാദിലേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം ‘യുവാവ്’ എന്ന പദം ഊന്നലോടെ ആവർത്തിക്കുന്നു: ‘ആ യുവാവ്, ആ യുവപ്രവാചകൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അങ്ങനെ ... പോയി
  rationale: വാവ്-തുടർച്ചാക്രിയ ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അങ്ങനെ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ ക്രമബന്ധം നിലനിർത്തുന്നു.
- source_word: הַנַּעַר
  choice: ആ യുവാവ്
  rationale: נַעַר ഇവിടെ എലീശാ അയച്ച യുവാവിനെ സൂചിപ്പിക്കുന്നു; ‘യുവാവ്’ പ്രായസൂചന നിലനിർത്തുകയും അനാവശ്യമായി ‘ദാസൻ’ എന്ന പദവി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַנַּעַר הַנָּבִיא
  choice: ആ യുവാവ്—ആ യുവപ്രവാചകൻ
  rationale: എബ്രായത്തിലെ ആവർത്തനവും അനുബന്ധമായി വരുന്ന הַנָּבִיא എന്ന വിശേഷണപരമായ തിരിച്ചറിയലും നിലനിർത്തുന്നു. ‘പ്രവാചകന്റെ ദാസൻ’ എന്ന് വിവർത്തനം ചെയ്യുന്നത് മൂലപാഠത്തിലെ വ്യാകരണരൂപത്തിൽ നേരിട്ട് ഇല്ലാത്ത ഉടമസ്ഥബന്ധം ചേർക്കും.
- source_word: רָמֹת גִּלְעָד
  choice: ഗിലെയാദിലെ രാമോത്ത്
  rationale: സംയുക്ത സ്ഥലനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികവും തിരിച്ചറിയാവുന്നതുമായ ഭൂമിശാസ്ത്രരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യുവാവ് തന്നെയോ പ്രവാചകൻ, അതോ പ്രവാചകന്റെ ദാസനോ എന്ന തിരിച്ചറിയൽ
  choice: ആ യുവപ്രവാചകൻ
  alternative: പ്രവാചകന്റെ ദാസനായ യുവാവ്
  rationale: ഹീബ്രു പാഠത്തിൽ ‘പ്രവാചകന്റെ’ എന്ന ഉടമസ്ഥസംബന്ധം വ്യക്തമാക്കുന്ന രൂപമില്ല; הַנָּבִיא നിർദേശകാംഗത്തോടുകൂടി അനുബന്ധമായി നിൽക്കുന്നു. അതിനാൽ യുവാവിനെ പ്രവാചകനായി തിരിച്ചറിയുന്ന വായന മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അവനെ വെറും ദാസനായി നിർവചിക്കുന്ന വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഡാഷുകൾ എബ്രായത്തിലെ ആവർത്തന-അനുബന്ധ ഘടന വായനാസൗകര്യത്തോടെ പ്രകടമാക്കുന്നു; അടിക്കുറിപ്പുസൂചിക മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
