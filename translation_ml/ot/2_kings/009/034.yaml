language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֖א וַ/יֹּ֣אכַל וַ/יֵּ֑שְׁתְּ וַ/יֹּ֗אמֶר פִּקְדוּ נָ֞א אֶת הָ/אֲרוּרָ֤ה הַ/זֹּאת֙ וְ/קִבְר֔וּ/הָ כִּ֥י בַת מֶ֖לֶךְ הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/034.yaml
  text: Then he went in and ate and drank[a], and he said, “Please see to this cursed woman and bury her, for she is a king’s daughter.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ അകത്തു ചെന്നു ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തു. അവൻ പറഞ്ഞു: “ദയവായി, ഈ ശപിക്കപ്പെട്ട സ്ത്രീയെ നോക്കി അവളെ അടക്കം ചെയ്യുവിൻ; കാരണം അവൾ ഒരു രാജാവിന്റെ മകളാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അവൻ അകത്തു ചെന്നു
  rationale: സന്ദർഭത്തിൽ യേഹൂ കൊട്ടാരത്തിനകത്തേക്കു പോകുന്നതാണ് സൂചന. ‘അകത്തു ചെന്നു’ ദിശാബോധവും സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയും നിലനിർത്തുന്നു.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തു
  rationale: എബ്രായത്തിൽ ഭക്ഷണത്തിന്റെയോ പാനീയത്തിന്റെയോ കർമം പ്രത്യേകം നൽകിയിട്ടില്ല; അതിനാൽ ഒന്നും കൂട്ടിച്ചേർക്കാതെ രണ്ടു ക്രിയകളും നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: פִּקְדוּ נָא
  choice: ദയവായി … കാര്യം നോക്കി
  rationale: פקד ഇവിടെ ഒരാളുടെ അവസ്ഥ ശ്രദ്ധിച്ച് ആവശ്യമായ നടപടി കൈക്കൊള്ളുക എന്ന അർഥത്തിലാണ്. נָא നൽകുന്ന അഭ്യർഥനാഭാവം ‘ദയവായി’ എന്നു പ്രകടമാക്കി; ബഹുവചന ആജ്ഞയുടെ സ്വരം തുടർന്നുള്ള ‘അടക്കം ചെയ്യുക’ എന്നതിലും നിലനിൽക്കുന്നു.
- source_word: הָאֲרוּרָה הַזֹּאת
  choice: ശപിക്കപ്പെട്ട ഈ സ്ത്രീയുടെ
  rationale: സ്ത്രീലിംഗ ഏകവചന രൂപം ഈസബെലിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിനായി ‘സ്ത്രീ’ വ്യക്തമാക്കി; എബ്രായത്തിലെ വിശേഷണം നാമമായി വായിക്കാവുന്നതിനാൽ അതിന്റെ കൂടുതൽ രൂപസമീപമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וְקִבְרוּהָ
  choice: അവളെ അടക്കം ചെയ്യുക
  rationale: മൂന്നാം പുരുഷ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയമുള്ള നേരിട്ടുള്ള ആജ്ഞയെ ലളിതവും വ്യക്തവുമായി പരിഭാഷപ്പെടുത്തി.
- source_word: כִּי בַת מֶלֶךְ הִיא
  choice: കാരണം അവൾ ഒരു രാജാവിന്റെ മകളാണ്
  rationale: כִּי ഇവിടെ അടക്കം ചെയ്യാനുള്ള കാരണം നൽകുന്നു. നിർദ്ദിഷ്ട രാജാവിനെ വാചകത്തിൽ തിരിച്ചറിയിക്കാതെ രാജകീയ പദവി സൂചിപ്പിക്കുന്ന അനിശ്ചിത പ്രയോഗം ‘ഒരു രാജാവിന്റെ മകൾ’ എന്നു സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. രാജകീയ പദവിയും കഠിനമായ ‘ശപിക്കപ്പെട്ട’ എന്ന വിശേഷണവും മൃദൂകരിക്കാതെ നിലനിർത്തി; എന്നാൽ പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
