  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּלְכ֖וּ לְ/קָבְרָ֑/הּ וְ/לֹא מָ֣צְאוּ בָ֗/הּ כִּ֧י אִם הַ/גֻּלְגֹּ֛לֶת וְ/הָ/רַגְלַ֖יִם וְ/כַפּ֥וֹת הַ/יָּדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
translation:
  language: ml
  text: അങ്ങനെ അവർ അവളെ അടക്കം ചെയ്യാൻ പോയി; എന്നാൽ അവളുടെ തലയോട്ടിയും പാദങ്ങളും കൈപ്പത്തികളും അല്ലാതെ മറ്റൊന്നും കണ്ടെത്തിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവർ അവളിൽ തലയോട്ടിയും പാദങ്ങളും കൈപ്പത്തികളും അല്ലാതെ മറ്റൊന്നും കണ്ടെത്തിയില്ല.’ ഇവിടെ ‘അവളിൽ’ എന്ന ഹീബ്രു പ്രയോഗം അവളുടെ ശരീരത്തിൽ ശേഷിച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്ന ഭാഷാശൈലിയാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: അങ്ങനെ അവർ പോയി
  rationale: വയ്യക്ഷരൂപം ആഖ്യാനത്തിലെ തുടർച്ചയും മുൻസംഭവത്തിന്റെ ഫലമായ നീക്കവും സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെ’ സ്വാഭാവികമായി അത് പ്രകടിപ്പിക്കുന്നു.
- source_word: לְקָבְרָהּ
  choice: അവളെ അടക്കംചെയ്യാൻ
  rationale: קבר എന്ന ക്രിയയുടെ infinitive construct-ഉം മൂന്നാംപുരുഷ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയവും ഈസബെലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא מָצְאוּ בָהּ
  choice: അവളുടെ ... അല്ലാതെ മറ്റൊന്നും കണ്ടെത്തിയില്ല
  rationale: അക്ഷരാർഥത്തിലെ ‘അവളിൽ കണ്ടെത്തിയില്ല’ എന്ന പ്രയോഗം സന്ദർഭത്തിൽ അവളുടെ ശരീരത്തിൽ ശേഷിച്ചതിനെ കുറിച്ചുള്ള ഹീബ്രു ഭാഷാശൈലിയാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി ഘടന പുനഃക്രമീകരിച്ചു.
- source_word: כִּי אִם
  choice: അല്ലാതെ
  rationale: ഈ സംയുക്തപ്രയോഗം ഒഴിവാക്കൽ/വ്യത്യാസം സൂചിപ്പിക്കുന്നു; നിഷേധവാക്യത്തോടൊപ്പം ‘അല്ലാതെ’ സ്വാഭാവികമാണ്.
- source_word: הַגֻּלְגֹּלֶת
  choice: തലയോട്ടി
  rationale: גֻּלְגֹּלֶת ഇവിടെ മുഴുവൻ തലയെയല്ല, ശരീരാവശിഷ്ടമായ skull-നെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהָרַגְלַיִם
  choice: കാലുകൾ
  rationale: רַגְלַיִם എന്ന ദ്വിവചനരൂപത്തിന്റെ നേരിട്ടുള്ള ശരീരാവയവാർഥം മലയാളത്തിലെ ‘കാലുകൾ’ ആണ്.
- source_word: וְכַפּוֹת הַיָּדָיִם
  choice: കൈപ്പത്തികൾ
  rationale: כַּפּוֹת הַיָּדַיִם കൈകളുടെ ഉള്ളങ്കൈ/പത്തി ഭാഗത്തെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു; ‘കൈപ്പത്തികൾ’ ആ പ്രത്യേകത നിലനിർത്തുന്നു.
