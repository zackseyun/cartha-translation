translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ശരീരാവയവങ്ങളുടെ കൃത്യവും കടുപ്പമുള്ളതുമായ വിവരണം മയപ്പെടുത്താതെ നിലനിർത്തി; അക്ഷരാർഥത്തിലുള്ള ‘അവളിൽ’ എന്ന ഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
