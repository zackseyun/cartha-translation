id: 2KI.9.37
reference: 2 Kings 9:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ו/הית נִבְלַ֣ת אִיזֶ֗בֶל כְּ/דֹ֛מֶן עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה בְּ/חֵ֣לֶק יִזְרְעֶ֑אל אֲשֶׁ֥ר לֹֽא יֹאמְר֖וּ זֹ֥את אִיזָֽבֶל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
translation:
  language: ml
  text: ഈസബേലിന്റെ ശവം യിസ്രെയേൽ പ്രദേശത്തെ[a] വയലിന്റെ മീതെ ചാണകംപോലെയായിരിക്കും; അങ്ങനെ, ‘ഇതാണ് ഈസബേൽ’ എന്ന് ആരും പറയുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യിസ്രെയേലിലെ ഭൂവിഭാഗത്ത്.” എബ്രായത്തിലെ חֵלֶק എന്ന പദത്തിന് ഒരു നിർദ്ദിഷ്ട ഭൂഭാഗത്തെയോ സ്ഥലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ആകും
  rationale: മുൻ പ്രവചനവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ, സംയോജകത്തോടുകൂടിയ ഖാൽ പൂർണ്ണക്രിയ ഇവിടെ ഭാവികാലാർത്ഥം നൽകുന്നു.
- source_word: נִבְלַת אִיזֶבֶל
  choice: ഈസബേലിന്റെ ശവം
  rationale: נְבֵלָה എന്നത് മരിച്ച ശരീരത്തെ സൂചിപ്പിക്കുന്നു; ‘ശവം’ നേരിട്ടും സ്വാഭാവികമായും അതിന്റെ ഭീകരത നിലനിർത്തുന്നു.
- source_word: כְּדֹמֶן
  choice: ചാണകംപോലെ
  rationale: דֹּמֶן ചാണകത്തെയോ വളമായി ഉപയോഗിക്കുന്ന മൃഗവിസർജ്യത്തെയോ സൂചിപ്പിക്കുന്നു; ഉപമയുടെ നിന്ദ്യവും ദൃശ്യവുമായ ശക്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: വയലിന്റെ ഉപരിതലത്തിൽ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘വയലിന്റെ മുഖത്ത്’ എന്ന സ്ഥലചിത്രം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഉപരിതലത്തിൽ’ എന്നു നൽകി.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: യിസ്രെയേൽ പ്രദേശത്ത്
  rationale: חֵלֶק ഒരു വിഹിതം, ഭൂഭാഗം, അല്ലെങ്കിൽ പ്രത്യേക സ്ഥലം എന്നൊക്കെ അർഥമാക്കാം; മുഖ്യപാഠത്തിൽ വിശാലമായ ‘പ്രദേശം’ സ്വീകരിച്ച് കൂടുതൽ നിർദ്ദിഷ്ടമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: אֲשֶׁר לֹא יֹאמְרוּ
  choice: അതുകൊണ്ട് ... ആരും പറയുകയില്ല
  rationale: 'ഇവിടെ ബന്ധകപദം ഫലത്തെ അവതരിപ്പിക്കുന്നു: അവളുടെ അവശിഷ്ടങ്ങൾ തിരിച്ചറിയാനാകാത്ത അവസ്ഥയിലാകും. ഹീബ്രുവിലെ അനിശ്ചിത ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആരും’ എന്നു നൽകി.'
- source_word: זֹאת אִיזָבֶל
  choice: ഇതാണ് ഈസബേൽ
  rationale: ലളിതമായ ചൂണ്ടിക്കാണിച്ചുള്ള തിരിച്ചറിയൽപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ കടുത്ത ‘ചാണകം’ എന്ന ദൃശ്യപ്രയോഗവും തിരിച്ചറിയാനാവാത്തതിന്റെ ഫലവും മൃദൂകരിക്കാതെ നിലനിർത്തി.
