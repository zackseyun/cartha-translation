  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֵה֖וּא בָּ֣א בַ/שָּׁ֑עַר וַ/תֹּ֣אמֶר הֲ/שָׁל֔וֹם זִמְרִ֖י הֹרֵ֥ג אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
translation:
  language: ml
  text: 'യേഹൂ കവാടത്തിൽ പ്രവേശിച്ചപ്പോൾ അവൾ പറഞ്ഞു: “സമാധാനമാണോ?[b] സ്വന്തം യജമാനനെ കൊന്ന സിമ്രിയേ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈസബെൽ യേഹൂവിനെ പരിഹസിച്ചുകൊണ്ട് ‘സിമ്രി’ എന്നു വിളിക്കുന്നു. തന്റെ യജമാനനെ കൊന്ന് രാജാധികാരം പിടിച്ചെടുത്ത സിമ്രിയോടാണ് അവൾ യേഹൂവിനെ താരതമ്യം ചെയ്യുന്നത് (1 രാജാക്കന്മാർ 16:9–20 കാണുക).
    reason: cross_reference
  - marker: b
    text: അഥവാ, “എല്ലാം സുഖമാണോ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  choice: കവാടത്തിലേക്കു വന്നപ്പോൾ
  rationale: בּוֹא എന്ന ക്രിയയ്ക്ക് ‘വരുക/പ്രവേശിക്കുക’ എന്നും שַׁעַר എന്നതിന് ‘കവാടം’ എന്നും അർഥമുണ്ട്. ചലനത്തിന്റെ ദിശ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മൂലത്തിലെ ലളിതമായ ‘കവാടം’ നിലനിർത്തുന്നു.
- source_word: וַתֹּאמֶר
  choice: അവൾ പറഞ്ഞു
  rationale: സ്ത്രീലിംഗ ഏകവചന ക്രിയ സന്ദർഭത്തിലെ ഈസബെലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തൃപ്രയോഗം.
- source_word: הֲשָׁלוֹם
  choice: സമാധാനമാണോ?
  rationale: שָׁלוֹם ഇവിടെ സമാധാനം, ക്ഷേമം, കാര്യങ്ങൾ നന്നായിരിക്കൽ എന്നിവയെ ഉൾക്കൊള്ളുന്ന ചുരുക്കചോദ്യമാണ്. ‘സമാധാനമാണോ?’ അതിന്റെ മൂർച്ചയും യഥാർഥമായ അർഥവ്യാപ്തിയും പരമാവധി നിലനിർത്തുന്നു.
- source_word: זִמְרִי
  choice: സിമ്രിയേ
  rationale: പേര് മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുകയും സംബോധനരൂപം ഉപയോഗിക്കുകയും ചെയ്തു. ഇവിടെ ഈസബെൽ യേഹൂവിനെ സിമ്രിയോടു പരിഹാസപൂർവം താരതമ്യം ചെയ്യുന്നു.
- source_word: הֹרֵג אֲדֹנָיו
  choice: യജമാനനെ കൊന്ന
  rationale: ഹീബ്രു വാചകം അക്ഷരാർഥത്തിൽ ‘തന്റെ യജമാനന്റെ കൊലയാളി’ എന്നാണ്. മലയാളത്തിലെ സ്വാഭാവിക സംബോധനയിൽ ‘യജമാനനെ കൊന്ന’ എന്നത് ആരോപണത്തിന്റെ ശക്തി നിലനിർത്തുകയും അനാവശ്യമായ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘സിമ്രി, തന്റെ യജമാനനെ കൊന്നവൻ’ എന്ന സംബോധനയുടെ വ്യാഖ്യാനം
  choice: യേഹൂവിന് സിമ്രി എന്നു യഥാർഥത്തിൽ പേരിടുന്നതല്ല, മുൻകാല രാജഹന്താവും സിംഹാസനാപഹർത്താവുമായ സിമ്രിയോടു താരതമ്യം ചെയ്യുന്ന പരിഹാസമായി വിവർത്തനം ചെയ്തു.
  alternative: 'അർഥസൂചന നൽകാതെ കൂടുതൽ പദാനുപദമായി: ‘സമാധാനമാണോ, സിമ്രിയേ, തന്റെ യജമാനന്റെ കൊലയാളിയേ?’'
  rationale: ഹീബ്രുവിലെ സമാനാധികരണപ്രയോഗവും 1 രാജാക്കന്മാർ 16:9–20-ലെ പശ്ചാത്തലവും പരിഹാസപരമായ താരതമ്യത്തെ പിന്തുണയ്ക്കുന്നു. വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ചുരുക്കവും പരിഹാസത്തിന്റെ മൂർച്ചയും നിലനിർത്തി. ‘സമാധാനം’ എന്ന പദത്തിന്റെ സമാധാനം/ക്ഷേമം എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിലെ സ്വാഭാവിക പകരംവായനയോടൊപ്പം സംരക്ഷിച്ചു.
