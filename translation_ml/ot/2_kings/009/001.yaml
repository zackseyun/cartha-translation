  variant: modern standard Malayalam
source:
  edition: WLC
  text: וֶ/אֱלִישָׁע֙ הַ/נָּבִ֔יא קָרָ֕א לְ/אַחַ֖ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים וַ/יֹּ֨אמֶר ל֜/וֹ חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ֠/קַח פַּ֣ךְ הַ/שֶּׁ֤מֶן הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וְ/לֵ֖ךְ רָמֹ֥ת גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
translation:
  language: ml
  text: 'അപ്പോൾ എലീശാ പ്രവാചകൻ പ്രവാചകസംഘത്തിലെ ഒരാളെ[b] വിളിച്ച് അവനോടു പറഞ്ഞു: “വസ്ത്രം അരയിൽ മുറുക്കിക്കെട്ടുക[a]; ഈ എണ്ണക്കുപ്പി കൈയിലെടുത്ത് ഗിലെയാദിലെ രാമോത്തിലേക്കു പോകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിന്റെ അര കെട്ടുക.” നീണ്ട വസ്ത്രം അരയിൽ ഒതുക്കിക്കെട്ടി പ്രവർത്തിക്കാനോ യാത്രയ്ക്കോ ഒരുങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം “പ്രവാചകന്മാരുടെ പുത്രന്മാരിൽ ഒരാൾ.” ഇത് ജൈവപുത്രനെ നിർബന്ധമായി സൂചിപ്പിക്കാതെ ഒരു പ്രവാചകസംഘത്തിലെ അംഗത്തെയോ ശിഷ്യനെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וֶאֱלִישָׁע הַנָּבִיא
  choice: അപ്പോൾ എലീശാ പ്രവാചകൻ
  rationale: വാവിന്റെ ആഖ്യാനതുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു; പദവിനാമം വ്യക്തിനാമത്തോടുള്ള സമാനാധികരണമായി നിലനിർത്തി.
- source_word: קָרָא לְאַחַד מִבְּנֵי הַנְּבִיאִים
  choice: പ്രവാചകസംഘത്തിലെ ഒരാളെ വിളിച്ച്
  rationale: ‘പ്രവാചകന്മാരുടെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗം ജൈവപുത്രന്മാരെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല; ആധുനിക വായനക്കാരന് ഉദ്ദേശ്യം വ്യക്തമാകാൻ പ്രവാചകസമൂഹത്തിലെ അംഗം എന്ന അർത്ഥം മുഖ്യവാചകത്തിൽ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: חֲגֹר מָתְנֶיךָ
  choice: വസ്ത്രം അരയിൽ മുറുക്കിക്കെട്ടുക
  rationale: യാത്രയ്ക്കോ പ്രവർത്തനത്തിനോ ഒരുങ്ങാൻ നീണ്ട വസ്ത്രം അരയിൽ കെട്ടുന്ന ദൃശ്യവും ആജ്ഞയുടെ പ്രായോഗിക അർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: פַּךְ הַשֶּׁמֶן הַזֶּה
  choice: ഈ എണ്ണക്കുപ്പി
  rationale: פַּךְ എണ്ണ സൂക്ഷിക്കുന്ന ചെറിയ പാത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘എണ്ണക്കുപ്പി’ സാധാരണ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: בְּיָדֶךָ
  choice: കൈയിലെടുത്ത്
  rationale: ഹീബ്രുവിലെ മൂർത്തമായ ‘നിന്റെ കൈയിൽ’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: רָמֹת גִּלְעָד
  choice: ഗിലെയാദിലെ രാമോത്ത്
  rationale: സ്ഥലനാമത്തിന്റെ ഘടകങ്ങൾ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു; മലയാളത്തിൽ സ്ഥലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ഗിലെയാദിലെ’ എന്നു നൽകി.
