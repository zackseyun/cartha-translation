  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
translation:
  language: ml
  text: യൂദാരാജാവായ അഹസ്യാവ് ഇതു കണ്ടപ്പോൾ, ബേത്ത്-ഹഗ്ഗാൻ വഴിയായി ഓടിപ്പോയി.[a] യേഹൂ അവനെ പിന്തുടർന്ന്, “അവനെയും രഥത്തിൽവെച്ച് പ്രഹരിക്കൂ!” എന്നു പറഞ്ഞു.[b] അങ്ങനെ അവർ യിബ്ലെയാമിനടുത്തുള്ള ഗൂർ കയറ്റത്തിൽവെച്ച് അവനെ പ്രഹരിച്ചു. എന്നാൽ അവൻ മെഗിദ്ദോയിലേക്ക് ഓടിപ്പോയി അവിടെവെച്ച് മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബേത്ത്-ഹഗ്ഗാൻ’ എന്നതിന് ‘തോട്ടത്തിന്റെ വീട്’ എന്ന് അർഥമാകാം; എന്നാൽ ഇവിടെ അതൊരു സ്ഥലനാമമായിരിക്കാനാണ് സാധ്യത, അതിനാൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “അവനെയും രഥത്തിലേക്ക് പ്രഹരിക്കൂ!” ഹീബ്രു ഉപസർഗം ഇവിടെ സ്ഥലത്തെയോ ദിശയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: ഇതു കണ്ടപ്പോൾ
  rationale: ഹീബ്രുവിൽ ക്രിയയ്ക്ക് വ്യക്തമായ കർമമില്ലെങ്കിലും, മുൻസംഭവത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ഇതു’ ചേർത്തു.
- source_word: דֶּרֶךְ בֵּית הַגָּן
  choice: ബേത്ത്-ഹഗ്ഗാൻ വഴിയായി
  rationale: דֶּרֶךְ എന്നത് വഴി/പാതയെ സൂചിപ്പിക്കുന്നു. בֵּית הַגָּן ഇവിടെ സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: അവനെ പിന്തുടർന്ന്
  rationale: רדף + אַחַר എന്ന പ്രയോഗത്തിന്റെ പിന്തുടരുക/പിറകെ ചെല്ലുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി.
- source_word: גַּם אֹתוֹ
  choice: അവനെയും
  rationale: גַּם നൽകുന്ന കൂട്ടിച്ചേർക്കൽഭാവം മലയാളത്തിലെ ‘-യും’ കൊണ്ട് സംക്ഷിപ്തമായി നിലനിർത്തി.
- source_word: הַכֻּהוּ
  choice: പ്രഹരിക്കൂ
  rationale: נכה എന്ന ക്രിയയുടെ വിശാലമായ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന അർഥം നിലനിർത്തി; ‘കൊല്ലൂ’ എന്ന് നൽകി ഫലം മുൻകൂട്ടി നിർണ്ണയിച്ചില്ല.
- source_word: אֶל הַמֶּרְכָּבָה
  choice: രഥത്തിൽവെച്ച്
  rationale: ആക്രമണം അഹസ്യാവ് രഥത്തിലായിരിക്കുമ്പോൾ നടന്നതെന്ന സന്ദർഭോചിതമായ വായന മുഖ്യപാഠത്തിൽ നൽകി; എങ്കിലും אֶל എന്ന ഉപസർഗത്തിന്റെ ദിശാസൂചക സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּמַעֲלֵה גוּר
  choice: ഗൂർ കയറ്റത്തിൽവെച്ച്
  rationale: מַעֲלֶה സൂചിപ്പിക്കുന്ന കയറ്റമോ മേലോട്ടുള്ള പാതയോ മലയാളത്തിൽ വ്യക്തമായി നൽകി.
- source_word: אֲשֶׁר אֶת יִבְלְעָם
  choice: യിബ്ലെയാമിനടുത്തുള്ള
  rationale: ഗൂരിന്റെ കയറ്റം യിബ്ലെയാമുമായി ബന്ധപ്പെട്ട സ്ഥാനത്താണെന്ന ഭൂമിശാസ്ത്രബന്ധം അമിതകൃത്യതയില്ലാതെ സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: וַיָּנָס מְגִדּוֹ
  choice: മെഗിദ്ദോയിലേക്ക് ഓടിപ്പോയി
  rationale: נוס എന്നത് അപകടത്തിൽനിന്നുള്ള ഓട്ടത്തെയോ പലായനത്തെയോ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള സ്ഥലനാമം ലക്ഷ്യസ്ഥാനമായി മലയാളത്തിൽ നൽകി.
- source_word: וַיָּמָת שָׁם
  choice: അവിടെവെച്ച് മരിച്ചു
  rationale: സംഭവക്രമവും സ്ഥലസൂചനയും നേരിട്ട് നിലനിർത്തി.
