translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; സൈനികപ്രവർത്തനത്തിന് അതിരുകടന്ന വ്യാഖ്യാനം നൽകാതെ ‘പ്രഹരിക്കുക’ തിരഞ്ഞെടുത്തു. ഉറവിടത്തിലെ ഉപസർഗസംബന്ധമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
