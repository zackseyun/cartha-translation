  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִ֨כִּיתָ֔ה אֶת בֵּ֥ית אַחְאָ֖ב אֲדֹנֶ֑י/ךָ וְ/נִקַּמְתִּ֞י דְּמֵ֣י עֲבָדַ֣/י הַ/נְּבִיאִ֗ים וּ/דְמֵ֛י כָּל עַבְדֵ֥י יְהוָ֖ה מִ/יַּ֥ד אִיזָֽבֶל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/007.yaml
  text: And you shall strike down the house of Ahab your master[a], and I will avenge the blood of my servants the prophets and the blood of all the servants of Yahweh from the hand of Jezebel.
translation:
  language: ml
  text: നിന്റെ യജമാനനായ ആഹാബിന്റെ വംശത്തെ നീ സംഹരിക്കും. എന്റെ ദാസന്മാരായ പ്രവാചകന്മാരുടെ രക്തത്തിനും യഹോവയുടെ സകല ദാസന്മാരുടെയും രക്തത്തിനും ഞാൻ ഈസബേലിന്റെ കൈയിൽനിന്ന്[a] പ്രതികാരം ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഈസബേലിന്റെ കൈയിൽനിന്ന്.’ ഈ എബ്രായ പ്രയോഗം ഈസബേലിന്റെ കൈയാൽ സംഭവിച്ചതിനെയോ അവൾ ഉത്തരവാദിയായതിനെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכִּיתָה
  choice: നീ സംഹരിക്കും
  rationale: ഇവിടെ נכה ഒരു രാജവംശത്തിന്മേലുള്ള നിർണായകമായ ന്യായവിധിയെയാണ് സൂചിപ്പിക്കുന്നത്; വെറുമൊരു പ്രഹരത്തേക്കാൾ ശക്തമായ അർഥം ‘സംഹരിക്കും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֵּית אַחְאָב
  choice: ആഹാബിന്റെ വംശം
  rationale: രാജകീയ പശ്ചാത്തലത്തിൽ בֵּית എന്നത് കെട്ടിടമല്ല, ആഹാബിന്റെ കുടുംബ-രാജവംശപരമ്പരയാണ്; ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֲדֹנֶיךָ
  choice: നിന്റെ യജമാനൻ
  rationale: ഇത് യേഹൂവിന്റെ മാനുഷിക മേലധികാരിയായ ആഹാബിനെ സൂചിപ്പിക്കുന്നു; ദൈവിക പദവിയുമായി ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: וְנִקַּמְתִּי
  choice: ഞാൻ പ്രതികാരം ചെയ്യും
  rationale: അന്യായമായി ചൊരിയപ്പെട്ട രക്തത്തിനുവേണ്ടിയുള്ള ദൈവിക പ്രത്യുപകാരനീതിയെ נקם വ്യക്തമാക്കുന്നു; അതിന്റെ ശക്തി മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
- source_word: דְּמֵי
  choice: രക്തം
  rationale: എബ്രായത്തിലെ ബഹുവചനരൂപം രക്തച്ചൊരിച്ചിലിനെയോ രക്തപാതകബാധ്യതയെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; പ്രതികാരത്തിന്റെ സന്ദർഭത്തിൽ ‘രക്തം’ സ്വാഭാവികവും ശക്തവുമാണ്.
- source_word: עֲבָדַי הַנְּבִיאִים
  choice: എന്റെ ദാസന്മാരായ പ്രവാചകന്മാർ
  rationale: പ്രവാചകന്മാരെയാണ് ദൈവത്തിന്റെ ദാസന്മാരായി തിരിച്ചറിയുന്ന സമാനാധികരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: യഹോവയുടെ സകല ദാസന്മാർ
  rationale: മൂലത്തിലെ സമ്പർക്കബന്ധവും ‘എല്ലാവരും’ എന്ന വ്യാപ്തിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണത്തിലൂടെ നൽകുന്നു.
- source_word: מִיַּד אִיזָבֶל
  choice: ഈസബേലിന്റെ കൈയിൽനിന്ന്
  rationale: രക്തച്ചൊരിച്ചിലിലെ ഈസബേലിന്റെ പ്രവർത്തകത്വവും ഉത്തരവാദിത്വവും സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അതിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രതികാരത്തിന്റെ ഭാഷ
  choice: ഞാൻ പ്രതികാരം ചെയ്യും
  alternative: ഞാൻ പകരം ചോദിക്കും
  rationale: ന്യായവിധിയിലൂടെ ദൈവം കൊല്ലപ്പെട്ട തന്റെ ദാസന്മാർക്കുവേണ്ടി പ്രതികാരം ചെയ്യുമെന്ന പാഠത്തിന്റെ അവകാശവാദം മയപ്പെടുത്താതെയും വിപുലീകരിക്കാതെയും നിലനിർത്തുന്നു.
- issue: ആഹാബിന്റെ ‘ഭവനം’ എന്ന രാജവംശപ്രയോഗം
  choice: ആഹാബിന്റെ വംശം
  alternative: ആഹാബിന്റെ ഗൃഹം
  rationale: വിധി ഒരു കെട്ടിടത്തിനല്ല, രാജകുടുംബത്തിനും അതിന്റെ വംശപരമ്പരയ്ക്കുമാണെന്ന ചരിത്ര-രാഷ്ട്രീയ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ നിലവാരമലയാളം ഉപയോഗിച്ചു. രാജവംശനാശത്തിന്റെയും ദൈവിക പ്രതികാരത്തിന്റെയും കഠിനഭാഷ മയപ്പെടുത്തിയിട്ടില്ല. എബ്രായത്തിലെ പ്രവർത്തകത്വസൂചകമായ ‘കൈയിൽനിന്ന്’ എന്ന പ്രയോഗം പാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
