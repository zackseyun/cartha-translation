  text: וַ/יַּרְכִּ֧בוּ אֹת֛/וֹ עֲבָדָ֖י/ו יְרוּשָׁלְָ֑מָ/ה וַ/יִּקְבְּר֨וּ אֹת֧/וֹ בִ/קְבֻרָת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֥יר דָּוִֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/028.yaml
  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
translation:
  language: ml
  text: അവന്റെ ദാസന്മാർ അവനെ യെരൂശലേമിലേക്കു കൊണ്ടുപോയി[a]. ദാവീദിന്റെ നഗരത്തിൽ അവന്റെ പിതാക്കന്മാരോടൊപ്പം അവന്റെ കല്ലറയിൽ അവനെ അടക്കം ചെയ്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ യെരൂശലേമിലേക്കു കയറ്റിക്കൊണ്ടുപോയി’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘സവാരി ചെയ്യിച്ചു’ അഥവാ ‘കയറ്റിക്കൊണ്ടുപോയി’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘പിതാക്കന്മാരോടൊപ്പം’ എന്നത് അവന്റെ രാജവംശത്തിലെ മുൻഗാമികളുടെ ഇടയിൽ അടക്കം ചെയ്തുവെന്നർഥമുള്ള എബ്രായ സംസ്കാരപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: കൊണ്ടുപോയി
  rationale: רכב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അക്ഷരാർഥത്തിൽ ‘കയറ്റി കൊണ്ടുപോകുക’ എന്ന ആശയം നൽകുന്നു. ഇവിടെ മരിച്ച അഹസ്യാവിന്റെ ശരീരം യെരൂശലേമിലേക്കു മാറ്റുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ ‘കൊണ്ടുപോയി’ എന്നു നൽകി; സവാരി ചെയ്തുവെന്ന തെറ്റിദ്ധാരണ ഇതിലൂടെ ഒഴിവാകുന്നു.
- source_word: עֲבָדָיו
  choice: അവന്റെ ദാസന്മാർ
  rationale: עבד രാജാവിന്റെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ അവന്റെ ശരീരം കൊണ്ടുപോയ രാജസേവകരാണ് ഉദ്ദേശ്യം; ‘ദാസന്മാർ’ നേരിട്ടും മാന്യവുമായ പരിഭാഷയാണ്.
- source_word: יְרוּשָׁלָמָה
  choice: യെരൂശലേമിലേക്കു
  rationale: ദിശ സൂചിപ്പിക്കുന്ന ־ָה പ്രത്യയം യെരൂശലേമിലേക്കുള്ള ഗതിയെ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: അവനെ അടക്കം ചെയ്തു
  rationale: ക്രിയയുടെയും കർമത്തിന്റെയും നേരിട്ടുള്ള പരിഭാഷ. മുൻവാക്യത്തിലെ ‘അവന്റെ ദാസന്മാർ’ തന്നെയാണ് സ്വാഭാവികമായ കർത്താവ്.
- source_word: בִקְבֻרָתוֹ
  choice: അവന്റെ കല്ലറയിൽ
  rationale: קְבֻרָה ഇവിടെ അടക്കസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്. രാജകീയ സംസ്കാരസന്ദർഭത്തിൽ ‘കല്ലറ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: עִם אֲבֹתָיו
  choice: അവന്റെ പിതാക്കന്മാരോടൊപ്പം
  rationale: മുൻഗാമികളുടെ ഇടയിലെ സംസ്കാരത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വംശപരമായ ഭാവം നിലനിർത്തുന്നു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּעִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരത്തിൽ
  rationale: സ്ഥലനാമപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള, മലയാളത്തിൽ സ്ഥാപിതമായ പരിഭാഷ.
