translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ തുടർച്ചയായ രണ്ടു ക്രിയകളും വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി. ‘പിതാക്കന്മാരോടൊപ്പം’ എന്ന മൂലഭാഷാപ്രയോഗം നിലനിർത്തി അതിന്റെ സംസ്കാരപരമായ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
