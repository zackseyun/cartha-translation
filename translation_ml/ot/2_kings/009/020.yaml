  text: וַ/יַּגֵּ֤ד הַ/צֹּפֶה֙ לֵ/אמֹ֔ר בָּ֥א עַד אֲלֵי/הֶ֖ם וְ/לֹֽא שָׁ֑ב וְ/הַ/מִּנְהָ֗ג כְּ/מִנְהַג֙ יֵה֣וּא בֶן נִמְשִׁ֔י כִּ֥י בְ/שִׁגָּע֖וֹן יִנְהָֽג־־־׃
