  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
translation:
  language: ml
  text: 'കാവൽക്കാരൻ ഇങ്ങനെ അറിയിച്ചു: “അവൻ അവരുടെ അടുക്കലെത്തിയെങ്കിലും മടങ്ങിവന്നിട്ടില്ല. രഥം ഓടിക്കുന്ന രീതി നിംശിയുടെ മകനായ യേഹൂവിന്റെ ഓട്ടരീതിപോലെയാണ്; കാരണം അവൻ ഉന്മത്തമായി രഥമോടിക്കുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവൻ ഭ്രാന്തമായി രഥമോടിക്കുന്നു” അഥവാ “അവൻ ഭ്രാന്തത്തോടെ രഥമോടിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. യേഹൂവിന്റെ ഉന്മാദഭരിതവും നിയന്ത്രണമില്ലാത്തതുമായ രഥമോടിക്കൽ രീതിയെയാണ് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: വിവരം അറിയിച്ചു
  rationale: നിരീക്ഷകൻ രാജാവിന് നൽകുന്ന ഔദ്യോഗിക റിപ്പോർട്ടിന്റെ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַצֹּפֶה
  choice: കാവൽക്കാരൻ
  rationale: അടുത്തുവരുന്നവരെ നിരീക്ഷിക്കാൻ നിയോഗിക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന, ഈ രാജകീയ-സൈനിക സന്ദർഭത്തിന് യോജിച്ച സാധാരണ മലയാളപദം.
- source_word: בָּא עַד אֲלֵיהֶם
  choice: അവൻ അവരുടെ അടുത്തെത്തി
  rationale: ദൂതൻ സംഘത്തിന്റെ അടുക്കൽവരെ എത്തിച്ചേർന്നുവെന്ന ആശയം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְלֹא שָׁב
  choice: എന്നാൽ മടങ്ങിവന്നിട്ടില്ല
  rationale: ദൂതൻ ഇതുവരെ തിരിച്ചെത്താത്ത നിലവിലെ ഫലം വ്യക്തമാക്കുന്നു; וְ ഇവിടെ സന്ദർഭാനുസൃതമായ വിരോധം സൂചിപ്പിക്കുന്നു.
- source_word: הַמִּנְהָג כְּמִנְהַג
  choice: രഥമോടിക്കുന്ന രീതി ... പോലെയാണ്
  rationale: מִנְהָג ഇവിടെ נהג എന്ന ക്രിയയോടും രഥയാത്രയുടെ സന്ദർഭത്തോടും ചേർന്ന് ഓടിക്കുന്ന ശൈലിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാഹനം വ്യക്തമാക്കുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: നിംശിയുടെ മകനായ യേഹൂ
  rationale: പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഓടിക്കുന്നവനെ യേഹൂവായി തിരിച്ചറിയാനുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്നു.
- source_word: בְשִׁגָּעוֹן יִנְהָג
  choice: അവൻ ഭ്രാന്തമായ രീതിയിലാണ് ഓടിക്കുന്നത്
  rationale: בְשִׁגָּעוֹן എന്ന നാമരൂപത്തിന്റെ ഉന്മത്തവും നിയന്ത്രണമില്ലാത്തതുമായ രീതിയെന്ന ശക്തി നിലനിർത്തിക്കൊണ്ട് വ്യക്തിയെ നേരിട്ട് ‘ഭ്രാന്തൻ’ എന്നു മുദ്രകുത്താതിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ ‘രഥമോടിക്കുന്ന രീതി ... പോലെയാണ്’ എന്നു ചുരുക്കി; എന്നാൽ തിരിച്ചറിയലിന് ആധാരമായ ഓട്ടശൈലി വ്യക്തമായി നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
