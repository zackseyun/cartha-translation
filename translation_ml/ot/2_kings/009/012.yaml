source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ שֶׁ֔קֶר הַגֶּד נָ֖א לָ֑/נוּ וַ/יֹּ֗אמֶר כָּ/זֹ֤את וְ/כָ/זֹאת֙ אָמַ֤ר אֵלַ/י֙ לֵ/אמֹ֔ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה מְשַׁחְתִּ֥י/ךָֽ לְ/מֶ֖לֶךְ אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/012.yaml
  text: 'And they said[a], “That is a lie. Please tell us.” So he said, “Thus and thus he said to me, saying, ‘Thus says Yahweh: I have anointed you king over Israel.’”'
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “അതു കള്ളമാണ്. ദയവായി ഞങ്ങളോടു പറയൂ.” അപ്പോൾ അവൻ പറഞ്ഞു: “അവൻ എന്നോടു ഇങ്ങനെയും അങ്ങനെയും പറഞ്ഞു:[a] ‘യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ഞാൻ നിന്നെ ഇസ്രായേലിന്മേൽ രാജാവായി അഭിഷേകം ചെയ്തിരിക്കുന്നു.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഇങ്ങനെയും ഇങ്ങനെയും”; അനിശ്ചിതമോ ഭാഗികമോ ആയ ഒരു സംഗ്രഹത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം. “ഇങ്ങനെയൊക്കെയാണ്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: അതു കള്ളമാണ്
  rationale: നാമപദമായ ‘കള്ളം/വ്യാജം’ എന്ന അർഥം സംഭാഷണസന്ദർഭത്തിൽ സ്വാഭാവികമായ പൂർണ്ണവാക്യമായി നൽകി; യേഹൂ സന്ദേശം മറച്ചുവെക്കുന്നു എന്ന അവരുടെ ആരോപണം നിലനിർത്തുന്നു.
- source_word: הַגֶּד נָא לָנוּ
  choice: ദയവായി ഞങ്ങളോടു പറയൂ
  rationale: ഹിഫീൽ ആജ്ഞാരൂപത്തിന്റെ ‘പറയുക/അറിയിക്കുക’ എന്ന ബലവും נָא നൽകുന്ന വിനയപൂർവമായ അഭ്യർഥനയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: כָּזֹאת וְכָזֹאת
  choice: ഇന്നിന്ന കാര്യങ്ങൾ
  rationale: വാക്കുതോറുമുള്ള ഉദ്ധരണിയല്ലാതെ അനിശ്ചിതമോ ഭാഗികമോ ആയ ഒരു സംഗ്രഹം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകസന്ദേശത്തിന്റെ ഔപചാരിക ദൂതസൂത്രം സംരക്ഷിക്കുന്നതോടൊപ്പം, ദൈവത്തിന്റെ പ്രസ്താവനയ്ക്ക് യോജിച്ച മാന്യമായ ആധുനിക മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: מְשַׁחְתִּיךָ
  choice: ഞാൻ നിന്നെ … അഭിഷേകം ചെയ്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ രാജകീയ നിയമനത്തെ സൂചിപ്പിക്കുന്ന perfect രൂപവും משׁח എന്ന ക്രിയയുടെ രാജകീയ-ദൈവശാസ്ത്ര പ്രാധാന്യവും നിലനിർത്തുന്നു.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്മേൽ രാജാവായി
  rationale: לְ നിയമനം സൂചിപ്പിക്കുന്നതിനാൽ ‘രാജാവായി’ എന്നും, ഭരണാധികാരബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കാൻ אֶל ‘ഇസ്രായേലിന്മേൽ’ എന്നും പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിപരമായ ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാൽ പകരാതെ പേരായി നിലനിർത്തി.
- issue: രാജാവായുള്ള അഭിഷേകത്തിന്റെ കാലസൂചന
  choice: അഭിഷേകം ചെയ്തിരിക്കുന്നു
  alternative: അഭിഷേകം ചെയ്യുന്നു
  rationale: എബ്രായ perfect രൂപം പ്രഖ്യാപിക്കപ്പെട്ട നിയമനത്തെ പൂർത്തിയായ പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു; വർത്തമാനകാലമായി മാറ്റാതെ ആ ഭാവം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. സംഭാഷണത്തിന്റെ നേരിട്ടുള്ള സ്വരം നിലനിർത്തി; പ്രവാചകസൂത്രത്തിൽ മാത്രം ഉചിതമായ ഔപചാരികത ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം വിശദീകരിക്കപ്പെടുന്ന എബ്രായ പ്രയോഗത്തോട് ചേർത്തിരിക്കുന്നു.
