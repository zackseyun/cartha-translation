  text: “നാബോത്തിന്റെ രക്തവും അവന്റെ പുത്രന്മാരുടെ രക്തവും ഇന്നലെ ഞാൻ തീർച്ചയായും കണ്ടു[a],” യഹോവ അരുളിച്ചെയ്യുന്നു. “ഈ ഭൂവിഭാഗത്തിൽ ഞാൻ നിന്നോടു തിരിച്ചടയ്ക്കും,” യഹോവ അരുളിച്ചെയ്യുന്നു. “അതുകൊണ്ട് ഇപ്പോൾ അവനെ എടുത്ത് യഹോവയുടെ വചനപ്രകാരം ഈ ഭൂവിഭാഗത്തിലേക്കു എറിഞ്ഞുകളയുക.”
