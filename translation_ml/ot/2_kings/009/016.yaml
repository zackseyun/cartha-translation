  rationale: כִּי യേഹൂ യിസ്രെയേലിലേക്കു പോയതിന്റെ കാരണം നൽകുന്നു. മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ കാരണബന്ധം വ്യക്തമായി അറിയിക്കുന്നതിനാൽ കൃത്രിമമായ ബന്ധപദം ഒഴിവാക്കി.
