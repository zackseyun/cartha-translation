  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
translation:
  language: ml
  text: അങ്ങനെ യേഹൂ കയറി[a] യിസ്രെയേലിലേക്കു പോയി; യോരാം അവിടെ കിടക്കുകയായിരുന്നതുകൊണ്ട്. യെഹൂദാരാജാവായ അഹസ്യാവും യോരാമിനെ കാണാൻ[b] അവിടേക്കു ഇറങ്ങിച്ചെന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സവാരി ചെയ്തു.’ എബ്രായപാഠം യേഹൂ കയറുന്നതും തുടർന്ന് യിസ്രെയേലിലേക്കു പോകുന്നതും വേറിട്ട ക്രിയകളാൽ പറയുന്നു; അദ്ദേഹം കയറിയ വാഹനം ഏതെന്ന് ഇവിടെ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
