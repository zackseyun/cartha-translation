id: 2KI.9.3
reference: 2 Kings 9:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ פַךְ הַ/שֶּׁ֨מֶן֙ וְ/יָצַקְתָּ֣ עַל רֹאשׁ֔/וֹ וְ/אָֽמַרְתָּ֙ כֹּֽה אָמַ֣ר יְהוָ֔ה מְשַׁחְתִּ֥י/ךָֽ לְ/מֶ֖לֶךְ אֶל יִשְׂרָאֵ֑ל וּ/פָתַחְתָּ֥ הַ/דֶּ֛לֶת וְ/נַ֖סְתָּה וְ/לֹ֥א תְחַכֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/003.yaml
  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
translation:
  language: ml
  text: 'പിന്നെ എണ്ണക്കുപ്പി എടുത്ത് അവന്റെ തലയിൽ ഒഴിച്ച് ഇങ്ങനെ പറയുക: ‘യഹ്‌വേ ഇപ്രകാരം പറയുന്നു: ഞാൻ നിന്നെ ഇസ്രായേലിന്മേൽ[a] രാജാവായി അഭിഷേകം ചെയ്തിരിക്കുന്നു.’ അതിനുശേഷം വാതിൽ തുറന്ന് ഓടിപ്പോകുക; കാത്തുനിൽക്കരുത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്”; രാജനിയമനസൂത്രവാക്യത്തിൽ ഇവിടെ “ഇസ്രായേലിന്മേൽ” എന്നാണ് അർത്ഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַךְ הַשֶּׁמֶן
  choice: എണ്ണക്കുപ്പി
  rationale: פַךְ ദ്രാവകം സൂക്ഷിക്കുന്ന ചെറിയ പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്; הַשֶּׁמֶן ‘എണ്ണ’ എന്നാണ്. മൂലപാഠത്തിൽ ‘ഒലിവെണ്ണ’ എന്നു വ്യക്തമാക്കാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: അവന്റെ തലയിൽ ഒഴിച്ച്
  rationale: יצק കൂടെ עַל വന്നിരിക്കുന്നത് തലയിൽ എണ്ണ ഒഴിക്കുന്ന പ്രവൃത്തിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വേ ഇപ്രകാരം പറയുന്നു
  rationale: പ്രവാചകദൂതന്റെ ഔപചാരിക പ്രഖ്യാപനശൈലി നിലനിർത്തുകയും יְהוָה എന്ന ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: מְשַׁחְתִּיךָ
  choice: ഞാൻ നിന്നെ … അഭിഷേകം ചെയ്തിരിക്കുന്നു
  rationale: ഹീബ്രു സമ്പൂർണക്രിയയുടെ പൂർത്തിയായ ഭാവവും ഈ ചടങ്ങിലെ നിർവഹണാത്മക പ്രഖ്യാപനവും നിലനിർത്തുന്നു.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെമേൽ രാജാവായി
  rationale: לְמֶלֶךְ അധികാരസ്ഥാനത്തേക്കുള്ള നിയമനത്തെയും, ഈ രാജനിയമനസന്ദർഭത്തിൽ אֶל יִשְׂרָאֵל ഇസ്രായേലിന്മേലുള്ള ഭരണബന്ധത്തെയും സൂചിപ്പിക്കുന്നു; അസാധാരണമായ മുൻപ്രത്യയപ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּפָתַחְתָּ הַדֶּלֶת
  choice: അതിനുശേഷം വാതിൽ തുറന്ന്
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയും അടുത്ത നടപടിയും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְנַסְתָּה
  choice: ഓടിപ്പോകുക
  rationale: נוס അപകടത്തിൽനിന്ന് വേഗത്തിൽ മാറിപ്പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഓടിപ്പോകുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും അടിയന്തരത വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: וְלֹא תְחַכֶּה
  choice: കാത്തുനിൽക്കരുത്
  rationale: താമസിക്കാതെ ഉടൻ പോകണമെന്ന വിലക്ക് ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിനാമംകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: അഭിഷേകപ്രഖ്യാപനത്തിലെ ക്രിയാകാലം
  choice: അഭിഷേകം ചെയ്തിരിക്കുന്നു
  alternative: അഭിഷേകം ചെയ്യുന്നു
  rationale: מְשַׁחְתִּיךָ എന്ന സമ്പൂർണരൂപം പൂർത്തിയായ പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു; അതേസമയം ചടങ്ങിനോടൊപ്പമുള്ള പ്രഖ്യാപനത്തിന്റെ നിർവഹണാത്മക സ്വഭാവം സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രവാചകപ്രഖ്യാപനശൈലി ഉപയോഗിച്ചു. ‘അഭിഷേകം’ പോലുള്ള പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയപ്പോൾ, അടിയന്തരമായ പുറപ്പെടൽ ‘ഓടിപ്പോകുക; കാത്തുനിൽക്കരുത്’ എന്ന സ്വാഭാവിക ഭാഷയിൽ അവതരിപ്പിച്ചു.
