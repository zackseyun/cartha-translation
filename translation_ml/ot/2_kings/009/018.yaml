  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘സമാധാനം’ എന്ന ആവർത്തിത എബ്രായ മുഖ്യപദം നിലനിർത്തി. രാജസന്ദേശത്തിന്റെ ഔദ്യോഗികഭാവം സംരക്ഷിച്ചെങ്കിലും അനാവശ്യമായി പഴഞ്ചൻ രൂപങ്ങൾ ഒഴിവാക്കി.
