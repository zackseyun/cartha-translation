base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
translation:
  language: ml
  text: 'അങ്ങനെ കുതിരസവാരിക്കാരൻ യേഹുവിനെ എതിരേൽക്കാൻ ചെന്നു പറഞ്ഞു: “രാജാവ് ഇപ്രകാരം പറയുന്നു: ‘സമാധാനമാണോ?’”[a] യേഹു പറഞ്ഞു: “സമാധാനവുമായി നിനക്കെന്തു കാര്യം? തിരിഞ്ഞ് എന്റെ പിന്നാലെ വരുക.”[b] കാവൽക്കാരൻ അറിയിച്ചു: “ദൂതൻ അവരുടെ അടുത്തെത്തി; എന്നാൽ മടങ്ങിവന്നിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എല്ലാം സുഖമാണോ?” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ശാലോം ആണ്; ഈ സംഭാഷണത്തിൽ അതേ പദം ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “എന്റെ പിന്നിലേക്ക് തിരിയുക.” സന്ദർഭത്തിൽ, “എന്റെ പിന്നാലെ അണിചേരുക” എന്നും മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  choice: കുതിരപ്പുറത്തുള്ള ദൂതൻ
  rationale: പദാനുപദമായി ‘കുതിരയുടെ സവാരിക്കാരൻ’ എന്നാണ്; സന്ദർഭത്തിൽ രാജാവിന്റെ സന്ദേശം വഹിക്കുന്ന കുതിരസവാരിക്കാരനാണെന്ന് വ്യക്തമാക്കാൻ സ്വാഭാവികമായ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: לִקְרָאתוֹ
  choice: യേഹുവിനെ എതിരേൽക്കാൻ
  rationale: ആരെയെങ്കിലും നേരിൽ കാണുന്നതിനായി അവരുടെ ദിശയിൽ ചെല്ലുക എന്ന ചലനാർഥം സ്വാഭാവികമായി നൽകുന്നു; സർവനാമത്തിന്റെ സൂചിതവ്യക്തിയെ മലയാളത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: രാജാവ് ഇപ്രകാരം ചോദിക്കുന്നു
  rationale: എബ്രായത്തിലെ ഔദ്യോഗിക സന്ദേശസൂത്രത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; പിന്നാലെ ചോദ്യം വരുന്നതിനാൽ മലയാളത്തിൽ ‘ചോദിക്കുന്നു’ സ്വാഭാവികമാണ്.
- source_word: הֲשָׁלוֹם
  choice: സമാധാനമാണോ?
  rationale: ശാലോം എന്ന ആവർത്തിത മുഖ്യപദം നിലനിർത്തുകയും സാഹചര്യം സമാധാനകരമാണോ എന്ന ചോദ്യത്തിന്റെ തുറന്ന സ്വഭാവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: സമാധാനവുമായി നിനക്കെന്തു കാര്യം?
  rationale: ദൂതന്റെ അന്വേഷണത്തെ തള്ളിക്കളയുന്ന എബ്രായ ശൈലി മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘സമാധാനം’ എന്ന ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: סֹב אֶל אַחֲרָי
  choice: തിരിഞ്ഞ് എന്റെ പിന്നാലെ ചേരുക
  rationale: ‘തിരിയുക’ എന്ന മൂലചിത്രവും യേഹുവിന്റെ സംഘത്തിന്റെ പിന്നിൽ ചേർന്ന് പോകുക എന്ന സന്ദർഭാർഥവും ഒരുമിച്ച് നൽകുന്നു.
- source_word: הַצֹּפֶה
  choice: കാവൽക്കാരൻ
  rationale: ഉയർന്ന സ്ഥാനത്തുനിന്ന് നിരീക്ഷിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: הַמַּלְאָךְ
  choice: ദൂതൻ
  rationale: ഇവിടെ ദൈവദൂതനല്ല, രാജാവിന്റെ മനുഷ്യസന്ദേശവാഹകനാണ്; ‘ദൂതൻ’ സന്ദർഭത്തിൽ ആ അർഥം വഹിക്കുന്നു.
- source_word: בָּא ... עַד הֵם
  choice: അവരുടെ അടുത്തെത്തി
  rationale: ദൂതൻ അവരുടെ സ്ഥാനംവരെ എത്തിയെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלֹא שָׁב
  choice: എന്നാൽ മടങ്ങിവന്നിട്ടില്ല
  rationale: കാവൽക്കാരന്റെ ഇപ്പോഴത്തെ നിരീക്ഷണഫലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
