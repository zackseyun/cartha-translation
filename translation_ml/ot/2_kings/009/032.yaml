  yaml_path: translation/ot/2_kings/009/032.yaml
  text: He lifted up his face toward the window and said[a], “Who is with me? Who?” Then two or three eunuchs looked down at him.
translation:
  language: ml
  text: അവൻ ജനലിലേക്കു മുഖമുയർത്തി, “എന്റെ കൂടെ ആരുണ്ട്? ആർ?” എന്നു ചോദിച്ചു. അപ്പോൾ രണ്ടോ മൂന്നോ ഷണ്ഡന്മാർ[a] അവന്റെ നേരെ താഴേക്കു നോക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൊട്ടാര ഉദ്യോഗസ്ഥർ”; എബ്രായപദത്തിന് ഈ രണ്ടർഥവും വരാം. എന്നാൽ രാജകൊട്ടാരത്തിന്റെ ഈ സന്ദർഭത്തിൽ “ഷണ്ഡന്മാർ” എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא פָנָיו
  choice: മുഖമുയർത്തി
  rationale: ‘അവൻ തന്റെ മുഖം ഉയർത്തി’ എന്ന എബ്രായ ദൃശ്യഭാവം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മുകളിലേക്കുള്ള നോട്ടമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַחַלּוֹן
  choice: ജനലിലേക്കു
  rationale: കൊട്ടാരത്തിലെ ഉയർന്ന ജനലിനെയാണ് പദം നേരിട്ട് സൂചിപ്പിക്കുന്നത്.
- source_word: מִי אִתִּי מִי
  choice: എന്റെ കൂടെ ആരുണ്ട്? ആർ?
  rationale: אִתִּי എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘എന്റെ കൂടെ’ നിലനിർത്തുകയും ആവർത്തിച്ച മִי നൽകുന്ന ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു; ‘എന്റെ പക്ഷത്ത്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് അർഥം കൂടുതൽ വ്യാഖ്യാനിക്കുന്നതായിരിക്കും.
- source_word: וַיַּשְׁקִיפוּ אֵלָיו
  choice: അവനെ താഴേക്കു നോക്കി
  rationale: ഉയർന്ന ജനലിൽനിന്ന് യേഹൂവിലേക്കുള്ള നോട്ടത്തിന്റെ ദിശ שׁקף എന്ന ക്രിയയുടെ സന്ദർഭാർഥത്തോടെ വ്യക്തമാക്കുന്നു.
- source_word: שְׁנַיִם שְׁלֹשָׁה
  choice: രണ്ടോ മൂന്നോ
  rationale: ഒരു ചെറിയ അനിശ്ചിത സംഖ്യയെ സൂചിപ്പിക്കുന്ന എബ്രായ സംഖ്യാജോടിയുടെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: סָרִיסִים
  choice: ഷണ്ഡന്മാർ
  rationale: രാജകൊട്ടാരസന്ദർഭത്തിൽ ‘ഷണ്ഡന്മാർ’ എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്; ‘കൊട്ടാര ഉദ്യോഗസ്ഥർ’ എന്ന വിശാലാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
