  yaml_path: translation/ot/2_kings/009/011.yaml
  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
translation:
  language: ml
  text: 'പിന്നെ യേഹൂ പുറത്തുവന്ന് തന്റെ യജമാനന്റെ സേവകരുടെ അടുക്കലേക്കു ചെന്നു. അവരിൽ ഒരാൾ അവനോടു ചോദിച്ചു: “എല്ലാം സുഖമാണോ?[a] ഈ ഭ്രാന്തൻ[b] നിന്റെ അടുക്കൽ വന്നത് എന്തിന്?” അവൻ അവരോടു പറഞ്ഞു: “ആ മനുഷ്യനെയും അവന്റെ സംസാരത്തെയും[c] നിങ്ങൾക്ക് അറിയാമല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “എല്ലാം ശാന്തമാണോ?” ഹീബ്രുവിൽ അക്ഷരാർഥം: “സമാധാനമാണോ?”'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഈ മതിഭ്രമം പിടിച്ചവൻ” / “ഈ ഭ്രാന്തനായ മനുഷ്യൻ.” ഹീബ്രുവിൽ ഇത് അവഹേളനപരമായ ഒരു വിളിപ്പേരാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അവന്റെ ജൽപനം” / “അവന്റെ സംസാരരീതി.” ഹീബ്രുപദത്തിന് ഒരാളുടെ സംസാരത്തെയോ പ്രഭാഷണത്തെയോ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ സേവകർ
  rationale: עֶבֶד ഇവിടെ മേലധികാരിയുടെ കീഴിലുള്ള ആളുകളെ സൂചിപ്പിക്കുന്നു; അടിമത്തം അനാവശ്യമായി സൂചിപ്പിക്കാതെ ‘സേവകർ’ സ്വാഭാവികമാണ്. אֲדֹנָיו എന്നതിൽ രാജാവ് എന്നു വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ‘യജമാനൻ’ നിലനിർത്തുന്നു.
- source_word: הֲשָׁלוֹם
  choice: എല്ലാം സുഖമാണോ?
  rationale: അക്ഷരാർഥത്തിൽ ‘സമാധാനമാണോ?’ എന്ന ചോദ്യമാണെങ്കിലും, സാഹചര്യത്തിൽ കാര്യങ്ങൾ ക്ഷേമമാണോ എന്നു ചോദിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്. ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מַדּוּעַ בָּא
  choice: വന്നത് എന്തിന്?
  rationale: സംഭാഷണത്തിലെ കഴിഞ്ഞ സംഭവത്തെക്കുറിച്ചുള്ള കാരണം മലയാളത്തിൽ സ്വാഭാവികമായി ചോദിക്കുന്നു.
- source_word: הַמְשֻׁגָּע הַזֶּה
  choice: ഈ ഭ്രാന്തൻ
  rationale: അവഹേളനപരമായ പുരുഷലിംഗ ഏകവചന വിശേഷണം മയപ്പെടുത്താതെ പകർത്തുന്നു.
- source_word: וַיֹּאמֶר לוֹ
  choice: അവരിൽ ഒരാൾ അവനോടു ചോദിച്ചു
  rationale: ബഹുവചനമായ സേവകരെ തുടർന്നുള്ള ക്രിയ ഏകവചനത്തിലാണ്; കൂട്ടത്തിൽ ഒരാൾ പ്രതിനിധിയായി സംസാരിച്ചെന്ന വിതരണാർഥം വ്യക്തമായി നൽകുന്നു. ചോദ്യം ആയതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: אַתֶּם יְדַעְתֶּם אֶת הָאִישׁ
  choice: ആ മനുഷ്യനെ നിങ്ങൾക്ക് അറിയാമല്ലോ
  rationale: യേഹൂവിന്റെ ഒഴിഞ്ഞുമാറുന്ന, അവർക്കുതന്നെ അയാളെ അറിയാമെന്നു സൂചിപ്പിക്കുന്ന മറുപടി ‘അറിയാമല്ലോ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: שִׂיחוֹ
  choice: അവന്റെ സംസാരം
  rationale: שִׂיחַ സംസാരം, സംസാരരീതി, പ്രഭാഷണം തുടങ്ങിയ വിശാല അർഥങ്ങൾ വഹിക്കാം. ‘സന്ദേശം’ എന്നു പ്രത്യേകീകരിക്കാതെയും ‘ജൽപനം’ എന്നു അധികമായി അവഹേളിക്കാതെയും അവ്യക്തത നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. സംഭാഷണത്തിലെ അവഹേളനസ്വരം മയപ്പെടുത്താതെയും ശിഹോ എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി ചുരുക്കാതെയും സൂക്ഷിച്ചിട്ടുണ്ട്.
