base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/036.yaml
  text: So they returned and told him[a], and he said, “It is the word of Yahweh, which he spoke by the hand of his servant Elijah the Tishbite, saying, ‘In the territory of Jezreel the dogs will eat the flesh of Jezebel.’”
translation:
  language: ml
  text: 'അവർ മടങ്ങിവന്ന് അവനെ അറിയിച്ചു. അപ്പോൾ അവൻ പറഞ്ഞു: “ഇത് യഹ്‌വെയുടെ വചനമാണ്. തന്റെ ദാസനായ തിശ്ബ്യനായ ഏലിയാവിലൂടെ അവൻ ഇപ്രകാരം പറഞ്ഞിരുന്നു: ‘യിസ്രെയേലിന്റെ ഭൂപ്രദേശത്ത്[a] നായ്ക്കൾ ഈസേബെലിന്റെ മാംസം തിന്നും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യിസ്രെയേലിന്റെ ഭൂവിഭാഗത്തിൽ” അല്ലെങ്കിൽ “യിസ്രെയേലിലെ സ്ഥലഖണ്ഡത്തിൽ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഒരു ഭൂവിഭാഗത്തെയോ പ്രത്യേക സ്ഥലഖണ്ഡത്തെയോ സൂചിപ്പിക്കാം.
    reason: חֵלֶק എന്ന പദത്തിന്റെ യഥാർഥ സ്ഥലപരമായ വ്യാപ്തി സന്ദർഭം പൂർണമായി നിർണയിക്കുന്നില്ല; അതിനാൽ പ്രധാന പദവികല്പങ്ങൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיַּגִּידוּ לוֹ
  choice: അവർ മടങ്ങിവന്ന് അവനോടു വിവരം അറിയിച്ചു
  rationale: തുടർച്ചയായ ആഖ്യാനക്രിയകളെ സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; נגד എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘അറിയിക്കുക/വിവരം അറിയിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: דְּבַר יְהוָה הוּא
  choice: ഇത് യഹ്‌വെയുടെ വചനമാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യത്തിന്റെ തിരിച്ചറിയൽ-ഊന്നൽ ‘ഇത് ... ആണ്’ എന്ന സ്വാഭാവിക മലയാള ഘടനയിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּיַד עַבְדּוֹ
  choice: തന്റെ ദാസനായ ... ഏലിയാവിലൂടെ
  rationale: ‘കൈയാൽ’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ പ്രവാചകമധ്യസ്ഥതയെയോ പ്രവർത്തകത്വത്തെയോ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമാകാതെ ‘-ലൂടെ’ അതു വ്യക്തമാക്കുന്നു.
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  choice: തിശ്ബ്യനായ ഏലിയാവ്
  rationale: വ്യക്തിനാമവും സ്വദേശസൂചകമായ വിശേഷണവും മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: യിസ്രെയേലിന്റെ ഭൂപ്രദേശത്ത്
  rationale: חֵלֶק എന്ന പദത്തിന് ഭാഗം, ഭൂവിഭാഗം, സ്ഥലഖണ്ഡം എന്നീ അർഥങ്ങൾ വരാം. സന്ദർഭത്തിലെ ഭൂമിശാസ്ത്രപരമായ അർഥം വ്യക്തമാക്കിക്കൊണ്ട് പദത്തിന്റെ പരിധി അനാവശ്യമായി ഒരു ചെറിയ പറമ്പിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: നായ്ക്കൾ ... തിന്നും
  rationale: ‘തിന്നുക’ എന്ന നേരിട്ടുള്ള അർഥം പ്രവചനത്തിന്റെ കടുപ്പം അലങ്കാരമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: בְּשַׂר אִיזָבֶל
  choice: ഈസബേലിന്റെ മാംസം
  rationale: בָּשָׂר എന്നത് ‘ശരീരം’ എന്ന പൊതുവായ പദത്തേക്കാൾ വ്യക്തമായി ‘മാംസം’ എന്നാണ്; ന്യായവിധിയുടെ ഭീകരമായ ദൃശ്യത നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ പ്രത്യേക നാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ, അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാള ലിപിയിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു. ‘യഹ്‌വെ’ എന്ന രൂപം സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് അടുത്തതാണ്.
- issue: בְּיַד എന്ന പ്രവാചകമധ്യസ്ഥതാ പ്രയോഗം
  choice: ഏലിയാവിലൂടെ
  alternative: ഏലിയാവിന്റെ കൈയാൽ
  rationale: മൂലത്തിലെ പ്രവർത്തകത്വം സൂക്ഷിക്കുമ്പോഴും ദൈവം ഏലിയാവിന്റെ ശാരീരിക കൈ ഉപയോഗിച്ചു സംസാരിച്ചു എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു; പ്രത്യേക സമുദായപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അരുളിച്ചെയ്തു’ പോലുള്ള മൂലത്തിൽ ഇല്ലാത്ത അധിക ഭക്തിഭാവസൂചന ഒഴിവാക്കി ‘പറഞ്ഞിരുന്നു’ ഉപയോഗിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ പ്രവചനം ചുരുക്കവും ശക്തവുമാക്കി നിലനിർത്തി.
