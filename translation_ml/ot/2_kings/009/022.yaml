source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְא֤וֹת יְהוֹרָם֙ אֶת יֵה֔וּא וַ/יֹּ֖אמֶר הֲ/שָׁל֣וֹם יֵה֑וּא וַ/יֹּ֨אמֶר֙ מָ֣ה הַ/שָּׁל֔וֹם עַד זְנוּנֵ֞י אִיזֶ֧בֶל אִמְּ/ךָ֛ וּ/כְשָׁפֶ֖י/הָ הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
translation:
  language: ml
  text: 'അങ്ങനെ, യെഹോരാം യേഹുവിനെ കണ്ടപ്പോൾ ചോദിച്ചു: “യേഹൂ, സമാധാനമാണോ?” യേഹൂ മറുപടി പറഞ്ഞു: “നിന്റെ അമ്മയായ ഈസേബെലിന്റെ വേശ്യാവൃത്തികളും[a] അവളുടെ അനേകം മന്ത്രവാദങ്ങളും തുടരുന്നിടത്തോളം എന്തു സമാധാനമാണുള്ളത്?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ അമ്മയായ ഈസേബെലിന്റെ വേശ്യാചാരങ്ങൾ.’ ഹീബ്രു പദത്തിന് അക്ഷരാർഥത്തോടൊപ്പം രൂപകാർഥവും ഉണ്ടാകാം; ധാർമികവും ആരാധനാസംബന്ധവുമായ അവിശ്വസ്തതയും അതിൽ ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘എന്തു സമാധാനം?’ യെഹോരാമിന്റെ ചോദ്യത്തിലെ ‘സമാധാനം’ എന്ന പദം ഹീബ്രുവിൽ ഇവിടെ വാചാടോപപരമായി ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: യെഹോരാം ... കണ്ടപ്പോൾ
  rationale: ഹീബ്രു ആഖ്യാനസൂത്രത്തിന്റെ കാലബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; അർഥത്തിൽ ഒന്നും ചേർക്കാതെ വാക്യാരംഭത്തിലെ കൃത്രിമത്വം ഒഴിവാക്കുന്നു.
- source_word: הֲשָׁלוֹם
  choice: സമാധാനമാണോ?
  rationale: ശലോം എന്ന നാമം വ്യക്തമായി നിലനിർത്തുകയും യേഹൂവിന്റെ മറുപടിയിലെ അതേ പദത്തിന്റെ ആവർത്തനത്തിന് വഴിയൊരുക്കുകയും ചെയ്യുന്നു.
- source_word: מָה הַשָּׁלוֹם
  choice: എന്തു സമാധാനം ഉണ്ടാകാനാണ്?
  rationale: സമാധാനം സാധ്യമല്ലെന്ന വാചാടോപപരമായ ചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുമ്പോഴും ‘സമാധാനം’ എന്ന ആവർത്തനം സംരക്ഷിക്കുന്നു.
- source_word: עַד
  choice: തുടരുന്നിടത്തോളം
  rationale: സമാധാനത്തെ അസാധ്യമാക്കുന്ന അവസ്ഥ നിലനിൽക്കുന്ന കാലമത്രയും എന്ന ദൈർഘ്യാർഥം വ്യക്തമാക്കുന്നു.
- source_word: זְנוּנֵי
  choice: വേശ്യാവൃത്തികൾ
  rationale: ലൈംഗികവും രൂപകപരവും ആരാധനാസംബന്ധവുമായ അവിശ്വസ്തതയെ സൂചിപ്പിക്കാൻ കഴിയുന്ന ഹീബ്രു പദത്തിന്റെ ഞെട്ടിക്കുന്ന രൂപകം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: אִיזֶבֶל אִמְּךָ
  choice: നിന്റെ അമ്മയായ ഈസേബെൽ
  rationale: ആരോപണത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിക്കുന്നു.
- source_word: וּכְשָׁפֶיהָ
  choice: അവളുടെ ... മന്ത്രവാദങ്ങൾ
  rationale: മാന്ത്രികവിദ്യാപ്രയോഗങ്ങളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ബഹുവചനത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം നൽകുന്നു.
- source_word: הָרַבִּים
  choice: അനേകം
  rationale: ഈസേബെലിന്റെ മന്ത്രവാദങ്ങളുടെ വലിയ സംഖ്യയെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: זְנוּנֵי എന്ന പദം അക്ഷരാർഥസമീപമായി നൽകണമോ, പൊതുവായ ധാർമികമോ മതപരമോ ആയ പദമായി മയപ്പെടുത്തണമോ
  choice: ‘വേശ്യാവൃത്തികൾ’ എന്നു നൽകി
  alternative: ‘വ്യഭിചാരങ്ങൾ’, ‘വിഗ്രഹാരാധനകൾ’, അല്ലെങ്കിൽ ‘അവിശ്വസ്തതകൾ’
  rationale: മൂലപാഠത്തിലെ മനപ്പൂർവം ഞെട്ടിക്കുന്ന രൂപകം സംരക്ഷിക്കുന്നു. അതിന് ധാർമികവും ആരാധനാസംബന്ധവുമായ സൂചനകൾ ഉണ്ടായേക്കാമെന്നത് അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു; ‘വിഗ്രഹാരാധന’ എന്ന ഒറ്റ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: שָׁלוֹם എന്ന പദത്തിന്റെ രണ്ടു പ്രയോഗങ്ങളും ഒരേ മലയാളപദത്തിൽ നൽകണമോ
  choice: രണ്ടിടത്തും ‘സമാധാനം’ എന്നു നൽകി
  alternative: ആദ്യത്തേത് ‘എല്ലാം സുഖമാണോ?’ അല്ലെങ്കിൽ ‘സമാധാനത്തോടെയാണോ വന്നത്?’ എന്നു നൽകുക
  rationale: യെഹോരാമിന്റെ ചോദ്യവും യേഹൂവിന്റെ മറുചോദ്യവും തമ്മിലുള്ള പദാവർത്തനവും വാചാടോപപരമായ വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മലയാളം. ആഖ്യാനസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമാക്കി; എന്നാൽ ‘സമാധാനം’ എന്ന പദാവർത്തനവും കുറ്റാരോപണത്തിന്റെ കടുപ്പവും നിലനിർത്തി. വ്യക്തിനാമങ്ങൾക്ക് പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾരൂപങ്ങളായ ‘യെഹോരാം’, ‘യേഹൂ’, ‘ഈസേബെൽ’ എന്നിവ ഉപയോഗിച്ചു.
