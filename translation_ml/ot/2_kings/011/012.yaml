id: 2KI.11.12
reference: 2 Kings 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּוֹצִ֣א אֶת בֶּן הַ/מֶּ֗לֶךְ וַ/יִּתֵּ֤ן עָלָי/ו֙ אֶת הַ/נֵּ֨זֶר֙ וְ/אֶת הָ֣/עֵד֔וּת וַ/יַּמְלִ֥כוּ אֹת֖/וֹ וַ/יִּמְשָׁחֻ֑/הוּ וַ/יַּכּוּ כָ֔ף וַ/יֹּאמְר֖וּ יְחִ֥י הַ/מֶּֽלֶךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/012.yaml
  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
translation:
  language: ml
  text: പിന്നെ അവൻ രാജകുമാരനെ പുറത്തുകൊണ്ടുവന്ന് അവന്റെ തലയിൽ കിരീടം വെക്കുകയും അവന് സാക്ഷ്യം[a] നൽകുകയും ചെയ്തു. അവർ അവനെ രാജാവാക്കി അഭിഷേകം ചെയ്തു; പിന്നെ കൈകൊട്ടി, “രാജാവ് നീണാൾ വാഴട്ടെ!” എന്നു വിളിച്ചുപറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സാക്ഷ്യരേഖ’; ‘ഉടമ്പടിരേഖ’ എന്നോ ‘രാജശാസനം’ എന്നോ അർഥമാകാം. ഹീബ്രുവിൽ അക്ഷരാർഥം ‘സാക്ഷ്യം’ എന്നാണ്; രാജാവിന്റെ ഭരണവുമായി ബന്ധപ്പെട്ട ഒരു എഴുത്തുരേഖയായിരിക്കാം ഇത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: പുറത്തുകൊണ്ടുവന്നു
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘പുറത്തേക്കു കൊണ്ടുവരുക’ എന്ന കാരണാർത്ഥം നൽകുന്നു; സന്ദർഭത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: രാജകുമാരനെ
  rationale: അക്ഷരാർഥം ‘രാജാവിന്റെ മകൻ’; ഈ രാജകീയ സന്ദർഭത്തിൽ ‘രാജകുമാരൻ’ എന്നത് സ്വാഭാവികവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: הַנֵּזֶר
  choice: കിരീടം
  rationale: രാജസ്ഥാനത്തിന്റെ ചിഹ്നമായ נֵזֶר എന്ന പദത്തിന് സാധാരണ വായനക്കാർക്കു വ്യക്തമായ സമകാലിക തുല്യപദം.
- source_word: הָעֵדוּת
  choice: സാക്ഷ്യരേഖ
  rationale: עֵדוּת എന്നതിന്റെ ‘സാക്ഷ്യം’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും ഇവിടെ രാജാവിന് കൈമാറാവുന്ന എഴുത്തുരേഖയായിരിക്കാമെന്ന സന്ദർഭസൂചന അറിയിക്കുകയും ചെയ്യുന്നു; അതിന്റെ കൃത്യമായ സ്വഭാവം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: അവനെ രാജാവാക്കി
  rationale: מלך എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘ഒരാളെ രാജാവാക്കുക’ എന്ന കാരണാർത്ഥം നേരിട്ട് പകരുന്നു; കിരീടം വെച്ചതുമായി അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: അഭിഷേകം ചെയ്തു
  rationale: രാജകീയ സ്ഥാനാരോഹണത്തിലെ משׁח എന്ന ഔപചാരിക ക്രിയയുടെ അംഗീകൃതവും വ്യക്തവുമായ മലയാള തുല്യപദം.
- source_word: וַיַּכּוּ כָף
  choice: കൈകൊട്ടി
  rationale: അക്ഷരാർഥത്തിൽ കൈപ്പത്തി അടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം പൊതുസമ്മതിയുടെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: יְחִי הַמֶּלֶךְ
  choice: രാജാവ് നീണാൾ വാഴട്ടെ!
  rationale: രാജാവിന്റെ ദീർഘായുസ്സിനായുള്ള ആശംസയും പൊതുഘോഷണത്തിന്റെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: കിരീടധാരണരംഗത്തിലെ הָעֵדוּת എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘സാക്ഷ്യരേഖ’
  alternative: ‘സാക്ഷ്യം’, ‘ഉടമ്പടിരേഖ’, അല്ലെങ്കിൽ ‘രാജശാസനം’
  rationale: ഹീബ്രു പദം അടിസ്ഥാനപരമായി ‘സാക്ഷ്യം’ എന്നാണ്; ഇവിടെ അത് രാജാവിന്റെ ഭരണവുമായി ബന്ധപ്പെട്ട എഴുത്തുരേഖയെ സൂചിപ്പിച്ചേക്കാം. എന്നാൽ നിയമഗ്രന്ഥമോ ഉടമ്പടിരേഖയോ രാജശാസനമോ എന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പ്രത്യേക വ്യാഖ്യാനം നിർബന്ധിക്കാതെ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജകീയ സ്ഥാനാരോഹണത്തിന്റെ ഔപചാരികഭാവം നിലനിർത്തിക്കൊണ്ട് അപരിചിതമായ അതിപുരാതന പദങ്ങൾ ഒഴിവാക്കി. ‘അവന്റെ തലയിൽ’ എന്നത് മലയാളത്തിൽ കിരീടം വെക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന സന്ദർഭപൂരണമാണു.
