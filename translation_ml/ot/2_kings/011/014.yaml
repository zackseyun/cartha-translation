  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
translation:
  language: ml
  text: അവൾ നോക്കിയപ്പോൾ, അതാ, പതിവനുസരിച്ച് രാജാവ് തൂണിനരികിൽ[a] നിൽക്കുന്നു; പ്രഭുക്കന്മാരും കാഹളങ്ങളും രാജാവിനരികിലുണ്ട്; ദേശത്തിലെ ജനമെല്ലാം ആഹ്ലാദിച്ച് കാഹളം ഊതുന്നു. അപ്പോൾ അഥല്യാ തന്റെ വസ്ത്രങ്ങൾ കീറിക്കൊണ്ട്, “ഗൂഢാലോചന! ഗൂഢാലോചന!”[b] എന്നു നിലവിളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തൂണിന്മേൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു മുൻനിലപദം ഒന്നിലധികം സ്ഥലബന്ധാർഥങ്ങളിൽ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “രാജദ്രോഹം! രാജദ്രോഹം!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: അവൾ നോക്കിയപ്പോൾ, അതാ
  rationale: ראה എന്ന ക്രിയയുടെ ദർശനാർഥവും הִנֵּה നൽകുന്ന പെട്ടെന്നുള്ള നാടകീയ തിരിച്ചറിവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמֶּלֶךְ עֹמֵד
  choice: രാജാവ് ... നിൽക്കുന്നു
  rationale: ഹീബ്രു കർത്തൃവാചക രൂപം ദൃശ്യത്തിന്റെ പുരോഗമിക്കുന്ന സ്വഭാവം അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ വർത്തമാനകാല ദൃശ്യാവിഷ്കാരം അതിനെ സ്വാഭാവികമായി പകരുന്നു.
- source_word: עַל הָעַמּוּד
  choice: തൂണിനരികിൽ
  rationale: עַל ഇവിടെ മുകളിലുള്ള സ്ഥാനം എന്നതിലുപരി ആചാരപരമായ ഒരു തൂണോടോ നിശ്ചിത സ്ഥാനത്തോടോ ഉള്ള സ്ഥലബന്ധം സൂചിപ്പിക്കാം; അവ്യക്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: כַּמִּשְׁפָּט
  choice: പതിവനുസരിച്ച്
  rationale: ഇവിടെ מִשְׁפָּט ന്യായവിധിയെയല്ല, രാജകീയ ചടങ്ങിലെ സ്ഥാപിതമായ പതിവിനെയോ ക്രമത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: וְהַשָּׂרִים
  choice: പ്രഭുക്കന്മാർ
  rationale: שָׂרִים ഉദ്യോഗസ്ഥർ, നേതാക്കൾ, സൈനികമേധാവികൾ എന്നിവരെ സൂചിപ്പിക്കാവുന്ന വിശാലപദമാണ്; പ്രത്യേക പദവി അനാവശ്യമായി നിശ്ചയിക്കാതെ മാന്യമായ പൊതുപദം ഉപയോഗിച്ചു.
- source_word: וְהַחֲצֹצְרוֹת
  choice: കാഹളങ്ങൾ
  rationale: ഹീബ്രു പാഠം വാദ്യോപകരണങ്ങളെയാണ് നേരിട്ട് പറയുന്നത്; കാഹളം ഊതുന്നവരെ ഉദ്ദേശിക്കുന്ന ലക്ഷണപ്രയോഗമാകാമെങ്കിലും ആ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
- source_word: כָל עַם הָאָרֶץ
  choice: ദേശത്തിലെ ജനമെല്ലാം
  rationale: പ്രദേശത്തെ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമായി പകർന്നു.
- source_word: שָׂמֵחַ וְתֹקֵעַ בַּחֲצֹצְרוֹת
  choice: ആഹ്ലാദിച്ച് കാഹളം ഊതുന്നു
  rationale: പൊതുആഘോഷത്തിലെ സജീവമായ സന്തോഷവും കാഹളം മുഴക്കുന്നതും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַתִּקְרַע ... אֶת בְּגָדֶיהָ
  choice: തന്റെ വസ്ത്രങ്ങൾ കീറിക്കൊണ്ട്
  rationale: ഭീതിയും പ്രതിഷേധവും പ്രകടിപ്പിക്കുന്ന പുരാതന പ്രവൃത്തിയെ സുതാര്യമായി പകരുന്നു; തുടർന്നുള്ള നിലവിളിയോടുള്ള സംഭവബന്ധവും നിലനിർത്തുന്നു.
- source_word: קֶשֶׁר קָשֶׁר
  choice: ഗൂഢാലോചന! ഗൂഢാലോചന!
  rationale: קֶשֶׁר എന്നത് അധികാരം അട്ടിമറിക്കാനുള്ള കൂട്ടുകെട്ടിനെയോ ഗൂഢാലോചനയെയോ സൂചിപ്പിക്കുന്നു; ആവർത്തനത്തിന്റെ അടിയന്തരത അതേപടി നിലനിർത്തി.
theological_decisions:
- issue: קֶשֶׁר എന്ന ആരോപണത്തിന്റെ സ്വഭാവം
  choice: ഗൂഢാലോചന
  alternative: രാജദ്രോഹം
  rationale: മുഖ്യപദം രാഷ്ട്രീയ കൂട്ടുകെട്ടിനെയും അധികാരത്തിനെതിരായ പദ്ധതിയെയും സൂചിപ്പിക്കുന്നു; ‘രാജദ്രോഹം’ അഥല്യായുടെ കാഴ്ചപ്പാടിലെ നിയമവിരുദ്ധതയെ കൂടുതൽ ശക്തമായി വ്യാഖ്യാനിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിലെ പര്യായമായി നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അതാ’ എന്നത് ഹീബ്രുവിലെ നാടകീയ ദൃശ്യസൂചന നിലനിർത്തുന്നു. ‘കാഹളങ്ങൾ’ എന്ന മൂലപാഠത്തിലെ ഉപകരണനാമം, കാഹളം ഊതുന്നവരെ ഉദ്ദേശിക്കുന്ന ലക്ഷണപ്രയോഗമാകാനുള്ള സാധ്യത ഉണ്ടായിട്ടും, വ്യാഖ്യാനപരമായി മാറ്റിയിട്ടില്ല.
