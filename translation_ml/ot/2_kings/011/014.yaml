  to: അവൾ നോക്കിയപ്പോൾ, അതാ, പതിവനുസരിച്ച് രാജാവ് തൂണിനരികിൽ[a] നിൽക്കുന്നു; പ്രഭുക്കന്മാരും കാഹളങ്ങളും രാജാവിനരികിലുണ്ട്; ദേശത്തിലെ ജനമെല്ലാം ആഹ്ലാദിച്ച് കാഹളം ഊതുന്നു. അപ്പോൾ അഥല്യാ തന്റെ വസ്ത്രങ്ങൾ കീറിക്കൊണ്ട്, “ഗൂഢാലോചന! ഗൂഢാലോചന!”[b] എന്നു നിലവിളിച്ചു.
