  text: וַ/תִּשְׁמַ֣ע עֲתַלְיָ֔ה אֶת ק֥וֹל הָֽ/רָצִ֖ין הָ/עָ֑ם וַ/תָּבֹ֥א אֶל הָ/עָ֖ם בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/013.yaml
  text: When Athaliah heard the noise of the guards and of the people[c][b][a], she came to the people in the house of Yahweh.
translation:
  language: ml
  text: കാവൽക്കാരുടെയും[a] ജനത്തിന്റെയും ശബ്ദം[b] അഥല്യാ കേട്ടപ്പോൾ, അവൾ യഹ്‌വേയുടെ ആലയത്തിൽ[c] ജനത്തിന്റെ അടുക്കൽ ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഓട്ടക്കാർ’; രാജാവിന്റെ കാവൽക്കാരെയോ അംഗരക്ഷകസേനയെയോ സൂചിപ്പിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സ്വരം’ എന്നോ സന്ദർഭത്തിൽ ‘ആരവം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ‘യഹ്‌വേയുടെ ഭവനം’; അതായത് ദേവാലയപരിസരം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: കേട്ടപ്പോൾ
  rationale: ശׁמע ഇവിടെ കഥാഖ്യാനത്തിൽ സാധാരണ ശ്രവണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സമയബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘കേട്ടപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עֲתַלְיָה
  choice: അഥല്യാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്നുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: קוֹל
  choice: ശബ്ദം
  rationale: קוֹל എന്നതിന് ശബ്ദം, സ്വരം, ആരവം എന്നീ അർഥസാധ്യതകളുണ്ട്. മൂലത്തിലെ പൊതുവായ അർഥവ്യാപ്തി നിലനിർത്താൻ ‘ശബ്ദം’ തെരഞ്ഞെടുത്തു.
- source_word: הָרָצִין
  choice: കാവൽക്കാർ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘ഓട്ടക്കാർ’ എന്നാണെങ്കിലും രാജകീയ സന്ദർഭത്തിൽ ഇത് അംഗരക്ഷകസേനയെ സൂചിപ്പിക്കുന്നു; പ്രവർത്തനപരമായ അർഥം ‘കാവൽക്കാർ’ വ്യക്തമാക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: עָם എന്ന സാധാരണ പദത്തിന്റെ അർഥം നിലനിർത്തുന്നു; ഇവിടെ കൂടിവന്ന ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַתָּבֹא אֶל
  choice: അടുക്കൽ ചെന്നു
  rationale: בוא + אֶל ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു. ആഖ്യാനസന്ദർഭത്തിൽ ‘അടുക്കൽ ചെന്നു’ സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: בֵּית എന്നതിന്റെ സന്ദർഭോചിത അർഥം ദേവാലയമാണ്; ദിവ്യനാമം יְהוָה ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള നിയമനാമം പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: הָרָצִין എന്ന സംഘത്തിന്റെ തിരിച്ചറിയൽ
  choice: കാവൽക്കാർ
  alternative: ഓട്ടക്കാർ
  rationale: രാജകീയ പശ്ചാത്തലത്തിൽ പദം അംഗരക്ഷകസേനയെ സൂചിപ്പിക്കാമെങ്കിലും അക്ഷരാർഥം ഉറപ്പോടെ ഇല്ലാതാക്കാതിരിക്കാൻ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ആലയം’ ദേവാലയസന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
