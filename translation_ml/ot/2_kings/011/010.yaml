reference: 2 Kings 11:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/כֹּהֵ֜ן לְ/שָׂרֵ֣י ה/מאיות אֶֽת הַ/חֲנִית֙ וְ/אֶת הַ/שְּׁלָטִ֔ים אֲשֶׁ֖ר לַ/מֶּ֣לֶךְ דָּוִ֑ד אֲשֶׁ֖ר בְּ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/010.yaml
  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
translation:
  language: ml
  text: അപ്പോൾ പുരോഹിതൻ നൂറുപേരടങ്ങിയ സൈനികവിഭാഗങ്ങളുടെ അധിപന്മാർക്ക്, യഹോവയുടെ ഭവനത്തിൽ[b] ഉണ്ടായിരുന്ന ദാവീദ് രാജാവിന്റെ കുന്തങ്ങളും[a] പരിചകളും കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘കുന്തം’ എന്ന ഏകവചനമാണ്; ഇവിടെ അത് സമൂഹവാചകമായി ഉപയോഗിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യഹോവയുടെ ദേവാലയത്തിൽ.’ അക്ഷരാർഥത്തിൽ, ‘യഹോവയുടെ ഭവനത്തിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: അപ്പോൾ ... കൊടുത്തു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: നിശ്ചയാർഥക ഏകവചന നാമത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: നൂറുപേരടങ്ങിയ സൈനികവിഭാഗങ്ങളുടെ അധിപന്മാർക്ക്
  rationale: ഓരോ നൂറുപേരുള്ള സൈനികവിഭാഗത്തിന്റെയും മേധാവികളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַחֲנִית
  choice: കുന്തങ്ങൾ
  rationale: രൂപപരമായി ഏകവചനമാണെങ്കിലും, അനേകം അധിപന്മാർക്ക് ആയുധങ്ങൾ നൽകുന്ന സന്ദർഭത്തിലും ബഹുവചനമായ ‘പരിചകൾ’ എന്ന പദത്തോടുള്ള കൂട്ടിച്ചേർക്കലിലും ഇത് സമൂഹവാചകമായി മനസ്സിലാക്കുന്നതാണ് ഏറ്റവും യോജ്യം.
- source_word: הַשְּׁלָטִים
  choice: പരിചകൾ
  rationale: രാജകീയ ആയുധശേഖരത്തിന്റെ ഈ സന്ദർഭത്തിൽ പ്രതിരോധായുധങ്ങളായ പരിചകളെയാണ് പദം ഏറ്റവും സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവിന്റെ
  rationale: ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ ഷഷ്ഠീവിഭക്തിയിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: בְּבֵית יְהוָה
  choice: യഹോവയുടെ ഭവനത്തിൽ
  rationale: ‘യഹോവയുടെ ഭവനം’ എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; ഇവിടെ അത് ദേവാലയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് വന്നിരിക്കുന്നതിനാൽ അതിനെ ‘യഹോവ’ എന്നു നിലനിർത്തുന്നു; ‘കർത്താവ്’ എന്നു പകരംവെച്ച് വ്യക്തിനാമവും സ്ഥാനപ്പേരും തമ്മിലുള്ള വ്യത്യാസം മായ്ക്കുന്നില്ല.
- issue: הַחֲנִית ഏകവചനമോ സമൂഹവാചകമോ
  choice: കുന്തങ്ങൾ
  alternative: കുന്തം
  rationale: എബ്രായ രൂപം ഏകവചനമാണെന്ന യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു; എന്നാൽ അനേകം സൈനികാധിപന്മാർക്കുള്ള ആയുധവിതരണസന്ദർഭം സമൂഹവാചക അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സൈനികഘടന വ്യക്തമാക്കാൻ ‘നൂറുപേരടങ്ങിയ സൈനികവിഭാഗങ്ങൾ’ എന്നു വികസിപ്പിച്ചു; ദൈവനാമവും ‘ഭവനം’ എന്ന എബ്രായ രൂപകവും പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
