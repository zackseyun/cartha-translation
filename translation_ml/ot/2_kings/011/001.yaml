source:
  edition: WLC
  text: וַֽ/עֲתַלְיָה֙ אֵ֣ם אֲחַזְיָ֔הוּ ו/ראתה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֨קָם֙ וַ/תְּאַבֵּ֔ד אֵ֖ת כָּל זֶ֥רַע הַ/מַּמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/001.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
translation:
  language: ml
  text: അഹസ്യാവിന്റെ അമ്മയായ അഥല്യാ, തന്റെ മകൻ മരിച്ചുവെന്ന് കണ്ടു. അപ്പോൾ അവൾ എഴുന്നേറ്റ് രാജവംശത്തിലെ എല്ലാ സന്തതികളെയും[a] നശിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “രാജ്യത്തിന്റെ വിത്ത്”; അതായത്, രാജവംശത്തിലെ സന്തതികൾ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲתַלְיָה אֵם אֲחַזְיָהוּ
  choice: അഹസ്യാവിന്റെ അമ്മയായ അഥല്യാ
  rationale: പേരും ബന്ധസൂചനയും സ്വാഭാവികമായ മലയാള ശൈലിയിൽ ചേർത്തു. വാക്യാരംഭത്തിലെ וַ־യ്ക്ക് പ്രത്യേകം കാലസൂചകപദം ചേർക്കാതെ ആഖ്യാനത്തുടർച്ച മലയാള വാക്യഘടനയിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: וַתֵּרֶא כִּי מֵת בְּנָהּ
  choice: തന്റെ മകൻ മരിച്ചെന്നു കണ്ടപ്പോൾ
  rationale: ראה + כי ഒരു വസ്തുത മനസ്സിലാക്കുകയോ കാണുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. מֵת എന്നതിന്റെ ഫലാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി ‘മരിച്ചെന്നു’ എന്നു നൽകി.
- source_word: וַתָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: തീരുമാനപൂർവമായ പ്രവർത്തനത്തിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന קום എന്ന ക്രിയയുടെ ആഖ്യാനശക്തി നിലനിർത്തുന്നു.
- source_word: וַתְּאַבֵּד
  choice: നശിപ്പിച്ചു
  rationale: പിയേൽ രൂപം കാരണാത്മകമായ നാശത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ കൊലപ്പെടുത്തലാണ് ഉദ്ദേശ്യമെങ്കിലും, രീതി അധികമായി നിർണ്ണയിക്കാതെ എബ്രായത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: രാജവംശത്തിലെ സന്തതികളെയെല്ലാം
  rationale: זֶרַע അക്ഷരാർഥത്തിൽ ‘വിത്ത്’ ആണെങ്കിലും ഇവിടെ രാജകീയ വംശപരമ്പരയിലെ സന്തതികളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘രാജവംശത്തിലെ സന്തതികൾ’ ആ വംശപരമായ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
