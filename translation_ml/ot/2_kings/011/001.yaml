translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അഥല്യാ’, ‘അഹസ്യാവ്’ എന്നീ രൂപങ്ങൾ മലയാള ബൈബിൾപാരമ്പര്യത്തോട് ചേർന്ന ലിപ്യന്തരണങ്ങളാണ്. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ‘രാജവംശത്തിലെ സന്തതികൾ’ എന്ന പ്രയോഗത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
