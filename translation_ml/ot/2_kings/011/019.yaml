source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ֠/מֵּאוֹת וְ/אֶת הַ/כָּרִ֨י וְ/אֶת הָ/רָצִ֜ים וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יֹּרִ֤ידוּ אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּב֛וֹאוּ דֶּֽרֶך שַׁ֥עַר הָ/רָצִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יֵּ֖שֶׁב עַל כִּסֵּ֥א הַ/מְּלָכִֽים־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
translation:
  language: ml
  text: പിന്നെ അദ്ദേഹം നൂറുപേരുടെ അധിപന്മാരെയും കാരികളെയും[a] ഓട്ടക്കാരെയും[b] ദേശത്തിലെ സകല ജനത്തെയും കൂട്ടിച്ചേർത്തു. അവർ രാജാവിനെ യഹ്‌വെയുടെ ആലയത്തിൽനിന്ന് താഴേക്കു കൊണ്ടുവന്നു; ഓട്ടക്കാരുടെ കവാടംവഴി രാജഭവനത്തിലേക്കു വന്നു. രാജാവ് രാജാക്കന്മാരുടെ സിംഹാസനത്തിൽ ഇരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കാരികൾ” എന്ന എബ്രായപദം അനിശ്ചിതമാണ്; “കെരേത്യർ” എന്നോ “അംഗരക്ഷകർ” എന്നോ അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: “ഓട്ടക്കാർ” എന്നത് ഇവിടെ രാജകീയ കാവൽക്കാരെയോ സന്ദേശവാഹകരെയോ സൂചിപ്പിക്കുന്നതാകാം; “ഓട്ടക്കാരുടെ കവാടം” എന്നതിലും ഇതേ പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: പിന്നെ അദ്ദേഹം ... കൂട്ടിക്കൊണ്ടുപോയി
  rationale: ഏകവചന ക്രിയയുടെ കർത്താവ് യെഹോയാദയാണ്. പട്ടികപ്പെടുത്തിയവരെ ഒപ്പം കൂട്ടിയെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: നൂറുപേരുടെ അധിപന്മാർ
  rationale: റോമൻ സൈനികപദവി സൂചിപ്പിക്കാതെ എബ്രായ സൈനികഘടനയും സംഖ്യാത്മക രൂപവും നിലനിർത്തുന്നു.
- source_word: הַכָּרִי
  choice: കാരികൾ
  rationale: പദത്തിന്റെ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ പ്രവർത്തനപരമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ എബ്രായരൂപം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הָרָצִים
  choice: ഓട്ടക്കാർ
  rationale: അക്ഷരാർഥത്തിലുള്ള ദൃശ്യരൂപം നിലനിർത്തുന്നു; രാജകീയ കാവൽക്കാരോ ദൂതരോ ആയിരിക്കാമെന്ന പ്രവർത്തനാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כָּל עַם הָאָרֶץ
  choice: ദേശത്തിലെ സകല ജനം
  rationale: ഇത് സാധാരണക്കാരെ മാത്രം അല്ലെങ്കിൽ മുഴുവൻ രാഷ്ട്രത്തെയും മാത്രം സൂചിപ്പിക്കുന്നു എന്നു ചുരുക്കാതെ എബ്രായ പ്രയോഗത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וַיֹּרִידוּ אֶת הַמֶּלֶךְ
  choice: അവർ രാജാവിനെ ... താഴേക്ക് കൊണ്ടുവന്നു
  rationale: ബഹുവചനക്രിയയിൽ കർത്താവ് കൂട്ടമായി മാറുന്നതും ആലയപരിസരത്തുനിന്നുള്ള ദിശാസൂചനയും നിലനിർത്തുന്നു.
- source_word: מִבֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ആലയത്തിൽനിന്ന്
  rationale: മലയാളത്തിൽ ആരാധനാലയം വ്യക്തമായി സൂചിപ്പിക്കാൻ 'ആലയം' ഉപയോഗിക്കുകയും ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: דֶּרֶך שַׁעַר הָרָצִים
  choice: ഓട്ടക്കാരുടെ കവാടംവഴി
  rationale: പദബന്ധത്തിന്റെ ഔദ്യോഗിക സ്ഥാനനാമസദൃശ രൂപവും הָרָצִים എന്ന പദത്തിന്റെ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജകൊട്ടാരം
  rationale: ആധുനിക മലയാളത്തിൽ രാജാവിന്റെ വാസസ്ഥലം സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: וַיֵּשֶׁב
  choice: രാജാവ് ... ഇരുന്നു
  rationale: ഏകവചനക്രിയയുടെ കർത്താവ് രാജാവാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി ആവർത്തിക്കുന്നു; സിംഹാസനാരോഹണസന്ദർഭം പിന്നാലെയുള്ള പദങ്ങൾ നൽകുന്നു.
- source_word: עַל כִּסֵּא הַמְּלָכִים
  choice: രാജാക്കന്മാരുടെ സിംഹാസനത്തിൽ
  rationale: രാജവംശപരമായ അവകാശപരമ്പരയെ സൂചിപ്പിക്കാവുന്ന എബ്രായ ബഹുവചനം 'രാജകീയ സിംഹാസനം' എന്നു സമതലപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്താനും ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതിരിക്കാനും 'യഹ്‌വെ' ഉപയോഗിക്കുന്നു.
- issue: כִּסֵּא הַמְּלָכִים എന്നതിലെ ബഹുവചനം
  choice: രാജാക്കന്മാരുടെ സിംഹാസനം
  alternative: രാജകീയ സിംഹാസനം
  rationale: രാജവംശാവകാശത്തിന്റെ സൂചന ഉൾക്കൊള്ളുന്ന മൂലപാഠത്തിലെ ബഹുവചനം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അനിശ്ചിത സൈനികപദങ്ങൾ അമിതമായി വ്യാഖ്യാനിക്കാതെ അടിക്കുറിപ്പുകളിൽ സാധ്യതകൾ സൂക്ഷിച്ചു; നീണ്ട എബ്രായ വാക്യം വായനാസൗകര്യത്തിന് രണ്ട് മലയാളവാക്യങ്ങളാക്കി.
