    rationale: וַיָּבֹאוּ എന്നത് അവർ രാജാവിന്റെ ഭവനത്തിലേക്കു വന്നു എന്നാണ് പറയുന്നത്; അകത്തു പ്രവേശിച്ചു എന്ന അധിക നിർവചനം മൂലപാഠത്തിൽ വ്യക്തമായി ഇല്ല.
  revised_text: പിന്നെ അദ്ദേഹം നൂറുപേരുടെ അധിപന്മാരെയും കാരികളെയും[a] ഓട്ടക്കാരെയും[b] ദേശത്തിലെ സകല ജനത്തെയും കൂട്ടിച്ചേർത്തു. അവർ രാജാവിനെ യഹ്‌വെയുടെ ആലയത്തിൽനിന്ന് താഴേക്കു കൊണ്ടുവന്നു; ഓട്ടക്കാരുടെ കവാടംവഴി രാജഭവനത്തിലേക്കു വന്നു. രാജാവ് രാജാക്കന്മാരുടെ സിംഹാസനത്തിൽ ഇരുന്നു.
