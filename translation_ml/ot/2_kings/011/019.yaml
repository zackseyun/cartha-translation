  revision_rationale: യെഹോയാദയുടെ പ്രാരംഭ പ്രവർത്തനവും തുടർന്ന് സംഘത്തിന്റെ കൂട്ടായ പ്രവർത്തനവും വ്യക്തമായി വേർതിരിക്കാൻ “കൂട്ടിച്ചേർത്തു” ഉപയോഗിച്ചു. രാജകൊട്ടാരത്തിൽ എത്തിയെന്ന മൂലപാഠത്തിന്റെ പരിധി കാക്കാൻ ‘പ്രവേശിച്ചു’ എന്ന അധിക ക്രിയയ്ക്ക് പകരം “രാജഭവനത്തിലേക്കു വന്നു” എന്നു പരിഷ്കരിച്ചു. പദാനിശ്ചിതത്വങ്ങൾ, ദൈവനാമം, രാജവംശസൂചക ബഹുവചനം, അടിക്കുറിപ്പ്-ആങ്കറുകൾ എന്നിവ മാറ്റമില്ലാതെ സൂക്ഷിച്ചു.
