source:
  edition: WLC
  text: וַ/יְהִ֤י אִתָּ/הּ֙ בֵּ֣ית יְהוָ֔ה מִתְחַבֵּ֖א שֵׁ֣שׁ שָׁנִ֑ים וַ/עֲתַלְיָ֖ה מֹלֶ֥כֶת עַל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/003.yaml
  text: And he was with her in the house of the LORD, hiding for six years, while Athaliah was reigning over the land.
translation:
  language: ml
  text: അവൻ അവളോടൊപ്പം യഹോവയുടെ ആലയത്തിൽ ആറു വർഷം ഒളിവിൽ കഴിഞ്ഞു. അക്കാലത്ത് അഥല്യ ദേശം ഭരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: ദൈവനാമത്തെ ‘യഹോവ’ എന്നു പ്രതിനിധീകരിക്കുകയും, സന്ദർഭത്തിൽ ‘വീട്’ എന്നതിനെക്കാൾ സ്വാഭാവികവും കൃത്യവുമായ ‘ആലയം’ ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: מִתְחַבֵּא
  choice: ഒളിച്ചുകഴിഞ്ഞു
  rationale: ഹിത്പയേൽ രൂപം ഇവിടെ തുടരുന്ന ഒളിവുജീവിതത്തെ സൂചിപ്പിക്കുന്നു; ‘ഒളിപ്പിക്കപ്പെട്ടിരുന്നു’ എന്ന നിർവചനത്തിലേക്ക് മാറാതെ കർത്തൃവാചകത്തിലെ അർഥം നിലനിർത്തുന്നു.
- source_word: מֹלֶכֶת עַל הָאָרֶץ
  choice: ദേശം ഭരിക്കുകയായിരുന്നു
  rationale: സ്ത്രീലിംഗ വർത്തമാന കൃദ്യന്തത്തിന്റെ തുടർച്ചയായ ഭരണപ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘ദേശം’ രാജഭരണാധീന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: മִתְחַבֵּא എന്ന രൂപത്തിലെ കർത്തൃത്വം
  choice: അവൻ ഒളിച്ചുകഴിഞ്ഞു
  alternative: അവൻ ഒളിപ്പിക്കപ്പെട്ടിരുന്നു
  rationale: മസോററ്റിക് പാഠത്തിലെ കർത്തൃവാചക ഹിത്പയേൽ രൂപം സംരക്ഷിച്ചു; ബാലനെ മറ്റുള്ളവർ ഒളിപ്പിച്ചതെന്ന സന്ദർഭവിവരം ഈ വാക്യത്തിന്റെ വ്യാകരണത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണം. ഹീബ്രു വാക്യത്തിലെ സാഹചര്യവൈരുധ്യം രണ്ട് സ്വാഭാവിക മലയാളവാക്യങ്ങളായി അവതരിപ്പിച്ചെങ്കിലും അർഥബന്ധം നിലനിർത്തി.
