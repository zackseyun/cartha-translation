translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘കൈവെച്ചു’ എന്ന മൂലഭാഷാസന്നിഹിത പ്രയോഗത്തിന്റെ സാധ്യതാപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു; യാത്രാമാർഗത്തിന്റെ കൃത്യരൂപം നിർണയിക്കാതെ മൂലത്തിലെ പൊതുവായ സൂചന നിലനിർത്തുന്നു.
