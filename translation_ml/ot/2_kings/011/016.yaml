source:
  edition: WLC
  text: וַ/יָּשִׂ֤מוּ לָ/הּ֙ יָדַ֔יִם וַ/תָּב֛וֹא דֶּֽרֶךְ מְב֥וֹא הַ/סּוּסִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/תּוּמַ֖ת שָֽׁם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/016.yaml
  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
translation:
  language: ml
  text: അങ്ങനെ അവർ അവളെ പിടികൂടി[a]. അവൾ രാജാവിന്റെ കൊട്ടാരത്തിലേക്കുള്ള കുതിരപ്രവേശനവഴിയിലൂടെ ചെന്നു[b]; അവിടെ അവൾ വധിക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, “അവർ അവളുടെമേൽ കൈകൾ വെച്ചു.” അഥവാ, “അവർ അവളെ പിടികൂടി.” ചിലർ ഈ എബ്രായ പ്രയോഗത്തെ “അവർ അവൾക്കു വഴിയൊരുക്കി” എന്നും മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, “കുതിരകളുടെ പ്രവേശനം.” കുതിരകൾ രാജാവിന്റെ കൊട്ടാരസമുച്ചയത്തിലേക്കു പ്രവേശിച്ചിരുന്ന വഴിയോ പ്രവേശനകവാടമോ ആയിരിക്കാം ഇത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: അവർ അവളുടെമേൽ കൈവെച്ചു
  rationale: ‘അവളുടെമേൽ കൈകൾ വെച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുകയും ഈ സന്ദർഭത്തിലെ പിടിച്ചെടുക്കൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַתָּבֹא
  choice: അവൾ ... ചെന്നു
  rationale: ക്രിയ സജീവരൂപത്തിലാണ്; ദേവാലയപരിസരത്തുനിന്ന് രാജധാനിയിലേക്കുള്ള ആഖ്യാനചലനത്തിന് ‘ചെന്നു’ സ്വാഭാവികമാണ്. ‘അവളെ കൊണ്ടുപോയി’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലത്തിൽ ഇല്ലാത്ത കർമണിപ്രയോഗം ചേർക്കും.
- source_word: דֶּרֶךְ מְבוֹא הַסּוּסִים
  choice: കുതിരകളുടെ പ്രവേശനവഴിയിലൂടെ
  rationale: דֶּרֶךְ എന്നതിന്റെ വഴി/പാത എന്ന അർഥവും מְבוֹא എന്നതിന്റെ പ്രവേശനം/പ്രവേശനസ്ഥലം എന്ന അർഥവും ചേർത്ത് സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘കവാടം’ എന്നു കൂടുതൽ നിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജധാനിയിലേക്ക്
  rationale: അക്ഷരാർഥം ‘രാജാവിന്റെ ഭവനം’ എന്നാണെങ്കിലും ഇവിടെ രാജാവിന്റെ അരമനസമുച്ചയമാണ് ഉദ്ദേശ്യം; ആധുനിക മലയാളത്തിൽ ‘രാജധാനി’ ഈ സ്ഥലാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וַתּוּמַת
  choice: അവളെ കൊന്നുകളഞ്ഞു
  rationale: מות എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം ‘മരണത്തിന് വിധേയയാക്കി/കൊല്ലപ്പെട്ടു’ എന്ന കാരണകർമണി ആശയം നൽകുന്നു. മലയാളത്തിലെ സ്വാഭാവിക കർമണിസമാനമായ ഈ പ്രയോഗം വെറും ‘അവൾ മരിച്ചു’ എന്നതിനെക്കാൾ മൂലരൂപം കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: שָׁם
  choice: അവിടെവെച്ച്
  rationale: വധം നടന്ന സ്ഥലം വ്യക്തമായി അടയാളപ്പെടുത്തുന്ന ലളിതമായ സ്ഥലസൂചകം.
