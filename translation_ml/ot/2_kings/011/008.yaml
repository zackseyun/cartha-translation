id: 2KI.11.8
reference: 2 Kings 11:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקַּפְתֶּ֨ם עַל הַ/מֶּ֜לֶךְ סָבִ֗יב אִ֚ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֔/וֹ וְ/הַ/בָּ֥א אֶל הַ/שְּׂדֵר֖וֹת יוּמָ֑ת וִ/הְי֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/צֵאת֥/וֹ וּ/בְ/בֹאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/008.yaml
  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
translation:
  language: ml
  text: നിങ്ങൾ രാജാവിനെ എല്ലാ വശത്തുനിന്നും വളഞ്ഞുനിൽക്കണം; ഓരോരുത്തനും തന്റെ ആയുധങ്ങൾ കൈയിൽ കരുതണം. കാവൽനിരകൾക്കുള്ളിലേക്കു[a] കടന്നുവരുന്ന ആരായാലും വധിക്കപ്പെടണം. രാജാവ് പുറത്തേക്കു പോകുമ്പോഴും അകത്തേക്കു വരുമ്പോഴും നിങ്ങൾ അവനോടുകൂടെ ഉണ്ടായിരിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിരകളിലേക്കോ വരികളിലേക്കോ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ക്രമമായി അണിനിരന്ന കാവൽക്കാരുടെ നിരകളെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അവൻ പുറത്തേക്കു പോകുന്നതിലും അകത്തേക്കു വരുന്നതിലും.’ രാജാവിന്റെ എല്ലാ നീക്കങ്ങളിലും കൂടെയിരുന്ന് കാവൽ നൽകുക എന്ന ആശയമുള്ള എബ്രായപ്രയോഗമാണിത്.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִקַּפְתֶּם עַל הַמֶּלֶךְ סָבִיב
  choice: നിങ്ങൾ രാജാവിനെ എല്ലാ വശത്തുനിന്നും വളഞ്ഞുനിൽക്കണം
  rationale: ഹിഫീൽ രൂപവും סָבִיב എന്ന പദവും രാജാവിനെ ചുറ്റിയുള്ള സംരക്ഷണവിന്യാസത്തെ സൂചിപ്പിക്കുന്നു. ‘വളഞ്ഞുനിൽക്കണം’ സൈനിക-സംരക്ഷണ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: ഓരോരുത്തനും തന്റെ ആയുധങ്ങൾ കൈയിൽ കരുതണം
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തനും’ എന്നാണ്. כְּלִי എന്നതിന് പല അർഥങ്ങളുണ്ടെങ്കിലും ഈ കാവൽസന്ദർഭത്തിൽ ‘ആയുധങ്ങൾ’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: וְהַבָּא אֶל הַשְּׂדֵרוֹת
  choice: കാവൽനിരകൾക്കുള്ളിലേക്കു കടന്നുവരുന്ന ആരായാലും
  rationale: നിശ്ചയാർഥക ലേഖനത്തോടുകൂടിയ കൃദന്തം പൊതുവായ ‘ആരായാലും’ എന്ന അർഥം നൽകുന്നു. שְּׂדֵרוֹת ക്രമീകരിച്ച നിരകളെയോ അണികളെയോ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നതിനാൽ ‘കാവൽനിരകൾ’ എന്നു നൽകി; പദത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יוּמָת
  choice: വധിക്കപ്പെടണം
  rationale: ഹോഫാൽ രൂപത്തിന്റെ കർമണിപ്രയോഗവും ഔദ്യോഗിക മരണശിക്ഷാ കല്പനയുടെ ഗൗരവവും ഈ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: നിങ്ങൾ അവനോടുകൂടെ ഉണ്ടായിരിക്കണം
  rationale: ഇവിടെ היה + אֶת എന്ന ഘടന രാജാവിനോടൊപ്പമുള്ള സാന്നിധ്യവും സംരക്ഷണചുമതലയും പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  choice: രാജാവ് പുറത്തേക്കു പോകുമ്പോഴും അകത്തേക്കു വരുമ്പോഴും
  rationale: എബ്രായത്തിലെ ‘അവന്റെ പുറപ്പെടലിലും അവന്റെ പ്രവേശനത്തിലും’ എന്ന ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു; എല്ലാ നീക്കങ്ങളിലും കൂടെയിരിക്കണമെന്ന പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ ‘കാവൽനിരകൾ’ തിരഞ്ഞെടുത്തെങ്കിലും, എബ്രായപദത്തിലെ ‘നിരകൾ/വരികൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. കർമണിരൂപമായ יוּמָת മലയാളത്തിലും കർമണിയായി നിലനിർത്തി.
