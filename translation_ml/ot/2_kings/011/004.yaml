revisions:
- from: ഏഴാം വർഷത്തിൽ യഹോയാദ ആളയച്ച് കാരീയരുടെയും[a] ഓട്ടക്കാരുടെയും[b] നൂറുപേർ വീതമുള്ള വിഭാഗങ്ങളുടെ അധിപന്മാരെ വരുത്തി. അവരെ തന്റെ അടുക്കൽ യഹ്‌വെയുടെ ആലയത്തിലേക്കു കൊണ്ടുവന്ന് അവരുമായി ഒരു ഉടമ്പടി ചെയ്തു; യഹ്‌വെയുടെ ആലയത്തിൽവെച്ച് അവരെക്കൊണ്ട് സത്യം ചെയ്യിച്ചശേഷം രാജകുമാരനെ അവർക്കു കാണിച്ചുകൊടുത്തു.
  to: ഏഴാം വർഷത്തിൽ യഹോയാദ ആളയച്ച്, കാരീയരുടെയും[a] ഓട്ടക്കാരുടെയും[b] നൂറുപേരുടെ അധിപന്മാരെ വിളിച്ചുവരുത്തി. അവരെ തന്റെ അടുക്കലേക്ക് യഹ്‌വെയുടെ ആലയത്തിൽ കൊണ്ടുവന്നു. അവരുമായി ഒരു ഉടമ്പടി ചെയ്തു; യഹ്‌വെയുടെ ആലയത്തിൽവെച്ച് അവരെക്കൊണ്ട് സത്യം ചെയ്യിച്ചശേഷം രാജാവിന്റെ മകനെ അവർക്കു കാണിച്ചുകൊടുത്തു.
