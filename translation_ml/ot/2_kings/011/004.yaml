    text: ‘കാരീയർ’ എന്നത് ഒരുതരം രാജകീയ കാവൽസംഘത്തിന്റെ പേരായിരിക്കാം. ചിലർ ഇതിനെ ‘കെരേത്യർ’ എന്നു വായിക്കുന്നു; കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്.
