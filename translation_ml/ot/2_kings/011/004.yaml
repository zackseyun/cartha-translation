source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ֠/שְּׁבִיעִית שָׁלַ֨ח יְהוֹיָדָ֜ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י ה/מאיות לַ/כָּרִי֙ וְ/לָ֣/רָצִ֔ים וַ/יָּבֵ֥א אֹתָ֛/ם אֵלָ֖י/ו בֵּ֣ית יְהוָ֑ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם בְּרִ֜ית וַ/יַּשְׁבַּ֤ע אֹתָ/ם֙ בְּ/בֵ֣ית יְהוָ֔ה וַ/יַּ֥רְא אֹתָ֖/ם אֶת בֶּן הַ/מֶּֽלֶךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
translation:
  language: ml
  text: ഏഴാം വർഷത്തിൽ യഹോയാദ ആളയച്ച്, കാരീയരുടെയും[a] ഓട്ടക്കാരുടെയും[b] നൂറുപേരുടെ അധിപന്മാരെ വിളിച്ചുവരുത്തി. അവരെ തന്റെ അടുക്കലേക്ക് യഹ്‌വെയുടെ ആലയത്തിൽ കൊണ്ടുവന്നു. അവരുമായി ഒരു ഉടമ്പടി ചെയ്തു; യഹ്‌വെയുടെ ആലയത്തിൽവെച്ച് അവരെക്കൊണ്ട് സത്യം ചെയ്യിച്ചശേഷം രാജാവിന്റെ മകനെ അവർക്കു കാണിച്ചുകൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാരീയർ’ എന്നത് ഒരുതരം രാജകീയ കാവൽസംഘത്തിന്റെ പേരായിരിക്കാം. ചിലർ ഇതിനെ ‘കെരേത്യർ’ എന്നു വായിക്കുന്നു; കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥം ‘ഓട്ടക്കാർ.’ ഇവർ രാജാവിന്റെ കാവൽക്കാരോ സന്ദേശവാഹകരോ ആയിരുന്നിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִית
  choice: ഏഴാം വർഷത്തിൽ
  rationale: കഥയുടെ കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; തുടക്കത്തിലെ വാവ് വേറിട്ട് ‘പിന്നെ’ എന്നു പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: שָׁלַח וַיִּקַּח
  choice: ആളയച്ച് ... വരുത്തി
  rationale: ആളെ അയച്ച് ഉദ്യോഗസ്ഥരെ തന്റെ അടുക്കൽ വിളിച്ചുവരുത്തിയെന്ന തുടർച്ചയായ പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שָׂרֵי הַמֵּאוֹת לַכָּרִי וְלָרָצִים
  choice: കാരീയരുടെയും ഓട്ടക്കാരുടെയും നൂറുപേർ വീതമുള്ള വിഭാഗങ്ങളുടെ അധിപന്മാർ
  rationale: ലַכָּרִי וְלָרָצִים എന്നത് ‘നൂറുപേരുടെ അധിപന്മാർ’ ആരുടെ മേലുള്ളവരാണെന്ന് സൂചിപ്പിക്കുന്നതായി വാക്യഘടനയിൽ എടുത്തിരിക്കുന്നു; ‘ശതാധിപൻ’ എന്ന അപരിചിത പദത്തിനു പകരം അർഥം സുതാര്യമാക്കുന്നു.
- source_word: לַכָּרִי
  choice: കാരീയർ
  rationale: കൃത്യമായി തിരിച്ചറിയാനാകാത്ത രാജകീയ കാവൽസംഘത്തിന്റെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְלָרָצִים
  choice: ഓട്ടക്കാർ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തുന്നു; രാജകീയ കാവൽക്കാരോ ദൂതന്മാരോ ആയിരുന്നിരിക്കാമെന്ന പ്രവർത്തനപരമായ വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ആലയം
  rationale: ഇവിടെ ‘യഹ്‌വെയുടെ ഭവനം’ ദേവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആലയം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: അവരുമായി ഒരു ഉടമ്പടി ചെയ്തു
  rationale: ‘ഉടമ്പടി മുറിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും അതിന്റെ ഔപചാരിക ഭാരം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיַּשְׁבַּע אֹתָם
  choice: അവരെക്കൊണ്ട് സത്യം ചെയ്യിച്ചു
  rationale: 'ഹിഫിൽ രൂപത്തിന്റെ കാരണാർഥം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു: യഹോയാദ അവരെ സത്യം ചെയ്യിച്ചു.'
- source_word: בֶּן הַמֶּלֶךְ
  choice: രാജകുമാരൻ
  rationale: അക്ഷരാർഥം ‘രാജാവിന്റെ മകൻ’; സന്ദർഭത്തിൽ സിംഹാസനാവകാശിയായ ബാലനെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ ‘രാജകുമാരൻ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായ മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בְּרִית എന്ന പദത്തിന്റെ രാഷ്ട്രീയ-ദൈവശാസ്ത്ര ഭാരം
  choice: ഉടമ്പടി
  alternative: കരാർ
  rationale: ഇവിടെ മനുഷ്യർക്കിടയിലെ ഔപചാരിക പ്രതിജ്ഞാബന്ധമാണെങ്കിലും, ബൈബിൾ ഉപയോഗത്തിലെ ഗൗരവം നിലനിർത്താൻ ‘കരാർ’ എന്നതിനെക്കാൾ ‘ഉടമ്പടി’ യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. സൈനിക ഘടന വ്യക്തമാക്കാൻ ദീർഘമായ ആദ്യ നാമപദസമുച്ചയം ആവശ്യമായി വന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ ആശയവുമായി പൊരുത്തപ്പെടാത്ത സ്ഥാനങ്ങളിലായിരുന്നു; മലയാളത്തിൽ [a] ‘കാരീയർ’ എന്നതിനും [b] ‘ഓട്ടക്കാർ’ എന്നതിനും പിന്നാലെ സ്ഥാപിച്ചു.
