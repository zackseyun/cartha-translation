id: 2KI.11.7
reference: 2 Kings 11:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁתֵּ֤י הַ/יָּדוֹת֙ בָּ/כֶ֔ם כֹּ֖ל יֹצְאֵ֣י הַ/שַּׁבָּ֑ת וְ/שָֽׁמְר֛וּ אֶת מִשְׁמֶ֥רֶת בֵּית יְהוָ֖ה אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/007.yaml
  text: And the two divisions among you[a], all who go off duty on the Sabbath[c][b], shall keep watch over the house of Yahweh for the king.
translation:
  language: ml
  text: നിങ്ങളിൽ ശബ്ബത്തിൽ കാവൽപ്പണിയിൽനിന്നു പിരിയുന്നവരുടെ രണ്ടു വിഭാഗങ്ങൾ[a] യാഹ്‌വേയുടെ ആലയത്തിനു രാജാവിനുവേണ്ടി കാവൽ നിൽക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥം ‘നിങ്ങളിലുള്ള രണ്ടു കൈകൾ’; ഇവിടെ ‘രണ്ടു വിഭാഗങ്ങൾ’ അല്ലെങ്കിൽ ‘രണ്ടു സംഘങ്ങൾ’ എന്നായിരിക്കാം അർഥം. അല്ലെങ്കിൽ, ‘ശബ്ബത്തിൽ പുറത്തുപോകുന്ന എല്ലാവരും’ എന്നും വായിക്കാം. ഈ സന്ദർഭത്തിൽ ശബ്ബത്തിലെ കാവൽപ്പാളി മാറുമ്പോൾ കാവൽപ്പണി അവസാനിപ്പിച്ചു പിരിയുന്നവരെയാണ് ഉദ്ദേശിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative; alternative_reading
  - marker: b
    text: ‘രാജാവിനുവേണ്ടി’ എന്ന ബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്; ‘രാജാവിനെ സംബന്ധിച്ച്’ അല്ലെങ്കിൽ ‘രാജാവിന്റെ അടുക്കലേക്ക്’ എന്നും വായിക്കാം. സന്ദർഭത്തിൽ യാഹ്‌വേയുടെ ആലയം കാക്കുന്നതിലൂടെ രാജാവിനെ സംരക്ഷിക്കുകയാണ് ഉദ്ദേശ്യം.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁתֵּי הַיָּדוֹת
  choice: രണ്ടു വിഭാഗങ്ങളും
  rationale: അക്ഷരാർഥത്തിൽ ‘രണ്ടു കൈകൾ’ എന്നാണെങ്കിലും, സൈനിക-സംഘടനാപരമായ ഈ സന്ദർഭത്തിൽ יָד രണ്ടു സംഘങ്ങളെയോ വിഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘വിഭാഗങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בָּכֶם
  choice: നിങ്ങളിലുള്ള
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്ന കാവൽക്കാരിൽ ഉൾപ്പെട്ടവരാണ് ഈ രണ്ടു വിഭാഗങ്ങളെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּל יֹצְאֵי הַשַּׁבָּת
  choice: ശബ്ബത്തിൽ കാവൽപ്പണിയിൽനിന്നു പിരിയുന്ന എല്ലാവരും
  rationale: ‘ശബ്ബത്തിൽ പുറത്തുപോകുന്നവർ’ എന്നാണ് രൂപപരമായ അർഥം; ചുറ്റുപാടിലെ വാക്യങ്ങളിൽ കാവൽപ്പാളി മാറുന്നതാണ് വിഷയം. അതിനാൽ ജോലി അവസാനിപ്പിച്ചു പിരിയുന്നവരെന്ന സന്ദർഭാർഥം സ്വീകരിച്ചു, പദശഃ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: കാവൽ നിൽക്കണം
  rationale: ശמר എന്ന ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള מִשְׁמֶרֶת എന്ന നാമവും ചേർന്ന പ്രയോഗം കാവൽച്ചുമതല നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി നിർദേശത്തിന്റെ ബലം നിലനിർത്തുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: പദശഃ ‘യഹോവയുടെ ഭവനം.’ ഇവിടെ ദേവാലയമാണ് ഉദ്ദേശിക്കുന്നത്; ‘ആലയം’ ആ അർഥം സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל הַמֶּלֶךְ
  choice: രാജാവിനുവേണ്ടി
  rationale: אֶל എന്ന ഉപസർഗത്തിന്റെ ബന്ധം ഇവിടെ ദുഷ്കരമാണ്. സന്ദർഭത്തിൽ ആലയത്തിന്റെ കാവൽ രാജാവിന്റെ സംരക്ഷണത്തിനായി നടത്തുന്നതായതിനാൽ ഗുണം/ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ‘രാജാവിനുവേണ്ടി’ സ്വീകരിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה നേരിട്ട് വന്നതിനാൽ അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണരൂപം ഉപയോഗിച്ചു.
- issue: ആലയത്തിന്റെ കാവലും രാജാവുമായുള്ള ബന്ധം
  choice: രാജാവിനുവേണ്ടി ആലയത്തിനു കാവൽ നിൽക്കുക
  alternative: രാജാവിന്റെ അടുക്കലേക്കോ രാജാവിനെ സംബന്ധിച്ചോ യഹോവയുടെ ആലയത്തിന്റെ കാവൽ കാക്കുക
  rationale: ഹീബ്രു אֶל പലവിധ ബന്ധങ്ങൾ സൂചിപ്പിക്കാം; ഇവിടെ രാജാവിനെ സംരക്ഷിക്കുക എന്ന കഥാസന്ദർഭം ഉദ്ദേശ്യ/ഗുണഭോക്തൃ അർഥത്തെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും വ്യാകരണപരമായ ദുഷ്കരത അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. കാവൽപ്പാളി മാറുന്ന സന്ദർഭം വ്യക്തമായി നൽകുമ്പോഴും ‘രണ്ടു കൈകൾ,’ ‘പുറത്തുപോകുന്നവർ,’ אֶל הַמֶּלֶךְ എന്നീ മൂലപാഠത്തിലെ യഥാർഥ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
