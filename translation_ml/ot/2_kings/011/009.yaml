base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
translation:
  language: ml
  text: അപ്പോൾ നൂറുപേരടങ്ങുന്ന സൈനികസംഘങ്ങളുടെ അധിപന്മാർ പുരോഹിതനായ യെഹോയാദാ കല്പിച്ചതെല്ലാം അനുസരിച്ചു. ഓരോരുത്തനും ശബ്ബത്തിൽ സേവനത്തിനെത്തുന്നവരും ശബ്ബത്തിലെ സേവനം കഴിഞ്ഞു പോകുന്നവരുമായ തന്റെ ആളുകളെ[a] കൂട്ടിക്കൊണ്ട് പുരോഹിതനായ യെഹോയാദായുടെ അടുക്കൽ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശബ്ബത്തിൽ പ്രവേശിക്കുന്നവരും ... ശബ്ബത്തിൽ പുറത്തുപോകുന്നവരുമായ തന്റെ ആളുകളെ.” എബ്രായപാഠം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; സന്ദർഭം കാവൽസേവനത്തിലേക്കു വരുന്നവരെയും സേവനം കഴിഞ്ഞു പോകുന്നവരെയും സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: നൂറുപേരുടെ സൈനികവിഭാഗങ്ങളുടെ അധിപന്മാർ
  rationale: നൂറുപേർ അടങ്ങിയ സൈനികസംഘങ്ങളുടെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥരെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ആ ഘടന ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: കല്പിച്ചതെല്ലാം അനുസരിച്ചു
  rationale: കല്പന പൂർണമായി പാലിച്ചെന്ന സമഗ്രതയും അതിന്റെ അധികാരസ്വഭാവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אִישׁ אֶת־אֲנָשָׁיו
  choice: ഓരോരുത്തനും ... തന്റെ ആളുകളെ
  rationale: വിതരണാർഥത്തിലുള്ള אִישׁ ഓരോ അധിപനും തനിക്കു കീഴിലുള്ള ആളുകളെ കൂട്ടിയെന്ന ആശയം നൽകുന്നു.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: ശബ്ബത്തിൽ സേവനത്തിനെത്തുന്നവർ
  rationale: അക്ഷരാർഥം ‘ശബ്ബത്തിൽ പ്രവേശിക്കുന്നവർ/വരുന്നവർ’ എന്നാണെങ്കിലും, കാവൽപ്പണി മാറുന്ന സന്ദർഭത്തിൽ സേവനത്തിനെത്തുന്ന സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יֹצְאֵי הַשַּׁבָּת
  choice: ശബ്ബത്തിലെ സേവനം കഴിഞ്ഞു പോകുന്നവർ
  rationale: മുൻപ്രയോഗത്തോടുള്ള വിരുദ്ധജോടിയായി സേവനത്തിൽനിന്നു പിരിയുന്ന സംഘത്തെ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיָּבֹאוּ אֶל
  choice: അടുക്കൽ വന്നു
  rationale: യെഹോയാദായുടെ സന്നിധിയിൽ സംഘം എത്തിച്ചേർന്നത് ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പറയുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: യെഹോയാദായുടെ ഔദ്യോഗിക പദവിയുടെ നേരിട്ടുള്ള പരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിലവാരമലയാളം ഉപയോഗിച്ചു. സൈനിക-ദേവാലയ കാവൽപ്പണി മാറുന്ന സന്ദർഭം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി; എബ്രായത്തിലെ അക്ഷരാർഥപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
