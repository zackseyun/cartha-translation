    issue: הַבַּיִת രണ്ടിടത്തും ‘ആലയം’ എന്ന് വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    rationale: സന്ദർഭം ദേവാലയത്തെ സൂചിപ്പിക്കുന്നെങ്കിലും മൂലപാഠം ‘ഭവനം’ എന്ന പദം ആവർത്തിക്കുന്നു. മുഖ്യപാഠത്തിൽ ‘ഭവനം’ നിലനിർത്തി, സന്ദർഭവ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നത് പദപരമായ വിശ്വസ്തതയും വായനാസ്പഷ്ടതയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
