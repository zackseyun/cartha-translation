  yaml_path: translation/ot/2_kings/011/011.yaml
  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
translation:
  language: ml
  text: കാവൽക്കാർ[a] ഓരോരുത്തരും ആയുധങ്ങൾ കൈയിലേന്തി, ഭവനത്തിന്റെ[c] വലതുവശംമുതൽ ഇടതുവശംവരെ[b], യാഗപീഠത്തിന്റെയും ഭവനത്തിന്റെയും അരികിൽ, രാജാവിനെ ചുറ്റി നിലയുറപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഓട്ടക്കാർ’; അതായത് രാജകീയ കാവൽസേന.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഭവനത്തിന്റെ വലതുവശംമുതൽ ഇടതുവശംവരെ.’ ദേവാലയത്തിന്റെ ദിശാനിർണയപ്രകാരം ഇത് ‘തെക്കുവശംമുതൽ വടക്കുവശംവരെ’ എന്നും ഗ്രഹിക്കാം.
    reason: alternative_reading
  - marker: c
    text: ഇവിടെ ‘ഭവനം’ എന്നത് ദേവാലയമന്ദിരത്തെയോ അതിന്റെ പരിസരത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הָרָצִים
  choice: കാവൽക്കാർ
  rationale: പദത്തിന്റെ മൂലാർഥം ‘ഓടുന്നവർ’ എന്നാണെങ്കിലും, ഈ രാജകീയ-സൈനിക സന്ദർഭത്തിൽ ആയുധധാരികളായ രാജകാവൽക്കാരെയാണ് സൂചിപ്പിക്കുന്നത്. സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളമായി ‘കാവൽക്കാർ’ സ്വീകരിച്ചു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: ഓരോരുത്തരും ആയുധങ്ങൾ കൈയിലേന്തി
  rationale: אִישׁ ഇവിടെ വിഭജനാർഥത്തിൽ ‘ഓരോരുത്തൻ’ എന്നും כְּלִי ഈ ആയുധസജ്ജമായ സന്ദർഭത്തിൽ ‘ആയുധങ്ങൾ’ എന്നും അർഥമാക്കുന്നു. ‘കൈയിലേന്തി’ എന്നത് സജ്ജമായ നിലയുടെ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  choice: വലതുവശംമുതൽ ഇടതുവശംവരെ
  rationale: כֶּתֶף അക്ഷരാർഥത്തിൽ ‘തോൾ’ ആണെങ്കിലും കെട്ടിടത്തിന്റെ സ്ഥലവിവരണത്തിൽ ‘വശം’ എന്നതാണ് സ്വാഭാവികം.
- source_word: הַבַּיִת
  choice: ആലയം
  rationale: എബ്രായപദം ‘വീട്/ഭവനം’ എന്നാണെങ്കിലും ഈ സന്ദർഭത്തിൽ യഹോവയുടെ ആലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ‘ആലയം’ ഉപയോഗിച്ചു; സൂചകം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: הַיְמָנִית / הַשְּׂמָאלִית
  choice: വലത് ... ഇടത്
  rationale: നേരിട്ടുള്ള സ്ഥലസൂചനയായ ‘വലത്/ഇടത്’ നിലനിർത്തി. ആലയത്തിന്റെ ദിശാനിർണ്ണയപ്രകാരം ‘തെക്ക്/വടക്ക്’ എന്ന് ഗ്രഹിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: യാഗപീഠത്തിനരികിലും ആലയത്തിനരികിലും
  rationale: לְ ഇവിടെ സ്ഥാനമോ ദിശയോ സൂചിപ്പിക്കാം. കൃത്യമായ ദിശ നിർബന്ധിക്കാതെ സ്ഥാനബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘അരികിൽ’ സ്വീകരിച്ചു.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: രാജാവിനെ ചുറ്റി
  rationale: രാജാവിന് ചുറ്റുമുള്ള സംരക്ഷണവലയം സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
