translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ നീണ്ട സ്ഥലവിവരണം വായനാസൗകര്യത്തിനായി ക്രമപ്പെടുത്തിയെങ്കിലും അതിലെ ഘടകങ്ങളും അവ്യക്തതയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
