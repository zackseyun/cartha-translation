  to: കാവൽക്കാർ[a] ഓരോരുത്തരും ആയുധങ്ങൾ കൈയിലേന്തി, ഭവനത്തിന്റെ[c] വലതുവശംമുതൽ ഇടതുവശംവരെ[b], യാഗപീഠത്തിന്റെയും ഭവനത്തിന്റെയും അരികിൽ, രാജാവിനെ ചുറ്റി നിലയുറപ്പിച്ചു.
