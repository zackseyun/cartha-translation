    rationale: അടിക്കുറിപ്പ് വലതുവശംമുതൽ ഇടതുവശംവരെയുള്ള വാചകഭാഗത്തെ വിശദീകരിക്കുന്നതാണ്; അതിനോടുതന്നെ സൂചകം ചേർക്കണം.
