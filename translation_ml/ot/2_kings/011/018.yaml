id: 2KI.11.18
reference: 2 Kings 11:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ כָל עַם֩ הָ/אָ֨רֶץ בֵּית הַ/בַּ֜עַל וַֽ/יִּתְּצֻ֗/הוּ אֶת מזבחת/ו וְ/אֶת צְלָמָי/ו֙ שִׁבְּר֣וּ הֵיטֵ֔ב וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֣י הַֽ/מִּזְבְּח֑וֹת וַ/יָּ֧שֶׂם הַ/כֹּהֵ֛ן פְּקֻדּ֖וֹת עַל בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
translation:
  language: ml
  text: അപ്പോൾ ദേശത്തിലെ ജനമെല്ലാം ബാലിന്റെ ആലയത്തിൽ ചെന്നു അത് ഇടിച്ചുകളഞ്ഞു. അവർ അവന്റെ ബലിപീഠങ്ങളും പ്രതിമകളും പൂർണമായി തകർത്തു; ബാലിന്റെ പുരോഹിതനായ മത്താനെ ബലിപീഠങ്ങളുടെ മുമ്പിൽവെച്ച് കൊന്നു. പിന്നെ പുരോഹിതൻ യഹോവയുടെ ആലയത്തിന് മേൽനോട്ടക്കാരെ നിയമിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  choice: ദേശത്തിലെ ജനമെല്ലാം
  rationale: രാജതന്ത്ര-സാമൂഹിക പശ്ചാത്തലമുള്ള എബ്രായ പ്രയോഗത്തെ അതിവ്യാഖ്യാനിക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֵּית הַבַּעַל
  choice: ബാലിന്റെ ആലയം
  rationale: בַּיִת എന്നത് അക്ഷരാർഥത്തിൽ ‘വീട്’ ആണെങ്കിലും ആരാധനാസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ആലയം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּתְּצֻהוּ
  choice: അത് ഇടിച്ചുകളഞ്ഞു
  rationale: ഒരു കെട്ടിടം പൊളിച്ചുനീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ശക്തമായ അർഥം നൽകുന്നു.
- source_word: מִזְבְּחֹתָיו
  choice: അവന്റെ ബലിപീഠങ്ങൾ
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം ബാലിനെ സൂചിപ്പിക്കുന്നതായി നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: צְלָמָיו
  choice: പ്രതിമകൾ
  rationale: ആരാധനയ്ക്കുള്ള രൂപങ്ങൾ/വിഗ്രഹങ്ങൾ എന്ന വിശാല അർഥം മതപരമായ വിലയിരുത്തൽ അധികമായി ചേർക്കാതെ നൽകുന്നു.
- source_word: שִׁבְּרוּ הֵיטֵב
  choice: പൂർണമായി തകർത്തു
  rationale: ക്രിയയോടൊപ്പം വരുന്ന തീവ്രതാസൂചകമായ הֵיטֵב നാശത്തിന്റെ സമ്പൂർണത വ്യക്തമാക്കുന്നു.
- source_word: מַתָּן כֹּהֵן הַבַּעַל
  choice: ബാലിന്റെ പുരോഹിതനായ മത്താൻ
  rationale: വ്യക്തിയുടെ പേരും പദവിയും വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: ബലിപീഠങ്ങളുടെ മുമ്പിൽവെച്ച്
  rationale: לִפְנֵי എന്നതിന്റെ സ്ഥലസൂചക അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיָּשֶׂם הַכֹּהֵן פְּקֻדּוֹת
  choice: പുരോഹിതൻ ... മേൽനോട്ടക്കാരെ നിയമിച്ചു
  rationale: ഭരണപരമായ ഈ സന്ദർഭത്തിൽ פְּקֻדּוֹת മേൽനോട്ടം വഹിക്കാൻ ചുമതലപ്പെടുത്തിയ ആളുകളെ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: ആരാധനാസ്ഥലത്തിന് ‘ആലയം’ ഉപയോഗിക്കുകയും ദൈവനാമമായ יהוה വ്യക്തിനാമരൂപത്തിൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ / കർത്താവ്
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു; പൊതുപദമായ ‘കർത്താവ്’ എന്നതിലൂടെ മൂലത്തിലെ ദൈവനാമം മറച്ചിടുന്നില്ല.
- issue: מִזְבְּחֹתָיו എന്നതിലെ പ്രത്യയത്തിന്റെ സൂചന
  choice: അവന്റെ ബലിപീഠങ്ങൾ
  alternative: ആ ആലയത്തിലെ ബലിപീഠങ്ങൾ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ഏകവചന പ്രത്യയം നിലനിർത്തി അതിനെ ബാലുമായി ബന്ധിപ്പിക്കുന്നു; ആലയത്തെ സൂചിപ്പിക്കുന്ന നിർജീവരൂപമായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘ആലയം’, ‘ബലിപീഠം’, ‘പുരോഹിതൻ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സ്വാഭാവികമായി നിലനിർത്തി.
