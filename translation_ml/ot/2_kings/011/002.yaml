id: 2KI.11.2
reference: 2 Kings 11:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יְהוֹשֶׁ֣בַע בַּת הַ/מֶּֽלֶךְ י֠וֹרָם אֲח֨וֹת אֲחַזְיָ֜הוּ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗ה וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ ה/ממותתים אֹת֥/וֹ וְ/אֶת מֵינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/יַּסְתִּ֧רוּ אֹת֛/וֹ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הוּמָֽת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
translation:
  language: ml
  text: എന്നാൽ യോരാം രാജാവിന്റെ മകളും അഹസ്യാവിന്റെ സഹോദരിയുമായ യെഹോശേബ, അഹസ്യാവിന്റെ മകനായ യോവാശിനെ കൊല്ലപ്പെട്ടുകൊണ്ടിരുന്ന രാജാവിന്റെ പുത്രന്മാരുടെ ഇടയിൽനിന്ന് രഹസ്യമായി എടുത്തുമാറ്റി, അവനെയും അവന്റെ മുലയൂട്ടമ്മയെയും കിടപ്പുമുറിയിൽ[a] പാർപ്പിച്ചു. അവർ[b] അവനെ അഥല്യാവിന്റെ കണ്ണിൽപ്പെടാതെ ഒളിപ്പിച്ചു; അങ്ങനെ അവൻ കൊല്ലപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘കിടക്കകളുടെ മുറിയിൽ.’'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായ ക്രിയ ബഹുവചനത്തിലാണ്: ‘അവർ അവനെ ഒളിപ്പിച്ചു.’ ആരൊക്കെയെന്ന് പാഠം വ്യക്തമാക്കുന്നില്ല.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוֹשֶׁבַע
  choice: യെഹോശേബ
  rationale: രാജാക്കന്മാരിലെ എബ്രായ നാമരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു; ദിനവൃത്താന്തങ്ങളിലെ വ്യത്യസ്ത രൂപവുമായി അനാവശ്യമായി ഏകീകരിച്ചില്ല.
- source_word: בַּת הַמֶּלֶךְ יוֹרָם אֲחוֹת אֲחַזְיָהוּ
  choice: യോരാം രാജാവിന്റെ മകളും അഹസ്യാവിന്റെ സഹോദരിയുമായ
  rationale: നിർമാണബന്ധവും ‘സഹോദരി’ എന്ന പദത്തിന്റെ സാധാരണ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: അവനെ രഹസ്യമായി എടുത്ത്
  rationale: גנב എന്നതിലെ രഹസ്യമായി മാറ്റിക്കൊണ്ടുപോകുന്ന ആശയം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; രക്ഷാപ്രവൃത്തിയെ ‘മോഷ്ടിച്ചു’ എന്ന് തെറ്റായി ഗ്രഹിക്കാനുള്ള സാധ്യത ഒഴിവാക്കുന്നു.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ הַמּוּמָתִים
  choice: കൊല്ലപ്പെട്ടുകൊണ്ടിരുന്ന രാജകുമാരന്മാരുടെ ഇടയിൽനിന്ന്
  rationale: ഹോഫാൽ കൃദന്തരൂപത്തിന്റെ പുരോഗമനസ്വഭാവം ‘കൊല്ലപ്പെട്ടുകൊണ്ടിരുന്ന’ എന്നു നിലനിർത്തുന്നു; ‘രാജാവിന്റെ പുത്രന്മാർ’ എന്നത് സന്ദർഭോചിതമായി ‘രാജകുമാരന്മാർ’ എന്നു നൽകി.
- source_word: מֵינִקְתּוֹ
  choice: അവന്റെ മുലയൂട്ടമ്മ
  rationale: കുഞ്ഞിനെ മുലയൂട്ടുന്ന സ്ത്രീ എന്ന പദത്തിന്റെ പ്രത്യേക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: കിടപ്പുമുറിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘കിടക്കകളുടെ മുറിയിൽ’; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക തുല്യം ‘കിടപ്പുമുറി’ ആണ്.
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  choice: അവർ അവനെ ... ഒളിപ്പിച്ചു
  rationale: മസോററ്റിക് പാഠത്തിലെ മൂന്നാംപുരുഷ ബഹുവചന ക്രിയയെ ഏകവചനമാക്കി മിനുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: അഥല്യാവിന്റെ കണ്ണിൽപ്പെടാതെ
  rationale: ‘അവളുടെ സന്നിധിയിൽനിന്ന്/മുഖത്തുനിന്ന്’ എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וְלֹא הוּמָת
  choice: അവൻ കൊല്ലപ്പെട്ടില്ല
  rationale: מות എന്ന ക്രിയയുടെ കാരണവാചക കർമണി അർഥം ചുരുക്കവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: അഹസ്യാവുമായുള്ള കുടുംബബന്ധം
  choice: ‘അഹസ്യാവിന്റെ സഹോദരി’ എന്ന നേരിട്ടുള്ള വായന നിലനിർത്തി
  alternative: സമാന്തര വംശാവലികളുമായി ഒത്തുചേരാൻ ‘ബന്ധു’ എന്നു പൊതുവാക്കുക
  rationale: എബ്രായ പാഠം സാധാരണയായി യഥാർഥ സഹോദരിയെ സൂചിപ്പിക്കുന്ന אֲחוֹת എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്; വിവർത്തനം അനുമാനപരമായ സമന്വയം വരുത്തരുത്.
- issue: യോവാശിനെ ഒളിപ്പിച്ച ക്രിയയുടെ കർത്താവ്
  choice: ബഹുവചനമായ ‘അവർ’ നിലനിർത്തി
  alternative: സന്ദർഭം മിനുക്കി ‘അവൾ ഒളിപ്പിച്ചു’ എന്നു ഏകവചനമാക്കുക
  rationale: മസോററ്റിക് ക്രിയ וַיַּסְתִּרוּ വ്യക്തമായി ബഹുവചനമാണ്; യെഹോശേബയോടൊപ്പം മുലയൂട്ടമ്മയെയോ മറ്റുള്ളവരെയോ ഉൾക്കൊള്ളാം, എന്നാൽ ആരെന്ന് പാഠം വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. എബ്രായത്തിലെ ബഹുവചന ക്രിയയും കുടുംബബന്ധത്തിന്റെ നേരിട്ടുള്ള പദവും നിലനിർത്തി. ‘മുലയൂട്ടമ്മ’ എന്നത് പൊതുവായ ‘പരിചാരിക’യെക്കാൾ ഉറവിടപദത്തിന്റെ പ്രത്യേക അർഥം നൽകുന്നു.
