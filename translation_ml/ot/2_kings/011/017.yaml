  text: וַ/יִּכְרֹ֨ת יְהוֹיָדָ֜ע אֶֽת הַ/בְּרִ֗ית בֵּ֤ין יְהוָה֙ וּ/בֵ֤ין הַ/מֶּ֨לֶךְ֙ וּ/בֵ֣ין הָ/עָ֔ם לִ/הְי֥וֹת לְ/עָ֖ם לַֽ/יהוָ֑ה וּ/בֵ֥ין הַ/מֶּ֖לֶךְ וּ/בֵ֥ין הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
translation:
  language: ml
  text: അപ്പോൾ രാജാവും ജനവും യഹോവയ്ക്കുള്ള ഒരു ജനമായിരിക്കേണ്ടതിന്, യെഹോയാദാ യഹോവയ്ക്കും രാജാവിനും ജനത്തിനും ഇടയിൽ ഉടമ്പടി ചെയ്തു[a]; രാജാവിനും ജനത്തിനും ഇടയിലും ഉടമ്പടി ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം, ‘ഉടമ്പടി മുറിച്ചു’; ‘ഉടമ്പടി ചെയ്തു’ എന്ന അർഥമുള്ള സ്ഥിരപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... הַבְּרִית
  choice: ഉടമ്പടി ചെയ്തു
  rationale: כרת ברית എന്നത് അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിച്ചു’ എന്നാണെങ്കിലും, ഉടമ്പടി സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്. മലയാളത്തിൽ സ്വാഭാവികവും അർഥസമ്പന്നവുമായ ‘ഉടമ്പടി ചെയ്തു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകി.
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: യഹോവയ്ക്കും രാജാവിനും ജനത്തിനും ഇടയിൽ
  rationale: ആവർത്തിച്ചിരിക്കുന്ന בֵּין ഉടമ്പടിയിലെ കക്ഷികളെ അടയാളപ്പെടുത്തുന്നു. അതിന്റെ ത്രികക്ഷിബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തി.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: അവർ യഹോവയ്ക്കുള്ള ജനമായിരിക്കേണ്ടതിന്
  rationale: ഉടമ്പടിയുടെ ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ഹീബ്രു അനന്തക്രിയാഘടന നിലനിർത്തുകയും, ഉടമസ്ഥത മാത്രം മുൻനിർത്താതെ ‘യഹോവയ്ക്കുള്ള ജനം’ എന്ന ബന്ധാത്മക രൂപം ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: രാജാവിനും ജനത്തിനും ഇടയിലും ഉടമ്പടി ചെയ്തു
  rationale: രണ്ടാമത്തെ ബന്ധം വ്യക്തമായി ഗ്രഹിക്കാനായി ഹീബ്രുവിൽ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്ന ക്രിയയും ‘ഉടമ്പടി’യും മലയാളത്തിൽ ആവർത്തിച്ചു; ‘ഇടയിലും’ അതിന്റെ അധികബന്ധസ്വഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ സംരക്ഷിച്ചു.
- issue: לִהְיוֹת לְעָם לַיהוָה എന്ന ഉടമ്പടിസൂത്രത്തിന്റെ അർഥം
  choice: യഹോവയ്ക്കുള്ള ജനമായിരിക്കേണ്ടതിന്
  alternative: യഹോവയുടെ ജനമായിരിക്കേണ്ടതിന്
  rationale: ഉടമസ്ഥത/അംഗത്വം എന്ന അർഥം ഉൾക്കൊള്ളുന്നുവെങ്കിലും, ഹീബ്രുവിലെ לְ എന്ന ബന്ധസൂചനയെ കൂടുതൽ നേരിട്ട് നിലനിർത്തി; മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ആവർത്തനഘടന വായനാസൗകര്യത്തോടെ നിലനിർത്തിയിരിക്കുന്നു; ദൈവനാമം വ്യക്തിനാമമായി തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
