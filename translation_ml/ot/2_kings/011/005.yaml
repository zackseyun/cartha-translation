source:
  edition: WLC
  text: וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ/ן הַ/שְּׁלִשִׁ֤ית מִ/כֶּם֙ בָּאֵ֣י הַ/שַּׁבָּ֔ת וְ/שֹׁ֣מְרֵ֔י מִשְׁמֶ֖רֶת בֵּ֥ית הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/005.yaml
  text: 'And he commanded them[a], saying, “This is the thing that you shall do: one third of you who come on the Sabbath shall keep watch over the king’s house,”'
translation:
  language: ml
  text: 'അവൻ അവരോടു ഇപ്രകാരം കൽപ്പിച്ചു: “നിങ്ങൾ ചെയ്യേണ്ടത് ഇതാണ്: ശബ്ബത്തിൽ എത്തുന്ന നിങ്ങളിൽ മൂന്നിലൊന്ന് രാജാവിന്റെ ഭവനത്തിന്[a] കാവൽ നിൽക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “രാജകൊട്ടാരത്തിന്.” എബ്രായത്തിൽ അക്ഷരാർഥം “രാജാവിന്റെ ഭവനം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: അവൻ അവരോടു കല്പിച്ചു
  rationale: צוה എന്ന പീയേൽ രൂപത്തിന്റെ ആധികാരികമായ കല്പനാഭാവം ‘കല്പിച്ചു’ നിലനിർത്തുന്നു. לֵאמֹר എന്ന ഹീബ്രു വാക്യാരംഭസൂത്രം മലയാളത്തിലെ ഉദ്ധരണിചിഹ്നവും സ്വാഭാവികമായ വാക്യഘടനയുംകൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  choice: നിങ്ങൾ ചെയ്യേണ്ടത് ഇതാണ്
  rationale: ഹീബ്രുവിലെ നിർദേശാത്മക ഭാവം വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ പകരുന്നു.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: നിങ്ങളിൽ മൂന്നിലൊരുഭാഗം
  rationale: ഭിന്നസംഖ്യയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: ശബ്ബത്തിൽ എത്തുന്ന
  rationale: ശബ്ബത്തിലെ കാവൽപ്പണി മാറുന്ന സമയത്ത് ചുമതലയേൽക്കാൻ എത്തുന്നവരെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ ‘വരുക/പ്രവേശിക്കുക’ എന്ന അർഥപരിധി അനാവശ്യമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְשֹׁמְרֵי מִשְׁמֶרֶת
  choice: കാവൽ നിൽക്കണം
  rationale: കാവൽച്ചുമതല നിർവഹിക്കുക എന്ന ആശയവും നിർദേശത്തിന്റെ ബലവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജഗൃഹം
  rationale: ‘രാജാവിന്റെ ഭവനം’ എന്ന ഹീബ്രു പദഘടനയോട് അടുത്തുനിൽക്കുകയും സന്ദർഭത്തിലെ രാജകീയ വസതി/കൊട്ടാരം എന്ന അർഥം അനുവദിക്കുകയും ചെയ്യുന്നു.
