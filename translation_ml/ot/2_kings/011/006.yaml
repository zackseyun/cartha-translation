  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
translation:
  language: ml
  text: മൂന്നിലൊന്ന് സൂർ കവാടത്തിലും മൂന്നിലൊന്ന് ഓട്ടക്കാരുടെ[a] പിന്നിലുള്ള കവാടത്തിലും നിലയുറപ്പിക്കണം; ആരും അകത്തു കടക്കാതിരിക്കാൻ[b] നിങ്ങൾ ആ ഭവനത്തിനു കാവൽ നിൽക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഓട്ടക്കാർ’ എന്നതിനുള്ള എബ്രായപദം രാജാവിന്റെ കാവൽക്കാരെയോ രാജകീയ സന്ദേശവാഹകരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന്റെ അർഥം അനിശ്ചിതമാണ്; ‘പ്രതിരോധത്തിനായി’ എന്നോ ‘തടയണപോലെ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: മൂന്നിലൊന്ന്
  rationale: സന്ദർഭത്തിൽ കാവൽക്കാരുടെ മൂന്നു വിഭാഗങ്ങളിൽ ഓരോന്നിനെ വീതം സൂചിപ്പിക്കുന്ന പ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בְּשַׁעַר סוּר
  choice: സൂർ കവാടത്തിൽ
  rationale: שַׁעַר എന്നത് ‘കവാടം’; סוּר ഇവിടെ സ്ഥലനാമമായി മനസ്സിലാക്കി പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരിച്ചു.
- source_word: בַּשַּׁעַר אַחַר הָרָצִים
  choice: ഓട്ടക്കാരുടെ പിന്നിലുള്ള കവാടത്തിൽ
  rationale: אַחַר എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘പിന്നിൽ’ നിലനിർത്തുന്നു; കെട്ടിടത്തിന്റെ കൃത്യമായ വിന്യാസം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: הָרָצִים
  choice: ഓട്ടക്കാർ
  rationale: רוץ എന്ന ‘ഓടുക’ എന്ന ധാതുവിൽനിന്നുള്ള പദത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തി; രാജസദസ്സിലെ കാവൽക്കാരെയോ സന്ദേശവാഹകരെയോ സൂചിപ്പിക്കാമെന്ന പ്രവർത്തനാർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת
  choice: നിങ്ങൾ ... കാവൽ നിൽക്കണം
  rationale: ഒരേ ധാതുകുടുംബത്തിലെ ക്രിയയും നാമവും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി, മലയാളത്തിലെ സ്വാഭാവികമായ ‘കാവൽ നിൽക്കുക’ എന്ന പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: הַבַּיִת
  choice: ആ ഭവനം
  rationale: בַּיִת എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘വീട്/ഭവനം’ നിലനിർത്തുന്നു; ‘അരമന’ എന്നോ ‘ദേവാലയം’ എന്നോ സന്ദർഭത്തെ കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: מַסָּח
  choice: ആരും അകത്തു കടക്കാതിരിക്കാൻ
  rationale: അപൂർവവും അർഥം അനിശ്ചിതവുമായ പദം ഇവിടെ കാവലിന്റെ ഉദ്ദേശ്യം—അനധികൃത പ്രവേശനം തടയുക—എന്ന് സന്ദർഭാനുസൃതമായി അവതരിപ്പിക്കുന്നു; അനിശ്ചിതത്വവും മറ്റു സാധ്യതകളും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
