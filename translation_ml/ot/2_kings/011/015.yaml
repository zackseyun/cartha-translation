  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
translation:
  language: ml
  text: 'അപ്പോൾ പുരോഹിതനായ യെഹോയാദാ സൈന്യത്തിന്റെ ചുമതല ഏൽപ്പിക്കപ്പെട്ടിരുന്ന ശതാധിപന്മാരോടു കല്പിച്ചു: “അവളെ നിരകൾക്കിടയിലൂടെ പുറത്തു കൊണ്ടുപോകുവിൻ.[a] അവളുടെ പിന്നാലെ വരുന്ന ആരെയെങ്കിലും വാളാൽ കൊല്ലുവിൻ.” കാരണം, “അവളെ യാഹ്‌വേയുടെ ആലയത്തിൽവെച്ച് കൊല്ലരുത്” എന്നു പുരോഹിതൻ പറഞ്ഞിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ എബ്രായപ്രയോഗം ദുഷ്കരമാണ്. “നിരകൾക്കു പുറത്തേക്ക്” എന്നോ “നിരകൾക്കിടയിലുള്ള സ്ഥലത്തേക്ക്” എന്നോ പരിഭാഷപ്പെടുത്താം; ക്രമമായി നിന്നിരുന്ന കാവൽക്കാരുടെ നിരകളിലൂടെ അവളെ പുറത്തേക്കു കൊണ്ടുപോകുന്നതായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: ശതാധിപന്മാർ
  rationale: നൂറുപേരടങ്ങുന്ന സൈനികവിഭാഗങ്ങളുടെ അധിപന്മാരെ സൂചിപ്പിക്കുന്ന യെഹൂദ്യ സൈനികപദവി സംക്ഷിപ്തമായും ഔപചാരികമായും നൽകുന്നു; റോമൻ പശ്ചാത്തലമുള്ള പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: פְּקֻדֵי הַחַיִל
  choice: സൈന്യത്തിന്റെ ചുമതല ഏൽപ്പിക്കപ്പെട്ടിരുന്ന
  rationale: פקד എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ പങ്കാളിത്തരൂപത്തിലുള്ള നിയമനം/ചുമതലപ്പെടുത്തൽ എന്ന ഭരണപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: הוֹצִיאוּ אֹתָהּ
  choice: അവളെ ... പുറത്തു കൊണ്ടുപോകുവിൻ
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം ഇവിടെ ഒരാളെ പുറത്തേക്കു കൊണ്ടുപോകുക എന്നർഥം നൽകുന്നു.
- source_word: אֶל מִבֵּית לַשְּׂדֵרוֹת
  choice: കാവൽനിരകൾക്കിടയിലൂടെ
  rationale: ദുഷ്കരമായ എബ്രായപ്രയോഗം ക്രമീകരിച്ച കാവൽനിരകളിലൂടെ അവളെ ആലയത്തിനു പുറത്തേക്കു കൊണ്ടുപോകുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു; സംശയം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: അവളുടെ പിന്നാലെ വരുന്നവനെ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ഏകവചന പങ്കാളിത്തരൂപത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തുന്നു; പിന്തുടരുന്നതിന്റെ ഉദ്ദേശ്യം പ്രത്യേകം നിർണയിക്കുന്നില്ല.
- source_word: הָמֵת בֶּחָרֶב
  choice: വാളുകൊണ്ട് കൊന്നുകളയുവിൻ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടിന് സന്ദർഭത്തിലുള്ള ശക്തമായ ആജ്ഞാഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אַל תּוּמַת
  choice: കൊല്ലരുത്
  rationale: നിഷ്ക്രിയ ജസ്സീവ് രൂപത്തിലുള്ള നിരോധനം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കർത്താവായ ‘അവളെ’ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: בית എന്നത് അക്ഷരാർഥത്തിൽ ‘ഭവനം’ ആണെങ്കിലും ഇവിടെ ദേവാലയത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ആലയം’ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ നിലവിലുള്ള പരിചിത ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു നൽകുന്നു.
- issue: അവളുടെ പിന്നാലെ വരുന്നവന്റെ ഉദ്ദേശ്യം
  choice: അവളുടെ പിന്നാലെ വരുന്നവനെ
  alternative: അവളെ പിന്തുണച്ച് പിന്നാലെ വരുന്നവനെ
  rationale: മൂലപാഠം പിന്നാലെ വരുന്നതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ രാഷ്ട്രീയ പിന്തുണ എന്ന വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കാതെ യഥാർഥമായ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. സൈനികപദവിക്ക് ‘ശതാധിപന്മാർ’ എന്നും ദേവാലയസന്ദർഭത്തിൽ בית എന്നതിന് ‘ആലയം’ എന്നും നൽകി. ദുഷ്കരമായ സ്ഥലസൂചന പ്രധാനവാചകത്തിൽ വായനാസൗകര്യത്തോടെ നൽകിയെങ്കിലും അതിന്റെ പാഠപരമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
