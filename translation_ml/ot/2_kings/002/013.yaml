  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ സംഭവക്രമവും വസ്ത്രത്തിന്റെ വ്യക്തമായ തിരിച്ചറിയലും നിലനിർത്തി.
