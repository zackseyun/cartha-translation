source:
  edition: WLC
  text: וַ/יָּ֨רֶם֙ אֶת אַדֶּ֣רֶת אֵלִיָּ֔הוּ אֲשֶׁ֥ר נָפְלָ֖ה מֵ/עָלָ֑י/ו וַ/יָּ֥שָׁב וַֽ/יַּעֲמֹ֖ד עַל שְׂפַ֥ת הַ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/013.yaml
  text: He picked up Elijah’s cloak[a], which had fallen from him, and returned and stood on the bank of the Jordan.
translation:
  language: ml
  text: ഏലിയാവിൽനിന്നു വീണ മേലങ്കി[a] അവൻ എടുത്തു; പിന്നെ മടങ്ങിച്ചെന്ന് യോർദ്ദാന്റെ കരയിൽ നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പുറംവസ്ത്രം.’ എബ്രായപദം പ്രത്യേകതയുള്ള ഒരു പുറംവസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: എടുത്തു
  rationale: רוּם എന്ന ക്രിയയ്ക്ക് അടിസ്ഥാനമായി ‘ഉയർത്തുക’ എന്ന അർഥമുണ്ടെങ്കിലും, നിലത്തു വീണ വസ്ത്രത്തെ സംബന്ധിച്ച ഈ സന്ദർഭത്തിൽ ‘എടുത്തു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: אַדֶּרֶת
  choice: മേലങ്കി
  rationale: പ്രത്യേകതയുള്ള പുറംവസ്ത്രത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘മേലങ്കി’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘പുറംവസ്ത്രം’ എന്ന വിവരണാത്മക സാധ്യത അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
- source_word: אֵלִיָּהוּ
  choice: ഏലിയാവ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു; വിഭക്തിസന്ധിയിൽ ‘ഏലിയാവിൽനിന്നു’ എന്നു വരുന്നു.
- source_word: אֲשֶׁר נָפְלָה מֵעָלָיו
  choice: ഏലിയാവിൽനിന്നു വീണ
  rationale: പ്രധാന പ്രവൃത്തിക്കുമുമ്പ് സംഭവിച്ച വീഴ്ചയെ സ്വാഭാവികമായ മലയാള വിശേഷണഘടനയിൽ അവതരിപ്പിക്കുന്നു. ‘അവനിൽനിന്ന്’ എന്ന സർവനാമം ഉണ്ടാക്കാവുന്ന ക്ഷണിക അവ്യക്തത ഒഴിവാക്കാൻ പേര് ആവർത്തിച്ചു.
- source_word: וַיָּשָׁב
  choice: മടങ്ങിച്ചെന്ന്
  rationale: שׁוּב എന്നതിന്റെ മടങ്ങുക/തിരിച്ചുപോകുക എന്ന ചലനാർഥം തുടർന്നുള്ള നിൽക്കൽപ്രവൃത്തിയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וַיַּעֲמֹד
  choice: നിന്നു
  rationale: עמד എന്ന ക്രിയയുടെ നേരായ അർഥം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകി.
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ കരയിൽ
  rationale: שָׂפָה ഇവിടെ നദിയുടെ അരിക് അഥവാ കര എന്നർഥത്തിലാണ്. ‘കരയിൽ’ മലയാളത്തിൽ നദീതീരത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘നദി’ ചേർത്തിട്ടില്ല.
