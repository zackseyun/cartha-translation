id: 2KI.2.22
reference: 2 Kings 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּרָפ֣וּ הַ/מַּ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ/דְבַ֥ר אֱלִישָׁ֖ע אֲשֶׁ֥ר דִּבֵּֽר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/022.yaml
  text: So the waters were healed to this day[a], according to the word that Elisha spoke.
translation:
  language: ml
  text: അങ്ങനെ, എലീശാ പറഞ്ഞ വചനപ്രകാരം ആ വെള്ളം ഇന്നുവരെ സൗഖ്യം പ്രാപിച്ചിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൂർവസ്ഥിതിയിലായിരിക്കുന്നു’ എന്നോ ‘ഉപയോഗയോഗ്യമായിത്തീർന്നിരിക്കുന്നു’ എന്നോ വിവർത്തനം ചെയ്യാം. ഹീബ്രായിൽ സാധാരണയായി ‘സൗഖ്യം പ്രാപിക്കുക’ എന്നർഥമുള്ള ക്രിയയാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָפוּ
  choice: സൗഖ്യം പ്രാപിച്ചിരിക്കുന്നു
  rationale: רפא എന്ന സാധാരണ ‘സൗഖ്യമാക്കുക/സൗഖ്യം പ്രാപിക്കുക’ എന്ന ക്രിയയുടെ രൂപകം നിലനിർത്തുന്നു; ദുഷിച്ചിരുന്ന വെള്ളം ഉപയോഗയോഗ്യമായിത്തീർന്നതും അതിന്റെ ഫലം തുടരുന്നതും സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: הַמַּיִם
  choice: ആ വെള്ളം
  rationale: מַיִם ഹീബ്രായിൽ രൂപപരമായി ബഹുവചനമാണെങ്കിലും മലയാളത്തിൽ വെള്ളത്തെ സൂചിപ്പിക്കാൻ ഏകവചനസമാനമായ ‘വെള്ളം’ സ്വാഭാവികമാണ്; നിർദ്ദിഷ്ടതയ്ക്കായി ‘ആ’ ചേർത്തു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: വിവരണകർത്താവിന്റെ കാലംവരെ ആ സ്ഥിതി തുടർന്നുവെന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: כִּדְבַר
  choice: വചനപ്രകാരം
  rationale: മുൻവാക്യത്തിലെ എലീശായുടെ പ്രവാചകപ്രഖ്യാപനവുമായി നേരിട്ടുള്ള ബന്ധം സൂക്ഷിക്കുന്നതിനായി דָּבָר എന്നതിനെ ‘വചനം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֱלִישָׁע
  choice: എലീശാ
  rationale: പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אֲשֶׁר דִּבֵּר
  choice: എലീശാ പറഞ്ഞ
  rationale: ബന്ധവാക്യം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി; പ്രവാചകന്റെ ഉച്ചരിച്ച വാക്കിനെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: വെള്ളത്തെക്കുറിച്ചുള്ള സൗഖ്യഭാഷയുടെ സ്വഭാവം
  choice: പ്രധാനപാഠത്തിൽ ‘സൗഖ്യം പ്രാപിച്ചിരിക്കുന്നു’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘പൂർവസ്ഥിതിയിലായി’ അല്ലെങ്കിൽ ‘ശുദ്ധമായിത്തീർന്നു’
  rationale: ഹീബ്രായിലെ רפא സാധാരണയായി സൗഖ്യത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്. രൂപകം നിലനിർത്തുന്നത് പ്രവാചകവചനത്തിലൂടെ സംഭവിച്ച പുനഃസ്ഥാപനത്തെ പാഠം അവതരിപ്പിക്കുന്ന വിധം സംരക്ഷിക്കുന്നു; അതേസമയം അധികമായ ഉപദേശവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രായിലെ സൗഖ്യരൂപകം സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിലെ വെള്ളം എന്ന പദത്തിന്റെ സ്വാഭാവിക ഏകവചനപ്രയോഗം സ്വീകരിച്ചു. അടിക്കുറിപ്പ്-ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
