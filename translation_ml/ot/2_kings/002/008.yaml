lexical_decisions:
- source_word: אַדַּרְתּוֹ
  choice: തന്റെ മേലങ്കി
  rationale: אַדֶּרֶת ഇവിടെ ഏലിയാവിന്റെ പുറംവസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും പ്രവർത്തനസന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണ് ‘മേലങ്കി’.
- source_word: וַיִּגְלֹם
  choice: ചുരുട്ടി
  rationale: വസ്ത്രം അടിക്കാനുള്ള ഉപകരണമാക്കിക്കൊണ്ട് കൂട്ടിച്ചുരുട്ടുന്ന പ്രവൃത്തിയെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: വെള്ളത്തിൽ അടിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ പ്രഹരാർത്ഥം നിലനിർത്തുന്നു; അതേസമയം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗവുമാണ്.
- source_word: וַיֵּחָצוּ
  choice: വെള്ളം ... പിരിഞ്ഞു
  rationale: എബ്രായത്തിൽ ക്രിയ ബഹുവചനമാണെങ്കിലും വിഷയം ‘വെള്ളങ്ങൾ’ എന്നാണ് ഗ്രഹിക്കപ്പെടുന്നത്. മലയാളത്തിൽ ‘വെള്ളം പിരിഞ്ഞു’ എന്ന ഏകവചനപ്രയോഗം സ്വാഭാവികമാണ്; അത്ഭുതസംഭവത്തെ ലഘൂകരിക്കാതെ നേരിട്ട് പറയുന്നു.
- source_word: הֵנָּה וָהֵנָּה
  choice: ഇരുവശത്തേക്കും
  rationale: അക്ഷരാർഥത്തിലെ ‘ഇങ്ങോട്ടും അങ്ങോട്ടും’ എന്ന ദിശാഭാവം ഇവിടെ വെള്ളം എതിർവശങ്ങളിലേക്ക് മാറിയെന്ന സന്ദർഭാർഥത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיַּעַבְרוּ שְׁנֵיהֶם
  choice: അവർ ഇരുവരും ... അക്കരെ കടന്നു
