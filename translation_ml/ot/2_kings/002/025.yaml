translation:
  language: ml
  text: അവൻ അവിടെനിന്ന് കർമ്മേൽമലയിലേക്കു പോയി; അവിടെനിന്ന് ശമര്യയിലേക്കു മടങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: വയ്യിഖ്തോൽ രൂപം കഥയിലെ അടുത്ത സംഭവത്തെ ലളിതമായ ഭൂതകാലത്തിൽ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ ‘പോയി’ സ്വാഭാവികമാണ്.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: മുമ്പ് പരാമർശിച്ച സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലാണ് ഈ ക്രിയാവിശേഷണം സൂചിപ്പിക്കുന്നത്.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: കർമ്മേൽമലയിലേക്ക്
  rationale: אֶל ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്നു; הַר הַכַּרְמֶל എന്ന ഭൂനാമം മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തരൂപത്തിൽ നൽകി.
- source_word: וּמִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: തുടർന്നുള്ള യാത്രയുടെ ആരംഭസ്ഥലം സൂചിപ്പിക്കുന്നു; വാക്യബന്ധം മലയാളത്തിലെ അർധവിരാമംകൊണ്ട് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שָׁב
  choice: മടങ്ങി
  rationale: യാത്രാസന്ദർഭത്തിൽ שׁוּב മുമ്പത്തെ സ്ഥലത്തേക്കോ അറിയപ്പെടുന്ന കേന്ദ്രത്തിലേക്കോ തിരിച്ചുപോകുക എന്നർഥം നൽകുന്നു; ‘മടങ്ങി’ സംക്ഷിപ്തവും മാന്യവുമാണ്.
- source_word: שֹׁמְרוֹן
  choice: ശമര്യ
  rationale: ഈ സ്ഥലനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ രൂപം ഉപയോഗിച്ചു.
