  text: וֶ/אֱלִישָׁ֣ע רֹאֶ֗ה וְ/ה֤וּא מְצַעֵק֙ אָבִ֣/י אָבִ֗/י רֶ֤כֶב יִשְׂרָאֵל֙ וּ/פָ֣רָשָׁ֔י/ו וְ/לֹ֥א רָאָ֖/הוּ ע֑וֹד וַֽ/יַּחֲזֵק֙ בִּ/בְגָדָ֔י/ו וַ/יִּקְרָעֵ֖/ם לִ/שְׁנַ֥יִם קְרָעִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/012.yaml
  text: And Elisha was watching[a], and he was crying out, “My father, my father! The chariot of Israel and its horsemen!” Then he saw him no more, and he took hold of his own clothes and tore them into two pieces.
translation:
  language: ml
  text: 'എലീശാ അതു നോക്കിക്കൊണ്ടിരുന്നു. അവൻ നിലവിളിച്ചുകൊണ്ടിരുന്നു: “എന്റെ പിതാവേ, എന്റെ പിതാവേ! ഇസ്രായേലിന്റെ രഥവും അതിന്റെ കുതിരപ്പടയാളികളും!”[a] പിന്നെ അവൻ ഏലിയാവിനെ വീണ്ടും കണ്ടില്ല. അപ്പോൾ അവൻ സ്വന്തം വസ്ത്രങ്ങൾ പിടിച്ചു രണ്ടായി കീറിക്കളഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിന്റെ രഥവും കുതിരപ്പടയാളികളും!” എലീശായുടെ ഈ നിലവിളി ഇസ്രായേലിന്റെ യഥാർഥ ശക്തിയും സംരക്ഷണവുമായി ഏലിയാവിനെ വിശേഷിപ്പിക്കുന്നതാകാം; അല്ലെങ്കിൽ അവൻ കണ്ടുകൊണ്ടിരുന്ന സ്വർഗീയ രഥത്തെയും അതിന്റെ കുതിരപ്പടയാളികളെയും സൂചിപ്പിക്കുന്നതാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאֶה
  choice: നോക്കിക്കൊണ്ടിരുന്നു
  rationale: വർത്തമാന കൃദന്തത്തിന്റെ തുടർച്ചയായ പ്രവർത്തനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מְצַעֵק
  choice: നിലവിളിച്ചുകൊണ്ടിരുന്നു
  rationale: തുടർച്ചയായ കൃദന്തരൂപവും വികാരതീവ്രതയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: אָבִי אָבִי
  choice: എന്റെ പിതാവേ, എന്റെ പിതാവേ!
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും വികാരഭരിതമായ ആവർത്തനവും സംരക്ഷിക്കുന്നു; ഇത് ജൈവപിതൃത്വം എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: ഇസ്രായേലിന്റെ രഥവും അതിന്റെ കുതിരപ്പടയാളികളും
  rationale: ‘രഥം’ എന്ന ഏകവചനവും ‘അതിന്റെ’ എന്ന പുല്ലിംഗ ഏകവചന പ്രത്യയസൂചനയും ‘കുതിരപ്പടയാളികൾ’ എന്ന ബഹുവചനവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְלֹא רָאָהוּ עוֹד
  choice: പിന്നെ അവന് ഏലിയാവിനെ കാണാനായില്ല
  rationale: ഇനിമേൽ കാണാതായതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സർവനാമത്തിന്റെ സൂചിത വ്യക്തിയെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേരെടുത്ത് പറയുന്നു.
- source_word: וַיַּחֲזֵק בִּבְגָדָיו
  choice: അവൻ സ്വന്തം വസ്ത്രങ്ങൾ പിടിച്ചു
  rationale: പ്രവർത്തി എലീശായുടെ തന്നെ വസ്ത്രങ്ങളിലാണെന്ന സന്ദർഭസൂചന ‘സ്വന്തം’ എന്നതിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים
  choice: രണ്ടായി കീറിക്കളഞ്ഞു
  rationale: ഫലസൂചകമായ എബ്രായ പ്രയോഗത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ഇസ്രായേലിന്റെ രഥവും അതിന്റെ കുതിരപ്പടയാളികളും’ എന്ന നിലവിളിയുടെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ഉപമയെ വ്യാഖ്യാനിക്കാതെ നേരിട്ടുള്ള ആശ്ചര്യവിളിയായി നിലനിർത്തി.
  alternative: ഇത് ഇസ്രായേലിന്റെ യഥാർഥ ശക്തിയും സംരക്ഷണവുമായി ഏലിയാവിനെ വിശേഷിപ്പിക്കുന്നതാകാം; അല്ലെങ്കിൽ എലീശാ കാണുന്ന സ്വർഗീയ രഥ-കുതിര ദൃശ്യത്തെ സൂചിപ്പിക്കുന്നതാകാം.
  rationale: എബ്രായ വാചകം രണ്ടുവിധ വായനയ്ക്കും ഇടനൽകുന്നു. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. കൃദന്തങ്ങളുടെ തുടർച്ചാഭാവം ‘-ക്കൊണ്ടിരുന്നു’ രൂപങ്ങളിൽ സംരക്ഷിച്ചു. ദുഃഖാചരണത്തിന്റെ ശക്തി ‘കീറിക്കളഞ്ഞു’ എന്ന പ്രയോഗത്തിലൂടെ അറിയിച്ചു.
