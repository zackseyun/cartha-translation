revisions:
- from: 'എലീശാ അതു നോക്കിക്കൊണ്ടിരുന്നു. അവൻ നിലവിളിച്ചുകൊണ്ടിരുന്നു: “എന്റെ പിതാവേ, എന്റെ പിതാവേ! ഇസ്രായേലിന്റെ രഥവും അതിന്റെ കുതിരപ്പടയാളികളും!”[a] പിന്നെ അവന് ഏലിയാവിനെ കാണാനായില്ല. അപ്പോൾ അവൻ സ്വന്തം വസ്ത്രങ്ങൾ പിടിച്ചു രണ്ടായി കീറിക്കളഞ്ഞു.'
  to: 'എലീശാ അതു നോക്കിക്കൊണ്ടിരുന്നു. അവൻ നിലവിളിച്ചുകൊണ്ടിരുന്നു: “എന്റെ പിതാവേ, എന്റെ പിതാവേ! ഇസ്രായേലിന്റെ രഥവും അതിന്റെ കുതിരപ്പടയാളികളും!”[a] പിന്നെ അവൻ ഏലിയാവിനെ വീണ്ടും കണ്ടില്ല. അപ്പോൾ അവൻ സ്വന്തം വസ്ത്രങ്ങൾ പിടിച്ചു രണ്ടായി കീറിക്കളഞ്ഞു.'
  rationale: The revision changes only the cessation-of-sight clause to avoid implying inability, and aligns the footnote's heavenly-scene alternative with the Hebrew reference to horsemen. The direct, unresolved wording of Elisha's cry and the draft's modern Malayalam register are retained.
