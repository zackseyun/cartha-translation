  yaml_path: translation/ot/2_kings/002/003.yaml
  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: ml
  text: 'അപ്പോൾ ബേഥേലിലുണ്ടായിരുന്ന പ്രവാചകശിഷ്യന്മാർ പുറത്തുവന്ന് എലീശയോടു പറഞ്ഞു: “ഇന്ന് യഹ്‌വെ നിന്റെ യജമാനനെ നിന്റെ തലയ്ക്കുമീതെനിന്ന് എടുത്തുകൊണ്ടുപോകുകയാണെന്ന്[a] നിനക്കറിയാമോ?” അവൻ പറഞ്ഞു: “എനിക്കും അറിയാം; മിണ്ടാതിരിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെമേൽ അധികാരമുള്ളവനായിരിക്കുന്ന സ്ഥാനത്തുനിന്ന്.’ ഹീബ്രുവിൽ അക്ഷരാർഥം ‘നിന്റെ തലയ്ക്കുമീതെനിന്ന്’ എന്നാണ്; ഒരാളുടെമേൽ അധികാരമുള്ള വ്യക്തിയെ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: പ്രവാചകശിഷ്യന്മാർ
  rationale: ‘പ്രവാചകന്മാരുടെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥരൂപം മലയാളത്തിൽ ജൈവപുത്രന്മാരെ സൂചിപ്പിക്കാനിടയുണ്ട്. ഇവിടെ പ്രവാചകസംഘത്തിലെ അംഗങ്ങളെയോ ശിഷ്യന്മാരെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു ബന്ധപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר בֵּית אֵל
  choice: ബേഥേലിലുണ്ടായിരുന്ന
  rationale: സംഘത്തെ അവരുടെ സ്ഥലവുമായി ബന്ധപ്പെടുത്തി തിരിച്ചറിയിക്കുന്ന ഉപവാക്യം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הֲיָדַעְתָּ
  choice: നിനക്കറിയാമോ
  rationale: സന്ദർഭത്തിലെ ഹീബ്രു ചോദ്യത്തിന്റെ വർത്തമാനകാല അർഥം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לֹקֵחַ
  choice: എടുത്തുകൊണ്ടുപോകുകയാണെന്ന്
  rationale: ആ ദിവസം സംഭവിക്കാനിരിക്കുന്ന, അടുത്തെത്തിയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു കൃ participle-ന്റെ സജീവത നിലനിർത്തുന്നു.
- source_word: אֲדֹנֶיךָ
  choice: നിന്റെ യജമാനനെ
  rationale: ഇവിടെ പദം ദൈവത്തെ അല്ല, എലീശയുടെ ഗുരുവും മേലധികാരിയുമായ ഏലിയാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: നിന്റെ തലയ്ക്കുമീതെനിന്ന്
  rationale: ഹീബ്രുവിലെ ദൃശ്യരൂപം മുഖ്യവാക്യത്തിൽ നിലനിർത്തുകയും അധികാരബന്ധത്തെക്കുറിച്ചുള്ള സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: എനിക്കും അറിയാം
  rationale: גַּם אֲנִי എന്ന ‘ഞാനും/എനിക്കും’ എന്ന പങ്കിട്ട അറിവിന്റെ ആശയം കൃത്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: הֶחֱשׁוּ
  choice: മിണ്ടാതിരിക്കൂ
  rationale: സംഘത്തോടുള്ള ആജ്ഞയുടെ ഗൗരവവും നേരിട്ടുള്ള ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദനാമംകൊണ്ട് പകരാതെ ലിപ്യന്തരം ചെയ്തു.
- issue: מֵעַל רֹאשֶׁךָ എന്ന പ്രയോഗത്തിലെ അധികാരബന്ധം
  choice: രൂപകം മുഖ്യവാക്യത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുക
  alternative: നിന്റെ മേലധികാരിയായിരിക്കുന്നതിൽനിന്ന്
  rationale: ഹീബ്രുവിലെ ദൃശ്യരൂപവും അതിലെ അർഥസാധ്യതയും നിലനിർത്തുന്നു; വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രു രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു; ജൈവബന്ധമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ בְנֵי הַנְּבִיאִים ‘പ്രവാചകശിഷ്യന്മാർ’ എന്നു നൽകി.
