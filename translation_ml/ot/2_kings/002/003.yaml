  source_fidelity: 'മുഖ്യവാക്യം ഹീബ്രു മൂലത്തോടു വിശ്വസ്തമാണ്: ബേഥേലിലെ പ്രവാചകശിഷ്യന്മാർ, യഹ്‌വെ എന്ന ദൈവനാമം, ആസന്നമായ ‘എടുത്തുകൊണ്ടുപോകുന്നു’ എന്ന പ്രയോഗം, ‘നിന്റെ തലയ്ക്കുമീതെനിന്ന്’ എന്ന രൂപകം, എലീശയുടെ ‘എനിക്കും അറിയാം’ എന്നിവ യഥാവിധി നിലനിൽക്കുന്നു. എന്നാൽ וַיֹּאמְרוּ (‘അവർ പറഞ്ഞു’) എന്നതിനുപകരം ‘ചോദിച്ചു’ എന്നത് അല്പം അനാവശ്യമായ വ്യാഖ്യാനമാണ്; നേരിട്ടുള്ള ചോദ്യം ഉള്ളതിനാൽ അർഥം മാറുന്നില്ലെങ്കിലും ‘പറഞ്ഞു’ മൂലപാഠത്തോട് കൂടുതൽ അടുത്തതാണ്.'
  naturalness: ‘എലീശയുടെ അടുക്കൽ പുറത്തുവന്ന്’ എന്ന നിലവിലെ പദക്രമം അല്പം കൃത്രിമമായി കേൾക്കാം. ‘പുറത്തുവന്ന് എലീശയോടു പറഞ്ഞു’ എന്ന ക്രമം ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ ഒഴുക്കുള്ളതാണ്. അടിക്കുറിപ്പിലെ ‘നിന്റെമേൽ അധികാരമുള്ളവനായിരിക്കുന്നതിൽനിന്ന്’ എന്ന രൂപം അപൂർണമായി തോന്നുന്നു; ‘സ്ഥാനത്തുനിന്ന്’ ചേർക്കുന്നത് സ്വാഭാവികവും വ്യക്തവുമാക്കുന്നു.
  terminology: ‘പ്രവാചകശിഷ്യന്മാർ’ ബְּנֵי־הַנְּבִיאִים എന്ന സംഘ/ശിഷ്യബന്ധത്തെ സ്വാഭാവികമായി നൽകുന്നു. ‘യഹ്‌വെ’ ദൈവനാമത്തെ നിലനിർത്തുന്നു. ‘യജമാനൻ’ ഇവിടെ എലീശയുടെ മനുഷ്യഗുരുവും മേലധികാരിയുമായ ഏലിയാവിനെ സൂചിപ്പിക്കുന്നതിന് സ്വീകാര്യമാണ്. മുഖ്യപാഠത്തിലെ രൂപകം സംരക്ഷിച്ച് അതിന്റെ അധികാരസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നതും ഉചിതമാണ്.
