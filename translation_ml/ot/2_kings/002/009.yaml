source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/עָבְרָ֗/ם וְ/אֵ֨לִיָּ֜הוּ אָמַ֤ר אֶל אֱלִישָׁע֙ שְׁאַל֙ מָ֣ה אֶֽעֱשֶׂה לָּ֔/ךְ בְּ/טֶ֖רֶם אֶלָּקַ֣ח מֵ/עִמָּ֑/ךְ וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע וִֽ/יהִי נָ֛א פִּֽי שְׁנַ֥יִם בְּ/רוּחֲ/ךָ֖ אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/009.yaml
  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
translation:
  language: ml
  text: 'അവർ അക്കരെ കടന്നശേഷം ഏലിയാവ് എലീശയോടു പറഞ്ഞു: “ഞാൻ നിന്റെ അടുക്കൽനിന്ന് എടുക്കപ്പെടുന്നതിനുമുമ്പ്, നിനക്കുവേണ്ടി ഞാൻ എന്തു ചെയ്യണം എന്നു ചോദിക്കൂ.” എലീശ പറഞ്ഞു: “അങ്ങയുടെ ആത്മാവിന്റെ ഇരട്ടി ഓഹരി[a] എനിക്കു ലഭിക്കട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അങ്ങയുടെ ആത്മാവിന്റെ രണ്ട് ഓഹരികൾ എനിക്കു ലഭിക്കട്ടെ.” ഈ ഹീബ്രു ശൈലിക്ക് ‘ഇരട്ടി ഓഹരി’ എന്നാണ് അർഥം; ആദ്യജാതനു ലഭിച്ചിരുന്ന അവകാശഓഹരിയെ ഇത് സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “അങ്ങയുടെ ആത്മാവ്” എന്നത് ഏലിയാവിന്റെ പ്രവാചകശുശ്രൂഷയോടു ബന്ധപ്പെട്ട ആത്മാവിനെ സൂചിപ്പിക്കുന്നു. ഏലിയാവിനുണ്ടായിരുന്നതിന്റെ രണ്ടിരട്ടി പ്രവാചകശക്തിക്കായുള്ള അപേക്ഷയായി ചിലർ ഇതിനെ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: כְעָבְרָם
  choice: അവർ അക്കരെ കടന്നശേഷം
  rationale: עבר എന്ന ക്രിയയുടെ ബഹുവചനപ്രത്യയം ഏലിയാവിനെയും എലീശയെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള സംഭാഷണത്തിനു മുമ്പ് കടക്കൽ പൂർത്തിയായതായി സന്ദർഭം കാണിക്കുന്നതിനാൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: שְׁאַל
  choice: ചോദിച്ചുകൊൾക
  rationale: שאל എന്നതിന്റെ നേരിട്ടുള്ള ആജ്ഞാരൂപം. ഇവിടെ ഒരു അഭ്യർഥന ഉന്നയിക്കാൻ ഏലിയാവ് എലീശയോടു പറയുന്നതിനാൽ ‘ചോദിച്ചുകൊൾക’ യോജിക്കുന്നു.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: നിനക്കുവേണ്ടി എന്തു ചെയ്യണമെന്ന്
  rationale: എലീശയ്ക്കുവേണ്ടി എന്തു ചെയ്യണമെന്നു ചോദിക്കുന്ന ഏലിയാവിന്റെ വാഗ്ദാനസ്വഭാവമുള്ള വാക്ക്, അനാവശ്യമായ ഉറപ്പ് കൂട്ടിച്ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  choice: ഞാൻ നിന്റെ അടുക്കൽനിന്ന് എടുക്കപ്പെടുന്നതിനുമുമ്പ്
  rationale: לקח എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള കർമണിപ്രയോഗം നിലനിർത്തുകയും, מֵעִמָּךְ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ വേർപാട് ‘നിന്റെ അടുക്കൽനിന്ന്’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וִיהִי נָא
  choice: വരുമാറാകണമേ
  rationale: ജസ്സീവ് അഭ്യർഥനയ്ക്കു נָא നൽകുന്ന വിനയഭാവം മലയാളത്തിലെ ‘-ണമേ’ എന്ന അപേക്ഷാരൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: פִּי שְׁנַיִם
  choice: ഇരട്ടി ഓഹരി
  rationale: അക്ഷരാർഥത്തിൽ ‘രണ്ടിന്റെ അളവ്/പങ്ക്’ എന്ന ഈ ഹീബ്രു ശൈലി ഇരട്ടിയായ അവകാശഓഹരിയെ, പ്രത്യേകിച്ച് ആദ്യജാതന്റെ അവകാശത്തെ, ഓർമിപ്പിക്കുന്നു. ‘ഇരട്ടി ഓഹരി’ ആ സൂചന നിലനിർത്തുന്നു.
- source_word: בְּרוּחֲךָ
  choice: അങ്ങയുടെ ആത്മാവിന്റെ
  rationale: רוּחַ ഇവിടെ ഏലിയാവിനോടു ബന്ധപ്പെട്ട ആത്മാവിനെയോ പ്രവാചകശുശ്രൂഷയ്ക്കുള്ള ആത്മികദാനത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അങ്ങയുടെ’ എന്ന ബഹുമാനപ്രയോഗം ഗുരുശിഷ്യബന്ധത്തിനു ചേരുന്നതും ഹീബ്രുവിലെ ഉടമസ്ഥപ്രത്യയം നിലനിർത്തുന്നതുമാണ്.
- source_word: אֵלָי
  choice: എന്റെമേൽ വരുമാറാകണമേ
  rationale: അക്ഷരാർഥം ‘എന്നിലേക്കു/എനിക്ക്’ എന്നാണെങ്കിലും, ആത്മാവ് ഒരാളുടെമേൽ വരുന്നതിനെ സൂചിപ്പിക്കുന്ന മലയാള ബൈബിൾഭാഷയിൽ ഈ രൂപം സ്വാഭാവികവും അർഥസമ്പന്നവുമാണ്.
theological_decisions:
- issue: פִּי שְׁנַיִם בְּרוּחֲךָ എന്ന എലീശയുടെ അപേക്ഷയുടെ അർഥം
  choice: ഏലിയാവിന്റെ ആത്മാവിൽ ഒരു ഇരട്ടി ഓഹരിയാണ് എലീശ ചോദിക്കുന്നത്; ഇത് ആദ്യജാതന്റെ അവകാശഓഹരിയെ പ്രതിധ്വനിപ്പിച്ചേക്കാം.
  alternative: ഏലിയാവിനുണ്ടായിരുന്നതിന്റെ രണ്ടിരട്ടി പ്രവാചകശക്തിയാണ് എലീശ ചോദിക്കുന്നത്.
  rationale: פִּי שְׁנַיִם എന്ന ഹീബ്രു ശൈലി സാധാരണയായി ഇരട്ടി പങ്കിനെയോ ഓഹരിയെയോ സൂചിപ്പിക്കുന്നു. ‘ഇരട്ടി ഓഹരി’ എന്ന പരിഭാഷ അവകാശസംബന്ധമായ സൂചന നിലനിർത്തുകയും, അപേക്ഷയെ താരതമ്യാത്മക ശക്തിയുടെ കൃത്യമായ അളവായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ‘അങ്ങയുടെ ആത്മാവ്’ എന്നതിന്റെ സൂചിതവിഷയം
  choice: ഏലിയാവിനോടും അവന്റെ പ്രവാചകശുശ്രൂഷയോടും ബന്ധപ്പെട്ട ആത്മാവോ ആത്മികദാനമോ എന്നാണ് വാചകം തുറന്ന നിലയിൽ സൂചിപ്പിക്കുന്നത്.
  alternative: ഇത് സാങ്കേതികവും വ്യക്തവുമായ അർഥത്തിൽ പരിശുദ്ധാത്മാവിനെ നേരിട്ട് നാമകരണം ചെയ്യുന്നു.
  rationale: ഹീബ്രുവിലെ രണ്ടാംപുരുഷ ഉടമസ്ഥപ്രത്യയം ഏലിയാവിനുള്ളതോ അവനെ സവിശേഷമാക്കുന്നതോ ആയ ആത്മാവിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. മൂലപാഠം നിർബന്ധിക്കാത്ത പ്രത്യേക ത്രിത്വവ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ഏലിയാവ് എലീശയെ ‘നീ’ എന്നു അഭിസംബോധന ചെയ്യുമ്പോൾ, എലീശ ഗുരുവായ ഏലിയാവിനെ ‘അങ്ങ്’ എന്നു ബഹുമാനത്തോടെ അഭിസംബോധന ചെയ്യുന്നു. അപേക്ഷയിലെ വിനയം ‘-ണമേ’ രൂപത്തിൽ നൽകി; മതവിഭാഗസവിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
