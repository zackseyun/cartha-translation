id: 2KI.2.1
reference: 2 Kings 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הַעֲל֤וֹת יְהוָה֙ אֶת אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָ֑יִם וַ/יֵּ֧לֶךְ אֵלִיָּ֛הוּ וֶ/אֱלִישָׁ֖ע מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/001.yaml
  text: It happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
translation:
  language: ml
  text: യഹ്‌വേ ഏലിയാവിനെ ഒരു ചുഴലിക്കാറ്റിൽ[a] ആകാശത്തേക്ക്[b] എടുക്കാനിരിക്കുമ്പോൾ, ഏലിയാവും എലീശായും ഗിൽഗാലിൽനിന്ന് പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒരു കൊടുങ്കാറ്റിൽ’ അല്ലെങ്കിൽ ‘ചുഴലിക്കാറ്റിനാൽ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ആകാശങ്ങളിലേക്ക്’; ഇവിടെ സ്വാഭാവിക മലയാളത്തിൽ ‘ആകാശത്തേക്ക്’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: —
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സംഭവാരംഭസൂചകമായ ഈ രൂപം മലയാളത്തിൽ പ്രത്യേകമായി ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ ‘...ആയിരിക്കുമ്പോൾ’ എന്ന സ്വാഭാവിക വാക്യഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: בְּהַעֲלוֹת
  choice: എടുക്കാനിരിക്കുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള സംഭവത്തിന്റെ ആസന്നതയും עלה-യിലെ മുകളിലേക്കുള്ള ചലനവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בַּסְעָרָה
  choice: ഒരു ചുഴലിക്കാറ്റിൽ
  rationale: סְעָרָה കൊടുങ്കാറ്റിനെയോ ചുഴലിക്കാറ്റിനെയോ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ ‘ചുഴലിക്കാറ്റ്’ യോജിക്കുന്നു. בְּ-യുടെ ‘ൽ’ എന്ന രൂപം മാധ്യമം/സാഹചര്യം സംബന്ധിച്ച ചെറിയ അർത്ഥവ്യത്യാസം തുറന്നുവയ്ക്കുന്നു.
- source_word: הַשָּׁמָיִם
  choice: ആകാശത്തേക്ക്
  rationale: രൂപത്തിൽ ബഹുവചനമായ ഈ പദം ആകാശം/ആകാശമണ്ഡലം സൂചിപ്പിക്കാം; ഇവിടെ മേലോട്ടുള്ള ലക്ഷ്യം സ്വാഭാവിക മലയാളത്തിൽ ‘ആകാശത്തേക്ക്’ എന്നു നൽകുന്നു, മരണാനന്തര വാസസ്ഥലം എന്ന വ്യാഖ്യാനം നിർബന്ധിക്കാതെ.
- source_word: וַיֵּלֶךְ
  choice: പുറപ്പെട്ടു
  rationale: הלך യാത്രയുടെ ചലനം വിവരിക്കുന്നു; מן הַגִּלְגָּל എന്ന പുറപ്പെടുന്ന സ്ഥലത്തോടൊപ്പം ‘ഗിൽഗാലിൽനിന്ന് പുറപ്പെട്ടു’ സ്വാഭാവികമാണ്.
- source_word: מִן הַגִּלְגָּל
  choice: ഗിൽഗാലിൽനിന്ന്
  rationale: מן ഉറവിടമോ പുറപ്പെടുന്ന സ്ഥലമോ അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: הַשָּׁמַיִם എന്നതിന്റെ അർത്ഥം
  choice: ആകാശത്തേക്ക്
  alternative: സ്വർഗത്തിലേക്ക്
  rationale: ഈ സന്ദർഭത്തിൽ പദം മേലോട്ടുള്ള/ആകാശീയ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു. ‘ആകാശം’ മൂലത്തിലെ സ്ഥലസംബന്ധമായ വിശാലത നിലനിർത്തുകയും ഒരു പ്രത്യേക പരലോകസങ്കൽപ്പം അനാവശ്യമായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു ആഖ്യാനാരംഭരൂപം വാക്കിന് വാക്കായി ആവർത്തിക്കാതെ സ്വാഭാവിക സമയവാക്യത്തിൽ ഉൾപ്പെടുത്തി; ദൈവനാമവും സ്ഥലനാമങ്ങളും മലയാളത്തിലെ പരിചിത രൂപങ്ങളിൽ നൽകി.
