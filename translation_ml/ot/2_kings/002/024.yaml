  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֤פֶן אַֽחֲרָי/ו֙ וַ/יִּרְאֵ֔/ם וַֽ/יְקַלְלֵ֖/ם בְּ/שֵׁ֣ם יְהוָ֑ה וַ/תֵּצֶ֨אנָה שְׁתַּ֤יִם דֻּבִּים֙ מִן הַ/יַּ֔עַר וַ/תְּבַקַּ֣עְנָה מֵ/הֶ֔ם אַרְבָּעִ֥ים וּ/שְׁנֵ֖י יְלָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/024.yaml
  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: ml
  text: അവൻ തിരിഞ്ഞ് അവരെ നോക്കി; യഹോവയുടെ നാമത്തിൽ അവരെ ശപിച്ചു. അപ്പോൾ രണ്ടു പെൺകരടികൾ കാട്ടിൽനിന്നു പുറപ്പെട്ടുവന്ന് ആ കുട്ടികളിൽ നാല്പത്തിരണ്ടുപേരെ കീറിപ്പരിക്കേൽപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: അവൻ തിരിഞ്ഞ്
  rationale: സംഭവക്രമവും പിന്നിലുണ്ടായിരുന്നവരിലേക്കുള്ള തിരിഞ്ഞുനോട്ടവും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וַיְקַלְלֵם
  choice: അവരെ ശപിച്ചു
  rationale: ഹീബ്രു ക്രിയയുടെ നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുന്നു; ശാപത്തിന്റെ കൃത്യമായ ഉള്ളടക്കമോ ഫലമോ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: בְּשֵׁם יְהוָה
  choice: യഹോവയുടെ നാമത്തിൽ
  rationale: ദൈവനാമമായ יהוהയെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിലൂടെ വ്യക്തമാക്കുകയും 'നാമത്തിൽ' എന്ന ഉപാധിസംബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: שְׁתַּיִם דֻּבִּים
  choice: രണ്ടു പെൺകരടികൾ
  rationale: സ്ത്രീലിംഗ സംഖ്യാരൂപവും നാമത്തിന്റെ വ്യാകരണസമ്മതിയും കരടികൾ പെൺകരടികളാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וַתְּבַקַּעְנָה
  choice: കീറിപ്പരിക്കേൽപ്പിച്ചു
  rationale: בקע എന്ന ക്രിയയുടെ 'പിളർക്കുക/കീറുക' എന്ന ശക്തി നിലനിർത്തുന്നു; എന്നാൽ എല്ലാവരും കൊല്ലപ്പെട്ടു എന്നോ ശരീരം രണ്ടായി പിളർന്നു എന്നോ മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അതിരുകടന്ന നിർവചനം ഒഴിവാക്കുന്നു.
- source_word: יְלָדִים
  choice: കുട്ടികൾ
  rationale: ഇവിടെ സംഘത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ പദമായി വിവർത്തനം ചെയ്യുന്നു; കൃത്യമായ പ്രായപരിധി മൂലപദം നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ശാപവും യഹോവയുടെ നാമവും തമ്മിലുള്ള ബന്ധം
  choice: യഹോവയുടെ നാമത്തിൽ അവരെ ശപിച്ചു
  alternative: യഹോവയോട് അവരെ ശപിക്കാൻ അപേക്ഷിച്ചു
  rationale: മൂലപാഠം പ്രവാചകൻ യഹോവയുടെ നാമത്തിൽ ശപിച്ചതായി പറയുന്നു; അതിനെ പ്രാർത്ഥനയോ അപേക്ഷയോ ആയി പുനർവ്യാഖ്യാനിക്കുന്നില്ല.
- issue: കരടികളുടെ ആക്രമണഫലം
  choice: കീറിപ്പരിക്കേൽപ്പിച്ചു
  alternative: കൊന്നു / കീറിക്കളഞ്ഞു
  rationale: ആക്രമണത്തിന്റെ ഭീകരത മറയ്ക്കാതെ, നാല്പത്തിരണ്ടുപേരും മരിച്ചുവെന്ന് മൂലപാഠത്തിൽ ഇല്ലാത്ത നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് സുഗമവുമായ മലയാളം. ഹീബ്രു വാക്യത്തിന്റെ ചുരുങ്ങിയ സംഭവക്രമം നിലനിർത്തി; അനാവശ്യ വിശദീകരണങ്ങൾ ചേർത്തിട്ടില്ല.
