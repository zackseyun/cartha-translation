id: 2KI.2.7
reference: 2 Kings 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/חֲמִשִּׁ֨ים אִ֜ישׁ מִ/בְּנֵ֤י הַ/נְּבִיאִים֙ הָֽלְכ֔וּ וַ/יַּעַמְד֥וּ מִ/נֶּ֖גֶד מֵ/רָח֑וֹק וּ/שְׁנֵי/הֶ֖ם עָמְד֥וּ עַל הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/007.yaml
  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
translation:
  language: ml
  text: പ്രവാചകന്മാരുടെ പുത്രന്മാരിൽപ്പെട്ട അമ്പത് പുരുഷന്മാർ പോയി, ദൂരെ അവരുടെ എതിർവശത്ത് നിന്നു; ഇരുവരും യോർദ്ദാന്റെ അരികിൽ നിന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രവാചകന്മാരുടെ പുത്രന്മാർ” എന്നത് പ്രവാചക ശുശ്രൂഷയുമായി ബന്ധപ്പെട്ടിരുന്ന ഒരു അംഗീകൃത സംഘത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: അമ്പതു പുരുഷന്മാർ
  rationale: സംഖ്യയോടുകൂടിയ אִישׁ എന്ന പുല്ലിംഗരൂപം സ്വാഭാവികമായും കൃത്യമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: പ്രവാചകന്മാരുടെ പുത്രന്മാരിൽപ്പെട്ട
  rationale: ‘പ്രവാചകന്മാരുടെ പുത്രന്മാർ’ എന്ന അംഗീകൃത സംഘനാമത്തിന്റെ രൂപം നിലനിർത്തുന്നു; ‘ശിഷ്യന്മാർ’ പോലുള്ള വ്യാഖ്യാനപരമായ പകരം ഒഴിവാക്കുന്നു.
- source_word: הָלְכוּ וַיַּעַמְדוּ
  choice: പോയി ... നിന്നു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സാധാരണ ക്രിയകളെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִנֶּגֶד מֵרָחוֹק
  choice: അവർക്കെതിരേ ദൂരെ
  rationale: മുന്നിലോ എതിർവശത്തോ ഉള്ള സ്ഥാനബന്ധവും സ്ഥലപരമായ അകലവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: וּשְׁנֵיהֶם
  choice: ആ രണ്ടുപേരോ
  rationale: ഏലിയാവിനെയും എലീശയെയും സൂചിപ്പിക്കുന്ന വ്യക്തമായ ദ്വിവചനഭാവവും അമ്പതുപേരുമായുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: עָמְדוּ עַל הַיַּרְדֵּן
  choice: യോർദ്ദാനരികിൽ നിന്നു
  rationale: നദിയോടൊപ്പം עַל എന്നത് ഇവിടെ ‘അരികിൽ/തീരത്ത്’ എന്ന സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘യോർദ്ദാനരികിൽ’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പുത്രന്മാർ’ എന്ന മൂലരൂപം സാംസ്കാരിക കുറിപ്പോടെ നിലനിർത്തി; മിനേഗെദ്, മേരാഹോക് എന്നീ സ്ഥലസൂചനകൾ അനാവശ്യ പുരാതനഭാവമില്ലാതെ പരിഭാഷപ്പെടുത്തി.
