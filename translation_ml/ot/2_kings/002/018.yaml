id: 2KI.2.18
reference: 2 Kings 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ אֵלָ֔י/ו וְ/ה֖וּא יֹשֵׁ֣ב בִּ/ירִיח֑וֹ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם הֲ/לֽוֹא אָמַ֥רְתִּי אֲלֵי/כֶ֖ם אַל תֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/018.yaml
  text: When they returned to him[a], he was sitting in Jericho, and he said to them, “Did I not tell you, ‘Do not go’?”
translation:
  language: ml
  text: അവർ അവന്റെ അടുക്കൽ മടങ്ങിവന്നപ്പോൾ[a], അവൻ യെരീഹോവിൽ ഇരിക്കുകയായിരുന്നു. അവൻ അവരോട്, “പോകരുതെന്ന് ഞാൻ നിങ്ങളോടു പറഞ്ഞില്ലേ?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “അവർ അവന്റെ അടുക്കൽ മടങ്ങിവന്നു; അപ്പോൾ അവൻ യെരീഹോവിൽ ഇരിക്കുകയായിരുന്നു.”'
    reason: വാവോടുകൂടിയ എബ്രായ കഥനക്രിയയെ ‘മടങ്ങിവന്നു’ എന്നും സാഹചര്യവാക്യത്തെ വേറിട്ടും നൽകാവുന്ന ഘടനാപരമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: അവർ അവന്റെ അടുക്കൽ മടങ്ങിവന്നപ്പോൾ
  rationale: וַיָּשֻׁבוּ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ക്രിയയാണ്; തുടർന്നുള്ള സാഹചര്യവാക്യത്തോടുള്ള സമയബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘മടങ്ങിവന്നപ്പോൾ’ എന്നു നൽകി. אֵלָיו എന്നത് ‘അവന്റെ അടുക്കൽ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: וְהוּא יֹשֵׁב
  choice: അവൻ ... ഇരിക്കുകയായിരുന്നു
  rationale: יֹשֵׁב എന്നതിന് ‘ഇരിക്കുക’, ‘തങ്ങുക’, ‘താമസിക്കുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ‘ഇരിക്കുകയായിരുന്നു’ എന്ന മലയാളപ്രയോഗം മൂലപദത്തിന്റെ ദൃശ്യഭാവവും അവൻ യെരീഹോവിൽ തുടർന്നിരുന്നുവെന്ന സാഹചര്യാർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: בִּירִיחוֹ
  choice: യെരീഹോവിൽ
  rationale: സ്ഥലനാമത്തെയും בְּ എന്ന സ്ഥലസൂചക ഉപസർഗത്തെയും സാധാരണ മലയാളരീതിയിൽ നൽകി.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: അവൻ അവരോട് ... എന്നു ചോദിച്ചു
  rationale: אמר അടിസ്ഥാനപരമായി സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഇവിടെ ഉദ്ധരിക്കപ്പെട്ട വാക്കുകൾ ഒരു ആലങ്കാരിക ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘എന്നു ചോദിച്ചു’ എന്നത് സ്വാഭാവികവും പ്രസംഗശക്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞില്ലേ?
  rationale: הֲלוֹא സമ്മതം പ്രതീക്ഷിക്കുന്ന ആലങ്കാരിക ചോദ്യമാണ്; ‘പറഞ്ഞില്ലേ?’ അതിന്റെ ഓർമിപ്പിക്കുന്ന, നേരിയ ശാസനാഭാവം സ്വാഭാവികമായി പകരുന്നു.
- source_word: אַל תֵּלֵכוּ
  choice: പോകരുത്
  rationale: אַל കൂടിയ അപൂർണക്രിയ നിരോധനം പ്രകടിപ്പിക്കുന്നു; ‘പോകരുത്’ അതിന്റെ നേരിട്ടുള്ള കല്പനാശക്തി കൃത്യമായി നൽകുന്നു.
