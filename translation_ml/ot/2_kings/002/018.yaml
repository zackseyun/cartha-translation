translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘ഇരിക്കുകയായിരുന്നു’ എന്നത് പദാനുപദമായ ‘ഇരിക്കുക’ എന്ന അർഥത്തെയും സന്ദർഭത്തിലെ ‘അവിടെത്തന്നെ തുടരുക/തങ്ങുക’ എന്ന അർഥത്തെയും തുറന്നുവയ്ക്കുന്നു.
