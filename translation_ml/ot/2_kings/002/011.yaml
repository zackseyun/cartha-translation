  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
translation:
  language: ml
  text: അവർ നടന്നും സംസാരിച്ചും കൊണ്ടിരിക്കുമ്പോൾ, അതാ, ഒരു അഗ്നിരഥവും അഗ്നിക്കുതിരകളും അവരിരുവരെയും വേർപെടുത്തി[b]. ഏലിയാവ് ചുഴലിക്കാറ്റിൽ[a] സ്വർഗത്തിലേക്ക് കയറിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചുഴലിക്കാറ്റിനാൽ’ എന്നോ ‘ചുഴലിക്കാറ്റോടുകൂടെ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ഉപസർഗം മാർഗം, അനുഗമനം, സ്ഥാനം എന്നിവ സൂചിപ്പിക്കാവുന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഗ്നിരഥവും അഗ്നിക്കുതിരകളും ഏലിയാവിനെയും എലീശയെയും വേർപെടുത്തിയെന്നും ഏലിയാവ് ചുഴലിക്കാറ്റിൽ കയറിപ്പോയെന്നും മാത്രമാണ് വാചകം പറയുന്നത്; ഏലിയാവ് രഥത്തിൽ കയറിയതായി അത് വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הֵמָּה הֹלְכִים הָלוֹךְ וְדַבֵּר
  choice: അവർ നടന്നുകൊണ്ട് സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ആഖ്യാനത്തിലെ കാലസംബന്ധമായ മാറ്റവും הֹלְכִים הָלוֹךְ എന്ന പ്രയോഗത്തിന്റെ തുടർച്ചാസ്വഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള ദൃശ്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ നാടകീയശക്തി സംരക്ഷിക്കുന്നു.
- source_word: רֶכֶב אֵשׁ וְסוּסֵי אֵשׁ
  choice: ഒരു അഗ്നിരഥവും അഗ്നിക്കുതിരകളും
  rationale: ‘തീയുടെ രഥം, തീയുടെ കുതിരകൾ’ എന്ന മൂലരൂപകത്തെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാള സമാസങ്ങളിലൂടെ നിലനിർത്തുന്നു; അവയുടെ ഭൗതികസ്വഭാവം കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם
  choice: അവരിരുവരെയും വേർപെടുത്തി
  rationale: ബഹുവചനക്രിയയുടെ കർത്താവായി രഥത്തെയും കുതിരകളെയും ഒരുമിച്ച് ഗ്രഹിക്കുകയും שְׁנֵיהֶם സൂചിപ്പിക്കുന്ന ‘ഇരുവരും’ എന്ന ആശയം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיַּעַל אֵלִיָּהוּ
  choice: ഏലിയാവ് കയറിപ്പോയി
  rationale: עלה എന്ന ക്രിയയുടെ മുകളിലേക്കുള്ള ഗതി ലളിതവും ആഖ്യാനയോഗ്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּסְּעָרָה
  choice: ചുഴലിക്കാറ്റിൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന് ഇവിടെ മാർഗം, അനുഗമനം, സ്ഥാനം എന്നീ സൂക്ഷ്മതകൾ സാധ്യമായതിനാൽ അവയിൽ ഒന്ന് മാത്രം നിർബന്ധമായി തീരുമാനിക്കാത്ത സ്വാഭാവിക മലയാളപ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: הַשָּׁמָיִם
  choice: സ്വർഗത്തിലേക്ക്
  rationale: ഈ ഉയർത്തപ്പെടൽവിവരണത്തിന്റെ സാഹിത്യ-ദൈവശാസ്ത്രപരമായ സന്ദർഭത്തിൽ ‘സ്വർഗം’ യോജിക്കുന്നു; ദിശാസൂചനയ്ക്കായി ‘-ലേക്ക്’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: അഗ്നിരഥമാണോ ഏലിയാവിനെ വഹിച്ചത്, അതോ ചുഴലിക്കാറ്റുമായിട്ടാണോ അവന്റെ കയറിപ്പോകൽ ബന്ധപ്പെട്ടത്?
  choice: അഗ്നിരഥവും അഗ്നിക്കുതിരകളും ഇരുവരെയും വേർപെടുത്തിയെന്നും ഏലിയാവ് ചുഴലിക്കാറ്റിൽ സ്വർഗത്തിലേക്ക് കയറിപ്പോയെന്നും മാത്രം പറയുന്നു.
  alternative: ഏലിയാവ് അഗ്നിരഥത്തിൽ കയറി സ്വർഗത്തിലേക്ക് പോയി.
  rationale: ഹീബ്രു വാചകം രഥവും കുതിരകളും വേർപെടുത്തിയതായി പറയുന്നു; ഏലിയാവിന്റെ കയറിപ്പോകലിനെ പ്രത്യേകം ചുഴലിക്കാറ്റുമായി ബന്ധിപ്പിക്കുന്നു. രഥത്തിൽ സഞ്ചരിച്ചു എന്ന് വാചകം വ്യക്തമായി പറയാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: בַּסְּעָרָה എന്നതിലെ ഉപസർഗത്തിന്റെ അർഥം
  choice: ചുഴലിക്കാറ്റിൽ
  alternative: ചുഴലിക്കാറ്റിനാൽ / ചുഴലിക്കാറ്റോടുകൂടെ
  rationale: മാർഗം, അനുഗമനം, സ്ഥാനം എന്നിവയിൽ ഏതാണെന്നുള്ള യഥാർഥ ഭാഷാപരമായ അവ്യക്തത നിലനിർത്തുന്നു; പാദക്കുറിപ്പിൽ സാധ്യതകൾ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതാ’ നാടകീയമായ ശ്രദ്ധാകർഷണം നിലനിർത്തുന്നു; പഴഞ്ചൻ ക്രിയാരൂപങ്ങളും അനാവശ്യമായ സഭാപര പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
