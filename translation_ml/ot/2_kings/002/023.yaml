  yaml_path: translation/ot/2_kings/002/023.yaml
  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
translation:
  language: ml
  text: പിന്നെ അവൻ അവിടെനിന്ന് ബേഥേലിലേക്കു കയറിപ്പോയി. അവൻ വഴിയിലൂടെ കയറിപ്പോകുമ്പോൾ, നഗരത്തിൽനിന്ന് ചെറിയ ബാലന്മാർ[a] പുറത്തുവന്ന് അവനെ പരിഹസിച്ചു. അവർ അവനോടു, “കയറിപ്പോ, മൊട്ടത്തലയാ! കയറിപ്പോ[b], മൊട്ടത്തലയാ!” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ചെറുപ്പക്കാർ” അല്ലെങ്കിൽ “യുവാക്കൾ”; എബ്രായപദസമുച്ചയം വളരെ ചെറിയ കുട്ടികളെ മാത്രമല്ല, കൂടുതൽ വിശാലമായി ചെറുപ്പക്കാരായ ആൺകുട്ടികളെയോ യുവാക്കളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ആവർത്തിച്ചുള്ള “കയറിപ്പോ” വെറുമൊരു പരിഹാസവിളിയായിരിക്കാം; എന്നാൽ ഏലിയാവ് മുകളിലേക്ക് എടുക്കപ്പെട്ട സംഭവത്തെയും അത് സൂചിപ്പിക്കുന്നുണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: പിന്നെ അവൻ ... കയറിപ്പോയി
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറിപ്പോകുക’ എന്ന അടിസ്ഥാനാർഥവും തുടർന്നുള്ള പരിഹാസവാക്കുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു; ‘പിന്നെ’ ആഖ്യാനക്രമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וְהוּא עֹלֶה בַדֶּרֶךְ
  choice: അവൻ വഴിയിലൂടെ കയറിപ്പോകുമ്പോൾ
  rationale: സർവനാമത്തോടുകൂടിയ കർത്തൃവാചക രൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തിയെ ‘കയറിപ്പോകുമ്പോൾ’ പ്രകടമാക്കുന്നു; עלה എന്ന പദത്തിന്റെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: נְעָרִים קְטַנִּים
  choice: ചെറിയ ബാലന്മാർ
  rationale: קטנים എന്ന വിശേഷണത്തിന്റെ ശക്തി പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു. נערים കൂടുതൽ വിശാലമായ പ്രായപരിധി സൂചിപ്പിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: יָצְאוּ מִן הָעִיר
  choice: പട്ടണത്തിൽനിന്ന് ... പുറത്തുവന്ന്
  rationale: יצא എന്നതിന്റെ പുറത്തുവരുക എന്ന അർഥം സ്വാഭാവിക മലയാള ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
- source_word: וַיִּתְקַלְּסוּ בוֹ
  choice: അവനെ പരിഹസിച്ചുകൊണ്ട്
  rationale: Hitpael രൂപത്തിലുള്ള קלס സൂചിപ്പിക്കുന്ന അവഹേളനപരമായ പരിഹാസം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: עֲלֵה
  choice: കയറിപ്പോ
  rationale: ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ എന്ന മൂലാർഥവും എലീശാ കയറിപ്പോയതുമായ പദാവർത്തനവും സംരക്ഷിക്കുന്നു; പരിഹാസത്തിന്റെ കൃത്യമായ ഉദ്ദേശ്യം വ്യാഖ്യാനിച്ച് തീർപ്പാക്കുന്നില്ല.
- source_word: קֵרֵחַ
  choice: മൊട്ടത്തലയാ
  rationale: ‘കഷണ്ടിയുള്ളവൻ’ എന്ന അർഥത്തോടൊപ്പം നേരിട്ടുള്ള വിളിയിലെ നിന്ദാപരമായ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
theological_decisions:
- issue: പരിഹാസത്തിൽ ആവർത്തിക്കുന്ന עֲלֵה എന്നതിന്റെ സാധ്യതയുള്ള സൂചന
  choice: പ്രധാനവാചകത്തിൽ അക്ഷരാർഥത്തിന് അടുത്ത ‘കയറിപ്പോ’ നിലനിർത്തി
  alternative: ‘ഇവിടെനിന്ന് പോ’ എന്ന പരിഹാസമായോ ‘ഏലിയാവിനെപ്പോലെ മുകളിലേക്കു പോകുക’ എന്ന സൂചനയായോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: എബ്രായത്തിൽ ‘കയറിപ്പോ’ എന്ന ആജ്ഞ വ്യക്തമാണ്; എന്നാൽ പരിഹാസത്തിന്റെ കൃത്യമായ സൂചന തർക്കവിഷയമായതിനാൽ പ്രധാനവാചകം അതിനെ തീർപ്പാക്കാതെ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: נְעָרִים קְטַנִּים സൂചിപ്പിക്കുന്ന പ്രായം
  choice: പ്രധാനവാചകത്തിൽ ‘ചെറിയ ബാലന്മാർ’; വിശാലമായ പ്രായസാധ്യത അടിക്കുറിപ്പിൽ
  alternative: ‘യുവാക്കൾ’, ‘കൗമാരക്കാർ’, അല്ലെങ്കിൽ ‘ചെറുപ്പക്കാർ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക
  rationale: ഈ പദസമുച്ചയം ചെറുപ്പക്കാരായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നുവെങ്കിലും נערים എന്നതിന് ചെറിയ കുട്ടികളേക്കാൾ വിശാലമായ പ്രായപരിധി ഉണ്ടാകാം. അതിനാൽ പ്രായത്തെയും ഉത്തരവാദിത്വത്തെയും അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള പരിഹാസവാക്കിൽ മാത്രം സന്ദർഭത്തിനൊത്ത സംസാരഭാവം ഉപയോഗിച്ചു. എബ്രായത്തിലെ עלה എന്ന പദത്തിന്റെ ആഖ്യാന-പരിഹാസ ആവർത്തനം ‘കയറിപ്പോയി/കയറിപ്പോകുമ്പോൾ/കയറിപ്പോ’ എന്ന ക്രമത്തിൽ പരമാവധി സംരക്ഷിച്ചു.
