source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל אֱלִישָׁ֔ע הִנֵּה נָ֞א מוֹשַׁ֤ב הָ/עִיר֙ ט֔וֹב כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י רֹאֶ֑ה וְ/הַ/מַּ֥יִם רָעִ֖ים וְ/הָ/אָ֥רֶץ מְשַׁכָּֽלֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/019.yaml
  text: Then the men of the city said to Elisha[a], “Please look, the location of the city is good, as my lord sees; but the water is bad, and the land causes miscarriages.”
translation:
  language: ml
  text: 'അപ്പോൾ നഗരത്തിലെ പുരുഷന്മാർ എലീശയോടു പറഞ്ഞു: “ദയവായി നോക്കൂ, എന്റെ പ്രഭു കാണുന്നതുപോലെ നഗരത്തിന്റെ സ്ഥാനം നല്ലതാണ്; എന്നാൽ വെള്ളം മോശമാണ്, ദേശം ഗർഭസ്രാവം വരുത്തുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദേശം ഫലശൂന്യമാണ്.” “ഗർഭസ്രാവം വരുത്തുന്നു” എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന എബ്രായപദം സന്തതിനഷ്ടം വരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ അതിൽ കാർഷിക ഫലശൂന്യതയും ഉൾപ്പെട്ടേക്കാം.
    reason: מְשַׁכָּלֶת എന്ന പദത്തിന്റെ സന്തതിനഷ്ടമെന്ന നേരിട്ടുള്ള കാരകാർഥവും സന്ദർഭത്തിൽ സാധ്യമായ കാർഷിക ഫലശൂന്യതയും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אַנְשֵׁי הָעִיר
  choice: നഗരത്തിലെ പുരുഷന്മാർ
  rationale: എബ്രായം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമായതിനാൽ ലിംഗനിർണ്ണയം പൊതുവാക്കാതെ നിലനിർത്തുന്നു.
- source_word: הִנֵּה נָא
  choice: യജമാനൻ കാണുന്നതുപോലെ
  rationale: തുടർന്നുള്ള ‘കാണുന്നു’ എന്ന പ്രയോഗത്തോടൊപ്പം ശ്രദ്ധ ക്ഷണിക്കുന്നതും വിനയമുള്ള അഭ്യർഥനയും മലയാള വാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; പ്രത്യേകം ‘ഇതാ, ദയവായി നോക്കൂ’ എന്നു ചേർത്താൽ ആവർത്തനം കൃത്രിമമാകും.
- source_word: מוֹשַׁב הָעִיר
  choice: ഈ നഗരത്തിന്റെ സ്ഥാനം
  rationale: ഇവിടെ പദം നഗരത്തിന്റെ വാസസ്ഥലത്തേക്കാൾ അതിന്റെ സ്ഥിതി ചെയ്യുന്ന ഇടത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: טוֹב
  choice: നല്ലതാണ്
  rationale: നഗരത്തിന്റെ സ്ഥാനത്തെ അനുകൂലമായി വിലയിരുത്തുന്ന സാധാരണവും നേരിട്ടുള്ളതുമായ വിവർത്തനം.
- source_word: כַּאֲשֶׁר אֲדֹנִי רֹאֶה
  choice: യജമാനൻ കാണുന്നതുപോലെ
  rationale: എലീശയോടുള്ള ആദരപൂർവമായ സാമൂഹിക അഭിസംബോധനയായി അֲדֹנִיയെ ‘യജമാനൻ’ എന്നു നൽകി; ദൈവിക പദവിയായി അവതരിപ്പിക്കുന്നില്ല.
- source_word: וְהַמַּיִם רָעִים
  choice: എന്നാൽ വെള്ളം മോശമാണ്
  rationale: നഗരത്തിന്റെ നല്ല സ്ഥാനവും ദുഷിച്ച ജലവും തമ്മിലുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; മַיִם മലയാളത്തിൽ സ്വാഭാവികമായി ഏകവചന സമൂഹനാമമായ ‘വെള്ളം’ ആകുന്നു.
- source_word: וְהָאָרֶץ
  choice: ദേശമാകട്ടെ
  rationale: אֶרֶץ പ്രദേശത്തെയും മണ്ണിനെയും സൂചിപ്പിക്കാവുന്ന വിശാലത നിലനിർത്താൻ ‘ദേശം’ ഉപയോഗിച്ചു; മുൻ വൈരുധ്യത്തിന്റെ തുടർച്ച ‘ആകട്ടെ’ വ്യക്തമാക്കുന്നു.
- source_word: מְשַׁכָּלֶת
  choice: ഗർഭം അലസിപ്പിക്കുന്നു
  rationale: שׁכל എന്ന ധാതുവിന്റെ കാരകഭാവം സന്തതിനഷ്ടം വരുത്തുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. കൃഷിസംബന്ധമായ ഫലശൂന്യതയിലേക്കും അർഥം വ്യാപിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: എലീശയോടുള്ള אֲדֹנִי എന്ന അഭിസംബോധന
  choice: യജമാനൻ
  alternative: എന്റെ യജമാനൻ
  rationale: ഇത് ദൈവിക നാമമല്ല, സാമൂഹിക ആദരസൂചകമാണ്. മലയാളത്തിൽ നേരിട്ടുള്ള ആദരാഭിസംബോധനയിൽ ‘യജമാനൻ’ സ്വാഭാവികമാണ്; എബ്രായത്തിലെ ഒന്നാംപുരുഷ പ്രത്യയം കൂടുതൽ ഔപചാരികമായി നിലനിർത്തണമെങ്കിൽ ‘എന്റെ യജമാനൻ’ സാധ്യമാണ്.
- issue: מְשַׁכָּלֶת എന്നതിന്റെ പരിധി
  choice: ഗർഭം അലസിപ്പിക്കുന്നു
  alternative: ഫലശൂന്യമാക്കുന്നു
  rationale: പ്രധാനപാഠം സന്തതിനഷ്ടം വരുത്തുന്ന കാരകാർഥം സംരക്ഷിക്കുന്നു; മനുഷ്യരിലോ മൃഗങ്ങളിലോ സംഭവിക്കുന്ന ഗർഭനഷ്ടത്തിനൊപ്പം കാർഷിക ഉൽപ്പാദനക്ഷമതക്കുറവും സന്ദർഭത്തിൽ ഉൾപ്പെടാമെന്ന യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഗർഭം അലസിപ്പിക്കുന്നു’ എന്നത് അപരിചിതമായ അക്ഷരാനുവാദം ഒഴിവാക്കി കാരകഭാവം വ്യക്തമായി നൽകുന്നു; അടിക്കുറിപ്പ് സന്ദർഭത്തിലെ കാർഷിക സാധ്യത നിലനിർത്തുന്നു.
