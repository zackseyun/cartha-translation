- from: 'അപ്പോൾ നഗരത്തിലെ പുരുഷന്മാർ എലീശയോടു പറഞ്ഞു: “യജമാനൻ കാണുന്നതുപോലെ, ഈ നഗരത്തിന്റെ സ്ഥാനം നല്ലതാണ്. എന്നാൽ വെള്ളം മോശമാണ്; ദേശമാകട്ടെ ഗർഭം അലസിപ്പിക്കുന്നു[a].”'
  to: 'അപ്പോൾ നഗരത്തിലെ പുരുഷന്മാർ എലീശയോടു പറഞ്ഞു: “ദയവായി നോക്കൂ, എന്റെ പ്രഭു കാണുന്നതുപോലെ നഗരത്തിന്റെ സ്ഥാനം നല്ലതാണ്; എന്നാൽ വെള്ളം മോശമാണ്, ദേശം ഗർഭസ്രാവം വരുത്തുന്നു[a].”'
  rationale: പുതിയ പാഠം הִנֵּה נָא-യുടെ അപേക്ഷാപൂർവമായ ശ്രദ്ധക്ഷണനം പുനഃസ്ഥാപിക്കുന്നു; כַּאֲשֶׁר אֲדֹנִי רֹאֶה-യെ ‘എന്റെ പ്രഭു കാണുന്നതുപോലെ’ എന്നു നേരിട്ട് നൽകുന്നു; מְשַׁכָּלֶת-ന്റെ കഠിനവും കാരകവുമായ അർഥം ‘ഗർഭസ്രാവം വരുത്തുന്നു’ എന്നു നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് വ്യാഖ്യാനത്തെ പ്രധാനപാഠത്തിലേക്കു തള്ളിക്കയറ്റാതെ പ്രസക്തമായ കാർഷിക സാധ്യത രേഖപ്പെടുത്തുന്നു.
