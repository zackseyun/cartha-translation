source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר קְחוּ לִ/י֙ צְלֹחִ֣ית חֲדָשָׁ֔ה וְ/שִׂ֥ימוּ שָׁ֖ם מֶ֑לַח וַ/יִּקְח֖וּ אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/020.yaml
  text: He said[a], “Bring me a new bowl, and put salt in it.” So they brought it to him.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “എനിക്കൊരു പുതിയ ചെറിയ പാത്രം കൊണ്ടുവരുവിൻ; അതിൽ ഉപ്പ് ഇടുവിൻ.” അപ്പോൾ അവർ അത് അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വയ്യക്ഷണകഥനത്തിലെ സാധാരണ wayyiqtol രൂപം; മലയാളത്തിലെ സ്വാഭാവിക കഥനശൈലിക്കായി തുടക്കത്തിലെ സംയോജകം വ്യക്തമാക്കാതെ ക്രമം നിലനിർത്തുന്നു.
- source_word: קְחוּ לִי
  choice: എനിക്കായി … കൊണ്ടുവരുക
  rationale: לקח എന്നതിന് അക്ഷരാർഥത്തിൽ ‘എടുക്കുക’ എന്നാണെങ്കിലും, לִי ചേർന്ന ഈ അഭ്യർഥനാസന്ദർഭത്തിൽ ആവശ്യപ്പെട്ട വസ്തു സംസാരിക്കുന്നവന്റെ അടുക്കൽ എത്തിക്കുക എന്ന അർഥം സ്വാഭാവികമാണ്.
- source_word: צְלֹחִית
  choice: ചെറിയ പാത്രം
  rationale: ഈ നാമം ഒരു ചെറിയ പാത്രത്തെയോ കൊള്ളാവുന്ന ഉപകരണത്തെയോ പൊതുവായി സൂചിപ്പിക്കുന്നു; നിർദിഷ്ടമായ ആകൃതി അടിച്ചേൽപ്പിക്കാതെ അർഥപരിധി നിലനിർത്തുന്നു.
- source_word: חֲדָשָׁה
  choice: പുതിയ
  rationale: പാത്രത്തെ വിശേഷിപ്പിക്കുന്ന ലളിതമായ വിശേഷണം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְשִׂימוּ שָׁם מֶלַח
  choice: അതിൽ ഉപ്പ് ഇടുക
  rationale: שָׁם അക്ഷരാർഥത്തിൽ ‘അവിടെ’ എന്നാണെങ്കിലും, പരാമർശിച്ച പാത്രത്തിനുള്ളിൽ എന്നതാണ് സന്ദർഭാർഥം; മലയാളത്തിൽ ‘അതിൽ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וַיִּקְחוּ אֵלָיו
  choice: അപ്പോൾ അവർ അത് അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: സന്ദർഭത്തിൽ לקח ആവശ്യപ്പെട്ട പാത്രം എലീശായുടെ അടുക്കൽ എത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ഹീബ്രുവിൽ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന കർമം മലയാളത്തിൽ ‘അത്’ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. צְלֹחִית എന്നതിന്റെ രൂപം വ്യക്തമല്ലാത്തതിനാൽ ‘കിണ്ണം’, ‘കുടം’, ‘കുപ്പി’ തുടങ്ങിയ കൂടുതൽ നിർദിഷ്ട പദങ്ങൾക്ക് പകരം ‘ചെറിയ പാത്രം’ സ്വീകരിച്ചു; അതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
