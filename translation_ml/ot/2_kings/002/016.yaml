source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him, “Look, your servants have fifty able men. Please let them go and search for your master. Perhaps the Spirit of Yahweh[a] has carried him away and thrown him onto one of the mountains or into one of the valleys.” But he said, “Do not send them.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അവനോടു പറഞ്ഞു: “ഇതാ, അങ്ങയുടെ ദാസന്മാരുടെ ഇടയിൽ കഴിവുള്ള അമ്പത് പുരുഷന്മാരുണ്ട്. അവർ പോയി അങ്ങയുടെ യജമാനനെ അന്വേഷിക്കാൻ ദയവായി അനുവദിക്കണമേ. ഒരുപക്ഷേ യാഹ്‌വേയുടെ ആത്മാവ്[a] അദ്ദേഹത്തെ എടുത്തുകൊണ്ടുപോയി ഏതെങ്കിലും ഒരു മലമേലോ താഴ്‌വരയിലോ എറിഞ്ഞിട്ടുണ്ടാകാം.” എന്നാൽ അവൻ പറഞ്ഞു: “അവരെ അയയ്ക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യാഹ്‌വേയുടെ കാറ്റ് അദ്ദേഹത്തെ എടുത്തുകൊണ്ടുപോയി.” ഇവിടെ “ആത്മാവ്” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് “കാറ്റ്” എന്നും അർഥമാകാം.
    reason: רוּחַ എന്ന പദത്തിന്റെ പ്രസക്തമായ വ്യത്യസ്ത അർഥസാധ്യത സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ഇതാ
  rationale: നിർദേശം അവതരിപ്പിക്കുന്ന ശ്രദ്ധാകർഷക പ്രയോഗം; തുടർന്നുള്ള അപേക്ഷയിൽ വിനയം പ്രത്യേകം വ്യക്തമാക്കുന്നു.
- source_word: יֵשׁ אֶת עֲבָדֶיךָ חֲמִשִּׁים אֲנָשִׁים
  choice: അങ്ങയുടെ ദാസന്മാരുടെ ഇടയിൽ ... അമ്പത് പുരുഷന്മാരുണ്ട്
  rationale: ദാസന്മാരിൽ ലഭ്യരായ ആളുകളെ സൂചിപ്പിക്കുന്ന അസ്തിത്വവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי חַיִל
  choice: കഴിവുള്ള ... പുരുഷന്മാർ
  rationale: അന്വേഷണത്തിന് യോഗ്യരും പ്രാപ്തരുമായ ആളുകൾ എന്ന ആശയം നൽകുന്നു; സൈനികവീരതയോ ശാരീരികബലമോ മാത്രം സൂചിപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: יֵלְכוּ נָא
  choice: അവർ പോയി ... ദയവായി അനുവദിക്കണമേ
  rationale: ജസ്സീവ് രൂപത്തോടുകൂടിയ נָאയുടെ വിനീതമായ അനുമതിയപേക്ഷ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  choice: അങ്ങയുടെ യജമാനനെ അന്വേഷിക്കാൻ
  rationale: בקשׁ ഇവിടെ കാണാതായ വ്യക്തിയെ തിരയുക എന്ന അർഥത്തിലാണ്; אֲדֹנֶיךָ ഏലീശയുടെ ഗുരുവും യജമാനനുമായ ഏലീയാവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: פֶּן
  choice: ഒരുപക്ഷേ
  rationale: തടയേണ്ട ഫലമല്ല, ഏലീയാവിന്റെ അപ്രത്യക്ഷതയ്ക്കുള്ള അനിശ്ചിത സാധ്യതയാണ് സന്ദർഭത്തിൽ അവതരിപ്പിക്കുന്നത്.
- source_word: נְשָׂאוֹ רוּחַ יְהוָה
  choice: യഹോവയുടെ ആത്മാവ് അദ്ദേഹത്തെ എടുത്തുകൊണ്ടുപോയി
  rationale: അസാധാരണമായ ദൈവിക പ്രവർത്തനമാണ് സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്; רוּחַ എന്നതിന്റെ ‘കാറ്റ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּשְׁלִכֵהוּ
  choice: എറിഞ്ഞിട്ടുണ്ടാകാം
  rationale: נשא ... וישלכהו എന്ന സംയുക്ത പ്രവർത്തനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിച്ച്, വലിച്ചെറിയുക/എറിയുക എന്ന ക്രിയാബലം സംരക്ഷിക്കുന്നു.
- source_word: בְּאַחַד הֶהָרִים א֖וֹ בְּאַחַת הַגיאות
  choice: ഏതെങ്കിലും ഒരു മലമേലോ താഴ്‌വരയിലോ
  rationale: രണ്ട് ഭൂപ്രദേശങ്ങളിലേതെങ്കിലും ഒന്നിൽ എന്ന അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു; ചലനത്തിന്റെ ലക്ഷ്യസ്ഥാനം മലയാളത്തിലെ വിഭക്തികളാൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא תִשְׁלָחוּן
  choice: അവരെ അയയ്ക്കരുത്
  rationale: ബഹുവചന നിരോധനത്തെ നേരായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: רוּחַ יְהוָה എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: യഹോവയുടെ ആത്മാവ്
  alternative: യഹോവയുടെ കാറ്റ്
  rationale: ഏലീയാവിനെ അസാധാരണമായി മറ്റൊരിടത്തേക്ക് കൊണ്ടുപോയ ദൈവിക പ്രവർത്തകനെക്കുറിച്ചാണ് പ്രവാചകശിഷ്യന്മാർ കരുതുന്നത് എന്നതിനാൽ ‘ആത്മാവ്’ മുഖ്യവായനയായി സ്വീകരിച്ചു. എങ്കിലും רוּחַ എന്ന എബ്രായപദത്തിന് ‘കാറ്റ്’ എന്നും അർഥമാകുന്നതിനാൽ ആ യഥാർഥ ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരസൂചകവും ഗൗരവമുള്ളതുമായ മലയാളം. പ്രവാചകശിഷ്യന്മാർ ഏലീശയോട് നടത്തുന്ന വിനീത അഭ്യർഥനയിൽ “അങ്ങ്/അങ്ങയുടെ” ഉപയോഗിച്ചു; വിവരണവാക്യത്തിൽ സ്വാഭാവികമായ “അവൻ” നിലനിർത്തി. സാങ്കേതികമോ സഭാവിഭാഗവിശേഷമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
