source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ אֶל אֱלִישָׁ֜ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי עַד בֵּֽית אֵ֔ל וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּרְד֖וּ בֵּֽית אֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
translation:
  language: ml
  text: 'ഏലിയാവ് എലീശയോടു പറഞ്ഞു: “ദയവായി ഇവിടെത്തന്നെ ഇരിക്കൂ; യഹോവ എന്നെ ബേഥേൽവരെ[a] അയച്ചിരിക്കുന്നു.” എന്നാൽ എലീശ പറഞ്ഞു: “യഹോവ ജീവിച്ചിരിക്കുന്നതുപോലെയും അങ്ങ് ജീവിച്ചിരിക്കുന്നതുപോലെയും സത്യം[b], ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല.” അങ്ങനെ അവർ ബേഥേലിലേക്ക് ഇറങ്ങിച്ചെന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ബേഥേൽവരെ’ എന്നാണ്; സന്ദർഭത്തിൽ ലളിതമായി ‘ബേഥേലിലേക്ക്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിലെ ശപഥസൂത്രം അക്ഷരാർഥത്തിൽ: ‘യഹോവ ജീവിക്കുന്നതുപോലെയും അങ്ങയുടെ ജീവൻ ജീവിക്കുന്നതുപോലെയും, ഞാൻ അങ്ങയെ വിട്ടുപോയാൽ …’. അപൂർണമായി നിർത്തിയ ഈ നിഷേധശപഥത്തിന്റെ അർഥം: ‘ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: ദയവായി ഇവിടെത്തന്നെ താമസിക്കുക
  rationale: ישׁב എന്ന ക്രിയയ്ക്ക് ‘ഇരിക്കുക’, ‘താമസിക്കുക’, ‘നിൽക്കുക’ എന്നീ അർഥങ്ങൾ വരാം. എലീശ കൂടെ വരാതിരിക്കണമെന്ന സന്ദർഭാർഥം ‘ഇവിടെത്തന്നെ താമസിക്കുക’ സ്വാഭാവികമായി നൽകുന്നു; נָאയിലെ വിനയഭാവം ‘ദയവായി’ എന്നു പ്രകടമാക്കി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുർക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: שְׁלָחַנִי עַד בֵּית אֵל
  choice: എന്നെ ബേഥേൽവരെ അയച്ചിരിക്കുന്നു
  rationale: עַד എന്ന പദത്തിന്റെ ‘വരെ/അത്രദൂരം’ എന്ന അതിർത്തി-ദിശാസൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ‘ബേഥേലിലേക്ക്’ എന്നും മനസ്സിലാക്കാം.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: ജീവിക്കുന്ന യഹോവയാണ, അങ്ങയുടെ ജീവനാണ സത്യം
  rationale: ഇത് ഗൗരവമുള്ള എബ്രായ ശപഥസൂത്രമാണ്. נפשׁയെ ഇവിടെ സാങ്കേതികമായി ‘ആത്മാവ്’ എന്നു വിവർത്തനം ചെയ്യാതെ വ്യക്തിയുടെ ജീവനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല
  rationale: ശപഥത്തിനു പിന്നാലെയുള്ള אִם അപൂർണമായ നിഷേധശപഥം ആരംഭിക്കുന്നു—അക്ഷരാർഥത്തിൽ ‘ഞാൻ അങ്ങയെ വിട്ടുപോയാൽ…’. മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമായി വരാൻ നിഷേധം തുറന്നുപറഞ്ഞു.
- source_word: וַיֵּרְדוּ
  choice: അവർ … ഇറങ്ങിച്ചെന്നു
  rationale: ירד എന്ന ക്രിയയിലെ താഴോട്ടുള്ള സഞ്ചാരഭാവം വെറും ‘പോയി’ എന്നതിനു പകരം ‘ഇറങ്ങിച്ചെന്നു’ എന്നു നിലനിർത്തി.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു ബിരുദനാമമായി മാറ്റാതെ നിലനിർത്തി.
- issue: אִם אֶעֶזְבֶךָּ എന്ന അപൂർണ ശപഥവാക്യം
  choice: ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല
  alternative: ഞാൻ അങ്ങയെ വിട്ടുപോയാൽ…
  rationale: മൂലത്തിലെ ശപഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചുകൊണ്ട്, അതിന്റെ നിഷേധാത്മക ഉദ്ദേശ്യം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം ഉപയോഗിച്ചു. ഗുരുവിനോടുള്ള എലീശയുടെ ആദരവ് സൂചിപ്പിക്കാൻ ‘അങ്ങ്’ എന്ന അഭിസംബോധന സ്വീകരിച്ചു; എബ്രായ ശപഥത്തിന്റെ ഗൗരവവും അപൂർണ നിഷേധത്തിന്റെ ശക്തിയും മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
