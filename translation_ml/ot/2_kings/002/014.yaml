  text: וַ/יִּקַּח֩ אֶת אַדֶּ֨רֶת אֵלִיָּ֜הוּ אֲשֶׁר נָפְלָ֤ה מֵֽ/עָלָי/ו֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֹּאמַ֕ר אַיֵּ֕ה יְהוָ֖ה אֱלֹהֵ֣י אֵלִיָּ֑הוּ אַף ה֣וּא וַ/יַּכֶּ֣ה אֶת הַ/מַּ֗יִם וַ/יֵּֽחָצוּ֙ הֵ֣נָּה וָ/הֵ֔נָּה וַֽ/יַּעֲבֹ֖ר אֱלִישָֽׁע־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
translation:
  language: ml
  text: പിന്നെ, ഏലിയാവിൽനിന്ന് വീണ അവന്റെ മേലങ്കി എടുത്ത്, എലീശാ വെള്ളത്തിൽ അടിച്ചു. “ഏലിയാവിന്റെ ദൈവമായ യാഹ്‌വേ എവിടെ?” എന്നു അവൻ പറഞ്ഞു. അവനും[a] വെള്ളത്തിൽ അടിച്ചു; വെള്ളം ഇരുവശത്തേക്കും പിരിഞ്ഞു, എലീശാ അക്കരെ കടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനും’ എന്നതിനുള്ള ഹീബ്രു പ്രയോഗം വളരെ സംക്ഷിപ്തമാണ്. അതിനെ മുൻവാക്യത്തോടു ചേർത്ത്, ‘ഏലിയാവിന്റെ ദൈവമായ യാഹ്‌വേ എവിടെ—അവൻതന്നെ?’ എന്നും വായിക്കാം. ഒരേ ദൈവം ഏലിയാവിനോടുകൂടെ ഉണ്ടായിരുന്നതുപോലെ ഇപ്പോഴും പ്രവർത്തിക്കുന്നുവെന്ന ഊന്നൽ ഇതിൽ കാണാമെങ്കിലും, ഹീബ്രു അത് വിശദമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: אַדֶּרֶת
  choice: മേലങ്കി
  rationale: ഏലിയാവിന്റെ സവിശേഷമായ പുറംവസ്ത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മേലങ്കി’ ആ ദൃശ്യബിംബം നിലനിർത്തുന്ന സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപദമാണ്.
- source_word: נָפְלָה מֵעָלָיו
  choice: ഏലിയാവിൽനിന്നു വീണ
  rationale: ബന്ധവാക്യത്തിലെ ക്രിയ, ഏലിയാവ് ഉയർത്തപ്പെട്ടപ്പോൾ അവനിൽനിന്നു വീണ മേലങ്കിയെ മുൻകാല സംഭവമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സന്ദർഭം അതിന്റെ കാലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: വെള്ളത്തിൽ അടിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള പ്രവർത്തനവും അത്ഭുതവിവരണത്തിന്റെ ദൃശ്യസ്വഭാവവും നിലനിർത്തുന്നു. ഹീബ്രുവിലെ ബഹുവചനരൂപത്തിന് മലയാളത്തിൽ ‘വെള്ളം’ എന്ന ഏകവചനസമൂഹനാമം സ്വാഭാവികമാണ്.
- source_word: אַיֵּה
  choice: എവിടെ?
  rationale: സ്ഥാനം അഥവാ സാന്നിധ്യം ചോദിക്കുന്ന നേരിട്ടുള്ള ചോദ്യരൂപം നിലനിർത്തുന്നു; ദൈവിക ഇടപെടലിനുള്ള അപേക്ഷയായി വ്യാഖ്യാനിച്ച് വിപുലീകരിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵי אֵלִיָּהוּ
  choice: ഏലിയാവിന്റെ ദൈവമായ
  rationale: ഹീബ്രു സംയുക്തബന്ധം സുതാര്യമായി നിലനിർത്തുകയും മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: אַף הוּא
  choice: അവനും
  rationale: മസോററ്റിക് വിരാമചിഹ്നക്രമത്തിൽ ഈ സംക്ഷിപ്ത പ്രയോഗം തുടർന്നുള്ള ‘വെള്ളത്തിൽ അടിച്ചു’ എന്ന ക്രിയയോടു ചേർത്ത്, മുമ്പ് ഏലിയാവ് ചെയ്തതുപോലെ എലീശായും ചെയ്തുവെന്ന ഊന്നൽ നൽകാൻ കഴിയും. പദബന്ധത്തിന്റെ യഥാർഥ ദ്വയാർഥത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: വെള്ളം ഇരുവശത്തേക്കും പിരിഞ്ഞു
  rationale: ദിശാസൂചകമായ ഹീബ്രു പ്രയോഗം വെള്ളം രണ്ടു വശങ്ങളിലേക്കു വേർപെട്ടെന്ന അർഥത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיַּעֲבֹר
  choice: അക്കരെ കടന്നു
  rationale: നദി മുറിച്ചുകടക്കുന്ന ഈ സന്ദർഭത്തിൽ עבר എന്ന ക്രിയയുടെ ലക്ഷ്യവും ചലനവും വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു പദവിയായി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു.
- issue: אַף הוּא എന്ന സംക്ഷിപ്തവും വിവാദവുമായ പദബന്ധത്തിന്റെ ബന്ധം
  choice: തുടർന്നുള്ള ക്രിയയോടു ചേർത്ത് ‘അവനും വെള്ളത്തിൽ അടിച്ചു’
  alternative: മുൻചോദ്യത്തോടു ചേർത്ത് ‘ഏലിയാവിന്റെ ദൈവമായ യഹോവ എവിടെ—അവൻതന്നെ?’ എന്നോ, വാക്യത്തിന്റെ സംക്ഷിപ്തത കാരണം വിവർത്തനത്തിൽ പ്രകടമാക്കാതെയോ വായിക്കാം
  rationale: മസോററ്റിക് പാഠത്തിലെ പ്രധാന വിരാമം ‘ഏലിയാവ്’ എന്നതിന് ശേഷം വരുന്നതിനാൽ പദബന്ധത്തെ തുടർന്നുള്ള പ്രവർത്തനത്തോടു ചേർക്കുന്നത് ശക്തമായ വ്യാകരണസാധ്യതയാണ്. അതേസമയം ഹീബ്രു അസാധാരണമായി സംക്ഷിപ്തമായതിനാൽ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു; ദൈവസാന്നിധ്യത്തിന്റെ തുടർച്ചയെ വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘മേലങ്കി’, ‘ഇരുവശത്തേക്കും പിരിഞ്ഞു’, ‘അക്കരെ കടന്നു’ എന്നിവ ദൃശ്യവും സ്വാഭാവികവുമായ പദപ്രയോഗങ്ങളാണ്. സംശയാസ്പദമായ אַף הוּא മുഖ്യപാഠത്തിൽ വ്യാകരണപരമായി ശക്തമായ വായനയായി നൽകിയിട്ടും മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
