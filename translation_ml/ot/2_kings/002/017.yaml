translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. എലീശായെ സൂചിപ്പിക്കാൻ ബഹുമാനരൂപമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ലജ്ജ/വിഷമം എന്ന അർഥവ്യാപ്തി മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
