  yaml_path: translation/ot/2_kings/002/017.yaml
  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
translation:
  language: ml
  text: എന്നാൽ, അദ്ദേഹത്തിന് ലജ്ജ തോന്നുംവരെ അവർ അദ്ദേഹത്തെ നിർബന്ധിച്ചുകൊണ്ടിരുന്നു.[a] അപ്പോൾ അദ്ദേഹം, “അവരെ അയയ്ക്കൂ,” എന്നു പറഞ്ഞു. അങ്ങനെ അവർ അമ്പത് പുരുഷന്മാരെ അയച്ചു; അവർ മൂന്നു ദിവസം അന്വേഷിച്ചെങ്കിലും ഏലിയാവിനെ കണ്ടെത്തിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അദ്ദേഹത്തിന് അസ്വസ്ഥത തോന്നുംവരെ.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “ലജ്ജ തോന്നുംവരെ” എന്നാണ്. അവരുടെ ആവർത്തിച്ചുള്ള നിർബന്ധം സൃഷ്ടിച്ച സാമൂഹിക സമ്മർദത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ בוֹ
  choice: അവർ അദ്ദേഹത്തെ ... നിർബന്ധിച്ചുകൊണ്ടിരുന്നു
  rationale: פצר ആവർത്തിച്ചുള്ള ശക്തമായ നിർബന്ധത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ തുടർച്ചയും സമ്മർദവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: עַד בֹּשׁ
  choice: ലജ്ജിതനാക്കുംവരെ
  rationale: בוש എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ലജ്ജയോ അപമാനബോധമോ നിലനിർത്തുന്നു; അവരുടെ നിർബന്ധം എലീശായെ സാമൂഹികമായി വിഷമിപ്പിച്ച പരിധിവരെ എത്തിയെന്ന അർഥവും തുറന്നുവയ്ക്കുന്നു.
- source_word: שְׁלָחוּ
  choice: അവരെ അയയ്ക്കൂ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ആജ്ഞയാണ്. സന്ദർഭത്തിൽ തിരച്ചിൽസംഘത്തെ അയയ്ക്കുന്നതാണ് സൂചിതമായ കർമം; അത് മലയാളത്തിൽ വ്യക്തമായി ചേർത്തിരിക്കുന്നു.
- source_word: חֲמִשִּׁים אִישׁ
  choice: അമ്പത് പേരെ
  rationale: എബ്രായപാഠം ഈ വാക്യത്തിൽ ലളിതമായി ‘അമ്പത് പുരുഷന്മാർ’ എന്നാണ് പറയുന്നത്. സ്വാഭാവിക മലയാളത്തിൽ ‘അമ്പത് പേർ’ എന്നു നൽകി, സന്ദർഭത്തിൽ അവർ പുരുഷന്മാരാണെന്നത് വ്യക്തമായതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וַיְבַקְשׁוּ
  choice: അവർ ... അന്വേഷിച്ചു
  rationale: בקש ഇവിടെ ഒരാളെ കണ്ടെത്താൻ തിരയുക എന്ന അർഥത്തിലാണ്; ‘അന്വേഷിച്ചു’ കഥനശൈലിക്ക് യോജിച്ച ആധുനിക മലയാളമാണ്.
- source_word: שְׁלֹשָׁה יָמִים
  choice: മൂന്നു ദിവസം
  rationale: തിരച്ചിലിന്റെ ദൈർഘ്യം സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְלֹא מְצָאֻהוּ
  choice: എങ്കിലും ഏലിയാവിനെ കണ്ടെത്തിയില്ല
  rationale: וְ ഇവിടെ ഫലത്തിന്റെ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എങ്കിലും’ യോജിക്കുന്നു. എബ്രായത്തിലെ സർവനാമത്തിന്റെ സൂചന സന്ദർഭപ്രകാരം ഏലിയാവാണെന്ന് വ്യക്തമാക്കുന്നത് മലയാളത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
