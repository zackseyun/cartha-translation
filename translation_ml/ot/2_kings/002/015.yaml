revisions:
- from: യെരീഹോവിലുണ്ടായിരുന്ന പ്രവാചകശിഷ്യന്മാർ എതിർവശത്തുനിന്ന് അവനെ കണ്ടപ്പോൾ[a], “ഏലിയാവിന്റെ ആത്മാവ് എലീശായുടെമേൽ ആവസിച്ചിരിക്കുന്നു”[b] എന്നു പറഞ്ഞു. പിന്നെ അവർ അവനെ എതിരേൽക്കാൻ ചെന്ന് അവന്റെ മുമ്പിൽ നിലംവരെ കുനിഞ്ഞു.[c]
  to: യെരീഹോവിലുണ്ടായിരുന്ന പ്രവാചകശിഷ്യന്മാർ എതിർവശത്തുനിന്ന് അവനെ കണ്ടപ്പോൾ[a], “ഏലിയാവിന്റെ ആത്മാവ് എലീശായുടെമേൽ വന്നുനിൽക്കുന്നു”[b] എന്നു പറഞ്ഞു. പിന്നെ അവർ അവനെ എതിരേൽക്കാൻ ചെന്ന് അവന്റെ മുമ്പിൽ നിലംവരെ വണങ്ങി.[c]
  rationale: Two minor wording changes improve idiomatic modern Malayalam and more closely convey the settled-upon force of נָחָה and the emphatic groundward gesture of השתחוה ... ארצה. The translation retains the Hebrew spatial ambiguity, the source wording “ഏലിയാവിന്റെ ആത്മാവ്,” and the non-doctrinal description of homage to Elisha.
