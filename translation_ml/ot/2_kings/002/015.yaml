  text: וַ/יִּרְאֻ֨/הוּ בְנֵֽי הַ/נְּבִיאִ֤ים אֲשֶׁר בִּֽ/ירִיחוֹ֙ מִ/נֶּ֔גֶד וַ/יֹּ֣אמְר֔וּ נָ֛חָה ר֥וּחַ אֵלִיָּ֖הוּ עַל אֱלִישָׁ֑ע וַ/יָּבֹ֨אוּ֙ לִ/קְרָאת֔/וֹ וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
translation:
  language: ml
  text: യെരീഹോവിലുണ്ടായിരുന്ന പ്രവാചകശിഷ്യന്മാർ എതിർവശത്തുനിന്ന് അവനെ കണ്ടപ്പോൾ[a], “ഏലിയാവിന്റെ ആത്മാവ് എലീശായുടെമേൽ വന്നുനിൽക്കുന്നു”[b] എന്നു പറഞ്ഞു. പിന്നെ അവർ അവനെ എതിരേൽക്കാൻ ചെന്ന് അവന്റെ മുമ്പിൽ നിലംവരെ വണങ്ങി.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അകലെനിന്ന്.” ഈ ഹീബ്രു പ്രയോഗം എതിർവശത്തോ അഭിമുഖമായോ കാഴ്ചയിൽ നിൽക്കുന്ന സ്ഥാനത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ഏലിയാവിന്റെ ആത്മാവ്” എന്നത് ഏലിയാവിൽ പ്രവർത്തിച്ചിരുന്ന പ്രവാചകാത്മാവോ പ്രവാചകശുശ്രൂഷയ്ക്കുള്ള ശക്തിയോ ഇപ്പോൾ എലീശായുടെമേൽ ഉണ്ടെന്ന അവരുടെ അംഗീകാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: അഥവാ “അവന്റെ മുമ്പിൽ സാഷ്ടാംഗം വീണു.” ഈ പ്രവൃത്തി ആദരവും കീഴടങ്ങലും പ്രകടിപ്പിക്കുന്നു; അത് നിർബന്ധമായും ദൈവാരാധനയെ സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֻהוּ
  choice: അവനെ കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയും മൂന്നാംപുരുഷ ഏകവചന കർമപ്രത്യയവും ലളിതമായ ദൃശ്യഗ്രഹണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בְנֵי הַנְּבִיאִים
  choice: പ്രവാചകശിഷ്യന്മാർ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘പ്രവാചകന്മാരുടെ പുത്രന്മാർ’ എന്നത് മലയാളത്തിൽ തെറ്റായി ജൈവപുത്രന്മാരെ സൂചിപ്പിക്കാം; ഇവിടെ പ്രവാചകസംഘത്തിലെ ശിഷ്യന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: യെരീഹോവിലുണ്ടായിരുന്ന
  rationale: കഥാസന്ദർഭത്തിൽ ഏത് പ്രവാചകശിഷ്യസംഘമാണെന്ന് സ്വാഭാവികമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: מִנֶּגֶד
  choice: എതിർവശത്തുനിന്ന്
  rationale: അഭിമുഖമായോ മറുവശത്തായോ കാഴ്ചയിൽ നിൽക്കുന്ന സ്ഥലബന്ധം സംരക്ഷിക്കുന്നു; അകലം എന്ന ആശയം സാധ്യമെങ്കിലും നിർബന്ധമല്ല.
- source_word: נָחָה
  choice: ആവസിച്ചിരിക്കുന്നു
  rationale: נוח-ന്റെ പൂർണക്രിയാരൂപം സംഭവിച്ചെത്തിയതിന്റെ തുടർന്നുനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: רוּחַ אֵלִיָּהוּ
  choice: ഏലിയാവിന്റെ ആത്മാവ്
  rationale: ഹീബ്രു നിർമാണത്തെ നേരിട്ട് സംരക്ഷിക്കുകയും വ്യക്തിപരമായ ആത്മാവിന്റെ കുടിയേറ്റം എന്ന് വാചകത്തിൽ നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: עַל אֱלִישָׁע
  choice: എലീശായുടെമേൽ
  rationale: റൂഅഹ് ഒരാളുടെമേൽ ആവസിക്കുന്നു എന്ന ഹീബ്രു പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: לִקְרָאתוֹ
  choice: അവനെ എതിരേൽക്കാൻ
  rationale: ഒരാളെ സമീപിച്ച് സ്വീകരിക്കാനോ കാണാനോ ചെല്ലുന്ന പ്രവൃത്തിയെ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: അവന്റെ മുമ്പിൽ നിലംവരെ കുനിഞ്ഞു
  rationale: ശാരീരികമായി നിലത്തോളം കുനിയുന്ന ആദരസൂചക പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; ദൈവാരാധന എന്ന അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
theological_decisions:
- issue: ‘ഏലിയാവിന്റെ ആത്മാവ്’ എന്നതിന്റെ അർഥം
  choice: വാചകത്തിൽ ‘ഏലിയാവിന്റെ ആത്മാവ്’ എന്ന ഘടന നിലനിർത്തി, അടിക്കുറിപ്പിൽ പ്രവാചകശുശ്രൂഷയ്ക്കുള്ള ആത്മീയ ശക്തിയെയും അധികാരത്തെയും കുറിച്ചുള്ള അംഗീകാരമാണെന്ന് സൂചിപ്പിച്ചു.
  alternative: ഏലിയാവിന്റെ വ്യക്തിപരമായ ആത്മാവ് എലീശായിലേക്കു മാറിയെന്ന വായന; അല്ലെങ്കിൽ പ്രവാചകപ്രാധാന്യമില്ലാത്ത സാധാരണ പ്രശംസ.
  rationale: 2 രാജാക്കന്മാർ 2:9,15-ലെ അടുത്ത സന്ദർഭം പ്രവാചകപിന്തുടർച്ചയും ശക്തീകരണവും ചൂണ്ടിക്കാണിക്കുന്നു; എങ്കിലും പരിഭാഷ മൂലപാഠത്തിന്റെ ചുരുക്കവും വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തുന്നു.
- issue: എലീശായുടെ മുമ്പിലുള്ള കുനിയലിന്റെ സ്വഭാവം
  choice: ആദരവും കീഴടങ്ങലും പ്രകടിപ്പിക്കുന്ന നിലംവരെയുള്ള കുനിയലായി വിവർത്തനം ചെയ്തു.
  alternative: എലീശായ്ക്കുള്ള ദൈവാരാധനയായി വ്യക്തമാക്കുക.
  rationale: השתחוה ദൈവത്തിന്റെയും മനുഷ്യരുടെയും മുമ്പിലുള്ള കുനിയലിന് ഉപയോഗിക്കാം; ഇവിടെ മനുഷ്യനായ എലീശായെ പ്രവാചകപിന്‍ഗാമിയായി അംഗീകരിക്കുന്നതാണ് സന്ദർഭം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രവാചകശിഷ്യന്മാർ’ സാധാരണ വായനക്കാരന് സാമൂഹികസംഘത്തെ വ്യക്തമായി അറിയിക്കുന്നു. ‘എതിർവശത്തുനിന്ന്’ മൂലത്തിലെ സ്ഥലബന്ധം സംരക്ഷിക്കുന്നു; ‘അകലെനിന്ന്’ അടിക്കുറിപ്പിൽ പകരവായനയായി നൽകിയിരിക്കുന്നു.
