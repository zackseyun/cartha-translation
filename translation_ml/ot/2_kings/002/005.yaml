  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בִּֽ/ירִיחוֹ֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: ml
  text: 'അപ്പോൾ യെരീഹോവിലുണ്ടായിരുന്ന പ്രവാചകന്മാരുടെ പുത്രന്മാർ എലീശയുടെ അടുത്തുവന്ന് അവനോടു പറഞ്ഞു: “ഇന്ന് യാഹ്‌വേ നിന്റെ യജമാനനെ നിന്റെ തലക്കുമുകളിൽനിന്ന്[a] എടുത്തുകൊണ്ടുപോകുകയാണെന്ന് നിനക്കറിയാമോ?” അവൻ പറഞ്ഞു: “എനിക്കും അറിയാം; മിണ്ടാതിരിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിനക്കുമേലുള്ള സ്ഥാനത്തുനിന്ന്’; എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിന്റെ തലക്കുമുകളിൽനിന്ന്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: അടുത്തുവന്ന്
  rationale: נגשׁ സൂചിപ്പിക്കുന്ന സമീപിക്കൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְנֵי הַנְּבִיאִים
  choice: പ്രവാചകന്മാരുടെ പുത്രന്മാർ
  rationale: പ്രവാചകശിഷ്യരുടെ അഥവാ പ്രവാചകസംഘത്തിലെ അംഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കാവുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകഭാവം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: യെരീഹോവിലുണ്ടായിരുന്ന
  rationale: ഈ പ്രവാചകസംഘത്തെ യെരീഹോവിൽ ഉണ്ടായിരുന്നവരായി തിരിച്ചറിയിക്കുന്ന ആപേക്ഷിക ഉപവാക്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֱלִישָׁע
  choice: എലീശ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: הֲיָדַעְתָּ
  choice: നിനക്കറിയാമോ
  rationale: സന്ദർഭത്തിൽ ഭൂതകാല അറിവിനേക്കാൾ ഇപ്പോഴത്തെ ബോധ്യം ചോദിക്കുന്ന എബ്രായ രൂപത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവി ഉപയോഗിച്ച് പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לֹקֵחַ
  choice: എടുത്തുകൊണ്ടുപോകുകയാണ്
  rationale: വർത്തമാന കൃദന്തത്തിന്റെ ആസന്നവും സജീവവുമായ പ്രവർത്തനഭാവം നിലനിർത്തുന്നു.
- source_word: אֲדֹנֶיךָ
  choice: നിന്റെ യജമാനനെ
  rationale: മനുഷ്യബന്ധത്തിന്റെ ഈ സന്ദർഭത്തിൽ ഏലിയാവ് എലീശയ്ക്കുമേൽ ഉള്ള സ്ഥാനത്തെ ദൈവശാസ്ത്രപരമായി ഭാരമുള്ള മറ്റൊരു പദം കൂടാതെ വ്യക്തമാക്കുന്നു.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: നിന്റെ തലക്കുമുകളിൽനിന്ന്
  rationale: അധികാരസ്ഥാനത്തുള്ള ഒരാളുടെ നീക്കത്തെ സൂചിപ്പിക്കാവുന്ന എബ്രായത്തിന്റെ ദൃശ്യമായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: എനിക്കും അറിയാം
  rationale: ഗַּם എന്ന ചേർക്കൽഭാവവും אֲנִי എന്ന സർവനാമത്തിന്റെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֶחֱשׁוּ
  choice: മിണ്ടാതിരിക്കൂ
  rationale: ബഹുവചന ആജ്ഞയുടെ ഹ്രസ്വവും ശക്തവുമായ ഭാവം ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യാഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: מֵעַל רֹאשֶׁךָ എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിക്കണമോ
  choice: ‘നിന്റെ തലക്കുമുകളിൽനിന്ന്’ എന്ന മൂർത്തമായ പ്രയോഗം നിലനിർത്തുക
  alternative: ‘നിന്റെമേൽ അധികാരിയായിരിക്കുന്നതിൽനിന്ന്’
  rationale: ഇത് എലീശയ്ക്കുമേലുള്ള ഏലിയാവിന്റെ അധികാരസ്ഥാനത്തിൽനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കാമെങ്കിലും, മൂലപാഠത്തിലെ ദൃശ്യപ്രയോഗവും അതിലുള്ള വ്യാഖ്യാനസാധ്യതയും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. സംഭാഷണത്തിന്റെ ചുരുക്കവും എലീശയുടെ മറുപടിയിലെ കാഠിന്യവും നിലനിർത്തി; എബ്രായത്തിലെ അപൂർവമായ ദൃശ്യപ്രയോഗം വിശദീകരണത്തോടെ സംരക്ഷിച്ചു.
