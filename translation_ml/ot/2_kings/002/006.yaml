id: 2KI.2.6
reference: 2 Kings 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי הַ/יַּרְדֵּ֔נָ/ה וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּלְכ֖וּ שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
translation:
  language: ml
  text: 'അപ്പോൾ ഏലിയാവ് അവനോടു പറഞ്ഞു: “ദയവായി ഇവിടെത്തന്നെ നിൽക്കുക; യാഹ്‌വേ എന്നെ യോർദ്ദാനിലേക്കു[a] അയച്ചിരിക്കുന്നു.” എന്നാൽ എലീശാ പറഞ്ഞു: “യാഹ്‌വേ ജീവിച്ചിരിക്കുന്നതുപോലെയും അങ്ങ് ജീവിച്ചിരിക്കുന്നതുപോലെയും, ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല[b].” അങ്ങനെ അവർ ഇരുവരും യാത്ര തുടർന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യോർദ്ദാൻ നദിയിലേക്കു.”
    reason: lexical_alternative
  - marker: b
    text: 'ഇത് ഒരു എബ്രായ ശപഥസൂത്രമാണ്. അക്ഷരാർഥത്തിൽ: “യാഹ്‌വേ ജീവിക്കുന്നതുപോലെയും അങ്ങയുടെ ജീവൻ ജീവിക്കുന്നതുപോലെയും, ഞാൻ അങ്ങയെ വിട്ടുപോയാൽ …” ഉച്ചരിക്കാതെ വിട്ടിരിക്കുന്ന ശാപഭാഗം കാരണം ഇതിന്റെ അർഥം: “ഞാൻ തീർച്ചയായും അങ്ങയെ വിട്ടുപോകുകയില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  choice: ദയവായി ഇവിടെത്തന്നെ താമസിക്കുക
  rationale: ישׁב എന്ന ക്രിയയ്ക്ക് ‘ഇരിക്കുക’, ‘താമസിക്കുക’, ‘അവിടെത്തന്നെ നിൽക്കുക’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ എലീശാ പിന്നിൽ തങ്ങണമെന്ന അഭ്യർഥനയായതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘താമസിക്കുക’ എന്നു നൽകി; נָאയുടെ വിനയപൂർവമായ അഭ്യർഥന ‘ദയവായി’ എന്നു പ്രകടമാക്കി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവിനാമംകൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: שְׁלָחַנִי
  choice: എന്നെ … അയച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ നിയോഗത്തിന് ഇപ്പോഴും പ്രസക്തിയുണ്ടെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കാൻ മലയാളത്തിലെ പൂർണവർത്തമാനരൂപം ഉപയോഗിച്ചു.
- source_word: הַיַּרְדֵּנָה
  choice: യോർദ്ദാനിലേക്കു
  rationale: ദിശാസൂചകമായ ה ചലനം യോർദ്ദാനിലേക്കാണെന്ന് വ്യക്തമാക്കുന്നു. നദിയെയോ അതിന്റെ പ്രദേശത്തെയോ സൂചിപ്പിക്കാവുന്ന മൂലഭാഷയിലെ സംക്ഷിപ്തത മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: യഹോവയാണ, അങ്ങയുടെ ജീവനാണ
  rationale: ഇത് യഹോവയുടെ ജീവനെയും അഭിസംബോധിതന്റെ ജീവനെയും സാക്ഷിയാക്കുന്ന ഉറച്ച ശപഥസൂത്രമാണ്. പദാനുപദമായ അസ്വാഭാവികത ഒഴിവാക്കി, മലയാളത്തിൽ ഗൗരവവും ശപഥസ്വഭാവവും നിലനിർത്തുന്ന രൂപം തിരഞ്ഞെടുത്തു.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല
  rationale: ശപഥസൂത്രത്തിലെ אִם ഒരു ഉച്ചരിക്കാത്ത ശാപവാക്യത്തിന് തുടക്കമിടുന്നു; അതിന്റെ പ്രയോഗാർഥം ശക്തമായ നിഷേധമാണ്. അതിനാൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ അർഥം നേരിട്ട് വിവർത്തനം ചെയ്തു.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  choice: അങ്ങനെ അവർ ഇരുവരും യാത്ര തുടർന്നു
  rationale: ഇരുവരും ഒന്നിച്ചുപോയെന്ന ഊന്നലും യാത്ര തുടരുന്നതെന്ന സന്ദർഭാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിനാമമാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം നൽകി; ‘യാഹ്‌വേ’ മറ്റൊരു സാധുവായ ലിപ്യന്തരണമാണെന്ന കാര്യം അംഗീകരിക്കുന്നു.
- issue: എലീശായുടെ ശപഥവാക്യത്തിലെ അപൂർണ ശാപസൂചന
  choice: മുഖ്യപാഠത്തിൽ ഉറച്ച നിഷേധമായി വിവർത്തനം ചെയ്യുക
  alternative: ‘ഞാൻ അങ്ങയെ വിട്ടുപോയാൽ…’ എന്ന അപൂർണ വ്യവസ്ഥാവാക്യം അക്ഷരാർഥത്തിൽ നിലനിർത്തുക
  rationale: എബ്രായ ശപഥസൂത്രത്തിന്റെ യഥാർഥ പ്രയോഗാർഥം ‘തീർച്ചയായും വിട്ടുപോകുകയില്ല’ എന്നതാണ്. അതേസമയം അതിന്റെ അക്ഷരഘടനയും ഒളിഞ്ഞിരിക്കുന്ന സ്വയംശാപവും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഏലിയാവിനോടുള്ള എലീശായുടെ ആദരസൂചനയായി ‘അങ്ങ്’ ഉപയോഗിച്ചു. ദൈവനാമം പദവിനാമമാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു; എബ്രായ ശപഥസൂത്രത്തിന്റെ ഗൗരവവും അപൂർണഘടനയും മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും യഥാക്രമം സംരക്ഷിച്ചു.
