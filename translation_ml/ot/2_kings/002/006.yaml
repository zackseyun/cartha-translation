- from: 'അപ്പോൾ ഏലിയാവ് അവനോടു പറഞ്ഞു: “ദയവായി ഇവിടെത്തന്നെ താമസിക്കുക; യഹോവ എന്നെ യോർദ്ദാനിലേക്കു[a] അയച്ചിരിക്കുന്നു.” എന്നാൽ എലീശാ പറഞ്ഞു: “യഹോവയാണ, അങ്ങയുടെ ജീവനാണ, ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല[b].” അങ്ങനെ അവർ ഇരുവരും യാത്ര തുടർന്നു.'
  to: 'അപ്പോൾ ഏലിയാവ് അവനോടു പറഞ്ഞു: “ദയവായി ഇവിടെത്തന്നെ നിൽക്കുക; യാഹ്‌വേ എന്നെ യോർദ്ദാനിലേക്കു[a] അയച്ചിരിക്കുന്നു.” എന്നാൽ എലീശാ പറഞ്ഞു: “യാഹ്‌വേ ജീവിച്ചിരിക്കുന്നതുപോലെയും അങ്ങ് ജീവിച്ചിരിക്കുന്നതുപോലെയും, ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല[b].” അങ്ങനെ അവർ ഇരുവരും യാത്ര തുടർന്നു.'
