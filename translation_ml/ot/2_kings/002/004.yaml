  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ אֱלִישָׁ֣ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי יְרִיח֔וֹ וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּבֹ֖אוּ יְרִיחֽוֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/004.yaml
  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: ml
  text: 'ഏലിയാവ് അവനോടു പറഞ്ഞു: “എലീശാ, ദയവായി ഇവിടെത്തന്നെ ഇരിക്കൂ; യാഹ്‌വെ എന്നെ യെരീഹോയിലേക്ക് അയച്ചിരിക്കുന്നു.” എന്നാൽ എലീശാ പറഞ്ഞു: “യാഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെയും അങ്ങ് ജീവിച്ചിരിക്കുന്നതുപോലെയും, ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല.” അങ്ങനെ അവർ യെരീഹോയിൽ എത്തി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁב נָא
  choice: ദയവായി ഇവിടെത്തന്നെ താമസിക്കുക
  rationale: ישׁב എന്ന ക്രിയയ്ക്ക് ‘ഇരിക്കുക’, ‘താമസിക്കുക’, ‘നിൽക്കുക/തുടരുക’ എന്നീ അർഥങ്ങൾ വരാം. യാത്ര തുടരാതെ അവിടെത്തന്നെ കഴിയണമെന്ന സന്ദർഭാർഥം ‘താമസിക്കുക’ സ്വാഭാവികമായി നൽകുന്നു; נָא-യുടെ വിനയപൂർവമായ അഭ്യർഥന ‘ദയവായി’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: שְׁלָחַנִי
  choice: എന്നെ ... അയച്ചിരിക്കുന്നു
  rationale: പൂർണക്രിയ സൂചിപ്പിക്കുന്ന, ഇപ്പോഴും പ്രസക്തമായ ദൗത്യം മലയാളത്തിൽ ‘അയച്ചിരിക്കുന്നു’ എന്ന് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: יְרִיחוֹ
  choice: യെരീഹോ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: യഹോവയാണ, അങ്ങയുടെ ജീവനാണ
  rationale: ‘യഹോവ ജീവിക്കുന്നതുപോലെ, അങ്ങയുടെ ജീവൻ ജീവിക്കുന്നതുപോലെ’ എന്ന ശപഥസൂത്രത്തിന്റെ ഗൗരവവും സമാന്തരഘടനയും സ്വാഭാവിക മലയാള ശപഥപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു. נֶפֶשׁ ഇവിടെ വേറിട്ട അമൂർത്ത ‘ആത്മാവ്’ എന്നതിലുപരി വ്യക്തിയുടെ ജീവനെ സൂചിപ്പിക്കുന്നു.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല
  rationale: ശപഥവാക്യത്തിലെ אִם അക്ഷരാർഥത്തിൽ ‘എങ്കിൽ’ ആണെങ്കിലും, അപൂർണമായി വിട്ടിരിക്കുന്ന ശാപഭാഗം കാരണം ഉറച്ച നിഷേധമാണ് ഉദ്ദേശ്യം. അതിനാൽ മലയാളത്തിൽ നിഷേധം തുറന്നുപറഞ്ഞു; യാത്രാസന്ദർഭത്തിന് ‘വിട്ടുപോകുക’ യോജിക്കുന്നു.
- source_word: וַיָּבֹאוּ
  choice: അങ്ങനെ അവർ ... എത്തി
  rationale: വയ്യക്ഷോൽ രൂപം കഥയുടെ അടുത്ത സംഭവത്തിലേക്കുള്ള പുരോഗതി സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെ’ ഫലവും തുടർച്ചയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അത് പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റിയില്ല. മലയാള വായനക്കാർക്കിടയിൽ ദീർഘകാലമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു; ഉച്ചാരണപുനർനിർമാണമായ ‘യാഹ്‌വെ’ മറ്റൊരു സാധുവായ ലിപ്യന്തരണമാണ്.
- issue: אִם אֶעֶזְבֶךָּ എന്ന ശപഥവാക്യത്തിലെ പരോക്ഷ നിഷേധം
  choice: ഞാൻ അങ്ങയെ വിട്ടുപോകുകയില്ല
  alternative: ഞാൻ അങ്ങയെ വിട്ടുപോയാൽ...
  rationale: എബ്രായത്തിൽ ശാപഫലം പറയാതെ വിടുന്ന ശപഥരീതിയാണ്; അതിന്റെ പ്രയോഗാർഥം ഉറച്ച നിഷേധം. മലയാളത്തിൽ അക്ഷരാർഥമായി അപൂർണ വ്യവസ്ഥാവാക്യം നൽകിയാൽ അർഥം അവ്യക്തമാകുന്നതിനാൽ ഉദ്ദേശിച്ച നിഷേധം വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. എലീശാ ഗുരുവായ ഏലിയാവിനോടു സംസാരിക്കുന്നതിനാൽ ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയെ’ ഉപയോഗിച്ചു. സംഭാഷണത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
