base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
translation:
  language: ml
  text: 'പിന്നെ അവൻ വെള്ളത്തിന്റെ ഉറവിടത്തിലേക്കു[a] ചെന്നു അവിടെ ഉപ്പ് എറിഞ്ഞിട്ട് പറഞ്ഞു: “യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘ഞാൻ ഈ വെള്ളത്തെ സൗഖ്യമാക്കിയിരിക്കുന്നു. ഇനി ഇതിൽനിന്ന് മരണമോ സന്തതിനഷ്ടമോ[b] ഉണ്ടാകുകയില്ല.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെള്ളത്തിന്റെ നീരുറവയിലേക്ക്.”
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രു പദത്തിന് “ഗർഭനാശം,” “വന്ധ്യത,” അല്ലെങ്കിൽ “സന്തതിനാശം വരുത്തുന്നത്” എന്നും അർഥമാകാം; സന്തതി നഷ്ടപ്പെടുകയോ ഫലശൂന്യമാകുകയോ ചെയ്യുന്നതാണ് ഇതിന്റെ ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא הַמַּיִם
  choice: വെള്ളത്തിന്റെ ഉറവിടം
  rationale: വെള്ളം പുറപ്പെടുന്ന സ്ഥലത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘ഉറവിടം’ സ്വാഭാവികമായ മലയാളമാണ്; അത് നീരുറവയെ അതിയായി നിർവചിക്കാതെ ആശയം നിലനിർത്തുന്നു.
- source_word: מֶלַח
  choice: ഉപ്പ്
  rationale: സന്ദർഭത്തിൽ വികസിപ്പിക്കേണ്ട ആവശ്യമില്ലാത്ത നേരിട്ടുള്ള പദസമാനത.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകസന്ദേശത്തിന്റെ പതിവ് പ്രഖ്യാപനരീതി നിലനിർത്തുകയും ദൈവനാമമായ യഹ്‌വെയെ ശീർഷകമാക്കി മാറ്റാതെ നൽകുകയും ചെയ്യുന്നു.
- source_word: רִפִּאתִי לַמַּיִם הָאֵלֶּה
  choice: ഞാൻ ഈ വെള്ളത്തെ സൗഖ്യമാക്കിയിരിക്കുന്നു
  rationale: רפא എന്ന ക്രിയയുടെ ‘സൗഖ്യമാക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; ‘ശുദ്ധമാക്കി’ എന്നു പരിഭാഷപ്പെടുത്തി കുടിവെള്ളയോഗ്യതയിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: לֹא יִהְיֶה מִשָּׁם עוֹד
  choice: ഇനി ഇതിൽനിന്ന് … ഉണ്ടാകുകയില്ല
  rationale: ദോഷഫലങ്ങൾ ആ വെള്ളത്തിൽനിന്ന് ഇനി പുറപ്പെടുകയില്ല എന്ന ഉറവിടസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מָוֶת
  choice: മരണം
  rationale: ഹീബ്രു പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; വെള്ളം മൂലമുള്ള ഏതു പ്രത്യേക മരണരീതിയെന്നും അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: מְשַׁכָּלֶת
  choice: ഗർഭനാശം
  rationale: സന്തതി നഷ്ടപ്പെടുന്നതോ നഷ്ടപ്പെടുത്തുന്നതോ സൂചിപ്പിക്കുന്ന പദത്തിന് സന്ദർഭോചിതമായ വ്യക്തമായ രൂപം; അതിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു ശീർഷകമായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: വെള്ളത്തെ ‘സൗഖ്യമാക്കുക’ എന്ന ദൈവിക പ്രഖ്യാപനം
  choice: രൂപകപ്രയോഗം അതേപടി നിലനിർത്തി
  alternative: ‘വെള്ളം ശുദ്ധമാക്കി’ അല്ലെങ്കിൽ ‘കുടിക്കാൻ കൊള്ളുന്നതാക്കി’
  rationale: മൂലപാഠം വെള്ളത്തിന്റെ ഫലം എങ്ങനെ മാറിയെന്ന് വിശദീകരിക്കാതെ רפא എന്ന ‘സൗഖ്യമാക്കുക’ എന്ന ക്രിയ ഉപയോഗിക്കുന്നു; അതിനാൽ വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. പ്രവാചകപ്രഖ്യാപനത്തിന് ‘അരുളിച്ചെയ്യുന്നു’ എന്നും വെള്ളത്തെക്കുറിച്ചുള്ള മൂലഭാഷയിലെ രൂപകത്തിന് ‘സൗഖ്യമാക്കിയിരിക്കുന്നു’ എന്നും ഉപയോഗിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ ദൈവവചനം ഒറ്റ ഉദ്ധരണിചിഹ്നങ്ങളിൽ നൽകി.
