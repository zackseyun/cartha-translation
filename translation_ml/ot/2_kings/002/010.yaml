  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר הִקְשִׁ֣יתָ לִ/שְׁא֑וֹל אִם תִּרְאֶ֨ה אֹתִ֜/י לֻקָּ֤ח מֵֽ/אִתָּ/ךְ֙ יְהִֽי לְ/ךָ֣ כֵ֔ן וְ/אִם אַ֖יִן לֹ֥א יִהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/010.yaml
  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നീ പ്രയാസമുള്ള ഒരു കാര്യമാണ് ചോദിച്ചിരിക്കുന്നത്. എന്നെ നിന്നിൽനിന്ന് എടുത്തുകൊണ്ടുപോകുന്നത് നീ കാണുന്നെങ്കിൽ[a], നീ ചോദിച്ചത് നിനക്കു ലഭിക്കും; എന്നാൽ നീ കാണുന്നില്ലെങ്കിൽ, അതു ലഭിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്നെ നിന്നിൽനിന്ന് എടുത്തുകൊണ്ടുപോകുമ്പോൾ നീ എന്നെ കാണുന്നെങ്കിൽ.”'
    reason: לֻקָּח എന്ന നിഷ്ക്രിയ പങ്കാളിത്തരൂപത്തെ തുടരുന്ന പ്രവൃത്തിയായോ സമയസൂചനയായോ ഗ്രഹിക്കാം.
lexical_decisions:
- source_word: הִקְשִׁיתָ לִשְׁאוֹל
  choice: നീ പ്രയാസമുള്ള ഒരു കാര്യമാണ് ചോദിച്ചിരിക്കുന്നത്
  rationale: ഹിഫീൽ രൂപവും പിന്നാലെയുള്ള ഇൻഫിനിറ്റീവും ചേർന്ന എബ്രായ പ്രയോഗം, എലീശയുടെ അപേക്ഷ നിറവേറ്റാൻ പ്രയാസമുള്ളതാണെന്ന ആശയം നൽകുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അത് ഇങ്ങനെ പ്രകടിപ്പിച്ചു.
- source_word: אִם תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ
  choice: എന്നെ നിന്റെ അടുക്കൽനിന്ന് എടുത്തുകൊണ്ടുപോകുന്നത് നീ കാണുന്നെങ്കിൽ
  rationale: לֻקָּח എന്ന നിഷ്ക്രിയ രൂപം ‘എടുത്തുകൊണ്ടുപോകപ്പെടുന്നത്’ എന്ന അർഥം നൽകുന്നു. പ്രവർത്തകനെ വ്യക്തമാക്കാതെ, മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നിഷ്ക്രിയ ആശയം നിലനിർത്തി.
- source_word: יְהִי לְךָ כֵן
  choice: നീ ചോദിച്ചത് നിനക്കു ലഭിക്കും
  rationale: അക്ഷരാർഥം ‘അങ്ങനെ നിനക്കാകട്ടെ/ആകും’ എന്നാണ്. സന്ദർഭത്തിൽ എലീശ ചോദിച്ച കാര്യം ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ, ആശയം വ്യക്തമായി പറയുന്ന സ്വാഭാവിക മലയാളം തിരഞ്ഞെടുത്തു.
- source_word: וְאִם אַיִן
  choice: എന്നാൽ കാണുന്നില്ലെങ്കിൽ
  rationale: אַיִן ഇവിടെ അപൂർണ്ണവാക്യമായി ‘അല്ലെങ്കിൽ/അങ്ങനെ അല്ലെങ്കിൽ’ എന്നർഥത്തിലാണ്. മുൻവ്യവസ്ഥയായ കാണുന്നതിനെ മലയാളത്തിൽ വ്യക്തമായി ആവർത്തിച്ചു.
- source_word: לֹא יִהְיֶה
  choice: അതു ലഭിക്കുകയില്ല
  rationale: അക്ഷരാർഥം ‘അത് ഉണ്ടാകുകയില്ല’ എന്നാണ്; സന്ദർഭത്തിൽ ആവശ്യപ്പെട്ട ഫലം ലഭിക്കുകയില്ലെന്ന അർഥം സ്വാഭാവികമായി നൽകി.
theological_decisions:
- issue: അപേക്ഷയുടെ ഫലം ദർശനവ്യവസ്ഥയുമായി ബന്ധിപ്പിക്കുന്നത്
  choice: കാണുന്നതിനെ വ്യവസ്ഥയായിത്തന്നെ നിലനിർത്തി; ആരാണ് എടുക്കുന്നതെന്നോ ഈ വ്യവസ്ഥ എങ്ങനെ പ്രവർത്തിക്കുന്നെന്നോ വിശദീകരിച്ചില്ല
  alternative: ഇത് ദൈവിക അടയാളമോ എലീശയുടെ യോഗ്യതയുടെ പരീക്ഷണമോ ആണെന്ന് വ്യാഖ്യാനിക്കുക
  rationale: മൂലപാഠം വ്യവസ്ഥ മാത്രം പ്രസ്താവിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനം വിശദീകരിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ അധിക ആശയം ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിന്റെ അടുക്കൽനിന്ന്’ എന്ന രൂപം ബൈബിൾഭാഷയുടെ മാന്യത നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
