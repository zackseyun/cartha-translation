source:
  edition: WLC
  text: וַ/יַּעֲנֶ֣ה אֵלִיָּ֗הוּ וַ/יְדַבֵּר֮ אֶל שַׂ֣ר הַ/חֲמִשִּׁים֒ וְ/אִם אִ֤ישׁ אֱלֹהִים֙ אָ֔נִי תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וְ/תֹאכַ֥ל אֹתְ/ךָ֖ וְ/אֶת חֲמִשֶּׁ֑י/ךָ וַ/תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל אֹת֖/וֹ וְ/אֶת חֲמִשָּֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: ml
  text: 'ഏലിയാവ് അമ്പതുപേരുടെ സേനാനായകനോടു മറുപടിയായി പറഞ്ഞു: “എന്നാൽ ഞാൻ ദൈവപുരുഷനാണെങ്കിൽ, ആകാശത്തുനിന്ന് തീ ഇറങ്ങി നിന്നെയും നിന്റെ അമ്പതുപേരെയും ദഹിപ്പിക്കട്ടെ.” അപ്പോൾ ആകാശത്തുനിന്ന് തീ ഇറങ്ങി അയാളെയും അയാളുടെ അമ്പതുപേരെയും ദഹിപ്പിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַחֲמִשִּׁים
  choice: അമ്പതുപേരുടെ അധിപൻ
  rationale: അമ്പതു സൈനികരുടെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന എബ്രായ പദവിയുടെ ഘടനയും അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְאִם
  choice: എന്നാൽ … ആണെങ്കിൽ
  rationale: വാക്യാരംഭത്തിലെ וְ എന്ന ഘടകം ഇവിടെ മുൻവാക്കിനോടുള്ള പ്രതികരണത്തിന്റെ വിപരീത/തിരിച്ചടിയായ ഭാവം നൽകുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി; אִם എന്ന വ്യവസ്ഥ ‘ആണെങ്കിൽ’ എന്നു നിലനിർത്തി.
- source_word: אִישׁ אֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ എബ്രായ വിശേഷണം സംക്ഷിപ്തവും മാന്യവുമായ പരമ്പരാഗത മലയാളപ്രയോഗത്തിൽ നൽകി.
- source_word: תֹאכַל / וַתֹּאכַל
  choice: ദഹിപ്പിക്കട്ടെ / ദഹിപ്പിച്ചു
  rationale: തീയുടെ പ്രവർത്തനത്തെക്കുറിച്ചുള്ള ‘തിന്നുക/വിഴുങ്ങുക’ എന്ന മൂലരൂപത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ദഹിപ്പിക്കുക’ എന്നാണ്.
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: നിന്റെ അമ്പതുപേർ / അയാളുടെ അമ്പതുപേർ
  rationale: അധിപന്റെ കീഴിലുള്ള അമ്പതു പേരടങ്ങിയ സംഘത്തെയാണ് സംഖ്യയുടെ നാമവൽക്കൃത പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ഏലിയാവിന്റെ ദൈവപുരുഷത്വവും തീ ഇറങ്ങുന്നതും തമ്മിലുള്ള വ്യവസ്ഥ
  choice: “ഞാൻ ദൈവപുരുഷനാണെങ്കിൽ … തീ ഇറങ്ങി … ദഹിപ്പിക്കട്ടെ”
  alternative: “ഞാൻ ദൈവപുരുഷനായതുകൊണ്ട് …”
  rationale: אִם എന്നത് യഥാർഥ വ്യവസ്ഥാരൂപമാണ്; ദൈവിക സ്ഥിരീകരണത്തിനായി ഉന്നയിക്കുന്ന വെല്ലുവിളിയുടെ പിരിമുറുക്കം കാരണവാക്യമാക്കി മാറ്റാതെ സംരക്ഷിച്ചു.
- issue: വാക്യാരംഭത്തിലെ וְ എന്നതിന്റെ ബന്ധഭാവം
  choice: “എന്നാൽ”
  alternative: ബന്ധപദം ഒഴിവാക്കി “ഞാൻ … ആണെങ്കിൽ”
  rationale: മുൻസന്ദർഭത്തോടുള്ള ഏലിയാവിന്റെ പ്രതികരണത്തിലെ തിരിച്ചടിയായ ഭാവം പ്രതിഫലിപ്പിക്കാനും ഓഡിറ്റ് ചെയ്ത ഇംഗ്ലീഷ് consultation layer-ലെ ‘But if’ നോടും പൊരുത്തപ്പെടാനുമാണ്; ഇതിനെ ശക്തമായ സിദ്ധാന്തവ്യാഖ്യാനമാക്കി വികസിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളം. ‘അധിപൻ’, ‘ദൈവപുരുഷൻ’, ‘ദഹിപ്പിക്കുക’ എന്നിവ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച മാന്യപദങ്ങളാണ്; അനാവശ്യമായ പുരാതന ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
