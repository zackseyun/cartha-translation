  source_fidelity: 'മുഖ്യഅർഥം വിശ്വസ്തമാണ്: മൂന്നാമത്തെ അമ്പതുപേരുടെ അധിപനെ വീണ്ടും അയക്കുന്നതും, അവൻ ഏലിയാവിന്റെ മുമ്പിൽ മുട്ടുകുത്തി ജീവനുവേണ്ടി അപേക്ഷിക്കുന്നതും ശരിയായി നൽകിയിരിക്കുന്നു. എന്നാൽ וַיִּתְחַנֵּן ... וַיְדַבֵּר എന്ന രണ്ടു ക്രിയകളിൽ ‘പറഞ്ഞു’ ഒഴിവായിരിക്കുന്നു; അതു പുനഃസ്ഥാപിക്കണം.'
  naturalness: ‘അവന്റെ അമ്പതുപേരെയും’ എന്ന പ്രയോഗം സ്വാഭാവികമല്ലാതെ, അധിപന്റെ വ്യക്തിപരമായ ഉടമസ്ഥത സൂചിപ്പിക്കുന്നതുപോലെ തോന്നാം. ‘അവനോടൊപ്പമുള്ള അമ്പതുപേരെയും’ കൂടുതൽ വ്യക്തവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്. അപേക്ഷയ്ക്കുമുമ്പ് ‘യാചിച്ചുകൊണ്ട് പറഞ്ഞു’ എന്നത് എബ്രായത്തിലെ തുടർച്ചയായ പ്രവർത്തനങ്ങളെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
