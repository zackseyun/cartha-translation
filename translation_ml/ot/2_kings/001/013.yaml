  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
translation:
  language: ml
  text: 'അവൻ വീണ്ടും അമ്പതുപേരുടെ മൂന്നാമത്തെ അധിപനെയും അവനോടൊപ്പമുള്ള അമ്പതുപേരെയും അയച്ചു. അയാൾ കയറിച്ചെന്ന് ഏലിയാവിന്റെ മുമ്പിൽ മുട്ടുകുത്തി, അവനോട് യാചിച്ചുകൊണ്ട് പറഞ്ഞു: “ദൈവപുരുഷാ, എന്റെ ജീവനും അങ്ങയുടെ ഈ അമ്പത് ദാസന്മാരുടെ ജീവനും അങ്ങയുടെ ദൃഷ്ടിയിൽ വിലപ്പെട്ടതായിരിക്കണമേ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “എന്റെ പ്രാണനും അങ്ങയുടെ ഈ അമ്പത് ദാസന്മാരുടെ പ്രാണനും.” എബ്രായത്തിലെ നെഫെഷ് എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് “ജീവൻ,” “സ്വയം,” “പ്രാണൻ” എന്നീ അർഥങ്ങൾ വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: അവൻ വീണ്ടും ... അയച്ചു
  rationale: וַיָּשָׁב ഇവിടെ രാജാവ് മുമ്പത്തെ പ്രവൃത്തി ആവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വീണ്ടും’ എന്നത് ഈ ആഖ്യാനപ്രവാഹം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שַׂר חֲמִשִּׁים שְׁלִשִׁים וַחֲמִשָּׁיו
  choice: അമ്പതുപേരുടെ മൂന്നാമത്തെ അധിപനെയും അവന്റെ അമ്പതുപേരെയും
  rationale: അമ്പതുപേരടങ്ങിയ സൈനികസംഘത്തിന്റെ തലവനെയും അയാളുടെ സംഘത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം; ‘മൂന്നാമത്തെ’ ക്രമം നിലനിർത്തുന്നു.
- source_word: וַיַּעַל וַיָּבֹא
  choice: അയാൾ കയറിച്ചെന്ന്
  rationale: രണ്ട് ക്രിയകളിലുമുള്ള മുകളിലേക്കുള്ള നീക്കവും എത്തിച്ചേരലും സ്വാഭാവികമായ മലയാള സംയുക്തക്രിയയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: וַיִּכְרַע עַל בִּרְכָּיו לְנֶגֶד אֵלִיָּהוּ
  choice: ഏലിയാവിന്റെ മുമ്പിൽ മുട്ടുകുത്തി
  rationale: ശരീരഭാവവും ഏലിയാവിന്റെ സന്നിധിയിലെ വിനയവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּתְחַנֵּן אֵלָיו
  choice: അവനോട് യാചിച്ചു
  rationale: חנן എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം പ്രകടിപ്പിക്കുന്ന തീവ്രവും വിനീതവുമായ അപേക്ഷയെ ‘യാചിച്ചു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷാ
  rationale: പ്രവാചകനെ അഭിസംബോധന ചെയ്യുന്ന സ്ഥിരമായ പദവിയും സംബോധനരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: תִּיקַר נָא ... בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ വിലപ്പെട്ടതായിരിക്കണമേ
  rationale: יקר എന്നതിലെ ‘വിലപ്പെട്ടതായിരിക്കുക’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു; പ്രായോഗികമായി ജീവൻ രക്ഷിക്കണമെന്ന അപേക്ഷയാണെങ്കിലും അതിനെ ‘രക്ഷിക്കണമേ’ എന്നു പരത്തിവ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: נַפְשִׁי וְנֶפֶשׁ עֲבָדֶיךָ
  choice: എന്റെ ജീവനും ... ദാസന്മാരുടെ ജീവനും
  rationale: മരണഭീഷണിയുടെ സന്ദർഭത്തിൽ נֶפֶשׁ വ്യക്തിയുടെ ജീവനെ സൂചിപ്പിക്കുന്നു. എബ്രായ ഏകവചനഘടനയോട് ചേർന്ന് ‘ജീവൻ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ജീവഭീഷണിയുടെ സന്ദർഭത്തിലെ נֶפֶשׁ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ജീവൻ
  alternative: ആത്മാവ് / പ്രാണൻ
  rationale: ഇവിടെ ഉദ്യോഗസ്ഥൻ താനും തന്റെ ആളുകളും മരിക്കാതിരിക്കണമെന്നാണ് അപേക്ഷിക്കുന്നത്. ‘ജീവൻ’ സന്ദർഭസൂചിതമായ അർഥം നൽകുകയും മനുഷ്യഘടനയെക്കുറിച്ചുള്ള പിൽക്കാല സിദ്ധാന്തം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിന് ‘അവൻ’, ഉദ്യോഗസ്ഥന് ‘അയാൾ’, ഏലിയാവിനോടുള്ള വിനീത അഭിസംബോധനയിൽ ‘അങ്ങ്’ എന്നിവ ഉപയോഗിച്ച് പരാമർശങ്ങൾ വേർതിരിച്ചു. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം യഥാസ്ഥാനത്ത് നൽകിയിട്ടുണ്ട്.
