  to: 'അവൻ വീണ്ടും അമ്പതുപേരുടെ മൂന്നാമത്തെ അധിപനെയും അവനോടൊപ്പമുള്ള അമ്പതുപേരെയും അയച്ചു. അയാൾ കയറിച്ചെന്ന് ഏലിയാവിന്റെ മുമ്പിൽ മുട്ടുകുത്തി, അവനോട് യാചിച്ചുകൊണ്ട് പറഞ്ഞു: “ദൈവപുരുഷാ, എന്റെ ജീവനും അങ്ങയുടെ ഈ അമ്പത് ദാസന്മാരുടെ ജീവനും അങ്ങയുടെ ദൃഷ്ടിയിൽ വിലപ്പെട്ടതായിരിക്കണമേ.”[a]'
