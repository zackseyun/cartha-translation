  text: וַ/יָּ֜מָת כִּ/דְבַ֥ר יְהוָ֣ה אֲשֶׁר דִּבֶּ֣ר אֵלִיָּ֗הוּ וַ/יִּמְלֹ֤ךְ יְהוֹרָם֙ תַּחְתָּ֔י/ו בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לִ/יהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה כִּ֛י לֹֽא הָ֥יָה ל֖/וֹ בֵּֽן׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
translation:
  language: ml
  text: അങ്ങനെ, ഏലിയാവ് പറഞ്ഞ യഹ്‌വെയുടെ വചനപ്രകാരം അവൻ മരിച്ചു[a]. അവന് ഒരു മകൻ ഇല്ലാതിരുന്നതിനാൽ, യെഹൂദാരാജാവായ യെഹോശാഫാത്തിന്റെ മകൻ യെഹോരാമിന്റെ രണ്ടാം ഭരണവർഷത്തിൽ യെഹോരാം അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവൻ മരിച്ചു ... യെഹോരാം അവനു പകരം ഭരിച്ചു.’ ഹീബ്രുവിലെ ക്രിയകൾ ലളിതമായ ആഖ്യാനരൂപങ്ങളാണ്; ‘രാജാവായി’ എന്നത് അധികാരാരോഹണത്തിന് ഊന്നൽ നൽകുന്നു, ‘ഭരിച്ചു’ എന്നത് കൂടുതൽ ഔപചാരികമായ മറ്റൊരു പരിഭാഷയാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: അങ്ങനെ ... അവൻ മരിച്ചു
  rationale: വാവ്-തുടർച്ചാരൂപം കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അങ്ങനെ’ മുൻപ് പ്രഖ്യാപിച്ച വിധിയുടെ ഫലസംബന്ധവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു, എന്നാൽ ക്രിയയുടെ ലളിതമായ ‘മരിച്ചു’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: כִּדְבַר יְהוָה
  choice: യഹ്‌വെയുടെ വചനപ്രകാരം
  rationale: כִּדְבַר എന്നത് പറഞ്ഞ വചനത്തോടുള്ള അനുരൂപതയെ സൂചിപ്പിക്കുന്നു. ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  choice: ഏലിയാവ് പറഞ്ഞ
  rationale: ബന്ധവാക്യം മുൻപുള്ള ‘വചനം’ എന്നതിനെ വിശേഷിപ്പിക്കുന്നു; ‘ഏലിയാവിലൂടെ പറഞ്ഞ’ എന്നു നൽകുന്നത് ഹീബ്രു വാക്യഘടനയേക്കാൾ കൂടുതൽ വ്യാഖ്യാനാത്മകമാകും.
- source_word: וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו
  choice: യെഹോരാം അവനു പകരം രാജാവായി
  rationale: ഇവിടെ מלך അധികാരാരോഹണത്തെ സൂചിപ്പിക്കുന്നു; ‘രാജാവായി’ എന്നത് സ്വാഭാവിക മലയാളവും ‘അവനു പകരം’ എന്നത് תַּחְתָּיוയുടെ ബന്ധവും വ്യക്തമായി നൽകുന്നു.
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם
  choice: യെഹോരാമിന്റെ രണ്ടാം ഭരണവർഷത്തിൽ
  rationale: ഇത് രാജഭരണകാലത്തെ അടിസ്ഥാനമാക്കിയ തീയതിനിർണ്ണയമാണ്; ‘ഭരണവർഷം’ രണ്ടു യെഹോരാമുകളെക്കുറിച്ചുള്ള വാക്യത്തിൽ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ യെഹോശാഫാത്തിന്റെ മകൻ
  rationale: ഈ വിശേഷണം തെക്കൻ രാജ്യത്തിലെ യെഹോരാമിനെ തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ബന്ധഘടനയിൽ മൂലപാഠത്തിലെ ബന്ധം സംരക്ഷിച്ചു.
- source_word: כִּי לֹא הָיָה לוֹ בֵּן
  choice: അവന് ഒരു മകൻ ഇല്ലാതിരുന്നതിനാൽ
  rationale: כִּי ഇവിടെ മകൻ അല്ലാതെ മറ്റൊരാൾ പിൻഗാമിയായതിന്റെ കാരണം നൽകുന്നു; കാരണബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന നിയമനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ ഉച്ചാരണസഹായകമായി ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: ഏലിയാവും യഹ്‌വെയുടെ വചനവും തമ്മിലുള്ള ബന്ധം
  choice: ഏലിയാവ് പറഞ്ഞ യഹ്‌വെയുടെ വചനം
  alternative: യഹ്‌വെ ഏലിയാവിലൂടെ പറഞ്ഞ വചനം
  rationale: ആ വചനം യഹ്‌വെയുടേതാണെന്നും ഏലിയാവ് അതു പറഞ്ഞുവെന്നും മൂലവാക്യം വ്യക്തമാക്കുന്നു; ‘മുഖാന്തരം’ എന്ന ഏജൻസി-വ്യാഖ്യാനം ചേർക്കാതെ ആ ദ്വിതലബന്ധം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഒരേ വാക്യത്തിൽ വരുന്ന രണ്ടു യെഹോരാമുകളെ വേർതിരിച്ചറിയാൻ ‘ഭരണവർഷം’ എന്നും പിതൃ-രാജ്യ തിരിച്ചറിയലും വ്യക്തമായി നിലനിർത്തി.
