source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֲחַזְיָ֖הוּ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: The rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: അഹസ്യാവ് ചെയ്ത മറ്റു പ്രവൃത്തികൾ ഇസ്രായേൽരാജാക്കന്മാരുടെ വൃത്താന്തപുസ്തകത്തിൽ[b] എഴുതിയ[a]ിട്ടില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എഴുതിയ’ എന്നതിന് ‘രേഖപ്പെടുത്തിയ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായമൂലത്തിൽ അക്ഷരാർഥം ‘എഴുതിയ’ എന്നാണ്; ഇത് രാജകീയ രേഖകളെ പരാമർശിക്കുന്ന പതിവു സൂത്രവാക്യമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇസ്രായേൽരാജാക്കന്മാരുടെ വൃത്താന്തപുസ്തകം’ രാജാക്കന്മാരുടെ പുസ്തകത്തിൽ ഉദ്ധരിക്കപ്പെടുന്ന ഒരു രാജകീയ വാർഷികരേഖയാണ്; അത് ബൈബിളിലെ ദിനവൃത്താന്തപുസ്തകം തന്നെയായിരിക്കണമെന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: മറ്റുള്ള പ്രവൃത്തികളും
  rationale: രാജഭരണസംഗ്രഹസൂത്രത്തിൽ ഈ പ്രയോഗം രാജാവിന്റെ ശേഷിച്ച പ്രവൃത്തികളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിനായി ആദിയിലെ וְ സംയോജകമായി ഉൾപ്പെടുത്തി.
- source_word: אֲחַזְיָהוּ
  choice: അഹസ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; വിഭക്തിസന്ദർഭത്തിൽ ‘അഹസ്യാവിന്റെ’ എന്നു രൂപപ്പെടുത്തി.
- source_word: אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്ത കാര്യങ്ങളും
  rationale: ആപേക്ഷിക ഉപവാക്യത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֲלוֹא הֵמָּה כְתוּבִים
  choice: എഴുതിയിട്ടില്ലയോ?
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ ആലങ്കാരികചോദ്യത്തിന്റെ ബലം സംരക്ഷിക്കുന്നു; כְתוּבִים എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘എഴുതിയ’ നിലനിർത്തി.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘പുസ്തകത്തിന്മേൽ’ എന്നായാലും രേഖയെ സൂചിപ്പിക്കുന്ന ഈ സൂത്രത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘പുസ്തകത്തിൽ’ ആണ്.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ വൃത്താന്തപുസ്തകം
  rationale: രാജകീയ വാർഷികവൃത്താന്തങ്ങളുടെ ശീർഷകമായി പ്രയോഗത്തെ അവതരിപ്പിക്കുന്നു; ബൈബിളിലെ ദിനവൃത്താന്തപുസ്തകവുമായി സ്വതവേ ഒരേ ഗ്രന്ഥമാണെന്ന ധാരണ ഒഴിവാക്കാൻ ‘വൃത്താന്തപുസ്തകം’ തെരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ചരിത്രവിവരണശൈലി. മൂലത്തിലെ സമാപനസൂത്രവും ആലങ്കാരികചോദ്യവും നിലനിർത്തിയിരിക്കുന്നു.
