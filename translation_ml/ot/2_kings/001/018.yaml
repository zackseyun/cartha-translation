  terminology: ‘വൃത്താന്തപുസ്തകം’ is suitable for the archival source and, with the cultural footnote, does not identify it uncritically with the canonical book of Chronicles. ‘എഴുതിയ’ retains the Hebrew passive participle. ‘അഹസ്യാവ്’ is retained as the established Malayalam form.
