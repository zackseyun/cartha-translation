  text: Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
translation:
  language: ml
  text: 'ശമര്യയിലെ തന്റെ മുകളിലെ മുറിയിലെ അഴികളുള്ള തുറവിലൂടെ അഹസ്യാവ് വീണു രോഗിയായി. അതുകൊണ്ട് അവൻ ദൂതന്മാരെ അയച്ചു; അവരോടു പറഞ്ഞു: “നിങ്ങൾ പോയി, എക്രോനിലെ ദേവനായ ബാൽ-സെബൂബിനോട്[a] ഈ രോഗത്തിൽനിന്ന് ഞാൻ സുഖം പ്രാപിക്കുമോ എന്ന് ചോദിച്ചറിയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബാൽ-സെബൂബ് എന്നത് നാമത്തിന്റെ ഹീബ്രൂരൂപമാണ്; പിന്നീട് പ്രചാരത്തിലായ ബീൽസെബൂബ് എന്ന രൂപം ഗ്രീക്കിലും ചില ഇംഗ്ലീഷ് വിവർത്തനപാരമ്പര്യങ്ങളിലും കാണപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעַד הַשְּׂבָכָה
  choice: അഴികളിട്ട ജനലിലൂടെ
  rationale: ചലനം ഒരു lattice അഥവാ അഴികളുള്ള തുറവിലൂടെ സംഭവിച്ചതെന്ന മൂർത്തമായ ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֲלִיָּתוֹ
  choice: തന്റെ മുകളിലത്തെ മുറി
  rationale: മുകളിലത്തെ നിലയിലെ മുറി എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: וַיָּחַל
  choice: രോഗബാധിതനായി
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ രോഗാവസ്ഥയിലാകുക എന്നത് സംരക്ഷിക്കുന്നു; വീഴ്ചയെത്തുടർന്നുള്ള അവസ്ഥയാണെന്ന ബന്ധം സന്ദർഭം വ്യക്തമാക്കുന്നു, എന്നാൽ പരിക്ക് എന്ന അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഇവിടെ രാജാവ് അയച്ച മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ദൂതന്മാർ എന്നത് സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: דִרְשׁוּ
  choice: ചോദിച്ചറിയുക
  rationale: ഒരു ദേവനിൽനിന്ന് അരുളപ്പാട് അന്വേഷിക്കുന്ന മതപരമായ കൂടിയാലോചനയുടെ ആശയം ലളിതമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּעַל זְבוּב
  choice: ബാൽ-സെബൂബ്
  rationale: ഹീബ്രൂ പാഠത്തിലെ നാമരൂപം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ പകർത്തുന്നു.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: എക്രോനിലെ ദേവൻ
  rationale: എക്രോനുമായി ബന്ധപ്പെട്ട് ആരാധിക്കപ്പെട്ട ദേവൻ എന്ന construct ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אִם אֶחְיֶה מֵחֳלִי זֶה
  choice: ഈ രോഗത്തിൽനിന്ന് ഞാൻ സുഖം പ്രാപിക്കുമോ
  rationale: അക്ഷരാർഥത്തിലെ ‘ഈ രോഗത്തിൽനിന്ന് ഞാൻ ജീവിക്കുമോ’ എന്ന പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം, ഭാവിയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം നിലനിർത്തിക്കൊണ്ട്, സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു.
- source_word: וַיִּפֹּל
  choice: വീണു
  rationale: ലളിതമായ ആഖ്യാനക്രിയയെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: שֹׁמְרוֹן
  choice: ശമര്യ
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: വിജാതീയ ദേവന്റെ നാമരൂപം
  choice: ബാൽ-സെബൂബ്
  alternative: ബെയെൽസെബൂബ്
  rationale: പ്രധാനപാഠം ഹീബ്രൂയിലെ בַּעַל זְבוּב എന്ന രൂപത്തെ പിന്തുടരുന്നു. പിന്നീട് ഗ്രീക്കിലൂടെ പ്രചാരത്തിലായ നാമരൂപം വായനക്കാരുടെ പരിചയത്തിനായി അടിക്കുറിപ്പിൽ നൽകുന്നു; അതിനെ മൂലപാഠരൂപത്തിന് പകരമാക്കുന്നില്ല.
