  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകം ഇല്ലാത്തതിനാൽ അത്തരം ഒരു തുടക്കപദം ചേർത്തിട്ടില്ല. ലഭിച്ച ഇംഗ്ലീഷ് consultation text-ൽ അടിക്കുറിപ്പുസൂചകം upper room-നുശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് ബാൽ-സെബൂബിന്റെ നാമരൂപത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിലെ [a] അതത് പേരിനുശേഷം ചേർത്തിരിക്കുന്നു.
