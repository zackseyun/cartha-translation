  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ עָלָ֣ה לִ/קְרָאתֵ֗/נוּ וַ/יֹּ֣אמֶר אֵלֵי/נוּ֮ לְכ֣וּ שׁוּבוּ֮ אֶל הַ/מֶּ֣לֶךְ אֲשֶׁר שָׁלַ֣ח אֶתְ/כֶם֒ וְ/דִבַּרְתֶּ֣ם אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתָּ֣ה שֹׁלֵ֔חַ לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֣י עֶקְר֑וֹן לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
translation:
  language: ml
  text: 'അവർ രാജാവിനോടു പറഞ്ഞു: “ഒരു മനുഷ്യൻ ഞങ്ങളെ എതിരേറ്റുവന്നു. അയാൾ ഞങ്ങളോടു പറഞ്ഞു: ‘നിങ്ങളെ അയച്ച രാജാവിന്റെ അടുക്കലേക്കു മടങ്ങിച്ചെന്ന് അയാളോടു പറയുക: “യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ഇസ്രായേലിൽ ദൈവം ഇല്ലാത്തതുകൊണ്ടാണോ നീ എക്രോനിലെ ദേവനായ ബാൽ-സെബൂബിനോടു ചോദിച്ചറിയാൻ ആളയയ്ക്കുന്നത്? അതുകൊണ്ട്, നീ കയറിയ കിടക്കയിൽനിന്ന്[a] ഇറങ്ങിവരുകയില്ല; നീ നിശ്ചയമായും മരിക്കും.”’”


    [a] അക്ഷരാർഥത്തിൽ: “നീ അവിടെ കയറിയ കിടക്കയിൽനിന്ന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “നീ അവിടെ കയറിയ കിടക്കയിൽനിന്ന്.”'
    reason: എബ്രായത്തിലെ אֲשֶׁר...שָּׁם എന്ന relative-resumptive ഘടന മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കിയതിനാൽ അതിന്റെ കൂടുതൽ അക്ഷരാർഥരൂപം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യൻ
  rationale: ദൂതന്മാർ ഇനിയും ഏലിയാവിനെ പേരെടുത്തു തിരിച്ചറിയാത്തതിനാൽ, ആഖ്യാനത്തിന്റെ കാഴ്ചപ്പാടും പുല്ലിംഗ ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: עָלָה לִקְרָאתֵנוּ
  choice: ഞങ്ങളെ എതിരേറ്റുവന്നു
  rationale: സന്ദർഭത്തിലെ അഭിമുഖചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; עָלָה എന്നതിലെ ഉയർന്നുവരുന്ന ചലനം മലയാളത്തിൽ നിർബന്ധമായി പ്രത്യേകം പറഞ്ഞാൽ കൃത്രിമമാകും.
- source_word: לְכוּ שׁוּבוּ
  choice: മടങ്ങിച്ചെന്ന്
  rationale: രണ്ട് ആജ്ഞകളുടെയും ചലനാർത്ഥം ഒരൊറ്റ സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ പതിവുസൂത്രം ഗൗരവമുള്ള, പരിചിതമായ മലയാളത്തിൽ നൽകുകയും ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ ദൈവം ഇല്ലാത്തതുകൊണ്ടാണോ
  rationale: എബ്രായത്തിലെ അവിശ്വാസവും ശാസനയും നിറഞ്ഞ ആലങ്കാരികചോദ്യത്തിന്റെ ശക്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: שֹׁלֵחַ לִדְרֹשׁ
  choice: ചോദിച്ചറിയാൻ ആളയയ്ക്കുന്നത്
  rationale: ദേവനിൽനിന്ന് അരുളപ്പാട് തേടുന്ന ആശയം സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു; രാജാവ് ദൂതന്മാരെ അയച്ചതും സൂചിപ്പിക്കുന്നു.
- source_word: בַּעַל זְבוּב אֱלֹהֵי עֶקְרוֹן
  choice: എക്രോനിലെ ദേവനായ ബാൽ-സെബൂബ്
  rationale: സ്ഥലനാമവും ദേവനാമവും ലിപ്യന്തരണം ചെയ്ത്, construct ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם
  choice: നീ കയറിയ കിടക്ക
  rationale: രോഗസന്ദർഭത്തിൽ מִטָּה എന്നതിന് ‘കിടക്ക’ യോജിക്കുന്നു. എബ്രായത്തിലെ resumptive ‘അവിടെ’ മുഖ്യവാചകത്തിൽ ആവർത്തിക്കാതെ സ്വാഭാവികമാക്കി, അക്ഷരഘടന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: מוֹת תָּמוּת
  choice: നീ നിശ്ചയമായും മരിക്കും
  rationale: infinitive absolute + finite verb നൽകുന്ന ഉറപ്പും ഊന്നലും മലയാളത്തിൽ ‘നിശ്ചയമായും’ വഴി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ടെട്രാഗ്രാമറ്റൺ നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ നിർദ്ദേശാർഥം
  choice: ദൈവം
  alternative: ഒരു ദൈവം
  rationale: ചോദ്യം ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ അഭാവത്തെ പരിഹാസപൂർവം നിഷേധിക്കുന്നു. മലയാളത്തിലെ ‘ദൈവം’ ഈ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു; അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്ന ‘ഒരു’ ചേർക്കുന്നത് അനാവശ്യമായ തെറ്റിദ്ധാരണ ഉണ്ടാക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഉദ്ധരണികളുടെ പലതട്ടുകൾ വ്യക്തമായി സൂക്ഷിച്ചിട്ടുണ്ട്. പ്രവാചകസൂത്രത്തിൽ ഗൗരവത്തിനായി ‘അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചെങ്കിലും ശേഷിക്കുന്ന വാചകം സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ള ഭാഷയിലാണ്.
