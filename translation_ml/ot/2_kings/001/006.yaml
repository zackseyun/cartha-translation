  source_fidelity: The Malayalam accurately conveys the Hebrew narrative report, the messenger formula, the rhetorical rebuke, the consultation of Baal-zebub, and the emphatic death pronouncement. ‘മടങ്ങിച്ചെന്ന്’ naturally represents the paired movement imperatives in context, and ‘ചോദിച്ചറിയാൻ ആളയയ്ക്കുന്നത്’ appropriately expresses sending messengers to seek an oracle. The rendering of the bed clause correctly preserves the consequence that he will not come down from the bed.
