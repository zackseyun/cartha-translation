base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: ml
  text: 'ഏലിയാവ് അവരോടു മറുപടിയായി പറഞ്ഞു: “ഞാൻ ദൈവപുരുഷനാണെങ്കിൽ,[a] ആകാശത്തുനിന്ന് തീ ഇറങ്ങി നിന്നെയും നിന്റെ അമ്പതുപേരെയും[b] ദഹിപ്പിക്കട്ടെ.” അപ്പോൾ ദൈവത്തിന്റെ തീ[c] ആകാശത്തുനിന്ന് ഇറങ്ങി അവനെയും അവന്റെ അമ്പതുപേരെയും ദഹിപ്പിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാനാണ് ആ ദൈവപുരുഷനെങ്കിൽ.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം അക്ഷരാർഥത്തിൽ “നിന്റെ അമ്പത്”; അമ്പതുപേരടങ്ങിയ നായകന്റെ സൈനികസംഘത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “ദൈവത്തിൽനിന്നുള്ള തീ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵיהֶם
  choice: ഏലിയാവ് അവരോടു മറുപടിയായി പറഞ്ഞു
  rationale: ഇരട്ടമായ എബ്രായ സംഭാഷണസൂത്രത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אִם אִישׁ הָאֱלֹהִים אָנִי
  choice: ഞാൻ ദൈവപുരുഷനാണെങ്കിൽ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന അംഗീകൃത പദവിയായ ‘ദൈവപുരുഷൻ’ നിലനിർത്തുന്നു; മലയാളത്തിൽ അനാവശ്യമായി അനിശ്ചിതത്വസൂചകമായ ‘ഒരു’ ചേർക്കുന്നില്ല.
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: ആകാശത്തുനിന്ന് തീ ഇറങ്ങി ... ദഹിപ്പിക്കട്ടെ
  rationale: ക്രിയാരൂപത്തിന്റെ ആഹ്വാനാത്മകമായ ജസ്സീവ് ഭാവം വെറും പ്രവചനമായി മാറ്റാതെ ‘-ട്ടെ’ രൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְתֹאכַל
  choice: ദഹിപ്പിക്കട്ടെ / ദഹിപ്പിച്ചു
  rationale: തീയുടെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന אכל എന്ന ക്രിയയ്ക്ക് മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സമാനപദം; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ മൂലക്രിയയുടെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: നിന്റെ അമ്പതുപേർ / അവന്റെ അമ്പതുപേർ
  rationale: ‘നിന്റെ അമ്പത്’ എന്ന അക്ഷരാർഥത്തേക്കാൾ മലയാളത്തിൽ വ്യക്തമായി, അമ്പതുപേരടങ്ങിയ സൈനികസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: אֵשׁ אֱלֹהִים
  choice: ദൈവത്തിന്റെ തീ
  rationale: തീയെ ദൈവത്തോടു നേരിട്ട് ബന്ധിപ്പിക്കുന്ന എബ്രായ സംയുക്തപ്രയോഗം നിലനിർത്തുന്നു; അതിന്റെ പ്രവർത്തനരീതി സംബന്ധിച്ച അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים എന്ന പ്രവാചകപദവിയുടെ വിവർത്തനം
  choice: ദൈവപുരുഷൻ
  alternative: ആ ദൈവപുരുഷൻ
  rationale: മൂലത്തിലെ അംഗീകൃത പ്രവാചകപദവി സംരക്ഷിക്കുന്നു. നിർദിഷ്ടതയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു; മുഖ്യവാചകത്തിൽ അത് അമിതമായി തീർപ്പാക്കുന്നില്ല.
- issue: אֵשׁ אֱלֹהִים എന്ന പ്രയോഗത്തിലെ ദൈവബന്ധം
  choice: ദൈവത്തിന്റെ തീ
  alternative: ദൈവത്തിൽനിന്നുള്ള തീ
  rationale: മൂലവാചകം തീയെ ദൈവത്തോടു ബന്ധിപ്പിക്കുന്നു. ‘ദൈവത്തിന്റെ തീ’ ആ ബന്ധം ഔപചാരികമായി നിലനിർത്തുമ്പോൾ, ഉറവിടബന്ധമായി ഗ്രഹിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. സംഭാഷണത്തിലെ ഏകവചന അഭിസംബോധനയും ആഹ്വാനാത്മക ഭാവവും നിലനിർത്തിയിരിക്കുന്നു; സൈനികസംഘത്തെ വ്യക്തമാക്കാൻ ‘പേർ’ ചേർത്തിരിക്കുന്നു.
