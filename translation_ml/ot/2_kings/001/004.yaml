id: 2KI.1.4
reference: 2 Kings 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָ/כֵן֙ כֹּֽה אָמַ֣ר יְהוָ֔ה הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּ֣י מ֣וֹת תָּמ֑וּת וַ/יֵּ֖לֶךְ אֵלִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/004.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘You will not come down from the bed that you have gone up onto[c][b], for you will surely die.’ And Elijah went.'
translation:
  language: ml
  text: 'അതുകൊണ്ട് യഹോവ ഇപ്രകാരം പറയുന്നു: ‘നീ കയറിയ ആ കിടക്കയിൽനിന്ന് ഇറങ്ങുകയില്ല; നീ തീർച്ചയായും മരിക്കും.’ അപ്പോൾ ഏലിയാവ് പോയി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָכֵן
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ശാസനയിൽനിന്ന് തുടർന്നുവരുന്ന വിധിയുടെ അനുമാനബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ ഔപചാരിക സന്ദേശസൂത്രം നിലനിർത്തുന്നു; ‘അരുളിച്ചെയ്യുന്നു’ ദൈവിക പ്രസ്താവനയ്ക്ക് യോജിച്ച മാന്യവും സുപരിചിതവുമായ പ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ചതുർക്ഷര ദൈവനാമത്തെ പൊതുവായി അംഗീകരിക്കപ്പെട്ട മലയാളരൂപത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: הַמִּטָּה
  choice: ആ കിടക്ക
  rationale: מִטָּה എന്നതിന്റെ സാധാരണ അർഥം ‘കിടക്ക’യാണ്; ‘രോഗക്കിടക്ക’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനം ചേർക്കും.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: നീ കയറിയ
  rationale: עָלָה എന്ന ‘കയറുക’ എന്ന ദിശാസൂചന നിലനിർത്തുകയും പിന്നാലെയുള്ള ‘ഇറങ്ങുക’ എന്ന വിരുദ്ധചലനവുമായി ഉള്ള പദപ്രതിധ്വനി സംരക്ഷിക്കുകയും ചെയ്യുന്നു. שָׁם എബ്രായത്തിലെ പുനരുക്ത സ്ഥാനസൂചകമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം ആവർത്തിക്കേണ്ടതില്ല.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: അതിൽനിന്ന് ഇറങ്ങുകയില്ല
  rationale: יָרַד എന്നതിന്റെ ഇറങ്ങുക/താഴേക്കു വരുക എന്ന അർഥം നൽകുകയും ‘കയറിയ—ഇറങ്ങുക’ എന്ന മൂലപാഠത്തിലെ വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כִּי מוֹת תָּמוּת
  choice: നീ തീർച്ചയായും മരിക്കും
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ തീവ്രതയും മരണത്തിന്റെ ഉറപ്പും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיֵּלֶךְ אֵלִיָּה
  choice: അങ്ങനെ ഏലിയാവ് പോയി
  rationale: കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന വാവ്-ക്രമത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; הָלַךְ എന്നതിന്റെ ലളിതമായ അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ ചതുർക്ഷര ദൈവനാമം നേരിട്ട് ഉള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനുപകരം മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രവാചകപ്രഖ്യാപന ശൈലി. ‘കയറിയ—ഇറങ്ങുകയില്ല’ എന്ന മൂലഭാഷയിലെ ദിശാവൈരുധ്യം അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കി സംരക്ഷിച്ചു.
