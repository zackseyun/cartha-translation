revisions:
- from: 'അതുകൊണ്ട് യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘നീ കയറിയ ആ കിടക്കയിൽനിന്ന് ഇറങ്ങുകയില്ല; നീ തീർച്ചയായും മരിക്കും.’ അങ്ങനെ ഏലിയാവ് പോയി.'
  to: 'അതുകൊണ്ട് യഹോവ ഇപ്രകാരം പറയുന്നു: ‘നീ കയറിയ ആ കിടക്കയിൽനിന്ന് ഇറങ്ങുകയില്ല; നീ തീർച്ചയായും മരിക്കും.’ അപ്പോൾ ഏലിയാവ് പോയി.'
  rationale: The revision retains every semantic element of the Hebrew, including the go-up/come-down contrast and emphatic death pronouncement, while using contemporary Malayalam for the divine speech formula and a neutral sequential connective for the final narrative clause.
