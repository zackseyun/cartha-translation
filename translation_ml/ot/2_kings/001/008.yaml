id: 2KI.1.8
reference: 2 Kings 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו אִ֚ישׁ בַּ֣עַל שֵׂעָ֔ר וְ/אֵז֥וֹר ע֖וֹר אָז֣וּר בְּ/מָתְנָ֑י/ו וַ/יֹּאמַ֕ר אֵלִיָּ֥ה הַ/תִּשְׁבִּ֖י הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/008.yaml
  text: They said to him[a], “He was a hairy man, with a leather belt fastened around his waist.” And he said, “It is Elijah the Tishbite.”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “അയാൾ രോമമുള്ള ഒരു മനുഷ്യനായിരുന്നു[a]; അരയ്ക്കു ചുറ്റും തോൽകൊണ്ടുള്ള ഒരു അരപ്പട്ട കെട്ടിയിരുന്നു.” അപ്പോൾ അവൻ പറഞ്ഞു: “അവൻ തിശ്ബ്യനായ ഏലിയാവാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രോമവസ്ത്രം ധരിച്ച ഒരു മനുഷ്യൻ.” ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “രോമത്തിന്റെ ഉടമ” എന്നാണ്; അത് രോമമുള്ള മനുഷ്യനെയോ രോമംകൊണ്ടുള്ള വസ്ത്രം ധരിച്ചവനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: മനുഷ്യൻ
  rationale: ഇവിടെ പ്രായപൂർത്തിയായ പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വിവരണാത്മകമായി സ്വാഭാവികമായ പദം.
- source_word: בַּעַל שֵׂעָר
  choice: രോമമുള്ള ഒരു മനുഷ്യൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘രോമത്തിന്റെ ഉടമ’ എന്ന നിർമാണം ശരീരത്തിലെ രോമസമൃദ്ധിയെയോ രോമവസ്ത്രധാരണത്തെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിൽ നേരിട്ടുള്ള ശാരീരിക വിവരണം നിലനിർത്തി മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ കൊടുക്കുന്നു.
- source_word: וְאֵזוֹר עוֹר
  choice: തോൽകൊണ്ടുള്ള ഒരു അരപ്പട്ട
  rationale: אֵזוֹר അരയിൽ ധരിക്കുന്ന പട്ടയും עוֹר അതിന്റെ തോൽവസ്തുവും വ്യക്തമാക്കുന്നു.
- source_word: אָזוּר בְּמָתְנָיו
  choice: അരയ്ക്കു ചുറ്റും ... കെട്ടിയിരുന്നു
  rationale: പട്ട അരപ്രദേശത്ത് ധരിച്ചിരുന്നതിനെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: തിശ്ബ്യനായ ഏലിയാവ്
  rationale: വ്യക്തിനാമവും സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന വിശേഷണവും മലയാള ബൈബിൾശൈലിക്ക് യോജിച്ച വിധത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הוּא
  choice: അവൻ ... ആണ്
  rationale: വിവരണത്തിൽനിന്ന് ആളെ തിരിച്ചറിയിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. בַּעַל שֵׂעָר എന്ന പ്രയോഗത്തിലെ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
