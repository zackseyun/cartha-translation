  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
translation:
  language: ml
  text: ഇതാ, ആകാശത്തുനിന്ന് തീ ഇറങ്ങി, അമ്പതംഗ സംഘങ്ങളുടെ ആദ്യത്തെ രണ്ടു സേനാനായകരെയും അവരുടെ അമ്പതംഗ സംഘങ്ങളെയും[a] ദഹിപ്പിച്ചു. എന്നാൽ ഇപ്പോൾ, എന്റെ ജീവൻ[b] അങ്ങയുടെ ദൃഷ്ടിയിൽ വിലപ്പെട്ടതായിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
