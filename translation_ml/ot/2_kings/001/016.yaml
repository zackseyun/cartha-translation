source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֵלָ֜י/ו כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֜עַן אֲשֶׁר שָׁלַ֣חְתָּ מַלְאָכִים֮ לִ/דְרֹשׁ֮ בְּ/בַ֣עַל זְבוּב֮ אֱלֹהֵ֣י עֶקְרוֹן֒ הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל לִ/דְרֹ֖שׁ בִּ/דְבָר֑/וֹ לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘നീ എക്രോന്റെ ദേവനായ ബാൽ-സെബൂബിനോട്[a] അന്വേഷിക്കാൻ ദൂതന്മാരെ അയച്ചത് ഇസ്രായേലിൽ ദൈവത്തിന്റെ വചനം അന്വേഷിച്ചറിയാൻ[b] ദൈവം ഇല്ലാത്തതുകൊണ്ടാണോ? അതുകൊണ്ട്, നീ കയറിയ ആ കിടക്ക[c]—അതിൽനിന്ന് നീ ഇറങ്ങുകയില്ല; നീ തീർച്ചയായും മരിക്കും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ പേര് ‘ബാൽ-സെബൂബ്’ എന്നാണ്; പിൽക്കാല പാരമ്പര്യത്തിൽ ഇതുമായി ബന്ധപ്പെട്ട ‘ബാൽ-സെബൂൽ’ എന്ന രൂപവും കാണപ്പെടുന്നു.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവന്റെ വചനം അന്വേഷിക്കാൻ’; അവനിൽനിന്ന് ഒരു ദൈവിക സന്ദേശമോ അരുളപ്പാടോ തേടുക എന്നായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: ‘നീ അവിടെ കയറിയ ആ കിടക്ക.’ എബ്രായത്തിലെ ‘അവിടെ’ ബന്ധവാക്യത്തിനുള്ളിലെ പുനരുക്തിപദമായും മനസ്സിലാക്കാം.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
  choice: അവൻ അവനോടു പറഞ്ഞു
  rationale: דבר എന്ന ക്രിയയുടെ ‘സംസാരിക്കുക/പറയുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; എബ്രായത്തിലുള്ള സർവനാമസൂചനയുടെ സന്ദർഭാധീനത നിലനിർത്തുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ പതിവു പ്രഖ്യാപനശൈലി നിലനിർത്തുന്നു; יהוה എന്ന ദൈവനാമം യഹ്‌വെ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: שָׁלַחְתָּ מַלְאָכִים
  choice: നീ ... ദൂതന്മാരെ അയച്ചത്
  rationale: ഇവിടെ מַלְאָכִים മനുഷ്യദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൂതന്മാർ’ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  choice: ബാൽ-സെബൂബിനോട് അന്വേഷിക്കാൻ
  rationale: דרש എന്നത് ഒരു ദേവനിൽനിന്ന് ദൈവിക സന്ദേശമോ മറുപടിയോ തേടുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിന്റെ ആലോചനാപരമായ അർഥം ‘അന്വേഷിക്കാൻ’ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: എക്രോന്റെ ദേവൻ
  rationale: എക്രോനുമായി ദേവന്റെ ബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ construct രൂപം നേരിട്ട് നൽകുന്നു.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ ... ദൈവം ഇല്ലാത്തതുകൊണ്ടാണോ?
  rationale: രാജാവിന്റെ പ്രവൃത്തിയെ ശാസിക്കുന്ന വാചാടോപചോദ്യം ചോദ്യരൂപത്തിൽതന്നെ നിലനിർത്തുന്നു.
- source_word: לִדְרֹשׁ בִּדְבָרוֹ
  choice: അവന്റെ വചനം അന്വേഷിച്ചറിയാൻ
  rationale: ദൈവിക അരുളപ്പാടോ സന്ദേശമോ തേടുക എന്ന ആശയം വ്യക്തമാക്കുമ്പോഴും ‘അവന്റെ വചനം’ എന്ന എബ്രായത്തിലെ പ്രത്യക്ഷ ഘടകം ഒഴിവാക്കുന്നില്ല.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם לֹא תֵרֵד מִמֶּנָּה
  choice: നീ കയറിയ ആ കിടക്ക—അതിൽനിന്ന് നീ ഇറങ്ങുകയില്ല
  rationale: ‘കയറുക/ഇറങ്ങുക’ എന്ന എബ്രായ ദൃശ്യരൂപവും കിടക്കയെ മുൻനിർത്തിയ വാക്യഘടനയും ഡാഷും പുനരുക്ത സർവനാമവും ഉപയോഗിച്ച് നിലനിർത്തുന്നു.
- source_word: כִּי מוֹת תָּמוּת
  choice: നീ തീർച്ചയായും മരിക്കും
  rationale: എബ്രായത്തിലെ infinitive absolute ചേർന്ന ശക്തമായ മരണപ്രഖ്യാപനം സ്വാഭാവിക മലയാളത്തിൽ ഊന്നിപ്പറയുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ ആധുനിക മലയാളത്തിൽ അടുത്ത ലിപ്യന്തരം നൽകുന്നു; ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ പതിവുരൂപം നിർബന്ധിക്കുന്നില്ല.
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ ഏകവചനപരമായ പരാമർശം
  choice: ദൈവം
  alternative: ഒരു ദൈവം
  rationale: ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് വാചാടോപചോദ്യം സൂചിപ്പിക്കുന്നത്; ‘ഒരു ദൈവം’ എന്നത് അനാവശ്യമായ ബഹുദൈവപരമായ അനിശ്ചിതത്വം സൃഷ്ടിച്ചേക്കാം.
- issue: ‘അവന്റെ വചനം അന്വേഷിക്കുക’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രത്യക്ഷ പദപ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തി അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു
  alternative: അവനിൽനിന്ന് അരുളപ്പാട് തേടാൻ
  rationale: ദൈവിക സന്ദേശം തേടുക എന്ന സാധ്യതയുള്ള അർഥം വ്യക്തമാക്കേണ്ടതുണ്ടെങ്കിലും דְבָרוֹ എന്ന മൂലപാഠഘടകം പരാവർത്തനത്തിലൂടെ ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രവാചകപ്രഖ്യാപനശൈലി സ്വീകരിച്ചു. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘കിടക്ക’, ‘അന്വേഷിക്കുക’ തുടങ്ങിയ പദങ്ങൾ ഉപയോഗിച്ചു; ‘അരുളിച്ചെയ്യുന്നു’ എന്നത് പ്രഖ്യാപനസൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു. മൂലത്തിലെ കിടക്കയെ മുൻനിർത്തിയ ഘടനയും ‘കയറുക/ഇറങ്ങുക’ എന്ന വൈരുധ്യവും സംരക്ഷിച്ചു.
