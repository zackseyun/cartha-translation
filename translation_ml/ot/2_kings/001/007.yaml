  yaml_path: translation/ot/2_kings/001/007.yaml
  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ അവരോടു ചോദിച്ചു: “നിങ്ങളെ എതിരേറ്റുവന്ന് ഈ വാക്കുകൾ നിങ്ങളോടു പറഞ്ഞ ആ മനുഷ്യന്റെ രൂപഭാവം എങ്ങനെയായിരുന്നു?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ എങ്ങനെയുള്ള മനുഷ്യനായിരുന്നു?” അക്ഷരാർഥത്തിൽ, “ആ മനുഷ്യന്റെ മിഷ്പാറ്റ് എന്തായിരുന്നു?” ഇവിടെ എബ്രായപദം അയാളുടെ രീതി, വിവരണം, അല്ലെങ്കിൽ രൂപഭാവം എന്നിവയെ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ അയാളെ തിരിച്ചറിയാനുള്ള വിവരണമായിരിക്കാനാണ് സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה מִשְׁפַּט
  choice: രൂപഭാവം എങ്ങനെയായിരുന്നു?
  rationale: ഇവിടെ ചോദിക്കുന്നത് ആ മനുഷ്യനെ തിരിച്ചറിയാൻ സഹായിക്കുന്ന വിവരണമാണ്; അടുത്ത വാക്യത്തിലെ വസ്ത്രധാരണത്തെയും പുറംകാഴ്ചയെയും കുറിച്ചുള്ള മറുപടിയുമായി ഇത് യോജിക്കുന്നു. ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘എങ്ങനെയായിരുന്നു?’ എന്നു പ്രയോഗിച്ചു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: ദൂതന്മാർ കണ്ട നിർദിഷ്ട വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עָלָה לִקְרַאתְכֶם
  choice: നിങ്ങളെ എതിരേറ്റുവന്ന്
  rationale: עָלָה എന്നതിലെ സമീപനദിശയും לִקְרַאתְכֶם എന്നതിലെ കണ്ടുമുട്ടൽഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു.
- source_word: וַיְדַבֵּר אֲלֵיכֶם אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ നിങ്ങളോടു പറഞ്ഞ
  rationale: ‘ഈ വാക്കുകൾ’ എന്ന മൂർത്തമായ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം പിന്തുടരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. מִשְׁפַּט എന്ന പദത്തിന്റെ സന്ദർഭപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; മുഖ്യപാഠത്തിൽ അടുത്ത വാക്യത്തിലെ തിരിച്ചറിയൽവിവരണത്തോട് യോജിക്കുന്ന ‘രൂപഭാവം’ തിരഞ്ഞെടുത്തു.
