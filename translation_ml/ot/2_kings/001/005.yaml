translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദൂതന്മാർ’ എന്ന പദം സന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ‘പറഞ്ഞു’ എന്ന ആഖ്യാനക്രിയ നിലനിർത്തിയിട്ടുണ്ട്; ചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
