id: 2KI.1.5
reference: 2 Kings 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּשׁ֥וּבוּ הַ/מַּלְאָכִ֖ים אֵלָ֑י/ו וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם מַה זֶּ֥ה שַׁבְתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/005.yaml
  text: The messengers returned to him[a], and he said to them, “Why have you returned?”
translation:
  language: ml
  text: ദൂതന്മാർ അവന്റെ അടുക്കൽ മടങ്ങിവന്നു. അവൻ അവരോട്, “നിങ്ങൾ മടങ്ങിവന്നത് എന്തുകൊണ്ട്?[a]” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഇത് എന്ത്—നിങ്ങൾ മടങ്ങിവന്നിരിക്കുന്നു?”; ഇവിടെ ഈ പ്രയോഗത്തിന്റെ അർഥം “നിങ്ങൾ മടങ്ങിവന്നത് എന്തുകൊണ്ട്?” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: മടങ്ങിവന്നു
  rationale: שׁוב എന്ന ക്രിയ ഇവിടെ അയച്ചവന്റെ അടുക്കലേക്കു തിരികെ വരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘മടങ്ങിവന്നു’ സ്വാഭാവികവും ദിശാബോധം നിലനിർത്തുന്നതുമാണ്.
- source_word: הַמַּלְאָכִים
  choice: ദൂതന്മാർ
  rationale: ഈ സന്ദർഭത്തിൽ מַלְאָכִים സ്വർഗീയ ദൂതന്മാരെയല്ല, രാജാവ് അയച്ച മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ദൂതന്മാർ’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֵלָיו
  choice: അവന്റെ അടുക്കൽ
  rationale: אֵלָיו രാജാവിലേക്കുള്ള ദിശ വ്യക്തമാക്കുന്നു; ‘അവന്റെ അടുക്കൽ’ അത് വ്യക്തമായി പകരുന്നു.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: അവൻ അവരോട് … എന്നു പറഞ്ഞു
  rationale: മൂലപാഠത്തിലെ സാധാരണ പ്രസ്താവനാക്രിയയായ אמר നെ ‘പറഞ്ഞു’ എന്നു നിലനിർത്തുന്നു; വാക്യത്തിന്റെ ചോദ്യംരൂപം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: מַה זֶּה
  choice: എന്തുകൊണ്ട്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇത് എന്ത്?’ എന്നായിരുന്നാലും, ഇവിടെ അവരുടെ മടങ്ങിവരവിന്റെ കാരണം ചോദിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്; ‘എന്തുകൊണ്ട്’ അതിന്റെ പ്രവർത്തനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שַׁבְתֶּם
  choice: നിങ്ങൾ മടങ്ങിവന്നത്
  rationale: രണ്ടാം പുരുഷ ബഹുവചനരൂപം കൃത്യമായി നിലനിർത്തുകയും ഇപ്പോൾ സംഭവിച്ച മടങ്ങിവരവിനെ ചോദ്യം ചെയ്യുകയും ചെയ്യുന്നു.
