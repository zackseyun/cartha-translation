  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֜שָׁב וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו שַׂר חֲמִשִּׁ֥ים אַחֵ֖ר וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֨עַן֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָ/אֱלֹהִ֔ים כֹּֽה אָמַ֥ר הַ/מֶּ֖לֶךְ מְהֵרָ֥ה רֵֽדָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/011.yaml
  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
translation:
  language: ml
  text: 'അവൻ വീണ്ടും മറ്റൊരു അമ്പതുപേരുടെ അധിപനെയും അയാളുടെ അമ്പതുപേരെയും ഏലിയാവിന്റെ അടുക്കൽ അയച്ചു. ആ അധിപൻ ഏലിയാവിനോട് പറഞ്ഞു: “ദൈവപുരുഷാ, രാജാവ് ഇപ്രകാരം പറയുന്നു: ‘വേഗം ഇറങ്ങിവരുക[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വേഗം ഇറങ്ങുക.” എബ്രായ ക്രിയയുടെ അർഥം ‘ഇറങ്ങുക’ എന്നാണ്; താഴെനിന്ന് ഏലിയാവിനോടു സംസാരിക്കുന്ന രാജാവിന്റെ പ്രതിനിധിയുടെ വീക്ഷണമാണ് “ഇറങ്ങിവരുക” എന്ന പരിഭാഷയിൽ പ്രതിഫലിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: വീണ്ടും
  rationale: തുടർന്നുള്ള ക്രിയയോടു ചേർന്ന് ഇവിടെ ശാരീരികമായി മടങ്ങുന്നതിനെക്കാൾ പ്രവൃത്തി ആവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: שַׂר חֲמִשִּׁים
  choice: അമ്പതുപേരുടെ അധിപൻ
  rationale: അമ്പത് സൈനികരടങ്ങിയ സംഘത്തിന്റെ മേലധികാരിയെ സൂചിപ്പിക്കുന്ന സൈനികപദവി; മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: וַחֲמִשָּׁיו
  choice: അയാളുടെ അമ്പതുപേർ
  rationale: ആ അധിപന്റെ കീഴിലുള്ള അമ്പത് സൈനികരെയാണ് സൂചിപ്പിക്കുന്നത്; വാക്യഘടനയിൽ സഹഗമനം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: וַיַּעַן וַיְדַבֵּר
  choice: പറഞ്ഞു
  rationale: എബ്രായത്തിലെ പതിവായ ഇരട്ട ക്രിയാപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ഒറ്റ പ്രസ്താവനാക്രിയകൊണ്ട് അവതരിപ്പിക്കുന്നു; ഇവിടെ മുൻചോദ്യം ഇല്ലാത്തതിനാൽ ‘ഉത്തരം പറഞ്ഞു’ അസ്വാഭാവികമാകും.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷാ
  rationale: ഏലിയാവിന്റെ അംഗീകൃത വിശേഷണത്തെ നേരിട്ടുള്ള സംബോധനയായി സംരക്ഷിക്കുന്നു.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: രാജാവ് ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: രാജകീയ ദൂതസന്ദേശത്തിന്റെ ഔപചാരികവും അധികാരപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: מְהֵרָה
  choice: വേഗം
  rationale: കൽപ്പനയിലെ അടിയന്തരത ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: רֵדָה
  choice: ഇറങ്ങിവരുക
  rationale: മുകളിലുള്ള ഏലിയാവിനോട് താഴെയുള്ള രാജപ്രതിനിധി പറയുന്ന കൽപ്പനയായതിനാൽ മലയാളത്തിലെ ദിശാസൂചനാപരമായ സ്വാഭാവിക പ്രയോഗം; മൂലക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ഇറങ്ങുക’ എന്നതാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും പുലർത്തുന്ന മലയാളം. ആവർത്തനമുള്ള എബ്രായ കഥനശൈലി അർഥം നഷ്ടപ്പെടാതെ മലയാളത്തിൽ സ്വാഭാവികമാക്കി; രാജകീയ സന്ദേശസൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്തി.
