  text: וַ/יְדַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶל אֵ֣לִיָּ֔הוּ רֵ֣ד אוֹת֔/וֹ אַל תִּירָ֖א מִ/פָּנָ֑י/ו וַ/יָּ֛קָם וַ/יֵּ֥רֶד אוֹת֖/וֹ אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവയുടെ ദൂതൻ ഏലിയാവിനോടു പറഞ്ഞു: “അവനോടൊപ്പം ഇറങ്ങിച്ചെല്ലുക; അവനെ ഭയപ്പെടേണ്ടാ.[a]” അങ്ങനെ ഏലിയാവ് എഴുന്നേറ്റ് അവനോടൊപ്പം രാജാവിന്റെ അടുക്കലേക്ക് ഇറങ്ങിച്ചെന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവന്റെ സന്നിധിയിൽനിന്ന് ഭയപ്പെടരുത്”; അതായത്, അവന്റെ സാന്നിധ്യം നിമിത്തം ഭയപ്പെടരുത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്ന പദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം. മലയാളത്തിലെ ‘ദൂതൻ’ ഈ സന്ദർഭത്തിലെ ദൈവിക ദൂതനെന്ന സ്വാഭാവിക അർഥം നൽകുകയും മൂലപദത്തിന്റെ വിശാലത ഒരു പരിധിവരെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: רֵד אוֹתוֹ
  choice: അവനോടൊപ്പം ഇറങ്ങിച്ചെല്ലുക
  rationale: ירד എന്ന ക്രിയയോടു ചേർന്ന אוֹתוֹ ഇവിടെ കൂടെപ്പോകലിനെ സൂചിപ്പിക്കുന്നു. കല്പനയുടെ ദിശയും സഹയാത്രയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אַל תִּירָא מִפָּנָיו
  choice: അവനെ ഭയപ്പെടേണ്ടാ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ വിലക്കുകല്പനയായി വിവർത്തനം ചെയ്തു. מִפָּנָיו എന്നതിന്റെ അക്ഷരാർഥസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: പ്രതികരണമായി ഉടൻ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ ആഖ്യാനക്രിയയ്ക്ക് യോജിച്ച, ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַיֵּרֶד אוֹתוֹ אֶל הַמֶּלֶךְ
  choice: അവനോടൊപ്പം രാജാവിന്റെ അടുക്കലേക്ക് ഇറങ്ങിച്ചെന്നു
  rationale: ഇറങ്ങിപ്പോകുന്ന ചലനം, കൂടെയുള്ള വ്യക്തി, ലക്ഷ്യസ്ഥാനം എന്നീ മൂന്നു ഘടകങ്ങളും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ നാമരൂപം നിലനിർത്തി.
- issue: מַלְאַךְ എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: ഈ ദൈവിക കല്പനയുടെ സന്ദർഭത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്; അതേസമയം പദത്തെക്കുറിച്ചുള്ള അനാവശ്യമായ സത്താശാസ്ത്ര നിർവചനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ഇറങ്ങിച്ചെല്ലുക/ഇറങ്ങിച്ചെന്നു’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ആവർത്തനത്തെ നിലനിർത്തുന്നു; അനാവശ്യമായ പുരാതന പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
