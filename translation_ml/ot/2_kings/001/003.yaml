source:
  edition: WLC
  text: וּ/מַלְאַ֣ךְ יְהוָ֗ה דִּבֶּר֙ אֶל אֵלִיָּ֣ה הַ/תִּשְׁבִּ֔י ק֣וּם עֲלֵ֔ה לִ/קְרַ֖את מַלְאֲכֵ֣י מֶֽלֶךְ שֹׁמְר֑וֹן וְ/דַבֵּ֣ר אֲלֵ/הֶ֔ם הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתֶּם֙ הֹֽלְכִ֔ים לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֥י עֶקְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
translation:
  language: ml
  text: 'എന്നാൽ യഹ്‌വേയുടെ ദൂതൻ തിശ്ബ്യനായ ഏലിയാവിനോടു പറഞ്ഞു: “എഴുന്നേറ്റ് ശമര്യരാജാവിന്റെ ദൂതന്മാരെ എതിരേൽക്കാൻ കയറിച്ചെന്ന് അവരോടു പറയുക: ‘ഇസ്രായേലിൽ ദൈവമില്ലാത്തതുകൊണ്ടാണോ നിങ്ങൾ എക്രോന്റെ ദേവനായ ബാൽ-സെബൂബിനോട് അരുളപ്പാട് ചോദിക്കാൻ പോകുന്നത്?’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇസ്രായേലിൽ ഒരു ദൈവത്തിന്റെ അഭാവംകൊണ്ടാണോ നിങ്ങൾ എക്രോന്റെ ദേവനായ ബാൽ-സെബൂബിനോട് അരുളപ്പാട് ചോദിക്കാൻ പോകുന്നത്?”'
    reason: മൂലത്തിലെ הֲמִבְּלִי אֵין എന്ന പ്രയോഗം ‘ദൈവമില്ലാത്തതുകൊണ്ട്’ എന്നും ‘ഒരു ദൈവത്തിന്റെ അഭാവംകൊണ്ട്’ എന്നും സ്വാഭാവികമായി അവതരിപ്പിക്കാം.
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: എന്നാൽ യഹോവയുടെ ദൂതൻ
  rationale: വാവ് മുൻവാക്യത്തിലെ രാജാവിന്റെ നടപടിയോടുള്ള ആഖ്യാനവൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി. מַלְאַךְ എന്നതിന്റെ ദൂതൻ/സന്ദേശവാഹകൻ എന്ന അർത്ഥവ്യാപ്തി നിലനിർത്തുന്ന ‘ദൂതൻ’ സ്വർഗീയ ദൂതനെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; യഹോവ എന്ന ഉടമ്പടിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: דִּבֶּר אֶל
  choice: …നോടു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിക്കു മുമ്പ് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം; ‘സംസാരിച്ചു’ എന്ന അടിസ്ഥാന അർത്ഥവും പ്രസംഗസന്ദർഭവും സംരക്ഷിക്കുന്നു.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: തിശ്ബ്യനായ ഏലിയാവ്
  rationale: വ്യക്തിനാമവും ദേശജനസൂചക വിശേഷണവും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകി.
- source_word: קוּם עֲלֵה
  choice: എഴുന്നേറ്റ് … കയറിച്ചെന്ന്
  rationale: രണ്ട് ആജ്ഞകളെയും സംരക്ഷിക്കുന്നു; עלה എന്നതിലെ മുകളിലേക്കുള്ള ദിശാഭാവം ‘കയറിച്ചെന്ന്’ വ്യക്തമാക്കുന്നു.
- source_word: לִקְרַאת
  choice: എതിരേൽക്കാൻ
  rationale: ലക്ഷ്യസൂചകമായ ക്രിയാരൂപവും നേരിൽ ചെന്നു കാണുക എന്ന അർത്ഥവും നൽകുന്നു; ‘നേരിടാൻ’ എന്നു നൽകി ഏറ്റുമുട്ടൽ അതിവ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: מַלְאֲכֵי מֶלֶךְ שֹׁמְרוֹן
  choice: ശമര്യരാജാവിന്റെ ദൂതന്മാർ
  rationale: ഇവിടെ മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശമര്യയുടെ രാജാവ്’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായ സമാസരൂപം സ്വീകരിച്ചു.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ ദൈവമില്ലാത്തതുകൊണ്ടാണോ
  rationale: ശാസനസ്വഭാവമുള്ള വാചാടോപചോദ്യം വ്യക്തവും സംക്ഷിപ്തവുമായി സംരക്ഷിക്കുന്നു.
- source_word: אַתֶּם הֹלְכִים
  choice: നിങ്ങൾ … പോകുന്നത്
  rationale: പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന പുരോഗമിക്കുന്നതോ ഉദ്ദേശിച്ചതോ ആയ പ്രവൃത്തി മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യംഘടനയിൽ നൽകി.
- source_word: לִדְרֹשׁ
  choice: അരുളപ്പാട് ചോദിക്കാൻ
  rationale: ദേവതയിൽനിന്ന് ദൈവിക മറുപടി തേടുന്ന ഈ പ്രവചന/ദൈവജ്ഞാനസന്ദർഭം ‘അന്വേഷിക്കാൻ’ എന്ന പൊതുപദത്തേക്കാൾ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: בַּעַל זְבוּב
  choice: ബാൽ-സെബൂബ്
  rationale: സംയുക്തമായ അന്യനാമം ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്ത് ഹൈഫൻ നിലനിർത്തി.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: എക്രോന്റെ ദേവൻ
  rationale: അന്യദേവതയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവികമായ ‘ദേവൻ’ ഉപയോഗിച്ചു; എക്രോനുമായുള്ള ആരാധനാബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: מַלְאַךְ יְהוָה എന്ന പ്രയോഗത്തിലെ ദൂതന്റെ തിരിച്ചറിവ്
  choice: യഹോവയുടെ ദൂതൻ
  alternative: യഹോവയുടെ സന്ദേശവാഹകൻ
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികമായ ദൂതസങ്കൽപ്പം നൽകുമ്പോഴും ആ ദൂതന്റെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിവിനെക്കുറിച്ച് പാഠത്തിന് അപ്പുറമുള്ള അവകാശവാദം ചേർക്കുന്നില്ല.
- issue: בַּעַל זְבוּב-നോടുള്ള അന്വേഷണം
  choice: അരുളപ്പാട് ചോദിക്കുക
  alternative: ആരായുക
  rationale: ഇത് ആരാധനയെന്നതിലുപരി ഒരു ദേവതയിൽനിന്ന് മറുപടി തേടുന്ന ദൈവജ്ഞാനപ്രവൃത്തിയാണെന്ന സന്ദർഭം വ്യക്തമാക്കി; അതിന്റെ സാധുത അംഗീകരിക്കുന്ന ഭാഷ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. രാജാവിന്റെ മനുഷ്യദൂതന്മാർക്കും യഹോവയുടെ ദൂതനും ‘ദൂതൻ’ എന്ന ഒരേ പദം ഉപയോഗിച്ച് മൂലത്തിലെ מַלְאַךְ ആവർത്തനം സംരക്ഷിച്ചു; സന്ദർഭം വ്യത്യാസം വ്യക്തമാക്കുന്നു. പ്രധാന പാഠത്തിലെ അടിക്കുറിപ്പടയാളം അവസാന ഉദ്ധരണിക്കു ശേഷം ചേർത്തിരിക്കുന്നു.
