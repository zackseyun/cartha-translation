  rationale: രാഷ്ട്രീയ പശ്ചാത്തലത്തിൽ פשע ഒരു മേലധികാരശക്തിക്കെതിരായ കലാപത്തെയോ മത്സരത്തെയോ സൂചിപ്പിക്കുന്നു; പൊതുവായ ധാർമിക ‘ലംഘനം’ എന്ന അർഥമല്ല ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: מוֹאָב
