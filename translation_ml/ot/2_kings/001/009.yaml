  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו שַׂר חֲמִשִּׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֣עַל אֵלָ֗י/ו וְ/הִנֵּה֙ יֹשֵׁב֙ עַל רֹ֣אשׁ הָ/הָ֔ר וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים הַ/מֶּ֥לֶךְ דִּבֶּ֖ר רֵֽדָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ഏലിയാവിന്റെ അടുക്കലേക്ക് അമ്പതുപേരുടെ ഒരു സൈന്യാധിപനെയും അദ്ദേഹത്തിന്റെ അമ്പതുപേരെയും അയച്ചു. അയാൾ ഏലിയാവിന്റെ അടുക്കലേക്ക് കയറിച്ചെന്നു. അതാ, ഏലിയാവ് മലയുടെ മുകളിൽ ഇരിക്കുകയായിരുന്നു.[a] അയാൾ ഏലിയാവിനോട് പറഞ്ഞു: “ദൈവപുരുഷാ, രാജാവ് പറയുന്നു: ‘ഇറങ്ങിവരിക.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കുന്നിന്റെ മുകളിൽ.” എബ്രായത്തിലെ הַר (ഹാർ) എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് മലയെയോ കുന്നിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “രാജാവ് സംസാരിച്ചു: ‘ഇറങ്ങിവരിക.’” എബ്രായ ദൂതസന്ദേശരീതിയിലെ “സംസാരിച്ചു” എന്ന പ്രയോഗം ഇവിടെ സ്വാഭാവിക മലയാളത്തിൽ “പറയുന്നു” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: അപ്പോൾ രാജാവ് ഏലിയാവിന്റെ അടുക്കലേക്ക് ... അയച്ചു
  rationale: Wayyiqtol കഥയുടെ അടുത്ത ഘട്ടം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമാണ്. എബ്രായത്തിലെ സർവനാമങ്ങൾ സന്ദർഭത്തിൽ ആഹാബിന്റെ മകനായ രാജാവിനെയും ഏലിയാവിനെയും സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പേരും ‘രാജാവ്’ എന്നും നൽകിയിരിക്കുന്നു.
- source_word: שַׂר חֲמִשִּׁים
  choice: അമ്പതുപേരുടെ ഒരു അധിപൻ
  rationale: അമ്പതുപേരടങ്ങുന്ന സൈനികസംഘത്തിന്റെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘അധിപൻ’ പദം പദവിയുടെ അർഥം മാന്യമായും ചുരുക്കമായും നിലനിർത്തുന്നു.
- source_word: וַחֲמִשָּׁיו
  choice: അയാളുടെ അമ്പതുപേർ
  rationale: പ്രത്യയം ആ അധിപന്റെ കീഴിലുള്ള സംഘത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ മനുഷ്യരെ സൂചിപ്പിക്കുന്ന ‘പേർ’ ചേർത്ത് അർഥം സ്വാഭാവികമാക്കി.
- source_word: וַיַּעַל אֵלָיו
  choice: അയാൾ ഏലിയാവിന്റെ അടുക്കലേക്ക് കയറിച്ചെന്നു
  rationale: עלה ഉയർന്ന സ്ഥലത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു; ഏലിയാവ് മലമുകളിൽ ആയതിനാൽ ‘കയറിച്ചെന്നു’ ആ ദിശാഭാവം നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: രംഗത്തെ സജീവമായി വായനക്കാരന്റെ ശ്രദ്ധയിൽ കൊണ്ടുവരുന്ന ദൃശ്യസൂചകശക്തി മലയാളത്തിലെ ‘അതാ’ സ്വാഭാവികമായി പകരുന്നു.
- source_word: יֹשֵׁב
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: പങ്കാളിക്രിയ ആ സമയത്ത് തുടരുന്ന ഇരിപ്പിന്റെ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: עַל רֹאשׁ הָהָר
  choice: മലയുടെ മുകളിൽ
  rationale: רֹאשׁ ഇവിടെ മുകൾഭാഗം/ശിഖരം എന്നും הַר മല അല്ലെങ്കിൽ കുന്ന് എന്നും വരാം. മുഖ്യപാഠത്തിൽ സാധാരണമായ ‘മല’ സ്വീകരിച്ച് യഥാർഥ lexical പരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: അയാൾ ഏലിയാവിനോട് പറഞ്ഞു
  rationale: דבר എന്നത് ‘സംസാരിക്കുക’ എന്നാണെങ്കിലും നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്നിടത്ത് ‘പറഞ്ഞു’ എന്നത് സ്വാഭാവിക മലയാളമാണ്.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷാ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന അംഗീകൃത ബഹുമാനപദവിയാണ്; സംബോധനാവിഭക്തി നിലനിർത്തി.
- source_word: הַמֶּלֶךְ דִּבֶּר
  choice: എന്നു രാജാവ് പറയുന്നു
  rationale: അക്ഷരാർഥം ‘രാജാവ് സംസാരിച്ചു’ എന്നാണെങ്കിലും രാജദൂതന്റെ സന്ദേശസൂത്രത്തിൽ ഇപ്പോഴത്തെ സന്ദേശം പരിചയപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാളം ‘രാജാവ് പറയുന്നു’ എന്നാണ്; ‘കല്പിക്കുന്നു’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലക്രിയയെക്കാൾ അധികം വ്യാഖ്യാനിക്കും.
- source_word: רֵדָה
  choice: ഇറങ്ങിവരിക
  rationale: സംസാരിക്കുന്നയാൾ താഴെനിന്ന് ഏലിയാവിനെ തന്റെ അടുക്കലേക്ക് വിളിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ഇറങ്ങിവരിക’ ദിശാഭാവം കൃത്യമായി നൽകുന്നു.
