  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ സന്ദർഭത്തിൽ രാജാവിനെയും ഏലിയാവിനെയും പേരെടുത്ത് വ്യക്തമാക്കിയിട്ടുണ്ട്. മൂലത്തിലെ ദൃശ്യസജീവതയ്ക്കായി ‘അതാ’ നിലനിർത്തി; സൈനികപദവിക്ക് പൊതുവായ ‘അധിപൻ’ ഉപയോഗിച്ചു.
