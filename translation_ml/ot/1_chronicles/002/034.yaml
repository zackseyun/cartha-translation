  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വംശാവലിസന്ദർഭത്തിന് യോജിച്ച് ‘പുത്രന്മാർ/പുത്രിമാർ’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ‘അടിമ’ എന്ന പദത്തിനു പിന്നാലെ ചേർത്തു.
