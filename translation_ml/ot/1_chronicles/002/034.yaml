source:
  edition: WLC
  text: וְ/לֹֽא הָיָ֧ה לְ/שֵׁשָׁ֛ן בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וּ/לְ/שֵׁשָׁ֛ן עֶ֥בֶד מִצְרִ֖י וּ/שְׁמ֥/וֹ יַרְחָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/034.yaml
  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian servant whose name was Jarha.
translation:
  language: ml
  text: ശേശാന് പുത്രന്മാരില്ലായിരുന്നു; പുത്രിമാർ മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ. ശേശാന് യർഹാ എന്നു പേരുള്ള ഒരു ഈജിപ്തുകാരനായ അടിമ[a]യും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാസൻ” അല്ലെങ്കിൽ “സേവകൻ.” എബ്രായത്തിലെ עֶבֶד എന്ന പദം അടിമയെയോ സേവകനെയോ സൂചിപ്പിക്കാം; ഇവിടെ ബന്ധിതമായ അധീനപദവി വ്യക്തമാക്കാൻ “അടിമ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה לְשֵׁשָׁן
  choice: ശേശാന് ... ഉണ്ടായിരുന്നു
  rationale: ഉടമസ്ഥതയെയോ ഒരാൾക്കുള്ളതിനെയോ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു.
- source_word: בָּנִים
  choice: പുത്രന്മാർ
  rationale: തുടർന്നുള്ള ‘പുത്രിമാർ’ എന്ന പദത്തോടുള്ള വ്യക്തമായ ലിംഗവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: כִּי אִם
  choice: മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ
  rationale: നിഷേധത്തിനു ശേഷമുള്ള ‘അല്ലാതെ/മാത്രം’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בָּנוֹת
  choice: പുത്രിമാർ
  rationale: വംശാവലിയുടെ ഔപചാരിക ഭാവത്തിനും ‘പുത്രന്മാർ’ എന്ന പദത്തോടുള്ള വൈരുധ്യത്തിനും യോജിച്ച നേരിട്ടുള്ള തർജമ.
- source_word: עֶבֶד
  choice: അടിമ
  rationale: ബന്ധിതവും അധീനവുമായ സാമൂഹിക പദവിയെ മൃദൂകരിക്കാതെ പ്രകടിപ്പിക്കുന്നു; സന്ദർഭമനുസരിച്ച് ‘ദാസൻ/സേവകൻ’ എന്നും അർഥമാകാം.
- source_word: מִצְרִי
  choice: ഈജിപ്തുകാരനായ
  rationale: ആ വ്യക്തിയുടെ ദേശീയമോ വംശീയമോ ആയ ഉത്ഭവം സൂചിപ്പിക്കുന്നു.
- source_word: וּשְׁמוֹ
  choice: എന്നു പേരുള്ള
  rationale: ‘അവന്റെ പേര് ... ആയിരുന്നു’ എന്ന എബ്രായഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: יַרְחָע
  choice: യർഹാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
