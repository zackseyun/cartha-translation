translation:
  language: ml
  text: ഓബേദ് യേഹുവിന്റെ പിതാവായി, യേഹു അസര്യാവിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹבֵד
  choice: ഓബേദ്
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ഹിഫീൽ രൂപം പുരുഷവംശബന്ധത്തെ സൂചിപ്പിക്കുന്നു; ‘പിതാവായി’ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകം; മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനത ആവശ്യമില്ല.
- source_word: יֵהוּא
  choice: യേഹു
  rationale: വ്യക്തിനാമം; എബ്രായരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וְ
  choice: ;
  rationale: രണ്ട് സമാന്തര വംശാവലി പ്രസ്താവനകളുടെ ഏകോപനം മലയാളത്തിൽ അർദ്ധവിരാമംകൊണ്ട് സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: עֲזַרְיָה
  choice: അസര്യാവ്
  rationale: വ്യക്തിനാമം; എബ്രായരൂപം തിരിച്ചറിയാവുന്ന വിധത്തിലുള്ള പ്രചാരമുള്ള മലയാള ബൈബിൾ ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഔപചാരികവുമായ വംശാവലി ശൈലി. ആവർത്തിച്ചുള്ള എബ്രായ ഘടന നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
