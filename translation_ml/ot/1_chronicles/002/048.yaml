  text: Caleb’s concubine Maacah bore Sheber and Tirhanah[a].
translation:
  language: ml
  text: കാലേബിന്റെ വെപ്പാട്ടിയായ മയഖാ ശേബെരിനെയും തിര്‍ഹാനായെയും പ്രസവിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, വംശാവലികളിൽ יָלַד എന്ന ക്രിയയെ കൂടുതൽ പൊതുവായ അർഥത്തിൽ എടുത്താൽ, ‘കാലേബിന്റെ വെപ്പാട്ടിയായ മയഖാ ശേബെരിനെയും തിര്‍ഹാനായെയും ജനിപ്പിച്ചു.’ എന്നാൽ ഇവിടെ കർത്താവ് വ്യക്തമായി സ്ത്രീയായതിനാൽ മുഖ്യപാഠത്തിൽ ‘പ്രസവിച്ചു’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּלֶגֶשׁ
  choice: വെപ്പാട്ടി
  rationale: അംഗീകൃതമെങ്കിലും ഭാര്യയേക്കാൾ താഴ്ന്ന പദവിയിലുള്ള ദാമ്പത്യബന്ധത്തിലെ സ്ത്രീയെ സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന് മലയാളത്തിൽ സംക്ഷിപ്തവും പരമ്പരാഗതവുമായ തുല്യപദം.
- source_word: כָּלֵב
  choice: കാലേബ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מַעֲכָה
  choice: മയഖാ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന വ്യക്തിനാമ ലിപ്യന്തരണം.
- source_word: יָלַד
  choice: പ്രസവിച്ചു
  rationale: വംശാവലികളിൽ ഈ ക്രിയയ്ക്ക് പൊതുവായി ജനിപ്പിക്കുക എന്ന അർഥമുണ്ടാകാമെങ്കിലും ഇവിടെ കർത്താവ് സ്ത്രീയായ മയഖാ ആകയാൽ ‘പ്രസവിച്ചു’ എന്നതാണ് സ്വാഭാവികവും ലിംഗസൂചനയ്ക്ക് യോജിച്ചതുമായ പരിഭാഷ.
- source_word: שֶׁבֶר
  choice: ശേബെർ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְאֶת
  choice: -നെയും
  rationale: വാവ് സംയോജകവും നേരിട്ടുള്ള കർമസൂചകവും ചേർന്ന് രണ്ടാമത്തെ പേരിനെ ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ സമുച്ചയകർമത്തെ ‘-നെയും’ കൊണ്ട് സ്വാഭാവികമായി രേഖപ്പെടുത്തി.
- source_word: תִּרְחֲנָה
  choice: തിര്‍ഹാന
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ח എന്ന ശബ്ദത്തെ ‘ഹ’ ഉപയോഗിച്ച് ഏകദേശമായി പ്രതിനിധീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി ഉപയോഗിച്ചു. ‘വെപ്പാട്ടി’ എന്ന പദം ബന്ധത്തിന്റെ അധീനപദവി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; പേരുകൾ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
