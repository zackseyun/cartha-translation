translation:
  language: ml
  text: ദാൻ, യോസേഫ്, ബെന്യാമീൻ, നഫ്താലി, ഗാദ്, ആശേർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָּן
  choice: ദാൻ
  rationale: വ്യക്തിയുടെയും ഗോത്രത്തിന്റെയും പേരാണ്; മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: വ്യക്തിനാമം; ഹീബ്രായ ഉച്ചാരണത്തോട് അടുത്തും മലയാള വായനക്കാർക്ക് പരിചിതവുമായ രൂപം സ്വീകരിച്ചു.
- source_word: וּ/בִנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: വ്യക്തിനാമം പരിചിതമായ മലയാളരൂപത്തിൽ നൽകി. ഈ സംക്ഷിപ്ത വംശാവലിപ്പട്ടികയിൽ ഹീബ്രായ സംയോജകാക്ഷരത്തെ ഓരോ തവണയും പ്രത്യേകം ‘ഉം/യും’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായ മലയാള പട്ടികാരീതിയിൽ അവതരിപ്പിച്ചു.
- source_word: נַפְתָּלִי
  choice: നഫ്താലി
  rationale: വ്യക്തിയുടെയും ഗോത്രത്തിന്റെയും പേര്; മൂലഭാഷയുടെ ശബ്ദരൂപം വ്യക്തമായി നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: גָּד
  choice: ഗാദ്
  rationale: വ്യക്തിയുടെയും ഗോത്രത്തിന്റെയും പേര്; ഹീബ്രായ സ്വരദൈർഘ്യം പ്രതിഫലിപ്പിക്കുന്ന പരിചിത മലയാളരൂപം.
- source_word: וְ/אָשֵׁר
  choice: ആശേർ
  rationale: വ്യക്തിയുടെയും ഗോത്രത്തിന്റെയും പേര് പരിചിതമായ മലയാളരൂപത്തിൽ നൽകി; അവസാനത്തെ ഹീബ്രായ സംയോജകം മലയാളത്തിലെ പട്ടികാവിരാമക്രമത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, വംശാവലിയുടെ സംക്ഷിപ്ത പട്ടികാശൈലി അതേപടി സൂക്ഷിച്ചു. പേരുകൾ വിവർത്തനം ചെയ്യാതെ മലയാള ക്രൈസ്തവ വായനയിൽ പരിചിതവും ഹീബ്രായ രൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണങ്ങൾ ഉപയോഗിച്ചു. മൂലപാഠത്തിന്റെ അവസാനം കാണുന്ന സെതുമാ വിഭാഗചിഹ്നം പ്രസിദ്ധീകരണവാക്യത്തിൽ പാഠമായി ഉൾപ്പെടുത്തിയിട്ടില്ല.
