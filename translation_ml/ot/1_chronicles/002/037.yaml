  text: וְ/זָבָד֙ הוֹלִ֣יד אֶת אֶפְלָ֔ל וְ/אֶפְלָ֖ל הוֹלִ֥יד אֶת עוֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/037.yaml
  text: Zabad fathered Ephlal, and Ephlal fathered Obed.
translation:
  language: ml
  text: സാബാദ് എഫ്ലാലിന്റെ പിതാവായി; എഫ്ലാൽ ഓബേദിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָבָד
  choice: സാബാദ്
  rationale: വ്യക്തിനാമമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തെ പിന്തുടർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ സന്ദർഭത്തിൽ ഹിഫീൽ രൂപം ‘ജനിപ്പിച്ചു/പിതാവായി’ എന്ന പുരുഷവംശപരമായ അർത്ഥം നൽകുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായി വായിക്കാനായി ‘പിതാവായി’ തെരഞ്ഞെടുത്തു.
- source_word: אֶת
  choice: '[വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നം മാത്രമായതിനാൽ മലയാളത്തിൽ സ്വതന്ത്ര പദമായി പ്രതിനിധീകരിക്കേണ്ടതില്ല.
- source_word: אֶפְלָל
  choice: എഫ്ലാൽ
  rationale: വ്യക്തിനാമമായതിനാൽ എബ്രായ രൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ
  choice: ;
  rationale: രണ്ട് സമാന്തര വംശാവലി പ്രസ്താവനകളെ ബന്ധിപ്പിക്കുന്ന ലളിത സംയോജകം. മലയാളത്തിൽ ആവർത്തനഭാരം ഒഴിവാക്കി ബന്ധം വ്യക്തമായി നിലനിർത്താൻ അർധവിരാമം ഉപയോഗിച്ചു.
- source_word: עוֹבֵד
  choice: ഓബേദ്
  rationale: ‘സേവിക്കുക’ എന്ന ധാതുവുമായി ബന്ധമുള്ള വ്യക്തിനാമമാണെങ്കിലും അർത്ഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. പുരാതനഭാവമുള്ള ‘ജനിപ്പിച്ചു’ എന്നതിനുപകരം സ്വാഭാവികമായ ‘പിതാവായി’ ഉപയോഗിച്ചു; പേരുകൾ എബ്രായ സ്രോതസ്സിനെ പിന്തുടർന്ന് ലിപ്യന്തരണം ചെയ്തു.
