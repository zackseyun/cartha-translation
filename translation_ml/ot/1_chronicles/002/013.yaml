source:
  edition: WLC
  text: וְ/אִישַׁ֛י הוֹלִ֥יד אֶת בְּכֹר֖/וֹ אֶת אֱלִיאָ֑ב וַ/אֲבִינָדָב֙ הַ/שֵּׁנִ֔י וְ/שִׁמְעָ֖א הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/013.yaml
  text: And Jesse fathered his firstborn Eliab[a], Abinadab the second, and Shimea the third.
translation:
  language: ml
  text: യിശ്ശായി തന്റെ ആദ്യജാതനായ എലീയാബിനും, രണ്ടാമനായ അബീനാദാബിനും, മൂന്നാമനായ ശിമെയയ്ക്കും[a] പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പാഠത്തിൽ ‘ശിമെയ’; 1 ശമൂവേൽ 16:9-ലെ സമാന്തര പട്ടികയിൽ ‘ശമ്മാ’ എന്നാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישַׁי
  choice: യിശ്ശായി
  rationale: വംശാവലിയിലെ וְ ഒരു ലളിതമായ ബന്ധകമാണ്; മലയാളത്തിൽ വാക്യാരംഭത്തിൽ പ്രത്യേകമായി ‘യും/അപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായി തുടർച്ച സൂചിപ്പിക്കാം. אִישַׁי എന്ന പേര് ‘യിശ്ശായി’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: ילד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വംശാവലിയിൽ ‘പിതാവായി/ജനിപ്പിച്ചു’ എന്ന അർഥം നൽകുന്നു. ‘ജനിപ്പിച്ചു’ പുരുഷവംശപരമ്പരയിലെ കാരണാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֶת בְּכֹרוֹ
  choice: തന്റെ ആദ്യജാതനായ
  rationale: בְּכוֹר എന്നത് ‘ആദ്യജാതൻ’ എന്നാണ്; 3-ാം പുരുഷ ഏകവചന പ്രത്യയം ‘തന്റെ’ എന്നു നൽകി. ‘മകൻ’ മൂലത്തിൽ പ്രകടമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: אֶת אֱלִיאָב
  choice: എലീയാബ്
  rationale: אֶת വിവർത്തനം ചെയ്യേണ്ട കർമസൂചകമാണ്; אֱלִיאָב എന്ന വ്യക്തിനാമം മലയാളത്തിൽ ‘എലീയാബ്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַאֲבִינָדָב הַשֵּׁנִי
  choice: രണ്ടാമനായ അബീനാദാബ്
  rationale: הַשֵּׁנִי എന്ന ക്രമസംഖ്യ പേരോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘രണ്ടാമനായ’ എന്നു നൽകി; וְ പട്ടികയിലെ ബന്ധം ‘-യെയും’ എന്ന കർമപ്രത്യയത്തിലൂടെ പ്രകടമാക്കി.
- source_word: וְשִׁמְעָא הַשְּׁלִישִׁי
  choice: മൂന്നാമനായ ശിമെയ
  rationale: ദിനവൃത്താന്തങ്ങളിലെ שִׁמְעָא എന്ന രൂപം തന്നെ പിന്തുടർന്ന് ‘ശിമെയ’ എന്നു ലിപ്യന്തരിച്ചു; സമാന്തരമായ ശമൂവേൽ പാഠത്തിലെ വ്യത്യസ്ത നാമരൂപം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവന്നിട്ടില്ല. הַשְּׁלִישִׁי ‘മൂന്നാമനായ’ എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം ഉപയോഗിച്ചു. വംശാവലിയുടെ സംക്ഷിപ്ത ഘടനയും ആദ്യജാതൻ/രണ്ടാമൻ/മൂന്നാമൻ എന്ന ക്രമവും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് കരടിൽ അടിക്കുറിപ്പ് ചിഹ്നം എലീയാബിനുശേഷമായിരുന്നെങ്കിലും അടിക്കുറിപ്പ് ശിമെയ എന്ന പേരിനെയാണ് വിശദീകരിക്കുന്നത്; അതിനാൽ ചിഹ്നം ശിമെയയ്ക്കുശേഷം വെച്ചു.
