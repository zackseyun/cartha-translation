lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: അസര്യാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമമായ ‘അസര്യാ’യെ മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾ നാമരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു. തുടക്കത്തിലെ וַ־ സന്ദർഭത്തിലെ വാക്യബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം ‘പിന്നെ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: הֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയിൽ ילד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം പിതൃവംശബന്ധത്തിൽ ‘ജനിപ്പിക്കുക’ എന്നാണ്; സംക്ഷിപ്തവും മാന്യവും മലയാളത്തിൽ പരിചിതവുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: אֶת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഹീബ്രുവിലെ നിർദ്ദിഷ്ട കർമസൂചകത്തിന് മലയാളത്തിൽ സ്വതന്ത്ര പദമില്ല; ‘ഹേലെസിനെ’, ‘എലെയാസായെ’ എന്നീ കർമവിഭക്തിരൂപങ്ങളിലൂടെ അതിന്റെ വ്യാകരണധർമ്മം പ്രകടമാക്കി.
- source_word: חָלֶץ
  choice: ഹേലെസ്
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְחֶלֶץ
  choice: ഹേലെസ്
  rationale: ആവർത്തിക്കുന്ന അതേ വ്യക്തിനാമം ഒരേ രൂപത്തിൽ നിലനിർത്തി. וְ־ സൂചിപ്പിക്കുന്ന തുടർച്ച മലയാളത്തിലെ അർധവിരാമവും വാക്യക്രമവുംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: אֶלְעָשָׂה
  choice: എലെയാസാ
  rationale: ഇവിടത്തെ ഹീബ്രു നാമരൂപത്തെ അടുത്ത് പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം; ലളിതരൂപമായ ‘എലാസാ’ അടിക്കുറിപ്പിൽ നൽകി.
