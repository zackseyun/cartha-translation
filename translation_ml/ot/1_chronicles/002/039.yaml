    issue: «ജനിപ്പിച്ചു» leaves the specifically paternal nuance less explicit than desirable.
    rationale: In this male genealogy, «പിതാവായി» is idiomatic modern Malayalam and directly conveys the Hiphil genealogical meaning, ‘became/fathered.’
