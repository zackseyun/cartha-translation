    issue: The rendering «എലെയാസാ» adds a y/യ element to the name אֶלְעָשָׂה.
    rationale: The Hebrew name is Eleasah, not a form equivalent to Eleyasah/Elieasah. A more source-near Malayalam rendering is «എലെആസാ».
