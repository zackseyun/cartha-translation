  text: וְ/חוּר֙ הוֹלִ֣יד אֶת אוּרִ֔י וְ/אוּרִ֖י הוֹלִ֥יד אֶת בְּצַלְאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/020.yaml
  text: Hur fathered Uri, and Uri fathered Bezalel.
translation:
  language: ml
  text: ഹൂർ ഊരിയെ ജനിപ്പിച്ചു, ഊരി ബെസലേലിനെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּר
  choice: ഹൂർ
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ഹിഫിൽ രൂപം പുരുഷവംശജനനബന്ധം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: אֶת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: സ്വതന്ത്രമായ മലയാള തുല്യപദമില്ലാത്ത പ്രത്യക്ഷ കർമസൂചകം; മലയാളത്തിലെ വിഭക്തിയും വാക്യക്രമവും അതിന്റെ വ്യാകരണധർമ്മം വഹിക്കുന്നു.
- source_word: אוּרִי
  choice: ഊരി
  rationale: വ്യക്തിനാമം; എബ്രായത്തിലെ ദീർഘസ്വരം പ്രതിഫലിപ്പിക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְ
  choice: ;
  rationale: രണ്ട് സമാന്തര വംശാവലി പ്രസ്താവനകളെ ബന്ധിപ്പിക്കുന്ന എബ്രായ സംയോജകം; മലയാളത്തിൽ അർദ്ധവിരാമം ബന്ധവും സ്വാഭാവിക പ്രവാഹവും നിലനിർത്തുന്നു.
- source_word: בְּצַלְאֵל
  choice: ബെസലേൽ
  rationale: വ്യക്തിനാമം; എബ്രായ രൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ആവർത്തിച്ചുള്ള എബ്രായ ഘടന നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക ബന്ധത്തിനായി രണ്ടാമത്തെ സംയോജകം അർദ്ധവിരാമത്തിലൂടെ പ്രകടിപ്പിച്ചു.
