source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֤א חֶצְרוֹן֙ אֶל בַּת מָכִיר֙ אֲבִ֣י גִלְעָ֔ד וְ/ה֣וּא לְקָחָ֔/הּ וְ/ה֖וּא בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת שְׂגֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
translation:
  language: ml
  text: അതിനുശേഷം ഹെസ്രോൻ ഗിലെയാദിന്റെ പിതാവായ[b] മാഖീരിന്റെ മകളുടെ അടുക്കൽ ചെന്നു[a]. അവൻ അറുപതു വയസ്സുള്ളപ്പോൾ അവളെ ഭാര്യയായി സ്വീകരിച്ചു. അവൾ അവന് സെഗൂബിനെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അടുക്കൽ ചെന്നു” എന്ന എബ്രായ മിതഭാഷണം ഇവിടെ ദാമ്പത്യ/ലൈംഗിക സംഗമത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ഗിലെയാദിന്റെ പിതാവ്” എന്നത് വംശാവലിപ്രയോഗത്തിൽ മാഖീർ ഗിലെയാദിന്റെ ഉടനടി പിതാവോ, പൂർവികനോ, ഗിലെയാദിന്റെ സ്ഥാപകനോ ആകാം എന്നർഥം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: അതിനുശേഷം
  rationale: വംശാവലിയിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: בָּא אֶל
  choice: അടുക്കൽ ചെന്നു
  rationale: ഒരു സ്ത്രീയുമായുള്ള ദാമ്പത്യ/ലൈംഗിക സംഗമത്തെ സൂചിപ്പിക്കാവുന്ന എബ്രായ മിതഭാഷണം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: בַּת מָכִיר
  choice: മാഖീരിന്റെ മകൾ
  rationale: എബ്രായ സംയുക്തബന്ധത്തെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֲבִי גִלְעָד
  choice: ഗിലെയാദിന്റെ പിതാവ്
  rationale: אָב എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; വംശാവലിയിൽ പൂർവികൻ അഥവാ സ്ഥാപകൻ എന്ന വിശാല അർഥസാധ്യതയും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לְקָחָהּ
  choice: അവളെ ഭാര്യയായി സ്വീകരിച്ചു
  rationale: സ്ത്രീയെ സംബന്ധിച്ച് לקח സാധാരണയായി വിവാഹത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ വെറും ‘അവളെ എടുത്തു’ എന്ന അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമായ രൂപം ഒഴിവാക്കി സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְהוּא בֶּן שִׁשִּׁים שָׁנָה
  choice: അറുപതു വയസ്സുള്ളപ്പോൾ
  rationale: ‘അറുപതു വർഷങ്ങളുടെ മകൻ’ എന്ന എബ്രായ പ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַתֵּלֶד לוֹ
  choice: അവൾ അവന് ... പ്രസവിച്ചു
  rationale: לוֹ എന്ന ദാതൃസൂചന നിലനിർത്തിക്കൊണ്ട് വംശാവലിക്ക് യോജിച്ച മലയാളവാക്യം നൽകുന്നു.
- source_word: שְׂגוּב
  choice: സെഗൂബ്
  rationale: എബ്രായ നാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: אֲבִי גִלְעָד എന്നതിലെ ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ഗിലെയാദിന്റെ പിതാവ്
  alternative: ഗിലെയാദിന്റെ പൂർവികൻ / ഗിലെയാദിന്റെ സ്ഥാപകൻ
  rationale: വംശാവലിപ്രയോഗത്തിൽ ‘പിതാവ്’ എന്നതിന് ഈ വിശാല അർഥങ്ങൾ ഉണ്ടാകാമെങ്കിലും, മൂലത്തിലെ ബന്ധപദം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തി അർഥസാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വംശാവലി ശൈലി ഉപയോഗിച്ചു. എബ്രായ മിതഭാഷണവും ‘പിതാവ്’ എന്ന പദത്തിന്റെ വംശാവലിസംബന്ധിയായ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
