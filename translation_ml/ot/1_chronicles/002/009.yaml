id: 1CH.2.9
reference: 1 Chronicles 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֥י חֶצְר֖וֹן אֲשֶׁ֣ר נוֹלַד ל֑/וֹ אֶת יְרַחְמְאֵ֥ל וְ/אֶת רָ֖ם וְ/אֶת כְּלוּבָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/009.yaml
  text: 'The sons of Hezron who were born to him: Jerahmeel[a], Ram, and Chelubai.'
translation:
  language: ml
  text: 'ഹെസ്രോന് ജനിച്ച പുത്രന്മാർ: യെരഹ്മെയേൽ, രാം, കെലൂബായി[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വംശാവലിയിൽ മറ്റിടങ്ങളിൽ കാലേബ് എന്നു വിളിക്കപ്പെടുന്ന അതേ വ്യക്തിയായിരിക്കാം കെലൂബായി.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: בְּנֵי എന്ന സംയുക്ത ബഹുവചനം വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ‘പുത്രന്മാർ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി. വാക്യാരംഭത്തിലെ וּ മലയാളത്തിലെ പട്ടികാശൈലിയിൽ പ്രത്യേകം ചേർക്കേണ്ടതില്ല.
- source_word: חֶצְרוֹן
  choice: ഹെസ്രോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: ഹെസ്രോനു ജനിച്ച
  rationale: ילד എന്ന ക്രിയയുടെ നിഫാൽ രൂപവും לוֹ എന്ന പ്രയോഗവും സൂചിപ്പിക്കുന്ന ‘അവനു ജനിച്ച’ എന്ന ആശയം നിലനിർത്തുന്നു. മലയാളത്തിൽ സർവനാമത്തിന്റെ അവ്യക്തത ഒഴിവാക്കാൻ ഹെസ്രോന്റെ പേര് ആവർത്തിച്ചു.
- source_word: אֶת
  choice: —
  rationale: നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന ഈ എബ്രായ പദത്തിന് മലയാളത്തിൽ പ്രത്യേക പരിഭാഷ ആവശ്യമില്ല.
- source_word: יְרַחְמְאֵל
  choice: യെരഹ്മെയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: רָם
  choice: രാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: כְּלוּבָי
  choice: കെലൂബായി
  rationale: ഇവിടെയുള്ള എബ്രായ രൂപം നേരിട്ട് ലിപ്യന്തരിച്ചു; കൂടുതൽ പരിചിതമായ ‘കാലേബ്’ എന്ന പേരുമായി മുഖ്യപാഠത്തിൽ സമന്വയിപ്പിച്ചില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ പേരുകളുടെ ക്രമവും കെലൂബായി എന്ന പ്രത്യേക നാമരൂപവും സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് കരടിൽ [a] അടയാളം യെരഹ്മെയേലിനുശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് കെലൂബായിയെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ അടയാളം കെലൂബായിക്കുശേഷം ചേർത്തു.
