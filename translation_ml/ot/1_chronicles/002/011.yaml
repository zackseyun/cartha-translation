id: 1CH.2.11
reference: 1 Chronicles 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נַחְשׁוֹן֙ הוֹלִ֣יד אֶת שַׂלְמָ֔א וְ/שַׂלְמָ֖א הוֹלִ֥יד אֶת בֹּֽעַז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/011.yaml
  text: Nahshon fathered Salma[a], and Salma fathered Boaz.
translation:
  language: ml
  text: നഹ്ശോൻ സൽമയുടെ[a] പിതാവായി; സൽമ ബോവസിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘സൽമ’; രൂത്ത് 4:20–21; മത്തായി 1:4–5 തുടങ്ങിയ ബന്ധപ്പെട്ട വംശാവലികളുമായി ഒത്താക്കാൻ ചില പരിഭാഷകൾ ‘സൽമോൻ’ എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  choice: നഹ്ശോൻ
  rationale: നַחְשׁוֹן എന്ന എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ സ്വാഭാവികമായി പകർത്തുന്നു; വാക്യാരംഭത്തിലെ וְ മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ילד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘പിതാവാകുക/ജനിപ്പിക്കുക’ എന്നർഥം നൽകുന്നു. ‘പിതാവായി’ എന്നത് പുരുഷവംശപരമ്പരയുടെ അർഥം നിലനിർത്തുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: אֶת
  choice: '[പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: സ്വതന്ത്ര പദാർഥമില്ലാത്ത നേരിട്ടുള്ള കർമസൂചകമാണ്; മലയാള വാക്യഘടനയിൽ പ്രത്യേകം പ്രതിനിധീകരിക്കേണ്ടതില്ല.
- source_word: שַׂלְמָא
  choice: സൽമ
  rationale: ഈ വാക്യത്തിലെ എബ്രായരൂപം שַׂלְמָא ആയതിനാൽ അതിനെ നേരിട്ട് ‘സൽമ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു; ബന്ധപ്പെട്ട മറ്റു വംശാവലികളുമായി ഒത്താക്കുന്ന ‘സൽമോൻ’ എന്ന രൂപം പ്രധാന പാഠത്തിൽ സ്വീകരിക്കുന്നില്ല.
- source_word: וְ/שַׂלְמָא
  choice: സൽമ
  rationale: രണ്ടാം വാക്യഘടകത്തെ മലയാളത്തിൽ അർദ്ധവിരാമംകൊണ്ട് സ്വാഭാവികമായി ബന്ധിപ്പിച്ചതിനാൽ וְ പ്രത്യേകം ‘കൂടാതെ’ എന്ന് നൽകേണ്ടതില്ല; പേര് എബ്രായരൂപത്തിനനുസരിച്ച് ‘സൽമ’ എന്നാണ്.
- source_word: בֹּעַז
  choice: ബോവസ്
  rationale: בֹּעַז എന്ന വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതവും ഉറവിടശബ്ദങ്ങളോട് ചേർന്നതുമായ രൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ വംശാവലി ശൈലി. ‘ജനിപ്പിച്ചു’ എന്നതിനെക്കാൾ ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന ‘പിതാവായി’ സ്വീകരിച്ചു; പേരുകളുടെ ഉറവിടരൂപവും പാഠഭേദസാദ്ധ്യതയും നിലനിർത്തി.
