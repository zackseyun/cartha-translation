lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: בְּנֵי എന്നത് ‘പുത്രന്മാർ’ എന്നർഥമുള്ള construct plural ആണ്; ഇവിടെ നേരിട്ടുള്ള വംശാവലിപ്പട്ടിക അവതരിപ്പിക്കുന്നതിനാൽ ഈ പദം യോജിക്കുന്നു. വാക്യാരംഭത്തിലെ וּ സ്വാഭാവികമായ മലയാള വംശാവലിശൈലിയിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: חֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: קֹרַח
  choice: കോരഹ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം കഴിയുന്നത്ര നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: תַּפּוּחַ
  choice: തപ്പൂഹ്
  rationale: മറ്റു സന്ദർഭങ്ങളിൽ ഈ രൂപം ഒരു പൊതുനാമമായിരിക്കാമെങ്കിലും ഇവിടെ വ്യക്തിനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: רֶקֶם
  choice: രേക്കെം
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ സ്വരവിന്യാസം പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שָׁמַע
  choice: ശേമാ
  rationale: WLC-യിലെ മസോററ്റിക് സ്വരചിഹ്നങ്ങളോടുകൂടിയ שָׁמַע എന്ന വ്യക്തിനാമത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
