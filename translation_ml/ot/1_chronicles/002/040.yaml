translation:
  language: ml
  text: എലെയാസാ സിസ്മായിയുടെ പിതാവായി, സിസ്മായി ശല്ലൂമിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָשָׂה
  choice: എലെയാസാ
  rationale: എബ്രായ വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ഉച്ചരിക്കാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הֹלִיד
  choice: പിതാവായി
  rationale: יַלד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വംശാവലി സന്ദർഭത്തിൽ ‘ജനിപ്പിച്ചു/പിതാവായി’ എന്ന അർഥം നൽകുന്നു. ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായ വംശാവലി പ്രയോഗമായി ‘പിതാവായി’ തിരഞ്ഞെടുത്തു.
- source_word: אֶת
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇത് നിർദിഷ്ട കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നമാണ്; മലയാളത്തിൽ വേറൊരു പദം ആവശ്യമില്ല, വാക്യഘടനയിൽ അതിന്റെ പ്രവർത്തനം പ്രതിഫലിക്കുന്നു.
- source_word: סִסְמָי
  choice: സിസ്മായി
  rationale: എബ്രായ വ്യക്തിനാമം ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളത്തിലേക്ക് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ
  choice: ;
  rationale: രണ്ടു സമാന്തര വംശാവലി പ്രസ്താവനകളെ ബന്ധിപ്പിക്കുന്ന എബ്രായ സംയോജകം മലയാളത്തിൽ അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
- source_word: שַׁלּוּם
  choice: ശല്ലൂം
  rationale: എബ്രായ വ്യക്തിനാമത്തിലെ ദ്വിത്വ ലാമെദിനെയും ദീർഘസ്വരത്തെയും പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. ‘ജനിപ്പിച്ചു’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ പ്രയോഗത്തിനുപകരം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘പിതാവായി’ ഉപയോഗിച്ചു; ആശയം മാറ്റിയിട്ടില്ല.
