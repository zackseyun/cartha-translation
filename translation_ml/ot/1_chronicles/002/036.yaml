  source_fidelity: ഹീബ്രു വംശാവലിവാക്യത്തിലെ രണ്ടു ഹിഫീൽ ക്രിയാപ്രയോഗങ്ങളും (‘ജനിപ്പിച്ചു’) അതിലെ പിതൃവംശബന്ധം സംക്ഷിപ്തമായി കൃത്യമായി അറിയിക്കുന്നു. ആദ്യ നാമത്തോടൊപ്പമുള്ള וְ മുമ്പത്തെ വാക്യവുമായി ബന്ധിപ്പിക്കുന്നതാണ്; മലയാളത്തിൽ ഈ വാക്യം സ്വതന്ത്രമായി തുടങ്ങുന്നതിൽ അർഥനഷ്ടമില്ല. രണ്ടാമത്തെ וְ-യുടെ ബന്ധം അർധവിരാമത്തിലൂടെയും സമാന്തരഘടനയിലൂടെയും വ്യക്തമാണ്.
  naturalness: ‘അത്തായി നാഥാനെ ജനിപ്പിച്ചു; നാഥാൻ സാബാദിനെ ജനിപ്പിച്ചു’ എന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ചുരുക്കമുള്ള വംശാവലിശൈലിയുമാണ്. ആവർത്തിത ക്രിയ ഹീബ്രു ഘടനയോടു യോജിച്ചും വായനയ്ക്ക് തടസ്സമില്ലാതെയും നിലനിൽക്കുന്നു.
  terminology: അത്തായി, നാഥാൻ, സാബാദ് എന്നീ വ്യക്തിനാമലിപ്യന്തരണങ്ങൾ ഉപയോഗയോഗ്യമാണ്. ‘ജനിപ്പിച്ചു’ വംശാവലികളിൽ പുരുഷപൂർവികനെക്കുറിച്ചും പ്രയോഗിക്കാവുന്നതാണ്; ഇവിടെ മാതൃത്വം സൂചിപ്പിക്കുന്ന ഒരു ചേർക്കലുമില്ല.
