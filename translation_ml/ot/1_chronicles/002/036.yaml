source:
  edition: WLC
  text: וְ/עַתַּי֙ הֹלִ֣יד אֶת נָתָ֔ן וְ/נָתָ֖ן הוֹלִ֥יד אֶת זָבָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/036.yaml
  text: Attai fathered Nathan, and Nathan fathered Zabad.
translation:
  language: ml
  text: അത്തായി നാഥാനെ ജനിപ്പിച്ചു; നാഥാൻ സാബാദിനെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַתַּי
  choice: അത്തായി
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ, ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു; ആരംഭത്തിലെ וְ വാക്യബന്ധത്തിന്റെ ഭാഗമായതിനാൽ ഇവിടെ പ്രത്യേകം പദമായി നൽകേണ്ടതില്ല.
- source_word: הֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയിൽ ילד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘ജനിപ്പിക്കുക/പിതാവാകുക’ എന്ന അർഥം നൽകുന്നു. ‘ജനിപ്പിച്ചു’ സംക്ഷിപ്തവും മലയാള വംശാവലി ശൈലിയിൽ സ്വാഭാവികവുമാണ്.
- source_word: אֶת
  choice: '[പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: നിശ്ചിത കർമത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു വ്യാകരണചിഹ്നത്തിന് മലയാളത്തിൽ പ്രത്യേകം സമാനപദമില്ല; സാധാരണ വാക്യഘടനയിലൂടെ അർഥം വ്യക്തമാകുന്നു.
- source_word: נָתָן
  choice: നാഥാൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ദീർഘസ്വരവും അവസാന വ്യഞ്ജനവും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְ/נָתָן
  choice: നാഥാൻ
  rationale: וְ എന്ന ബന്ധകത്തിന്റെ പ്രവർത്തനം മലയാളത്തിലെ അർധവിരാമവും തുടർന്നുള്ള വാക്യഘടനയും സ്വാഭാവികമായി വഹിക്കുന്നു; പേര് ‘നാഥാൻ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: ആദ്യ പ്രയോഗത്തോടും വംശാവലിയുടെ ആവർത്തനഘടനയോടും ഏകീകരണം നിലനിർത്തുന്നു.
- source_word: זָבָד
  choice: സാബാദ്
  rationale: ഹീബ്രു വ്യക്തിനാമമായ זָבָד എന്നതിന്റെ ശബ്ദഘടനയോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
