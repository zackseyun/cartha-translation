translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ഹീബ്രുവിലെ ആവർത്തനഘടന സൂക്ഷിച്ചിരിക്കുന്നു; അനാവശ്യമായ വിശദീകരണമോ മതവിഭാഗപരമായ വ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
