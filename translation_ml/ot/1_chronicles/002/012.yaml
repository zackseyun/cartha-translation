translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ‘ജനിപ്പിച്ചു’ എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യതയ്ക്കുപകരം, പുരുഷവംശപരമ്പരയിലെ ബന്ധം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്ന ‘പിതാവായി’ ഉപയോഗിച്ചു.
