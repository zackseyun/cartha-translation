  source_fidelity: എബ്രായ വംശാവലിസൂത്രമായ הוֹלִיד ('ജനിപ്പിച്ചു/പിതാവായി') രണ്ടിടത്തും പുരുഷവംശബന്ധമായി കൃത്യമായി പ്രതിഫലിക്കുന്നു. ബോവസ്–ഓബേദ്–യിശ്ശായി എന്ന ക്രമവും ബന്ധങ്ങളും ഉറവിടത്തോടും ഇംഗ്ലീഷ് POB ഓഡിറ്റ് പാതയോടും യോജിക്കുന്നു. തുടക്കത്തിലെയും രണ്ടാമത്തെ ഉപവാക്യത്തിലെയും וְ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിലും അർധവിരാമത്തിലുമാണ് പ്രകടമാകുന്നത്; പ്രത്യേകമായ 'അങ്ങനെ'/'പിന്നെ' തുടങ്ങിയ കൂട്ടിച്ചേർക്കൽ ആവശ്യമില്ല.
  naturalness: “ബോവസ് ഓബേദിന്റെ പിതാവായി; ഓബേദ് യിശ്ശായിയുടെ പിതാവായി” ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവും വംശാവലിക്ക് യോജിച്ച ഗൗരവമുള്ളതുമാണ്. അർധവിരാമം സമാന്തരമായ രണ്ടു വംശാവലിവാക്യങ്ങളെ നന്നായി ബന്ധിപ്പിക്കുന്നു.
  terminology: ബോവസ്, ഓബേദ്, യിശ്ശായി എന്നീ പേരുകൾ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതവും എബ്രായ നാമങ്ങളോട് യോജിച്ചവയുമാണ്. “പിതാവായി” എന്ന പ്രയോഗം archaic ആയ “ജനിപ്പിച്ചു” എന്നതിനേക്കാൾ ആധുനികമായി, പുരുഷന്റെ വംശാവലിബന്ധം വ്യക്തമായി നൽകുന്നു.
