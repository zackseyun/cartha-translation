  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בֹ֨עַז֙ הוֹלִ֣יד אֶת עוֹבֵ֔ד וְ/עוֹבֵ֖ד הוֹלִ֥יד אֶת יִשָֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/012.yaml
  text: Boaz fathered Obed, and Obed fathered Jesse.
translation:
  language: ml
  text: ബോവസ് ഓബേദിന്റെ പിതാവായി; ഓബേദ് യിശ്ശായിയുടെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בֹעַז
  choice: ബോവസ്
  rationale: വ്യക്തിനാമം; മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു. തുടക്കത്തിലെ וּ സംയോജകം മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ സന്ദർഭത്തിൽ ഹിഫിൽ രൂപം ഒരാളെ ജനിപ്പിക്കുക അഥവാ അയാളുടെ പിതാവാകുക എന്നർഥം നൽകുന്നു. ‘പിതാവായി’ എന്നത് ആധുനികവും സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: אֶת
  choice: '[പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നം; മലയാളത്തിൽ ഇതിന് വേറൊരു പദം ആവശ്യമില്ല.
- source_word: עוֹבֵד
  choice: ഓബേദ്
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ പരിചിതമായ ബൈബിൾരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ/עוֹבֵד
  choice: ഓബേദ്
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു; וְ സൂചിപ്പിക്കുന്ന തുടർച്ച മലയാളത്തിൽ അർധവിരാമവും അടുത്ത ഉപവാക്യവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: ആവർത്തിക്കുന്ന വംശാവലിക്രിയയെ ആദ്യ പ്രയോഗത്തോടു സ്ഥിരത പുലർത്തി പരിഭാഷപ്പെടുത്തി.
- source_word: יִשָׁי
  choice: യിശ്ശായി
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതവുമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
