  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/רָ֖ם הוֹלִ֣יד אֶת עַמִּינָדָ֑ב וְ/עַמִּינָדָב֙ הוֹלִ֣יד אֶת נַחְשׁ֔וֹן נְשִׂ֖יא בְּנֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/010.yaml
  text: Ram fathered Amminadab[a], and Amminadab fathered Nahshon, leader of the sons of Judah.
translation:
  language: ml
  text: രാം അമ്മീനാദാബിന്റെ പിതാവായി; അമ്മീനാദാബ് നഹശോന്റെ പിതാവായി. നഹശോൻ യെഹൂദയുടെ പുത്രന്മാരുടെ നേതാവായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെഹൂദയുടെ പുത്രന്മാരുടെ പ്രമാണി’ എന്നോ ‘യെഹൂദയുടെ പുത്രന്മാരുടെ തലവൻ’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ഹിഫീൽ രൂപം ഒരാൾ മറ്റൊരാളെ ജനിപ്പിച്ച് അവന്റെ പിതാവായി എന്ന അർഥം നൽകുന്നു. ‘പിതാവായി’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും പുരുഷവംശപരമായ അർഥം വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്.
- source_word: נְשִׂיא
  choice: നേതാവ്
  rationale: ഈ പദത്തിന് നേതാവ്, പ്രമാണി, തലവൻ എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ യെഹൂദാഗോത്രത്തിനിടയിലെ നഹശോന്റെ അംഗീകൃത സ്ഥാനമാണ് സൂചിപ്പിക്കുന്നത്; രാജകീയമായ തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് ‘നേതാവ്’ അത് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בְּנֵי יְהוּדָה
  choice: യെഹൂദയുടെ പുത്രന്മാർ
  rationale: എബ്രായപാഠത്തിലെ ‘യെഹൂദയുടെ പുത്രന്മാർ’ എന്ന വംശപരവും ഗോത്രപരവുമായ പ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: רָם / עַמִּינָדָב / נַחְשׁוֹן
  choice: രാം / അമ്മീനാദാബ് / നഹശോൻ
  rationale: വ്യക്തിനാമങ്ങൾ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന എബ്രായ ക്രിയ മലയാളത്തിൽ ‘പിതാവായി’ എന്നു നിലനിർത്തി; അവസാന സ്ഥാനവിവരണം വ്യക്തതയ്ക്കായി സ്വതന്ത്ര വാക്യമായി നൽകി.
