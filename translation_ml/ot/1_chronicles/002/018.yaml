  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָלֵ֣ב בֶּן חֶצְר֗וֹן הוֹלִ֛יד אֶת עֲזוּבָ֥ה אִשָּׁ֖ה וְ/אֶת יְרִיע֑וֹת וְ/אֵ֣לֶּה בָנֶ֔י/הָ יֵ֥שֶׁר וְ/שׁוֹבָ֖ב וְ/אַרְדּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
translation:
  language: ml
  text: 'ഹെസ്രോന്റെ മകനായ കാലേബിന് അസൂബയായ തന്റെ ഭാര്യയിൽനിന്നും[a] യെരിയോത്തിൽനിന്നും മക്കളുണ്ടായി. അവളുടെ പുത്രന്മാർ[b] ഇവർ: യേശെർ, ശോബാബ്, അർദോൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ വാക്യഘടന ദുഷ്കരമാണ്. ‘യെരിയോത്ത്’ കാലേബുമായി ബന്ധപ്പെട്ട രണ്ടാമത്തെ സ്ത്രീയായി മനസ്സിലാക്കാം; അല്ലെങ്കിൽ ചില വ്യാഖ്യാനങ്ങളിൽ ആ പേര് അസൂബയോടു സമാനാധികരണത്തിൽ ബന്ധിപ്പിക്കപ്പെടുന്നു.
    reason: alternative_reading
  - marker: b
    text: 'എബ്രായത്തിൽ: ‘അവളുടെ പുത്രന്മാർ.’ വംശാവലി ചിലർ വ്യത്യസ്തമായി മനസ്സിലാക്കുന്നുണ്ടെങ്കിലും മസോററ്റിക് പാഠത്തിൽ ഇവിടെ സ്ത്രീലിംഗ ഏകവചനപ്രത്യയമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: മക്കളെ ജനിപ്പിച്ചു
  rationale: ילד എന്ന ധാതുവിന്റെ ഹിഫ്ഈൽ രൂപം വംശാവലിയിൽ ‘മക്കളെ ജനിപ്പിക്കുക/പിതാവാകുക’ എന്ന അർഥം നൽകുന്നു. തുടർന്ന് സ്ത്രീകളുടെ പേരുകൾ വരുന്നതിനാൽ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: אֶת עֲזוּבָה אִשָּׁה וְאֶת יְרִיעוֹת
  choice: തന്റെ ഭാര്യ അസൂബയിൽനിന്നും യെരീയോത്തിൽനിന്നും
  rationale: എബ്രായ ഘടന ചുരുക്കമുള്ളതും ദുഷ്കരവുമാണ്. אִשָּׁה എന്നത് അസൂബയോടു സമാനാധികരണമായി ‘ഭാര്യ’ എന്നു മനസ്സിലാക്കുകയും യെരീയോത്തിനെ മറ്റൊരു സ്ത്രീയായി ഏകോപിപ്പിക്കുകയും ചെയ്യുന്ന വായനയാണ് മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നത്; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אִשָּׁה
  choice: തന്റെ ഭാര്യ
  rationale: പ്രത്യയമായി ഉടമസ്ഥസൂചന ഇല്ലെങ്കിലും വംശാവലി സന്ദർഭത്തിൽ ‘ഭാര്യ’ എന്നതാണ് സ്വാഭാവിക അർഥം; മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘തന്റെ’ ചേർത്തു.
- source_word: יְרִיעוֹת
  choice: യെരീയോത്ത്
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: וְאֵלֶּה בָנֶיהָ
  choice: അവളുടെ പുത്രന്മാർ ഇവർ
  rationale: בָנֶיהָ എന്നതിലെ പ്രത്യയം സ്ത്രീലിംഗ ഏകവചനമാണ്; അതിനാൽ വംശാവലിയെ അനുമാനിച്ച് തിരുത്താതെ ‘അവളുടെ’ എന്നു നിലനിർത്തി.
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  choice: യേശെർ, ശോബാബ്, അർദോൻ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: വാക്യത്തിൽ പറയുന്ന സ്ത്രീകളെയും പുത്രന്മാരെയും സംബന്ധിച്ച വംശാവലിപരമായ അനിശ്ചിതത്വം
  choice: കാലേബ് തന്റെ ഭാര്യ അസൂബയിൽനിന്നും യെരീയോത്തിൽനിന്നും മക്കളെ ജനിപ്പിച്ചു; തുടർന്ന് മസോററ്റിക് പാഠത്തിലെ സ്ത്രീലിംഗ ഏകവചനപ്രത്യയമനുസരിച്ച് ‘അവളുടെ പുത്രന്മാർ’ എന്നു നൽകി.
  alternative: യെരീയോത്ത് അസൂബയുടെ മറ്റൊരു പേരോ അവളോടു സമാനാധികരണത്തിലുള്ള പരാമർശമോ ആയിരിക്കാം; ചില പുനർനിർമാണങ്ങളിൽ പുത്രന്മാരുടെ ബന്ധം വേറിട്ടു ഗ്രഹിക്കുന്നു.
  rationale: ഇത് പ്രധാനമായും പാഠഘടനയുടെയും വ്യാകരണത്തിന്റെയും പ്രശ്നമാണ്. മസോററ്റിക് രൂപം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുമ്പോഴും സാധുവായ വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സൂചിപ്പിച്ച് അനിശ്ചിതത്വം അതിരുകടന്ന് പരിഹരിക്കുന്നത് ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. വംശാവലി ശൈലിയുടെ സംക്ഷിപ്തത നിലനിർത്തി; എബ്രായത്തിലെ യഥാർഥ വ്യാകരണ-വംശാവലി അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
