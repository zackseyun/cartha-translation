id: 1CH.2.22
reference: 1 Chronicles 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׂג֖וּב הוֹלִ֣יד אֶת יָאִ֑יר וַֽ/יְהִי ל֗/וֹ עֶשְׂרִ֤ים וְ/שָׁלוֹשׁ֙ עָרִ֔ים בְּ/אֶ֖רֶץ הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/022.yaml
  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: ml
  text: സെഗൂബ് യായീറിന്റെ പിതാവായി; ഗിലെയാദ് ദേശത്ത് അവന് ഇരുപത്തിമൂന്ന് പട്ടണങ്ങൾ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂגוּב
  choice: സെഗൂബ്
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ പകർത്തി; വാക്യാരംഭത്തിലെ സംയോജകത്തിന് മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിൽ പ്രത്യേകമായ ‘യും’ ആവശ്യമില്ല.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിസന്ദർഭത്തിൽ ילד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘ജനിപ്പിക്കുക/പിതാവാകുക’ എന്നാണ്. ‘പിതാവായി’ എന്നത് അർത്ഥം കാത്തുസൂക്ഷിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: יָאִיר
  choice: യായീർ
  rationale: വ്യക്തിനാമം എബ്രായത്തിലെ ദീർഘസ്വരവും വ്യഞ്ജനക്രമവും പ്രതിഫലിപ്പിക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ പകർത്തി.
- source_word: וַיְהִי לוֹ
  choice: അവന് … ഉണ്ടായിരുന്നു
  rationale: היה + ל എന്ന എബ്രായ സ്വത്തുബന്ധപ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിലെ ‘അവന് ഉണ്ടായിരുന്നു’ എന്ന ഘടനയിൽ നൽകി.
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  choice: ഇരുപത്തിമൂന്ന്
  rationale: എബ്രായ സംഖ്യ ആധുനിക മലയാളത്തിലെ സാധാരണ സംയുക്തസംഖ്യാരൂപത്തിൽ നൽകി.
- source_word: עָרִים
  choice: പട്ടണങ്ങൾ
  rationale: עִיר എന്ന പദത്തിന് നഗരം അല്ലെങ്കിൽ പട്ടണം എന്നർത്ഥമാകാം. പുരാതന ഗിലെയാദിലെ കുടിയിരുപ്പുകളെ സൂചിപ്പിക്കുന്ന ഇവിടെ ‘പട്ടണങ്ങൾ’ എന്നത് പരിധി അമിതമായി നിർണ്ണയിക്കാതെ സ്വാഭാവികമായി അർത്ഥം നൽകുന്നു.
- source_word: בְּאֶרֶץ הַגִּלְעָד
  choice: ഗിലെയാദ് ദേശത്ത്
  rationale: אֶרֶץ എന്ന പദത്തിന്റെ ഭൂവിഭാഗസൂചന നിലനിർത്തിക്കൊണ്ട് മുഴുവൻ പ്രയോഗവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. ‘ജനിപ്പിച്ചു’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ ‘പിതാവായി’ സ്വീകരിച്ചു. ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം ‘അവന് … ഉണ്ടായിരുന്നു’ എന്നു നേരിട്ട് നൽകി. അവ്യക്തമായ സർവനാമം മൂലപാഠത്തിലുള്ളതുപോലെ നിലനിർത്തി; സമീപസ്ഥനായ യായീറിനെയാണ് സാധാരണയായി സൂചിപ്പിക്കുന്നത്.
