lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: בְנֵי എന്നത് വംശാവലികളിൽ പതിവായി വരുന്ന ബഹുവചന സംയുക്തരൂപമായതിനാൽ ‘പുത്രന്മാർ’ എന്നു നിലനിർത്തി. തുടക്കത്തിലെ וּ പട്ടികയിലെ മുൻവാക്യത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നതാണെങ്കിലും, സ്വാഭാവികമായ മലയാള വംശാവലിശൈലിയിൽ പ്രത്യേകമായി ‘കൂടാതെ/പിന്നെ’ എന്നു ചേർക്കാതെ ആ ബന്ധം ക്രമത്തിലൂടെ വ്യക്തമാകുന്നു.
- source_word: אֵיתָן
  choice: ഏഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: עֲזַרְיָה
  choice: അസര്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപ്രയോഗത്തിന് യോജിച്ച ലിപ്യന്തരണം. ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്നതിന് പിന്നാലെ ഒരേയൊരു പേര് മാത്രമുള്ള മൂലപാഠത്തിലെ അസമത്വം തിരുത്താതെ നിലനിർത്തി.
