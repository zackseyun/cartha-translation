source:
  edition: WLC
  text: וַ/יִּקַּ֣ח גְּשֽׁוּר וַ֠/אֲרָם אֶת חַוֺּ֨ת יָאִ֧יר מֵ/אִתָּ֛/ם אֶת קְנָ֥ת וְ/אֶת בְּנֹתֶ֖י/הָ שִׁשִּׁ֣ים עִ֑יר כָּל אֵ֕לֶּה בְּנֵ֖י מָכִ֥יר אֲבִי גִלְעָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
translation:
  language: ml
  text: എന്നാൽ ഗെശൂരും അരാമും യായീരിന്റെ ഗ്രാമങ്ങൾ[a] അവരിൽനിന്ന് കൈവശമാക്കി; കെനാത്തും അതിന്റെ ആശ്രിതപട്ടണങ്ങളും[b] ചേർത്ത് ആകെ അറുപത് പട്ടണങ്ങൾ. ഇവയെല്ലാം ഗിലെയാദിന്റെ പിതാവായ മാഖീരിന്റെ പുത്രന്മാരായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഹവ്വോത്ത്-യായീർ”; “യായീരിന്റെ കൂടാരഗ്രാമങ്ങൾ” എന്നർഥമുള്ള സ്ഥലനാമം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “അതിന്റെ പുത്രിമാർ”; കെനാത്തിനെ ആശ്രയിച്ചിരുന്ന ചുറ്റുപാടിലെ കുടിയിരുപ്പുകളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: “മാഖീരിന്റെ പുത്രന്മാർ” എന്നത് നേരിട്ടുള്ള പുത്രന്മാരെ മാത്രമല്ല, സന്തതികളെയോ കുലാംഗങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: പിടിച്ചെടുത്തു
  rationale: ഭൂപ്രദേശങ്ങൾ മറ്റൊരാളുടെ നിയന്ത്രണത്തിൽനിന്ന് കൈവശപ്പെടുത്തുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു; സൈനികവിശദാംശം അനാവശ്യമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: גְּשׁוּר וַאֲרָם
  choice: ഗെശൂരും അരാമും
  rationale: എബ്രായ സ്ഥലനാമങ്ങളെ ആധുനിക മലയാള ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു; 'അരാം' എന്ന മൂലരൂപം സൂക്ഷിക്കുന്നു.
- source_word: חַוֺּת יָאִיר
  choice: യായീരിന്റെ ഗ്രാമങ്ങൾ
  rationale: സ്ഥലനാമത്തിന്റെ സുതാര്യമായ പദാർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; ലിപ്യന്തരണരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מֵאִתָּם
  choice: അവരിൽനിന്ന്
  rationale: മുമ്പ് പരാമർശിച്ച മാഖീര്യരുടെ കൈവശത്തിൽനിന്ന് എടുത്തതെന്ന ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: קְנָת
  choice: കെനാത്ത്
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בְּנֹתֶיהָ
  choice: അതിന്റെ ഉപനഗരങ്ങൾ
  rationale: അക്ഷരാർഥമായ 'പുത്രിമാർ' എന്ന രൂപകത്തെ ആശ്രിത കുടിയിരുപ്പുകൾ എന്ന അർഥത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: שִׁשִּׁים עִיר
  choice: ആകെ അറുപത് പട്ടണങ്ങൾ
  rationale: കെനാത്തും അനുബന്ധ കുടിയിരുപ്പുകളും ചേർന്ന മൊത്തസംഖ്യയെന്ന വാക്യബന്ധം വ്യക്തമാക്കുന്നു; עִיר എന്നത് സന്ദർഭോചിതമായി 'പട്ടണങ്ങൾ' എന്നു നൽകുന്നു.
- source_word: כָּל אֵלֶּה
  choice: ഇവരെല്ലാം
  rationale: തുടർന്നുള്ള വംശാവലി പ്രസ്താവനയോടു പൊരുത്തപ്പെടാൻ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന രൂപം ഉപയോഗിക്കുന്നു; എങ്കിലും എബ്രായത്തിലെ സൂചകം സ്വതവേ ലിംഗനിർണ്ണയമില്ലാത്തതാണ്.
- source_word: בְּנֵי מָכִיר
  choice: മാഖീരിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള വംശാവലി പ്രയോഗം നിലനിർത്തുന്നു; ഇത് അടുത്ത തലമുറയിലെ പുത്രന്മാർ മാത്രമല്ല, സന്തതികളെയോ കുലാംഗങ്ങളെയോ സൂചിപ്പിക്കാമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲבִי גִלְעָד
  choice: ഗിലെയാദിന്റെ പിതാവായ
  rationale: എബ്രായത്തിലെ 'പിതാവ്' എന്ന ബന്ധപദം സംരക്ഷിക്കുന്നു; ഈ സന്ദർഭത്തിൽ ഗിലെയാദ് വ്യക്തിനാമമാണ്.
theological_decisions:
- issue: כָּל אֵלֶּה בְּנֵי מָכִיר എന്നതിന്റെ സൂചിതബന്ധം
  choice: ഇവരെല്ലാം ... മാഖീരിന്റെ പുത്രന്മാരായിരുന്നു
  alternative: ഈ സ്ഥലങ്ങളെല്ലാം മാഖീരിന്റെ പുത്രന്മാർക്കുള്ളവയായിരുന്നു
  rationale: മസോററ്റിക് പാഠം അക്ഷരാർഥത്തിൽ വംശാവലി നാമവാക്യത്തെ അനുകൂലിക്കുന്നു. സ്ഥലങ്ങളുടെ ഉടമസ്ഥതയായി മാറ്റുന്നത് സാദ്ധ്യമായ സന്ദർഭവ്യാഖ്യാനമാണെങ്കിലും മൂലത്തിലെ യഥാർഥ അസ്വാഭാവികതയും അർഥപിരിമുറുക്കവും മായ്ച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സ്ഥലനാമങ്ങൾ എബ്രായരൂപത്തോട് ചേർന്ന ലിപ്യന്തരണത്തിൽ നൽകി. വാക്യത്തിന്റെ അവസാനഭാഗത്തെ എബ്രായ അസ്വാഭാവികത വ്യാഖ്യാനിച്ച് ഉടമസ്ഥതാവാക്യമാക്കി മാറ്റാതെ, വംശാവലി രൂപത്തിൽ നിലനിർത്തി.
