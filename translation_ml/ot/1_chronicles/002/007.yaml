id: 1CH.2.7
reference: 1 Chronicles 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֖י כַּרְמִ֑י עָכָר֙ עוֹכֵ֣ר יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מָעַ֖ל בַּ/חֵֽרֶם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
translation:
  language: ml
  text: 'കാർമിയുടെ പുത്രന്മാർ: ആഖാർ[a]—ഇസ്രായേലിനെ കഷ്ടപ്പെടുത്തുന്നവൻ; നാശത്തിനായി സമർപ്പിക്കപ്പെട്ട വസ്തുക്കളുടെ കാര്യത്തിൽ വിശ്വാസവഞ്ചന ചെയ്തവൻ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യോശുവ 7-ൽ ഈ വ്യക്തിയുടെ പേര് ‘ആഖാൻ’ എന്നാണ്. ഇവിടെ ദിനവൃത്താന്തഗ്രന്ഥം ‘ആഖാർ’ എന്ന രൂപമാണ് ഉപയോഗിക്കുന്നത്; ഇത് തുടർന്നുള്ള ‘കഷ്ടപ്പെടുത്തുന്നവൻ’ എന്ന എബ്രായപ്രയോഗത്തോടുള്ള വാക്കുകളിയായിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ ഏകവചനത്തിൽ ‘നാശത്തിനായി സമർപ്പിക്കപ്പെട്ട വസ്തു’ എന്നാണ്. ദൈവിക വിലക്കിൻകീഴിൽ നാശത്തിനായി മാറ്റിവെച്ചതിനെ ഈ പദം സൂചിപ്പിക്കുന്നു; ഇവിടെ അതിന് കൂട്ടായ അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയിൽ ഉപയോഗിച്ചിരിക്കുന്ന בֵּן എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപം നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘പുത്രന്മാർ’ ഈ വംശാവലിപ്രയോഗത്തിന് കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: כַּרְמִי
  choice: കാർമി
  rationale: മസോററ്റിക് സ്വരീകരണമായ כַּרְמִיയെ പിന്തുടർന്ന് വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: עָכָר
  choice: ആഖാർ
  rationale: യോശുവ 7-ലെ പരിചിതമായ עָכָן എന്ന രൂപവുമായി ഏകീകരിക്കാതെ, ദിനവൃത്താന്തത്തിലെ യഥാർഥ രൂപമായ עָכָר നിലനിർത്തുന്നു.
- source_word: עוֹכֵר יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ കഷ്ടത്തിലാക്കിയവൻ
  rationale: Qal കർത്തൃവാചകത്തെ ആഖാറിനെ വിശദീകരിക്കുന്ന പ്രയോഗമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. മൂലത്തിലെ עָכָר–עוֹכֵר ശബ്ദകളി മലയാളത്തിൽ പൂർണമായി പുനരാവിഷ്കരിക്കാനാകാത്തതിനാൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מָעַל
  choice: അവിശ്വസ്തത കാണിച്ചു
  rationale: വിശുദ്ധമായി വേർതിരിക്കപ്പെട്ടതിനെ സംബന്ധിച്ച വിശ്വാസവഞ്ചനയും അതിക്രമവും സൂചിപ്പിക്കുന്ന מעל എന്ന ക്രിയയുടെ ധാർമിക-ഉടമ്പടിപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: בַּחֵרֶם
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ട വസ്തുക്കളുടെ കാര്യത്തിൽ
  rationale: חֵרֶם എന്ന ഏകവചന സംജ്ഞ ഇവിടെ കൂട്ടായ അർഥത്തിൽ, ദൈവിക വിലക്കിൻകീഴിൽ നാശത്തിനായി മാറ്റിവെച്ച വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു. അപരിചിതമായ സാങ്കേതിക പദത്തിനു പകരം അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: חֵרֶם എന്ന പദത്തിലെ സമർപ്പണം, വിലക്ക്, നാശം എന്നീ സംയുക്ത ആശയങ്ങൾ
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ട വസ്തുക്കൾ
  alternative: വിലക്കപ്പെട്ട വസ്തുക്കൾ; സമർപ്പിക്കപ്പെട്ട വസ്തു
  rationale: ഇവിടെ വസ്തുക്കൾ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടവ മാത്രമല്ല, നാശത്തിനായി വിധിക്കപ്പെട്ടവയുമാണ്. പ്രധാന പാഠം ഈ രണ്ടു ഘടകങ്ങളും നിലനിർത്തുന്നു; ‘വസ്തുക്കൾ’ എന്ന ബഹുവചനം സന്ദർഭത്തിലെ കൂട്ടായ അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. പരിചിതമായ യോശുവാപാഠവുമായി പേര് ഏകീകരിക്കാതെ ദിനവൃത്താന്തത്തിലെ രൂപം സംരക്ഷിച്ചു. മൂലത്തിലെ വാക്കുകളി മലയാളത്തിൽ നിർബന്ധിച്ച് സൃഷ്ടിക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
