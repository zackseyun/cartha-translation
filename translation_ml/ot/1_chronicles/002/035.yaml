id: 1CH.2.35
reference: 1 Chronicles 2:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן שֵׁשָׁ֧ן אֶת בִּתּ֛/וֹ לְ/יַרְחָ֥ע עַבְדּ֖/וֹ לְ/אִשָּׁ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת עַתָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/035.yaml
  text: Sheshan gave his daughter to Jarha his servant as a wife[a], and she bore Attai to him.
translation:
  language: ml
  text: ശേശാൻ തന്റെ മകളെ തന്റെ അടിമയായ യർഹായ്ക്ക് ഭാര്യയായി കൊടുത്തു[a]. അവൾ അവന് അത്തായിയെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തന്റെ ദാസനായ യർഹായ്ക്ക്.’ എബ്രായ പദമായ עֶבֶד ഒരു ദാസനെയോ സേവകനെയോ അടിമയെയോ സൂചിപ്പിക്കാം; ശേശാന്റെ ഭവനത്തിൽ യർഹായ്ക്കുണ്ടായിരുന്ന ആശ്രിതനില ഈ വിവരണത്തിൽ സാമൂഹികമായി പ്രസക്തമാണെന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘അടിമ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കൊടുക്കുക’ എന്നാണ്; വിവാഹസന്ദർഭം ‘ഭാര്യയായി’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: שֵׁשָׁן
  choice: ശേശാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בִּתּוֹ
  choice: തന്റെ മകളെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ ‘മകൾ’ എന്ന ബന്ധപദം; മലയാളത്തിൽ കർത്താവിലേക്കുള്ള തിരിച്ചുചൂണ്ടൽ സ്വാഭാവികമാക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: לְיַרְחָע
  choice: യർഹായ്ക്ക്
  rationale: לְ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; יַרְחָע എന്ന വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עַבְדּוֹ
  choice: തന്റെ അടിമയായ
  rationale: עֶבֶד എന്നത് ‘ദാസൻ/സേവകൻ’ എന്നും ‘അടിമ’ എന്നും അർഥമാക്കാം. ശേശാന്റെ കുടുംബാശ്രിതനെന്ന യർഹായുടെ സാമൂഹികനില ഈ വംശാവലിയിൽ പ്രസക്തമായതിനാൽ ‘അടിമ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; അർഥവൈകല്യം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹബന്ധത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: וַתֵּלֶד
  choice: അവൾ … പ്രസവിച്ചു
  rationale: സ്ത്രീ കർത്താവോടുകൂടിയ Qal രൂപം ‘പ്രസവിച്ചു’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ കർത്താവ് തുറന്നുപറയുന്നത് വ്യക്തതയ്ക്കു സഹായിക്കുന്നു.
- source_word: לוֹ
  choice: അവന്
  rationale: לְ സഹിതമുള്ള സർവനാമപ്രത്യയം ജനനവാക്യത്തിൽ പിതൃബന്ധം സൂചിപ്പിക്കുന്നു; ‘അവന്’ എബ്രായ ഘടനയും അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עַתָּי
  choice: അത്തായിയെ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ക്രിയയുടെ കർമമായി ‘-യെ’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വംശാവലി ശൈലി. എബ്രായ വാക്യത്തിന്റെ സംക്ഷിപ്തതയും വിവാഹ-ജനന ക്രമവും നിലനിർത്തിയിരിക്കുന്നു; עֶבֶד എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
