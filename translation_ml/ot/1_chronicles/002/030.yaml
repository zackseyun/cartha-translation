  yaml_path: translation/ot/1_chronicles/002/030.yaml
  text: 'The sons of Nadab: Seled and Appaim[a]. Seled died without sons.'
translation:
  language: ml
  text: 'നാദാബിന്റെ പുത്രന്മാർ: സേലെദും അപ്പയീമും. സേലെദ് പുത്രന്മാരില്ലാതെ മരിച്ചു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സേലെദ് മരിച്ചു; അവനു പുത്രന്മാർ ഉണ്ടായിരുന്നില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ ബഹുവചന നിർമിതരൂപമാണിത്; വംശാവലിപ്പട്ടികയുടെ സ്വാഭാവിക മലയാളശൈലിയിൽ ബന്ധം ‘നാദാബിന്റെ പുത്രന്മാർ’ എന്നു വ്യക്തമാക്കുന്നു. തുടക്കത്തിലെ וּ വേർതിരിച്ച് ‘കൂടാതെ’ എന്നു നൽകേണ്ട ആവശ്യമില്ല.
- source_word: נָדָב
  choice: നാദാബ്
  rationale: വ്യക്തിനാമം; മലയാള ബൈബിൾനാമങ്ങളുടെ പരിചിതമായ ലിപ്യന്തരണരീതി പിന്തുടരുന്നു.
- source_word: סֶלֶד
  choice: സേലെദ്
  rationale: വ്യക്തിനാമം; രണ്ടു പ്രാവശ്യവും ഒരേ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: וְאַפָּיִם
  choice: അപ്പയീമും
  rationale: സന്ദർഭത്തിൽ ഇത് വ്യക്തിനാമമാണ്; സാധാരണ നാമത്തിന്റെ അർത്ഥത്തിൽ വിവർത്തനം ചെയ്യാതെ, ചേർക്കൽസൂചകമായ וְ-നെ മലയാളത്തിലെ ‘-ഉം’ കൊണ്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מוּת എന്ന ക്രിയയുടെ സംഭവക്രമസൂചക രൂപം; മലയാളത്തിൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമായി അർത്ഥം നൽകുന്നു.
- source_word: לֹא בָנִים
  choice: പുത്രന്മാരില്ലാതെ
  rationale: അക്ഷരാർഥത്തിൽ ‘പുത്രന്മാർ ഇല്ല’ എന്നാണ്. ഇവിടെ בָּנִים എന്നത് പ്രത്യേകിച്ച് പുത്രന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മക്കളില്ലാതെ’ എന്ന വിശാലമായ പദം ഒഴിവാക്കുന്നു.
