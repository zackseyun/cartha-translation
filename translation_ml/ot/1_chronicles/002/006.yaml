id: 1CH.2.6
reference: 1 Chronicles 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֣י זֶ֗רַח זִ֠מְרִי וְ/אֵיתָ֧ן וְ/הֵימָ֛ן וְ/כַלְכֹּ֥ל וָ/דָ֖רַע כֻּלָּ֥/ם חֲמִשָּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/006.yaml
  text: 'And the sons of Zerah: Zimri[a], Ethan, Heman, Kalkol[b], and Dara—five in all.'
translation:
  language: ml
  text: 'സേരഹിന്റെ പുത്രന്മാർ: സിമ്രി, ഏഥാൻ, ഹേമാൻ, കൽക്കോൽ, ദാര[a]—ആകെ അഞ്ചുപേർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘ദാര’; 1 രാജാക്കന്മാർ 4:31-ലെ സമാന്തരഭാഗത്ത് ‘ദാർദാ’ എന്നാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי זֶרַח
  choice: സേരഹിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പട്ടികാശൈലിയിൽ בְּנֵי എന്നതിന്റെ കൃത്യവും സ്വാഭാവികവുമായ പരിഭാഷ ‘പുത്രന്മാർ’ എന്നാണ്. വാക്യാരംഭത്തിലെ ו പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാളത്തിൽ മുൻവാക്യവുമായി ബന്ധമില്ലാതെ ‘കൂടാതെ’ ചേർക്കുന്നത് അസ്വാഭാവികമായതിനാൽ വിരാമചിഹ്നഘടനയിലൂടെ തുടർച്ച നിലനിർത്തി.
- source_word: זִמְרִי
  choice: സിമ്രി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְאֵיתָן
  choice: ഏഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ഉച്ചാരണസൗകര്യത്തോടെ ലിപ്യന്തരിച്ചു.
- source_word: וְהֵימָן
  choice: ഹേമാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְכַלְכֹּל
  choice: കൽക്കോൽ
  rationale: എബ്രായ വ്യഞ്ജനഘടനയും സ്വരരൂപവും അടുത്തായി പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: וָדָרַע
  choice: ദാര
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് പാഠം ദാര എന്ന രൂപത്തെയാണ് പിന്തുണയ്ക്കുന്നത്; സമാന്തരവാക്യത്തിലെ ദാർദാ എന്ന രൂപവുമായി സമന്വയിപ്പിച്ചിട്ടില്ല.
- source_word: כֻּלָּם חֲמִשָּׁה
  choice: ആകെ അഞ്ചുപേർ
  rationale: ‘അവരെല്ലാവരും അഞ്ചുപേർ’ എന്ന അക്ഷരാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. പേരുകൾ മൂല എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോട് പൊരുത്തപ്പെടുന്നു.
