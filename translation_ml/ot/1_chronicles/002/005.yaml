base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/005.yaml
  text: 'The sons of Perez: Hezron and Hamul.'
translation:
  language: ml
  text: 'പേരെസിന്റെ പുത്രന്മാർ: ഹെസ്രോനും ഹാമൂലും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: ഇത് בֵּן എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപമാണ്. വംശാവലിസന്ദർഭങ്ങളിൽ ചിലപ്പോൾ ‘സന്തതികൾ’ എന്ന വിശാലമായ അർഥം ഉണ്ടാകാമെങ്കിലും, ഇവിടെ പേരെസിന്റെ നേരിട്ടുള്ള രണ്ടു പുത്രന്മാരെയാണ് പട്ടികപ്പെടുത്തുന്നത്; അതിനാൽ ‘പുത്രന്മാർ’ യോജിക്കുന്നു.
- source_word: פֶרֶץ
  choice: പേരെസ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: חֶצְרוֹן
  choice: ഹെസ്രോൻ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദസാമീപ്യത്തോടെ നൽകിയിരിക്കുന്നു.
- source_word: וְחָמוּל
  choice: ഹാമൂലും
  rationale: וְ എന്ന ബന്ധകത്തെ മലയാളത്തിലെ ചേർക്കൽപ്രത്യയമായ ‘-ഉം’ കൊണ്ട് നൽകി; חָמוּל എന്ന വ്യക്തിനാമം ‘ഹാമൂൽ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ ചുരുങ്ങിയ വംശാവലിവാക്യത്തിന്റെ ഘടനയും പേരുകളുടെ വ്യക്തതയും നിലനിർത്തി.
