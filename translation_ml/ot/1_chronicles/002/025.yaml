id: 1CH.2.25
reference: 1 Chronicles 2:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּהְי֧וּ בְנֵי יְרַחְמְאֵ֛ל בְּכ֥וֹר חֶצְר֖וֹן הַ/בְּכ֣וֹר רָ֑ם וּ/בוּנָ֥ה וָ/אֹ֛רֶן וָ/אֹ֖צֶם אֲחִיָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
translation:
  language: ml
  text: 'ഹെസ്രോന്റെ മൂത്തമകനായ യെരഹ്മെയേലിന്റെ പുത്രന്മാർ[a]: അവന്റെ മൂത്തമകൻ രാം, ബൂനാ, ഓരെൻ, ഓസെം, അഹീയാവ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ വാക്യഘടനയെ നേരിട്ട് വായിക്കുമ്പോൾ യെരഹ്മെയേലിന്റെ അഞ്ചു പുത്രന്മാരെയാണ് ഇവിടെ പട്ടികപ്പെടുത്തുന്നത്; അവരിൽ രാം മൂത്തമകനാണെന്ന് പ്രത്യേകം പറയുന്നു. എന്നാൽ അഹീയാവിനെ ഈ പട്ടികയുമായി മറ്റൊരു വിധത്തിൽ ബന്ധപ്പെടുത്തി വായിക്കാമെന്നും ചിലർ കരുതുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 'പുത്രന്മാർ:'
  rationale: വംശാവലിപ്പട്ടിക അവതരിപ്പിക്കുന്ന היה എന്ന ക്രിയയുടെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നാമപദപ്രയോഗവും ദ്വിബിന്ദുവുംകൊണ്ട് പ്രകടിപ്പിച്ചു; ‘ആയിരുന്നു’ എന്ന അസ്വാഭാവിക ഘടന ഒഴിവാക്കി.
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: പുരുഷസന്തതികളുടെ വംശാവലിപ്പട്ടികയായതിനാൽ എബ്രായപദത്തിന്റെ ലിംഗപരവും വംശാവലിസംബന്ധവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: יְרַחְמְאֵל
  choice: യെരഹ്മെയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בְּכוֹר חֶצְרוֹן
  choice: ഹെസ്രോന്റെ മൂത്തമകനായ
  rationale: യെരഹ്മെയേൽ ഹെസ്രോന്റെ ആദ്യജാതനാണെന്ന അനുബന്ധവിവരം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַבְּכוֹר
  choice: അവന്റെ മൂത്തമകൻ
  rationale: രാം യെരഹ്മെയേലിന്റെ ആദ്യജാതനാണെന്ന് വ്യക്തമാക്കുകയും എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള ‘ആദ്യജാതൻ’ എന്ന വിശേഷണം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: רָם
  choice: രാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וּבוּנָה
  choice: ബൂനാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וָאֹרֶן
  choice: ഓരെൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וָאֹצֶם
  choice: ഓസെം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲחִיָּה
  choice: അഹീയാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ പതിവ് മലയാള ബൈബിൾരൂപത്തോട് ചേർന്ന ലിപ്യന്തരണം.
theological_decisions:
- issue: അഹീയാവിന്റെ പട്ടികയുമായുള്ള ബന്ധം
  choice: അഹീയാവിനെ യെരഹ്മെയേലിന്റെ അഞ്ചാമത്തെ പുത്രനായി പട്ടികയിൽ ഉൾപ്പെടുത്തി.
  alternative: അഹീയാവ് എന്ന പദത്തെ പട്ടികയോട് മറ്റൊരു വ്യാകരണബന്ധത്തിൽ വായിക്കുക.
  rationale: എബ്രായ വാക്യത്തിന്റെ നേരിട്ടുള്ള വായനയിൽ രാം, ബൂനാ, ഓരെൻ, ഓസെം, അഹീയാവ് എന്നീ അഞ്ചു പേരാണ് യെരഹ്മെയേലിന്റെ പുത്രന്മാരായി വരുന്നത്; എങ്കിലും വാക്യഘടനയെ വേറിട്ടു മനസ്സിലാക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. ‘ആയിരുന്നു’ എന്ന ഇംഗ്ലീഷ് സ്വാധീനമുള്ള ക്രിയാപ്രയോഗത്തിനു പകരം പട്ടിക അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളഘടന ഉപയോഗിച്ചു; ബന്ധങ്ങൾ വ്യക്തമാക്കാൻ ‘അവന്റെ’ ചേർത്തു.
