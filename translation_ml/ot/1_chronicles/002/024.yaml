source:
  edition: WLC
  text: וְ/אַחַ֥ר מוֹת חֶצְר֖וֹן בְּ/כָלֵ֣ב אֶפְרָ֑תָה וְ/אֵ֤שֶׁת חֶצְרוֹן֙ אֲבִיָּ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶת אַשְׁח֖וּר אֲבִ֥י תְקֽוֹעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
translation:
  language: ml
  text: ഹെസ്രോൻ കാലേബ്-എഫ്രാത്തയിൽവെച്ച്[a] മരിച്ചതിനുശേഷം, ഹെസ്രോന്റെ ഭാര്യ അബീയാ അവന് തെക്കോവയുടെ പിതാവായ[b] അശ്ഹൂറിനെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാലേബ്-എഫ്രാത്തയിൽവെച്ച്’ എന്ന ഹീബ്രായ പ്രയോഗം ദുഷ്കരമാണ്. അത് ഒരു സ്ഥലത്തെയോ ഒരു ഗോത്രവിഭാഗത്തെയോ സൂചിപ്പിച്ചേക്കാം; പരമ്പരാഗതമായി ‘കാലേബ്-എഫ്രാത്താ’ എന്നും ‘കാലേബ് എഫ്രാത്താ’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘തെക്കോവയുടെ സ്ഥാപകൻ.’ വംശാവലികളിൽ ‘പിതാവ്’ എന്നത് നേരിട്ടുള്ള ജന്മപിതാവിനെ മാത്രമല്ല, ഒരു പട്ടണത്തിന്റെയോ ഗോത്രവിഭാഗത്തിന്റെയോ സ്ഥാപകനെയോ പ്രമുഖ പൂർവികനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר מוֹת חֶצְרוֹן
  choice: ഹെസ്രോൻ ... മരിച്ചതിനുശേഷം
  rationale: אַחַר + מוֹת എന്ന കാലസൂചക പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּכָלֵב אֶפְרָתָה
  choice: കാലേബ്-എഫ്രാത്തയിൽവെച്ച്
  rationale: בְּ എന്ന ഉപസർഗത്തെ സ്ഥലസൂചകമായി എടുത്തു; ദുഷ്കരമായ സംയുക്തനാമത്തിന്റെ അനിശ്ചിതത്വം നിലനിർത്താൻ രണ്ടു ഘടകങ്ങളും ഹൈഫനോടെ ചേർത്തു.
- source_word: וְאֵשֶׁת חֶצְרוֹן אֲבִיָּה
  choice: ഹെസ്രോന്റെ ഭാര്യ അബീയാ
  rationale: ഹീബ്രായ നിർമാണം മലയാളത്തിലെ സ്വാഭാവികമായ ഉടമസ്ഥപ്രയോഗത്തിലാക്കി; സ്ത്രീയുടെ പേര് തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַתֵּלֶד לוֹ
  choice: അവന് ... പ്രസവിച്ചു
  rationale: לוֹ സൂചിപ്പിക്കുന്ന ബന്ധം ഒഴിവാക്കാതെ, ഹീബ്രായത്തിലെ ‘അവന് പ്രസവിച്ചു’ എന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אַשְׁחוּר
  choice: അശ്ഹൂർ
  rationale: ശിൻ, ഹേത് എന്നീ വ്യഞ്ജനങ്ങൾ വേർതിരിച്ചറിയാൻ കഴിയുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אֲבִי תְקוֹעַ
  choice: തെക്കോവയുടെ പിതാവായ
  rationale: אָב എന്ന പദത്തിന്റെ അടിസ്ഥാനാർത്ഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; വംശാവലിയിൽ സാധ്യമായ ‘സ്ഥാപകൻ/പ്രമുഖ പൂർവികൻ’ എന്ന അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദുഷ്കരമായ സ്ഥല/ഗോത്രനാമവും ‘പിതാവ്’ എന്ന ബന്ധപദത്തിന്റെ വിശാല അർത്ഥസാധ്യതയും വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് സൂചകങ്ങൾ ഉള്ളടക്കവുമായി മറിച്ചുകിടന്നതിനാൽ, മലയാള കരടിൽ [a] കാലേബ്-എഫ്രാത്താ പ്രയോഗത്തോടും [b] ‘തെക്കോവയുടെ പിതാവ്’ എന്ന പ്രയോഗത്തോടും യുക്തിയായി ചേർത്തു.
