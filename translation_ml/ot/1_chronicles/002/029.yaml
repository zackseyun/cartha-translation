  text: וְ/שֵׁ֛ם אֵ֥שֶׁת אֲבִישׁ֖וּר אֲבִיהָ֑יִל וַ/תֵּ֣לֶד ל֔/וֹ אֶת אַחְבָּ֖ן וְ/אֶת מוֹלִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/029.yaml
  text: The name of Abishur’s wife was Abihail, and she bore to him Ahban and Molid.
translation:
  language: ml
  text: അബീശൂരിന്റെ ഭാര്യയുടെ പേര് അബീഹയിൽ എന്നായിരുന്നു. അവൾ അവന് അഹ്ബാനെയും മോലീദിനെയും ജന്മം നൽകി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת אֲבִישׁוּר אֲבִיהָיִל
  choice: അബീശൂരിന്റെ ഭാര്യയുടെ പേര് അബീഹയീൽ എന്നായിരുന്നു
  rationale: ഹീബ്രു നാമവാക്യത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഭൂതകാലസൂചനയോടെ അവതരിപ്പിക്കുന്നു; വ്യക്തിനാമങ്ങൾ ഉറവിടരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַתֵּלֶד לוֹ
  choice: അവൾ അവന് ... പ്രസവിച്ചു
  rationale: לוֹ എന്ന ദാതൃസൂചന ഒഴിവാക്കാതെ ‘അവന്’ എന്നു വ്യക്തമാക്കി; പ്രസവിച്ചത് ഭാര്യയാണെന്ന് മലയാളത്തിൽ വ്യക്തതയ്ക്കായി സർവനാമം ചേർത്തു.
- source_word: אַחְבָּן וְאֶת מוֹלִיד
  choice: അഹ്ബാനെയും മോലീദിനെയും
  rationale: നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തിത אֶת മലയാളത്തിലെ ‘-യെ/യും’ ഘടനയിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. പേരുകളുടെ ലിപ്യന്തരണത്തിൽ ഹീബ്രു ഉച്ചാരണസൂചനകൾ പരമാവധി നിലനിർത്തി; വിശദീകരണ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
