  text: וְ/שֶׁ֣מַע הוֹלִ֔יד אֶת רַ֖חַם אֲבִ֣י יָרְקֳעָ֑ם וְ/רֶ֖קֶם הוֹלִ֥יד אֶת שַׁמָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/044.yaml
  text: Shema fathered Raham[a], the father of Jorkeam; and Rekem fathered Shammai.
translation:
  language: ml
  text: ശേമ രഹാമിനെ ജനിപ്പിച്ചു; രഹാം യോർക്കെയാമിന്റെ പിതാവായിരുന്നു[a]. രേക്കെം ശമ്മായിയെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോർക്കെയാമിന്റെ സ്ഥാപകനോ പൂർവികനോ ആയ രഹാം.’ വംശാവലികളിൽ, പ്രത്യേകിച്ച് വംശവിഭാഗങ്ങളുമായോ പാർപ്പിടങ്ങളുമായോ ബന്ധപ്പെട്ടിടത്ത്, ‘പിതാവ്’ എന്ന എബ്രായപ്രയോഗം സ്ഥാപകനെയോ പൂർവികനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിസന്ദർഭത്തിൽ ഹിഫീൽ രൂപം ഒരാളെ ജനിപ്പിച്ച് അവന്റെ പിതാവാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പിതാവായി’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: אֲבִי
  choice: പിതാവായിരുന്നു
  rationale: എബ്രായത്തിലെ ‘പിതാവ്’ എന്ന രൂപം സുതാര്യമായി നിലനിർത്തുന്നു; ഇവിടെ ഇത് ഒരു സ്ഥലത്തിന്റെയോ വംശവിഭാഗത്തിന്റെയോ സ്ഥാപകൻ/പൂർവികൻ എന്ന അർഥവും വഹിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: יָרְקֳעָם
  choice: യോർക്കെയാം
  rationale: ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ പേരിനെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: שֶׁמַע
  choice: ശേമ
  rationale: വ്യക്തിനാമം ഹീബ്രു രൂപത്തിൽനിന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: רַחַם
  choice: രഹാം
  rationale: വ്യക്തിനാമം ഹീബ്രു രൂപത്തിൽനിന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: רֶקֶם
  choice: രേക്കെം
  rationale: വ്യക്തിനാമം ഹീബ്രു രൂപത്തിൽനിന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: שַׁמָּי
  choice: ശമ്മായി
  rationale: വ്യക്തിനാമം ഹീബ്രു രൂപത്തിൽനിന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; ദ്വിത്വ വ്യഞ്ജനം നിലനിർത്തി.
