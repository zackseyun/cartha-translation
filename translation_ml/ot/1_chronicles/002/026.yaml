source:
  edition: WLC
  text: וַ/תְּהִ֨י אִשָּׁ֥ה אַחֶ֛רֶת לִֽ/ירַחְמְאֵ֖ל וּ/שְׁמָ֣/הּ עֲטָרָ֑ה הִ֖יא אֵ֥ם אוֹנָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/026.yaml
  text: Jerahmeel also had another wife, and her name was Atarah; she was the mother of Onam.
translation:
  language: ml
  text: യെരഹ്മെയേലിന് മറ്റൊരു ഭാര്യയും ഉണ്ടായിരുന്നു; അവളുടെ പേര് അതാരാ എന്നായിരുന്നു. അവൾ ഓനാമിന്റെ അമ്മയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי ... לִירַחְמְאֵל
  choice: യെരഹ്മെയേലിന് ... ഉണ്ടായിരുന്നു
  rationale: היה എന്ന ക്രിയയും ל എന്ന ഉപസർഗവും ചേർന്ന ഈ എബ്രായ ഘടന ഇവിടെ ഉടമസ്ഥബന്ധം സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ‘യെരഹ്മെയേലിന് ... ഉണ്ടായിരുന്നു’ എന്നു നൽകി.
- source_word: אִשָּׁה אַחֶרֶת
  choice: മറ്റൊരു ഭാര്യയും
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ אִשָּׁה എന്നത് ‘ഭാര്യ’ എന്നാണ്; אַחֶרֶת മറ്റൊരാളെ സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭത്തോടുള്ള കൂട്ടിച്ചേർക്കൽ וַ മുഖേന വരുന്നതിനാൽ ‘യും’ ചേർത്തു.
- source_word: וּשְׁמָהּ
  choice: അവളുടെ പേര് ... എന്നായിരുന്നു
  rationale: പേരറിയിക്കുന്ന എബ്രായ സൂത്രവാക്യത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: עֲטָרָה
  choice: അതാരാ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הִיא אֵם
  choice: അവൾ ... അമ്മയായിരുന്നു
  rationale: സ്വതന്ത്ര സർവനാമമായ הִיא നിലനിർത്തി, വംശാവലി പ്രസ്താവന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: אוֹנָם
  choice: ഓനാം
  rationale: വ്യക്തിനാമം എബ്രായ രൂപത്തോട് ചേർന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു.
