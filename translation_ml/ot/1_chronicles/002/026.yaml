translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. മൂലത്തിലെ രണ്ട് സമന്വിത പ്രസ്താവനകൾ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; അർത്ഥബന്ധം മാറ്റിയിട്ടില്ല.
