  yaml_path: translation/ot/1_chronicles/002/017.yaml
  text: Abigail bore Amasa[a], and the father of Amasa was Jether the Ishmaelite.
translation:
  language: ml
  text: അബീഗയിൽ അമാസയെ പ്രസവിച്ചു; അമാസയുടെ പിതാവ് യിശ്മായേല്യനായ യേഥെർ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളും 2 ശമൂവേൽ 17:25-ലെ സമാന്തരവാക്യവും ‘യിശ്മായേല്യനായ യേഥെർ’ എന്നതിനുപകരം ‘യിസ്രായേല്യനായ യിത്രാ’ എന്നു വായിക്കുന്നു. ഇവിടെ മസോരറ്റിക് പാഠം ‘യിശ്മായേല്യനായ യേഥെർ’ എന്നാണ് വായിക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: יָלְדָה
  choice: പ്രസവിച്ചു
  rationale: സ്ത്രീ കർത്താവായുള്ള ഖാൽ രൂപത്തിൽ ילד എന്ന ക്രിയ ‘പ്രസവിച്ചു’ എന്നാണ് അർഥമാക്കുന്നത്. വംശാവലിയുടെ സന്ദർഭത്തിൽ ഇത് സ്വാഭാവികവും മാതൃബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നതുമാണ്.
- source_word: אֶת עֲמָשָׂא
  choice: അമാസയെ
  rationale: אֶת നിർദിഷ്ട കർമത്തെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ കർമവിഭക്തിയായ ‘-യെ’ ഉപയോഗിച്ചു. വ്യക്തിനാമം ‘അമാസ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַאֲבִי עֲמָשָׂא
  choice: അമാസയുടെ പിതാവ്
  rationale: സംയുക്തപദഘടനയുടെ അർഥമായ ‘അമാസയുടെ പിതാവ്’ മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: יֶתֶר
  choice: യേഥെർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: യിശ്മായേല്യനായ
  rationale: നിശ്ചയോപപദത്തോടെയുള്ള ജനവിഭാഗനാമം യേഥെറിനെ തിരിച്ചറിയിക്കുന്ന വിശേഷണമായി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. രണ്ട് വംശബന്ധ പ്രസ്താവനകളെയും അർദ്ധവിരാമംകൊണ്ട് വ്യക്തമായി വേർതിരിച്ചു; പാഠഭേദം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
