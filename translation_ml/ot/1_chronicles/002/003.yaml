revisions:
- from: 'യെഹൂദയുടെ പുത്രന്മാർ: ഏർ[a], ഓനാൻ, ശേലഹ്. ഈ മൂന്നുപേരും കനാന്യസ്ത്രീയായ ശൂവയുടെ മകളിൽനിന്ന് അവനു ജനിച്ചു. യെഹൂദയുടെ ആദ്യജാതനായ ഏർ യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ ദുഷ്ടനായിരുന്നു; അവൻ അവനെ മരണത്തിനിരയാക്കി.[b]'
