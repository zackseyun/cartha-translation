  rationale: The revision clarifies that the Canaanite designation belongs to Shua’s daughter, moves the lexical note to its proper anchor, and explicitly supplies Yahweh as the agent where Malayalam pronoun usage would be ambiguous. It preserves the Hebrew’s wording and the audit trail’s acknowledged Bath-shua alternative without treating that disputed analysis as certain.
