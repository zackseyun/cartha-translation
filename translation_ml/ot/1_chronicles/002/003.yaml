id: 1CH.2.3
reference: 1 Chronicles 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֣י יְהוּדָ֗ה עֵ֤ר וְ/אוֹנָן֙ וְ/שֵׁלָ֔ה שְׁלוֹשָׁה֙ נ֣וֹלַד ל֔/וֹ מִ/בַּת שׁ֖וּעַ הַֽ/כְּנַעֲנִ֑ית וַ/יְהִ֞י עֵ֣ר בְּכ֣וֹר יְהוּדָ֗ה רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה וַ/יְמִיתֵֽ/הוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
translation:
  language: ml
  text: 'യെഹൂദയുടെ പുത്രന്മാർ: ഏർ, ഓനാൻ, ശേലഹ്—ശൂവിന്റെ മകളായ കനാന്യസ്ത്രീയിൽനിന്ന് അവനു ജനിച്ചവർ ഈ മൂന്നുപേരാണ്.[a] യെഹൂദയുടെ ആദ്യജാതനായ ഏർ യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ ദുഷ്ടനായിരുന്നു; യഹ്‌വേ[b] അവനെ മരണത്തിനിരയാക്കി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ശൂവിന്റെ മകളായ കനാന്യസ്ത്രീ.’ ചിലർ ഇവിടെ ‘ബത്ത്-ശൂവ’ എന്നത് വ്യക്തിനാമമായി കാണുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ കർത്താവ് പ്രത്യേകം വ്യക്തമാക്കിയിട്ടില്ല; എന്നാൽ മുൻവാക്യത്തിലെ യഹ്‌വേയെയാണ് അത് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: യെഹൂദയുടെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ ഔപചാരിക ഭാവം നിലനിർത്തിക്കൊണ്ട് സ്മിഖൂത് ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: שְׁלוֹשָׁה נוֹלַד לוֹ
  choice: ഈ മൂന്നുപേരും അവനു ജനിച്ചു
  rationale: മൂന്ന് എന്ന സംഗ്രഹസംഖ്യയും נולד എന്ന നിഷ്ക്രിയ അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  choice: കനാന്യസ്ത്രീയായ ശൂവയുടെ മകളിൽനിന്ന്
  rationale: വാചകത്തിന്റെ സ്വാഭാവിക വിഭജനം ‘കനാന്യസ്ത്രീയായ ശൂവയുടെ മകൾ’ എന്നതാണ്; ‘ബത്ത്-ശൂവ’ എന്ന പേരായുള്ള വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּכוֹר יְהוּדָה
  choice: യെഹൂദയുടെ ആദ്യജാതൻ
  rationale: വംശാവലിയിൽ ഏറിന്റെ സ്ഥാനത്തെ കൃത്യവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: רַע בְּעֵינֵי יְהוָה
  choice: യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ ദുഷ്ടനായിരുന്നു
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകവും അർഥവും dignified Malayalam-ൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיְמִיתֵהוּ
  choice: അവൻ അവനെ മരണത്തിനിരയാക്കി
  rationale: ഹിഫീൽ രൂപത്തിലെ causative അർഥം നിലനിർത്തുന്നു; എബ്രായത്തിൽ കർത്താവ് സൂചിതമായതിനാൽ സർവനാമപ്രവാഹവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: וַיְמִיתֵהוּ എന്ന ക്രിയയുടെ സൂചിത കർത്താവ്
  choice: അവൻ അവനെ മരണത്തിനിരയാക്കി
  alternative: യഹ്‌വേ അവനെ മരണത്തിനിരയാക്കി
  rationale: എബ്രായത്തിൽ കർത്താവ് വീണ്ടും പറയുന്നില്ല; മുൻവാക്യത്തിലെ യഹ്‌വേയാണ് ഏറ്റവും സ്വാഭാവികമായ സൂചിത കർത്താവ്. മുഖ്യപാഠത്തിൽ സർവനാമം നിലനിർത്തുകയും അടിക്കുറിപ്പിൽ അത് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം നിലനിർത്തുന്നു; ഒരു പദവിയാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. പേരുകൾ സാധാരണ ബൈബിൾ-മലയാള ഉച്ചാരണരീതിയിൽ നൽകിയിരിക്കുന്നു; യഹ്‌വേ എന്ന ദൈവനാമം നേരിട്ട് നിലനിർത്തിയിരിക്കുന്നു.
