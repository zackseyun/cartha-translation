id: 1CH.2.55
reference: 1 Chronicles 2:55
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִשְׁפְּח֤וֹת סֹפְרִים֙ ישבו יַעְבֵּ֔ץ תִּרְעָתִ֥ים שִׁמְעָתִ֖ים שׂוּכָתִ֑ים הֵ֚מָּה הַ/קִּינִ֣ים הַ/בָּאִ֔ים מֵ/חַמַּ֖ת אֲבִ֥י בֵית רֵכָֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/055.yaml
  text: 'and the families of the scribes who lived at Jabez: the Tirathites[a], the Shimeathites, and the Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.'
translation:
  language: ml
  text: 'യാബേസിൽ പാർത്തിരുന്ന എഴുത്തുകാരുടെ കുടുംബങ്ങൾ: തിരാത്യർ, ശിമെയാത്യർ, സൂഖാത്യർ. രേഖാബ് ഭവനത്തിന്റെ പിതാവായ ഹമ്മത്തിൽനിന്ന് വന്ന കേന്യരാണ് ഇവർ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രേഖാബ് ഭവനത്തിന്റെ പൂർവപിതാവായ’ അല്ലെങ്കിൽ ‘സ്ഥാപകനായ.’ വംശാവലിസന്ദർഭങ്ങളിൽ എബ്രായയിലെ ‘പിതാവ്’ എന്ന പദത്തിന് ഒരു വംശത്തിന്റെ പൂർവപിതാവ് അല്ലെങ്കിൽ സ്ഥാപകൻ എന്ന അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: കുടുംബങ്ങളും ഉണ്ടായിരുന്നു
  rationale: വംശാവലിപ്പട്ടികയോടുള്ള וְ എന്ന ബന്ധം ‘-ഉം’കൊണ്ട് നിലനിർത്തുന്നു; מִשְׁפָּחוֹת എന്നത് കുടുംബങ്ങൾ/കുലങ്ങൾ എന്ന അർഥത്തിൽ വരുന്നു. മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ വാക്യത്തിനായി ‘ഉണ്ടായിരുന്നു’ ചേർത്തിരിക്കുന്നു.
- source_word: סֹפְרִים
  choice: എഴുത്തുകാർ
  rationale: എഴുത്തിലും രേഖാസൂക്ഷിപ്പിലും ഏർപ്പെട്ടിരുന്നവരെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ആധുനിക പദം; അവരുടെ കൃത്യമായ ഔദ്യോഗികമോ മതപരമോ ആയ സ്ഥാനം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ישבו יַעְבֵּץ
  choice: യാബേസിൽ പാർത്തിരുന്ന
  rationale: ישבו എന്ന ബഹുവചന ക്രിയയുടെ താമസിക്കുക/വസിക്കുക എന്ന അർഥവും യാബേസ് സ്ഥലസൂചനയായുള്ള വാക്യബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: תִּרְעָתִים שִׁמְעָתִים שׂוּכָתִים
  choice: തിരാത്യർ, ശിമെയാത്യർ, സൂഖാത്യർ
  rationale: മൂന്നും ജനവിഭാഗമോ കുലമോ സൂചിപ്പിക്കുന്ന നാമങ്ങളായതിനാൽ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; ‘-യർ’ കൂട്ടവിഭാഗത്തെ വ്യക്തമാക്കുന്നു.
- source_word: הֵמָּה הַקִּינִים
  choice: കേന്യരാണ് ഇവർ
  rationale: തിരിച്ചറിയിക്കൽ ഊന്നിപ്പറയുന്ന הֵמָּה എന്ന സ്വതന്ത്ര സർവനാമത്തിന്റെ ബലം മലയാളത്തിലെ ‘ആണ്’ ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: הַבָּאִים מֵחַמַּת
  choice: ഹമ്മത്തിൽനിന്നു വന്ന
  rationale: പങ്കാളിക്രിയയും מִן എന്ന ഉറവിടസൂചനയും നേരിട്ട് നൽകുന്നു; ഇത് കുടിയേറ്റമാണോ വംശോത്ഭവമാണോ എന്ന് നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: אֲבִי בֵית רֵכָב
  choice: രേഖാബ് ഭവനത്തിന്റെ പിതാവ്
  rationale: എബ്രായയിലെ ‘പിതാവ്’ എന്ന വംശാവലി പ്രയോഗം മുഖ്യവാചകത്തിൽ സുതാര്യമായി നിലനിർത്തുന്നു; ‘ഭവനം’ ഇവിടെ കുടുംബവംശത്തെ സൂചിപ്പിക്കുന്നു, വിപുലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. ‘ശാസ്ത്രിമാർ’ എന്ന മതസാങ്കേതിക ധ്വനി ഒഴിവാക്കി ‘എഴുത്തുകാർ’ ഉപയോഗിച്ചു. വ്യക്തി/കുലനാമങ്ങൾ മൂലഭാഷയോട് ചേർന്ന മലയാള ലിപ്യന്തരണത്തിൽ നൽകി.
