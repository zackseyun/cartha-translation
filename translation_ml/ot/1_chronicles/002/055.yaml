  terminology: “എഴുത്തുകാർ” is a sound non-overinterpreting rendering of סֹפְרִים. “കേന്യർ” appropriately represents the Kenites. “ഭവനം” retains the Hebrew ‘house’ idiom, while the footnote responsibly notes the possible genealogical sense of ‘father’ without selecting one interpretation.
