  text: Salma[a], the father of Bethlehem; Hareph[b], the father of Beth-gader.
translation:
  language: ml
  text: ബേത്‌ലഹേമിന്റെ പിതാവായ സൽമാ[a]; ബേത്-ഗാദേരിന്റെ പിതാവായ ഹാരേഫ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പിതാവ്’ എന്നതിന് ഇവിടെ ‘സ്ഥാപകൻ’ എന്നോ ‘പൂർവികൻ’ എന്നോ അർഥമാകാം; വംശാവലി പട്ടികകളിൽ ഈ പദം നേരിട്ടുള്ള ജനകനെ മാത്രമല്ല, ഒരു ഗോത്രത്തിന്റെയോ പട്ടണത്തിന്റെയോ സ്ഥാപകനെയോ പൂർവികനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ചില നാമപാരമ്പര്യങ്ങളിൽ ഹാരേഫ് എന്ന പേര് ‘ഹാരിഫ്’ എന്നും കാണപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂלְמָא
  choice: സൽമാ
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲבִי
  choice: പിതാവായ
  rationale: എബ്രായത്തിലെ ‘പിതാവ്’ എന്ന പദപ്രയോഗം സുതാര്യമായി നിലനിർത്തുന്നു; വംശാവലി-വാസസ്ഥല പട്ടികകളിൽ ഇത് നേരിട്ടുള്ള ജനകൻ മാത്രമല്ല, പൂർവികൻ, സ്ഥാപകൻ, അല്ലെങ്കിൽ ഒരു ഗോത്രത്തിന്റെയോ പട്ടണത്തിന്റെയോ തലവൻ എന്ന വിശാല അർഥവും വഹിക്കാം.
- source_word: בֵית לָחֶם
  choice: ബേത്‌ലഹേം
  rationale: മലയാളത്തിൽ പരിചിതമായ ബൈബിൾ സ്ഥലനാമരൂപം ഉപയോഗിച്ചു.
- source_word: חָרֵף
  choice: ഹാരെഫ്
  rationale: ഇവിടത്തെ എബ്രായ വ്യഞ്ജന-സ്വരരൂപം പിന്തുടർന്ന് വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֵית גָּדֵר
  choice: ബേത്-ഗാദേർ
  rationale: בֵית + നാമം എന്ന സ്ഥലനാമഘടന വ്യക്തമാക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ‘ഗാദേരിന്റെ ഭവനം’ എന്ന പദാനുപദ വിവർത്തനം സ്വാഭാവികമല്ല.
