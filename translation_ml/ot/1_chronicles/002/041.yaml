  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. പുരാതനമോ അസ്വാഭാവികമോ ആയ ‘ജനിപ്പിച്ചു’ എന്ന രൂപത്തിനുപകരം ബന്ധം വ്യക്തമായി പറയുന്ന ‘പിതാവായി’ ഉപയോഗിച്ചു.
