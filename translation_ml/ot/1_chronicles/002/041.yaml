  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שַׁלּוּם֙ הוֹלִ֣יד אֶת יְקַמְיָ֔ה וִֽ/יקַמְיָ֖ה הֹלִ֥יד אֶת אֱלִישָׁמָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/041.yaml
  text: Shallum fathered Jekamiah, and Jekamiah fathered Elishama.
translation:
  language: ml
  text: ശല്ലൂം യെക്കമ്യാവിന്റെ പിതാവായി; യെക്കമ്യാവ് എലീശാമയുടെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלּוּם
  choice: ശല്ലൂം
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ഉറവിടഭാഷയിലെ ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הוֹלִיד / הֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ഹിഫിൽ രൂപത്തിന് ‘ജനിപ്പിച്ചു/പിതാവായി’ എന്ന അർഥമുണ്ട്. ആധുനികവും മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിനായി ‘പിതാവായി’ തിരഞ്ഞെടുത്തു; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ രൂപം നിലനിർത്തി.
- source_word: אֶת
  choice: '[പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നമാണ്; മലയാളത്തിൽ സ്വതന്ത്ര പദമായി നൽകേണ്ടതില്ല.
- source_word: יְקַמְיָה / וִיקַמְיָה
  choice: യെക്കമ്യാവ് / യെക്കമ്യാവ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലേക്ക് ലിപ്യന്തരണം ചെയ്തു. രണ്ടാമത്തെ പ്രയോഗത്തിലെ ו എന്ന സംയോജകം അർധവിരാമത്തിനുശേഷമുള്ള വാക്യബന്ധത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു; എബ്രായത്തിലെ പേരിന്റെ ആവർത്തനം നിലനിർത്തി.
- source_word: אֱלִישָׁמָע
  choice: എലീശാമ
  rationale: വ്യക്തിനാമം ഉറവിടഭാഷയോട് അടുത്ത മലയാളരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
