id: 1CH.2.16
reference: 1 Chronicles 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ו/אחיתי/הם צְרוּיָ֣ה וַ/אֲבִיגָ֑יִל וּ/בְנֵ֣י צְרוּיָ֗ה אַבְשַׁ֛י וְ/יוֹאָ֥ב וַ/עֲשָׂה אֵ֖ל שְׁלֹשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/016.yaml
  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: ml
  text: 'അവരുടെ സഹോദരിമാർ സെരൂയയും അബീഗയിലും ആയിരുന്നു. സെരൂയയുടെ പുത്രന്മാർ: അബീശായി, യോവാബ്, അസാഹേൽ—മൂന്നുപേർ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתֵיהֶם
  choice: അവരുടെ സഹോദരിമാർ ... ആയിരുന്നു
  rationale: മൂന്നാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയവും ‘സഹോദരിമാർ’ എന്ന ബഹുവചനവും നിലനിർത്തി, വംശാവലിയുടെ സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: צְרוּיָה
  choice: സെരൂയ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וַאֲבִיגָיִל
  choice: അബീഗയിൽ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന രീതിയിൽ ലിപ്യന്തരിച്ചു; സംയോജകത്തിന്റെ അർഥം ‘യും’ മുഖേന നിലനിർത്തി.
- source_word: וּבְנֵי צְרוּיָה
  choice: സെരൂയയുടെ പുത്രന്മാർ
  rationale: എബ്രായ സംയുക്തപദബന്ധത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു; തുടർന്നുള്ള പേരുപട്ടിക വ്യക്തമാക്കാൻ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
- source_word: אַבְשַׁי
  choice: അബീശായി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְיוֹאָב
  choice: യോവാബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; പട്ടികയിലെ ബന്ധം വിരാമചിഹ്നങ്ങളാൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַעֲשָׂהאֵל
  choice: അസാഹേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദഘടന പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שְׁלֹשָׁה
  choice: മൂന്നുപേർ
  rationale: പുത്രന്മാരുടെ ആകെ എണ്ണം സൂചിപ്പിക്കുന്ന എബ്രായ സംഖ്യ ഒഴിവാക്കാതെ, വ്യക്തികളെ എണ്ണുന്നതിനുള്ള സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. പേരുകളുടെ പട്ടിക വായിക്കാൻ എളുപ്പമാക്കാൻ ദ്വിബിന്ദുവും ദീർഘവിരാമവും ഉപയോഗിച്ചു; മൂലത്തിലെ വിവരങ്ങളൊന്നും കൂട്ടിച്ചേർക്കുകയോ ഒഴിവാക്കുകയോ ചെയ്തിട്ടില്ല.
