source:
  edition: WLC
  text: בְּנֵ֣י שַׂלְמָ֗א בֵּ֥ית לֶ֨חֶם֙ וּ/נְט֣וֹפָתִ֔י עַטְר֖וֹת בֵּ֣ית יוֹאָ֑ב וַ/חֲצִ֥י הַ/מָּנַחְתִּ֖י הַ/צָּרְעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
translation:
  language: ml
  text: 'ശൽമയുടെ പുത്രന്മാർ: ബേത്‌ലഹേം, നെതോഫാത്യർ, അത്രോത്ത്-ബേത്ത്-യോവാബ്, മനഹത്യരിൽ പകുതി[a], സൊരയ്യർ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മെനുഹോത്യർ.” ഈ എബ്രായ ജാതിവാചകപദം കൃത്യമായി ഏതു സ്ഥലനാമവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു എന്നത് അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “സൊരാത്യർ”; അതായത്, സൊരായുമായി ബന്ധപ്പെട്ട ആളുകൾ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടികയിൽ ഈ പദം നേരിട്ടുള്ള പുത്രന്മാരെ മാത്രമല്ല, സന്തതികളെയോ വംശവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കാം. എങ്കിലും എബ്രായ വംശാവലിയുടെ ഔപചാരിക പ്രയോഗം നിലനിർത്താൻ ‘പുത്രന്മാർ’ എന്നു നൽകി.
- source_word: שַׂלְמָא
  choice: ശൽമ
  rationale: എബ്രായ വ്യഞ്ജനരൂപത്തോട് ചേർന്ന വ്യക്തിനാമലിപ്യന്തരണം.
- source_word: בֵּית לֶחֶם
  choice: ബേത്‌ലഹേം
  rationale: സ്ഥിരപ്രചാരമുള്ള സ്ഥലനാമരൂപം; ഇവിടെ ശൽമയിൽനിന്നുള്ള ഒരു സ്ഥലബന്ധിത വംശവിഭാഗത്തെയും സൂചിപ്പിക്കാം.
- source_word: וּנְטוֹפָתִי
  choice: നെതോഫാത്യർ
  rationale: ജാതിവാചകരൂപമായതിനാൽ നെതോഫയുമായി ബന്ധപ്പെട്ട ആളുകളെയോ വംശവിഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന ബഹുവചനമായി നൽകി.
- source_word: עַטְרוֹת בֵּית יוֹאָב
  choice: അത്രോത്ത്-ബേത്ത്-യോവാബ്
  rationale: പദഘടകങ്ങളെ വിവർത്തനം ചെയ്യാതെ, വംശാവലിസന്ദർഭത്തിന് യോജിച്ച സംയുക്ത സ്ഥല/വംശനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: וַחֲצִי
  choice: പകുതി
  rationale: അക്ഷരാർഥമായ ‘പകുതി’ എന്ന ബന്ധം നിലനിർത്തി; മലയാളത്തിൽ ‘മനഹാത്യരിൽ പകുതി’ എന്നത് സ്വാഭാവികമായി ആ വിഭാഗത്തിന്റെ പകുതിയെ സൂചിപ്പിക്കുന്നു.
- source_word: הַמָּנַחְתִּי
  choice: മനഹാത്യർ
  rationale: നിശ്ചിത ജാതിവാചകരൂപത്തെ ഒരു ജന/വംശവിഭാഗമായി ബഹുവചനത്തിൽ നൽകി. കൃത്യമായ സ്ഥലനാമബന്ധത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: הַצָּרְעִי
  choice: സോര്യർ
  rationale: സോരയുമായി ബന്ധപ്പെട്ട ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ജാതിവാചകരൂപമായി സംക്ഷിപ്തമായി ലിപ്യന്തരിച്ചു; മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. പരിചിതമായ ബേത്‌ലഹേം എന്ന രൂപം നിലനിർത്തുകയും അപരിചിതമായ പേരുകൾ ഉറവിടഭാഷയോട് ചേർന്ന് ലിപ്യന്തരിപ്പിക്കുകയും ചെയ്തു. ജാതിവാചക ഏകവചനങ്ങളെ സന്ദർഭാനുസൃതമായി ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചനങ്ങളാക്കി.
