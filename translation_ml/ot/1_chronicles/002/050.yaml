  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വംശാവലി ശൈലി. പേരുകൾ മൂലഭാഷയോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; ‘പിതാവ്’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
