source:
  edition: WLC
  text: אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י כָלֵ֔ב בֶּן ח֖וּר בְּכ֣וֹר אֶפְרָ֑תָה שׁוֹבָ֕ל אֲבִ֖י קִרְיַ֥ת יְעָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/050.yaml
  text: 'These were the sons of Caleb son of Hur[a], the firstborn of Ephrathah: Shobal, father of Kiriath-jearim.'
translation:
  language: ml
  text: 'എഫ്രാത്തായുടെ ആദ്യജാതനായ ഹൂരിന്റെ മകനായ കാലേബിന്റെ പുത്രന്മാർ ഇവരായിരുന്നു: കിര്യത്ത്-യെയാരീമിന്റെ പിതാവായ[a] ശോബാൽ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കിര്യത്ത്-യെയാരീമിന്റെ സ്ഥാപകൻ’ അല്ലെങ്കിൽ ‘കിര്യത്ത്-യെയാരീമിന്റെ പൂർവികൻ’; വംശാവലികളിലും പാർപ്പിടങ്ങളെക്കുറിച്ചുള്ള സന്ദർഭങ്ങളിലും ‘പിതാവ്’ എന്ന എബ്രായപ്രയോഗം ഒരു കുലത്തിന്റെയോ പട്ടണത്തിന്റെയോ സ്ഥാപകനെയോ പൂർവികനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הָיוּ
  choice: ഇവരായിരുന്നു
  rationale: വംശാവലിവിവരണം അവതരിപ്പിക്കുന്ന ബഹുവചന പ്രയോഗവും പൂർത്തിക്രിയയുടെ ഭൂതകാലഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי כָלֵב
  choice: കാലേബിന്റെ പുത്രന്മാർ
  rationale: בְּנֵי എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു; ഇവിടെ ‘സന്തതികൾ’ എന്ന് വിപുലീകരിക്കാൻ നിർബന്ധിക്കുന്ന സന്ദർഭസൂചനയില്ല.
- source_word: בֶּן חוּר
  choice: ഹൂരിന്റെ മകൻ
  rationale: വംശാവലിയിൽ സംക്ഷിപ്തത ഉണ്ടായേക്കാമെങ്കിലും എബ്രായത്തിലെ ബന്ധരൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: בְּכוֹר אֶפְרָתָה
  choice: എഫ്രാത്തയുടെ ആദ്യജാതനായ
  rationale: ഈ ഘടകം വ്യാകരണപരമായി ‘ഹൂർ’ എന്ന പേരിനോടാണ് ഏറ്റവും സ്വാഭാവികമായി ചേരുന്നത്; മലയാള വാക്യക്രമം ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: שׁוֹבָל
  choice: ശോബാൽ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲבִי
  choice: പിതാവായ
  rationale: എബ്രായ പ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; വംശാവലി-പാർപ്പിടസന്ദർഭങ്ങളിൽ ഇതിന് സ്ഥാപകൻ അഥവാ പൂർവികൻ എന്ന അർഥവും വരാമെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: קִרְיַת יְעָרִים
  choice: കിര്യത്ത്-യെയാരീം
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
