id: 1CH.2.45
reference: 1 Chronicles 2:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בֶן שַׁמַּ֖י מָע֑וֹן וּ/מָע֖וֹן אֲבִ֥י בֵֽית צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/045.yaml
  text: And the son of Shammai was Maon[a], and Maon was the father of Beth-zur.
translation:
  language: ml
  text: ശമ്മായിയുടെ മകൻ മാവോൻ ആയിരുന്നു; മാവോൻ ബേത്ത്-സൂരിന്റെ പിതാവായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബേത്ത്-സൂരിന്റെ പൂർവികൻ/സ്ഥാപകൻ.” വംശാവലികളിൽ “പിതാവ്” എന്നത് ഒരു വംശത്തിന്റെയോ പാർപ്പിടത്തിന്റെയോ സ്ഥാപകനെയോ പ്രമുഖ പൂർവികനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶן
  choice: മകൻ
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ו മലയാളത്തിലെ വാക്യബന്ധത്തിലും അർധവിരാമത്തിലും സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു; בֶן ഇവിടെ നേരിട്ടുള്ള പുത്രബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘മകൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: שַׁמַּי
  choice: ശമ്മായി
  rationale: വ്യക്തിനാമം ആധുനിക മലയാള ലിപിയിൽ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തവിധം ലിപ്യന്തരിച്ചു.
- source_word: מָעוֹן
  choice: മാവോൻ
  rationale: വംശാവലിയുടെ വാക്യഘടനയിൽ ഇത് വ്യക്തിനാമമായതിനാൽ പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരിച്ചു.
- source_word: וּ/מָעוֹן
  choice: മാവോൻ
  rationale: ഹീബ്രുവിലെ പേരിന്റെ ആവർത്തനം നിലനിർത്തി; ו സൂചിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിൽ അർധവിരാമത്തിനു ശേഷമുള്ള വാക്യത്തുടർച്ചയിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: אֲבִי
  choice: പിതാവായിരുന്നു
  rationale: അടിസ്ഥാനമായ വംശാവലി പ്രയോഗം നിലനിർത്തുന്നു; എന്നാൽ പദത്തിന് പൂർവികൻ, സ്ഥാപകൻ, അല്ലെങ്കിൽ ഒരു വംശത്തിന്റെയോ സ്ഥലത്തിന്റെയോ തലവൻ എന്ന വിശാല അർഥസാധ്യതയുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: בֵּית צוּר
  choice: ബേത്ത്-സൂർ
  rationale: സ്ഥലത്തിന്റെയോ വംശത്തിന്റെയോ സംയുക്തനാമമായി കണ്ട്, ‘സൂരിന്റെ വീട്’ എന്നു പദാനുപദം മാറ്റാതെ ലിപ്യന്തരിച്ചു.
