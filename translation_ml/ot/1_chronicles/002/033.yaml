id: 1CH.2.33
reference: 1 Chronicles 2:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֥י יוֹנָתָ֖ן פֶּ֣לֶת וְ/זָזָ֑א אֵ֥לֶּה הָי֖וּ בְּנֵ֥י יְרַחְמְאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/033.yaml
  text: 'And the sons of Jonathan: Peleth and Zaza. These were the sons of Jerahmeel.'
translation:
  language: ml
  text: 'യോനാഥാന്റെ പുത്രന്മാരും: പേലെത്ത്, സാസാ. ഇവർ യെരഹ്മെയേലിന്റെ പുത്രന്മാരായിരുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ו മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ, בְנֵי എന്നത് നേരിട്ട് ‘പുത്രന്മാർ’ എന്നു നൽകി.
- source_word: יוֹנָתָן
  choice: യോനാഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തി.
- source_word: פֶּלֶת
  choice: പേലെത്ത്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി പകർത്തി.
- source_word: וְזָזָא
  choice: സാസാ
  rationale: പട്ടികയിലെ രണ്ടാമത്തെ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി പകർത്തി; പേരുകൾക്കിടയിലെ ബന്ധം വിരാമചിഹ്നംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: אֵלֶּה
  choice: ഇവർ
  rationale: മുമ്പ് പറഞ്ഞ വ്യക്തികളെ ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചന സർവനാമമായി സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു.
- source_word: הָיוּ
  choice: ആയിരുന്നു
  rationale: വംശാവലിസംഗ്രഹത്തിൽ തിരിച്ചറിയൽ സൂചിപ്പിക്കുന്ന copula ആയി പരിഭാഷപ്പെടുത്തി; ‘ആയിത്തീർന്നു’ എന്ന മാറ്റത്തിന്റെ ആശയം ഒഴിവാക്കി.
- source_word: בְּנֵי יְרַחְמְאֵל
  choice: യെരഹ്മെയേലിന്റെ പുത്രന്മാർ
  rationale: בְנֵי എന്ന ബന്ധപദത്തിന്റെ ഔപചാരിക വംശാവലി ഭാഷ നിലനിർത്തി; ഇവിടെ ‘സന്തതികൾ’ എന്നു വിപുലീകരിക്കാതെ ‘പുത്രന്മാർ’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. മൂലത്തിലെ അർത്ഥം നിലനിർത്തിക്കൊണ്ട് തുടക്കത്തിലെ ബന്ധകത്തെ മലയാളത്തിൽ നിർബന്ധമായി ചേർക്കാതെ സ്വാഭാവികത പാലിച്ചു.
