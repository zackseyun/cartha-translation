source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בָנִים֙ לְ/שׁוֹבָ֔ל אֲבִ֖י קִרְיַ֣ת יְעָרִ֑ים הָרֹאֶ֖ה חֲצִ֥י הַ/מְּנֻחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
translation:
  language: ml
  text: 'കിര്യത്ത്-യെയാരീമിന്റെ പിതാവായ[a] ശോബാലിന് പുത്രന്മാർ ഉണ്ടായിരുന്നു: ഹാരോയെ[b], മനഹാത്തുകാരിൽ പകുതി[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കിര്യത്ത്-യെയാരീമിന്റെ സ്ഥാപകൻ.’ വംശാവലികളിൽ ‘പിതാവ്’ എന്നതിന് ഒരു പട്ടണവുമായി ബന്ധപ്പെട്ട പൂർവികൻ, സ്ഥാപകൻ, അല്ലെങ്കിൽ പ്രമുഖൻ എന്ന അർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഹാരോയെ എന്നത് ഒരു വ്യക്തിനാമമായിരിക്കാം; ചില പാരമ്പര്യങ്ങളിൽ ഇത് ‘രെയായാ’ എന്നു നൽകിയിട്ടുണ്ട്.
    reason: alternative_reading
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘മെനുഹോത്തിന്റെ പകുതി.’ ഇത് ‘മെനുഹോത്ത് എന്ന സ്ഥലത്തിന്റെ പകുതി’ എന്നോ ‘മെനുഹോത്തിലെ (മനഹാത്തിലെ) നിവാസികളുടെയോ കുലത്തിന്റെയോ പകുതി’ എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  choice: ശോബാലിന് പുത്രന്മാർ ഉണ്ടായിരുന്നു
  rationale: ‘ശോബാലിന് പുത്രന്മാർ ഉണ്ടായി’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വംശാവലിസംബന്ധമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲבִי קִרְיַת יְעָרִים
  choice: കിര്യത്ത്-യെയാരീമിന്റെ പിതാവായ
  rationale: മൂലത്തിലെ ‘പിതാവ്’ എന്ന രൂപകം നിലനിർത്തുന്നു; വംശാവലി-പാർപ്പിട പശ്ചാത്തലത്തിൽ അതിന് പൂർവികൻ, സ്ഥാപകൻ, അല്ലെങ്കിൽ പട്ടണവുമായി ബന്ധപ്പെട്ട പ്രമുഖൻ എന്ന അർഥമുണ്ടാകാം.
- source_word: קִרְיַת יְעָרִים
  choice: കിര്യത്ത്-യെയാരീം
  rationale: സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הָרֹאֶה
  choice: ഹരോവേ
  rationale: വംശാവലിയിൽ വ്യക്തിനാമമായി പ്രവർത്തിക്കുന്ന മസോററ്റിക് രൂപം ലിപ്യന്തരണം ചെയ്യുന്നു; ‘ദർശകൻ’ എന്നു വ്യാഖ്യാനിക്കുകയോ മറ്റൊരു പേരായി നിശ്ചയിക്കുകയോ ചെയ്യുന്നില്ല.
- source_word: חֲצִי הַמְּנֻחוֹת
  choice: മനഹാത്തുകാരിൽ പകുതി
  rationale: ‘മെനുഹോത്തിന്റെ/മെനുഹോത്തുകാരുടെ പകുതി’ എന്ന ദുർഗ്രഹമായ പ്രയോഗത്തെ, മനഹാത്തുമായി ബന്ധപ്പെട്ട ഒരു ജനവിഭാഗമോ കുലമോ സൂചിപ്പിക്കാമെന്ന സാധ്യതയോടെ അവതരിപ്പിക്കുന്നു; സ്ഥലനാമപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
