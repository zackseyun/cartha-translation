translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ദുർഗ്രഹമായ അവസാന പ്രയോഗത്തിന്റെ വ്യാകരണബന്ധവും അർഥവ്യാപ്തിയും അമിതമായി തീർപ്പാക്കാതെ പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
