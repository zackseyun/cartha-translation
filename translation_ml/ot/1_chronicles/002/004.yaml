  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/תָמָר֙ כַּלָּת֔/וֹ יָ֥לְדָה לּ֖/וֹ אֶת פֶּ֣רֶץ וְ/אֶת זָ֑רַח כָּל בְּנֵ֥י יְהוּדָ֖ה חֲמִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
translation:
  language: ml
  text: അവന്റെ മരുമകളായ താമാർ അവന് പേരെസിനെയും[a] സേരഹിനെയും ജന്മം നൽകി. യെഹൂദായുടെ പുത്രന്മാർ ആകെ അഞ്ചുപേരായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പേരെസ്’ എന്ന പേര് ചില ലിപ്യന്തരണരീതികളിൽ ‘പെരെത്സ്’ എന്നും എഴുതപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഏർ, ഓനാൻ, ശേലാ എന്നിവരോടൊപ്പം പേരെസിനെയും സേരഹിനെയും ചേർത്തുള്ള യെഹൂദായുടെ പുത്രന്മാരുടെ ആകെ എണ്ണമാണ് അഞ്ച്.
    reason: cross_reference
lexical_decisions:
- source_word: תָמָר
  choice: താമാർ
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: כַּלָּתוֹ
  choice: അവന്റെ മരുമകളായ
  rationale: כַּלָּה എന്നത് ഇവിടെ മകന്റെ ഭാര്യയെ, അഥവാ മരുമകളെ, സൂചിപ്പിക്കുന്നു; ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יָלְדָה
  choice: പ്രസവിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ സ്ത്രീലിംഗ ഏകവചനരൂപം; സന്താനജനനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: לוֹ
  choice: അവന്
  rationale: לְ പ്രയോഗം യെഹൂദായോടുള്ള പിതൃത്വബന്ധം സൂചിപ്പിക്കുന്നു; ഉറവിടത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: פֶּרֶץ
  choice: പേരെസ്
  rationale: വ്യക്തിനാമത്തിന്റെ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കിയ മലയാള ലിപ്യന്തരണം; പ്രചാരത്തിലുള്ള ‘പെരെസ്’ എന്ന രൂപത്തേക്കാൾ ആദ്യസ്വരത്തിന്റെ ദൈർഘ്യം പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: זָרַח
  choice: സേരഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; പദാന്ത്യത്തിലെ ח ശബ്ദത്തെ ‘ഹ്’ കൊണ്ട് സൂചിപ്പിക്കുന്നു.
- source_word: כָּל בְּנֵי יְהוּדָה
  choice: യെഹൂദായുടെ പുത്രന്മാർ ആകെ
  rationale: בְּנֵי എന്ന ലിംഗനിർദ്ദിഷ്ട ബന്ധപദം ‘പുത്രന്മാർ’ എന്നു നിലനിർത്തുകയും כָּל എന്ന സമഗ്രത ‘ആകെ’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: חֲמִשָּׁה
  choice: അഞ്ചുപേരായിരുന്നു
  rationale: മനുഷ്യരെ എണ്ണുന്ന മലയാളരീതിക്ക് അനുയോജ്യമായി സംഖ്യയെ വ്യക്തിസൂചകപ്രത്യയത്തോടെ നൽകുന്നു; ആകെ അഞ്ചു പുത്രന്മാർ എന്ന സംഗ്രഹം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പേരെസിനെയും സേരഹിനെയും ചേർത്ത ശേഷമുള്ള വംശാവലിസംഗ്രഹം
  choice: യെഹൂദായുടെ പുത്രന്മാർ ആകെ അഞ്ചുപേരായിരുന്നു.
  alternative: ഇവരായിരുന്നു യെഹൂദായുടെ പുത്രന്മാർ—ആകെ അഞ്ചുപേർ.
  rationale: എബ്രായത്തിലെ ലളിതമായ ആകെക്കണക്കിനെ നേരിട്ട് നിലനിർത്തുന്നു; ‘ഇവർ’ എന്ന സൂചന ഉറവിടത്തിൽ ഇല്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
- issue: ലിംഗനിർദ്ദിഷ്ട ബന്ധപദങ്ങൾ
  choice: മരുമകൾ; പുത്രന്മാർ
  alternative: വിവാഹബന്ധത്തിലുള്ള ബന്ധു; മക്കൾ
  rationale: ഉറവിടത്തിലെ כַּלָּה, בְּנֵי എന്നീ പദങ്ങളുടെ നിർദ്ദിഷ്ട ബന്ധവും ലിംഗവും നിഷ്പക്ഷമാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. ‘അവന് … പ്രസവിച്ചു’ എന്ന ഘടന എബ്രായത്തിലെ ബന്ധസൂചന നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്. പേരുകൾ എബ്രായ ഉറവിടത്തെ മുൻനിർത്തി ലിപ്യന്തരിച്ചു.
