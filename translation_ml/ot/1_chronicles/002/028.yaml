id: 1CH.2.28
reference: 1 Chronicles 2:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵי אוֹנָ֖ם שַׁמַּ֣י וְ/יָדָ֑ע וּ/בְנֵ֣י שַׁמַּ֔י נָדָ֖ב וַ/אֲבִישֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/028.yaml
  text: The sons of Onam were Shammai and Jada[a]. The sons of Shammai were Nadab and Abishur.
translation:
  language: ml
  text: ഓനാമിന്റെ പുത്രന്മാർ ശമ്മായിയും യാദായും ആയിരുന്നു. ശമ്മായിയുടെ പുത്രന്മാർ നാദാബും അബീശൂരും ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: വംശാവലിയുടെ ഈ പ്രയോഗത്തിൽ היה സന്തതികളെ പരിചയപ്പെടുത്തുന്ന ബന്ധകക്രിയയായി പ്രവർത്തിക്കുന്നു; ‘ആയിരുന്നു’ സ്വാഭാവികമായി അതിനെ പകരുന്നു.
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: ഇവിടെ അടുത്ത തലമുറയിലെ പുരുഷസന്തതികളെയാണ് പേരെടുത്ത് പറയുന്നത്; അതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: אוֹנָם
  choice: ഓനാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: שַׁמַּי
  choice: ശമ്മായി
  rationale: എബ്രായ വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; രണ്ടു പ്രാവശ്യവും ഒരേ രൂപം നിലനിർത്തി.
- source_word: יָדָע
  choice: യാദാ
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങളോടുകൂടിയ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കിയുള്ള ലിപ്യന്തരണം.
- source_word: וּבְנֵי
  choice: ശമ്മായിയുടെ പുത്രന്മാർ
  rationale: וְ അടുത്ത വംശശാഖയെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ പുതിയ വാക്യം ആരംഭിക്കുമ്പോൾ പ്രത്യേകമായ ‘കൂടാതെ/പിന്നെ’ ചേർക്കാതെ ആവർത്തിച്ച വംശാവലിസൂത്രം ഉപയോഗിക്കുന്നത് സ്വാഭാവികവും അർഥസമ്പൂർണ്ണവുമാണ്.
- source_word: נָדָב
  choice: നാദാബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲבִישׁוּר
  choice: അബീശൂർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾ മസോററ്റിക് എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു. രണ്ടാം ഉപവാക്യത്തിൽ എബ്രായത്തിലെ ബന്ധകമായ וְ മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യബന്ധത്തിൽ സൂചിതമാകുന്നതിനാൽ പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല; വ്യക്തതയ്ക്കായി ‘ആയിരുന്നു’ ആവർത്തിച്ചു.
