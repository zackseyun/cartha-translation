  source_fidelity: 'The Malayalam accurately represents the Hebrew genealogical statements: Onam''s sons are Shammai and Jada, and Shammai''s sons are Nadab and Abishur. The repeated copular sense of וַיִּהְיוּ is appropriately rendered by «ആയിരുന്നു». The initial conjunction of the second clause is naturally left implicit in Malayalam without loss of the genealogical relationship.'
