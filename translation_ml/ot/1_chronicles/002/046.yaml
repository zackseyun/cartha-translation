id: 1CH.2.46
reference: 1 Chronicles 2:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עֵיפָה֙ פִּילֶ֣גֶשׁ כָּלֵ֔ב יָֽלְדָ֛ה אֶת חָרָ֥ן וְ/אֶת מוֹצָ֖א וְ/אֶת גָּזֵ֑ז וְ/חָרָ֖ן הֹלִ֥יד אֶת גָּזֵֽז־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/046.yaml
  text: And Ephah[a], Caleb’s concubine, bore Haran, Moza, and Gazez; and Haran fathered Gazez.
translation:
  language: ml
  text: കാലേബിന്റെ ഉപഭാര്യയായ എഫാ ഹാരാൻ, മോസാ, ഗാസേസ് എന്നിവരെ പ്രസവിച്ചു; ഹാരാൻ ഗാസേസിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵיפָה
  choice: എഫാ
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: פִּילֶגֶשׁ
  choice: ഉപഭാര്യ
  rationale: അംഗീകൃതമായിരുന്നെങ്കിലും പ്രധാനഭാര്യയേക്കാൾ താഴ്ന്ന വൈവാഹിക പദവിയുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന്റെ അർഥം മാന്യവും വ്യക്തവുമായി നൽകുന്നു; ‘വെപ്പാട്ടി’ എന്ന പദത്തിനുണ്ടാകാവുന്ന അവഹേളനഭാവം ഒഴിവാക്കുന്നു.
- source_word: כָּלֵב
  choice: കാലേബ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ രൂപം ഉപയോഗിച്ചു.
- source_word: יָלְדָה
  choice: പ്രസവിച്ചു
  rationale: സ്ത്രീ കർത്താവായ വംശാവലിസന്ദർഭത്തിൽ ‘ജന്മം നൽകി’ എന്ന അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חָרָן
  choice: ഹാരാൻ
  rationale: രണ്ടിടത്തും ഒരേ വ്യക്തിനാമം ഒരേ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מוֹצָא
  choice: മോസാ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: גָּזֵז
  choice: ഗാസേസ്
  rationale: രണ്ടിടത്തും വ്യക്തിനാമം ഏകീകൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: הֹלִיד
  choice: പിതാവായി
  rationale: പുരുഷൻ കർത്താവായ വംശാവലിപ്രയോഗത്തിലെ causative അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘ജനിപ്പിച്ചു’ എന്നതിലെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: וְ
  choice: ഉം / ;
  rationale: പേരുകളുടെ പട്ടികയിൽ ‘ഉം’ എന്ന സംയോജകപ്രത്യയത്താലും രണ്ടു വാക്യഭാഗങ്ങൾക്കിടയിൽ അർധവിരാമത്താലും എബ്രായ സംയോജകത്തിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിച്ചു.
- source_word: אֶת
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന ഈ പദത്തിന് മലയാളത്തിൽ വേറിട്ട പദസമാനത ആവശ്യമില്ല; വാക്യഘടനയിലൂടെ ബന്ധം വ്യക്തമാകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിൽ വ്യക്തമായ പാഠഭേദമോ നിർബന്ധമായ വിശദീകരണമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല. ഇംഗ്ലീഷ് consultation layer-ൽ എഫായ്ക്കു പിന്നാലെ നൽകിയ [a] അടയാളവും ‘Haran became the father of Gazez’ എന്ന കുറിപ്പും തമ്മിൽ പൊരുത്തമില്ല; കൂടാതെ ആ കുറിപ്പ് ഇംഗ്ലീഷ് മുഖ്യവാചകത്തിന്റെ തന്നെ പര്യായമായതിനാൽ മലയാള കരടിൽ അത് പിന്തുടർന്നിട്ടില്ല.
