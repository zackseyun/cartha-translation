lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ ആവർത്തിത ഘടനയിൽ בְּנֵי നേരിട്ട് ‘പുത്രന്മാർ’ എന്നും വിശാലമായി ‘വംശജർ’ എന്നും സൂചിപ്പിക്കാം. ഇവിടെ കൂടുതൽ നേരിട്ടുള്ള പദമായ ‘പുത്രന്മാർ’ സ്വീകരിച്ചു; വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אַפַּיִם
  choice: അപ്പയീം
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: יִשְׁעִי
  choice: യിശ്ഈ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപം കഴിയുന്നത്ര നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שֵׁשָׁן
  choice: ശേശാൻ
  rationale: ഹീബ്രു വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אַחְלָי
  choice: അഹ്ലായി
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
