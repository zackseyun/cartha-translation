base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/031.yaml
  text: 'The sons of Appaim: Ishi[a]; and the sons of Ishi: Sheshan; and the sons of Sheshan: Ahlai.'
translation:
  language: ml
  text: 'അപ്പയീമിന്റെ പുത്രന്മാർ[a]: യിശ്ഈ; യിശ്ഈയുടെ പുത്രന്മാർ: ശേശാൻ; ശേശാന്റെ പുത്രന്മാർ: അഹ്ലായി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലെ ഓരോ ‘പുത്രന്മാർ’ എന്ന പ്രയോഗവും ‘വംശജർ’ എന്നും വിവർത്തനം ചെയ്യാം; വംശാവലികളിൽ എബ്രായയിലെ בְּנֵי എന്ന പദം വിശാലമായ വംശബന്ധത്തെയും സൂചിപ്പിക്കാം.
