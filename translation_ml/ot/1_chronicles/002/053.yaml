source:
  edition: WLC
  text: וּ/מִשְׁפְּחוֹת֙ קִרְיַ֣ת יְעָרִ֔ים הַ/יִּתְרִי֙ וְ/הַ/פּוּתִ֔י וְ/הַ/שֻּׁמָתִ֖י וְ/הַ/מִּשְׁרָעִ֑י מֵ/אֵ֗לֶּה יָצְאוּ֙ הַ/צָּ֣רְעָתִ֔י וְ/הָ/אֶשְׁתָּ֖אֻֽלִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
translation:
  language: ml
  text: 'കിര്യത്ത്-യെയാരീമിലെ വംശങ്ങൾ[a]: യിത്രിയർ, പൂതിയർ, ശുമാതിയർ, മിശ്രായർ. ഇവരിൽനിന്ന് സോരാത്യരും എഷ്ടാവോല്യരും ഉത്ഭവിച്ചു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുടുംബങ്ങൾ’; വംശാവലികളിൽ എബ്രായപദം സാധാരണയായി ഒരു ഗോത്രത്തിലോ വംശപരമ്പരയിലോ ഉൾപ്പെടുന്ന വിശാലമായ ബന്ധുഗണങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: പദശഃ ‘പുറപ്പെട്ടു’; ഇവിടെ മുമ്പ് പറഞ്ഞ വംശങ്ങളിൽനിന്ന് ഈ ജനവിഭാഗങ്ങൾ ഉത്ഭവിച്ചു എന്ന വംശാവലിപരമായ അർഥമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: വംശങ്ങൾ
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ഈ പദം അണുകുടുംബങ്ങളെക്കാൾ വിശാലമായ ബന്ധുഗണങ്ങളെയോ കുലശാഖകളെയോ സൂചിപ്പിക്കുന്നു; ആ സാമൂഹിക അർഥം ‘വംശങ്ങൾ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קִרְיַת יְעָרִים
  choice: കിര്യത്ത്-യെയാരീം
  rationale: സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തോട് അടുത്തതായി ലിപ്യന്തരിച്ചു.
- source_word: הַיִּתְרִי
  choice: യിത്ര്യർ
  rationale: ഒരു വംശത്തെയോ ജനവിഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ നാമം മലയാളത്തിലെ സമൂഹവാചക ബഹുവചനരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְהַפּוּתִי
  choice: പൂത്യർ
  rationale: വംശനാമം അർഥവിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാളരൂപത്തിൽ നൽകി.
- source_word: וְהַשֻּׁמָתִי
  choice: ശുമാത്യർ
  rationale: എബ്രായത്തിലെ പൂർണമായ വംശനാമരൂപം തിരിച്ചറിയാവുന്ന വിധം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְהַמִּשְׁרָעִי
  choice: മിശ്രയ്യർ
  rationale: വംശനാമത്തിന്റെ എബ്രായ വ്യഞ്ജന-സ്വരഘടന കഴിയുന്നത്ര നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: מֵאֵלֶּה
  choice: ഇവരിൽനിന്ന്
  rationale: മുമ്പ് പറഞ്ഞ വംശങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യക്തി/ജനസമൂഹ സൂചന മലയാളത്തിൽ വ്യക്തമാകാൻ ‘ഇവർ’ എന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: יָצְאוּ
  choice: ഉത്ഭവിച്ചു
  rationale: പദശഃ ‘പുറപ്പെട്ടു’ എന്നാണെങ്കിലും ഇവിടെ വംശാവലിപരമായ ഉത്ഭവമാണ് സന്ദർഭാർഥം; അതിനാൽ വ്യാഖ്യാനം അതിരുകടക്കാതെ സ്വാഭാവികമായ ‘ഉത്ഭവിച്ചു’ സ്വീകരിച്ചു.
- source_word: הַצָּרְעָתִי
  choice: സോരാത്യർ
  rationale: സോരാ എന്ന സ്ഥലവുമായി ബന്ധപ്പെട്ട ജനവിഭാഗനാമം എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וְהָאֶשְׁתָּאֻלִי
  choice: എഷ്ടാവോല്യർ
  rationale: എഷ്ടാവോൽ എന്ന സ്ഥലത്തിൽനിന്നുള്ള ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന നാമം, സ്ഥലനാമബന്ധം നിലനിർത്തി ലിപ്യന്തരിച്ചു.
