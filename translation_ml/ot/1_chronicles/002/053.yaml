translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സുഗമവുമായ മലയാളം. സ്ഥലനാമങ്ങളും വംശനാമങ്ങളും വിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; സമൂഹങ്ങളെ സൂചിപ്പിക്കാൻ മലയാളത്തിലെ ആദര/സമൂഹ ബഹുവചനമായ ‘-ർ’ ഉപയോഗിച്ചു.
