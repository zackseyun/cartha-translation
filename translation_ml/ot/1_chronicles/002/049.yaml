id: 1CH.2.49
reference: 1 Chronicles 2:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֗לֶד שַׁ֚עַף אֲבִ֣י מַדְמַנָּ֔ה אֶת שְׁוָ֛א אֲבִ֥י מַכְבֵּנָ֖ה וַ/אֲבִ֣י גִבְעָ֑א וּ/בַת כָּלֵ֖ב עַכְסָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/049.yaml
  text: Shepha fathered Sheva, the father of Machbenah and the father of Gibea; and Caleb’s daughter was Acsah.
translation:
  language: ml
  text: അവൾ മദ്മന്നായുടെ പിതാവായ ശാഫിനെയും മക്ബേനയുടെയും ഗിബെയായുടെയും പിതാവായ ശേവയെയും പ്രസവിച്ചു.[a] കാലേബിന്റെ മകൾ അക്സാ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവൾ” എന്നതിന്റെ കർത്താവ് മുൻവാക്യത്തിൽ പരാമർശിച്ച മാക്കായാണ് എന്നു സാധാരണയായി മനസ്സിലാക്കുന്നു; ഹീബ്രു ക്രിയ സ്ത്രീലിംഗത്തിലാണ്. “പിതാവ്” എന്നത് ഈ വംശാവലിസന്ദർഭത്തിൽ പൂർവികനെയോ സ്ഥാപകനെയോ സൂചിപ്പിക്കാം.
    reason: സ്ത്രീലിംഗ ക്രിയയുടെ മുൻസന്ദർഭ-ആശ്രിത കർത്താവിനെ വ്യക്തമാക്കുകയും אָב (“father”) എന്ന വംശാവലിപ്രയോഗത്തിന്റെ സാധ്യതയുള്ള വ്യാപ്തി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: שַׁעַף
  choice: ശയഫ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജനഘടനയ്ക്കടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: אֲבִי
  choice: പിതാവ് / പിതാവായ
  rationale: വംശാവലി-ഭൂനാമസന്ദർഭത്തിൽ 'father of' എന്ന പദപ്രയോഗം സ്ഥാപകനെയോ പൂർവികനെയോ സൂചിപ്പിക്കാമെങ്കിലും, മൂലപാഠത്തിന്റെ രൂപം സംരക്ഷിക്കാൻ 'പിതാവ്' നിലനിർത്തി.
- source_word: מַדְמַנָּה
  choice: മദ്മന്ന
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: שְׁוָא
  choice: ശെവ
  rationale: മസോററ്റിക് സ്വരസൂചന അനുസരിച്ചുള്ള വ്യക്തിനാമ ലിപ്യന്തരണം.
- source_word: מַכְבֵּנָה
  choice: മഖ്ബേന
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ വ്യഞ്ജനങ്ങളും സ്വരങ്ങളും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
- source_word: גִבְעָא
  choice: ഗിബെയ
  rationale: അവസാനത്തെ ആലഫ് സൂചിപ്പിക്കുന്ന രൂപം പരിഗണിച്ച് നൽകിയ സ്ഥലനാമ ലിപ്യന്തരണം.
- source_word: עַכְסָה
  choice: അക്സാ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ പരമ്പരാഗതവും മൂലരൂപത്തോട് അടുത്തതുമായ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: וַתֵּלֶד എന്ന സ്ത്രീലിംഗ ക്രിയയുടെ കർത്താവ്
  choice: മുൻവാക്യത്തിൽ പരാമർശിച്ച മാക്കയെ സൂചിപ്പിക്കുന്നതായി മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി 'അവൻ ... ജനിപ്പിച്ചു' എന്നു നൽകി; പാഠപ്രശ്നം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
  alternative: “മാക്കാ ... പ്രസവിച്ചു” എന്നു മുൻവാക്യത്തിലെ സ്ത്രീയെ വ്യക്തമായി കർത്താവാക്കുക.
  rationale: ഹീബ്രു ക്രിയ സ്ത്രീലിംഗമാണെങ്കിലും, ഈ വാക്യത്തിന്റെ വംശാവലി ഘടനയും പാരമ്പര്യ വ്യാഖ്യാനവും സങ്കീർണമാണ്. മുഖ്യവാചകത്തിൽ ശയഫിനെ വംശജനനത്തിന്റെ കേന്ദ്രമായി വായിക്കുന്ന അർത്ഥം നൽകുകയും യഥാർഥ വ്യാകരണ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
- issue: אֶת שְׁוָא אֲבִי מַכְבֵּנָה וַאֲבִי גִבְעָא എന്ന ഘടന
  choice: ശെവയെ മഖ്ബേനയുടെ പിതാവായി മാത്രം വായിച്ച്, 'ഗിബെയയുടെ പിതാവ്' എന്ന പേരില്ലാത്ത മറ്റൊരു മകനെ ശയഫിന്റെ രണ്ടാമത്തെ സന്താനമായി നിലനിർത്തി.
  alternative: ശെവ തന്നെയാണ് മഖ്ബേനയുടെയും ഗിബെയയുടെയും പിതാവ് എന്നു വായിക്കുക.
  rationale: രണ്ടാമത്തെ אֲבִי-യ്ക്ക് മുമ്പുള്ള וַ എന്ന ബന്ധകം പേരില്ലാത്ത സമാന്തര വ്യക്തിയെ സൂചിപ്പിക്കാമെന്ന ഹീബ്രു ഘടന സംരക്ഷിക്കുന്നു; എന്നാൽ പദക്രമം മറ്റൊരു വായനയ്ക്കും ഇടനൽകുന്നതിനാൽ അടിക്കുറിപ്പിൽ ബദൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പമുള്ള മലയാളം. വംശാവലിയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തി; അപൂർവ നാമങ്ങൾ ഹീബ്രുവിനടുത്ത് ലിപ്യന്തരിച്ചു. സ്ഥലങ്ങളുടെ 'പിതാവ്' എന്ന സെമിറ്റിക് പ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ സംരക്ഷിച്ചു.
