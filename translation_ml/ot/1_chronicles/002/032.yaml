  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തി; ‘പുത്രന്മാരില്ലാതെ’ എന്നത് പുരുഷവംശസന്തതിയെക്കുറിച്ചുള്ള കൃത്യമായ പ്രസ്താവനയായി സൂക്ഷിച്ചു.
