  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֤י יָדָע֙ אֲחִ֣י שַׁמַּ֔י יֶ֖תֶר וְ/יוֹנָתָ֑ן וַ/יָּ֥מָת יֶ֖תֶר לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
translation:
  language: ml
  text: 'ശമ്മായിയുടെ സഹോദരനായ യാദയുടെ പുത്രന്മാർ: യേതെരും യോനാഥാനും. യേതെർ പുത്രന്മാരില്ലാതെ മരിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയിൽ ഒരു പുതിയ ഉപവിഭാഗം അവതരിപ്പിക്കുന്ന בֵּן എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപം. തുടക്കത്തിലെ വാവ് മലയാളത്തിൽ പ്രത്യേകം പകർത്താതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: יָדָע
  choice: യാദ
  rationale: ഹീബ്രായ വ്യക്തിനാമമായ יָדָע-യുടെ ശബ്ദസമീപമായ മലയാള ലിപ്യന്തരണം.
- source_word: אֲחִי שַׁמַּי
  choice: ശമ്മായിയുടെ സഹോദരനായ
  rationale: സംയുക്തബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു; אָח ഇവിടെ നേരിട്ടുള്ള കുടുംബബന്ധമായ ‘സഹോദരൻ’ എന്നാണ്.
- source_word: יֶתֶר
  choice: യേതെർ
  rationale: രണ്ടിടത്തും ഒരേ വ്യക്തിനാമം ഒരേ രീതിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְיוֹנָתָן
  choice: യോനാഥാനും
  rationale: വ്യക്തിനാമത്തോടൊപ്പമുള്ള ഹീബ്രായ സംയോജകവും മലയാളത്തിലെ ‘-ഉം’ ഉപയോഗിച്ച് പകർത്തി.
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: വംശാവലിയുടെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്ന wayyiqtol രൂപത്തിന് സ്വാഭാവികമായ ഭൂതകാലപ്രയോഗം.
- source_word: לֹא בָנִים
  choice: പുത്രന്മാരില്ലാതെ
  rationale: അക്ഷരാർഥത്തിൽ ‘പുത്രന്മാർ ഇല്ല’ എന്ന അപൂർണവാക്യരൂപം; വംശാവലി സന്ദർഭത്തിലെ ആശയം വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു, പുത്രിമാരില്ലായിരുന്നു എന്ന് അതിലധികമായി പ്രസ്താവിക്കുന്നില്ല.
