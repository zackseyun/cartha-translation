id: 1CH.2.1
reference: 1 Chronicles 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֖לֶּה בְּנֵ֣י יִשְׂרָאֵ֑ל רְאוּבֵ֤ן שִׁמְעוֹן֙ לֵוִ֣י וִ/יהוּדָ֔ה יִשָׂשכָ֖ר וּ/זְבֻלֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/001.yaml
  text: 'These are the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: ml
  text: 'ഇസ്രായേലിന്റെ പുത്രന്മാർ ഇവരാണ്: രൂബേൻ, ശിമെയോൻ, ലേവി, യെഹൂദാ, യിസ്സാഖാർ, സെബൂലൂൻ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവരാണ്
  rationale: പേരുകളുടെ പട്ടിക അവതരിപ്പിക്കുന്ന ബഹുവചന സൂചകപദം; മലയാളത്തിൽ മനുഷ്യരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക വർത്തമാനകാല പ്രയോഗം.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: ഇവിടെ യാക്കോബ്/ഇസ്രായേലിന്റെ ആൺമക്കളെയാണ് പേരെടുത്ത് പറയുന്നത്; അതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: എബ്രായപാഠത്തിലെ ഉടമ്പടിനാമം അതേപടി നിലനിർത്തുന്നു; ഇവിടെ അത് പിതാമഹനായ യാക്കോബിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതവും എബ്രായ ഉച്ചാരണത്തോട് അടുത്തതുമായ രൂപം.
- source_word: שִׁמְעוֹן
  choice: ശിമെയോൻ
  rationale: എബ്രായ നാമത്തിന് അനുയോജ്യമായ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: לֵוִי
  choice: ലേവി
  rationale: സ്ഥിരപ്രചാരത്തിലുള്ള മലയാള രൂപം.
- source_word: וִיהוּדָה
  choice: യെഹൂദാ
  rationale: പട്ടികയിൽ മലയാളം സ്വാഭാവികമായി വിരാമചിഹ്നങ്ങൾ ഉപയോഗിക്കുന്നതിനാൽ ഇവിടെ വാവിനെ പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തേണ്ടതില്ല; നാമത്തിന് പരിചിതമായ മലയാള രൂപം ഉപയോഗിച്ചു.
- source_word: יִשָּׂשכָר
  choice: യിസ്സാഖാർ
  rationale: എബ്രായ നാമത്തിന്റെ പരമ്പരാഗത മലയാള ലിപ്യന്തരണം.
- source_word: וּזְבֻלוּן
  choice: സെബൂലൂൻ
  rationale: എബ്രായ സ്വരവിന്യാസത്തോട് അടുത്ത, മലയാളത്തിൽ പരിചിതമായ നാമരൂപം; പട്ടികയുടെ അവസാനത്തിലെ വാവ് മലയാളത്തിലെ വിരാമഘടനയിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തി; അനാവശ്യമായ വ്യാഖ്യാനപദങ്ങൾ ചേർത്തിട്ടില്ല.
