  text: 'The sons of Ram: Jerahmeel the firstborn[a], Maaz, Jamin, and Eker.'
translation:
  language: ml
  text: 'രാമിന്റെ പുത്രന്മാർ: ആദ്യജാതനായ യെരഹ്മെയേൽ, മാഅസ്, യാമീൻ, ഏകർ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിന്റെ പദാനുപദരൂപം: “രാമിന്റെ പുത്രന്മാർ ആദ്യജാതനായ യെരഹ്മെയേൽ, മാഅസ്, യാമീൻ, ഏകർ എന്നിവരായിരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: പട്ടിക അവതരിപ്പിക്കുന്നതിനായി ദ്വിബിന്ദുവിലൂടെ സൂചിപ്പിച്ചു
  rationale: വംശാവലിപ്പട്ടികയെ പരിചയപ്പെടുത്തുന്ന ഈ ക്രിയയുടെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ ദ്വിബിന്ദുകൊണ്ട് വ്യക്തമാക്കാം; അങ്ങനെ എബ്രായത്തിലെ അസ്തിത്വ/പട്ടികപ്പെടുത്തൽ ഭാവം അസ്വാഭാവികമായ പദാനുപദ വിവർത്തനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: ഈ വംശാവലിസന്ദർഭത്തിൽ പരാമർശിക്കപ്പെടുന്നവർ പുരുഷസന്തതികളായതിനാൽ നേരിട്ടും കൃത്യവുമായ പദം.
- source_word: רָם
  choice: രാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בְּכוֹר
  choice: ആദ്യജാതനായ
  rationale: യെരഹ്മെയേലിനെ രാമിന്റെ ആദ്യജാതനായി വിശേഷിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: יְרַחְמְאֵל
  choice: യെരഹ്മെയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തോട് ചേർന്നുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מַעַץ
  choice: മായാസ്
  rationale: മലയാളത്തിൽ ഉച്ചരിക്കാൻ സ്വാഭാവികമായി എബ്രായ വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: יָמִין
  choice: യാമീൻ
  rationale: ഇവിടെ സാധാരണ നാമത്തിന്റെ അർഥം വിവർത്തനം ചെയ്യാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: עֵקֶר
  choice: ഏക്കേർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്നുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
