  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ‘മരിച്ചു’, ‘ഭാര്യയായി സ്വീകരിച്ചു’, ‘പ്രസവിച്ചു’ എന്നീ നേരിട്ടുള്ള പദങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പുകളുടെ വിഷയബന്ധം കൃത്യമായി സൂചിപ്പിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ [b] പേര് കഴിഞ്ഞും [a] വിവാഹപ്രയോഗം കഴിഞ്ഞും വരുന്നു.
