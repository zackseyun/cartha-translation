source:
  edition: WLC
  text: וַ/תָּ֖מָת עֲזוּבָ֑ה וַ/יִּֽקַּֽח ל֤/וֹ כָלֵב֙ אֶת אֶפְרָ֔ת וַ/תֵּ֥לֶד ל֖/וֹ אֶת חֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/019.yaml
  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
translation:
  language: ml
  text: അസൂബാ മരിച്ചു. തുടർന്ന് കാലേബ് എഫ്രാത്തിനെ[b] വിവാഹം കഴിച്ചു[a]. അവൾ അവന് ഹൂരിനെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘കാലേബ് എഫ്രാത്തിനെ തനിക്കായി എടുത്തു.’ ഒരു സ്ത്രീയെ ‘എടുക്കുക’ എന്നത് വിവാഹത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: മറ്റു ബന്ധപ്പെട്ട സ്ഥലങ്ങളിൽ ഈ പേര് ‘എഫ്രാത്താ’ എന്ന രൂപത്തിലും കാണപ്പെടുന്നു; എന്നാൽ ഇവിടെ ഹീബ്രു പാഠത്തിലുള്ളത് ചുരുങ്ങിയ ‘എഫ്രാത്ത്’ എന്ന രൂപമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ സാധാരണവും നേരിട്ടുള്ളതുമായ അർഥം; മൂലപാഠത്തിലെ ലാളിത്യവും വ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: עֲזוּבָה
  choice: അസൂബാ
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיִּקַּח לוֹ
  choice: ഭാര്യയായി സ്വീകരിച്ചു
  rationale: ഒരു സ്ത്രീയെ കർമമായി സ്വീകരിക്കുന്ന לקח ഇവിടെ വിവാഹത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. മലയാളത്തിൽ വിവാഹാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അതേസമയം ‘സ്വീകരിച്ചു’ എന്നത് മൂലത്തിലെ ‘എടുത്തു’ എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം ഭാഗികമായി നിലനിർത്തുന്നു.
- source_word: כָלֵב
  choice: കാലേബ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- source_word: אֶפְרָת
  choice: എഫ്രാത്ത്
  rationale: ഈ വാക്യത്തിലെ ചുരുങ്ങിയ ഹീബ്രു നാമരൂപം ലിപ്യന്തരണം ചെയ്തു; ബന്ധപ്പെട്ട ദീർഘരൂപമായ ‘എഫ്രാത്താ’ ഇവിടെ സ്വീകരിച്ചില്ല.
- source_word: וַתֵּלֶד לוֹ
  choice: അവൾ അവന് ... പ്രസവിച്ചു
  rationale: ילד എന്ന പ്രസവക്രിയയും לּוֹ എന്ന പരോക്ഷ കർമവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: חוּר
  choice: ഹൂർ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
