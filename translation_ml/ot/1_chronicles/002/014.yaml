source:
  edition: WLC
  text: נְתַנְאֵל֙ הָֽ/רְבִיעִ֔י רַדַּ֖י הַ/חֲמִישִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/014.yaml
  text: Nethanel the fourth, Raddai the fifth.
translation:
  language: ml
  text: നാലാമൻ നെഥനേൽ, അഞ്ചാമൻ രദ്ദായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְתַנְאֵל
  choice: നെഥനേൽ
  rationale: വ്യക്തിനാമം അർഥവിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തെ മലയാളലിപിയിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: הָרְבִיעִי
  choice: നാലാമൻ
  rationale: നിശ്ചയാർഥക ഘടകത്തോടുകൂടിയ ക്രമസംഖ്യാവിശേഷണം വംശാവലിയിൽ പുരുഷന്റെ ജനനക്രമം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നാലാമൻ’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: רַדַּי
  choice: രദ്ദായി
  rationale: ദാഗേഷ് സൂചിപ്പിക്കുന്ന ഇരട്ട വ്യഞ്ജനവും അവസാന ദ്വിസ്വരവും നിലനിർത്തി വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הַחֲמִישִׁי
  choice: അഞ്ചാമൻ
  rationale: മുൻപത്തെ ക്രമസംഖ്യയ്ക്കു സമാന്തരമായി വംശാവലിയിലെ അഞ്ചാം സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; പുരുഷനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം സ്വീകരിച്ചു.
theological_decisions: []
