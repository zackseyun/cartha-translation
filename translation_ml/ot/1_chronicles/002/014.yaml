  register: ആധുനിക നിലവാരമലയാളത്തിൽ, മൂലത്തിലെ സംക്ഷിപ്തമായ വംശാവലിപ്പട്ടികാശൈലിയും സമാന്തരഘടനയും നിലനിർത്തിയിരിക്കുന്നു.
