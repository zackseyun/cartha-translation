  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֤י כָלֵב֙ אֲחִ֣י יְרַחְמְאֵ֔ל מֵישָׁ֥ע בְּכֹר֖/וֹ ה֣וּא אֲבִי זִ֑יף וּ/בְנֵ֥י מָרֵשָׁ֖ה אֲבִ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
translation:
  language: ml
  text: 'യെരഹ്മെയേലിന്റെ സഹോദരനായ കാലേബിന്റെ പുത്രന്മാർ: അവന്റെ ആദ്യജാതനായ മേശ, അവൻ സീഫിന്റെ പിതാവായിരുന്നു[b]; മാരേശയുടെ പുത്രന്മാർ—ഹെബ്രോന്റെ പിതാവ്[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അവസാന ഉപവാക്യത്തിലെ എബ്രായ വാക്യഘടന ദുഷ്കരമാണ്. മസോററ്റിക് പാഠത്തിന്റെ അക്ഷരാർഥം: ‘മാരേശയുടെ പുത്രന്മാരും, ഹെബ്രോന്റെ പിതാവ്.’ ചിലർ ഇതിനെ ‘ഹെബ്രോന്റെ പിതാവായ മാരേശ’ എന്നു മനസ്സിലാക്കുന്നു; മറ്റുചിലർ മൂലത്തിലെ പദക്രമം അതേപടി നിലനിർത്തുന്നു.'
    reason: alternative_reading
  - marker: b
    text: ദിനവൃത്താന്തങ്ങളിൽ ‘പിതാവ്’ എന്നത് ജൈവിക പിതാവിനെ മാത്രമല്ല, പൂർവികൻ, കുലത്തലവൻ, അല്ലെങ്കിൽ ഒരു സ്ഥലവുമായി ബന്ധപ്പെട്ട സ്ഥാപകൻ എന്നിവരെയും സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי כָלֵב
  choice: കാലേബിന്റെ പുത്രന്മാർ
  rationale: വംശാവലികളിൽ പതിവായ ‘പുത്രന്മാർ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് നേരിട്ടുള്ള പുത്രന്മാരെയോ വിശാലമായ സന്തതിപരമ്പരയെയോ സൂചിപ്പിക്കാം.
- source_word: אֲחִי יְרַחְמְאֵל
  choice: യെരഹ്മെയേലിന്റെ സഹോദരനായ
  rationale: കാലേബിനെ വിശേഷിപ്പിക്കുന്ന ബന്ധസൂചക ഘടകം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מֵישָׁע בְּכֹרוֹ
  choice: അവന്റെ ആദ്യജാതനായ മേശ
  rationale: בכור എന്ന പദത്തിന്റെ ജനനക്രമവും പദവിയും ഉൾക്കൊള്ളുന്ന അർഥം ‘ആദ്യജാതൻ’ സംരക്ഷിക്കുന്നു.
- source_word: אֲבִי זִיף
  choice: സീഫിന്റെ പിതാവ്
  rationale: ‘പിതാവ്’ എന്ന മൂലരൂപം നിലനിർത്തുന്നു; ദിനവൃത്താന്തങ്ങളിൽ ഇത് ജൈവിക പിതാവിനുപുറമേ പൂർവികൻ, കുലത്തലവൻ, അല്ലെങ്കിൽ ഒരു സ്ഥലവുമായി ബന്ധപ്പെട്ട സ്ഥാപകൻ എന്നും അർഥമാക്കാം.
- source_word: וּבְנֵי מָרֵשָׁה אֲבִי חֶבְרוֹן
  choice: ഹെബ്രോന്റെ പിതാവായ മാരേശയുടെ പുത്രന്മാരും
  rationale: മസോററ്റിക് പാഠത്തിലെ പദങ്ങളെ നിലനിർത്തിക്കൊണ്ട്, ‘ഹെബ്രോന്റെ പിതാവ്’ എന്നത് മാരേശയോടു ചേർത്ത് മലയാളത്തിൽ വായനാസൗകര്യം നൽകുന്നു; മൂലവാക്യത്തിന്റെ ദുഷ്കരത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വംശാവലിയിൽ ‘പിതാവ്’ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ‘പിതാവ്’ എന്ന പദം തന്നെ നിലനിർത്തി
  alternative: ‘സ്ഥാപകൻ’ അല്ലെങ്കിൽ ‘പൂർവികൻ’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തുക
  rationale: אָב എന്ന പദം ജൈവികബന്ധമോ കുല/സ്ഥലബന്ധമോ സൂചിപ്പിക്കാമെന്ന യഥാർഥ അനിശ്ചിതത്വം നിർബന്ധമായി തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. പേരുകൾ മലയാള ബൈബിൾ പ്രയോഗത്തിന് അനുയോജ്യമായി ലിപ്യന്തരിച്ചു. മൂലത്തിലെ ബന്ധസൂചനകളും അവസാന ഉപവാക്യത്തിലെ ദുഷ്കരതയും അനാവശ്യമായി വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ സൂക്ഷിച്ചു.
