id: 1CH.2.47
reference: 1 Chronicles 2:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֖י יָהְדָּ֑י רֶ֧גֶם וְ/יוֹתָ֛ם וְ/גֵישָׁ֥ן וָ/פֶ֖לֶט וְ/עֵיפָ֥ה וָ/שָֽׁעַף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/047.yaml
  text: 'The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.'
translation:
  language: ml
  text: 'യഹ്ദായിയുടെ പുത്രന്മാർ: റെഗെം, യോഥാം, ഗേശാൻ, പെലെത്, ഏഫാ, ശാഅഫ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: בְנֵי എന്നത് ‘പുത്രന്മാർ’ എന്നർഥമുള്ള construct plural ആണ്; ഇവിടെ നേരിട്ടുള്ള വംശാവലിപ്പട്ടികയെ പരിചയപ്പെടുത്തുന്നതിനാൽ അതേ അർഥം നിലനിർത്തി. വാക്യാരംഭത്തിലെ וּ സ്വാഭാവികമായ മലയാള പട്ടികാശൈലിയിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: יָהְדָּי
  choice: യഹ്ദായി
  rationale: വ്യക്തിനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: רֶגֶם
  choice: രേഗെം
  rationale: വ്യക്തിനാമം; എബ്രായ സ്വരരൂപം പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: יוֹתָם
  choice: യോഥാം
  rationale: വ്യക്തിനാമം; ആരംഭത്തിലെ yod-നെ ‘യ’ എന്നും ת-യെ ഇവിടെ ‘ഥ’ എന്നും പ്രതിനിധീകരിക്കുന്ന പരിചിതമായ ബൈബിൾ-മലയാള ലിപ്യന്തരണം.
- source_word: גֵישָׁן
  choice: ഗേശാൻ
  rationale: വ്യക്തിനാമം; എബ്രായ നാമത്തിന്റെ സ്വര-വ്യഞ്ജനക്രമത്തോട് അടുത്ത സ്വാഭാവിക മലയാളരൂപം.
- source_word: פֶלֶט
  choice: പേലെത്ത്
  rationale: വ്യക്തിനാമം; അവസാനത്തെ tav-നെ മലയാള ബൈബിൾ നാമരീതിയിൽ ‘ത്ത്’ ആയി ലിപ്യന്തരിച്ചു.
- source_word: עֵיפָה
  choice: ഏഫാ
  rationale: ഇവിടെ അളവുപാത്രത്തെ സൂചിപ്പിക്കുന്ന സാധാരണനാമമല്ല, വ്യക്തിനാമമാണ്; അതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: שָׁעַף
  choice: ശാഅഫ്
  rationale: വ്യക്തിനാമം; നടുവിലെ ע എന്ന കണ്ഠ്യവ്യഞ്ജനത്തിന്റെ സാന്നിധ്യം പൂർണമായി ഇല്ലാതാക്കാതെ ‘അ’ ഉപയോഗിച്ച് ശാഅഫ് എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി-പട്ടികാശൈലി. മൂലത്തിലെ ബന്ധവും പേരുകളുടെ ക്രമവും കൃത്യമായി നിലനിർത്തി; വിശദീകരണം ആവശ്യപ്പെടുന്ന പാഠഭേദമോ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വമോ ഈ വാക്യത്തിൽ ഇല്ല.
