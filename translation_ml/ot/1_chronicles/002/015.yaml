lexical_decisions:
- source_word: אֹצֶם
  choice: ഓസെം
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ പകർത്തി.
- source_word: הַשִּׁשִּׁי
  choice: ആറാമൻ
  rationale: വംശാവലിയിലെ പുത്രന്മാരുടെ ക്രമം സൂചിപ്പിക്കുന്ന നിർദിഷ്ട ക്രമസംഖ്യയാണ്; പുരുഷവ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: דָּוִיד
  choice: ദാവീദ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം നിലനിർത്തി.
- source_word: הַשְּׁבִעִי
  choice: ഏഴാമൻ
  rationale: മുൻപത്തെ ക്രമസംഖ്യയ്ക്കു സമാന്തരമായി, വംശാവലിപ്പട്ടികയിൽ ദാവീദിന്റെ സ്ഥാനം സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ ക്രമസംഖ്യാരൂപം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: സംക്ഷിപ്തമായ എബ്രായ വംശാവലിശൈലി നിലനിർത്തിക്കൊണ്ട്, സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നാമപദവാക്യഘടന ഉപയോഗിച്ചു. മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്ത ‘മകൻ’ എന്ന പദം മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ വിശദീകരണക്കുറിപ്പിൽ മാത്രം നൽകി.
