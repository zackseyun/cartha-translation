translation:
  language: ml
  text: ഉസ്സി സെരഹ്യാവിന്റെ പിതാവായിരുന്നു; സെരഹ്യാവ് മെരായോത്തിന്റെ പിതാവായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עֻזִּי
  choice: ഉസ്സി
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് ചേർന്നും മലയാളത്തിൽ സ്വാഭാവികമായും ലിപ്യന്തരിച്ചു; തുടക്കത്തിലെ וְ വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ ഈ ഒറ്റവാക്യത്തിൽ പ്രത്യേകം നൽകിയില്ല.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയിൽ ഹിഫീൽ രൂപം ‘ജനിപ്പിച്ചു/പിതാവായി’ എന്ന ആശയം നൽകുന്നു. സംക്ഷിപ്തവും ആധുനിക മലയാളത്തിൽ വ്യക്തവുമായ ‘ജനിപ്പിച്ചു’ തിരഞ്ഞെടുത്തു.
- source_word: אֶת
  choice: '[പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: നിശ്ചിത കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകത്തിന് മലയാളത്തിൽ പ്രത്യേക പദസമാനത ആവശ്യമില്ല; സ്വാഭാവിക വാക്യക്രമത്തിലൂടെ അർഥം പ്രകടമാകുന്നു.
- source_word: זְרַחְיָה
  choice: സെരഹ്യാവ്
  rationale: വ്യക്തിനാമം എബ്രായ രൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു; കർമസ്ഥാനത്ത് ‘സെരഹ്യാവിനെ’ എന്നും കർത്തൃസ്ഥാനത്ത് ‘സെരഹ്യാവ്’ എന്നും സ്വാഭാവിക വിഭക്തിരൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: וּֽ/זְרַֽחְיָה
  choice: സെരഹ്യാവ്
  rationale: ആവർത്തിക്കുന്ന വ്യക്തിനാമം നിലനിർത്തി വംശാവലിശൃംഖല വ്യക്തമാക്കി. മലയാളത്തിൽ അർധവിരാമത്തിനു ശേഷമുള്ള ബന്ധം വ്യക്തമായതിനാൽ וּ (‘ഉം/പിന്നെ’) വേറൊരു പദമായി ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: מְרָיֽוֹת
  choice: മെരായോത്ത്
  rationale: വ്യക്തിനാമം എബ്രായ വ്യഞ്ജന-സ്വരരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വംശാവലിയുടെ ആവർത്തനഘടനയും സംക്ഷിപ്തതയും നിലനിർത്തി; പുരാതന ഭാവമുള്ള ‘ജനിപ്പാൻ ഇടയായി’ പോലുള്ള പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
