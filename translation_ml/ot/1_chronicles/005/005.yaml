  text: מִיכָ֥ה בְנ֛/וֹ רְאָיָ֥ה בְנ֖/וֹ בַּ֥עַל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/005.yaml
  text: Micah his son[a], Reaiah his son, Baal his son.
translation:
  language: ml
  text: മീഖാ അവന്റെ മകൻ; രെയായാ അവന്റെ മകൻ; ബാൽ[a] അവന്റെ മകൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ബാൽ’ എന്നത് വംശാവലിയിലെ ഒരു വ്യക്തിനാമമാണ്; ‘യജമാനൻ’ എന്നർഥമുള്ള പദവിയായി വിവർത്തനം ചെയ്തതല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָה
  choice: മീഖാ
  rationale: വ്യക്തിനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികവുമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְנֹו
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയത്തോടുകൂടിയ ഈ പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘അവന്റെ മകൻ’ എന്നാണ്; വംശാവലിയുടെ ആവർത്തനഘടനയും ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: רְאָיָה
  choice: രെയായാ
  rationale: വംശാവലിയിലെ വ്യക്തിനാമമായതിനാൽ എബ്രായ രൂപത്തെ അനുഗമിച്ച് ലിപ്യന്തരണം ചെയ്തു.
- source_word: בַּעַל
  choice: ബാൽ
  rationale: ഇവിടെ വംശാവലിയിൽ വരുന്ന വ്യക്തിനാമമായതിനാൽ ‘യജമാനൻ’ എന്ന പദവിയായി വിവർത്തനം ചെയ്യാതെ പേരായി ലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: בַּעַל എന്നത് പദവിയായോ ദേവതാസൂചനയായോ വിവർത്തനം ചെയ്യണമോ, വ്യക്തിനാമമായി നിലനിർത്തണമോ
  choice: ‘ബാൽ’ എന്ന വ്യക്തിനാമമായി നിലനിർത്തി
  alternative: ‘യജമാനൻ’ അഥവാ ‘കർത്താവ്’ എന്ന പദവിയായി വിവർത്തനം ചെയ്യുക
  rationale: ഈ പദം മറ്റു വ്യക്തിനാമങ്ങൾക്കൊപ്പം വംശാവലിശൃംഖലയിൽ നിൽക്കുന്നതിനാൽ ഇവിടെ വ്യക്തിനാമമായാണ് മനസ്സിലാക്കേണ്ടത്. പദവിയായി വിവർത്തനം ചെയ്യുന്നത് വാക്യഘടനയും സാഹിത്യരൂപവും മറച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനഘടന നിലനിർത്താൻ ഓരോ പേരിനും ശേഷം ‘അവന്റെ മകൻ’ ആവർത്തിക്കുകയും ഘടകങ്ങൾ അർധവിരാമങ്ങളാൽ വേർതിരിക്കുകയും ചെയ്തു.
