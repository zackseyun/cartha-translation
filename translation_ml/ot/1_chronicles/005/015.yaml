source:
  edition: WLC
  text: אֲחִי֙ בֶּן עַבְדִּיאֵ֣ל בֶּן גּוּנִ֔י רֹ֖אשׁ לְ/בֵ֥ית אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/015.yaml
  text: Ahi son of Abdiel[a], son of Guni, was head of their fathers’ houses.
translation:
  language: ml
  text: ഗൂനിയുടെ മകനായ അബ്ദിയേലിന്റെ മകൻ അഹി അവരുടെ പിതൃഭവനങ്ങളുടെ തലവനായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ പൂർവികഭവനങ്ങളുടെ തലവൻ” അല്ലെങ്കിൽ “അവരുടെ കുടുംബഭവനങ്ങളുടെ മുഖ്യൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִי
  choice: അഹി
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ഉറവിട ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: בֶּן
  choice: മകൻ / മകന്റെ മകൻ
  rationale: ആദ്യത്തെ בֶּן ‘മകൻ’ എന്നും, ആവർത്തനമുള്ള വംശാവലിസൂത്രം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കാൻ രണ്ടാമത്തേത് ‘മകന്റെ മകൻ’ എന്നും നൽകി.
- source_word: עַבְדִּיאֵל
  choice: അബ്ദീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: גּוּנִי
  choice: ഗൂനി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: רֹאשׁ
  choice: തലവൻ
  rationale: ‘തല/മുഖ്യൻ’ എന്ന രൂപകവും നേതൃസ്ഥാനവും സ്വാഭാവികമായി അറിയിക്കുന്ന പദം.
- source_word: לְבֵית אֲבוֹתָם
  choice: അവരുടെ പിതൃഭവനങ്ങളുടെ
  rationale: വംശപരമായ കുടുംബ-ഗോത്രഘടകങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ സാങ്കേതിക പ്രയോഗത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; לְ ഇവിടെ ആ ഘടകങ്ങളുടെ തലവൻ എന്ന ബന്ധമായി വായിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ‘പിതൃഭവനങ്ങൾ’ എന്ന ഉറവിടരൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, കൂടുതൽ വ്യാഖ്യാനാത്മകമായ വഴികൾ അടിക്കുറിപ്പിൽ നൽകി.
