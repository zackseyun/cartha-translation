  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
translation:
  language: ml
  text: 'അങ്ങനെ ഇസ്രായേലിന്റെ ദൈവം അശ്ശൂർരാജാവായ പൂലിന്റെ ആത്മാവിനെയും[a] അശ്ശൂർരാജാവായ തിൽഗത്ത്-പിൽനെസെരിന്റെ[b] ആത്മാവിനെയും ഉണർത്തി. അവൻ രൂബേന്യരെയും ഗാദ്യരെയും മനശ്ശെയുടെ പാതിഗോത്രത്തെയും പ്രവാസത്തിലാക്കി, അവരെ ഹലഹിലേക്കും ഹാബോറിലേക്കും ഹാരയിലേക്കും ഗോസാൻ നദിയിലേക്കും കൊണ്ടുപോയി, ഇന്നുവരെ.


    [a] പൂൽ, തിൽഗത്ത്-പിൽനെസെർ എന്നീ പേരുകൾ ഒരേ രാജാവിന്റെ രണ്ടു പേരുകളായി മനസ്സിലാക്കാം. എബ്രായവാക്യഘടന അവരെ രണ്ടു വ്യത്യസ്ത രാജാക്കന്മാരായി മനസ്സിലാക്കാനും ഇടനൽകുന്നു.


    [b] ഇവിടെ എബ്രായപാഠത്തിലുള്ള പേരിന്റെ രൂപമാണ് “തിൽഗത്ത്-പിൽനെസെർ”; കൂടുതൽ പരിചിതമായ രൂപം “തിഗ്ലത്ത്-പിലേസെർ” എന്നാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പൂൾ, തിൽഗത്ത്-പിൽനെസെർ എന്നീ പേരുകൾ ഒരേ രാജാവിന്റെ രണ്ടു പേരുകളായി മനസ്സിലാക്കാം. എബ്രായവാക്യഘടന അവരെ രണ്ടു വ്യത്യസ്ത രാജാക്കന്മാരായി മനസ്സിലാക്കാനും ഇടനൽകുന്നു.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ എബ്രായപാഠത്തിലുള്ള പേരിന്റെ രൂപമാണ് “തിൽഗത്ത്-പിൽനെസെർ”; കൂടുതൽ പരിചിതമായ രൂപം “തിഗ്ലത്ത്-പിലേസെർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: ഉണർത്തി
  rationale: ഒരാളെ പ്രവർത്തനത്തിലേക്കു പ്രേരിപ്പിക്കുന്നവിധം അയാളുടെ ഉള്ളിലെ മനോഭാവത്തെയോ പ്രേരണയെയോ ഉണർത്തുക എന്ന ആശയം സ്വാഭാവികമായും ദൈവിക പ്രവർത്തനത്തെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെയും നൽകുന്നു.
- source_word: ר֣וּחַ ... ר֨וּחַ
  choice: ആത്മാവിനെയും ... ആത്മാവിനെയും
  rationale: ഉള്ളിലെ പ്രേരണയെയോ മനോഭാവത്തെയോ സൂചിപ്പിക്കുന്ന רוּחַ എന്ന പദത്തിന്റെ ആവർത്തനം നിലനിർത്തുന്നു; “മനസ്സ്” എന്നതിനെക്കാൾ മൂലപാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാവവും രൂപവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: פּוּל
  choice: പൂൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: תִּלְּגַת פִּלְנֶסֶר
  choice: തിൽഗത്ത്-പിൽനെസെർ
  rationale: ദിനവൃത്താന്തപുസ്തകത്തിലെ എബ്രായരൂപത്തെ അടുത്ത് പിന്തുടരുന്ന ലിപ്യന്തരണം; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיַּגְלֵם
  choice: അവൻ ... പ്രവാസത്തിലാക്കി
  rationale: ഹിഫിൽ രൂപത്തിന്റെ ‘പ്രവാസത്തിലേക്കു കൊണ്ടുപോകുക’ എന്ന അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; കർത്താവിനെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിലെ സാധ്യതയുള്ള അവ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: രൂബേന്യരെയും ഗാദ്യരെയും
  rationale: ഗോത്രജനങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ ജനനാമങ്ങൾക്ക് സ്വാഭാവികമായ മലയാള ബഹുവചനരൂപങ്ങൾ.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പാതിഗോത്രത്തെയും
  rationale: യോർദ്ദാനു കിഴക്കുള്ള മനശ്ശെഗോത്രത്തിന്റെ പകുതിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיְבִיאֵם
  choice: അവരെ ... കൊണ്ടുപോയി
  rationale: പ്രവാസസ്ഥലങ്ങളിലേക്കുള്ള മാറ്റം മലയാളത്തിൽ സ്വാഭാവികമായി വിവരിക്കുന്നു.
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  choice: ഹലഹിലേക്കും ഹാബോറിലേക്കും ഹാരയിലേക്കും ഗോസാൻ നദീതീരത്തേക്കും
  rationale: സ്ഥലനാമങ്ങളെ ലിപ്യന്തരം ചെയ്യുന്നു; ‘ഗോസാൻ നദി’യെ ഒരു ലക്ഷ്യസ്ഥാനമായി മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘നദീതീരം’ ഉപയോഗിക്കുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ അവർ അവിടെയുണ്ട്
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്ത കാലസൂചനയുടെ സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: പൂലും തിൽഗത്ത്-പിൽനെസെരും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടു പേരുകൾക്കും മുമ്പിൽ ‘അശ്ശൂർരാജാവായ’ എന്നും ‘ആത്മാവ്’ എന്നും ആവർത്തിച്ച്, മൂലപാഠത്തിന്റെ ഏകോപനഘടന നേരിട്ട് നിലനിർത്തി.
  alternative: പൂൽ എന്നതും തിൽഗത്ത്-പിൽനെസെർ എന്നതും ഒരേ രാജാവിന്റെ രണ്ടു പേരുകളാണെന്ന് മുഖ്യവാക്യത്തിൽ സമാനാധികരണമായി വ്യക്തമാക്കുക.
  rationale: എബ്രായവാക്യഘടന രണ്ടു വ്യത്യസ്ത ഭരണാധികാരികളെയും ഒരേ രാജാവിന്റെ രണ്ടു പേരുകളെയും അനുവദിക്കുന്നു. മുഖ്യപാഠം ഒന്നിനെ നിർബന്ധമായി തീരുമാനിക്കാതെ യഥാർഥ അവ്യക്തത കാത്തുസൂക്ഷിക്കുന്നു; ചരിത്രപരമായ ഏകീകരണസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: וַיַּגְלֵם, וַיְבִיאֵם എന്നീ ക്രിയകളുടെ കർത്താവ്
  choice: ‘അവൻ’ എന്ന സർവനാമം ഉപയോഗിച്ച് മൂലപാഠത്തിലെ ഏകവചനകർത്താവിന്റെ പരാമർശം തുറന്നുവെച്ചു.
  alternative: അശ്ശൂർരാജാവാണ് പ്രവാസത്തിലാക്കിയതെന്ന് പേരെടുത്തു വ്യക്തമാക്കുക, അല്ലെങ്കിൽ ദൈവമാണ് ചെയ്തതെന്ന് വ്യക്തമാക്കുക.
  rationale: എബ്രായത്തിലെ തുടർച്ചയായ ഏകവചനക്രിയകൾ സന്ദർഭത്തിൽ രാജാവിനെയോ ദൈവത്തെയോ വ്യാകരണപരമായി ബന്ധിപ്പിക്കാവുന്നതാണ്. മലയാളത്തിലെ സർവനാമം ഈ സൂക്ഷ്മമായ പരാമർശാവ്യക്തത അനാവശ്യമായി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗോത്രനാമങ്ങളും സ്ഥലനാമങ്ങളും സാധാരണ വായനക്കാർക്ക് ഉച്ചരിക്കാവുന്ന വിധത്തിൽ ലിപ്യന്തരം ചെയ്തു. എബ്രായത്തിലെ ആവർത്തനവും നിർണായകമായ വ്യാകരണാവ്യക്തതകളും കഴിയുന്നത്ര നിലനിർത്തി.
