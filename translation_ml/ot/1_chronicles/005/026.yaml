    issue: The closing clause adds “അവർ അവിടെയുണ്ട്” (“they are there”).
    rationale: The Hebrew says only “to this day”; it does not explicitly state that the deportees remain in those places. This interpretive expansion should be removed.
  - severity: low
    issue: “ഗോസാൻ നദീതീരത്തേക്ക്” renders the destination as a riverbank.
    rationale: נְהַר גּוֹזָן is “the river Gozan,” not specifically its shore. “ഗോസാൻ നദിയിലേക്കും” preserves the wording without narrowing it.
