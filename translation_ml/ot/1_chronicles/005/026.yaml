revisions:
- from: 'അങ്ങനെ ഇസ്രായേലിന്റെ ദൈവം അശ്ശൂർരാജാവായ പൂലിന്റെ ആത്മാവിനെയും[a] അശ്ശൂർരാജാവായ തിൽഗത്ത്-പിൽനെസെരിന്റെ[b] ആത്മാവിനെയും ഉണർത്തി. അവൻ രൂബേന്യരെയും ഗാദ്യരെയും മനശ്ശെയുടെ പാതിഗോത്രത്തെയും പ്രവാസത്തിലാക്കി, അവരെ ഹലഹിലേക്കും ഹാബോറിലേക്കും ഹാരയിലേക്കും ഗോസാൻ നദീതീരത്തേക്കും കൊണ്ടുപോയി. ഇന്നുവരെ അവർ അവിടെയുണ്ട്.


    [a] പൂൽ, തിൽഗത്ത്-പിൽനെസെർ എന്നീ പേരുകൾ ഒരേ രാജാവിന്റെ രണ്ടു പേരുകളായി മനസ്സിലാക്കാം. എബ്രായവാക്യഘടന അവരെ രണ്ടു വ്യത്യസ്ത രാജാക്കന്മാരായി മനസ്സിലാക്കാനും ഇടനൽകുന്നു.

    [b] ഇവിടെ എബ്രായപാഠത്തിലുള്ള പേരിന്റെ രൂപമാണ് “തിൽഗത്ത്-പിൽനെസെർ”; കൂടുതൽ പരിചിതമായ രൂപം “തിഗ്ലത്ത്-പിലേസെർ” എന്നാണ്.'
  to: 'അങ്ങനെ ഇസ്രായേലിന്റെ ദൈവം അശ്ശൂർരാജാവായ പൂലിന്റെ ആത്മാവിനെയും[a] അശ്ശൂർരാജാവായ തിൽഗത്ത്-പിൽനെസെരിന്റെ[b] ആത്മാവിനെയും ഉണർത്തി. അവൻ രൂബേന്യരെയും ഗാദ്യരെയും മനശ്ശെയുടെ പാതിഗോത്രത്തെയും പ്രവാസത്തിലാക്കി, അവരെ ഹലഹിലേക്കും ഹാബോറിലേക്കും ഹാരയിലേക്കും ഗോസാൻ നദിയിലേക്കും കൊണ്ടുപോയി, ഇന്നുവരെ.


    [a] പൂൽ, തിൽഗത്ത്-പിൽനെസെർ എന്നീ പേരുകൾ ഒരേ രാജാവിന്റെ രണ്ടു പേരുകളായി മനസ്സിലാക്കാം. എബ്രായവാക്യഘടന അവരെ രണ്ടു വ്യത്യസ്ത രാജാക്കന്മാരായി മനസ്സിലാക്കാനും ഇടനൽകുന്നു.


    [b] ഇവിടെ എബ്രായപാഠത്തിലുള്ള പേരിന്റെ രൂപമാണ് “തിൽഗത്ത്-പിൽനെസെർ”; കൂടുതൽ പരിചിതമായ രൂപം “തിഗ്ലത്ത്-പിലേസെർ” എന്നാണ്.'
