  yaml_path: translation/ot/1_chronicles/005/011.yaml
  text: And the sons of Gad lived opposite them in the land of Bashan[b][a], as far as Salecah.
translation:
  language: ml
  text: ഗാദിന്റെ പുത്രന്മാർ അവരുടെ എതിർവശത്ത്[a] ബാശാൻദേശത്ത് സൽഖാവരെ പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവർക്ക് അഭിമുഖമായി” അല്ലെങ്കിൽ “അവർക്കു സമീപമായി”; എബ്രായപ്രയോഗം മുമ്പ് പരാമർശിച്ച കൂട്ടത്തോടുള്ള ആപേക്ഷിക സ്ഥാനമാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי גָד
  choice: ഗാദിന്റെ പുത്രന്മാർ
  rationale: בני എന്നതിന്റെ രൂപം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ അത് ഗാദ് ഗോത്രത്തിലെ അംഗങ്ങളെയും പിൻതലമുറക്കാരെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְ/נֶגְדָּ/ם
  choice: അവർക്കെതിരായി
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ രൂബേന്യരോടുള്ള ആപേക്ഷിക ഭൂമിശാസ്ത്രസ്ഥാനം സൂചിപ്പിക്കുന്ന נגד എന്ന പദത്തിന്റെ ‘എതിർവശത്ത്/അഭിമുഖമായി’ എന്ന സ്ഥലാർഥം സംരക്ഷിക്കുന്നു.
- source_word: יָשְׁבוּ
  choice: പാർത്തു
  rationale: പ്രദേശവാസത്തെ സൂചിപ്പിക്കുന്ന ישב എന്ന ക്രിയയ്ക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: בְּ/אֶרֶץ הַ/בָּשָׁן
  choice: ബാശാൻദേശത്ത്
  rationale: ארץ ഇവിടെ പേരിട്ട ഒരു ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; സമാസരൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: עַד סַלְכָה
  choice: സൽഖാവരെ
  rationale: עד ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തിയുടെ അതിർത്തി സൂചിപ്പിക്കുന്നു; ‘വരെ’ അത് സംക്ഷിപ്തമായി നൽകുന്നു. സַלְכָה എന്ന എബ്രായരൂപത്തോട് അടുത്ത ലിപ്യന്തരണം ‘സൽഖാ’ ആണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗോത്രപരമായ בני എന്ന രൂപത്തിന് ‘പുത്രന്മാർ’ നിലനിർത്തി; לְנֶגְדָּם എന്നതിലെ യഥാർഥ സ്ഥലസംബന്ധമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. സ്ഥലനാമങ്ങൾ എബ്രായത്തോട് അടുത്ത് ‘ബാശാൻ’, ‘സൽഖാ’ എന്നു ലിപ്യന്തരിച്ചു.
