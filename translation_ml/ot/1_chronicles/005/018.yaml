source:
  edition: WLC
  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
translation:
  language: ml
  text: രൂബേന്റെ പുത്രന്മാരും ഗാദ്യരും മനശ്ശെയുടെ പാതിഗോത്രക്കാരും പരാക്രമശാലികളായ പുരുഷന്മാരായിരുന്നു[a]; അവർ പരിചയും വാളും വഹിക്കുന്നവരും, വില്ലു വലിക്കുന്നവരും[b], യുദ്ധത്തിൽ പരിശീലനം നേടിയവരുമായിരുന്നു. സൈനികസേവനത്തിനു പ്രാപ്തരായ അവരുടെ എണ്ണം 44,760 ആയിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരാക്രമശാലികളായ പുരുഷന്മാർ’ എന്നതിന് ‘വീരന്മാർ’ അല്ലെങ്കിൽ ‘ശക്തരായ യോദ്ധാക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വില്ല് വളയ്ക്കുന്നവർ/ചവിട്ടിവളയ്ക്കുന്നവർ’; അമ്പെയ്യുന്നതിനായി വില്ല് ഒരുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.
    reason: cultural_note
  - marker: c
    text: ‘സൈനികസേവനത്തിനു പ്രാപ്തർ’ എന്നതിന് ‘യുദ്ധത്തിനു പുറപ്പെടാൻ കഴിയുന്നവർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  choice: രൂബേന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ഔപചാരികമായ വംശബന്ധപ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ രൂബേന്റെ സന്തതികളെ സൂചിപ്പിക്കുന്നു.
- source_word: וְגָדִי
  choice: ഗാദ്യർ
  rationale: ഇത് ഗാദ് എന്ന വ്യക്തിയെയല്ല, ഗാദ് ഗോത്രക്കാരെ സൂചിപ്പിക്കുന്ന ജനനാമരൂപമാണ്.
- source_word: וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പാതിഗോത്രം
  rationale: ഗോത്രവിഭാഗത്തെ സ്വാഭാവികവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִן בְּנֵי חַיִל
  choice: പരാക്രമശാലികൾ
  rationale: സൈനികസന്ദർഭത്തിലെ ശേഷിയും ധൈര്യവും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് യോജിച്ച മലയാളരൂപം.
- source_word: נֹשְׂאֵי מָגֵן וְחֶרֶב
  choice: പരിചയും വാളും വഹിക്കുന്നവർ
  rationale: ആയുധങ്ങൾ വഹിക്കുക എന്ന മൂലപാഠത്തിലെ ദൃശ്യരൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: വില്ലുകുലയ്ക്കുന്നവർ
  rationale: വില്ല് പ്രയോഗിക്കാൻ വളയ്ക്കുക/കുലയ്ക്കുക എന്ന എബ്രായ സൈനികശൈലി നാമപദമായ ‘വില്ലാളികൾ’ എന്നു ചുരുക്കാതെ പ്രവർത്തിയായി നിലനിർത്തുന്നു.
- source_word: וּלְמוּדֵי מִלְחָמָה
  choice: യുദ്ധപരിശീലനം നേടിയവർ
  rationale: പഠിപ്പിക്കപ്പെട്ടവരോ അഭ്യസിച്ചവരോ എന്ന ഫലാവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אַרְבָּעִים וְאַרְבָּעָה אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 44,760 പേർ
  rationale: മൂലപാഠത്തിലെ കൃത്യസംഖ്യ ആധുനിക വായനയ്ക്ക് എളുപ്പമുള്ള അക്കരൂപത്തിൽ നൽകുന്നു.
- source_word: יֹצְאֵי צָבָא
  choice: സൈനികസേവനത്തിനു പ്രാപ്തർ
  rationale: സൈനികയാത്രയ്ക്കു പുറപ്പെടാൻ യോഗ്യർ/ലഭ്യർ എന്ന സൈനികപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
