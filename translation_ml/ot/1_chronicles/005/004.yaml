  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും ആവർത്തനവും നിലനിർത്തി; പേരുകൾ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
