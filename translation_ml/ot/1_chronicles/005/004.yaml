source:
  edition: WLC
  text: בְּנֵ֖י יוֹאֵ֑ל שְׁמַֽעְיָ֥ה בְנ֛/וֹ גּ֥וֹג בְּנ֖/וֹ שִׁמְעִ֥י בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/004.yaml
  text: 'The sons of Joel: Shemaiah his son[a], Gog his son, Shimei his son.'
translation:
  language: ml
  text: 'യോവേലിന്റെ പുത്രന്മാർ[a]: ശെമയ്യാവ് അവന്റെ മകൻ, ഗോഗ് അവന്റെ മകൻ, ശിമെയി അവന്റെ മകൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോവേലിന്റെ സന്തതികൾ.’ എബ്രായ വംശാവലിപ്രയോഗം ചിലപ്പോൾ വിശാലമായ പിൻതലമുറയെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ ‘അവന്റെ മകൻ’ എന്നു ആവർത്തിക്കുന്നത് നേരിട്ടുള്ള വംശപരമ്പരയെയാണ് പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ ബഹുവചന construct രൂപം വംശാവലി അവതരിപ്പിക്കുന്നു. ഇവിടെ ആവർത്തിക്കുന്ന ‘അവന്റെ മകൻ’ എന്ന പ്രയോഗം നേരിട്ടുള്ള പിതൃപുത്രപരമ്പരയെ പിന്തുണയ്ക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്ന നേരിട്ടുള്ള പരിഭാഷ സ്വീകരിച്ചു.
- source_word: יוֹאֵל
  choice: യോവേൽ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: שְׁמַעְיָה
  choice: ശെമയ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തെ മലയാള ബൈബിൾ വായനക്കാർക്ക് സ്വാഭാവികമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְנוֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയമുള്ള בֵּן നേരിട്ടുള്ള പുത്രബന്ധം സൂചിപ്പിക്കുന്നു; ആവർത്തനം മൂലപാഠത്തിലെ വംശാവലിശൃംഖല സംരക്ഷിക്കുന്നു.
- source_word: גּוֹג
  choice: ഗോഗ്
  rationale: ഇവിടെ വംശാവലിയിലെ വ്യക്തിനാമമായി വരുന്ന എബ്രായ നാമം നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: שִׁמְעִי
  choice: ശിമെയി
  rationale: എബ്രായ വ്യക്തിനാമം അതിന്റെ ധ്വനിരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
