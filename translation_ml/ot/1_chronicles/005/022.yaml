  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי חֲלָלִ֤ים רַבִּים֙ נָפָ֔לוּ כִּ֥י מֵ/הָ/אֱלֹהִ֖ים הַ/מִּלְחָמָ֑ה וַ/יֵּשְׁב֥וּ תַחְתֵּי/הֶ֖ם עַד הַ/גֹּלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/022.yaml
  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
translation:
  language: ml
  text: അനേകർ കൊല്ലപ്പെട്ടു വീണു; യുദ്ധം ദൈവത്തിൽനിന്നുള്ളതായിരുന്നതിനാൽ അങ്ങനെ സംഭവിച്ചു.[a] അവർ അവരുടെ സ്ഥാനത്ത് പ്രവാസംവരെ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യുദ്ധം ദൈവത്തിന്റേതായിരുന്നു.” യുദ്ധം ദൈവത്തിൽനിന്നുള്ളതാണെന്ന് എബ്രായപ്രയോഗം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: ആദ്യത്തെ כִּי മുൻവിവരിച്ച വിജയത്തിന് വിശദീകരണം നൽകുന്നു; മലയാളത്തിൽ കാരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: חֲלָלִים רַבִּים
  choice: അനേകം പേർ കൊല്ലപ്പെട്ട്
  rationale: യുദ്ധത്തിൽ വെട്ടേറ്റോ കുത്തേറ്റോ കൊല്ലപ്പെട്ടവരെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘മരിച്ചവർ’ എന്നതിനെക്കാൾ യുദ്ധസന്ദർഭം നിലനിർത്തുന്നു.
- source_word: נָפָלוּ
  choice: വീണു
  rationale: യുദ്ധത്തിൽ മരണപ്പെട്ടതിനെ സൂചിപ്പിക്കാൻ נפל പതിവായി ഉപയോഗിക്കുന്നു; ‘കൊല്ലപ്പെട്ടുവീണു’ എന്ന സംയുക്തപ്രയോഗം മരണവും വീഴ്ചയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: രണ്ടാമത്തെ כִּי അനേകർ വീണതിന്റെ കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: מֵהָאֱלֹהִים
  choice: ദൈവത്തിൽനിന്നുള്ളതായിരുന്നു
  rationale: מִן ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനം എന്ന് പാഠത്തേക്കാൾ വിപുലീകരിക്കാതെ, യുദ്ധത്തിന്റെ നിർണായക ഉറവിടം ദൈവമാണെന്ന ആശയം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: הַמִּלְחָמָה
  choice: യുദ്ധം
  rationale: ഇവിടെ വിവരിച്ച സൈനിക ഏറ്റുമുട്ടലിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപദം.
- source_word: וַיֵּשְׁבוּ
  choice: താമസിച്ചു
  rationale: ישב താമസിക്കുക, പാർക്കുക, കുടിയേറുക എന്നീ അർഥങ്ങൾക്കിടയിലാണ്; കീഴടക്കിയ പ്രദേശത്ത് തുടർന്നുള്ള വാസം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: תַחְתֵּיהֶם
  choice: പരാജിതരുടെ സ്ഥാനത്ത്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അവരുടെ കീഴിൽ’ അല്ല, മുൻനിവാസികളെ മാറ്റി അവരുടെ സ്ഥാനം ഏറ്റെടുത്തുള്ള വാസമാണ് സന്ദർഭത്തിലെ അർഥം. സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സൂചിതപക്ഷം വ്യക്തമാക്കി.
- source_word: עַד הַגֹּלָה
  choice: പ്രവാസകാലംവരെ
  rationale: ഗോത്രങ്ങളുടെ നാടുകടത്തലിനെയും പ്രവാസത്തെയും സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിൽ ‘പ്രവാസം’ വ്യക്തവും പരിചിതവുമാണ്.
theological_decisions:
- issue: യുദ്ധത്തിലെ ദൈവിക പങ്കാളിത്തം
  choice: യുദ്ധം ദൈവത്തിൽനിന്നുള്ളതായിരുന്നു
  alternative: യുദ്ധം ദൈവത്തിന്റേതായിരുന്നു
  rationale: എബ്രായത്തിലെ מֵהָאֱלֹהִים ദൈവത്തെ ഉറവിടമായി അവതരിപ്പിക്കുന്നു. യുദ്ധഫലം ദൈവത്തിൽനിന്നുണ്ടായതെന്ന അവകാശവാദം സംരക്ഷിക്കുമ്പോഴും, വാക്യം പറയുന്നതിലപ്പുറം ‘വിശുദ്ധയുദ്ധ’ സിദ്ധാന്തം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കൊല്ലപ്പെട്ടുവീണു’ യുദ്ധസന്ദർഭത്തിലെ חֲלָלִים ... נָפָלוּ എന്ന ഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. ‘പരാജിതരുടെ സ്ഥാനത്ത്’ എന്നത് ആശയക്കുഴപ്പമുള്ള സർവനാമം വ്യക്തമാക്കുന്ന ലഘു സന്ദർഭവ്യക്തീകരണമാണ്.
