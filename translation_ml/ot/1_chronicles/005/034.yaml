id: 1CH.5.34
reference: 1 Chronicles 5:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲחִיטוּב֙ הוֹלִ֣יד אֶת צָד֔וֹק וְ/צָד֖וֹק הוֹלִ֥יד אֶת אֲחִימָֽעַץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/034.yaml
  text: Ahitub fathered Zadok, and Zadok fathered Ahimaaz.
translation:
  language: ml
  text: അഹീതൂബ് സാദോക്കിന്റെ പിതാവായി; സാദോക്ക് അഹീമാസിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִיטוּב
  choice: അഹീതൂബ്
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തെ അനുസരിച്ച് മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ഹിഫീൽ രൂപം ഒരാൾ മറ്റൊരാളുടെ പിതാവായി എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു. ‘ജനിപ്പിച്ചു’ എന്നതിനെക്കാൾ സ്വാഭാവികവും പിതൃബന്ധം വ്യക്തമായി നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത പ്രത്യക്ഷകർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകം; മലയാളത്തിൽ ഇതിന് സ്വതന്ത്ര പദസമാനത ആവശ്യമില്ല.
- source_word: צָדוֹק
  choice: സാദോക്ക്
  rationale: വ്യക്തിനാമം; എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ
  choice: ;
  rationale: രണ്ട് സമാന്തര വംശാവലിവാക്യങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു; എബ്രായത്തിലെ ലളിതമായ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: ആദ്യ പ്രയോഗത്തോടുള്ള സുതാര്യതയും വംശാവലിശൈലിയുടെ ഏകതയും നിലനിർത്താൻ ഒരേവിധം പരിഭാഷപ്പെടുത്തി.
- source_word: אֲחִימָעַץ
  choice: അഹീമാസ്
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തെ അനുസരിച്ച് മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
