source:
  edition: WLC
  text: וַ/עֲזַרְיָה֙ הוֹלִ֣יד אֶת שְׂרָיָ֔ה וּ/שְׂרָיָ֖ה הוֹלִ֥יד אֶת יְהוֹצָדָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/040.yaml
  text: Azariah fathered Seraiah, and Seraiah fathered Jehozadak.
translation:
  language: ml
  text: അസര്യാവ് സെരായാവിന്റെ പിതാവായി; സെരായാവ് യെഹോസാദാക്കിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: അസര്യാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാള ബൈബിൾനാമങ്ങളുടെ സ്വാഭാവിക രൂപത്തിന് അനുസരിച്ച് ലിപ്യന്തരണം ചെയ്തു; തുടക്കത്തിലെ וַ ബന്ധസൂചകം മലയാള വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: ילד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വംശാവലിയിൽ ഒരാളുടെ പിതൃത്വത്തെ സൂചിപ്പിക്കുന്നു. ‘ജനിപ്പിച്ചു’ എന്നതിനെക്കാൾ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗമാണ് ‘പിതാവായി’.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനം ആവശ്യമില്ല.
- source_word: שְׂרָיָה
  choice: സെരായാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ബൈബിൾനാമരൂപമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּ/שְׂרָיָה
  choice: സെരായാവ്
  rationale: വാവു ബന്ധസൂചകം ഇവിടെ അടുത്ത വംശാവലിഘടകത്തെ ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ അർദ്ധവിരാമത്തിലൂടെയും വാക്യക്രമത്തിലൂടെയും ബന്ധം വ്യക്തമായതിനാൽ ‘കൂടാതെ’ എന്നു ചേർക്കുന്നത് ഒഴിവാക്കി.
- source_word: יְהוֹצָדָק
  choice: യെഹോസാദാക്ക്
  rationale: ദൈവനാമഘടകം ഉൾക്കൊള്ളുന്ന ഹീബ്രു വ്യക്തിനാമം അതിന്റെ ഘടന മറയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
