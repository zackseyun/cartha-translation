  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
translation:
  language: ml
  text: എന്നാൽ അവർ തങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവത്തോടു വിശ്വാസവഞ്ചന കാണിച്ചു; ദൈവം അവരുടെ മുമ്പിൽനിന്ന് നശിപ്പിച്ച ദേശത്തെ ജനതകളുടെ ദേവന്മാരുടെ പിന്നാലെ വ്യഭിചാരം ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, “ദേവന്മാരുടെ പിന്നാലെ വേശ്യാവൃത്തി ചെയ്തു” എന്ന ലൈംഗിക രൂപകം. ഇത് വിഗ്രഹാരാധനയിലൂടെയുള്ള ദൈവത്തോടുള്ള ഉടമ്പടിവഞ്ചനയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ
  choice: വിശ്വാസവഞ്ചന കാണിച്ചു
  rationale: מעל എന്ന പദം ഇവിടെ ദൈവവുമായുള്ള ഉടമ്പടിബന്ധത്തിൽ വിശ്വസ്തത ലംഘിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘പാപം ചെയ്തു’ എന്നതിനെക്കാൾ ഈ പ്രയോഗം ബന്ധപരമായ വഞ്ചന വ്യക്തമാക്കുന്നു.
- source_word: בֵּאלֹהֵי אֲבוֹתֵיהֶם
  choice: തങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവത്തോടു
  rationale: מעל എന്ന ക്രിയയോടുള്ള ב വിശ്വാസവഞ്ചന ഏവനോടാണു ചെയ്തതെന്ന് അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘ദൈവത്തോടു വിശ്വാസവഞ്ചന’ സ്വാഭാവികമായി ബന്ധഭംഗം പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: പിന്നാലെ പരസംഗം ചെയ്തു
  rationale: זנהയുടെ ലൈംഗിക രൂപകം നിലനിർത്തുകയും אַחֲרֵי സൂചിപ്പിക്കുന്ന അന്യദേവന്മാരെ പിന്തുടരുന്ന ആശയം പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: ദേശവാസികളായ ജനതകളുടെ ദേവന്മാർ
  rationale: ഈ നിർമാണം ദേശത്തിലെ ജനവിഭാഗങ്ങളെയും അവരുടെ ദേവന്മാരെയും നേരിട്ട് ബന്ധിപ്പിക്കുന്നു; ‘ജനതകൾ’ എന്നത് עַמֵּיയുടെ ബഹുവചനഭാവം സൂക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  choice: ദൈവം അവരുടെ മുമ്പിൽനിന്ന് നശിപ്പിച്ചുകളഞ്ഞ ദേശവാസികളായ ജനതകൾ
  rationale: ബന്ധവാക്യത്തിന്റെ വ്യാകരണപരമായ മുൻപദം ജനതകളാണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഏകവചന ക്രിയയുള്ള אֱלֹהִים ഇവിടെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നു; ‘നശിപ്പിച്ചുകളഞ്ഞ’ എന്നത് Hiphil ക്രിയയുടെ ശക്തി നൽകുന്നു.
theological_decisions:
- issue: വിഗ്രഹാരാധനയെ വിവരിക്കുന്ന ലൈംഗിക രൂപകം
  choice: ദേവന്മാരുടെ പിന്നാലെ പരസംഗം ചെയ്തു
  alternative: ദേവന്മാരെ പിന്തുടർന്ന് അവിശ്വസ്തരായി
  rationale: എബ്രായം വിഗ്രഹാരാധനയെ ഉടമ്പടിവഞ്ചനയായ ലൈംഗിക അവിശ്വസ്തതയിലൂടെ ഉദ്ദേശപൂർവം ചിത്രീകരിക്കുന്നു. രൂപകം നീക്കാതെ, അതിന്റെ അർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
- issue: ബന്ധവാക്യത്തിലെ אֱלֹהִים എന്നതിന്റെ സംഖ്യ
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: הִשְׁמִיד എന്ന ഏകവചന ക്രിയ കാരണം ഇവിടെ אֱלֹהִים ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: אֲשֶׁר എന്ന ബന്ധസർവനാമത്തിന്റെ മുൻപദം
  choice: ദൈവം നശിപ്പിച്ചത് ദേശത്തിലെ ജനതകളെ
  alternative: ദൈവം നശിപ്പിച്ചത് അവരുടെ ദേവന്മാരെ
  rationale: അടുത്തുള്ള ‘ദേവന്മാർ’ മുൻപദമാകാമെന്ന ഉപരിതലസാധ്യതയുണ്ടെങ്കിലും മനുഷ്യരെ സൂചിപ്പിക്കുന്ന עַמֵּי הָאָרֶץ എന്ന നിർമാണവും മִפְּנֵיהֶם എന്ന ചരിത്രസന്ദർഭവും ബന്ധവാക്യം ജനതകളെ വിശേഷിപ്പിക്കുന്നതായി പിന്തുണയ്ക്കുന്നു. മലയാളവാക്യഘടന ഇത് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘പരസംഗം ചെയ്തു’ എന്ന ശക്തമായ രൂപകം മൂലപാഠത്തിന്റെ ഉടമ്പടിപരമായ ഉദ്ദേശ്യം സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അതിന്റെ രൂപകസ്വഭാവം വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
