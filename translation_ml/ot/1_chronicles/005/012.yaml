lexical_decisions:
- source_word: יוֹאֵל
  choice: യോവേൽ
  rationale: വ്യക്തിനാമം; എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: הָרֹאשׁ
  choice: തലവനായ
  rationale: רֹאשׁ എന്നതിന് അക്ഷരാർഥത്തിൽ ‘തല’ എന്നാണെങ്കിലും ഇവിടെ പദവിയിലോ നേതൃത്വത്തിലോ ഒന്നാമനായവനെ സൂചിപ്പിക്കുന്നു; ‘തലവനായ’ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: וְשָׁפָם
  choice: ശാഫാം
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തെ അനുസരിച്ച് ലിപ്യന്തരിച്ചു.
- source_word: הַמִּשְׁנֶה
  choice: രണ്ടാം സ്ഥാനക്കാരനായ
  rationale: מִשְׁנֶה രണ്ടാമത്തെ സ്ഥാനമോ തൊട്ടടുത്ത പദവിയോ സൂചിപ്പിക്കുന്നു. ‘രണ്ടാം സ്ഥാനക്കാരനായ’ എന്നത് പദവിയുടെ അർഥം വ്യക്തമാക്കുമ്പോഴും ‘ഉപതലവൻ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുന്നു.
- source_word: וְיַעְנַי
  choice: യാനായി
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
- source_word: וְשָׁפָט
  choice: ശാഫാത്ത്
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
- source_word: בַּבָּשָׁן
  choice: ബാശാനിൽ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന בְּ എന്ന ഉപസർഗം മലയാളത്തിൽ ‘-ഇൽ’ എന്ന സ്ഥലവിഭക്തിയാൽ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായത്തിലെ പട്ടികാസ്വഭാവം നിലനിർത്തിയെങ്കിലും, മലയാളത്തിൽ വാക്യം പൂർണമാകാൻ സന്ദർഭത്തിൽ അന്തർലീനമായ അസ്തിത്വക്രിയ ‘ഉണ്ടായിരുന്നു’ ചേർത്തു. പദവികളെ വ്യക്തിനാമങ്ങൾക്ക് മുമ്പുള്ള വിശേഷണങ്ങളാക്കി സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിച്ചു.
