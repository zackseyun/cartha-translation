  text: തലവനായ യോവേൽ, രണ്ടാം സ്ഥാനക്കാരനായ ശാഫാം[a], യാനായി, ശാഫാത്ത് എന്നിവർ ബാശാനിൽ ഉണ്ടായിരുന്നു.
