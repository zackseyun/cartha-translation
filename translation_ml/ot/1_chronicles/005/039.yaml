source:
  edition: WLC
  text: וְ/שַׁלּוּם֙ הוֹלִ֣יד אֶת חִלְקִיָּ֔ה וְ/חִלְקִיָּ֖ה הוֹלִ֥יד אֶת עֲזַרְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/039.yaml
  text: And Shallum fathered Hilkiah, and Hilkiah fathered Azariah.
translation:
  language: ml
  text: ശല്ലൂം ഹിൽക്കീയാവിനെ ജനിപ്പിച്ചു; ഹിൽക്കീയാവ് അസര്യാവിനെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ
  choice: '[പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ബന്ധകമാണിത്. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ ആരംഭത്തിലെ ‘കൂടാതെ/പിന്നെ’ ഒഴിവാക്കുന്നത് സ്വാഭാവികമാണ്; തുടർച്ചയുടെ ആശയം സന്ദർഭം നൽകുന്നു.
- source_word: שַׁלּוּם
  choice: ശല്ലൂം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: ഹിഫീൽ രൂപം വംശാവലി സന്ദർഭത്തിൽ ‘പിതാവായി/ജനിപ്പിച്ചു’ എന്ന അർഥം നൽകുന്നു. ‘ജനിപ്പിച്ചു’ സംക്ഷിപ്തവും ആൺവംശപരമ്പരയെ സൂചിപ്പിക്കുന്നതുമായ സാധാരണ മലയാള പ്രയോഗമാണ്.
- source_word: אֶת
  choice: '[വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകം; മലയാളത്തിൽ പ്രത്യേക പദം ആവശ്യമില്ല.
- source_word: חִלְקִיָּה
  choice: ഹിൽക്കീയാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തെ മലയാളത്തിൽ വായിക്കാവുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു; വിഭക്തി ചേരാത്ത കർത്തൃസ്ഥാനത്ത് സ്വാഭാവികമായ ‘-വ്’ രൂപം ഉപയോഗിച്ചു.
- source_word: וְ
  choice: ;
  rationale: രണ്ടാമത്തെ വംശാവലി ഘട്ടത്തെ മുൻഘട്ടവുമായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ അർധവിരാമം ആവർത്തിച്ച ‘കൂടാതെ’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ഏകോപനം വ്യക്തമാക്കുന്നു.
- source_word: עֲזַרְיָה
  choice: അസര്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം പിന്തുടരുന്ന മലയാള ലിപ്യന്തരണം; കർമസ്ഥാനത്ത് ‘അസര്യാവിനെ’ എന്നു രൂപപ്പെടുന്നു.
