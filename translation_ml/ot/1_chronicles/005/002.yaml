  naturalness: The Malayalam is generally clear, modern, and appropriately dignified. “എന്തെന്നാൽ” is natural in a connected scriptural context and preserves the explanatory linkage that the unmarked opening loses.
  terminology: “പ്രബലനായി,” “അധിപതി,” and “ജ്യേഷ്ഠാവകാശം” suitably convey גָּבַר, נָגִיד, and בְּכֹרָה. The footnote gives viable lexical alternatives for “അധിപതി.”
