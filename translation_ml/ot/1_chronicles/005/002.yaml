reference: 1 Chronicles 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י יְהוּדָה֙ גָּבַ֣ר בְּ/אֶחָ֔י/ו וּ/לְ/נָגִ֖יד מִמֶּ֑/נּוּ וְ/הַ/בְּכֹרָ֖ה לְ/יוֹסֵֽף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/002.yaml
  text: For Judah prevailed over his brothers[a], and from him came the ruler, though the birthright belonged to Joseph.
translation:
  language: ml
  text: എന്തെന്നാൽ, യെഹൂദാ തന്റെ സഹോദരന്മാരെക്കാൾ പ്രബലനായി; അവനിൽനിന്ന് ഒരു അധിപതി[a] വന്നു. എങ്കിലും ജ്യേഷ്ഠാവകാശം യോസേഫിനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നേതാവ്’ അല്ലെങ്കിൽ ‘പ്രഭു.’
    reason: നָגִיד എന്ന പദത്തിന് ഭരണാധികാരി, നേതാവ്, പ്രഭു എന്നീ അർഥങ്ങൾ വരാം.
lexical_decisions:
- source_word: כִּי
  choice: (മുൻവാക്യത്തിന്റെ വിശദീകരണമായി പ്രത്യേകം പദം ചേർക്കാതെ അവതരിപ്പിച്ചു)
  rationale: ഈ അവ്യയം മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് വിശദീകരണം നൽകുന്നു. ഒറ്റ വാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ ‘എന്തെന്നാൽ’ എന്നു തുടങ്ങുന്നത് കൃത്രിമമായി തോന്നുന്നതിനാൽ, വിശദീകരണബന്ധം വാക്യക്രമത്തിലൂടെ നിലനിർത്തി.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: വ്യക്തിയെയും ഗോത്രത്തെയും സൂചിപ്പിക്കുന്ന പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: גָּבַר בְּאֶחָיו
  choice: തന്റെ സഹോദരന്മാരെക്കാൾ പ്രബലനായി
  rationale: ക്രിയ ശക്തനാകുക, മേൽക്കൈ നേടുക എന്ന അർഥം വഹിക്കുന്നു; ബന്ധസൂചകമായ בְּ ഇവിടെ സഹോദരന്മാരോടുള്ള താരതമ്യത്തിലെ മേൽക്കോയ്മ വ്യക്തമാക്കുന്നു.
- source_word: וּלְנָגִיד מִמֶּנּוּ
  choice: അവനിൽനിന്ന് ഒരു അധിപതി വന്നു
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ പ്രയോഗം യെഹൂദയിൽനിന്നുള്ള ഭരണനേതൃത്വത്തെ സൂചിപ്പിക്കുന്നു. ‘അധിപതി’ נָגִיד എന്ന പദത്തിന്റെ ഭരണാധികാരി/നേതാവ് എന്ന അർഥവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהַבְּכֹרָה לְיוֹסֵף
  choice: എങ്കിലും ജ്യേഷ്ഠാവകാശം യോസേഫിനായിരുന്നു
  rationale: בְּכֹרָה ആദ്യജാതനോടു ബന്ധപ്പെട്ട പദവിയും അവകാശവും സൂചിപ്പിക്കുന്നു. യെഹൂദായുടെ മേൽക്കോയ്മയോടുള്ള വൈരുധ്യം ‘എങ്കിലും’ വ്യക്തമാക്കുന്നു; לְ ഉടമസ്ഥതയായി വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: യെഹൂദായുടെ മേൽക്കോയ്മയും യോസേഫിന്റെ ജ്യേഷ്ഠാവകാശവും തമ്മിലുള്ള ബന്ധം
  choice: ഭരണപരമായ മേൽക്കോയ്മയും അധിപതിയുടെ ഉത്ഭവവും യെഹൂദായോടും ജ്യേഷ്ഠാവകാശം യോസേഫിനോടും ബന്ധപ്പെടുത്തി വേർതിരിച്ചു നിലനിർത്തി.
  alternative: യെഹൂദാ ഏറ്റവും ശക്തനായപ്പോൾ യോസേഫിന് അവകാശവിഹിതം മാത്രം ലഭിച്ചു എന്ന പൊതുവായ വായന.
  rationale: എബ്രായ പാഠം യെഹൂദായുടെ പ്രാബല്യത്തെയും അവനിൽനിന്നുള്ള נָגִיד-നെയും യോസേഫിനുള്ള בְּכֹרָה-യെയും ചേർത്തുവെക്കുന്നുവെങ്കിലും അവയെ ഒന്നാക്കി ലയിപ്പിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രബലനായി,’ ‘അധിപതി,’ ‘ജ്യേഷ്ഠാവകാശം’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ അർഥവ്യത്യാസങ്ങൾ വ്യക്തമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം അത് വിശദീകരിക്കുന്ന ‘അധിപതി’ എന്ന പദത്തിനുശേഷം ചേർത്തു.
