  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. നീണ്ട എബ്രായ ബന്ധശൃംഖല മലയാളത്തിൽ വ്യക്തതയ്ക്കായി സ്വതന്ത്ര ഉപവാക്യങ്ങളാക്കി; ബന്ധങ്ങളുടെ ക്രമവും മൂലപാഠത്തിലെ ആവർത്തനവും സംരക്ഷിച്ചു.
