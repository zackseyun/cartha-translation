reference: 1 Chronicles 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֣לֶּה בְּנֵ֣י אֲבִיחַ֗יִל בֶּן חוּרִ֡י בֶּן יָ֠רוֹחַ בֶּן גִּלְעָ֧ד בֶּן מִיכָאֵ֛ל בֶּן יְשִׁישַׁ֥י בֶּן יַחְדּ֖וֹ בֶּן בּֽוּז׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/014.yaml
  text: These were the sons of Abihail son of Huri[a], son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.
translation:
  language: ml
  text: ഇവർ അബീഹയിലിന്റെ പുത്രന്മാരായിരുന്നു[a]. അബീഹയിൽ ഹൂരിയുടെ മകൻ, ഹൂരി യാരോഹിന്റെ മകൻ, യാരോഹ് ഗിലെയാദിന്റെ മകൻ, ഗിലെയാദ് മീഖായേലിന്റെ മകൻ, മീഖായേൽ യെശീശായിയുടെ മകൻ, യെശീശായി യഹ്ദോയുടെ മകൻ, യഹ്ദോ ബൂസിന്റെ മകൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിലെ ‘പുത്രന്മാർ’, ‘മകൻ’ എന്നീ പദങ്ങൾ വംശാവലിയിൽ ഒരു കുടുംബപരമ്പരയെ സൂചിപ്പിക്കാം; അതിനാൽ ഓരോ തലമുറയും ഇവിടെ നിർബന്ധമായും രേഖപ്പെടുത്തിയിരിക്കണമെന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവർ ... ആയിരുന്നു
  rationale: ബഹുവചന സൂചകസർവനാമം വംശാവലിപ്പട്ടിക അവതരിപ്പിക്കുന്നു; ആഖ്യാനസന്ദർഭത്തിൽ ഭൂതകാലരൂപം സ്വാഭാവികമാണ്.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: നിർമാണരൂപത്തിലുള്ള ബഹുവചനം നേരിട്ട് ‘പുത്രന്മാർ’ എന്നാണ്; വംശപരമ്പരയെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും മൂലപാഠത്തിന്റെ ഔപചാരിക ഘടന നിലനിർത്തുന്നു.
- source_word: בֶּן
  choice: മകൻ
  rationale: ആവർത്തിക്കുന്ന വംശാവലിസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; തലമുറകൾ ഒഴിവാക്കിയിരിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֲבִיחַיִל
  choice: അബീഹയിൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: חוּרִי
  choice: ഹൂരി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יָרוֹחַ
  choice: യാരോഹ്
  rationale: അവസാനത്തെ ח വ്യഞ്ജനധ്വനി വായനാസൗകര്യത്തോടെ ‘ഹ്’ ആയി പ്രതിനിധീകരിച്ച ലിപ്യന്തരണം.
- source_word: גִּלְעָד
  choice: ഗിലെയാദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: מִיכָאֵל
  choice: മീഖായേൽ
  rationale: എബ്രായ നാമത്തിലെ വ്യഞ്ജന-സ്വരഘടന നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: יְשִׁישַׁי
  choice: യെശീശായി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദഘടന സംരക്ഷിക്കുന്ന ലിപ്യന്തരണം.
- source_word: יַחְדּוֹ
  choice: യഹ്ദോ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ വായനാസൗകര്യമുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: בּוּז
  choice: ബൂസ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
