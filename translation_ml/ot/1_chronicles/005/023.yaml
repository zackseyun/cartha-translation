id: 1CH.5.23
reference: 1 Chronicles 5:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֗י חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יָשְׁב֖וּ בָּ/אָ֑רֶץ מִ/בָּשָׁ֞ן עַד בַּ֧עַל חֶרְמ֛וֹן וּ/שְׂנִ֥יר וְ/הַר חֶרְמ֖וֹן הֵ֥מָּה רָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
translation:
  language: ml
  text: മനശ്ശെയുടെ അർധഗോത്രക്കാർ ബാശാൻമുതൽ ബാൽ-ഹെർമോൻ, സെനീർ, ഹെർമോൻ പർവതം[b] വരെയുള്ള ദേശത്ത് പാർത്തു; അവർ എണ്ണത്തിൽ പെരുകി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവർ വർധിച്ചു” അല്ലെങ്കിൽ “അവർ അനേകരായി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ എണ്ണത്തിലുള്ള വളർച്ചയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ബാൽ-ഹെർമോൻ, സെനീർ, ഹെർമോൻ പർവതം എന്നിവ ഈ ഗോത്രപ്രദേശത്തിന്റെ വടക്കേയറ്റം അടയാളപ്പെടുത്തുന്ന സ്ഥലനാമങ്ങളാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: മനശ്ശെയുടെ അർധഗോത്രക്കാർ
  rationale: בני എന്നത് അക്ഷരാർഥത്തിൽ ‘മക്കൾ’ എന്നാണെങ്കിലും, ഇവിടെ വംശപരമായ ഗോത്രാംഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ ഗോത്രസംബന്ധമായ പ്രയോഗമായി ‘അർധഗോത്രക്കാർ’ തിരഞ്ഞെടുത്തു.
- source_word: יָשְׁבוּ
  choice: പാർത്തു
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ തുടർച്ചയായ വാസത്തെ സൂചിപ്പിക്കുന്നു; ‘പാർത്തു’ ആ അർഥം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בָּאָרֶץ
  choice: ദേശത്ത്
  rationale: ארץ ഇവിടെ അവർ അധിവസിച്ച ഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ എബ്രായപദത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: מִבָּשָׁן עַד
  choice: ബാശാൻമുതൽ … വരെയുള്ള
  rationale: מן…עד എന്ന ഘടന പ്രദേശത്തിന്റെ വ്യാപ്തി അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിലെ ‘മുതൽ … വരെ’ അതിന് സ്വാഭാവികമായ തുല്യപ്രയോഗമാണ്.
- source_word: בַּעַל חֶרְמוֹן
  choice: ബാൽ-ഹെർമോൻ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; സംയുക്തനാമമാണെന്ന് വ്യക്തമാക്കാൻ ഹൈഫൻ നിലനിർത്തി.
- source_word: וּשְׂנִיר
  choice: സെനീർ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְהַר חֶרְמוֹן
  choice: ഹെർമോൻ പർവതം
  rationale: הר എന്നത് ‘പർവതം’ എന്നാണ്; മലയാളത്തിൽ സ്ഥലനാമം സ്വാഭാവികമായി വായിക്കപ്പെടുന്ന ക്രമത്തിൽ നൽകി.
- source_word: הֵמָּה רָבוּ
  choice: അവർ എണ്ണത്തിൽ പെരുകി
  rationale: רבה എന്ന ക്രിയ ഇവിടെ സംഖ്യാവർധനയെ സൂചിപ്പിക്കുന്നു. ‘എണ്ണത്തിൽ’ ചേർത്തത് അർഥം വ്യക്തമാക്കുന്നു; ഊന്നൽ നൽകുന്ന സ്വതന്ത്ര സർവനാമം ‘അവർ’ ആയി നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. ഗോത്രപരമായ അർഥം സ്വാഭാവികമായി നൽകാൻ അക്ഷരാർഥത്തിലുള്ള ‘മക്കൾ’ എന്നതിനു പകരം ‘അർധഗോത്രക്കാർ’ സ്വീകരിച്ചു. മൂലപാഠത്തിലെ സ്ഥലനാമങ്ങളുടെ പട്ടികയും സംഖ്യാവർധനയുടെ ആശയവും വ്യക്തമായി നിലനിർത്തി.
