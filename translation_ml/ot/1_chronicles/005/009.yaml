reference: 1 Chronicles 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לַ/מִּזְרָ֗ח יָשַׁב֙ עַד לְ/ב֣וֹא מִדְבָּ֔רָ/ה לְ/מִן הַ/נָּהָ֖ר פְּרָ֑ת כִּ֧י מִקְנֵי/הֶ֛ם רָב֖וּ בְּ/אֶ֥רֶץ גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/009.yaml
  text: To the east he settled as far as the entrance to the wilderness from the river Euphrates[a], because their livestock had multiplied in the land of Gilead.
translation:
  language: ml
  text: കിഴക്കോട്ട് അവൻ യൂഫ്രട്ടീസ് നദിയിൽനിന്ന് മരുഭൂമിയിലേക്കുള്ള പ്രവേശനസ്ഥലംവരെ താമസമുറപ്പിച്ചു[a]; കാരണം, ഗിലെയാദ് ദേശത്ത് അവരുടെ കന്നുകാലികൾ പെരുകിയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യൂഫ്രട്ടീസ് നദിയുടെ ഭാഗത്തുനിന്നുള്ള മരുഭൂമിവരെ.’ ഹീബ്രുവിലെ അതിർത്തിവിവരണം സങ്കുചിതമായതിനാൽ അതിനെ ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלַמִּזְרָח
  choice: കിഴക്കോട്ട്
  rationale: ദിശാസൂചന സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; വാക്യാരംഭത്തിലെ וְ മലയാളത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല.
- source_word: יָשַׁב
  choice: അവൻ ... താമസമുറപ്പിച്ചു
  rationale: ഏകവചന ക്രിയ ഗോത്രപൂർവികനെയോ ഗോത്രത്തെ പ്രതിനിധാനം ചെയ്യുന്ന വ്യക്തിയെയോ കൂട്ടായ അർഥത്തിൽ സൂചിപ്പിക്കുന്നു; പ്രദേശിക അധിവാസത്തിന്റെ ഭാവം ‘താമസമുറപ്പിച്ചു’ വ്യക്തമാക്കുന്നു.
- source_word: עַד לְבוֹא מִדְבָּרָה
  choice: മരുഭൂമിയുടെ പ്രവേശനംവരെ
  rationale: ‘പ്രവേശനം/അടുക്കൽ’ എന്ന സാക്ഷാൽ അതിർത്തിഭാവം നിലനിർത്തുന്നു; വെറും ‘മരുഭൂമിവരെ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: לְמִן הַנָּהָר פְּרָת
  choice: യൂഫ്രട്ടീസ് നദിയിൽനിന്നുള്ള
  rationale: ഹീബ്രു വാക്യഘടന സങ്കുചിതവും ദുഷ്കരവുമാണ്; ‘നദിയിൽനിന്നുള്ള’ എന്ന അടുത്ത വിവർത്തനം ‘മരുഭൂമി’യോടുള്ള ബന്ധം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: കിഴക്കോട്ടുള്ള വ്യാപനത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: מִקְנֵיהֶם
  choice: അവരുടെ കന്നുകാലികൾ
  rationale: വളർത്തുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പദപ്രയോഗമാണ്; പശുക്കളിൽ മാത്രം അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: רָבוּ
  choice: പെരുകിയിരുന്നു
  rationale: എണ്ണത്തിൽ വർധിച്ചതെന്ന അർഥവും, താമസവ്യാപനത്തിനു മുമ്പുണ്ടായ കാരണമെന്ന കാലബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: ഗിലെയാദ് ദേശത്ത്
  rationale: אֶרֶץ എന്നതിന്റെ ഭൂപ്രദേശസൂചന നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള രൂപം.
