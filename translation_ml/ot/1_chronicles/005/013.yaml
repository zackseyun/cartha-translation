source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֞ם לְ/בֵ֣ית אֲבוֹתֵי/הֶ֗ם מִֽיכָאֵ֡ל וּ/מְשֻׁלָּ֡ם וְ֠/שֶׁבַע וְ/יוֹרַ֧י וְ/יַעְכָּ֛ן וְ/זִ֥יעַ וָ/עֵ֖בֶר שִׁבְעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/013.yaml
  text: 'And their brothers[a], according to their fathers’ houses: Michael, Meshullam, Sheba, Jorai, Jachan, Zia[d][c][b], and Eber—seven.'
translation:
  language: ml
  text: 'അവരുടെ പിതൃഭവനങ്ങൾ അനുസരിച്ച്[b] അവരുടെ സഹോദരന്മാർ[a]: മീഖായേൽ, മെഷുല്ലാം, ശേബ, യോരായി, യാക്കാൻ, സീയ, ഏബെർ—ആകെ ഏഴുപേർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരന്മാർ” എന്ന എബ്രായപദം വംശാവലിസന്ദർഭങ്ങളിൽ വിശാലമായ കുലബന്ധുക്കളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “പിതൃഭവനങ്ങൾ” എന്നത് പിതൃവഴിയുള്ള കുടുംബങ്ങളെയോ കുലവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: അവരുടെ സഹോദരന്മാർ
  rationale: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘സഹോദരന്മാർ’ എന്നാണ്; വംശാവലിസന്ദർഭത്തിൽ ഇത് വിശാലമായ കുലബന്ധുക്കളെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ മൂലരൂപം നിലനിർത്തി ആ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: അവരുടെ പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: പിതൃവഴിയുള്ള കുടുംബഘടകങ്ങളെയോ കുലവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്ന വംശാവലി പ്രയോഗം. ‘പിതൃഭവനം’ സാമൂഹികഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: מִיכָאֵל
  choice: മീഖായേൽ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וּמְשֻׁלָּם
  choice: മെശുല്ലാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְשֶׁבַע
  choice: ശേബ
  rationale: മസോരറ്റിക് സ്വരചിഹ്നങ്ങളെ അടിസ്ഥാനമാക്കിയുള്ള വ്യക്തിനാമ ലിപ്യന്തരണം.
- source_word: וְיוֹרַי
  choice: യോരായി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: וְיַעְכָּן
  choice: യാക്കാൻ
  rationale: മസോരറ്റിക് രൂപം പ്രതിഫലിപ്പിക്കുന്ന വായിക്കാവുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וְזִיעַ
  choice: സീയ
  rationale: WLCയിലെ മസോരറ്റിക് രൂപമായ זִיעַ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു; ഇംഗ്ലീഷ് consultation layer-ലെ ‘Ziza’ എന്ന വകഭേദം ഈ എബ്രായ പാഠത്തിൽനിന്ന് ആവശ്യമില്ല.
- source_word: וָעֵבֶר
  choice: ഏബെർ
  rationale: עֵבֶר എന്ന പേരിന്റെ ആദ്യ വ്യഞ്ജനം മലയാളത്തിൽ കൃത്യമായി പുനരാവിഷ്കരിക്കാനാവാത്തതിനാൽ പ്രചാരത്തിലുള്ള സമീപ ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- source_word: שִׁבְעָה
  choice: ആകെ ഏഴുപേർ
  rationale: പട്ടികപ്പെടുത്തിയ വ്യക്തികളുടെ എണ്ണം സംഗ്രഹിക്കുന്ന സംഖ്യയാണ്; ‘ആകെ’യും ‘പേർ’യും മലയാളത്തിൽ അതിന്റെ സംഗ്രഹസ്വഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. പേരുകൾ WLCയിലെ മസോരറ്റിക് രൂപങ്ങളിൽനിന്ന് ലിപ്യന്തരം ചെയ്തു. വാക്യാവസാനത്തിലെ സംഖ്യയുടെ സംഗ്രഹബലം ഡാഷും ‘ആകെ ഏഴുപേർ’ എന്ന പ്രയോഗവുംകൊണ്ട് നിലനിർത്തി.
