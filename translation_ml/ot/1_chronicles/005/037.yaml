id: 1CH.5.37
reference: 1 Chronicles 5:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּ֥וֹלֶד עֲזַרְיָ֖ה אֶת אֲמַרְיָ֑ה וַ/אֲמַרְיָ֖ה הוֹלִ֥יד אֶת אֲחִיטֽוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/037.yaml
  text: Azariah fathered Amariah, and Amariah fathered Ahitub.
translation:
  language: ml
  text: അസര്യാവ് അമര്യാവിനെ ജനിപ്പിച്ചു; അമര്യാവ് അഹീതൂബിനെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: ജനിപ്പിച്ചു
  rationale: יַלד എന്ന ധാതുവിന്റെ ഹിഫീൽ വംശാവലി പ്രയോഗമാണ്. പിതൃവംശത്തിലെ സന്താനബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കാൻ ‘ജനിപ്പിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עֲזַרְיָה
  choice: അസര്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിലെ ‘-നെ’ എന്ന വിഭക്തിപ്രത്യയം അതിന്റെ ധർമം നിർവഹിക്കുന്നു.
- source_word: אֲמַרְיָה
  choice: അമര്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: മുൻപത്തെ וַיּוֹלֶד എന്നതിലെ അതേ വംശാവലി ക്രിയയാണ്; അർഥവും വാക്യത്തിലെ സമാന്തരതയും നിലനിർത്താൻ ഒരേ രീതിയിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: אֲחִיטוּב
  choice: അഹീത്തൂബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: വംശാവലി ക്രിയ നേരിട്ടുള്ള പിതൃത്വമാണോ വംശപരമ്പരയെയോ സൂചിപ്പിക്കുന്നത്
  choice: ‘ജനിപ്പിച്ചു’ എന്ന പരമ്പരാഗത വംശാവലി പ്രയോഗം ഉപയോഗിച്ചു
  alternative: ‘പിതാവായി’ / ‘വംശജനായി ഉണ്ടായി’
  rationale: ഈ സന്ദർഭത്തിലെ ഹിഫീൽ ילד പിതൃവംശബന്ധം അവതരിപ്പിക്കുന്നു. വാചകം നേരിട്ടുള്ള ബന്ധമായി വായിക്കാവുന്നതാണെങ്കിലും വംശാവലികളിൽ ഇടത്തലമുറകൾ ഒഴിവാകാനുള്ള പൊതുസാധ്യത പരിഭാഷയിൽ അധികമായി നിർണയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. പേരുകൾക്ക് മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു.
