id: 1CH.5.8
reference: 1 Chronicles 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בֶ֨לַע֙ בֶּן עָזָ֔ז בֶּן שֶׁ֖מַע בֶּן יוֹאֵ֑ל ה֚וּא יוֹשֵׁ֣ב בַּ/עֲרֹעֵ֔ר וְ/עַד נְב֖וֹ וּ/בַ֥עַל מְעֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/008.yaml
  text: and Bela son of Azaz[a], son of Shema, son of Joel; he lived in Aroer, as far as Nebo and Baal-meon.
translation:
  language: ml
  text: അസാസിന്റെ മകനും ശേമയുടെ മകനും യോവേലിന്റെ മകനുമായ ബേലയും; അവൻ അരോവേറിൽ പാർത്തിരുന്നു; അവിടത്തെ വാസസ്ഥലം നെബോവരെയും ബാൽ-മെയോൻവരെയും വരെ വ്യാപിച്ചിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വസിച്ചിരുന്നു”; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ കൃദന്തരൂപം ഒരു സ്ഥലത്തെ സ്ഥിരവാസത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶלַע
  choice: ബേലയും
  rationale: മുൻവാക്യത്തിലെ വംശാവലിപ്പട്ടികയുമായുള്ള തുടർച്ച സൂചിപ്പിക്കാൻ ו എന്ന സംയോജകം ‘യും’ ആയി നിലനിർത്തി; വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിയുടെ ഔപചാരിക ഘടന നിലനിർത്തുന്നു; ഇവിടെ ‘പിൻതലമുറക്കാരൻ’ എന്നു പൊതുവാക്കേണ്ടതിന് നിർബന്ധകമായ തെളിവില്ല.
- source_word: עָזָז
  choice: അസസ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: שֶׁמַע
  choice: ശേമ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יוֹאֵל
  choice: യോവേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: הוּא
  choice: അവൻ
  rationale: വംശപരമ്പരയ്ക്കുശേഷം വിഷയത്തെ വീണ്ടും എടുത്തുകാട്ടുന്ന സ്വതന്ത്ര സർവനാമം സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: יוֹשֵׁב
  choice: പാർത്തിരുന്നു
  rationale: ישׁב എന്ന ക്രിയയുടെ കാൽ കൃദന്തരൂപം ഒരു സ്ഥലത്തെ സ്ഥിരവാസത്തെ സൂചിപ്പിക്കുന്നു; ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ ‘പാർത്തിരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: בַּעֲרֹעֵר
  choice: അരോവേർ
  rationale: ב എന്ന സ്ഥാനസൂചക മുൻപ്രത്യയം മലയാളത്തിലെ ഭൂവിസ്തൃതി-പരിധി നിർമാണത്തിൽ ‘അരോവേർമുതൽ’ എന്ന രൂപത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: וְעַד
  choice: മുതൽ … വരെയും
  rationale: അരോവേറിൽനിന്ന് തുടർന്നുള്ള സ്ഥലങ്ങളിലേക്കുള്ള ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נְבוֹ
  choice: നെബോ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וּבַעַל מְעוֹן
  choice: ബാൽ-മെയോൻ
  rationale: സംയുക്ത സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് ഘടകബന്ധം വ്യക്തമാക്കാൻ ഹൈഫൻ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വംശാവലിയുടെ ആവർത്തനഘടനയും ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തിയും നിലനിർത്തി; അതേസമയം മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു.
