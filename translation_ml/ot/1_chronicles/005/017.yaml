source:
  edition: WLC
  text: כֻּלָּ/ם֙ הִתְיַחְשׂ֔וּ בִּ/ימֵ֖י יוֹתָ֣ם מֶֽלֶךְ יְהוּדָ֑ה וּ/בִ/ימֵ֖י יָרָבְעָ֥ם מֶֽלֶךְ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/017.yaml
  text: All of them were enrolled by genealogy in the days of Jotham king of Judah[a], and in the days of Jeroboam king of Israel.
translation:
  language: ml
  text: അവരെല്ലാവരും യെഹൂദാരാജാവായ യോഥാമിന്റെ കാലത്തും ഇസ്രായേൽരാജാവായ യൊരോബെയാമിന്റെ കാലത്തും വംശാവലിയിൽ രേഖപ്പെടുത്തപ്പെട്ടു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വംശാവലികളനുസരിച്ച് രജിസ്റ്റർ ചെയ്യപ്പെട്ടു’ എന്നും ‘വംശാവലിയനുസരിച്ച് കണക്കാക്കപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ വംശാവലിരേഖയിൽ പേരുചേർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: അവരെല്ലാവരും
  rationale: മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയത്തോടുകൂടിയ സമഗ്രതയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִתְיַחְשׂוּ
  choice: വംശാവലിയിൽ രേഖപ്പെടുത്തപ്പെട്ടു
  rationale: ദിനവൃത്താന്തങ്ങളിൽ ഈ ഹിത്പയേൽ രൂപം ഒരാളെ വംശാവലിരേഖയിൽ ചേർക്കുകയോ അതനുസരിച്ച് കണക്കാക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഭരണപരവും വംശാവലിസംബന്ധവുമായ ഭാവങ്ങൾ ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: בִּימֵי
  choice: കാലത്ത്
  rationale: അക്ഷരാർഥം ‘നാളുകളിൽ’ എന്നാണെങ്കിലും, ആധുനിക മലയാളത്തിൽ കാലസൂചന സ്വാഭാവികമായി നൽകുന്ന ‘കാലത്ത്’ തിരഞ്ഞെടുത്തു.
- source_word: יוֹתָם
  choice: യോഥാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ വ്യക്തമായി ലിപ്യന്തരിച്ചു.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ
  rationale: എബ്രായ സംയുക്തപദബന്ധത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാള വിശേഷണഘടനയിൽ നൽകി.
- source_word: וּבִימֵי
  choice: കാലത്തും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന കാലസൂചനയും ‘ഉം’ എന്ന ബന്ധകത്തിന്റെ സമാന്തരഘടനയും നിലനിർത്തുന്നു.
- source_word: יָרָבְעָם
  choice: യൊരോബെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ വ്യക്തമായി ലിപ്യന്തരിച്ചു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ
  rationale: എബ്രായ സംയുക്തപദബന്ധം നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നാളുകളിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ ‘കാലത്ത്’ ഉപയോഗിച്ചു; ആവർത്തിത കാലഘടന നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട കാലപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിട്ടുണ്ടെങ്കിലും അതിന്റെ ഉള്ളടക്കം പ്രധാനമായും ‘വംശാവലിയിൽ രേഖപ്പെടുത്തപ്പെട്ടു’ എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി വിശദീകരിക്കുന്നു.
