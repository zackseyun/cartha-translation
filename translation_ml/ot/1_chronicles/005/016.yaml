id: 1CH.5.16
reference: 1 Chronicles 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּֽשְׁב֛וּ בַּ/גִּלְעָ֥ד בַּ/בָּשָׁ֖ן וּ/בִ/בְנֹתֶ֑י/הָ וּ/בְ/כָֽל מִגְרְשֵׁ֥י שָׁר֖וֹן עַל תּוֹצְאוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/016.yaml
  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
translation:
  language: ml
  text: അവർ ഗിലെയാദിലും ബാശാനിലും അതിന്റെ പട്ടണങ്ങളിലും[a] ശാരോനിലെ എല്ലാ മേച്ചിൽപ്പുറങ്ങളിലും[b] അവയുടെ അതിരുകൾവരെയും[c] പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ പുത്രിമാർ’; ഒരു പ്രധാന പ്രദേശത്തോട് ആശ്രിതമായി ബന്ധപ്പെട്ട പട്ടണങ്ങളെയോ ഗ്രാമങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ‘തുറസ്സായ നിലങ്ങൾ’ അല്ലെങ്കിൽ ‘പൊതുനിലങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘അവയുടെ പുറപ്പെടലുകൾവരെ’; അതായത്, അവയുടെ പുറംപരിധികളോ അതിരുകളോ വരെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: പാർത്തു
  rationale: ישב ഇവിടെ ഒരു പ്രദേശത്ത് താമസിച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാർത്തു’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഈ ഭൂമിശാസ്ത്രവിവരണത്തിന് യോജിച്ചതുമാണ്; ‘കുടിയേറി’ എന്നു പറഞ്ഞാൽ ആദ്യമായി വന്ന് സ്ഥിരതാമസമാക്കിയെന്ന ആശയം അനാവശ്യമായി മുൻനിർത്താം.
- source_word: בַּגִּלְעָד
  choice: ഗിലെയാദിൽ
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בַּבָּשָׁן
  choice: ബാശാനിൽ
  rationale: സ്ഥലനാമം മൂലഭാഷയിലെ രൂപത്തോട് ചേർന്ന പരിചിതമായ മലയാളരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וּבִבְנֹתֶיהָ
  choice: അതിന്റെ പട്ടണങ്ങളിലും
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ പുത്രിമാർ’ എന്നാണെങ്കിലും, പ്രധാന പ്രദേശത്തോട് ആശ്രിതമായി ബന്ധപ്പെട്ട പട്ടണങ്ങളെയോ ഗ്രാമങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഏറ്റവും സ്വാഭാവികമായി അടുത്തുള്ള ‘ബാശാൻ’ എന്നതിലേക്കാണ് ചൂണ്ടുന്നത്.
- source_word: מִגְרְשֵׁי
  choice: മേച്ചിൽപ്പുറങ്ങളിലും
  rationale: מִגְרָשׁ ജനവാസകേന്ദ്രങ്ങൾക്കു ചുറ്റുമുള്ള തുറസ്സായ ഭൂമിയെയോ മേച്ചിൽനിലത്തെയോ സൂചിപ്പിക്കാം. ഗോത്രപ്രദേശത്തിന്റെ ഈ വിവരണത്തിൽ ‘മേച്ചിൽപ്പുറങ്ങൾ’ സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നു.
- source_word: שָׁרוֹן
  choice: ശാരോൻ
  rationale: പ്രദേശനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עַל תּוֹצְאוֹתָם
  choice: അവയുടെ അതിരുകൾവരെയും
  rationale: അക്ഷരാർഥത്തിൽ ‘അവയുടെ പുറപ്പെടലുകൾമേൽ/വരെ’ എന്ന സ്ഥലംസംബന്ധിയായ പ്രയോഗം പുറംപരിധിയെയോ അതിരുകളെയോ സൂചിപ്പിക്കുന്നു. ബഹുവചന പ്രത്യയത്തിന്റെ കൃത്യമായ പൂർവപദം അല്പം തുറന്ന നിലയിലായതിനാൽ ‘അവയുടെ’ എന്ന് നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ഭൂമിശാസ്ത്രപരമായ പട്ടികയുടെ ആവർത്തനഘടന നിലനിർത്തിയിട്ടുണ്ട്; പഴഞ്ചൻ പദങ്ങളും അനാവശ്യ വ്യാഖ്യാനവിസ്താരവും ഒഴിവാക്കി.
