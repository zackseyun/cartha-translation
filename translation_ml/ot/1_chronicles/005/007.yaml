revisions:
- from: 'അവന്റെ സഹോദരന്മാർ അവരുടെ വംശങ്ങൾപ്രകാരം[a], തലമുറകളുടെ വംശാവലിയിൽ രേഖപ്പെടുത്തിയിരുന്നത് ഇങ്ങനെ: തലവൻ യെയീയേൽ; പിന്നെ സെഖര്യാവ്.'
  to: 'അവന്റെ സഹോദരന്മാർ അവരുടെ വംശങ്ങൾപ്രകാരം, അവരുടെ തലമുറകളനുസരിച്ച് വംശാവലിയിൽ രേഖപ്പെടുത്തപ്പെട്ടപ്പോൾ: മുഖ്യൻ യെയീയേൽ; സെഖര്യാവു.'
  rationale: The revision removes unsupported connective and explanatory material, renders the Hitpael registration expression with a natural temporal clause, and retains the alternative nominal/registry reading in the anchored footnote. It also avoids implying that Zechariah follows Jeiel in time rather than simply being joined in the list.
  reviewer_model: gpt-5.6-terra
