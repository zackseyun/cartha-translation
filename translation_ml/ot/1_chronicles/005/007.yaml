source:
  edition: WLC
  text: וְ/אֶחָי/ו֙ לְ/מִשְׁפְּחֹתָ֔י/ו בְּ/הִתְיַחֵ֖שׂ לְ/תֹלְדוֹתָ֑/ם הָ/רֹ֥אשׁ יְעִיאֵ֖ל וּ/זְכַרְיָֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
translation:
  language: ml
  text: 'അവന്റെ സഹോദരന്മാർ അവരുടെ വംശങ്ങൾപ്രകാരം, അവരുടെ തലമുറകളനുസരിച്ച് വംശാവലിയിൽ രേഖപ്പെടുത്തപ്പെട്ടപ്പോൾ: മുഖ്യൻ യെയീയേൽ; സെഖര്യാവു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶחָיו
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: വംശാവലിയുടെ സന്ദർഭത്തിൽ אָח സഹോദരന്മാരെയോ അടുത്ത പുരുഷബന്ധുക്കളെയോ സൂചിപ്പിക്കാം. ഏറ്റവും നേരിട്ടുള്ള അർഥമായ ‘സഹോദരന്മാർ’ നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: അവരുടെ വംശങ്ങൾപ്രകാരം
  rationale: ഗോത്രപ്പട്ടികയിൽ מִשְׁפָּחָה എന്നത് ഗാർഹിക കുടുംബത്തേക്കാൾ വിശാലമായ വംശവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. എബ്രായത്തിലെ ഏകവചന പ്രത്യയം കൂട്ടത്തെ സംബന്ധിക്കുന്ന വിതരണാർഥത്തിൽ സ്വാഭാവികമായ മലയാള ബഹുവചനമായി നൽകി.
- source_word: בְּהִתְיַחֵשׂ לְתֹלְדוֹתָם
  choice: തലമുറകളുടെ വംശാവലിയിൽ രേഖപ്പെടുത്തിയിരുന്നത്
  rationale: דּ יחס എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ദിനവൃത്താന്തങ്ങളിൽ വംശാവലിപ്രകാരം രജിസ്റ്റർ ചെയ്യപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; תֹּלְדוֹתָם അവരുടെ തലമുറകളെയോ വംശപരമ്പരകളെയോ വ്യക്തമാക്കുന്നു.
- source_word: הָרֹאשׁ
  choice: തലവൻ
  rationale: רֹאשׁ ഇവിടെ പട്ടികയിലെ മുഖ്യനായ വ്യക്തിയെയോ നേതാവിനെയോ സൂചിപ്പിക്കുന്നു; ‘തലവൻ’ ആ സ്ഥാനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְעִיאֵל
  choice: യെയീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וּזְכַרְיָהוּ
  choice: പിന്നെ സെഖര്യാവ്
  rationale: ബന്ധകമായ וּ ‘പിന്നെ’ എന്നു നൽകി പട്ടികയുടെ തുടർച്ച വ്യക്തമാക്കി; זְכַרְיָהוּ എന്ന പേര് മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
