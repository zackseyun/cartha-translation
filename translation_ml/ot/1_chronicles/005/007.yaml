  register: ആധുനികവും മാന്യവുമായ വംശാവലി-പട്ടികാ ശൈലി. ഉറവിടത്തിലെ സംക്ഷിപ്ത ഘടനയും രജിസ്ട്രേഷൻ സംബന്ധിച്ച അർഥവൈവിധ്യവും മുഖ്യവാക്യത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
