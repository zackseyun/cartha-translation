id: 1CH.5.20
reference: 1 Chronicles 5:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּעָזְר֣וּ עֲלֵי/הֶ֔ם וַ/יִּנָּתְנ֤וּ בְ/יָדָ/ם֙ הַֽ/הַגְרִיאִ֔ים וְ/כֹ֖ל שֶׁ֣/עִמָּ/הֶ֑ם כִּ֠י לֵ/אלֹהִ֤ים זָעֲקוּ֙ בַּ/מִּלְחָמָ֔ה וְ/נַעְתּ֥וֹר לָ/הֶ֖ם כִּי בָ֥טְחוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
translation:
  language: ml
  text: അവർക്കെതിരെ ഇവർക്കു സഹായം ലഭിച്ചു; ഹഗ്ര്യരും[a] അവരോടുകൂടെ ഉണ്ടായിരുന്ന എല്ലാവരും ഇവരുടെ കയ്യിൽ ഏല്പിക്കപ്പെട്ടു[b]. യുദ്ധത്തിൽ ഇവർ ദൈവത്തോടു നിലവിളിച്ചു; അവർ ദൈവത്തിൽ ആശ്രയിച്ചതുകൊണ്ട് അവിടുന്ന് അവരുടെ അപേക്ഷ കേട്ടു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹാഗര്യർ.’
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ ‘ഇവരുടെ കയ്യിൽ കൊടുക്കപ്പെട്ടു’; തോൽപ്പിച്ച് ഇവരുടെ അധികാരത്തിന് കീഴിലാക്കി എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവരുടെ അപേക്ഷയ്ക്ക് അവിടുന്ന് അനുകൂലമായി പ്രതികരിച്ചു’; പദശഃ, ‘അവരാൽ അവിടുന്ന് അഭ്യർഥിക്കപ്പെട്ടു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  choice: അവർക്കെതിരെ ഇവർക്കു സഹായം ലഭിച്ചു
  rationale: עזר എന്ന ക്രിയയുടെ നിഫാൽ രൂപം സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗം നിലനിർത്തുന്നു. അടുത്തുള്ള സർവനാമങ്ങളുടെ രണ്ടു പക്ഷങ്ങളെയും മലയാളത്തിൽ വേർതിരിക്കാൻ ‘അവർ/ഇവർ’ ഉപയോഗിച്ചു; സഹായം നൽകിയ കർത്താവിനെ ഈ ഉപവാക്യത്തിൽ പ്രത്യേകം ചേർത്തിട്ടില്ല.
- source_word: וַיִּנָּתְנוּ בְיָדָם
  choice: ഇവരുടെ കയ്യിൽ ഏല്പിക്കപ്പെട്ടു
  rationale: ‘കയ്യിൽ കൊടുക്കുക’ എന്ന എബ്രായ സൈനിക പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, തോൽപ്പിച്ച് അധികാരത്തിന് കീഴിലാക്കപ്പെട്ടതെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַהַגְרִיאִים
  choice: ഹഗ്ര്യർ
  rationale: ജനവിഭാഗത്തിന്റെ എബ്രായ നാമരൂപത്തോട് അടുത്തുനിൽക്കുന്ന ലിപ്യന്തരണം; ‘ഹാഗര്യർ’ എന്ന മറ്റൊരു പ്രചാരരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְכֹל שֶׁעִמָּהֶם
  choice: അവരോടുകൂടെ ഉണ്ടായിരുന്ന എല്ലാവരും
  rationale: ഹഗ്ര്യരോടൊപ്പം ഉണ്ടായിരുന്ന സഖ്യസേനകളെയോ കൂട്ടരെയോ വ്യക്തികളായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: כִּי לֵאלֹהִים זָעֲקוּ
  choice: ഇവർ ദൈവത്തോടു നിലവിളിച്ചു
  rationale: זעק എന്ന പദത്തിലെ അടിയന്തരമായ സഹായവിളിയുടെ തീവ്രത ‘നിലവിളിച്ചു’ സംരക്ഷിക്കുന്നു.
- source_word: בַּמִּלְחָמָה
  choice: യുദ്ധത്തിൽ
  rationale: സന്ദർഭത്തിലെ നിർദിഷ്ട പോരാട്ടത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְנַעְתּוֹר לָהֶם
  choice: അവിടുന്ന് അവരുടെ അപേക്ഷ കേട്ടു
  rationale: עתר എന്ന നിഫാൽ രൂപം പ്രാർഥനയോടുള്ള ദൈവത്തിന്റെ അനുകൂല പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു. ‘അപേക്ഷ കേട്ടു’ എന്നത് മലയാളത്തിൽ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כִּי בָטְחוּ בוֹ
  choice: അവർ ദൈവത്തിൽ ആശ്രയിച്ചതുകൊണ്ട്
  rationale: בטח ב എന്നത് ദൈവത്തിൽ വിശ്വാസത്തോടെ ആശ്രയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; കാരണം സൂചിപ്പിക്കുന്ന כִּי യും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യുദ്ധസഹായത്തിന്റെ കർത്തൃത്വം
  choice: കർമണിപ്രയോഗമായ ‘സഹായം ലഭിച്ചു’ ഉപയോഗിച്ച് ഉടൻ വരുന്ന ഉപവാക്യത്തിൽ സഹായത്തിന്റെ കർത്താവിനെ പരോക്ഷമായി വെച്ചു.
  alternative: ‘ദൈവം അവരെ സഹായിച്ചു’ എന്നു കർത്താവിനെ നേരിട്ട് വ്യക്തമാക്കുക.
  rationale: എബ്രായ ക്രിയ കർമണിരൂപത്തിലാണ്. തുടർന്നുള്ള ദൈവത്തോടുള്ള നിലവിളിയും ദൈവത്തിന്റെ പ്രതികരണവും സഹായത്തിന്റെ അന്തിമ ഉറവിടം വ്യക്തമാക്കുന്നതിനാൽ, വാക്യഘടനയിൽ ഇല്ലാത്ത കർത്താവിനെ ചേർക്കാതെ ദൈവിക സഹായം സംരക്ഷിക്കാം.
- issue: പ്രാർഥനയോടുള്ള ദൈവത്തിന്റെ പ്രതികരണം
  choice: ‘അവിടുന്ന് അവരുടെ അപേക്ഷ കേട്ടു’
  alternative: ‘അവരുടെ അപേക്ഷയ്ക്ക് അവിടുന്ന് അനുകൂലമായി പ്രതികരിച്ചു’ അല്ലെങ്കിൽ പദശഃ ‘അവരാൽ അവിടുന്ന് അഭ്യർഥിക്കപ്പെട്ടു’.
  rationale: നിഫാൽ രൂപം ദൈവം അപേക്ഷ സ്വീകരിച്ച് അനുകൂലമായി പ്രതികരിച്ചതിനെ ഉൾക്കൊള്ളുന്നു. മലയാളത്തിലെ ‘അപേക്ഷ കേട്ടു’ ഈ പ്രാർഥനാസന്ദർഭം വ്യക്തമായി അറിയിക്കുമ്പോഴും പ്രതികരണത്തിന്റെ സ്വഭാവം അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. അടുത്തടുത്തുള്ള രണ്ടു കൂട്ടരെ ആശയക്കുഴപ്പമില്ലാതെ വേർതിരിക്കാൻ ‘ഇവർ’ ആക്രമിച്ച ഇസ്രായേൽ ഗോത്രങ്ങളെയും ‘അവർ’ ഹഗ്ര്യരെയും അവരുടെ കൂട്ടരെയും സൂചിപ്പിക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
