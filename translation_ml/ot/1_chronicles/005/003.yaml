id: 1CH.5.3
reference: 1 Chronicles 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֥י רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל חֲנ֥וֹךְ וּ/פַלּ֖וּא חֶצְר֥וֹן וְ/כַרְמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/003.yaml
  text: 'The sons of Reuben, the firstborn of Israel: Hanoch, Pallu, Hezron, and Carmi.'
translation:
  language: ml
  text: 'യിസ്രായേലിന്റെ ആദ്യജാതനായ രൂബേന്റെ പുത്രന്മാർ: ഹാനോക്ക്, പല്ലൂ, ഹെസ്രോൻ, കർമി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടികയിൽ בְּנֵי എന്ന സംയുക്ത ബഹുവചനം ഇവിടെ നേരിട്ടുള്ള പുരുഷസന്തതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ ആദ്യജാതനായ
  rationale: ഈ സംയുക്തപ്രയോഗം രൂബേനെ യിസ്രായേലിന്റെ ആദ്യജാതനായി വിശേഷിപ്പിക്കുന്നു; മലയാളത്തിൽ നാമത്തോടു സ്വാഭാവികമായി ചേരുന്ന രൂപം സ്വീകരിച്ചു.
- source_word: חֲנוֹךְ
  choice: ഹാനോക്ക്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: פַלּוּא
  choice: പല്ലൂ
  rationale: എബ്രായ വ്യക്തിനാമമായ פַלּוּאയുടെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: חֶצְרוֹן
  choice: ഹെസ്രോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: כַרְמִי
  choice: കർമി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ സംക്ഷിപ്ത വംശാവലിശൈലിയും നാമപ്പട്ടികയുടെ ഘടനയും നിലനിർത്തി.
