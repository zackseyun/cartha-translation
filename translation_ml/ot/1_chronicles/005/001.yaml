source:
  edition: WLC
  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: The sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ ആദ്യജാതനായ രൂബേന്റെ പുത്രന്മാർ—അവൻ ആദ്യജാതനായിരുന്നു; എന്നാൽ അവൻ തന്റെ പിതാവിന്റെ ശയ്യയെ[a] അശുദ്ധമാക്കിയതിനാൽ, അവന്റെ ജ്യേഷ്ഠാവകാശം ഇസ്രായേലിന്റെ പുത്രനായ യോസേഫിന്റെ പുത്രന്മാർക്കു നൽകപ്പെട്ടു; എങ്കിലും ജ്യേഷ്ഠാവകാശത്തിന്റെ അടിസ്ഥാനത്തിൽ വംശാവലിയിൽ രേഖപ്പെടുത്തേണ്ടതല്ലായിരുന്നു[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “പിതാവിന്റെ ശയ്യകൾ” അഥവാ “കിടക്കകൾ.” ഇവിടെ ബഹുവചനം വിവാഹശയ്യയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “എന്നാൽ ജ്യേഷ്ഠാവകാശപ്രകാരം വംശാവലിയിൽ കണക്കാക്കപ്പെടേണ്ടതല്ലായിരുന്നു.” ജ്യേഷ്ഠാവകാശം യോസേഫിന്റെ പുത്രന്മാർക്കു ലഭിച്ചെങ്കിലും, അതുവഴി അവർ വംശാവലിയിൽ ആദ്യജാതരായി രേഖപ്പെടുത്തപ്പെട്ടില്ല എന്നാണ് ഈ ഉപവാക്യം സൂചിപ്പിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: രൂബേന്റെ പുത്രന്മാർ
  rationale: വാക്യം ഒരു വംശാവലിപ്പട്ടികയിലേക്കുള്ള തുടക്കമാണ്. ഹീബ്രായിലെ വാവ് ബന്ധകത്തെ മലയാളത്തിൽ നിർബന്ധമായി ‘ഇനി’ എന്ന കാലസൂചകപദം ചേർക്കാതെ, സ്വാഭാവികമായ വാക്യാരംഭത്തിലൂടെ അവതരിപ്പിച്ചു.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ആദ്യജാതനായ
  rationale: בכור ജനനക്രമത്തിലെ ആദ്യപുത്രനെ സൂചിപ്പിക്കുന്നു; ‘ആദ്യജാതൻ’ അതിന്റെ നേരിട്ടുള്ളതും സഭാവിഭാഗനിരപേക്ഷവുമായ മലയാളരൂപമാണ്.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: അവൻ ആദ്യജാതനായിരുന്നു
  rationale: כִּי ഇവിടെ മുൻവിവരത്തെ വിശദീകരിക്കുന്നു. മലയാളത്തിലെ വിരാമചിഹ്നവും ഉപവാക്യക്രമവും ആ വിശദീകരണസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: וּבְחַלְּלוֹ
  choice: എന്നാൽ അവൻ … അശുദ്ധമാക്കിയതിനാൽ
  rationale: חלל എന്ന പദത്തിന്റെ അശുദ്ധമാക്കുക/മാനഭംഗപ്പെടുത്തുക എന്ന അർഥവും, ബേത് ചേർന്ന infinitive construct-ന്റെ കാരണസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: יְצוּעֵי אָבִיו
  choice: തന്റെ അപ്പന്റെ ശയനസ്ഥലം
  rationale: മൂലത്തിലെ ബഹുവചനരൂപം വിവാഹശയ്യയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘ശയനസ്ഥലം’ ലൈംഗികസന്ദർഭം അനാവശ്യമായി വിശദീകരിക്കാതെ സ്വാഭാവികവും മാന്യവുമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: נִתְּנָה בְּכֹרָתוֹ
  choice: അവന്റെ ജ്യേഷ്ഠാവകാശം … നൽകപ്പെട്ടു
  rationale: בכורה ജനനക്രമം മാത്രമല്ല, ആദ്യജാതനോടു ബന്ധപ്പെട്ട അവകാശവും പദവിയും സൂചിപ്പിക്കുന്നു. ‘ജ്യേഷ്ഠാവകാശം’ നിയമപരമായ ഈ ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: לִבְנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മകനായ യോസേഫിന്റെ പുത്രന്മാർക്കു
  rationale: യോസേഫിനെയും അവന്റെ പുത്രന്മാരെയും വ്യക്തമാക്കുന്ന ഹീബ്രായ വംശാവലിബന്ധം പൂർണമായി നിലനിർത്തുന്നു.
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  choice: എങ്കിലും ജ്യേഷ്ഠാവകാശപ്രകാരം വംശാവലിയിൽ രേഖപ്പെടുത്തപ്പെടേണ്ടതിനല്ല
  rationale: התיחשׂ എന്ന വംശാവലിസാങ്കേതികപദത്തെ ‘വംശാവലിയിൽ രേഖപ്പെടുത്തുക’ എന്നു പരിഭാഷപ്പെടുത്തി. לַבְּכֹרָה എന്നതിനെ ‘ജ്യേഷ്ഠാവകാശപ്രകാരം’ എന്നു നൽകി, അവകാശത്തിന്റെ കൈമാറ്റവും വംശാവലിസ്ഥാനവും ഒന്നല്ലെന്ന മൂലത്തിലെ നിയന്ത്രണം സംരക്ഷിച്ചു.
theological_decisions:
- issue: രൂബേന്റെ ആദ്യജാതസ്ഥാനവും യോസേഫിന്റെ പുത്രന്മാർക്കു ലഭിച്ച ജ്യേഷ്ഠാവകാശവും തമ്മിലുള്ള ബന്ധം
  choice: രൂബേൻ ജനനക്രമത്തിൽ ആദ്യജാതനായി തുടരുന്നു; ജ്യേഷ്ഠാവകാശം യോസേഫിന്റെ പുത്രന്മാർക്കു നൽകപ്പെട്ടു; എന്നാൽ അതുവഴി അവർ ജ്യേഷ്ഠാവകാശപ്രകാരം വംശാവലിയിൽ രേഖപ്പെടുത്തപ്പെട്ടില്ല.
  alternative: യോസേഫിന്റെ വംശം എല്ലാ അർഥത്തിലും രൂബേനെ മാറ്റി ആദ്യജാതസ്ഥാനത്തെത്തി.
  rationale: അവസാന ഉപവാക്യം അവകാശത്തിന്റെ കൈമാറ്റത്തിന് ഒരു പരിധി നിർദേശിക്കുന്നു. അതിനാൽ നിയമപരമായ ആനുകൂല്യവും വംശാവലിയിലെ ആദ്യജാതസ്ഥാനവും തമ്മിലുള്ള പാഠത്തിലെ സംഘർഷം പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വംശാവലിപരമായ കൃത്യതയ്ക്കായി ‘ആദ്യജാതൻ’, നിയമപരമായ അവകാശത്തിന് ‘ജ്യേഷ്ഠാവകാശം’, genealogical enrollment-ന് ‘വംശാവലിയിൽ രേഖപ്പെടുത്തുക’ എന്നീ വ്യത്യസ്ത പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. മൂലവാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘരേഖ നിലനിർത്തി.
