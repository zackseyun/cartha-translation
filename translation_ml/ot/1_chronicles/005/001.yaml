revisions:
- from: ഇസ്രായേലിന്റെ ആദ്യജാതനായ രൂബേന്റെ പുത്രന്മാർ—അവൻ ആദ്യജാതനായിരുന്നു; എന്നാൽ അവൻ തന്റെ അപ്പന്റെ ശയനസ്ഥലം[a] അശുദ്ധമാക്കിയതിനാൽ, അവന്റെ ജ്യേഷ്ഠാവകാശം ഇസ്രായേലിന്റെ മകനായ യോസേഫിന്റെ പുത്രന്മാർക്കു നൽകപ്പെട്ടു; എങ്കിലും ജ്യേഷ്ഠാവകാശപ്രകാരം വംശാവലിയിൽ രേഖപ്പെടുത്തപ്പെടേണ്ടതിനല്ല[b]—
  to: ഇസ്രായേലിന്റെ ആദ്യജാതനായ രൂബേന്റെ പുത്രന്മാർ—അവൻ ആദ്യജാതനായിരുന്നു; എന്നാൽ അവൻ തന്റെ പിതാവിന്റെ ശയ്യയെ[a] അശുദ്ധമാക്കിയതിനാൽ, അവന്റെ ജ്യേഷ്ഠാവകാശം ഇസ്രായേലിന്റെ പുത്രനായ യോസേഫിന്റെ പുത്രന്മാർക്കു നൽകപ്പെട്ടു; എങ്കിലും ജ്യേഷ്ഠാവകാശത്തിന്റെ അടിസ്ഥാനത്തിൽ വംശാവലിയിൽ രേഖപ്പെടുത്തേണ്ടതല്ലായിരുന്നു[b]—
  rationale: The revision replaces the unclear final negative-purpose construction with a natural impersonal Malayalam clause that retains the Hebrew’s distinction between the transferred birthright and genealogical registration. It also renders the father’s ‘beds/couches’ idiom more directly as ‘ശയ്യ,’ with the literal plural retained in the note. No doctrinal conclusion beyond the source’s stated qualification has been added.
