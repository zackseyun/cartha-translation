  text: וְ/אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבוֹתָ֑/ם וְ/עֵ֡פֶר וְ/יִשְׁעִ֡י וֶ/אֱלִיאֵ֡ל וְ֠/עַזְרִיאֵל וְ/יִרְמְיָ֨ה וְ/הוֹדַוְיָ֜ה וְ/יַחְדִּיאֵ֗ל אֲנָשִׁים֙ גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֣י שֵׁמ֔וֹת רָאשִׁ֖ים לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
translation:
  language: ml
  text: 'ഇവരായിരുന്നു അവരുടെ പിതൃകുടുംബങ്ങളുടെ തലവന്മാർ[a]: ഏഫെർ, യിശ്ഈ, എലീയേൽ, അസ്രിയേൽ, യിരെമ്യാവ്, ഹോദവ്യാവ്, യഹ്ദീയേൽ. ഇവർ വീരപുരുഷന്മാരും പേരുകേട്ട പുരുഷന്മാരും[b] തങ്ങളുടെ പിതൃകുടുംബങ്ങളുടെ തലവന്മാരും ആയിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവരുടെ പൂർവികകുലങ്ങളുടെ തലവന്മാർ.’ ഹീബ്രു പ്രയോഗം ഒരു പൊതുപൂർവികനിൽനിന്നുള്ള കുലാധിഷ്ഠിത കുടുംബഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘പേരുകളുടെ പുരുഷന്മാർ’; അതായത്, പ്രശസ്തരോ വിശിഷ്ടരോ ആയ പുരുഷന്മാർ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവരായിരുന്നു
  rationale: വംശാവലിപ്പട്ടികയെ ചൂണ്ടിക്കാട്ടി അവതരിപ്പിക്കുന്ന പ്രയോഗം; ഹീബ്രുവിലെ ബന്ധകത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: רָאשֵׁי בֵית אֲבוֹתָם
  choice: അവരുടെ പിതൃകുടുംബങ്ങളുടെ തലവന്മാർ
  rationale: ഒരു പൊതുപൂർവികന്റെ കീഴിലുള്ള വംശാധിഷ്ഠിത കുടുംബഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പിതൃകുടുംബങ്ങൾ’ എന്നത് സാമൂഹിക-വംശാവലി ആശയം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: עֵפֶר
  choice: ഏഫെർ
  rationale: ഹീബ്രു വ്യഞ്ജനരൂപത്തോട് ചേർന്ന വ്യക്തിനാമ ലിപ്യന്തരണം.
- source_word: יִשְׁעִי
  choice: യിശ്ഈ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദഘടന കഴിയുന്നത്ര നിലനിർത്തുന്ന ലിപ്യന്തരണം.
- source_word: אֱלִיאֵל
  choice: എലീയേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: עַזְרִיאֵל
  choice: അസ്രിയേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: יִרְמְיָה
  choice: യിരെമ്യാവ്
  rationale: ഹീബ്രു ചുരുക്കനാമരൂപത്തെ പ്രതിഫലിപ്പിക്കുന്ന, മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപം.
- source_word: הוֹדַוְיָה
  choice: ഹോദവ്യാവ്
  rationale: ഈ വാക്യത്തിലെ ഹീബ്രു നാമരൂപത്തെ സൂക്ഷ്മമായി പിന്തുടരുന്ന ലിപ്യന്തരണം.
- source_word: יַחְדִּיאֵל
  choice: യഹ്ദീയേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജനങ്ങളും ദൈവനാമഘടകമായ ‘ഏൽ’ എന്ന അവസാനഭാഗവും നിലനിർത്തുന്നു.
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  choice: പരാക്രമശാലികൾ
  rationale: ശക്തി, ധൈര്യം, യുദ്ധശേഷി എന്നിവ ഉൾക്കൊള്ളുന്ന ഹീബ്രു സ്ഥിരപ്രയോഗത്തിന്റെ ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: പേരുകേട്ട പുരുഷന്മാർ
  rationale: അക്ഷരാർഥത്തിൽ ‘പേരുകളുടെ പുരുഷന്മാർ’; പ്രശസ്തരും വിശിഷ്ടരുമായ ആളുകളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: തങ്ങളുടെ പിതൃകുടുംബങ്ങളുടെ തലവന്മാർ
  rationale: വാക്യാരംഭത്തിലെ പദവിവരണം ഹീബ്രു അവസാനം മനപ്പൂർവം ആവർത്തിക്കുന്നതിനാൽ വിവർത്തനത്തിലും ആവർത്തനം നിലനിർത്തുന്നു.
