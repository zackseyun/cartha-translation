  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. വംശാവലി-സാമൂഹിക ഘടന വ്യക്തമാക്കാൻ ‘പിതൃകുടുംബങ്ങൾ’ സ്വീകരിച്ചു; ഹീബ്രുവിലെ ആരംഭ-അവസാന ആവർത്തനം നിലനിർത്തി. വ്യക്തിനാമങ്ങൾ മൂലഹീബ്രുവിൽനിന്ന് ലിപ്യന്തരിച്ചു.
