  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֣י עַמְרָ֔ם אַהֲרֹ֥ן וּ/מֹשֶׁ֖ה וּ/מִרְיָ֑ם וּ/בְנֵ֣י אַהֲרֹ֔ן נָדָב֙ וַ/אֲבִיה֔וּא אֶלְעָזָ֖ר וְ/אִיתָמָֽרס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/029.yaml
  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
translation:
  language: ml
  text: 'അമ്രാമിന്റെ മക്കൾ[a]: അഹരോൻ, മോശെ, മിര്യാം; അഹരോന്റെ പുത്രന്മാർ: നാദാബ്, അബീഹൂ, എലെയാസാർ, ഈഥാമാർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘പുത്രന്മാർ.’ എന്നാൽ ഈ വംശാവലിപ്പട്ടികയിൽ അഹരോനും മോശെയും മാത്രമല്ല, മിര്യാമും ഉൾപ്പെടുന്നതിനാൽ ഇവിടെ ‘മക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמְרָם
  choice: അമ്രാമിന്റെ മക്കൾ
  rationale: בְּנֵי എന്ന പദം അക്ഷരാർഥത്തിൽ ‘പുത്രന്മാർ’ എന്നാണ്; എന്നാൽ ഇവിടെ മിര്യാമും പട്ടികയിൽ ഉൾപ്പെടുന്നതിനാൽ, അർഥം വ്യക്തമായി നൽകുന്ന ലിംഗനിരപേക്ഷമായ ‘മക്കൾ’ തിരഞ്ഞെടുത്തു. തുടക്കത്തിലെ וּ- വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർക്കാതെ തലക്കെട്ടുപോലുള്ള സ്വാഭാവിക ഘടന ഉപയോഗിച്ചു.
- source_word: אַהֲרֹן וּמֹשֶׁה וּמִרְיָם
  choice: അഹരോൻ, മോശെ, മിര്യാം
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ രൂപങ്ങളിൽ ലിപ്യന്തരിച്ചു; ആവർത്തിക്കുന്ന ഹീബ്രു സംയോജകങ്ങൾ മലയാള പട്ടികയുടെ സ്വാഭാവിക ചിഹ്നക്രമത്തിൽ പ്രതിഫലിപ്പിച്ചു.
- source_word: וּבְנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർ
  rationale: അഹരോന്റെ പട്ടികയിൽ പുരുഷമക്കൾ മാത്രമാണുള്ളത്; അതിനാൽ בְּנֵי എന്നതിന് ഇവിടെ കൂടുതൽ നിർദിഷ്ടമായ ‘പുത്രന്മാർ’ യോജിക്കുന്നു. സംയോജനം അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: നാദാബ്, അബീഹൂ, എലെയാസാർ, ഈഥാമാർ
  rationale: പേരുകൾ ഹീബ്രു രൂപങ്ങളെ അടിസ്ഥാനമാക്കി മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണത്തിൽ നൽകി; സംയോജകങ്ങൾ പട്ടികയുടെ സ്വാഭാവിക മലയാള ഘടനയിൽ അവതരിപ്പിച്ചു.
