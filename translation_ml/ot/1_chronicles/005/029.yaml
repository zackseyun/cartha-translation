  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. രണ്ട് വംശാവലിപ്പട്ടികകളെ അർധവിരാമം ഉപയോഗിച്ച് വ്യക്തമായി വേർതിരിച്ചു; പേരുകൾ സാധാരണ മലയാള ബൈബിൾ പ്രയോഗത്തോട് ചേർന്ന രൂപങ്ങളിൽ നൽകി.
