  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יוֹחָנָ֖ן הוֹלִ֣יד אֶת עֲזַרְיָ֑ה ה֚וּא אֲשֶׁ֣ר כִּהֵ֔ן בַּ/בַּ֕יִת אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
translation:
  language: ml
  text: യോഹാനാൻ അസര്യാവിനെ ജനിപ്പിച്ചു; യെരൂശലേമിൽ ശലോമോൻ പണിത ഭവനത്തിൽ[a] പുരോഹിതനായി സേവിച്ചവൻ അവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദൈവാലയത്തിൽ’; ഹീബ്രുവിൽ ‘ഭവനത്തിൽ’ എന്നാണ്. ശലോമോൻ പണിത ദൈവാലയത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹחָנָן
  choice: യോഹാനാൻ
  rationale: വംശാവലിയുടെ തുടർച്ച മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നതിനാൽ വാവിനെ പ്രത്യേകം ‘പിന്നെ’ എന്നു പരിഭാഷപ്പെടുത്തിയില്ല; പേര് ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: הוֹלִיד אֶת עֲזַרְיָה
  choice: അസര്യാവിനെ ജനിപ്പിച്ചു
  rationale: ഹിഫിൽ രൂപം വംശാവലിയിൽ ‘ജനിപ്പിച്ചു’ എന്ന പിതൃവംശപരമായ അർഥം നൽകുന്നു; ‘അസര്യാവ്’ എന്ന പേരിന്റെ വിഭക്തിരൂപം സ്വാഭാവിക മലയാളത്തിൽ ഉപയോഗിച്ചു.
- source_word: הוּא אֲשֶׁר
  choice: അവനായിരുന്നു
  rationale: അസര്യാവിനെ പ്രത്യേകം തിരിച്ചറിയിക്കുന്ന ഹീബ്രു ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: כִּהֵן
  choice: പുരോഹിതനായി സേവിച്ചവൻ
  rationale: വെറും പദവിയല്ല, പുരോഹിതനായി പ്രവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്ന ക്രിയാബലം നിലനിർത്തുന്നു.
- source_word: בַּ/בַּיִת
  choice: ആലയത്തിൽ
  rationale: പദശഃ ‘വീട്ടിൽ’ എന്നാണ്; എന്നാൽ ശലോമോൻ യെരൂശലേമിൽ പണിത ദൈവാലയമാണ് സന്ദർഭത്തിലെ വ്യക്തമായ സൂചന. മലയാളത്തിൽ ‘ആലയം’ ഉറവിടത്തിലെ ‘വീട്’ എന്ന രൂപകവും ദൈവാലയസൂചനയും ഒരുമിച്ച് വഹിക്കുന്നു.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: ശലോമോൻ ... പണിത
  rationale: ബന്ധവാക്യം മലയാളത്തിലെ സ്വാഭാവിക മുൻവിശേഷണക്രമത്തിൽ നൽകി.
- source_word: בִּ/ירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമവും അതോടൊപ്പമുള്ള ‘ൽ’ സ്ഥാനവിഭക്തിയും സംരക്ഷിച്ചു.
theological_decisions:
- issue: ‘വീട്’ എന്ന പദത്തിന്റെ ദൈവാലയസൂചന
  choice: പ്രധാന പാഠത്തിൽ ‘ആലയം’; അടിക്കുറിപ്പിൽ പദശഃ രൂപം
  alternative: വീട്ടിൽ / ദൈവാലയത്തിൽ
  rationale: ‘വീട്’ എന്ന ഹീബ്രു രൂപകത്തെ പൂർണമായി മറയ്ക്കാതെ, സാധാരണ മലയാളവായനക്കാരന് ഉദ്ദേശിച്ച കെട്ടിടം വ്യക്തമായി മനസ്സിലാകുന്ന വിധത്തിൽ ‘ആലയം’ തിരഞ്ഞെടുത്തു; പദശഃ അർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ വംശാവലി ശൈലി. ‘പുരോഹിതനായി സേവിച്ചു’ എന്ന പ്രയോഗം ഉറവിടക്രിയയുടെ പ്രവർത്തനാർഥം നിലനിർത്തുന്നു; പേരുകൾ ഹീബ്രു രൂപത്തോട് ചേർന്ന മലയാളലിപിയിൽ നൽകി.
