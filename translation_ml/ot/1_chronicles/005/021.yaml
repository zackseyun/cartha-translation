  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁבּ֣וּ מִקְנֵי/הֶ֗ם גְּֽמַלֵּי/הֶ֞ם חֲמִשִּׁ֥ים אֶ֨לֶף֙ וְ/צֹ֗אן מָאתַ֤יִם וַ/חֲמִשִּׁים֙ אֶ֔לֶף וַ/חֲמוֹרִ֖ים אַלְפָּ֑יִם וְ/נֶ֥פֶשׁ אָדָ֖ם מֵ֥אָה אָֽלֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/021.yaml
  text: 'They captured their livestock: 50,000 camels[a], 250,000 sheep, 2,000 donkeys, and 100,000 people.'
translation:
  language: ml
  text: 'അവർ അവരുടെ മൃഗസമ്പത്ത് പിടിച്ചെടുത്തു: 50,000 ഒട്ടകങ്ങൾ, 2,50,000 ആടുകൾ, 2,000 കഴുതകൾ; കൂടാതെ 1,00,000 ആളുകളെയും[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, ‘മനുഷ്യജീവൻ/വ്യക്തി’ (נֶפֶשׁ אָדָם); അതായത്, പിടിക്കപ്പെട്ട 1,00,000 പേർ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: പിടിച്ചെടുത്തു
  rationale: שׁבה എന്ന ക്രിയയ്ക്ക് കൊള്ളയായോ തടവുകാരായോ പിടിച്ചെടുക്കുക എന്ന അർഥമുണ്ട്. ഇവിടെ മൃഗങ്ങളും മനുഷ്യരും കർമങ്ങളായതിനാൽ രണ്ടിനും സ്വാഭാവികമായി ചേരുന്ന പ്രയോഗമാണിത്.
- source_word: מִקְנֵיהֶם
  choice: അവരുടെ മൃഗസമ്പത്ത്
  rationale: מִקְנֶה സമ്പാദ്യവസ്തുക്കളെയോ കന്നുകാലികളെയോ സൂചിപ്പിക്കാം; പിന്നാലെയുള്ള മൃഗങ്ങളുടെ പട്ടിക കണക്കിലെടുക്കുമ്പോൾ ‘മൃഗസമ്പത്ത്’ സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നു.
- source_word: גְּמַלֵּיהֶם
  choice: ഒട്ടകങ്ങൾ
  rationale: ബഹുവചനമായ ‘അവരുടെ ഒട്ടകങ്ങൾ’ എന്ന അർഥം പട്ടികയിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഉടമസ്ഥത മുൻപുള്ള ‘അവരുടെ മൃഗസമ്പത്ത്’ എന്നതിൽ വ്യക്തമാണ്.
- source_word: וְצֹאן
  choice: ആടുകൾ
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കാം. മലയാളത്തിലെ പൊതുവായ ‘ആടുകൾ’ എന്ന പദം ഈ കൂട്ടാർഥം അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַחֲמוֹרִים
  choice: കഴുതകൾ
  rationale: ആധുനിക മലയാളത്തിലെ നേരായതും വ്യക്തവുമായ തത്തുല്യപദം.
- source_word: וְנֶפֶשׁ אָדָם
  choice: ആളുകൾ
  rationale: പദശഃ ‘മനുഷ്യപ്രാണൻ/വ്യക്തി’ എന്നാണെങ്കിലും, എണ്ണപ്പെടുന്ന മനുഷ്യരെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്. ‘ആളുകൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מֵאָה אָלֶף
  choice: 1,00,000
  rationale: ‘ഒരു ലക്ഷം’ എന്ന കൃത്യസംഖ്യ ഇന്ത്യൻ അക്കവിഭജനരീതിയിൽ നൽകിയിരിക്കുന്നു; മറ്റു സംഖ്യകളുമായും ഒരേ ശൈലി പാലിക്കുന്നു.
