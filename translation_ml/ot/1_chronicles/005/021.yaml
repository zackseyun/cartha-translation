translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം ഉപയോഗിച്ചു. സംഖ്യകൾ എളുപ്പത്തിൽ തിരിച്ചറിയാൻ അക്കങ്ങളിൽ ഇന്ത്യൻ വിഭജനരീതിയിൽ നൽകി. മൂലപാഠത്തിലെ പട്ടികാസ്വഭാവം നിലനിർത്താൻ ദ്വിബിന്ദുവും, മൃഗങ്ങളിൽനിന്ന് മനുഷ്യരിലേക്കുള്ള മാറ്റം വ്യക്തമാക്കാൻ അർധവിരാമവും ‘കൂടാതെ’ എന്ന ബന്ധകവും ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് consultation text-ൽ അടിക്കുറിപ്പുസൂചിക ‘camels’ എന്നതിന് ശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കവും എബ്രായപ്രയോഗവും അനുസരിച്ച് അത് ‘ആളുകളെയും’ എന്നതിന് ശേഷം സ്ഥാപിച്ചു.
