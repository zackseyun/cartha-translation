id: 1CH.5.41
reference: 1 Chronicles 5:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וִ/יהוֹצָדָ֣ק הָלַ֔ךְ בְּ/הַגְל֣וֹת יְהוָ֔ה אֶת יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בְּ/יַ֖ד נְבֻכַדְנֶאצַּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/041.yaml
  text: And Jehozadak went away when Yahweh sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar[a].
translation:
  language: ml
  text: യഹോവ യെഹൂദയെയും യെരൂശലേമിനെയും നെബൂഖദ്നേസറിന്റെ കൈയാൽ പ്രവാസത്തിലാക്കിയപ്പോൾ യെഹോസാദാക്ക് പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִ/יהוֹצָדָק
  choice: യെഹോസാദാക്കും
  rationale: പേരിന്റെ പൂർണ എബ്രായരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു. മുൻവാക്യത്തോടുള്ള ബന്ധവും പട്ടികയിലെ ഉൾപ്പെടുത്തലും സന്ദർഭത്തിൽ വ്യക്തമാക്കാൻ prefixed ו ഇവിടെ ‘-ഉം’ ആയി നൽകി.
- source_word: הָלַךְ
  choice: പോയി
  rationale: הלך എന്ന സാധാരണ ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു. പ്രവാസസന്ദർഭം തുടർന്നുള്ള ഉപവാക്യം വ്യക്തമാക്കുന്നതിനാൽ ‘കൊണ്ടുപോകപ്പെട്ടു’ എന്ന കർമണിപ്രയോഗം ചേർത്ത് അർഥം അതിയായി നിർണയിച്ചില്ല.
- source_word: בְּ/הַגְלוֹת
  choice: പ്രവാസത്തിലാക്കിയപ്പോൾ
  rationale: ב + גלה infinitive construct ഇവിടെ കാലസൂചകമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ finite clause ഉപയോഗിച്ചുകൊണ്ട് യഹോവയെ പ്രവർത്താവായും യെഹൂദയെയും യെരൂശലേമിനെയും കർമമായും നിലനിർത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപത്തിൽ നൽകി.
- source_word: אֶת יְהוּדָה וִ/ירוּשָׁלָם
  choice: യെഹൂദയെയും യെരൂശലേമിനെയും
  rationale: മൂലപാഠം ദേശത്തെയും നഗരത്തെയും നേരിട്ട് നാമകരണം ചെയ്യുന്നതിനാൽ ‘ജനങ്ങളെ’ എന്ന് വ്യാഖ്യാനപരമായി കൂട്ടിച്ചേർത്തില്ല.
- source_word: בְּ/יַד
  choice: കൈയാൽ
  rationale: മനുഷ്യപ്രവർത്തകനെ ഉപകരണകർത്താവായി അവതരിപ്പിക്കുന്ന എബ്രായ ശൈലി സംക്ഷിപ്തവും മനസ്സിലാകുന്നതുമായ മലയാള ബൈബിൾഭാഷയിൽ സംരക്ഷിച്ചു.
- source_word: נְבֻכַדְנֶאצַּר
  choice: നെബൂഖദ്നേസർ
  rationale: ബാബിലോൻ രാജാവിന്റെ പേരിന് മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണരൂപം സ്വീകരിച്ചു.
theological_decisions:
- issue: പ്രവാസത്തിലെ ദൈവികവും മാനുഷികവുമായ പ്രവർത്തകത്വം
  choice: യഹോവ പ്രവാസത്തിലാക്കുന്ന മുഖ്യ പ്രവർത്താവായും നെബൂഖദ്നേസർ അവന്റെ കൈയിലെ മാനുഷിക ഉപകരണമായും വാക്യം അവതരിപ്പിക്കുന്നു.
  alternative: പ്രവാസത്തിന്റെ ഫലപ്രദമായ ഏക പ്രവർത്താവായി നെബൂഖദ്നേസറെ അവതരിപ്പിക്കൽ.
  rationale: വാക്യഘടനയിൽ גלה എന്ന infinitive-ന്റെ പ്രവർത്താവ് യഹോവയാണ്; בְּיַד נְבֻכַדְנֶאצַּר ദ്വിതീയമായ മാനുഷിക പ്രവർത്തകത്വം സൂചിപ്പിക്കുന്നു. വിവർത്തനം ഈ പിരിമുറുക്കം പരിഹരിക്കാതെ രണ്ടും നിലനിർത്തുന്നു.
- issue: യെഹോസാദാക്കിന്റെ യാത്രയുടെ സ്വഭാവം
  choice: ‘പോയി’ എന്ന നിഷ്പക്ഷ ക്രിയ നിലനിർത്തി; പ്രവാസത്തിന്റെ സാഹചര്യത്തിൽ അദ്ദേഹം പോയതായി പറയുന്നു.
  alternative: ‘പ്രവാസിയായി കൊണ്ടുപോകപ്പെട്ടു’ എന്ന് വ്യക്തമായി കർമണിയായി വിവർത്തനം ചെയ്യുക.
  rationale: הלך സജീവരൂപത്തിൽ ‘പോയി’ എന്നാണ്; സന്ദർഭം നിർബന്ധിത പ്രവാസത്തെ സൂചിപ്പിച്ചാലും, മൂലക്രിയ തന്നെ കർമണിയല്ല. അതിനാൽ അധിക നിർണയം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘പ്രവാസത്തിലാക്കി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘കൈയാൽ’ എന്നത് മൂലഭാഷയിലെ പ്രവർത്തകത്വശൈലി സംരക്ഷിക്കുന്ന പരിചിതമായ ബൈബിൾപ്രയോഗമാണ്. മുഖ്യവാചകത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനൊപ്പം നൽകിയിരിക്കുന്നു.
