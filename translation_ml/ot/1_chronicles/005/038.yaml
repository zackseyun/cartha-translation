translation:
  language: ml
  text: അഹീതൂബ് സാദോക്കിന്റെ പിതാവായി; സാദോക്ക് ശല്ലൂമിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִיטוּב
  choice: അഹീതൂബ്
  rationale: വ്യക്തിനാമം അർഥവിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാളരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു. വാക്യാരംഭത്തിലെ וַ സംയോജകം മലയാളത്തിൽ പ്രത്യേകം ചേർക്കേണ്ടതില്ല.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ സന്ദർഭത്തിൽ ഹിഫീൽ രൂപം ‘ജനിപ്പിച്ചു/പിതാവായി’ എന്നർഥം നൽകുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വംശബന്ധം വ്യക്തവുമാക്കുന്നതിനാൽ ‘പിതാവായി’ എന്നു നൽകി.
- source_word: אֶת
  choice: '[പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നമാണ്; മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനതയില്ല.
- source_word: צָדוֹק
  choice: സാദോക്ക്
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ/צָדוֹק
  choice: സാദോക്ക്
  rationale: וְ രണ്ടു തലമുറാ പ്രസ്താവനകളെ ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ അർധവിരാമവും തുടർന്നുള്ള സമാന്തരവാക്യഘടനയും ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: ആദ്യ പ്രയോഗത്തോടുള്ള പദസമാനതയും വംശാവലിയുടെ വ്യക്തതയും നിലനിർത്തി.
- source_word: שַׁלּוּם
  choice: ശല്ലൂം
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ദീർഘസ്വരം നിലനിർത്തി.
