  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. ആവർത്തനം മൂലപാഠത്തിന്റെ സമാന്തരഘടനയും തലമുറാക്രമവും നിലനിർത്തുന്നു.
