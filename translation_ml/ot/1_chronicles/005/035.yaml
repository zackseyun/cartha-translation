id: 1CH.5.35
reference: 1 Chronicles 5:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲחִימַ֨עַץ֙ הוֹלִ֣יד אֶת עֲזַרְיָ֔ה וַ/עֲזַרְיָ֖ה הוֹלִ֥יד אֶת יוֹחָנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/035.yaml
  text: Ahimaaz fathered Azariah, and Azariah fathered Johanan.
translation:
  language: ml
  text: അഹീമാസ് അസര്യാവിനെ ജനിപ്പിച്ചു; അസര്യാവ് യോഹാനാനെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  choice: അഹീമാസ്
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ മലയാള ബൈബിൾനാമരീതിക്കനുസരിച്ച് ലിപ്യന്തരിച്ചു. തുടക്കത്തിലെ וַ ഘടനാപരമായ ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകം ‘പിന്നെ’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിസന്ദർഭത്തിലെ ילד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘ജനിപ്പിക്കുക/പിതാവാകുക’ എന്ന അർഥത്തിലാണ്. ‘ജനിപ്പിച്ചു’ സംക്ഷിപ്തവും നിലവിലെ മലയാള ബൈബിൾശൈലിയിൽ സ്വാഭാവികവുമാണ്.
- source_word: אֶת
  choice: '[പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിലെ കർമവിഭക്തിയിലൂടെ അതിന്റെ പ്രവർത്തനം പ്രകടമാകുന്നു.
- source_word: עֲזַרְיָה
  choice: അസര്യാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളത്തിൽ പരിചിതമായ ബൈബിൾനാമരീതിയിൽ ലിപ്യന്തരിച്ചു; കർമസ്ഥാനത്ത് ‘അസര്യാവിനെ’ എന്നും കർത്തൃസ്ഥാനത്ത് ‘അസര്യാവ്’ എന്നും വിഭക്തി ചേർത്തു.
- source_word: וַ/עֲזַרְיָה
  choice: അസര്യാവ്
  rationale: മുൻചേർന്ന וַ രണ്ട് വംശാവലിവാക്യങ്ങളെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ അർദ്ധവിരാമവും തുടർന്നുള്ള വാക്യക്രമവും ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേകം ‘പിന്നെ’ ചേർത്തിട്ടില്ല.
- source_word: יוֹחָנָן
  choice: യോഹാനാൻ
  rationale: ഹീബ്രു വ്യക്തിനാമം ശബ്ദരൂപത്തോട് ചേർന്നും മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായും ലിപ്യന്തരിച്ചു.
