translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. മൂലത്തിലെ ആവർത്തനഘടന നിലനിർത്തി; പാഠത്തിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
