translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. എബ്രായത്തിലെ കൈ-അധികാര രൂപകം ഭാഗികമായി നിലനിർത്തുകയും സർവനാമങ്ങളുടെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ഹഗ്ര്യർ എന്ന പേര് ആവശ്യമായിടത്ത് ആവർത്തിക്കുകയും ചെയ്തു.
