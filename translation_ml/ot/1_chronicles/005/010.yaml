  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בִ/ימֵ֣י שָׁא֗וּל עָשׂ֤וּ מִלְחָמָה֙ עִם הַֽ/הַגְרִאִ֔ים וַֽ/יִּפְּל֖וּ בְּ/יָדָ֑/ם וַ/יֵּשְׁבוּ֙ בְּ/אָ֣הֳלֵי/הֶ֔ם עַֽל כָּל פְּנֵ֖י מִזְרָ֥ח לַ/גִּלְעָֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/010.yaml
  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
translation:
  language: ml
  text: ശൗലിന്റെ കാലത്ത് അവർ ഹഗ്ര്യരോടു[a] യുദ്ധം ചെയ്തു. ഹഗ്ര്യർ അവരുടെ കൈയിൽ അകപ്പെട്ടു[b]. പിന്നെ അവർ ഗിലെയാദിന് കിഴക്കുള്ള പ്രദേശത്തെങ്ങുമുള്ള ഹഗ്ര്യരുടെ കൂടാരങ്ങളിൽ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഹാഗാര്യർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ എബ്രായ ജനനാമം ഹാഗാറുമായി ബന്ധപ്പെട്ട ഒരു ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അവർ അവരുടെ കൈയിൽ വീണു”; അതായത്, അവരുടെ അധികാരത്തിലായി. സന്ദർഭമനുസരിച്ച് വീണവർ ഹഗ്ര്യരാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי שָׁאוּל
  choice: ശൗലിന്റെ കാലത്ത്
  rationale: കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും ഗൗരവത്തോടെയും അവതരിപ്പിക്കുന്നു.
- source_word: עָשׂוּ מִלְחָמָה עִם
  choice: യുദ്ധം ചെയ്തു
  rationale: യുദ്ധത്തിൽ ഏർപ്പെടുക എന്ന എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ നേരായ മലയാളരൂപം; ‘ഓടു’ എന്ന വിഭക്തി എതിരാളിയെ സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַהַגְרִאִים
  choice: ഹഗ്ര്യർ
  rationale: എബ്രായ ജനനാമത്തിന്റെ രൂപത്തോട് അടുത്ത ലിപ്യന്തരണം; ഹാഗാറുമായുള്ള സാധ്യതയുള്ള ബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּפְּלוּ בְּיָדָם
  choice: ഹഗ്ര്യർ അവരുടെ കൈയിൽ അകപ്പെട്ടു
  rationale: ‘അവരുടെ കൈയിൽ വീണു’ എന്ന എബ്രായ അധികാരരൂപകം മലയാളത്തിൽ വ്യക്തമായി ‘കൈയിൽ അകപ്പെട്ടു’ എന്നു നൽകുന്നു; സന്ദർഭത്തിൽ ഒളിഞ്ഞിരിക്കുന്ന കർത്താവിനെ ആവർത്തിച്ച് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: וַיֵּשְׁבוּ בְּאָהֳלֵיהֶם
  choice: ഹഗ്ര്യരുടെ കൂടാരങ്ങളിൽ താമസിച്ചു
  rationale: കൂടാരമെന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; സർവനാമത്തിന്റെ സാധ്യതയുള്ള പൂർവപദം വ്യക്തതയ്ക്കായി പേരിട്ട് പറയുന്നു, എന്നാൽ സ്ഥിരകുടിയേറ്റം എന്ന ആശയം അധികമായി ചേർക്കുന്നില്ല.
- source_word: עַל כָּל פְּנֵי מִזְרָח לַגִּלְעָד
  choice: ഗിലെയാദിന് കിഴക്കുള്ള പ്രദേശത്തെങ്ങുമുള്ള
  rationale: മുഴുവൻ വിസ്തൃതിയിലുമെന്ന സ്ഥലവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
