  variant: modern standard Malayalam
source:
  edition: WLC
  text: מְרָיוֹת֙ הוֹלִ֣יד אֶת אֲמַרְיָ֔ה וַ/אֲמַרְיָ֖ה הוֹלִ֥יד אֶת אֲחִיטֽוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/033.yaml
  text: Meraioth fathered Amariah, and Amariah fathered Ahitub.
translation:
  language: ml
  text: മെരായോത്ത് അമര്യാവിന്റെ പിതാവായിരുന്നു; അമര്യാവ് അഹീതൂബിന്റെ പിതാവായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרָיוֹת
  choice: മെരായോത്ത്
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തെ സമീപിക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയുടെ സന്ദർഭത്തിൽ ഹിഫീൽ രൂപം പിതൃവംശബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ‘ജനിപ്പിച്ചു’ ആ അർഥം നിലനിർത്തുന്നു.
- source_word: אֵת
  choice: പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: നിശ്ചിത നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണിത്; മലയാള വിഭക്തിപ്രത്യയം ‘-നെ’ അതിന്റെ പ്രവർത്തനം വാക്യത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֲמַרְיָה
  choice: അമര്യാവ് / അമര്യാവിനെ
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു; മലയാള വാക്യത്തിലെ കാർകത്തിനനുസരിച്ച് വിഭക്തിരൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: וַ/אֲמַרְיָה
  choice: അമര്യാവ്
  rationale: വാവ് ബന്ധകത്തിന്റെ ഏകോപനപ്രവർത്തനം മലയാളത്തിലെ അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി; പേരിനെ ലിപ്യന്തരിച്ചു.
- source_word: אֲחִיטוּב
  choice: അഹീതൂബ്
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തെ സമീപിക്കുന്ന രീതിയിൽ മലയാളലിപിയിൽ നൽകി.
