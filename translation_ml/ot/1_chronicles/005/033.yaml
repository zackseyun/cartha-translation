translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിക്കുന്ന എബ്രായ ക്രിയ രണ്ടു ഘടകങ്ങളിലും ഒരേപോലെ പരിഭാഷപ്പെടുത്തി.
