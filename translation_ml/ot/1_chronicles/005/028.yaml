base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/028.yaml
  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: ml
  text: 'കെഹാത്തിന്റെ പുത്രന്മാർ: അമ്രാം, യിസ്ഹാർ, ഹെബ്രോൻ, ഉസ്സീയേൽ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי קְהָת
  choice: കെഹാത്തിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ו മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യബന്ധത്തിൽ ഉൾക്കൊള്ളുന്നു; בְנֵי എന്നത് ഇവിടെ വിശാലമായ ‘സന്തതികൾ’ എന്നതിലുപരി നേരിട്ടുള്ള ‘പുത്രന്മാർ’ എന്നാണ്.
- source_word: עַמְרָם
  choice: അമ്രാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപരമ്പരയോട് ചേർന്ന ലിപ്യന്തരണം.
- source_word: יִצְהָר
  choice: യിസ്ഹാർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം തിരിച്ചറിയാവുന്ന വിധത്തിൽ നിലനിർത്തുന്ന ലിപ്യന്തരണം.
- source_word: וְ/חֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: ഇവിടെ സ്ഥലപ്പേരല്ല, വംശാവലിയിലെ വ്യക്തിനാമമാണ്; മുൻപ്രത്യയമായ conjunction പട്ടികയുടെ മലയാള ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: וְ/עֻזִּיאֵל
  choice: ഉസ്സീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ രൂപം; അവസാനത്തെ ו പട്ടികയിലെ ബന്ധമായി വിരാമചിഹ്നഘടനയിൽ പ്രകടമാകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ സംക്ഷിപ്ത വംശാവലി-പട്ടികയുടെ രൂപം കോളൺ ഉപയോഗിച്ച് നിലനിർത്തി; അനാവശ്യമായ ബന്ധകപദം ചേർത്തിട്ടില്ല.
