id: 1CH.5.6
reference: 1 Chronicles 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּאֵרָ֣ה בְנ֔/וֹ אֲשֶׁ֣ר הֶגְלָ֔ה תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשֻּׁ֑ר ה֥וּא נָשִׂ֖יא לָ/רֽאוּבֵנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
translation:
  language: ml
  text: അവന്റെ മകൻ ബെയേരയെ അശ്ശൂരിന്റെ രാജാവായ തിൽഗത്ത്-പിൽനെസെർ[a] പ്രവാസത്തിലേക്കു കൊണ്ടുപോയി. അവൻ രൂബേന്യരുടെ ഒരു തലവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ അശ്ശൂർരാജാവിന്റെ പേരിന്റെ എബ്രായരൂപം ‘തിൽഗത്ത്-പിൽനെസെർ’ എന്നാണ്; കൂടുതൽ പരിചിതമായ ചരിത്രനാമരൂപം ‘തിഗ്ലത്ത്-പിലേസെർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  choice: ബെയേര
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തതായി മലയാളലിപിയിൽ പകർത്തി.
- source_word: בְנוֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയം മുൻവാക്യത്തിലെ വംശപിതാവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധപ്രയോഗം.
- source_word: אֲשֶׁר הֶגְלָה
  choice: പ്രവാസത്തിലേക്കു കൊണ്ടുപോയി
  rationale: גלה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥവും നിർബന്ധിത നാടുകടത്തലിന്റെ ചരിത്രസന്ദർഭവും വ്യക്തമാക്കുന്നു.
- source_word: תִּלְגַת פִּלְנְאֶסֶר
  choice: തിൽഗത്ത്-പിൽനെസെർ
  rationale: ഈ വാക്യത്തിലെ എബ്രായ നാമരൂപം നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു; മറ്റു സ്ഥലങ്ങളിൽ പരിചിതമായ തിഗ്ലത്ത്-പിലേസെർ എന്ന രൂപവുമായി നിശ്ശബ്ദമായി ഏകീകരിക്കുന്നില്ല.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: അശ്ശൂർരാജാവായ
  rationale: സംയുക്തപദബന്ധത്തെ വ്യക്തിനാമത്തോടുള്ള സ്വാഭാവിക മലയാള വിശേഷണപ്രയോഗമായി വിവർത്തനം ചെയ്തു.
- source_word: הוּא
  choice: അവൻ
  rationale: ആപേക്ഷിക ഉപവാക്യത്തിനു ശേഷം ബെയേരയിലേക്കു വീണ്ടും ശ്രദ്ധ തിരിക്കുന്ന എബ്രായത്തിലെ സ്വതന്ത്ര സർവനാമത്തിന്റെ ആവർത്തനപരമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: נָשִׂיא
  choice: തലവൻ
  rationale: ഗോത്ര-വംശാവലി സന്ദർഭത്തിലെ അംഗീകൃത നേതാവിനെ സൂചിപ്പിക്കുന്നു; രാജകീയ അർത്ഥം തോന്നിക്കാവുന്ന ‘പ്രഭു’ എന്നതിനേക്കാൾ വ്യക്തമാണ്.
- source_word: לָרְאוּבֵנִי
  choice: രൂബേന്യരുടെ
  rationale: നേതൃത്വം വഹിച്ചിരുന്ന ജനവിഭാഗത്തോടുള്ള ബന്ധം സ്വാഭാവിക മലയാള ഷഷ്ഠീവിഭക്തിയിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. വംശാവലി വാക്യത്തിന്റെ ചുരുക്കം നിലനിർത്തിക്കൊണ്ട്, ദീർഘമായ ആപേക്ഷികഘടനയ്ക്ക് പകരം രണ്ടു സ്വാഭാവിക വാക്യങ്ങൾ ഉപയോഗിച്ചു. ‘ഒരു തലവൻ’ എന്നത് നിർദ്ദിഷ്ടതയില്ലാത്ത എബ്രായ നാമപ്രയോഗം നിലനിർത്തുന്നു.
