  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ലേവിയുടെ സന്തതികൾ.’ വംശാവലികളിൽ ‘പുത്രന്മാർ’ എന്ന പ്രയോഗം ചിലപ്പോൾ വിശാലമായ വംശപരമ്പരയെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ ഏറ്റവും സ്വാഭാവികമായി ഉദ്ദേശിക്കുന്നത് ലേവിയുടെ നേരിട്ടുള്ള മൂന്ന് പുത്രന്മാരെയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ construct ബഹുവചനം. വംശാവലികളിൽ ഇത് ചിലപ്പോൾ സന്തതികളെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ ലേവിയുടെ നേരിട്ടുള്ള മൂന്ന് പുത്രന്മാരെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: לֵוִי
  choice: ലേവി
  rationale: വ്യക്തിനാമം; മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതവും എബ്രായ ഉച്ചാരണത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: גֵּרְשׁוֹן
  choice: ഗേർശോൻ
  rationale: ഇവിടെയുള്ള എബ്രായ നാമരൂപത്തെ പ്രതിഫലിപ്പിക്കുന്നു; മറ്റിടങ്ങളിലെ ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ ഗേർശോം എന്ന പേര് ഇവിടെ കൊണ്ടുവരുന്നില്ല.
- source_word: קְהָת
  choice: കെഹാത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מְרָרִי
  choice: മെരാരി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וּ
  choice: ഉം
  rationale: പട്ടികയിലെ അവസാന നാമത്തെ മുൻപുള്ളവയോട് ബന്ധിപ്പിക്കുന്ന ലളിതമായ സംയോജകപ്രയോഗം; മലയാളത്തിൽ ‘കെഹാത്തും മെരാരിയും’ എന്ന ഘടനയ്ക്കുപകരം ശീർഷകസദൃശമായ പട്ടികയിൽ കോമയും അവസാന നാമത്തിനു മുമ്പുള്ള ബന്ധവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
