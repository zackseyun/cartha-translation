source:
  edition: WLC
  text: אֶלְעָזָר֙ הוֹלִ֣יד אֶת פִּֽינְחָ֔ס פִּֽינְחָ֖ס הֹלִ֥יד אֶת אֲבִישֽׁוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/030.yaml
  text: Eleazar fathered Phinehas; Phinehas fathered Abishua.
translation:
  language: ml
  text: എലെയാസാർ ഫീനെഹാസിന്റെ പിതാവായി; ഫീനെഹാസ് അബീശൂവയുടെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָזָר
  choice: എലെയാസാർ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ നാമരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിസന്ദർഭത്തിൽ ഹിഫ്ഇൽ രൂപം ഒരാളെ ജനിപ്പിച്ച് അവന്റെ പിതാവാകുക എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിൽ പ്രത്യേക പദം ആവശ്യമില്ല.
- source_word: פִּינְחָס
  choice: ഫീനെഹാസ്
  rationale: ഹീബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ പരിചിതമായ ബൈബിൾ നാമരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: פִּינְחָס
  choice: ഫീനെഹാസ്
  rationale: വംശാവലിയുടെ തുടർച്ച വ്യക്തമാക്കാൻ രണ്ടാം ഉപവാക്യത്തിലും ആവർത്തിച്ചിരിക്കുന്ന വ്യക്തിനാമം അതേ രൂപത്തിൽ നിലനിർത്തി.
- source_word: הֹלִיד
  choice: പിതാവായി
  rationale: ആദ്യ ഉപവാക്യത്തിലെ അതേ ക്രിയയും അതേ വംശാവലിപ്രയോഗവും ആയതിനാൽ ഒരേ രീതിയിൽ വിവർത്തനം ചെയ്തു.
- source_word: אֶת
  choice: '[പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: നേരിട്ടുള്ള കർമചിഹ്നമായതിനാൽ അതിന്റെ പ്രവർത്തനം മലയാള വാക്യഘടനയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: אֲבִישׁוּעַ
  choice: അബീശൂവ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് അടുത്തും മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികവുമായ ലിപ്യന്തരണം തെരഞ്ഞെടുത്തു.
