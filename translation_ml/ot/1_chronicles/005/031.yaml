id: 1CH.5.31
reference: 1 Chronicles 5:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲבִישׁ֨וּעַ֙ הוֹלִ֣יד אֶת בֻּקִּ֔י וּ/בֻקִּ֖י הוֹלִ֥יד אֶת עֻזִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/031.yaml
  text: Abishua fathered Bukki, and Bukki fathered Uzzi.
translation:
  language: ml
  text: അബീശൂവ ബുക്കിയുടെ പിതാവായി; ബുക്കി ഉസ്സിയുടെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: അബീശൂവ
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന രീതിയിൽ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു. തുടക്കത്തിലെ וַ തുടർന്നുള്ള വംശാവലിബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഒറ്റവാക്യമായി സ്വാഭാവികമാക്കാൻ പ്രത്യേകം പദമായി നൽകിയിട്ടില്ല.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിസന്ദർഭത്തിലെ ഹിഫിൽ രൂപം ‘ജനിപ്പിച്ചു/പിതാവായി’ എന്ന അർഥം നൽകുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ‘പിതാവായി’ തിരഞ്ഞെടുത്തു.
- source_word: אֶת
  choice: '[വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: നിശ്ചിത കർമത്തെ അടയാളപ്പെടുത്തുന്ന എബ്രായ വ്യാകരണഘടകം; മലയാളത്തിൽ പ്രത്യേക തത്തുല്യപദം ആവശ്യമില്ല.
- source_word: בֻּקִּי
  choice: ബുക്കി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וּ/בֻקִּי
  choice: ബുക്കി
  rationale: വംശാവലിയുടെ ലളിതമായ തുടർച്ച മലയാളത്തിൽ അർധവിരാമത്തിലൂടെയും ആവർത്തിച്ച കർത്താവിലൂടെയും വ്യക്തമായതിനാൽ וּ പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തിയില്ല.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: ആദ്യ പ്രയോഗത്തോടുള്ള സുതാര്യതയും ശൈലീസ്ഥിരതയും നിലനിർത്താൻ അതേ രൂപം ആവർത്തിച്ചു.
- source_word: עֻזִּי
  choice: ഉസ്സി
  rationale: ദ്വിത്വ z ശബ്ദത്തെ മലയാളത്തിലെ ‘സ്സ’ ഉപയോഗിച്ച് പ്രതിനിധീകരിച്ച എബ്രായ വ്യക്തിനാമ ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. ‘ജനിപ്പിച്ചു’ എന്ന നേരിട്ടുള്ള രൂപത്തേക്കാൾ സ്വാഭാവികമായ ‘പിതാവായി’ ഉപയോഗിച്ചു; മൂലത്തിലെ ആവർത്തനഘടന നിലനിർത്തി.
