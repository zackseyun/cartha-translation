  terminology: ‘ആദ്യജാതൻ,’ ‘അബ്ദോൻ,’ ‘സൂർ,’ ‘കീശ്,’ ‘ബാൽ,’ and ‘നാദാബ്’ are appropriate modern Malayalam renderings/transliterations. ‘ബാൽ’ is retained as a personal name, without importing a theological interpretation.
  issues:
