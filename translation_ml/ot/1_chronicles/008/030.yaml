translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത സ്വഭാവം നിലനിർത്തിയിരിക്കുന്നു; മൂലത്തിലെ നാമപദഘടനയെക്കുറിച്ചുള്ള കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
