  yaml_path: translation/ot/1_chronicles/008/030.yaml
  text: His firstborn son was Abdon[a], then Zur, Kish, Baal, and Nadab.
translation:
  language: ml
  text: അവന്റെ ആദ്യജാതനായ മകൻ അബ്ദോൻ[a] ആയിരുന്നു; തുടർന്ന് സൂർ, കീശ്, ബാൽ, നാദാബ് എന്നിവരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘അവന്റെ മകൻ—ആദ്യജാതൻ അബ്ദോൻ—സൂർ, കീശ്, ബാൽ, നാദാബ്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ
  choice: അവന്റെ ... മകൻ
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന വാവ് മലയാളത്തിൽ നിർബന്ധമായി ‘പിന്നെ/കൂടാതെ’ എന്നു വേർതിരിച്ചു നൽകാതെ സ്വാഭാവികമായ വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി; പ്രത്യയം ‘അവന്റെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַבְּכוֹר
  choice: ആദ്യജാതനായ
  rationale: ജനനക്രമത്തിലെ ആദ്യപുത്രൻ എന്ന മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: עַבְדּוֹן
  choice: അബ്ദോൻ
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: וְצוּר
  choice: പിന്നെ സൂർ
  rationale: പേരുകളുടെ പട്ടികയിലെ വാവ് സ്വാഭാവികമായ മലയാളത്തിൽ ‘പിന്നെ’ എന്നു നൽകി; צוּר എന്ന വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: וְקִישׁ
  choice: കീശ്
  rationale: വ്യക്തിനാമം മൂലഭാഷയിലെ ദീർഘസ്വരവും അവസാന വ്യഞ്ജനവും പ്രതിഫലിപ്പിച്ച് ലിപ്യന്തരിച്ചു.
- source_word: וּבַעַל
  choice: ബാൽ
  rationale: ഇവിടെ വംശാവലിയിലെ വ്യക്തിനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: וְנָדָב
  choice: നാദാബ്
  rationale: വ്യക്തിനാമം മൂലഭാഷയിലെ സ്വരരൂപം പ്രതിഫലിപ്പിച്ച് ലിപ്യന്തരിച്ചു.
