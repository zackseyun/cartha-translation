lexical_decisions:
- source_word: וְ
  choice: എന്നിവരും
  rationale: ഓരോ പേരിനുമുമ്പുമുള്ള എബ്രായ സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ പട്ടികാശൈലിയിൽ അവസാനത്തെ ‘എന്നിവരും’ എന്ന പ്രയോഗത്തിലൂടെ പ്രതിനിധീകരിക്കുന്നു.
- source_word: עַבְדּוֹן
  choice: ഒബ്ദോൻ
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: זִכְרִי
  choice: സിക്രി
  rationale: വ്യക്തിനാമത്തിലെ എബ്രായ വ്യഞ്ജനമായ כ ഇവിടെ ഘർഷധ്വനിയല്ലാത്ത /k/ ആയി വരുന്നതിനാൽ ‘സിക്രി’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: חָנָן
  choice: ഹാനാൻ
  rationale: എബ്രായ വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ, ദീർഘസ്വരങ്ങളെ പ്രതിഫലിപ്പിച്ച് ‘ഹാനാൻ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
