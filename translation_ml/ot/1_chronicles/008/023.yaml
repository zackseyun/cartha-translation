translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, വംശാവലിപ്പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. ഇംഗ്ലീഷ് ലിപ്യന്തരത്തിലെ ‘Zichri/Zicri’ വ്യത്യാസം മലയാള പരിഭാഷയ്ക്ക് പ്രസക്തമല്ല; എബ്രായ ഉച്ചാരണം ‘സിക്രി’ എന്ന രൂപത്തെ പിന്തുണയ്ക്കുന്നതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
