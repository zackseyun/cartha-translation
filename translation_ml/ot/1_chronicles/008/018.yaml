  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ വായനാസൗകര്യമുള്ള മലയാള ലിപ്യന്തരണം; നടുവിലെ അയിൻ പ്രത്യേകം ചിഹ്നപ്പെടുത്തുന്നില്ല.
