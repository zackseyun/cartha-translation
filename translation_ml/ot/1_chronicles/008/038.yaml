  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വംശാവലിയുടെ ഔപചാരിക ഭാവം നിലനിർത്താൻ ‘പുത്രന്മാർ’, ‘ആദ്യജാതൻ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു.
