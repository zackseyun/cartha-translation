base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
translation:
  language: ml
  text: 'ആസേലിന് ആറു പുത്രന്മാർ[a] ഉണ്ടായിരുന്നു. അവരുടെ പേരുകൾ ഇവയാണ്: അവന്റെ ആദ്യജാതനായ അസ്രിക്കാം, യിശ്മായേൽ, ശെയര്യാവ്, ഒബദ്യാവ്, ഹാനാൻ. ഇവരെല്ലാവരും ആസേലിന്റെ പുത്രന്മാരായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ആസേലിന് ആറു പുത്രന്മാർ.’ എബ്രായത്തിൽ വംശാവലികളിൽ ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന ഒരു പ്രത്യേക പ്രയോഗമാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָצֵל
  choice: ആസേലിന് ... ഉണ്ടായിരുന്നു
  rationale: לְ ചേർന്ന വംശാവലിസംബന്ധിയായ ഉടമസ്ഥതാ പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ അസ്തിത്വ-ഉടമസ്ഥതാ ഘടനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: שִׁשָּׁה בָנִים
  choice: ആറു പുത്രന്മാർ
  rationale: ഈ വംശാവലിയിൽ בָנִים പുരുഷസന്തതികളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: അവരുടെ പേരുകൾ ഇവയാണ്
  rationale: എബ്രായത്തിലെ മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം നിലനിർത്തിക്കൊണ്ട് പേരുപറയുന്ന പതിവുഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: עַזְרִיקָם בֹּכְרוּ
  choice: അവന്റെ ആദ്യജാതനായ അസ്രീക്കാം
  rationale: בֹּכְרוּ ആസേലുമായുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന സമാനാധികരണ പ്രയോഗമാണ്; മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിച്ചു.
- source_word: יִשְׁמָעֵאל
  choice: യിശ്മായേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: שְׁעַרְיָה
  choice: ശെയര്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഘടകങ്ങളും അവസാനത്തെ ദൈവനാമസംബന്ധിയായ രൂപവും പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: עֹבַדְיָה
  choice: ഓബദ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദസാമീപ്യത്തോടെ ലിപ്യന്തരിച്ചു.
- source_word: חָנָן
  choice: ഹാനാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ദീർഘസ്വരവും വ്യഞ്ജനരൂപവും പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: כָּל אֵלֶּה בְּנֵי אָצַל
  choice: ഇവരെല്ലാവരും ആസേലിന്റെ പുത്രന്മാരായിരുന്നു
  rationale: പട്ടികയുടെ സമാപനവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കി; ആസേൽ എന്ന പേര് മുമ്പത്തെ രൂപത്തോട് ഏകീകരിച്ചു.
