id: 1CH.8.37
reference: 1 Chronicles 8:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מוֹצָ֖א הוֹלִ֣יד אֶת בִּנְעָ֑א רָפָ֥ה בְנ֛/וֹ אֶלְעָשָׂ֥ה בְנ֖/וֹ אָצֵ֥ל בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/037.yaml
  text: And Moza fathered Binea; Rephah was his son, Eleasah his son, Azel his son.
translation:
  language: ml
  text: മോസാ ബിനെയാവിനെ ജനിപ്പിച്ചു; രേഫാ അവന്റെ മകൻ, എലെയാസാ അവന്റെ മകൻ, ആസേൽ അവന്റെ മകൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מוֹצָא
  choice: മോസാ
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ו മലയാളത്തിൽ വേറെ ‘യും’ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു; מוֹצָא എന്ന വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ‘മോസാ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയിൽ ഹിഫിൽ രൂപത്തിന് ‘പിതാവായി/ജനിപ്പിച്ചു’ എന്ന അർഥമുണ്ട്. ‘ജനിപ്പിച്ചു’ സംക്ഷിപ്തവും മലയാള ബൈബിൾ വംശാവലി ശൈലിക്ക് യോജിച്ചതുമാണ്.
- source_word: אֶת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത കർമത്തെ അടയാളപ്പെടുത്തുന്ന ഈ പദത്തിന് മലയാളത്തിൽ സ്വതന്ത്രമായ തുല്യപദമില്ല; വാക്യത്തിലെ കർമരൂപം അതിന്റെ പ്രവർത്തനം വഹിക്കുന്നു.
- source_word: בִּנְעָא
  choice: ബിനെയാ
  rationale: ഹീബ്രു സ്വരീകരണവും അവസാനത്തെ ע സൂചിപ്പിക്കുന്ന സ്വരസഹായവും നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: רָפָה
  choice: രേഫാ
  rationale: ഈ വാക്യത്തിലെ മാസോററ്റിക് സ്വരീകരണത്തെ സമീപമായി പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: בְנ֛/וֹ
  choice: അവന്റെ മകൻ
  rationale: അക്ഷരാർഥം ‘അവന്റെ മകൻ.’ ഹീബ്രുവിലെ സംക്ഷിപ്ത വംശാവലി ഘടന നിലനിർത്താൻ ‘ആയിരുന്നു’ എന്ന ക്രിയ ചേർത്തിട്ടില്ല.
- source_word: אֶלְעָשָׂה
  choice: എലെയാസാ
  rationale: ഹീബ്രു നാമത്തിലെ ആരംഭസ്വരങ്ങളും വ്യഞ്ജനക്രമവും കഴിയുന്നത്ര നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בְנ֖/וֹ
  choice: അവന്റെ മകൻ
  rationale: ഓരോ പേരും തൊട്ടുമുമ്പുള്ള വ്യക്തിയുടെ മകനാണെന്ന തുടർച്ചയായ വംശബന്ധം ഹീബ്രുവിനോടു ചേർന്ന് ആവർത്തിക്കുന്നു.
- source_word: אָצֵל
  choice: ആസേൽ
  rationale: മാസോററ്റിക് സ്വരീകരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בְּנֽ/וֹ
  choice: അവന്റെ മകൻ
  rationale: അവസാന വംശബന്ധവും മൂലപാഠത്തിലെ ആവർത്തനരീതിയിൽ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. മൂലപാഠത്തിലെ സംക്ഷിപ്ത വംശാവലി ശൈലിയും ‘അവന്റെ മകൻ’ എന്ന ആവർത്തനവും നിലനിർത്തി. ഇംഗ്ലീഷിൽ പ്രസക്തമായ ലിപ്യന്തരണഭേദങ്ങൾ മലയാള വായനക്കാരന് അർഥവത്തായ പാഠഭേദങ്ങളല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകളാക്കിയിട്ടില്ല.
