  rationale: എബ്രായ സാമൂഹികഘടനയിലെ പൂർവികനെ ആധാരമാക്കിയ കുടുംബവിഭാഗങ്ങളുടെ നേതാക്കളെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ‘കുടുംബത്തലവന്മാർ’ എന്ന ലളിതീകരണത്തേക്കാൾ മൂലഭാഷയുടെ രൂപവും അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לְתֹלְדוֹתָם
