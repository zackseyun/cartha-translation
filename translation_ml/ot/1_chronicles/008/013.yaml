id: 1CH.8.13
reference: 1 Chronicles 8:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְרִעָ֣ה וָ/שֶׁ֔מַע הֵ֚מָּה רָאשֵׁ֣י הָ/אָב֔וֹת לְ/יוֹשְׁבֵ֖י אַיָּל֑וֹן הֵ֥מָּה הִבְרִ֖יחוּ אֶת י֥וֹשְׁבֵי גַֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
translation:
  language: ml
  text: ബെരീയാവും ശേമയും—അവർ അയ്യാലോനിലെ നിവാസികളുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാരായിരുന്നു.[a] അവർ തന്നെയാണ് ഗത്തിലെ നിവാസികളെ ഓടിച്ചുകളഞ്ഞത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘പിതാക്കന്മാരുടെ ഭവനങ്ങളുടെ തലവന്മാർ’ എന്നാണ്; വംശകുടുംബങ്ങളെ അടിസ്ഥാനമാക്കിയുള്ള നേതാക്കളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: ‘ഓടിപ്പോകാൻ ഇടയാക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ ഗത്തിലെ നിവാസികളെ പലായനം ചെയ്യിച്ചതിന് ഊന്നൽ നൽകുന്നു; സന്ദർഭത്തിൽ അവരെ പുറത്താക്കിയെന്ന ഫലവും ഇതിൽ ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרִעָה
  choice: ബെരീയാവും
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; മുൻപുചേർന്ന സംയോജകത്തെ ‘-വും’ എന്നു നൽകി വംശാവലിയുടെ തുടർച്ച നിലനിർത്തി.
- source_word: וָשֶׁמַע
  choice: ശേമയും
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു; സംയോജകത്തെ ‘-യും’ എന്നു നൽകി.
- source_word: הֵמָּה
  choice: അവർ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ സൂക്ഷിച്ചു.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: പിതൃഭവനത്തലവന്മാർ
  rationale: വംശകുടുംബങ്ങളെ അടിസ്ഥാനമാക്കിയുള്ള നേതൃത്വപദവി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സാമൂഹിക അർഥം സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  choice: അയ്യാലോനിലെ നിവാസികളുടെ
  rationale: לְ എന്നതിന്റെ ഇവിടെ സാധ്യമായ ബന്ധസൂചക അർഥം സ്വീകരിച്ച്, അവർ ആ ജനവിഭാഗവുമായി ബന്ധപ്പെട്ട പിതൃഭവനത്തലവന്മാരായിരുന്നു എന്നു മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; ‘അവർക്കുവേണ്ടി’ എന്ന അനാവശ്യ വ്യാഖ്യാനം ഒഴിവാക്കി.
- source_word: אַיָּלוֹן
  choice: അയ്യാലോൻ
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הֵמָּה
  choice: അവർ തന്നെയാണ്
  rationale: ക്രിയയ്ക്കുമുമ്പുള്ള രണ്ടാമത്തെ സ്വതന്ത്ര സർവനാമത്തിന്റെ വ്യക്തമായ ഊന്നൽ മലയാളത്തിലെ ‘തന്നെയാണ്’ വഴി പ്രകടിപ്പിച്ചു.
- source_word: הִבְרִיחוּ
  choice: ഓടിച്ചുകളഞ്ഞത്
  rationale: ברח എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘ഓടിപ്പോകാൻ ഇടയാക്കുക’ എന്ന കാരണാർഥം സ്വാഭാവികമായി നൽകുന്നു; പുറത്താക്കൽ എന്ന സന്ദർഭഫലവും ഉൾക്കൊള്ളാം, എന്നാൽ അത് നിർബന്ധിച്ച് തീർപ്പാക്കുന്നില്ല.
- source_word: אֶת יֹשְׁבֵי גַת
  choice: ഗത്തിലെ നിവാസികളെ
  rationale: കർമപദപ്രയോഗം നേരിട്ട് പരിഭാഷപ്പെടുത്തി; മുൻപത്തെ ‘നിവാസികൾ’ എന്ന പദവുമായി പദസമാനത പാലിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വംശാവലി സന്ദർഭത്തിലെ സാങ്കേതിക സാമൂഹികപ്രയോഗം ‘പിതൃഭവനത്തലവന്മാർ’ എന്നു നിലനിർത്തി, കുറിപ്പിലൂടെ വിശദീകരിച്ചു. ആവർത്തിച്ച הֵמָּה എന്ന സർവനാമത്തിന്റെ രണ്ടാം ഊന്നൽ ‘അവർ തന്നെയാണ്’ എന്നു വ്യക്തമാക്കി.
