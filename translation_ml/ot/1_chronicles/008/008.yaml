translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ അർഥബന്ധങ്ങൾ സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിച്ചു; എന്നാൽ ‘പറഞ്ഞയച്ചു’ എന്നതിന്റെ നിയമപരമോ ദാമ്പത്യപരമോ ആയ സ്വഭാവം വ്യാഖ്യാനിച്ച് ഉറപ്പിച്ചിട്ടില്ല.
