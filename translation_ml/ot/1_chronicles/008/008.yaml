    rationale: ‘മക്കളെ ജനിപ്പിച്ചു’ can be understood, but it is more naturally associated with giving birth. The Hebrew Hiphil here denotes Shaharaim’s fathering children; ‘മക്കൾക്കു പിതാവായി’ expresses this naturally without adding information.
  revised_text: ശഹരയീം തന്റെ ഭാര്യമാരായ ഹൂശീമിനെയും ബാറായെയും പറഞ്ഞയച്ചശേഷം[b] മോവാബ് ദേശത്ത്[a] മക്കൾക്കു പിതാവായി.
