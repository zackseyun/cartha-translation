  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שַׁחֲרַ֗יִם הוֹלִיד֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב מִן שִׁלְח֖/וֹ אֹתָ֑/ם חוּשִׁ֥ים וְ/אֶֽת בַּעֲרָ֖א נָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
translation:
  language: ml
  text: ശഹരയീം തന്റെ ഭാര്യമാരായ ഹൂശീമിനെയും ബാറായെയും പറഞ്ഞയച്ചശേഷം[b] മോവാബ് ദേശത്ത്[a] മക്കൾക്കു പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മോവാബിന്റെ വയലിൽ/പ്രദേശത്ത്.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവരെ പറഞ്ഞയച്ചതിൽനിന്ന്’; ഇവിടെ അതിന്റെ സാധ്യതയേറിയ അർഥം ‘അവരെ പറഞ്ഞയച്ചശേഷം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׁחֲרַיִם
  choice: ശഹരയീം
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന וְ മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ, വ്യക്തിനാമം ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: הוֹלִיד
  choice: മക്കളെ ജനിപ്പിച്ചു
  rationale: വംശാവലിസന്ദർഭത്തിൽ ילד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘മക്കൾക്കു പിതാവായി/മക്കളെ ജനിപ്പിച്ചു’ എന്ന അർഥത്തിലാണ്; അടുത്ത വാക്യത്തിൽ പേരുകൾ വരുന്നതിനാൽ ഇവിടെ പ്രത്യേക മക്കളെ കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: בִּ/שְׂדֵה מוֹאָב
  choice: മോവാബ് ദേശത്ത്
  rationale: שָׂדֶה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വയൽ’ എന്നുണ്ടെങ്കിലും ഭൂമിശാസ്ത്രപരമായ പ്രയോഗത്തിൽ ‘ദേശം/പ്രദേശം’ എന്ന അർഥം സ്വാഭാവികമാണ്; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
- source_word: מִן שִׁלְח/וֹ אֹתָם
  choice: അവരെ പറഞ്ഞയച്ചശേഷം
  rationale: מִן + infinitive construct ഇവിടെ കാലസംബന്ധമായ ‘അവരെ പറഞ്ഞയച്ചശേഷം’ എന്ന ആശയം നൽകുന്നു. ‘പറഞ്ഞയച്ചു’ എന്നത് വിവാഹമോചനമോ മറ്റൊരു വിധത്തിലുള്ള അയച്ചുകളയലോ എന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: חוּשִׁים
  choice: ഹൂശീം
  rationale: സന്ദർഭത്തിൽ ഇത് വ്യക്തിനാമമാണ്; ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
- source_word: וְ/אֶת בַּעֲרָא
  choice: ബാറായെയും
  rationale: രണ്ടാമത്തെ ഭാര്യയുടെ വ്യക്തിനാമം ശബ്ദാനുസൃതമായി നൽകുകയും മലയാളത്തിലെ കർമപ്രത്യയം ചേർക്കുകയും ചെയ്തിരിക്കുന്നു.
- source_word: נָשָׁיו
  choice: തന്റെ ഭാര്യമാരായ
  rationale: ഇവിടെ אִשָּׁה എന്ന പദത്തിന്റെ ബഹുവചനം വിവാഹബന്ധത്തിലുള്ള ഭാര്യമാരെയാണ് സൂചിപ്പിക്കുന്നത്; ഹൂശീമിനെയും ബാറായെയും വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
