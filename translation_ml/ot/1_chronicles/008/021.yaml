lexical_decisions:
- source_word: עֲדָיָה
  choice: അദായാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: בְרָאיָה
  choice: ബെരായാ
  rationale: പേരിനകത്തെ അലഫ് പ്രതിഫലിപ്പിക്കുന്ന പൂർണമായ എബ്രായരൂപം ലിപ്യന്തരിച്ചു; ചുരുക്കരൂപമായ ‘ബെരീയാ’യെക്കാൾ ഇത് മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: שִׁמְרָת
  choice: ശിമ്രാത്ത്
  rationale: എബ്രായ വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; അവസാനത്തെ താവ് വ്യഞ്ജനത്തെ ‘ത്ത്’ എന്നു പ്രതിനിധീകരിച്ചു.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിസന്ദർഭത്തിലെ ‘പുത്രന്മാർ’ എന്ന നിർമാണബഹുവചനം, പിന്നാലെയുള്ള പിതാവിന്റെ പേര് ഷഷ്ഠിവിഭക്തിയിൽ ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: שִׁמְעִי
  choice: ശിമെയി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള ‘וְ’ സംയോജകങ്ങളെ മലയാളപ്പട്ടികയിലെ വിരാമചിഹ്നങ്ങളും ‘എന്നിവർ’ എന്ന കൂട്ടുഘടനയും ഉപയോഗിച്ച് സ്വാഭാവികമാക്കി.
