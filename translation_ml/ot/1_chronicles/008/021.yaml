  text: അദായാ, ബെരായാ[a], ശിമ്രാത് എന്നിവർ ശിമെയിയുടെ പുത്രന്മാർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില ഇംഗ്ലീഷ് വിവർത്തനപാരമ്പര്യങ്ങളിൽ ഈ പേര് ചുരുക്കി ‘ബെരീയാ’ എന്നു നൽകിയിട്ടുണ്ട്; എബ്രായപാഠത്തിലുള്ള പൂർണരൂപം ‘ബെരായാ’ എന്നാണ്.
