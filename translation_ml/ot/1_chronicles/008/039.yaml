source:
  edition: WLC
  text: וּ/בְנֵ֖י עֵ֣שֶׁק אָחִ֑י/ו אוּלָ֣ם בְּכֹר֔/וֹ יְעוּשׁ֙ הַ/שֵּׁנִ֔י וֶֽ/אֱלִיפֶ֖לֶט הַ/שְּׁלִשִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/039.yaml
  text: 'The sons of Eshek his brother: Ulam his firstborn[a], Jeush the second, and Eliphelet the third.'
translation:
  language: ml
  text: 'അവന്റെ സഹോദരനായ ഏശെക്കിന്റെ പുത്രന്മാർ: അവന്റെ ആദ്യജാതൻ ഊലാം, രണ്ടാമൻ യെയൂശ്, മൂന്നാമൻ എലീഫേലെത്ത്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “എന്നിട്ട്, അവന്റെ സഹോദരനായ ഏശെക്കിന്റെ പുത്രന്മാർ: അവന്റെ ആദ്യജാതൻ ഊലാം, രണ്ടാമൻ യെയൂശ്, മൂന്നാമൻ എലീഫേലെത്ത്.” ഹീബ്രു വാക്യം ഒരു സംയോജകത്തോടെയാണ് തുടങ്ങുന്നത്; മലയാളത്തിലെ വംശാവലി ശൈലിയിൽ അത് പലപ്പോഴും പ്രത്യേകം പ്രകടിപ്പിക്കേണ്ടതില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പട്ടികാശൈലിക്ക് സ്വാഭാവികമായി ബഹുവചനരൂപം ഉപയോഗിച്ചു; തുടക്കത്തിലെ וּ എന്ന സംയോജകത്തിന് പ്രത്യേക മലയാളപദം ചേർക്കാതെ വാക്യബന്ധത്തിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: עֵשֶׁק
  choice: ഏശെക്ക്
  rationale: ഹീബ്രു വ്യക്തിനാമം അർത്ഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: אָחִיו
  choice: അവന്റെ സഹോദരനായ
  rationale: אָח എന്ന പദത്തിന്റെ സാധാരണ അർത്ഥമായ ‘സഹോദരൻ’ നിലനിർത്തി; വിശാലമായ ‘ബന്ധു’ എന്ന അർത്ഥത്തിലേക്ക് ദുർബലപ്പെടുത്തിയില്ല.
- source_word: אוּלָם
  choice: ഊലാം
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: בְּכֹרוֹ
  choice: അവന്റെ ആദ്യജാതൻ
  rationale: ജനനക്രമത്തിലെ കൃത്യതയും ഹീബ്രു പദത്തിന്റെ പ്രത്യേകതയും നിലനിർത്താൻ ‘മൂത്തവൻ’ എന്നതിനു പകരം ‘ആദ്യജാതൻ’ ഉപയോഗിച്ചു.
- source_word: יְעוּשׁ
  choice: യെയൂശ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിലെ വ്യഞ്ജന-സ്വരരൂപം മലയാളത്തിൽ അടുത്തായി പ്രതിനിധീകരിച്ചു.
- source_word: הַשֵּׁנִי
  choice: രണ്ടാമൻ
  rationale: പുത്രന്മാരുടെ ജനനക്രമം സൂചിപ്പിക്കുന്ന ക്രമസംഖ്യ നേരിട്ട് വിവർത്തനം ചെയ്തു.
- source_word: וֶאֱלִיפֶלֶט
  choice: എലീഫേലെത്ത്
  rationale: സംയോജകത്തെ മലയാള പട്ടികാശൈലിയിൽ വിരാമചിഹ്നങ്ങളിലൂടെ സ്വാഭാവികമാക്കി; വ്യക്തിനാമം ഹീബ്രുവിൽനിന്ന് ലിപ്യന്തരിച്ചു.
- source_word: הַשְּׁלִשִׁי
  choice: മൂന്നാമൻ
  rationale: ജനനക്രമം സൂചിപ്പിക്കുന്ന ക്രമസംഖ്യ നേരിട്ട് വിവർത്തനം ചെയ്തു.
