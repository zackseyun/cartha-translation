  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വംശാവലി പട്ടികയുടെ സംക്ഷിപ്തത നിലനിർത്തി; പേരുകൾ മൂലഹീബ്രുവിൽനിന്ന് ലിപ്യന്തരിച്ചു.
