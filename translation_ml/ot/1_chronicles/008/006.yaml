translation_notes:
  register: ആധുനികവും മാന്യവുമായ വംശാവലി ശൈലി. പേരുകൾ ‘ഏഹൂദ്’, ‘ഗേബാ’, ‘മനാഹത്’ എന്നു ലിപ്യന്തരിച്ചു. തുടർന്നുവരുന്ന പട്ടികയെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ അവസാന ചിഹ്നത്തിന്റെ പ്രവർത്തനം നിലനിർത്താൻ വാക്യം ദ്വിബിന്ദുവിൽ അവസാനിപ്പിച്ചു.
