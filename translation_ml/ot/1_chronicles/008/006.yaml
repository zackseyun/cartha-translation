id: 1CH.8.6
reference: 1 Chronicles 8:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י אֵח֑וּד אֵ֣לֶּה הֵ֞ם רָאשֵׁ֤י אָבוֹת֙ לְ/י֣וֹשְׁבֵי גֶ֔בַע וַ/יַּגְל֖וּ/ם אֶל מָנָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
translation:
  language: ml
  text: 'ഏഹൂദിന്റെ പുത്രന്മാർ ഇവരായിരുന്നു. ഗേബാ നിവാസികളുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാർ[a] ഇവരായിരുന്നു; അവർ അവരെ മനാഹത്തിലേക്കു നാടുകടത്തി[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പിതൃഭവനങ്ങൾ’ എന്നത് ഒരു പൂർവികനിൽനിന്നുള്ള വംശകുടുംബങ്ങളെയോ പിതൃകുടുംബങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: എബ്രായമൂലത്തിൽ ‘അവർ’, ‘അവരെ’ എന്നീ സർവനാമങ്ങൾ ആരെ സൂചിപ്പിക്കുന്നുവെന്ന് ഈ വാക്യംതന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: ambiguity_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവരായിരുന്നു
  rationale: വംശാവലിയിൽ ഒരു പുതിയ കുറിപ്പ് അവതരിപ്പിക്കുന്ന പ്രയോഗം. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി തുടക്കത്തിലെ സംയോജകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: בְּנֵי אֵחוּד
  choice: ഏഹൂദിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിസന്ദർഭത്തിൽ בְּנֵי എന്നതിന് ‘പുത്രന്മാർ’ എന്ന പതിവ് അർഥം നിലനിർത്തുന്നു; ചിലപ്പോൾ ഇത് വിശാലമായി പിൻഗാമികളെയും സൂചിപ്പിക്കാം.
- source_word: אֵלֶּה הֵם
  choice: ഇവരായിരുന്നു
  rationale: എബ്രായത്തിലെ ഊന്നലോടുകൂടിയ ആവർത്തനപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ആവർത്തിച്ചു.
- source_word: רָאשֵׁי אָבוֹת
  choice: പിതൃഭവനത്തലവന്മാർ
  rationale: കുടുംബത്തെക്കാൾ വിശാലമായ പൂർവികഗൃഹം അഥവാ വംശകുടുംബഘടനയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക വംശാവലിപദം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לְיֹשְׁבֵי גֶבַע
  choice: ഗേബാ നിവാസികളുടെ
  rationale: לְ എന്ന ബന്ധസൂചകത്തെ ഇവർ ഗേബാ നിവാസികളുമായി ബന്ധപ്പെട്ട പിതൃഭവനത്തലവന്മാരാണെന്ന അർഥത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּגְלוּם
  choice: അവർ അവരെ ... നാടുകടത്തി
  rationale: גלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നിർബന്ധിതമായി പ്രവാസത്തിലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കർത്താവും കർമവും എബ്രായത്തിൽ സർവനാമങ്ങളായതിനാൽ അവയുടെ അവ്യക്തത നിലനിർത്തി.
- source_word: אֶל מָנָחַת
  choice: മനാഹത്തിലേക്കു
  rationale: ദിശാസൂചകമായ אֶל-നെയും മനാഹത് എന്ന സ്ഥലനാമത്തെയും സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു.
