lexical_decisions:
- source_word: נוֹחָה
  choice: നോഹ
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: הָרְבִיעִי
  choice: നാലാമൻ
  rationale: വംശാവലിപ്പട്ടികയിലെ പുത്രന്മാരുടെ ക്രമം സൂചിപ്പിക്കുന്ന നിർദിഷ്ട ക്രമസംഖ്യാവിശേഷണം; മലയാളത്തിൽ പുരുഷവ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപം സ്വീകരിച്ചു.
- source_word: וְ
  choice: -യും
  rationale: പട്ടികയിലെ രണ്ടു പേരെ ബന്ധിപ്പിക്കുന്ന ലളിതമായ സംയോജകത്തെ മലയാളത്തിലെ സമുച്ചയപ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: רָפָא
  choice: രാഫ
  rationale: വ്യക്തിനാമമായതിനാൽ എബ്രായ സ്വരവിന്യാസത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַחֲמִישִׁי
  choice: അഞ്ചാമൻ
  rationale: മുൻപുള്ള ക്രമസംഖ്യാവിശേഷണത്തിന് സമാന്തരമായി വംശാവലിയിലെ അഞ്ചാം സ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, വംശാവലിപ്പട്ടികയ്ക്ക് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ പേര്–ക്രമസംഖ്യ ഘടന മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായ ക്രമസംഖ്യ–പേര് രൂപത്തിലാക്കി; വിവരത്തിൽ മാറ്റമില്ല.
