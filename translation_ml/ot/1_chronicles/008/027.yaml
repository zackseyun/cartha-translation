  text: യാരെശ്യാവും ഏലീയാവും സിക്രിയും യെരോഹാമിന്റെ പുത്രന്മാരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മക്കൾ’; വിശാലമായ വംശാവലി അർത്ഥത്തിൽ ‘സന്തതികൾ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֶשְׁיָה
  choice: യാരെശ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു; പേരിന്റെ അവസാനത്തെ ദൈവനാമഘടകമായ יָה പ്രതിഫലിപ്പിക്കാൻ ‘-യാവ്’ നിലനിർത്തി.
- source_word: אֵלִיָּה
  choice: ഏലീയാവ്
  rationale: എബ്രായ നാമം മലയാളത്തിൽ പരിചിതവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ രീതിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: זִכְרִי
  choice: സിക്രി
  rationale: വ്യക്തിനാമം അർത്ഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപം ഇവിടെ പേരെടുത്തുപറയുന്ന മൂന്ന് പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ഏറ്റവും നേരിട്ടുള്ള അർത്ഥമായ ‘പുത്രന്മാർ’ സ്വീകരിച്ചു; വംശാവലിയിൽ സാധ്യമായ വിശാലാർത്ഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: יְרֹחָם
  choice: യെരോഹാം
  rationale: എബ്രായ വ്യക്തിനാമം അതിന്റെ സ്വര-വ്യഞ്ജനരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ നാമവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിനായി ‘ആയിരുന്നു’ ചേർത്ത് അവതരിപ്പിച്ചു; ‘പുത്രന്മാർ’ എന്നതിന്റെ വംശാവലിസംബന്ധമായ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
