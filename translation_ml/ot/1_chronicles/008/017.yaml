base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/017.yaml
  text: and Zebadiah, and Meshullam, and Hizki, and Heber.
translation:
  language: ml
  text: സെബദ്യാവും മെശുല്ലാമും ഹിസ്കിയും ഹാവെരും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: സെബദ്യാവ്
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ, എബ്രായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു. വാക്യാവസാനത്തിലെ കൂട്ടിച്ചേർക്കൽഘടനയിൽ וּ എന്ന സംയോജകം ‘എന്നിവരും’ എന്നതിലൂടെ പ്രതിഫലിക്കുന്നു.
- source_word: וּ/מְשֻׁלָּם
  choice: മെശുല്ലാം
  rationale: വ്യക്തിനാമം എബ്രായ സ്വരരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; അവസാന അക്ഷരത്തിന്റെ ദീർഘത ‘ല്ലാം’ എന്ന രൂപത്തിൽ സൂചിപ്പിച്ചു.
- source_word: וְ/חִזְקִי
  choice: ഹിസ്കി
  rationale: പരിചിതമായെങ്കിലും വ്യത്യസ്തമായ ‘ഹിസ്കീയാവ്’ എന്ന പേരുമായി കലരാതിരിക്കാൻ, חִזְקִי എന്ന ഹ്രസ്വ നാമരൂപം നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: וָ/חָבֶר
  choice: ഹേബെർ
  rationale: എബ്രായ חָבֶר എന്ന വ്യക്തിനാമത്തിന്റെ സ്വരക്രമം നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു; പട്ടികയുടെ അവസാനത്തെ וָ സംയോജകം ‘എന്നിവരും’ എന്ന സമാപനത്തിൽ ഉൾപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികമായ വംശാവലി-പട്ടികാശൈലി സ്വീകരിച്ചു. എബ്രായത്തിൽ ഓരോ പേരിനുമുമ്പുമുള്ള സംയോജകത്തെ മലയാളത്തിൽ യാന്ത്രികമായി ആവർത്തിക്കാതെ, പേരുകൾ കോമകൊണ്ട് നിരത്തി ‘എന്നിവരും’ എന്നു സമാപിപ്പിച്ചു; ഇതിലൂടെ മൂലത്തിലെ കൂട്ടിച്ചേർക്കൽബന്ധം നിലനിൽക്കുന്നു.
