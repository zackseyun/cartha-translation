id: 1CH.8.5
reference: 1 Chronicles 8:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גֵרָ֥א וּ/שְׁפוּפָ֖ן וְ/חוּרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/005.yaml
  text: Gera[a], Shephuphan[b], and Huram.
translation:
  language: ml
  text: ഗേരാ, ശെഫൂഫാൻ[a], ഹൂരാം[b] എന്നിവരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബന്ധമുള്ള ചില വംശാവലിപ്പട്ടികകളിൽ ‘ശൂഫാം’ എന്ന വ്യത്യസ്ത നാമരൂപം കാണുന്നു; ഇവിടെ എബ്രായപാഠത്തിൽ ‘ശെഫൂഫാൻ’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ എബ്രായപാഠത്തിൽ ‘ഹൂരാം’ എന്നാണ്; മറ്റു ഭാഗങ്ങളിലോ നാമപാരമ്പര്യങ്ങളിലോ ‘ഹീരാം’ എന്ന വ്യത്യസ്ത രൂപം കാണാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵרָא
  choice: ഗേരാ
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: שְׁפוּפָן
  choice: ശെഫൂഫാൻ
  rationale: ഈ വാക്യത്തിലെ മസൊററ്റിക് സ്വരചിഹ്നങ്ങളോടുകൂടിയ എബ്രായ രൂപം നേരിട്ട് ലിപ്യന്തരിച്ചു; ബന്ധമുള്ള വംശാവലികളിൽ കാണുന്ന ‘ശൂഫാം’ എന്ന വ്യത്യസ്ത നാമരൂപം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: חוּרָם
  choice: ഹൂരാം
  rationale: ഈ വാക്യത്തിലെ എബ്രായ രൂപത്തിന്റെ ദീർഘസ്വരങ്ങൾ പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു; മറ്റു നാമപാരമ്പര്യങ്ങളിൽ കാണുന്ന ‘ഹീരാം’ എന്ന രൂപം ഇവിടെ പകരംവെച്ചിട്ടില്ല.
- source_word: וְ
  choice: എന്നിവരും
  rationale: പേരുകളുടെ ലളിതമായ പട്ടികയെ സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുകയും എബ്രായത്തിലെ ആവർത്തിച്ച സംയോജകത്തിന്റെ പട്ടികാസ്വഭാവം അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. മൂന്നു വ്യക്തിനാമങ്ങളും എബ്രായപാഠത്തിൽനിന്ന് ലിപ്യന്തരിച്ചു. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ പേരുകളോട് തെറ്റായി ചേർന്നതായി തോന്നുന്നതിനാൽ, അവയുടെ ഉള്ളടക്കത്തിന് അനുസരിച്ച് [a] ശെഫൂഫാനോടും [b] ഹൂരാമിനോടും ചേർത്തു.
