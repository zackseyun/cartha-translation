id: 1CH.8.10
reference: 1 Chronicles 8:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת יְע֥וּץ וְ/אֶת שָֽׂכְיָ֖ה וְ/אֶת מִרְמָ֑ה אֵ֥לֶּה בָנָ֖י/ו רָאשֵׁ֥י אָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/010.yaml
  text: and Jeuz[a], and Sachia, and Mirmah. These were his sons, heads of fathers’ houses.
translation:
  language: ml
  text: യെയൂസ്, സഖ്യാ, മിർമാ എന്നിവരെയും. ഇവർ അവന്റെ പുത്രന്മാരും പിതൃഭവനങ്ങളുടെ തലവന്മാരും[a] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കുലത്തലവന്മാർ.” എബ്രായഭാഷയിൽ അക്ഷരാർഥത്തിൽ “പിതാക്കന്മാരുടെ തലവന്മാർ” എന്നാണ്; പൂർവിക ഭവനങ്ങളുടെയോ കുടുംബവിഭാഗങ്ങളുടെയോ നേതാക്കളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְעוּץ
  choice: യെയൂസ്
  rationale: വ്യക്തിനാമമായതിനാൽ അർത്ഥം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: שָׂכְיָה
  choice: സഖ്യാ
  rationale: വംശാവലിയിൽ വരുന്ന വ്യക്തിനാമം; എബ്രായ വ്യഞ്ജന-സ്വരരൂപത്തോട് ചേർന്ന ലളിതമായ മലയാള ലിപ്യന്തരണം.
- source_word: מִרְמָה
  choice: മിർമാ
  rationale: ഈ സന്ദർഭത്തിൽ ഇത് വ്യക്തിനാമമാണ്; ഇതേ രൂപത്തിലുള്ള സാധാരണനാമത്തിന് ‘വഞ്ചന’ എന്ന അർത്ഥമുണ്ടെങ്കിലും ഇവിടെ ആ അർത്ഥത്തിൽ വിവർത്തനം ചെയ്യരുത്.
- source_word: אֵלֶּה
  choice: ഇവർ
  rationale: മുമ്പ് പറഞ്ഞ പുരുഷന്മാരെ ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചന സർവനാമം; മലയാളത്തിൽ വ്യക്തികളെ സൂചിപ്പിക്കാൻ ‘ഇവർ’ സ്വാഭാവികമാണ്.
- source_word: בָנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ വരുന്ന പുല്ലിംഗ ബഹുവചനം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: רָאשֵׁי אָבוֹת
  choice: പിതൃഭവനങ്ങളുടെ തലവന്മാർ
  rationale: ‘പിതാക്കന്മാരുടെ തലകൾ’ എന്ന പദാനുപദരൂപത്തിന് പകരം, പൂർവിക കുടുംബഘടകങ്ങളുടെ നേതാക്കളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകവും സ്ഥാപനപരമായ അർത്ഥവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ വംശാവലി ശൈലി സ്വീകരിച്ചു. വാക്യാരംഭത്തിലെ ‘എന്നിവരെയും’ മുൻവാക്യത്തിൽ ആരംഭിച്ച പേരുകളുടെ പട്ടിക തുടരുന്നതായി മൂലപാഠത്തിലെ ബന്ധവും കർമചിഹ്നങ്ങളും സൂചിപ്പിക്കുന്നതിനാൽ അതു നിലനിർത്തി; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ക്രിയ ചേർത്തിട്ടില്ല.
