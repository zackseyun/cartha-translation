id: 1CH.8.12
reference: 1 Chronicles 8:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֣י אֶלְפַּ֔עַל עֵ֥בֶר וּ/מִשְׁעָ֖ם וָ/שָׁ֑מֶד ה֚וּא בָּנָ֣ה אֶת אוֹנ֔וֹ וְ/אֶת לֹ֖ד וּ/בְנֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
translation:
  language: ml
  text: 'എൽപാലിന്റെ പുത്രന്മാർ: ഏബെർ, മിശാം, ശേമെദ്; അവൻ[a] ഓനോയും ലോദും അതിന്റെ ഗ്രാമങ്ങളും[b] പണിതു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൻ’ എന്നത് ഏറ്റവും സ്വാഭാവികമായി അവസാനം പറഞ്ഞ ശേമെദിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ചിലർ ഇത് കുടുംബശാഖയുമായി കൂടുതൽ പൊതുവായി ബന്ധപ്പെടുത്തുന്നു.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ പുത്രിമാർ’; ഒരു പട്ടണത്തെ ആശ്രയിച്ചിരുന്ന ഗ്രാമങ്ങളെയോ ചെറുപട്ടണങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  choice: എൽപാലിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടിക അവതരിപ്പിക്കുന്ന construct ബഹുവചനം. മലയാളത്തിൽ സ്വാഭാവികമായ തലക്കെട്ടുരീതിയിൽ ആദിയിലെ സംയോജകം പ്രത്യേകം പ്രകടിപ്പിച്ചിട്ടില്ല.
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  choice: ഏബെർ, മിശാം, ശേമെദ്
  rationale: വ്യക്തിനാമങ്ങൾ എബ്രായരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: הוּא
  choice: അവൻ
  rationale: മൂന്നാംപുരുഷ ഏകവചന സ്വതന്ത്ര സർവനാമം. ഏറ്റവും സ്വാഭാവികമായി തൊട്ടുമുമ്പുള്ള ശേമെദിനെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ വംശശാഖയെ പൊതുവായി സൂചിപ്പിക്കാനുള്ള സാധ്യതയും നിലനിൽക്കുന്നു.
- source_word: בָּנָה
  choice: പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ സാധാരണ അർഥം ‘പണിയുക’ എന്നാണ്. ‘സ്ഥാപിച്ചു’ അല്ലെങ്കിൽ ‘പുനർനിർമിച്ചു’ എന്ന വ്യാഖ്യാനങ്ങൾ മൂലരൂപം നിർബന്ധിക്കുന്നില്ല.
- source_word: אֶת אוֹנוֹ וְאֶת לֹד
  choice: ഓനോയും ലോദും
  rationale: നേരിട്ടുള്ള കർമസൂചകങ്ങളെ മലയാളത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ സ്ഥലനാമങ്ങൾ എബ്രായരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וּבְנֹתֶיהָ
  choice: അതിന്റെ ഗ്രാമങ്ങളും
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ പുത്രിമാർ’ എന്ന നഗരബന്ധിയായ എബ്രായ പ്രയോഗം; ആശ്രിത ഗ്രാമങ്ങളെയോ ചെറുപട്ടണങ്ങളെയോ സൂചിപ്പിക്കുന്നു. സർവനാമത്തിന്റെ ഏകവചന സ്ത്രീലിംഗ സൂചന ഏറ്റവും അടുത്തുള്ള ലോദിനോട് ബന്ധിപ്പിച്ചു.
theological_decisions:
- issue: הוּא എന്ന സർവനാമത്തിന്റെ പൂർവപദം
  choice: പ്രധാനവാചകത്തിൽ ‘അവൻ’ എന്ന് നിലനിർത്തി; അടിക്കുറിപ്പിൽ ശേമെദിലേക്കുള്ള ഏറ്റവും സ്വാഭാവിക ബന്ധം സൂചിപ്പിച്ചു.
  alternative: എൽപാലിന്റെ കുടുംബശാഖയെ പൊതുവായി നിർമാണകർത്താവായി മനസ്സിലാക്കുക.
  rationale: മൂലപാഠത്തിലെ പുരുഷ ഏകവചന സർവനാമം സംരക്ഷിക്കുമ്പോഴും അതിന്റെ പൂർവപദത്തെ വാചകത്തിൽ നിർണായകമായി വ്യക്തമാക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. പേരുകൾ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത് ലിപ്യന്തരിച്ചു; യഥാർഥമായ സർവനാമസന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
