base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/007.yaml
  text: and Naaman[a], Ahijah[b], and Gera—he carried them into exile and fathered Uzza and Ahihud.
translation:
  language: ml
  text: നയമാൻ, അഹീയാവ്, ഗേരാ എന്നിവരും—അവൻ[a] അവരെ പ്രവാസത്തിലേക്കു കൊണ്ടുപോയി[b]; ഉസ്സായുടെയും അഹീഹൂദിന്റെയും പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൻ’ എന്നതിന് എബ്രായത്തിൽ ഏകവചനരൂപമാണ്. വ്യാകരണപരമായി അത് ഏറ്റവും സ്വാഭാവികമായി ഗേരായെ സൂചിപ്പിക്കുന്നു; എങ്കിലും ഈ ഭാഗത്തെ വംശാവലിയുടെ പാഠവും വാക്യഘടനയും ദുഷ്കരമാണ്.
    reason: alternative_reading
  - marker: b
    text: '‘അവരെ നാടുകടത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ കാരകാർഥമുള്ളതാണ്: ‘അവരെ പ്രവാസത്തിലേക്കു പോകാൻ ഇടയാക്കി.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲמָן
  choice: നയമാൻ
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തോട് ചേർന്നും മലയാള ബൈബിൾനാമങ്ങളുടെ പതിവിനൊത്തും ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲחִיָּה
  choice: അഹീയാവ്
  rationale: വ്യക്തിനാമം; മലയാളത്തിൽ പരിചിതമായ ബൈബിൾനാമരൂപം സ്വീകരിച്ചു.
- source_word: גֵרָא
  choice: ഗേരാ
  rationale: വ്യക്തിനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הוּא
  choice: അവൻ
  rationale: ഊന്നൽ നൽകുന്നതോ മുമ്പത്തെ നാമത്തെ വീണ്ടും സൂചിപ്പിക്കുന്നതോ ആയ ഏകവചന സർവനാമം; അതിന്റെ വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: הֶגְלָם
  choice: അവരെ പ്രവാസത്തിലേക്കു കൊണ്ടുപോയി
  rationale: גלה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപവും മൂന്നാംപുരുഷ ബഹുവചന കർമപ്രത്യയവും ചേർന്ന് ‘അവരെ പ്രവാസത്തിലാകാൻ ഇടയാക്കി’ എന്ന കാരകാർഥം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അതു പ്രകടിപ്പിച്ചു.
- source_word: וְהוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയിൽ ילד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം പുരുഷൻ മക്കളുടെ പിതാവായി എന്ന അർഥത്തിലാണ്; സംക്ഷിപ്തവും പതിവുള്ളതുമായ മലയാളരൂപം തെരഞ്ഞെടുത്തു.
- source_word: עֻזָּא
  choice: ഉസ്സാ
  rationale: വ്യക്തിനാമം; എബ്രായ വ്യഞ്ജനദ്വിത്വം മലയാളത്തിൽ നിലനിർത്തി ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲחִיחֻד
  choice: അഹീഹൂദ്
  rationale: വ്യക്തിനാമമായതിനാൽ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
