  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ഏകവചന കർത്താവിനെയും ബഹുവചന കർമത്തെയും വ്യക്തമായി നിലനിർത്തി; ദുഷ്കരമായ വാക്യഘടന അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിച്ചു.
