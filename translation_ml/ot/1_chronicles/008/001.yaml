  register: ആധുനികവും മാന്യവുമായ വംശാവലി ശൈലി. ‘ജനിപ്പിച്ചു’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ കർത്തൃപ്രധാനമായ ക്രിയ നിലനിർത്തുന്നു; ആവർത്തനം ഒഴിവാക്കാൻ മൂന്ന് പേരുകളും ഒരൊറ്റ കർമപ്പട്ടികയായി ക്രമീകരിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ് അത് സംബന്ധിക്കുന്ന പേരിനോടുതന്നെ ചേർത്തിരിക്കുന്നു.
