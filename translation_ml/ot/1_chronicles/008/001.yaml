  yaml_path: translation/ot/1_chronicles/008/001.yaml
  text: Benjamin fathered Bela his firstborn[a], Ashbel the second, and Aharah the third.
translation:
  language: ml
  text: ബെന്യാമീൻ തന്റെ ആദ്യജാതനായ ബേലയെയും രണ്ടാമനായ അശ്ബേലിനെയും മൂന്നാമനായ അഹരഹിനെയും[a] ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അഹരഹ്; ചില പരിഭാഷകളിൽ അഹ്‌റഹ് എന്നു കാണുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകിയിരിക്കുന്നു. വംശാവലിയുടെ തുടക്കത്തിലുള്ള וּ־ സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: ילד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വംശാവലിയിൽ പിതാവായി സന്താനത്തെ ജനിപ്പിക്കുക എന്ന അർഥം നൽകുന്നു; അതിന്റെ കർത്തൃഭാവം നിലനിർത്തുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ വ്യാകരണചിഹ്നം മലയാളത്തിൽ വിഭക്തിപ്രത്യയങ്ങളിലൂടെ പ്രകടമാകുന്നു.
- source_word: בֶּלַע
  choice: ബേല
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּכֹרוֹ
  choice: തന്റെ ആദ്യജാതനായ
  rationale: ‘അവന്റെ ആദ്യജാതൻ’ എന്ന ജനനക്രമസൂചനയും ബെന്യാമീനുമായുള്ള ബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אַשְׁבֵּל
  choice: അശ്ബേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַשֵּׁנִי
  choice: രണ്ടാമനായ
  rationale: പട്ടികയിലെ ജനനക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאַחְרַח
  choice: അഹരഹ്
  rationale: മസോരറ്റിക് പാഠത്തിലെ സ്വരചിഹ്നങ്ങളോടുകൂടിയ രൂപത്തെ അടിസ്ഥാനമാക്കിയുള്ള ലിപ്യന്തരണം; ചില പരിഭാഷകളിലെ ചുരുക്കിയ രൂപം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചിട്ടില്ല.
- source_word: הַשְּׁלִישִׁי
  choice: മൂന്നാമനായ
  rationale: എബ്രായത്തിലെ നിർദിഷ്ട ക്രമസംഖ്യയെ മലയാളത്തിലെ പട്ടികഘടനയ്ക്ക് യോജിച്ചവിധം നൽകുന്നു.
