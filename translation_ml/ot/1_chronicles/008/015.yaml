    issue: The text has «ഏദെർ» for עָדֶר.
    rationale: The WLC vocalization is ʿĀder, not ʿĒder. «ആദെർ» preserves the Hebrew vowel value; «ഏദെർ» is not warranted by the supplied source.
  - severity: medium
    issue: The footnote presents «ആദെർ» as an alternative to the erroneous main-text form.
    rationale: «ആദെർ» is the source-based rendering and belongs in the main text. No textual variant or genuine transliteration ambiguity requiring a footnote is supplied.
