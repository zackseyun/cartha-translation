translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, വംശാവലിപ്പട്ടികയ്ക്ക് യോജിച്ച സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. വ്യക്തിനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ എബ്രായത്തിൽനിന്ന് ലിപ്യന്തരിച്ചു.
