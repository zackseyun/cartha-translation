lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: സെബദ്യാവ്
  rationale: പേരിനെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ ലിപ്യന്തരിച്ചു. മുൻപുള്ള וּ ഈ വാക്യം മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ചയാണെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പട്ടികാശൈലിയിൽ പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കാതെ തുടർച്ച നിലനിർത്തി.
- source_word: וַ/עֲרָד
  choice: അരാദ്
  rationale: עֲרָד എന്ന വ്യക്തിനാമം എബ്രായ സ്വരീകരണം അനുസരിച്ച് ‘അരാദ്’ എന്നു ലിപ്യന്തരിച്ചു; പട്ടികയിലെ ബന്ധകമായ וַ മലയാളത്തിൽ കോമയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: וָ/עָדֶר
  choice: ഏദെർ
  rationale: മസൊററ്റിക് സ്വരീകരണത്തിലുള്ള עָדֶר എന്ന പേരിനെ ‘ഏദെർ’ എന്നു ലിപ്യന്തരിച്ചു. ഇത് ‘ആദെർ’ എന്നും ലിപ്യന്തരം ചെയ്യാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
