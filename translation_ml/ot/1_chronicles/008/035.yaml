id: 1CH.8.35
reference: 1 Chronicles 8:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֖י מִיכָ֑ה פִּית֥וֹן וָ/מֶ֖לֶךְ וְ/תַאְרֵ֥עַ וְ/אָחָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/035.yaml
  text: 'And the sons of Micah: Pithon[a], Melech, Tarea, and Ahaz.'
translation:
  language: ml
  text: 'മീഖായുടെ പുത്രന്മാർ: പീതോൻ, മെലെക്ക്, താരേയ, ആഹാസ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പട്ടിക തുടരുന്നതായി സൂചിപ്പിക്കുന്ന ו മലയാളത്തിൽ പ്രത്യേകമായി ചേർക്കാതെ സ്വാഭാവിക പട്ടികാശൈലിയിൽ ഉൾക്കൊള്ളുന്നു; בְּנֵי ഇവിടെ നേരിട്ടുള്ള പുത്രന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִיכָה
  choice: മീഖ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: פִּיתוֹן
  choice: പീഥോൻ
  rationale: എബ്രായ വ്യക്തിനാമം നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: וָמֶלֶךְ
  choice: മേലെക്ക്
  rationale: വംശാവലി സന്ദർഭത്തിൽ מֶלֶךְ ‘രാജാവ്’ എന്ന പൊതുനാമമല്ല, വ്യക്തിനാമമാണ്; അതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: וְתַאְרֵעַ
  choice: താറെയ
  rationale: എബ്രായ תַאְרֵעַ എന്ന വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപം മലയാളത്തിൽ അടുത്തായി പ്രതിനിധീകരിച്ചു.
- source_word: וְאָחָז
  choice: ആഹാസ്
  rationale: ഇവിടെ ക്രിയാരൂപമല്ല, മീഖയുടെ പുത്രന്റെ വ്യക്തിനാമമാണ്; അതിനാൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിൽ ഓരോ പേരോടുമുള്ള ബന്ധകങ്ങൾ മലയാളത്തിൽ ആവർത്തിക്കുന്നത് അസ്വാഭാവികമായതിനാൽ കോമകളിലൂടെ പട്ടികപ്പെടുത്തി. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പിൽ Pithon/Tahrea എന്ന പൊരുത്തക്കേടുണ്ട്; ‘Tahrea’ യഥാർത്ഥത്തിൽ תַאְרֵעַ എന്ന മൂന്നാമത്തെ പേരിന്റെ ഇംഗ്ലീഷ് വകഭേദമായതിനാൽ തെറ്റായ സ്ഥാനത്ത് അടിക്കുറിപ്പ് ചേർക്കാതെ ഒഴിവാക്കി.
