lexical_decisions:
- source_word: וְ/אַחְיוֹ
  choice: അഹ്യോയും
  rationale: വംശാവലിപ്പട്ടികയിലെ വ്യക്തിനാമമായ אַחְיוֹ ശബ്ദാനുസൃതമായി ‘അഹ്യോ’ എന്നു ലിപ്യന്തരിച്ചു. മുൻപിലെ וְ എന്ന സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ഏകോപനപ്രത്യയമായ ‘-യും’ കൊണ്ട് പ്രകടിപ്പിച്ചു.
- source_word: שָׁשָׁק
  choice: ശാശാക്കും
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ‘ശാശാക്’ എന്നു ലിപ്യന്തരിച്ചു; പട്ടികയിലെ ഏകോപനം വ്യക്തമാക്കാൻ ‘-ഉം’ ചേർത്തു.
- source_word: וִ/ירֵמוֹת
  choice: യെരേമോത്തും
  rationale: വ്യക്തിനാമം സാധാരണ മലയാള ലിപ്യന്തരണരീതിയിൽ ‘യെരേമോത്ത്’ എന്നു നൽകി. മുൻപിലെ וְ സംയോജകത്തെ ‘-ഉം’ കൊണ്ട് പ്രകടിപ്പിച്ചു. ‘യെരീമോത്ത്’ എന്ന മറ്റൊരു ലിപ്യന്തരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത സ്വഭാവം കാത്തുസൂക്ഷിച്ചു. പേരുകളെ തർജമ ചെയ്യാതെ മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകി. അടിക്കുറിപ്പ് ഏത് പേരിനെയാണ് സംബന്ധിക്കുന്നതെന്ന് വ്യക്തമാക്കാൻ സൂചകം ‘യെരേമോത്ത്’ എന്ന പേരിനോടു ചേർത്തു.
