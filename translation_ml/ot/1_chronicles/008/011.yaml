- from: ഹൂശീമിൽനിന്ന് അവൻ അബീതൂബിനും എൽപാലിനും ജന്മം നൽകി.[a]
  to: ഹൂശീമിലൂടെ അവൻ അബീതൂബിനും എൽപാലിനും പിതാവായി.[a]
  rationale: The revision replaces a maternally marked expression with a natural masculine genealogical predicate, while retaining the Hebrew preposition’s limited ambiguity in a footnote. No additional familial role beyond what the verse states is supplied.
