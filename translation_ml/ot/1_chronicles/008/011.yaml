  text: ഹൂശീമിലൂടെ അവൻ അബീതൂബിനും എൽപാലിനും പിതാവായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹൂശീമിൽനിന്ന് അവൻ അബീതൂബിനും എൽപാലിനും പിതാവായി.”
    reason: മൂലപാഠത്തിലെ מִן ‘നിന്ന്’ എന്നും, വംശാവലിയുടെ സാഹചര്യത്തിൽ ‘മുഖേന/മൂലം’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: וּ/מֵ/חֻשִׁים
  choice: ഹൂശീമിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ അടിസ്ഥാനമായ ഉറവിടാർഥം നിലനിർത്തുന്നു; വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ഹൂശീം ഇവരുടെ അമ്മയാണെന്ന ബന്ധവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. വാക്യത്തിന്റെ തുടക്കത്തിലുള്ള וּ മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പദമാക്കാതെ ഉൾക്കൊള്ളുന്നു.
- source_word: הוֹלִיד
  choice: അവൻ ... ജന്മം നൽകി
  rationale: ילד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം വംശാവലിയിൽ ‘പിതാവായി/ജനിപ്പിച്ചു’ എന്നർഥം വഹിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണിത്.
- source_word: אֵת
  choice: '[പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനത ആവശ്യമില്ല.
- source_word: אֲבִיטוּב
  choice: അബീതൂബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ/אֶת
  choice: -ഉം ... -ഉം
  rationale: וְ എന്ന സംയോജകം മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയരൂപമായ ‘-ഉം ... -ഉം’കൊണ്ട് പ്രകടിപ്പിച്ചു; אֵת പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: אֶלְפָּעַל
  choice: എൽപാൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം വായനാസൗകര്യത്തോടെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
