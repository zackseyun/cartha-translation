  yaml_path: translation/ot/1_chronicles/008/032.yaml
  text: Mikloth fathered Shimeah[a]. They too lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: ml
  text: മിക്ലോത്ത് ശിമെയാവിന്റെ പിതാവായിരുന്നു. അവരും തങ്ങളുടെ സഹോദരന്മാർക്ക് എതിർവശത്തായി[a] യെരൂശലേമിൽ തങ്ങളുടെ സഹോദരന്മാരോടൊപ്പം താമസിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തങ്ങളുടെ സഹോദരന്മാരുടെ സമീപത്ത്’; എബ്രായപദത്തിന് ഒരാളുടെ മുന്നിൽ, എതിർവശത്ത്, അല്ലെങ്കിൽ സമീപത്ത് എന്നിങ്ങനെ സ്ഥലബന്ധം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘സഹോദരന്മാർ’ എന്നത് സ്വന്തം മാതാപിതാക്കളിൽ ജനിച്ച സഹോദരന്മാരെ മാത്രം അല്ല, ബെന്യാമീൻ വംശാവലിയിലെ ഒരേ കുലത്തിലോ ബന്ധുവർഗത്തിലോ പെട്ടവരെയും സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: മിക്ലോത്ത്
  rationale: വംശാവലിയുടെ തുടർച്ച സന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ മുൻചേർന്ന വാവിനെ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ, വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി നൽകി.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള വംശാവലിപദത്തിന്റെ പിതൃത്വസൂചക അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: אֶת שִׁמְאָה
  choice: ശിമെയാവിനെ
  rationale: നേരിട്ടുള്ള കർമചിഹ്നം മലയാളത്തിൽ വേറിട്ട് പരിഭാഷപ്പെടുത്തേണ്ടതില്ല; വ്യക്തിനാമം കർമവിഭക്തിയോടെ ശബ്ദാനുസൃതമായി നൽകി.
- source_word: וְאַף הֵמָּה
  choice: അവരും
  rationale: വാവും אַף-ന്റെ ഉൾപ്പെടുത്തൽ/ഊന്നൽഭാവവും മലയാളത്തിലെ ‘-ഉം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נֶגֶד
  choice: എതിർവശത്തായി
  rationale: മുന്നിൽ, എതിർവശത്ത്, സമീപത്ത് എന്നീ സാധ്യതകളുള്ള സ്ഥലബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതിന്റെ പ്രധാന സ്ഥലാർഥം നിലനിർത്തുന്നു.
- source_word: אֲחֵיהֶם
  choice: തങ്ങളുടെ സഹോദരന്മാർ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥം നിലനിർത്തുന്നു; ഈ വംശാവലിസന്ദർഭത്തിൽ വിശാലമായ ബന്ധുവർഗത്തെയും സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יָשְׁבוּ
  choice: താമസിച്ചു
  rationale: താമസസ്ഥലത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയിൽ ആധുനിക മലയാളത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗം.
- source_word: בִּירוּשָׁלִַם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾരൂപം സ്ഥലവിഭക്തിയോടെ നൽകി.
- source_word: עִם אֲחֵיהֶם
  choice: തങ്ങളുടെ സഹോദരന്മാരോടൊപ്പം
  rationale: עִם എന്നതിന്റെ ‘കൂടെ/ഒപ്പം’ എന്ന അർഥവും മൂലപാഠത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
