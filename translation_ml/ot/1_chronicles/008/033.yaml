id: 1CH.8.33
reference: 1 Chronicles 8:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִֽינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: ml
  text: നേർ കീശിന്റെ പിതാവായി; കീശ് ശൗലിന്റെ പിതാവായി; ശൗൽ യോനാഥാൻ, മൽക്കീ-ശൂവ, അബീനാദാബ്, എശ്ബാൽ[a] എന്നിവരുടെ പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 ശമൂവേലിൽ എശ്ബാൽ ‘ഈശ്-ബോശെത്ത്’ എന്നു വിളിക്കപ്പെടുന്നു.
    reason: ശമൂവേലിൽ കാണുന്ന വ്യത്യസ്ത നാമരൂപം വായനക്കാരനെ അറിയിക്കാൻ.
lexical_decisions:
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിയിൽ ഹിഫ്ഈൽ രൂപം നേരിട്ടുള്ള പിതൃവംശബന്ധം സൂചിപ്പിക്കുന്നു. ‘പിതാവായി’ എന്നത് ആ ബന്ധം വ്യക്തമായി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: נֵר
  choice: നേർ
  rationale: വ്യക്തിനാമം മൂലഭാഷയുടെ ശബ്ദരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: קִישׁ
  choice: കീശ്
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന പതിവുരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം സ്വീകരിച്ചു.
- source_word: יְהוֹנָתָן
  choice: യോനാഥാൻ
  rationale: ഇവിടെ എബ്രായരൂപം യെഹോനാഥാൻ എന്നതോടടുത്തതാണെങ്കിലും, ശൗലിന്റെ മകനെ സൂചിപ്പിക്കുന്ന മലയാളത്തിലെ സുപരിചിതമായ രൂപം ഉപയോഗിച്ചു; വ്യക്തിയുടെ തിരിച്ചറിയൽ ഇതിലൂടെ മങ്ങുന്നില്ല.
- source_word: מַלְכִּי שׁוּעַ
  choice: മൽക്കീ-ശൂവ
  rationale: രണ്ടുഭാഗങ്ങളുള്ള എബ്രായ നാമത്തിന്റെ ഘടന വ്യക്തമാക്കാൻ ഹൈഫനോടുകൂടി ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲבִינָדָב
  choice: അബീനാദാബ്
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶשְׁבָּעַל
  choice: എശ്ബാൽ
  rationale: ദിനവൃത്താന്തത്തിലെ എബ്രായ പാഠം നേരിട്ട് പ്രതിഫലിപ്പിച്ചു; ശമൂവേലിലെ വ്യത്യസ്ത നാമരൂപം മുഖ്യപാഠത്തിലേക്ക് ചേർത്ത് സമന്വയിപ്പിച്ചില്ല.
theological_decisions:
- issue: ശൗലിന്റെ അവസാനമായി പറയുന്ന മകന്റെ നാമരൂപം
  choice: മുഖ്യപാഠത്തിൽ എശ്ബാൽ
  alternative: ഈശ്-ബോശെത്ത്
  rationale: ദിനവൃത്താന്തത്തിലെ എബ്രായ പാഠത്തിൽ אֶשְׁבָּעַל എന്ന രൂപമാണ്. അതിനാൽ മൂലപാഠത്തിന് മുൻഗണന നൽകി ‘എശ്ബാൽ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി; വായനക്കാർക്ക് പരിചിതമായ ശമൂവേലിലെ മറ്റൊരു നാമരൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി സ്വീകരിച്ചു. ആവർത്തിക്കുന്ന എബ്രായ ഘടന അർത്ഥവ്യക്തതയ്ക്കായി നിലനിർത്തി; അവസാന പട്ടികയിൽ ‘എന്നിവരുടെ’ ഉപയോഗിച്ച് സ്വാഭാവിക മലയാളവാക്യഘടന നൽകി.
