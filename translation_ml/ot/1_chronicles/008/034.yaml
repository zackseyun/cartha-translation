id: 1CH.8.34
reference: 1 Chronicles 8:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בֶן יְהוֹנָתָ֖ן מְרִ֣יב בָּ֑עַל וּ/מְרִ֥יב בַּ֖עַל הוֹלִ֥יד אֶת מִיכָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/034.yaml
  text: And the son of Jehonathan was Merib-baal[a], and Merib-baal fathered Micah.
translation:
  language: ml
  text: യെഹോനാഥാന്റെ മകൻ മെരീബ്-ബാൽ ആയിരുന്നു; മെരീബ്-ബാൽ മീഖായുടെ പിതാവായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 ശമൂവേൽ 9:12-ലെ സമാന്തര വംശാവലിയിൽ ഈ വ്യക്തിയുടെ പേര് ‘മീഖാ’ (מִיכָא) എന്നാണ്; ഇവിടെ ‘മീഖാ’ (מִיכָה) എന്നാണ് എഴുതിയിരിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: യെഹോനാഥാന്റെ മകൻ
  rationale: വാവ് എന്ന ബന്ധകത്തിന്റെ തുടർച്ച മലയാളത്തിലെ വാക്യപ്രവാഹത്തിലും അർധവിരാമത്തിലൂടെയും സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു; בֶּן വംശാവലിസന്ദർഭത്തിൽ ‘മകൻ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: יְהוֹנָתָן
  choice: യെഹോനാഥാൻ
  rationale: മൂലപാഠത്തിലെ ദീർഘരൂപമായ യെഹോനാഥാൻ നിലനിർത്തി; കൂടുതൽ പരിചിതമായ ‘യോനാഥാൻ’ എന്ന രൂപത്തിലേക്ക് ഏകീകരിച്ചില്ല.
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  choice: മെരീബ്-ബാൽ
  rationale: എബ്രായത്തിൽ രണ്ടു ഘടകങ്ങളായി എഴുതിയിരിക്കുന്ന ഒരേയൊരു വ്യക്തിനാമം ഹൈഫനോടെ ലിപ്യന്തരിച്ചു. ആവർത്തനം രണ്ടു വ്യക്തികളെ സൂചിപ്പിക്കുന്നതല്ല, വംശാവലിയുടെ തുടർച്ചയാണ്.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: ഹിഫ്ഇൽ രൂപത്തിന് വംശാവലിസന്ദർഭത്തിൽ പിതൃവംശപരമായ നേരിട്ടുള്ള സന്തതിബന്ധം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: אֶת מִיכָה
  choice: മീഖായെ
  rationale: אֶת സ്വതന്ത്രമായി വിവർത്തനം ചെയ്യാതെ നേരിട്ടുള്ള കർമത്തെ മലയാളത്തിലെ ‘-യെ’ വിഭക്തിയാൽ അടയാളപ്പെടുത്തി; מִיכָה ‘മീഖാ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. വ്യക്തിനാമങ്ങൾ മൂലപാഠത്തിലെ രൂപവ്യത്യാസങ്ങൾ കഴിയുന്നത്ര നിലനിർത്തി ലിപ്യന്തരിച്ചു; ആവർത്തനം ഒഴിവാക്കാതെ എബ്രായവാക്യത്തിന്റെ ഘടന സംരക്ഷിച്ചു.
