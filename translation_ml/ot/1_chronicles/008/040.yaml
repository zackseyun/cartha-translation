  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. അപരിചിതമായ അക്ഷരാർഥപ്രയോഗത്തിനു പകരം ‘വില്ലാളികൾ’ ഉപയോഗിച്ചു; മൂലത്തിലെ ഗോത്രബന്ധത്തിന്റെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
