  text: Iphdeiah and Penuel were the sons of Shashak[a].
translation:
  language: ml
  text: യിഫ്ദെയാവും പെനൂവേലും[a] ശാശകിന്റെ പുത്രന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, പെനീയേൽ. എബ്രായ നാമം ഇംഗ്ലീഷിലും മറ്റു ഭാഷകളിലും ‘പെനീയേൽ’ എന്നും ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְדְיָה
  choice: യിഫ്ദെയാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജനങ്ങളും ഉച്ചാരണരൂപവും മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: פניאל
  choice: പെനൂവേൽ
  rationale: മസോററ്റിക് പാഠത്തിലെ പദരൂപത്തെ പിന്തുടർന്ന് വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּנֵי
  choice: പുത്രന്മാരായിരുന്നു
  rationale: ഇത് ‘മകൻ’ എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപമാണ്. ക്രിയയില്ലാത്ത എബ്രായ വംശാവലിവാക്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘ആയിരുന്നു’ ചേർത്തു; പുരുഷവംശജരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ നിലനിർത്തി.
- source_word: שָׁשָׁק
  choice: ശാശാക്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; അന്തിമ വ്യഞ്ജനശബ്ദം നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. ഇംഗ്ലീഷിലെ Peniel എന്ന ലിപ്യന്തരഭേദം മലയാള പരിഭാഷയിൽ ആവശ്യമായ അർത്ഥഭേദം സൃഷ്ടിക്കാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
