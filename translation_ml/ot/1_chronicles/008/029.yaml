  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ‘പിതാവ്’ എന്ന അർഥവ്യാപ്തിയുള്ള പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; സന്ദർഭസാധ്യമായ മറ്റു അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
