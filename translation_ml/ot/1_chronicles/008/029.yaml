  language: ml
  text: ഗിബെയോനിൽ ഗിബെയോന്റെ പിതാവ്[a] താമസിച്ചിരുന്നു; അവന്റെ ഭാര്യയുടെ പേര് മാഖാ എന്നായിരുന്നു.
