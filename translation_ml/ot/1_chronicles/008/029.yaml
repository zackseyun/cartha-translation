lexical_decisions:
- source_word: וּ/בְ/גִבְעוֹן
  choice: ഗിബെയോനിൽ
  rationale: വാവോടുകൂടിയ സ്ഥലസൂചക പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഗിബെയോനിൽ’ എന്നാണ്. മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന വാവ് മലയാളത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: יָשְׁבוּ
  choice: താമസിച്ചിരുന്നു
  rationale: ישׁב എന്ന ക്രിയയ്ക്ക് ‘ഇരിക്കുക, വസിക്കുക, താമസിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. വംശാവലി-സ്ഥലവിവരണ പശ്ചാത്തലത്തിൽ ‘താമസിച്ചിരുന്നു’ സ്വാഭാവികവും മാന്യവുമായ മലയാളമാണ്. ഹീബ്രായ രൂപം ബഹുവചനമായിരുന്നാലും പ്രസ്താവിത കർത്താവ് ഏകവചനമായതിനാൽ അർഥാനുസൃതമായി ഏകവചനം ഉപയോഗിച്ചു.
- source_word: אֲבִי גִבְעוֹן
  choice: ഗിബെയോന്റെ പിതാവ്
  rationale: നിർമാണബന്ധത്തിലുള്ള ഈ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ഗിബെയോന്റെ പിതാവ്’ എന്നാണ്. സ്ഥലത്തിന്റെ സ്ഥാപകൻ, പൂർവികൻ, അല്ലെങ്കിൽ പ്രമുഖൻ എന്ന വിപുലാർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְ/שֵׁם אִשְׁתּוֹ
  choice: അദ്ദേഹത്തിന്റെ ഭാര്യയുടെ പേര് … എന്നായിരുന്നു
  rationale: ‘അവന്റെ ഭാര്യയുടെ പേര്’ എന്ന ഹീബ്രായ ഘടന മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: מַעֲכָה
  choice: മയഖാ
  rationale: ഹീബ്രായ വ്യക്തിനാമം അതിന്റെ വ്യഞ്ജനഘടനയും സ്വരക്രമവും പരിഗണിച്ച് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
