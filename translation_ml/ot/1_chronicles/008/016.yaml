  text: וּ/מִיכָאֵ֧ל וְ/יִשְׁפָּ֛ה וְ/יוֹחָ֖א בְּנֵ֥י בְרִיעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/016.yaml
  text: and Michael, Ishpah, and Joha, the sons of Beriah.
translation:
  language: ml
  text: മീഖായേൽ, യിശ്പാ, യോഹാ എന്നിവർ ബെരീയാവിന്റെ പുത്രന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִיכָאֵל
  choice: മീഖായേൽ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു; മുൻപ്രത്യയമായ സംയോജകം മലയാള പട്ടികയുടെ ഘടനയിൽ പ്രതിനിധീകരിച്ചു.
- source_word: וְ/יִשְׁפָּה
  choice: യിശ്പാ
  rationale: ആദ്യത്തെ എബ്രായ യോദ് നിലനിർത്തി വ്യക്തിനാമം ശബ്ദസമീപമായി ലിപ്യന്തരിച്ചു.
- source_word: וְ/יוֹחָא
  choice: യോഹാ
  rationale: എബ്രായ നാമത്തിന്റെ ആദ്യ യോദും സ്വരഘടനയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിസന്ദർഭത്തിൽ ഈ പദം നേരിട്ട് ആൺമക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: בְרִיעָה
  choice: ബെരീയാവ്
  rationale: വ്യക്തിനാമം എബ്രായ രൂപത്തോട് അടുത്ത് ലിപ്യന്തരിച്ചു; മലയാളത്തിലെ സംബന്ധപ്രത്യയം ചേർക്കാൻ ‘ബെരീയാവിന്റെ’ എന്ന രൂപം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. എബ്രായത്തിൽ ഓരോ പേരിനുമുമ്പുമുള്ള സംയോജകത്തെ അതേപടി ആവർത്തിക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാരൂപമായ ‘എന്നിവർ’ ഉപയോഗിച്ചു; നാമവാക്യത്തെ പൂർണ്ണമായ മലയാളവാക്യമാക്കാൻ സന്ദർഭാനുസൃതമായി ‘ആയിരുന്നു’ ചേർത്തു.
