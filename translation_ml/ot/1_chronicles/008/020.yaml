  terminology: Personal names are transliterated rather than translated, appropriately preserving the theophoric form in «എലീയേൽ». «എലിയേനായി» and «എലീയേൽ» are acceptable Malayalam renderings for the source forms. «സില്ലെതായി» better reflects the single final tav of צִלְּתַי.
