  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പേരുകളുടെ പട്ടികയിൽ ആവർത്തിക്കുന്ന ഹീബ്രു സംയോജകങ്ങളെ മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാരീതിയായ ‘എന്നിവരും’കൊണ്ട് അവതരിപ്പിച്ചു.
