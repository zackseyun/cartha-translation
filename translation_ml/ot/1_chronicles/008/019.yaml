  rationale: ഹീബ്രു വ്യക്തിനാമം അതിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാളരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
