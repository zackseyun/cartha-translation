translation:
  language: ml
  text: ശംശെരായിയും ശെഹര്യാവും അതല്യാവും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁמְשְׁרַי
  choice: ശംശ്രായി
  rationale: വംശാവലിപ്പട്ടികയിലെ വ്യക്തിനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: שְׁחַרְיָה
  choice: ശെഹര്യാവ്
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു; അവസാനത്തെ -יָה ഘടകം മലയാള ബൈബിൾ നാമശൈലിയിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കാൻ ‘-യാവ്’ ഉപയോഗിച്ചു.
- source_word: עֲתַלְיָה
  choice: അതല്യാവ്
  rationale: വ്യക്തിനാമം എബ്രായ രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; അവസാനത്തെ -יָה ഘടകം ‘-യാവ്’ എന്നു നൽകി.
- source_word: וְ / וּ / וַ
  choice: എന്നിവരും
  rationale: മൂന്നു പേരെയും ബന്ധിപ്പിക്കുന്ന എബ്രായ വാവ് സംയോജകങ്ങളുടെ പട്ടികാത്മക പ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘എന്നിവരും’ എന്ന സമാപകസംയോജനത്തിലൂടെ പ്രകടമാക്കി; മുൻവാക്യവുമായി തുടർച്ചയുള്ള ‘കൂടാതെ/ഉം’ എന്ന ഭാവവും ഇത് സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. വ്യക്തിനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു; എബ്രായത്തിലെ ഓരോ വാവും വേർതിരിച്ച് ആവർത്തിക്കുന്നത് മലയാളത്തിൽ കൃത്രിമമാകുന്നതിനാൽ പട്ടികയുടെ ബന്ധം സ്വാഭാവികമായി ഏകീകരിച്ചു.
