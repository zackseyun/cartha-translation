    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: ജന്മം നൽകി
  rationale: ילד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം വംശാവലിസന്ദർഭത്തിൽ മക്കളുടെ പിതാവാകുക എന്നർഥം നൽകുന്നു. ആൺവംശപരമായ ആശയം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: מִן
  choice: -ൽനിന്ന്
  rationale: ഇവിടെ מן മാതൃസ്രോതസ്സിനെ സൂചിപ്പിക്കുന്നു. ഹോദെശ് ഈ മക്കളുടെ അമ്മയാണെന്ന ബന്ധം ‘ഹോദെശിൽനിന്ന്’ എന്ന പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘ഹോദെശിലൂടെ’ എന്നും പറയാം.
- source_word: חֹדֶשׁ
  choice: ഹോദെശ്
  rationale: ഇത് വ്യക്തിനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയായ
  rationale: സന്ദർഭത്തിൽ אשה എന്നത് സ്ത്രീ എന്ന പൊതുവർഥത്തിലല്ല, ഭാര്യ എന്ന അർഥത്തിലാണ്; മലയാളവാക്യത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ഈ രൂപം സ്വീകരിച്ചു.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: പേരുകളുടെ പട്ടികയും അവസാനത്തിൽ ‘എന്നിവർ’ എന്ന ഏകോപനവും
  rationale: ആവർത്തിക്കുന്ന നേരിട്ടുള്ള കർമചിഹ്നത്തിന് മലയാളത്തിൽ തുല്യമായ പ്രത്യേക പദമില്ല. നാല് പേരെയും കർമമായി പട്ടികപ്പെടുത്തി അതിന്റെ വ്യാകരണധർമ്മം പ്രകടമാക്കി.
- source_word: יוֹבָב
  choice: യോബാബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദസമീപമായ മലയാള ലിപ്യന്തരണം.
- source_word: צִבְיָא
  choice: സിബ്യാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מֵישָׁא
  choice: മേശാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദസമീപമായ മലയാള ലിപ്യന്തരണം.
- source_word: מַלְכָּם
  choice: മൽക്കാം
  rationale: വംശാവലിയിൽ ഇത് വ്യക്തിനാമമാണ്; എബ്രായത്തിലെ ഇരട്ട കാഫ് ധ്വനിയും ദീർഘസ്വരവും കഴിയുന്നത്ര പ്രതിഫലിപ്പിച്ചു.
