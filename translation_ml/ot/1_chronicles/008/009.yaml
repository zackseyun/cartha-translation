translation:
  language: ml
  text: അവൻ തന്റെ ഭാര്യയായ ഹോദെശിലൂടെ[a] യോബാബ്, സിബ്യാ, മേശാ, മൽക്കാം എന്നിവരുടെ പിതാവായി.
  philosophy: optimal-equivalence
