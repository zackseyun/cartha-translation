source:
  edition: WLC
  text: וְ/אָחָז֙ הוֹלִ֣יד אֶת יְהוֹעַדָּ֔ה וִ/יהֽוֹעַדָּ֗ה הוֹלִ֛יד אֶת עָלֶ֥מֶת וְ/אֶת עַזְמָ֖וֶת וְ/אֶת זִמְרִ֑י וְ/זִמְרִ֖י הוֹלִ֥יד אֶת מוֹצָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/036.yaml
  text: Ahaz fathered Jehoaddah[a], and Jehoaddah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: ml
  text: ആഹാസ് യെഹോഅദ്ദായുടെ[a] പിതാവായി; യെഹോഅദ്ദാ ആലെമെത്ത്, അസ്മാവെത്ത്, സിമ്രി എന്നിവരുടെ പിതാവായി; സിമ്രി മോസയുടെ പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ യെഹോഅദ്ദാ; ചില ഇംഗ്ലീഷ് പരമ്പരകളിൽ ‘യെഹോയാദാ’ എന്ന രൂപം കാണുന്നു.
    reason: എബ്രായ പാഠരൂപവും ചില ഇംഗ്ലീഷ് പരമ്പരകളിലെ വ്യത്യസ്ത ലിപ്യന്തരണരൂപവും വ്യക്തമാക്കുന്നു; ഇതിനെ എബ്രായ പാഠഭേദമായി അവതരിപ്പിക്കുന്നില്ല.
lexical_decisions:
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ സന്ദർഭത്തിൽ ഹിഫീൽ രൂപം ഒരാൾ മറ്റൊരാളുടെ പിതാവായതായി സൂചിപ്പിക്കുന്നു. ‘പിതാവായി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: אֶת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഇത് എബ്രായത്തിലെ നേരിട്ടുള്ള കർമസൂചകമാണ്; മലയാളത്തിൽ ഇതിന് വേറിട്ട പദസമാനം ആവശ്യമില്ല.
- source_word: יְהוֹעַדָּה
  choice: യെഹോവദ്ദാ
  rationale: നൽകിയിരിക്കുന്ന എബ്രായ വ്യഞ്ജനരൂപവും ദാഗേശ് സൂചിപ്പിക്കുന്ന ഇരട്ട ‘ദ്ദ’ ശബ്ദവും കഴിയുന്നത്ര പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: עָלֶמֶת
  choice: അലെമെത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עַזְמָוֶת
  choice: അസ്മാവെത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജനഘടനയും ഉച്ചാരണവും കഴിയുന്നത്ര നിലനിർത്തുന്ന ലിപ്യന്തരണം.
- source_word: זִמְרִי
  choice: സിമ്രി
  rationale: രണ്ടിടത്തും ഒരേ വ്യക്തിനാമം ഏകീകൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: מוֹצָא
  choice: മോസ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: וְ
  choice: ; / , / എന്നിവരുടെ
  rationale: എബ്രായത്തിലെ ബന്ധകപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കനുസരിച്ച് അർധവിരാമം, പട്ടികയിലെ കോമ, ‘എന്നിവരുടെ’ എന്നിവയിലൂടെ പ്രതിഫലിപ്പിച്ചു.
