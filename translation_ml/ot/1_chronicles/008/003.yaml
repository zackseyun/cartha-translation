source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בָנִ֖ים לְ/בָ֑לַע אַדָּ֥ר וְ/גֵרָ֖א וַ/אֲבִיהֽוּד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/003.yaml
  text: 'Bela had sons: Addar[a], Gera[b], and Abihud.'
translation:
  language: ml
  text: 'ബേലയ്ക്ക് പുത്രന്മാർ ഉണ്ടായിരുന്നു: അദ്ദാർ, ഗേരാ, അബീഹൂദ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְבָלַע
  choice: ബേലയ്ക്ക് പുത്രന്മാർ ഉണ്ടായിരുന്നു
  rationale: ‘ബേലയ്ക്ക് പുത്രന്മാർ ഉണ്ടായിരുന്നു’ എന്ന സ്വാഭാവിക മലയാള പ്രയോഗം, അക്ഷരാർഥമായ ‘ബേലയ്ക്ക് പുത്രന്മാർ ആയിരുന്നു’ എന്നതിനേക്കാൾ വ്യക്തമായി എബ്രായ വംശാവലിപ്രയോഗത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: בָנִים
  choice: പുത്രന്മാർ
  rationale: ഈ വംശാവലിസന്ദർഭത്തിൽ പദം പേരെടുത്തുപറയുന്ന ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘മക്കൾ’ എന്ന പൊതുപദത്തേക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: לְבָלַע
  choice: ബേല
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: אַדָּר
  choice: അദ്ദാർ
  rationale: എബ്രായ പാഠത്തിലെ ദാഗേശ് സൂചിപ്പിക്കുന്ന ഇരട്ട വ്യഞ്ജനത്തെ ‘ദ്ദ’ എന്നും ദീർഘസ്വരത്തെ ‘ആ’ എന്നും പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: וְגֵרָא
  choice: ഗേരാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ സ്വരഘടന പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וַאֲבִיהוּד
  choice: അബീഹൂദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഘടകങ്ങളും ദീർഘസ്വരങ്ങളും കഴിയുന്നത്ര വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിയുടെ ചുരുക്കശൈലി നിലനിർത്തിക്കൊണ്ട് എബ്രായ ഉടമസ്ഥതാപ്രയോഗം സ്വാഭാവിക മലയാളത്തിലാക്കി. വിവർത്തനത്തിന് ആവശ്യമായ യഥാർഥ പാഠഭേദമോ അർഥസന്ദിഗ്ധതയോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
