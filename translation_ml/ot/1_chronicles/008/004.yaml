lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: അബീശൂവ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു. വംശാവലിപ്പട്ടികയിലെ ബന്ധം മലയാളത്തിലെ അവസാനത്തെ ‘എന്നിവരും’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: וְ/נַעֲמָן
  choice: നയമാൻ
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַ/אֲחוֹחַ
  choice: അഹോവഹ്
  rationale: അവസാന വ്യഞ്ജനമായ ח ഉൾപ്പെടെ എബ്രായനാമത്തിന്റെ ശബ്ദരൂപം തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ബന്ധകമായ ו മലയാളപ്പട്ടികയിലെ ‘എന്നിവരും’ എന്നതിലൂടെ പ്രതിനിധീകരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, വംശാവലിയുടെ മുൻവാക്യവുമായി തുടർച്ച വ്യക്തമാക്കുന്ന സംക്ഷിപ്ത പട്ടികാശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ഓരോ ו-യും പ്രത്യേകം ‘ഉം’ ആയി ആവർത്തിക്കാതെ, സ്വാഭാവിക മലയാളത്തിൽ ‘എന്നിവരും’ എന്ന സമാഹാരബന്ധകം ഉപയോഗിച്ചു.
