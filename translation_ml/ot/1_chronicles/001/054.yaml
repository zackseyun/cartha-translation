    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: പ്രമുഖൻ / പ്രമുഖന്മാർ
  rationale: എദോമ്യ വംശ-രാഷ്ട്രീയ പട്ടികകളിൽ ഈ പദം ഒരു ഗോത്രത്തിന്റെയോ കുലത്തിന്റെയോ തലവനെ സൂചിപ്പിക്കുന്നു. ‘പ്രമുഖൻ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പദമാണ്; രാജകീയ പദവിപോലെ തെറ്റിദ്ധരിക്കാവുന്ന പദങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: מַגְדִּיאֵל
  choice: മഗ്ദീയേൽ
  rationale: വ്യക്തിനാമം അർത്ഥവിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: עִירָם
  choice: ഈരാം
  rationale: വ്യക്തിനാമം എബ്രായ സ്വരരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֵלֶּה
  choice: ഇവരായിരുന്നു
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിതമായ സംഗ്രഹവാക്യം മുൻപറഞ്ഞ വ്യക്തികളെ പിന്നോട്ടു ചൂണ്ടുന്ന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אַלּוּפֵי אֱדֹם
  choice: എദോമിലെ പ്രമുഖന്മാർ
  rationale: മുൻപുള്ള പേരുകളെ എദോമ്യ കുല-ഗോത്രത്തലവന്മാരായി സംഗ്രഹിക്കുന്ന നിർമാണബന്ധം; മലയാളത്തിൽ സ്ഥലം/ജനവിഭാഗബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
