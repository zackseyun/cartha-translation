  register: ആധുനികവും ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. ആവർത്തിക്കുന്ന എബ്രായപദത്തിന് ഏകീകരിച്ച വിവർത്തനം നിലനിർത്തുകയും അതിന്റെ കുല-ഗോത്രപരമായ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
