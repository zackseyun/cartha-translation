id: 1CH.1.32
reference: 1 Chronicles 1:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֨י קְטוּרָ֜ה פִּילֶ֣גֶשׁ אַבְרָהָ֗ם יָלְדָ֞ה אֶת זִמְרָ֧ן וְ/יָקְשָׁ֛ן וּ/מְדָ֥ן וּ/מִדְיָ֖ן וְ/יִשְׁבָּ֣ק וְ/שׁ֑וּחַ וּ/בְנֵ֥י יָקְשָׁ֖ן שְׁבָ֥א וּ/דְדָֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
translation:
  language: ml
  text: 'അബ്രാഹാമിന്റെ ഉപഭാര്യയായ കെതൂറായുടെ പുത്രന്മാർ[a]: അവൾ സിമ്രാൻ, യൊക്ഷാൻ, മെദാൻ, മിദ്യാൻ, യിശ്ബാക്ക്, ശൂഹ എന്നിവരെ പ്രസവിച്ചു. യൊക്ഷാന്റെ പുത്രന്മാർ: ശേബായും ദെദാനും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഉല്പത്തി 25:1 കെതൂറായെ അബ്രാഹാമിന്റെ ഭാര്യ എന്നു വിളിക്കുന്നു; ഇവിടെ ദിനവൃത്താന്തകാരൻ അവളെ പ്രത്യേകമായി അദ്ദേഹത്തിന്റെ ഉപഭാര്യ എന്നു വിളിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי קְטוּרָה
  choice: കെതൂറയുടെ പുത്രന്മാർ
  rationale: בְּנֵי എന്ന സംയുക്ത ബഹുവചനം ‘പുത്രന്മാർ’ എന്നു നൽകി വംശാവലിയുടെ പട്ടികാശൈലി നിലനിർത്തി. ആരംഭത്തിലെ וּ സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: פִּילֶגֶשׁ אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ ഉപഭാര്യയായ
  rationale: פִּילֶגֶשׁ പ്രധാന ഭാര്യയെക്കാൾ താഴ്ന്ന സാമൂഹിക പദവിയുള്ള അംഗീകൃത ദാമ്പത്യബന്ധത്തിലെ സ്ത്രീയെ സൂചിപ്പിക്കുന്നു. ആ വ്യത്യാസം കാത്തുസൂക്ഷിക്കാൻ ‘ഉപഭാര്യ’ ഉപയോഗിച്ചു.
- source_word: יָלְדָה
  choice: അവൾ ... പ്രസവിച്ചു
  rationale: സ്ത്രീലിംഗ ഏകവചന ക്രിയയുടെ കർത്താവ് കെതൂറയാണെന്ന് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: זִמְרָן וְיָקְשָׁן וּמְדָן וּמִדְיָן וְיִשְׁבָּק וְשׁוּחַ
  choice: സിമ്രാൻ, യൊക്ഷാൻ, മെദാൻ, മിദ്യാൻ, യിശ്ബാക്ക്, ശൂവഹ്
  rationale: ഹീബ്രു വ്യക്തിനാമങ്ങളുടെ ശബ്ദരൂപം സാധ്യമായത്ര നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וּבְנֵי יָקְשָׁן שְׁבָא וּדְדָן
  choice: 'യൊക്ഷാന്റെ പുത്രന്മാർ: ശേബയും ദെദാനും'
  rationale: വംശാവലിയുടെ സംക്ഷിപ്ത നാമപ്പട്ടികാ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֶת
  choice: വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇത് ഹീബ്രുവിലെ നിർദിഷ്ട കർമസൂചകമാണ്; മലയാളത്തിൽ നേരിട്ടുള്ള പദസമാനത ആവശ്യമില്ല.
theological_decisions:
- issue: അബ്രാഹാമിനോടുള്ള കെതൂറയുടെ ബന്ധപദവി
  choice: ഉപഭാര്യ
  alternative: ഭാര്യ
  rationale: ഈ വാക്യം വ്യക്തമായി פִּילֶגֶשׁ എന്നാണ് പറയുന്നത്. ഉല്പത്തി 25:1-ലെ ‘ഭാര്യ’ എന്ന വിശേഷണവുമായി നിശ്ശബ്ദമായി സമന്വയിപ്പിക്കാതെ ദിനവൃത്താന്തകാരന്റെ പ്രത്യേക പദപ്രയോഗം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വംശാവലിയുടെ സംക്ഷിപ്ത പട്ടികാശൈലി നിലനിർത്തി; വ്യക്തിനാമങ്ങൾ ഹീബ്രു രൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
