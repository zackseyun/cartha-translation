id: 1CH.1.43
reference: 1 Chronicles 1:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ/מְּלָכִ֗ים אֲשֶׁ֤ר מָלְכוּ֙ בְּ/אֶ֣רֶץ אֱד֔וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֣י יִשְׂרָאֵ֑ל בֶּ֚לַע בֶּן בְּע֔וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കളുടെ മേൽ ഒരു രാജാവ് വാഴുന്നതിനുമുമ്പ്[a] എദോംദേശത്ത് വാണ രാജാക്കന്മാർ ഇവരാണ്: ബെയോരിന്റെ മകനായ ബേല; അവന്റെ നഗരത്തിന്റെ പേര് ദിൻഹാബാ എന്നായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേൽമക്കളുടെ മേൽ ഏതെങ്കിലും രാജാവ് വാഴുന്നതിനുമുമ്പ്.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “ഇസ്രായേൽമക്കൾക്കായി/അവരുടെ മേൽ ഒരു രാജാവ് വാഴുന്നതിനുമുമ്പ്” എന്നാണ്.
    reason: എബ്രായത്തിലെ ഏകവചന അനിശ്ചിത നാമം പൊതുവായ അർഥത്തിലും വായിക്കാം; കൂടാതെ לְ എന്ന ബന്ധസൂചകം ‘ക്കായി’ എന്നും സന്ദർഭത്തിൽ ഭരണബന്ധം സൂചിപ്പിച്ച് ‘മേൽ’ എന്നും ഗ്രഹിക്കാവുന്നതാണ്.
lexical_decisions:
- source_word: וְאֵלֶּה הַמְּלָכִים
  choice: രാജാക്കന്മാർ ഇവരാണ്
  rationale: പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന എബ്രായ അവതരണശൈലി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; മുൻസന്ദർഭത്തോടുള്ള ബന്ധം വാക്യഘടനയിലൂടെ വ്യക്തമാകുന്നു.
- source_word: אֲשֶׁר מָלְכוּ
  choice: വാണ
  rationale: രാജാധികാരം പ്രയോഗിച്ചതിനെ സൂചിപ്പിക്കുന്ന מלך എന്ന ക്രിയയ്ക്ക് സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാള രാജകീയ പ്രയോഗം.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: എദോംദേശത്ത്
  rationale: ‘എദോമിന്റെ ദേശം’ എന്ന എബ്രായ ഘടനയുടെ അർഥം സ്വാഭാവികമായ മലയാള സംയുക്തപദത്തിൽ നൽകുന്നു.
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  choice: ഒരു രാജാവ് വാഴുന്നതിനുമുമ്പ്
  rationale: ക്രിയാനാമവും അതേ ധാതുവിൽനിന്നുള്ള ‘രാജാവ്’ എന്ന നാമവും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ കാലസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു; ഏകവചന അനിശ്ചിതത്വം ‘ഒരു’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെമേൽ
  rationale: ഭരണത്തിന് വിധേയരായ ജനത്തോടുള്ള ബന്ധം ‘മേൽ’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ‘ഇസ്രായേൽമക്കൾ’ എന്ന എബ്രായ ജനനാമശൈലി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: ബെയോരിന്റെ മകനായ ബേല
  rationale: വ്യക്തിനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്യുകയും പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: അവന്റെ നഗരത്തിന്റെ പേര് ദിൻഹാബാ എന്നായിരുന്നു
  rationale: എബ്രായ നാമവാക്യത്തെ അർഥസൂക്ഷ്മത നഷ്ടപ്പെടുത്താതെ സ്വാഭാവികമായ ഭൂതകാല മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിലെ രാജത്വത്തെ സൂചിപ്പിക്കുന്ന അനിശ്ചിത പ്രയോഗം
  choice: ഒരു രാജാവ് വാഴുന്നതിനുമുമ്പ്
  alternative: ഏതെങ്കിലും രാജാവ് വാഴുന്നതിനുമുമ്പ്
  rationale: എബ്രായത്തിൽ ‘രാജാവ്’ ഏകവചനത്തിലും നിർദ്ദിഷ്ടതയില്ലാതെയും വരുന്നതിനാൽ ഒരു പ്രത്യേക രാജാവിനെ നിർബന്ധമായി തിരിച്ചറിയുന്നില്ല. അതേസമയം ‘ഏതെങ്കിലും’ എന്ന് മുഖ്യപാഠത്തിൽ ചേർത്ത് അർഥം ശക്തമാക്കാതിരിക്കാൻ കൂടുതൽ ഔപചാരികമായ രൂപം തിരഞ്ഞെടുത്തു; വിപുലമായ പൊതുവായ വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ വംശാവലി-രാജപട്ടികയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. പേരുകൾ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു. വാക്യത്തിലെ രണ്ട് അവതരണഘട്ടങ്ങൾ ദീർഘവിരാമവും അർധവിരാമവും ഉപയോഗിച്ച് വ്യക്തമായി വേർതിരിച്ചു.
