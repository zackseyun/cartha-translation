  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, വിശാലമായ വംശാവലി അർഥത്തിൽ ‘മക്കൾ’ എന്നോ ‘സന്തതികൾ’ എന്നോ; എബ്രായത്തിൽ അക്ഷരാർഥം ‘പുത്രന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ construct ബഹുവചനം; ഇവിടെ വംശാവലിപ്പട്ടിക അവതരിപ്പിക്കുന്നു. എബ്രായത്തിലെ പുരുഷസന്തതി സൂചന നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷയാണ് ‘പുത്രന്മാർ’.
- source_word: אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: വ്യക്തിനാമം; മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ രൂപം ഉപയോഗിച്ചു.
- source_word: יִצְחָק
  choice: യിസ്ഹാക്ക്
  rationale: വ്യക്തിനാമം; മൂലഭാഷയിലെ പേരിനോട് അടുത്തും മലയാള വായനക്കാർക്ക് പരിചിതവുമായ രൂപം.
- source_word: וְ/יִשְׁמָעֵאל
  choice: യിശ്മായേലും
  rationale: וְ എന്ന ലളിതമായ സംയോജകവും വ്യക്തിനാമവും ചേർന്നത്; മലയാളത്തിൽ പട്ടികയുടെ സ്വാഭാവിക സമാപനരീതിയായി ‘-ഉം’ ചേർത്തു.
