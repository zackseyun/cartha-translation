id: 1CH.1.10
reference: 1 Chronicles 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְר֑וֹד ה֣וּא הֵחֵ֔ל לִ/הְי֥וֹת גִּבּ֖וֹר בָּ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/010.yaml
  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
translation:
  language: ml
  text: കൂശ് നിമ്രോദിനെ ജനിപ്പിച്ചു; അവൻ ദേശത്ത്[a] ഒരു വീരനാകാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂമിയിൽ.’ എബ്രായപദമായ אֶרֶץ എന്നതിന് ‘ദേശം’ എന്നോ ‘ഭൂമി’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כּוּשׁ
  choice: കൂശ്
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന וְ മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ സ്വാഭാവികമായി തുടരാം; כּוּשׁ എന്ന പേര് ‘കൂശ്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: יָלַד
  choice: പിതാവായി
  rationale: വംശാവലി സന്ദർഭത്തിൽ നേരിട്ടുള്ള പിതൃത്വം സൂചിപ്പിക്കുന്നു; ‘ജനിപ്പിച്ചു’ എന്നതിനെക്കാൾ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: נִמְרֹד
  choice: നിമ്രോദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: הוּא הֵחֵל לִהְיוֹת
  choice: ആകാൻ തുടങ്ങിയത് അവനായിരുന്നു
  rationale: הוּא നൽകുന്ന ഊന്നലും הֵחֵל לִהְיוֹת എന്ന ‘ആകാൻ തുടങ്ങി’ എന്ന ഘടനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: גִּבּוֹר
  choice: ഒരു വീരൻ
  rationale: ശക്തനായവൻ, വീരൻ, യോദ്ധാവ് എന്നീ അർഥസാധ്യതകളിൽ ഇവിടെ സൈനികത മാത്രം നിർബന്ധിക്കാത്ത വിശാലവും സ്വാഭാവികവുമായ പദം.
- source_word: בָּאָרֶץ
  choice: ദേശത്തിലെ
  rationale: אֶרֶץ എന്നതിന് ‘ദേശം’ എന്നും ‘ഭൂമി’ എന്നും അർഥമാകാം; മുഖ്യപാഠത്തിൽ പരിമിതമായ ‘ദേശം’ സ്വീകരിച്ച് മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: בָּאָרֶץ സൂചിപ്പിക്കുന്ന വ്യാപ്തി
  choice: ദേശത്തിലെ
  alternative: ഭൂമിയിലെ
  rationale: വാക്യം നിമ്രോദിന്റെ പ്രാബല്യത്തെ സാർവത്രികമാക്കുന്നില്ല; അതിനാൽ പരിമിതമായ വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു. എബ്രായത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. വംശാവലിയുടെ സംക്ഷിപ്തതയും הוּא എന്ന സർവനാമത്തിന്റെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
