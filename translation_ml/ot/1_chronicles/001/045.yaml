id: 1CH.1.45
reference: 1 Chronicles 1:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֖מָת יוֹבָ֑ב וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו חוּשָׁ֖ם מֵ/אֶ֥רֶץ הַ/תֵּימָנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/045.yaml
  text: And Yobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: ml
  text: യോബാബ്[a] മരിച്ചു; അവനു പകരം, തേമാന്യദേശത്തുനിന്നുള്ള[b] ഹൂശാം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘യോബാബ്’ എന്ന പേരിന് ‘ജോബാബ്’ എന്നും എഴുതാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘തേമാന്റെ ദേശത്തുനിന്നുള്ള’ അല്ലെങ്കിൽ ‘തേമാന്യന്റെ ദേശത്തുനിന്നുള്ള’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ wayyiqtol രൂപം കഥയിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; കർത്താവായ യോബാബിനെ വാക്യത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: יוֹבָב
  choice: യോബാബ്
  rationale: എബ്രായ ഉച്ചാരണരൂപത്തോട് അടുത്തുനിൽക്കുന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജവംശാവലി-പിൻഗാമിത്വ സന്ദർഭത്തിൽ מלך ഒരാൾ രാജത്വം ഏറ്റെടുത്ത് ഭരിക്കാൻ തുടങ്ങിയതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിൽ ‘രാജാവായി’ എന്ന് നൽകി.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: ഈ പിൻഗാമിത്വസൂത്രത്തിൽ תחתיו മുൻഗാമിയുടെ സ്ഥാനത്ത് മറ്റൊരാൾ അധികാരമേൽക്കുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: חוּשָׁם
  choice: ഹൂശാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: מֵאֶרֶץ
  choice: ദേശത്തുനിന്നുള്ള
  rationale: מן + אֶרֶץ ഭൂമിശാസ്ത്രപരമായ ഉത്ഭവം സൂചിപ്പിക്കുന്നു; മലയാളവാക്യത്തിൽ വിശേഷണബന്ധമായി സ്വാഭാവികമായി നൽകി.
- source_word: הַתֵּימָנִי
  choice: തേമാന്യരുടെ
  rationale: രൂപം ഒരു ജനവിഭാഗത്തെയോ പ്രദേശബന്ധത്തെയോ സൂചിപ്പിക്കാം. ‘തേമാന്യരുടെ ദേശം’ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; മറ്റു സാധ്യമായ വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. എബ്രായത്തിലെ പിൻഗാമിത്വസൂത്രം സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും പേരുകളും ഭൂമിശാസ്ത്രപരമായ ബന്ധവും സംരക്ഷിച്ചു.
