translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. വംശാവലിയുടെ സംക്ഷിപ്ത പട്ടികാശൈലിയും ‘പുത്രന്മാർ’ എന്ന ഔപചാരിക ബന്ധപദവും നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട പേരായ ‘ദീഫത്ത്’ എന്നതിനോടു ചേർത്തു.
