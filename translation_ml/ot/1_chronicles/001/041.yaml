source:
  edition: WLC
  text: בְּנֵ֥י עֲנָ֖ה דִּישׁ֑וֹן וּ/בְנֵ֣י דִישׁ֔וֹן חַמְרָ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽןס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/041.yaml
  text: 'The sons of Anah: Dishon. And the sons of Dishon: Hamran[a], Eshban, Ithran, and Keran.'
translation:
  language: ml
  text: 'അനായുടെ പുത്രന്മാർ: ദീശോൻ. ദീശോന്റെ പുത്രന്മാർ: ഹമ്രാൻ[a], എശ്ബാൻ, യിത്രാൻ, കെരാൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഉല്പത്തി 36:26-ലെ സമാന്തര വംശാവലിയിൽ ഇവിടെ ‘ഹെമ്ദാൻ’ എന്നാണ്. ഈ വാക്യത്തിന്റെ മുഖ്യപാഠം 1 ദിനവൃത്താന്തത്തിലെ മസോററ്റിക് പാഠമായ ‘ഹമ്രാൻ’ പിന്തുടരുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടികയിലെ בְּנֵי എന്ന പുരുഷലിംഗ ബഹുവചന സംയുക്തരൂപത്തെ നേരിട്ടും സ്വാഭാവികമായും പ്രതിനിധീകരിക്കുന്നു.
- source_word: עֲנָה
  choice: അന
  rationale: ഹീബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: דִּישׁוֹן
  choice: ദീശോൻ
  rationale: ഒരേ വാക്യത്തിൽ അനയുടെ പുത്രനായും തുടർന്നുള്ള നാലുപേരുടെ പിതാവായും വരുന്ന ഒരേ വ്യക്തിനാമം ഒരേ രൂപത്തിൽ നിലനിർത്തി.
- source_word: וּבְנֵי
  choice: ദീശോന്റെ പുത്രന്മാർ
  rationale: വാക്യവിഭജനംകൊണ്ട് പട്ടികയുടെ തുടർച്ച വ്യക്തമായതിനാൽ ഹീബ്രായ വാവിന്റെ ബന്ധകബലം സ്വാഭാവിക മലയാളഘടനയിൽ പ്രകടമാക്കി; അനാവശ്യമായ ‘കൂടാതെ’ ഒഴിവാക്കി.
- source_word: חַמְרָן
  choice: ഹമ്രാൻ
  rationale: 1 ദിനവൃത്താന്തം 1:41-ലെ മസോററ്റിക് പാഠമായ חַמְרָן നേരിട്ട് പിന്തുടർന്നു; ഉല്പത്തി 36:26-ലെ സമാന്തരരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אֶשְׁבָּן
  choice: എശ്ബാൻ
  rationale: ഹീബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ അടുത്ത ശബ്ദരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: יִתְרָן
  choice: യിത്രാൻ
  rationale: ആദ്യാക്ഷരമായ യോദും മദ്ധ്യത്തിലെ תְר ശബ്ദക്രമവും പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: כְרָן
  choice: കെരാൻ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തെ നേരിട്ട് ലിപ്യന്തരിച്ചു; അന്തിമ പട്ടികാംഗമാണെന്നത് മലയാളത്തിലെ വിരാമചിഹ്നങ്ങളാൽ വ്യക്തമാണ്.
