  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. പേരുകളുടെ പട്ടിക വ്യക്തമായി വായിക്കാനായി ദ്വിബിന്ദു ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ബന്ധങ്ങളും പാഠവ്യത്യാസവും സംരക്ഷിച്ചു.
