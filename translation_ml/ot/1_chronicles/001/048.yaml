  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. രാജകീയ പിന്തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘നദി’ എന്നതിനെ യൂഫ്രട്ടീസ് എന്ന് മുഖ്യവാചകത്തിൽ നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല.
