id: 1CH.1.48
reference: 1 Chronicles 1:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֖מָת שַׂמְלָ֑ה וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו שָׁא֖וּל מֵ/רְחֹב֥וֹת הַ/נָּהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/048.yaml
  text: Samlah died[a], and Shaul from Rehoboth by the River reigned in his place.
translation:
  language: ml
  text: സമ്ലാ മരിച്ചു; അവന്റെ സ്ഥാനത്ത് നദിക്കരയിലെ[a] രെഹോബോത്തിൽനിന്നുള്ള ശൗൽ രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, ‘നദി’ അഥവാ ‘ആ നദി.’ ഇതു യൂഫ്രട്ടീസ് നദിയെ സൂചിപ്പിക്കുന്നതാണെന്ന് പലരും മനസ്സിലാക്കുന്നു.
    reason: The Hebrew has the definite expression “the River” without naming the river; the note preserves both the literal wording and the common geographical identification.
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ ഖാൽ വയിക്തോൽ രൂപം മരണത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; അനാവശ്യമായ മൃദൂകരണങ്ങളില്ലാത്ത സ്വാഭാവിക വിവർത്തനം.
- source_word: שַׂמְלָה
  choice: സമ്ലാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജകീയ പിന്തുടർച്ചാസൂത്രത്തിൽ מלך അധികാരമേറ്റ് രാജാവാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: תחתയും സർവനാമപ്രത്യയവും ചേർന്ന രൂപം ഒരാളുടെ സ്ഥാനത്ത് മറ്റൊരാൾ വരുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: מֵרְחֹבוֹת
  choice: രെഹോബോത്തിൽനിന്നുള്ള
  rationale: מ־ ഉത്ഭവസ്ഥലത്തെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു; രെഹോബോത്ത് ഇവിടെ സ്ഥലനാമമാണ്.
- source_word: הַנָּהָר
  choice: നദീതീരത്തുള്ള
  rationale: വാച്യമായി ‘നദി’ എന്നാണ്; രെഹോബോത്തിന്റെ ഭൂമിശാസ്ത്രബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുമ്പോഴും ഏത് നദിയെന്ന് മുഖ്യവാചകത്തിൽ നിർണ്ണയിക്കുന്നില്ല.
