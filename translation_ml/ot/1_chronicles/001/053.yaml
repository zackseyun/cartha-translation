    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: ഗോത്രത്തലവൻ
  rationale: എദോമ്യരുടെ പട്ടികകളിൽ ഈ പദം ഒരു ഗോത്രത്തിന്റെയോ വംശവിഭാഗത്തിന്റെയോ തലവനെ സൂചിപ്പിക്കുന്നു. ‘ഗോത്രത്തലവൻ’ എന്നത് ആ സാമൂഹിക അർഥം വ്യക്തമായി നൽകുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: קְנַז
  choice: കേനസ്
  rationale: സ്വന്തനാമമായതിനാൽ ഹീബ്രായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: תֵּימָן
  choice: തേമാൻ
  rationale: ഇവിടെ എദോമ്യ തലവന്മാരുടെ പട്ടികയിലെ പേരായി പ്രവർത്തിക്കുന്നതിനാൽ സ്ഥലമോ പ്രദേശമോ ആയി വ്യാഖ്യാനിക്കാതെ സ്വന്തനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִבְצָר
  choice: മിബ്സാർ
  rationale: സ്വന്തനാമമായി മനസ്സിലാക്കി ഹീബ്രായ രൂപത്തോട് ചേർന്നുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു; പദത്തിന്റെ സാധാരണ നിഘണ്ടു അർഥം ഇവിടെ വിവർത്തനം ചെയ്തിട്ടില്ല.
