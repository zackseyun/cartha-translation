  yaml_path: translation/ot/1_chronicles/001/013.yaml
  text: And Canaan fathered Sidon his firstborn[b][a], and Heth.
translation:
  language: ml
  text: കനാൻ തന്റെ ആദ്യജാതനായ സീദോനെയും[a] ഹേത്തിനെയും[b] ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായനാമം: സീദോൻ.'
    reason: lexical_alternative
  - marker: b
    text: ഹേത്ത് എന്നത് ഹിത്യരുമായി ബന്ധപ്പെടുത്തി പറയപ്പെടുന്ന പൂർവികന്റെ പേരാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: കനാൻ
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന וּ എന്ന ബന്ധകത്തെ മലയാളവാക്യത്തിന്റെ സ്വാഭാവികമായ തുടർച്ചയിൽ പ്രത്യേകം പദമായി നൽകേണ്ടതില്ല; כְנַעַן എന്ന പേരിന് ‘കനാൻ’ എന്ന പ്രചാരത്തിലുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: יָלַד
  choice: ജനിപ്പിച്ചു
  rationale: പുരുഷൻ കർത്താവായ വംശാവലിസന്ദർഭത്തിൽ ഈ ക്രിയ മക്കളുടെ പിതാവാകുക/ജനിപ്പിക്കുക എന്ന അർഥത്തിലാണ്; ആ പിതൃവംശബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: צִידוֹן
  choice: സീദോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: בְּכֹר/וֹ
  choice: തന്റെ ആദ്യജാതനായ
  rationale: ‘അവന്റെ ആദ്യജാതൻ’ എന്ന ജനനക്രമസൂചന വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ കർത്താവിലേക്കുള്ള ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: חֵת
  choice: ഹേത്ത്
  rationale: ഇവിടെ ബഹുവചന ജനവിഭാഗനാമമല്ല, വംശാവലിയിലെ വ്യക്തിനാമമാണ്; അതിനാൽ ‘ഹിത്യർ’ എന്നു വ്യാഖ്യാനിക്കാതെ പേര് തന്നെയായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. എബ്രായത്തിലെ നേരിട്ടുള്ള കർമചിഹ്നങ്ങളായ אֶת പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല; ‘-എയും’ എന്ന മലയാളഘടനയിൽ അവയുടെ വാക്യബന്ധം പ്രകടമാകുന്നു.
