id: 1CH.1.16
reference: 1 Chronicles 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הָ/אַרְוָדִ֥י וְ/אֶת הַ/צְּמָרִ֖י וְ/אֶת הַֽ/חֲמָתִֽי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/016.yaml
  text: and the Arvadites[a], and the Zemarites, and the Hamathites.
translation:
  language: ml
  text: അർവാദ്യരും[a] സെമാര്യരും ഹമാത്യരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇവിടെയുള്ള എബ്രായ ജനവിഭാഗനാമങ്ങൾ വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും ജനങ്ങളെയോ വംശങ്ങളെയോ കൂട്ടമായി സൂചിപ്പിക്കുന്നു: അർവാദ്യൻ, സെമാര്യൻ, ഹമാത്യൻ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: -രും
  rationale: വംശാവലിപ്പട്ടികയിലെ ഇനങ്ങളെ ബന്ധിപ്പിക്കുന്ന וְ എന്ന സംയോജകത്തിന്റെ ശക്തി മലയാളത്തിൽ ഓരോ ജനനാമത്തോടും ചേർത്ത ‘-രും’കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; אֵת എന്ന കർമചിഹ്നത്തിന് ഇവിടെ വേറെ പരിഭാഷ ആവശ്യമില്ല.
- source_word: הָאַרְוָדִי
  choice: അർവാദ്യർ
  rationale: രൂപപരമായി ഏകവചനത്തിലുള്ള ജനവിഭാഗനാമമാണെങ്കിലും ഇവിടെ ഒരു ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിലെ ആദര/മനുഷ്യബഹുവചനരൂപം ഉപയോഗിച്ചു.
- source_word: הַצְּמָרִי
  choice: സെമാര്യർ
  rationale: ചുറ്റുമുള്ള ജനവിഭാഗനാമങ്ങളെപ്പോലെ ഇതും കൂട്ടാർഥമുള്ള ഏകവചനരൂപമാണ്. ‘സെമാര്യർ’ മൂലനാമത്തിന്റെ ശബ്ദരൂപവും ജനസമൂഹാർഥവും നിലനിർത്തുന്നു.
- source_word: הַחֲמָתִי
  choice: ഹമാത്യർ
  rationale: ഹമാത്തുമായി ബന്ധപ്പെട്ട ജനവിഭാഗത്തെയാണ് ഈ രൂപം സൂചിപ്പിക്കുന്നത്; ‘ഹമാത്യർ’ എന്ന ബഹുവചനരൂപം ആ കൂട്ടാർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്തതയും ഗൗരവവും നിലനിർത്തി. ആവർത്തിക്കുന്ന ‘-രും’ എബ്രായത്തിലെ അനുക്രമസംയോജനത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
