source:
  edition: WLC
  text: וְ/אֶת הַ/חִוִּ֥י וְ/אֶת הַֽ/עַרְקִ֖י וְ/אֶת הַ/סִּינִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/015.yaml
  text: and the Hivites[a], and the Arkites, and the Sinites.
translation:
  language: ml
  text: ഹിവ്യരും[a] അർക്ക്യരും സീന്യരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ഈ മൂന്നു ജനനാമങ്ങളും നിശ്ചയോപപദത്തോടുകൂടിയ ഏകവചനരൂപത്തിലാണ്—‘ഹിവ്യൻ,’ ‘അർക്ക്യൻ,’ ‘സീന്യൻ.’ എന്നാൽ ഈ വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ അവ ജനവിഭാഗങ്ങളെയോ കുലങ്ങളെയോ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനമായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: -ഉം
  rationale: וְ എന്ന സംയോജകം പട്ടികയിലെ ഓരോ ജനവിഭാഗത്തെയും ‘-ഉം’കൊണ്ട് ബന്ധിപ്പിക്കുന്നു. നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന אֶת-ന് ഇവിടെ സ്വാഭാവികമായ വേറിട്ട മലയാളപരിഭാഷ ആവശ്യമില്ല.
- source_word: הַחִוִּי
  choice: ഹിവ്യർ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ഏകവചന ജനനാമമാണെങ്കിലും വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ഒരു ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ ആദര/ബഹുവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: הָעַרְקִי
  choice: അർക്ക്യർ
  rationale: ഒരു സ്ഥലത്തെയോ കുലത്തെയോ ആധാരമാക്കിയ ജനനാമം; പട്ടികയിൽ ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘അർക്ക്യർ’ എന്നു നൽകി.
- source_word: הַסִּינִי
  choice: സീന്യർ
  rationale: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന നാമം. ചുറ്റുമുള്ള പേരുകളെപ്പോലെ കൂട്ടായ അർഥം വ്യക്തമാക്കാൻ ‘സീന്യർ’ എന്ന ബഹുവചനരൂപം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി-പട്ടികാശൈലി. എബ്രായത്തിലെ ആവർത്തിത സംയോജനം മലയാളത്തിലെ ‘-ഉം’ രൂപത്തിലൂടെ നിലനിർത്തി; ജനനാമങ്ങൾ കൂട്ടായ അർഥത്തിൽ സ്വാഭാവികമായ ബഹുവചനത്തിൽ നൽകി.
