lexical_decisions:
- source_word: וְאֶת
  choice: പട്ടികയിലെ വിരാമചിഹ്നങ്ങളും അവസാനത്തെ സംയോജനവും വഴി സൂചിപ്പിച്ചു
  rationale: וְ എന്ന സംയോജകവും אֶת എന്ന കർമസൂചകവും ഓരോ പേരിനുമുമ്പും വരുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ വംശാവലിപ്പട്ടികയിൽ കർമസൂചകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല; പേരുകളെ വിരാമചിഹ്നങ്ങളാൽ ബന്ധിപ്പിക്കുന്നത് മതിയാകും.
- source_word: עֵיבָל
  choice: ഏബാൽ
  rationale: മസോററ്റിക് എബ്രായരൂപമായ עֵיבָל-ന്റെ ശബ്ദലിപ്യന്തരണം. ഉല്പത്തി 10:28-ലെ സമാന്തര വംശാവലിയിൽ വ്യത്യസ്ത സ്വരരൂപം കാണുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲבִימָאֵל
  choice: അബീമായേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ശബ്ദലിപ്യന്തരണം; പേരിന്റെ അർഥം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: שְׁבָא
  choice: ശേബാ
  rationale: שְׁבָא എന്ന എബ്രായരൂപത്തിന്റെ ശബ്ദലിപ്യന്തരണം. ഇതേപോലെ തോന്നുന്ന മറ്റു പേരുകളിൽനിന്ന് വേർതിരിക്കാൻ ശിൻ വ്യഞ്ജനത്തെ ‘ശ’യായി നിലനിർത്തുന്നു.
