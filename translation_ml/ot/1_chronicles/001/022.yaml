translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പേരുപട്ടിക. മൂലപാഠത്തിൽ ഓരോ പേരിനുമുമ്പുമുള്ള ആവർത്തിത സംയോജകവും കർമസൂചകവും മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ പട്ടികാരീതിയിൽ അവതരിപ്പിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
