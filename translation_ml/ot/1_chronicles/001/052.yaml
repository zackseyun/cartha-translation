  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുലത്തലവൻ.”
    reason: אַലּוּף എന്ന പദം ഗോത്രത്തിന്റെയോ കുലത്തിന്റെയോ നേതാവിനെ സൂചിപ്പിക്കാം; ഈ പകരംവായന ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: אַלּוּף
  choice: ഗോത്രത്തലവൻ
  rationale: ഏദോമ്യ വംശാവലിപ്പട്ടികയിൽ ഈ പദം സൈനികാധിപനെക്കാൾ ഒരു ഗോത്രത്തിന്റെയോ കുലത്തിന്റെയോ തലവനെ സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന സ്ഥാനപ്പേരായി ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אָהֳלִיבָמָה
  choice: ഒഹൊലീബാമാ
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം നൽകി.
- source_word: אֵלָה
  choice: ഏലാ
  rationale: വ്യക്തി/കുലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായരൂപം ലിപ്യന്തരിച്ചു.
- source_word: פִּינֹן
  choice: പീനോൻ
  rationale: എബ്രായ വ്യഞ്ജന-സ്വരരൂപത്തെ അടിസ്ഥാനമാക്കി പേര് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
