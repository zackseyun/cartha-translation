translation_notes:
  register: ആധുനികവും മാന്യവുമായ പട്ടികാശൈലി. എബ്രായത്തിലെ ആവർത്തിക്കുന്ന אַלּוּף എന്ന സ്ഥാനപ്പേര് മലയാളത്തിലും ഓരോ പേരിനു മുമ്പും നിലനിർത്തി.
