source:
  edition: WLC
  text: בְּנֵ֖י אֱלִיפָ֑ז תֵּימָ֤ן וְ/אוֹמָר֙ צְפִ֣י וְ/גַעְתָּ֔ם קְנַ֖ז וְ/תִמְנָ֥ע וַ/עֲמָלֵֽק׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/036.yaml
  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
translation:
  language: ml
  text: 'എലീഫസിന്റെ പുത്രന്മാർ: തേമാൻ, ഓമാർ, സെഫി[a], ഗാതാം, കെനസ്, തിമ്നാ[b], അമാലേക്ക്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ സെഫി; ഉല്പത്തി 36:11-ൽ സെഫോ എന്ന വ്യത്യസ്ത രൂപമാണുള്ളത്.
    reason: textual_variant
  - marker: b
    text: ഉല്പത്തി 36:12 തിമ്നായെ എലീഫസിന്റെ ഉപഭാര്യയായും അമാലേക്കിനെ അവളുടെ മകനായും തിരിച്ചറിയിക്കുന്നു. എന്നാൽ ഇവിടെ ദിനവൃത്താന്തം ഈ രണ്ടു പേരുകളും എലീഫസിന്റെ പുത്രന്മാരുടെ പട്ടികയ്ക്കുള്ളിൽ നൽകുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בן എന്ന പദത്തിന്റെ construct ബഹുവചനമാണിത്; വംശാവലിപ്പട്ടികയെ പരിചയപ്പെടുത്തുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: אֱלִיפָז
  choice: എലീഫസ്
  rationale: വ്യക്തിനാമം; മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: תֵּימָן
  choice: തേമാൻ
  rationale: വംശാവലിയിലെ വ്യക്തിനാമം; ഹീബ്രു രൂപത്തിന് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: אוֹמָר
  choice: ഓമാർ
  rationale: വ്യക്തിനാമം നേരിട്ട് ലിപ്യന്തരണം ചെയ്തു.
- source_word: צְפִי
  choice: സെഫി
  rationale: ദിനവൃത്താന്തത്തിലെ צְפִי എന്ന പ്രത്യേക രൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; ഉല്പത്തി 36:11-ലെ വ്യത്യസ്ത രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: גַעְתָּם
  choice: ഗാത്താം
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണഘടനയെ അനുസരിച്ച് ലിപ്യന്തരണം ചെയ്തു.
- source_word: קְנַז
  choice: കെനസ്
  rationale: വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: תִמְנָע
  choice: തിമ്നാ
  rationale: ഈ വാക്യത്തിലെ സ്വരചിഹ്നിത ഹീബ്രു രൂപത്തെ പ്രതിഫലിപ്പിക്കുന്ന വ്യക്തിനാമം.
- source_word: עֲמָלֵק
  choice: അമാലേക്ക്
  rationale: വ്യക്തിയെയും പിന്നീട് അറിയപ്പെടുന്ന ജനവിഭാഗത്തിന്റെ പൂർവികനെയും സൂചിപ്പിക്കുന്ന പേര് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ / וַ
  choice: കോമകളാൽ വേർതിരിച്ച പട്ടിക
  rationale: ഹീബ്രുവിൽ പേരുകൾക്ക് മുമ്പിൽ സംയോജകങ്ങൾ ആവർത്തിക്കുന്നുണ്ടെങ്കിലും, സ്വാഭാവികമായ ആധുനിക മലയാള വംശാവലിശൈലിക്കായി കോമകൾ ഉപയോഗിച്ചു; പട്ടികയുടെ ബന്ധം വ്യക്തമായി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ഉല്പത്തി 36-നോടു താരതമ്യം ചെയ്യുമ്പോൾ തിമ്നായുടെയും അമാലേക്കിന്റെയും വംശാവലിബന്ധം
  choice: ദിനവൃത്താന്തത്തിലെ നേരിട്ടുള്ള വ്യാകരണഘടന പിന്തുടർന്ന് തിമ്നായെയും അമാലേക്കിനെയും എലീഫസിന്റെ പുത്രന്മാരുടെ പട്ടികയിൽ ഉൾപ്പെടുത്തി.
  alternative: ഉല്പത്തി 36:12 അനുസരിച്ച് തിമ്നായെ എലീഫസിന്റെ വെപ്പാട്ടിയായും അമാലേക്കിനെ അവളുടെ മകനായും വ്യക്തമാക്കി പാഠങ്ങളെ സമന്വയിപ്പിക്കുക.
  rationale: ഹീബ്രു പാഠം ‘എലീഫസിന്റെ പുത്രന്മാർ’ എന്ന തലക്കെട്ടിനു കീഴിൽ എല്ലാ പേരുകളും ഒരൊറ്റ പട്ടികയായി നൽകുന്നു. ഉല്പത്തിയിലെ വിവരമുപയോഗിച്ച് പ്രധാനപാഠം തിരുത്താതെ, രണ്ടു പാഠങ്ങൾക്കിടയിലെ സംഘർഷം അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. പേരുകൾ ഹീബ്രു രൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കവും main-text marker-ുകളുടെ സ്ഥാനവും പരസ്പരം മാറിയിരുന്നതിനാൽ, സെഫിയോടു textual-variant അടിക്കുറിപ്പും തിമ്നായോടു cross-reference അടിക്കുറിപ്പും യുക്തിയായി ചേർത്തു.
