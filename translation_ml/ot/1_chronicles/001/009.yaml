  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַ/חֲוִילָ֔ה וְ/סַבְתָּ֥א וְ/רַעְמָ֖א וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖א שְׁבָ֥א וּ/דְדָֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/009.yaml
  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
translation:
  language: ml
  text: 'കൂശിന്റെ പുത്രന്മാർ: സെബാ, ഹവീലാ, സബ്താ[a], രഅമാ[b], സബ്തെഖാ[c]. രഅമായുടെ പുത്രന്മാർ: ശെബാ, ദെദാൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പേര് പരമ്പരാഗതമായി “സബ്താഹ്” എന്നും എഴുതാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഈ പേര് പരമ്പരാഗതമായി “രാമാഹ്” എന്നും എഴുതാറുണ്ട്. “രാമാ” എന്ന രൂപം വേറിട്ട ഹീബ്രു നാമമായ “രാമാഹ്” എന്നതുമായി ആശയക്കുഴപ്പം ഉണ്ടാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ഈ പേര് പരമ്പരാഗതമായി “സബ്തെഖാഹ്” എന്നും എഴുതാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כוּשׁ
  choice: കൂശിന്റെ പുത്രന്മാർ
  rationale: בְּנֵי എന്ന വംശാവലിസൂത്രത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു. പട്ടികയുടെ ആരംഭത്തിൽ വാവ് പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്താതെ, മലയാളത്തിൽ സ്വാഭാവികമായ തലക്കെട്ടുരൂപം ഉപയോഗിച്ചു.
- source_word: סְבָא
  choice: സെബാ
  rationale: വംശാവലിയിലെ വ്യക്തിനാമം; ഹീബ്രു സ്വരീകരണത്തോട് ചേർന്ന ലിപ്യന്തരണം.
- source_word: חֲוִילָה
  choice: ഹവീലാ
  rationale: വ്യക്തിനാമം നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: סַבְתָּא
  choice: സബ്താ
  rationale: ഹീബ്രു നാമത്തിന്റെ സ്വരരൂപം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം; പരമ്പരാഗതമായ അന്തിമ ‘ഹ്’ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: רַעְמָא
  choice: രാമാ
  rationale: മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ നാമരൂപം തിരഞ്ഞെടുത്തു; ഹീബ്രുവിലെ മധ്യവ്യഞ്ജനം ലളിതമായ ലിപ്യന്തരണത്തിൽ പ്രകടമാകാത്തതിനാൽ കൂടുതൽ അക്ഷരനിഷ്ഠമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: סַבְתְּכָא
  choice: സബ്തെക്കാ
  rationale: ഹീബ്രു വ്യഞ്ജനങ്ങളെയും സ്വരക്രമത്തെയും പിന്തുടരുന്ന ലിപ്യന്തരണം; പരമ്പരാഗത അന്തിമ ‘ഹ്’ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וּבְנֵי רַעְמָא
  choice: രാമായുടെ പുത്രന്മാർ
  rationale: വംശാവലിക്കുള്ളിലെ പുതിയ ഉപശാഖയെ വേറൊരു വാക്യമായി വ്യക്തമാക്കി; ‘പുത്രന്മാർ’ എന്ന സൂത്രഭാഷ സ്ഥിരമായി നിലനിർത്തി.
- source_word: שְׁבָא
  choice: ശെബാ
  rationale: ശീൻ വ്യഞ്ജനവും ഹീബ്രു സ്വരീകരണവും പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: דְדָן
  choice: ദെദാൻ
  rationale: വാചകത്തിൽ ഉള്ള വ്യക്തിനാമം മാത്രം ലിപ്യന്തരിച്ചു; ‘വംശം’ തുടങ്ങിയ വിശദീകരണം ചേർത്തില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. പേരുകൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; മലയാളത്തിൽ പ്രസക്തമായിടത്ത് പരമ്പരാഗത രൂപങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
