  text: וַ/יָּ֨מָת֙ בַּ֣עַל חָנָ֔ן וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ד וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עִי וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
translation:
  language: ml
  text: ബാൽ-ഹാനാൻ മരിച്ചു; അവനു പകരം ഹദദ് രാജാവായി. അവന്റെ പട്ടണത്തിന്റെ പേര് പായി[a] എന്നായിരുന്നു. അവന്റെ ഭാര്യയുടെ പേര് മെഹേതബേൽ എന്നായിരുന്നു; അവൾ മത്രേദിന്റെ മകൾ, മേസാഹാബിന്റെ മകൾ[b] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഉല്പത്തി 36:39-ൽ പട്ടണത്തിന്റെ പേര് ‘പാവു’ എന്നാണ്; ദിനവൃത്താന്തങ്ങളിലെ എബ്രായപാഠം ‘പായി’ എന്നാണ് വായിക്കുന്നത്.
    reason: textual_variant
  - marker: b
    text: വംശാവലിപ്രയോഗത്തിൽ ആവർത്തിച്ചിരിക്കുന്ന ‘മകൾ’ എന്ന പദം ‘മത്രേദിന്റെ മകളും മേസാഹാബിന്റെ കൊച്ചുമകളും’ എന്ന ബന്ധത്തെ സൂചിപ്പിക്കാം; എന്നാൽ എബ്രായപാഠത്തിലെ ആവർത്തനം മുഖ്യപാഠത്തിൽ അക്ഷരാർഥത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת בַּעַל חָנָן
  choice: ബാൽ-ഹാനാൻ മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ ലളിതമായ വിവരണാർഥം ‘മരിച്ചു’ എന്നു നൽകി; വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו הֲדַד
  choice: അവനു പകരം ഹദദ് രാജാവായി
  rationale: מלך ഇവിടെ രാജാവായി അധികാരമേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; תחתיוയിലെ സ്ഥാനാവകാശക്രമം ‘അവനു പകരം’ എന്നു നിലനിർത്തി.
- source_word: וְשֵׁם עִירוֹ פָּעִי
  choice: അവന്റെ പട്ടണത്തിന്റെ പേര് പായി എന്നായിരുന്നു
  rationale: ക്രിയയില്ലാത്ത എബ്രായ നാമകരണവാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്നായിരുന്നു’ എന്നു നൽകി. ദിനവൃത്താന്തങ്ങളിലെ פָּעִי എന്ന പാഠരൂപം ‘പായി’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: അവന്റെ ഭാര്യയുടെ പേര് … മെഹേതബേൽ എന്നായിരുന്നു
  rationale: എബ്രായ നാമകരണസൂത്രം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിച്ചു; വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: “മത്രേദിന്റെ മകൾ, മേസാഹാബിന്റെ മകൾ” ആയ
  rationale: ബַּת എന്നതിന്റെ ആവർത്തനം വ്യാഖ്യാനിച്ച് ‘കൊച്ചുമകൾ’ എന്നു മാറ്റാതെ കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തി; ബന്ധക്രമത്തിലെ സാധ്യതയുള്ള അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. രാജാവിന്റെ സ്ഥാനാവകാശക്രമം സ്വാഭാവികമായി അവതരിപ്പിച്ചപ്പോൾ, വംശബന്ധത്തിലെ എബ്രായപാഠത്തിന്റെ യഥാർഥ അസ്പഷ്ടത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
