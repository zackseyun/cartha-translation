lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ בְּנֵי എന്ന സംയുക്ത ബഹുവചനരൂപത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ. തുടക്കത്തിലെ וּ- വേറിട്ട് ‘കൂടാതെ’ എന്നു ചേർക്കാതെ വാക്യബന്ധത്തിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לוֹטָן
  choice: ലോത്താൻ / ലോത്താന്റെ
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു; സംയുക്തബന്ധം മലയാളത്തിലെ ഉടമസ്ഥപ്രത്യയംകൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: חֹרִי
  choice: ഹോരി
  rationale: ഇവിടെ വംശാവലിയിലെ വ്യക്തിനാമമായതിനാൽ ജനവിഭാഗനാമമായി വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְהוֹמָם
  choice: ഹോമാമും
  rationale: മസോററ്റിക് പാഠത്തിലെ הוֹמָם എന്ന രൂപം പിന്തുടർന്ന് ലിപ്യന്തരണം ചെയ്തു; ഉല്പത്തി 36:22-ലെ വ്യത്യസ്ത രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וַאֲחוֹת לוֹטָן
  choice: ലോത്താന്റെ സഹോദരി
  rationale: אֲחוֹת എന്നത് ‘സഹോദരി’ എന്നാണ്; എബ്രായ നാമവാക്യത്തിൽ പ്രകടമല്ലാത്ത ബന്ധകക്രിയ മലയാളത്തിൽ ‘ആയിരുന്നു’ എന്നു സ്വാഭാവികമായി ചേർത്തു.
- source_word: תִּמְנָע
  choice: തിമ്നാ
  rationale: ഈ വാക്യത്തിലെ വ്യഞ്ജനപാഠത്തെയും സ്വരചിഹ്നങ്ങളെയും അടുത്ത് പിന്തുടരുന്ന വ്യക്തിനാമ ലിപ്യന്തരണം.
