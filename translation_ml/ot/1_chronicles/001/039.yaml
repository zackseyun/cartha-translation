translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിയുടെ ചുരുക്കശൈലി നിലനിർത്തിയിരിക്കുന്നു; യഥാർത്ഥ പാഠത്തിലെ പേരുരൂപം മുഖ്യവാചകത്തിലും സമാന്തര ഭാഗത്തിലെ വ്യത്യാസം അടിക്കുറിപ്പിലും നൽകിയിരിക്കുന്നു.
