source:
  edition: WLC
  text: בְּנֵ֖י רְעוּאֵ֑ל נַ֥חַת זֶ֖רַח שַׁמָּ֥ה וּ/מִזָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/037.yaml
  text: 'The sons of Reuel: Nahath, Zerah, Shammah, and Mizzah.'
translation:
  language: ml
  text: 'രെയൂവേലിന്റെ പുത്രന്മാർ: നഹത്ത്, സേരഹ്, ശമ്മാ, മിസ്സാ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയിൽ ഉടനെയുള്ള ആൺമക്കളെ പരിചയപ്പെടുത്തുന്ന בֵּן എന്ന പദത്തിന്റെ ബഹുവചന നിർമിതരൂപമാണ്; അതിനാൽ നേരിട്ടും സ്വാഭാവികവുമായി ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: רְעוּאֵל
  choice: രെയൂവേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: נַחַת
  choice: നഹത്ത്
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: זֶרַח
  choice: സേരഹ്
  rationale: ഈ പദത്തിന് സാധാരണനാമമായി ‘ഉദയം’ തുടങ്ങിയ അർഥങ്ങൾ ഉണ്ടെങ്കിലും ഇവിടെ വ്യക്തിനാമമായതിനാൽ ലിപ്യന്തരിച്ചു.
- source_word: שַׁמָּה
  choice: ശമ്മാ
  rationale: ദാഗേഷ് സൂചിപ്പിക്കുന്ന വ്യഞ്ജനദ്വിത്വം നിലനിർത്തി വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וּ/מִזָּה
  choice: മിസ്സാ
  rationale: וּ എന്ന സംയോജകത്തിന്റെ പട്ടികയിലെ അർഥം മലയാള വിരാമചിഹ്നക്രമത്തിൽ പ്രകടമാണ്; מִזָּה എന്ന വ്യക്തിനാമത്തിലെ വ്യഞ്ജനദ്വിത്വം നിലനിർത്തി ‘മിസ്സാ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. പേരുകൾ മൂല എബ്രായരൂപത്തെ മുൻനിർത്തി ലിപ്യന്തരിച്ചു; പട്ടികയിൽ അവസാനത്തെ ‘ഉം/കൂടാതെ’ എന്ന ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാശൈലിയും വിരാമചിഹ്നവുംകൊണ്ട് സൂചിപ്പിച്ചു.
