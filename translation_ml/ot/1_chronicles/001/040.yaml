id: 1CH.1.40
reference: 1 Chronicles 1:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֣י שׁוֹבָ֔ל עַלְיָ֧ן וּ/מָנַ֛חַת וְ/עֵיבָ֖ל שְׁפִ֣י וְ/אוֹנָ֑ם וּ/בְנֵ֥י צִבְע֖וֹן אַיָּ֥ה וַ/עֲנָֽהס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/040.yaml
  text: 'The sons of Shobal: Alian[a], Manahath, Ebal, Shephi, and Onam[b]. And the sons of Zibeon: Aiah and Anah.'
translation:
  language: ml
  text: 'ശോബാലിന്റെ പുത്രന്മാർ: അൽയാൻ[a], മാനഹത്ത്, ഏബാൽ, ശെഫി[b], ഓനാം. സിബെയോന്റെ പുത്രന്മാർ: അയ്യാ, അനാ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പാഠത്തിൽ ‘അൽയാൻ’; ഉല്പത്തി 36:23-ലെ സമാന്തര വംശാവലിയിൽ ‘അൽവാൻ’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: ദിനവൃത്താന്തങ്ങളിലെ പാഠത്തിൽ ‘ശെഫി’; ഉല്പത്തി 36:23-ലെ സമാന്തര വംശാവലിയിൽ ‘ശെഫോ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടികയിൽ ഈ പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘പുത്രന്മാർ’ എന്നാണ്; ഇവിടെ പേരെടുത്തുപറയുന്ന മക്കളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: שׁוֹבָל
  choice: ശോബാൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: עַלְיָן
  choice: അൽയാൻ
  rationale: ദിനവൃത്താന്തങ്ങളിലെ എബ്രായ രൂപം നേരിട്ട് ലിപ്യന്തരിച്ചു; ഉല്പത്തി 36:23-ലെ സമാന്തര വംശാവലിയിൽ വ്യത്യസ്ത രൂപമുണ്ട്.
- source_word: מָנַחַת
  choice: മാനഹത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: עֵיבָל
  choice: ഏബാൽ
  rationale: ഈ വാക്യത്തിലെ എബ്രായ രൂപത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: שְׁפִי
  choice: ശെഫി
  rationale: ദിനവൃത്താന്തങ്ങളിലെ രൂപം അതേപടി പ്രതിനിധീകരിക്കുന്നു; സമാന്തര വംശാവലിയിലെ ‘ശെഫോ’ എന്ന രൂപത്തിലേക്ക് ഒത്തുചേർത്തിട്ടില്ല.
- source_word: אוֹנָם
  choice: ഓനാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: צִבְעוֹן
  choice: സിബെയോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: אַיָּה
  choice: അയ്യാ
  rationale: എബ്രായ നാമത്തിലെ ഇരട്ട വ്യഞ്ജനശബ്ദം പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: עֲנָה
  choice: അനാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: וְ / וּ / וַ
  choice: പട്ടികയിലെ വിരാമചിഹ്നങ്ങളും വാക്യക്രമവും
  rationale: എബ്രായ സംയോജകങ്ങൾ പേരുകളും രണ്ടു വംശാവലി ഘടകങ്ങളും ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ പട്ടികയ്ക്കുള്ളിലെ കോമകളും പുതിയ വാക്യവും ഇതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തിത സംയോജകങ്ങളെ യാന്ത്രികമായി പകർത്താതെ മലയാള പട്ടികാശൈലി സ്വീകരിച്ചു. പാഠഭേദസൂചനകൾ ബന്ധപ്പെട്ട പേരുകൾക്കു പിന്നാലെ ചേർത്തു.
