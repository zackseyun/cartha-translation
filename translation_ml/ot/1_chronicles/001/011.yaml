translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി ഉപയോഗിച്ചു. ജനവിഭാഗനാമങ്ങൾ വായനാസൗകര്യത്തിനായി ‘-ീയർ’ രൂപത്തിൽ നൽകി; മൂലഭാഷയോട് കൂടുതൽ അടുത്ത രൂപങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
