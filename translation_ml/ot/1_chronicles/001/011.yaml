  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִצְרַ֡יִם יָלַ֞ד אֶת לודיים וְ/אֶת עֲנָמִ֛ים וְ/אֶת לְהָבִ֖ים וְ/אֶת נַפְתֻּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/011.yaml
  text: Mizraim fathered the Ludites[a], the Anamites, the Lehabites, and the Naphtuhites.
translation:
  language: ml
  text: മിസ്രയീം ലൂദീയരെയും[a] അനാമീയരെയും ലെഹാബീയരെയും നഫ്തൂഹീയരെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്താൽ: “ലൂദീം, അനാമീം, ലെഹാബീം, നഫ്തൂഹീം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: മിസ്രയീം
  rationale: വംശാവലിയിൽ വ്യക്തിനാമമായി വരുന്നതിനാൽ ‘ഈജിപ്ത്’ എന്നു സ്ഥലനാമമായി പരിഭാഷപ്പെടുത്താതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: יָלַד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ജനനവും വംശോത്ഭവവും സൂചിപ്പിക്കുന്ന ക്രിയ; എബ്രായത്തിലെ സജീവവും പുരുഷകേന്ദ്രിതവുമായ വാക്യഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിലെ ‘-യെ/-രെ’ കർമപ്രത്യയങ്ങളിലൂടെ അതിന്റെ ധർമ്മം പ്രകടമാക്കിയിരിക്കുന്നു.
- source_word: לודיים
  choice: ലൂദീയർ
  rationale: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പേരായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന ജനനാമരൂപം ഉപയോഗിച്ചു; കൂടുതൽ നേരിട്ടുള്ള ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: עֲנָמִים
  choice: അനാമീയർ
  rationale: പട്ടികയിലെ സമാന്തര ജനവിഭാഗനാമങ്ങളോട് യോജിക്കുന്ന സ്വാഭാവിക മലയാള ജനനാമരൂപം.
- source_word: לְהָבִים
  choice: ലെഹാബീയർ
  rationale: എബ്രായ ജനവിഭാഗനാമം മലയാളത്തിൽ വായനാസൗകര്യമുള്ള ബഹുവചനരൂപത്തിൽ നൽകി.
- source_word: נַפְתֻּחִים
  choice: നഫ്തൂഹീയർ
  rationale: പട്ടികയിലെ മറ്റു പേരുകളോട് സമാന്തരമായി സ്വാഭാവിക മലയാള ജനനാമരൂപം സ്വീകരിച്ചു.
