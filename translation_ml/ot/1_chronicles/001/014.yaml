  text: the Jebusites[a], the Amorites, and the Girgashites.
translation:
  language: ml
  text: യെബൂസ്യരെയും അമോര്യരെയും ഗിർഗ്ഗശ്യരെയും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: യെബൂസ്യർ
  rationale: എബ്രായത്തിൽ രൂപം ഏകവചന ജാതിനാമമാണെങ്കിലും വംശാവലിപ്പട്ടികയിൽ ഒരു ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന ജനനാമം ഉപയോഗിച്ചു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യർ
  rationale: ചുറ്റുമുള്ള ജാതിനാമങ്ങളെപ്പോലെ ഇതും രൂപത്തിൽ ഏകവചനമാണെങ്കിലും ഒരു ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാള പട്ടികാശൈലിക്ക് യോജിച്ച ബഹുവചനരൂപം സ്വീകരിച്ചു.
- source_word: הַגִּרְגָּשִׁי
  choice: ഗിർഗാശ്യർ
  rationale: വംശാവലിയിൽ കൂട്ടമായ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ബഹുവചന ജനനാമമായി വിവർത്തനം ചെയ്തു.
- source_word: וְאֶת / וְאֵת
  choice: എന്നിവരെയും
  rationale: וְ എന്ന സംയോജകവും אֵת എന്ന കർമസൂചകവും പട്ടികയിലെ ഓരോ ഘടകത്തെയും മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി അവസാനത്തെ ‘എന്നിവരെയും’ എന്ന രൂപത്തിലൂടെ സംയോജനവും കർമബന്ധവും സ്വാഭാവികമായി അറിയിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി-പട്ടികാശൈലി. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ അവസാനം ‘എന്നിവരെയും’ നിലനിർത്തി.
