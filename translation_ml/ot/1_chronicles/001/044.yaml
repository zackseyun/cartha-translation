id: 1CH.1.44
reference: 1 Chronicles 1:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֖מָת בָּ֑לַע וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו יוֹבָ֥ב בֶּן זֶ֖רַח מִ/בָּצְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/044.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: ml
  text: ബേല മരിച്ചു; അവന്റെ സ്ഥാനത്ത് ബൊസ്രായിൽനിന്നുള്ള സേരഹിന്റെ മകൻ യോബാബ് രാജാവായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബൊസ്രായിലെ.” ഹീബ്രു ഉപസർഗം ആ നഗരത്തിൽനിന്നുള്ള ഉത്ഭവത്തെയോ ആ നഗരവുമായുള്ള ബന്ധത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מוּת എന്ന ക്രിയയുടെ വയ്യിഖ്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ തുടക്കത്തിലെ വַ-യെ പ്രത്യേകം ‘പിന്നെ’ എന്നു പരിഭാഷപ്പെടുത്താതെ സംഭവക്രമം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: בָּלַע
  choice: ബേല
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവികമായ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: ഈ രാജവംശാനുക്രമസൂത്രത്തിൽ מלך എന്ന ക്രിയ അധികാരാരോഹണത്തെ സൂചിപ്പിക്കുന്നു; ‘രാജാവായി’ എന്നത് സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: תַּחְתָּיו
  choice: അവന്റെ സ്ഥാനത്ത്
  rationale: മുൻഗാമിയുടെ സ്ഥാനം ഏറ്റെടുക്കുന്നതിനെ വ്യക്തമാക്കുന്ന ഔപചാരികവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: יוֹבָב
  choice: യോബാബ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן זֶרַח
  choice: സേരഹിന്റെ മകൻ
  rationale: ഹീബ്രു പിതൃനാമഘടനയെ മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥവിഭക്തിക്രമത്തിൽ സുതാര്യമായി നൽകുന്നു.
- source_word: מִבָּצְרָה
  choice: ബൊസ്രായിൽനിന്നുള്ള
  rationale: മִן ഉപസർഗത്തിന്റെ പ്രാഥമികമായ ഉത്ഭവസ്ഥലാർഥം നിലനിർത്തുന്നു; നഗരവുമായുള്ള ബന്ധം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
