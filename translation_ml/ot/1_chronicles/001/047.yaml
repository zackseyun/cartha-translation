translation_notes:
  register: രാജവംശപ്പട്ടികയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തിക്കൊണ്ട്, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പുസൂചകം ‘മരിച്ചു’ എന്നതിനു ശേഷമാണെങ്കിലും അതിന്റെ ഉള്ളടക്കം תַּחְתָּיו എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ, മലയാളത്തിൽ സൂചകം ബന്ധപ്പെട്ട ‘അവനു പകരം’ എന്ന വാക്കിനോടു ചേർത്തു.
