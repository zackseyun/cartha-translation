id: 1CH.1.8
reference: 1 Chronicles 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֖י חָ֑ם כּ֥וּשׁ וּ/מִצְרַ֖יִם פּ֥וּט וּ/כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/008.yaml
  text: 'The sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: ml
  text: 'ഹാമിന്റെ പുത്രന്മാർ[a]: കൂശ്, മിസ്രയീം[b], പൂത്ത്, കനാൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഹാമിന്റെ സന്തതികൾ.’ വംശാവലികളിൽ ‘പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗം നേരിട്ടുള്ള പുത്രന്മാരെയോ പിന്നീടുള്ള തലമുറകളിലെ സന്തതികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം ‘മിസ്രയീം’; ഇത് പരമ്പരാഗതമായി ഈജിപ്തുമായി ബന്ധപ്പെടുത്തി മനസ്സിലാക്കപ്പെടുന്നു. ഇവിടെ കൂശ്, പൂത്ത്, കനാൻ എന്നീ പേരുകൾക്കൊപ്പം വംശാവലിപ്പട്ടികയിൽ ഒരു നാമമായി വരുന്നതിനാൽ ലിപ്യന്തരരൂപം നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ നിർമിത ബഹുവചനരൂപം. വംശാവലിയിൽ ഇത് നേരിട്ടുള്ള പുത്രന്മാരെയോ വിശാലമായ സന്തതിവഴിയെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ പരമ്പരാഗതവും സ്വാഭാവികവുമായ ‘പുത്രന്മാർ’ നിലനിർത്തി വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: חָם
  choice: ഹാം
  rationale: വ്യക്തിനാമം; ആധുനിക മലയാളത്തിൽ പരിചിതമായ ബൈബിൾ നാമരൂപം നിലനിർത്തുന്നു.
- source_word: כּוּשׁ
  choice: കൂശ്
  rationale: വ്യക്തിയെയും അയാളിൽനിന്നുള്ള ജനതയെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കാവുന്ന പേരാണെങ്കിലും, ഇവിടെ വംശാവലിപ്പട്ടികയിലെ നാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מִצְרַיִם
  choice: മിസ്രയീം
  rationale: സാധാരണ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ ‘ഈജിപ്ത്’ എന്ന് പരിഭാഷപ്പെടുത്താവുന്നതാണ്; എന്നാൽ ഇവിടെ മറ്റു വംശനാമങ്ങൾക്കൊപ്പം പൂർവികനാമമായി വരുന്നതിനാൽ എബ്രായ നാമരൂപം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: פּוּט
  choice: പൂത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരരൂപം.
- source_word: כְנָעַן
  choice: കനാൻ
  rationale: വംശാവലിയിൽ പൂർവികനാമമായി വരുന്ന എബ്രായ നാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം.
