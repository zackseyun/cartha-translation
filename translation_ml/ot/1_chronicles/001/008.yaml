  register: ലളിതവും ഗൗരവമുള്ളതുമായ ആധുനിക നിലവാരമലയാളം ഉപയോഗിച്ചു. പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളിൽ നൽകി; വംശാവലിസൂത്രത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
