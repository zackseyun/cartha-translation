  rationale: എബ്രായ പാഠത്തിൽ הוּא എന്ന സർവനാമം രണ്ടു വ്യക്തിനാമങ്ങളെ ബന്ധിപ്പിക്കുന്നു. ‘അതായത്’ എന്ന പ്രയോഗം പേരുമാറ്റത്തിന്റെ ചരിത്രം ഇവിടെ വിശദീകരിക്കാതെതന്നെ, രണ്ടുപേരും ഒരേ വ്യക്തിയുടേതാണെന്ന വാക്യത്തിന്റെ നേരായ ധർമ്മം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ചുരുക്കവും ഗൗരവവുമുള്ള വംശാവലി ശൈലി. പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു; ഉറവിടത്തിലെ തിരിച്ചറിയിക്കൽ പ്രയോഗത്തിന്റെ കൂടുതൽ ഔപചാരിക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
