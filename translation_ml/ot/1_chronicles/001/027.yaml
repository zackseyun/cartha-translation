  rationale: വ്യക്തിനാമം; മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു. അബ്രാം എന്ന വ്യക്തി അബ്രാഹാം തന്നെയാണെന്ന് വാക്യം തിരിച്ചറിയിക്കുന്നു.
theological_decisions:
- issue: വംശാവലിയുടെ പശ്ചാത്തലത്തിലുള്ള ക്രിയാരഹിത തിരിച്ചറിയിക്കൽ പ്രയോഗം
  choice: അബ്രാം—അതായത്, അബ്രാഹാം.
