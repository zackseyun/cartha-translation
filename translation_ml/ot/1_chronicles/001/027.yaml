- source_word: הוּא
  choice: അതായത്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ അക്ഷരാർഥം ‘അവൻ’ എന്നാണെങ്കിലും, ഇവിടെ രണ്ടു പേരുകളെ തിരിച്ചറിയിക്കുന്ന ക്രിയാരഹിത നാമവാക്യത്തിൽ ‘അതായത്’ എന്നത് സ്വാഭാവികമായി അതിന്റെ വിശദീകരണധർമ്മം പ്രകടമാക്കുന്നു. കൂടുതൽ ഔപചാരികമായ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אַבְרָהָם
