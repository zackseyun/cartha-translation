id: 1CH.1.35
reference: 1 Chronicles 1:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֖י עֵשָׂ֑ו אֱלִיפַ֛ז רְעוּאֵ֥ל וִ/יע֖וּשׁ וְ/יַעְלָ֥ם וְ/קֹֽרַח׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/035.yaml
  text: 'The sons of Esau: Eliphaz[a], Reuel, Jeush, Jalam, and Korah.'
translation:
  language: ml
  text: 'ഏശാവിന്റെ പുത്രന്മാർ: എലീഫസ്, രെയൂവേൽ[a], യെയൂശ്, യാലാം, കോരഹ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില ലിപ്യന്തരണപാരമ്പര്യങ്ങളിൽ ഈ പേര് ‘രഗൂവേൽ’ എന്നും എഴുതിയിട്ടുണ്ട്. അത് മറ്റൊരു പേരല്ല; ഒരേ എബ്രായനാമം മറ്റൊരു വഴിയിലൂടെ ലിപ്യന്തരം ചെയ്ത രൂപമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ നിർമിത ബഹുവചനരൂപമാണിത്; ഇവിടെ നേരിട്ടുള്ള വംശാവലിപ്പട്ടിക അവതരിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്നതാണ് സ്വാഭാവികവും കൃത്യവും.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אֱלִיפַז
  choice: എലീഫസ്
  rationale: എബ്രായ വ്യക്തിനാമത്തോട് ചേർന്നുനിൽക്കുന്നതും മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവുമായ ലിപ്യന്തരണം.
- source_word: רְעוּאֵל
  choice: രെയൂവേൽ
  rationale: എബ്രായ നാമത്തിന്റെ അക്ഷരഘടനയും ഉച്ചാരണവും മലയാളത്തിൽ വ്യക്തമായി പ്രതിനിധീകരിക്കുന്ന രൂപം.
- source_word: וִיעוּשׁ
  choice: യെയൂശ്
  rationale: ആദ്യത്തെ וְ സംയോജകത്തെ പേരിന്റെ ഭാഗമാക്കാതെ, יְעוּשׁ എന്ന വ്യക്തിനാമത്തെ എബ്രായരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְיַעְלָם
  choice: യാലാം
  rationale: സംയോജകമായ וְ വേർതിരിച്ച്, יַעְלָם എന്ന പേരിന്റെ മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וְקֹרַח
  choice: കോരഹ്
  rationale: അവസാന പേരിനു മുമ്പുള്ള וְ പട്ടികയിലെ ‘ഉം/കൂടാതെ’ എന്ന ബന്ധം വഹിക്കുന്നു; മലയാളത്തിലെ കോമാപട്ടികയിൽ അത് സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ പേര് ‘കോരഹ്’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിയുടെ സംക്ഷിപ്ത പട്ടികാശൈലി നിലനിർത്തി. വ്യക്തിനാമങ്ങൾ എബ്രായരൂപത്തെ മുൻനിർത്തിയും മലയാളവായനയ്ക്ക് സ്വാഭാവികമായും ലിപ്യന്തരിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] അടയാളം ‘Eliphaz’ എന്ന പേരിനു ശേഷമാണെങ്കിലും അടിക്കുറിപ്പ് ‘Reuel’ എന്ന പേരിനെക്കുറിച്ചായതിനാൽ, അർത്ഥപരമായി ശരിയായ സ്ഥാനമായ ‘രെയൂവേൽ’ എന്നതിന് ശേഷമാണ് അടയാളം നൽകിയിരിക്കുന്നത്.
