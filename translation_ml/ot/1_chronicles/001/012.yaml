id: 1CH.1.12
reference: 1 Chronicles 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: ml
  text: പത്രൂസ്യരെയും കസ്ലൂഹ്യരെയും—അവിടെനിന്ന് ഫെലിസ്ത്യർ പുറപ്പെട്ടു[a]—കഫ്തോര്യരെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അവിടെനിന്ന് ഫെലിസ്ത്യർ പുറപ്പെട്ടു.” ദിനവൃത്താന്തത്തിലെ എബ്രായ വാക്യക്രമം ഈ വാക്കുകളെ ഏറ്റവും സ്വാഭാവികമായി കസ്ലൂഹ്യരോടാണ് ബന്ധിപ്പിക്കുന്നത്. ഉല്പത്തി 10:14-ലും ഇതേ വാക്കുകളാണുള്ളത്; എന്നാൽ ആമോസ് 9:7; യിരെമ്യാവ് 47:4 എന്നിവ ഫെലിസ്ത്യരെ കഫ്തോരുമായി ബന്ധിപ്പിക്കുന്നു.'
    reason: മൂലപാഠത്തിലെ സ്ഥലസൂചനയും ബന്ധവാക്യത്തിന്റെ മുൻപദത്തെക്കുറിച്ചുള്ള പാഠപരവും അന്തർപാഠപരവുമായ സമ്മർദവും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: പത്രൂസ്യർ
  rationale: പത്രോസ് എന്ന സ്ഥലനാമത്തിൽനിന്നുള്ള ജനവിഭാഗനാമം; അർഥം അനുമാനിക്കാതെ എബ്രായരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: כַּסְלֻחִים
  choice: കസ്ലൂഹ്യർ
  rationale: കൃത്യമായ ചരിത്രപരമായ സൂചന അനിശ്ചിതമായ ജനവിഭാഗനാമമായതിനാൽ ലിപ്യന്തരിച്ചു.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: അവരിൽനിന്നാണ് ... ഉത്ഭവിച്ചത്
  rationale: അക്ഷരാർഥം ‘അവിടെനിന്ന് പുറപ്പെട്ടവർ’ എന്നാണ്; വംശാവലിയുടെ സന്ദർഭത്തിലും തൊട്ടുമുമ്പുള്ള കസ്ലൂഹ്യരോടുള്ള സ്വാഭാവിക ബന്ധത്തിലും മലയാളത്തിൽ ഉത്ഭവം വ്യക്തമാക്കുന്ന ഈ പ്രയോഗം സ്വാഭാവികമാണ്. മൂലത്തിലെ സ്ഥലസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനതയ്ക്ക് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: כַּפְתֹּרִים
  choice: കഫ്തോര്യർ
  rationale: കഫ്തോർ എന്ന പേരുമായി ബന്ധപ്പെട്ട ജനവിഭാഗനാമം; എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וְאֶת
  choice: -യെയും
  rationale: ആവർത്തിക്കുന്ന സംയോജകവും നേരിട്ടുള്ള കർമചിഹ്നവും മലയാളത്തിലെ പട്ടികാശൈലിയിൽ ‘-യെയും’ എന്ന ഘടനകൊണ്ട് സ്വാഭാവികമായി പ്രതിനിധീകരിച്ചു.
theological_decisions:
- issue: ഫെലിസ്ത്യരുടെ ഉത്ഭവം സൂചിപ്പിക്കുന്ന ബന്ധവാക്യത്തിന്റെ മുൻപദം
  choice: പ്രധാന പാഠത്തിൽ തൊട്ടുമുമ്പുള്ള കസ്ലൂഹ്യരുമായി ബന്ധിപ്പിച്ചു.
  alternative: കഫ്തോര്യരുമായി ബന്ധിപ്പിക്കുക, അല്ലെങ്കിൽ ‘അവിടെനിന്ന്’ എന്ന സ്ഥലസൂചന മാത്രം നിലനിർത്തുക.
  rationale: എബ്രായ വാക്യക്രമത്തിൽ אֲשֶׁר יָצְאוּ מִשָּׁם എന്ന ബന്ധവാക്യം ഏറ്റവും സ്വാഭാവികമായി കസ്ലൂഹ്യരെ പിന്തുടരുന്നു. എന്നാൽ മറ്റു തിരുവെഴുത്തുഭാഗങ്ങൾ ഫെലിസ്ത്യരെ കഫ്തോരുമായി ബന്ധിപ്പിക്കുന്നതിനാൽ ആ പാരമ്പര്യസമ്മർദം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്തത നിലനിർത്തി; ജനവിഭാഗനാമങ്ങൾക്ക് ഏകീകരിച്ച ‘-യർ’ രൂപം ഉപയോഗിച്ചു. ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ബന്ധവാക്യം ഡാഷുകൾക്കുള്ളിൽ നൽകി.
