  naturalness: ‘അവിടെനിന്ന് ഫെലിസ്ത്യർ പുറപ്പെട്ടു’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വംശാവലിപ്പട്ടികയുടെ ചുരുക്കശൈലിക്കു യോജിച്ചതുമാണ്. ഡാഷുകൾക്കുള്ളിലെ വാക്യം അതിന്റെ ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുമ്പോഴും മൂലത്തിലെ സൂക്ഷ്മമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
