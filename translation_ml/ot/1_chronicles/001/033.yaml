id: 1CH.1.33
reference: 1 Chronicles 1:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֣י מִדְיָ֗ן עֵיפָ֤ה וָ/עֵ֨פֶר֙ וַ/חֲנ֔וֹךְ וַ/אֲבִידָ֖ע וְ/אֶלְדָּעָ֑ה כָּל אֵ֖לֶּה בְּנֵ֥י קְטוּרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/033.yaml
  text: 'The sons of Midian: Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.'
translation:
  language: ml
  text: 'മിദ്യാന്റെ പുത്രന്മാർ: ഏഫാ, ഏഫെർ, ഹനോക്ക്[a], അബീദാ, എൽദായാ. ഇവരെല്ലാവരും കെതൂറായുടെ പുത്രന്മാരായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പാരമ്പര്യ വിവർത്തനങ്ങളിൽ ഈ പേര് ‘ഹാനോക്ക്’ എന്നു കാണുന്നു.
    reason: പേരിന്റെ പരമ്പരാഗത രൂപഭേദം അറിയിക്കുമ്പോഴും മുഖ്യപാഠത്തിൽ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത ലിപ്യന്തരണം നിലനിർത്താൻ.
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: മിദ്യാന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ബന്ധസൂചക ഘടന സ്വാഭാവികമായ മലയാള വംശാവലിശൈലിയിൽ നൽകി. വാക്യാരംഭത്തിലെ וּ വേർതിരിച്ച് ‘കൂടാതെ’ എന്നു നൽകാതെ പട്ടികയുടെ തുടർച്ചയിലൂടെ സൂചിപ്പിച്ചു.
- source_word: עֵיפָה
  choice: ഏഫാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וָעֵפֶר
  choice: ഏഫെർ
  rationale: വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; ആവർത്തിക്കുന്ന ബന്ധകങ്ങൾ മലയാളത്തിലെ കോമാപട്ടികയിലൂടെ പ്രതിനിധീകരിച്ചു.
- source_word: וַחֲנוֹךְ
  choice: ഹനോക്ക്
  rationale: חֲנוֹךְ എന്ന എബ്രായനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וַאֲבִידָע
  choice: അബീദാ
  rationale: എബ്രായ വ്യക്തിനാമം ശബ്ദസാമ്യം നിലനിർത്തി ലിപ്യന്തരിച്ചു.
- source_word: וְאֶלְדָּעָה
  choice: എൽദായാ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ വ്യക്തമായി ഉച്ചരിക്കാവുന്ന വിധം ലിപ്യന്തരിച്ചു.
- source_word: כָּל אֵלֶּה
  choice: ഇവരെല്ലാവരും
  rationale: മുൻപുള്ള വ്യക്തികളെ സമാഹരിക്കുന്ന പ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകി.
- source_word: בְּנֵי קְטוּרָה
  choice: കെതൂറായുടെ പുത്രന്മാരായിരുന്നു
  rationale: എബ്രായ ബന്ധസൂചക ഘടനയെ സമ്പൂർണ മലയാളവാക്യമാക്കാൻ ഭൂതകാല സഹായി ചേർത്തു; വംശാവലിയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. വ്യക്തിനാമങ്ങൾ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ഏകീകരിച്ചു; പട്ടികയിൽ മലയാളത്തിന്റെ സ്വാഭാവിക വിരാമചിഹ്നക്രമം ഉപയോഗിച്ചു.
