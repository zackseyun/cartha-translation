id: 1CH.1.38
reference: 1 Chronicles 1:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֣י שֵׂעִ֔יר לוֹטָ֥ן וְ/שׁוֹבָ֖ל וְ/צִבְע֣וֹן וַֽ/עֲנָ֑ה וְ/דִישֹׁ֥ן וְ/אֵ֖צֶר וְ/דִישָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/038.yaml
  text: 'And the sons of Seir: Lotan[a], Shobal, Zibeon, Anah, Dishon, Ezer, and Dishan.'
translation:
  language: ml
  text: 'സേയീരിന്റെ പുത്രന്മാർ: ലോത്താൻ[a], ശോബാൽ, സിബെയോൻ, അനാ, ദീശോൻ, ഏസെർ, ദീശാൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വംശാവലി സന്ദർഭങ്ങളിൽ ‘പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗം നേരിട്ടുള്ള പുത്രന്മാരെയോ കൂടുതൽ വിശാലമായി സന്തതികളെയോ ഗോത്രാംഗങ്ങളെയോ സൂചിപ്പിക്കാം. ഇവിടെ വംശാവലിയുടെ ഔപചാരിക പദപ്രയോഗം നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടിക അവതരിപ്പിക്കുന്ന בְּנֵי എന്ന സംയുക്ത ബഹുവചനരൂപത്തിന്റെ ഔപചാരികമായ അർഥം നിലനിർത്തുന്നു. മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നതിനാൽ തുടക്കത്തിലെ ו പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: שֵׂעִיר
  choice: സേയീർ
  rationale: ഈ വംശാവലി സന്ദർഭത്തിലെ വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: לוֹטָן
  choice: ലോത്താൻ
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തിൽനിന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: שׁוֹבָל
  choice: ശോബാൽ
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തിൽനിന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: צִבְעוֹן
  choice: സിബെയോൻ
  rationale: വ്യക്തിനാമം; צ എന്ന അക്ഷരത്തിന് വായനാസൗകര്യമുള്ള മലയാള ലിപ്യന്തരണമായി ‘സ’ ഉപയോഗിച്ചു.
- source_word: עֲנָה
  choice: അനാ
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തിൽനിന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: דִישֹׁן
  choice: ദീശോൻ
  rationale: വ്യക്തിനാമം; അവസാനത്തെ דִישָׁן എന്ന വ്യത്യസ്ത നാമത്തിൽനിന്ന് സ്വരവ്യത്യാസം നിലനിർത്തി.
- source_word: אֵצֶר
  choice: ഏസെർ
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തിൽനിന്ന് വായനാസൗകര്യത്തോടെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: דִישָׁן
  choice: ദീശാൻ
  rationale: വ്യക്തിനാമം; മുൻപുള്ള דִישֹׁן (‘ദീശോൻ’) എന്ന നാമത്തിൽനിന്നുള്ള എബ്രായ സ്വരവ്യത്യാസം നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പേരുകൾ ഇംഗ്ലീഷ് രൂപത്തിൽനിന്നല്ല, എബ്രായ പാഠത്തിലെ സ്വരങ്ങളെ മുൻനിർത്തിയാണ് ലിപ്യന്തരണം ചെയ്തത്; പട്ടികയുടെ സംക്ഷിപ്ത വംശാവലി ശൈലി നിലനിർത്തി.
