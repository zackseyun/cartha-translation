  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി സ്വീകരിച്ചു. പേരുകൾ ഇംഗ്ലീഷ് രൂപങ്ങളെ ആശ്രയിക്കാതെ എബ്രായപാഠത്തിൽനിന്ന് മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലെ ആദ്യ അടിക്കുറിപ്പിലുള്ള ‘ഉല്പത്തി 36:27-ൽ Zavan’ എന്ന അവകാശവാദം WLC എബ്രായപാഠം പിന്തുണയ്ക്കാത്തതിനാൽ, അതിനെ യഥാർത്ഥ ലിപ്യന്തരണവ്യത്യാസമായി കൃത്യമാക്കി.
