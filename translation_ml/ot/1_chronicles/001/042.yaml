source:
  edition: WLC
  text: בְּֽנֵי אֵ֔צֶר בִּלְהָ֥ן וְ/זַעֲוָ֖ן יַעֲקָ֑ן בְּנֵ֥י דִישׁ֖וֹן ע֥וּץ וַ/אֲרָֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/042.yaml
  text: 'The sons of Ezer: Bilhan[a], Zaavan, and Jaakan[b]. The sons of Dishon: Uz and Aran.'
translation:
  language: ml
  text: 'ഏസെരിന്റെ പുത്രന്മാർ: ബിൽഹാൻ, സഅവാൻ[a], യാക്കാൻ[b]. ദീശോന്റെ പുത്രന്മാർ: ഊസ്, അരാൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഉല്പത്തി 36:27-ലും ഈ പേരിന്റെ എബ്രായ രൂപം ‘സഅവാൻ’ തന്നെയാണ്.
    reason: cross_reference
  - marker: b
    text: ഇവിടെ എബ്രായപാഠത്തിൽ ‘യാക്കാൻ’; സമാന്തര വംശാവലിയായ ഉല്പത്തി 36:27-ൽ ‘അക്കാൻ’ എന്നാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടിക അവതരിപ്പിക്കുന്ന בֵּן എന്ന പദത്തിന്റെ construct plural രൂപം. ഇവിടെ നേരിട്ടുള്ള മക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ വിശാലമായ ‘സന്തതികൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: אֵצֶר
  choice: ഏസെർ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വ്യക്തിനാമലിപ്യന്തരണം.
- source_word: בִּלְהָן
  choice: ബിൽഹാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: זַעֲוָן
  choice: സഅവാൻ
  rationale: മധ്യത്തിലെ ע എന്ന വ്യഞ്ജനസാന്നിധ്യം പൂർണമായി ഇല്ലാതാക്കാതെ, എബ്രായ സ്വരക്രമത്തോട് അടുത്തുനിൽക്കുന്ന ലിപ്യന്തരണം.
- source_word: יַעֲקָן
  choice: യാക്കാൻ
  rationale: ദിനവൃത്താന്തങ്ങളിലെ എബ്രായ രൂപത്തെ പ്രതിനിധീകരിക്കുന്ന ലിപ്യന്തരണം; ഉല്പത്തി 36:27-ലെ עֲקָן എന്ന വ്യത്യസ്ത രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: דִישׁוֹן
  choice: ദീശോൻ
  rationale: ദീർഘസ്വരവും ശ് ധ്വനിയും നിലനിർത്തുന്ന വ്യക്തിനാമലിപ്യന്തരണം; സമാനമായ ദീശാൻ എന്ന പേരിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: עוּץ
  choice: ഊസ്
  rationale: ആരംഭത്തിലെ ദീർഘ ū സ്വരം നിലനിർത്തുകയും അവസാനത്തെ צ മലയാള വായനയിൽ സ്വാഭാവികമായ ‘സ്’ ആയി നൽകുകയും ചെയ്തു.
- source_word: אֲרָן
  choice: അരാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
