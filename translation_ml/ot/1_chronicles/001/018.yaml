base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/018.yaml
  text: Arpachshad fathered Shelah[b][a], and Shelah fathered Eber.
translation:
  language: ml
  text: അർപ്പക്ഷദ്[a] ശേലഹിനെ[b] ജനിപ്പിച്ചു; ശേലഹ് ഏബെറിനെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അർപ്പക്ഷദ്’; ഗ്രീക്ക് സ്വാധീനമുള്ള പരമ്പരാഗത രൂപം ചില പരിഭാഷകളിൽ ‘അർഫക്ഷദ്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ശേലഹ്’; ചില പരിഭാഷകളിലും ബന്ധപ്പെട്ട വംശാവലിപ്പട്ടികകളിലും ‘ശാലഹ്’ എന്ന പരമ്പരാഗത രൂപം കാണാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְפַּכְשַׁד
  choice: അർപ്പക്ഷദ്
  rationale: എബ്രായനാമത്തിന്റെ വ്യഞ്ജനഘടനയോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം; ഗ്രീക്ക് സ്വാധീനമുള്ള പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יָלַד
  choice: പിതാവായി
  rationale: പുരുഷവംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ജനിപ്പിക്കുക/പിതാവാകുക എന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നമാണ്; മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനത ആവശ്യമില്ല.
- source_word: שָׁלַח / שֶׁלַח
  choice: ശേലഹ്
  rationale: മസോരറ്റിക് പാഠത്തിലെ ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന രണ്ടു സ്വരവിന്യാസങ്ങളും ഒരേ രൂപത്തിൽ നൽകിയിരിക്കുന്നു; പരമ്പരാഗത പകരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: עֵבֶר
  choice: ഏബെർ
  rationale: എബ്രായത്തിലെ עֵבֶר എന്ന നാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ആവർത്തിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് ഒരേ മലയാള പ്രയോഗം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
