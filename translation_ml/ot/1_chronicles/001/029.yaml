    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תֹּלְדוֹתָם
  choice: അവരുടെ വംശാവലി ഇതാണ്
  rationale: വംശപരമ്പരയെ പരിചയപ്പെടുത്തുന്ന എബ്രായ ശീർഷകശൈലി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ‘സന്തതികൾ’ എന്നും അർഥമാക്കാമെങ്കിലും, ഇവിടെ തുടർന്നുവരുന്ന പട്ടികയ്ക്ക് ‘വംശാവലി’ കൂടുതൽ യോജിക്കുന്നു.
- source_word: בְּכוֹר
  choice: ആദ്യജാതൻ
  rationale: ആദ്യജന്മസ്ഥാനം സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം കാത്തുസൂക്ഷിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘മകൻ’ ചേർത്തിട്ടില്ല.
- source_word: יִשְׁמָעֵאל
  choice: യിശ്മായേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണം.
- source_word: נְבָיוֹת
  choice: നെബായോത്ത്
  rationale: എബ്രായ രൂപത്തിലെ വ്യഞ്ജന-സ്വരക്രമം പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം; ചില പാരമ്പര്യങ്ങളിൽ കാണുന്ന വ്യത്യസ്ത രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: קֵדָר
  choice: കേദാർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: אַדְבְּאֵל
  choice: അദ്ബെയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഘടന പരമാവധി നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מִבְשָׂם
  choice: മിബ്സാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
