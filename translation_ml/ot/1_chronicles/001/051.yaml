translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി-പട്ടികാശൈലി ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന אַלּוּף എന്ന സ്ഥാനപ്പേര് ഓരോ പേരിനുമുമ്പും നിലനിർത്തി മൂലപാഠത്തിന്റെ പട്ടികാഘടന സംരക്ഷിച്ചു. പാഠഭേദം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
