id: 1CH.1.51
reference: 1 Chronicles 1:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּהְיוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עליה אַלּ֥וּף יְתֵֽתס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
translation:
  language: ml
  text: 'ഹദദ് മരിച്ചു; തുടർന്ന് എദോമിലെ കുലത്തലവന്മാർ ഇവരായിരുന്നു: കുലത്തലവൻ[b] തിമ്നാ[c], കുലത്തലവൻ അലിയാ[a], കുലത്തലവൻ യെതേത്ത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഉല്പത്തി 36:40-ലെ സമാന്തരപ്പട്ടികയിൽ ഈ പേര് ‘അൽവാ’ എന്നാണ്; ഇവിടെ ദിനവൃത്താന്തങ്ങളുടെ എബ്രായപാഠം ‘അലിയാ’ എന്നാണ് വായിക്കുന്നത്.
    reason: textual_variant
  - marker: b
    text: ‘കുലത്തലവൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം എദോമിലെ ഒരു കുലത്തിന്റെയോ ഗോത്രത്തിന്റെയോ തലവനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘തിമ്നാ’ എന്ന പേര് ‘തിമ്നാഹ്’ എന്നും ലിപ്യന്തരണം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ വയ്യിഖ്തോൽ രൂപം സംഭവപരമ്പരയിലെ അടുത്ത സംഭവം അറിയിക്കുന്നു. മലയാളത്തിൽ ‘മരിച്ചു’ എന്ന ലളിതമായ ഭൂതകാലരൂപം സ്വാഭാവികമാണ്; തുടർന്നുള്ള വാക്യവുമായി ബന്ധം വ്യക്തമാക്കാൻ അർധവിരാമവും ‘തുടർന്ന്’ എന്ന പദവും ഉപയോഗിച്ചു.
- source_word: הֲדָד
  choice: ഹദദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּהְיוּ
  choice: ഇവരായിരുന്നു
  rationale: ഇവിടെ היה തുടർന്നുവരുന്ന എദോമ്യ തലവന്മാരുടെ പട്ടിക അവതരിപ്പിക്കുന്നു. ‘ഇവരായിരുന്നു’ പട്ടികയുടെ അവതരണം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: കുലത്തലവന്മാർ / കുലത്തലവൻ
  rationale: എദോമ്യ വംശ-രാഷ്ട്രീയ പട്ടികകളിൽ ഈ പദം ഒരു കുലത്തിന്റെയോ ഗോത്രത്തിന്റെയോ തലവനെ സൂചിപ്പിക്കുന്നു. ‘കുലത്തലവൻ’ ആ അർഥം വ്യക്തമാക്കുകയും കാലഹരണപ്പെട്ട രാജകീയ സ്ഥാനപ്പേരുകൾ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: אֱדוֹם
  choice: എദോം
  rationale: സ്ഥലത്തിന്റെയും ജനവിഭാഗത്തിന്റെയും പേരിന്റെ പതിവായ മലയാള ലിപ്യന്തരണം.
- source_word: תִּמְנָע
  choice: തിമ്നാ
  rationale: എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ അടുത്തായി നിലനിർത്തുന്നു.
- source_word: עליה
  choice: അലിയാ
  rationale: ദിനവൃത്താന്തങ്ങളിലെ עליה എന്ന പാഠരൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ഉല്പത്തി 36:40-ലെ സമാന്തരപാഠമായ ‘അൽവാ’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: יְתֵת
  choice: യെതേത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
