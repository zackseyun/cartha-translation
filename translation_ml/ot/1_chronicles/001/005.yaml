  yaml_path: translation/ot/1_chronicles/001/005.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: ml
  text: 'യാഫെത്തിന്റെ പുത്രന്മാർ[a]: ഗോമെർ, മാഗോഗ്, മാദായി, യാവാൻ, തൂബാൽ, മെശെക്ക്, തീരാസ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗം ചില വംശാവലി സന്ദർഭങ്ങളിൽ നേരിട്ടുള്ള പുത്രന്മാരെയോ വിശാലമായ അർത്ഥത്തിൽ പിൻതലമുറയിൽപ്പെട്ടവരെയോ സൂചിപ്പിക്കാം; ഇവിടെ അത് യാഫെത്തിന്റെ വംശരേഖയെ പട്ടികയായി പരിചയപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ construct ബഹുവചനരൂപമാണിത്; വംശാവലിപ്പട്ടികയിൽ യാഫെത്തിന്റെ മക്കളെ പരിചയപ്പെടുത്തുന്നു. ഇവിടെ പേരിടപ്പെട്ടിരിക്കുന്നത് നേരിട്ടുള്ള പുത്രന്മാരായതിനാൽ ഔപചാരികവും സ്വാഭാവികവുമായ ‘പുത്രന്മാർ’ നിലനിർത്തി; ഈ പ്രയോഗത്തിന് വിശാലമായ വംശപരമായ അർഥവും ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: יֶפֶת
  choice: യാഫെത്ത്
  rationale: വ്യക്തിനാമം; മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: גֹּמֶר
  choice: ഗോമെർ
  rationale: വംശാവലിയിൽ വരുന്ന വ്യക്തിനാമം; വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: מָגוֹג
  choice: മാഗോഗ്
  rationale: വ്യക്തിനാമം; വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: מָדַי
  choice: മാദായി
  rationale: ഇവിടെ ജനവിഭാഗത്തിന്റെ വ്യാഖ്യാനനാമമാക്കി മാറ്റാതെ വംശാവലിയിലെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: יָוָן
  choice: യാവാൻ
  rationale: ഗ്രീസുമായുള്ള ചരിത്രബന്ധം വ്യാഖ്യാനമായി മുഖ്യപാഠത്തിൽ ചേർക്കാതെ വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: תֻבָל
  choice: തൂബാൽ
  rationale: വ്യക്തിനാമം; ഹീബ്രു രൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
- source_word: מֶשֶׁךְ
  choice: മേശെക്ക്
  rationale: വ്യക്തിനാമം; ഹീബ്രു രൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
- source_word: תִירָס
  choice: തീരാസ്
  rationale: വ്യക്തിനാമം; ഹീബ്രു രൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
- source_word: וְ / וּ
  choice: കോമകളാൽ വേർതിരിച്ച പട്ടിക
  rationale: ഹീബ്രുവിൽ മിക്ക പേരുകൾക്കും മുമ്പിൽ സംയോജകാവ്യയം ആവർത്തിക്കുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാള പട്ടികാശൈലിക്കായി പേരുകൾ കോമകൊണ്ട് വേർതിരിച്ചു; അർഥബന്ധത്തിൽ മാറ്റമില്ല.
