  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud, and Aram; Uz, Hul, Gether, and Meshech.'
translation:
  language: ml
  text: 'ശേമിന്റെ പുത്രന്മാർ: ഏലാം, അശ്ശൂർ, അർപ്പക്ഷാദ്, ലൂദ്, അരാം; ഊസ്, ഹൂൽ, ഗെഥെർ, മെശെക്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സമാന്തര വംശാവലിയായ ഉല്പത്തി 10:23-ൽ “മെശെക്” എന്നതിനുപകരം “മാശ്” എന്നാണ് വായിക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בן എന്ന പദത്തിന്റെ construct ബഹുവചനരൂപം വംശാവലിപ്പട്ടികയെ പരിചയപ്പെടുത്തുന്നു. ‘പുത്രന്മാർ’ എന്നത് പുരുഷസന്തതികളെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തെ നേരിട്ട് നിലനിർത്തുന്നു; കൂടുതൽ വിശാലമായ ‘സന്തതികൾ’ എന്ന അർഥം ഇവിടെ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: שֵׁם
  choice: ശേം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: עֵילָם
  choice: ഏലാം
  rationale: വംശാവലിയിൽ വരുന്ന വ്യക്തിനാമം/സ്ഥലനാമം ഉറവിടത്തിലെ ശബ്ദരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: אַשּׁוּר
  choice: അശ്ശൂർ
  rationale: പട്ടികയിൽ വ്യക്തിനാമമായി വരുന്നതിനാൽ ‘അസ്സീറിയ’ പോലുള്ള പിൽക്കാല ദേശനാമം ഉപയോഗിക്കാതെ എബ്രായനാമം ലിപ്യന്തരിച്ചു.
- source_word: אַרְפַּכְשַׁד
  choice: അർപ്പക്ഷാദ്
  rationale: ഗ്രീക്ക് പാരമ്പര്യത്തിൽനിന്നുള്ള രൂപത്തിനു പകരം എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കിയ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: לוּד
  choice: ലൂദ്
  rationale: ഇവിടെ ബഹുവചന ജനനാമമല്ല, ഏകവചന വ്യക്തിനാമമാണ്; അതിനാൽ അതേ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֲרָם
  choice: അരാം
  rationale: വംശാവലിസന്ദർഭത്തിൽ പിൽക്കാല ദേശനാമമായ ‘സിറിയ’ എന്നതിനു പകരം പൂർവികന്റെ പേര് നിലനിർത്തി.
- source_word: עוּץ
  choice: ഊസ്
  rationale: എബ്രായ עוּץ എന്ന വ്യക്തിനാമത്തിന്റെ മലയാള ശബ്ദാനുസൃത ലിപ്യന്തരണം.
- source_word: חוּל
  choice: ഹൂൽ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: גֶתֶר
  choice: ഗേഥെർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപം കഴിയുന്നത്ര നിലനിർത്തിയ ലിപ്യന്തരണം.
- source_word: מֶשֶׁךְ
  choice: മെശെക്
  rationale: WLC മസോററ്റിക് പാഠത്തിലെ പേര് നേരിട്ട് ലിപ്യന്തരിച്ചു. സമാന്തര വംശാവലിയിലെ വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: ഊസ്, ഹൂൽ, ഗേഥെർ, മെശെക് എന്നീ പേരുകളുടെ വംശാവലിബന്ധം
  choice: WLC പാഠത്തിന്റെ വ്യാകരണക്രമം അനുസരിച്ച് ഇവരെയും ‘ശേമിന്റെ പുത്രന്മാർ’ എന്ന പട്ടികയിൽ തന്നെയാക്കി; ‘അരാമിന്റെ പുത്രന്മാർ’ എന്നൊരു പുതിയ പ്രയോഗം ചേർത്തില്ല.
  alternative: ഉല്പത്തി 10:23-ലെ സമാന്തര പട്ടിക അനുസരിച്ച് ‘അരാമിന്റെ പുത്രന്മാർ’ എന്നു ചേർക്കുക.
  rationale: ദിനവൃത്താന്തത്തിലെ ലഭ്യമായ മസോററ്റിക് പാഠത്തിൽ ആ പ്രയോഗമില്ല. സമാന്തരവിവരണത്തെ ആശ്രയിച്ച് അത് മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് ഉറവിടത്തിലെ യഥാർഥ ഘടനയും അതിലുള്ള പാഠപരമായ സംഘർഷവും മറച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. പേരുകൾ വിവർത്തനം ചെയ്യാതെ എബ്രായത്തിൽനിന്ന് ലിപ്യന്തരിച്ചു. ദീർഘമായ പട്ടിക വായിക്കാൻ സൗകര്യമാകുന്ന വിധത്തിൽ അരാമിന് ശേഷം ഉറവിടത്തിലെ വിഭജനബോധം അർധവിരാമംകൊണ്ട് സൂചിപ്പിച്ചു.
