translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ ആദ്യഭാഗത്തിലെ ഏകോപനരൂപം നിലനിർത്തി. അടിക്കുറിപ്പ് ആശയപരമായി ‘പുത്രന്മാർ’ എന്ന പദത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്; അതിനാൽ നൽകിയ ഇംഗ്ലീഷ് പാളിയിലെ ഓഫീറിന് ശേഷമുള്ള സ്ഥാനത്തേക്കാൾ അർത്ഥസംബന്ധമായ സ്ഥാനത്ത് ചിഹ്നം വെച്ചു.
