  yaml_path: translation/ot/1_chronicles/001/023.yaml
  text: and Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: ml
  text: ഓഫീരിനെയും ഹവീലയെയും യോബാബിനെയും. ഇവരെല്ലാവരും യോക്താന്റെ പുത്രന്മാരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യോക്താന്റെ സന്തതികൾ.’ എബ്രായപാഠത്തിൽ ‘യോക്താന്റെ പുത്രന്മാർ’ എന്നാണ്; എന്നാൽ വംശാവലികളിൽ ‘പുത്രന്മാർ’ എന്ന പദം ചിലപ്പോൾ വിശാലമായ സന്തതിപരമ്പരയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: -നെയും
  rationale: אֵת എന്ന കർമചിഹ്നം മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല; വְ നൽകുന്ന ഏകോപനം തുടർച്ചയായ പേരുകളിൽ ‘-നെയും’ എന്ന പ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אוֹפִיר
  choice: ഓഫീർ
  rationale: വംശാവലിയിലെ വ്യക്തിനാമമായി എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: חֲוִילָה
  choice: ഹവീലാ
  rationale: വ്യക്തിനാമം എബ്രായ രൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: יוֹבָב
  choice: യോബാബ്
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: כָּל אֵלֶּה
  choice: ഇവരെല്ലാവരും
  rationale: മുൻപു പറഞ്ഞ വ്യക്തികളെ ഒന്നാകെ സംഗ്രഹിക്കുന്ന പ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തിലെ സമഗ്രതയും സൂചനയും നിലനിർത്തുന്നതുമാണ്.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: മൂലപദം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്നാണ്; വംശാവലിയിൽ വിശാലമായ സന്തതിബന്ധവും സൂചിപ്പിക്കാവുന്നതിനാൽ അതു അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: יָקְטָן
  choice: യോക്താൻ
  rationale: എബ്രായ നാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
