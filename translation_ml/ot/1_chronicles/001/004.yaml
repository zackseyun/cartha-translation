lexical_decisions:
- source_word: נֹחַ
  choice: നോഹ
  rationale: വംശാവലിയിൽ വരുന്ന വ്യക്തിനാമം; മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ രൂപം സ്വീകരിച്ചു.
- source_word: שֵׁם
  choice: ശേം
  rationale: വ്യക്തിനാമമായതിനാൽ അതിന്റെ പദാർഥമായ ‘പേര്’ എന്നു വിവർത്തനം ചെയ്യാതെ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: חָם
  choice: ഹാം
  rationale: വ്യക്തിനാമം; ഹീബ്രു ഉച്ചാരണത്തെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്ന മലയാളരൂപം സ്വീകരിച്ചു.
- source_word: וָ/יָפֶת
  choice: യാഫെത്ത്
  rationale: വ്യക്തിനാമം ശബ്ദലിപ്യന്തരണം ചെയ്തു. മൂലപാഠത്തിലെ ו എന്ന സംയോജകം അവസാന പേരിനു മുമ്പിലുണ്ടെങ്കിലും, സ്വാഭാവികമായ മലയാള പട്ടികാശൈലിയിൽ കോമകൾകൊണ്ട് പേരുകൾ നിരത്തുന്നത് അതിന്റെ ബന്ധം മതിയായ രീതിയിൽ സൂചിപ്പിക്കുന്നു.
