source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/019.yaml
  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
translation:
  language: ml
  text: ഏബെരിന് രണ്ടു പുത്രന്മാർ ജനിച്ചു. ഒരാളുടെ പേര് പേലെഗ്[a] എന്നായിരുന്നു; കാരണം, അവന്റെ കാലത്ത് ഭൂമി വിഭജിക്കപ്പെട്ടു. അവന്റെ സഹോദരന്റെ പേര് യോക്താൻ എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശം വിഭജിക്കപ്പെട്ടു.’ ഹീബ്രു പദത്തിന് ഭൂമി മുഴുവനെയോ ഒരു ദേശത്തെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം; വിഭജനത്തിന്റെ സ്വഭാവം വാചകം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר יֻלַּד שְׁנֵי בָנִים
  choice: ഏബെരിന് രണ്ടു പുത്രന്മാർ ജനിച്ചു
  rationale: പരമ്പരാവിവരണത്തിന്റെ ഒഴുക്ക് നിലനിർത്തിക്കൊണ്ട്, പരോക്ഷ കർത്തൃപ്രയോഗവും ജനനത്തെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ ക്രിയയുടെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שֵׁם הָאֶחָד
  choice: ഒരാളുടെ പേര്
  rationale: ‘ഒരുവന്റെ പേര്’ എന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു; ‘ആദ്യത്തവൻ’ എന്ന് ക്രമം നിർണയിക്കുന്നില്ല.
- source_word: פֶּלֶג
  choice: പേലെഗ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; തുടർന്നുള്ള ‘വിഭജിക്കപ്പെട്ടു’ എന്ന പദവുമായി ഉള്ള നാമവ്യുത്പത്തി ബന്ധം വാചകത്തിൽ നിലനിൽക്കുന്നു.
- source_word: כִּי בְיָמָיו
  choice: കാരണം, അവന്റെ കാലത്ത്
  rationale: כִּי ഇവിടെ പേരിനുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്ന കാരണസൂചകമാണ്; ‘അവന്റെ കാലത്ത്’ എന്നത് കാലപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: נִפְלְגָה הָאָרֶץ
  choice: ഭൂമി വിഭജിക്കപ്പെട്ടു
  rationale: נפלג എന്ന നിഷ്ക്രിയ ക്രിയയുടെ ‘വിഭജിക്കപ്പെടുക’ എന്ന അർഥവും הָאָרֶץ എന്നതിന്റെ വിശാലമായ ‘ഭൂമി’ എന്ന സാധ്യതയും നിലനിർത്തുന്നു; വിഭജനത്തിന്റെ സ്വഭാവം നിർവചിക്കുന്നില്ല.
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: അവന്റെ സഹോദരന്റെ പേര് യോക്താൻ എന്നായിരുന്നു
  rationale: ബന്ധസൂചനയും പേരിടൽ ഘടനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: പേലെഗിന്റെ കാലത്ത് ‘ഭൂമി വിഭജിക്കപ്പെട്ടു’ എന്ന പ്രസ്താവനയുടെ അർഥം
  choice: വിഭജനത്തിന്റെ സ്വഭാവം വിശദീകരിക്കാതെ ‘ഭൂമി വിഭജിക്കപ്പെട്ടു’ എന്നു നിലനിർത്തുന്നു.
  alternative: ‘ദേശം വിഭജിക്കപ്പെട്ടു’; ബാബേലിനുശേഷം ജനതകളോ ഭാഷകളോ വിഭജിക്കപ്പെട്ടതിനെക്കുറിച്ചുള്ള സൂചന; ഭൂമിശാസ്ത്രപരമായ വിഭജനം.
  rationale: ഹീബ്രു വാചകം ഏതു തരത്തിലുള്ള വിഭജനമാണെന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക ചരിത്രപരമോ ദൈവശാസ്ത്രപരമോ ആയ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ യഥാർഥമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള പരമ്പരാവിവരണ ശൈലി. വ്യക്തിനാമങ്ങൾ ഹീബ്രു ശബ്ദരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു; മൂലത്തിലെ ആവർത്തനഘടന അമിതമായി കഠിനമാക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
