id: 1CH.1.49
reference: 1 Chronicles 1:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֖מָת שָׁא֑וּל וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו בַּ֥עַל חָנָ֖ן בֶּן עַכְבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/049.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: ml
  text: ശൗൽ മരിച്ചു[a]. അവനു പകരം അക്ബോരിന്റെ മകൻ ബാൽ-ഹാനാൻ രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പരമ്പരാഗത മലയാള ബൈബിൾ പരിഭാഷകളിൽ ഈ പേരുകൾക്ക് വ്യത്യസ്ത അക്ഷരരൂപങ്ങൾ കാണാം. ഇവിടെ വ്യക്തിനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ധാതുവിന്റെ ഖാൽ വയിക്തോൽ രൂപം; കഥനത്തിലെ സംഭവക്രമം ലളിതവും മറയില്ലാതെയും അവതരിപ്പിക്കുന്നു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജകീയ പിന്തുടർച്ചയുടെ ഈ സൂത്രവാക്യത്തിൽ מלך അധികാരമേറ്റ് രാജാവാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ പ്രവേശനഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: തത്സ്ഥാനത്തുള്ള പിന്തുടർച്ചയെയും പകരക്കാരനാകുന്നതിനെയും നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: בַּעַל חָנָן
  choice: ബാൽ-ഹാനാൻ
  rationale: സംയുക്ത വ്യക്തിനാമത്തെ എബ്രായരൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു; ഘടകങ്ങൾ തിരിച്ചറിയാൻ ഹൈഫൻ നിലനിർത്തി.
- source_word: בֶּן
  choice: മകൻ
  rationale: ഈ വംശാവലി പശ്ചാത്തലത്തിൽ നേരിട്ടുള്ള പിതൃപുത്രബന്ധമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עַכְבּוֹר
  choice: അക്ബോർ
  rationale: പേരിന്റെ എബ്രായ വ്യഞ്ജനഘടനയോട് അടുത്തുനിൽക്കുന്ന ലളിതമായ മലയാള ലിപ്യന്തരണം.
