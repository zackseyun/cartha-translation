translation:
  language: ml
  text: ആദാം[a], ശേത്ത്, എനോശ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ ‘ആദാം’ എന്ന പദത്തിന് മറ്റു സന്ദർഭങ്ങളിൽ ‘മനുഷ്യൻ’ എന്നോ ‘മനുഷ്യവർഗം’ എന്നോ അർത്ഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ചില പഴയ പരിഭാഷകളിൽ ‘എനോസ്’ എന്നു നൽകിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: ആദാം
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ഇത് മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്ന നാമമല്ല, വ്യക്തിനാമമാണ്; അതിനാൽ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: שֵׁת
  choice: ശേത്ത്
  rationale: വംശാവലിയിലെ വ്യക്തിനാമമായതിനാൽ മലയാളത്തിലെ സ്വാഭാവികമായ ബൈബിൾ ലിപ്യന്തരണരീതി പിന്തുടർന്നു.
- source_word: אֱנוֹשׁ
  choice: എനോശ്
  rationale: എബ്രായ പദത്തിന്റെ അവസാനത്തെ ശ് ശബ്ദം നിലനിർത്തുന്ന ലിപ്യന്തരണം; ‘എനോസ്’ എന്ന പഴയ രൂപത്തേക്കാൾ മൂലരൂപത്തെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ അർത്ഥനിർണയം
  choice: വ്യക്തിനാമമായി ‘ആദാം’
  alternative: ‘മനുഷ്യൻ’ അല്ലെങ്കിൽ ‘മനുഷ്യവർഗം’
  rationale: പേരുകൾ നിരത്തുന്ന വംശാവലിയുടെ സാഹിത്യരൂപവും പിന്നാലെ വരുന്ന ശേത്ത്, എനോശ് എന്നീ പേരുകളും ഇവിടെ ഒരു വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിയുടെ അതിസംക്ഷിപ്തമായ പേരുപട്ടികാരൂപം അതേപടി നിലനിർത്തി. വ്യക്തിനാമങ്ങൾ എബ്രായരൂപത്തോട് ചേർന്ന്, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
