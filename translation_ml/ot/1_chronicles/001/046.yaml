translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ നീണ്ട ബന്ധവാക്യം വായനാസൗകര്യത്തിനായി ചെറുവാക്യങ്ങളാക്കി; അർഥബന്ധം നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട പട്ടണനാമത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
