  text: וַ/יָּ֖מָת חוּשָׁ֑ם וַ/יִּמְלֹ֨ךְ תַּחְתָּ֜י/ו הֲדַ֣ד בֶּן בְּדַ֗ד הַ/מַּכֶּ֤ה אֶת מִדְיָן֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב וְ/שֵׁ֥ם עִיר֖/וֹ עיות־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
translation:
  language: ml
  text: ഹൂശാം മരിച്ചു. അവന്റെ സ്ഥാനത്ത് ബെദദിന്റെ മകനായ ഹദദ് രാജാവായി. മോവാബ് പ്രദേശത്ത് മിദ്യാനെ അടിച്ചവൻ ഇവനായിരുന്നു. അവന്റെ പട്ടണത്തിന്റെ പേര് അവീത്ത്[a] എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അയോത്ത്’; പട്ടണനാമത്തിന്റെ മറ്റൊരു ലിപ്യന്തരണം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു; മയപ്പെടുത്തിയ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: അവനു പകരം ... രാജാവായി
  rationale: מלך ഇവിടെ രാജസ്ഥാനാരോഹണത്തെയും תחתיו മുൻരാജാവിന്റെ സ്ഥാനമേറ്റെടുക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: הֲדַד בֶּן בְּדַד
  choice: ബെദദിന്റെ മകനായ ഹദദ്
  rationale: בן സൂചിപ്പിക്കുന്ന പിതൃപുത്രബന്ധം മലയാളത്തിലെ സ്വാഭാവിക നാമക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמַּכֶּה אֶת־מִדְיָן
  choice: മിദ്യാനെ പരാജയപ്പെടുത്തിയത്
  rationale: נכה എന്ന ക്രിയയുടെ യുദ്ധസന്ദർഭത്തിലെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കർത്താവിനെ തിരിച്ചറിയിക്കുന്ന എബ്രായ പങ്കാളിത്തരൂപത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: മോവാബ് പ്രദേശത്തുവെച്ച്
  rationale: שׂדה അക്ഷരാർഥത്തിൽ ‘വയൽ’ എന്നാണെങ്കിലും ഇവിടെ ഒരു ഭൂവിഭാഗത്തെയോ തുറന്ന പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രദേശം’ കൂടുതൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְשֵׁם עִירוֹ
  choice: അവന്റെ പട്ടണത്തിന്റെ പേര് ... എന്നായിരുന്നു
  rationale: എബ്രായ നാമനിർദേശ സൂത്രവാക്യത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: עיות
  choice: അവീത്ത്
  rationale: സമാന്തര പാഠവും പരമ്പരാഗത സ്വരീകരണവും പരിഗണിച്ചുള്ള സ്ഥലനാമ ലിപ്യന്തരണം; ദിനവൃത്താന്തത്തിലെ വ്യഞ്ജനരൂപം മറ്റൊരു വായനയ്ക്കും ഇടനൽകുന്നു.
