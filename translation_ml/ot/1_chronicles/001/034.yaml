id: 1CH.1.34
reference: 1 Chronicles 1:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּ֥וֹלֶד אַבְרָהָ֖ם אֶת יִצְחָ֑ק בְּנֵ֣י יִצְחָ֔ק עֵשָׂ֖ו וְ/יִשְׂרָאֵֽל־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/034.yaml
  text: 'Abraham fathered Isaac[a]. The sons of Isaac: Esau and Israel.'
translation:
  language: ml
  text: 'അബ്രാഹാം യിസ്ഹാക്കിന്റെ പിതാവായി. യിസ്ഹാക്കിന്റെ പുത്രന്മാർ: ഏശാവും യിസ്രായേലും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ “യിസ്രായേൽ”; അതായത് യാക്കോബ്.
    reason: പേരിന്റെ പരാമർശം വ്യക്തമാക്കുകയും മൂലപാഠത്തിലെ ‘യിസ്രായേൽ’ എന്ന രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: പിതാവായി
  rationale: ילד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം വംശാവലിയിൽ ഒരാൾ മറ്റൊരാളുടെ പിതാവായതിനെ സൂചിപ്പിക്കുന്നു. ‘ജനിപ്പിച്ചു’ എന്നത് സാധ്യമെങ്കിലും ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികമായോ മാതൃപ്രസവത്തെ സൂചിപ്പിക്കുന്നതായോ തോന്നാം; ‘പിതാവായി’ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണിത്; മലയാളത്തിൽ ഇതിന് സ്വതന്ത്ര പദസമാനത ആവശ്യമില്ല.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בן എന്ന പദത്തിന്റെ construct ബഹുവചനമാണിത്; തുടർന്നുവരുന്ന വംശാവലിശാഖയെ സംക്ഷിപ്തമായി പരിചയപ്പെടുത്തുന്നു.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: וְיִשְׂרָאֵל
  choice: യിസ്രായേലും
  rationale: മൂലപാഠം യാക്കോബ് എന്നതിനുപകരം ‘യിസ്രായേൽ’ എന്നു തന്നെയാണ് പറയുന്നത്. അതിനാൽ പാഠത്തിലെ പേരുരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാക്കോബിനെ ഉദ്ദേശിക്കുന്ന വംശാവലിപ്പട്ടികയിൽ יִשְׂרָאֵל എന്ന പേരിന്റെ പരിഭാഷ
  choice: യിസ്രായേൽ
  alternative: യാക്കോബ്
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠം യിസ്ഹാക്കിന്റെ പുത്രന്മാരെ ‘ഏശാവും യിസ്രായേലും’ എന്ന് വ്യക്തമായി വിളിക്കുന്നു. പരാമർശിക്കപ്പെടുന്നത് യാക്കോബാണെങ്കിലും, മൂലപാഠത്തിലെ നിയമബന്ധിതമായ പുതിയ പേര് മാറ്റി ജനനനാമം ചേർത്ത് സമന്വയിപ്പിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വംശാവലിശൈലി. ‘പിതാവായി’ എന്ന പ്രയോഗം അർഥം വ്യക്തമായി നൽകുന്നു; പേരുകൾ മലയാള ബൈബിൾവായനയിൽ പരിചിതമായ രൂപങ്ങളിൽ ലിപ്യന്തരിച്ചു. അടിക്കുറിപ്പ് പ്രസക്തമായ ‘യിസ്രായേൽ’ എന്ന പേരിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
