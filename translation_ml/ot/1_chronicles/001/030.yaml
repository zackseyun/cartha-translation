  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִשְׁמָ֣ע וְ/דוּמָ֔ה מַשָּׂ֖א חֲדַ֥ד וְ/תֵימָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/030.yaml
  text: Mishma[a], Dumah, Massa, Hadad, and Tema.
translation:
  language: ml
  text: മിശ്മാ[a], ദൂമാ, മസ്സാ, ഹദദ്, തേമാ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഉല്പത്തി 25:15-ലെ സമാന്തരപ്പട്ടികയിൽ ‘ഹദാർ’ എന്നു കാണുന്നു; 1 ദിനവൃത്താന്തത്തിലെ എബ്രായപാഠം ‘ഹദദ്’ എന്നാണ് വായിക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: מִשְׁמָע
  choice: മിശ്മാ
  rationale: വംശാവലിപ്പട്ടികയിലെ വ്യക്തിനാമമായതിനാൽ അർത്ഥം പരിഭാഷപ്പെടുത്താതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וְ/דוּמָה
  choice: ദൂമാ
  rationale: דוּמָה എന്ന വ്യക്തിനാമം ലിപ്യന്തരിച്ചു. പട്ടികയുടെ സ്വാഭാവിക മലയാളഘടനയ്ക്കായി എബ്രായത്തിലെ വാവിനെ ഓരോ പേരിനുമുമ്പും പ്രത്യേകം വിവർത്തനം ചെയ്തില്ല.
- source_word: מַשָּׂא
  choice: മസ്സാ
  rationale: ഇവിടെ ‘ഭാരം/അരുളപ്പാട്’ എന്ന പൊതുനാമമല്ല, വംശാവലിയിലെ വ്യക്തിനാമമാണ്; അതിനാൽ ലിപ്യന്തരിച്ചു.
- source_word: חֲדַד
  choice: ഹദദ്
  rationale: ദിനവൃത്താന്തത്തിലെ എബ്രായപാഠം חֲדַד എന്നു വായിക്കുന്നതിനാൽ ‘ഹദദ്’ നിലനിർത്തി; ഉല്പത്തി 25:15-ലെ സമാന്തരപ്പട്ടികയിലെ വ്യത്യസ്തരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וְ/תֵימָא
  choice: തേമാ
  rationale: תֵימָא എന്ന വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; അവസാന ഇനത്തിനു മുമ്പുള്ള വാവിനെ മലയാളത്തിലെ പട്ടികാശൈലിയിൽ കോമയിലൂടെ സ്വാഭാവികമായി പ്രതിനിധീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും മാന്യവുമായ വംശാവലിപ്പട്ടികാശൈലി. വ്യക്തിനാമങ്ങൾ എബ്രായ സ്വരരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തിച്ച ‘ഉം’ ഒഴിവാക്കി പട്ടിക കോമകളാൽ ക്രമപ്പെടുത്തി.
