  source_fidelity: 'The draft conveys the principal elements of the Hebrew: dwelling places, settlements, territory, Aaron’s sons, Kohathite family affiliation, and the lot. However, the second sentence’s demonstrative construction (‘ഇവ ... ഉള്ളവയായിരുന്നു’) is syntactically heavier than necessary and slightly obscures that the dwelling places themselves are what are assigned to Aaron’s sons.'
