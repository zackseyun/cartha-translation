  yaml_path: translation/ot/1_chronicles/006/039.yaml
  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
translation:
  language: ml
  text: 'അവരുടെ പ്രദേശത്തിനുള്ളിൽ, അവരുടെ കുടിയിരിപ്പുകൾ[a] അനുസരിച്ചുള്ള വാസസ്ഥലങ്ങൾ ഇവയായിരുന്നു: കെഹാത്ത്യരുടെ കുടുംബത്തിൽപ്പെട്ട അഹരോന്റെ പുത്രന്മാർക്കുള്ളവ; നറുക്ക് അവർക്കായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുടിയിരിപ്പുകൾ’ എന്നതിന് ‘പാളയങ്ങൾ’ എന്നോ ‘ഗ്രാമങ്ങൾ’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  choice: അവരുടെ വാസസ്ഥലങ്ങൾ
  rationale: താമസിക്കുന്ന സ്ഥലങ്ങൾ എന്ന മൂർത്തമായ അർഥം സ്വാഭാവികവും ആധുനികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְטִירוֹתָם
  choice: അവരുടെ കുടിയിരിപ്പുകൾ അനുസരിച്ച്
  rationale: טִירָה എന്ന പദത്തിന് കുടിയിരിപ്പ്, പാളയം, ഗ്രാമം എന്നീ അർഥസാധ്യതകളുണ്ട്. ഭൂവിഭജനത്തിന്റെ സന്ദർഭത്തിൽ ‘കുടിയിരിപ്പുകൾ’ ഏതെങ്കിലും ഒരു പ്രത്യേക രൂപത്തിലേക്ക് അർഥം ചുരുക്കാതെ അനുയോജ്യമാണ്.
- source_word: בִּגְבוּלָם
  choice: അവരുടെ പ്രദേശത്തിനുള്ളിലെ
  rationale: גְּבוּל ഇവിടെ അതിർത്തിരേഖയെക്കാൾ അതിനുള്ളിലെ ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രദേശപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לִבְנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർക്കുള്ളവ
  rationale: വംശപരവും പുരോഹിതപരവുമായ ബൈബിൾ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפַּחַת הַקְּהָתִי
  choice: കെഹാത്യകുടുംബത്തിൽപ്പെട്ട
  rationale: അഹരോന്റെ പുത്രന്മാരുടെ വിശാലമായ കുലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  choice: കാരണം നറുക്ക് അവർക്കായിരുന്നു
  rationale: ഹീബ്രുവിലെ ഉടമസ്ഥപ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുകയും ഭൂവിഹിതം നറുക്കിലൂടെ ലഭിച്ചതെന്ന ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു; ‘നറുക്ക് അവർക്കു വീണു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ശൈലി ഒഴിവാക്കുന്നു.
