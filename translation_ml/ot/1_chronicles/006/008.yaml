translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. ഹീബ്രൂ വാക്യക്രമവും ഓരോ പേരിനോടുമുള്ള ‘അവന്റെ മകൻ’ എന്ന ആവർത്തനവും നിലനിർത്തി; വായനാസൗകര്യത്തിനായി കണ്ണികൾ അർദ്ധവിരാമങ്ങളാൽ വേർതിരിച്ചു.
