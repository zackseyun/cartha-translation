  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה בִנְיָמִ֗ן אֶת גֶּ֤בַע וְ/אֶת מִגְרָשֶׁ֨י/הָ֙ וְ/אֶת עָלֶ֣מֶת וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת עֲנָת֖וֹת וְ/אֶת מִגְרָשֶׁ֑י/הָ כָּל עָרֵי/הֶ֛ם שְׁלֹשׁ עֶשְׂרֵ֥ה עִ֖יר בְּ/מִשְׁפְּחוֹתֵי/הֶֽם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/045.yaml
  text: 'and from the tribe of Benjamin: Geba with its pasturelands[a], Alemeth with its pasturelands, and Anathoth with its pasturelands—all their cities were thirteen cities according to their families.'
translation:
  language: ml
  text: 'കൂടാതെ, ബെന്യാമീൻ ഗോത്രത്തിൽനിന്ന്: ഗേബയും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, ആലേമെത്ത്[a]യും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, അനാത്തോത്തും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും—അവരുടെ എല്ലാ പട്ടണങ്ങളും, അവരുടെ കുടുംബങ്ങൾക്കനുസരിച്ച്, ആകെ പതിമൂന്നായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘ആലേമെത്ത്’; യോശുവ 21:18-ലെ സമാന്തര പട്ടികയിൽ ‘അൽമോൻ’ എന്നു കാണുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  choice: ബെന്യാമീൻ ഗോത്രത്തിൽനിന്ന്
  rationale: പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന וּ (‘യും/കൂടാതെ’) വാക്യഘടനയിലൂടെ നിലനിർത്തുന്നു; מַטֶּה ഇവിടെ വടി എന്നല്ല, ഗോത്രവിഭാഗം എന്ന അർഥത്തിലാണ്.
- source_word: גֶּבַע
  choice: ഗേബ
  rationale: സ്ഥലപ്പേര് പരിഭാഷപ്പെടുത്താതെ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യപട്ടണങ്ങളെ ചുറ്റിയുള്ള പൊതുവായ തുറസ്സായ ഭൂമിയെയോ കന്നുകാലികൾ മേയുന്ന സ്ഥലങ്ങളെയോ സൂചിപ്പിക്കുന്ന പദം; ആധുനിക മലയാളത്തിൽ വ്യക്തമായ രൂപം.
- source_word: עָלֶמֶת
  choice: ആലേമെത്ത്
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠത്തിന്റെ സ്ഥലപ്പേര് തന്നെയാണ് മുഖ്യപാഠത്തിൽ നിലനിർത്തിയത്; യോശുവ 21:18-ലെ സമാന്തരരൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: עֲנָתוֹת
  choice: അനാത്തോത്ത്
  rationale: സ്ഥലപ്പേര് എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: כָּל עָרֵיהֶם שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: അവരുടെ പട്ടണങ്ങൾ ആകെ പതിമൂന്ന്
  rationale: പട്ടികയുടെ ആകെ എണ്ണം ചുരുക്കിപ്പറയുന്ന എബ്രായപ്രയോഗം സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകി.
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  choice: അവരുടെ കുടുംബങ്ങൾക്കനുസരിച്ച്
  rationale: מִשְׁפָּחוֹת എന്നത് വിപുലകുടുംബങ്ങളെയോ കുലവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കാം; ‘കുടുംബങ്ങൾ’ മൂലപാഠത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി സ്വീകരിച്ചു. ബന്ധിത പട്ടികയുടെ സ്വഭാവം നിലനിർത്താൻ തുടക്കത്തിൽ ‘ബെന്യാമീൻ ഗോത്രത്തിൽനിന്ന്:’ എന്ന ഘടന ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് യഥാർഥത്തിൽ ബാധകമായ ‘ആലേമെത്ത്’ എന്ന പേരിനോടുതന്നെ ചേർത്തു.
