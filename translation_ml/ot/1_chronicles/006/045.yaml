  terminology: ‘ഗോത്രം,’ ‘മേച്ചിൽപ്പുറങ്ങൾ,’ and the transliterated place names are appropriate. ‘കുടുംബങ്ങൾക്കനുസരിച്ച്’ suitably preserves the broad sense of בְּמִשְׁפְּחוֹתֵיהֶם without imposing a narrower social classification.
