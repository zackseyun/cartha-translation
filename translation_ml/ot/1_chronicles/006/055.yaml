  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
translation:
  language: ml
  text: 'മനശ്ശെയുടെ അർധഗോത്രത്തിൽനിന്ന്: ആനേരും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, ബിലെയാമും[a] അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, ശേഷിച്ച കെഹാത്തിന്റെ പുത്രന്മാരുടെ കുലത്തിനായി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠത്തിൽ ‘ബിലെയാം’ എന്നു വായിക്കുന്നു; യോശുവ 21:25-ലെ സമാന്തരഭാഗത്തിൽ ‘ഇബ്ലെയാം’ എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: മനശ്ശെയുടെ അർധഗോത്രത്തിൽനിന്ന്
  rationale: מַחֲצִית എന്നത് ‘പകുതി’ എന്നും മַטֶּה ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ ‘ഗോത്രം’ എന്നും അർഥമാക്കുന്നു; ‘അർധഗോത്രം’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: אֶת עָנֵר
  choice: ആനേർ
  rationale: സ്ഥലനാമം ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: മִגְרָש്ׁ പട്ടണത്തോടു ചേർന്ന തുറസ്സായ പൊതുഭൂമിയെയോ മേച്ചിൽഭൂമിയെയോ സൂചിപ്പിക്കുന്നു; ലേവ്യപട്ടണങ്ങളുടെ സന്ദർഭത്തിൽ ‘മേച്ചിൽപ്പുറങ്ങൾ’ വ്യക്തമാണ്.
- source_word: בִּלְעָם
  choice: ബിലെയാം
  rationale: WLC-യിലെ ഹീബ്രു പാഠം അതേപടി ലിപ്യന്തരിച്ചു; യോശുവ 21:25-ലെ സമാന്തരപാഠഭേദം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  choice: ശേഷിച്ച കെഹാത്തിന്റെ പുത്രന്മാരുടെ കുലത്തിന്
  rationale: מִשְׁפָּחָה ഇവിടെ ഒരു കുടുംബശാഖയെയോ കുലത്തെയോ സൂചിപ്പിക്കുന്ന ഏകവചന കൂട്ടനാമമാണ്; הַנּוֹתָרִים മുമ്പ് പട്ടണങ്ങൾ ലഭിക്കാതെ ശേഷിച്ച കെഹാത്ത്യ ശാഖകളെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പട്ടികാശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻവാക്യങ്ങളിൽനിന്ന് ഗ്രഹിക്കേണ്ട ‘നൽകി’ മലയാളത്തിൽ വാക്യം പൂർണമാക്കാൻ ചേർത്തു. പാഠഭേദത്തിന്റെ അടിക്കുറിപ്പ് ബന്ധപ്പെട്ട ‘ബിലെയാം’ എന്ന പേരിനോടുതന്നെ ഘടിപ്പിച്ചു.
