source:
  edition: WLC
  text: לִ/בְנֵ֣י מְרָרִי֮ הַ/נּוֹתָרִים֒ מִ/מַּטֵּ֣ה זְבוּלֻ֔ן אֶת רִמּוֹנ֖וֹ וְ/אֶת מִגְרָשֶׁ֑י/הָ אֶת תָּב֖וֹר וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
translation:
  language: ml
  text: ശേഷിച്ചിരുന്ന മെരാരിയുടെ പുത്രന്മാർക്ക് സെബൂലൂൻ ഗോത്രത്തിൽനിന്ന് രിമ്മോനോയും[a] അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും താബോരും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘രിമ്മോനോ’ എന്നാണ്; സമാന്തരവിവരണമായ യോശുവ 21:35-ൽ ‘ദിമ്നാ’ എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാർക്ക്
  rationale: വിതരണപ്പട്ടികയിൽ לְ ലഭിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ഷഷ്ഠീവിഭക്തിയിലൂടെ വ്യക്തമാക്കി.
- source_word: הַנּוֹתָרִים
  choice: ശേഷിച്ചിരുന്ന
  rationale: മുൻപത്തെ വിഹിതങ്ങൾക്കുശേഷം ശേഷിച്ച മെരാരിവംശജരെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചക രൂപത്തിന്റെ ക്രമാനുസൃത അർഥം നിലനിർത്തുന്നു.
- source_word: מִמַּטֵּה זְבוּלֻן
  choice: സെബൂലൂൻ ഗോത്രത്തിൽനിന്ന്
  rationale: വിഹിതവിതരണസന്ദർഭത്തിൽ מַטֶּה എന്നത് വടി എന്നല്ല, ഗോത്രം എന്നാണ്.
- source_word: רִמּוֹנוֹ
  choice: രിമ്മോനോ
  rationale: മസോററ്റിക് പാഠത്തിലെ സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; സമാന്തരപാഠത്തിലെ വ്യത്യാസം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യനഗരങ്ങളോടു ചേർന്ന കന്നുകാലിമേച്ചിലിനുള്ള തുറന്ന പ്രദേശങ്ങളെയാണ് ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: תָּבוֹר
  choice: താബോർ
  rationale: ഇവിടെ പട്ടണനാമമായതിനാൽ സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. എബ്രായത്തിൽ ക്രിയ പ്രകടമല്ലെങ്കിലും വിഹിതവിതരണപ്പട്ടികയുടെ അർഥം സ്വാഭാവികമാക്കാൻ ‘ലഭിച്ചു’ എന്നു ചേർത്തു. പാഠഭേദസൂചകം ബന്ധപ്പെട്ട സ്ഥലനാമത്തിനരികിൽ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
