id: 1CH.6.33
reference: 1 Chronicles 6:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּ֑ם נְתוּנִ֕ים לְ/כָ֨ל עֲבוֹדַ֔ת מִשְׁכַּ֖ן בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/033.yaml
  text: And their brothers the Levites were appointed for all the service of the tabernacle of the house of God[a].
translation:
  language: ml
  text: അവരുടെ സഹോദരന്മാരായ ലേവ്യർ ദൈവഭവനത്തിന്റെ തിരുനിവാസത്തിലെ സകല ശുശ്രൂഷയ്ക്കുമായി നിയോഗിക്കപ്പെട്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നൽകപ്പെട്ടിരുന്നു”; എബ്രായ കൃദന്തത്തിന്റെ അക്ഷരാർഥം “നൽകപ്പെട്ടവർ” എന്നാണ്; ഇവിടെ ശുശ്രൂഷാചുമതലയ്ക്കായി ഏൽപ്പിക്കപ്പെട്ടവർ എന്ന അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: അവരുടെ സഹോദരന്മാരായ
  rationale: വാവ് ഈ പട്ടികാസന്ദർഭത്തിൽ സ്വാഭാവികമായി തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ/പിന്നെ’ ചേർക്കാതെ അതിന്റെ ബന്ധം നിലനിൽക്കുന്നു. ‘സഹോദരന്മാർ’ എന്നത് എബ്രായ ബന്ധുത്വപദത്തെ സുതാര്യമായി സംരക്ഷിക്കുന്നു; ഇവിടെ സഹഗോത്രക്കാരെയും സൂചിപ്പിക്കാം.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ലേവി ഗോത്രാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന അംഗീകൃതവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: נְתוּנִים
  choice: നിയോഗിക്കപ്പെട്ടിരുന്നു
  rationale: נתן എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ കൃദന്തരൂപം അക്ഷരാർഥത്തിൽ ‘നൽകപ്പെട്ടവർ’ എന്നാണ്; ഈ ആരാധനാ-കാര്യനിർവഹണ സന്ദർഭത്തിൽ ചുമതലയ്ക്കായി ഏൽപ്പിക്കപ്പെട്ടത് എന്ന പ്രയോഗാർഥം ‘നിയോഗിക്കപ്പെട്ടിരുന്നു’ സ്വാഭാവികമായി നൽകുന്നു. അക്ഷരാർഥവികൽപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לְכָל עֲבוֹדַת
  choice: സകല ശുശ്രൂഷയ്ക്കുമായി
  rationale: לְ ഉദ്ദേശ്യം/ചുമതലയുടെ മേഖലയെയും כָל അതിന്റെ സമഗ്രതയെയും സൂചിപ്പിക്കുന്നു. ആരാധനാസംബന്ധമായ עֲבוֹדָהയ്ക്ക് ‘ശുശ്രൂഷ’ സ്വാഭാവികമാണ്; പിന്നീട് രൂപപ്പെട്ട സഭാപദവിയെ ഇവിടെ സൂചിപ്പിക്കുന്നില്ല.
- source_word: מִשְׁכַּן
  choice: തിരുനിവാസം
  rationale: മִשְׁכָּן എന്നത് ‘വാസസ്ഥലം/നിവാസം’ എന്ന ആശയമുള്ള വിശുദ്ധ കൂടാരത്തെ സൂചിപ്പിക്കുന്നു. ‘തിരുനിവാസം’ അതിന്റെ വിശുദ്ധവും ആരാധനാസംബന്ധവുമായ സ്വഭാവം ആധുനിക മലയാളത്തിൽ മാന്യമായി അറിയിക്കുന്നു.
- source_word: בֵּית הָאֱלֹהִים
  choice: ദൈവഭവനം
  rationale: അക്ഷരാർഥമായ ‘ദൈവത്തിന്റെ ഭവനം’ എന്നതിന്റെ സ്വാഭാവിക സംയുക്തരൂപം; ‘ദേവാലയം’ എന്നു മാറ്റി മִשְׁכָּן-ഉം בֵּית-ഉം തമ്മിലുള്ള വ്യത്യാസം ഇല്ലാതാക്കുന്നില്ല.
theological_decisions:
- issue: ദിനവൃത്താന്തസന്ദർഭത്തിൽ ‘തിരുനിവാസം’ എന്നും ‘ദൈവഭവനം’ എന്നും ഉള്ള പദങ്ങളുടെ ബന്ധം
  choice: രണ്ടു പദങ്ങളും വേർതിരിച്ചു ‘ദൈവഭവനത്തിന്റെ തിരുനിവാസം’ എന്നു നൽകി.
  alternative: ‘ദൈവത്തിന്റെ ദേവാലയം’ അല്ലെങ്കിൽ ‘ദൈവഭവനം’ എന്ന ഒറ്റ പദപ്രയോഗത്തിലേക്ക് ചുരുക്കുക.
  rationale: എബ്രായത്തിൽ מִשְׁכַּן, בֵּית הָאֱלֹהִים എന്നീ രണ്ടു പ്രയോഗങ്ങളും ഉണ്ട്. രണ്ടും നിലനിർത്തുന്നത് തിരുനിവാസഭാഷയും ഭവന/ആലയഭാഷയും തമ്മിലുള്ള വാചകസമ്മർദം മായ്ച്ചുകളയാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ആരാധനാ-ചരിത്ര രജിസ്റ്റർ. ‘ശുശ്രൂഷ’ ആരാധനാസംബന്ധമായ സേവനം/വേല എന്ന അർഥത്തിലാണ്; സഭാപദവി സൂചിപ്പിക്കാൻ അല്ല. ‘തിരുനിവാസം’യും ‘ദൈവഭവനം’യും വേർതിരിച്ച് മൂലത്തിലെ ഇരട്ടപ്രയോഗം നിലനിർത്തിയിരിക്കുന്നു.
