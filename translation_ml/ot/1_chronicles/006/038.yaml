- source_word: צָדוֹק
  choice: സാദോക്ക്
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തെ മലയാളലിപിയിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: בֵּן എന്ന നാമത്തോടു ചേർന്ന മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം അക്ഷരാർഥത്തിൽ ‘അവന്റെ മകൻ’ എന്നാണ്; വംശാവലിയുടെ ചുരുക്കഘടന നിലനിർത്തി.
- source_word: אֲחִימַעַץ
  choice: അഹീമയാസ്
  rationale: വ്യക്തിനാമം; എബ്രായ രൂപത്തെ മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: ആവർത്തിക്കുന്ന വംശാവലിസൂത്രം ഒരേ രീതിയിൽ പരിഭാഷപ്പെടുത്തി, ബന്ധക്രമവും എബ്രായത്തിന്റെ സംക്ഷിപ്തതയും സംരക്ഷിച്ചു.
