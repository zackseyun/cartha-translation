id: 1CH.6.1
reference: 1 Chronicles 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֖י לֵוִ֑י גֵּרְשֹׁ֕ם קְהָ֖ת וּ/מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/001.yaml
  text: 'The sons of Levi: Gershom[a], Kohath[b], and Merari.'
translation:
  language: ml
  text: 'ലേവിയുടെ പുത്രന്മാർ[a]: ഗേർശോം[b], കെഹാത്ത്, മെരാരി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ വംശാവലിഭാഷയിൽ ‘പുത്രന്മാർ’ എന്നത് ചില സന്ദർഭങ്ങളിൽ വിശാലമായി ‘സന്തതികൾ’ എന്നും അർഥമാക്കാം. ഇവിടെ ലേവിയുടെ നേരിട്ടുള്ള പുത്രന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: എബ്രായ പാഠത്തിൽ ഇവിടെ ‘ഗേർശോം’ എന്നാണ്; ബന്ധപ്പെട്ട ചില വംശാവലിപ്പാഠങ്ങളിൽ ‘ഗേർശോൻ’ എന്ന രൂപവും കാണപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ നിർമാണബഹുവചനം. വംശാവലികളിൽ ഇത് ചിലപ്പോൾ വിശാലമായ അർഥത്തിൽ ‘സന്തതികൾ’ എന്നു സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ പറയുന്നത് ലേവിയുടെ നേരിട്ടുള്ള പുത്രന്മാരെയാണ്; അതിനാൽ ‘പുത്രന്മാർ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: לֵוִי
  choice: ലേവി
  rationale: വ്യക്തിനാമം; മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപം നിലനിർത്തി.
- source_word: גֵּרְשֹׁם
  choice: ഗേർശോം
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് പാഠമായ גֵּרְשֹׁם എന്ന രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ബന്ധപ്പെട്ട ഭാഗങ്ങളിൽ കാണുന്ന ‘ഗേർശോൻ’ എന്ന പാഠരൂപത്തിലേക്ക് ഏകീകരിച്ചിട്ടില്ല.
- source_word: קְהָת
  choice: കെഹാത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ വ്യക്തമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: וּמְרָרִי
  choice: മെരാരി
  rationale: ו എന്ന സംയോജകത്തിന് പട്ടികയിലെ അവസാന അംഗത്തിനു മുമ്പുള്ള മലയാള കോമ മതിയായതിനാൽ പ്രത്യേകം ‘എന്നിവർ’ അല്ലെങ്കിൽ ‘കൂടാതെ’ ചേർക്കാതെ, മְרָרִי എന്ന വ്യക്തിനാമം ‘മെരാരി’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. മൂലപാഠത്തിലെ ചുരുക്കപ്പട്ടികാ ഘടന നിലനിർത്തിയിരിക്കുന്നു; വ്യക്തിനാമങ്ങൾ മലയാള വായനക്കാർക്ക് ഉച്ചരിക്കാവുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
