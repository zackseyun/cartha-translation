source:
  edition: WLC
  text: לִ/בְנֵי֮ גֵּרְשׁוֹם֒ מִ/מִּשְׁפַּ֗חַת חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת גּוֹלָ֥ן בַּ/בָּשָׁ֖ן וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת עַשְׁתָּר֖וֹת וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
translation:
  language: ml
  text: 'ഗേർശോമിന്റെ പുത്രന്മാർക്ക്, മനശ്ശെയുടെ അർധഗോത്രത്തിലെ കുലത്തിൽനിന്ന്: ബാശാനിലെ ഗോലാനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], അഷ്ടാരോത്തും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പൊതുഭൂമികളും’; ഒരു പട്ടണത്തോടു ചേർന്നതും പലപ്പോഴും കന്നുകാലികളെ മേയ്ക്കാൻ ഉപയോഗിച്ചിരുന്നതുമായ തുറസ്സായ ഭൂമിയെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  choice: ഗേർശോമിന്റെ പുത്രന്മാർക്ക്
  rationale: ലְ ഉപസർഗം ഇവിടെ വിഹിതം ലഭിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു. 'പുത്രന്മാർ' എന്നത് വംശാവലിസംബന്ധിയായ എബ്രായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു; സന്ദർഭത്തിൽ പിൻതലമുറക്കാരെയും ഉൾക്കൊള്ളാം.
- source_word: מִמִּשְׁפַּחַת
  choice: കുലത്തിൽനിന്ന്
  rationale: ഗോത്രത്തിനുള്ളിലെ ഒരു വംശവിഭാഗത്തെയാണ് מִשְׁפָּחָה ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആ അർത്ഥത്തിൽ 'കുലം' സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: חֲצִי מַטֵּה מְנַשֶּׁה
  choice: മനശ്ശെയുടെ അർധഗോത്രം
  rationale: മനശ്ശെഗോത്രത്തിന്റെ ഭൂപ്രദേശപരമായ പകുതിയെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ഗോത്രപ്രയോഗം.
- source_word: גּוֹלָן בַּבָּשָׁן
  choice: ബാശാനിലെ ഗോലാൻ
  rationale: ഗോലാൻ പട്ടണവും ബാശാൻ അതു സ്ഥിതിചെയ്യുന്ന പ്രദേശവുമാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യപട്ടണത്തിനു ചുറ്റുമുള്ള, പ്രധാനമായും കന്നുകാലികളെ മേയ്ക്കാൻ ഉപയോഗിച്ചിരുന്ന തുറസ്സായ പൊതുഭൂമിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: עַשְׁתָּרוֹת
  choice: അഷ്ടാരോത്ത്
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്യുന്നു.
