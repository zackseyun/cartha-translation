translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലവാക്യം പട്ടികയുടെ ഭാഗമായതിനാൽ മലയാളത്തിൽ വാക്യം പൂർണമാക്കാൻ ‘ലഭിച്ചു’ ചേർത്തിരിക്കുന്നു. സ്ഥലനാമങ്ങൾ നിലവിലെ മലയാള ബൈബിൾ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
