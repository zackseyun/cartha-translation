source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה יִשָׂשכָ֔ר אֶת קֶ֖דֶשׁ וְ/אֶת מִגְרָשֶׁ֑י/הָ אֶת דָּבְרַ֖ת וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/057.yaml
  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
translation:
  language: ml
  text: 'പിന്നെ യിസ്സാഖാർ ഗോത്രത്തിൽനിന്ന്: കേദെശും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, ദാബെരത്തും[a] അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ സ്ഥലനാമം ചില ഇംഗ്ലീഷ് വിവർത്തനങ്ങളിൽ “Dabareth” എന്നും എഴുതിയിട്ടുണ്ട്; യോശുവ 21:28-ലും ഈ നഗരം പട്ടികപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: പട്ടിക തുടരുന്ന സന്ദർഭത്തിൽ מַטֶּה ഒരു ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടനയ്ക്കായി തുടക്കത്തിലെ സംയോജകത്തെ പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല; ദ്വിബിന്ദു തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: יִשָׂשכָר
  choice: യിസ്സാഖാർ
  rationale: ഹീബ്രു ഗോത്രനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: קֶדֶשׁ
  choice: കേദെശ്
  rationale: സ്ഥലനാമം അർഥവിവർത്തനം ചെയ്യാതെ ഹീബ്രുവിൽനിന്ന് ലിപ്യന്തരിച്ചു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ഭൂമിശാസ്ത്രവിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യനഗരത്തിനു ചുറ്റുമുള്ള പൊതുവായ തുറന്ന മേച്ചിൽഭൂമിയെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്. നഗരത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന സ്ത്രീലിംഗ പ്രത്യയം ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: דָּבְרַת
  choice: ദാബെരത്ത്
  rationale: സ്ഥലനാമം ഹീബ്രു രൂപത്തെ പിന്തുടർന്ന് ലിപ്യന്തരിച്ചു. സമാന്തര പട്ടികയിലെ അക്ഷരവ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
