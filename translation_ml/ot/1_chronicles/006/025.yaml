  yaml_path: translation/ot/1_chronicles/006/025.yaml
  text: son of Michael[a], son of Baaseiah[b], son of Malkijah.
translation:
  language: ml
  text: മീഖായേലിന്റെ മകൻ, ബയശേയാവിന്റെ മകൻ[a], മൽക്കീയാവിന്റെ മകൻ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ലഭ്യമായ എബ്രായ പാഠത്തിലെ പേര് בַּעֲשֵׂיָה (ബയശേയാവ്) എന്നാണ്. മറ്റു വംശാവലികളിലും ചില വിവർത്തനപാരമ്പര്യങ്ങളിലും കാണുന്ന സമാനമായ ‘മയശേയാവ്’ എന്ന പേരുമായി ഇതിന് ബന്ധമുണ്ടെന്നു ചിലർ കരുതുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ പേരിനെ ‘മൽക്കിയാവ്’ എന്നും ലിപ്യന്തരം ചെയ്യാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിയുടെ കണ്ണികളിൽ നേരിട്ടുള്ള പുത്രബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായരൂപവും അതിന്റെ ആവർത്തനലയവും നിലനിർത്തുന്നു.
- source_word: מִיכָאֵל
  choice: മീഖായേൽ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാള ബൈബിൾനാമശൈലിക്ക് യോജിച്ചതുമായ ലിപ്യന്തരണം.
- source_word: בַּעֲשֵׂיָה
  choice: ബയശേയാ
  rationale: ലഭ്യമായ എബ്രായ പാഠത്തിലെ ബേത്, അയിൻ, ശീൻ എന്നീ വ്യഞ്ജനങ്ങളെയും സ്വരക്രമത്തെയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു; പരിചിതമായ ‘മയശേയാ’ എന്ന മറ്റൊരു പേരാക്കി മാറ്റുന്നില്ല.
- source_word: מַלְכִּיָּה
  choice: മൽക്കീയാ
  rationale: എബ്രായ നാമത്തിലെ മൽക്കി-യാ ഘടനയോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ എബ്രായ വംശാവലിയുടെ സംക്ഷിപ്ത ഘടനയും ‘മകൻ’ എന്ന ആവർത്തനവും നിലനിർത്തി. ഇംഗ്ലീഷ് ആലോചനാപാഠത്തിലെ അടിക്കുറിപ്പുസൂചകങ്ങൾ ബന്ധപ്പെട്ട പേരുകളുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, അവ യഥാക്രമം ബയശേയാ, മൽക്കീയാ എന്നീ പേരുകളോട് ചേർത്തു.
