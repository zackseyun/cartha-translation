source:
  edition: WLC
  text: וְ/אָחִ֣י/ו אָסָ֔ף הָ/עֹמֵ֖ד עַל יְמִינ֑/וֹ אָסָ֥ף בֶּן בֶּרֶכְיָ֖הוּ בֶּן שִׁמְעָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
translation:
  language: ml
  text: അവന്റെ വലതുവശത്ത് നിന്നിരുന്നത് അവന്റെ സഹോദരനായ ആസാഫ്[a] ആയിരുന്നു—ശിമെയാവിന്റെ മകനായ ബെരെഖ്യാവിന്റെ മകൻ ആസാഫ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അവന്റെ വലതുകൈയുടെ ഭാഗത്ത്’; എബ്രായപ്രയോഗം ഒരാളുടെ വലതുവശത്തുള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָחִיו
  choice: അവന്റെ സഹോദരനായ
  rationale: וְ എന്ന സംയോജകത്തിന്റെ ബന്ധം വാക്യഘടനയിൽ സ്വാഭാവികമായി നിലനിർത്തി; אָחִיו എന്നതിന്റെ സാധാരണ അർഥമായ ‘അവന്റെ സഹോദരൻ’ സ്വീകരിച്ചു. വിശാലമായ ‘ബന്ധു’ എന്ന അർഥത്തിന് ഇവിടെ സന്ദർഭപരമായ നിർബന്ധമില്ല.
- source_word: אָסָף
  choice: ആസാഫ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി; എബ്രായപാഠത്തിലെ ആവർത്തനം വാക്യാവസാനത്തും നിലനിർത്തി.
- source_word: הָעֹמֵד
  choice: നിന്നിരുന്നത്
  rationale: עמד എന്ന ക്രിയയുടെ ഖാൽ വർത്തമാനകൃദ്യന്തം സൂചിപ്പിക്കുന്ന സ്ഥിരമായ സ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സേവനക്രമത്തിലെ സ്ഥാനവിവരണവും നിലനിൽക്കുന്നു.
- source_word: עַל יְמִינוֹ
  choice: അവന്റെ വലതുവശത്ത്
  rationale: പ്രയോഗം ഒരാളുടെ വലതുഭാഗത്തുള്ള സ്ഥാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘വലതുവശത്ത്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בֶּן בֶּרֶכְיָהוּ בֶּן שִׁמְעָא
  choice: ശിമെയാവിന്റെ മകനായ ബെരെഖ്യാവിന്റെ മകൻ
  rationale: 'എബ്രായ വംശാവലിശൃംഖലയുടെ ബന്ധം മലയാളത്തിൽ സംശയമില്ലാതെ വ്യക്തമാക്കുന്നു: ആസാഫ് ബെരെഖ്യാവിന്റെ മകനും ബെരെഖ്യാവ് ശിമെയാവിന്റെ മകനുമാണ്.'
- source_word: בֶּרֶכְיָהוּ
  choice: ബെരെഖ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: שִׁמְעָא
  choice: ശിമെയാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
