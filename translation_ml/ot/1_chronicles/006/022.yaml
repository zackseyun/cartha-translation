id: 1CH.6.22
reference: 1 Chronicles 6:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בֶּן תַּ֨חַת֙ בֶּן אַסִּ֔יר בֶּן אֶבְיָסָ֖ף בֶּן קֹֽרַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/022.yaml
  text: son of Tahath[a], son of Assir, son of Ebiasaph, son of Korah.
translation:
  language: ml
  text: തഹത്തിന്റെ മകൻ, അസ്സീറിന്റെ മകൻ, എബ്യാസാഫിന്റെ മകൻ, കോരഹിന്റെ മകൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിയുടെ പട്ടികാരൂപത്തിൽ നേരിട്ടുള്ള പുത്രബന്ധം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സുതാര്യവുമായ മലയാളപദം. വംശാവലികളിൽ തലമുറകൾ ഒഴിവാകാൻ സാധ്യതയുണ്ടെങ്കിലും, ഇവിടെ ‘വംശജൻ’ എന്ന വിശാലമായ അർഥം നിർബന്ധമല്ല.
- source_word: תַּחַת
  choice: തഹത്ത്
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אַסִּיר
  choice: അസ്സീർ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ഇരട്ട വ്യഞ്ജനവും ദീർഘസ്വരവും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֶבְיָסָף
  choice: എബ്യാസാഫ്
  rationale: മസൊരറ്റിക് പാഠത്തിലെ സ്വരീകരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: קֹרַח
  choice: കോരഹ്
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; അവസാനത്തെ ח എന്ന വ്യഞ്ജനത്തെ ‘ഹ്’ കൊണ്ട് ഏകദേശമായി പ്രതിനിധീകരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആവർത്തിതമായ ഹീബ്രായ വംശാവലിഘടന നിലനിർത്തിക്കൊണ്ട്, ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് അടിക്കുറിപ്പിലെ Ebiasaph/Abiasaph വ്യത്യാസം ഇംഗ്ലീഷ് അക്ഷരരൂപങ്ങളുടെ വ്യത്യാസമായതിനാൽ മലയാള പാഠത്തിൽ പ്രത്യേക അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
