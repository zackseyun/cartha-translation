translation:
  language: ml
  text: മഹ്ലിയുടെ മകൻ, മൂശിയുടെ മകൻ, മെരാരിയുടെ മകൻ, ലേവിയുടെ മകൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: മകൻ
  rationale: ആവർത്തിക്കുന്ന എബ്രായ വംശാവലിസൂത്രത്തിന് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം. വംശാവലികൾ ചിലപ്പോൾ തലമുറകൾ ഒഴിവാക്കാമെങ്കിലും, ഇവിടെ ‘സന്തതി’ എന്നു വ്യാപിപ്പിക്കേണ്ട സാഹചര്യമില്ല.
- source_word: מַחְלִי
  choice: മഹ്ലി
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാളലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: מוּשִׁי
  choice: മൂശി
  rationale: വ്യക്തിനാമം എബ്രായ സ്വരദൈർഘ്യം പ്രതിഫലിപ്പിക്കുന്ന മലയാളലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: מְרָרִי
  choice: മെരാരി
  rationale: വ്യക്തിനാമം എബ്രായ രൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാളലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: לֵוִי
  choice: ലേവി
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ സുപരിചിതമായ വേദപുസ്തക രൂപത്തിൽ നൽകി; ഇവിടെ ഗോത്രത്തെ അമൂർത്തമായി സൂചിപ്പിക്കുന്നതല്ല, പൂർവപിതാവായ ലേവിയെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. മൂലത്തിലെ ആവർത്തനഘടന അതേപടി നിലനിർത്തി.
