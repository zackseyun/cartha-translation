  source_fidelity: 'എബ്രായ മൂലത്തിലെ ആവർത്തിച്ചുള്ള בֶּן (‘മകൻ’) എന്ന വംശാവലിഘടനയും പേരുകളുടെ ക്രമവും കൃത്യമായി നിലനിൽക്കുന്നു: മഹ്ലി, മൂശി, മെരാരി, ലേവി. ‘സന്തതി’ പോലുള്ള വിശാലമായ രൂപം സ്വീകരിക്കാതെ നേരിട്ടുള്ള ‘മകൻ’ ഉപയോഗിച്ചിരിക്കുന്നത് മൂലത്തിനും ഇംഗ്ലീഷ് POB തീരുമാനത്തിനും യോജിച്ചതാണ്.'
