translation:
  language: ml
  text: ശിമെയാവു, അവന്റെ മകൻ[a]; ഹഗ്ഗീയാവു, അവന്റെ മകൻ; അസായാവു, അവന്റെ മകൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ വംശാവലിയുടെ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവന്റെ മകൻ … അവന്റെ മകൻ … അവന്റെ മകൻ’ എന്ന് ആവർത്തിക്കുന്നു; ഇത് വംശപരമ്പരയിലെ തുടർച്ചയായ തലമുറകളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעָא
  choice: ശിമെയാ
  rationale: വ്യക്തിനാമം അർഥം വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: בְנוֹ
  choice: അവന്റെ മകൻ
  rationale: בֵּן എന്ന നാമത്തോടു ചേർന്ന മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം നേരിട്ടുള്ള വംശപരമ്പര സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി.
- source_word: חַגִּיָּה
  choice: ഹഗ്ഗീയാവു
  rationale: വ്യക്തിനാമം എബ്രായ രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; അവസാനത്തെ യാഹ് ഘടകം മലയാള ബൈബിൾ നാമരീതിയിൽ സ്വാഭാവികമായി ‘യാവു’ എന്നു പ്രതിനിധീകരിച്ചു.
- source_word: עֲשָׂיָה
  choice: അസായാവു
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ എബ്രായ രൂപത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണമായി നൽകി; ശׂ ധ്വനി ഇവിടെ ‘സ’ ആയി പ്രതിനിധീകരിച്ചു.
