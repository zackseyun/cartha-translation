lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ ഖാൽ വയ്യിഖ്തോൽ രൂപം തുടർച്ചയായ ഭൂതകാല ആഖ്യാനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കർത്താവിനെ ആദ്യം വെച്ച് ലളിതമായ ഭൂതകാലക്രിയ ഉപയോഗിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: לָהֶם
  choice: അവർക്ക്
  rationale: ל എന്ന ഉപസർഗം പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ദത്തിവിഭക്തിയായ ‘അവർക്ക്’ അതിനെ കൃത്യമായി നൽകുന്നു.
- source_word: חֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: സ്ഥലനാമം ആധുനിക മലയാളത്തിൽ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: യെഹൂദാദേശത്തിലെ
  rationale: אֶרֶץ എന്നതിന്റെ ‘ദേശം/പ്രദേശം’ എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ … മേച്ചിൽപ്പുറങ്ങളും
  rationale: മִגְרָש്ׁ പട്ടണത്തോടു ചേർന്ന തുറസ്സായ പൊതുഭൂമിയെ, പലപ്പോഴും മേയ്ക്കാൻ ഉപയോഗിച്ച ഭൂമിയെ, സൂചിപ്പിക്കുന്നു. ‘മേച്ചിൽപ്പുറങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് അതിന്റെ പ്രധാന ഉപയോഗം വ്യക്തമാക്കുന്നു; വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: סְבִיבֹתֶיהָ
  choice: ചുറ്റുമുള്ള
  rationale: ഹെബ്രോനെ ചുറ്റിയുള്ള ഭൂമിയാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
