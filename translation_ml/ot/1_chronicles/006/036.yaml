translation:
  language: ml
  text: അവന്റെ മകൻ ബുക്കി; അവന്റെ മകൻ ഉസ്സി; അവന്റെ മകൻ സെരഹ്യാവ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֻּקִּי
  choice: ബുക്കി
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: בְנ/וֹ
  choice: അവന്റെ മകൻ
  rationale: בֵּן എന്ന പദത്തോടു ചേർന്ന മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം അക്ഷരാർഥത്തിൽ ‘അവന്റെ മകൻ’ എന്നാണ്; വംശാവലിയിലെ ആവർത്തിത ബന്ധസൂത്രം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֻזִּי
  choice: ഉസ്സി
  rationale: വ്യക്തിനാമം എബ്രായത്തിലെ ഊന്നിയ /z/ വ്യഞ്ജനത്തെ മലയാളത്തിലെ ഇരട്ട ‘സ്സ’ ഉപയോഗിച്ച് ലിപ്യന്തരിച്ചു.
- source_word: זְרַחְיָה
  choice: സെരഹ്യാവ്
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ ലിപ്യന്തരിച്ചു; അവസാനത്തെ ദൈവനാമഘടകമായ יָהּ മലയാള ബൈബിൾ നാമരീതിയോട് യോജിക്കുന്ന ‘യാവ്’ രൂപത്തിൽ പ്രതിനിധീകരിച്ചു.
theological_decisions: []
