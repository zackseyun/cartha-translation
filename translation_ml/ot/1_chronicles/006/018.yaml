id: 1CH.6.18
reference: 1 Chronicles 6:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֥לֶּה הָ/עֹמְדִ֖ים וּ/בְנֵי/הֶ֑ם מִ/בְּנֵי֙ הַ/קְּהָתִ֔י הֵימָן֙ הַ/מְשׁוֹרֵ֔ר בֶּן יוֹאֵ֖ל בֶּן שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
translation:
  language: ml
  text: 'നിലകൊണ്ടവരും[a] അവരുടെ പുത്രന്മാരും ഇവരാണ്: കെഹാത്തിന്റെ സന്തതികളിൽനിന്ന്[b] ഗായകനായ ഹേമാൻ—യോവേലിന്റെ മകൻ, ശമൂവേലിന്റെ മകൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശുശ്രൂഷയിൽ നിലകൊണ്ടവർ’; ഇവിടെ ഔദ്യോഗിക ശുശ്രൂഷയിൽ ഏർപ്പെട്ടവരെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കെഹാത്യരിൽനിന്ന്.’ ഹീബ്രുവിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘കെഹാത്യന്റെ പുത്രന്മാരിൽനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവരാണ്
  rationale: പുതിയ പട്ടികയെ പരിചയപ്പെടുത്തുന്ന പ്രയോഗം. വാവിന്റെ ബന്ധകഭാവം തുടർന്നുള്ള ‘അവരുടെ പുത്രന്മാരും’ എന്നതിലൂടെ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: הָעֹמְדִים
  choice: നിന്നവർ
  rationale: עמד എന്ന ക്രിയയുടെ അടിസ്ഥാന ദൃശ്യമായ ‘നിൽക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഔദ്യോഗിക ശുശ്രൂഷയിൽ നിലകൊള്ളുന്നതിനെ സൂചിപ്പിക്കാമെങ്കിലും, ‘ശുശ്രൂഷിച്ചവർ’ എന്നു വ്യാഖ്യാനിച്ച് ഉറപ്പിക്കുന്നില്ല.
- source_word: וּבְנֵיהֶם
  choice: അവരുടെ പുത്രന്മാരും
  rationale: ലളിതമായ ഹീബ്രു ബന്ധകമായ വാവും ‘പുത്രന്മാർ’ എന്ന നേരിട്ടുള്ള അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: מִבְּנֵי הַקְּהָתִי
  choice: കെഹാത്യരുടെ പുത്രന്മാരിൽനിന്ന്
  rationale: വംശപരമായ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം സാധ്യമായത്ര നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: הֵימָן
  choice: ഹേമാൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: הַמְשׁוֹרֵר
  choice: ഗായകനായ
  rationale: പാടുന്നയാളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ വിവർത്തനം.
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  choice: യോവേലിന്റെ മകൻ, ശമൂവേലിന്റെ മകൻ
  rationale: ഹീബ്രുവിലെ വംശാവലിശൃംഖലയുടെ സംക്ഷിപ്ത രൂപം അതേ ക്രമത്തിൽ നിലനിർത്തുന്നു; രണ്ടാമത്തെ ‘മകൻ’ യോവേലിനെ വിശേഷിപ്പിക്കുന്നതായി വംശാവലിരീതി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: הָעֹמְדִים എന്നതിന്റെ ഔദ്യോഗിക-ശുശ്രൂഷാസൂചന
  choice: നിന്നവർ
  alternative: ശുശ്രൂഷിച്ചവർ / ശുശ്രൂഷയ്ക്കായി നിയമിക്കപ്പെട്ടവർ
  rationale: മൂലപദത്തിന്റെ ദൃശ്യവും സന്ദർഭത്തിൽ സാധ്യമായ ഔദ്യോഗിക അർഥവും തമ്മിലുള്ള സംഘർഷം വ്യാഖ്യാനത്തിലൂടെ തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. വംശാവലിയുടെ സംക്ഷിപ്തതയും ‘നിന്നവർ’ എന്ന മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗവും സംരക്ഷിച്ചിരിക്കുന്നു.
