revisions:
- from: അഹരോനും അവന്റെ പുത്രന്മാരും ഹോമയാഗപീഠത്തിന്മേലും ധൂപപീഠത്തിന്മേലും അർപ്പണങ്ങൾ ദഹിപ്പിച്ചുപോന്നു. അതിവിശുദ്ധസ്ഥലത്തിലെ[a] എല്ലാ ശുശ്രൂഷകളും നിർവഹിക്കാനും ഇസ്രായേലിനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കാനും ദൈവത്തിന്റെ ദാസനായ മോശ കല്പിച്ചതൊക്കെയും അനുസരിച്ചായിരുന്നു അവർ അങ്ങനെ ചെയ്തത്.
