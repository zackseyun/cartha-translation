  text: וְֽ/אַהֲרֹ֨ן וּ/בָנָ֜י/ו מַקְטִירִ֨ים עַל מִזְבַּ֤ח הָֽ/עוֹלָה֙ וְ/עַל מִזְבַּ֣ח הַ/קְּטֹ֔רֶת לְ/כֹ֕ל מְלֶ֖אכֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים וּ/לְ/כַפֵּר֙ עַל יִשְׂרָאֵ֔ל כְּ/כֹל֙ אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד הָ/אֱלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
translation:
  language: ml
  text: ദൈവത്തിന്റെ ദാസനായ മോശ കൽപ്പിച്ചതെല്ലാം അനുസരിച്ച്, അഹരോനും അവന്റെ പുത്രന്മാരും ഹോമയാഗപീഠത്തിന്മേലും ധൂപപീഠത്തിന്മേലും അർപ്പണങ്ങൾ ദഹിപ്പിച്ചുപോന്നു; അതിവിശുദ്ധസ്ഥലവുമായി ബന്ധപ്പെട്ട സകല ശുശ്രൂഷകളും നിർവഹിക്കുകയും ഇസ്രായേലിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശുദ്ധവിശുദ്ധം”; സന്ദർഭം അനുസരിച്ച് എബ്രായ പ്രയോഗത്തിന് “അതിവിശുദ്ധമായ കാര്യങ്ങൾ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְטִירִים
  choice: അർപ്പണങ്ങൾ ദഹിപ്പിച്ചുപോന്നു
  rationale: ഹിഫീൽ രൂപം യാഗവസ്തുക്കളോ ധൂപമോ പുകയായി ഉയരത്തക്കവിധം ദഹിപ്പിക്കുന്ന പുരോഹിതപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ഹോമയാഗപീഠത്തെയും ധൂപപീഠത്തെയും ഒരുപോലെ ഉൾക്കൊള്ളാൻ ‘അർപ്പണങ്ങൾ’ എന്ന വിശാലപദം ഉപയോഗിച്ചു.
- source_word: מִזְבַּח הָעֹלָה
  choice: ഹോമയാഗപീഠം
  rationale: עֹלָה എന്ന സമ്പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗവുമായി ബന്ധപ്പെട്ട പീഠത്തിനുള്ള മലയാളത്തിലെ വ്യക്തവും പരിചിതവുമായ സമാനപദം.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ധൂപപീഠം
  rationale: ധൂപം ദഹിപ്പിക്കുന്ന പീഠത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: לְכֹל מְלֶאכֶת
  choice: എല്ലാ ശുശ്രൂഷകളും നിർവഹിക്കാൻ
  rationale: വിശുദ്ധമന്ദിരസന്ദർഭത്തിൽ מְלָאכָה ഏല്പിക്കപ്പെട്ട ജോലി അഥവാ സേവനത്തെ സൂചിപ്പിക്കുന്നു; ‘ശുശ്രൂഷ’ പുരോഹിതകർമത്തിന്റെ സ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: അതിവിശുദ്ധസ്ഥലം
  rationale: ഈ എബ്രായ പ്രയോഗം വിശുദ്ധമന്ദിരത്തിലെ ഏറ്റവും വിശുദ്ധമായ ഉൾസ്ഥലത്തെ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ സ്ഥലസൂചന സ്വീകരിച്ചെങ്കിലും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וּלְכַפֵּר עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കാൻ
  rationale: כפר എന്ന യാഗപരമായ പദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; പ്രായശ്ചിത്തത്തിന്റെ രീതി സംബന്ധിച്ച പ്രത്യേക സിദ്ധാന്തം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: കല്പിച്ചതൊക്കെയും അനുസരിച്ച്
  rationale: മോശയുടെ കല്പനയുടെ സമ്പൂർണ പരിധിയോടുള്ള അനുരൂപത വ്യക്തമാക്കുന്നു.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ദാസൻ
  rationale: മോശയ്ക്കുള്ള ഔപചാരികമായ വിശേഷണം ഗൗരവത്തോടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים എന്നതിന്റെ സൂചിതാർഥം
  choice: അതിവിശുദ്ധസ്ഥലം എന്ന സ്ഥലസൂചന
  alternative: വിശുദ്ധാതിവിശുദ്ധസ്ഥലം; അതിവിശുദ്ധമായ കാര്യങ്ങൾ
  rationale: പുരോഹിതശുശ്രൂഷയും പ്രായശ്ചിത്തവും പറയുന്ന സമീപസന്ദർഭത്തിൽ ഉള്ളറയായ വിശുദ്ധസ്ഥലം സാധ്യമായ വായനയാണ്. എങ്കിലും എബ്രായത്തിലെ വസ്തു/കാര്യസൂചനയുടെ സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
- issue: כפר എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പ്രായശ്ചിത്തം കഴിക്കുക
  alternative: പരിഹാരം ചെയ്യുക
  rationale: യാഗപരവും ഉടമ്പടിസംബന്ധവുമായ പദത്തിന്റെ വിശാലത നിലനിർത്തുകയും ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തത്തിലേക്ക് അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. നീണ്ട എബ്രായ വാക്യത്തിലെ പ്രവർത്തനവും ഉദ്ദേശ്യങ്ങളും വ്യക്തമാക്കാൻ മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി; രണ്ടാം വാക്യത്തിലെ ‘അങ്ങനെ ചെയ്തത്’ ആദ്യവാക്യത്തിലെ പുരോഹിതപ്രവൃത്തിയെ തിരിച്ചുചൂണ്ടുന്നു.
