  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ സ്ഥാനസൂചനയും കുടുംബബന്ധഭാഷയും സംരക്ഷിച്ചു; പേരുകളുടെ നിര ആശയക്കുഴപ്പമില്ലാതെ വായിക്കാൻ ആവർത്തിച്ച വംശാവലിസൂത്രം ഉപയോഗിച്ചു.
