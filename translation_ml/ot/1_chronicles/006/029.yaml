reference: 1 Chronicles 6:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֧י מְרָרִ֛י אֲחֵי/הֶ֖ם עַֽל הַ/שְּׂמֹ֑אול אֵיתָן֙ בֶּן קִישִׁ֔י בֶּן עַבְדִּ֖י בֶּן מַלּֽוּךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/029.yaml
  text: 'And the sons of Merari[a], their brothers, were on the left: Ethan son of Kishi, son of Abdi, son of Malluch.'
translation:
  language: ml
  text: 'അവരുടെ സഹോദരന്മാരായ മെരാരിയുടെ പുത്രന്മാർ[a] ഇടതുവശത്തായിരുന്നു: കീഷിയുടെ മകൻ, അബ്ദിയുടെ മകൻ, മല്ലൂക്കിന്റെ മകൻ ഏഥാൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ ബന്ധുക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; വംശാവലി പശ്ചാത്തലങ്ങളിൽ ‘സഹോദരന്മാർ’ എന്ന എബ്രായപദം ഒരേ കുലത്തിലെ അംഗങ്ങളെയും വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാരായ
  rationale: בְנֵי എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു; ഇവിടെ അത് മെരാരിയുടെ വംശപരമ്പരയെയും സൂചിപ്പിക്കാം. വാക്യത്തിലെ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ വിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: אֲחֵיהֶם
  choice: അവരുടെ സഹോദരന്മാർ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധഭാഷ നേരിട്ട് നിലനിർത്തുന്നു; വംശാവലി പശ്ചാത്തലത്തിൽ ഇത് വിശാലമായി ഒരേ കുലത്തിലെ ബന്ധുക്കളെയും സൂചിപ്പിക്കാം, അതിനാൽ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: עַל הַשְּׂמֹאול
  choice: ഇടതുവശത്തായിരുന്നു
  rationale: അക്ഷരാർഥമായ സ്ഥലസൂചന നിലനിർത്തുന്നു. എബ്രായത്തിൽ ഒഴിവാക്കിയിരിക്കുന്ന ക്രിയ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചേർത്തു.
- source_word: אֵיתָן
  choice: ഏഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ സ്വാഭാവികമായി പകർത്തി.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിശൃംഖലയിലെ നേരിട്ടുള്ള പിതൃപുത്രബന്ധസൂത്രം നിലനിർത്തുന്നു.
- source_word: קִישִׁי
  choice: കീഷി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തി.
- source_word: עַבְדִּי
  choice: അബ്ദി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തി.
- source_word: מַלּוּךְ
  choice: മല്ലൂക്ക്
  rationale: അവസാനത്തെ ഘർഷധ്വനി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്ന പരമ്പരാഗത രൂപം സ്വീകരിച്ചു.
