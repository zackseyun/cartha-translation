  yaml_path: translation/ot/1_chronicles/006/014.yaml
  text: 'The sons of Merari: Mahli[a], Libni his son, Shimei his son, Uzzah his son.'
translation:
  language: ml
  text: 'മെരാരിയുടെ പുത്രന്മാർ: മഹ്ലി[a]; അവന്റെ മകൻ ലിബ്നി; അവന്റെ മകൻ ശിമെയി; അവന്റെ മകൻ ഉസ്സാ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, വംശാവലികളിൽ കാണുന്ന വിശാലമായ അർഥത്തിൽ, “മെരാരിയുടെ സന്തതികൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ construct ബഹുവചനരൂപം ഒരു വംശാവലി അവതരിപ്പിക്കുന്നു. ഇവിടെ നേരിട്ടുള്ള അർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു; വംശാവലി പ്രയോഗത്തിൽ ‘സന്തതികൾ’ എന്ന വിശാലാർഥവും സാധ്യമാണ്.
- source_word: מְרָרִי
  choice: മെരാരി
  rationale: വ്യക്തിനാമം; മലയാളത്തിലെ ബൈബിൾ നാമരൂപങ്ങളോടും എബ്രായ ഉച്ചാരണത്തോടും ചേർന്ന ലിപ്യന്തരണം.
- source_word: מַחְלִי
  choice: മഹ്ലി
  rationale: വ്യക്തിനാമം; എബ്രായ രൂപത്തെ അടുത്തായി പിന്തുടരുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: לִבְנִי
  choice: ലിബ്നി
  rationale: വ്യക്തിനാമം; എബ്രായ രൂപത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בְנוֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം ചേർന്ന ‘മകൻ’ എന്ന നാമം വംശപരമ്പരയിലെ ബന്ധം വ്യക്തമാക്കുന്നു. ആവർത്തനം മൂലപാഠത്തിലെ കണ്ണിചേർന്ന വംശാവലി ഘടന സംരക്ഷിക്കുന്നു.
- source_word: שִׁמְעִי
  choice: ശിമെയി
  rationale: വ്യക്തിനാമം; എബ്രായ ശബ്ദരൂപത്തെ പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: עֻזָּה
  choice: ഉസ്സാ
  rationale: വ്യക്തിനാമം; എബ്രായത്തിലെ ഇരട്ട z ധ്വനിയെ മലയാളത്തിലെ ഇരട്ട ‘സ്സ’ കൊണ്ട് സൂചിപ്പിക്കുന്ന ലിപ്യന്തരണം.
