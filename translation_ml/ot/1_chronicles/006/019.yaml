  footnotes:
  - marker: a
    text: 1 ശമൂവേൽ 1:1-ലെ സമാന്തര വംശാവലിയിൽ ഈ സ്ഥാനത്ത് ‘എലീഹൂ’ എന്നാണ്.
    reason: cross_reference
  - marker: b
    text: 1 ശമൂവേൽ 1:1-ലെ സമാന്തര വംശാവലിയിൽ ‘തോഹൂ’ എന്നാണ്; ഇവിടെ എബ്രായപാഠം ‘തോഹ’ എന്നു വായിക്കുന്നു.
    reason: textual_cross_reference
lexical_decisions:
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിയുടെ ആവർത്തനശൈലി നിലനിർത്തിക്കൊണ്ട്, അടുത്ത തലമുറയെയോ വംശപരമ്പരയെയോ സൂചിപ്പിക്കാൻ പതിവായി ഉപയോഗിക്കുന്ന ഔപചാരികവും സ്വാഭാവികവുമായ പദം.
- source_word: אֶלְקָנָה
  choice: എൽക്കാന
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יְרֹחָם
  choice: യെരോഹാം
  rationale: എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אֱלִיאֵל
  choice: എലീയേൽ
  rationale: മസോററ്റിക് പാഠത്തിലെ വ്യക്തിനാമം അതിന്റെ സ്വരക്രമം പ്രതിഫലിപ്പിക്കുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: תּוֹחַ
  choice: തോഹ
  rationale: WLC/മസോററ്റിക് പാഠത്തിലെ തּוֹחַ എന്ന രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം; സമാന്തര വംശാവലിയിലെ വ്യത്യസ്ത നാമരൂപം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവന്നിട്ടില്ല.
