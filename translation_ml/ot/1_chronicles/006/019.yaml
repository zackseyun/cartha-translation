translation_notes:
  register: ആവർത്തനമുള്ള എബ്രായ വംശാവലിശൈലി അതേ ക്രമത്തിൽ നിലനിർത്തി. വ്യക്തിനാമങ്ങൾ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ള വിധം ലിപ്യന്തരിച്ചു; സമാന്തരപാഠത്തിലെ വ്യത്യാസങ്ങൾ മുഖ്യവാചകത്തിൽ ലയിപ്പിക്കാതെ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
