  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה נַפְתָּלִ֗י אֶת קֶ֤דֶשׁ בַּ/גָּלִיל֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת חַמּ֖וֹן וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת קִרְיָתַ֖יִם וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/061.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
translation:
  language: ml
  text: 'നഫ്താലിഗോത്രത്തിൽനിന്ന്: ഗലീലിയിലെ കേദെശും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], ഹമ്മോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, കിര്യാത്തയീമും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പൊതുഭൂമികൾ’; ഓരോ പട്ടണത്തിനും അവകാശപ്പെട്ടിരുന്ന ചുറ്റുമുള്ള തുറന്ന ഭൂമിയെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: നഫ്താലിഗോത്രത്തിൽനിന്ന്
  rationale: ഗോത്രവിഹിതത്തിന്റെ സന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്; וּמִן മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ചയും ഉറവിടവും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാശൈലിക്കായി സംയോജിതരൂപം ഉപയോഗിച്ചു.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: ഗലീലിയിലെ കേദെശ്
  rationale: בַּגָּלִיל പ്രദേശസൂചനയാണ്; മറ്റിടങ്ങളിലെ സമാനനാമങ്ങളിൽനിന്ന് പട്ടണത്തെ വേർതിരിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം ‘ഗലീലിയിലെ കേദെശ്’ ആണ്.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യപട്ടണത്തോടു ചേർന്ന തുറന്നതും കന്നുകാലികളെ മേയിക്കാനുപയോഗിച്ചതുമായ പൊതുഭൂമിയെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഓരോ പട്ടണത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിന്റെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: חַמּוֹן
  choice: ഹമ്മോൻ
  rationale: എബ്രായ വ്യഞ്ജനരൂപത്തെ അടുത്തായി പിന്തുടരുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: קִרְיָתַיִם
  choice: കിര്യാത്തയീം
  rationale: എബ്രായ നാമത്തിന്റെ വ്യഞ്ജനങ്ങളും ദ്വിസ്വരാന്ത്യവും തിരിച്ചറിയാവുന്ന വിധത്തിൽ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി സ്വീകരിച്ചു. മുൻവാക്യത്തിന്റെ വ്യാകരണപരമായ തുടർച്ചയായ ‘ഉം’ ഘടകം ദ്വിബിന്ദുവും അനുക്രമ ‘ഉം’ രൂപങ്ങളുംകൊണ്ട് സ്വാഭാവികമായി നിലനിർത്തി. സ്ഥലനാമങ്ങൾ എബ്രായരൂപത്തെ ആധാരമാക്കി ലിപ്യന്തരിച്ചു.
