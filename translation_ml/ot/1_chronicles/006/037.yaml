  yaml_path: translation/ot/1_chronicles/006/037.yaml
  text: Meraioth his son, Amariah his son, Ahitub his son.
translation:
  language: ml
  text: അവന്റെ മകൻ മെരായോത്ത്; അവന്റെ മകൻ അമര്യാവ്; അവന്റെ മകൻ അഹീത്തൂബ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרָיוֹת
  choice: മെരായോത്ത്
  rationale: വ്യക്തിനാമം അർത്ഥപരിഭാഷ ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് ചേർന്നും മലയാള ബൈബിൾ നാമരൂപങ്ങൾക്ക് യോജിച്ചും ലിപ്യന്തരിച്ചു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: בֵּן എന്ന പദത്തോടുള്ള മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം വംശാവലിയിലെ പുത്രബന്ധം വ്യക്തമാക്കുന്നു; മൂന്നു പ്രാവശ്യവും ആവർത്തിച്ചിരിക്കുന്ന എബ്രായ ഘടന അതേപടി നിലനിർത്തി.
- source_word: אֲמַרְיָה
  choice: അമര്യാവ്
  rationale: יה ഘടകമുള്ള വ്യക്തിനാമത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും പ്രചാരമുള്ളതുമായ ലിപ്യന്തരണരൂപം സ്വീകരിച്ചു.
- source_word: אֲחִיטוּב
  choice: അഹീത്തൂബ്
  rationale: വ്യക്തിനാമം എബ്രായ വ്യഞ്ജന-സ്വരരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, വംശാവലിയുടെ സംക്ഷിപ്തവും ആവർത്തനാത്മകവുമായ ഘടന സംരക്ഷിച്ചു. മുൻവാക്യത്തിൽ നിന്നു തുടരുന്ന പട്ടികയായതിനാൽ എബ്രായ പദക്രമം അനുസരിച്ച് ഓരോ പേരിനുമുമ്പും ‘അവന്റെ മകൻ’ നിലനിർത്തി.
