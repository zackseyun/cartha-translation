  text: and Kedemoth with its pasturelands[a], and Mephaath with its pasturelands.
translation:
  language: ml
  text: കേദെമോത്തും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും,[a] മേഫാത്തും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൊതുഭൂമികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഒരു പട്ടണത്തോടു ചേർന്നുള്ള തുറന്ന ഭൂമിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: കേദെമോത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ഒരു പട്ടണത്തോടു ചേർന്നുള്ള തുറന്ന പൊതുഭൂമിയെയോ മൃഗങ്ങളെ മേയ്ക്കാനുള്ള ഭൂമിയെയോ സൂചിപ്പിക്കുന്ന പദമാണ്. ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ ‘മേച്ചിൽപ്പുറങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; 3-ാം പുരുഷ ഏകവചന സ്ത്രീലിംഗ പ്രത്യയം ഓരോ പട്ടണത്തെയും സൂചിപ്പിക്കുന്ന ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: מֵיפַעַת
  choice: മേഫാത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ, എബ്രായ രൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וְאֶת ... וְאֶת
  choice: …ഉം …ഉം
  rationale: സംയോജകത്തോടുകൂടിയ ആവർത്തിത കർമചിഹ്നം പട്ടണങ്ങളുടെയും അവയോടു ചേർന്ന ഭൂമികളുടെയും പട്ടിക ക്രമീകരിക്കുന്നു. മലയാളത്തിൽ ‘ഉം’ എന്ന ഏകോപനരൂപം അതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും മാന്യവുമായ പട്ടികാശൈലി സ്വീകരിച്ചു. മൂലപാഠം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ മലയാളത്തിലും സമ്പൂർണ ക്രിയ ചേർത്തിട്ടില്ല.
