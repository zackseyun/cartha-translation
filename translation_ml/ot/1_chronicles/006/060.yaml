lexical_decisions:
- source_word: חוּקֹק
  choice: ഹൂക്കോക്ക്
  rationale: മസോററ്റിക് പാഠത്തിലെ സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു; സമാന്തരപട്ടികയിലെ വ്യത്യസ്ത നാമം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവന്നിട്ടില്ല.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തോടു ചേർന്ന, കന്നുകാലികളെ മേയ്ക്കുന്നതിനും പൊതുവായ ഉപയോഗത്തിനുമുള്ള തുറസ്സായ ഭൂമിയെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തവും സ്വാഭാവികവുമായ ഈ പദം തെരഞ്ഞെടുത്തു.
- source_word: רְחֹב
  choice: രെഹോബ്
  rationale: സ്ഥലനാമം മൂലഭാഷയിലെ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: וְאֶת
  choice: -ഉം
  rationale: പട്ടികയിലെ ആവർത്തിത സംയോജനവും കർമസൂചകവും മലയാളത്തിൽ ഓരോ പട്ടണത്തെയും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളെയും ബന്ധിപ്പിക്കുന്ന ‘-ഉം’ എന്ന സമുച്ചയപ്രത്യയംകൊണ്ട് സ്വാഭാവികമായി പ്രതിനിധീകരിച്ചു.
