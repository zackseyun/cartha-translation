  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഇത് മുൻവാക്യത്തിൽ തുടരുന്ന പട്ടികയാണെന്ന സ്വഭാവം നിലനിർത്താൻ ക്രിയ ചേർത്തിട്ടില്ല; ആവർത്തിത ഘടനയും സംരക്ഷിച്ചു.
