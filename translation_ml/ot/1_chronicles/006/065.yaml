  footnotes:
  - marker: a
    text: ഈ സ്ഥലപ്പേര് ‘രാമോത്ത്-ഗിലെയാദ്’ എന്നും പറയാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
