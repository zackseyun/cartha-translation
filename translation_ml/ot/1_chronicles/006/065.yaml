  language: ml
  text: 'ഗാദ് ഗോത്രത്തിൽനിന്ന്: ഗിലെയാദിലെ രാമോത്തും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], മഹനയീമും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.'
