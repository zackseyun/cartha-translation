source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֗ן נָתְנוּ֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֶת חֶבְר֥וֹן וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַתִּ֥ר וְ/אֶֽת אֶשְׁתְּמֹ֖עַ וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
translation:
  language: ml
  text: 'അഹരോന്റെ പുത്രന്മാർക്ക് അവർ അഭയനഗരങ്ങൾ നൽകി: ഹെബ്രോൻ, ലിബ്നയും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളോടുകൂടെ[a], യത്തീർ, എഷ്ടെമോവയും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളോടുകൂടെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “പൊതുഭൂമികൾ.” എബ്രായപദം ഒരു പട്ടണത്തിന്റേതായ തുറസ്സായ ഭൂമിയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർക്ക്
  rationale: ל സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു. വംശാവലി-ഗോത്രസന്ദർഭത്തിൽ בְּנֵי എന്നതിന്റെ രൂപപരമായ അർഥം നിലനിർത്താൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു.
- source_word: נָתְנוּ
  choice: അവർ ... കൊടുത്തു
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഭൂവിഭജനസന്ദർഭത്തിൽ ‘നൽകി’ എന്നും സാധ്യമെങ്കിലും ‘കൊടുത്തു’ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: עָרֵי הַמִּקְלָט
  choice: അഭയനഗരങ്ങൾ
  rationale: തോറായിലെ നിയമപരമായി നിർണയിക്കപ്പെട്ട അഭയസ്ഥാനങ്ങളായ പട്ടണങ്ങളെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: אֶת חֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: സ്ഥലപ്പേര് മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: וְאֶת לִבְנָה
  choice: ലിബ്ന
  rationale: സ്ഥലപ്പേര് മൂലഭാഷയുടെ രൂപം പിന്തുടർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: מִגְרָשׁ പട്ടണത്തോടു ചേർന്ന തുറസ്സായ പൊതുഭൂമി/മൃഗമേയൽഭൂമിയെ സൂചിപ്പിക്കുന്നു. നഗരത്തിന്റെ ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്ന സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: וְאֶת יַתִּר
  choice: യത്തീർ
  rationale: സ്ഥലപ്പേര് എബ്രായ ഉച്ചാരണത്തോട് അടുത്തവിധം ലിപ്യന്തരിച്ചു.
- source_word: וְאֶת אֶשְׁתְּמֹעַ
  choice: എഷ്ടെമോവ
  rationale: സ്ഥലപ്പേര് എബ്രായരൂപത്തോട് അടുത്തവിധം ലിപ്യന്തരിച്ചു.
- source_word: וְאֶת מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ആവർത്തിക്കുന്ന പദം ഏകീകരിച്ച് പരിഭാഷപ്പെടുത്തി; പ്രത്യയം തൊട്ടുമുമ്പുള്ള എഷ്ടെമോവയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അഭയനഗരങ്ങൾ’ എന്ന ബഹുവചനവും തുടർന്ന് വരുന്ന പട്ടണപ്പട്ടികയും തമ്മിലുള്ള ബന്ധം
  choice: മൂലത്തിലെ ബഹുവചനവും പട്ടികാസംരചനയും അതേപടി നിലനിർത്തി
  alternative: ഹെബ്രോനെ മാത്രം അഭയനഗരമായി വ്യാഖ്യാനിച്ച് വാക്യം പുനഃക്രമീകരിക്കുക
  rationale: എബ്രായവാക്യം עָרֵי הַמִּקְלָט എന്ന ബഹുവചനത്തിനു പിന്നാലെ പട്ടിക നൽകുന്നു. സമാന്തരപാഠത്തിന്റെ അടിസ്ഥാനത്തിൽ അർഥം നിശ്ചയിച്ച് മൂലത്തിലെ വ്യാകരണഘടന തിരുത്താതെ, അതിലുള്ള തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി സ്വീകരിച്ചു. മേച്ചിൽപ്പുറങ്ങളെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് ബന്ധപ്പെട്ട പദത്തിനുതന്നെ ചേർത്തു; സ്ഥലനാമങ്ങൾ മൂലഭാഷയോട് അടുത്ത മലയാളലിപ്യന്തരണത്തിൽ നൽകി.
