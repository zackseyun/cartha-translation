  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിയിൽ നേരിട്ടുള്ള പിതൃപുത്രബന്ധം സൂചിപ്പിക്കുന്ന ആവർത്തിത ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֶתְנִי
  choice: എത്നി
  rationale: എബ്രായ വ്യക്തിനാമം അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: זֶרַח
  choice: സേരഹ്
  rationale: എബ്രായ ഉച്ചാരണത്തോട് ചേർന്നുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: עֲדָיָה
  choice: അദായാവ്
  rationale: എബ്രായ വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; 'അദായാവിന്റെ' എന്ന വിഭക്തിരൂപത്തിന് സ്വാഭാവികമായ പ്രാതിപദികമായി 'അദായാവ്' സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, വംശാവലിയുടെ സംക്ഷിപ്തവും ആവർത്തിതവുമായ രൂപം കാത്തുസൂക്ഷിച്ചിരിക്കുന്നു. മുൻവാക്യത്തിൽ നിന്നു തുടരുന്ന ഖണ്ഡവാക്യമായതിനാൽ മൂലപാഠത്തിലെപ്പോലെ ക്രിയ ചേർത്തിട്ടില്ല.
