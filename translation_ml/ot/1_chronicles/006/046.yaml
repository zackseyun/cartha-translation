language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֨י קְהָ֜ת הַ/נּוֹתָרִ֗ים מִ/מִּשְׁפַּ֣חַת הַ/מַּטֶּ֡ה מִֽ֠/מַּחֲצִית מַטֵּ֨ה חֲצִ֧י מְנַשֶּׁ֛ה בַּ/גּוֹרָ֖ל עָרִ֥ים עָֽשֶׂר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/046.yaml
  text: And to the sons of Kohath[a] who remained, from the families of the tribe, from the half-tribe, the half of Manasseh, ten cities were given by lot.
translation:
  language: ml
  text: കെഹാത്തിന്റെ ശേഷിച്ച പുത്രന്മാർക്ക്, ഗോത്രകുടുംബത്തിൽനിന്ന്—പാതിഗോത്രത്തിൽനിന്ന്, മനശ്ശെയുടെ പാതിയിൽനിന്ന്—നറുക്കിലൂടെ പത്തു പട്ടണങ്ങൾ ലഭിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ, ‘ഗോത്രകുടുംബത്തിൽനിന്ന്, പാതിഗോത്രത്തിൽനിന്ന്, മനശ്ശെയുടെ പാതിയിൽനിന്ന്’ എന്നാണ്. ഇത് ആവർത്തനപരവും അല്പം ദുഷ്കരവുമായ ഒരു സൂത്രമാണ്; മനശ്ശെയുടെ പാതിഗോത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: മൂലപാഠത്തിലെ ആവർത്തനപരവും അല്പം ദുഷ്കരവുമായ ഗോത്രസൂത്രം വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: കെഹാത്തിന്റെ പുത്രന്മാർക്ക്
  rationale: ലാമെദ് വിഭജനത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു. വംശാവലിപരമായ എബ്രായ ശൈലി നിലനിർത്താൻ ‘പുത്രന്മാർ’ എന്നു നൽകി; ഇവിടെ അത് കെഹാത്തിന്റെ സന്തതിക്കാരെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַנּוֹתָרִים
  choice: ശേഷിച്ച
  rationale: മുമ്പത്തെ വിഭജനങ്ങൾക്കുശേഷം ശേഷിച്ച കെഹാത്ത്യരെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: מִ/מִּשְׁפַּחַת הַ/מַּטֶּה
  choice: ഗോത്രത്തിലെ കുടുംബങ്ങളിൽനിന്ന്
  rationale: מַטֶּה ഇവിടെ ‘വടി’ എന്നല്ല, ഗോത്രം എന്ന അർഥത്തിലാണ്. מִשְׁפָּחָה കുടുംബ/കുലവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; പട്ടണങ്ങൾ ലഭിച്ച ഉറവിടഗോത്രവിഭാഗങ്ങളെ വ്യക്തമാക്കുന്ന രീതിയിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: מִֽ/מַּחֲצִית מַטֵּה חֲצִי מְנַשֶּׁה
  choice: പാതിഗോത്രത്തിൽനിന്ന്, മനശ്ശെയുടെ പാതിയിൽനിന്ന്
  rationale: മൂലത്തിലെ അസാധാരണവും ആവർത്തനപരവുമായ ഗോത്രവിഭജനസൂത്രം ലളിതമാക്കി ഇല്ലാതാക്കാതെ നിലനിർത്തി. സന്ദർഭത്തിൽ ഇത് മനശ്ശെയുടെ പാതിഗോത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בַּ/גּוֹרָל
  choice: നറുക്കിട്ട്
  rationale: പട്ടണങ്ങൾ നറുക്കെടുപ്പിലൂടെ അനുവദിച്ചതാണെന്ന അർഥം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകി.
- source_word: עָרִים עָשֶׂר
  choice: പത്തു പട്ടണങ്ങൾ ലഭിച്ചു
  rationale: എബ്രായത്തിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല; പട്ടണവിഭജനപ്പട്ടികയുടെ സന്ദർഭത്തിൽനിന്ന് ‘ലഭിച്ചു’ ചേർത്തു. עִיר എന്നതിന് ഇവിടെ ‘പട്ടണം’ അനുയോജ്യം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പട്ടികാശൈലി. ‘കെഹാത്ത്’, ‘മനശ്ശെ’ എന്നീ പരമ്പരാഗത ബൈബിൾ നാമരൂപങ്ങളും ‘നറുക്കിട്ട്’, ‘പട്ടണങ്ങൾ’ എന്നീ സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ള പദങ്ങളും ഉപയോഗിച്ചു. മൂലത്തിലെ ഗോത്രസൂത്രത്തിന്റെ ആവർത്തനം ഡാഷുകൾകൊണ്ട് വായനയോഗ്യമാക്കിയെങ്കിലും അതിലെ ദുഷ്കരത പൂർണമായി നീക്കിയിട്ടില്ല.
