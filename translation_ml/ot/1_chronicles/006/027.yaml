  text: son of Ethan[a], son of Zimmah, son of Shimei.
translation:
  language: ml
  text: ഏഥാന്റെ മകൻ[a], സിമ്മായുടെ മകൻ, ശിമെയിയുടെ മകൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ വംശാവലികളിൽ ചിലപ്പോൾ ഇടയ്ക്കുള്ള തലമുറകൾ ഒഴിവാക്കാറുണ്ട്. അതിനാൽ ചില സന്ദർഭങ്ങളിൽ ‘മകൻ’ എന്നത് വിശാലമായ അർഥത്തിൽ ‘സന്തതി’ എന്നും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിപ്പട്ടികയിലെ സാധാരണ എബ്രായ പ്രയോഗമായതിനാൽ ഉപരിതല അർഥം നിലനിർത്തി ‘മകൻ’ എന്നു പരിഭാഷപ്പെടുത്തി. ചില വംശാവലികളിൽ ഇടത്തലമുറകൾ ഒഴിവാക്കപ്പെടാമെങ്കിലും ഇവിടെ നേരിട്ട് ‘സന്തതി’ എന്നു വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: אֵיתָן
  choice: ഏഥാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: זִמָּה
  choice: സിമ്മ
  rationale: ഇവിടെ പദം വ്യക്തിനാമമായി വരുന്നതിനാൽ അതിന്റെ മൂലപദാർഥം വിവർത്തനം ചെയ്യാതെ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: שִׁמְעִי
  choice: ശിമെയി
  rationale: എബ്രായ വ്യക്തിനാമമായ ശിമ്ഈയുടെ ശബ്ദഘടനയും മലയാള ബൈബിൾ വായനയിലെ തിരിച്ചറിയാവുന്ന രൂപവും പരിഗണിച്ച് ‘ശിമെയി’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി സ്വീകരിച്ചു. ആവർത്തിക്കുന്ന בֶּן എന്ന ഘടന ഓരോ പേരിനോടും ചേർത്ത് നിലനിർത്തി; വാക്യത്തിലെ ആദ്യത്തെ ‘മകൻ’ എന്ന പദത്തിനു പിന്നാലെ ആവശ്യമായ [a] അടിക്കുറിപ്പുസൂചകം ചേർത്തു.
