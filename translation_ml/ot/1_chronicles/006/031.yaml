  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. മൂലപാഠത്തിലെ ആവർത്തനഘടന നിലനിർത്തിയിരിക്കുന്നു.
