  text: son of Amzi[a], son of Bani, son of Shemer.
translation:
  language: ml
  text: അംസിയുടെ[a] മകൻ, ബാനിയുടെ മകൻ, ശേമെറിന്റെ മകൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയും തുടർന്നുള്ള ഓരോ ‘മകൻ’ എന്ന പ്രയോഗത്തിലും ‘വംശജൻ’ എന്നും അർഥമാകാം; ഹീബ്രായ വംശാവലികളിൽ ഇടയ്ക്കുള്ള തലമുറകൾ ഒഴിവാക്കിയിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിയിൽ בֶּן നേരിട്ടുള്ള പുത്രബന്ധത്തെയോ പൊതുവായ വംശപരമ്പരയെയോ സൂചിപ്പിക്കാം. മൂലരൂപത്തോട് സുതാര്യത പുലർത്താൻ പ്രധാന പാഠത്തിൽ ‘മകൻ’ ഉപയോഗിച്ചു; തലമുറകൾ ചുരുക്കിയിരിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אַמְצִי
  choice: അംസി
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בָּנִי
  choice: ബാനി
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ ദീർഘസ്വരം പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: שָׁמֶר
  choice: ശേമെർ
  rationale: ഹീബ്രായ വ്യഞ്ജന-സ്വരരൂപം പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
