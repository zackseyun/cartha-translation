    text: അഥവാ “യെഥെരായി.”
    reason: lexical_alternative
  revision_rationale: The sequence has been reordered to retain the source’s genealogical linkage and compact list style. “സെരഹ്” supplies a more natural Malayalam rendering of Zerah while retaining the name’s established transliterated form. The footnote remains anchored to the final name, which is the name to which the alternative applies.
