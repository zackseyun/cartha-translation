  yaml_path: translation/ot/1_chronicles/006/006.yaml
  text: Joah his son[a], Iddo his son, Zerah his son, Jeatherai his son.
translation:
  language: ml
  text: യോവാഹ് അവന്റെ മകൻ; ഇദ്ദോ അവന്റെ മകൻ; സെരഹ് അവന്റെ മകൻ; യെഅഥെരായി അവന്റെ മകൻ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഥെരായി.”
