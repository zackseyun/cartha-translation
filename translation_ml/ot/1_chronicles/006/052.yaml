  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת עָרֵ֧י הַ/מִּקְלָ֛ט אֶת שְׁכֶ֥ם וְ/אֶת מִגְרָשֶׁ֖י/הָ בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת גֶּ֖זֶר וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/052.yaml
  text: 'They gave them the cities of refuge: Shechem with its pasturelands in the hill country of Ephraim[a], and Gezer with its pasturelands.'
translation:
  language: ml
  text: 'അവർ അവർക്കു അഭയനഗരങ്ങൾ കൊടുത്തു: എഫ്രയീം മലനാട്ടിലെ ശെഖേമും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], ഗേസെരും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “അഭയനഗരങ്ങൾ—എഫ്രയീം മലനാട്ടിലെ ശെഖേമും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, ഗേസെരും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: അവർ കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ wayyiqtol രൂപം തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ സംയോജകം ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: לָהֶם
  choice: അവർക്കു
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന ലളിതമായ പരോക്ഷകർമ സർവനാമം.
- source_word: עָרֵי הַמִּקְלָט
  choice: അഭയനഗരങ്ങൾ
  rationale: ഇസ്രായേലിലെ നിയമപരമായി നിശ്ചയിക്കപ്പെട്ട അഭയകേന്ദ്രങ്ങളായ നഗരങ്ങളെ സൂചിപ്പിക്കുന്ന സാങ്കേതികപ്രയോഗം; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമാണ്.
- source_word: שְׁכֶם
  choice: ശെഖേം
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: നഗരത്തോടു ചേർന്ന, പ്രത്യേകിച്ച് മൃഗങ്ങളെ മേയ്ക്കാൻ ഉപയോഗിച്ചിരുന്ന തുറന്ന ഭൂമിയെ സൂചിപ്പിക്കുന്നു; ലേവ്യനഗരങ്ങളുടെ സന്ദർഭത്തിൽ ‘മേച്ചിൽപ്പുറങ്ങൾ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: בְּהַר אֶפְרָיִם
  choice: എഫ്രയീം മലനാട്ടിലെ
  rationale: ഒരു പ്രത്യേക പർവതശിഖരത്തെയല്ല, എഫ്രയീമുമായി ബന്ധപ്പെട്ട മലമ്പ്രദേശത്തെയാണ് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: גֶּזֶר
  choice: ഗേസെർ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְאֶת ... וְאֶת
  choice: …ഉം …ഉം
  rationale: ആവർത്തിക്കുന്ന സംയോജകവും കർമചിഹ്നങ്ങളും ഓരോ നഗരത്തെയും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളോടു ചേർത്തുകൊണ്ട് സ്വാഭാവിക മലയാള പട്ടികാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അഭയനഗരങ്ങൾ’ എന്ന ബഹുവചനത്തിനു പിന്നാലെയുള്ള നഗരപ്പട്ടികയുടെ പരിധി
  choice: മൂലപാഠത്തിന്റെ ഉപവാക്യക്രമം നിലനിർത്തി, ‘അഭയനഗരങ്ങൾ’ എന്നതിനു ശേഷം ശെഖേമിനെയും ഗേസെരിനെയും ഒരേ പട്ടികയിൽ നൽകി.
  alternative: ‘അഭയനഗരമായി ശെഖേം’ എന്നു പറഞ്ഞ് അഭയനഗരപദവി ശെഖേമിനു മാത്രമായി വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായ വാക്യഘടനയിലെ യഥാർഥ അസ്പഷ്ടതയെ പ്രധാനപാഠത്തിൽ തീർപ്പാക്കാതെ നിലനിർത്തുന്നു; ഔപചാരികമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ എബ്രായരൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു; സാങ്കേതികമായ עָרֵי הַמִּקְלָט എന്നതിന് വായനക്കാർക്കു പരിചിതവും വ്യക്തവുമായ ‘അഭയനഗരങ്ങൾ’ ഉപയോഗിച്ചു.
