    rationale: In this tribal-genealogical context the term denotes kinship subdivisions/clans, not merely genealogical descent lines.
  - severity: low
    issue: The current word order is heavy and less idiomatic.
    rationale: Placing the classificatory phrase before ‘ലേവ്യരുടെ വംശങ്ങൾ’ produces an awkward nominal stack; a reordered clause reads more naturally.
