id: 1CH.6.4
reference: 1 Chronicles 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֥י מְרָרִ֖י מַחְלִ֣י וּ/מֻשִׁ֑י וְ/אֵ֛לֶּה מִשְׁפְּח֥וֹת הַ/לֵּוִ֖י לַ/אֲבוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/004.yaml
  text: 'The sons of Merari: Mahli and Mushi[b][a]. These were the clans of the Levites according to their fathers’ houses.'
translation:
  language: ml
  text: 'മെരാരിയുടെ പുത്രന്മാർ: മഹ്ലിയും മൂശിയും. അവരുടെ പിതൃവംശമനുസരിച്ചുള്ള ലേവ്യരുടെ കുലങ്ങൾ[a] ഇവയാണ്[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കുടുംബങ്ങൾ.”
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം “അവരുടെ പിതാക്കന്മാർപ്രകാരം”; ഈ വംശാവലിസന്ദർഭത്തിൽ പിതൃവഴിയിലുള്ള വംശക്രമമനുസരിച്ചുള്ള വിഭാഗീകരണമാണ് അർഥം.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ അവതരണത്തിൽ בְּנֵי എന്ന സംയുക്ത ബഹുവചനം നേരിട്ട് പേരെടുത്ത പുത്രന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: מַחְלִי וּמֻשִׁי
  choice: മഹ്ലിയും മൂശിയും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്ത് ഹീബ്രു സംയോജകത്തെ ‘-യും ... -യും’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ നൽകി.
- source_word: וְאֵלֶּה
  choice: ഇവയായിരുന്നു
  rationale: മുൻപറഞ്ഞ വംശാവലി വിഭാഗങ്ങളെ സംഗ്രഹിക്കുന്ന ബഹുവചന സൂചകപ്രയോഗം; വിവരണത്തിന്റെ ഭൂതകാലസന്ദർഭത്തിന് യോജിച്ച് ‘ആയിരുന്നു’ ചേർത്തു.
- source_word: מִשְׁפְּחוֹת
  choice: വംശങ്ങൾ
  rationale: ഇവിടെ അണുകുടുംബങ്ങളെയല്ല, ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആ അർഥം സാധാരണ മലയാളത്തിൽ ‘വംശങ്ങൾ’ വ്യക്തമായി നൽകുന്നു.
- source_word: הַלֵּוִי
  choice: ലേവ്യരുടെ
  rationale: രൂപത്തിൽ ഏകവചനമായിരുന്നാലും ഈ വംശാവലിസൂത്രത്തിൽ ലേവിയുടെ സന്തതിസമൂഹത്തെ കൂട്ടായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനബന്ധരൂപം ഉപയോഗിച്ചു.
- source_word: לַאֲבוֹתֵיהֶם
  choice: പിതൃഭവനങ്ങൾപ്രകാരമുള്ള
  rationale: അക്ഷരാർഥം ‘അവരുടെ പിതാക്കന്മാർപ്രകാരം’ എന്നാണ്; വംശാവലിസന്ദർഭത്തിൽ പിതൃവഴിയിലുള്ള പൂർവികകുടുംബങ്ങളനുസരിച്ചുള്ള വിഭാഗീകരണമാണ് ഉദ്ദേശ്യം. അതിനാൽ അർഥം വ്യക്തമാക്കുന്ന പരമ്പരാഗത വംശാവലിപദമായ ‘പിതൃഭവനങ്ങൾ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: הַלֵּוִי എന്ന ഏകവചനരൂപത്തിന്റെ കൂട്ടായ അർഥം
  choice: ലേവ്യരുടെ
  alternative: ലേവിയുടെ
  rationale: വാക്യം ഒന്നിലധികം വംശങ്ങളെ സംഗ്രഹിക്കുകയും മെരാരിയുടെ പുത്രന്മാരെ ലേവ്യഗോത്രത്തിലെ വിഭാഗങ്ങളായി നിരത്തുകയും ചെയ്യുന്നതിനാൽ, ഏകവചനരൂപത്തെ കൂട്ടായ ജനവിഭാഗമായി ഗ്രഹിക്കുന്ന ‘ലേവ്യരുടെ’ എന്ന പരിഭാഷ സന്ദർഭത്തിന് യോജിക്കുന്നു. ‘ലേവിയുടെ’ എന്നും വ്യാകരണപരമായി സാധ്യമാണ്; എന്നാൽ അത് പൂർവികനായ ലേവിയുമായുള്ള നേരിട്ടുള്ള ഉടമബന്ധത്തിന് കൂടുതൽ ഊന്നൽ നൽകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. പേരുകൾ മൂലഹീബ്രുവിനോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു. ‘പിതൃഭവനം’ സാധാരണ വായനക്കാരന് കുറച്ച് സാങ്കേതികമായി തോന്നാമെങ്കിലും, വംശാവലി-സാമൂഹിക ഘടകത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നതിനാൽ നിലനിർത്തി; അടിക്കുറിപ്പ് അതിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
