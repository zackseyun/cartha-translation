translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ വംശാവലിപരമായ ആവർത്തനം സംരക്ഷിച്ചു; അർദ്ധവിരാമങ്ങൾ ഓരോ പിതൃപുത്രഘട്ടവും വ്യക്തമായി വേർതിരിക്കുന്നു.
