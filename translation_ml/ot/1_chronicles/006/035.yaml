id: 1CH.6.35
reference: 1 Chronicles 6:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י אַהֲרֹ֑ן אֶלְעָזָ֥ר בְּנ֛/וֹ פִּֽינְחָ֥ס בְּנ֖/וֹ אֲבִישׁ֥וּעַ בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/035.yaml
  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: ml
  text: 'അഹരോന്റെ പുത്രന്മാർ ഇവരായിരുന്നു: അവന്റെ മകൻ എലെയാസാർ; അവന്റെ മകൻ ഫീനെഹാസ്; അവന്റെ മകൻ അബീശൂവ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ഇവർ ആയിരുന്നു
  rationale: സംയോജകവും നിർദേശകസർവനാമവും ചേർന്ന് വംശാവലിപ്പട്ടിക അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ഭൂതകാലസന്ദർഭത്തിന് സ്വാഭാവികമായി ‘ഇവർ ആയിരുന്നു’ എന്നു നൽകി; തുടക്കത്തിലെ וְ പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു വിവർത്തനം ചെയ്യാതെ പ്രവാഹത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: തുടർന്നുള്ള പേരുകൾ നേരിട്ടുള്ള പിതൃപുത്രക്രമം സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘സന്തതികൾ’ എന്നതിനു പകരം ഔപചാരികമായ വംശാവലിപദം നിലനിർത്തി.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: אֶלְעָזָר
  choice: എലെയാസാർ
  rationale: എബ്രായനാമത്തെ മലയാളത്തിൽ പരിചിതവും ഉച്ചരിക്കാൻ സ്വാഭാവികവുമായ രൂപത്തിൽ നൽകി.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുരുഷപ്രത്യയം ചേർന്ന ‘മകൻ’ എന്ന പദം ഓരോ ഘട്ടത്തിലും നേരിട്ടുള്ള പിതൃപുത്രബന്ധം വ്യക്തമാക്കുന്നു; ആവർത്തനം വംശാവലിയുടെ ശൃംഖലാസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: פִּינְחָס
  choice: ഫീനെഹാസ്
  rationale: എബ്രായനാമത്തിന് മലയാള ക്രൈസ്തവ വായനയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: אֲבִישׁוּעַ
  choice: അബീശൂവ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാനാകുകയും ചെയ്യുന്ന പേരുരൂപം തിരഞ്ഞെടുത്തു.
