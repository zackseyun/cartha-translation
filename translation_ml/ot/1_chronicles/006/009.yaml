lexical_decisions:
- source_word: תַּחַת
  choice: തഹത്ത്
  rationale: വംശാവലിയിലെ വ്യക്തിനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: വംശാവലികളിൽ בֵּן ചിലപ്പോൾ ‘സന്തതി’ എന്ന വിശാലാർഥത്തിൽ വരാമെങ്കിലും, ഇവിടെ ആവർത്തിക്കുന്ന സാധാരണ വംശാവലി സൂത്രവാക്യം അതിന്റെ നേരിട്ടുള്ള ‘മകൻ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: אוּרִיאֵל
  choice: ഊരീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: עֻזִּיָּה
  choice: ഉസ്സീയാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിലെ ശക്തമായ സ്സ ധ്വനിയും അവസാനത്തെ യാഹ് ഘടകത്തിന്റെ പരമ്പരാഗത മലയാളരൂപവും കാത്തുസൂക്ഷിക്കുന്ന ലിപ്യന്തരണം.
- source_word: וְשָׁאוּל
  choice: അവന്റെ മകൻ ശൗൽ
  rationale: ബന്ധകമായ וְ വാക്യഘടനയിൽ ചേർത്തു; שָׁאוּל എന്ന പേര് എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത ‘ശൗൽ’ എന്നു ലിപ്യന്തരിച്ചു.
