  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തിതമായ ‘അവന്റെ മകൻ’ എന്ന ഘടന നിലനിർത്തി; അവസാന പേരിനോടു ചേർന്ന ‘וְ’ മലയാളത്തിലെ പട്ടികാക്രമത്തിന് അനുയോജ്യമായി പ്രത്യേക ‘എന്നിവരും/കൂടാതെ’ ചേർക്കാതെ അവതരിപ്പിച്ചു.
