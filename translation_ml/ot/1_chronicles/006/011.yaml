source:
  edition: WLC
  text: אֶלְקָנָ֑ה בנ/ו אֶלְקָנָ֔ה צוֹפַ֥י בְּנ֖/וֹ וְ/נַ֥חַת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/011.yaml
  text: Elkanah his son[a], Elkanah his son, Zophai his son, and Nahath his son.
translation:
  language: ml
  text: എൽക്കാനാ, അവന്റെ മകൻ; എൽക്കാനാ; സോഫായി[a], അവന്റെ മകൻ; കൂടാതെ നഹത്ത്, അവന്റെ മകൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “സൂഫായി”; צוֹפַי എന്ന പേരിന്റെ മറ്റൊരു സ്വരീകരണ/ലിപ്യന്തരണ പാരമ്പര്യം പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: എൽക്കാനാ
  rationale: വ്യക്തിനാമം അർഥം വിവർത്തനം ചെയ്യാതെ ഹീബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; പാഠത്തിലുള്ള ആവർത്തനം അതേപടി നിലനിർത്തി.
- source_word: בְּנוֹ / בנו
  choice: അവന്റെ മകൻ
  rationale: വംശാവലിയിൽ വരുന്ന ‘മകൻ’ എന്ന നാമത്തോടു ചേർന്ന മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി. ഹീബ്രായത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ഓരോ സ്ഥാനത്തും ആവർത്തനം സൂക്ഷിച്ചു.
- source_word: צוֹפַי
  choice: സോഫായി
  rationale: മസോറെറ്റിക് സ്വരചിഹ്നങ്ങളോട് ചേർന്ന വ്യക്തിനാമ ലിപ്യന്തരണം. മറ്റൊരു സ്വരീകരണ/ലിപ്യന്തരണ പാരമ്പര്യം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וְ
  choice: ;
  rationale: അവസാന കണ്ണിയെ ബന്ധിപ്പിക്കുന്ന ഹീബ്രായ സംയോജകത്തിന്റെ പ്രവർത്തനം മലയാളത്തിലെ പട്ടികാക്രമവും വിരാമചിഹ്നവും മുഖേന സ്വാഭാവികമായി പ്രകടമാക്കി; പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കുന്നത് വംശാവലി ശൈലിയിൽ ഭാരമുള്ളതാകും.
- source_word: נַחַת
  choice: നഹത്ത്
  rationale: വ്യക്തിനാമം ഹീബ്രായ വ്യഞ്ജനരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ഉറവിടപാഠത്തിൽ രണ്ടാമത്തെ ‘എൽക്കാനാ’യ്ക്കുശേഷം בנו (‘അവന്റെ മകൻ’) ഇല്ലാത്തതിനാൽ, ഇംഗ്ലീഷ് ഉപദേശകപാഠത്തിലെ ആ കൂട്ടിച്ചേർക്കൽ സ്വീകരിച്ചില്ല. ഹീബ്രായ പദക്രമത്തിന്റെ അസ്വാഭാവികത കുറയ്ക്കാനും ഓരോ ബന്ധസൂചനയും ഏത് പേരിനോടാണ് ചേർന്നിരിക്കുന്നതെന്നത് വ്യക്തമാക്കാനും ദീർഘവിരാമവും അർധവിരാമവും ഉപയോഗിച്ചു.
