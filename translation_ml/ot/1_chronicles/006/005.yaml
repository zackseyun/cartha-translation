  naturalness: The revised word order, ‘ലിബ്നി അവന്റെ മകൻ,’ is concise, idiomatic in a formal Malayalam genealogy, and keeps the repeated Hebrew relationship marker clear.
  terminology: ‘വംശാവലി’ is the appropriate standard Malayalam term for a formal genealogical list. The transliterations ഗേർശോം, ലിബ്നി, യഹത്ത്, and സിമ്മാ suitably represent the personal names; ‘സിമ്മാ’ correctly retains the final vowel of זִמָּה.
