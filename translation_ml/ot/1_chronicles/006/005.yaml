  yaml_path: translation/ot/1_chronicles/006/005.yaml
  text: 'To Gershom: Libni his son, Jahath his son, Zimmah his son.'
translation:
  language: ml
  text: 'ഗേർശോമിന്റെ വംശാവലി: ലിബ്നി അവന്റെ മകൻ; യഹത്ത് അവന്റെ മകൻ; സിമ്മാ അവന്റെ മകൻ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹם
  choice: ഗേർശോമിന്റെ വംശം
  rationale: ലְ എന്ന ഉപസർഗം ഇവിടെ ഗേർശോമിൽനിന്നുള്ള വംശാവലിയുടെ ശീർഷകം അവതരിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘ഗേർശോമിന്’ എന്നതിനെക്കാൾ ‘ഗേർശോമിന്റെ വംശം’ ആ പ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; തുടർന്ന് വരുന്ന സംക്ഷിപ്ത പട്ടികാശൈലിയും നിലനിർത്തുന്നു.
- source_word: לִבְנִי
  choice: ലിബ്നി
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְנוֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയത്തോടുകൂടിയ בֵּן നേരിട്ടുള്ള പിതൃപുത്രബന്ധം സൂചിപ്പിക്കുന്നു. ആവർത്തനം നിലനിർത്തുന്നത് എബ്രായ വംശാവലിയുടെ ചങ്ങല വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: יַחַת
  choice: യഹത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജനഘടന മലയാളത്തിൽ കഴിയുന്നത്ര അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: זִמָּה
  choice: സിമ്മാ
  rationale: മറ്റിടങ്ങളിൽ ഇതേ രൂപത്തിന് പൊതുനാമാർഥം ഉണ്ടാകാമെങ്കിലും ഇവിടെ വ്യക്തിനാമമാണ്; അതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ സംക്ഷിപ്ത വംശാവലിശൈലി അർദ്ധവിരാമങ്ങളിലൂടെ നിലനിർത്തി. ‘ഗേർശോമിന്റെ വംശം’ എന്ന അവതാരിക മൂലത്തിലെ לְയുടെ വംശാവലി-ശീർഷക പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
