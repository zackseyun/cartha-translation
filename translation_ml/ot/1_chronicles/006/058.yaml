translation:
  language: ml
  text: 'രാമോത്തും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, അനേമും[a] അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.


    [a] എബ്രായപാഠത്തിൽ “അനേം”; യോശുവ 21:25-ലെ സമാന്തരപ്പട്ടികയിൽ “അനേർ” എന്നാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ “അനേം”; യോശുവ 21:25-ലെ സമാന്തരപ്പട്ടികയിൽ “അനേർ” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: רָאמוֹת
  choice: രാമോത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തോടു ചേർന്ന, കന്നുകാലികളെ മേയ്ക്കാൻ ഉപയോഗിച്ചിരുന്ന തുറന്ന ഭൂമിയെയാണ് പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഓരോ പട്ടണത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ “അതിന്റെ” എന്നു നൽകി.
- source_word: עָנֵם
  choice: അനേം
  rationale: മസോററ്റിക് പാഠത്തിലെ സ്ഥലനാമം അതേപടി ലിപ്യന്തരണം ചെയ്തു. യോശുവ 21:25-ലെ സമാന്തരപ്പട്ടികയിലെ “ആനേർ” എന്ന രൂപം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וְאֶת
  choice: -ഉം / കൂടാതെ
  rationale: ആവർത്തിച്ചുവരുന്ന സംയോജകവും കർമസൂചകവും പട്ടികയുടെ ഘടന നിർമിക്കുന്നു. മലയാളത്തിൽ കർമസൂചകം പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ “-ഉം” എന്ന ഘടനയിലൂടെ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു; പഴഞ്ചനായ “പ്രാന്തപ്രദേശങ്ങൾ” പോലുള്ള പദങ്ങൾക്കു പകരം സന്ദർഭം വ്യക്തമാക്കുന്ന “മേച്ചിൽപ്പുറങ്ങൾ” സ്വീകരിച്ചു. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന പാഠവ്യത്യാസം ബന്ധപ്പെട്ട “അനേം” എന്ന പേരിനോടുതന്നെ ചേർത്തു.
