  text: the son of Elkanah[a], the son of Joel, the son of Azariah, the son of Zephaniah.
translation:
  language: ml
  text: എൽക്കാനയുടെ മകൻ[a], യോവേലിന്റെ മകൻ, അസര്യാവിന്റെ മകൻ, സെഫന്യാവിന്റെ മകൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മകൻ’ എന്നു വരുന്ന ഓരോ ഇടത്തും ‘വംശജൻ’ എന്നും അർഥമാകാൻ സാധ്യതയുണ്ട്; എബ്രായ വംശാവലികളിൽ ചിലപ്പോൾ ഇടയ്ക്കുള്ള തലമുറകൾ പറയാതെ പോകാറുണ്ട്. എന്നാൽ ഇവിടെ തുടർച്ചയായ അടുത്ത വംശക്രമം ‘മകൻ’ എന്ന അർഥത്തെയാണ് പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിയിൽ בֶּן നേരിട്ടുള്ള പുത്രബന്ധത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ പദമാണ്. എബ്രായമൂലത്തിലെ ആവർത്തനശൈലി നിലനിർത്താൻ ഓരോ പേരിനോടും ‘മകൻ’ ആവർത്തിച്ചിരിക്കുന്നു.
- source_word: אֶלְקָנָה
  choice: എൽക്കാന
  rationale: എബ്രായ വ്യക്തിനാമം ആധുനിക മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: יוֹאֵל
  choice: യോവേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും മൂലോച്ചാരണത്തോട് അടുത്തതുമായ രൂപം സ്വീകരിച്ചു.
- source_word: עֲזַרְיָה
  choice: അസര്യാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: צְפַנְיָה
  choice: സെഫന്യാവ്
  rationale: മലയാള വായനക്കാർക്ക് പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ആവർത്തനഘടനയും ബന്ധത്തിലെ സാധ്യതയുള്ള അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
