source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה אָשֵׁ֔ר אֶת מָשָׁ֖ל וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת עַבְדּ֖וֹן וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/059.yaml
  text: 'and from the tribe of Asher: Mashal with its pasturelands[a], and Abdon with its pasturelands.'
translation:
  language: ml
  text: 'ആശേർ ഗോത്രത്തിൽനിന്ന്: മാശാൽ[a]യും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, അബ്ദോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ദിനവൃത്താന്തങ്ങളിലെ രൂപം അനുസരിച്ച് “മാശാൽ” എന്നു നൽകിയിരിക്കുന്നു; സമാന്തരപ്പട്ടികയായ യോശുവ 21:30-ൽ “മിശാൽ” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: ഗോത്രവിഹിതങ്ങളുടെ സന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്; മുൻവാക്യങ്ങളോടുള്ള ബന്ധം മലയാളത്തിലെ സന്ദർഭവും വിരാമചിഹ്നവും വ്യക്തമാക്കുന്നു.
- source_word: אָשֵׁר
  choice: ആശേർ
  rationale: ഗോത്രനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: אֶת מָשָׁל
  choice: മാശാൽ
  rationale: നേരിട്ടുള്ള കർമസൂചകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല. ദിനവൃത്താന്തത്തിലെ മസോററ്റിക് രൂപമായ מָשָׁל അനുസരിച്ചാണ് സ്ഥലനാമം ലിപ്യന്തരിപ്പിച്ചത്; സമാന്തരപാഠത്തിലെ വ്യത്യാസം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യനഗരങ്ങളുടെ പട്ടികയിൽ מִגְרָשׁ എന്നത് നഗരത്തോടു ചേർന്ന മൃഗമേയ്ക്കാനുള്ള തുറസ്സായ ഭൂമിയെ സൂചിപ്പിക്കുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עַבְדּוֹן
  choice: അബ്ദോൻ
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പട്ടികയുടെ സംക്ഷിപ്ത ഘടന നിലനിർത്തി; ‘മേച്ചിൽപ്പുറങ്ങൾ’ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ പദമായി തെരഞ്ഞെടുത്തു.
