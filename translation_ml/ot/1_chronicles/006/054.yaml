id: 1CH.6.54
reference: 1 Chronicles 6:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת אַיָּלוֹן֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת גַּת רִמּ֖וֹן וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/054.yaml
  text: and Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands.
translation:
  language: ml
  text: അയ്യാലോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], ഗത്ത്-രിമ്മോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൊതുഭൂമികൾ’ അല്ലെങ്കിൽ ‘ചുറ്റുമുള്ള തുറന്ന ഭൂമികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഒരു നഗരത്തിന്റേതായ, അതിനു ചുറ്റുമുള്ള തുറന്ന ഭൂമിയെയാണ് ഹീബ്രുപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: അയ്യാലോൻ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത രീതിയിൽ മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: നഗരത്തോടു ചേർന്നുള്ള, അതിന്റെ ഉപയോഗത്തിനായി നീക്കിവെച്ച തുറന്ന പൊതുഭൂമിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; പട്ടികയുടെ പശ്ചാത്തലത്തിൽ ‘മേച്ചിൽപ്പുറങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: גַּת רִמּוֹן
  choice: ഗത്ത്-രിമ്മോൻ
  rationale: സംയുക്ത സ്ഥലനാമം ഒറ്റ നാമമാണെന്ന് വ്യക്തമാക്കാൻ ഹൈഫനോടെ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
- source_word: וְאֶת
  choice: -ഉം
  rationale: ഹീബ്രുവിലെ സംയോജകവും നേരിട്ടുള്ള കർമസൂചകവും ചേർന്ന രൂപം പട്ടികയിലെ ഓരോ സ്ഥലത്തെയും ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ഉം’ ഉപയോഗിക്കുന്നത് ഈ ഏകോപനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള ഏകോപനം മലയാളത്തിലെ ‘-ഉം’കൊണ്ട് നിലനിർത്തി; സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു.
