  yaml_path: translation/ot/1_chronicles/006/048.yaml
  text: To the sons of Merari, according to their clans, from the tribe of Reuben, from the tribe of Gad, and from the tribe of Zebulun, twelve cities by lot.
translation:
  language: ml
  text: മെരാരിയുടെ പുത്രന്മാർക്ക് അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്, രൂബേൻ ഗോത്രത്തിൽനിന്നും ഗാദ് ഗോത്രത്തിൽനിന്നും സെബൂലൂൻ ഗോത്രത്തിൽനിന്നും നറുക്കിലൂടെ പന്ത്രണ്ട് പട്ടണങ്ങൾ ലഭിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാർക്ക്
  rationale: ലേവ്യവംശത്തിലെ വിഹിതം സ്വീകരിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന വംശാവലിപരമായ പ്രയോഗം നിലനിർത്തുന്നു; 'സന്തതികൾക്ക്' എന്നതിനെക്കാൾ മൂലരൂപത്തോട് അടുത്തതാണ്.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഗോത്രവിഭജനത്തിന്റെ പശ്ചാത്തലത്തിൽ מִשְׁפָּחָה കുടുംബത്തെക്കാൾ വിശാലമായ കുലവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מִמַּטֵּה
  choice: ഗോത്രത്തിൽനിന്നും
  rationale: വിഹിതവിതരണസന്ദർഭത്തിൽ מַטֶּה എന്നത് 'ഗോത്രം' എന്നാണ്; ആവർത്തനം മൂലപാഠത്തെ അനുസരിച്ച് സൂക്ഷിച്ചു.
- source_word: רְאוּבֵן / גָד / זְבוּלֻן
  choice: രൂബേൻ / ഗാദ് / സെബൂലൂൻ
  rationale: ഗോത്രനാമങ്ങളുടെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണം.
- source_word: בַּגּוֹרָל
  choice: നറുക്കിലൂടെ
  rationale: വിഹിതം നിർണയിച്ച മാർഗം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: പന്ത്രണ്ട് പട്ടണങ്ങൾ
  rationale: עִיר എന്നത് ഇവിടത്തെ വിഹിതപ്പട്ടികയിൽ ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു; 'പട്ടണങ്ങൾ' ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
