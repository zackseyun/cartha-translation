translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിൽ പൂർണ്ണക്രിയ വ്യക്തമല്ലെങ്കിലും സന്ദർഭം വിഹിതം ലഭിച്ചതാണെന്നതിനാൽ മലയാളത്തിലെ പൂർണ്ണവാക്യത്തിനായി 'ലഭിച്ചു' ചേർത്തു; ഗോത്രങ്ങളുടെ ആവർത്തിത ഘടന നിലനിർത്തി.
