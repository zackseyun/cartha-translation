  text: בֶּן חֲשַׁבְיָ֥ה בֶן אֲמַצְיָ֖ה בֶּן חִלְקִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/030.yaml
  text: the son of Hashabiah, the son of Amaziah, the son of Hilkiah.
translation:
  language: ml
  text: ഹശബ്യാവിന്റെ മകൻ; അമസ്യാവിന്റെ മകൻ; ഹിൽക്കീയാവിന്റെ മകൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിപ്പട്ടികയിലെ ആവർത്തിത ഘടന നിലനിർത്തിക്കൊണ്ട് നേരിട്ടുള്ളതോ വംശപരമ്പരാഗതമോ ആയ പുത്രബന്ധം സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘വംശജൻ’ ആവശ്യമില്ല.
- source_word: חֲשַׁבְיָה
  choice: ഹശബ്യാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾ നാമരൂപത്തിന് അനുയോജ്യമായി ലിപ്യന്തരിച്ചു.
- source_word: אֲמַצְיָה
  choice: അമസ്യാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന പരമ്പരാഗത രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: חִלְקִיָּה
  choice: ഹിൽക്കീയാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമം അതിന്റെ ശബ്ദഘടനയും മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ നാമരൂപവും മാനിച്ച് ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, വംശാവലിയുടെ സംക്ഷിപ്തവും ആവർത്തനാത്മകവുമായ ശൈലി സംരക്ഷിച്ചു. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച വംശാവലിയുടെ തുടർച്ചയായതിനാൽ മൂലത്തിലെ ഖണ്ഡവാക്യസ്വഭാവം നിലനിർത്തി.
