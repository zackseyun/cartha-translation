  text: וְ/אֶת חֶשְׁבּוֹן֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת יַעְזֵ֖יר וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/066.yaml
  text: and Heshbon with its pasturelands[a], and Jazer with its pasturelands.
translation:
  language: ml
  text: ഹെശ്ബോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], യാസേരും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നഗരത്തിനോടു ചേർന്നുള്ള തുറസ്സുനിലങ്ങൾ’ അല്ലെങ്കിൽ ‘ചുറ്റുമുള്ള മേച്ചിൽപ്പുറങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഒരു നഗരത്തിനവകാശപ്പെട്ട തുറസ്സായ ഭൂമിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യനഗരങ്ങളുടെ സന്ദർഭത്തിൽ നഗരത്തിനവകാശപ്പെട്ട തുറസ്സായ, കന്നുകാലികളെ മേയിക്കാനുള്ള ഭൂമിയെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്. ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകാൻ ‘മേച്ചിൽപ്പുറങ്ങൾ’ തെരഞ്ഞെടുത്തു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഓരോ നഗരത്തെയും സൂചിപ്പിക്കുന്ന ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: יַעְזֵיר
  choice: യസേർ
  rationale: സ്ഥലനാമം എബ്രായ രൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְאֶת
  choice: -ഉം
  rationale: וְ എന്ന സംയോജകവും നേരിട്ടു വിവർത്തനം ചെയ്യാത്ത കർമസൂചകമായ אֶת-ഉം ചേർന്ന് പട്ടികയിലെ ഇനങ്ങളെ ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ സമുച്ചയപ്രത്യയം ‘-ഉം’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും പട്ടികാസ്വഭാവം നിലനിർത്തുന്നതുമായ രൂപം. വാക്യം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന പട്ടികയായതിനാൽ അനാവശ്യമായി ക്രിയ ചേർത്തിട്ടില്ല. സ്ഥലനാമങ്ങൾ എബ്രായരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
