id: 1CH.6.3
reference: 1 Chronicles 6:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֖י קְהָ֑ת עַמְרָ֣ם וְ/יִצְהָ֔ר וְ/חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/003.yaml
  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: ml
  text: 'കെഹാത്തിന്റെ പുത്രന്മാർ: അമ്രാം, യിസ്ഹാർ, ഹെബ്രോൻ, ഉസ്സീയേൽ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: בְנֵי എന്ന സംയുക്തരൂപം ഈ വംശാവലിയിൽ കെഹാത്തിന്റെ നേരിട്ടുള്ള പുത്രന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി. വാക്യാരംഭത്തിലെ וּ മുൻവാക്യത്തോടുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും, സ്വാഭാവികമായ മലയാള വംശാവലിശൈലിയിൽ പ്രത്യേകം ‘കൂടാതെ’ ചേർക്കാതെ തന്നെയും ആ ബന്ധം നിലനിൽക്കുന്നു.
- source_word: קְהָת
  choice: കെഹാത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്നുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: עַמְרָם
  choice: അമ്രാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: וְיִצְהָר
  choice: യിസ്ഹാർ
  rationale: പേരിന്റെ ആരംഭത്തിലെ എബ്രായ y ശബ്ദവും നടുവിലെ ഘർഷധ്വനിയും കഴിയുന്നത്ര നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം; പട്ടികാസംരചനയിൽ മുൻപ്രത്യയമായ וְ വിരാമചിഹ്നത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: וְחֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: ഇവിടെ സ്ഥലപ്പേരല്ല, വ്യക്തിനാമമാണ്; എബ്രായ രൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְעֻזִּיאֵל
  choice: ഉസ്സീയേൽ
  rationale: എബ്രായത്തിലെ ശക്തീകരിച്ച സായിന് ശബ്ദവും ദീർഘസ്വരവും പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം; അവസാന പട്ടികാംഗമായതിനാൽ വേറെ സംയോജകപദം കൂടാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും ലളിതവുമായ മലയാളം. മൂലപാഠത്തിലെ സംക്ഷിപ്ത വംശാവലിരൂപവും പേരുകളുടെ ക്രമവും നിലനിർത്തി; അനാവശ്യമായ വിശദീകരണപദങ്ങൾ ചേർത്തിട്ടില്ല.
