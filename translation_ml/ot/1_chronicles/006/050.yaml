source:
  edition: WLC
  text: וַ/יִּתְּנ֣וּ בַ/גּוֹרָ֗ל מִ/מַּטֵּ֤ה בְנֵי יְהוּדָה֙ וּ/מִ/מַּטֵּ֣ה בְנֵי שִׁמְע֔וֹן וּ/מִ/מַּטֵּ֖ה בְּנֵ֣י בִנְיָמִ֑ן אֵ֚ת הֶ/עָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁר יִקְרְא֥וּ אֶתְ/הֶ֖ם בְּ/שֵׁמֽוֹת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/050.yaml
  text: They assigned by lot from the tribe of the sons of Judah[a], and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities, which they called by name.
translation:
  language: ml
  text: അവർ യെഹൂദാഗോത്രത്തിൽനിന്നും ശിമെയോൻഗോത്രത്തിൽനിന്നും ബെന്യാമീൻഗോത്രത്തിൽനിന്നും പേരെടുത്തു പറഞ്ഞ ഈ പട്ടണങ്ങൾ നറുക്കിട്ട് നൽകി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ ആശയവിവർത്തനമായി: “പേരുകളാൽ സൂചിപ്പിക്കപ്പെട്ട ഈ പട്ടണങ്ങൾ.” എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവയെ പേരുകളാൽ വിളിക്കുന്നു’ എന്ന പ്രയോഗമാണുള്ളത്; തുടർന്ന് വരുന്ന പേരുപട്ടികയെ പരിചയപ്പെടുത്തുന്ന ഒരു സൂത്രവാക്യമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: നൽകി
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘നൽകുക’ നിലനിർത്തുന്നു; ലേവ്യപട്ടണങ്ങളുടെ വിഭജനസന്ദർഭത്തിൽ ഇത് അനുവദിച്ചുനൽകൽ എന്ന അർഥവും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: בַגּוֹרָל
  choice: നറുക്കിട്ട്
  rationale: גורל സൂചിപ്പിക്കുന്ന നറുക്കെടുപ്പിലൂടെയുള്ള വിഭജനരീതി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: מִמַּטֵּה בְנֵי יְהוּדָה
  choice: യെഹൂദാഗോത്രത്തിൽനിന്നും
  rationale: ഇവിടെ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്; בְנֵי എന്ന വംശീയപ്രയോഗം മലയാളത്തിലെ ഗോത്രനാമത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: וּמִמַּטֵּה בְנֵי שִׁמְעוֹן
  choice: ശിമെയോൻഗോത്രത്തിൽനിന്നും
  rationale: യെഹൂദയെപ്പറ്റിയുള്ള സമാന്തര ഗോത്രപ്രയോഗത്തോട് ഏകീകരിച്ചും സ്വാഭാവിക മലയാളശൈലിയിലും പരിഭാഷപ്പെടുത്തി.
- source_word: וּמִמַּטֵּה בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീൻഗോത്രത്തിൽനിന്നും
  rationale: മൂലത്തിലെ സമാന്തര ഗോത്രഘടന നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യമുള്ള മലയാളം നൽകി.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങൾ
  rationale: עָרִים എന്ന പദത്തിന് ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: אֲשֶׁר יִקְרְאוּ אֶתְהֶם בְּשֵׁמוֹת
  choice: അവയെ പേരുപറഞ്ഞ് വിളിച്ചു
  rationale: קרא എന്ന ‘വിളിക്കുക’ എന്ന ക്രിയാത്മക ആശയവും בְּשֵׁמוֹת എന്ന പേരുകളെ സംബന്ധിച്ച സൂചനയും ഔപചാരികമായി നിലനിർത്തുന്നു; തുടർന്ന് വരുന്ന പേരുപട്ടികയെ പരിചയപ്പെടുത്തുന്ന സൂത്രവാക്യമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ഗദ്യശൈലി. ‘യെഹൂദയുടെ മക്കളുടെ ഗോത്രം’ എന്ന അക്ഷരാർഥഘടനയ്ക്കുപകരം മലയാളത്തിൽ സ്വാഭാവികമായ ‘യെഹൂദാഗോത്രം’ ഉപയോഗിച്ചു. മൂലത്തിലെ അല്പം ദുഷ്കരമായ പേരിടൽസൂത്രം മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ച് അതിന്റെ പ്രവർത്തനാർഥം അടിക്കുറിപ്പിൽ നൽകി.
