reference: 1 Chronicles 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּהְי֨וּ מְשָׁרְתִ֜ים לִ/פְנֵ֨י מִשְׁכַּ֤ן אֹֽהֶל מוֹעֵד֙ בַּ/שִּׁ֔יר עַד בְּנ֧וֹת שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם וַ/יַּעַמְד֥וּ כְ/מִשְׁפָּטָ֖/ם עַל עֲבוֹדָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
translation:
  language: ml
  text: അവർ തിരുനിവാസമായ സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽ ഗാനത്തോടെ[a] ശുശ്രൂഷ ചെയ്തുപോന്നു—ശലോമോൻ യെരൂശലേമിൽ യഹ്‌വെയുടെ ആലയം[b] പണിയുന്നതുവരെ. തങ്ങളുടെ ശുശ്രൂഷയ്ക്കായി അവർ തങ്ങൾക്കു നിശ്ചയിച്ചിരുന്ന ക്രമപ്രകാരം[c] നിലകൊണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഗാനത്തോടെ’; ‘പാട്ടിലൂടെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ‘യഹ്‌വെയുടെ ഭവനം’; അതായത് ദേവാലയം.
    reason: lexical_alternative
  - marker: c
    text: ‘തങ്ങൾക്കുള്ള ചട്ടപ്രകാരം’ അഥവാ ‘തങ്ങളുടെ പതിവുപ്രകാരം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: ശുശ്രൂഷ ചെയ്തുപോന്നു
  rationale: ആരാധനാസംബന്ധമായ ഔദ്യോഗിക സേവനത്തെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപത്തിന്റെ തുടർച്ചാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരമായ തിരുനിവാസം
  rationale: מִשְׁכָּן എന്ന ‘തിരുനിവാസം’ എന്ന ആശയവും אֹהֶל מוֹעֵד എന്ന ‘സമാഗമകൂടാരം’ എന്ന പേരും ഒന്നും ഒഴിവാക്കാതെ വിശേഷണബന്ധത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּשִּׁיר
  choice: പാട്ടുപാടി
  rationale: അവരുടെ ശുശ്രൂഷയുടെ രീതി സംഗീതാലാപനമായിരുന്നുവെന്ന് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഹീബ്രു പ്രയോഗത്തിന്റെ കൂടുതൽ പദാനുപദ രൂപങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עַד בְּנוֹת שְׁלֹמֹה
  choice: ശലോമോൻ ... പണിയുന്നതുവരെ
  rationale: עַד സഹിതമുള്ള infinitive construct സൂചിപ്പിക്കുന്ന കാലപരിധിയുടെ അവസാനബിന്ദു മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ആലയം
  rationale: בַּיִת എന്നത് പദാനുപദമായി ‘ഭവനം’ ആണെങ്കിലും ഇവിടെ യെരൂശലേമിലെ ദേവാലയമാണ് സൂചിതം; ‘ആലയം’ ആ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു, പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്യുന്നു.
- source_word: וַיַּעַמְדוּ
  choice: സ്ഥാനമേറ്റു
  rationale: പദാനുപദമായ ‘നിന്നു’ എന്നതിലുപരി, നിയോഗിക്കപ്പെട്ട ശുശ്രൂഷയിൽ തങ്ങളുടെ സ്ഥാനം ഏറ്റെടുക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כְמִשְׁפָּטָם
  choice: തങ്ങൾക്കു നിശ്ചയിച്ചിരുന്ന ക്രമപ്രകാരം
  rationale: ആരാധനാസേവനത്തിനുള്ള സ്ഥാപിതമായ ചട്ടമോ ക്രമമോ എന്ന അർഥം നൽകുന്നു; ‘ചട്ടപ്രകാരം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַל עֲבוֹדָתָם
  choice: തങ്ങളുടെ ശുശ്രൂഷ നിർവഹിക്കാൻ
  rationale: עַל ഇവിടെ അവരുടെ നിയോഗിത സേവനത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു; പദാനുപദമായി അസ്വാഭാവികമായ മലയാളം ഒഴിവാക്കി പ്രവർത്തനബന്ധം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ ശബ്ദാന്തരം ചെയ്യുന്നത് മൂലരൂപത്തെ സുതാര്യമായി സംരക്ഷിക്കുന്നു.
- issue: בֵּית יְהוָה എന്നതിലെ ‘ഭവനം’
  choice: യഹ്‌വെയുടെ ആലയം
  alternative: യഹ്‌വെയുടെ ഭവനം
  rationale: ഇവിടെ സൂചിപ്പിക്കുന്നത് ശലോമോൻ പണിത ദേവാലയമാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്; എങ്കിലും ഹീബ്രുവിലെ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ നൽകി രൂപകവും ചരിത്രപരമായ പ്രയോഗവും മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ആരാധനാസംബന്ധ പദാവലി ഉപയോഗിച്ചു. നീണ്ട ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ഒന്നാം വാക്യത്തിലെ കാലപരിധി ദീർഘവിരാമംകൊണ്ട് വ്യക്തമാക്കി. മൂലത്തിലെ ‘നിന്നു’ എന്ന പദചിത്രം സന്ദർഭാനുസൃതമായ ‘സ്ഥാനമേറ്റു’ എന്ന രൂപത്തിൽ നൽകി.
