  yaml_path: translation/ot/1_chronicles/006/041.yaml
  text: But the fields of the city and its pasturelands they gave to Caleb son of Jephunneh[a].
translation:
  language: ml
  text: എന്നാൽ നഗരത്തിന്റെ വയലുകളും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a] അവർ യെഫുന്നെയുടെ മകനായ കാലേബിനു കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിന്റെ ഗ്രാമങ്ങൾ’ എന്നോ ‘അതിന്റെ അധിവാസകേന്ദ്രങ്ങൾ’ എന്നോ വിവർത്തനം ചെയ്യാം. ഭൂമി വിഹിതമായി നൽകുന്ന ഈ സന്ദർഭത്തിൽ, എബ്രായപദം നഗരത്തിനുള്ളിലെ മുറ്റങ്ങളെയല്ല, നഗരത്തോടു ചേർന്ന ഭൂഭാഗങ്ങളെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: നഗരത്തിന്റെ വയലുകൾ
  rationale: שָׂדֶה എന്നത് തുറസ്സായ നിലം, വയൽ, കൃഷിഭൂമി എന്നിവയെ സൂചിപ്പിക്കുന്നു. ഇവിടെ ഏകവചനരൂപത്തിന് സമൂഹാർഥമുള്ളതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ബഹുവചനമായ ‘വയലുകൾ’ എന്നു നൽകി.
- source_word: חֲצֵרֶיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: നഗരവിഹിതത്തിന്റെ ഈ സന്ദർഭത്തിൽ חָצֵר നഗരത്തോടു ചേർന്ന ആശ്രിതഗ്രാമങ്ങളെയോ ഉപയോഗത്തിനുള്ള തുറസ്സായ പ്രദേശങ്ങളെയോ സൂചിപ്പിക്കാം. പ്രവർത്തനാർഥം വ്യക്തമാക്കുന്ന ‘മേച്ചിൽപ്പുറങ്ങൾ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; യഥാർഥ പദാർഥത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: נָתְנוּ
  choice: അവർ കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ ലളിതമായ ‘കൊടുക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘വിഹിതമായി നൽകി’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കി.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: യെഫുന്നെയുടെ മകനായ കാലേബിനു
  rationale: לְ പരോക്ഷകർമത്തെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യക്രമവും ദത്തിവിഭക്തിയും ഉപയോഗിച്ചു; വ്യക്തിനാമങ്ങൾ മൂലഭാഷയോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וְאֶת ... וְאֶת
  choice: എന്നാൽ ... ഉം ... ഉം
  rationale: 'ആദ്യ וְ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു: നഗരം ഒരു വിഭാഗത്തിനായിരുന്നെങ്കിലും അതിനോടു ബന്ധപ്പെട്ട നിലങ്ങൾ കാലേബിനു ലഭിച്ചു. അതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി; ഇരട്ട אֶת ഘടന മലയാളത്തിലെ സംയോജകപ്രത്യയങ്ങളാൽ പ്രതിഫലിപ്പിച്ചു.'
