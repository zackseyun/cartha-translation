  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഭൂവിഹിതസന്ദർഭത്തിലെ വൈരുധ്യം ‘എന്നാൽ’ എന്നതിലൂടെ വ്യക്തമാക്കി; חֲצֵרֶיהָ എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
