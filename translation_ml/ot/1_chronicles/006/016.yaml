id: 1CH.6.16
reference: 1 Chronicles 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה אֲשֶׁ֨ר הֶעֱמִ֥יד דָּוִ֛יד עַל יְדֵי שִׁ֖יר בֵּ֣ית יְהוָ֑ה מִ/מְּנ֖וֹחַ הָ/אָרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
translation:
  language: ml
  text: പെട്ടകം വിശ്രമസ്ഥാനത്ത് എത്തിയശേഷം, യഹ്‌വേയുടെ ഭവനത്തിലെ ഗാനശുശ്രൂഷയുടെ ചുമതല[a] ദാവീദ് ഏൽപ്പിച്ചവർ ഇവരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാടുന്നതിനായി” അല്ലെങ്കിൽ “ഗാനത്തിന്റെ മേൽനോട്ടത്തിൽ.” എബ്രായപ്രയോഗം വിശുദ്ധമന്ദിരത്തിലെ സംഗീതാരാധനയോടുള്ള ഉത്തരവാദിത്വത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה אֲשֶׁר
  choice: നിയമിച്ചവർ ഇവരാണ്
  rationale: തുടർന്നുവരുന്ന പേരുകളുടെ പട്ടികയെ പരിചയപ്പെടുത്തുന്ന ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭം വ്യക്തമായതിനാൽ മൂലത്തിൽ ഇല്ലാത്ത ‘പുരുഷന്മാർ’ ചേർത്തിട്ടില്ല.
- source_word: הֶעֱמִיד דָּוִיד
  choice: ദാവീദ് നിയമിച്ച
  rationale: עמד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെ ഔദ്യോഗിക ചുമതലയിൽ നിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘നിയമിച്ച’ അനുയോജ്യമാണ്.
- source_word: עַל יְדֵי שִׁיר
  choice: ഗാനശുശ്രൂഷയുടെ ചുമതലയിൽ
  rationale: ഈ പ്രയോഗത്തിൽ ഉത്തരവാദിത്വം/മേൽനോട്ടം എന്ന ആശയവും שִׁיר എന്നതിലെ ഗാനം/ആലാപനം എന്ന ആശയവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ഭവനം
  rationale: בֵּית എന്ന ‘ഭവനം’ എന്ന രൂപകൽപ്പന നിലനിർത്തുകയും ദൈവനാമമായ יהוה നേരിട്ട് ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: מִמְּנוֹחַ הָאָרוֹן
  choice: പെട്ടകം വിശ്രമസ്ഥാനത്ത് എത്തിയശേഷം
  rationale: അക്ഷരാർഥത്തിലെ ‘പെട്ടകത്തിന്റെ വിശ്രമംമുതൽ’ എന്ന കാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സ്ഥിരമായ വിശ്രമസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന מְנוֹחַയുടെ നാമരൂപഭാവവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: הָאָרוֹן
  choice: പെട്ടകം
  rationale: മൂലപാഠത്തിൽ ‘പെട്ടകം’ മാത്രമേയുള്ളൂ; ‘നിയമപെട്ടകം’ എന്ന വിശദീകരണം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: עַל יְדֵי שִׁיר എന്ന ആരാധനാസംബന്ധമായ ചുമതല
  choice: ഗാനശുശ്രൂഷയുടെ ചുമതലയിൽ
  alternative: പാടുന്നതിനായി / ഗാനത്തിന്റെ മേൽനോട്ടത്തിൽ
  rationale: ഇത് വെറും പാടൽ മാത്രമാണോ ഔദ്യോഗിക മേൽനോട്ടമാണോ എന്ന സൂക്ഷ്മത പൂർണമായി തീർപ്പാക്കാതെ, സംഗീതാരാധനയോടുള്ള നിയുക്ത ഉത്തരവാദിത്വം പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഗാനശുശ്രൂഷ’ ആരാധനാസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘ഭവനം’ മൂലത്തിലെ രൂപകൽപ്പന സംരക്ഷിക്കുന്നു. കാലസൂചന വ്യക്തതയ്ക്കായി വാക്യത്തിന്റെ തുടക്കത്തിലാക്കി.
