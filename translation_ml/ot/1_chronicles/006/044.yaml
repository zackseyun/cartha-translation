id: 1CH.6.44
reference: 1 Chronicles 6:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת עָשָׁן֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת בֵּ֥ית שֶׁ֖מֶשׁ וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/044.yaml
  text: Ashan with its pasturelands[a], and Beth-shemesh with its pasturelands.
translation:
  language: ml
  text: ആശാനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], ബേത്ത്-ശേമെശും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില സമാന്തര പാഠസാക്ഷ്യങ്ങളും പരിഭാഷകളും ഇവിടെ ‘ആശാൻ’ എന്നതിനുപകരം ‘അയിൻ’ എന്നു ചേർക്കുന്നു; ദിനവൃത്താന്തത്തിന്റെ മസോററ്റിക് പാഠത്തിൽ ‘ആശാൻ’ എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: עָשָׁן
  choice: ആശാൻ
  rationale: മസോററ്റിക് ദിനവൃത്താന്തപാഠത്തിലെ സ്ഥലനാമം അർത്ഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; സമാന്തരസാക്ഷ്യങ്ങളിലെ ‘അയിൻ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യപട്ടണങ്ങളുടെ പശ്ചാത്തലത്തിൽ പട്ടണത്തോടു ചേർന്ന കന്നുകാലിമേച്ചിലിനുള്ള തുറന്ന പ്രദേശങ്ങളെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്; ബഹുവചനവും മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥതയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: בֵּית שֶׁמֶשׁ
  choice: ബേത്ത്-ശേമെശ്
  rationale: സ്ഥലപ്പേര് വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തെ അനുഗമിച്ച് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְאֶת
  choice: -ഉം
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള സംയോജകവും കർമചിഹ്നവും പട്ടികയുടെ ഘടന നിർമിക്കുന്നു; മലയാളത്തിൽ കർമചിഹ്നം പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ സംയോജകത്തെ ‘-ഉം’ കൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. സ്ഥലനാമങ്ങൾ എബ്രായത്തിൽനിന്ന് ലിപ്യന്തരിച്ചു; ‘മേച്ചിൽപ്പുറങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
