source:
  edition: WLC
  text: בְּנֵ֖י קְהָ֑ת עַמִּינָדָ֣ב בְּנ֔/וֹ קֹ֥רַח בְּנ֖/וֹ אַסִּ֥יר בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/007.yaml
  text: 'The sons of Kohath: Amminadab his son[a], Korah his son, Assir his son.'
translation:
  language: ml
  text: 'കെഹാത്തിന്റെ പുത്രന്മാർ: അമ്മീനാദാബ് അവന്റെ മകൻ[a], കോരഹ് അവന്റെ മകൻ, അസ്സീർ അവന്റെ മകൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചിലർ സമാന്തര വംശാവലികൾ താരതമ്യം ചെയ്യുന്നു; അവയിൽ ഇതിനോടു തത്തുല്യനായ പൂർവികന്റെ പേര് അമ്മീനാദാബ് എന്നതിനു പകരം യിസ്ഹാർ എന്നാണ്. എന്നാൽ ഇവിടെയുള്ള എബ്രായ പാഠത്തിൽ അമ്മീനാദാബ് എന്നാണ് വായിക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലി അവതരിപ്പിക്കുന്ന בֵּן എന്ന പദത്തിന്റെ construct ബഹുവചനം. വംശാവലികളിൽ തലമുറകൾ വിട്ടുപോകാൻ സാധ്യതയുണ്ടെങ്കിലും, തുടർന്ന് ആവർത്തിക്കുന്ന ‘അവന്റെ മകൻ’ എന്ന പ്രയോഗം കണക്കിലെടുത്ത് നേരിട്ടുള്ള പിതൃപുത്ര ഭാഷ നിലനിർത്തി.
- source_word: קְהָת
  choice: കെഹാത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: עַמִּינָדָב
  choice: അമ്മീനാദാബ്
  rationale: എബ്രായ പാഠത്തിലുള്ള വ്യക്തിനാമം ലിപ്യന്തരിച്ചു. സമാന്തര വംശാവലികളിലെ യിസ്ഹാർ എന്ന പേരുമായി ഒത്തുനോക്കിയാലും മുഖ്യപാഠത്തിലെ അമ്മീനാദാബ് നിലനിർത്തി.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയമുള്ള ‘മകൻ’ എന്ന പദം; എബ്രായ വംശാവലിയുടെ ശൃംഖലാരൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: קֹרַח
  choice: കോരഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אַסִּיר
  choice: അസ്സീർ
  rationale: ഇവിടെ സാധാരണ പദത്തിന്റെ അർഥം വിവർത്തനം ചെയ്യാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനഘടന സംരക്ഷിക്കാൻ ‘അവന്റെ മകൻ’ ഓരോ കണ്ണിയിലും നിലനിർത്തി; എല്ലാ വ്യക്തിനാമങ്ങളും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
