id: 1CH.6.13
reference: 1 Chronicles 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֧י שְׁמוּאֵ֛ל הַ/בְּכֹ֥ר וַשְׁנִ֖י וַ/אֲבִיָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/013.yaml
  text: 'And the sons of Samuel: the firstborn[a], Vashni, and Abijah.'
translation:
  language: ml
  text: 'ശമൂവേലിന്റെ പുത്രന്മാർ: ആദ്യജാതൻ, വശ്നി[a], അബീയാവ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം: ‘വശ്നി.’ ഈ പ്രയോഗം ‘ആദ്യജാതൻ, രണ്ടാമൻ, അബീയാവ്’ എന്നും മനസ്സിലാക്കാം. 1 ശമൂവേൽ 8:2-ൽ ശമൂവേലിന്റെ പുത്രന്മാരായി യോവേലിനെയും അബീയാവിനെയും പറയുന്നു.'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ו ഇവിടെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ, construct രൂപമായ בְנֵיയെ ‘പുത്രന്മാർ’ എന്നു നൽകി.
- source_word: שְׁמוּאֵל
  choice: ശമൂവേൽ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הַבְּכֹר
  choice: ആദ്യജാതൻ
  rationale: കുടുംബത്തിലെ ജനനക്രമവും പദവിയും സൂചിപ്പിക്കുന്ന നിർദ്ദിഷ്ട നാമത്തിന് കൃത്യവും സ്വാഭാവികവുമായ സമാനപദം.
- source_word: וַשְׁנִי
  choice: വശ്നി
  rationale: മസോരറ്റിക് സ്വരചിഹ്നീകരണം ഇതിനെ വ്യക്തിനാമമായി അവതരിപ്പിക്കുന്നതിനാൽ പ്രധാന പാഠത്തിൽ ലിപ്യന്തരിച്ചു; ‘രണ്ടാമൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַאֲבִיָּה
  choice: അബീയാവ്
  rationale: ബന്ധകത്തോടുകൂടിയ വ്യക്തിനാമം; മലയാളത്തിൽ പരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു. പട്ടികയിലെ ബന്ധം ചിഹ്നനിർമാണത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions:
- issue: ശമൂവേലിന്റെ പുത്രന്മാരുടെ പേരുകളും ജനനക്രമവും സംബന്ധിച്ച പാഠപ്രശ്നം
  choice: മസോരറ്റിക് പാഠത്തിലെ രൂപം പിന്തുടർന്ന് പ്രധാന പാഠത്തിൽ ‘വശ്നി’ നിലനിർത്തി.
  alternative: ഈ പ്രയോഗത്തെ ‘ആദ്യജാതൻ; രണ്ടാമൻ അബീയാവ്’ എന്നു മനസ്സിലാക്കാം; 1 ശമൂവേൽ 8:2 അനുസരിച്ച് ആദ്യജാതന്റെ പേര് ‘യോവേൽ’ എന്നു പൂരിപ്പിക്കാനും കഴിയും.
  rationale: ഇത് ഉപദേശപരമായ പ്രശ്നത്തേക്കാൾ പാഠപരവും വംശാവലിസംബന്ധവുമായ ദുഷ്കരതയാണ്. സമാന്തരവാക്യത്തോട് നിശ്ശബ്ദമായി പൊരുത്തപ്പെടുത്താതെ ലഭ്യമായ എബ്രായ പാഠം പ്രധാന പാഠത്തിൽ സൂക്ഷിക്കുകയും യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. എബ്രായത്തിലെ ബന്ധകങ്ങൾ യാന്ത്രികമായി ആവർത്തിക്കാതെ, മലയാള പട്ടികാവാക്യത്തിന്റെ സ്വാഭാവികത പാലിച്ചു; പാഠത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമായി സൂക്ഷിച്ചു.
