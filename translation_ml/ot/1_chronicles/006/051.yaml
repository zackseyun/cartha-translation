id: 1CH.6.51
reference: 1 Chronicles 6:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִֽ/מִּשְׁפְּח֖וֹת בְּנֵ֣י קְהָ֑ת וַ/יְהִי֙ עָרֵ֣י גְבוּלָ֔/ם מִ/מַּטֵּ֖ה אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/051.yaml
  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
translation:
  language: ml
  text: കെഹാത്തിന്റെ പുത്രന്മാരുടെ കുടുംബങ്ങളിൽനിന്നുള്ളവർക്ക്[a] അവരുടെ പ്രദേശത്തിലെ പട്ടണങ്ങൾ[b] എഫ്രയീം ഗോത്രത്തിൽനിന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കെഹാത്തിന്റെ പുത്രന്മാരുടെ കുലങ്ങളിൽനിന്നുള്ളവർക്ക്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരുടെ അതിർത്തിപ്പട്ടണങ്ങൾ’; എബ്രായപദത്തിന് ‘അതിർത്തി,’ ‘അതിർപ്രദേശം,’ ‘ഭൂപ്രദേശം’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  choice: കുടുംബങ്ങളിൽനിന്നുള്ളവർക്ക്
  rationale: מִשְׁפָּחוֹת എന്നത് കുടുംബവിഭാഗങ്ങളെയോ കുലങ്ങളെയോ സൂചിപ്പിക്കുന്നു. מִן എന്നതിന്റെ ‘നിന്ന്/കൂട്ടത്തിൽനിന്ന്’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, പട്ടണങ്ങളുടെ വിഹിതം ലഭിച്ചവരെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘നിന്നുള്ളവർക്ക്’ എന്നു നൽകി; തുടക്കത്തിലെ וּ മുൻപത്തെ പട്ടികയോടുള്ള ബന്ധത്തിലൂടെ മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: בְּנֵי קְהָת
  choice: കെഹാത്തിന്റെ പുത്രന്മാർ
  rationale: അക്ഷരാർഥം ‘കെഹാത്തിന്റെ പുത്രന്മാർ’ എന്നാണ്. സന്ദർഭത്തിൽ പിൻതലമുറക്കാരെ ഉൾക്കൊള്ളാമെങ്കിലും വംശാവലിശൈലിയും എബ്രായരൂപവും നിലനിർത്താൻ ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: ഇവിടെ היה വിഹിതമായി ലഭിച്ച പട്ടണങ്ങളുടെ ഉറവിടം സൂചിപ്പിക്കുന്ന ബന്ധകക്രിയയാണ്. ‘ആയിരുന്നു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: עָרֵי גְבוּלָם
  choice: അവരുടെ പ്രദേശത്തിലെ പട്ടണങ്ങൾ
  rationale: גְּבוּל എന്ന പദത്തിന് അതിർത്തി, അതിർപ്രദേശം, ഭൂപ്രദേശം എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ലേവ്യപട്ടണങ്ങളുടെ ഭൂവിഹിതമാണ് ഉദ്ദേശിക്കുന്നതെന്നതിനാൽ ‘പ്രദേശത്തിലെ പട്ടണങ്ങൾ’ മുഖ്യപാഠത്തിൽ നൽകി; ‘അതിർത്തിപ്പട്ടണങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: എഫ്രയീം ഗോത്രത്തിൽനിന്ന്
  rationale: ഭൂവിഹിതസന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്. מִן എന്ന ഉറവിടസൂചന ‘നിന്ന്’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വംശാവലിപരമായ ‘പുത്രന്മാർ’ എന്ന പ്രയോഗം നിലനിർത്തി; വിഹിതത്തിന്റെ അർഥം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ആവശ്യമായ ദത്തിവിഭക്തി ഉപയോഗിച്ചു.
