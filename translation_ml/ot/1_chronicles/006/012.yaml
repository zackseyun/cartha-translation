  text: Eliab his son, Jeroham his son, Elkanah his son.
translation:
  language: ml
  text: അവന്റെ മകൻ എലിയാബ്; അവന്റെ മകൻ യെരോഹാം; അവന്റെ മകൻ എൽക്കാനാ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלִיאָב
  choice: എലിയാബ്
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: בֵּן എന്ന പദത്തോടു ചേർന്ന മൂന്നാംപുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയം അക്ഷരാർഥത്തിൽ ‘അവന്റെ മകൻ’ എന്നാണ്; ആവർത്തിക്കുന്ന വംശാവലിഘടന അതേപടി നിലനിർത്തുന്നു.
- source_word: יְרֹחָם
  choice: യെരോഹാം
  rationale: വ്യക്തിനാമം; എബ്രായ രൂപത്തെ അടിസ്ഥാനമാക്കിയ മലയാള ലിപ്യന്തരണം.
- source_word: אֶלְקָנָה
  choice: എൽക്കാനാ
  rationale: വ്യക്തിനാമം; എബ്രായ രൂപത്തെ അടിസ്ഥാനമാക്കിയ മലയാള ലിപ്യന്തരണം.
