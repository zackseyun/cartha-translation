  text: בֶּן יַ֥חַת בֶּן גֵּרְשֹׁ֖ם בֶּן לֵוִֽי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/028.yaml
  text: son of Jahath[a], son of Gershom[b], son of Levi.
translation:
  language: ml
  text: യഹത്തിന്റെ മകൻ[a], ഗേർശോമിന്റെ മകൻ[b], ലേവിയുടെ മകൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, വംശാവലിയുടെ വിശാലമായ പ്രയോഗത്തിൽ: ‘യഹത്തിന്റെ വംശജൻ … ഗേർശോമിന്റെ വംശജൻ … ലേവിയുടെ വംശജൻ.’'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ ‘ഗേർശോം’ എന്നാണ്. മറ്റു വംശാവലികളുടെ പശ്ചാത്തലത്തിൽ ചിലർ ‘ഗേർശോൻ’ എന്നു പ്രതീക്ഷിച്ചേക്കാമെങ്കിലും, ഇവിടെ മൂലപാഠത്തിലുള്ള നാമരൂപം വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിയിൽ בֶּן എന്ന പദത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ അർഥം ‘മകൻ’ എന്നാണ്. ചില വംശാവലികളിൽ തലമുറകൾ ഒഴിവാക്കപ്പെട്ടിരിക്കാമെങ്കിലും, ഇവിടെ അതിനെ ‘വംശജൻ’ എന്നു വിശാലമാക്കേണ്ട നിർബന്ധമില്ല.
- source_word: יַחַת
  choice: യഹത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: גֵּרְשֹׁם
  choice: ഗേർശോം
  rationale: മൂലപാഠത്തിലുള്ള രൂപം גֵּרְשֹׁם ആയതിനാൽ അതിനെ ‘ഗേർശോം’ എന്നു നിലനിർത്തി; മറ്റിടങ്ങളിലെ ‘ഗേർശോൻ’ എന്ന ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ രൂപത്തിലേക്ക് ഏകീകരിച്ചില്ല.
- source_word: לֵוִי
  choice: ലേവി
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന ‘മകൻ’ എന്ന ഘടന മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും വംശബന്ധങ്ങളുടെ ക്രമവും നിലനിർത്തുന്നു.
