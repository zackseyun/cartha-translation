  text: 'And the sons of Elkanah: Amasai and Ahimoth[a].'
translation:
  language: ml
  text: 'എൽക്കാനായുടെ പുത്രന്മാർ: അമാസായിയും അഹീമോത്തും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: בְנֵי എന്ന സംയുക്തരൂപത്തിന് സ്വാഭാവികമായി ‘പുത്രന്മാർ’ എന്നു നൽകി. വംശാവലിയുടെ പട്ടികാശൈലിയിൽ ആരംഭത്തിലെ ו മലയാളത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: אֶלְקָנָה
  choice: എൽക്കാന
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: עֲמָשַׂי
  choice: അമാസായി
  rationale: വ്യക്തിനാമം എബ്രായ രൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; ഇംഗ്ലീഷിലെ വ്യത്യസ്ത അക്ഷരവിന്യാസം മലയാള വിവർത്തനത്തെ ബാധിക്കുന്നില്ല.
- source_word: וַ/אֲחִימוֹת
  choice: അഹീമോത്തും
  rationale: ו എന്ന ബന്ധകത്തെ മലയാളത്തിലെ ചേർക്കൽപ്രത്യയമായ ‘-ഉം’കൊണ്ട് നൽകി; വ്യക്തിനാമം എബ്രായരൂപത്തിൽനിന്ന് ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. പേരുകൾ മൂലഭാഷയിൽനിന്ന് നേരിട്ട് ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു; ഈ വാക്യത്തിന് ആവശ്യമായ പാഠഭേദമോ വിശദീകരണ അടിക്കുറിപ്പോ ഇല്ല.
