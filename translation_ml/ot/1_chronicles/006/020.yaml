translation:
  language: ml
  text: സീഫിന്റെ മകൻ, എൽക്കാനയുടെ മകൻ, മഹത്തിന്റെ മകൻ, അമാസായിയുടെ മകൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിയിൽ നേരിട്ടുള്ള പുത്രബന്ധം സൂചിപ്പിക്കുന്ന പദം. എബ്രായത്തിലെ ആവർത്തനഘടന നിലനിർത്താൻ ഓരോ പേരിനോടും ‘മകൻ’ ആവർത്തിച്ചിരിക്കുന്നു.
- source_word: ציף
  choice: സീഫ്
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶלְקָנָה
  choice: എൽക്കാന
  rationale: വ്യക്തിനാമം; മലയാളത്തിലെ സ്വാഭാവികവും ഉറവിടഭാഷയോട് ചേർന്നതുമായ ലിപ്യന്തരണം.
- source_word: מַחַת
  choice: മഹത്ത്
  rationale: വ്യക്തിനാമം; എബ്രായ വ്യഞ്ജനരൂപം പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: עֲמָשָׂי
  choice: അമാസായി
  rationale: വ്യക്തിനാമം; ഉറവിടത്തിലെ ശബ്ദരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. മൂലപാഠത്തിലെ ആവർത്തനവും വാക്യഖണ്ഡസ്വഭാവവും സംരക്ഷിച്ചിരിക്കുന്നു.
