id: 1CH.6.2
reference: 1 Chronicles 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי גֵרְשׁ֖וֹם לִבְנִ֥י וְ/שִׁמְעִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/002.yaml
  text: 'These are the names of the sons of Gershom: Libni and Shimei[a].'
translation:
  language: ml
  text: 'ഗേർശോമിന്റെ പുത്രന്മാരുടെ പേരുകൾ ഇവയാണ്: ലിബ്നിയും ശിമെയിയും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടത്തെ എബ്രായ കൈയെഴുത്തുപ്രതികളിൽ ‘ഗേർശോം’ എന്നാണ്; ബന്ധപ്പെട്ട ചില വംശാവലിസന്ദർഭങ്ങളിൽ ചില ഇംഗ്ലീഷ് പാരമ്പര്യങ്ങൾ ‘ഗേർശോൻ’ എന്നു ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവയാണ്
  rationale: പട്ടിക അവതരിപ്പിക്കുന്ന സംയോജക-സൂചക പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; വാക്യാരംഭത്തിലെ וְ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെയും അതിന്റെ അവതരണധർമ്മം നിലനിർത്തുന്നു.
- source_word: שְׁמוֹת
  choice: പേരുകൾ
  rationale: שְׁמוֹת בְּנֵי എന്ന ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘പുത്രന്മാരുടെ പേരുകൾ’ എന്നു നൽകി.
- source_word: בְּנֵי
  choice: പുത്രന്മാരുടെ
  rationale: വംശാവലികളിൽ ‘സന്തതികൾ’ എന്ന വിശാലാർഥം സാധ്യമെങ്കിലും, ഇവിടെ പേരെടുത്തിരിക്കുന്നവർ ഗേർശോമിന്റെ നേരിട്ടുള്ള പുത്രന്മാരായി അവതരിപ്പിക്കപ്പെടുന്നതിനാൽ ‘പുത്രന്മാർ’ യോജിക്കുന്നു.
- source_word: גֵרְשׁוֹם
  choice: ഗേർശോം
  rationale: ഇവിടത്തെ മസോററ്റിക് പാഠരൂപമായ גֵרְשׁוֹם വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: לִבְנִי
  choice: ലിബ്നി
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְשִׁמְעִי
  choice: ശിമെയിയും
  rationale: രണ്ടാമത്തെ പേരിനെ ഏകോപിപ്പിക്കുന്ന וְ മലയാളത്തിലെ ‘-യും’ രൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു; שִׁמְעִי എന്ന പേര് ‘ശിമെയി’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. പേരുകൾ മൂലപാഠത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
