id: 1CH.6.49
reference: 1 Chronicles 6:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְּנ֥וּ בְנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם אֶת הֶ/עָרִ֖ים וְ/אֶת מִגְרְשֵׁי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/049.yaml
  text: And the sons of Israel gave to the Levites the cities and their pasturelands[a][b].
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ ലേവ്യർക്കു പട്ടണങ്ങളും അവയുടെ മേച്ചിൽപ്പുറങ്ങളും[a] കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവയുടെ പൊതുഭൂമികൾ’ അല്ലെങ്കിൽ ‘അവയ്ക്കു ചുറ്റുമുള്ള ഭൂമികൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ ഖാൽ വയിക്തോൽ രൂപം; ഈ വിവരണസന്ദർഭത്തിൽ സാധാരണവും സ്വാഭാവികവുമായ അർഥം ‘കൊടുത്തു’ എന്നാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന ആശയം സ്വാഭാവികമായ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ മുഴുവൻ ഇസ്രായേൽജനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לַלְוִיִּם
  choice: ലേവ്യർക്കു
  rationale: ലേവിയുടെ ഗോത്രക്കാരെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ദാതൃവിഭക്തി; മലയാളത്തിൽ പതിവും കൃത്യവുമായ രൂപം.
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: עָרִים പട്ടണങ്ങളെയോ നഗരങ്ങളെയോ സൂചിപ്പിക്കാം; ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികവും സ്ഥാപിതവുമായ പ്രയോഗമാണ്.
- source_word: מִגְרְשֵׁיהֶם
  choice: അവയുടെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണങ്ങളോടു ചേർന്ന തുറസ്സായ, പ്രത്യേകിച്ച് കന്നുകാലികളെ മേയ്ക്കാനുള്ള ഭൂമിയെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്. എബ്രായത്തിലെ സർവനാമത്തിന്റെ മുൻപദം പട്ടണങ്ങളായതിനാൽ ‘അവയുടെ’ എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ’ മൂലഭാഷയിലെ ബന്ധപ്രയോഗം നിലനിർത്തുന്നു; ‘മേച്ചിൽപ്പുറങ്ങൾ’ മִגְרָשׁ എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ ഭൂവിനിയോഗാർഥം വ്യക്തമാക്കുന്നു.
