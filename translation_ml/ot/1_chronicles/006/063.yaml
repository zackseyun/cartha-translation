  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
translation:
  language: ml
  text: 'കൂടാതെ, യെരീഹോവിന് എതിർവശമുള്ള യോർദ്ദാന്റെ അക്കരെ, യോർദ്ദാന്റെ കിഴക്കുവശത്ത്, രൂബേൻ ഗോത്രത്തിൽനിന്ന്: മരുഭൂമിയിലെ ബേസെരും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, യഹ്സാ[a]യും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ സ്ഥലനാമം ചില പരിഭാഷകളിൽ ‘യഹാസ്’ എന്നും നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ
  choice: യോർദ്ദാന്റെ അക്കരെ, യെരീഹോവിന് സമീപം
  rationale: ഭൂമിശാസ്ത്രപരമായ അതിർത്തിയെയും യെരീഹോയോടുള്ള സ്ഥാനബന്ധത്തെയും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാക്യാരംഭത്തിലെ וּ പട്ടികയുടെ തുടർച്ചയായതിനാൽ പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: לְמִזְרַח הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ കിഴക്കുവശത്ത്
  rationale: מִזְרָח എന്ന പദത്തിന്റെ ദിശാസൂചന കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: രൂബേൻ ഗോത്രത്തിൽനിന്ന്
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്.
- source_word: בֶּצֶר בַּמִּדְבָּר
  choice: മരുഭൂമിയിലെ ബേസെർ
  rationale: സ്ഥലനാമത്തെ ലിപ്യന്തരണം ചെയ്യുകയും מִדְבָּר സൂചിപ്പിക്കുന്ന വരണ്ട, ജനവാസം കുറഞ്ഞ പ്രദേശത്തെ ‘മരുഭൂമി’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യനഗരങ്ങൾക്കു ചുറ്റുമുള്ള കന്നുകാലി മേയ്ക്കാനുള്ള തുറന്ന ഭൂമിയെയാണ് ഈ പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: יַהְצָה
  choice: യഹ്സ
  rationale: ഹീബ്രു രൂപത്തെ അടുത്തായി പിന്തുടരുന്ന മലയാള ലിപ്യന്തരണം; മറ്റ് പാരമ്പര്യങ്ങളിൽ കാണുന്ന രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
