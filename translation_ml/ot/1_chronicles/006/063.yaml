translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പട്ടികയുടെ സംക്ഷിപ്ത ഘടന നിലനിർത്തിയിട്ടുണ്ട്; സ്ഥലനാമങ്ങൾ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
