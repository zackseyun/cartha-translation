lexical_decisions:
- source_word: בֶּן
  choice: മകൻ
  rationale: ആവർത്തിച്ചുവരുന്ന വംശാവലിപദമായ בֶּן നേരിട്ടുള്ള പിതൃപുത്രബന്ധം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപത്തിൽ വിവർത്തനം ചെയ്തു. വംശാവലികളിൽ ചിലപ്പോൾ തലമുറകൾ ഒഴിവാക്കിയിരിക്കാമെങ്കിലും, ഇവിടെ ‘സന്തതി’ എന്നു വിപുലീകരിക്കേണ്ട നിർബന്ധമില്ല.
- source_word: יִצְהָר
  choice: യിസ്ഹാർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: קְהָת
  choice: കെഹാത്ത്
  rationale: എബ്രായ വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ, മലയാളത്തിൽ പരിചിതവും ഉച്ചരിക്കാവുന്നതുമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: לֵוִי
  choice: ലേവി
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾരൂപത്തിൽ നിലനിർത്തി.
- source_word: יִשְׂרָאֵל
  choice: യിസ്രായേൽ
  rationale: മൂലപാഠത്തിൽ ‘യാക്കോബ്’ എന്നല്ല, יִשְׂרָאֵל എന്നാണ് ഉള്ളത്; അതിനാൽ ആ പേരുതന്നെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: ‘യിസ്രായേൽ’ എന്ന പേരിന്റെ വ്യക്തിത്വം
  choice: മുഖ്യപാഠത്തിൽ ‘യിസ്രായേൽ’ നിലനിർത്തി; അടിക്കുറിപ്പിൽ യാക്കോബാണെന്ന് വ്യക്തമാക്കി.
  alternative: മുഖ്യപാഠത്തിൽ ‘യാക്കോബ്’ എന്നു നൽകുക.
  rationale: മൂലപാഠത്തിന്റെ വ്യക്തമായ നാമരൂപം മാറ്റാതെ സംരക്ഷിക്കുകയും വായനക്കാരന് അതിന്റെ വംശാവലിസംബന്ധമായ തിരിച്ചറിയൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തിതമായ ‘മകൻ’ എന്ന ഘടന സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] യിസ്ഹാറിനുശേഷം വന്നിരുന്നെങ്കിലും, അടിക്കുറിപ്പ് ‘യിസ്രായേൽ’ എന്ന പേരിനെ വിശദീകരിക്കുന്നതിനാൽ മൂലപാഠവും കുറിപ്പിന്റെ ഉള്ളടക്കവും അനുസരിച്ച് അടയാളം ‘യിസ്രായേൽ’ എന്നതിനുശേഷം ചേർത്തു.
