  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֨י גֵרְשׁ֜וֹם לְ/מִשְׁפְּחוֹתָ֗/ם מִ/מַּטֵּ֣ה יִ֠שָׂשכָר וּ/מִ/מַּטֵּ֨ה אָשֵׁ֜ר וּ/מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וּ/מִ/מַּטֵּ֤ה מְנַשֶּׁה֙ בַּ/בָּשָׁ֔ן עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
translation:
  language: ml
  text: ഗേർശോമിന്റെ[a] പുത്രന്മാർക്ക്, അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്, യിസ്സാഖാർ ഗോത്രത്തിൽനിന്നും ആശേർ ഗോത്രത്തിൽനിന്നും നഫ്താലി ഗോത്രത്തിൽനിന്നും ബാശാനിലെ മനശ്ശെ ഗോത്രത്തിൽനിന്നും[b] പതിമൂന്ന് പട്ടണങ്ങൾ ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ എബ്രായപാഠത്തിൽ കുലനാമം ‘ഗേർശോം’ എന്നാണ് എഴുതിയിരിക്കുന്നത്; മറ്റു ചില പരിഭാഷകളിൽ ‘ഗേർശോൻ’ എന്നു കാണാം.
    reason: alternative_reading
  - marker: b
    text: ചില പരിഭാഷകൾ ഭൂമിശാസ്ത്രപരമായ സൂചന വ്യക്തമാക്കാൻ ‘ബാശാനിലെ മനശ്ശെയുടെ അർധഗോത്രത്തിൽനിന്ന്’ എന്നു വിപുലീകരിക്കുന്നു. എന്നാൽ ഈ വാക്യത്തിന്റെ എബ്രായപാഠത്തിൽ ‘അർധഗോത്രം’ എന്നു പറഞ്ഞിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי גֵרְשׁוֹם
  choice: ഗേർശോമിന്റെ പുത്രന്മാർക്ക്
  rationale: ലേവ്യവിഭാഗത്തിനുള്ള അടുത്ത പട്ടണവിഹിതം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം. ‘പുത്രന്മാർ’ എന്നത് വംശജരെയും കുലാംഗങ്ങളെയും സൂചിപ്പിക്കുന്ന പരമ്പരാഗത വംശാവലിപ്രയോഗമാണ്; ഗേർശോം എന്ന രൂപം ഈ വാക്യത്തിലെ എബ്രായ അക്ഷരരൂപം പിന്തുടരുന്നു.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഗോത്രത്തിനുള്ളിലെ വംശവിഭാഗങ്ങളെയാണ് מִשְׁפָּחָה ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘കുലങ്ങൾ’ ഈ ഭരണപരവും വംശാവലിപരവുമായ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: מִמַּטֵּה
  choice: ഗോത്രത്തിൽനിന്നും
  rationale: ഭൂപ്രദേശ-വംശാവലി സന്ദർഭത്തിൽ מַטֶּה എന്നതിന് ‘ഗോത്രം’ എന്നാണ് അർഥം. ആവർത്തനവും ഉറവിടവിതരണത്തിന്റെ പട്ടികാസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  choice: ബാശാനിലെ മനശ്ശെ ഗോത്രത്തിൽനിന്നും
  rationale: എബ്രായത്തിൽ ‘ബാശാനിലെ മനശ്ശെ’ എന്നു മാത്രമാണ്; ‘അർധഗോത്രം’ എന്ന വിശദീകരണം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: പതിമൂന്ന് പട്ടണങ്ങൾ
  rationale: സംഖ്യാവാചകത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ. പട്ടണങ്ങൾ ഇവർക്കു വിഹിതമായി ലഭിച്ചുവെന്ന മുൻസന്ദർഭത്തിലെ ക്രിയാഭാവം മലയാളവാക്യം പൂർണമാക്കാൻ വ്യക്തമാക്കിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പട്ടികാസ്വഭാവമുള്ള എബ്രായഘടനയിലെ ആവർത്തനം നിലനിർത്തിയെങ്കിലും, ക്രിയയില്ലാത്ത മൂലവാക്യത്തെ മലയാളത്തിൽ പൂർണമാക്കാൻ മുൻസന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘ലഭിച്ചു’ ചേർത്തു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
