  terminology: ‘മേച്ചിൽപ്പുറങ്ങൾ’ ലേവ്യപട്ടണങ്ങളോടു ചേർന്ന മിഗ്രാശ് ഭൂമിക്കു യോജിച്ച സുതാര്യമായ വിവർത്തനമാണ്. സ്ഥലനാമങ്ങളുടെ ലിപ്യന്തരണവും ഹൈഫൻ പ്രയോഗവും സ്ഥിരതയുള്ളതാണ്. ‘യോക്നെയാം’ എന്ന പാരമ്പര്യവായന അടിക്കുറിപ്പിൽ യുക്തമായി പരിമിതപ്പെടുത്തിയിരിക്കുന്നു.
