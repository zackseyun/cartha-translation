source:
  edition: WLC
  text: וְ/אֶֽת יָקְמְעָם֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת בֵּ֥ית חוֹר֖וֹן וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/053.yaml
  text: and Jokmeam with its pasturelands[b][a], and Beth-horon with its pasturelands.
translation:
  language: ml
  text: യോക്മെയാമും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[b][a], ബേത്ത്-ഹോരോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായ പാഠത്തിൽ ‘യോക്മെയാം’; സമാന്തര സ്ഥലനാമപാരമ്പര്യങ്ങളുമായി ബന്ധപ്പെടുത്തി ചില വിവർത്തനപാരമ്പര്യങ്ങൾ ‘യോക്നെയാം’ എന്നു വായിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘പൊതുഭൂമികൾ’ അല്ലെങ്കിൽ ‘ചുറ്റുമുള്ള മേച്ചിൽഭൂമികൾ’; ഓരോ പട്ടണത്തോടും ചേർന്നിരുന്ന ഭൂമി.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְמְעָם
  choice: യോക്മെയാം
  rationale: ദിനവൃത്താന്തങ്ങളിലെ മസോററ്റിക് വ്യഞ്ജനരൂപത്തെ അടിസ്ഥാനമാക്കി സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; സമാന്തര സ്ഥലനാമപാരമ്പര്യങ്ങളിൽ കാണുന്ന ‘യോക്നെയാം’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യനഗരങ്ങളുടെ സന്ദർഭത്തിൽ പട്ടണത്തോടു ചേർന്ന കന്നുകാലിമേച്ചിലിനുള്ള തുറന്ന ഭൂമിയെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: בֵּית חוֹרוֹן
  choice: ബേത്ത്-ഹോരോൻ
  rationale: ഹീബ്രായ സംയുക്ത സ്ഥലനാമത്തിന്റെ ഘടന തിരിച്ചറിയാവുന്നവിധം ഹൈഫനോടെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְאֶת
  choice: -ഉം
  rationale: പട്ടികാസന്ദർഭത്തിലെ ആവർത്തിത സംയോജകവും കർമസൂചകവും മലയാളത്തിൽ സ്വാഭാവികമായി സമുച്ചയപ്രത്യയമായ ‘-ഉം’കൊണ്ട് അവതരിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. മൂലത്തിലെ ആവർത്തനവും സ്ഥലനാമങ്ങളുടെ സ്വഭാവവും സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ്-ചിഹ്നക്രമമായ [b][a] മുഖ്യപാഠത്തിൽ അതേപടി നിലനിർത്തി.
