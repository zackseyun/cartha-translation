  source_fidelity: മൂലഹീബ്രായത്തിലെ രണ്ട് സ്ഥലനാമങ്ങളും അവയോടു ബന്ധിപ്പിച്ചിരിക്കുന്ന മിഗ്രാശ് (‘പട്ടണത്തോടു ചേർന്ന തുറന്ന/മേച്ചിൽഭൂമി’) എന്ന പ്രയോഗവും കൃത്യമായി പ്രതിഫലിക്കുന്നു. പട്ടികാസന്ദർഭത്തിലെ സംയോജനം മലയാളത്തിലെ ‘-ഉം’ വഴി സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
