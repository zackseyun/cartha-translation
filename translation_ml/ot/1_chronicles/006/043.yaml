  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലി-നഗരപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടന നിലനിർത്തിക്കൊണ്ട് ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ഭാഷ ഉപയോഗിച്ചു.
