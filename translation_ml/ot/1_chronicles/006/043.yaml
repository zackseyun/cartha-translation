  text: and Hilen with its pasturelands[a], Debir with its pasturelands.
translation:
  language: ml
  text: ഹീലേനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], ദെബീരും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഹീലേൻ’ എന്ന സ്ഥലനാമം ദിനവൃത്താന്തങ്ങളിലെ എബ്രായരൂപത്തെ പ്രതിഫലിപ്പിക്കുന്നു. സമാന്തരപ്പട്ടികയായ യോശുവ 21:15-ൽ ‘ഹോലോൻ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: חִילֵז
  choice: ഹീലേൻ
  rationale: ദിനവൃത്താന്തങ്ങളിലെ മസോരറ്റിക് എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യനഗരങ്ങളോടു ചേർന്നിരുന്ന തുറന്ന ഭൂമിയെയോ മൃഗങ്ങളെ മേയ്ക്കാനുള്ള പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: דְּבִיר
  choice: ദെബീർ
  rationale: സ്ഥലനാമമായതിനാൽ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ/אֶת
  choice: -ഉം
  rationale: പട്ടികയിലെ ഘടകങ്ങളെ ബന്ധിപ്പിക്കുന്ന וְ മലയാളത്തിൽ സംയോജകപ്രത്യയമായ ‘-ഉം’കൊണ്ട് സ്വാഭാവികമായി പ്രതിനിധീകരിച്ചു; אֶת എന്ന കർമസൂചകത്തിന് പ്രത്യേകം പരിഭാഷ നൽകിയില്ല.
- source_word: אֶת
  choice: —
  rationale: എബ്രായത്തിലെ നിർദിഷ്ട കർമസൂചകത്തിന് മലയാളത്തിൽ നേരിട്ടുള്ള പദസമം ഇല്ല; പട്ടികയുടെ വാക്യഘടനയിൽ അതിന്റെ പ്രവർത്തനം ഉൾക്കൊള്ളുന്നു.
theological_decisions: []
