  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം ഉപയോഗിച്ചു; അതേസമയം ‘മക്കൾ’ എന്ന ഗോത്ര-വംശപരമായ പ്രയോഗവും മൂലപാഠത്തിലെ ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തി.
