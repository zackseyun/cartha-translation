id: 1CH.9.3
reference: 1 Chronicles 9:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בִ/ירוּשָׁלִַ֨ם֙ יָשְׁב֔וּ מִן בְּנֵ֥י יְהוּדָ֖ה וּ/מִן בְּנֵ֣י בִנְיָמִ֑ן וּ/מִן בְּנֵ֥י אֶפְרַ֖יִם וּ/מְנַשֶּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/003.yaml
  text: And in Jerusalem some from the sons of Judah, and some from the sons of Benjamin, and some from the sons of Ephraim and Manasseh, lived there.
translation:
  language: ml
  text: യെഹൂദാമക്കളിൽനിന്നും ബെന്യാമീൻമക്കളിൽനിന്നും എഫ്രയീമിന്റെയും മനശ്ശെയുടെയും മക്കളിൽനിന്നും ചിലർ യെരൂശലേമിൽ താമസിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: ‘യെഹൂദാമക്കളിൽനിന്ന് ... ബെന്യാമീൻമക്കളിൽനിന്ന് ... എഫ്രയീമിന്റെയും മനശ്ശെയുടെയും മക്കളിൽനിന്ന്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/ירוּשָׁלִַם
  choice: യെരൂശലേമിൽ
  rationale: വാക്യത്തിന്റെ സന്ദർഭബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ നിലനിൽക്കുന്നതിനാൽ ആരംഭത്തിലെ וּ വേർതിരിച്ച് ‘കൂടാതെ’ എന്നു നൽകാതെ സ്ഥലസൂചന വ്യക്തമായി വിവർത്തനം ചെയ്തു.
- source_word: יָשְׁבוּ
  choice: താമസിച്ചു
  rationale: ישב എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ അർഥം ഒരു സ്ഥലത്ത് വസിക്കുക എന്നതാണ്; ‘താമസിച്ചു’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: מִן
  choice: മക്കളിൽനിന്നും ... ചിലർ
  rationale: ആവർത്തിക്കുന്ന מִן ഓരോ ഗോത്രവിഭാഗത്തിൽനിന്നുള്ള ഏതാനും ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ചിലർ’ എന്ന കർത്താവിനൊപ്പം ‘-യിൽനിന്നും’ ഉപയോഗിക്കുന്നത് ഈ ഭാഗികത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יְהוּדָה
  choice: യെഹൂദാമക്കൾ
  rationale: ദിനവൃത്താന്തത്തിലെ വംശപരവും ഗോത്രപരവുമായ בני എന്ന പ്രയോഗം ‘മക്കൾ’ എന്നു നിലനിർത്തി.
- source_word: בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീൻമക്കൾ
  rationale: മറ്റു ഗോത്രനാമങ്ങളോടുള്ള ഘടനാസമാന്തര്യം കാത്തുകൊണ്ട് בני എന്നതിന് ‘മക്കൾ’ നൽകി.
- source_word: בְּנֵי אֶפְרַיִם וּ/מְנַשֶּׁה
  choice: എഫ്രയീമിന്റെയും മനശ്ശെയുടെയും മക്കൾ
  rationale: എബ്രായത്തിൽ ‘മക്കൾ’ എന്ന പദം എഫ്രയീമിനോടു മാത്രമേ പ്രത്യക്ഷമായി വരുന്നതുള്ളൂവെങ്കിലും സംയോജിത ഘടനയിൽ അത് മനശ്ശെയ്ക്കും ബാധകമാണ്; മലയാളത്തിൽ ഇരുവർക്കും ബന്ധം വ്യക്തമായി പ്രകടിപ്പിച്ചു.
