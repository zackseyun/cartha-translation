source:
  edition: WLC
  text: וּ/מִן בְּנֵי זֶ֖רַח יְעוּאֵ֑ל וַ/אֲחֵי/הֶ֖ם שֵׁשׁ מֵא֥וֹת וְ/תִשְׁעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/006.yaml
  text: 'And from the sons of Zerah: Jeuel and their brothers[a], six hundred and ninety.'
translation:
  language: ml
  text: സേരഹിന്റെ പുത്രന്മാരിൽനിന്ന് യെയൂവേലും അവരുടെ സഹോദരന്മാരും[a]—ആകെ അറുനൂറ്റിത്തൊണ്ണൂറുപേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “യെയൂവേലും അവന്റെ സഹോദരന്മാരും—ആകെ അറുനൂറ്റിത്തൊണ്ണൂറുപേർ.” യെയൂവേലിനെ വംശത്തിന്റെ പ്രതിനിധിത്തലവനായി കണക്കാക്കിയാൽ ബന്ധം ഇങ്ങനെ ഏകവചനത്തിൽ പറയാം. എന്നാൽ എബ്രായത്തിലെ പ്രത്യയം ബഹുവചനമാണ്: “അവരുടെ സഹോദരന്മാർ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: …യിൽ
  rationale: മുൻപത്തെ ഗോത്രപ്പട്ടികയോടുള്ള കൂട്ടിച്ചേർക്കൽബന്ധം മലയാളത്തിലെ പട്ടികാശൈലിയിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലി-പട്ടികയുടെ പശ്ചാത്തലത്തിൽ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഇവിടെ വിപുലമായി വംശജരെയും സൂചിപ്പിക്കാം.
- source_word: זֶרַח
  choice: സേരഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יְעוּאֵל
  choice: യെയൂവേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וַ/אֲחֵי/הֶם
  choice: അവരുടെ സഹോദരന്മാരും
  rationale: എബ്രായത്തിലെ മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയം മറച്ചുവയ്ക്കാതെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സഹവംശക്കാരെയും സൂചിപ്പിക്കാം.
- source_word: שֵׁשׁ מֵאוֹת וְ/תִשְׁעִים
  choice: ആകെ അറുനൂറ്റിത്തൊണ്ണൂറുപേർ
  rationale: എണ്ണം വാക്കുകളിൽ നൽകി, ഇത് പട്ടികയിലെ ആകെ ആളുകളുടെ എണ്ണമാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ പട്ടികാശൈലി. മൂലപാഠത്തിലെ ബഹുവചനപ്രത്യയം പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുകയും, സ്വാഭാവികമായ ഏകവചനവായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
