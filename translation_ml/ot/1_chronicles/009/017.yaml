  text: And the gatekeepers were Shallum[a], Akkub, Talmon, Ahiman, and their brothers; Shallum was the chief.
translation:
  language: ml
  text: 'കവാടകാവൽക്കാർ ഇവരായിരുന്നു: ശല്ലൂം, അക്കൂബ്, തൽമോൻ, അഹീമാൻ, അവരുടെ സഹോദരന്മാർ[a]; ശല്ലൂം തലവനായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ കുലബന്ധുക്കൾ’; എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവരുടെ സഹോദരന്മാർ’ എന്നാണ്. ഇത്തരം പട്ടികകളിൽ ഇത് സ്വന്തം സഹോദരന്മാരെയോ ഒരേ കുലത്തിൽപ്പെട്ടവരെയോ സൂചിപ്പിക്കാം.
