source:
  edition: WLC
  text: וּ/מִן הַֽ/כֹּהֲנִ֑ים יְדַֽעְיָ֥ה וִ/יהוֹיָרִ֖יב וְ/יָכִֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/010.yaml
  text: 'And from the priests: Jedaiah, Jehoiarib, and Jakin.'
translation:
  language: ml
  text: പുരോഹിതന്മാരിൽ യെദായാവ്, യെഹോയാരീബ്, യാഖീൻ എന്നിവരും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: എന്നിവരും ഉണ്ടായിരുന്നു
  rationale: വാവ് സംയോജകത്തിന്റെ പട്ടികയോടുള്ള ബന്ധവും מִן സൂചിപ്പിക്കുന്ന ‘കൂട്ടത്തിൽനിന്ന്/കൂട്ടത്തിൽ’ എന്ന അർഥവും സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാരിൽ
  rationale: നിശ്ചയാർഥകമായ ബഹുവചന നാമത്തോടൊപ്പം വരുന്ന מִן-ന്റെ കൂട്ടത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് എന്ന ആശയം മലയാളത്തിലെ ‘-യിൽ’ വിഭക്തിയിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְדַעְיָה
  choice: യെദായാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ബൈബിൾ നാമരീതിയിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וִיהוֹיָרִיב
  choice: യെഹോയാരീബ്
  rationale: സംയോജക വാവ് മലയാള പട്ടികയുടെ അവസാനഘടനയിൽ ഉൾക്കൊള്ളിച്ച്, വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וְיָכִין
  choice: യാഖീൻ
  rationale: അവസാന പട്ടികാംഗമായ വ്യക്തിനാമം എബ്രായ ശബ്ദരൂപത്തോട് അടുത്തായി ലിപ്യന്തരം ചെയ്യുന്നു; ‘എന്നിവരും’ സംയോജകബന്ധം വഹിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിൽ ക്രിയയില്ലാത്ത പട്ടികാശീർഷക സ്വഭാവം മലയാളത്തിൽ അപൂർണ്ണമായി തോന്നാതിരിക്കാൻ ‘ഉണ്ടായിരുന്നു’ ചേർത്തിരിക്കുന്നു; പേരുകളുടെ ക്രമം അതേപടി നിലനിർത്തി.
