translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. മലയാളത്തിൽ വായന സുഗമമാക്കാൻ എബ്രായത്തിലെ പേരുകളുടെ മുന്നോട്ടുള്ള നിര പിന്നോട്ടുള്ള ബന്ധക്രമത്തിൽ അവതരിപ്പിച്ചെങ്കിലും എല്ലാ ബന്ധങ്ങളും സംരക്ഷിച്ചു. പാഠഭേദസൂചകം അതുമായി നേരിട്ട് ബന്ധപ്പെട്ട ‘ബാനി’ എന്ന പേരിനോടു ചേർത്തു.
