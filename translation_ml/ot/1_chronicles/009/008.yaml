  text: and Ibneiah son of Jeroham[a], and Elah son of Uzzi, son of Michri, and Meshullam son of Shephatiah, son of Reuel, son of Ibnijah.
translation:
  language: ml
  text: യെരോഹാമിന്റെ മകനായ യിബ്നെയായും[a], മിഖ്രിയുടെ മകനായ ഉസ്സിയുടെ മകനായ ഏലായും, യിബ്നിയായുടെ മകനായ രെയൂവേലിന്റെ മകനായ ശെഫത്യാവിന്റെ മകനായ മെശുല്ലാമും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു വ്യക്തിനാമങ്ങൾ അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരം ചെയ്തിരിക്കുന്നു; ചില പേരുകൾക്ക് മറ്റു ലിപ്യന്തരരൂപങ്ങളും കാണാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: -വും / കൂടാതെ എന്ന ബന്ധാർഥം
  rationale: പേരുകളുടെ പട്ടികയെ മുൻവാക്യത്തോടും ഓരോ പേരിനെയും തമ്മിലും ബന്ധിപ്പിക്കുന്ന ഹീബ്രു സംയോജകമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാശൈലിക്കായി പേരുകളോടു ചേർന്ന ‘-വും’ ഉപയോഗിച്ചു.
- source_word: יִבְנְיָה
  choice: യിബ്നെയാ
  rationale: വ്യക്തിനാമം അർഥവിവർത്തനം ചെയ്യാതെ മസോററ്റിക് ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: בֶּן
  choice: മകൻ / കൊച്ചുമകൻ / മുമ്മകൻ
  rationale: ഓരോ בֶּן-ഉം വംശബന്ധം സൂചിപ്പിക്കുന്നു. ആവർത്തിച്ച ഹീബ്രു ഘടനയുടെ തലമുറക്രമം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കാൻ ആദ്യബന്ധത്തിന് ‘മകൻ’, തുടർന്നുള്ള ബന്ധങ്ങൾക്ക് ‘കൊച്ചുമകൻ’, ‘മുമ്മകൻ’ എന്നു നൽകി.
- source_word: יְרֹחָם
  choice: യെരോഹാം
  rationale: വ്യക്തിനാമം ഹീബ്രുവിൽനിന്ന് ലിപ്യന്തരിച്ചു.
- source_word: אֵלָה
  choice: ഏലാ
  rationale: വ്യക്തിനാമം ഹീബ്രുവിൽനിന്ന് ലിപ്യന്തരിച്ചു.
- source_word: עֻזִּי
  choice: ഉസ്സി
  rationale: ദ്വിത്വവ്യഞ്ജനം നിലനിർത്തി വ്യക്തിനാമം ഹീബ്രുവിൽനിന്ന് ലിപ്യന്തരിച്ചു.
- source_word: מִכְרִי
  choice: മിഖ്രി
  rationale: כ എന്ന വ്യഞ്ജനത്തെ ‘ഖ’ ഉപയോഗിച്ച് പ്രതിനിധീകരിച്ച് പേര് ലിപ്യന്തരിച്ചു.
- source_word: מְשֻׁלָּם
  choice: മെശുല്ലാം
  rationale: വ്യക്തിനാമം ഹീബ്രു രൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: שְׁפַטְיָה
  choice: ശെഫത്യാ
  rationale: വ്യക്തിനാമം അർഥവിവർത്തനം ചെയ്യാതെ ഹീബ്രുവിൽനിന്ന് ലിപ്യന്തരിച്ചു.
- source_word: רְעוּאֵל
  choice: രെയൂവേൽ
  rationale: മസോററ്റിക് ഹീബ്രു രൂപം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: יִבְנִיָּה
  choice: യിബ്നിയാ
  rationale: יִבְנְיָה എന്ന ആദ്യനാമത്തിൽനിന്നുള്ള സ്വരവ്യത്യാസം നിലനിർത്തി ഹീബ്രു രൂപം ലിപ്യന്തരിച്ചു.
