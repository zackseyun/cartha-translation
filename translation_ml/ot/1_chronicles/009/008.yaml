  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ആവർത്തിച്ച ‘മകൻ’ ഘടന മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഉണ്ടാക്കാതിരിക്കാൻ തലമുറബന്ധങ്ങൾ ‘മകൻ, കൊച്ചുമകൻ, മുമ്മകൻ’ എന്നിങ്ങനെ വ്യക്തമാക്കി; പേരുകളുടെ ക്രമവും വംശരേഖയും മാറ്റിയിട്ടില്ല.
