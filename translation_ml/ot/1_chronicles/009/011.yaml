source:
  edition: WLC
  text: וַ/עֲזַרְיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖יד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
translation:
  language: ml
  text: ഹിൽക്കീയാവിന്റെ മകനായ അസര്യാവും—ഹിൽക്കീയാവ് മെശുല്ലാമിന്റെ മകൻ, മെശുല്ലാം സാദോക്കിന്റെ മകൻ, സാദോക്ക് മെരായോത്തിന്റെ മകൻ, മെരായോത്ത് അഹീതൂബിന്റെ മകൻ—ദൈവത്തിന്റെ ആലയത്തിലെ മുഖ്യാധികാരി[a] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നേതാവ്,’ ‘മുഖ്യൻ,’ അല്ലെങ്കിൽ ‘ഭരണാധികാരി.’
    reason: נְגִיד എന്ന പദത്തിന് സന്ദർഭത്തിൽ സാധ്യമായ മറ്റു അർഥങ്ങൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: അസര്യാവും
  rationale: വംശാവലിപ്പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന וַ־യെ ‘-ഉം’കൊണ്ട് പ്രകടമാക്കി; പേര് മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: בֶן
  choice: മകൻ
  rationale: ആവർത്തിക്കുന്ന വംശാവലിപദം അടിസ്ഥാന അർഥത്തിൽ സ്ഥിരമായി വിവർത്തനം ചെയ്തു; വംശാവലികളിൽ തലമുറകൾ ഒഴിവാകാനുള്ള സാധ്യത വിവർത്തനം കൊണ്ട് അനാവശ്യമായി തീർപ്പാക്കിയില്ല.
- source_word: חִלְקִיָּה / מְשֻׁלָּם / צָדוֹק / מְרָיוֹת / אֲחִיטוּב
  choice: ഹിൽക്കീയാവ് / മെശുല്ലാം / സാദോക്ക് / മെരായോത്ത് / അഹീതൂബ്
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായി ഉച്ചരിക്കാവുന്ന, മൂലരൂപത്തോട് അടുത്ത ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: נְגִיד
  choice: മുഖ്യചുമതലക്കാരൻ
  rationale: നിയോഗിക്കപ്പെട്ട നേതാവിനെയോ മേൽനോട്ടാധികാരിയെയോ സൂചിപ്പിക്കുന്ന പദം ആലയഭരണസന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ നൽകി.
- source_word: בֵּית הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ആലയം
  rationale: ‘ദൈവത്തിന്റെ ഭവനം’ എന്ന അക്ഷരാർഥത്തെ നിലനിർത്തിക്കൊണ്ട്, ഈ ആരാധനാസ്ഥലസന്ദർഭത്തിൽ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘ആലയം’ തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ആലയനാമത്തിലെ אֱלֹהִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: ഇസ്രായേലിന്റെ വിശുദ്ധാലയത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ഈ പദം ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ഏകവചനമാണ് അർഥപരമായി ശരി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നീണ്ട പിതൃപരമ്പര തെറ്റായി ബന്ധിപ്പിക്കപ്പെടാതിരിക്കാൻ ഓരോ ബന്ധവും വ്യക്തമായി ആവർത്തിച്ചു; മൂലത്തിലെ പട്ടികത്തുടർച്ച ‘-ഉം’കൊണ്ട് നിലനിർത്തി.
