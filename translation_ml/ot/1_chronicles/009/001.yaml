id: 1CH.9.1
reference: 1 Chronicles 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֙ הִתְיַחְשׂ֔וּ וְ/הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֖פֶר מַלְכֵ֣י יִשְׂרָאֵ֑ל וִ/יהוּדָ֛ה הָגְל֥וּ לְ/בָבֶ֖ל בְּ/מַעֲלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
translation:
  language: ml
  text: ഇസ്രായേൽ മുഴുവനും വംശാവലി അനുസരിച്ച് രജിസ്റ്റർ ചെയ്യപ്പെട്ടു[a]; ഇതാ, അവർ ഇസ്രായേൽ രാജാക്കന്മാരുടെ പുസ്തകത്തിൽ രേഖപ്പെടുത്തിയിരിക്കുന്നു. യെഹൂദാ അവരുടെ അവിശ്വസ്തത[b] നിമിത്തം ബാബേലിലേക്കു പ്രവാസത്തിലാക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വംശാവലികളിൽ കണക്കാക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘വംശാവലി പ്രകാരം രേഖപ്പെടുത്തപ്പെട്ടു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതിക്രമം’ അല്ലെങ്കിൽ ‘വിശ്വാസവഞ്ചന.’ എബ്രായപദം വിശ്വാസലംഘനത്തിന്റെയോ ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയുടെയോ അർഥം വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  choice: വംശാവലിപ്രകാരം രേഖപ്പെടുത്തപ്പെട്ടു
  rationale: യַחַשׂ എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം ആളുകളെ വെറുതെ എണ്ണുന്നതല്ല, വംശപരമ്പര സ്ഥാപിച്ച് വംശാവലിരേഖയിൽ ചേർക്കുന്നതാണ് സൂചിപ്പിക്കുന്നത്. ഈ പ്രയോഗം ആ വംശാവലി-ഭരണപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהִנָּם
  choice: ഇതാ, അവർ
  rationale: הִנֵּה എന്ന അവതരണാത്മക ശ്രദ്ധാകർഷകത്തിന്റെ ഊന്നൽ ഒഴിവാക്കാതെ, ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ ‘ഇതാ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כְּתוּבִים
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ നിലാവസ്ഥാസൂചകമായ ‘എഴുതപ്പെട്ടിരിക്കുന്നു’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: ‘ഇസ്രായേൽരാജാക്കന്മാരുടെ പുസ്തകത്തിൽ’
  rationale: രേഖാസന്ദർഭത്തിൽ עַל മലയാളത്തിൽ സ്വാഭാവികമായി ‘പുസ്തകത്തിൽ’ ആകുന്നു. ഇത് തിരിച്ചറിയാവുന്ന ഒരു രാജകീയ രേഖയുടെ ശീർഷകമായി അവതരിപ്പിച്ചിരിക്കുന്നു.
- source_word: הָגְלוּ
  choice: പ്രവാസത്തിലാക്കപ്പെട്ടു
  rationale: ഹോഫാൽ രൂപം യെഹൂദാ സ്വമേധയാ പോയതല്ല, പ്രവാസത്തിലേക്കു കൊണ്ടുപോകപ്പെട്ടതാണെന്ന നിഷ്ക്രിയ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בְּמַעֲלָם
  choice: തങ്ങളുടെ അവിശ്വസ്തത നിമിത്തം
  rationale: מַעַל സാധാരണ തെറ്റിനേക്കാൾ വിശ്വാസലംഘനമോ വിശ്വാസവഞ്ചനയോ സൂചിപ്പിക്കുന്നു; കാരണാർഥവും ബന്ധപരമായ ഗൗരവവും ഈ പരിഭാഷയിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: בְּמַעֲלָם സൂചിപ്പിക്കുന്ന യെഹൂദായുടെ കുറ്റത്തിന്റെ സ്വഭാവം
  choice: അവിശ്വസ്തത
  alternative: അതിക്രമം; വിശ്വാസവഞ്ചന
  rationale: മൂലപദത്തിൽ ദൈവത്തോടുള്ള ബന്ധത്തിലെ വിശ്വാസലംഘനത്തിന്റെ ഭാവമുണ്ട്. ‘അവിശ്വസ്തത’ അതിനെ അനാവശ്യമായി വ്യാഖ്യാനിച്ചുവികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: הָגְלוּ എന്ന ക്രിയയുടെ വാച്യം
  choice: പ്രവാസത്തിലാക്കപ്പെട്ടു
  alternative: പ്രവാസത്തിലേക്കു പോയി
  rationale: ഹോഫാൽ രൂപം നിഷ്ക്രിയമാണ്; ന്യായവിധിയുടെ പശ്ചാത്തലം മയപ്പെടുത്താതെ യെഹൂദാ നാടുകടത്തലിന് വിധേയമായെന്നത് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്നത് മൂലഭാഷയിലെ ശ്രദ്ധാകർഷക ഊന്നൽ നിലനിർത്തുന്നു. ‘യെഹൂദാ’ ഒരു ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സമാഹാരനാമമായതിനാൽ ‘തങ്ങളുടെ’ എന്ന ബഹുവചനസൂചന ഉപയോഗിച്ചു.
