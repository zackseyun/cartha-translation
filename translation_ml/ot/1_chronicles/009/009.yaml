source:
  edition: WLC
  text: וַ/אֲחֵי/הֶם֙ לְ/תֹ֣לְדוֹתָ֔/ם תְּשַׁ֥ע מֵא֖וֹת וַ/חֲמִשִּׁ֣ים וְ/שִׁשָּׁ֑ה כָּל אֵ֣לֶּה אֲנָשִׁ֔ים רָאשֵׁ֥י אָב֖וֹת לְ/בֵ֥ית אֲבֹתֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
translation:
  language: ml
  text: അവരുടെ സഹോദരന്മാർ, അവരുടെ വംശാവലികൾ അനുസരിച്ച്, തൊള്ളായിരത്തി അമ്പത്താറുപേർ ആയിരുന്നു. ഇവരെല്ലാവരും തങ്ങളുടെ പിതൃകുടുംബങ്ങളിലെ കുടുംബത്തലവന്മാരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പിതൃകുടുംബം” എന്നത് പിതൃവംശത്തെ അടിസ്ഥാനമാക്കിയുള്ള വിശാല കുടുംബത്തെയോ കുലവിഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന വംശാവലിസംബന്ധിയായ പദമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: അവരുടെ സഹോദരന്മാർ
  rationale: אָח എന്ന പദത്തിന്റെ പ്രാഥമികമായ ‘സഹോദരൻ’ എന്ന അർഥം നിലനിർത്തുന്നു; ഇവിടെ വിശാലമായി ഒരേ കുലത്തിലെ പുരുഷബന്ധുക്കളെയും സൂചിപ്പിക്കാം.
- source_word: לְתֹלְדוֹתָם
  choice: അവരുടെ വംശാവലികൾപ്രകാരം
  rationale: ദിനവൃത്താന്തപുസ്തകത്തിലെ വംശാവലിസന്ദർഭത്തിൽ תּוֹלְדוֹת വംശപരമ്പരയെയോ അതിന്റെ രേഖകളെയോ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിൽ ഈ സാങ്കേതിക ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: תְּשַׁע מֵאוֹת וַחֲמִשִּׁים וְשִׁשָּׁה
  choice: തൊള്ളായിരത്തി അമ്പത്താറുപേർ
  rationale: സംഖ്യയെ മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരൂപത്തിൽ നൽകുകയും ആളുകളുടെ എണ്ണമാണെന്ന് ‘പേർ’കൊണ്ട് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל אֵלֶּה אֲנָשִׁים
  choice: ഇവരെല്ലാവരും
  rationale: മുൻപുള്ള ‘സഹോദരന്മാർ’ എന്ന പുരുഷസൂചനയിലൂടെ ലിംഗവും വ്യക്തിസൂചനയും വ്യക്തമായതിനാൽ ആവർത്തനമില്ലാത്ത സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: רָאשֵׁי אָבוֹת
  choice: കുടുംബത്തലവന്മാർ
  rationale: ഇത് പിതൃവംശാധിഷ്ഠിത കുടുംബവിഭാഗങ്ങളുടെ തലവന്മാരെ സൂചിപ്പിക്കുന്ന സാമൂഹിക-വംശാവലി പ്രയോഗമാണ്; അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: തങ്ങളുടെ പിതൃഭവനങ്ങളിലെ
  rationale: בֵּית אָבוֹת എന്നത് ഒരു കെട്ടിടമല്ല, പിതൃവംശാധിഷ്ഠിത കുടുംബമോ കുലഘടകമോ ആണ്; ‘പിതൃഭവനം’ അതിന്റെ സാങ്കേതിക ഘടന ഒരു പരിധിവരെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ വംശാവലിസാങ്കേതികത ‘വംശാവലികൾ’, ‘പിതൃഭവനങ്ങൾ’ എന്നീ പദങ്ങളിലൂടെ നിലനിർത്തിക്കൊണ്ട്, ആവർത്തനഭാരം കുറയ്ക്കാൻ רָאשֵׁי אָבוֹת എന്നത് ‘കുടുംബത്തലവന്മാർ’ എന്നു സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
