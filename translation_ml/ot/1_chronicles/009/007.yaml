id: 1CH.9.7
reference: 1 Chronicles 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִן בְּנֵ֖י בִּנְיָמִ֑ן סַלּוּא֙ בֶּן מְשֻׁלָּ֔ם בֶּן הוֹדַוְיָ֖ה בֶּן הַ/סְּנֻאָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/007.yaml
  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
translation:
  language: ml
  text: 'ബെന്യാമീന്റെ പുത്രന്മാരിൽനിന്ന്: ഹസ്സെനൂവയുടെ മകനായ ഹോദവ്യാവിന്റെ മകനായ മെശുല്ലാമിന്റെ മകനായ സല്ലൂ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִן בְּנֵי בִּנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാരിൽനിന്ന്
  rationale: וּ എന്ന ബന്ധകത്തിന്റെ പ്രവാഹം പട്ടികയുടെ ഘടനയിലൂടെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു; ‘പുത്രന്മാർ’ എന്ന രൂപം ഗോത്രാംഗങ്ങളെയോ വംശജരെയോ സൂചിപ്പിക്കുന്ന എബ്രായ വംശാവലി പ്രയോഗത്തിന്റെ ഔപചാരിക ഭാവം കാക്കുന്നു.
- source_word: סַלּוּא
  choice: സല്ലൂ
  rationale: മസോററ്റിക് പാഠത്തിലെ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിയിൽ ആവർത്തിക്കുന്ന בֶּן എന്ന പദം ഔപചാരികമായി ‘മകൻ’ എന്നു വിവർത്തനം ചെയ്തു; ഇത് നേരിട്ടുള്ള പുത്രബന്ധമോ വിശാലമായ വംശബന്ധമോ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מְשֻׁלָּם
  choice: മെശുല്ലാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തിന് അനുസരിച്ചുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: הוֹדַוְיָה
  choice: ഹോദവ്യാവ്
  rationale: WLCയിലെ മസോററ്റിക് സ്വരീകരണത്തെ പിന്തുടരുന്ന മലയാള ലിപ്യന്തരണം; ബന്ധപ്പെട്ട വംശാവലി പാരമ്പര്യങ്ങളിലെ വ്യത്യസ്ത നാമരൂപം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: הַ/סְּנֻאָה
  choice: ഹസ്സെനൂവ
  rationale: വംശാവലി സന്ദർഭത്തിൽ ഇത് വ്യക്തിനാമമായി സ്വീകരിച്ചു; നിർദ്ദിഷ്ടതാസൂചകത്തിന്റെ ചേർന്ന ഉച്ചാരണം ഇരട്ട ‘സ്സ’ ഉപയോഗിച്ച് പ്രതിഫലിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. മൂലത്തിലെ ചുരുക്കപ്പെട്ട വംശാവലി ശൃംഖല മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ഓരോ ബന്ധവും ആവർത്തിച്ച് അവതരിപ്പിച്ചു; അർത്ഥത്തിൽ പുതിയത് ചേർത്തിട്ടില്ല.
