language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַֽעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה מִן בְּנֵ֥י מְרָרִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
translation:
  language: ml
  text: 'ലേവ്യരിൽനിന്ന്: മെരാരിയുടെ പുത്രന്മാരിൽപ്പെട്ട, ഹശബ്യാവിന്റെ മകനായ അസ്രിക്കാമിന്റെ മകൻ ഹശ്ശൂബിന്റെ മകൻ ശെമയ്യാവ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മെരാരിയുടെ സന്തതികളിൽപ്പെട്ടവൻ.” എബ്രായത്തിലെ “പുത്രന്മാർ” എന്ന പ്രയോഗം വിശാലമായ വംശപരമ്പരയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: ലേവ്യരിൽനിന്ന്
  rationale: മുൻപത്തെ പട്ടികയോട് ഈ കുറിപ്പിനെ ബന്ധിപ്പിക്കുന്ന וּ എന്ന സംയോജകത്തിന്റെ തുടർച്ച പട്ടികയുടെ പ്രവാഹത്തിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു; מִן എന്നതിന്റെ വിഭാഗസൂചകമായ അർഥം ‘-ൽനിന്ന്’ എന്നു നിലനിർത്തുന്നു.
- source_word: שְׁמַעְיָה
  choice: ശെമയ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ആധുനിക മലയാള ബൈബിൾശൈലിയോട് യോജിക്കാൻ പുരുഷനാമാന്ത്യമായ ‘-വ്’ ചേർത്തിരിക്കുന്നു.
- source_word: בֶן
  choice: മകൻ
  rationale: ഈ വംശാവലിശൃംഖലയിൽ בֶן നേരിട്ടുള്ള പുത്രബന്ധത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിൽ വ്യക്തമായ ബന്ധശൃംഖലയായി നിലനിർത്തുന്നു.
- source_word: חַשּׁוּב
  choice: ഹശ്ശൂബ്
  rationale: മൂലപാഠത്തിലെ ദ്വിത്വവ്യഞ്ജനത്തെ ‘ശ്ശ’ കൊണ്ട് പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: עַזְרִיקָם
  choice: അസ്രീക്കാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ഉച്ചാരണസൗകര്യമുള്ള ലിപ്യന്തരണം.
- source_word: חֲשַׁבְיָה
  choice: ഹശബ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מִן בְּנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാരിൽപ്പെട്ട
  rationale: മെരാരി വംശത്തിനുള്ളിലെ കുലബന്ധം വ്യക്തമാക്കുന്നു; ‘പുത്രന്മാർ’ എന്ന ഔപചാരിക രൂപം നിലനിർത്തിക്കൊണ്ട് മִן എന്ന വിഭാഗബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ പട്ടിക/വംശാവലി ശൈലി. മലയാളത്തിലെ സ്വാഭാവിക ബന്ധക്രമത്തിനായി വംശശൃംഖല പൂർവികനിൽനിന്ന് ശെമയ്യാവിലേക്കായി ക്രമപ്പെടുത്തിയെങ്കിലും എല്ലാ ബന്ധങ്ങളും മൂലപാഠപ്രകാരം സംരക്ഷിച്ചിട്ടുണ്ട്; അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
