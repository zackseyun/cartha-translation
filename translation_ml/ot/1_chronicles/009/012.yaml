translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം. മൂലത്തിലെ വംശാവലിശൃംഖലയും രണ്ടു വ്യക്തികളെ ബന്ധിപ്പിക്കുന്ന ‘വ’-ബന്ധകങ്ങളും നിലനിർത്തി. ദീർഘമായ ശൃംഖല സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ മലയാളത്തിലെ ‘-ന്റെ മകനും … മകനുമായ’ ഘടനയിൽ ക്രമപ്പെടുത്തി.
