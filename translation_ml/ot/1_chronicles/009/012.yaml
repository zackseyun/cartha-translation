source:
  edition: WLC
  text: וַ/עֲדָיָה֙ בֶּן יְרֹחָ֔ם בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה וּ/מַעְשַׂ֨י בֶּן עֲדִיאֵ֧ל בֶּן יַחְזֵ֛רָה בֶּן מְשֻׁלָּ֥ם בֶּן מְשִׁלֵּמִ֖ית בֶּן אִמֵּֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/012.yaml
  text: and Adaiah son of Jeroham[a], son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.
translation:
  language: ml
  text: യെരോഹാമിന്റെ മകനും, പശ്ഹൂരിന്റെ മകനും, മൽക്കീയാവിന്റെ മകനുമായ അദായാവും, അദീയേലിന്റെ മകനും, യഹ്സേരായുടെ മകനും, മെശുല്ലാമിന്റെ മകനും, മെശില്ലേമീത്തിന്റെ[a] മകനും, ഇമ്മേരിന്റെ മകനുമായ മഅസായിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ എബ്രായപാഠം מְשִׁלֵּמִית (മെശില്ലേമീത്ത്) എന്നാണ്; ഇതുമായി ബന്ധമുള്ള പേരിന്റെ മറ്റൊരു രൂപം മറ്റിടങ്ങളിൽ ‘മെശില്ലേമോത്ത്’ എന്നു കാണപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲדָיָה
  choice: അദായാവും
  rationale: വാക്യത്തിന്റെ പട്ടികാസ്വഭാവം നിലനിർത്താൻ ו എന്ന ബന്ധകത്തെ പേരിനോടുചേർന്ന ‘-വും’ ആയി നൽകി; വ്യക്തിനാമം ഹീബ്രൂ ഉച്ചാരണത്തോട് അടുത്ത് ലിപ്യന്തരിച്ചു.
- source_word: בֶּן
  choice: മകൻ / മകനുമായ
  rationale: വംശാവലിശൃംഖലയിൽ בֶּן എന്നതിന് സ്വാഭാവികമായ അർഥം ‘മകൻ’ ആണ്. മലയാളത്തിൽ ബന്ധങ്ങൾ വ്യക്തമായി വായിക്കാനായി ‘-ന്റെ മകൻ’ എന്ന ഘടന ഉപയോഗിച്ചു.
- source_word: יְרֹחָם
  choice: യെരോഹാം
  rationale: ഹീബ്രൂ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: פַּשְׁחוּר
  choice: പശ്ഹൂർ
  rationale: ഹീബ്രൂ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജനഘടന കഴിയുന്നത്ര നിലനിർത്തിയ മലയാള ലിപ്യന്തരണം.
- source_word: מַלְכִּיָּה
  choice: മൽക്കീയാവ്
  rationale: അവസാന ഘടകമായ -יָה പ്രതിഫലിപ്പിക്കുന്ന പരിചിതമായ മലയാള ബൈബിൾ നാമരൂപം സ്വീകരിച്ചു.
- source_word: וּ/מַעְשַׂי
  choice: മയസായിയും
  rationale: ו എന്ന ബന്ധകം ‘-യും’ ആയി നൽകി; മַעְשַׂי എന്ന പാഠരൂപത്തെ ദീർഘമായ ‘മയസേയാവ്’ എന്ന വേറൊരു പേരുമായി കലരാതിരിക്കാൻ ‘മയസായി’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: עֲדִיאֵל
  choice: അദീയേൽ
  rationale: ഹീബ്രൂ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יַחְזֵרָה
  choice: യഹ്സേര
  rationale: ആദ്യ യോദിനെ ‘യ’ ആയും חְז കൂട്ടത്തെ വായനാസൗകര്യത്തോടെ ‘ഹ്സ’ ആയും പ്രതിനിധീകരിച്ചു.
- source_word: מְשֻׁלָּם
  choice: മെശുല്ലാം
  rationale: ഹീബ്രൂ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ഇരട്ട ലാമെദ് സൂചിപ്പിക്കാൻ ‘ല്ല’ ഉപയോഗിച്ചു.
- source_word: מְשִׁלֵּמִית
  choice: മെശില്ലേമീത്ത്
  rationale: ഇപ്പോഴത്തെ മസോരറ്റിക് പാഠത്തിലെ מְשִׁלֵּמִית രൂപം നേരിട്ട് പ്രതിഫലിപ്പിച്ചു; മറ്റിടങ്ങളിലെ ബന്ധമുള്ള മെശില്ലേമോത്ത് രൂപത്തിലേക്ക് ഏകീകരിച്ചില്ല.
- source_word: אִמֵּר
  choice: ഇമ്മേർ
  rationale: ഹീബ്രൂ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ദ്വിത്വ മեմ് ‘മ്മ’ ആയി നൽകി.
