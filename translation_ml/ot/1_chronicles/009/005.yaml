  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ വംശാവലി-പട്ടികാശൈലി. പേരുകളും വംശനാമവും മലയാള വായനക്കാർക്ക് ഉച്ചരിക്കാവുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു; ഉറവിടത്തിലെ കൂട്ടഘടനയും ആദ്യജാതൻ/പുത്രന്മാർ എന്ന ബന്ധപദങ്ങളും കൃത്യമായി സംരക്ഷിച്ചു.
