id: 1CH.9.15
reference: 1 Chronicles 9:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַקְבַּקַּ֥ר חֶ֖רֶשׁ וְ/גָלָ֑ל וּ/מַתַּנְיָה֙ בֶּן מִיכָ֔א בֶּן זִכְרִ֖י בֶּן אָסָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/015.yaml
  text: and Bakbakkar[a], Heresh, and Galal, and Mattaniah son of Mica, son of Zichri[b], son of Asaph.
translation:
  language: ml
  text: ബക്ക്ബക്കറും ഹേരെശും ഗാലാലും ആസാഫിന്റെ മകനായ സിഖ്രിയുടെ മകനായ മീഖായുടെ[b] മകൻ[a] മത്തന്യാവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ “മകൻ” എന്ന പദം ചിലപ്പോൾ കൂടുതൽ അകലെയുള്ള വംശജനെയും സൂചിപ്പിക്കാം; ഇവിടെ വംശാവലിശൃംഖലയിൽ അത് അക്ഷരാർഥത്തിൽ പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ പേര് എബ്രായത്തിൽ മִיכָא (മീഖാ) എന്ന രൂപത്തിലാണ്; സമാനമായ മറ്റൊരു എബ്രായ നാമരൂപവുമായി ഇതിനെ കലർത്തരുത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַקְבַּקַּר
  choice: ബക്ക്ബക്കറും
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; പട്ടിക തുടരുന്ന וּ എന്ന സംയോജകം മലയാളത്തിലെ ‘-ഉം’കൊണ്ട് നിലനിർത്തി.
- source_word: חֶרֶשׁ
  choice: ഹേരെശ്
  rationale: חֶרֶשׁ എന്ന വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജനരൂപവും അവസാനത്തെ שׁ ശബ്ദവും വ്യക്തമാകുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ/גָלָל
  choice: ഗാലാലും
  rationale: പേര് ലിപ്യന്തരണം ചെയ്യുകയും പട്ടികയിലെ സംയോജകം ‘-ഉം’കൊണ്ട് നിലനിർത്തുകയും ചെയ്തു.
- source_word: וּ/מַתַּנְיָה
  choice: മത്തന്യാവും
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി വിഭക്തി ചേർക്കാൻ കഴിയുന്ന ‘മത്തന്യാവ്’ എന്ന രൂപം സ്വീകരിച്ചു; മുൻപ്രത്യയമായ സംയോജകം ‘-ഉം’ ആയി നൽകി.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിയിൽ בֶּן സാധാരണയായി ‘മകൻ’ എന്നാണ്; കൂടുതൽ അകലെയുള്ള വംശജനെയും ഇത് സൂചിപ്പിക്കാമെന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מִיכָא
  choice: മീഖാ
  rationale: ഇവിടെയുള്ള പ്രത്യേക എബ്രായ നാമരൂപമായ מִיכָאയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: זִכְרִי
  choice: സിഖ്രി
  rationale: എബ്രായ זִכְרִי എന്ന വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אָסָף
  choice: ആസാഫ്
  rationale: എബ്രായ אָסָף എന്ന പേരിന്റെ പരിചിതവും ഉറവിടത്തോട് ചേർന്നതുമായ മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും ലളിതവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. മലയാളത്തിൽ ബന്ധശൃംഖല വ്യക്തമായി വായിക്കാനായി പിതൃപരമ്പര ആസാഫിൽനിന്ന് മത്തന്യാവിലേക്കുള്ള സ്വാഭാവിക ക്രമത്തിൽ അവതരിപ്പിച്ചെങ്കിലും എല്ലാ ബന്ധങ്ങളും ഉറവിടപാഠപ്രകാരം തന്നെയാണ്.
