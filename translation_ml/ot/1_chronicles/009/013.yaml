reference: 1 Chronicles 9:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֗ם רָאשִׁים֙ לְ/בֵ֣ית אֲבוֹתָ֔/ם אֶ֕לֶף וּ/שְׁבַ֥ע מֵא֖וֹת וְ/שִׁשִּׁ֑ים גִּבּ֣וֹרֵי חֵ֔יל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
translation:
  language: ml
  text: അവരുടെ സഹോദരന്മാർ[a]—അവരുടെ പിതൃകുടുംബങ്ങളുടെ തലവന്മാർ—ആയിരത്തി എഴുനൂറ്റി അറുപത് പേരായിരുന്നു; അവർ ദൈവത്തിന്റെ ഭവനത്തിലെ[c] ശുശ്രൂഷയുടെ വേല നിർവഹിക്കുന്നതിന് ശക്തരും പ്രാപ്തരുമായ പുരുഷന്മാരായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബന്ധുക്കൾ.’ എബ്രായത്തിലെ ‘സഹോദരന്മാർ’ എന്ന പദം സ്വന്തം സഹോദരന്മാരെ മാത്രമല്ല, വിശാലമായ കുലബന്ധത്തിലുള്ളവരെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വീരന്മാർ’ അല്ലെങ്കിൽ ‘കഴിവുറ്റ പുരുഷന്മാർ.’ ഈ പ്രയോഗം ശക്തിയെയോ തെളിയിക്കപ്പെട്ട പ്രാപ്തിയെയോ സൂചിപ്പിക്കുന്ന ബഹുമാനപദമാണ്; ഈ സന്ദർഭത്തിൽ അത് നിർബന്ധമായും യുദ്ധവീരതയെ സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘ദൈവത്തിന്റെ ഭവനം’; ഇവിടെ അത് ദൈവത്തിന്റെ ആലയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: അവരുടെ സഹോദരന്മാർ
  rationale: ‘സഹോദരന്മാർ’ എന്നത് എബ്രായത്തിലെ കുടുംബബന്ധസൂചകമായ പദപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ അത് അടുത്ത ബന്ധുക്കളെയോ ഒരേ കുലത്തിൽപ്പെട്ട പുരുഷന്മാരെയോ ഉൾക്കൊള്ളാം.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: അവരുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാർ
  rationale: വംശാവലി-ഭരണപരമായ എബ്രായ പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുമ്പോഴും ‘പിതൃഭവനം’ എന്ന കുടുംബഘടന നിലനിർത്തുന്നു.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 1,760 പേർ
  rationale: എബ്രായ സംഖ്യാക്രമത്തിന്റെ ആകെ തുക ആധുനിക അക്കരീതിയിൽ നൽകുന്നു.
- source_word: גִּבּוֹרֵי חֵיל
  choice: പ്രാപ്തരായ ശക്തന്മാർ
  rationale: ഈ ബഹുമാനസൂചക പ്രയോഗം ശക്തി, മികവ്, തെളിയിച്ച കഴിവ് എന്നിവ സൂചിപ്പിക്കാം. ദൈവഭവനത്തിലെ ശുശ്രൂഷയാണ് സന്ദർഭം എന്നതിനാൽ അതിനെ സൈനിക വീരന്മാർ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: ശുശ്രൂഷയുടെ വേല നിർവഹിക്കാൻ
  rationale: ‘വേല’യും ‘ശുശ്രൂഷ’യും എന്ന രണ്ടു ആശയങ്ങളും നിലനിർത്തി, മലയാളത്തിൽ സ്വാഭാവികമായ ലക്ഷ്യാർഥ ഘടന ഉപയോഗിക്കുന്നു.
- source_word: בֵּית הָאֱלֹהִים
  choice: ദൈവഭവനം
  rationale: ക്ഷേത്രത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ‘ദൈവത്തിന്റെ ഭവനം’ എന്ന മൂലഭാഷാ രൂപകവും ദൈവശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രതിനിധിക പുരുഷ ബഹുവചനത്തിലുള്ള ബന്ധുത്വപദം
  choice: സഹോദരന്മാർ
  alternative: ബന്ധുക്കൾ
  rationale: വംശാവലി-പുരോഹിത സന്ദർഭത്തിലെ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന്റെ ലിംഗവും കുടുംബപരമായ രൂപകവും നിലനിർത്തുന്നു; എന്നാൽ അതിന്റെ വിശാലമായ കുലബന്ധാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ആലയത്തെ സൂചിപ്പിക്കുന്ന പദപ്രയോഗം
  choice: ദൈവഭവനം
  alternative: ദൈവത്തിന്റെ ആലയം
  rationale: മൂലപാഠത്തിലെ ‘ദൈവത്തിന്റെ ഭവനം’ എന്ന പ്രയോഗം വ്യാഖ്യാനിച്ച് ‘ആലയം’ എന്നു മാത്രം മാറ്റാതെ സംരക്ഷിക്കുന്നു; സൂചിതാർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: גִּבּוֹרֵי חֵיל എന്ന ബഹുമാനസൂചക പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം
  choice: പ്രാപ്തരായ ശക്തന്മാർ
  alternative: വീരയോദ്ധാക്കൾ
  rationale: ശുശ്രൂഷാസന്ദർഭത്തിൽ കഴിവും ശക്തിയും തെളിയിച്ചവരെന്ന ആശയം മുൻനിർത്തുന്നു; യുദ്ധസംബന്ധമായ അർഥം അനാവശ്യമായി അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ ബന്ധുത്വഭാഷ, പിതൃഭവന ഘടന, ‘ദൈവഭവനം’ എന്ന രൂപകം എന്നിവ നിലനിർത്തി; കർത്തവ്യസന്ദർഭം വ്യക്തമാക്കാൻ വാക്യം രണ്ടായി ക്രമപ്പെടുത്തി.
