source:
  edition: WLC
  text: וְ/עֹבַדְיָה֙ בֶּֽן שְׁמַֽעְיָ֔ה בֶּן גָּלָ֖ל בֶּן יְדוּת֑וּן וּ/בֶרֶכְיָ֤ה בֶן אָסָא֙ בֶּן אֶלְקָנָ֔ה הַ/יּוֹשֵׁ֖ב בְּ/חַצְרֵ֥י נְטוֹפָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/016.yaml
  text: and Obadiah son of Shemaiah[a], son of Galal, son of Jeduthun, and Berechiah son of Asa, son of Elkanah, who lived in the villages of the Netophathites.
translation:
  language: ml
  text: ശെമയ്യാവിന്റെ മകനും ഗാലാലിന്റെ മകനും യെദൂഥൂന്റെ മകനുമായ ഓബദ്യാവും, നെതോഫാത്യരുടെ ഗ്രാമങ്ങളിൽ താമസിച്ചിരുന്ന എൽക്കാനയുടെ മകനായ ആസയുടെ മകൻ ബെരെഖ്യാവും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നെതോഫയിലെ കുടിയിരിപ്പുകളിൽ.” ഹീബ്രായത്തിലെ ജനവിഭാഗസൂചകപദം നെതോഫാത്യർ എന്ന ജനത്തെയോ നെതോഫ എന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹבַדְיָה
  choice: ഓബദ്യാവും
  rationale: മുൻപത്തെ പട്ടികയോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന വാവിനെ മലയാളത്തിലെ ‘-വും’കൊണ്ട് നിലനിർത്തി; പേര് ഹീബ്രായരൂപത്തെ ആധാരമാക്കി ലിപ്യന്തരിച്ചു.
- source_word: בֶּן
  choice: മകൻ / മകനായ
  rationale: വംശാവലിപ്പട്ടികയിലെ നേരിട്ടുള്ള ബന്ധസൂചകമായ ‘മകൻ’ എന്ന അർഥം നിലനിർത്തി; മലയാളവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി വിഭക്തിരൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: שְׁמַעְיָה
  choice: ശെമയ്യാവ്
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: גָּלָל
  choice: ഗാലാൽ
  rationale: വ്യക്തിനാമം ഹീബ്രായ ഉച്ചാരണത്തെ സമീപിക്കുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: יְדוּתוּן
  choice: യെദൂഥൂൻ
  rationale: വ്യക്തിനാമം ഹീബ്രായ ശബ്ദരൂപത്തെ ആധാരമാക്കി ലിപ്യന്തരിച്ചു.
- source_word: וּ/בֶרֶכְיָה
  choice: ബെരെഖ്യാവും
  rationale: രണ്ടാമത്തെ വ്യക്തിയെ പട്ടികയിൽ ചേർക്കുന്ന വാവിനെ ‘-വും’കൊണ്ട് പ്രകടിപ്പിച്ചു; പേര് ലിപ്യന്തരിച്ചു.
- source_word: אָסָא
  choice: ആസ
  rationale: വ്യക്തിനാമം ഹീബ്രായരൂപത്തിൽനിന്ന് ലിപ്യന്തരിച്ചു.
- source_word: אֶלְקָנָה
  choice: എൽക്കാന
  rationale: വ്യക്തിനാമം ഹീബ്രായരൂപത്തിൽനിന്ന് ലിപ്യന്തരിച്ചു.
- source_word: הַ/יּוֹשֵׁב
  choice: താമസിച്ചിരുന്ന
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകൃത്ത് ബെരെഖ്യാവിനെ വിശേഷിപ്പിക്കുന്നതിനാൽ, തുടർച്ചയായ വാസസ്ഥിതിയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിച്ചു.
- source_word: בְּ/חַצְרֵי
  choice: ഗ്രാമങ്ങളിൽ
  rationale: ഭൗമസന്ദർഭത്തിൽ חָצֵר മുറ്റങ്ങളെയല്ല, ചെറുഗ്രാമങ്ങളെയോ കുടിയിരിപ്പുകളെയോ സൂചിപ്പിക്കുന്നു; ബഹുവചന നിർമ്മിതി നിലനിർത്തി.
- source_word: נְטוֹפָתִי
  choice: നെതോഫാത്യരുടെ
  rationale: ജനവിഭാഗസൂചകമായ ഹീബ്രായ വിശേഷണം നെതോഫയുമായി ബന്ധപ്പെട്ട നിവാസികളെ സൂചിപ്പിക്കുന്ന രൂപത്തിൽ പരിഭാഷപ്പെടുത്തി.
