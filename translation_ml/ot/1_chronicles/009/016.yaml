  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിപ്പട്ടികയുടെ ഔപചാരികതയും വായനാസൗകര്യവും ഒരുമിച്ചു കാത്തു. ഹീബ്രായത്തിലെ ബന്ധകങ്ങൾ മലയാളത്തിലെ ‘-വും’കൊണ്ട് പ്രകടിപ്പിച്ചു. പ്രധാന പാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട ഭൗമ-ജനവിഭാഗ പദപ്രയോഗത്തിന് പിന്നാലെ ചേർത്തു.
