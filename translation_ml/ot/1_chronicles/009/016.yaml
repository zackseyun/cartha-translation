  source_fidelity: 'ഹീബ്രായ പാഠത്തിലെ രണ്ടു വംശാവലിത്തുടരുകളും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു: ഓബദ്യാവ് ശെമയ്യാവ്—ഗാലാൽ—യെദൂഥൂൻ പരമ്പരയിലും ബെരെഖ്യാവ് ആസാ—എൽക്കാനാ പരമ്പരയിലും ഉൾപ്പെടുന്നു. הַיּוֹשֵׁב എന്ന വിശേഷണം ബെരെഖ്യാവിനോടു ചേർത്ത്, നെതോഫാത്യരുടെ ഗ്രാമങ്ങളിലെ വാസത്തെ ശരിയായി വിവർത്തനം ചെയ്തിരിക്കുന്നു.'
