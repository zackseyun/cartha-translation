source:
  edition: WLC
  text: וְ/הַ/יּוֹשְׁבִים֙ הָ/רִ֣אשֹׁנִ֔ים אֲשֶׁ֥ר בַּ/אֲחֻזָּתָ֖/ם בְּ/עָרֵי/הֶ֑ם יִשְׂרָאֵל֙ הַ/כֹּ֣הֲנִ֔ים הַ/לְוִיִּ֖ם וְ/הַ/נְּתִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/002.yaml
  text: The first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
translation:
  language: ml
  text: തങ്ങളുടെ പട്ടണങ്ങളിലെ അവകാശഭൂമികളിൽ പാർത്ത ആദ്യനിവാസികൾ ഇസ്രായേല്യരും പുരോഹിതന്മാരും ലേവ്യരും ദൈവാലയശുശ്രൂഷകരും[a] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നെഥീന്യർ”; ദൈവാലയശുശ്രൂഷയ്ക്കായി നിയോഗിക്കപ്പെട്ട ഒരു വിഭാഗത്തിന്റെ പരമ്പരാഗത ലിപ്യന്തരണം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים הָרִאשֹׁנִים
  choice: ആദ്യനിവാസികൾ
  rationale: ישׁב എന്ന ധാതുവിന്റെ കർത്തൃവാചക രൂപം അവിടെ പാർക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; הָרִאשֹׁנִים എന്നത് ‘ആദ്യ’ എന്ന അർഥത്തിൽ ചേർത്ത് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളം നൽകി.
- source_word: אֲשֶׁר בַּאֲחֻזָּתָם בְּעָרֵיהֶם
  choice: തങ്ങളുടെ പട്ടണങ്ങളിലെ അവകാശഭൂമികളിൽ പാർത്ത
  rationale: אֲחֻזָּה പാരമ്പര്യമായി കൈവശമുള്ള ഭൂസ്വത്തിനെയോ അവകാശഭൂമിയെയോ സൂചിപ്പിക്കുന്നു. സ്ഥലബന്ധങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ട്, പട്ടണങ്ങളിലുള്ള അവരുടെ അവകാശഭൂമികൾ എന്ന ആശയം നിലനിർത്തി.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേല്യർ
  rationale: ഇവിടെ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പട്ടികയിലെ നാമമായതിനാൽ ‘ഇസ്രായേല്യർ’ എന്നത് സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്. തുടർന്ന് പുരോഹിതന്മാരും ലേവ്യരും പ്രത്യേകം പറയപ്പെടുന്ന എബ്രായ പട്ടികയുടെ ഘടന അതേപടി നിലനിർത്തി.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: כֹּהֲנִים എന്ന പദത്തിന്റെ സ്ഥിരവും സ്വാഭാവികവുമായ മലയാളപരിഭാഷ.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ലേവി ഗോത്രത്തെയും ശുശ്രൂഷാവിഭാഗത്തെയും സൂചിപ്പിക്കുന്ന പതിവ് മലയാളരൂപം.
- source_word: וְהַנְּתִינִים
  choice: ദൈവാലയശുശ്രൂഷകർ
  rationale: נְתִינִים ദൈവാലയസേവനത്തിന് നിയോഗിക്കപ്പെട്ട പ്രത്യേക വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക വായനക്കാർക്ക് അവരുടെ പ്രവർത്തനം വ്യക്തമാക്കുന്ന പരിഭാഷ സ്വീകരിച്ചു; പരമ്പരാഗത ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: ഇസ്രായേല്യർ, പുരോഹിതന്മാർ, ലേവ്യർ എന്നിവരുടെ പരസ്പരബന്ധം
  choice: എബ്രായത്തിലെ സമാന്തര പട്ടിക അതേപടി നിലനിർത്തി
  alternative: പുരോഹിതന്മാരെയും ലേവ്യരെയും ഇസ്രായേല്യരുടെ ഉപവിഭാഗങ്ങളായി വിശദീകരിച്ച് പുനഃക്രമീകരിക്കുക
  rationale: മൂലപാഠം ‘ഇസ്രായേൽ’ എന്ന വിശാലനാമത്തോടൊപ്പം പുരോഹിതന്മാരെയും ലേവ്യരെയും പ്രത്യേകം നിരത്തുന്നു. അതിലെ വർഗീകരണസമ്മർദം വ്യാഖ്യാനത്തിലൂടെ ഇല്ലാതാക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ചരിത്ര-വംശാവലി സന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായത്തിൽ വ്യക്തമായ കാലസൂചകമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത്തരം ഒരു പദം ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘ദൈവാലയശുശ്രൂഷകർ’ എന്ന പദത്തിനുശേഷം സ്ഥാപിച്ചു.
