source:
  edition: WLC
  text: וּ/בְנֵי֙ כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה עִ֥ירוּ אֵלָ֖ה וָ/נָ֑עַם וּ/בְנֵ֥י אֵלָ֖ה וּ/קְנַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/015.yaml
  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
translation:
  language: ml
  text: 'യെഫുന്നെയുടെ മകനായ കാലേബിന്റെ പുത്രന്മാർ: ഈരു[a], ഏലാ, നയാം; ഏലായുടെ പുത്രന്മാർ: കെനസ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, വിശാലമായ അർഥത്തിൽ, ‘യെഫുന്നെയുടെ മകനായ കാലേബിന്റെ സന്തതികൾ.’ വംശാവലികളിൽ ‘പുത്രന്മാർ’ എന്ന പദം ചിലപ്പോൾ പിന്നീടുള്ള സന്തതികളെയും സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ പേരുകൾ നേരിട്ട് പട്ടികപ്പെടുത്തുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്നതാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כָּלֵב
  choice: കാലേബിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിസന്ദർഭത്തിൽ בְּנֵי എന്നതിന് നേരിട്ടുള്ള അർഥം ‘പുത്രന്മാർ’ എന്നാണ്. വിശാലമായി ‘സന്തതികൾ’ എന്നും വരാമെങ്കിലും ഇവിടെ പിന്നാലെ വ്യക്തികളുടെ പേരുകൾ കൊടുക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ സ്വാഭാവികമാണ്.
- source_word: בֶּן יְפֻנֶּה
  choice: യെഫുന്നെയുടെ മകനായ
  rationale: ഏത് കാലേബാണെന്ന് വ്യക്തമാക്കുന്ന വംശപരമായ വിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃക്രമീകരിച്ചു.
- source_word: עִירוּ
  choice: ഈരു
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: אֵלָה
  choice: ഏലാ
  rationale: ഇവിടെ പദം സാധാരണനാമമല്ല, വ്യക്തിനാമമാണ്; ഹീബ്രായ ഉച്ചാരണത്തോട് അടുത്ത രൂപം സ്വീകരിച്ചു.
- source_word: וָנָעַם
  choice: നയാം
  rationale: മസൊററ്റിക് സ്വരചിഹ്നങ്ങൾ נָעַם എന്ന പുരുഷനാമത്തെ പിന്തുണയ്ക്കുന്നു; വ്യത്യസ്ത രൂപമായ ‘നയാമാ’ ഒഴിവാക്കി.
- source_word: וּבְנֵי אֵלָה וּקְנַז
  choice: 'ഏലായുടെ പുത്രൻ: കെനസ്'
  rationale: മൂലപാഠത്തിൽ ‘ഏലായുടെ പുത്രന്മാർ’ എന്ന ബഹുവചനം വന്നിട്ടും കെനസ് എന്ന ഒരേയൊരു പേര് മാത്രമാണ് പട്ടികപ്പെടുത്തിയിരിക്കുന്നത്. മലയാളത്തിൽ ഈ സംഖ്യാവൈരുധ്യം ശബ്ദമില്ലാതെ നിലനിർത്തുന്നതിനുപകരം പട്ടികയിലെ ഏക പേരിനനുസരിച്ച് ഏകവചനം നൽകി; ഇതുസംബന്ധിച്ച പാഠപരമായ പ്രത്യേകത തീരുമാനക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: וּבְנֵי אֵלָה എന്ന ബഹുവചനത്തിനു പിന്നാലെ കെനസ് എന്ന ഒരേയൊരു പേര് മാത്രം വരുന്നത്
  choice: '‘ഏലായുടെ പുത്രൻ: കെനസ്’ എന്ന ഏകവചനവിവർത്തനം'
  alternative: '‘ഏലായുടെ പുത്രന്മാർ: കെനസ്’ എന്ന രൂപപരമായി കൃത്യമായ വിവർത്തനം'
  rationale: വാക്യത്തിന്റെ ഉദ്ദേശിക്കുന്ന വംശാവലിവിവരം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ഏകവചനം തിരഞ്ഞെടുത്തു. ഇത് ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം അല്ല; ഹീബ്രായ വ്യാകരണവും പട്ടികയുടെ രൂപവും തമ്മിലുള്ള സംഘർഷത്തെ കൈകാര്യം ചെയ്യുന്ന ഭാഷാപരമായ തീരുമാനം മാത്രമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. വ്യക്തിനാമങ്ങൾ ഹീബ്രായ മസൊററ്റിക് രൂപങ്ങളെ അടിസ്ഥാനമാക്കി മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു. കോലനും അർധവിരാമവും പട്ടികയുടെ ഘടന വ്യക്തമാക്കുന്നു.
