  text: וּ/בְנֵי֙ אֵ֣שֶׁת הֽוֹדִיָּ֔ה אֲח֣וֹת נַ֔חַם אֲבִ֥י קְעִילָ֖ה הַ/גַּרְמִ֑י וְ/אֶשְׁתְּמֹ֖עַ הַ/מַּעֲכָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
translation:
  language: ml
  text: ഹോദിയായുടെ ഭാര്യയും ഗർമ്യനായ കെയീലായുടെ പിതാവായ നാഹാമിന്റെ സഹോദരിയുമായ സ്ത്രീയുടെ പുത്രന്മാർ[a] മയഖാത്യനായ എഷ്ടെമോവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘പുത്രന്മാർ’ എന്നത് നേരിട്ടുള്ള മക്കളെയോ വിശാലമായ അർഥത്തിൽ സന്തതികളെയോ സൂചിപ്പിക്കാം. വാക്യം ചുരുക്കത്തിലുള്ള വംശാവലിശൈലിയിലാണ്; ബഹുവചനമായ ‘പുത്രന്മാർ’ക്കുശേഷം എഷ്ടെമോവ എന്ന ഏകവചനനാമം വരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിസന്ദർഭത്തിൽ ഇത് നേരിട്ട് ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്താം; ‘സന്തതികൾ’ എന്ന വിശാല അർഥവും സാധ്യമാണെങ്കിലും മൂലപാഠത്തിന്റെ രൂപം നിലനിർത്തി.
- source_word: אֵשֶׁת הוֹדִיָּה
  choice: ഹോദിയാവിന്റെ ഭാര്യ
  rationale: സംബന്ധസൂചകമായ എബ്രായ സംയുക്തപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: אֲחוֹת נַחַם
  choice: നാഹാമിന്റെ സഹോദരി
  rationale: ഹോദിയാവിന്റെ ഭാര്യയെ കൂടുതൽ വ്യക്തമായി തിരിച്ചറിയിക്കുന്ന ബന്ധപ്രയോഗം.
- source_word: אֲבִי
  choice: പിതാവായിരുന്നു
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘പിതാവ്’ എന്ന രൂപം സംരക്ഷിച്ചു; വംശാവലികളിൽ ഇത് ജനകൻ മാത്രമല്ല, പൂർവികൻ, സ്ഥാപകൻ, കുലത്തലവൻ എന്നീ അർഥങ്ങളും വഹിക്കാം.
- source_word: קְעִילָה הַגַּרְמִי
  choice: ഗർമ്യനായ കെയീലാ
  rationale: വ്യക്തിനാമവും കുല/ജനവിഭാഗസൂചക വിശേഷണവും വ്യാഖ്യാനാതിക്രമമില്ലാതെ ലിപ്യന്തരിച്ചു.
- source_word: וְאֶשְׁתְּמֹעַ הַמַּעֲכָתִי
  choice: മയഖാത്യനായ എഷ്ടെമോവ
  rationale: രണ്ടാമത്തെ പേരും അതോടു ചേർന്ന കുല/ജനവിഭാഗസൂചക വിശേഷണവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
