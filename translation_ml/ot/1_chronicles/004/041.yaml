revisions:
- from: പേരുപേരായി രേഖപ്പെടുത്തിയിരുന്ന ഇവർ യെഹൂദാരാജാവായ ഹിസ്കീയാവിന്റെ കാലത്ത് അവിടെ ചെന്നു. അവർ അവരുടെ കൂടാരങ്ങളെയും അവിടെ കണ്ട മെയൂന്യരെയും[a] ആക്രമിച്ച്, ഇന്നുവരെയും അവരെ നിശ്ശേഷനാശത്തിന് അർപ്പിച്ചു. പിന്നെ അവർ അവരുടെ സ്ഥാനത്ത് താമസമാക്കി; കാരണം അവരുടെ ആട്ടിൻപറ്റങ്ങൾക്ക് അവിടെ മേച്ചിൽപ്പുറം ഉണ്ടായിരുന്നു.
  to: പേരുപേരായി രേഖപ്പെടുത്തിയിരുന്ന ഇവർ യെഹൂദാരാജാവായ ഹിസ്കീയാവിന്റെ കാലത്ത് അവിടെ ചെന്നു. അവർ അവിടെ കണ്ട മെയൂന്യരുടെ കൂടാരങ്ങളെയും മെയൂന്യരെയും[a] ആക്രമിച്ചു; അവരെയും അവരുടെ കൂടാരങ്ങളെയും ഇന്നുവരെ നാശത്തിനായി സമർപ്പിച്ചു. പിന്നെ അവർ അവരുടെ സ്ഥാനത്ത് താമസമാക്കി, കാരണം അവരുടെ ആട്ടിൻപറ്റങ്ങൾക്ക് അവിടെ മേച്ചിൽപ്പുറം ഉണ്ടായിരുന്നു.
