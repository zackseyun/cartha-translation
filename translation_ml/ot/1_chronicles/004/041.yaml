  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֡אוּ אֵלֶּה֩ הַ/כְּתוּבִ֨ים בְּ/שֵׁמ֜וֹת בִּ/ימֵ֣י יְחִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה וַ/יַּכּ֨וּ אֶת אָהֳלֵי/הֶ֜ם וְ/אֶת ה/מעינים אֲשֶׁ֤ר נִמְצְאוּ שָׁ֨מָּ/ה֙ וַ/יַּחֲרִימֻ/ם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יֵּשְׁב֖וּ תַּחְתֵּי/הֶ֑ם כִּֽי מִרְעֶ֥ה לְ/צֹאנָ֖/ם שָֽׁם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
translation:
  language: ml
  text: പേരുപേരായി രേഖപ്പെടുത്തിയിരുന്ന ഇവർ യെഹൂദാരാജാവായ ഹിസ്കീയാവിന്റെ കാലത്ത് അവിടെ ചെന്നു. അവർ അവിടെ കണ്ട മെയൂന്യരുടെ കൂടാരങ്ങളെയും മെയൂന്യരെയും[a] ആക്രമിച്ചു; അവരെയും അവരുടെ കൂടാരങ്ങളെയും ഇന്നുവരെ നാശത്തിനായി സമർപ്പിച്ചു. പിന്നെ അവർ അവരുടെ സ്ഥാനത്ത് താമസമാക്കി, കാരണം അവരുടെ ആട്ടിൻപറ്റങ്ങൾക്ക് അവിടെ മേച്ചിൽപ്പുറം ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പദമായ הַמְּעִינִים ദുഷ്കരമാണ്. പരമ്പരാഗതമായി ഇതിനെ ‘മെയൂന്യർ’ എന്ന ജനവിഭാഗത്തിന്റെ പേരായി മനസ്സിലാക്കുന്നു; ചിലർ ‘വാസസ്ഥലങ്ങൾ’ അല്ലെങ്കിൽ ‘പാർപ്പിടങ്ങൾ’ എന്നും ഗ്രഹിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  choice: പേരുപേരായി രേഖപ്പെടുത്തിയിരുന്ന
  rationale: രജിസ്റ്ററിലോ വംശാവലിയിലോ വ്യക്തികളെ പേരോടെ രേഖപ്പെടുത്തിയിരുന്നതാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; സ്വാഭാവികമായ മലയാളത്തിൽ ഭരണപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וַיָּבֹאוּ
  choice: അവിടെ ചെന്നു
  rationale: בוא എന്ന ക്രിയയുടെ വരുക/ചെല്ലുക എന്ന ചലനാർഥം സന്ദർഭോചിതമായി നൽകുന്നു; ലക്ഷ്യസ്ഥലം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘അവിടെ’ ചേർത്തു.
- source_word: וַיַּכּוּ
  choice: ആക്രമിച്ച്
  rationale: സൈനികസന്ദർഭത്തിലെ പ്രഹരിക്കുകയും തോൽപ്പിക്കുകയും ചെയ്യുന്ന ശക്തമായ നടപടി സൂചിപ്പിക്കുന്നു; കൊല്ലപ്പെട്ടവരുടെ കൃത്യമായ വ്യാപ്തി മൂലപാഠത്തേക്കാൾ അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: אָהֳלֵיהֶם
  choice: അവരുടെ കൂടാരങ്ങളെ
  rationale: സാധാരണ കൂടാരങ്ങളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: המעינים
  choice: മെയൂന്യരെ
  rationale: ദുഷ്കരമായ വ്യഞ്ജനപാഠത്തെ പരമ്പരാഗതമായി ഒരു ജനവിഭാഗത്തിന്റെ പേരായി ഗ്രഹിക്കുന്നത് സന്ദർഭത്തോട് യോജിക്കുന്നു; മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: אֲשֶׁר נִמְצְאוּ שָׁמָּה
  choice: അവിടെ കണ്ട
  rationale: ‘മെയൂന്യർ’ എന്ന വ്യക്തിവാചക വായനയോട് യോജിക്കുന്ന ലളിതമായ മലയാള പ്രയോഗം.
- source_word: וַיַּחֲרִימֻם
  choice: അവരെ നിശ്ശേഷനാശത്തിന് അർപ്പിച്ചു
  rationale: חרם എന്ന പദത്തിലെ നാശത്തിനായി വേർതിരിച്ചർപ്പിക്കുന്ന സാങ്കേതികവും ഗൗരവമുള്ളതുമായ ആശയം കേവലം ‘നശിപ്പിച്ചു’ എന്നു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: ഹീബ്രു കാലസൂത്രത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാള രൂപം.
- source_word: וַיֵּשְׁבוּ תַּחְתֵּיהֶם
  choice: അവർ അവരുടെ സ്ഥാനത്ത് താമസമാക്കി
  rationale: മുൻവാസികളെ മാറ്റി അവരുടെ സ്ഥാനത്ത് കുടിയേറിയെന്ന തַּחַת പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מִרְעֶה לְצֹאנָם
  choice: അവരുടെ ആട്ടിൻപറ്റങ്ങൾക്ക് അവിടെ മേച്ചിൽപ്പുറം
  rationale: מִרְעֶה എന്നത് മേച്ചിൽസ്ഥലത്തെയും צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറിയ കന്നുകാലിപ്പറ്റത്തെയും സൂചിപ്പിക്കുന്നു; വായനാസൗകര്യത്തിനായി ‘ആട്ടിൻപറ്റങ്ങൾ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: חרם എന്ന ക്രിയയുടെ മതപരവും യുദ്ധപരവുമായ സാങ്കേതിക അർഥം
  choice: നിശ്ശേഷനാശത്തിന് അർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു / ശാപാർപ്പിതമാക്കി
  rationale: ഇത് വെറും കൊലപാതകം എന്നതിലുപരി നാശത്തിനായി വേർതിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിച്ചേക്കാം. പരിഭാഷ ആ സംഘർഷം നിലനിർത്തുകയും സംഭവത്തെ മൃദൂകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ചരിത്രവിവരണത്തിന്റെ സംക്ഷിപ്തതയും חרם എന്ന പദത്തിന്റെ അസ്വസ്ഥമാക്കുന്ന ശക്തിയും നിലനിർത്തി; ദുഷ്കരമായ הַמְּעִינִים എന്ന വായനയുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
