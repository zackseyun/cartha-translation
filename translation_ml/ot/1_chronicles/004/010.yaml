  revision_rationale: എബ്രായത്തിലെ ഊന്നലിനെ സാമ്പത്തികമോ സമൃദ്ധിവാദപരമോ ആയ നിറം ചേർക്കാതെ ‘തീർച്ചയായും’ എന്നതിലൂടെ അറിയിച്ചു. ദൈവത്തിന്റെ ‘കൈ’ എന്ന രൂപകം സംരക്ഷിച്ചുകൊണ്ട് പ്രയോഗം സ്വാഭാവികമാക്കി. רָעָהയുടെ സന്ദർഭാനുസൃതമായ ഹാനി എന്ന അർഥം മുഖ്യപാഠത്തിൽ നൽകിയെങ്കിലും ‘തിന്മ’ എന്ന സാധ്യമായ ബദൽ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. അടിക്കുറിപ്പ് b അതു വിശദീകരിക്കുന്ന വാക്യഭാഗത്തിലേക്കു മാറ്റി.
