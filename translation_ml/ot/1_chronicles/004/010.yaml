id: 1CH.4.10
reference: 1 Chronicles 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
translation:
  language: ml
  text: 'യബ്ബേസ് ഇങ്ങനെ പറഞ്ഞ് ഇസ്രായേലിന്റെ ദൈവത്തോടു പ്രാർഥിച്ചു: “അങ്ങ് എന്നെ തീർച്ചയായും അനുഗ്രഹിക്കുകയും എന്റെ പ്രദേശം വിശാലമാക്കുകയും അങ്ങയുടെ കൈ എന്നോടുകൂടെ ഉണ്ടായിരിക്കുകയും, ഞാൻ വേദന അനുഭവിക്കാതിരിക്കേണ്ടതിന്[b] ഹാനിയിൽനിന്ന്[a] എന്നെ കാക്കുകയും ചെയ്തെങ്കിൽ!” ദൈവം അവൻ അപേക്ഷിച്ചത് അനുവദിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഹാനി” എന്നതിന് “തിന്മ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ധാർമിക തിന്മയെയോ ഹാനികരമായ അനർഥത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ വേദനയെക്കുറിച്ചുള്ള പരാമർശം ഹാനി എന്ന അർഥത്തെ അനുകൂലിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ഞാൻ വേദന അനുഭവിക്കാതിരിക്കേണ്ടതിന്” എന്ന വാക്കുകൾ മുൻവാക്യത്തിൽ യബ്ബേസിന്റെ പേര് വിശദീകരിക്കുന്നതിനെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְרָא ... לֵאלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവത്തോടു പ്രാർഥിച്ചു
  rationale: ദൈവത്തോടുള്ള അപേക്ഷയുടെ സന്ദർഭത്തിൽ ‘വിളിച്ചു’ എന്നതിലുപരി പ്രാർഥനാപൂർവമായ അഭ്യർഥനയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പ്രാർഥിച്ചു’ അത് വ്യക്തമാക്കുന്നു.
- source_word: אִם בָּרֵךְ תְּבָרֲכֵנִי
  choice: അങ്ങ് എന്നെ സമൃദ്ധമായി അനുഗ്രഹിക്കുകയും ... ചെയ്തെങ്കിൽ!
  rationale: אִם എന്ന വ്യവസ്ഥാസൂചക കണം നിലനിർത്തിക്കൊണ്ട്, infinitive absolute നൽകുന്ന ഊന്നൽ ‘സമൃദ്ധമായി’ എന്നതിലൂടെ അറിയിക്കുന്നു. പൂർത്തിയാകാത്ത വ്യവസ്ഥാവാക്യത്തിന്റെ രൂപം തീക്ഷ്ണമായ ആഗ്രഹപ്രാർഥനയായി നിലനിർത്തുന്നു.
- source_word: וְהִרְבִּיתָ אֶת גְּבוּלִי
  choice: എന്റെ പ്രദേശം വിശാലമാക്കുകയും
  rationale: גְּבוּל അതിർത്തിയെയോ അതിനുള്ളിലെ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ ഭൂവിസ్తൃതിയുടെ വർധന എന്ന സ്വാഭാവിക അർഥം നൽകാൻ ‘പ്രദേശം’ ഉപയോഗിച്ചു.
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  choice: അങ്ങയുടെ കൈ എന്നോടുകൂടെ ഇരിക്കുകയും
  rationale: ദൈവിക ശക്തിയെയും സഹായത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം വ്യാഖ്യാനിച്ചു നീക്കാതെ മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: וְעָשִׂיתָ מֵּרָעָה
  choice: ദോഷത്തിൽനിന്ന് എന്നെ കാക്കുകയും
  rationale: എബ്രായ പ്രയോഗം സംക്ഷിപ്തവും വ്യാകരണപരമായി ദുഷ്കരവുമാണ്. തുടർന്നുള്ള വേദനയെക്കുറിച്ചുള്ള വാക്യഭാഗം പരിഗണിച്ച് ഹാനികരമായ അനർഥത്തിൽനിന്നുള്ള സംരക്ഷണം എന്ന അർഥം മുഖ്യപാഠത്തിൽ നൽകി.
- source_word: לְבִלְתִּי עָצְבִּי
  choice: ഞാൻ വേദന അനുഭവിക്കാതിരിക്കേണ്ടതിന്
  rationale: עצב എന്ന ധാതുവിന്റെ വേദന/ദുഃഖം എന്ന ആശയവും ഒന്നാംപുരുഷ പ്രത്യയവും വ്യക്തമാക്കുന്നു; മുൻവാക്യത്തിലെ യബ്ബേസിന്റെ പേരിടലുമായി ഉള്ള ശബ്ദാർഥബന്ധവും നിലനിർത്തുന്നു.
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  choice: അവൻ അപേക്ഷിച്ചത് ദൈവം സാധിച്ചുകൊടുത്തു
  rationale: ദൈവം അവന്റെ അപേക്ഷ യാഥാർഥ്യമാക്കി എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: גְּבוּל എന്ന പദത്തിന്റെ അർഥം
  choice: ഭൗമികമായ ‘പ്രദേശം’
  alternative: സ്വാധീനമേഖല
  rationale: എബ്രായ പദം സ്വാഭാവികമായി അതിർത്തിയെയോ ഭൂപ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക സമൃദ്ധിസിദ്ധാന്തമോ ‘സ്വാധീനമേഖല’ എന്ന അമൂർത്തമായ പ്രയോഗമോ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- issue: רָעָה എന്ന പദത്തിന്റെ അർഥം
  choice: ദോഷം—ഈ സന്ദർഭത്തിൽ ഹാനിയോ അനർഥമോ ഉൾക്കൊള്ളുന്ന പദമായി
  alternative: തിന്മ
  rationale: പദത്തിന് ധാർമിക തിന്മയെയും ഹാനികരമായ അനർഥത്തെയും സൂചിപ്പിക്കാനാകും. വേദനയെക്കുറിച്ചുള്ള തുടർവാക്യം ഹാനിയിൽനിന്നുള്ള സംരക്ഷണത്തെ അനുകൂലിക്കുന്നുവെങ്കിലും യഥാർഥമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: അനുഗ്രഹത്തിനായുള്ള അപേക്ഷയുടെ വ്യവസ്ഥാപരമായ രൂപം
  choice: ‘ചെയ്തെങ്കിൽ!’ എന്ന തീക്ഷ്ണമായ ആഗ്രഹപ്രാർഥന
  alternative: ‘അങ്ങ് ... ചെയ്യണമേ’ എന്ന നേരിട്ടുള്ള അപേക്ഷ
  rationale: אִם എന്ന കണം ഒഴിവാക്കാതെ, പൂർത്തിയാകാത്ത വ്യവസ്ഥാവാക്യം പ്രാർഥനാപരമായ ആഗ്രഹമായി വായിക്കാവുന്ന വിധത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവുമായ പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. ദൈവത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും വിവരണത്തിൽ ‘ദൈവം’ എന്നും നൽകി. എബ്രായത്തിലെ ‘കൈ’ എന്ന രൂപകം സംരക്ഷിച്ചു; വ്യവസ്ഥാരൂപത്തിലുള്ള തീക്ഷ്ണമായ ആഗ്രഹവും ലളിതമാക്കി ഇല്ലാതാക്കിയിട്ടില്ല.
