    text: “ഹാനി” എന്നതിന് “തിന്മ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ധാർമിക തിന്മയെയോ ഹാനികരമായ അനർഥത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ വേദനയെക്കുറിച്ചുള്ള പരാമർശം ഹാനി എന്ന അർഥത്തെ അനുകൂലിക്കുന്നു.
