translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമം ലിപ്യന്തരിച്ചു; ആവർത്തനം ഒഴിവാക്കാൻ חָצֵר എന്നതിന് ‘ഗ്രാമങ്ങൾ’ എന്നും מוֹשָׁב എന്നതിന് ‘വാസസ്ഥലങ്ങൾ’ എന്നും വ്യത്യസ്ത പദങ്ങൾ നൽകി.
