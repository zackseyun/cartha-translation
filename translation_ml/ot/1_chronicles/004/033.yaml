  yaml_path: translation/ot/1_chronicles/004/033.yaml
  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
translation:
  language: ml
  text: ഈ പട്ടണങ്ങൾക്കു ചുറ്റുമുള്ള, ബാൽവരെ എത്തുന്ന അവരുടെ എല്ലാ ഗ്രാമങ്ങളും[a]—ഇവയായിരുന്നു അവരുടെ വാസസ്ഥലങ്ങൾ; അവർ വംശാവലിപ്രകാരം രജിസ്റ്റർ ചെയ്യപ്പെട്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചെറുഗ്രാമങ്ങളും’ അല്ലെങ്കിൽ ‘ജനവാസകേന്ദ്രങ്ങളും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവർ തങ്ങളെത്തന്നെ വംശാവലിപ്രകാരം രജിസ്റ്റർ ചെയ്തിരുന്നു.’ എബ്രായ പ്രയോഗം വംശാവലിയനുസരിച്ചുള്ള രജിസ്ട്രേഷനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: അവരുടെ ഗ്രാമങ്ങൾ
  rationale: חָצֵר എന്ന പദത്തിന് വേലി കെട്ടിയ സ്ഥലം, മുറ്റം, ചെറിയ ഗ്രാമം എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ പട്ടണങ്ങളെ ചുറ്റിയുള്ള ജനവാസകേന്ദ്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സ്വാഭാവികമായ ഭൂമിശാസ്ത്രപരമായ പദമായി ‘ഗ്രാമങ്ങൾ’ തെരഞ്ഞെടുത്തു.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങളുടെ ചുറ്റുമുള്ള
  rationale: മുമ്പ് പറഞ്ഞ പട്ടണങ്ങളോടുള്ള ഗ്രാമങ്ങളുടെ സ്ഥാനബന്ധം ചുരുക്കവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: עַד בָּעַל
  choice: ബാൽവരെ
  rationale: עַד പരിധിയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ בָּעַל ഒരു സ്ഥലനാമമായതിനാൽ ‘ബാൽ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: זֹאת מוֹשְׁבֹתָם
  choice: ഇവയായിരുന്നു അവരുടെ വാസസ്ഥലങ്ങൾ
  rationale: זֹאת വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും മുമ്പുള്ള സ്ഥലങ്ങളുടെ പട്ടികയെ സംഗ്രഹിച്ചാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്. മലയാളത്തിൽ ആ ബഹുവചന സൂചന സ്വാഭാവികമായി നിലനിർത്താൻ ‘ഇവയായിരുന്നു’ എന്നു നൽകി.
- source_word: וְהִתְיַחְשָׂם לָהֶם
  choice: അവർ വംശാവലിപ്രകാരം രജിസ്റ്റർ ചെയ്യപ്പെട്ടിരുന്നു
  rationale: יחש എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം വംശാവലിയനുസരിച്ചുള്ള കണക്കെടുപ്പിനെയോ രജിസ്ട്രേഷനെയോ സൂചിപ്പിക്കുന്നു. സംക്ഷിപ്തമായ എബ്രായ പ്രയോഗത്തിന്റെ അടിസ്ഥാന അർഥം വ്യക്തമായി നൽകുകയും കർത്തൃത്വത്തെ അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
