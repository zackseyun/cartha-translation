  revised_footnotes: []
  revision_rationale: 'The revision retains the Hebrew sequence—Ziza followed by Shiphi, Allon, Jedaiah, Shimri, and Shemaiah—while expressing each paternal relation in clear modern Malayalam. No footnote is needed: the source has no substantive ambiguity here, and the English Ziza/Zizah note is specific to English orthographic convention.'
