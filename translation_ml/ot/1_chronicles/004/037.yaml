id: 1CH.4.37
reference: 1 Chronicles 4:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זִיזָ֨א בֶן שִׁפְעִ֧י בֶן אַלּ֛וֹן בֶּן יְדָיָ֥ה בֶן שִׁמְרִ֖י בֶּן שְׁמַֽעְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/037.yaml
  text: and Ziza son of Shiphi[a], son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.
translation:
  language: ml
  text: ശിഫിയുടെ മകനായ സീസയും, അല്ലോന്റെ മകനായ ശിഫി, യെദായാവിന്റെ മകനായ അല്ലോൻ, ശിമ്രിയുടെ മകനായ യെദായാവ്, ശെമയ്യാവിന്റെ മകനായ ശിമ്രി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/זִיזָא
  choice: സീസയും
  rationale: വംശാവലിപ്പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന וְ എന്ന സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ അനുബന്ധപ്രത്യയമായ ‘യും’കൊണ്ട് നൽകി. זִיזָא എന്ന വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത് ‘സീസ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: בֶן
  choice: മകൻ
  rationale: വംശാവലിസൂത്രത്തിലെ בֶן എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘മകൻ’ നിലനിർത്തി; ആവർത്തിച്ചുള്ള ബന്ധങ്ങൾ മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കി.
- source_word: שִׁפְעִי
  choice: ശിഫി
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു വ്യഞ്ജന-സ്വരരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אַלּוֹן
  choice: അല്ലോൻ
  rationale: ഇവിടെ ഇത് ‘ഓക്ക് മരം’ എന്ന പൊതുനാമമല്ല, വ്യക്തിനാമമാണ്; അതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: יְדָיָה
  choice: യെദായാവ്
  rationale: ഹീബ്രു നാമത്തിന്റെ ശബ്ദരൂപം പിന്തുടരുകയും മലയാള ബൈബിൾ നാമശൈലിയോട് യോജിക്കുന്ന വിധത്തിൽ അവസാനഘടകം ‘യാവ്’ എന്നു നൽകുകയും ചെയ്തു.
- source_word: שִׁמְרִי
  choice: ശിമ്രി
  rationale: ഹീബ്രു שׁ എന്ന വ്യഞ്ജനത്തെ ‘ശ’കൊണ്ട് വ്യക്തമായി പ്രതിനിധീകരിച്ച് പേര് ലിപ്യന്തരിച്ചു.
- source_word: שְׁמַעְיָה
  choice: ശെമയ്യാവ്
  rationale: ഹീബ്രു നാമത്തിന്റെ ഘടനയും ഉച്ചാരണവും തിരിച്ചറിയാവുന്ന ആധുനിക മലയാളരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ ആവർത്തിത ‘മകൻ’ ശൃംഖല സംരക്ഷിച്ചെങ്കിലും, മലയാളത്തിൽ വംശപരമ്പര സ്വാഭാവികമായി വായിക്കാനായി ഏറ്റവും പഴയ പൂർവികനിൽനിന്ന് സീസയിലേക്കുള്ള ക്രമത്തിൽ വാക്യം ക്രമീകരിച്ചു. ഈ ക്രമമാറ്റം വംശബന്ധത്തിന്റെ ഉള്ളടക്കം മാറ്റുന്നില്ല. ഹീബ്രു പാഠം aleph-ൽ അവസാനിക്കുന്ന זִיזָא എന്ന രൂപം തന്നെയായതിനാൽ ഇംഗ്ലീഷിലെ ‘Ziza/Zizah’ അക്ഷരവിന്യാസവ്യത്യാസം മലയാളത്തിൽ പ്രസക്തമായ യഥാർഥ പാഠവ്യത്യാസമല്ല; അതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
