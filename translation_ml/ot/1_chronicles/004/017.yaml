  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
translation:
  language: ml
  text: എസ്രായുടെ പുത്രന്മാർ:[a] യെഥെർ, മെരെദ്, ഏഫെർ, യാലോൻ. അവൾ[b] മിര്യാം, ശമ്മായി, എശ്തെമോവായുടെ പിതാവായ[c] യിശ്ബഹ് എന്നിവരെ ഗർഭം ധരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘എസ്രായുടെ പുത്രൻ’ എന്നാണ്. എന്നാൽ പിന്നാലെ പല പേരുകൾ വരുന്നതിനാൽ ഇത് സാധാരണയായി ‘എസ്രായുടെ പുത്രന്മാർ’ എന്ന കൂട്ടശീർഷകമായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: textual_variant
  - marker: b
    text: എബ്രായപാഠം ‘അവൾ ഗർഭം ധരിച്ചു’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; ഈ വാക്യഭാഗത്തിൽ ആ സ്ത്രീ ആരാണെന്ന് വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: എശ്തെമോവാ ഒരു കുലമോ വാസസ്ഥലമോ ആണെങ്കിൽ, ‘എശ്തെമോവായുടെ സ്ഥാപകൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
