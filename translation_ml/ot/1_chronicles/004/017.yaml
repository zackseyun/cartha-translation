- source_word: וּבֶן
  choice: എസ്രഹിന്റെ പുത്രന്മാർ
  rationale: എബ്രായരൂപം ഏകവചനത്തിൽ ‘പുത്രൻ’ എന്നാണ്; എന്നാൽ പിന്നാലെ പല പേരുകൾ വരുന്നതിനാൽ വംശാവലിയുടെ കൂട്ടശീർഷകമായി ‘പുത്രന്മാർ’ എന്നു നൽകിയിരിക്കുന്നു. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
