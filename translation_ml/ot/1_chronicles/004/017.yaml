- source_word: וְיָלוֹן
  choice: യാലോൻ
  rationale: വ്യക്തിനാമത്തിന്റെ ലിപ്യന്തരണം.
- source_word: וַתַּהַר
  choice: അവൾ ... ഗർഭം ധരിച്ചു
  rationale: הרה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘ഗർഭം ധരിക്കുക/ഗർഭിണിയാകുക’ എന്നതാണ്. സ്ത്രീലിംഗ ഏകവചന കർത്താവ് മൂലപാഠത്തിൽ പേരുപറയാതെ നിൽക്കുന്നതിനാൽ ‘അവൾ’ എന്നു മാത്രം നിലനിർത്തി.
- source_word: מִרְיָם
  choice: മിര്യാം
