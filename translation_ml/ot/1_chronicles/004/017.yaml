- source_word: שַׁמַּי
  choice: ശമ്മായി
  rationale: വ്യക്തിനാമത്തിന്റെ ലിപ്യന്തരണം.
- source_word: יִשְׁבָּח
  choice: യിശ്ബഹ്
  rationale: വ്യക്തിനാമത്തിന്റെ ലിപ്യന്തരണം.
- source_word: אֲבִי אֶשְׁתְּמֹעַ
  choice: എശ്തെമോവയുടെ പിതാവായ
  rationale: വംശാവലിസന്ദർഭത്തിലെ אָב എന്ന പദത്തിന്റെ ഔപചാരികവും സുതാര്യവുമായ അർഥം ‘പിതാവ്’ എന്നാണ്. ഒരു കുലത്തിന്റെയോ പട്ടണത്തിന്റെയോ സ്ഥാപകൻ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
