lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: അവരുടെ കുടിയിരിപ്പുകൾ
  rationale: חָצֵר എന്ന പദത്തിന് ഗ്രാമം, ചെറുകുടിയിരിപ്പ്, ചുറ്റുമതിലുള്ള വാസസ്ഥലം എന്നീ അർഥങ്ങൾ വരാം. സ്ഥലനാമങ്ങളുടെ ഈ പട്ടികയിൽ ‘കുടിയിരിപ്പുകൾ’ എന്നത് അർഥപരിധി അനാവശ്യമായി ചുരുക്കാതെ സ്വാഭാവികമായ ആധുനിക മലയാളം നൽകുന്നു.
- source_word: עֵיטָם
  choice: ഏതാം
  rationale: സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു.
- source_word: עַיִן
  choice: അയിൻ
  rationale: സാധാരണ നാമമായി ‘കണ്ണ്’ അല്ലെങ്കിൽ ‘ഉറവ’ എന്ന് അർഥമാകാമെങ്കിലും, ഇവിടെ പട്ടണങ്ങളുടെ പട്ടികയിൽ വരുന്ന സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: רִמּוֹן
  choice: രിമ്മോൻ
  rationale: സാധാരണ നാമമായി ‘മാതളം’ എന്ന് അർഥമാകാമെങ്കിലും, ഇവിടെ സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു; ദ്വിത്വ വ്യഞ്ജനം നിലനിർത്തി.
- source_word: תֹכֶן
  choice: തോഖെൻ
  rationale: സ്ഥലനാമം എബ്രായ വ്യഞ്ജനരൂപത്തെയും ഉച്ചാരണത്തെയും പിന്തുടർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָשָׁן
  choice: ആശാൻ
  rationale: സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָרִים חָמֵשׁ
  choice: അഞ്ച് പട്ടണങ്ങൾ
  rationale: עִיר എന്നത് നഗരമോ പട്ടണമോ സൂചിപ്പിക്കാം. പുരാതന കുടിയിരിപ്പുകളുടെ ഈ പട്ടികയിൽ വലുപ്പത്തെ അതിശയിപ്പിക്കാതെ സ്വാഭാവികമായി വായിക്കാനായി ‘പട്ടണങ്ങൾ’ തിരഞ്ഞെടുത്തു.
