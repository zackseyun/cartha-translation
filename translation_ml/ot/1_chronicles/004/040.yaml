  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവർത്തനം. ‘സ്വസ്ഥം’ എന്നും ‘സമാധാനപൂർണം’ എന്നും ഉപയോഗിച്ച് ശֹׁקֶטֶת, שְׁלֵוָה എന്നീ സമീപാർഥപദങ്ങളുടെ ആവർത്തനവും സൂക്ഷ്മവ്യത്യാസവും നിലനിർത്തി.
