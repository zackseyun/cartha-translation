id: 1CH.4.40
reference: 1 Chronicles 4:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּמְצְא֤וּ מִרְעֶה֙ שָׁמֵ֣ן וָ/ט֔וֹב וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם וְ/שֹׁקֶ֖טֶת וּ/שְׁלֵוָ֑ה כִּ֣י מִן חָ֔ם הַ/יֹּשְׁבִ֥ים שָׁ֖ם לְ/פָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
translation:
  language: ml
  text: അവർ സമൃദ്ധവും നല്ലതുമായ മേച്ചിൽപ്പുറം കണ്ടെത്തി. ആ ദേശം വിശാലവും സ്വസ്ഥവും സമാധാനപൂർണവുമായിരുന്നു; കാരണം മുമ്പ് അവിടെ പാർത്തിരുന്നവർ ഹാമിന്റെ വംശജരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘കാരണം മുമ്പ് അവിടെ പാർത്തിരുന്നവർ ഹാമിൽനിന്നുള്ളവരായിരുന്നു.’'
    reason: എബ്രായത്തിലെ ‘ഹാമിൽനിന്ന്’ എന്ന സംക്ഷിപ്ത വംശസൂചനയും വാക്യഘടനയും വ്യക്തമാക്കുന്ന അക്ഷരാർഥപരമായ പകരം.
lexical_decisions:
- source_word: מִרְעֶה
  choice: മേച്ചിൽപ്പുറം
  rationale: കന്നുകാലികൾ മേയുന്ന സ്ഥലത്തെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: שָׁמֵן
  choice: സമൃദ്ധമായ
  rationale: അക്ഷരാർഥത്തിൽ ‘കൊഴുത്ത’ എന്നാണെങ്കിലും മേച്ചിൽപ്പുറത്തെക്കുറിച്ച് പറയുമ്പോൾ പുല്ലും വിഭവവും ധാരാളമുള്ള അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: טוֹב
  choice: നല്ല
  rationale: മൂലത്തിലെ ലളിതമായ അനുകൂല വിലയിരുത്തൽ അതേപടി നിലനിർത്തുന്നു.
- source_word: רַחֲבַת יָדַיִם
  choice: വിശാലമായ
  rationale: ‘ഇരുകൈകളിലേക്കും വീതിയുള്ള’ എന്ന എബ്രായ ശൈലിയുടെ അർഥം വിസ്തൃതവും ധാരാളം ഇടമുള്ളതുമായ ദേശം എന്നാണ്.
- source_word: שֹׁקֶטֶת
  choice: സ്വസ്ഥമായ
  rationale: കലഹമോ ശല്യമോ ഇല്ലാതെ അടങ്ങിയിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; അടുത്ത പദമായ ‘സമാധാനപൂർണം’ എന്നതിൽനിന്നും ചെറിയ അർഥവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: שְׁלֵוָה
  choice: സമാധാനപൂർണമായ
  rationale: സുരക്ഷിതവും ആശ്വാസകരവും പ്രശാന്തവുമായ അവസ്ഥയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; സാമ്പത്തിക സമൃദ്ധി അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: כִּי מִן חָם הַיֹּשְׁבִים שָׁם לְפָנִים
  choice: കാരണം മുമ്പ് അവിടെ പാർത്തിരുന്നവർ ഹാമിന്റെ വംശജരായിരുന്നു
  rationale: മുൻകാല നിവാസികളെ ഹാമിൽനിന്നുള്ളവരായി തിരിച്ചറിയുന്ന എബ്രായ വാക്യഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. വംശബന്ധം വ്യക്തമാക്കാൻ ‘വംശജർ’ ചേർത്തിട്ടുണ്ട്.
- source_word: חָם
  choice: ഹാം
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
