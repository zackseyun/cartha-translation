- from: തെക്കോവയുടെ പിതാവായ അശ്ഹൂരിന് ഹേലയും നയരയും[a] എന്നു പേരുള്ള രണ്ടു ഭാര്യമാർ ഉണ്ടായിരുന്നു.
  to: തെക്കോവയുടെ പിതാവായ അശ്ഹൂരിന് ഹേലാ എന്നും നആരാ എന്നും പേരുള്ള രണ്ട് ഭാര്യമാർ ഉണ്ടായിരുന്നു.[a]
  rationale: The revision corrects the transliteration of both wives’ names, especially Naʿarah, while retaining the source’s possessive sense and the deliberately broad genealogical force of ‘father of Tekoa.’ It also makes the footnote’s alternatives grammatically complete in modern Malayalam.
