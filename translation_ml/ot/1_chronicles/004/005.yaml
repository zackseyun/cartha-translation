    text: അല്ലെങ്കിൽ, ‘തെക്കോവയുടെ സ്ഥാപകൻ’ / ‘തെക്കോവയുടെ പൂർവികൻ.’ വംശാവലികളിൽ ‘പിതാവ്’ എന്നത് അടുത്ത ജൈവപിതാവിനെ മാത്രമല്ല, ഒരു കുലത്തിന്റെയോ പാർപ്പിടത്തിന്റെയോ സ്ഥാപകനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
