id: 1CH.4.5
reference: 1 Chronicles 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/אַשְׁחוּר֙ אֲבִ֣י תְק֔וֹעַ הָי֖וּ שְׁתֵּ֣י נָשִׁ֑ים חֶלְאָ֖ה וְ/נַעֲרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/005.yaml
  text: 'Ashhur the father of Tekoa had two wives: Helah and Naarah[a].'
translation:
  language: ml
  text: തെക്കോവയുടെ പിതാവായ അശ്ഹൂരിന് ഹേലാ എന്നും നആരാ എന്നും പേരുള്ള രണ്ട് ഭാര്യമാർ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തെക്കോവയുടെ സ്ഥാപകൻ’ / ‘തെക്കോവയുടെ പൂർവികൻ.’ വംശാവലികളിൽ ‘പിതാവ്’ എന്നത് അടുത്ത ജൈവപിതാവിനെ മാത്രമല്ല, ഒരു കുലത്തിന്റെയോ പാർപ്പിടത്തിന്റെയോ സ്ഥാപകനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  choice: അശ്ഹൂരിന്
  rationale: പേരിനോടു ചേർന്നിരിക്കുന്ന മുൻപ്രത്യയം ഈ അസ്തിത്വവാക്യത്തിൽ ഉടമസ്ഥത സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ദാതൃവിഭക്തിയോടുകൂടിയ പ്രയോഗം സ്വാഭാവികമാണ്. ആരംഭത്തിലെ സംയോജകത്തിന്റെ വംശാവലി-ബന്ധിപ്പിക്കൽശക്തി പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തേണ്ടത്ര പ്രബലമല്ല.
- source_word: אֲבִי תְקוֹעַ
  choice: തെക്കോവയുടെ പിതാവായ
  rationale: אָב എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘പിതാവ്’ നിലനിർത്തുന്നു; വംശാവലിസന്ദർഭത്തിൽ പൂർവികൻ, കുലസ്ഥാപകൻ, അല്ലെങ്കിൽ സ്ഥലസ്ഥാപകൻ എന്ന വിശാല അർഥവും സാധ്യമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָיוּ
  choice: ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ ‘ആയിരുന്നു/ഉണ്ടായിരുന്നു’ എന്ന അസ്തിത്വനിർമ്മിതി മലയാളത്തിൽ ദാതൃവിഭക്തിയോടൊപ്പം ‘അശ്ഹൂരിന് ... ഉണ്ടായിരുന്നു’ എന്നു സ്വാഭാവികമായി ഉടമസ്ഥത പ്രകടിപ്പിക്കുന്നു.
- source_word: שְׁתֵּי נָשִׁים
  choice: രണ്ടു ഭാര്യമാർ
  rationale: പുരുഷന്റെ പേരോടുകൂടിയ ഈ വംശാവലി അറിയിപ്പിൽ נָשִׁים പൊതുവായ ‘സ്ത്രീകൾ’ എന്നതിലുപരി ‘ഭാര്യമാർ’ എന്നാണ് സന്ദർഭം വ്യക്തമാക്കുന്നത്.
- source_word: חֶלְאָה
  choice: ഹേല
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജനഘടനയും സ്വരപരമ്പരയും മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וְנַעֲרָה
  choice: നയര
  rationale: രണ്ടാമത്തെ വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; പേരുകളുടെ പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘യും’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. എബ്രായ വാക്യഘടനയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥതാപ്രയോഗം ഉപയോഗിച്ചു; മൂലത്തിലെ ‘പിതാവ്’ എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
