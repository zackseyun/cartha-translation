  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സ്ഥലനാമവായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചെങ്കിലും ഹീബ്രുവിലെ യഥാർഥ പദദ്വയാർഥത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. ‘രാജാവിനോടൊപ്പം’ എന്നും ‘അവന്റെ ജോലിക്കായി’ എന്നും നൽകി രാജസേവനസൂചന നിലനിർത്തുകയും അതിനെ അതിവ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്തു.
