  yaml_path: translation/ot/1_chronicles/004/023.yaml
  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
translation:
  language: ml
  text: ഇവർ കുശവന്മാരായിരുന്നു; നെതായീമിലും ഗെദേരയിലും താമസിച്ചിരുന്നവർ. [a] രാജാവിനോടൊപ്പം, അവന്റെ ജോലിയിൽ, അവർ അവിടെ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഇവർ കുശവന്മാരും നട്ടുവളർത്തിയ ഇടങ്ങളിലും വേലി അല്ലെങ്കിൽ ചുറ്റുമതിലുള്ള സ്ഥലത്തും താമസിച്ചിരുന്നവരുമായിരുന്നു.” നെതായീം, ഗെദേര എന്നീ ഹീബ്രുപദങ്ങളെ സ്ഥലനാമങ്ങളായോ പൊതുനാമങ്ങളായോ വായിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: ഇവർ ... ആയിരുന്നു
  rationale: മുൻപു പറഞ്ഞ വംശാവലിക്കൂട്ടത്തെ ചൂണ്ടിക്കാണിക്കുന്ന സർവനാമം; ഹീബ്രുവിലെ ക്രിയാരഹിത തിരിച്ചറിയൽവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി ഭൂതകാല ക്രിയ ചേർത്തു നൽകി.
- source_word: הַיּוֹצְרִים
  choice: കുശവന്മാർ
  rationale: יצר എന്ന ധാതുവിൽനിന്നുള്ള ഈ പദം ഇവിടെ കളിമണ്ണ് രൂപപ്പെടുത്തുന്ന തൊഴിലാളികളെ, അഥവാ കുശവന്മാരെ, സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സാദ്ധ്യം.
- source_word: וְיֹשְׁבֵי
  choice: താമസിച്ചിരുന്നവർ
  rationale: ישב എന്നതിന്റെ കർത്തൃവാചക രൂപം സ്ഥിരതാമസക്കാരെ സൂചിപ്പിക്കുന്നു; ആ നാമസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נְטָעִים
  choice: നെതായീം
  rationale: വംശാവലി-ഭൂമിശാസ്ത്ര പശ്ചാത്തലത്തിൽ സ്ഥലനാമമായി എടുക്കുന്നതാണ് കൂടുതൽ സാദ്ധ്യം; ‘നട്ടുവളർത്തിയ ഇടങ്ങൾ/തോട്ടങ്ങൾ’ എന്ന പൊതുനാമസാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וּגְדֵרָה
  choice: ഗെദേര
  rationale: നെതായീമിനോടൊപ്പം വരുന്ന സ്ഥലനാമമായി വായിച്ചു; ‘മതിൽ/വേലി കെട്ടിയ സ്ഥലം’ എന്ന പൊതുനാമസാദ്ധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: עִם הַמֶּלֶךְ
  choice: രാജാവിനോടൊപ്പം
  rationale: עִם എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘കൂടെ/ഒപ്പം’ നേരിട്ട് നിലനിർത്തുന്നു; രാജസേവനത്തിന്റെ ആശയം തുടർന്നുള്ള പ്രയോഗത്തിൽനിന്ന് വ്യക്തമാകാൻ അനുവദിക്കുന്നു.
- source_word: בִּמְלַאכְתּוֹ
  choice: അവന്റെ ജോലിക്കായി
  rationale: מְלָאכָה ജോലി, തൊഴിൽ, സേവനം എന്നിവ സൂചിപ്പിക്കാം; പ്രത്യയത്തിന്റെ പൂർവപദം രാജാവാണെന്നത് ‘അവന്റെ’ എന്ന് വ്യക്തമാക്കി, സേവനം എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കിയില്ല.
- source_word: יָשְׁבוּ שָׁם
  choice: അവിടെ താമസിച്ചു
  rationale: ישב കൂടെ שָׁם വരുമ്പോൾ ആ സ്ഥലത്തെ വാസം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം തിരഞ്ഞെടുത്തു.
