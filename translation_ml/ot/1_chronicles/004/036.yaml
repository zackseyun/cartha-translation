  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶלְיוֹעֵינַ֡י וְֽ/יַעֲקֹ֡בָה וִ֠/ישׁוֹחָיָה וַ/עֲשָׂיָ֧ה וַ/עֲדִיאֵ֛ל וִ/ישִׂימִאֵ֖ל וּ/בְנָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/036.yaml
  text: and Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah.
translation:
  language: ml
  text: എല്യോഎനായി, യാക്കോബാ, യെശോഹായാ, അസായാ, അദിയേൽ, യെസീമീയേൽ, ബെനായാ എന്നിവരും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְיוֹעֵינַי
  choice: എല്യോവേനായി
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: יַעֲקֹבָה
  choice: യാക്കോബാ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יְשׁוֹחָיָה
  choice: യെശോഹായാ
  rationale: ആദ്യ യോദ് ‘യെ’ എന്നും പേരിന്റെ അവസാന ഘടകം ‘ഹായാ’ എന്നും പ്രതിനിധീകരിച്ച് ലിപ്യന്തരിച്ചു.
- source_word: עֲשָׂיָה
  choice: അസായാ
  rationale: ഹീബ്രു ശബ്ദരൂപത്തോട് ചേർന്ന, വായിക്കാൻ എളുപ്പമുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: עֲדִיאֵל
  choice: അദിയേൽ
  rationale: പേരിലെ ‘ഏൽ’ ഘടകം നിലനിർത്തിക്കൊണ്ട് വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: יְשִׂימִיאֵל
  choice: യെസീമീയേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ഘടനയും അവസാനത്തെ ‘ഏൽ’ ഘടകവും സംരക്ഷിക്കുന്ന ലിപ്യന്തരണം.
- source_word: בְּנָיָה
  choice: ബെനായാ
  rationale: ഹീബ്രു പേരിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וְ / וַ / וִ / וּ
  choice: എന്നിവരും
  rationale: മുൻവാക്യത്തിൽ തുടരുന്ന വംശാവലിപ്പട്ടികയാണെന്നത് ‘ഉം’ മുഖേന സൂചിപ്പിക്കുന്നു; ഓരോ പേരിനുമുമ്പും ‘ഉം’ ആവർത്തിക്കുന്നത് മലയാളത്തിൽ കൃത്രിമമായതിനാൽ അവസാനത്തിൽ സമാഹാരബന്ധം നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഇത് മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന പേരുകളുടെ പട്ടികയായതിനാൽ അവസാനത്തിലെ ‘എന്നിവരും’ ബന്ധവും പട്ടികയുടെ തുടർച്ചയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
