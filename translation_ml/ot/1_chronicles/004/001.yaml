id: 1CH.4.1
reference: 1 Chronicles 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֖י יְהוּדָ֑ה פֶּ֧רֶץ חֶצְר֛וֹן וְ/כַרְמִ֖י וְ/ח֥וּר וְ/שׁוֹבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/001.yaml
  text: 'The sons of Judah: Perez[a], Hezron, Carmi, Hur, and Shobal.'
translation:
  language: ml
  text: 'യെഹൂദയുടെ പുത്രന്മാർ: പെരെസ്[a], ഹെസ്രോൻ, കർമി, ഹൂർ, ശോബാൽ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ “പുത്രന്മാർ” എന്ന പ്രയോഗം വംശാവലിയിൽ നേരിട്ടുള്ള പുത്രന്മാരെയോ കൂടുതൽ പൊതുവായി സന്തതികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ നിർമാണാവസ്ഥയിലുള്ള ബഹുവചനരൂപം. വംശാവലിയിൽ ഇത് നേരിട്ടുള്ള പുത്രന്മാരെയോ കൂടുതൽ പൊതുവായി സന്തതികളെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള രൂപം നിലനിർത്തി വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוּדָה
  choice: യെഹൂദ
  rationale: ഗോത്രപിതാവിന്റെയും ഗോത്രത്തിന്റെയും പേരായ യെഹൂദയുടെ മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ പരിചിതമായ രൂപം.
- source_word: פֶּרֶץ
  choice: പേരെസ്
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വ്യക്തമായി വായിക്കാവുന്ന ലിപ്യന്തരണം.
- source_word: חֶצְרוֹן
  choice: ഹെസ്രോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: כַרְמִי
  choice: കർമി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള ലിപ്യന്തരണം.
- source_word: חוּר
  choice: ഹൂർ
  rationale: ദീർഘമായ ū സ്വരം സൂചിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שׁוֹבָל
  choice: ശോബാൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וְ
  choice: പട്ടികയിൽ കോമകൾ
  rationale: ആവർത്തിച്ചുള്ള സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാശൈലിയിൽ കോമകളാൽ അവതരിപ്പിക്കുന്നു; അവസാന പേരിനു മുമ്പ് നിർബന്ധിതമായി ‘എന്നിവർ’ ചേർക്കാതെ എബ്രായത്തിലെ ലളിതമായ നാമപ്പട്ടിക നിലനിർത്തുന്നു.
theological_decisions:
- issue: പട്ടികയിലെ എല്ലാവരും യെഹൂദയുടെ നേരിട്ടുള്ള പുത്രന്മാരാണോ എന്ന വംശാവലിപരമായ ചോദ്യം
  choice: മുഖ്യപാഠത്തിൽ ‘പുത്രന്മാർ’ നിലനിർത്തുകയും അതിന്റെ വിശാലമായ വംശാവലിപരമായ പ്രയോഗം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്തു.
  alternative: ‘സന്തതികൾ’ എന്ന് മുഖ്യപാഠത്തിൽ വിവർത്തനം ചെയ്യുക.
  rationale: בְּנֵי എന്നത് രൂപപരമായി ‘പുത്രന്മാർ’ എന്നാണ്; എന്നാൽ ദിനവൃത്താന്തങ്ങളുടെ വംശാവലിയിൽ ബന്ധം കൂടുതൽ വിശാലമാകാം. അതിനാൽ പാഠത്തിന്റെ രൂപവും യഥാർഥ അർഥവ്യാപ്തിയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പേരുകൾ എബ്രായ ശബ്ദരൂപത്തോട് ചേർത്ത് ലിപ്യന്തരിച്ചു; വാക്യത്തിന്റെ സംക്ഷിപ്തമായ വംശാവലിശൈലി നിലനിർത്തി.
