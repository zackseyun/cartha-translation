source:
  edition: WLC
  text: וַ/יַּכּ֕וּ אֶת שְׁאֵרִ֥ית הַ/פְּלֵטָ֖ה לַ/עֲמָלֵ֑ק וַ/יֵּ֣שְׁבוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/043.yaml
  text: And they struck down the remnant of the survivors of Amalek[b][a], and they lived there to this day.
translation:
  language: ml
  text: അവർ അമാലേക്ക്യരിൽ ശേഷിച്ചിരുന്ന അതിജീവിതരെ അടിച്ചുവീഴ്ത്തി[a]; ഇന്നുവരെ അവർ അവിടെ താമസിച്ചുപോന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അമാലേക്ക്യരിൽ രക്ഷപ്പെട്ട് ശേഷിച്ചവരെ.’ നാശത്തിനുശേഷം അവശേഷിച്ചവരെ സൂചിപ്പിക്കുന്ന സമീപാർഥമുള്ള രണ്ടു പദങ്ങൾ എബ്രായത്തിൽ ചേർത്തുപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇന്നുവരെ അവർ അവിടെ കുടിയേറി പാർത്തു.’ ഈ ക്രിയയ്ക്ക് ഒരു സ്ഥലത്ത് താമസിക്കുക എന്നോ അവിടെ കുടിയേറുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: സംഹരിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ പ്രഹരിച്ച് വീഴ്ത്തുക എന്ന അർഥവും ഇവിടെ സൂചിപ്പിക്കുന്ന മാരകഫലവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: שְׁאֵרִית הַפְּלֵטָה
  choice: ശേഷിച്ചിരുന്ന അതിജീവിതരെ
  rationale: നാശത്തിൽനിന്ന് ശേഷിച്ചവരെ സൂചിപ്പിക്കുന്ന സമീപാർഥമുള്ള രണ്ടു എബ്രായ നാമങ്ങളുടെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לַעֲמָלֵק
  choice: അമാലേക്കിൽ
  rationale: അമാലേക്ക് എന്ന പേര് ഇവിടെ ആ പേരിൽ അറിയപ്പെടുന്ന ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാള വിഭക്തിപ്രയോഗം ആ ബന്ധം സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: וַיֵּשְׁבוּ
  choice: താമസിച്ചുവരുന്നു
  rationale: ישב എന്നതിന് താമസിക്കുക എന്നും കുടിയേറുക എന്നും അർഥമാകാം. ‘ഇന്നുവരെ’ എന്ന സമയപ്രയോഗത്തോടൊപ്പം, ആ താമസം ആഖ്യാതാവിന്റെ കാലംവരെ തുടർന്നുവെന്ന ആശയം നൽകുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: മുൻവാക്യഭാഗത്തിൽ പറഞ്ഞ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ലളിതമായ സ്ഥലക്രിയാവിശേഷണം.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: എബ്രായ ആഖ്യാനത്തിലെ പതിവായ സമയപ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
