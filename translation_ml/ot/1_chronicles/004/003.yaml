base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/003.yaml
  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
translation:
  language: ml
  text: 'ഏതാമിന്റെ പിതാവിന്റെ പുത്രന്മാർ[a] ഇവരായിരുന്നു: യിസ്രെയേൽ, യിശ്മാ, യിദ്ബാശ്. അവരുടെ സഹോദരിയുടെ പേര് ഹസ്സെലെൽപ്പോനി എന്നായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായമൂലത്തിൽ ‘പുത്രന്മാർ’ എന്ന പദം ഇല്ല; വാക്യത്തിലെ ഉദ്ദേശിച്ച ബന്ധം വ്യക്തമാക്കാനാണ് അത് ചേർത്തിരിക്കുന്നത്. ‘പിതാവ്’ എന്ന പദത്തിന് ഇവിടെ ‘പൂർവികൻ’ എന്നോ ‘സ്ഥാപകൻ’ എന്നോ അർത്ഥമാകാനും സാധ്യതയുണ്ട്.
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവരായിരുന്നു
  rationale: വംശാവലിയിൽ പേരുകളുടെ പട്ടിക അവതരിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി; തുടക്കത്തിലെ വാവ് ബന്ധസൂചകം മലയാളത്തിൽ പ്രത്യേകം പ്രകടിപ്പിക്കേണ്ടതില്ല.
- source_word: אֲבִי עֵיטָם
  choice: ഏതാമിന്റെ പിതാവ്
  rationale: ആവർത്തനാർത്ഥം ചേർക്കാതെ എബ്രായ നിർമ്മിതിയുടെ ഏറ്റവും നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുന്നു. ദിനവൃത്താന്തങ്ങളിലെ אָב എന്ന പദത്തിന് പിതാവ്, പൂർവികൻ, സ്ഥാപകൻ എന്നീ വിശാല വംശാവലിസംബന്ധമായ അർത്ഥങ്ങൾ ഉണ്ടാകാം; അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: יִזְרְעֶאל
  choice: യിസ്രെയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְיִשְׁמָא
  choice: യിശ്മാ
  rationale: പട്ടികയിലെ ബന്ധകമായ വാവ് മലയാളത്തിലെ വിരാമചിഹ്നക്രമത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി, വ്യക്തിനാമം എബ്രായത്തിൽനിന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וְיִדְבָּשׁ
  choice: യിദ്ബാശ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: וְשֵׁם אֲחוֹתָם
  choice: അവരുടെ സഹോദരിയുടെ പേര് … എന്നായിരുന്നു
  rationale: אֲחוֹתָם എന്നതിലെ ബഹുവചന ഉടമസ്ഥപ്രത്യയം ‘അവരുടെ’ എന്നു കൃത്യമായി നിലനിർത്തി; മലയാളത്തിലെ സ്വാഭാവിക നാമവാക്യക്രമം ഉപയോഗിച്ചു.
- source_word: הַצְלֶלְפּוֹנִי
  choice: ഹസെലെൽപോനി
  rationale: സ്ത്രീനാമത്തിന്റെ എബ്രായ ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; തുടക്കത്തിലെ הַ പേരിന്റെ ഘടകമായി നിലനിർത്തി.
theological_decisions:
- issue: എബ്രായ വാക്യത്തിൽ പട്ടികയിലെ ആളുകളെ സൂചിപ്പിക്കുന്ന ബന്ധപദം വ്യക്തമല്ല
  choice: ‘പുത്രന്മാർ’ എന്ന പദം വാക്യഘടന വ്യക്തമാക്കാൻ ചേർത്ത് അതിനെ അടിക്കുറിപ്പിൽ വെളിപ്പെടുത്തി
  alternative: '‘ഇവരാണ് ഏതാമിന്റെ പിതാവ്: യിസ്രെയേൽ…’ എന്ന അക്ഷരാർഥ രൂപം'
  rationale: മസോററ്റിക് പാഠത്തിലെ אֲבִי ഏകവചനവും പിന്നാലെ മൂന്നു പുരുഷന്മാരുടെ പട്ടികയും ചേർന്നാൽ മലയാളത്തിൽ വ്യാകരണപരമായി അസ്പഷ്ടമാകും. ബന്ധം തീർച്ചപ്പെടുത്തി മറച്ചുവയ്ക്കാതെ, ഇംഗ്ലീഷ് ഓഡിറ്റ് പാളിയിലെ ന്യായമായ പൂരിപ്പിക്കൽ സ്വീകരിക്കുകയും മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. പേരുകൾ എബ്രായരൂപത്തിന് സമീപമായി ലിപ്യന്തരിച്ചു; മൂലപാഠത്തിലെ അസാധാരണ വാക്യഘടന നിശ്ശബ്ദമായി പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
