lexical_decisions:
- source_word: שַׁלֻּם
  choice: ശല്ലൂം
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: בֵּן എന്ന നാമത്തോടുചേർന്ന മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം നേരിട്ട് ‘അവന്റെ മകൻ’ എന്നാണ് അർഥമാക്കുന്നത്. വംശാവലിയുടെ ആവർത്തനഘടനയും നിലനിർത്തി.
- source_word: מִבְשָׂם
  choice: മിബ്സാം
  rationale: വ്യക്തിനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִשְׁמָע
  choice: മിശ്മാ
  rationale: വ്യക്തിനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
