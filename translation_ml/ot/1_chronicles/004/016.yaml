source:
  edition: WLC
  text: וּ/בְנֵ֖י יְהַלֶּלְאֵ֑ל זִ֣יף וְ/זִיפָ֔ה תִּירְיָ֖א וַ/אֲשַׂרְאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/016.yaml
  text: 'And the sons of Jehallelel: Ziph[a], Ziphah, Tiria, and Asarel.'
translation:
  language: ml
  text: 'യെഹല്ലെലേലിന്റെ പുത്രന്മാർ: സീഫ്, സീഫാ, തീര്യാ, അസരേൽ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: בְּנֵי എന്നത് ‘പുത്രന്മാർ/മക്കൾ’ എന്നർഥമുള്ള construct plural ആണ്; വംശാവലിപ്പട്ടികയിലെ സ്വാഭാവിക മലയാളരീതിക്കായി തുടക്കത്തിലെ וּ പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: יְהַלֶּלְאֵל
  choice: യെഹല്ലെലേൽ
  rationale: മസോരറ്റിക് സ്വരചിഹ്നങ്ങളോടുകൂടിയ എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: זִיף
  choice: സീഫ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണാധിഷ്ഠിത മലയാള ലിപ്യന്തരണം.
- source_word: וְזִיפָה
  choice: സീഫാ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; പട്ടികയിൽ ബന്ധകത്തിന്റെ അർഥം വിരാമചിഹ്നങ്ങളും അവസാന ഇനത്തിനു മുമ്പുള്ള ബന്ധവും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: תִּירְיָא
  choice: തീര്യാ
  rationale: മസോരറ്റിക് രൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וַאֲשַׂרְאֵל
  choice: അസരേൽ
  rationale: മസോരറ്റിക് אֲשַׂרְאֵל എന്ന വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം; prefixed וַ പട്ടികയിലെ അവസാന ബന്ധമായി മലയാള വാക്യഘടനയിൽ സൂചിപ്പിക്കപ്പെടുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും മാന്യവുമായ വംശാവലി ശൈലി. പേരുകൾ WLC-യിലെ എബ്രായ രൂപത്തിൽനിന്ന് മലയാളത്തിലേക്ക് നേരിട്ട് ലിപ്യന്തരിച്ചു. ഇംഗ്ലീഷിലെ അക്ഷരവിന്യാസഭേദം മലയാള വിവർത്തനത്തിന് പ്രസക്തമല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
