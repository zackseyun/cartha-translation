  source_fidelity: WLC-യിലെ വാക്യം യെഹല്ലെലേലിന്റെ നാലു പുത്രന്മാരെ പട്ടികപ്പെടുത്തുന്നു. ‘പുത്രന്മാർ’ എന്ന പ്രയോഗവും യെഹല്ലെലേൽ, സീഫ്, സീഫാ, തീര്യാ, അസരേൽ എന്നീ ലിപ്യന്തരണങ്ങളും എബ്രായരൂപത്തോടു യോജിക്കുന്നു. തുടക്കത്തിലെയും പട്ടികയ്ക്കുള്ളിലെയും וְ മലയാളത്തിലെ കൊളോണും പട്ടികശൈലിയും വഴി സ്വാഭാവികമായി ഉൾക്കൊള്ളപ്പെട്ടിരിക്കുന്നു; അർഥനഷ്ടമില്ല.
