  text: וַ/יֵּלְכוּ֙ לִ/מְב֣וֹא גְדֹ֔ר עַ֖ד לְ/מִזְרַ֣ח הַ/גָּ֑יְא לְ/בַקֵּ֥שׁ מִרְעֶ֖ה לְ/צֹאנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ ആട്ടിൻകൂട്ടങ്ങൾക്കായി മേച്ചിൽസ്ഥലം അന്വേഷിക്കാൻ ഗെദോരിന്റെ പ്രവേശനഭാഗത്തേക്കു, താഴ്‌വരയുടെ കിഴക്കുഭാഗംവരെ പോയി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഗെദോരിലേക്കുള്ള സമീപനപാതയിലേക്ക്’; എബ്രായപദത്തിന് പ്രവേശനം, സമീപനപാത, അല്ലെങ്കിൽ പ്രവേശിക്കുന്ന സ്ഥലം എന്നിങ്ങനെ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘താഴ്‌വരയുടെ കിഴക്കുവരെ’ അല്ലെങ്കിൽ ‘താഴ്‌വരയുടെ കിഴക്കോട്ട്’; എബ്രായപ്രയോഗം സംക്ഷിപ്തമായ ഒരു ഭൂപ്രദേശസൂചനയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: അവർ പോയി
  rationale: הלך എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘പോയി’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ വിവർത്തനമാണ്.
- source_word: לִמְבוֹא
  choice: പ്രവേശനസ്ഥലംവരെയും
  rationale: מָבוֹא എന്ന പദത്തിന് പ്രവേശനം, സമീപനപാത, പ്രവേശിക്കുന്ന സ്ഥലം എന്നീ അർഥങ്ങൾ വരാം. സ്ഥലനാമത്തോടൊപ്പം ഇവിടെ എത്തിച്ചേരുന്ന പ്രവേശനപ്രദേശം എന്ന ഭൗമസൂചന നിലനിർത്തുന്നു.
- source_word: גְדֹר
  choice: ഗെദോർ
  rationale: ഇത് ഒരു സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: עַד
  choice: വരെയും
  rationale: ഇവിടെ കാലപരിധിയല്ല, സ്ഥലപരമായ എത്തിച്ചേരൽ/വ്യാപ്തിയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְמִזְרַח הַגָּיְא
  choice: താഴ്‌വരയുടെ കിഴക്കുഭാഗംവരെയും
  rationale: മൂലത്തിലെ സംക്ഷിപ്തമായ ഭൂപ്രദേശസൂചന കിഴക്കുഭാഗം എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ നൽകുന്നു; ‘താഴ്‌വരയുടെ കിഴക്ക്’ അല്ലെങ്കിൽ ‘താഴ്‌വരയുടെ കിഴക്കോട്ടു’ എന്ന സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְבַקֵּשׁ
  choice: അന്വേഷിച്ച്
  rationale: בקש എന്ന infinitive ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അന്വേഷിച്ച്’ എന്ന ക്രിയാവിശേഷണരൂപം ലക്ഷ്യം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: מִרְעֶה
  choice: മേച്ചിൽപ്പുറം
  rationale: കന്നുകാലികൾ മേയുന്ന സ്ഥലം എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְצֹאנָם
  choice: തങ്ങളുടെ ആട്ടിൻകൂട്ടങ്ങൾക്ക്
  rationale: צֹאן ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളാവുന്ന കൂട്ടപദമാണ്. മലയാളത്തിലെ ‘ആട്ടിൻകൂട്ടങ്ങൾ’ ഇനത്തെ അനാവശ്യമായി ചുരുക്കാതെ പൊതുവായ കൂട്ടാർഥം നൽകുന്നു.
