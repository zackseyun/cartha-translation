translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ഭൗമസൂചനകളുടെ അനിശ്ചിതത്വം പ്രധാനവാക്യത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും അടിക്കുറിപ്പുകളിൽ പകരസാധ്യതകൾ സംരക്ഷിക്കുകയും ചെയ്തു.
