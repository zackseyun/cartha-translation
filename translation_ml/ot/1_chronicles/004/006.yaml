  rationale: ലാമെദ് ഉപസർഗവും സർവനാമപ്രത്യയവും ഈ വംശാവലി പ്രയോഗത്തിൽ പുരുഷ രക്ഷിതാവിനെ സൂചിപ്പിക്കുന്നു; ബന്ധത്തെ സന്ദർഭത്തിനപ്പുറം നിർവചിക്കാതെ മൂലത്തിന്റെ ഘടന നിലനിർത്തുന്നു.
- source_word: נַעֲרָה
  choice: നയരാ
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; വാക്യത്തിന്റെ അവസാനത്തും ഇതേ രൂപം നിലനിർത്തി.
- source_word: אֶת ... וְאֶת ...
  choice: എന്നിവരെ
  rationale: ആവർത്തിച്ചുള്ള നേരിട്ടുള്ള കർമചിഹ്നത്തെ മലയാളത്തിലെ കർമവിഭക്തിയും പട്ടികയുടെ സമാപനപ്രയോഗവുംകൊണ്ട് സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: אֲחֻזָּם
  choice: അഹുസ്സാം
  rationale: ഹീബ്രു വ്യഞ്ജനദ്വിത്വം സൂചിപ്പിക്കുന്ന വ്യക്തിനാമ ലിപ്യന്തരണം.
- source_word: חֵפֶר
  choice: ഹേഫെർ
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തായി മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: תֵּימְנִי
  choice: തേമനി
  rationale: രൂപം വിശേഷണാർഥമുള്ളതാകാമെങ്കിലും ഈ വംശാവലിപ്പട്ടികയിൽ വ്യക്തിനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הָאֲחַשְׁתָּרִי
  choice: ഹാ-അഹശ്താരി
  rationale: ഹീബ്രുവിലെ മുൻചേർന്ന നിർദേശക ഘടകമായ הָ־ പേരിന്റെ സ്ഥിരഘടകമായിരിക്കാം; അത് ദൃശ്യമാക്കിക്കൊണ്ട് പേരായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֵלֶּה
  choice: ഇവർ
  rationale: മുമ്പു പറഞ്ഞ വ്യക്തികളെ ചൂണ്ടിക്കാണിക്കുന്ന സ്വാഭാവിക മലയാള ബഹുവചന സർവനാമം.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലി സന്ദർഭത്തിൽ ആൺമക്കളെയാണ് പദം വ്യക്തമാക്കുന്നത്; പൊതുവായ ‘മക്കൾ’ എന്നതിലേക്കു മൃദൂകരിച്ചിട്ടില്ല.
