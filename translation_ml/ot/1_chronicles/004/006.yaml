  yaml_path: translation/ot/1_chronicles/004/006.yaml
  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
translation:
  language: ml
  text: നഅരാ അവന് അഹുസ്സാം, ഹേഫെർ, തേമനി[a], ഹാ-അഹശ്താരി[b] എന്നിവരെ പ്രസവിച്ചു. ഇവർ നഅരായുടെ പുത്രന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തേമനി’ എന്ന രൂപത്തിന് ‘തേമന്യൻ’ അല്ലെങ്കിൽ ‘തെക്കൻ’ എന്ന വിശേഷണാർഥവും സാധ്യമാണ്; എന്നാൽ ഈ വംശാവലിയിൽ അതിനെ വ്യക്തിനാമമായി നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഹാ-അഹശ്താരി’ എന്ന പേര് ‘അഹശ്താരി’ എന്നും ലിപ്യന്തരണം ചെയ്യാം. ഹീബ്രു രൂപത്തിലെ മുൻചേർന്ന നിർദേശകഘടകം പേരിന്റെ സ്ഥിരഭാഗമായി മാറിയിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
