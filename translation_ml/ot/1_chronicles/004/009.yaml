id: 1CH.4.9
reference: 1 Chronicles 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י יַעְבֵּ֔ץ נִכְבָּ֖ד מֵ/אֶחָ֑י/ו וְ/אִמּ֗/וֹ קָרְאָ֨ה שְׁמ֤/וֹ יַעְבֵּץ֙ לֵ/אמֹ֔ר כִּ֥י יָלַ֖דְתִּי בְּ/עֹֽצֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
translation:
  language: ml
  text: യാബേസ് തന്റെ സഹോദരന്മാരെക്കാൾ മാന്യനായിരുന്നു. അവന്റെ അമ്മ അവന് യാബേസ്[a] എന്നു പേരിട്ടു. “ഞാൻ അവനെ വേദനയോടെ[b] പ്രസവിച്ചതുകൊണ്ടാണ്,” എന്ന് അവൾ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യാബേസ്” എന്ന പേര്, അമ്മയുടെ വിശദീകരണത്തിൽ വരുന്ന “വേദന” അല്ലെങ്കിൽ “ദുഃഖം” എന്നർഥമുള്ള ഹീബ്രായ പദത്തോടു ശബ്ദസാമ്യമുള്ളതാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ഞാൻ അവനെ ദുഃഖത്തോടെ പ്രസവിച്ചതുകൊണ്ടാണ്” എന്നും പരിഭാഷപ്പെടുത്താം. עֹצֶב എന്ന ഹീബ്രായ പദത്തിന് വേദന, ദുഃഖം, കഷ്ടത എന്നീ അർഥങ്ങൾ വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: വാക്യാരംഭത്തിലെ ഹീബ്രായ ആഖ്യാനരൂപം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഭൂതകാല പ്രസ്താവനയായി നൽകി; മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേക കാലസൂചകം ചേർത്തിട്ടില്ല.
- source_word: יַעְבֵּץ
  choice: യാബേസ്
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; പേരും വേദന/ദുഃഖം സൂചിപ്പിക്കുന്ന പദവും തമ്മിലുള്ള ഹീബ്രായ ശബ്ദസാമ്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: נִכְבָּד מֵאֶחָיו
  choice: തന്റെ സഹോദരന്മാരെക്കാൾ മാന്യനായിരുന്നു
  rationale: כבד എന്ന പദത്തിന്റെ ‘മാന്യൻ, ആദരണീയൻ’ എന്ന അർഥവും מִן നൽകുന്ന താരതമ്യവും നേരിട്ട് നിലനിർത്തുന്നു. പദം നിർബന്ധമായും കർമണിപ്രയോഗമല്ലാത്തതിനാൽ ‘ബഹുമാനിക്കപ്പെട്ടവൻ’ എന്നു മാത്രം പരിമിതപ്പെടുത്തിയില്ല.
- source_word: וְאִמּוֹ קָרְאָה שְׁמוֹ
  choice: അവന്റെ അമ്മ അവന് … എന്നു പേരിട്ടു
  rationale: ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന ഹീബ്രായ നാമകരണശൈലിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിലെ ‘പേരിട്ടു’ എന്ന പ്രയോഗത്തിൽ നൽകി.
- source_word: לֵאמֹר
  choice: എന്ന് അവൾ പറഞ്ഞു
  rationale: അമ്മ നൽകിയ പേരിന്റെ വിശദീകരണം അവതരിപ്പിക്കുന്ന ഹീബ്രായ രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ധരണിപ്രയോഗമായി നൽകി.
- source_word: כִּי
  choice: …കൊണ്ടാണ്
  rationale: പേരിടലിനുള്ള കാരണം വ്യക്തമാക്കുന്ന കാരണാർഥം മലയാളത്തിൽ സംവാദസഹജമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יָלַדְתִּי
  choice: ഞാൻ അവനെ … പ്രസവിച്ചു
  rationale: ഒന്നാംപുരുഷ ഏകവചനമായ ‘ഞാൻ പ്രസവിച്ചു’ എന്ന അർഥം നിലനിർത്തി; പ്രസവിക്കപ്പെട്ട ശിശുവിനെ സൂചിപ്പിക്കുന്ന ‘അവനെ’ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കി.
- source_word: בְּעֹצֶב
  choice: വേദനയോടെ
  rationale: עֹצֶב എന്ന പദത്തിന് വേദന, ദുഃഖം, കഷ്ടത എന്നീ അർഥവ്യാപ്തികളുണ്ട്. പ്രസവസന്ദർഭത്തിൽ ‘വേദനയോടെ’ ഏറ്റവും സ്വാഭാവികം; ദുഃഖം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഹീബ്രായ നാമകരണവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കി; പേരിലെ ശബ്ദാലങ്കാരവും עֹצֶב എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
