  text: וְ/ק֣וֹץ הוֹלִ֔יד אֶת עָנ֖וּב וְ/אֶת הַ/צֹּבֵבָ֑ה וּ/מִשְׁפְּח֥וֹת אֲחַרְחֵ֖ל בֶּן הָרֽוּם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/008.yaml
  text: Koz fathered Anub[a], Hazzobebah[b], and the families of Aharhel son of Harum.
translation:
  language: ml
  text: കോസ് ആനൂബിനും ഹസ്സോബേബായ്ക്കും[a] ഹാരൂമിന്റെ മകനായ അഹർഹേലിന്റെ കുടുംബങ്ങൾക്കും[b] പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പേരിനു മുൻചേർന്ന നിർദ്ദിഷ്ടപദോപസർഗം ലിപ്യന്തരണത്തിൽ ഉൾപ്പെടുത്താതിരുന്നാൽ ‘സോബേബാ’ എന്നും വായിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ വംശാവലിസന്ദർഭത്തിൽ ‘കുടുംബങ്ങൾ’ എന്നത് ‘കുലങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹץ
  choice: കോസ്
  rationale: വ്യക്തിനാമം മസോറെറ്റിക് വ്യഞ്ജനരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു; ഇവിടെ നിർദ്ദിഷ്ടപദോപസർഗം ഇല്ലാത്തതിനാൽ ‘ഹക്കോസ്’ സ്വീകരിച്ചില്ല.
- source_word: הוֹלִ֔יד
  choice: പിതാവായി
  rationale: വംശാവലിസന്ദർഭത്തിൽ ഹിഫീൽ രൂപം ജനിപ്പിക്കൽ അഥവാ പൂർവികബന്ധം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗം.
- source_word: עָנ֖וּב
  choice: ആനൂബ്
  rationale: മസോറെറ്റിക് സ്വരീകരണം അനുസരിച്ചുള്ള വ്യക്തിനാമ ലിപ്യന്തരണം.
- source_word: הַ/צֹּבֵבָ֑ה
  choice: ഹസ്സോബേബ
  rationale: എബ്രായരൂപത്തിലെ മുൻചേർന്ന നിർദ്ദിഷ്ടപദോപസർഗത്തിന്റെ h-ശബ്ദവും ദ്വിത്വ z-ശബ്ദവും പേരിന്റെ ലിപ്യന്തരണത്തിൽ നിലനിർത്തി.
- source_word: וּ/מִשְׁפְּח֥וֹת
  choice: കുടുംബങ്ങൾക്കും
  rationale: വംശാവലിയിൽ കുടുംബവിഭാഗങ്ങളെയോ കുലങ്ങളെയോ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് സുതാര്യമായ ‘കുടുംബങ്ങൾ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
- source_word: אֲחַרְחֵ֖ל
  choice: അഹർഹേൽ
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തിൽനിന്ന് നേരിട്ട് ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן
  choice: മകനായ
  rationale: അഹർഹേലിനെയും ഹാരൂമിനെയും ബന്ധിപ്പിക്കുന്ന സാധാരണ വംശാവലിപദം.
- source_word: הָרֽוּם
  choice: ഹാരൂം
  rationale: മസോറെറ്റിക് സ്വരീകരണത്തെ പ്രതിഫലിപ്പിക്കുന്ന വ്യക്തിനാമ ലിപ്യന്തരണം; ‘ഹാരാം’ എന്ന മറ്റൊരു രൂപം സ്വീകരിച്ചില്ല.
