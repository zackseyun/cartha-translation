  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. എബ്രായ വാക്യഘടനയിലെ മൂന്ന് സമാന്തര ഘടകങ്ങളും ‘-ക്കും’ ഘടനയിലൂടെ നിലനിർത്തി; വ്യക്തിനാമങ്ങൾ മസോറെറ്റിക് സ്വരീകരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ നൽകി.
