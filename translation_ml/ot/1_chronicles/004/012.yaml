  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶשְׁתּ֗וֹן הוֹלִ֞יד אֶת בֵּ֤ית רָפָא֙ וְ/אֶת פָּסֵ֔חַ וְ/אֶת תְּחִנָּ֖ה אֲבִ֣י עִ֣יר נָחָ֑שׁ אֵ֖לֶּה אַנְשֵׁ֥י רֵכָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
translation:
  language: ml
  text: എശ്തോൻ ബേത്ത്-രാഫാവിനും പാസേഹിനും ഇർ-നാഹാശിന്റെ[b] പിതാവായ[a] തെഹിന്നായ്ക്കും പിതാവായി. ഇവർ റെഖായിലെ പുരുഷന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇർ-നാഹാശിന്റെ സ്ഥാപകൻ.’ വംശാവലികളിൽ ‘പിതാവ്’ എന്നതിന് നേരിട്ടുള്ള ജൈവിക പിതാവ് എന്നതിനു പുറമേ പൂർവികൻ അല്ലെങ്കിൽ സ്ഥാപകൻ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഇർ-നാഹാശ് എന്നതിന് ‘നാഹാശിന്റെ നഗരം’ എന്ന അർഥമാകാം; എന്നാൽ ഇവിടെ അത് ഒരു സ്ഥലനാമമായി ഉപയോഗിച്ചിരിക്കുന്നതാണ് സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ילד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഒരാളെ ജനിപ്പിക്കുകയോ അയാളുടെ പിതാവാകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പിതാവായി’ എന്നത് പുരാതനശൈലിയിലുള്ള ‘ജനിപ്പിച്ചു’ എന്ന പ്രയോഗത്തെക്കാൾ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: בֵּית רָפָא
  choice: ബേത്ത്-രാഫാ
  rationale: സമാന്തരമായി വരുന്ന വ്യക്തിനാമങ്ങളുടെ പട്ടികയിൽ ഇത് ഒരു സംയുക്ത നാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ‘രാഫായുടെ ഭവനം’ എന്നു വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: פָּסֵחַ
  choice: പാസേഹ്
  rationale: ഇത് വ്യക്തിനാമമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: תְּחִנָּה
  choice: തെഹിന്നാ
  rationale: മറ്റിടങ്ങളിൽ ഈ രൂപത്തിന് ‘അപേക്ഷ’ എന്ന പൊതുനാമാർഥമുണ്ടെങ്കിലും ഇവിടെ വ്യക്തിനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲבִי עִיר נָחָשׁ
  choice: ഇർ-നാഹാശിന്റെ പിതാവായ
  rationale: אֲבִי എന്നത് നേരിട്ടുള്ള പിതാവിനെയോ ഒരു വംശത്തിന്റെയോ കുടിയിരുപ്പിന്റെയോ സ്ഥാപകനെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ഹീബ്രു ബന്ധപ്രയോഗം നിലനിർത്തി; עִיר נָחָשׁ നാമസന്ദർഭത്തിൽ സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֵלֶּה אַנְשֵׁי רֵכָה
  choice: ഇവർ റെഖായിലെ പുരുഷന്മാരായിരുന്നു
  rationale: אַנְשֵׁי എന്നതിന്റെ ഔപചാരിക ബന്ധം ‘പുരുഷന്മാർ’ എന്നു നിലനിർത്തി; ഇത് റെഖാ എന്ന സ്ഥലത്തെയോ കൂട്ടത്തെയോ സംബന്ധിച്ചവരെ സൂചിപ്പിക്കുന്നു. വംശാവലിവിവരണത്തിന് യോജിച്ച് ഭൂതകാലം ഉപയോഗിച്ചു.
- source_word: רֵכָה
  choice: റെഖാ
  rationale: വ്യക്തിനാമമോ സ്ഥലനാമമോ ആയതിനാൽ ഹീബ്രു രൂപത്തോട് അടുത്തായി ലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: אֲבִי എന്ന ബന്ധപദത്തിന്റെ പരിധി
  choice: മുഖ്യപാഠത്തിൽ ‘പിതാവ്’ എന്നു നിലനിർത്തി, കുറിപ്പിൽ ‘സ്ഥാപകൻ’ എന്ന സാധ്യത നൽകി.
  alternative: ‘ഇർ-നാഹാശിന്റെ സ്ഥാപകൻ’
  rationale: വംശാവലികളിൽ ‘പിതാവ്’ എന്ന പദത്തിന് ജൈവിക പിതൃത്വത്തേക്കാൾ വിശാലമായ അർഥമുണ്ടാകാം. സന്ദർഭം ഏത് അർഥമാണെന്ന് നിർണായകമായി വ്യക്തമാക്കാത്തതിനാൽ ആ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. വ്യക്തി-സ്ഥലനാമങ്ങൾ അർത്ഥവിവർത്തനം ചെയ്യാതെ ഹീബ്രു രൂപത്തോട് അടുത്തായി ലിപ്യന്തരണം ചെയ്തു. ‘പുരുഷന്മാർ’ എന്നത് മൂലത്തിലെ אַנְשֵׁי എന്ന പദത്തിന്റെ ഔപചാരിക ബന്ധം നിലനിർത്തുന്നു.
