source:
  edition: WLC
  text: וּ/מֵ/הֶ֣ם מִן בְּנֵ֣י שִׁמְע֗וֹן הָלְכוּ֙ לְ/הַ֣ר שֵׂעִ֔יר אֲנָשִׁ֖ים חֲמֵ֣שׁ מֵא֑וֹת וּ/פְלַטְיָ֡ה וּ֠/נְעַרְיָה וּ/רְפָיָ֧ה וְ/עֻזִּיאֵ֛ל בְּנֵ֥י יִשְׁעִ֖י בְּ/רֹאשָֽׁ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
translation:
  language: ml
  text: അവരിൽ ചിലർ—ശിമെയോന്റെ പുത്രന്മാരിൽനിന്നുള്ള അഞ്ഞൂറു പുരുഷന്മാർ—സേയീർ പർവതത്തിലേക്കു പോയി; യിശിയുടെ പുത്രന്മാരായ പെലത്യാവ്, നെഅര്യാവ്, റെഫായാവ്, ഉസ്സീയേൽ എന്നിവർ അവരുടെ തലവന്മാരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, “അവരുടെ തലയിൽ.” ഈ ഹീബ്രു പ്രയോഗം പെലത്യാവും നെഅര്യാവും റെഫായാവും ഉസ്സീയേലും ആ സംഘത്തെ നയിച്ചിരുന്നുവെന്നു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם מִן בְּנֵי שִׁמְעוֹן
  choice: ശിമെയോന്റെ പുത്രന്മാരിൽ ചിലർ
  rationale: מֵהֶם എന്നതിലെ അംശസൂചനയും בְּנֵי שִׁמְעוֹן എന്ന വംശാവലി പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָלְכוּ לְהַר שֵׂעִיר
  choice: സേയീർപർവതത്തിലേക്കു പോയി
  rationale: സാധാരണ ഗതിവാചകമായ הָלְכוּ-നെ അലങ്കാരമില്ലാതെ ‘പോയി’ എന്നും സ്ഥലനാമത്തെ പരമ്പരാഗത പർവതനാമമായും നൽകുന്നു.
- source_word: אֲנָשִׁים חֲמֵשׁ מֵאוֹת
  choice: അഞ്ഞൂറു പുരുഷന്മാർ
  rationale: സംഘത്തിന്റെ എണ്ണത്തെ വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള സംഖ്യാനിർദേശം; സൈനികസേന എന്ന അധിക അർത്ഥം ചേർക്കുന്നില്ല.
- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל
  choice: പെലത്യാവ്, നെഅര്യാവ്, റെഫായാവ്, ഉസ്സീയേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമങ്ങളുടെ സ്വരീകരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּנֵי יִשְׁעִי
  choice: യിശിയുടെ പുത്രന്മാരായ
  rationale: നാലുപേരുടെയും വംശപരമായ തിരിച്ചറിയൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּרֹאשָׁם
  choice: അവരുടെ നായകരായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ തലയിൽ/മുമ്പിൽ’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ നേതൃത്വത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ ആശയം നൽകുന്നു.
