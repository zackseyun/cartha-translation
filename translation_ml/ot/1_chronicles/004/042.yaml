  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി. വംശാവലി ഭാഷ നിലനിർത്തിയിട്ടുണ്ട്; ഹീബ്രു വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി പുനഃക്രമീകരിച്ചു.
