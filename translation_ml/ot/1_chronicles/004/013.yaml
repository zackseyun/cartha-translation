base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/013.yaml
  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
translation:
  language: ml
  text: 'കെനാസിന്റെ പുത്രന്മാർ: ഒത്നീയേലും സെരായാവും; ഒത്നീയേലിന്റെ പുത്രന്മാർ: ഹഥത്ത്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְנַז
  choice: കെനാസിന്റെ പുത്രന്മാർ
  rationale: בְּנֵי എന്ന വംശാവലി-നിർമാണരൂപം ഇവിടെ നേരിട്ട് ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി. വാക്യാരംഭത്തിലെ וּ സ്വാഭാവികമായ മലയാള വംശാവലി ശൈലിയിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു പ്രകടിപ്പിക്കേണ്ടതില്ല.
- source_word: עָתְנִיאֵל
  choice: ഒത്നീയേൽ
  rationale: എബ്രായ ഉച്ചാരണരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וּשְׂרָיָה
  choice: സെരായാവ്
  rationale: മലയാള ബൈബിൾ പേരുകളുടെ സ്വാഭാവിക രൂപശൈലി പിന്തുടർന്ന്, എബ്രായ שְׂרָיָה എന്ന പേരിന്റെ ലിപ്യന്തരണം.
- source_word: וּבְנֵי עָתְנִיאֵל
  choice: ഒത്നീയേലിന്റെ പുത്രൻ
  rationale: എബ്രായത്തിൽ ‘പുത്രന്മാർ’ എന്ന ബഹുവചനരൂപമാണെങ്കിലും തുടർന്ന് ഒരേയൊരു പേര് മാത്രമാണ് വരുന്നത്; അർത്ഥസുതാര്യതയ്ക്കായി മലയാളത്തിൽ ഏകവചനം ഉപയോഗിച്ചു.
- source_word: חֲתַת
  choice: ഹഥത്ത്
  rationale: എബ്രായ പേരിന്റെ ശബ്ദഘടനയോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാള വംശാവലി ശൈലി. പേരുകൾ മൂല എബ്രായരൂപത്തോട് ചേർത്ത് ലിപ്യന്തരിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
