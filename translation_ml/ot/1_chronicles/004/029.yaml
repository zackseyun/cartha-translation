  text: and in Bilhah[a], and in Ezem, and in Tolad.
translation:
  language: ml
  text: ബിൽഹായിലും[a] ഏസെമിലും തോലാദിലും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബിൽഹായിൽ … ഏസെമിൽ … തോലാദിൽ.’ പട്ടണങ്ങളുടെ പട്ടികയിൽ എബ്രായയിലെ בְּ എന്ന സ്ഥലസൂചക ഉപസർഗം ‘-ഇൽ’ എന്നോ ‘-യിൽ’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בִלְהָה
  choice: ബിൽഹായിലും
  rationale: വാവിനെ ‘-ഉം’ എന്നും בְּ എന്ന സ്ഥലസൂചക ഉപസർഗത്തെ ‘-ഇൽ’ എന്നും സ്വാഭാവികമായ മലയാള സംയുക്തരൂപത്തിൽ നൽകി. בִלְהָה എന്ന സ്ഥലനാമം ‘ബിൽഹാ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וּ/בְ/עֶצֶם
  choice: ഏസെമിലും
  rationale: പട്ടണങ്ങളുടെ പട്ടികയിലെ ആവർത്തിതമായ וּבְ־ ഘടനയെ ‘-ഇലും’ എന്നു നിലനിർത്തി. עֶצֶם ഇവിടെ സ്ഥലനാമമായതിനാൽ ‘ഏസെം’ എന്നു ലിപ്യന്തരിച്ചു; വിഭക്തി ചേരുമ്പോൾ ‘ഏസെമിലും’ ആകുന്നു.
- source_word: וּ/בְ/תוֹלָד
  choice: തോലാദിലും
  rationale: മുൻപുള്ള സ്ഥലനാമങ്ങളോടുള്ള സമാന്തരഘടന സംരക്ഷിച്ച് וּבְ־ എന്നത് ‘-ഇലും’ എന്നു നൽകി. תוֹלָד എന്ന സ്ഥലനാമം ‘തോലാദ്’ എന്നു ലിപ്യന്തരിച്ചു; വിഭക്തി ചേരുമ്പോൾ ‘തോലാദിലും’ ആകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഇത് മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ സ്വതന്ത്രമായി ‘അവർ പാർത്തു’ എന്ന ക്രിയ ചേർത്തിട്ടില്ല. സ്ഥലനാമങ്ങളോട് ‘-ഇലും’ ചേർത്തത് എബ്രായയിലെ ആവർത്തിതമായ conjunction-plus-preposition ഘടന സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
