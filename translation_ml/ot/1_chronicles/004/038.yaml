  text: אֵ֚לֶּה הַ/בָּאִ֣ים בְּ/שֵׁמ֔וֹת נְשִׂיאִ֖ים בְּ/מִשְׁפְּחוֹתָ֑/ם וּ/בֵית֙ אֲב֣וֹתֵי/הֶ֔ם פָּרְצ֖וּ לָ/רֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/038.yaml
  text: These[a], who were mentioned by name, were leaders in their clans[b], and their ancestral houses increased greatly.
translation:
  language: ml
  text: പേരുപ്രകാരം രേഖപ്പെടുത്തിയ ഈ ആളുകൾ തങ്ങളുടെ വംശങ്ങളിലെ നേതാക്കന്മാരായിരുന്നു; അവരുടെ പിതൃഭവനങ്ങൾ വളരെയേറെ പെരുകി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പേരുകളോടെ വന്ന ഈ ആളുകൾ.” എബ്രായ കൃദന്തരൂപത്തിന്റെ അക്ഷരാർഥം “വരുന്നവർ” എന്നാണ്; എന്നാൽ ഇവിടെ വംശാവലിപ്പട്ടികയിൽ പേരോടെ ചേർക്കപ്പെട്ടവരെയോ രേഖപ്പെടുത്തിയവരെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം. എബ്രായത്തിൽ അവരുടെ പിതാക്കന്മാരുടെ ഭവനം ‘അനേകതയിലേക്കു പൊട്ടിപ്പരന്നു’ എന്ന ചിത്രാത്മക പ്രയോഗവുമുണ്ട്; അത് വലിയ തോതിലുള്ള വർധനയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവർ
  rationale: മുൻപുള്ള വംശാവലിയിൽ പേരെടുത്തുപറഞ്ഞ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമം; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַבָּאִים בְּשֵׁמוֹת
  choice: പേരുപറഞ്ഞ് രേഖപ്പെടുത്തിയിരുന്ന
  rationale: בוא എന്ന ക്രിയയുടെ കൃദന്തരൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘വരുന്നവർ’ എന്നാണെങ്കിലും, പേരുകളുടെ പട്ടികയെന്ന സന്ദർഭത്തിൽ പേരോടെ ചേർക്കപ്പെട്ടവരെയോ രേഖപ്പെടുത്തിയവരെയോ സൂചിപ്പിക്കുന്നു; അടിക്കുറിപ്പിൽ അക്ഷരാർഥസാധ്യത നിലനിർത്തുന്നു.
- source_word: נְשִׂיאִים
  choice: നേതാക്കന്മാർ
  rationale: ഗോത്രത്തിലോ വംശത്തിലോ ഉന്നതസ്ഥാനമുള്ള നേതൃത്വത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രഭുക്കന്മാർ’ എന്നത് അനാവശ്യമായ രാജകീയ ഭാവം നൽകാം.
- source_word: בְּמִשְׁפְּחוֹתָם
  choice: തങ്ങളുടെ വംശങ്ങളിലെ
  rationale: ഇവിടെ מִשְׁפָּחָה ആധുനിക അണുകുടുംബത്തെക്കാൾ വിശാലമായ രക്തബന്ധകൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘വംശങ്ങൾ’ ആ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּבֵית אֲבוֹתֵיהֶם
  choice: അവരുടെ പിതൃഭവനങ്ങൾ
  rationale: പിതൃവഴിയിലുള്ള കുടുംബ-വംശഘടകത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക വംശാവലിപദപ്രയോഗം; ‘പിതൃഭവനങ്ങൾ’ രൂപകവും വംശപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: פָּרְצוּ לָרֹב
  choice: അത്യന്തം പെരുകി
  rationale: פָּרַץ എന്നത് പൊട്ടിപ്പുറപ്പെടുക/വ്യാപിക്കുക എന്ന ചിത്രാത്മകതയോടെ ഇവിടെ സംഖ്യാവർധനയെയും സമൃദ്ധമായ വളർച്ചയെയും സൂചിപ്പിക്കുന്നു; לָרֹב അതിന്റെ വ്യാപ്തി ശക്തിപ്പെടുത്തുന്നു.
