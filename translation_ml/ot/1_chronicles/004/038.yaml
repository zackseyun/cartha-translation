    issue: മുഖ്യവാക്യത്തിലെ ‘പേരുപറഞ്ഞ് രേഖപ്പെടുത്തിയിരുന്ന’ എന്ന ശൈലി
    rationale: ഇത് അല്പം അസ്വാഭാവികവും അനാവശ്യമായ തുടർച്ചാഭാവമുള്ളതുമാണ്. ‘പേരുപ്രകാരം രേഖപ്പെടുത്തിയ’ എന്നത് בְּשֵׁמוֹת എന്ന പ്രയോഗത്തെ കൂടുതൽ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
