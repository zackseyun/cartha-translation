- from: പേരുപറഞ്ഞ് രേഖപ്പെടുത്തിയിരുന്ന ഇവർ[a] തങ്ങളുടെ വംശങ്ങളിലെ നേതാക്കന്മാരായിരുന്നു; അവരുടെ പിതൃഭവനങ്ങൾ അത്യന്തം പെരുകി[b].
  to: പേരുപ്രകാരം രേഖപ്പെടുത്തിയ ഈ ആളുകൾ തങ്ങളുടെ വംശങ്ങളിലെ നേതാക്കന്മാരായിരുന്നു; അവരുടെ പിതൃഭവനങ്ങൾ വളരെയേറെ പെരുകി.[a]
  rationale: പ്രധാനവാക്യം കൂടുതൽ സ്വാഭാവികമാക്കുകയും, ‘അക്ഷരാർഥത്തിൽ’ എന്ന അവകാശവാദം കൃത്യമാക്കാൻ അടിക്കുറിപ്പ് പുനരാഖ്യാനം ചെയ്യുകയും ചെയ്തു. മുൻകരടിലെ a, b എന്നീ ആശയങ്ങൾ ഒരു ഏകീകൃത അടിക്കുറിപ്പിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു; ഇതിലൂടെ ഹീബ്രു കൃദന്തരൂപത്തിന്റെ ബദൽ വായനയും פָּרְצוּ לָרֹב എന്ന ചിത്രാത്മക പ്രയോഗവും നിലനിൽക്കുന്നു.
