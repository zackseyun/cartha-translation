translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലി-ശൈലി. ‘പിതൃഭവനങ്ങൾ’ എന്നത് എബ്രായ സാമൂഹിക ഘടകത്തിന്റെ സാങ്കേതിക ഭാവം നിലനിർത്തുന്നു; അപരിചിതത്വം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
