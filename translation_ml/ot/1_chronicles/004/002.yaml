translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി സ്വീകരിച്ചു. എബ്രായ വാക്യഘടനയുടെ ആവർത്തനം നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ആദ്യഘടകം ‘ശോബാലിന്റെ മകനായ രെയായാ’ എന്ന് ക്രമപ്പെടുത്തി. ഇംഗ്ലീഷ് consultation text-ൽ [a] അടയാളം ‘Jahath’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് מִשְׁפְּחֹות എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ‘കുലങ്ങൾ’ എന്നതിനുശേഷം ശരിയായ സ്ഥാനത്ത് ചേർത്തു.
