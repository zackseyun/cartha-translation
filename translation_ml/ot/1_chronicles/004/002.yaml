source:
  edition: WLC
  text: וּ/רְאָיָ֤ה בֶן שׁוֹבָל֙ הוֹלִ֣יד אֶת יַ֔חַת וְ/יַ֣חַת הֹלִ֔יד אֶת אֲחוּמַ֖י וְ/אֶת לָ֑הַד אֵ֖לֶּה מִשְׁפְּח֥וֹת הַ/צָּֽרְעָתִֽי־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/002.yaml
  text: Reaiah son of Shobal fathered Jahath[a], and Jahath fathered Ahumai and Lahad. These were the clans of the Zorathites.
translation:
  language: ml
  text: ശോബാലിന്റെ മകനായ രെയായാ യഹത്തിനെ ജനിപ്പിച്ചു; യഹത്ത് അഹൂമായിയെയും ലഹദിനെയും ജനിപ്പിച്ചു. ഇവ സോരാത്യരുടെ കുലങ്ങളായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുടുംബങ്ങൾ.” എബ്രായപദം വിപുലമായ ബന്ധുഗണങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאָיָה
  choice: രെയായാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തുന്നു; പേര് അർഥവിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: בֶן שׁוֹבָל
  choice: ശോബാലിന്റെ മകനായ
  rationale: വംശാവലിയിൽ בֶן എന്നതിന്റെ നേരിട്ടുള്ള ബന്ധസൂചനയായ ‘മകൻ’ നിലനിർത്തുന്നു.
- source_word: הוֹלִיד / הֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലികളിൽ ഹിഫീൽ രൂപം പിതാവെന്ന നിലയിൽ സന്താനോത്പത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: יַחַת
  choice: യഹത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲחוּמַי
  choice: അഹൂമായി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: לָהַד
  choice: ലഹദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֵלֶּה
  choice: ഇവർ
  rationale: മുമ്പ് പരാമർശിച്ച വ്യക്തികളിലേക്കു ചൂണ്ടുന്നതിനാൽ മലയാളത്തിൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ബഹുവചന സർവനാമം ഉപയോഗിച്ചു.
- source_word: מִשְׁפְּחֹות
  choice: കുലങ്ങൾ
  rationale: ഗോത്രവംശാവലി പശ്ചാത്തലത്തിൽ അടുത്ത കുടുംബത്തെക്കാൾ വിപുലമായ ബന്ധുഗണങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുലങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: הַצָּרְעָתִי
  choice: സോരാത്യർ
  rationale: സോരാ എന്ന സ്ഥലത്തെയോ ജനവിഭാഗത്തെയോ സംബന്ധിക്കുന്ന എബ്രായ ജനനാമത്തിന്റെ മലയാളരൂപം.
