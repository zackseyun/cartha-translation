- from: ശോബാലിന്റെ മകനായ രെയായാ യഹത്തിനെ ജനിപ്പിച്ചു; യഹത്ത് അഹൂമായിയെയും ലഹദിനെയും ജനിപ്പിച്ചു. ഇവരായിരുന്നു സോരാത്യരുടെ കുലങ്ങൾ.[a]
  to: ശോബാലിന്റെ മകനായ രെയായാ യഹത്തിനെ ജനിപ്പിച്ചു; യഹത്ത് അഹൂമായിയെയും ലഹദിനെയും ജനിപ്പിച്ചു. ഇവ സോരാത്യരുടെ കുലങ്ങളായിരുന്നു.[a]
