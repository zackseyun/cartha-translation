id: 1CH.4.20
reference: 1 Chronicles 4:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֣י שִׁימ֔וֹן אַמְנ֣וֹן וְ/רִנָּ֔ה בֶּן חָנָ֖ן ו/תולון וּ/בְנֵ֣י יִשְׁעִ֔י זוֹחֵ֖ת וּ/בֶן זוֹחֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/020.yaml
  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
translation:
  language: ml
  text: 'ശിമോന്റെ പുത്രന്മാർ: അമ്നോൻ, റിന്നാ, ബെൻ-ഹാനാൻ[a], തിലോൻ. യിശിയുടെ പുത്രന്മാർ: സോഹേത്ത്, ബെൻ-സോഹേത്ത്[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബെൻ-ഹാനാൻ’ എന്നത് ‘ഹാനാന്റെ മകൻ’ എന്നും മനസ്സിലാക്കാം; എന്നാൽ ഈ വംശാവലിപ്പട്ടികയിൽ അതൊരു വ്യക്തിനാമമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: ‘ബെൻ-സോഹേത്ത്’ എന്നത് ‘സോഹേത്തിന്റെ മകൻ’ എന്നും മനസ്സിലാക്കാം; എന്നാൽ ഈ വംശാവലിപ്പട്ടികയിൽ അതൊരു വ്യക്തിനാമമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁימוֹן
  choice: ശിമോന്റെ പുത്രന്മാർ
  rationale: בְּנֵי എന്ന വംശാവലി പ്രയോഗം പുരുഷസന്തതികളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി. വാക്യാരംഭത്തിലെ וּ സ്വാഭാവികമായ മലയാള വംശാവലിപ്പട്ടികയിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർക്കാതെ അവതരിപ്പിച്ചു.
- source_word: אַמְנוֹן וְרִנָּה
  choice: അമ്നോൻ, റിന്നാ
  rationale: രണ്ടു വ്യക്തിനാമങ്ങളും എബ്രായ ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു; പട്ടികയുടെ സ്വാഭാവിക മലയാളരീതിക്കായി ബന്ധകത്തെ വിരാമചിഹ്നത്തിലൂടെ പ്രകടിപ്പിച്ചു.
- source_word: בֶּן חָנָן
  choice: ബെൻ-ഹാനാൻ
  rationale: വംശാവലിപ്പട്ടികയിലെ സമാന്തര വ്യക്തിനാമമായി വായിക്കുന്നത് സന്ദർഭത്തിന് യോജിക്കുന്നു. ഘടകങ്ങൾ ഒന്നിച്ചുള്ള പേരാണെന്ന് വ്യക്തമാക്കാൻ ഹൈഫൻ ഉപയോഗിച്ചു; ‘ഹാനാന്റെ മകൻ’ എന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְתולון
  choice: തിലോൻ
  rationale: മസോററ്റിക് വായനയെ അടിസ്ഥാനമാക്കി വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: וּבְנֵי יִשְׁעִי
  choice: യിശിയുടെ പുത്രന്മാർ
  rationale: ആവർത്തിക്കുന്ന വംശാവലി സൂത്രവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി. יִשְׁעִי എന്ന പേര് വായനാസൗകര്യത്തിനായി ‘യിശി’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: זוֹחֵת
  choice: സോഹേത്ത്
  rationale: എബ്രായ വ്യക്തിനാമം അതിന്റെ വ്യഞ്ജന-സ്വരരൂപത്തോട് അടുത്തായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וּבֶן זוֹחֵת
  choice: ബെൻ-സോഹേത്ത്
  rationale: ‘മകൻ’ എന്നതിന് ശേഷം വേറൊരു വ്യക്തിനാമം വരാത്തതിനാലും ഇത് പേരുകളുടെ പട്ടികയായതിനാലും മുഴുവൻ പ്രയോഗവും വ്യക്തിനാമമായി സ്വീകരിച്ചു. ‘സോഹേത്തിന്റെ മകൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾ മൂല എബ്രായരൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു. സംയുക്തനാമങ്ങളിലെ യഥാർത്ഥ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
