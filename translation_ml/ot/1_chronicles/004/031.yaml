  text: and in Beth-marcaboth[a], and in Hazar-susim, and in Beth-biri, and in Shaaraim[d][c][b]. These were their cities until David reigned.
translation:
  language: ml
  text: ബേത്ത്-മർക്കാബോത്തിൽ[a], ഹസർ-സൂസീമിൽ[b], ബേത്ത്-ബിരിയിൽ[c], ശആരയീമിൽ[d] എന്നിവിടങ്ങളിലും; ദാവീദ് രാജാവാകുന്നതുവരെ ഇവയായിരുന്നു അവരുടെ പട്ടണങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബേത്ത്-മർക്കാബോത്ത് എന്ന പേരിന് പദാനുപദമായി “രഥങ്ങളുടെ ഭവനം” എന്ന അർഥം വരാം; ഇവിടെ അത് സ്ഥലനാമമായി നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഹസർ-സൂസീം എന്ന പേരിന് പദാനുപദമായി “കുതിരകളുടെ മുറ്റം” അല്ലെങ്കിൽ “കുതിരകളുടെ ഗ്രാമം” എന്ന അർഥം വരാം; ഇവിടെ അത് സ്ഥലനാമമായി നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ബേത്ത്-ബിരി എന്ന പേര് “ബേത്ത്-ബിരെയ്” എന്നും ലിപ്യന്തരണം ചെയ്യാം.
    reason: alternative_reading
  - marker: d
    text: ശആരയീം എന്ന പേരിന്റെ പദോത്പത്തിപരമായ അർഥം “രണ്ടു കവാടങ്ങൾ” എന്നായിരിക്കാം; ഇവിടെ അത് സ്ഥലനാമമായി നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בֵית מַרְכָּבוֹת
  choice: ബേത്ത്-മർക്കാബോത്തിൽ
  rationale: പട്ടണങ്ങളുടെ പട്ടികയായതിനാൽ പദഘടകങ്ങൾ വിവർത്തനം ചെയ്യാതെ സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു; മലയാളത്തിലെ വിഭക്തി സ്വാഭാവികമായി ചേർത്തു.
- source_word: וּ/בַ/חֲצַר סוּסִים
  choice: ഹസർ-സൂസീമിൽ
  rationale: ‘കുതിരകളുടെ മുറ്റം/ഗ്രാമം’ എന്ന പദാർഥം സാധ്യമെങ്കിലും സന്ദർഭത്തിൽ ഇത് സ്ഥലനാമമാണ്; അതിനാൽ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וּ/בְ/בֵית בִּרְאִי
  choice: ബേത്ത്-ബിരിയിൽ
  rationale: ചുറ്റുമുള്ള പേരുകളോടു സമാന്തരമായ സ്ഥലനാമമായി എടുത്തു; ഉച്ചാരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וּֽ/בְ/שַׁעֲרָיִם
  choice: ശയരയീമിൽ
  rationale: ദ്വിവചനസ്വഭാവമുള്ള രൂപത്തിന്റെ പദോത്പത്തിപരമായ അർഥം വിവർത്തനം ചെയ്യാതെ സ്ഥലനാമമായി നിലനിർത്തി.
- source_word: אֵלֶּה עָרֵי/הֶם
  choice: ഇവയായിരുന്നു അവരുടെ പട്ടണങ്ങൾ
  rationale: സൂചകസർവനാമവും നാമവാക്യവും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകി; עִיר എന്നതിന് ഇവിടെ ‘പട്ടണം’ യോജിക്കുന്നു.
- source_word: עַד מְלֹךְ דָּוִיד
  choice: ദാവീദ് രാജാവാകുന്നതുവരെ
  rationale: מְלֹךְ എന്ന ക്രിയാനാമത്തിന്റെ കാലപരിധി നിലനിർത്തുന്നു; ‘ദാവീദിന്റെ ഭരണകാലംവരെ’ എന്നു പറഞ്ഞ് ദൈർഘ്യം സൂചിപ്പിക്കുന്നതിനെക്കാൾ രാജത്വത്തിന്റെ ആരംഭപരിധി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
