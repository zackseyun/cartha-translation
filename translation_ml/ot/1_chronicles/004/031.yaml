translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി. ഹീബ്രു വാക്യത്തിൽ മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന പാർപ്പിടപ്പട്ടികയാണെന്നതിനാൽ മലയാളത്തിൽ പൂർണവാക്യമാക്കാൻ ‘എന്നിവിടങ്ങളിലും അവർ പാർത്തു’ എന്നു പൂരിപ്പിച്ചു. എല്ലാ സ്ഥലനാമങ്ങളും വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ നൽകി.
