id: 1CH.4.27
reference: 1 Chronicles 4:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/שִׁמְעִ֞י בָּנִ֨ים שִׁשָּׁ֤ה עָשָׂר֙ וּ/בָנ֣וֹת שֵׁ֔שׁ וּ/לְ/אֶחָ֕י/ו אֵ֖ין בָּנִ֣ים רַבִּ֑ים וְ/כֹל֙ מִשְׁפַּחְתָּ֔/ם לֹ֥א הִרְבּ֖וּ עַד בְּנֵ֥י יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
translation:
  language: ml
  text: ശിമെയിക്ക് പതിനാറു പുത്രന്മാരും ആറു പുത്രിമാരും ഉണ്ടായിരുന്നു. എന്നാൽ അവന്റെ സഹോദരന്മാർക്ക് അധികം പുത്രന്മാർ ഉണ്ടായിരുന്നില്ല; അവരുടെ മുഴുവൻ കുലവും യെഹൂദായുടെ പുത്രന്മാരുടെത്ര പെരുകിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദായുടെ പുത്രന്മാരുടെ എണ്ണത്തോളം വർധിച്ചില്ല.”
    reason: עַד בְּנֵי יְהוּדָה എന്ന പ്രയോഗത്തിലെ അളവ്/സംഖ്യാതുലനത്തിന്റെ കൂടുതൽ വ്യക്തമായ പകരം പരിഭാഷ.
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  choice: ശിമെയിക്ക് ... ഉണ്ടായിരുന്നു
  rationale: വംശാവലിസന്ദർഭത്തിൽ לְ എന്ന ഉപസർഗം ഉടമസ്ഥതയെയോ ഒരാൾക്കു മക്കൾ ഉണ്ടായിരുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘ശിമെയിക്ക് ... ഉണ്ടായിരുന്നു’ എന്നു നൽകി.
- source_word: בָּנִים שִׁשָּׁה עָשָׂר וּבָנוֹת שֵׁשׁ
  choice: പതിനാറു പുത്രന്മാരും ആറു പുത്രിമാരും
  rationale: എണ്ണവും ബന്ധസൂചക നാമങ്ങളും കൃത്യമായി നിലനിർത്തി, മലയാളത്തിന്റെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു.
- source_word: וּלְאֶחָיו
  choice: എന്നാൽ അവന്റെ സഹോദരന്മാർക്ക്
  rationale: וְ ഔപചാരികമായി ‘കൂടാതെ/ഉം’ എന്നാണെങ്കിലും, ഇവിടെ ശിമെയിയുടെ മക്കളുടെ എണ്ണവും സഹോദരന്മാരുടേതും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നതിനാൽ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: אֵין בָּנִים רַבִּים
  choice: അധികം പുത്രന്മാർ ഉണ്ടായിരുന്നില്ല
  rationale: അസ്തിത്വനിഷേധമായ אֵין, സഹോദരന്മാർക്ക് അനേകം പുത്രന്മാർ ഇല്ലായിരുന്നുവെന്ന അർഥത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; רַבִּים അതിശയോക്തിയില്ലാതെ ‘അധികം’ എന്നു നൽകി.
- source_word: וְכֹל מִשְׁפַּחְתָּם
  choice: അവരുടെ കുലങ്ങളെല്ലാം
  rationale: വംശാവലിസന്ദർഭത്തിലെ מִשְׁפָּחָה ആധുനിക അണുകുടുംബത്തേക്കാൾ വിശാലമായ ബന്ധുവംശഘടകത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുലങ്ങൾ’ എന്നു തെരഞ്ഞെടുത്തു.
- source_word: לֹא הִרְבּוּ
  choice: പെരുകിയില്ല
  rationale: רבה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ എണ്ണത്തിൽ വർധിക്കുക എന്ന വംശജനസംഖ്യാ ആശയം നൽകുന്നു; ‘പെരുകുക’ അത് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַד בְּנֵי יְהוּדָה
  choice: യെഹൂദയുടെ പുത്രന്മാരുടെയത്ര
  rationale: עַד ഇവിടെ സ്ഥലപരമായ ‘വരെ’ എന്നതിലുപരി അളവിന്റെയോ പരിധിയുടെയോ താരതമ്യം സൂചിപ്പിക്കുന്നു. בְּנֵי എന്ന വംശാവലിപ്രയോഗം ‘പുത്രന്മാർ’ എന്നായി നിലനിർത്തി.
