translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. ‘കുലങ്ങൾ’, ‘പുത്രന്മാർ’ എന്നീ പദങ്ങൾ സന്ദർഭത്തിന്റെ വംശപരമായ സ്വഭാവം നിലനിർത്തുന്നു; അവസാന ഉപവാക്യത്തിലെ അളവുതാരതമ്യത്തിന്റെ ചെറിയ വ്യാഖ്യാനവ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
