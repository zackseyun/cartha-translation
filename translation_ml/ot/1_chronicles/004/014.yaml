base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
translation:
  language: ml
  text: മെഓനോഥായി ഒഫ്രയെ ജനിപ്പിച്ചു. സെരായാവ് ഗേ-ഹരാശീമിന്റെ[a] പിതാവായ[b] യോവാബിനെ ജനിപ്പിച്ചു; കാരണം അവർ കൈത്തൊഴിലുകാരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗേ-ഹരാശീം” എന്നതിന് സാധ്യതയുള്ള അർഥം “കൈത്തൊഴിലുകാരുടെ താഴ്‌വര” എന്നാണ്. എബ്രായപാഠം ഇതിനെ സ്ഥലനാമമായി നിലനിർത്തുന്നു; തുടർന്നുള്ള വാക്യം ആ പേരിനെ വിശദീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഗേ-ഹരാശീമിന്റെ സ്ഥാപകൻ” അല്ലെങ്കിൽ “വംശത്തലവൻ.” വംശാവലിസന്ദർഭങ്ങളിൽ “പിതാവ്” എന്ന പ്രയോഗത്തിന് ഈ വിശാലമായ അർഥം ഉണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: מְעוֹנֹתַי
  choice: മെവോനോഥായി
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിസന്ദർഭത്തിലെ ഹിഫീൽ രൂപം ഒരാൾ മറ്റൊരാളുടെ പിതാവായി എന്ന ആശയം നൽകുന്നു; ‘ജനിപ്പിച്ചു’ ആ വംശാവലിബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും സൂക്ഷിക്കുന്നു.
- source_word: עָפְרָה
  choice: ഒഫ്ര
  rationale: ഇവിടെ പേരായി വരുന്ന പദം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: שְׂרָיָה
  choice: സെരായാവ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ കർത്തൃപ്രയോഗത്തിന് സ്വാഭാവികമായ രൂപത്തിൽ നൽകി.
- source_word: יוֹאָב
  choice: യോവാബ്
  rationale: വ്യക്തിനാമത്തിന്റെ പരിചിതമായ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֲבִי
  choice: പിതാവായ
  rationale: എബ്രായത്തിലെ ‘പിതാവ്’ എന്ന നേരിട്ടുള്ള പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; വംശത്തലവൻ അല്ലെങ്കിൽ സ്ഥാപകൻ എന്ന വിപുലമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: גֵּיא חֲרָשִׁים
  choice: ഗേ-ഹരാശീം
  rationale: ഇത് സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു; അതിന്റെ സാദ്ധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: כִּי
  choice: ;
  rationale: തുടർന്നുള്ള വാക്യം സ്ഥലനാമത്തെ വിശദീകരിക്കുന്ന കാരണമാണെന്ന ബന്ധം മലയാളത്തിൽ അർധവിരാമവും സന്ദർഭവുംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘കാരണം’ ചേർത്ത് അവ്യക്തമായ സർവനാമബന്ധം അമിതമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: חֲרָשִׁים
  choice: കൈത്തൊഴിലുകാർ
  rationale: പദം ലോഹപ്പണിക്കാർക്കു മാത്രം പരിമിതമല്ലാത്ത പൊതുവായ വൈദഗ്ധ്യമുള്ള തൊഴിലാളികളെ സൂചിപ്പിക്കാം; ‘കൈത്തൊഴിലുകാർ’ ആ വിശാലത സൂക്ഷിക്കുന്നു.
- source_word: הָיוּ
  choice: ആയിരുന്നു
  rationale: എബ്രായത്തിലെ ലളിതമായ ഭൂതകാല സംയോജകക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി; ‘അവർ’ ആരെ സൂചിപ്പിക്കുന്നു എന്ന അവ്യക്തത നിലനിർത്തി.
theological_decisions:
- issue: ‘അവർ’ എന്ന സർവനാമത്തിന്റെ സൂചന
  choice: ‘അവർ കൈത്തൊഴിലുകാരായിരുന്നു’ എന്നു നേരിട്ട് നിലനിർത്തി.
  alternative: ‘അവിടത്തെ നിവാസികൾ കൈത്തൊഴിലുകാരായിരുന്നു’ എന്ന് വ്യക്തീകരിക്കുക.
  rationale: എബ്രായപാഠം ബഹുവചന സർവനാമത്തിന്റെ സൂചന കൃത്യമായി നിർവചിക്കുന്നില്ല; അതിനെ സ്ഥലവാസികളായി മാത്രം വ്യാഖ്യാനിക്കാതെ മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പേരുകൾ ലിപ്യന്തരണം ചെയ്തു; പഴഞ്ചൻ ‘ജനിപ്പാൻ ഇടയായി’ പോലുള്ള പ്രയോഗങ്ങൾ ഒഴിവാക്കി. മൂലപാഠത്തിലെ വംശാവലിശൈലിയും സർവനാമത്തിന്റെ അവ്യക്തതയും സൂക്ഷിച്ചു.
