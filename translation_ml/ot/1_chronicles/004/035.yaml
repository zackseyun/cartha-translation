  text: וְ/יוֹאֵ֑ל וְ/יֵהוּא֙ בֶּן י֣וֹשִׁבְיָ֔ה בֶּן שְׂרָיָ֖ה בֶּן עֲשִׂיאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/035.yaml
  text: and Joel[a], and Jehu son of Joshibiah, son of Seraiah, son of Asiel.
translation:
  language: ml
  text: യോവേലും, യോശിബ്യാവിന്റെ മകനായ യേഹൂവും; യോശിബ്യാവ് സെരായാവിന്റെ മകൻ, സെരായാവ് അസീയേലിന്റെ മകൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വംശാവലികളിൽ “മകൻ” എന്ന ഹീബ്രുപദം ചില സന്ദർഭങ്ങളിൽ അകന്ന തലമുറയിലെ പിൻഗാമിയെയും സൂചിപ്പിക്കാം; ഇവിടെ വംശാവലിസൂത്രം അക്ഷരാർഥത്തിൽ പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: ഉം
  rationale: മുമ്പുള്ള പേരുകളുടെ പട്ടികയോടു ബന്ധിപ്പിക്കുന്ന സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ അന്വയപ്രത്യയമായി നൽകി.
- source_word: יוֹאֵל
  choice: യോവേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളത്തിൽ പരിചിതവും ഉച്ചാരണത്തോട് അടുത്തതുമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: יֵהוּא
  choice: യേഹൂ
  rationale: ഹീബ്രു വ്യക്തിനാമം അതിന്റെ ശബ്ദരൂപം നിലനിർത്തി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിസൂത്രത്തിലെ പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി; ഇവിടെ ഓരോ തലമുറയും വ്യക്തമായി കാണിക്കുന്ന വിധത്തിൽ ആവർത്തിച്ചു.
- source_word: יֹשִׁבְיָה
  choice: യോശിബ്യാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളത്തിന് സ്വാഭാവികമായ നാമരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: שְׂרָיָה
  choice: സെരായാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: עֲשִׂיאֵל
  choice: അസീയേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദഘടന പ്രതിഫലിപ്പിക്കുന്ന സംക്ഷിപ്ത മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
