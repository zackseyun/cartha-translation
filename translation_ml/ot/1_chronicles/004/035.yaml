translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രുവിലെ ചുരുക്കിയ വംശാവലിസൂത്രം മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ഓരോ തലമുറയുടെയും പേര് ആവർത്തിച്ച് വ്യക്തമാക്കിയിരിക്കുന്നു; സംയോജകഘടനയും പട്ടികയുടെ സ്വഭാവവും നിലനിർത്തിയിട്ടുണ്ട്.
