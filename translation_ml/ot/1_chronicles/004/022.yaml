id: 1CH.4.22
reference: 1 Chronicles 4:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יוֹקִ֞ים וְ/אַנְשֵׁ֣י כֹזֵבָ֗א וְ/יוֹאָ֧שׁ וְ/שָׂרָ֛ף אֲשֶׁר בָּעֲל֥וּ לְ/מוֹאָ֖ב וְ/יָשֻׁ֣בִי לָ֑חֶם וְ/הַ/דְּבָרִ֖ים עַתִּיקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/022.yaml
  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
translation:
  language: ml
  text: യോക്കീമും കോസേബായിലെ പുരുഷന്മാരും, മോവാബിൽ ആധിപത്യം പുലർത്തിയ[a] യോവാശും സാരാഫും, ലേഹെമിലേക്കു മടങ്ങിയവരും[b]. ഈ കാര്യങ്ങൾ പുരാതനമാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മോവാബിനെ കൈവശപ്പെടുത്തിയവർ,’ ‘മോവാബിൽ നാഥന്മാരായവർ,’ അല്ലെങ്കിൽ ഒരുപക്ഷേ ‘മോവാബ്യരുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെട്ടവർ’ എന്നും വരാം. എബ്രായപ്രയോഗം സംക്ഷിപ്തവും അർഥത്തിൽ അനിശ്ചിതവുമാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠം അനിശ്ചിതമാണ്. ‘ലേഹെമിലേക്കു മടങ്ങിയവർ’ എന്നതിനുപകരം ‘യാശൂബി-ലേഹെം’ (അല്ലെങ്കിൽ ‘യാശൂബ്-ലേഹെം’) എന്ന വ്യക്തിനാമമായിരിക്കാം. ചിലർ ഈ സ്ഥലം ബേത്‌ലേഹെമുമായി ബന്ധപ്പെടുത്തുന്നു.
    reason: alternative_reading
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘കാര്യങ്ങൾ പുരാതനമാണ്’ അല്ലെങ്കിൽ ‘ഈ കാര്യങ്ങൾ പുരാതനകാലംമുതലുള്ളവയാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  choice: യോക്കീം
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ഇതു വ്യക്തിനാമമായി കണ്ട്, എബ്രായരൂപത്തോട് ചേർന്നവിധം ലിപ്യന്തരണം ചെയ്തു.
- source_word: אַנְשֵׁי כֹזֵבָא
  choice: കോസേബയിലെ പുരുഷന്മാർ
  rationale: אַנְשֵׁי എന്ന നിർമാണബഹുവചനം ‘പുരുഷന്മാർ’ എന്നു വ്യക്തമാക്കുന്നു; כֹזֵבָא സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: יוֹאָשׁ
  choice: യോവാശ്
  rationale: വ്യക്തിനാമമായി മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: שָׂרָף
  choice: സാരാഫ്
  rationale: വംശാവലിസന്ദർഭം കാരണം സാധാരണനാമത്തിന്റെ അർഥം വിവർത്തനം ചെയ്യാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  choice: മോവാബിൽ അധികാരം നടത്തിയ
  rationale: בעל എന്ന ക്രിയ ഇവിടെ കൈവശംവെക്കുക, നാഥന്മാരാകുക, ഭരിക്കുക എന്നീ ആശയങ്ങൾ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘അധികാരം നടത്തിയ’ സ്വീകരിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יָשֻׁבִי לָחֶם
  choice: ലേഹെമിലേക്കു മടങ്ങിയവർ
  rationale: ദുഷ്കരമായ ഈ രൂപത്തെ മടങ്ങിവരുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയാപദവും സ്ഥലനാമവും ചേർന്ന പ്രയോഗമായി മുഖ്യപാഠത്തിൽ അവതരിപ്പിച്ചു; സംയുക്ത വ്യക്തിനാമമായിരിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: הַדְּבָרִים עַתִּיקִים
  choice: ഈ വിവരങ്ങൾ പുരാതനകാലത്തേതാണ്
  rationale: דְּבָרִים എന്നതിന് വാക്കുകൾ, കാര്യങ്ങൾ, വിവരങ്ങൾ എന്നിങ്ങനെ അർഥങ്ങളുണ്ട്. വംശാവലിയുടെ ചരിത്രക്കുറിപ്പിൽ ‘വിവരങ്ങൾ’ സ്വാഭാവികമാണ്; ‘പുരാതനകാലത്തേതാണ്’ עַתִּיקִים എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: മോവാബുമായുള്ള ബന്ധത്തിന്റെ സ്വഭാവം
  choice: മോവാബിൽ അധികാരം നടത്തിയ
  alternative: മോവാബിനെ കൈവശപ്പെടുത്തിയ / മോവാബിൽ നാഥന്മാരായ / മോവാബ്യരുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെട്ട
  rationale: എബ്രായപ്രയോഗം അത്യന്തം സംക്ഷിപ്തവും അർഥത്തിൽ അനിശ്ചിതവുമാണ്. ഒരു പ്രത്യേക ചരിത്രപരമോ ദൈവശാസ്ത്രപരമോ ആയ വ്യാഖ്യാനം ഉറപ്പിക്കാതെ മുഖ്യസാധ്യത തിരഞ്ഞെടുത്തു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. മൂലത്തിലെ പട്ടികാസ്വഭാവവും ദുഷ്കരമായ ചരിത്രക്കുറിപ്പിന്റെ അനിശ്ചിതത്വവും നിലനിർത്തി; വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും മലയാളത്തിൽ ഉച്ചരിക്കാൻ സ്വാഭാവികമായ രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു.
