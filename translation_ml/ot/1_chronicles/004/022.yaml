revisions:
- from: യോക്കീമും കോസേബയിലെ പുരുഷന്മാരും, മോവാബിൽ അധികാരം നടത്തിയ യോവാശും സാരാഫും[a], ലേഹെമിലേക്കു മടങ്ങിയവരും[b]. ഈ വിവരങ്ങൾ പുരാതനകാലത്തേതാണ്[c].
  to: യോക്കീമും കോസേബായിലെ പുരുഷന്മാരും, മോവാബിൽ ആധിപത്യം പുലർത്തിയ[a] യോവാശും സാരാഫും, ലേഹെമിലേക്കു മടങ്ങിയവരും[b]. ഈ കാര്യങ്ങൾ പുരാതനമാണ്[c].
  rationale: 'സുരക്ഷിതമായ ചെറിയ പരിഷ്കാരങ്ങൾ മാത്രമാണ് വരുത്തിയത്: സ്ഥലനാമലിപ്യന്തരണം സമ്പൂർണമാക്കി, മോവാബുമായി ബന്ധപ്പെട്ട പ്രയോഗം സ്വാഭാവികമാക്കി, അതിന്റെ അടിക്കുറിപ്പ് ശരിയായ സ്ഥാനത്തേക്കു മാറ്റി, അവസാന വാക്യത്തിൽ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തി. യാശൂബി-ലേഹെം എന്ന പ്രയോഗത്തിലെ പാഠപരവും വ്യാകരണപരവുമായ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും മാറ്റമില്ലാതെ സംരക്ഷിച്ചിട്ടുണ്ട്.'
