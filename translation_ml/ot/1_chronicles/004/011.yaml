id: 1CH.4.11
reference: 1 Chronicles 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/כְל֥וּב אֲחִֽי שׁוּחָ֖ה הוֹלִ֣יד אֶת מְחִ֑יר ה֖וּא אֲבִ֥י אֶשְׁתּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/011.yaml
  text: Chelub[a], the brother of Shuhah, fathered Mehir; he was the father of Eshton.
translation:
  language: ml
  text: ശൂഹായുടെ സഹോദരനായ കെലൂബ് മെഹീറിനെ ജനിപ്പിച്ചു; മെഹീർ എഷ്ടോന്റെ പിതാവായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എഷ്ടോന്റെ പൂർവികൻ/സ്ഥാപകൻ.’ വംശാവലിപ്പട്ടികകളിൽ ‘പിതാവ്’ എന്നത് ചിലപ്പോൾ നേരിട്ടുള്ള ജൈവിക പിതാവിനെ മാത്രമല്ല, ഒരു വംശത്തിന്റെയോ ജനവാസകേന്ദ്രത്തിന്റെയോ പൂർവികനെയോ സ്ഥാപകനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְלוּב
  choice: കെലൂബ്
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു. വാക്യാരംഭത്തിലെ וּ ബന്ധകത്തെ ഈ വംശാവലിക്കുറിപ്പിൽ പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർക്കാതെ സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: אֲחִי שׁוּחָה
  choice: ശൂഹായുടെ സഹോദരനായ
  rationale: എബ്രായ സംയുക്തബന്ധം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം; സഹോദരബന്ധം അതേപടി നിലനിർത്തുന്നു.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: הוליד എന്ന ഹിഫ്ഇൽ ക്രിയ വംശാവലി സന്ദർഭത്തിൽ ഒരാളെ ജനിപ്പിക്കുക/അവന്റെ പിതാവാകുക എന്ന അർഥം നൽകുന്നു. ‘ജനിപ്പിച്ചു’ സംക്ഷിപ്തവും നിലവിലെ മലയാളത്തിൽ ഗ്രാഹ്യവും ആണ്.
- source_word: מְחִיר
  choice: മെഹീർ
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു.
- source_word: הוּא
  choice: മെഹീർ
  rationale: സ്വതന്ത്ര സർവനാമം അടുത്തുള്ള മുൻപദമായ മെഹീറിനെ സൂചിപ്പിക്കുന്നതായി വാക്യഘടന വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് ആവർത്തിച്ചു.
- source_word: אֲבִי
  choice: പിതാവായിരുന്നു
  rationale: അടിസ്ഥാന അർഥമായ ‘പിതാവ്’ നിലനിർത്തി. വംശാവലികളിൽ ഈ പദത്തിന് പൂർവികൻ അല്ലെങ്കിൽ ഒരു വംശത്തിന്റെയോ സ്ഥലത്തിന്റെയോ സ്ഥാപകൻ എന്ന വിശാല അർഥം ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אֶשְׁתּוֹן
  choice: എഷ്ടോൻ
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു.
