translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ രണ്ട് ഉപവാക്യങ്ങളും അർദ്ധവിരാമംകൊണ്ട് വേർതിരിച്ച് ബന്ധം വ്യക്തമായി സൂക്ഷിച്ചു; സർവനാമത്തിന്റെ സാധ്യതയുള്ള അവ്യക്തത ഒഴിവാക്കാൻ ‘മെഹീർ’ ആവർത്തിച്ചു.
