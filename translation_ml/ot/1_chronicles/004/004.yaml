id: 1CH.4.4
reference: 1 Chronicles 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/פְנוּאֵל֙ אֲבִ֣י גְדֹ֔ר וְ/עֵ֖זֶר אֲבִ֣י חוּשָׁ֑ה אֵ֤לֶּה בְנֵי חוּר֙ בְּכ֣וֹר אֶפְרָ֔תָה אֲבִ֖י בֵּ֥ית לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/004.yaml
  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
translation:
  language: ml
  text: ഗെദോരിന്റെ പിതാവായ[a] പെനൂവേലും[b] ഹൂശായുടെ പിതാവായ ഏസെരും—ഇവർ എഫ്രാത്തായുടെ ആദ്യജാതനും ബേത്‌ലഹേമിന്റെ പിതാവുമായ ഹൂരിന്റെ പുത്രന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വംശാവലിസന്ദർഭത്തിൽ ‘പിതാവ്’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്, പ്രത്യേകിച്ച് പട്ടണങ്ങളെയോ കുലങ്ങളെയോ സംബന്ധിക്കുമ്പോൾ, ‘സ്ഥാപകൻ’ അല്ലെങ്കിൽ ‘പൂർവികൻ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പെനൂവേൽ’ എന്ന പേര് മറ്റു ചില ഭാഗങ്ങളിൽ ‘പെനിയേൽ’ എന്നും എഴുതിയിരിക്കുന്നു; ഇവ ഒരേ പേരിന്റെ ഭിന്നരൂപങ്ങളാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנוּאֵל
  choice: പെനൂവേൽ
  rationale: ഇവിടത്തെ ഹീബ്രായ വ്യഞ്ജനരൂപത്തെ പിന്തുടർന്ന് വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു; മറ്റു ഭാഗങ്ങളിൽ കാണുന്ന ‘പെനിയേൽ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֲבִי
  choice: പിതാവ്
  rationale: ഹീബ്രായ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; പട്ടണങ്ങളെയോ കുലങ്ങളെയോ സംബന്ധിക്കുമ്പോൾ ‘സ്ഥാപകൻ’ അല്ലെങ്കിൽ ‘പൂർവികൻ’ എന്ന വിശാല അർഥവും ഇതിന് ഉണ്ടാകാം.
- source_word: גְדֹר
  choice: ഗെദോർ
  rationale: സ്ഥലനാമമോ കുലനാമമോ ആയതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: עֵזֶר
  choice: ഏസെർ
  rationale: വ്യക്തിനാമമായതിനാൽ ഹീബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: חוּשָׁה
  choice: ഹൂശ
  rationale: സ്ഥലനാമമോ കുലനാമമോ ആയതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֵלֶּה
  choice: ഇവർ ... ആയിരുന്നു
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രായ വാക്യം വംശാവലിയുടെ വിവരണസന്ദർഭത്തിന് യോജിച്ച ഭൂതകാല സംയോജകക്രിയയോടെ സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: മൂലപദത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തി; വംശാവലികളിൽ ‘സന്തതികൾ’ എന്ന വിശാല അർഥം സാധ്യമെങ്കിലും ഇവിടെ അത് അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല.
- source_word: חוּר
  choice: ഹൂർ
  rationale: വ്യക്തിനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּכֹר
  choice: ആദ്യജാതൻ
  rationale: എഫ്രാത്തയോടുള്ള ഹൂരിന്റെ സ്ഥാനം വ്യക്തമാക്കുന്ന സംയുക്തരൂപം; മൂലത്തിൽ ഇല്ലാത്ത ‘പുത്രൻ’ എന്ന പദം ചേർത്തിട്ടില്ല.
- source_word: אֶפְרָתָה
  choice: എഫ്രാത്ത
  rationale: ഹീബ്രായ നാമരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֵּית לָחֶם
  choice: ബേത്‌ലഹേം
  rationale: പേരിന്റെ ഘടകങ്ങൾ വിവർത്തനം ചെയ്യാതെ, മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം സ്വീകരിച്ചു.
theological_decisions:
- issue: אֲבִי എന്ന പദത്തിന്റെ വംശാവലി/സ്ഥലബന്ധമായ അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘പിതാവ്’ നിലനിർത്തി.
  alternative: ‘സ്ഥാപകൻ’ അല്ലെങ്കിൽ ‘പൂർവികൻ’
  rationale: മൂലത്തിലെ ബന്ധത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമായി നിർണ്ണയിക്കാനാകാത്തതിനാൽ അതിലെ അർഥസന്ദിഗ്ധത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ഹീബ്രായ വാക്യക്രമം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി അല്പം പുനഃക്രമീകരിച്ചു. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ footnote marker-ുകളുടെ ഉള്ളടക്കം തമ്മിൽ പൊരുത്തക്കേടുണ്ടായിരുന്നു: [a] പിതാവ് എന്ന പ്രയോഗത്തിന് പിന്നാലെയായിരുന്നെങ്കിലും പെനൂവേൽ/പെനിയേൽ ഭിന്നരൂപം വിവരിച്ചു; [b] എഫ്രാത്തയ്ക്ക് പിന്നാലെയായിരുന്നെങ്കിലും അതേ പേരിന്റെ ഭിന്നരൂപം തന്നെയായിരുന്നു. മൂലസാക്ഷ്യവും പ്രസക്തിയും അനുസരിച്ച് പെനൂവേലിന് പിന്നാലെ [a] ചേർത്ത്, രണ്ട് പ്രസക്തമായ ഭാഷാവിവരങ്ങളും ഒരൊറ്റ അടിക്കുറിപ്പിൽ വ്യക്തമായി ഉൾപ്പെടുത്തി.'
