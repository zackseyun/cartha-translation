  text: 'ശിമെയോന്റെ പുത്രന്മാർ: നെമൂവേൽ[a], യാമീൻ, യാരീബ്, സെരഹ്[b], ശൗൽ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഉല്പത്തി 46:10-ലെ സമാന്തര വംശാവലിയിൽ ഈ പേര് യെമൂവേൽ എന്നാണ്; ഇവിടെ എബ്രായപാഠത്തിലുള്ള രൂപം നെമൂവേൽ എന്നാണ്.
