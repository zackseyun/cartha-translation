    reason: textual_variant
  - marker: c
    text: ശൗൽ എന്നത് שָׁאוּל എന്ന പേരിന്റെ എബ്രായരൂപത്തോട് അടുത്ത ലിപ്യന്തരമാണ്; ചില ഭാഷാപാരമ്പര്യങ്ങളിൽ ഇത് സൗൽ എന്നും എഴുതപ്പെടുന്നു.
