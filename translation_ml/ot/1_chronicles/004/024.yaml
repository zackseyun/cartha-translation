- source_word: שִׁמְעוֹן
  choice: ശിമെയോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: נְמוּאֵל
  choice: നെമൂവേൽ
  rationale: ഈ വാക്യത്തിലെ എബ്രായരൂപമായ נְמוּאֵל നേരിട്ട് ലിപ്യന്തരിച്ചു; സമാന്തര വംശാവലിയിൽ കാണുന്ന യെമൂവേൽ എന്ന രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְיָמִין
  choice: യാമീൻ
  rationale: ו എന്ന സംയോജകം പട്ടികയുടെ മലയാള വിരാമക്രമത്തിൽ പ്രകടമാകുന്നു; יָמִין എന്ന വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: יָרִיב
  choice: യാരീബ്
  rationale: വ്യക്തിനാമം അതിന്റെ പദാർഥമായി വിവർത്തനം ചെയ്യാതെ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: זֶרַח
  choice: സേരഹ്
  rationale: ഈ വാക്യത്തിലെ זֶרַח എന്ന എബ്രായരൂപം ലിപ്യന്തരിച്ചു; സമാന്തര വംശാവലികളിലെ സോഹർ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: שָׁאוּל എന്ന എബ്രായനാമത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം; ഇംഗ്ലീഷിലെ Saul എന്ന രൂപത്തെ ആശ്രയിച്ചില്ല.
