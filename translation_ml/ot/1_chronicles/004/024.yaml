translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ പേരുകളുടെ ക്രമവും രൂപവും സംരക്ഷിച്ചു; മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാവിരാമങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പേരുകൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
