  to: യഹൂദസ്ത്രീയായ അവന്റെ ഭാര്യ ഗെദോരിന്റെ പിതാവായ[b] യെരേദിനെയും, സോഖോയുടെ പിതാവായ ഹേബെരിനെയും, സാനോഹിന്റെ പിതാവായ യെക്കൂഥീയേലിനെയും പ്രസവിച്ചു. മേരെദ് ഭാര്യയായി സ്വീകരിച്ച ഫറവോന്റെ മകളായ ബിത്യയുടെ[c] പുത്രന്മാരാണ് ഇവർ. [a]
