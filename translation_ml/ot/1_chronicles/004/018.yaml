  text: וְ/אִשְׁתּ֣/וֹ הַ/יְהֻדִיָּ֗ה יָלְדָ֞ה אֶת יֶ֨רֶד אֲבִ֤י גְדוֹר֙ וְ/אֶת חֶ֨בֶר֙ אֲבִ֣י שׂוֹכ֔וֹ וְ/אֶת יְקֽוּתִיאֵ֖ל אֲבִ֣י זָנ֑וֹחַ וְ/אֵ֗לֶּה בְּנֵי֙ בִּתְיָ֣ה בַת פַּרְעֹ֔ה אֲשֶׁ֥ר לָקַ֖ח מָֽרֶד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
translation:
  language: ml
  text: യഹൂദസ്ത്രീയായ അവന്റെ ഭാര്യ ഗെദോരിന്റെ പിതാവായ[b] യെരേദിനെയും, സോഖോയുടെ പിതാവായ ഹേബെരിനെയും, സാനോഹിന്റെ പിതാവായ യെക്കൂഥീയേലിനെയും പ്രസവിച്ചു. മേരെദ് ഭാര്യയായി സ്വീകരിച്ച ഫറവോന്റെ മകളായ ബിത്യയുടെ[c] പുത്രന്മാരാണ് ഇവർ. [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യഹൂദസ്ത്രീയായ” എന്നതിന് “യെഹൂദ്യയായ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ദിനവൃത്താന്തങ്ങളിൽ “പിതാവ്” എന്നത് ചിലപ്പോൾ ഒരു സ്ഥലത്തിന്റെയോ വംശത്തിന്റെയോ സ്ഥാപകൻ, പൂർവികൻ, അല്ലെങ്കിൽ തലവൻ എന്ന അർഥത്തിലും വരാം.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടത്തെ എബ്രായ വാക്യഘടന ദുഷ്കരമാണ്. “യഹൂദസ്ത്രീയായ അവന്റെ ഭാര്യ”യും “ഫറവോന്റെ മകളായ ബിത്യ”യും ഒരേ സ്ത്രീയെ സൂചിപ്പിക്കുന്നുവെന്ന് ചിലർ കരുതുന്നു; മറ്റുചിലർ ഇവർ മേരെദിന്റെ വ്യത്യസ്ത ഭാര്യമാരാണെന്ന് കരുതുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִיָּה
  choice: യെഹൂദ്യയായ ഭാര്യ
  rationale: സ്ത്രീലിംഗ ജനവിഭാഗനാമത്തിന്റെ യെഹൂദ്യ/യഹൂദസ്ത്രീ എന്ന അർഥം നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണപ്രയോഗമാണ്.
- source_word: יָלְדָה
  choice: പ്രസവിച്ചു
  rationale: വംശാവലിസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗം.
- source_word: אֲבִי
  choice: പിതാവ്
  rationale: മൂലത്തിലെ ഔപചാരിക ബന്ധപദം നിലനിർത്തുന്നു; ദിനവൃത്താന്തങ്ങളിൽ സ്ഥാപകൻ, പൂർവികൻ, അല്ലെങ്കിൽ സ്ഥലവുമായി ബന്ധപ്പെട്ട ഗോത്രത്തലവൻ എന്നും വരാവുന്ന വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: שׂוֹכוֹ
  choice: സോഖോ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יְקוּתִיאֵל
  choice: യെക്കൂഥീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: זָנוֹחַ
  choice: സാനോഹ്
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗ ബഹുവചനം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: בִּתְיָה בַת פַּרְעֹה
  choice: ഫറവോന്റെ മകളായ ബിത്യ
  rationale: ബന്ധം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ അന്വയക്രമം ഉപയോഗിക്കുന്നു.
- source_word: לָקַח
  choice: ഭാര്യയായി സ്വീകരിച്ചു
  rationale: വിവാഹസന്ദർഭത്തിലെ ‘എടുത്തു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאֵלֶּה
  choice: ഇവർ
  rationale: മുൻപു പറഞ്ഞ വ്യക്തികളെ സംഗ്രഹിച്ച് തിരിച്ചറിയിക്കുന്ന മൂലപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: ‘യെഹൂദ്യയായ ഭാര്യ’യും ‘ഫറവോന്റെ മകളായ ബിത്യ’യും ഒരേ സ്ത്രീയാണോ വ്യത്യസ്ത ഭാര്യമാരാണോ എന്ന അനിശ്ചിതത്വം
  choice: എബ്രായ വാക്യക്രമം അനുസരിച്ച് രണ്ട് പരാമർശങ്ങളും നിലനിർത്തി, അവ തമ്മിലുള്ള ബന്ധം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ വെച്ചു.
  alternative: ‘യെഹൂദ്യയായ ഭാര്യ’ ബിത്യ തന്നെയാണെന്ന് വ്യക്തമാക്കുക; അല്ലെങ്കിൽ മേരെദിന്റെ രണ്ട് വ്യത്യസ്ത ഭാര്യമാരായി അവതരിപ്പിക്കുക.
  rationale: എബ്രായ വാക്യഘടന ദുഷ്കരമാണ്; രണ്ട് വ്യാഖ്യാനങ്ങൾക്കും സാധ്യതയുള്ളതിനാൽ വംശാവലിയുടെ സംഘർഷം നിശ്ശബ്ദമായി പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വംശാവലിയുടെ ചുരുക്കഭാവം നിലനിർത്തുന്നതിനൊപ്പം നീണ്ട ആദ്യവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചു; മൂലത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
