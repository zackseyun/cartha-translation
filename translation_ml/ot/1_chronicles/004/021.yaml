reference: 1 Chronicles 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵי֙ שֵׁלָ֣ה בֶן יְהוּדָ֔ה עֵ֚ר אֲבִ֣י לֵכָ֔ה וְ/לַעְדָּ֖ה אֲבִ֣י מָרֵשָׁ֑ה וּ/מִשְׁפְּח֛וֹת בֵּית עֲבֹדַ֥ת הַ/בֻּ֖ץ לְ/בֵ֥ית אַשְׁבֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
translation:
  language: ml
  text: 'യെഹൂദായുടെ മകനായ ശേലായുടെ പുത്രന്മാർ: ലേഖയുടെ പിതാവായ ഏർ, മാരേശയുടെ പിതാവായ ലാദാ, ബേത്ത്-അശ്ബേയയിലെ നേർത്ത ലിനൻ വസ്ത്രം നിർമിക്കുന്നവരുടെ ഭവനത്തിലെ വംശങ്ങൾ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അശ്ബേയയുടെ ഭവനത്തിലെ നേർത്ത ലിനൻ വസ്ത്രം നിർമിക്കുന്നവരുടെ ഭവനത്തിലെ വംശങ്ങൾ.” എബ്രായത്തിലെ അവസാന പ്രയോഗം സങ്കുചിതമാണ്; ബേത്ത്-അശ്ബേയ ഒരു സ്ഥലനാമമായിരിക്കാം. ഈ വാക്യത്തിലെ “പിതാവ്” എന്നതിന് “പൂർവികൻ” എന്നോ “സ്ഥാപകൻ” എന്നോ അർഥമാകാനും കഴിയും.'
    reason: ലְבֵית אַשְׁבֵּעַ എന്ന സങ്കുചിതവും വ്യാഖ്യാനവ്യത്യാസമുള്ള ഘടകത്തിന് പ്രധാനവാചകത്തിൽ സ്ഥലനാമവായന നൽകുമ്പോൾ, മറ്റൊരു സാധ്യമായ ‘അശ്ബേയയുടെ ഭവനം’ വായനയും אֲבִי-യുടെ വിശാല വംശാവലി അർഥവും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ ശൈലിയും എബ്രായ പദത്തിന്റെ നേരിട്ടുള്ള പുത്രബന്ധഭാഷയും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘പിൻഗാമികൾ’ എന്ന വിശാല അർഥവും സാധ്യമാണ്.
- source_word: שֵׁלָה בֶן יְהוּדָה
  choice: യെഹൂദായുടെ മകനായ ശേലാ
  rationale: പ്രകടമായ വംശബന്ധം ചുരുക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲבִי
  choice: പിതാവായ
  rationale: എബ്രായത്തിലെ ബന്ധപദം സുതാര്യമായി നിലനിർത്തുന്നു; സ്ഥലത്തിന്റെയോ വംശത്തിന്റെയോ പൂർവികൻ/സ്ഥാപകൻ എന്ന വിപുലമായ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מִשְׁפְּחוֹת
  choice: വംശങ്ങൾ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആധുനിക അണുകുടുംബങ്ങളല്ല, വിപുലമായ ഗോത്രബന്ധമുള്ള കൂട്ടങ്ങളാണ്.
- source_word: עֲבֹדַת הַבֻּץ
  choice: നേർത്ത ചണവസ്ത്രപ്പണിക്കാർ
  rationale: בּוּץ സൂചിപ്പിക്കുന്ന വിലയേറിയ നേർത്ത ലിനൻ വസ്ത്രവും തൊഴിൽസംബന്ധമായ അർഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: לְבֵית אַשְׁבֵּעַ
  choice: അശ്ബേയയുടെ ഭവനത്തിൽപ്പെട്ട
  rationale: לְ എന്ന ബന്ധസൂചനയെ സ്ഥലബന്ധമായി മാത്രം തീർപ്പാക്കാതെ, അശ്ബേയയുടെ ഭവനത്തോടുള്ള കുടുംബപരമോ സംഘപരമോ ആയ ബന്ധമായി അവതരിപ്പിക്കുന്നു.
