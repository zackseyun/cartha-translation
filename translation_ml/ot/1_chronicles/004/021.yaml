translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പേരുകൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു; സങ്കുചിതമായ വംശാവലി ശൈലി സാധ്യമായത്ര നിലനിർത്തിക്കൊണ്ട് അവസാന ഭാഗം വായനാസൗകര്യത്തിനായി സ്വാഭാവികമാക്കി.
