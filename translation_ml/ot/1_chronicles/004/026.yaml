id: 1CH.4.26
reference: 1 Chronicles 4:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֖י מִשְׁמָ֑ע חַמּוּאֵ֥ל בְּנ֛/וֹ זַכּ֥וּר בְּנ֖/וֹ שִׁמְעִ֥י בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/026.yaml
  text: 'The sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.'
translation:
  language: ml
  text: 'മിശ്മയുടെ പുത്രന്മാർ: ഹമ്മൂവേൽ, അവന്റെ മകൻ; സക്കൂർ, അവന്റെ മകൻ; ശിമെയി, അവന്റെ മകൻ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: בְּנֵי എന്ന സംയുക്ത ബഹുവചനം വംശാവലിപ്പട്ടികയിൽ സ്വാഭാവികമായി ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി. തുടക്കത്തിലെ וּ ബന്ധകത്തെ മലയാളത്തിൽ പ്രത്യേകം നൽകാതിരിക്കുന്നത് പട്ടികാശൈലിക്ക് യോജിക്കുന്നു.
- source_word: מִשְׁמָע
  choice: മിശ്മ
  rationale: മസോററ്റിക് സ്വരീകരണം അടിസ്ഥാനമാക്കി വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: חַמּוּאֵל
  choice: ഹമ്മൂവേൽ
  rationale: ഹീബ്രു വ്യഞ്ജന-സ്വരരൂപവും ദ്വിത്വ മ് ശബ്ദവും കഴിയുന്നത്ര നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയമുള്ള പദം നേരിട്ട് ‘അവന്റെ മകൻ’ എന്നാണ്; വംശജൻ എന്ന വിശാല അർത്ഥം ഇവിടെ സ്വീകരിച്ചിട്ടില്ല.
- source_word: זַכּוּר
  choice: സക്കൂർ
  rationale: ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന്, ദ്വിത്വ ക് ശബ്ദവും ദീർഘ ū സ്വരവും സൂചിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שִׁמְעִי
  choice: ശിമെയി
  rationale: മസോററ്റിക് സ്വരീകരണത്തിലെ ശിമ്ഈ/ശിമെയി ശബ്ദരൂപം വായനാസൗകര്യത്തോടെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം. മൂലത്തിലെ സംക്ഷിപ്ത വംശാവലിഘടന നിലനിർത്താൻ അർദ്ധവിരാമങ്ങൾ ഉപയോഗിച്ചു; ‘അവന്റെ’ എന്ന ആവർത്തനം ഓരോ തലമുറയുടെയും പിതൃപുത്രബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
