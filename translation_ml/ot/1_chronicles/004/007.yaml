  text: 'ഹെലായുടെ പുത്രന്മാർ[b]: സെരെത്ത്, യിത്സ്ഹാർ, എത്നാൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: വംശാവലികളിലെ ‘പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗം നേരിട്ടുള്ള പുത്രന്മാരെ മാത്രമല്ല, ഒരു കുടുംബവംശത്തിലെ പിൻതലമുറക്കാരെയും സൂചിപ്പിക്കാം.
