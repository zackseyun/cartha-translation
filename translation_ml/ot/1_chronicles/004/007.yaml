translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. വ്യക്തിനാമങ്ങൾ ഹീബ്രു പാഠത്തിൽനിന്ന് മലയാളലിപിയിലേക്ക് പകർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് കരടിലെ ആദ്യ അടിക്കുറിപ്പ് ഹെലാ/ഹെലെ എന്ന മാതൃനാമത്തെക്കുറിച്ചാണെങ്കിലും അതിന്റെ ചിഹ്നം സേരെത്തിനോടാണ് ചേർന്നിരിക്കുന്നത്; അതിനാൽ പ്രസിദ്ധീകരണകരടിൽ ചിഹ്നവും കുറിപ്പും തമ്മിൽ യോജിപ്പിക്കുന്ന വിധം സേരെത്തിന്റെ ലിപ്യന്തരവികൽപം നൽകിയിരിക്കുന്നു.
