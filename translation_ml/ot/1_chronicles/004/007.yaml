lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: בְנֵי എന്നത് വംശാവലിപ്പട്ടികയിലെ പതിവായ ‘പുത്രന്മാർ’ എന്ന പ്രയോഗമാണ്. തുടക്കത്തിലെ ו ഇവിടെ പട്ടികയിലെ സ്വാഭാവിക ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർക്കാതെ തന്നെയാണ് ഒഴുക്കോടെ നൽകിയിരിക്കുന്നത്.
- source_word: חֶלְאָה
  choice: ഹെലാ
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രു രൂപത്തെ ആധാരമാക്കി മലയാളലിപിയിൽ പകർത്തി.
- source_word: צֶרֶת
  choice: സേരെത്ത്
  rationale: צֶרֶת എന്ന വ്യക്തിനാമത്തിന്റെ ഹീബ്രു ഉച്ചാരണരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: יצחר
  choice: യിസ്ഹാർ
  rationale: മസോററ്റിക് പാഠത്തിലെ വ്യഞ്ജനരൂപം അടിസ്ഥാനമാക്കിയുള്ള ലിപ്യന്തരണം; പരിചിതമായ ബൈബിൾ നാമരൂപത്തോടും യോജിക്കുന്നു.
- source_word: וְ/אֶתְנָן
  choice: എത്നാൻ
  rationale: അവസാന നാമത്തിന് മുമ്പുള്ള ו പട്ടികബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വിരാമചിഹ്നക്രമത്തിൽ അത് സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ നാമം ‘എത്നാൻ’ എന്നു നൽകിയിരിക്കുന്നു.
