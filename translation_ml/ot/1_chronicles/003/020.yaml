id: 1CH.3.20
reference: 1 Chronicles 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/חֲשֻׁבָ֡ה וָ֠/אֹהֶל וּ/בֶרֶכְיָ֧ה וַֽ/חֲסַדְיָ֛ה י֥וּשַׁב חֶ֖סֶד חָמֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/020.yaml
  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
translation:
  language: ml
  text: ഹശൂബാ, ഓഹേൽ, ബെരെഖ്യാ, ഹസദ്യാ, യൂശബ്-ഹേസെദ്—അഞ്ചുപേർ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ പട്ടികപ്പെടുത്തിയ പേരുകൾക്കുശേഷം സംഗ്രഹമായി ‘അഞ്ച്’ എന്നു മാത്രമാണുള്ളത്; മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘അഞ്ചുപേർ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അവസാനത്തെ പേര് എബ്രായത്തിൽ ‘യൂശബ് ഹേസെദ്’ എന്ന് രണ്ട് ഘടകങ്ങളായി എഴുതിയിട്ടുണ്ടെങ്കിലും, ഇവിടെ അതിനെ ഒരൊറ്റ സംയുക്ത വ്യക്തിനാമമായി കണ്ട് ‘യൂശബ്-ഹേസെദ്’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲשֻׁבָה
  choice: ഹശൂബാ
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു. പട്ടികയുടെ തുടക്കത്തിലെ וַ ബന്ധകത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം പ്രകടിപ്പിക്കേണ്ടതില്ല.
- source_word: וָ/אֹהֶל
  choice: ഓഹേൽ
  rationale: ഇവിടെ സാധാരണ നാമമായ ‘കൂടാരം’ എന്നല്ല, വ്യക്തിനാമമായാണ് പ്രയോഗം; അതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּ/בֶרֶכְיָה
  choice: ബെരെഖ്യാ
  rationale: വ്യക്തിനാമം എബ്രായ സ്വരവിന്യാസത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ആവർത്തിക്കുന്ന ബന്ധകങ്ങൾ മലയാള പട്ടികാശൈലിയിൽ ഒഴിവാക്കി.
- source_word: וַֽ/חֲסַדְיָה
  choice: ഹസദ്യാ
  rationale: വ്യക്തിനാമം അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു; അവസാനത്തെ יה ഘടകം ‘-യാ’യായി നൽകി.
- source_word: י֥וּשַׁב חֶ֖סֶד
  choice: യൂശബ്-ഹേസെദ്
  rationale: എബ്രായത്തിൽ രണ്ട് പദങ്ങളായി എഴുതിയിട്ടുണ്ടെങ്കിലും ഒരൊറ്റ സംയുക്ത വ്യക്തിനാമമായി പ്രവർത്തിക്കുന്നുവെന്ന ധാരണ വായനക്കാരന് വ്യക്തമാക്കാൻ ഹൈഫൻ ഉപയോഗിച്ചു.
- source_word: חָמֵשׁ
  choice: അഞ്ചുപേർ
  rationale: പേരുകളുടെ പട്ടികയെ സംഗ്രഹിക്കുന്ന സംഖ്യയാണിത്. മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട് മനുഷ്യരെ എണ്ണുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘പേർ’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. ആവർത്തിക്കുന്ന എബ്രായ ബന്ധകങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാരീതിക്കനുസരിച്ച് പ്രകടിപ്പിച്ചിട്ടില്ല. രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തി.
