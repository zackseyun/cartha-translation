lexical_decisions:
- source_word: מַלְכִּירָם
  choice: മൽക്കീരാം
  rationale: വംശാവലിയിലെ വ്യക്തിനാമമായതിനാൽ അർഥം പരിഭാഷപ്പെടുത്താതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: פְדָיָה
  choice: പെദായാ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു; അവസാനത്തെ ദൈവനാമഘടകം മലയാള ബൈബിൾ നാമരീതിക്ക് യോജിച്ച വിധത്തിൽ ‘യാ’ എന്നു നൽകി.
- source_word: שֶׁנְאַצַּר
  choice: ശെനസ്സർ
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങളെയും ശക്തമായ צ വ്യഞ്ജനത്തെയും വായനാസൗകര്യത്തോടെ പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: יְקַמְיָה
  choice: യെക്കമ്യാ
  rationale: ആദ്യത്തെ ഹീബ്രു യോദിനെ ‘യെ’ എന്നും അവസാനത്തെ -יָה ഘടകത്തെ ‘യാ’ എന്നും ലിപ്യന്തരിച്ചു.
- source_word: הוֹשָׁמָע
  choice: ഹോശാമാ
  rationale: ഹീബ്രു സ്വരക്രമവും ശീൻ വ്യഞ്ജനവും വ്യക്തമായി നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: נְדַבְיָה
  choice: നെദബ്യാ
  rationale: പേരിന്റെ ഹീബ്രു വ്യഞ്ജന-സ്വരരൂപം നിലനിർത്തി, അവസാനത്തെ -יָה ഘടകം ‘യാ’ എന്നു നൽകി.
- source_word: וּ / וְ
  choice: എന്നിവർ
  rationale: ഹീബ്രുവിൽ ഓരോ പേരിനോടും ചേർന്നിരിക്കുന്ന പട്ടികാസംയോജകത്തെ മലയാളത്തിൽ ആവർത്തിക്കുന്നത് കൃത്രിമമായതിനാൽ, പേരുകൾ കോമകൊണ്ട് വേർതിരിച്ച് അവസാനം ‘എന്നിവർ’ ചേർത്ത് പട്ടികാസ്വഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
