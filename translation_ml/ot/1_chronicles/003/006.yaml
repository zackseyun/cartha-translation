    issue: The first name is transliterated as “യിബ്ഹാർ.”
    rationale: 'יִבְחָר is yivḥar: the undotted ב is /v/ and ח is a separate guttural consonant. “യിവ്ഹാർ” more closely reflects these consonants without imposing a semantic rendering.'
  - severity: medium
    issue: The third name is transliterated as “എലീഫേലെത്ത്.”
    rationale: In אֱלִיפָלֶט, the syllable following פ is qamets /ā/, not /ē/. “എലീഫാലെത്ത്” better reflects the Hebrew form.
  - severity: low
    issue: The footnote repeats “യിബ്ഹാർ” as both the main form and an alternative.
    rationale: This is internally uninformative and should be replaced with a clear statement of genuine spelling/transliteration variation.
