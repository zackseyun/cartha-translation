lexical_decisions:
- source_word: וּ/בֶן שְׁלֹמֹה
  choice: ശലോമോന്റെ മകൻ
  rationale: വംശാവലിയിലെ അടുത്ത കണ്ണിയെ പരിചയപ്പെടുത്തുന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ഇങ്ങനെ നൽകുന്നു; മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന ו എന്ന സംയോജകത്തിന്റെ ആശയം വംശാവലിയുടെ തുടർച്ചയിൽ വ്യക്തമാണ്.
- source_word: רְחַבְעָם
  choice: രെഹബെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲבִיָּה
  choice: അബീയാവ്
  rationale: ഇവിടെയുള്ള എബ്രായ രൂപം അֲבִיָּה എന്നതാണ്; രാജാക്കന്മാരിൽ ചിലയിടങ്ങളിൽ കാണുന്ന വ്യത്യസ്ത നാമരൂപമായ അബീയാമിനെ മുഖ്യപാഠത്തിൽ കലർത്തിയിട്ടില്ല.
- source_word: בְנ/וֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം സൂചിപ്പിക്കുന്ന പിതൃപുത്രബന്ധവും വംശാവലിയുടെ ആവർത്തനതാളവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אָסָא
  choice: ആസാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יְהוֹשָׁפָט
  choice: യെഹോശാഫാത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
