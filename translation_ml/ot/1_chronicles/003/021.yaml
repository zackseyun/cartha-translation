  text: וּ/בֶן חֲנַנְיָ֖ה פְּלַטְיָ֣ה וִ/ישַֽׁעְיָ֑ה בְּנֵ֤י רְפָיָה֙ בְּנֵ֣י אַרְנָ֔ן בְּנֵ֥י עֹבַדְיָ֖ה בְּנֵ֥י שְׁכַנְיָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/021.yaml
  text: 'And the sons of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah[a], the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'
translation:
  language: ml
  text: 'ഹനന്യാവിന്റെ മകൻ: പെലത്യാവും യെശയ്യാവും; രെഫായാവിന്റെ പുത്രന്മാർ[a], അർനാന്റെ പുത്രന്മാർ, ഓബദ്യാവിന്റെ പുത്രന്മാർ, ശെഖന്യാവിന്റെ പുത്രന്മാർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇവിടത്തെ എബ്രായ വാക്യഘടന ചുരുക്കമുള്ളതും അല്പം ദുഷ്കരവുമാണ്. അക്ഷരാർഥത്തിൽ അത്: “ഹനന്യാവിന്റെ മകൻ: പെലത്യാവും യെശയ്യാവും; രെഫായാവിന്റെ പുത്രന്മാർ, അർനാന്റെ പുത്രന്മാർ, ഓബദ്യാവിന്റെ പുത്രന്മാർ, ശെഖന്യാവിന്റെ പുത്രന്മാർ” എന്നാണ്. ഈ നിരയുടെ ഒരു ഭാഗത്തെ ചിലർ നേരിട്ടുള്ള പുത്രന്മാരുടെ പട്ടികയായല്ല, വിശാലമായ ഒരു സന്തതിപരമ്പരയായാണ് മനസ്സിലാക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן
  choice: ഹനന്യാവിന്റെ പുത്രന്മാർ
  rationale: എബ്രായപാഠത്തിൽ ‘മകൻ’ എന്ന ഏകവചനമാണെങ്കിലും പിന്നാലെ പെലത്യാവ്, യെശയ്യാവ് എന്നീ രണ്ടു പേരുകൾ വരുന്നു. സ്വാഭാവികമായ മലയാളത്തിനായി ബഹുവചനം മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുകയും പാഠത്തിന്റെ അസാധാരണത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: חֲנַנְיָה
  choice: ഹനന്യാവ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾ നാമരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: פְּלַטְיָה
  choice: പെലത്യാവ്
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തെ സമീപിക്കുന്ന മലയാളരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וִישַׁעְיָה
  choice: യെശയ്യാവ്
  rationale: ബന്ധപ്പെട്ട മറ്റൊരു നാമരൂപവുമായി അനാവശ്യമായി ലയിപ്പിക്കാതെ ഇവിടത്തെ എബ്രായരൂപം പ്രതിഫലിപ്പിച്ചു.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയിൽ ഇത് ‘പുത്രന്മാർ’ എന്നും കൂടുതൽ വ്യാപകമായി ‘സന്തതികൾ’ എന്നും അർഥമാക്കാം. തലമുറകളുടെ കൃത്യമായ അകലം നിർണയിക്കാതെ ആവർത്തിത എബ്രായഘടന നിലനിർത്താൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു.
- source_word: רְפָיָה
  choice: രെഫായാവ്
  rationale: വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: אַרְנָן
  choice: അർനാൻ
  rationale: വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: עֹבַדְיָה
  choice: ഓബദ്യാവ്
  rationale: വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: שְׁכַנְיָה
  choice: ശെഖന്യാവ്
  rationale: വ്യക്തിനാമം എബ്രായ വ്യഞ്ജനരൂപം വേർതിരിച്ചുകാട്ടുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: ആവർത്തിക്കുന്ന בְּנֵי എന്ന പദം അടുത്ത തലമുറയിലെ പുത്രന്മാരെയോ പൊതുവായ സന്തതികളെയോ സൂചിപ്പിക്കുന്നുവോ എന്ന അനിശ്ചിതത്വം
  choice: മുഖ്യപാഠത്തിൽ ‘പുത്രന്മാർ’ എന്ന് നൽകി
  alternative: ‘സന്തതികൾ’
  rationale: വംശാവലിയുടെ തലമുറബന്ധം പാഠം വ്യക്തമായി നിർണയിക്കുന്നില്ല. അതിനാൽ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘സന്തതികൾ’ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള വംശാവലി ശൈലി. എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്തിയിരിക്കുന്നു; എന്നാൽ രണ്ടു പേരുകൾക്കു മുമ്പുള്ള അസാധാരണ ഏകവചനം വായനാസൗകര്യത്തിനായി മുഖ്യപാഠത്തിൽ ബഹുവചനമാക്കി, മൂലരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
