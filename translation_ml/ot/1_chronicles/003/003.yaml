- from: അഞ്ചാമൻ, അബീതാലിൽ ജനിച്ച ശെഫത്യാവ്;[a] ആറാമൻ, ദാവീദിന്റെ ഭാര്യയായ എഗ്ലായിൽ ജനിച്ച ഇത്രെയാം.[b]
  to: അഞ്ചാമൻ, അബീതാലിനു ജനിച്ച ശെഫത്യാവ്; ആറാമൻ, ദാവീദിന്റെ ഭാര്യയായ എഗ്ലായ്ക്കു ജനിച്ച ഇത്രെയാം.
  rationale: Maternal relationship is clarified by replacing potentially locative ‘-ഇൽ’ forms with Malayalam dative forms meaning ‘born to.’ The text otherwise retains the draft’s source-faithful handling of the ordinals, names, and Eglah’s designation as David’s wife. In typesetting, place [a] after ‘അബീതാലിനു’ and [b] after ‘എഗ്ലായ്ക്കു’ (or after ‘ദാവീദിന്റെ ഭാര്യയായ എഗ്ലാ’) to match the notes’ scope.
