source:
  edition: WLC
  text: הַ/חֲמִישִׁ֥י שְׁפַטְיָ֖ה לַ/אֲבִיטָ֑ל הַ/שִּׁשִּׁ֥י יִתְרְעָ֖ם לְ/עֶגְלָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/003.yaml
  text: the fifth[a], Shephatiah, by Abital; the sixth, Ithream[b], by Eglah his wife.
translation:
  language: ml
  text: അഞ്ചാമൻ, അബീതാലിനു ജനിച്ച ശെഫത്യാവ്; ആറാമൻ, ദാവീദിന്റെ ഭാര്യയായ എഗ്ലായ്ക്കു ജനിച്ച ഇത്രെയാം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: അഞ്ചാമൻ
  rationale: നിശ്ചയാർഥക ഘടകത്തോടുകൂടിയ ക്രമസംഖ്യയാണ്; ദാവീദിന്റെ പുത്രന്മാരുടെ എണ്ണിപ്പറയുന്ന പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമായി തുടരുന്നു.
- source_word: שְׁפַטְיָה
  choice: ശെഫത്യാവ്
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം നൽകി.
- source_word: לַאֲבִיטָל
  choice: അബീതാലിൽ ജനിച്ച
  rationale: ഈ വംശാവലിസൂത്രത്തിൽ ל മാതൃത്വബന്ധം സൂചിപ്പിക്കുന്നു. അർഥം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘ജനിച്ച’ എന്നു പ്രയോഗിച്ചു; അക്ഷരാർഥത്തിലെ ബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַשִּׁשִּׁי
  choice: ആറാമൻ
  rationale: മുൻ ക്രമസംഖ്യയ്ക്കു സമാന്തരമായി പട്ടികയുടെ ഘടന നിലനിർത്തുന്നു.
- source_word: יִתְרְעָם
  choice: ഇത്രെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: לְעֶגְלָה
  choice: എഗ്ലായിൽ ജനിച്ച
  rationale: ല എന്ന ഉപസർഗം ഇവിടെ മാതൃത്വബന്ധം സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘ജനിച്ച’ എന്നു നൽകി.
- source_word: אִשְׁתּוֹ
  choice: ദാവീദിന്റെ ഭാര്യയായ
  rationale: പ്രത്യയത്തോടുകൂടിയ אִשָּׁה എന്ന പദത്തിന് വിവാഹസന്ദർഭത്തിൽ ‘അവന്റെ ഭാര്യ’ എന്നാണ് അർഥം. മലയാളത്തിൽ സർവനാമസംബന്ധമായ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായ ദാവീദിന്റെ പേര് ഉപയോഗിച്ചു.
theological_decisions:
- issue: ‘അവന്റെ ഭാര്യ’ എന്ന പ്രയോഗത്തിന്റെ സൂചിതവ്യക്തിയും എഗ്ലായുടെ തിരിച്ചറിയലും
  choice: എഗ്ലാ ദാവീദിന്റെ ഭാര്യയായിരുന്നു എന്ന നേരിട്ടുള്ള വംശാവലിക്കുറിപ്പ് മാത്രം നിലനിർത്തി.
  alternative: എഗ്ലായ്ക്ക് മറ്റു ഭാര്യമാരെക്കാൾ പ്രത്യേക പദവിയുണ്ടായിരുന്നുവെന്നോ അവൾ മീഖൾ തന്നെയായിരുന്നുവെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായ പാഠം എഗ്ലായെ ‘അവന്റെ ഭാര്യ’ എന്നു മാത്രമേ വിശേഷിപ്പിക്കുന്നുള്ളൂ. ഈ പ്രത്യേക പരാമർശത്തിന്റെ കാരണം വ്യക്തമാക്കാത്തതിനാൽ, പാഠത്തിനു പുറത്തുള്ള തിരിച്ചറിയലോ പദവിയോ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. ‘അബീതാലിൽ/എഗ്ലായിൽ ജനിച്ച’ എന്ന പ്രയോഗം മലയാളത്തിൽ മാതൃത്വം വ്യക്തമായി അറിയിക്കുന്നു. പേരുകൾ എബ്രായരൂപത്തോട് അടുത്ത് ലിപ്യന്തരിച്ചു; അനുമാനപരമായ തിരിച്ചറിയൽ മുഖ്യവാചകത്തിൽ ചേർത്തില്ല.
