  yaml_path: translation/ot/1_chronicles/003/013.yaml
  text: Ahaz his son[a], Hezekiah his son, Manasseh his son.
translation:
  language: ml
  text: ആഹാസ് അവന്റെ മകൻ[a], ഹിസ്കീയാവ് അവന്റെ മകൻ, മനശ്ശെ അവന്റെ മകൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വംശാവലികളിൽ ‘മകൻ’ എന്ന എബ്രായപദം ചിലപ്പോൾ കൂടുതൽ വിശാലമായ അർഥത്തിൽ ‘സന്തതി’യെയും സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ മൂലപാഠം പതിവായ ‘അവന്റെ മകൻ’ എന്ന സൂത്രവാക്യമാണ് ഉപയോഗിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחָז
  choice: ആഹാസ്
  rationale: വ്യക്തിനാമം; മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ നാമരൂപം സ്വീകരിച്ചു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: בן എന്ന നാമത്തിന് മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയം ചേർന്ന രൂപം ഏറ്റവും നേരിട്ട് ‘അവന്റെ മകൻ’ എന്നാണ്. വംശാവലികളിൽ ഇത് ചിലപ്പോൾ വിശാലമായി ‘സന്തതി’യെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ ആവർത്തിക്കുന്ന സൂത്രവാക്യം അക്ഷരാർഥത്തിൽ നിലനിർത്തി.
- source_word: חִזְקִיָּהוּ
  choice: ഹിസ്കീയാവ്
  rationale: വ്യക്തിനാമം; മൂലഭാഷയോട് ചേർന്നതും മലയാള വായനക്കാർക്ക് പരിചിതവുമായ നാമരൂപം.
- source_word: מְנַשֶּׁה
  choice: മനശ്ശെ
  rationale: വ്യക്തിനാമം; മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ നാമരൂപം സ്വീകരിച്ചു.
theological_decisions: []
