source:
  edition: WLC
  text: וּ/בְנֵ֣י פְדָיָ֔ה זְרֻבָּבֶ֖ל וְ/שִׁמְעִ֑י וּ/בֶן זְרֻבָּבֶל֙ מְשֻׁלָּ֣ם וַ/חֲנַנְיָ֔ה וּ/שְׁלֹמִ֖ית אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
translation:
  language: ml
  text: 'പെദായാവിന്റെ പുത്രന്മാർ: സെരുബ്ബാബേലും ശിമെയിയും. സെരുബ്ബാബേലിന്റെ പുത്രന്മാർ[a]: മെശുല്ലാമും ഹനന്യാവും; ശെലോമീത്ത് അവരുടെ സഹോദരിയായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ഇവിടെ ‘സെരുബ്ബാബേലിന്റെ പുത്രൻ’ എന്ന് ഏകവചനത്തിലാണ്. എന്നാൽ തുടർന്ന് മെശുല്ലാം, ഹനന്യാവ് എന്നീ രണ്ടു പേരുകൾ വരുന്നതിനാൽ ഇത് പാഠത്തിലെ ക്രമക്കേടായോ വംശാവലിയിൽ കൂട്ടായ അർഥത്തിൽ ഉപയോഗിച്ച ഏകവചനമായോ പലരും മനസ്സിലാക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  choice: പെദായാവിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ בְנֵי എന്നത് സ്വാഭാവികമായി ‘പുത്രന്മാർ’ എന്നാണ്; തുടക്കത്തിലെ וּ ബന്ധകത്തെ മലയാളത്തിലെ പട്ടികാശൈലിയിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: זְרֻבָּבֶל וְשִׁמְעִי
  choice: സെരുബ്ബാബേലും ശിമെയിയും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ ബൈബിൾനാമങ്ങളുടെ സ്വാഭാവിക ലിപ്യന്തരണരീതിയിൽ നൽകി; ഹീബ്രു സംയോജകത്തെ ‘-ഉം ... -ഉം’ എന്ന സമാന്തര ഘടനയിൽ നിലനിർത്തി.
- source_word: וּבֶן זְרֻבָּבֶל
  choice: സെരുബ്ബാബേലിന്റെ പുത്രന്മാർ[a]
  rationale: മസോരറ്റിക് പാഠത്തിൽ בֶן ഏകവചനമാണെങ്കിലും തുടർന്ന് രണ്ട് പുരുഷനാമങ്ങൾ വരുന്നതിനാൽ സന്ദർഭം ബഹുവചന അർഥം സൂചിപ്പിക്കുന്നു. വായനാസൗകര്യത്തിനായി മുഖ്യപാഠത്തിൽ ബഹുവചനം സ്വീകരിച്ച് യഥാർഥ ഏകവചനരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: מְשֻׁלָּם וַחֲנַנְיָה
  choice: മെശുല്ലാമും ഹനന്യാവും
  rationale: രണ്ട് വ്യക്തിനാമങ്ങളെയും ലിപ്യന്തരം ചെയ്ത് സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവിക സമാന്തരഘടനയിൽ പ്രകടിപ്പിച്ചു.
- source_word: וּשְׁלֹמִית אֲחוֹתָם
  choice: ശെലോമീത്ത് അവരുടെ സഹോദരിയായിരുന്നു
  rationale: אֲחוֹתָם എന്നതിലെ ബഹുവചന പ്രത്യയം ‘അവരുടെ’ എന്ന് നിലനിർത്തി; ഹീബ്രുവിലെ ക്രിയയില്ലാത്ത നാമവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ആയിരുന്നു’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. പേരുകൾ മൂലഹീബ്രുവിനോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരം ചെയ്തു; അനാവശ്യമായി ബന്ധകങ്ങൾ ആവർത്തിക്കാതെ പട്ടികയുടെ വ്യക്തത നിലനിർത്തി.
