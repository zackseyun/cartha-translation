id: 1CH.3.5
reference: 1 Chronicles 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֥לֶּה נוּלְּדוּ ל֖/וֹ בִּ/ירוּשָׁלָ֑יִם שִׁ֠מְעָא וְ/שׁוֹבָ֞ב וְ/נָתָ֤ן וּ/שְׁלֹמֹה֙ אַרְבָּעָ֔ה לְ/בַת שׁ֖וּעַ בַּת עַמִּיאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/005.yaml
  text: 'These were born to him in Jerusalem: Shimea[a], Shobab, Nathan[b], and Solomon—four by Bath-shua daughter of Ammiel.'
translation:
  language: ml
  text: 'യെരൂശലേമിൽ അവനു ജനിച്ചവർ ഇവരാണ്: ശിമെയാ[a], ശോബാബ്, നാഥാൻ, ശലോമോൻ—അമ്മീയേലിന്റെ മകളായ ബത്ത്-ശൂവയ്ക്ക് ജനിച്ച നാലുപേർ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 ശമൂവേൽ 5:14-ലെ സമാന്തരപാഠത്തിൽ ഈ പേര് ശമ്മൂവ എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: 2 ശമൂവേൽ 11:3-ൽ ഇവളെ ഏലീയാമിന്റെ മകളായ ബത്ത്-ശേബ എന്നു വിളിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവരാണ്
  rationale: വംശാവലിയിലെ അടുത്ത വിഭാഗത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ നിർദേശകപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: נוּלְּדוּ לוֹ
  choice: അവനു ജനിച്ചവർ
  rationale: ילד എന്ന ക്രിയയുടെ നിഫാൽ കർമണിപ്രയോഗവും മുൻസന്ദർഭത്തിലെ ദാവീദിനെ സൂചിപ്പിക്കുന്ന സർവനാമവും നിലനിർത്തുന്നു.
- source_word: בִּירוּשָׁלָיִם
  choice: യെരൂശലേമിൽ
  rationale: ജനനസ്ഥലം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള സ്ഥലസൂചകപ്രയോഗം.
- source_word: שִׁמְעָא
  choice: ശിമെയാ
  rationale: ദിനവൃത്താന്തത്തിലെ മസോററ്റിക് പാഠത്തിലുള്ള പേരുരൂപം തന്നെയാണ് സ്വീകരിച്ചത്; ശമൂവേലിലെ സമാന്തരപാഠവുമായി ഏകീകരിച്ചിട്ടില്ല.
- source_word: שׁוֹבָב
  choice: ശോബാബ്
  rationale: എബ്രായ പേരിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: נָתָן
  choice: നാഥാൻ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതവും എബ്രായരൂപത്തോട് ചേർന്നതുമായ പേരുരൂപം.
- source_word: שְׁלֹמֹה
  choice: ശലോമോൻ
  rationale: അറിയപ്പെടുന്ന രാജാവിന്റെ പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിക്കുന്നു.
- source_word: אַרְבָּעָה
  choice: ഈ നാലുപേർ
  rationale: മുമ്പ് പറഞ്ഞ നാല് പുത്രന്മാരെയും സംഗ്രഹിക്കുന്ന സംഖ്യാവാചകം വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: לְבַת שׁוּעַ
  choice: ബത്ത്-ശൂവയിൽ ജനിച്ച
  rationale: ഈ സന്ദർഭത്തിൽ മാതൃത്വം സൂചിപ്പിക്കുന്ന לְ എന്ന മുൻപ്രത്യയത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּת עַמִּיאֵל
  choice: അമ്മീയേലിന്റെ മകളായ
  rationale: പിതൃബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദിനവൃത്താന്തത്തിലെയും ശമൂവേലിലെ സമാന്തരപാഠത്തിലെയും ദാവീദിന്റെ ഭാര്യയുടെ പേരുരൂപം
  choice: അമ്മീയേലിന്റെ മകളായ ബത്ത്-ശൂവ
  alternative: ഏലീയാമിന്റെ മകളായ ബത്ത്-ശേബ
  rationale: ദിനവൃത്താന്തത്തിന്റെ എബ്രായ മൂലപാഠത്തിലുള്ള പേരുകൾ സമാന്തരപാഠവുമായി നിശ്ശബ്ദമായി ഏകീകരിക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി; പരിചിതമായ മറ്റുരൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി സ്വീകരിച്ചു. പേരുകളുടെ വ്യത്യസ്ത പാഠരൂപങ്ങൾ മുഖ്യവാക്യത്തിൽ ഏകീകരിക്കാതെ, അവയുടെ ശരിയായ സ്ഥാനങ്ങളിൽ അടിക്കുറിപ്പുകൾ ചേർത്തു.
