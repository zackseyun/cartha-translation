id: 1CH.3.16
reference: 1 Chronicles 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֖י יְהוֹיָקִ֑ים יְכָנְיָ֥ה בְנ֖/וֹ צִדְקִיָּ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
translation:
  language: ml
  text: 'യഹോയാക്കീമിന്റെ പുത്രന്മാർ: യെഖൊന്യാവ് അവന്റെ മകൻ[a], സിദെക്കീയാവ് അവന്റെ മകൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം സംക്ഷിപ്തമായി, “യെഖൊന്യാവ് അവന്റെ മകൻ, സിദെക്കീയാവ് അവന്റെ മകൻ” എന്നാണ്. ഇത് ലളിതമായ ഒരു വംശക്രമമായി വായിക്കാം. എന്നാൽ ഇവിടെ ഇരുവരെയും യഹോയാക്കീമിന്റെ പുത്രന്മാരായി പട്ടികപ്പെടുത്തുന്നുവോ, അതോ വാക്യക്രമമനുസരിച്ച് സിദെക്കീയാവ് യെഖൊന്യാവിന്റെ മകനാണോ എന്നതിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: בְּנֵי എന്നത് ‘പുത്രന്മാർ’ എന്നർഥമുള്ള സംയുക്ത ബഹുവചനരൂപമാണ്; ഇത് വംശാവലിപ്പട്ടിക അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ പട്ടികാശൈലിയിൽ ആരംഭത്തിലെ ו പ്രത്യേകം ‘കൂടാതെ’ എന്നു വിവർത്തനം ചെയ്യാതെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: יְהוֹיָקִים
  choice: യഹോയാക്കീം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തോട് ചേർന്നുനിൽക്കുന്നു.
- source_word: יְכָנְיָה
  choice: യെഖൊന്യാവ്
  rationale: ഇവിടെയുള്ള എബ്രായരൂപമായ יְכָנְיָהയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം; ‘യെഹോയാഖീൻ’ പോലുള്ള സമാന്തര നാമരൂപം പകരംവയ്ക്കുന്നില്ല.
- source_word: בְנ֖/וֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയമുള്ള בֵּן എന്ന പദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ വിവർത്തനം; എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: צִדְקִיָּה
  choice: സിദെക്കീയാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ളതും ഉറവിടരൂപത്തോട് ചേർന്നുനിൽക്കുന്നതുമായ ലിപ്യന്തരണം.
- source_word: בְנֽ/וֹ
  choice: അവന്റെ മകൻ
  rationale: ആവർത്തിക്കുന്ന വംശാവലിസൂചകം ഒഴിവാക്കാതെ വിവർത്തനം ചെയ്യുന്നു; ഇതിലൂടെ ഉറവിടത്തിലെ സംക്ഷിപ്തതയും സർവനാമത്തിന്റെ യഥാർഥ സൂചനയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വവും നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ദുഷ്കരമായ വംശാവലിവാക്യത്തിലെ ബന്ധക്രമം
  choice: ‘അവന്റെ മകൻ യെഖൊന്യാവ്, അവന്റെ മകൻ സിദെക്കീയാവ്’ എന്ന എബ്രായ ക്രമവും ആവർത്തനവും അതേപടി നിലനിർത്തുന്നു.
  alternative: യെഖൊന്യാവും സിദെക്കീയാവും ഇരുവരും യഹോയാക്കീമിന്റെ പുത്രന്മാരാണെന്ന് വ്യക്തമായി പട്ടികപ്പെടുത്തുക; അല്ലെങ്കിൽ സിദെക്കീയാവ് യെഖൊന്യാവിന്റെ മകനാണെന്ന് നിർവ്യാജമാക്കുക.
  rationale: എബ്രായവാക്യം സംക്ഷിപ്തമാണ്; ഓരോ പേരിനുശേഷവും ‘അവന്റെ മകൻ’ എന്നു പറയുന്നു. മറ്റു ചരിത്രവിവരണങ്ങളുമായി പൊരുത്തപ്പെടുത്താൻ ബന്ധം നിർണയിക്കാതെ, ഉറവിടത്തിലെ യഥാർഥ വ്യാകരണപരമായ പിരിമുറുക്കം പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ള വംശാവലിശൈലി. ‘പുത്രന്മാർ’ എന്നത് ഔപചാരികമായ വംശാവലിപദമായി ഉപയോഗിച്ചു; ആവർത്തിക്കുന്ന ‘അവന്റെ മകൻ’ ഉറവിടത്തിലെ ഘടനയും അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
