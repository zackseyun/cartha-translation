lexical_decisions:
- source_word: אָמ֥וֹן
  choice: ആമോൻ
  rationale: യെഹൂദാരാജാവിന്റെ വ്യക്തിനാമം; മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּנ֖וֹ
  choice: അവന്റെ മകൻ
  rationale: בֵּן എന്ന നാമത്തോടു ചേർന്ന മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം അക്ഷരാർഥത്തിൽ ‘അവന്റെ മകൻ’ എന്നാണ്; വംശാവലിയുടെ ആവർത്തിത ഘടന നിലനിർത്തുന്നു.
- source_word: יֹאשִׁיָּ֥הוּ
  choice: യോശീയാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമമായ יֹאשִׁיָּהוּ-യുടെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾരൂപം സ്വീകരിച്ചു.
- source_word: בְנֽוֹ
  choice: അവന്റെ മകൻ
  rationale: ആവർത്തിക്കുന്ന വംശാവലിസൂത്രം ഒരേ രീതിയിൽ പരിഭാഷപ്പെടുത്തി, പിതൃപുത്ര പിന്തുടർച്ച വ്യക്തമാക്കി.
