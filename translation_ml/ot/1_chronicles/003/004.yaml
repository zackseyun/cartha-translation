  variant: modern standard Malayalam
source:
  edition: WLC
  text: שִׁשָּׁה֙ נֽוֹלַד ל֣/וֹ בְ/חֶבְר֔וֹן וַ/יִּ֨מְלָךְ שָׁ֔ם שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֣ה חֳדָשִׁ֑ים וּ/שְׁלֹשִׁ֤ים וְ/שָׁלוֹשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/004.yaml
  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: ml
  text: ഹെബ്രോനിൽ അദ്ദേഹത്തിന് ആറു പുത്രന്മാർ ജനിച്ചു. അവിടെ അദ്ദേഹം ഏഴു വർഷവും ആറു മാസവും രാജാവായി ഭരിച്ചു; യെരൂശലേമിൽ അദ്ദേഹം മുപ്പത്തിമൂന്നു വർഷം രാജാവായി ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה
  choice: ആറു പുത്രന്മാർ
  rationale: മുൻവാക്യങ്ങളിൽ പട്ടികപ്പെടുത്തിയ ദാവീദിന്റെ പുത്രന്മാരെയാണ് സംഖ്യ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ സന്ദർഭത്തിൽനിന്നുള്ള ‘പുത്രന്മാർ’ ചേർത്തു; ‘ഈ ആറുപേർ’ എന്നത് എബ്രായത്തിൽ തുറന്നുപറയാത്ത നിർദ്ദേശാർഥം കൂട്ടിച്ചേർക്കും.
- source_word: נוֹלַד לוֹ
  choice: അദ്ദേഹത്തിന് ... ജനിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ നിഫാൽ രൂപവും ל־ ചേർന്ന സർവനാമവും ഉള്ള എബ്രായ നിർമാണത്തിന്റെ നിഷ്ക്രിയഭാവം നിലനിർത്തുന്നു; ‘അദ്ദേഹം ജനിപ്പിച്ചു’ എന്ന സജീവവും കൂടുതൽ വ്യാഖ്യാനാത്മകവുമായ പ്രയോഗം ഒഴിവാക്കി.
- source_word: בְחֶבְרוֹן
  choice: ഹെബ്രോനിൽവെച്ച്
  rationale: സ്ഥലസൂചകമായ בְ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּמְלָךְ שָׁם
  choice: അവിടെ അദ്ദേഹം ... രാജാവായി ഭരിച്ചു
  rationale: מלך ഇവിടെ രാജത്വം പ്രയോഗിച്ച് ഭരിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘രാജാവായി’ മാത്രം എന്നതിനെക്കാൾ ‘രാജാവായി ഭരിച്ചു’ ആ അർഥം വ്യക്തമായി നൽകുന്നു; സ്ഥാനാരോഹണം മാത്രം സൂചിപ്പിക്കുന്നില്ല.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: ഏഴു വർഷവും ആറു മാസവും
  rationale: കാലദൈർഘ്യപ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: וּשְׁלֹשִׁים וְשָׁלוֹשׁ שָׁנָה
  choice: മുപ്പത്തിമൂന്നു വർഷം
  rationale: എബ്രായത്തിലെ ‘മുപ്പതും മൂന്നും’ എന്ന സംഖ്യാക്രമം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തസംഖ്യയായി നൽകി.
- source_word: מָלַךְ בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ അദ്ദേഹം ... രാജാവായി ഭരിച്ചു
  rationale: എബ്രായത്തിലെ സ്ഥാനമാറ്റത്തിനുള്ള ഊന്നൽ നിലനിർത്താൻ സ്ഥലനാമം ഉപവാക്യത്തിന്റെ തുടക്കത്തിൽ വെച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. ദാവീദിനെ സൂചിപ്പിക്കാൻ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. പേരുകൾ മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ ‘ഹെബ്രോൻ’, ‘യെരൂശലേം’ എന്നീ രൂപങ്ങളിൽ നൽകി.
