id: 1CH.3.11
reference: 1 Chronicles 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יוֹרָ֥ם בְּנ֛/וֹ אֲחַזְיָ֥הוּ בְנ֖/וֹ יוֹאָ֥שׁ בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/011.yaml
  text: Joram his son[a], Ahaziah his son[c][b], Joash his son.
translation:
  language: ml
  text: അവന്റെ മകൻ[a] യോരാം[b]; അവന്റെ മകൻ അഹസ്യാവ്; അവന്റെ മകൻ യോവാശ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വംശാവലികളിൽ ‘മകൻ’ എന്ന പദം ചിലപ്പോൾ പിന്നീടുള്ള ഒരു സന്തതിയെയും സൂചിപ്പിക്കാം. എന്നാൽ ഇവിടെ രാജവംശത്തിന്റെ അനുക്രമം ചുരുക്കമായി കൊടുക്കുന്നതിനാൽ ‘മകൻ’ എന്നു തന്നെയാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: യോരാം എന്ന പേര് മറ്റു ചില വേദഭാഗങ്ങളിൽ യെഹോരാം എന്ന ദീർഘരൂപത്തിലും കാണപ്പെടുന്നു.
    reason: name_variant
  - marker: c
    text: യോവാശ് എന്ന പേര് മറ്റു ചില വേദഭാഗങ്ങളിൽ യെഹോവാശ് എന്ന ദീർഘരൂപത്തിലും കാണപ്പെടുന്നു.
    reason: name_variant
lexical_decisions:
- source_word: יוֹרָם
  choice: യോരാം
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ സ്വാഭാവികമായ മലയാള ലിപ്യന്തരണം; വംശാവലിയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തുന്നു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: בֵּן എന്ന പദത്തോടു ചേർന്ന മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം നേരിട്ട് ‘അവന്റെ മകൻ’ എന്നാണ് അർഥമാക്കുന്നത്. വംശാവലികളിൽ ഇത് ചിലപ്പോൾ പിന്നീടുള്ള സന്തതിയെയും സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ രാജാക്കന്മാരുടെ തുടർച്ചയായ അനുക്രമമാണ് കൊടുത്തിരിക്കുന്നത്.
- source_word: אֲחַזְיָהוּ
  choice: അഹസ്യാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം സ്വീകരിച്ചു.
- source_word: יוֹאָשׁ
  choice: യോവാശ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം സ്വീകരിച്ചു; ഇതേ പേരിന്റെ ദീർഘരൂപം മറ്റു സന്ദർഭങ്ങളിൽ യെഹോവാശ് എന്നു വരാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലപാഠത്തിലെ ക്രിയയില്ലാത്ത സംക്ഷിപ്ത രാജവംശപ്പട്ടികയുടെ താളം അർദ്ധവിരാമങ്ങളിലൂടെ നിലനിർത്തി. ഓരോ ‘അവന്റെ’ എന്നതും തൊട്ടുമുമ്പുള്ള രാജാവിനെ സൂചിപ്പിക്കുന്ന അനുക്രമഘടനയായി വായിക്കാം.
