translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ വംശാവലി ശൈലി. മലയാളത്തിൽ ബന്ധങ്ങൾ വ്യക്തമായി വായിക്കാനായി എബ്രായത്തിലെ നാമക്രമം സ്വാഭാവികമായ ഉടമസ്ഥബന്ധക്രമത്തിലാക്കി; അർഥപരമായ വിവരങ്ങളൊന്നും ചേർക്കുകയോ ഒഴിവാക്കുകയോ ചെയ്തിട്ടില്ല.
