id: 1CH.3.1
reference: 1 Chronicles 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י דָויִ֔ד אֲשֶׁ֥ר נֽוֹלַד ל֖/וֹ בְּ/חֶבְר֑וֹן הַ/בְּכ֣וֹר אַמְנֹ֗ן לַ/אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית שֵׁנִי֙ דָּנִיֵּ֔אל לַ/אֲבִיגַ֖יִל הַֽ/כַּרְמְלִֽית־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'These were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
translation:
  language: ml
  text: 'ഹെബ്രോനിൽ ദാവീദിനു ജനിച്ച പുത്രന്മാർ ഇവരായിരുന്നു: ആദ്യജാതൻ[a] യിസ്രെയേൽക്കാരിയായ അഹീനോവാമിനു ജനിച്ച അമ്നോൻ; രണ്ടാമൻ, കർമ്മേൽക്കാരിയായ അബീഗയിലിനു ജനിച്ച ദാനീയേൽ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സമാന്തരപ്പട്ടികയായ 2 ശമൂവേൽ 3:3-ൽ ഈ പുത്രനെ ദാനീയേൽ എന്നതിനുപകരം കിലെയാബ് എന്നാണ് വിളിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ
  choice: ഇവരായിരുന്നു
  rationale: പുതിയ വംശാവലിപ്പട്ടിക അവതരിപ്പിക്കുമ്പോഴും മുൻസന്ദർഭത്തോടുള്ള ബന്ധം നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമായ കാലസൂചകമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: בְּנֵי דָוִיד
  choice: ദാവീദിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിയിലെ പുരുഷസന്തതിയെ സൂചിപ്പിക്കുന്ന ‘പുത്രന്മാർ’ എന്ന അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: ദാവീദിനു ജനിച്ച
  rationale: നിഷ്ക്രിയമായ ‘ജനിച്ചു’ എന്ന രൂപവും ദാവീദുമായുള്ള ദാതൃബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּחֶבְרוֹן
  choice: ഹെബ്രോനിൽ
  rationale: നഗരനാമത്തോടുള്ള സ്ഥാനസൂചക പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: הַבְּכוֹר
  choice: ആദ്യജാതൻ
  rationale: വെറും പ്രായക്രമത്തേക്കാൾ ജനനാവകാശവും വംശാവലിസ്ഥിതിയും സൂചിപ്പിക്കുന്ന പദം.
- source_word: לַאֲחִינֹעַם הַיִּזְרְעֵאלִית
  choice: യിസ്രെയേൽക്കാരിയായ അഹീനോവാമിൽ ജനിച്ച
  rationale: അമ്മയുടെ പേരിനു മുമ്പുള്ള לְ മാതൃത്വബന്ധം സൂചിപ്പിക്കുന്നു; സ്ത്രീലിംഗ ജനവാസവിശേഷണം സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: שֵׁנִי דָּנִיֵּאל
  choice: രണ്ടാമൻ, ദാനീയേൽ
  rationale: പട്ടികയിലെ ക്രമസംഖ്യയും ദിനവൃത്താന്തഗ്രന്ഥത്തിലെ പേരിന്റെ രൂപവും നിലനിർത്തുന്നു.
- source_word: לַאֲבִיגַיִל הַכַּרְמְלִית
  choice: കർമ്മേൽക്കാരിയായ അബീഗയിലിൽ ജനിച്ച
  rationale: മാതൃത്വബന്ധവും അബീഗയിലിന്റെ സ്ഥലപരമായ തിരിച്ചറിയലും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ദാനീയേൽ എന്ന പേരും സമാന്തരവാക്യത്തിലെ കിലെയാബ് എന്ന പേരും തമ്മിലുള്ള വ്യത്യാസം
  choice: പ്രധാനപാഠത്തിൽ WLC അനുസരിച്ച് ‘ദാനീയേൽ’ നിലനിർത്തി.
  alternative: 2 ശമൂവേൽ 3:3 അനുസരിച്ച് ‘കിലെയാബ്’ എന്നു നൽകുക.
  rationale: ഈ വാക്യത്തിന്റെ എബ്രായ സാക്ഷ്യം ദാനീയേൽ എന്നു വായിക്കുന്നു; സമാന്തരപ്പട്ടികയിലെ വ്യത്യാസം പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ അറിയിക്കുന്നത് പാഠസാക്ഷ്യങ്ങളെ മാനിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളിൽ ലിപ്യന്തരിച്ചു. ‘അവളിൽ ജനിച്ച’ എന്ന ബന്ധവാചകം ആവർത്തിച്ച് മാതൃത്വബന്ധം അസന്ദിഗ്ധമാക്കി; മൂലത്തിലെ പട്ടികാസ്വഭാവം അർദ്ധവിരാമംകൊണ്ട് നിലനിർത്തി.
