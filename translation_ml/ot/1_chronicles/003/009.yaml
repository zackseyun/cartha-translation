id: 1CH.3.9
reference: 1 Chronicles 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּ֖ל בְּנֵ֣י דָוִ֑יד מִ/לְּ/בַ֥ד בְּֽנֵי פִֽילַגְשִׁ֖ים וְ/תָמָ֥ר אֲחוֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/009.yaml
  text: All these were David’s sons[a], besides the sons of the concubines; and Tamar was their sister.
translation:
  language: ml
  text: ഇവരെല്ലാം ദാവീദിന്റെ പുത്രന്മാരായിരുന്നു, വെപ്പാട്ടികളുടെ പുത്രന്മാർക്കു പുറമേ; താമാർ അവരുടെ സഹോദരിയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּל בְּנֵי דָוִיד
  choice: ഇവരെല്ലാം ദാവീദിന്റെ പുത്രന്മാരായിരുന്നു
  rationale: כֹּל മുൻപ് പട്ടികപ്പെടുത്തിയവരെ സമഗ്രമായി സൂചിപ്പിക്കുന്നു. ബഹുവചനമായ בְּנֵי കൃത്യമായി നിലനിർത്താൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു.
- source_word: מִלְּבַד
  choice: ഇവരിൽ ഉൾപ്പെട്ടിരുന്നില്ല
  rationale: ഈ പദത്തിന് ഒഴിവാക്കലോ മുഖ്യപട്ടികയ്ക്കു പുറത്തുള്ള അധികവിഭാഗമോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ മുൻപുള്ള സംഗ്രഹത്തിൽ വെപ്പാട്ടികളുടെ പുത്രന്മാരെ ഉൾപ്പെടുത്തിയിട്ടില്ലെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי פִילַגְשִׁים
  choice: വെപ്പാട്ടികളുടെ പുത്രന്മാർ
  rationale: പുരുഷലിംഗ ബഹുവചനം ‘പുത്രന്മാർ’ എന്നു കൃത്യമായി നൽകി; രാജകുടുംബസന്ദർഭത്തിലെ פִילֶגֶשׁ എന്ന സാമൂഹികസ്ഥാനത്തിന് മലയാളത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ ‘വെപ്പാട്ടി’ ഉപയോഗിച്ചു.
- source_word: וְתָמָר אֲחוֹתָם
  choice: താമാർ അവരുടെ സഹോദരിയായിരുന്നു
  rationale: ഹീബ്രുവിലെ ക്രിയാരഹിത നാമവാക്യം സ്വാഭാവിക മലയാളത്തിനായി ‘ആയിരുന്നു’ ചേർത്ത് നൽകി; ബന്ധസൂചനയായ ബഹുവചന പ്രത്യയം ‘അവരുടെ’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: מִלְּבַד എന്ന പദബന്ധത്തിന്റെ പരിധിയും അർഥവും
  choice: വെപ്പാട്ടികളുടെ പുത്രന്മാർ മുൻപത്തെ പട്ടികപ്പെടുത്തിയ സംഗ്രഹത്തിൽ ഉൾപ്പെട്ടിരുന്നില്ലെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി.
  alternative: ‘വെപ്പാട്ടികളുടെ പുത്രന്മാർക്കു പുറമേ’ എന്ന് വായിച്ച് അവരെ പട്ടികയ്ക്കു പുറത്തുള്ള അധികവിഭാഗമായി മാത്രം പരാമർശിക്കുന്നതായി മനസ്സിലാക്കാം.
  rationale: മൂലപദം ഒഴിവാക്കലിനെയും പട്ടികയ്ക്കു പുറത്തുള്ള അധികഘടകത്തെയും അനുവദിക്കുന്നതിനാൽ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; ഒരു വംശാവലിസംബന്ധമായ നിർവചനവും സിദ്ധാന്തപരമായി ഉറപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ‘വെപ്പാട്ടി’ ചരിത്രപരമായ സാമൂഹികവിഭാഗം വ്യക്തമാക്കുന്ന പരിചിത പദമായി ഉപയോഗിച്ചു; മൂലത്തിലെ യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
