source:
  edition: WLC
  text: וּ/בְנֵי֙ יֹאשִׁיָּ֔הוּ הַ/בְּכוֹר֙ יוֹחָנָ֔ן הַ/שֵּׁנִ֖י יְהוֹיָקִ֑ים הַ/שְּׁלִשִׁי֙ צִדְקִיָּ֔הוּ הָ/רְבִיעִ֖י שַׁלּֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
translation:
  language: ml
  text: 'യോശീയാവിന്റെ പുത്രന്മാർ: ആദ്യജാതൻ[a] യോഹാനാൻ; രണ്ടാമൻ യെഹോയാക്കീം; മൂന്നാമൻ സിദെക്കീയാവ്; നാലാമൻ ശല്ലൂം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ശല്ലൂമിനെ സാധാരണയായി 2 രാജാക്കന്മാർ 23:30–34-ലെയും യിരെമ്യാവ് 22:11-ലെയും യെഹോവാഹാസുമായി തിരിച്ചറിയുന്നു; എന്നാൽ യോശീയാവിന്റെ ഈ വംശാവലിയിൽ ദിനവൃത്താന്തകാരൻ ‘ശല്ലൂം’ എന്ന പേരാണ് രേഖപ്പെടുത്തുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ו മലയാളത്തിലെ പട്ടികാശൈലിയിൽ സ്വാഭാവികമായി അന്തർലീനമാകുന്നതിനാൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർത്തില്ല; בְנֵי ഇവിടെ ഉടൻ പേരെടുത്തിരിക്കുന്ന യോശീയാവിന്റെ പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יֹאשִׁיָּהוּ
  choice: യോശീയാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം സ്വീകരിച്ചു.
- source_word: הַבְּכוֹר
  choice: ആദ്യജാതൻ
  rationale: ജനനക്രമത്തോടൊപ്പം ആദ്യജാതന്റെ സ്ഥാനവും സൂചിപ്പിക്കുന്ന בְּכוֹר എന്ന പദത്തിന്റെ നേരിട്ടും കൃത്യവുമായ പരിഭാഷ.
- source_word: יוֹחָנָן
  choice: യോഹാനാൻ
  rationale: എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണം.
- source_word: הַשֵּׁנִי
  choice: രണ്ടാമൻ
  rationale: പുത്രന്മാരുടെ ക്രമം സൂചിപ്പിക്കുന്ന ക്രമസംഖ്യ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוֹיָקִים
  choice: യെഹോയാക്കീം
  rationale: ഈ വാക്യത്തിലെ എബ്രായ നാമരൂപം തന്നെയാണ് ലിപ്യന്തരം ചെയ്തത്; മറ്റിടത്തെ എല്യാക്കീം എന്ന രൂപവുമായി സമീകരിച്ചില്ല.
- source_word: הַשְּׁלִשִׁי
  choice: മൂന്നാമൻ
  rationale: പട്ടികയിലെ ജനനക്രമം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: צִדְקִיָּהוּ
  choice: സിദെക്കീയാവ്
  rationale: എബ്രായ രാജനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം സ്വീകരിച്ചു.
- source_word: הָרְבִיעִי
  choice: നാലാമൻ
  rationale: പട്ടികയിലെ ക്രമസംഖ്യ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: שַׁלּוּם
  choice: ശല്ലൂം
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരം ചെയ്തു.
theological_decisions:
- issue: വംശാവലിയുടെ ജനനക്രമവും രാജവാഴ്ചയുടെ ക്രമവും തമ്മിലുള്ള വ്യത്യാസം
  choice: എബ്രായ പാഠത്തിൽ ഓരോ പുത്രനോടും ചേർത്തിരിക്കുന്ന ക്രമസംഖ്യകൾ അതേപടി നിലനിർത്തി.
  alternative: യോശീയാവിനുശേഷം രാജാവായവരുടെ ക്രമത്തിനനുസരിച്ച് പേരുകൾ പുനഃക്രമീകരിക്കുകയോ മുഖ്യപാഠത്തിൽ വിശദീകരണം ചേർക്കുകയോ ചെയ്യുക.
  rationale: വാക്യം രാജാക്കന്മാരുടെ ഭരണക്രമമല്ല, പുത്രന്മാരുടെ ക്രമപ്പെടുത്തിയ വംശാവലിപ്പട്ടികയാണ് നൽകുന്നത്. രാജാക്കന്മാരിലെ വിവരങ്ങളുമായി പൊരുത്തപ്പെടുത്താൻ മുഖ്യപാഠം മാറ്റുന്നത് മൂലപാഠത്തിന്റെ അവതരണം മറച്ചുകളയും.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടന നിലനിർത്താൻ അർദ്ധവിരാമങ്ങൾ പ്രയോഗിച്ചു; പേരുകൾ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകി.
