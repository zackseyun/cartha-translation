language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵי֙ יְכָנְיָ֣ה אַסִּ֔ר שְׁאַלְתִּיאֵ֖ל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/017.yaml
  text: 'And the sons of Jeconiah: Assir[a], Shealtiel his son.'
translation:
  language: ml
  text: 'യെഖൊന്യാവിന്റെ പുത്രന്മാർ: അസ്സീർ, അവന്റെ മകനായ ശെയൽത്തീയേൽ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ו മലയാളത്തിൽ സന്ദർഭംകൊണ്ട് സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നതിനാൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയില്ല; בְנֵי എന്നത് അതിന്റെ സാധാരണ വംശാവലിപരമായ അർഥത്തിൽ ‘പുത്രന്മാർ’ എന്നു നൽകി.
- source_word: יְכָנְיָה
  choice: യെഖൊന്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം ആധുനിക മലയാളലിപിയിൽ കഴിയുന്നത്ര നിലനിർത്തി; വിഭക്തി ചേർക്കാൻ ‘യെഖൊന്യാവിന്റെ’ എന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: אַסִּר
  choice: അസ്സീർ
  rationale: വംശാവലിയുടെ പട്ടികാസന്ദർഭവും മസോററ്റിക് രൂപവും പരിഗണിച്ച് മുഖ്യപാഠത്തിൽ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു. അതേ രൂപത്തിന് ‘തടവുകാരൻ’ എന്ന പൊതുനാമാർഥവും സാധ്യമായതിനാൽ ആ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: שְׁאַלְתִּיאֵל
  choice: ശെയൽതീയേൽ
  rationale: എബ്രായ നാമത്തിന്റെ ഘടകങ്ങളും ഉച്ചാരണരൂപവും പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: ഏകവചന പുരുഷലിംഗ ഉടമസ്ഥപ്രത്യയം നേരിട്ട് പ്രകടിപ്പിച്ചു. വ്യാകരണപരമായി മുൻപുള്ള അസ്സീറിനെയും സൂചിപ്പിക്കാമെങ്കിലും വാക്യഘടനയും പരമ്പരാഗത വംശാവലിവായനയും പ്രകാരം യെഖൊന്യാവിനെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: אַסִּר എന്നത് വ്യക്തിനാമമായോ ‘തടവുകാരൻ’ എന്ന വിശേഷണമായോ വായിക്കണമോ എന്നത്
  choice: മുഖ്യപാഠത്തിൽ ‘അസ്സീർ’ എന്ന വ്യക്തിനാമമായി നിലനിർത്തി.
  alternative: '‘തടവുകാരനായ യെഖൊന്യാവിന്റെ പുത്രന്മാർ: അവന്റെ മകൻ ശെയൽതീയേൽ.’'
  rationale: എബ്രായരൂപം രണ്ടു വായനകളും അനുവദിക്കുന്നു. വംശാവലിയുടെ പട്ടികാസ്വഭാവം വ്യക്തിനാമവായനയെ പിന്തുണയ്ക്കുന്നുവെങ്കിലും ചരിത്രപരമായി പ്രസക്തമായ വിശേഷണവായനയും യഥാർഥ സാധ്യതയാണ്; അതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി സ്വീകരിച്ചു. പേരുകൾ എബ്രായരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധം ലിപ്യന്തരിച്ചു; മൂലപാഠത്തിലെ യഥാർഥ ദ്വയാർഥത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
