  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും മാന്യവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. പേരുകൾ എബ്രായപാഠത്തിൽനിന്ന് നേരിട്ട് ലിപ്യന്തരണം ചെയ്തു; മൂലത്തിലെ ഏകവചനവും സന്ദർഭം ആവശ്യപ്പെടുന്ന ബഹുവചനാർഥവും തമ്മിലുള്ള സംഘർഷം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
