  language: ml
  text: 'നെയര്യാവിന്റെ പുത്രന്മാർ[a]: എല്യോവേനായി, ഹിസ്കീയാവ്, അസ്രീക്കാം—മൂന്നുപേർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘നെയര്യാവിന്റെ പുത്രൻ’ എന്ന ഏകവചനമാണ്; എന്നാൽ തുടർന്ന് മൂന്നു പേരുകൾ ചേർത്തുപറയുന്നതിനാൽ ഇവിടെ അത് പുത്രന്മാരുടെ പട്ടികയ്ക്കുള്ള തലക്കെട്ടായി പ്രവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: പുത്രന്മാർ
  rationale: എബ്രായരൂപം വ്യാകരണപരമായി ഏകവചനമായ ‘പുത്രൻ’ എന്നാണ്; എന്നാൽ തുടർന്ന് മൂന്നു പേരുകൾ വരുകയും ഒടുവിൽ ‘മൂന്ന്’ എന്നു സംഖ്യ വ്യക്തമാക്കുകയും ചെയ്യുന്നതിനാൽ, വംശാവലിയുടെ തലക്കെട്ടായി പ്രവർത്തിക്കുന്ന ഈ പദം മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനത്തിൽ നൽകി. മൂലരൂപത്തിലെ വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: נְעַרְיָה
  choice: നെയര്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶלְיוֹעֵינַי
  choice: എല്യോവേനായി
  rationale: എബ്രായ വ്യക്തിനാമം അതിന്റെ ഘടകശബ്ദങ്ങളെ പിന്തുടർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְחִזְקִיָּה
  choice: ഹിസ്കീയാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ബന്ധകമായ וְ പട്ടികയിലെ മലയാള വിരാമചിഹ്നക്രമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: וְעַזְרִיקָם
  choice: അസ്രീക്കാം
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; പട്ടികയിലെ അവസാന ബന്ധം കോമക്രമത്തിലൂടെ വ്യക്തമാകുന്നു.
- source_word: שְׁלֹשָׁה
  choice: മൂന്നുപേർ
  rationale: പട്ടികയിലുള്ള വ്യക്തികളുടെ ആകെ എണ്ണം സൂചിപ്പിക്കുന്ന സംഖ്യ മൂലപാഠംപോലെ നിലനിർത്തി; മനുഷ്യരെ എണ്ണുന്നതിനുള്ള സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
