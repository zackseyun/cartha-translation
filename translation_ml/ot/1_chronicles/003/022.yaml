  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും എളുപ്പം വായിക്കാവുന്നതുമായ വംശാവലി ശൈലി. പേരുകൾ ഇംഗ്ലീഷ് രൂപങ്ങളിൽനിന്നല്ല, മസോററ്റിക് എബ്രായ പാഠത്തിലെ ശബ്ദരൂപങ്ങളിൽനിന്ന് മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു. മൂലപാഠത്തിലെ അഞ്ചു പേരുകളും ‘ആറ്’ എന്ന സംഖ്യയും തമ്മിലുള്ള അസംഗതി തിരുത്താതെ അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
