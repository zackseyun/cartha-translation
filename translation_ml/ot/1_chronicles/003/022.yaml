  yaml_path: translation/ot/1_chronicles/003/022.yaml
  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
translation:
  language: ml
  text: 'ശെഖന്യാവിന്റെ പുത്രന്മാർ: ശെമയ്യാവ്. ശെമയ്യാവിന്റെ പുത്രന്മാർ: ഹത്തൂശ്[a], യിഗാൽ, ബാരീഹ്, നെആര്യാവ്, ശാഫാത്ത്—ആറുപേർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മസോററ്റിക് എബ്രായ പാഠത്തിൽ ഇവിടെ അഞ്ചു പേരുകൾ മാത്രമാണ് കൊടുത്തിരിക്കുന്നതെങ്കിലും എണ്ണം ‘ആറ്’ എന്നാണ്. പാഠപകർപ്പിലുണ്ടായ പ്രശ്നമോ കൈമാറ്റത്തിനിടെ ഒരു പേര് വിട്ടുപോയതോ ഇതിന് കാരണമാകാം.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי שְׁכַנְיָה
  choice: ശെഖന്യാവിന്റെ പുത്രന്മാരിൽ
  rationale: בְּנֵי എന്നത് നേരിട്ട് ‘പുത്രന്മാർ’ എന്നാണ്. എന്നാൽ പട്ടികയിൽ ശെമയ്യാവ് എന്ന ഒരേയൊരു പേര് മാത്രമുള്ളതിനാൽ, അടുത്ത വാക്യത്തിലെ ബഹുവചനവുമായി ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സ്വാഭാവിക മലയാളത്തിൽ ‘പുത്രന്മാരിൽ’ എന്നു നൽകി; മൂലത്തിലെ വംശാവലിസൂത്രം നിലനിർത്തുന്നു.
- source_word: שְׁמַעְיָה
  choice: ശെമയ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; അവസാനത്തെ ദൈവനാമഘടകത്തെ മലയാള ബൈബിൾ നാമശൈലിക്ക് യോജിച്ച ‘-യാവ്’ എന്ന രൂപത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: וּבְנֵי שְׁמַעְיָה
  choice: ശെമയ്യാവിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ ആവർത്തിത ഘടനയും ‘പുത്രന്മാർ’ എന്ന നേരിട്ടുള്ള അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: חַטּוּשׁ
  choice: ഹത്തൂശ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദസമീപമായ മലയാള ലിപ്യന്തരണം.
- source_word: יִגְאָל
  choice: യിഗാൽ
  rationale: ആദ്യാക്ഷരമായ yod-നെ ‘യ’ എന്നും സ്വരഘടനയെ ‘യിഗാൽ’ എന്നും പ്രതിനിധീകരിക്കുന്ന നേരിട്ടുള്ള ലിപ്യന്തരണം.
- source_word: בָרִיחַ
  choice: ബാരീഹ്
  rationale: മസോററ്റിക് പാഠത്തിലെ בָרִיחַ എന്ന രൂപം പിന്തുടരുന്നു; കൂടുതൽ പരിചിതമായ മറ്റൊരു പേരായ ‘ബെരീയാവ്’ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല. അവസാന ח-ന്റെ ഘർഷധ്വനിക്ക് വായനാസൗകര്യമുള്ള ‘ഹ്’ ഉപയോഗിച്ചു.
- source_word: נְעַרְיָה
  choice: നെആര്യാവ്
  rationale: വ്യഞ്ജന-സ്വരക്രമം വ്യക്തമായി സൂക്ഷിക്കുന്ന മലയാള ലിപ്യന്തരണം; യാഹ് ഘടകം ‘-യാവ്’ ആയി നൽകുന്നു.
- source_word: שָׁפָט
  choice: ശാഫാത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ സ്വരദൈർഘ്യവും അവസാന വ്യഞ്ജനവും പ്രതിഫലിപ്പിക്കുന്ന മലയാള രൂപം.
- source_word: שִׁשָּׁה
  choice: ആറുപേർ
  rationale: എബ്രായ സംഖ്യയായ ‘ആറ്’ അതേപടി സംരക്ഷിക്കുന്നു; എണ്ണപ്പെടുന്നത് ആളുകളായതിനാൽ സ്വാഭാവിക മലയാളത്തിലെ ‘പേർ’ ചേർത്തു.
