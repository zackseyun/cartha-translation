source:
  edition: WLC
  text: אֲמַצְיָ֧הוּ בְנ֛/וֹ עֲזַרְיָ֥ה בְנ֖/וֹ יוֹתָ֥ם בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/012.yaml
  text: Amaziah his son[a], Azariah his son, Jotham his son.
translation:
  language: ml
  text: അമസ്യാവ് അവന്റെ മകൻ; അസര്യാവ് അവന്റെ മകൻ[a]; യോഥാം അവന്റെ മകൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘അസര്യാവ്’; ഈ രാജാവ് മറ്റിടങ്ങളിൽ ‘ഉസ്സീയാവ്’ എന്നും അറിയപ്പെടുന്നു.
    reason: ഇതേ രാജാവിന്റെ മറ്റൊരു പേരറിയിക്കുകയും ഈ വാക്യത്തിലെ എബ്രായ നാമരൂപം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: אֲמַצְיָהוּ
  choice: അമസ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ നാമരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְנוֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയത്തോടുകൂടിയ בֵּן എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; വംശാവലികൾ ചിലപ്പോൾ തലമുറകൾ ഒഴിവാക്കാമെങ്കിലും ഇവിടെ ‘സന്തതി’ എന്നു പൊതുവാക്കേണ്ട ആവശ്യമില്ല.
- source_word: עֲזַרְיָה
  choice: അസര്യാവ്
  rationale: ഈ വാക്യത്തിലെ എബ്രായ നാമരൂപം നേരിട്ട് പിന്തുടരുന്നു; മറ്റിടങ്ങളിലെ ‘ഉസ്സീയാവ്’ എന്ന പേരുമായി സമീകരിച്ച് മൂലപാഠത്തെ മാറ്റുന്നില്ല.
- source_word: יוֹתָם
  choice: യോഥാം
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ നാമരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: രാജവംശാവലിയിലെ പുത്രബന്ധം സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: മൂന്നു പ്രാവശ്യവും ‘അവന്റെ മകൻ’ എന്നു നിലനിർത്തി.
  alternative: വംശാവലിയിൽ തലമുറകൾ ചുരുക്കപ്പെട്ടിരിക്കാം എന്ന സാധ്യത കണക്കിലെടുത്ത് ‘അവന്റെ സന്തതി’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായപാഠം בְנוֹ (‘അവന്റെ മകൻ’) എന്നു വ്യക്തമായി ആവർത്തിക്കുന്നു. സാധ്യതയുള്ള വംശാവലി-ചുരുക്കത്തെ പരിഭാഷയിൽ മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ മൂലത്തിലെ ബന്ധപദം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി സ്വീകരിച്ചു. മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധക്രമത്തിനായി ഓരോ പേരിനുമുമ്പും ‘അവന്റെ മകൻ’ വെച്ചു; മൂലത്തിലെ ആവർത്തനവും ബന്ധത്തിന്റെ വ്യക്തതയും നിലനിർത്തി.
