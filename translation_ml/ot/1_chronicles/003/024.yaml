translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്തത നിലനിർത്തി; വ്യക്തിനാമങ്ങൾ എബ്രായ സ്വരീകരണത്തോട് കഴിയുന്നത്ര അടുത്തായി മലയാളലിപിയിൽ നൽകി.
