source:
  edition: WLC
  text: וּ/בְנֵ֣י אֶלְיוֹעֵינַ֗י הדיוהו וְ/אֶלְיָשִׁ֡יב וּ/פְלָיָ֡ה וְ֠/עַקּוּב וְ/יוֹחָנָ֧ן וּ/דְלָיָ֛ה וַ/עֲנָ֖נִי שִׁבְעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/024.yaml
  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
translation:
  language: ml
  text: 'എല്യോയെനായിയുടെ പുത്രന്മാർ: ഹോദവ്യാവ്[a], എല്യാശീബ്, പെലായാവ്, അക്കൂബ്, യോഹാനാൻ, ദെലായാവ്, അനാനി—ഏഴുപേർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പട്ടികയിലെ ആദ്യ പേരിന്റെ എബ്രായ അക്ഷരവിന്യാസം അസാധാരണമാണ്. ഇവിടെ ഏറ്റവും സാധ്യതയുള്ള പരമ്പരാഗത തിരിച്ചറിയലനുസരിച്ച് ‘ഹോദവ്യാവ്’ എന്നു നൽകിയിരിക്കുന്നു; ‘ഹോദിയാവ്’ അല്ലെങ്കിൽ മൂലരൂപത്തോട് കൂടുതൽ അടുത്ത ‘ഹോദേവാഹു’ എന്നും വായിക്കാൻ സാധ്യതയുണ്ട്.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ בְּנֵי എന്ന സംയുക്ത ബഹുവചനത്തിന് ഏറ്റവും കൃത്യവും സ്വാഭാവികവുമായ പദം ‘പുത്രന്മാർ’ ആണ്. മുൻവാക്യങ്ങളോടുള്ള ബന്ധം മലയാളത്തിലെ പട്ടികാശൈലിയിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നതിനാൽ വാവിനെ പ്രത്യേകം ‘കൂടാതെ’ എന്നു വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: אֶלְיוֹעֵינַי
  choice: എല്യോവേന
  rationale: എബ്രായ സ്വരീകരണത്തെ അടുത്തായി പിന്തുടർന്ന് വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; ബന്ധസൂചകമായ ‘യുടെ’ ചേർന്നപ്പോൾ സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: הדיוהו
  choice: ഹോദവ്യാവ്
  rationale: അസാധാരണമായ അക്ഷരവിന്യാസമുള്ള വ്യക്തിനാമമാണിത്. സാധാരണ തിരിച്ചറിയലായ Hodaviah-യോട് ചേർന്ന മലയാളരൂപം സ്വീകരിച്ചെങ്കിലും മൂലരൂപത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וְאֶלְיָשִׁיב
  choice: എല്യാശീബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וּפְלָיָה
  choice: പെലായാവ്
  rationale: അവസാനത്തെ -יָה ഘടകം മലയാളത്തിൽ വ്യക്തമായി കേൾക്കുന്നതിനായി ‘-യാവ്’ എന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְעַקּוּב
  choice: അക്കൂബ്
  rationale: ഖോഫ് അക്ഷരത്തിന്റെ ദ്വിത്വധ്വനി പ്രതിഫലിപ്പിക്കാൻ ‘ക്ക’ ഉപയോഗിച്ചുള്ള ലിപ്യന്തരണം.
- source_word: וְיוֹחָנָן
  choice: യോഹാനാൻ
  rationale: എബ്രായ יוֹחָנָן എന്ന വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം; ദീർഘമായ ദൈവനാമഘടകമുള്ള മറ്റൊരു രൂപം ഇവിടെ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- source_word: וּדְלָיָה
  choice: ദെലായാവ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ഉച്ചരിക്കാവുന്ന വിധം ലിപ്യന്തരിച്ചു; -יָה അവസാനഘടകം നിലനിർത്തി.
- source_word: וַעֲנָנִי
  choice: അനാനി
  rationale: പട്ടികയിലെ അവസാന വ്യക്തിനാമം നേരിട്ട് ലിപ്യന്തരിച്ചു; മലയാളത്തിൽ തുടർച്ചയായ പട്ടികയായതിനാൽ മുൻപ്രത്യയം പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല.
- source_word: שִׁבְעָה
  choice: ആകെ ഏഴുപേർ
  rationale: മൂലപാഠത്തിലെ വംശാവലിക്കണക്ക് വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ ഇത് ഏഴ് വ്യക്തികളെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമാക്കുകയും ചെയ്തു.
