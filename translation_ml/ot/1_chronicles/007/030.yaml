id: 1CH.7.30
reference: 1 Chronicles 7:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֣י אָשֵׁ֗ר יִמְנָ֧ה וְ/יִשְׁוָ֛ה וְ/יִשְׁוִ֥י וּ/בְרִיעָ֖ה וְ/שֶׂ֥רַח אֲחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/030.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
translation:
  language: ml
  text: 'ആശേരിന്റെ പുത്രന്മാർ: യിമ്നാ[a], യിശ്വാ, യിശ്വി, ബെരീയാ; അവരുടെ സഹോദരി സേരഹ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പേരുകളുടെ ലിപ്യന്തരണം പരിഭാഷകളിൽ വ്യത്യാസപ്പെടാം: ‘യിമ്നാ’ എന്നത് ‘ജിമ്നാ’ എന്നും, ‘യിശ്വാ’ എന്നത് ‘യിശുവാ’ എന്നും, ‘യിശ്വി’ എന്നത് ‘യിശുയി’ എന്നും കാണാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: ആശേരിന്റെ പുത്രന്മാർ
  rationale: בְּנֵי എന്നത് ‘പുത്രന്മാർ’ എന്നർഥമുള്ള construct plural ആണ്. ഇവിടെ പേരെടുത്ത് മക്കളെ പട്ടികപ്പെടുത്തുന്നതിനാൽ ‘സന്തതികൾ’ എന്ന വിശാലമായ അർഥത്തേക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: יִמְנָה
  choice: യിമ്നാ
  rationale: മസോരറ്റിക് പാഠത്തിലെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: יִשְׁוָה
  choice: യിശ്വാ
  rationale: ഈ വാക്യത്തിലെ മസോരറ്റിക് സ്വരചിഹ്നങ്ങളെ പിന്തുടരുന്ന ലിപ്യന്തരണം.
- source_word: יִשְׁוִי
  choice: യിശ്വി
  rationale: എബ്രായ രൂപവും മസോരറ്റിക് സ്വരവിന്യാസവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְרִיעָה
  choice: ബെരീയാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שֶׂרַח
  choice: സേരഹ്
  rationale: ഇത് വ്യത്യസ്തമായ എബ്രായ നാമമാണെന്നത് നിലനിർത്തുകയും ‘സാറാ’ എന്ന മറ്റൊരു പേരുമായുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲחוֹתָם
  choice: അവരുടെ സഹോദരി
  rationale: മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം ഉള്ളതിനാൽ പട്ടികപ്പെടുത്തിയ സഹോദരന്മാരുടെയെല്ലാം സഹോദരി എന്നാണ് പാഠം പറയുന്നത്.
