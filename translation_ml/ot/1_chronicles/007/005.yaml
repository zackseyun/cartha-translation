  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. വംശാവലി-ഭരണപരമായ അർഥം വ്യക്തമായി സൂക്ഷിച്ചുകൊണ്ട്, ‘സഹോദരന്മാർ’ എന്ന മൂലരൂപത്തിന്റെ വിശാല ബന്ധുസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
