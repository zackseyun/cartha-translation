source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֗ם לְ/כֹל֙ מִשְׁפְּח֣וֹת יִשָׂשכָ֔ר גִּבּוֹרֵ֖י חֲיָלִ֑ים שְׁמוֹנִ֤ים וְ/שִׁבְעָה֙ אֶ֔לֶף הִתְיַחְשָׂ֖/ם לַ/כֹּֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/005.yaml
  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
translation:
  language: ml
  text: യിസ്സാഖാരിന്റെ എല്ലാ കുടുംബങ്ങളിലുമുള്ള അവരുടെ സഹോദരന്മാർ[a] പരാക്രമശാലികളായ യോദ്ധാക്കളായിരുന്നു; ആകെ എൺപത്തേഴായിരം പേർ വംശാവലി രേഖകളിൽ രജിസ്റ്റർ ചെയ്യപ്പെട്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരുടെ കുലബന്ധുക്കൾ” അല്ലെങ്കിൽ “അവരുടെ ബന്ധുക്കൾ”; ഇവിടെ “സഹോദരന്മാർ” എന്ന എബ്രായപദം ഒരേ കുലത്തിലോ വംശത്തിലോപ്പെട്ട അടുത്ത ബന്ധുക്കളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വംശാവലിപ്രകാരം രേഖപ്പെടുത്തപ്പെട്ടിരുന്നു.” എബ്രായക്രിയ വംശാവലി രേഖകളിൽ പേരുചേർക്കപ്പെടുന്നതിനെയോ രജിസ്റ്റർ ചെയ്യപ്പെടുന്നതിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: അവരുടെ സഹോദരന്മാർ
  rationale: אָח എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘സഹോദരന്മാർ’ നിലനിർത്തുന്നു; എന്നാൽ വംശാവലി-കുലസന്ദർഭത്തിൽ ഇത് അടുത്ത ബന്ധുക്കളെയും ഉൾക്കൊള്ളാമെന്നതിനാൽ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָּׂשכָר
  choice: യിസ്സാഖാരിന്റെ സകല കുടുംബങ്ങളിലുമുള്ള
  rationale: לְכֹל ഇവിടെ ബന്ധത്തിന്റെയും വ്യാപ്തിയുടെയും ആശയം നൽകുന്നു; യിസ്സാഖാർ ഗോത്രത്തിലെ എല്ലാ കുടുംബവിഭാഗങ്ങളെയും സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: പരാക്രമശാലികളായ യോദ്ധാക്കൾ
  rationale: ഈ സ്ഥിരപ്രയോഗത്തിലെ ശക്തി, വീര്യം, യുദ്ധസാമർഥ്യം എന്നിവ വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שְׁמוֹנִים וְשִׁבְעָה אֶלֶף
  choice: എൺപത്തേഴായിരം പേർ
  rationale: മൂലത്തിലെ സംഖ്യയെ തുടർച്ചയായ തിരുവെഴുത്തുഗദ്യത്തിന് യോജിച്ച വിധത്തിൽ വാക്കുകളായി നൽകുന്നു.
- source_word: הִתְיַחְשָׂם
  choice: വംശാവലിപ്രകാരം രേഖപ്പെടുത്തപ്പെട്ട അവർ
  rationale: יחשׂ എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം വംശാവലിരേഖയിൽ ചേർക്കപ്പെടുകയോ കണക്കാക്കപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לַכֹּל
  choice: ആകെ
  rationale: എല്ലാ കുടുംബങ്ങളിലെയും മൊത്തം സംഖ്യയെ സംഗ്രഹിക്കുന്ന പ്രയോഗമായി സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
