base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
translation:
  language: ml
  text: അവന്റെ മകൻ സാബാദ്, അവന്റെ മകൻ ശൂതെലഹ്, ഏസെരും എലാദും; ദേശത്ത് ജനിച്ചവരായ ഗത്തിലെ പുരുഷന്മാർ[a] അവരെ കൊന്നു, അവർ അവരുടെ കന്നുകാലികളെ എടുക്കാൻ ഇറങ്ങിച്ചെന്നിരുന്നതിനാൽ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശവാസികളായ ഗത്തിലെ പുരുഷന്മാർ.’ എബ്രായത്തിൽ അക്ഷരാർഥം, ‘ഗത്തിലെ പുരുഷന്മാർ, ദേശത്ത് ജനിച്ചവർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇറങ്ങിച്ചെന്നിരുന്നതിനാൽ’ എന്ന ക്രിയയുടെ കർത്താവ് സന്ദർഭമനുസരിച്ച് ഏറ്റവും സാധ്യതയോടെ ഏസെരും എലാദുമാണ്; എബ്രായത്തിൽ അവരുടെ പേരുകൾ ഇവിടെ വീണ്ടും പറയുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുരുഷലിംഗ പ്രത്യയമുള്ള നാമരൂപം; എബ്രായ വംശാവലിയുടെ ആവർത്തനരീതി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളത്തിൽ രണ്ടിടത്തും ഇങ്ങനെ പരിഭാഷപ്പെടുത്തി.
- source_word: וְעֵזֶר וְאֶלְעָד
  choice: ഏസെർ, എലെയാദ്
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; പട്ടികയുടെ തുടർച്ച മലയാളത്തിലെ സ്വാഭാവിക വിരാമചിഹ്നങ്ങളിലൂടെ പ്രകടമാക്കി.
- source_word: וַהֲרָגוּם
  choice: അവരെ കൊന്നു
  rationale: הרג എന്ന ക്രിയയോടു ചേർന്ന മൂന്നാം പുരുഷ ബഹുവചന കർമപ്രത്യയത്തിന്റെ നേരിട്ടുള്ള അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אַנְשֵׁי גַת
  choice: ഗത്തിലെ പുരുഷന്മാർ
  rationale: അക്ഷരാർഥത്തോടു അടുത്തുനിൽക്കുകയും പുരുഷവാസികളെയാണ് പരാമർശിക്കുന്നതെന്ന രൂപഭേദം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: הַנּוֹלָדִים בָּאָרֶץ
  choice: ദേശത്തു ജനിച്ചവരായ
  rationale: ‘ദേശത്തു ജനിച്ചവർ’ എന്ന എബ്രായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ‘ദേശവാസികൾ’ എന്നു മാത്രം മാറ്റാതെ അതിന്റെ ദൃശ്യരൂപവും സാധ്യതയുള്ള അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: കൊലയുടെ കാരണം പരിചയപ്പെടുത്തുന്ന ബന്ധകമായി ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: יָרְדוּ
  choice: ഇറങ്ങിച്ചെന്നിരുന്നു
  rationale: ‘ഇറങ്ങുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; കൊലപാതകത്തിനു മുമ്പുണ്ടായ പ്രവൃത്തിയാണെന്ന കാലബന്ധവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לָקַחַת
  choice: എടുക്കാൻ
  rationale: സന്ദർഭം ബലപ്രയോഗമുള്ള പിടിച്ചെടുക്കലിനെ സൂചിപ്പിക്കാമെങ്കിലും, എബ്രായ ക്രിയയുടെ വിശാലവും അടിസ്ഥാനപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: מִקְנֵיהֶם
  choice: അവരുടെ കന്നുകാലികളെ
  rationale: മൃഗക്കൂട്ടങ്ങളെയോ വളർത്തുമൃഗങ്ങളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ വായനക്കാർക്കു വ്യക്തമായ സമാനപദം; സർവനാമത്തിന്റെ യഥാർഥ സന്ദിഗ്ധതയും നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ‘അവർ ഇറങ്ങിച്ചെന്നിരുന്നു’ എന്നതിലെ കർത്താവ്
  choice: പ്രധാനവാക്യത്തിൽ ‘അവർ’ എന്ന സർവനാമം നിലനിർത്തി; അടിക്കുറിപ്പിൽ ഏസെറും എലെയാദുമാണ് ഏറ്റവും സാധ്യതയുള്ള കർത്താക്കളെന്ന് അറിയിച്ചു.
  alternative: പ്രധാനവാക്യത്തിൽ ‘ഏസെറും എലെയാദും ഇറങ്ങിച്ചെന്നിരുന്നു’ എന്നു വ്യക്തമായി എഴുതുക.
  rationale: എബ്രായ ക്രിയയിൽ ബഹുവചന കർത്താവ് അടങ്ങിയിട്ടുണ്ടെങ്കിലും നാമം ആവർത്തിക്കുന്നില്ല. ഏറ്റവും അടുത്ത ബഹുവചന പൂർവപദങ്ങളായ ഏസെറും എലെയാദുമാണ് സന്ദർഭപരമായി സാധ്യതയുള്ളവർ; എങ്കിലും പരിഭാഷയിൽ വ്യാകരണപരമായ അനിശ്ചിതത്വം മായ്ച്ചുകളയാതിരിക്കുകയാണ് ഉചിതം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി-ആഖ്യാന ശൈലി സ്വീകരിച്ചു. പേരുകളുടെ പട്ടികയും തുടർന്നുള്ള സംഭവവിവരണവും വേർതിരിക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു. മൂലത്തിലെ സർവനാമസന്ദിഗ്ധത പ്രധാനവാക്യത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
