  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ ക്രിയയില്ലാത്ത പട്ടികാസ്വഭാവവും ആവർത്തിക്കുന്ന ‘അവന്റെ മകൻ’ എന്ന സൂത്രവും സംരക്ഷിച്ചു; പേരുകൾ മലയാള വായനക്കാർക്ക് ഉച്ചരിക്കാവുന്ന രീതിയിൽ ലിപ്യന്തരിച്ചു.
