translation:
  language: ml
  text: അവന്റെ മകൻ റെഫഹ്[a], രെശെഫ്, അവന്റെ മകൻ തെലഹ്, അവന്റെ മകൻ തഹൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു വംശാവലികളിൽ ബന്ധം വ്യക്തമാക്കുന്ന ക്രിയ പലപ്പോഴും പറയാതെ വിടുന്നു. ഇവിടെ പിൻഗാമികളുടെ പട്ടികയാണ്: “അവന്റെ മകൻ റെഫഹ്, രെശെഫ്, അവന്റെ മകൻ തെലഹ്, അവന്റെ മകൻ തഹൻ.”'
    reason: cultural_note
lexical_decisions:
- source_word: רֶפַח
  choice: രേഫഹ്
  rationale: വംശാവലിയിൽ വരുന്ന വ്യക്തിനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാംപുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയം ചേർന്ന നാമരൂപം; ആവർത്തിക്കുന്ന വംശാവലിസൂത്രം ചുരുക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
- source_word: רֶשֶׁף
  choice: രേശെഫ്
  rationale: മറ്റിടങ്ങളിൽ ഈ പദത്തിന് വേറിട്ട സാധാരണനാമാർഥങ്ങൾ ഉണ്ടെങ്കിലും ഇവിടെ വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ വ്യക്തിനാമമാണ്; അതിനാൽ ലിപ്യന്തരിച്ചു.
- source_word: תֶלַח
  choice: തേലഹ്
  rationale: വ്യക്തിനാമമായതിനാൽ ഹീബ്രു സ്വരരൂപം പ്രതിഫലിപ്പിക്കുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: תַחַן
  choice: തഹൻ
  rationale: വ്യക്തിനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: וְ
  choice: പട്ടികയിലെ വിരാമചിഹ്നങ്ങൾ
  rationale: ഹീബ്രു സംയോജകപ്രത്യയം വംശാവലിയിലെ പേരുകളെ ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ പട്ടികയുടെ ഘടന സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ പ്രധാനമായും കോമകൾ ഉപയോഗിച്ചു.
