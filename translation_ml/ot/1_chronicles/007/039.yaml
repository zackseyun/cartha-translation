source:
  edition: WLC
  text: וּ/בְנֵ֖י עֻלָּ֑א אָרַ֥ח וְ/חַנִּיאֵ֖ל וְ/רִצְיָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/039.yaml
  text: 'The sons of Ulla: Arah[a], Hanniel[d][c][b], and Rizia.'
translation:
  language: ml
  text: 'ഉല്ലായുടെ പുത്രന്മാർ[a]: ആരഹ്, ഹന്നീയേൽ, രിസ്യാ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘ഉല്ലായുടെ പുത്രന്മാരും’ എന്നു തുടങ്ങുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: בְּנֵי എന്ന സംയുക്ത ബഹുവചനം വംശാവലിയുടെ ഈ സന്ദർഭത്തിൽ നേരിട്ട് ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി. വാക്യാരംഭത്തിലെ וּ־ സ്വാഭാവികമായ മലയാള വംശാവലിശൈലിയിൽ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി; അതിന്റെ സാന്നിധ്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: עֻלָּא
  choice: ഉല്ലാ
  rationale: എബ്രായ ഉച്ചാരണവും ഇരട്ട ലാമെദും പ്രതിഫലിപ്പിക്കുന്ന വിധത്തിൽ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: אָרַח
  choice: ആരഹ്
  rationale: വ്യക്തിനാമം എബ്രായ സ്വരരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളത്തിലേക്ക് ലിപ്യന്തരണം ചെയ്തു.
- source_word: חַנִּיאֵל
  choice: ഹന്നീയേൽ
  rationale: ഇരട്ട നൂനും ദൈവനാമഘടകമായ אֵל-ഉം വ്യക്തമാകുന്ന വിധത്തിൽ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: רִצְיָא
  choice: രിസ്യാ
  rationale: എബ്രായ വ്യഞ്ജന-സ്വരക്രമം അനുസരിച്ച് വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു; അനാവശ്യമായ അന്ത്യവ്യഞ്ജനം ചേർത്തിട്ടില്ല.
theological_decisions: []
