  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾ പരിഭാഷപ്പെടുത്താതെ എബ്രായരൂപത്തെ ആധാരമാക്കി ലിപ്യന്തരണം ചെയ്തു.
