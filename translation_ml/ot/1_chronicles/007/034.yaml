id: 1CH.7.34
reference: 1 Chronicles 7:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֖י שָׁ֑מֶר אֲחִ֥י ו/רוהגה יחבה וַ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/034.yaml
  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
translation:
  language: ml
  text: 'ശാമേരിന്റെ പുത്രന്മാർ[a]: അഹി, രോഹ്ഗാ, യെഹുബ്ബാ[b], അരാം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ വംശാവലികളിൽ ‘പുത്രന്മാർ’ എന്ന പ്രയോഗം നേരിട്ടുള്ള പുത്രന്മാരെ മാത്രമല്ല, പുരുഷസന്തതികളെയോ കുലാംഗങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: ഈ പേരിനെ ‘യെഹുബ്ബാ’ എന്നും ‘ഹുബ്ബാ’ എന്നും ലിപ്യന്തരം ചെയ്തിട്ടുള്ള പരിഭാഷകളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: בְּנֵי എന്ന construct ബഹുവചനം വംശാവലിപ്പട്ടികയിലെ പുരുഷസന്തതികളെയോ കുലാംഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വംശാവലി പ്രയോഗമായി ‘പുത്രന്മാർ’ തെരഞ്ഞെടുത്തു. തുടക്കത്തിലെ וּ ആശയബന്ധം നൽകുന്നുവെങ്കിലും ഒറ്റവാക്യമായ ഈ അവതരണത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ ചേർക്കുന്നത് അസ്വാഭാവികമായതിനാൽ പ്രകടമാക്കിയിട്ടില്ല.
- source_word: שָׁמֶר
  choice: ശാമേർ
  rationale: മസോരറ്റിക് സ്വരചിഹ്നങ്ങളിലെ qamats പ്രതിഫലിപ്പിച്ച് വ്യക്തിനാമം മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു.
- source_word: אֲחִי
  choice: അഹി
  rationale: ‘സഹോദരൻ’ എന്ന പദവുമായി രൂപബന്ധം തോന്നാമെങ്കിലും ഇവിടെ പട്ടികയിലെ വ്യക്തിനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: וְרוהגה
  choice: രോഹ്ഗാ
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ ഉച്ചാരണസൗകര്യം നിലനിർത്തി ലിപ്യന്തരിച്ചു; മുൻചേർന്ന וְ പട്ടികയിലെ വിരാമചിഹ്നക്രമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: יחבה
  choice: യെഹുബ്ബാ
  rationale: ആദ്യത്തെ yod-ഉം നടുവിലെ ഇരട്ട വ്യഞ്ജനശബ്ദവും പ്രതിഫലിപ്പിക്കുന്ന സമീപ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וַאֲרָם
  choice: അരാം
  rationale: אֲרָם എന്ന പൂർണരൂപം ‘അരാം’ എന്ന് നേരിട്ട് ലിപ്യന്തരിച്ചു; പട്ടികയിലെ അവസാന וַ മലയാളത്തിലെ കോമാക്രമത്തിലൂടെ പ്രകടമാകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തമായ വംശാവലി ശൈലി പാലിച്ചു. പേരുകൾ വിവർത്തനം ചെയ്യാതെ എബ്രായ സ്വരരൂപത്തോട് ചേർന്ന് മലയാളലിപിയിൽ നൽകി; പട്ടികയുടെ സ്വാഭാവികതയ്ക്കായി ബന്ധകങ്ങൾ വിരാമചിഹ്നങ്ങളിലൂടെ പ്രകടമാക്കി.
