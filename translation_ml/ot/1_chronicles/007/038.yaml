id: 1CH.7.38
reference: 1 Chronicles 7:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֖י יֶ֑תֶר יְפֻנֶּ֥ה וּ/פִסְפָּ֖ה וַ/אְרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/038.yaml
  text: 'And the sons of Jether: Jephunneh[a], Pispa, and Ara.'
translation:
  language: ml
  text: 'യെതെരിന്റെ പുത്രന്മാർ: യെഫുന്നെ, പിസ്പാ, അരാ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടികയിലെ בְּנֵי എന്ന സംയുക്ത ബഹുവചനരൂപത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാള പ്രയോഗം. മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന וּ- ഈ സ്വതന്ത്ര വാക്യത്തിൽ വേർതിരിച്ച് പരിഭാഷപ്പെടുത്താതെ പട്ടികയുടെ തുടർച്ചയായി സൂചിപ്പിച്ചിരിക്കുന്നു.
- source_word: יֶתֶר
  choice: യേതെർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: יְפֻנֶּה
  choice: യെഫുന്നെ
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּפִסְפָּה
  choice: പിസ്പാ
  rationale: വ്യക്തിനാമത്തിലെ അവസാന ה ഇവിടെ സ്വരസൂചനയായി പ്രതിഫലിപ്പിച്ച് 'പിസ്പാ' എന്നു ലിപ്യന്തരണം ചെയ്തു; മുൻപുള്ള וּ- പട്ടികയിലെ കൂട്ടിച്ചേർക്കൽ ഘടനയിലൂടെ പ്രകടമാകുന്നു.
- source_word: וַאְרָא
  choice: അരാ
  rationale: വംശാവലിസന്ദർഭത്തിൽ ഇത് വ്യക്തിനാമമായി എടുത്ത് ലിപ്യന്തരണം ചെയ്തു; prefixed conjunction പട്ടികയിലെ അവസാന ഇനത്തിന്റെ ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും മാന്യവുമായ വംശാവലി ശൈലി. പേരുകൾ ഇംഗ്ലീഷ് പരമ്പരാഗത രൂപത്തിൽനിന്നല്ല, എബ്രായ സ്രോതസ്സിന്റെ ശബ്ദരൂപത്തെ മുൻനിർത്തിയാണ് ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നത്.
