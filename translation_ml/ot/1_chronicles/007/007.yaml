source:
  edition: WLC
  text: וּ/בְנֵ֣י בֶ֗לַע אֶצְבּ֡וֹן וְ/עֻזִּ֡י וְ֠/עֻזִּיאֵל וִ/ירִימ֨וֹת וְ/עִירִ֜י חֲמִשָּׁ֗ה רָאשֵׁי֙ בֵּ֣ית אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים וְ/הִתְיַחְשָׂ֗/ם עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וּ/שְׁלֹשִׁ֖ים וְ/אַרְבָּעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
translation:
  language: ml
  text: 'ബേലയുടെ പുത്രന്മാർ: എസ്ബോൻ, ഉസ്സി, ഉസ്സീയേൽ, യെരീമോത്ത്, ഈരി—പിതൃഭവനങ്ങളുടെ തലവന്മാരും പരാക്രമശാലികളായ യോദ്ധാക്കളുമായ അഞ്ചുപേർ. വംശാവലിപ്രകാരം പട്ടികയിൽ ചേർക്കപ്പെട്ടവരുടെ എണ്ണം[a] ഇരുപത്തിരണ്ടായിരത്തി മുപ്പത്തിനാലായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ വംശാവലി” എന്നും “വംശാവലിപ്രകാരമുള്ള അവരുടെ രജിസ്ട്രേഷൻ” എന്നും പരിഭാഷപ്പെടുത്താം. വംശാവലിരേഖകളിൽ പേരുചേർക്കപ്പെട്ടതിനെ ഹീബ്രു പദം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶלַע
  choice: ബേലയുടെ പുത്രന്മാർ
  rationale: בני എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു; ഇവിടെ പിന്നാലെ വ്യക്തിനാമങ്ങളുടെ നേരിട്ടുള്ള പട്ടിക വരുന്നതിനാൽ ‘സന്തതികൾ’ എന്ന വിശാല പദം ആവശ്യമില്ല.
- source_word: אֶצְבּוֹן וְעֻזִּי וְעֻזִּיאֵל וִירִימוֹת וְעִירִי
  choice: എസ്ബോൻ, ഉസ്സി, ഉസ്സീയേൽ, യെരീമോത്ത്, ഈരി
  rationale: ഹീബ്രു വ്യക്തിനാമങ്ങളുടെ ശബ്ദരൂപം ആധുനിക മലയാളലിപിയിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: חֲמִשָּׁה
  choice: അഞ്ചുപേർ
  rationale: പട്ടികപ്പെടുത്തിയ അഞ്ചു പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന സംഖ്യയായതിനാൽ വ്യക്തികളെ എണ്ണുന്ന സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: רָאשֵׁי בֵּית אָבוֹת
  choice: പിതൃഭവനങ്ങളുടെ തലവന്മാർ
  rationale: ദിനവൃത്താന്തത്തിലെ വംശ-സാമൂഹിക ഘടകമായ ‘പിതാവിന്റെ ഭവനം’ എന്ന ആശയവും നേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന ‘തല’ എന്ന രൂപകവും പരമാവധി നിലനിർത്തുന്നു.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: പരാക്രമശാലികളായ യോദ്ധാക്കൾ
  rationale: പ്രയോഗം ശക്തിയും യുദ്ധശേഷിയും തെളിയിച്ച പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: וְהִתְיַחְשָׂם
  choice: വംശാവലിപ്രകാരം പട്ടികയിൽ ചേർക്കപ്പെട്ട അവരുടെ എണ്ണം
  rationale: יחש എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം വംശാവലിരേഖയിൽ ഔദ്യോഗികമായി ചേർക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ക്രിയാത്മകമായി പറഞ്ഞത് അർഥം വ്യക്തമാക്കുന്നു; ‘എണ്ണം’ അടുത്തുവരുന്ന സംഖ്യയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וּשְׁלֹשִׁים וְאַרְבָּעָה
  choice: ഇരുപത്തിരണ്ടായിരത്തി മുപ്പത്തിനാല്
  rationale: ഹീബ്രു സംഖ്യ 22,000 + 34 എന്നതിന്റെ സ്വാഭാവിക മലയാള വാക്കുരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. വംശാവലി-സാമൂഹിക സാങ്കേതികപ്രയോഗമായ ‘പിതൃഭവനങ്ങൾ’ നിലനിർത്തി; നീണ്ട ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിനായി മൂന്നു വാക്യങ്ങളാക്കി.
