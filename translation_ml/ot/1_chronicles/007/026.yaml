  text: Ladan his son[a], Ammihud his son, Elishama his son.
translation:
  language: ml
  text: അവന്റെ മകൻ ലാദാൻ[a], അവന്റെ മകൻ അമ്മീഹൂദ്, അവന്റെ മകൻ എലീശാമാ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആദ്യത്തെ പേര് അതേ എബ്രായ അക്ഷരവിന്യാസത്തെ മറ്റൊരു വിധത്തിൽ ലിപ്യന്തരണം ചെയ്ത് ‘ലഅദാൻ’ എന്നും എഴുതാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעְדָּן
  choice: ലാദാൻ
  rationale: വ്യക്തിനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തവിധം ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുരുഷലിംഗ പ്രത്യയമുള്ള എബ്രായ നാമത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘അവന്റെ മകൻ’ എന്നാണ്; വംശാവലിയുടെ ഈ സന്ദർഭത്തിലും അതുതന്നെ സ്വാഭാവികമാണ്.
- source_word: עַמִּיהוּד
  choice: അമ്മീഹൂദ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ഉച്ചാരണാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֱלִישָׁמָע
  choice: എലീശാമാ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ഉച്ചാരണാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആവർത്തനാത്മകമായ എബ്രായ വംശാവലി ഘടന നിലനിർത്തിക്കൊണ്ട്, ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപം ഉപയോഗിച്ചു. പദക്രമം മലയാളത്തിൽ വംശബന്ധം വ്യക്തമായി വായിക്കാനായി ക്രമപ്പെടുത്തി.
