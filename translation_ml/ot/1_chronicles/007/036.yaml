  footnotes:
  - marker: a
    text: അഥവാ “സോഫഹിന്റെ സന്തതികൾ.” വംശാവലിപ്പട്ടികകളിൽ בְּנֵי എന്ന ഹീബ്രുപദം ചിലപ്പോൾ വിശാലമായ വംശപരമ്പരയെ സൂചിപ്പിക്കാം; എങ്കിലും അതിന്റെ കൂടുതൽ നേരിട്ടുള്ള പരിഭാഷ “പുത്രന്മാർ” എന്നാണ്.
