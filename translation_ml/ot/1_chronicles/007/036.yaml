lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: ഇത് ‘പുത്രന്മാർ’ എന്നതിന്റെ നിർമിത ബഹുവചനരൂപമാണ്. വംശാവലികളിൽ വിശാലമായ പിൻതലമുറയെയും സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ ഏറ്റവും നേരിട്ടുള്ള പരിഭാഷ ‘പുത്രന്മാർ’ എന്നാണ്.
- source_word: צוֹפָח
  choice: സോഫഹ്
  rationale: മസോററ്റിക് പാഠത്തിലെ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: סוּחַ
  choice: സൂവഹ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ സ്വരഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: חַרְנֶפֶר
  choice: ഹർനെഫെർ
  rationale: വംശാവലിയിലെ വ്യക്തിനാമം ഹീബ്രു രൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: שׁוּעָל
  choice: ശൂവാൽ
  rationale: മറ്റിടങ്ങളിൽ ഈ വ്യഞ്ജനരൂപത്തിന് സാധാരണനാമമായ അർഥമുണ്ടാകാമെങ്കിലും, ഇവിടെ വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ വ്യക്തിനാമമായതിനാൽ പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരിച്ചു.
- source_word: בֵרִי
  choice: ബേരി
  rationale: മസോററ്റിക് പാഠത്തിലെ സ്വരീകരണത്തെ പിന്തുടർന്ന് വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: יִמְרָה
  choice: ഇമ്രാ
  rationale: ആദ്യത്തെ യോദ് സ്വരാരംഭമായി പ്രതിഫലിപ്പിച്ച്, ഹീബ്രു വ്യക്തിനാമം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
