id: 1CH.7.17
reference: 1 Chronicles 7:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֥י אוּלָ֖ם בְּדָ֑ן אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד בֶּן מָכִ֖יר בֶּן מְנַשֶּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/017.yaml
  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
translation:
  language: ml
  text: 'ഊലാമിന്റെ പുത്രന്മാർ: ബേദാൻ. ഇവർ മനശ്ശെയുടെ മകനായ മാഖീരിന്റെ മകൻ ഗിലെയാദിന്റെ പുത്രന്മാരായിരുന്നു[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഇവർ ഗിലെയാദിന്റെ പുത്രന്മാർ.’ ഊലാമിന്റെ വംശത്തെ ഗിലെയാദ്, മാഖീർ, മനശ്ശെ എന്നിവരിലൂടെ പിന്നോട്ടു ബന്ധിപ്പിക്കുന്ന വംശാവലിസംഗ്രഹമായി ഈ വാക്യം പ്രവർത്തിക്കുന്നതാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אוּלָם
  choice: ഊലാമിന്റെ പുത്രന്മാർ
  rationale: വംശാവലികളിൽ സ്വാഭാവികമായ ‘പുത്രന്മാർ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു. വാക്യാരംഭത്തിലെ ו ലളിതമായ ബന്ധകമാണ്; മലയാളത്തിൽ ഇവിടെ അത് പ്രത്യേകം പരിഭാഷപ്പെടുത്താതിരിക്കുന്നതാണ് സ്വാഭാവികം.
- source_word: בְּדָן
  choice: ബേദാൻ
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֵלֶּה
  choice: ഇവർ … ആയിരുന്നു
  rationale: എബ്രായത്തിലെ സൂചകസർവനാമത്തോടൊപ്പം ഇല്ലാത്ത ബന്ധകക്രിയ മലയാളത്തിൽ പൂർത്തിയാക്കി; വംശാവലിയുടെ പശ്ചാത്തലത്തിന് ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: בְּנֵי גִלְעָד
  choice: ഗിലെയാദിന്റെ പുത്രന്മാർ
  rationale: വിശാലമായ ‘വംശജർ’ എന്ന അർത്ഥം സ്വീകരിക്കാതെ എബ്രായ വംശാവലിപ്രയോഗമായ ‘പുത്രന്മാർ’ നിലനിർത്തി.
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മകനായ മാഖീരിന്റെ മകൻ
  rationale: 'എബ്രായത്തിലെ വംശപരമ്പരയുടെ ക്രമം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു: ഗിലെയാദ് മാഖീരിന്റെ മകനും മാഖീർ മനശ്ശെയുടെ മകനുമാണ്.'
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. വ്യക്തിനാമങ്ങൾ മൂലഭാഷയോട് ചേർന്ന മലയാള ലിപ്യന്തരണത്തിൽ നൽകി; എബ്രായത്തിലെ സംക്ഷിപ്തതയും വംശബന്ധവും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
