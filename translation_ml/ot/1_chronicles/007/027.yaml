lexical_decisions:
- source_word: נ֥וֹן
  choice: നൂൻ
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ, മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּנ֖/וֹ
  choice: അവന്റെ മകൻ
  rationale: בֵּן എന്ന നാമത്തോടു ചേർന്ന മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം അക്ഷരാർഥത്തിൽ ‘അവന്റെ മകൻ’ എന്നാണ്; വംശാവലിയുടെ ആവർത്തനശൈലി നിലനിർത്തി.
- source_word: יְהוֹשֻׁ֥עַ
  choice: യോശുവ
  rationale: ഹീബ്രായ വ്യക്തിനാമമായ Yehoshua-യുടെ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ട ലിപ്യന്തരരൂപം സ്വീകരിച്ചു.
- source_word: בְּנֽ/וֹ
  choice: അവന്റെ മകൻ
  rationale: തുടർച്ചയായ വംശപരമ്പര സൂചിപ്പിക്കുന്ന ആവർത്തിത ഹീബ്രായ സൂത്രവാക്യം സുതാര്യമായി നിലനിർത്തി.
