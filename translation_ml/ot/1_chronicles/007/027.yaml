  footnotes:
  - marker: a
    text: 'ഹീബ്രായത്തിൽ ഓരോ പേരിനുശേഷവും ‘അവന്റെ മകൻ’ എന്ന പ്രയോഗം ആവർത്തിക്കുന്നു. തുടർച്ചയായ വംശപരമ്പര സൂചിപ്പിക്കുന്ന സാധാരണ വംശാവലിശൈലിയാണിത്: ‘നൂൻ അവന്റെ മകൻ; യോശുവ അവന്റെ മകൻ.’'
