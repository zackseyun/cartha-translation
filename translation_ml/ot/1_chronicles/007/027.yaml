  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ സംക്ഷിപ്തതയും ‘അവന്റെ മകൻ’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചു; രണ്ട് തലമുറകളെ വ്യക്തമായി വേർതിരിക്കാൻ അർധവിരാമം ചേർത്തു.
