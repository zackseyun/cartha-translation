source:
  edition: WLC
  text: וּ/בְנֵ֥י עֻזִּ֖י יִֽזְרַֽחְיָ֑ה וּ/בְנֵ֣י יִֽזְרַֽחְיָ֗ה מִֽיכָאֵ֡ל וְ֠/עֹבַדְיָה וְ/יוֹאֵ֧ל יִשִּׁיָּ֛ה חֲמִשָּׁ֖ה רָאשִׁ֥ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
translation:
  language: ml
  text: 'ഉസ്സിയുടെ മക്കൾ: യിസ്രഹ്യാവ്. യിസ്രഹ്യാവിന്റെ മക്കൾ: മീഖായേൽ, ഓബദ്യാവ്, യോവേൽ, യിശ്ശീയാവ്—അഞ്ചു തലവന്മാർ, അവരെല്ലാവരും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ, “അഞ്ചു തലകൾ, അവരെല്ലാവരും.” ഇവിടെ “തലകൾ” എന്നത് “തലവന്മാർ” അഥവാ “കുടുംബത്തലവന്മാർ” എന്നർഥത്തിലാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: മകൻ / മക്കൾ
  rationale: בְּנֵי എന്ന ബഹുവചന വംശാവലി പ്രയോഗം ആദ്യ ഭാഗത്ത് ഒരേയൊരു പേര് മാത്രമുള്ളതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘മകൻ’ എന്നും, രണ്ടാമത്തെ ഭാഗത്ത് ‘മക്കൾ’ എന്നും നൽകി; വംശാവലിയുടെ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עֻזִּי
  choice: ഉസ്സി
  rationale: ഹീബ്രു വ്യക്തിനാമം ആധുനിക മലയാളത്തിൽ ഉച്ചരിക്കാൻ എളുപ്പമുള്ള രീതിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: יִזְרַחְיָה
  choice: യിസ്രഹ്യാവ്
  rationale: പേരിലെ യഹ് ഘടകം പ്രതിഫലിപ്പിക്കുന്ന പരിചിതമായ മലയാള ബൈബിൾ നാമരൂപം ഉപയോഗിച്ചു; രണ്ടു പ്രാവശ്യവും ഒരേ രൂപം നിലനിർത്തി.
- source_word: מִיכָאֵל
  choice: മീഖായേൽ
  rationale: ഹീബ്രു നാമത്തിന്റെ ഘടനയും മലയാളത്തിലെ പരിചിതമായ രൂപവും നിലനിർത്തുന്ന ലിപ്യന്തരണം.
- source_word: וְעֹבַדְיָה
  choice: ഓബദ്യാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ നാമരൂപത്തിൽ നൽകി.
- source_word: וְיוֹאֵל
  choice: യോവേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ സാധാരണ മലയാള ലിപ്യന്തരണം.
- source_word: יִשִּׁיָּה
  choice: യിശ്ശീയാവ്
  rationale: ഹീബ്രു വ്യഞ്ജനരൂപത്തിലെ ശക്തമായ ശ് ശബ്ദവും അവസാനത്തെ യാഹ് ഘടകവും കഴിയുന്നത്ര പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: חֲמִשָּׁה
  choice: അഞ്ചു
  rationale: എണ്ണത്തെ നേരിട്ട് വിവർത്തനം ചെയ്തു; പട്ടികയിൽ നാലു പുത്രന്മാർ മാത്രമുള്ളതായി തോന്നുന്ന സംഖ്യാത്മക പിരിമുറുക്ക് അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
- source_word: רָאשִׁים
  choice: തലവന്മാർ
  rationale: ‘തലകൾ’ എന്ന അക്ഷരാർഥം ഇവിടെ കുടുംബങ്ങളുടെയോ വംശവിഭാഗങ്ങളുടെയോ നേതാക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ ‘തലവന്മാർ’ തെരഞ്ഞെടുത്തു.
- source_word: כֻּלָּם
  choice: അവരെല്ലാം ആകെ
  rationale: ‘അവരെല്ലാവരും’ എന്ന സമഗ്രതയും അഞ്ചെന്ന ആകെ എണ്ണവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: നാലു പുത്രന്മാരുടെ പേരുകൾക്കു പിന്നാലെ ‘അഞ്ചു തലവന്മാർ’ എന്നു പറയുന്നത്
  choice: മുഖ്യപാഠത്തിൽ ഹീബ്രുവിലെ ‘അഞ്ചു’ എന്ന സംഖ്യ നിലനിർത്തി, അതിന്റെ സാധ്യതയുള്ള കണക്കുകൂട്ടൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: യിസ്രഹ്യാവിനെയും നാലു പുത്രന്മാരെയും ചേർത്താണ് അഞ്ചെന്ന് നേരിട്ട് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഹീബ്രു വാചകം അഞ്ചാമൻ ആരെന്നു തുറന്നുപറയുന്നില്ല. യിസ്രഹ്യാവിനെ ഉൾപ്പെടുത്തിയുള്ള കണക്കാകാം, എന്നാൽ അത് വ്യാഖ്യാനമായി ഉറപ്പിക്കാതെ മൂലപാഠത്തിലെ അസ്പഷ്ടത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ വംശാവലി ശൈലി സ്വീകരിച്ചു. ആവർത്തനഘടന സംരക്ഷിച്ചെങ്കിലും മലയാളത്തിൽ അസ്വാഭാവികമായ ‘പുത്രന്മാർ’ എന്ന ബഹുവചനം ആദ്യ ഭാഗത്ത് ഒഴിവാക്കി. പേരുകൾ ഹീബ്രു രൂപത്തോട് ചേർന്ന പരിചിത മലയാള ലിപ്യന്തരണങ്ങളിൽ നൽകി.
