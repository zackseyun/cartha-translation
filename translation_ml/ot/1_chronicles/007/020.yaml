id: 1CH.7.20
reference: 1 Chronicles 7:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֥י אֶפְרַ֖יִם שׁוּתָ֑לַח וּ/בֶ֤רֶד בְּנ/וֹ֙ וְ/תַ֣חַת בְּנ֔/וֹ וְ/אֶלְעָדָ֥ה בְנ֖/וֹ וְ/תַ֥חַת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/020.yaml
  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
translation:
  language: ml
  text: 'എഫ്രയീമിന്റെ പുത്രന്മാർ: ശൂഥെലഹ്[a]; അവന്റെ മകൻ ബെരെദ്; അവന്റെ മകൻ തഹത്ത്; അവന്റെ മകൻ എലാദാ; അവന്റെ മകൻ തഹത്ത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വംശാവലികളിൽ എബ്രായയിലെ ‘മകൻ’ എന്ന പദം ചിലപ്പോൾ ദൂരസ്ഥനായ ഒരു സന്തതിയെയും സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ ഓരോ ഘട്ടത്തിലും പാഠം അക്ഷരാർഥത്തിൽ ‘അവന്റെ മകൻ’ എന്നാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶפְרַיִם
  choice: എഫ്രയീമിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ തലക്കെട്ടായി വരുന്ന സമാസബഹുവചനം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി; തുടക്കത്തിലെ וּ ആശയപരമായി പുതിയ പട്ടികയിലേക്ക് ബന്ധിപ്പിക്കുന്നതായതിനാൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർത്തില്ല.
- source_word: שׁוּתָלַח
  choice: ശൂഥേലഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ധ്വനിരൂപം മലയാളലിപിയിൽ പകർത്തി.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: בן എന്ന പദത്തിന്റെ 3-ാം പുരുഷ ഏകവചന ഉടമസ്ഥരൂപത്തിന് ഇവിടെ നേരിട്ടുള്ള അർഥം ‘അവന്റെ മകൻ’ എന്നാണ്; വംശാവലിയിൽ ദൂരസ്ഥ സന്തതിയെയും സൂചിപ്പിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְתַחַת
  choice: തഹത്ത്
  rationale: ഇവിടെ תַחַת ‘കീഴെ’ എന്ന സാധാരണ പദമല്ല, വ്യക്തിനാമമാണ്; ആവർത്തനവും മൂലപാഠപ്രകാരം സംരക്ഷിച്ചു.
- source_word: וְאֶלְעָדָה
  choice: എലെയാദാ
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ എബ്രായ ധ്വനിക്കനുസരിച്ച് മലയാളലിപിയിൽ പകർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. മൂലപാഠത്തിലെ തലമുറക്രമവും ‘അവന്റെ മകൻ’ എന്ന ആവർത്തനവും നിലനിർത്തി; വായനാസൗകര്യത്തിന് അർദ്ധവിരാമങ്ങൾ ഉപയോഗിച്ചു.
