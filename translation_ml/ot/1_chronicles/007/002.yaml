  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട് അസ്പഷ്ടമായ പദങ്ങളുടെ യഥാർഥ വികൽപങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
