source:
  edition: WLC
  text: וּ/בְנֵ֣י תוֹלָ֗ע עֻזִּ֡י וּ/רְפָיָ֡ה וִֽ֠/ירִיאֵל וְ/יַחְמַ֨י וְ/יִבְשָׂ֜ם וּ/שְׁמוּאֵ֗ל רָאשִׁ֤ים לְ/בֵית אֲבוֹתָ/ם֙ לְ/תוֹלָ֔ע גִּבּ֥וֹרֵי חַ֖יִל לְ/תֹלְדוֹתָ֑/ם מִסְפָּרָ/ם֙ בִּ/ימֵ֣י דָוִ֔יד עֶשְׂרִֽים וּ/שְׁנַ֥יִם אֶ֖לֶף וְ/שֵׁ֥שׁ מֵאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
translation:
  language: ml
  text: 'തോലായുടെ പുത്രന്മാർ: ഉസ്സി, രെഫായാവ്, യെരീയേൽ, യഹ്മായി, യിബ്സാം, ശമൂവേൽ. ഇവർ തോലാവംശത്തിലെ പിതൃഭവനങ്ങളുടെ തലവന്മാരും[a] തങ്ങളുടെ വംശാവലികൾപ്രകാരം[c] പരാക്രമശാലികളുമായിരുന്നു[b]. ദാവീദിന്റെ കാലത്ത് അവരുടെ എണ്ണം ഇരുപത്തീരായിരത്തി അറുനൂറായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തലവന്മാർ’ എന്നതിന് ‘പ്രമുഖർ’ അഥവാ ‘നേതാക്കൾ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പരാക്രമശാലികൾ’ എന്നതിന് ‘വീരയോദ്ധാക്കൾ’ അഥവാ ‘ധീരന്മാർ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ‘തങ്ങളുടെ വംശാവലികൾപ്രകാരം’ എന്നതിന് ‘തങ്ങളുടെ തലമുറകൾപ്രകാരം’ അഥവാ ‘തങ്ങളുടെ വംശപ്പട്ടികകൾ അനുസരിച്ച്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  choice: തോലായുടെ പുത്രന്മാർ
  rationale: നേരിട്ടുള്ള പുത്രന്മാരുടെ പട്ടികയായതിനാൽ בנים എന്നതിന് ‘പുത്രന്മാർ’ എന്നു നൽകി; ആരംഭത്തിലെ ו മലയാളത്തിൽ പ്രത്യേകം പ്രതിനിധീകരിക്കാതെ സ്വാഭാവിക വാക്യാരംഭം നിലനിർത്തി.
- source_word: עֻזִּי וּרְפָיָה וִירִיאֵל וְיַחְמַי וְיִבְשָׂם וּשְׁמוּאֵל
  choice: ഉസ്സി, രെഫായാവ്, യെരീയേൽ, യഹ്മായി, യിബ്സാം, ശമൂവേൽ
  rationale: ഹീബ്രു രൂപങ്ങളെ അടിസ്ഥാനമാക്കി മലയാള ബൈബിൾനാമങ്ങളുടെ സ്വാഭാവിക ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם לְתוֹלָע
  choice: തോലായുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാർ
  rationale: בית אבות സൂചിപ്പിക്കുന്ന പൂർവികകുടുംബ/കുലഘടകത്തെ ‘പിതൃഭവനങ്ങൾ’ എന്നു സംക്ഷിപ്തമായി നിലനിർത്തി; לְתוֹלָע ബന്ധത്തെ തോലായുടെ വംശശാഖയോടുള്ള ചേർച്ചയായി അവതരിപ്പിച്ചു.
- source_word: גִּבּוֹרֵי חַיִל
  choice: പരാക്രമശാലികളായ ആളുകൾ
  rationale: പദസമുച്ചയം സൈനിക വീര്യത്തെയും കഴിവിനെയും സൂചിപ്പിക്കാം; മലയാളത്തിൽ സ്വാഭാവികവും അർത്ഥസമ്പന്നവുമായ പൊതുപദം തിരഞ്ഞെടുത്തു, സൈനിക അർത്ഥവികൽപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: לְתֹלְדוֹתָם
  choice: തങ്ങളുടെ വംശാവലിപ്രകാരം
  rationale: തലമുറകളെയോ വംശപരമായ രജിസ്ട്രേഷനെയോ സൂചിപ്പിക്കുന്ന genealogical അർത്ഥം വ്യക്തമായി നൽകുന്നു; യഥാർഥ വ്യത്യസ്ത വായനകൾ അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: מִסְפָּרָם בִּימֵי דָוִיד עֶשְׂרִים וּשְׁנַיִם אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: ദാവീദിന്റെ കാലത്ത് അവരുടെ എണ്ണം ഇരുപത്തീരായിരത്തി അറുനൂറായിരുന്നു
  rationale: ഹീബ്രു സംഖ്യയായ 22,600 കൃത്യമായി മലയാള വാക്കുകളിൽ നൽകി.
