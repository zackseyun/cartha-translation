  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾ ഹീബ്രു മൂലരൂപത്തെ അടിസ്ഥാനമാക്കി ഏകീകരിച്ചു; പദത്തിന്റെ സാധ്യതയുള്ള വിശാലാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
