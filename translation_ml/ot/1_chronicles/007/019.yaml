source:
  edition: WLC
  text: וַ/יִּהְי֖וּ בְּנֵ֣י שְׁמִידָ֑ע אַחְיָ֣ן וָ/שֶׁ֔כֶם וְ/לִקְחִ֖י וַ/אֲנִיעָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/019.yaml
  text: The sons of Shemida were Ahian[a], Shechem, Likhi, and Aniam.
translation:
  language: ml
  text: ശെമീദാവിന്റെ പുത്രന്മാർ[a] അഹ്യാൻ, ശെഖേം, ലിഖ്ഹി, അനീയാം എന്നിവരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ശെമീദാവിന്റെ പുരുഷസന്തതികൾ.’ വംശാവലികളിൽ ‘പുത്രന്മാർ’ എന്ന പദം ചിലപ്പോൾ പിന്നീടുള്ള തലമുറകളിലെ പുരുഷസന്തതികളെയും സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടത്തെ അടുത്ത സന്ദർഭം ‘പുത്രന്മാർ’ എന്ന അർഥത്തെയാണ് കൂടുതൽ പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: വംശാവലിപ്പട്ടികയിൽ היה എന്ന ക്രിയയുടെ ഈ രൂപം പേരുകൾ അവതരിപ്പിക്കുന്ന സ്വാഭാവിക ബന്ധകപ്രയോഗമാണ്; മലയാളത്തിൽ ‘ആയിരുന്നു’ പട്ടികയുടെ ഘടന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: ഈ പദത്തിന് വിശാലമായി പുരുഷസന്തതികൾ എന്നർഥം വരാമെങ്കിലും, ഇവിടെ പുരുഷനാമങ്ങളുടെ നേരിട്ടുള്ള പട്ടികയായതിനാൽ ‘പുത്രന്മാർ’ എന്ന മൂലപാഠത്തോട് അടുത്ത പ്രയോഗം സ്വീകരിച്ചു.
- source_word: שְׁמִידָע
  choice: ശെമീദാ
  rationale: ഹീബ്രു ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: אַחְיָן
  choice: അഹ്യാൻ
  rationale: ഹീബ്രു വ്യഞ്ജന-സ്വരരൂപത്തെ സമീപിക്കുന്നവിധം വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: שֶׁכֶם
  choice: ശെഖേം
  rationale: ഇവിടെ ഇത് സ്ഥലനാമമല്ല, വംശാവലിയിലെ വ്യക്തിനാമമാണ്; ഹീബ്രു ശബ്ദരൂപം പിന്തുടർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: לִקְחִי
  choice: ലിക്ക്ഹി
  rationale: ഹീബ്രു പദത്തിലെ ഖേത് ധ്വനിയെ സൂചിപ്പിക്കുന്നതും മലയാളത്തിൽ വായിക്കാവുന്നതുമായ ലിപ്യന്തരണം തിരഞ്ഞെടുത്തു.
- source_word: אֲנִיעָם
  choice: അനീയാം
  rationale: ഹീബ്രു സ്വരക്രമവും അന്ത്യഘടകവും കഴിയുന്നത്ര പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
