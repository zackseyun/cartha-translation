source:
  edition: WLC
  text: בִּנְיָמִ֗ן בֶּ֧לַע וָ/בֶ֛כֶר וִ/ידִֽיעֲאֵ֖ל שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/006.yaml
  text: 'The sons of Benjamin: Bela[a], Beker, and Jediael—three.'
translation:
  language: ml
  text: 'ബെന്യാമീന്റെ പുത്രന്മാർ: ബേല, ബേക്കർ, യെദീയയേൽ—മൂന്നുപേർ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: വ്യക്തിയുടെയും ഗോത്രത്തിന്റെയും പേരായി മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപം സ്വീകരിച്ചു. വംശാവലിയുടെ സന്ദർഭം വ്യക്തമാക്കാൻ മൂലപാഠത്തിൽ സൂചിതമായ ബന്ധം ‘പുത്രന്മാർ’ എന്നു പ്രകടമാക്കി.
- source_word: בֶּלַע
  choice: ബേല
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: בֶּכֶר
  choice: ബേക്കർ
  rationale: എബ്രായത്തിലെ כ എന്ന വ്യഞ്ജനത്തെ ഇവിടെ ‘ക്ക’ കൊണ്ട് നേരിട്ട് പ്രതിനിധീകരിച്ചു; ഇംഗ്ലീഷിലെ പരമ്പരാഗത ‘Becher’ എന്ന രൂപത്തെ ആശ്രയിച്ചിട്ടില്ല.
- source_word: יְדִיעֲאֵל
  choice: യെദീയയേൽ
  rationale: എബ്രായ ഉച്ചാരണഘടകങ്ങളെ മലയാളത്തിൽ കഴിയുന്നത്ര സുതാര്യമായി പ്രതിനിധീകരിക്കുന്ന ലിപ്യന്തരണം.
- source_word: שְׁלֹשָׁה
  choice: മൂന്നുപേർ
  rationale: പേരെടുത്തിരിക്കുന്ന മനുഷ്യരുടെ ആകെ എണ്ണം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തികളെ എണ്ണുന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: '[implicit genealogical heading]'
  choice: 'ബെന്യാമീന്റെ പുത്രന്മാർ:'
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിതവും സംക്ഷിപ്തവുമായ വംശാവലി പ്രയോഗത്തിൽ സൂചിതമായ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ഗൗരവമുള്ള വംശാവലി ശൈലി. പേരുകൾ ഇംഗ്ലീഷ് രൂപങ്ങളിൽനിന്നല്ല, എബ്രായ മൂലപാഠത്തിൽനിന്ന് മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു.
