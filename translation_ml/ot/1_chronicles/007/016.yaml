id: 1CH.7.16
reference: 1 Chronicles 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֨לֶד מַעֲכָ֤ה אֵֽשֶׁת מָכִיר֙ בֵּ֔ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ פֶּ֔רֶשׁ וְ/שֵׁ֥ם אָחִ֖י/ו שָׁ֑רֶשׁ וּ/בָנָ֖י/ו אוּלָ֥ם וָ/רָֽקֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
translation:
  language: ml
  text: മാഖീറിന്റെ ഭാര്യയായ മാഅഖാ ഒരു മകനെ പ്രസവിച്ചു; അവൾ അവന് പേരെശ് എന്നു പേരിട്ടു.[a] അവന്റെ സഹോദരന്റെ പേര് ശാരെശ് എന്നായിരുന്നു. അവന്റെ പുത്രന്മാർ[b] ഊലാമും രാകേമും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അവൾ അവന്റെ പേര് ‘പേരെശ്’ എന്നു വിളിച്ചു.”'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ആൺസന്തതികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: പ്രസവിച്ചു
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ ילד എന്ന ക്രിയയുടെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള പരിഭാഷ.
- source_word: מַעֲכָה אֵשֶׁת מָכִיר
  choice: മാഖീറിന്റെ ഭാര്യയായ മയഖാ
  rationale: ബന്ധസൂചന വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിക്കുന്നു.
- source_word: בֵּן
  choice: ഒരു മകനെ
  rationale: പേരുപറയുന്നതിനു മുമ്പ് ആൺസന്തതിയെ ഏകവചനത്തിലും അനിശ്ചിതമായും പരിചയപ്പെടുത്തുന്നു.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: അവൾ അവന് … എന്നു പേരിട്ടു
  rationale: എബ്രായത്തിലെ ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: פֶּרֶשׁ
  choice: പേരെശ്
  rationale: മസോറെറ്റിക് സ്വരീകരണം അനുസരിച്ച് വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְשֵׁם אָחִיו
  choice: അവന്റെ സഹോദരന്റെ പേര് … എന്നായിരുന്നു
  rationale: എബ്രായ നാമവാക്യത്തിന്റെ വംശാവലിശൈലിയും സർവനാമത്തിലെ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: שָׁרֶשׁ
  choice: ശാരെശ്
  rationale: WLC-യിലെ മസോറെറ്റിക് സ്വരീകരണം (šāreš) പിന്തുടർന്നുള്ള ലിപ്യന്തരണം.
- source_word: וּבָנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: വംശാവലിയിൽ בנים ആൺസന്തതികളെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗസൂചനയുള്ള ‘പുത്രന്മാർ’ ഉപയോഗിക്കുന്നു; സർവനാമത്തിന്റെ സാധ്യതയുള്ള അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: אוּלָם וָרָקֶם
  choice: ഊലാമും രാകേമും
  rationale: വ്യക്തിനാമങ്ങൾ മസോറെറ്റിക് ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്ത് സംയോജകത്തെ മലയാളത്തിലെ ‘-ഉം … -ഉം’ ഘടനയിൽ നൽകുന്നു.
theological_decisions:
- issue: וּבָנָיו എന്നതിലെ ‘അവന്റെ’ എന്ന സർവനാമത്തിന്റെ പൂർവപദം
  choice: ‘അവന്റെ’ എന്ന സർവനാമം തന്നെ നിലനിർത്തി പൂർവപദം വ്യക്തമാക്കാതിരിക്കുന്നു
  alternative: ‘ശാരെശിന്റെ പുത്രന്മാർ’ എന്നു വ്യക്തമായി എഴുതുക
  rationale: എബ്രായത്തിൽ പുരുഷ ഏകവചന സർവനാമം മാത്രമാണുള്ളത്. ഏറ്റവും അടുത്ത പൂർവപദം ശാരെശ് ആണെങ്കിലും, പേരെടുത്ത് ചേർക്കുന്നത് മൂലപാഠത്തിലെ വ്യാകരണപരമായ അവ്യക്തതയെ വ്യാഖ്യാനിച്ച് തീർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. വ്യക്തിനാമങ്ങൾ WLC-യിലെ മസോറെറ്റിക് സ്വരീകരണത്തിൽനിന്ന് നേരിട്ട് ലിപ്യന്തരണം ചെയ്തു; അതിനാൽ ഇംഗ്ലീഷ് രൂപമായ ‘Sheresh’ എന്നതിനു പകരം ‘ശാരെശ്’ ഉപയോഗിച്ചു. തുടർച്ചയായ ‘അവന്റെ’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ സാധ്യതയുള്ള പൂർവപദാവ്യക്തത സംരക്ഷിക്കുന്നു.
