translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വംശാവലി-സൈനിക കണക്കെടുപ്പിന്റെ ഔപചാരിക സ്വരം നിലനിർത്തിക്കൊണ്ട്, എബ്രായത്തിലെ സാന്ദ്രമായ പദക്രമം മലയാളത്തിൽ വായനാസൗകര്യമുള്ളതാക്കി.
