reference: 1 Chronicles 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/עֲלֵי/הֶ֨ם לְ/תֹלְדוֹתָ֜/ם לְ/בֵ֣ית אֲבוֹתָ֗/ם גְּדוּדֵי֙ צְבָ֣א מִלְחָמָ֔ה שְׁלֹשִׁ֥ים וְ/שִׁשָּׁ֖ה אָ֑לֶף כִּֽי הִרְבּ֥וּ נָשִׁ֖ים וּ/בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
translation:
  language: ml
  text: അവരോടൊപ്പം, അവരുടെ തലമുറകളനുസരിച്ചും പിതൃകുടുംബങ്ങളനുസരിച്ചും, യുദ്ധസൈന്യത്തിലെ സൈനികഗണങ്ങൾ[b] 36,000 ഉണ്ടായിരുന്നു; കാരണം അവർക്ക് ധാരാളം ഭാര്യമാരും[a] പുത്രന്മാരും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്ത്രീകൾ’; എബ്രായത്തിലെ נָשִׁים എന്ന പദത്തിന് രണ്ട് അർഥങ്ങളും വരാം. എന്നാൽ ഇവിടെ വംശാവലിയുടെയും കുടുംബങ്ങളുടെയും സന്ദർഭം ‘ഭാര്യമാർ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘യുദ്ധസൈന്യത്തിലെ സൈനികഗണങ്ങൾ’ എന്നത് സാന്ദ്രമായ ഒരു എബ്രായ സൈനികപ്രയോഗമാണ്; ‘യുദ്ധത്തിനായുള്ള സൈന്യവിഭാഗങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלֵיהֶם
  choice: അവരോടൊപ്പം
  rationale: പട്ടികയുടെയും ജനസംഖ്യാകണക്കിന്റെയും സന്ദർഭത്തിൽ עַל എന്ന പദം അവരോടു ചേർന്നോ അവരുമായി ബന്ധപ്പെട്ടോ ഉള്ളവരെ സൂചിപ്പിക്കുന്നു; സ്ഥലപരമായ ‘അവരുടെ മുകളിൽ’ എന്നതിനെക്കാൾ ‘അവരോടൊപ്പം’ സ്വാഭാവികമാണ്.
- source_word: לְתֹלְדוֹתָם
  choice: അവരുടെ വംശപരമ്പര അനുസരിച്ച്
  rationale: תּוֹלְדוֹת ഇവിടെ തലമുറകളെയോ വംശാവലിവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വംശപരമായ ക്രമീകരണം വ്യക്തമായി അറിയിക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: לְבֵית אֲבוֹתָם
  choice: പിതൃഭവനങ്ങൾ അനുസരിച്ച്
  rationale: ഗോത്രത്തിനുള്ളിലെ പിതൃവംശാധിഷ്ഠിത കുടുംബവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണിത്; ‘പിതൃഭവനങ്ങൾ’ സാമൂഹികഘടന സംരക്ഷിക്കുന്നു.
- source_word: גְּדוּדֵי צְבָא מִלְחָמָה
  choice: യുദ്ധത്തിനുള്ള സൈനികഗണങ്ങൾ
  rationale: גְּדוּדֵי എന്നത് ഗണങ്ങളെയോ സൈനികവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു; צְבָאയും מִלְחָמָהയും ചേർന്ന സാന്ദ്രമായ സൈനികപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שְׁלֹשִׁים וְשִׁשָּׁה אָלֶף
  choice: 36,000
  rationale: കൃത്യമായ സംഖ്യ ആധുനിക വായനാസൗകര്യത്തിനായി അക്കത്തിൽ നൽകി.
- source_word: כִּי
  choice: കാരണം
  rationale: മുമ്പ് പറഞ്ഞ വലിയ സൈനികസംഖ്യയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: הִרְבּוּ
  choice: ധാരാളം ... ഉണ്ടായിരുന്നു
  rationale: רבה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ സംഖ്യാബാഹുല്യത്തെ സൂചിപ്പിക്കുന്നു; ഭാര്യകളും പുത്രന്മാരും എന്ന കർമങ്ങളോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: נָשִׁים
  choice: ഭാര്യമാർ
  rationale: പദത്തിന് ‘സ്ത്രീകൾ’ എന്നും അർഥമുണ്ടെങ്കിലും, പുത്രന്മാരോടു ചേർന്ന കുടുംബ-വംശാവലി സന്ദർഭത്തിൽ ‘ഭാര്യമാർ’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: וּבָנִים
  choice: പുത്രന്മാർ
  rationale: בָּנִים എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിച്ചു; ‘മക്കൾ’ എന്ന് വിശാലമാക്കിയില്ല.
