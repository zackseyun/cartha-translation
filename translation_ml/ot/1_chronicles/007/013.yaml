    text: ഉല്പത്തി 46:24-ൽ ഈ പേര് ‘യഹസേൽ’ എന്നാണ്; ഇവിടെ 1 ദിനവൃത്താന്തത്തിൽ ‘യഹസീയേൽ’ എന്നാണ്.
    reason: alternative_reading
