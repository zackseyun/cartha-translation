source:
  edition: WLC
  text: בְּנֵ֣י נַפְתָּלִ֗י יַחֲצִיאֵ֧ל וְ/גוּנִ֛י וְ/יֵ֥צֶר וְ/שַׁלּ֖וּם בְּנֵ֥י בִלְהָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/013.yaml
  text: 'The sons of Naphtali: Jahziel[a], Guni, Jezer, and Shallum—the sons of Bilhah.'
translation:
  language: ml
  text: 'നഫ്താലിയുടെ പുത്രന്മാർ: യഹസീയേൽ[a], ഗൂനി, യേസെർ, ശല്ലൂം[b]—ഇവർ ബിൽഹയുടെ പുത്രന്മാർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഉല്പത്തി 46:24-ൽ ഈ പേര് ‘യഹസേൽ’ എന്നാണ്; ഇവിടെ 1 ദിനവൃത്താന്തത്തിൽ ‘യഹസീയേൽ’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: ഉല്പത്തി 46:24-ൽ ഈ പേര് ‘ശില്ലേം’ എന്നാണ്; ഇവിടെ 1 ദിനവൃത്താന്തത്തിൽ ‘ശല്ലൂം’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: നഫ്താലിയുടെ പുത്രന്മാർ
  rationale: בן എന്ന പദത്തിന്റെ construct plural ഇവിടെ നഫ്താലിയുടെ നേരിട്ടുള്ള നാല് ആൺമക്കളെ പരിചയപ്പെടുത്തുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്നത് ഏറ്റവും കൃത്യമാണ്.
- source_word: יַחֲצִיאֵל
  choice: യഹ്സീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം ആധുനിക മലയാളലിപിയിൽ കഴിയുന്നത്ര സംരക്ഷിക്കുന്ന ലിപ്യന്തരണം.
- source_word: גוּנִי
  choice: ഗൂനി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: יֵצֶר
  choice: യേസെർ
  rationale: ആദ്യാക്ഷരമായ യോദിനെയും ഇടയിലെ സാദേ വ്യഞ്ജനത്തെയും പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שַׁלּוּם
  choice: ശല്ലൂം
  rationale: ദിനവൃത്താന്തത്തിലെ മസോററ്റിക് പാഠമായ שַׁלּוּם പിന്തുടരുന്നു; ഉല്പത്തി 46:24-ലെ വ്യത്യസ്ത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי בִלְהָה
  choice: ഇവർ ബിൽഹായുടെ പുത്രന്മാർ
  rationale: വംശാവലിസംബന്ധമായ സമാപനപരാമർശമാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മൂലത്തിലെ ആവർത്തനവും ബന്ധവും സംരക്ഷിക്കുന്നു.
