id: 1CH.7.35
reference: 1 Chronicles 7:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בֶן הֵ֖לֶם אָחִ֑י/ו צוֹפַ֥ח וְ/יִמְנָ֖ע וְ/שֵׁ֥לֶשׁ וְ/עָמָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/035.yaml
  text: 'The son of Helem his brother: Zophah[a], Imna, Shelesh, and Amal.'
translation:
  language: ml
  text: 'അവന്റെ സഹോദരനായ ഹേലെമിന്റെ മകൻ: സോഫഹ്[a], യിമ്നാ, ശേലെശ്, ആമാൽ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപേരായ צוֹפַח എന്നത് അവസാനത്തെ ח എന്ന അക്ഷരം എങ്ങനെ ലിപ്യന്തരണം ചെയ്യുന്നു എന്നതനുസരിച്ച് ‘സോഫഖ്’ എന്നും എഴുതാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: മകൻ
  rationale: בֶן ഏകവചനമായതിനാൽ വംശാവലിപ്പട്ടികയിൽ ഒന്നിലധികം പേരുകൾ തുടർന്നുവരുന്ന അസാധാരണ ഘടന പരിഹരിക്കാതെ ഏകവചനം നിലനിർത്തുന്നു. തുടക്കത്തിലെ וּ സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ പ്രത്യേകം പദമായി പ്രകടിപ്പിച്ചിട്ടില്ല.
- source_word: הֵלֶם
  choice: ഹേലെം
  rationale: എബ്രായ വ്യക്തിനാമം അതിന്റെ സ്വരരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אָחִיו
  choice: അവന്റെ സഹോദരനായ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം ഉൾപ്പെടുന്ന ബന്ധപദം നേരിട്ട് നിലനിർത്തുന്നു; ‘അവൻ’ ആരെ സൂചിപ്പിക്കുന്നു എന്ന് വാക്യം വിശദീകരിക്കാത്തതിനാൽ അതിന്റെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- source_word: צוֹפַח
  choice: സോഫഹ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാള വായനയ്ക്ക് സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു; അവസാന ח-യുടെ പ്രതിനിധാനത്തിന് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וְיִמְנָע
  choice: യിമ്നാ
  rationale: ആദ്യ വ്യഞ്ജനമായ י നിലനിർത്തി വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു; പട്ടികയിലെ ബന്ധകമായ וְ മലയാളത്തിലെ കോമകളാൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: וְשֵׁלֶשׁ
  choice: ശേലെശ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְעָמָל
  choice: ആമാൽ
  rationale: അവസാന വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; പട്ടികയുടെ ചുരുക്കമായ വംശാവലി ശൈലി നിലനിർത്തി.
