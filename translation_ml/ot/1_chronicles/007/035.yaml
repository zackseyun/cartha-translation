  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും ലളിതവുമായ മലയാളം ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ഏകവചനമായ ‘മകൻ’ എന്ന രൂപവും ‘അവന്റെ’ എന്ന സർവനാമത്തിന്റെ വ്യക്തമല്ലാത്ത പൂർവപദവും വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തി.
