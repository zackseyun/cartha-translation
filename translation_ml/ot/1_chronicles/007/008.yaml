translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി സ്വീകരിച്ചു. വ്യക്തിനാമങ്ങൾ ഇംഗ്ലീഷ് രൂപങ്ങളെ യാന്ത്രികമായി പിന്തുടരാതെ WLC-യിലെ ഹീബ്രു ശബ്ദരൂപങ്ങളെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു. പട്ടികയുടെ വ്യക്തതയ്ക്കായി ദ്വിബിന്ദുവും കോമകളും ഉപയോഗിച്ചു.
