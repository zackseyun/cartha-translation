reference: 1 Chronicles 7:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֣י בֶ֗כֶר זְמִירָ֡ה וְ/יוֹעָ֡שׁ וֶ֠/אֱלִיעֶזֶר וְ/אֶלְיוֹעֵינַ֤י וְ/עָמְרִי֙ וִ/ירֵמ֣וֹת וַ/אֲבִיָּ֔ה וַ/עֲנָת֖וֹת וְ/עָלָ֑מֶת כָּל אֵ֖לֶּה בְּנֵי בָֽכֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
translation:
  language: ml
  text: 'ബേക്കെരിന്റെ പുത്രന്മാർ: സെമീരാ, യോവാശ്, എലീയേസെർ, എല്യോഎനായി, ഒമ്രി, യെരേമോത്ത്[a], അബീയാ, അനാഥോത്ത്, ആലാമെത്ത്. ഇവരെല്ലാവരും ബേക്കെരിന്റെ പുത്രന്മാരായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പേര് ‘യെരീമോത്ത്’ എന്നും ലിപ്യന്തരം ചെയ്യാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ בְּנֵי എന്നത് പുരുഷസന്തതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്ന് നൽകി. ഹീബ്രുവിലെ വാക്യാരംഭകമായ וּ പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും, മുൻവാക്യവുമായി സ്വാഭാവികമായി ബന്ധപ്പെടുന്ന മലയാളത്തിൽ പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കേണ്ടതില്ല.
- source_word: בֶכֶר
  choice: ബേക്കെർ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തി.
- source_word: זְמִירָה
  choice: സെമീരാ
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി പകർത്തി.
- source_word: יוֹעָשׁ
  choice: യോവാശ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ സാധാരണ മലയാള ലിപ്യന്തരണം.
- source_word: אֱלִיעֶזֶר
  choice: എലീയേസെർ
  rationale: ഹീബ്രു സ്വരഘടനയും വ്യക്തിനാമത്തിന്റെ തിരിച്ചറിയാവുന്ന രൂപവും നിലനിർത്തുന്ന ലിപ്യന്തരണം.
- source_word: אֶלְיוֹעֵינַי
  choice: എല്യോവേനായി
  rationale: മസോരറ്റിക് സ്വരസാക്ഷ്യത്തെ അടിസ്ഥാനമാക്കി വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עָמְרִי
  choice: ഒമ്രി
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: יְרֵמוֹת
  choice: യെരേമോത്ത്
  rationale: ഈ വാക്യത്തിലെ മസോരറ്റിക് രൂപമായ יְרֵמוֹת-നോട് അടുത്തുനിൽക്കുന്ന ലിപ്യന്തരണം; വ്യത്യസ്ത സ്വരവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אֲבִיָּה
  choice: അബീയാ
  rationale: അവസാന ഘടകമായ יָהּ-ന്റെ ശബ്ദസാന്നിധ്യം നിലനിർത്തിക്കൊണ്ട് ഹീബ്രു വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: עֲנָתוֹת
  choice: അനാഥോത്ത്
  rationale: മറ്റിടങ്ങളിൽ സ്ഥലനാമമായും കാണപ്പെടുന്നുവെങ്കിലും ഇവിടെ വംശാവലിപ്പട്ടികയിലെ വ്യക്തിനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: עָלָמֶת
  choice: ആലേമെത്ത്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മസോരറ്റിക് സ്വരരൂപത്തെ പിന്തുടർന്ന ലിപ്യന്തരണം.
- source_word: כָּל אֵלֶּה בְּנֵי בָכֶר
  choice: ഇവരെല്ലാവരും ബേക്കെരിന്റെ പുത്രന്മാരായിരുന്നു
  rationale: സംഗ്രഹവാക്യത്തിന്റെ അർഥം കൃത്യമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണ്ണവാക്യമായി നൽകി.
