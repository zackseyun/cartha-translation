    text: എബ്രായത്തിൽ ‘മുകളിലേത്’ എന്നു മാത്രമാണ്; ‘ബേത്ത്-ഹോരോൻ’ മുൻപറഞ്ഞതിൽനിന്ന് മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ שֶׁאֱרָה
  choice: അവന്റെ മകൾ ശെയെരാ ആയിരുന്നു
  rationale: വാക്യാരംഭത്തിലെ സംയോജകത്തെ മലയാള വംശാവലിശൈലിയിൽ സ്വാഭാവികമായി വിടുകയും, ‘അവന്റെ മകൾ’ എന്ന ബന്ധവും ശെയെരാ എന്ന പേരും വ്യക്തമായി നിലനിർത്തുകയും ചെയ്തു.
- source_word: וַתִּבֶן
  choice: അവൾ ... പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘പണിയുക’ നിലനിർത്തുന്നു; പട്ടണങ്ങൾ സ്ഥാപിച്ചു എന്നോ പുനർനിർമിച്ചു എന്നോ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: താഴത്തെ ബേത്ത്-ഹോരോൻ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും הַתַּחְתּוֹן എന്ന വിശേഷണം സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകുകയും ചെയ്തു.
- source_word: הָעֶלְיוֹן
  choice: മുകളിലത്തേത്
  rationale: എബ്രായത്തിൽ ‘ബേത്ത്-ഹോരോൻ’ ആവർത്തിച്ചിട്ടില്ല; മുൻപറഞ്ഞ സ്ഥലനാമം സൂചിപ്പിക്കുന്ന വിശേഷണരൂപം മലയാളത്തിലും നിലനിർത്തി.
- source_word: אֻזֵּן שֶׁאֱרָה
  choice: ഉസ്സേൻ-ശെയെരാ
  rationale: ഒരൊറ്റ സംയുക്ത സ്ഥലനാമമാണെന്ന് വ്യക്തമാക്കാൻ ഹൈഫനോടുകൂടി ലിപ്യന്തരണം ചെയ്തു.
