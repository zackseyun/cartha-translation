  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
translation:
  language: ml
  text: അവന്റെ മകൾ ശെയേരാ ആയിരുന്നു[a]. അവൾ താഴത്തെ ബേത്ത്-ഹോരോനും മുകളിലെ ബേത്ത്-ഹോരോനും[b] ഉസ്സേൻ-ശെയേരായും പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘അവന്റെ മകളും ശെയേരാ’; വാക്യാരംഭത്തിൽ ഒരു സംയോജകവുമുണ്ട്.
    reason: lexical_alternative
