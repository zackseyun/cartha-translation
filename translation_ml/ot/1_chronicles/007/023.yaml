  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹא֙ אֶל אִשְׁתּ֔/וֹ וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יִּקְרָ֤א אֶת שְׁמ/וֹ֙ בְּרִיעָ֔ה כִּ֥י בְ/רָעָ֖ה הָיְתָ֥ה בְּ/בֵיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
translation:
  language: ml
  text: പിന്നെ അവൻ തന്റെ ഭാര്യയുമായി ശാരീരികബന്ധത്തിൽ ഏർപ്പെട്ടു[a]. അവൾ ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിച്ചു. അവൻ ആ മകന് ബെരീയാവ് എന്നു പേരിട്ടു[b]; കാരണം അവന്റെ വീട്ടിൽ അനർഥം ഉണ്ടായിരുന്നതിനാൽ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായഭാഷയിൽ ഇത് ഭാര്യയുമായുള്ള ശാരീരികബന്ധത്തെ സൂചിപ്പിക്കുന്ന മര്യാദാപൂർവമായ പ്രയോഗമാണ്; അക്ഷരാർഥത്തിൽ, ‘അവൻ തന്റെ ഭാര്യയുടെ അടുക്കൽ ചെന്നു.’
    reason: lexical_alternative
  - marker: b
    text: ‘ബെരീയാവ്’ എന്ന പേരിനും ‘അനർഥത്തിൽ’ എന്നർഥമുള്ള എബ്രായപ്രയോഗത്തിനും ശബ്ദസാമ്യമുണ്ട്.
    reason: wordplay
  - marker: c
    text: ‘അനർഥം’ എന്നത് ഇവിടെ ധാർമിക തിന്മയെയല്ല, അവന്റെ കുടുംബത്തെ ബാധിച്ച ദുരന്തത്തെയോ ദൗർഭാഗ്യത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വീട്’ എന്നതിന് ‘കുടുംബം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל אִשְׁתּוֹ
  choice: അവൻ തന്റെ ഭാര്യയുമായി ശാരീരികബന്ധത്തിൽ ഏർപ്പെട്ടു
  rationale: ബോ എൽ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ ഭാര്യയുമായുള്ള ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന മര്യാദാപൂർവമായ ഭാഷയാണ്. അർഥം അവ്യക്തമാകാതെ ആധുനിക മലയാളത്തിൽ മാന്യമായി നൽകുന്നു.
- source_word: וַתַּהַר וַתֵּלֶד בֵּן
  choice: അവൾ ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിച്ചു
  rationale: ഗർഭധാരണവും പ്രസവവും വ്യക്തമാക്കുന്ന എബ്രായ ജനനവിവരണത്തിന്റെ സംക്ഷിപ്ത ക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ בְּרִיעָה
  choice: അവൻ അവന് ബെരീയാവ് എന്നു പേരിട്ടു
  rationale: ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന അക്ഷരാർഥത്തേക്കാൾ പേരിടൽസൂത്രത്തിന്റെ ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְרִיעָה
  choice: ബെരീയാവ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ ബൈബിൾനാമരീതിക്കനുസരിച്ച് ലിപ്യന്തരണം ചെയ്തു.
- source_word: כִּי בְרָעָה הָיְתָה בְּבֵיתוֹ
  choice: കാരണം അവന്റെ വീട്ടിൽ അനർഥം ഉണ്ടായിരുന്നതാണ്
  rationale: כִּי കാരണത്തെ അവതരിപ്പിക്കുന്നു. רָעָה ഇവിടെ ധാർമിക തിന്മയല്ല, കുടുംബത്തെ ബാധിച്ച ദുരന്തമോ ദൗർഭാഗ്യമോ ആണ്. ‘വീട്ടിൽ ... ഉണ്ടായിരുന്നത്’ എന്ന രൂപം എബ്രായ വാക്യഘടനയും ‘വീട്’ എന്ന പദത്തിന്റെ കുടുംബം/ഭവനം എന്ന അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: רָעָה എന്ന പദത്തിന്റെ അർഥം
  choice: അനർഥം
  alternative: തിന്മ; ദുരന്തം; ദൗർഭാഗ്യം
  rationale: മുൻസന്ദർഭത്തിൽ കുടുംബത്തെ ബാധിച്ച മരണങ്ങളാണ് ഉദ്ദേശ്യം; അതിനാൽ ധാർമിക തിന്മ എന്ന വ്യാഖ്യാനം ഒഴിവാക്കി, സംഭവിച്ച കഷ്ടതയെ സൂചിപ്പിക്കുന്ന പദം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവും വിവരണാത്മകവുമായ ശൈലി. ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ മര്യാദാപ്രയോഗം അസ്പഷ്ടമാക്കാതെ മാന്യമായി വിവർത്തനം ചെയ്തു. പേരിനും അനർഥത്തിനുമിടയിലെ എബ്രായ ശബ്ദകളി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
