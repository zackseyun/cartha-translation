source:
  edition: WLC
  text: וַ/אֲחֻזָּתָ/ם֙ וּ/מֹ֣שְׁבוֹתָ֔/ם בֵּֽית אֵ֖ל וּ/בְנֹתֶ֑י/הָ וְ/לַ/מִּזְרָ֣ח נַעֲרָ֔ן וְ/לַֽ/מַּעֲרָ֗ב גֶּ֤זֶר וּ/בְנֹתֶ֨י/הָ֙ וּ/שְׁכֶ֣ם וּ/בְנֹתֶ֔י/הָ עַד עַיָּ֖ה וּ/בְנֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/028.yaml
  text: Their holdings and settlements were Bethel and its daughter towns[a], and to the east Naaran, and to the west Gezer and its daughter towns, and Shechem and its daughter towns[c][b], as far as Ayyah and its daughter towns.
translation:
  language: ml
  text: 'അവരുടെ ഭൂസ്വത്തുക്കളും വാസസ്ഥലങ്ങളും ഇവയായിരുന്നു: ബേത്തേലും അതിന്റെ അധീനപട്ടണങ്ങളും[b], കിഴക്കോട്ട് നയരാനും[a], പടിഞ്ഞാറോട്ട് ഗേസെരും അതിന്റെ അധീനപട്ടണങ്ങളും, ശെഖേമും അതിന്റെ അധീനപട്ടണങ്ങളും, അയ്യായും അതിന്റെ അധീനപട്ടണങ്ങളും വരെയും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബന്ധപ്പെട്ട മറ്റൊരു സ്ഥലനാമപാരമ്പര്യത്തെ അടിസ്ഥാനമാക്കി ചിലർ ‘നയരാ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘അധീനപട്ടണങ്ങൾ’ എന്നിടത്ത് എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘പുത്രിമാർ’ എന്നാണ് പറയുന്നത്. ഒരു പ്രധാന നഗരത്തോടു ചേർന്ന ചെറിയ പട്ടണങ്ങളെയോ ഗ്രാമങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: אֲחֻזָּתָם
  choice: അവരുടെ കൈവശഭൂമികൾ
  rationale: ഭൂമിശാസ്ത്രപരമായ ഈ പട്ടികയിൽ ഈ പദം ഭൂസ്വത്തെയോ അധീനപ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘സ്വത്തുക്കൾ’ എന്നതിനെക്കാൾ ‘കൈവശഭൂമികൾ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: מֹשְׁבוֹתָם
  choice: വാസസ്ഥലങ്ങൾ
  rationale: ജനങ്ങൾ പാർത്തിരുന്ന ഇടങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രൂപം.
- source_word: בֵּית אֵל
  choice: ബേത്തേൽ
  rationale: സ്ഥലപ്പേരിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: בְנֹתֶיהָ
  choice: അതിന്റെ അധീനപട്ടണങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ പുത്രിമാർ’; ഒരു പ്രധാന നഗരത്തോടു ചേർന്നോ അതിന്റെ അധികാരത്തിൻ കീഴിലോ ഉള്ള ചെറിയ പട്ടണങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്. മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ‘അധീനപട്ടണങ്ങൾ’ ഉപയോഗിച്ചു; രൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: לַמִּזְרָח
  choice: കിഴക്കോട്ട്
  rationale: പ്രദേശത്തിന്റെ കിഴക്കൻ ദിശയെയോ അതിരിനെയോ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: נַעֲרָן
  choice: നയരാൻ
  rationale: മസോരറ്റിക് പാഠത്തിലെ സ്ഥലനാമത്തിന്റെ ലിപ്യന്തരണം; ബന്ധപ്പെട്ട മറ്റൊരു സ്ഥലനാമപാരമ്പര്യത്തിലുള്ള ‘നയരാ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לַמַּעֲרָב
  choice: പടിഞ്ഞാറോട്ട്
  rationale: കിഴക്കോട്ട് എന്ന ദിശാസൂചനയ്ക്ക് സമാന്തരമായി പടിഞ്ഞാറൻ ദിശ വ്യക്തമാക്കുന്നു.
- source_word: גֶּזֶר
  choice: ഗേസെർ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: שְׁכֶם
  choice: ശെഖേം
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: עַד
  choice: വരെയും
  rationale: പ്രദേശത്തിന്റെ വ്യാപ്തിയുടെയോ അതിരിന്റെയോ അവസാനബിന്ദു സൂചിപ്പിക്കുന്നു.
- source_word: עַיָּה
  choice: അയ്യാ
  rationale: മസോരറ്റിക് പാഠത്തിലെ עַיָּה എന്ന വായനയെ ലിപ്യന്തരിച്ചു; ചില പുരാതന സാക്ഷ്യങ്ങളിലെ വ്യത്യസ്ത വായന മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
