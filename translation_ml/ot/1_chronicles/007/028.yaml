translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്ര-ഭൂമിശാസ്ത്ര ശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു. ആവർത്തിക്കുന്ന എബ്രായ ഘടന നിലനിർത്തിയെങ്കിലും ‘പുത്രിമാർ’ എന്ന അപരിചിത നഗരരൂപകത്തിന് മുഖ്യപാഠത്തിൽ വ്യക്തമായ ‘അധീനപട്ടണങ്ങൾ’ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
