id: 1CH.7.31
reference: 1 Chronicles 7:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֣י בְרִיעָ֔ה חֶ֖בֶר וּ/מַלְכִּיאֵ֑ל ה֖וּא אֲבִ֥י ברזות׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/031.yaml
  text: 'The sons of Beriah: Heber and Malchiel[b][a]; he was the father of Birzaith.'
translation:
  language: ml
  text: 'ബെരീയാവിന്റെ പുത്രന്മാർ: ഹേബെരും മൽക്കീയേലും. അവൻ ബിർസയിത്തിന്റെ[b] പിതാവായിരുന്നു[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബിർസയിത്തിന്റെ പൂർവികൻ’ അല്ലെങ്കിൽ ‘ബിർസയിത്തിന്റെ സ്ഥാപകൻ.’ വംശാവലികളിൽ ‘പിതാവ്’ എന്നത് ഉടനെയുള്ള ജൈവപിതാവിനെ മാത്രമല്ല, ഒരു കുലത്തിന്റെയോ വാസസ്ഥലത്തിന്റെയോ പൂർവികനെയോ സ്ഥാപകനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ പേര് ‘ബിർസോത്ത്’ അല്ലെങ്കിൽ ‘ബെരാസോത്ത്’ എന്നും ലിപ്യന്തരണം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בְרִיעָה
  choice: ബെരീയാവിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ ഒരു ഉപവിഭാഗം അവതരിപ്പിക്കുന്ന ഘടന. തുടക്കത്തിലെ וּ സ്വാഭാവികമായ മലയാള പട്ടികാശൈലിയിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: חֶבֶר
  choice: ഹേബെർ
  rationale: വ്യക്തിനാമം; എബ്രായ രൂപത്തെ അനുസരിച്ചുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: וּמַלְכִּיאֵל
  choice: മൽക്കീയേലും
  rationale: വ്യക്തിനാമത്തോടു ചേർന്ന וּ മലയാളത്തിലെ ‘-ഉം’ ഉപയോഗിച്ച് രണ്ടു പേരെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: הוּא
  choice: അവൻ
  rationale: തൊട്ടുമുമ്പുള്ള ഏകവചന പുല്ലിംഗ പരാമർശത്തെ പുനരെടുക്കുന്ന സ്വതന്ത്ര സർവനാമം; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന കാര്യത്തിൽ മൂലപാഠത്തിലുള്ള വ്യാകരണരീതി നിലനിർത്തുന്നു.
- source_word: אֲבִי
  choice: പിതാവായിരുന്നു
  rationale: അക്ഷരാർഥവും വംശാവലിശൈലിയും നിലനിർത്തുന്നു; ‘പൂർവികൻ’ അല്ലെങ്കിൽ ഒരു കുലത്തിന്റെയോ സ്ഥലത്തിന്റെയോ ‘സ്ഥാപകൻ’ എന്ന വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ברזות
  choice: ബിർസയിത്ത്
  rationale: അപൂർവവും സ്വരചിഹ്നങ്ങളില്ലാത്തതുമായ പേരിന്റെ പരമ്പരാഗത രൂപത്തോട് ചേർന്ന സൂക്ഷ്മമായ ലിപ്യന്തരണം; ഇത് സ്ഥലമോ കുലമോ ആയിരിക്കാം, എന്നാൽ മുഖ്യപാഠത്തിൽ അതു നിർണയിക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. പേരുകൾ മൂലഭാഷയോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; അപൂർവമായ അവസാനനാമത്തിന്റെ അനിശ്ചിതത്വവും ‘പിതാവ്’ എന്ന ബന്ധപദത്തിന്റെ വിശാല അർഥസാധ്യതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
