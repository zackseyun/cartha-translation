  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
translation:
  language: ml
  text: മനശ്ശെയുടെ മക്കളുടെ അതിർത്തിയോടു ചേർന്ന്[b] ബേത്ത്-ശെയാനും അതിന്റെ ആശ്രിതഗ്രാമങ്ങളും[a], താനാക്കും അതിന്റെ ആശ്രിതഗ്രാമങ്ങളും, മെഗിദ്ദോയും അതിന്റെ ആശ്രിതഗ്രാമങ്ങളും, ദോരും അതിന്റെ ആശ്രിതഗ്രാമങ്ങളും ഉണ്ടായിരുന്നു. ഇവിടങ്ങളിൽ ഇസ്രായേലിന്റെ മകനായ യോസേഫിന്റെ മക്കൾ പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആശ്രിതഗ്രാമങ്ങൾ’ എന്നതിന് ‘ഗ്രാമങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘പുത്രിമാർ’ എന്നാണ്. മുഖ്യനഗരത്തെ ആശ്രയിച്ചിരുന്ന ചുറ്റുപാടിലെ കുടിയിരിപ്പുകളെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ആദ്യവാക്യഭാഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘മനശ്ശെയുടെ മക്കളുടെ അരികിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ എബ്രായപ്രയോഗം ഭൂപ്രദേശങ്ങളുടെ സമീപസ്ഥതയെയോ അതിർത്തിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יְדֵי
  choice: അതിർത്തിയോടു ചേർന്ന്
  rationale: ഭൂപ്രദേശങ്ങളുടെ പട്ടികയിൽ ഈ പ്രയോഗം അക്ഷരാർഥത്തിലുള്ള ‘കൈ’യെക്കാൾ സമീപസ്ഥതയെയോ അതിർത്തിയോടു ചേർന്നുള്ള സ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: בְנֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മക്കൾ
  rationale: ഗോത്രവംശജരെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ വംശാവലിപരമായ ‘മക്കൾ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: בֵּית שְׁאָן
  choice: ബേത്ത്-ശെയാൻ
  rationale: മസോററ്റിക് ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וּבְנֹתֶיהָ / וּבְנוֹתֶיהָ
  choice: അതിന്റെ ഉപനഗരങ്ങൾ
  rationale: അക്ഷരാർഥം ‘പുത്രിമാർ’ എന്നാണെങ്കിലും നഗരപ്പട്ടികകളിൽ മുഖ്യനഗരത്തെ ആശ്രയിച്ചുള്ള ചുറ്റുപാടിലെ കുടിയിരിപ്പുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഉപനഗരങ്ങൾ’ ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּעְנַךְ
  choice: താനാക്ക്
  rationale: സ്ഥലനാമത്തിന്റെ മൂലപാഠാധിഷ്ഠിത മലയാള ലിപ്യന്തരണം.
- source_word: מְגִדּוֹ
  choice: മെഗിദ്ദോ
  rationale: സ്ഥലനാമത്തിന്റെ പതിവായ മലയാള ലിപ്യന്തരണം.
- source_word: דּוֹר
  choice: ദോർ
  rationale: സ്ഥലനാമത്തിന്റെ മൂലപാഠാധിഷ്ഠിത മലയാള ലിപ്യന്തരണം.
- source_word: בְאֵלֶּה
  choice: ഇവിടങ്ങളിൽ
  rationale: മുൻപു പറഞ്ഞ നഗരങ്ങളെയും അവയുടെ അധീന കുടിയിരിപ്പുകളെയും സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്ഥലം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: יָשְׁבוּ
  choice: പാർത്തു
  rationale: തുടർച്ചയായ വാസത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള പ്രയോഗം.
- source_word: בְנֵי יוֹסֵף
  choice: യോസേഫിന്റെ മക്കൾ
  rationale: യോസേഫിൽനിന്നുള്ള ഗോത്രവംശജരെ സൂചിപ്പിക്കുന്ന വംശാവലിപരമായ ഭാഷ നിലനിർത്തുന്നു.
- source_word: בֶּן יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മകനായ
  rationale: യോസേഫിനെ ഇസ്രായേലിന്റെ മകനായി തിരിച്ചറിയിക്കുന്ന മൂലപാഠത്തിലെ സമാനാധികരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
