id: 1CH.7.9
reference: 1 Chronicles 7:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִתְיַחְשָׂ֣/ם לְ/תֹלְדוֹתָ֗/ם רָאשֵׁי֙ בֵּ֣ית אֲבוֹתָ֔/ם גִּבּוֹרֵ֖י חָ֑יִל עֶשְׂרִ֥ים אֶ֖לֶף וּ/מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/009.yaml
  text: 'They were enrolled by genealogy[a], according to their generations, as heads of their fathers’ houses[b], mighty men of valor: twenty thousand two hundred.'
translation:
  language: ml
  text: അവർ തങ്ങളുടെ വംശപരമ്പരകൾ അനുസരിച്ച് വംശാവലിയിൽ രേഖപ്പെടുത്തപ്പെട്ടവരായിരുന്നു[a]; തങ്ങളുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാരായ പരാക്രമശാലികൾ—ഇരുപതിനായിരത്തി ഇരുനൂറുപേർ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വംശാവലിപ്രകാരം രജിസ്റ്റർ ചെയ്യപ്പെട്ടു.’ എബ്രായക്രിയ വംശാവലിരേഖയിൽ ചേർക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പിതൃഭവനങ്ങൾ’ എന്നത് അണുകുടുംബങ്ങളെ മാത്രമല്ല, പൊതുപൂർവികനെ അടിസ്ഥാനമാക്കിയുള്ള കുടുംബ-കുലഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְיַחְשָׂם
  choice: അവർ ... വംശാവലിയിൽ രേഖപ്പെടുത്തപ്പെട്ടു
  rationale: ദിനവൃത്താന്തങ്ങളിൽ יחשׂ എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം ഒരാളെ വംശാവലിരേഖയിൽ ചേർക്കുകയോ കണക്കാക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ അതിന്റെ ഭരണപരവും വംശാവലിസംബന്ധവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: לְתֹלְדוֹתָם
  choice: തങ്ങളുടെ തലമുറകൾക്കനുസരിച്ച്
  rationale: תולדות തലമുറകളെയോ വംശപരമ്പരയെയോ സൂചിപ്പിക്കുന്നു. എബ്രായപ്രയോഗത്തിന്റെ രൂപവും വംശാവലിപശ്ചാത്തലവും പരമാവധി നിലനിർത്തുന്ന പരിഭാഷയാണിത്.
- source_word: רָאשֵׁי בֵּית אֲבוֹתָם
  choice: തങ്ങളുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാർ
  rationale: ദിനവൃത്താന്തങ്ങളിലെ ഈ പ്രയോഗം പൂർവികരിലൂടെ നിർവചിക്കപ്പെട്ട കുടുംബ-കുലഘടകങ്ങളുടെ നേതാക്കളെ സൂചിപ്പിക്കുന്നു. 'പിതൃഭവനങ്ങൾ' മൂലത്തിലെ സാമൂഹികഘടന സംരക്ഷിക്കുന്നു.
- source_word: גִּבּוֹרֵי חָיִל
  choice: പരാക്രമശാലികൾ
  rationale: ഈ പദസമുച്ചയം ശക്തി, ധൈര്യം, യുദ്ധശേഷി എന്നിവയുള്ള പുരുഷന്മാരെ സൂചിപ്പിക്കാം. 'പരാക്രമശാലികൾ' അതിനെ യോദ്ധാക്കൾ എന്ന അർഥത്തിൽ മാത്രം പരിമിതപ്പെടുത്താതെ അതിന്റെ വിശാലമായ ഭാവം നൽകുന്നു.
- source_word: עֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: ഇരുപതിനായിരത്തി ഇരുനൂറുപേർ
  rationale: എബ്രായത്തിലെ സംഖ്യ നേരിട്ട് പുനരാവിഷ്കരിക്കുകയും ആളുകളെയാണ് എണ്ണുന്നതെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വംശാവലിസംബന്ധമായ സാങ്കേതികത നിലനിർത്തിക്കൊണ്ട് വാക്യം വായിക്കാൻ എളുപ്പമാക്കി; സൈനിക അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കാൻ גִּבּוֹרֵי חָיִל എന്നതിന് ‘പരാക്രമശാലികൾ’ ഉപയോഗിച്ചു.
