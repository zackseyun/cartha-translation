  to: അവർ തങ്ങളുടെ വംശപരമ്പരകൾ അനുസരിച്ച് വംശാവലിയിൽ രേഖപ്പെടുത്തപ്പെട്ടവരായിരുന്നു[a]; തങ്ങളുടെ പിതൃഭവനങ്ങളുടെ തലവന്മാരായ പരാക്രമശാലികൾ—ഇരുപതിനായിരത്തി ഇരുനൂറുപേർ.[b]
