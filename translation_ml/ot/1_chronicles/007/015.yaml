source:
  edition: WLC
  text: וּ/מָכִ֞יר לָקַ֤ח אִשָּׁה֙ לְ/חֻפִּ֣ים וּ/לְ/שֻׁפִּ֔ים וְ/שֵׁ֤ם אֲחֹת/וֹ֙ מַעֲכָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖י צְלָפְחָ֑ד וַ/תִּהְיֶ֥נָה לִ/צְלָפְחָ֖ד בָּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
translation:
  language: ml
  text: മാഖീർ ഹുപ്പീമിനും ശുപ്പീമിനുംവേണ്ടി ഒരു ഭാര്യയെ സ്വീകരിച്ചു. അവന്റെ സഹോദരിയുടെ പേര് മയഖാ എന്നായിരുന്നു; രണ്ടാമത്തവന്റെ പേര് സെലോഫഹാദ് എന്നായിരുന്നു.[a] സെലോഫഹാദിന് പുത്രിമാരുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രണ്ടാമത്തെ പുത്രന്റെ പേര് സെലോഫഹാദ് എന്നായിരുന്നു.” എബ്രായപാഠം ആരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കാതെ “രണ്ടാമത്തവൻ” എന്നു മാത്രമേ പറയുന്നുള്ളൂ.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  choice: ഒരു ഭാര്യയെ എടുത്തു
  rationale: ‘ഭാര്യയെ എടുക്കുക’ എന്ന എബ്രായ വിവാഹപ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; തുടർന്നുള്ള לְ പ്രയോഗം കാരണം ഭാര്യ മാഖീർ തനിക്കല്ല, ഹുപ്പീമിനും ശുപ്പീമിനുംവേണ്ടിയാണ് എടുത്തതെന്ന് വാക്യം വ്യക്തമാക്കുന്നു.
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  choice: ഹുപ്പീമിനും ശുപ്പീമിനുംവേണ്ടി
  rationale: ആവർത്തിക്കുന്ന לְ എന്ന മുൻപ്രത്യയത്തിന്റെ ‘വേണ്ടി’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും അസാധാരണമായ മൂലവാക്യഘടന അമിതമായി വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְשֵׁם אֲחֹתוֹ מַעֲכָה
  choice: അവന്റെ സഹോദരിയുടെ പേര് മയഖാ എന്നായിരുന്നു
  rationale: പേരുപറയുന്ന എബ്രായ സൂത്രവാക്യത്തിന്റെ നേരായ പരിഭാഷയാണ്; ‘അവന്റെ’ എന്നത് ഏറ്റവും സ്വാഭാവികമായി സമീപസ്ഥനായ മാഖീറിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  choice: രണ്ടാമത്തവന്റെ പേര് സെലോഫഹാദ് എന്നായിരുന്നു
  rationale: മൂലപാഠം ‘രണ്ടാമത്തവൻ/രണ്ടാമത്തേത്’ എന്നു മാത്രമാണ് പറയുന്നത്. പുരുഷനാമമായ സെലോഫഹാദിനോടു യോജിക്കുന്നവിധം മലയാളത്തിൽ ‘രണ്ടാമത്തവൻ’ ഉപയോഗിച്ചെങ്കിലും ‘പുത്രൻ’ എന്ന ബന്ധം ചേർത്തിട്ടില്ല.
- source_word: וַתִּהְיֶנָה לִצְלָפְחָד בָּנוֹת
  choice: സെലോഫഹാദിന് പുത്രിമാരുണ്ടായിരുന്നു
  rationale: അസ്തിത്വ-ഉടമസ്ഥതാ ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം; സെലോഫഹാദിന് പുത്രിമാരായിരുന്നു ഉണ്ടായിരുന്നതെന്ന വംശാവലിവിവരം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘രണ്ടാമത്തവൻ’ എന്ന വംശാവലിപരമായ അവ്യക്തത
  choice: മുഖ്യപാഠത്തിൽ ‘പുത്രൻ’ ചേർക്കാതെ ‘രണ്ടാമത്തവൻ’ എന്നു നിലനിർത്തി
  alternative: ‘രണ്ടാമത്തെ പുത്രന്റെ പേര് സെലോഫഹാദ് എന്നായിരുന്നു’
  rationale: എബ്രായപാഠത്തിൽ ‘പുത്രൻ’ എന്ന നാമം പ്രകടമല്ല. അതു ചേർത്താൽ വംശാവലിബന്ധം മൂലപാഠത്തേക്കാൾ വ്യക്തമായി നിർണയിക്കപ്പെടും; അതിനാൽ പരിഹരിക്കാത്ത അവ്യക്തത മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് വിശദമായ വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളോട് ചേർത്ത് ലിപ്യന്തരിച്ചു. അസാധാരണമായ വിവാഹവാക്യവും ‘രണ്ടാമത്തവൻ’ എന്ന അവ്യക്തതയും വ്യാഖ്യാനിച്ച് മിനുക്കാതെ സംരക്ഷിച്ചു.
