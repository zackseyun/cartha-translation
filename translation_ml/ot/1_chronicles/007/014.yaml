- from: 'മനശ്ശെയുടെ പുത്രന്മാർ: അസ്രീയേൽ[a]—അവനെ അവന്റെ അരാമ്യയായ വെപ്പാട്ടി പ്രസവിച്ചു[b]; അവൾ ഗിലെയാദിന്റെ പിതാവായ മാഖീരിനെയും പ്രസവിച്ചു[c].'
  to: 'മനശ്ശെയുടെ പുത്രന്മാർ[a]: അസ്രീയേൽ—അവനെ അവന്റെ അരാമ്യക്കാരിയായ[b] വെപ്പാട്ടി പ്രസവിച്ചു; അവൾ ഗിലെയാദിന്റെ പിതാവായ[c] മാഖീരിനെ പ്രസവിച്ചു.'
