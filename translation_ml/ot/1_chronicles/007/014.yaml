  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֣י מְנַשֶּׁ֔ה אַשְׂרִיאֵ֖ל אֲשֶׁ֣ר יָלָ֑דָה פִּֽילַגְשׁ/וֹ֙ הָֽ/אֲרַמִּיָּ֔ה יָלְדָ֕ה אֶת מָכִ֖יר אֲבִ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
translation:
  language: ml
  text: 'മനശ്ശെയുടെ പുത്രന്മാർ[a]: അസ്രീയേൽ—അവനെ അവന്റെ അരാമ്യക്കാരിയായ[b] വെപ്പാട്ടി പ്രസവിച്ചു; അവൾ ഗിലെയാദിന്റെ പിതാവായ[c] മാഖീരിനെ പ്രസവിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനശ്ശെയുടെ സന്തതികൾ.” വംശാവലികളിൽ “പുത്രന്മാർ” എന്ന പദം ചിലപ്പോൾ സന്തതികളെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “അരാമ്യക്കാരി”; പരമ്പരാഗതമായി “സുറിയക്കാരി.”
    reason: lexical_alternative
  - marker: c
    text: വംശാവലികളിലെ പ്രയോഗത്തിൽ “ഗിലെയാദിന്റെ പിതാവ്” എന്നതിന് “പൂർവപിതാവ്” അഥവാ “സ്ഥാപകൻ” എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പുത്രന്മാർ
  rationale: എബ്രായ നിർമിത ബഹുവചനം നേരിട്ട് ‘പുത്രന്മാർ’ എന്നാണ്; വംശാവലികളിൽ ‘സന്തതികൾ’ എന്ന വിശാല അർഥവും ഉണ്ടാകാമെന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אַשְׂרִיאֵל
  choice: അസ്രീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲשֶׁר יָלָדָה
  choice: അവനെ ... പ്രസവിച്ചു
  rationale: മൂന്നാം പുരുഷ ഏകവചന സ്ത്രീലിംഗ ക്രിയാരൂപം നിലനിർത്തി, ബന്ധവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: פִּילַגְשׁוֹ
  choice: അവന്റെ ... വെപ്പാട്ടി
  rationale: פִּילֶגֶשׁ എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവുമായ സമാനപദം; ‘രണ്ടാം ഭാര്യ’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ ഒഴിവാക്കുന്നു.
- source_word: הָאֲרַמִּיָּה
  choice: അരാമ്യയായ
  rationale: ‘സുറിയക്കാരി’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ചരിത്രപരമായി കൃത്യമായി അരാം ജനതയിൽപ്പെട്ട സ്ത്രീയെ സൂചിപ്പിക്കുന്നു.
- source_word: יָלְדָה אֶת מָכִיר
  choice: അവൾ ... മാഖീരിനെയും പ്രസവിച്ചു
  rationale: സ്ത്രീലിംഗ കർത്താവിനെ വീണ്ടും വ്യക്തമാക്കുന്ന എബ്രായ ആവർത്തനം നിലനിർത്തുന്നു; മലയാളത്തിലെ ബന്ധം വ്യക്തമാക്കാൻ ‘-യും’ ചേർക്കുന്നു.
- source_word: אֲבִי גִלְעָד
  choice: ഗിലെയാദിന്റെ പിതാവായ
  rationale: אָב എന്നതിന്റെ പ്രാഥമിക അർഥമായ ‘പിതാവ്’ നിലനിർത്തുന്നു; വംശാവലി പ്രയോഗത്തിൽ ‘പൂർവപിതാവ്’ അല്ലെങ്കിൽ ‘സ്ഥാപകൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള വംശാവലി ശൈലി. മൂലപാഠത്തിലെ സ്ത്രീലിംഗ കർത്താവിന്റെ ആവർത്തനവും ‘പിതാവ്’ എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ഘടകങ്ങളോട് ചേർത്തിരിക്കുന്നു.
