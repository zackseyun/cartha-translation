  text: 'And the sons of Jediael: Bilhan. And the sons of Bilhan: Jeush[a], Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar.'
translation:
  language: ml
  text: 'യെദീയയേലിന്റെ പുത്രന്മാർ: ബിൽഹാൻ. ബിൽഹാന്റെ പുത്രന്മാർ: യെയൂശ്[a], ബെന്യാമീൻ, ഏഹൂദ്, കെനാനാ, സേതാൻ, തർശീശ്, അഹീശഹർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആദ്യ പുത്രന്റെ ഹീബ്രു നാമരൂപം (יעיש) അസാധാരണമാണ്. ഈ വംശാവലിയിൽ ഉദ്ദേശിച്ചിരിക്കാവുന്ന വ്യക്തിനാമം അനുസരിച്ച് ഇവിടെ ‘യെയൂശ്’ എന്നു നൽകിയിരിക്കുന്നു; ‘യായീശ്’ അല്ലെങ്കിൽ ‘യായിശ്’ എന്നും വായിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְדִיעֲאֵל בִּלְהָן
  choice: 'യെദീയയേലിന്റെ പുത്രൻ: ബിൽഹാൻ'
  rationale: ഹീബ്രു പദം വ്യാകരണപരമായി ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്നാണ്; എന്നാൽ ഇവിടെ ഒരേയൊരു പേര് മാത്രമുള്ളതിനാൽ, പട്ടികയുടെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ഏകവചനം ഉപയോഗിച്ചു.
- source_word: יְדִיעֲאֵל
  choice: യെദീയയേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പ്രതിനിധീകരിച്ചു.
- source_word: בִּלְהָן
  choice: ബിൽഹാൻ
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: וּבְנֵי בִלְהָן
  choice: 'ബിൽഹാന്റെ പുത്രന്മാർ:'
  rationale: ആവർത്തിക്കുന്ന വംശാവലിസൂത്രവും തുടർന്നുള്ള നാമപ്പട്ടികയും വ്യക്തമായി നിലനിർത്തി.
- source_word: יעיש
  choice: യെയൂശ്
  rationale: മസോററ്റിക് രൂപം അസാധാരണമാണ്; ഈ വംശാവലിയിൽ ഉദ്ദേശിച്ചിരിക്കാവുന്ന പരിചിതമായ യെയൂശ് എന്ന വ്യക്തിനാമരൂപം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וּבִנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും ഹീബ്രുവിനോട് അടുത്തതുമായ വ്യക്തിനാമരൂപം.
- source_word: וְאֵהוּד
  choice: ഏഹൂദ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ നിലനിർത്തി.
- source_word: וּכְנַעֲנָה
  choice: കെനാനാ
  rationale: ഇത് കനാൻ ദേശനാമമല്ല, വ്യക്തിനാമമാണ്; വ്യത്യാസം സൂചിപ്പിക്കുന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וְזֵיתָן
  choice: സേതാൻ
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: וְתַרְשִׁישׁ
  choice: തർശീശ്
  rationale: മറ്റിടങ്ങളിൽ സ്ഥലനാമമായിരിക്കാമെങ്കിലും ഇവിടെ വംശാവലിസന്ദർഭം വ്യക്തിനാമമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וַאֲחִישָׁחַר
  choice: അഹീശഹർ
  rationale: ഹീബ്രു നാമത്തിന്റെ ഘടന അനാവശ്യമായി പരിചിതരൂപങ്ങളോട് ഒത്തുചേർക്കാതെ ലിപ്യന്തരിച്ചു.
