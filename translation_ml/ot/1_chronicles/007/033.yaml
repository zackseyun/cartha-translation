lexical_decisions:
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ ഈ നേരിട്ടുള്ള പട്ടികയിൽ construct plural ആയ בְנֵי എന്നതിന് വിശാലമായ ‘സന്തതികൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ എന്നതാണ് സ്വാഭാവികവും കൃത്യവും.
- source_word: יַפְלֵט
  choice: യഫ്ലേത്ത്
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തും മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികവുമായി ലിപ്യന്തരിച്ചു.
- source_word: פָּסַךְ
  choice: പാസഖ്
  rationale: അവസാനത്തെ כְ എന്ന ഘർഷധ്വനി സൂചിപ്പിക്കാൻ ‘ഖ്’ ഉപയോഗിച്ച് വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: וּבִמְהָל
  choice: ബിംഹാൽ
  rationale: മുൻചേർന്ന conjunction പട്ടികയിലെ വിരാമചിഹ്നക്രമത്തിൽ പ്രതിഫലിപ്പിക്കുകയും വ്യക്തിനാമം ബിംഹാൽ എന്നു ലിപ്യന്തരിക്കുകയും ചെയ്തു.
- source_word: וְעַשְׁוָת
  choice: അശ്വത്ത്
  rationale: വ്യക്തിനാമത്തിലെ consonantal sequence മലയാളത്തിൽ വായിക്കാവുന്ന വിധം ‘അശ്വത്ത്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֵלֶּה
  choice: ഇവരാണ്
  rationale: എബ്രായത്തിലെ കാലസൂചനയില്ലാത്ത demonstrative formula സംഗ്രഹവാക്യമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘ഇവരായിരുന്നു’ എന്നു നിർബന്ധിച്ച് ഭൂതകാലം ചേർക്കുന്നില്ല.
- source_word: בְּנֵי יַפְלֵט
  choice: യഫ്ലേത്തിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ സമാപന ആവർത്തനം നിലനിർത്തി വംശാവലിയുടെ ഘടന സംരക്ഷിച്ചു.
