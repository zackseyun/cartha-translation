  text: 'യഫ്ലേത്തിന്റെ പുത്രന്മാർ: പാസഖ്[a], ബിംഹാൽ, അശ്വത്ത്. ഇവരാണ് യഫ്ലേത്തിന്റെ പുത്രന്മാർ.'
