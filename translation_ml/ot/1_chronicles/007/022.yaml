  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְאַבֵּ֛ל אֶפְרַ֥יִם אֲבִי/הֶ֖ם יָמִ֣ים רַבִּ֑ים וַ/יָּבֹ֥אוּ אֶחָ֖י/ו לְ/נַחֲמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/022.yaml
  text: And Ephraim their father mourned for many days[a], and his brothers came to comfort him.
translation:
  language: ml
  text: അവരുടെ പിതാവായ എഫ്രയീം വളരെ നാൾ ദുഃഖാചരണം നടത്തി; അവനെ ആശ്വസിപ്പിക്കാൻ അവന്റെ സഹോദരന്മാർ വന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַבֵּל
  choice: ദുഃഖാചരണം നടത്തി
  rationale: ഹിത്പയേൽ രൂപം മരണത്തെത്തുടർന്നുള്ള വിലാപത്തിലും ദുഃഖാചരണത്തിലും പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ മരണസന്ദർഭത്തിൽ ‘ദുഃഖാചരണം നടത്തി’ എന്നത് അർഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֶפְרַיִם
  choice: എഫ്രയീം
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്കനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: אֲבִיהֶם
  choice: അവരുടെ പിതാവായ
  rationale: മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയമുള്ള ഈ രൂപം എഫ്രയീമിനെ മുമ്പ് പരാമർശിച്ചവരുടെ പിതാവായി തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിനായി വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: יָמִים רַבִּים
  choice: വളരെ നാൾ
  rationale: ദൈർഘ്യം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും നിലവാരമുള്ളതുമായ മലയാളരൂപം.
- source_word: וַיָּבֹאוּ
  choice: വന്നു
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ בוא എന്ന ക്രിയയുടെ നേരായ അർഥം ‘വന്നു’ എന്നാണ്.
- source_word: אֶחָיו
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: אָח എന്ന പദത്തിന്റെ സാധാരണ അർഥമായ ‘സഹോദരന്മാർ’ നിലനിർത്തുന്നു; വിശാലമായ ബന്ധുജനാർഥം സ്വീകരിക്കേണ്ട നിർബന്ധിത സന്ദർഭസൂചനയില്ല.
- source_word: לְנַחֲמוֹ
  choice: അവനെ ആശ്വസിപ്പിക്കാൻ
  rationale: നിഹാൽ രൂപത്തിലുള്ള נחם ദുഃഖിതനെ ആശ്വസിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ആശ്വസിപ്പിക്കാൻ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
