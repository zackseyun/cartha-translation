translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മരണാനന്തര ദുഃഖത്തിന്റെ ആചാരപരമായ ഭാവം വ്യക്തമാക്കാൻ ‘ദുഃഖാചരണം നടത്തി’ ഉപയോഗിച്ചു. ഇവിടെ ആശ്വസിപ്പിക്കൽ എന്നതിന് പ്രത്യേകം ആവശ്യമായ അർഥവ്യത്യാസമില്ലാത്തതിനാൽ പാഠക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
