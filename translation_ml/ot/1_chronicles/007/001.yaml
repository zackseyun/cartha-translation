source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י יִשָׂשכָ֗ר תּוֹלָ֧ע וּ/פוּאָ֛ה ישיב וְ/שִׁמְר֖וֹן אַרְבָּעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/001.yaml
  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
translation:
  language: ml
  text: 'യിസ്സാഖാരിന്റെ പുത്രന്മാർ: തോലാ, പൂവാ[a], യാശൂബ്[b], ശിമ്രോൻ—ആകെ നാലുപേർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠത്തിൽ ‘പൂവാ’; മറ്റു ചില വംശാവലിപ്പട്ടികകളിലെ സമാന്തരരൂപത്തെ അടിസ്ഥാനമാക്കി ചില ഇംഗ്ലീഷ് പാരമ്പര്യങ്ങളിൽ ‘പുവ്വാ’ എന്നും കാണുന്നു.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ ഹീബ്രു പാഠത്തിൽ ‘യാശൂബ്’; ഉല്പത്തി 46:13-ൽ ഇതിന്റെ സമാന്തര നാമരൂപം ‘യിശ്വി’ എന്നാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: ഗോത്രവംശാവലി ആരംഭിക്കുന്ന ശീർഷകസ്വഭാവമുള്ള പ്രയോഗം. ഹീബ്രുവിലെ ബന്ധകവും മുൻപ്രത്യയവും മലയാളത്തിൽ പ്രത്യേകം പുനരാവിഷ്കരിക്കാതെ സ്വാഭാവികമായ പട്ടികാരൂപത്തിൽ നൽകി.
- source_word: יִשָׂשכָר
  choice: യിസ്സാഖാർ
  rationale: ഹീബ്രു വ്യക്തി-ഗോത്രനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: תּוֹלָע
  choice: തോലാ
  rationale: വംശാവലിയിലെ വ്യക്തിനാമം; അർത്ഥപരിഭാഷ ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: וּ/פוּאָה
  choice: പൂവാ
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് രൂപത്തെ അടിസ്ഥാനമാക്കിയുള്ള സ്വാഭാവിക മലയാള ലിപ്യന്തരണം; ബന്ധകം പട്ടികയിലെ വിരാമചിഹ്നക്രമത്തിലൂടെ പ്രതിനിധീകരിച്ചു.
- source_word: ישיב
  choice: യാശൂബ്
  rationale: ദിനവൃത്താന്തപുസ്തകത്തിലെ ഈ പേരുരൂപം പിന്തുടർന്നു; ഉല്പത്തി 46:13-ലെ സമാന്തരരൂപവുമായി ഇതിനെ ഏകീകരിച്ചില്ല.
- source_word: וְ/שִׁמְרוֹן
  choice: ശിമ്രോൻ
  rationale: അവസാനത്തെ വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; പട്ടികാസംയോജനം വിരാമചിഹ്നങ്ങളിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: אַרְבָּעָה
  choice: ആകെ നാലുപേർ
  rationale: പട്ടികയിൽ പറഞ്ഞ പുത്രന്മാരുടെ സംഖ്യ സംഗ്രഹിക്കുന്ന പ്രയോഗം; വ്യക്തികളെ എണ്ണുന്നതിന് മലയാളത്തിൽ സ്വാഭാവികമായ ‘പേർ’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. പേരുകൾ ഹീബ്രു രൂപങ്ങളോട് കഴിയുന്നത്ര ചേർന്ന് മലയാളികൾക്ക് വായിക്കാവുന്ന രീതിയിൽ ലിപ്യന്തരിച്ചു. ‘ആകെ നാലുപേർ’ എന്നത് സംഗ്രഹസംഖ്യയുടെ പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ [a] അടയാളം അബദ്ധമായി ‘Tola’യ്ക്കുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് ‘Puah’യെക്കുറിച്ചായതിനാൽ ബന്ധപ്പെട്ട ‘പൂവാ’യ്ക്കുശേഷം സ്ഥാപിച്ചു.
