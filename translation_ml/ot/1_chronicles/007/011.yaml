  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל אֵ֜לֶּה בְּנֵ֤י יְדִֽיעֲאֵל֙ לְ/רָאשֵׁ֣י הָ/אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים שִׁבְעָֽה עָשָׂ֥ר אֶ֨לֶף֙ וּ/מָאתַ֔יִם יֹצְאֵ֥י צָבָ֖א לַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
translation:
  language: ml
  text: ഇവരെല്ലാവരും യെദീയയേലിന്റെ പുത്രന്മാരായിരുന്നു[a]. പിതൃഭവനങ്ങളുടെ തലവന്മാരുടെ കണക്കനുസരിച്ച്[b], യുദ്ധത്തിനായി സൈന്യത്തിൽ പുറപ്പെടാൻ പ്രാപ്തരായ[d] പരാക്രമശാലികൾ[c] പതിനേഴായിരത്തി ഇരുനൂറുപേർ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെദീയയേലിന്റെ സന്തതികൾ.” വംശാവലികളിൽ “പുത്രന്മാർ” എന്ന ഹീബ്രായ പ്രയോഗം വിശാലമായി പിൻതലമുറക്കാരെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “പിതൃഭവനങ്ങൾ” എന്നത് ഒരു പൂർവികനെ ആധാരമാക്കിയ കുടുംബങ്ങളെയോ ഗോത്രശാഖകളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “ശക്തിയുള്ള പരാക്രമികൾ”; യുദ്ധശേഷി തെളിയിച്ച പോരാളികളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: d
    text: അക്ഷരാർഥത്തിൽ, “യുദ്ധത്തിനായി സൈന്യത്തിൽ പുറപ്പെടുന്നവർ”; സൈനികസേവനത്തിന് ലഭ്യരോ യോഗ്യരോ ആയ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: ഇവരെല്ലാവരും
  rationale: ഹീബ്രായിലെ സംക്ഷിപ്തമായ സമാഹാരപ്രയോഗം അധികമായി ഒരു നാമം ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי יְדִיעֲאֵל
  choice: യെദീയയേലിന്റെ പുത്രന്മാർ
  rationale: בְּנֵי എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു; വംശാവലിസന്ദർഭത്തിൽ ‘സന്തതികൾ’ എന്ന വിശാലാർഥം സാധ്യമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְרָאשֵׁי הָאָבוֹת
  choice: പിതൃഭവനങ്ങളുടെ തലവന്മാരുടെ കണക്കനുസരിച്ച്
  rationale: പൂർവികനെ ആധാരമാക്കിയ കുടുംബ-ഗോത്രവിഭാഗങ്ങളുടെ തലവന്മാരെ സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളവായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുകയും לְ എന്ന ബന്ധത്തെ കണക്കിന്റെ അടിസ്ഥാനമായി പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: പരാക്രമശാലികൾ
  rationale: ശക്തിയും യുദ്ധശേഷിയും ഉൾക്കൊള്ളുന്ന ഹീബ്രായ പ്രയോഗത്തിന് ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: שִׁבְעָה עָשָׂר אֶלֶף וּמָאתַיִם
  choice: പതിനേഴായിരത്തി ഇരുനൂറുപേർ
  rationale: ഹീബ്രായിലെ കൃത്യമായ ജനസംഖ്യാകണക്ക് വാക്കുകളായി നിലനിർത്തുന്നു.
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  choice: യുദ്ധത്തിനായി സൈന്യത്തിൽ പുറപ്പെടാൻ പ്രാപ്തരായ
  rationale: അക്ഷരാർഥമായ ‘യുദ്ധത്തിനായി സൈന്യത്തിലേക്ക് പുറപ്പെടുന്നവർ’ എന്ന പ്രയോഗത്തിന്റെ സൈനികസേവനത്തിന് ലഭ്യരും യോഗ്യരുമായവർ എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
