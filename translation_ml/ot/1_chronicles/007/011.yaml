  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള വേദപുസ്തകശൈലി സ്വീകരിച്ചു. അപരിചിതമായ സാമൂഹികഘടനയായ ‘പിതൃഭവനം’ പാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു; സൈനികപ്രയോഗം അക്ഷരാർഥം നഷ്ടപ്പെടുത്താതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
