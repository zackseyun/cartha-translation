source:
  edition: WLC
  text: וְ/חֶ֨בֶר֙ הוֹלִ֣יד אֶת יַפְלֵ֔ט וְ/אֶת שׁוֹמֵ֖ר וְ/אֶת חוֹתָ֑ם וְ/אֵ֖ת שׁוּעָ֥א אֲחוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/032.yaml
  text: Heber fathered Japhlet[a], Shomer, Hotham[b], and Shua their sister.
translation:
  language: ml
  text: ഹേബെർ യഫ്ലേത്ത്, ശോമേർ[a], ഹോഥാം, അവരുടെ സഹോദരിയായ ശൂവാ[b] എന്നിവരുടെ പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശേമെർ.”
    reason: ശോമേർ എന്ന വ്യക്തിനാമത്തിന്റെ ലിപ്യന്തര/വായനാവികൽപം.
  - marker: b
    text: അഥവാ, “ശൂവാഹ്.”
    reason: ശൂവാ എന്ന വ്യക്തിനാമത്തിന്റെ ലിപ്യന്തരവികൽപം.
lexical_decisions:
- source_word: חֶבֶר
  choice: ഹേബെർ
  rationale: വ്യക്തിനാമം; മസോരറ്റിക് പാഠത്തിലെ രൂപം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി പകർത്തി.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിസന്ദർഭത്തിൽ ഹിഫീൽ രൂപം ഒരാൾ മക്കൾക്കു ജന്മം നൽകുന്ന പിതാവായിത്തീർന്നു എന്ന ആശയം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: אֶת
  choice: '[വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: നിശ്ചിത നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന ഹീബ്രു വ്യാകരണഘടകം; മലയാളത്തിൽ ഇതിന് പ്രത്യേക പദസമാനം ആവശ്യമില്ല.
- source_word: יַפְלֵט
  choice: യഫ്ലേത്ത്
  rationale: വ്യക്തിനാമം; ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: שׁוֹמֵר
  choice: ശോമേർ
  rationale: മസോരറ്റിക് സ്വരചിഹ്നങ്ങൾ അനുസരിച്ചുള്ള വ്യക്തിനാമ ലിപ്യന്തരണം; ശേമെർ എന്ന വായനാഭേദം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: חוֹתָם
  choice: ഹോഥാം
  rationale: വ്യക്തിനാമം; ഹീബ്രു രൂപത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: שׁוּעָא
  choice: ശൂവാ
  rationale: ഇവിടത്തെ ഹീബ്രു വ്യക്തിനാമരൂപം ശബ്ദാനുസൃതമായി പകർത്തി; ശൂവാഹ് എന്ന ലിപ്യന്തരവികൽപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: אֲחוֹתָם
  choice: അവരുടെ സഹോദരിയായ
  rationale: സഹോദരി എന്ന നാമത്തോടു ചേർന്ന മൂന്നാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; മുമ്പു പറഞ്ഞ സഹോദരന്മാരെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക അർഥം നിലനിർത്തുന്നു.
