source:
  edition: WLC
  text: וְ/שֻׁפִּ֤ם וְ/חֻפִּם֙ בְּנֵ֣י עִ֔יר חֻשִׁ֖ם בְּנֵ֥י אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/012.yaml
  text: And Shuppim and Huppim were the sons of Ir[b][a]; Hushim was the son of Aher.
translation:
  language: ml
  text: ശുപ്പീമും ഹുപ്പീമും ഈരിന്റെ പുത്രന്മാരായിരുന്നു[b]; ഹുശീം അഹേരിന്റെ പുത്രൻ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘അഹേരിന്റെ പുത്രന്മാർ’ എന്നാണ്. ‘പുത്രന്മാർ’ എന്ന ബഹുവചനം ഏകവചന നാമമായ ഹുശീമിനോടൊപ്പം നിൽക്കുന്നതിനാൽ വാക്യഘടന ദുഷ്കരമാണ്. ചിലർ ‘അഹേർ’ എന്നത് വ്യക്തിനാമമായും മറ്റുചിലർ ‘മറ്റൊരാൾ’ എന്ന അർഥത്തിലും മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ബന്ധപ്പെട്ട വംശാവലിപ്പട്ടികകളുടെ വെളിച്ചത്തിൽ ചില പരിഭാഷാപാരമ്പര്യങ്ങളിൽ ഈ പേരുകൾ ‘ശെഫൂഫാം’, ‘ഹൂഫാം’ എന്നിങ്ങനെ കാണപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/שֻׁפִּם
  choice: ശുപ്പീമും
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു; വാവിന്റെ സംയോജകപ്രയോഗം ‘ഉം’കൊണ്ട് നിലനിർത്തി.
- source_word: וְ/חֻפִּם
  choice: ഹുപ്പീമും
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു; സംയോജകമായ וְ ‘ഉം’ ആയി ചേർത്തു.
- source_word: בְּנֵי
  choice: പുത്രന്മാരായിരുന്നു
  rationale: വംശാവലിസന്ദർഭത്തിൽ ‘പുത്രന്മാർ’ എന്ന നേരിട്ടുള്ള അർഥം സ്വീകരിച്ചു; ക്രിയയില്ലാത്ത ഹീബ്രു വാക്യം സ്വാഭാവിക മലയാളത്തിനായി ‘ആയിരുന്നു’ ചേർത്ത് അവതരിപ്പിച്ചു.
- source_word: עִיר
  choice: ഈർ
  rationale: മസോററ്റിക് പാഠത്തിലെ עִיר എന്ന വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു; സമാന്തര വംശാവലികളിലെ വ്യത്യസ്ത നാമരൂപം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തില്ല.
- source_word: חֻשִׁם
  choice: ഹൂശീം
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ സ്വരചിഹ്നിത രൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּנֵי אַחֵר
  choice: അഹേരിന്റെ പുത്രൻ ആയിരുന്നു
  rationale: വ്യാകരണപരമായി ബְּנֵי ബഹുവചനമാണെങ്കിലും, ഏകവചന വ്യക്തിനാമമായ ഹൂശീമിനോടൊപ്പം വരുന്ന ദുഷ്കരമായ വംശാവലിവാക്യമായി കണ്ട് മലയാളത്തിൽ ഏകവചനമായി വായനാസൗകര്യം നൽകി; പാഠത്തിലെ അസംഗതി അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
