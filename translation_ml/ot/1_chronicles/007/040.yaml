  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל אֵ֣לֶּה בְנֵי אָ֠שֵׁר רָאשֵׁ֨י בֵית הָ/אָב֤וֹת בְּרוּרִים֙ גִּבּוֹרֵ֣י חֲיָלִ֔ים רָאשֵׁ֖י הַ/נְּשִׂיאִ֑ים וְ/הִתְיַחְשָׂ֤/ם בַּ/צָּבָא֙ בַּ/מִּלְחָמָ֔ה מִסְפָּרָ֣/ם אֲנָשִׁ֔ים עֶשְׂרִ֥ים וְ/שִׁשָּׁ֖ה אָֽלֶף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
translation:
  language: ml
  text: ഇവരെല്ലാവരും ആശേരിന്റെ പുത്രന്മാരായിരുന്നു—പിതൃഭവനങ്ങളുടെ തലവന്മാർ, തിരഞ്ഞെടുക്കപ്പെട്ടവർ, പരാക്രമശാലികളായ യോദ്ധാക്കൾ, പ്രമുഖ നേതാക്കൾ. യുദ്ധത്തിനുള്ള സൈനികസേവനത്തിനായി അവർ രജിസ്റ്റർ ചെയ്യപ്പെട്ടിരുന്നു[a]. അവരുടെ പുരുഷന്മാരുടെ എണ്ണം ഇരുപത്താറായിരം ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ വംശാവലി രേഖപ്പെടുത്തിയിരുന്നു” / “അവർ വംശാവലിപ്രകാരം രജിസ്റ്റർ ചെയ്യപ്പെട്ടിരുന്നു.” ദിനവൃത്താന്തങ്ങളിൽ ഈ എബ്രായക്രിയ സാധാരണയായി വംശാവലിപരമായ രജിസ്ട്രേഷനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  choice: പിതൃഭവനങ്ങളുടെ തലവന്മാർ
  rationale: ദിനവൃത്താന്തങ്ങളിലെ ഗോത്രപരവും കുടുംബപരവുമായ ഘടനയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അർഥവും നിലനിർത്തുന്നു.
- source_word: בְּרוּרִים
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  rationale: തിരഞ്ഞെടുത്തവരോ വിശിഷ്ടരായി കണക്കാക്കപ്പെട്ടവരോ എന്ന നിഷ്ക്രിയ പങ്കാളിത്തരൂപത്തിന്റെ അടിസ്ഥാന അർഥം നൽകുന്നു.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: പരാക്രമശാലികളായ യോദ്ധാക്കൾ
  rationale: ശക്തിയും യുദ്ധവീര്യവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ സൈനികപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  choice: പ്രമാണിമാരിൽ മുഖ്യന്മാർ
  rationale: ഉന്നത നേതൃത്വപദവി സൂചിപ്പിക്കുന്ന സാന്ദ്രമായ പ്രയോഗം രാജകീയമായ അർഥം അനാവശ്യമായി ചേർക്കാതെ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וְהִתְיַחְשָׂם
  choice: അവർ രജിസ്റ്റർ ചെയ്യപ്പെട്ടിരുന്നു
  rationale: ദിനവൃത്താന്തങ്ങളിൽ വംശാവലിപ്രകാരമുള്ള ഔദ്യോഗിക രജിസ്ട്രേഷനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ഭരണപരമായ ഫലം മുഖ്യവാചകത്തിൽ നൽകുന്നു; വംശാവലി എന്ന പ്രത്യേക ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בַּצָּבָא בַּמִּלְחָמָה
  choice: യുദ്ധത്തിനുള്ള സൈനികസേവനത്തിനായി
  rationale: സംഘടിത സൈനികസേവനവും അതിന്റെ യുദ്ധോദ്ദേശ്യവും മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: מִסְפָּרָם אֲנָשִׁים עֶשְׂרִים וְשִׁשָּׁה אָלֶף
  choice: അവരുടെ പുരുഷന്മാരുടെ എണ്ണം ഇരുപത്താറായിരം ആയിരുന്നു
  rationale: എണ്ണപ്പെടുന്നത് പുരുഷന്മാരാണെന്ന ഉറവിടവാചകത്തിലെ വ്യക്തതയും സംഖ്യയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗോത്ര-കുടുംബഘടനയെ സൂചിപ്പിക്കുന്ന ‘പിതൃഭവനം’ പോലുള്ള ഉറവിടസവിശേഷ പ്രയോഗങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടാതെ നിലനിർത്തിയിരിക്കുന്നു.
