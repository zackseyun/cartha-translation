source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם הַ/הֹלֵ֖ךְ עִמָּ/כֶ֑ם לְ/הִלָּחֵ֥ם לָ/כֶ֛ם עִם אֹיְבֵי/כֶ֖ם לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: ml
  text: കാരണം, നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ നിങ്ങളോടുകൂടെ പോകുന്നവനാണ്—നിങ്ങളുടെ ശത്രുക്കളോടു നിങ്ങൾക്കുവേണ്ടി പോരാടാനും നിങ്ങളെ രക്ഷിക്കാനും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ധൈര്യപ്പെടാനുള്ള ആഹ്വാനത്തിന് അടിസ്ഥാനം നൽകുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന പ്രത്യയമുള്ള രൂപത്തിന്റെ ഉടമസ്ഥതാഭാവം നിലനിർത്തുകയും യഹോവ എന്ന പേരുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הַהֹלֵךְ
  choice: പോകുന്നവനാണ്
  rationale: ഹീബ്രു കൃദന്തരൂപത്തിന്റെ തുടർച്ചയായ വിവരണാത്മക ഭാവം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עִמָּכֶם
  choice: നിങ്ങളോടുകൂടെ
  rationale: ദൈവിക സാന്നിധ്യത്തെയും അനുഗമനത്തെയും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: לְהִלָּחֵם לָכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി ... പോരാടി
  rationale: യുദ്ധം ചെയ്യുക എന്ന ക്രിയയും ഗുണഭോക്തൃസൂചകമായ ദത്തിവും ചേർന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עִם אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കളോടു
  rationale: പോരാട്ടസന്ദർഭത്തിൽ עִם പ്രതിപക്ഷബന്ധം സൂചിപ്പിക്കുന്നു; 'പോരാടുക' എന്ന ക്രിയയോടൊപ്പം 'ശത്രുക്കളോടു' എന്നത് മലയാളത്തിൽ അതു വ്യക്തമാക്കുന്നു.
- source_word: לְהוֹשִׁיעַ אֶתְכֶם
  choice: നിങ്ങളെ രക്ഷിക്കാൻ
  rationale: ישׁע എന്ന ധാതുവിന്റെ വിശാലമായ രക്ഷ/വിടുതൽ അർഥം നിലനിർത്തുന്നു; യുദ്ധസന്ദർഭത്തിൽ വിജയം നൽകുക എന്ന അർഥവും ഇതിൽ ഉൾപ്പെടാം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- issue: യുദ്ധസന്ദർഭത്തിലെ לְהוֹשִׁיעַ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: നിങ്ങളെ രക്ഷിക്കാൻ
  alternative: നിങ്ങളെ വിടുവിക്കാൻ / നിങ്ങൾക്കു വിജയം നൽകാൻ
  rationale: ക്രിയയ്ക്ക് രക്ഷിക്കുക, വിടുവിക്കുക എന്നീ വിശാല അർഥങ്ങളുണ്ട്; ഇവിടെ യുദ്ധവിജയവും ഉൾപ്പെടാമെങ്കിലും അതിൽ മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കൃദന്തരൂപത്തിന്റെ ഊന്നൽ ‘പോകുന്നവനാണ്’ എന്നതിലൂടെ നിലനിർത്തി; വാക്യത്തിന്റെ ലക്ഷ്യക്രമവും യുദ്ധസന്ദർഭവും വ്യക്തമായി സൂക്ഷിച്ചു.
