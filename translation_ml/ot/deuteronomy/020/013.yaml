revisions:
- from: നിന്റെ ദൈവമായ യഹ്‌വെ അതിനെ നിന്റെ കൈയിൽ ഏല്പിക്കും; നീ അതിലെ ആണായ എല്ലാവരെയും[a] വാളിന്റെ വായ്ത്തലയാൽ വെട്ടിവീഴ്ത്തണം.
  to: നിന്റെ ദൈവമായ യഹ്‌വെ അതിനെ നിന്റെ കൈയിൽ ഏൽപ്പിക്കും; നീ അതിലെ എല്ലാ പുരുഷന്മാരെയും[a] വാളിന്റെ മൂർച്ചകൊണ്ട് കൊല്ലണം.
