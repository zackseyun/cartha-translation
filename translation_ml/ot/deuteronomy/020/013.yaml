source:
  edition: WLC
  text: וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וְ/הִכִּיתָ֥ אֶת כָּל זְכוּרָ֖/הּ לְ/פִי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/013.yaml
  text: And Yahweh your God will give it into your hand[a], and you shall strike down all its males with the edge of the sword.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ അതിനെ നിന്റെ കൈയിൽ ഏൽപ്പിക്കും; നീ അതിലെ എല്ലാ പുരുഷന്മാരെയും[a] വാളിന്റെ മൂർച്ചകൊണ്ട് കൊല്ലണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ പൊതുവായ ‘മനുഷ്യർ’ എന്ന പദമല്ല, പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: അതിനെ ... ഏല്പിക്കും
  rationale: נתן എന്ന ക്രിയയോടു ചേർന്ന 3-ാം പുരുഷ ഏകവചന സ്ത്രീലിംഗ പ്രത്യയം നഗരത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ അധികാരത്തിലാക്കുക എന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘കൈയിൽ ഏല്പിക്കും’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: 2-ാം പുരുഷ ഏകവചന പ്രത്യയമുള്ള നിയമബന്ധപരമായ പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നൽകി.
- source_word: בְּיָדֶךָ
  choice: നിന്റെ കൈയിൽ
  rationale: ഒരാളുടെ നിയന്ത്രണത്തിലോ അധികാരത്തിലോ ഏല്പിക്കുക എന്ന എബ്രായ ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וְהִכִּיתָ
  choice: നീ ... വെട്ടിവീഴ്ത്തണം
  rationale: സൈനികസന്ദർഭത്തിലെ נכה എന്ന ക്രിയയുടെ മാരകമായ പ്രഹരാർഥം മയപ്പെടുത്താതെ, മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: כָּל זְכוּרָהּ
  choice: അതിലെ ആണായ എല്ലാവരെയും
  rationale: כָּל എന്നതിന്റെ സമഗ്രതയും זָכוּר എന്ന പദം പൊതുവായ ‘മനുഷ്യർ’ എന്നതിനു പകരം ആൺലിംഗത്തെ പ്രത്യേകം സൂചിപ്പിക്കുന്നതും സംരക്ഷിച്ചു.
- source_word: לְפִי חָרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘വാളിന്റെ വായാൽ’ എന്ന എബ്രായ പ്രയോഗത്തിലെ ദൃശ്യം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ മനസ്സിലാകുന്ന രൂപം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ദൈവിക അനുമതിയോടുകൂടിയ യുദ്ധകല്പനയെ മയപ്പെടുത്തുകയോ വിശദീകരണം ചേർക്കുകയോ ചെയ്യാതിരിക്കുക
  choice: നഗരത്തെ യഹ്‌വെ കൈയിൽ ഏല്പിക്കുന്നതും അതിലെ ആണായ എല്ലാവരെയും വാളാൽ വെട്ടിവീഴ്ത്താനുള്ള കല്പനയും നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘തോൽപ്പിക്കുക’ എന്ന മൃദുവായ പദം ഉപയോഗിക്കുകയോ ദൈവവിധി/വിശുദ്ധയുദ്ധം സംബന്ധിച്ച വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കുകയോ ചെയ്യുക.
  rationale: മൂലപാഠം നഗരത്തിന്റെ ഏല്പിക്കലിനെ യഹ്‌വെയോട് ബന്ധിപ്പിക്കുകയും എല്ലാ ആണുകളെയും കൊല്ലുന്ന സൈനിക നടപടി വ്യക്തമായി കല്പിക്കുകയും ചെയ്യുന്നു. അതിന്റെ ഗൗരവവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും വിശദീകരണത്തിലൂടെ പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. എബ്രായത്തിലെ ക്രമാനുസൃതമായ ‘വാവ്’ ബന്ധം അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; അനാവശ്യമായ ‘എപ്പോൾ’ എന്ന നിബന്ധനാഭാവം ചേർത്തില്ല.
