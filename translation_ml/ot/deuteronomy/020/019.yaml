source:
  edition: WLC
  text: כִּֽי תָצ֣וּר אֶל עִיר֩ יָמִ֨ים רַבִּ֜ים לְֽ/הִלָּחֵ֧ם עָלֶ֣י/הָ לְ/תָפְשָׂ֗/הּ לֹֽא תַשְׁחִ֤ית אֶת עֵצָ/הּ֙ לִ/נְדֹּ֤חַ עָלָי/ו֙ גַּרְזֶ֔ן כִּ֚י מִמֶּ֣/נּוּ תֹאכֵ֔ל וְ/אֹת֖/וֹ לֹ֣א תִכְרֹ֑ת כִּ֤י הָֽ/אָדָם֙ עֵ֣ץ הַ/שָּׂדֶ֔ה לָ/בֹ֥א מִ/פָּנֶ֖י/ךָ בַּ/מָּצֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: ml
  text: ഒരു നഗരത്തെ പിടിച്ചടക്കാൻ അതിനെതിരെ യുദ്ധം ചെയ്തുകൊണ്ട് നിരവധി ദിവസങ്ങൾ അതിനെ ഉപരോധിക്കുമ്പോൾ, കോടാലി ഉപയോഗിച്ച് അതിലെ വൃക്ഷങ്ങളെ നശിപ്പിക്കരുത്. അവയിൽനിന്ന് നിനക്കു തിന്നാം; അവയെ വെട്ടിക്കളയരുത്. വയലിലെ വൃക്ഷം ഉപരോധസമയത്ത് നിന്റെ മുമ്പിൽ വരാനുള്ള മനുഷ്യനാണോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യൻ വയലിലെ വൃക്ഷമാണ്,” അല്ലെങ്കിൽ “വയലിലെ വൃക്ഷം മനുഷ്യന്റെ ആഹാരമാണ്.” അവസാന വാക്യത്തിന്റെ ഹീബ്രു ദുഷ്കരമാണ്; മുഖ്യപാഠം വൃക്ഷത്തെ മനുഷ്യശത്രുവിൽനിന്ന് വേർതിരിക്കുന്ന അലങ്കാരചോദ്യമായി അതിനെ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: תָצוּר
  choice: ഉപരോധിക്കുമ്പോൾ
  rationale: צור എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലുള്ള ‘ഉപരോധിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יָמִים רַבִּים
  choice: അനേകം ദിവസം
  rationale: ഹീബ്രു കാലപ്രയോഗത്തിന്റെ രൂപവും അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ
  choice: അതിനെതിരെ യുദ്ധംചെയ്തുകൊണ്ട് ... പിടിച്ചടക്കാൻ
  rationale: യുദ്ധത്തിന്റെ ലക്ഷ്യവും സാഹചര്യവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא תַשְׁחִית אֶת עֵצָהּ
  choice: അതിലെ വൃക്ഷങ്ങളെ ... നശിപ്പിക്കരുത്
  rationale: שׁחת എന്ന ശക്തമായ നശീകരണാർഥം സംരക്ഷിക്കുന്നു.
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: കോടാലികൊണ്ട് ... വെട്ടി
  rationale: അക്ഷരാർഥത്തിലെ അസ്വാഭാവികത ഒഴിവാക്കി കോടാലി പ്രയോഗിക്കുന്ന പ്രവൃത്തി വ്യക്തമായി പറയുന്നു.
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: അവയുടെ ഫലം നിനക്കു ഭക്ഷിക്കാം
  rationale: വൃക്ഷത്തിൽനിന്ന് ഭക്ഷിക്കുന്നു എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ഫലം ഭക്ഷിക്കുന്നതായി വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിലെ പ്രയോജനാർഥവും നിലനിർത്തുന്നു.
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: അവയെ വെട്ടിക്കളയരുത്
  rationale: വൃക്ഷം വെട്ടിവീഴ്ത്തുന്നതിനുള്ള כרת എന്ന സാധാരണ പ്രയോഗം കൃത്യമായി നൽകുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യൻ
  rationale: ഇവിടെ വൃക്ഷത്തോടു വിപരീതമായി നിൽക്കുന്ന മനുഷ്യശത്രുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ പൊതുവായ മനുഷ്യസൂചന സ്വാഭാവികമാണ്.
- source_word: עֵץ הַשָּׂדֶה
  choice: വയലിലെ വൃക്ഷം
  rationale: ഹീബ്രു ഘടനയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: ഉപരോധത്തിൽ നിന്റെ മുമ്പിൽ വരാൻ
  rationale: ദുഷ്കരമായ ഹീബ്രു വാക്യത്തോട് അടുത്തുനിന്നുകൊണ്ട് അതിനെ അലങ്കാരചോദ്യത്തിന്റെ ഭാഗമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: כִּי הָאָדָם עֵץ הַשָּׂדֶה ... എന്ന ദുഷ്കരമായ അവസാന വാക്യത്തിന്റെ വ്യാഖ്യാനം
  choice: വയലിലെ വൃക്ഷം മനുഷ്യനാണോ, ഉപരോധത്തിൽ നിന്റെ മുമ്പിൽ വരാൻ?
  alternative: ‘മനുഷ്യൻ വയലിലെ വൃക്ഷമാണ്’ അല്ലെങ്കിൽ ‘വയലിലെ വൃക്ഷം മനുഷ്യന്റെ ആഹാരമാണ്’
  rationale: ഹീബ്രു വാക്യഘടന യഥാർഥത്തിൽ ദ്വയാർഥസാധ്യതയുള്ളതാണ്. മുഖ്യപാഠം വൃക്ഷത്തെ മനുഷ്യശത്രുവിൽനിന്ന് വേർതിരിക്കുന്ന അലങ്കാരചോദ്യമായി നൽകുന്നു; മറ്റു പ്രധാന വായനകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സൈനികപദമായി ‘ഉപരോധിക്കുക’ ഉപയോഗിച്ചു; ദുഷ്കരമായ അവസാന വാക്യത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
