translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആഹ്വാനശൈലി. ‘ഹൃദയം’ എന്ന എബ്രായ രൂപകം നിലനിർത്തിയെങ്കിലും അതിന്റെ ധൈര്യസംബന്ധമായ അർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി. ബഹുവചന അഭിസംബോധനയും സമൂഹത്തെ ഏകകമായി കാണുന്ന ‘ഹൃദയം’ എന്ന ഏകവചനവും സംരക്ഷിച്ചു.
