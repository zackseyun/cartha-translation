source:
  edition: WLC
  text: וְ/אָמַ֤ר אֲלֵ/הֶם֙ שְׁמַ֣ע יִשְׂרָאֵ֔ל אַתֶּ֨ם קְרֵבִ֥ים הַ/יּ֛וֹם לַ/מִּלְחָמָ֖ה עַל אֹיְבֵי/כֶ֑ם אַל יֵרַ֣ךְ לְבַבְ/כֶ֗ם אַל תִּֽירְא֧וּ וְ/אַֽל תַּחְפְּז֛וּ וְ/אַל תַּֽעַרְצ֖וּ מִ/פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: ml
  text: 'അവരോടു പറയുക: “ഇസ്രായേലേ, കേൾക്കുക! ഇന്ന് നിങ്ങൾ നിങ്ങളുടെ ശത്രുക്കൾക്കെതിരെ യുദ്ധത്തിന് അടുത്തുചെല്ലുകയാണ്. നിങ്ങളുടെ ഹൃദയം തളരരുത്.[a] ഭയപ്പെടുകയോ പരിഭ്രമിക്കുകയോ[b] അവരുടെ മുമ്പിൽ ഭീതിയിലാകുകയോ അരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ധൈര്യം കൈവിടരുത്.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “നിങ്ങളുടെ ഹൃദയം ദുർബലമാകരുത്/മൃദുവാകരുത്” എന്നാണ്; ധൈര്യം തകരുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഭയപ്പെടരുത്; പരിഭ്രാന്തരാകരുത്; അവരുടെ മുമ്പിൽ ഭീതിയിലാകരുത്.” യുദ്ധത്തിലെ ഭയത്തിനെതിരായ കല്പനയെ ഈ മൂന്നു വിലക്കുകൾ തീവ്രമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: അവരോടു പറയുക
  rationale: നിയമപരമായ നടപടിക്രമത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്ന വാവ്-പൂർണക്രിയയെ മുൻവാക്യത്തോടു ചേർന്ന നിർദേശമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: ഇസ്രായേലേ, കേൾക്കുക!
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടിസംബന്ധമായ ആഹ്വാനത്തിന്റെ ശ്രവിക്കുകയും അനുസരിക്കുകയും ചെയ്യുക എന്ന ഇരട്ടനിറം നിലനിർത്തുന്നു.
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: ഇന്ന് ... യുദ്ധത്തിന് അടുത്തുചെല്ലുകയാണ്
  rationale: വർത്തമാന കൃദന്തം സൂചിപ്പിക്കുന്ന ആസന്നമായ മുന്നേറ്റവും ‘അടുത്തുവരുക’ എന്ന ദൃശ്യവും സംരക്ഷിക്കുന്നു.
- source_word: עַל אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കൾക്കെതിരെ
  rationale: യുദ്ധസന്ദർഭത്തിൽ עַל എന്നതിന്റെ വിരോധാത്മക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: നിങ്ങളുടെ ഹൃദയം ധൈര്യംകെട്ടുപോകരുത്
  rationale: ഹൃദയം എന്ന മൂലരൂപകം നിലനിർത്തിക്കൊണ്ട് ധൈര്യം തകരുന്നതിനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אַל תִּירְאוּ
  choice: ഭയപ്പെടുകയോ ... അരുത്
  rationale: ഭയത്തെ വിലക്കുന്ന നേരിട്ടുള്ള അർഥം, തുടർന്ന് വരുന്ന സമാന്തര വിലക്കുകളോടൊപ്പം സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ നൽകുന്നു.
- source_word: וְאַל תַּחְפְּזוּ
  choice: പരിഭ്രമിക്കുകയോ
  rationale: ഇവിടെ വെറും തിടുക്കമല്ല, യുദ്ധഭീതിയാൽ മനസ്സു കലങ്ങുന്ന പ്രതികരണമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וְאַל תַּעַרְצוּ
  choice: ഭീതിയിലാകുകയോ
  rationale: എതിരാളികളുടെ സാന്നിധ്യത്തിൽ ഭയംകൊണ്ട് തകർന്നുപോകുന്ന ശക്തമായ അർഥം നൽകുകയും മൂന്നു വിലക്കുകളുടെ തീവ്രത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִפְּנֵיהֶם
  choice: അവരുടെ മുമ്പിൽ
  rationale: ‘അവരുടെ സന്നിധിയിൽ/മുമ്പിൽ’ എന്ന എബ്രായ രൂപം സംരക്ഷിക്കുന്നു; സാഹചര്യത്തിൽ അതിന്റെ കാരണാത്മക നിറവും വായനക്കാരന് വ്യക്തമാണ്.
