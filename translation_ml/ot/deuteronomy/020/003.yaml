    issue: The main rendering of אַל־יֵרַךְ לְבַבְכֶם is stylistically awkward.
    rationale: The phrase ‘ഹൃദയം ധൈര്യംകെട്ടുപോകരുത്’ combines the heart metaphor with an added courage expression in an unnatural collocation. ‘നിങ്ങളുടെ ഹൃദയം തളരരുത്’ is clearer and closer to the Hebrew idiom; the footnote can supply ‘ധൈര്യം കൈവിടരുത്’ as an idiomatic alternative.
