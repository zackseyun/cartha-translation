reference: Deuteronomy 20:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי תֵצֵ֨א לַ/מִּלְחָמָ֜ה עַל אֹיְבֶ֗י/ךָ וְֽ/רָאִ֜יתָ ס֤וּס וָ/רֶ֨כֶב֙ עַ֚ם רַ֣ב מִמְּ/ךָ֔ לֹ֥א תִירָ֖א מֵ/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ הַ/מַּֽעַלְ/ךָ֖ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: ml
  text: നിന്റെ ശത്രുക്കൾക്കെതിരെ യുദ്ധത്തിനു പുറപ്പെടുമ്പോൾ, കുതിരകളെയും രഥങ്ങളെയും[a], നിന്നെക്കാൾ എണ്ണത്തിൽ വലിയൊരു ജനതയെയും[b] കണ്ടാൽ, അവരെ ഭയപ്പെടരുത്. കാരണം, നിന്നെ ഈജിപ്തുദേശത്തുനിന്ന് കയറ്റിക്കൊണ്ടുവന്ന യഹ്‌വെ, നിന്റെ ദൈവം, നിന്നോടുകൂടെ ഉണ്ട്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘കുതിരയെയും രഥത്തെയും.’ എബ്രായത്തിലെ ഏകവചനങ്ങൾ ഇവിടെ സൈനികശക്തികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതാകാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘നിന്നെക്കാൾ വലിയൊരു ജനതയെ.’ ഈ പ്രയോഗം ശത്രുക്കൾ എണ്ണത്തിൽ കൂടുതലാണെന്നതിന് ഊന്നൽ നൽകുന്നതാകാം.'
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായത്തിൽ: ‘ഈജിപ്തുദേശത്തുനിന്ന് നിന്നെ കയറ്റിക്കൊണ്ടുവന്നവൻ.’ ഈ പ്രയോഗം പുറപ്പാടിനെ അനുസ്മരിപ്പിച്ച് യിസ്രായേലിന്റെ ആത്മവിശ്വാസത്തിന് അടിസ്ഥാനം നൽകുന്നു.'
    reason: cross_reference
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  choice: യുദ്ധത്തിനു പുറപ്പെടുമ്പോൾ
  rationale: כִּי ഇവിടെ ഭാവിയിലെ ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്നു; അതിനാൽ വ്യവസ്ഥാസൂചകമായ ‘എങ്കിൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ കാലസൂചക ‘പുറപ്പെടുമ്പോൾ’ യോജിക്കുന്നു. יצא למלחמה എന്ന സൈനിക പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: עַל אֹיְבֶיךָ
  choice: നിന്റെ ശത്രുക്കൾക്കെതിരെ
  rationale: ശത്രുതാപരമായ പ്രവർത്തനത്തോടൊപ്പം עַל എന്നത് ‘എതിരെ’ എന്ന അർഥം നൽകുന്നു; ബഹുവചനവും രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥതയും സംരക്ഷിക്കുന്നു.
- source_word: סוּס וָרֶכֶב
  choice: കുതിരകളെയും രഥങ്ങളെയും
  rationale: എബ്രായത്തിലെ ഏകവചന രൂപങ്ങൾ ഇവിടെ സൈനിക കുതിരപ്പടയെയും രഥപ്പടയെയും കൂട്ടമായി സൂചിപ്പിക്കാം; മലയാളത്തിൽ ബഹുവചനം ആ കൂട്ടാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עַם רַב מִמְּךָ
  choice: നിന്നെക്കാൾ എണ്ണത്തിൽ വലിയൊരു ജനത
  rationale: רַב + מן എന്ന താരതമ്യപ്രയോഗം സംഖ്യാബലത്തിലെ മേൽക്കോയ്മയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്. ‘എണ്ണത്തിൽ വലിയ’ എന്നത് അതിനെ വ്യക്തമാക്കുന്നു; സൈനികശക്തി മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: לֹא תִירָא מֵהֶם
  choice: അവരെ ഭയപ്പെടരുത്
  rationale: നിയമോപദേശസന്ദർഭത്തിലെ ഈ അപൂർണക്രിയ നിരോധനമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിലെ നേരിട്ടുള്ള നിരോധനരൂപം അതിനെ കൃത്യമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: നിന്റെ ദൈവം ... നിന്നോടുകൂടെയുണ്ട്
  rationale: ഉടമ്പടിപരമായ ദൈവസാന്നിധ്യം നേരിട്ട് പ്രകടിപ്പിക്കുന്ന എബ്രായപ്രയോഗം സ്വാഭാവികമായ മലയാളവാക്യക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: הַמַּעַלְךָ מֵאֶרֶץ מִצְרָיִם
  choice: നിന്നെ ഈജിപ്തുദേശത്തുനിന്ന് കയറ്റിക്കൊണ്ടുവന്നവനായ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ കർത്തൃവാചക കൃതന്തം യഹ്‌വെയെ തിരിച്ചറിയിക്കുന്ന വിശേഷണപ്രയോഗമാണ്. ‘കയറ്റിക്കൊണ്ടുവന്ന’ എന്നത് עלה എന്ന പുറപ്പാട്-പ്രയോഗത്തിലെ ‘മുകളിലേക്കു കൊണ്ടുവരുക’ എന്ന ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: ദൈവസാന്നിധ്യവും ഈജിപ്തിൽനിന്നുള്ള പുറപ്പാടും തമ്മിലുള്ള ബന്ധം
  choice: ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്ന അതേ ദൈവം ഇപ്പോൾ കൂടെയുണ്ടെന്ന വാക്യബന്ധം നിലനിർത്തി
  alternative: പുറപ്പാടിനെ വേറിട്ട ഒരു വിശദീകരണവാക്യമാക്കുക
  rationale: മൂലപാഠത്തിലെ കൃതന്തപ്രയോഗം യഹ്‌വെയെ തിരിച്ചറിയിക്കുകയും യിസ്രായേലിന്റെ ധൈര്യത്തിന് ചരിത്രപരമായ അടിസ്ഥാനം നൽകുകയും ചെയ്യുന്നു; അതിനെ വ്യാഖ്യാനിച്ച് കൂടുതൽ നിർണ്ണയിക്കാതെ ബന്ധം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. സൈനികസന്ദർഭം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുമ്പോഴും എബ്രായത്തിലെ കൂട്ടാർഥമുള്ള ഏകവചനങ്ങൾ, താരതമ്യത്തിന്റെ സൂക്ഷ്മത, പുറപ്പാടിനെ സൂചിപ്പിക്കുന്ന ‘കയറ്റിക്കൊണ്ടുവരുക’ എന്ന പ്രയോഗം എന്നിവ അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
