  to: നിന്റെ ശത്രുക്കൾക്കെതിരെ യുദ്ധത്തിനു പുറപ്പെടുമ്പോൾ, കുതിരകളെയും രഥങ്ങളെയും[a], നിന്നെക്കാൾ എണ്ണത്തിൽ വലിയൊരു ജനതയെയും[b] കണ്ടാൽ, അവരെ ഭയപ്പെടരുത്. കാരണം, നിന്നെ ഈജിപ്തുദേശത്തുനിന്ന് കയറ്റിക്കൊണ്ടുവന്ന യഹ്‌വെ, നിന്റെ ദൈവം, നിന്നോടുകൂടെ ഉണ്ട്.[c]
  rationale: വാക്യത്തിന്റെ അർഥമോ ദൈവശാസ്ത്രപരമായ ഊന്നലോ മാറ്റാതെ, യഹ്‌വെയുടെ നാമം വിഷയസ്ഥാനത്ത് വ്യക്തമായി വരത്തക്കവണ്ണം വാക്യക്രമം പരിഷ്കരിച്ചു. കൃതന്തവിശേഷണവും അടിക്കുറിപ്പും ഈജിപ്തിൽനിന്നുള്ള ചരിത്രപരമായ പുറപ്പാടിനെ സൂചിപ്പിക്കുന്ന വിവർത്തനവുമായി യോജിപ്പിച്ചു. അടിക്കുറിപ്പ് c-യുടെ ആങ്കർ യഹ്‌വെ/ദൈവസാന്നിധ്യവാക്യത്തിന്റെ അന്ത്യത്തിൽ സ്ഥാപിച്ചതിലൂടെ അതിന്റെ മുഴുവൻ വിശേഷണബന്ധം വ്യക്തമാണ്.
