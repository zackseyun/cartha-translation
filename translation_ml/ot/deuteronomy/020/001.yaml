  source_fidelity: 'മുഖ്യഅർഥം എബ്രായമൂലത്തോട് വിശ്വസ്തമാണ്: യുദ്ധത്തിനായി പുറപ്പെടൽ, ശത്രുക്കളുടെ സംഖ്യാപരമായ മേൽക്കോയ്മ, ഭയപ്പെടരുതെന്ന നിർദേശം, യഹ്‌വെയുടെ സാന്നിധ്യം, ഈജിപ്തിൽനിന്നുള്ള പുറപ്പാട് എന്നിവയെല്ലാം സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ യഹ്‌വെ എന്ന നാമത്തിന്റെയും അതിനെ വിശേഷിപ്പിക്കുന്ന കൃതന്തത്തിന്റെയും നിലവിലെ ക്രമം മലയാളത്തിൽ അൽപം കൃത്രിമമാണ്.'
