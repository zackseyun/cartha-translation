source:
  edition: WLC
  text: כֵּ֤ן תַּעֲשֶׂה֙ לְ/כָל הֶ֣/עָרִ֔ים הָ/רְחֹקֹ֥ת מִמְּ/ךָ֖ מְאֹ֑ד אֲשֶׁ֛ר לֹא מֵ/עָרֵ֥י הַ/גּֽוֹיִם הָ/אֵ֖לֶּה הֵֽנָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/015.yaml
  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: ml
  text: നിങ്ങളിൽനിന്ന് വളരെ അകലെയുള്ള, ഈ ജനതകൾക്കുള്ള നഗരങ്ങളിൽ ഉൾപ്പെടാത്ത എല്ലാ നഗരങ്ങളോടും ഇങ്ങനെ പ്രവർത്തിക്കണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അങ്ങനെ പ്രവർത്തിക്കണം” അല്ലെങ്കിൽ “ഈ വിധത്തിൽ പ്രവർത്തിക്കണം.”'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഈ ജനതകളുടെ നഗരങ്ങളിൽനിന്നുള്ളവയല്ലാത്ത.” ഇവ ഇപ്പോൾ പരാമർശിച്ച ജനതകൾക്കുള്ള നഗരങ്ങളല്ല എന്നാണ് ഉദ്ദേശ്യം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: ഇപ്രകാരം
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച നടപടിയുടെ രീതിയെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നിയമനിർദേശത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: תַּעֲשֶׂה
  choice: ചെയ്യണം
  rationale: നിയമസന്ദർഭത്തിലെ രണ്ടാം പുരുഷ ഏകവചന അപൂർണ്ണക്രിയയുടെ നിർദേശാത്മക ശക്തി വ്യക്തമായി നൽകുന്നു.
- source_word: לְכָל הֶעָרִים
  choice: എല്ലാ നഗരങ്ങളോടും
  rationale: ലാമെദ് ഇവിടെ നടപടി ബാധകമാകുന്ന വസ്തുവിനെ അടയാളപ്പെടുത്തുന്നു; ‘നഗരങ്ങളോടും’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: നിങ്ങളിൽനിന്ന് വളരെ അകലെയുള്ള
  rationale: സ്ഥലപരമായ അകലവും מְאֹד എന്ന തീവ്രതാസൂചകവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא מֵעָרֵי
  choice: നഗരങ്ങളിൽ ഉൾപ്പെടാത്ത
  rationale: מִן എന്നതിന്റെ വിഭാഗത്തിൽനിന്നുള്ള ഒഴിവാക്കൽ എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ഈ ജനതകൾ
  rationale: גּוֹיִם ഇവിടെ നിർദിഷ്ട ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘ജനതകൾ’ രാഷ്ട്രീയ-വംശീയ വ്യാപ്തി നിലനിർത്തുകയും പിൽക്കാല മതപരമായ അർഥങ്ങൾ ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הֵנָּה
  choice: ‘ഈ’ എന്നതിൽ ഉൾക്കൊള്ളുന്നു
  rationale: സ്ത്രീലിംഗ ബഹുവചന സർവനാമം സമീപത്വവും ഊന്നലും നൽകുന്നു; മലയാളത്തിൽ വേറെ പദം ചേർക്കാതെ ‘ഈ ജനതകൾ’ എന്നതിൽ അതിന്റെ ശക്തി സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ദൂരെയുള്ള നഗരങ്ങളും ചുറ്റുപാടിൽ സമൂലനാശവിധിക്ക് വിധേയമായ ജനതകളുടെ നഗരങ്ങളും തമ്മിലുള്ള പരിധിവ്യത്യാസം
  choice: ഈ നിർദേശം ദൂരെയുള്ള നഗരങ്ങൾക്ക് ബാധകമാണെന്നും പരാമർശിച്ച ജനതകളുടെ നഗരങ്ങൾക്ക് ബാധകമല്ലെന്നും നിയമപരമായ വ്യത്യാസമായി നിലനിർത്തി.
  alternative: മുൻവാക്യങ്ങളിലെ ഉപരോധനിബന്ധനകൾ ഈ വാക്യത്തിൽ വിശദീകരിച്ചുചേർക്കുക, അല്ലെങ്കിൽ വ്യത്യാസത്തെ പൊതുവായ വിദേശനഗരങ്ങളെക്കുറിച്ചുള്ള പ്രസ്താവനയായി മയപ്പെടുത്തുക.
  rationale: ഈ വാക്യം മുൻനിർദേശങ്ങളുടെ പ്രയോഗപരിധി അടയാളപ്പെടുത്തുന്നു. സമീപവാക്യങ്ങളിൽനിന്നുള്ള അധിക വ്യാഖ്യാനം ചേർക്കാതെയും സൈനിക-നിയമപരമായ ശക്തി മയപ്പെടുത്താതെയും ആ വ്യത്യാസം വ്യക്തമായി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. ഏകവചന അഭിസംബോധനയുടെ അർഥം മലയാളത്തിലെ മാന്യരൂപമായ ‘നിങ്ങൾ’ വഴി നൽകുന്നു. മുഖ്യവാക്യത്തിൽ അനാവശ്യമായ വിശദീകരണം ചേർക്കാതെ മൂലപാഠത്തിന്റെ ഘടനയും പരിധിവ്യത്യാസവും സംരക്ഷിച്ചിട്ടുണ്ട്.
