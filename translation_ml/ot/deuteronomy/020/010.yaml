source:
  edition: WLC
  text: כִּֽי תִקְרַ֣ב אֶל עִ֔יר לְ/הִלָּחֵ֖ם עָלֶ֑י/הָ וְ/קָרָ֥אתָ אֵלֶ֖י/הָ לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/010.yaml
  text: When you draw near to a city to fight against it[a], you shall call out to it for peace.
translation:
  language: ml
  text: ഒരു പട്ടണത്തിനെതിരെ യുദ്ധം ചെയ്യാൻ നീ അതിനെ സമീപിക്കുമ്പോൾ, അതിനു സമാധാനം വാഗ്ദാനം ചെയ്യണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അതിനു സമാധാനത്തിനായി വിളിച്ചുപറയണം”; സന്ദർഭത്തിൽ, “അതിനു സമാധാനവ്യവസ്ഥകൾ പ്രഖ്യാപിക്കണം” എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എപ്പോൾ / -ുമ്പോൾ
  rationale: ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നതല്ല, യുദ്ധനടപടിക്കുള്ള സാഹചര്യകാലം അവതരിപ്പിക്കുന്നതാണ്; അതിനാൽ മലയാളത്തിൽ ‘സമീപിക്കുമ്പോൾ’ എന്നു സ്വാഭാവികമായി ചേർത്തു.
- source_word: תִקְרַב
  choice: സമീപിക്കുക
  rationale: קרב എന്ന ക്രിയയുടെ അടുത്തുചെല്ലുക/സമീപിക്കുക എന്ന മൂർത്തമായ അർഥം വ്യക്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עִיר
  choice: ഒരു പട്ടണം
  rationale: നിയമനിർദേശത്തിലെ അനിശ്ചിത ഏകവചനമായ ‘ഒരു നഗരം/പട്ടണം’ എന്ന അർഥം; ഈ യുദ്ധസന്ദർഭത്തിൽ ‘പട്ടണം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: അതിനെതിരെ യുദ്ധം ചെയ്യാൻ
  rationale: לחם എന്നതിന്റെ യുദ്ധത്തിൽ ഏർപ്പെടുക എന്ന അർഥവും עַל എന്നതിന്റെ വിരോധദിശയും നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: וְקָרָאתָ אֵלֶיהָ
  choice: അതിനോടു വിളിച്ചുപറയണം
  rationale: קרא എന്നതിന് വിളിക്കുക, വിളിച്ചുപറയുക, പ്രഖ്യാപിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ഔപചാരികമായ വ്യവസ്ഥകൾ എന്നു അധികമായി നിർണ്ണയിക്കാതെ വാചിക ആഹ്വാനം നിലനിർത്തുന്നു.
- source_word: לְשָׁלוֹם
  choice: സമാധാനത്തിനായി
  rationale: לְ എന്ന ഉപസർഗവും שָׁלוֹם എന്നതിന്റെ സമാധാനം/ക്ഷേമം എന്ന അടിസ്ഥാനാർഥവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സമാധാനവാഗ്ദാനമോ സമാധാനവ്യവസ്ഥകളോ സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. നഗരത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സ്ത്രീലിംഗ സർവനാമങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അത്’ എന്നു നൽകി. മുഖ്യപാഠം എബ്രായപ്രയോഗത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു; യുദ്ധത്തിനു മുമ്പുള്ള സമാധാനനിർദേശം എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വിശദമാക്കുന്നു.
