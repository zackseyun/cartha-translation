revisions:
- from: നീ ഒരു പട്ടണത്തിനെതിരെ യുദ്ധം ചെയ്യാൻ അതിനെ സമീപിക്കുമ്പോൾ, സമാധാനത്തിനായി അതിനോടു വിളിച്ചുപറയണം.[a]
  to: ഒരു പട്ടണത്തിനെതിരെ യുദ്ധം ചെയ്യാൻ നീ അതിനെ സമീപിക്കുമ്പോൾ, അതിനു സമാധാനം വാഗ്ദാനം ചെയ്യണം.[a]
