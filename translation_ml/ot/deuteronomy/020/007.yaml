source:
  edition: WLC
  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר אֵרַ֤שׂ אִשָּׁה֙ וְ/לֹ֣א לְקָחָ֔/הּ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יִקָּחֶֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: ml
  text: ഒരു സ്ത്രീയോടു വിവാഹനിശ്ചയം ചെയ്തിട്ടും അവളെ ഭാര്യയായി സ്വീകരിക്കാത്ത[a] പുരുഷൻ ആരെങ്കിലും ഉണ്ടോ? അവൻ പോയി തന്റെ വീട്ടിലേക്കു മടങ്ങട്ടെ; യുദ്ധത്തിൽ അവൻ മരിച്ചുപോകുകയും മറ്റൊരാൾ അവളെ ഭാര്യയായി സ്വീകരിക്കുകയും[b] ചെയ്യാതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവളെ എടുത്തിട്ടില്ലാത്ത.” ഇവിടെ ഇതിന് വിവാഹനിശ്ചയത്തിനുശേഷം അവളെ ഭാര്യയായി സ്വീകരിച്ചിട്ടില്ല എന്ന അർഥമുണ്ട്.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “മറ്റൊരാൾ അവളെ എടുക്കുകയും.” ഇവിടെ “എടുക്കുക” എന്നത് വിവാഹാർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: പുരുഷൻ ആരെങ്കിലും ഉണ്ടോ?
  rationale: അടുത്ത സൈനിക ഇളവുവിഭാഗത്തെക്കുറിച്ചുള്ള ആഹ്വാനരൂപത്തിലുള്ള ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; പുരുഷ ഏകവചനവും സൈനികസന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: אֵרַשׂ אִשָּׁה
  choice: ഒരു സ്ത്രീയുമായി വിവാഹനിശ്ചയം കഴിഞ്ഞിട്ടും
  rationale: אֵרַשׂ സൂചിപ്പിക്കുന്ന ഔപചാരിക വിവാഹനിശ്ചയത്തെ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; വിവാഹം പൂർത്തിയായിട്ടില്ലെന്ന തുടർവാക്യത്തിലെ വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: וְלֹא לְקָחָהּ
  choice: അവളെ വിവാഹം കഴിക്കാത്ത
  rationale: സ്ത്രീയെ 'എടുക്കുക' എന്ന എബ്രായ പ്രയോഗത്തിന് ഇവിടെ വിവാഹം പൂർത്തിയാക്കുക എന്ന അർഥമാണ്; അക്ഷരാർഥത്തിലുള്ള മലയാളം തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതിനാൽ സ്വാഭാവികമായ വിവാഹാർഥം മുഖ്യപാഠത്തിൽ നൽകി.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: അവൻ മടങ്ങി വീട്ടിലേക്കു പോകട്ടെ
  rationale: സൈനികസേവനത്തിൽനിന്ന് വിട്ട് സ്വന്തം വീട്ടിലേക്കു മടങ്ങാനുള്ള നിർദേശത്തിന്റെ ആജ്ഞാസദൃശ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: അവൻ യുദ്ധത്തിൽ മരിക്കുകയും ... ചെയ്യാതിരിക്കേണ്ടതിന്
  rationale: פֶּן എന്ന നിഷേധാത്മക സാധ്യത/മുന്നറിയിപ്പ് മലയാളത്തിലെ ലക്ഷ്യ-പ്രതിരോധ ഘടനയിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: മറ്റൊരാൾ അവളെ വിവാഹം കഴിക്കുകയും
  rationale: יִקָּחֶנָּה-യുടെ വിവാഹസന്ദർഭത്തിലുള്ള അർഥം നൽകുന്നു; ആദ്യത്തെ לְקָחָהּ എന്ന ക്രിയയുമായുള്ള ആവർത്തനബന്ധവും ഒരേ വിവർത്തനത്തിലൂടെ നിലനിർത്തുന്നു.
