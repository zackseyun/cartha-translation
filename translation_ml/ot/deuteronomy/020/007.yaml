translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ വിവാഹസംബന്ധമായ ‘എടുക്കുക’ എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ അക്ഷരാർഥമായി പകർത്താതെ വ്യക്തമായ അർഥം നൽകി; ഉറവിടപ്രയോഗം അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
