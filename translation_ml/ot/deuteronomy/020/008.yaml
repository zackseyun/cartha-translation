  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָסְפ֣וּ הַ/שֹּׁטְרִים֮ לְ/דַבֵּ֣ר אֶל הָ/עָם֒ וְ/אָמְר֗וּ מִי הָ/אִ֤ישׁ הַ/יָּרֵא֙ וְ/רַ֣ךְ הַ/לֵּבָ֔ב יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ וְ/לֹ֥א יִמַּ֛ס אֶת לְבַ֥ב אֶחָ֖י/ו כִּ/לְבָבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: ml
  text: 'പിന്നെ ഉദ്യോഗസ്ഥന്മാർ ജനത്തോടു തുടർന്നും സംസാരിച്ച് ഇങ്ങനെ പറയണം: “ഭയമുള്ളവനും ഹൃദയത്തിൽ ധൈര്യമില്ലാത്തവനുമായ മനുഷ്യൻ ആരാണ്?[a] അവൻ പോയി തന്റെ വീട്ടിലേക്കു മടങ്ങട്ടെ; അവൻ തന്റെ സഹോദരന്മാരുടെ[b] ഹൃദയവും തന്റേതുപോലെ ധൈര്യംകെട്ടതാക്കാതിരിക്കാൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഭയമുള്ളവനും മൃദു/ദുർബല ഹൃദയമുള്ളവനും.”'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “സഹോദരന്മാർ” എന്നത് സഹഇസ്രായേല്യരെയോ സഹയോദ്ധാക്കളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: തുടർന്നു
  rationale: ‘കൂട്ടിച്ചേർക്കുക’ എന്ന അടിസ്ഥാനാർഥമുള്ള ക്രിയ, സംസാരിക്കുക എന്ന ക്രിയയോടൊപ്പം ഇവിടെ ‘തുടരുക/വീണ്ടും സംസാരിക്കുക’ എന്ന പ്രയോഗാർഥം നൽകുന്നു.
- source_word: הַשֹּׁטְרִים
  choice: ഉദ്യോഗസ്ഥന്മാർ
  rationale: ഇവിടെ ആധുനിക അർഥത്തിലുള്ള പോലീസുകാരെയല്ല, നിയമിത ഭരണ-സൈനിക ചുമതലക്കാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: ഭയമുള്ളവനും ഹൃദയത്തിൽ ധൈര്യമില്ലാത്തവനുമായ
  rationale: ‘ഭയമുള്ളവൻ, മൃദു/ദുർബല ഹൃദയമുള്ളവൻ’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ യുദ്ധസന്ദർഭത്തിലെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ‘ഹൃദയം’ എന്ന രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: അവൻ പോയി തന്റെ വീട്ടിലേക്കു മടങ്ങട്ടെ
  rationale: ചോദ്യത്തിനു പിന്നാലെയുള്ള നിർദേശാത്മക ക്രിയാഭാവവും ‘വീട്’ എന്ന മൂലപദവും സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא יִמַּס אֶת־לְבַב אֶחָיו כִּלְבָבוֹ
  choice: അല്ലെങ്കിൽ തന്റെ സഹോദരന്മാരുടെ ഹൃദയവും തന്റേതുപോലെ ധൈര്യംകെട്ടതാക്കും
  rationale: മറ്റുള്ളവരുടെ ഹൃദയത്തെ ‘ഉരുക്കുക’ എന്ന എബ്രായരൂപകം മലയാളത്തിൽ അനുകമ്പയെന്ന തെറ്റായ ധ്വനി നൽകാം; അതിനാൽ ധൈര്യം നഷ്ടപ്പെടുത്തുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കി, ഹൃദയത്തിന്റെ ആവർത്തനവും കാരണഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: സൈനികസന്ദർഭത്തിലെ ലിംഗസൂചക ഭാഷ
  choice: ‘മനുഷ്യൻ’, ‘സഹോദരന്മാർ’ എന്നീ പുരുഷലിംഗരൂപങ്ങൾ നിലനിർത്തി
  alternative: ‘വ്യക്തി’, ‘കൂട്ടാളികൾ’, ‘സഹയോദ്ധാക്കൾ’
  rationale: എബ്രായമൂലത്തിൽ ഏകവചന പുരുഷലിംഗവും പുരുഷബന്ധുത്വപദവും ഉപയോഗിക്കുന്നു. യുദ്ധസന്ദർഭത്തിന്റെ സാമൂഹികരൂപവും യഥാർഥ ലിംഗസൂചനയും അനാവശ്യമായി നിഷ്പക്ഷമാക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭരണപരമായ ശֹׁטְרִים എന്ന പദത്തിന് ആധുനിക പോലീസ് ധ്വനി ഒഴിവാക്കാൻ ‘ഉദ്യോഗസ്ഥന്മാർ’ ഉപയോഗിച്ചു. ‘ഹൃദയം ഉരുക്കുക’ മലയാളത്തിൽ അനുകമ്പ ഉണർത്തുക എന്ന അർഥം വരാനിടയുള്ളതിനാൽ യുദ്ധസന്ദർഭത്തിലെ ധൈര്യനഷ്ടം വ്യക്തമായി പറഞ്ഞു.
