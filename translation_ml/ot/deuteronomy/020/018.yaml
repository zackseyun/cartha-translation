  rationale: The revision replaces a potentially misleading, archaic term with modern Malayalam that conveys the Hebrew’s strong religious-moral evaluation. It also makes the relation of sin to YHWH idiomatic and clear, while retaining the verse’s purpose-and-consequence flow and the existing lexical-alternative footnote.
