id: DEU.20.18
reference: Deuteronomy 20:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְמַ֗עַן אֲשֶׁ֨ר לֹֽא יְלַמְּד֤וּ אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת כְּ/כֹל֙ תּֽוֹעֲבֹתָ֔/ם אֲשֶׁ֥ר עָשׂ֖וּ לֵֽ/אלֹהֵי/הֶ֑ם וַ/חֲטָאתֶ֖ם לַ/יהוָ֥ה אֱלֹהֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/018.yaml
  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ ദേവന്മാർക്കുവേണ്ടി ചെയ്തിട്ടുള്ള എല്ലാ വെറുപ്പുളവാക്കുന്ന ആചാരങ്ങളും നിങ്ങൾ ചെയ്യാൻ നിങ്ങളെ പഠിപ്പിക്കാതിരിക്കാനും, അങ്ങനെ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയ്ക്ക് എതിരായി നിങ്ങൾ പാപം ചെയ്യാതിരിക്കാനുമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തങ്ങളുടെ ദേവന്മാർക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: לֵאלֹהֵיהֶם എന്നതിലെ לְ ആരാധനാപരമായ ദിശയെയോ പ്രയോജനബന്ധത്തെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: ചെയ്യാതിരിക്കാനും ... ചെയ്യാതിരിക്കാനും വേണ്ടിയാണിത്
  rationale: സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെട്ട പ്രതിരോധത്തെ സൂചിപ്പിക്കുന്ന ലക്ഷ്യപ്രയോഗം; മലയാളത്തിൽ നിഷേധാത്മക ലക്ഷ്യവാക്യമായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת
  choice: ചെയ്യാൻ നിങ്ങളെ പഠിപ്പിക്കുക
  rationale: പീയേൽ ക്രിയയുടെ നേരിട്ടുള്ള ‘പഠിപ്പിക്കുക’ എന്ന അർഥവും തുടർന്നുള്ള infinitive-ന്റെ പ്രവർത്തനബന്ധവും നിലനിർത്തുന്നു.
- source_word: כְּכֹל תּוֹעֲבֹתָם
  choice: സകല മ്ലേച്ഛാചാരങ്ങളും
  rationale: כְּ സൂചിപ്പിക്കുന്ന അനുകരണം മലയാളത്തിലെ ‘അവ ... ചെയ്യാൻ’ എന്ന ഘടനയിൽ വ്യക്തമാണ്; תועבה-യുടെ ശക്തമായ മത-ധാർമിക നിന്ദയും പ്രവൃത്തിസംബന്ധമായ അർഥവും ‘മ്ലേച്ഛാചാരങ്ങൾ’ അറിയിക്കുന്നു.
- source_word: אֲשֶׁר עָשׂוּ
  choice: ചെയ്തിട്ടുള്ള
  rationale: ആ ജനങ്ങൾ അനുഷ്ഠിച്ചിരുന്ന പ്രവൃത്തികളെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לֵאלֹהֵיהֶם
  choice: തങ്ങളുടെ ദേവന്മാർക്കുവേണ്ടി
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ആരാധനാപരമായ ബന്ധം/ദിശ ‘വേണ്ടി’ എന്നതിലൂടെ നൽകുന്നു; ‘ദേവന്മാർക്ക്’ എന്നതും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וַחֲטָאתֶם לַיהוָה
  choice: അങ്ങനെ ... യഹ്‌വേയോടു നിങ്ങൾ പാപം ചെയ്യുക
  rationale: തുടർഫലബന്ധം ‘അങ്ങനെ’ വ്യക്തമാക്കുന്നു; חטא + לָ-യിൽ യഹ്‌വേ പാപത്താൽ അപരാധിക്കപ്പെടുന്ന വ്യക്തിയാണെന്ന ബന്ധം ‘യോടു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ
  rationale: ഉടമ്പടിനാമം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുകയും אֱלֹהֵיכֶם എന്ന സമാനാധികരണത്തെ സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഹീബ്രു പാഠത്തിൽ വ്യക്തിനാമമായ ടെട്രാഗ്രാമറ്റൺ നേരിട്ട് വരുന്നതിനാൽ അതിനെ പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: വാക്യാന്തത്തിലെ ലക്ഷ്യമോ ഫലമോ
  choice: നിങ്ങൾ പാപം ചെയ്യാതിരിക്കാനും വേണ്ടിയാണിത്
  alternative: നിങ്ങൾ പാപം ചെയ്തുപോകും
  rationale: וַחֲטָאתֶם മുൻപുള്ള לְמַעַן ലക്ഷ്യഘടനയുടെ പരിധിയിൽ തുടരുന്നതായി വായിച്ച് പ്രതിരോധലക്ഷ്യം പ്രകടമാക്കി; എന്നാൽ ഫലനിറം പൂർണമായി ഇല്ലാതാക്കാതിരിക്കാൻ ‘അങ്ങനെ’ ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം. ‘മ്ലേച്ഛാചാരങ്ങൾ’ എന്നത് തועבות എന്ന ശക്തമായ മത-ധാർമിക പദത്തിന്റെ ബലം നിലനിർത്തുന്നു; വാക്യഘടന വായനാസൗകര്യത്തിനായി മലയാളത്തിലെ നിഷേധാത്മക ലക്ഷ്യരീതിയിൽ ക്രമപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
