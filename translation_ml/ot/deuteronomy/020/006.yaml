language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר נָטַ֥ע כֶּ֨רֶם֙ וְ/לֹ֣א חִלְּל֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יְחַלְּלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: ml
  text: മുന്തിരിത്തോട്ടം നട്ടിട്ട് ഇതുവരെ അതിന്റെ വിളവ് അനുഭവിച്ചിട്ടില്ലാത്തവൻ[a] ആരാണ്? അവൻ യുദ്ധത്തിൽ മരിക്കുകയും മറ്റൊരാൾ അതിന്റെ വിളവ് അനുഭവിക്കുകയും ചെയ്യാതിരിക്കേണ്ടതിന്, അവൻ തന്റെ വീട്ടിലേക്കു മടങ്ങിപ്പോകട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “അതിനെ സമർപ്പിച്ചിട്ടില്ല” അല്ലെങ്കിൽ “അത് ഉപയോഗിച്ചുതുടങ്ങിയിട്ടില്ല.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ മുന്തിരിത്തോട്ടം ആദ്യമായി സാധാരണ ഉപയോഗത്തിലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആദ്യ വർഷങ്ങളിലെ വിലക്കിനുശേഷം അതിന്റെ വിളവ് അനുഭവിക്കുന്നതായിരിക്കാം ഉദ്ദേശ്യം (ലേവ്യർ 19:23–25 താരതമ്യം ചെയ്യുക).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: ആരാണ്?
  rationale: സൈനികസേവനത്തിൽനിന്നുള്ള ഒഴിവിന്റെ മറ്റൊരു സാഹചര്യം അവതരിപ്പിക്കുന്ന എബ്രായ ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘അവൻ’ പുരുഷ പോരാളിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נָטַע כֶּרֶם
  choice: മുന്തിരിത്തോട്ടം നട്ടിട്ട്
  rationale: മുമ്പ് പൂർത്തിയായെങ്കിലും ഇപ്പോഴത്തെ സാഹചര്യവുമായി ബന്ധമുള്ള പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְלֹא חִלְּלוֹ
  choice: ഇതുവരെ അതിന്റെ ഫലം അനുഭവിച്ചിട്ടില്ലാത്തവൻ
  rationale: חלל എന്ന ക്രിയ ഇവിടെ ‘അശുദ്ധമാക്കുക’ എന്ന സാധാരണ അർഥത്തിലല്ല, മുന്തിരിത്തോട്ടം ആദ്യമായി സാധാരണ ഉപയോഗത്തിലാക്കുകയും അതിന്റെ പ്രയോജനം അനുഭവിക്കുകയും ചെയ്യുക എന്ന സന്ദർഭാർഥത്തിലാണ്. ‘ഫലം അനുഭവിക്കുക’ ആ പ്രായോഗിക അർഥം വ്യക്തമായി നൽകുന്നു; കൂടുതൽ ഔപചാരിക സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: അവൻ മടങ്ങി തന്റെ വീട്ടിലേക്കു പോകട്ടെ
  rationale: യിഖ്തോൽ ക്രിയകളുടെ നിർദേശാത്മക ഭാവം ‘പോകട്ടെ’കൊണ്ട് നൽകുന്നു; ആവർത്തനഭാരം ഒഴിവാക്കിക്കൊണ്ട് ‘മടങ്ങുക’, ‘വീട്ടിലേക്കു പോകുക’ എന്നീ രണ്ടു ഘടകങ്ങളും സംരക്ഷിക്കുന്നു.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: അവൻ യുദ്ധത്തിൽ മരിക്കുകയും … ചെയ്യാതിരിക്കേണ്ടതിന്
  rationale: פן സൂചിപ്പിക്കുന്ന ആശങ്കയും പ്രതിരോധലക്ഷ്യവും സ്വാഭാവിക മലയാളത്തിലെ നിഷേധാത്മക ഉദ്ദേശ്യഘടനയിലൂടെ നൽകുന്നു.
- source_word: וְאִישׁ אַחֵר יְחַלְּלֶנּוּ
  choice: മറ്റൊരാൾ അതിന്റെ ഫലം അനുഭവിക്കുകയും
  rationale: രണ്ടാമത്തെ חלל-നും ആദ്യത്തേതിനോടു സമാനമായ സന്ദർഭാർഥം നൽകുന്നു. ‘മറ്റൊരാൾ’ സ്വാഭാവിക മലയാളത്തിൽ אישׁ אַחֵר എന്നതിന്റെ അർഥം കൃത്യമായി വഹിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ ഗൗരവമുള്ള ശൈലി. എബ്രായത്തിലെ חלל എന്ന സന്ദർഭസവിശേഷ പ്രയോഗത്തിന്റെ വ്യക്തമായ അർഥം മുഖ്യവാചകത്തിൽ നൽകിയിട്ടും അതിന്റെ കൂടുതൽ രൂപാനുസൃത സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
