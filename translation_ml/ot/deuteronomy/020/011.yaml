source:
  edition: WLC
  text: וְ/הָיָה֙ אִם שָׁל֣וֹם תַּֽעַנְ/ךָ֔ וּ/פָתְחָ֖ה לָ֑/ךְ וְ/הָיָ֞ה כָּל הָ/עָ֣ם הַ/נִּמְצָא בָ֗/הּ יִהְי֥וּ לְ/ךָ֛ לָ/מַ֖ס וַ/עֲבָדֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: ml
  text: അതു നിന്നോടു സമാധാനത്തോടെ പ്രതികരിച്ച്[a] നിനക്കു തുറന്നുതന്നാൽ, അതിലുള്ള ജനമെല്ലാം നിനക്കു നിർബന്ധിതവേലയ്ക്കു വിധേയരായി[b] നിന്നെ സേവിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘സമാധാനവ്യവസ്ഥകളോടെ നിനക്കു മറുപടി നൽകി.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘നിനക്കു കപ്പവേലയ്ക്കു വിധേയരായി.’ എബ്രായപദത്തിന് കപ്പം, ചുമത്തപ്പെട്ട സേവനം, നിർബന്ധിതവേല എന്നീ അർഥങ്ങളുണ്ടാകാം; ഇവിടെ സന്ദർഭം നിർബന്ധിത അധ്വാനസേവനത്തെയാണ് കൂടുതൽ സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם תַּעַנְךָ
  choice: നിന്നോടു സമാധാനത്തോടെ പ്രതികരിച്ച്
  rationale: യുദ്ധസന്ദർഭത്തിൽ നഗരം സമാധാനനിർദേശത്തോട് അനുകൂലമായി പ്രതികരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സമാധാനം’ എന്ന എബ്രായ നാമത്തിന്റെ ആശയം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וּפָתְחָה לָךְ
  choice: നിനക്കായി തുറന്നുതന്നാൽ
  rationale: എബ്രായത്തിൽ ‘വാതിലുകൾ’ എന്നു വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ സന്ദർഭത്തിൽ ഉദ്ദേശ്യം വ്യക്തമായിരിക്കുമ്പോഴും ആ പദം കൂട്ടിച്ചേർക്കാതെ ‘തുറക്കുക’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: הָעָם הַנִּמְצָא בָהּ
  choice: അതിലുള്ള ജനമെല്ലാം
  rationale: ‘അതിൽ കാണപ്പെടുന്ന സകലജനവും’ എന്ന അക്ഷരാർഥത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി പറയുന്നു; നഗരത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന സർവനാമവും നിലനിർത്തുന്നു.
- source_word: לָמַס
  choice: നിർബന്ധിതവേല ചെയ്യേണ്ടവർ
  rationale: מַס എന്ന പദത്തിന് കപ്പം, ചുമത്തപ്പെട്ട സേവനം, നിർബന്ധിതവേല എന്നീ അർഥങ്ങളുണ്ടാകാം. പിന്നാലെയുള്ള ‘സേവിക്കുക’ എന്ന ക്രിയയും ഈ യുദ്ധനിയമത്തിന്റെ സന്ദർഭവും ഇവിടെ നിർബന്ധിത അധ്വാനസേവനമാണ് മുൻനിൽക്കുന്നതെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: וַעֲבָדוּךָ
  choice: നിന്നെ സേവിക്കണം
  rationale: עבד എന്ന ക്രിയയുടെ ‘സേവിക്കുക/വേലചെയ്യുക’ എന്ന പൊതുവായ അർഥം നിലനിർത്തുന്നു; എബ്രായം വ്യക്തമാക്കാത്ത ഒരു പ്രത്യേക അടിമത്തസ്ഥാപനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യുദ്ധനിയമത്തിലെ കീഴടക്കവും നിർബന്ധിതസേവനവും സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: നിർബന്ധിതവേല ചെയ്യേണ്ടവരായിത്തീർന്ന് നിന്നെ സേവിക്കണം
  alternative: കപ്പം കൊടുത്ത് നിന്നെ സേവിക്കണം
  rationale: മൂലപാഠത്തിലെ ബലപ്രയോഗപരമായ കീഴ്വഴക്കം മൃദൂകരിക്കാതെയും מַס എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി ഒരു സാമ്പത്തിക കപ്പമായി മാത്രം ചുരുക്കാതെയും അവതരിപ്പിക്കുന്നു. അതേസമയം മൂലപാഠം വ്യക്തമാക്കുന്നതിലധികം പ്രത്യേകമായ ഒരു സാമൂഹികസ്ഥാപനം ആരോപിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നഗരത്തെ വ്യക്തിവൽക്കരിക്കുന്ന എബ്രായപ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ‘അതു’ എന്ന സർവനാമം ഉപയോഗിച്ചു. ‘വാതിലുകൾ’ എന്ന സന്ദർഭസൂചന പാഠത്തിൽ ചേർത്തിട്ടില്ല; നിർബന്ധിതസേവനത്തിന്റെ കഠിനത മൃദൂകരിച്ചിട്ടില്ല.
