- from: അതു നിന്നോടു സമാധാനത്തോടെ പ്രതികരിച്ച്[a] നിനക്കായി തുറന്നുതന്നാൽ, അതിലുള്ള ജനമെല്ലാം നിനക്കു നിർബന്ധിതവേല ചെയ്യേണ്ടവരായിത്തീർന്ന്[b] നിന്നെ സേവിക്കണം.
  to: അതു നിന്നോടു സമാധാനത്തോടെ പ്രതികരിച്ച്[a] നിനക്കു തുറന്നുതന്നാൽ, അതിലുള്ള ജനമെല്ലാം നിനക്കു നിർബന്ധിതവേലയ്ക്കു വിധേയരായി[b] നിന്നെ സേവിക്കും.
  rationale: The revision preserves the Hebrew’s personified city, peaceful response, opening, and consequent subjection of all inhabitants to mas and service. It changes the Malayalam final clause to a straightforward future and renders the status denoted by לָמַס in a more idiomatic way. The alternative sense of ‘terms of peace’ and the lexical range of מַס remain available in anchored footnotes.
