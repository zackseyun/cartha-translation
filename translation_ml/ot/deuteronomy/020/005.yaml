base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: ml
  text: 'അപ്പോൾ ഉദ്യോഗസ്ഥർ ജനത്തോട് ഇങ്ങനെ പറയണം: “പുതിയൊരു വീടു പണിതിട്ടും അത് ഉദ്ഘാടനം ചെയ്തിട്ടില്ലാത്ത പുരുഷൻ ആരാണ്? അവൻ പോയി തന്റെ വീട്ടിലേക്കു മടങ്ങട്ടെ; യുദ്ധത്തിൽ മരിക്കുകയും മറ്റൊരു പുരുഷൻ അത് ഉദ്ഘാടനം ചെയ്യുകയും ചെയ്യാതിരിക്കാൻ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിന്റെ ഔപചാരിക ഉപയോഗം ആരംഭിക്കുക.’ പുതിയ വീടിന്റെ ഉപയോഗം ഔപചാരികമായി തുടങ്ങുന്നതിനെയാണ് എബ്രായക്രിയ സൂചിപ്പിക്കുന്നത്; അതിൽ സമർപ്പണത്തിന്റെ ആശയവും ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: ഉദ്യോഗസ്ഥർ
  rationale: നിയമപരവും സൈനികവുമായ ഈ സന്ദർഭത്തിലെ നിയമിത ചുമതലക്കാരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഉദ്യോഗസ്ഥർ’ എന്നത് പൊതുവായ എഴുത്തുകാരെന്ന അർഥത്തിലേക്ക് ചുരുക്കാതെ അവരുടെ ഔദ്യോഗിക സ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യുദ്ധത്തിനായി കൂടിയിരിക്കുന്ന ജനവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ‘സൈന്യം’ എന്ന് അമിതമായി നിർവചിക്കുന്നില്ല.
- source_word: מִי הָאִישׁ
  choice: പുരുഷൻ ആരാണ്?
  rationale: യുദ്ധസേവനത്തിന് യോഗ്യനായ വ്യക്തിയെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ മൂലപാഠത്തിലെ ഏകവചനവും പുരുഷലിംഗവും നിലനിർത്തുന്നു.
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: പുതിയൊരു വീടു പണിതിട്ട്
  rationale: בַּיִת എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘വീട്’ നിലനിർത്തുകയും മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וְלֹא חֲנָכוֹ
  choice: അത് ഉദ്ഘാടനം ചെയ്തിട്ടില്ലാത്ത
  rationale: חנך ഇവിടെ പുതിയ വീടിന്റെ ഉപയോഗം ഔപചാരികമായി ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉദ്ഘാടനം’ സമർപ്പണത്തിന്റെയും ഉപയോഗാരംഭത്തിന്റെയും അർഥസാധ്യത തുറന്നുവെക്കുന്നു; വെറും ‘താമസം തുടങ്ങിയിട്ടില്ല’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: അവൻ പോയി തന്റെ വീട്ടിലേക്കു മടങ്ങട്ടെ
  rationale: നിയമപരമായ ഈ നിർദേശത്തിലെ ജസ്സീവ് ഭാവം ‘മടങ്ങട്ടെ’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ ... ചെയ്തേക്കാം
  rationale: פֶּן സൂചിപ്പിക്കുന്ന ഒഴിവാക്കേണ്ട സാധ്യത മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; പഴക്കം തോന്നുന്ന അത്യന്തം ഔപചാരിക ഘടന ഒഴിവാക്കുന്നു.
- source_word: יָמוּת בַּמִּלְחָמָה
  choice: അവൻ യുദ്ധത്തിൽ മരിക്കുകയും
  rationale: നിർദ്ദിഷ്ടമായ യുദ്ധസാഹചര്യവും ഏകവചന കർത്താവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְאִישׁ אַחֵר
  choice: മറ്റൊരു പുരുഷൻ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ ഏകവചനവും പുരുഷലിംഗവും നിലനിർത്തുന്നു.
- source_word: יַחְנְכֶנּוּ
  choice: അത് ഉദ്ഘാടനം ചെയ്യുകയും
  rationale: വാക്യത്തിൽ ആവർത്തിക്കുന്ന חנך എന്ന ക്രിയയ്ക്ക് ഒരേ മലയാളപദം ഉപയോഗിച്ച് മൂലപാഠത്തിലെ പദാവർത്തനം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി സ്വീകരിച്ചു. ‘ഉദ്ഘാടനം’ എന്ന പദം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും മൂലപദത്തിലെ ഉപയോഗാരംഭം/സമർപ്പണം എന്ന അർഥവ്യാപ്തി ഭാഗികമായി നിലനിർത്തുന്നതുമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ആവർത്തിച്ച ക്രിയയുടെ അവസാന പ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
