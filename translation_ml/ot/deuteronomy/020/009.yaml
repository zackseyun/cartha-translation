source:
  edition: WLC
  text: וְ/הָיָ֛ה כְּ/כַלֹּ֥ת הַ/שֹּׁטְרִ֖ים לְ/דַבֵּ֣ר אֶל הָ/עָ֑ם וּ/פָֽקְד֛וּ שָׂרֵ֥י צְבָא֖וֹת בְּ/רֹ֥אשׁ הָ/עָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/009.yaml
  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
translation:
  language: ml
  text: ഉദ്യോഗസ്ഥർ ജനത്തോടു സംസാരിച്ചു തീർന്നശേഷം, അവർ ജനത്തിന്റെ തലപ്പത്ത് സൈന്യാധിപന്മാരെ നിയമിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവർ ജനത്തിന്റെ തലപ്പത്ത് സൈന്യാധിപന്മാരെ അണിനിരത്തണം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് നിയമിക്കുക, അണിനിരത്തുക, അല്ലെങ്കിൽ ചുമതലപ്പെടുത്തുക എന്നീ അർഥങ്ങൾ വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: തീർന്നശേഷം
  rationale: וְהָיָה എന്ന സൂത്രവാക്യവും כְּ ചേർന്ന infinitive construct-ഉം ഇവിടെ അടുത്ത പ്രവൃത്തി ആരംഭിക്കുന്നതിന് മുമ്പുള്ള പൂർത്തീകരണകാലം സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘തീർന്നശേഷം’ അതു വ്യക്തമായി നൽകുന്നു.
- source_word: הַשֹּׁטְרִים
  choice: ഉദ്യോഗസ്ഥർ
  rationale: ആവർത്തനപുസ്തകത്തിലെ സൈനിക-പൗരസാഹചര്യത്തിൽ ജനത്തെ അറിയിക്കുകയും ക്രമീകരിക്കുകയും ചെയ്യുന്ന നിയുക്ത അധികാരികളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘എഴുത്തുകാർ’ എന്നത് അനാവശ്യമായി അർഥം ചുരുക്കും.
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: ജനത്തോടു സംസാരിച്ചു
  rationale: עָם എന്നത് നേരിട്ട് ‘ജനം’ എന്നാണ്; സൈനികസന്ദർഭം ഉണ്ടായാലും ‘സൈനികരോട്’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർണ്ണയിക്കുന്നതാകും.
- source_word: וּפָקְדוּ
  choice: അവർ ... നിയമിക്കണം
  rationale: פקד എന്ന ക്രിയയ്ക്ക് നിയമിക്കുക, അണിനിരത്തുക, ചുമതലപ്പെടുത്തുക തുടങ്ങിയ അർഥങ്ങളുണ്ട്. നേതൃസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന തുടർന്നുള്ള പ്രയോഗത്തോടൊപ്പം ‘നിയമിക്കുക’ സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שָׂרֵי צְבָאוֹת
  choice: സൈന്യാധിപന്മാരെ
  rationale: שָׂרֵי നേതാക്കളെയോ അധിപന്മാരെയോ, צְבָאוֹת സൈനികസേനകളെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘സൈന്യാധിപന്മാർ’ ഈ സൈനികനേതൃത്വം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּרֹאשׁ הָעָם
  choice: ജനത്തിന്റെ മുന്നിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘ജനത്തിന്റെ തലയിൽ/മുൻനിരയിൽ’ എന്ന ഈ പ്രയോഗം നേതൃത്വസ്ഥാനത്തെയോ മുൻനിരയെയോ സൂചിപ്പിക്കാം. ‘ജനത്തിന്റെ മുന്നിൽ’ എബ്രായ ദൃശ്യബിംബം നിലനിർത്തുകയും മലയാളത്തിൽ ഗ്രാഹ്യമാകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: פקד എന്ന ക്രിയയുടെ പ്രവർത്തനാർഥം
  choice: നിയമിക്കണം
  alternative: സൈന്യാധിപന്മാരെ ജനത്തിനുമേൽ ചുമതലപ്പെടുത്തണം / അണിനിരത്തി കണക്കെടുക്കണം
  rationale: പദത്തിന്റെ വിശാലമായ അർഥപരിധി മൂലം നിയമനവും സൈനികസംഘടനയും രണ്ടും സന്ദർഭത്തിൽ സാധ്യമാണ്. പ്രധാനവാചകത്തിൽ ഏറ്റവും സാദ്ധ്യമായ നേതൃത്വനിയമനം സ്വീകരിച്ചെങ്കിലും ബദൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ജനത്തിന്റെ മുന്നിൽ’ എന്നത് മൂലപാഠത്തിലെ സ്ഥാനദൃശ്യബിംബം നിലനിർത്തുന്നു; ‘നിയമിക്കണം’ കല്പനാത്മക ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
