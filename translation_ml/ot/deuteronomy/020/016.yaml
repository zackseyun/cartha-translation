  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֗ק מֵ/עָרֵ֤י הָֽ/עַמִּים֙ הָ/אֵ֔לֶּה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה לֹ֥א תְחַיֶּ֖ה כָּל נְשָׁמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/016.yaml
  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങൾക്കു അവകാശമായി നൽകുന്ന ഈ ജനതകളുടെ പട്ടണങ്ങളിൽ നിന്നുള്ള ശ്വസിക്കുന്ന യാതൊന്നിനെയും ജീവനോടെ വിടരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ജീവനുള്ള യാതൊന്നിനെയും.” എബ്രായത്തിൽ അക്ഷരാർഥം: “ശ്വസിക്കുന്ന എല്ലാം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ ദൂരെയുള്ള പട്ടണങ്ങളെക്കുറിച്ചുള്ള നിർദേശങ്ങളിൽനിന്നുള്ള വ്യത്യാസവും ഒഴിവും ഇവിടെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ വിരുദ്ധബന്ധകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  choice: ഈ ജനതകളുടെ പട്ടണങ്ങളിൽ
  rationale: מִן എന്ന മുൻപ്രത്യയത്തിന്റെ പ്രയോഗം മലയാളത്തിൽ സ്ഥലസൂചകമായ ‘പട്ടണങ്ങളിൽ’ എന്നു നൽകിയാൽ സ്വാഭാവികമാണ്; עַמִּים എന്നത് ആധുനിക രാഷ്ട്രങ്ങളെക്കാൾ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനതകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകി.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ נַחֲלָה
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങൾക്ക് അവകാശമായി നൽകുന്ന
  rationale: נֹתֵן എന്ന വർത്തമാന കൃതന്തത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം ‘നൽകുന്ന’ എന്നതിലൂടെ നിലനിർത്തി; נַחֲלָהയുടെ ഉടമ്പടി-ഭൂമി ആശയം ‘അവകാശം’ എന്ന പദത്തിൽ സംരക്ഷിച്ചു.
- source_word: לֹא תְחַיֶּה
  choice: ശേഷിപ്പിക്കരുത്
  rationale: חיהയുടെ പീയേൽ രൂപത്തിലുള്ള ‘ജീവിക്കാൻ അനുവദിക്കുക/ജീവനോടെ നിലനിർത്തുക’ എന്ന കാരണാർഥം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל נְשָׁמָה
  choice: ജീവനുള്ള ഒന്നിനെയും
  rationale: അക്ഷരാർഥത്തിലെ ‘ഓരോ ശ്വാസമുള്ളതും’ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; മൂലഭാഷയിലെ ശ്വാസത്തിന്റെ ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: എബ്രായപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് പദവിയാക്കി മാറ്റാതെയും ‘Jehovah’ രൂപം സ്വീകരിക്കാതെയും ‘Yahweh’ എന്നതിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: נַחֲלָהയിലെ ഉടമ്പടി-ഭൂമി പദാവലി
  choice: അവകാശമായി
  alternative: സ്വത്തായി / കൈവശമായി
  rationale: വെറും ഉടമസ്ഥതയായി പരിമിതപ്പെടുത്താതെ, ദൈവം നൽകുന്ന ഭൂമിയുടെ അവകാശസ്വഭാവവും ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- issue: כָּל נְשָׁמָהയുടെ പരിധി
  choice: ജീവനുള്ള ഒന്നിനെയും
  alternative: ശ്വസിക്കുന്ന ഒന്നിനെയും / ഒരാളെയും
  rationale: മൂലപദത്തിന്റെ വിശാലവും ദൃശ്യവുമായ ഭാഷയെ ‘ഒരാളെയും’ എന്നു ചുരുക്കാതെ സംരക്ഷിച്ചു; ‘ശ്വസിക്കുന്ന’ എന്ന കൂടുതൽ അക്ഷരാർഥ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യുദ്ധസന്ദർഭത്തിലെ കഠിനമായ കല്പനയുടെ ശക്തി മയപ്പെടുത്താതെയും, മൂലത്തിലെ כָּל נְשָׁמָהയുടെ പരിധി വ്യാഖ്യാനിച്ച് ചുരുക്കാതെയും സൂക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചകം അത് വിശദീകരിക്കുന്ന ‘ജീവനുള്ള ഒന്നിനെയും’ എന്ന ആശയത്തോടനുബന്ധിച്ച് വാക്യാവസാനത്തിൽ നൽകിയിരിക്കുന്നു.
