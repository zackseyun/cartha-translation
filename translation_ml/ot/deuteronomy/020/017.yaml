  to: പകരം, നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങളോടു കല്പിച്ചതുപോലെ, ഹിത്യർ, അമോര്യർ, കനാന്യർ, പെരിസ്യർ, ഹിവ്യർ, യെബൂസ്യർ എന്നിവരെ പൂർണമായ നാശത്തിനായി സമർപ്പിക്കണം.[a]
