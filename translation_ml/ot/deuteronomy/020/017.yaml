    rationale: അർത്ഥം ശരിയായിരുന്നാലും ‘പൂർണമായ നാശത്തിനായി സമർപ്പിക്കണം’ എന്നത് മലയാളത്തിൽ കൂടുതൽ മിനുസമുള്ളതും ലക്ഷ്യസൂചന വ്യക്തമായതുമാണ്.
