  source_fidelity: ഹീബ്രായത്തിലെ כִּי യുടെ സന്ദർഭാനുസൃതമായ വിരുദ്ധഭാവം ‘പകരം’ എന്നതിൽ ശരിയായി പ്രതിഫലിക്കുന്നു. הַחֲרֵם תַּחֲרִימֵם എന്ന infinitive absolute + finite-verb പ്രയോഗത്തിന്റെ തീവ്രതയും חרם എന്ന പ്രത്യേക ‘നാശത്തിനായി സമർപ്പിക്കൽ/നിരോധനം’ എന്ന ആശയവും മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും നിലനിൽക്കുന്നു. ആറു ജനവിഭാഗങ്ങളും അവയുടെ ക്രമവും, ‘യഹ്‌വെ നിങ്ങളുടെ ദൈവം,’ ‘കല്പിച്ചതുപോലെ’ എന്നിവയും വിശ്വസ്തമാണ്.
  naturalness: നിലവിലെ വാചകം ഗ്രഹിക്കാവുന്നതാണ്; എന്നാൽ ദീർഘമായ ഇടച്ചേർക്കൽ കാരണം മുഖ്യക്രിയ ഏറെ വൈകുന്നു. ‘പൂർണമായ നാശത്തിനായി സമർപ്പിക്കണം’ എന്ന പ്രയോഗം ‘പൂർണമായി നാശത്തിന് അർപ്പിക്കണം’ എന്നതിനെക്കാൾ ആധുനിക മലയാളത്തിൽ അല്പം സുഗമമാണ്. അടിക്കുറിപ്പ്-ചിഹ്നം വിശദീകരിക്കപ്പെടുന്ന ക്രിയാപ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
  terminology: യഹ്‌വെ, ഹിത്യർ, അമോര്യർ, കനാന്യർ, പെരിസ്യർ, ഹിവ്യർ, യെബൂസ്യർ എന്നീ രൂപങ്ങൾ സ്ഥിരതയുള്ളതും അനുയോജ്യവുമാണ്. ‘നിരോധനത്തിനു വിധേയരാക്കണം’ എന്ന അടിക്കുറിപ്പുരൂപം חרם-ന്റെ സാങ്കേതിക അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു; മുഖ്യവാചകത്തിലെ ‘നാശത്തിനായി സമർപ്പിക്കണം’ അതിന്റെ സമ്പൂർണനാശഭാവം സംരക്ഷിക്കുന്നു.
