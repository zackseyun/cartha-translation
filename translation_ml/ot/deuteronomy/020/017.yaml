source:
  edition: WLC
  text: כִּֽי הַחֲרֵ֣ם תַּחֲרִימֵ֗/ם הַ/חִתִּ֤י וְ/הָ/אֱמֹרִי֙ הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: ml
  text: പകരം, നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങളോടു കല്പിച്ചതുപോലെ, ഹിത്യർ, അമോര്യർ, കനാന്യർ, പെരിസ്യർ, ഹിവ്യർ, യെബൂസ്യർ എന്നിവരെ പൂർണമായ നാശത്തിനായി സമർപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രായത്തിൽ: “അവരെ തീർച്ചയായും നിരോധനത്തിനു വിധേയരാക്കണം”; ഈ ക്രിയ അവരെ പൂർണമായ നാശത്തിനായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: പകരം
  rationale: മുൻവാക്യത്തിൽ ദൂരെയുള്ള പട്ടണങ്ങളോടു കാണിക്കേണ്ട സമീപനത്തിന് വിപരീതമായി ഇവിടെ കനാൻജനതകളെക്കുറിച്ചുള്ള കല്പന വരുന്നതിനാൽ സന്ദർഭത്തിലെ വിരുദ്ധഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: നിങ്ങൾ പൂർണമായി നാശത്തിന് അർപ്പിക്കണം
  rationale: ക്രിയയുടെ infinitive absolute-ഉം finite രൂപവും ചേർന്നത് കല്പനയുടെ സമ്പൂർണത ഊന്നിപ്പറയുന്നു. חרם സാധാരണ കൊലയെക്കാൾ കൂടുതലായി ദൈവിക കല്പനപ്രകാരം പൂർണനാശത്തിനായി വേർതിരിച്ചർപ്പിക്കുന്ന നിരോധനഭാവം വഹിക്കുന്നു.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: ഹിത്യർ, അമോര്യർ, കനാന്യർ, പെരിസ്യർ, ഹിവ്യർ, യെബൂസ്യർ
  rationale: ഏകവചനത്തിലുള്ള ഹീബ്രായ ജനവിഭാഗനാമങ്ങൾ കൂട്ടായ അർത്ഥത്തിൽ വരുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന ജനനാമങ്ങളായി നൽകി.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: നിങ്ങളോടു കല്പിച്ചതുപോലെ
  rationale: മുമ്പ് നൽകിയ ദൈവിക കല്പനയോടുള്ള യോജിപ്പ് ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ
  rationale: ദൈവനാമം ഒരു പദവികൊണ്ട് മാറ്റിസ്ഥാപിക്കാതെ യഹ്‌വെ എന്നു നിലനിർത്തുകയും ഉടമ്പടിസംബന്ധമായ ‘നിങ്ങളുടെ ദൈവം’ എന്ന പ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യുദ്ധകല്പനയിലെ חרם എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പൂർണമായി നാശത്തിന് അർപ്പിക്കണം
  alternative: പൂർണമായി നശിപ്പിക്കണം; നിരോധനത്തിന് കീഴിലാക്കണം
  rationale: മൂലപദത്തിലെ സമ്പൂർണനാശവും ദൈവത്തിനായി വേർതിരിച്ചുവെക്കുന്ന നിരോധനത്തിന്റെ നിയമ-ആരാധനാത്മക സൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു; അതിനെ സാധാരണ നശിപ്പിക്കൽ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. חרם എന്ന പദത്തിന്റെ പ്രത്യേക അർത്ഥം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു; ജനവിഭാഗനാമങ്ങൾക്ക് പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചു.
