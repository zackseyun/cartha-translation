id: DEU.20.12
reference: Deuteronomy 20:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם לֹ֤א תַשְׁלִים֙ עִמָּ֔/ךְ וְ/עָשְׂתָ֥ה עִמְּ/ךָ֖ מִלְחָמָ֑ה וְ/צַרְתָּ֖ עָלֶֽי/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/012.yaml
  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: ml
  text: എന്നാൽ ആ നഗരം നിന്നോടു സമാധാനം ചെയ്യാതെ നിന്നെതിരെ യുദ്ധം ചെയ്താൽ, നീ അതിനെ ഉപരോധിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: എന്നാൽ ... ചെയ്യാതെ
  rationale: മുൻവാക്യത്തിലെ സമാധാനപരമായ ഫലത്തോടുള്ള വ്യത്യാസം ‘എന്നാൽ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; നിഷേധം ഉപാധിവാക്യത്തിൽ ‘ചെയ്യാതെ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: תַשְׁלִים עִמָּךְ
  choice: നിന്നോടു സമാധാനം ചെയ്യുക
  rationale: ശׁלם എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ സമാധാനബന്ധത്തിൽ പ്രവേശിക്കുകയോ സമാധാനം ഉറപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സമാധാനം ചെയ്യുക’ സജീവഭാവവും ഹീബ്രായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: നിന്നെതിരെ യുദ്ധം ചെയ്യുക
  rationale: עשה מלחמה എന്നത് ‘യുദ്ധം ചെയ്യുക/നടത്തുക’ എന്ന ഹീബ്രായ പ്രയോഗമാണ്. עִם എന്ന പദത്തിന് ഇവിടെ സന്ദർഭാനുസൃതമായ വൈരാർഥം ഉള്ളതിനാൽ ‘നിന്നെതിരെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: നീ അതിനെ ഉപരോധിക്കണം
  rationale: צור എന്ന ക്രിയയ്ക്ക് ഇവിടെ നഗരത്തെ വളഞ്ഞ് ഉപരോധിക്കുക എന്ന അർഥമാണ്. നിയമനിർദേശത്തിന്റെ ബാധ്യത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ഉപരോധിക്കണം’ ഉപയോഗിച്ചു; עַל ക്രിയയുടെ കർമബന്ധത്തിൽ ഉൾക്കൊള്ളുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഹീബ്രായ പാഠത്തിലെ സ്ത്രീലിംഗ ഏകവചന സൂചനയുടെ മുൻപദം സന്ദർഭത്തിൽ ‘നഗരം’ ആയതിനാൽ വ്യക്തതയ്ക്കായി ‘ആ നഗരം’ എന്നു തുറന്നുപറഞ്ഞു. വാക്യത്തിന്റെ നിബന്ധനാത്മകവും നിയമനിർദേശപരവുമായ ഭാവം നിലനിർത്തി.
