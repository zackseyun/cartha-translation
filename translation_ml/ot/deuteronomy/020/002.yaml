source:
  edition: WLC
  text: וְ/הָיָ֕ה כְּ/קָֽרָבְ/כֶ֖ם אֶל הַ/מִּלְחָמָ֑ה וְ/נִגַּ֥שׁ הַ/כֹּהֵ֖ן וְ/דִבֶּ֥ר אֶל הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/002.yaml
  text: And when you draw near to the battle[a], the priest shall come forward and speak to the people[b],
translation:
  language: ml
  text: നിങ്ങൾ യുദ്ധത്തിന്[a] അടുത്തുചെല്ലുമ്പോൾ, പുരോഹിതൻ മുന്നോട്ടുവന്ന് ജനത്തോടു സംസാരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പോരാട്ടത്തിന്.’ എബ്രായത്തിലെ מִלְחָמָה എന്ന പദം പൊതുവായ യുദ്ധത്തെയോ ഒരു പ്രത്യേക പോരാട്ടത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ സന്ദർഭം പോരാട്ടത്തോടുള്ള സമീപനമാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ജനം’ എന്നത് സന്ദർഭത്തിൽ ഒരുമിച്ചുകൂടിയ ഇസ്രായേൽ പോരാളികളെയാണ് സൂചിപ്പിക്കുന്നത്. എന്നാൽ എബ്രായപാഠം ‘സൈന്യം’ എന്നതുപോലുള്ള കൂടുതൽ പരിമിതമായ പദത്തിനുപകരം ‘ജനം’ എന്ന വിശാലപദമാണ് ഉപയോഗിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כְּקָרָבְכֶם
  choice: നിങ്ങൾ ... അടുത്തുചെല്ലുമ്പോൾ
  rationale: וְהָיָה എന്ന ഘടനയും ക്രിയാനാമരൂപമായ כְּקָרָבְכֶם-ഉം ചേർന്ന് ഭാവിയിലെ ഒരു സന്ദർഭത്തെ കാലസൂചക ഉപവാക്യമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അടുത്തുചെല്ലുമ്പോൾ’ എന്നു നൽകി.
- source_word: אֶל הַמִּלְחָמָה
  choice: യുദ്ധത്തിന്
  rationale: מִלְחָמָה എന്ന പദത്തിന് പൊതുവായ യുദ്ധത്തെയും പ്രത്യേക പോരാട്ടത്തെയും സൂചിപ്പിക്കാം. ഇവിടെ ഏറ്റുമുട്ടലിനോട് അടുത്തുചെല്ലുന്ന ഉടൻസന്ദർഭം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളപ്രയോഗമായി ‘യുദ്ധത്തിന്’ തെരഞ്ഞെടുത്തു; വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְנִגַּשׁ
  choice: മുന്നോട്ടുവന്ന്
  rationale: נגשׁ എന്നത് ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്നാണ്. ജനത്തെ അഭിസംബോധന ചെയ്യാനായി പുരോഹിതൻ മുന്നോട്ടുവരുന്ന ചലനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: നിശ്ചിത ഏകവചന നാമത്തിന്റെ നേരിട്ടുള്ള സമാനപദം; മൂലപാഠത്തിലില്ലാത്ത അധികവിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: וְדִבֶּר אֶל הָעָם
  choice: ജനത്തോടു സംസാരിക്കണം
  rationale: דבר എന്ന ക്രിയയുടെ അടിസ്ഥാന അർത്ഥമായ ‘സംസാരിക്കുക’ നിലനിർത്തുന്നു. הָעָם എന്ന വിശാലപദത്തെ സൈനികർ എന്നാക്കി ചുരുക്കാതെ ‘ജനം’ എന്നു പരിഭാഷപ്പെടുത്തി.
