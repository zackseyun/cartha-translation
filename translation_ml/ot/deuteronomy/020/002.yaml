translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ കാലസൂചക ഘടന സ്വാഭാവികമായി നൽകി; ‘ജനം’ എന്ന വിശാലപദവും מִלְחָמָה എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
