source:
  edition: WLC
  text: רַ֞ק עֵ֣ץ אֲשֶׁר תֵּדַ֗ע כִּֽי לֹא עֵ֤ץ מַאֲכָל֙ ה֔וּא אֹת֥/וֹ תַשְׁחִ֖ית וְ/כָרָ֑תָּ וּ/בָנִ֣יתָ מָצ֗וֹר עַל הָ/עִיר֙ אֲשֶׁר הִ֨וא עֹשָׂ֧ה עִמְּ/ךָ֛ מִלְחָמָ֖ה עַ֥ד רִדְתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: ml
  text: എന്നാൽ, ഭക്ഷ്യഫലം തരുന്ന വൃക്ഷമല്ലെന്ന് നിനക്കറിയാവുന്ന വൃക്ഷങ്ങൾ മാത്രം നീ നശിപ്പിച്ചു വെട്ടിക്കളയാം; നിന്നോടു യുദ്ധം ചെയ്യുന്ന നഗരത്തിനെതിരെ, നീ അതിനെ വീഴ്ത്തുന്നതുവരെ[b] ഉപരോധനിർമിതികൾ[a] പണിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഉപരോധകോട്ടപ്പണികൾ’ അല്ലെങ്കിൽ ‘ഉപരോധമേട്.’ എബ്രായത്തിലെ מָצוֹר ഒരു പ്രത്യേക നിർമിതിയെക്കാൾ വ്യാപകമായി ഉപരോധത്തിനുള്ള നിർമിതികളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നീ അതിനെ താഴെയിറക്കുന്നതുവരെ.’ എബ്രായത്തിൽ നഗരം പരാജയപ്പെടുന്നതിനെ ‘താഴെയിറക്കുക/വീഴ്ത്തുക’ എന്ന രൂപകത്തിലൂടെ, സജീവമായ ക്രിയാരൂപത്തിൽ, പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ ... മാത്രം
  rationale: മുൻവാക്യത്തിലെ ഫലവൃക്ഷങ്ങൾ നശിപ്പിക്കരുതെന്ന വിലക്കിന് ഇവിടെ ഒരു പരിമിതമായ ഒഴിവ് നൽകുന്നു; ‘എന്നാൽ ... മാത്രം’ നിയന്ത്രണവും വൈരുധ്യവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עֵץ ... עֵץ מַאֲכָל
  choice: വൃക്ഷങ്ങൾ ... ഭക്ഷണത്തിനുള്ള വൃക്ഷം
  rationale: സന്ദർഭം ജീവനുള്ള വൃക്ഷങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഭക്ഷണത്തിനുള്ള വൃക്ഷം’ എന്നത് ഭക്ഷ്യഫലം നൽകുന്ന വൃക്ഷം എന്ന എബ്രായ ആശയം അനാവശ്യമായി ചുരുക്കാതെ നൽകുന്നു.
- source_word: אֲשֶׁר תֵּדַע כִּי לֹא ... הוּא
  choice: വൃക്ഷമല്ലെന്ന് നിനക്കറിയാവുന്ന
  rationale: വൃക്ഷത്തിന്റെ ഭക്ഷ്യയോഗ്യതയെക്കുറിച്ച് ഉറപ്പായി അറിയുന്നതാണ് വ്യവസ്ഥ; മലയാളത്തിൽ ഈ ബന്ധവാക്യരൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֹתוֹ תַשְׁחִית וְכָרָתָּ
  choice: നീ നശിപ്പിച്ചു വെട്ടിക്കളയാം
  rationale: ഏകവചന സർവനാമം വൃക്ഷവർഗത്തെ വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു. നിയമനിർദേശത്തിലെ അനുവദനീയത ‘കളയാം’ വഴി പ്രകടമാക്കുന്നു; שׁחת, כרת എന്നീ ക്രിയകളുടെ നശിപ്പിക്കൽ, വെട്ടിവീഴ്ത്തൽ എന്നീ അർഥങ്ങളും നിലനിർത്തുന്നു.
- source_word: וּבָנִיתָ מָצוֹר
  choice: ഉപരോധനിർമിതികൾ പണിയാം
  rationale: מָצוֹר ഒരു പ്രത്യേക ഉപകരണം മാത്രമല്ല, ഉപരോധത്തിനുള്ള നിർമിതികളെയോ കോട്ടപ്പണികളെയോ വ്യാപകമായി സൂചിപ്പിക്കാം; അതിനാൽ ബഹുവചനമായ പൊതുപദം തിരഞ്ഞെടുത്തു.
- source_word: עַל הָעִיר
  choice: നഗരത്തിനെതിരെ
  rationale: עַל എന്ന പദത്തിന്റെ സൈനികസന്ദർഭത്തിലെ വൈരപ്രവർത്തനബന്ധം ‘എതിരെ’ വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: നിന്നോടു യുദ്ധം ചെയ്യുന്ന
  rationale: ‘യുദ്ധം ചെയ്യുക’ എന്ന എബ്രായ പ്രയോഗവും വർത്തമാന കൃതന്തത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַד רִדְתָּהּ
  choice: നഗരം വീഴുന്നതുവരെ
  rationale: רדתהּ എന്ന രൂപം നഗരത്തിന്റെ ഇറക്കം/വീഴ്ചയെ സൂചിപ്പിക്കുന്നു. ‘വീഴുക’ നഗരത്തിന്റെ സൈനികപരാജയം അറിയിക്കുകയും മൂലത്തിലെ രൂപകഭാഷ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
