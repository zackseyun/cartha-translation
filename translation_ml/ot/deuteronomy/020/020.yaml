translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി ഉപയോഗിച്ചു. സാങ്കേതിക പദമായ ‘ഉപരോധനിർമിതികൾ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായി നിലനിർത്തി, അതിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് നേരിട്ട് ചേർത്തു.
