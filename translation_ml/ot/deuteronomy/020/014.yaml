reference: Deuteronomy 20:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֣ק הַ֠/נָּשִׁים וְ/הַ/טַּ֨ף וְ/הַ/בְּהֵמָ֜ה וְ/כֹל֩ אֲשֶׁ֨ר יִהְיֶ֥ה בָ/עִ֛יר כָּל שְׁלָלָ֖/הּ תָּבֹ֣ז לָ֑/ךְ וְ/אָֽכַלְתָּ֙ אֶת שְׁלַ֣ל אֹיְבֶ֔י/ךָ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: ml
  text: എന്നാൽ സ്ത്രീകളെയും[a] കൊച്ചുകുട്ടികളെയും കന്നുകാലികളെയും നഗരത്തിലുള്ള സകലത്തെയും—അതിലെ കൊള്ളമുതൽ മുഴുവനും—നിനക്കുവേണ്ടി കൊള്ളയായി എടുക്കാം; നിന്റെ ദൈവമായ യാഹ്‌വേ നിനക്കു തന്ന നിന്റെ ശത്രുക്കളുടെ കൊള്ളമുതൽ നീ ഉപയോഗിച്ചുകൊള്ളാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്റെ ശത്രുക്കളുടെ കൊള്ളമുതൽ നീ തിന്നാം” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയയുടെ അക്ഷരാർഥം “തിന്നുക” എന്നാണ്; എടുത്ത കൊള്ളമുതൽ ഉപയോഗിക്കുകയോ അതിൽനിന്ന് പ്രയോജനം നേടുകയോ ചെയ്യുക എന്ന വിപുലാർഥത്തിലും അത് വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ കല്പനയ്ക്ക് ഇവിടെ വരുന്ന ഒഴിവാക്കൽ/വ്യത്യാസം സ്വാഭാവികമായ മലയാളത്തിൽ അടയാളപ്പെടുത്തുന്നു; തുടർന്നുള്ള പട്ടികയാണ് നിയന്ത്രിത പരിധി വ്യക്തമാക്കുന്നത്.
- source_word: הַנָּשִׁים
  choice: സ്ത്രീകളെ
  rationale: സ്ത്രീകളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്ന ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: הַטַּף
  choice: കൊച്ചുകുട്ടികളെ
  rationale: טַף സാധാരണയായി ചെറിയ കുട്ടികളെയോ ആശ്രിതരായ കുഞ്ഞുങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ പ്രായസൂചന നിലനിർത്തുന്നു.
- source_word: הַבְּהֵמָה
  choice: കന്നുകാലികളെ
  rationale: യുദ്ധക്കൊള്ളയുടെ പശ്ചാത്തലത്തിൽ വളർത്തുമൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה בָעִיר
  choice: നഗരത്തിലുള്ള സകലത്തെയും
  rationale: നഗരത്തിൽ ശേഷിക്കുന്ന എല്ലാറ്റിനെയും ഉൾക്കൊള്ളുന്ന സമഗ്രമായ പ്രയോഗം.
- source_word: כָּל שְׁלָלָהּ
  choice: അതിലെ കൊള്ളമുതൽ മുഴുവനും
  rationale: שָׁלָל എന്ന യുദ്ധത്തിൽ പിടിച്ചെടുത്ത വസ്തുക്കളുടെ അർഥവും כָּל എന്ന സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: תָּבֹז לָךְ
  choice: നിനക്കായി കൊള്ളയടിച്ചെടുക്കാം
  rationale: നിയമപരമായ അനുമതിയുടെ ഭാവം മലയാളത്തിലെ ‘എടുക്കാം’ കൊണ്ട് വ്യക്തമാക്കുന്നു; בָּזַז എന്ന ക്രിയയുടെ കൊള്ളയടിക്കൽ അർഥവും സൂക്ഷിക്കുന്നു.
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: നിന്റെ ശത്രുക്കളുടെ കൊള്ളമുതൽ നീ അനുഭവിക്കാം
  rationale: אָכַל എന്നതിന്റെ അക്ഷരാർഥം ‘തിന്നുക’ ആണെങ്കിലും, വിവിധതരം കൊള്ളമുതൽ ഉപയോഗിച്ച് പ്രയോജനം നേടുക എന്ന വിപുലപ്രയോഗം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമത്തെ പദവിയായ ‘കർത്താവ്’ എന്നാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: നിന്റെ ദൈവമായ യഹോവ നിനക്കു തന്ന
  rationale: ദൈവം നൽകിയെന്ന പൂർത്തിയായ പ്രവൃത്തിയും ഉടമ്പടിസംബന്ധമായ ‘നിന്റെ ദൈവം’ എന്ന അഭിസംബോധനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുകയും സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- issue: നിയമനിർദേശത്തിലെ രണ്ടാംപുരുഷ ക്രിയകളുടെ ഭാവം
  choice: അനുമതിസൂചകമായ ‘എടുക്കാം/അനുഭവിക്കാം’
  alternative: ‘എടുക്കണം/അനുഭവിക്കണം’ എന്ന കല്പനാഭാവം; ‘എടുക്കും’ എന്ന ഭാവികാലം
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയകൾ യുദ്ധക്കൊള്ള കൈവശപ്പെടുത്താനുള്ള അംഗീകൃത അവകാശം അറിയിക്കുന്നു; നിർബന്ധകല്പനയോ വെറും പ്രവചനമോ ആയി അതിരുകടന്ന് നിർണ്ണയിക്കുന്നില്ല.
- issue: אָכַל എന്ന ക്രിയയുടെ വിപുലപ്രയോഗം
  choice: അനുഭവിക്കാം
  alternative: തിന്നാം
  rationale: കൊള്ളമുതലിൽ ഭക്ഷണമാത്രമല്ല, മൃഗങ്ങളും മറ്റ് വസ്തുക്കളും ഉൾപ്പെടുന്നതിനാൽ ‘പ്രയോജനപ്പെടുത്തുക/ഉപയോഗിക്കുക’ എന്ന വിപുലാർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥവും മറ്റൊരു വായനയും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഏകവചന രണ്ടാംപുരുഷമായ ‘നീ/നിനക്ക്’ നിലനിർത്തിയിരിക്കുന്നു. യുദ്ധക്കൊള്ളയുടെ കഠിനമായ ഉള്ളടക്കം മയപ്പെടുത്താതെ, എന്നാൽ അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെയാണ് പരിഭാഷ.
