  text: וַ/יָּרֵ֧עוּ אֹתָ֛/נוּ הַ/מִּצְרִ֖ים וַ/יְעַנּ֑וּ/נוּ וַ/יִּתְּנ֥וּ עָלֵ֖י/נוּ עֲבֹדָ֥ה קָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/006.yaml
  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: ml
  text: ഈജിപ്തുകാർ ഞങ്ങളോടു മോശമായി പെരുമാറി[a], ഞങ്ങളെ പീഡിപ്പിച്ചു[b], ഞങ്ങളുടെമേൽ കഠിനവേല ചുമത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഞങ്ങളോടു ക്രൂരമായി പെരുമാറി.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ഞങ്ങളെ അടിച്ചമർത്തി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: ഞങ്ങളോടു ദോഷമായി പെരുമാറി
  rationale: רעע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ദോഷം ചെയ്യുക അഥവാ മോശമായി പെരുമാറുക എന്ന ആശയം നൽകുന്നു. ഈ പ്രയോഗം ക്രിയയുടെ ധാർമികവും ഹാനികരവുമായ ഭാവം നിലനിർത്തുകയും തുടർന്നുള്ള പീഡനക്രിയയിൽനിന്ന് അതിനെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַמִּצְרִים
  choice: ഈജിപ്തുകാർ
  rationale: ഈജിപ്തിലെ ജനത്തെ പീഡകസമൂഹമായി സൂചിപ്പിക്കുന്ന നിർദിഷ്ട ദേശീയനാമം സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיְעַנּוּנוּ
  choice: ഞങ്ങളെ പീഡിപ്പിച്ചു
  rationale: ענה എന്ന ധാതുവിന്റെ പീയേൽ രൂപത്തിന് പീഡിപ്പിക്കുക, കഷ്ടപ്പെടുത്തുക, അടിച്ചമർത്തുക എന്നീ അർഥസാധ്യതകളുണ്ട്. 'പീഡിപ്പിച്ചു' എന്നത് വരുത്തിയ കഷ്ടതയെ സ്വാഭാവികമായി അറിയിക്കുകയും മുൻക്രിയയുമായി ലയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: ഞങ്ങളുടെമേൽ ... ചുമത്തി
  rationale: נתן על എന്ന പ്രയോഗം ഒരാളുടെമേൽ ഒരു ഭാരം വെക്കുക അഥവാ അടിച്ചേൽപ്പിക്കുക എന്ന ആശയമാണ് നൽകുന്നത്. വേലയെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ 'ചുമത്തി' സ്വാഭാവികവും ഭാരത്തിന്റെ ദൃശ്യഭാവം സൂക്ഷിക്കുന്നതുമാണ്.
- source_word: עֲבֹדָה קָשָׁה
  choice: കഠിനവേല
  rationale: עֲבֹדָה വേല/സേവനം എന്നും קָשָׁה കഠിനമായ/കടുത്ത എന്നും അർഥമാക്കുന്നു. 'കഠിനവേല' നിർബന്ധിതവും ദുഷ്കരവുമായ അധ്വാനത്തെ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: പീഡനത്തെ വിവരിക്കുന്ന ക്രിയാശ്രേണി വേർതിരിച്ചു നിലനിർത്തൽ
  choice: '''ദോഷമായി പെരുമാറി,'' ''പീഡിപ്പിച്ചു,'' ''കഠിനവേല ചുമത്തി'' എന്നിങ്ങനെ മൂന്ന് വ്യത്യസ്ത പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു.'
  alternative: ആദ്യത്തെ രണ്ടു ക്രിയകളെയും 'അടിച്ചമർത്തി' എന്ന ഒരൊറ്റ ആശയത്തിൽ ലയിപ്പിക്കുക; അല്ലെങ്കിൽ മൂന്നു ഘടകങ്ങളിലും കൂടുതൽ ശക്തമായ അടിമത്തപദങ്ങൾ ചേർക്കുക.
  rationale: എബ്രായപാഠം ബന്ധമുള്ളതെങ്കിലും വ്യത്യസ്തമായ മൂന്നു പ്രവർത്തനങ്ങളിലൂടെ പീഡനത്തിന്റെ പുരോഗതി അവതരിപ്പിക്കുന്നു. അവയെ വേർതിരിക്കുന്നത് വാചകത്തിന്റെ വാഗ്മിത്വവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു; പാഠത്തിൽ നേരിട്ട് ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. എബ്രായത്തിലെ മൂന്നു സമാന്തര ക്രിയകളും ക്രമമായി നിലനിർത്തി. 'ഞങ്ങളുടെമേൽ' എന്ന രൂപം ഭാരമടിച്ചേൽപ്പിക്കുന്ന മൂലപ്രയോഗത്തിന്റെ ദൃശ്യഭാവം സൂക്ഷിക്കുന്നു.
