source:
  edition: WLC
  text: וַ/נִּצְעַ֕ק אֶל יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתֵ֑י/נוּ וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת קֹלֵ֔/נוּ וַ/יַּ֧רְא אֶת עָנְיֵ֛/נוּ וְ/אֶת עֲמָלֵ֖/נוּ וְ/אֶת לַחֲצֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: ml
  text: അപ്പോൾ ഞങ്ങൾ ഞങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവമായ[a] യാഹ്‌വേയോട് നിലവിളിച്ചു. യാഹ്‌വേ ഞങ്ങളുടെ സ്വരം[b] കേൾക്കുകയും ഞങ്ങളുടെ ദുരിതവും കഠിനാധ്വാനവും ഞങ്ങൾ അനുഭവിച്ച അടിച്ചമർത്തലും കാണുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം’ എന്ന പ്രയോഗം ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരുടെ ഉടമ്പടിദൈവത്തെ ഓർമിപ്പിക്കുന്നു. ‘ഞങ്ങളുടെ പൂർവികരുടെ ദൈവം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഞങ്ങളുടെ സ്വരം കേട്ടു’; ആശയപരമായി ‘ഞങ്ങളുടെ നിലവിളി കേട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: ഞങ്ങൾ ... നിലവിളിച്ചു
  rationale: צעק സഹായത്തിനായുള്ള തീവ്രമായ നിലവിളിയെ സൂചിപ്പിക്കുന്നു; വെറും വിളിക്കുകയോ പ്രാർഥിക്കുകയോ എന്നതിനെക്കാൾ സന്ദർഭത്തിലെ നിരാശയും അടിയന്തരതയും ഇത് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവികനാമമായ יהוה ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: ഞങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരുമായുള്ള ഉടമ്പടിബന്ധം ഓർമിപ്പിക്കുന്ന എബ്രായ ഘടനയുടെ ലിംഗസൂചനയും അർഥവും നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: ഞങ്ങളുടെ സ്വരം കേട്ടു
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘ഞങ്ങളുടെ സ്വരം കേട്ടു’ എന്ന പ്രയോഗം മലയാളത്തിലും സ്വാഭാവികമാണ്; അവരുടെ അപേക്ഷ ശ്രദ്ധിച്ചുവെന്ന ആശയം അതിലുണ്ട്.
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ലളിതമായ ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും ദൈവത്തിന്റെ ശ്രദ്ധാപൂർവമായ പരിഗണന എന്ന സൂചനയും അധികവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: עָנְיֵנוּ
  choice: ഞങ്ങളുടെ ദുരിതം
  rationale: עֳנִי സൂചിപ്പിക്കുന്ന കഷ്ടത, ദയനീയാവസ്ഥ എന്നീ ആശയങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: עֲמָלֵנוּ
  choice: ഞങ്ങളുടെ കഠിനാധ്വാനം
  rationale: עָמָל എന്നതിലെ അധ്വാനം, കഠിനവേല, ദുരിതകരമായ പ്രയത്നം എന്നീ അർഥങ്ങളിൽ ഈജിപ്തിലെ നിർബന്ധിതവേലയുടെ സന്ദർഭം ഇവിടെ മുൻനിൽക്കുന്നു; സമീപപദങ്ങളായ ദുരിതം, അടിച്ചമർത്തൽ എന്നിവയിൽനിന്നും വേർതിരിവും നിലനിർത്തുന്നു.
- source_word: לַחֲצֵנוּ
  choice: ഞങ്ങൾ അനുഭവിച്ച അടിച്ചമർത്തൽ
  rationale: לַחַץ സൂചിപ്പിക്കുന്ന പുറത്തുനിന്നുള്ള ഞെരുക്കവും പീഡകമായ സമ്മർദവും ‘അടിച്ചമർത്തൽ’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിനാമമായ יהוהയുടെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: אֱלֹהֵי אֲבֹתֵינוּ എന്ന ഉടമ്പടിപ്രയോഗം
  choice: ഞങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം
  alternative: ഞങ്ങളുടെ പൂർവികരുടെ ദൈവം
  rationale: ‘പിതാക്കന്മാർ’ എബ്രായത്തിലെ ലിംഗസൂചനയും ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെക്കുറിച്ചുള്ള പരമ്പരാഗത ഉടമ്പടിപ്രയോഗവും സംരക്ഷിക്കുന്നു; കൂടുതൽ ഉൾക്കൊള്ളുന്ന പൊതുപദമായി ‘പൂർവികർ’ സാധ്യമാണെന്ന് കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഞങ്ങൾ അനുഭവിച്ച അടിച്ചമർത്തൽ’ എന്ന രൂപം മലയാളത്തിൽ ഉടമസ്ഥതാപ്രയോഗം മൂലമുണ്ടാകാവുന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
