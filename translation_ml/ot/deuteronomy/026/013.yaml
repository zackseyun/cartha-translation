source:
  edition: WLC
  text: וְ/אָמַרְתָּ֡ לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בִּעַ֧רְתִּי הַ/קֹּ֣דֶשׁ מִן הַ/בַּ֗יִת וְ/גַ֨ם נְתַתִּ֤י/ו לַ/לֵּוִי֙ וְ/לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָ/אַלְמָנָ֔ה כְּ/כָל מִצְוָתְ/ךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑/נִי לֹֽא עָבַ֥רְתִּי מִ/מִּצְוֺתֶ֖י/ךָ וְ/לֹ֥א שָׁכָֽחְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: ml
  text: 'പിന്നെ നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സന്നിധിയിൽ നീ ഇങ്ങനെ പറയണം: ‘വിശുദ്ധമായി വേർതിരിച്ച ഓഹരി[a] ഞാൻ വീട്ടിൽനിന്ന് നീക്കിയിരിക്കുന്നു. നീ എന്നോടു കല്പിച്ചതെല്ലാം അനുസരിച്ച് ഞാൻ അത് ലേവ്യനും പരദേശവാസിക്കും[b] അനാഥനും[c] വിധവയ്ക്കും കൊടുത്തിരിക്കുന്നു. നിന്റെ കല്പനകൾ ഞാൻ ലംഘിച്ചിട്ടില്ല; അവ മറന്നിട്ടുമില്ല.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിശുദ്ധ ഓഹരി’ അല്ലെങ്കിൽ ‘വിശുദ്ധവസ്തു’; വിതരണം ചെയ്യാനായി സമർപ്പിച്ചു വേർതിരിച്ച ദശാംശമോ വിളവിന്റെ ഭാഗമോ ആണ് ഹീബ്രു പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സ്ഥിരതാമസക്കാരനായ അന്യദേശക്കാരൻ’.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രു പദം പ്രത്യേകിച്ച് ‘പിതാവില്ലാത്തവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: പിന്നെ ... നീ ഇങ്ങനെ പറയണം
  rationale: വാവ് ചേർന്ന ക്രിയ ആചാരക്രമത്തിലെ അടുത്ത ഘട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘പിന്നെ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ ക്രമം വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ‘സന്നിധിയിൽ/മുമ്പാകെ’ എന്നാണ്; ദൈവനാമമായ יהוה ‘യഹ്‌വേ’ എന്നു നിലനിർത്തുന്നു.
- source_word: בִּעַרְתִּי
  choice: ഞാൻ ... നീക്കിയിരിക്കുന്നു
  rationale: ഇവിടെ בער കത്തിക്കുക എന്നല്ല, സമർപ്പിതമായ ദശാംശഭാഗം വീട്ടിൽനിന്ന് എടുത്തുമാറ്റുക എന്നാണർഥം.
- source_word: הַקֹּדֶשׁ
  choice: വിശുദ്ധമായി വേർതിരിച്ച ഓഹരി
  rationale: അക്ഷരാർഥം ‘വിശുദ്ധവസ്തു’; സന്ദർഭത്തിൽ വിതരണത്തിനായി സമർപ്പിച്ചു വേർതിരിച്ച വിളവിന്റെ അംശം/ദശാംശം ഉദ്ദേശിക്കുന്നു.
- source_word: מִן הַבַּיִת
  choice: വീട്ടിൽനിന്ന്
  rationale: ഹീബ്രുവിലെ നിർദ്ദിഷ്ടരൂപമായ ‘വീട്ടിൽനിന്ന്’ നിലനിർത്തുന്നു; സംസാരിക്കുന്നയാളുടെ വീടാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: לַלֵּוִי
  choice: ലേവ്യന്
  rationale: മൂലപാഠം പുരോഹിതനെന്നല്ല, വിശാലമായ സാമൂഹികവിഭാഗമായ ലേവ്യനെന്നാണ് പറയുന്നത്.
- source_word: לַגֵּר
  choice: നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശിക്ക്
  rationale: גֵּר ഇസ്രായേൽസമൂഹത്തിനിടയിൽ സ്ഥിരമായി പാർക്കുന്ന അന്യദേശക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും ‘അപരിചിതൻ’ എന്നതിനെക്കാൾ ഇത് കൃത്യമാണ്.
- source_word: לַיָּתוֹם
  choice: അനാഥന്
  rationale: יָתוֹם പ്രത്യേകിച്ച് പിതാവില്ലാത്ത, സംരക്ഷണമില്ലാത്ത കുട്ടിയെയും പൊതുവായി അനാഥനെയും സൂചിപ്പിക്കാം; സ്വാഭാവിക മലയാളമായി ‘അനാഥൻ’ ഉപയോഗിക്കുന്നു.
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: നീ എന്നോടു കല്പിച്ചതെല്ലാം അനുസരിച്ച്
  rationale: ഹീബ്രുവിലെ നാമ-ക്രിയ ആവർത്തനം മലയാളത്തിൽ അതേപടി വരുത്തുന്നത് കൃത്രിമമാകുന്നതിനാൽ, സമ്പൂർണ അനുസരണത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ
  choice: നിന്റെ കല്പനകൾ ഞാൻ ലംഘിച്ചിട്ടില്ല
  rationale: עבר מן എന്ന പ്രയോഗത്തിന് ഇവിടെ കല്പനകളെ അതിലംഘിക്കുക/ലംഘിക്കുക എന്ന അർഥമാണ്.
- source_word: וְלֹא שָׁכָחְתִּי
  choice: അവ മറന്നിട്ടുമില്ല
  rationale: കല്പനകളെയാണ് ബഹുവചന സർവനാമം സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: הַקֹּדֶשׁ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: വിശുദ്ധമായി വേർതിരിച്ച ഓഹരി
  alternative: വിശുദ്ധവസ്തു
  rationale: ഇത് വിശുദ്ധതയുടെ പൊതുവായ ആശയം മാത്രമല്ല, ദശാംശമായി വേർതിരിച്ചു വിതരണം ചെയ്യേണ്ട ഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ ‘ദശാംശം’ എന്ന് മാത്രം എഴുതി അർഥം അമിതമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. നിയമപരവും ആചാരപരവുമായ പ്രഖ്യാപനത്തിന്റെ സ്വരം നിലനിർത്തിയപ്പോൾ, അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനം ഒഴിവാക്കി.
