  source_fidelity: 'ഹീബ്രു മൂലത്തോടുള്ള ബന്ധം പൊതുവേ വിശ്വസ്തമാണ്: വിശുദ്ധമായി വേർതിരിച്ച ഭാഗം വീട്ടിൽനിന്ന് നീക്കുക, നിർദിഷ്ട സാമൂഹികവിഭാഗങ്ങൾക്ക് നൽകുക, കല്പനകൾ ലംഘിക്കാതെയും മറക്കാതെയും ഇരിക്കുക എന്നീ ഘടകങ്ങൾ സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ ‘നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശിക്ക്’ എന്ന പ്രയോഗം മൂലപാഠത്തിൽ ഇല്ലാത്ത ബഹുവചന അഭിസംബോധന ചേർക്കുന്നു; സന്ദർഭത്തിൽ അഭിസംബോധന ഏകവചനമായ ‘നിന്റെ’ (ദൈവത്തോട്) ആകയാൽ ഇത് തിരുത്തണം.'
