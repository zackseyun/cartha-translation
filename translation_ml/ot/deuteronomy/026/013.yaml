  to: 'പിന്നെ നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സന്നിധിയിൽ നീ ഇങ്ങനെ പറയണം: ‘വിശുദ്ധമായി വേർതിരിച്ച ഓഹരി[a] ഞാൻ വീട്ടിൽനിന്ന് നീക്കിയിരിക്കുന്നു. നീ എന്നോടു കല്പിച്ചതെല്ലാം അനുസരിച്ച് ഞാൻ അത് ലേവ്യനും പരദേശവാസിക്കും[b] അനാഥനും[c] വിധവയ്ക്കും കൊടുത്തിരിക്കുന്നു. നിന്റെ കല്പനകൾ ഞാൻ ലംഘിച്ചിട്ടില്ല; അവ മറന്നിട്ടുമില്ല.’'
