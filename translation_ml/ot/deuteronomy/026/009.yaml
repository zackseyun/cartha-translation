source:
  edition: WLC
  text: וַ/יְבִאֵ֖/נוּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יִּתֶּן לָ֨/נוּ֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/009.yaml
  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
translation:
  language: ml
  text: അവിടുന്ന് ഞങ്ങളെ ഈ സ്ഥലത്തേക്കു കൊണ്ടുവന്നു; പാലും തേനും[b] ഒഴുകുന്ന ദേശം—ഈ ദേശം—ഞങ്ങൾക്കു തന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘പാലും തേനും സമൃദ്ധമായ ദേശം’; എബ്രായ പ്രയോഗം ഫലഭൂയിഷ്ഠതയെയും സമൃദ്ധിയെയും ചിത്രീകരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘തേൻ’ എന്ന പദത്തിൽ ചില സന്ദർഭങ്ങളിൽ തേനീച്ചത്തേൻ മാത്രമല്ല, ഈന്തപ്പഴച്ചാറുപോലുള്ള കട്ടിച്ചാറും ഉൾപ്പെടാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ
  choice: അവിടുന്ന് ഞങ്ങളെ ... കൊണ്ടുവന്ന്
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം കാരണകമായ ചലനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കൊണ്ടുവന്ന്’ എന്നത് ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ആദരസൂചകമായ ‘അവിടുന്ന്’ മുൻസന്ദർഭത്തിലെ ദൈവിക കർത്താവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലത്തേക്കു
  rationale: אֶל ലക്ഷ്യത്തിലേക്കുള്ള ചലനവും הַמָּקוֹם הַזֶּה ‘ഈ സ്ഥലം’ എന്ന നിർദേശക അർഥവും നൽകുന്നു.
- source_word: וַיִּתֶּן לָנוּ
  choice: ഞങ്ങൾക്കു തന്നു
  rationale: נתן കൂടെയുള്ള לָנוּ സ്വീകർത്താവായ ‘ഞങ്ങൾക്ക്’ എന്ന അർഥം വ്യക്തമാക്കുന്നു. ‘തന്നു’ ലളിതവും നേരിട്ടുള്ളതുമാണ്.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശം
  rationale: സന്ദർഭത്തിൽ אֶרֶץ ഇസ്രായേലിനു ലഭിച്ച നിർദിഷ്ട ഭൂവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: പാലും തേനും ഒഴുകുന്ന ദേശം
  rationale: ‘ഒഴുകുന്ന’ എന്ന രൂപകം എബ്രായത്തിലെ זָבַת എന്ന ദൃശ്യഭാഷ സംരക്ഷിക്കുകയും സമൃദ്ധിയും ഫലഭൂയിഷ്ഠതയും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: דְבָשׁ
  choice: തേൻ
  rationale: דְבָשׁ സാധാരണയായി ‘തേൻ’ എന്നാണ്; ചില സന്ദർഭങ്ങളിൽ ഈന്തപ്പഴച്ചാറുപോലുള്ള കട്ടിച്ചാറും ഉൾപ്പെടാമെന്ന സാംസ്കാരിക സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആദ്യപുരുഷ ചരിത്രവിശ്വാസപ്രഖ്യാപനത്തിലെ ദൈവിക കർത്താവിന്റെ പരാമർശം
  choice: ‘യഹോവ’ എന്ന് ഈ വാക്യത്തിൽ പുതുതായി ചേർക്കാതെ ആദരസൂചകമായ ‘അവിടുന്ന്’ നിലനിർത്തി
  alternative: ‘യഹോവ ഞങ്ങളെ ഈ സ്ഥലത്തേക്കു കൊണ്ടുവന്നു’
  rationale: എബ്രായ വാക്യത്തിൽ കർത്താവ് പ്രത്യേകം നാമമായി ആവർത്തിക്കുന്നില്ല; ഏകവചന മൂന്നാംപുരുഷ ക്രിയകൾ മുൻസന്ദർഭത്തിലെ യഹോവയെ തുടർന്നാണ് സൂചിപ്പിക്കുന്നത്. ‘അവിടുന്ന്’ ഈ ബന്ധം നിലനിർത്തുകയും മൂലത്തിൽ ഇല്ലാത്ത ദൈവനാമം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ രൂപകമായ ‘ഒഴുകുന്ന’ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന മുഴുവൻ പ്രയോഗത്തിനുശേഷം ക്രമത്തിൽ ചേർത്തിരിക്കുന്നു.
