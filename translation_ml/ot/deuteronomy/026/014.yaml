  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: ml
  text: ഞാൻ ദുഃഖാചരണത്തിലായിരിക്കുമ്പോൾ[a] അതിൽനിന്ന് ഒന്നും ഭക്ഷിച്ചിട്ടില്ല; അശുദ്ധാവസ്ഥയിൽ അതിൽനിന്ന് ഒന്നും നീക്കിക്കളഞ്ഞിട്ടില്ല[b]; മരിച്ചവർക്കുവേണ്ടി അതിൽനിന്ന് ഒന്നും കൊടുത്തിട്ടുമില്ല[c]. എന്റെ ദൈവമായ യഹ്‌വെയുടെ വാക്ക് ഞാൻ അനുസരിച്ചിരിക്കുന്നു; അങ്ങ് എന്നോടു കൽപിച്ചതെല്ലാം ഞാൻ ചെയ്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ ദുഃഖത്തിൽ,’ ‘വിലാപത്തിലായിരിക്കുമ്പോൾ,’ അല്ലെങ്കിൽ ‘കഷ്ടതയിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അതിൽനിന്ന് ഒന്നും കത്തിച്ചിട്ടില്ല’ അല്ലെങ്കിൽ ‘ഒന്നും ഒഴിവാക്കിയിട്ടില്ല.’ എബ്രായക്രിയയ്ക്ക് കത്തിക്കുക, നീക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘മരിച്ച ഒരാൾക്കുവേണ്ടി’ അല്ലെങ്കിൽ ‘മരിച്ചവരുമായി ബന്ധപ്പെട്ട്.’ നിരോധിക്കപ്പെട്ട ഉപയോഗം കൃത്യമായി എന്താണെന്ന് എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  choice: ദുഃഖാചരണത്തിലായിരിക്കുമ്പോൾ
  rationale: אֹנִי ദുഃഖം, വിലാപം, കഷ്ടത എന്നീ അർഥങ്ങൾ വഹിക്കാം. ആചാരശുദ്ധിയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ദുഃഖാചരണാവസ്ഥയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: അതിൽനിന്ന് ഒന്നും നീക്കിക്കളഞ്ഞിട്ടില്ല
  rationale: Piel രൂപത്തിലുള്ള בער എന്ന ക്രിയയ്ക്ക് കത്തിക്കുക, നീക്കുക, ഇല്ലാതാക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. നിർദിഷ്ട രീതി അനാവശ്യമായി ഉറപ്പിക്കാതെ വിശാലമായ അർഥം നൽകുന്നതിനാൽ ‘നീക്കിക്കളഞ്ഞിട്ടില്ല’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּטָמֵא
  choice: അശുദ്ധനായിരിക്കുമ്പോൾ
  rationale: ആചാരപരമായ അശുദ്ധാവസ്ഥയിലാണ് പ്രവൃത്തി നടന്നതെന്ന കാലാവസ്ഥാസൂചന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְמֵת
  choice: മരിച്ചവർക്കുവേണ്ടി
  rationale: മരണവുമായി ബന്ധപ്പെട്ട നിരോധിത ഉപയോഗത്തിന്റെ കൃത്യസ്വഭാവം എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല. ശവസംസ്കാരാർപ്പണം, മൃതദേഹബന്ധം തുടങ്ങിയ പ്രത്യേക വ്യാഖ്യാനങ്ങൾ ചേർക്കാതെ മൂലത്തിലെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: വാക്ക് ഞാൻ അനുസരിച്ചിരിക്കുന്നു
  rationale: ഈ എബ്രായപ്രയോഗം കേൾക്കുന്നതിനെക്കാൾ അനുസരണത്തെ സൂചിപ്പിക്കുന്നു. ‘വാക്ക് അനുസരിക്കുക’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും ഉടമ്പടിപരമായ അർഥം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ സാദ്ധ്യമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: അങ്ങ് എന്നോടു കല്പിച്ചതെല്ലാം
  rationale: ദൈവകല്പനകളോടുള്ള സമ്പൂർണ അനുരൂപത വ്യക്തമാക്കുന്ന, ആദരസൂചകവും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: ‘മരിച്ചവർക്കുവേണ്ടി’ എന്ന നിരോധിത ഉപയോഗത്തിന്റെ സ്വഭാവം
  choice: കൃത്യമായ മരണാചാരമോ മൃതദേഹസംബന്ധമായ അശുദ്ധിയോ നിർവചിക്കാതെ വിശാലമായ ഭാഷ നിലനിർത്തി.
  alternative: ശവസംസ്കാരച്ചടങ്ങുകൾക്കായി; മരിച്ച ഒരാൾക്കായി; മൃതദേഹവുമായി ബന്ധപ്പെട്ട്.
  rationale: לְמֵת എന്ന ചുരുക്കപ്രയോഗം നിരോധിത പ്രവൃത്തിയുടെ കൃത്യരൂപം പറയുന്നില്ല. ഒരു പ്രത്യേക ആചാരവ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ മൂലത്തിലെ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമപ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ ഉപയോഗിച്ചു. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ സ്വീകരിച്ചു. ആവർത്തിക്കുന്ന ‘അതിൽനിന്ന് ഒന്നും’ എന്ന ഘടന മൂലപാഠത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
