  naturalness: The revised wording is idiomatic modern standard Malayalam and maintains the solemn, declarative register. “അശുദ്ധാവസ്ഥയിൽ” is smoother and more natural in a ritual-purity context than the gendered participial construction.
  terminology: “ദുഃഖാചരണത്തിൽ,” “നീക്കിക്കളഞ്ഞിട്ടില്ല,” “മരിച്ചവർക്കുവേണ്ടി,” and “യഹ്‌വെ” suitably preserve the source wording and the established audit-trail decisions. The alternatives in the footnotes retain the relevant lexical and interpretive ambiguity.
