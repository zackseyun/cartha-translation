  to: യഹ്‌വെ ശക്തമായ കൈകൊണ്ടും നീട്ടിയ ഭുജംകൊണ്ടും വലിയ ഭീതിയോടെയും[a] അടയാളങ്ങളോടെയും അത്ഭുതങ്ങളോടെയും ഈജിപ്തിൽനിന്ന് നമ്മെ പുറത്തുകൊണ്ടുവന്നു.
  rationale: തിരുത്തൽ അർഥപരിവർത്തനം വരുത്തുന്നില്ല. കാരകമായ ‘പുറത്തുകൊണ്ടുവന്നു’ മൂലപാഠത്തിലെ ‘പുറത്തുവരുത്തി’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘വലിയ ഭീതി’ മുഖ്യവാചകത്തിൽ ഇംഗ്ലീഷ് audit trail-ലെ ‘great terror’ എന്ന ശക്തി നിലനിർത്തുന്നു; വിവാദ/വ്യാപകമായ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ തുടരുന്നു.
