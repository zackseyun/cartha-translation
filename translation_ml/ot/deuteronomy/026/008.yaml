id: DEU.26.8
reference: Deuteronomy 26:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּוֹצִאֵ֤/נוּ יְהוָה֙ מִ/מִּצְרַ֔יִם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְרֹ֣עַ נְטוּיָ֔ה וּ/בְ/מֹרָ֖א גָּדֹ֑ל וּ/בְ/אֹת֖וֹת וּ/בְ/מֹפְתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: ml
  text: യഹ്‌വെ ശക്തമായ കൈകൊണ്ടും നീട്ടിയ ഭുജംകൊണ്ടും വലിയ ഭീതിയോടെയും[a] അടയാളങ്ങളോടെയും അത്ഭുതങ്ങളോടെയും ഈജിപ്തിൽനിന്ന് നമ്മെ പുറത്തുകൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വലിയ ഭയത്തോടെയും,” “വലിയ ഭയഭക്തിയോടെയും,” അല്ലെങ്കിൽ “ഭയഭക്തി ഉളവാക്കുന്ന മഹാപ്രവൃത്തികളോടെയും.” എബ്രായപദത്തിന് ഭയം, ഭീതി, അല്ലെങ്കിൽ ഭയഭക്തി ഉളവാക്കുന്ന പ്രകടനം എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: നമ്മെ ... പുറപ്പെടുവിച്ചു
  rationale: ഹിഫീൽ രൂപം ‘പുറത്തേക്കു വരുത്തുക/പുറപ്പെടുവിക്കുക’ എന്ന കാരകാർഥം നൽകുന്നു; പുറപ്പാടിന്റെ ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: מִן എന്ന വിച്ഛേദാർഥക അവ്യയത്തെയും പുറപ്പെടുവിക്കൽ എന്ന സന്ദർഭത്തെയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּיָד חֲזָקָה
  choice: ശക്തമായ കൈകൊണ്ട്
  rationale: ദൈവത്തിന്റെ പ്രബലമായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: നീട്ടിയ ഭുജംകൊണ്ട്
  rationale: ദൈവിക ശക്തിയുടെ സജീവ പ്രകടനത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ രൂപകം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: וּבְמֹרָא גָּדֹל
  choice: മഹാഭീതിയോടെ
  rationale: מוֹרָא എന്ന പദത്തിലെ ഭയം, ഭീതി, ഭയഭക്തി ഉളവാക്കുന്ന പ്രകടനം എന്നീ അർഥസാധ്യതകളിൽ ഭീതിയുടെ ശക്തി മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וּבְאֹתוֹת
  choice: അടയാളങ്ങളോടെ
  rationale: אוֹת എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘അടയാളം’ നിലനിർത്തുന്നു; അത്ഭുതകരം എന്ന ആശയം അനാവശ്യമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וּבְמֹפְתִים
  choice: അത്ഭുതങ്ങളോടെ
  rationale: מוֹפֵת എന്ന പദം ഇവിടെ അടയാളങ്ങളോടു ചേർന്ന് അസാധാരണമായ ദൈവിക പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ സമാനപദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ പദവികൊണ്ട് പകരാതെ സംരക്ഷിക്കുന്നു; മറ്റൊരു ഉച്ചാരണരൂപമോ പരമ്പരാഗത പകരപ്പദമോ നിർബന്ധിക്കുന്നില്ല.
- issue: מוֹרָא എന്ന പദത്തിന്റെ പുറപ്പാട്-സന്ദർഭത്തിലെ അർഥവ്യാപ്തി
  choice: മഹാഭീതി
  alternative: മഹത്തായ ഭയഭക്തി; ഭയഭക്തി ഉളവാക്കുന്ന മഹാപ്രവൃത്തികൾ
  rationale: ഈജിപ്തിനെതിരായ പ്രവൃത്തികളുടെ ഭയാനകമായ പ്രഭാവം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുമ്പോഴും, പദത്തിലെ ഭയഭക്തിയുടെയും ഭീതിയുണർത്തുന്ന പ്രകടനത്തിന്റെയും സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തിക്കുന്ന בְ ഘടനയെ ‘-കൊണ്ടും/-യോടെയും’ എന്ന സമാന്തരഘടനയിലൂടെ നിലനിർത്തി; മലയാളവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ക്രിയ അവസാനം വെച്ചു.
