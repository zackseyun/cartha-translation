base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: ml
  text: നീ തനിക്കുള്ള അമൂല്യസ്വത്തായ ജനമായിരിക്കണമെന്നും[a], അവൻ നിന്നോടു പറഞ്ഞതുപോലെ[b], അവന്റെ എല്ലാ കൽപ്പനകളും പാലിക്കണമെന്നും യഹോവ ഇന്ന് പ്രഖ്യാപിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘തന്റെ അമൂല്യജനമായിരിക്കണമെന്ന്’; എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഒരു ജനം, അമൂല്യസ്വത്ത്.’'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവൻ നിന്നോടു വാഗ്ദാനം ചെയ്തതുപോലെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ יהוה വ്യക്തിനാമമായി നിലനിർത്തുന്നു; മൂലപാഠത്തിലെ സവിശേഷത മറയ്ക്കുന്ന പൊതുപദവി ഉപയോഗിക്കുന്നില്ല.
- source_word: הֶאֱמִירְךָ
  choice: നിന്നെ ... പ്രഖ്യാപിച്ചിരിക്കുന്നു
  rationale: ആവർത്തനം 26:17–18-ലെ അപൂർവമായ ഹിഫീൽ രൂപത്തിന് ഉടമ്പടിപരമായ ഔപചാരിക പ്രഖ്യാപനത്തിന്റെ ശക്തിയുണ്ട്. ‘പ്രഖ്യാപിച്ചിരിക്കുന്നു’ അത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘തിരഞ്ഞെടുത്തു’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: ഉടമ്പടി പ്രഖ്യാപനത്തിന്റെ തത്സമയഭാവം നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: לִהְיוֹת לוֹ
  choice: തന്റെ ... ആയി
  rationale: യഹോവയോടുള്ള ബന്ധവും പദവിയും സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യ/ഫല നിർമാണം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְעַם סְגֻלָּה
  choice: അമൂല്യജനം
  rationale: עַם എന്ന ‘ജനം’ എന്ന ഘടകവും סְגֻלָּה എന്ന വിലയേറിയ സ്വകാര്യസ്വത്ത്/നിധി എന്ന ആശയവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: അവൻ നിന്നോടു അരുളിച്ചെയ്തതുപോലെ
  rationale: דבר എന്നതിന്റെ അടിസ്ഥാനമായ ‘സംസാരിക്കുക/പറയുക’ എന്ന അർഥം നിലനിർത്തുകയും ദൈവവചനത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു; ‘വാഗ്ദാനം ചെയ്തു’ എന്ന് വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: וְלִשְׁמֹר
  choice: പാലിക്കേണ്ടതിനും
  rationale: കല്പനകളോടൊപ്പം שׁמר അനുസരിക്കുകയും കാത്തുനടക്കുകയും ചെയ്യുക എന്ന അർഥം നൽകുന്നു; ഇൻഫിനിറ്റീവ് നിർമാണത്തിന്റെ ഉദ്ദേശ്യ/ബാധ്യതാ ഭാവം നിലനിർത്തുന്നു.
- source_word: כָּל מִצְוֺתָיו
  choice: അവന്റെ സകല കല്പനകളും
  rationale: ഉടമ്പടി-നിയമപരമായ പദപ്രയോഗം കൃത്യവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: הֶאֱמִיר എന്ന അപൂർവ ക്രിയയുടെ ഉടമ്പടിപരമായ ശക്തി
  choice: ഔപചാരിക ദൈവിക പ്രഖ്യാപനം
  alternative: തിരഞ്ഞെടുക്കുക; സ്വന്തജനമായി വേർതിരിക്കുക; പരസ്പരം പ്രതിജ്ഞ ചെയ്യുക
  rationale: വാക്യം യിസ്രായേലിന്റെ പദവിയെക്കുറിച്ചുള്ള യഹോവയുടെ ഉടമ്പടി പ്രഖ്യാപനം വിവരിക്കുന്നു. ‘പ്രഖ്യാപിച്ചിരിക്കുന്നു’ എന്നത് തിരഞ്ഞെടുപ്പ് സംബന്ധിച്ച കൂടുതൽ ശക്തമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെയും അപൂർവക്രിയയുടെ നിർവഹണാത്മക ശക്തി നഷ്ടപ്പെടുത്താതെയും അർഥം പകരുന്നു.
- issue: כַּאֲשֶׁר דִּבֶּר לָךְ എന്നതിൽ വാഗ്ദാനഭാവമുണ്ടോ
  choice: മൂലത്തിലെ ‘സംസാരിച്ചു/അരുളിച്ചെയ്തു’ എന്ന തുറന്ന അർഥം നിലനിർത്തുക
  alternative: ‘നിന്നോടു വാഗ്ദാനം ചെയ്തതുപോലെ’
  rationale: സന്ദർഭത്തിൽ മുൻകാല ദൈവിക വാഗ്ദാനം സൂചിപ്പിക്കാമെങ്കിലും, דִּבֶּר സ്വതവേ ‘സംസാരിച്ചു’ എന്നാണ്. അതിനാൽ യഥാർഥമായ അർഥവ്യാപ്തിയും സാധ്യതയുള്ള ഉടമ്പടിപരമായ സൂചനയും അടിക്കുറിപ്പോടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ‘അരുളിച്ചെയ്തു’, ‘സകല’, ‘കല്പന’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ ഉടമ്പടി-തിരുവെഴുത്ത് ഭാവം സൂക്ഷിക്കുന്നു; അതേസമയം അത്യന്തം പുരാതനമായ വാക്യഘടന ഒഴിവാക്കുന്നു. ഏകവചന അഭിസംബോധനയായ ‘നിന്നെ/നീ’ മൂലപാഠത്തോട് യോജിച്ചിരിക്കുന്നു.
