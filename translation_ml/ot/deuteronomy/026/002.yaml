source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ מֵ/רֵאשִׁ֣ית כָּל פְּרִ֣י הָ/אֲדָמָ֗ה אֲשֶׁ֨ר תָּבִ֧יא מֵֽ/אַרְצְ/ךָ֛ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לָ֖/ךְ וְ/שַׂמְתָּ֣ בַ/טֶּ֑נֶא וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: ml
  text: നിന്റെ ദേശത്തുനിന്ന് നീ കൊണ്ടുവരുന്നതും നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകുന്നതുമായ നിലത്തിലെ സകല വിളവിന്റെയും ആദ്യഫലങ്ങളിൽനിന്ന് കുറെ എടുത്ത്[a] ഒരു കൊട്ടയിൽ വെക്കണം; പിന്നെ, തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ നിന്റെ ദൈവമായ യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തേക്കു പോകണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ പരമ്പരാഗതമായി: “നിലത്തിലെ സകല വിളവിന്റെയും ആദ്യഫലങ്ങൾ.”'
    reason: മֵרֵאשִׁית എന്ന പദം ‘ആദ്യഭാഗം/ആദ്യഫലങ്ങൾ’ എന്ന ആശയം നൽകുന്നു; മִן എന്ന ഉപസർഗം ഇവിടെ അവയിൽനിന്നുള്ള ഒരു ഭാഗം എടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
  - marker: b
    text: 'അക്ഷരാർഥം: “തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ.” യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തനപുസ്തകത്തിലെ സവിശേഷ പ്രയോഗമാണിത്.'
    reason: לְשַׁכֵּן שְׁמוֹ שָׁם എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കാരകഭാവവും ആവർത്തനപുസ്തകത്തിലെ സവിശേഷ രൂപവും നിലനിർത്തുന്നു; അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: എടുത്ത്
  rationale: നിയമപരമായ നിർദേശക്രമത്തിലെ ക്രിയയെ തുടർന്നുവരുന്ന ‘വെക്കണം’ എന്ന നിർദേശത്തോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: מֵרֵאשִׁית כָּל־פְּרִי הָאֲדָמָה
  choice: നിലത്തിലെ സകല വിളവിന്റെയും ആദ്യഫലങ്ങളിൽനിന്ന് കുറെ
  rationale: מִן എന്ന വിഭക്തിയുടെ ഭാഗികതയും רֵאשִׁית എന്ന ആദ്യവിളവിന്റെ ആശയവും നിലനിർത്തുന്നു; ‘വിളവ്’ ഇവിടെ പഴങ്ങൾക്കപ്പുറം കാർഷിക ഉൽപ്പന്നങ്ങളെ ഉൾക്കൊള്ളുന്നു.
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: നിന്റെ ദേശത്തുനിന്ന് നീ കൊണ്ടുവരുന്ന
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘കൊണ്ടുവരുക’ എന്ന ചലനാർഥം നിലനിർത്തുന്നു; ‘കൊയ്യുന്ന’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു തരുന്ന
  rationale: നֹתֵן എന്ന വർത്തമാന കൃതന്തത്തിന്റെ തുടർച്ചയായ ദാനഭാവം മലയാളത്തിലെ സ്വാഭാവിക വർത്തമാന രൂപത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നാക്കി മാറ്റാതെ Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: ഒരു കൊട്ടയിൽ വെക്കണം
  rationale: טֶנֶא വിളവു കൊണ്ടുപോകാനുള്ള കൊട്ടയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അനിശ്ചിത ഏകവചനം സ്വാഭാവികമാണ്.
- source_word: וְהָלַכְתָּ אֶל־הַמָּקוֹם
  choice: സ്ഥലത്തേക്കു പോകണം
  rationale: ആരാധനയ്ക്കായി തിരഞ്ഞെടുക്കപ്പെടുന്ന കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന הַמָּקוֹם എന്ന പദത്തെ ലളിതവും ഔപചാരികവുമായ ‘സ്ഥലം’ എന്നു നൽകുന്നു.
- source_word: אֲשֶׁר יִבְחַר
  choice: തിരഞ്ഞെടുക്കുന്ന
  rationale: ഹീബ്രുവിലെ ഭാവിനിർദ്ദേശം സന്ദർഭത്തിൽ വ്യക്തമാണ്; മലയാളത്തിലെ ബന്ധവാക്യരൂപം കാലത്തെ അനാവശ്യമായി ഭാരപ്പെടുത്താതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ
  rationale: שכן എന്ന ക്രിയയുടെ കാരകഭാവവും ആവർത്തനപുസ്തകത്തിലെ ‘നാമം വസിക്കുക’ എന്ന സവിശേഷ ദൈവശാസ്ത്രപരമായ പ്രയോഗവും വ്യാഖ്യാനിച്ചു ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ Yahweh എന്ന രൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: לְשַׁכֵּן שְׁמוֹ שָׁם എന്ന വിശുദ്ധസ്ഥാനസൂത്രവാക്യം
  choice: തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ
  alternative: തന്റെ നാമം അവിടെ സ്ഥാപിക്കാൻ
  rationale: ദൈവം തന്നെ ഒരു സ്ഥലത്തിനുള്ളിൽ പരിമിതനാകുന്നു എന്നു പറയാതെയും വെറും ഉടമസ്ഥതയായി ചുരുക്കാതെയും, ദൈവനാമത്തിന്റെ വാസത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിലെ രൂപകവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘വിളവ്’, ‘കൊട്ട’, ‘സ്ഥലം’ തുടങ്ങിയ സ്വാഭാവിക പദങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ ദൈവനാമവും ‘നാമം വസിപ്പിക്കുക’ എന്ന സവിശേഷ പ്രയോഗവും സംരക്ഷിച്ചു.
