source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן הַ/טֶּ֖נֶא מִ/יָּדֶ֑/ךָ וְ/הִ֨נִּיח֔/וֹ לִ/פְנֵ֕י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/004.yaml
  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: ml
  text: അപ്പോൾ പുരോഹിതൻ നിന്റെ കൈയിൽനിന്ന് ആ കൊട്ട എടുത്ത് നിന്റെ ദൈവമായ യഹ്‌വേയുടെ യാഗപീഠത്തിനുമുമ്പിൽ വെക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: “YHWH”; പരമ്പരാഗതമായി “കർത്താവ്” എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ ഹീബ്രു രൂപവും പരമ്പരാഗത പകരംവിവർത്തനവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וְלָקַח
  choice: അപ്പോൾ ... വാങ്ങി
  rationale: ചടങ്ങിന്റെ ക്രമത്തിൽ അടുത്തതായി നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ വാവ് സഹിതമുള്ള ക്രിയയെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു അവതരിപ്പിച്ചു; കൈയിൽനിന്നുള്ള വസ്തു ഏറ്റുവാങ്ങുന്നതിന് ‘വാങ്ങി’ യോജിക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ചടങ്ങ് നിർവഹിക്കുന്ന നിർദിഷ്ട പുരോഹിതനെ സൂചിപ്പിക്കുന്ന ഏകവചന നാമം.
- source_word: הַטֶּנֶא
  choice: ആ കൊട്ട
  rationale: טֶנֶא ഇവിടെ ആദ്യഫലങ്ങൾ കൊണ്ടുവന്ന കൊട്ടയെ സൂചിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തിൽ പരാമർശിച്ച നിർദിഷ്ട കൊട്ടയായതിനാൽ ‘ആ’ ചേർത്തു.
- source_word: מִיָּדֶךָ
  choice: നിന്റെ കൈയിൽനിന്ന്
  rationale: സമർപ്പകന്റെ കൈയിൽനിന്ന് പുരോഹിതനിലേക്കുള്ള നേരിട്ടുള്ള കൈമാറ്റത്തിന്റെ മൂർത്തമായ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: וְהִנִּיחוֹ
  choice: വെക്കണം
  rationale: נוח എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു വസ്തു സ്ഥാപിക്കുക/വെക്കുക എന്നാണ്; കർമപ്രത്യയം കൊട്ടയെ സൂചിപ്പിക്കുന്നു. നിയമപരമായ നിർദേശം മലയാളത്തിൽ ‘വെക്കണം’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: യാഗപീഠത്തോടുള്ള സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ ആരാധനാസംബന്ധിയായ പ്രയോഗം.
- source_word: מִזְבַּח
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പണത്തിനുള്ള altar എന്ന ആശയത്തിന്റെ നിലവാരമുള്ള മലയാള ബൈബിൾ പദം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ YHWH-നെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതമായി പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം നിലനിർത്തുകയും തുടർന്നുള്ള ‘യാഗപീഠം’ എന്ന നാമവുമായി സ്വാഭാവികമായ മലയാളബന്ധം സൃഷ്ടിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം YHWH എന്ന വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അത് ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാള വായനക്കാർക്കു പരിചിതമായ ‘യഹോവ’ എന്നു നൽകുന്നത് മൂലപാഠത്തിലെ ദൈവനാമത്തെ പ്രകടമാക്കുന്നു; അടിക്കുറിപ്പിൽ ഹീബ്രു രൂപവും പരമ്പരാഗത പകരംവിവർത്തനവും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ചടങ്ങിന്റെ ക്രമം ‘അപ്പോൾ’ എന്നും നിയമപരമായ നിർദേശം ‘വെക്കണം’ എന്നും വ്യക്തമാക്കി. ഏകവചനത്തിലുള്ള നേരിട്ടുള്ള അഭിസംബോധനയായ ‘നിന്റെ’ നിലനിർത്തി.
