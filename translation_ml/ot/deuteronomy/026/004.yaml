  to: അപ്പോൾ പുരോഹിതൻ നിന്റെ കൈയിൽനിന്ന് ആ കൊട്ട എടുത്ത് നിന്റെ ദൈവമായ യഹ്‌വേയുടെ യാഗപീഠത്തിനുമുമ്പിൽ വെക്കണം.[a]
  rationale: The revision corrects the divine-name transliteration to conform to the project’s Yahweh policy and replaces an ambiguously commercial verb with the direct ritual-action verb «എടുത്ത്». All other elements retain the source text’s procedural force and direct singular address.
