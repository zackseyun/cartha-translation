  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: ml
  text: അവൻ സൃഷ്ടിച്ച സകല ജനതകൾക്കും മീതെ നിന്നെ ഉന്നതനാക്കേണ്ടതിനും, നിനക്കു സ്തുതിയും കീർത്തിയും ശോഭയും ഉണ്ടാകേണ്ടതിനും, നിന്റെ ദൈവമായ യഹോവയ്ക്കുള്ള വിശുദ്ധജനമായിരിക്കേണ്ടതിനും, അവൻ അരുളിച്ചെയ്തതുപോലെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן
  choice: നിന്നെ ഉന്നതനാക്കാനും
  rationale: נתן എന്ന ക്രിയയും עֶלְיוֹן എന്ന വിശേഷണവും ചേർന്ന് ഇവിടെ ‘ഉയർന്ന നിലയിൽ ആക്കുക’ എന്ന അർഥം നൽകുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ അത് ‘ഉന്നതനാക്കുക’ എന്നു സംക്ഷിപ്തമായി നൽകി.
- source_word: עַל כָּל הַגּוֹיִם אֲשֶׁר עָשָׂה
  choice: അവൻ സൃഷ്ടിച്ച സകല ജനതകൾക്കും മീതെ
  rationale: עַל എന്നതിന്റെ താരതമ്യപരമായ ‘മീതെ’ എന്ന ഭാവവും, עשה എന്നതിന്റെ ‘ഉണ്ടാക്കുക/സൃഷ്ടിക്കുക’ എന്ന പൊതുവായ അർഥവും നിലനിർത്തുന്നു.
- source_word: לִתְהִלָּה
  choice: സ്തുതിക്കും
  rationale: תְּהִלָּהയുടെ നേരിട്ടുള്ള അർഥമായ ‘സ്തുതി’ നിലനിർത്തുകയും തുടർന്നുള്ള നാമത്രയത്തിന്റെ സമാന്തരഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וּלְשֵׁם
  choice: കീർത്തിക്കും
  rationale: שֵׁם അക്ഷരാർഥത്തിൽ ‘പേര്’ ആണെങ്കിലും ഈ സന്ദർഭത്തിൽ പ്രശസ്തി അഥവാ കീർത്തി എന്ന അർഥമാണ് സ്വാഭാവികം. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וּלְתִפְאָרֶת
  choice: ശോഭയ്ക്കും
  rationale: תִּפְאֶרֶת സൗന്ദര്യം, പ്രഭ, മഹത്വം എന്നിവ സൂചിപ്പിക്കാം. ‘ശോഭ’ അതിന്റെ ദൃശ്യവും ബഹുമാനസൂചകവുമായ ഭാവങ്ങൾ ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
- source_word: וְלִהְיֹתְךָ עַם קָדֹשׁ לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവയ്ക്കു വിശുദ്ധജനമായിരിക്കാൻ നിന്നെ ആക്കാനും
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ബന്ധം/അവകാശം ‘യഹോവയ്ക്കു’ എന്നു നൽകി; עַם קָדֹשׁ എന്നത് സ്വാഭാവികമായി ‘വിശുദ്ധജനം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: അവിടന്ന് അരുളിച്ചെയ്തതുപോലെ
  rationale: דבר എന്നത് അടിസ്ഥാനമായി ‘പറയുക/സംസാരിക്കുക’ എന്നാണ്; വാഗ്ദാനം എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ആദരസൂചകവും സ്വാഭാവികവുമായ ഭാഷ ഉപയോഗിച്ചു.
theological_decisions:
- issue: അവസാന വാക്യഭാഗത്തെ വ്യക്തമായി വാഗ്ദാനമായി അവതരിപ്പിക്കണമോ
  choice: അവിടന്ന് അരുളിച്ചെയ്തതുപോലെ
  alternative: അവിടന്ന് വാഗ്ദാനം ചെയ്തതുപോലെ
  rationale: എബ്രായ ക്രിയയ്ക്ക് നേരിട്ട് ‘പറഞ്ഞു/സംസാരിച്ചു’ എന്നാണർഥം. ഉടമ്പടിസന്ദർഭം വാഗ്ദാനഭാവം നൽകുന്നുണ്ടെങ്കിലും അത് മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർത്തിട്ടില്ല.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ദൈവനാമരൂപം ഉപയോഗിക്കുന്നത് മൂലപാഠത്തിലെ പ്രത്യേക നാമത്തെ വ്യക്തമായി നിലനിർത്തുന്നു; പദവിയായ ‘കർത്താവ്’ എന്ന രൂപത്തിൽ ലയിപ്പിക്കുന്നില്ല.
- issue: לִתְהִלָּה וּלְשֵׁם וּלְתִפְאָרֶת എന്ന നാമത്രയത്തിന്റെ ബന്ധം
  choice: സ്തുതിക്കും കീർത്തിക്കും ശോഭയ്ക്കും വേണ്ടി നിന്നെ ആക്കാനും
  alternative: അവനു സ്തുതിയും കീർത്തിയും മഹത്വവും ഉണ്ടാകേണ്ടതിന്
  rationale: ഈ നാമങ്ങൾ ആരിലേക്കാണ് കൃത്യമായി തിരിയുന്നതെന്നത് വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ, എബ്രായത്തിലെ ഉദ്ദേശ്യ/ഫലഘടന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള വേദപുസ്തകശൈലി സ്വീകരിച്ചു. നീണ്ട എബ്രായ ഉദ്ദേശ്യഘടന വായനാസൗകര്യത്തിനായി സമാന്തരമായ ‘-ആക്കാനും’ ഘടകങ്ങളായി ക്രമപ്പെടുത്തി; എന്നാൽ മുഖ്യമായ അർഥബന്ധങ്ങളും നാമത്രയവും സംരക്ഷിച്ചു.
