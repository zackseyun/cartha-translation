source:
  edition: WLC
  text: הַשְׁקִיפָ/ה֩ מִ/מְּע֨וֹן קָדְשְׁ/ךָ֜ מִן הַ/שָּׁמַ֗יִם וּ/בָרֵ֤ךְ אֶֽת עַמְּ/ךָ֙ אֶת יִשְׂרָאֵ֔ל וְ/אֵת֙ הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּה לָ֑/נוּ כַּ/אֲשֶׁ֤ר נִשְׁבַּ֨עְתָּ֙ לַ/אֲבֹתֵ֔י/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: ml
  text: അങ്ങയുടെ വിശുദ്ധ വാസസ്ഥലത്തുനിന്ന്, സ്വർഗത്തിൽനിന്ന്, താഴേക്കു നോക്കി അങ്ങയുടെ ജനമായ ഇസ്രായേലിനെയും, ഞങ്ങളുടെ പിതാക്കന്മാരോട് അങ്ങ് ശപഥം ചെയ്തതുപോലെ അങ്ങ് ഞങ്ങൾക്കു നൽകിയ, പാലും തേനും ഒഴുകുന്ന ദേശമായ ഈ നിലത്തെയും അനുഗ്രഹിക്കണമേ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: താഴേക്കു നോക്കി
  rationale: മുകളിൽനിന്ന് ശ്രദ്ധയോടെ നോക്കുക എന്ന ആജ്ഞയുടെ ദൃശ്യാർഥവും സ്വർഗീയ വീക്ഷണസ്ഥാനവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: מִמְּעוֹן קָדְשְׁךָ
  choice: അങ്ങയുടെ വിശുദ്ധ വാസസ്ഥലത്തുനിന്ന്
  rationale: מָעוֹן എന്നത് വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന പ്രാർഥനയ്ക്ക് യോജിച്ച ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
- source_word: מִן הַשָּׁמַיִם
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: രൂപത്തിൽ ബഹുവചനമായെങ്കിലും ഈ സ്ഥാനസൂചക പ്രയോഗത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചനരൂപം അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: וּבָרֵךְ
  choice: അനുഗ്രഹിക്കണമേ
  rationale: പ്രാർഥനയിലെ ആജ്ഞാരൂപം മലയാളത്തിൽ സ്വാഭാവികവും ആദരപൂർവവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: അങ്ങയുടെ ജനമായ ഇസ്രായേൽ
  rationale: ഇസ്രായേൽ തന്നെയാണ് ‘അങ്ങയുടെ ജനം’ എന്ന് വ്യക്തമാക്കുന്ന സമാനാധികരണ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: הָאֲדָמָה
  choice: നിലം
  rationale: കൃഷിയോഗ്യമായ മണ്ണ്/നിലം എന്ന സൂചന നിലനിർത്തുകയും വാക്യത്തിന്റെ അവസാനത്തിലുള്ള אֶרֶץ എന്ന ‘ദേശം’ എന്ന പദത്തിൽനിന്നുള്ള ശാബ്ദിക വ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: അങ്ങ് ഞങ്ങൾക്കു നൽകിയ
  rationale: പൂർത്തിയായ ദൈവിക ദാനത്തെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: ഞങ്ങളുടെ പിതാക്കന്മാരോട് അങ്ങ് ശപഥം ചെയ്തതുപോലെ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചനവും പഞ്ചഗ്രന്ഥത്തിലെ ഉടമ്പടി-ശപഥ സൂത്രവാക്യവും നിലനിർത്തുന്നു.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: പാലും തേനും ഒഴുകുന്ന ഒരു ദേശം
  rationale: സമൃദ്ധിയും ഫലഭൂയിഷ്ഠതയും സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയുടെ മലയാളത്തിൽ സ്ഥാപിതവും വ്യക്തവുമായ തുല്യപ്രയോഗമാണിത്.
theological_decisions:
- issue: לַאֲבֹתֵינוּ എന്ന ഉടമ്പടി-സൂത്രവാക്യത്തിന്റെ പരിഭാഷ
  choice: ഞങ്ങളുടെ പിതാക്കന്മാരോട്
  alternative: ഞങ്ങളുടെ പൂർവികരോട്
  rationale: എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘പിതാക്കന്മാർ’ എന്നാണ്; ഇവിടെ പ്രധാനമായും ഗോത്രപിതാക്കന്മാരെ ഉദ്ദേശിക്കുന്ന ഉടമ്പടി-സന്ദർഭം നിലനിർത്തുന്നു. വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യവും പ്രാർഥനോചിതവുമായ ശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു. הָאֲדָמָה / אֶרֶץ വ്യത്യാസം ‘നിലം’ / ‘ദേശം’ എന്നിങ്ങനെ സംരക്ഷിച്ചു; അവസാനത്തെ നാമവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ദേശമാണിത്’ എന്നു നൽകി.
