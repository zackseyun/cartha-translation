revisions:
- from: അങ്ങയുടെ വിശുദ്ധ വാസസ്ഥലത്തുനിന്ന്, സ്വർഗത്തിൽനിന്ന്, താഴേക്കു നോക്കി അങ്ങയുടെ ജനമായ ഇസ്രായേലിനെയും അങ്ങ് ഞങ്ങൾക്കു നൽകിയ നിലത്തെയും അനുഗ്രഹിക്കണമേ. ഞങ്ങളുടെ പിതാക്കന്മാരോട്[a] അങ്ങ് ശപഥം ചെയ്തതുപോലെ, പാലും തേനും ഒഴുകുന്ന ഒരു ദേശമാണിത്.
  to: അങ്ങയുടെ വിശുദ്ധ വാസസ്ഥലത്തുനിന്ന്, സ്വർഗത്തിൽനിന്ന്, താഴേക്കു നോക്കി അങ്ങയുടെ ജനമായ ഇസ്രായേലിനെയും, ഞങ്ങളുടെ പിതാക്കന്മാരോട് അങ്ങ് ശപഥം ചെയ്തതുപോലെ അങ്ങ് ഞങ്ങൾക്കു നൽകിയ, പാലും തേനും ഒഴുകുന്ന ദേശമായ ഈ നിലത്തെയും അനുഗ്രഹിക്കണമേ.
  rationale: The revision retains the draft’s faithful vocabulary and reverent register but restores the Hebrew syntax and sense by making “a land flowing with milk and honey” a description of the land being blessed, rather than a separate statement. The reordered modifiers also make clear that God gave the land in accordance with the oath made to the fathers.
