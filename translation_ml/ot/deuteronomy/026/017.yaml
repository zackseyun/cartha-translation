source:
  edition: WLC
  text: אֶת יְהוָ֥ה הֶאֱמַ֖רְתָּ הַ/יּ֑וֹם לִ/הְיוֹת֩ לְ/ךָ֨ לֵֽ/אלֹהִ֜ים וְ/לָ/לֶ֣כֶת בִּ/דְרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר חֻקָּ֧י/ו וּ/מִצְוֺתָ֛י/ו וּ/מִשְׁפָּטָ֖י/ו וְ/לִ/שְׁמֹ֥עַ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: ml
  text: ഇന്ന്[a] യഹോവ നിങ്ങളുടെ ദൈവമാണെന്നും, നിങ്ങൾ അവിടുത്തെ വഴികളിൽ നടക്കുകയും അവിടുത്തെ ചട്ടങ്ങളും കല്പനകളും ന്യായവിധികളും പാലിക്കുകയും അവിടുത്തെ ശബ്ദം അനുസരിക്കുകയും[c] ചെയ്യുമെന്നും നിങ്ങൾ ഔപചാരികമായി പ്രഖ്യാപിച്ചിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ദിവസം.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായക്രിയ അപൂർവമാണ്; അതിനെ കൂടുതൽ പദാനുപദമായി ‘ഉറപ്പിച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ഔദ്യോഗികമായി അംഗീകരിച്ചിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘അവിടുത്തെ ശബ്ദം കേൾക്കുകയും’; സന്ദർഭത്തിൽ അനുസരണത്തിന്റെ അർഥവും ഇതിലുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതെ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: הֶאֱמַרְתָּ
  choice: ഔപചാരികമായി പ്രഖ്യാപിച്ചിരിക്കുന്നു
  rationale: ഇവിടെയുള്ള അപൂർവമായ ഹിഫിൽ രൂപത്തിന് സാധാരണ ‘പറഞ്ഞു’ എന്നതിലധികം, ഉടമ്പടിപരമായ ഉറച്ച പ്രഖ്യാപനത്തിന്റെ ഭാവമുണ്ട്. ‘ഔപചാരികമായി’ എന്നത് ആ ഗൗരവം വ്യക്തമാക്കുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചനയുടെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: യഹോവയാണ് നിങ്ങളുടെ ദൈവമെന്ന്
  rationale: ഉടമ്പടിബന്ധം സൂചിപ്പിക്കുന്ന ‘നിങ്ങൾക്കു ദൈവമായിരിക്കുക’ എന്ന ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ നാമവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: അവിടുത്തെ വഴികളിൽ നടക്കുക
  rationale: ജീവിതനടപ്പിനെ സൂചിപ്പിക്കുന്ന ബൈബിൾപരമായ രൂപകം നിലനിർത്തുന്നു; ‘ജീവിക്കുക’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: חֻקָּיו
  choice: അവിടുത്തെ ചട്ടങ്ങൾ
  rationale: നിയമപരവും ഉടമ്പടിപരവുമായ അർഥം സാധാരണ വായനക്കാർക്കു വ്യക്തമായ പദത്തിൽ നൽകുന്നു.
- source_word: מִצְוֺתָיו
  choice: അവിടുത്തെ കല്പനകൾ
  rationale: ദൈവിക ആജ്ഞകളുടെ ഔപചാരിക സ്വഭാവം നിലനിർത്തുന്ന പതിവ് മലയാള പദമാണ്.
- source_word: מִשְׁפָּטָיו
  choice: അവിടുത്തെ ന്യായവിധികൾ
  rationale: മറ്റു നിയമപദങ്ങളുമായി ലയിപ്പിക്കാതെ, നീതിന്യായക്രമത്തോടുള്ള മൂലപദത്തിന്റെ ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: അവിടുത്തെ ശബ്ദം അനുസരിക്കുക
  rationale: ശബ്ദം ‘കേൾക്കുക’ എന്ന അക്ഷരാർഥത്തോടൊപ്പം സന്ദർഭത്തിലുള്ള അനുസരണത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി പ്രഖ്യാപനത്തിന്റെ വ്യാപ്തിയും ഇസ്രായേലിന്റെ പ്രവർത്തകത്വവും
  choice: യഹോവ തങ്ങളുടെ ദൈവമാണെന്നതും തുടർന്നുള്ള അനുസരണബാധ്യതകളും ജനത്തിന്റെ ഒരൊറ്റ ഔപചാരിക പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കമായി അവതരിപ്പിച്ചു.
  alternative: ഇൻഫിനിറ്റീവ് ഘടകങ്ങളെ പരസ്പരബന്ധം വ്യക്തമാക്കാതെ ‘നടക്കാനും… പാലിക്കാനും… കേൾക്കാനും’ എന്ന ക്രമത്തിൽ കൂടുതൽ പദാനുപദമായി നൽകാം.
  rationale: എബ്രായത്തിലെ അപൂർവ പ്രഖ്യാപനക്രിയയും അതിനെ പിന്തുടരുന്ന ഇൻഫിനിറ്റീവുകളും ഉടമ്പടിപരമായ സമ്മതവും ബാധ്യതകളും ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ ബന്ധം വ്യക്തമാക്കുമ്പോഴും അധികമായ സിദ്ധാന്തപരമായ ആശയം ചേർക്കുന്നില്ല.
- issue: שׁמע בקול എന്ന പ്രയോഗത്തിലെ കേൾവിയും അനുസരണവും
  choice: ‘ശബ്ദം അനുസരിക്കുക’ എന്നു മുഖ്യവാചകത്തിൽ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘ശബ്ദം കേൾക്കുക’ എന്നു കൂടുതൽ പദാനുപദമായി നൽകാം.
  rationale: ഉടമ്പടിസന്ദർഭത്തിൽ ഈ പ്രയോഗം അനുസരണപൂർവമായ കേൾവിയെ സൂചിപ്പിക്കുന്നു. ‘അനുസരിക്കുക’ സ്വാഭാവിക മലയാളമാണ്; അടിക്കുറിപ്പ് മൂലരൂപത്തിലെ കേൾവി-രൂപകം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവിടുത്തെ’ എന്ന ആദരസൂചക സർവനാമം ദൈവത്തെ പരാമർശിക്കാൻ സ്ഥിരമായി ഉപയോഗിച്ചു. നിയമപരമായ മൂന്ന് പദങ്ങളും വേർതിരിച്ചുനിർത്തി; വാക്യത്തിന്റെ ഉടമ്പടിപരമായ ഔപചാരികത സംരക്ഷിക്കാൻ ‘ഔപചാരികമായി പ്രഖ്യാപിച്ചിരിക്കുന്നു’ എന്നു നൽകി.
