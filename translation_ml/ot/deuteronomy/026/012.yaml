source:
  edition: WLC
  text: כִּ֣י תְכַלֶּ֞ה לַ֠/עְשֵׂר אֶת כָּל מַעְשַׂ֧ר תְּבוּאָתְ/ךָ֛ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ת שְׁנַ֣ת הַֽ/מַּעֲשֵׂ֑ר וְ/נָתַתָּ֣ה לַ/לֵּוִ֗י לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָֽ/אַלְמָנָ֔ה וְ/אָכְל֥וּ בִ/שְׁעָרֶ֖י/ךָ וְ/שָׂבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: ml
  text: നിങ്ങളുടെ വിളവിന്റെ ദശാംശം മുഴുവനും മൂന്നാം വർഷത്തിൽ—ദശാംശത്തിന്റെ വർഷത്തിൽ—വേർതിരിച്ചെടുത്തു തീർന്നശേഷം, അത് ലേവ്യനും നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശിക്കും അപ്പനില്ലാത്തവനും വിധവയ്ക്കും കൊടുക്കണം. അവർ നിങ്ങളുടെ പട്ടണങ്ങളിൽവെച്ച്[a] ഭക്ഷിച്ച് തൃപ്തരാകട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിങ്ങളുടെ കവാടങ്ങൾക്കുള്ളിൽ.” അതായത്, നിങ്ങളുടെ പട്ടണങ്ങളിൽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תְכַלֶּה לַעְשֵׂר
  choice: വേർതിരിച്ചെടുത്തു തീർന്നശേഷം
  rationale: כִּי ഇവിടെ കാലസാഹചര്യം അവതരിപ്പിക്കുന്നു; כלה എന്ന ക്രിയയുടെ പൂർത്തീകരണഭാവവും עשר എന്നതിന്റെ ദശാംശം വേർതിരിക്കുന്ന പ്രവൃത്തിയും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു.
- source_word: מַעְשַׂר תְּבוּאָתְךָ
  choice: നിങ്ങളുടെ വിളവിന്റെ ദശാംശം
  rationale: מַעְשַׂר എന്നതിന് സ്ഥിരവും കൃത്യവുമായ ‘ദശാംശം’; תְּבוּאָה കൃഷിയിൽനിന്നുള്ള ഉൽപ്പാദനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വിളവ്’ എന്ന് നൽകി.
- source_word: שְׁנַת הַמַּעֲשֵׂר
  choice: ദശാംശത്തിന്റെ വർഷം
  rationale: മൂന്നാം വർഷത്തെ പ്രത്യേക ദശാംശക്രമവുമായി ബന്ധിപ്പിക്കുന്ന എബ്രായ സംയുക്തപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לַגֵּר
  choice: നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശി
  rationale: גֵּר വെറും അപരിചിതനെയല്ല, ഇസ്രായേൽ സമൂഹത്തിനിടയിൽ താമസിക്കുന്ന അന്യദേശക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ഈ രൂപം സ്വീകരിച്ചു.
- source_word: לַיָּתוֹם
  choice: അപ്പനില്ലാത്തവൻ
  rationale: יָתוֹם എന്ന നിയമപരവും സാമൂഹികവുമായ വിഭാഗത്തിന്റെ പിതൃരഹിതത്വം വ്യക്തമാക്കുന്നു; പൊതുവായ ‘അനാഥൻ’ എന്നതിനെക്കാൾ ഉറവിടത്തിന്റെ സവിശേഷത നിലനിർത്തുന്നു.
- source_word: בִשְׁעָרֶיךָ
  choice: നിങ്ങളുടെ പട്ടണങ്ങളിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ കവാടങ്ങൾക്കുള്ളിൽ’ എന്നാണെങ്കിലും, ഇവിടെ കവാടങ്ങൾ പ്രാദേശിക വാസസ്ഥലങ്ങളെയോ പട്ടണങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; മുഖ്യവാചകത്തിൽ സ്വാഭാവിക അർഥം നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וְשָׂבֵעוּ
  choice: തൃപ്തരാകട്ടെ
  rationale: ഭക്ഷിച്ച് മതിയാകുക എന്ന ഫലഭാവം വ്യക്തമാക്കുന്നു; നിർദേശത്തിന്റെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: നിയമത്തിൽ പേരെടുത്തു പറയുന്ന സാമൂഹികമായി ദുർബലരായ വിഭാഗങ്ങൾ
  choice: ‘ലേവ്യൻ, നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശി, അപ്പനില്ലാത്തവൻ, വിധവ’ എന്നീ വ്യക്തമായ വിഭാഗങ്ങൾ നിലനിർത്തി.
  alternative: ‘മതശുശ്രൂഷകർ, കുടിയേറ്റക്കാർ, അനാഥർ, വിധവകൾ’ അല്ലെങ്കിൽ പൊതുവായി ‘ദരിദ്രർ’.
  rationale: വാക്യം ദശാംശത്തിന്റെ പ്രത്യേക ഗുണഭോക്താക്കളെ നിയമപരമായി പേരെടുത്തു പറയുന്നു. ആ വിഭാഗങ്ങളെ പൊതുവൽക്കരിക്കുന്നത് നിയമ-ഉടമ്പടി പശ്ചാത്തലം മങ്ങിയാക്കും.
- issue: בִשְׁעָרֶיךָ എന്ന പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും ആശയാർഥവും
  choice: മുഖ്യവാചകത്തിൽ ‘നിങ്ങളുടെ പട്ടണങ്ങളിൽ’; അടിക്കുറിപ്പിൽ ‘നിങ്ങളുടെ കവാടങ്ങൾക്കുള്ളിൽ’.
  alternative: മുഖ്യവാചകത്തിൽ ‘നിങ്ങളുടെ കവാടങ്ങൾക്കുള്ളിൽ’.
  rationale: എബ്രായത്തിൽ ‘കവാടങ്ങൾ’ പട്ടണങ്ങളെയോ പ്രാദേശിക സമൂഹങ്ങളെയോ സൂചിപ്പിക്കുന്ന മെറ്റോണിമിയാണ്. സാധാരണ മലയാളവായനക്കാർക്ക് ആശയം ഉടൻ വ്യക്തമാകാൻ പട്ടണങ്ങൾ എന്ന് നൽകി, ഉറവിടരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ ആവർത്തനവും ‘ദശാംശത്തിന്റെ വർഷം’ എന്ന ഉറവിടപ്രയോഗവും നിലനിർത്തിയപ്പോൾ, എബ്രായ പ്രയോഗമായ ‘കവാടങ്ങൾ’ ആശയാർഥത്തിൽ മുഖ്യവാചകത്തിലും അക്ഷരാർഥത്തിൽ അടിക്കുറിപ്പിലും നൽകി.
