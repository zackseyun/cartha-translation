revisions:
- from: 'നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ നീ ഇങ്ങനെ മറുപടി പറയണം: ‘എന്റെ പിതാവ് അലഞ്ഞുതിരിഞ്ഞിരുന്ന ഒരു അരാമ്യനായിരുന്നു.[a] അദ്ദേഹം ഈജിപ്തിലേക്കു ചെന്നു; വളരെ കുറച്ചുപേരുമായി അവിടെ പരദേശിയായി പാർത്തു. അവിടെവെച്ച് അദ്ദേഹം മഹത്തും ശക്തവും ജനബഹുലവുമായ ഒരു ജനതയായിത്തീർന്നു.’'
  to: 'നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ നീ ഇങ്ങനെ മറുപടി പറയണം: ‘എന്റെ പിതാവ് അലഞ്ഞുതിരിഞ്ഞിരുന്ന ഒരു അരാമ്യനായിരുന്നു.[a] അദ്ദേഹം ഈജിപ്തിലേക്കു ഇറങ്ങിച്ചെന്നു, വളരെ കുറച്ചുപേരുമായി അവിടെ പരദേശിയായി പാർത്തു. അവിടെവെച്ച് അദ്ദേഹം മഹത്തും ശക്തവും ജനബഹുലവുമായ ഒരു ജനതയായിത്തീർന്നു.’'
