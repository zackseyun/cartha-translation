  text: וְ/עָנִ֨יתָ וְ/אָמַרְתָּ֜ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲרַמִּי֙ אֹבֵ֣ד אָבִ֔/י וַ/יֵּ֣רֶד מִצְרַ֔יְמָ/ה וַ/יָּ֥גָר שָׁ֖ם בִּ/מְתֵ֣י מְעָ֑ט וַֽ/יְהִי שָׁ֕ם לְ/ג֥וֹי גָּד֖וֹל עָצ֥וּם וָ/רָֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: ml
  text: 'നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ നീ ഇങ്ങനെ മറുപടി പറയണം: ‘എന്റെ പിതാവ് അലഞ്ഞുതിരിഞ്ഞിരുന്ന ഒരു അരാമ്യനായിരുന്നു.[a] അദ്ദേഹം ഈജിപ്തിലേക്കു ഇറങ്ങിച്ചെന്നു, വളരെ കുറച്ചുപേരുമായി അവിടെ പരദേശിയായി പാർത്തു. അവിടെവെച്ച് അദ്ദേഹം മഹത്തും ശക്തവും ജനബഹുലവുമായ ഒരു ജനതയായിത്തീർന്നു.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ പിതാവ് നശിച്ചുകൊണ്ടിരുന്ന ഒരു അരാമ്യനായിരുന്നു.’ ഈ എബ്രായ ക്രിയാരൂപത്തിന് ‘അലഞ്ഞുതിരിയുന്ന’ എന്നും ‘നശിച്ചുകൊണ്ടിരിക്കുന്ന’ എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: നീ ഇങ്ങനെ മറുപടി പറയണം
  rationale: ആചാരപരമായ ഔപചാരിക പ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്ന ഇരട്ട എബ്രായ പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യാർഥവും ദൈവനാമമായ יהוה എന്നതിന്റെ വ്യക്തിത്വവും നിലനിർത്തുന്നു.
- source_word: אֲרַמִּי
  choice: അരാമ്യൻ
  rationale: ചരിത്രപരവും വംശീയവുമായ കൃത്യമായ സംജ്ഞ; ‘സുറിയാനി’ പോലുള്ള കാലാനന്തര അർഥക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: אֹבֵד
  choice: അലഞ്ഞുതിരിഞ്ഞിരുന്ന
  rationale: തുടർന്നുള്ള കുടിയേറ്റവിവരണത്തോട് യോജിക്കുന്ന സാധുവായ പങ്കാളിക്രിയാർഥം; ‘നശിച്ചുകൊണ്ടിരുന്ന’ എന്ന സാധുവായ മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אָבִי
  choice: എന്റെ പിതാവ്
  rationale: പ്രതിനിധിയായ പൂർവപിതാവിനെ സൂചിപ്പിക്കുന്ന ഏകവചനത്തിന്റെ നേരിട്ടുള്ളതും വാചാടോപപരവുമായ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: ഈജിപ്തിലേക്കു ചെന്നു
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കുന്നു; ‘ഇറങ്ങിച്ചെന്നു’ എന്ന ദിശാപ്രയോഗം ഇവിടെ അനാവശ്യമായി ഭൂപ്രകൃതിയർഥം മുൻനിർത്താം.
- source_word: וַיָּגָר שָׁם
  choice: അവിടെ പരദേശിയായി പാർത്തു
  rationale: גור സൂചിപ്പിക്കുന്ന വിദേശതാമസിയുടെ നില വെറും ‘താമസിച്ചു’ എന്നതിനെക്കാൾ വ്യക്തമായി നൽകുന്നു.
- source_word: בִּמְתֵי מְעָט
  choice: വളരെ കുറച്ചുപേരുമായി
  rationale: സംഘത്തിന്റെ സംഖ്യാല്പത്വം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיְהִי שָׁם לְגוֹי
  choice: അവിടെവെച്ച് അദ്ദേഹം ... ഒരു ജനതയായിത്തീർന്നു
  rationale: പൂർവപിതാവും അദ്ദേഹത്തിന്റെ സന്തതികളും തമ്മിലുള്ള പ്രതിനിധി ഏകവചനം നിലനിർത്തുന്നു.
- source_word: גָּדוֹל עָצוּם וָרָב
  choice: മഹത്തും ശക്തവും ജനബഹുലവുമായ
  rationale: വലിപ്പം, കരുത്ത്, സംഖ്യാബാഹുല്യം എന്നീ മൂന്നു ഊന്നലുകളും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֲרַמִּי אֹבֵד אָבִי എന്ന വാക്യഭാഗത്തിന്റെ വ്യാഖ്യാനം
  choice: എന്റെ പിതാവ് അലഞ്ഞുതിരിഞ്ഞിരുന്ന ഒരു അരാമ്യനായിരുന്നു
  alternative: എന്റെ പിതാവ് നശിച്ചുകൊണ്ടിരുന്ന ഒരു അരാമ്യനായിരുന്നു
  rationale: മസോരറ്റിക് സ്വരചിഹ്നക്രമത്തിൽ ‘എന്റെ പിതാവ്’ കർത്താവായുള്ള പങ്കാളിക്രിയാവായനയാണ് ഏറ്റവും നേരിട്ടുള്ളത്. אֹבֵד എന്നതിന് അലഞ്ഞുതിരിയുക എന്നും നശിച്ചുകൊണ്ടിരിക്കുക എന്നും അർഥസാധ്യതയുള്ളതിനാൽ രണ്ടാമത്തേത് അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു; ‘ഒരു അരാമ്യൻ എന്റെ പിതാവിനെ നശിപ്പിക്കാൻ ശ്രമിച്ചു’ എന്ന വായന കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
translation_notes:
  register: ആരാധനാപരമായ ഏറ്റുപറച്ചിലിന് യോജിച്ച ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ ആധുനിക മലയാളവായനക്കാർക്ക് വ്യക്തമായ ശൈലി ഉപയോഗിച്ചു. പ്രതിനിധിയായ പൂർവപിതാവിനെക്കുറിച്ചുള്ള ഏകവചനം ‘അദ്ദേഹം’ എന്ന ആദരസൂചക രൂപത്തിലൂടെ തുടർച്ചയായി സംരക്ഷിച്ചു.
