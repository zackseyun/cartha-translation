source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: ml
  text: “ഇപ്പോൾ ഇതാ, യഹ്‌വേ, അങ്ങ് എനിക്കു തന്ന മണ്ണിന്റെ വിളവിന്റെ ആദ്യഭാഗം[a] ഞാൻ കൊണ്ടുവന്നിരിക്കുന്നു.” പിന്നെ നീ അത് നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സന്നിധിയിൽ വെക്കണം; നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സന്നിധിയിൽ കുനിഞ്ഞു വണങ്ങണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മണ്ണിന്റെ ആദ്യഫലം” എന്നും “ദേശത്തിന്റെ ഉൽപ്പന്നത്തിന്റെ ആദ്യഭാഗം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ ഹീബ്രു ക്രിയ ശരീരം കുനിഞ്ഞ് വണങ്ങുന്ന പ്രവൃത്തിയെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; “ആരാധിക്കുക” എന്നത് അതിനെക്കാൾ വിശാലമായ വ്യാഖ്യാനപരമായ പരിഭാഷയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മുമ്പുള്ള വിശ്വാസപ്രഖ്യാപനത്തിൽനിന്ന് ഇപ്പോഴത്തെ സമർപ്പണത്തിലേക്കുള്ള മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; വാക്യബന്ധം നിലനിർത്താൻ തുടക്കത്തിലെ ആശയം സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: സമർപ്പിക്കുന്ന വസ്തുവിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു നിർദേശകകണത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: הֵבֵאתִי
  choice: ഞാൻ കൊണ്ടുവന്നിരിക്കുന്നു
  rationale: കൊണ്ടുവരൽ പൂർത്തിയായ പ്രവൃത്തിയാണെന്ന ഹീബ്രു perfect രൂപത്തിന്റെ ഭാവം ആചാരപ്രഖ്യാപനത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: മണ്ണിന്റെ വിളവിലെ ആദ്യഫലം
  rationale: רֵאשִׁית എന്ന ‘ആദ്യഭാഗം/ആദ്യത്തേത്’ എന്ന ആശയവും കാർഷികസന്ദർഭത്തിലെ פְּרִי, אֲדָמָה എന്നീ പദങ്ങളുടെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: അങ്ങ് എനിക്കു തന്ന
  rationale: വിളവ് ദൈവം നൽകിയ ദാനമാണെന്ന നേരിട്ടുള്ള അംഗീകാരം നിലനിർത്തുന്നു; ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് മാന്യമായ ‘അങ്ങ്’ ഉപയോഗിക്കുന്നു.
- source_word: וְהִנַּחְתּוֹ
  choice: പിന്നെ നീ അത് ... വെച്ച്
  rationale: ആചാരനിർദേശത്തിന്റെ ക്രമവും വസ്തു ദൈവസന്നിധിയിൽ വയ്ക്കുന്ന വ്യക്തമായ പ്രവൃത്തിയും പ്രകടമാക്കുന്നു.
- source_word: לִפְנֵי
  choice: സന്നിധിയിൽ
  rationale: വെറും സ്ഥാനസൂചനയെക്കാൾ ദൈവത്തിന്റെ സാന്നിധ്യത്തിൽ സമർപ്പിക്കുന്നു എന്ന ആരാധനാസന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: കുനിഞ്ഞ് നമസ്കരിക്കണം
  rationale: ശരീരം കുനിക്കുന്ന വ്യക്തമായ പ്രവൃത്തിയെ നിലനിർത്തുകയും ‘ആരാധിക്കുക’ എന്ന കൂടുതൽ വിശാലമായ വ്യാഖ്യാനത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രത്യേക നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുവായ സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: וְהִשְׁתַּחֲוִיתָ എന്ന ക്രിയയുടെ പരിധി
  choice: കുനിഞ്ഞ് നമസ്കരിക്കണം
  alternative: ആരാധിക്കണം; സാഷ്ടാംഗം വീഴണം
  rationale: ഈ ക്രിയ ശരീരം കുനിയുകയോ നിലംപതിക്കുകയോ ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ആരാധിക്കുക’ മാത്രം എന്നു പറഞ്ഞാൽ ശാരീരികഭാവം നഷ്ടപ്പെടും; ‘സാഷ്ടാംഗം വീഴുക’ എന്നു പറഞ്ഞാൽ ഹീബ്രു നിർബന്ധിക്കാത്ത പ്രത്യേക ശരീരനില അധികമായി നിർണ്ണയിക്കപ്പെടാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഉദ്ധരണിക്കുള്ളിൽ ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് ‘അങ്ങ്’ എന്നും, ആചാരനിർദേശം സ്വീകരിക്കുന്ന വ്യക്തിക്ക് മൂലപാഠത്തിലെ ഏകവചനത്തോട് ചേർന്ന് ‘നീ’ എന്നും ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ footnote markers അവയുടെ വിഷയങ്ങളിൽനിന്ന് മാറിയിരുന്നതിനാൽ [a] ആദ്യഫലത്തിനും [b] കുനിഞ്ഞ് നമസ്കരിക്കുന്നതിനും പിന്നാലെ യുക്തമായ സ്ഥാനങ്ങളിൽ ചേർത്തു.
