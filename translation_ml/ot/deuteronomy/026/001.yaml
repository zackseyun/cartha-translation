id: DEU.26.1
reference: Deuteronomy 26:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי תָב֣וֹא אֶל הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֥בְתָּ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്വെ നിനക്ക് അവകാശമായി നൽകുന്ന ദേശത്തേക്ക് നീ കടന്നുചെന്ന്, അതു കൈവശമാക്കി[a] അവിടെ താമസിക്കുമ്പോൾ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതു സ്വന്തമാക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം. ചില സന്ദർഭങ്ങളിൽ ഈ എബ്രായക്രിയയ്ക്ക് ‘അവകാശമായി നേടുക’ എന്നും അർഥമുണ്ട്; ഇവിടെ ദേശം കൈവശമാക്കുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവിടെ വസിക്കുമ്പോൾ’ അല്ലെങ്കിൽ ‘അവിടെ കുടിയേറുമ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …ചെയ്യുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യം അവതരിപ്പിക്കുന്ന സാധാരണ എബ്രായ കാലസൂചക പ്രയോഗം. മലയാളത്തിൽ സ്വാഭാവികമായി വാക്യാവസാനത്തെ ‘താമസിക്കുമ്പോൾ’ എന്ന ഘടനയിൽ അതിന്റെ കാലസംബന്ധമായ ബലം നിലനിർത്തുന്നു.
- source_word: תָבֹוא אֶל הָאָרֶץ
  choice: ദേശത്തേക്ക് നീ കടന്നുചെന്ന്
  rationale: בוא എന്ന ക്രിയയ്ക്ക് ‘വരുക/പ്രവേശിക്കുക’ എന്നർഥമുണ്ട്; ദേശത്തിന്റെ ഉള്ളിലേക്കുള്ള പ്രവേശനം സന്ദർഭത്തിൽ വ്യക്തമാക്കാൻ ‘കടന്നുചെന്ന്’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സാധാരണ സ്വീകരിക്കാവുന്ന ലിപ്യന്തരണമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തിലുള്ള ഉടമസ്ഥപ്രത്യയം നിലനിർത്തുകയും ‘യഹ്വെ’യോടുള്ള സ്വാഭാവിക മലയാളബന്ധം നൽകുകയും ചെയ്യുന്നു.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: നിനക്ക് അവകാശമായി നൽകുന്ന
  rationale: נֹתֵן എന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ സജീവവും സമീപസ്ഥവുമായ ദാനഭാവവും נַחֲלָהയുടെ അവകാശസ്വത്ത്/ഓഹരി എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: וִירִשְׁתָּהּ
  choice: അതു കൈവശമാക്കി
  rationale: ദേശസന്ദർഭത്തിൽ ירשׁ ഏറ്റെടുത്ത് അധീനമാക്കുക എന്ന സജീവ അർഥം വഹിക്കുന്നു. ‘അവകാശമാക്കി’ എന്ന ആവർത്തനവും അനാവശ്യമായ പരിമിതീകരണവും ഒഴിവാക്കുന്നു.
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: അവിടെ താമസിക്കുമ്പോൾ
  rationale: ישׁבയുടെ വസിക്കുക/കുടിയേറിപ്പാർക്കുക എന്ന സന്ദർഭാർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അതോടൊപ്പം വാക്യത്തിന്റെ കാലസൂചക ഘടന പൂർത്തിയാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ദേശം ദൈവത്തിന്റെ ദാനവും ഇസ്രായേലിന്റെ കൈവശപ്പെടുത്തലും ആയിരിക്കുന്ന ബന്ധം
  choice: ‘അവകാശമായി നൽകുന്ന’ എന്നും തുടർന്ന് ‘കൈവശമാക്കി’ എന്നും വേർതിരിച്ചു നിലനിർത്തുന്നു
  alternative: ദേശം ലഭിക്കുന്നതിനെ ഒറ്റ ലളിതപ്രസ്താവനയായി ചുരുക്കുക
  rationale: മൂലപാഠത്തിലെ പ്രവേശനം, ദൈവിക ദാനം, കൈവശപ്പെടുത്തൽ, താമസം എന്നീ ഘട്ടങ്ങൾ നിലനിർത്തുന്നത് ദൈവത്തിന്റെ ദാനത്തെയും മനുഷ്യരുടെ തുടർപ്രവർത്തനത്തെയും ഒട്ടിച്ചുരുക്കാതെ അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ രണ്ടാം പുരുഷ പുല്ലിംഗ ഏകവചന അഭിസംബോധന മലയാളത്തിലെ ‘നീ/നിന്റെ/നിനക്ക്’ വഴി നിലനിർത്തി. ഈ വാക്യം അടുത്ത നിർദേശത്തിലേക്ക് നയിക്കുന്ന ഉപവാക്യമാകുന്നതിനാൽ അവസാനത്തിൽ അർധവിരാമസ്വഭാവമുള്ള കോമ നിലനിർത്തി.
