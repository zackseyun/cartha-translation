source:
  edition: WLC
  text: הַ/יּ֣וֹם הַ/זֶּ֗ה יְהוָ֨ה אֱלֹהֶ֜י/ךָ מְצַוְּ/ךָ֧ לַ/עֲשׂ֛וֹת אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה וְ/אֶת הַ/מִּשְׁפָּטִ֑ים וְ/שָׁמַרְתָּ֤ וְ/עָשִׂ֨יתָ֙ אוֹתָ֔/ם בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: ml
  text: ഇന്നു നിന്റെ ദൈവമായ യഹോവ ഈ ചട്ടങ്ങളും ന്യായവിധികളും അനുഷ്ഠിക്കാൻ നിന്നോടു കൽപ്പിക്കുന്നു; നീ അവയെ നിന്റെ പൂർണ്ണഹൃദയത്തോടും നിന്റെ പൂർണ്ണജീവനോടുംകൂടെ[a] കാത്തുപാലിക്കുകയും അനുഷ്ഠിക്കുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പൂർണ്ണജീവൻ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രു പദത്തിന് “ആത്മാവ്,” “സ്വയം,” അല്ലെങ്കിൽ “സകല സത്ത” എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്നു
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഉടൻപ്രാബല്യവും ഉടമ്പടിസന്ദർഭത്തിലെ ഗൗരവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തെ നിലനിർത്തി, ഇസ്രായേലിനോടുള്ള ഉടമ്പടിപരമായ നേരിട്ടുള്ള അഭിസംബോധന സംരക്ഷിക്കുന്നു.
- source_word: מְצַוְּךָ
  choice: നിന്നോടു കല്പിക്കുന്നു
  rationale: വർത്തമാനകാല പങ്കാളിത്തരൂപത്തിന്റെ അടിയന്തരവും ഇപ്പോഴുള്ളതുമായ കല്പനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַעֲשׂוֹת
  choice: അനുഷ്ഠിക്കാൻ
  rationale: നിയമപരമായ നിർദേശങ്ങൾ പ്രവൃത്തിയിൽ നടപ്പാക്കുക എന്ന സന്ദർഭാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിയമിതമായി സ്ഥാപിക്കപ്പെട്ട വ്യവസ്ഥകൾ എന്ന അർത്ഥം നൽകുകയും തുടർന്നുള്ള מִשְׁפָּטִים എന്ന പദത്തിൽനിന്ന് വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַמִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: നിയമവിധികളോ നിർണയിക്കപ്പെട്ട ന്യായവ്യവസ്ഥകളോ എന്ന മൂലപദത്തിന്റെ നിയമപരമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: וְשָׁמַרְתָּ
  choice: പാലിച്ച്
  rationale: ഉടമ്പടിസന്ദർഭത്തിൽ കല്പനകൾ സൂക്ഷ്മമായി കാത്തുപാലിക്കുക എന്ന שמר-ന്റെ അർത്ഥം നൽകുന്നു.
- source_word: וְעָשִׂיתָ אֹתָם
  choice: അവ ... അനുഷ്ഠിക്കണം
  rationale: עשה എന്ന ധാതുവിന്റെ ആവർത്തനം മലയാളത്തിൽ അനുഷ്ഠിക്കുക എന്ന പദത്തിലൂടെ നിലനിർത്തി, പാലിക്കലും പ്രവൃത്തിയിൽ കൊണ്ടുവരലും ചേർന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּכָל לְבָבְךָ
  choice: പൂർണഹൃദയത്തോടും
  rationale: לֵבָב സൂചിപ്പിക്കുന്ന ചിന്ത, ഇച്ഛ, മനോഭാവം എന്നിവ ഉൾപ്പെടുന്ന ആന്തരിക സമഗ്രതയെ പരമ്പരാഗതവും സ്വാഭാവികവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: പൂർണമനസ്സോടുംകൂടെ
  rationale: נֶפֶשׁ എന്നതിന്റെ ജീവൻ, സ്വയം, മുഴുവൻ വ്യക്തിത്വം എന്നീ വിശാല അർത്ഥങ്ങൾ മലയാളത്തിലെ ‘മനസ്സ്’ മാത്രം എന്ന് ചുരുക്കാതെ, ‘പൂർണ-’ എന്ന ഘടകത്തോടൊപ്പം സമഗ്ര സമർപ്പണമായി അറിയിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടിനാമമായ יְהוָה-യുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിലെ സ്ഥാപിത ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധന
  choice: നിന്റെ / നിന്നോടു / നീ
  alternative: നിങ്ങളുടെ / നിങ്ങളോടു / നിങ്ങൾ
  rationale: ഹീബ്രു ഇസ്രായേലിനെ ഉടമ്പടിസമൂഹമായി ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു; ആ കൂട്ടായ ഏകവചനത്തിന്റെ പിരിമുറുക്ക് വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ മാനവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: പൂർണമനസ്സോടുംകൂടെ
  alternative: നിന്റെ മുഴുവൻ ജീവൻകൊണ്ടും / നിന്റെ സകല സത്തയോടുംകൂടെ
  rationale: ഒരു പ്രത്യേക ദ്വൈതവാദ മാനവശാസ്ത്രം ഇറക്കുമതി ചെയ്യാതെ സമഗ്ര വ്യക്തിസമർപ്പണം അറിയിക്കുന്നു; പദത്തിന്റെ ‘ജീവൻ/സ്വയം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ പദജോടിയുടെ വ്യത്യാസം ‘ചട്ടങ്ങൾ / ന്യായവിധികൾ’ എന്നിങ്ങനെ നിലനിർത്തിയിരിക്കുന്നു; ഹീബ്രുവിലെ ഏകവചന അഭിസംബോധനയും ‘പാലിക്കുക / അനുഷ്ഠിക്കുക’ എന്ന ഇരട്ട ഊന്നലും സംരക്ഷിച്ചിട്ടുണ്ട്.
