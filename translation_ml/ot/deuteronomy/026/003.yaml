reference: Deuteronomy 26:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָאתָ֙ אֶל הַ/כֹּהֵ֔ן אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/אָמַרְתָּ֣ אֵלָ֗י/ו הִגַּ֤דְתִּי הַ/יּוֹם֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ כִּי בָ֨אתִי֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵ֖י/נוּ לָ֥/תֶת לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: ml
  text: 'ആ ദിവസങ്ങളിൽ ശുശ്രൂഷയിലിരിക്കുന്ന പുരോഹിതന്റെ[a] അടുക്കൽ നീ ചെന്ന് അവനോടു പറയണം: “യാഹ്‌വെ നമ്മുടെ പിതാക്കന്മാരോടു[c] നമുക്കു നൽകാമെന്ന് സത്യംചെയ്ത ദേശത്തേക്കു ഞാൻ വന്നെത്തിയിരിക്കുന്നുവെന്ന് ഇന്നു ഞാൻ നിന്റെ ദൈവമായ യാഹ്‌വെയോടു പ്രഖ്യാപിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ആ ദിവസങ്ങളിൽ ഉണ്ടായിരിക്കുന്ന പുരോഹിതൻ”; അതായത്, അന്ന് പുരോഹിതനായി ശുശ്രൂഷ ചെയ്യുന്നയാൾ.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “ഇന്നു ഞാൻ പ്രഖ്യാപിച്ചിരിക്കുന്നു.” എബ്രായക്രിയാരൂപം, ഈ വാക്കുകൾ പറയുന്നതിലൂടെ തന്നെ പ്രഖ്യാപനം നിർവഹിക്കുന്ന അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കാം.'
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: “നമ്മുടെ പൂർവികർ.” എബ്രായത്തിൽ “നമ്മുടെ പിതാക്കന്മാർ” എന്നാണ്; ഇവിടെ പിതൃപുരുഷന്മാരെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: നീ ചെന്ന്
  rationale: בוא എന്ന ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘വരുക,’ ‘പോകുക,’ ‘പ്രവേശിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ പുരോഹിതന്റെ അടുക്കലേക്കുള്ള നീക്കം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ചെന്ന്’ എന്നു നൽകി; നിയമനിർദേശത്തിന്റെ ബലം ‘പറയണം’ എന്നതോടൊപ്പം നിലനിർത്തി.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാ-നിയമപരമായ ഈ സന്ദർഭത്തിൽ כֹּהֵן എന്നതിന്റെ സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: ആ കാലത്ത് ശുശ്രൂഷയിലിരിക്കുന്ന
  rationale: അക്ഷരാർഥം ‘ആ ദിവസങ്ങളിൽ ഉണ്ടായിരിക്കുന്ന.’ ഇവിടെ അന്ന് പുരോഹിതനായി സേവനം അനുഷ്ഠിക്കുന്നയാളെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായി ഇങ്ങനെ പരിഭാഷപ്പെടുത്തി.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: അവനോടു പറയണം
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള നിയമനിർദേശം വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: ഇന്നു … ഞാൻ പ്രഖ്യാപിക്കുന്നു
  rationale: എബ്രായ സമ്പൂർണക്രിയ ഇവിടെ ഉച്ചരിക്കുന്നതിലൂടെ തന്നെ പ്രഖ്യാപനം നിർവഹിക്കുന്ന പ്രയോഗമായിരിക്കാം. അതിനാൽ വെറും ഭൂതകാലമാക്കാതെ വർത്തമാനകാല പ്രഖ്യാപനമായി നൽകി.
- source_word: לַיהוָה
  choice: യാഹ്‌വെയോടു
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമമായ יהוה ശബ്ദലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തി.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: പുരോഹിതനോടു പറയുന്ന വാക്കുകളിൽ എബ്രായത്തിലെ രണ്ടാംപുരുഷ ഏകവചനം കൃത്യമായി നിലനിർത്തുന്നു; ‘നമ്മുടെ ദൈവം’ എന്ന് മിനുക്കിയിട്ടില്ല.
- source_word: כִּי בָאתִי
  choice: ഞാൻ എത്തിയിരിക്കുന്നുവെന്ന്
  rationale: ദേശത്തെത്തിയ സംഭവം ഇപ്പോഴത്തെ ആചാരപ്രഖ്യാപനവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നതിനെ മലയാളത്തിലെ പൂർത്തിവർത്തമാനരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל הָאָרֶץ
  choice: ദേശത്ത്
  rationale: വാഗ്ദത്തദേശത്തിലേക്കുള്ള പ്രവേശനത്തിന്റെ ലക്ഷ്യം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: യാഹ്‌വെ സത്യംചെയ്ത
  rationale: ഉടമ്പടിപരമായ ശപഥഭാഷ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לַאֲבֹתֵינוּ
  choice: നമ്മുടെ പിതാക്കന്മാർക്ക്
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ പിതൃപുരുഷന്മാരെ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
- source_word: לָתֶת לָנוּ
  choice: തരാമെന്ന്
  rationale: ദേശം ‘നമുക്ക് നൽകുക’ എന്ന വാഗ്ദാനത്തിന്റെ സമ്മാനസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- issue: ‘നമ്മുടെ പിതാക്കന്മാർ’ എന്നതിന്റെ സൂചന
  choice: നമ്മുടെ പിതാക്കന്മാർ
  alternative: നമ്മുടെ പൂർവികർ
  rationale: എബ്രായപദം പുല്ലിംഗ ബഹുവചനമാണ്; ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടിസന്ദർഭത്തിൽ പിതൃപുരുഷന്മാരെ സൂചിപ്പിക്കാൻ സാധ്യതയുള്ളതിനാൽ ലിംഗനിഷ്പക്ഷമായി മിനുക്കിയില്ല.
- issue: הִגַּדְתִּי എന്ന സമ്പൂർണക്രിയയുടെ കാലവും പ്രവർത്തനവും
  choice: ഞാൻ പ്രഖ്യാപിക്കുന്നു
  alternative: ഞാൻ പ്രഖ്യാപിച്ചിരിക്കുന്നു
  rationale: പ്രഖ്യാപനം ഈ വാക്കുകൾ ഉച്ചരിക്കുന്നതിലൂടെ തന്നെ നടക്കുന്നതായുള്ള പ്രയോഗസാധ്യത നിലനിർത്തുന്നു; ഭൂതകാലവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമ-ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. രണ്ടാംപുരുഷ ഏകവചനവും ‘നിന്റെ ദൈവം’ എന്ന ശ്രദ്ധേയമായ പ്രയോഗവും മിനുക്കാതെ നിലനിർത്തി. പ്രധാന പാഠത്തിൽ എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും അവ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങളുടെ പിന്നാലെ ചേർത്തിരിക്കുന്നു.
