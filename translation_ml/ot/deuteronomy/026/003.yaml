revisions:
- from: 'ആ കാലത്ത് ശുശ്രൂഷയിലിരിക്കുന്ന പുരോഹിതന്റെ അടുക്കൽ നീ ചെന്ന്[a] അവനോടു പറയണം: “നമ്മുടെ പിതാക്കന്മാർക്ക്[c] തരാമെന്ന് യാഹ്‌വെ സത്യംചെയ്ത ദേശത്ത് ഞാൻ എത്തിയിരിക്കുന്നുവെന്ന് ഇന്നു നിന്റെ ദൈവമായ യാഹ്‌വെയോടു ഞാൻ പ്രഖ്യാപിക്കുന്നു[b].”'
  to: 'ആ ദിവസങ്ങളിൽ ശുശ്രൂഷയിലിരിക്കുന്ന പുരോഹിതന്റെ[a] അടുക്കൽ നീ ചെന്ന് അവനോടു പറയണം: “യാഹ്‌വെ നമ്മുടെ പിതാക്കന്മാരോടു[c] നമുക്കു നൽകാമെന്ന് സത്യംചെയ്ത ദേശത്തേക്കു ഞാൻ വന്നെത്തിയിരിക്കുന്നുവെന്ന് ഇന്നു ഞാൻ നിന്റെ ദൈവമായ യാഹ്‌വെയോടു പ്രഖ്യാപിക്കുന്നു[b].”'
