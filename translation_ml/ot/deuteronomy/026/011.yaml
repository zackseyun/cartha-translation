source:
  edition: WLC
  text: וְ/שָׂמַחְתָּ֣ בְ/כָל הַ/טּ֗וֹב אֲשֶׁ֧ר נָֽתַן לְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/לְ/בֵיתֶ֑/ךָ אַתָּה֙ וְ/הַ/לֵּוִ֔י וְ/הַ/גֵּ֖ר אֲשֶׁ֥ר בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യാഹ്‌വേ നിനക്കും നിന്റെ കുടുംബത്തിനും നൽകിയ സകല നന്മയിലും നീയും ലേവ്യനും നിന്റെ ഇടയിൽ പാർക്കുന്ന പരദേശിയും[a] സന്തോഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “താമസക്കാരനായ വിദേശി.” എബ്രായത്തിലെ גֵּר എന്ന പദം ഇസ്രായേല്യനല്ലെങ്കിലും ഇസ്രായേലിന്റെ ഇടയിൽ അതിന്റെ സംരക്ഷണത്തിൽ പാർക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: സന്തോഷിക്കണം
  rationale: നിർദേശപരമായ സന്ദർഭത്തിൽ ഈ ക്രിയ ഭാവാർഥമുള്ള കല്പനയായി പ്രവർത്തിക്കുന്നു. വികാരപരമായ സന്തോഷവും ഉത്സവസന്ദർഭവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּכָל הַטּוֹב
  choice: സകല നന്മയിലും
  rationale: ലഭിച്ച അനുഗ്രഹങ്ങളുടെ സമഗ്രതയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: നിനക്ക് ... നൽകിയ
  rationale: പൂർത്തിയായ ദാനത്തെയും അതിന്റെ ഇപ്പോഴുള്ള ഫലത്തെയും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ശീർഷകം പകരംവയ്ക്കാതെ ചതുരക്ഷര ദൈവനാമത്തെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: ഉടമ്പടിബന്ധം സൂചിപ്പിക്കുന്ന രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം സംരക്ഷിക്കുന്നു.
- source_word: וּלְבֵיתֶךָ
  choice: നിന്റെ കുടുംബത്തിനും
  rationale: ഇവിടെ בַּיִת ഭൗതികമായ വീടിനേക്കാൾ കുടുംബം/ഗൃഹസമൂഹം എന്ന സാമൂഹിക അർഥത്തിലാണ്.
- source_word: אַתָּה
  choice: നീയും
  rationale: എബ്രായത്തിലെ ഊന്നലുള്ള വ്യക്തമായ സർവനാമം പങ്കാളികളുടെ പട്ടികയിൽ നിലനിർത്തുന്നു.
- source_word: הַלֵּוִי
  choice: ലേവ്യൻ
  rationale: ലേവി ഗോത്രത്തിലെ അംഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും കൃത്യവുമായ മലയാള പദം.
- source_word: הַגֵּר
  choice: പരദേശി
  rationale: ഇസ്രായേലിന്റെ ഇടയിൽ സംരക്ഷണത്തിൻ കീഴിൽ പാർക്കുന്ന അന്യദേശക്കാരനെ സൂചിപ്പിക്കുന്ന വായനാസൗകര്യമുള്ള പദം; നിയമ-സാമൂഹിക സൂക്ഷ്മത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: നിന്റെ ഇടയിൽ പാർക്കുന്ന
  rationale: സമൂഹത്തിനുള്ളിലെ സ്ഥിരതാമസത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനു പകരം ഒരു ശീർഷകം ചേർക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പട്ടികയുടെ എബ്രായ ഊന്നൽ ‘നീയും ... ലേവ്യനും ... പരദേശിയും’ എന്ന ഘടനയിൽ സംരക്ഷിച്ചു; വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ക്രമപ്പെടുത്തി.
