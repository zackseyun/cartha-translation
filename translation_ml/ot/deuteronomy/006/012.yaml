  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of servants.
translation:
  language: ml
  text: ഈജിപ്തുദേശത്തുനിന്ന്, അടിമകളുടെ ഭവനത്തിൽനിന്ന്, നിന്നെ പുറത്തുകൊണ്ടുവന്ന യഹ്‌വേയെ നീ മറന്നുപോകാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “അടിമത്തത്തിന്റെ ഭവനത്തിൽനിന്ന്.” എബ്രായത്തിൽ അക്ഷരാർഥം “അടിമകളുടെ ഭവനത്തിൽനിന്ന്” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: നീ സൂക്ഷിച്ചുകൊള്ളുക
  rationale: നിഫാൽ ആജ്ഞാരൂപം വ്യക്തിപരമായ ജാഗ്രതയ്ക്കുള്ള ശക്തമായ മുന്നറിയിപ്പാണ്. രണ്ടാംപുരുഷ ഏകവചനത്തെ ‘നീ’ എന്നു വ്യക്തമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായ ആജ്ഞാശൈലി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: פֶּן תִּשְׁכַּח
  choice: നീ മറന്നുപോകാതിരിക്കാൻ
  rationale: פֶּן അവതരിപ്പിക്കുന്ന ഒഴിവാക്കേണ്ട അപകടത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ നിരോധനോദ്ദേശ്യഘടനയിലൂടെ പ്രകടിപ്പിക്കുന്നു; ‘മറക്കുക’ എന്നതിന് ഉടമ്പടിസംബന്ധമായ അവഗണനയുടെ ധ്വനി സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള സമീപ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: הוֹצִיאֲךָ
  choice: നിന്നെ പുറപ്പെടുവിച്ച
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം പുറപ്പാട് സന്ദർഭത്തിൽ ‘പുറത്തുകൊണ്ടുവരുക/പുറപ്പെടുവിക്കുക’ എന്നാണ്; സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം തിരഞ്ഞെടുത്തു.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: മൂലത്തിലെ ‘ദേശം’ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ചേർത്തെഴുതുന്ന സ്വാഭാവിക രൂപം ഉപയോഗിക്കുന്നു.
- source_word: מִבֵּית עֲבָדִים
  choice: അടിമകളുടെ ഭവനത്തിൽനിന്ന്
  rationale: עֲבָדִים എന്ന മൂർത്തമായ ബഹുവചനപദത്തെ ‘അടിമകൾ’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു; בֵּית എന്നത് ‘ഭവനം’ എന്നു നൽകി എബ്രായ രൂപകം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ നാമം ലിപ്യന്തരിച്ചു; പ്രത്യേക സമ്പ്രദായവായന നിർബന്ധിക്കുന്നില്ല.
- issue: עֲבָדִים എന്ന പദത്തിന്റെ സാമൂഹിക നില
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / അടിമത്തം
  rationale: ഇവിടെ ഈജിപ്തിലെ യഥാർത്ഥ അടിമസ്ഥിതിയാണ് ഉദ്ദേശിക്കുന്നത്. മൂലത്തിലെ മൂർത്തമായ ബഹുവചനം നിലനിർത്തുന്നത് അർത്ഥത്തെ മൃദൂകരിക്കാതെയും അമൂർത്തമാക്കാതെയും അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള മുന്നറിയിപ്പുശൈലി. രണ്ടാംപുരുഷ ഏകവചനം നിലനിർത്തിയിട്ടുണ്ട്. മൂലത്തിലെ സമാന്തരമായ രണ്ട് ‘നിന്ന്’ ഘടകങ്ങളും എബ്രായത്തിലെ ‘അടിമകളുടെ ഭവനം’ എന്ന മൂർത്തരൂപകവും സംരക്ഷിച്ചു.
