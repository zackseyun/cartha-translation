source:
  edition: WLC
  text: לַ/הֲדֹ֥ף אֶת כָּל אֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/019.yaml
  text: to drive out all your enemies from before you[b][a], as Yahweh has spoken.
translation:
  language: ml
  text: നിന്റെ സകല ശത്രുക്കളെയും നിന്റെ മുമ്പിൽനിന്ന്[b] തുരത്തിക്കളയാൻ—യഹ്‌വെ അരുളിച്ചെയ്തതുപോലെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പറഞ്ഞതുപോലെ.” എബ്രായ ക്രിയ അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞു’ എന്നാണ്; മുമ്പ് ഉച്ചരിച്ച ദൈവിക വചനം ഇപ്പോഴും പ്രാബല്യത്തിലാണെന്ന ആശയം സന്ദർഭത്തിലുണ്ട്.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “നിന്റെ മുമ്പിൽനിന്ന്”; ശത്രുക്കളെ ഒരാളുടെ വഴിയിൽനിന്നോ സാന്നിധ്യത്തിൽനിന്നോ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: לַהֲדֹף
  choice: ഓടിച്ചുകളയേണ്ടതിന്
  rationale: לְ ചേർന്ന infinitive construct മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്നു. נדף എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ശത്രുക്കളെ നീക്കിക്കളയുക, ഓടിച്ചുകളയുക എന്ന കാരകാർഥം നൽകുന്നു.
- source_word: אֶת
  choice: '[നേരിട്ടുള്ള കർമസൂചകം; പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള കർമസൂചകത്തിന് മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനതയില്ല; വിഭക്തിഘടനയിലൂടെയാണ് അർഥം പ്രകടമാകുന്നത്.
- source_word: כָּל
  choice: സകല
  rationale: ബഹുവചന നാമത്തിനു മുമ്പുള്ള כָּל-ന്റെ സമഗ്രതാബോധം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: אֹיְבֶיךָ
  choice: നിന്റെ ശത്രുക്കളെ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം നിലനിർത്തുകയും കർമവിഭക്തിയോടെ സ്വാഭാവിക മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: മുൻപിൽ/സന്നിധിയിൽനിന്ന് എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും, വഴിയിൽനിന്നോ സാന്നിധ്യത്തിൽനിന്നോ നീക്കുന്നതെന്ന സൈനികസന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെ
  rationale: മുമ്പുണ്ടായ ദൈവിക വചനവുമായി ഉള്ള അനുരൂപത ചുരുക്കമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: דִּבֶּר
  choice: അരുളിച്ചെയ്തത്
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘പറഞ്ഞു/സംസാരിച്ചു’ എന്നത് ദൈവിക വചനത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളത്തിൽ നൽകുന്നു; ‘വാഗ്ദാനം ചെയ്തു’ എന്ന സന്ദർഭാനുമാനം വാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോനെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു.
- issue: ഉടമ്പടിസന്ദർഭത്തിൽ דִּבֶּר എന്നതിന്റെ ബലം
  choice: അരുളിച്ചെയ്തത്
  alternative: പറഞ്ഞത്; വാഗ്ദാനം ചെയ്തത്
  rationale: മുമ്പ് ഉച്ചരിച്ച ദൈവിക വചനം ഇപ്പോഴും പ്രാബല്യത്തിലാണെന്ന സന്ദർഭബോധം അനുവദിക്കുമ്പോഴും, ക്രിയയെ ‘വാഗ്ദാനം ചെയ്തു’ എന്ന് വ്യാഖ്യാനിച്ച് നിർണ്ണയിക്കാതെ അതിന്റെ ‘സംസാരിച്ചു’ എന്ന അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിന്റെ വ്യാകരണതുടർച്ചയായതിനാൽ ഉദ്ദേശ്യസൂചകമായ ‘-േണ്ടതിന്’ നിലനിർത്തി. ‘സകല’ എന്ന പദം സമഗ്രതയും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവവും നൽകുന്നു; അതേസമയം വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
