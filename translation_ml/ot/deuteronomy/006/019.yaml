revisions:
- from: നിന്റെ മുമ്പിൽനിന്ന് നിന്റെ സകല ശത്രുക്കളെയും ഓടിച്ചുകളയേണ്ടതിന്—യഹ്‌വെ അരുളിച്ചെയ്തതുപോലെ.[a][b]
  to: നിന്റെ സകല ശത്രുക്കളെയും നിന്റെ മുമ്പിൽനിന്ന്[b] തുരത്തിക്കളയാൻ—യഹ്‌വെ അരുളിച്ചെയ്തതുപോലെ.[a]
  rationale: ഉദ്ദേശ്യസൂചകമായ എബ്രായ infinitive-നെ മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘ഓടിച്ചുകളയേണ്ടതിന്’ എന്നത് ‘തുരത്തിക്കളയാൻ’ എന്ന് തിരുത്തി. വിശദീകരണ പാദക്കുറിപ്പുകൾ അവ ബന്ധപ്പെട്ട പദങ്ങളോടു ചേർത്ത് സ്ഥാപിച്ചു. മറ്റെല്ലാ അർഥഘടകങ്ങളും, ദൈവനാമവും, ദൈവവചനത്തിന്റെ മുൻകാല ഉച്ചാരണത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയും നിലനിർത്തി.
