base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ നിനക്കു നൽകുമെന്നു നിന്റെ പിതാക്കന്മാരായ[a] അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരോടു സത്യംചെയ്ത ദേശത്തേക്കു നിന്നെ കൊണ്ടുവരുമ്പോൾ—നീ പണിയാത്ത വലുതും നല്ലതുമായ പട്ടണങ്ങൾ നിനക്കു നൽകാൻ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ പൂർവികരായ.’ എബ്രായപാഠത്തിൽ ‘നിന്റെ പിതാക്കന്മാർ’ എന്നാണ്; സന്ദർഭത്തിൽ അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരെ പ്രത്യേകം പേരെടുത്തുപറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: കൊണ്ടുവരുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യത്തെ അവതരിപ്പിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി നൽകി.
- source_word: יְבִיאֲךָ
  choice: നിന്നെ കൊണ്ടുവരുമ്പോൾ
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരകഭാവം ‘കൊണ്ടുവരുക’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പരിചിത ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തിന്റെ അർഥം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: നിയമാവർത്തനത്തിലെ വാഗ്ദത്തഭൂമിയുടെ ഉടമ്പടിപരമായ പശ്ചാത്തലം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: തരാമെന്ന് ... സത്യംചെയ്ത
  rationale: נשבע എന്ന പദത്തിലെ ശപഥഭാവം ‘സത്യംചെയ്ത’ എന്ന് നേരിട്ട് നിലനിർത്തുകയും לָתֶת לָךְ എന്ന ലക്ഷ്യം അതോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്തു.
- source_word: לַאֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരായ
  rationale: പുരുഷലിംഗ ബഹുവചന ബന്ധുപദവും പിന്നാലെ പേരെടുത്തുപറയുന്ന അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരിലേക്കുള്ള പ്രത്യേക സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും
  rationale: ഓരോ പേരിനോടുമുള്ള ആവർത്തിത എബ്രായ ബന്ധസൂചന മലയാളത്തിലെ ‘-നോടും’ രൂപത്തിൽ പ്രതിഫലിപ്പിച്ചു.
- source_word: לָתֶת לָךְ
  choice: നിനക്കു തരാമെന്ന്
  rationale: ദാനത്തിന്റെ ലക്ഷ്യവും രണ്ടാംപുരുഷ സ്വീകർത്താവും സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: വലുതും നല്ലതുമായ പട്ടണങ്ങൾ
  rationale: גדל എന്നതിന്റെ വലിപ്പവും טוב എന്നതിന്റെ ഗുണമേന്മ/അഭിലഷണീയതയും അധിക വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: നീ പണിയാത്ത
  rationale: നിഷേധത്തോടുകൂടിയ രണ്ടാംപുരുഷ ഏകവചന ക്രിയയെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാള ആപേക്ഷികരൂപത്തിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ കൊണ്ട് പകരാതെ നാമം ലിപ്യന്തരിച്ചു.
- issue: לַאֲבֹתֶיךָ എന്ന ബന്ധുപദത്തിലെ ലിംഗവും പ്രത്യേകതയും
  choice: നിന്റെ പിതാക്കന്മാരായ
  alternative: നിന്റെ പൂർവികരായ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനവും അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരെ ഉടൻ വ്യക്തമാക്കുന്ന സന്ദർഭവും കൃത്യമായി സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണ്ണവിരാമത്തിനു പകരം ദീർഘവിരാമം നിലനിർത്തി; നഗരങ്ങളെ ദേശത്തിന്റെ ഉള്ളടക്കമായി വ്യക്തമാക്കാൻ ‘നിറഞ്ഞ’ എന്ന സ്വാഭാവിക ബന്ധപദം ഉപയോഗിച്ചു.
