reference: Deuteronomy 6:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ וּ/בְ/כָל מְאֹדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/005.yaml
  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെയെ നിന്റെ മുഴുവൻ ഹൃദയത്തോടും നിന്റെ മുഴുവൻ പ്രാണനോടും നിന്റെ മുഴുവൻ ശക്തിയോടുംകൂടെ സ്നേഹിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: സ്നേഹിക്കണം
  rationale: സംയോജകാവ്യയത്തോടുകൂടിയ ഖാൽ പൂർണക്രിയാരൂപം ഈ നിയമപരവും പ്രബോധനാത്മകവുമായ സന്ദർഭത്തിൽ കല്പനാബലം വഹിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘സ്നേഹിക്കണം’ ആ ബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രൂപത്തിൽ ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും ഇവിടെ ഏകവചന സൂചകത്തോടെ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളവാക്യഘടനയിൽ ദൈവനാമത്തോടുള്ള ബന്ധം ‘നിന്റെ ദൈവമായ’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּכָל
  choice: പൂർണ…ത്തോടും
  rationale: മൂന്നു പ്രയോഗങ്ങളിലും ആവർത്തിക്കുന്ന בְּכָל സമ്പൂർണ സമർപ്പണത്തെ ഊന്നുന്നു. ‘പൂർണ’ എന്ന ആവർത്തനം ആ ഘടനയും സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: לְבָבְךָ
  choice: നിന്റെ പൂർണഹൃദയത്തോടും
  rationale: לֵבָב വികാരത്തെക്കാൾ വിശാലമായി ചിന്തയും ഇച്ഛയും ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിയെ സൂചിപ്പിക്കാം. ‘ഹൃദയം’ പരിചിതവും വിശാലത നിലനിർത്തുന്നതുമായ തുല്യപദമാണ്.
- source_word: נַפְשְׁךָ
  choice: പൂർണപ്രാണനോടും
  rationale: נֶפֶשׁ പ്രാണൻ, ജീവൻ, സ്വയം/വ്യക്തിത്വം എന്നീ അർഥങ്ങൾ വഹിക്കാം. ‘പ്രാണൻ’ പരമ്പരാഗത ഗൗരവവും സമഗ്രജീവന്റെ ആശയവും നിലനിർത്തുന്നു; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מְאֹדֶךָ
  choice: പൂർണശക്തിയോടും
  rationale: מְאֹד സാധാരണയായി ‘വളരെ/അധികം’ എന്ന ആശയവുമായി ബന്ധപ്പെട്ടതും ഇവിടെ നാമസദൃശമായി സമഗ്രശേഷി, തീവ്രത, വിഭവങ്ങൾ എന്നിവ സൂചിപ്പിക്കുന്നതുമാണ്. ‘ശക്തി’ സ്വാഭാവികമായ മലയാള തുല്യപദമാണ്; വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ഹൃദയം, പ്രാണൻ, ശക്തി എന്നീ മനുഷ്യസംബന്ധിയായ പദങ്ങളുടെ ബന്ധം
  choice: പദങ്ങളെ വേർതിരിച്ചുതന്നെ നിലനിർത്തി സമഗ്രസമർപ്പണം സൂചിപ്പിക്കുക
  alternative: മനസ്സ്, ജീവൻ, വിഭവങ്ങൾ എന്നിങ്ങനെ അർഥം വിശദീകരിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: ഈ എബ്രായ പദങ്ങൾ ആധുനിക മനശ്ശാസ്ത്രത്തിലെ കൃത്യമായി വേർതിരിച്ച ഘടകങ്ങളല്ല; മുഴുവൻ വ്യക്തിയെയും ഉൾക്കൊള്ളുന്ന പരസ്പരം മുട്ടിനിൽക്കുന്ന ആശയങ്ങളാണ്. അതിനാൽ അവയുടെ വ്യത്യാസവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തിക്കുന്ന സമഗ്രത പകരാൻ ‘പൂർണ’ മൂന്നു തവണ നിലനിർത്തി; സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ ഭാഷ ഒഴിവാക്കി.
