revisions:
- from: നിന്റെ ദൈവമായ യഹ്‌വെയെ നിന്റെ പൂർണഹൃദയത്തോടും പൂർണപ്രാണനോടും[a] പൂർണശക്തിയോടും[b] കൂടെ സ്നേഹിക്കണം.
  to: നിന്റെ ദൈവമായ യഹ്‌വെയെ നിന്റെ മുഴുവൻ ഹൃദയത്തോടും നിന്റെ മുഴുവൻ പ്രാണനോടും നിന്റെ മുഴുവൻ ശക്തിയോടുംകൂടെ സ്നേഹിക്കണം.
  rationale: The revision corrects the transliteration of Yahweh and replaces the less idiomatic repeated compounds with natural Malayalam expressions that explicitly preserve the source’s repeated “your all” structure. The lexical footnotes are tightened to state alternatives without adding interpretation.
