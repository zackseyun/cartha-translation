  text: וּ/בָ֨תִּ֜ים מְלֵאִ֣ים כָּל טוּב֮ אֲשֶׁ֣ר לֹא מִלֵּאתָ֒ וּ/בֹרֹ֤ת חֲצוּבִים֙ אֲשֶׁ֣ר לֹא חָצַ֔בְתָּ כְּרָמִ֥ים וְ/זֵיתִ֖ים אֲשֶׁ֣ר לֹא נָטָ֑עְתָּ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: ml
  text: നീ നിറയ്ക്കാത്ത സകല നല്ല വസ്തുക്കളും നിറഞ്ഞ വീടുകളും, നീ വെട്ടിയുണ്ടാക്കാത്ത പാറയിൽ വെട്ടിയ ജലസംഭരണികളും[a], നീ നട്ടിട്ടില്ലാത്ത മുന്തിരിത്തോട്ടങ്ങളും ഒലിവുമരങ്ങളും—നീ തിന്നുകയും തൃപ്തനാകുകയും ചെയ്യും[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം സാധാരണ കിണറുകളെയല്ല, വെള്ളം സംഭരിക്കാൻ പാറയിൽ വെട്ടിയുണ്ടാക്കിയ ജലസംഭരണികളെയാണ് ഇവിടെ കൂടുതൽ കൃത്യമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു വിവർത്തനം: “നീ തിന്നുകയും മതിവരുകയും ചെയ്യും.” ഈ ക്രിയകൾ ഇസ്രായേൽ ദേശത്തു പ്രവേശിക്കുമ്പോൾ സംഭവിക്കാനിരിക്കുന്ന കാര്യങ്ങളുടെ പരമ്പര തുടരുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָתִּים
  choice: വീടുകൾ
  rationale: ഭൗതിക കെട്ടിടങ്ങളെ സൂചിപ്പിക്കുന്ന സാധാരണവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: מְלֵאִים כָּל טוּב
  choice: സകല നല്ല വസ്തുക്കളും നിറഞ്ഞ
  rationale: ഇവിടെ טוּב ധാർമ്മിക നന്മയെക്കാൾ അഭിലഷണീയമായ സാധനങ്ങളെയും വിഭവങ്ങളെയും വ്യാപകമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר לֹא מִלֵּאתָ
  choice: നീ നിറയ്ക്കാത്ത
  rationale: ഏകവചനത്തിലുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും, ഇസ്രായേൽ അധ്വാനിച്ചുണ്ടാക്കാത്ത ദാനങ്ങളെന്ന വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: בֹרֹת חֲצוּבִים
  choice: പാറയിൽ വെട്ടിയ ജലസംഭരണികൾ
  rationale: בּוֹרֹת എന്നത് ഈ പശ്ചാത്തലത്തിൽ വെള്ളം ശേഖരിക്കാൻ പാറയിൽ വെട്ടിയ കുഴികളെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ കിണറുകൾ എന്നു പറയുന്നതിനെക്കാൾ കൃത്യം.
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: നീ വെട്ടിയുണ്ടാക്കാത്ത
  rationale: חצב എന്ന ക്രിയയുടെ പാറ വെട്ടുന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നതിനൊപ്പം സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: כְּרָמִים
  choice: മുന്തിരിത്തോട്ടങ്ങൾ
  rationale: ഒറ്റപ്പെട്ട മുന്തിരിവള്ളികളല്ല, കൃഷിചെയ്ത തോട്ടങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: זֵיתִים
  choice: ഒലിവുമരങ്ങൾ
  rationale: നട്ടുവളർത്തുന്ന വിഭവങ്ങളുടെ പട്ടികയിൽ മരങ്ങളെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക വിവർത്തനം.
- source_word: אֲשֶׁר לֹא נָטָעְתָּ
  choice: നീ നട്ടിട്ടില്ലാത്ത
  rationale: ആവർത്തിക്കുന്ന ബന്ധവാക്യരീതിയും ഏകവചന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: നീ തിന്നു തൃപ്തനാകും
  rationale: സന്ദർഭത്തിലെ ഭാവികാല സംഭവപരമ്പര വ്യക്തമാക്കുകയും ശാരീരികമായി മതിവരുവോളം ഭക്ഷിക്കുന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വാഗ്ദത്ത സമൃദ്ധിയുടെ സ്വഭാവം
  choice: ദൈവം നൽകുന്ന, ഇസ്രായേൽ സ്വന്തമായി സൃഷ്ടിക്കാത്ത ഭൗതിക വിഭവങ്ങളുടെ പട്ടികയായി അവതരിപ്പിച്ചു
  alternative: ഈ വാക്യത്തിനുള്ളിൽത്തന്നെ മുന്നറിയിപ്പോ അനധികൃത കൈവശപ്പെടുത്തലെന്ന വിലയിരുത്തലോ ചേർക്കുക
  rationale: മുന്നറിയിപ്പ് അടുത്ത വാക്യത്തിലാണ്; ഈ വാക്യം വീടുകൾ, ജലസംഭരണികൾ, കൃഷിത്തോട്ടങ്ങൾ എന്നിവയുടെ ലഭ്യതയെ മാത്രം വിവരിക്കുന്നു.
- issue: രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധന
  choice: ‘നീ/നിനക്കു’ എന്ന ഏകവചനം നിലനിർത്തി
  alternative: ‘നിങ്ങൾ’ എന്ന ബഹുവചനം ഉപയോഗിക്കുക
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടിപരമായ രീതിയിൽ എബ്രായമൂലം ഇസ്രായേലിനെ സമാഹാര ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു.
- issue: മുൻവാക്യത്തിൽനിന്നുള്ള വ്യാകരണബന്ധം
  choice: ‘അവൻ നിനക്കു തരും’ ചേർത്ത് മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന അർഥം വ്യക്തമാക്കി
  alternative: വാക്യഭാഗത്തെ ‘വീടുകളും...’ എന്ന പട്ടികയായി മാത്രം വിടുക
  rationale: 6:10-ൽ ആരംഭിക്കുന്ന ഭാവികാല ദാനപരമ്പര 6:11-ലും തുടരുന്നു; മലയാളത്തിൽ ഒറ്റവാക്യമായി പ്രസിദ്ധീകരിക്കുമ്പോൾ ആശയം അപൂർണമാകാതിരിക്കാൻ മുൻസന്ദർഭത്തിലെ നിയന്ത്രകക്രിയ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘ജലസംഭരണി’ എന്ന കൃത്യപദത്തിന് ‘പാറയിൽ വെട്ടിയ’ എന്നു ചേർത്ത് പുരാതന നിർമ്മിതിയുടെ രൂപം വ്യക്തമാക്കി. വാക്യം 6:10-ൽനിന്ന് വ്യാകരണപരമായി തുടരുന്നതിനാൽ മലയാളത്തിൽ സ്വതന്ത്രമായി വായിക്കാവുന്ന വിധം ‘അവൻ നിനക്കു തരും’ വ്യക്തമാക്കി.
