revisions:
- from: നീ നിറയ്ക്കാത്ത സകല നല്ല വസ്തുക്കളും നിറഞ്ഞ വീടുകളും, നീ വെട്ടിയുണ്ടാക്കാത്ത പാറയിൽ വെട്ടിയ ജലസംഭരണികളും[a], നീ നട്ടിട്ടില്ലാത്ത മുന്തിരിത്തോട്ടങ്ങളും ഒലിവുമരങ്ങളും അവൻ നിനക്കു തരും; നീ തിന്നു തൃപ്തനാകും[b]—
  to: നീ നിറയ്ക്കാത്ത സകല നല്ല വസ്തുക്കളും നിറഞ്ഞ വീടുകളും, നീ വെട്ടിയുണ്ടാക്കാത്ത പാറയിൽ വെട്ടിയ ജലസംഭരണികളും[a], നീ നട്ടിട്ടില്ലാത്ത മുന്തിരിത്തോട്ടങ്ങളും ഒലിവുമരങ്ങളും—നീ തിന്നുകയും തൃപ്തനാകുകയും ചെയ്യും[b]—
  rationale: The revision removes an explanatory clause imported from the preceding verse, thereby preserving the Hebrew verse’s dependent, enumerative syntax. It retains the precise rendering of rock-hewn cisterns and uses an explicit coordinated future construction for the final two Hebrew verbs. Footnote b is adjusted so that its alternative reflects the sense of satiation without implying a different lexical meaning.
