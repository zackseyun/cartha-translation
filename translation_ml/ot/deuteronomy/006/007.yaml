    rationale: The phrase ‘അവയെ അവരുടെ മനസ്സിൽ പതിപ്പിക്കണം’ uses ‘their,’ while the verse addresses ‘you’ and names ‘your sons.’ ‘നിന്റെ പുത്രന്മാരുടെ മനസ്സിൽ’ is precise and avoids ambiguity.
