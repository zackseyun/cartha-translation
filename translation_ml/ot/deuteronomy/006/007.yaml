source:
  edition: WLC
  text: וְ/שִׁנַּנְתָּ֣/ם לְ/בָנֶ֔י/ךָ וְ/דִבַּרְתָּ֖ בָּ֑/ם בְּ/שִׁבְתְּ/ךָ֤ בְּ/בֵיתֶ֨/ךָ֙ וּ/בְ/לֶכְתְּ/ךָ֣ בַ/דֶּ֔רֶךְ וּֽ/בְ/שָׁכְבְּ/ךָ֖ וּ/בְ/קוּמֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: ml
  text: നീ അവയെ നിന്റെ പുത്രന്മാർക്ക് ശ്രദ്ധയോടെ പഠിപ്പിക്കണം[a]. നീ വീട്ടിൽ ഇരിക്കുമ്പോഴും വഴിയിൽ നടക്കുമ്പോഴും കിടക്കുമ്പോഴും എഴുന്നേൽക്കുമ്പോഴും അവയെക്കുറിച്ച് സംസാരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവ നിന്റെ പുത്രന്മാരുടെ മനസ്സിൽ പതിപ്പിക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘മൂർച്ചകൂട്ടുക’ എന്നാണ്; ഇവിടെ അത് ആവർത്തിച്ചും ശ്രദ്ധാപൂർവവും പഠിപ്പിക്കുന്നതിനെ രൂപകമായി സൂചിപ്പിക്കുന്നു. എബ്രായത്തിൽ ‘പുത്രന്മാർ’ എന്നാണ്; വിപുലമായ അർഥത്തിൽ ഈ നിർദേശം കുടുംബത്തിലെ മക്കളെയും സംബന്ധിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: അവയെ ... ശ്രദ്ധയോടെ പഠിപ്പിക്കണം
  rationale: שׁנן എന്ന ക്രിയയുടെ അടിസ്ഥാനചിത്രം ‘മൂർച്ചകൂട്ടുക’ എന്നതാണെങ്കിലും, ഇവിടെ ആവർത്തിച്ചും ശ്രദ്ധാപൂർവവും മനസ്സിൽ പതിയുന്നവിധവും പഠിപ്പിക്കുക എന്ന രൂപകാലങ്കാരപരമായ അർഥമാണ്. ‘ശ്രദ്ധയോടെ പഠിപ്പിക്കണം’ എന്നത് ആ തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְבָנֶיךָ
  choice: നിന്റെ പുത്രന്മാരെ
  rationale: 'בנים എന്നത് ഇവിടെ രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനമാണ്: ‘നിന്റെ പുത്രന്മാർ’. മൂലത്തിന്റെ ലിംഗസൂചന നിലനിർത്താൻ പ്രധാനപാഠത്തിൽ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു.'
- source_word: וְדִבַּרְתָּ בָּם
  choice: അവയെക്കുറിച്ച് സംസാരിക്കണം
  rationale: דבר എന്ന ക്രിയയോടൊപ്പമുള്ള בם ഇവിടെ ‘അവയെക്കുറിച്ച്/അവയെപ്പറ്റി സംസാരിക്കുക’ എന്ന അർഥം നൽകുന്നു. ‘അവയെക്കുറിച്ച് സംസാരിക്കണം’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: നീ വീട്ടിൽ ഇരിക്കുമ്പോൾ
  rationale: בְ ചേർന്ന infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. പതിവായ ദൈനംദിന സന്ദർഭം ലളിതമായി വ്യക്തമാക്കുന്ന വിവർത്തനം.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: വഴിയിൽ നടക്കുമ്പോൾ
  rationale: דרך എന്നത് ‘വഴി/പാത’ എന്നും הלך ഇവിടെ വഴിയിലൂടെ പോകുക എന്നും സൂചിപ്പിക്കുന്നു. ‘വഴിയിൽ നടക്കുമ്പോൾ’ മൂലത്തിന്റെ ദൃശ്യരൂപത്തോട് അടുത്തതും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: וּבְשָׁכְבְּךָ
  choice: കിടക്കുമ്പോൾ
  rationale: കിടക്കുന്നതോ ഉറങ്ങാൻ പോകുന്നതോ ആയ സമയം സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: וּבְקוּמֶךָ
  choice: എഴുന്നേൽക്കുമ്പോൾ
  rationale: ഉറക്കത്തിൽനിന്നോ കിടപ്പിൽനിന്നോ എഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കിടക്കുമ്പോൾ’ എന്നതിനോട് സ്വാഭാവികമായി ജോടിയാകുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-പഠിപ്പിക്കലിലെ ലിംഗസൂചനയുള്ള സന്തതിപദം
  choice: നിന്റെ പുത്രന്മാരെ
  alternative: നിന്റെ മക്കളെ
  rationale: എബ്രായപദം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമായ ‘നിന്റെ പുത്രന്മാർ’ എന്നാണ്. അതിനാൽ പ്രധാനപാഠത്തിൽ ആ രൂപം നിലനിർത്തി; ഈ നിർദേശം കുടുംബത്തിലെ മക്കളിലേക്കു വിപുലമായി ബാധകമാകുന്ന ഉപയോഗപരിധി അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദൈനംദിന ജീവിതത്തിന്റെ നാല് സാഹചര്യങ്ങളും സമാന്തരമായി നിലനിർത്തി. മൂലത്തിലെ ഏകവചന അഭിസംബോധന ‘നീ/നിന്റെ’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
