  - severity: low
    issue: ‘പിൽക്കാലത്ത്’ is less natural for the idiomatic future sense of מָחָר.
    rationale: Although not inaccurate, ‘ഭാവിയിൽ’ is more natural modern standard Malayalam and conveys the general future-time sense without suggesting a remote later period.
