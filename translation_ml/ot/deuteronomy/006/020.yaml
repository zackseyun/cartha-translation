id: DEU.6.20
reference: Deuteronomy 6:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֑ר מָ֣ה הָ/עֵדֹ֗ת וְ/הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: ml
  text: ഭാവിയിൽ[a] നിന്റെ മകൻ നിന്നോടു, “നമ്മുടെ ദൈവമായ യഹ്‌വേ നിങ്ങളോടു കൽപ്പിച്ച സാക്ഷ്യങ്ങളും ചട്ടങ്ങളും ന്യായവിധികളും എന്താണ്?”[b] എന്നു ചോദിക്കുമ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ പദശഃ ‘നാളെ’; ഇവിടെ പൊതുവായി ഭാവിയിലെ ഒരു കാലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ ചോദ്യം സാക്ഷ്യങ്ങളുടെയും ചട്ടങ്ങളുടെയും ന്യായവിധികളുടെയും അർഥമോ പ്രാധാന്യമോ ചോദിക്കുന്നതായി മനസ്സിലാക്കാം; എന്നാൽ എബ്രായപാഠം നേരിട്ട് ‘അവ എന്താണ്?’ എന്നാണ് ചോദിക്കുന്നത്.
    reason: ambiguity
lexical_decisions:
- source_word: כִּי יִשְׁאָלְךָ
  choice: നിന്നോടു ചോദിക്കുമ്പോൾ
  rationale: നിയമോപദേശപരമായ ഈ സന്ദർഭത്തിൽ כִּי പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവിസാഹചര്യം അവതരിപ്പിക്കുന്നു; അതിനാൽ സോപാധികമായ ‘ചോദിച്ചാൽ’ എന്നതിനെക്കാൾ ‘ചോദിക്കുമ്പോൾ’ യോജിക്കുന്നു.
- source_word: בִנְךָ
  choice: നിന്റെ മകൻ
  rationale: എബ്രായപദം പുല്ലിംഗ ഏകവചനമാണ്; അതിന്റെ ലിംഗവും വചനവും നിലനിർത്തുന്നു.
- source_word: מָחָר
  choice: പിൽക്കാലത്ത്
  rationale: പദശഃ ‘നാളെ’ എന്നാണെങ്കിലും ഇവിടെ പൊതുവായ ഭാവികാലത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
- source_word: מָה
  choice: എന്താണ്
  rationale: മൂലപാഠത്തിലെ നേരിട്ടുള്ള ചോദ്യം നിലനിർത്തുന്നു; ‘അർഥമെന്താണ്’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: הָעֵדֹת
  choice: സാക്ഷ്യങ്ങൾ
  rationale: ഉടമ്പടിയെ സാക്ഷ്യപ്പെടുത്തുന്ന നിയമനിർദേശങ്ങൾ എന്ന സവിശേഷ ഭാവം സൂക്ഷിക്കുകയും തുടർന്നുള്ള നിയമപദങ്ങളിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിശ്ചയിക്കപ്പെട്ട നിയമനിർദേശങ്ങൾ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַמִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: നിയമപരമായ വിധികളുടെയോ തീരുമാനങ്ങളുടെയോ ഭാവം നിലനിർത്തി പദത്രയത്തിലെ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവിക വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ
  rationale: ഒന്നാംപുരുഷ ബഹുവചന ഉടമസ്ഥബന്ധവും ഉടമ്പടിബന്ധത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: צִוָּה ... אֶתְכֶם
  choice: നിങ്ങളോടു കല്പിച്ച
  rationale: അവസാനത്തെ അഭിസംബോധന എബ്രായത്തിൽ ബഹുവചനമാണ്; മലയാളത്തിലെ ‘നിങ്ങൾ’ അത് വ്യക്തമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം പേര് നിലനിർത്തുന്നു.
- issue: בִנְךָ എന്ന ബന്ധപദത്തിന്റെ ലിംഗം
  choice: നിന്റെ മകൻ
  alternative: നിന്റെ കുട്ടി
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചനം ലിംഗനിരപേക്ഷമാക്കാതെ കൃത്യമായി നൽകുന്നു.
- issue: מָה എന്ന ചോദ്യത്തിന്റെ അർഥവ്യാപ്തി
  choice: എന്താണ്
  alternative: അർഥമെന്താണ്
  rationale: ചോദ്യം നിയമങ്ങളുടെ സ്വഭാവമോ പ്രാധാന്യമോ വിശദീകരിക്കാൻ ക്ഷണിക്കാമെങ്കിലും മൂലപാഠം ‘അർഥം’ എന്നു വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ആ തുറന്ന നില നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപദത്രയത്തിന്റെ വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്; ‘നിങ്ങളോടു’ എന്ന ബഹുവചനം മൂലപാഠത്തിലെ 2mp രൂപം വ്യക്തമാക്കുന്നു.
