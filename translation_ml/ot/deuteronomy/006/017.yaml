id: DEU.6.17
reference: Deuteronomy 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שָׁמ֣וֹר תִּשְׁמְר֔וּ/ן אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/עֵדֹתָ֥י/ו וְ/חֻקָּ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ കൽപ്പനകളും അവിടത്തെ സാക്ഷ്യവിധികളും[b] ചട്ടങ്ങളും, അവിടുന്ന് നിങ്ങൾക്കു കൽപ്പിച്ചവ, നിങ്ങൾ വളരെ ശ്രദ്ധയോടെ[a] പാലിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തീർച്ചയായും പാലിക്കണം” അല്ലെങ്കിൽ “വളരെ ശ്രദ്ധയോടെ ആചരിക്കണം” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിൽ ഒരേ ക്രിയയുടെ അനന്തക്രിയാരൂപവും രൂപാന്തരപ്പെട്ട ക്രിയാരൂപവും ചേർന്ന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “സാക്ഷ്യവിധികൾ” എന്നത് “സാക്ഷ്യങ്ങൾ” അല്ലെങ്കിൽ “ഉടമ്പടി നിബന്ധനകൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: ജാഗ്രതയോടെ പാലിക്കണം
  rationale: ക്രിയയുടെ infinitive absolute-ഉം finite verb-ഉം ചേർന്നുള്ള ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; കല്പനയുടെ നിർബന്ധസ്വഭാവവും സൂക്ഷ്മമായ അനുസരണവും നിലനിർത്തുന്നു.
- source_word: מִצְוֺת
  choice: കല്പനകൾ
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ നിർദേശങ്ങളെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടിസൂത്രവാക്യത്തിന്റെ ബന്ധസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֵדֹתָיו
  choice: അവിടത്തെ സാക്ഷ്യവിധികൾ
  rationale: സാക്ഷ്യം വഹിക്കുന്ന ഉടമ്പടിനിബന്ധനകൾ എന്ന പദത്തിന്റെ ആശയം സൂക്ഷിക്കുകയും സമീപമുള്ള മറ്റു നിയമപദങ്ങളിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: חֻקָּיו
  choice: അവിടത്തെ ചട്ടങ്ങൾ
  rationale: നിശ്ചയിച്ച നിയമനിർദേശങ്ങൾ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: אֲשֶׁר צִוָּךְ
  choice: അവിടന്ന് നിങ്ങളോടു കല്പിച്ചവ
  rationale: ബന്ധവാക്യം മുമ്പുള്ള മൂന്നു നിയമവിഭാഗങ്ങളെയും കൂട്ടമായി വിശേഷിപ്പിക്കുന്നതായി നിലനിർത്തുന്നു; മലയാളത്തിലെ 'നിങ്ങൾ' ലിംഗവും ഏകവചന-ബഹുവചന വ്യത്യാസവും നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ പേര് ലിപ്യന്തരണം ചെയ്തു.
- issue: עֵדֹתָיו എന്ന നിയമപദത്തിന്റെ അർഥപരിധി
  choice: സാക്ഷ്യവിധികൾ
  alternative: വിധികൾ; ഉടമ്പടിനിബന്ധനകൾ
  rationale: ഉടമ്പടിസാക്ഷ്യവുമായി ബന്ധപ്പെട്ട നിയമനിബന്ധനകൾ എന്ന അർഥവ്യാപ്തി പൂർണമായി ഒരു വ്യാഖ്യാനത്തിലേക്കു ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമങ്ങളിൽ ആദരസൂചകമായ ‘അവിടന്ന്/അവിടത്തെ’ ഉപയോഗിച്ചു. മൂന്നു വ്യത്യസ്ത എബ്രായ നിയമപദങ്ങളുടെ വേർതിരിവ് കഴിയുന്നത്ര നിലനിർത്തി; ഊന്നൽ നൽകുന്ന എബ്രായ ക്രിയാഘടന മലയാളത്തിൽ ‘ജാഗ്രതയോടെ ... പാലിക്കണം’ എന്നു സ്വാഭാവികമാക്കി.
