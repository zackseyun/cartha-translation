id: DEU.6.21
reference: Deuteronomy 6:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לְ/בִנְ/ךָ֔ עֲבָדִ֛ים הָיִ֥ינוּ לְ/פַרְעֹ֖ה בְּ/מִצְרָ֑יִם וַ/יּוֹצִיאֵ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/021.yaml
  text: then you shall say to your son[a], ‘We were servants to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: ml
  text: 'അപ്പോൾ നീ നിന്റെ മകനോടു പറയണം[a]: “ഞങ്ങൾ ഈജിപ്തിൽ ഫറവോന്റെ അടിമകളായിരുന്നു; യഹ്‌വെ ശക്തമായ കൈകൊണ്ട്[b] ഞങ്ങളെ ഈജിപ്തിൽനിന്നു പുറപ്പെടുവിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നീ നിന്റെ മകനോടു പറയണം.” എബ്രായത്തിലെ ബന്ധകപദം ലളിതമായി “എന്നിട്ട്/കൂടാതെ” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ “അപ്പോൾ” മുൻവാക്യത്തിൽ ആരംഭിച്ച നിർദേശക്രമം വ്യക്തമാക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “കരുത്തുറ്റ കൈകൊണ്ട്.” ഈ എബ്രായ പ്രയോഗം യഹ്‌വെയുടെ ശക്തമായ വിടുതൽപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: അപ്പോൾ നീ ... പറയണം
  rationale: മുൻവാക്യത്തിലെ ചോദ്യത്തിനു പിന്നാലെ നൽകേണ്ട മറുപടിയെന്ന നിർദേശക്രമം ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു; ക്രിയയുടെ നിർദേശാത്മക ഭാവം ‘പറയണം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְבִנְךָ
  choice: നിന്റെ മകനോട്
  rationale: എബ്രായ പദം പുരുഷലിംഗ ഏകവചനത്തിൽ വ്യക്തമായി ‘നിന്റെ മകൻ’ എന്നാണ്.
- source_word: עֲבָדִים
  choice: അടിമകൾ
  rationale: പുറപ്പാടിന്റെ പശ്ചാത്തലത്തിൽ ഇത് സാധാരണ സേവനത്തെയല്ല, ഫറവോന്റെ കീഴിലുള്ള നിർബന്ധിത അടിമത്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְפַרְעֹה
  choice: ഫറവോന്റെ അടിമകൾ
  rationale: לְ ഇവിടെ ഫറവോനോടുള്ള അധീനതയും ഉടമസ്ഥബന്ധവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥഘടന അതു വ്യക്തമായി നൽകുന്നു.
- source_word: וַיּוֹצִיאֵנוּ
  choice: ഞങ്ങളെ ... പുറപ്പെടുവിച്ചു
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘പുറത്തേക്കു കൊണ്ടുവരുക/പുറപ്പെടുവിക്കുക’ എന്ന കാരണാർഥം നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ വ്യക്തിനാമരൂപം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיָד חֲזָקָה
  choice: ശക്തമായ കൈകൊണ്ട്
  rationale: ‘ശക്തമായ കൈ’ എന്ന എബ്രായ രൂപകം നിലനിർത്തിക്കൊണ്ട് ദൈവത്തിന്റെ പ്രബലമായ വിടുതൽപ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ നാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: עֲבָדִים സൂചിപ്പിക്കുന്ന ബന്ധനത്തിന്റെ തീവ്രത
  choice: അടിമകൾ
  alternative: ദാസന്മാർ; സേവകർ
  rationale: ഈജിപ്തിലെ നിർബന്ധിത ബന്ധനവും അതിൽനിന്നുള്ള വിടുതലും വാക്യത്തിന്റെ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരമാണ്; ‘അടിമകൾ’ അത് വ്യക്തമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അടിമകൾ’ ബന്ധനത്തിന്റെ ശക്തി തുറന്നുകാട്ടുന്നു; ‘ശക്തമായ കൈ’ എന്ന മൂലരൂപകം വിശദീകരിച്ചുതീർക്കാതെ നിലനിർത്തിയിരിക്കുന്നു. ഉദ്ധരണിക്ക് മലയാള വായനയിൽ സ്വാഭാവികമായ പദക്രമമാണ് ഉപയോഗിച്ചത്.
