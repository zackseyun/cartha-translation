source:
  edition: WLC
  text: וְ/שָׁמַעְתָּ֤ יִשְׂרָאֵל֙ וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת אֲשֶׁר֙ יִיטַ֣ב לְ/ךָ֔ וַ/אֲשֶׁ֥ר תִּרְבּ֖וּ/ן מְאֹ֑ד כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: ml
  text: അതിനാൽ, ഇസ്രായേലേ, കേൾക്കുക; നിനക്കു നന്മ ഉണ്ടാകാനും നിങ്ങൾ വളരെയധികം പെരുകാനും, അത് ശ്രദ്ധയോടെ അനുഷ്ഠിക്കുക; നിന്റെ പിതാക്കന്മാരുടെ ദൈവമായ യഹ്‌വെ നിന്നോടു പറഞ്ഞതുപോലെ, പാലും തേനും ഒഴുകുന്ന ദേശത്ത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: കേൾക്കുക
  rationale: ശׁמע എന്ന പദത്തിന് കേൾക്കുക, ശ്രദ്ധിക്കുക, അനുസരിക്കുക എന്നീ അർഥനിറങ്ങളുണ്ട്. തുടർന്ന് അനുഷ്ഠിക്കാനുള്ള കല്പന വരുന്നതിനാൽ, ഇവിടെ ‘കേൾക്കുക’ എന്ന് നൽകി അനുസരണത്തിന്റെ ആശയം മുഴുവൻ വാക്യത്തിൽനിന്ന് ഉയർന്നുവരാൻ അനുവദിക്കുന്നു.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: അതു ശ്രദ്ധയോടെ അനുഷ്ഠിക്കുക
  rationale: שׁמר + עשׂה എന്ന ഘടന ശ്രദ്ധാപൂർവം കാത്തുപാലിച്ച് പ്രവൃത്തിയിൽ വരുത്തുക എന്ന ആശയം നൽകുന്നു. ‘അതു’ എന്നത് സന്ദർഭത്തിൽ സൂചിതമായ കല്പനകളെ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: നിനക്കു നന്മ വരാൻ
  rationale: ഇത് ആവർത്തിച്ചുവരുന്ന ആവർത്തനപുസ്തക ശൈലിയാണ്; ക്ഷേമവും അനുഗ്രഹവും സൂചിപ്പിക്കുന്ന വിധത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: നിങ്ങൾ അത്യന്തം പെരുകാൻ
  rationale: רבה ഇവിടെ ജനസംഖ്യയായി വർധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; מְאֹד എന്ന ഊന്നൽ ‘അത്യന്തം’ എന്ന് നിലനിർത്തി. എബ്രായത്തിലെ ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റവും പരിഭാഷയിൽ സംരക്ഷിച്ചു.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: അരുളിച്ചെയ്തതുപോലെ
  rationale: דבר അടിസ്ഥാനമായി ‘സംസാരിക്കുക/പറയുക’ എന്നാണ്. ദൈവത്തിന്റെ മുൻവചനത്തെ ആദരപൂർവമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘വാഗ്ദാനം ചെയ്തു’ എന്ന് വ്യാഖ്യാനം ഉറപ്പിച്ചിട്ടില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: אבות എന്ന എബ്രായ പദത്തിലെ വ്യക്തമായ പുരുഷലിംഗ ബന്ധപദം നിലനിർത്തുന്നു; കൂടുതൽ പൊതുവായ ‘പൂർവികർ’ എന്നതിനെ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചിട്ടില്ല.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: പാലും തേനും ഒഴുകുന്ന ദേശം
  rationale: വാഗ്ദത്തദേശത്തെക്കുറിച്ചുള്ള സ്ഥിരമായ ഉടമ്പടിപരമായ പ്രയോഗം കൃത്യവും മലയാളത്തിൽ പരിചിതവുമായ രൂപത്തിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ പദവിപദം പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: אֱלֹהֵי אֲבֹתֶיךָ എന്നതിലെ ബന്ധപദം
  choice: നിന്റെ പിതാക്കന്മാരുടെ ദൈവം
  alternative: നിന്റെ പൂർവികരുടെ ദൈവം
  rationale: മൂലത്തിലെ ‘പിതാക്കന്മാർ’ എന്ന ലിംഗസൂചന നിലനിർത്തുന്നു; ഉൾക്കൊള്ളുന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: അവസാനത്തെ ദേശപ്രയോഗത്തിന്റെ വാക്യബന്ധം
  choice: പെരുകലും നന്മയും ‘പാലും തേനും ഒഴുകുന്ന ദേശത്ത്’ സംഭവിക്കുന്നതായി ബന്ധിപ്പിച്ചു
  alternative: യഹ്‌വെ വാഗ്ദാനം ചെയ്തതിന്റെ വിശദീകരണമായി ‘പാലും തേനും ഒഴുകുന്ന ഒരു ദേശം’ എന്നു ബന്ധിപ്പിക്കുക
  rationale: എബ്രായ വാക്യഘടന ചുരുക്കമുള്ളതിനാൽ ദേശപ്രയോഗം മുൻപുള്ള ഫലങ്ങളുടെ സ്ഥലമായി വായിക്കാം; വാഗ്ദാനത്തിന്റെ ഉള്ളടക്കമായുള്ള മറ്റൊരു വായനയും സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘അരുളിച്ചെയ്തു’ എന്നത് ദൈവവചനത്തിന് യോജിച്ച ആദരസൂചക പ്രയോഗമാണ്. ഇസ്രായേലിനെ ആദ്യം ഏകവചനത്തിലും പിന്നീട് സമൂഹത്തെ ബഹുവചനത്തിലും അഭിസംബോധന ചെയ്യുന്ന എബ്രായത്തിലെ വ്യക്തിവചനമാറ്റം ‘നിനക്കു/നിങ്ങൾ’ എന്ന രൂപങ്ങളിൽ ഉദ്ദേശപൂർവം നിലനിർത്തി.
