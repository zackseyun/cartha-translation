source:
  edition: WLC
  text: וּ/קְשַׁרְתָּ֥/ם לְ/א֖וֹת עַל יָדֶ֑/ךָ וְ/הָי֥וּ לְ/טֹטָפֹ֖ת בֵּ֥ין עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/008.yaml
  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: ml
  text: അവയെ നിന്റെ കൈമേൽ ഒരു അടയാളമായി കെട്ടണം; അവ നിന്റെ കണ്ണുകൾക്കിടയിൽ നെറ്റിപ്പട്ടങ്ങളായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ഫിലാക്ടറികളായി.” പിൽക്കാല യഹൂദാചാരത്തിൽ ധരിച്ചിരുന്ന ചെറിയ പെട്ടികളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ഇവിടെ വരുന്ന എബ്രായ പദം അപൂർവമാണ്; കൂടുതൽ അക്ഷരാർഥത്തിൽ അത് നെറ്റിയിൽ ധരിക്കുന്ന അലങ്കാരങ്ങളെയോ പട്ടകളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: അവയെ … കെട്ടണം
  rationale: നിർദേശക്രമത്തിൽ വരുന്ന ക്രിയയുടെ ആജ്ഞാത്മക ഭാവം ‘കെട്ടണം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം മുൻസന്ദർഭത്തിലെ വചനങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവയെ’ എന്നു വ്യക്തമാക്കി.
- source_word: לְאוֹת
  choice: ഒരു അടയാളമായി
  rationale: אוֹת എന്ന പദത്തിന്റെ ‘അടയാളം’ എന്ന സാധാരണ അർത്ഥവും לְ സൂചിപ്പിക്കുന്ന നിയോഗഭാവവും ഇത് നിലനിർത്തുന്നു; പ്രതീകത്തിന്റെ സ്വഭാവം അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: עַל יָדֶךָ
  choice: നിന്റെ കൈമേൽ
  rationale: יָד എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥമായ ‘കൈ’ നിലനിർത്തുന്നു. ‘ഭുജം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- source_word: וְהָיוּ
  choice: അവ … ഇരിക്കണം
  rationale: മുൻക്രിയയോടു തുടർച്ചയുള്ള നിർദേശഭാവം നിലനിർത്തുകയും ഇത് വെറും ഭാവിപ്രവചനമല്ലെന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לְטֹטָפֹת
  choice: നെറ്റിപ്പട്ടങ്ങളായി
  rationale: അപൂർവമായ ഈ എബ്രായ പദം നെറ്റിയിൽ ധരിക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നതായി പരമ്പരാഗതമായി മനസ്സിലാക്കപ്പെടുന്നു. ‘നെറ്റിപ്പട്ടങ്ങൾ’ സ്ഥാനം/രൂപം സൂചിപ്പിക്കുമ്പോഴും പിൽക്കാലത്തെ പ്രത്യേക ആചാരവസ്തുവിനെ മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല; കൃത്യമായ അർത്ഥത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בֵּין עֵינֶיךָ
  choice: നിന്റെ കണ്ണുകൾക്കിടയിൽ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യബിംബം നേരിട്ട് നിലനിർത്തുന്നു. ‘നിന്റെ നെറ്റിയിൽ’ എന്നത് സ്വാഭാവികമെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
theological_decisions:
- issue: ഈ കല്പന ശരീരത്തിൽ അക്ഷരാർഥത്തിൽ അനുഷ്ഠിക്കേണ്ടതാണോ, നിരന്തര സ്മരണയുടെ പ്രതീകമാണോ, അതോ രണ്ടുമാണോ എന്ന ചോദ്യം
  choice: ശരീരവുമായി ബന്ധപ്പെട്ട മൂർത്തമായ ഭാഷ നിലനിർത്തി വ്യാഖ്യാനപ്രശ്നം തുറന്നുവെച്ചു
  alternative: ഇത് നിരന്തര സ്മരണയ്ക്കുള്ള രൂപകം എന്നു വ്യക്തമാക്കുക; അല്ലെങ്കിൽ പിൽക്കാല ഫിലാക്ടറി ആചാരത്തെ നേരിട്ട് പരാമർശിക്കുക
  rationale: എബ്രായ വാചകം മൂർത്തമായ ശരീരബിംബങ്ങൾ ഉപയോഗിക്കുന്നുവെങ്കിലും അതിന്റെ പ്രയോഗരീതി ഇവിടെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ അക്ഷരാർഥം, പ്രതീകാർഥം, അല്ലെങ്കിൽ രണ്ടും എന്ന സാധ്യതകളിൽ വിവർത്തനം ഒന്ന് മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ‘കൈമേൽ,’ ‘കണ്ണുകൾക്കിടയിൽ’ എന്നീ മൂർത്തപ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യബിംബവും ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
