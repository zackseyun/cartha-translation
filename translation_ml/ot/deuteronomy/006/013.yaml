  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെയെ നീ ഭയപ്പെടണം[a]; അവനെ നീ സേവിക്കണം[b]; അവന്റെ നാമത്തിൽ നീ ശപഥം ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ദൈവമായ യഹ്‌വെയെ ഭക്ത്യാദരിക്കണം’; എബ്രായക്രിയ വെറും ഭീതിയെയല്ല, ഭയഭക്തിയും വിസ്മയാദരവും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവനെ ആരാധിക്കണം’; എബ്രായക്രിയ സാധാരണയായി ‘സേവിക്കുക’ എന്നാണ് അർഥമാക്കുന്നത്; ഈ സന്ദർഭത്തിൽ ആരാധനാപൂർവമായ സേവനവും അതിൽ ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം നിലനിർത്തുകയും ‘യഹ്‌വെ’യുമായുള്ള സ്വാഭാവിക മലയാളബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: תִּירָא
  choice: നീ ഭയപ്പെടണം
  rationale: ഈ ക്രിയയിൽ ഭയം, ഭക്ത്യാദരം, വിസ്മയഭക്തി എന്നിവ ഉൾപ്പെടുന്നു; ‘ഭയപ്പെടുക’ അതിന്റെ പൂർണ ഗൗരവവും ദൈവസന്നിധിയിലെ ഉടമ്പടിപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: וְאֹתוֹ
  choice: അവനെത്തന്നെ
  rationale: എബ്രായത്തിലെ ഊന്നിയ പ്രത്യക്ഷ കർമസർവനാമം മലയാളത്തിൽ ‘അവനെത്തന്നെ’ എന്നു നൽകി; സന്ദർഭത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു, എന്നാൽ മൂലപാഠത്തിൽ പ്രത്യക്ഷമല്ലാത്ത ‘മാത്രം’ ചേർക്കുന്നില്ല.
- source_word: תַעֲבֹד
  choice: നീ സേവിക്കണം
  rationale: עבד എന്ന ക്രിയയുടെ വിശാലമായ അർഥം ‘സേവിക്കുക’ നിലനിർത്തുന്നു; ഈ മതപരമായ സന്ദർഭത്തിൽ ആരാധനാപൂർവമായ സേവനവും അതിൽ ഉൾപ്പെടാം.
- source_word: וּבִשְׁמוֹ
  choice: അവന്റെ നാമത്തിൽ
  rationale: ശപഥസന്ദർഭത്തിലെ ב എന്ന ഉപസർഗം ആരുടെ നാമത്തെ ആധാരമാക്കി സത്യം ചെയ്യുന്നു എന്നു സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നാമത്തിൽ’ സ്വാഭാവികമാണ്.
- source_word: תִּשָּׁבֵעַ
  choice: നീ സത്യം ചെയ്യണം
  rationale: നിഫാൽ രൂപത്തിന്റെ ‘ശപഥം ചെയ്യുക’ എന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: പ്രത്യക്ഷ കർമസൂചകത്തിന് മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനതയില്ല; വാക്യഘടനയും ‘-യെ’ വിഭക്തിയും അതിന്റെ പ്രവർത്തനം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തോടുള്ള ശരിയായ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്ന ירא എന്ന ക്രിയയെ ‘ഭയപ്പെടുക’ എന്നോ ‘ഭക്ത്യാദരിക്കുക’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: പ്രധാന പാഠത്തിൽ ‘ഭയപ്പെടണം’ നിലനിർത്തി
  alternative: ‘ഭക്ത്യാദരിക്കണം’ അല്ലെങ്കിൽ ‘ഭയഭക്തിയോടെ ആദരിക്കണം’
  rationale: മൂലക്രിയ വെറും ഭീതിയെയല്ല, ഭയഭക്തിയും വിസ്മയാദരവും ഉൾക്കൊള്ളുന്നു. എങ്കിലും ‘ഭക്ത്യാദരിക്കുക’ മാത്രം എന്നു നൽകിയാൽ കല്പനയുടെ ഉടമ്പടിപരമായ ഗൗരവം ചുരുങ്ങാം; അടിക്കുറിപ്പ് അർഥവ്യാപ്തി വ്യക്തമാക്കുന്നു.
- issue: עבד എന്ന ക്രിയയെ ‘സേവിക്കുക’ എന്നോ ‘ആരാധിക്കുക’ എന്നോ നൽകണമോ
  choice: ‘സേവിക്കണം’ എന്നു നൽകി
  alternative: ‘ആരാധിക്കണം’
  rationale: ‘സേവിക്കുക’ ക്രിയയുടെ വിശാലമായ അർഥവും ഉടമ്പടിയോടുള്ള പ്രായോഗിക വിശ്വസ്തതയും നിലനിർത്തുന്നു; ആരാധനാപരമായ അർഥസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: וְאֹתוֹ എന്നതിൽ ദൈവത്തെ ‘മാത്രം’ സേവിക്കണമെന്ന പദം ചേർക്കണമോ
  choice: ‘അവനെത്തന്നെ’ എന്നു നൽകി; ‘മാത്രം’ ചേർത്തില്ല
  alternative: ‘അവനെ മാത്രം’
  rationale: സന്ദർഭം ഏകാഗ്രമായ വിശ്വസ്തത സൂചിപ്പിച്ചാലും ഈ വാക്യത്തിൽ ‘മാത്രം’ എന്നതിന് തുല്യമായ സ്വതന്ത്ര പദമില്ല. അതിനാൽ ഊന്നൽ നിലനിർത്തിയെങ്കിലും ആശയം കൂടുതൽ നിർവചിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള കല്പനാശൈലി ഉപയോഗിച്ചു. ‘സത്യം ചെയ്യുക’ എന്നത് ഇവിടെ ശപഥമെടുക്കുക എന്ന അർഥത്തിലാണ്. സമാന്തരമായ മൂന്ന് ക്രിയകൾക്കും ‘നീ …ണം’ എന്ന ഘടന നൽകി എബ്രായത്തിലെ അഭിസംബോധനയും ഊന്നലും നിലനിർത്തി.
