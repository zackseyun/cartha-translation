reference: Deuteronomy 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְמַ֨עַן תִּירָ֜א אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ֠/שְׁמֹר אֶת כָּל חֻקֹּתָ֣י/ו וּ/מִצְוֺתָי/ו֮ אֲשֶׁ֣ר אָנֹכִ֣י מְצַוֶּ/ךָ֒ אַתָּה֙ וּ/בִנְ/ךָ֣ וּ/בֶן בִּנְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וּ/לְמַ֖עַן יַאֲרִכֻ֥/ן יָמֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെയെ ഭയപ്പെടാനും[a], ഞാൻ നിന്നോടു കല്പിക്കുന്ന അവന്റെ എല്ലാ ചട്ടങ്ങളും കല്പനകളും നീയും നിന്റെ മകനും നിന്റെ മകന്റെ മകനും[b] നിന്റെ ജീവിതകാലം മുഴുവൻ പാലിക്കാനും, നിന്റെ നാളുകൾ ദീർഘമാകാനും[c] വേണ്ടിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ദൈവമായ യഹ്‌വെയെ ഭക്തിപൂർവം ആദരിക്കാൻ.” എബ്രായ ക്രിയയിൽ ഭയത്തോടൊപ്പം ആദരവും വിസ്മയവും ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “നീയും നിന്റെ മകനും നിന്റെ മകന്റെ മകനും.”'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “നിന്റെ നാളുകൾ നീണ്ടിരിക്കാനും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: വേണ്ടിയാണ് / …ആനും
  rationale: ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള ലക്ഷ്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תִּירָא
  choice: ഭയപ്പെടാനും
  rationale: ദൈവത്തോടുള്ള ഭയം, ഭക്തിപൂർവമായ ആദരം, വിസ്മയം എന്നീ അർഥവ്യാപ്തി നിലനിർത്താൻ ‘ഭയപ്പെടുക’ ഉപയോഗിച്ചു; അതിനെ വെറും ആദരവായി ചുരുക്കിയില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥബന്ധവും ഉടമ്പടിബന്ധത്തിന്റെ വ്യക്തിപരമായ സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: לִשְׁמֹר
  choice: പാലിച്ചുകൊണ്ട്
  rationale: യഹ്‌വെയെ ഭയപ്പെടുന്നത് എങ്ങനെ പ്രകടമാകുന്നു എന്ന മാർഗം/രീതി വ്യക്തമാക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: חֻקֹּתָיו
  choice: അവന്റെ എല്ലാ ചട്ടങ്ങളും
  rationale: നിശ്ചയിച്ച നിയമവ്യവസ്ഥകളെ സൂചിപ്പിക്കുകയും ‘കല്പനകൾ’ എന്ന അടുത്ത പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִצְוֺתָיו
  choice: കല്പനകളും
  rationale: ഉടമ്പടിസംബന്ധമായ ഔപചാരിക ഭാവം നിലനിർത്തുന്ന സാധാരണ മലയാള പദം.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: ഞാൻ നിന്നോടു കല്പിക്കുന്ന
  rationale: പ്രസംഗസമയത്ത് നടന്നുകൊണ്ടിരിക്കുന്ന കല്പനയുടെ വർത്തമാന/അപൂർണ സ്വഭാവം പ്രകടമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇന്ന്’ ചേർത്തിട്ടില്ല.
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: നീയും നിന്റെ മകനും നിന്റെ മകന്റെ മകനും
  rationale: മൂലത്തിൽ വ്യക്തമായി പറയുന്ന മൂന്നു തലമുറകളെയും നിലനിർത്തുന്നു; പൊതുവായി ‘മക്കളും കൊച്ചുമക്കളും’ എന്ന് വിപുലീകരിച്ചിട്ടില്ല.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: നിന്റെ ആയുഷ്കാലമൊക്കെയും
  rationale: ‘നിന്റെ ജീവിതത്തിന്റെ എല്ലാ ദിവസങ്ങളും’ എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וּלְמַעַן
  choice: …ആനും
  rationale: ആദ്യ ലക്ഷ്യത്തോടു ബന്ധിപ്പിച്ച രണ്ടാമത്തെ ലക്ഷ്യ/ഫലവാക്യം മലയാളത്തിലെ സമുച്ചയഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: יַאֲרִכֻן יָמֶיךָ
  choice: നിന്റെ നാളുകൾ ദീർഘമാകാനും
  rationale: ‘നാളുകൾ ദീർഘമാകുക’ എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; അതിനെ പൊതുവായ ‘നീ ദീർഘകാലം ജീവിക്കാൻ’ എന്ന പരാവർത്തനമാക്കി മാറ്റിയിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ഉടമ്പടിനാമം ലിപ്യന്തരിച്ചു.
- issue: ദൈവത്തെ ‘ഭയപ്പെടുക’ എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ഭയപ്പെടുക
  alternative: ഭക്തിപൂർവം ആദരിക്കുക / ഭയഭക്തി കാണിക്കുക
  rationale: ഈ ക്രിയയിൽ ഭയം, ഭക്തിപൂർവമായ ആദരം, വിസ്മയം എന്നിവ ഉൾപ്പെടാം. ‘ഭയപ്പെടുക’ എന്ന രൂപം ആ വേദശാസ്ത്രപരമായ സംഘർഷവും വിശാലതയും ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യവുമായി ലക്ഷ്യബന്ധത്തിൽ തുടരുന്നതിനാൽ, മൂലത്തിലെ ആശ്രിതഘടനയെ ‘വേണ്ടിയാണ്’ എന്ന സമാപനത്തിലൂടെ വായനാസൗകര്യത്തോടെ നിലനിർത്തി. ‘ചട്ടങ്ങൾ’, ‘കല്പനകൾ’ എന്നീ പദങ്ങളുടെ വ്യത്യാസവും മൂന്നു തലമുറകളുടെ വ്യക്തമായ പരാമർശവും സംരക്ഷിച്ചു.
