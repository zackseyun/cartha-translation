reference: Deuteronomy 6:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן יְהוָ֡ה אוֹתֹ֣ת וּ֠/מֹפְתִים גְּדֹלִ֨ים וְ/רָעִ֧ים בְּ/מִצְרַ֛יִם בְּ/פַרְעֹ֥ה וּ/בְ/כָל בֵּית֖/וֹ לְ/עֵינֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: ml
  text: യഹോവ ഈജിപ്തിൽ[a], ഫറവോനും അവന്റെ മുഴുവൻ ഭവനത്തിനും എതിരായി, വലുതും വിനാശകരവുമായ അടയാളങ്ങളും അത്ഭുതങ്ങളും ഞങ്ങളുടെ കൺമുമ്പിൽ വരുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈജിപ്തിനെതിരെ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായ ഉപസർഗത്തിന് സ്ഥലത്തെ (“ഈജിപ്തിൽ”) സൂചിപ്പിക്കാനോ, സന്ദർഭത്തിൽ ബാധിക്കപ്പെട്ട ലക്ഷ്യത്തെ (“ഈജിപ്തിനെതിരെ”) സൂചിപ്പിക്കാനോ കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: വരുത്തി
  rationale: נתן എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘കൊടുക്കുക/വെക്കുക’ എന്നാണെങ്കിലും, അടയാളങ്ങളും അത്ഭുതങ്ങളും എന്ന കർമത്തോടൊപ്പം മലയാളത്തിൽ ‘വരുത്തി’ എന്നത് സ്വാഭാവികമായി പ്രവർത്തനവും സംഭവിപ്പിക്കലും അറിയിക്കുന്നു; ‘നൽകി’ ഇവിടെ കൃത്രിമമായി തോന്നും.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാള ബൈബിൾ വായനക്കാർക്ക് സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אוֹתֹת וּמֹפְתִים
  choice: അടയാളങ്ങളും അത്ഭുതങ്ങളും
  rationale: ഈ ജോടിയുടെ വ്യത്യസ്തമായ അർഥഛായകൾ നിലനിർത്തുന്ന, വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാള പ്രയോഗം.
- source_word: גְּדֹלִים וְרָעִים
  choice: വലുതും വിനാശകരവുമായ
  rationale: גְּדֹלִים പ്രവൃത്തികളുടെ മഹത്ത്വവും വ്യാപ്തിയും സൂചിപ്പിക്കുന്നു; רָעִים ഇവിടെ ധാർമിക തിന്മയല്ല, ഈജിപ്തിന്മേലുണ്ടായ ദോഷകരവും നാശകരവുമായ ഫലമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּמִצְרַיִם
  choice: ഈജിപ്തിൽ
  rationale: בְ എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള സ്ഥലാർഥം നിലനിർത്തുന്നു. തുടർന്നുള്ള ഫറവോനെയും ഭവനത്തെയും ലക്ഷ്യമാക്കുന്ന പ്രയോഗം വിധിയുടെ ദിശ വ്യക്തമാക്കുന്നു.
- source_word: בְּפַרְעֹה וּבְכָל בֵּיתוֹ
  choice: ഫറവോനും അവന്റെ മുഴുവൻ ഭവനത്തിനും എതിരായി
  rationale: സന്ദർഭത്തിൽ בְ ലക്ഷ്യമോ ബാധിതപക്ഷമോ സൂചിപ്പിക്കുന്നു. בֵּיתוֹ എന്നത് കെട്ടിടത്തേക്കാൾ ഫറവോന്റെ കുടുംബം/രാജകീയ ഗൃഹം എന്ന വിശാല അർഥമുള്ളതിനാൽ ‘ഭവനം’ ആ കൂട്ടായ അർഥം നിലനിർത്തുന്നു.
- source_word: לְעֵינֵינוּ
  choice: ഞങ്ങളുടെ കൺമുമ്പിൽ
  rationale: ‘ഞങ്ങളുടെ കണ്ണുകൾക്ക് മുമ്പിൽ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സജീവവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്ന് പകരംവയ്ക്കാതെ ദൈവനാമം തന്നെ നിലനിർത്തുന്നു. മലയാളത്തിലെ സ്ഥാപിത രൂപം ‘യഹോവ’യാണ്.
- issue: וְרָעִים എന്ന പദം ദൈവിക പ്രവൃത്തികളെ വിശേഷിപ്പിക്കുന്നത്
  choice: വിനാശകരമായ
  alternative: ദുഷ്ടമായ / ഭയങ്കരമായ
  rationale: ഇവിടെ പദം പ്രവൃത്തികളുടെ ധാർമിക ദുഷ്ടതയെക്കാൾ ഈജിപ്തിനുണ്ടാക്കിയ ദോഷകരവും വിനാശകരവുമായ ഫലത്തെ സൂചിപ്പിക്കുന്നു. ‘വിനാശകരമായ’ തീവ്രത നിലനിർത്തുകയും ദൈവം ധാർമിക തിന്മ ചെയ്തു എന്ന അനാവശ്യ അർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: ഈജിപ്തിനോടുള്ള בְ എന്ന ഉപസർഗത്തിന്റെ അർഥം
  choice: ഈജിപ്തിൽ
  alternative: ഈജിപ്തിനെതിരെ
  rationale: ഉപസർഗത്തിന്റെ സ്ഥലാർഥം യഥാർത്ഥ സാധ്യതയാണ്; അതേസമയം തുടർന്നുള്ള സമാന്തരഘടന വിധിയുടെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിൽ സ്ഥലാർഥവും അടിക്കുറിപ്പിൽ ലക്ഷ്യാർഥവും നൽകി മൂലത്തിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഭവനം’ എന്നത് ഇവിടെ ഫറവോന്റെ കുടുംബത്തെയും രാജകീയ ഗൃഹത്തെയും ഉൾക്കൊള്ളുന്ന കൂട്ടായ അർഥത്തിലാണ്. വാക്യക്രമം ഹീബ്രായത്തിന്റെ ഊന്നൽ കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
