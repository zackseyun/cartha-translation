  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַוֵּ֣/נוּ יְהוָ֗ה לַ/עֲשׂוֹת֙ אֶת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/ט֥וֹב לָ֨/נוּ֙ כָּל הַ/יָּמִ֔ים לְ/חַיֹּתֵ֖/נוּ כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/024.yaml
  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: ml
  text: നമ്മുടെ ദൈവമായ യഹോവയെ ഭയപ്പെടാനും, എല്ലാക്കാലവും നമ്മുടെ നന്മയ്ക്കായി, ഇന്നത്തെപ്പോലെ നമ്മെ ജീവനോടെ നിലനിർത്താനും, ഈ ചട്ടങ്ങളൊക്കെയും അനുഷ്ഠിക്കാൻ യഹോവ നമ്മോടു കൽപിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിയമപരമായ നിർദേശങ്ങളെയോ നിശ്ചിത വ്യവസ്ഥകളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְיִרְאָה
  choice: ഭയപ്പെടുന്നതിനും
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയം എന്ന ആശയം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ മൂലപദത്തിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു.
- source_word: לְטוֹב לָנוּ כָּל הַיָּמִים
  choice: എപ്പോഴും നമുക്കു നന്മയുണ്ടാകുന്നതിനും
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘നമ്മുടെ നന്മയ്ക്കായി എല്ലാ ദിവസങ്ങളും’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘എപ്പോഴും’ എന്നു നൽകുന്നു.
- source_word: לְחַיֹּתֵנוּ
  choice: നമ്മെ ജീവനോടെ കാത്തുസൂക്ഷിക്കുന്നതിനും
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരകാർഥമായ ‘നമ്മെ ജീവിപ്പിക്കുക/ജീവനോടെ നിലനിർത്തുക’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: ഇന്നുള്ളതുപോലെ
  rationale: സംസാരിക്കുന്ന ദിവസത്തെ ജനത്തിന്റെ നിലനിൽപ്പ് തെളിവായി ചൂണ്ടിക്കാണിക്കുന്ന ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവഭയം
  choice: യഹോവയെ ഭയപ്പെടുക
  alternative: യഹോവയെ ഭക്തിയോടെ ആദരിക്കുക
  rationale: ‘ഭയം’ എന്ന മൂലഭാഷയിലെ ശക്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു; ഭക്തിയെന്ന ആശയം മാത്രം ചേർത്ത് അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: കല്പനകളുടെ ഉദ്ദേശ്യവും ജീവന്റെ സംരക്ഷണവും
  choice: നന്മയും ജീവനോടെ കാത്തുസൂക്ഷിക്കലും ദൈവകല്പനയുടെ ഉദ്ദേശ്യങ്ങളായി അവതരിപ്പിച്ചു
  alternative: അനുസരണത്തിന്റെ പ്രതിഫലമായി മാത്രം അവതരിപ്പിക്കുക
  rationale: ഹീബ്രുവിലെ ഉദ്ദേശ്യസൂചകമായ לְ ഘടന പിന്തുടരുന്നു; കാരണഫലബന്ധത്തെ പാഠം പറയുന്നതിലധികം വ്യവസ്ഥാപിതമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ഉദ്ദേശ്യഘടനകൾ ‘-ുന്നതിനും’ എന്ന സമാന്തര രൂപത്തിൽ നിലനിർത്തി; അനാവശ്യ ദൈവശാസ്ത്ര വിശദീകരണം ഒഴിവാക്കി.
