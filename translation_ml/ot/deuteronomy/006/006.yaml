review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the referents, present command context, singular addressee, and the Hebrew heart idiom. However, the literal Malayalam phrase “ഹൃദയത്തിന്മേൽ ഉണ്ടായിരിക്കണം” is not idiomatic and risks suggesting a physical location rather than internalized retention. Rendering the idiom naturally as “ഹൃദയത്തിൽ ഉണ്ടായിരിക്കണം,” with the Hebrew wording documented in a footnote, best preserves its intended force without obscuring the source image.
  naturalness: “നിന്നോടു കല്പിക്കുന്ന” is understandable, but “നിന്നോടു കൽപ്പിക്കുന്ന” follows standard contemporary spelling. “ഹൃദയത്തിൽ ഉണ്ടായിരിക്കണം” is substantially more natural modern standard Malayalam than “ഹൃദയത്തിന്മേൽ ഉണ്ടായിരിക്കണം.”
  terminology: “ഈ വചനങ്ങൾ,” “ഹൃദയം,” and “കൽപ്പിക്കുന്ന” are appropriate formal-Biblical yet accessible terms. “ഹൃദയം” properly retains the Hebrew לֵבָב’s broad inner-person sense and should not be narrowed to “മനസ്സ്.”
  issues:
  - severity: medium
    issue: Unnatural literal rendering of עַל־לְבָבֶךָ
    rationale: “നിന്റെ ഹൃദയത്തിന്മേൽ ഉണ്ടായിരിക്കണം” is grammatically possible but unnatural in Malayalam and may be misunderstood. The Hebrew expression is idiomatic; Malayalam should use its natural equivalent while the footnote preserves the literal preposition.
  - severity: low
    issue: Standard spelling of the verb
    rationale: “കൽപ്പിക്കുന്ന” is the standard modern spelling preferred over “കല്പിക്കുന്ന.”
  - severity: low
    issue: Footnote’s stated alternative duplicates the needed main-text idiom after revision
    rationale: Once the main text reads “ഹൃദയത്തിൽ,” the note should no longer introduce that as an alternative; it should explain that the Hebrew literally says “on your heart.”
