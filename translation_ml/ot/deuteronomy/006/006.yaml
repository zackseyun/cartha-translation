reference: Deuteronomy 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָי֞וּ הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם עַל לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/006.yaml
  text: And these words that I am commanding you today shall be on your heart[a].
translation:
  language: ml
  text: ഇന്ന് ഞാൻ നിന്നോടു കൽപ്പിക്കുന്ന ഈ വചനങ്ങൾ നിന്റെ ഹൃദയത്തിൽ ഉണ്ടായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, “നിന്റെ ഹൃദയത്തിന്മേൽ.” ഈ വചനങ്ങൾ ഒരാളുടെ അന്തരംഗജീവിതത്തിൽ നിരന്തരം സൂക്ഷിക്കപ്പെടേണ്ടതിനെ സൂചിപ്പിക്കുന്ന ശൈലീപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: ഉണ്ടായിരിക്കണം
  rationale: മുൻപുള്ള കല്പനാസന്ദർഭത്തിൽ ഭാവി-നിർദേശാത്മകമായ അർഥം നൽകുന്നു; ആ നിർബന്ധഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘ഉണ്ടായിരിക്കണം’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വചനങ്ങൾ
  rationale: דְּבָרִים എന്നതിന്റെ ‘വാക്കുകൾ’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും ഇവിടെ ദൈവിക കല്പനാവചനങ്ങളെ സൂചിപ്പിക്കുന്നതിന് മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികമായ രൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר
  choice: —ക്കുന്ന
  rationale: എബ്രായ ആപേക്ഷികഘടകത്തെ മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണവാക്യഘടനയിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്ര സർവനാമത്തിലെ ഊന്നൽ അതിരുകടന്ന് വിവർത്തനം ചെയ്യാതെ വ്യക്തമായ കർത്താവിനെ നിലനിർത്തുന്നു.
- source_word: מְצַוְּךָ
  choice: നിന്നോടു കല്പിക്കുന്ന
  rationale: വർത്തമാന പ്രസംഗക്രിയയുടെ തത്സമയസ്വഭാവവും ഏകവചന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: മോശെയുടെ അഭിസംബോധനയിലെ കാലസൂചന നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: עַל לְבָבֶךָ
  choice: നിന്റെ ഹൃദയത്തിന്മേൽ
  rationale: עַל എന്നതിന്റെ ‘മേൽ’ എന്ന ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ അപരിചിതത്വം ഉണ്ടാകാവുന്നതിനാൽ ‘ഹൃദയത്തിൽ’ എന്ന വ്യാഖ്യാനപരമായ സ്വാഭാവിക രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: לְבָב എന്ന മാനവശാസ്ത്രപരമായ പ്രയോഗം
  choice: ഹൃദയം
  alternative: മനസ്സ്; അന്തരംഗം
  rationale: എബ്രായപ്രയോഗത്തിൽ ചിന്ത, ഇച്ഛ, വികാരം എന്നിവ ഉൾപ്പെടുന്നതിനാൽ ‘ഹൃദയം’ എന്ന ബൈബിൾരൂപം നിലനിർത്തുന്നു; ‘മനസ്സ്’ എന്നു ചുരുക്കുന്നത് അർഥപരിധി കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കല്പിക്കുക’, ‘വചനങ്ങൾ’, ‘ഹൃദയം’ എന്നിവ മൂലപാഠത്തിന്റെ ശബ്ദവും ബൈബിൾപരമായ ആശയവ്യാപ്തിയും നിലനിർത്തുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘ഹൃദയത്തിന്മേൽ’ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചിരിക്കുന്നു.
