  to: ഇന്ന് ഞാൻ നിന്നോടു കൽപ്പിക്കുന്ന ഈ വചനങ്ങൾ നിന്റെ ഹൃദയത്തിൽ ഉണ്ടായിരിക്കണം.[a]
