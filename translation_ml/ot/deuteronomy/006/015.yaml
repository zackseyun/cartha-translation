  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י אֵ֥ל קַנָּ֛א יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/קִרְבֶּ֑/ךָ פֶּן יֶ֠חֱרֶה אַף יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/ךְ וְ/הִשְׁמִ֣ידְ/ךָ֔ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: ml
  text: കാരണം, നിങ്ങളുടെ മധ്യേയുള്ള നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ അസൂയയുള്ള ദൈവമാണ്[a]; അല്ലെങ്കിൽ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയുടെ കോപം നിങ്ങൾക്കെതിരേ ജ്വലിക്കുകയും അവൻ ഭൂമുഖത്തുനിന്ന്[b] നിങ്ങളെ നശിപ്പിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തീക്ഷ്ണഭാവമുള്ള ദൈവം.” എബ്രായപദം തന്റെ ജനത്തോടുള്ള യഹ്‌വേയുടെ അനന്യമായ ഉടമ്പടിബന്ധത്തെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “നിലത്തിന്റെ മുഖത്തിന്മേൽനിന്ന്”; പൂർണമായി നീക്കം ചെയ്യപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ വിലക്കിനുള്ള കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: אֵל קַנָּא
  choice: തീക്ഷ്ണമായ അവകാശബോധമുള്ള ദൈവം
  rationale: കാനാ എന്ന പദം അസൂയ മാത്രമല്ല, ഉടമ്പടിബന്ധത്തിൽ തന്റെ ജനത്തിന്മേലുള്ള ദൈവത്തിന്റെ അനന്യമായ അവകാശവും എതിരാളി ആരാധനയോടുള്ള അസഹിഷ്ണുതയും സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ഈ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവിക നാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവം
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയം ഉൾക്കൊള്ളുന്ന രൂപത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ; മലയാളത്തിൽ മാന്യമായ ഏകവചന സംബോധന ഉപയോഗിക്കുന്നു.
- source_word: בְּקִרְבֶּךָ
  choice: നിങ്ങളുടെ മധ്യേയുള്ള
  rationale: വ്യക്തിയുടെ ഉള്ളിൽ എന്നതിലുപരി ജനത്തിനിടയിലെ ദൈവസാന്നിധ്യം സൂചിപ്പിക്കുന്ന സ്ഥലപരവും ഉടമ്പടിപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: פֶּן
  choice: നശിപ്പിച്ചുകളയാതിരിക്കാൻ സൂക്ഷിക്കുക
  rationale: സാധ്യതയുള്ള ഭയാനക ഫലത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പ് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֶחֱרֶה אַף
  choice: കോപം ... ജ്വലിച്ച്
  rationale: എബ്രായത്തിലെ കോപം കത്തുക എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: בָּךְ
  choice: നിങ്ങൾക്കെതിരേ
  rationale: കോപക്രിയയോടൊപ്പമുള്ള പ്രതിയോഗാത്മക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְהִשְׁמִידְךָ
  choice: നിങ്ങളെ നശിപ്പിച്ചുകളയുക
  rationale: ശמד എന്ന ക്രിയയുടെ ശക്തമായ സമൂലനാശത്തിന്റെ ഭാവം സംസാരഭാഷാപരമാകാതെ പകരുന്നു.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: ഭൂമുഖത്തുനിന്ന്
  rationale: നിലത്തിന്റെ മുഖത്തുനിന്ന് പൂർണമായി നീക്കം ചെയ്യപ്പെടുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവിക തീക്ഷ്ണത/അസൂയയുടെ പരിഭാഷ
  choice: തീക്ഷ്ണമായ അവകാശബോധമുള്ള ദൈവം
  alternative: അസൂയയുള്ള ദൈവം; തീക്ഷ്ണതയുള്ള ദൈവം
  rationale: ഇത് പാപകരമായ അസൂയയല്ല, ഉടമ്പടിയിലെ അനന്യബന്ധത്തിന്മേലുള്ള ദൈവത്തിന്റെ അവകാശവും എതിരാളി ആരാധനയോടുള്ള അസഹിഷ്ണുതയുമാണ്. മുഖ്യപാഠത്തിൽ അർഥം വ്യക്തമാക്കുമ്പോഴും അടിക്കുറിപ്പിൽ പരമ്പരാഗതമായ ‘അസൂയയുള്ള’ എന്ന സാധ്യത സംരക്ഷിക്കുന്നു.
- issue: יהוה എന്ന ദൈവനാമം
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം സ്ഥാനപ്പേരാൽ മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- issue: മുന്നറിയിപ്പിന്റെ വ്യാകരണരൂപം
  choice: '...നശിപ്പിച്ചുകളയാതിരിക്കാൻ സൂക്ഷിക്കുക'
  alternative: അല്ലെങ്കിൽ ... നശിപ്പിച്ചുകളയും
  rationale: פֶּן സൂചിപ്പിക്കുന്ന ഭയപ്പെടേണ്ട സാധ്യതയും മുന്നറിയിപ്പിന്റെ ശക്തിയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ രണ്ടാം പുരുഷ പുല്ലിംഗ ഏകവചനം മലയാളത്തിൽ മാന്യമായ ‘നിങ്ങൾ’ രൂപത്തിൽ നൽകിയിരിക്കുന്നു. കോപം ‘ജ്വലിക്കുക’ എന്ന മൂലരൂപകം നിലനിർത്തി.
