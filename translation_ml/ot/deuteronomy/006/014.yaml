language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֣א תֵֽלְכ֔וּ/ן אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים מֵ/אֱלֹהֵי֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר סְבִיבוֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/014.yaml
  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: ml
  text: നിങ്ങൾ അന്യദേവന്മാരുടെ പിന്നാലെ പോകരുത്[a]—നിങ്ങളുടെ ചുറ്റുമുള്ള ജനതകളുടെ ദേവന്മാരിൽ ഒരാളുടെയും പിന്നാലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ കൂടുതൽ ഭാവാർഥമായി: “നിങ്ങൾ അന്യദേവന്മാരെ പിന്തുടരരുത്—നിങ്ങളുടെ ചുറ്റുമുള്ള ജനതകളുടെ ദേവന്മാരിൽ ഒരാളെയും.”'
    reason: הלך אחרי എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൂടുതൽ സ്വാഭാവികമായ മലയാള ഭാവാർഥം നൽകുന്നു.
lexical_decisions:
- source_word: לֹא תֵלְכוּן אַחֲרֵי
  choice: പിന്നാലെ പോകരുത്
  rationale: הלך אחרי എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിൽ മതപരമായ അനുഗമനവും കൂറും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള വിലക്ക് നൽകുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാർ
  rationale: ഇസ്രായേലിന്റെ ദൈവമല്ലാത്ത ദേവന്മാരെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘അന്യദേവന്മാർ’ എന്നത് സംക്ഷിപ്തവും പരമ്പരാഗതമായ അർഥഭാരം ഉള്ളതുമായ ആധുനിക മലയാള പ്രയോഗമാണ്.
- source_word: מֵאֱלֹהֵי הָעַמִּים
  choice: ജനതകളുടെ ദേവന്മാരിൽ ആരുടെയും
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ഭാഗികാർഥം (‘അവരിൽ/അവയിൽ ആരെങ്കിലും’) വ്യക്തമാക്കുന്നു; മുൻപുള്ള ‘അന്യദേവന്മാർ’ ആരെ ഉൾക്കൊള്ളുന്നു എന്നും സ്വാഭാവികമായി വിശദീകരിക്കുന്നു.
- source_word: הָעַמִּים
  choice: ജനതകൾ
  rationale: עַמִּים എന്ന ബഹുവചനത്തിന് അടുത്തുനിൽക്കുകയും രാഷ്ട്രീയ രാഷ്ട്രങ്ങളെക്കാൾ ചുറ്റുമുള്ള ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: നിങ്ങളുടെ ചുറ്റുമുള്ള
  rationale: ഇസ്രായേലിനെ ചുറ്റിപ്പാർക്കുന്ന അയൽജനതകളെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: വിലക്കിന്റെ സ്വഭാവം
  choice: മറ്റു ദേവന്മാരെ അനുഗമിക്കുകയോ അവരോട് മതപരമായ കൂറ് പുലർത്തുകയോ ചെയ്യരുതെന്ന ഉടമ്പടിസംബന്ധമായ വിലക്ക്
  alternative: വിഗ്രഹാരാധനാലയങ്ങളിലേക്കു ശാരീരികമായി നടന്നുപോകുന്നതിനെ മാത്രം വിലക്കുന്ന വായന
  rationale: ആവർത്തനപുസ്തകത്തിൽ הלך אחרי എന്ന പ്രയോഗം സാധാരണയായി മതപരമായ അനുഗമനത്തെയും കൂറിനെയും സൂചിപ്പിക്കുന്നു. എന്നാൽ ‘ആരാധിക്കരുത്’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ മൂലത്തിലെ രൂപകം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘പിന്നാലെ പോകരുത്’ എന്ന മൂലഭാഷാരൂപകവും ‘പിന്തുടരരുത്’ എന്ന ഭാവാർഥവും ചേർത്ത് അർഥവ്യാപ്തി സംരക്ഷിച്ചിരിക്കുന്നു.
