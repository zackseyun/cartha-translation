  yaml_path: translation/ot/deuteronomy/006/009.yaml
  text: You shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: ml
  text: അവയെ നിന്റെ വീടിന്റെ വാതിൽക്കട്ടിളകളിലും നിന്റെ കവാടങ്ങളിലും എഴുതണം[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വാതിൽച്ചട്ടങ്ങളിൽ.’ എബ്രായപദം ഒരു വാതിലിന്റെ ഇരുവശങ്ങളിലുള്ള കട്ടിളക്കാലുകളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിന്റെ കവാടത്തൂണുകളിലും’ / ‘നിന്റെ കവാടങ്ങൾക്കരികിലും.’ എബ്രായപദം കവാടപ്രദേശത്തെയോ അതിന്റെ ഘടനാപരമായ പ്രവേശനത്തൂണുകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: അവയെ ... എഴുതണം
  rationale: മുൻസന്ദർഭത്തിലെ വചനങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചന കർമപ്രത്യയം ‘അവയെ’ എന്നു വ്യക്തമാക്കി നിലനിർത്തുന്നു. കല്പനാശൃംഖലയിലെ ക്രിയയുടെ നിർദേശാത്മക ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ ‘എഴുതണം’ എന്നു നൽകുന്നു.
- source_word: עַל
  choice: -ന്മേൽ
  rationale: എഴുത്ത് സ്ഥാപിക്കേണ്ട ഉപരിതലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന്റെ സ്ഥലാർഥം നിലനിർത്തുന്നു.
- source_word: מְזוּזֹת
  choice: വാതിൽപ്പടികൾ
  rationale: പ്രവേശനവാതിലിന്റെ ഇരുവശത്തുമുള്ള കട്ടിളക്കാലുകളെയാണ് എബ്രായ നാമം പ്രത്യേകിച്ച് സൂചിപ്പിക്കുന്നത്. സാധാരണ മലയാളത്തിൽ മനസ്സിലാകുന്ന പരമ്പരാഗതവും കൃത്യവുമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: בֵּיתֶךָ
  choice: നിന്റെ വീടിന്റെ
  rationale: ഭൗതികമായ വീടിനെയും ഗൃഹപരിസരത്തെയും സൂചിപ്പിക്കുന്ന בַּיִת എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: וּבִשְׁעָרֶיךָ
  choice: നിന്റെ പടിവാതിലുകളിന്മേലും
  rationale: שַׁעַר പട്ടണത്തിന്റെയോ വളപ്പിന്റെയോ കവാടത്തെയും അതിന്റെ പ്രവേശനഘടനയെയും സൂചിപ്പിക്കാം. ബഹുവചനം സംരക്ഷിച്ച് സമാന്തരമായ എഴുത്തുസ്ഥാനം വ്യക്തമാക്കുന്നു.
