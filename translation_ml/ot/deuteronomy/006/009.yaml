translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കല്പനാശൈലി. ‘വാതിൽപ്പടി’യും ‘പടിവാതിൽ’യും തമ്മിലുള്ള വ്യത്യാസം ഉപയോഗിച്ച് വീടിന്റെ കട്ടിളക്കാലുകളും പുറത്തെ കവാടങ്ങളും വേർതിരിച്ചിരിക്കുന്നു; എബ്രായത്തിലെ സ്ഥലസംബന്ധമായ ചെറിയ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
