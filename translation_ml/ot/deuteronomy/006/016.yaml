    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תְנַסּוּ
  choice: പരീക്ഷിക്കരുത്
  rationale: לֹא ചേർന്ന പിയേൽ അപൂർണ്ണക്രിയ ഇവിടെ നിരോധനം സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ നിരോധനരൂപമാണിത്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവായി ഉപയോഗിക്കുന്ന ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം കൃത്യമായി നൽകുന്നു; മലയാളവാക്യത്തിൽ ദൈവനാമത്തോടുള്ള ബന്ധം സ്വാഭാവികമാക്കാൻ ‘ദൈവമായ’ എന്നു പ്രയോഗിച്ചു.
- source_word: כַּאֲשֶׁר
  choice: …പോലെ
  rationale: മുമ്പുണ്ടായ സംഭവത്തോടുള്ള താരതമ്യം സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: נִסִּיתֶם
  choice: നിങ്ങൾ … പരീക്ഷിച്ചതുപോലെ
  rationale: മുൻ ക്രിയയിലെ נסה എന്ന അതേ ധാതുവിന് ‘പരീക്ഷിക്കുക’ എന്ന ഒരേ പദം ഉപയോഗിച്ച് മൂലത്തിലെ ശബ്ദബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: בַּמַּסָּה
  choice: മസ്സായിൽവെച്ച്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്യുകയും בְּ എന്ന സ്ഥലസൂചകം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്; അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ സംരക്ഷിച്ചു.
- issue: മസ്സായിലെ സംഭവത്തെ മുഖ്യപാഠത്തിൽ വിശദീകരിക്കണമോ
  choice: സ്ഥലനാമം മാത്രം നിലനിർത്തുക
  alternative: ‘പരീക്ഷണസ്ഥലമായ മസ്സായിൽ’ എന്ന് വികസിപ്പിക്കുക
  rationale: എബ്രായപാഠം സ്ഥലനാമം മാത്രമാണ് നൽകുന്നത്. പുറപ്പാട് 17-ലെ പശ്ചാത്തലവും പേരിന്റെ പദബന്ധവും അടിക്കുറിപ്പിൽ നൽകുന്നതാണ് മൂലത്തോട് കൂടുതൽ വിശ്വസ്തം.
- issue: נסה എന്ന ക്രിയയുടെ ഭാവാർഥം
  choice: പരീക്ഷിക്കുക
  alternative: പരീക്ഷണത്തിന് വിധേയനാക്കുക
  rationale: ചുരുക്കവും സ്വാഭാവികവുമായ പദം തിരഞ്ഞെടുത്തു; ദൈവത്തെ തെളിവ് ആവശ്യപ്പെട്ട് വെല്ലുവിളിക്കുന്ന ആശയം വ്യക്തമാക്കുന്ന ദീർഘരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ രണ്ടാം പുരുഷ ബഹുവചനവും נסה എന്ന ഒരേ ധാതുവിന്റെ ആവർത്തനവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ മുഖ്യപാഠത്തിൽ ക്രമമായി ചേർത്തിട്ടുണ്ട്.
