  text: മസ്സായിൽ നിങ്ങൾ പരീക്ഷിച്ചതുപോലെ, നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയെ പരീക്ഷിക്കരുത്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മസ്സാ എന്നത് മരുഭൂമിയിൽ ഇസ്രായേൽ യാഹ്‌വേയെ പരീക്ഷിച്ച സ്ഥലമാണ് (പുറപ്പാട് 17:1–7); ആ പേരിന് ‘പരീക്ഷിക്കൽ’ എന്ന ആശയവുമായി ബന്ധമുണ്ട്.
