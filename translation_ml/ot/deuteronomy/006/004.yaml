id: DEU.6.4
reference: Deuteronomy 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שְׁמַ֖ יִשְׂרָאֵ֑ל יְהוָ֥ה אֱלֹהֵ֖י/נוּ יְהוָ֥ה אֶחָֽ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/004.yaml
  text: 'Hear[a], Israel: Yahweh our God, Yahweh is one.'
translation:
  language: ml
  text: 'കേൾക്കുക, ഇസ്രായേലേ: യഹ്‌വേ നമ്മുടെ ദൈവം; യഹ്‌വേ ഒരുവനാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, “യഹ്‌വേയാണ് നമ്മുടെ ദൈവം; യഹ്‌വേ മാത്രം”; മറ്റൊരു സാധ്യത: “നമ്മുടെ ദൈവമായ യഹ്‌വേ ഒരുവനാണ്.” ഹീബ്രായ വാക്യം സങ്കുചിതമായതിനാൽ വ്യാകരണപരമായി ഒന്നിലധികം വിവർത്തനങ്ങൾ സാധ്യമാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: കേൾക്കുക
  rationale: ഇസ്രായേൽ എന്ന സമൂഹത്തെ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്ന ആജ്ഞയാണ്. ശ്രവിക്കുക എന്ന അർഥത്തോടൊപ്പം ശ്രദ്ധിച്ച് അനുസരിക്കുക എന്ന ഉടമ്പടിപരമായ ആഹ്വാനവും ഈ പദം നിലനിർത്തുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ഉടമ്പടിജനത്തിന്റെ പേരായതിനാൽ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, വ്യക്തിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനസ്വഭാവമുള്ളതായിരുന്നാലും ഈ ഉടമ്പടിസന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനപദവിയായി പ്രവർത്തിക്കുന്നു.
- source_word: אֶחָד
  choice: ഏകൻ
  rationale: അടിസ്ഥാനമായ ‘ഒന്ന്’ എന്ന അർഥം വ്യക്തിയെക്കുറിച്ചുള്ള ഈ വിധേയപ്രയോഗത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ഏകൻ’ എന്നു നൽകി. ‘മാത്രം’ അല്ലെങ്കിൽ ‘അതുല്യൻ’ എന്ന വ്യാഖ്യാനവികാസം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ശെമയുടെ അവസാന ഭാഗത്തിന്റെ വാക്യഘടനയും അർഥവും
  choice: യഹ്‌വേ നമ്മുടെ ദൈവം; യഹ്‌വേ ഏകൻ
  alternative: യഹ്‌വേയാണ് നമ്മുടെ ദൈവം; യഹ്‌വേ മാത്രം / നമ്മുടെ ദൈവമായ യഹ്‌വേ ഏക യഹ്‌വേ ആകുന്നു
  rationale: ക്രിയയില്ലാത്ത സങ്കുചിത ഹീബ്രായ വാക്യഘടന ഒന്നിലധികം വിശ്വസനീയമായ ബന്ധനങ്ങൾ അനുവദിക്കുന്നു. മുഖ്യവിവർത്തനം אֶחָד എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘ഒന്ന്’ എന്ന അർഥം നിലനിർത്തുന്നു; ഏകോപാസനയുടെ ‘മാത്രം’ എന്ന വായനയെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘യഹ്‌വേ’ എന്ന ദൈവനാമം നിലനിർത്തി. ഹീബ്രായത്തിലെ താളമുള്ള ആവർത്തനം മലയാളത്തിലും സംരക്ഷിച്ചു; യഥാർഥ വാക്യഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
