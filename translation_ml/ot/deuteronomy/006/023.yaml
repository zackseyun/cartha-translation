id: DEU.6.23
reference: Deuteronomy 6:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אוֹתָ֖/נוּ הוֹצִ֣יא מִ/שָּׁ֑ם לְמַ֨עַן֙ הָבִ֣יא אֹתָ֔/נוּ לָ֤/תֶת לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: ml
  text: അവൻ നമ്മെ അവിടെനിന്ന് പുറത്തുകൊണ്ടുവന്നു; നമ്മുടെ പിതാക്കന്മാർക്കു[a] നൽകാമെന്ന് ശപഥം ചെയ്ത ദേശം നമുക്കു നൽകാനായി നമ്മെ അതിലേക്കു കൊണ്ടുവരേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ ‘നമ്മുടെ പൂർവികർക്കു.’ എബ്രായത്തിൽ: ‘നമ്മുടെ പിതാക്കന്മാർക്കു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹתָנוּ הוֹצִיא מִשָּׁם
  choice: അവൻ നമ്മെ അവിടെനിന്ന് പുറപ്പെടുവിച്ചു
  rationale: മുൻനിരയിൽ വരുന്ന നേരിട്ടുള്ള കർമത്തെ സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ ഉൾപ്പെടുത്തി. ഹിഫീൽ രൂപമായ הוֹצִיאയുടെ ‘പുറത്തുകൊണ്ടുവരുക’ എന്ന അർഥം പുറപ്പാടിന്റെ ഭാഷ നിലനിർത്തുന്നവിധം ‘പുറപ്പെടുവിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְמַעַן
  choice: …തരേണ്ടതിനായിരുന്നു അത്
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം. വാക്യത്തിലെ തുടർന്നുള്ള രണ്ടു ക്രിയകളെയും ദൈവം പുറപ്പെടുവിച്ചതിന്റെ ലക്ഷ്യമായി സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: הָבִיא אֹתָנוּ
  choice: നമ്മെ അകത്തേക്കു കൊണ്ടുവന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ പ്രവേശിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെടുവിച്ചു’ എന്ന മുൻപ്രയോഗത്തോടുള്ള അകത്ത്–പുറത്ത് വൈരുധ്യം നിലനിർത്താൻ ‘അകത്തേക്കു’ ചേർത്തു; ലക്ഷ്യസ്ഥലം അടുത്ത പ്രയോഗത്തിലെ ‘ദേശം’ വ്യക്തമാക്കുന്നു.
- source_word: לָתֵת לָנוּ אֶת־הָאָרֶץ
  choice: ദേശം നമുക്കു തരേണ്ടതിന്
  rationale: נתן എന്നതിന്റെ നേരിട്ടുള്ള ‘തരുക’ എന്ന അർഥവും ഉടമ്പടി പശ്ചാത്തലത്തിലുള്ള הָאָרֶץ എന്നതിന്റെ പതിവായ ‘ദേശം’ എന്ന അർഥവും നിലനിർത്തി.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: ശപഥം ചെയ്ത
  rationale: נשבע സാധാരണ വാഗ്ദാനത്തേക്കാൾ വ്യക്തമായി ആണയിട്ട് ഉറപ്പുനൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ഉടമ്പടി-ശപഥത്തിന്റെ ഭാരം നിലനിർത്തി.
- source_word: לַאֲבֹתֵינוּ
  choice: നമ്മുടെ പിതാക്കന്മാർക്കു
  rationale: എബ്രായ പദം അക്ഷരാർഥത്തിൽ ‘നമ്മുടെ പിതാക്കന്മാർ’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരിലേക്കുള്ള ഉടമ്പടിബന്ധം നിലനിർത്തുന്നു. വിശാലമായ ‘പൂർവികർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: לַאֲבֹתֵינוּ എന്നതിലെ ലിംഗസൂചകമായ ഉടമ്പടി പരാമർശം
  choice: നമ്മുടെ പിതാക്കന്മാർക്കു
  alternative: നമ്മുടെ പൂർവികർക്കു
  rationale: മൂലപാഠം പുല്ലിംഗ ബഹുവചനമാണ്; സന്ദർഭം ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെ പ്രത്യേകമായി ഓർമിപ്പിക്കുന്നു. അതിനാൽ പ്രധാനപാഠത്തിൽ ആ രൂപം നിലനിർത്തി, കൂടുതൽ പൊതുവായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: נִשְׁבַּע എന്നതിലെ ഉടമ്പടി-ശപഥഭാഷ
  choice: ശപഥം ചെയ്ത
  alternative: വാഗ്ദാനം ചെയ്ത
  rationale: ദേശം നൽകുന്നത് ദൈവത്തിന്റെ കേവലമായ ഒരു വാഗ്ദാനത്തിലല്ല, ശപഥത്തോടെ ഉറപ്പിച്ച പ്രതിജ്ഞയിലാണ് ആധാരപ്പെടുന്നതെന്ന് മൂലപാഠം വ്യക്തമാക്കുന്നു; അതിനാൽ ‘ശപഥം’ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘പുറപ്പെടുവിച്ചു / അകത്തേക്കു കൊണ്ടുവന്ന്’ എന്ന ദിശാവൈരുധ്യവും ‘ശപഥം’ എന്ന ഉടമ്പടി-ഭാരമുള്ള പദവും സംരക്ഷിച്ചു.
