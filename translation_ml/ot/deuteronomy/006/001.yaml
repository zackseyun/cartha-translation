  edition: WLC
  text: וְ/זֹ֣את הַ/מִּצְוָ֗ה הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לְ/לַמֵּ֣ד אֶתְ/כֶ֑ם לַ/עֲשׂ֣וֹת בָּ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: ml
  text: 'നിങ്ങളെ പഠിപ്പിക്കാൻ നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ[b] കല്പിച്ച കല്പന—ചട്ടങ്ങളും ന്യായവിധികളും[d]—ഇതാണ്[a]: നിങ്ങൾ അതിനെ കൈവശമാക്കാൻ[c] കടന്നുചെല്ലുന്ന ദേശത്ത് അവ അനുഷ്ഠിക്കേണ്ടതിനായി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇതും’ അഥവാ ‘ഇതാ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ ആരംഭബന്ധകം മുൻസന്ദർഭത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘യഹ്‌വെ’ എന്നത് എബ്രായത്തിലെ YHWH എന്ന ദൈവനാമത്തിന്റെ ലിപ്യന്തരമാണ്; ചില പരിഭാഷകൾ ഇവിടെ ‘കർത്താവ്’ എന്നും പരമ്പരാഗതമായി ‘യഹോവ’ എന്നും ഉപയോഗിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അഥവാ ‘അതിനെ സ്വന്തമാക്കാൻ’ അല്ലെങ്കിൽ ‘അതിനെ അവകാശമാക്കാൻ’.
    reason: lexical_alternative
  - marker: d
    text: ‘ന്യായവിധികൾ’ എന്നതിന് ‘നിയമനിർണയങ്ങൾ’ അഥവാ ‘ചട്ടവിധികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: ഇതാണ്
  rationale: വിഭാഗാരംഭം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; വാവിന്റെ ബന്ധകഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַמִּצְוָה
  choice: കല്പന
  rationale: ഏകവചനം നിലനിർത്തി, പിന്നാലെയുള്ള നിയമവിഭാഗങ്ങളെ ഒറ്റ സമാഹാരശീർഷകമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: സ്ഥിരമായി നിശ്ചയിക്കപ്പെട്ട നിയമനിർദേശങ്ങൾ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: וְהַמִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: משפט എന്ന പദത്തിന്റെ ന്യായ-നിയമപരമായ ഭാവം നിലനിർത്തുന്നു; ‘നിയമനിർണയങ്ങൾ’ എന്ന വായനയും സാധ്യമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לְלַמֵּד אֶתְכֶם
  choice: നിങ്ങളെ പഠിപ്പിക്കണമെന്ന്
  rationale: പഠിപ്പിക്കൽ എന്ന ലക്ഷ്യം നിലനിർത്തുന്നു; കല്പന ലഭിച്ച വ്യക്തിയെ എബ്രായമൂലം വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിലും അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: לַעֲשׂוֹת
  choice: അവ അനുഷ്ഠിക്കണം
  rationale: നിയമപരമായ സാഹചര്യത്തിൽ ‘ചെയ്യുക’ എന്നതിന്റെ പ്രായോഗിക അനുസരണഭാവം സ്വാഭാവികമായി നൽകുന്നു; ‘അവ’ എന്നത് ചട്ടങ്ങളെയും ന്യായവിധികളെയും സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: നിങ്ങൾ ... കടന്നുചെല്ലുന്ന ദേശത്ത്
  rationale: ദേശത്തേക്കുള്ള ദിശയും പ്രവേശനചലനവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ירשׁ എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ ദേശം ഏറ്റെടുത്തു സ്വന്തമാക്കുക എന്ന സജീവഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സൂക്ഷിക്കുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനുപകരം ഹീബ്രു നാമത്തിന്റെ സാധ്യതയേറിയ ഉച്ചാരണത്തോട് അടുത്ത രൂപം ഉപയോഗിക്കുന്നു.
- issue: ഏകവചനമായ ‘കല്പന’യും ബഹുവചനമായ ‘ചട്ടങ്ങളും ന്യായവിധികളും’ തമ്മിലുള്ള ബന്ധം
  choice: എണ്ണവ്യത്യാസം നിലനിർത്തി ഇടവരകളിലൂടെ വിശദീകരണബന്ധം കാണിക്കുക
  alternative: എല്ലാം ബഹുവചനമാക്കി ‘കല്പനകളും ചട്ടങ്ങളും ന്യായവിധികളും’ എന്നു സമമാക്കുക
  rationale: ഹീബ്രുവിലെ ഏകവചന-ബഹുവചന സംഘർഷം ഇല്ലാതാക്കാതെ, ഏകവചനം സമാഹാരശീർഷകവും പിന്നാലെയുള്ള പദങ്ങൾ അതിന്റെ വിശദീകരണവും ആയിരിക്കാമെന്ന സാധ്യത തുറന്നുവെക്കുന്നു.
- issue: കല്പിക്കപ്പെട്ട പഠിപ്പിക്കുന്ന വ്യക്തിയുടെ അപ്രകടിതാവസ്ഥ
  choice: വ്യക്തിയെ ചേർക്കാതെ ‘നിങ്ങളെ പഠിപ്പിക്കണമെന്ന് കല്പിച്ച’ എന്നു നൽകുക
  alternative: ‘എന്നോട് നിങ്ങളെ പഠിപ്പിക്കാൻ കല്പിച്ച’
  rationale: സന്ദർഭത്തിൽ മോശെയായിരിക്കാമെങ്കിലും ഈ വാക്യത്തിലെ ഹീബ്രു പാഠം ‘എന്നോട്’ എന്ന് തുറന്നുപറയുന്നില്ല; അതിനാൽ പാഠത്തിന്റെ അപ്രകടിതാവസ്ഥ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമ-ഉടമ്പടി പശ്ചാത്തലത്തിന്റെ ഔപചാരികത നിലനിർത്തുമ്പോഴും അത്യന്തം പുരാതനമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. മൂലത്തിലെ ഏകവചന-ബഹുവചന ഘടന ഇടവരകളിലൂടെ സംരക്ഷിച്ചു.
