  terminology: “യഹോവ,” “സന്നിധിയിൽ,” “കല്പന,” and “നീതി” are appropriate biblical-register terms. “നീതി” preserves the covenantal righteousness/rightness sense without forcing a later doctrinal sense; the footnote responsibly records “ന്യായം” as a lexical alternative.
