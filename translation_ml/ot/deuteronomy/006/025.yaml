source:
  edition: WLC
  text: וּ/צְדָקָ֖ה תִּֽהְיֶה לָּ֑/נוּ כִּֽי נִשְׁמֹ֨ר לַ/עֲשׂ֜וֹת אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵ֖י/נוּ כַּ/אֲשֶׁ֥ר צִוָּֽ/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
translation:
  language: ml
  text: നമ്മുടെ ദൈവമായ യഹോവ നമ്മോടു കല്പിച്ചതുപോലെ, അവിടുത്തെ സന്നിധിയിൽ ഈ കല്പന മുഴുവനും ശ്രദ്ധയോടെ അനുഷ്ഠിച്ചാൽ, അതു നമുക്കു നീതിയായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീതി” എന്നതിന് “ന്യായം” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ശരിയായതോ ന്യായമായതോ ആയ അവസ്ഥയെ സൂചിപ്പിക്കാം; ഈ ഉടമ്പടിപശ്ചാത്തലത്തിൽ “നീതി” എന്നാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  choice: നീതി
  rationale: צְדָקָה എന്ന പദത്തിന്റെ ശരിയായ നില, ധാർമിക ന്യായം, നീതിപൂർവത എന്നീ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ഉടമ്പടി-അനുസരണത്തിന്റെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗവുമാണ്.
- source_word: תִּהְיֶה לָּנוּ
  choice: അതു നമുക്കു ... ആയിരിക്കും
  rationale: എബ്രായത്തിലെ വിധേയഘടന നിലനിർത്തുകയും ‘കണക്കിടപ്പെടും’ പോലുള്ള പിന്നീട് രൂപപ്പെട്ട സാങ്കേതിക ദൈവശാസ്ത്രഭാഷ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי
  choice: -ച്ചാൽ
  rationale: ഇവിടെ പ്രസ്താവനയുടെ നിബന്ധനയാണ് כִּי സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സോപാധിക ക്രിയാരൂപം സ്വാഭാവികമായി ‘if’ എന്ന അർഥം നൽകുന്നു.
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  choice: ശ്രദ്ധയോടെ അനുഷ്ഠിച്ചാൽ
  rationale: שׁמר എന്നതിലെ ജാഗ്രതയുടെയും സൂക്ഷ്മപാലനത്തിന്റെയും ഭാവവും עשה എന്നതിലെ പ്രാവർത്തിക അനുസരണവും ചുരുക്കവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: ഈ കല്പന മുഴുവനും
  rationale: ഏകവചനമായ מִצְוָהയെ ഒരു ഏകീകൃത ഉപദേശസമുച്ചയമായി വായിക്കാവുന്ന വിധത്തിൽ, כָּל എന്നതിന്റെ സമഗ്രതയും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לִפְנֵי
  choice: സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിൽ, അവിടുത്തെ ദൃഷ്ടിയിലും സാന്നിധ്യത്തിലും ജീവിക്കുന്ന ഉടമ്പടിപരമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമമായ יהוהയെ ‘യഹോവ’ എന്നു നിലനിർത്തുകയും אֱלֹהֵינוּ എന്ന ഉടമ്പടിബന്ധസൂചന കൃത്യമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: നമ്മോടു കല്പിച്ചതുപോലെ
  rationale: മുമ്പ് നൽകിയ ദൈവകല്പന ഇപ്പോഴത്തെ അനുസരണത്തിന്റെ മാനദണ്ഡമാണെന്ന ബന്ധം കൃത്യമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-അനുസരണത്തിന്റെ പശ്ചാത്തലത്തിൽ צְדָקָהയുടെ അർഥം
  choice: ‘അതു നമുക്കു നീതിയായിരിക്കും’ എന്ന നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തി.
  alternative: ‘അതു നമുക്കു നീതിയായി കണക്കാക്കപ്പെടും’ അല്ലെങ്കിൽ ‘അതു നമുക്കു ന്യായമായിരിക്കും.’
  rationale: വാക്യം അനുസരണവും നീതിയും തമ്മിൽ യഥാർഥബന്ധം ഉറപ്പിക്കുന്നു; എന്നാൽ ‘കണക്കാക്കപ്പെടും’ എന്ന സാങ്കേതിക ആരോപണഭാഷയിലൂടെ പിന്നീടുള്ള ഒരു ദൈവശാസ്ത്രരീതി ഇവിടെ അടിച്ചേൽപ്പിക്കുന്നില്ല. അതുപോലെ ‘ന്യായം’ മാത്രമാക്കി സാമൂഹിക നീതിയിലേക്ക് അർഥം ചുരുക്കുന്നുമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായവാക്യത്തിന്റെ നിബന്ധനാത്മകതയും ‘നമുക്കു നീതിയായിരിക്കും’ എന്ന ദൈവശാസ്ത്ര പിരിമുറുക്കവും നിലനിർത്തി; മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി നിബന്ധനാഭാഗം ആദ്യം നൽകിയിരിക്കുന്നു.
