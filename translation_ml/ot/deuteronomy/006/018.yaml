  text: וְ/עָשִׂ֛יתָ הַ/יָּשָׁ֥ר וְ/הַ/טּ֖וֹב בְּ/עֵינֵ֣י יְהוָ֑ה לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וּ/בָ֗אתָ וְ/יָֽרַשְׁתָּ֙ אֶת הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: ml
  text: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ ശരിയും നല്ലതും നീ ചെയ്യണം; അങ്ങനെ നിനക്കു നന്മ വരാനും, യഹ്‌വെ നിന്റെ പിതാക്കന്മാരോടു ശപഥംചെയ്ത നല്ല ദേശത്തു നീ പ്രവേശിച്ച് അതു കൈവശമാക്കാനും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവകാശമാക്കാനും.” എബ്രായക്രിയയ്ക്ക് ‘അവകാശമാക്കുക,’ ‘കൈവശമാക്കുക,’ ‘സ്വന്തമാക്കുക’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ഇസ്രായേൽ ശപഥത്താൽ വാഗ്ദാനം ചെയ്യപ്പെട്ട ദേശത്തു പ്രവേശിച്ച് അതു കൈവശമാക്കുന്നതാണ് സന്ദർഭം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ ചെയ്യണം
  rationale: നിർദേശാത്മകമായ ഉടമ്പടിക്കല്പനയുടെ ഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: ശരിയും നല്ലതുമായതു
  rationale: ‘നേരായത്/ശരിയായത്’ എന്നും ‘നല്ലത്’ എന്നും ഉള്ള രണ്ടു നൈതിക വിശേഷണങ്ങളും വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: എബ്രായത്തിലെ വിലയിരുത്തൽസൂചകമായ ‘കണ്ണുകളിൽ’ എന്ന പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: അങ്ങനെ നിനക്കു നന്മ വരും
  rationale: ഉദ്ദേശ്യവും അനുകൂല ഫലവും സൂചിപ്പിക്കുന്ന ഘടനയും, ഭൗതിക സമൃദ്ധിയിൽ മാത്രം ഒതുങ്ങാത്ത ക്ഷേമത്തിന്റെ വിശാല അർഥവും നൽകുന്നു.
- source_word: וּבָאתָ
  choice: നീ കടന്നുചെന്ന്
  rationale: വാഗ്ദത്തദേശത്തിനകത്തേക്കുള്ള പ്രവേശനചലനം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: וְיָרַשְׁתָּ
  choice: അതു കൈവശമാക്കും
  rationale: യָרַשׁ എന്ന ക്രിയയുടെ സജീവമായ പ്രവേശിച്ചു സ്വന്തമാക്കുക/കൈവശപ്പെടുത്തുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘അവകാശമാക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: ആ നല്ല ദേശം
  rationale: മൂലത്തിലെ ലളിതമായ മൂല്യനിർണയ വിശേഷണം വ്യാഖ്യാനവികാസമില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ
  choice: യഹ്‌വെ നിന്റെ പിതാക്കന്മാർക്കു നൽകുമെന്ന് സത്യംചെയ്ത
  rationale: മലയാളത്തിൽ ബന്ധവാക്യം പൂർണമാക്കാൻ സത്യത്തിന്റെ സന്ദർഭത്തിൽ അന്തർലീനമായ ‘നൽകുക’ വ്യക്തമാക്കുന്നു; അതേസമയം נִשְׁבַּע എന്നതിന്റെ ശപഥസ്വഭാവം ‘സത്യംചെയ്ത’ എന്നു നിലനിർത്തുന്നു.
- source_word: לַאֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാർക്കു
  rationale: ചരിത്രപരമായി നിർദിഷ്ടമായ പുരുഷലിംഗ ബഹുവചന ബന്ധുപദവും ഗോത്രപിതാക്കന്മാരോടുള്ള ഉടമ്പടിസൂചനയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി അവതരിപ്പിക്കുന്നു.
- issue: לַאֲבֹתֶיךָ എന്ന ലിംഗനിർദിഷ്ട ബന്ധുപദം
  choice: നിന്റെ പിതാക്കന്മാർക്കു
  alternative: നിന്റെ പൂർവികർക്കു
  rationale: ഇവിടെ സൂചന ചരിത്രപരമായി ഗോത്രപിതാക്കന്മാരോടുള്ള ശപഥത്തിലേക്കായതിനാൽ മൂലത്തിലെ പുരുഷലിംഗനിർദിഷ്ടത നിലനിർത്തുന്നു.
- issue: וְיָרַשְׁתָּ എന്ന ക്രിയയിലെ അവകാശം/കൈവശം എന്ന അർഥവ്യാപ്തി
  choice: കൈവശമാക്കും
  alternative: അവകാശമാക്കും
  rationale: ഇസ്രായേൽ ദേശത്തു കടന്നുചെന്ന് അതു സ്വന്തമാക്കുന്ന സജീവ സന്ദർഭം മുഖ്യപാഠത്തിൽ നൽകുന്നു; പാരമ്പര്യാവകാശത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഏകവചന അഭിസംബോധന ഉപയോഗിച്ചു. ദീർഘമായ എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; കല്പന, ഫലം, ദേശപ്രവേശനം എന്നീ ബന്ധങ്ങൾ നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘കൈവശമാക്കും’ എന്ന ക്രിയയ്ക്കു പിന്നാലെ ചേർത്തു.
