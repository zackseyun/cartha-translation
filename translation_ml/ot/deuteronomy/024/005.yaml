translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമഭാവത്തിനായി ‘പുറപ്പെടരുത്,’ ‘ചുമത്തരുത്,’ ‘ആയിരിക്കണം’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു. സ്രോതസ്സിലെ വിശാലതയും കാരണാർഥവും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
