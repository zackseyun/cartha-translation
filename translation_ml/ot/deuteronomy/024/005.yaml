  text: כִּֽי יִקַּ֥ח אִישׁ֙ אִשָּׁ֣ה חֲדָשָׁ֔ה לֹ֤א יֵצֵא֙ בַּ/צָּבָ֔א וְ/לֹא יַעֲבֹ֥ר עָלָ֖י/ו לְ/כָל דָּבָ֑ר נָקִ֞י יִהְיֶ֤ה לְ/בֵית/וֹ֙ שָׁנָ֣ה אֶחָ֔ת וְ/שִׂמַּ֖ח אֶת אִשְׁתּ֥/וֹ אֲשֶׁר לָקָֽח־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: ml
  text: ഒരുവൻ പുതുതായി വിവാഹം കഴിക്കുമ്പോൾ, അവൻ സൈന്യത്തോടൊപ്പം പുറപ്പെടരുത്[a]; യാതൊരു ചുമതലയും അവന്റെമേൽ ചുമത്തരുത്[b]. അവൻ ഒരു വർഷം തന്റെ വീട്ടുകാർക്കായി ബാധ്യതകളിൽനിന്ന് ഒഴിവുള്ളവനായിരിക്കണം[c]; താൻ വിവാഹം കഴിച്ച ഭാര്യയെ അവൻ സന്തോഷിപ്പിക്കണം[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യുദ്ധത്തിനു പുറപ്പെടരുത്.” എബ്രായപാഠം അക്ഷരാർഥത്തിൽ “സൈന്യത്തോടൊപ്പം പുറപ്പെടരുത്” എന്നാണ്; ഇത് നേരിട്ടുള്ള പോരാട്ടത്തെക്കാൾ വിശാലമായ സൈനികസേവനവും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “യാതൊരു ജോലിക്കും അവനെ നിയോഗിക്കരുത്.” എബ്രായപ്രയോഗം സൈനികചുമതലയിൽ മാത്രം ഒതുങ്ങാത്ത വിശാലമായ ബാധ്യതയെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: അല്ലെങ്കിൽ, “അവൻ ഒരു വർഷം വീട്ടിൽ ബാധ്യതകളിൽനിന്ന് ഒഴിവുള്ളവനായിരിക്കണം.” എബ്രായവാക്യം കുടുംബത്തിനുവേണ്ടിയുള്ള സ്വാതന്ത്ര്യത്തിനോ വീട്ടിൽ കഴിയുന്നതിനോ ഊന്നൽ നൽകാം.
    reason: lexical_alternative
  - marker: d
    text: അല്ലെങ്കിൽ, “താൻ വിവാഹം കഴിച്ച ഭാര്യയ്ക്ക് അവൻ സന്തോഷം നൽകണം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: വിവാഹം കഴിക്കുമ്പോൾ
  rationale: നിയമപരമായ ഒരു സാധാരണ സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ സോപാധികമായ ‘എങ്കിൽ’ എന്നതിനെക്കാൾ ‘...ക്കുമ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: ഒരുവൻ പുതുതായി വിവാഹം കഴിക്കുമ്പോൾ
  rationale: אִשָּׁה לָקַח എന്നത് വിവാഹം കഴിക്കുക എന്ന സ്ഥിരപ്രയോഗമാണ്. חֲדָשָׁה ഭാര്യയുടെ പുതുമയെക്കാൾ വിവാഹം അടുത്തിടെ നടന്നതാണെന്ന അർഥത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: അവൻ സൈന്യത്തോടൊപ്പം പുറപ്പെടരുത്
  rationale: ബെത് ഉപസർഗവും צָבָאയുടെ സൈന്യം/സൈനികസേവനം എന്ന അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; നേരിട്ടുള്ള യുദ്ധത്തിൽ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: യാതൊരു ചുമതലയും അവന്റെമേൽ ചുമത്തരുത്
  rationale: വാക്യപ്രയോഗത്തിന്റെ നിയമപരമായ ബലം സ്വാഭാവികമായി നൽകുകയും ചുമതല സൈനികകാര്യത്തിൽ മാത്രം ഒതുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: נָקִי יִהְיֶה
  choice: ബാധ്യതകളിൽനിന്ന് ഒഴിവുള്ളവനായിരിക്കണം
  rationale: നിർദോഷൻ എന്ന സാധാരണ അർഥമല്ല, ഇവിടെ ചുമതലകളിൽനിന്നുള്ള ഒഴിവാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: לְבֵיתוֹ
  choice: തന്റെ വീട്ടുകാർക്കായി
  rationale: בַּיִת ഭൗതികമായ വീടിനെ മാത്രമല്ല കുടുംബത്തെയും വീട്ടുകാരെയും സൂചിപ്പിക്കാം; לְ എന്നത് കുടുംബജീവിതത്തിലേക്കുള്ള അനുകൂല ദിശ പ്രകടമാക്കുന്നു.
- source_word: שָׁנָה אֶחָת
  choice: ഒരു വർഷം
  rationale: നിയമം നിശ്ചയിക്കുന്ന കാലപരിധി നേരിട്ട് നൽകുന്നു.
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ
  choice: ഭാര്യയെ അവൻ സന്തോഷിപ്പിക്കണം
  rationale: שׂמחയുടെ പീയേൽ രൂപത്തിലെ കാരണാർഥം—സന്തോഷിക്കാൻ ഇടയാക്കുക—വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לָקָח
  choice: താൻ വിവാഹം കഴിച്ച
  rationale: ലക്ഷ്യഭാഷയിൽ ‘എടുത്ത’ എന്നത് തെറ്റിദ്ധാരണയുണ്ടാക്കാവുന്നതിനാൽ വിവാഹത്തിന്റെ സ്ഥിരപ്രയോഗാർഥം നൽകി; ആദ്യവാക്യവുമായി ആശയബന്ധം നിലനിർത്തി.
