id: DEU.24.18
reference: Deuteronomy 24:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/שָּׁ֑ם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a servant in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: ml
  text: നീ ഈജിപ്തിൽ അടിമയായിരുന്നെന്നും നിന്റെ ദൈവമായ യഹ്‌വേ അവിടെനിന്ന് നിന്നെ വീണ്ടെടുത്തെന്നും ഓർക്കുക; അതുകൊണ്ട് ഇക്കാര്യം ചെയ്യാൻ ഞാൻ നിന്നോടു കൽപ്പിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: ഓർക്കുക
  rationale: സന്ദർഭത്തിൽ നിർദേശാത്മകമായി പ്രവർത്തിക്കുന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ആജ്ഞാരൂപത്തിൽ നൽകി; തുടക്കത്തിലെ וְ പ്രത്യേകം ‘എന്നും’ എന്നു ചേർക്കാതെ വാക്യബന്ധത്തിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: כִּי
  choice: എന്നും
  rationale: ഓർക്കേണ്ട ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി പരിഭാഷപ്പെടുത്തി; കാരണാർഥമായ ‘കാരണം’ എന്ന വായന അനാവശ്യമായി അടിച്ചേൽപ്പിച്ചില്ല.
- source_word: עֶבֶד
  choice: അടിമ
  rationale: ഈജിപ്തിലെ ബന്ധിതവും സ്വാതന്ത്ര്യമില്ലാത്തതുമായ അവസ്ഥയുടെ ശക്തി ‘ദാസൻ’ എന്നതിനെക്കാൾ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּמִצְרַיִם
  choice: ഈജിപ്തിൽ
  rationale: മൂലപാഠത്തിലെ ലളിതമായ സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיִּפְדְּךָ
  choice: നിന്നെ വീണ്ടെടുത്തു
  rationale: അടിമത്തത്തിൽനിന്നുള്ള മോചനവും פדה എന്ന പദത്തിന്റെ വീണ്ടെടുപ്പുസംബന്ധമായ ധ്വനിയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: മുൻപു പറഞ്ഞ ഈജിപ്തിലേക്കുള്ള ലളിതമായ തിരിച്ചുസൂചന നിലനിർത്തുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻപറഞ്ഞ വീണ്ടെടുപ്പിൽനിന്ന് കല്പനയിലേക്കുള്ള കാരണപരമായ നിഗമനം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: ഞാൻ നിന്നോടു കല്പിക്കുന്നത്
  rationale: വ്യക്തമായ ഒന്നാംപുരുഷ സർവനാമത്തിന്റെയും വർത്തമാന കൃദന്തരൂപത്തിന്റെയും ഊന്നൽ ‘അതുകൊണ്ടാണ് ... കല്പിക്കുന്നത്’ എന്ന ഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: לַעֲשׂוֹת אֶת־הַדָּבָר הַזֶּה
  choice: ഇക്കാര്യം ചെയ്യാൻ
  rationale: ‘ഈ കാര്യം ചെയ്യുക’ എന്ന മൂലഘടനയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം സ്വീകരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ഒരു ബിരുദമായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: ഈജിപ്തിലെ ഇസ്രായേലിന്റെ നിലയെ സൂചിപ്പിക്കുന്ന עֶבֶד
  choice: അടിമ
  alternative: ദാസൻ
  rationale: വാക്യത്തിന്റെ നൈതിക പ്രേരണയ്ക്ക് നിർണായകമായ ബന്ധിതാവസ്ഥയും സ്വാതന്ത്ര്യനഷ്ടവും ‘അടിമ’ കൂടുതൽ വ്യക്തമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ/നിന്നെ’ മൂലപാഠത്തിന് അനുസൃതമായി നിലനിർത്തി. അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
