  text: And if he is a poor man[a], you shall not sleep with his pledge.
translation:
  language: ml
  text: അവൻ ദരിദ്രനാണെങ്കിൽ, അവന്റെ പണയവസ്തുവുമായി നിങ്ങൾ കിടക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ പണയവസ്തുവിനോടുകൂടെ നിങ്ങൾ കിടക്കരുത്”; അതായത്, വായ്പയ്ക്ക് ഉറപ്പായി അവൻ നൽകിയ വസ്തു രാത്രി മുഴുവൻ കൈവശം സൂക്ഷിക്കരുത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ നിയമത്തിന്റെ സോപാധികമായ തുടർച്ച സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പ്രത്യേകമായ ‘എന്നാൽ’ ചേർത്ത് വിരോധഭാവം അതിരുകടന്ന് സൂചിപ്പിക്കുന്നില്ല.
- source_word: אִישׁ עָנִי הוּא
  choice: അവൻ ദരിദ്രനാണെങ്കിൽ
  rationale: സാമ്പത്തികമായി ദരിദ്രനും ദുർബലനുമായ പുരുഷ കടക്കാരനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ആവർത്തനഭാരം ഒഴിവാക്കി എബ്രായത്തിലെ പുരുഷ ഏകവചനവും നിബന്ധനയും നിലനിർത്തുന്നു.
- source_word: לֹא תִשְׁכַּב
  choice: നിങ്ങൾ ഉറങ്ങരുത്
  rationale: ശബ്‌ദാർത്ഥമായ ‘കിടക്കുക/ഉറങ്ങുക’ എന്ന ആശയം നിലനിർത്തുന്നു; ഇവിടെ രാത്രി മുഴുവൻ പണയം കൈവശം സൂക്ഷിക്കുന്നതാണെന്ന സന്ദർഭാർഥം തുടർന്നുള്ള പ്രയോഗവും അടിക്കുറിപ്പും വ്യക്തമാക്കുന്നു.
- source_word: בַּעֲבֹטוֹ
  choice: അവന്റെ പണയവസ്തു കൈവശംവെച്ചുകൊണ്ട്
  rationale: വായ്പയ്ക്ക് ഉറപ്പായി നൽകിയ വസ്തുവിനെയാണ് עֲבוֹט സൂചിപ്പിക്കുന്നത്. ב എന്ന മുൻപ്രത്യയത്തിന്റെ സന്ദർഭാർഥം ‘അതോടൊപ്പം’ എന്ന അസ്പഷ്ടത ഒഴിവാക്കി, രാത്രി അത് കൈവശം സൂക്ഷിക്കൽ എന്ന നിലയിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി. ഏകവചന പുരുഷസൂചനയായ ‘അവൻ/അവന്റെ’ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാക്യത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
