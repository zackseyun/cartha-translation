source:
  edition: WLC
  text: בַּ/ח֖וּץ תַּעֲמֹ֑ד וְ/הָ/אִ֗ישׁ אֲשֶׁ֤ר אַתָּה֙ נֹשֶׁ֣ה ב֔/וֹ יוֹצִ֥יא אֵלֶ֛י/ךָ אֶֽת הַ/עֲב֖וֹט הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/011.yaml
  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: ml
  text: നീ പുറത്തു നിൽക്കണം; നീ വായ്പ കൊടുക്കുന്ന മനുഷ്യൻ[a] പണയവസ്തു പുറത്തേക്കു നിന്റെ അടുക്കലേക്കു കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്നോടു കടപ്പെട്ടിരിക്കുന്ന മനുഷ്യൻ പണയവസ്തു പുറത്തേക്കു നിന്റെ അടുക്കലേക്കു കൊണ്ടുവരണം.” എബ്രായ പ്രയോഗം കടം കൊടുക്കുന്നവന്റെ പ്രവൃത്തിയെയോ കടം വാങ്ങിയവന്റെ കടബാധ്യതയെയോ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: പുറത്തു
  rationale: വീടിനുള്ളിൽ പ്രവേശിക്കാതെ അതിനു പുറത്തു നിൽക്കണമെന്ന നിയമസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲמֹד
  choice: നിൽക്കണം
  rationale: עמד എന്ന ക്രിയയുടെ പ്രാഥമികമായ ശാരീരിക അർഥമായ ‘നിൽക്കുക’ നിലനിർത്തുന്നു; ഇവിടെ പുറത്തു കാത്തുനിൽക്കുക എന്ന ആശയവും സന്ദർഭത്തിൽ ഉൾപ്പെടുന്നു.
- source_word: וְהָאִישׁ
  choice: മനുഷ്യൻ
  rationale: איש ഇവിടെ കടക്കാരനായ പുരുഷനെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പദമാണ് ‘മനുഷ്യൻ’.
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: നീ വായ്പ കൊടുക്കുന്ന
  rationale: נשה എന്ന പ്രയോഗം ഒരാൾക്കു കടം കൊടുക്കുന്നതിലേക്കോ അയാൾ കടപ്പെട്ടിരിക്കുന്ന അവസ്ഥയിലേക്കോ ശ്രദ്ധ തിരിക്കാം. മുഖ്യവാചകം കടം കൊടുക്കുന്നവന്റെ പ്രവൃത്തി മുൻനിർത്തുന്നു; മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: יוֹצִיא
  choice: കൊണ്ടുവരണം
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘പുറത്തേക്കു വരുത്തുക/കൊണ്ടുവരുക’ എന്നാണ്; തുടർന്നുള്ള ദിശാസൂചക പദത്തോടൊപ്പം ‘പുറത്തേക്കു കൊണ്ടുവരണം’ സ്വാഭാവികമാണ്.
- source_word: אֵלֶיךָ
  choice: നിന്റെ അടുക്കൽ
  rationale: പണയവസ്തു കടം കൊടുക്കുന്നവന്റെ അടുത്തേക്കു കൊണ്ടുവരുന്ന ദിശ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָעֲבוֹט
  choice: പണയവസ്തു
  rationale: വായ്പയ്ക്കുള്ള ഉറപ്പായി നൽകുന്ന വസ്തുവാണ് ഉദ്ദേശിക്കുന്നത്. ‘പണയവസ്തു’ നിയമപരമായ ആശയം സാധാരണ വായനക്കാർക്കു വ്യക്തമായി നൽകുന്നു.
- source_word: הַחוּצָה
  choice: പുറത്തേക്കു
  rationale: ദിശാസൂചകമായ എബ്രായ രൂപം വീടിന്റെ അകത്തുനിന്ന് പുറത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം ഉപയോഗിച്ചു. നിയമനിർദേശത്തിന്റെ നേരിട്ടുള്ള സ്വരം നിലനിർത്താൻ ‘നിൽക്കണം’, ‘കൊണ്ടുവരണം’ എന്നീ രൂപങ്ങൾ സ്വീകരിച്ചു; മൂലത്തിലെ യഥാർഥമായ നിഘണ്ടുവ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
