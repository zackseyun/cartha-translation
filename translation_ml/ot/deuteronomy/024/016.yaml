id: DEU.24.16
reference: Deuteronomy 24:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא יוּמְת֤וּ אָבוֹת֙ עַל בָּנִ֔ים וּ/בָנִ֖ים לֹא יוּמְת֣וּ עַל אָב֑וֹת אִ֥יש בְּ/חֶטְא֖/וֹ יוּמָֽתוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: ml
  text: പുത്രന്മാർ നിമിത്തം പിതാക്കന്മാരെ മരണശിക്ഷയ്ക്ക് വിധിക്കരുത്; പിതാക്കന്മാർ നിമിത്തം പുത്രന്മാരെയും മരണശിക്ഷയ്ക്ക് വിധിക്കരുത്. ഓരോരുത്തനും അവനവന്റെ പാപം നിമിത്തം മാത്രമേ മരണശിക്ഷയ്ക്ക് വിധിക്കപ്പെടാവൂ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: മരണശിക്ഷയ്ക്ക് വിധിക്കുക
  rationale: מות എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപം വെറും മരണം സംഭവിക്കുന്നതല്ല, ഒരാളെ കൊല്ലുന്നതിന് വിധേയനാക്കുന്നതാണ് സൂചിപ്പിക്കുന്നത്. നിയമസന്ദർഭത്തിൽ ‘മരണശിക്ഷയ്ക്ക് വിധിക്കുക’ എന്നത് ന്യായവിധിയിലൂടെയുള്ള വധത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָבוֹת
  choice: പിതാക്കന്മാർ
  rationale: എബ്രായപദം പൊതുവായ ‘മാതാപിതാക്കൾ’ എന്നതിലുപരി വ്യക്തമായി ‘പിതാക്കന്മാർ’ എന്നാണ്; പുത്രന്മാരുമായുള്ള സമാന്തരഘടനയും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: בָּנִים
  choice: പുത്രന്മാർ
  rationale: നിയമതത്ത്വം വിശാലമായി മക്കൾക്ക് ബാധകമാകാമെങ്കിലും മൂലപദം അക്ഷരാർഥത്തിൽ ‘പുത്രന്മാർ’ എന്നാണ്; ഉറവിടത്തിലെ ലിംഗനിർദ്ദിഷ്ട കുടുംബപദം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: עַל
  choice: നിമിത്തം
  rationale: ഈ നിയമസന്ദർഭത്തിൽ മറ്റൊരാളുടെ കാരണത്താൽ അഥവാ അയാളുടെ കുറ്റത്തിന്റെ പേരിൽ ശിക്ഷിക്കപ്പെടുന്നതാണ് עַל സൂചിപ്പിക്കുന്നത്; ‘നിമിത്തം’ അതു ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തൻ
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ഓരോ വ്യക്തിയുടെയും ഉത്തരവാദിത്വം വ്യക്തമാക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘ഓരോരുത്തൻ’ ഈ ഏകവചന വിതരണബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּחֶטְאוֹ
  choice: അവനവന്റെ പാപം നിമിത്തം
  rationale: പ്രത്യയത്തിലുള്ള ഉടമസ്ഥതയും ആദ്യ രണ്ടു ഖണ്ഡങ്ങളിലെ പകരക്കാരനായുള്ള ശിക്ഷയ്ക്കെതിരായ വൈരുധ്യവും ‘അവനവന്റെ’ വ്യക്തമാക്കുന്നു; בְ നിയമപരമായ ശിക്ഷയുടെ കാരണം സൂചിപ്പിക്കുന്നതിനാൽ ‘നിമിത്തം’ യോജിക്കുന്നു.
theological_decisions:
- issue: മരണശിക്ഷയിലെ വ്യക്തിഗത ഉത്തരവാദിത്വം
  choice: പിതാവിന്റെയോ പുത്രന്റെയോ കുറ്റം മറ്റൊരാളിൽ ചുമത്തി മരണശിക്ഷ നൽകാൻ പാടില്ല; ഓരോരുത്തനും സ്വന്തം പാപത്തിന്റെ പേരിൽ മാത്രമേ മരണശിക്ഷയ്ക്ക് വിധേയനാകാവൂ.
  alternative: തലമുറകളിലുടനീളമുള്ള പാപത്തിന്റെ എല്ലാ പരിണതഫലങ്ങളെയും സംബന്ധിച്ച വിശാല പ്രസ്താവന
  rationale: מות എന്നതിന്റെ ആവർത്തിച്ച ഹോഫാൽ രൂപങ്ങൾ ന്യായവിധിയിലൂടെ കൊല്ലപ്പെടുന്നതിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു. അതിനാൽ വ്യക്തിഗത ഉത്തരവാദിത്വത്തിന്റെ തത്ത്വം പ്രകടമാണെങ്കിലും വിവർത്തനം അതിനെ എല്ലാ തലമുറപരമായ പരിണതഫലങ്ങളിലേക്കും വിപുലീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി. ‘കൊല്ലരുത്’ എന്നതിനേക്കാൾ മൂലത്തിലെ ന്യായവിധിസന്ദർഭം വ്യക്തമാക്കാൻ ‘മരണശിക്ഷയ്ക്ക് വിധിക്കരുത്/വിധിക്കാവൂ’ ഉപയോഗിച്ചു. അവസാന ഖണ്ഡത്തിലെ ‘മാത്രമേ’ മൂലവാക്യത്തിലെ വ്യക്തിഗത ഉത്തരവാദിത്വത്തിന്റെ വൈരുധ്യബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
