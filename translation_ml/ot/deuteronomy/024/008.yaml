base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: ml
  text: ചർമ്മരോഗബാധയുടെ[a] കാര്യത്തിൽ ജാഗ്രത പാലിക്കുക; ലേവ്യരായ പുരോഹിതന്മാർ നിങ്ങളോടു നിർദേശിക്കുന്നതെല്ലാം അതീവ ശ്രദ്ധയോടെ പാലിച്ചു പ്രവർത്തിക്കണം. ഞാൻ അവരോടു കല്പിച്ചതുപോലെതന്നെ നിങ്ങൾ ശ്രദ്ധയോടെ പാലിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘കുഷ്ഠരോഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ആധുനിക ഹാൻസൺസ് രോഗത്തെ മാത്രം സൂചിപ്പിക്കാതെ, തോറായിൽ പറയുന്ന പലതരം ചർമ്മാവസ്ഥകളെയും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: അതീവ ജാഗ്രത പാലിക്കുക
  rationale: നിഫാൽ ആജ്ഞാരൂപത്തിന്റെ മുന്നറിയിപ്പും ശക്തമായ പ്രബോധനസ്വരവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: ചർമരോഗബാധയുടെ കാര്യത്തിൽ
  rationale: נֶגַע എന്നത് ബാധയെയോ രോഗലക്ഷണത്തെയോ സൂചിപ്പിക്കുന്നു; צָרַעַת ആധുനിക ഹാൻസൺസ് രോഗത്തിൽ ഒതുങ്ങാത്ത വിശാലമായ ത്വക്‌സ്ഥിതികളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ചർമരോഗബാധ’ തിരഞ്ഞെടുത്തു.
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: സൂക്ഷ്മമായി അനുസരിച്ചു പ്രവർത്തിക്കുക
  rationale: מְאֹד നൽകുന്ന ഊന്നലും ശ്രദ്ധാപൂർവം പാലിച്ച് പ്രവൃത്തിയിലാക്കുക എന്ന ഇരട്ട ആശയവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: നിങ്ങളോടു നിർദേശിക്കുന്നതെല്ലാം
  rationale: ירה എന്ന ഹിഫീൽ രൂപത്തിന്റെ നിയമപരമായ പഠിപ്പിക്കൽ, നിർദേശം, മാർഗനിർദേശം എന്നീ അർഥവ്യാപ്തിക്ക് ‘നിർദേശിക്കുക’ യോജിക്കുന്നു.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: ലേവ്യപുരോഹിതന്മാർ
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഈ സ്ഥിരപ്രയോഗം ലേവി ഗോത്രത്തിൽപ്പെട്ട പുരോഹിതന്മാരെ സൂചിപ്പിക്കുന്നതായി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר צִוִּיתִם
  choice: ഞാൻ അവരോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: ഒന്നാംപുരുഷ കർത്താവിനെയും മൂന്നാംപുരുഷ ബഹുവചന കർമപ്രത്യയത്തെയും വ്യക്തമായി നിലനിർത്തുന്നു; כַּאֲשֶׁר എന്ന താരതമ്യബന്ധത്തിന് ‘പോലെതന്നെ’ യോജിക്കുന്നു.
- source_word: תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: നിങ്ങൾ പ്രവർത്തിക്കാൻ ശ്രദ്ധിക്കണം
  rationale: ശ്രദ്ധാപൂർവം ചെയ്യണമെന്ന ആവർത്തിച്ച പ്രബോധനവും ബാധ്യതാസ്വരവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: צָרַעַת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ചർമരോഗം
  alternative: കുഷ്ഠരോഗം
  rationale: തോറായിലെ പദം ആധുനിക ഹാൻസൺസ് രോഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; അതിനാൽ അനാവശ്യമായ വൈദ്യശാസ്ത്രപരമായ ചുരുക്കം ഒഴിവാക്കി വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- issue: הַכֹּהֲנִים הַלְוִיִּם എന്ന പ്രയോഗത്തിന്റെ തിരിച്ചറിവ്
  choice: ലേവ്യപുരോഹിതന്മാർ
  alternative: പുരോഹിതന്മാരായ ലേവ്യർ / പുരോഹിതന്മാരും ലേവ്യരും
  rationale: ഇത് രണ്ടു വ്യത്യസ്ത സംഘങ്ങളെക്കാൾ ലേവിയിൽപ്പെട്ട പുരോഹിതന്മാരെ സൂചിപ്പിക്കുന്ന ആവർത്തനപുസ്തകത്തിലെ സവിശേഷ വിശേഷണപ്രയോഗമായി വായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമപ്രബോധന ശൈലി. എബ്രായത്തിലെ ആവർത്തനം പദാനുപദമായി കടുപ്പിക്കാതെ, ആദ്യ മുന്നറിയിപ്പിലും അവസാന നിർദേശത്തിലും ശ്രദ്ധയും പ്രവൃത്തിയും നിലനിർത്തി.
