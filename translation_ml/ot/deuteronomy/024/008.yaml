  rationale: The revision keeps the original warning and its dependent purpose/result sequence together, represents the emphatic careful observance and action, and restores the closing repetition of careful compliance. It also uses clearer modern Malayalam for the Deuteronomic expression ‘the Levitical priests’ and standardizes ‘ചർമ്മ’.
