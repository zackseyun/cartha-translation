id: DEU.24.6
reference: Deuteronomy 24:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא יַחֲבֹ֥ל רֵחַ֖יִם וָ/רָ֑כֶב כִּי נֶ֖פֶשׁ ה֥וּא חֹבֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: ml
  text: തിരികല്ലുകളുടെ ജോടിയോ മേൽക്കല്ലുപോലുമോ ആരും പണയമായി എടുക്കരുത്; കാരണം, അങ്ങനെ ചെയ്യുന്നവൻ ഒരു ജീവനെ പണയമായി എടുക്കുന്നതാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു വ്യക്തിയുടെ ഉപജീവനമാണ് പണയമായി എടുക്കുന്നത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: പണയമായി എടുക്കുക
  rationale: കടത്തിന് ഈടായി ഒരു വസ്തു കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന നിയമസന്ദർഭത്തിലെ അർഥം വ്യക്തമായി നൽകുകയും മൂലത്തിലെ ക്രിയയുടെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: רֵחַיִם
  choice: തിരികല്ലുകളുടെ ജോടി
  rationale: ദ്വിവചനരൂപം രണ്ട് തിരികല്ലുകളും ചേർന്ന ജോടിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וָרָכֶב
  choice: മേൽക്കല്ലുപോലും
  rationale: רָכֶב ഇവിടെ തിരികല്ലിന്റെ മുകളിലെ കല്ലാണ്. മുഴുവൻ ജോടി മാത്രമല്ല, അതിലെ അനിവാര്യമായ ഒരു കല്ലുപോലും പണയമാക്കരുതെന്ന നിയമത്തിന്റെ ഊന്നൽ ‘പോലും’ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: അങ്ങനെ ചെയ്താൽ
  rationale: നിരോധനത്തിന്റെ കാരണം ഫലസൂചനയോടെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: נֶפֶשׁ
  choice: ഒരു ജീവൻ
  rationale: അമൂർത്തമായ ‘ആത്മാവ്’ എന്നതിലുപരി, അന്നം ഒരുക്കാനുള്ള ഉപാധി നഷ്ടപ്പെടുമ്പോൾ അപകടത്തിലാകുന്ന വ്യക്തിയുടെ സജീവമായ ജീവനെ ഇവിടെ സൂചിപ്പിക്കുന്നു; അതോടൊപ്പം ‘ഉപജീവനം’ എന്ന സന്ദർഭാർഥത്തിനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הוּא
  choice: അയാൾ ... എടുക്കുന്നു
  rationale: പണയം എടുക്കുന്ന വ്യക്തിയെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: നിയമ-സാമൂഹിക സന്ദർഭത്തിൽ נֶפֶשׁ എന്നതിന്റെ അർഥം
  choice: വ്യക്തിയുടെ ജീവൻ
  alternative: വ്യക്തിയുടെ ഉപജീവനം; ആത്മാവ്; വ്യക്തി
  rationale: ദൈനംദിന ഭക്ഷണം തയ്യാറാക്കാൻ അനിവാര്യമായ ഉപകരണം പണയമാക്കുന്നത് കടക്കാരന്റെ ജീവനാധാരത്തെ അപകടത്തിലാക്കുന്നു. ‘ജീവൻ’ മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘ഉപജീവനം’ എന്ന പ്രായോഗിക സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു. ഇത് മനുഷ്യസ്വഭാവത്തെക്കുറിച്ചുള്ള സിദ്ധാന്തപരമായ വിധിയല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നിയമവാക്യത്തിന്റെ കർശനതയും മൂലത്തിലെ ‘പണയമായി എടുക്കുക’ എന്ന ആവർത്തനവും നിലനിർത്തി. ‘തിരികല്ല്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പരമ്പരാഗത ധാന്യം അരയ്ക്കുന്ന കല്ലിനെ സൂചിപ്പിക്കുന്നു.
