revisions:
- from: തിരികല്ലുകളുടെ ജോടിയോ മേൽക്കല്ലുപോലുമോ ആരും പണയമായി എടുക്കരുത്; അങ്ങനെ ചെയ്താൽ അയാൾ ഒരു ജീവനെത്തന്നെയാണ് പണയമായി എടുക്കുന്നത്.[a]
  to: തിരികല്ലുകളുടെ ജോടിയോ മേൽക്കല്ലുപോലുമോ ആരും പണയമായി എടുക്കരുത്; കാരണം, അങ്ങനെ ചെയ്യുന്നവൻ ഒരു ജീവനെ പണയമായി എടുക്കുന്നതാണ്.[a]
