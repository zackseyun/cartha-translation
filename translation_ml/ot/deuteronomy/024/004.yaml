revisions:
- from: അവളെ പറഞ്ഞയച്ച അവളുടെ ആദ്യഭർത്താവിന്, അവൾ അശുദ്ധയാക്കപ്പെട്ടശേഷം[a] അവളെ വീണ്ടും തന്റെ ഭാര്യയായി സ്വീകരിക്കാൻ പാടില്ല. കാരണം, അത് യഹോവയുടെ മുമ്പാകെ അറപ്പാകുന്നു. നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങൾക്ക് അവകാശമായി നൽകുന്ന ദേശത്തിന്മേൽ നിങ്ങൾ പാപം വരുത്തരുത്.
  to: അവളെ പറഞ്ഞയച്ച അവളുടെ ആദ്യഭർത്താവിന്, അവൾ അശുദ്ധയായിത്തീർന്നശേഷം[a] അവളെ വീണ്ടും ഭാര്യയാക്കിക്കൊള്ളാൻ പാടില്ല. കാരണം, അത് യഹോവയുടെ മുമ്പാകെ വെറുപ്പുളവാക്കുന്ന കാര്യമാണ്. നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങൾക്ക് അവകാശമായി നൽകുന്ന ദേശത്തിന്മേൽ നിങ്ങൾ പാപം വരുത്തരുത്.
  rationale: The revision improves modern Malayalam idiom and more directly represents the marital legal expression, while preserving the source text’s unresolved ambiguity regarding the nature of the woman’s defilement. It retains the source-oriented rendering യഹോവ and the land-guilt formulation.
