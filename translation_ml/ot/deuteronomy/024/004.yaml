  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: ml
  text: അവളെ പറഞ്ഞയച്ച അവളുടെ ആദ്യഭർത്താവിന്, അവൾ അശുദ്ധയായിത്തീർന്നശേഷം[a] അവളെ വീണ്ടും ഭാര്യയാക്കിക്കൊള്ളാൻ പാടില്ല. കാരണം, അത് യഹോവയുടെ മുമ്പാകെ വെറുപ്പുളവാക്കുന്ന കാര്യമാണ്. നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങൾക്ക് അവകാശമായി നൽകുന്ന ദേശത്തിന്മേൽ നിങ്ങൾ പാപം വരുത്തരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൾ അശുദ്ധയാക്കപ്പെട്ടശേഷം’ അല്ലെങ്കിൽ ‘അവൾ മലിനയാക്കപ്പെട്ടശേഷം.’ എബ്രായപാഠം അവൾ ‘അശുദ്ധയായിത്തീർന്നശേഷം’ എന്നു പറയുന്നു; ഈ അശുദ്ധിയുടെ കൃത്യസ്വഭാവം അതിൽ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: അവളുടെ ആദ്യഭർത്താവ്
  rationale: വിവാഹസന്ദർഭത്തിൽ בַּעַל എന്നത് ‘ഭർത്താവ്’ എന്നും הָרִאשׁוֹן എന്നത് ‘ആദ്യത്തെ’ എന്നും അർഥമാക്കുന്നു; പിന്നീട് ഉണ്ടായ ഭർത്താവുമായുള്ള നിയമപരമായ വ്യത്യാസം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: שִׁלְּחָהּ
  choice: അവളെ പറഞ്ഞയച്ച
  rationale: ശബ്ദാർഥമായ ‘അയച്ചുകളയുക/പറഞ്ഞയക്കുക’ എന്ന ആശയം നിലനിർത്തുന്നു; വിവാഹമോചനസന്ദർഭം ചുറ്റുമുള്ള നിയമത്തിൽനിന്ന് വ്യക്തമാണ്.
- source_word: לָשׁוּב לְקַחְתָּהּ לִהְיוֹת לוֹ לְאִשָּׁה
  choice: അവളെ വീണ്ടും തന്റെ ഭാര്യയായി സ്വീകരിക്കാൻ
  rationale: വീണ്ടും കൈക്കൊണ്ട് ഭാര്യയാക്കുക എന്ന എബ്രായ വിവാഹപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: അവൾ അശുദ്ധയാക്കപ്പെട്ടശേഷം
  rationale: ടמא എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപവും അശുദ്ധി/മലിനത എന്ന വിശാല അർഥവും നിലനിർത്തുന്നു; അശുദ്ധിയുടെ കൃത്യസ്വഭാവം പരിഭാഷയിൽ തീരുമാനിക്കുന്നില്ല.
- source_word: תוֹעֵבָה
  choice: അറപ്പ്
  rationale: ഉടമ്പടി-ധാർമിക പശ്ചാത്തലത്തിലുള്ള പദത്തിന്റെ ശക്തമായ വെറുപ്പും നിരോധിതസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ മുമ്പാകെ
  rationale: ‘യഹോവയുടെ സന്നിധിയിൽ/ദൃഷ്ടിയിൽ’ എന്ന മൂലപ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ദൈവനാമം ‘യഹോവ’യായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְלֹא תַחֲטִיא אֶת־הָאָרֶץ
  choice: ദേശത്തിന്മേൽ നിങ്ങൾ പാപം വരുത്തരുത്
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘പാപം/കുറ്റം വരുത്തുക’ എന്ന കാരകഭാവം നിലനിർത്തുകയും ദേശത്തെ അനാവശ്യമായി വ്യക്തിവൽക്കരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: നിങ്ങൾക്ക് അവകാശമായി നൽകുന്ന
  rationale: נַחֲלָהയിലെ ഉടമ്പടി-ദേശ ആശയമായ പാരമ്പര്യാവകാശം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘അവൾ അശുദ്ധയാക്കപ്പെട്ടശേഷം’ എന്നതിലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: അശുദ്ധിയുടെ കൃത്യസ്വഭാവം വ്യക്തമാക്കാതെ വിശാലമായ നിഷ്ക്രിയപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ആചാരപരമായി അശുദ്ധയായശേഷം,’ ‘ലൈംഗികമായി മലിനയായശേഷം,’ അല്ലെങ്കിൽ ‘രണ്ടാം വിവാഹംമൂലം വീണ്ടും വിവാഹത്തിന് അയോഗ്യയായശേഷം.’
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠം טמאയുടെ നിഷ്ക്രിയരൂപം ഉപയോഗിക്കുന്നുവെങ്കിലും അശുദ്ധി ആചാരപരമോ ലൈംഗികമോ നിയമപരമോ ബന്ധപരമോ എന്ന് പ്രത്യേകം നിർവചിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനവിവാദം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യങ്ങളിൽ ആരംഭിച്ച നിയമവ്യവസ്ഥയുടെ തുടർച്ചയായതിനാൽ ‘അവളുടെ ആദ്യഭർത്താവിന്’ എന്ന ആശ്രിതതുടക്കം നിലനിർത്തി; വായനാസൗകര്യത്തിനായി ദീർഘമായ എബ്രായവാക്യം മൂന്ന് മലയാളവാക്യങ്ങളാക്കി.
