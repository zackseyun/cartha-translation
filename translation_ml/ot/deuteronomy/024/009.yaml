  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: ml
  text: നിങ്ങൾ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ വഴിയിൽവെച്ച് നിന്റെ ദൈവമായ യഹ്‌വെ മിര്യാമിനോടു ചെയ്തത് ഓർക്കുക.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ദൈവമായ യഹ്‌വെ മിര്യാമിനോടു ചെയ്തതിനെ ഓർക്കുക.”
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ഈജിപ്തിൽനിന്നുള്ള പുറപ്പാടിനുശേഷം ഇസ്രായേൽ നടത്തിയ യാത്രയിൽ; സംഖ്യ 12:1–15 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: זָכוֹר
  choice: ഓർക്കുക
  rationale: זכר എന്ന ധാതുവിന്റെ ഏകവചന ആജ്ഞാരൂപം; നേരിട്ടുള്ള കല്പനയും ഉടമ്പടിസംബന്ധമായ ഓർമയുടെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: ചെയ്തത്
  rationale: ഓർക്കേണ്ട കാര്യത്തെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; עשה എന്ന സാധാരണ ക്രിയയെ അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവിക നാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയത്തെ നിലനിർത്തുന്നു. പിന്നാലെയുള്ള ബഹുവചനമായ בְּצֵאתְכֶם-നോടുള്ള വചനമാറ്റവും ഇതിലൂടെ മറച്ചുവയ്ക്കുന്നില്ല.
- source_word: לְמִרְיָם
  choice: മിര്യാമിനോടു
  rationale: לְ ഇവിടെ യഹ്‌വെയുടെ പ്രവൃത്തിയാൽ ബാധിക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ശിക്ഷയെ പാഠത്തിൽ നേരിട്ട് ചേർക്കാതെ ബന്ധം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
- source_word: בַּדֶּרֶךְ
  choice: വഴിയിൽവെച്ച്
  rationale: ‘വഴിയിൽ/യാത്രാമധ്യേ’ എന്ന മൂലാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּצֵאתְכֶם מִמִּצְרַיִם
  choice: നിങ്ങൾ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ
  rationale: കാലസൂചകമായ infinitive construct-ഉം രണ്ടാംപുരുഷ ബഹുവചന പ്രത്യയവും സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: മിര്യാമിനോടു യഹ്‌വെ ‘ചെയ്തത്’ എന്തെന്ന് വ്യക്തമാക്കൽ
  choice: ചെയ്തത്
  alternative: ശിക്ഷിച്ചത് / ബാധിച്ചത്
  rationale: സംഖ്യ 12-ലെ സംഭവം പശ്ചാത്തലത്തിലുണ്ടെങ്കിലും ഈ വാക്യം עשה എന്ന പൊതുവായ ക്രിയ മാത്രമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ശിക്ഷയുടെ സ്വഭാവം മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് ചേർത്തിട്ടില്ല.
- issue: ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള അഭിസംബോധനമാറ്റം
  choice: ‘നിന്റെ ദൈവമായ’ ... ‘നിങ്ങൾ ... പുറപ്പെട്ടപ്പോൾ’
  alternative: ‘നിങ്ങളുടെ ദൈവമായ’ ... ‘നിങ്ങൾ ... പുറപ്പെട്ടപ്പോൾ’
  rationale: എബ്രായത്തിലെ אֱלֹהֶיךָ എന്ന ഏകവചനവും בְּצֵאתְכֶם എന്ന ബഹുവചനവും തമ്മിലുള്ള യഥാർഥ വചനമാറ്റം മിനുക്കി നീക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ ഏകവചന–ബഹുവചന അഭിസംബോധനമാറ്റം ഉദ്ദേശപൂർവം നിലനിർത്തിയതിനാൽ ‘നിന്റെ’ എന്നതും ‘നിങ്ങൾ’ എന്നതും ഒരേ വാക്യത്തിൽ വരുന്നു. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; മിര്യാമിന്റെ അനുഭവത്തിന്റെ സ്വഭാവം മുഖ്യപാഠത്തിൽ വിശദീകരിക്കാതെ അനുബന്ധവാക്യത്തിലേക്ക് സൂചന നൽകി.
