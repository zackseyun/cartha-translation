source:
  edition: WLC
  text: כִּ֤י תִבְצֹר֙ כַּרְמְ/ךָ֔ לֹ֥א תְעוֹלֵ֖ל אַחֲרֶ֑י/ךָ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: ml
  text: നിന്റെ മുന്തിരിത്തോട്ടത്തിലെ മുന്തിരിപ്പഴം പറിച്ചെടുക്കുമ്പോൾ, നീ കടന്നുപോയശേഷം ശേഷിക്കുന്നവ വീണ്ടും പറിച്ചെടുക്കരുത്[a]. അവ പരദേശിക്കും[b] അനാഥനും[c] വിധവയ്ക്കും ഉള്ളതായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പിന്നീട് ശേഷിച്ച മുന്തിരി പെറുക്കരുത്” അല്ലെങ്കിൽ “അതിലൂടെ വീണ്ടും കടന്നുപോകരുത്.” ആദ്യ വിളവെടുപ്പിനുശേഷം ശേഷിക്കുന്നവ ശേഖരിക്കാൻ രണ്ടാമതും കടന്നുപോകുന്നതിനെയാണ് എബ്രായ ക്രിയ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “പരദേശി” എന്നത് ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത നിവാസിയെ സൂചിപ്പിക്കുന്നു; “കുടിയേറ്റക്കാരനായ വിദേശി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “പിതാവില്ലാത്തവൻ.” എബ്രായപദം പല സന്ദർഭങ്ങളിലും അക്ഷരാർഥത്തിൽ പിതാവില്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִבְצֹר
  choice: പറിച്ചെടുക്കുമ്പോൾ
  rationale: כִּי ഇവിടെ നിയമത്തിലെ പ്രതീക്ഷിക്കപ്പെടുന്ന സാഹചര്യം അവതരിപ്പിക്കുന്നു; תִבְצֹר മുന്തിരിവിളവെടുപ്പിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ മുന്തിരിപ്പഴം വ്യക്തമാക്കിയതിനാൽ ഈ പ്രയോഗം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כַּרְמְךָ
  choice: നിന്റെ മുന്തിരിത്തോട്ടത്തിലെ
  rationale: כֶּרֶם എന്നതിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാള തത്തുല്യം.
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: നീ കടന്നുപോയശേഷം ശേഷിക്കുന്നവ വീണ്ടും പറിച്ചെടുക്കരുത്
  rationale: ആദ്യ വിളവെടുപ്പിനു പിന്നാലെ ശേഷിച്ച മുന്തിരി ശേഖരിക്കാൻ രണ്ടാമതും കടന്നുപോകുന്നതാണ് നിരോധിക്കുന്നത്. ഉടമ തന്നെയാണ് ‘കാലാ പെറുക്കുന്നത്’ എന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കി, אַחֲרֶיךָയിലെ പിന്നാലെ/ശേഷം എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: לַגֵּר
  choice: പരദേശിക്ക്
  rationale: ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത നിവാസിയെയാണ് גֵּר സൂചിപ്പിക്കുന്നത്. ചുരുക്കവും മാന്യവുമായ മുഖ്യപദമായി ‘പരദേശി’ ഉപയോഗിച്ച് സാമൂഹിക-നിയമപരമായ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: לַיָּתוֹם
  choice: അനാഥന്
  rationale: יָתוֹם എന്നതിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ തത്തുല്യം ‘അനാഥൻ’ ആണ്; അക്ഷരാർഥമായ ‘പിതാവില്ലാത്തവൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וְלָאַלְמָנָה
  choice: വിധവയ്ക്ക്
  rationale: אַלְמָנָהയുടെ നേരിട്ടുള്ളതും സാധാരണവുമായ മലയാള തത്തുല്യം.
- source_word: יִהְיֶה
  choice: ഉള്ളതായിരിക്കണം
  rationale: ശേഷിച്ച വിളവ് ഈ ദുർബല വിഭാഗങ്ങൾക്കായി വിട്ടുകൊടുക്കണമെന്ന നിയമപരമായ അവകാശ/നിയോഗ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
