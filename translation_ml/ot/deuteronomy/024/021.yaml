translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നിയമവാക്യത്തിന്റെ നിർദേശഭാവം നിലനിർത്തിയിട്ടുണ്ട്. കൃഷിസംബന്ധമായ അപൂർവ ക്രിയയ്ക്ക് അമിത സാങ്കേതികത ഒഴിവാക്കി, രണ്ടാമത്തെ ശേഖരണത്തിന്റെ ആശയം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും വ്യക്തമാക്കി.
