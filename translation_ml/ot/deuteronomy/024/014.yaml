revisions:
- from: ദരിദ്രനും ആവശ്യത്തിലിരിക്കുന്നവനുമായ കൂലിവേലക്കാരനെ നീ ചൂഷണം ചെയ്യരുത്[a]. അവൻ നിന്റെ സഹോദരന്മാരിൽ ഒരാളായാലും നിന്റെ ദേശത്ത്, നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന പരദേശികളിൽ ഒരാളായാലും അങ്ങനെ ചെയ്യരുത്[b].
  to: ദരിദ്രനും ആവശ്യക്കാരനുമായ ഒരു കൂലിവേലക്കാരനെ—അവൻ നിന്റെ സഹോദരന്മാരിൽ ഒരാളായാലും നിന്റെ ദേശത്ത് നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന നിന്റെ പരദേശികളിൽ ഒരാളായാലും—നീ ചൂഷണം ചെയ്യരുത്[a][b].
