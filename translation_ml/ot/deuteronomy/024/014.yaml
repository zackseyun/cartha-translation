reference: Deuteronomy 24:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תַעֲשֹׁ֥ק שָׂכִ֖יר עָנִ֣י וְ/אֶבְי֑וֹן מֵ/אַחֶ֕י/ךָ א֧וֹ מִ/גֵּרְ/ךָ֛ אֲשֶׁ֥ר בְּ/אַרְצְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: ml
  text: ദരിദ്രനും ആവശ്യക്കാരനുമായ ഒരു കൂലിവേലക്കാരനെ—അവൻ നിന്റെ സഹോദരന്മാരിൽ ഒരാളായാലും നിന്റെ ദേശത്ത് നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന നിന്റെ പരദേശികളിൽ ഒരാളായാലും—നീ ചൂഷണം ചെയ്യരുത്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചൂഷണം ചെയ്യുക” എന്നതിന് വഞ്ചിക്കുക, ചൂഷണം ചെയ്യുക, സാമ്പത്തികമായി അടിച്ചമർത്തുക എന്നീ അർഥങ്ങളും ഇവിടെ ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: “നിന്റെ പട്ടണങ്ങളിൽ” എന്നതിന്റെ അക്ഷരാർഥം “നിന്റെ കവാടങ്ങളിൽ” എന്നാണ്; പട്ടണങ്ങളിലോ സമൂഹത്തിന്റെ അധികാരപരിധിയിലോ ഉള്ള ജീവിതത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: ചൂഷണം ചെയ്യരുത്
  rationale: עָשַׁק എന്ന ക്രിയ സാമ്പത്തികമായ അടിച്ചമർത്തലും അവകാശപ്പെട്ടത് നിഷേധിക്കലും ഉൾക്കൊള്ളുന്നു. ആധുനിക മലയാളത്തിൽ ‘ചൂഷണം ചെയ്യുക’ ഈ സന്ദർഭത്തിലെ വിശാലമായ ധാർമിക-സാമ്പത്തിക അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: שָׂכִיר
  choice: കൂലിവേലക്കാരൻ
  rationale: കൂലിക്കു നിയമിക്കപ്പെട്ട് ജോലി ചെയ്യുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കൂലിവേലക്കാരൻ’ സാധാരണ വായനക്കാർക്കു വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עָנִי וְאֶבְיוֹן
  choice: ദരിദ്രനും ആവശ്യത്തിലിരിക്കുന്നവനുമായ
  rationale: രണ്ടു പദങ്ങളുടെയും ചേർന്നുള്ള സാമ്പത്തിക ദുർബലത നിലനിർത്തുന്നു; രണ്ടാമത്തെ പദത്തെ ‘അഗതി’ എന്നു ചുരുക്കാതെ ആവശ്യം അനുഭവിക്കുന്ന അവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: מֵאַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാരിൽ ഒരാൾ
  rationale: ‘നിന്റെ സഹോദരന്മാരിൽനിന്ന്’ എന്ന എബ്രായ ബന്ധുത്വഭാഷ സംരക്ഷിക്കുന്നു; നിയമസന്ദർഭത്തിൽ ഇത് സഹഇസ്രായേല്യനെ സൂചിപ്പിക്കുന്നു.
- source_word: מִגֵּרְךָ
  choice: നിന്റെ ... പരദേശികളിൽ ഒരാൾ
  rationale: גֵּר എന്നത് സമൂഹത്തിനകത്ത് താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത സംരക്ഷിത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘പരദേശി’ ആ ബൈബിൾസാമൂഹിക വിഭാഗത്തെ ആധുനിക കുടിയേറ്റനിയമ പദങ്ങൾ ചുമത്താതെ അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: നിന്റെ ദേശത്ത് ... താമസിക്കുന്ന
  rationale: ബന്ധവാക്യം സമീപസ്ഥമായ പരദേശിയെ വിശേഷിപ്പിക്കുന്നു; ‘താമസിക്കുന്ന’ എന്ന് നൽകുന്നത് വെറും താൽക്കാലിക സാന്നിധ്യത്തേക്കാൾ גר എന്ന പദത്തിന്റെ പാർപ്പിടസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: בִּשְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണങ്ങളിൽ
  rationale: അക്ഷരാർഥം ‘നിന്റെ കവാടങ്ങളിൽ’ എന്നാണെങ്കിലും, ഈ നിയമപ്രയോഗത്തിൽ പട്ടണങ്ങളെയോ പ്രാദേശിക അധികാരപരിധിയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ അർഥം നൽകി ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: നിയമത്തിലെ אַחֶיךָ എന്ന ബന്ധുത്വപദം
  choice: നിന്റെ സഹോദരന്മാരിൽ ഒരാൾ
  alternative: നിന്റെ സഹഇസ്രായേല്യരിൽ ഒരാൾ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബന്ധുത്വരൂപവും ഉടമ്പടിസമൂഹത്തിന്റെ ഭാഷയും നിലനിർത്തുന്നു; അതിനെ നിർവചനാത്മകമായി ‘സഹഇസ്രായേല്യൻ’ എന്നു മാറ്റുന്നില്ല.
- issue: גֵּר എന്ന സംരക്ഷിത സാമൂഹികവിഭാഗം
  choice: പരദേശി
  alternative: പ്രവാസി / താമസക്കാരനായ വിദേശി
  rationale: സ്വദേശിയല്ലെങ്കിലും ദേശത്തിനകത്ത് പാർക്കുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക നിയമപരമായ ‘അന്യദേശപൗരൻ’ പോലുള്ള പരിമിത അർഥങ്ങൾ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ’ നിലനിർത്തി. നീണ്ട എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചെങ്കിലും നിരോധനത്തിന്റെ വ്യാപ്തിയും രണ്ടു വിഭാഗങ്ങൾ തമ്മിലുള്ള വൈരുധ്യവും സംരക്ഷിച്ചു.
