id: DEU.24.15
reference: Deuteronomy 24:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/יוֹמ/וֹ֩ תִתֵּ֨ן שְׂכָר֜/וֹ וְֽ/לֹא תָב֧וֹא עָלָ֣י/ו הַ/שֶּׁ֗מֶשׁ כִּ֤י עָנִי֙ ה֔וּא וְ/אֵלָ֕י/ו ה֥וּא נֹשֵׂ֖א אֶת נַפְשׁ֑/וֹ וְ/לֹֽא יִקְרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: ml
  text: അന്നുതന്നെ[a] അവന്റെ കൂലി കൊടുക്കണം; സൂര്യൻ അസ്തമിക്കുന്നതിനുമുമ്പ് അത് കൊടുക്കണം. അവൻ ദരിദ്രനാണ്; അവന്റെ ജീവൻ അതിന്മേൽ ആശ്രയിച്ചിരിക്കുന്നു. അല്ലെങ്കിൽ അവൻ യഹ്‌വേയോടു നിനക്കെതിരെ നിലവിളിക്കുകയും അതു നിനക്കു പാപമായിത്തീരുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ ദിവസത്തിൽ.’ അതായത്, കൂലി നൽകേണ്ട അന്നുതന്നെ. ‘അവന്റെ ജീവൻ അതിന്മേൽ ആശ്രയിച്ചിരിക്കുന്നു’ എന്നതിനു പിന്നിലെ എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവൻ തന്റെ ജീവനെ അതിലേക്കു ഉയർത്തുന്നു/വഹിക്കുന്നു’ എന്നാണ്; കൂലി ലഭിക്കേണ്ടതിലുള്ള അവന്റെ അത്യാവശ്യ ആശ്രയത്തെ അത് സൂചിപ്പിക്കുന്നു.
    reason: മൂലത്തിലെ സമയസൂചനയും ജീവനോപാധിയായ കൂലിയിലുള്ള ആശ്രയം സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: അവന്റെ ദിവസത്തിൽത്തന്നെ
  rationale: ‘അവന്റെ ദിവസത്തിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിലെ സ്വത്തുസൂചകഭാവം നിലനിർത്തിക്കൊണ്ട്, കൂലി അതേ ദിവസം നൽകണമെന്ന അടിയന്തരത ‘-ത്തന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: שְׂכָרוֹ
  choice: അവന്റെ കൂലി
  rationale: തൊഴിലിന് അർഹമായി ലഭിക്കേണ്ട പ്രതിഫലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപദമാണ് ‘കൂലി’.
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: അതിന്മേൽ സൂര്യൻ അസ്തമിക്കരുത്
  rationale: കൂലി കൊടുക്കാതെ സൂര്യാസ്തമയം കടന്നുപോകരുതെന്ന സമയപരിധി, മൂലത്തിലെ ‘അതിന്മേൽ’ എന്ന സർവനാമബന്ധം സഹിതം നിലനിർത്തുന്നു.
- source_word: כִּי עָנִי הוּא
  choice: അവൻ ദരിദ്രനാണ്
  rationale: ഈ തൊഴിൽനിയമസന്ദർഭത്തിൽ עָנִי സാമ്പത്തിക ദൗർബല്യത്തെയും ആവശ്യകതയെയും സൂചിപ്പിക്കുന്നു.
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: അവന്റെ ജീവൻ അതിന്മേൽ ആശ്രയിച്ചിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിലെ ‘തന്റെ ജീവനെ അതിലേക്കു ഉയർത്തുന്നു/വഹിക്കുന്നു’ എന്ന പ്രയോഗം കൂലിയിലുള്ള അത്യാവശ്യ ആശ്രയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ അർഥം നൽകുന്നു; അടിയിലെ രൂപകം കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: അല്ലെങ്കിൽ അവൻ നിനക്കെതിരെ യഹ്‌വേയോടു നിലവിളിക്കുകയും
  rationale: וְלֹא ഇവിടെ ഒഴിവാക്കേണ്ട ഫലത്തെ മുന്നറിയിപ്പായി അവതരിപ്പിക്കുന്നു; പീഡിതനായ തൊഴിലാളി ദൈവത്തോടു നടത്തുന്ന നീതിക്കായുള്ള അപേക്ഷയെ ‘നിലവിളിക്കുക’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: അതു നിനക്കു പാപമായിത്തീരുകയും ചെയ്യും
  rationale: הָיָה എന്ന ‘ആയിത്തീരുക’ എന്ന ഭാവവും בְךָയുടെ വ്യക്തിയോടുള്ള നൈതികബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: וְהָיָה בְךָ חֵטְא എന്നതിലെ പാപബന്ധം
  choice: അതു നിനക്കു പാപമായിത്തീരും
  alternative: നീ കുറ്റക്കാരനാകും
  rationale: ‘കുറ്റക്കാരൻ’ എന്ന കൂടുതൽ സാങ്കേതിക നിയമഭാഷ ഇറക്കുമതി ചെയ്യാതെ, പാപം ആ വ്യക്തിയുമായി ബന്ധപ്പെടുന്നതും ‘ആയിത്തീരുക’ എന്ന മൂലഭാവവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമോപദേശ ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിനക്ക്’ നിലനിർത്തി. മൂലത്തിലെ ദൃശ്യരൂപം സാധ്യമാകുന്നിടത്ത് സംരക്ഷിക്കുകയും അസ്വാഭാവികമായിടത്ത് അർഥം മുഖ്യപാഠത്തിൽ നൽകി രൂപകം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
