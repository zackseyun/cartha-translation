revisions:
- from: ഇസ്രായേൽമക്കളിൽ ഒരാളായ തന്റെ സഹോദരനെ തട്ടിക്കൊണ്ടുപോയി[a] അടിമയായി ഉപയോഗിക്കുകയും വിൽക്കുകയും ചെയ്ത ഒരാളെ കണ്ടെത്തിയാൽ, ആ തട്ടിക്കൊണ്ടുപോയവൻ മരണശിക്ഷ അനുഭവിക്കണം. അങ്ങനെ നിങ്ങളുടെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയണം.
