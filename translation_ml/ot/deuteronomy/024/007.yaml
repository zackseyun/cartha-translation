reference: Deuteronomy 24:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א אִ֗ישׁ גֹּנֵ֨ב נֶ֤פֶשׁ מֵ/אֶחָי/ו֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הִתְעַמֶּר בּ֖/וֹ וּ/מְכָר֑/וֹ וּ/מֵת֙ הַ/גַּנָּ֣ב הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളിൽപ്പെട്ട തന്റെ സഹോദരന്മാരിൽ ഒരാളെ[b] തട്ടിക്കൊണ്ടുപോയി[a] അവനെ അടിമയാക്കുകയും വിൽക്കുകയും ചെയ്ത ഒരാളെ കണ്ടെത്തിയാൽ, ആ തട്ടിക്കൊണ്ടുപോയവൻ മരണശിക്ഷ അനുഭവിക്കണം. അങ്ങനെ നിങ്ങളുടെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു വ്യക്തിയെ മോഷ്ടിച്ച്’; ഇവിടെ ഒരു മനുഷ്യനെ അപഹരിക്കുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘സഹോദരന്മാർ’ എന്നത് ജൈവസഹോദരന്മാരെ മാത്രമല്ല, ഇസ്രായേൽജനതയിലെ സഹഅംഗങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יִמָּצֵא
  choice: കണ്ടെത്തിയാൽ
  rationale: നിഫാൽ രൂപത്തിന്റെ ‘കണ്ടെത്തപ്പെടുക’ എന്ന നിഷ്ക്രിയ അർഥം മലയാളത്തിലെ സ്വാഭാവിക നിയമവ്യവസ്ഥാ നിബന്ധനയിൽ ‘ഒരാളെ കണ്ടെത്തിയാൽ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: എബ്രായത്തിൽ ഏകവചന പുല്ലിംഗമാണെങ്കിലും ഈ നിയമസന്ദർഭത്തിൽ കുറ്റം ചെയ്യുന്ന വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഒരാൾ’ സ്വാഭാവികവും രൂപത്തെ അനാവശ്യമായി ലിംഗനിർണ്ണയം ചെയ്യാത്തതുമാണ്.
- source_word: גֹּנֵב נֶפֶשׁ
  choice: ഒരാളെ തട്ടിക്കൊണ്ടുപോയി
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു വ്യക്തിയെ മോഷ്ടിക്കുക’; മനുഷ്യനെ അനധികൃതമായി പിടിച്ചുകൊണ്ടുപോകുന്നതിനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽ ഒരാളായ തന്റെ സഹോദരനെ
  rationale: ‘സഹോദരൻ’ എന്ന ഉടമ്പടി-സമൂഹ ബന്ധഭാഷ നിലനിർത്തുകയും പിന്നാലെയുള്ള ‘ഇസ്രായേൽമക്കളിൽ ഒരാൾ’ അതിന്റെ സമൂഹപരമായ പരിധി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: അടിമയായി ഉപയോഗിക്കുകയും
  rationale: ഹിത്പയേൽ ക്രിയ ഇവിടെ അപഹരിക്കപ്പെട്ട വ്യക്തിയെ സ്വന്തം പ്രയോജനത്തിനായി അടിമയോ സ്വത്തോ പോലെ കൈകാര്യം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അടിമയാക്കുക’ എന്ന സാധ്യതയെക്കാൾ ചൂഷണപരമായ ഉപയോഗം നേരിട്ട് പ്രകടമാക്കുന്നു; എന്നാൽ ക്രിയയുടെ അപൂർവത മൂലമുള്ള വ്യാഖ്യാനവ്യത്യാസം ശ്രദ്ധിക്കേണ്ടതാണ്.
- source_word: וּמְכָרוֹ
  choice: വിൽക്കുകയും
  rationale: വസ്തുവിനെപ്പോലെ ആ വ്യക്തിയെ വിൽക്കുന്ന പ്രവൃത്തി നേരിട്ടും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: ആ തട്ടിക്കൊണ്ടുപോയവൻ മരണശിക്ഷ അനുഭവിക്കണം
  rationale: ‘ആ മോഷ്ടാവ് മരിക്കണം’ എന്ന എബ്രായ നിയമവിധിയുടെ ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; സാധാരണ മോഷ്ടാവുമായുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ കുറ്റത്തിന്റെ സ്വഭാവം ആവർത്തിക്കുന്നു.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: അങ്ങനെ നിങ്ങളുടെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയണം
  rationale: ആവർത്തിക്കുന്ന ആവർത്തനപുസ്തക നിയമസൂത്രത്തിന്റെ ന്യായവിധി-ശുദ്ധീകരണബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-സമൂഹത്തിലെ ബന്ധഭാഷ
  choice: ‘തന്റെ സഹോദരനെ’ നിലനിർത്തി, ‘ഇസ്രായേൽമക്കളിൽ ഒരാൾ’ എന്നു പരിധി വ്യക്തമാക്കി.
  alternative: ‘തന്റെ സഹഇസ്രായേല്യനെ’
  rationale: ‘സഹോദരൻ’ എന്ന മൂലരൂപകത്തെ ഇല്ലാതാക്കാതെ ഇത് ജൈവസഹോദരനെ മാത്രം ഉദ്ദേശിക്കുന്നില്ലെന്നു സന്ദർഭം വ്യക്തമാക്കുന്നു.
- issue: וְהִתְעַמֶּר בּוֹ എന്ന അപൂർവ ക്രിയയുടെ അർഥം
  choice: ‘അടിമയായി ഉപയോഗിക്കുകയും’
  alternative: ‘അവനെ അടിമയാക്കുകയും’ / ‘അവനെക്കൊണ്ട് ലാഭമുണ്ടാക്കുകയും’
  rationale: വിൽപ്പനയ്ക്കുമുമ്പുള്ള ചൂഷണപരമായ കൈകാര്യം ചെയ്യലും അടിമസ്ഥിതിയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു; ക്രിയയുടെ കൃത്യമായ സൂക്ഷ്മാർഥത്തെ ഒരു മാത്രം വ്യാഖ്യാനത്തിലേക്ക് പൂർണമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയ നിയമഭാഷ ഉപയോഗിച്ചു. ‘ഇസ്രായേൽമക്കൾ’, ‘സഹോദരൻ’ എന്നീ ഉറവിടത്തിലെ സമൂഹബന്ധ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി. പ്രധാനപാഠത്തിലുള്ള [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
