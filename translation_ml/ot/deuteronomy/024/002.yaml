translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമവാക്യത്തിന്റെ നിബന്ധനാത്മക തുടർച്ച നിലനിർത്തുന്ന ലളിതവും മാന്യവുമായ ശൈലി. മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്നതിനാൽ പൂർണ്ണവിരാമത്തിനു പകരം കോമ നിലനിർത്തി.
