  text: and she leaves his house and goes and becomes another man's wife,[a]
translation:
  language: ml
  text: അവൾ അവന്റെ വീട്ടിൽനിന്ന് പുറപ്പെട്ട് പോകുകയും മറ്റൊരു പുരുഷന്റെ ഭാര്യയായിത്തീരുകയും ചെയ്താൽ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘മറ്റൊരു പുരുഷന് ആയിത്തീരുന്നു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പ്രയോഗം അവൾ മറ്റൊരു പുരുഷനുമായി വിവാഹബന്ധത്തിൽ പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאָה מִבֵּיתוֹ
  choice: അവൾ അവന്റെ വീട്ടിൽനിന്ന് ഇറങ്ങിപ്പോയി
  rationale: יצא എന്ന ക്രിയയും מן എന്ന ബന്ധകവും ചേർന്ന് അവന്റെ വീട്ടിൽനിന്നുള്ള പുറപ്പെടൽ വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ ‘ഇറങ്ങിപ്പോയി’ പുറപ്പെടലും തുടർന്നുള്ള നീക്കവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְהָלְכָה
  choice: ഇറങ്ങിപ്പോയി എന്ന പ്രയോഗത്തിൽ ഉൾപ്പെടുത്തി
  rationale: הלך തുടർനടപടിയായ പോകലിനെ സൂചിപ്പിക്കുന്നു. ‘ഇറങ്ങിപ്പോയി’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം יצא, הלך എന്നീ അനുക്രമക്രിയകളുടെ അർഥം ചുരുക്കാതെ ഒന്നിച്ചറിയിക്കുന്നു; ‘പുറത്തുപോയി പോയി’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וְהָיְתָה
  choice: ആയാൽ
  rationale: היה + לְ ഒരു പുതിയ ബന്ധത്തിലേക്കോ നിലയിലേക്കോ പ്രവേശിക്കുന്നതിനെ ഇവിടെ സൂചിപ്പിക്കുന്നു. നിയമപരമായ നിബന്ധനയുടെ തുടർച്ചയായി ‘ആയാൽ’ സ്വാഭാവികമാണ്.
- source_word: לְאִישׁ אַחֵר
  choice: മറ്റൊരു പുരുഷന്റെ ഭാര്യ
  rationale: അക്ഷരാർഥം ‘മറ്റൊരു പുരുഷന്’ എന്നാണ്; വിവാഹമോചനത്തിന്റെയും പുനർവിവാഹത്തിന്റെയും സന്ദർഭത്തിൽ ഇത് മറ്റൊരു പുരുഷനുമായി വിവാഹബന്ധത്തിൽ പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഭാര്യ’ ചേർക്കുന്നത് സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
