reference: Deuteronomy 24:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י תִקְצֹר֩ קְצִֽירְ/ךָ֨ בְ/שָׂדֶ֜/ךָ וְ/שָֽׁכַחְתָּ֧ עֹ֣מֶר בַּ/שָּׂדֶ֗ה לֹ֤א תָשׁוּב֙ לְ/קַחְתּ֔/וֹ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶ֑ה לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מַעֲשֵׂ֥ה יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: ml
  text: നിന്റെ വയലിൽ നിന്റെ വിളവ് കൊയ്യുമ്പോൾ, വയലിൽ ഒരു കറ്റ മറന്നുപോയാൽ, അതെടുക്കാൻ മടങ്ങിപ്പോകരുത്. അത് പരദേശിക്കും[a] അനാഥനും[b] വിധവയ്ക്കും ഉള്ളതായിരിക്കട്ടെ; നിന്റെ ദൈവമായ യഹ്‌വേ നിന്റെ കൈകളുടെ എല്ലാ പ്രവൃത്തികളിലും നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരദേശി’ എന്നതിന് ‘വിദേശി,’ ‘അന്യദേശവാസി,’ അല്ലെങ്കിൽ ‘താമസക്കാരനായ വിദേശി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഇസ്രായേല്യരുടെ ഇടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അനാഥൻ’ എന്നതിന് ‘പിതാവില്ലാത്തവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִקְצֹר קְצִירְךָ
  choice: നിന്റെ വയലിലെ വിളവ് കൊയ്യുമ്പോൾ
  rationale: כִּי ഇവിടെ ഒരു സാഹചര്യാധിഷ്ഠിത നിയമം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കൊയ്യുമ്പോൾ’ അതിന്റെ വ്യവസ്ഥാസ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു. קָצַר എന്ന ക്രിയയുടെ ധാന്യം കൊയ്യുക എന്ന കാർഷികചിത്രവും നിലനിർത്തുന്നു.
- source_word: עֹמֶר
  choice: ഒരു കറ്റ
  rationale: ഇവിടെ ഈ പദം അളവായ ‘ഒമർ’ അല്ല, കൊയ്ത ധാന്യത്തിന്റെ കെട്ടിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കറ്റ’ കൃത്യവും സ്വാഭാവികവുമായ മലയാള കാർഷികപദമാണ്.
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: അതെടുക്കാൻ മടങ്ങിപ്പോകരുത്
  rationale: തിരികെ പോകുന്നതും കറ്റ എടുത്തുകൊണ്ടുവരുന്നതും ഉൾപ്പെടുന്ന എബ്രായ പ്രയോഗത്തെ വ്യക്തമായ നിരോധനമായി അവതരിപ്പിക്കുന്നു.
- source_word: לַגֵּר
  choice: നിന്റെ ഇടയിൽ താമസിക്കുന്ന പരദേശി
  rationale: גֵּר വെറും അപരിചിതനെയല്ല, ഇസ്രായേലിന്റെ ഇടയിൽ സ്ഥിരമായി പാർക്കുന്ന സ്വദേശിയല്ലാത്ത ആളെയാണ് സൂചിപ്പിക്കുന്നത്. വിശദീകരണപരമായ ഈ രൂപം സാമൂഹിക-നിയമപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לַיָּתוֹם
  choice: അനാഥൻ
  rationale: יָתוֹם എന്ന ദുർബല സാമൂഹികവിഭാഗത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘പിതാവില്ലാത്തവൻ’ എന്ന കൂടുതൽ അക്ഷരാർഥ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יִהְיֶה
  choice: ഉള്ളതായിരിക്കട്ടെ
  rationale: ഇത് കർശനമായ ഉടമസ്ഥാവകാശ കൈമാറ്റത്തേക്കാൾ, മറന്നുവെച്ച കറ്റ ഈ ദുർബല വിഭാഗങ്ങൾക്കായി വിട്ടുകൊടുക്കണമെന്ന നിർദേശം പ്രകടിപ്പിക്കുന്നു.
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: അങ്ങനെ ... നിന്നെ അനുഗ്രഹിക്കും
  rationale: לְמַעַן സൂചിപ്പിക്കുന്ന ലക്ഷ്യവും പ്രതീക്ഷിക്കുന്ന ഫലവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അനുഗ്രഹത്തെ യാന്ത്രിക പ്രതിഫലമായി വിശദീകരിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ ചതുർക്ഷരനാമത്തെ ഒരു സ്ഥാനപദംകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് പൊതുവായ സ്ഥാനപദമായി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു.
- issue: גֵּר എന്ന സാമൂഹിക-നിയമപരമായ വിഭാഗം
  choice: നിന്റെ ഇടയിൽ താമസിക്കുന്ന പരദേശി
  alternative: വിദേശി / അപരിചിതൻ
  rationale: ഈ പദം സമൂഹത്തിന് പുറത്തുള്ള ഏതൊരാളെയുമല്ല, ഇസ്രായേലിന്റെ ഇടയിൽ വസിക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ വാസസ്ഥിതിയും പരദേശിത്വവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- issue: לְמַעַן എന്നതിലെ ലക്ഷ്യ-ഫല ബന്ധം
  choice: അങ്ങനെ ... അനുഗ്രഹിക്കും
  alternative: '... അനുഗ്രഹിക്കേണ്ടതിന്'
  rationale: ദരിദ്രർക്കായി കറ്റ വിട്ടുകൊടുക്കുന്നതും ദൈവാനുഗ്രഹവും തമ്മിലുള്ള പാഠത്തിലെ ബന്ധം നിലനിർത്തുന്നു; എന്നാൽ അനുഗ്രഹത്തിന്റെ പ്രവർത്തനരീതി അതിലുപരി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. കാർഷികസന്ദർഭത്തിന് സ്വാഭാവികമായ ‘വിളവ്,’ ‘കൊയ്യുക,’ ‘കറ്റ’ എന്നീ പദങ്ങൾ തെരഞ്ഞെടുത്തു. ഏകവചന ദ്വിതീയപുരുഷരൂപങ്ങൾ മൂലപാഠത്തോട് യോജിപ്പിച്ചു; ദുർബല സാമൂഹികവിഭാഗങ്ങളുടെ ത്രയം വ്യക്തമായി നിലനിർത്തി.
