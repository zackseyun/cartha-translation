revisions:
- from: നിന്റെ വയലിലെ വിളവ് കൊയ്യുമ്പോൾ, വയലിൽ ഒരു കറ്റ മറന്നുപോയാൽ, അതെടുക്കാൻ മടങ്ങിപ്പോകരുത്. അത് നിന്റെ ഇടയിൽ താമസിക്കുന്ന പരദേശിക്കും[a] അനാഥനും[b] വിധവയ്ക്കും ഉള്ളതായിരിക്കട്ടെ. അങ്ങനെ നിന്റെ ദൈവമായ യഹോവ നിന്റെ കൈകളുടെ എല്ലാ പ്രവൃത്തികളിലും നിന്നെ അനുഗ്രഹിക്കും.
  to: നിന്റെ വയലിൽ നിന്റെ വിളവ് കൊയ്യുമ്പോൾ, വയലിൽ ഒരു കറ്റ മറന്നുപോയാൽ, അതെടുക്കാൻ മടങ്ങിപ്പോകരുത്. അത് പരദേശിക്കും[a] അനാഥനും[b] വിധവയ്ക്കും ഉള്ളതായിരിക്കട്ടെ; നിന്റെ ദൈവമായ യഹ്‌വേ നിന്റെ കൈകളുടെ എല്ലാ പ്രവൃത്തികളിലും നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.
  rationale: The revision preserves the Hebrew legal instruction and its social categories while avoiding an unexpressed possessive expansion. It follows the POB decision to render the Tetragrammaton as Yahweh, expressed in Malayalam as “യഹ്‌വേ,” and restores the purpose force of לְמַעַן. Footnote markers remain attached to the terms they explain.
  reviewer_model: gpt-5.6-terra
