source:
  edition: WLC
  text: לֹ֣א תַטֶּ֔ה מִשְׁפַּ֖ט גֵּ֣ר יָת֑וֹם וְ/לֹ֣א תַחֲבֹ֔ל בֶּ֖גֶד אַלְמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/017.yaml
  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശിക്കോ[a] അനാഥനോ ലഭിക്കേണ്ട നീതി നിഷേധിക്കരുത്; വിധവയുടെ വസ്ത്രം പണയമായി എടുക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘താമസക്കാരനായ പരദേശി’ അല്ലെങ്കിൽ ‘അന്യദേശക്കാരൻ.’ എബ്രായപദം ഇസ്രായേല്യരുടെ ഇടയിൽ താമസിക്കുകയും അവരുടെ സാമൂഹികവും നിയമപരവുമായ സംരക്ഷണത്തിൻ കീഴിൽ ജീവിക്കുകയും ചെയ്യുന്ന സ്വദേശിയല്ലാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַטֶּה
  choice: നീതി നിഷേധിക്കുക
  rationale: נטה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ന്യായവിധിയെ വളച്ചൊടിക്കുകയോ ഒരാളുടെ ന്യായമായ അവകാശം തട്ടിമാറ്റുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നീതി നിഷേധിക്കുക’ എന്ന പ്രയോഗം ഈ നിയമസന്ദർഭത്തിലെ ഫലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁפַּט
  choice: ലഭിക്കേണ്ട നീതി
  rationale: מִשְׁפָּט ഇവിടെ പൊതുവായ ‘ന്യായം’ മാത്രമല്ല, ദുർബലനായ ഒരാൾക്ക് നിയമപരമായി ലഭിക്കേണ്ട നീതിയെയും അവകാശത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: גֵּר
  choice: നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശി
  rationale: גֵּר ഒരു വഴിപോക്കനെയല്ല, ഇസ്രായേൽസമൂഹത്തിനിടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. വിശദീകരണാത്മകമായ ഈ പ്രയോഗം ആ സാമൂഹിക-നിയമപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יָתוֹם
  choice: അനാഥൻ
  rationale: יָתוֹם പ്രത്യേകിച്ച് പിതൃസംരക്ഷണം നഷ്ടപ്പെട്ട കുട്ടിയെ സൂചിപ്പിക്കാമെങ്കിലും, ആധുനിക മലയാളത്തിൽ ‘അനാഥൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: תַחֲבֹל
  choice: പണയമായി എടുക്കുക
  rationale: חבל എന്ന ക്രിയ ഈ നിയമസന്ദർഭത്തിൽ കടത്തിനുള്ള ഈടായി ഒരു വസ്തു കൈക്കലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בֶּגֶד
  choice: വസ്ത്രം
  rationale: בֶּגֶד വസ്ത്രത്തിനുള്ള പൊതുപദമാണ്; പ്രത്യേകിച്ച് മേലങ്കിയെന്ന അർഥം നിർബന്ധിക്കാതെ മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אַלְמָנָה
  choice: വിധവ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ ആധുനിക മലയാള തത്തുല്യമാണ്.
theological_decisions:
- issue: സംരക്ഷിക്കപ്പെടേണ്ട സാമൂഹികവിഭാഗമായ גֵּר എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശി
  alternative: പരദേശി / അന്യദേശക്കാരൻ
  rationale: ഈ പദം പൊതുവായി ഏതൊരു വിദേശിയെയും അപരിചിതനെയും സൂചിപ്പിക്കുന്നതല്ല; ഇസ്രായേൽസമൂഹത്തിനിടയിൽ താമസിക്കുകയും അതിന്റെ സാമൂഹിക-നിയമപരമായ സംരക്ഷണത്തിന് വിധേയനാകുകയും ചെയ്യുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ വിഭാഗത്തിന്റെ നിയമപരമായ സൂക്ഷ്മത വിശദീകരണാത്മകമായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. നിയമപരമായ ആശയം സ്വാഭാവികമാക്കാൻ ‘ലഭിക്കേണ്ട നീതി നിഷേധിക്കരുത്’ എന്നും കടത്തിനുള്ള ഈടിന്റെ ആശയം വ്യക്തമാക്കാൻ ‘പണയമായി എടുക്കുക’ എന്നും നൽകി. മൂലത്തിലെ ദുർബല വിഭാഗങ്ങളുടെ നിരയെ അനാവശ്യമായി മതസിദ്ധാന്തപരമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
