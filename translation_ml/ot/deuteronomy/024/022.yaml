source:
  edition: WLC
  text: וְ/זָ֣כַרְתָּ֔ כִּי עֶ֥בֶד הָיִ֖יתָ בְּ/אֶ֣רֶץ מִצְרָ֑יִם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/022.yaml
  text: And remember that you were a servant in the land of Egypt[a]; therefore I am commanding you to do this thing.
translation:
  language: ml
  text: നീ ഈജിപ്തുദേശത്ത് അടിമയായിരുന്നുവെന്ന് ഓർക്കുക; അതുകൊണ്ട് ഈ കാര്യം ചെയ്യണമെന്ന് ഞാൻ നിന്നോടു കല്പിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഈ വിഷയം” അല്ലെങ്കിൽ “ഈ കല്പന.” എബ്രായയിലെ “ഈ കാര്യം” എന്നത് ദുർബലർക്കായി വിളവിന്റെ ഒരു ഭാഗം ശേഷിപ്പിക്കണമെന്ന തൊട്ടുമുമ്പുള്ള നിർദേശത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: ഓർക്കുക
  rationale: നിയമസന്ദർഭത്തിൽ കല്പനാത്മകമായ അർഥം നൽകുന്നു; മുൻ നിർദേശത്തോടുള്ള ബന്ധം വാക്യപ്രവാഹത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: כִּי עֶבֶד הָיִיתָ
  choice: നീ ... അടിമയായിരുന്നുവെന്ന്
  rationale: כִּי ഓർക്കേണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; ഈജിപ്തിലെ ബന്ധിതാവസ്ഥയെ עֶבֶד ഇവിടെ ‘അടിമ’ എന്നു വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്ത്
  rationale: ‘ഈജിപ്തുദേശം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സവിശേഷത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻകാല അടിമത്തവും ഇപ്പോഴത്തെ കല്പനയും തമ്മിലുള്ള കാരണാധിഷ്ഠിത നിഗമനം ഊന്നിപ്പറയുന്നു.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: ഞാൻ നിന്നോടു കല്പിക്കുന്നത്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നലും കർത്താവിന്റെ ഇപ്പോഴത്തെ അധികാരപൂർണ കല്പനയും സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לַעֲשׂוֹת אֶת־הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം ചെയ്യാൻ
  rationale: עשה എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘ചെയ്യുക’ നിലനിർത്തുകയും דבר എന്ന വിശാലപദത്തെ ‘കാര്യം’ എന്നു നൽകുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. അടിമത്തത്തിന്റെ ചരിത്രസ്മരണയും അതിൽനിന്ന് ഉരുത്തിരിയുന്ന നൈതിക ബാധ്യതയും വ്യക്തമായി നിലനിർത്തി.
