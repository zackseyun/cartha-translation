source:
  edition: WLC
  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: ml
  text: സൂര്യൻ അസ്തമിക്കുമ്പോൾ നീ പണയവസ്തു[a] അവനു നിർബന്ധമായും തിരികെ കൊടുക്കണം. അങ്ങനെ അവന് തന്റെ മേലങ്കി പുതച്ചുകിടക്കാനും നിന്നെ അനുഗ്രഹിക്കാനും കഴിയും; അത് നിന്റെ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽ നിനക്കു നീതിയായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഈടായി വാങ്ങിയ വസ്തു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അത് നിനക്കു നീതിയായി കണക്കാക്കപ്പെടും” അല്ലെങ്കിൽ “അത് നിന്റെ നീതിപ്രവൃത്തിയായിരിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: നിർബന്ധമായും തിരികെ കൊടുക്കണം
  rationale: ക്രിയയോടൊപ്പം വന്ന infinitive absolute കല്പനയ്ക്ക് ഊന്നൽ നൽകുന്നു; ഈ മലയാളപ്രയോഗം ആ നിർബന്ധവും ഊന്നലും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַעֲבוֹט
  choice: പണയവസ്തു
  rationale: വായ്പയ്ക്ക് ഈടായി കൈപ്പറ്റിയ വസ്തുവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; നിയമപരമായ സന്ദർഭത്തിൽ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ രൂപമാണിത്.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിക്കുമ്പോൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘സൂര്യന്റെ വരവിൽ’ എന്ന ഹീബ്രു ശൈലി സൂര്യാസ്തമയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וְשָׁכַב בְּשַׂלְמָתוֹ
  choice: അവൻ തന്റെ മേലങ്കിയിൽ കിടന്നുറങ്ങി
  rationale: שַׂלְמָה ഇവിടെ രാത്രിയിൽ പുതപ്പായി ഉപയോഗിക്കുന്ന പുറംവസ്ത്രമാണ്; ‘മേലങ്കി’ അതിന്റെ പ്രായോഗിക അർഥം വ്യക്തമാക്കുന്നു. കിടക്കുക എന്നതോടൊപ്പം സന്ദർഭത്തിലെ ഉറക്കവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וּבֵרֲכֶךָּ
  choice: നിന്നെ അനുഗ്രഹിക്കും
  rationale: പണയവസ്തു തിരികെ ലഭിച്ച ദരിദ്രൻ കടം കൊടുത്തവനെ അനുഗ്രഹിക്കുന്നു; ഹീബ്രുവിലെ കർത്താവും കർമവും അതേപടി നിലനിർത്തുന്നു.
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: നിനക്കു നീതിയായി കണക്കാക്കപ്പെടും
  rationale: צְדָקָה ദൈവസന്നിധിയിൽ ശരിയായതായി അംഗീകരിക്കപ്പെടുന്ന പ്രവൃത്തിയെയോ നീതിയെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘കണക്കാക്കപ്പെടും’ ഉപയോഗിച്ചെങ്കിലും പാദക്കുറിപ്പിൽ കൂടുതൽ ഔപചാരികമായ സാധ്യതകൾ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യപരമായ അർഥം ‘സന്നിധിയിൽ’ സംരക്ഷിക്കുന്നു; יהוה എന്ന ഉടമ്പടിനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ ആധുനിക മലയാളത്തിൽ അടുപ്പമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- issue: וּלְךָ תִּהְיֶה צְדָקָה എന്നതിലെ നീതി-കണക്കാക്കൽ ബന്ധം
  choice: നിനക്കു നീതിയായി കണക്കാക്കപ്പെടും
  alternative: അത് നിനക്കു നീതിയായിരിക്കും / അത് നിന്റെ നീതിപ്രവൃത്തിയായിരിക്കും
  rationale: വാക്യം ദൈവസന്നിധിയിലെ അംഗീകാരത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ‘നീതി’ ഒരു ഗുണമാണോ പ്രവൃത്തിയാണോ കണക്കാക്കപ്പെട്ട നിലയാണോ എന്ന് മൂലപാഠം പൂർണമായി നിർണ്ണയിക്കുന്നില്ല. മുഖ്യപാഠം സ്വാഭാവികമായ വായന നൽകുകയും പാദക്കുറിപ്പ് യഥാർഥ വ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് അത്യന്തം സാങ്കേതികമായ പദങ്ങൾ ഒഴിവാക്കി. കല്പനയിലെ ഊന്നലും ദൈവസന്നിധിയിലെ നീതിയെക്കുറിച്ചുള്ള അർഥവൈവിധ്യവും സംരക്ഷിച്ചു.
