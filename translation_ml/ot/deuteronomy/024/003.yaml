base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/003.yaml
  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: ml
  text: പിന്നത്തെ പുരുഷൻ അവളെ വെറുക്കുകയും[a], അവൾക്കായി വിവാഹമോചനപത്രം എഴുതി അവളുടെ കൈയിൽ കൊടുക്കുകയും അവളെ തന്റെ വീട്ടിൽനിന്ന് പറഞ്ഞയയ്ക്കുകയും ചെയ്താൽ, അല്ലെങ്കിൽ അവളെ ഭാര്യയായി സ്വീകരിച്ച ആ പിന്നത്തെ പുരുഷൻ മരിച്ചാൽ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവളെ വെറുക്കാൻ തുടങ്ങുകയും.’ എബ്രായത്തിലെ പൂർണക്രിയാരൂപം നിയമപരമായ സംഭവക്രമത്തിൽ ലളിതമായ ഭൂതകാലസദൃശമായി വിവർത്തനം ചെയ്യാം; സന്ദർഭത്തിൽ ഇതിന് ‘വെറുക്കാൻ തുടങ്ങുക’ എന്ന സൂക്ഷ്മതയും സാധ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: അവളെ വെറുക്കുകയും
  rationale: שׂנא എന്ന ക്രിയയുടെ ശക്തമായ അടിസ്ഥാനാർഥമായ ‘വെറുക്കുക’ നിലനിർത്തുന്നു; നിയമസന്ദർഭം കണക്കിലെടുത്ത് അതിനെ ‘ഇഷ്ടപ്പെടാതിരിക്കുക’ എന്നു മൃദൂകരിച്ചിട്ടില്ല.
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: പിന്നത്തെ പുരുഷൻ
  rationale: אַחֲרוֹן എന്നതിലെ ‘പിന്നത്തെ/അവസാനത്തെ’ എന്ന താരതമ്യാർഥം നിലനിർത്തുകയും ‘ഭർത്താവ്’ എന്ന സന്ദർഭസത്യമായെങ്കിലും മൂലപദത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: അവൾക്കായി വിവാഹമോചനപത്രം എഴുതി
  rationale: സֵפֶר כְּרִיתֻת എന്ന ഔപചാരിക വിവാഹബന്ധവിച്ഛേദരേഖയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וְנָתַן בְּיָדָהּ
  choice: അവളുടെ കൈയിൽ കൊടുക്കുകയും
  rationale: രേഖ നേരിട്ട് അവളുടെ കൈയിൽ ഏൽപ്പിക്കുന്ന നിയമനടപടിയുടെ മൂർത്തമായ ഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: അവളെ തന്റെ വീട്ടിൽനിന്ന് പറഞ്ഞയയ്ക്കുകയും
  rationale: שׁלח എന്നതിന്റെ അയച്ചുവിടൽ എന്ന അർഥവും מִבֵּיתוֹ എന്ന സ്ഥലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אוֹ כִי יָמוּת
  choice: അല്ലെങ്കിൽ ... മരിച്ചാൽ
  rationale: നിയമപരമായ ഉദാഹരണത്തിലെ മറ്റൊരു വ്യവസ്ഥയാണ് ഈ ഘടന അവതരിപ്പിക്കുന്നത്; അതിനാൽ ‘മരിച്ചാൽ’ അനുയോജ്യം.
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: അവളെ ഭാര്യയായി സ്വീകരിച്ച
  rationale: לקח + ל + אשה എന്ന വിവാഹസൂചക പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിലെ ‘ഭാര്യയായി എടുത്തു’ എന്ന ആശയം അനാവശ്യമായ കാഠിന്യമില്ലാതെ നിലനിർത്തുന്നു.
