  register: ആധുനികവും മാന്യവുമായ നിയമവിവരണശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘരേഖ നിലനിർത്തി. ‘വിവാഹമോചനപത്രം’ എന്നത് ഔപചാരിക രേഖയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
