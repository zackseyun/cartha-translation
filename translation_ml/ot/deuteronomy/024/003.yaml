  source_fidelity: 'പ്രധാനവാചകം എബ്രായത്തിലെ നിയമപരമായ സംഭവക്രമം വിശ്വസ്തമായി നൽകുന്നു: പിന്നത്തെ പുരുഷൻ അവളെ വെറുക്കുന്നു, വിവാഹമോചനരേഖ എഴുതി അവളുടെ കൈയിൽ കൊടുക്കുന്നു, വീട്ടിൽനിന്ന് അയയ്ക്കുന്നു; അല്ലെങ്കിൽ അവളെ ഭാര്യയായി സ്വീകരിച്ച ആ പുരുഷൻ മരിക്കുന്നു. ‘വിവാഹമോചനപത്രം,’ ‘കൈയിൽ കൊടുക്കുക,’ ‘വീട്ടിൽനിന്ന് പറഞ്ഞയയ്ക്കുക,’ ‘ഭാര്യയായി സ്വീകരിക്കുക’ എന്നിവ മൂലത്തിലെ അർഥവും നടപടിക്രമസ്വഭാവവും സംരക്ഷിക്കുന്നു.'
  naturalness: വാചകം ആധുനിക മാന്യമായ നിയമവിവരണശൈലിയിൽ സ്വാഭാവികമാണ്. ആവർത്തിച്ചുള്ള ‘ആ പിന്നത്തെ പുരുഷൻ’ എബ്രായത്തിലെ നിയമപരമായ തിരിച്ചറിയൽ വ്യക്തമായി നിലനിർത്തുന്നു. ദീർഘരേഖ അടുത്ത വാക്യത്തിലേക്കുള്ള തുടർച്ചയ്ക്കു യോജിക്കുന്നു.
