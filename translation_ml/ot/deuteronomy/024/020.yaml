  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമശൈലി ഉപയോഗിച്ചു. കൃഷിപ്രവൃത്തിയുടെ ദൃശ്യത നിലനിർത്തിക്കൊണ്ട് അപൂർവമായ פאר പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി; അതിന്റെ പദാർഥപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
