review_pass:
  verdict: revise
  source_fidelity: 'The verse is substantially faithful: it retains the temporal legal clause, the olive-harvest action, the prohibition on a second pass, and the three protected groups. However, ‘പരിശോധിക്കരുത്’ (‘do not inspect’) specifies an action not expressed by the Hebrew. The idiom is better represented by not going back over the branches. The main text also need not expand גֵּר with ‘your midst’; the cultural qualification belongs appropriately in the note.'
  naturalness: The Malayalam is clear and uses an appropriate formal legal register. ‘അതിന്റെ കൊമ്പുകളിലേക്കു വീണ്ടും പോകരുത്’ is more idiomatic and closer to the harvest image than ‘അതിന്റെ കൊമ്പുകൾ വീണ്ടും പരിശോധിക്കരുത്.’
  terminology: ‘ഒലിവുമരം,’ ‘തല്ലിക്കൊഴിക്കുമ്പോൾ,’ ‘പരദേശി,’ ‘അനാഥൻ,’ and ‘വിധവ’ are suitable modern-standard Malayalam renderings. The note on പരദേശി adequately explains the resident non-native sense without overloading the main text. ‘അനാഥൻ’ is natural; the footnote preserves the more specific ‘fatherless’ alternative.
  issues:
  - severity: medium
    issue: ‘അതിന്റെ കൊമ്പുകൾ വീണ്ടും പരിശോധിക്കരുത്’ adds ‘inspect’ as the prohibited action.
    rationale: לֹא תְפָאֵר אַחֲרֶיךָ prohibits going back over the tree/branches after the initial beating. ‘Inspect’ can imply merely looking rather than making a prohibited second harvesting pass.
  - severity: low
    issue: The main text expands גֵּר as ‘നിങ്ങളുടെ ഇടയിൽ താമസിക്കുന്ന പരദേശി.’
    rationale: This explanation is accurate in context but is not explicit in the verse itself and is already supplied by footnote b. A direct main-text rendering better preserves the Hebrew’s concise legal formulation.
  revised_text: നിങ്ങളുടെ ഒലിവുമരത്തിലെ കായ്കൾ തല്ലിക്കൊഴിക്കുമ്പോൾ, ശേഷിച്ചവ എടുക്കാൻ അതിന്റെ കൊമ്പുകളിലേക്കു വീണ്ടും പോകരുത്[a]. അവ പരദേശിക്കും[b], അനാഥനും[c], വിധവയ്ക്കും ഉള്ളതായിരിക്കണം.
