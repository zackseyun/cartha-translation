source:
  edition: WLC
  text: כִּ֤י תַחְבֹּט֙ זֵֽיתְ/ךָ֔ לֹ֥א תְפָאֵ֖ר אַחֲרֶ֑י/ךָ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: ml
  text: നിങ്ങളുടെ ഒലിവുമരത്തിലെ കായ്കൾ തല്ലിക്കൊഴിക്കുമ്പോൾ, ശേഷിച്ചവ എടുക്കാൻ അതിന്റെ കൊമ്പുകളിലേക്കു വീണ്ടും പോകരുത്[a]. അവ പരദേശിക്കും[b], അനാഥനും[c], വിധവയ്ക്കും ഉള്ളതായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ കടന്നുപോയശേഷം ശേഷിക്കുന്നവ മുഴുവനായി പറിച്ചെടുക്കരുത്”; അതായത്, ആദ്യം തല്ലിക്കൊഴിച്ചതിനുശേഷം ശേഷിച്ച ഒലിവുകൾ എടുക്കാൻ രണ്ടാമതും പോകരുത്.
    reason: lexical_alternative
  - marker: b
    text: “പരദേശി” എന്നത് ഇസ്രായേല്യരുടെ ഇടയിൽ പാർക്കുന്ന സ്വദേശിയല്ലാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “പിതാവില്ലാത്തവൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: —ക്കുമ്പോൾ
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ ഒരു പതിവുസാഹചര്യം അവതരിപ്പിക്കുന്ന കാലസൂചകപ്രയോഗമാണ്; വെറും സോപാധികമായ ‘എങ്കിൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികം.
- source_word: תַחְבֹּט
  choice: തല്ലിക്കൊഴിക്കുമ്പോൾ
  rationale: ഒലിവുകായ്കൾ താഴെ വീഴാൻ കൊമ്പുകൾ അടിക്കുന്ന വിളവെടുപ്പുരീതിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: זֵיתְךָ
  choice: നിങ്ങളുടെ ഒലിവുമരം
  rationale: זַיִת എന്നത് ഒലിവിനെയോ ഒലിവുമരത്തെയോ സൂചിപ്പിക്കാം; തല്ലുന്ന പ്രവൃത്തി ഇവിടെ മരത്തെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു. ഏകവചനവും രണ്ടാംപുരുഷ ഉടമസ്ഥതയും നിലനിർത്തുന്നു.
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: ശേഷിച്ചവ എടുക്കാൻ അതിന്റെ കൊമ്പുകൾ വീണ്ടും പരിശോധിക്കരുത്
  rationale: ആദ്യ വിളവെടുപ്പിനുശേഷം ശേഷിച്ച ഒലിവുകൾക്കായി രണ്ടാമതും കൊമ്പുകളിലൂടെ പോകുന്നത് വിലക്കുന്ന അപൂർവമായ വിളവെടുപ്പ് പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַגֵּר
  choice: നിങ്ങളുടെ ഇടയിൽ താമസിക്കുന്ന പരദേശിക്ക്
  rationale: גֵּר സ്വദേശിയല്ലെങ്കിലും ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും സന്ദർശകനെന്ന ധാരണ ഒഴിവാക്കി താമസക്കാരൻ എന്ന നിയമ-സാമൂഹിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לַיָּתוֹם
  choice: അനാഥന്
  rationale: യָתוֹם കുടുംബസംരക്ഷണം നഷ്ടപ്പെട്ട, പ്രത്യേകിച്ച് പിതാവില്ലാത്ത കുട്ടിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അനാഥൻ’ സ്വാഭാവികവും വ്യാപകമായി മനസ്സിലാക്കപ്പെടുന്നതുമാണ്.
- source_word: וְלָאַלְמָנָה
  choice: വിധവയ്ക്ക്
  rationale: അൽമാനാ എന്ന പദത്തിന്റെ സാധാരണവും കൃത്യവുമായ മലയാള തത്തുല്യം.
- source_word: יִהְיֶה
  choice: ഉള്ളതായിരിക്കണം
  rationale: ശേഷിച്ച കായ്കൾ ഈ ദുർബലവിഭാഗങ്ങൾക്കായി വിട്ടുകൊടുക്കണമെന്ന നിയമപരമായ അവകാശനിർണ്ണയം പ്രകടിപ്പിക്കുന്നു.
