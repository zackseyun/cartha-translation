  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי תַשֶּׁ֥ה בְ/רֵֽעֲ/ךָ מַשַּׁ֣את מְא֑וּמָה לֹא תָבֹ֥א אֶל בֵּית֖/וֹ לַ/עֲבֹ֥ט עֲבֹטֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/010.yaml
  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: ml
  text: നീ നിന്റെ അയൽക്കാരന് എന്തെങ്കിലും കടമായി കൊടുക്കുമ്പോൾ[a], അവന്റെ പണയവസ്തു എടുക്കാൻ അവന്റെ വീട്ടിൽ കടക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നീ നിന്റെ അയൽക്കാരന് എന്തെങ്കിലും കടമായി കൊടുക്കുന്നെങ്കിൽ, അവൻ പണയമായി വെച്ചത് എടുക്കാൻ അവന്റെ വീട്ടിൽ കടക്കരുത്.”'
    reason: כִּי എന്ന പദത്തിന് ഇവിടെ ‘എപ്പോൾ/പോൾ’ എന്നും ‘എങ്കിൽ’ എന്നും ഗ്രഹിക്കാവുന്ന നിയമസാഹചര്യപരമായ അർഥമുണ്ട്; עֲבֹטוֹ ‘അവന്റെ പണയവസ്തു’ എന്നും ‘അവൻ പണയമായി വെച്ചത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: כִּי
  choice: കൊടുക്കുമ്പോൾ
  rationale: ഇവിടെ כִּי ഒരു വ്യവസ്ഥാധിഷ്ഠിത നിയമസാഹചര്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കൊടുക്കുമ്പോൾ’ സ്വാഭാവികമാണ്; ‘കൊടുക്കുന്നെങ്കിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תַשֶּׁה ... מַשַּׁאת מְאוּמָה
  choice: എന്തെങ്കിലും കടമായി കൊടുക്കുക
  rationale: നשה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും അതോടു ബന്ധമുള്ള מַשַּׁאת എന്ന നാമവും കടം കൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; מְאוּמָה ‘എന്തെങ്കിലും’ എന്ന വ്യാപ്തി നൽകുന്നു.
- source_word: בְרֵעֲךָ
  choice: നിന്റെ അയൽക്കാരന്
  rationale: רֵעַ ഇവിടെ സമൂഹത്തിലെ സഹാംഗത്തെയോ അടുത്തയാളെയോ സൂചിപ്പിക്കുന്നു. ‘അയൽക്കാരൻ’ പരിചിതവും പ്രസക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: לֹא תָבֹא אֶל בֵּיתוֹ
  choice: അവന്റെ വീട്ടിനകത്ത് കടക്കരുത്
  rationale: നിയമസന്ദർഭത്തിലെ לֹא സഹിതമുള്ള അപൂർണക്രിയ നിരോധനത്തെ സൂചിപ്പിക്കുന്നു. ‘കടക്കരുത്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לַעֲבֹט עֲבֹטוֹ
  choice: പണയവസ്തു വാങ്ങാൻ
  rationale: עבט എന്ന ധാതുവും അതിന്റെ നാമരൂപവും കടത്തിന് ഈടായി വെച്ച വസ്തു കൈപ്പറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പണയവസ്തു’ എന്നത് സാധാരണ വായനക്കാർക്ക് ‘പണയം’ എന്ന നിയമാർഥം വ്യക്തമാക്കുന്നു; ബലമായി പിടിച്ചെടുക്കുന്നു എന്ന അധികധ്വനി ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമോപദേശ ശൈലി. ‘നീ’ എന്ന ഏകവചന അഭിസംബോധന എബ്രായരൂപത്തോട് യോജിക്കുന്നു. മുഖ്യവാക്യത്തിലെ [a] അടിക്കുറിപ്പ് വ്യവസ്ഥാസൂചകമായ വ്യത്യസ്ത വായനയും പണയപദത്തിന്റെ പര്യായാവിഷ്കാരവും സംരക്ഷിക്കുന്നു.
