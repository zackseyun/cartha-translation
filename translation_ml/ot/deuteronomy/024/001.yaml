  to: ഒരു പുരുഷൻ ഒരു സ്ത്രീയെ ഭാര്യയായി സ്വീകരിച്ച് അവളെ വിവാഹം കഴിച്ചശേഷം, അവളിൽ ലജ്ജാകരമായ ഒരു കാര്യം[a] കണ്ടെത്തിയതിനാൽ അവൾക്ക് അവന്റെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കാതിരുന്നാൽ, അവൻ അവൾക്കായി വിവാഹമോചനപത്രം എഴുതി അവളുടെ കൈയിൽ കൊടുത്ത് അവളെ തന്റെ വീട്ടിൽനിന്ന് അയച്ചുവിടുകയും ചെയ്താൽ,
