  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: ml
  text: ഒരു പുരുഷൻ ഒരു സ്ത്രീയെ ഭാര്യയായി സ്വീകരിച്ച് അവളെ വിവാഹം കഴിച്ചശേഷം, അവളിൽ ലജ്ജാകരമായ ഒരു കാര്യം[a] കണ്ടെത്തിയതിനാൽ അവൾക്ക് അവന്റെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കാതിരുന്നാൽ, അവൻ അവൾക്കായി വിവാഹമോചനപത്രം എഴുതി അവളുടെ കൈയിൽ കൊടുത്ത് അവളെ തന്റെ വീട്ടിൽനിന്ന് അയച്ചുവിടുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അശോഭനമായ ഒരു കാര്യം” അല്ലെങ്കിൽ “ലജ്ജാകരമായ എന്തെങ്കിലും.” എബ്രായപ്രയോഗം മനഃപൂർവം അവ്യക്തമാണ്; അതിന് ഒന്നിലധികം വ്യാഖ്യാനങ്ങൾ നൽകിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ഒരു പുരുഷൻ ... എങ്കിൽ
  rationale: ഇത് കാരണവാക്യമല്ല, തുടർന്നുള്ള വാക്യങ്ങളിലേക്കും നീളുന്ന വ്യവസ്ഥാപരമായ നിയമസാഹചര്യത്തിന്റെ ആരംഭമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായി വ്യവസ്ഥ സൂചിപ്പിക്കാൻ വാക്യാവസാനത്തിലെ ‘എങ്കിൽ’ ഘടന ഉപയോഗിച്ചു.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: ഒരു പുരുഷൻ ഒരു സ്ത്രീയെ ഭാര്യയായി സ്വീകരിച്ച്
  rationale: ‘ഒരു ഭാര്യയെ എടുക്കുക’ എന്ന അക്ഷരാർഥപ്രയോഗം ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികവും തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതുമാണ്; വിവാഹബന്ധത്തിലേക്കുള്ള പ്രവേശനം വ്യക്തമാക്കുന്ന സ്വാഭാവിക സമാനപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: וּבְעָלָהּ
  choice: അവളുമായി ദാമ്പത്യബന്ധത്തിൽ ഏർപ്പെട്ടശേഷം
  rationale: בעל എന്ന ക്രിയ ഇവിടെ ഭർത്താവെന്ന നിലയിൽ വിവാഹബന്ധം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉടമയാകുക’ പോലുള്ള തെറ്റിദ്ധരിപ്പിക്കുന്ന അർഥം ഒഴിവാക്കി, വിവാഹം യാഥാർഥ്യമായതിനെ വ്യക്തമായി പ്രകടിപ്പിച്ചു.
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: അവൾക്ക് അവന്റെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കാതിരുന്നാൽ
  rationale: ‘കണ്ണുകളിൽ കൃപ കണ്ടെത്തുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപഭാവം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ മനസ്സിലാകുന്ന രീതിയിൽ നൽകി.
- source_word: עֶרְוַת דָּבָר
  choice: എന്തെങ്കിലും ലജ്ജാകരമായ കാര്യം
  rationale: ഈ ദുഷ്കരമായ പ്രയോഗം നിർവചിക്കാത്തതും ഒന്നിലധികം വ്യാഖ്യാനങ്ങൾക്ക് ഇടനൽകുന്നതുമാണ്. പ്രത്യേക കുറ്റമോ ലൈംഗിക പാപമോ എന്ന് നിശ്ചയിക്കാതെ അതിന്റെ അവ്യക്തത നിലനിർത്തി.
- source_word: סֵפֶר כְּרִיתֻת
  choice: വിവാഹമോചനപത്രം
  rationale: വിവാഹബന്ധം ഔപചാരികമായി അവസാനിപ്പിക്കുന്ന നിയമരേഖയാണ് ഉദ്ദേശിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദം ഉപയോഗിച്ചു.
- source_word: וְנָתַן בְּיָדָהּ
  choice: അവളുടെ കൈയിൽ കൊടുത്ത്
  rationale: രേഖ നേരിട്ട് അവൾക്കു കൈമാറുന്ന നടപടിക്രമത്തിന്റെ മൂർത്തത നിലനിർത്തുന്നു.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: അവളെ തന്റെ വീട്ടിൽനിന്ന് പറഞ്ഞയയ്ക്കുകയും
  rationale: അയച്ചുവിടൽ എന്ന നിയമപരവും സ്ഥലപരവുമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകി; തുടർന്നുവരുന്ന വ്യവസ്ഥകളോട് വാക്യം ബന്ധിപ്പിക്കുന്നതിനായി ‘-ുകയും’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ഈ വാക്യം വിവാഹമോചനത്തിനുള്ള കല്പനയാണോ, അതോ ഒരു നിയമസാഹചര്യത്തിന്റെ പ്രാരംഭ വ്യവസ്ഥയാണോ
  choice: വിവാഹമോചനത്തെ അംഗീകരിക്കുന്ന കല്പനയായി അല്ല, 24:1–4 വരെ നീളുന്ന വ്യവസ്ഥാപരമായ നിയമസാഹചര്യത്തിന്റെ ആരംഭമായി വിവർത്തനം ചെയ്തു
  alternative: ചില വിവർത്തനങ്ങൾ ഇതിനെ ചില സാഹചര്യങ്ങളിൽ വിവാഹമോചനം നടത്താനുള്ള സ്വതന്ത്ര നിർദേശമായി തോന്നിപ്പിക്കാം
  rationale: എബ്രായ വാക്യഘടനയിൽ ഒന്നാം വാക്യം ഉപാധികളുടെ തുടക്കമാണ്; മുഖ്യമായ നിയമനിരോധനം പിന്നീടാണ് വരുന്നത്. അതിനാൽ ഈ വാക്യത്തിന്റെ അവസാനം പൂർണവിരാമം നൽകാതെ ‘-ുകയും’ ഉപയോഗിച്ച് അപൂർണമായ വ്യവസ്ഥ നിലനിർത്തി.
- issue: עֶרְוַת דָּבָר എന്ന പ്രയോഗത്തിന്റെ കൃത്യമായ പരിധി
  choice: ‘എന്തെങ്കിലും ലജ്ജാകരമായ കാര്യം’ എന്ന് അവ്യക്തമായി നിലനിർത്തി
  alternative: ‘അശ്ലീലത’, ‘ലൈംഗിക അധാർമികത’, അല്ലെങ്കിൽ ഒരു നിർദിഷ്ട കുറ്റം എന്ന് പരിധി ചുരുക്കുക
  rationale: മൂലപ്രയോഗം തന്നെ അർഥപരമായി വിവാദപരവും അവ്യക്തവുമാണ്. ഏതെങ്കിലും പ്രത്യേക മതശാസ്ത്ര വ്യാഖ്യാനം പാഠത്തിൽ ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ വിശാലമായ പ്രയോഗവും അടിക്കുറിപ്പും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമവാക്യത്തിന്റെ ദീർഘമായ വ്യവസ്ഥാസ്വഭാവം നിലനിർത്തിയെങ്കിലും അക്ഷരാർഥപരമായ അസ്വാഭാവികത ഒഴിവാക്കി. ‘വിവാഹമോചനപത്രം’ പോലുള്ള പരിചിതമായ ഔപചാരിക പദാവലി ഉപയോഗിച്ചു.
