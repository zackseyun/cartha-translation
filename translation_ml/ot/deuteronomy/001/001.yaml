id: DEU.1.1
reference: Deuteronomy 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֤ר מֹשֶׁה֙ אֶל כָּל יִשְׂרָאֵ֔ל בְּ/עֵ֖בֶר הַ/יַּרְדֵּ֑ן בַּ/מִּדְבָּ֡ר בָּֽ/עֲרָבָה֩ מ֨וֹל ס֜וּף בֵּֽין פָּארָ֧ן וּ/בֵֽין תֹּ֛פֶל וְ/לָבָ֥ן וַ/חֲצֵרֹ֖ת וְ/דִ֥י זָהָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: ml
  text: യോർദ്ദാന്റെ അക്കരെ[a], മരുഭൂമിയിൽ, അരാബയിൽ[b], സൂഫിന്[c] എതിർവശത്ത്, പാരാൻ, തോഫെൽ, ലാബാൻ, ഹസേരോത്ത്, ദീസാഹാബ് എന്നിവയ്ക്കിടയിൽ മോശെ ഇസ്രായേലിനോടാകെ പറഞ്ഞ വാക്കുകൾ ഇവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യോർദ്ദാന്റെ മറുകരയിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പ്രയോഗം ഏത് ഭൂമിശാസ്ത്രദൃഷ്ടികോണത്തിൽനിന്നാണ് പറയുന്നതെന്ന് സ്വതവേ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: “അരാബ” യോർദ്ദാൻ താഴ്‌വരയുൾപ്പെടുന്ന ഭ്രംശതാഴ്‌വര/സമതല മേഖലയെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രനാമമാണ്; “സമതലത്തിൽ” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: cultural_note
  - marker: c
    text: ഹീബ്രുവിൽ “സൂഫ്.” ചിലർ ഇതിനെ ഒരു സ്ഥലപ്പേരായി മനസ്സിലാക്കുന്നു; മറ്റുചിലർ അതിനെ “ഞാങ്ങണക്കടൽ” എന്നതുമായി ബന്ധിപ്പിക്കുന്നു. എന്നാൽ ഇവിടെ “കടൽ” എന്ന പദം ഇല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: വചനങ്ങൾ ഇവയാണ്
  rationale: ഗ്രന്ഥാരംഭത്തിലെ അവതരണഭാവം നിലനിർത്തുന്നു. ഇവിടെ דְּבָרִים മോശെയുടെ പ്രസംഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘കാര്യങ്ങൾ’ എന്നതിനെക്കാൾ ‘വചനങ്ങൾ’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: മോശെ ... സംസാരിച്ച
  rationale: דבר എന്ന ക്രിയയുടെ ഔപചാരിക പ്രസംഗഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേലിനോടും
  rationale: ജനസമൂഹമായ ഇസ്രായേലിന്റെ സമഗ്രത സൂചിപ്പിക്കുന്ന כָּל കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെ
  rationale: നദിയുടെ മറുകരയിലുള്ള പ്രദേശം എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥം നിലനിർത്തുന്നു; ദൃഷ്ടികോണം മൂലപാഠത്തിൽ നിർണയിച്ചിട്ടില്ല.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: ജനവാസം കുറഞ്ഞ വന്യപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന מקראപരമായ ഉപയോഗത്തിന് മലയാളത്തിൽ പതിവും ഗ്രാഹ്യവുമായ പദം.
- source_word: בָּעֲרָבָה
  choice: അരാബയിൽ
  rationale: പൊതുവായ ‘സമതലം’ എന്നതിലുപരി പ്രത്യേക ഭൂമിശാസ്ത്രപ്രദേശത്തിന്റെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מוֹל סוּף
  choice: സൂഫിന് എതിർവശത്ത്
  rationale: מוֹל എന്നതിന്റെ സ്ഥാനബന്ധം നൽകുന്നു. יַם ഇല്ലാത്തതിനാൽ ‘ഞാങ്ങണക്കടൽ’ എന്ന് വികസിപ്പിക്കാതെ סוּף സ്ഥലപ്പേരായി നിലനിർത്തുന്നു.
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: പാരാൻ, തോഫെൽ, ലാബാൻ, ഹസേരോത്ത്, ദീസാഹാബ് എന്നിവയ്ക്കിടയിൽ
  rationale: എല്ലാ സ്ഥലപ്പേരുകളും സംരക്ഷിച്ച്, ഹീബ്രു പട്ടികയുടെ അർഥം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകുന്നു.
