translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. ദീർഘമായ സ്ഥലനിർദേശങ്ങൾ വായിക്കാൻ എളുപ്പമാക്കാൻ മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു; സ്ഥലപ്പേരുകൾ മൂലഭാഷയെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
