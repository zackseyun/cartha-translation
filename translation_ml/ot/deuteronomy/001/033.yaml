  text: הַ/הֹלֵ֨ךְ לִ/פְנֵי/כֶ֜ם בַּ/דֶּ֗רֶךְ לָ/ת֥וּר לָ/כֶ֛ם מָק֖וֹם לַֽ/חֲנֹֽתְ/כֶ֑ם בָּ/אֵ֣שׁ לַ֗יְלָה לַ/רְאֹֽתְ/כֶם֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וּ/בֶ/עָנָ֖ן יוֹמָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: ml
  text: നിങ്ങൾക്കു പാളയമിറങ്ങാൻ ഒരു സ്ഥലം അന്വേഷിച്ചുകണ്ടെത്താൻ വഴിയിൽ നിങ്ങൾക്കു മുമ്പായി നടന്നവൻ, നിങ്ങൾ പോകേണ്ട വഴി[b] കാണിച്ചുതരാൻ രാത്രിയിൽ തീയിലും പകൽ മേഘത്തിലും നടന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: ‘രാത്രിയിൽ തീയിലും പകൽ മേഘത്തിലും നിങ്ങൾക്കു മുമ്പായി നടന്നു.’'
    reason: syntactic_clarity
  - marker: b
    text: 'അക്ഷരാർത്ഥത്തിൽ: ‘നിങ്ങൾ സഞ്ചരിക്കുമായിരുന്ന വഴിയിൽ നിങ്ങളെ കാണിക്കാനായി.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: നടന്നവൻ
  rationale: Qal participle ഇവിടെ മുൻവാക്യത്തിലെ യഹോവയെ തുടർന്നു വിശേഷിപ്പിക്കുന്ന നാമസദൃശ പ്രയോഗമാണ്. വിവരണത്തിന്റെ ഭൂതകാലസന്ദർഭത്തിൽ ‘നടന്നവൻ’ സ്വാഭാവികവും ബന്ധം നിലനിർത്തുന്നതുമാണ്.
- source_word: לִפְנֵיכֶם
  choice: നിങ്ങൾക്കു മുമ്പായി
  rationale: ജനത്തെ നയിച്ചുകൊണ്ട് അവരുടെ മുന്നിൽ സഞ്ചരിച്ചതെന്ന സ്ഥലസംബന്ധമായ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: לָתוּר
  choice: അന്വേഷിച്ചറിയേണ്ടതിന്
  rationale: യോഗ്യമായ സ്ഥലം കണ്ടെത്താനായി അന്വേഷിക്കുക/പരിശോധിക്കുക എന്ന תור-ന്റെ അർഥം നൽകുന്നു; സൈനികഭാവമുള്ള പദം ഒഴിവാക്കുന്നു.
- source_word: מָקוֹם לַחֲנֹתְכֶם
  choice: നിങ്ങൾക്കു പാളയമിറങ്ങാൻ ഒരു സ്ഥലം
  rationale: חנה-യുടെ യാത്രാസന്ദർഭത്തിലുള്ള അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בָּאֵשׁ לַיְלָה
  choice: രാത്രിയിൽ തീയിൽ
  rationale: ദൈവിക മാർഗനിർദേശത്തിന്റെ ദൃശ്യരൂപം സൂചിപ്പിക്കുന്ന ഹീബ്രു ഘടനയോട് അടുത്തുനിൽക്കുന്നു.
- source_word: לַרְאֹתְכֶם
  choice: നിങ്ങൾക്കു കാണിച്ചുതരാൻ
  rationale: ראה എന്ന ക്രിയയുടെ Hiphil കാരകഭാവം സന്ദർഭോചിതമായി ‘കാണിച്ചുതരുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: നിങ്ങൾ പോകേണ്ട വഴി
  rationale: അവർ സഞ്ചരിക്കാനുള്ള വഴിയെ ദൈവം കാണിച്ചുകൊടുത്തുവെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ഇത് വെറും നൈതിക ബാധ്യതയായി ചുരുക്കുന്നില്ല.
- source_word: וּבֶעָנָן יוֹמָם
  choice: പകൽ മേഘത്തിൽ
  rationale: മരുഭൂമിയാത്രയിലെ പരിചിതമായ ദൈവിക സാന്നിധ്യരൂപത്തെ സൂചിപ്പിക്കുന്നു; മുൻപുള്ള ‘തീയിൽ’ എന്നതിനോടുള്ള സമാന്തരത കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: വാക്യത്തിന്റെ കർത്താവ് മുൻവാക്യത്തിലെ യഹോവയാണെന്ന തിരിച്ചറിവ്
  choice: ‘നടന്നവൻ’ എന്ന ബന്ധിത വിവരണം നിലനിർത്തി; ഈ വാക്യത്തിൽ ‘യഹോവ’ എന്നു പുതുതായി ചേർത്തില്ല.
  alternative: വ്യക്തതയ്ക്കായി ‘യഹോവ നിങ്ങൾക്കു മുമ്പായി നടന്നു’ എന്നു കർത്താവിനെ ആവർത്തിക്കുക.
  rationale: ഹീബ്രു വാക്യം മുൻവാക്യത്തെ വ്യാകരണപരമായി ആശ്രയിക്കുന്നു. ചേർക്കാത്ത ദൈവനാമം ഇവിടെ ഉൾപ്പെടുത്താതെ ആ ബന്ധം സംരക്ഷിക്കുന്നു.
- issue: തീയും മേഘവും ദൈവത്തിന്റെ സാന്നിധ്യരൂപങ്ങളായി അവതരിപ്പിക്കൽ
  choice: ‘തീയിൽ… മേഘത്തിൽ ഉണ്ടായിരുന്നു’ എന്ന രൂപത്തിൽ ദൈവിക കർത്താവുമായുള്ള ബന്ധം വ്യക്തമാക്കി.
  alternative: ‘തീയാൽ… മേഘത്താൽ’ എന്ന് ഉപകരണാർഥത്തിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: בְ എന്ന ഉപസർഗം മാധ്യമം, രൂപം, അല്ലെങ്കിൽ സാന്നിധ്യസ്ഥലം എന്നീ സൂക്ഷ്മതകൾ അനുവദിക്കുന്നു. ‘തീയിൽ/മേഘത്തിൽ’ എന്നത് ഈ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന സ്വഭാവം നിലനിർത്തിയിട്ടുണ്ട്. ‘പാളയമിറങ്ങുക’ യാത്രാസന്ദർഭത്തിന് വ്യക്തമായ പൊതുവായ പദമായി തെരഞ്ഞെടുത്തു; ‘തീയിൽ/മേഘത്തിൽ’ എന്ന രൂപം ഹീബ്രുവിലെ ഉദ്ദേശ്യപൂർവമായ സംക്ഷിപ്തത സംരക്ഷിക്കുന്നു.
