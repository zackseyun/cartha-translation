source:
  edition: WLC
  text: וְ/אַתֶּ֖ם פְּנ֣וּ לָ/כֶ֑ם וּ/סְע֥וּ הַ/מִּדְבָּ֖רָ/ה דֶּ֥רֶךְ יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/040.yaml
  text: But as for you[a], turn yourselves around and set out for the wilderness by the way of the Red Sea.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളോ, തിരിഞ്ഞ് ചെങ്കടലിലേക്കുള്ള[a] വഴിയിലൂടെ മരുഭൂമിയിലേക്കു പുറപ്പെടുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പദശഃ: ‘ഞാങ്ങണക്കടൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: എന്നാൽ നിങ്ങളോ
  rationale: മുൻവിധിയോടുള്ള വൈരുധ്യവും സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: פְּנוּ לָכֶם
  choice: തിരിഞ്ഞ്
  rationale: ദിശ മാറ്റാനുള്ള കല്പനയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. לָכֶם നൽകുന്ന ആത്മനിർദ്ദേശഭാവം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ ഉൾക്കൊള്ളുന്നു; ‘തിരിഞ്ഞുപോകുക’ എന്നു പറഞ്ഞ് ‘പിന്നോട്ട്’ എന്ന ആശയം അധികമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וּסְעוּ
  choice: പുറപ്പെടുക
  rationale: נסע ഇവിടെ പാളയം വിട്ട് യാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെടുക’ ആ യാത്രാകല്പന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַמִּדְבָּרָה
  choice: മരുഭൂമിയിലേക്കു
  rationale: ദിശാസൂചകമായ ה-യെ ലക്ഷ്യത്തിലേക്കുള്ള ചലനമായി, പ്രവേശനം അതിയായി നിർണ്ണയിക്കാതെ, വ്യക്തമാക്കുന്നു.
- source_word: דֶּרֶךְ
  choice: വഴിയിലൂടെ
  rationale: യാത്രയുടെ പാതയെയോ മാർഗത്തെയോ സൂചിപ്പിക്കുന്ന דרך എന്ന പദത്തിന്റെ സന്ദർഭോചിത അർഥം നൽകുന്നു.
- source_word: יַם סוּף
  choice: ചെങ്കടൽ
  rationale: പരമ്പരാഗതവും പൊതുവായി തിരിച്ചറിയപ്പെടുന്നതുമായ ഭൂമിശാസ്ത്രനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
