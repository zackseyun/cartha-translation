source:
  edition: WLC
  text: וַ/יֵּצֵ֨א הָ/אֱמֹרִ֜י הַ/יֹּשֵׁ֨ב בָּ/הָ֤ר הַ/הוּא֙ לִ/קְרַאתְ/כֶ֔ם וַ/יִּרְדְּפ֣וּ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֥ר תַּעֲשֶׂ֖ינָה הַ/דְּבֹרִ֑ים וַֽ/יַּכְּת֥וּ אֶתְ/כֶ֛ם בְּ/שֵׂעִ֖יר עַד חָרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: ml
  text: അപ്പോൾ ആ മലനാട്ടിൽ താമസിച്ചിരുന്ന അമോര്യർ[a] നിങ്ങളെ നേരിടാൻ പുറത്തുവന്നു; തേനീച്ചകൾ ചെയ്യുന്നതുപോലെ അവർ നിങ്ങളെ പിന്തുടർന്നു, സേയീരിൽ ഹോർമാവരെ നിങ്ങളെ അടിച്ചുവീഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അമോര്യൻ’; എബ്രായത്തിൽ ഏകവചനം ഒരു ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ക്രിയകൾ ബഹുവചനത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടുവന്നു
  rationale: יצא എന്ന ആഖ്യാനക്രിയ ശത്രുക്കൾ തങ്ങളുടെ പ്രദേശത്തുനിന്ന് ഇസ്രായേലിനെ നേരിടാൻ വന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടുവന്നു’ ദിശാബോധവും ചലനവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യർ
  rationale: രൂപത്തിൽ ഏകവചനമാണെങ്കിലും തുടർന്നുള്ള ക്രിയകൾ ബഹുവചനമായതിനാൽ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സമാഹാരപ്രയോഗമായി പരിഭാഷപ്പെടുത്തി.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: ആ മലനാട്ടിൽ താമസിച്ചിരുന്ന
  rationale: יֹשֵׁב സ്ഥിരവാസത്തെ സൂചിപ്പിക്കുന്നു. הַר ഇവിടെ ഒറ്റ മലയേക്കാൾ വിശാലമായ മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ ‘മലനാട്’ തിരഞ്ഞെടുത്തു.
- source_word: לִקְרַאתְכֶם
  choice: നിങ്ങളെ നേരിടാൻ
  rationale: לקראת എന്നതിന്റെ അടിസ്ഥാനമായ ‘എതിരേൽക്കുക/കണ്ടുമുട്ടുക’ എന്ന അർഥം ശത്രുതാപരമായ സന്ദർഭത്തിൽ ‘നേരിടാൻ’ എന്ന് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: അവർ നിങ്ങളെ പിന്തുടർന്നു
  rationale: רדף സൈനികസന്ദർഭത്തിലെ പിന്തുടരലിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: തേനീച്ചകൾ ചെയ്യുന്നതുപോലെ
  rationale: എബ്രായത്തിലെ സജീവവും സംക്ഷിപ്തവുമായ ഉപമയെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: നിങ്ങളെ അടിച്ചുവീഴ്ത്തി
  rationale: כתת എന്ന ക്രിയയിലെ ശക്തമായ പ്രഹരത്തിന്റെയും പരാജയപ്പെടുത്തലിന്റെയും ഭാവം ഉൾക്കൊള്ളുന്നു; ‘തകർത്തു’ എന്നതിലേക്കുള്ള അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: בְּשֵׂעִיר עַד חָרְמָה
  choice: സേയീരിൽ ഹോർമാവരെ
  rationale: בְּ സ്ഥലം/മേഖലയും עַד ഭൂമിശാസ്ത്രപരമായ പരിധിയും സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ ഘടനയും സാധ്യതയുള്ള ബന്ധവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘മലനാട്’, ‘നേരിടാൻ’, ‘അടിച്ചുവീഴ്ത്തി’ എന്നിവ സ്വാഭാവികതയും മൂലപാഠത്തിന്റെ ദൃശ്യതയും ഒരുമിച്ച് നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
