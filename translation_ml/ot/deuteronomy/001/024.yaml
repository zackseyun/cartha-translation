  text: וַ/יִּפְנוּ֙ וַ/יַּעֲל֣וּ הָ/הָ֔רָ/ה וַ/יָּבֹ֖אוּ עַד נַ֣חַל אֶשְׁכֹּ֑ל וַֽ/יְרַגְּל֖וּ אֹתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/024.yaml
  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: ml
  text: അങ്ങനെ അവർ തിരിഞ്ഞ് മലനാട്ടിലേക്കു കയറിച്ചെന്ന്, എശ്കോൽ താഴ്‌വര[a] വരെ എത്തി ആ പ്രദേശം ഒറ്റുനോക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എശ്കോൽ വാദി” അല്ലെങ്കിൽ “എശ്കോൽ തോട്”; എബ്രായപദം കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന ഒരു താഴ്‌വരയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: അവർ തിരിഞ്ഞ്
  rationale: פנה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ചലനാർഥമായ ‘തിരിയുക’ ആഖ്യാനക്രമത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיַּעֲלוּ
  choice: കയറിച്ചെന്ന്
  rationale: עלה സൂചിപ്പിക്കുന്ന ഉയരത്തിലേക്കുള്ള നീക്കം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഭൂപ്രദേശത്തിലേക്കുള്ള യാത്രയെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: הָהָרָה
  choice: മലനാട്ടിലേക്ക്
  rationale: ദിശാസൂചക പ്രത്യയം മലപ്രദേശത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു. ‘മലനാട്’ ഇവിടെ ഒറ്റമലയെക്കാൾ വിശാലമായ ഭൂപ്രദേശത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיָּבֹאוּ עַד
  choice: വരെ എത്തി
  rationale: בוא + עַד എന്ന ഘടനയിലെ ഒരു നിർദിഷ്ട സ്ഥാനത്തോളം ചെന്നെത്തിയെന്ന അതിർത്തിനുവാൻസ് സംരക്ഷിക്കുന്നു.
- source_word: נַחַל אֶשְׁכֹּל
  choice: എശ്കോൽ താഴ്‌വര
  rationale: נַחַל താഴ്‌വര, വാദി, തോട് എന്നീ അർഥങ്ങൾ വഹിക്കാം. സ്ഥലനാമത്തിൽ ‘താഴ്‌വര’ വ്യക്തവും സ്വാഭാവികവുമാണ്; ജലപാതസംബന്ധിയായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיְרַגְּלוּ
  choice: ഒറ്റുനോക്കി
  rationale: רגל എന്ന പിയേൽ രൂപത്തിന്റെ ചാരപരിശോധനയുടെയും രഹസ്യനിരീക്ഷണത്തിന്റെയും ഭാവം, വെറും ‘പരിശോധിച്ചു’ എന്നതിനെക്കാൾ വ്യക്തമായി നൽകുന്നു.
- source_word: אֹתָהּ
  choice: ആ പ്രദേശം
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം സന്ദർഭത്തിലെ ദേശത്തെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ അതിന്റെ സൂചിത antecedent സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
