translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഭൂപ്രദേശസംബന്ധിയായ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകി; മൂലത്തിലെ ചാരപരിശോധനയുടെ നുവാൻസ് ‘ഒറ്റുനോക്കി’ എന്നതിലൂടെ നിലനിർത്തി.
