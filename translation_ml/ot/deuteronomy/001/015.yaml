source:
  edition: WLC
  text: וָ/אֶקַּ֞ח אֶת רָאשֵׁ֣י שִׁבְטֵי/כֶ֗ם אֲנָשִׁ֤ים חֲכָמִים֙ וִֽ/ידֻעִ֔ים וָ/אֶתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עֲלֵי/כֶ֑ם שָׂרֵ֨י אֲלָפִ֜ים וְ/שָׂרֵ֣י מֵא֗וֹת וְ/שָׂרֵ֤י חֲמִשִּׁים֙ וְ/שָׂרֵ֣י עֲשָׂרֹ֔ת וְ/שֹׁטְרִ֖ים לְ/שִׁבְטֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: ml
  text: അങ്ങനെ ഞാൻ നിങ്ങളുടെ ഗോത്രത്തലവന്മാരായ, ജ്ഞാനികളും അറിവുള്ളവരുമായ[a] പുരുഷന്മാരെ എടുത്ത് നിങ്ങളുടെ മേൽ തലവന്മാരായി നിയമിച്ചു—ആയിരങ്ങൾക്കു മേലുള്ള നേതാക്കൾ, നൂറുകൾക്കു മേലുള്ള നേതാക്കൾ, അമ്പതുകൾക്കു മേലുള്ള നേതാക്കൾ, പത്തുകൾക്കു മേലുള്ള നേതാക്കൾ, നിങ്ങളുടെ ഗോത്രങ്ങൾക്കായുള്ള ഉദ്യോഗസ്ഥർ എന്നിങ്ങനെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അറിയപ്പെടുന്നവർ.” ഹീബ്രു പദത്തിന് അറിയപ്പെടുന്നവർ അല്ലെങ്കിൽ അംഗീകരിക്കപ്പെട്ടവർ എന്ന അർഥവും വരാം; എന്നാൽ ഇവിടെ അറിവോ വിവേചനശേഷിയോ ഉള്ള പുരുഷന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത് എന്നതാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: അങ്ങനെ ഞാൻ ... തിരഞ്ഞെടുത്ത്
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അങ്ങനെ’ സ്വാഭാവികമായ ക്രമം നൽകുന്നു. לקח ഇവിടെ നേതൃത്വത്തിനായി ആളുകളെ സ്വീകരിക്കുന്ന/തിരഞ്ഞെടുക്കുന്ന പ്രവൃത്തിയായതിനാൽ ‘തിരഞ്ഞെടുത്ത്’ സന്ദർഭാനുസൃതമാണ്.
- source_word: רָאשֵׁי שִׁבְטֵיכֶם
  choice: നിങ്ങളുടെ ഗോത്രത്തലവന്മാരായ
  rationale: ഭരണപരമായ സാഹചര്യത്തിലെ רֹאשׁ ഒരു സാമൂഹിക ഘടകത്തിന്റെ തലപ്പത്തുള്ളവരെ സൂചിപ്പിക്കുന്നു; ‘ഗോത്രത്തലവന്മാർ’ ഹീബ്രു രൂപകവും പദത്തിന്റെ ഔദ്യോഗിക ഭാവവും നിലനിർത്തുന്നു.
- source_word: אֲנָשִׁים
  choice: പുരുഷന്മാരെ
  rationale: ഹീബ്രു പദം ഇവിടെ വ്യാകരണപരമായും പദാർഥപരമായും പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗനിഷ്പക്ഷമാക്കാതെ പരിഭാഷപ്പെടുത്തി.
- source_word: חֲכָמִים
  choice: ജ്ഞാനികളും
  rationale: നേതൃത്വത്തിനും ന്യായവിധിക്കും യോജിച്ച പ്രായോഗിക വിവേകമാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘ജ്ഞാനികൾ’ സുതാര്യവും സ്വാഭാവികവുമാണ്.
- source_word: וִידֻעִים
  choice: അറിവുള്ളവരുമായ
  rationale: ידע-യിൽനിന്നുള്ള ഈ രൂപം അറിവോ തിരിച്ചറിയപ്പെട്ട യോഗ്യതയോ ഉള്ളവരെ സൂചിപ്പിക്കാം. ജ്ഞാനികളോടുള്ള ഈ കൂട്ടുപ്രയോഗത്തിൽ ‘അറിവുള്ളവർ’ സന്ദർഭത്തിന് നന്നായി യോജിക്കുന്നു; ‘അറിയപ്പെടുന്നവർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: നിങ്ങളുടെമേൽ തലവന്മാരായി നിയമിച്ചു
  rationale: נתן ഇവിടെ ഔദ്യോഗികസ്ഥാനത്തേക്കുള്ള നിയമനത്തെ സൂചിപ്പിക്കുന്നു. ‘നിയമിച്ചു’ ഭരണപരമായ പ്രവൃത്തി വ്യക്തമാക്കുകയും ‘തലവന്മാർ’ רָאשִׁים എന്ന ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: שָׂרֵי
  choice: മേലധികാരികൾ
  rationale: שַׂר അധികാരമുള്ള ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു. ഇവിടെ വിവിധ വലുപ്പമുള്ള സംഘങ്ങളുടെ മേൽനോട്ടക്കാരായതിനാൽ ‘മേലധികാരികൾ’ സൈനികമെന്നോ ഭരണപരമെന്നോ മാത്രം ചുരുക്കാതെ അർഥം നൽകുന്നു.
- source_word: אֲלָפִים ... מֵאוֹת ... חֲמִשִּׁים ... עֲשָׂרֹת
  choice: ആയിരങ്ങൾ ... നൂറുകൾ ... അമ്പതുകൾ ... പത്തുകൾ
  rationale: ക്രമീകരിച്ച ഭരണപരമായ സംഘഘടനയെ സംഖ്യാവിഭാഗങ്ങളായി നേരിട്ട് നിലനിർത്തുന്നു; അവ നിർബന്ധമായും കൃത്യമായ ആളെണ്ണമാണെന്ന് അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: וְשֹׁטְרִים
  choice: ഉദ്യോഗസ്ഥർ
  rationale: שֹׁטֵר കീഴ്തലത്തിലുള്ള ഭരണപരമോ രേഖാപരിപാലനപരമോ ആയ ഔദ്യോഗിക ചുമതലയുള്ളവരെ സൂചിപ്പിക്കുന്നു; ‘ഉദ്യോഗസ്ഥർ’ ആ വിശാലത നിലനിർത്തുന്നു.
- source_word: לְשִׁבְטֵיכֶם
  choice: നിങ്ങളുടെ ഗോത്രങ്ങൾക്കായുള്ള
  rationale: ל ഗോത്രസംഘടനയ്ക്കുള്ള നിയമനബന്ധം സൂചിപ്പിക്കുന്നു; ‘ഗോത്രങ്ങൾക്കായുള്ള’ മലയാളത്തിൽ സ്വാഭാവികവും ഭരണപരമായ ബന്ധം വ്യക്തമാക്കുന്നതുമാണ്.
