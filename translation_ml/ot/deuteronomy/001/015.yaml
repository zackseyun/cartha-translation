  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവമുള്ള ഭരണപരമായ ശൈലി സ്വീകരിച്ചു. ‘തലവന്മാർ’ എന്ന ഹീബ്രു രൂപകം രണ്ടിടത്തും നിലനിർത്തി; സംഖ്യാഘടകങ്ങളെ കൃത്യമായ ആളെണ്ണമായി നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കാതെ ബഹുവചന വിഭാഗങ്ങളായി നൽകി.
