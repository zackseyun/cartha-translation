id: DEU.1.42
reference: Deuteronomy 1:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֱמֹ֤ר לָ/הֶם֙ לֹ֤א תַֽעֲלוּ֙ וְ/לֹא תִלָּ֣חֲמ֔וּ כִּ֥י אֵינֶ֖/נִּי בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּֽגְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: ml
  text: 'യഹ്‌വെ എന്നോടു പറഞ്ഞു: “അവരോടു പറയുക: ‘നിങ്ങൾ കയറിപ്പോകരുത്; യുദ്ധം ചെയ്യരുത്. കാരണം, ഞാൻ നിങ്ങളുടെ ഇടയിൽ ഇല്ല[a]. അല്ലെങ്കിൽ നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ നിങ്ങൾ പരാജയപ്പെടും[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിങ്ങളുടെ മധ്യേ ഇല്ല.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ അടിച്ചുവീഴ്ത്തപ്പെടും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ സവിശേഷ ഉടമ്പടിനാമം പകരപ്പദം ഉപയോഗിക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: എന്നോട് അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ വാക്ക് അവതരിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ആദരസൂചകവും മലയാളത്തിൽ സ്വാഭാവികവുമായ പ്രയോഗം; ‘എന്നോട്’ മോശെയാണ് വാക്കിന്റെ സ്വീകർത്താവെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: אֱמֹר לָהֶם
  choice: അവരോട് പറയുക
  rationale: ആജ്ഞാരൂപവും പരോക്ഷ കർമവും നേരിട്ട്, സ്വാഭാവികമായി പകരുന്നു.
- source_word: לֹא תַעֲלוּ
  choice: നിങ്ങൾ കയറിപ്പോകരുത്
  rationale: עלה എന്ന ക്രിയയുടെ ഭൗമശാസ്ത്ര-സൈനിക അർഥമായ ‘മുകളിലേക്കു പോകുക’ എന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא תִלָּחֲמוּ
  choice: യുദ്ധം ചെയ്യുകയും അരുത്
  rationale: לחם എന്ന ക്രിയയുടെ യുദ്ധത്തിൽ ഏർപ്പെടുക എന്ന അർഥം വ്യക്തമായി നൽകുകയും മുൻ വിലക്കിനോടുള്ള ഏകോപനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: കാരണം ഞാൻ നിങ്ങളുടെ ഇടയിൽ ഇല്ല
  rationale: ദൈവസാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന בקרבכם എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ മലയാളത്തിൽ പകരുന്നു; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: അല്ലെങ്കിൽ ... നിങ്ങൾ പരാജയപ്പെടും
  rationale: സന്ദർഭത്തിൽ വിലക്ക് ലംഘിച്ചാൽ സംഭവിക്കുന്ന സൈനിക പരാജയത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പാണിത്. ഹീബ്രു നിഷേധഘടനയെ മലയാളത്തിൽ യാന്ത്രികമായി പകർത്തി അർഥം മറിച്ചിടാതെ മുന്നറിയിപ്പിന്റെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ
  rationale: ഹീബ്രു സൈനിക പ്രയോഗത്തിന്റെ രൂപവും പരാജയത്തിന്റെ പൊതുസാക്ഷ്യസ്വഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള സവിശേഷ ദൈവനാമം പൊതുവായ പദവിയാക്കി മാറ്റാതെ, സാധ്യമായ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: וְלֹא תִּנָּגְפוּ എന്ന അവസാന ഉപവാക്യത്തിന്റെ ശക്തി
  choice: വിലക്ക് ലംഘിച്ചാൽ ഉണ്ടാകുന്ന മുന്നറിയിപ്പായി ‘അല്ലെങ്കിൽ ... നിങ്ങൾ പരാജയപ്പെടും’
  alternative: ‘നിങ്ങൾ പരാജയപ്പെടാതിരിക്കേണ്ടതിന്’; അക്ഷരരൂപത്തിൽ ‘നിങ്ങൾ പരാജയപ്പെടുകയില്ല’
  rationale: യഹ്‌വെയുടെ സാന്നിധ്യമില്ലാതെ മുന്നേറിയാൽ തോൽവി സംഭവിക്കുമെന്നതാണ് സന്ദർഭം. ലളിതമായ ഭാവികാല നിഷേധം സംരക്ഷണവാഗ്ദാനമായി തെറ്റിദ്ധരിക്കപ്പെടാം; തിരഞ്ഞെടുത്ത രൂപം ആ അർഥവിപര്യാസം ഒഴിവാക്കുന്നു, എന്നാൽ ‘അടിച്ചുവീഴ്ത്തപ്പെടുക’ എന്ന നിഗൂഢത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള ദൈവവചനത്തിനുള്ളിൽ കൈമാറേണ്ട സന്ദേശം വേർതിരിക്കാൻ ഇരട്ടതല ഉദ്ധരണിച്ചിഹ്നങ്ങൾ ഉപയോഗിച്ചു. ‘അരുളിച്ചെയ്തു’ ആദരസൂചകമാണെങ്കിലും അത്യന്തം പുരാതനശൈലിയല്ല; വിലക്കുകൾ ലളിതവും ശ്രാവ്യവുമായ രീതിയിൽ നൽകിയിരിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് അടയാളങ്ങളുടെ സ്ഥാന-ഉള്ളടക്ക പൊരുത്തക്കേട് തിരുത്തി: ‘മധ്യേ’ എന്ന ഭേദം [a]-യിലും ‘അടിച്ചുവീഴ്ത്തപ്പെടും’ എന്ന ഭേദം [b]-യിലും ചേർത്തിരിക്കുന്നു.'
