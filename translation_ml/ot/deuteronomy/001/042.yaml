revisions:
- from: 'യഹ്‌വെ എന്നോട് അരുളിച്ചെയ്തു: “അവരോട് പറയുക: ‘നിങ്ങൾ കയറിപ്പോകരുത്; യുദ്ധം ചെയ്യുകയും അരുത്. കാരണം ഞാൻ നിങ്ങളുടെ ഇടയിൽ ഇല്ല[a]. അല്ലെങ്കിൽ നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ നിങ്ങൾ പരാജയപ്പെടും[b].’”'
  to: 'യഹ്‌വെ എന്നോടു പറഞ്ഞു: “അവരോടു പറയുക: ‘നിങ്ങൾ കയറിപ്പോകരുത്; യുദ്ധം ചെയ്യരുത്. കാരണം, ഞാൻ നിങ്ങളുടെ ഇടയിൽ ഇല്ല[a]. അല്ലെങ്കിൽ നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ നിങ്ങൾ പരാജയപ്പെടും[b].’”'
