  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: ml
  text: ഇതാ, ഞാൻ ആ ദേശം നിങ്ങളുടെ മുമ്പിൽ വെച്ചിരിക്കുന്നു. നിങ്ങൾ ചെന്ന് യഹോവ നിങ്ങളുടെ പിതാക്കന്മാർക്കു—അബ്രാഹാമിനും യിസ്ഹാക്കിനും യാക്കോബിനും—അവർക്കും അവർക്കു ശേഷമുള്ള അവരുടെ സന്തതിക്കും നൽകുമെന്ന് സത്യം ചെയ്ത ആ ദേശം കൈവശമാക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൈവശമാക്കുക” എന്നതിന് “അവകാശമായി പ്രാപിക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയയ്ക്ക് ഈ രണ്ടു ഭാവങ്ങളും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഏകവചന ആജ്ഞയാണ്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഊന്നൽ ‘ഇതാ’ നൽകുന്നു.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: ഞാൻ ... നിങ്ങളുടെ മുമ്പിൽ വെച്ചിരിക്കുന്നു
  rationale: נתן എന്നതിന് സാധാരണയായി ‘കൊടുക്കുക’ എന്നാണെങ്കിലും, לפני എന്ന ഘടനയിൽ ഇവിടെ ദേശം അവരുടെ മുമ്പിൽ ലഭ്യമായി വെച്ചിരിക്കുന്ന ആശയം പ്രകടമാണ്; പൂർത്തീകൃത പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം ‘വെച്ചിരിക്കുന്നു’ നിലനിർത്തുന്നു.
- source_word: בֹּאוּ
  choice: നിങ്ങൾ ചെന്ന്
  rationale: ദേശത്തിനകത്തേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചന ആജ്ഞ. മലയാളത്തിൽ തുടർന്നുള്ള ‘കൈവശമാക്കുക’ എന്ന ആജ്ഞയോടൊപ്പം ‘ചെന്ന്’ സ്വാഭാവികമാണ്.
- source_word: וּרְשׁוּ
  choice: കൈവശമാക്കുക
  rationale: ירשׁ എന്ന പദം അവകാശമായി പ്രാപിക്കുക, കൈവശപ്പെടുത്തുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ദേശത്തിലേക്കു പ്രവേശിച്ച് അതിനെ സ്വന്താധീനത്തിലാക്കുന്ന സജീവഭാവം ഈ തിരഞ്ഞെടുപ്പ് നൽകുന്നു.
- source_word: נִשְׁבַּע יְהוָה
  choice: യഹോവ ... കൊടുക്കുമെന്ന് സത്യംചെയ്ത
  rationale: ദൈവനാമം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുകയും ശപഥത്തിന്റെ നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: לַאֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരായ
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; തുടർന്ന് അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവർ തന്നെയെന്ന് വാക്യം വ്യക്തമാക്കുന്നു.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: അവർക്കും അവർക്കുശേഷം അവരുടെ സന്തതിക്കും കൊടുക്കുമെന്ന്
  rationale: זרע എന്ന ഏകവചന സമൂഹനാമത്തിന്റെ തലമുറാപരമായ അർഥം ‘സന്തതി’ സ്വാഭാവികമായി നിലനിർത്തുന്നു; לָהֶם എന്ന ‘അവർക്കും’ ഒഴിവാക്കാതെ പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אֲבֹתֵיכֶם എന്ന ലിംഗനിർദ്ദിഷ്ട പദം
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  alternative: നിങ്ങളുടെ പൂർവികർ
  rationale: വാക്യം ഉടൻ അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരെ പേരെടുത്തുപറയുന്നതിനാൽ മൂലത്തിലെ ലിംഗനിർദ്ദിഷ്ടത നിലനിർത്തുന്നു.
- issue: זרע എന്ന സമൂഹ ഏകവചനം
  choice: സന്തതി
  alternative: വംശജർ
  rationale: ‘സന്തതി’ കൂട്ടായ ഏകവചനത്തിന്റെ രൂപവും വാഗ്ദാനത്തിന്റെ തലമുറാപരമായ വ്യാപ്തിയും നിലനിർത്തുന്നു; അതിനെ അനാവശ്യമായി ബഹുവചനമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തനങ്ങൾ മൂലപാഠത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നത്ര സംരക്ഷിച്ചു; ദൈവനാമം ‘യഹോവ’ എന്നും പിതാക്കന്മാരുടെ പേരുകൾ മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങളിലും നൽകി.
