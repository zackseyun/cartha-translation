source:
  edition: WLC
  text: זֽוּלָתִ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ ה֣וּא יִרְאֶ֔/נָּה וְ/לֽ/וֹ אֶתֵּ֧ן אֶת הָ/אָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖/הּ וּ/לְ/בָנָ֑י/ו יַ֕עַן אֲשֶׁ֥ר מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/036.yaml
  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: ml
  text: യെഫുന്നെയുടെ മകനായ കാലേബ് ഒഴികെ—അവൻ അതു കാണും; അവൻ കാലുകുത്തിയ ദേശം അവനും അവന്റെ പുത്രന്മാർക്കും[a] ഞാൻ കൊടുക്കും; അവൻ യഹ്‌വെയെ പൂർണമായി അനുഗമിച്ചതുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മക്കൾ’ അല്ലെങ്കിൽ ‘സന്തതികൾ’; എബ്രായത്തിൽ ‘പുത്രന്മാർ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֽוּלָתִ֞י
  choice: ഒഴികെ
  rationale: മുൻവിധിയിൽനിന്ന് കാലേബിനെ ഒഴിവാക്കുന്ന പ്രയോഗമായതിനാൽ സന്ദർഭത്തിന് സ്വാഭാവികവും കൃത്യവുമായ രൂപം.
- source_word: כָּלֵ֤ב בֶּן יְפֻנֶּה֙
  choice: യെഫുന്നെയുടെ മകനായ കാലേബ്
  rationale: എബ്രായ വ്യക്തിനാമങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരം ചെയ്യുകയും ബന്ധം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יִרְאֶ֔נָּה
  choice: അവൻ അതു കാണും
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുമ്പുള്ള ‘ദേശം’ എന്നതിനെ സൂചിപ്പിക്കുന്നു; വാഗ്ദാനത്തിന്റെ ഉറപ്പ് ലളിതമായ ഭാവികാലത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְלֽוֹ אֶתֵּ֧ן
  choice: അവനും … ഞാൻ കൊടുക്കും
  rationale: ‘അവന്’ എന്ന ദാതൃവിഭക്തിക്കുള്ള ഊന്നൽ മലയാളവാക്യത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאָ֛רֶץ
  choice: ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിലെ വാഗ്ദത്തഭൂമിയെ സൂചിപ്പിക്കുന്ന പദത്തിന് പതിവും വ്യാപകവുമായ മലയാളസമാനപദം.
- source_word: אֲשֶׁ֥ר דָּֽרַךְ בָּ֖הּ
  choice: അവൻ കാലുകുത്തിയ
  rationale: דָּרַךְ എന്നതിലെ ചവിട്ടുക/നടക്കുക എന്ന ദൃശ്യബിംബം സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וּלְבָנָ֑יו
  choice: അവന്റെ പുത്രന്മാർക്കും
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം സംരക്ഷിക്കുന്നു; വിശാലമായ വംശപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: יַ֕עַן אֲשֶׁ֥ר
  choice: കാരണം
  rationale: വാഗ്ദാനത്തിന്റെ കാരണം വ്യക്തമാക്കുന്ന സംയുക്തബന്ധകത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ വിവർത്തനം.
- source_word: מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה
  choice: യഹ്‌വെയെ പൂർണമായി അനുഗമിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘പിന്നാലെ നിറച്ചു’ എന്ന എബ്രായ ശൈലിയുടെ പൂർണമായ/മുഴുഹൃദയത്തോടെയുള്ള അനുഗമനം എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ പ്രത്യേക ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പദവിയാൽ പകരാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്തു.
- issue: בָּנָיו എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: അവന്റെ പുത്രന്മാർ
  alternative: അവന്റെ മക്കൾ; അവന്റെ സന്തതികൾ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു; അവകാശസന്ദർഭത്തിൽ സന്തതികളെ വിശാലമായി സൂചിപ്പിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ വ്യക്തമായ ദൃശ്യബിംബം ‘കാലുകുത്തിയ’ എന്നതിലൂടെ സംരക്ഷിച്ചു; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു നൽകിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചേരേണ്ട ശരിയായ സ്ഥാനം ‘പുത്രന്മാർക്കും’ എന്ന പദത്തിനു ശേഷമാണ്.
