source:
  edition: WLC
  text: וּ/בַ/דָּבָ֖ר הַ/זֶּ֑ה אֵֽינְ/כֶם֙ מַאֲמִינִ֔ם בַּ/יהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/032.yaml
  text: Yet in this matter you did not believe in Yahweh your God[a].
translation:
  language: ml
  text: എന്നിട്ടും ഈ കാര്യത്തിൽ നിങ്ങൾ നിങ്ങളുടെ ദൈവമായ യഹോവയിൽ വിശ്വസിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “നിങ്ങളുടെ ദൈവമായ യഹോവയെ ആശ്രയിച്ചില്ല”; മറ്റൊരു സാധ്യത: “നിങ്ങളുടെ ദൈവമായ യഹോവയെ വിശ്വസിച്ചില്ല.”'
    reason: אמן + ב എന്ന പ്രയോഗത്തിന് വ്യക്തിയിൽ വിശ്വാസം വയ്ക്കുക, ആശ്രയിക്കുക, അയാളുടെ വാക്ക് വിശ്വസിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  choice: എന്നിട്ടും ഈ കാര്യത്തിൽ
  rationale: דָּבָר ഇവിടെ മുമ്പ് വിവരിച്ച സംഭവത്തെയോ കാര്യത്തെയോ സൂചിപ്പിക്കുന്നു; וּ സന്ദർഭത്തിലെ ശാസനാഭാവം കണക്കിലെടുത്ത് നേരിയ വിരുദ്ധാർഥമുള്ള ‘എന്നിട്ടും’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: אֵינְ/כֶם מַאֲמִינִם
  choice: നിങ്ങൾ വിശ്വസിച്ചില്ല
  rationale: നിഷേധകണത്തോടുകൂടിയ אמן എന്ന ധാതുവിന്റെ ഹിഫീൽ വർത്തമാനകൃദന്തം അന്നത്തെ സാഹചര്യത്തിൽ ജനത്തിന്റെ തുടർന്നുനിന്ന അവിശ്വാസനിലയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ലളിതമായ ഭൂതകാലരൂപം സ്വാഭാവികമാണ്.
- source_word: בַּ/יהוָה
  choice: യഹോവയിൽ
  rationale: אמן + ב എന്ന ഘടന വിശ്വസിക്കുക/ആശ്രയിക്കുക എന്ന ബന്ധം പ്രകടിപ്പിക്കുന്നു. ദൈവനാമമായ יהוה മലയാളത്തിൽ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; ‘-യിൽ’ എബ്രായ മുൻപ്രത്യയത്തിന്റെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי/כֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയമുള്ള സംയുക്തരൂപം ഉടമ്പടിബന്ധം ഊന്നിപ്പറയുന്ന ‘നിങ്ങളുടെ ദൈവം’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; മലയാളവാക്യത്തിൽ ‘നിങ്ങളുടെ ദൈവമായ യഹോവ’ എന്ന ക്രമം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: אמן + ב എന്ന പ്രയോഗം യഹോവയെ സംബന്ധിച്ച് എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: യഹോവയിൽ വിശ്വസിച്ചില്ല
  alternative: യഹോവയെ ആശ്രയിച്ചില്ല; യഹോവയെ വിശ്വസിച്ചില്ല
  rationale: ഈ എബ്രായഘടന വ്യക്തിയിൽ വിശ്വാസം വയ്ക്കുക, ആശ്രയിക്കുക, അയാളുടെ വാക്ക് സത്യമെന്നു സ്വീകരിക്കുക എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥങ്ങൾ വഹിക്കാം. ‘യഹോവയിൽ വിശ്വസിച്ചില്ല’ ഘടനാപരമായ ബന്ധവും ദൈവത്തോടുള്ള അവിശ്വാസമെന്ന വിപുലമായ കുറ്റാരോപണവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അവന്റെ വാഗ്ദാനം സ്വീകരിക്കാതിരുന്നതെന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ബഹുവചനമായ ‘നിങ്ങൾ’ നിലനിർത്തി. ‘ഈ കാര്യത്തിൽ’ മുൻസന്ദർഭത്തോടുള്ള ബന്ധം വ്യക്തമാക്കുന്നു; ദൈവനാമം ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
