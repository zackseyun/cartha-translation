source:
  edition: WLC
  text: יְהוֹשֻׁ֤עַ בִּן נוּן֙ הָ/עֹמֵ֣ד לְ/פָנֶ֔י/ךָ ה֖וּא יָ֣בֹא שָׁ֑מָּ/ה אֹת֣/וֹ חַזֵּ֔ק כִּי ה֖וּא יַנְחִלֶ֥/נָּה אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: ml
  text: നൂന്റെ മകനായ യോശുവ—നിന്റെ മുമ്പിൽ നിൽക്കുന്നവൻ—അവിടേക്കു പ്രവേശിക്കും. അവനെ ശക്തിപ്പെടുത്തുക; കാരണം അവൻ ഇസ്രായേലിന് ആ ദേശം അവകാശമായി നൽകും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ഇസ്രായേലിനെ ആ ദേശത്തിന്റെ അവകാശികളാക്കും”; അല്ലെങ്കിൽ, “അവൻ ആ ദേശം ഇസ്രായേലിന് വിഭജിച്ചുകൊടുക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ യോശുവ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ പേരുരൂപങ്ങൾ നിലനിർത്തുകയും എബ്രായ രക്ഷാകർത്തൃബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ നിൽക്കുന്നവൻ
  rationale: പദപ്രയോഗത്തിന്റെ അക്ഷരാർഥം സംരക്ഷിക്കുന്നു; ‘നിന്നെ സേവിക്കുന്നവൻ’ എന്ന വ്യാഖ്യാനപരമായ അർഥം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: הוּא יָבֹא שָׁמָּה
  choice: അവിടേക്കു പ്രവേശിക്കും
  rationale: בואയും ദിശാസൂചകമായ שָׁמָּהയും സൂചിപ്പിക്കുന്ന ദേശത്തിനകത്തേക്കുള്ള പ്രവേശനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֹתוֹ חַזֵּק
  choice: അവനെ ശക്തിപ്പെടുത്തുക
  rationale: חזק എന്ന ക്രിയയുടെ ശാരീരികവും മാനസികവും പ്രായോഗികവുമായ വിശാല അർഥസാധ്യത നിലനിർത്തുന്നു; ‘പ്രോത്സാഹിപ്പിക്കുക’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള കല്പനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: അവൻ ഇസ്രായേലിന് ആ ദേശം അവകാശമായി നൽകും
  rationale: נחל എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘അവകാശമാക്കിക്കൊടുക്കുക/അവകാശമായി നൽകുക’ എന്ന കാരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം സന്ദർഭത്തിലെ ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יַנְחִלֶנָּהയിലെ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയത്തിന്റെ സൂചിതവസ്തു
  choice: ‘ആ ദേശം’ എന്ന് വ്യക്തമാക്കി, ഇസ്രായേലിന് അവകാശമായി നൽകുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവൻ ഇസ്രായേലിനെ അതിന് അവകാശികളാക്കും’ അഥവാ വസ്തു പരോക്ഷമായി വിടുക.
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭം വാഗ്ദത്തദേശത്തിലേക്കുള്ള പ്രവേശനത്തെയും അതിന്റെ കൈവശപ്പെടുത്തലിനെയും കുറിച്ചാണ്; ‘ആ ദേശം’ എന്നു നൽകുന്നത് പുതിയ ദൈവശാസ്ത്രവാദം ചേർക്കാതെ എബ്രായ പ്രത്യയത്തിന്റെ സൂചന വ്യക്തമാക്കുന്നു.
- issue: נחל ഹിഫീലിന്റെ പ്രവർത്തനസ്വഭാവം
  choice: അവകാശമായി നൽകും
  alternative: ഇസ്രായേലിനെ അതിന്റെ അവകാശികളാക്കും; അല്ലെങ്കിൽ ഇസ്രായേലിന് അത് വിഭജിച്ചുകൊടുക്കും.
  rationale: എബ്രായത്തിൽ നൽകൽ, അവകാശമാക്കൽ, വിഭജിച്ചുകൊടുക്കൽ എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളാം. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ വിശാലപ്രയോഗം തെരഞ്ഞെടുത്ത് മറ്റുള്ള സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ച ഊന്നൽ (‘അവൻ’) ഡാഷ് ഘടനയിലൂടെ ഭാഗികമായി നിലനിർത്തി. വാക്യത്തിന്റെ അവസാനം [a] അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തി.
