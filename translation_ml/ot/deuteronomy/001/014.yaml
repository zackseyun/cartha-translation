source:
  edition: WLC
  text: וַֽ/תַּעֲנ֖וּ אֹתִ֑/י וַ/תֹּ֣אמְר֔וּ טֽוֹב הַ/דָּבָ֥ר אֲשֶׁר דִּבַּ֖רְתָּ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/014.yaml
  text: And you answered me and said[a], ‘The thing that you have spoken is good for us to do.’
translation:
  language: ml
  text: 'നിങ്ങൾ എന്നോടു മറുപടി പറഞ്ഞ് ഇങ്ങനെ പറഞ്ഞു: “അങ്ങ് പറഞ്ഞ കാര്യം ഞങ്ങൾ ചെയ്യുന്നത് നല്ലതാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲנוּ אֹתִי וַתֹּאמְרוּ
  choice: നിങ്ങൾ എന്നോടു മറുപടി പറഞ്ഞു
  rationale: രണ്ടു ക്രിയകളുടെയും മറുപടി-പറച്ചിൽ എന്ന സംയുക്ത ആശയം സ്വാഭാവിക മലയാളത്തിൽ ഒറ്റ പ്രയോഗമായി നൽകുന്നു; ‘മറുപടി പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: טוֹב
  choice: നല്ലതാണ്
  rationale: നിർദേശത്തെ അനുകൂലമായി വിലയിരുത്തുന്ന മൂലപദത്തിന്റെ നേരിട്ടുള്ളതും വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമായ തുല്യപ്രയോഗം.
- source_word: הַדָּבָר אֲשֶׁר דִּבַּרְתָּ
  choice: അങ്ങ് പറഞ്ഞ കാര്യം
  rationale: דבר ഇവിടെ മോശെ മുന്നോട്ടുവച്ച കാര്യത്തെയോ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കാര്യം’ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ആദരസൂചകമായ ‘അങ്ങ്’ ജനങ്ങൾ മോശെയോടു പറയുന്ന വാക്കുകളിൽ സ്വാഭാവികമാണ്.
- source_word: לַעֲשׂוֹת
  choice: ചെയ്യുന്നത്
  rationale: നിർദേശം നടപ്പാക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘അങ്ങ് പറഞ്ഞ കാര്യം ചെയ്യുന്നത് നല്ലതാണ്’ എന്ന ഘടന സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ഹീബ്രുവിലെ വാക്യക്രമത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അനാവശ്യ ക്രിയാവർത്തനം ഒഴിവാക്കി.
