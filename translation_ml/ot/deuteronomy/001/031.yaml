  text: וּ/בַ/מִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֥ר יִשָּׂא אִ֖ישׁ אֶת בְּנ֑/וֹ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: ml
  text: മരുഭൂമിയിലും[a], നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ ചുമന്നത് നീ കണ്ടു—ഒരു മനുഷ്യൻ തന്റെ മകനെ ചുമക്കുന്നതുപോലെ[b]—നിങ്ങൾ ഈ സ്ഥലത്ത് എത്തുന്നതുവരെ സഞ്ചരിച്ച മുഴുവൻ വഴിയിലും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിജനപ്രദേശത്തും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ഒരു മനുഷ്യൻ തന്റെ മകനെ ചുമക്കുന്നതുപോലെ.’ പൊതുവായ അർഥത്തിൽ ചിലർ ‘ഒരാൾ ഒരു കുഞ്ഞിനെ ചുമക്കുന്നതുപോലെ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: മരുഭൂമിയിലും
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ വരണ്ട വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘മരുഭൂമി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; മുൻവാക്യത്തോടുള്ള ബന്ധം ‘-യും’ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר רָאִיתָ
  choice: നിങ്ങൾ ... കണ്ടു
  rationale: ഏകവചന അഭിസംബോധനയായിരുന്നാലും, മോശെ ഇസ്രായേൽജനത്തെ സമൂഹമായി അഭിസംബോധന ചെയ്യുന്നതിനാൽ മലയാളത്തിലെ ആദരസൂചകവും സമൂഹസൂചകവുമായി സ്വാഭാവികമായ ‘നിങ്ങൾ’ ഉപയോഗിച്ചു. വാചകക്രമം മലയാളത്തിൽ സുഗമമാക്കി.
- source_word: נְשָׂאֲךָ
  choice: നിങ്ങളെ ചുമന്നത്
  rationale: נשא എന്നതിന്റെ ‘വഹിക്കുക/ചുമക്കുക’ എന്ന അർഥവും തുടർന്നുള്ള പിതൃസദൃശ ദൃശ്യവും ‘ചുമക്കുക’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: ദൈവനാമത്തോടു ചേർന്ന ഉടമസ്ഥബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: ഒരു മനുഷ്യൻ തന്റെ മകനെ ചുമക്കുന്നതുപോലെ
  rationale: אִישׁ എന്നത് ‘മനുഷ്യൻ’ എന്നും בְּנוֹ എന്നത് ‘തന്റെ മകൻ’ എന്നും കൃത്യമായി നിലനിർത്തി; ‘പിതാവ്’ എന്ന് ശക്തിപ്പെടുത്തുകയോ ലിംഗനിരപേക്ഷമാക്കുകയോ ചെയ്തില്ല.
- source_word: בְּכָל־הַדֶּרֶךְ
  choice: വഴിയിലുടനീളം
  rationale: യാത്രയുടെ മുഴുവൻ ദൈർഘ്യത്തിലും എന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: אֲשֶׁר הֲלַכְתֶּם
  choice: നിങ്ങൾ ... സഞ്ചരിച്ച
  rationale: ജനത്തിന്റെ മരുഭൂമിയാത്രയെ സൂചിപ്പിക്കുന്നതിനാൽ הלך എന്നതിന്റെ സന്ദർഭോചിതമായ മലയാളരൂപം ‘സഞ്ചരിച്ച’ ആണ്.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: നിങ്ങൾ ഈ സ്ഥലത്ത് എത്തുന്നതുവരെ
  rationale: ഇരട്ട עַד ഘടനയുടെ ലക്ഷ്യവും കാലപരിധിയും മലയാളത്തിൽ സ്വാഭാവികമായ ഏക കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പദവിയാക്കി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരിച്ചു; ‘യഹോവ’യെക്കാൾ ഹീബ്രു ഉച്ചാരണത്തിന്റെ പണ്ഡിതസമ്മത പുനർനിർമാണത്തോട് അടുത്ത രൂപമാണ് ‘യഹ്‌വെ’.
- issue: ഉപമയിലെ ലിംഗനിർദ്ദിഷ്ട കുടുംബദൃശ്യം
  choice: ഒരു മനുഷ്യൻ തന്റെ മകനെ ചുമക്കുന്നതുപോലെ
  alternative: ഒരാൾ ഒരു കുഞ്ഞിനെ ചുമക്കുന്നതുപോലെ / ഒരു പിതാവ് തന്റെ മകനെ ചുമക്കുന്നതുപോലെ
  rationale: മൂലത്തിലെ אִישׁ (‘മനുഷ്യൻ’)യും בְּנוֹ (‘തന്റെ മകൻ’)യും നിലനിർത്തി. ‘പിതാവ്’ എന്നു വ്യാഖ്യാനപരമായി ശക്തിപ്പെടുത്തിയില്ല; ലിംഗനിരപേക്ഷമാക്കുകയും ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന ഹീബ്രു ഏകവചനവും ബഹുവചനവും മലയാളത്തിൽ സ്വാഭാവികമായ ‘നിങ്ങൾ’ എന്ന രൂപത്തിൽ പ്രകടമാകുന്നു. വാക്യം മുൻസന്ദർഭത്തിന്റെ തുടർച്ചയായതിനാൽ ‘മരുഭൂമിയിലും’ എന്നു തുടങ്ങി.
