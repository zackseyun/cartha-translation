  choice: -ഉം / നീയും
  rationale: രണ്ടിടത്തുമുള്ള കൂട്ടിച്ചേർക്കലിന്റെയും ഊന്നലിന്റെയും ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בִּי ... הִתְאַנַּף
  choice: എന്നോടും കോപിച്ചു
  rationale: ב എന്ന ഉപസർഗം കോപത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘എന്നോടു കോപിച്ചു’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בִּגְלַלְכֶם
  choice: നിങ്ങൾ നിമിത്തം
  rationale: കാരണത്തെയോ സന്ദർഭഹേതുവിനെയോ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ജനത്തിന്റെ പങ്കിനെ വാക്യം ഊന്നുന്നതും നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: എന്നു പറഞ്ഞു
  rationale: തുടർന്നുള്ള ദൈവവചനത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: גַּם אַתָּה
  choice: നീയും
  rationale: മോശെയെ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നതും ‘גם’ എന്ന പദത്തിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: לֹא תָבֹא שָׁם
  choice: അവിടെ പ്രവേശിക്കുകയില്ല
  rationale: വാഗ്ദത്തദേശത്തിൽ പ്രവേശിക്കുന്നതാണ് സന്ദർഭാർത്ഥം; ‘അവിടെ’ എന്ന ദിശാസൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദനാമമായി മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: മോശെയുടെ പ്രവേശനനിഷേധത്തിൽ ജനത്തിന്റെ കാരണപരമായ പങ്ക്
  choice: ‘നിങ്ങൾ നിമിത്തം’ എന്ന ആവർത്തനപുസ്തകത്തിലെ ഊന്നൽ അതേപടി നിലനിർത്തി
  alternative: സംഖ്യാപുസ്തകം 20 അടിസ്ഥാനമാക്കി മോശെയുടെ സ്വന്തം പരാജയം മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുക
  rationale: ഈ വാക്യം ജനത്തിന്റെ പങ്കിനെ ഊന്നുന്നു. മറ്റു ഭാഗങ്ങളുമായുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം മുഖ്യപാഠത്തിൽ നിശ്ശബ്ദമായി പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
