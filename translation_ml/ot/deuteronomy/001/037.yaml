  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പ്രസംഗസന്ദർഭത്തിലെ ബഹുവചനമായ ‘നിങ്ങൾ’ എന്നും മോശെയോടുള്ള ഏകവചനമായ ‘നീ’ എന്നും വേർതിരിച്ചു. മൂലത്തിലെ രണ്ട് גם പദങ്ങളുടെയും ഭാവം ‘എന്നോടും’, ‘നീയും’ എന്നിങ്ങനെ നിലനിർത്തി.
