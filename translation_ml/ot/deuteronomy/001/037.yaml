  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
translation:
  language: ml
  text: 'നിങ്ങൾ നിമിത്തം യാഹ്‌വെ എന്നോടും കോപിച്ചു[a]: “നീയും അവിടെ പ്രവേശിക്കുകയില്ല,” എന്നു പറഞ്ഞു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങൾ കാരണം യാഹ്‌വെ എനിക്കെതിരെയും കോപിച്ചു.”'
    reason: lexical_alternative
  - marker: b
    text: സംഖ്യാപുസ്തകം 20:12 താരതമ്യം ചെയ്യുക. അവിടെ മോശെയ്ക്ക് ദേശത്തിൽ പ്രവേശനം നിഷേധിച്ചത് മെരീബയിലെ അദ്ദേഹത്തിന്റെ സ്വന്തം പരാജയവുമായി ബന്ധിപ്പിക്കുന്നു; ഇവിടെ ആവർത്തനപുസ്തകം സംഭവത്തിൽ ജനത്തിനുണ്ടായിരുന്ന പങ്കിനെ ഊന്നുന്നു.
    reason: cross_reference
lexical_decisions:
