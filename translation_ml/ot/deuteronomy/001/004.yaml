source:
  edition: WLC
  text: אַחֲרֵ֣י הַכֹּת֗/וֹ אֵ֚ת סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן וְ/אֵ֗ת ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן אֲשֶׁר יוֹשֵׁ֥ב בְּ/עַשְׁתָּרֹ֖ת בְּ/אֶדְרֶֽעִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: ml
  text: അവൻ ഹെശ്ബോനിൽ വസിച്ചിരുന്ന അമോര്യരുടെ രാജാവായ സീഹോനെയും അഷ്ടരോത്തിൽ, എദ്രെയിയിൽ, വസിച്ചിരുന്ന ബാശാന്റെ രാജാവായ ഓഗിനെയും അടിച്ചുതോൽപ്പിച്ചശേഷം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അഷ്ടരോത്തിലും എദ്രെയിയിലും വസിച്ചിരുന്ന.” ഹീബ്രുവിൽ രണ്ടു സ്ഥലനാമങ്ങൾക്കും മുമ്പ് “ൽ” എന്ന അർഥമുള്ള പദം ആവർത്തിച്ചുവരുന്നതിനാൽ, അവ തമ്മിലുള്ള കൃത്യമായ ബന്ധം പൂർണമായി വ്യക്തമല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי הַכֹּתוֹ
  choice: അവൻ ... സംഹരിച്ചശേഷം
  rationale: אַחֲרֵי കൂടിയ נכה എന്ന ക്രിയയുടെ infinitive construct, പ്രധാനവാക്യത്തിലെ സംഭവത്തിനു മുമ്പുണ്ടായ നടപടി സൂചിപ്പിക്കുന്നു. ‘സംഹരിച്ചശേഷം’ കാലബന്ധവും ക്രിയയുടെ ശക്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: അമോര്യരുടെ രാജാവായ സീഹോൻ
  rationale: Construct chain-ഉം ജനവിഭാഗനാമവും വ്യക്തമായി സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: ഹെശ്ബോനിൽ വസിച്ചിരുന്ന
  rationale: יָשַׁב ഇവിടെ താമസിക്കുക/വസിക്കുക എന്ന അർഥത്തിലാണ്; relative clause മലയാളത്തിൽ വിശേഷണവാക്യമായി സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: ബാശാൻരാജാവായ ഓഗ്
  rationale: പ്രദേശനാമത്തോടുകൂടിയ രാജപദവി സംക്ഷിപ്തവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: എദ്രെയിലെ അഷ്ടരോത്തിൽ വസിച്ചിരുന്ന
  rationale: രണ്ടു സ്ഥലനാമങ്ങൾക്കും ആവർത്തിച്ച ב ഉണ്ടെങ്കിലും അവയുടെ കൃത്യബന്ധം വ്യക്തമല്ല. മുഖ്യവാചകം വായനാസൗകര്യത്തിനായി ഒരു സാധ്യബന്ധം നൽകുന്നു; യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അഷ്ടരോത്തും എദ്രെയിയും തമ്മിലുള്ള സ്ഥലബന്ധം
  choice: എദ്രെയിലെ അഷ്ടരോത്തിൽ
  alternative: അഷ്ടരോത്തിലും എദ്രെയിലും
  rationale: ഹീബ്രുവിൽ രണ്ടു പേരിനുമുമ്പും ב ആവർത്തിക്കുന്നു; ഇത് രണ്ടു താമസസ്ഥലങ്ങൾ എന്നും ഒന്നിനെ മറ്റൊന്നുമായി ബന്ധിപ്പിക്കുന്ന നിർമാണം എന്നും ഗ്രഹിക്കാം. മുഖ്യവാചകം ബന്ധം സൂചിപ്പിച്ചെങ്കിലും മറ്റൊരു സാധ്യവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; ഇതിൽ പ്രത്യേക ദൈവശാസ്ത്രനിലപാട് ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പേരുകൾ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു. ഈ ഭാഗം മുൻവാക്യത്തിൽ ആരംഭിച്ച വാക്യത്തിന്റെ കാലസൂചനയായതിനാൽ മൂലത്തിലെ ഖണ്ഡവാക്യസ്വഭാവം നിലനിർത്തി.
