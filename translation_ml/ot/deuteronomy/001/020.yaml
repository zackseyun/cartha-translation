id: DEU.1.20
reference: Deuteronomy 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֲלֵ/כֶ֑ם בָּאתֶם֙ עַד הַ֣ר הָ/אֱמֹרִ֔י אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/020.yaml
  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളോടു പറഞ്ഞു: “നമ്മുടെ ദൈവമായ യഹോവ നമുക്കു തരുന്ന അമോര്യരുടെ മലനാട്ടിൽ[a] നിങ്ങൾ എത്തിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അമോര്യരുടെ മലയിൽ.” എബ്രായപദം ഒറ്റ മലയെയോ വിശാലമായ മലനാടിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞു
  rationale: വയിക്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ തുടർച്ചയായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിനായി പ്രത്യേകമായി ‘അപ്പോൾ’ ചേർക്കാതെ ലളിതമായ ഭൂതകാലം ഉപയോഗിച്ചു; ‘നിങ്ങൾ’ ബഹുവചനമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: בָּאתֶם עַד
  choice: നിങ്ങൾ എത്തിയിരിക്കുന്നു
  rationale: בוא എന്ന ക്രിയയുടെ പൂർത്തീകരിച്ച പ്രവൃത്തിയും ഇപ്പോഴത്തെ പ്രസക്തിയും മലയാളത്തിലെ ‘എത്തിയിരിക്കുന്നു’ സ്വാഭാവികമായി അറിയിക്കുന്നു. עַד എത്തിച്ചേർന്ന ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു.
- source_word: הַר הָאֱמֹרִי
  choice: അമോര്യരുടെ മലനാട്
  rationale: הַר ഇവിടെ ഒറ്റ മലയെ മാത്രമല്ല, മലനിരകളും കുന്നുകളും ഉൾപ്പെടുന്ന പ്രദേശത്തെയും സൂചിപ്പിക്കാം. ജാതിനാമം സമൂഹവാചകമായതിനാൽ ‘അമോര്യരുടെ’ എന്നു നൽകി.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമമായ יהוה-യെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהֵינוּ എന്നത് നേരിട്ട് ‘നമ്മുടെ ദൈവം’ എന്നാണ്. മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘ദൈവമായ’ ഉപയോഗിച്ചു.
- source_word: נֹתֵן לָנוּ
  choice: നമുക്കു തരുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം ഇപ്പോൾ നൽകിക്കൊണ്ടിരിക്കുന്നതോ ഉറപ്പായി നൽകാനിരിക്കുന്നതോ ആയ പ്രവൃത്തിയെ തുറന്നുവയ്ക്കുന്നു. ‘നമുക്കു തരുന്ന’ മലയാളത്തിൽ സ്വാഭാവികമായി ഈ അർത്ഥപരിധി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുവായ ഒരു സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പേരിനെ മറയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- issue: നֹתֵן എന്ന കൃദന്തരൂപത്തിന്റെ കാലസൂചന
  choice: നമുക്കു തരുന്ന
  alternative: നമുക്കു തന്നിരിക്കുന്ന
  rationale: ‘തന്നിരിക്കുന്ന’ എന്നു പറഞ്ഞാൽ നൽകൽ ഇതിനകം പൂർണമായെന്ന വ്യാഖ്യാനം ശക്തമാകും. മൂലത്തിലെ വർത്തമാന കൃദന്തം സൂക്ഷിക്കുന്നതിനായി ‘തരുന്ന’ എന്നു നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. വാക്യക്രമം സ്വാഭാവികമാക്കിയെങ്കിലും മൂലത്തിലെ നേരിട്ടുള്ള പ്രസംഗവും ഭൂമിശാസ്ത്രപരമായ ദ്വയാർഥതയും നിലനിർത്തി.
