  yaml_path: translation/ot/deuteronomy/001/046.yaml
  text: So you remained at Kadesh many days[a], according to the days that you remained there.
translation:
  language: ml
  text: അങ്ങനെ നിങ്ങൾ കാദേശിൽ അനേകം ദിവസങ്ങൾ താമസിച്ചു[a]—നിങ്ങൾ അവിടെ താമസിച്ച ദിവസങ്ങൾക്കൊത്തവിധം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു അക്ഷരാർഥത്തിൽ: ‘അനേകം ദിവസങ്ങൾ—നിങ്ങൾ താമസിച്ച ദിവസങ്ങൾപോലെ.’ അവസാന വാക്യഭാഗം സംക്ഷിപ്തവും അർഥത്തിൽ അല്പം അനിശ്ചിതവുമാണ്; താമസത്തിന്റെ ദൈർഘ്യത്തെ താരതമ്യമായി സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: അങ്ങനെ നിങ്ങൾ ... താമസിച്ചു
  rationale: ישׁב എന്ന ക്രിയ ഇവിടെ ഒരു സ്ഥലത്ത് തുടർന്നു പാർക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘താമസിച്ചു’ സ്വാഭാവികമാണ്; വാക്യാരംഭത്തിലെ וַ־ സന്ദർഭത്തിലെ ഫലപരമായ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ ‘അങ്ങനെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְקָדֵשׁ
  choice: കാദേശിൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; בְ־ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന് മലയാളത്തിൽ ‘-യിൽ’ സ്വാഭാവികമാണ്.
- source_word: יָמִים רַבִּים
  choice: വളരെക്കാലം
  rationale: അക്ഷരാർഥത്തിൽ ‘വളരെ ദിവസങ്ങൾ’ എന്നാണെങ്കിലും, ദീർഘകാല താമസം സൂചിപ്പിക്കുന്ന ഈ ഹീബ്രു പ്രയോഗത്തിന് ‘വളരെക്കാലം’ സാധാരണ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: כַיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  choice: നിങ്ങൾ അവിടെ താമസിച്ചത്രയും കാലം
  rationale: כַּ־ താരതമ്യം സൂചിപ്പിക്കുന്നു. ഹീബ്രു വാക്യഭാഗം സംക്ഷിപ്തവും അർഥത്തിൽ അല്പം അനിശ്ചിതവുമാണ്; ‘-ത്രയും കാലം’ എന്ന രൂപം ദൈർഘ്യത്തിലെ താരതമ്യം സ്വാഭാവികമായി നൽകുന്നു. ‘അവിടെ’ എന്നത് കാദേശിനെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭത്തിൽനിന്ന് ചേർത്തതാണ്.
