    rationale: എബ്രായത്തിലെ ബഹുവചനമായ ‘അവരുടെ കൈകളിൽ’ എന്ന മൂർത്തസൂചന ‘തങ്ങളുടെ കൈകളിൽ’ എന്നു നൽകണം.
  - severity: low
