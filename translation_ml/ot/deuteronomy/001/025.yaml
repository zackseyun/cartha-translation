id: DEU.1.25
reference: Deuteronomy 1:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְח֤וּ בְ/יָדָ/ם֙ מִ/פְּרִ֣י הָ/אָ֔רֶץ וַ/יּוֹרִ֖דוּ אֵלֵ֑י/נוּ וַ/יָּשִׁ֨בוּ אֹתָ֤/נוּ דָבָר֙ וַ/יֹּ֣אמְר֔וּ טוֹבָ֣ה הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: ml
  text: 'അവർ ദേശത്തിലെ ഫലങ്ങളിൽ ചിലത് തങ്ങളുടെ കൈകളിൽ എടുത്ത് ഞങ്ങളുടെ അടുക്കലേക്ക് താഴേക്കു കൊണ്ടുവന്നു; അവർ ഞങ്ങളോടു വിവരം അറിയിച്ചു[a]: “നമ്മുടെ ദൈവമായ യാഹ്‌വേ നമുക്കു നൽകുന്ന ദേശം നല്ലതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവർ ഞങ്ങളോടു റിപ്പോർട്ട് ചെയ്തു’; അക്ഷരാർഥം, ‘അവർ ഞങ്ങൾക്കു ഒരു വാക്ക്/വിവരം തിരികെ കൊണ്ടുവന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם
  choice: അവർ കൈയിൽ എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘എടുക്കുക’ നിലനിർത്തുകയും בְיָדָם എന്ന മൂർത്തമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: מִפְּרִי הָאָרֶץ
  choice: ദേശത്തിലെ ഫലങ്ങളിൽ ചിലത്
  rationale: ഭാഗസൂചകമായ מִן മുഴുവൻ വിളവല്ല, അതിൽനിന്നുള്ള ചില മാതൃകകളാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: ഞങ്ങളുടെ അടുക്കൽ താഴേക്ക് കൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള ירד ഉൾക്കൊള്ളുന്ന ‘താഴേക്ക് കൊണ്ടുവരുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു.
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: അവർ ഞങ്ങൾക്ക് വിവരം തിരികെ കൊണ്ടുവന്ന്
  rationale: שוב + דבר എന്ന എബ്രായ പ്രയോഗത്തിലെ മടങ്ങിവരവിന്റെ ആശയവും റിപ്പോർട്ട് നൽകുന്നതിന്റെ അർഥവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
- source_word: טוֹבָה הָאָרֶץ
  choice: ദേശം നല്ലതാണ്
  rationale: ദേശത്തെക്കുറിച്ചുള്ള വിശാലമായ അനുകൂല വിലയിരുത്തലായ טוֹבָה നേരിട്ട്, സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ
  rationale: ബന്ധസൂചകമായ ‘നമ്മുടെ ദൈവം’ എന്ന ഉടമ്പടിപരമായ പ്രയോഗം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: נֹתֵן לָנוּ
  choice: നമുക്കു നൽകുന്ന
  rationale: വർത്തമാന കൃതന്തം സൂചിപ്പിക്കുന്ന തുടരുന്ന അഥവാ അടുത്തുനിൽക്കുന്ന ദാനപ്രവൃത്തി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ പേരായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘താഴേക്ക്’ എന്നും ‘തിരികെ’ എന്നും ഉപയോഗിച്ച് മൂലത്തിലെ ദിശയും മടങ്ങിവരവിന്റെ സൂചനയും നിലനിർത്തിയിരിക്കുന്നു; എങ്കിലും വാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി ഒഴുകുന്നവിധം ക്രമപ്പെടുത്തിയിരിക്കുന്നു.
