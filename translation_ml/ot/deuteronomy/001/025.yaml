    rationale: וַיָּשִׁבוּ אֹתָנוּ דָבָר എന്നത് റിപ്പോർട്ട് അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. മുഖ്യപാഠത്തിൽ ‘ഞങ്ങളോടു വിവരം അറിയിച്ചു’ സ്വാഭാവികമാണ്; ‘തിരികെ കൊണ്ടുവന്നു’ എന്ന അക്ഷരാർഥം കുറിപ്പിൽ നിലനിർത്താം.
