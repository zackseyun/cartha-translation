revisions:
- from: 'അവർ ദേശത്തിലെ ഫലങ്ങളിൽ ചിലത് കൈയിൽ എടുത്ത് ഞങ്ങളുടെ അടുക്കൽ താഴേക്ക് കൊണ്ടുവന്നു. എന്നിട്ട് അവർ ഞങ്ങൾക്ക് വിവരം തിരികെ കൊണ്ടുവന്ന് പറഞ്ഞു: “നമ്മുടെ ദൈവമായ യഹോവ നമുക്കു നൽകുന്ന ദേശം നല്ലതാണ്.”'
  to: 'അവർ ദേശത്തിലെ ഫലങ്ങളിൽ ചിലത് തങ്ങളുടെ കൈകളിൽ എടുത്ത് ഞങ്ങളുടെ അടുക്കലേക്ക് താഴേക്കു കൊണ്ടുവന്നു; അവർ ഞങ്ങളോടു വിവരം അറിയിച്ചു[a]: “നമ്മുടെ ദൈവമായ യാഹ്‌വേ നമുക്കു നൽകുന്ന ദേശം നല്ലതാണ്.”'
  rationale: ബഹുവചനമായ ‘കൈകളിൽ’ പുനഃസ്ഥാപിച്ചു; YHWH-നു POB-യുടെ Yahweh നയത്തോട് ചേരുന്ന ‘യാഹ്‌വേ’ ഉപയോഗിച്ചു; റിപ്പോർട്ട് അറിയിക്കുന്ന എബ്രായപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകി, അതിന്റെ ‘തിരികെ കൊണ്ടുവന്നു’ എന്ന ഔപചാരിക/അക്ഷരാർഥസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. ‘താഴേക്കു’യും ‘നമുക്കു നൽകുന്ന’ എന്ന രൂപവും മൂലത്തിലെ ദിശാസൂചനയും participial ഭാവവും നിലനിർത്തുന്നു.
