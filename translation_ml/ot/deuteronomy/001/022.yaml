source:
  edition: WLC
  text: וַ/תִּקְרְב֣וּ/ן אֵלַ/י֮ כֻּלְּ/כֶם֒ וַ/תֹּאמְר֗וּ נִשְׁלְחָ֤ה אֲנָשִׁים֙ לְ/פָנֵ֔י/נוּ וְ/יַחְפְּרוּ לָ֖/נוּ אֶת הָ/אָ֑רֶץ וְ/יָשִׁ֤בוּ אֹתָ֨/נוּ֙ דָּבָ֔ר אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר נַעֲלֶה בָּ֔/הּ וְ/אֵת֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר נָבֹ֖א אֲלֵי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: ml
  text: 'അപ്പോൾ നിങ്ങൾ എല്ലാവരും എന്റെ അടുത്തുവന്ന് പറഞ്ഞു: “നമുക്കു മുമ്പായി പുരുഷന്മാരെ അയയ്ക്കാം. അവർ നമുക്കുവേണ്ടി ദേശം അന്വേഷിച്ചറിയുകയും[a], നാം അതിലേക്കു കയറിച്ചെല്ലേണ്ട[b] വഴി ഏതെന്നും നാം ചെല്ലേണ്ട പട്ടണങ്ങൾ ഏതെന്നും നമ്മെ അറിയിക്കുകയും ചെയ്യട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശം ഒറ്റുനോക്കുക.’ എബ്രായ ക്രിയയ്ക്ക് അന്വേഷിക്കുക, പരിശോധിച്ചറിയുക, രഹസ്യമായി നിരീക്ഷിക്കുക എന്നീ അർഥങ്ങൾ സന്ദർഭാനുസരണം വരാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം: “നാം അതിൽ കയറിപ്പോകേണ്ട വഴി.” ദേശത്തേക്കു പ്രവേശിക്കുന്നതിനെ ‘കയറിപ്പോകുക’ എന്നു പറയുന്നത് ബൈബിളിൽ സാധാരണമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: അപ്പോൾ നിങ്ങൾ എല്ലാവരും എന്റെ അടുത്തുവന്ന്
  rationale: קָרַב എന്നതിന്റെ ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്ന മൂർത്തമായ അർഥവും כֻּלְּכֶם എന്ന ഊന്നലോടെയുള്ള ‘നിങ്ങൾ എല്ലാവരും’ എന്ന പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נִשְׁלְחָה אֲנָשִׁים
  choice: ചില പുരുഷന്മാരെ അയയ്ക്കാം
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിന്റെ നിർദേശഭാവം ‘അയയ്ക്കാം’ എന്നു നൽകുന്നു; אֲנָשִׁים ഇവിടെ തിരഞ്ഞെടുത്ത പ്രായപൂർത്തിയായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുരുഷന്മാർ’ എന്നു വിവർത്തനം ചെയ്തു. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘ചില’ ചേർത്തു.
- source_word: לְפָנֵינוּ
  choice: നമുക്കു മുമ്പായി
  rationale: മുൻകൂട്ടി പോകുന്ന ചലനത്തെ സൂചിപ്പിക്കുന്ന ‘ahead of us’ എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: അവർ നമുക്കുവേണ്ടി ദേശം അന്വേഷിച്ചറിയുകയും
  rationale: חָפַר എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ദേശത്തെ തിരഞ്ഞറിഞ്ഞ് പരിശോധിക്കുക എന്ന അർഥമുണ്ട്. ‘ചാരപ്പണി ചെയ്യുക’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത രഹസ്യപ്രവർത്തനത്തിന്റെ ഭാവം അധികമായി വരാം; അതിനാൽ ‘അന്വേഷിച്ചറിയുക’ തിരഞ്ഞെടുത്തു.
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: നമ്മെ അറിയിക്കുകയും ചെയ്യട്ടെ
  rationale: ഹിഫീൽ രൂപവും דָּבָר-ഉം ചേർന്ന പ്രയോഗത്തിന്റെ അർഥം ‘വിവരം തിരികെ കൊണ്ടുവരുക/അറിയിക്കുക’ എന്നാണ്. മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും ‘നമ്മെ അറിയിക്കുക’ എന്നു നൽകി.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: നാം അതിലേക്കു കയറിച്ചെല്ലേണ്ട വഴി ഏതെന്ന്
  rationale: דֶּרֶךְ എന്നത് ‘വഴി’ എന്നും עָלָה എന്നത് ‘കയറുക/മുകളിലേക്കു പോകുക’ എന്നും അർഥമാക്കുന്നു. ദേശത്തേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം നഷ്ടമാകാതിരിക്കാൻ ‘കയറിച്ചെല്ലുക’ ഉപയോഗിച്ചു.
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: നാം ചെല്ലേണ്ട പട്ടണങ്ങൾ ഏതെന്ന്
  rationale: പോകേണ്ട ലക്ഷ്യപട്ടണങ്ങളെക്കുറിച്ചുള്ള വിവരം എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘ചെല്ലേണ്ട’ എന്നത് സന്ദർഭത്തിലെ ആലോചനാത്മക ഭാവം നിലനിർത്തുന്നു.
