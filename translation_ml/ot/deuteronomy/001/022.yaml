translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. മൂലത്തിലെ നേരിട്ടുള്ള പ്രസംഗവും ‘നിങ്ങൾ എല്ലാവരും’ എന്ന ഊന്നലും ‘കയറുക’ എന്ന ദേശപ്രവേശനപ്രയോഗവും നിലനിർത്തി. പ്രധാനവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
