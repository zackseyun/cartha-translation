  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תָּשֻׁ֥בוּ וַ/תִּבְכּ֖וּ לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא שָׁמַ֤ע יְהוָה֙ בְּ/קֹ֣לְ/כֶ֔ם וְ/לֹ֥א הֶאֱזִ֖ין אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: ml
  text: അപ്പോൾ നിങ്ങൾ മടങ്ങിവന്ന് യാഹ്‌വേയുടെ സന്നിധിയിൽ കരഞ്ഞു. എന്നാൽ യാഹ്‌വേ നിങ്ങളുടെ സ്വരം കേട്ടില്ല[a]; നിങ്ങൾക്കു ചെവികൊടുത്തതുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ സ്വരത്തിനു ചെവികൊടുത്തില്ല.” ‘കേൾക്കുക’, ‘ചെവികൊടുക്കുക’ എന്നീ സമീപാർഥമുള്ള രണ്ടു ക്രിയകളാണ് എബ്രായത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നത്; യാഹ്‌വേ അവരുടെ അപേക്ഷയോട് പ്രതികരിച്ചില്ലെന്നതിന് ഇത് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: അപ്പോൾ നിങ്ങൾ മടങ്ങിവന്ന്
  rationale: שׁוּב എന്നത് ‘മടങ്ങുക/തിരിഞ്ഞുവരുക’ എന്നാണ്. തുടർച്ചയായ ആഖ്യാനക്രമവും പരാജയപ്പെട്ട ആക്രമണത്തിനുശേഷമുള്ള മടങ്ങിവരവും ‘അപ്പോൾ നിങ്ങൾ മടങ്ങിവന്ന്’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַתִּבְכּוּ
  choice: കരഞ്ഞു
  rationale: בכה എന്നത് ‘കരയുക/വിലപിക്കുക’ എന്നാണ്; മൂലപാഠത്തിൽ ഇല്ലാത്ത തീവ്രത ചേർക്കാതെ ഗൗരവമുള്ള ഭാവം നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിനാമംകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: എന്നാൽ യഹോവ നിങ്ങളുടെ സ്വരം കേട്ടില്ല
  rationale: שׁמע בְּקוֹל എന്ന പ്രയോഗത്തിന് കേൾക്കുക എന്നതിനൊപ്പം അനുസരിക്കുക/പ്രതികരിക്കുക എന്ന സൂചനയും ഉണ്ടാകാം. ‘സ്വരം കേട്ടില്ല’ എബ്രായ ദൃശ്യഭാഷ നിലനിർത്തുന്നു; ‘എന്നാൽ’ സന്ദർഭത്തിലെ വിരോധം വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: നിങ്ങൾക്കു ചെവികൊടുത്തതുമില്ല
  rationale: האזין എന്നത് ശ്രദ്ധയോടെ ചെവികൊടുക്കുക എന്നാണ്. ആദ്യത്തെ കേൾവിക്രിയയോടുള്ള സമാന്തരതയും ഊന്നലും മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ പദവിനാമമാക്കി മാറ്റാതെ, മലയാള വായനക്കാർക്കു പരിചിതമായ ലിപ്യന്തരണരൂപം നിലനിർത്തുന്നു.
- issue: യഹോവ ‘കേട്ടില്ല’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: കേൾവിയും ചെവികൊടുക്കലും സൂചിപ്പിക്കുന്ന മൂലരൂപം നിലനിർത്തുക
  alternative: യഹോവ അവരുടെ അപേക്ഷയ്ക്ക് ഉത്തരം നൽകിയില്ല
  rationale: സന്ദർഭത്തിൽ പ്രതികരിക്കാതിരുന്നതാണ് ഉദ്ദേശ്യമാകാമെങ്കിലും, മൂലപാഠത്തിലെ രണ്ടു സമീപാർഥ കേൾവിക്രിയകളെയും നിലനിർത്തുന്നത് യഥാർഥ ഭാഷയും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അനാവശ്യമായി വ്യാഖ്യാനിച്ച് തീർക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സന്നിധിയിൽ’, ‘ചെവികൊടുക്കുക’ എന്നീ പ്രയോഗങ്ങൾ വാക്യത്തിന്റെ ഗൗരവവും എബ്രായ സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു.
