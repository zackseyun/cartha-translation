  to: നാല്പതാം വർഷം, പതിനൊന്നാം മാസം, ആ മാസത്തിന്റെ ഒന്നാം തീയതിയിൽ, യഹോവ മോശയോട് ഇസ്രായേൽമക്കൾക്കായി കല്പിച്ചിരുന്നതെല്ലാം അനുസരിച്ച് മോശ അവരോടു സംസാരിച്ചു.[a]
  rationale: മുഖ്യപാഠം സ്രോതസ്സിനോടും സ്വാഭാവിക മലയാളപ്രയോഗത്തോടും യോജിക്കുന്നതിനാൽ അതു നിലനിർത്തി. എബ്രായത്തിലെ ചുരുക്കപ്പെട്ട אֹתוֹ אֲלֵהֶם ഘടനയെ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന വിധത്തിൽ ‘അക്ഷരാർഥം’ എന്നു അവതരിപ്പിച്ചിരുന്ന അടിക്കുറിപ്പ് മാത്രം കൃത്യവും വായനാസൗകര്യമുള്ളതുമായ രൂപത്തിലാക്കി; ഇതിലൂടെ മുഖ്യപാഠത്തിലെ ‘ഇസ്രായേൽമക്കൾക്കായി’ എന്ന സന്ദർഭാനുസൃത വായനയും ബദൽ വ്യാകരണസാധ്യതകളും സംരക്ഷിക്കപ്പെടുന്നു.
