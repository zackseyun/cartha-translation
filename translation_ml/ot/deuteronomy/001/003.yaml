id: DEU.1.3
reference: Deuteronomy 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֙ בְּ/אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: ml
  text: നാല്പതാം വർഷം, പതിനൊന്നാം മാസം, ആ മാസത്തിന്റെ ഒന്നാം തീയതിയിൽ, യഹോവ മോശയോട് ഇസ്രായേൽമക്കൾക്കായി കല്പിച്ചിരുന്നതെല്ലാം അനുസരിച്ച് മോശ അവരോടു സംസാരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, യഹോവ ‘അവനെ’ (മോശയെ) ‘അവരോടു/അവർക്കു’ കല്പിച്ചതെല്ലാം എന്നാണ് ചുരുക്കരൂപം. ഇതിനെ ‘അവരോടു പറയാൻ മോശയോടു കല്പിച്ചത്’ എന്നോ ‘അവരെ സംബന്ധിച്ച് മോശയോടു കല്പിച്ചത്’ എന്നോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്താതെ കാലസൂചനയുള്ള വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി)
  rationale: ഇവിടെ കഥാഖ്യാനപരമായ wayyiqtol കാലനിർണ്ണയവാക്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് അസ്വാഭാവികമായതിനാൽ, തീയതി പറഞ്ഞശേഷം മുഖ്യസംഭവം നേരിട്ട് അവതരിപ്പിക്കുന്നത് അതിന്റെ വ്യവഹാരധർമ്മം സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: നാല്പതാം വർഷം
  rationale: സംഖ്യയും ‘വർഷം’ എന്ന പദവും ചേർന്ന എബ്രായ പ്രയോഗം ഇവിടെ വർഷക്രമത്തിലെ നാല്പതാമത്തെ വർഷത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: പതിനൊന്നാം മാസം
  rationale: തീയതിസൂചനയായ എബ്രായ സംഖ്യാഘടനയുടെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: ആ മാസത്തിന്റെ ഒന്നാം തീയതിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘മാസത്തിലെ ഒന്നിൽ’; ആധുനിക മലയാളത്തിലെ വ്യക്തവും സ്വാഭാവികവുമായ തീയതിപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: דִּבֶּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘പ്രസംഗിച്ചു’ അല്ലെങ്കിൽ ‘പ്രഖ്യാപിച്ചു’ എന്നിങ്ങനെ സംസാരപ്രവൃത്തിയെ അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളോടു
  rationale: בני ישראל എന്ന കുടുംബബന്ധപരമായ മൂലരൂപം മലയാളത്തിൽ പതിവും മാന്യവുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: כְּכֹל אֲשֶׁר
  choice: എല്ലാം അനുസരിച്ച്
  rationale: כְּ എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്ന അനുരൂപതയും כֹּל സൂചിപ്പിക്കുന്ന സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചിരുന്നതെല്ലാം
  rationale: യഹോവയുടെ കല്പന മോശയുടെ സംസാരത്തിന് മുമ്പുണ്ടായതാണെന്ന ക്രമം മലയാളത്തിലെ പൂർവകാലരൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֹתוֹ אֲלֵהֶם
  choice: മോശയോട് ഇസ്രായേൽമക്കൾക്കായി
  rationale: അക്ഷരാർഥഘടന ‘അവനെ അവരിലേക്കു/അവരോടു കല്പിച്ചു’ എന്നതുപോലെ ചുരുക്കപ്പെട്ടതാണ്. കല്പന സ്വീകരിച്ചത് മോശയും അതിന്റെ ലക്ഷ്യവിഭാഗം ഇസ്രായേൽമക്കളുമാണെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അടിസ്ഥിതമായ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ പദവിയാക്കി മാറ്റാതെ, മലയാള ബൈബിൾ ഭാഷയിൽ വ്യാപകമായി അറിയപ്പെടുന്ന വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- issue: אֹתוֹ אֲלֵהֶם എന്ന ചുരുക്കപ്പെട്ട ഘടനയുടെ അർഥം
  choice: മോശയോട് ഇസ്രായേൽമക്കൾക്കായി കല്പിച്ചു
  alternative: മോശയോട് അവരോടു പറയാൻ കല്പിച്ചു; അവരെക്കുറിച്ച് മോശയോട് കല്പിച്ചു
  rationale: സന്ദർഭത്തിൽ മോശ ഇസ്രായേലിനോടു സംസാരിക്കുന്നതിനുള്ള ദൈവകല്പനയാണ് ഉദ്ദേശ്യം. എന്നിരുന്നാലും אֲלֵיהֶם എന്നതിന്റെ ‘അവരിലേക്കു/അവരോടു’ എന്ന ദിശാസൂചനയും ‘അവരെ സംബന്ധിച്ച്’ എന്ന സാധ്യതയും പൂർണമായി ഏകാർഥമല്ലാത്തതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘വന്നു ഭവിച്ചു’ പോലുള്ള പഴയ കഥാഖ്യാനപ്രയോഗങ്ങൾ ഒഴിവാക്കി. ‘ഇസ്രായേൽമക്കൾ’, ‘കല്പിച്ചു’, ‘യഹോവ’ എന്നിവ തിരുവെഴുത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതിനൊപ്പം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപങ്ങളാണ്.
