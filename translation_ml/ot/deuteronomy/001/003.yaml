  source_fidelity: മുഖ്യവാക്യം എബ്രായ തീയതിസൂചനയും മോശ ഇസ്രായേൽമക്കളോടു സംസാരിച്ചതും യഹോവ മോശയോടു കല്പിച്ച കാര്യങ്ങളോടുള്ള അനുരൂപതയും വിശ്വസ്തമായി കൈമാറുന്നു. ആരംഭത്തിലെ וַיְהִי പ്രത്യേകം വിവർത്തനം ചെയ്യാതിരിക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചനയിലൂടെ സ്വീകരിക്കാവുന്നതാണ്. אֹתוֹ אֲלֵהֶם എന്ന ചുരുക്കഘടനയുടെ ബന്ധം വ്യാഖ്യാനപരമായി ‘ഇസ്രായേൽമക്കൾക്കായി’ എന്നു നൽകിയിട്ടുണ്ടെങ്കിലും അതിന്റെ വ്യാകരണാവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തേണ്ടതാണ്.
  naturalness: ‘നാല്പതാം വർഷം, പതിനൊന്നാം മാസം, ആ മാസത്തിന്റെ ഒന്നാം തീയതിയിൽ’ എന്ന തീയതിപ്രയോഗവും ‘ഇസ്രായേൽമക്കളോടു സംസാരിച്ചു’ എന്ന വാക്യവും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. മുഖ്യപാഠത്തിൽ മാറ്റം ആവശ്യമില്ല.
  terminology: ‘യഹോവ,’ ‘മോശ,’ ‘ഇസ്രായേൽമക്കൾ,’ ‘കല്പിച്ചു’ എന്നിവ സ്ഥിരതയുള്ളതും അനുയോജ്യമായ തിരുവെഴുത്തു-രജിസ്റ്ററിലുള്ളതുമാണ്. അടിക്കുറിപ്പിലെ ‘അക്ഷരാർഥത്തിൽ’ എന്ന അവകാശവാദം എന്നാൽ മലയാളത്തിൽ സ്വാഭാവികമല്ലാത്തതും എബ്രായ ചുരുക്കഘടനയെ ആവശ്യത്തിന് കൃത്യമായി വിശദീകരിക്കാത്തതുമാണ്.
