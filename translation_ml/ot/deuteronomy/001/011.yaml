  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֣י אֲבֽוֹתֵ/כֶ֗ם יֹסֵ֧ף עֲלֵי/כֶ֛ם כָּ/כֶ֖ם אֶ֣לֶף פְּעָמִ֑ים וִ/יבָרֵ֣ךְ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: ml
  text: നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവമായ യാഹ്‌വേ, നിങ്ങളുടെ എണ്ണം നിങ്ങൾ ഇപ്പോഴുള്ളതിന്റെ ആയിരം മടങ്ങായി വർധിപ്പിക്കട്ടെ; നിങ്ങളോടു പറഞ്ഞതുപോലെ നിങ്ങളെ അനുഗ്രഹിക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം ഒരു പദവികൊണ്ട് മാറ്റിസ്ഥാപിക്കാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള നാമരൂപമായി നൽകി.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: എബ്രായത്തിലെ പദശഃ അർഥവും ഗോത്രപിതാക്കന്മാരുമായുള്ള ഉടമ്പടിബന്ധവും നിലനിർത്തുന്നു.
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  choice: നിങ്ങളെ ഇപ്പോഴുള്ളതിന്റെ ആയിരം മടങ്ങായി വർധിപ്പിക്കട്ടെ
  rationale: ‘കൂട്ടിച്ചേർക്കുക’ എന്ന മൂലദൃശ്യത്തെക്കാൾ സന്ദർഭത്തിലെ ജനസംഖ്യാവർധന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; כָּכֶם അവരുടെ നിലവിലുള്ള എണ്ണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: നിങ്ങളെ അനുഗ്രഹിക്കട്ടെ
  rationale: തുടർന്നുവരുന്ന ആശംസാസ്വഭാവം മലയാളത്തിൽ രണ്ടാമത്തെ ആശംസാക്രിയയിലൂടെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: നിങ്ങളോടു അരുളിച്ചെയ്തതുപോലെ
  rationale: דבר എന്നതിന്റെ ‘സംസാരിക്കുക/പറയുക’ എന്ന വിശാലത നിലനിർത്തുകയും ‘വാഗ്ദാനം ചെയ്തു’ എന്ന സന്ദർഭവ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിതമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് സുപരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു.
- issue: אֲבֹתֵיכֶם എന്ന പൂർവികസൂചന
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  alternative: നിങ്ങളുടെ പൂർവികർ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചനവും ഗോത്രപിതാക്കന്മാരോടുള്ള ഉടമ്പടിസൂചനയും നിലനിർത്തുന്നു.
- issue: דִּבֶּר എന്ന ക്രിയയുടെ വാഗ്ദാനാർഥ വ്യാഖ്യാനം
  choice: അരുളിച്ചെയ്തു
  alternative: വാഗ്ദാനം ചെയ്തു
  rationale: ദൈവിക പ്രസ്താവനയുടെ മാന്യഭാവം നൽകുമ്പോഴും മൂലക്രിയയുടെ വിശാലമായ ‘പറഞ്ഞു’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; വാഗ്ദാനം എന്ന വ്യാഖ്യാനം മാത്രം നിർബന്ധമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് സ്വാഭാവികവുമായ മലയാളം. ‘അരുളിച്ചെയ്തു’ ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ ഉന്നതരജിസ്റ്റർ പദമാണ്; വാക്യം അനാവശ്യമായി പുരാതനശൈലിയിലാക്കിയിട്ടില്ല.
