revisions:
- from: നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവമായ യഹോവ നിങ്ങളെ ഇപ്പോഴുള്ളതിന്റെ ആയിരം മടങ്ങായി വർധിപ്പിക്കട്ടെ; നിങ്ങളോടു അരുളിച്ചെയ്തതുപോലെ നിങ്ങളെ അനുഗ്രഹിക്കട്ടെ.
