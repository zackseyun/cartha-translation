reference: Deuteronomy 1:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/טַפְּ/כֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָ/בַ֣ז יִהְיֶ֗ה וּ֠/בְנֵי/כֶם אֲשֶׁ֨ר לֹא יָדְע֤וּ הַ/יּוֹם֙ ט֣וֹב וָ/רָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּ/ה וְ/לָ/הֶ֣ם אֶתְּנֶ֔/נָּה וְ/הֵ֖ם יִירָשֽׁוּ/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: ml
  text: നിങ്ങൾ കൊള്ളയായിത്തീരുമെന്നു പറഞ്ഞ നിങ്ങളുടെ കുഞ്ഞുങ്ങളും[a], ഇന്ന് നന്മയും തിന്മയും അറിയാത്ത[c] നിങ്ങളുടെ മക്കളും—അവർ അവിടെ പ്രവേശിക്കും. അവർക്കു ഞാൻ ആ ദേശം കൊടുക്കും; അവർ അതു കൈവശമാക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൊള്ളമുതലായിത്തീരുമെന്നു’ അല്ലെങ്കിൽ ‘ഇരയായിത്തീരുമെന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അത് അവകാശമായി നേടും.’
    reason: lexical_alternative
  - marker: c
    text: ‘നന്മയും തിന്മയും അറിയാത്ത’ എന്നത് പക്വമായ വിവേചനശേഷി ഇല്ലായ്മയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: טַפְּכֶם
  choice: നിങ്ങളുടെ കുഞ്ഞുങ്ങൾ
  rationale: טַף ചെറിയ കുട്ടികളെയോ ആശ്രിതരെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ അവരുടെ ദുർബലാവസ്ഥയും മുതിർന്ന തലമുറയുമായുള്ള വ്യത്യാസവും ‘കുഞ്ഞുങ്ങൾ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לָבַז יִהְיֶה
  choice: കൊള്ളയായിത്തീരും
  rationale: בַּז ശത്രു പിടിച്ചെടുക്കുന്ന കൊള്ളയെയോ കൊള്ളമുതലിനെയോ സൂചിപ്പിക്കുന്നു. ഇസ്രായേല്യർ ഭയന്ന ഭാവിഫലം മലയാളത്തിൽ സംക്ഷിപ്തമായും വ്യക്തമായും ഇതു പ്രകടിപ്പിക്കുന്നു.
- source_word: בְנֵיכֶם
  choice: നിങ്ങളുടെ മക്കൾ
  rationale: בנים എന്ന പുല്ലിംഗ ബഹുവചനം സന്ദർഭത്തിൽ അടുത്ത തലമുറയിലെ കുട്ടികളെ സമഗ്രമായി സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘മക്കൾ’ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമാണ്; തൊട്ടുമുമ്പുള്ള טף-നോടുള്ള പദവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: ഇന്ന് നന്മതിന്മകൾ തിരിച്ചറിയാത്ത
  rationale: മൂലത്തിലെ ‘നന്മയും തിന്മയും അറിയുക’ എന്ന പ്രയോഗം പക്വമായ വിവേചനശേഷിയുടെ അഭാവം സൂചിപ്പിക്കുന്നു. ‘തിരിച്ചറിയാത്ത’ എന്നത് ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; നിരപരാധിത്വത്തെക്കുറിച്ചോ ഉത്തരവാദിത്വപ്രായത്തെക്കുറിച്ചോ ഒരു സിദ്ധാന്തനിഗമനം ചേർക്കുന്നില്ല.
- source_word: שָׁמָּה
  choice: അവിടെ പ്രവേശിക്കും
  rationale: ചർച്ചചെയ്യപ്പെട്ട ദേശത്തേക്കുള്ള ചലനമാണ് ശബ്ദം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘അവിടെ പ്രവേശിക്കും’ എന്നത് ‘അവിടേക്കു ചെല്ലും’ എന്നതിനെക്കാൾ ദേശപ്രവേശത്തിന്റെ സന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: אֶתְּנֶנָּה
  choice: ആ ദേശം കൊടുക്കും
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുമ്പ് പരാമർശിച്ച ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അവ്യക്തമായ ‘അത്’ എന്നതിനുപകരം സൂചിതനാമമായ ‘ആ ദേശം’ ചേർക്കുന്നത് വ്യക്തത നൽകുന്നു.
- source_word: יִירָשׁוּהָ
  choice: അതു കൈവശമാക്കും
  rationale: ירשׁ സന്ദർഭാനുസരണം അവകാശമാക്കുക, കൈവശപ്പെടുത്തുക, അവകാശമായി നേടുക എന്നീ അർഥങ്ങൾക്കു വരാം. ഇവിടെ വാഗ്ദത്തദേശം സ്വീകരിച്ച് അധീനമാക്കുന്നതിനെ ‘കൈവശമാക്കും’ വിശാലമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘നന്മതിന്മകൾ അറിയാത്തവർ’ എന്നതിൽ അടുത്ത തലമുറയുടെ ധാർമികാവസ്ഥ
  choice: പക്വമായ വിവേചനശേഷിയുടെ അഭാവം സൂചിപ്പിക്കുന്ന പ്രയോഗമായി വിവർത്തനം ചെയ്തു.
  alternative: നിയമപരമായ നിരപരാധിത്വമോ ഉടമ്പടിസംബന്ധമായ ഉത്തരവാദിത്വമില്ലായ്മയോ വ്യക്തമാക്കുന്ന പ്രസ്താവനയായി വിവർത്തനം ചെയ്യുക.
  rationale: വാക്യം വിധിക്കപ്പെട്ട മുതിർന്ന തലമുറയെയും അവരുടെ മക്കളെയും വേർതിരിക്കുന്നു; എന്നാൽ ഉത്തരവാദിത്വപ്രായം പോലുള്ള പിൽക്കാല ദൈവശാസ്ത്രചോദ്യങ്ങൾക്ക് ഈ എബ്രായ പ്രയോഗം സ്വയം തീർപ്പുനൽകുന്നില്ല. അതിനാൽ ആ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തി.
- issue: יִירָשׁוּהָ എന്ന ക്രിയയിലെ അവകാശവും കൈവശപ്പെടുത്തലും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: ‘അതു കൈവശമാക്കും’ എന്ന് നൽകി.
  alternative: ‘അത് അവകാശമായി നേടും’ എന്ന് നൽകുക.
  rationale: ദേശത്തിന്റെ ദൈവദത്ത സ്വഭാവം മുൻവാക്യത്തിലെ ‘ഞാൻ കൊടുക്കും’ വ്യക്തമാക്കുന്നു. ക്രിയയെ ‘കൈവശമാക്കും’ എന്നു നൽകുന്നത് അവകാശം എന്ന ഏക അർഥത്തിലേക്ക് ചുരുക്കാതെ അധീനതയും വാസവും ഉൾക്കൊള്ളുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദീർഘമായ എബ്രായ വാക്യത്തെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ആവർത്തനവും ഊന്നലും നിലനിർത്തി. പ്രധാനപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അനുയോജ്യസ്ഥാനങ്ങളിൽ ചേർത്തിട്ടുണ്ട്.
