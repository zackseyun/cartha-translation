language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הָב֣וּ לָ֠/כֶם אֲנָשִׁ֨ים חֲכָמִ֧ים וּ/נְבֹנִ֛ים וִ/ידֻעִ֖ים לְ/שִׁבְטֵי/כֶ֑ם וַ/אֲשִׂימֵ֖/ם בְּ/רָאשֵׁי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/013.yaml
  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: ml
  text: ജ്ഞാനികളും വിവേകികളുമായ, നിങ്ങളുടെ ഗോത്രങ്ങളിൽ അറിയപ്പെടുന്ന[a] പുരുഷന്മാരെ നിങ്ങൾക്കായി തിരഞ്ഞെടുക്കുക; ഞാൻ അവരെ നിങ്ങളുടെ തലവന്മാരായി[b] നിയമിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അംഗീകരിക്കപ്പെട്ടവരായ’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായപദം ഗോത്രങ്ങൾക്കിടയിൽ നല്ല പേരും അംഗീകാരവും നേടിയവരെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നേതാക്കന്മാരായി.’ അക്ഷരാർഥം ‘തലവന്മാരായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: തിരഞ്ഞെടുക്കുക
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘തരുക/കൊണ്ടുവരുക’ എന്നാകാമെങ്കിലും, യോഗ്യരായ പുരുഷന്മാരെ ജനങ്ങൾ നിർദേശിക്കുകയും മോശെ അവരെ നിയമിക്കുകയും ചെയ്യുന്ന ഈ സന്ദർഭത്തിൽ ‘തിരഞ്ഞെടുക്കുക’ എന്നത് ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കായി
  rationale: ജനങ്ങൾ സ്വന്തം സമൂഹത്തിനുവേണ്ടി തിരഞ്ഞെടുപ്പ് നടത്തുന്നു എന്ന ദാതൃക/പ്രതിഫലന സൂചന നിലനിർത്തുന്നു.
- source_word: אֲנָשִׁים
  choice: പുരുഷന്മാർ
  rationale: എബ്രായപദം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമാണ്; ഇവിടെ ഗോത്രനേതൃത്വത്തിനായി പരിഗണിക്കപ്പെടുന്ന പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: חֲכָמִים
  choice: ജ്ഞാനികൾ
  rationale: നേതൃത്വത്തിനും ന്യായവിധിക്കും ആവശ്യമായ ജ്ഞാനത്തെയും നല്ല വിവേചനശേഷിയെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: וּנְבֹנִים
  choice: വിവേകികൾ
  rationale: בין എന്ന ധാതുവിൽനിന്നുള്ള ഈ പദം കാര്യങ്ങൾ ഗ്രഹിച്ച് ശരിയായി വിലയിരുത്താനുള്ള കഴിവ് സൂചിപ്പിക്കുന്നു; ‘വിവേകികൾ’ ആ പ്രായോഗിക ബോധം വ്യക്തമാക്കുന്നു.
- source_word: וִידֻעִים
  choice: അറിയപ്പെടുന്നവർ
  rationale: ידע എന്ന ധാതുവിന്റെ നിഷ്ക്രിയരൂപം ഗോത്രങ്ങൾക്കിടയിൽ അറിയപ്പെടുന്നവരോ അംഗീകരിക്കപ്പെട്ടവരോ ആയ ആളുകളെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ അർഥവ്യാപ്തി ചുരുക്കാതെ ‘അറിയപ്പെടുന്നവർ’ എന്നു നൽകി.
- source_word: לְשִׁבְטֵיכֶם
  choice: നിങ്ങളുടെ ഗോത്രങ്ങളിൽ
  rationale: ഇവിടെ לְ എന്നത് ആ പുരുഷന്മാർ ഗോത്രങ്ങൾക്ക് അറിയപ്പെട്ടവരാണ് എന്ന ബന്ധം സൂചിപ്പിക്കാം. മലയാളത്തിൽ ‘നിങ്ങളുടെ ഗോത്രങ്ങളിൽ അറിയപ്പെടുന്നവർ’ എന്നത് ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു; തിരഞ്ഞെടുപ്പിന്റെ ഗോത്രാധിഷ്ഠിത പശ്ചാത്തലവും നിലനിൽക്കുന്നു.
- source_word: וַאֲשִׂימֵם
  choice: ഞാൻ അവരെ നിയമിക്കും
  rationale: ജനങ്ങളുടെ തിരഞ്ഞെടുപ്പിനെത്തുടർന്ന് മോശെ അവരെ ഔദ്യോഗിക സ്ഥാനത്ത് സ്ഥാപിക്കുന്നതാണ് സന്ദർഭം; അതിനാൽ ‘നിയമിക്കും’ യോജിക്കുന്നു.
- source_word: בְּרָאשֵׁיכֶם
  choice: നിങ്ങളുടെ തലവന്മാരായി
  rationale: רֹאשׁ എന്ന ‘തല’ രൂപകം സംരക്ഷിച്ചുകൊണ്ട് നേതൃത്വസ്ഥാനം വ്യക്തമാക്കുന്ന നിലവാരമുള്ള മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: אֲנָשִׁים എന്ന ലിംഗസൂചക നേതൃത്വപദം
  choice: പുരുഷന്മാർ
  alternative: ആളുകൾ
  rationale: മൂലപദം പുല്ലിംഗ ബഹുവചനമാണ്; പുരാതന ഇസ്രായേലിന്റെ ഗോത്രനേതൃത്വസന്ദർഭത്തിൽ ആ സൂചന ലിംഗനിരപേക്ഷമാക്കി മാറ്റാതെ നിലനിർത്തി.
- issue: וִידֻעִים לְשִׁבְטֵיכֶם എന്നതിന്റെ ബന്ധം
  choice: ഗോത്രങ്ങളിൽ അറിയപ്പെടുന്നവർ
  alternative: ഗോത്രങ്ങളിൽനിന്നുള്ളവർ / പരിചയസമ്പന്നർ
  rationale: വാക്യഘടന പ്രകാരം לְשִׁבְטֵיכֶם എന്നത് ‘അറിയപ്പെടുന്നവർ’ എന്ന പദത്തോടു ചേർന്ന് ഗോത്രങ്ങളുടെ അംഗീകാരമോ പരിചയമോ സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ട്. അതിനെ ഉറപ്പായും ‘പരിചയസമ്പന്നർ’ എന്നു വ്യാഖ്യാനിക്കാതെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ‘തലവന്മാർ’ എന്ന മൂലരൂപകം നിലനിർത്തുകയും അതിന്റെ ആശയാർഥമായ ‘നേതാക്കന്മാർ’ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
