  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה אֶת ק֣וֹל דִּבְרֵי/כֶ֑ם וַ/יִּקְצֹ֖ף וַ/יִּשָּׁבַ֥ע לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/034.yaml
  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ നിങ്ങളുടെ വാക്കുകളുടെ ശബ്ദം[a] കേട്ടു; അവൻ കോപിച്ചു, ഇങ്ങനെ ശപഥം ചെയ്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിങ്ങളുടെ വാക്കുകളുടെ സ്വരം.”'
    reason: എബ്രായത്തിലെ קוֹל דִּבְרֵיכֶם എന്ന പദപ്രയോഗത്തിന്റെ അക്ഷരാർഥപരമായ മറ്റൊരു അവതരണം അറിയിക്കാൻ.
lexical_decisions:
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיִּשְׁמַע
  choice: കേട്ടു
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ שׁמע എന്ന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ അർഥം നൽകുന്നു.
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: നിങ്ങളുടെ വാക്കുകളുടെ ശബ്ദം
  rationale: קוֹל എന്നതിലെ ‘ശബ്ദം/സ്വരം’ എന്ന ഘടകവും דִּבְרֵיכֶם എന്നതിലെ ‘നിങ്ങളുടെ വാക്കുകൾ’ എന്ന ഘടകവും നിലനിർത്തി എബ്രായ പ്രയോഗത്തിന്റെ രൂപം സുതാര്യമാക്കുന്നു.
- source_word: וַיִּקְצֹף
  choice: കോപിച്ച്
  rationale: קצף സൂചിപ്പിക്കുന്ന കോപം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּשָּׁבַע
  choice: സത്യം ചെയ്തു
  rationale: שׁבע എന്ന ക്രിയയുടെ ശപഥം ചെയ്യുക എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ ഘടന മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ധരണി-ആമുഖമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ക്രിയാക്രമം നിലനിർത്തിക്കൊണ്ട് വാക്യാവസാനത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിനുള്ള ആമുഖം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
