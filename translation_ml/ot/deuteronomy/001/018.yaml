  text: And at that time I commanded you all the things that you should do[a].
translation:
  language: ml
  text: ആ സമയത്ത് നിങ്ങൾ ചെയ്യേണ്ട എല്ലാ കാര്യങ്ങളും ഞാൻ നിങ്ങളോടു കൽപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എല്ലാ വാക്കുകളും” അല്ലെങ്കിൽ “എല്ലാ വിഷയങ്ങളും”; എബ്രായത്തിലെ דְּבָרִים എന്ന പദം പറഞ്ഞ നിർദേശങ്ങളെയോ നടപ്പാക്കേണ്ട കാര്യങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: ഞാൻ കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ ആധികാരികമായ ആജ്ഞാഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶתְכֶם
  choice: നിങ്ങളോടു
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ വാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: בָּעֵת הַהִוא
  choice: ആ സമയത്ത്
  rationale: എബ്രായത്തിലെ സാധാരണ കാലസൂചക പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: എല്ലാ കാര്യങ്ങളും
  rationale: דְּבָרִים എന്ന പദത്തിന് വാക്കുകൾ, കാര്യങ്ങൾ, വിഷയങ്ങൾ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ നടപ്പാക്കേണ്ട നിർദേശങ്ങളാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר תַּעֲשׂוּן
  choice: നിങ്ങൾ ചെയ്യേണ്ടതായിരുന്ന
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള അപൂർണകാല ക്രിയ നിർവഹിക്കേണ്ട ബാധ്യതയെ സൂചിപ്പിക്കുന്നു; അതിനെ അതിരുകടന്ന് ശക്തിപ്പെടുത്താതെ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആജ്ഞയുടെ അധികാരഭാവം നിലനിർത്തിയിരിക്കെ דְּבָרִים എന്ന പദത്തിന്റെ യഥാർഥമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
