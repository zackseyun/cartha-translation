source:
  edition: WLC
  text: וָ/אֹמַ֣ר אֲלֵ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר לֹא אוּכַ֥ל לְ/בַדִּ֖/י שְׂאֵ֥ת אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/009.yaml
  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: ml
  text: 'ആ സമയത്ത് ഞാൻ നിങ്ങളോടു പറഞ്ഞു: “എനിക്ക് ഒറ്റയ്ക്ക് നിങ്ങളെ വഹിക്കാൻ കഴിയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: ആ സമയത്ത്
  rationale: ഹീബ്രു സമയസൂചനയുടെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: לֵאמֹר
  choice: 'പറഞ്ഞു:'
  rationale: ഹീബ്രുവിലെ ഉദ്ധരണി-ആമുഖം മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്ന ക്രിയയ്ക്കും ദ്വിബിന്ദുവിനും വഴി സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ആവർത്തിക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമായി കൃത്രിമമാകും.
- source_word: לְבַדִּי
  choice: ഒറ്റയ്ക്ക്
  rationale: ‘ഞാൻ മാത്രം’ എന്ന ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: שְׂאֵת אֶתְכֶם
  choice: നിങ്ങളെ വഹിക്കാൻ
  rationale: נשא എന്ന ക്രിയയുടെ ‘വഹിക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; ജനത്തെ നയിക്കുന്നതിന്റെ ഭാരമെന്ന സന്ദർഭാർഥം വിശദീകരിച്ച് മൂലത്തിലെ രൂപകം ഇല്ലാതാക്കുന്നില്ല.
theological_decisions:
- issue: മോശെ ജനത്തെ ‘വഹിക്കുക’ എന്ന രൂപകത്തിന്റെ പരിധി
  choice: വഹിക്കാൻ
  alternative: നിങ്ങളുടെ ഭാരം ചുമക്കാൻ / നിങ്ങളെ നയിക്കാൻ
  rationale: മൂലപാഠത്തിലെ രൂപകവും അതിലെ അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു; ഭരണപരമായ നേതൃത്വം മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കനുസരിച്ച് ക്രമപ്പെടുത്തി; ഉദ്ധരണി-ആമുഖത്തിലെ לֵאמֹר പ്രത്യേകമായി ആവർത്തിക്കാതെ വിരാമചിഹ്നത്തിലൂടെ പ്രകടമാക്കി.
