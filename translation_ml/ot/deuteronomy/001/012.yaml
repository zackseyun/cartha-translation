translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ മൂന്നു സമാന്തര നാമങ്ങളും വാചാടോപചോദ്യത്തിന്റെ ശക്തിയും നിലനിർത്തിയിരിക്കുന്നു.
