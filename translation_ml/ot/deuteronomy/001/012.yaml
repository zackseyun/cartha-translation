  text: אֵיכָ֥ה אֶשָּׂ֖א לְ/בַדִּ֑/י טָרְחֲ/כֶ֥ם וּ/מַֽשַּׂאֲ/כֶ֖ם וְ/רִֽיבְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/012.yaml
  text: How can I alone bear your trouble[a], your burden, and your disputes?
translation:
  language: ml
  text: നിങ്ങളുടെ ക്ലേശവും നിങ്ങളുടെ ഭാരവും നിങ്ങളുടെ തർക്കങ്ങളും ഞാൻ ഒറ്റയ്ക്ക് എങ്ങനെ വഹിക്കും?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തർക്കങ്ങൾ” എന്നതിന് “കലഹങ്ങൾ” അല്ലെങ്കിൽ “നിയമവ്യവഹാരങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: എങ്ങനെ
  rationale: പ്രയാസമോ അസാധ്യതയോ പ്രകടിപ്പിക്കുന്ന വാചാടോപചോദ്യമായി സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶשָּׂא
  choice: വഹിക്കും
  rationale: ഉത്തരവാദിത്വവും ഭാരവും ഏറ്റെടുത്തു കൊണ്ടുപോകുക എന്ന രൂപകാർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള മൂന്നു അമൂർത്ത നാമങ്ങളോടും ചേരുന്നു.
- source_word: לְבַדִּי
  choice: ഞാൻ ഒറ്റയ്ക്ക്
  rationale: മോശയ്ക്ക് തനിച്ച് ഈ കാര്യങ്ങൾ കൈകാര്യം ചെയ്യാനാകില്ലെന്ന ഊന്നൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: טָרְחֲכֶם
  choice: നിങ്ങൾ വരുത്തുന്ന കഷ്ടപ്പാട്
  rationale: മോശയ്ക്ക് ജനം സൃഷ്ടിക്കുന്ന ക്ലേശകരമായ അധ്വാനഭാരം സൂചിപ്പിക്കുകയും അടുത്ത പദമായ ‘ഭാരം’ എന്നതിൽനിന്ന് അർഥവ്യത്യാസം കാക്കുകയും ചെയ്യുന്നു.
- source_word: מַשַּׂאֲכֶם
  choice: നിങ്ങളുടെ ഭാരം
  rationale: ചുമക്കേണ്ട ഭാരം എന്ന അടിസ്ഥാനരൂപകം സംരക്ഷിക്കുന്ന നേരായതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: רִיבְכֶם
  choice: നിങ്ങളുടെ തർക്കങ്ങൾ
  rationale: പരസ്പര കലഹവും ന്യായവിധിക്കായി വരുന്ന കേസുകളും ഉൾക്കൊള്ളാൻ കഴിയുന്ന പൊതുവായ മലയാളപദം; നിയമപരമായ സൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
