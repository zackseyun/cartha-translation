revisions:
- from: ന്യായവിധിയിൽ പക്ഷപാതം കാണിക്കരുത്[a]. ചെറിയവന്റെയും വലിയവന്റെയും വാദം ഒരുപോലെ കേൾക്കണം. ഒരു മനുഷ്യനെയും ഭയപ്പെടരുത്; ന്യായവിധി ദൈവത്തിനുള്ളതാകുന്നു. നിങ്ങൾക്കു തീർപ്പാക്കാൻ പ്രയാസമുള്ള കാര്യം എന്റെ അടുക്കൽ കൊണ്ടുവരണം; ഞാൻ അതു കേൾക്കും.
  to: ന്യായവിധിയിൽ പക്ഷപാതം കാണിക്കരുത്[a]. ചെറിയവനെയും വലിയവനെയും ഒരുപോലെ കേൾക്കണം. ഒരു മനുഷ്യന്റെ മുമ്പിലും ഭയപ്പെടരുത്; ന്യായവിധി ദൈവത്തിന്റേതാണ്. നിങ്ങൾക്കു തീർപ്പാക്കാൻ പ്രയാസമുള്ള കാര്യം എന്റെ അടുക്കൽ കൊണ്ടുവരണം; ഞാൻ അതു കേൾക്കും.
  rationale: 'The revision directly preserves the Hebrew pairing ‘the small and the great’ rather than making their arguments the object of hearing. It also uses a more natural modern Malayalam expression for judgment’s belonging to God and renders ‘before a man’ more closely, without adding interpretive content. No additional footnote is needed: the principal Malayalam wording ‘ഭയപ്പെടരുത്’ already represents the lexical alternative noted in the English audit trail, and the English [b] anchor is not semantically aligned with its placement.'
