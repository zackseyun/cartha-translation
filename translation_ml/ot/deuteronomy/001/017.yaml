id: DEU.1.17
reference: Deuteronomy 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: ml
  text: ന്യായവിധിയിൽ പക്ഷപാതം കാണിക്കരുത്[a]. ചെറിയവനെയും വലിയവനെയും ഒരുപോലെ കേൾക്കണം. ഒരു മനുഷ്യന്റെ മുമ്പിലും ഭയപ്പെടരുത്; ന്യായവിധി ദൈവത്തിന്റേതാണ്. നിങ്ങൾക്കു തീർപ്പാക്കാൻ പ്രയാസമുള്ള കാര്യം എന്റെ അടുക്കൽ കൊണ്ടുവരണം; ഞാൻ അതു കേൾക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ന്യായവിധിയിൽ മുഖങ്ങൾ തിരിച്ചറിയരുത്’; പക്ഷപാതം കാണിക്കരുത് എന്നർഥമുള്ള ഒരു ഹീബ്രു ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: പക്ഷപാതം കാണിക്കരുത്
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖങ്ങൾ തിരിച്ചറിയുക’ എന്നാണെങ്കിലും, ന്യായവ്യവഹാരത്തിൽ ഈ പ്രയോഗം പക്ഷപാതമോ പ്രീതിപക്ഷമോ കാണിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בַּמִּשְׁפָּט
  choice: ന്യായവിധിയിൽ
  rationale: ഇവിടെ പദം അമൂർത്തമായ നീതിയെക്കാൾ കേസുകൾ കേട്ട് വിധിക്കുന്ന ന്യായനടപടിയെ സൂചിപ്പിക്കുന്നു.
- source_word: כַּקָּטֹן כַּגָּדֹל
  choice: ചെറിയവന്റെയും വലിയവന്റെയും ... ഒരുപോലെ
  rationale: താഴ്ന്നതും ഉയർന്നതുമായ സാമൂഹിക നിലയിലുള്ളവരെ തമ്മിൽ വേർതിരിക്കാതിരിക്കണമെന്ന ആശയം, മൂലത്തിലെ ‘ചെറിയവൻ/വലിയവൻ’ എന്ന രൂപകൽപ്പന നിലനിർത്തി വ്യക്തമാക്കുന്നു.
- source_word: תִּשְׁמָעוּן
  choice: വാദം ... കേൾക്കണം
  rationale: ന്യായപരിസരത്തിൽ ശമാ എന്ന ക്രിയ ഒരു കക്ഷിയുടെയോ കേസിന്റെയോ വാദം കേൾക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വാദം’ ചേർക്കുന്നത് മലയാളത്തിൽ നിയമസന്ദർഭം സ്വാഭാവികമാക്കുന്നു.
- source_word: לֹא תָגוּרוּ מִפְּנֵי אִישׁ
  choice: ഒരു മനുഷ്യനെയും ഭയപ്പെടരുത്
  rationale: ക്രിയയ്ക്ക് ഭയന്ന് പിൻവാങ്ങുക അല്ലെങ്കിൽ ഭയപ്പെടുക എന്ന അർഥമുണ്ട്. മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായി മൂലത്തിലെ പൊതുവായ ഏകവചന ‘മനുഷ്യൻ’ നിലനിർത്തുന്നു.
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: ന്യായവിധി ദൈവത്തിനുള്ളതാകുന്നു
  rationale: ന്യായവിധിയിലുള്ള അധികാരം ദൈവത്തിന്റേതാണെന്ന മൂലവാക്യത്തിന്റെ നേരിട്ടുള്ള ദൈവശാസ്ത്രപരമായ അവകാശവാദം വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: הַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: നിങ്ങൾക്കു തീർപ്പാക്കാൻ പ്രയാസമുള്ള കാര്യം
  rationale: ന്യായാധിപന്മാർക്ക് പരിഹരിക്കാൻ കഴിയാത്ത വിഷമകരമായ കേസാണ് സന്ദർഭം. ‘തീർപ്പാക്കാൻ’ എന്നത് സന്ദർഭം വ്യക്തമാക്കുന്നു; എന്നാൽ അന്തിമക്രിയയെ ‘തീർപ്പാക്കും’ എന്നു മാറ്റി അതിവിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: תַּקְרִבוּן אֵלַי
  choice: എന്റെ അടുക്കൽ കൊണ്ടുവരണം
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘അടുത്തേക്ക് കൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּשְׁמַעְתִּיו
  choice: ഞാൻ അതു കേൾക്കും
  rationale: പ്രത്യയം മുമ്പുള്ള ‘കാര്യം’ എന്നതിനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. ‘തീരുമാനിക്കും’ എന്നു വ്യാഖ്യാനിച്ച് ചേർക്കാതെ, മൂലത്തിലെ കേൾക്കുക എന്ന ന്യായപരമായ ഭാഷ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ന്യായവിധി ദൈവത്തിനുള്ളതാകുന്നു’ എന്ന വാക്യത്തിലെ ന്യായാധികാരത്തിന്റെ അടിസ്ഥാനം
  choice: ന്യായവിധി ദൈവത്തിനുള്ളതാണെന്ന നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തി.
  alternative: ദൈവം ന്യായാധിപന്മാരെ വിധിക്കുമെന്നോ, ന്യായവിധി ദൈവികനിയമം മാത്രമാണെന്നോ വികസിപ്പിക്കാമായിരുന്നു.
  rationale: ഹീബ്രു വാക്യം ദൈവിക ഉടമസ്ഥതയെയോ അധികാരത്തെയോ നേരിട്ട് പ്രസ്താവിക്കുന്നു; അതിൽനിന്നുള്ള പ്രത്യേക സിദ്ധാന്തപരമായ നിഗമനം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: אִישׁ എന്ന പൊതുവായ പുല്ലിംഗ ഏകവചനം
  choice: ‘ഒരു മനുഷ്യനെയും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ആരെയും’ എന്നു ലിംഗനിരപേക്ഷമായി നൽകാമായിരുന്നു.
  rationale: മൂലത്തിലെ വ്യാകരണരൂപം മാനിക്കുകയും അതിന്റെ പൊതുവായ പ്രയോഗശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘ന്യായവിധി’, ‘വാദം കേൾക്കുക’, ‘തീർപ്പാക്കുക’ എന്നിവ സന്ദർഭം വ്യക്തമാക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ [b] അടിക്കുറിപ്പ് അതിന്റെ പ്രധാനപാഠത്തിലെ ‘be intimidated’ എന്നതിന് പകരം ‘be afraid’ നൽകുന്നതാണെങ്കിലും, മലയാള പ്രധാനപാഠം തന്നെ ‘ഭയപ്പെടരുത്’ എന്നു സ്വീകരിച്ചതിനാൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കി; അതിനാൽ [b] ചേർത്തിട്ടില്ല.
