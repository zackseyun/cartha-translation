  text: Then I said to you, ‘Do not be terrified of them, and do not fear them.’
translation:
  language: ml
  text: 'അപ്പോൾ ഞാൻ നിങ്ങളോടു പറഞ്ഞു: ‘അവരെക്കണ്ട് പരിഭ്രാന്തരാകരുത്; അവരെ ഭയപ്പെടരുത്.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעַרְצוּן
  choice: പരിഭ്രാന്തരാകരുത്
  rationale: ഈ ക്രിയ ഇവിടെ ഭീതിയാൽ നടുങ്ങുകയോ പരിഭ്രാന്തരാകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള സാധാരണ ‘ഭയപ്പെടുക’ എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: תִירְאוּן
  choice: ഭയപ്പെടുകയും അരുത്
  rationale: ירא എന്ന സാധാരണ ഭയക്രിയയെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; എബ്രായത്തിലെ ആവർത്തിച്ച നിഷേധവും സംയോജകവും സംരക്ഷിക്കുന്നു.
- source_word: מֵהֶם
  choice: അവരെക്കണ്ട് / അവരെ
  rationale: ആ ജനങ്ങളെ ഭയത്തിന്റെ കാരണമോ ലക്ഷ്യമോ ആയി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക ഘടനയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സമാന്തരമായ രണ്ടു വിലക്കുകളിലെ അർത്ഥവ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
