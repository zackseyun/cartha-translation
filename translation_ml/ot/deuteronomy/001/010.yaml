id: DEU.1.10
reference: Deuteronomy 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהוָ֥ה אֱלֹהֵי/כֶ֖ם הִרְבָּ֣ה אֶתְ/כֶ֑ם וְ/הִנְּ/כֶ֣ם הַ/יּ֔וֹם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങളെ പെരുകിച്ചിരിക്കുന്നു; ഇതാ, ഇന്ന് നിങ്ങൾ ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ അനേകരായിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എണ്ണത്തിൽ ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെയാണ്.”'
    reason: לָרֹב എന്ന പ്രയോഗത്തെ ‘വലിയ എണ്ണത്തിൽ’ എന്ന അർഥത്തിൽ കൂടുതൽ പദാനുസൃതമായി പ്രകടിപ്പിക്കുന്ന വിവർത്തനവികല്പം.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നൽകി.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: ഇവിടെ ബഹുവചനരൂപം യഹ്‌വെയെ സൂചിപ്പിക്കുന്ന ഏകവചന ദൈവനാമമായി പ്രവർത്തിക്കുന്നു; രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയം ‘നിങ്ങളുടെ’ എന്നു നൽകി.
- source_word: הִרְבָּה אֶתְכֶם
  choice: നിങ്ങളെ പെരുകിച്ചിരിക്കുന്നു
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരണാർത്ഥമായ ‘അനേകരാക്കുക/വർധിപ്പിക്കുക’ എന്ന ശക്തി നിലനിർത്തുകയും പിതാക്കന്മാർക്കു നൽകിയ സന്തതിവാഗ്ദാനത്തിന്റെ അനുരണനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִנְכֶם
  choice: ഇതാ
  rationale: നിലവിലെ അവസ്ഥയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു സൂചനാപദത്തിന്റെ വാക്ചാതുര്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചനയുടെ അടിയന്തരത നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ
  rationale: പദശഃ ‘ആകാശങ്ങളുടെ നക്ഷത്രങ്ങൾ’ എന്ന ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ സ്ഥാനബന്ധമായി നൽകി; ഉപമ വ്യക്തമായി നിലനിർത്തി.
- source_word: לָרֹב
  choice: അസംഖ്യരായിരിക്കുന്നു
  rationale: ‘വളരെ വലിയ എണ്ണത്തിൽ/സമൃദ്ധിയായി’ എന്ന വ്യാപ്തിയെ ജനസമൂഹത്തെക്കുറിച്ചുള്ള സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ലിപ്യന്തരിച്ചു; ഉച്ചാരണത്തിന്റെ പുനർനിർമാണത്തിലുള്ള പരിധി അംഗീകരിച്ചുകൊണ്ട് വ്യാപകമായ ‘Yahweh’ രൂപത്തിന് അനുയോജ്യമായ മലയാളരൂപം സ്വീകരിച്ചു.
- issue: പെരുപ്പത്തിന്റെ ഉപമയിൽ לָרֹב എന്നതിന്റെ ബന്ധം
  choice: നക്ഷത്രങ്ങളെപ്പോലെ അസംഖ്യരായിരിക്കുന്നു
  alternative: നിങ്ങളെ പെരുകിച്ചിരിക്കുന്നു—എണ്ണത്തിൽ ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ
  rationale: ലָרֹב ഇപ്പോഴത്തെ ജനസംഖ്യയുടെ അളവ് സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി ചേർത്തു; അത് മുൻക്രിയയോടോ മുഴുവൻ ഉപമയോടോ കൂടുതൽ അടുത്ത് ബന്ധിപ്പിക്കാവുന്ന ഘടനാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘പെരുകിച്ചിരിക്കുന്നു’ എന്നത് കാരണാർത്ഥം നിലനിർത്തുന്നു; ‘അസംഖ്യർ’ എന്നത് ഉപമയുടെ വ്യാപ്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് അടയാളം മുഖ്യപാഠത്തിൽ [a] ആയി ഉൾപ്പെടുത്തി.
