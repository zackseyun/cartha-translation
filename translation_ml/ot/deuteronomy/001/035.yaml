source:
  edition: WLC
  text: אִם יִרְאֶ֥ה אִישׁ֙ בָּ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה הַ/דּ֥וֹר הָ/רָ֖ע הַ/זֶּ֑ה אֵ֚ת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֣ר נִשְׁבַּ֔עְתִּי לָ/תֵ֖ת לַ/אֲבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/035.yaml
  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: ml
  text: ഈ ദുഷ്ട തലമുറയിലെ ഈ മനുഷ്യരിൽ ഒരുവനും നിങ്ങളുടെ പിതാക്കന്മാർക്കു കൊടുക്കുമെന്ന് ഞാൻ ശപഥം ചെയ്ത ആ നല്ല ദേശം കാണുകയില്ല—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “നിങ്ങളുടെ പൂർവികർക്കു.” എബ്രായത്തിൽ: “നിങ്ങളുടെ പിതാക്കന്മാർക്കു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ഒരുവനും ... കാണുകയില്ല
  rationale: ഇവിടെ אִם ഒരു സാധാരണ ഉപാധിവാക്യം ആരംഭിക്കുന്നില്ല; ദൈവിക ശപഥത്തിന്റെ പശ്ചാത്തലത്തിൽ ശക്തമായ നിഷേധശപഥസൂത്രമായി പ്രവർത്തിക്കുന്നു. അതിന്റെ ഊന്നൽ മലയാളത്തിൽ ‘ഒരുവനും ... കാണുകയില്ല’ എന്നു സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: יִרְאֶה
  choice: കാണുകയില്ല
  rationale: ראה എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; ഈ ന്യായവിധിസന്ദർഭത്തിൽ ദേശത്തിൽ പ്രവേശിക്കുകയോ അതിനെ അനുഭവിക്കുകയോ ചെയ്യുന്നതിൽനിന്നുള്ള ഒഴിവാക്കലും സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: ഈ മനുഷ്യരിൽ ഒരുവനും
  rationale: ഏകവചനമായ אִישׁ-നും ഭാഗികാർഥമുള്ള בְּ-ക്കും ചേർന്നുള്ള ‘ഇവരിൽ ഒരാൾപോലും ഇല്ല’ എന്ന വിതരണാത്മക ഊന്നൽ കൃത്യമായി പകരുന്നു.
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: ഈ ദുഷ്ട തലമുറയിലെ
  rationale: רַע ഇവിടെ കേവലം ‘മോശം’ എന്നല്ല, ധാർമ്മിക കുറ്റത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദുഷ്ട’ എന്നു പരിഭാഷപ്പെടുത്തി. മുൻപുള്ള ‘ഈ മനുഷ്യർ’ ആരെന്നു സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ബന്ധകഘടന ഉപയോഗിച്ചു.
- source_word: אֶת הָאָרֶץ הַטּוֹבָה
  choice: ആ നല്ല ദേശം
  rationale: ‘നല്ല ദേശം’ എന്നത് എബ്രായത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ബന്ധവാക്യം മുമ്പേ പരാമർശിച്ച പ്രത്യേക ദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ആ’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי
  choice: എന്ന് ഞാൻ ശപഥം ചെയ്ത
  rationale: נשבע എന്ന ക്രിയയുടെ ഗൗരവമുള്ള ‘ശപഥം ചെയ്യുക’ എന്ന അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לָתֵת
  choice: കൊടുക്കുമെന്ന്
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കൊടുക്കുക’ എന്നാണ്; ശപഥത്തിന്റെ ഉള്ളടക്കമായി മലയാളത്തിൽ ‘കൊടുക്കുമെന്ന്’ എന്നു ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: לַאֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാർക്കു
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുരുഷലിംഗ ബഹുവചനമായ ‘പിതാക്കന്മാർ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; വിശാലാർഥമായ ‘പൂർവികർ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: לַאֲבֹתֵיכֶם എന്നതിന്റെ പരിഭാഷ
  choice: നിങ്ങളുടെ പിതാക്കന്മാർക്കു
  alternative: നിങ്ങളുടെ പൂർവികർക്കു
  rationale: എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ പിതാക്കന്മാർക്ക്’ എന്നാണ്; ഇവിടെ ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ഉറവിടത്തിലെ പുരുഷലിംഗരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ശപഥസൂത്രത്തിന്റെ ശക്തമായ നിഷേധം വ്യവസ്ഥാവാക്യമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘ഒരുവനും ... കാണുകയില്ല’ എന്ന ഘടന ഉപയോഗിച്ചു. അടുത്ത വാക്യത്തിലേക്കുള്ള തുടർച്ച സൂചിപ്പിക്കാൻ അവസാനത്തിലെ ദീർഘരേഖ നിലനിർത്തി.
