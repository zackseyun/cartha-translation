id: DEU.1.16
reference: Deuteronomy 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: ml
  text: 'ആ സമയത്ത് ഞാൻ നിങ്ങളുടെ ന്യായാധിപന്മാരോട് ഇപ്രകാരം കൽപിച്ചു: “നിങ്ങളുടെ സഹോദരന്മാർ തമ്മിലുള്ള വ്യവഹാരങ്ങൾ കേൾക്കുക[a]; ഒരു മനുഷ്യനും അവന്റെ സഹോദരനോ അവനോടുകൂടെ പാർക്കുന്ന പരദേശിയോ[c] തമ്മിലുള്ള കാര്യത്തിൽ നീതിയോടെ[b] വിധിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ സഹോദരന്മാർക്കിടയിലെ തർക്കങ്ങൾ കേൾക്കുക.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ന്യായമായി.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന צֶדֶק (ത്സേദെഖ്) എന്ന ഹീബ്രായപദത്തിന് ന്യായവിധിയുടെ സന്ദർഭത്തിൽ നീതി, ധാർമ്മിക ശരി എന്നീ രണ്ടർഥനിറങ്ങളും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: c
    text: “പാർക്കുന്ന പരദേശി” എന്നതിന് “അവനോടുകൂടെ താമസിക്കുന്ന അന്യദേശവാസി” എന്നും പരിഭാഷപ്പെടുത്താം. גֵּר (ഗേർ) എന്ന ഹീബ്രായപദം ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: ഞാൻ ... കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയ അധികാരപൂർവമായ ആജ്ഞയെ സൂചിപ്പിക്കുന്നു; ‘കല്പിച്ചു’ അതിന്റെ നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ മലയാളരൂപമാണ്.
- source_word: שֹׁפְטֵיכֶם
  choice: നിങ്ങളുടെ ന്യായാധിപന്മാർ
  rationale: നിയമവ്യവഹാരങ്ങൾ കേട്ട് വിധിക്കാൻ നിയമിക്കപ്പെട്ടവരെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്; ‘ന്യായാധിപന്മാർ’ വ്യക്തവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: בָּעֵת הַהִוא
  choice: ആ സമയത്ത്
  rationale: ചർച്ച ചെയ്തുകൊണ്ടിരിക്കുന്ന കാലഘട്ടത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇപ്രകാരം
  rationale: തുടർന്നുവരുന്ന കല്പനയുടെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്നു; ഹീബ്രായത്തിലെ ഉദ്ധരണി-ആമുഖം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: നിങ്ങളുടെ സഹോദരന്മാർ തമ്മിലുള്ള വ്യവഹാരങ്ങൾ കേൾക്കുക
  rationale: שׁמע ഇവിടെ നിയമപരമായി ഇരുപക്ഷത്തിന്റെയും വാദം കേൾക്കുക എന്ന അർഥത്തിലാണ്. ‘വ്യവഹാരങ്ങൾ’ ന്യായവിധിയുടെ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു; ‘സഹോദരന്മാർ’ ഉറവിടത്തിലെ ഉടമ്പടി-സമൂഹത്തിന്റെ ബന്ധഭാഷ നിലനിർത്തുന്നു.
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: നീതിയോടെ വിധിക്കുക
  rationale: צֶדֶק ന്യായപരമായ സന്ദർഭത്തിൽ നീതിയും ധാർമ്മിക ശരിയും ഉൾക്കൊള്ളുന്നു. ‘നീതിയോടെ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും നിയമസന്ദർഭത്തിൽ കൃത്യവുമാണ്.
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: ഒരു മനുഷ്യനും അവന്റെ സഹോദരനും തമ്മിൽ
  rationale: ഉറവിടത്തിലെ ഏകവചനവും ബന്ധുത്വരൂപകവും നിലനിർത്തുന്നു.
- source_word: גֵּרוֹ
  choice: അവനോടുകൂടെ പാർക്കുന്ന പരദേശി
  rationale: גֵּר ഇസ്രായേല്യരുടെ ഇടയിൽ സ്ഥിരമായി പാർക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘പാർക്കുന്ന പരദേശി’ താമസവും പുറംദേശക്കാരൻ എന്ന നിലയും ഒരുമിച്ച് അറിയിക്കുന്നു; ‘അവനോടുകൂടെ’ എന്നത് പ്രത്യയസൂചന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֲחֵיכֶם, אָחִיו എന്നിവയിലെ ലിംഗസൂചക ഉടമ്പടി-സമൂഹഭാഷ
  choice: സഹോദരന്മാർ / അവന്റെ സഹോദരൻ
  alternative: സഹഇസ്രായേല്യർ / കൂട്ടാളി / അന്യോന്യം
  rationale: ഹീബ്രായം പുരുഷലിംഗ ബന്ധുത്വപദങ്ങൾ സമൂഹത്തെ പ്രതിനിധീകരിക്കുന്ന വിധത്തിൽ ഉപയോഗിക്കുന്നു. അതിനെ പൊതുവായ പദങ്ങളാക്കി നിരപ്പാക്കാതെ ഉറവിടത്തിന്റെ കുടുംബ-സമൂഹഭാവം നിലനിർത്തി.
- issue: ന്യായവിധിസന്ദർഭത്തിലെ צֶדֶק
  choice: നീതിയോടെ
  alternative: ന്യായമായി / നീതിനിഷ്ഠയോടെ
  rationale: ഈ പദത്തിൽ ‘നീതി’യും ‘ധാർമ്മിക ശരി’യും പരസ്പരം മുട്ടിച്ചേരുന്നു. നിയമപരമായ സന്ദർഭത്തിൽ ‘നീതിയോടെ’ ഏറ്റവും സ്വാഭാവികം; മറ്റു അർഥനിറങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: גֵּר എന്ന പദത്തിന്റെ സാമൂഹിക-നിയമപരമായ സ്ഥാനം
  choice: പാർക്കുന്ന പരദേശി
  alternative: പ്രവാസി / അന്യദേശവാസി
  rationale: ഇത് വഴിപോക്കനായ വിദേശിയെ മാത്രമല്ല, സമൂഹത്തിനിടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത ആളെ സൂചിപ്പിക്കുന്നു. വിവർത്തനം ഈ ഇരട്ടസവിശേഷതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ഉദ്ധരണിയുടെ ആജ്ഞാഭാവവും ‘സഹോദരൻ’ എന്ന സമൂഹബന്ധഭാഷയും നിലനിർത്തി. ‘ന്യായാധിപന്മാരോട്’ എന്ന ബഹുവചനരൂപവുമായി ചേർന്ന് ‘കേൾക്കുക’, ‘വിധിക്കുക’ എന്നീ രൂപങ്ങൾ കൂട്ടത്തെ അഭിസംബോധന ചെയ്യുന്ന കല്പനകളായി വായിക്കപ്പെടുന്നു.
