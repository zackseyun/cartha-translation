id: DEU.1.43
reference: Deuteronomy 1:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֲדַבֵּ֥ר אֲלֵי/כֶ֖ם וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּמְרוּ֙ אֶת פִּ֣י יְהוָ֔ה וַ/תָּזִ֖דוּ וַ/תַּעֲל֥וּ הָ/הָֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: ml
  text: അങ്ങനെ ഞാൻ നിങ്ങളോടു സംസാരിച്ചു; എന്നാൽ നിങ്ങൾ ചെവികൊടുത്തില്ല. നിങ്ങൾ യഹ്‌വേയുടെ കൽപ്പനയെ ധിക്കരിച്ചു; ധാർഷ്ട്യത്തോടെ മലനാട്ടിലേക്കു കയറിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായഭാഷയിൽ അക്ഷരാർഥം “യഹ്‌വേയുടെ വായ്‌ക്കെതിരെ”; അതായത്, യഹ്‌വേ കല്പിച്ചതിനെതിരെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: അങ്ങനെ ഞാൻ നിങ്ങളോടു സംസാരിച്ചു
  rationale: വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന וָ-യെ സ്വാഭാവിക മലയാളത്തിൽ ‘അങ്ങനെ’ എന്നു നൽകി; אֲלֵיכֶם ബഹുവചനമായ ‘നിങ്ങളോട്’ എന്നാണ്.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: എന്നാൽ നിങ്ങൾ ചെവികൊടുത്തില്ല
  rationale: שׁמע എന്നതിന് കേൾക്കുക, ചെവികൊടുക്കുക, അനുസരിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. തുടർന്നുള്ള മത്സരത്തെ വേറിട്ടു നിലനിർത്തിക്കൊണ്ട് ശ്രദ്ധിച്ചു കേൾക്കാത്തതും അനുസരിക്കാത്തതും സൂചിപ്പിക്കാൻ ‘ചെവികൊടുത്തില്ല’ എന്നു നൽകി.
- source_word: וַתַּמְרוּ אֶת פִּי יְהוָה
  choice: നിങ്ങൾ യഹ്‌വേയുടെ കൽപ്പനയ്‌ക്കെതിരെ മത്സരിക്കുകയും
  rationale: מרה അധികാരത്തിനെതിരായ മത്സരത്തെയോ ധിക്കാരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘യഹ്‌വേയുടെ വായ്’ എന്ന അക്ഷരാർഥപ്രയോഗം ഇവിടെ അവൻ അരുളിച്ചെയ്ത കൽപ്പനയെ സൂചിപ്പിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘കൽപ്പന’ ഉപയോഗിച്ച് അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനരൂപത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַתָּזִדוּ
  choice: ധാർഷ്ട്യത്തോടെ
  rationale: זיד അഹങ്കാരപൂർവവും ധിക്കാരപരവും അതിരുകടന്ന ആത്മവിശ്വാസത്തോടെയുമുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ധാർഷ്ട്യത്തോടെ’ ഈ നൈതിക ഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: മലനാട്ടിലേക്കു കയറിപ്പോകുകയും ചെയ്തു
  rationale: עלה ഉയർന്ന പ്രദേശത്തേക്കുള്ള കയറ്റത്തെ സൂചിപ്പിക്കുന്നു; ദിശാസൂചകമായ הָ-യും പ്രദേശസൂചനയായ הָהָר ഉം ചേർന്ന ആശയം ‘മലനാട്ടിലേക്കു കയറിപ്പോയി’ എന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നത് ഉറവിടപാഠത്തിന്റെ വ്യത്യാസം നിലനിർത്തുന്നു.
- issue: אֶת פִּי יְהוָה എന്ന പ്രയോഗം
  choice: യഹ്‌വേയുടെ കൽപ്പനയ്‌ക്കെതിരെ
  alternative: യഹ്‌വേയുടെ വായ്‌ക്കെതിരെ
  rationale: ‘വായ്’ എന്നത് ദൈവം പറഞ്ഞതോ കല്പിച്ചതോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. മലയാളത്തിൽ അക്ഷരാർഥം അവ്യക്തമാകുന്നതിനാൽ സന്ദർഭാർഥം മുഖ്യപാഠത്തിലും അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. ‘ചെവികൊടുത്തില്ല’ എന്ന പ്രയോഗം കേൾക്കുക/അനുസരിക്കുക എന്ന ഉറവിടപദത്തിന്റെ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല; വാക്യത്തിന്റെ തുടർന്നുള്ള മത്സരവും ധാർഷ്ട്യവും പ്രത്യേകം നിലനിർത്തുന്നു.
