source:
  edition: WLC
  text: בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן בְּ/אֶ֣רֶץ מוֹאָ֑ב הוֹאִ֣יל מֹשֶׁ֔ה בֵּאֵ֛ר אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֖את לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
translation:
  language: ml
  text: 'യോർദ്ദാന്റെ മറുകരയിൽ[a], മോവാബ് ദേശത്ത്, മോശെ ഈ ന്യായപ്രമാണം[b] വിശദീകരിക്കാൻ തുടങ്ങി. അദ്ദേഹം പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യോർദ്ദാനപ്പുറത്ത്’ അല്ലെങ്കിൽ ‘യോർദ്ദാന്റെ അക്കരയിൽ.’ എബ്രായ പ്രയോഗത്തിന്റെ ദിശ പ്രസംഗകന്റെ ഭൂമിശാസ്ത്രപരമായ കാഴ്ചപ്പാടിനെ ആശ്രയിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഈ ഉപദേശം.’ എബ്രായത്തിലെ തോറാ എന്ന പദത്തിന് ‘ന്യായപ്രമാണം’ എന്നും കൂടുതൽ വിശാലമായി ‘ഉപദേശം’ അല്ലെങ്കിൽ ‘നിർദേശം’ എന്നും അർത്ഥമാകാം. ഇവിടെ ഉടമ്പടി-നിയമ പശ്ചാത്തലം കണക്കിലെടുത്ത് ‘ന്യായപ്രമാണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ മറുകരയിൽ
  rationale: പ്രസംഗകന്റെ ഭൂമിശാസ്ത്രപരമായ നിലപാടനുസരിച്ച് യോർദ്ദാന്റെ അപ്പുറത്തുള്ള പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ആപേക്ഷിക പ്രയോഗമാണിത്. ‘മറുകരയിൽ’ സ്വാഭാവികവും അർത്ഥസുതാര്യവുമാണ്; കാഴ്ചപ്പാടിലെ ആപേക്ഷികത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: മോവാബ് ദേശത്ത്
  rationale: אֶרֶץ ഇവിടെ ഭൂമിശാസ്ത്ര-രാഷ്ട്രീയ അർത്ഥത്തിൽ ‘ദേശം’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം.
- source_word: הוֹאִיל
  choice: തുടങ്ങി
  rationale: തുടർന്നുവരുന്ന പ്രവൃത്തിയുടെ ആരംഭമോ ഏറ്റെടുക്കലോ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിലെ പ്രയോഗം ആധുനിക മലയാളത്തിൽ ‘തുടങ്ങി’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: בֵּאֵר
  choice: വിശദീകരിക്കാൻ
  rationale: കാര്യത്തെ വ്യക്തമാക്കുക, വിശദമായി പ്രതിപാദിക്കുക എന്ന ആശയം നൽകുന്നു. ‘വിശദീകരിക്കാൻ’ വായനാസൗകര്യവും മൂലത്തിലെ അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ഈ ന്യായപ്രമാണം
  rationale: תּוֹרָהയ്ക്ക് വിശാലമായി ‘ഉപദേശം/പ്രബോധനം’ എന്ന അർത്ഥമുണ്ടെങ്കിലും, ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടി-നിയമ പശ്ചാത്തലത്തിൽ ‘ന്യായപ്രമാണം’ നിയമപരവും ദൈവിക നിർദേശപരവുമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: לֵאמֹר
  choice: 'അദ്ദേഹം പറഞ്ഞു:'
  rationale: തുടർന്നുവരുന്ന പ്രസംഗത്തെ പരിചയപ്പെടുത്തുന്ന സൂചകമാണ്. മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കാൻ സ്വതന്ത്ര വാക്യമായി നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി പശ്ചാത്തലത്തിൽ תּוֹרָה എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഈ ന്യായപ്രമാണം
  alternative: ഈ ഉപദേശം
  rationale: ഇവിടെ മോശെ വിശദീകരിക്കുന്ന ഉടമ്പടി വ്യവസ്ഥകളുടെ നിയമപരമായ വശം ‘ന്യായപ്രമാണം’ സംരക്ഷിക്കുന്നു. അതേസമയം, മൂലപദത്തിന്റെ വിശാലമായ ‘ഉപദേശം/നിർദേശം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു; ഒരു പ്രത്യേക മതവിഭാഗത്തിന്റെ വ്യാഖ്യാനം ഇതിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പരമ്പരാഗത ബൈബിൾ പദമായ ‘ന്യായപ്രമാണം’ നിലനിർത്തിയെങ്കിലും അതിന്റെ വിശാലമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു. לֵאמֹר എന്നതിനെ മലയാളത്തിലെ സ്വാഭാവിക പ്രസംഗപ്രവേശനത്തിനായി ‘അദ്ദേഹം പറഞ്ഞു:’ എന്ന സ്വതന്ത്ര വാക്യമായി രൂപപ്പെടുത്തി.
