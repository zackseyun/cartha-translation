translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. മൂലത്തിലെ ഹൃദയം ഉരുകുന്ന ദൃശ്യരൂപവും ആകാശത്തോളം ഉയർന്ന കോട്ടകളെന്ന അതിശയോക്തിയും നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
