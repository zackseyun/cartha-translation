reference: Deuteronomy 1:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָנָ֣ה אֲנַ֣חְנוּ עֹלִ֗ים אַחֵי/נוּ֩ הֵמַ֨סּוּ אֶת לְבָבֵ֜/נוּ לֵ/אמֹ֗ר עַ֣ם גָּד֤וֹל וָ/רָם֙ מִמֶּ֔/נּוּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצוּרֹ֖ת בַּ/שָּׁמָ֑יִם וְ/גַם בְּנֵ֥י עֲנָקִ֖ים רָאִ֥ינוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: ml
  text: “നാം എങ്ങോട്ടാണ് കയറിപ്പോകുന്നത്? നമ്മുടെ സഹോദരന്മാർ, ‘ആ ജനം നമ്മെക്കാൾ വലുതും ഉയരമുള്ളതുമാണ്; പട്ടണങ്ങൾ വലുതും ആകാശത്തോളം ഉയർന്ന കോട്ടമതിലുകളുള്ളവയുമാണ്[b]; അതിനുപുറമേ, അനാക്കിന്റെ സന്തതികളെയും[c] ഞങ്ങൾ അവിടെ കണ്ടു’ എന്നു പറഞ്ഞ് നമ്മുടെ ഹൃദയം ഉരുക്കിക്കളഞ്ഞു[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മുടെ ഹൃദയം ഉരുകിപ്പോകുമാറാക്കി”; അതായത്, “നമ്മുടെ ധൈര്യം കെടുത്തി.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ “ആകാശത്തിൽ കോട്ടകെട്ടിയവ” എന്നാണ്; അത്യന്തം ഉയർന്ന കോട്ടമതിലുകളെ സൂചിപ്പിക്കുന്ന അതിശയോക്തിയാണിത്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “അനാക്ക്യർ”; അക്ഷരാർഥത്തിൽ “അനാക്കിന്റെ പുത്രന്മാർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: നാം എങ്ങോട്ടാണ് കയറിപ്പോകുന്നത്?
  rationale: ചോദ്യം ലക്ഷ്യസ്ഥാനത്തെക്കുറിച്ചാണ്; עלה എന്ന കയറിപ്പോകുക എന്ന ചലനരൂപവും മലനാട്ടിലേക്കുള്ള യാത്രയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: אַחֵינוּ
  choice: നമ്മുടെ സഹോദരന്മാർ
  rationale: പുരുഷലിംഗ ബഹുവചനത്തിന്റെ നേരിട്ടുള്ള അർഥവും സഹയിസ്രായേല്യരെക്കുറിച്ചുള്ള മൂലപാഠത്തിലെ ആഹ്വാനഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: הֵמַסּוּ אֶת לְבָבֵנוּ
  choice: നമ്മുടെ ഹൃദയം ഉരുക്കിക്കളഞ്ഞു
  rationale: ധൈര്യം നഷ്ടപ്പെടുത്തുക എന്ന ആശയം വഹിക്കുന്ന എബ്രായ ദൃശ്യരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: ആ ജനം നമ്മെക്കാൾ വലിപ്പവും ഉയരവുമുള്ളവരാണ്
  rationale: גָּדוֹל സൂചിപ്പിക്കുന്ന വലിപ്പവും רָם സൂചിപ്പിക്കുന്ന ഉയരവും താരതമ്യത്തോടെ പ്രകടമാക്കുന്നു.
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: അവരുടെ പട്ടണങ്ങൾ വലുതും ആകാശത്തോളം കോട്ടകെട്ടിയവയുമാണ്
  rationale: അതിശയോക്തിപരമായ ‘ആകാശത്തിൽ കോട്ടകെട്ടിയ’ എന്ന എബ്രായ ചിത്രത്തെ മലയാളത്തിൽ ഗ്രാഹ്യമായ ‘ആകാശത്തോളം’ എന്നു സംരക്ഷിക്കുന്നു.
- source_word: וְגַם
  choice: അതിന് പുറമേ
  rationale: ഭയപ്പെടുത്തുന്ന മറ്റൊരു വിവരം കൂട്ടിച്ചേർക്കുന്ന സഞ്ചിതബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנֵי עֲנָקִים
  choice: അനാക്കിന്റെ സന്തതികൾ
  rationale: വംശപരമായ സൂചന വ്യക്തമാക്കുകയും ‘പുത്രന്മാർ’ എന്ന രൂപത്തെ അനാവശ്യമായി കട്ടിയാക്കാതിരിക്കുകയും ചെയ്യുന്നു; ജനവിഭാഗനാമത്തിന്റെ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: רָאִינוּ שָׁם
  choice: ഞങ്ങൾ അവിടെ കണ്ടു
  rationale: സാക്ഷികൾ മുമ്പ് കണ്ടതിനെ വിവരിക്കുന്ന ലളിതമായ ഭൂതകാലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
