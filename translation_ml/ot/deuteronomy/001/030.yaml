  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ הַ/הֹלֵ֣ךְ לִ/פְנֵי/כֶ֔ם ה֖וּא יִלָּחֵ֣ם לָ/כֶ֑ם כְּ֠/כֹל אֲשֶׁ֨ר עָשָׂ֧ה אִתְּ/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: ml
  text: നിങ്ങളുടെ മുമ്പിൽ പോകുന്ന നിങ്ങളുടെ ദൈവമായ യഹോവ അവൻതന്നെ നിങ്ങൾക്കുവേണ്ടി യുദ്ധം ചെയ്യും; ഈജിപ്തിൽ നിങ്ങളുടെ കൺമുമ്പിൽ അവിടുന്ന് നിങ്ങൾക്കുവേണ്ടി ചെയ്തതുപോലെ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘നിങ്ങളോടുകൂടെ ചെയ്തത്’ എന്നാണ്; ഈജിപ്തിൽ യഹോവ ഇസ്രായേലിനുവേണ്ടി പ്രവർത്തിച്ചതിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: യഹോവയോടു ചേർന്നിരിക്കുന്നതിനാൽ ഏകവചന അർഥമായ ‘നിങ്ങളുടെ ദൈവം’ ആവശ്യമാണ്; മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ദൈവമായ’ എന്നു നൽകി.
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽ പോകുന്ന
  rationale: വർത്തമാന കൃതന്തം സൂചിപ്പിക്കുന്ന തുടരുന്ന ദൈവിക നേതൃത്വത്തെ ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: הוּא
  choice: യഹോവതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘തന്നെ’കൊണ്ട് പ്രകടമാക്കി.
- source_word: יִלָּחֵם לָכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി യുദ്ധം ചെയ്യും
  rationale: നിഫാൽ രൂപം ഇവിടെ ഇസ്രായേലിനുവേണ്ടി പോരാടുക എന്ന അർഥത്തിലാണ്; ‘യുദ്ധം ചെയ്യും’ സന്ദർഭത്തിന്റെ സൈനികഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: כְּכֹל אֲשֶׁר
  choice: ചെയ്തതുപോലെതന്നെ
  rationale: മുൻകാല ദൈവിക പ്രവൃത്തിയോടുള്ള സമ്പൂർണ താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עָשָׂה אִתְּכֶם
  choice: നിങ്ങളോടൊപ്പം ചെയ്തത്
  rationale: אֵת എന്നതിന്റെ ‘കൂടെ/ഒപ്പം’ എന്ന രൂപം സംരക്ഷിച്ച് മൂലപാഠത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് അവരുടെ പക്ഷത്തുണ്ടായ ദൈവിക പ്രവർത്തനത്തെ സൂചിപ്പിക്കാം.
- source_word: בְּמִצְרַיִם
  choice: ഈജിപ്തിൽ
  rationale: സ്ഥലസൂചനയുടെ നേരിട്ടുള്ള ആധുനിക മലയാളരൂപം.
- source_word: לְעֵינֵיכֶם
  choice: നിങ്ങളുടെ കൺമുമ്പിൽ
  rationale: ജനങ്ങൾ നേരിട്ട് കണ്ട പ്രവൃത്തിയെന്ന ഊന്നൽ സ്വാഭാവികമായ മലയാളപ്രയോഗത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം നിലനിർത്തി.
- issue: עָשָׂה אִתְּכֶם എന്ന പ്രയോഗത്തിന്റെ ബന്ധാർഥം
  choice: നിങ്ങളോടൊപ്പം ചെയ്തത്
  alternative: നിങ്ങൾക്കുവേണ്ടി ചെയ്തത്
  rationale: ‘ഒപ്പം’ എന്ന മൂലരൂപം നിലനിർത്തുന്നതിലൂടെ യഹോവ ഇസ്രായേലിന്റെ പക്ഷത്ത് പ്രവർത്തിച്ചു എന്ന സന്ദർഭാർഥം വായനക്കാരൻ ഗ്രഹിക്കാം; ‘വേണ്ടി’ എന്നു മാത്രം നൽകി മൂലത്തിലെ യഥാർഥ ഭാഷാപരമായ അസ്പഷ്ടത നിശ്ശബ്ദമായി പരിഹരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യഹോവതന്നെ’ എന്നത് ഹീബ്രു സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
