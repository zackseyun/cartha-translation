- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: കാദേശ്-ബർന്നേയ
  rationale: സംയുക്ത സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് അതിന്റെ ഘടകബന്ധം ഹൈഫൻകൊണ്ട് വ്യക്തമാക്കി.
