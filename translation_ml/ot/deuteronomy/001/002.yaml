  rationale: വഴിയിലൂടെ സഞ്ചരിക്കാനുള്ള സമയദൈർഘ്യം സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു.
