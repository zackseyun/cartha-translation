source:
  edition: WLC
  text: וַֽ/תַּעֲנ֣וּ וַ/תֹּאמְר֣וּ אֵלַ֗/י חָטָאנוּ֮ לַֽ/יהוָה֒ אֲנַ֤חְנוּ נַעֲלֶה֙ וְ/נִלְחַ֔מְנוּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/נוּ יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַֽ/תַּחְגְּר֗וּ אִ֚ישׁ אֶת כְּלֵ֣י מִלְחַמְתּ֔/וֹ וַ/תָּהִ֖ינוּ לַ/עֲלֹ֥ת הָ/הָֽרָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: ml
  text: 'അപ്പോൾ നിങ്ങൾ എന്നോടു മറുപടി പറഞ്ഞു: “ഞങ്ങൾ യഹ്‌വെയോടു പാപം ചെയ്തിരിക്കുന്നു. നമ്മുടെ ദൈവമായ യഹ്‌വെ ഞങ്ങളോടു കല്പിച്ചതെല്ലാം അനുസരിച്ച് ഞങ്ങൾ കയറിച്ചെന്നു യുദ്ധം ചെയ്യും.” പിന്നെ നിങ്ങൾ ഓരോരുത്തനും അവനവന്റെ യുദ്ധോപകരണങ്ങൾ അരയിൽ കെട്ടി, മലമ്പ്രദേശത്തേക്കു[b] കയറിപ്പോകാൻ ധാർഷ്ട്യത്തോടെ പുറപ്പെട്ടു[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവിവേകമായി കയറിപ്പോയി’ അല്ലെങ്കിൽ ‘അതിസാഹസത്തോടെ കയറിപ്പോയി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ അപൂർവമാണ്; അതിരുകടന്ന ആത്മവിശ്വാസത്തോടെയുള്ള അല്ലെങ്കിൽ വിവേകരഹിതമായ പ്രവർത്തനമാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘മലയിലേക്കു’; ഈ സന്ദർഭത്തിൽ അത് വിശാലമായ മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ
  choice: നിങ്ങൾ ... മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണത്തിൽ മോശെയോടുള്ള ജനത്തിന്റെ പ്രതികരണത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חָטָאנוּ לַיהוָה
  choice: ഞങ്ങൾ യഹോവയോടു പാപം ചെയ്തിരിക്കുന്നു
  rationale: ל ചൂണ്ടിക്കാണിക്കുന്ന, പാപത്താൽ ദ്രോഹിക്കപ്പെട്ട വ്യക്തിയെ മലയാളത്തിലെ ‘യഹോവയോടു പാപം ചെയ്തു’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: נַעֲלֶה וְנִלְחַמְנוּ
  choice: ഞങ്ങൾ കയറിച്ചെന്നു യുദ്ധം ചെയ്യും
  rationale: עלה എന്നതിലെ മുകളിലേക്കുള്ള ചലനവും לחם എന്നതിലെ യുദ്ധപ്രവർത്തനവും വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: ഞങ്ങളോടു കല്പിച്ചതെല്ലാം അനുസരിച്ച്
  rationale: കല്പനയുടെ സമഗ്രത സൂചിപ്പിക്കുന്ന כְּכֹל എന്ന ആശയം ‘എല്ലാം’കൊണ്ട് നിലനിർത്തുന്നു; ജനത്തിന്റെ അവകാശവാദമാണിത് എന്ന കഥാസന്ദർഭവും മാറ്റുന്നില്ല.
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: നിങ്ങൾ ഓരോരുത്തനും അവനവന്റെ യുദ്ധോപകരണങ്ങൾ അരയിൽ കെട്ടി
  rationale: חגר എന്ന കെട്ടിയണിയുന്ന പ്രവൃത്തിയും אִישׁ എന്ന വിതരണാർഥവും വ്യക്തമാക്കുന്നു; כְּלֵי מִלְחָמָה ആയുധങ്ങൾ മാത്രമല്ല, യുദ്ധസാമഗ്രികളും ഉൾക്കൊള്ളാവുന്നതിനാൽ ‘യുദ്ധോപകരണങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: וַתָּהִינוּ
  choice: ധാർഷ്ട്യത്തോടെ പുറപ്പെട്ടു
  rationale: അപൂർവമായ ഈ ക്രിയ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്ന അതിരുകടന്ന ആത്മവിശ്വാസവും അവിവേകമായ മുന്നേറ്റവും പൂർണമായി നിർവചിക്കാതെ പ്രതികൂല ഭാവത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: לַעֲלֹת הָהָרָה
  choice: മലമ്പ്രദേശത്തേക്കു കയറിപ്പോകാൻ
  rationale: ദിശാസൂചകമായ הָהָרָהയിലെ ചലനവും, സന്ദർഭത്തിൽ הָהָר ഒരു ഒറ്റമലയേക്കാൾ വിശാലമായ ഉയർന്ന പ്രദേശത്തെ സൂചിപ്പിക്കാനുള്ള സാധ്യതയും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയായി മാറ്റാതെ മലയാള ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- issue: וַתָּהִינוּ എന്ന അപൂർവ ക്രിയയുടെ ധാർമ്മിക ഭാവം
  choice: ധാർഷ്ട്യത്തോടെ പുറപ്പെട്ടു
  alternative: കയറിപ്പോകാൻ തുനിഞ്ഞു
  rationale: തുടർന്നുള്ള സന്ദർഭം ഈ മുന്നേറ്റം ദൈവവചനത്തോടുള്ള അനുസരണക്കേടും അതിരുകടന്ന ആത്മവിശ്വാസവും നിറഞ്ഞതാണെന്ന് കാണിക്കുന്നു. എന്നാൽ ‘മത്സരിച്ചു’ എന്നതുപോലെ മൂലത്തിൽ ഉള്ളതിലധികം ഉദ്ദേശ്യം ആരോപിക്കാതെ പ്രതികൂല ഭാവം നിലനിർത്തുന്നു.
- issue: ജനത്തിന്റെ പാപസമ്മതത്തിനും തുടർന്നുള്ള പ്രവൃത്തിക്കും ഇടയിലെ സംഘർഷം
  choice: അവരുടെ വാക്കുകൾ അവകാശവാദമായിത്തന്നെ നേരിട്ട് നിലനിർത്തി
  alternative: അവരുടെ വാക്കുകളെ യഥാർഥ മാനസാന്തരമായി വിശദീകരിക്കുക
  rationale: ‘പാപം ചെയ്തിരിക്കുന്നു’ എന്ന സമ്മതവും പിന്നാലെയുള്ള ധാർഷ്ട്യപൂർവമായ പ്രവർത്തിയും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ പാഠത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. ‘കല്പിച്ചു’, ‘യുദ്ധോപകരണങ്ങൾ’, ‘ധാർഷ്ട്യത്തോടെ’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യമാകുന്നതിനൊപ്പം വാക്യത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്ക് പിന്നാലെ തന്നെയാണ് ചേർത്തിരിക്കുന്നത്.
