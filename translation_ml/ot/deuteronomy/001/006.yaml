  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהוָ֧ה אֱלֹהֵ֛י/נוּ דִּבֶּ֥ר אֵלֵ֖י/נוּ בְּ/חֹרֵ֣ב לֵ/אמֹ֑ר רַב לָ/כֶ֥ם שֶׁ֖בֶת בָּ/הָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/006.yaml
  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: ml
  text: 'നമ്മുടെ ദൈവമായ യഹ്‌വെ ഹോരേബിൽവെച്ച്[a] ഞങ്ങളോടു സംസാരിച്ചു: “നിങ്ങൾ ഈ പർവതത്തിൽ താമസിച്ചത് മതി.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘ഹോരേബ്’; സീനായി എന്നും അറിയപ്പെടുന്ന പർവതത്തിന് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന പേര്.
    reason: cross_reference
  - marker: b
    text: 'അഥവാ: “ഈ പർവതത്തിൽ നിങ്ങൾ താമസിച്ച കാലം ധാരാളമായി.” ഇതിൽ ‘ഇനി ഇവിടെ താമസിക്കേണ്ട’ എന്ന സൂചനയുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ
  rationale: ഇസ്രായേലിന്റെ ദൈവത്തെ ഏകവചനത്തിൽ സൂചിപ്പിക്കുന്ന രൂപം; യഹ്‌വെയുമായുള്ള സ്വാഭാവിക മലയാള apposition ആയി നൽകി.
- source_word: דִּבֶּר אֵלֵינוּ
  choice: ഞങ്ങളോടു സംസാരിച്ചു
  rationale: דבר എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘സംസാരിക്കുക’യും אֶל എന്നതിന്റെ ദിശാസൂചക ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּחֹרֵב
  choice: ഹോരേബിൽവെച്ച്
  rationale: בְּ ഇവിടെ സ്ഥലസൂചകമാണ്; എബ്രായ പാഠത്തിലെ ഹോരേബ് എന്ന സ്ഥലനാമം സീനായി എന്നു സമന്വയിപ്പിക്കാതെ നിലനിർത്തി.
- source_word: לֵאמֹר
  choice: 'സംസാരിച്ചു:'
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി തുടങ്ങുന്ന എബ്രായ സൂത്രപ്രയോഗം മലയാളത്തിൽ കോളൻകൊണ്ട് സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു; പ്രത്യേകം ‘പറഞ്ഞുകൊണ്ട്’ ചേർക്കുന്നത് അനാവശ്യ ആവർത്തനമാകും.
- source_word: רַב לָכֶם שֶׁבֶת
  choice: നിങ്ങൾ ... താമസിച്ചത് മതി
  rationale: ‘നിങ്ങൾക്കു മതി’ എന്ന sufficiency/excess ഭാവവും ישׁב എന്നതിന്റെ അവിടെ തുടരുക/താമസിക്കുക എന്ന അർഥവും സംയോജിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: בָּהָר הַזֶּה
  choice: ഈ പർവതത്തിൽ
  rationale: הַר എന്നത് ഇവിടെ ഹോരേബ് പർവതത്തെ സൂചിപ്പിക്കുന്നു; בְּ-യുടെ സ്ഥലസൂചകത മലയാളത്തിലെ ‘-ത്തിൽ’കൊണ്ട് നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: רַב לָכֶם שֶׁבֶת എന്ന പ്രയോഗത്തിന്റെ ഭാവം
  choice: നിങ്ങൾ ഈ പർവതത്തിൽ താമസിച്ചത് മതി
  alternative: ഈ പർവതത്തിൽ ഇനി താമസിക്കേണ്ടതില്ല
  rationale: പാഠത്തിലെ sufficiency/excess ഭാവം നിലനിർത്തി; അതിനെ വ്യക്തമായ നിരോധനകല്പനയായി മാത്രം വ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പർവതം’ എന്ന പദം ഭൂമിശാസ്ത്രപരമായ ഏകവചന സൂചന വ്യക്തമാക്കുന്നു. ഉദ്ധരണി-പ്രവേശകമായ לֵאמֹר പ്രത്യേകം വാക്കാക്കി വിവർത്തനം ചെയ്യാതെ മലയാള വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി.
