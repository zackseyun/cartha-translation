  to: എന്നാൽ നിങ്ങൾ കയറിപ്പോകാൻ സന്നദ്ധരായില്ല; നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയുടെ കല്പനയ്‌ക്കെതിരെ മത്സരിച്ചു.[a]
