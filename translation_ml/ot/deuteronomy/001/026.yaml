source:
  edition: WLC
  text: וְ/לֹ֥א אֲבִיתֶ֖ם לַ/עֲלֹ֑ת וַ/תַּמְר֕וּ אֶת פִּ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ കയറിപ്പോകാൻ സന്നദ്ധരായില്ല; നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയുടെ കല്പനയ്‌ക്കെതിരെ മത്സരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയുടെ വായ്‌ക്കെതിരെ മത്സരിച്ചു”; ‘വായ്’ എന്നത് ഇവിടെ അവന്റെ കല്പനയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: എന്നാൽ ... ഇല്ല
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲבִיתֶם
  choice: മനസ്സുവെച്ചില്ല
  rationale: അംഗീകരിക്കാനോ ചെയ്യാനോ സന്നദ്ധരാകുക എന്ന ഇച്ഛാസംബന്ധമായ അർഥം നിലനിർത്തുന്നു; വെറും കഴിവില്ലായ്മയെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: לַעֲלֹת
  choice: കയറിപ്പോകാൻ
  rationale: עלה എന്ന ക്രിയയുടെ മുകളിലേക്കുള്ള ദിശാബോധം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַתַּמְרוּ
  choice: ധിക്കരിച്ചു
  rationale: അധികാരത്തോടുള്ള ബോധപൂർവമായ എതിർപ്പും അനുസരണക്കേടും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֶת־פִּי
  choice: കല്പനയെ
  rationale: അക്ഷരാർഥത്തിൽ ‘വായെ’ എന്നാണെങ്കിലും, ഇവിടെ ഒരാളുടെ വായിൽനിന്നുള്ള ആജ്ഞയെ എതിർക്കുക എന്ന എബ്രായ ശൈലിയാണ്; ‘കല്പന’ അതിന്റെ സന്ദർഭാർഥം നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവികനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ ഏകവചന ഉടമ്പടിസംബന്ധമായ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവികനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപം നിലനിർത്തുന്നു.
- issue: ‘യഹോവയുടെ വായെ ധിക്കരിച്ചു’ എന്ന എബ്രായ പ്രയോഗം
  choice: യഹോവയുടെ കല്പനയെ ധിക്കരിച്ചു
  alternative: യഹോവയുടെ വായെ ധിക്കരിച്ചു
  rationale: അക്ഷരാർഥരൂപം മലയാളത്തിൽ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കും; സന്ദർഭത്തിലെ ആജ്ഞാലംഘനം വ്യക്തമാക്കുന്നതിനൊപ്പം അടിക്കുറിപ്പിൽ മൂലരൂപം രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മനസ്സുവെച്ചില്ല’ ഇച്ഛാപൂർവമായ നിരസനം സൂചിപ്പിക്കുന്നു; അർധവിരാമം നിരസനവും തുടർന്നുള്ള ധിക്കാരവും തമ്മിലുള്ള അടുത്ത ബന്ധം നിലനിർത്തുന്നു.
