language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּרָגְנ֤וּ בְ/אָהֳלֵי/כֶם֙ וַ/תֹּ֣אמְר֔וּ בְּ/שִׂנְאַ֤ת יְהוָה֙ אֹתָ֔/נוּ הוֹצִיאָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַשְׁמִידֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: ml
  text: 'നിങ്ങൾ നിങ്ങളുടെ കൂടാരങ്ങളിൽ പിറുപിറുത്തുകൊണ്ട് പറഞ്ഞു: “യഹോവ ഞങ്ങളെ വെറുക്കുന്നതുകൊണ്ടാണ്[a] അവിടുന്ന് ഞങ്ങളെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ച് അമോര്യരുടെ കൈയിൽ ഏൽപ്പിച്ച് ഞങ്ങളെ നശിപ്പിക്കാൻ ചെയ്തത്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “യഹോവയുടെ ഞങ്ങളോടുള്ള വെറുപ്പിൽ”; ഇവിടെ കാരണാർഥത്തിൽ, “യഹോവ ഞങ്ങളെ വെറുക്കുന്നതുകൊണ്ട്” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഞങ്ങളെ അമോര്യന്റെ കൈയിൽ കൊടുക്കേണ്ടതിന്”; ‘അമോര്യൻ’ ഇവിടെ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: പിറുപിറുത്തുകൊണ്ട്
  rationale: רגן എന്ന ക്രിയ അസംതൃപ്തിയോടെ അടക്കം പരാതി പറയുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പിറുപിറുക്കുക’ ആ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְאָהֳלֵיכֶם
  choice: നിങ്ങളുടെ കൂടാരങ്ങളിൽവെച്ച്
  rationale: മരുഭൂമിയിലെ മൂർത്തമായ താമസസാഹചര്യം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള സ്ഥലസൂചന.
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: യഹോവ ഞങ്ങളെ വെറുക്കുന്നതുകൊണ്ടാണ്
  rationale: ‘യഹോവയുടെ ഞങ്ങളോടുള്ള വെറുപ്പിൽ’ എന്ന അക്ഷരാർഥ ഘടനയ്ക്ക് ഇവിടെ കാരണാർഥമുണ്ട്; ജനത്തിന്റെ ആരോപണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: ഞങ്ങളെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചത്
  rationale: ‘ഈജിപ്തുദേശം’ എന്ന മൂലപാഠത്തിലെ പൂർണ പ്രയോഗവും പുറപ്പെടുവിക്കൽ എന്ന നിർഗമനഭാഷയും സംരക്ഷിക്കുന്നു.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: അമോര്യരുടെ കൈയിൽ ഏൽപ്പിക്കേണ്ടതിന്
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന അധികാരത്തിന് അധീനമാക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സുതാര്യമായ ‘കൈയിൽ ഏൽപ്പിക്കുക’ എന്നു നൽകി; ഏകവചനരൂപത്തിലുള്ള ജനനാമം സമൂഹവാചിയായി ബഹുവചനത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: לְהַשְׁמִידֵנוּ
  choice: ഞങ്ങളെ നശിപ്പിക്കാനായി
  rationale: ഹിഫ്ഈൽ രൂപത്തിന്റെ നശിപ്പിക്കൽ/ഉന്മൂലനം എന്ന ശക്തമായ അർഥം അതിരുകടന്ന വിശദീകരണമില്ലാതെ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ മലയാളത്തിലെ സ്ഥാപിതമായ നാമരൂപം ഉപയോഗിച്ചു.
- issue: ‘യഹോവ ഞങ്ങളെ വെറുക്കുന്നു’ എന്ന വാക്യത്തിന്റെ നില
  choice: ജനങ്ങൾ ഉന്നയിച്ച ആരോപണമായി ഉദ്ധരണിക്കുള്ളിൽ നിലനിർത്തി
  alternative: ദൈവം യഥാർഥത്തിൽ അവരെ വെറുത്തുവെന്ന വിവരണമായി വ്യാഖ്യാനിക്കുക
  rationale: മോശെ ഓർമ്മിപ്പിക്കുന്ന ജനങ്ങളുടെ വാക്കുകളാണിവ; അവയുടെ ദൈവശാസ്ത്രപരമായ സത്യാസത്യങ്ങൾ പരിഭാഷയിൽ മുൻകൂട്ടി തീർപ്പാക്കാതെ വാക്യഘടന സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പിറുപിറുക്കുക’, ‘കൂടാരം’, ‘കൈയിൽ ഏൽപ്പിക്കുക’, ‘പുറപ്പെടുവിക്കുക’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ദൃശ്യഭാഷ നിലനിർത്തുന്നതുമാണ്. ഉദ്ധരണിയുടെ ആരോപണസ്വരം സംരക്ഷിച്ചിരിക്കുന്നു.
