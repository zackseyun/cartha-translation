translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. ദീർഘമായ ഭൂമിശാസ്ത്രപ്പട്ടികയുടെ ബന്ധം വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ [a] തെറ്റായ സ്ഥാനത്താണെന്നു തോന്നുന്നതിനാൽ, അതിന്റെ ഉള്ളടക്കത്തിന് യോജിച്ച שְׁפֵלָה എന്ന പദത്തിന്റെ വിവർത്തനത്തിനു പിന്നാലെ അടിക്കുറിപ്പുസൂചകം ചേർത്തു.
