  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: ml
  text: തിരിഞ്ഞ് യാത്ര പുറപ്പെടുവിൻ; അമോര്യരുടെ മലനാട്ടിലേക്കും അതിന്റെ ചുറ്റുമുള്ള എല്ലാ പ്രദേശങ്ങളിലേക്കും—അരാബായിലും മലനാട്ടിലും താഴ്ന്ന പ്രദേശത്തും[a] നെഗെവിലും കടൽത്തീരത്തും, കനാന്യരുടെ ദേശത്തും ലെബാനോനിലും—മഹാനദിയായ യൂഫ്രട്ടീസ് നദിവരെ ചെല്ലുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഷെഫേലയിൽ”; പടിഞ്ഞാറൻ താഴ്ന്ന പ്രദേശത്തിന്റെയും മലഞ്ചെരിവുകളുടെ അടിവാരപ്രദേശത്തിന്റെയും ഭൂമിശാസ്ത്രനാമമാണിത്.
    reason: lexical_alternative
