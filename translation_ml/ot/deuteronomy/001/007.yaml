  rationale: യോർദ്ദാൻ ഭ്രംശതാഴ്‌വരയുമായി ബന്ധപ്പെട്ട പ്രത്യേക ഭൂമിശാസ്ത്രനാമമായതിനാൽ പൊതുവായ ‘സമതലം’ എന്നതിനു പകരം നാമം നിലനിർത്തി.
