source:
  edition: WLC
  text: רְ֠אֵה נָתַ֨ן יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ אֶת הָ/אָ֑רֶץ עֲלֵ֣ה רֵ֗שׁ כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: ml
  text: ഇതാ, നിന്റെ ദൈവമായ യാഹ്‌വേ ആ ദേശം നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്നു. നിന്റെ പിതാക്കന്മാരുടെ[a] ദൈവമായ യാഹ്‌വേ നിന്നോടു പറഞ്ഞതുപോലെ, കയറിച്ചെന്ന് അതു കൈവശമാക്കുക. ഭയപ്പെടരുത്; മനസ്സുതളരരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ പൂർവികരുടെ.’ എബ്രായമൂലത്തിൽ ‘നിന്റെ പിതാക്കന്മാരുടെ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: ഇതാ
  rationale: ראה എന്ന ഏകവചന ആജ്ഞ ഇവിടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗമാണ്. അക്ഷരാർഥമായ ‘നോക്കുക’ എന്നതിനെക്കാൾ, ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും ശ്രദ്ധ ക്ഷണിക്കുന്ന ‘ഇതാ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവം
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയമുള്ള ഉടമ്പടിപരമായ അഭിസംബോധന അതേ ഏകവചനത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָתַן ... לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്നു
  rationale: ‘നൽകുക/വെക്കുക’ എന്ന נתן-നും ‘നിന്റെ മുമ്പിൽ’ എന്ന പ്രയോഗത്തിനും ചേർന്നുള്ള അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ദേശം പ്രവേശിച്ചു കൈവശമാക്കാൻ മുന്നിൽ ലഭ്യമാക്കിയിരിക്കുന്നു എന്ന ആശയം നിലനിൽക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ആ ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിന്റെ പശ്ചാത്തലത്തിൽ വാഗ്ദത്തദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ നിർദിഷ്ടതയോടെ ‘ആ ദേശം’ എന്നു നൽകുന്നു.
- source_word: עֲלֵה
  choice: കയറിച്ചെന്ന്
  rationale: ദേശത്തേക്കു, പ്രത്യേകിച്ച് മലനാട്ടിലേക്കു, മുന്നേറുന്നതിനെ സൂചിപ്പിക്കുന്ന ‘കയറുക’ എന്ന ദിശാബോധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: רֵשׁ
  choice: കൈവശമാക്കുക
  rationale: ירשׁ ഇവിടെ ദൈവം നൽകുന്ന ദേശത്തിലേക്കു പ്രവേശിച്ച് അതിന്റെ അവകാശം ഏറ്റെടുക്കുന്ന സജീവ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: അരുളിച്ചെയ്തതുപോലെ
  rationale: മൂലത്തിലെ ‘സംസാരിച്ചതുപോലെ’ എന്ന അർഥം ‘വാഗ്ദാനം ചെയ്തതുപോലെ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, ദൈവത്തിന്റെ ഗൗരവമുള്ള വചനപ്രയോഗമായി നൽകുന്നു.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: ഉടമ്പടിപരമായ കുടുംബസൂത്രവാക്യത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; ‘പൂർവികർ’ എന്ന വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אַל תִּירָא
  choice: ഭയപ്പെടരുത്
  rationale: ירא-യുടെ നേരിട്ടുള്ള നിരോധനവും സംക്ഷിപ്തമായ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: וְאַל תֵּחָת
  choice: മനസ്സിടിയുകയും അരുത്
  rationale: חתת സൂചിപ്പിക്കുന്ന ഭയത്താൽ ഉള്ളിൽ തകർന്നുപോകൽ, ധൈര്യം നഷ്ടപ്പെടൽ എന്നീ ഭാവങ്ങൾ ‘ഭയപ്പെടരുത്’ എന്ന ആദ്യ നിരോധനത്തിൽ ലയിപ്പിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ വേർതിരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെയും ‘Jehovah’ രൂപത്തിലേക്കു മാറ്റാതെയും ‘Yahweh’ എന്ന പുനർനിർമിത ഉച്ചാരണത്തിന് അനുസരിച്ച് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אֱלֹהֵי אֲבֹתֶיךָ എന്ന ലിംഗനിർദിഷ്ട ഉടമ്പടിപ്രയോഗം
  choice: നിന്റെ പിതാക്കന്മാരുടെ ദൈവം
  alternative: നിന്റെ പൂർവികരുടെ ദൈവം
  rationale: എബ്രായത്തിലെ ‘പിതാക്കന്മാർ’ എന്ന വ്യക്തമായ രൂപവും അതിന്റെ ഉടമ്പടിപരമായ പ്രാധാന്യവും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; ഉൾക്കൊള്ളുന്ന വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ രണ്ടാം പുരുഷ ഏകവചന അഭിസംബോധന ‘നിന്റെ/നിന്നോടു’ എന്ന രൂപങ്ങളിൽ നിലനിർത്തി. ‘ഭയപ്പെടരുത്; മനസ്സിടിയുകയും അരുത്’ എന്ന സമാന്തരഘടന മൂലത്തിലെ രണ്ട് വ്യത്യസ്ത നിരോധനങ്ങളുടെ ഭാവവ്യത്യാസം സംരക്ഷിക്കുന്നു.
