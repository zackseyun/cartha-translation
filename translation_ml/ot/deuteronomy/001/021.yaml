- from: ഇതാ, നിന്റെ ദൈവമായ യാഹ്‌വേ ആ ദേശം നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്നു. നിന്റെ പിതാക്കന്മാരുടെ[a] ദൈവമായ യാഹ്‌വേ നിന്നോടു അരുളിച്ചെയ്തതുപോലെ, കയറിച്ചെന്ന് അതു കൈവശമാക്കുക. ഭയപ്പെടരുത്; മനസ്സിടിയുകയും അരുത്.
