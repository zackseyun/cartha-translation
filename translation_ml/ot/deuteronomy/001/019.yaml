revisions:
- from: പിന്നെ നമ്മൾ ഹോരേബിൽനിന്ന് പുറപ്പെട്ട്, നമ്മുടെ ദൈവമായ യഹോവ നമ്മോടു കല്പിച്ചതുപോലെ, അമോര്യരുടെ മലനാട്ടിലേക്കുള്ള വഴിയിൽ നിങ്ങൾ കണ്ട വിശാലവും ഭയജനകവുമായ ആ മരുഭൂമിയിലൂടെ മുഴുവൻ സഞ്ചരിച്ചു; അങ്ങനെ കാദേശ്-ബർന്നേയവരെ എത്തി.[a]
  to: പിന്നെ നാം ഹോരേബിൽനിന്ന് പുറപ്പെട്ടു; അമോര്യരുടെ മലനാട്ടിലേക്കുള്ള വഴിയായി, നിങ്ങൾ കണ്ട ആ വിശാലവും ഭയജനകവുമായ മരുഭൂമിയാകെ കടന്നുപോയി. നമ്മുടെ ദൈവമായ യഹ്‌വേ നമ്മോടു കൽപ്പിച്ചതുപോലെ നാം കാദേശ്-ബർന്നേയവരെ എത്തി.[a]
  rationale: മൂലപാഠത്തിലെ ക്രമം കൂടുതൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നതിനും, “Yahweh” എന്ന POB നാമനയത്തോട് യോജിക്കുന്നതിനും, ആധുനിക നിലവാരമുള്ള മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്ക് ഉറപ്പാക്കുന്നതിനുമായി വാക്യം തിരുത്തി. അടിക്കുറിപ്പിൽ נוֹרָאയുടെ അർഥവ്യാപ്തി നിലനിർത്തി; പ്രത്യേക മതപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
