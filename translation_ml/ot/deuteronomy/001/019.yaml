reference: Deuteronomy 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: ml
  text: പിന്നെ നാം ഹോരേബിൽനിന്ന് പുറപ്പെട്ടു; അമോര്യരുടെ മലനാട്ടിലേക്കുള്ള വഴിയായി, നിങ്ങൾ കണ്ട ആ വിശാലവും ഭയജനകവുമായ മരുഭൂമിയാകെ കടന്നുപോയി. നമ്മുടെ ദൈവമായ യഹ്‌വേ നമ്മോടു കൽപ്പിച്ചതുപോലെ നാം കാദേശ്-ബർന്നേയവരെ എത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഭയജനകമായ” എന്നു വിവർത്തനം ചെയ്ത എബ്രായപദത്തിന് “ഭയങ്കരമായ” എന്നും അർഥമാകാം; ഭയം, വിസ്മയം, അല്ലെങ്കിൽ നടുക്കം ഉണർത്തുന്നതിനെ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסַּע מֵחֹרֵב
  choice: നമ്മൾ ഹോരേബിൽനിന്ന് പുറപ്പെട്ട്
  rationale: נסע എന്ന ക്രിയ പാളയം പൊളിച്ച് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: ആ മരുഭൂമിയിലൂടെ മുഴുവൻ സഞ്ചരിച്ചു
  rationale: הלך എന്ന ക്രിയയ്ക്കൊപ്പം മരുഭൂമി നേരിട്ടുള്ള കർമമായി വരുന്നതിനാൽ, പ്രദേശം കടന്നുപോയെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַמִּדְבָּר הַגָּדוֹל וְהַנּוֹרָא
  choice: വിശാലവും ഭയജനകവുമായ ആ മരുഭൂമി
  rationale: גדול ഇവിടെ പ്രദേശത്തിന്റെ വ്യാപ്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വിശാലം’ എന്നും, נורא ഭയം അഥവാ ഭക്ത്യാദരമുണർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭയജനകം’ എന്നും നൽകി.
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: അമോര്യരുടെ മലനാട്ടിലേക്കുള്ള വഴിയിൽ
  rationale: הר ഇവിടെ ഒറ്റ മലയേക്കാൾ മലമ്പ്രദേശത്തെ കൂട്ടായി സൂചിപ്പിക്കുന്നു; דרך ലക്ഷ്യത്തിലേക്കുള്ള വഴിയെന്ന നിലയിൽ എടുത്തു.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമമായ יהוה ശീർഷകമായി മാറ്റാതെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהֵינוּ ‘നമ്മുടെ ദൈവം’ എന്നാണ്.
- source_word: עַד קָדֵשׁ בַּרְנֵעַ
  choice: കാദേശ്-ബർന്നേയവരെ
  rationale: עד ലക്ഷ്യപരിധി സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ടെട്രാഗ്രാമറ്റൺ നേരിട്ട് ഉള്ളതിനാൽ, അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- issue: נוֹרָא എന്ന വിശേഷണത്തിന്റെ അർഥവ്യാപ്തി
  choice: ഭയജനകമായ
  alternative: ഭയങ്കരമായ / ഭക്ത്യാദരമുണർത്തുന്ന
  rationale: ഈ പദത്തിന് ഭയം, വിസ്മയം, ഭക്ത്യാദരം എന്നിവ ഉണർത്തുന്നെന്ന അർഥവ്യാപ്തിയുണ്ട്. സാഹചര്യത്തിൽ മരുഭൂമിയുടെ ഭീഷണിസ്വഭാവം മുൻനിൽക്കുന്നതിനാൽ ‘ഭയജനകമായ’ എന്നു നൽകി; പദത്തിന്റെ മുഴുവൻ വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. യാത്രാവിവരണത്തിന്റെ ക്രമം സംരക്ഷിക്കുകയും എബ്രായത്തിന്റെ ദീർഘവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും ചെയ്തു.
