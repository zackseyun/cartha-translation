  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּיטַ֥ב בְּ/עֵינַ֖/י הַ/דָּבָ֑ר וָ/אֶקַּ֤ח מִ/כֶּם֙ שְׁנֵ֣ים עָשָׂ֣ר אֲנָשִׁ֔ים אִ֥ישׁ אֶחָ֖ד לַ/שָּֽׁבֶט׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/023.yaml
  text: And the matter seemed good in my eyes[a], so I took from among you twelve men, one man for each tribe.
translation:
  language: ml
  text: ആ നിർദേശം എനിക്ക് സ്വീകാര്യമായി തോന്നി[a]. അതുകൊണ്ട് ഞാൻ നിങ്ങളിൽനിന്ന് ഓരോ ഗോത്രത്തിനും ഒരാൾ വീതം പന്ത്രണ്ട് പുരുഷന്മാരെ തിരഞ്ഞെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആ നിർദേശം എന്നെ പ്രസാദിപ്പിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי
  choice: എനിക്ക് സ്വീകാര്യമായി തോന്നി
  rationale: ‘എന്റെ കണ്ണുകളിൽ നല്ലതായി’ എന്ന ഹീബ്രു പ്രയോഗം വ്യക്തിപരമായ അംഗീകാരത്തെയും പ്രസാദത്തെയും സൂചിപ്പിക്കുന്നു. അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നതിനോടൊപ്പം ‘തോന്നി’ എന്നത് മൂലത്തിലെ വിലയിരുത്തൽഭാവം നിലനിർത്തുന്നു.
- source_word: הַדָּבָר
  choice: ആ നിർദേശം
  rationale: മുൻവാക്യത്തിൽ ജനങ്ങൾ മുന്നോട്ടുവച്ച ചാരന്മാരെ അയയ്ക്കാനുള്ള നിർദേശത്തെയാണ് ഇവിടെ דָּבָר സൂചിപ്പിക്കുന്നത്. ‘കാര്യം’ സാധ്യമെങ്കിലും, സന്ദർഭത്തിൽ ‘നിർദേശം’ കൂടുതൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וָאֶקַּח
  choice: തിരഞ്ഞെടുത്തു
  rationale: לקח എന്നതിന് അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നർഥമുണ്ടെങ്കിലും, ഇവിടെ ജനങ്ങളിൽനിന്ന് പ്രതിനിധികളെ തിരഞ്ഞെടുക്കുന്നതാണ് ഉദ്ദേശ്യം; അതിനാൽ ‘തിരഞ്ഞെടുത്തു’ സന്ദർഭോചിതമാണ്.
- source_word: מִכֶּם
  choice: നിങ്ങളിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗം ആ സമൂഹത്തിനുള്ളിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്നു; ‘നിങ്ങളിൽനിന്ന്’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: പന്ത്രണ്ട് പുരുഷന്മാരെ
  rationale: ഈ പ്രയോഗം പന്ത്രണ്ട് പ്രായപൂർത്തിയായ പുരുഷന്മാരെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; അതിനാൽ ലിംഗനിർദ്ദിഷ്ടമായ വിവർത്തനം നിലനിർത്തി.
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: ഓരോ ഗോത്രത്തിനും ഒരാൾ വീതം
  rationale: ഈ വിതരണം സൂചിപ്പിക്കുന്ന പ്രയോഗം ഓരോ ഗോത്രത്തിൽനിന്നുമുള്ള ഒരോ പ്രതിനിധിയെയാണ് ഉദ്ദേശിക്കുന്നത്. ‘ഒരാൾ വീതം’ മലയാളത്തിൽ ആ വിതരണാർഥം വ്യക്തമായി നൽകുന്നു.
