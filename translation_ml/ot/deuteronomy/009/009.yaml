source:
  edition: WLC
  text: בַּ/עֲלֹתִ֣/י הָ/הָ֗רָ/ה לָ/קַ֜חַת לוּחֹ֤ת הָֽ/אֲבָנִים֙ לוּחֹ֣ת הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת יְהוָ֖ה עִמָּ/כֶ֑ם וָ/אֵשֵׁ֣ב בָּ/הָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֥א שָׁתִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: ml
  text: യഹ്‌വെ നിങ്ങളോടു ചെയ്ത[b] ഉടമ്പടിയുടെ പലകകളായ കൽപ്പലകകൾ സ്വീകരിക്കാൻ[a] ഞാൻ പർവതത്തിൽ കയറിയപ്പോൾ, നാല്പതു ദിവസവും നാല്പതു രാത്രിയും ഞാൻ പർവതത്തിൽ കഴിഞ്ഞു; ഞാൻ അപ്പം തിന്നുകയോ വെള്ളം കുടിക്കുകയോ ചെയ്തില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘എടുക്കാൻ.’ ഇവിടെ പലകകൾ നൽകപ്പെടുന്നതിനാൽ ‘സ്വീകരിക്കാൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘നിങ്ങളോടു മുറിച്ച.’ ‘ഉടമ്പടി മുറിക്കുക’ എന്നത് ‘ഉടമ്പടി ചെയ്യുക’ എന്നർഥമുള്ള സ്ഥിരമായ ഹീബ്രു പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי הָהָרָה
  choice: ഞാൻ പർവതത്തിൽ കയറിയപ്പോൾ
  rationale: בְּ + infinitive construct കാലസൂചന നൽകുന്നു; ദിശാസൂചകമായ הָהָרָהയും കയറ്റത്തിന്റെ ആശയവും മലയാളത്തിലെ സ്വാഭാവികമായ ‘പർവതത്തിൽ കയറിയപ്പോൾ’ എന്ന പ്രയോഗത്തിൽ സംയോജിപ്പിച്ചു.
- source_word: לָקַחַת
  choice: സ്വീകരിക്കാൻ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ദൈവം നൽകുന്ന പലകകൾ മോശെ കൈപ്പറ്റുന്നതാണ് സന്ദർഭം; അതിനാൽ ‘സ്വീകരിക്കാൻ’ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לוּחֹת הָאֲבָנִים לוּחֹת הַבְּרִית
  choice: ഉടമ്പടിയുടെ പലകകളായ കൽപ്പലകകൾ
  rationale: ആവർത്തിച്ചുള്ള സമാനാധികരണ ഘടനയുടെ ആശയം നിലനിർത്തിക്കൊണ്ട്, അവ കല്ലുകൊണ്ടുള്ള പലകകളും ഉടമ്പടിയുടെ പലകകളും ആണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּרַת ... עִמָּכֶם
  choice: നിങ്ങളുമായി ചെയ്ത
  rationale: ഉടമ്പടിയോടൊപ്പം כרת ഉപയോഗിക്കുന്നത് ‘ഉടമ്പടി ചെയ്യുക/സ്ഥാപിക്കുക’ എന്ന സ്ഥിരമായ ഹീബ്രു പ്രയോഗമാണ്; ‘ചെയ്ത’ മലയാളത്തിൽ സ്വാഭാവികമാണ്, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וָאֵשֵׁב בָּהָר
  choice: ഞാൻ പർവതത്തിൽ കഴിഞ്ഞു
  rationale: ישׁב എന്നതിന് ‘ഇരിക്കുക’, ‘താമസിക്കുക’, ‘കഴിയുക’ എന്നീ അർഥങ്ങളുണ്ട്; ഇവിടെ നാല്പതു ദിവസത്തെ തുടർച്ചയായ സാന്നിധ്യമാണ് ഉദ്ദേശ്യം.
- source_word: לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי
  choice: ഞാൻ അപ്പം തിന്നുകയോ വെള്ളം കുടിക്കുകയോ ചെയ്തില്ല
  rationale: לֶחֶם എന്ന മൂർത്തമായ ‘അപ്പം’ നിലനിർത്തി; രണ്ട് നിഷേധവാക്യങ്ങളെയും മലയാളത്തിലെ സ്വാഭാവികമായ സമാന്തര ‘-യോ ... -യോ ചെയ്തില്ല’ ഘടനയിൽ അവതരിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിനാമംകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: כרת ברית എന്ന ഉടമ്പടി പ്രയോഗം
  choice: ഉടമ്പടി ചെയ്തു
  alternative: ഉടമ്പടി മുറിച്ചു
  rationale: ‘മുറിക്കുക’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ തെറ്റായ ധാരണയ്ക്കിടയാക്കാം; ഹീബ്രു ഭാഷയിലെ സ്ഥിരപ്രയോഗത്തിന്റെ അർഥം മുഖ്യപാഠത്തിൽ നൽകി, അതിന്റെ രൂപകാത്മക അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ കാലദൈർഘ്യം, അപ്പം-വെള്ളം സമാന്തരത, കൽപ്പലകകൾ/ഉടമ്പടിപ്പലകകൾ എന്ന തിരിച്ചറിയൽ എന്നിവ നിലനിർത്തി; അപരിചിതമായ ഹീബ്രു പ്രയോഗങ്ങൾ അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു.
