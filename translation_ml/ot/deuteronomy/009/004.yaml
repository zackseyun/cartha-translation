revisions:
- from: നിന്റെ ദൈവമായ യഹ്‌വെ അവരെ നിന്റെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയുമ്പോൾ, “എന്റെ നീതിനിമിത്തമാണ് യഹ്‌വെ ഈ ദേശം കൈവശമാക്കാൻ എന്നെ ഇവിടെ കൊണ്ടുവന്നത്” എന്ന് നിന്റെ ഹൃദയത്തിൽ പറയരുത്.[a] ഈ ജനതകളുടെ ദുഷ്ടതനിമിത്തമാണ് യഹ്‌വെ അവരെ നിന്റെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുന്നത്.
  to: 'നിന്റെ ദൈവമായ യഹ്‌വെ അവരെ നിന്റെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയുമ്പോൾ, നിന്റെ ഹൃദയത്തിൽ ഇങ്ങനെ പറയരുത്: “എന്റെ നീതിനിമിത്തമാണ് യഹ്‌വെ ഈ ദേശം കൈവശമാക്കാൻ[a] എന്നെ കൊണ്ടുവന്നത്.” എന്നാൽ ഈ ജനതകളുടെ ദുഷ്ടതനിമിത്തമാണ് യഹ്‌വെ അവരെ നിന്റെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുന്നത്.'
  rationale: The revision removes the unexpressed ‘here,’ clarifies the quoted inner speech and the contextual contrast, and relocates the lexical footnote marker to ‘കൈവശമാക്കാൻ.’ It retains the source's idiom, causal language, divine name, and the distinction between possessing the land and dispossessing the nations.
