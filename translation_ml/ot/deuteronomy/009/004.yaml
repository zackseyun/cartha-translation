source:
  edition: WLC
  text: אַל תֹּאמַ֣ר בִּ/לְבָבְ/ךָ֗ בַּ/הֲדֹ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֹתָ֥/ם מִ/לְּ/פָנֶי/ךָ֮ לֵ/אמֹר֒ בְּ/צִדְקָתִ/י֙ הֱבִיאַ֣/נִי יְהוָ֔ה לָ/רֶ֖שֶׁת אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְ/רִשְׁעַת֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה יְהוָ֖ה מוֹרִישָׁ֥/ם מִ/פָּנֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: ml
  text: 'നിന്റെ ദൈവമായ യഹ്‌വെ അവരെ നിന്റെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയുമ്പോൾ, നിന്റെ ഹൃദയത്തിൽ ഇങ്ങനെ പറയരുത്: “എന്റെ നീതിനിമിത്തമാണ് യഹ്‌വെ ഈ ദേശം കൈവശമാക്കാൻ[a] എന്നെ കൊണ്ടുവന്നത്.” എന്നാൽ ഈ ജനതകളുടെ ദുഷ്ടതനിമിത്തമാണ് യഹ്‌വെ അവരെ നിന്റെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുന്നത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്റെ നീതിനിമിത്തമാണ് യഹ്‌വെ ഈ ദേശം അവകാശമാക്കാൻ എന്നെ കൊണ്ടുവന്നത്.” എബ്രായത്തിലെ ירשׁ എന്ന ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘കൈവശമാക്കുക’, ‘അവകാശമാക്കുക’, അല്ലെങ്കിൽ ‘കൈവശത്തിൽനിന്ന് നീക്കുക’ എന്നിങ്ങനെ അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר בִּלְבָבְךָ
  choice: നിന്റെ ഹൃദയത്തിൽ പറയരുത്
  rationale: അകത്തെ ചിന്തയെയോ സ്വയം പറയുന്നതിനെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഹൃദയരൂപകം നിലനിർത്തിക്കൊണ്ട് നിരോധനത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בַּהֲדֹף
  choice: ഓടിച്ചുകളയുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; נדף എന്ന ക്രിയയുടെ ബലമായി അകറ്റുന്ന അർഥം ജയിച്ചടക്കലിന്റെ പശ്ചാത്തലത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּצִדְקָתִי
  choice: എന്റെ നീതിനിമിത്തമാണ്
  rationale: ഇസ്രായേൽ സ്വന്തം ധാർമിക നീതിയോ അർഹതയോ കാരണമായി അവകാശപ്പെടുന്ന തെറ്റായ ധാരണയെ ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: הֱבִיאַנִי
  choice: എന്നെ ഇവിടെ കൊണ്ടുവന്നത്
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘എന്നെ പ്രവേശിപ്പിച്ചു/കൊണ്ടുവന്നു’ എന്ന അർഥം, ദേശപ്രവേശത്തിന്റെ സാഹചര്യത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഇവിടെ’ സാഹചര്യത്തിൽ നിഗൂഢമായിരിക്കുന്ന പ്രവേശനലക്ഷ്യത്തെ തുറന്നുകാട്ടുന്നു.
- source_word: לָרֶשֶׁת אֶת הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശം കൈവശമാക്കാൻ
  rationale: ירשׁ എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ ‘കൈവശമാക്കുക’ എന്ന അർഥം സ്വീകരിക്കുന്നു; ഉടമസ്ഥതയും ദേശപ്രവേശവും രണ്ടും വ്യക്തമാണ്.
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: ഈ ജനതകളുടെ ദുഷ്ടതനിമിത്തമാണ്
  rationale: വാവിന്റെ ആശയവൈരുധ്യം മലയാളത്തിലെ വാക്യക്രമവും ‘ആണ്’ എന്ന ഊന്നലുംകൊണ്ട് വ്യക്തമാക്കുന്നു; ഇസ്രായേലിന്റെ നീതിയല്ല, ജനതകളുടെ ദുഷ്ടതയാണ് ഇവിടെ പറയുന്ന കാരണം.
- source_word: מוֹרִישָׁם
  choice: അവരെ ... നീക്കിക്കളയുന്നത്
  rationale: ירשׁ-ന്റെ ഹിഫീൽ രൂപം ഇവിടെ മറ്റുള്ളവരെ അവരുടെ കൈവശത്തുനിന്ന് പുറത്താക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നീക്കിക്കളയുക’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ശാസ്ത്രീയ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ഇസ്രായേൽ സ്വന്തം നീതിയാൽ ദേശം നേടിയെന്ന ധാരണ
  choice: “എന്റെ നീതിനിമിത്തമാണ്...” എന്ന അവകാശവാദം അതേപടി നിലനിർത്തുകയും തുടർന്ന് യഥാർഥ കാരണവുമായി വിപരീതമായി ചേർക്കുകയും ചെയ്തു
  alternative: ‘എന്റെ യോഗ്യതകൊണ്ട്’ എന്ന് വ്യാഖ്യാനപരമായി മൃദൂകരിക്കുക
  rationale: צְדָקָה എന്ന ദൈവശാസ്ത്രപരമായ പദത്തിന്റെ ഭാരം നിലനിർത്തി, അനുഗ്രഹം ധാർമിക അർഹതകൊണ്ട് സമ്പാദിച്ചതാണെന്ന ധാരണയെ മോശെ നിരാകരിക്കുന്ന സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: വാവിന്റെ ബന്ധാർഥം
  choice: രണ്ട് വാക്യങ്ങളിലെ ഊന്നലിലൂടെ ആശയവൈരുധ്യം പ്രകടിപ്പിച്ചു
  alternative: ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘അതേസമയം’ എന്ന് തുറന്നുചേർക്കുക
  rationale: וּ എന്ന ബന്ധകത്തിന്റെ അടിസ്ഥാനരൂപം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ, സന്ദർഭത്തിലെ വൈരുധ്യം സ്വാഭാവിക മലയാള വാക്യഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നിന്റെ ഹൃദയത്തിൽ’ എന്ന മൂലഭാഷാരൂപകം നിലനിർത്തി. ദേശം കൈവശമാക്കുന്നതും ജനതകളെ നീക്കുന്നതും തമ്മിലുള്ള ירשׁ പദകുടുംബബന്ധം മലയാളത്തിൽ സാധ്യമായത്ര വ്യക്തമായി സൂക്ഷിച്ചു.
