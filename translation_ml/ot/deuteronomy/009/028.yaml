source:
  edition: WLC
  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: ml
  text: 'അല്ലെങ്കിൽ, നീ ഞങ്ങളെ പുറപ്പെടുവിച്ച ദേശം[a] ഇങ്ങനെ പറയും: ‘യഹ്‌വേയ്ക്ക് അവരോടു വാഗ്ദാനം ചെയ്ത ദേശത്തേക്ക്[b] അവരെ കൊണ്ടുവരാൻ കഴിവില്ലാതിരുന്നതിനാലും അവൻ അവരെ വെറുത്തതിനാലും, മരുഭൂമിയിൽവെച്ച് അവരെ കൊന്നുകളയാൻ അവൻ അവരെ പുറപ്പെടുവിച്ചു.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നീ ഞങ്ങളെ പുറപ്പെടുവിച്ച ദേശം’; ഇവിടെ ‘ദേശം’ എന്നത് ആ ദേശത്തെ നിവാസികളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവരോട് ഏതു ദേശത്തെക്കുറിച്ചു പറഞ്ഞുവോ, ആ ദേശത്തേക്ക്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: മുൻസന്ദർഭത്തിൽ ഭയപ്പെടുന്ന അനന്തരഫലം അവതരിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ മുന്നറിയിപ്പിന്റെ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: നീ ഞങ്ങളെ പുറപ്പെടുവിച്ച ദേശം
  rationale: എബ്രായത്തിൽ ‘ദേശം’ തന്നെയാണ് വ്യാകരണവിഷയം; അവിടത്തെ നിവാസികളെ സൂചിപ്പിക്കുന്ന ഈ ലക്ഷണപ്രയോഗം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: യഹ്‌വേയ്ക്ക് ... കഴിവില്ലാതിരുന്നതിനാൽ
  rationale: യഹ്‌വേയുടെ യഥാർഥ പരിമിതിയല്ല, ദേശവാസികൾ ഉന്നയിക്കാനിടയുള്ള ആരോപണമാണ് വാക്യം ഉദ്ധരിക്കുന്നത്; എബ്രായത്തിലെ അശക്തിയുടെ ആശയം നേരിട്ട് നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമം വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: അവരോടു വാഗ്ദാനം ചെയ്ത ദേശത്തേക്ക്
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, ദേശത്തെക്കുറിച്ചുള്ള ഉടമ്പടിസന്ദർഭത്തിൽ അത് നൽകിയ ഉറപ്പിനെ സൂചിപ്പിക്കുന്നു; ‘വാഗ്ദാനം ചെയ്ത’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ പ്രയോഗശക്തി നൽകുന്നു. കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וּמִשִּׂנְאָתוֹ אֹתָם
  choice: അവൻ അവരെ വെറുത്തതിനാലും
  rationale: മുൻപ്രത്യയം കാരണത്തെ സൂചിപ്പിക്കുന്നു; ആരോപിക്കപ്പെടുന്ന പ്രേരണ മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: הוֹצִיאָם
  choice: അവൻ അവരെ പുറപ്പെടുവിച്ചു
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ പുറപ്പെടുവിക്കൽ എന്ന ആശയവുമായി പദസമന്വയം പാലിക്കുകയും പുറപ്പാടിന്റെ പ്രതിധ്വനി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לַהֲמִתָם בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽവെച്ച് അവരെ കൊന്നുകളയാൻ
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകഭാവവും ഉദ്ദേശ്യസൂചകമായ לְ രൂപവും വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം പൊതുവായ സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ പേര് ലിപ്യന്തരിച്ചു.
- issue: דִּבֶּר לָהֶם എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: അവരോടു വാഗ്ദാനം ചെയ്ത
  alternative: അവരോട് അതിനെക്കുറിച്ചു പറഞ്ഞ
  rationale: ദേശത്തെ നൽകുമെന്ന ഉടമ്പടിസന്ദർഭത്തിൽ ‘പറഞ്ഞു’ എന്നത് വാഗ്ദാനത്തിന്റെ ശക്തിയുള്ള പ്രയോഗമാണ്. എന്നാൽ അക്ഷരാർഥത്തിലെ തുറന്ന സ്വഭാവം അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിച്ചു.
- issue: യഹ്‌വേയ്ക്ക് കഴിവില്ലെന്നും അവൻ ഇസ്രായേലിനെ വെറുത്തെന്നും പറയുന്ന പ്രസ്താവന
  choice: ആരോപണം ഉദ്ധരണിക്കുള്ളിൽ മാറ്റമില്ലാതെ നിലനിർത്തി
  alternative: ദൈവശാസ്ത്രപരമായി മൃദൂകരിച്ച പരാവർത്തനം
  rationale: ഇത് മോശെ ഭയപ്പെടുന്ന വിദേശികളുടെ തെറ്റായ വ്യാഖ്യാനമാണ്; വാക്യത്തിന്റെ വാദശക്തി നിലനിർത്താൻ ആരോപണത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ‘ദേശം പറയും’ എന്ന ലക്ഷണപ്രയോഗവും ആരോപണത്തിന്റെ ശക്തിയും സംരക്ഷിച്ചു; ദീർഘവാക്യമായിരുന്നാലും കാരണബന്ധങ്ങൾ വ്യക്തമായി ക്രമപ്പെടുത്തി.
