  text: וָֽ/אֶתְנַפַּ֞ל לִ/פְנֵ֣י יְהוָ֗ה אֵ֣ת אַרְבָּעִ֥ים הַ/יּ֛וֹם וְ/אֶת אַרְבָּעִ֥ים הַ/לַּ֖יְלָה אֲשֶׁ֣ר הִתְנַפָּ֑לְתִּי כִּֽי אָמַ֥ר יְהוָ֖ה לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/025.yaml
  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: ml
  text: അങ്ങനെ, യാഹ്‌വേ നിങ്ങളെ നശിപ്പിക്കുമെന്ന് പറഞ്ഞിരുന്നതിനാൽ, ഞാൻ യാഹ്‌വേയുടെ സന്നിധിയിൽ നാല്പതു പകലും നാല്പതു രാത്രിയും—ഞാൻ അങ്ങനെ കിടന്ന ആ നാല്പതു പകലും നാല്പതു രാത്രിയും—മുഖംകവിണ്ണു കിടന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ യാഹ്‌വേയുടെ സന്നിധിയിൽ നാല്പതു പകലും നാല്പതു രാത്രിയും സാഷ്ടാംഗം വീണുകിടന്നു.” എബ്രായ ക്രിയയ്ക്ക് മധ്യസ്ഥപ്രാർഥനയിൽ ദേഹസാഷ്ടാംഗപ്രണാമത്തിന് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל / אֲשֶׁר הִתְנַפָּלְתִּי
  choice: അതുകൊണ്ട് … ഞാൻ … സാഷ്ടാംഗം വീണുകിടന്നു
  rationale: נפל എന്ന ക്രിയയുടെ ഹിത്പഅേൽ രൂപം ഇവിടെ മോശ സ്വയം നിലത്തുവീണ് ദീർഘനേരം പ്രാർഥനാപൂർവം കിടന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സാഷ്ടാംഗം വീണുകിടന്നു’ എന്നത് ആ ഭാവവും തുടർച്ചയും സ്വാഭാവികമായി നൽകുന്നു; ആവർത്തിച്ചിരിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ പ്രത്യേകം ആവർത്തിക്കാതെ കാലദൈർഘ്യത്തോടു ചേർത്തിരിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യപരവും ബന്ധപരവുമായ അർഥം ‘സന്നിധിയിൽ’ നൽകുന്നു; ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത് ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה
  choice: നാല്പതു പകലും നാല്പതു രാത്രിയും
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ദ്വിതീയാവിഭക്തിപ്രയോഗം മലയാളത്തിൽ വിഭക്തിപ്രത്യയം കൂടാതെയും സ്വാഭാവികമാണ്. ‘പകലും … രാത്രിയും’ മൂലത്തിലെ הַיּוֹם/הַלַּיְלָה വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: כִּי אָמַר יְהוָה
  choice: യഹോവ … അരുളിച്ചെയ്തിരുന്നതിനാൽ
  rationale: כִּי ഇവിടെ മോശ സാഷ്ടാംഗം വീണുകിടന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്നു. ‘അരുളിച്ചെയ്തിരുന്നതിനാൽ’ മുൻപേ നടന്ന ദൈവിക പ്രഖ്യാപനവും കാരണബന്ധവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: നിങ്ങളെ നശിപ്പിക്കുമെന്ന്
  rationale: השמיד നശിപ്പിക്കുക എന്ന ശക്തമായ അർഥം വഹിക്കുന്നു; ‘ഉന്മൂലനം ചെയ്യുക’ എന്നതിലേക്കു അനാവശ്യമായി അതിശയോക്തി വരുത്താതെ ഉദ്ദേശിക്കപ്പെട്ട പ്രവൃത്തിയെ ഉദ്ധൃതവാക്യരീതിയിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: മോശയുടെ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: സാഷ്ടാംഗം വീണുകിടന്നു
  alternative: വീണു; മുഖംകവിണ്ണു കിടന്നു
  rationale: ഹിത്പഅേൽ രൂപം മധ്യസ്ഥപ്രാർഥനയിലെ സ്വയം താഴ്ത്തലും ദീർഘമായ പ്രണമനവും സൂചിപ്പിക്കാൻ കഴിയും. ‘സാഷ്ടാംഗം’ ഈ ഭാവം പ്രകടമാക്കുന്നു; എന്നാൽ പ്രവൃത്തി ആരാധനയാണോ അപേക്ഷയാണോ എന്നു വാക്യം മാത്രം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ ദൈവിക പ്രസ്താവനയ്ക്ക് യോജിച്ച മാന്യരൂപമാണ്. വാക്യക്രമം കാരണബന്ധം വ്യക്തമായി കാണിക്കാനും മലയാളത്തിലെ നീണ്ട പിൻവാക്യം ഒഴിവാക്കാനും ക്രമീകരിച്ചു.
