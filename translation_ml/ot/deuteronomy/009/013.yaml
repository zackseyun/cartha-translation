id: DEU.9.13
reference: Deuteronomy 9:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלַ֣/י לֵ/אמֹ֑ר רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ എന്നോടു പറഞ്ഞു: “ഞാൻ ഈ ജനത്തെ കണ്ടിരിക്കുന്നു[a]. ഇതാ, ഇതു കഴുത്തു കടുത്ത ജനമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ഈ ജനത്തെ കണ്ടു.”
    reason: എബ്രായ പൂർണക്രിയയെ സന്ദർഭത്തിൽ ലളിതഭൂതകാലമായും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵלַי לֵאמֹר
  choice: 'എന്നോടു പറഞ്ഞു:'
  rationale: എബ്രായത്തിലെ വാക്കുപറച്ചിൽ പരിചയപ്പെടുത്തുന്ന സൂത്രവാക്യത്തിന്റെ അർഥം കോളൻ ഉൾപ്പെടെയുള്ള സ്വാഭാവിക മലയാളഘടനയിൽ പകരുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: רָאִיתִי
  choice: ഞാൻ ... കണ്ടിരിക്കുന്നു
  rationale: പൂർണക്രിയ ഇവിടെ നിരീക്ഷണത്തിൽനിന്നുണ്ടായ ഇപ്പോഴത്തെ ഉറച്ച വിലയിരുത്തലിനെ സൂചിപ്പിക്കാവുന്നതിനാൽ ‘കണ്ടിരിക്കുന്നു’ എന്നു നൽകി; ലളിതഭൂതകാലവും സാധ്യമാണ്.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനത്തെ
  rationale: കൂട്ടായ ഏകവചനമായ עַם എന്നതും അടുത്തുള്ള സൂചകപദവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന വിലയിരുത്തലിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: കഴുത്തു കടുത്ത ജനമാണ്
  rationale: മർക്കടമുഷ്ടിയെയും അനുസരണക്കേടിനെയും സൂചിപ്പിക്കുന്ന ‘കഴുത്തു കടുത്ത’ എന്ന മൂലരൂപകം നിലനിർത്തുന്നു; വെറും ‘ദുശ്ശാഠ്യമുള്ള’ എന്നു പറഞ്ഞാൽ ദൃശ്യരൂപകം നഷ്ടപ്പെടും.
- source_word: הוּא
  choice: ഇതു ... ആണ്
  rationale: കൂട്ടായ ഏകവചനമായ ‘ജനം’ എന്ന പദത്തോടു യോജിക്കുന്ന എബ്രായ ഏകവചനഘടന മലയാളത്തിലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരാതെ മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപത്തിൽ നൽകുന്നു.
- issue: קְשֵׁה עֹרֶף എന്ന ശാസനാപരമായ രൂപകം
  choice: കഴുത്തു കടുത്ത
  alternative: ദുശ്ശാഠ്യമുള്ള
  rationale: ജനത്തിന്റെ പിടിവാശിയും അനുസരണക്കേടും സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ശരീരരൂപകം വ്യാഖ്യാനിച്ച് ലയിപ്പിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കഴുത്തു കടുത്ത’ എന്ന ബൈബിൾരൂപകം സാധാരണ വായനക്കാരന് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി; കൂട്ടായ ഏകവചനവും മൂലപാഠത്തിന്റെ ഊന്നലും സംരക്ഷിച്ചു.
