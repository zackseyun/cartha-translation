id: DEU.9.26
reference: Deuteronomy 9:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֶתְפַּלֵּ֣ל אֶל יְהוָה֮ וָ/אֹמַר֒ אֲדֹנָ֣/י יְהוִ֗ה אַל תַּשְׁחֵ֤ת עַמְּ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ אֲשֶׁ֥ר פָּדִ֖יתָ בְּ/גָדְלֶ֑/ךָ אֲשֶׁר הוֹצֵ֥אתָ מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: ml
  text: 'അങ്ങനെ ഞാൻ യഹ്‌വേയോടു പ്രാർഥിച്ച് ഇപ്രകാരം പറഞ്ഞു: “കർത്താവായ യഹ്‌വേ, അങ്ങയുടെ ജനത്തെയും അവകാശത്തെയും നശിപ്പിക്കരുതേ; അങ്ങയുടെ മഹത്ത്വത്താൽ അങ്ങ് വീണ്ടെടുക്കുകയും ശക്തമായ കൈകൊണ്ട് ഈജിപ്തിൽനിന്ന് പുറത്തുകൊണ്ടുവരികയും ചെയ്തവരെയല്ലോ അവർ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל אֶל יְהוָה וָאֹמַר
  choice: അങ്ങനെ ഞാൻ യഹ്‌വേയോടു പ്രാർഥിച്ചു
  rationale: വാവ്-തുടർച്ചയുടെ ആഖ്യാനക്രമം ‘അങ്ങനെ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; ‘പറഞ്ഞു’ എന്നത് മലയാളത്തിൽ പ്രാർഥനയുടെ നേരിട്ടുള്ള ഉദ്ധരണിക്ക് മുമ്പ് നിർബന്ധമല്ല.
- source_word: אֲדֹנָי יְהוִה
  choice: കർത്താവായ യഹ്‌വേ
  rationale: സംയുക്ത ദൈവിക അഭിസംബോധനയിലെ אֲדֹנָי എന്ന പദവിയും യഹ്‌വേ എന്ന ഉടമ്പടിനാമവും വേർതിരിച്ചും സ്വാഭാവികമായ മലയാള അഭിസംബോധനയിലും നിലനിർത്തുന്നു.
- source_word: אַל תַּשְׁחֵת
  choice: നശിപ്പിക്കരുതേ
  rationale: നിഷേധാത്മക അഭ്യർഥനയുടെ ഗൗരവവും പ്രാർഥനാഭാവവും സൂക്ഷിക്കുന്നു.
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: അങ്ങയുടെ ജനത്തെയും അവകാശത്തെയും
  rationale: נַחֲלָה എന്ന പദത്തിന്റെ ഉടമ്പടി-ബന്ധിതമായ ‘അവകാശം/അവകാശസ്വത്ത്’ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר פָּדִיתָ בְּגָדְלֶךָ
  choice: അങ്ങയുടെ മഹത്ത്വത്താൽ അവരെ വീണ്ടെടുത്തതും
  rationale: גֹּדֶל എന്നതിനെ ‘മഹത്ത്വം’ എന്നു നേരിട്ട് നൽകുന്നു; ‘മഹാശക്തി’ എന്നു വ്യാഖ്യാനപരമായി മാറ്റുന്നില്ല.
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם בְּיָד חֲזָקָה
  choice: ശക്തമായ കൈകൊണ്ട് ഈജിപ്തിൽനിന്ന് പുറത്തുകൊണ്ടുവന്നതും
  rationale: പുറപ്പാട്-സൂത്രവാക്യവും ‘ശക്തമായ കൈ’ എന്ന ഹീബ്രു രൂപകവും സുതാര്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אֲדֹנָי יְהוִה എന്ന സംയുക്ത അഭിസംബോധന
  choice: കർത്താവായ യഹ്‌വേ
  alternative: കർത്താവായ ദൈവമേ
  rationale: אֲדֹנָי എന്ന പദവിയെയും യഹ്‌വേ എന്ന നാമത്തെയും സംരക്ഷിക്കുകയും ‘കർത്താവേ കർത്താവേ’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: Israel as וְנַחֲלָתְךָ
  choice: അങ്ങയുടെ അവകാശം
  alternative: അങ്ങയുടെ സ്വന്തജനം
  rationale: ജനത്തെ ദൈവത്തിന്റെ ‘അവകാശം’ എന്നു വിളിക്കുന്ന ഉടമ്പടി-രൂപകത്തിലെ താത്വിക സംഘർഷം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പ്രാർഥനാത്മകവുമായ ശൈലി. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലത്തിലെ ബന്ധവാക്യങ്ങളുടെ ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായ സമാന്തര ക്രിയാനാമഘടനയായി നൽകി; അർഥബന്ധം നിലനിർത്തി.
