revisions:
- from: എന്നെ വിട്ടേക്കുക[a]; ഞാൻ അവരെ നശിപ്പിച്ച് ആകാശത്തിൻ കീഴിൽനിന്ന് അവരുടെ പേര് മായിച്ചുകളയും[b]. അവരെക്കാൾ ശക്തവും ജനസംഖ്യയേറിയതുമായ ഒരു ജനതയായി നിന്നെ ഞാൻ തീർക്കും.
  to: എന്നെ വിട്ടേക്കുക, അങ്ങനെ ഞാൻ അവരെ നശിപ്പിക്കാനും ആകാശങ്ങളുടെ കീഴിൽനിന്ന് അവരുടെ പേര് മായിച്ചുകളയാനും ഇടയാകട്ടെ[a]. അവരെക്കാൾ ശക്തവും എണ്ണത്തിൽ അധികവുമായ ഒരു ജനതയായി നിന്നെ ഞാൻ തീർക്കും.
  rationale: ക്രിയകളുടെ ഏകോപനവും ആദ്യ ആജ്ഞയോടുള്ള ഉദ്ദേശ്യബന്ധവും വ്യക്തമായി പ്രതിഫലിപ്പിക്കാൻ ആദ്യവാക്യം പരിഷ്കരിച്ചു. ഉറവിടത്തിലെ ബഹുവചനമായ ‘ആകാശങ്ങളുടെ’ നിലനിർത്തി. നിലവിലെ രണ്ട് അടിക്കുറിപ്പുകളും ഒരേ സ്ഥാനത്ത് (‘ആകാശങ്ങളുടെ കീഴിൽനിന്ന്’) ബന്ധപ്പെട്ടതിനാൽ, വാക്യത്തിന്റെ ഘടനയും അടിക്കുറിപ്പ്-ആങ്കർ വ്യക്തതയും മെച്ചപ്പെടുത്താൻ അവയെ ഒരു അടിക്കുറിപ്പായി സംയോജിപ്പിച്ചു. ന്യായവിധിയുടെ തീവ്രതയോ മോശെയോടുള്ള വാഗ്ദാനമോ മയപ്പെടുത്തിയിട്ടില്ല.
