source:
  edition: WLC
  text: הֶ֤רֶף מִמֶּ֨/נִּי֙ וְ/אַשְׁמִידֵ֔/ם וְ/אֶמְחֶ֣ה אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וְ/אֶֽעֱשֶׂה֙ אֽוֹתְ/ךָ֔ לְ/גוֹי עָצ֥וּם וָ/רָ֖ב מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: ml
  text: എന്നെ വിട്ടേക്കുക, അങ്ങനെ ഞാൻ അവരെ നശിപ്പിക്കാനും ആകാശങ്ങളുടെ കീഴിൽനിന്ന് അവരുടെ പേര് മായിച്ചുകളയാനും ഇടയാകട്ടെ[a]. അവരെക്കാൾ ശക്തവും എണ്ണത്തിൽ അധികവുമായ ഒരു ജനതയായി നിന്നെ ഞാൻ തീർക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘എന്നെ വിട്ടേക്കുക; ഞാൻ അവരെ നശിപ്പിക്കുകയും ആകാശങ്ങളുടെ കീഴിൽനിന്ന് അവരുടെ പേര് മായിച്ചുകളയുകയും ചെയ്യും.’ ‘ആകാശങ്ങളുടെ കീഴിൽനിന്ന്’ എന്നത് ഭൂമിയിൽനിന്ന്—അതായത് മനുഷ്യരുടെ ഓർമയിൽനിന്നും അസ്തിത്വത്തിൽനിന്നും—നീക്കിക്കളയുക എന്ന അർഥമുള്ള പ്രയോഗമാണ്.'
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: എന്നെ വിട്ടേക്കുക
  rationale: רפה എന്ന കല്പനാരൂപം מן ചേർന്ന സർവനാമത്തോടൊപ്പം ഇവിടെ ‘ഇടപെടാതെ വിടുക/തടയാതിരിക്കുക’ എന്ന ഭാഷാശൈലിപരമായ അർഥം നൽകുന്നു. ‘എന്നെ വിട്ടേക്കുക’ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: וְאַשְׁמִידֵם
  choice: ഞാൻ അവരെ നശിപ്പിച്ച്
  rationale: שׁמד സമ്പൂർണ നാശത്തെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ക്രിയയുമായി ചേർത്ത് ‘നശിപ്പിച്ച് ... മായിച്ചുകളയും’ എന്നു നൽകിയിരിക്കുന്നത് ഹീബ്രു വാക്യത്തിന്റെ പ്രവാഹവും ശക്തിയും നിലനിർത്തുന്നു; ഉദ്ദേശ്യ/ഫലബന്ധത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: അവരുടെ പേര് മായിച്ചുകളയും
  rationale: מחה എന്നത് മായ്ക്കുക, ഇല്ലാതാക്കുക എന്നർഥം നൽകുന്നു. ‘പേര് മായിച്ചുകളയുക’ എന്ന പ്രയോഗം അവരുടെ നിലനിൽപ്പും ഓർമയും ഇല്ലാതാക്കുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: ആകാശത്തിൻ കീഴിൽനിന്ന്
  rationale: ഹീബ്രുവിലെ ‘ആകാശങ്ങളുടെ കീഴിൽനിന്ന്’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചന ശൈലിയിൽ നൽകിയിരിക്കുന്നു; ഭൂമിയിൽനിന്നുള്ള സമ്പൂർണ നീക്കമാണ് ഉദ്ദേശ്യം.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: ഒരു ജനതയായി നിന്നെ ഞാൻ തീർക്കും
  rationale: עשה + കർമം + ל എന്ന ഘടനയിലെ രൂപാന്തര അർഥം ‘ജനതയായി ... തീർക്കും’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עָצוּם
  choice: ശക്തവും
  rationale: עָצוּם ശക്തിയെയോ പ്രാബല്യത്തെയോ സൂചിപ്പിക്കുന്നു. അവസാനത്തെ താരതമ്യപ്രയോഗത്തോടൊപ്പം ‘അവരെക്കാൾ ശക്തം’ എന്ന അർഥം ലഭിക്കുന്നു.
- source_word: וָרָב
  choice: ജനസംഖ്യയേറിയതുമായ
  rationale: רב ഇവിടെ ജനതയുടെ സംഖ്യാബലത്തെ സൂചിപ്പിക്കുന്നു. ‘ജനസംഖ്യയേറിയ’ എന്നത് ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: מִמֶּנּוּ
  choice: അവരെക്കാൾ
  rationale: ഏകവചന പ്രത്യയം ഇസ്രായേലിനെ ഒരു സമൂഹജനതയായി പരാമർശിക്കുന്നു. മലയാളത്തിൽ ആ സമൂഹത്തിലെ ആളുകളെ മുൻനിർത്തിയുള്ള ‘അവരെക്കാൾ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ന്യായവിധിയുടെ ദൈവിക പ്രഖ്യാപനവും മോശെയെ വലിയൊരു ജനതയാക്കുമെന്ന വാഗ്ദാനവും
  choice: ഭീഷണിയും വാഗ്ദാനവും കഥയിലെ യഥാർഥ നേരിട്ടുള്ള പ്രഖ്യാപനമായി മയപ്പെടുത്താതെ പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് പ്രധാനമായും മോശെയെ പരീക്ഷിക്കുന്ന ആലങ്കാരിക പ്രസ്താവനയാണെന്ന വ്യാഖ്യാനം പരിഭാഷയിൽ സൂചിപ്പിക്കുക.
  rationale: ഹീബ്രു പാഠം ന്യായവിധിയും വാഗ്ദാനവും നേരിട്ടുള്ള ദൈവവചനമായി അവതരിപ്പിക്കുന്നു. അതിന്റെ ഉദ്ദേശ്യത്തെക്കുറിച്ചുള്ള പിൽക്കാല വ്യാഖ്യാനങ്ങൾ ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘വിട്ടേക്കുക’, ‘മായിച്ചുകളയും’, ‘തീർക്കും’ എന്നീ സ്വാഭാവിക പ്രയോഗങ്ങളിലൂടെ ഹീബ്രുവിന്റെ ശക്തി നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യമായ സഭാപരമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
