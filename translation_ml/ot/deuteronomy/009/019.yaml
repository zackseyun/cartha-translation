id: DEU.9.19
reference: Deuteronomy 9:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י יָגֹ֗רְתִּי מִ/פְּנֵ֤י הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהוָ֛ה עֲלֵי/כֶ֖ם לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וַ/יִּשְׁמַ֤ע יְהוָה֙ אֵלַ֔/י גַּ֖ם בַּ/פַּ֥עַם הַ/הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: ml
  text: നിങ്ങളെ നശിപ്പിക്കത്തക്കവിധം യഹോവ നിങ്ങളോടു കോപിച്ച ആ കോപവും ക്രോധവും നിമിത്തം ഞാൻ ഭയപ്പെട്ടു. എന്നാൽ ആ പ്രാവശ്യവും യഹോവ എനിക്ക് ചെവികൊടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: ഞാൻ ഭയപ്പെട്ടു
  rationale: Qal perfect ഒന്നാംപുരുഷ ഏകവചനം ഭയത്തെയോ ഭീതിയെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുമുള്ള പ്രയോഗം.
- source_word: מִפְּנֵי
  choice: നിമിത്തം
  rationale: ഇവിടെ കാരണമോ ഭയത്തിന്റെ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്ന ഹീബ്രു വ്യവഹാരം.
- source_word: הָאַף וְהַחֵמָה
  choice: ആ കോപവും ക്രോധവും
  rationale: രണ്ട് ശക്തമായ കോപപദങ്ങളെയും വേർതിരിച്ചു നിലനിർത്തുകയും അവയുടെ തീവ്രത കൈവിടാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: യഹോവ നിങ്ങളോടു കോപിച്ച
  rationale: קצף എന്ന ശക്തമായ കോപക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; עֲלֵיכֶם-ന്റെ വിരുദ്ധദിശാസൂചന 'നിങ്ങളോടു' എന്നതിൽ പ്രതിഫലിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: നിങ്ങളെ നശിപ്പിക്കത്തക്കവിധം
  rationale: ശמד-ന്റെ ഹിഫീൽ രൂപത്തിലെ നാശത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; കോപത്തിന്റെ ലക്ഷ്യഫലവുമായി വാക്യം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: എന്നാൽ ... യഹോവ എന്റെ അപേക്ഷ കേട്ടു
  rationale: ശמע + אֶל ഇവിടെ മോശെയുടെ മധ്യസ്ഥപ്രാർത്ഥനയ്ക്ക് അനുകൂലമായി ചെവികൊടുത്തതിനെ സൂചിപ്പിക്കുന്നു. 'അപേക്ഷ' സന്ദർഭത്തിൽ വ്യക്തമായെങ്കിലും ഹീബ്രുവിൽ ആ നാമം നേരിട്ട് ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: ആ പ്രാവശ്യവും
  rationale: גַּם എന്ന കൂട്ടിച്ചേർക്കൽബലവും 'ആ സന്ദർഭത്തിലും' എന്ന അർത്ഥവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָה-യുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മലയാളത്തിലെ പൊതുവായ ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു; 'കർത്താവ്' എന്ന സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മൂലത്തിലെ വ്യക്തിനാമം മറച്ചിട്ടില്ല.
- issue: ദൈവകോപത്തിന്റെ തീവ്രത
  choice: കോപവും ക്രോധവും ... കോപിച്ച
  alternative: ഉഗ്രകോപം
  rationale: אַף, חֵמָה, קצף എന്നീ ആവർത്തിത കോപസൂചനകളെ ഒറ്റ പദമായി ചുരുക്കാതെ മൂലത്തിലെ ഊന്നലും സംഘർഷവും നിലനിർത്തുന്നു.
- issue: ദൈവം മോശെയെ കേട്ടതിന്റെ അർത്ഥം
  choice: എന്റെ അപേക്ഷ കേട്ടു
  alternative: എന്റെ വാക്കു കേട്ടു
  rationale: സന്ദർഭത്തിൽ ഇത് മോശെയുടെ മധ്യസ്ഥപ്രാർത്ഥനയ്ക്ക് അനുകൂലമായി പ്രതികരിച്ചതാണ്; എങ്കിലും ക്രിയയുടെ അടിസ്ഥാനമായ 'കേൾക്കുക' നിലനിർത്തി, പ്രതികരണത്തിന്റെ രീതി കൂടുതൽ നിർവചിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഹീബ്രുവിലെ കോപപദങ്ങളുടെ ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി. പ്രധാനവാചകത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
