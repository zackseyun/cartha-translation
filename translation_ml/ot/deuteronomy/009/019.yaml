  to: നിങ്ങളെ നശിപ്പിക്കത്തക്കവിധം യഹോവ നിങ്ങളോടു കോപിച്ച ആ കോപവും ക്രോധവും നിമിത്തം ഞാൻ ഭയപ്പെട്ടു. എന്നാൽ ആ പ്രാവശ്യവും യഹോവ എനിക്ക് ചെവികൊടുത്തു.
