id: DEU.9.7
reference: Deuteronomy 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זְכֹר֙ אַל תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר הִקְצַ֛פְתָּ אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/מִּדְבָּ֑ר לְ/מִן הַ/יּ֞וֹם אֲשֶׁר יָצָ֣אתָ מֵ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּֽאֲ/כֶם֙ עַד הַ/מָּק֣וֹם הַ/זֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָֽה־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: ml
  text: ഓർക്കുക—മറക്കരുത്—മരുഭൂമിയിൽ നിന്റെ ദൈവമായ യഹ്‌വെയെ നീ എങ്ങനെ കോപിപ്പിച്ചുവെന്ന്[a]. നീ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ട ദിവസംമുതൽ നിങ്ങൾ ഈ സ്ഥലത്ത് എത്തുന്നതുവരെ, നിങ്ങൾ യഹ്‌വെയോട് മത്സരികളായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മരുഭൂമിയിൽ നിന്റെ ദൈവമായ യഹ്‌വെയെ നീ എങ്ങനെ ക്രുദ്ധനാക്കി എന്ന്.”
    reason: הִקְצַפְתָּ എന്ന കാരണാർത്ഥക്രിയയ്ക്ക് ‘കോപിപ്പിച്ചു’, ‘ക്രുദ്ധനാക്കി’ എന്നീ അടുത്ത മലയാളപര്യായങ്ങൾ സാധ്യമാണ്.
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “യഹ്‌വെയോടുകൂടെ”; ഇവിടെ സന്ദർഭം യഹ്‌വെയോടുള്ള എതിർപ്പാണ് സൂചിപ്പിക്കുന്നത്.
    reason: עִם സാധാരണയായി ‘കൂടെ’ എന്നാണ്; എന്നാൽ מרה എന്ന മത്സരക്രിയയോടൊപ്പം ഇവിടെ പ്രതികൂലബന്ധത്തിന്റെ ഭാവമുണ്ട്.
lexical_decisions:
- source_word: זְכֹר ... אַל תִּשְׁכַּח
  choice: ഓർക്കുക—മറക്കരുത്
  rationale: ആജ്ഞയും അതിനെ ശക്തിപ്പെടുത്തുന്ന നിഷേധരൂപവും രണ്ടും നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഊന്നൽ നൽകുന്നു.
- source_word: אֲשֶׁר הִקְצַפְתָּ
  choice: എങ്ങനെ ... കോപിപ്പിച്ചുവെന്ന്
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരണാർത്ഥം വ്യക്തമാക്കുകയും ഓർക്കേണ്ട സംഭവത്തിന്റെ സ്വഭാവം അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം ഉൾക്കൊള്ളുന്ന ഉടമ്പടിപരമായ അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽവെച്ച്
  rationale: പുറപ്പാട് പശ്ചാത്തലത്തിലെ ജനവാസം കുറഞ്ഞ വരണ്ട പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പതിവും ഗ്രാഹ്യവുമായ മലയാളപ്രയോഗം.
- source_word: לְמִן הַיּוֹם אֲשֶׁר יָצָאתָ
  choice: പുറപ്പെട്ട ദിവസംമുതൽ
  rationale: കാലപരിധിയുടെ ആരംഭം സംക്ഷിപ്തമായും കൃത്യമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലത്ത് എത്തുന്നതുവരെ
  rationale: വചനത്തിലെ ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റം മലയാളത്തിലെ ആദരബഹുവചനമായ ‘നിങ്ങൾ’ കാരണം പുറമേ ദൃശ്യമാകുന്നില്ലെങ്കിലും അർത്ഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מַמְרִים הֱיִיתֶם
  choice: മത്സരിച്ചുകൊണ്ടിരുന്നു
  rationale: അധികാരത്തോടുള്ള തുടർച്ചയായ ധിക്കാരവും കലാപസ്വഭാവവും കാലവ്യാപ്തിയോടുകൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: עִם יְהוָה
  choice: യഹ്‌വെയോട്
  rationale: עִם എന്നതിന്റെ അക്ഷരാർഥം ‘കൂടെ’ ആണെങ്കിലും מרה എന്ന മത്സരക്രിയയോടൊപ്പം ഇവിടെ എതിർപ്പിന്റെ ബന്ധമാണ്; ‘യഹ്‌വെയോട് മത്സരിക്കുക’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ഉച്ചാരണത്തിന്റെ പുനർനിർമാണസ്വഭാവം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- issue: ഇസ്രായേലിന്റെ മത്സരത്തിന്റെ കാലവ്യാപ്തി
  choice: മത്സരിച്ചുകൊണ്ടിരുന്നു
  alternative: മത്സരികളായിരുന്നു
  rationale: ഈജിപ്തിൽനിന്നുള്ള പുറപ്പാടുമുതൽ ഇപ്പോഴത്തെ സ്ഥലത്തെത്തുന്നതുവരെയുള്ള തുടർച്ചയായ പെരുമാറ്റരീതിയാണ് വാക്യം വിവരിക്കുന്നത്.
- issue: עִם יְהוָה എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: യഹ്‌വെയോട് മത്സരിച്ചു
  alternative: യഹ്‌വെയോടുകൂടെ മത്സരികളായിരുന്നു
  rationale: ‘കൂടെ’ എന്ന അടിസ്ഥാനാർഥം യാന്ത്രികമായി ഉപയോഗിച്ചാൽ മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഉണ്ടാകും; מרה യോടുള്ള ഘടനയിൽ ഉദ്ദേശിക്കുന്ന പ്രതികൂലബന്ധം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുന്നു, അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. ‘ഓർക്കുക—മറക്കരുത്’ എന്ന സമാന്തര ആജ്ഞ ഊന്നലോടെ നിലനിർത്തി. ഏകവചന-ബഹുവചന രൂപമാറ്റം മലയാളത്തിലെ ആദരബഹുവചനത്തിൽ സ്വാഭാവികമായി ലയിക്കുന്നു; കൃത്രിമമായി അടയാളപ്പെടുത്തിയിട്ടില്ല.
