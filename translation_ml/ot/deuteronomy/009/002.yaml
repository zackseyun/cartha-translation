id: DEU.9.2
reference: Deuteronomy 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַֽם גָּד֥וֹל וָ/רָ֖ם בְּנֵ֣י עֲנָקִ֑ים אֲשֶׁ֨ר אַתָּ֤ה יָדַ֨עְתָּ֙ וְ/אַתָּ֣ה שָׁמַ֔עְתָּ מִ֣י יִתְיַצֵּ֔ב לִ/פְנֵ֖י בְּנֵ֥י עֲנָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/002.yaml
  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: ml
  text: വലിയവരും ഉയരം കൂടിയവരുമായ ഒരു ജനത—അനാക്കിന്റെ മക്കൾ[a]. അവരെ നിങ്ങൾ അറിയുന്നു; അവരെക്കുറിച്ച്, ‘അനാക്കിന്റെ മക്കളുടെ മുമ്പിൽ ആർക്കു നിലകൊള്ളാൻ കഴിയും?’ എന്നു നിങ്ങൾ കേട്ടിട്ടുമുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അനാക്ക്യർ.” എബ്രായത്തിൽ അക്ഷരാർഥം “അനാക്കിന്റെ മക്കൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: ജനത
  rationale: ഒരു പ്രത്യേക ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന עַם എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പരിഭാഷ.
- source_word: גָּדוֹל וָרָם
  choice: വലിയവരും ഉയരം കൂടിയവരുമായ
  rationale: גָּדוֹל ഇവിടെ ആ ജനതയുടെ വലിപ്പവും പ്രാബല്യവും സൂചിപ്പിക്കുന്നു; רָם ശാരീരിക ഉയരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ വിവരണം നൽകി.
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: അനാക്കിന്റെ മക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധസൂചകമായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; അതിനെ വെറും ജനവിഭാഗനാമമാക്കി ചുരുക്കുന്നില്ല.
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: അവരെ നിങ്ങൾ അറിയുന്നു
  rationale: എബ്രായ പൂർണ്ണക്രിയയുടെ നേരിട്ടുള്ള ഭാവവും ഇസ്രായേലിന് ഇതിനകം പരിചിതരായ ജനത എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: അവരെക്കുറിച്ച് ... എന്നു നിങ്ങൾ കേട്ടിട്ടുമുണ്ട്
  rationale: തുടർന്നുവരുന്ന ഉദ്ധരണിയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും, മുമ്പ് കേട്ട കാര്യം ഇപ്പോഴും പ്രസക്തമാണെന്ന പൂർണ്ണക്രിയയുടെ ഭാവം മലയാളത്തിൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: മുമ്പിൽ ആർക്കു നിലകൊള്ളാൻ കഴിയും
  rationale: പ്രതിയോഗിയുടെ മുമ്പിൽ ഉറച്ചുനിൽക്കുക അഥവാ ചെറുത്തുനിൽക്കുക എന്ന പ്രയോഗത്തിന്റെ രൂപകവും വാചാടോപചോദ്യത്തിന്റെ ശക്തിയും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ കുടുംബബന്ധപ്രയോഗവും വാചാടോപചോദ്യവും നിലനിർത്തിയിരിക്കുന്നു; വായനാസൗകര്യത്തിനായി ആദ്യ വിവരണത്തിന് ശേഷം ഡാഷ് ഉപയോഗിച്ചു.
