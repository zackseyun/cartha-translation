reference: Deuteronomy 9:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵ֥ם עַמְּ/ךָ֖ וְ/נַחֲלָתֶ֑/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּדֹ֔ל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: ml
  text: എന്നാൽ അവർ അങ്ങയുടെ ജനവും അങ്ങയുടെ അവകാശവുമാണ്[a]; അങ്ങയുടെ മഹാശക്തിയാലും നീട്ടിയ ഭുജത്താലും[b] അങ്ങ് അവരെ പുറത്തുകൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവർ അങ്ങയുടെ ജനവും അങ്ങയുടെ അവകാശവുമാണ്.’ എബ്രായത്തിൽ ഈ വാക്യത്തിനു മുമ്പുള്ള സംയോജകം ലളിതമായി ‘കൂടാതെ’ എന്നും വിവർത്തനം ചെയ്യാം; ‘എന്നാൽ’ എന്നത് മോശെയുടെ അപേക്ഷയിലെ സാധ്യതയേറിയ വൈരുധ്യഭാവം വ്യക്തമാക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘നീട്ടിയ ഭുജം’ എന്നത് യഹോവയുടെ ശക്തമായ വിടുതലിനെ സൂചിപ്പിക്കുന്ന പതിവായ പുറപ്പാട്-പ്രയോഗമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  choice: എന്നാൽ അവർ
  rationale: ו എന്ന സംയോജകം അടിസ്ഥാനമായി ‘കൂടാതെ/അവർ’ എന്നർഥം നൽകാമെങ്കിലും, ഇസ്രായേലിനെ നശിപ്പിക്കരുതെന്ന മോശെയുടെ അപേക്ഷയിലെ വൈരുധ്യഭാവം ഇവിടെ ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַמְּךָ
  choice: അങ്ങയുടെ ജനം
  rationale: עַם ഇവിടെ ദൈവത്തോടുള്ള ഇസ്രായേലിന്റെ ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനം’ യോജിച്ചതും സ്വാഭാവികവുമാണ്.
- source_word: וְנַחֲלָתֶךָ
  choice: അങ്ങയുടെ അവകാശം
  rationale: נַחֲלָה എന്നത് അവകാശമായി ലഭിച്ച പങ്കിനെയോ സ്വന്തമായ അവകാശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അവകാശം’ ഉടമ്പടിബന്ധവും സ്വന്തമെന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: അങ്ങ് അവരെ പുറത്തുകൊണ്ടുവന്നു
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘പുറത്തുവരുത്തുക’ എന്നാണ്; ഇവിടെ പുറപ്പാട് സംഭവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമായി ‘പുറത്തുകൊണ്ടുവന്നു’ ഉപയോഗിച്ചു. ബന്ധവാക്യത്തിന്റെ അർഥം മലയാളത്തിൽ വ്യക്തമായ സ്വതന്ത്ര ഉപവാക്യമായി നൽകി.
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: അങ്ങയുടെ മഹാശക്തിയാൽ
  rationale: כֹּחַ ‘ശക്തി’ എന്നും גָּדוֹל ‘വലിയ/മഹത്തായ’ എന്നും സൂചിപ്പിക്കുന്നു; ഉപകരണാർഥമുള്ള בְ മലയാളത്തിലെ ‘-ആൽ’ വഴി പ്രകടിപ്പിച്ചു.
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: നീട്ടിയ ഭുജത്താൽ
  rationale: ദൈവത്തിന്റെ രക്ഷാശക്തിയെ ചിത്രീകരിക്കുന്ന പുറപ്പാട്-പ്രയോഗമായതിനാൽ זְרוֹעַ, נְטוּיָה എന്നിവയുടെ ദേഹരൂപകം പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തി.
theological_decisions:
- issue: ദൈവിക പ്രവർത്തനത്തെക്കുറിച്ചുള്ള ദേഹരൂപകം
  choice: ‘നീട്ടിയ ഭുജം’ എന്ന രൂപകം അക്ഷരാർഥത്തിൽ നിലനിർത്തി.
  alternative: ‘മഹാപ്രവൃത്തികൾ’ അല്ലെങ്കിൽ ‘അതിശക്തമായ ഇടപെടൽ’ എന്നിങ്ങനെ ആശയാനുവാദം ചെയ്യുക.
  rationale: എബ്രായത്തിലെ ഈ രൂപകം പുറപ്പാട്-രക്ഷയുടെ ആവർത്തിതവും ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ളതുമായ ഭാഷയാണ്; അതിനെ അമൂർത്തമാക്കാതെ സാഹിത്യശക്തി സംരക്ഷിച്ചു.
- issue: נַחֲלָהയിലെ ഉടമ്പടിപരമായ സ്വന്തബന്ധം
  choice: ‘അവകാശം’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സ്വത്ത്’ അല്ലെങ്കിൽ ‘പൈതൃകം’ എന്ന് പരിഭാഷപ്പെടുത്തുക.
  rationale: മോശെയുടെ അപേക്ഷയിൽ ഇസ്രായേൽ ദൈവത്തിനുള്ള അവകാശമാണെന്ന ബന്ധഭാവം പ്രധാനമാണ്. ‘അവകാശം’ അത് സംരക്ഷിക്കുകയും ‘സ്വത്ത്’ എന്നതിന്റെ വസ്തുവൽക്കരണഭാവം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രാർത്ഥനാഭാഷ ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ സ്വീകരിച്ചു. എബ്രായത്തിലെ ഏകവാക്യബന്ധം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി അർദ്ധവിരാമത്തോടെ രണ്ടു ഉപവാക്യങ്ങളാക്കി; അർഥബന്ധം മാറ്റിയിട്ടില്ല.
