source:
  edition: WLC
  text: מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָ֑ה מִ/יּ֖וֹם דַּעְתִּ֥/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/024.yaml
  text: You have been rebellious against Yahweh from the day I knew you[a].
translation:
  language: ml
  text: ഞാൻ നിങ്ങളെ അറിഞ്ഞ നാൾമുതൽ നിങ്ങൾ യഹ്‌വെയ്ക്കെതിരെ[a] മത്സരിച്ചവരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘യഹ്‌വെയോടുകൂടെ’; ഇവിടെ ഈ പ്രയോഗം അവിടത്തോടുള്ള വിരോധത്തെ, അതായത് ‘യഹ്‌വെയ്ക്കെതിരെ’ എന്ന അർഥത്തെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְרִים
  choice: മത്സരിച്ചവർ
  rationale: מרה എന്ന ധാതു അധികാരത്തെ എതിർക്കുന്നതും അനുസരിക്കാതിരിക്കുന്നതുമായ മത്സരത്തെ സൂചിപ്പിക്കുന്നു. הֱיִיתֶם എന്ന ക്രിയയോടുചേർന്നുള്ള വിധേയപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘മത്സരിച്ചവരായിരുന്നു’ എന്നു നൽകി.
- source_word: הֱיִיתֶם
  choice: ആയിരുന്നു
  rationale: היה എന്ന ക്രിയയുടെ ഖാൽ പെർഫെക്റ്റ് രണ്ടാം പുരുഷ ബഹുവചനരൂപം. കഴിഞ്ഞകാലംമുതൽ പ്രസംഗസമയംവരെയുള്ള ഇസ്രായേലിന്റെ നിലയെ സംഗ്രഹിക്കുന്നതിനാൽ, ‘മത്സരിച്ചവരായിരുന്നു’ എന്ന സംയുക്തപ്രയോഗത്തിൽ അതിന്റെ പൂർവകാല-തുടർച്ചാഭാവം ലഭിക്കുന്നു.
- source_word: עִם
  choice: എതിരെ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘കൂടെ/ഒപ്പം’ എന്നാണെങ്കിലും, מרה-യോടൊപ്പമുള്ള ഈ സന്ദർഭത്തിൽ അത് യഹ്‌വെയോടുള്ള വിരോധത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എതിരെ’ എന്നത് ഈ ബന്ധം വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള ശാസ്ത്രീയ ഉച്ചാരണരൂപമായ Yahweh മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: מִיּוֹם
  choice: നാൾമുതൽ
  rationale: ആരോപണം ബാധകമാകുന്ന ആരംഭകാലം വ്യക്തമാക്കുന്ന പ്രയോഗം; ‘നാൾമുതൽ’ ഹീബ്രുവിനോട് അടുത്തതും സ്വാഭാവികവുമാണ്.
- source_word: דַּעְתִּי
  choice: ഞാൻ അറിഞ്ഞ
  rationale: ידע എന്ന ക്രിയയുടെ ഖാൽ പെർഫെക്റ്റ് ഒന്നാം പുരുഷ ഏകവചനരൂപം. ഇവിടെ മോശെ ഇസ്രായേലുമായി പരിചയപ്പെട്ടതുമുതലുള്ള കാലമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനെ വ്യാഖ്യാനിച്ചു ചുരുക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: אֶתְכֶם
  choice: നിങ്ങളെ
  rationale: നേരിട്ടുള്ള കർമചിഹ്നത്തോടുകൂടിയ രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയം; മലയാളത്തിൽ ‘നിങ്ങളെ’ എന്നാണ് സ്വാഭാവിക രൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ഒരു പദവിയല്ല, ചതുർവ്യഞ്ജനമായ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ അതിനെ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെയും ‘Jehovah’ എന്ന പിൽക്കാല സംയുക്തരൂപം സ്വീകരിക്കാതെയും Yahweh എന്ന രൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: עִם എന്ന ബന്ധപദത്തിന്റെ വിരോധാർഥം
  choice: യഹ്‌വെയ്ക്കെതിരെ
  alternative: യഹ്‌വെയോടുകൂടെ / യഹ്‌വെയോടു
  rationale: עִם അക്ഷരാർഥത്തിൽ ‘കൂടെ’ എന്നാണെങ്കിലും ‘മത്സരിക്കുക’ എന്ന ആശയത്തോടൊപ്പം ഇവിടെ ദൈവത്തോടുള്ള വിരോധമാണ് പ്രകടമാകുന്നത്. പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ വിരോധാർഥം നൽകി; മൂലത്തിലെ അസാധാരണമായ പദപ്രയോഗം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മത്സരിച്ചവരായിരുന്നു’ എന്ന പ്രയോഗം കലാപസ്വഭാവവും ദീർഘകാല നിലയും ഒരുമിച്ച് അറിയിക്കുന്നു. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘എതിരെ’ എന്ന പദത്തിനുശേഷം ചേർത്തു.
