id: DEU.9.16
reference: Deuteronomy 9:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֵ֗רֶא וְ/הִנֵּ֤ה חֲטָאתֶם֙ לַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם עֲשִׂיתֶ֣ם לָ/כֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן הַ/דֶּ֕רֶךְ אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: ml
  text: 'ഞാൻ നോക്കി, ഇതാ, നിങ്ങൾ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയോടു പാപം ചെയ്തിരുന്നു: നിങ്ങൾ നിങ്ങൾക്കായി ലോഹത്തിൽ വാർത്ത ഒരു കാളക്കുട്ടിയെ ഉണ്ടാക്കിയിരുന്നു. യഹ്‌വേ നിങ്ങൾക്കു കൽപ്പിച്ച വഴിയിൽനിന്ന് നിങ്ങൾ വേഗം വിട്ടുമാറിയിരുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֵרֶא וְהִנֵּה
  choice: ഞാൻ നോക്കിയപ്പോൾ, ഇതാ
  rationale: ראה എന്ന ക്രിയയുടെ നിരീക്ഷണഭാവവും הִנֵּה എന്ന ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരചിഹ്നവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങൾ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയോടു പാപം ചെയ്തിരുന്നു
  rationale: לַיהוָה എന്നത് ഇവിടെ പാപത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യഹ്‌വേയോടു പാപം ചെയ്തു’ എന്നു നൽകി; സന്ദർഭത്തിലെ മുൻകാലസംഭവസ്മരണ ‘ചെയ്തിരുന്നു’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עֲשִׂיתֶם לָכֶם
  choice: നിങ്ങൾ നിങ്ങൾക്കായി ... ഉണ്ടാക്കിയിരുന്നു
  rationale: לָכֶם സൂചിപ്പിക്കുന്ന സ്വപ്രയോജനാർഥകത ‘നിങ്ങൾക്കായി’ എന്നു വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עֵגֶל מַסֵּכָה
  choice: ലോഹം വാർത്തുണ്ടാക്കിയ ഒരു കാളക്കുട്ടി
  rationale: מַסֵּכָה ലോഹം ഉരുക്കി അച്ചിൽ വാർക്കുന്ന നിർമ്മാണരീതിയെയും വിഗ്രഹത്തിന്റെ വസ്തുസ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു; ആ അർഥം ആധുനിക വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  choice: വഴിയിൽനിന്ന് നിങ്ങൾ വേഗം വ്യതിചലിച്ചിരുന്നു
  rationale: സന്ധിനിയമത്തിൽനിന്നുള്ള മാറ്റത്തെ വഴിയിൽനിന്നു മാറുന്നതെന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു; מַהֵר എന്നതിനു ‘വേഗം’ നൽകി.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: യഹ്‌വേ നിങ്ങളോടു കല്പിച്ച
  rationale: ബന്ധവാക്യം ‘വഴി’യെ വിശേഷിപ്പിക്കുന്ന രീതിയിൽ സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി; കല്പന സംഭവത്തിനു മുമ്പുള്ളതാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം നാമം ലിപ്യന്തരിച്ചു; ‘യഹ്‌വേ’ നിലവിലെ പണ്ഡിതസമ്മത ഉച്ചാരണത്തെ അടുത്തായി പ്രതിനിധീകരിക്കുന്നു.
- issue: ദൈവത്തോടുള്ള പാപത്തിന്റെ ബന്ധസൂചന
  choice: യഹ്‌വേയോടു പാപം ചെയ്തു
  alternative: യഹ്‌വേയ്ക്കെതിരായി പാപം ചെയ്തു
  rationale: ലക്ഷ്യത്തെയും ബന്ധലംഘനത്തെയും സൂചിപ്പിക്കുന്ന ל എന്ന ഉപസർഗത്തിന്റെ അർഥം അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ മലയാളത്തിലെ പതിവായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി ഉപയോഗിച്ചു. ‘ഇതാ’ എന്നത് הִנֵּהയുടെ ശ്രദ്ധാകർഷകശക്തി നിലനിർത്തുന്നു. ആവർത്തനം അല്പം പ്രകടമായിരുന്നാലും ‘നിങ്ങൾ നിങ്ങൾക്കായി’ എന്ന രൂപം മൂലത്തിലെ കർത്താവിനെയും സ്വപ്രയോജനാർഥകതയെയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
