revisions:
- from: 'ഞാൻ നോക്കിയപ്പോൾ, ഇതാ, നിങ്ങൾ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയോടു പാപം ചെയ്തിരുന്നു: നിങ്ങൾ നിങ്ങൾക്കായി ലോഹം വാർത്തുണ്ടാക്കിയ ഒരു കാളക്കുട്ടിയെ[a] ഉണ്ടാക്കിയിരുന്നു. യഹ്‌വേ നിങ്ങളോടു കല്പിച്ച വഴിയിൽനിന്ന് നിങ്ങൾ വേഗം വ്യതിചലിച്ചിരുന്നു.'
  to: 'ഞാൻ നോക്കി, ഇതാ, നിങ്ങൾ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയോടു പാപം ചെയ്തിരുന്നു: നിങ്ങൾ നിങ്ങൾക്കായി ലോഹത്തിൽ വാർത്ത ഒരു കാളക്കുട്ടിയെ ഉണ്ടാക്കിയിരുന്നു. യഹ്‌വേ നിങ്ങൾക്കു കൽപ്പിച്ച വഴിയിൽനിന്ന് നിങ്ങൾ വേഗം വിട്ടുമാറിയിരുന്നു.'
  rationale: വാക്യത്തിന്റെ അർഥം മാറ്റാതെ, മַסֵּכָהയെ സൂചിപ്പിക്കുന്ന ‘ലോഹത്തിൽ വാർത്ത’ എന്ന വിശേഷണവും മുഖ്യക്രിയയായ ‘ഉണ്ടാക്കിയിരുന്നു’യും വേർതിരിച്ചു; ഇതിലൂടെ ആവർത്തനം നീങ്ങി. കൂടാതെ, הִנֵּהയുടെ വാചകശക്തി നിലനിർത്താൻ ‘ഞാൻ നോക്കി, ഇതാ’ എന്നും, കൽപ്പനയുടെ സ്വാഭാവിക മലയാളബന്ധത്തിനായി ‘നിങ്ങൾക്കു കൽപ്പിച്ച’ എന്നും തിരുത്തി. അടിക്കുറിപ്പിൽ മൂലപാഠത്തിലില്ലാത്ത ‘രൂപം’ ഒഴിവാക്കി.
