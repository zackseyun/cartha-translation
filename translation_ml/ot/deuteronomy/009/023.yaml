id: DEU.9.23
reference: Deuteronomy 9:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֨חַ יְהוָ֜ה אֶתְ/כֶ֗ם מִ/קָּדֵ֤שׁ בַּרְנֵ֨עַ֙ לֵ/אמֹ֔ר עֲלוּ֙ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶ֑ם וַ/תַּמְר֗וּ אֶת פִּ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/לֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔/וֹ וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קֹלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: ml
  text: “ഞാൻ നിങ്ങൾക്കു നൽകിയിരിക്കുന്ന ദേശത്തേക്കു കയറിച്ചെന്ന് അതു കൈവശമാക്കുക” എന്നു പറഞ്ഞ് യഹോവ നിങ്ങളെ കാദേശ്-ബർന്നേയയിൽനിന്ന് അയച്ചപ്പോൾ, യഹോവയായ നിങ്ങളുടെ ദൈവത്തിന്റെ കല്പനയെ[a] നിങ്ങൾ ധിക്കരിച്ചു. നിങ്ങൾ അവനെ വിശ്വസിച്ചില്ല[b]; അവന്റെ ശബ്ദത്തിനു ചെവികൊടുത്തതുമില്ല.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥം “യഹോവയായ നിങ്ങളുടെ ദൈവത്തിന്റെ വായെ”; അവന്റെ അധികാരപൂർവമായ വാക്കിനെയോ കല്പനയെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “അവനിൽ ആശ്രയിച്ചില്ല.”
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ “അവന്റെ ശബ്ദം അനുസരിച്ചതുമില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: അയച്ചപ്പോൾ
  rationale: בְּ + infinitive construct ഇവിടെ സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അയച്ചപ്പോൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകി.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: കാദേശ്-ബർന്നേയയിൽനിന്ന്
  rationale: സ്ഥലനാമം ഉറവിടരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; അപാദാനാർഥം ‘യിൽനിന്ന്’ വ്യക്തമാക്കുന്നു.
- source_word: עֲלוּ
  choice: ദേശത്തേക്കു കയറിച്ചെന്ന്
  rationale: עלה എന്നതിലെ ‘മുകളിലേക്കു പോകുക/കയറിച്ചെല്ലുക’ എന്ന ദിശാബോധം നിലനിർത്തുകയും തുടർന്നുള്ള കല്പനയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וּרְשׁוּ
  choice: അതു കൈവശമാക്കുക
  rationale: ירשׁ ഇവിടെ ദേശത്തിൽ പ്രവേശിച്ച് അതിന്റെ ഉടമസ്ഥത ഏറ്റെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കൈവശമാക്കുക’ ആ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: ഞാൻ നിങ്ങൾക്കു നൽകിയിരിക്കുന്ന
  rationale: ഹീബ്രു perfect സൂചിപ്പിക്കുന്ന ഉറപ്പായ ദാനവും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും ‘നൽകിയിരിക്കുന്ന’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַתַּמְרוּ
  choice: നിങ്ങൾ ധിക്കരിച്ചു
  rationale: מרה അധികാരത്തിനെതിരായ മത്സരവും അനുസരണക്കേടും സൂചിപ്പിക്കുന്നു; ‘ധിക്കരിച്ചു’ സന്ദർഭത്തിൽ ശക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֶת־פִּי יְהוָה אֱלֹהֵיכֶם
  choice: യഹോവയായ നിങ്ങളുടെ ദൈവത്തിന്റെ കല്പനയെ
  rationale: അക്ഷരാർഥമായ ‘വായെ’ എന്നത് അധികാരപൂർവമായ വാക്കിനെയോ കല്പനയെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: നിങ്ങൾ അവനെ വിശ്വസിച്ചില്ല
  rationale: האמין ל־ എന്നത് ഒരാളെയും അവന്റെ വാക്കിനെയും വിശ്വസിക്കുക എന്ന അർഥം നൽകുന്നു; വിശ്വാസം/ആശ്രയം എന്ന ഇരട്ട നിഴൽ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: അവന്റെ ശബ്ദത്തിനു ചെവികൊടുത്തതുമില്ല
  rationale: ‘ശബ്ദം കേൾക്കുക’ എന്ന ഉറവിടബിംബം നിലനിർത്തുന്നതിനൊപ്പം മനസ്സോടെ കേൾക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; അനുസരണത്തിന്റെ നിഴൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ വ്യക്തിനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ സംരക്ഷിച്ചു.
- issue: נָתַתִּי എന്ന perfect രൂപത്തിന്റെ കാലബലം
  choice: നൽകിയിരിക്കുന്ന
  alternative: നൽകി / നൽകുന്നു
  rationale: ദൈവം നൽകിയ ദാനം ഉറപ്പായതും ഇപ്പോഴും പ്രാബല്യമുള്ളതുമായ നിലയിൽ അവതരിപ്പിക്കുന്നു; പൂർത്തീകരണത്തിന്റെ കൃത്യകാലത്തെ അതിലധികം നിർണ്ണയിക്കുന്നില്ല.
- issue: הֶאֱמַנְתֶּם לוֹ എന്നതിലെ വിശ്വാസം–ആശ്രയം നിഴൽ
  choice: അവനെ വിശ്വസിച്ചില്ല
  alternative: അവനിൽ ആശ്രയിച്ചില്ല
  rationale: ഉടൻമുമ്പുള്ള ദൈവവാഗ്ദാനവും കല്പനയും കണക്കിലെടുത്ത് ‘വിശ്വസിക്കുക’ മുഖ്യപാഠത്തിൽ അനുയോജ്യം; ‘ആശ്രയിക്കുക’ എന്ന സാധുവായ നിഴൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: שׁמע בקול എന്നതിലെ കേൾവി–അനുസരണം നിഴൽ
  choice: അവന്റെ ശബ്ദത്തിനു ചെവികൊടുത്തതുമില്ല
  alternative: അവന്റെ ശബ്ദം അനുസരിച്ചതുമില്ല
  rationale: ഉറവിടത്തിലെ ശ്രവണബിംബം നിലനിർത്തുകയും അനുസരണസൂചനയെ ഇല്ലാതാക്കാതിരിക്കുകയും ചെയ്യുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘അനുസരിക്കുക’ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള ദൈവവചനം വ്യക്തമായി വേർതിരിച്ചു; ഹീബ്രുവിലെ ആവർത്തിച്ച നിഷേധവും കുറ്റാരോപണത്തിന്റെ ശക്തിയും നിലനിർത്തി. ‘വായ’, ‘വിശ്വസിക്കുക/ആശ്രയിക്കുക’, ‘കേൾക്കുക/അനുസരിക്കുക’ എന്നീ അർഥനിഴലുകൾ മുഖ്യപാഠവും അടിക്കുറിപ്പുകളും ചേർന്ന് സംരക്ഷിക്കുന്നു.
