id: DEU.9.17
reference: Deuteronomy 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֶתְפֹּשׂ֙ בִּ/שְׁנֵ֣י הַ/לֻּחֹ֔ת וָֽ/אַשְׁלִכֵ֔/ם מֵ/עַ֖ל שְׁתֵּ֣י יָדָ֑/י וָ/אֲשַׁבְּרֵ֖/ם לְ/עֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/017.yaml
  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
translation:
  language: ml
  text: അങ്ങനെ ഞാൻ ആ രണ്ടു പലകകളും പിടിച്ച്, എന്റെ രണ്ടു കൈകളിൽനിന്ന് അവ എറിഞ്ഞുകളഞ്ഞു; നിങ്ങളുടെ കൺമുന്നിൽവെച്ച് അവ തകർത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവ ഒടിച്ചുകളഞ്ഞു.’
    reason: שׁבר എന്ന എബ്രായക്രിയയ്ക്ക് ‘തകർക്കുക’ എന്നും കൂടുതൽ ലളിതമായി ‘ഒടിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: പിടിച്ച്
  rationale: תפשׂ എന്ന ക്രിയയുടെ ‘പിടിക്കുക/കൈക്കലാക്കുക’ എന്ന ശാരീരിക പ്രവർത്തനം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: ആ രണ്ടു പലകകളും
  rationale: ലുഹോത്ത് എന്നത് ഇവിടെ സന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്ന ഉടമ്പടിപ്പലകകളെയാണ് സൂചിപ്പിക്കുന്നത്; ഈ വാക്യത്തിൽ ‘കല്ല്’ എന്ന പദം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: וָאַשְׁלִכֵם
  choice: അവ എറിഞ്ഞുകളഞ്ഞു
  rationale: שלך എന്ന ക്രിയയുടെ ‘എറിയുക’ എന്ന നേരിട്ടുള്ള അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘കളഞ്ഞു’ പ്രവർത്തിയുടെ ഉദ്ദേശ്യപൂർവമായ പൂർത്തീകരണം വ്യക്തമാക്കുന്നു.
- source_word: מֵעַל שְׁתֵּי יָדָי
  choice: എന്റെ രണ്ടു കൈകളിൽനിന്ന്
  rationale: എബ്രായത്തിലെ ‘എന്റെ രണ്ടു കൈകളുടെ മുകളിൽനിന്ന്’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ‘രണ്ടു’ എന്ന ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וָאֲשַׁבְּרֵם
  choice: അവ തകർത്തു
  rationale: שׁבר എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘തകർക്കുക/ഒടിക്കുക’ സംരക്ഷിക്കുന്നു. പലകകൾ ചിതറിപ്പോയെന്ന ഫലം മൂലപാഠം നിർബന്ധമായി വ്യക്തമാക്കാത്തതിനാൽ കൂടുതൽ ശക്തമായ ‘തകർത്തുടച്ചു’ ഒഴിവാക്കി.
- source_word: לְעֵינֵיכֶם
  choice: നിങ്ങളുടെ കൺമുന്നിൽവെച്ച്
  rationale: ‘നിങ്ങളുടെ കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന എബ്രായ ശൈലിയെ ആധുനികവും ദൃശ്യവുമായ മലയാളപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണം. പ്രവൃത്തികളുടെ തുടർച്ച നിലനിർത്താൻ ക്രിയാവിന്യാസം സ്വാഭാവികമാക്കി; മൂലപാഠത്തിലെ ‘രണ്ടു കൈകൾ’ എന്ന വ്യക്തമായ സൂചനയും ‘കൺമുന്നിൽ’ എന്ന ദൃശ്യശൈലിയും സംരക്ഷിച്ചു.
