  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה נָתַ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵ֛י לֻחֹ֥ת הָ/אֲבָנִ֖ים לֻח֥וֹת הַ/בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/011.yaml
  text: And at the end of forty days and forty nights[a], Yahweh gave me the two stone tablets, the tablets of the covenant.
translation:
  language: ml
  text: നാല്പത് ദിവസവും നാല്പത് രാത്രിയും കഴിഞ്ഞപ്പോൾ, യാഹ്‌വെ എനിക്കു രണ്ടു കൽപ്പലകകൾ തന്നു—ഉടമ്പടിയുടെ പലകകൾ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും നാൽപ്പതു പകലും രാത്രിയും പൂർത്തിയായ സമയബിന്ദുവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: നാല്പതു പകലും നാല്പതു രാത്രിയും
  rationale: എബ്രായത്തിലെ സമാന്തരമായ കാലപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: נָתַן
  choice: തന്നു
  rationale: അധിക വ്യാഖ്യാനഭാരം ചേർക്കാതെ സാധാരണ അർഥം നൽകുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֵלַי
  choice: എനിക്കു
  rationale: נתן എന്ന ക്രിയയോടുകൂടിയ പരോക്ഷ കർമത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: ആ രണ്ടു കൽപ്പലകകൾ
  rationale: സന്ദർഭത്തിൽ നിർദിഷ്ടമായ ജോഡിയെയും പലകകൾ കല്ലുകൊണ്ടുള്ളവയാണെന്ന ബന്ധത്തെയും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: לֻחוֹת הַבְּרִית
  choice: ഉടമ്പടിയുടെ പലകകളായ
  rationale: ആവർത്തിച്ചുള്ള എബ്രായ നാമപദത്തെ ഒഴിവാക്കാതെ, മുൻപുള്ള കൽപ്പലകകളെ വിശദീകരിക്കുന്ന സമാനാധികരണബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൽപ്പലകകൾ’, ‘ഉടമ്പടി’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; എബ്രായത്തിലെ ആവർത്തനം സമാനാധികരണ ഘടനയിലൂടെ സംരക്ഷിച്ചു.
