  terminology: “യാഹ്‌വെ,” “കൽപ്പലകകൾ,” and “ഉടമ്പടി” are suitable, established terms. “നാല്പത് ദിവസവും നാല്പത് രാത്രിയും” is a natural and precise rendering of the Hebrew temporal expression.
