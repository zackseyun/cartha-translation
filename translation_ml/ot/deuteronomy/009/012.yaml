id: DEU.9.12
reference: Deuteronomy 9:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֣וּם רֵ֤ד מַהֵר֙ מִ/זֶּ֔ה כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הוֹצֵ֖אתָ מִ/מִּצְרָ֑יִם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֥וּ לָ/הֶ֖ם מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ എന്നോടു പറഞ്ഞു: “എഴുന്നേറ്റ് ഇവിടെനിന്ന് വേഗം ഇറങ്ങിച്ചെല്ലുക. നീ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്ന നിന്റെ ജനം ദുഷിച്ചുപോയിരിക്കുന്നു. ഞാൻ അവരോടു കല്പിച്ച വഴിയിൽനിന്ന് അവർ വേഗം മാറിയിരിക്കുന്നു; അവർ തങ്ങൾക്കായി ഒരു ലോഹവാർപ്പുപ്രതിമ ഉണ്ടാക്കിയിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഉരുക്കിയ ലോഹപ്രതിമ.” എബ്രായപദം ഉരുക്കിയ ലോഹം അച്ചിൽ വാർത്ത് ഉണ്ടാക്കിയ പ്രതിമയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: എഴുന്നേറ്റ് ഇവിടെനിന്ന് വേഗം ഇറങ്ങിച്ചെല്ലുക
  rationale: തുടർച്ചയായ കല്പനകളുടെ അടിയന്തരതയും മലയിൽനിന്നുള്ള താഴോട്ടുള്ള നീക്കവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: שִׁחֵת
  choice: ദുഷിച്ചുപോയിരിക്കുന്നു
  rationale: ധാർമികവും ആരാധനാപരവുമായ അധഃപതനം സൂചിപ്പിക്കുന്നു; ഹീബ്രു ക്രിയയിൽ വ്യക്തമായി ഇല്ലാത്ത കർമപ്രത്യയാർഥം അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: עַמְּךָ
  choice: നിന്റെ ജനം
  rationale: ദൈവം മോശെയോട് ഉപയോഗിക്കുന്ന കുറ്റപ്പെടുത്തലോടുകൂടിയ അകലം അതേപടി നിലനിർത്തുന്നു.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: വഴിയിൽനിന്ന് അവർ വേഗം മാറിയിരിക്കുന്നു
  rationale: നിർദേശിക്കപ്പെട്ട ജീവിതമാർഗത്തിൽനിന്നുള്ള വ്യതിചലനം എന്ന രൂപകവും ‘വേഗം’ എന്ന ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: מַסֵּכָה
  choice: ലോഹവാർപ്പുപ്രതിമ
  rationale: ഉരുക്കിയ ലോഹം അച്ചിൽ വാർത്ത് നിർമ്മിച്ച പ്രതിമയെന്ന വസ്തുനിഷ്ഠ അർഥം വ്യക്തമാക്കുന്നു; പൊതുവായ ‘വിഗ്രഹം’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘നിന്റെ ജനം, നീ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്ന’ എന്ന കുറ്റപ്പെടുത്തലോടുകൂടിയ അകലം
  choice: നീ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്ന നിന്റെ ജനം
  alternative: ഈജിപ്തിൽനിന്ന് ഞാൻ കൊണ്ടുവന്ന എന്റെ ജനം
  rationale: ഹീബ്രു വാചകത്തിലെ ദൈവിക ശാസനയും മോശെയിലേക്കുള്ള ഉത്തരവാദിത്വസൂചനയും മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: מַסֵּכָה എന്ന വിഗ്രഹാരാധനാപദത്തിന്റെ വിവർത്തനം
  choice: ലോഹവാർപ്പുപ്രതിമ
  alternative: വിഗ്രഹം / ഉരുക്കിയ പ്രതിമ
  rationale: പാപത്തിന്റെ വസ്തുനിഷ്ഠ രൂപമായ ലോഹവാർപ്പുനിർമാണം നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായി പൊതുവാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എഴുന്നേറ്റ്’, ‘കല്പിച്ച വഴി’ എന്നിവ വാക്യത്തിന്റെ ഔന്നത്യവും ബൈബിൾപരമായ രൂപകവും നിലനിർത്തുന്നു; അപരിചിതമായ അതിപുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
