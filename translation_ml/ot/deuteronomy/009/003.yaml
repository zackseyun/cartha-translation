source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: ml
  text: അതിനാൽ, നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു മുമ്പായി കടന്നുപോകുന്നവനാണെന്ന് ഇന്ന് അറിഞ്ഞുകൊൾക[a]. അവൻ ദഹിപ്പിക്കുന്ന അഗ്നിയാണ്[b]. അവൻ അവരെ നശിപ്പിക്കുകയും നിന്റെ മുമ്പിൽ അവരെ കീഴടക്കുകയും ചെയ്യും. നീ അവരെ പുറത്താക്കി അവരുടെ ഭൂമി കൈവശമാക്കുകയും[c] അവരെ വേഗത്തിൽ ഇല്ലാതാക്കുകയും ചെയ്യും—യഹ്‌വെ നിന്നോടു പറഞ്ഞതുപോലെ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിനക്കു മുമ്പായി പോകുന്നവൻ.” എബ്രായ കൃതന്തം യഹ്‌വെ ഇസ്രായേലിന് മുന്നിലായി കടന്നുപോകുന്നവനായി ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വിഴുങ്ങുന്ന അഗ്നി.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “നീ അവരെ പുറത്താക്കും.” എബ്രായ ക്രിയയ്ക്ക് അവരെ പുറത്താക്കി അവരുടെ ഭൂമി കൈവശമാക്കുക എന്ന അർഥവ്യാപ്തിയുണ്ട്.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, “യഹ്‌വെ നിന്നോടു പറഞ്ഞതുപോലെ.” ഇത് യഹ്‌വെ ഇസ്രായേലിനോടു മുമ്പ് പറഞ്ഞ വചനത്തിനനുസരിച്ച് ഇതു സംഭവിക്കുമെന്ന ആശയമാണ് നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: അതുകൊണ്ട് ... ഇന്ന് അറിഞ്ഞുകൊൾക
  rationale: മുൻസന്ദർഭത്തോടുള്ള ബന്ധം ‘അതുകൊണ്ട്’ വ്യക്തമാക്കുന്നു; രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള പ്രബോധനശക്തി ‘അറിഞ്ഞുകൊൾക’ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: തന്നെയാണ് നിനക്കു മുമ്പായി കടന്നുപോകുന്നത്
  rationale: വർത്തമാനകൃതന്തത്തിന്റെ സജീവവും ഉടനടിയുമായ ഭാവവും ദേശത്തേക്കുള്ള കടന്നുപോകലുമായുള്ള ശാബ്ദികബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: אֵשׁ אֹכְלָה
  choice: ദഹിപ്പിക്കുന്ന അഗ്നി
  rationale: വിശുദ്ധവും നാശകരവുമായ ദൈവസാന്നിധ്യത്തിന്റെ ശക്തമായ രൂപകം മയപ്പെടുത്താതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יַשְׁמִידֵם
  choice: അവരെ നശിപ്പിക്കും
  rationale: שׁמד എന്ന ക്രിയയുടെ കാരണാർഥകവും ശക്തവുമായ നാശസൂചന നേരിട്ട് നൽകുന്നു.
- source_word: יַכְנִיעֵם
  choice: അവരെ കീഴടക്കും
  rationale: യുദ്ധസന്ദർഭത്തിലുള്ള താഴ്ത്തലും അധീനപ്പെടുത്തലും ‘കീഴടക്കും’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהוֹרַשְׁתָּם
  choice: അവരെ അവരുടെ അവകാശഭൂമിയിൽനിന്ന് നീക്കും
  rationale: ירשׁ എന്ന ക്രിയയുടെ ഭൂമിയവകാശപരമായ അർഥം വായനക്കാരന് വ്യക്തമായി ലഭിക്കാനായി സ്വാഭാവികമായി വികസിപ്പിച്ചിരിക്കുന്നു.
- source_word: וְהַאֲבַדְתָּם מַהֵר
  choice: വേഗത്തിൽ ഇല്ലാതാക്കും
  rationale: אבד എന്ന ക്രിയയെ മുമ്പത്തെ שׁמד-ൽനിന്ന് പദപരമായി വേർതിരിക്കുമ്പോഴും അതിന്റെ കാരണാർഥകമായ നാശഭാവവും מַהֵר എന്നതിന്റെ വേഗസൂചനയും നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: യഹ്‌വെ നിന്നോട് അരുളിച്ചെയ്തതുപോലെ
  rationale: മുൻപ് ഉണ്ടായ ദൈവവചനത്തെ സൂചിപ്പിക്കുന്നു; ‘വാഗ്ദാനം ചെയ്തു’ എന്ന് വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയാക്കി മാറ്റാതെ സൂക്ഷിക്കുന്നു; ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ രൂപം നിർബന്ധിക്കുന്നില്ല.
- issue: אֵשׁ אֹכְלָה എന്ന ദൈവിക യുദ്ധരൂപകം
  choice: ദഹിപ്പിക്കുന്ന അഗ്നി
  alternative: വിഴുങ്ങുന്ന അഗ്നി
  rationale: ദൈവത്തിന്റെ ന്യായവിധിയുടെയും നാശകരമായ സാന്നിധ്യത്തിന്റെയും രൂപകഭാരം വിശദീകരിച്ചോ മയപ്പെടുത്തിയോയില്ലാതെ നിലനിർത്തുന്നു.
- issue: ദൈവിക പ്രവർത്തനവും ഇസ്രായേലിന്റെ പ്രവർത്തനവും തമ്മിലുള്ള സംഘർഷം
  choice: ദൈവം നശിപ്പിക്കുകയും കീഴടക്കുകയും ചെയ്യുന്നു; ഇസ്രായേൽ നീക്കുകയും ഇല്ലാതാക്കുകയും ചെയ്യുന്നു
  alternative: എല്ലാ പ്രവർത്തനവും ദൈവത്തിനോ ഇസ്രായേലിനോ മാത്രം ആക്കി ഏകീകരിക്കൽ
  rationale: മൂലവാക്യം ദൈവിക പ്രവർത്തനവും മനുഷ്യപ്രവർത്തനവും ഒപ്പം വയ്ക്കുന്നു; ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഏകവചന അഭിസംബോധനയാണ് ഉപയോഗിച്ചത്. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചെങ്കിലും മൂലത്തിലെ ആവർത്തിത കർത്തൃത്വം നിലനിർത്തി. യുദ്ധഭാഷ മയപ്പെടുത്താതെയും അനാവശ്യമായി കൂടുതൽ ക്രൂരമാക്കാതെയും വിവർത്തനം ചെയ്തു.
