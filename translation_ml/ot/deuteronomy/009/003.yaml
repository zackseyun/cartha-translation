revisions:
- from: അതുകൊണ്ട്, നിന്റെ ദൈവമായ യഹ്‌വെ തന്നെയാണ് നിനക്കു മുമ്പായി കടന്നുപോകുന്നത് എന്ന് ഇന്ന് അറിഞ്ഞുകൊൾക[a]. അവിടന്ന് ദഹിപ്പിക്കുന്ന അഗ്നിയാണ്[b]. അവിടന്ന് അവരെ നശിപ്പിക്കുകയും നിന്റെ മുമ്പിൽ അവരെ കീഴടക്കുകയും ചെയ്യും. നീ അവരെ അവരുടെ അവകാശഭൂമിയിൽനിന്ന് നീക്കുകയും[c] വേഗത്തിൽ ഇല്ലാതാക്കുകയും ചെയ്യും—യഹ്‌വെ നിന്നോട് അരുളിച്ചെയ്തതുപോലെ[d].
  to: അതിനാൽ, നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു മുമ്പായി കടന്നുപോകുന്നവനാണെന്ന് ഇന്ന് അറിഞ്ഞുകൊൾക[a]. അവൻ ദഹിപ്പിക്കുന്ന അഗ്നിയാണ്[b]. അവൻ അവരെ നശിപ്പിക്കുകയും നിന്റെ മുമ്പിൽ അവരെ കീഴടക്കുകയും ചെയ്യും. നീ അവരെ പുറത്താക്കി അവരുടെ ഭൂമി കൈവശമാക്കുകയും[c] അവരെ വേഗത്തിൽ ഇല്ലാതാക്കുകയും ചെയ്യും—യഹ്‌വെ നിന്നോടു പറഞ്ഞതുപോലെ[d].
  rationale: The revision removes an unstated “inheritance” qualification, uses modern standard Malayalam pronoun and speech forms, and retains the source's distinctions between Yahweh's action, Israel's dispossession of the nations, and their rapid destruction. All existing footnote anchors are retained and the notes are conformed to the revised wording.
