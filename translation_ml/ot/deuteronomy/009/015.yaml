id: DEU.9.15
reference: Deuteronomy 9:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֵ֗פֶן וָֽ/אֵרֵד֙ מִן הָ/הָ֔ר וְ/הָ/הָ֖ר בֹּעֵ֣ר בָּ/אֵ֑שׁ וּ/שְׁנֵי֙ לֻחֹ֣ת הַ/בְּרִ֔ית עַ֖ל שְׁתֵּ֥י יָדָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/015.yaml
  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: ml
  text: അങ്ങനെ ഞാൻ തിരിഞ്ഞ് മലയിൽനിന്ന് ഇറങ്ങി; മല തീയിൽ കത്തിക്കൊണ്ടിരുന്നു[a]. ഉടമ്പടിയുടെ രണ്ടു പലകകളും എന്റെ രണ്ടു കൈകളിലുമുണ്ടായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മല തീയിൽ കത്തിക്കൊണ്ടിരിക്കെ.” എബ്രായത്തിലെ ബന്ധകപദം ലളിതമായ ഏകോപനമായോ, ഇറങ്ങിവരുന്നതിനോടൊപ്പം നടന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നതായോ വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “എന്റെ രണ്ടു കൈകളുടെ മേൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: അങ്ങനെ ഞാൻ തിരിഞ്ഞ്
  rationale: פנה എന്ന ക്രിയയുടെ തുടർച്ചയായ ആഖ്യാനരൂപം അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കവും ‘തിരിയുക’ എന്ന അർഥവും നൽകുന്നു; ‘അങ്ങനെ’ ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് നിലനിർത്തുന്നു.
- source_word: וָאֵרֵד מִן הָהָר
  choice: മലയിൽനിന്ന് ഇറങ്ങി
  rationale: ירד എന്നത് താഴേക്ക് ഇറങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; നിർദിഷ്ടമായ הָהָר ഇവിടെ മോശെ ഉണ്ടായിരുന്ന മലയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: മല തീയിൽ കത്തിക്കൊണ്ടിരുന്നു
  rationale: בֹּעֵר എന്ന വർത്തമാനകൃദന്തരൂപം നടന്നുകൊണ്ടിരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; בָּאֵשׁ എന്ന പ്രയോഗത്തിലെ ‘തീയിൽ/തീകൊണ്ട്’ എന്ന ഊന്നൽ നിലനിർത്തിയിരിക്കുന്നു. וְ എന്ന ബന്ധകത്തെ മുഖ്യവാചകത്തിൽ ലളിതമായ ഏകോപനമായി സൂക്ഷിക്കുന്നു.
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: ഉടമ്പടിയുടെ രണ്ടു പലകകളും
  rationale: לֻחֹת ഈ സന്ദർഭത്തിൽ കൽപ്പലകകളെയാണ് സൂചിപ്പിക്കുന്നത്; הַבְּרִית എന്നത് ‘ഉടമ്പടി’ എന്നാണ്. എബ്രായത്തിലെ വ്യക്തമായ ‘രണ്ട്’ നിലനിർത്തിയിരിക്കുന്നു.
- source_word: עַל שְׁתֵּי יָדָי
  choice: എന്റെ രണ്ടു കൈകളിലുമുണ്ടായിരുന്നു
  rationale: עַל അക്ഷരാർഥത്തിൽ ‘മേൽ’ എന്നാണെങ്കിലും, ഇവിടെ പലകകൾ രണ്ടു കൈകളിലും പിടിച്ചിരുന്നുവെന്ന സ്വാഭാവിക അർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘രണ്ട്’ എന്ന മൂലപാഠത്തിലെ വിശദാംശവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആഖ്യാനക്രമം സ്വാഭാവികമായി നിലനിർത്തുകയും ബന്ധകത്തിന്റെ സാഹചര്യാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
