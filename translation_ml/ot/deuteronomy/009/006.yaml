id: DEU.9.6
reference: Deuteronomy 9:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിന്റെ നീതിനിമിത്തമല്ല നിന്റെ ദൈവമായ യഹോവ നിനക്കു ഈ നല്ല ദേശം കൈവശമാക്കാൻ തരുന്നതെന്ന് അറിഞ്ഞുകൊൾക; കാരണം, നീ ദുശ്ശാഠ്യമുള്ള ഒരു ജനമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: അതുകൊണ്ട് ... അറിഞ്ഞുകൊൾക
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം ‘അതുകൊണ്ട്’ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ നിർദേശാത്മകമായി പ്രവർത്തിക്കുന്ന ക്രിയയെ ‘അറിഞ്ഞുകൊൾക’ എന്നു നൽകുന്നു.
- source_word: לֹא בְצִדְקָתְךָ
  choice: നിന്റെ നീതിനിമിത്തമല്ല
  rationale: בְ ഇവിടെ ഉപകരണമല്ല, അടിസ്ഥാനമോ കാരണമോ സൂചിപ്പിക്കുന്നു; സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അതിനെ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമം ലിപ്യന്തരണം ചെയ്ത് ഉടമ്പടിസംബന്ധമായ അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: נֹתֵן לְךָ
  choice: നിനക്കു തരുന്നത്
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്നതോ ആസന്നമായതോ ആയ ദാനഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: ഈ നല്ല ദേശം
  rationale: നിർദ്ദേശകത്തിന്റെയും വിശേഷണത്തിന്റെയും ഊന്നൽ നിലനിർത്തുന്നു; വാഗ്ദത്തഭൂമിയുടെ പശ്ചാത്തലത്തിൽ ‘ദേശം’ സ്വാഭാവികമാണ്.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ആവർത്തനപുസ്തകത്തിൽ ירשׁ ഭൂമി ഏറ്റെടുത്തു കൈവശം വയ്ക്കുന്നതിനെ പലപ്പോഴും സൂചിപ്പിക്കുന്നു; അവകാശമായി ലഭിക്കുക എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: ദുശ്ശാഠ്യമുള്ള ഒരു ജനം
  rationale: ഹീബ്രു ശരീരരൂപകം അക്ഷരാർഥത്തിൽ മലയാളത്തിൽ അസ്വാഭാവികവും അർത്ഥം മങ്ങിയതുമായതിനാൽ അതിന്റെ സ്ഥാപിതമായ ആശയം വ്യക്തവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന് ദേശം ലഭിക്കുന്നതിന്റെ അടിസ്ഥാനം
  choice: ഇസ്രായേലിന്റെ സ്വന്തം നീതിയല്ല യഹോവ ദേശം നൽകുന്നതിന്റെ കാരണം എന്ന് വ്യക്തമായി നിഷേധിക്കുന്നു.
  alternative: വാക്യത്തെ ഉടമ്പടിസംബന്ധമായ അയോഗ്യതയുടെ ഊന്നൽ ഇല്ലാത്ത പൊതുവായ വിനയോപദേശമായി മൃദൂകരിക്കുക.
  rationale: ഹീബ്രു പാഠം ഇസ്രായേലിന്റെ നീതിയെ ദാനത്തിന്റെ അടിസ്ഥാനമായി നിഷേധിക്കുകയും അവരുടെ ദുശ്ശാഠ്യവുമായി അതിനെ നേരിട്ട് താരതമ്യപ്പെടുത്തുകയും ചെയ്യുന്നു.
- issue: സമൂഹത്തെ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യൽ
  choice: ‘നിന്റെ’, ‘നിനക്കു’, ‘നീ’ എന്നീ ഏകവചനരൂപങ്ങൾ നിലനിർത്തി ‘ഒരു ജനം’ എന്ന സമൂഹവാചകം ഉപയോഗിക്കുന്നു.
  alternative: ‘നിങ്ങൾ’ എന്ന ബഹുവചനത്തിലേക്ക് വികസിപ്പിക്കുക.
  rationale: ഹീബ്രു ഇസ്രായേലിനെ ഏകീകൃത സമൂഹമായി ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു; മലയാളത്തിലെ ഏകവചനരൂപങ്ങൾ ആ വ്യാകരണ-വാചകഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കാരണബന്ധവും സമൂഹത്തെ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്ന ഹീബ്രു സവിശേഷതയും നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാർഥ ശരീരരൂപകത്തിന് പകരം വ്യക്തമായ ‘ദുശ്ശാഠ്യമുള്ള’ ഉപയോഗിച്ചു.
