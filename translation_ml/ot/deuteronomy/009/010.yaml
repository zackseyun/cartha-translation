id: DEU.9.10
reference: Deuteronomy 9:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵי֙ לוּחֹ֣ת הָֽ/אֲבָנִ֔ים כְּתֻבִ֖ים בְּ/אֶצְבַּ֣ע אֱלֹהִ֑ים וַ/עֲלֵי/הֶ֗ם כְּֽ/כָל הַ/דְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה עִמָּ/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֥וֹם הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: ml
  text: യഹോവ എനിക്ക് ആ രണ്ടു കൽപ്പലകകൾ തന്നു; അവ ദൈവത്തിന്റെ വിരൽകൊണ്ട് എഴുതപ്പെട്ടവയായിരുന്നു. അവയിൽ, സഭായോഗദിവസം മലയിൽ തീയുടെ നടുവിൽനിന്ന് യഹോവ നിങ്ങളോടു സംസാരിച്ച എല്ലാ വചനങ്ങളും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּתֵּן
  choice: തന്നു
  rationale: נתן എന്ന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യപദം.
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: ആ രണ്ടു കൽപ്പലകകൾ
  rationale: മുൻസന്ദർഭത്തിൽ പരാമർശിച്ച നിർദിഷ്ടമായ രണ്ടു ശിലാഫലകങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים
  choice: ദൈവത്തിന്റെ വിരൽകൊണ്ട് എഴുതപ്പെട്ടവയായിരുന്നു
  rationale: മൂലത്തിലെ കർമണി പ്രയോഗവും ദൈവിക പ്രവർത്തനത്തിന്റെ സജീവമായ മനുഷ്യരൂപകൽപ്പനയും വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: וַעֲלֵיהֶם כְּכָל הַדְּבָרִים
  choice: അവയിൽ ... എല്ലാ വചനങ്ങളും ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിത ഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും പലകകളിലെ ഉള്ളടക്കം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: യഹോവ നിങ്ങളോടു സംസാരിച്ച
  rationale: עִם എന്നതിന്റെ ‘കൂടെ/ഒപ്പം’ എന്ന അടിസ്ഥാനഭാവം മലയാളത്തിലെ സ്വാഭാവികമായ ‘നിങ്ങളോടു സംസാരിച്ച’ എന്ന പ്രയോഗത്തിൽ നിലനിൽക്കുന്നു; ഏകപക്ഷീയമായി ‘അരുളിച്ചെയ്ത’ എന്നു മാറ്റുന്നില്ല.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: തീയുടെ നടുവിൽനിന്ന്
  rationale: מִתּוֹךְ എന്നതിലെ ‘അകത്തുനിന്ന്/നടുവിൽനിന്ന്’ എന്ന സ്ഥലപരമായ വ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: בְּיוֹם הַקָּהָל
  choice: സഭായോഗത്തിന്റെ ദിവസം
  rationale: קָהָל എന്നത് ഇസ്രായേലിന്റെ ഔപചാരികമായി കൂടിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സഭായോഗം’ ആ കൂട്ടായ സംഭവത്തിന്റെ അർഥം ചുരുക്കമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രവർത്തനത്തെ മനുഷ്യാവയവത്തിന്റെ ഭാഷയിൽ അവതരിപ്പിക്കൽ
  choice: ദൈവത്തിന്റെ വിരൽകൊണ്ട്
  alternative: ദൈവത്തിന്റെ ശക്തിയാൽ / ദൈവംതന്നെ
  rationale: എബ്രായപാഠം ‘ദൈവത്തിന്റെ വിരൽ’ എന്ന് വ്യക്തമായി പറയുന്നു. ആ സജീവമായ മനുഷ്യരൂപകൽപ്പന വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ സംരക്ഷിച്ചു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: പാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: דִּבֶּר ... עִמָּכֶם എന്ന ബന്ധപ്രയോഗം
  choice: നിങ്ങളോടു സംസാരിച്ച
  alternative: നിങ്ങളോട് അരുളിച്ചെയ്ത / നിങ്ങളുമായി സംസാരിച്ച
  rationale: ദൈവം ജനത്തോടു നടത്തിയ നേരിട്ടുള്ള സംസാരത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘നിങ്ങളുമായി’ എന്നു പറഞ്ഞ് നിർബന്ധമായി പരസ്പരസംഭാഷണമാക്കുന്നില്ല, ‘അരുളിച്ചെയ്ത’ എന്നു പറഞ്ഞ് മൂലത്തിൽ ഇല്ലാത്ത രജിസ്റ്റർ ചേർക്കുന്നുമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സമന്വയിപ്പിച്ചു. ‘കൽപ്പലകകൾ’, ‘വചനങ്ങൾ’, ‘തീയുടെ നടുവിൽനിന്ന്’ എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിന്റെ ദൃശ്യതയും ഔപചാരിക ഭാവവും നിലനിർത്തുന്നു. ഈ വാക്യത്തിന് പ്രത്യേകം അടിക്കുറിപ്പ് ആവശ്യമില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പുചിഹ്നങ്ങളില്ല.
