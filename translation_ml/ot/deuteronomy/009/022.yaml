language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְ/תַבְעֵרָה֙ וּ/בְ/מַסָּ֔ה וּ/בְ/קִבְרֹ֖ת הַֽתַּאֲוָ֑ה מַקְצִפִ֥ים הֱיִיתֶ֖ם אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: ml
  text: തബേരയിലും മസ്സയിലും കിബ്രോത്ത്-ഹത്താവയിലും[a] നിങ്ങൾ യാഹ്‌വേയെ കോപിപ്പിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കിബ്രോത്ത്-ഹത്താവ” എന്ന സ്ഥലനാമത്തിന്റെ പദശഃ അർത്ഥം “ആസക്തിയുടെ കല്ലറകൾ” അഥവാ “മോഹത്തിന്റെ കല്ലറകൾ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/תַבְעֵרָה
  choice: തബേരയിലും
  rationale: പട്ടികയിലെ സ്ഥലസൂചനയായ בְ ‘-യിൽ’ എന്നും וּ ‘-ഉം’ എന്നും സ്വാഭാവികമായി ചേർത്തു; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּ/בְ/מַסָּה
  choice: മസ്സയിലും
  rationale: മുൻ സ്ഥലനാമത്തോടു സമാന്തരമായി സ്ഥലസൂചനയും സംയോജകവും നിലനിർത്തി, പേര് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּ/בְ/קִבְרֹת הַתַּאֲוָה
  choice: കിബ്രോത്ത്-ഹത്താവയിലും
  rationale: ഇത് ഒരു സ്ഥിരമായ സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു; പേരിന്റെ പദശഃ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: מַקְצִפִים הֱיִיתֶם
  choice: നിങ്ങൾ ... കോപിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: היה + ഹിഫീൽ കർത്തൃവാചക കൃതന്തം ഭൂതകാലത്തിലെ തുടർച്ചയായോ ആവർത്തിച്ചോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കോപിപ്പിച്ചുകൊണ്ടിരുന്നു’ അതിന്റെ കാരണാർത്ഥവും തുടർച്ചാഭാവവും നിലനിർത്തുന്നു.
- source_word: אֶת יְהוָה
  choice: യഹോവയെ
  rationale: אֶת നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്നു; ദൈവനാമമായ יהוה മലയാളത്തിലെ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: ഇസ്രായേലിന്റെ പ്രവൃത്തിയുടെ തുടർച്ചാഭാവം
  choice: കോപിപ്പിച്ചുകൊണ്ടിരുന്നു
  alternative: കോപിപ്പിച്ചു
  rationale: הֱיִיתֶם + מַקְצִפִים എന്ന പര്യായ ക്രിയാഘടനയിലെ തുടരുന്ന/ആവർത്തിക്കുന്ന ഭാവം നഷ്ടപ്പെടാതിരിക്കാൻ തുടർച്ച സൂചിപ്പിക്കുന്ന മലയാളരൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂന്നു സ്ഥലനാമങ്ങളുടെയും സമാന്തരഘടന ‘-യിലും’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ സൂചിക ബന്ധപ്പെട്ട സ്ഥലനാമത്തിനുതന്നെ ചേർത്തു.
