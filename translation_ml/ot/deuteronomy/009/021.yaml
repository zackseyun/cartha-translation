source:
  edition: WLC
  text: וְֽ/אֶת חַטַּאתְ/כֶ֞ם אֲשֶׁר עֲשִׂיתֶ֣ם אֶת הָ/עֵ֗גֶל לָקַחְתִּי֮ וָ/אֶשְׂרֹ֣ף אֹת֣/וֹ בָּ/אֵשׁ֒ וָ/אֶכֹּ֨ת אֹת֤/וֹ טָחוֹן֙ הֵיטֵ֔ב עַ֥ד אֲשֶׁר דַּ֖ק לְ/עָפָ֑ר וָֽ/אַשְׁלִךְ֙ אֶת עֲפָר֔/וֹ אֶל הַ/נַּ֖חַל הַ/יֹּרֵ֥ד מִן הָ/הָֽר־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: ml
  text: നിങ്ങളുടെ പാപത്തെ—നിങ്ങൾ ഉണ്ടാക്കിയ ആ കാളക്കുട്ടിയെ—ഞാൻ എടുത്ത് തീയിൽ ചുട്ടുകളഞ്ഞു. പിന്നെ അതിനെ ഇടിച്ചുതകർത്ത്, പൊടിപോലെ സൂക്ഷ്മമാകുന്നതുവരെ നന്നായി അരച്ചു; അതിന്റെ പൊടി മലയിൽനിന്ന് ഇറങ്ങിവരുന്ന നീരൊഴുക്കിൽ[a] എറിഞ്ഞുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം നീരൊഴുക്ക്, മലവെള്ളപ്പാച്ചിലിന്റെ ചാൽ, അല്ലെങ്കിൽ ഇടയ്ക്കു വരണ്ടുപോകാവുന്ന തോട് എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: നിങ്ങളുടെ പാപത്തെ
  rationale: കാളക്കുട്ടിയെ ഇസ്രായേലിന്റെ പാപവുമായി നേരിട്ട് സമീകരിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ രൂക്ഷത നിലനിർത്തുന്നു; ‘പാപയാഗം’ എന്ന അർഥം ഈ സന്ദർഭത്തിൽ യോജിക്കുന്നില്ല.
- source_word: הָעֵגֶל
  choice: ആ കാളക്കുട്ടിയെ
  rationale: സ്വർണക്കാളക്കുട്ടിയുടെ സംഭവത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സാധാരണവും സ്വാഭാവികവുമായ പദം.
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: തീയിൽ ചുട്ടുകളഞ്ഞു
  rationale: എബ്രായത്തിലെ തീകൊണ്ടുള്ള നശിപ്പിക്കൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וָאֶכֹּת אֹתוֹ
  choice: അതിനെ ഇടിച്ചുതകർത്ത്
  rationale: അരയ്ക്കുന്നതിനു മുമ്പുള്ള അടിച്ചുതകർക്കൽ എന്ന ക്രമവും ശക്തിയും പ്രകടമാക്കുന്നു.
- source_word: טָחוֹן הֵיטֵב
  choice: നന്നായി അരച്ചു
  rationale: അരയ്ക്കുന്ന പ്രക്രിയയും הֵיטֵב നൽകുന്ന സമഗ്രതയുടെ ഊന്നലും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: പൊടിപോലെ നേർത്തതാകുന്നതുവരെ
  rationale: പൊടിയോളം സൂക്ഷ്മമായിത്തീർന്ന അളവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עֲפָרוֹ
  choice: അതിന്റെ പൊടി
  rationale: അരച്ചുണ്ടായ അവശിഷ്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ചാരം’ എന്നു പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: הַנַּחַל
  choice: നീരൊഴുക്ക്
  rationale: ഒഴുകുന്ന വെള്ളത്തെയും അതിന്റെ ചാലിനെയും സൂചിപ്പിക്കാവുന്ന മൂലപദത്തിന് വായനാസൗകര്യമുള്ള പൊതുവായ മലയാളപദം; വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הַיֹּרֵד מִן הָהָר
  choice: മലയിൽനിന്ന് ഇറങ്ങിവരുന്ന
  rationale: വർത്തമാന വിവരണസ്വഭാവമുള്ള എബ്രായ കൃതന്തത്തിന്റെ ചലനം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: കാളക്കുട്ടിയെ ‘നിങ്ങളുടെ പാപം’ എന്നു നേരിട്ട് വിശേഷിപ്പിക്കുന്നത്
  choice: ‘നിങ്ങളുടെ പാപത്തെ—നിങ്ങൾ ഉണ്ടാക്കിയ ആ കാളക്കുട്ടിയെ—’ എന്ന സമാനാധികരണപ്രയോഗം
  alternative: ‘നിങ്ങൾ ഉണ്ടാക്കിയ പാപകരമായ വസ്തുവായ കാളക്കുട്ടിയെ’
  rationale: മൂലപാഠം വിഗ്രഹത്തെ ഇസ്രായേലിന്റെ പാപവുമായി ശക്തമായി സമീകരിക്കുന്നു. അതിനെ ‘പാപകരമായ വസ്തു’ എന്നു മയപ്പെടുത്താതെ, യഥാർഥമായ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിങ്ങളുടെ പാപത്തെ—…കാളക്കുട്ടിയെ—’ എന്ന ഇടച്ചേർക്കൽ മൂലപാഠത്തിലെ സമാനാധികരണവും രൂക്ഷതയും വ്യക്തമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട ‘നീരൊഴുക്ക്’ എന്ന പദത്തിനുശേഷമാണ് നൽകിയിരിക്കുന്നത്.
