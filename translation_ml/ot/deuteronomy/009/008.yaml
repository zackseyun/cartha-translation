revisions:
- from: ഹോരേബിൽവെച്ചുപോലും നിങ്ങൾ യഹോവയെ കോപിപ്പിച്ചു[a]; നിങ്ങളെ നശിപ്പിക്കത്തക്കവിധം യഹോവ നിങ്ങളോടു കോപിച്ചു[b].
  to: ഹോരേബിൽപ്പോലും നിങ്ങൾ യഹോവയെ കോപിപ്പിച്ചു[a]; നിങ്ങളെ നശിപ്പിക്കുവാൻ യഹോവ നിങ്ങളോടു കോപിച്ചു[b].
  rationale: 'The revision makes two limited corrections: it uses the idiomatic emphatic locative ‘ഹോരേബിൽപ്പോലും,’ and it replaces the potentially degree-oriented ‘നശിപ്പിക്കത്തക്കവിധം’ with the direct infinitival expression ‘നശിപ്പിക്കുവാൻ.’ The latter retains the Hebrew’s deliberately close purpose/result connection and does not imply that the destruction was carried out.'
