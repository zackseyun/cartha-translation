reference: Deuteronomy 9:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְ/חֹרֵ֥ב הִקְצַפְתֶּ֖ם אֶת יְהוָ֑ה וַ/יִּתְאַנַּ֧ף יְהוָ֛ה בָּ/כֶ֖ם לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: ml
  text: ഹോരേബിൽപ്പോലും നിങ്ങൾ യഹോവയെ കോപിപ്പിച്ചു[a]; നിങ്ങളെ നശിപ്പിക്കുവാൻ യഹോവ നിങ്ങളോടു കോപിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഹോരേബിൽ’ അല്ലെങ്കിൽ ‘ഹോരേബിലും.’ എബ്രായത്തിലെ ബന്ധകപദം കഥയുടെ തുടർച്ച മാത്രം സൂചിപ്പിക്കാം; ഇവിടെ അതിന് ഊന്നലുണ്ടാകാനും സാധ്യതയുണ്ട്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘യഹോവ നിങ്ങളോടു കോപിച്ചു, നിങ്ങളെ നശിപ്പിക്കുവാൻ.’ എബ്രായവാക്യം യഹോവയുടെ കോപത്തെ ഭീഷണിയായ നാശവുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: ഹോരേബിൽവെച്ചുപോലും
  rationale: ו conjunction ഇവിടെ മുൻസന്ദർഭത്തിന്റെ തുടർച്ചയോടൊപ്പം ഊന്നലും സൂചിപ്പിക്കാം. ‘പോലും’ ആ ഊന്നൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; എന്നാൽ ലളിതമായ തുടർച്ചയും സാധ്യമാണെന്നത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הִקְצַפְתֶּם
  choice: നിങ്ങൾ ... കോപിപ്പിച്ചു
  rationale: קצף എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘കോപിക്കാൻ ഇടയാക്കുക/കോപിപ്പിക്കുക’ എന്ന കാരകഭാവം നൽകുന്നു. മലയാളത്തിൽ ‘കോപിപ്പിച്ചു’ അതിനെ നേരായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: אֶת יְהוָה
  choice: യഹോവയെ
  rationale: יהוה എന്ന ദൈവനാമം ഇവിടെ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു; אֶת കർമസൂചകമായതിനാൽ വേറെ പരിഭാഷപ്പെടുന്നില്ല.
- source_word: וַיִּתְאַנַּף
  choice: കോപിച്ചു
  rationale: אנף ശക്തമായ കോപത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘കോപിച്ചു’ ഗൗരവമുള്ളതും സ്വാഭാവികവുമാണ്; തുടർന്നുള്ള നാശസൂചക ക്രിയയുമായുള്ള ബന്ധം വാക്യഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: בָּכֶם
  choice: നിങ്ങളോടു
  rationale: കോപത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന בְּ മലയാളത്തിൽ ‘നിങ്ങളോടു’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: നിങ്ങളെ നശിപ്പിക്കത്തക്കവിധം
  rationale: לְ സഹിതമുള്ള שׁמד ഹിഫീൽ infinitive കോപവും ഭീഷണിയായ നാശവും തമ്മിൽ ഉദ്ദേശ്യ/ഫലബന്ധം സ്ഥാപിക്കുന്നു. ‘നശിപ്പിക്കത്തക്കവിധം’ ഈ ബന്ധം നിലനിർത്തുന്നു; അത് യഥാർത്ഥത്തിൽ നടന്ന നാശമായി തെറ്റിദ്ധരിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ നിയമബന്ധപരമായ ദൈവനാമം നേരിട്ട് കാണുന്നതിനാൽ അതിനെ പേരായി നിലനിർത്തുന്നു; ‘കർത്താവ്’ എന്ന പദവി ഉപയോഗിച്ച് മറച്ചിട്ടില്ല.
- issue: ദൈവകോപവും നശിപ്പിക്കാനുള്ള ഭീഷണിയും തമ്മിലുള്ള ബന്ധം
  choice: നിങ്ങളെ നശിപ്പിക്കത്തക്കവിധം ... കോപിച്ചു
  alternative: നിങ്ങളെ നശിപ്പിക്കാൻ ... കോപിച്ചു
  rationale: לְהַשְׁמִיד ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാവുന്നതിനാൽ മലയാളരൂപം ആ ബന്ധം പ്രകടമാക്കുകയും അതിനെ അന്തിമമായി ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവവും തിരുവെഴുത്തുശൈലിയും നിലനിർത്തുന്ന ഭാഷയാണ് ഉപയോഗിച്ചത്. ‘ഹോരേബ്’, ‘യഹോവ’ എന്നീ പേരുകൾ മലയാളലിപിയിൽ നിലനിർത്തി; അനാവശ്യമായി പുരാതനമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
