id: DEU.9.27
reference: Deuteronomy 9:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זְכֹר֙ לַ/עֲבָדֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב אַל תֵּ֗פֶן אֶל קְשִׁי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/אֶל רִשְׁע֖/וֹ וְ/אֶל חַטָּאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: ml
  text: അങ്ങയുടെ ദാസന്മാരായ അബ്രാഹാമിനെയും യിസ്ഹാക്കിനെയും യാക്കോബിനെയും ഓർക്കണമേ. ഈ ജനത്തിന്റെ ദുശ്ശാഠ്യത്തെയോ[a] അവരുടെ ദുഷ്ടതയെയോ അവരുടെ പാപത്തെയോ അങ്ങ് ഗൗനിക്കരുതേ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കാഠിന്യം’ അല്ലെങ്കിൽ ‘വഴങ്ങാത്ത സ്വഭാവം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം മറ്റിടങ്ങളിലെ ‘കടുത്ത കഴുത്തുള്ളവർ’ എന്ന പ്രത്യേക പ്രയോഗമല്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവയിലേക്കു തിരിയരുതേ’; അഥവാ ‘പരിഗണിക്കരുതേ’ അല്ലെങ്കിൽ ‘ശ്രദ്ധിക്കരുതേ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: ഓർക്കണമേ
  rationale: ദൈവത്തോടുള്ള മോശെയുടെ മധ്യസ്ഥപ്രാർഥനയിലെ ആജ്ഞാരൂപമാണിത്. ‘ഓർക്കണമേ’ എന്നത് ഉടമ്പടിസംബന്ധമായ പ്രാർഥനയുടെ ഭാവവും ആദരസൂചകമായ മലയാള പ്രയോഗവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לַעֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരായ
  rationale: עבד എന്നതിന് ദാസൻ, അടിമ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ പിതാക്കന്മാർ ദൈവത്തോടുള്ള ആദരണീയമായ ഉടമ്പടിബന്ധത്തിൽ പരാമർശിക്കപ്പെടുന്നതിനാൽ ‘ദാസന്മാർ’ യോജിക്കുന്നു; അടിമത്തത്തിന്റെ സാമൂഹിക നില ഇവിടെ മുഖ്യവിഷയമല്ല.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: അബ്രാഹാമിനെയും യിസ്ഹാക്കിനെയും യാക്കോബിനെയും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ രൂപങ്ങളിൽ നൽകി; ഹീബ്രുവിലെ പട്ടികയും സംയോജനവും നിലനിർത്തി.
- source_word: אַל תֵּפֶן אֶל
  choice: അങ്ങ് ഗൗനിക്കരുതേ
  rationale: പദാനുപദമായി ‘നേരെ തിരിയരുത്’ എന്ന ദൃശ്യരൂപമാണെങ്കിലും ഈ പ്രാർഥനാസന്ദർഭത്തിൽ അർഥം ‘പരിഗണിക്കരുത്/ശ്രദ്ധിക്കരുത്’ എന്നാണ്. ‘ഗൗനിക്കരുതേ’ ആ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; മൂലരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: קְשִׁי
  choice: ദുശ്ശാഠ്യം
  rationale: ഈ നാമം കാഠിന്യമോ ദുർവാശിയോ സൂചിപ്പിക്കുന്നു. ധാർമികമായ വഴങ്ങാത്ത മനോഭാവം വ്യക്തമാക്കാൻ ‘ദുശ്ശാഠ്യം’ തിരഞ്ഞെടുത്തു; ഇവിടെ ഇല്ലാത്ത പ്രത്യേക ‘കടുത്ത കഴുത്ത്’ പ്രയോഗം ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനം
  rationale: עם എന്നത് ഇവിടെ ഉടമ്പടിസമൂഹമായ ‘ജനം’ എന്ന അർഥത്തിലാണ്; സൂചകപദമായ ‘ഈ’ നിലനിർത്തി.
- source_word: רִשְׁעוֹ
  choice: അവരുടെ ദുഷ്ടത
  rationale: ഹീബ്രുവിലെ ഏകവചന പ്രത്യയം ‘ജനം’ എന്ന സമൂഹനാമത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യക്തികളെ സമൂഹമായി പരാമർശിക്കുമ്പോൾ ‘അവരുടെ’ സ്വാഭാവികമാണ്; רשעയുടെ ധാർമിക തിന്മ ‘ദുഷ്ടത’ വ്യക്തമാക്കുന്നു.
- source_word: חַטָּאתוֹ
  choice: അവരുടെ പാപം
  rationale: ഏകവചന പ്രത്യയം സമൂഹമായ ജനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അവരുടെ പാപം’ മലയാളത്തിൽ സ്വാഭാവികവും חטאתയുടെ മൂർത്തമായ ധാർമിക കുറ്റം നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: പിതാക്കന്മാരെ സൂചിപ്പിക്കുന്ന עבד എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അങ്ങയുടെ ദാസന്മാർ
  alternative: അങ്ങയുടെ അടിമകൾ
  rationale: ഇവിടെ പദം അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരുടെ ദൈവബന്ധത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്നു; ബന്ധിത അടിമസ്ഥിതി മുൻനിർത്തുന്നില്ല. അതിനാൽ ‘ദാസന്മാർ’ സന്ദർഭോചിതമാണ്.
- issue: ‘ദുഷ്ടത’, ‘പാപം’ എന്നിവയോടു ചേർന്ന സമൂഹസൂചക ഏകവചന പ്രത്യയങ്ങൾ
  choice: അവരുടെ ദുഷ്ടത ... അവരുടെ പാപം
  alternative: അതിന്റെ ദുഷ്ടത ... അതിന്റെ പാപം
  rationale: ഹീബ്രുവിൽ സമൂഹനാമത്തോടു ഏകവചന പൊരുത്തം സാധാരണമാണ്. മലയാളത്തിൽ മനുഷ്യരുടെ സമൂഹമായ ‘ജനം’ വീണ്ടും സൂചിപ്പിക്കുമ്പോൾ ബഹുവചനമായ ‘അവരുടെ’ കൂടുതൽ സ്വാഭാവികമാണ്; ഇതിൽ ദൈവശാസ്ത്രപരമായ പുനർവ്യാഖ്യാനം ഇല്ല.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചക പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു: ദൈവത്തെ ‘അങ്ങ്’ എന്നു അഭിസംബോധന ചെയ്യുകയും ‘ഓർക്കണമേ’, ‘ഗൗനിക്കരുതേ’ എന്നീ വിനയപൂർവ രൂപങ്ങൾ സ്വീകരിക്കുകയും ചെയ്തു. വാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും ഹീബ്രു മൂലത്തിലെ മൂന്നു ധാർമിക നാമങ്ങളുടെ നിരയും പ്രാർഥനയിലെ ഗൗരവവും നിലനിർത്തുന്നു.'
