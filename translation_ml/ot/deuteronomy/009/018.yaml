source:
  edition: WLC
  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: ml
  text: പിന്നെ ഞാൻ മുമ്പത്തെപ്പോലെ[a] യഹ്‌വെയുടെ സന്നിധിയിൽ നാല്പതു ദിവസവും നാല്പതു രാത്രിയും വീണുകിടന്നു. ഞാൻ അപ്പം തിന്നുകയോ വെള്ളം കുടിക്കുകയോ ചെയ്തില്ല. യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മ പ്രവർത്തിച്ച് അവിടുത്തെ കോപിപ്പിച്ച നിങ്ങൾ ചെയ്ത സകല പാപം നിമിത്തമായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആദ്യത്തെപ്പോലെ’ അല്ലെങ്കിൽ ‘മുമ്പുപോലെ.’ മോശെ മുമ്പ് യഹ്‌വെയുടെ സന്നിധിയിൽ ചെലവഴിച്ച നാല്പതു ദിവസത്തെ കാലയളവിലേക്കാണ് എബ്രായ പ്രയോഗം വിരൽചൂണ്ടുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: ഞാൻ ... വീണുകിടന്നു
  rationale: ഹിത്പയേൽ രൂപം മോശെ ദൈവസന്നിധിയിൽ തന്നെത്താൻ താഴ്ത്തി വീണുകിടന്ന ഭാവം സൂചിപ്പിക്കുന്നു. ‘വീണുകിടന്നു’ ശരീരഭാവവും ദീർഘമായ മധ്യസ്ഥപ്രാർഥനയുടെ സാഹചര്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സ്ഥല-ബന്ധപരമായ അർഥം ‘സന്നിധിയിൽ’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു; ദൈവനാമം യഹ്‌വെ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: כָּרִאשֹׁנָה
  choice: മുമ്പത്തെപ്പോലെ
  rationale: മോശെയുടെ ആദ്യത്തെ നാല്പതുദിവസത്തെ കാലയളവിലേക്കുള്ള പിന്നോട്ടുള്ള സൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ആദ്യത്തെപ്പോലെ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: നാല്പതു പകലും നാല്പതു രാത്രിയും
  rationale: കാലദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ പരിഭാഷ.
- source_word: לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי
  choice: ഞാൻ അപ്പം തിന്നുകയോ വെള്ളം കുടിക്കുകയോ ചെയ്തില്ല
  rationale: മൂലപാഠത്തിലെ ‘അപ്പം’, ‘വെള്ളം’ എന്നീ വ്യക്തമായ പദങ്ങൾ പൊതുവായ ‘ആഹാരം’ എന്നാക്കി മാറ്റാതെ, മലയാളത്തിലെ സ്വാഭാവിക നിഷേധസമുച്ചയമായി നൽകി.
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: നിങ്ങൾ ചെയ്ത സകല പാപവും നിമിത്തം
  rationale: עַל ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു. ഏകവചനമായ חַטָּאת കൂട്ടായ അർഥത്തിൽ ഉള്ളതിനാൽ ‘സകല പാപവും’ എന്നു നിലനിർത്തി.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്ത്
  rationale: ദൈവിക വിലയിരുത്തൽ സൂചിപ്പിക്കുന്ന ‘ദൃഷ്ടിയിൽ’ എന്ന രൂപകം സംരക്ഷിച്ചുകൊണ്ട്, പ്രവൃത്തിയുടെ സ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: לְהַכְעִיסוֹ
  choice: അവിടുത്തെ കോപിപ്പിച്ച
  rationale: כעס എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരകഭാവം ‘കോപിപ്പിച്ച’ എന്നു നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; ഉദ്ദേശ്യം/ഫലം എന്ന സൂക്ഷ്മത നിർബന്ധമായി ഒന്നിലേക്കു ചുരുക്കിയിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ പദവിയായി മാറ്റാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: לְהַכְעִיסוֹ എന്നതിലെ ഉദ്ദേശ്യം/ഫലം
  choice: അവിടുത്തെ കോപിപ്പിച്ച
  alternative: അവിടുത്തെ കോപിപ്പിക്കാൻ
  rationale: לְ ഘടന ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ അവരുടെ തിന്മ ദൈവകോപത്തിനു കാരണമായി എന്നത് വ്യക്തമായതിനാൽ, ഉദ്ദേശപൂർവം ദൈവത്തെ കോപിപ്പിക്കുകയായിരുന്നു എന്നു നിർബന്ധിക്കാത്ത രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ‘വീണുകിടന്നു’ എന്നത് അതിരുകടന്ന ആചാരപരമായ പദം ചേർക്കാതെ ശരീരഭാവം നിലനിർത്തുന്നു; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു സ്ഥിരമായി നൽകി.
