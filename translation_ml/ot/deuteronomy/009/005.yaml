  text: לֹ֣א בְ/צִדְקָתְ/ךָ֗ וּ/בְ/יֹ֨שֶׁר֙ לְבָ֣בְ/ךָ֔ אַתָּ֥ה בָ֖א לָ/רֶ֣שֶׁת אֶת אַרְצָ֑/ם כִּ֞י בְּ/רִשְׁעַ֣ת הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מוֹרִישָׁ֣/ם מִ/פָּנֶ֔י/ךָ וּ/לְמַ֜עַן הָקִ֣ים אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: ml
  text: നിന്റെ നീതിയാലോ നിന്റെ ഹൃദയത്തിന്റെ നിഷ്കളങ്കതയാലോ അല്ല നീ അവരുടെ ദേശം കൈവശമാക്കാൻ അകത്തു കടക്കുന്നത്; മറിച്ച്, ഈ ജനതകളുടെ ദുഷ്ടത നിമിത്തം നിന്റെ ദൈവമായ യഹ്‌വെ അവരെ നിന്റെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുന്നു[a], കൂടാതെ നിന്റെ പിതാക്കന്മാരായ[c] അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരോടു യഹ്‌വെ സത്യംചെയ്ത വചനം[b] ഉറപ്പിക്കേണ്ടതിനുമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ മുമ്പിൽവെച്ച് അവരുടെ ദേശാവകാശം നഷ്ടപ്പെടുത്തുകയാണ്.” എബ്രായ ക്രിയയ്ക്ക് അവരെ പുറത്താക്കുക എന്നതിനൊപ്പം ദേശത്തിന്റെ ഉടമസ്ഥാവകാശം നഷ്ടപ്പെടുത്തുക എന്ന ഭാവവും ഉണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യഹ്‌വെ സത്യംചെയ്ത വാഗ്ദാനം.” ഇവിടെ “വചനം” എന്ന എബ്രായപദം സത്യപ്രതിജ്ഞയാൽ ഉറപ്പിച്ച വാഗ്ദാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: “നിന്റെ പിതാക്കന്മാർ” എന്നു പറയുന്നത് ഇവിടെ പേരെടുത്തു പറയുന്ന ഗോത്രപിതാക്കന്മാരായ അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരെയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: നിന്റെ നീതികൊണ്ട്
  rationale: ബേത് ഉപസർഗം ഇവിടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു; യിസ്രായേലിന്റെ നീതി ദേശാവകാശത്തിന്റെ അടിസ്ഥാനമല്ലെന്ന നിഷേധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: നിന്റെ ഹൃദയത്തിന്റെ നേരുകൊണ്ട്
  rationale: יֹשֶׁר എന്ന ‘നേര്/നിഷ്കളങ്കത’യും ഹൃദയത്തെക്കുറിച്ചുള്ള എബ്രായ പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בָא לָרֶשֶׁת אֶת אַרְצָם
  choice: അവരുടെ ദേശം കൈവശമാക്കാൻ ചെല്ലുന്നത്
  rationale: בוא + infinitive-ന്റെ പ്രവേശനവും ലക്ഷ്യവും മലയാളത്തിലെ സ്വാഭാവിക ചലനപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: בְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: ഈ ജനതകളുടെ ദുഷ്ടത നിമിത്തം
  rationale: רִשְׁעָה-യുടെ ധാർമ്മിക ദുഷ്ടതയും കാരണാർത്ഥകമായ בְּ-യും വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: അവരെ നിന്റെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുകയാണ്
  rationale: ירשׁ-ന്റെ ഹിഫീൽ രൂപത്തിലെ പുറത്താക്കൽ/അവകാശം നഷ്ടപ്പെടുത്തൽ എന്നീ അർത്ഥവ്യാപ്തികൾക്ക് സ്വാഭാവികമായ മുഖ്യപാഠം നൽകുന്നു; ഉടമസ്ഥാവകാശം നഷ്ടപ്പെടുത്തുന്ന ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וּלְמַעַן הָקִים
  choice: കൂടാതെ ... ഉറപ്പിക്കേണ്ടതിനുമാണ്
  rationale: לְמַעַן എന്ന ഉദ്ദേശ്യഘടകവും הֵקִים എന്ന സ്ഥാപിക്കൽ/ഉറപ്പിക്കൽ ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: സത്യംചെയ്ത വചനം
  rationale: דָּבָר-ന്റെ അടിസ്ഥാനമായ ‘വചനം’ നിലനിർത്തുകയും സത്യപ്രതിജ്ഞാസന്ദർഭത്തിലെ വാഗ്ദാനഭാവം വായനക്കാരന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לַאֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരോട്
  rationale: തുടർന്ന് പേരെടുത്തു പറയുന്ന അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നീ ഗോത്രപിതാക്കന്മാരെയാണ് masculine plural സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ദേശാവകാശത്തിനുള്ള കാരണം
  choice: യിസ്രായേലിന്റെ നീതിയല്ല; ജനതകളുടെ ദുഷ്ടതയും പിതാക്കന്മാരോടുള്ള യഹ്‌വെയുടെ സത്യപ്രതിജ്ഞാബദ്ധമായ വിശ്വസ്തതയും രണ്ടും കാരണങ്ങളായി നിലനിർത്തുന്നു.
  alternative: ജനതകളുടെ ദുഷ്ടതയെയോ ഉടമ്പടിവാഗ്ദാനത്തെയോ മാത്രം ഏക കാരണമാക്കി മുൻനിർത്തുക.
  rationale: כִּי എന്ന കാരണവാക്യവും וּלְמַעַן എന്ന ഉദ്ദേശ്യവാക്യവും മൂലപാഠത്തിൽ വ്യക്തമായി ഒരുമിച്ചുണ്ട്; ഒന്നിനെ മറ്റൊന്നിൽ ലയിപ്പിക്കരുത്.
- issue: יְהוָה എന്ന ദൈവനാമം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയാക്കി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: ‘വചനം’ എന്നതിന്റെ സത്യപ്രതിജ്ഞാസന്ദർഭം
  choice: മുഖ്യപാഠത്തിൽ ‘വചനം’ നിലനിർത്തി, ‘വാഗ്ദാനം’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
  alternative: മുഖ്യപാഠത്തിൽ നേരിട്ട് ‘വാഗ്ദാനം’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: דָּבָר എന്ന പദത്തിന്റെ രൂപപരമായ അടുത്ത അർത്ഥം സംരക്ഷിക്കുമ്പോഴും സത്യപ്രതിജ്ഞയുടെ പശ്ചാത്തലത്തിലുള്ള വാഗ്ദാനസ്വഭാവം മറയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായവാക്യത്തിലെ നിഷേധവും രണ്ട് അനുകൂല കാരണഘടകങ്ങളും വ്യക്തമായി വേർതിരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളുടെ പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
