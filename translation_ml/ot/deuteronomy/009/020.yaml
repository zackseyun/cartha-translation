id: DEU.9.20
reference: Deuteronomy 9:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: ml
  text: യഹ്‌വെ അഹരോനോടും അവനെ നശിപ്പിക്കാൻ അത്യന്തം കോപിച്ചു; ആ സമയത്ത് ഞാൻ അഹരോനുവേണ്ടിയും പ്രാർഥിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: അഹരോനോടും
  rationale: കോപം സൂചിപ്പിക്കുന്ന ക്രിയയോടൊപ്പം בְ ബന്ധത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അഹരോനോട് കോപിച്ചു’ എന്നത് സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്; വാക്യത്തിലെ וּ ഘടകം ‘-ഉം’കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: הִתְאַנַּף ... מְאֹד
  choice: അത്യന്തം കോപിച്ചു
  rationale: Hitpael ക്രിയയുടെ ശക്തമായ കോപഭാവവും מְאֹד എന്ന തീവ്രതാസൂചകവും ചേർത്ത് വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പ്രചാരമുള്ള നേരിട്ടുള്ള ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: לְהַשְׁמִידוֹ
  choice: അവനെ നശിപ്പിക്കത്തക്കവിധം
  rationale: לְ സഹിതമുള്ള Hiphil infinitive കോപത്തിന്റെ ഉദ്ദേശ്യമോ അതിലേക്കുള്ള പ്രവണതയോ സൂചിപ്പിക്കാം. ‘നശിപ്പിക്കത്തക്കവിധം’ ഈ ബന്ധം നിലനിർത്തുന്നു; നാശത്തിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: וָאֶתְפַּלֵּל
  choice: ഞാൻ ... പ്രാർഥിച്ചു
  rationale: פלל എന്ന ക്രിയയുടെ Hitpael രൂപത്തിന്റെ സാധാരണ അർഥമായ ‘പ്രാർഥിക്കുക’ നേരിട്ട് നിലനിർത്തുന്നു; മധ്യസ്ഥപ്രാർഥന എന്ന ആശയം തുടർന്നുള്ള בְּעַד വ്യക്തമാക്കുന്നു.
- source_word: גַּם בְּעַד אַהֲרֹן
  choice: അഹരോനുവേണ്ടിയും
  rationale: גַּם എന്ന കൂട്ടിച്ചേർക്കൽ ‘-ഉം’കൊണ്ടും בְּעַד എന്ന മധ്യസ്ഥതാസൂചക ബന്ധം ‘വേണ്ടി’കൊണ്ടും സ്വാഭാവികമായി പകരുന്നു.
- source_word: בָּעֵת הַהִוא
  choice: ആ സമയത്ത്
  rationale: ചർച്ചയിലുള്ള സംഭവകാലത്തേക്കു തിരിഞ്ഞു സൂചിപ്പിക്കുന്ന ഹീബ്രു കാലപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം നാമത്തിന്റെ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- issue: ദൈവകോപവും നശിപ്പിക്കാനുള്ള ഉദ്ദേശ്യവും തമ്മിലുള്ള ബന്ധം
  choice: അവനെ നശിപ്പിക്കത്തക്കവിധം അത്യന്തം കോപിച്ചു
  alternative: അവനെ നശിപ്പിക്കാൻ തീരുമാനിച്ചു; അവനെ നശിപ്പിക്കുമാറ് കോപിച്ചു
  rationale: לְ infinitive ഉദ്ദേശ്യമോ ഫലദിശയോ സൂചിപ്പിക്കാവുന്നതിനാൽ ദൈവിക തീരുമാനത്തിന്റെ ഘട്ടത്തെക്കുറിച്ച് മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർണ്ണയിക്കാതെ അതിലെ ഗൗരവവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അഹരോനോടും’ എന്ന പ്രയോഗം മുൻസന്ദർഭത്തോടുള്ള കൂട്ടിച്ചേർക്കൽ നിലനിർത്തുന്നു. ഈ ഭാഷയിൽ ‘അഹരോനോട് കോപിച്ചു’ സ്വാഭാവികമായതിനാൽ ഇംഗ്ലീഷിലുള്ള ‘with/against’ വ്യത്യാസത്തിനായി പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
