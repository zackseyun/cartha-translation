source:
  edition: WLC
  text: שְׁמַ֣ע יִשְׂרָאֵ֗ל אַתָּ֨ה עֹבֵ֤ר הַ/יּוֹם֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִמֶּ֑/ךָּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצֻרֹ֖ת בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: ml
  text: 'ഇസ്രായേലേ, കേൾക്കുക: നിന്നെക്കാൾ വലുതും ശക്തവുമായ ജനതകളെ പുറത്താക്കാൻ[a] നീ ഇന്ന് യോർദാൻ കടന്ന് അകത്തു ചെല്ലുന്നു; അവയ്ക്കുള്ള വലിയ നഗരങ്ങൾ ആകാശത്തോളം[b] ഉയരത്തിൽ കോട്ടകെട്ടിയവയാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ ദേശം കൈവശമാക്കാൻ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് ‘കൈവശമാക്കുക’ എന്നും ‘മുൻനിവാസികളെ പുറത്താക്കി കൈവശപ്പെടുത്തുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായയിൽ അക്ഷരാർഥത്തിൽ “ആകാശത്തോളം”; നഗരങ്ങളുടെ കോട്ടമതിലുകളുടെ അത്യധികമായ ഉയരവും ശക്തിയും സൂചിപ്പിക്കുന്ന അതിശയോക്തിപരമായ പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע
  choice: കേൾക്കുക
  rationale: ഏകവചന ആജ്ഞാരൂപം ഇസ്രായേലിനെ ഒരു സമൂഹമായി അഭിസംബോധന ചെയ്യുന്നു. ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടിപരമായ ആഹ്വാനത്തിന്റെ സ്വരം നിലനിർത്തുന്നു.
- source_word: עֹבֵר הַיּוֹם
  choice: നീ ഇന്ന് ... കടന്ന് ... ചെല്ലുകയാണ്
  rationale: വർത്തമാനകൃദന്തവും ‘ഇന്ന്’ എന്ന സമയസൂചനയും ചേർന്ന് ഉടൻ നടക്കാനിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶת־הַיַּרְדֵּן
  choice: യോർദാൻ
  rationale: ഭൂമിശാസ്ത്രപരമായ പേരിന്റെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണം; മൂലത്തിൽ ഇല്ലാത്ത ‘നദി’ ചേർത്തിട്ടില്ല.
- source_word: לָבֹא
  choice: അകത്തു ചെല്ലാൻ
  rationale: യോർദാൻ കടന്ന് ദേശത്തിനകത്തേക്കു പ്രവേശിക്കുന്ന ദിശാഭാവം പ്രകടമാക്കുന്നു.
- source_word: לָרֶשֶׁת
  choice: അവിടെനിന്ന് നീക്കിക്കളയാൻ
  rationale: ഇവിടെ ക്രിയയുടെ നേരിട്ടുള്ള കർമം ‘ജനതകൾ’ ആയതിനാലും പശ്ചാത്തലം ദേശജയമായതിനാലും മുൻനിവാസികളെ പുറത്താക്കുക എന്ന അർഥം സന്ദർഭോചിതമാണ്; കൈവശമാക്കുക എന്ന അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: גּוֹיִם
  choice: ജനതകൾ
  rationale: വ്യത്യസ്ത ദേശീയ-ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: നിന്നെക്കാൾ വലുതും ശക്തവുമായ
  rationale: വലുപ്പം/പ്രാധാന്യം, ശക്തി എന്നീ രണ്ട് താരതമ്യഗുണങ്ങളും നേരിട്ടുള്ള താരതമ്യവും നിലനിർത്തുന്നു.
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת
  choice: കോട്ടകെട്ടിയ വലിയ നഗരങ്ങൾ
  rationale: നഗരങ്ങളുടെ വലുപ്പവും ഉറപ്പുള്ള പ്രതിരോധസംവിധാനവും ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: בַּשָּׁמָיִם
  choice: ആകാശത്തോളം ഉയരത്തിൽ
  rationale: അതീവ ഉയരമുള്ള കോട്ടകളെ വിവരിക്കുന്ന മൂലത്തിലെ അതിശയോക്തിപരമായ ദൃശ്യഭാഷ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: നഗരമതിലുകളുടെ അതിശയോക്തിപരമായ വിവരണം
  choice: ‘ആകാശത്തോളം ഉയരത്തിൽ കോട്ടകെട്ടിയ’ എന്ന മൂലദൃശ്യം നിലനിർത്തി
  alternative: ‘വളരെ ഉയരത്തിൽ കോട്ടകെട്ടിയ’ എന്ന് വിശദീകരിച്ച് പരത്തുക
  rationale: പ്രയോഗം അക്ഷരാർഥത്തിലുള്ള അവകാശവാദമായി നിർബന്ധിക്കാതെയും അതിന്റെ ശക്തമായ അലങ്കാരഭാഷ ദുർബലമാക്കാതെയും സംരക്ഷിക്കുന്നു.
- issue: ירשׁ എന്ന ക്രിയയിലെ കൈവശപ്പെടുത്തൽ/പുറത്താക്കൽ അർഥവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘ജനതകളെ അവിടെനിന്ന് നീക്കിക്കളയാൻ’
  alternative: ‘അവരുടെ ദേശം കൈവശമാക്കാൻ’
  rationale: നേരിട്ടുള്ള കർമം ജനതകളായതിനാൽ പുറത്താക്കൽ എന്ന അർഥം വാക്യഘടനയോടു നന്നായി ചേരുന്നു; എങ്കിലും കൈവശപ്പെടുത്തൽ എന്ന യഥാർഥ പദാർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഇസ്രായേലേ, കേൾക്കുക’ എന്ന ആഹ്വാനം മൂലത്തിലെ ഉടമ്പടിസ്വരം നിലനിർത്തുന്നു. ദീർഘമായ എബ്രായ വാക്യത്തിലെ നഗരവിവരണം അർദ്ധവിരാമംകൊണ്ട് വ്യക്തമായി ബന്ധിപ്പിച്ചു.
