  to: 'ഇസ്രായേലേ, കേൾക്കുക: നിന്നെക്കാൾ വലുതും ശക്തവുമായ ജനതകളെ പുറത്താക്കാൻ[a] നീ ഇന്ന് യോർദാൻ കടന്ന് അകത്തു ചെല്ലുന്നു; അവയ്ക്കുള്ള വലിയ നഗരങ്ങൾ ആകാശത്തോളം[b] ഉയരത്തിൽ കോട്ടകെട്ടിയവയാണ്.'
