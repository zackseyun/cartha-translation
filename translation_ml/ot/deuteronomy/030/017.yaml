base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/017.yaml
  text: But if your heart turns away[a], and you do not listen, and you are drawn away and bow down to other gods and serve them[b],
translation:
  language: ml
  text: എന്നാൽ നിന്റെ ഹൃദയം പിന്തിരിയുകയും[a] നീ കേട്ടനുസരിക്കാതിരിക്കുകയും നീ വഴിതെറ്റിക്കപ്പെടുകയും അന്യദേവന്മാരെ കുമ്പിട്ട് അവരെ സേവിക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ ഹൃദയം തിരിയുകയും’ എന്നും പരിഭാഷപ്പെടുത്താം. സന്ദർഭത്തിൽ ഈ തിരിയൽ യഹോവയോടുള്ള വിശ്വസ്തതയിൽനിന്നുള്ള പിന്മാറ്റമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … ചെയ്താൽ
  rationale: മുൻപുള്ള ആഹ്വാനത്തിന് വിപരീതമായ നിബന്ധന അവതരിപ്പിക്കുന്നതിനാൽ, ഹീബ്രു സംയോജകത്തിന്റെ സന്ദർഭപരമായ വിരുദ്ധഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִפְנֶה לְבָבְךָ
  choice: നിന്റെ ഹൃദയം പിന്തിരിയുകയും
  rationale: പנה എന്ന ക്രിയയിലെ തിരിയുക എന്ന ദൃശ്യവും യഹോവയോടുള്ള വിശ്വസ്തതയിൽനിന്നുള്ള ആന്തരിക പിന്മാറ്റവും നിലനിർത്തുന്നു.
- source_word: וְלֹא תִשְׁמָע
  choice: നീ കേട്ടനുസരിക്കാതിരിക്കുകയും
  rationale: שׁמע എന്ന പദത്തിന്റെ ‘കേൾക്കുക’ എന്നും ഉടമ്പടിസന്ദർഭത്തിലെ ‘അനുസരിക്കുക’ എന്നും ഉള്ള അർത്ഥവ്യാപ്തി ഒരുമിച്ച് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְנִדַּחְתָּ
  choice: നീ വഴിതെറ്റിക്കപ്പെടുകയും
  rationale: നിഫാൽ രൂപത്തിലെ ബാഹ്യപ്രേരിതമോ നിഷ്ക്രിയമോ ആയ വഴിമാറ്റം നിലനിർത്തുന്നു; സ്വമേധയാ വഴിതെറ്റുന്നു എന്ന് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: കുമ്പിട്ട്
  rationale: ആരാധനയെ സൂചിപ്പിക്കുന്ന ശരീരപ്രവൃത്തിയായ കുനിഞ്ഞു വണങ്ങൽ സംക്ഷിപ്തവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരെ
  rationale: ആവർത്തനപുസ്തകത്തിലെ മത്സരദേവതകളെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: וַעֲבַדְתָּם
  choice: അവരെ സേവിക്കുകയും
  rationale: עבד എന്ന പദത്തിന്റെ സേവനം എന്ന അടിസ്ഥാനാർഥവും ഇവിടെ അതിനുള്ള ആരാധനാപരമായ ഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശ്വാസത്യാഗത്തിന്റെ ഘട്ടാനുഘട്ടമായ വിവരണം
  choice: ഹൃദയം പിന്തിരിയുക, കേട്ടനുസരിക്കാതിരിക്കുക, വഴിതെറ്റിക്കപ്പെടുക, അന്യദേവന്മാരെ കുമ്പിടുക, അവരെ സേവിക്കുക എന്ന ക്രമം നിലനിർത്തി.
  alternative: ‘വഴിതെറ്റിക്കപ്പെടുക’ എന്നത് ‘നിന്നെത്തന്നെ വഴിതെറ്റാൻ അനുവദിക്കുക’ എന്നു സജീവഭാവത്തിൽ വ്യാഖ്യാനിക്കുക; അല്ലെങ്കിൽ שׁמע എന്നത് ‘അനുസരിക്കുക’ എന്നു മാത്രം നൽകുക.
  rationale: ഹീബ്രു വാക്യം ഉടമ്പടിയിലെ അവിശ്വസ്തതയുടെ വളരുന്ന ക്രമം അവതരിപ്പിക്കുന്നു. കാരണകർത്തൃത്വത്തെക്കുറിച്ചോ മനോഭാവത്തെക്കുറിച്ചോ മൂലപാഠം പറയുന്നതിലും അധികം ചേർക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. തുടർന്നുവരുന്ന ഫലവാക്യവുമായി ബന്ധിപ്പിക്കുന്നതിനായി വാക്യം നിബന്ധനാസൂചകമായ ‘ചെയ്താൽ’ എന്നും അർധവിരാമമല്ല, കോമയോടെയും അവസാനിപ്പിച്ചു. ‘കേട്ടനുസരിക്കുക’ ശ്രവണവും അനുസരണവും ഉൾക്കൊള്ളുന്ന ഉടമ്പടിഭാവം സംരക്ഷിക്കുന്നു.
