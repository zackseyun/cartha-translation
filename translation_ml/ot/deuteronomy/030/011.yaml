source:
  edition: WLC
  text: כִּ֚י הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לֹֽא נִפְלֵ֥את הִוא֙ מִמְּ/ךָ֔ וְ/לֹ֥א רְחֹקָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്ന ഈ കല്പന നിനക്കു അതീതമായതല്ല[a]; അതു അകലെയുമല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ കഴിവിനപ്പുറമുള്ളതല്ല’ അല്ലെങ്കിൽ ‘നിനക്കു മറഞ്ഞിരിക്കുന്നതല്ല.’ എബ്രായ ക്രിയയ്ക്ക് അസാധാരണം, അപ്രാപ്യം, അല്ലെങ്കിൽ ഒരാളുടെ എത്തിപ്പിടിക്കലിനും ഗ്രഹണത്തിനും അതീതം എന്നിങ്ങനെ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള പ്രബോധനത്തിന്റെ കാരണം അഥവാ വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധപദമായി സ്വാഭാവികമായി യോജിക്കുന്നു.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: ഈ കല്പന
  rationale: മִצְוָה എന്ന പദത്തിന്റെ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്ന
  rationale: മോശെയുടെ ഇപ്പോഴത്തെ അഭിസംബോധനയുടെ അടിയന്തരതയും ‘ഇന്ന്’ എന്ന സമയസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  choice: നിനക്കു ഗ്രഹിക്കാനാവാത്തതല്ല
  rationale: פלא എന്ന ക്രിയയുടെ അസാധാരണമായത്, കൈവരാത്തത്, ഒരാളുടെ ഗ്രഹണപരിധിക്കപ്പുറമുള്ളത് എന്നീ സാധ്യതകളിൽ, തുടർന്നുള്ള ‘വിദൂരവുമല്ല’ എന്ന സമാന്തരപ്രയോഗത്തോടു ചേർന്ന് പ്രായോഗികമായ പ്രാപ്യതയെ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ അനുസരിക്കാനുള്ള സമ്പൂർണ മനുഷ്യശേഷിയെക്കുറിച്ചുള്ള വിശാലമായ സിദ്ധാന്തവാദം ഉന്നയിക്കാതെ അർഥം നൽകുന്നു.
- source_word: וְלֹא רְחֹקָה הִוא
  choice: അതു വിദൂരവുമല്ല
  rationale: רָחוֹק എന്ന പദത്തിലെ അകലം എന്ന രൂപകം നിലനിർത്തുകയും തുടർന്നുള്ള വാക്യങ്ങളിലെ പ്രാപ്യതയുടെ ആശയവുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: נִפְלֵאת എന്ന പദവും മനുഷ്യന്റെ ഉടമ്പടി അനുസരണശേഷിയും തമ്മിലുള്ള ബന്ധം
  choice: ‘നിനക്കു ഗ്രഹിക്കാനാവാത്തതല്ല’ എന്ന് പരിഭാഷപ്പെടുത്തി കല്പന അപ്രാപ്യമോ ഗ്രഹണാതീതമോ അല്ലെന്ന സന്ദർഭോചിതമായ ഊന്നൽ നിലനിർത്തി.
  alternative: ‘നിന്റെ കഴിവിനപ്പുറമുള്ളതല്ല’ അല്ലെങ്കിൽ ‘നിനക്കു മറഞ്ഞിരിക്കുന്നതല്ല’
  rationale: ഈ വാക്യം കല്പനയുടെ സമീപ്യതയും പ്രാപ്യതയും ഊന്നുന്നു; സഹായമില്ലാത്ത മനുഷ്യന്റെ ധാർമികശേഷിയെക്കുറിച്ച് വിപുലമായ ഒരു ഉപദേശനിഗമനം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ ךָ നിലനിർത്താൻ ‘നിന്നോടു/നിനക്കു’ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ആവർത്തനവും പ്രാപ്യത-അകലം എന്ന സമാന്തരതയും സംരക്ഷിച്ചു.
