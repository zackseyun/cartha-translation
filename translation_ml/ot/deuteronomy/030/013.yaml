source:
  edition: WLC
  text: וְ/לֹֽא מֵ/עֵ֥בֶר לַ/יָּ֖ם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲבָר לָ֜/נוּ אֶל עֵ֤בֶר הַ/יָּם֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
translation:
  language: ml
  text: അത് കടലിനപ്പുറത്തുമല്ല[a]; “നമുക്കുവേണ്ടി ആർ കടലിന്റെ മറുകരയിലേക്കു കടന്നുചെന്ന് അതു നമുക്കു കൊണ്ടുവന്ന്[b] നമുക്കു കേൾപ്പിച്ചുതരും[c], അങ്ങനെ നാം അതു ചെയ്യേണ്ടതിന്?” എന്നു നിങ്ങൾ പറയേണ്ടതുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കടലിന്റെ മറുകരയിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അതു നമുക്കായി എടുക്കുക’; ഇവിടെ അതു കൈവശപ്പെടുത്തി നമ്മുടെ അടുക്കൽ കൊണ്ടുവരുക എന്നാണ് സന്ദർഭാർഥം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘നമ്മെ അതു കേൾപ്പിക്കുക’; അതായത്, അതു നമ്മോടു പ്രഖ്യാപിക്കുകയോ വിശദീകരിക്കുകയോ ചെയ്യുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  choice: കടലിനപ്പുറം
  rationale: കടലിന്റെ മറുവശത്തുള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം. ‘കടലിനപ്പുറം’ സ്ഥലപരമായ രൂപകം നിലനിർത്തുകയും സ്വാഭാവികമായ മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: הִוא
  choice: അത്
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുൻസന്ദർഭത്തിലെ ‘കല്പന’യെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യാകരണലിംഗം അടയാളപ്പെടുത്താതെ ‘അത്’ എന്നു നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: לֵאמֹר
  choice: എന്നു നിങ്ങൾ ചോദിക്കേണ്ടതില്ല
  rationale: സങ്കൽപ്പിതമായ എതിർചോദ്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടനയാണ്. മുൻപുള്ള നിഷേധത്തോടു ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി രൂപപ്പെടുത്തി.
- source_word: יַעֲבָר לָנוּ אֶל עֵבֶר הַיָּם
  choice: നമുക്കുവേണ്ടി ആർ കടലിന്റെ മറുകരയിലേക്കു കടന്നുചെന്ന്
  rationale: ‘നമുക്കുവേണ്ടി’ എന്ന ഗുണഭോക്തൃഭാവവും മറുകരയിലേക്കുള്ള ചലനവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: അതു നമുക്കു കൊണ്ടുവന്ന്
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ ആണെങ്കിലും, ഇവിടെ കല്പനയെ കൈവശപ്പെടുത്തി കേൾവിക്കാർക്കരികിലേക്കു കൊണ്ടുവരുന്നതാണ് സന്ദർഭാർഥം.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: നമ്മെ അതു കേൾപ്പിക്കും
  rationale: שׁמע എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണരൂപം നേരിട്ട് നിലനിർത്തുന്നു; ‘പ്രഖ്യാപിക്കുക’ അല്ലെങ്കിൽ ‘വിശദീകരിക്കുക’ എന്നൊരു വ്യാഖ്യാനം മാത്രം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കുന്നില്ല.
- source_word: וְנַעֲשֶׂנָּה
  choice: അങ്ങനെ നാം അതു ചെയ്യും
  rationale: കേൾക്കുന്നതിനെ തുടർന്നുള്ള പ്രവർത്തനത്തെ ലളിതമായി പ്രകടിപ്പിക്കുന്നു; ‘അനുസരിക്കുക’ എന്ന സന്ദർഭാർഥം സാധുവാണെങ്കിലും, മുഖ്യപാഠത്തിൽ എബ്രായത്തിലെ ‘ചെയ്യുക’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ചെയ്യുക’ എന്നതിന്റെ അനുസരണാർഥം
  choice: നാം അതു ചെയ്യും
  alternative: നാം അത് അനുസരിക്കും
  rationale: നിയമപരമായ സന്ദർഭത്തിൽ ‘ചെയ്യുക’ അനുസരണത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, എബ്രായക്രിയയുടെ തുറന്ന രൂപം നിലനിർത്താൻ കൂടുതൽ ഔപചാരികമായ വിവർത്തനം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ സ്ഥലരൂപകം, കാരണക്രിയ, ‘ചെയ്യുക’ എന്ന തുറന്ന പ്രയോഗം എന്നിവ സാധ്യമായത്ര നിലനിർത്തിയപ്പോൾ വാക്യഘടന മലയാളവായനയ്ക്ക് യോജിച്ചവിധം ക്രമപ്പെടുത്തി.
