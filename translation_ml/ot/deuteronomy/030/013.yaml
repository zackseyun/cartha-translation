    issue: The quotation is introduced as a question the audience need not ask.
    rationale: לֵאמֹר introduces what they might say. ‘ചോദിക്കേണ്ടതില്ല’ makes the act of questioning primary, whereas the source says ‘you should say,’ followed by a question.
  - severity: low
    issue: ‘അതുകൊണ്ട്’ adds an explicit inferential connection.
    rationale: The Hebrew construction is more directly rendered by ‘എന്നു നിങ്ങൾ പറയേണ്ടതുമില്ല’; the revised form avoids adding a logical connective not present in the wording.
