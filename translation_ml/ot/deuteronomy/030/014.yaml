  yaml_path: translation/ot/deuteronomy/030/014.yaml
  text: For the word is very near you[a], in your mouth and in your heart, so that you may do it.
translation:
  language: ml
  text: കാരണം, ആ വചനം നിനക്ക് വളരെ അടുത്താണ്[a]—അത് നിന്റെ വായിലും നിന്റെ ഹൃദയത്തിലുമുണ്ട്—നീ അത് ചെയ്യേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ കാര്യം’ എന്നോ ‘ആ കല്പന’ എന്നോ വിവർത്തനം ചെയ്യാം. ഹീബ്രു דָּבָר എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് വചനം, കാര്യം, കല്പന എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിന്റെ വിശദീകരണവും അടിസ്ഥാനവും അവതരിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קָרוֹב אֵלֶיךָ
  choice: നിനക്ക് ഏറ്റവും അടുത്താണ്
  rationale: സാമീപ്യം നേരിട്ട് നിലനിർത്തുന്നു; מְאֹד എന്ന തീവ്രതയും ‘ഏറ്റവും’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הַדָּבָר
  choice: ആ വചനം
  rationale: സന്ദർഭത്തിലെ ദൈവിക കല്പനയെ സൂചിപ്പിക്കുമ്പോഴും, ‘കാര്യം’ അല്ലെങ്കിൽ ‘കല്പന’ എന്നു അർഥം ചുരുക്കാതെ ഹീബ്രു പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: בְּפִיךָ
  choice: നിന്റെ വായിൽ
  rationale: സംസാരത്തിന്റെ ശരീരാധിഷ്ഠിതമായ മൂലചിത്രവും വായ്–ഹൃദയം സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: וּבִלְבָבְךָ
  choice: നിന്റെ ഹൃദയത്തിലും
  rationale: ചിന്തയും ഇച്ഛയും ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം പരമ്പരാഗതവും സ്വാഭാവികവുമായ ‘ഹൃദയം’ കൊണ്ട് നൽകുന്നു.
- source_word: לַעֲשֹׂתוֹ
  choice: നീ അത് അനുഷ്ഠിക്കേണ്ടതിന്
  rationale: ലക്ഷ്യാർഥം വ്യക്തമാക്കുകയും, ഇവിടെ ഉദ്ദേശിക്കുന്നത് കേവലം ഒരു പ്രവൃത്തി ചെയ്യുക എന്നതല്ല, പറഞ്ഞിരിക്കുന്ന വചനം അനുസരിച്ച് പ്രവർത്തിക്കുക എന്നതാണെന്ന് സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘വചനം’ എന്നതിന്റെ സൂചിതാർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ആ വചനം’ എന്നു വിശാലമായി നിലനിർത്തി.
  alternative: ‘ആ കല്പന’ അല്ലെങ്കിൽ ‘ആ കാര്യം’
  rationale: അടുത്ത സന്ദർഭം ദൈവത്തിന്റെ കല്പനയെക്കുറിച്ചാണെങ്കിലും דָּבָר എന്ന പദം അതിനേക്കാൾ വിശാലമാണ്; അതിനാൽ പ്രധാനപാഠം സൂചിതാർഥത്തെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- issue: לַעֲשֹׂתוֹ എന്നതിലെ ലക്ഷ്യബന്ധം
  choice: ‘നീ അത് അനുഷ്ഠിക്കേണ്ടതിന്’
  alternative: ‘അത് അനുഷ്ഠിക്കാൻ’
  rationale: വചനം വായിലും ഹൃദയത്തിലും അടുത്തിരിക്കുന്നതും അതനുസരിച്ചുള്ള പ്രവൃത്തിയും തമ്മിലുള്ള ലക്ഷ്യബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു; കഴിവിനെയോ ദൈവശാസ്ത്രപരമായ പ്രാപ്തിയെയോ പാഠത്തിൽ ഇല്ലാത്തവിധം വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നിനക്ക്/നിന്റെ/നീ’ നിലനിർത്തി. വായ്–ഹൃദയം എന്ന മൂലപാഠത്തിലെ സമാന്തര ദൃശ്യവും വാക്യത്തിന്റെ വിശദീകരണസ്വഭാവവും സംരക്ഷിച്ചു.
