  source_fidelity: മുഖ്യപാഠം എബ്രായത്തിലെ പുനഃസ്ഥാപനപ്രയോഗവും കരുണയും ചിതറിക്കപ്പെട്ട ജനത്തിൽനിന്നുള്ള പുനസ്സമാഹരണവും വിശ്വസ്തമായി നൽകുന്നു. എന്നാൽ സ്ഥലസൂചനയായ שָׁמָּהയെ കൂടുതൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കാൻ ‘...ചിതറിച്ച എല്ലാ ജനവിഭാഗങ്ങളിൽനിന്നും’ എന്ന ഘടന ഉചിതമാണ്.
