  terminology: ‘യഹോവ,’ ‘കരുണ കാണിക്കും,’ ‘സ്ഥിതി പുനഃസ്ഥാപിക്കും,’ ‘വീണ്ടും ഒരുമിച്ചുകൂട്ടും’ എന്നിവ യോജിച്ച ആധുനിക-മാന്യമായ പ്രയോഗങ്ങളാണ്. അക്ഷരാർഥ അടിക്കുറിപ്പ് മുഖ്യപാഠത്തിലെ ഇടിയത്തിന്റെ അർത്ഥം മാറ്റാതെ കൂടുതൽ കൃത്യമായി രൂപപ്പെടുത്തിയിരിക്കുന്നു.
