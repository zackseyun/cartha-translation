- from: അപ്പോൾ നിന്റെ ദൈവമായ യഹോവ നിന്റെ സ്ഥിതി പുനഃസ്ഥാപിക്കുകയും നിന്നോടു കരുണ കാണിക്കുകയും ചെയ്യും.[a] നിന്റെ ദൈവമായ യഹോവ നിന്നെ ചിതറിച്ചുകളഞ്ഞ സകല ജനവിഭാഗങ്ങളുടെയും ഇടയിൽനിന്ന് അവൻ നിന്നെ വീണ്ടും ഒരുമിച്ചുകൂട്ടും.[b][c]
  to: അപ്പോൾ നിന്റെ ദൈവമായ യഹോവ നിന്റെ സ്ഥിതി പുനഃസ്ഥാപിക്കുകയും നിന്നോടു കരുണ കാണിക്കുകയും ചെയ്യും.[a] നിന്റെ ദൈവമായ യഹോവ നിന്നെ ചിതറിച്ച എല്ലാ ജനവിഭാഗങ്ങളിൽനിന്നും[c] അവൻ നിന്നെ വീണ്ടും[b] ഒരുമിച്ചുകൂട്ടും.
  rationale: മുഖ്യ അർത്ഥത്തിൽ മാറ്റമില്ല. സ്ഥലസൂചനയെ സ്വാഭാവികമാക്കി, വിവാദസാധ്യതയുള്ള രണ്ടാമത്തെ וְשָׁב-നോടുള്ള അടിക്കുറിപ്പ് ‘വീണ്ടും’ എന്ന പദത്തിൽ നങ്കൂരമിട്ടു, ‘ജനതകൾ’ എന്ന പദവികല്പത്തിന്റെ അടിക്കുറിപ്പ് അതിന്റെ അനുബന്ധ പദത്തിനടുത്താക്കി. ആദ്യ അടിക്കുറിപ്പിൽ വാക്യത്തിലെ കരുണാഭാഗം ചേർക്കാതെ שׁוּב אֶת־שְׁבוּתְךָ എന്ന പ്രയോഗത്തെ മാത്രം വിശദീകരിക്കുന്നു.
