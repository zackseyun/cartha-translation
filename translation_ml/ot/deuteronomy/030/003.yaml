source:
  edition: WLC
  text: וְ/שָׁ֨ב יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת שְׁבוּתְ/ךָ֖ וְ/רִחֲמֶ֑/ךָ וְ/שָׁ֗ב וְ/קִבֶּצְ/ךָ֙ מִ/כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֧ר הֱפִֽיצְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/003.yaml
  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
translation:
  language: ml
  text: അപ്പോൾ നിന്റെ ദൈവമായ യഹോവ നിന്റെ സ്ഥിതി പുനഃസ്ഥാപിക്കുകയും നിന്നോടു കരുണ കാണിക്കുകയും ചെയ്യും.[a] നിന്റെ ദൈവമായ യഹോവ നിന്നെ ചിതറിച്ച എല്ലാ ജനവിഭാഗങ്ങളിൽനിന്നും[c] അവൻ നിന്നെ വീണ്ടും[b] ഒരുമിച്ചുകൂട്ടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “നിന്റെ പ്രവാസാവസ്ഥ തിരികെ വരുത്തും.” ഈ എബ്രായ പ്രയോഗം ദുരിതത്തിലോ പ്രവാസത്തിലോ ആയ ഒരാളുടെ സ്ഥിതി പുനഃസ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “അവൻ മടങ്ങിവന്ന് നിന്നെ ഒരുമിച്ചുകൂട്ടും.”
    reason: alternative_reading
  - marker: c
    text: “എല്ലാ ജനതകളിൽനിന്നും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുവേ പരിചിതമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁב אֶת שְׁבוּתְךָ
  choice: നിന്റെ സ്ഥിതി പുനഃസ്ഥാപിക്കും
  rationale: ഈ എബ്രായ പ്രയോഗം ദുരവസ്ഥയെയോ പ്രവാസാവസ്ഥയെയോ മാറ്റി സൗഖ്യസ്ഥിതിയിലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള വാക്യഭാഗം പ്രവാസത്തിൽനിന്നുള്ള ഒരുമിച്ചുകൂട്ടൽ പ്രത്യേകം പറയുന്നതിനാൽ ‘സ്ഥിതി പുനഃസ്ഥാപിക്കും’ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְרִחֲמֶךָ
  choice: നിന്നോടു കരുണ കാണിക്കും
  rationale: רחם സൂചിപ്പിക്കുന്ന ആർദ്രമായ കരുണയും ദയയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְשָׁב וְקִבֶּצְךָ
  choice: നിന്നെ വീണ്ടും ഒരുമിച്ചുകൂട്ടും
  rationale: രണ്ടാമത്തെ שָׁב അടുത്ത ക്രിയയോടൊപ്പം ‘വീണ്ടും’ എന്ന അർത്ഥത്തിൽ വായിക്കാം; ചിതറിപ്പോയ ജനത്തെ പുനഃസമാഹരിക്കുന്ന ആശയം ‘ഒരുമിച്ചുകൂട്ടും’ വ്യക്തമാക്കുന്നു.
- source_word: מִכָּל הָעַמִּים
  choice: സകല ജനവിഭാഗങ്ങളുടെയും ഇടയിൽനിന്ന്
  rationale: עַמִּים എന്ന ബഹുവചനം വിവിധ ജനസമൂഹങ്ങളെയോ ജനതകളെയോ സൂചിപ്പിക്കാം; ‘ജനവിഭാഗങ്ങൾ’ അതിന്റെ കൂട്ടായ-വംശീയ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: הֱפִיצְךָ
  choice: നിന്നെ ചിതറിച്ചുകളഞ്ഞ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണകർത്തൃബോധവും പ്രവാസസന്ദർഭത്തിലെ ചിതറിക്കലിന്റെ ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: שָׁמָּה
  choice: ഇടയിൽ
  rationale: അക്ഷരാർഥം ‘അവിടെ’ എന്നാണെങ്കിലും മലയാളത്തിലെ ബന്ധവാക്യത്തിൽ ‘...ഇടയിൽനിന്ന്’ എന്ന ഘടന സ്ഥലസൂചന സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: שׁוּב אֶת־שְׁבוּת എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: നിന്റെ സ്ഥിതി പുനഃസ്ഥാപിക്കും
  alternative: നിന്റെ പ്രവാസാവസ്ഥ മാറ്റും / നിന്റെ ബന്ധനം മടക്കിവരുത്തും
  rationale: ഇത് ദുരവസ്ഥയുടെ തിരിച്ചുമാറ്റത്തെ സൂചിപ്പിക്കുന്ന അംഗീകൃത എബ്രായ പ്രയോഗമാണ്. ‘ബന്ധനം മടക്കിവരുത്തും’ എന്ന അക്ഷരാനുവാദം മലയാളത്തിൽ അവ്യക്തവും തെറ്റിദ്ധരിപ്പിക്കുന്നതുമാകാം; പ്രവാസികളായ ജനത്തെ ഒരുമിച്ചുകൂട്ടുന്നത് അടുത്ത ഭാഗത്ത് പ്രത്യേകം പറയുന്നു.
- issue: രണ്ടാമത്തെ וְשָׁב എന്നതിന്റെ വ്യാകരണബലം
  choice: വീണ്ടും ഒരുമിച്ചുകൂട്ടും
  alternative: അവൻ മടങ്ങിവന്ന് നിന്നെ ഒരുമിച്ചുകൂട്ടും
  rationale: എബ്രായം സ്വതന്ത്രക്രിയയായ ‘മടങ്ങിവരും’ എന്നും അടുത്ത ക്രിയയെ വിശേഷിപ്പിക്കുന്ന ‘വീണ്ടും’ എന്നും വായിക്കാൻ ഇടനൽകുന്നു. മുഖ്യപാഠം സ്വാഭാവികമായ രണ്ടാമത്തെ വായന സ്വീകരിക്കുകയും മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘യഹോവ’ എന്ന ഉടമ്പടിനാമം നിലനിർത്തി; അപൂർവമായ അക്ഷരാനുവാദത്തിനു പകരം എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർത്ഥം മുഖ്യപാഠത്തിൽ നൽകി, യഥാർഥ വ്യത്യസ്ത വായനകൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
