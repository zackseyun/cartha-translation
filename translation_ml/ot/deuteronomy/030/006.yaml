source:
  edition: WLC
  text: וּ/מָ֨ל יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת לְבָבְ/ךָ֖ וְ/אֶת לְבַ֣ב זַרְעֶ֑/ךָ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ לְמַ֥עַן חַיֶּֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ നിന്റെ ഹൃദയത്തെയും നിന്റെ സന്തതിയുടെ ഹൃദയത്തെയും[a] പരിച്ഛേദനം ചെയ്യും[b]. അങ്ങനെ, നീ നിന്റെ ദൈവമായ യഹോവയെ മുഴുവൻ ഹൃദയത്തോടും മുഴുവൻ പ്രാണനോടും[c] സ്നേഹിക്കാനും ജീവിക്കാനും ഇടയാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ പിൻതലമുറക്കാരുടെ ഹൃദയത്തെയും.’
    reason: lexical_alternative
  - marker: b
    text: ‘ഹൃദയം പരിച്ഛേദനം ചെയ്യുക’ എന്നത് ആന്തരിക പരിവർത്തനത്തെയും ഉടമ്പടിയോടുള്ള സമർപ്പണത്തെയും സൂചിപ്പിക്കുന്ന രൂപകമാണ്.
    reason: cultural_note
  - marker: c
    text: ഇവിടെയുള്ള എബ്രായപദം ‘ജീവൻ’ എന്നോ ‘മുഴുവൻ സ്വയം’ എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָל
  choice: പരിച്ഛേദനം ചെയ്യും
  rationale: മൂലപദത്തിന്റെ അക്ഷരാർഥവും ഉടമ്പടിചിഹ്നവുമായി ബന്ധപ്പെട്ട രൂപകവും നിലനിർത്തുന്നു; ‘മാറ്റും’ എന്ന പരാവർത്തനം ഈ ദൃശ്യത്തെ നഷ്ടപ്പെടുത്തും.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: לְבָבְךָ
  choice: നിന്റെ ഹൃദയം
  rationale: ഇവിടെ ‘ഹൃദയം’ വികാരം മാത്രമല്ല, ഇച്ഛയും ചിന്തയും ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലും ഈ രൂപകവ്യാപ്തി സ്വാഭാവികമാണ്.
- source_word: לְבַב זַרְעֶךָ
  choice: നിന്റെ സന്തതിയുടെ ഹൃദയം
  rationale: זֶרַע എന്ന കൂട്ടസങ്കൽപ്പമുള്ള ഏകവചനത്തിന് ‘സന്തതി’ സ്വാഭാവികവും അർഥസമ്പന്നവുമായ മലയാള സമാനപദമാണ്.
- source_word: לְאַהֲבָה
  choice: അങ്ങനെ ... സ്നേഹിക്കുകയും
  rationale: לְ ചേർന്ന infinitive ഇവിടെ ദൈവിക പ്രവർത്തനത്തിന്റെ ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെ’ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בְּכָל לְבָבְךָ
  choice: പൂർണഹൃദയത്തോടെ
  rationale: മുഴുവൻ ആന്തരിക സമർപ്പണത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּבְכָל נַפְשְׁךָ
  choice: പൂർണപ്രാണനോടുംകൂടെ
  rationale: נֶפֶשׁ ജീവൻ, സ്വയം, പ്രാണൻ എന്നീ അർഥവ്യാപ്തിയുള്ളതാണ്. ‘പ്രാണൻ’ പരമ്പരാഗത അനുനാദം നിലനിർത്തുമ്പോഴും ശരീരത്തിൽനിന്നു വേർപെട്ട ഘടകമെന്ന ആശയം നിർബന്ധിക്കുന്നില്ല; കുറിപ്പിൽ മറ്റു സാധ്യതകൾ വ്യക്തമാക്കുന്നു.
- source_word: לְמַעַן חַיֶּיךָ
  choice: ജീവിക്കുകയും ചെയ്യും
  rationale: לְמַעַן ഇവിടെ ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്നു. മുൻപത്തെ ഉദ്ദേശ്യബന്ധത്തോട് ചേർത്ത് ‘അങ്ങനെ ... ജീവിക്കുകയും ചെയ്യും’ എന്നു നൽകുന്നത് മലയാളത്തിൽ ഒഴുക്കുള്ളതും മൂലത്തിന്റെ ഫലസൂചന നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: ഹൃദയത്തിന്റെ പരിച്ഛേദനം എന്ന ഉടമ്പടിരൂപകം
  choice: ‘നിന്റെ ഹൃദയത്തെ ... പരിച്ഛേദനം ചെയ്യും’ എന്ന രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
  alternative: ‘നിന്റെ ഹൃദയത്തെ മാറ്റും’ അല്ലെങ്കിൽ ‘ശുദ്ധീകരിക്കും’.
  rationale: ദൈവം വരുത്തുന്ന ആന്തരിക പരിവർത്തനത്തെ ഉടമ്പടിയുടെ ബാഹ്യചിഹ്നവുമായി ബന്ധിപ്പിക്കുന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു; അതിനെ ഒരു പ്രത്യേക പിൽക്കാല സിദ്ധാന്തമായി വിശദീകരിക്കുന്നില്ല.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ മനുഷ്യസ്വഭാവസംബന്ധിയായ വ്യാപ്തി
  choice: മുഖ്യവാചകത്തിൽ ‘പ്രാണൻ’ ഉപയോഗിച്ചു.
  alternative: ‘ജീവൻ’ അല്ലെങ്കിൽ ‘മുഴുവൻ സ്വയം’.
  rationale: സമ്പൂർണ സമർപ്പണത്തിന്റെ ഭാഷ നിലനിർത്തുന്നു; പദം നിർബന്ധമായും ശരീരത്തിൽനിന്നു വേർപെട്ട അമൂർത്ത ‘ആത്മാവ്’ മാത്രമാണെന്ന വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- issue: ലക്ഷ്യമോ ഫലമോ എന്ന ബന്ധം
  choice: ‘അങ്ങനെ ... സ്നേഹിക്കുകയും ജീവിക്കുകയും ചെയ്യും’ എന്നു നൽകി.
  alternative: ‘സ്നേഹിക്കേണ്ടതിന് ... നീ ജീവിക്കേണ്ടതിന്’.
  rationale: ലാമെദ് infinitive-ഉം לְמַעַן-ഉം ലക്ഷ്യത്തെയും ഫലത്തെയും ഉൾക്കൊള്ളാൻ കഴിയും. മലയാളവാചകം രണ്ടിന്റെയും ബന്ധം തുറന്നുവെക്കുന്നു; കർശനമായ ഒരേയൊരു കാരണക്രമം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദൈവനാമത്തിന് ‘യഹോവ’ ഉപയോഗിച്ചു. ഉടമ്പടിസംബന്ധിയായ കേന്ദ്രരൂപകം പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തി; അപരിചിതത്വം അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
