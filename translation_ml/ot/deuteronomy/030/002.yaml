  text: וְ/שַׁבְתָּ֞ עַד יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ וְ/שָׁמַעְתָּ֣ בְ/קֹל֔/וֹ כְּ/כֹ֛ל אֲשֶׁר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם אַתָּ֣ה וּ/בָנֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
translation:
  language: ml
  text: നീ നിന്റെ ദൈവമായ യഹ്‌വെയിലേക്കു മടങ്ങിവരികയും, ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്നതെല്ലാം അനുസരിച്ച് അവിടുത്തെ വാക്കു കേട്ടനുസരിക്കുകയും, നീയും നിന്റെ മക്കളും നിന്റെ പൂർണഹൃദയത്തോടും പൂർണപ്രാണനോടുംകൂടെ അങ്ങനെ ചെയ്യുകയും ചെയ്താൽ[a][b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അവിടുത്തെ ശബ്ദം കേൾക്കുക’; ഈ ഹീബ്രു പ്രയോഗത്തിന് സാധാരണയായി ‘കേട്ടനുസരിക്കുക’ എന്ന ശക്തമായ അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ‘നിന്റെ പുത്രന്മാർ’; ഈ ഉടമ്പടിസന്ദർഭത്തിൽ സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കാവുന്നതിനാൽ ‘നിന്റെ മക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: c
    text: ‘പൂർണപ്രാണനോടെ’ എന്നതിനു പിന്നിലെ ഹീബ്രുപദത്തിന് ‘മുഴുവൻ ജീവൻകൊണ്ടും’ അല്ലെങ്കിൽ ‘മുഴുവൻ വ്യക്തിത്വത്തോടുംകൂടെ’ എന്നും അർഥമുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתָּ עַד יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെയിലേക്കു മടങ്ങിവന്ന്
  rationale: שׁוּב എന്നതിന്റെ അടിസ്ഥാനമായ ‘മടങ്ങുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ഉടൻതന്നെ കൂടുതൽ സങ്കുചിതമായ ‘മാനസാന്തരപ്പെടുക’ എന്ന ദൈവശാസ്ത്രപദം ചുമത്തുന്നില്ല. עַד ഇവിടെ ഒരാളിലേക്കുള്ള മടങ്ങിവരവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  choice: അവിടുത്തെ വാക്കു കേട്ടനുസരിക്കുമ്പോൾ
  rationale: ‘ശബ്ദം/സ്വരം കേൾക്കുക’ എന്ന ഹീബ്രു ദൃശ്യവും അനുസരണത്തിന്റെ പ്രയോഗാർഥവും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כְּכֹל אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്നതെല്ലാം അനുസരിച്ച്
  rationale: കല്പനകളുടെ സമഗ്രമായ വ്യാപ്തിയും ‘ഇന്ന്’ എന്ന കാലസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: אַתָּה וּבָנֶיךָ
  choice: നീയും നിന്റെ മക്കളും
  rationale: בָּנִים എന്ന പുല്ലിംഗ ബഹുവചനം ഈ ഉടമ്പടിസന്ദർഭത്തിൽ സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കാം; ‘മക്കൾ’ ആ വ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּכָל לְבָבְךָ
  choice: പൂർണഹൃദയത്തോടെ
  rationale: ‘നിന്റെ മുഴുവൻ ഹൃദയത്തോടുംകൂടെ’ എന്ന ആശയം സംക്ഷിപ്തവും പ്രചാരമുള്ളതുമായ മലയാളപ്രയോഗത്തിൽ നൽകുന്നു; ഹൃദയം ഇച്ഛയും ആന്തരിക വ്യക്തിത്വവും ഉൾക്കൊള്ളുന്നു.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: പൂർണമനസ്സോടെ
  rationale: נֶפֶשׁ ഇവിടെ ജീവൻ, സ്വയം, മുഴുവൻ വ്യക്തിത്വം എന്നീ അർഥവ്യാപ്തിയുള്ള പദമാണ്. മലയാളത്തിലെ ‘മനസ്സ്’ ഹൃദയത്തോടൊപ്പമുള്ള സമഗ്ര സമർപ്പണസൂത്രത്തിൽ സ്വാഭാവികമാണെങ്കിലും മറ്റു വിവർത്തനങ്ങൾക്കും സാധ്യതയുണ്ട്; അത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בָנֶיךָ എന്നതിന്റെ വ്യാപ്തി
  choice: നിന്റെ മക്കൾ
  alternative: നിന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രു പുല്ലിംഗ ബഹുവചനം കുടുംബ-ഉടമ്പടി പശ്ചാത്തലത്തിൽ സന്തതികളെ പൊതുവായി ഉൾക്കൊള്ളാൻ കഴിയും; പുരുഷസന്തതികളിലേക്കു മാത്രം അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ മനുഷ്യശാസ്ത്രപരമായ വ്യാപ്തി
  choice: മനസ്സ്
  alternative: പ്രാണൻ; ജീവൻ; മുഴുവൻ വ്യക്തിത്വം
  rationale: ഒറ്റ സാങ്കേതിക ദ്വൈതവാദ അർഥം ചുമത്താതെ സമഗ്രമായ വ്യക്തിസമർപ്പണം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മൂലപദത്തിന്റെ യഥാർഥ ബഹുവ്യഞ്ജകത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരവോടെയും ഗൗരവത്തോടെയും ഉള്ള ബൈബിൾഭാഷ. ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്’ രൂപം ഉപയോഗിച്ചു. വാക്യം 30:1-ൽ ആരംഭിക്കുന്ന നിബന്ധനാത്മക ഘടനയുടെ തുടർച്ചയായതിനാൽ അവസാനം പൂർണവിരാമത്തിനു പകരം കോമ നിലനിർത്തി. അടിക്കുറിപ്പു ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട ഉപവാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
