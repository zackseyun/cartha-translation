source:
  edition: WLC
  text: אִם יִהְיֶ֥ה נִֽדַּחֲ/ךָ֖ בִּ/קְצֵ֣ה הַ/שָּׁמָ֑יִם מִ/שָּׁ֗ם יְקַבֶּצְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וּ/מִ/שָּׁ֖ם יִקָּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
translation:
  language: ml
  text: നിന്റെ ചിതറിപ്പോയവർ[a] ആകാശത്തിന്റെ അറ്റത്താണെങ്കിലും, അവിടെനിന്ന് നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ ഒരുമിച്ചുകൂട്ടും; അവിടെനിന്ന് അവൻ നിന്നെ എടുക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിന്റെ പുറത്താക്കപ്പെട്ടവർ’ അല്ലെങ്കിൽ ‘നിന്റെ നാടുകടത്തപ്പെട്ടവർ.’ എബ്രായപദം ഓടിച്ചുകളയപ്പെട്ടവരെയോ ചിതറിക്കപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘അവൻ നിന്നെ കൊണ്ടുവരും.’ എബ്രായ ക്രിയ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘എടുക്കും’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִהְיֶה
  choice: ആയിരുന്നാലും
  rationale: ഇവിടെ വ്യവസ്ഥ അത്യന്തം വിദൂരമായ ഒരു സാധ്യതയെ ഊന്നുന്നതിനാൽ, സാധാരണ ‘ആണെങ്കിൽ’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ആയിരുന്നാലും’ ഉപയോഗിച്ചു; വ്യവസ്ഥയുടെ അർഥം നിലനിൽക്കുന്നു.
- source_word: נִדַּחֲךָ
  choice: നിന്റെ പുറത്താക്കപ്പെട്ടവർ
  rationale: נדח എന്ന ധാതുവിലെ ഓടിച്ചുകളയപ്പെട്ടതോ ചിതറിക്കപ്പെട്ടതോ ആയ അവസ്ഥ സംരക്ഷിക്കുന്നു. എബ്രായത്തിലെ ഏകവചനരൂപം ഇസ്രായേലിനെ സമൂഹമായി അഭിസംബോധന ചെയ്യുന്ന കൂട്ടായ അർഥമുള്ളതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: בִּקְצֵה הַשָּׁמָיִם
  choice: ആകാശത്തിന്റെ അറ്റത്ത്
  rationale: ഏറ്റവും വിദൂരമായ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: എബ്രായത്തിലെ ആവർത്തനം ഊന്നലിനായി രണ്ടു പ്രാവശ്യവും നിലനിർത്തി.
- source_word: יְקַבֶּצְךָ
  choice: നിന്നെ ഒരുമിച്ചുകൂട്ടും
  rationale: קבץ എന്ന ക്രിയയുടെ ‘കൂട്ടിച്ചേർക്കുക’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘തിരികെ’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെ
  rationale: ദൈവനാമമായ יהוה ശീർഷകമാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהֶיךָ എന്ന ഉടമ്പടിസംബന്ധമായ വിശേഷണം സ്വാഭാവിക മലയാളക്രമത്തിൽ ചേർത്തു.
- source_word: וּמִשָּׁם יִקָּחֶךָ
  choice: അവിടെനിന്ന് അവൻ നിന്നെ കൂട്ടിക്കൊണ്ടുവരും
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണ്; എന്നാൽ ആളെ ഒരു സ്ഥലത്തുനിന്ന് ലക്ഷ്യസ്ഥാനത്തേക്ക് എടുക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘കൂട്ടിക്കൊണ്ടുവരും’ എന്നു പറഞ്ഞു. കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ, സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണത്തിനനുസരിച്ച് ലിപ്യന്തരിച്ചു.
- issue: ഇസ്രായേലിനോടുള്ള കൂട്ടായ ഏകവചന അഭിസംബോധന
  choice: ‘നിന്റെ/നിന്നെ’ എന്ന ഏകവചന അഭിസംബോധന നിലനിർത്തി; പുറത്താക്കപ്പെട്ട അംഗങ്ങളെ മലയാളത്തിൽ ബഹുവചനമായി പറഞ്ഞു
  alternative: എല്ലാം വ്യക്തമായ ബഹുവചന അഭിസംബോധനയാക്കുക
  rationale: എബ്രായത്തിലെ ഉടമ്പടിസംബന്ധമായ കൂട്ടായ ഏകവചനത്തെ സംരക്ഷിക്കുമ്പോഴും, നാടുകളിലായി ചിതറിപ്പോയ ആളുകളെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. ‘ആകാശത്തിന്റെ അറ്റം’ എന്ന മൂലരൂപം സംരക്ഷിക്കുകയും അതിന്റെ ശൈലീപ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു. വാക്യത്തിലെ ‘അവിടെനിന്ന്’ എന്ന ആവർത്തനം എബ്രായത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു.
