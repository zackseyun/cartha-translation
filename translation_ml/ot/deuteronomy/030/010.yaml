source:
  edition: WLC
  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר מִצְוֺתָי/ו֙ וְ/חֻקֹּתָ֔י/ו הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּ֑ה כִּ֤י תָשׁוּב֙ אֶל יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/010.yaml
  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവയുടെ വാക്ക് അനുസരിച്ച്, ഈ ന്യായപ്രമാണപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന അവന്റെ കൽപ്പനകളും ചട്ടങ്ങളും പാലിക്കുകയും, പൂർണ്ണഹൃദയത്തോടും പൂർണ്ണാത്മാവോടുംകൂടെ നിന്റെ ദൈവമായ യഹോവയിങ്കലേക്കു മടങ്ങിവരുകയും ചെയ്താൽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്താൽ
  rationale: മുൻവാക്യത്തിലെ വാഗ്ദാനവുമായി ബന്ധപ്പെടുന്ന വ്യവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: תִשְׁמַע בְּקוֹל
  choice: വാക്കു കേട്ടനുസരിച്ച്
  rationale: കേവലം കേൾക്കുക എന്നതിലുപരി പറയുന്നതു ശ്രദ്ധിച്ച് അനുസരിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: לִשְׁמֹר
  choice: പാലിക്കുകയും
  rationale: യഹോവയുടെ വാക്ക് അനുസരിക്കുന്നതിന്റെ ഉള്ളടക്കമായി കല്പനകളും ചട്ടങ്ങളും കാത്തുപാലിക്കുന്നതു വ്യക്തമാക്കുന്നു.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  choice: അവന്റെ കല്പനകളും ചട്ടങ്ങളും
  rationale: നിയമസന്ദർഭത്തിലെ വ്യത്യസ്തമായ രണ്ടു പദവിഭാഗങ്ങളും മലയാളത്തിൽ വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: ഈ ന്യായപ്രമാണപുസ്തകത്തിൽ
  rationale: നിയമം ഉൾക്കൊള്ളുന്ന ഉടമ്പടിരേഖ എന്ന അർഥം സ്വാഭാവികവും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי תָשׁוּב אֶל
  choice: മടങ്ങിവരുകയും ചെയ്താൽ
  rationale: שׁוּב എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ തിരിഞ്ഞു മടങ്ങുക എന്ന രൂപകം സൂക്ഷിക്കുകയും പശ്ചാത്താപത്തിന്റെ ആശയം വ്യാഖ്യാനമായി മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ
  choice: പൂർണഹൃദയത്തോടും പൂർണമനസ്സോടുംകൂടെ
  rationale: മുഴുവൻ ആന്തരിക വ്യക്തിത്വത്തോടെയുള്ള സമർപ്പണം സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിസന്ദർഭത്തിലെ שׁוּב എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: മടങ്ങിവരുക
  alternative: മാനസാന്തരപ്പെടുക / തിരിഞ്ഞുവരുക
  rationale: മൂലപദത്തിലെ മടങ്ങിവരൽരൂപകവും ഉടമ്പടിയിലേക്കുള്ള പുനഃസ്ഥാപനത്തിന്റെ സൂചനയും സൂക്ഷിക്കുന്നു; പശ്ചാത്താപം എന്ന വ്യാഖ്യാനത്തിലേക്ക് അർഥത്തെ ഒതുക്കുന്നില്ല.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിതമായ രൂപത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യം മുൻസന്ദർഭത്തെ ആശ്രയിക്കുന്ന വ്യവസ്ഥാവാക്യമാണെന്ന ഘടന നിലനിർത്തിയിരിക്കുന്നു.
