source:
  edition: WLC
  text: אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לָ/לֶ֣כֶת בִּ/דְרָכָ֔י/ו וְ/לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו וּ/מִשְׁפָּטָ֑י/ו וְ/חָיִ֣יתָ וְ/רָבִ֔יתָ וּ/בֵֽרַכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בָּ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
translation:
  language: ml
  text: 'ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്നത് ഇതാണ്: നിന്റെ ദൈവമായ യഹോവയെ സ്നേഹിക്കുക, അവന്റെ വഴികളിൽ നടക്കുക, അവന്റെ കല്പനകളും ചട്ടങ്ങളും ന്യായവിധികളും[a] പാലിക്കുക. അങ്ങനെ നീ ജീവിച്ചു പെരുകും[b]; നീ അതു കൈവശമാക്കാനായി അവിടേക്കു പ്രവേശിക്കുന്ന ദേശത്ത് നിന്റെ ദൈവമായ യഹോവ നിന്നെ അനുഗ്രഹിക്കും.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ന്യായവിധികൾ’ എന്നതിന് ‘വിധിവിധാനങ്ങൾ’ അഥവാ ‘നിയമങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം (מִשְׁפָּטָיו).
    reason: lexical_alternative
  - marker: b
    text: ഇത് ‘നീ ജീവിച്ചു പെരുകേണ്ടതിന്; നിന്റെ ദൈവമായ യഹോവ നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്’ എന്നും മനസ്സിലാക്കാം. എബ്രായ ക്രിയാശൃംഖല ഫലമായോ വാഗ്ദാനമായോ വ്യാഖ്യാനിക്കാവുന്നതാണ്.
    reason: alternative_reading
  - marker: c
    text: എബ്രായത്തിൽ ‘അവിടേക്കു’ എന്ന ദിശാസൂചകപദം (שָׁמָּה) ഉണ്ട്. കൂടുതൽ സുഗമമായി ഇതിനെ ‘നീ കൈവശമാക്കാൻ പ്രവേശിക്കുന്ന ദേശത്ത്’ എന്നും പറയാം.
    reason: lexical_alternative
  - marker: d
    text: ‘അതു കൈവശമാക്കാനായി’ എന്നതിന്, പ്രത്യേകിച്ച് ദേശവാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ, ‘അതു അവകാശമായി ലഭിക്കാനായി’ എന്നും പരിഭാഷപ്പെടുത്താം (לְרִשְׁתָּהּ).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്നത് ഇതാണ്
  rationale: ആശ്രിതബന്ധം സൂചിപ്പിക്കുന്ന אֲשֶׁר എന്ന പദത്തിന്റെ ബന്ധം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായി കല്പനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. വർത്തമാനകാലപ്രയോഗം participial രൂപത്തിന്റെ ഉടനടിയുള്ള പ്രസക്തി സൂക്ഷിക്കുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവ
  rationale: יהוה എന്ന ദൈവനാമം പദവിനാമംകൊണ്ട് പകരാതെ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്തു; אֱלֹהֶיךָ എന്നത് ഏകവചന അഭിസംബോധനയോടെ ‘നിന്റെ ദൈവമായ’ എന്നു നൽകി.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: അവന്റെ വഴികളിൽ നടക്കുക
  rationale: ജീവിതനടപ്പിനെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും സ്വാഭാവികമായതിനാൽ ‘നടക്കുക’ എന്നു നിലനിർത്തി.
- source_word: לִשְׁמֹר
  choice: പാലിക്കുക
  rationale: ഉടമ്പടി-നിയമസന്ദർഭത്തിൽ അനുസരിച്ച് ആചരിക്കുക എന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  choice: അവന്റെ കല്പനകളും ചട്ടങ്ങളും ന്യായവിധികളും
  rationale: മൂന്ന് വ്യത്യസ്ത നിയമപദങ്ങളുടെ വേർതിരിവ് കഴിയുന്നത്ര നിലനിർത്തുന്നു; מִשְׁפָּטִים എന്നതിലെ ന്യായപരമായ ഭാവം ‘ന്യായവിധികൾ’ സൂക്ഷിക്കുന്നു.
- source_word: וְחָיִיתָ וְרָבִיתָ
  choice: അങ്ങനെ നീ ജീവിച്ചു പെരുകും
  rationale: മുൻപുള്ള അനുസരണത്തിന്റെ ഫലം എന്ന ബന്ധം ‘അങ്ങനെ’ വ്യക്തമാക്കുന്നു; അതേസമയം തുടർന്നുള്ള ക്രിയാശൃംഖലയിലെ വാഗ്ദാനസ്വഭാവം ഭാവികാലത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാനായി
  rationale: ദേശത്തെ സ്വന്താധീനത്തിലാക്കുക എന്ന അടിസ്ഥാന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഭൂവാഗ്ദാനസന്ദർഭത്തിലെ ‘അവകാശമായി ലഭിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിനാമമായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: അനുസരണത്തിനു ശേഷമുള്ള ക്രിയകളുടെ ഫലം/വാഗ്ദാനം എന്ന ബന്ധം
  choice: ‘അങ്ങനെ’ എന്ന ഫലബന്ധത്തോടുകൂടിയ ഭാവികാലപ്രസ്താവന
  alternative: ‘നീ ജീവിച്ചു പെരുകേണ്ടതിന് ... അനുഗ്രഹിക്കട്ടെ’ എന്ന ഉദ്ദേശ്യ/സാധ്യതാപരമായ വായന
  rationale: എബ്രായത്തിലെ തുടർച്ചയായ ക്രിയാരൂപങ്ങൾ ഫലമായോ വാഗ്ദാനമായോ ഗ്രഹിക്കാം. മുഖ്യപാഠം രണ്ടും ഭാഗികമായി ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു; മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമപരമായ മൂന്ന് പദങ്ങളുടെ വ്യത്യാസവും ‘വഴികളിൽ നടക്കുക’ എന്ന മൂലരൂപകവും സംരക്ഷിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ’ നിലനിർത്തി; അനാവശ്യമായ പഴയ ഭാഷാരൂപങ്ങൾ ഒഴിവാക്കി.
