revisions:
- from: 'ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്നത് ഇതാണ്: നിന്റെ ദൈവമായ യഹോവയെ സ്നേഹിക്കുക, അവന്റെ വഴികളിൽ നടക്കുക, അവന്റെ കല്പനകളും ചട്ടങ്ങളും ന്യായവിധികളും[a] പാലിക്കുക. അങ്ങനെ നീ ജീവിച്ചു പെരുകും[b]; നീ കൈവശമാക്കാനായി[c][d] പ്രവേശിക്കുന്ന ദേശത്ത് നിന്റെ ദൈവമായ യഹോവ നിന്നെ അനുഗ്രഹിക്കും.'
  to: 'ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്നത് ഇതാണ്: നിന്റെ ദൈവമായ യഹോവയെ സ്നേഹിക്കുക, അവന്റെ വഴികളിൽ നടക്കുക, അവന്റെ കല്പനകളും ചട്ടങ്ങളും ന്യായവിധികളും[a] പാലിക്കുക. അങ്ങനെ നീ ജീവിച്ചു പെരുകും[b]; നീ അതു കൈവശമാക്കാനായി അവിടേക്കു പ്രവേശിക്കുന്ന ദേശത്ത് നിന്റെ ദൈവമായ യഹോവ നിന്നെ അനുഗ്രഹിക്കും.[c][d]'
  rationale: അവസാന ഉപവാക്യത്തിൽ എബ്രായത്തിലെ ദിശാസൂചകമായ שָׁמָּהയും ലְרִשְׁתָּהּയിലെ ഭൂമിയെ സൂചിപ്പിക്കുന്ന പ്രത്യയവും ‘അവിടേക്കു’ എന്നും ‘അതു’ എന്നും ചേർത്ത് സംരക്ഷിച്ചു. നിയമപദത്തിന്റെ അടിക്കുറിപ്പിലെ അസ്വാഭാവിക ബദൽ മാറ്റി. മറ്റു ഘടകങ്ങൾ ഉറവിടത്തോടും ആധുനിക നിലവാരമലയാളത്തിന്റെ ശൈലിയോടും യോജിക്കുന്നതിനാൽ നിലനിർത്തി.
