  to: നിന്റെ ദൈവമായ യഹോവയെ സ്നേഹിച്ചും, അവന്റെ ശബ്ദം കേട്ടും[a], അവനോടു മുറുകെപ്പറ്റിനിന്നും[b] ഇരിക്കുക. കാരണം അവനാണ് നിന്റെ ജീവനും നിന്റെ ആയുസ്സിന്റെ ദൈർഘ്യവും. നിന്റെ പിതാക്കന്മാരായ[c] അബ്രാഹാമിനും യിസ്ഹാക്കിനും യാക്കോബിനും കൊടുക്കാമെന്ന് യഹോവ സത്യംചെയ്ത ദേശത്ത് നീ പാർക്കേണ്ടതിനാണിത്.
