  text: לְ/אַֽהֲבָה֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֥עַ בְּ/קֹל֖/וֹ וּ/לְ/דָבְקָה ב֑/וֹ כִּ֣י ה֤וּא חַיֶּ֨י/ךָ֙ וְ/אֹ֣רֶךְ יָמֶ֔י/ךָ לָ/שֶׁ֣בֶת עַל הָ/אֲדָמָ֗ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֶ֛י/ךָ לְ/אַבְרָהָ֛ם לְ/יִצְחָ֥ק וּֽ/לְ/יַעֲקֹ֖ב לָ/תֵ֥ת לָ/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവയെ സ്നേഹിച്ചും, അവന്റെ ശബ്ദം കേട്ടും[a], അവനോടു മുറുകെപ്പറ്റിനിന്നും[b] ഇരിക്കുക. കാരണം അവനാണ് നിന്റെ ജീവനും നിന്റെ ആയുസ്സിന്റെ ദൈർഘ്യവും. നിന്റെ പിതാക്കന്മാരായ[c] അബ്രാഹാമിനും യിസ്ഹാക്കിനും യാക്കോബിനും കൊടുക്കാമെന്ന് യഹോവ സത്യംചെയ്ത ദേശത്ത് നീ പാർക്കേണ്ടതിനാണിത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവന്റെ വാക്ക് അനുസരിച്ചും.’ ‘അവന്റെ ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിൽ ശ്രദ്ധിച്ചു കേൾക്കുകയും അനുസരിക്കുകയും ചെയ്യുക എന്ന അർഥം പലപ്പോഴും ഉൾപ്പെടുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവനോടു പറ്റിച്ചേർന്നും.’'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: ‘നിന്റെ പൂർവികർ.’ എന്നാൽ ഉടനെ അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരെ പേരെടുത്തുപറയുന്നതിനാൽ എബ്രായത്തിലെ ‘പിതാക്കന്മാർ’ എന്ന രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה
  choice: സ്നേഹിച്ചും
  rationale: മുൻവാക്യത്തിലെ ‘ജീവൻ തിരഞ്ഞെടുക്കുക’ എന്ന ആഹ്വാനം എങ്ങനെ നടപ്പാക്കണമെന്ന് വിശദീകരിക്കുന്ന לְ-യോടുകൂടിയ infinitive construct ആണിത്; മലയാളത്തിൽ തുടർച്ചയും മാർഗവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  choice: അവന്റെ ശബ്ദം കേട്ടും
  rationale: ‘ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യത നിലനിർത്തുന്നു; അനുസരണത്തിന്റെ അന്തർധ്വനി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּלְדָבְקָה בוֹ
  choice: അവനോടു പറ്റിച്ചേർന്നും
  rationale: דבק എന്നതിലെ അടുത്ത ബന്ധം, ഉറച്ച ചേർച്ച, വിശ്വസ്തത എന്നിവ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי הוּא חַיֶּיךָ
  choice: കാരണം അവനാണ് നിന്റെ ജീവൻ
  rationale: הוּא എന്ന സർവനാമത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ വ്യക്തിപരമായ സൂചന യഹോവയിലേക്കാണ്; ‘ജീവന്റെ ഉറവിടം’ എന്നു വിശദീകരിച്ച് മൂലവാക്യം വികസിപ്പിക്കുന്നില്ല.
- source_word: וְאֹרֶךְ יָמֶיךָ
  choice: നിന്റെ ആയുസ്സിന്റെ ദൈർഘ്യം
  rationale: എബ്രായത്തിലെ ‘നിന്റെ ദിവസങ്ങളുടെ ദൈർഘ്യം’ എന്ന ആശയം മനസ്സിലാകുന്ന ഔപചാരിക മലയാളത്തിൽ നൽകുന്നു; വെറും ‘ദീർഘായുസ്സ്’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: לָשֶׁבֶת עַל הָאֲדָמָה
  choice: ദേശത്ത് നീ പാർക്കേണ്ടതിന്
  rationale: വാഗ്ദത്തഭൂമിയുടെ പ്രാദേശിക അർഥം കാത്തുസൂക്ഷിക്കാൻ ‘ദേശം’ എന്നും, താമസത്തിന്റെ ഉടമ്പടിസംബന്ധിയായ ഭാവം നിലനിർത്താൻ ‘പാർക്കുക’ എന്നും ഉപയോഗിക്കുന്നു.
- source_word: לַאֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാർ
  rationale: തുടർന്ന് അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരെ വ്യക്തമായി പേരെടുത്തുപറയുന്നതിനാൽ മൂലത്തിലെ പുരുഷലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: לָתֵת לָהֶם
  choice: അവർക്കു കൊടുക്കുമെന്ന്
  rationale: ദേശം പിതാക്കന്മാർക്കു കൊടുക്കുമെന്ന സത്യവാഗ്ദാനത്തിന്റെ ലക്ഷ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അവനാണ് നിന്റെ ജീവൻ’ എന്നതിലെ സർവനാമത്തിന്റെ സൂച്യം
  choice: ‘അവൻ’ യഹോവയെ സൂചിപ്പിക്കുന്നു.
  alternative: മുൻപറഞ്ഞ സ്നേഹം, കേൾവി, ചേർച്ച എന്നിവ ഉൾപ്പെടുന്ന ഉടമ്പടി അനുസരണത്തിന്റെ വഴിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
  rationale: വ്യാകരണപരമായും സന്ദർഭപരമായും ഏറ്റവും സമീപവും പ്രധാനവുമായ വ്യക്തിപരമായ മുൻപദം ‘നിന്റെ ദൈവമായ യഹോവ’യാണ്. എങ്കിലും അനുസരണത്തിന്റെ വഴിയിലൂടെ ജീവൻ ലഭിക്കുന്നു എന്ന വിശാലമായ സന്ദർഭബന്ധം പരിഭാഷ ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിലെ ആഹ്വാനത്തെ തുടർന്നുവരുന്നതാണെങ്കിലും ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അർഥം വ്യക്തമാകാൻ ‘ഇരിക്കുക’ എന്നും അവസാനത്തിൽ ‘ഇതാണു’ എന്ന സൂചനയും ഉപയോഗിച്ചു. ദൈവനാമം ‘യഹോവ’യായി നിലനിർത്തി; മതവിഭാഗവിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
