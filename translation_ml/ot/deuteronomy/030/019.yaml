  text: הַעִידֹ֨תִי בָ/כֶ֣ם הַ/יּוֹם֮ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָרֶץ֒ הַ/חַיִּ֤ים וְ/הַ/מָּ֨וֶת֙ נָתַ֣תִּי לְ/פָנֶ֔י/ךָ הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה וּ/בָֽחַרְתָּ֙ בַּֽ/חַיִּ֔ים לְמַ֥עַן תִּחְיֶ֖ה אַתָּ֥ה וְ/זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/019.yaml
  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
translation:
  language: ml
  text: 'ഇന്ന് ഞാൻ ആകാശത്തെയും ഭൂമിയെയും നിനക്കെതിരേ സാക്ഷ്യം വഹിക്കാൻ വിളിച്ചുനിർത്തുന്നു[a]: ജീവനും മരണവും, അനുഗ്രഹവും ശാപവും ഞാൻ നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്നു. നീയും നിന്റെ സന്തതിയും[b] ജീവിക്കേണ്ടതിന് ജീവൻ തിരഞ്ഞെടുക്കുക.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപ്രയോഗത്തിന് നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവമുണ്ട്: ആകാശവും ഭൂമിയും നിനക്കെതിരേ സാക്ഷ്യം വഹിക്കാൻ വിളിക്കപ്പെടുന്നു.'
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘നിന്റെ പിൻതലമുറയും’; എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിന്റെ വിത്തും’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: നിനക്കെതിരേ സാക്ഷികളാക്കുന്നു
  rationale: הפעיל രൂപത്തിനും בָכֶם എന്ന പ്രയോഗത്തിനും ഇവിടെയുള്ള നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ അർഥം നിലനിർത്തുന്നു; ഇത് വെറും ‘മുന്നറിയിപ്പു നൽകുന്നു’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ആകാശത്തെയും ഭൂമിയെയും
  rationale: ഉടമ്പടിയുടെ സാക്ഷികളെ വിളിച്ചുനിർത്തുന്ന പതിവുജോടിയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַחַיִּים וְהַמָּוֶת
  choice: ജീവനും മരണവും
  rationale: ഉടമ്പടിയുടെ വിപരീത ഫലങ്ങളെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന പരിഭാഷ.
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: ഞാൻ നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്നു
  rationale: തിരഞ്ഞെടുക്കാനായി ഒരാളുടെ മുമ്പിൽ കാര്യങ്ങൾ അവതരിപ്പിക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: അനുഗ്രഹവും ശാപവും
  rationale: എബ്രായത്തിലെ ഏകവചന വിരുദ്ധജോടി സംക്ഷിപ്തമായും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: וּבָחַרְתָּ בַּחַיִּים
  choice: ജീവൻ തിരഞ്ഞെടുക്കുക
  rationale: തുടർന്നുവരുന്ന ആഹ്വാനത്തിന്റെ ശക്തി വ്യക്തമായി നൽകുന്നു; וְ എന്ന ബന്ധകത്തിന് സ്രോതസ്സിൽ ഇല്ലാത്ത അധികമായ നിഗമനസൂചക പദം ചേർക്കുന്നില്ല.
- source_word: לְמַעַן תִּחְיֶה
  choice: ജീവിക്കേണ്ടതിന്
  rationale: ലക്ഷ്യത്തെയോ ഉദ്ദേശിച്ച ഫലത്തെയോ സൂചിപ്പിക്കുന്ന לְמַעַן എന്നതിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: אַתָּה וְזַרְעֶךָ
  choice: നീയും നിന്റെ സന്തതിയും
  rationale: ഏകവചന അഭിസംബോധന നിലനിർത്തിക്കൊണ്ട് זֶרַע എന്ന പദത്തിന്റെ കുടുംബപരവും തലമുറകളിലേക്കു നീളുന്നതുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടിയുടെ നിയമപരമായ സാക്ഷ്യരൂപം
  choice: ആകാശത്തെയും ഭൂമിയെയും നിനക്കെതിരേ സാക്ഷികളാക്കുന്നു
  alternative: ഞാൻ നിനക്കു മുന്നറിയിപ്പു നൽകുന്നു
  rationale: ഈ വാക്യം പൊതുവായ മുന്നറിയിപ്പല്ല; ഉടമ്പടിലംഘനത്തിന്റെ പശ്ചാത്തലത്തിൽ ആകാശത്തെയും ഭൂമിയെയും സാക്ഷികളായി വിളിക്കുന്ന നിയമപരമായ ഭാഷയാണ്.
- issue: രണ്ടാംപുരുഷ ഏകവചനത്തിന്റെ പ്രതിനിധിപരമായ പ്രയോഗം
  choice: നീ / നിന്റെ
  alternative: നിങ്ങൾ / നിങ്ങളുടെ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചനത്തെ നിലനിർത്തുന്നു; ഇവിടെ മോശെ ഇസ്രായേലിനെ ഉടമ്പടിപങ്കാളിയായി ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു.
- issue: וּבָחַרְתָּ എന്ന ആഹ്വാനത്തിലെ ബന്ധം
  choice: ജീവൻ തിരഞ്ഞെടുക്കുക
  alternative: അതുകൊണ്ട് ജീവൻ തിരഞ്ഞെടുക്കുക
  rationale: സന്ദർഭത്തിൽ നിഗമനാത്മക ഭാവം ഗ്രഹിക്കാമെങ്കിലും, സ്രോതസ്സിലെ സാധാരണ ബന്ധകത്തെ വ്യക്തമായ ‘അതുകൊണ്ട്’ എന്നു വികസിപ്പിക്കാതെ ആഹ്വാനം നേരിട്ട് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദൈവശാസ്ത്രപരമായ വിശദീകരണം മുഖ്യവാചകത്തിലേക്ക് ചേർക്കാതെ, നിയമപരമായ ഉടമ്പടിഭാവവും ഏകവചന അഭിസംബോധനയും സ്രോതസ്സനുസരിച്ച് നിലനിർത്തി.
