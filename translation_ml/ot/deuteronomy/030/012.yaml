    rationale: “കയറി … കൊണ്ടുവന്ന് … കേൾപ്പിക്കും” mixes completed conjunctive forms with a simple future. “കയറിച്ചെന്ന് … കൊണ്ടുവന്ന് … കേൾപ്പിക്കും” is natural Malayalam for the prospective sequence.
