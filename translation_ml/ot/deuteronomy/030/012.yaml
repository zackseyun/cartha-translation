source:
  edition: WLC
  text: לֹ֥א בַ/שָּׁמַ֖יִם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲלֶה לָּ֤/נוּ הַ/שָּׁמַ֨יְמָ/ה֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
translation:
  language: ml
  text: ‘നമുക്കുവേണ്ടി ആർ സ്വർഗത്തിലേക്ക് കയറിച്ചെന്ന് അത് നമുക്കായി കൊണ്ടുവന്ന് കേൾപ്പിക്കും, അങ്ങനെ നാം അത് ചെയ്യാൻ?’ എന്നു നീ പറയേണ്ടിവരുന്ന വിധത്തിൽ അത് സ്വർഗത്തിലല്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആകാശത്തിലല്ല’. എബ്രായ שָׁמַיִם എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ആകാശം’ എന്നും ‘സ്വർഗം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשָּׁמַיִם
  choice: ആകാശത്തിലല്ല
  rationale: שָׁמַיִם എന്ന പദം ഇവിടെ മനുഷ്യന് എളുപ്പം എത്തിപ്പെടാനാകാത്ത മുകളിലെ മണ്ഡലത്തെ സൂചിപ്പിക്കുന്നു. ‘ആകാശം’ മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുകയും തുടർന്നുള്ള ‘ആകാശത്തിലേക്കു കയറി’ എന്ന ദിശാസൂചനയുമായി സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: הִוא
  choice: അത്
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുൻസന്ദർഭത്തിലെ ‘കല്പന’യെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അതിന് സ്വാഭാവികമായ സർവനാമം ‘അത്’ ആണ്.
- source_word: לֵאמֹר
  choice: എന്നു നീ പറയേണ്ടതില്ല
  rationale: ഇത് സങ്കൽപ്പിതമായ എതിർവാദത്തിന്റെ വാക്കുകൾ അവതരിപ്പിക്കുന്നു. മലയാള വാക്യഘടനയിൽ ഉദ്ധരണിയുടെ അവസാനം ‘എന്നു നീ പറയേണ്ടതില്ല’ എന്ന് നൽകുന്നത് അതിന്റെ പ്രസംഗധർമ്മം വ്യക്തമായി പകരുന്നു.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: നമുക്കുവേണ്ടി ആർ … കയറി
  rationale: עלה എന്ന ക്രിയയുടെ മുകളിലേക്കുള്ള ചലനം ‘കയറി’ നിലനിർത്തുന്നു; לָנוּ എന്ന ഗുണഭോക്തൃ അർഥം ‘നമുക്കുവേണ്ടി’ എന്ന് വ്യക്തമാക്കുന്നു.
- source_word: הַשָּׁמַיְמָה
  choice: ആകാശത്തിലേക്കു
  rationale: ദിശാസൂചകമായ ה־ָה പ്രത്യയം ലക്ഷ്യത്തിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നതിനാൽ ‘-ലേക്കു’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: അത് നമുക്കായി കൊണ്ടുവന്ന്
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണെങ്കിലും, ആകാശത്തിൽനിന്ന് ജനങ്ങൾക്കായി ലഭ്യമാക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘കൊണ്ടുവരുക’ മലയാളത്തിൽ അർഥം കൃത്യവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: നമ്മെ കേൾപ്പിക്കും
  rationale: שמע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം ‘കേൾപ്പിക്കും’ നേരിട്ട് നിലനിർത്തുന്നു; ‘പ്രഖ്യാപിക്കും’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പരിഭാഷ ഒഴിവാക്കി.
- source_word: וְנַעֲשֶׂנָּה
  choice: നാം അത് കേട്ടു ചെയ്യേണ്ടതിന്
  rationale: עשה എന്നതിന്റെ ‘ചെയ്യുക/ആചരിക്കുക’ എന്ന അർഥവും ഇവിടെ ഉള്ള ഉദ്ദേശ്യബന്ധവും നിലനിർത്തുന്നു. ‘ചെയ്യുക’ മൂലവാക്യത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: שָׁמַיִם എന്നതിന്റെ മണ്ഡലസൂചന
  choice: ആകാശം
  alternative: സ്വർഗം
  rationale: ഈ വാക്യം കല്പനയുടെ അപ്രാപ്യതയെ സൂചിപ്പിക്കുന്ന ഒരു ഉയർന്ന മണ്ഡലത്തെക്കുറിച്ചാണ് പറയുന്നത്. ‘ആകാശം’ എബ്രായ പദത്തിന്റെ ഭൗതികവും സ്വർഗീയവുമായ വ്യാപ്തി തുറന്നുവയ്ക്കുന്നു; ‘സ്വർഗം’ എന്ന് മാത്രം നൽകിയാൽ അതിനെ പ്രത്യേകമായി ദൈവവാസസ്ഥാനമായി നിർണയിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ഉദ്ധരണിയുടെ നീണ്ട ക്രിയാശൃംഖല മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ട് ‘കയറുക—കൊണ്ടുവരുക—കേൾപ്പിക്കുക—ചെയ്യുക’ എന്ന മൂലക്രമം സംരക്ഷിച്ചു.
