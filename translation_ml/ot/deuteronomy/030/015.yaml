  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רְאֵ֨ה נָתַ֤תִּי לְ/פָנֶ֨י/ךָ֙ הַ/יּ֔וֹם אֶת הַֽ/חַיִּ֖ים וְ/אֶת הַ/טּ֑וֹב וְ/אֶת הַ/מָּ֖וֶת וְ/אֶת הָ/רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/015.yaml
  text: See[a], I have set before you today life and good[b], and death and evil.
translation:
  language: ml
  text: നോക്കുക[a], ജീവനും നന്മയും മരണവും തിന്മയും[b] ഞാൻ ഇന്നു നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കാണുക.’ ഇവിടെ ഈ പദം ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞയായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘തിന്മ’ എന്നതിന് ചില സന്ദർഭങ്ങളിൽ ‘ദോഷം’ അല്ലെങ്കിൽ ‘അനർഥം’ എന്നും അർഥമുണ്ടാകാം; ഇവിടെ എബ്രായത്തിൽ ഇത് ‘നന്മ’യോടുള്ള നേരിട്ടുള്ള വിരുദ്ധതയിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: നോക്കുക
  rationale: ראה എന്ന ക്രിയയുടെ ഏകവചന ആജ്ഞാരൂപം ഇവിടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗമാണ്. ‘നോക്കുക’ നേരിട്ടുള്ള ആഹ്വാനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָתַתִּי
  choice: ഞാൻ വെച്ചിരിക്കുന്നു
  rationale: נתן എന്നതിന് ‘കൊടുക്കുക/വയ്ക്കുക’ എന്ന അർഥങ്ങളുണ്ട്. לְפָנֶיךָ എന്നതോടൊപ്പം തിരഞ്ഞെടുപ്പുകൾ ഒരാളുടെ മുമ്പിൽ അവതരിപ്പിക്കുന്ന ആശയം ‘മുമ്പിൽ വെച്ചിരിക്കുന്നു’ എന്ന പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ
  rationale: തീരുമാനത്തിനായി വഴികൾ ഒരാളുടെ മുമ്പിൽ വയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി നേരിട്ട് നിലനിർത്തുന്നു; ഏകവചന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്നു
  rationale: കാലസൂചകമായ ‘ഇന്ന്’ എന്ന അർഥം dignified modern Malayalam-ൽ ‘ഇന്നു’ എന്ന് നൽകിയിരിക്കുന്നു.
- source_word: הַחַיִּים
  choice: ജീവൻ
  rationale: രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും חַיִּים സാധാരണയായി ‘ജീവൻ’ എന്ന അമൂർത്ത ഏകവചന അർഥത്തിലാണ് ഉപയോഗിക്കുന്നത്.
- source_word: הַטּוֹב
  choice: നന്മ
  rationale: טוֹב എന്നതിന്റെ വിശാലമായ ‘നല്ലത്/നന്മ’ എന്ന അർഥവും തിന്മയോടുള്ള നേരിട്ടുള്ള വിരുദ്ധസമാന്തരതയും സംരക്ഷിക്കുന്നു; ‘സമൃദ്ധി’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: הַמָּוֶת
  choice: മരണം
  rationale: ജീവനോടുള്ള വ്യക്തമായ വിരുദ്ധത നേരിട്ട് നൽകുന്നു.
- source_word: הָרָע
  choice: തിന്മ
  rationale: רַע ധാർമിക തിന്മയെയും ദോഷം, അനർഥം എന്നിവയെയും സൂചിപ്പിക്കാം. ഇവിടെ הַטּוֹב-നോടുള്ള ഉടനെയുള്ള വിരുദ്ധത നിലനിർത്താൻ ‘തിന്മ’ അനുയോജ്യമാണ്; അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിപരമായ വിരുദ്ധജോടിയിൽ הָרָע എന്നതിന്റെ വിവർത്തനം
  choice: തിന്മ
  alternative: ദോഷം / അനർഥം
  rationale: ജീവൻ–നന്മ, മരണം–തിന്മ എന്നീ സമഗ്രമായ വിരുദ്ധജോടികളുടെ ധാർമികവും അസ്തിത്വപരവുമായ ശക്തി ‘തിന്മ’ സംരക്ഷിക്കുന്നു. അതേസമയം, എബ്രായ പദത്തിന് ദോഷകരമായ ഫലം അല്ലെങ്കിൽ അനർഥം എന്ന അർഥവും സന്ദർഭാനുസൃതമായി ഉണ്ടാകാമെന്ന അവ്യക്തത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ഏകവചന അഭിസംബോധന ‘നിന്റെ’ എന്നതിലൂടെ സൂക്ഷിച്ചു. ജീവൻ/നന്മ, മരണം/തിന്മ എന്നീ സമാന്തരജോടികളും വാക്യത്തിന്റെ സംക്ഷിപ്തതയും നിലനിർത്തി.
