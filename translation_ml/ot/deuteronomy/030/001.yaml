  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
translation:
  language: ml
  text: ഈ കാര്യങ്ങളെല്ലാം—ഞാൻ നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്ന അനുഗ്രഹവും ശാപവും—നിനക്കു സംഭവിക്കുകയും, നിന്റെ ദൈവമായ യഹോവ നിന്നെ ഓടിച്ചുകളഞ്ഞ എല്ലാ ജനതകളുടെയും ഇടയിൽവെച്ച് നീ അവയെ നിന്റെ മനസ്സിൽ ഓർക്കുകയും ചെയ്യുമ്പോൾ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ അവയെ ഹൃദയത്തിൽ ഓർക്കുകയും”; അക്ഷരാർഥം, “നീ അവയെ നിന്റെ ഹൃദയത്തിലേക്കു തിരികെ കൊണ്ടുവരുകയും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: സംഭവിക്കുകയും ... ചെയ്യുമ്പോൾ
  rationale: ഭാവിയിൽ ഉണ്ടാകുന്ന സാഹചര്യത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ ഘടനയുടെ കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יָבֹאוּ עָלֶיךָ
  choice: നിനക്കു സംഭവിക്കുകയും
  rationale: അക്ഷരാർഥമായ ‘നിന്റെമേൽ വരുക’ എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ കാര്യങ്ങളെല്ലാം
  rationale: דבר എന്ന പദം ഇവിടെ മുമ്പ് പറഞ്ഞ ഉടമ്പടി ഫലങ്ങളെ ആകെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കാര്യങ്ങൾ’ യോജിക്കുന്നു.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: അനുഗ്രഹവും ശാപവും
  rationale: പരസ്പരവിരുദ്ധമായ ഉടമ്പടി ഫലങ്ങളെ നേരായും പരമ്പരാഗതമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר נָתַתִּי לְפָנֶיךָ
  choice: ഞാൻ നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്ന
  rationale: נתן എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘കൊടുക്കുക’ ആണെങ്കിലും ‘മുമ്പിൽ’ എന്നതിനോടുകൂടിയ പ്രയോഗം ഇവിടെ ‘മുമ്പിൽ വെക്കുക’ എന്നാണ്.
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: നീ അവയെ ഹൃദയത്തിലേക്കു തിരികെ കൊണ്ടുവരുകയും
  rationale: ശ്രദ്ധയോടെ ഓർക്കുകയും പരിഗണിക്കുകയും ചെയ്യുന്ന ആശയം ഉൾക്കൊള്ളുന്ന എബ്രായ രൂപകത്തെ മുഖ്യവാചകത്തിൽ കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
- source_word: בְּכָל הַגּוֹיִם
  choice: എല്ലാ ജനതകളുടെയും ഇടയിൽവെച്ച്
  rationale: പ്രവാസത്തിൽ വിദേശജനതകൾക്കിടയിൽ കഴിയുന്നതിനെ ‘ഇടയിൽ’ എന്ന മലയാളപ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: הִדִּיחֲךָ
  choice: നിന്നെ ഓടിച്ചുകളഞ്ഞ
  rationale: ശക്തിയായി അകറ്റുകയോ പുറത്താക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ബലം നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവ
  rationale: തിരുവെഴുത്തിലെ ഉടമ്പടിനാമമായ יהוה വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുകയും സ്വാഭാവിക മലയാളവാക്യക്രമം പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: שָׁמָּה
  choice: (ഓടിച്ചുകളഞ്ഞ എന്ന ക്രിയയിൽ ലക്ഷ്യസ്ഥലം ഉൾക്കൊള്ളുന്നു)
  rationale: ‘അവിടേക്ക്’ എന്ന ദിശാസൂചന മലയാളത്തിലെ ‘എല്ലാ ജനതകളുടെയും ഇടയിൽവെച്ച്’ എന്ന സ്ഥാനപ്രയോഗത്തോടും ‘ഓടിച്ചുകളഞ്ഞ’ എന്ന ക്രിയയോടും ചേർന്ന് സ്വാഭാവികമായി ഉൾക്കൊള്ളപ്പെടുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഉപയോഗിക്കുന്ന ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയാൽ പകരാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ എന്നതിലെ ഹൃദയരൂപകം
  choice: ഹൃദയത്തിലേക്കു തിരികെ കൊണ്ടുവരുക
  alternative: ഹൃദയത്തിൽ ഗ്രഹിക്കുക / ഓർമിക്കുക
  rationale: ഓർമ, ആലോചന, ആന്തരിക പ്രതികരണം എന്നിവയ്ക്കിടയിലെ മൂലഭാഷയുടെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സമ്മർദവും ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന നിബന്ധനാവാക്യമാണെന്നതിനാൽ അവസാനം കോമ നിലനിർത്തി.
