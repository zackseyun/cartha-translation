source:
  edition: WLC
  text: וְ/אַתָּ֣ה תָשׁ֔וּב וְ/שָׁמַעְתָּ֖ בְּ/ק֣וֹל יְהוָ֑ה וְ/עָשִׂ֨יתָ֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
translation:
  language: ml
  text: നീ മടങ്ങിവന്ന്[a] യഹോവയുടെ ശബ്ദം കേൾക്കുകയും[b] ഞാൻ ഇന്നു നിന്നോടു കൽപ്പിക്കുന്ന അവന്റെ സകല കൽപ്പനകളും നിറവേറ്റുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തിരിഞ്ഞുവരിക.” സന്ദർഭത്തിൽ ഇത് ഉടമ്പടിയിലേക്കുള്ള മടങ്ങിവരവിനെയും മാനസാന്തരത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “യഹോവയുടെ ശബ്ദം കേൾക്കുക”; ഈ പ്രയോഗം പലപ്പോഴും അനുസരിക്കുക എന്ന അർഥവും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה תָשׁוּב
  choice: നീയോ മടങ്ങിവന്ന്
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന രണ്ടാംപുരുഷ സർവനാമത്തിന്റെ ഊന്നൽ ‘നീയോ’ നിലനിർത്തുന്നു. שׁוּב എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘മടങ്ങുക/തിരികെ വരുക’ സംരക്ഷിക്കാൻ ‘മടങ്ങിവന്ന്’ തിരഞ്ഞെടുത്തു.
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: യഹോവയുടെ ശബ്ദം കേൾക്കുകയും
  rationale: ‘ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗം സുതാര്യമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അനുസരണം ഉൾക്കൊള്ളുന്നുവെങ്കിലും അതിനെ മുഖ്യപാഠത്തിൽ മാത്രം അർഥമാക്കി ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וְעָשִׂיתָ
  choice: നിറവേറ്റുകയും ചെയ്യും
  rationale: עָשָׂה എന്ന ക്രിയയുടെ ‘ചെയ്യുക’ എന്ന ആശയം കല്പനകളോടൊപ്പം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കാൻ ‘നിറവേറ്റുക’ ഉപയോഗിച്ചു; ഇത് അടുത്തുള്ള കേൾക്കൽപ്രയോഗത്തെ വെറും ആവർത്തനമാക്കുന്നില്ല.
- source_word: כָּל מִצְוֺתָיו
  choice: അവന്റെ സകല കല്പനകളും
  rationale: മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും ഉടമ്പടി-നിയമപരമായ ‘കല്പനകൾ’ എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന
  rationale: പങ്കാളിക്രിയയുടെ ഇപ്പോഴത്തെ/തുടരുന്ന ബലം ‘കല്പിക്കുന്ന’ എന്നതിലൂടെ നൽകുകയും ആവർത്തിക്കുന്ന നിയമപുസ്തകീയ അടയാളമായ ‘ഇന്നു’ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: שׁוּב എന്നത് വ്യക്തമായി ‘മാനസാന്തരപ്പെടുക’ എന്നു പരിഭാഷപ്പെടുത്തണമോ
  choice: മടങ്ങിവന്ന്
  alternative: മാനസാന്തരപ്പെട്ട് / തിരിഞ്ഞുവന്ന്
  rationale: ഈ സന്ദർഭത്തിൽ ഉടമ്പടിയിലേക്കുള്ള മടങ്ങിവരവും മാനസാന്തരവും സൂചിപ്പിക്കാമെങ്കിലും, എബ്രായപദം ശാരീരികമായും ഉടമ്പടിപരമായും ഉള്ള മടങ്ങിവരവിന്റെ വിശാലത അനുവദിക്കുന്നു. അതിനാൽ അർഥം അനാവശ്യമായി ചുരുക്കിയില്ല.
- issue: שׁמע בְּקוֹל എന്നത് ‘അനുസരിക്കുക’ എന്നു മാത്രം നൽകണമോ
  choice: ശബ്ദം കേൾക്കുക
  alternative: യഹോവയെ അനുസരിക്കുക
  rationale: ഈ പ്രയോഗം അനുസരണത്തെ ഉൾക്കൊള്ളുന്നു; എങ്കിലും തുടർന്നുള്ള കല്പനകൾ നിറവേറ്റുക എന്ന വാക്യഭാഗം ആ ആശയം വ്യക്തമാക്കുന്നു. അതിനാൽ രണ്ടുപ്രയോഗങ്ങളെയും ഒന്നായി ലയിപ്പിക്കാതെ എബ്രായരൂപകം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നീയോ’ എന്നത് മൂലപാഠത്തിലെ ഊന്നൽ നൽകുന്നു; ‘സകല’, ‘കല്പന’ എന്നിവ നിയമപുസ്തകത്തിന്റെ ഗൗരവമുള്ള ഉടമ്പടി-ഭാഷാശൈലി നിലനിർത്തുന്നു.
