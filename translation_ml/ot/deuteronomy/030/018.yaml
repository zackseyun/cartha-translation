source:
  edition: WLC
  text: הִגַּ֤דְתִּי לָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵד֑וּ/ן לֹא תַאֲרִיכֻ֤/ן יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתָּ֤ה עֹבֵר֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹ֥א שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/018.yaml
  text: I declare to you today that you will surely perish[c][b][a]; you will not prolong your days on the land that you are crossing the Jordan to enter there and possess it.
translation:
  language: ml
  text: 'നിങ്ങളോടു ഞാൻ ഇന്ന് പ്രഖ്യാപിക്കുന്നു: നിങ്ങൾ[b] നിശ്ചയമായും നശിച്ചുപോകും[a]; നിങ്ങൾ യോർദ്ദാൻ കടന്ന് അവിടെ പ്രവേശിക്കാനും അതു കൈവശമാക്കാനും പോകുന്ന ദേശത്ത് ദീർഘകാലം ജീവിക്കുകയില്ല[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിശ്ചയമായും നശിച്ചുപോകും’ എന്നതിന് ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘നശിച്ചുപോകുക, നീ നശിച്ചുപോകും’ എന്ന ഊന്നൽപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഹീബ്രു ഇസ്രായേൽജനതയെ ഒരൊറ്റ ജനമായി കണ്ട് ഏകവചനമായ ‘നീ’ എന്നു അഭിസംബോധന ചെയ്യുന്നു.
    reason: cultural_note
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: ‘നിങ്ങളുടെ ദിവസങ്ങൾ ദീർഘമാക്കുകയില്ല’; അതായത്, ‘ദീർഘകാലം ജീവിക്കുകയില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתִּי לָכֶם הַיּוֹם
  choice: ഞാൻ ഇന്ന് നിങ്ങളോടു പ്രഖ്യാപിക്കുന്നു
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഗൗരവപൂർവം അറിയിക്കുകയോ പ്രഖ്യാപിക്കുകയോ ചെയ്യുന്നതാണ്. പൂർത്തികാലരൂപം ഹീബ്രു സന്ദർഭത്തിൽ ഔപചാരികമായ ഇപ്പോഴത്തെ പ്രഖ്യാപനമായി സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: നിങ്ങൾ നിശ്ചയമായും നശിച്ചുപോകും
  rationale: ക്രിയയുടെ infinitive absolute-ഉം finite രൂപവും ചേർന്ന പ്രയോഗം ഫലത്തിന്റെ ഉറപ്പും ഊന്നലും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിശ്ചയമായും’ അതു സ്വാഭാവികമായി പകരുന്നു.
- source_word: לֹא תַאֲרִיכֻן יָמִים
  choice: നിങ്ങൾ ദീർഘകാലം ജീവിക്കുകയില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങൾ ദീർഘമാക്കുകയില്ല’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥമാണിത്; അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
- source_word: עַל הָאֲדָמָה
  choice: ദേശത്ത്
  rationale: ഇവിടെ אֲדָמָה മണ്ണിനെ മാത്രമല്ല, യോർദ്ദാനക്കരെയുള്ള വാഗ്ദത്തപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר אַתָּה עֹבֵר אֶת הַיַּרְדֵּן
  choice: നിങ്ങൾ യോർദ്ദാൻ കടന്ന് ... പോകുന്ന
  rationale: ഹീബ്രുവിലെ ഏകവചന അഭിസംബോധന ഇസ്രായേലിനെ ഒരു ജനതയായി കാണുന്നു. മലയാളത്തിലെ ആദരസൂചക/ബഹുവചന ‘നിങ്ങൾ’ വ്യക്തമായ സംഖ്യാഭേദം കാണിക്കാത്തതിനാൽ ഈ കൂട്ടായ അഭിസംബോധന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לָבֹא שָׁמָּה לְרִשְׁתָּהּ
  choice: പ്രവേശിക്കാനും കൈവശമാക്കാനും പോകുന്ന
  rationale: בוא പ്രവേശനത്തെയും ירש ദേശം കൈവശപ്പെടുത്തുന്നതിനെയും സൂചിപ്പിക്കുന്നു. שָׁמָּהയും സ്ത്രീലിംഗ suffix-ഉം മലയാളത്തിൽ ബന്ധവാക്യത്തിനുള്ളിൽ സ്വാഭാവികമായി ദേശത്തെത്തന്നെ സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം ‘അവിടെ/അതിനെ’ ചേർക്കാതെ അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനോടുള്ള കൂട്ടായ ഏകവചന അഭിസംബോധന
  choice: പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായ ‘നിങ്ങൾ’ ഉപയോഗിച്ച് കുറിപ്പിൽ കൂട്ടായ ഏകവചനം വ്യക്തമാക്കുക
  alternative: ‘ഇസ്രായേൽജനമേ, നീ’ എന്നിങ്ങനെ ഏകവചനം തുറന്നുകാട്ടുക
  rationale: മൂലപാഠത്തിന്റെ കൂട്ടായ നിയമബന്ധ അഭിസംബോധന സംരക്ഷിക്കണം; എന്നാൽ ‘നീ’ ആധുനിക മലയാളത്തിൽ അനാവശ്യമായി അനൗപചാരികമോ വ്യക്തിപരമോ ആയി കേൾക്കാം.
- issue: ദേശത്തെക്കുറിച്ചുള്ള നിയമബന്ധ മുന്നറിയിപ്പ്
  choice: אֲדָמָהയെ ‘ദേശം’ എന്നു പരിഭാഷപ്പെടുത്തുക
  alternative: ‘നിലം’ അല്ലെങ്കിൽ ‘മണ്ണ്’
  rationale: യോർദ്ദാൻ കടന്ന് പ്രവേശിച്ചു കൈവശമാക്കേണ്ട പ്രദേശമാണ് സന്ദർഭത്തിലെ സൂചന; ‘ദേശം’ ഈ കഥാപരവും ദൈവശാസ്ത്രപരവുമായ ബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമബന്ധ മുന്നറിയിപ്പിന്റെ ഭാവം നിലനിർത്തി. മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യക്രമത്തിനായി ദേശത്തെ സംബന്ധിക്കുന്ന ബന്ധവാക്യം ആദ്യം നൽകി; ‘ദിവസങ്ങൾ ദീർഘമാക്കുക’ എന്ന പദാനുപദരൂപത്തിനു പകരം വായനാസൗകര്യമുള്ള ‘ദീർഘകാലം ജീവിക്കുക’ സ്വീകരിച്ചു.
