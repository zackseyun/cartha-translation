- from: നിങ്ങൾ യോർദ്ദാൻ കടന്ന് പ്രവേശിക്കാനും കൈവശമാക്കാനും പോകുന്ന ദേശത്ത് നിങ്ങൾ ദീർഘകാലം ജീവിക്കുകയില്ല; നിങ്ങൾ നിശ്ചയമായും നശിച്ചുപോകുമെന്ന് ഞാൻ ഇന്ന് നിങ്ങളോടു പ്രഖ്യാപിക്കുന്നു.[a][b]
  to: 'നിങ്ങളോടു ഞാൻ ഇന്ന് പ്രഖ്യാപിക്കുന്നു: നിങ്ങൾ[b] നിശ്ചയമായും നശിച്ചുപോകും[a]; നിങ്ങൾ യോർദ്ദാൻ കടന്ന് അവിടെ പ്രവേശിക്കാനും അതു കൈവശമാക്കാനും പോകുന്ന ദേശത്ത് ദീർഘകാലം ജീവിക്കുകയില്ല[c].'
