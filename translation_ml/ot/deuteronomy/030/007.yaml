source:
  edition: WLC
  text: וְ/נָתַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֵ֥ת כָּל הָ/אָל֖וֹת הָ/אֵ֑לֶּה עַל אֹיְבֶ֥י/ךָ וְ/עַל שֹׂנְאֶ֖י/ךָ אֲשֶׁ֥ר רְדָפֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/007.yaml
  text: And Yahweh your God will put all these curses on your enemies and on those who hate you[a], who pursued you.
translation:
  language: ml
  text: നിന്നെ പിന്തുടർന്ന നിന്റെ ശത്രുക്കളുടെയും നിന്നെ വെറുക്കുന്നവരുടെയും മേൽ നിന്റെ ദൈവമായ യാഹ്‌വെ ഈ ശാപങ്ങളെല്ലാം വരുത്തും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ശപഥങ്ങളെല്ലാം’; ആവർത്തനപുസ്തകത്തിൽ ഈ പദം സാധാരണയായി ഉടമ്പടിശാപങ്ങളെയോ ശിക്ഷാവിധികളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: വരുത്തും
  rationale: נתן എന്നതിന് ‘കൊടുക്കുക, വെക്കുക, ഏൽപ്പിക്കുക’ തുടങ്ങിയ അർഥങ്ങളുണ്ട്. ശാപങ്ങൾ ആളുകളുടെ മേൽ ചുമത്തപ്പെടുന്ന ഈ സന്ദർഭത്തിൽ ‘മേൽ ... വരുത്തും’ എന്നത് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതമായി പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം ‘നിന്റെ ദൈവം’ എന്ന ബന്ധം വ്യക്തമാക്കുന്നു; യഹോവയോടു ചേർന്നുള്ള മലയാളവാക്യഘടനയ്ക്ക് ‘നിന്റെ ദൈവമായ യഹോവ’ സ്വാഭാവികമാണ്.
- source_word: כָּל הָאָלֹות הָאֵלֶּה
  choice: ഈ ശാപങ്ങളെല്ലാം
  rationale: ആലാ എന്ന പദത്തിന് ‘ശപഥങ്ങൾ’ എന്നും അർഥമാകാമെങ്കിലും, ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടി-സന്ദർഭത്തിൽ മുമ്പ് പ്രസ്താവിച്ച ശാപങ്ങളെയോ ശിക്ഷാനിബന്ധനകളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: עַל אֹיְבֶיךָ וְעַל שֹׂנְאֶיךָ
  choice: നിന്റെ ശത്രുക്കളുടെയും നിന്നെ വെറുക്കുന്നവരുടെയും മേൽ
  rationale: עַל ലക്ഷ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘മേൽ’ എന്നു പരിഭാഷപ്പെടുത്തി. ശത്രുക്കൾ, വെറുക്കുന്നവർ എന്നീ സമാന്തരഘടകങ്ങൾ നിലനിർത്തി.
- source_word: אֲשֶׁר רְדָפוּךָ
  choice: നിന്നെ പിന്തുടർന്ന
  rationale: רדף എന്നതിന്റെ വിശാലമായ ‘പിന്തുടരുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘പീഡിപ്പിക്കുക’ എന്നു പറഞ്ഞ് സന്ദർഭത്തെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: എബ്രായമൂലത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിച്ചില്ല. സാധാരണ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും മാന്യവുമായ ലിപ്യന്തരണമായി ‘യഹോവ’ സ്വീകരിച്ചു.
- issue: אָלֹות എന്നതിന്റെ ഉടമ്പടി-സന്ദർഭത്തിലെ അർഥം
  choice: ശാപങ്ങൾ
  alternative: ശപഥങ്ങൾ
  rationale: ആവർത്തനപുസ്തകം 30-ന്റെ അടുത്ത സന്ദർഭത്തിൽ മുമ്പ് പ്രഖ്യാപിച്ച ഉടമ്പടിശാപങ്ങളാണ് സൂചിതം. എന്നാൽ പദത്തിന്റെ വിശാലമായ ‘ശപഥങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ലക്ഷ്യഘടന വ്യക്തമാക്കാൻ ‘മേൽ ... വരുത്തും’ ഉപയോഗിച്ചു; ബന്ധവാക്യമായ ‘നിന്നെ പിന്തുടർന്ന’ രണ്ടു നാമഘടകങ്ങളോടും ബന്ധപ്പെടുന്ന വിധത്തിൽ മുന്നിൽ വെച്ചു.
