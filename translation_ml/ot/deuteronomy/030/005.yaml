source:
  edition: WLC
  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ, നിന്റെ പിതാക്കന്മാർ കൈവശം വച്ചിരുന്ന ദേശത്തേക്കു നിന്നെ കൊണ്ടുവരും; നീ അതു കൈവശമാക്കും. അവൻ നിനക്കു നന്മ ചെയ്യുകയും നിന്റെ പിതാക്കന്മാരെക്കാൾ അധികമായി നിന്നെ വർധിപ്പിക്കുകയും ചെയ്യും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, ‘അവൻ നിന്നെ സമൃദ്ധനാക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאֲךָ
  choice: നിന്നെ കൊണ്ടുവരും
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘കൊണ്ടുവരുക/പ്രവേശിപ്പിക്കുക’ എന്നാണ്. സന്ദർഭം മടങ്ങിവരവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ ക്രിയയിൽ ‘തിരികെ’ എന്ന ആശയം വ്യക്തമായി ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടി-ഭൂമിശാസ്ത്ര പശ്ചാത്തലത്തിൽ വാഗ്ദത്തദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാർ കൈവശമാക്കിയിരുന്ന
  rationale: ירשׁ എന്ന ക്രിയയ്ക്ക് അവകാശമായി ലഭിക്കുക, കൈവശമാക്കുക എന്നീ അർഥഛായകളുണ്ട്. ഇവിടെ പിതാക്കന്മാർ മുമ്പ് കൈവശം വച്ച ദേശത്തെക്കുറിച്ചായതിനാൽ ഈ പ്രയോഗം യോജിക്കുന്നു.
- source_word: וִירִשְׁתָּהּ
  choice: നീ അതു കൈവശമാക്കും
  rationale: ദേശം കർമമായി വരുമ്പോൾ ירשׁ കൈവശമാക്കുക എന്ന സജീവമായ അർഥം വഹിക്കുന്നു; മുൻവാക്യഭാഗവുമായുള്ള പദബന്ധവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: וְהֵיטִבְךָ
  choice: അവൻ നിനക്കു നന്മ ചെയ്യുകയും
  rationale: יטב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഒരാൾക്കു നന്മ ചെയ്യുക എന്നതാണ്. ഇത് മൂലഭാഷയോട് അടുത്തതും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്; സന്ദർഭാനുസൃതമായ ‘സമൃദ്ധനാക്കുക’ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וְהִרְבְּךָ
  choice: നിന്നെ വർധിപ്പിക്കുകയും ചെയ്യും
  rationale: רבה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘എണ്ണത്തിൽ വർധിപ്പിക്കുക’ എന്നാണ് അർഥം. ഗോത്രപിതാക്കന്മാർക്കു നൽകിയ വർധനയുടെ വാഗ്ദാനവുമായി ഇതിന്റെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: מֵאֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരെക്കാൾ അധികമായി
  rationale: താരതമ്യാർഥമുള്ള מן പിതാക്കന്മാരെക്കാൾ കൂടുതലായ വർധനയെ സൂചിപ്പിക്കുന്നു; אבות എന്ന വ്യക്തമായ പുൽലിംഗ ബന്ധപദം ‘പിതാക്കന്മാർ’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരാതെ, പൊതുവേ അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: אֲבֹתֶיךָ എന്ന ലിംഗസൂചക ബന്ധപദം
  choice: നിന്റെ പിതാക്കന്മാർ
  alternative: നിന്റെ പൂർവികർ
  rationale: എബ്രായപദം വ്യക്തമായി പുൽലിംഗ ബഹുവചനമാണ്; അതിനാൽ മൂലരൂപം നിലനിർത്തി. സന്ദർഭത്തിൽ ഇത് ഇസ്രായേലിന്റെ പിതൃപൂർവികരെ സൂചിപ്പിക്കുന്നു.
- issue: וְהֵיטִבְךָ എന്ന അനുഗ്രഹപ്രയോഗത്തിന്റെ പരിധി
  choice: നിനക്കു നന്മ ചെയ്യും
  alternative: നിന്നെ സമൃദ്ധനാക്കും
  rationale: ക്രിയയുടെ വിശാലമായ ‘നന്മ ചെയ്യുക’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ചു; അതിനെ ഭൗതിക സമൃദ്ധിയിലേക്കു മാത്രം ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. രണ്ടാംപുരുഷ ഏകവചനം സമൂഹമായ ഇസ്രായേലിനെ അഭിസംബോധന ചെയ്യുന്നതായി മൂലപാഠത്തെ പിന്തുടർന്ന് ‘നിന്നെ/നീ’ എന്നു നിലനിർത്തി. സമാന്തര ക്രിയകളുടെ ഘടനയും ഉടമ്പടി-അനുഗ്രഹ ഭാഷയും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
