id: DEU.30.9
reference: Deuteronomy 30:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הוֹתִֽירְ/ךָ֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בְּ/כֹ֣ל מַעֲשֵׂ֣ה יָדֶ֗/ךָ בִּ/פְרִ֨י בִטְנְ/ךָ֜ וּ/בִ/פְרִ֧י בְהֶמְתְּ/ךָ֛ וּ/בִ/פְרִ֥י אַדְמָתְ/ךָ֖ לְ/טוֹבָ֑ה כִּ֣י יָשׁ֣וּב יְהוָ֗ה לָ/שׂ֤וּשׂ עָלֶ֨י/ךָ֙ לְ/ט֔וֹב כַּ/אֲשֶׁר שָׂ֖שׂ עַל אֲבֹתֶֽי/ךָ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
translation:
  language: ml
  text: നിന്റെ കൈയുടെ സകല പ്രവൃത്തിയിലും[a], നിന്റെ ഗർഭഫലത്തിലും, നിന്റെ കന്നുകാലികളുടെ ഫലത്തിലും, നിന്റെ നിലത്തിന്റെ വിളവിലും നിന്റെ ദൈവമായ യാഹ്‌വെ നിനക്കു നന്മയ്ക്കായി സമൃദ്ധി നൽകും. നിന്റെ പിതാക്കന്മാരെക്കുറിച്ച്[b] സന്തോഷിച്ചതുപോലെ, യാഹ്‌വെ നിനക്കു നന്മയ്ക്കായി വീണ്ടും നിന്നെക്കുറിച്ച് സന്തോഷിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീ ചെയ്യുന്ന എല്ലാറ്റിലും’; ‘കൈയുടെ പ്രവൃത്തി’ എന്നത് ഒരാളുടെ അധ്വാനത്തെയും സംരംഭങ്ങളെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘പിതാക്കന്മാർ’ എന്നത് ഇവിടെ ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയോ മുൻതലമുറകളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  choice: നിനക്കു ... സമൃദ്ധി നൽകും
  rationale: ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥവും മിച്ചമോ സമൃദ്ധിയോ ഉണ്ടാക്കുക എന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: നിന്റെ കൈയുടെ സകല പ്രവൃത്തിയിലും
  rationale: അധ്വാനവും സംരംഭങ്ങളും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: בִּפְרִי בִטְנְךָ
  choice: നിന്റെ ഗർഭഫലത്തിൽ
  rationale: സന്തതിയെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ രൂപകം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: בְהֶמְתְּךָ
  choice: നിന്റെ കന്നുകാലികൾ
  rationale: വളർത്തുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന കാർഷികസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പദം.
- source_word: אַדְמָתְךָ
  choice: നിന്റെ നിലം
  rationale: വിളവേകുന്ന കൃഷിഭൂമി അഥവാ മണ്ണ് എന്ന മൂർത്തമായ ആശയം നൽകുന്നു.
- source_word: לְטוֹבָה / לְטוֹב
  choice: നന്മയ്ക്കായി / നിനക്കു നന്മ ചെയ്യും
  rationale: ഗുണകരമായ ഫലം എന്ന അർത്ഥം നിലനിർത്തുന്നു; രണ്ടാം പ്രയോഗത്തിൽ മലയാളവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന പ്രയോജനാർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: יָשׁוּב
  choice: വീണ്ടും
  rationale: പിന്തുടരുന്ന ക്രിയയുടെ ആവർത്തനം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർത്ഥം നൽകുന്നു.
- source_word: לָשׂוּשׂ עָלֶיךָ
  choice: നിന്റെമേൽ സന്തോഷിക്കുക
  rationale: വ്യക്തിപരവും ഉടമ്പടിപരവുമായ ആനന്ദം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാർ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുൽലിംഗരൂപവും ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരിലേക്കുള്ള സൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു; മലയാളത്തിൽ പരിചിതവും മാന്യവുമായ രൂപം തിരഞ്ഞെടുത്തു.
- issue: אֲבֹתֶיךָ എന്ന ലിംഗസൂചക പദം
  choice: നിന്റെ പിതാക്കന്മാർ
  alternative: നിന്റെ പൂർവികർ
  rationale: മൂലത്തിലെ പുൽലിംഗവും പിതൃപരമ്പരയിലേക്കുള്ള സാധ്യതയുള്ള സൂചനയും പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു; വിശാലമായ സന്ദർഭാർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: לְטוֹב എന്നതും ദൈവത്തിന്റെ സന്തോഷവും തമ്മിലുള്ള ബന്ധം
  choice: യഹോവ വീണ്ടും നിന്റെമേൽ സന്തോഷിച്ചു നിനക്കു നന്മ ചെയ്യും
  alternative: യഹോവ നന്മയ്ക്കായി വീണ്ടും നിന്റെമേൽ സന്തോഷിക്കും
  rationale: എബ്രായത്തിലെ ‘നന്മയ്ക്കായി’ എന്ന പ്രയോഗത്തിന്റെ ഗുണകരമായ ദിശ വ്യക്തമാക്കുന്നു; ദൈവത്തിന്റെ സന്തോഷത്തെ മനുഷ്യന്റെ പ്രവൃത്തിഫലമായി വ്യാഖ്യാനിക്കുന്ന അധിക സിദ്ധാന്തം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസുഗമവുമായ ശൈലി. ‘ഗർഭഫലം’, ‘നിന്റെമേൽ സന്തോഷിക്കുക’, ‘കൈയുടെ പ്രവൃത്തി’ എന്നീ മൂലരൂപകങ്ങൾ ഉദ്ദേശപൂർവം നിലനിർത്തി; നീണ്ട പട്ടിക വായിക്കാൻ സഹായിക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു.
