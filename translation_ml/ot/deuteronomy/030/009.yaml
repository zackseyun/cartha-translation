revisions:
- from: നിന്റെ കൈയുടെ സകല പ്രവൃത്തിയിലും[a]—നിന്റെ ഗർഭഫലത്തിലും നിന്റെ കന്നുകാലികളുടെ ഫലത്തിലും നിന്റെ നിലത്തിന്റെ വിളവിലും—നിന്റെ ദൈവമായ യഹോവ നിനക്കു നന്മയ്ക്കായി സമൃദ്ധി നൽകും. നിന്റെ പിതാക്കന്മാരിൽ സന്തോഷിച്ചതുപോലെ യഹോവ വീണ്ടും നിന്റെമേൽ സന്തോഷിച്ചു നിനക്കു നന്മ ചെയ്യും.[b]
  to: നിന്റെ കൈയുടെ സകല പ്രവൃത്തിയിലും[a], നിന്റെ ഗർഭഫലത്തിലും, നിന്റെ കന്നുകാലികളുടെ ഫലത്തിലും, നിന്റെ നിലത്തിന്റെ വിളവിലും നിന്റെ ദൈവമായ യാഹ്‌വെ നിനക്കു നന്മയ്ക്കായി സമൃദ്ധി നൽകും. നിന്റെ പിതാക്കന്മാരെക്കുറിച്ച്[b] സന്തോഷിച്ചതുപോലെ, യാഹ്‌വെ നിനക്കു നന്മയ്ക്കായി വീണ്ടും നിന്നെക്കുറിച്ച് സന്തോഷിക്കും.
  rationale: The revision restores the future, repeated divine rejoicing expressed by יָשׁוּב לָשׂוּשׂ and keeps לְטוֹב as ‘നിനക്കു നന്മയ്ക്കായി,’ without adding a separate promise not stated in this clause. It also aligns the divine-name rendering with the supplied Yahweh audit decision and moves footnote b to its referent.
