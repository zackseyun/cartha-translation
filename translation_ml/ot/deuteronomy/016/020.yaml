  variant: modern standard Malayalam
source:
  edition: WLC
  text: צֶ֥דֶק צֶ֖דֶק תִּרְדֹּ֑ף לְמַ֤עַן תִּֽחְיֶה֙ וְ/יָרַשְׁתָּ֣ אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: ml
  text: ന്യായം, ന്യായം നീ പിന്തുടരണം[a]. അതുവഴി നീ ജീവിക്കുകയും നിന്റെ ദൈവമായ യഹ്‌വേ നിനക്കു നൽകുന്ന ദേശം കൈവശമാക്കുകയും ചെയ്യും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീതി, നീതി നീ പിന്തുടരണം.” എബ്രായത്തിലെ צֶדֶק എന്ന പദത്തിന് ന്യായം എന്നും നീതി എന്നും അർഥമാകാം; ഇവിടെ ന്യായവ്യവസ്ഥാസംബന്ധമായ സന്ദർഭത്തിന് ‘ന്യായം’ കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദേശം അവകാശമായി നേടുകയും.” എബ്രായക്രിയയ്ക്ക് ‘കൈവശമാക്കുക’ എന്നും ‘അവകാശമായി നേടുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: ന്യായം—ന്യായം തന്നേ
  rationale: നിയമനിർവഹണം, ന്യായാധിപന്മാർ, പക്ഷപാതം, കൈക്കൂലി എന്നിവയാണ് സമീപസന്ദർഭം; അതിനാൽ പൊതുവും ന്യായവ്യവസ്ഥാസംബന്ധവുമായ അർഥം വ്യക്തമാക്കാൻ ‘ന്യായം’ തെരഞ്ഞെടുത്തു. ആവർത്തനത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ പദം ആവർത്തിക്കുകയും ‘തന്നേ’ ചേർക്കുകയും ചെയ്തു.
- source_word: תִּרְדֹּף
  choice: നീ പിന്തുടരണം
  rationale: רדף എന്ന ക്രിയയിലെ സജീവമായി പിന്നാലെ ചെല്ലുക, അന്വേഷിച്ചു നേടാൻ ശ്രമിക്കുക എന്നീ ഭാവങ്ങളും നിയമനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְמַעַן
  choice: അങ്ങനെ
  rationale: കല്പനയെയും അതിന്റെ ഉദ്ദേശ്യഫലത്തെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ഉദ്ദേശ്യവും ഫലവും തമ്മിലുള്ള എബ്രായപ്രയോഗത്തിലെ തുറന്ന ബന്ധം അനാവശ്യമായി കർശനമാക്കുന്നില്ല.
- source_word: תִּחְיֶה
  choice: നീ ജീവിക്കുകയും
  rationale: തുടർന്നുള്ള ജീവൻ എന്ന അടിസ്ഥാനാർഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘സമൃദ്ധനാകുക’ പോലുള്ള അധികവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: וְיָרַשְׁתָּ
  choice: കൈവശമാക്കുകയും
  rationale: ദേശത്തെ സ്വീകരിച്ച് സ്വന്തമായി അധിവസിക്കുക എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു. ‘അവകാശമായി ലഭിക്കുക’ എന്ന ഉടമ്പടിസംബന്ധമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിലെ വാഗ്ദത്തദേശത്തെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിസംബന്ധമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണത്തിലൂടെ നൽകുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്ന ഉടമ്പടിബന്ധം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: נֹתֵן לָךְ
  choice: നിനക്കു നൽകുന്ന
  rationale: നിലവിലുള്ളതോ സവിശേഷമായി തുടരുന്നതോ ആയ ദാനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ കൃദന്തരൂപത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ന്യായവ്യവസ്ഥാസന്ദർഭത്തിൽ צֶדֶק എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ന്യായം
  alternative: നീതി
  rationale: തൊട്ടുമുമ്പുള്ള ഭാഗം ന്യായാധിപന്മാർ, പക്ഷപാതം, കൈക്കൂലി എന്നിവയെക്കുറിച്ചായതിനാൽ ഇവിടെ ന്യായവ്യവസ്ഥാസംബന്ധമായ അർഥമാണ് മുൻനിരയിൽ. എന്നാൽ ധാർമികനീതിയുടെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ മലയാളവായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണത്തിൽ അവതരിപ്പിക്കുന്നു.
- issue: לְמַעַן സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം/ഫലം
  choice: അങ്ങനെ ... ചെയ്യും
  alternative: '... ചെയ്യേണ്ടതിന്'
  rationale: എബ്രായത്തിൽ ഉദ്ദേശ്യവും പ്രതീക്ഷിതഫലവും അടുത്ത് ബന്ധിപ്പിച്ചിരിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് ആ ബന്ധം തുറന്ന നിലയിൽ സൂക്ഷിക്കാൻ ഫലസൂചകമായ രൂപം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ഊന്നൽനൽകുന്ന പദാവർത്തനം ഡാഷുകളും ‘തന്നേ’യും ഉപയോഗിച്ച് കേൾവിയിലും വായനയിലും വ്യക്തമാക്കിയിരിക്കുന്നു. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ/നിനക്കു’ ഉടനീളം നിലനിർത്തി.
