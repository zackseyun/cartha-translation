id: DEU.16.13
reference: Deuteronomy 16:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: חַ֧ג הַ/סֻּכֹּ֛ת תַּעֲשֶׂ֥ה לְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים בְּ/אָ֨סְפְּ/ךָ֔ מִֽ/גָּרְנְ/ךָ֖ וּ/מִ/יִּקְבֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/013.yaml
  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: ml
  text: നിന്റെ മെതിക്കളത്തിൽനിന്നും മുന്തിരിച്ചക്കിൽനിന്നും വിളവ് ശേഖരിക്കുമ്പോൾ, ഏഴു ദിവസം നീ കൂടാരപ്പെരുന്നാൾ[a] ആചരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കുടിലുകളുടെ പെരുന്നാൾ.’ എബ്രായപദം അക്ഷരാർഥത്തിൽ താൽക്കാലിക കൂടാരങ്ങളെയോ കുടിലുകളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: കൂടാരപ്പെരുന്നാൾ
  rationale: חַג ഒരു തീർഥാടനോത്സവത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിൽ ‘പെരുന്നാൾ’ അതിന്റെ ഔപചാരിക ഉത്സവസ്വഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു. סֻכּוֹת എന്നത് താൽക്കാലികമായി നിർമിക്കുന്ന കൂടാരങ്ങളെയോ കുടിലുകളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: תַּעֲשֶׂה לְךָ
  choice: നീ ... ആചരിക്കണം
  rationale: חַג എന്ന പദത്തോടൊപ്പം עשה ഇവിടെ അക്ഷരാർഥത്തിൽ ‘ഉണ്ടാക്കുക’ എന്നതല്ല, ഒരു പെരുന്നാൾ ആചരിക്കുക എന്ന നിയമപരമായ അർഥത്തിലാണ്. ‘ആചരിക്കണം’ കല്പനയുടെ ബലം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: בְּאָסְפְּךָ
  choice: വിളവ് ശേഖരിക്കുമ്പോൾ
  rationale: בְּ + infinitive construct കാലസംബന്ധമായി ‘ശേഖരിക്കുമ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്താം. സന്ദർഭം വിളവെടുപ്പായതിനാൽ മലയാളത്തിൽ ആവശ്യമായ വ്യക്തതയ്ക്കായി ‘വിളവ്’ ചേർത്തു; ‘ശേഖരിച്ചശേഷം’ എന്നു പറഞ്ഞ് ഹീബ്രുവിലേതിനേക്കാൾ കൃത്യമായ കാലക്രമം നിർബന്ധിച്ചിട്ടില്ല.
- source_word: מִגָּרְנְךָ
  choice: നിന്റെ മെതിക്കളത്തിൽനിന്നും
  rationale: גֹּרֶן ധാന്യം മെതിക്കുന്ന കളത്തെ സൂചിപ്പിക്കുന്നു. പൊതുവായി ‘ധാന്യവിളവ്’ എന്നു മാറ്റാതെ മൂലത്തിലെ മൂർത്തമായ കാർഷികചിത്രം നിലനിർത്തുന്നു.
- source_word: וּמִיִּקְבֶךָ
  choice: മുന്തിരിച്ചക്കിൽനിന്നും
  rationale: יֶקֶב മുന്തിരി ചവിട്ടിപ്പിഴിയുന്ന ചക്കിനെയോ അതോടു ചേർന്ന സംഭരണിയെയോ സൂചിപ്പിക്കാം. ‘മുന്തിരിച്ചക്ക്’ ആ കാർഷിക ഉപകരണത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. കല്പനയുടെ ഏകവചന അഭിസംബോധന ‘നീ/നിന്റെ’ എന്ന രൂപത്തിൽ നിലനിർത്തി; കാർഷികചിത്രങ്ങളും മൂലത്തിലെ കാലസംബന്ധമായ ചെറിയ തുറന്നത്വവും സംരക്ഷിച്ചു.
