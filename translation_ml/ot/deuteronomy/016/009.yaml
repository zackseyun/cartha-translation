id: DEU.16.9
reference: Deuteronomy 16:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שִׁבְעָ֥ה שָׁבֻעֹ֖ת תִּסְפָּר לָ֑/ךְ מֵ/הָחֵ֤ל חֶרְמֵשׁ֙ בַּ/קָּמָ֔ה תָּחֵ֣ל לִ/סְפֹּ֔ר שִׁבְעָ֖ה שָׁבֻעֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/009.yaml
  text: You shall count seven weeks for yourself; from the time the sickle begins to be put to the standing grain[a], you shall begin to count seven weeks.
translation:
  language: ml
  text: നീ നിനക്കായി ഏഴ് ആഴ്ചകൾ[a] എണ്ണണം. നിൽക്കുന്ന വിളയിൽ അരിവാൾ വെച്ചുതുടങ്ങുന്ന സമയംമുതൽ ഏഴ് ആഴ്ചകൾ എണ്ണിത്തുടങ്ങണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഏഴ് ഏഴുകൾ’; ഇവിടെ ഈ എബ്രായപ്രയോഗം ഏഴ് ആഴ്ചകളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת / שִׁבְעָה שָׁבֻעוֹת
  choice: ഏഴ് ആഴ്ചകൾ
  rationale: שָׁבוּעַ എന്ന പദത്തിന് ‘ഏഴിന്റെ ഒരു കാലയളവ്’ എന്ന പദോത്പത്തിബന്ധമുണ്ടെങ്കിലും, ഈ കലണ്ടർസന്ദർഭത്തിൽ അതിന്റെ സാധാരണ അർഥം ‘ആഴ്ച’ എന്നാണ്. ആവർത്തിക്കുന്ന രണ്ടു പ്രയോഗങ്ങളും ഒരേവിധം പരിഭാഷപ്പെടുത്തി.
- source_word: תִּסְפָּר לָךְ
  choice: നീ നിനക്കായി ... എണ്ണണം
  rationale: ספר എന്ന ക്രിയയുടെ നിർദേശാത്മക ശക്തി ‘എണ്ണണം’ എന്നു നൽകി; ലָךְ എന്ന വ്യക്തിപരമായ ദാതൃപ്രയോഗം ഒഴിവാക്കാതെ ‘നിനക്കായി’ എന്നു നിലനിർത്തി.
- source_word: מֵהָחֵל
  choice: വെച്ചുതുടങ്ങുന്ന സമയംമുതൽ
  rationale: מִן ചേർന്ന ക്രിയാനാമം എണ്ണലിന്റെ ആരംഭകാലം സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ സമയാരംഭപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: חֶרְמֵשׁ
  choice: അരിവാൾ
  rationale: ധാന്യം കൊയ്യാൻ ഉപയോഗിക്കുന്ന വളഞ്ഞ കൊയ്ത്തുപകരണത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; അതിനുള്ള സാധാരണ മലയാളപദം ‘അരിവാൾ’ ആണ്.
- source_word: בַּקָּמָה
  choice: നിൽക്കുന്ന വിളയിൽ
  rationale: קָמָה കൊയ്യപ്പെടാതെ വയലിൽ നിൽക്കുന്ന ധാന്യവിളയെ സൂചിപ്പിക്കുന്നു. ‘നിൽക്കുന്ന വിള’ മൂലപാഠത്തിന്റെ ദൃശ്യവും അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: תָּחֵל לִסְפֹּר
  choice: എണ്ണിത്തുടങ്ങണം
  rationale: ആരംഭം സൂചിപ്പിക്കുന്ന ഹിഫീൽ ക്രിയയും ‘എണ്ണുക’ എന്ന ക്രിയാനാമവും ചേർന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘എണ്ണിത്തുടങ്ങണം’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ‘നിനക്കായി’ അല്പം അടയാളപ്പെടുത്തിയ പ്രയോഗമാണെങ്കിലും എബ്രായത്തിലെ വ്യക്തിപരമായ ലָךְ നിലനിർത്താൻ ഉൾപ്പെടുത്തി. ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പുകുറി ‘standing grain’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം ‘seven weeks’ എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ, മലയാളത്തിൽ പ്രസക്തമായ ആദ്യത്തെ ‘ഏഴ് ആഴ്ചകൾ’ എന്നതിനുശേഷം ചേർത്തു.
