id: DEU.16.15
reference: Deuteronomy 16:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֗ים תָּחֹג֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה כִּ֣י יְבָרֶכְ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹ֤ל תְּבוּאָֽתְ/ךָ֙ וּ/בְ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔י/ךָ וְ/הָיִ֖יתָ אַ֥ךְ שָׂמֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: ml
  text: ഏഴു ദിവസം നിന്റെ ദൈവമായ യഹ്‌വേയ്ക്കായി, യഹ്‌വേ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത് നീ ഉത്സവം ആചരിക്കണം. കാരണം, നിന്റെ എല്ലാ വിളവിലും നിന്റെ കൈകളുടെ എല്ലാ പ്രവൃത്തികളിലും നിന്റെ ദൈവമായ യഹ്‌വേ നിന്നെ അനുഗ്രഹിക്കും; അങ്ങനെ നീ പൂർണമായി സന്തോഷിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ സന്തോഷം മാത്രമേ അനുഭവിക്കൂ” എന്നും “നീ തീർച്ചയായും സന്തോഷിക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പ്രയോഗം പൂർണവും കലർപ്പില്ലാത്തതുമായ സന്തോഷത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּחֹג
  choice: ഉത്സവം ആചരിക്കണം
  rationale: חגג എന്ന ക്രിയ തീർഥാടനോത്സവം ആചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ആഘോഷമെന്നതിനേക്കാൾ ഉത്സവപരമായ പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേയ്ക്കായി
  rationale: ל എന്ന ഉപസർഗം ഉത്സവം യഹ്‌വേയോടുള്ള സമർപ്പണമായി ആചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘യ്ക്കായി’ ഈ ദിശയും സമർപ്പണവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവിക നാമമായ יהוה ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: യഹ്‌വേ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത്
  rationale: ദൈവം തിരഞ്ഞെടുക്കുന്ന ആരാധനാസ്ഥലത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ഹീബ്രു ഘടന സ്വാഭാവിക മലയാളത്തിൽ അടുത്തായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: തുടർന്നുള്ള അനുഗ്രഹം ഉത്സവാചരണത്തിന്റെയും സന്തോഷത്തിന്റെയും കാരണമായി അവതരിപ്പിക്കുന്നതിനാൽ കാരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: יְבָרֶכְךָ
  choice: നിന്നെ അനുഗ്രഹിക്കും
  rationale: ברך എന്നത് ഉടമ്പടിസന്ദർഭത്തിലെ ദൈവിക അനുഗ്രഹത്തിന്റെ പതിവുപദമാണ്; സാമ്പത്തിക അഭിവൃദ്ധിയിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: תְּבוּאָתְךָ
  choice: നിന്റെ എല്ലാ വിളവിലും
  rationale: תבואה കൃഷിയിൽനിന്നുള്ള വിളവിനെയോ ഉൽപ്പാദനത്തെയോ വ്യാപകമായി സൂചിപ്പിക്കുന്നു; ധാന്യത്തിലേക്ക് മാത്രം പരിമിതപ്പെടുത്താതെ ‘വിളവ്’ സന്ദർഭോചിതമാണ്.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: നിന്റെ കൈകളുടെ എല്ലാ പ്രവൃത്തിയിലും
  rationale: അധ്വാനത്തെയും അതിന്റെ ഫലങ്ങളെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിലും മനസ്സിലാകുന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהָיִיתָ
  choice: അങ്ങനെ നീ ... ആയിരിക്കും
  rationale: മുൻപറഞ്ഞ അനുഗ്രഹത്തിന്റെ ഫലമോ പരിണതിയോ മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: אַךְ שָׂמֵחַ
  choice: തികച്ചും സന്തോഷവാനായിരിക്കും
  rationale: אַךְ എന്നതിന്റെ ഇവിടെ സാധ്യമായ ഊന്നൽ പൂർണവും കലർപ്പില്ലാത്തതുമായ സന്തോഷമായി നൽകുന്നു; അതിലെ നിയന്ത്രണാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവിക നാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവിക നാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘Yahweh’ എന്ന രൂപത്തിന് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: וְהָיִיתָ אַךְ שָׂמֵחַ എന്ന അവസാന വാക്യഭാഗത്തിന്റെ ശക്തി
  choice: അങ്ങനെ നീ തികച്ചും സന്തോഷവാനായിരിക്കും
  alternative: നീ സന്തോഷം മാത്രമുള്ളവനായിരിക്കും; നീ തീർച്ചയായും ആനന്ദിക്കും
  rationale: אַךְ എന്ന പദത്തിന് നിയന്ത്രണാർഥമായ ‘മാത്രം’ എന്നും ഊന്നൽ നൽകുന്ന ‘തീർച്ചയായും/തികച്ചും’ എന്നും ഗ്രഹിക്കാവുന്നതാണ്. വിളവിന്റെയും അനുഗ്രഹത്തിന്റെയും ഉത്സവസന്ദർഭത്തിൽ പൂർണമായ സന്തോഷത്തിനുള്ള ഊന്നൽ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചെങ്കിലും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ’ മൂലപാഠത്തിന്റെ വ്യാകരണരൂപം നിലനിർത്തുന്നു. ‘ഉത്സവം ആചരിക്കുക’, ‘വിളവ്’, ‘കൈകളുടെ പ്രവൃത്തി’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
