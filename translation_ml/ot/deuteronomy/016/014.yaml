id: DEU.16.14
reference: Deuteronomy 16:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׂמַחְתָּ֖ בְּ/חַגֶּ֑/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֗י וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male servant and your female servant, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: ml
  text: നിന്റെ ഉത്സവത്തിൽ നീ സന്തോഷിക്കണം—നീയും നിന്റെ മകനും നിന്റെ മകളും, നിന്റെ ആൺ അടിമയും പെൺ അടിമയും, നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന ലേവ്യനും പരദേശിയും[a] പിതാവില്ലാത്തവനും[b] വിധവയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരദേശി’ എന്നു പറയുന്നത് ഇസ്രായേല്യനല്ലാത്ത, അവരുടെ ഇടയിൽ താമസിക്കുന്ന ഒരാളെയാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘അനാഥൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം പിതാവിന്റെ സംരക്ഷണമില്ലാത്തതിനാലുള്ള ദുർബല സാമൂഹിക നിലയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: നീ സന്തോഷിക്കണം
  rationale: നിയമപരമായ നിർദേശസന്ദർഭത്തിൽ ഈ ക്രിയാരൂപം കല്പനയുടെ ഭാവം വഹിക്കുന്നു; ആ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּחַגֶּךָ
  choice: നിന്റെ ഉത്സവത്തിൽ
  rationale: חַג തീർത്ഥാടനവുമായി ബന്ധപ്പെട്ട ഉത്സവാഘോഷത്തെ സൂചിപ്പിക്കുന്നു; ‘ഉത്സവം’ ആരാധനാപരവും ആഘോഷപരവുമായ അർഥങ്ങൾ നിലനിർത്തുന്നു.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: നിന്റെ അടിമയും അടിമസ്ത്രീയും
  rationale: ഇവ ആശ്രിതമായ ബന്ധിത സാമൂഹിക പദവികളെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘ദാസൻ/ദാസി’ എന്നതിലുപരി സാമൂഹിക യാഥാർഥ്യം മറച്ചുവയ്ക്കാതെ വിവർത്തനം ചെയ്യുന്നു.
- source_word: וְהַגֵּר
  choice: പരദേശി
  rationale: ഇസ്രായേൽ സമൂഹത്തിനിടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത നിവാസിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക നിയമവിഭാഗങ്ങൾ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ അർഥം നൽകുന്നു.
- source_word: וְהַיָּתוֹם
  choice: പിതാവില്ലാത്തവൻ
  rationale: תורהയിലെ നിയമസന്ദർഭത്തിൽ പിതാവിന്റെ സംരക്ഷണം നഷ്ടപ്പെട്ടതിനാലുള്ള സാമൂഹിക ദുർബലതയെ ഈ പദം മുൻനിർത്തുന്നു.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന
  rationale: ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ’ എന്ന എബ്രായ പ്രയോഗം അധികാരപരിധിയിലുള്ള പട്ടണങ്ങളെയോ സമൂഹത്തെയോ സൂചിപ്പിക്കുന്ന രൂപകാലങ്കാരമാണ്; മലയാളത്തിൽ ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: עֶבֶד / אָמָה എന്ന ആശ്രിത ഗൃഹാംഗപദങ്ങളുടെ വിവർത്തനം
  choice: അടിമ / അടിമസ്ത്രീ
  alternative: ദാസൻ / ദാസി; വേലക്കാരൻ / വേലക്കാരി
  rationale: ഉത്സവസന്തോഷത്തിൽ ഉൾപ്പെടുത്തപ്പെടുന്ന ബന്ധിത പദവിയിലുള്ളവരെയാണ് പട്ടിക പറയുന്നത്. പൊതുവായ സേവനപദങ്ങൾ ഉപയോഗിച്ച് ആ സാമൂഹിക യാഥാർഥ്യം മൃദുവാക്കാതിരിക്കാനാണ് ഈ തിരഞ്ഞെടുപ്പ്.
- issue: גֵּר എന്ന സാമൂഹിക-നിയമപര പദം
  choice: പരദേശി
  alternative: കുടിയേറ്റക്കാരൻ; അന്യദേശനിവാസി
  rationale: സ്വദേശിയല്ലെങ്കിലും സമൂഹത്തിനിടയിൽ പാർക്കുന്ന വ്യക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക കുടിയേറ്റനിയമത്തിന്റെ സാങ്കേതിക വിഭാഗങ്ങൾ ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. എബ്രായത്തിലെ നീണ്ട പട്ടിക നിലനിർത്തിയെങ്കിലും ‘കവാടങ്ങൾക്കുള്ളിൽ’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്കായി ‘പട്ടണങ്ങളിൽ താമസിക്കുന്ന’ എന്നു അർഥാനുസൃതമായി നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
