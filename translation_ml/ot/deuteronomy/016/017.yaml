  text: אִ֖ישׁ כְּ/מַתְּנַ֣ת יָד֑/וֹ כְּ/בִרְכַּ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר נָֽתַן לָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: ml
  text: ഓരോ പുരുഷനും, തനിക്കു നൽകാൻ കഴിയുന്ന ദാനത്തിനനുസരിച്ച്, നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകിയ അനുഗ്രഹത്തിനനുസരിച്ച് കൊടുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ കൈയുടെ ദാനത്തിനനുസരിച്ച്’; ഒരാൾക്കു നൽകാൻ ലഭ്യമായതോ നൽകാൻ കഴിയുന്നതോ ആയ ദാനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ഓരോ പുരുഷനും
  rationale: ഏകവചന നാമം ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോ പുരുഷനും’ എന്നാണ്; മൂലപാഠത്തിലെ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: כְּמַתְּנַת יָדוֹ
  choice: തന്റെ കൈയുടെ ദാനത്തിനൊത്തവണ്ണം
  rationale: כְּ അനുപാതം സൂചിപ്പിക്കുന്നു; ‘കൈയുടെ ദാനം’ എന്ന എബ്രായ പ്രയോഗം ഒരാൾക്കു നൽകാൻ ലഭ്യമായതിനെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ ദൃശ്യരൂപം നിലനിർത്തി അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כְּבִרְכַּת
  choice: അനുഗ്രഹത്തിനൊത്തവണ്ണം
  rationale: כְּ ഇവിടെ ലഭിച്ച അനുഗ്രഹത്തിന്റെ അളവിനനുസരിച്ചുള്ള അനുപാതം സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി പദത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: നിനക്കു നൽകിയ
  rationale: ‘അനുഗ്രഹം’ എന്നതിനെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: '[implicit verb from context]'
  choice: കൊടുക്കണം
  rationale: എബ്രായ വാക്യത്തിൽ ക്രിയ തുറന്നുപറയുന്നില്ല; 16-ാം വാക്യത്തിലെ ‘വെറുംകൈയോടെ വരരുത്’ എന്ന സന്ദർഭവും വാക്യഘടനയും ആവശ്യപ്പെടുന്ന കൊടുക്കൽ എന്ന ആശയം മലയാളത്തിൽ പൂർണ്ണവാക്യത്തിനായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ശബ്ദാന്തരം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘തന്റെ കൈയുടെ ദാനം’ എന്ന മൂലഭാഷാചിത്രം നിലനിർത്തിയെങ്കിലും അതിന്റെ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. എബ്രായത്തിൽ സൂചിതമായിരിക്കുന്ന ക്രിയ മലയാളത്തിൽ ‘കൊടുക്കണം’ എന്നു പൂർത്തിയാക്കി.
