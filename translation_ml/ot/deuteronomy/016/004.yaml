  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: ml
  text: ഏഴു ദിവസത്തേക്ക് നിന്റെ പ്രദേശത്തെങ്ങും പുളിമാവ് കാണപ്പെടരുത്. ഒന്നാം ദിവസം[b] സന്ധ്യയ്ക്ക് നീ ബലിയായി അറുക്കുന്ന മാംസമൊന്നും[a] പ്രഭാതംവരെ ശേഷിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബലിമാംസമൊന്നും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘മാംസം’ എന്നാണ്; ബലിയുമായി ബന്ധപ്പെട്ട സന്ദർഭങ്ങളിൽ സാധാരണ ഉപയോഗിക്കുന്ന പദമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഒന്നാം ദിവസം’ എന്നത് ഉത്സവത്തിന്റെ ആരംഭത്തിലെ പെസഹാബലിയെ പ്രത്യേകമായി സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ എബ്രായപാഠം ‘പെസഹാ കുഞ്ഞാട്’ എന്നു വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרָאֶה
  choice: കാണപ്പെടരുത്
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണിപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് നിരോധനത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׂאֹר
  choice: പുളിമാവ്
  rationale: പെസഹാ നിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ മാവിനെ പുളിപ്പിക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളവായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദമാണിത്.
- source_word: בְּכָל גְּבֻלְךָ
  choice: നിന്റെ പ്രദേശത്തെങ്ങും
  rationale: גְּבוּל എന്ന പദത്തിന്റെ അതിർത്തി/അധികാരപ്രദേശം എന്ന അർഥത്തിൽ ഇവിടെ ഉദ്ദേശിക്കുന്ന മുഴുവൻ ഭൂപ്രദേശപരിധി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും രേഖപ്പെടുത്തുന്നു.
- source_word: יָלִין
  choice: പ്രഭാതംവരെ ശേഷിക്കരുത്
  rationale: രാത്രി മുഴുവൻ വെച്ചിട്ട് അടുത്ത പ്രഭാതത്തിലേക്ക് ശേഷിപ്പിക്കരുതെന്ന നിരോധനം വ്യക്തമായി നൽകുന്നു.
- source_word: מִן הַבָּשָׂר
  choice: മാംസത്തിൽ ഒന്നും
  rationale: ഭാഗസൂചകമായ מִן സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ബലിമാംസത്തെ സൂചിപ്പിക്കുന്ന בָּשָׂר എന്ന പദത്തിന്റെ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר תִּזְבַּח
  choice: നീ ബലിയായി അറുക്കുന്ന
  rationale: זבח എന്ന ക്രിയയിലെ ബലിയർപ്പണപരമായ അറുക്കൽ എന്ന ആശയം, വെറും അറുക്കൽ എന്നതിലേക്കോ പൊതുവായ അർപ്പണം എന്നതിലേക്കോ ചുരുക്കാതെ നൽകുന്നു.
- source_word: בָּעֶרֶב
  choice: സന്ധ്യയ്ക്ക്
  rationale: എബ്രായ കാലസൂചനയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: ഒന്നാം ദിവസം
  rationale: മൂലപാഠം പറയുന്നത്ര മാത്രം പരിഭാഷപ്പെടുത്തി, ‘ഉത്സവത്തിന്റെ’ എന്ന വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കുന്നു.
- source_word: לַבֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: ഇവിടെ ל സൂചിപ്പിക്കുന്ന സമയപരിധി വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘ഒന്നാം ദിവസം’ ബലിയായി അറുക്കുന്ന മാംസത്തിന്റെ കൃത്യമായ സൂചന
  choice: പ്രധാനപാഠത്തിൽ പെസഹാ കുഞ്ഞാട് എന്നു വ്യക്തമാക്കാതെ പൊതുവായി ബലിമാംസം എന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് പ്രത്യേകമായി പെസഹാബലിയെയോ പെസഹാ കുഞ്ഞാടിനെയോ സൂചിപ്പിക്കുന്നു എന്നു വ്യാഖ്യാനിക്കാം; അല്ലെങ്കിൽ ഉത്സവത്തിന്റെ ആരംഭദിവസവുമായി ബന്ധപ്പെട്ട ബലികളെ വിശാലമായി സൂചിപ്പിക്കുന്നു എന്നും വായിക്കാം.
  rationale: എബ്രായപാഠം ‘ഒന്നാം ദിവസം സന്ധ്യയ്ക്ക് നീ ബലിയായി അറുക്കുന്ന മാംസം’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ തർക്കവിഷയമായ സൂചന പ്രധാനപാഠത്തിൽ തീർപ്പാക്കാതെ മൂലത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ/നീ’ നിലനിർത്തി. കർമണിപ്രയോഗവും മൂലപാഠത്തിലെ വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിച്ചുകൊണ്ട് അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി.
