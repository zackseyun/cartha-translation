id: DEU.16.21
reference: Deuteronomy 16:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תִטַּ֥ע לְ/ךָ֛ אֲשֵׁרָ֖ה כָּל עֵ֑ץ אֵ֗צֶל מִזְבַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר תַּעֲשֶׂה לָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: ml
  text: നിനക്കായി നീ ഉണ്ടാക്കുന്ന നിന്റെ ദൈവമായ യഹോവയുടെ യാഗപീഠത്തിനരികെ, ഏതെങ്കിലും വൃക്ഷരൂപത്തിലുള്ള ഒരു അശേരയെ നിനക്കായി നടരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശേരസ്തംഭം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പദമായ ‘അശേര’ ദേവിയെ മാത്രമല്ല, അശേരാദേവിയുമായി ബന്ധപ്പെട്ട ഒരു ആരാധനാവസ്തുവിനെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: תִטַּע
  choice: നട്ടുപിടിപ്പിക്കരുത്
  rationale: נטע എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘നടുക’ നിലനിർത്തുന്നു. അശേര ഒരു ജീവനുള്ള വൃക്ഷമോ മരത്തിൽനിന്നുണ്ടാക്കിയ ആരാധനാവസ്തുവോ ആയിരിക്കാമെന്ന ഉറവിടത്തിലെ ദൃശ്യഭാവവും ഇതിലൂടെ സംരക്ഷിക്കപ്പെടുന്നു.
- source_word: אֲשֵׁרָה
  choice: അശേര
  rationale: ഈ പദം അശേര എന്ന ദേവിയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാം. ‘അശേര’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നത് ഈ അർഥസന്ദിഗ്ധതയെ അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: כָּל עֵץ
  choice: ഏതുതരം മരത്തിൽനിന്നുള്ളതായാലും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഏതു മരം/എല്ലാ മരവും.’ അശേരയോടുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുമ്പോഴും മരം അല്ലെങ്കിൽ മരവസ്തു എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: אֵצֶל
  choice: അരികെ
  rationale: സ്ഥലപരമായ സമീപ്യം വ്യക്തമാക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: מִזְבַּח
  choice: യാഗപീഠം
  rationale: ബലികളും അർപ്പണങ്ങളും നടത്തുന്ന പീഠത്തിനുള്ള പതിവും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള ഉടമ്പടിസംബന്ധമായ അഭിസംബോധന സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: നീ നിനക്കായി ഉണ്ടാക്കുന്ന
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയ്ക്ക് ‘ഉണ്ടാക്കുക’ എന്നും לָּךְ എന്ന ആത്മബന്ധസൂചനയ്ക്ക് ‘നിനക്കായി’ എന്നും നൽകി ഉറവിടത്തിന്റെ ഘടന നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֲשֵׁרָה ദേവിയുടെ പേരായോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവായോ പരിഭാഷപ്പെടുത്തണമോ എന്നത്
  choice: പ്രധാനവാചകത്തിൽ ‘അശേര’ എന്ന ലിപ്യന്തരണം നിലനിർത്തി, അടിക്കുറിപ്പിൽ അർഥപരിധി വിശദീകരിച്ചു.
  alternative: ‘അശേരസ്തംഭം’ അല്ലെങ്കിൽ ‘അശേരയുടെ മരവിഗ്രഹം’
  rationale: സന്ദർഭത്തിൽ ഈ എബ്രായപദം ദേവിയെയോ അവളുടെ പ്രതീകമായ വൃക്ഷം, മരസ്തംഭം, അല്ലെങ്കിൽ മറ്റൊരു ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാം. ലിപ്യന്തരണം ഈ ദൈവശാസ്ത്രപരവും വസ്തുസംബന്ധവുമായ അർഥസന്ദിഗ്ധത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമശൈലി ഉപയോഗിച്ചു. രണ്ടാംപുരുഷ ഏകവചനമായ ‘നീ/നിന്റെ/നിനക്കായി’ ഉറവിടത്തിലെ നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു. ‘നട്ടുപിടിപ്പിക്കുക’ എന്ന പ്രയോഗം മരസംബന്ധമായ ദൃശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
