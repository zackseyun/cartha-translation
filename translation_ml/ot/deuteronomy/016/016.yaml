source:
  edition: WLC
  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: ml
  text: 'വർഷത്തിൽ മൂന്നു പ്രാവശ്യം നിന്റെ പുരുഷന്മാരെല്ലാം നിന്റെ ദൈവമായ യഹ്വേയുടെ സന്നിധിയിൽ, അവൻ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത്, ഹാജരാകണം[a]: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവത്തിലും ആഴ്ചകളുടെ ഉത്സവത്തിലും കുടിലുകളുടെ ഉത്സവത്തിലും[b]. ആരും യഹ്വേയുടെ സന്നിധിയിൽ വെറുംകൈയോടെ[c] ഹാജരാകരുത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാണപ്പെടണം.” എബ്രായ ക്രിയ അക്ഷരാർഥത്തിൽ നിഷ്ക്രിയ/ആത്മനേപദസാദ്ധ്യതയുള്ള നിഫാൽ രൂപമാണ്; എന്നാൽ ഇവിടെ ദൈവസന്നിധിയിൽ സ്വയം ഹാജരാകുക എന്ന പ്രയോഗാർഥത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: “കുടിലുകളുടെ ഉത്സവം” പരമ്പരാഗതമായി “കൂടാരപ്പെരുന്നാൾ” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: alternative_reading
  - marker: c
    text: “വെറുംകൈയോടെ” എന്നത് ആവശ്യമായ സമ്മാനമോ വഴിപാടോ കൂടാതെ വരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: ഹാജരാകണം
  rationale: ראה എന്ന ക്രിയയുടെ നിഫാൽ രൂപം അക്ഷരാർഥത്തിൽ ‘കാണപ്പെടുക’ എന്നു വരാമെങ്കിലും, തീർഥാടനോത്സവങ്ങളുടെ ഈ നിയമസന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ സ്വയം ഹാജരാകുക എന്ന പ്രയോഗാർഥമാണ്. ‘ഹാജരാകണം’ ആ ബാധ്യത സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: כָל זְכוּרְךָ
  choice: നിന്റെ പുരുഷന്മാരെല്ലാം
  rationale: എബ്രായ പദപ്രയോഗം പുരുഷന്മാരെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. നിയമത്തിന്റെ ലിംഗപരമായ പരിധി പൊതുവാക്കി മാറ്റാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ
  rationale: ‘മുഖത്തിനു മുമ്പിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം സാന്നിധ്യത്തിലാണ്. ‘സന്നിധിയിൽ’ എന്നത് ദൈവസാന്നിധ്യത്തിന്റെ ഉടമ്പടിസംബന്ധമായ ഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: അവൻ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത്
  rationale: ആരാധനയ്ക്കുള്ള സ്ഥലം ദൈവം തന്നെയാണ് തിരഞ്ഞെടുക്കുന്നത് എന്ന ആവർത്തിത ദ്വിതീയോപദേശ ആശയം ലളിതമായി നിലനിർത്തുന്നു. എബ്രായ അപൂർണ്ണക്രിയയുടെ സന്ദർഭോചിതമായ ഭാവി/നിശ്ചിത പ്രവർത്തനബലം മലയാള വർത്തമാനരൂപത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: חַג הַמַּצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവം
  rationale: ഉത്സവനാമത്തിലെ മַצּוֹת എന്നത് പുളിപ്പില്ലാത്ത അപ്പങ്ങളെ സൂചിപ്പിക്കുന്നു; പേര് സുതാര്യമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: חַג הַשָּׁבֻעוֹת
  choice: ആഴ്ചകളുടെ ഉത്സവം
  rationale: പിൽക്കാല ഗ്രീക്ക് നാമമായ ‘പെന്തെക്കോസ്ത്’ കൊണ്ടുവരാതെ എബ്രായ ഉത്സവനാമം നേരിട്ട് നൽകുന്നു.
- source_word: חַג הַסֻּכּוֹת
  choice: കുടിലുകളുടെ ഉത്സവം
  rationale: סֻכּוֹת താൽക്കാലിക കുടിലുകളെയോ മറപ്പുരകളെയോ സൂചിപ്പിക്കുന്നു. ‘കുടിലുകൾ’ മൂലപദത്തെ ‘കൂടാരങ്ങൾ’ എന്നതിനെക്കാൾ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: רֵיקָם
  choice: വെറുംകൈയോടെ
  rationale: ആവശ്യമായ സമ്മാനമോ വഴിപാടോ ഇല്ലാതെ വരുന്നതിനെ സൂചിപ്പിക്കുന്ന ആരാധനാസന്ദർഭത്തിലെ പ്രയോഗാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- issue: כָל זְכוּרְךָ എന്നതിലെ ലിംഗനിർദ്ദിഷ്ട നിയമബാധ്യത
  choice: നിന്റെ പുരുഷന്മാരെല്ലാം
  alternative: നിങ്ങളെല്ലാവരും
  rationale: മൂലപാഠം പൊതുവായി എല്ലാവരെയും അല്ല, പുരുഷന്മാരെയാണ് നിർദ്ദിഷ്ടമായി പരാമർശിക്കുന്നത്. അതിനാൽ നിയമപരിധി ലിംഗനിരപേക്ഷമാക്കി മാറ്റുന്നില്ല.
- issue: יֵרָאֶה എന്ന നിഫാൽ രൂപത്തിന്റെ വ്യാഖ്യാനം
  choice: യഹോവയുടെ സന്നിധിയിൽ ഹാജരാകണം
  alternative: യഹോവയുടെ സന്നിധിയിൽ കാണപ്പെടണം
  rationale: വ്യാകരണരൂപത്തിലെ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തിക്കൊണ്ട്, തീർഥാടനോത്സവസന്ദർഭത്തിലെ അംഗീകരിക്കപ്പെട്ട പ്രയോഗാർഥം മുഖ്യപാഠത്തിൽ നൽകുന്നു; ഇതിലൂടെ ദൈവമുമ്പാകെ വരേണ്ട ബാധ്യത വ്യക്തമാകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ഏകവചന അഭിസംബോധന ‘നിന്റെ’ എന്ന രൂപത്തിൽ നിലനിർത്തി. ഉത്സവനാമങ്ങൾ പിൽക്കാല സഭാപദാവലിക്ക് പകരം എബ്രായ നാമങ്ങളുടെ അർഥം സുതാര്യമായി നൽകുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
