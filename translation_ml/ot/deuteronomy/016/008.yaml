  source_fidelity: The temporal instruction, unleavened bread, divine name, and work prohibition are conveyed accurately. However, the main-text rendering “വിശുദ്ധമായ സമാപനയോഗം” makes both ‘holy’ and especially ‘closing’ more definite than עֲצֶרֶת itself requires. Its likely concluding-festival nuance should remain in the footnote rather than govern the primary rendering.
