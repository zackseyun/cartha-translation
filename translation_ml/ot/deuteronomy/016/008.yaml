    rationale: The Hebrew denotes a formal/solemn festal assembly. Although a concluding-assembly nuance is plausible in context, it is not sufficiently certain to be made the sole main-text meaning; ‘holy’ is likewise interpretive rather than explicit in the noun.
  - severity: low
    issue: “തിന്നണം” is less suited to the otherwise dignified legal register.
    rationale: “കഴിക്കണം” is a more neutral modern-standard Malayalam expression for the prescribed eating of unleavened bread.
