  text: שֵׁ֥שֶׁת יָמִ֖ים תֹּאכַ֣ל מַצּ֑וֹת וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י עֲצֶ֨רֶת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תַעֲשֶׂ֖ה מְלָאכָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
translation:
  language: ml
  text: ആറു ദിവസം പുളിപ്പില്ലാത്ത അപ്പം കഴിക്കണം; ഏഴാം ദിവസം നിന്റെ ദൈവമായ യഹ്‌വേക്കുള്ള ഒരു ഗൗരവമേറിയ സമ്മേളനം[a] ഉണ്ടായിരിക്കണം. അന്നു യാതൊരു ജോലിയും ചെയ്യരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിശുദ്ധ സമ്മേളനം” അല്ലെങ്കിൽ “സമാപന സമ്മേളനം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഔപചാരികമായ ഒരു ഉത്സവസമ്മേളനത്തെ സൂചിപ്പിക്കുന്നു; ഉത്സവം സമാപിപ്പിക്കുന്ന സമ്മേളനം എന്ന സൂചനയും ഇതിൽ ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ആറു ദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: תֹּאכַל
  choice: തിന്നണം
  rationale: നിയമസന്ദർഭത്തിലെ നിർദേശാത്മക അപൂർണക്രിയയുടെ ബാധ്യത വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: പെസഹാ പശ്ചാത്തലത്തിലുള്ള സാധാരണ അർഥം; ലിപ്യന്തരണത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: വാവ് എന്ന ലളിതസംയോജകത്തിന്റെ തുടർച്ച നിലനിർത്തുന്നു; മലയാളത്തിലെ അർധവിരാമത്തിനു ശേഷമുള്ള സ്വാഭാവിക ഒഴുക്കിൽ അധിക സംയോജകം ആവശ്യമില്ല.
- source_word: עֲצֶרֶת
  choice: വിശുദ്ധമായ സമാപനയോഗം
  rationale: ഔപചാരികമായ ഉത്സവസമ്മേളനത്തെയും ഉത്സവത്തിന്റെ സമാപനസ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു; പദത്തിന്റെ അർഥപരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേക്കായി
  rationale: ലാമെദിന്റെ സമർപ്പണബന്ധം ‘-ക്കായി’ എന്നു നൽകുകയും ദൈവനാമവും ഉടമ്പടിസംബന്ധമായ പ്രയോഗവും നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: അന്നു യാതൊരു ജോലിയും ചെയ്യരുത്
  rationale: തൊഴിൽ/വേല നിരോധിക്കുന്ന വാക്യം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘അന്നു’ സന്ദർഭത്തിൽ നിന്നുള്ള വ്യക്തത നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ പേരായിത്തന്നെ സംരക്ഷിക്കുന്നു.
- issue: עֲצֶרֶת എന്ന ഉത്സവപദത്തിന്റെ സ്വഭാവം
  choice: വിശുദ്ധമായ സമാപനയോഗം
  alternative: ഗൗരവമേറിയ സമ്മേളനം; വിശുദ്ധസമ്മേളനം
  rationale: സന്ദർഭത്തിൽ ഇത് യഹ്‌വേക്കായി വേർതിരിച്ച ഔപചാരിക ഉത്സവയോഗമാണ്; അതേസമയം ‘സമാപന’ എന്ന സാധ്യത മാത്രമായി അർഥം പരിമിതപ്പെടുത്താതിരിക്കാൻ അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകൾ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ദൈവനാമം ‘യഹ്‌വേ’ എന്നു നിലനിർത്തി. עֲצֶרֶת എന്ന പദത്തിലെ ആരാധനാപരവും സമാപനപരവുമായ അർഥസാധ്യതകൾ മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
