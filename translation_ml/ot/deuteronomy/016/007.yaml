reference: Deuteronomy 16:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בִשַּׁלְתָּ֙ וְ/אָ֣כַלְתָּ֔ בַּ/מָּק֕וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ וּ/פָנִ֣יתָ בַ/בֹּ֔קֶר וְ/הָלַכְתָּ֖ לְ/אֹהָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/007.yaml
  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത് നീ അതു പാകം ചെയ്ത് ഭക്ഷിക്കണം. രാവിലെ നീ മടങ്ങി നിന്റെ കൂടാരങ്ങളിലേക്കു പോകണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: നീ അതു പാകംചെയ്തു
  rationale: בשל എന്ന ക്രിയയ്ക്ക് ഇവിടെ പെസഹാബലിയെ ഭക്ഷണത്തിനായി പാകംചെയ്യുക എന്ന വിശാലമായ അർഥമാണ്; ‘വേവിക്കുക’ എന്നത് പാചകരീതി അനാവശ്യമായി ചുരുക്കാനിടയുള്ളതിനാൽ ‘പാകംചെയ്യുക’ സ്വീകരിച്ചു.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: നിന്റെ ദൈവമായ യഹോവ അതിനായി തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തുവെച്ച്
  rationale: בּוֹ എന്ന സർവനാമഘടകം ഇംഗ്ലീഷ് POBയിലെ ‘for it’ എന്ന ബന്ധം പിന്തുടർന്ന് ബലിക്കായി തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
- source_word: וּפָנִיתָ בַבֹּקֶר
  choice: രാവിലെ നീ മടങ്ങി
  rationale: פנה എന്നതിന്റെ അക്ഷരാർഥമായ ‘തിരിയുക’ ഇവിടെ യാത്രതിരിച്ചു മടങ്ങുക എന്ന സന്ദർഭാർഥത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לְאֹהָלֶיךָ
  choice: നിന്റെ കൂടാരങ്ങളിലേക്കു
  rationale: ബഹുവചനമായ ‘കൂടാരങ്ങൾ’ നിലനിർത്തി; ഇത് താമസസ്ഥലങ്ങളെയോ പാളയങ്ങളെയോ സൂചിപ്പിക്കാമെങ്കിലും മൂലപാഠത്തിന്റെ ദൃശ്യഭാഷ സംരക്ഷിച്ചു.
theological_decisions:
- issue: ദൈവനാമമായ יהוהയുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം തുറന്നുവെക്കാനും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കാനും ‘യഹോവ’ സ്വീകരിച്ചു; ഏതെങ്കിലും പ്രത്യേക സഭാപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: തിരഞ്ഞെടുക്കപ്പെട്ട സ്ഥലത്തോടുള്ള בּוֹയുടെ ബന്ധം
  choice: അതിനായി തിരഞ്ഞെടുക്കുന്ന സ്ഥലം
  alternative: തിരഞ്ഞെടുക്കുന്ന സ്ഥലം / അവിടെ
  rationale: വാക്യഘടനയിലെ സർവനാമത്തെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുകയും നൽകിയിരിക്കുന്ന ഓഡിറ്റുചെയ്ത ഇംഗ്ലീഷ് പാളിയിലെ ‘for it’ നിലനിർത്തുകയും ചെയ്തു; അതിന്റെ സൂചന പെസഹാബലിയിലേക്കാണെന്ന വായന സ്വീകരിച്ചെങ്കിലും അധിക വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപ്രമാണത്തിന്റെ നിർദ്ദേശഭാവം ‘-ണം’ രൂപത്തിൽ നൽകി; അനാവശ്യമായ പുരാതന പദക്രമം ഒഴിവാക്കി.
