source:
  edition: WLC
  text: לֹ֥א תוּכַ֖ל לִ/זְבֹּ֣חַ אֶת הַ/פָּ֑סַח בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/005.yaml
  text: You may not sacrifice the Passover in any one of your gates that Yahweh your God is giving you[b][a],
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ നിനക്കു തരുന്ന പട്ടണങ്ങളിൽ ഏതെങ്കിലും ഒന്നിൽവെച്ച് നീ പെസഹാബലി അർപ്പിക്കരുത്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പെസഹാ.” ഇവിടെ ഈ പദം പെസഹായ്ക്കുള്ള ബലിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “നിന്റെ വാതിലുകളിൽ ഒന്നിൽ.” “വാതിൽ” ഇവിടെ ഒരു പട്ടണത്തെയോ വാസസ്ഥലത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: നീ … അർപ്പിക്കരുത്
  rationale: יכולת + infinitive എന്ന നിയമസന്ദർഭത്തിലെ പ്രയോഗം വെറും കഴിവില്ലായ്മയല്ല, നിരോധനമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘അർപ്പിക്കരുത്’ അതിന്റെ സ്വാഭാവികമായ രൂപമാണ്.
- source_word: לִזְבֹּחַ
  choice: ബലി അർപ്പിക്കുക
  rationale: ആരാധനാപരമായ സന്ദർഭത്തിൽ זבח ബലിമൃഗത്തെ അറുത്ത് ബലിയായി അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ബലി അർപ്പിക്കുക’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: הַפָּסַח
  choice: പെസഹാബലി
  rationale: פסח ഉത്സവത്തെയോ ബലിമൃഗത്തെയോ ബലിയെയോ സൂചിപ്പിക്കാം. ഇവിടെ זבח എന്ന ക്രിയയോടൊപ്പം വരുന്നതിനാൽ ബലിയെന്ന അർഥം പ്രസക്തമാണ്; എങ്കിലും പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: നിന്റെ ഏതെങ്കിലും പട്ടണത്തിൽവെച്ച്
  rationale: שער എന്നതിന്റെ അക്ഷരാർഥം ‘വാതിൽ’ ആണെങ്കിലും ആവർത്തനപുസ്തകത്തിൽ അത് പലപ്പോഴും വാസസ്ഥലമായ പട്ടണത്തെ സൂചിപ്പിക്കുന്ന ലക്ഷണാലങ്കാരമാണ്. സാധാരണ മലയാളവായനക്കാർക്കായി ഉദ്ദേശ്യാർഥം മുഖ്യവാചകത്തിൽ നൽകി, എബ്രായ ചിത്രണം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: നിന്റെ ദൈവമായ യഹോവ നിനക്കു തരുന്ന
  rationale: נֹתֵן എന്ന participle തുടരുന്നതോ സവിശേഷമായി സംഭവിക്കുന്നതോ ആയ ദാനത്തെ സൂചിപ്പിക്കുന്നു; ‘തരുന്ന’ അത് സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു. ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനനാമംകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: הַפָּסַח എന്നതിന്റെ സൂചന
  choice: പെസഹാബലി
  alternative: പെസഹാ
  rationale: ‘ബലിയർപ്പിക്കുക’ എന്ന ക്രിയാസന്ദർഭം ഇവിടെ പെസഹാബലിയെയാണ് മുൻനിർത്തുന്നത്; എന്നാൽ פסח എന്ന പദത്തിന് ഉത്സവം, ബലിമൃഗം, ബലി എന്നീ ബന്ധമുള്ള സൂചനകൾ ഉള്ളതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ഏകവചന രണ്ടാംപുരുഷ അഭിസംബോധനയായ ‘നീ/നിന്റെ/നിനക്കു’ നിലനിർത്തി. എബ്രായത്തിലെ ‘വാതിലുകൾ’ എന്ന ലക്ഷണാലങ്കാരം മുഖ്യവാചകത്തിൽ ‘പട്ടണം’ എന്നു വ്യക്തീകരിക്കുകയും അടിക്കുറിപ്പിൽ അക്ഷരാർഥം സംരക്ഷിക്കുകയും ചെയ്തു.
