source:
  edition: WLC
  text: וְ/שָׂמַחְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֣ וּ/בִתֶּ/ךָ֮ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ/ךָ֒ וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֣ר בְּ/קִרְבֶּ֑/ךָ בַּ/מָּק֗וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male servant, your female servant, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വേ തന്റെ നാമം അവിടെ വസിപ്പിക്കേണ്ടതിന് തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തു വെച്ച്, നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സന്നിധിയിൽ നീയും നിന്റെ മകനും മകളും നിന്റെ ആൺഅടിമയും പെൺഅടിമയും നിന്റെ പട്ടണങ്ങളിൽ ഉള്ള ലേവ്യനും നിന്റെ ഇടയിലുള്ള പരദേശിയും[a] അനാഥനും[b] വിധവയും സന്തോഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘താമസക്കാരനായ വിദേശി.’ എബ്രായപദം ഇസ്രായേലിന്റെ സാമൂഹികക്രമത്തിനുള്ളിൽ അവരോടൊപ്പം താമസിച്ചിരുന്ന ഇസ്രായേല്യനല്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അനാഥൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: ആനന്ദിക്കണം
  rationale: שׂמח എന്ന ക്രിയയുടെ ആനന്ദം/സന്തോഷം എന്ന അർഥവും നിയമോപദേശത്തിന്റെ നിർദേശസ്വരവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי
  choice: സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യത്തിൽ ആരാധനാപൂർവം ആനന്ദിക്കുന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְעַבְדְּךָ / וַאֲמָתֶךָ
  choice: നിങ്ങളുടെ അടിമയും അടിമസ്ത്രീയും
  rationale: ഈ ഗൃഹനിയമ പശ്ചാത്തലത്തിൽ സൂചിപ്പിക്കുന്ന ബന്ധിത സാമൂഹികസ്ഥിതിയും ലിംഗവ്യത്യാസവും മയപ്പെടുത്താതെ പ്രകടമാക്കുന്നു.
- source_word: בִּשְׁעָרֶיךָ
  choice: നിങ്ങളുടെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന
  rationale: അക്ഷരാർഥമായ ‘നിങ്ങളുടെ കവാടങ്ങളിൽ’ എന്നത് ആവർത്തനപുസ്തകത്തിലെ നിയമപ്രയോഗത്തിൽ പ്രാദേശിക പട്ടണങ്ങളെയോ സമൂഹങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ലക്ഷ്യഭാഷയിൽ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְהַגֵּר
  choice: പരദേശി
  rationale: ഇസ്രായേലിന്റെ സമൂഹത്തിനുള്ളിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും മാന്യവുമായ പദം; സാമൂഹിക-നിയമപരമായ പ്രത്യേകത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהַיָּתוֹם
  choice: അനാഥൻ
  rationale: പിതൃരഹിതൻ എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപത്തിനുപകരം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദം ഉപയോഗിക്കുന്നു.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ
  rationale: ഹിഫീൽ കാരകഭാവം നിലനിർത്തുകയും ദൈവത്തിന്റെ അതീതതയും തിരഞ്ഞെടുത്ത സ്ഥലത്തെ ഉടമ്പടിസാന്നിധ്യവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാള വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- issue: עבד/אמה എന്ന ഗൃഹാശ്രിത പദങ്ങൾ
  choice: അടിമ / അടിമസ്ത്രീ
  alternative: ദാസൻ / ദാസി; വേലക്കാരൻ / വേലക്കാരി
  rationale: നിയമ-സാമൂഹിക പശ്ചാത്തലത്തിലെ ബന്ധിത സ്ഥിതി മറച്ചുവയ്ക്കാതെയും പദങ്ങളുടെ ലിംഗവ്യത്യാസം നിലനിർത്തിയും പരിഭാഷപ്പെടുത്തുന്നു.
- issue: ലְשַׁכֵּן שְׁמוֹ שָׁם എന്ന വിശുദ്ധസ്ഥാന സൂത്രവാക്യം
  choice: തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ
  alternative: തന്റെ നാമം അവിടെ വസിക്കേണ്ടതിന്; തന്റെ നാമം അവിടെ സ്ഥാപിക്കാൻ
  rationale: ക്രിയയുടെ കാരകഭാവം പ്രകടമാക്കുകയും ദൈവം തന്നെയാണ് തന്റെ നാമത്തെ അവിടെ വസിപ്പിക്കുന്നത് എന്ന മൂലപാഠസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാശൈലി. ഏകവചന അഭിസംബോധനയുടെ പ്രതിനിധാനസ്വഭാവം മലയാളത്തിൽ ആദരസൂചകമായ ‘നിങ്ങൾ’ രൂപത്തിലൂടെ നൽകുന്നു. പട്ടികയുടെ വ്യാപ്തി വ്യക്തമാക്കാൻ ദീർഘവിരാമം ഉപയോഗിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനങ്ങളിൽ ചേർത്തിട്ടുണ്ട്.
