revisions:
- from: നിങ്ങളും നിങ്ങളുടെ മകനും മകളും നിങ്ങളുടെ അടിമയും അടിമസ്ത്രീയും നിങ്ങളുടെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന ലേവ്യനും നിങ്ങളുടെ ഇടയിലുള്ള പരദേശിയും[a] അനാഥനും[b] വിധവയും—നിങ്ങളുടെ ദൈവമായ യഹോവ തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ[c] തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത്, നിങ്ങളുടെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ ആനന്ദിക്കണം.
  to: നിന്റെ ദൈവമായ യഹ്‌വേ തന്റെ നാമം അവിടെ വസിപ്പിക്കേണ്ടതിന് തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തു വെച്ച്, നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സന്നിധിയിൽ നീയും നിന്റെ മകനും മകളും നിന്റെ ആൺഅടിമയും പെൺഅടിമയും നിന്റെ പട്ടണങ്ങളിൽ ഉള്ള ലേവ്യനും നിന്റെ ഇടയിലുള്ള പരദേശിയും[a] അനാഥനും[b] വിധവയും സന്തോഷിക്കണം.
  rationale: The revision retains the complete Hebrew list, its inclusive conjunctions, the chosen-place formula, and the causative force of “make/cause his name to dwell.” It restores the source’s singular legal address, aligns the divine name with the required Yahweh rendering, and corrects the lexical-alternative footnote. Footnote c is retained as supplied, though the main text’s “വസിപ്പിക്കേണ്ടതിന്” already expresses the causative purpose clearly.
