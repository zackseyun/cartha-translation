id: DEU.16.10
reference: Deuteronomy 16:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חַ֤ג שָׁבֻעוֹת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ מִסַּ֛ת נִדְבַ֥ת יָדְ/ךָ֖ אֲשֶׁ֣ר תִּתֵּ֑ן כַּ/אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: ml
  text: പിന്നെ, നിന്റെ ദൈവമായ യഹ്‌വേക്കായി ആഴ്ചകളുടെ ഉത്സവം ആചരിക്കണം; നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ അനുഗ്രഹിക്കുന്നതിന് അനുസരിച്ച്, നിന്റെ കൈയിൽനിന്നുള്ള സ്വമേധാദാനത്തിന്റെ അളവനുസരിച്ച് നീ കൊടുക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: പിന്നെ ... ആചരിക്കണം
  rationale: ഉത്സവസന്ദർഭത്തിൽ עשה എന്ന ക്രിയയ്ക്ക് ‘ഉണ്ടാക്കുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ‘ആചരിക്കുക’ എന്നാണ് സ്വാഭാവിക അർഥം; വാവ് സന്ദർഭത്തിലെ ക്രമത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: חַג שָׁבֻעוֹת
  choice: ആഴ്ചകളുടെ ഉത്സവം
  rationale: ഉത്സവനാമത്തിലെ שָׁבֻעוֹת എന്ന ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപം.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേക്കായി
  rationale: לְ സൂചിപ്പിക്കുന്ന സമർപ്പണബന്ധം ‘-ക്കായി’ എന്നതിലൂടെ പ്രകടമാക്കുകയും ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִסַּת נִדְבַת יָדְךָ
  choice: നിന്റെ കൈയിൽനിന്നുള്ള സ്വമേധാദാനത്തിന്റെ അളവിൽ
  rationale: അപൂർവമായ מִסַּת എന്ന പദത്തിന്റെ ‘അളവ്/അനുപാതം’ എന്ന ആശയവും נִדְבָהയുടെ സ്വമേധാസ്വഭാവവും ‘കൈ’ എന്ന എബ്രായ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר תִּתֵּן
  choice: നീ കൊടുക്കണം
  rationale: നിയമനിർദേശത്തിന്റെ ബാധ്യത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ
  choice: അനുഗ്രഹിക്കുന്നതിന് അനുസരിച്ച്
  rationale: ദൈവം നൽകിയ അനുഗ്രഹത്തിന് ആനുപാതികമായിരിക്കണം ദാനം എന്ന ബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള നിയമനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലെന്ന കാര്യം അംഗീകരിച്ചുകൊണ്ടുള്ള സാധാരണ പുനർനിർമാണമാണിത്.
- issue: ദാനത്തിന്റെ സ്വഭാവവും അളവും
  choice: സ്വമേധാദാനത്തിന്റെ അളവിൽ; ലഭിച്ച അനുഗ്രഹത്തിന് അനുസരിച്ച്
  alternative: നിശ്ചിത കപ്പം; നിർബന്ധിത തുക
  rationale: നിർദേശം നൽകപ്പെടുന്നുണ്ടെങ്കിലും נִדְבָה ദാനത്തിന്റെ സ്വമേധാസ്വഭാവം സൂചിപ്പിക്കുന്നു; തുക ദൈവാനുഗ്രഹത്തിന് ആനുപാതികമാണെന്ന് വാക്യം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ആചരിക്കണം’, ‘സ്വമേധാദാനം’ എന്നീ പദങ്ങൾ നിയമനിർദേശത്തിന്റെ ഗൗരവവും വഴിപാടിന്റെ സ്വമേധാസ്വഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
