revisions:
- from: എന്നാൽ നിന്റെ ദൈവമായ യഹോവ തന്റെ നാമം വസിക്കേണ്ടതിന് തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തുമാത്രം—അവിടെ, സന്ധ്യയിൽ, സൂര്യൻ അസ്തമിക്കുമ്പോൾ, നീ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ട നിശ്ചിതസമയത്ത്, പെസഹാബലി അർപ്പിക്കണം.[a]
  to: എന്നാൽ, തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ നിന്റെ ദൈവമായ യഹോവ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തുമാത്രമേ നീ പെസഹാബലി അർപ്പിക്കാവൂ—സന്ധ്യയിൽ, സൂര്യൻ അസ്തമിക്കുമ്പോൾ, ഈജിപ്തിൽനിന്നുള്ള നിന്റെ പുറപ്പാടിന്റെ നിശ്ചിതസമയത്ത്.[a][b]
  rationale: The revision explicitly reflects the causative force of the Hebrew name-dwelling idiom, improves the Malayalam expression of the final construct phrase, and retains both legitimate lexical alternatives in clearly separated footnotes. It preserves the source's temporal wording and does not resolve the idiom into a doctrinal claim about divine presence.
