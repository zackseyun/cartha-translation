source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שַׁכֵּ֣ן שְׁמ֔/וֹ שָׁ֛ם תִּזְבַּ֥ח אֶת הַ/פֶּ֖סַח בָּ/עָ֑רֶב כְּ/ב֣וֹא הַ/שֶּׁ֔מֶשׁ מוֹעֵ֖ד צֵֽאתְ/ךָ֥ מִ/מִּצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: ml
  text: എന്നാൽ, തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ നിന്റെ ദൈവമായ യഹോവ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തുമാത്രമേ നീ പെസഹാബലി അർപ്പിക്കാവൂ—സന്ധ്യയിൽ, സൂര്യൻ അസ്തമിക്കുമ്പോൾ, ഈജിപ്തിൽനിന്നുള്ള നിന്റെ പുറപ്പാടിന്റെ നിശ്ചിതസമയത്ത്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പെസഹാബലിയെ അറുക്കണം.”
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “ഈജിപ്തിൽനിന്നുള്ള നിന്റെ പുറപ്പാടിന്റെ നിശ്ചിതസമയത്ത്.” “തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ” എന്നതിന് “തന്റെ നാമം അവിടെ സ്ഥാപിക്കാൻ” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: എന്നാൽ ... മാത്രമേ / സ്ഥലത്തുമാത്രം
  rationale: മുൻവാക്യത്തിലെ വിലക്കിനോടു വിരുദ്ധമായി ഒരു സ്ഥലംമാത്രം അനുവദിക്കുന്ന ശക്തമായ നിയന്ത്രണഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַמָּקוֹם
  choice: സ്ഥലം
  rationale: ആവർത്തനപുസ്തകത്തിലെ ദൈവം തിരഞ്ഞെടുക്കുന്ന ആരാധനാകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന സാധാരണയും കൃത്യവുമായ പദം.
- source_word: יִבְחַר
  choice: തിരഞ്ഞെടുക്കുന്ന
  rationale: നിയമവാക്യത്തിലെ ഭാവിപ്രസക്തി മലയാളത്തിലെ ബന്ധകക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; തിരഞ്ഞെടുപ്പ് ദൈവത്തിന്റേതാണെന്ന് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: തന്റെ നാമം വസിക്കേണ്ടതിന്
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ കാരണാർഥസാധ്യത പൂർണമായി ഇല്ലാതാക്കാതെ, ദൈവനാമം തിരഞ്ഞെടുത്ത സ്ഥലത്ത് വസിക്കുന്നു എന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: תִּזְבַּח אֶת הַפֶּסַח
  choice: പെസഹാബലി അർപ്പിക്കണം
  rationale: זבח എന്ന ക്രിയയിലെ ബലിക്കായി അറുക്കുക/ബലിയർപ്പിക്കുക എന്ന ആരാധനാപരമായ അർഥം നൽകുന്നു; הַפֶּסַח ഇവിടെ പെസഹാബലിയെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: בָּעָרֶב
  choice: സന്ധ്യയിൽ
  rationale: സമയസൂചനയെ ചുരുക്കവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിക്കുമ്പോൾ
  rationale: അക്ഷരാർഥത്തിലെ സൂര്യന്റെ പോകൽ/പ്രവേശിക്കൽ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: מוֹעֵד צֵאתְךָ מִמִּצְרָיִם
  choice: നീ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ട നിശ്ചിതസമയത്ത്
  rationale: מוֹעֵד എന്നതിന്റെ നിശ്ചയിക്കപ്പെട്ട സമയം എന്ന അർഥവും, പുറപ്പാടിന്റെ സമയത്തോടുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു; സംഭവം വാർഷികമായി അനുസ്മരിക്കുന്ന സമയമാണെന്ന സന്ദർഭം അധികവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: തിരഞ്ഞെടുത്ത സ്ഥലത്ത് ദൈവനാമം വസിക്കുന്നതിനെക്കുറിച്ചുള്ള ആവർത്തനപുസ്തകത്തിലെ പ്രയോഗം
  choice: തന്റെ നാമം വസിക്കേണ്ടതിന്
  alternative: തന്റെ നാമം അവിടെ വസിപ്പിക്കേണ്ടതിന് / തന്റെ നാമം അവിടെ സ്ഥാപിക്കേണ്ടതിന്
  rationale: ദൈവത്തിന്റെ അതീതത്വത്തെയും തിരഞ്ഞെടുത്ത സ്ഥലത്തെ ഉടമ്പടിസാന്നിധ്യത്തെയും തമ്മിലുള്ള പിരിമുറുക്കം തീർപ്പാക്കാതെ, മൂലത്തിലെ 'നാമം വസിക്കുക' എന്ന രൂപകം നിലനിർത്തുന്നു.
- issue: പെസഹയുടെ ക്രിയാപദം
  choice: പെസഹാബലി അർപ്പിക്കണം
  alternative: പെസഹാബലിയെ അറുക്കണം
  rationale: മൂലക്രിയയിൽ ബലിയർപ്പണവും അറുക്കലും ഉൾക്കൊള്ളാം. ആരാധനാപരമായ സന്ദർഭം പ്രധാനവാചകത്തിൽ വ്യക്തമാക്കുകയും കൂടുതൽ ഭൗതികമായ 'അറുക്കുക' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. 'യഹോവ', 'പെസഹാബലി' തുടങ്ങിയ വേദപാരമ്പര്യപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. സമയസൂചനകളുടെ കൂട്ടം മൂലത്തിലെ ക്രമത്തോട് അടുത്തുവെച്ചിരിക്കുന്നു.
