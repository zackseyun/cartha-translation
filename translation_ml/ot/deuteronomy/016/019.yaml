id: DEU.16.19
reference: Deuteronomy 16:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: ml
  text: നീതി വളച്ചൊടിക്കരുത്; മുഖം നോക്കി പക്ഷപാതം കാണിക്കരുത്[a]; കൈക്കൂലി വാങ്ങരുത്. കാരണം, കൈക്കൂലി ജ്ഞാനികളുടെ കണ്ണുകളെ അന്ധമാക്കുകയും നീതിമാന്മാരുടെ വാക്കുകളെ വളച്ചൊടിക്കുകയും ചെയ്യുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘മുഖങ്ങളെ തിരിച്ചറിയുക’; ഒരാളുടെ വ്യക്തിത്വമോ പദവിയോ ബന്ധമോ നോക്കി അനുകൂലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘നീതിമാന്മാരുടെ വാദത്തെയോ കേസിനെയോ വികലമാക്കുന്നു.’ എബ്രായപദം അവരുടെ വാക്കുകളെയോ നിയമസന്ദർഭത്തിൽ അവരുടെ വാദം/കേസിനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: നീതി വളച്ചൊടിക്കരുത്
  rationale: നിയമവിധിയെ ശരിയായ വഴിയിൽനിന്ന് തിരിക്കുകയോ വികലമാക്കുകയോ ചെയ്യുന്നതാണ് ഹിഫിൽ രൂപത്തിന്റെ ആശയം. ‘നീതി വളച്ചൊടിക്കുക’ എന്നത് നിയമസന്ദർഭവും എബ്രായത്തിലെ ദൃശ്യഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תַכִּיר פָּנִים
  choice: മുഖം നോക്കി പക്ഷപാതം കാണിക്കരുത്
  rationale: അക്ഷരാർഥം ‘മുഖങ്ങളെ തിരിച്ചറിയുക’ എന്നാണെങ്കിലും, ന്യായവിധിയിൽ വ്യക്തിയുടെ നിലയോ ബന്ധമോ നോക്കി അനുകൂലിക്കുക എന്ന എബ്രായ പ്രയോഗമാണിത്. ‘മുഖം നോക്കി’ എന്ന ദൃശ്യഭാവവും ‘പക്ഷപാതം’ എന്ന അർഥവും ചേർത്ത് വ്യക്തമാക്കുന്നു.
- source_word: שֹׁחַד
  choice: കൈക്കൂലി
  rationale: വിധിയെ സ്വാധീനിക്കാനുള്ള അഴിമതിപരമായ പ്രതിഫലമാണ് നിയമസന്ദർഭത്തിലെ അർഥം; ആധുനിക മലയാളത്തിൽ ‘കൈക്കൂലി’ അതിന്റെ ധാർമികവും നിയമപരവുമായ ശക്തി കൃത്യമായി നൽകുന്നു.
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: ജ്ഞാനികളുടെ കണ്ണുകളെ അന്ധമാക്കുന്നു
  rationale: മൂലത്തിലെ സജീവമായ രൂപകം മലയാളത്തിലും വ്യക്തവും സ്വാഭാവികവുമാകുന്നതിനാൽ നേരിട്ട് നിലനിർത്തി.
- source_word: חֲכָמִים
  choice: ജ്ഞാനികൾ
  rationale: ഇവിടത്തെ ബഹുവചനം ജ്ഞാനമുള്ള ആളുകളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘ജ്ഞാനികൾ’ ലിംഗപരമായി അനാവശ്യമായ ചുരുക്കം വരുത്താതെ അർഥം നൽകുന്നു.
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: നീതിമാന്മാരുടെ വാക്കുകളെ വളച്ചൊടിക്കുന്നു
  rationale: סלף എന്നതിന് വളച്ചൊടിക്കുക/വികലമാക്കുക എന്ന ആശയമുണ്ട്. דִּבְרֵי എന്നത് ‘വാക്കുകൾ’ എന്നും നിയമസന്ദർഭത്തിൽ ‘വാദം/കേസ്’ എന്നും ഗ്രഹിക്കാം; പ്രധാനപാഠത്തിൽ മൂലത്തോട് അടുത്ത ‘വാക്കുകൾ’ നിലനിർത്തി, നിയമപരമായ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: צַדִּיקִם
  choice: നീതിമാന്മാർ
  rationale: ധാർമികമായോ നിയമപരമായോ ശരിയായ നിലയിലുള്ളവരെ സൂചിപ്പിക്കാം. ‘നീതിമാന്മാർ’ ഈ വിശാലത നിലനിർത്തുന്നു; ‘നിരപരാധികൾ’ എന്നു പറഞ്ഞാൽ അർഥം അനാവശ്യമായി ചുരുങ്ങും.
theological_decisions:
- issue: דִּבְרֵי צַדִּיקִם എന്നതിന്റെ പരിധി
  choice: പ്രധാനപാഠത്തിൽ ‘നീതിമാന്മാരുടെ വാക്കുകൾ’
  alternative: ‘നീതിമാന്മാരുടെ വാദം/കേസ്’
  rationale: דִּבְרֵי എന്നതിന്റെ സാധാരണ അർഥം ‘വാക്കുകൾ’ ആണെങ്കിലും ന്യായാധിപത്യസന്ദർഭം ‘വാദം’ അല്ലെങ്കിൽ ‘കേസ്’ എന്ന ആശയം അനുവദിക്കുന്നു. അവ്യക്തത തീർപ്പാക്കാതെ പ്രധാനപാഠവും അടിക്കുറിപ്പും ചേർന്ന് രണ്ടും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ധാർമിക ശൈലി. എബ്രായത്തിലെ സമാന്തര നിരോധനങ്ങളും ‘അന്ധമാക്കുക/വളച്ചൊടിക്കുക’ എന്ന രൂപകങ്ങളും നിലനിർത്തി; അപൂർവമോ സഭാവിഭാഗവിശേഷമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
