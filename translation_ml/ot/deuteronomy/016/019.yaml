  source_fidelity: The Malayalam accurately renders all three prohibitions and the causal explanation in the Hebrew. ‘നീതി വളച്ചൊടിക്കരുത്’ preserves the forensic force of לֹא תַטֶּה מִשְׁפָּט; ‘മുഖം നോക്കി പക്ഷപാതം കാണിക്കരുത്’ correctly conveys the idiom ‘recognize faces’; and ‘കൈക്കൂലി’ is exact in this judicial context. The metaphors of a bribe blinding the wise and twisting the words of the righteous are retained. The alternative legal sense of דִּבְרֵי is appropriately preserved in the footnote rather than imposed on the main text.
