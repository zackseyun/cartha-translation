source:
  edition: WLC
  text: שֹׁפְטִ֣ים וְ/שֹֽׁטְרִ֗ים תִּֽתֶּן לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ לִ/שְׁבָטֶ֑י/ךָ וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם מִשְׁפַּט צֶֽדֶק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യാഹ്‌വെ നിനക്കു നൽകുന്ന നിന്റെ എല്ലാ പട്ടണവാതിലുകളിലും[a] നിന്റെ ഗോത്രങ്ങൾക്കായി നീ നിനക്കു ന്യായാധിപന്മാരെയും ഉദ്യോഗസ്ഥന്മാരെയും നിയമിക്കണം. അവർ ജനത്തിന് നീതിപൂർവം ന്യായം വിധിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ എല്ലാ പട്ടണങ്ങളിലും.’ അക്ഷരാർഥം, ‘നിന്റെ എല്ലാ വാതിലുകളിലും’; പട്ടണവാതിൽ പ്രദേശങ്ങൾ പൗരകാര്യങ്ങളുടെയും ന്യായവിധിയുടെയും കേന്ദ്രങ്ങളായി പ്രവർത്തിച്ചിരുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘ജനത്തിന് നീതിയുള്ള വിധി വിധിക്കണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: ന്യായാധിപന്മാർ
  rationale: നിയമപരമായ വിധികൾ പ്രസ്താവിക്കുന്നവരെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്ഥാപിതവുമായ നിയമപദമാണിത്.
- source_word: שֹׁטְרִים
  choice: ഉദ്യോഗസ്ഥന്മാർ
  rationale: ന്യായനിർവഹണവുമായി ബന്ധപ്പെട്ട ഭരണകാര്യ ഉദ്യോഗസ്ഥരെ സൂചിപ്പിക്കുന്ന പദം; അവരുടെ കൃത്യമായ ചുമതല അനാവശ്യമായി നിർവചിക്കാതെ സ്ഥാപനപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: תִּתֶּן
  choice: നിയമിക്കണം
  rationale: അക്ഷരാർഥം ‘വെക്കുക/നൽകുക’ എന്നാണെങ്കിലും ഇവിടെ ആളുകളെ ഔദ്യോഗിക സ്ഥാനത്ത് സ്ഥാപിക്കുന്നതാണ് സന്ദർഭാർഥം.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: എല്ലാ പട്ടണവാതിലുകളിലും
  rationale: ‘നിന്റെ എല്ലാ വാതിലുകളിലും’ എന്ന മൂലരൂപകത്തെ നിലനിർത്തിക്കൊണ്ട്, ഇവ പട്ടണങ്ങളുടെ പൗര-ന്യായകേന്ദ്രങ്ങളായിരുന്നുവെന്ന് ‘പട്ടണവാതിൽ’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനനാമത്തെ ഒരു പദവിനാമംകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: לִשְׁבָטֶיךָ
  choice: നിന്റെ ഗോത്രങ്ങൾക്കനുസരിച്ച്
  rationale: നിയമനങ്ങളുടെ ഗോത്രാടിസ്ഥാനത്തിലുള്ള ക്രമീകരണമോ വിതരണമോ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: അവർ ജനത്തിന് ... വിധിക്കണം
  rationale: നിയമപരമായ സന്ദർഭത്തിൽ ക്രിയയുടെ ന്യായവിധി എന്ന അർഥം നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിനായി ‘ജനത്തിന് വിധി വിധിക്കുക’ എന്നു രൂപപ്പെടുത്തി.
- source_word: מִשְׁפַּט צֶדֶק
  choice: നീതിയുള്ള വിധി
  rationale: നിയമപരമായ തീരുമാനവും ധാർമികമായ നേരും ഒരുപോലെ ഉൾക്കൊള്ളുന്ന സംയുക്തപ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിനാമം പകരംവയ്ക്കാതെ, മലയാളവായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലപാഠത്തിലെ ‘വാതിലുകൾ’ എന്ന സാംസ്കാരിക ദൃശ്യരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി. ഗോത്രാടിസ്ഥാനത്തിലുള്ള ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം നിർബന്ധമായി വ്യാഖ്യാനിക്കാതെ ‘ഗോത്രങ്ങൾക്കനുസരിച്ച്’ എന്നു നിലനിർത്തി.
