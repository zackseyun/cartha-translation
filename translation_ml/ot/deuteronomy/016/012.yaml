  terminology: “അടിമ” appropriately reflects the coercive bonded status denoted by עֶבֶד in the Egyptian setting. “ചട്ടങ്ങൾ” is a suitable accessible rendering of חֻקִּים. The footnote preserves the viable alternative “ദാസൻ” and explains the contextual choice without imposing doctrinal interpretation.
