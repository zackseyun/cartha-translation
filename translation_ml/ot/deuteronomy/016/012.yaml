id: DEU.16.12
reference: Deuteronomy 16:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זָ֣כַרְתָּ֔ כִּי עֶ֥בֶד הָיִ֖יתָ בְּ/מִצְרָ֑יִם וְ/שָׁמַרְתָּ֣ וְ/עָשִׂ֔יתָ אֶת הַֽ/חֻקִּ֖ים הָ/אֵֽלֶּה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/012.yaml
  text: Remember that you were a servant in Egypt[a], and keep and do these statutes.
translation:
  language: ml
  text: നീ ഈജിപ്തിൽ അടിമയായിരുന്നുവെന്ന് ഓർക്കുക[a]; ഈ ചട്ടങ്ങൾ പാലിക്കുകയും അനുഷ്ഠിക്കുകയും ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദാസൻ.’ എബ്രായത്തിലെ עֶבֶד എന്ന പദം ദാസനെയോ അടിമയെയോ സൂചിപ്പിക്കാം; ഇവിടെ ഈജിപ്തിലെ ഇസ്രായേലിന്റെ ബന്ധനാവസ്ഥ കണക്കിലെടുത്താണ് ‘അടിമ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: ഓർക്കുക
  rationale: നിർദേശസന്ദർഭത്തിൽ ആജ്ഞാസ്വഭാവമുള്ള ക്രിയാരൂപത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: ഓർക്കേണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘എന്ന്’ യോജിക്കുന്നു.
- source_word: עֶבֶד
  choice: അടിമ
  rationale: പദത്തിന് ദാസൻ എന്നും അടിമ എന്നും അർഥമാകാമെങ്കിലും, ഈജിപ്തിലെ നിർബന്ധിത അടിമത്തമാണ് ഇവിടെ പ്രസക്തം.
- source_word: הָיִיתָ
  choice: ആയിരുന്നു
  rationale: ഭൂതകാലത്തിലുള്ള അവസ്ഥയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: בְּמִצְרָיִם
  choice: ഈജിപ്തിൽ
  rationale: സ്ഥലസൂചന ലളിതമായും കൃത്യമായും നൽകുന്നു; മൂലത്തിൽ ‘ദേശം’ എന്ന പദമില്ല.
- source_word: וְשָׁמַרְתָּ
  choice: പാലിക്കുക
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ സന്ദർഭത്തിൽ കല്പനകളെ ശ്രദ്ധാപൂർവം അനുസരിക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: וְעָשִׂיתָ
  choice: അനുഷ്ഠിക്കുക
  rationale: ‘പാലിക്കുക’ എന്നതിനോടൊപ്പം, ചട്ടങ്ങൾ യഥാർഥത്തിൽ പ്രവൃത്തിയിലാക്കുന്നതിനെ വ്യക്തമാക്കുന്നു.
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിർണയിക്കപ്പെട്ട നിയമവിധികളെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הָאֵלֶּה
  choice: ഈ
  rationale: ചട്ടങ്ങളെ നിർദേശിക്കുന്ന ലളിതമായ സമീപസൂചകം.
theological_decisions:
- issue: ഈജിപ്തിലെ ഇസ്രായേലിന്റെ അവസ്ഥയെ വിവരിക്കുന്ന עֶבֶד എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ
  rationale: എബ്രായപദത്തിന്റെ വിശാല അർഥപരിധി നിലനിൽക്കുന്നുവെങ്കിലും, ഈജിപ്തിലെ നിർബന്ധിതവും പീഡനപരവുമായ ബന്ധനാവസ്ഥ ഈ സന്ദർഭത്തിൽ ‘അടിമ’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. മൂലത്തിലെ ‘പാലിക്കുക’–‘ചെയ്യുക’ എന്ന ഇരട്ട ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്താൻ ‘പാലിക്കുകയും അനുഷ്ഠിക്കുകയും ചെയ്യുക’ എന്നു നൽകി.
