  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: ml
  text: ആബീബ്[a] മാസം ശ്രദ്ധയോടെ ആചരിക്കുക; നിന്റെ ദൈവമായ യഹ്‌വെക്കു പെസഹ ആചരിക്കുക. കാരണം, ആബീബ് മാസത്തിൽ നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ ഈജിപ്തിൽനിന്ന് രാത്രിയിൽ പുറപ്പെടുവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആബീബ്’ എന്ന പേര് നേരത്തെ പാകമാകുന്ന ധാന്യവുമായി ബന്ധപ്പെട്ടതാണ്; ‘വസന്തമാസം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: കാത്താചരിക്കുക
  rationale: ഈ ആജ്ഞ കലണ്ടറിലെ മാസം വെറുതെ ഓർക്കാനല്ല, അതുമായി ബന്ധപ്പെട്ട നിയമാനുസൃത ആചരണം ശ്രദ്ധാപൂർവം പാലിക്കാനാണ് ആവശ്യപ്പെടുന്നത്. ‘കാത്താചരിക്കുക’ എന്നത് שׁמר എന്ന ക്രിയയുടെ ജാഗ്രതയുടെയും അനുസരണത്തിന്റെയും ഭാവം നിലനിർത്തുന്നു.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: ആബീബ് മാസം
  rationale: אָבִיב പാകമാകാൻ തുടങ്ങുന്ന ധാന്യത്തെയും അതുമായി ബന്ധപ്പെട്ട വസന്തകാലത്തെയും സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ ഇസ്രായേലിന്റെ ആരാധനാകലണ്ടറിലെ മാസനാമമായാണ് പ്രയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ പൊതുവായ ‘വസന്തകാലം’ എന്നതിനു പകരം മാസനാമം നിലനിർത്തി.
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: പെസഹ ആചരിക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘പെസഹ ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, ഉത്സവാനുഷ്ഠാനം നിർവഹിക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘പെസഹ ആചരിക്കുക’ എന്നു നൽകി.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്കു
  rationale: ל എന്ന ഉപസർഗം ആചരണം യഹ്‌വെയ്ക്കായി സമർപ്പിതവും അവിടുത്തെ ദിശയിലേക്കുള്ളതുമാണെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הוֹצִיאֲךָ
  choice: നിന്നെ ... പുറപ്പെടുവിച്ചത്
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം മറ്റൊരാളെ പുറത്തേക്കു കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; പുറപ്പാടിന്റെ പതിവ് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: മִן എന്ന ഉപസർഗത്തിന്റെ ഉറവിടഭാവം വ്യക്തമായി നൽകുകയും പുറപ്പാടിന്റെ സ്ഥലത്തെ കൃത്യമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לָיְלָה
  choice: രാത്രിയിലാണ്
  rationale: പുറപ്പെടുവിച്ച സംഭവത്തിന്റെ സമയസാഹചര്യം സൂചിപ്പിക്കുന്ന പദത്തെ ഊന്നലോടെ, എന്നാൽ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, പദവിയായ ‘കർത്താവ്’ കൊണ്ട് പകരാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: אָבִיב ഒരു ഋതുവായോ മാസനാമമായോ വിവർത്തനം ചെയ്യുക
  choice: കലണ്ടറിലെ മാസനാമമായ ‘ആബീബ്’
  alternative: വസന്തകാല മാസം
  rationale: പെസഹാനിയമത്തിന്റെ ഈ സന്ദർഭത്തിൽ പ്രയോഗം ഒരു നിർദിഷ്ട ആരാധനാകലണ്ടർ മാസത്തെ അടയാളപ്പെടുത്തുന്നു; എങ്കിലും പദത്തിന്റെ ധാന്യപാകവുമായി ബന്ധപ്പെട്ട അർഥപശ്ചാത്തലം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമപരമായ ആജ്ഞയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ശൈലി സ്വീകരിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ/നിന്നെ’ സംരക്ഷിച്ചു; ‘രാത്രിയിൽ’ എന്ന സമയസൂചനയിലെ മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള പ്രസ്താവനയും നിലനിർത്തി.
