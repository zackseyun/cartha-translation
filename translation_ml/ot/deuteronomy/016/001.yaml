    rationale: Although it attempts to represent שָׁמוֹר, this compound is not idiomatic for observing a calendrical month in modern Malayalam and can impede comprehension.
  - severity: low
    issue: Overemphasis in ‘രാത്രിയിലാണ്’
    rationale: The Hebrew לָיְלָה marks the time of the exodus; it does not require the restrictive/emphatic focus conveyed by ‘-യിലാണ്.’
