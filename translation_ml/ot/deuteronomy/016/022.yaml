source:
  edition: WLC
  text: וְ/לֹֽא תָקִ֥ים לְ/ךָ֖ מַצֵּבָ֑ה אֲשֶׁ֥ר שָׂנֵ֖א יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/022.yaml
  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യാഹ്‌വേ വെറുക്കുന്ന ഒരു ശിലാസ്തംഭം[a] നീ നിനക്കായി സ്ഥാപിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നാട്ടിയ കല്ല്’ അല്ലെങ്കിൽ ‘ആരാധനാസ്തംഭം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ആരാധനയുമായി ബന്ധപ്പെട്ട് നാട്ടിനിർത്തിയ കല്ലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִים
  choice: സ്ഥാപിക്കരുത്
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു വസ്തുവിനെ നാട്ടിനിർത്തുക അഥവാ സ്ഥാപിക്കുക എന്നർഥം നൽകുന്നു; നിഷേധത്തോടൊപ്പം ‘സ്ഥാപിക്കരുത്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְךָ
  choice: നിനക്കായി
  rationale: ദാതൃക സർവനാമം വ്യക്തിപരമായ ഉദ്ദേശ്യമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു; ‘നിനക്കായി’ അതിനെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מַצֵּבָה
  choice: ശിലാസ്തംഭം
  rationale: ആരാധനയുമായി ബന്ധപ്പെടുത്തി നാട്ടിനിർത്തിയ കല്ലിനെയാണ് ഈ പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘ശിലാസ്തംഭം’ വസ്തുവിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു; ആരാധനാപരമായ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു, മുഖ്യവാചകത്തിൽ ഇല്ലാത്ത ‘വിശുദ്ധ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר
  choice: …വെറുക്കുന്ന
  rationale: മുൻപുള്ള ശിലാസ്തംഭത്തെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ കൃന്തപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שָׂנֵא
  choice: വെറുക്കുന്ന
  rationale: എബ്രായ ക്രിയയിലെ ശക്തമായ വിരോധം മയപ്പെടുത്താതെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും ഉടമ്പടിബന്ധത്തിന്റെ വ്യക്തിപരമായ ഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: מַצֵּבָה എന്ന പദത്തിന്റെ ആരാധനാപരമായ സാന്ദർഭിക അർഥം
  choice: ശിലാസ്തംഭം; ആരാധനാബന്ധം അടിക്കുറിപ്പിൽ
  alternative: വിശുദ്ധസ്തംഭം / ആരാധനാസ്തംഭം
  rationale: സന്ദർഭത്തിൽ ഇത് ആരാധനയുമായി ബന്ധപ്പെട്ട നാട്ടിയ കല്ലാണെങ്കിലും ‘വിശുദ്ധ’ എന്ന ആശയം പദത്തിൽ തുറന്നുപറഞ്ഞിട്ടില്ല. അതിനാൽ മുഖ്യവാചകം വസ്തുവിനെ മാത്രം വ്യക്തമാക്കുകയും സാന്ദർഭിക അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഏകവചന അഭിസംബോധന നിലനിർത്തിയിരിക്കുന്നു; ബന്ധവാക്യം മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമത്തിൽ മുൻപോട്ട് കൊണ്ടുവന്നു.
