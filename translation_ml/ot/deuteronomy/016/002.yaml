language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זָבַ֥חְתָּ פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ צֹ֣אן וּ/בָקָ֑ר בַּ/מָּקוֹם֙ אֲשֶׁר יִבְחַ֣ר יְהוָ֔ה לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: ml
  text: യഹോവ തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത്, നിന്റെ ദൈവമായ യഹോവയ്ക്കു ആട്ടിൻപറ്റത്തിൽനിന്നും കന്നുകാലിക്കൂട്ടത്തിൽനിന്നും പെസഹാ അർപ്പിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: യാഗം അർപ്പിക്കണം
  rationale: זבח എന്ന ക്രിയ യാഗാർഥമായ അറുക്കലിനെയും അർപ്പിക്കലിനെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യാഗം അർപ്പിക്കുക’ എന്നത് ആരാധനാപരമായ പ്രവൃത്തിയും നിയമനിർദേശത്തിന്റെ ബലവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פֶּסַח
  choice: പെസഹായാഗം
  rationale: ഇവിടെ പദം זבח എന്ന ക്രിയയുടെ കർമമായതിനാൽ പെസഹാചരണത്തോടു ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘പെസഹായാഗം’ മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമാണ്; പരിധിയെക്കുറിച്ചുള്ള അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവയ്ക്കു
  rationale: ל സമർപ്പണത്തിന്റെ ദിശ സൂചിപ്പിക്കുന്നു. יהוה എന്ന ഉടമ്പടിനാമം ‘യഹോവ’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: צֹאן וּבָקָר
  choice: ആട്ടിൻപറ്റത്തിൽനിന്നും കന്നുകാലിക്കൂട്ടത്തിൽനിന്നും
  rationale: രണ്ടു പദങ്ങളും ഏകജാതിയെക്കാൾ വിശാലമായ കൂട്ടനാമങ്ങളാണ്. ഉറവിടബന്ധം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നതിനാൽ ‘നിന്നും’ ചേർത്തിരിക്കുന്നു.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: യഹോവ ... തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തുവെച്ച്
  rationale: തിരഞ്ഞെടുക്കപ്പെടുന്ന കേന്ദ്രാരാധനാസ്ഥലത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഹീബ്രു ഇംപർഫെക്റ്റിന്റെ പ്രതീക്ഷിത തിരഞ്ഞെടുപ്പ് അർത്ഥം സന്ദർഭം നൽകുന്നു.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: തന്റെ നാമം വസിപ്പിക്കാൻ
  rationale: שכן എന്ന ക്രിയയുടെ കാരണാർഥരൂപവും ‘തന്റെ നാമം’ എന്ന ദൈവസാന്നിധ്യവുമായി ബന്ധപ്പെട്ട ഹീബ്രു പ്രയോഗവും ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു; അതിനാൽ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ‘യഹോവ’ എന്ന രൂപം നിലനിർത്തുന്നു.
- issue: ‘പെസഹാ’യും ‘ആട്ടിൻപറ്റവും കന്നുകാലിക്കൂട്ടവും’ തമ്മിലുള്ള വ്യാപ്തി
  choice: മൂലത്തിലെ വിശാലമായ മൃഗക്കൂട്ട പരാമർശം മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: ‘പെസഹായാഗവും ഉത്സവയാഗങ്ങളും’ എന്ന് വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക
  rationale: ചെമ്മരിയാടോ കോലാടോ മാത്രമല്ല, צאן ובקר എന്ന് മൂലപാഠം പറയുന്നു. ഇത് പെസഹാബലിയോടൊപ്പം ഉത്സവയാഗങ്ങളെയും ഉൾക്കൊള്ളുന്നുവോ എന്നത് വിവാദമായതിനാൽ മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ നിയമനിർദേശ ശൈലി. ‘തന്റെ നാമം വസിപ്പിക്കാൻ’ എന്ന ഹീബ്രു ദൈവശാസ്ത്രപരമായ പ്രയോഗം ലളിതമാക്കാതെ നിലനിർത്തി.
