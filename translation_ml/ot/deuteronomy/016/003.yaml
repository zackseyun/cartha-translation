source:
  edition: WLC
  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: ml
  text: അതോടൊപ്പം പുളിപ്പിച്ച അപ്പം തിന്നരുത്. നീ ഈജിപ്തുദേശത്തുനിന്ന് തിടുക്കത്തിൽ പുറപ്പെട്ടതിനാൽ, നിന്റെ ആയുഷ്കാലം മുഴുവൻ ഈജിപ്തുദേശത്തുനിന്ന് നീ പുറപ്പെട്ട ദിവസത്തെ ഓർക്കേണ്ടതിന്, ഏഴു ദിവസം അതോടൊപ്പം പുളിപ്പില്ലാത്ത അപ്പം—കഷ്ടതയുടെ അപ്പം[a]—തിന്നണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദാരിദ്ര്യത്തിന്റെ അപ്പം” അല്ലെങ്കിൽ “ദുരിതത്തിന്റെ അപ്പം.” ഈ എബ്രായ പ്രയോഗം പുറപ്പാടിനോടു ബന്ധപ്പെട്ട കഷ്ടത, ഇല്ലായ്മ, അല്ലെങ്കിൽ പീഡനം എന്നിവയ്ക്ക് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: അതോടൊപ്പം
  rationale: പെസഹായാഗത്തോടൊപ്പം അപ്പം ഭക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חָמֵץ
  choice: പുളിപ്പിച്ച അപ്പം
  rationale: ഇവിടെ പുളിമാവ് എന്ന ഘടകത്തെയല്ല, പുളിപ്പിച്ച ഭക്ഷണമായ അപ്പത്തെയാണ് നിരോധിക്കുന്നത്.
- source_word: מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: ഉത്സവഭക്ഷണത്തെ വ്യക്തമായും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിലും അവതരിപ്പിക്കുന്നു.
- source_word: לֶחֶם עֹנִי
  choice: കഷ്ടതയുടെ അപ്പം
  rationale: עֹנִי സൂചിപ്പിക്കാവുന്ന ദുരിതം, ദാരിദ്ര്യം, പീഡനം എന്നീ അർഥവ്യാപ്തി അനാവശ്യമായി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בְחִפָּזוֹן
  choice: തിടുക്കത്തിൽ
  rationale: പുറപ്പാടിന്റെ അടിയന്തരത വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: לְמַעַן
  choice: അങ്ങനെ
  rationale: തുടർന്നുള്ള ഓർമിക്കലെന്ന ഉദ്ദേശ്യഫലം മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: תִּזְכֹּר
  choice: ഓർക്കണം
  rationale: לְמַעַן കഴിഞ്ഞുള്ള ക്രിയയുടെ ഉദ്ദേശ്യബലം നിലനിർത്തിക്കൊണ്ട് നിയമവാക്യത്തിന്റെ സ്വരം സംരക്ഷിക്കുന്നു.
- source_word: יוֹם צֵאתְךָ
  choice: നീ പുറപ്പെട്ട ദിവസം
  rationale: എബ്രായ നിർമാണത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: നിന്റെ ആയുഷ്കാലമൊക്കെയും
  rationale: ജീവിതകാലം മുഴുവൻ തുടരുന്ന ഓർമയെ സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: לֶחֶם עֹנִי എന്ന പ്രയോഗവും പുറപ്പാടിന്റെ സ്മരണയും തമ്മിലുള്ള ബന്ധം
  choice: കഷ്ടതയുടെ അപ്പം
  alternative: ദാരിദ്ര്യത്തിന്റെ അപ്പം; ദുരിതത്തിന്റെ അപ്പം
  rationale: ഈ ആചാരഭക്ഷണം ഇസ്രായേലിന്റെ കഷ്ടാനുഭവത്തെയും അടിയന്തരമായ വിടുതലിനെയും ഒരുമിച്ച് ഓർമിപ്പിക്കുന്നു. സാമ്പത്തിക ദാരിദ്ര്യത്തിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ മൂലത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ഏകവചന അഭിസംബോധനയും മൂലത്തിലെ ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
