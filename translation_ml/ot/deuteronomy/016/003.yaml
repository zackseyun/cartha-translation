- from: അതോടൊപ്പം പുളിപ്പിച്ച അപ്പം തിന്നരുത്. ഏഴു ദിവസം അതോടൊപ്പം പുളിപ്പില്ലാത്ത അപ്പം—കഷ്ടതയുടെ അപ്പം[a]—തിന്നണം. നീ ഈജിപ്തുദേശത്തുനിന്ന് തിടുക്കത്തിൽ പുറപ്പെട്ടതുകൊണ്ടാണിത്; അങ്ങനെ, ഈജിപ്തുദേശത്തുനിന്ന് നീ പുറപ്പെട്ട ദിവസം നിന്റെ ആയുഷ്കാലമൊക്കെയും ഓർക്കണം.
  to: അതോടൊപ്പം പുളിപ്പിച്ച അപ്പം തിന്നരുത്. നീ ഈജിപ്തുദേശത്തുനിന്ന് തിടുക്കത്തിൽ പുറപ്പെട്ടതിനാൽ, നിന്റെ ആയുഷ്കാലം മുഴുവൻ ഈജിപ്തുദേശത്തുനിന്ന് നീ പുറപ്പെട്ട ദിവസത്തെ ഓർക്കേണ്ടതിന്, ഏഴു ദിവസം അതോടൊപ്പം പുളിപ്പില്ലാത്ത അപ്പം—കഷ്ടതയുടെ അപ്പം[a]—തിന്നണം.
