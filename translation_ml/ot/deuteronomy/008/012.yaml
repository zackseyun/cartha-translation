lexical_decisions:
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ ‘സൂക്ഷിക്കുക’ എന്ന മുന്നറിയിപ്പിനെ ആശ്രയിച്ച് അതിന്റെ പ്രതികൂലസാധ്യത അവതരിപ്പിക്കുന്ന പദമാണ്. തുടർന്നുള്ള വാക്യങ്ങളിലേക്കു നീളുന്ന മുന്നറിയിപ്പ് സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘അല്ലെങ്കിൽ’ ഉപയോഗിച്ചു.
- source_word: תֹּאכַל
  choice: നീ ഭക്ഷിച്ചു
  rationale: രണ്ടാംപുരുഷ ഏകവചന ക്രിയയെ നിലനിർത്തി; തുടർന്നുള്ള പ്രവർത്തനങ്ങളുമായി ചേർന്ന് ഭാവിയിലെ ഒരു സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: וְשָׂבָעְתָּ
  choice: തൃപ്തനാകുകയും
  rationale: ശാരീരികമായി വയറുനിറയുക എന്ന അർഥവും പൂർണതൃപ്തി എന്ന അർഥവും ഉൾക്കൊള്ളാവുന്ന ശׂבע എന്ന ക്രിയയ്ക്ക് സന്ദർഭോചിതവും സ്വാഭാവികവുമായ രൂപം.
- source_word: וּבָתִּים טוֹבִים
  choice: നല്ല വീടുകൾ
  rationale: טוֹבִים എന്നതിന്റെ നേരായ അർഥം നിലനിർത്തുന്നു; ആഡംബരത്തിന്റെ അളവ് അനാവശ്യമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: תִּבְנֶה
  choice: പണിത്
  rationale: വീടുകൾ നിർമിക്കുന്ന പ്രവർത്തനത്തെ തുടർന്നുള്ള താമസവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וְיָשָׁבְתָּ
  choice: അവയിൽ താമസിക്കുകയും
  rationale: ישׁב എന്നതിന്റെ ‘താമസിക്കുക/വസിക്കുക’ എന്ന അർഥം നൽകുന്നു. ‘അവയിൽ’ എന്നത് വീടുകളെ സൂചിപ്പിക്കുന്ന സന്ദർഭസിദ്ധമായ പൂരകമാണ്.
