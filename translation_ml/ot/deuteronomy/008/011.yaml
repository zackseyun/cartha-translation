id: DEU.8.11
reference: Deuteronomy 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: ml
  text: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന അവന്റെ കല്പനകളും ന്യായവിധികളും ചട്ടങ്ങളും പാലിക്കാതെ നിന്റെ ദൈവമായ യഹ്‌വെയെ[a] മറന്നുപോകാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യഹ്‌വെ” എന്നത് יהוה (YHWH) എന്ന ദിവ്യനാമത്തിന്റെ ലിപ്യന്തരമാണ്; ചില പരിഭാഷകൾ ഇവിടെ “കർത്താവ്” എന്നും “യഹോവ” എന്നും ഉപയോഗിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: “പാലിക്കാതെ” എന്നതിന് “പാലിക്കുന്നതിൽ വീഴ്ച വരുത്തി” എന്നും മനസ്സിലാക്കാം; കല്പനകൾ പാലിക്കാതിരിക്കലും യഹ്‌വെയെ മറക്കലും തമ്മിലുള്ള വ്യാകരണബന്ധം മൂലപാഠത്തിൽ ചുരുക്കമായി നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: സ്വയം ജാഗ്രത പാലിക്കണമെന്ന നിഫാൽ ആജ്ഞയുടെ മുന്നറിയിപ്പുസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פֶּן תִּשְׁכַּח
  choice: മറന്നുപോകാതിരിക്കാൻ
  rationale: ഒഴിവാക്കേണ്ട അപകടത്തെ സൂചിപ്പിക്കുന്ന פֶּן ഘടനയെ മലയാളത്തിലെ സ്വാഭാവികമായ നിഷേധാത്മക മുന്നറിയിപ്പായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെ
  rationale: אֱלֹהֶיךָ എന്ന ഉടമ്പടിബന്ധപരമായ വിശേഷണവും יהוה എന്ന ദിവ്യനാമവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: לְבִלְתִּי שְׁמֹר
  choice: പാലിക്കാതെ
  rationale: കല്പനകൾ പാലിക്കാതിരിക്കുന്നതിലൂടെയാണ് യഹ്‌വെയെ മറക്കുന്നത് പ്രകടമാകുന്നതെന്ന സാധ്യത മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; വ്യാകരണബന്ധത്തിലെ സൂക്ഷ്മമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מִצְוֺתָיו וּמִשְׁפָּטָיו וְחֻקֹּתָיו
  choice: അവന്റെ കല്പനകളും ന്യായവിധികളും ചട്ടങ്ങളും
  rationale: ആവർത്തിച്ചുള്ള ബന്ധകങ്ങളും നിയമ-ഉടമ്പടി പദങ്ങളുടെ വ്യത്യാസവും പരമാവധി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന
  rationale: മോശെയുടെ പ്രസംഗത്തിലെ വർത്തമാനകാല അടിയന്തരതയും ‘ഇന്നു’ എന്ന ആവർത്തിത ഉടമ്പടിഭാഷയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: കല്പനകൾ പാലിക്കാതിരിക്കലും യഹ്‌വെയെ മറക്കലും തമ്മിലുള്ള ബന്ധം
  choice: പാലിക്കാതിരിക്കുന്നതിനെ മറക്കലിന്റെ രീതിയോ പ്രകടനമോ ആയി അവതരിപ്പിക്കുന്നു
  alternative: ‘മറക്കുകയും അതിനാൽ പാലിക്കാതിരിക്കുകയും ചെയ്യാതിരിക്കുക’ എന്ന ഫലബന്ധം
  rationale: לְבִלְתִּי שְׁמֹר എന്ന ഘടന രീതിയെയോ ഫലത്തെയോ സൂചിപ്പിക്കാം; പ്രധാനവാചകം സ്വാഭാവികമായ രീതിബന്ധം സ്വീകരിക്കുമ്പോൾ അടിക്കുറിപ്പ് മറ്റുസാധ്യത തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളെങ്കിലും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ശൈലി. ‘കല്പനകൾ—ന്യായവിധികൾ—ചട്ടങ്ങൾ’ എന്ന നിയമപരമായ ത്രിപദവിന്യാസവും ഏകവചന അഭിസംബോധനയും സംരക്ഷിച്ചു.
