  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁכֹ֤חַ תִּשְׁכַּח֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָֽלַכְתָּ֗ אַחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/עֲבַדְתָּ֖/ם וְ/הִשְׁתַּחֲוִ֣יתָ לָ/הֶ֑ם הַעִדֹ֤תִי בָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵדֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വേയെ നീ തീർച്ചയായും മറന്ന്, മറ്റു ദേവന്മാരുടെ പിന്നാലെ ചെന്ന്, അവരെ സേവിക്കുകയും അവർക്കു കുമ്പിടുകയും ചെയ്താൽ, നിങ്ങൾ തീർച്ചയായും നശിച്ചുപോകുമെന്ന് ഞാൻ ഇന്ന് നിങ്ങൾക്കെതിരെ സാക്ഷ്യപ്പെടുത്തുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: ചെയ്താൽ
  rationale: വാക്യത്തിന്റെ മുന്നറിയിപ്പുസ്വഭാവമുള്ള വ്യവസ്ഥ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘അങ്ങനെ സംഭവിക്കും, എങ്കിൽ’ എന്ന ഘടന അനാവശ്യമായി പകർത്തുന്നില്ല.
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: മറന്നുകളഞ്ഞ്[a]
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ ‘മറന്നുകളയുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ സൂചിപ്പിക്കുന്നു; ഘടനയുടെ പ്രത്യേകത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേയെ
  rationale: ദൈവനാമം നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുകയും ഏകവചന അഭിസംബോധനയും ഉടമ്പടിബന്ധവും നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְהָלַכְתָּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: മറ്റു ദേവന്മാരുടെ പിന്നാലെ ചെന്ന്
  rationale: ‘പിന്നാലെ പോകുക’ എന്ന വിശ്വസ്തതയെയും അനുഗമനത്തെയും സൂചിപ്പിക്കുന്ന രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַעֲבַדְתָּם
  choice: അവരെ സേവിക്കുകയും
  rationale: עבד എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘സേവിക്കുക’ നിലനിർത്തുന്നു; തുടർന്നുള്ള കുമ്പിടൽ എന്ന ആരാധനാക്രിയയുമായി ഇത് ലയിപ്പിക്കുന്നില്ല.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: അവരുടെ മുമ്പിൽ കുമ്പിടുകയും
  rationale: ആദരപൂർവം സാഷ്ടാംഗം വീഴുക അഥവാ കുമ്പിടുക എന്ന ദേഹഭാവവും ആരാധനാസന്ദർഭവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: ഞാൻ ഇന്ന് നിങ്ങൾക്കെതിരെ സാക്ഷ്യപ്പെടുത്തുന്നു
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ സാക്ഷ്യത്തിന്റെ പ്രതികൂലബലം നിലനിർത്തുന്നു; വെറും ‘മുന്നറിയിപ്പു നൽകുന്നു’ എന്നു ദുർബലപ്പെടുത്തുന്നില്ല.
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: നിങ്ങൾ തീർച്ചയായും നശിച്ചുപോകുമെന്ന്
  rationale: ക്രിയാനാമവും ക്രിയയും ചേർന്ന ശക്തമായ ഉറപ്പ് ‘തീർച്ചയായും’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; രൂപം ഫലകേന്ദ്രിതമായതിനാൽ ‘നശിച്ചുപോകുക’ തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ ആധുനികമായി അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തോട് ചേർന്ന് നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: അഭിസംബോധനയിലെ ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റം
  choice: ‘നിന്റെ/നീ’ എന്ന ഏകവചനവും ‘നിങ്ങൾ’ എന്ന ബഹുവചനവും നിലനിർത്തി
  alternative: വാക്യം മുഴുവൻ ഏകവചനമാക്കുക അല്ലെങ്കിൽ ബഹുവചനമാക്കുക
  rationale: മൂലപാഠം ആദ്യം ഇസ്രായേലിനെ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്തശേഷം സാക്ഷ്യപ്രഖ്യാപനത്തിലും നാശവിധിയിലും ബഹുവചനത്തിലേക്കു മാറുന്നു. ഈ അർഥസാധ്യതയും വാചകത്തിലെ സംഘർഷവും സമതലപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സേവിക്കുക’ എന്നും ‘കുമ്പിടുക’ എന്നും വേർതിരിച്ച് മൂലത്തിലെ രണ്ടു ആരാധനാക്രിയകളുടെ വ്യത്യാസം സൂക്ഷിച്ചു. ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മൂലപാഠത്തിലെ മാറ്റവും നിലനിർത്തി.
