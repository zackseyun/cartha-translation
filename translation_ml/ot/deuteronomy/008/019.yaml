  to: നിന്റെ ദൈവമായ യഹ്‌വേയെ നീ തീർച്ചയായും മറന്ന്, മറ്റു ദേവന്മാരുടെ പിന്നാലെ ചെന്ന്, അവരെ സേവിക്കുകയും അവർക്കു കുമ്പിടുകയും ചെയ്താൽ, നിങ്ങൾ തീർച്ചയായും നശിച്ചുപോകുമെന്ന് ഞാൻ ഇന്ന് നിങ്ങൾക്കെതിരെ സാക്ഷ്യപ്പെടുത്തുന്നു.
