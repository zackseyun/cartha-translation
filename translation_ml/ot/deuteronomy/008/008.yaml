translation:
  language: ml
  text: ഗോതമ്പും യവവും മുന്തിരിവള്ളികളും അത്തിമരങ്ങളും മാതളനാരകങ്ങളും ഉള്ള ദേശം; ഒലിവ് എണ്ണയും തേനും[a] ഉള്ള ദേശം,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സാധ്യതയുള്ള മറ്റൊരു അർഥം: “ഈന്തപ്പഴച്ചാറ്.” ഇവിടെ “തേൻ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം ദേശത്തിന്റെ ഉല്പന്നങ്ങളെ വിവരിക്കുമ്പോൾ മധുരമുള്ള പഴച്ചാറിനെയും, പ്രത്യേകിച്ച് ഈന്തപ്പഴച്ചാറിനെയും, സൂചിപ്പിക്കാം.'
