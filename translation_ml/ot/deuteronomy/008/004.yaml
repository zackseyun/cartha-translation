  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ ഏകവചനരൂപങ്ങളായ ‘വസ്ത്രം’, ‘കാൽ’ എന്നിവ നിലനിർത്തി; കാലദൈർഘ്യപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ വാക്യത്തിന്റെ തുടക്കത്തിൽ നൽകി.
