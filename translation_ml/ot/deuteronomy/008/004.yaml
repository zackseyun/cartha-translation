  yaml_path: translation/ot/deuteronomy/008/004.yaml
  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: ml
  text: ഈ നാല്പതു വർഷവും നിന്റെ വസ്ത്രം നിന്റെമേൽ ഇരുന്നിട്ടും ജീർണിച്ചില്ല[a]; നിന്റെ കാൽ വീങ്ങിയതുമില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ഉടുപ്പ് നിന്റെമേൽ ഇരുന്നിട്ടും ജീർണിച്ചില്ല.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിന്റെ കാൽ വീർത്തില്ല’; ഈ ക്രിയ കുമിള പൊങ്ങുന്നതിനെ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നുവെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: നിന്റെ വസ്ത്രം
  rationale: ശִׂמְלָה എന്ന ഏകവചനത്തിന് വസ്ത്രം അഥവാ പുറംവസ്ത്രം എന്നർഥമുണ്ട്. ‘വസ്ത്രം’ മൂലപാഠത്തിലെ ഏകവചനം നിലനിർത്തുന്ന സ്വാഭാവികമായ പൊതുപദമാണ്.
- source_word: בָלְתָה
  choice: ജീർണിച്ചില്ല
  rationale: בלה എന്ന ധാതു പഴകുക, തേഞ്ഞുതീരുക, ജീർണിക്കുക എന്നീ ആശയങ്ങൾ നൽകുന്നു. വസ്ത്രത്തെക്കുറിച്ച് ‘ജീർണിച്ചില്ല’ എന്നത് കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: מֵעָלֶיךָ
  choice: നിന്റെമേൽവെച്ച്
  rationale: അക്ഷരാർഥം ‘നിന്റെമേൽനിന്ന്’ എന്നാണെങ്കിലും, വസ്ത്രം ധരിച്ചിരിക്കുമ്പോൾ അത് ജീർണിച്ചില്ല എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְרַגְלְךָ
  choice: നിന്റെ കാൽ
  rationale: എബ്രായപാഠത്തിലെ ഏകവചനം നിലനിർത്തി; മലയാളത്തിലും ഇത് സ്വാഭാവികമായി വ്യക്തിയുടെ കാൽ/കാലുകൾ എന്ന പൊതുവായ അർഥത്തിൽ ഗ്രഹിക്കാം.
- source_word: בָצֵקָה
  choice: വീങ്ങിയതുമില്ല
  rationale: ഈ ക്രിയയെ സാധാരണയായി വീർക്കുക എന്നു മനസ്സിലാക്കുന്നു. കുമിള പൊങ്ങുക എന്ന കൂടുതൽ പ്രത്യേകമായ വ്യാഖ്യാനം സാധ്യമെങ്കിലും നിശ്ചിതമല്ല.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: ഈ നാല്പതു വർഷവും
  rationale: കാലദൈർഘ്യത്തോടൊപ്പം വരുന്ന זֶה എന്ന എബ്രായപ്രയോഗം പ്രതിഫലിപ്പിക്കുമ്പോൾ, മലയാളത്തിൽ ‘ഈ നാല്പതു വർഷവും’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
