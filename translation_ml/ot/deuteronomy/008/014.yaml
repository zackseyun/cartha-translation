id: DEU.8.14
reference: Deuteronomy 8:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/רָ֖ם לְבָבֶ֑/ךָ וְ/שָֽׁכַחְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/014.yaml
  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of servants.
translation:
  language: ml
  text: അപ്പോൾ നിന്റെ ഹൃദയം ഉയരുകയും, മിസ്രയീം ദേശത്തുനിന്ന്, അടിമകളുടെ വീട്ടിൽനിന്ന് നിന്നെ പുറപ്പെടുവിച്ച നിന്റെ ദൈവമായ യഹ്‌വെയെ നീ മറക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  choice: നിന്റെ ഹൃദയം ഉയർന്നുപോകുകയും
  rationale: ഹൃദയം ഉയരുന്നു എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് അഹങ്കാരത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും വ്യാഖ്യാനം നേരിട്ട് പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וְשָׁכַחְתָּ
  choice: നീ മറക്കുകയും ചെയ്യും
  rationale: മുൻവാക്യങ്ങളിൽ ആരംഭിച്ച മുന്നറിയിപ്പിന്റെ ഫലക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി ഭാവാർഥത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവികനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥബന്ധവും യഹ്‌വെയുമായുള്ള സമാനാധികരണബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמּוֹצִיאֲךָ
  choice: നിന്നെ പുറപ്പെടുവിച്ച
  rationale: നിർദിഷ്ട കർത്തൃവാചക കൃതന്തത്തെ, പുറപ്പാടിലെ ദൈവിക വിടുതൽ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യമായി നൽകുന്നു.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: മിസ്രയീംദേശത്തുനിന്ന്
  rationale: ‘മിസ്രയീംദേശം’ എന്ന പൂർണ എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: מִבֵּית עֲבָדִים
  choice: അടിമകളുടെ വീട്ടിൽനിന്ന്
  rationale: עֲבָדִים എന്ന ബഹുവചനമായ ‘അടിമകൾ’ എന്ന മൂർത്തമായ സാമൂഹിക യാഥാർഥ്യം നിലനിർത്തുന്നു; ‘അടിമത്തം’ എന്ന അമൂർത്ത രൂപത്തിലേക്ക് പാഠത്തെ മാറ്റുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവികനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ Yahweh എന്ന പുനർനിർമിത ഉച്ചാരണത്തോട് അടുത്ത മലയാളരൂപമാണിത്.
- issue: מִבֵּית עֲבָדִים എന്നതിലെ മൂർത്തവും അമൂർത്തവുമായ വായനകൾ
  choice: അടിമകളുടെ വീട്ടിൽനിന്ന്
  alternative: അടിമത്തത്തിന്റെ വീട്ടിൽനിന്ന് / അടിമത്തത്തിൽനിന്ന്
  rationale: മൂലത്തിലെ ‘അടിമകൾ’ എന്ന ബഹുവചന നാമം സംരക്ഷിച്ച് പുറപ്പാടിന്റെ സാമൂഹിക യാഥാർഥ്യം മൃദൂകരിക്കാതെ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘ഹൃദയം ഉയരുക’ എന്ന സെമിറ്റിക് രൂപകം മനസ്സിലാകുന്ന രീതിയിൽ നിലനിർത്തി. ‘മിസ്രയീംദേശത്തുനിന്ന്—അടിമകളുടെ വീട്ടിൽനിന്ന്—’ എന്ന സമാന്തര ഘടന രണ്ടാം പ്രയോഗം ആദ്യത്തേതിനെ വിശദീകരിക്കുന്നതാണെന്ന് വ്യക്തമാക്കുന്നു.
