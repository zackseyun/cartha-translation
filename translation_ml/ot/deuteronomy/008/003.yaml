  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְעַנְּ/ךָ֮ וַ/יַּרְעִבֶ/ךָ֒ וַ/יַּֽאֲכִֽלְ/ךָ֤ אֶת הַ/מָּן֙ אֲשֶׁ֣ר לֹא יָדַ֔עְתָּ וְ/לֹ֥א יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן הוֹדִֽעֲ/ךָ֗ כִּ֠י לֹ֣א עַל הַ/לֶּ֤חֶם לְ/בַדּ/וֹ֙ יִחְיֶ֣ה הָֽ/אָדָ֔ם כִּ֛י עַל כָּל מוֹצָ֥א פִֽי יְהוָ֖ה יִחְיֶ֥ה הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: ml
  text: അവൻ നിന്നെ താഴ്ത്തുകയും നിനക്കു വിശപ്പനുഭവിക്കാൻ ഇടവരുത്തുകയും നീയോ നിന്റെ പിതാക്കന്മാരോ അറിഞ്ഞിട്ടില്ലാത്ത മന്ന നിനക്കു ഭക്ഷണമായി നൽകുകയും ചെയ്തു. മനുഷ്യൻ[a] അപ്പംകൊണ്ടുമാത്രമല്ല ജീവിക്കുന്നത്; യഹോവയുടെ വായിൽനിന്നു പുറപ്പെടുന്ന സകലത്താലുമാണ്[b] മനുഷ്യൻ ജീവിക്കുന്നത് എന്നു നിന്നെ അറിയിക്കാനായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘മനുഷ്യൻ’ എന്നത് പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘യഹോവയുടെ വായിൽനിന്നു വരുന്ന ഓരോ വചനത്താലുമാണ്.’ എബ്രായ പ്രയോഗം ‘വചനം’ എന്നതിനെക്കാൾ വിശാലമാണ്; എങ്കിലും ഈ സന്ദർഭത്തിൽ ‘വചനം’ യോജിച്ച വിവർത്തനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: അവൻ നിന്നെ താഴ്ത്തുകയും
  rationale: പീയേൽ രൂപത്തിന് ‘താഴ്ത്തുക/കഷ്ടപ്പെടുത്തുക’ എന്നീ അർഥങ്ങളുണ്ട്. മരുഭൂമിയിലെ ശിക്ഷണവും ആശ്രയത്വബോധവും മുൻനിർത്തി ‘താഴ്ത്തുക’ തിരഞ്ഞെടുത്തു; ശാരീരിക പീഡനം മാത്രം സൂചിപ്പിക്കുന്ന ഭാഷ ഒഴിവാക്കി.
- source_word: וַיַּרְעִבֶךָ
  choice: നിനക്കു വിശപ്പനുഭവിക്കാൻ ഇടവരുത്തുകയും
  rationale: ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം നിലനിർത്തുന്നു; അതേസമയം മലയാളത്തിൽ സ്വാഭാവികമായി ദൈവിക പ്രവർത്തനത്തെ പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיַּאֲכִלְךָ אֶת־הַמָּן
  choice: മന്ന നിനക്കു ഭക്ഷണമായി നൽകുകയും ചെയ്തു
  rationale: ‘ഭക്ഷിപ്പിച്ചു’ എന്ന കാരണാർഥത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും മന്ന എന്ന സ്ഥാപിത നാമം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: നീയോ നിന്റെ പിതാക്കന്മാരോ അറിഞ്ഞിട്ടില്ലാത്ത
  rationale: മുൻപരിചയമില്ലായ്മയാണ് ഇവിടെ ‘അറിയുക’ സൂചിപ്പിക്കുന്നത്. ഏകവചന അഭിസംബോധനയും പിതാക്കന്മാരെക്കുറിച്ചുള്ള പരാമർശവും നിലനിർത്തി.
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: നിന്നെ അറിയിക്കാനായിരുന്നു അത്
  rationale: ידע എന്ന ക്രിയയുടെ കാരണാർഥമായ ‘അറിയാൻ ഇടയാക്കുക’ എന്ന ബോധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യൻ
  rationale: പ്രതിനിധാനപരവും പൊതുവുമായ അർഥം നൽകുന്ന മലയാളപദം; പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: הַלֶּחֶם לְבַדּוֹ
  choice: അപ്പംകൊണ്ടുമാത്രം
  rationale: മൂലത്തിലെ ‘അപ്പം മാത്രം’ എന്ന നിയന്ത്രിത ആശയം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: כָּל־מוֹצָא פִי יְהוָה
  choice: യഹോവയുടെ വായിൽനിന്നു പുറപ്പെടുന്ന സകലത്താലും
  rationale: מוֹצָא എന്നതിന്റെ വിശാലമായ ‘പുറപ്പെടുന്നത്’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘വചനം’ എന്നു മാത്രം വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ പൊതുവായ പദവിയായി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: יִחְיֶה הָאָדָם ... יִחְיֶה הָאָדָם
  choice: മനുഷ്യൻ ... ജീവിക്കുന്നത്; ... മനുഷ്യൻ ജീവിക്കുന്നത്
  rationale: എബ്രായത്തിലെ ‘മനുഷ്യൻ ജീവിക്കും’ എന്ന ആവർത്തനവും വാക്യത്തിന്റെ തുലിതാളവും മലയാളത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: הָאָדָם എന്ന പൊതുവായ പ്രതിനിധാനപദത്തിന്റെ വിവർത്തനം
  choice: മനുഷ്യൻ
  alternative: മനുഷ്യർ / മനുഷ്യവർഗം
  rationale: വാക്യം എല്ലാ മനുഷ്യരെയും കുറിച്ചാണെങ്കിലും മൂലത്തിലെ ഏകവചന പ്രതിനിധാനരൂപം ‘മനുഷ്യൻ’ സംരക്ഷിക്കുന്നു. അതിന്റെ പൊതുവായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: מוֹצָא פִי יְהוָה എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: യഹോവയുടെ വായിൽനിന്നു പുറപ്പെടുന്ന സകലവും
  alternative: യഹോവയുടെ വായിൽനിന്നു വരുന്ന ഓരോ വചനവും
  rationale: מוֹצָא എന്ന പദം ‘പുറപ്പെടുന്ന കാര്യം’ എന്ന വിശാല അർഥം അനുവദിക്കുന്നു. ദൈവിക അരുളപ്പാട് സന്ദർഭത്തിൽ യോജിക്കുന്നുവെങ്കിലും ‘വചനം’ എന്നത് അല്പം കൂടുതൽ വ്യാഖ്യാനാത്മകമായതിനാൽ മുഖ്യപാഠത്തിൽ വിശാലത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ഏകവചനമായ ‘നിന്നെ/നിനക്കു’ നിലനിർത്തി. എബ്രായ വാക്യത്തിലെ ആവർത്തനവും ദൈവനാമവും സംരക്ഷിച്ചു; അതേസമയം അസ്വാഭാവികമായ പദാനുപദ ക്രമം ഒഴിവാക്കി.
