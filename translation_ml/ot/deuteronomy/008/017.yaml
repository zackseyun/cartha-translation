id: DEU.8.17
reference: Deuteronomy 8:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֖ בִּ/לְבָבֶ֑/ךָ כֹּחִ/י֙ וְ/עֹ֣צֶם יָדִ֔/י עָ֥שָׂה לִ֖/י אֶת הַ/חַ֥יִל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/017.yaml
  text: and you say in your heart[a], ‘My power and the strength of my hand have gotten me this wealth,’
translation:
  language: ml
  text: “എന്റെ ശക്തിയും എന്റെ കൈയുടെ കരുത്തുമാണ് എനിക്ക് ഈ സമ്പത്ത്[a] നേടിത്തന്നത്” എന്നു നീ നിന്റെ ഹൃദയത്തിൽ പറഞ്ഞേക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഈ സമൃദ്ധി.” എബ്രായത്തിലെ חַיִל എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് സമ്പത്ത്, വിഭവങ്ങൾ, ശക്തി, കഴിവ് എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: എന്നു നീ ... പറഞ്ഞേക്കാം
  rationale: മുന്നറിയിപ്പിന്റെ സന്ദർഭത്തിൽ ഈ ക്രിയ ഭാവിയിൽ സംഭവിക്കാവുന്ന അകത്തെ ആത്മസംഭാഷണത്തെ സൂചിപ്പിക്കുന്നു. ‘പറഞ്ഞേക്കാം’ ആ സാധ്യത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּלְבָבֶךָ
  choice: നിന്റെ ഹൃദയത്തിൽ
  rationale: സ്വന്തം ഉള്ളിൽ ചിന്തിക്കുകയോ തന്നോടുതന്നെ പറയുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു.
- source_word: כֹּחִי
  choice: എന്റെ ശക്തി
  rationale: כֹּחַ എന്ന പദത്തിന്റെ വ്യക്തിപരമായ ശക്തി, കഴിവ് എന്നീ അർഥങ്ങൾ സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: וְעֹצֶם יָדִי
  choice: എന്റെ കൈയുടെ കരുത്ത്
  rationale: വ്യക്തിയുടെ സ്വന്തം പ്രവർത്തനശേഷിയെ സൂചിപ്പിക്കുന്ന ‘കൈ’ എന്ന മൂർത്തമായ എബ്രായ രൂപകം നിലനിർത്തുന്നു; עֹצֶם എന്നതിന്റെ ശക്തി/കരുത്ത് എന്ന ആശയവും വ്യക്തമാക്കുന്നു.
- source_word: עָשָׂה לִי
  choice: എനിക്ക് ... നേടിത്തന്നത്
  rationale: അക്ഷരാർഥത്തിലെ ‘ഉണ്ടാക്കി’ എന്നതിനെക്കാൾ, ഈ സന്ദർഭത്തിൽ സമ്പത്ത് സ്വശക്തിയാൽ ആർജിച്ചതായി അവകാശപ്പെടുന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַחַיִל הַזֶּה
  choice: ഈ സമ്പത്ത്
  rationale: ആവർത്തനം 8-ലെ ഭൗതിക സമൃദ്ധിയുടെ പശ്ചാത്തലത്തിൽ חַיִל എന്നതിന് ‘സമ്പത്ത്’ യോജിക്കുന്നു; הַזֶּה എന്ന ഏകവചന നിർദേശകത്തിന്റെ അർഥം ‘ഈ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-മുന്നറിയിപ്പിന്റെ സന്ദർഭത്തിൽ חַיִל എന്ന പദത്തിന്റെ അർഥം
  choice: സമ്പത്ത്
  alternative: സമൃദ്ധി; ശക്തി; വിഭവശേഷി
  rationale: സമീപസന്ദർഭം ആഹാരം, വീടുകൾ, കന്നുകാലികൾ, വെള്ളി, പൊന്ന് എന്നിവ വർധിക്കുന്നതിനെക്കുറിച്ചാണ്. അതിനാൽ സ്വന്തം കഴിവിനാണ് ഭൗതിക നേട്ടത്തിന്റെ മഹത്വം നൽകുന്നതെന്ന മുന്നറിയിപ്പ് ‘സമ്പത്ത്’ ഏറ്റവും വ്യക്തമായി അറിയിക്കുന്നു; പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഹൃദയത്തിൽ’ എന്നും ‘കൈയുടെ കരുത്ത്’ എന്നും പറഞ്ഞ് എബ്രായത്തിലെ പ്രധാന രൂപകങ്ങൾ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന പദത്തോടു ചേർന്ന് [a] സ്ഥാപിച്ചു.
