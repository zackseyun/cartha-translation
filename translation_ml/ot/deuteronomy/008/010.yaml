- from: നീ ഭക്ഷിച്ചു തൃപ്തനാകുമ്പോൾ, നിനക്കു നൽകിയ നല്ല ദേശത്തെപ്രതി നിന്റെ ദൈവമായ യഹോവയെ വാഴ്ത്തണം.[a]
  to: നീ ഭക്ഷണം കഴിച്ച് തൃപ്തനായശേഷം, നിനക്കു നൽകിയ നല്ല ദേശം നിമിത്തം നിന്റെ ദൈവമായ യാഹ്‌വേയെ വാഴ്ത്തണം.[a]
  rationale: The revision aligns the divine name with the project’s Yahweh policy, preserves the Hebrew action sequence, and retains “വാഴ്ത്തണം” for the broad biblical idiom of blessing God. The footnote continues to explain the literal Hebrew wording and viable interpretive alternatives.
