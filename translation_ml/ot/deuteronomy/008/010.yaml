base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
translation:
  language: ml
  text: നീ ഭക്ഷണം കഴിച്ച് തൃപ്തനായശേഷം, നിനക്കു നൽകിയ നല്ല ദേശം നിമിത്തം നിന്റെ ദൈവമായ യാഹ്‌വേയെ വാഴ്ത്തണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നന്ദി പറയണം” അല്ലെങ്കിൽ “സ്തുതിക്കണം.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “അനുഗ്രഹിക്കണം” എന്നാണ്; നന്ദിയോടെ ദൈവത്തെക്കുറിച്ച് നന്നായി സംസാരിക്കുന്ന ബൈബിൾ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָכַלְתָּ וְ/שָׂבָעְתָּ
  choice: നീ ഭക്ഷിച്ചു തൃപ്തനാകുമ്പോൾ
  rationale: തുടർച്ചയായ ക്രിയാരൂപങ്ങൾ ഭക്ഷണം കഴിച്ച് തൃപ്തനാകുന്നതിനു പിന്നാലെ ദൈവത്തെ വാഴ്ത്തണമെന്ന സന്ദർഭബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കാലസംബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ആകുമ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: וּ/בֵרַכְתָּ
  choice: വാഴ്ത്തണം
  rationale: ദൈവം കർമമായി വരുന്ന ברך എന്ന എബ്രായ പ്രയോഗത്തിന് ദൈവത്തെക്കുറിച്ച് നന്നായി സംസാരിക്കുക, സ്തുതിക്കുക, നന്ദി പ്രകടിപ്പിക്കുക എന്നീ ആശയവ്യാപ്തിയുണ്ട്. ‘വാഴ്ത്തുക’ ആ ബൈബിൾ പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവായ വ്യക്തിനാമരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം സൂചിപ്പിക്കുന്ന ഉടമസ്ഥതയും ഉടമ്പടിബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל הָ/אָרֶץ הַ/טֹּבָה
  choice: നല്ല ദേശത്തെപ്രതി
  rationale: עַל ഇവിടെ വാഴ്ത്തലിന്റെ കാരണമോ സന്ദർഭമോ അവതരിപ്പിക്കുന്നു. ‘ദേശത്തെപ്രതി’ എന്നത് ദേശത്തിന്റെ നന്മയ്ക്കായി ദൈവത്തെ വാഴ്ത്തുന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: നിനക്കു നൽകിയ
  rationale: ദൈവം തന്ന നല്ല ദേശം എന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി വിശേഷണവാക്യമായി നൽകി; കർത്താവ് മുൻസന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ആവർത്തിച്ചില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ സൂക്ഷിച്ചു. ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണം ‘യഹോവ’യാണ്.
- issue: ദൈവത്തോടു ബന്ധപ്പെട്ട ברך എന്ന ക്രിയയുടെ അർഥം
  choice: വാഴ്ത്തണം
  alternative: നന്ദി പറയണം; സ്തുതിക്കണം; അനുഗ്രഹിക്കണം
  rationale: ‘അനുഗ്രഹിക്കുക’ എന്ന പദം മലയാളത്തിൽ സാധാരണയായി മേൽസ്ഥാനത്തുനിന്ന് നന്മ നൽകുന്നതിനെ സൂചിപ്പിക്കാം. ‘വാഴ്ത്തുക’ എന്നാൽ എബ്രായ പ്രയോഗത്തിലെ സ്തുതിയുടെയും നന്ദിയുടെയും ആശയങ്ങൾ ഒരൊറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ മലയാളം. ഏകവചന അഭിസംബോധന നിലനിർത്തി. നിയമപരമായ ആജ്ഞാഭാവം ‘വാഴ്ത്തണം’ എന്ന രൂപത്തിൽ പ്രകടമാക്കി.
