reference: Deuteronomy 8:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֶ֔י/ךָ מְבִֽיאֲ/ךָ֖ אֶל אֶ֣רֶץ טוֹבָ֑ה אֶ֚רֶץ נַ֣חֲלֵי מָ֔יִם עֲיָנֹת֙ וּ/תְהֹמֹ֔ת יֹצְאִ֥ים בַּ/בִּקְעָ֖ה וּ/בָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: ml
  text: കാരണം, നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ നിങ്ങളെ ഒരു നല്ല ദേശത്തേക്ക് കൊണ്ടുവരികയാണ്—നീർച്ചാലുകൾ[a] ഉള്ളതും, താഴ്‌വരയിലും മലനാട്ടിലും[b] പൊട്ടിപ്പുറപ്പെടുന്ന ഉറവുകളും ആഴജലങ്ങളും[c] ഉള്ളതുമായ ഒരു ദേശത്തേക്ക്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ജലപാതകളുള്ള ദേശം”; ഹീബ്രു പദം അരുവികൾ, കുത്തൊഴുക്കുകൾ, അല്ലെങ്കിൽ വാദികൾ എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “സമതലത്തിലും മലകളിലും.”
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ, “അഗാധജലങ്ങൾ”; ഹീബ്രു പദം ഭൂഗർഭജലത്തെയോ ആഴത്തിലുള്ള ജലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപ്രസംഗത്തിന് കാരണമോ വിശദീകരണമോ നൽകുന്ന ബന്ധകശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥതയെ ആദരസൂചകമായ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מְבִיאֲךָ
  choice: നിങ്ങളെ ... കൊണ്ടുപോകുകയാണ്
  rationale: ഹീബ്രു കർത്തൃവാചകത്തിന്റെ പുരോഗമിക്കുന്നതോ ആസന്നമായതോ ആയ പ്രവൃത്തിയെ സജീവമായി നിലനിർത്തുന്നു.
- source_word: אֶל־אֶרֶץ טוֹבָה
  choice: ഒരു നല്ല ദേശത്തേക്ക്
  rationale: ലക്ഷ്യത്തിലേക്കുള്ള ചലനവും ലളിതമായ ഗുണവിശേഷണവും നേരിട്ട് നൽകുന്നു.
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: നീർച്ചാലുകൾ ... ഉള്ള ദേശം
  rationale: נַחֲלֵי എന്നത് അരുവികളെയോ കുത്തൊഴുക്കുകളെയോ വാദികളെയോ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ സമൃദ്ധമായ ഒഴുകുന്ന വെള്ളത്തിന്റെ ചിത്രം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: עֲיָנֹת
  choice: ഉറവുകൾ
  rationale: പ്രകൃതിദത്ത ജലസ്രോതസ്സുകൾക്കുള്ള വ്യക്തവും സമകാലീനവുമായ മലയാളപദം.
- source_word: וּתְהֹמֹת
  choice: ആഴജലങ്ങൾ
  rationale: ഭൂഗർഭജലമോ അഗാധജലമോ എന്ന നിർണ്ണയിക്കാത്ത ജലചിത്രം അമിതമായി വ്യാഖ്യാനിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: יֹצְאִים
  choice: പൊട്ടിയൊഴുകുന്ന
  rationale: ജലം ഉള്ളിൽനിന്ന് പുറത്തുവന്ന് ഒഴുകുന്ന ദൃശ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּבִּקְעָה
  choice: താഴ്‌വരയിൽ
  rationale: വിശാലമായ താഴ്‌വരയെയോ സമതലത്തെയോ സൂചിപ്പിക്കാവുന്ന പദത്തിന് മലനാടിനോടുള്ള ഭൂപ്രകൃതി വൈരുധ്യം നിലനിർത്തുന്ന പരിഭാഷ.
- source_word: וּבָהָר
  choice: മലനാട്ടിൽ
  rationale: ഏകവചനരൂപത്തിന് കൂട്ടായ ഉയർന്ന പ്രദേശം എന്ന അർത്ഥം സാധ്യമായതിനാൽ സ്വാഭാവികമായ ഭൂപ്രകൃതിപദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. കാവ്യാത്മക ജലചിത്രം നിലനിർത്തിക്കൊണ്ട് സാങ്കേതിക ഭൂപ്രകൃതിപദങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
