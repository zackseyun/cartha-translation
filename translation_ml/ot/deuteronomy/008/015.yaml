  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: ml
  text: വലുതും ഭയാനകവുമായ മരുഭൂമിയിലൂടെ നിന്നെ നയിച്ചവൻ—അവിടെ എരിയുന്ന സർപ്പങ്ങളും[a] തേളുകളും വെള്ളമില്ലാത്ത വരണ്ട ഭൂമിയും[b] ഉണ്ടായിരുന്നു—തീക്കല്ലുപോലുള്ള പാറയിൽനിന്ന് നിനക്കു വെള്ളം പുറപ്പെടുവിച്ചവൻ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിഷസർപ്പങ്ങൾ.’ പരമ്പരാഗതമായി ‘എരിയുന്ന സർപ്പങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തുന്ന എബ്രായപ്രയോഗം, കടിയേറ്റാൽ എരിവുണ്ടാക്കുന്ന പാമ്പുകളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വരൾച്ച’ അല്ലെങ്കിൽ ‘ദാഹം.’ എബ്രായപദം വെള്ളമില്ലാത്ത സ്ഥലത്തെ ഉണങ്ങിയ അവസ്ഥയെയോ ദാഹത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: നിന്നെ നയിച്ചവൻ
  rationale: ഹിഫീൽ കർത്തൃവാചക കൃദന്തം വിപുലമായ വാക്യത്തിൽ യഹോവയുടെ കഴിഞ്ഞകാല പ്രവൃത്തിയെ വിശേഷിപ്പിക്കുന്നു; മലയാളത്തിൽ ബന്ധാർഥമുള്ള കൃദന്തരൂപം സ്വാഭാവികമാണ്.
- source_word: בַּמִּדְבָּר הַגָּדֹל וְהַנּוֹרָא
  choice: വലുതും ഭയാനകവുമായ മരുഭൂമിയിലൂടെ
  rationale: מִדְבָּר ജനവാസമില്ലാത്ത മരുപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; യാത്രയുടെ പശ്ചാത്തലത്തിൽ ‘മരുഭൂമിയിലൂടെ’ യോജിക്കുന്നു. രണ്ടു വിശേഷണങ്ങളും നിലനിർത്തുന്നു.
- source_word: נָחָשׁ שָׂרָף
  choice: എരിയുന്ന സർപ്പങ്ങൾ
  rationale: שָׂרָף എന്ന പദത്തിന്റെ ‘എരിയുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; ഇത് അക്ഷരാർഥത്തിൽ തീപിടിച്ച സർപ്പങ്ങളാണോ കടിയാൽ എരിവുണ്ടാക്കുന്ന വിഷസർപ്പങ്ങളാണോ എന്ന് മുഖ്യപാഠം നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല. പട്ടികയിലെ സമൂഹാർഥം മലയാളത്തിൽ ബഹുവചനമായി നൽകി.
- source_word: וְעַקְרָב
  choice: തേളുകളും
  rationale: നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യപദം; അപകടങ്ങളുടെ പട്ടികയ്ക്കനുസരിച്ച് ബഹുവചനം.
- source_word: וְצִמָּאוֹן אֲשֶׁר אֵין מָיִם
  choice: വെള്ളമില്ലാത്ത വരണ്ട ഭൂമിയും
  rationale: צִמָּאוֹן ദാഹം, വരൾച്ച, ഉണങ്ങിയ ജലരഹിത സ്ഥലം എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. തുടർന്നുള്ള ‘വെള്ളമില്ലാത്ത’ എന്ന വിശദീകരണത്തോടൊപ്പം പരിസ്ഥിതിദുരിതം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: നിനക്കുവേണ്ടി വെള്ളം പുറപ്പെടുവിച്ചവൻ
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം വെള്ളം പുറത്തുവരാൻ ഇടയാക്കിയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; അതിന്റെ സജീവവും മൂർത്തവുമായ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: തീക്കൽപ്പാറയിൽനിന്ന്
  rationale: צוּר പാറയെയും חַלָּמִישׁ തീക്കല്ലുപോലെയുള്ള അതികഠിന ശിലയെയും സൂചിപ്പിക്കുന്നു; സംയുക്തരൂപം മലയാളത്തിൽ ചുരുക്കവും ദൃശ്യസമ്പന്നവുമാണ്.
theological_decisions:
- issue: മരുഭൂമിയിലെ അപകടങ്ങളുടെ സ്വഭാവം
  choice: സർപ്പങ്ങൾ, തേളുകൾ, ജലരഹിതമായ വരണ്ട ഭൂമി എന്നിവയെ ഇസ്രായേലിന്റെ മരുയാത്രയിലെ മൂർത്തമായ അപകടങ്ങളായി പരിഭാഷപ്പെടുത്തി.
  alternative: അവയെ രൂപകങ്ങളായോ പൊതുവായ ‘അപകടങ്ങൾ’ എന്നോ അവതരിപ്പിക്കുക.
  rationale: എബ്രായപാഠം ചരിത്രപരമായ മരുയാത്രയും ദൈവത്തിന്റെ പരിപാലനവും മൂർത്തമായ ദൃശ്യങ്ങളിലൂടെ വിവരിക്കുന്നു; പാഠം ആവശ്യപ്പെടാത്ത പ്രതീകവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. മൂലവാക്യം വിപുലമായ വാക്യത്തിന്റെ ഭാഗമായതിനാൽ അവസാനത്തിലെ അർധവിരാമസദൃശമായ തുടർച്ച കോമയാൽ നിലനിർത്തി. ഇടയ്ക്കുള്ള അപകടപ്പട്ടിക വായനാസൗകര്യത്തിനായി ദീർഘവിരാമങ്ങൾക്കുള്ളിൽ നൽകി.
