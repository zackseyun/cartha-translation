id: DEU.8.1
reference: Deuteronomy 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל הַ/מִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם תִּשְׁמְר֣וּ/ן לַ/עֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּ/ן וּ/רְבִיתֶ֗ם וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: ml
  text: ഞാൻ ഇന്ന് നിങ്ങളോടു കൽപ്പിക്കുന്ന എല്ലാ കൽപ്പനകളും[a] നിങ്ങൾ ശ്രദ്ധയോടെ അനുഷ്ഠിക്കണം; അങ്ങനെ നിങ്ങൾ ജീവിക്കുകയും പെരുകുകയും, നിങ്ങളുടെ പിതാക്കന്മാരോടു[c] യാഹ്‌വേ സത്യംചെയ്ത ദേശത്ത് പ്രവേശിച്ച് അത് കൈവശമാക്കുകയും[b] ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുഴുവൻ കൽപ്പനയും.’ എബ്രായത്തിൽ ഇത് ഏകവചനത്തിലുള്ള ഒരു സമാഹാരപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവകാശമാക്കുകയും.’ എബ്രായക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് അവകാശമായി നേടുക അല്ലെങ്കിൽ കൈവശമാക്കുക എന്നർഥം വരാം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ‘നിങ്ങളുടെ പിതാക്കന്മാർ’; ഇത് ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: സകല കല്പനകളും
  rationale: എബ്രായത്തിലെ ഏകവചന സമാഹാരപ്രയോഗം കല്പനകളുടെ സമഗ്രതയെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനമായി നൽകുന്നത് ആ അർഥം വ്യക്തമായി പകരുന്നു.
- source_word: מְצַוְּךָ
  choice: ഞാൻ ഇന്ന് നിങ്ങളോടു കല്പിക്കുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ ഇപ്പോഴത്തെ/തുടരുന്ന കല്പനാഭാവം നിലനിർത്തുന്നു. എബ്രായത്തിലെ ഏകവചന അഭിസംബോധനയ്ക്കു ചുറ്റുമുള്ള ബഹുവചന ക്രിയകളോട് യോജിച്ച് സമൂഹമായ ഇസ്രായേലിനെ മലയാളത്തിലെ ആദരബഹുവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: നിങ്ങൾ ജാഗ്രതയോടെ അനുഷ്ഠിക്കണം
  rationale: ശ്രദ്ധയോടെ കാത്തുസൂക്ഷിക്കുകയും പ്രവൃത്തിയിൽ നടപ്പാക്കുകയും ചെയ്യുക എന്ന സംയുക്ത ആശയം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְמַעַן
  choice: അങ്ങനെ
  rationale: തുടർന്നുള്ള ജീവൻ, പെരുക്കം, ദേശപ്രവേശം എന്നിവ കല്പനാനുഷ്ഠാനവുമായി ഉദ്ദേശ്യ/ഫലബന്ധത്തിൽ നിൽക്കുന്നതു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תִּחְיוּן וּרְבִיתֶם
  choice: നിങ്ങൾ ജീവിക്കുകയും പെരുകുകയും
  rationale: ജീവിക്കുക, എണ്ണത്തിൽ വർധിക്കുക എന്നീ ഉടമ്പടിസംബന്ധമായ ആശയങ്ങൾ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּבָאתֶם וִירִשְׁתֶּם
  choice: പ്രവേശിച്ച് അതു കൈവശമാക്കുകയും
  rationale: ദേശത്തേക്കുള്ള പ്രവേശനവും അതിന്റെ അധീനതലഭിക്കലും വ്യക്തമാക്കുന്നു; ירשׁ എന്ന പദത്തിന്റെ ‘അവകാശമാക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിലെ വാഗ്ദത്തദേശത്തെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള സമാനം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: נִשְׁבַּע
  choice: സത്യംചെയ്ത
  rationale: ദൈവം പിതാക്കന്മാരോടു ചെയ്ത ഉടമ്പടി-ശപഥത്തിന്റെ ശക്തി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לַאֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരോടു
  rationale: മൂലത്തിലെ ലിംഗനിർദ്ദിഷ്ട ബന്ധുപദം നിലനിർത്തുന്നു; ഇവിടെ ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരാണ് ഉദ്ദേശ്യം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിലെ പരിചിതമായ ദൈവനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: אֲבֹתֵיכֶם എന്ന ബന്ധുപദം
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  alternative: നിങ്ങളുടെ പൂർവികർ
  rationale: മൂലത്തിലെ ‘പിതാക്കന്മാർ’ എന്ന പുരുഷലിംഗ പദവും ഇസ്രായേലിന്റെ ഉടമ്പടി-പൂർവപിതാക്കന്മാരെന്ന സൂചനയും സംരക്ഷിക്കുന്നു.
- issue: കല്പനയും ജീവൻ/ദേശലഭ്യതയും തമ്മിലുള്ള ബന്ധം
  choice: അങ്ങനെ
  alternative: അതുകൊണ്ട്; അതിന്റെ പ്രതിഫലമായി
  rationale: לְמַעַן സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യ/ഫലബന്ധം നിലനിർത്തുന്നു; കർശനമായ പ്രതിഫലസിദ്ധാന്തമായി അതിനെ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അനുഷ്ഠിക്കുക,’ ‘സത്യംചെയ്യുക,’ ‘കൈവശമാക്കുക’ എന്നീ പദങ്ങൾ ഉടമ്പടിസന്ദർഭത്തിന്റെ ഭാരം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നവയാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
