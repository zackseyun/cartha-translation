- from: ഞാൻ ഇന്ന് നിങ്ങളോടു കല്പിക്കുന്ന സകല കല്പനകളും[a] നിങ്ങൾ ജാഗ്രതയോടെ അനുഷ്ഠിക്കണം. അങ്ങനെ നിങ്ങൾ ജീവിക്കുകയും പെരുകുകയും യഹോവ നിങ്ങളുടെ പിതാക്കന്മാരോടു സത്യംചെയ്ത ദേശത്തു പ്രവേശിച്ച് അതു കൈവശമാക്കുകയും[b] ചെയ്യും.[c]
