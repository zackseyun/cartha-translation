source:
  edition: WLC
  text: כַּ/גּוֹיִ֗ם אֲשֶׁ֤ר יְהוָה֙ מַאֲבִ֣יד מִ/פְּנֵי/כֶ֔ם כֵּ֖ן תֹאבֵד֑וּ/ן עֵ֚קֶב לֹ֣א תִשְׁמְע֔וּ/ן בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: ml
  text: യഹ്‌വെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് നശിപ്പിച്ചുകൊണ്ടിരിക്കുന്ന ജനതകളെപ്പോലെതന്നെ നിങ്ങളും നശിച്ചുപോകും; നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ ശബ്ദം നിങ്ങൾ കേൾക്കാത്തതിനാൽ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ അനുസരിക്കാത്തതിനാൽ.” ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ “നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ ശബ്ദം കേൾക്കുക” എന്നാണ്; അത് പലപ്പോഴും അനുസരിക്കുക എന്ന അർഥവും വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: ജനതകളെപ്പോലെ
  rationale: כְּ എന്ന താരതമ്യസൂചകവും גּוֹיִם എന്ന ബഹുവചനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ കനാൻദേശത്തിലെ ജനതകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: מַאֲבִיד
  choice: നശിപ്പിച്ചുകൊണ്ടിരിക്കുന്ന
  rationale: אבד എന്ന ധാതുവിന്റെ ഹിഫീൽ കർത്തൃവാചക കൃത്‌രൂപത്തിലെ കാരണാർത്ഥവും തുടരുന്ന പ്രവൃത്തിയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: ഹീബ്രുവിലെ ‘നിങ്ങളുടെ മുമ്പിൽനിന്ന്’ എന്ന നീക്കം സൂചിപ്പിക്കുന്ന പ്രയോഗം നേരിട്ടും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: כֵּן תֹאבֵדוּן
  choice: അതുപോലെതന്നെ നിങ്ങളും നശിച്ചുപോകും
  rationale: ആരംഭത്തിലെ താരതമ്യവുമായി ചേർന്ന כֵּן എന്ന അനുരൂപഘടനയും אבד എന്ന ധാതുവുമായുള്ള പദബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: עֵקֶב
  choice: കാരണം
  rationale: വരാനിരിക്കുന്ന ന്യായവിധിയുടെ കാരണത്തെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: ശബ്ദം നിങ്ങൾ കേൾക്കാത്തത്
  rationale: ‘ശബ്ദം കേൾക്കുക’ എന്ന ഹീബ്രു ഉടമ്പടിപ്രയോഗം നിലനിർത്തുന്നു; അതിൽ അനുസരണത്തിന്റെ അർത്ഥവും ഉൾക്കൊള്ളുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: യഹ്‌വെയോടു ചേർന്ന രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയം ഇസ്രായേലിന്റെ ഏക ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു ബിരുദംകൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: שׁמע בקול എന്ന പ്രയോഗം ‘അനുസരിക്കുക’ എന്നോ ‘ശബ്ദം കേൾക്കുക’ എന്നോ പരിഭാഷപ്പെടുത്തുന്നത്
  choice: ശബ്ദം കേൾക്കുക
  alternative: അനുസരിക്കുക
  rationale: കേൾവിയും അനുസരണവും ഉൾക്കൊള്ളുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഉടമ്പടിസംബന്ധമായ രൂപഭാവം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: לֹא תִשְׁמְעוּן എന്ന ക്രിയയുടെ കാലഭാവം
  choice: നിങ്ങൾ കേൾക്കാത്തതുകൊണ്ടാണ്
  alternative: നിങ്ങൾ കേട്ടില്ലാത്തതുകൊണ്ട്
  rationale: ഈ മുന്നറിയിപ്പിലെ അപൂർണക്രിയയെ ഭാവിയിലെ നാശത്തിന് കാരണമാകുന്ന പൊതുവായ/തുടരുന്ന അനുസരണക്കേടായി അവതരിപ്പിക്കുന്നു; നിർബന്ധമില്ലാതെ ഭൂതകാലത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജനതകൾ,’ ‘നശിച്ചുപോകും,’ ‘ശബ്ദം കേൾക്കുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായിരിക്കെ മൂലപാഠത്തിന്റെ താരതമ്യഘടനയും ഉടമ്പടിഭാവവും നിലനിർത്തുന്നു.
