  text: וְ/יָדַעְתָּ֖ עִם לְבָבֶ֑/ךָ כִּ֗י כַּ/אֲשֶׁ֨ר יְיַסֵּ֥ר אִישׁ֙ אֶת בְּנ֔/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מְיַסְּרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/005.yaml
  text: So know in your heart that[a], just as a man disciplines his son, Yahweh your God disciplines you.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഒരു മനുഷ്യൻ തന്റെ മകന് ശിക്ഷണം നൽകുന്നതുപോലെ നിന്റെ ദൈവമായ യാഹ്‌വേ നിനക്കും ശിക്ഷണം നൽകുന്നു[a] എന്ന് ഹൃദയത്തിൽ അറിഞ്ഞുകൊള്ളുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശിക്ഷിക്കുന്നു’ അല്ലെങ്കിൽ ‘തിരുത്തുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയയിൽ തിരുത്തുന്നതിനുള്ള ശിക്ഷയും രൂപപ്പെടുത്തുന്ന പരിശീലനവും ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: അതുകൊണ്ട് ... അറിഞ്ഞുകൊള്ളുക
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനവും ആഹ്വാനസ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വെറും ഭൂതകാലമായി ചുരുക്കുന്നില്ല.
- source_word: עִם לְבָבֶךָ
  choice: ഹൃദയത്തിൽ
  rationale: ആന്തരികമായ തിരിച്ചറിവിനെയും ബോധ്യത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: כִּי
  choice: എന്ന്
  rationale: അറിയേണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ഉദ്ധരണിപൂരകമായ ‘എന്ന്’ യോജിക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെ
  rationale: മനുഷ്യൻ മകനു നൽകുന്ന ശിക്ഷണവും യഹോവ നൽകുന്ന ശിക്ഷണവും തമ്മിലുള്ള താരതമ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: ശിക്ഷണം നൽകുന്നു
  rationale: തിരുത്തൽ, നിയന്ത്രണം, രൂപപ്പെടുത്തുന്ന പരിശീലനം എന്നീ അർഥവശങ്ങൾ ഒരുമിച്ച് നിലനിർത്തുന്നു; രണ്ട് പ്രയോഗങ്ങളിലും ഒരേ പദം ഉപയോഗിച്ച് എബ്രായ ആവർത്തനം സംരക്ഷിക്കുന്നു.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യൻ
  rationale: മൂലപാഠത്തിൽ ‘പിതാവ്’ എന്നല്ല, വ്യക്തമായി ‘മനുഷ്യൻ’ എന്നാണ്; മകനുമായുള്ള ബന്ധം തുടർന്നുള്ള പദം വ്യക്തമാക്കുന്നു.
- source_word: בְּנוֹ
  choice: തന്റെ മകൻ
  rationale: പൊതുവായ ‘കുട്ടി’ എന്നതിനെക്കാൾ മൂലപാഠത്തിലെ നിർദിഷ്ടമായ പുത്രസൂചന സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: ദൈവനാമത്തോടു ചേർന്ന ഉടമ്പടിസംബന്ധമായ അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവിക ശിക്ഷണത്തിന്റെ സ്വഭാവം
  choice: ശിക്ഷണം നൽകുന്നു
  alternative: ശിക്ഷിക്കുന്നു; തിരുത്തുന്നു
  rationale: ദണ്ഡനത്തിന്റെ വശം മാത്രം അതിശയിപ്പിക്കാതെയും വെറും പഠിപ്പിക്കൽ മാത്രമായി മൃദൂകരിക്കാതെയും തിരുത്തലും രൂപപ്പെടുത്തുന്ന പരിശീലനവും ഉൾക്കൊള്ളുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ/നിനക്കും’ നിലനിർത്തി. ‘ശിക്ഷണം നൽകുന്നു’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
