reference: Deuteronomy 8:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁ֣מַרְתָּ֔ אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו וּ/לְ/יִרְאָ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: ml
  text: അതുകൊണ്ട്[a], നിന്റെ ദൈവമായ യഹ്‌വേയുടെ കല്പനകൾ നീ പാലിക്കണം; അവന്റെ വഴികളിൽ നടക്കുകയും അവനെ ഭയപ്പെടുകയും[b] വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ദൈവമായ യഹ്‌വേയുടെ കല്പനകൾ നീ പാലിക്കണം.” എബ്രായ സംയോജകം ഇവിടെ മുൻവാക്യത്തോടുള്ള ലളിതമായ തുടർച്ചയായും വായിക്കാം; എന്നാൽ മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനമായ “അതുകൊണ്ട്” എന്ന അർഥം ഇവിടെ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അവനെ ഭയപ്പെടുക” എന്നതിൽ ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയം ഉൾപ്പെടുന്നു; അഥവാ, “അവനെ ഭക്തിയോടെ ആദരിക്കുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: അതുകൊണ്ട് ... നീ പാലിക്കണം
  rationale: שׁמר എന്ന പദം കല്പനകളോടൊപ്പം വരുമ്പോൾ അവ അനുസരിച്ച് പാലിക്കുക എന്ന ഉടമ്പടിസംബന്ധമായ അർഥം നൽകുന്നു. മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കാൻ וְ എന്ന സംയോജകം ‘അതുകൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִצְוֺת
  choice: കല്പനകൾ
  rationale: മִצְוָה എന്നതിന്റെ ബഹുവചനരൂപം ദൈവം കല്പിച്ച ഉടമ്പടിബാധ്യതകളെ സൂചിപ്പിക്കുന്നു; ‘കല്പനകൾ’ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകി.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം വ്യക്തമായി ‘നിന്റെ’ എന്നാണ്; മലയാളത്തിലെ സ്വാഭാവിക നാമബന്ധത്തിനായി ‘നിന്റെ ദൈവമായ യഹോവ’ എന്നു ക്രമപ്പെടുത്തി.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: അവന്റെ വഴികളിൽ നടക്കുകയും
  rationale: הלך + בְּדְרָכָיו എന്ന രൂപകം ദൈവം നിർദേശിക്കുന്ന ജീവിതരീതിയിൽ നടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വഴികളിൽ നടക്കുക’ എന്ന ബൈബിൾരൂപകം നിലനിർത്തി.
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: അവനെ ഭയപ്പെടുകയും
  rationale: ירא ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയം ഉൾക്കൊള്ളുന്നു. അതിനെ ‘ബഹുമാനിക്കുക’ എന്നതിലേക്കു മൃദൂകരിക്കാതെ ‘ഭയപ്പെടുക’ എന്നു നൽകി; ഭക്തിപൂർവമായ സൂക്ഷ്മാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു.
- issue: ദൈവത്തെ ‘ഭയപ്പെടുക’ എന്ന ഭാഷയുടെ അർഥം
  choice: അവനെ ഭയപ്പെടുക
  alternative: അവനെ ഭക്തിയോടെ ആദരിക്കുക
  rationale: ירא എന്ന ക്രിയയുടെ ഭയം എന്ന അടിസ്ഥാനാർഥവും അതിലെ ദൈവശാസ്ത്രപരമായ ഗൗരവവും മുഖ്യപാഠത്തിൽ നിലനിർത്തി. സന്ദർഭത്തിലെ ഭക്തിപൂർവമായ ഭാവം അടിക്കുറിപ്പിൽ അറിയിച്ചു; പദത്തെ വെറും ആദരവായി ചുരുക്കിയില്ല.
- issue: കല്പനകൾ പാലിക്കുന്നതും വഴികളിൽ നടക്കുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: കല്പനകൾ നീ പാലിക്കണം; അവന്റെ വഴികളിൽ നടക്കുകയും ... വേണം
  alternative: അവന്റെ വഴികളിൽ നടന്നുകൊണ്ട് ... കല്പനകൾ പാലിക്കണം
  rationale: ലְ ചേർന്ന infinitive-കൾ മുഖ്യക്രിയയുടെ പ്രായോഗിക നിർവഹണത്തെയോ ലക്ഷ്യത്തെയോ വ്യക്തമാക്കാം. മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തനം ഒഴിവാക്കി സമാന്തര നിർബന്ധവാക്യമായി നൽകി; ആശയബന്ധം നിലനിൽക്കുന്നു, എന്നാൽ അതിനെ ഒറ്റ വ്യാകരണാർഥമായി അമിതമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ അഭിസംബോധന ഏകവചനമായതിനാൽ ‘നീ/നിന്റെ’ നിലനിർത്തി. ‘കല്പനകൾ’, ‘വഴികളിൽ നടക്കുക’, ‘ഭയപ്പെടുക’ എന്നീ ഉടമ്പടിസംബന്ധവും രൂപകാത്മകവുമായ പ്രധാന പദങ്ങൾ മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു.
