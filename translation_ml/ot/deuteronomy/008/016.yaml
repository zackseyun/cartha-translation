id: DEU.8.16
reference: Deuteronomy 8:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/מַּֽאֲכִ֨לְ/ךָ֥ מָן֙ בַּ/מִּדְבָּ֔ר אֲשֶׁ֥ר לֹא יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן עַנֹּֽתְ/ךָ֗ וּ/לְמַ֨עַן֙ נַסֹּתֶ֔/ךָ לְ/הֵיטִֽבְ/ךָ֖ בְּ/אַחֲרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: ml
  text: നിന്റെ പിതാക്കന്മാർ അറിഞ്ഞിട്ടില്ലാത്ത മന്ന നിനക്കു മരുഭൂമിയിൽ ഭക്ഷിക്കാനായി തന്നവനാണ് അവൻ; നിന്നെ താഴ്ത്താനും നിന്നെ പരീക്ഷിക്കാനും, ഒടുവിൽ[a] നിനക്കു നന്മ ചെയ്യാനുമാണ് അവൻ അങ്ങനെ ചെയ്തത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒടുവിൽ’ എന്നതിന് ‘പിന്നീട്’ അല്ലെങ്കിൽ ‘നിന്റെ അന്തിമപരിണതിയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: നിനക്കു ഭക്ഷിക്കാൻ തന്നവൻ
  rationale: אכל എന്ന ധാതുവിന്റെ ഹിഫീൽ കർത്തൃവാചക രൂപം ‘ഭക്ഷിപ്പിക്കുന്നവൻ/ഭക്ഷിക്കാൻ തരുന്നവൻ’ എന്ന കാരണാർഥം വഹിക്കുന്നു; മുൻവാക്യത്തിലെ ദൈവത്തെക്കുറിച്ചുള്ള വിവരണം ഇത് തുടരുന്നു.
- source_word: מָן
  choice: മന്ന
  rationale: മരുഭൂമിയിലെ പ്രത്യേക ആഹാരത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥാപിതമായ രൂപം.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽവെച്ച്
  rationale: מִדְבָּר ജനവാസമില്ലാത്ത വരണ്ട പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; പുറപ്പാട് പശ്ചാത്തലത്തിൽ ‘മരുഭൂമി’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാർ അറിഞ്ഞിട്ടില്ലാത്ത
  rationale: ബന്ധവാക്യം മന്നയെ വിശേഷിപ്പിക്കുകയും മുൻതലമുറകൾക്ക് അത് പരിചിതമല്ലായിരുന്നുവെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാർ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനമായ ‘പിതാക്കന്മാർ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘പൂർവികർ’ എന്ന വിശാല അർഥവും സാധ്യമാണ്.
- source_word: לְמַעַן עַנֹּתְךָ
  choice: നിന്നെ താഴ്ത്താനും
  rationale: ענה എന്ന പീയേൽ രൂപത്തിന് ‘താഴ്ത്തുക/കഷ്ടപ്പെടുത്തുക’ എന്നീ അർഥങ്ങളുണ്ട്; ആവർത്തനപുസ്തകം 8-ലെ ശിക്ഷണപരമായ പശ്ചാത്തലത്തിൽ ‘താഴ്ത്തുക’ യോജിക്കുന്നു, എന്നാൽ കഷ്ടതയുടെ ഭാവം പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- source_word: וּלְמַעַן נַסֹּתֶךָ
  choice: നിന്നെ പരീക്ഷിക്കാനും
  rationale: נסה എന്നത് ഒരാളെ പരിശോധിക്കുക, പരീക്ഷിക്കുക എന്നർഥം നൽകുന്നു; ഉടമ്പടിസംബന്ധമായ മരുഭൂമി-പരീക്ഷണ ആശയം വ്യക്തമായി പകരുന്നു.
- source_word: לְהֵיטִבְךָ
  choice: നിനക്കു നന്മ ചെയ്യാനും
  rationale: יטב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം നന്മ ചെയ്യുക, ഗുണം വരുത്തുക എന്ന വ്യക്തിപരമായ അർഥം നൽകുന്നു.
- source_word: בְּאַחֲרִיתֶךָ
  choice: ഒടുവിൽ
  rationale: אַחֲרִית ഇവിടെ അന്തിമഫലം, പിന്നീടുള്ള പരിണതി, ഭാവി എന്നിവ സൂചിപ്പിക്കാം; ‘ഒടുവിൽ’ മലയാളത്തിൽ സ്വാഭാവികമായി ലക്ഷ്യമിട്ട നല്ല പരിണതി അറിയിക്കുന്നു.
theological_decisions:
- issue: മരുഭൂമിയിലെ കഷ്ടതയുടെ ഉദ്ദേശ്യം
  choice: ദൈവത്തിന്റെ താഴ്ത്തലും പരീക്ഷണവും ഒടുവിൽ ഇസ്രായേലിന് നന്മ ചെയ്യാനുള്ള ഉദ്ദേശ്യത്തോടുകൂടിയതായി അവതരിപ്പിച്ചു.
  alternative: ഇവയെ ശിക്ഷാത്മകമായ പീഡനം മാത്രമായി വായിക്കാം.
  rationale: ഇരട്ട לְמַעַן ഉദ്ദേശ്യവാക്യങ്ങൾ לְהֵיטִבְךָ בְּאַחֲרִיתֶךָ എന്ന നന്മയിലേക്കുള്ള സമാപനത്തിൽ എത്തുന്നു. അതിനാൽ കഠിനതയും ദയാപൂർണമായ അന്തിമലക്ഷ്യവും ഒരുമിച്ച് നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ ദീർഘമായ ബന്ധവാക്യം നിലനിർത്തിക്കൊണ്ട് മലയാളവാക്യത്തിന്റെ വ്യക്തതയ്ക്കായി ഡാഷും സമാപനവാക്യവും ഉപയോഗിച്ചു.
