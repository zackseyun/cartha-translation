base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യഹോവ ഈ നാല്പത് വർഷം മരുഭൂമിയിൽ നിങ്ങളെ നടത്തിയ വഴിയെല്ലാം നിങ്ങൾ ഓർക്കണം. നിങ്ങളെ താഴ്ത്താനും പരീക്ഷിക്കാനും, നിങ്ങളുടെ ഹൃദയത്തിൽ എന്താണുള്ളത്—നിങ്ങൾ അവന്റെ കല്പനകൾ പാലിക്കുമോ ഇല്ലയോ എന്ന്—അറിയാനുമായിരുന്നു[a] അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ഹൃദയത്തിൽ എന്താണുള്ളതെന്ന് വെളിപ്പെടുത്താൻ.” എബ്രായഭാഷയിൽ അക്ഷരാർഥത്തിൽ “നിങ്ങളുടെ ഹൃദയത്തിൽ എന്താണുള്ളതെന്ന് അറിയാൻ” എന്നാണ്; ആ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: നിങ്ങൾ ഓർക്കണം
  rationale: നിർദേശാത്മക സന്ദർഭത്തിലെ ക്രിയയുടെ ആജ്ഞാപരമായ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל הַדֶּרֶךְ
  choice: വഴിയെല്ലാം
  rationale: വെറും ഒരു പാതയെയല്ല, മരുഭൂമിയിലൂടെയുള്ള അനുഭവയാത്രയുടെ മുഴുവൻ ഗതിയെയും സൂചിപ്പിക്കുന്നു; എബ്രായ രൂപകവും നിലനിർത്തുന്നു.
- source_word: הֹלִיכֲךָ
  choice: നിങ്ങളെ നടത്തിയ
  rationale: הלך എന്ന ക്രിയയുടെ ഹിഫ്ഇൽ കാരകഭാവം ദൈവിക നടത്തിപ്പിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: ഈ നാല്പതു വർഷക്കാലം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: ഇസ്രായേലിന്റെ പരീക്ഷണത്തിന്റെയും ആശ്രയത്തിന്റെയും സ്ഥലമായ wilderness-നെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാള പദം.
- source_word: עַנֹּתְךָ
  choice: നിങ്ങളെ താഴ്ത്താനും
  rationale: കഷ്ടതയിലൂടെ താഴ്ത്തുക/വിനയപ്പെടുത്തുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘പീഡിപ്പിക്കുക’ എന്നതിനെക്കാൾ ഇവിടെ യോജിക്കുന്നു.
- source_word: לְנַסֹּתְךָ
  choice: പരീക്ഷിക്കാനും
  rationale: נסה എന്നതിന്റെ വിലയിരുത്തുന്ന പരീക്ഷണം എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לָדַעַת
  choice: അറിയാനും
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള ‘അറിയുക’ എന്ന പ്രയോഗം ദൈവശാസ്ത്രപരമായി മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: നിങ്ങളുടെ ഹൃദയത്തിലുള്ളത്
  rationale: לֵבָב സൂചിപ്പിക്കുന്ന ചിന്ത, ഇച്ഛ, ആന്തരിക വ്യക്തിത്വം എന്നിവ ഉൾക്കൊള്ളുന്ന പരമ്പരാഗതവും ഗ്രാഹ്യവുമായ ‘ഹൃദയം’ നിലനിർത്തുന്നു.
- source_word: מצותיו
  choice: അവന്റെ കല്പനകൾ
  rationale: കേതീവ് രൂപത്തിലെ ബഹുവചന അർഥത്തെയും ദൈവത്തോടുള്ള അനുസരണത്തിന്റെ ഉടമ്പടിസന്ദർഭത്തെയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളുടെ ഹൃദയത്തിലുള്ളത് അറിയാൻ’ എന്ന ദൈവത്തെ മനുഷ്യസദൃശമായി അവതരിപ്പിക്കുന്ന ഭാഷ
  choice: ‘അറിയാൻ’ എന്ന നേരിട്ടുള്ള പദപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘നിങ്ങളുടെ ഹൃദയത്തിലുള്ളത് വെളിപ്പെടുത്താൻ’ അല്ലെങ്കിൽ ‘അറിയിക്കാനായി’
  rationale: എബ്രായപാഠം ‘അറിയാൻ’ എന്നാണ് പറയുന്നത്. ദൈവത്തിന്റെ സർവജ്ഞതയെക്കുറിച്ചുള്ള സംഘർഷം വിവർത്തനത്തിൽ പരിഹരിക്കാതെ, മൂലപാഠത്തിന്റെ ഉടമ്പടിപരമായ മനുഷ്യസദൃശ ഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഇസ്രായേലിനെ ഏകസമൂഹമായി അഭിസംബോധന ചെയ്യുന്ന എബ്രായ ഏകവചനത്തെ മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘നിങ്ങൾ’ രൂപത്തിൽ അവതരിപ്പിച്ചു; ദൈവനാമം ‘യഹോവ’യായി നിലനിർത്തി.
