source:
  edition: WLC
  text: אֶ֗רֶץ אֲשֶׁ֨ר לֹ֤א בְ/מִסְכֵּנֻת֙ תֹּֽאכַל בָּ֣/הּ לֶ֔חֶם לֹֽא תֶחְסַ֥ר כֹּ֖ל בָּ֑/הּ אֶ֚רֶץ אֲשֶׁ֣ר אֲבָנֶ֣י/הָ בַרְזֶ֔ל וּ/מֵ/הֲרָרֶ֖י/הָ תַּחְצֹ֥ב נְחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/009.yaml
  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: ml
  text: ദാരിദ്ര്യത്തിൽ[a] അപ്പം കഴിക്കേണ്ടിവരാത്ത, അതിൽ നിനക്കു യാതൊന്നിനും കുറവില്ലാത്ത ദേശം; കല്ലുകൾ ഇരുമ്പായിരിക്കുന്ന ദേശം; അതിന്റെ മലകളിൽനിന്ന് നീ ചെമ്പ് കുഴിച്ചെടുക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഞെരുക്കത്തിൽ’ അല്ലെങ്കിൽ ‘ഇല്ലായ്മയിൽ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദത്തിന് ‘ചെമ്പ്’ എന്നോ ‘വെങ്കലം’ എന്നോ അർഥമാകാം. ഇവിടെ മലകളിൽനിന്ന് കുഴിച്ചെടുക്കുന്ന വസ്തുവിനെക്കുറിച്ചായതിനാൽ ‘ചെമ്പ്’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: ദാരിദ്ര്യത്തിൽ
  rationale: ഈ നാമം ദാരിദ്ര്യം, ഞെരുക്കം, ഇല്ലായ്മ എന്നീ ആശയങ്ങൾ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘ഒന്നിനും കുറവില്ലാത്ത’ എന്ന വാക്യഭാഗം ആവർത്തിക്കാതെ, അഭാവത്തിന്റെ സാഹചര്യത്തിൽ അപ്പം കഴിക്കേണ്ടിവരില്ല എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: മൂലപദത്തിന്റെ അടിസ്ഥാനവും ദൃശ്യവുമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ആഹാരത്തെ വിശാലമായി പ്രതിനിധീകരിക്കാം.
- source_word: תֶחְסַר כֹּל
  choice: ഒന്നിനും കുറവില്ലാത്ത
  rationale: സമ്പൂർണ പര്യാപ്തത സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സമഗ്രബലം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: കല്ലുകൾ ഇരുമ്പായിരിക്കുന്ന
  rationale: ‘അതിന്റെ കല്ലുകൾ [ആകുന്നു] ഇരുമ്പ്’ എന്ന മൂലത്തിലെ സംക്ഷിപ്തവും ശക്തവുമായ രൂപകം സംരക്ഷിക്കുന്നു; ഇരുമ്പടങ്ങിയ കല്ലിനെയോ അയിരിനെയോ സൂചിപ്പിക്കാമെന്നത് സന്ദർഭത്തിൽ തുറന്നുവെക്കുന്നു.
- source_word: תַּחְצֹב
  choice: കുഴിച്ചെടുക്കും
  rationale: വെട്ടിയെടുക്കുക, ഖനനം ചെയ്യുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പ്രയോഗമാണിത്.
- source_word: נְחֹשֶׁת
  choice: ചെമ്പ്
  rationale: പദത്തിന് ചെമ്പ് എന്നും വെങ്കലം എന്നും അർഥമാകാം. മലകളിൽനിന്ന് നേരിട്ട് കുഴിച്ചെടുക്കുന്ന പ്രകൃതിവിഭവത്തെക്കുറിച്ചായതിനാൽ ലോഹമായ ചെമ്പാണ് ഇവിടെ കൂടുതൽ യോജിച്ചത്.
