translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായവാക്യത്തിലെ ആവർത്തിച്ചുള്ള ‘ദേശം’ എന്ന ഘടനയും ‘കല്ലുകൾ ഇരുമ്പ്’ എന്ന ദൃശ്യരൂപവും പരമാവധി നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
