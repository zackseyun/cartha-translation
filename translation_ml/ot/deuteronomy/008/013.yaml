source:
  edition: WLC
  text: וּ/בְקָֽרְ/ךָ֤ וְ/צֹֽאנְ/ךָ֙ יִרְבְּיֻ֔/ן וְ/כֶ֥סֶף וְ/זָהָ֖ב יִרְבֶּה לָּ֑/ךְ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ יִרְבֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/013.yaml
  text: and your herds and your flocks multiply[a], and silver and gold increase for you[b], and all that is yours increases—
translation:
  language: ml
  text: നിന്റെ പശുക്കൂട്ടങ്ങളും[a] ചെമ്മരിയാടുകളും കോലാടുകളും പെരുകുകയും, നിനക്കു വെള്ളിയും പൊന്നും പെരുകുകയും, നിന്റേതായതെല്ലാം[b] പെരുകുകയും ചെയ്യുമ്പോൾ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിന്റെ കന്നുകാലിക്കൂട്ടങ്ങളും.’ ഹീബ്രുവിലെ בקר പ്രത്യേകിച്ച് പശു, കാള മുതലായ ഗോവർഗ വളർത്തുമൃഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിനക്കുള്ളതെല്ലാം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקָרְךָ
  choice: നിന്റെ കാലിക്കൂട്ടങ്ങളും
  rationale: בקר എന്നത് പശു, കാള, കാളക്കുട്ടി തുടങ്ങിയ വലിയ ഗോവർഗ വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘കാലിക്കൂട്ടങ്ങൾ’ ഈ കൂട്ടർഥവും צאן-നോടുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: וְצֹאנְךָ
  choice: ആട്ടിൻപറ്റങ്ങളും
  rationale: צאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. ‘ആട്ടിൻപറ്റങ്ങൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ കൂട്ടർഥം നൽകുന്നു.
- source_word: יִרְבְּיוּן
  choice: പെരുകുകയും
  rationale: רבה എന്ന ധാതു ഇവിടെ എണ്ണത്തിൽ വർധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മൃഗക്കൂട്ടങ്ങളെക്കുറിച്ച് ‘പെരുകുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וְכֶסֶף וְזָהָב
  choice: വെള്ളിയും പൊന്നും
  rationale: ഹീബ്രു പദങ്ങൾ ഉടമസ്ഥസർവനാമമില്ലാതെ സമ്പത്തിന്റെ ഇനങ്ങളെ നേരിട്ട് പറയുന്നു; പിന്നാലെയുള്ള לָךְ ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: יִרְבֶּה לָּךְ
  choice: നിനക്കു ... പെരുകുകയും
  rationale: לָךְ എന്ന ദാതിവിഭക്തിയുടെ ആശയം ഒഴിവാക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְכֹל אֲשֶׁר לְךָ
  choice: നിന്റേതായതെല്ലാം
  rationale: വ്യക്തിയുടെ സകല സമ്പാദ്യങ്ങളെയും സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്ന ഉടമസ്ഥനിർമ്മിതിയെ ഈ പ്രയോഗം കൃത്യമായി നൽകുന്നു.
- source_word: יִרְבֶּה
  choice: പെരുകുകയും
  rationale: സകല സമ്പത്തിന്റെയും വർധനയെ സൂചിപ്പിക്കാൻ ‘പെരുകുക’ വിശാലവും സ്വാഭാവികവുമായ പ്രയോഗമാണ്.
theological_decisions:
- issue: לָךְ എന്ന ദാതിവിഭക്തിയുടെ അവതരണം
  choice: ‘നിനക്കു വെള്ളിയും പൊന്നും പെരുകുകയും’ എന്ന് ദാതിവിഭക്തി തുറന്നുവെച്ചു.
  alternative: ‘നിന്റെ വെള്ളിയും പൊന്നും പെരുകുകയും’
  rationale: ഉടമസ്ഥത എന്ന അർഥം സന്ദർഭത്തിൽ ഉണ്ടെങ്കിലും, മൂലപാഠത്തിലെ לָךְ-നെ നേരിട്ടുള്ള ഉടമസ്ഥസർവനാമമാക്കി മാറ്റാതെ അതിന്റെ വ്യാകരണരൂപവും സൂക്ഷ്മതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ മൂലപാഠത്തിലെ അപൂർണത ദീർഘരേഖയിലൂടെ നിലനിർത്തി; മലയാളത്തിലെ വ്യാകരണസ്വാഭാവികതയ്ക്കായി ‘ചെയ്യുമ്പോൾ’ ചേർത്തു.
