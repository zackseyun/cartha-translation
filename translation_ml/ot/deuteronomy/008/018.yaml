id: DEU.8.18
reference: Deuteronomy 8:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זָֽכַרְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ כִּ֣י ה֗וּא הַ/נֹּתֵ֥ן לְ/ךָ֛ כֹּ֖חַ לַ/עֲשׂ֣וֹת חָ֑יִל לְמַ֨עַן הָקִ֧ים אֶת בְּרִית֛/וֹ אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: ml
  text: എന്നാൽ നിന്റെ ദൈവമായ യാഹ്‌വെയെ നീ ഓർക്കണം; സമ്പത്ത് നേടാനുള്ള ശക്തി നിനക്കു നൽകുന്നത് അവിടുന്നുതന്നെയാണ്.[a] നിന്റെ പിതാക്കന്മാരോടു സത്യംചെയ്ത തന്റെ ഉടമ്പടി ഇന്നുള്ളതുപോലെ സ്ഥാപിക്കുന്നതിനായാണ് അവിടുന്ന് അതു നൽകുന്നത്.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സമ്പത്ത് നേടുക” എന്നതിന് “സമ്പത്ത് ഉണ്ടാക്കുക” എന്നും കൂടുതൽ വിശാലമായി “വിജയം കൈവരിക്കുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “പിതാക്കന്മാർ” എന്നത് ഇവിടെ ഉടമ്പടി ലഭിച്ച ഗോത്രപിതാക്കന്മാരെ, പ്രത്യേകിച്ച് അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരെ, സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: “ഇന്നുള്ളതുപോലെ” എന്ന ഹീബ്രു പ്രയോഗം “ഇന്ന് വ്യക്തമായി കാണുന്നതുപോലെ” അഥവാ “ഇപ്പോൾ നിലനിൽക്കുന്നതുപോലെ” എന്നർഥം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: എന്നാൽ ... നീ ഓർക്കണം
  rationale: മുൻവാക്യത്തിലെ സ്വയംപ്രശംസയ്ക്കുള്ള മുന്നറിയിപ്പിനോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; നിർദേശാത്മക പ്രയോഗം ‘ഓർക്കണം’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യാഹ്‌വെ
  rationale: ദൈവനാമം പദവിയാൽ പകരാതെ ‘യാഹ്‌വെ’ എന്നു നിലനിർത്തുകയും ഉടമ്പടിബന്ധം സൂചിപ്പിക്കുന്ന ‘നിന്റെ ദൈവം’ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי הוּא הַנֹּתֵן לְךָ כֹּחַ
  choice: ശക്തി നിനക്കു നൽകുന്നത് അവിടുന്നുതന്നെയാണ്
  rationale: הוּא എന്ന ഊന്നൽ ‘അവിടുന്നുതന്നെയാണ്’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു; പങ്കാളിക്രിയയുടെ പതിവായ/തുടരുന്ന പ്രവർത്തനഭാവവും നിലനിർത്തുന്നു.
- source_word: לַעֲשׂוֹת חָיִל
  choice: സമ്പത്ത് നേടാനുള്ള
  rationale: 8:17-ലെ സമ്പത്തിന്റെ സന്ദർഭത്തിൽ സാമ്പത്തിക അർഥം യോജിക്കുന്നു; പദസമുച്ചയത്തിന്റെ വിശാലമായ ‘വിജയം കൈവരിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לְמַעַן הָקִים אֶת בְּרִיתוֹ
  choice: തന്റെ ഉടമ്പടി ... സ്ഥാപിക്കേണ്ടതിനാണ്
  rationale: לְמַעַן-ന്റെ ഉദ്ദേശ്യഭാവവും, ഹിഫീൽ הָקִים-ന്റെ ഉടമ്പടി ചരിത്രത്തിൽ പ്രാബല്യത്തിൽ വരുത്തുക/സ്ഥിരീകരിക്കുക എന്ന അർഥപരിധിയും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരോടു സത്യംചെയ്ത
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനവും ഗോത്രപിതാക്കന്മാരോടുള്ള ഉടമ്പടിയുടെ പ്രത്യേക സൂചനയും നിലനിർത്തുന്നു.
- source_word: כַּיּוֹם הַזֶּה
  choice: ഇന്നുള്ളതുപോലെ
  rationale: ഇപ്പോൾ കാണാവുന്ന യാഥാർഥ്യത്തെ ചൂണ്ടുന്ന ആവർത്തനപുസ്തകത്തിലെ ഹീബ്രു പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: חָיִל എന്നതിന്റെ സന്ദർഭോചിത അർഥം
  choice: സമ്പത്ത്
  alternative: വിജയം / അഭിവൃദ്ധി
  rationale: മുൻവാക്യത്തിലെ സമ്പത്തിനെക്കുറിച്ചുള്ള സ്വയംപ്രശംസയാണ് ഉടൻസന്ദർഭം; വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: הָקִים എന്നതിന്റെ ഉടമ്പടിസംബന്ധമായ അർഥം
  choice: സ്ഥാപിക്കുക
  alternative: ഉറപ്പിക്കുക / നിറവേറ്റുക
  rationale: ഉടമ്പടി മുമ്പ് ഉണ്ടായിരുന്നില്ലെന്നു സൂചിപ്പിക്കാതെ, അതിനെ ചരിത്രത്തിൽ പ്രാബല്യത്തിൽ വരുത്തുന്ന ആശയം നൽകുന്നു; അർഥപരിധി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: אֲבֹתֶיךָ എന്ന അഭിസംബോധന
  choice: നിന്റെ പിതാക്കന്മാർ
  alternative: നിന്റെ പൂർവികർ
  rationale: അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നീ ഉടമ്പടിപിതാക്കന്മാരിലേക്കുള്ള പ്രത്യേക സൂചന മങ്ങിപ്പോകാതിരിക്കാൻ മൂലത്തിലെ രൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. വാക്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കിക്കൊണ്ട് ഹീബ്രുവിലെ ഊന്നൽ, ഉദ്ദേശ്യബന്ധം, ഉടമ്പടിഭാഷ, ദൈവനാമം എന്നിവ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാചകഘടകങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
