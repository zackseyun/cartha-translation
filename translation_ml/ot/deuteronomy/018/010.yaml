reference: Deuteronomy 18:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא יִמָּצֵ֣א בְ/ךָ֔ מַעֲבִ֥יר בְּנֽ/וֹ וּ/בִתּ֖/וֹ בָּ/אֵ֑שׁ קֹסֵ֣ם קְסָמִ֔ים מְעוֹנֵ֥ן וּ/מְנַחֵ֖שׁ וּ/מְכַשֵּֽׁף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിൽ തന്റെ മകനെയോ മകളെയോ തീയിലൂടെ കടത്തുന്നവനോ[a], ഭവിഷ്യവാദം നടത്തുന്നവനോ, ഭാവി പറയുന്നവനോ[b], ശകുനം നോക്കുന്നവനോ[c], മാന്ത്രികവിദ്യ പ്രയോഗിക്കുന്നവനോ ഉണ്ടാകരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തന്റെ മകനെയോ മകളെയോ തീയിൽ ദഹിപ്പിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘തന്റെ മകനെയോ മകളെയോ തീയിൽ അർപ്പിക്കുന്നവൻ.’ എബ്രായഭാഷയിൽ അക്ഷരാർഥം ‘തന്റെ മകനെയോ മകളെയോ തീയിലൂടെ കടത്തുന്നവൻ’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: അർഥനിർണയം ദുഷ്കരമായ എബ്രായപദം. ‘കാലലക്ഷണങ്ങൾ നിരീക്ഷിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘ശകുനജ്ഞൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ശകുനങ്ങളെ ആധാരമാക്കി ഭവിഷ്യവാദം നടത്തുന്നവൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: നിങ്ങളുടെ ഇടയിൽ ... ഉണ്ടാകരുത്
  rationale: നിഷേധത്തോടുകൂടിയ നിഫാൽ ക്രിയാരൂപം ഉടമ്പടിസമൂഹത്തിൽ അനുവദിക്കരുതാത്ത കാര്യത്തെ നിയമപരമായി വിലക്കുന്നു; בְךָ എന്നത് ഈ സമൂഹസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘നിങ്ങളുടെ ഇടയിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: തന്റെ മകനെയോ മകളെയോ തീയിലൂടെ കടത്തുന്നവൻ
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം അക്ഷരാർഥത്തിൽ ‘കടത്തുക’ എന്നാണ്. കുട്ടികളും തീയും ഉൾപ്പെടുന്ന നിരോധിത അനുഷ്ഠാനത്തിന്റെ കൃത്യരൂപം വാക്യം വ്യക്തമാക്കാത്തതിനാൽ എബ്രായ പ്രയോഗം നിലനിർത്തി.
- source_word: קֹסֵם קְסָמִים
  choice: ദിവ്യജ്ഞാനം നടത്തുന്നവൻ
  rationale: ക്രിയാനാമസംബന്ധിയായ പദത്തോടുകൂടിയ കർത്തൃവാചക രൂപം ദിവ്യജ്ഞാനപ്രവൃത്തിയെ ഊന്നുന്നു. ‘ദിവ്യജ്ഞാനം നടത്തുക’ എന്നത് മതപരമായി നിഷ്പക്ഷവും ഈ സാങ്കേതിക അർഥം വ്യക്തമാക്കുന്നതുമായ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: מְעוֹנֵן
  choice: ഭാവി പറയുന്നവൻ
  rationale: അർഥനിർണയം ദുഷ്കരമായ ഈ പദത്തിന് കാലലക്ഷണം നിരീക്ഷിക്കുന്നവൻ, ശകുനജ്ഞൻ തുടങ്ങിയ വ്യാഖ്യാനങ്ങളുണ്ട്. അടുത്ത പദവുമായി പൂർണമായി ലയിപ്പിക്കാതെ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ‘ഭാവി പറയുന്നവൻ’ എന്നു നൽകി.
- source_word: מְנַחֵשׁ
  choice: ശകുനം നോക്കുന്നവൻ
  rationale: ലക്ഷണങ്ങളിലൂടെയോ ശകുനങ്ങളിലൂടെയോ നിഗമനം നടത്തുന്നതുമായി ഈ പദം ബന്ധപ്പെട്ടിരിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും മുൻപുള്ള പൊതുവായ ദിവ്യജ്ഞാനപ്രയോഗത്തിൽനിന്ന് വേർതിരിക്കാവുന്നതുമായ രൂപമാണിത്.
- source_word: מְכַשֵּׁף
  choice: മന്ത്രവാദം നടത്തുന്നവൻ
  rationale: പീയേൽ കർത്തൃവാചക രൂപം മാന്ത്രികവിദ്യകൾ പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. പട്ടികയുടെ വ്യാകരണഘടനയോടു ചേരുന്നതും ആധുനിക മലയാളത്തിൽ വ്യക്തവുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: കുട്ടിയെ തീയിലൂടെ കടത്തുന്നതെന്ന വിലക്കിന്റെ സ്വഭാവം
  choice: ‘തന്റെ മകനെയോ മകളെയോ തീയിലൂടെ കടത്തുന്നവൻ’ എന്ന എബ്രായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘തീയിൽ ദഹിപ്പിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘തീയിൽ ബലിയർപ്പിക്കുന്നവൻ.’
  rationale: ഈ സന്ദർഭം കുട്ടികളും തീയും ഉൾപ്പെടുന്ന ഒരു വിജാതീയ അനുഷ്ഠാനത്തെ വ്യക്തമായി അപലപിക്കുന്നു. എന്നാൽ ഈ വാക്യത്തിലെ എബ്രായപ്രയോഗം അതിന്റെ എല്ലാ വിശദാംശങ്ങളും വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ബലിയോ ദഹിപ്പിക്കലോ എന്ന് മുഖ്യപാഠത്തിൽ നിർണയിക്കാതെ യഥാർഥമായ അർഥവ്യാപ്തി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന എബ്രായ കർത്തൃവാചക രൂപങ്ങൾ ‘...വനോ’ എന്ന സമാന്തരഘടനയിൽ നൽകി. സാങ്കേതിക പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നവയാക്കി, എന്നാൽ സമീപസ്ഥമായ ഗൂഢാചാരപദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തി.
