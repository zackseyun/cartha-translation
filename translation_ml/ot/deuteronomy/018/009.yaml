id: DEU.18.9
reference: Deuteronomy 18:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י אַתָּה֙ בָּ֣א אֶל הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹֽא תִלְמַ֣ד לַ/עֲשׂ֔וֹת כְּ/תוֹעֲבֹ֖ת הַ/גּוֹיִ֥ם הָ/הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു തരുന്ന ദേശത്തേക്കു നീ പ്രവേശിക്കുമ്പോൾ, ആ ജനതകളുടെ വെറുപ്പുളവാക്കുന്ന ആചാരങ്ങൾക്കനുസരിച്ച് പ്രവർത്തിക്കാൻ നീ പഠിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ ജനതകളുടെ വെറുപ്പുളവാക്കുന്ന ആചാരങ്ങൾപോലെ”; ഹീബ്രു ഉപസർഗത്തിന് താരതമ്യമോ അനുരൂപതയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אַתָּה בָּא
  choice: നീ പ്രവേശിക്കുമ്പോൾ
  rationale: ഇവിടെ כִּי തുടർന്നുവരുന്ന വിലക്കിന്റെ കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; בָּא ദേശത്തേക്കുള്ള പ്രവേശനത്തെ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ പ്രചാരത്തിലുള്ള ശബ്ദലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: נֹתֵן לָךְ
  choice: നിനക്കു തരുന്ന
  rationale: വർത്തമാന കൃദന്തത്തിന്റെ തുടരുന്ന/ആസന്നമായ ദാനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  choice: പ്രവർത്തിക്കാൻ നീ പഠിക്കരുത്
  rationale: നിയമപരമായ വിലക്കും ‘ചെയ്യാൻ പഠിക്കുക’ എന്ന മൂലഭാഷയിലെ ഘടനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כְּתוֹעֲבֹת
  choice: വെറുപ്പുളവാക്കുന്ന ആചാരങ്ങൾക്കനുസരിച്ച്
  rationale: תּוֹעֵבָהയുടെ ശക്തമായ ധാർമിക-ആരാധനാപരമായ അപലപനവും כְ സൂചിപ്പിക്കുന്ന അനുരൂപതയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַגּוֹיִם הָהֵם
  choice: ആ ജനതകളുടെ
  rationale: ബഹുവചനവും ദൂരസൂചകവുമായ ഹീബ്രു പ്രയോഗം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ പദവിയാക്കി മാറ്റാതെ ശബ്ദലിപ്യന്തരണം ചെയ്തു; ‘യഹ്‌വെ’ സാധ്യതയേറിയ ഹീബ്രു ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: תּוֹעֵבָהയുടെ ശക്തി
  choice: വെറുപ്പുളവാക്കുന്ന ആചാരങ്ങൾ
  alternative: മ്ലേച്ഛാചാരങ്ങൾ; അറപ്പുളവാക്കുന്ന പ്രവൃത്തികൾ
  rationale: തുടർന്നുള്ള വാക്യങ്ങളിൽ വിശദീകരിക്കുന്ന പ്രവൃത്തികളെ മുൻകൂട്ടി അനാവശ്യമായി ചുരുക്കാതെ, പദത്തിന്റെ ശക്തമായ അപലപനം ആധുനികവും വ്യക്തവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- issue: כְ എന്ന ഉപസർഗത്തിന്റെ അർഥം
  choice: അനുസരിച്ച്
  alternative: പോലെ
  rationale: ഇവിടെ താരതമ്യവും അനുരൂപതയും രണ്ടും സാധ്യമാണ്; മുഖ്യപാഠത്തിൽ അനുരൂപത സ്വീകരിക്കുകയും മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. അത്യന്തം സംസ്കൃതവൽക്കരിച്ച ‘മ്ലേച്ഛാചാരങ്ങൾ’ ഒഴിവാക്കി, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘വെറുപ്പുളവാക്കുന്ന ആചാരങ്ങൾ’ തിരഞ്ഞെടുത്തു.
