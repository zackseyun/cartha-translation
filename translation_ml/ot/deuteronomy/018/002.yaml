  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נַחֲלָ֥ה לֹא יִֽהְיֶה לּ֖/וֹ בְּ/קֶ֣רֶב אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/002.yaml
  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
translation:
  language: ml
  text: അവന് തന്റെ സഹോദരന്മാരുടെ ഇടയിൽ യാതൊരു അവകാശവും ഉണ്ടായിരിക്കുകയില്ല[a]. യാഹ്‌വെ തന്നെയാണ് അവന്റെ അവകാശം; അവനോടു പറഞ്ഞതുപോലെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തന്റെ ബന്ധുക്കളുടെ ഇടയിൽ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘തന്റെ സഹോദരന്മാർ’ എന്നാണ്; സന്ദർഭത്തിൽ ഇത് മറ്റു ഇസ്രായേല്യരെയും പ്രത്യേകിച്ച് മറ്റു ഗോത്രങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവനോടു സംസാരിച്ചതുപോലെ.’ എബ്രായക്രിയ സാധാരണയായി ‘പറയുക/സംസാരിക്കുക’ എന്നാണ്. സന്ദർഭത്തിൽ ‘അവനോടു വാഗ്ദാനം ചെയ്തതുപോലെ’ എന്ന ആശയം സാധ്യമാണെങ്കിലും അത് കൂടുതൽ വ്യാഖ്യാനപരമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: അവകാശം
  rationale: ആവർത്തിക്കുന്ന എബ്രായപദം ആദ്യഭാഗത്തിൽ ലഭിക്കുന്ന പാരമ്പര്യവിഹിതത്തെയും രണ്ടാമത്തെ ഭാഗത്തിൽ യാഹ്‌വെ തന്നെയായുള്ള ഉടമ്പടിപരമായ അവകാശത്തെയും സൂചിപ്പിക്കുന്നു. രണ്ടിടത്തും ഒരേ മലയാളപദം ഉപയോഗിക്കുന്നത് മൂലത്തിലെ ആവർത്തനവും രൂപകാത്മക സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: בְּקֶרֶב
  choice: ഇടയിൽ
  rationale: ‘അവന്റെ സഹോദരന്മാരുടെ ഇടയിൽ’ എന്ന ബന്ധപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶחָיו
  choice: തന്റെ സഹോദരന്മാർ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചനമായ ‘അവന്റെ സഹോദരന്മാർ’ എന്ന രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് മറ്റു ഇസ്രായേൽ ഗോത്രക്കാരെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הוּא
  choice: തന്നെയാണ്
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ ‘തന്നെയാണ്’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: അവനോടു പറഞ്ഞതുപോലെതന്നെ
  rationale: דִּבֶּר എന്ന സാധാരണ ‘പറയുക/സംസാരിക്കുക’ എന്ന ക്രിയയെ ‘വാഗ്ദാനം ചെയ്തു’ എന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: ഏകവചന സർവനാമങ്ങളുടെ (‘അവന്,’ ‘അവന്റെ’) സൂചന
  choice: ലേവ്യനെയോ ലേവ്യപൗരോഹിത്യത്തെയോ പ്രതിനിധാനം ചെയ്യുന്ന സമൂഹവാചക ഏകവചനം നിലനിർത്തി.
  alternative: ഗോത്രപിതാവായ ലേവിയെ മാത്രം സൂചിപ്പിക്കുന്നതായോ ഓരോ പുരോഹിതനെയും പ്രത്യേകം സൂചിപ്പിക്കുന്ന വിതരണാത്മക ഏകവചനമായോ വ്യക്തമാക്കുക.
  rationale: സമീപസന്ദർഭം ലേവ്യപൗരോഹിത്യത്തെയും ഗോത്രത്തെയും കുറിച്ചുള്ളതാണ്. എബ്രായത്തിലെ പ്രതിനിധാനപരമായ ഏകവചനം നിലനിർത്തുന്നത് ഒരു പ്രത്യേക വ്യാഖ്യാനം നിർബന്ധമാക്കുന്നില്ല.
- issue: ‘യാഹ്‌വെ തന്നെയാണ് അവന്റെ അവകാശം’ എന്ന പ്രസ്താവനയുടെ സ്വഭാവം
  choice: ഉടമ്പടിപരവും രൂപകാത്മകവുമായ പ്രസ്താവന വിശദീകരിച്ചു വികസിപ്പിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: ‘ഭൂമിക്കു പകരം യാഹ്‌വെയാണ് ലേവ്യരുടെ വിഹിതം’ എന്ന് വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക.
  rationale: യാഹ്‌വെ തന്നെയാണ് അവകാശം എന്ന മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ സമൃദ്ധിയും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘യാതൊരു അവകാശവും’ എന്ന പ്രയോഗം നിഷേധത്തിന്റെ പൂർണത വ്യക്തമാക്കുന്നു; ‘തന്നെയാണ്’ മൂലത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു. പ്രധാന എബ്രായപദത്തിന്റെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി.
