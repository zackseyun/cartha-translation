reference: Deuteronomy 18:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי תוֹעֲבַ֥ת יְהוָ֖ה כָּל עֹ֣שֵׂה אֵ֑לֶּה וּ/בִ/גְלַל֙ הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔לֶּה יְהוָ֣ה אֱלֹהֶ֔י/ךָ מוֹרִ֥ישׁ אוֹתָ֖/ם מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: ml
  text: കാരണം, ഈ കാര്യങ്ങൾ ചെയ്യുന്ന ഏവനും യഹ്‌വെക്കു അറപ്പുളവാക്കുന്നവനാണ്; ഈ അറപ്പുളവാക്കുന്ന കാര്യങ്ങൾ നിമിത്തം നിന്റെ ദൈവമായ യഹ്‌വെ അവരെ നിന്റെ മുമ്പിൽനിന്ന് പുറത്താക്കുകയാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ദേശാവകാശം നഷ്ടപ്പെടുത്തുകയാണ്.’ എബ്രായ ക്രിയയ്ക്ക് ജനതകളെ പുറത്താക്കുന്നതോടൊപ്പം അവരുടെ ദേശം കൈവശംവെക്കാനുള്ള അവകാശം നഷ്ടപ്പെടുത്തുക എന്ന ആശയവും ഊന്നിപ്പറയാൻ കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന വാക്യബന്ധം (മലയാളത്തിൽ പ്രത്യേക പദമില്ലാതെ അർധവിരാമത്തിലൂടെ)
  rationale: മുൻവാക്യത്തിലെ നിരോധനത്തിന്റെ കാരണം ഈ വാക്യം വിശദീകരിക്കുന്നു. ഒറ്റവാക്യമായ ഈ വിവർത്തനത്തിൽ ആദ്യ ഉപവാക്യവും തുടർന്നുള്ള ന്യായവിധിയും അർധവിരാമംകൊണ്ട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: תוֹעֲבַת יְהוָה
  choice: യഹ്‌വെക്ക് അറപ്പാണ്
  rationale: תוֹעֵבָה എന്ന പദത്തിന്റെ ശക്തമായ ധാർമികവും ഉടമ്പടിപരവുമായ നിഷേധഭാവം നിലനിർത്തുകയും, പ്രവൃത്തി ചെയ്യുന്ന വ്യക്തിയെത്തന്നെയാണ് വാചകം വിശേഷിപ്പിക്കുന്നതെന്ന രൂപം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തോട് ചേർന്ന മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: ഈ കാര്യങ്ങൾ ചെയ്യുന്ന ഏവനും
  rationale: כָּל എന്ന സർവവ്യാപകതയും participle സൂചിപ്പിക്കുന്ന പതിവായ പ്രവർത്തനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּבִגְלַל
  choice: നിമിത്തം
  rationale: തുടർന്നുള്ള ന്യായവിധിയുടെ കാരണത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന, മാന്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: അറപ്പുളവാക്കുന്ന ഈ കാര്യങ്ങൾ
  rationale: മുൻപത്തെ תוֹעֵבָהയുമായുള്ള പദാർഥബന്ധം ‘അറപ്പ്’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തുന്നു; മുൻവാക്യങ്ങളിലെ നിരോധിത ആചാരങ്ങളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള ഇസ്രായേലിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന സംരക്ഷിക്കുന്നു.
- source_word: מוֹרִישׁ אֹתָם
  choice: അവരെ ... പുറത്താക്കുകയാണ്
  rationale: ירש എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ജനതകളെ ദേശത്തുനിന്ന് നീക്കുന്നതോ അവരുടെ കൈവശം നഷ്ടപ്പെടുത്തുന്നതോ സൂചിപ്പിക്കുന്നു. പ്രധാന പാഠം സാഹചര്യത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു; മറ്റൊരു അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: ‘നിന്റെ മുഖസന്നിധിയിൽനിന്ന്’ എന്ന അക്ഷരാർഥത്തോട് അടുത്തുനിൽക്കുകയും കീഴടക്കത്തിന്റെ സാഹചര്യത്തിൽ ഇസ്രായേലിന്റെ മുമ്പിൽനിന്നുള്ള നീക്കത്തെ വ്യക്തമായി അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, Hebrew YHWH-ന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: תוֹעֵבָה പ്രവൃത്തിയെയോ പ്രവൃത്തി ചെയ്യുന്നയാളെയോ വിശേഷിപ്പിക്കുന്നുവോ
  choice: ഈ കാര്യങ്ങൾ ചെയ്യുന്ന ഏവനും യഹ്‌വെക്ക് അറപ്പാണ്
  alternative: ഈ പ്രവൃത്തികൾ യഹ്‌വെക്ക് അറപ്പാണ്
  rationale: മൂലവാക്യത്തിന്റെ വ്യാകരണത്തിൽ ‘ചെയ്യുന്ന ഏവനും’ തന്നെയാണ് תוֹעֲבַת יְהוָה എന്നു പറയുന്നത്. അതിലെ ശക്തിയും അസൗകര്യകരമായ ധാർമിക പിരിമുറുക്കവും മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘അറപ്പ്’ എന്ന ശക്തമായ പദം תוֹעֵבָהയുടെ ധാർമിക തീവ്രതയ്ക്കായി തെരഞ്ഞെടുത്തു; ‘മ്ലേച്ഛത’ പോലുള്ള പഴയതും അനാവശ്യ സാമൂഹിക ധ്വനികളുള്ളതുമായ പദങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘പുറത്താക്കുകയാണ്’ എന്ന ക്രിയയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
