id: DEU.18.15
reference: Deuteronomy 18:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: נָבִ֨יא מִ/קִּרְבְּ/ךָ֤ מֵ/אַחֶ֨י/ךָ֙ כָּמֹ֔/נִי יָקִ֥ים לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֵלָ֖י/ו תִּשְׁמָעֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ നിനക്കായി, നിന്റെ ഇടയിൽനിന്ന്[a], നിന്റെ സഹോദരന്മാരിൽനിന്ന്, എന്നെപ്പോലെയുള്ള ഒരു പ്രവാചകനെ[b] എഴുന്നേൽപ്പിക്കും; നിങ്ങൾ അവന്റെ വാക്കു കേൾക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിന്റെ മധ്യത്തിൽനിന്ന്, നിന്റെ സഹഇസ്രായേല്യരിൽനിന്ന്.’ ‘നിന്റെ സഹോദരന്മാർ’ എന്ന എബ്രായപ്രയോഗത്തിലെ പുരുഷലിംഗ ബന്ധുപദം ഇവിടെ പൊതുവായി ഇസ്രായേൽജനത്തിലെ അംഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: പുതിയ നിയമത്തിൽ ഈ വാക്യം മശീഹായ്ക്ക് ബാധകമാക്കുന്നു; എന്നാൽ ഇവിടെ എബ്രായപാഠം നേരിട്ട് പറയുന്നത് ‘എന്നെപ്പോലെയുള്ള ഒരു പ്രവാചകൻ’ എന്നാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: נָבִיא
  choice: ഒരു പ്രവാചകനെ
  rationale: എബ്രായത്തിലെ ഏകവചനത്തെ നിലനിർത്തുകയും വ്യക്തിയുടെ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ അധികമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מִקִּרְבְּךָ
  choice: നിന്റെ ഇടയിൽനിന്ന്
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ മധ്യത്തിൽനിന്ന്’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; പ്രവാചകൻ ഇസ്രായേലിന്റെ ഉള്ളിൽനിന്നാണ് വരുന്നതെന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: מֵאַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാരിൽനിന്ന്
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചന ബന്ധുപദം ഔപചാരികമായി നിലനിർത്തുന്നു; ഇവിടെ അത് പൊതുവായി സഹഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്നുവെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּמֹנִי
  choice: എന്നെപ്പോലെയുള്ള
  rationale: മോശെയോടുള്ള നേരിട്ടുള്ള താരതമ്യം ലളിതമായും വ്യക്തമായും സംരക്ഷിക്കുന്നു.
- source_word: יָקִים לְךָ
  choice: നിനക്കായി … എഴുന്നേല്പിക്കും
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘എഴുന്നേല്പിക്കുക/നിയോഗിക്കുക’ എന്ന ഭാവവും לְךָ എന്നതിലെ പ്രയോജനാർഥവും നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമമായ יהוה എന്നത് വ്യക്തിനാമമായി ‘യഹോവ’ എന്നു നൽകുകയും ഉടമ്പടിസംബന്ധമായ മുഴുവൻ പ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֵלָיו תִּשְׁמָעוּן
  choice: നിങ്ങൾ അവന്റെ വാക്കു കേൾക്കണം
  rationale: ശ്രദ്ധിച്ചു കേൾക്കുകയും അനുസരണയോടെ ചെവികൊടുക്കുകയും ചെയ്യണമെന്ന שׁמע എന്ന ക്രിയയുടെ സന്ദർഭാർഥവും നിർബന്ധസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അനുസരിക്കണം’ എന്നു മാത്രം പറഞ്ഞ് അർഥം അധികമായി നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: ‘എന്നെപ്പോലെയുള്ള ഒരു പ്രവാചകൻ’ എന്നതിന്റെ മശീഹാസംബന്ധമായ പ്രത്യേകത
  choice: എബ്രായപാഠത്തിലെ അനിശ്ചിത ഏകവചനമായ ‘ഒരു പ്രവാചകൻ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
  alternative: ‘ആ പ്രവാചകൻ’ എന്നോ ‘മശീഹയായ പ്രവാചകൻ’ എന്നോ വ്യക്തമായി നിർവചിക്കുക; അല്ലെങ്കിൽ പ്രവാചകസ്ഥാപനത്തെ മാത്രം സൂചിപ്പിക്കുന്ന സമൂഹവായന സ്വീകരിക്കുക.
  rationale: എബ്രായവാക്യം തന്നെ ‘എന്നെപ്പോലെയുള്ള ഒരു പ്രവാചകൻ’ എന്നാണ് പറയുന്നത്. പിന്നീടുള്ള പുതിയനിയമ പ്രയോഗം പ്രധാനമാണെങ്കിലും അത് മുഖ്യപാഠത്തിന്റെ വാക്കുകളിൽ ചേർത്ത് അനിശ്ചിതത്വം ഇല്ലാതാക്കുന്നില്ല; അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: אָח (‘സഹോദരന്മാർ’) എന്ന പദത്തിന്റെ പ്രതിനിധാനപരമായ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാർ’ നിലനിർത്തി അതിന്റെ സമൂഹപരമായ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
  alternative: ‘സഹഇസ്രായേല്യർ’, ‘സ്വജനങ്ങൾ’, അല്ലെങ്കിൽ ‘സഹോദരീസഹോദരന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഇത് എബ്രായത്തിലെ പുരുഷലിംഗ ബന്ധുപദത്തിന്റെ രൂപം കാത്തുസൂക്ഷിക്കുന്നു; അതേസമയം ഇവിടെ മുഴുവൻ ഇസ്രായേൽസമൂഹത്തിലെ അംഗങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: ഏകവചന അഭിസംബോധനയിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റം
  choice: ‘നിന്റെ/നിനക്കായി’ എന്ന ഏകവചനവും ‘നിങ്ങൾ’ എന്ന ബഹുവചനവും അതേപടി നിലനിർത്തുന്നു.
  alternative: മലയാളത്തിൽ എല്ലായിടത്തും ഏകവചനമോ എല്ലായിടത്തും ബഹുവചനമോ ഉപയോഗിച്ച് ഏകീകരിക്കുക.
  rationale: മൂലപാഠം ഇസ്രായേലിനെ ആദ്യം സമൂഹത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്തശേഷം അവസാന ക്രിയയിൽ ബഹുവചനം ഉപയോഗിക്കുന്നു. ഈ അർഥസൂക്ഷ്മത ഇല്ലാതാക്കാതിരിക്കാൻ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എഴുന്നേല്പിക്കും’ എന്ന പരമ്പരാഗത ബൈബിൾപ്രയോഗം സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ ക്രിയാചിത്രം നിലനിർത്തുന്നതുമാണ്. മൂലത്തിലെ ഏകവചന–ബഹുവചന അഭിസംബോധന വ്യത്യാസം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിട്ടുണ്ട്.
