  source_fidelity: 'മുഖ്യവാക്യം എബ്രായപാഠത്തിന്റെ അർഥവും ക്രമത്തിലെ പ്രധാന ഘടകങ്ങളും നന്നായി സംരക്ഷിക്കുന്നു: ഇസ്രായേലിന്റെ ഉള്ളിൽനിന്നുള്ള, മോശെയെപ്പോലെയുള്ള ഒരു പ്രവാചകനെ ദൈവം ഉയർത്തിക്കൊണ്ടുവരും; ജനങ്ങൾ അവനെ കേൾക്കണം. ഏകവചന അഭിസംബോധനയിൽനിന്ന് അവസാനത്തെ ബഹുവചന ക്രിയയിലേക്കുള്ള മാറ്റവും നിലനിൽക്കുന്നു. എന്നാൽ ‘എഴുന്നേല്പിക്കും’ എന്ന രൂപത്തിനു പകരം ആധുനിക നിലവാരരൂപമായ ‘എഴുന്നേൽപ്പിക്കും’ വേണം.'
  naturalness: വാക്യം ഗൗരവമുള്ള ആധുനിക ബൈബിൾമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘അവന്റെ വാക്കു കേൾക്കണം’ എന്നത് എബ്രായത്തിലെ ‘അവനോടു കേൾക്കുക’ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്; പുതിയ ഉപദേശം കൂട്ടിച്ചേർക്കുന്നില്ല.
