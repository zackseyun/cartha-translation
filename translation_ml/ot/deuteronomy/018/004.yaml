id: DEU.18.4
reference: Deuteronomy 18:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רֵאשִׁ֨ית דְּגָֽנְ/ךָ֜ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֗/ךָ וְ/רֵאשִׁ֛ית גֵּ֥ז צֹאנְ/ךָ֖ תִּתֶּן לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/004.yaml
  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: ml
  text: നിന്റെ ധാന്യത്തിന്റെയും പുതുവീഞ്ഞിന്റെയും[b] എണ്ണയുടെയും ആദ്യവിഹിതം[a], നിന്റെ ആട്ടിൻകൂട്ടത്തിൽനിന്നു കത്രിച്ച രോമത്തിന്റെ ആദ്യവിഹിതം[c] എന്നിവ നീ അവനു കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ധാന്യത്തിന്റെയും വീഞ്ഞിന്റെയും എണ്ണയുടെയും ആദ്യഫലം.’
    reason: lexical_alternative
  - marker: b
    text: ‘പുതുവീഞ്ഞ്’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം പലപ്പോഴും പുതുതായി ഉത്പാദിപ്പിച്ച വീഞ്ഞിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘നിന്റെ ആട്ടിൻകൂട്ടത്തിൽനിന്ന് ആദ്യം കത്രിച്ച രോമം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: ആദ്യവിഹിതം
  rationale: ഈ പദം ആദ്യത്തേതിനെയോ ആരംഭത്തിൽ വേർതിരിക്കുന്ന വിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു. ധാന്യം, വീഞ്ഞ്, എണ്ണ, കത്രിച്ച രോമം എന്നിവയെ ഒരുപോലെ ഉൾക്കൊള്ളാനും പദത്തിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്താനും ‘ആദ്യവിഹിതം’ സ്വാഭാവികമാണ്.
- source_word: דָּגָן
  choice: ധാന്യം
  rationale: വിവിധ ധാന്യവിളകളെ പൊതുവായി സൂചിപ്പിക്കുന്ന ആധുനികവും വ്യക്തവുമായ മലയാളപദമാണിത്.
- source_word: תִּירוֹשׁ
  choice: പുതുവീഞ്ഞ്
  rationale: പുതുതായി ഉത്പാദിപ്പിച്ച വീഞ്ഞിനെയോ മുന്തിരിനീരിൽനിന്നുള്ള പുതിയ വീഞ്ഞിനെയോ സാധാരണ സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന്റെ പ്രത്യേകത ഇത് നിലനിർത്തുന്നു.
- source_word: יִצְהָר
  choice: എണ്ണ
  rationale: ഇസ്രായേല്യ പശ്ചാത്തലത്തിൽ സാധാരണ ഒലിവെണ്ണയായിരുന്നെങ്കിലും മൂലപാഠം പറയുന്നതിലധികം വ്യക്തമാക്കാതെ ‘എണ്ണ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: גֵּז
  choice: കത്രിച്ച രോമം
  rationale: കത്രിക്കൽ എന്ന പ്രവൃത്തിയെയോ അതിലൂടെ ലഭിക്കുന്ന രോമത്തെയോ പദം സൂചിപ്പിക്കാം. ഇവിടെ പുരോഹിതനു നൽകുന്ന വസ്തുവെന്ന നിലയിൽ കത്രിച്ച രോമം എന്ന അർത്ഥം യോജിക്കുന്നു.
- source_word: צֹאן
  choice: ആട്ടിൻകൂട്ടം
  rationale: പദം ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലിക്കൂട്ടത്തെ സൂചിപ്പിക്കാമെങ്കിലും രോമം കത്രിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ആട്ടിൻകൂട്ടം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: תִּתֶּן לוֹ
  choice: നീ അവനു കൊടുക്കണം
  rationale: നിയമപരമായ നിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ഏകവചന സർവനാമവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: לוֹ (‘അവന്’) എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: സമീപസന്ദർഭത്തിലെ പുരോഹിതസ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന ‘അവന്’ എന്ന ഏകവചനരൂപം നിലനിർത്തി
  alternative: ഒരു പ്രതിനിധി പുരോഹിതനെയോ പുരോഹിതവർഗത്തെ കൂട്ടായോ വ്യക്തമായി പറയുക
  rationale: എബ്രായത്തിൽ സർവനാമം ഏകവചനമാണ്. സന്ദർഭം പുരോഹിതനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, പാഠം പറയുന്നതിലധികം നിർണയിക്കാതിരിക്കാൻ ‘അവന്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമനിർദേശത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വാക്യഘടന ഉപയോഗിച്ചു. വിളവിനും കത്രിച്ച രോമത്തിനും യോജിക്കുന്ന പൊതുപദമായി ‘ആദ്യവിഹിതം’ തിരഞ്ഞെടുത്തു; മൂലപാഠത്തിലെ ആവർത്തനം മലയാളത്തിൽ നിലനിർത്തി.
