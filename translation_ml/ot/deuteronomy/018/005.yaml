base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: ml
  text: കാരണം, നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങളുടെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും അവനെയും അവന്റെ പുത്രന്മാരെയും എല്ലാ നാളുകളിലും യഹോവയുടെ നാമത്തിൽ നിൽക്കാനും ശുശ്രൂഷിക്കാനും തിരഞ്ഞെടുത്തിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘എല്ലാ നാളുകളിലും.’ ഈ പ്രയോഗം തുടർച്ചയായി നിലനിൽക്കുന്ന പുരോഹിതശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ നിയമത്തിനുള്ള അടിസ്ഥാനം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בּוֹ בָּחַר
  choice: അവനെ തിരഞ്ഞെടുത്തിരിക്കുന്നു
  rationale: בחר എന്ന ക്രിയയോടുകൂടിയ ב തിരഞ്ഞെടുക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; പൂർത്തിയായ ദൈവിക തിരഞ്ഞെടുപ്പിന്റെ തുടർന്നുനിൽക്കുന്ന പ്രസക്തി ഈ രൂപം നൽകുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവ
  rationale: നിയമനാമമായ יהוה എന്നത് ‘യഹോവ’യായി ലിപ്യന്തരം ചെയ്യുകയും രണ്ടാംപുരുഷ ഏകവചനബന്ധം മലയാളത്തിൽ മാന്യമായ ‘നിങ്ങളുടെ’ എന്ന രൂപത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: നിങ്ങളുടെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും
  rationale: ഇസ്രായേലിന്റെ ഗോത്രങ്ങളുടെ ഇടയിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: לַעֲמֹד לְשָׁרֵת
  choice: നിന്നു ശുശ്രൂഷിക്കേണ്ടതിന്
  rationale: ‘നിൽക്കുക’ എന്ന മൂർത്തമായ പുരോഹിതഭാവവും ആരാധനാസംബന്ധമായ സേവനവും നിലനിർത്തുന്നു.
- source_word: בְּשֵׁם יְהוָה
  choice: യഹോവയുടെ നാമത്തിൽ
  rationale: യഹോവയുടെ നാമാധികാരത്തിൽ നിർവഹിക്കുന്ന ശുശ്രൂഷ എന്ന അർത്ഥം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: הוּא וּבָנָיו
  choice: അവനും അവന്റെ പുത്രന്മാരും
  rationale: പുരോഹിതപിന്തുടർച്ചയുടെ സന്ദർഭത്തിൽ בנים എന്ന പുല്ലിംഗ ബഹുവചനത്തെ ലിംഗകൃത്യതയോടെ നൽകുന്നു.
- source_word: כָּל הַיָּמִים
  choice: എല്ലാ നാളുകളിലും
  rationale: എബ്രായത്തിലെ കാലദൈർഘ്യപ്രയോഗത്തിന്റെ രൂപം സംരക്ഷിക്കുമ്പോൾ തുടർച്ചയായ പുരോഹിതശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ നിയമനാമം പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
- issue: പുരോഹിതപിന്തുടർച്ചയിലെ ലിംഗസൂചന
  choice: അവനും അവന്റെ പുത്രന്മാരും
  alternative: അവനും അവന്റെ മക്കളും
  rationale: മൂലത്തിലെ വ്യക്തമായ പുല്ലിംഗരൂപവും ലേവ്യപുരോഹിതപിന്തുടർച്ചയുടെ സന്ദർഭവും സംരക്ഷിക്കുന്നു.
- issue: כָּל הַיָּמִים എന്ന കാലപ്രയോഗം
  choice: എല്ലാ നാളുകളിലും
  alternative: എന്നേക്കും
  rationale: ദീർഘകാലവും തുടർച്ചയും സൂചിപ്പിക്കുന്ന യഥാർഥ പ്രയോഗം നിലനിർത്തി, അതിന്റെ പരിധിയെ വ്യാഖ്യാനിച്ച് നിർണ്ണയിക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിന്നു ശുശ്രൂഷിക്കുക’ എന്ന പ്രയോഗം പുരോഹിതൻ ദൈവസന്നിധിയിൽ നിൽക്കുന്ന മൂലചിത്രം നിലനിർത്തുന്നു. വാക്യത്തിലെ രണ്ടാംപുരുഷ ഏകവചനം മലയാളത്തിൽ മാന്യവും പൊതുവായതുമായ ‘നിങ്ങളുടെ’ എന്നു നൽകിയിരിക്കുന്നു.
