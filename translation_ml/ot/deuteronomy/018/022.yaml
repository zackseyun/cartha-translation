id: DEU.18.22
reference: Deuteronomy 18:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲשֶׁר֩ יְדַבֵּ֨ר הַ/נָּבִ֜יא בְּ/שֵׁ֣ם יְהוָ֗ה וְ/לֹֽא יִהְיֶ֤ה הַ/דָּבָר֙ וְ/לֹ֣א יָב֔וֹא ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָ֑ה בְּ/זָדוֹן֙ דִּבְּר֣/וֹ הַ/נָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: ml
  text: പ്രവാചകൻ യഹ്‌വേയുടെ നാമത്തിൽ പറയുന്ന കാര്യം[a] സംഭവിക്കുകയോ നിറവേറുകയോ ചെയ്യുന്നില്ലെങ്കിൽ[b], അത് യഹ്‌വേ പറയാത്ത കാര്യമാണ്. പ്രവാചകൻ അത് ധാർഷ്ട്യത്തോടെ[c] പറഞ്ഞതാണ്; നീ അവനെ ഭയപ്പെടരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാര്യം’ എന്നതിന് ‘വചനം’ എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രു דָּבָר എന്ന പദം പറഞ്ഞ സന്ദേശത്തെയും മുൻകൂട്ടി അറിയിച്ച സംഭവത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഉണ്ടാകാതെയും വരാതെയും ഇരുന്നാൽ.’ ഇവിടെ രണ്ടു ക്രിയകളും പ്രവചനം സംഭവിക്കുകയോ നിറവേറുകയോ ചെയ്യാത്തതിനെ ഊന്നുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: ‘ധാർഷ്ട്യത്തോടെ’ എന്നത് യഹ്‌വേയുടെ അധികാരമില്ലാതെ അഹങ്കാരപൂർവവും മനഃപൂർവവുമായി പറയുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יְדַבֵּר
  choice: പറയുന്ന
  rationale: നിയമപരമായ സോപാധിക സന്ദർഭത്തിലെ ഹീബ്രു imperfect-ന്റെ പൊതുവായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പിന്നീടുള്ള ‘പറഞ്ഞതാണ്’ എന്ന ക്രിയയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: הַנָּבִיא
  choice: പ്രവാചകൻ
  rationale: നിശ്ചയാർഥക പ്രത്യയം ഉള്ള ഹീബ്രു രൂപത്തെ പ്രതിനിധികമായ പൊതുപ്രയോഗമായി, മലയാളത്തിൽ അനാവശ്യമായി ‘ഒരു’ ചേർക്കാതെ വിവർത്തനം ചെയ്യുന്നു.
- source_word: בְּשֵׁם יְהוָה
  choice: യഹ്‌വേയുടെ നാമത്തിൽ
  rationale: ദൈവിക അധികാരം അവകാശപ്പെട്ട് സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിസൂത്രം സ്വാഭാവികമായി നൽകുകയും യഹ്‌വേ എന്ന വ്യക്തിനാമം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַדָּבָר
  choice: കാര്യം
  rationale: דָּבָר എന്ന പദത്തിന് സന്ദേശത്തെയും മുൻകൂട്ടി പറഞ്ഞ സംഭവത്തെയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ ഇരുവശവും ഉൾക്കൊള്ളുന്ന ‘കാര്യം’ തെരഞ്ഞെടുത്തു; പദത്തിന്റെ ആവർത്തനം വാക്യത്തിലും നിലനിർത്തി.
- source_word: וְלֹא יִהְיֶה ... וְלֹא יָבֹא
  choice: സംഭവിക്കുകയോ നിറവേറുകയോ ചെയ്യുന്നില്ലെങ്കിൽ
  rationale: പ്രവചനത്തിന്റെ അസാഫല്യം ഊന്നുന്ന രണ്ടു ഹീബ്രു ക്രിയകളും വായനാസൗകര്യമുള്ള സമാന്തരപ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ יְהוָה
  choice: യഹ്‌വേ അരുളിച്ചെയ്യാത്ത
  rationale: ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കാൻ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ‘അരുളിച്ചെയ്യുക’ ഉപയോഗിക്കുന്നു; വാചകത്തിൽ ഇല്ലാത്ത അധിക ദൈവശാസ്ത്രവിവരണം ചേർക്കുന്നില്ല.
- source_word: בְּזָדוֹן
  choice: ധാർഷ്ട്യത്തോടെ
  rationale: അധികാരമില്ലാതെ മനഃപൂർവം സംസാരിക്കുന്നതിലെ അഹങ്കാരപരമായ ധാർഷ്ട്യം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: നീ അവനെ ഭയപ്പെടരുത്
  rationale: ഭയപ്പെടുകയോ ഭീഷണിക്കു വഴങ്ങുകയോ ചെയ്യരുതെന്ന നിരോധനത്തിന്റെ നേരിട്ടുള്ള നിയമബലം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: പ്രവാചകവചനത്തിന്റെ പരിശോധനയുടെ പരിധി
  choice: ഈ വാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന നിറവേറാത്ത പ്രവചനത്തെ ദൈവം അരുളിച്ചെയ്യാത്തതായി തിരിച്ചറിയുന്ന നിയമപരമായ പരിശോധന
  alternative: എല്ലാത്തരം പ്രവാചകശുശ്രൂഷകളെയും കുറിച്ചുള്ള വിശാലമായ ദൈവശാസ്ത്രനിയമം
  rationale: ഹീബ്രു വാക്യം വ്യക്തമായി പറയുന്ന നിറവേറലിന്റെയും അനധികൃത സംസാരത്തിന്റെയും പരിശോധനയിൽ മാത്രം വിവർത്തനം നിൽക്കുന്നു; അതിനപ്പുറമുള്ള സഭാപാരമ്പര്യ വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. നിയമപരമായ സോപാധിക ഘടനയും മൂലത്തിലെ പദാവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന വാക്യക്രമം സ്വീകരിച്ചു.
