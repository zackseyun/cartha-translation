source:
  edition: WLC
  text: נָבִ֨יא אָקִ֥ים לָ/הֶ֛ם מִ/קֶּ֥רֶב אֲחֵי/הֶ֖ם כָּמ֑וֹ/ךָ וְ/נָתַתִּ֤י דְבָרַ/י֙ בְּ/פִ֔י/ו וְ/דִבֶּ֣ר אֲלֵי/הֶ֔ם אֵ֖ת כָּל אֲשֶׁ֥ר אֲצַוֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: ml
  text: നിനക്കു തുല്യനായ ഒരു പ്രവാചകനെ അവരുടെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന്[a] ഞാൻ അവർക്കായി എഴുന്നേൽപ്പിക്കും. ഞാൻ എന്റെ വചനങ്ങൾ അവന്റെ വായിൽ വെക്കും; ഞാൻ അവനോടു കല്പിക്കുന്നതെല്ലാം അവൻ അവരോടു സംസാരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവരുടെ ബന്ധുജനങ്ങളുടെ ഇടയിൽനിന്ന്’ അല്ലെങ്കിൽ ‘അവരുടെ സഹഇസ്രായേല്യരുടെ ഇടയിൽനിന്ന്’; എബ്രായയിൽ അക്ഷരാർഥം ‘അവരുടെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: ഒരു പ്രവാചകനെ
  rationale: ദൈവത്തിനുവേണ്ടി സംസാരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പദം. പ്രവചനാത്മകമായ ഈ സന്ദർഭത്തിൽ അനിശ്ചിതത്വം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אָקִים
  choice: ഞാൻ എഴുന്നേൽപ്പിക്കും
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ദൈവം ഒരു പ്രവാചകനെ ഉയർത്തി നിയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ രൂപകവും ദൈവിക പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: לָהֶם
  choice: അവർക്കായി
  rationale: ജനത്തിനുവേണ്ടിയുള്ള ദൈവിക കരുതലിന്റെയും നൽകലിന്റെയും അർഥത്തിൽ ל എന്ന ഉപസർഗം ഇവിടെ ‘അവർക്കായി’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: അവരുടെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന്
  rationale: מִקֶּרֶב എന്നത് ‘ഇടയിൽനിന്ന്’ എന്നും אֲחֵיהֶם അക്ഷരാർഥത്തിൽ ‘അവരുടെ സഹോദരന്മാർ’ എന്നും വരുന്നു. മൂലത്തിലെ പുരുഷലിംഗ ബന്ധപദം നിലനിർത്തി, അതിന്റെ ജനസമൂഹപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּמוֹךָ
  choice: നിനക്കു തുല്യനായ
  rationale: മോശെയോടുള്ള നേരിട്ടുള്ള താരതമ്യം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: ഞാൻ എന്റെ വചനങ്ങൾ അവന്റെ വായിൽ വെക്കും
  rationale: ദൈവം പ്രവാചകനു പറയാനുള്ളത് നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന സജീവമായ നിയോഗരൂപകം മാറ്റമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: അവൻ അവരോടു സംസാരിക്കും
  rationale: אֶל എന്നതിന്റെ ദിശാസൂചനയും ഭാവികാല വാഗ്ദാനക്രമവും ലളിതമായി സംരക്ഷിക്കുന്നു.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: ഞാൻ അവനോടു കല്പിക്കുന്നതെല്ലാം
  rationale: כָּל אֲשֶׁר എന്നതിന്റെ സമഗ്രതയും കല്പനയുടെ ദൈവിക ഉറവിടവും നിലനിർത്തുന്നു; ഭാവികാല പശ്ചാത്തലത്തിനുള്ളിലെ എബ്രായ അപൂർണക്രിയയെ മലയാള വർത്തമാനബന്ധരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: വാഗ്ദത്ത പ്രവാചകന്റെ മിശിഹാസംബന്ധമായ പ്രത്യേക തിരിച്ചറിയൽ
  choice: മോശെയെപ്പോലെയുള്ള ‘ഒരു പ്രവാചകൻ’ എന്ന എബ്രായ വാചകം മാത്രം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
  alternative: പ്രവാചകനിരയെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന വായന; മിശിഹായിൽ നിവൃത്തിയാകുന്ന ഏക അന്ത്യകാല പ്രവാചകനെ സൂചിപ്പിക്കുന്ന വായന.
  rationale: ഈ വാക്യം ആ വ്യക്തിയെ കൂടുതൽ വ്യക്തമായി തിരിച്ചറിയുന്നില്ല. അതിനാൽ കൂട്ടായതും മിശിഹാസംബന്ധമായതുമായ വായനകൾക്കിടയിലെ യഥാർഥ വ്യാഖ്യാനാത്മക പിരിമുറുക്കം പരിഭാഷ സ്വയം തീർപ്പാക്കുന്നില്ല.
- issue: אֲחֵיהֶם എന്ന ബന്ധപദത്തിന്റെ പരിഭാഷ
  choice: അവരുടെ സഹോദരന്മാർ
  alternative: അവരുടെ ബന്ധുജനങ്ങൾ; അവരുടെ സഹഇസ്രായേല്യർ.
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചന ബന്ധപദം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു. ഇവിടെ അത് സഹോദരന്മാരെ മാത്രം സങ്കുചിതമായി സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ജനതാപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എഴുന്നേൽപ്പിക്കും’, ‘വായിൽ വെക്കും’ എന്നീ മൂലരൂപകങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
