revisions:
- from: എന്നാൽ, ഞാൻ സംസാരിക്കാൻ കല്പിച്ചിട്ടില്ലാത്ത ഒരു വചനം എന്റെ നാമത്തിൽ ധാർഷ്ട്യത്തോടെ[a] സംസാരിക്കുകയോ അന്യദേവന്മാരുടെ നാമത്തിൽ സംസാരിക്കുകയോ ചെയ്യുന്ന പ്രവാചകൻ—ആ പ്രവാചകൻ മരിക്കണം[b].
  to: എന്നാൽ, അവൻ സംസാരിക്കാൻ ഞാൻ കൽപിച്ചിട്ടില്ലാത്ത ഒരു വചനം എന്റെ നാമത്തിൽ ധാർഷ്ട്യത്തോടെ[a] പറയുകയോ, അന്യദേവന്മാരുടെ നാമത്തിൽ സംസാരിക്കുകയോ ചെയ്യുന്ന പ്രവാചകൻ—ആ പ്രവാചകൻ മരിക്കണം[b].
  rationale: മൂലത്തിലെ ‘ഞാൻ അവനോടു സംസാരിക്കാൻ കൽപിച്ചിട്ടില്ലാത്ത’ എന്ന ബന്ധം വ്യക്തമായി നിലനിർത്താൻ ‘അവൻ സംസാരിക്കാൻ’ ചേർത്തു. മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിനായി ആദ്യത്തെ കുറ്റത്തിൽ ‘വചനം പറയുക’ ഉപയോഗിച്ചു. രണ്ടാമത്തെ കുറ്റത്തിന്റെ വിഭാജകസ്വഭാവവും (‘-യോ ... -യോ’), ഒന്നാംപുരുഷ ദൈവവചനവും, മറ്റ് ദേവന്മാരുടെ നാമം അവകാശപ്പെടുന്നതും, സംക്ഷിപ്തമായ മരണവിധിയും മാറ്റമില്ലാതെ സംരക്ഷിച്ചിരിക്കുന്നു.
