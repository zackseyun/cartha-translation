source:
  edition: WLC
  text: אַ֣ךְ הַ/נָּבִ֡יא אֲשֶׁ֣ר יָזִיד֩ לְ/דַבֵּ֨ר דָּבָ֜ר בִּ/שְׁמִ֗/י אֵ֣ת אֲשֶׁ֤ר לֹֽא צִוִּיתִי/ו֙ לְ/דַבֵּ֔ר וַ/אֲשֶׁ֣ר יְדַבֵּ֔ר בְּ/שֵׁ֖ם אֱלֹהִ֣ים אֲחֵרִ֑ים וּ/מֵ֖ת הַ/נָּבִ֥יא הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: ml
  text: എന്നാൽ, അവൻ സംസാരിക്കാൻ ഞാൻ കൽപിച്ചിട്ടില്ലാത്ത ഒരു വചനം എന്റെ നാമത്തിൽ ധാർഷ്ട്യത്തോടെ[a] പറയുകയോ, അന്യദേവന്മാരുടെ നാമത്തിൽ സംസാരിക്കുകയോ ചെയ്യുന്ന പ്രവാചകൻ—ആ പ്രവാചകൻ മരിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അഹങ്കാരത്തോടെ’ / ‘അധികാരപരിധി ലംഘിക്കാൻ തുനിഞ്ഞ്.’ എബ്രായക്രിയ ബോധപൂർവമായ ധാർഷ്ട്യത്തെയും അതിക്രമത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മരിക്കേണ്ടതാണ്’ / ‘മരണശിക്ഷയ്ക്ക് വിധേയനാകണം.’ എബ്രായത്തിൽ നിയമപരമായ മരണവിധി വളരെ സംക്ഷിപ്തമായി പ്രസ്താവിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ യഥാർഥ പ്രവാചകനോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַנָּבִיא
  choice: പ്രവാചകൻ
  rationale: נָבִיא എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാള പരിഭാഷ.
- source_word: יָזִיד
  choice: ധാർഷ്ട്യത്തോടെ
  rationale: זיד എന്ന ക്രിയാരൂപം സൂചിപ്പിക്കുന്ന ബോധപൂർവമായ അതിക്രമവും അധികാരപരിധി കടക്കാനുള്ള അഹങ്കാരപരമായ തുനിവും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְדַבֵּר דָּבָר
  choice: ഒരു വചനം ... സംസാരിക്കുക
  rationale: എബ്രായത്തിലെ ക്രിയ-നാമ ഘടന പരമാവധി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വായനാസൗകര്യം നൽകുന്നു.
- source_word: בִּשְׁמִי
  choice: എന്റെ നാമത്തിൽ
  rationale: ദൈവിക അധികാരം അവകാശപ്പെട്ട് സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: ഞാൻ സംസാരിക്കാൻ കല്പിച്ചിട്ടില്ലാത്ത
  rationale: ദൈവത്തിന്റെ കല്പനയും പ്രവാചകന്റെ സംസാരവും തമ്മിലുള്ള ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: സംസാരിക്കുകയോ
  rationale: രണ്ട് വ്യത്യസ്ത കുറ്റങ്ങളിൽ ഏതെങ്കിലും ഒന്നിനെ സൂചിപ്പിക്കുന്ന വിഭാജകബന്ധം മലയാളത്തിലെ ‘-യോ ... -യോ’ ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരുടെ നാമത്തിൽ
  rationale: മറ്റു ദേവന്മാരുടെ അധികാരം അവകാശപ്പെട്ടുള്ള സംസാരത്തെ മൂലപാഠത്തോട് ചേർന്ന് അവതരിപ്പിക്കുന്നു.
- source_word: וּמֵת
  choice: മരിക്കണം
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ നിയമവിധി നിലനിർത്തുന്നു; വധത്തിന്റെ കർത്താവിനെയോ നടപ്പാക്കുന്ന രീതിയെയോ പാഠത്തിൽ ഇല്ലാത്തവിധം വ്യക്തമാക്കുന്നില്ല.
- source_word: הַנָּבִיא הַהוּא
  choice: ആ പ്രവാചകൻ
  rationale: നാമവും സൂചകസർവനാമവും ചേർന്നുള്ള ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തെക്കുറിച്ചുള്ള ഒന്നാംപുരുഷ പരാമർശം
  choice: ‘എന്റെ നാമത്തിൽ’ എന്ന ഒന്നാംപുരുഷ ദൈവവചനം നിലനിർത്തി.
  alternative: ‘യഹോവയുടെ നാമത്തിൽ’ എന്ന് വികസിപ്പിക്കുക.
  rationale: മൂലപാഠം നേരിട്ടുള്ള ദൈവവചനമായതിനാൽ ഒന്നാംപുരുഷ രൂപം നിലനിർത്തുന്നത് പാഠസാക്ഷ്യത്തോട് കൂടുതൽ വിശ്വസ്തമാണ്.
- issue: മരണവിധിയുടെ സ്വഭാവം
  choice: ‘മരിക്കണം’ എന്ന സംക്ഷിപ്ത നിയമവിധി ഉപയോഗിച്ചു.
  alternative: ‘മരണശിക്ഷയ്ക്ക് വിധേയനാക്കണം’ അല്ലെങ്കിൽ ‘കൊല്ലപ്പെടണം’.
  rationale: וּמֵת നിയമപരമായ മരണവിധി പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ നിർവഹണരീതിയോ വ്യക്തമായ കർത്താവോ ഈ രൂപത്തിൽ പറയുന്നില്ല; അതിനാൽ അവ ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തതയും തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമപ്രഖ്യാപന ശൈലി ഉപയോഗിച്ചു. ‘വചനം,’ ‘നാമത്തിൽ,’ ‘പ്രവാചകൻ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി. രണ്ട് കുറ്റങ്ങൾക്കും ‘-യോ ... -യോ’ ഘടന ഉപയോഗിച്ച് അവ പര്യായ സാധ്യതകളാണെന്ന് വ്യക്തമാക്കി.
