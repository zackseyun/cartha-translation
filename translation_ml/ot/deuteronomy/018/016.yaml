source:
  edition: WLC
  text: כְּ/כֹ֨ל אֲשֶׁר שָׁאַ֜לְתָּ מֵ/עִ֨ם יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/חֹרֵ֔ב בְּ/י֥וֹם הַ/קָּהָ֖ל לֵ/אמֹ֑ר לֹ֣א אֹסֵ֗ף לִ/שְׁמֹ֨עַ֙ אֶת קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י וְ/אֶת הָ/אֵ֨שׁ הַ/גְּדֹלָ֥ה הַ/זֹּ֛את לֹֽא אֶרְאֶ֥ה ע֖וֹד וְ/לֹ֥א אָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: ml
  text: 'നിങ്ങൾ ഹോരേബിൽ ജനസഭയുടെ ദിവസം നിങ്ങളുടെ ദൈവമായ യഹോവയോട് അപേക്ഷിച്ചതുപോലെതന്നെ: ‘എന്റെ ദൈവമായ യഹോവയുടെ ശബ്ദം ഇനി ഞാൻ കേൾക്കരുതേ; ഈ വലിയ തീ ഇനി ഞാൻ കാണരുതേ; അല്ലെങ്കിൽ ഞാൻ മരിച്ചുപോകും.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁאַלְתָּ מֵעִם
  choice: അപേക്ഷിച്ചതുപോലെതന്നെ
  rationale: שאל מן/מעם എന്ന പ്രയോഗം ഇവിടെ ഒരാളോട് എന്തെങ്കിലും അഭ്യർഥിക്കുക എന്ന അർഥത്തിലാണ്; സ്വാഭാവികമായ മലയാളത്തിൽ ‘യോട് അപേക്ഷിച്ചു’ എന്നു നൽകി, כְּכֹל എന്ന ഊന്നൽ ‘പോലെതന്നെ’ കൊണ്ട് നിലനിർത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ പൊതുപ്രചാരമുള്ള മലയാള ലിപ്യന്തരണത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു; പൊതുനാമമായ ‘കർത്താവ്’ എന്നു മാറ്റുന്നില്ല.
- source_word: בְּיוֹם הַקָּהָל
  choice: സഭ കൂടിയ ദിവസം
  rationale: הַקָּהָל എന്നത് ജനസമൂഹം ഔപചാരികമായി ഒന്നിച്ചുകൂടിയ സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘സഭ കൂടിയ ദിവസം’ ആ സംഭവാത്മക അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: ഇനിയും ഞാൻ കേൾക്കാതിരിക്കട്ടെ
  rationale: יסף + infinitive എന്നത് പ്രവൃത്തി തുടരുകയോ വീണ്ടും ചെയ്യുകയോ ചെയ്യാതിരിക്കുക എന്ന ആശയം നൽകുന്നു; അഭ്യർഥനയുടെ ഭാവം മലയാളത്തിലെ ‘-ാതിരിക്കട്ടെ’ കൊണ്ട് പ്രകടമാക്കി.
- source_word: וְלֹא אָמוּת
  choice: അല്ലെങ്കിൽ ഞാൻ മരിച്ചുപോകും
  rationale: സന്ദർഭത്തിൽ ഇത് മുൻ അഭ്യർഥനയുടെ കാരണം/ഭയപ്പെട്ട ഫലം സൂചിപ്പിക്കുന്നു. ഏകോപകമായ וְ ഇവിടെ ഫലസൂചനയായി സ്വാഭാവിക മലയാളത്തിൽ ‘അല്ലെങ്കിൽ’ എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക നാമമായ יהוה-യെ പൊതുപദവിയാക്കി ലയിപ്പിക്കാതെ നിലനിർത്തുന്നത് പാഠപരമായി സുതാര്യമാണ്.
- issue: വാക്യാവസാനത്തിലെ മരണസൂചനയുടെ ബന്ധം
  choice: ‘അല്ലെങ്കിൽ ഞാൻ മരിച്ചുപോകും’ എന്ന ഭയപ്പെട്ട ഫലമായി അവതരിപ്പിച്ചു
  alternative: ‘ഞാൻ മരിക്കാതിരിക്കേണ്ടതിന്’
  rationale: וְלֹא אָמוּת എന്നതിന്റെ രൂപം അക്ഷരാർഥത്തിൽ ‘ഞാൻ മരിക്കുകയുമില്ല’ എന്നാണെങ്കിലും, ആവർത്തിച്ചുള്ള കേൾവിയും ദർശനവും മരണത്തിലേക്കു നയിക്കുമെന്ന ആശങ്കയാണ് സന്ദർഭം. ലക്ഷ്യവാക്യമായി അതിരുകടന്ന് നിർവചിക്കാതെ ഫലബന്ധം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. വാക്യം 15-ാം വാക്യത്തിൽ നിന്നു തുടരുന്നതിനാൽ മൂലത്തിലെ ആശ്രിതഘടന നിലനിർത്തുന്നു. ഉദ്ധരണിയിൽ ഔപചാരിക അഭ്യർഥനാഭാവം ഉപയോഗിച്ചു.
