revisions:
- from: ലേവ്യരായ പുരോഹിതന്മാർക്ക്—ലേവിഗോത്രം മുഴുവനും—ഇസ്രായേലിനോടൊപ്പം ഓഹരിയോ അവകാശമോ ഉണ്ടായിരിക്കരുത്. യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണങ്ങളും[a] അവന്റെ അവകാശവും[b] അവർ ഭക്ഷിക്കണം.
