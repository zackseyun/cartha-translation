id: DEU.18.1
reference: Deuteronomy 18:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: ml
  text: ലേവ്യരായ പുരോഹിതന്മാർക്കും—ലേവിഗോത്രം മുഴുവനും—ഇസ്രായേലിൽ ഓഹരിയോ അവകാശമോ ഉണ്ടായിരിക്കരുത്. യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണങ്ങളും[a] അവന്റെ അവകാശവും[b] അവർ ഭക്ഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അഗ്നിയർപ്പണങ്ങൾ” എന്നതിന് “യഹോവയ്ക്കുള്ള ഭോജനയാഗങ്ങൾ” എന്നും വിവർത്തനം ചെയ്യാം. ഈ പദം അഗ്നിയിൽ അർപ്പിച്ച യാഗങ്ങളിൽ പുരോഹിതർക്കു ഭക്ഷിക്കാവുന്ന പങ്കും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അവന്റെ” എന്നത് സമഷ്ടിയായി കാണുന്ന ലേവിയെയോ ലേവിഗോത്രത്തെയോ സൂചിപ്പിക്കാം. 18:2-ൽ യഹോവ തന്നെയാണ് അവരുടെ അവകാശം എന്നു പറയുന്നു; അതിനാൽ ഇവിടെ യഹോവയെ സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: ambiguity_and_cross_reference
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: ലേവ്യരായ പുരോഹിതന്മാർക്ക്
  rationale: പുരോഹിതന്മാരെ ലേവ്യർ എന്നു തിരിച്ചറിയുന്ന എബ്രായ സമസ്ഥാനപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വേറിട്ട രണ്ടു വിഭാഗങ്ങളാണെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: ലേവിഗോത്രം മുഴുവനും
  rationale: כָּל നൽകുന്ന സമഗ്രതയും മുൻപുള്ള പ്രയോഗത്തോടുള്ള സമസ്ഥാനബന്ധവും നിലനിർത്തുന്നു.
- source_word: חֵלֶק וְנַחֲלָה
  choice: ഓഹരിയോ അവകാശമോ
  rationale: ഭൂവിഭാഗത്തിലും പാരമ്പര്യസ്വത്തിലും ലഭിക്കുന്ന പങ്കിനെ സൂചിപ്പിക്കുന്ന സമീപാർഥ നിയമപദജോടിയെ വ്യക്തമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: עִם יִשְׂרָאֵל
  choice: ഇസ്രായേലിനോടൊപ്പം
  rationale: മറ്റു ഇസ്രായേൽഗോത്രങ്ങളോടൊപ്പം പങ്കുവെക്കുന്ന അവകാശമാണ് നിഷേധിക്കപ്പെടുന്നതെന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אִשֵּׁי יְהוָה
  choice: യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണങ്ങൾ
  rationale: אִשֶּׁה എന്ന യാഗസാങ്കേതികപദത്തിന്റെ അഗ്നിയുമായി ബന്ധപ്പെട്ട രൂപം നിലനിർത്തുന്നു; പുരോഹിതർ ഭക്ഷിക്കുന്നതിനാൽ മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗങ്ങൾ എന്ന തെറ്റായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: וְנַחֲלָתוֹ
  choice: അവന്റെ അവകാശവും
  rationale: മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം അതേപടി നിലനിർത്തി, അത് യഹോവയെയോ സമഷ്ടിയായി കാണുന്ന ലേവിയെയോ സൂചിപ്പിക്കാമെന്ന യഥാർഥ വ്യാകരണ-സന്ദർഭ അനിശ്ചിതത്വം പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: יֹאכֵלוּן
  choice: അവർ ഭക്ഷിക്കണം
  rationale: നിയമനിർദേശപരമായ അപൂർണക്രിയയുടെ ഭാവം മലയാളത്തിലെ നിർദേശരൂപത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: וְנַחֲלָתוֹ എന്നതിലെ ഏകവചന പ്രത്യയത്തിന്റെ സൂചകം
  choice: അവന്റെ അവകാശം എന്ന രൂപം നിലനിർത്തി സൂചകം നിർണ്ണയിക്കാതിരിക്കുന്നു
  alternative: യഹോവ തന്നെയാണ് അവരുടെ അവകാശം എന്നു വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ഇത് ലേവിയുടെ അവകാശമാണെന്ന് വ്യക്തമാക്കുക
  rationale: എബ്രായ പ്രത്യയം ഏകവചനമാണ്; സമീപപദമായ യഹോവയിലേക്കും സമഷ്ടി ഏകവചനമായി ഗ്രഹിക്കുന്ന ലേവിയിലേക്കും ബന്ധിപ്പിക്കാവുന്നതാണ്. 18:2 താരതമ്യത്തിന് സഹായിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ രൂപത്തെ ഏകാർഥമാക്കാൻ മതിയായ കാരണം നൽകുന്നില്ല.
- issue: אִשֵּׁי יְהוָהയും וְנַחֲלָתוֹയും തമ്മിലുള്ള ബന്ധം
  choice: ‘അഗ്നിയർപ്പണങ്ങളും അവന്റെ അവകാശവും’ എന്ന സംയോജകബന്ധം നിലനിർത്തുന്നു
  alternative: ‘അഗ്നിയർപ്പണങ്ങൾ, അതായത് അവന്റെ അവകാശം’ എന്ന് സമസ്ഥാനവ്യാഖ്യാനമായി നൽകുക
  rationale: വാചകത്തിൽ וְ എന്ന സംയോജകം ഉള്ളതിനാൽ സമസ്ഥാനബന്ധം സാധ്യമെങ്കിലും നിർബന്ധിതമല്ല. ‘അതായത്’ ചേർക്കുന്നത് ഉറവിടത്തിലെ തുറന്ന ബന്ധത്തെ അനാവശ്യമായി നിർണ്ണയിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമനിർദേശശൈലി. ദീർഘവാക്യത്തിന്റെ ഘടന വ്യക്തമാക്കാൻ ഇടവരകൾ ഉപയോഗിച്ചു. ‘അഗ്നിയർപ്പണം’ യാഗസാങ്കേതികത സംരക്ഷിക്കുമ്പോഴും ‘ദഹനയാഗം’ ഉണ്ടാക്കാവുന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
