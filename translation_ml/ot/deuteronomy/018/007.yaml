source:
  edition: WLC
  text: וְ/שֵׁרֵ֕ת בְּ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑י/ו כְּ/כָל אֶחָי/ו֙ הַ/לְוִיִּ֔ם הָ/עֹמְדִ֥ים שָׁ֖ם לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: ml
  text: അപ്പോൾ അവൻ തന്റെ ദൈവമായ യഹ്‌വേയുടെ നാമത്തിൽ ശുശ്രൂഷിക്കാം[a], അവിടെ യഹ്‌വേയുടെ സന്നിധിയിൽ നിൽക്കുന്ന തന്റെ എല്ലാ സഹോദരന്മാരായ ലേവ്യരെപ്പോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുശ്രൂഷിക്കും.” നിയമസന്ദർഭത്തിൽ ഹീബ്രു അപൂർണ്ണക്രിയ അനുമതിയെയോ കൂടുതൽ നേരിട്ടുള്ള ഭാവികാലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: അപ്പോൾ അവൻ ... ശുശ്രൂഷിക്കാം
  rationale: שׁרת എന്ന പീയേൽ ക്രിയ ഇവിടെ വിശുദ്ധമന്ദിരവുമായി ബന്ധപ്പെട്ട ലേവ്യശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ നിയമവ്യവസ്ഥയുടെ ഫലമായി ലഭിക്കുന്ന അനുമതി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അപ്പോൾ’ എന്നും ‘ശുശ്രൂഷിക്കാം’ എന്നും നൽകി.
- source_word: בְּשֵׁם
  choice: നാമത്തിൽ
  rationale: ഒരു വ്യക്തിയുടെ അധികാരത്തിൻകീഴിലോ നാമം വിളിച്ചപേക്ഷിച്ചോ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവ് ഹീബ്രു പ്രയോഗമാണിത്; ‘നാമത്തിൽ’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהָיו
  choice: തന്റെ ദൈവമായ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം നിലനിർത്തുന്നു; മലയാളത്തിലെ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: כְּכָל אֶחָיו הַלְוִיִּם
  choice: തന്റെ സഹോദരന്മാരായ മറ്റെല്ലാ ലേവ്യരെയുംപോലെ
  rationale: ‘സഹോദരന്മാർ’ എന്ന പുരുഷലിംഗ ബന്ധുപദവും അതിനെ വിശദീകരിക്കുന്ന ‘ലേവ്യർ’ എന്ന പദവും നിലനിർത്തി. താരതമ്യം ലക്ഷ്യവ്യക്തിയെ ഒഴികെയുള്ള സഹലേവ്യരോടായതിനാൽ മലയാളത്തിൽ ‘മറ്റെല്ലാ’ എന്ന് വ്യക്തമാക്കി.
- source_word: הָעֹמְדִים שָׁם
  choice: അവിടെ ... നിൽക്കുന്ന
  rationale: עמד എന്ന ക്രിയയുടെ ‘നിൽക്കുക’ എന്ന അടിസ്ഥാനാർഥവും שׁם എന്ന സ്ഥലസൂചനയും സംരക്ഷിച്ചു; ശുശ്രൂഷിക്കുക എന്ന വ്യാഖ്യാനാർഥം പകരം ചേർത്തില്ല.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിലോ സാന്നിധ്യത്തിലോ നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ ‘സന്നിധിയിൽ’ എന്ന് സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമായ രീതിയിൽ നൽകി.
theological_decisions:
- issue: וְשֵׁרֵת എന്ന അപൂർണ്ണക്രിയയുടെ നിയമസന്ദർഭത്തിലെ ഭാവം
  choice: അനുവാദാത്മകമായി ‘ശുശ്രൂഷിക്കാം’
  alternative: ‘ശുശ്രൂഷിക്കും’ അല്ലെങ്കിൽ ‘ശുശ്രൂഷിക്കട്ടെ’
  rationale: മുൻവാക്യത്തിൽ സ്വമേധയാ വിശുദ്ധസ്ഥാനത്തേക്കു വരുന്ന ലേവ്യന് അവിടെ ശുശ്രൂഷിക്കാൻ അവകാശമുണ്ടെന്ന നിയമപരമായ ആശയമാണ് സന്ദർഭത്തിൽ പ്രധാനമായത്. എങ്കിലും ഹീബ്രു രൂപത്തിന് നേരിട്ടുള്ള ഭാവികാലബലവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: אֶחָיו എന്ന ലിംഗസൂചക ബന്ധുപദം
  choice: തന്റെ സഹോദരന്മാർ
  alternative: തന്റെ സഹലേവ്യർ
  rationale: ഹീബ്രുവിലെ പുരുഷലിംഗ ബഹുവചന ബന്ധുപദം നിലനിർത്തി; പിന്നാലെയുള്ള ‘ലേവ്യർ’ അതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശുശ്രൂഷിക്കുക’, ‘സന്നിധി’ എന്നീ പരിചിതമായ ആരാധനാപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും ഹീബ്രുവിലെ നിയമപരമായ അനുമതിയും ‘നിൽക്കുക’ എന്ന ദൃശ്യഭാഷയും സംരക്ഷിച്ചു.
