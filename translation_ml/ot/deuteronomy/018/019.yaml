  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֗ה הָ/אִישׁ֙ אֲשֶׁ֤ר לֹֽא יִשְׁמַע֙ אֶל דְּבָרַ֔/י אֲשֶׁ֥ר יְדַבֵּ֖ר בִּ/שְׁמִ֑/י אָנֹכִ֖י אֶדְרֹ֥שׁ מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/019.yaml
  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: ml
  text: എന്റെ നാമത്തിൽ അവൻ സംസാരിക്കുന്ന എന്റെ വചനങ്ങൾ ശ്രദ്ധിച്ചു കേൾക്കാത്ത മനുഷ്യനോടു ഞാൻ തന്നെ കണക്കു ചോദിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവനിൽനിന്ന് ഞാൻ അത് ആവശ്യപ്പെടും.” അതായത്, പ്രവാചകൻ മുഖാന്തരം പറഞ്ഞ തന്റെ വചനങ്ങൾ ശ്രദ്ധിച്ചു കേൾക്കാതിരുന്നതിന് ദൈവം അവനെ ഉത്തരവാദിയാക്കും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്യാതെ ഫലവാക്യത്തിന്റെ സ്വാഭാവിക തുടക്കത്തിൽ ഉൾപ്പെടുത്തി
  rationale: മുൻവാക്യത്തിലെ വാഗ്ദാനത്തിന്റെ പരിണതഫലം അവതരിപ്പിക്കുന്ന ഘടനയാണ്. മലയാളത്തിൽ ‘അങ്ങനെ സംഭവിക്കും’ എന്നു ചേർക്കാതെ നേരിട്ട് വാക്യം തുടങ്ങുന്നത് സ്വാഭാവികവും ഭാവിസൂചന ക്രിയയിൽ നിലനിൽക്കുന്നതുമാണ്.
- source_word: הָאִישׁ
  choice: മനുഷ്യൻ
  rationale: എബ്രായയിലെ ഏകവചന പുല്ലിംഗരൂപവും അതിന്റെ പ്രതിനിധാനപരമായ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: לֹא יִשְׁמַע אֶל
  choice: ശ്രദ്ധിച്ചുകേൾക്കാത്ത
  rationale: കേവലം കേൾവി മാത്രമല്ല, ചെവിക്കൊള്ളുകയും അനുസരണപൂർവം ശ്രദ്ധിക്കുകയും ചെയ്യുന്ന സൂചന ഇതിലുണ്ട്; ‘അനുസരിക്കാത്ത’ എന്നു മാത്രം പറഞ്ഞ് അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: דְּבָרַי
  choice: എന്റെ വചനങ്ങൾ
  rationale: ബഹുവചനവും ദൈവത്തിന്റെ നേരിട്ടുള്ള ഉടമസ്ഥസൂചനയും നിലനിർത്തുന്നു; ഗൗരവമുള്ള ബൈബിൾഭാഷയിൽ ‘വചനങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר יְדַבֵּר
  choice: അവൻ സംസാരിക്കുന്ന
  rationale: പ്രവാചകൻ ദൈവത്തിന്റെ നാമത്തിൽ ഉച്ചരിക്കുന്ന വചനങ്ങളെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בִּשְׁמִי
  choice: എന്റെ നാമത്തിൽ
  rationale: ദൈവിക അധികാരത്തിലും പ്രതിനിധിത്വത്തിലും സംസാരിക്കുന്നതെന്ന ആശയം വഹിക്കുന്ന മൂലഭാഷയിലെ പ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമത്തിലുള്ള ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: അവനോടു ഞാൻതന്നെ കണക്കു ചോദിക്കും
  rationale: ഉത്തരവാദിത്വം ചോദിക്കുകയും ദൈവിക ന്യായവിധിക്കു വിധേയനാക്കുകയും ചെയ്യുന്ന ന്യായപരമായ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ശിക്ഷയുടെ കൃത്യരൂപം നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: പ്രവാചകന്റെ വചനങ്ങൾ നിരസിക്കുന്നവനോടുള്ള ദൈവിക പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: അവനോടു ഞാൻതന്നെ കണക്കു ചോദിക്കും
  alternative: അവനിൽനിന്ന് ഞാൻതന്നെ അത് ആവശ്യപ്പെടും
  rationale: മൂലപാഠം ദൈവം ആ വ്യക്തിയെ ഉത്തരവാദിയാക്കുമെന്ന് ഉറപ്പിക്കുന്നു, എന്നാൽ ശിക്ഷയുടെ രീതി വ്യക്തമാക്കുന്നില്ല. ‘കണക്കു ചോദിക്കും’ ഈ ന്യായവിധിസൂചന നിലനിർത്തുകയും അനാവശ്യമായ വിശദീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശ്രദ്ധിച്ചുകേൾക്കുക’ എന്നത് കേൾവിയുടെയും ചെവിക്കൊള്ളലിന്റെയും അർത്ഥവ്യാപ്തി സൂക്ഷിക്കുന്നു; ‘കണക്കു ചോദിക്കും’ ന്യായവിധിയുടെ ഗൗരവം വ്യക്തമാക്കുമ്പോഴും അതിന്റെ കൃത്യരൂപം നിർണ്ണയിക്കുന്നില്ല.
