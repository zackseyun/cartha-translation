  to: 'അപ്പോൾ യഹ്‌വേ എന്നോടു പറഞ്ഞു: “അവർ പറഞ്ഞത് നന്നായിരിക്കുന്നു.”[a]'
  rationale: മുഖ്യവാചകത്തിലെ സ്വാഭാവികമായ അർഥവിവർത്തനം നിലനിർത്തി, ദൈവനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം ‘യഹ്‌വേ’ ആക്കി. അടിക്കുറിപ്പ് ഹീബ്രു പ്രയോഗത്തിന്റെ ‘നന്നായി ചെയ്തു’ എന്ന ഘടന സൂചിപ്പിക്കുമ്പോൾ, അതിന്റെ ഉദ്ദേശ്യം പറഞ്ഞ വാക്കുകളെ പ്രശംസിക്കുന്നതാണെന്നും വ്യക്തമാക്കുന്നു.
