language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י הֵיטִ֖יבוּ אֲשֶׁ֥ר דִּבֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/017.yaml
  text: And Yahweh said to me[a], ‘They have spoken well.’
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ എന്നോടു പറഞ്ഞു: “അവർ പറഞ്ഞത് നന്നായിരിക്കുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അവർ പറഞ്ഞതിൽ അവർ നന്നായി ചെയ്തു”; അതായത്, അവർ നന്നായി സംസാരിച്ചു.'
    reason: הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഔപചാരിക ഘടനയും അതിന്റെ സന്ദർഭോചിതമായ അർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ചയ്ക്കായി ‘അപ്പോൾ ... പറഞ്ഞു’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി യഹ്‌വെ എന്നു ലിപ്യന്തരിച്ചു; പകരം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ചില്ല.
- source_word: אֵלָי
  choice: എന്നോടു
  rationale: אֶל എന്ന ഉപസർഗവും ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും ചേർന്ന് ‘എന്നോട്’ എന്നർഥം നൽകുന്നു.
- source_word: הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ
  choice: അവർ പറഞ്ഞത് നന്നായിരിക്കുന്നു
  rationale: ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവർ പറഞ്ഞ കാര്യം നന്നായി ചെയ്തു’ എന്ന ഘടനയുള്ളതാണ്; പറഞ്ഞതിന്റെ ഉള്ളടക്കത്തെ അനുകൂലമായി വിലയിരുത്തുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ അറിയിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഉദ്ധരണിയുടെ വിലയിരുത്തൽഭാവം നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദ ഘടന മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി; അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
