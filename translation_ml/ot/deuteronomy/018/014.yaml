  source_fidelity: പ്രധാന ആശയം ശരിയാണ്. എന്നാൽ כִּיയുടെ വിശദീകരണ/കാരണബന്ധം മുഖ്യവാക്യത്തിൽ ഒഴിവാക്കപ്പെട്ടിരിക്കുന്നു. കൂടാതെ אֶל ... וְאֶל എന്ന പ്രയോഗം വെറും ‘വാക്കു കേൾക്കുന്നു’ എന്നതിലുപരി ‘അവരെ ആശ്രയിച്ചു/അവരുടെ അടുക്കൽ ചെന്നു കേൾക്കുന്നു’ എന്ന ദിശാസൂചന നൽകുന്നു; ‘അവരുടെ വാക്കു കേൾക്കുന്നു’ എന്നത് സ്വീകാര്യമായിരുന്നാലും ‘ആശ്രയിക്കുന്നു’ കൂടുതൽ സ്വാഭാവികവും സന്ദർഭാനുസൃതവുമാണ്. נָתַן എന്നതിന്റെ ‘നൽകുക’ എന്ന രൂപം ‘അനുവദിക്കുക’ എന്നു മാറ്റുന്നത് വ്യാഖ്യാനപരമായി ശക്തമാണ്; മൂലത്തിലെ സൂചിപ്പിക്കാത്ത കർമം ‘അങ്ങനെ’ എന്നു നിലനിർത്തി ‘നൽകിയിട്ടില്ല’ എന്നു പറയുന്നതാണ് കൂടുതൽ വിശ്വസ്തം.
  naturalness: ‘ദിവ്യജ്ഞാനം പറയുന്നവർ’ എന്ന പ്രയോഗം മലയാളത്തിൽ അല്പം അസ്വാഭാവികവും ദൈവിക വെളിപ്പാടുമായി തെറ്റായി ബന്ധിപ്പിക്കപ്പെടാവുന്നതുമാണ്. ‘ഭവിഷ്യവാദികൾ’ അഥവാ ‘ഭവിഷ്യവചനം പറയുന്നവർ’ കൂടുതൽ സ്വാഭാവികമാണ്. ‘ഈ ജനതകൾ’ എന്നതിനേക്കാൾ ‘ഈ ജനതകൾ’ നിലനിർത്താവുന്നതാണ്; വാക്യത്തിന്റെ ബന്ധം വ്യക്തമാക്കാൻ ആരംഭത്തിൽ ‘കാരണം’ ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
  terminology: מְעֹנְנִים-ന് ‘ശകുനം നോക്കുന്നവർ’ യോജിക്കുന്നു. קֹסְמִים-ന് ‘ഭവിഷ്യവാദികൾ’ യോജിച്ച ആധുനിക പദമാണ്; ഇത് ആദ്യപദത്തിൽനിന്ന് ആവശ്യമായ വ്യത്യാസം നിലനിർത്തുന്നു. യְהוָהയെ ‘യഹ്‌വെ’ എന്നു നൽകിയത് ശരിയാണ്.
  issues:
