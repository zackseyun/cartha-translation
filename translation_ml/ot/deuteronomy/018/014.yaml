    rationale: എബ്രായത്തിൽ കർമം പറയാതെ ‘നിനക്കു അങ്ങനെ നൽകിയിട്ടില്ല’ എന്നാണ്. ‘അനുവദിച്ചിട്ടില്ല’ ഒരു സാധുവായ സന്ദർഭവ്യാഖ്യാനമാണെങ്കിലും, മൂലത്തിലെ സംക്ഷിപ്തതയും അസ്പഷ്ടതയും കുറയ്ക്കുന്നു.
