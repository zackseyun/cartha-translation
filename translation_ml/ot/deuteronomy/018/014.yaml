revisions:
- from: നീ കൈവശമാക്കാൻ പോകുന്ന ഈ ജനതകൾ[a] ശകുനം നോക്കുന്നവരുടെയും ദിവ്യജ്ഞാനം പറയുന്നവരുടെയും വാക്കു കേൾക്കുന്നു; എന്നാൽ നിനക്കാകട്ടെ, അങ്ങനെ ചെയ്യാൻ നിന്റെ ദൈവമായ യഹ്‌വെ അനുവദിച്ചിട്ടില്ല.[b]
  to: കാരണം, നീ കൈവശമാക്കാൻ പോകുന്ന ഈ ജനതകൾ[a] ശകുനം നോക്കുന്നവരെയും ഭവിഷ്യവാദികളെയും ആശ്രയിക്കുന്നു; എന്നാൽ നിനക്കാകട്ടെ, അങ്ങനെ നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകിയിട്ടില്ല.[b]
  rationale: മൂലത്തിലെ വിശദീകരണബന്ധം ‘കാരണം’ എന്നതിലൂടെ പുനഃസ്ഥാപിച്ചു. എബ്രായത്തിലെ എലിപ്റ്റിക്കൽ ‘നൽകിയിട്ടില്ല’ നിലനിർത്തി, ‘അനുവദിച്ചിട്ടില്ല’ എന്ന കൂടുതൽ ശക്തമായ വ്യാഖ്യാനം ഒഴിവാക്കി. കֹסְמִים-ന് സ്വാഭാവികവും മതനിരപേക്ഷവുമായ ‘ഭവിഷ്യവാദികൾ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ אֶל എന്ന ദിശാസൂചനയും സന്ദർഭത്തിലെ ആശ്രയത്വവും ‘ആശ്രയിക്കുന്നു’ വഴി പ്രതിഫലിപ്പിച്ചു.
