  revised_text: കാരണം, നീ കൈവശമാക്കാൻ പോകുന്ന ഈ ജനതകൾ[a] ശകുനം നോക്കുന്നവരെയും ഭവിഷ്യവാദികളെയും ആശ്രയിക്കുന്നു; എന്നാൽ നിനക്കാകട്ടെ, അങ്ങനെ നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകിയിട്ടില്ല.[b]
