id: DEU.18.14
reference: Deuteronomy 18:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: ml
  text: കാരണം, നീ കൈവശമാക്കാൻ പോകുന്ന ഈ ജനതകൾ[a] ശകുനം നോക്കുന്നവരെയും ഭവിഷ്യവാദികളെയും ആശ്രയിക്കുന്നു; എന്നാൽ നിനക്കാകട്ടെ, അങ്ങനെ നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകിയിട്ടില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൈവശമാക്കാൻ പോകുന്ന” എന്നതിനുള്ള എബ്രായക്രിയയ്ക്ക് മുൻനിവാസികളെ നീക്കി അവരുടെ ദേശം കൈവശമാക്കുക എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: “എന്നാൽ നീ—അങ്ങനെയല്ല നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകിയിരിക്കുന്നത്.” കർമം വ്യക്തമാക്കാതെ വിട്ടിരിക്കുന്നു; ഇവിടെ അത് മുൻപറഞ്ഞ ആചാരങ്ങളെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: (പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല)
  rationale: മുൻവാക്യങ്ങളോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യക്രമവും സന്ദർഭവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘കാരണം’ ചേർത്താൽ ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ കൃത്രിമമാകും.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ഈ ജനതകൾ
  rationale: ദേശത്തിലെ ഇസ്രായേലേതര ജനവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ജനതകൾ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אֹתָם
  choice: നീ കൈവശമാക്കാൻ പോകുന്ന
  rationale: ירשׁ എന്ന ക്രിയയുടെ ദേശം കൈവശമാക്കുക എന്ന അർഥം നിലനിർത്തുന്നു; മുൻനിവാസികളെ നീക്കുന്നതെന്ന ഉൾക്കാഴ്ച അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: מְעֹנְנִים
  choice: ശകുനം നോക്കുന്നവർ
  rationale: അടയാളങ്ങളോ ശകുനങ്ങളോ നിരീക്ഷിച്ച് ഫലം പറയുന്നവരെ സൂചിപ്പിക്കുന്ന സാംസ്കാരിക അർഥം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം നൽകുന്നു.
- source_word: קֹסְמִים
  choice: ദിവ്യജ്ഞാനം പറയുന്നവർ
  rationale: קסם എന്ന ദിവ്യജ്ഞാനപ്രയോഗത്തെ ആദ്യ പദത്തിൽനിന്ന് വേർതിരിച്ചും മലയാളത്തിൽ മനസ്സിലാകുന്നവിധവും അവതരിപ്പിക്കുന്നു.
- source_word: יִשְׁמָעוּ
  choice: വാക്കു കേൾക്കുന്നു
  rationale: ശ്രദ്ധിച്ചു അനുസരിക്കുകയോ ആശ്രയിക്കുകയോ ചെയ്യുന്ന സന്ദർഭാർഥം ഉൾക്കൊള്ളുമ്പോഴും ‘കേൾക്കുക’ എന്ന മൂലപദത്തിന്റെ കേന്ദ്രാർഥം സംരക്ഷിക്കുന്നു.
- source_word: וְאַתָּה לֹא כֵן נָתַן לְךָ
  choice: എന്നാൽ നിനക്കാകട്ടെ, അങ്ങനെ ചെയ്യാൻ ... അനുവദിച്ചിട്ടില്ല
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തവും അപൂർണ്ണവുമായ പ്രയോഗം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നവിധം പൂർത്തിയാക്കുന്നു; ‘അങ്ങനെ’ മുൻപറഞ്ഞ ആചാരങ്ങളിലേക്കാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെ
  rationale: ദൈവനാമമായ יהוה ശീർഷകമാക്കി മാറ്റാതെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പേരായിത്തന്നെ സംരക്ഷിക്കുന്നു; ഒരു ശീർഷകമാക്കി മാറ്റുന്നില്ല.
- issue: לֹא כֵן נָתַן לְךָ എന്നതിലെ പരാമർശിക്കാത്ത കർമം
  choice: അങ്ങനെ ചെയ്യാൻ ... അനുവദിച്ചിട്ടില്ല
  alternative: അത് നിനക്കു നൽകിയിട്ടില്ല
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ അർഥം നൽകുന്നു; എങ്കിലും נתן എന്നതിന്റെ അക്ഷരാർഥവും എബ്രായത്തിലെ സംക്ഷിപ്തതയും അടിക്കുറിപ്പിൽ വെളിപ്പെടുത്തി, ദൈവിക മാർഗനിർദേശത്തിന്റെ സ്വഭാവത്തെ അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ശകുനം നോക്കുന്നവർ’, ‘ദിവ്യജ്ഞാനം പറയുന്നവർ’ എന്നീ പദങ്ങൾ സാംസ്കാരികമായി അപരിചിതമായ ആചാരങ്ങളെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു. പ്രധാനവാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അനുബന്ധ അടിക്കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
