id: DEU.18.13
reference: Deuteronomy 18:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: תָּמִ֣ים תִּֽהְיֶ֔ה עִ֖ם יְהוָ֥ה אֱלֹהֶֽי/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/013.yaml
  text: You shall be blameless with Yahweh your God[a].
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവയോടുകൂടെ നീ നിഷ്കളങ്കനായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ദൈവമായ യഹോവയോടുകൂടെ നീ സമഗ്രനായിരിക്കണം” അല്ലെങ്കിൽ “പൂർണനായിരിക്കണം.”
    reason: תָּמִים എന്ന എബ്രായപദത്തിന് നിഷ്കളങ്കതയ്‌ക്കൊപ്പം സമഗ്രത, പൂർണത എന്നീ അർഥസാധ്യതകളുമുണ്ട്.
lexical_decisions:
- source_word: תָּמִים
  choice: നിഷ്കളങ്കനായിരിക്കുക
  rationale: ഈ പദം സമഗ്രത, കുറ്റമില്ലായ്മ, പൂർണമായ അർപ്പണം എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു. ചുറ്റുമുള്ള വാക്യങ്ങളിലെ ജ്യോതിഷം, ശകുനം, മന്ത്രവാദം തുടങ്ങിയ വിലക്കപ്പെട്ട ആചാരങ്ങൾക്ക് വിരുദ്ധമായി ദൈവത്തോടുള്ള ധാർമികവും ഉടമ്പടിപരവുമായ സമഗ്രതയെ ഇവിടെ സൂചിപ്പിക്കുന്നു; പാപരഹിതമായ പരിപൂർണത എന്ന ആശയം നിർബന്ധിക്കുന്നില്ല.
- source_word: תִּהְיֶה
  choice: നീ ... ആയിരിക്കണം
  rationale: ഹയാഹ് എന്ന ക്രിയയുടെ ഖാൽ അപൂർണരൂപം ഇവിടെ ആജ്ഞാപരമായ നിർദേശമായി പ്രവർത്തിക്കുന്നു. ‘ആയിരിക്കണം’ ആ നിർബന്ധസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: עִם
  choice: യോടുകൂടെ
  rationale: അടിസ്ഥാന അർഥമായ ‘കൂടെ’ നിലനിർത്തുകയും യഹോവയുമായുള്ള ബന്ധത്തിന്റെ പശ്ചാത്തലം തുറന്നുവെക്കുകയും ചെയ്യുന്നു; ‘സന്നിധിയിൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം വ്യക്തിപരമായ ഉടമ്പടിബന്ധം വ്യക്തമാക്കുന്നു; യഹോവയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൈവം’ ഏകവചനമാണ്.
theological_decisions:
- issue: ഉടമ്പടി ആഹ്വാനത്തിലെ תָּמִים എന്ന പദത്തിന്റെ അർഥം
  choice: ദൈവത്തോടുള്ള ബന്ധത്തിൽ നിഷ്കളങ്കമായ സമഗ്രത
  alternative: നിന്റെ ദൈവമായ യഹോവയോടുകൂടെ നീ സമഗ്രനായിരിക്കണം / പൂർണനായിരിക്കണം
  rationale: സമീപസന്ദർഭം വിഭജിതമായ വിശ്വസ്തതയ്ക്കും നിരോധിതമായ നിഗൂഢാചാരങ്ങൾക്കും എതിരായി യഹോവയോടുള്ള അവിഭക്ത വിശ്വസ്തത ആവശ്യപ്പെടുന്നു. ‘നിഷ്കളങ്കൻ’ ധാർമിക ഊന്നൽ നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ‘സമഗ്രൻ’, ‘പൂർണൻ’ എന്നീ യഥാർഥ പദസാധ്യതകളും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നീ’ എബ്രായത്തിലെ 2ms രൂപം പ്രതിഫലിപ്പിക്കുന്നു. ‘യോടുകൂടെ’ മൂലത്തിലെ ബന്ധസൂചകമായ עִם എന്ന പദത്തിന്റെ തുറന്ന അർഥപരിധി നിലനിർത്തുന്നു.
