id: DEU.18.21
reference: Deuteronomy 18:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִ֥י תֹאמַ֖ר בִּ/לְבָבֶ֑/ךָ אֵיכָה֙ נֵדַ֣ע אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: ml
  text: നിന്റെ ഹൃദയത്തിൽ[a], ‘യാഹ്‌വേ അരുളിച്ചെയ്യാത്ത വചനം ഏതാണെന്ന് നാം എങ്ങനെ അറിയും?’ എന്നു നീ പറഞ്ഞാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മനസ്സിൽ.’ എബ്രായ പദമായ ലേവാവ് ഹൃദയം, മനസ്സ്, അല്ലെങ്കിൽ ഉള്ളിലെ ചിന്ത എന്നിങ്ങനെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תֹאמַר
  choice: എന്നു നീ ചോദിച്ചേക്കാം
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ചോദ്യം കണക്കിലെടുത്ത്, ‘നീ പറഞ്ഞാൽ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമായ മലയാളത്തിൽ സാധ്യതയുള്ള ചോദ്യം എന്ന ഭാവം പ്രകടിപ്പിക്കുന്നു; വാക്യത്തിന്റെ സോപാധിക സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: בִּלְבָבֶךָ
  choice: നിന്റെ ഹൃദയത്തിൽ
  rationale: ചിന്തയുടെ ആന്തരിക കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം അതേപടി നിലനിർത്തുന്നു; ‘മനസ്സിൽ’ എന്നും അർഥമാക്കാം.
- source_word: אֵיכָה נֵדַע
  choice: നാം എങ്ങനെ അറിയും?
  rationale: അറിയാനുള്ള മാർഗത്തെക്കുറിച്ചുള്ള ആലോചനാപരമായ ചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַדָּבָר
  choice: വചനം
  rationale: പ്രവാചകസന്ദർഭത്തിൽ ദൈവത്തിൽനിന്നുള്ളതായി അവകാശപ്പെടുന്ന അരുളപ്പാടിനെയോ സന്ദേശത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘വചനം’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ
  choice: അരുളിച്ചെയ്യാത്ത
  rationale: യഹോവയാണ് പ്രസ്തുത വചനത്തിന്റെ ഉറവിടമോ എന്നതാണ് പ്രധാനം. ദൈവത്തിന്റെ സംസാരത്തെ മലയാളത്തിൽ ഗൗരവത്തോടെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകമായ രൂപത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വ്യക്തിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ നിലനിർത്തുന്നു; മലയാള വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: הַדָּבָר എന്നതിന്റെ പ്രവാചകസന്ദർഭത്തിലുള്ള അർഥം
  choice: വചനം
  alternative: കാര്യം / സന്ദേശം
  rationale: അടുത്ത വാക്യത്തിൽ പ്രവാചകൻ സംസാരിക്കുന്ന അരുളപ്പാടാണ് പരിശോധിക്കപ്പെടുന്നത്. എന്നിരുന്നാലും എബ്രായപദത്തിന്റെ വിശാലമായ അർഥപരിധി അംഗീകരിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ‘ഹൃദയത്തിൽ’ എന്ന ഉറവിടരൂപകം നിലനിർത്തി; ഉദ്ധരണിക്കു ശേഷമുള്ള ‘എന്നു നീ ചോദിച്ചേക്കാം’ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി ഉപയോഗിച്ചു.
