source:
  edition: WLC
  text: וְ/חֹבֵ֖ר חָ֑בֶר וְ/שֹׁאֵ֥ל אוֹב֙ וְ/יִדְּעֹנִ֔י וְ/דֹרֵ֖שׁ אֶל הַ/מֵּתִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/011.yaml
  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
translation:
  language: ml
  text: അല്ലെങ്കിൽ മന്ത്രം ചൊല്ലുന്നവനോ[a], ആത്മമാധ്യമത്തോടോ[b] ആത്മാക്കളുമായി ബന്ധപ്പെടുന്നവനോടോ[c] ചോദിക്കുന്നവനോ, മരിച്ചവരോട് അന്വേഷിക്കുന്നവനോ ആയിരിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ബന്ധനം ബന്ധിക്കുന്നവൻ’; മാന്ത്രിക മന്ത്രോച്ചാരണം നടത്തുന്നവനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മന്ത്രം കെട്ടുന്നവൻ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ആത്മാവിനോട് ചോദിക്കുന്നവൻ.’ എബ്രായപദം ഒരു ആത്മാവിനെയോ അതുമായി ബന്ധപ്പെട്ട മനുഷ്യ മാധ്യമത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_ambiguity
  - marker: c
    text: അല്ലെങ്കിൽ ‘നിഗൂഢജ്ഞാനി’; പരമ്പരാഗതമായി ‘മാന്ത്രികൻ’ എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: മന്ത്രം ചൊല്ലുന്നവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘ബന്ധനം ബന്ധിക്കുന്നവൻ’ എന്ന എബ്രായ പ്രയോഗം മന്ത്രോച്ചാരണത്തിലൂടെ മായികപ്രഭാവം ചെലുത്തുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘മന്ത്രം ചൊല്ലുന്നവൻ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; അക്ഷരാർഥത്തിന്റെ നിഴൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שֹׁאֵל אוֹב
  choice: വെളിച്ചപ്പാടിനോട് ചോദിക്കുന്നവൻ
  rationale: אוֹב മരിച്ചവന്റെ ആത്മാവിനെയോ അതുമായി ബന്ധപ്പെടുന്ന മാധ്യമത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ שֹׁאֵל എന്ന ക്രിയയോടുകൂടെ നിരോധിക്കപ്പെട്ട ഉപദേശാന്വേഷണമാണ് ഉദ്ദേശ്യം; ‘വെളിച്ചപ്പാട്’ കേരളീയ മലയാളത്തിൽ അത്തരം ആത്മമാധ്യമത്തെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം സൂചിപ്പിക്കുന്നു, എന്നാൽ മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יִדְּעֹנִי
  choice: ആത്മാക്കളുമായി ബന്ധപ്പെടുന്നവൻ
  rationale: മറഞ്ഞ അറിവ് ആത്മബന്ധത്തിലൂടെ അവകാശപ്പെടുന്ന ഒരു നിഗൂഢവിദ്യാപ്രവർത്തകനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘മാന്ത്രികൻ’ പോലുള്ള വിശാലമോ സങ്കൽപ്പകഥാസംബന്ധമോ ആയ പദങ്ങളെക്കാൾ ഈ വിവർത്തനം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: മരിച്ചവരോട് അരുളപ്പാട് ചോദിക്കുന്നവൻ
  rationale: דרש אל എന്നത് ഇവിടെ വിവരമോ മാർഗനിർദേശമോ തേടി സമീപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അരുളപ്പാട് ചോദിക്കുക’ നെക്രോമാന്റിക് അന്വേഷണത്തിന്റെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൂടുതൽ ഔപചാരികമായ ‘മരിച്ചവരോട് അന്വേഷിക്കുന്നവൻ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְ
  choice: അല്ലെങ്കിൽ / -ഓ
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച നിരോധിതരായ ആളുകളുടെ പട്ടിക തുടരുന്നതിനാൽ മലയാളത്തിൽ വികൽപ്പസൂചകമായ ‘അല്ലെങ്കിൽ’ എന്നും ‘-ഓ’ എന്ന ഘടനയും ഉപയോഗിച്ചു.
theological_decisions:
- issue: നിഗൂഢവിദ്യാ പദങ്ങൾ പിൽക്കാല ഐതിഹ്യങ്ങളോ സങ്കൽപ്പകഥാ ധാരണകളോ ചേർക്കാതെ വിവർത്തനം ചെയ്യുക
  choice: 'പ്രവൃത്തിയെ വ്യക്തമാക്കുന്ന ആധുനിക പദപ്രയോഗങ്ങൾ ഉപയോഗിച്ചു: ‘മന്ത്രം ചൊല്ലുന്നവൻ,’ ‘വെളിച്ചപ്പാട്,’ ‘ആത്മാക്കളുമായി ബന്ധപ്പെടുന്നവൻ.’'
  alternative: ‘മന്ത്രവാദി,’ ‘ആഭിചാരകൻ,’ ‘മായാവി’ തുടങ്ങിയ പരമ്പരാഗതവും കൂടുതൽ വിശാലവുമായ പദങ്ങൾ ഉപയോഗിക്കുക.
  rationale: എബ്രായ വാക്യം വ്യത്യസ്തമായ നിരോധിത നിഗൂഢവിദ്യാപ്രവൃത്തികളെ പട്ടികപ്പെടുത്തുന്നു. അവയെ പരസ്പരം ലയിപ്പിക്കാതെയും ആത്മാക്കളുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്തം ചേർക്കാതെയും ഓരോ പ്രവൃത്തിയും തിരിച്ചറിയാവുന്ന വിധം അവതരിപ്പിച്ചു.
- issue: אוֹב എന്ന പദത്തിലെ ആത്മാവ്/മാധ്യമം എന്ന അർഥദ്വയത്വം
  choice: പ്രധാനവാചകത്തിൽ മനുഷ്യ മാധ്യമമായ ‘വെളിച്ചപ്പാട്’ ഉപയോഗിച്ച്, ‘മരിച്ചവന്റെ ആത്മാവിനോട് ചോദിക്കുന്നവൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
  alternative: പ്രധാനവാചകത്തിൽ നേരിട്ട് ‘പ്രേതത്തോട് ചോദിക്കുന്നവൻ’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: പദത്തിന് ആത്മാവിനെയും അതുമായി ബന്ധപ്പെട്ട മാധ്യമത്തെയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ യഥാർഥ ലെക്സിക്കൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു; ഏതെങ്കിലും ആത്മശാസ്ത്രപരമായ നിലപാട് ഉറപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിലെ നിരോധനപ്പട്ടികയുടെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ ‘ആയിരിക്കരുത്’ ചേർത്തു. ‘വെളിച്ചപ്പാട്’ കേരളീയ വായനക്കാർക്ക് പരിചിതമായ പദമാണെങ്കിലും പ്രത്യേകമായ ഒരു പ്രാദേശിക ആചാരത്തിൽ മാത്രം അർഥം ചുരുങ്ങാതിരിക്കാനായി അടിക്കുറിപ്പിൽ എബ്രായത്തിലെ ആത്മാവ്/മാധ്യമം ദ്വയത്വം വ്യക്തമാക്കി.
