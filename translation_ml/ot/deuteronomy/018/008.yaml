  text: חֵ֥לֶק כְּ/חֵ֖לֶק יֹאכֵ֑לוּ לְ/בַ֥ד מִמְכָּרָ֖י/ו עַל הָ/אָבֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/008.yaml
  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
translation:
  language: ml
  text: അവർ തുല്യ വിഹിതങ്ങൾ ഭക്ഷിക്കണം; ഓരോരുത്തരുടെയും പിതൃസ്വത്ത് വിൽക്കുന്നതിൽനിന്ന് ലഭിക്കുന്നതിനു പുറമേ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അവസാനത്തെ എബ്രായ വാക്യഭാഗം ദുഷ്കരമാണ്. ‘കുടുംബസ്വത്തുകൾ വിറ്റ് അവനു ലഭിക്കുന്നതിനു പുറമേ’ എന്നും വിവർത്തനം ചെയ്യാം; കൂടുതൽ പൊതുവായി, അവന്റെ പിതൃഭവനവുമായി ബന്ധപ്പെട്ട വരുമാനത്തെയും ഇത് സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: തുല്യമായ ഓഹരികൾ
  rationale: ‘ഓഹരിപോലെ ഓഹരി’ എന്ന എബ്രായ പ്രയോഗം തുല്യമായ പങ്കുകളെ സൂചിപ്പിക്കുന്നു. ‘തുല്യമായ ഓഹരികൾ’ ആ വിതരണാർത്ഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יֹאכֵלוּ
  choice: ഭക്ഷിക്കണം
  rationale: ക്രിയയുടെ മൂർത്തമായ അർത്ഥം ‘ഭക്ഷിക്കുക’ എന്നാണ്; പുരോഹിതന്മാർക്കു ലഭിക്കുന്ന ഉപജീവനവിഹിതം അനുഭവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗം അമൂർത്തമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: לְבַד
  choice: പുറമേ
  rationale: തുല്യമായ വിഹിതത്തിനു പുറമെ ലഭിക്കുന്ന വേറൊരു വരുമാനത്തെയോ അവകാശത്തെയോ ഈ പദം സൂചിപ്പിക്കുന്നു.
- source_word: מִמְכָּרָיו עַל הָאָבוֹת
  choice: തന്റെ പിതൃസ്വത്ത് വിറ്റുകിട്ടുന്നത്
  rationale: സംക്ഷിപ്തവും ദുഷ്കരവുമായ എബ്രായ വാക്യഭാഗം കുടുംബപരമ്പരയുമായി ബന്ധപ്പെട്ട സ്വത്തോ അവകാശമോ വിറ്റുകിട്ടുന്ന വരുമാനത്തെ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാം. ഉറപ്പില്ലായ്മ അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
theological_decisions:
- issue: מִמְכָּרָיו עַל הָאָבוֹת എന്ന അവസാന വാക്യഭാഗത്തിന്റെ വ്യാഖ്യാനം
  choice: കുടുംബപരമ്പരയിൽ ലഭിച്ച സ്വത്ത് വിറ്റുകിട്ടുന്ന സ്വകാര്യ വരുമാനം തുല്യമായ പുരോഹിതവിഹിതത്തിനു പുറമേയുള്ളതാണെന്ന വായന
  alternative: തന്റെ പിതൃഭവനവുമായി ബന്ധപ്പെട്ട വരുമാനത്തിനു പുറമേ; അല്ലെങ്കിൽ പിതൃഭവനങ്ങൾ പ്രകാരം അവനു ലഭിക്കേണ്ടതിനു പുറമേ
  rationale: എബ്രായ വാക്യഘടന സംക്ഷിപ്തവും പലവിധം വ്യാഖ്യാനിക്കാവുന്നതുമാണ്. മുഖ്യവാചകത്തിൽ സാധ്യതയേറിയ അർത്ഥം നൽകിയെങ്കിലും, അതിന്റെ പരിധിയും അനിശ്ചിതത്വവും അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പുരോഹിതോപജീവനത്തിന്റെ മൂർത്തമായ ഭാഷ നിലനിർത്താൻ ‘ഭക്ഷിക്കണം’ ഉപയോഗിച്ചു; ദുഷ്കരമായ അവസാന വാക്യഭാഗത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
