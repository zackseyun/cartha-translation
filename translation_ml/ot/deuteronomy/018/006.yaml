revisions:
- from: ഇസ്രായേലിലെങ്ങുമുള്ള നിന്റെ പട്ടണങ്ങളിലൊന്നിൽനിന്ന്[a]—താൻ പാർത്തുവരുന്നിടത്തുനിന്ന്—ഒരു ലേവ്യൻ വരികയും, തന്റെ ഉള്ളിലെ മുഴുവൻ ആഗ്രഹത്തോടുംകൂടെ[b] യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തേക്കു വന്നെത്തുകയും ചെയ്താൽ,
  to: ഇസ്രായേലിലെങ്ങുമുള്ള നിന്റെ പട്ടണങ്ങളിലൊന്നിൽ[a] പാർക്കുന്ന ഒരു ലേവ്യൻ, തന്റെ ഉള്ളം മുഴുവൻ ആഗ്രഹിച്ച്[b] യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തേക്കു വന്നാൽ,
