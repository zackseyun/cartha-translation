source:
  edition: WLC
  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: ml
  text: ഇസ്രായേലിലെങ്ങുമുള്ള നിന്റെ പട്ടണങ്ങളിലൊന്നിൽ[a] പാർക്കുന്ന ഒരു ലേവ്യൻ, തന്റെ ഉള്ളം മുഴുവൻ ആഗ്രഹിച്ച്[b] യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തേക്കു വന്നാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിന്റെ കവാടങ്ങളിലൊന്നിൽനിന്ന്.” ഇവിടെ “കവാടങ്ങൾ” എന്നത് പട്ടണങ്ങളെയോ നഗരവാസകേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “തന്റെ പ്രാണന്റെ മുഴുവൻ ആഗ്രഹത്തോടെ”; അല്ലെങ്കിൽ, “തന്റെ ഹൃദയാഭിലാഷം മുഴുവനോടെയും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: വരികയും … വന്നെത്തുകയും ചെയ്താൽ
  rationale: മുൻനിയമവുമായി ബന്ധമുള്ള ഒരു വ്യവസ്ഥാപിത സാഹചര്യം അവതരിപ്പിക്കുന്ന സംയോജനത്തിന്റെയും നിബന്ധനയുടെയും ശക്തി സ്വാഭാവികമായ മലയാള നിയമശൈലിയിൽ പ്രകടമാക്കുന്നു.
- source_word: הַלֵּוִי
  choice: ഒരു ലേവ്യൻ
  rationale: എബ്രായത്തിലെ നിർദിഷ്ടപദം ഒരു പ്രതിനിധിയായ ലേവ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഒരു ലേവ്യൻ’ എന്നത് ഈ നിയമപരമായ പൊതുവൽക്കരണം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מֵאַחַד שְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണങ്ങളിലൊന്നിൽനിന്ന്[a]
  rationale: ‘നിന്റെ കവാടങ്ങളിലൊന്നിൽനിന്ന്’ എന്ന അക്ഷരാർഥത്തിലുള്ള പ്രയോഗത്തിൽ ‘കവാടങ്ങൾ’ പട്ടണങ്ങളെയോ നഗരവാസകേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്ന ലക്ഷണാലങ്കാരമാണ്; മുഖ്യവാചകത്തിൽ ഉദ്ദേശ്യാർഥം നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെങ്ങുമുള്ള
  rationale: ഇസ്രായേൽ പ്രദേശത്തിനുള്ളിലെ ഏതു പട്ടണത്തിൽനിന്നും എന്ന വിതരണാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: താൻ പാർത്തുവരുന്നിടത്തുനിന്ന്
  rationale: גור എന്ന പദത്തിലെ സ്ഥിരസ്വത്തവകാശമില്ലാതെ താമസിക്കുന്നതിന്റെ സൂക്ഷ്മതയെ അമിതമായി വ്യാഖ്യാനിക്കാതെ ‘പാർത്തുവരുന്നു’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וּבָא
  choice: വന്നെത്തുകയും
  rationale: ആദ്യത്തെ יָבֹא-യോടൊപ്പം ഉറവിടത്തിൽ കാണുന്ന ക്രിയാപുനരാവർത്തനം മലയാളത്തിൽ ‘വരികയും … വന്നെത്തുകയും’ എന്നു സംരക്ഷിക്കുന്നു.
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: തന്റെ ഉള്ളിലെ മുഴുവൻ ആഗ്രഹത്തോടുംകൂടെ[b]
  rationale: נפש എന്നത് ഇവിടെ വ്യക്തിയുടെ ആന്തരികമായ മുഴുവൻ ആഗ്രഹത്തെയോ അഭിലാഷത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ഉള്ളിലെ മുഴുവൻ ആഗ്രഹം’ അർഥം സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֶל הַמָּקוֹם
  choice: സ്ഥലത്തേക്കു
  rationale: കേന്ദ്രാരാധനാസ്ഥലമാണ് സന്ദർഭത്തിലെ സൂചനയെങ്കിലും ഉറവിടം ‘സ്ഥലം’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; അതിനാൽ ‘വിശുദ്ധമന്ദിരം’ പോലുള്ള വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന
  rationale: അപൂർണക്രിയയുടെ ഭാവി/സന്ദർഭപരമായ ശക്തി മലയാള വർത്തമാനരൂപത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ദൈവനാമം സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ഹീബ്രു വ്യഞ്ജനരൂപത്തോട് അടുത്തുള്ള പ്രചാരമുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ‘സ്ഥലം’ എന്നതിന്റെ ആരാധനാസംബന്ധമായ സൂചന
  choice: സ്ഥലം
  alternative: ആരാധനാസ്ഥലം; വിശുദ്ധമന്ദിരം
  rationale: സന്ദർഭം കേന്ദ്രാരാധനാസ്ഥലത്തെ സൂചിപ്പിച്ചാലും ഈ വാക്യത്തിലെ הַמָּקוֹם അതിനെ വിശദമായി നാമകരണം ചെയ്യുന്നില്ല; അതിനാൽ മൂലപാഠത്തിന്റെ പരോക്ഷത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമവാക്യശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ‘വരുന്നു … വരുന്നു’ എന്ന ആവർത്തനം കഴിയുന്നത്ര സ്വാഭാവികമായി നിലനിർത്തി. കവാടം/പട്ടണം എന്ന ലക്ഷണാലങ്കാരവും נפש എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി.
