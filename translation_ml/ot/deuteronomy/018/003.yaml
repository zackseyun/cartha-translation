  naturalness: മുഖ്യപരിഭാഷ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും വായനാസൗകര്യമുള്ളതുമാണ്. ‘തോൾഭാഗം,’ ‘രണ്ടു കവിൾഭാഗങ്ങൾ,’ ‘ആമാശയം’ എന്നിവ സന്ദർഭോചിതമാണ്. അടിക്കുറിപ്പ് a-യിലെ പദക്രമം മാത്രം അസ്വാഭാവികവും അർഥം തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമാണ്.
  terminology: ‘പുരോഹിതൻ,’ ‘യാഗം,’ ‘തോൾഭാഗം,’ ‘കവിൾഭാഗങ്ങൾ,’ ‘ആമാശയം’ എന്നിവ സ്വീകരിക്കാവുന്ന പദങ്ങളാണ്. מקורത്തിലെ זבח ധാതുവിന്റെ ആവർത്തനം മുഖ്യവാക്യത്തിൽ നിർബന്ധമായി പുനരാവർത്തിക്കേണ്ടതില്ല; എന്നാൽ അടിക്കുറിപ്പിൽ അത് കൃത്യമായി വിശദീകരിക്കണം.
