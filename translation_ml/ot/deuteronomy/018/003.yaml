source:
  edition: WLC
  text: וְ/זֶ֡ה יִהְיֶה֩ מִשְׁפַּ֨ט הַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת הָ/עָ֗ם מֵ/אֵ֛ת זֹבְחֵ֥י הַ/זֶּ֖בַח אִם שׁ֣וֹר אִם שֶׂ֑ה וְ/נָתַן֙ לַ/כֹּהֵ֔ן הַ/זְּרֹ֥עַ וְ/הַ/לְּחָיַ֖יִם וְ/הַ/קֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: ml
  text: 'ജനത്തിൽനിന്ന്—യാഗം അർപ്പിക്കുന്നവരിൽനിന്ന്[a]—പുരോഹിതന്മാർക്ക് ലഭിക്കേണ്ട അവകാശം ഇതായിരിക്കണം: ഒരാൾ കാളയെയോ ആടിനെയോ യാഗം അർപ്പിക്കുമ്പോൾ, അയാൾ തോൾഭാഗവും[b] രണ്ടു കവിൾഭാഗങ്ങളും[c] ആമാശയവും[d] പുരോഹിതന് കൊടുക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ബലി അർപ്പിക്കുന്നവരിൽനിന്ന്, ബലിയർപ്പണത്തിന്റെ.” എബ്രായത്തിൽ ‘ബലി അർപ്പിക്കുക’ എന്ന അർഥമുള്ള ഒരേ ധാതു ഊന്നലിനായി ആവർത്തിക്കുന്നു. “യാഗം അർപ്പിക്കുന്നവരിൽനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “തോൾഭാഗം” എന്നു പരിഭാഷപ്പെടുത്തിയ പദത്തിന്റെ അക്ഷരാർഥം “ഭുജം” എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് മൃഗത്തിന്റെ മുൻകാലിനെയോ അതിനോടു ചേർന്ന തോൾവിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: “കവിൾഭാഗങ്ങൾ” എന്നോ “താടിയെല്ലുകൾ” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ദ്വിവചനത്തിലാണ്.
    reason: lexical_alternative
  - marker: d
    text: പരമ്പരാഗതമായി, “ഉദരസഞ്ചി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: ലഭിക്കേണ്ട അവകാശം
  rationale: ഈ നിയമപരവും ആരാധനാക്രമസംബന്ധവുമായ സന്ദർഭത്തിൽ പദം ‘ന്യായവിധി’ എന്ന അമൂർത്ത അർഥത്തിലല്ല, പുരോഹിതന്മാർക്ക് ചട്ടപ്രകാരം ലഭിക്കേണ്ട വിഹിതത്തെയോ അവകാശത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർക്ക്
  rationale: ബഹുവചനത്തെ നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ ‘ലഭിക്കേണ്ട അവകാശം’ എന്ന പ്രയോഗത്തോടു സ്വാഭാവികമായി ചേരുന്ന ദാതൃവിഭക്തി ഉപയോഗിച്ചു.
- source_word: מֵאֵת הָעָם
  choice: ജനത്തിൽനിന്ന്
  rationale: മൂലപാഠത്തിലെ പൊതുവായ ‘ജനം’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ‘ഇസ്രായേല്യർ’ എന്നു കൂടുതൽ നിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: യാഗം അർപ്പിക്കുന്നവരിൽനിന്ന്
  rationale: ജനത്തിൽ ഉൾപ്പെടുന്ന യാഗദാതാക്കളെയാണ് ഈ വാക്യം നിർദിഷ്ടമാക്കുന്നത്. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി മൂലത്തിലെ ഒരേ ധാതുവിന്റെ ആവർത്തനം മുഖ്യവാക്യത്തിൽ ആവർത്തിക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: കാളയെയോ ആടിനെയോ
  rationale: ഏകവചനത്തിലുള്ള രണ്ട് ബലിമൃഗവിഭാഗങ്ങളെയും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְנָתַן
  choice: അയാൾ ... കൊടുക്കണം
  rationale: എബ്രായത്തിലെ ഏകവചനം ഓരോ യാഗദാതാവിനും ബാധകമായ വിതരണാർഥത്തിലാണ്. മലയാളത്തിൽ നിയമനിർദേശത്തിന്റെ ബലം ‘കൊടുക്കണം’ എന്നു സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לַכֹּהֵן
  choice: പുരോഹിതന്
  rationale: മൂലത്തിലെ ഏകവചനവും നിർദിഷ്ട പുരോഹിതസ്വീകർത്താവെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: הַזְּרֹעַ
  choice: തോൾഭാഗം
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘ഭുജം/കൈ’ ആണെങ്കിലും മൃഗശരീരത്തിന്റെയും യാഗവിഹിതത്തിന്റെയും സന്ദർഭത്തിൽ മുൻകാലിനോടു ചേർന്ന തോൾഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്. വായനക്കാർക്ക് വ്യക്തമായ ‘തോൾഭാഗം’ തിരഞ്ഞെടുത്തു.
- source_word: הַלְּחָיַיִם
  choice: രണ്ടു കവിൾഭാഗങ്ങൾ
  rationale: എബ്രായത്തിലെ ദ്വിവചനരൂപം ‘രണ്ടു’ എന്നു തുറന്നുപറഞ്ഞ് നിലനിർത്തുന്നു; ‘താടിയെല്ലുകൾ’ എന്ന ശരീരശാസ്ത്രപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הַקֵּבָה
  choice: ആമാശയം
  rationale: പരമ്പരാഗതവും പഴഞ്ചനുമായ പദത്തിന് പകരം, മൃഗത്തിന്റെ stomach എന്ന അവയവത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും നിലവാരമുള്ളതുമായ ആധുനിക മലയാളപദം ഉപയോഗിച്ചു.
