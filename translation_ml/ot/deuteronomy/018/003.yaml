  to: 'ജനത്തിൽനിന്ന്—യാഗം അർപ്പിക്കുന്നവരിൽനിന്ന്[a]—പുരോഹിതന്മാർക്ക് ലഭിക്കേണ്ട അവകാശം ഇതായിരിക്കണം: ഒരാൾ കാളയെയോ ആടിനെയോ യാഗം അർപ്പിക്കുമ്പോൾ, അയാൾ തോൾഭാഗവും[b] രണ്ടു കവിൾഭാഗങ്ങളും[c] ആമാശയവും[d] പുരോഹിതന് കൊടുക്കണം.'
