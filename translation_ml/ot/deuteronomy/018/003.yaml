  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ നിയമനിർദേശ ശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ നീണ്ട ഘടന വ്യക്തമാക്കാൻ വിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു; നിയമപരമായ ‘അവകാശം’ എന്ന ആശയവും ഓരോ യാഗദാതാവിനും ബാധകമായ ഏകവചന നിർദേശവും നിലനിർത്തി.
