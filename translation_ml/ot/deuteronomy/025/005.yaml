source:
  edition: WLC
  text: כִּֽי יֵשְׁב֨וּ אַחִ֜ים יַחְדָּ֗ו וּ/מֵ֨ת אַחַ֤ד מֵ/הֶם֙ וּ/בֵ֣ן אֵֽין ל֔/וֹ לֹֽא תִהְיֶ֧ה אֵֽשֶׁת הַ/מֵּ֛ת הַ/ח֖וּצָ/ה לְ/אִ֣ישׁ זָ֑ר יְבָמָ/הּ֙ יָבֹ֣א עָלֶ֔י/הָ וּ/לְקָחָ֥/הּ ל֛/וֹ לְ/אִשָּׁ֖ה וְ/יִבְּמָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: ml
  text: സഹോദരന്മാർ ഒരുമിച്ചു പാർക്കുമ്പോൾ, അവരിൽ ഒരാൾ മകനില്ലാതെ മരിച്ചാൽ[a], മരിച്ചവന്റെ ഭാര്യ കുടുംബത്തിനു പുറത്തുള്ള അന്യപുരുഷനെ വിവാഹം കഴിക്കരുത്[b]. അവളുടെ ഭർത്താവിന്റെ സഹോദരൻ അവളുടെ അടുക്കൽ ചെന്ന്[c] അവളെ തനിക്കു ഭാര്യയായി സ്വീകരിക്കുകയും അവളോടുള്ള ഭർത്തൃസഹോദരന്റെ കടമ നിറവേറ്റുകയും വേണം[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം പ്രത്യേകമായി ‘മകൻ’ എന്നു പറയുന്നു. നിയമം ‘സന്താനമില്ലാത്ത’ സാഹചര്യത്തെയും ഉൾക്കൊള്ളുമെന്നത് ഒരു വ്യാഖ്യാനമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘പുറത്തുള്ള അന്യപുരുഷന് ആയിരിക്കരുത്’; ഇവിടെ കുടുംബബാധ്യതയ്ക്കു പുറത്തുള്ള പുരുഷനെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘അവളുടെ അടുക്കൽ ചെല്ലുക’ എന്നത് വിവാഹപരമായ ലൈംഗികബന്ധത്തിനുള്ള എബ്രായ സൗമ്യപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: d
    text: ഇത് മരിച്ച ഭർത്താവിന്റെ സഹോദരൻ വിധവയെ വിവാഹം ചെയ്യുന്ന നിയമപരമായ കടമയാണ്; ഇതിനെ സാധാരണയായി ‘ലേവിരേറ്റ് വിവാഹം’ എന്നു വിളിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים יַחְדָּו
  choice: സഹോദരന്മാർ ഒരുമിച്ചു പാർക്കുമ്പോൾ
  rationale: אַחִים എന്നത് പുരുഷബഹുവചനമായ ‘സഹോദരന്മാർ’ എന്നും יַחְדָּו പങ്കിട്ട താമസമോ അടുത്ത ഗൃഹബന്ധമോ സൂചിപ്പിക്കുന്ന ‘ഒരുമിച്ചു’ എന്നും സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: וּבֵן אֵין לוֹ
  choice: മകനില്ലാതെ
  rationale: ബേൻ എന്ന എബ്രായപദം പൊതുവായ ‘സന്താനം’ എന്നതല്ല, പ്രത്യേകമായി ‘മകൻ’ എന്നാണ്; മൂലപാഠത്തിന്റെ നിർദ്ദിഷ്ടത നിലനിർത്തുന്നു.
- source_word: אֵשֶׁת הַמֵּת
  choice: മരിച്ചവന്റെ ഭാര്യ
  rationale: എബ്രായത്തിലെ ‘മരിച്ചവന്റെ ഭാര്യ’ എന്ന ഘടന നേരിട്ട് നിലനിർത്തുന്നു; ‘വിധവ’ അർത്ഥത്തിൽ ശരിയായിരുന്നാലും അതു മൂലത്തിലെ പദരൂപമല്ല.
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: കുടുംബത്തിനു പുറത്തുള്ള അന്യപുരുഷനെ
  rationale: זָר ഇവിടെ വംശീയമായി വിദേശിയെന്നതിലുപരി കുടുംബബാധ്യതയ്ക്കു പുറത്തുള്ള പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കുടുംബത്തിനു പുറത്തുള്ള’ എന്നു ചേർക്കുന്നത് നിയമപരമായ വിരോധം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: יְבָמָהּ
  choice: അവളുടെ ഭർത്താവിന്റെ സഹോദരൻ
  rationale: ഈ സ്ഥാപനത്തിൽ മരിച്ച ഭർത്താവിന്റെ സഹോദരനെയാണ് പദം പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ബന്ധപദസംബന്ധമായ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ബന്ധം പൂർണമായി പറയുന്നു.
- source_word: יָבֹא עָלֶיהָ
  choice: അവളുടെ അടുക്കൽ ചെന്ന്
  rationale: വിവാഹപരമായ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സൗമ്യപ്രയോഗത്തിന്റെ രൂപവും ഗൗരവവും നിലനിർത്തുന്നു; അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: അവളെ തനിക്കു ഭാര്യയായി സ്വീകരിക്കുകയും
  rationale: ‘അവളെ തനിക്കു ഭാര്യയായി എടുക്കുക’ എന്ന മൂലഘടന മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: וְיִבְּמָהּ
  choice: അവളോടുള്ള ഭർത്തൃസഹോദരന്റെ കടമ നിറവേറ്റുകയും
  rationale: പ്രത്യേക നിയമബാധ്യത സൂചിപ്പിക്കുന്ന ക്രിയയെ സാങ്കേതിക പദം ഉപയോഗിക്കാതെ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘മകനില്ല’ എന്ന വ്യവസ്ഥയുടെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘മകനില്ലാതെ’ എന്നു നിലനിർത്തി.
  alternative: ‘സന്താനമില്ലാതെ’ എന്നു പൊതുവാക്കുക.
  rationale: മൂലപാഠം വ്യക്തമായി ‘മകൻ’ എന്നാണ് പറയുന്നത്. നിയമത്തിന്റെ വ്യാപ്തി വ്യാഖ്യാനിച്ച് വിപുലീകരിക്കാതെ മൂലത്തിലെ നിർദ്ദിഷ്ടതയും അതിലുള്ള സാധ്യതയുള്ള വ്യാഖ്യാനചോദ്യവും സംരക്ഷിക്കുന്നു.
- issue: ഭർത്തൃസഹോദരവിവാഹവുമായി ബന്ധപ്പെട്ട സാങ്കേതിക പദാവലി
  choice: ബന്ധവും കടമയും വിവരിക്കുന്ന സാധാരണ മലയാളം പ്രധാനപാഠത്തിൽ ഉപയോഗിച്ചു.
  alternative: ‘ലേവിരേറ്റ് വിവാഹം’ പോലുള്ള സാങ്കേതിക പദം ഉപയോഗിക്കുക.
  rationale: മൂലത്തിലെ നിയമബലം നിലനിർത്തിക്കൊണ്ട് ആധുനിക സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഭാഷ നൽകുന്നു; സാങ്കേതിക നാമം അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിക്കുന്നു.
- issue: יָבֹא עָלֶיהָ എന്ന സൗമ്യപ്രയോഗം
  choice: ‘അവളുടെ അടുക്കൽ ചെന്ന്’ എന്ന രൂപകപ്രയോഗം നിലനിർത്തി.
  alternative: ‘അവളുമായി ലൈംഗികബന്ധത്തിലേർപ്പെട്ടു’ എന്നു തുറന്നുപറയുക.
  rationale: എബ്രായത്തിന്റെ സൗമ്യവും നിയമപരവുമായ പ്രയോഗരീതി സംരക്ഷിക്കുമ്പോൾ അടിക്കുറിപ്പ് അർത്ഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവും നിയമപരമായ ഗൗരവമുള്ളതുമായ ശൈലി. ‘പാർക്കുമ്പോൾ,’ ‘അന്യപുരുഷൻ,’ ‘കടമ നിറവേറ്റുക’ എന്നീ പ്രയോഗങ്ങൾ പൊതുവായ വായനാസൗകര്യവും മൂലപാഠസാമീപ്യവും സമന്വയിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
