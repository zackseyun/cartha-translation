id: DEU.25.15
reference: Deuteronomy 25:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶ֣בֶן שְׁלֵמָ֤ה וָ/צֶ֨דֶק֙ יִֽהְיֶה לָּ֔/ךְ אֵיפָ֧ה שְׁלֵמָ֛ה וָ/צֶ֖דֶק יִֽהְיֶה לָּ֑/ךְ לְמַ֨עַן֙ יַאֲרִ֣יכוּ יָמֶ֔י/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: ml
  text: കുറവില്ലാത്തതും ന്യായവുമായ ഒരു തൂക്കക്കല്ല്[a] നിനക്കുണ്ടായിരിക്കണം; കുറവില്ലാത്തതും ന്യായവുമായ ഒരു ഏഫാ അളവും[b] നിനക്കുണ്ടായിരിക്കണം. നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകുന്ന ദേശത്ത് നിന്റെ നാളുകൾ ദീർഘമായിരിക്കേണ്ടതിന് അങ്ങനെ ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘കല്ല്’; വ്യാപാരത്തിൽ തൂക്കമായി ഉപയോഗിച്ചിരുന്ന കല്ലാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ഏഫാ പുരാതനകാലത്ത് ഉണങ്ങിയ സാധനങ്ങൾ അളക്കുന്നതിനുള്ള ഒരു അളവായിരുന്നു; അതിന്റെ കൃത്യമായ ആധുനിക തുല്യം അനിശ്ചിതമാണ്.
    reason: historical_measure
lexical_decisions:
- source_word: אֶבֶן
  choice: തൂക്കക്കല്ല്
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘കല്ല്’ എന്നാണെങ്കിലും, വ്യാപാരസന്ദർഭത്തിൽ തൂക്കമായി ഉപയോഗിച്ചിരുന്ന കല്ലിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തൂക്കക്കല്ല്’ മൂർത്തമായ ദൃശ്യവും ഉദ്ദേശിച്ച പ്രയോഗവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: שְׁלֵמָה
  choice: കുറവില്ലാത്ത
  rationale: ‘പൂർണമായ/മുഴുവനായ’ എന്ന ആശയം അളവുകളുടെയും തൂക്കങ്ങളുടെയും സന്ദർഭത്തിൽ കുറച്ചിട്ടില്ലാത്ത, പൂർണ അളവുള്ള നിലവാരത്തെ സൂചിപ്പിക്കുന്നു. ‘കുറവില്ലാത്ത’ എന്നത് ആ വ്യാപാരാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וָצֶדֶק
  choice: നീതിയുക്തമായ
  rationale: ഇവിടെ പദം കൃത്യത മാത്രമല്ല, വ്യാപാരത്തിലെ ധാർമിക നീതിയും ന്യായവും സൂചിപ്പിക്കുന്നു. ‘നീതിയുക്തമായ’ ആ ധാർമിക ഭാരം നിലനിർത്തുന്നു.
- source_word: יִהְיֶה לָּךְ
  choice: നിങ്ങൾക്കുണ്ടായിരിക്കണം
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങൾക്കായി/നിങ്ങൾക്ക് ഉണ്ടായിരിക്കും’ എന്നാണെങ്കിലും നിയമപരമായ ഈ സന്ദർഭത്തിൽ നിർബന്ധസ്വഭാവമുണ്ട്. ‘ഉണ്ടായിരിക്കണം’ അത് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֵיפָה
  choice: ഏഫാ അളവ്
  rationale: ഇത് പുരാതനമായ ഒരു നിർദിഷ്ട ഉണങ്ങിയ അളവാണ്. ലിപ്യന്തരണത്തോടൊപ്പം ‘അളവ്’ ചേർക്കുന്നത് വായനക്കാരന് അതിന്റെ പ്രവർത്തനം ഉടൻ വ്യക്തമാക്കുന്നു.
- source_word: לְמַעַן
  choice: അങ്ങനെ
  rationale: അനുസരണവും തുടർന്നുള്ള ഉടമ്പടിയനുഗ്രഹവും തമ്മിലുള്ള ഉദ്ദേശ്യ/ഫലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: יַאֲרִיכוּ יָמֶיךָ
  choice: നിങ്ങളുടെ നാളുകൾ ദീർഘമാകും
  rationale: ‘നാളുകൾ ദീർഘമാകുക’ എന്ന എബ്രായ ദൃശ്യരൂപം സംരക്ഷിക്കുമ്പോഴും ദീർഘായുസ്സ് എന്ന അർഥം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: עַל הָאֲדָמָה
  choice: ദേശത്ത്
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഈ സന്ദർഭത്തിൽ אֲדָמָה ദൈവം നൽകുന്ന ഉടമ്പടിദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നിലത്ത്’ എന്നതിനെക്കാൾ ‘ദേശത്ത്’ പ്രസക്തമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: נֹתֵן לָךְ
  choice: നിങ്ങൾക്കു നൽകുന്ന
  rationale: എബ്രായ കർത്തൃവാചകത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്നതോ സവിശേഷമായതോ ആയ ഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ എന്ന രൂപം Yahweh എന്ന പുനർനിർമിത ഉച്ചാരണത്തെ മലയാളത്തിൽ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു.
- issue: അനുസരണവും ദീർഘായുസ്സും തമ്മിലുള്ള ബന്ധം
  choice: ‘അങ്ങനെ ... നാളുകൾ ദീർഘമാകും’ എന്ന ഉദ്ദേശ്യ/ഫലബന്ധം തുറന്നുവെക്കുന്നു
  alternative: ഇത് ഉറപ്പായ വ്യക്തിഗത പ്രതിഫലമെന്നോ പൊതുവായ സാധ്യതമെന്നോ വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക
  rationale: לְמַעַן കൂടിയ അപൂർണക്രിയ ഉദ്ദേശ്യവും ഫലവും തമ്മിലുള്ള നിഴൽഭേദം അനുവദിക്കുന്നു. പരിഭാഷ ആ ബന്ധം നിലനിർത്തുന്നു; അതിനെ ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ രീതിയിൽ കൂടുതൽ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമപരമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ശൈലി. ‘കുറവില്ലാത്ത’ എന്നത് കബളിപ്പിക്കുന്ന വിധത്തിൽ കുറച്ച തൂക്കത്തിന്റെയും അളവിന്റെയും വിരുദ്ധത വ്യക്തമാക്കുന്നു; ‘നീതിയുക്തമായ’ ധാർമിക അർഥം സംരക്ഷിക്കുന്നു.
