  to: 'അപ്പോൾ അവന്റെ സഹോദരന്റെ വിധവ മൂപ്പന്മാർ കാൺകെ അവന്റെ അടുത്തുചെന്ന്, അവന്റെ കാലിൽനിന്ന് ചെരിപ്പ് ഊരിമാറ്റി, അവന്റെ മുഖത്ത് തുപ്പി[a], ഇങ്ങനെ മറുപടി പറയണം: “അവന്റെ സഹോദരന്റെ ഭവനം പണിതുയർത്താത്ത പുരുഷനോട് ഇപ്രകാരം ചെയ്യപ്പെടും.”[b]'
  rationale: മൂലപാഠത്തിന്റെ അർഥമോ രജിസ്റ്ററോ മാറ്റാതെ, ഉദ്ധരണിയിലെ സഹോദരബന്ധത്തിന്റെ സൂചനാസ്പഷ്ടതയ്ക്കായി ‘തന്റെ’ എന്നത് ‘അവന്റെ’ എന്നാക്കി. മറ്റ് വിവർത്തനവും രണ്ടു അടിക്കുറിപ്പുകളും മൂലപാഠത്തിനും ഇംഗ്ലീഷ് ഓഡിറ്റ് രേഖയ്ക്കും യോജിച്ചതാണ്.
