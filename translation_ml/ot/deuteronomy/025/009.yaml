  source_fidelity: വാചകം എബ്രായ മൂലത്തിന്റെ നിയമപരവും പൊതുസാക്ഷ്യവുമായ ക്രമം, ഏകവചനമായ പാദരക്ഷ, മുഖത്തേക്കുള്ള തുപ്പൽ, ‘ഭവനം പണിതുയർത്തുക’ എന്ന രൂപകം എന്നിവ വിശ്വസ്തമായി കൈമാറുന്നു. എന്നാൽ ഉദ്ധരണിയിലെ ‘തന്റെ സഹോദരന്റെ’ എന്ന പ്രയോഗം, നിയമപരമായി പരാമർശിക്കുന്ന ആ പുരുഷന്റെ സഹോദരനെയാണെന്ന മൂലപാഠത്തിലെ സൂചനയെ അല്പം അവ്യക്തമാക്കാം; ‘അവന്റെ സഹോദരന്റെ’ കൂടുതൽ നേരിട്ടാണ്.
