source:
  edition: WLC
  text: וְ/נִגְּשָׁ֨ה יְבִמְתּ֣/וֹ אֵלָי/ו֮ לְ/עֵינֵ֣י הַ/זְּקֵנִים֒ וְ/חָלְצָ֤ה נַעֲל/וֹ֙ מֵ/עַ֣ל רַגְל֔/וֹ וְ/יָרְקָ֖ה בְּ/פָנָ֑י/ו וְ/עָֽנְתָה֙ וְ/אָ֣מְרָ֔ה כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר לֹא יִבְנֶ֖ה אֶת בֵּ֥ית אָחִֽי/ו־־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ സഹോദരന്റെ വിധവ മൂപ്പന്മാർ കാൺകെ അവന്റെ അടുത്തുചെന്ന്, അവന്റെ കാലിൽനിന്ന് ചെരിപ്പ് ഊരിമാറ്റി, അവന്റെ മുഖത്ത് തുപ്പി[a], ഇങ്ങനെ മറുപടി പറയണം: “അവന്റെ സഹോദരന്റെ ഭവനം പണിതുയർത്താത്ത പുരുഷനോട് ഇപ്രകാരം ചെയ്യപ്പെടും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവന്റെ മുമ്പിൽ തുപ്പി.” എബ്രായപ്രയോഗം ആ പുരുഷന്റെ മുഖത്തു നേരിട്ട് തുപ്പുന്നതായോ അവന്റെ മുമ്പിൽ തുപ്പുന്നതായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരന്റെ ഭവനം പണിതുയർത്തുക” എന്നത്, മരിച്ച സഹോദരന്റെ വിധവയുമായുള്ള വിവാഹത്തിലൂടെ അവന്റെ കുടുംബവംശവും ഗൃഹവും നിലനിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: അവന്റെ സഹോദരന്റെ വിധവ
  rationale: ഇത് ഏതെങ്കിലും സഹോദരഭാര്യയെയല്ല, മരിച്ച സഹോദരന്റെ വിധവയെയാണ് സൂചിപ്പിക്കുന്നത്. നിയമസന്ദർഭത്തിലെ ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: മൂപ്പന്മാർ കാൺകെ
  rationale: അക്ഷരാർഥത്തിലെ ‘മൂപ്പന്മാരുടെ കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന ആശയം സ്വാഭാവികമായി നൽകി, ചടങ്ങിന്റെ പരസ്യവും സാക്ഷ്യസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: അവന്റെ കാലിൽനിന്ന് ചെരിപ്പ് ഊരിമാറ്റി
  rationale: חָלַץ ഇവിടെ പാദരക്ഷ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ഏകവചനം ‘ചെരിപ്പ്’ എന്നതിൽ നിലനിർത്തി.
- source_word: וְיָרְקָה בְּפָנָיו
  choice: അവന്റെ മുഖത്ത് തുപ്പി
  rationale: בְּפָנָיו എന്നതിന്റെ നേരിട്ടുള്ള സാധാരണ അർഥവും അപമാനച്ചടങ്ങിന്റെ ശക്തിയും നിലനിർത്തുന്നു; ‘അവന്റെ മുമ്പിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְעָנְתָה וְאָמְרָה
  choice: ഇങ്ങനെ മറുപടി പറയണം
  rationale: എബ്രായത്തിലെ നിയമപരമായ ഇരട്ടപ്രയോഗത്തിന്റെ പ്രതികരണസ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്ന സ്വാഭാവിക രൂപം ഉപയോഗിച്ചു.
- source_word: כָּכָה יֵעָשֶׂה
  choice: ഇപ്രകാരം ചെയ്യപ്പെടും
  rationale: പ്രഖ്യാപനത്തിന്റെ ഔപചാരികതയും കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: തന്റെ സഹോദരന്റെ ഭവനം പണിതുയർത്താത്ത
  rationale: കുടുംബവംശവും ഗൃഹവും നിലനിർത്തുക എന്ന എബ്രായ രൂപകം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: בְּפָנָיו എന്ന അപമാനസൂത്രം നേരിട്ടോ സ്ഥലസൂചനയായോ മനസ്സിലാക്കേണ്ടത്
  choice: അവന്റെ മുഖത്ത് തുപ്പി
  alternative: അവന്റെ മുമ്പിൽ തുപ്പി
  rationale: എബ്രായത്തിന്റെ നേരിട്ടുള്ള വായന മുഖത്തേക്കുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. എന്നാൽ സ്ഥലസൂചനയായുള്ള പുരാതന/പരമ്പരാഗത വ്യാഖ്യാനം യഥാർഥ ഭാഷാപരമായ സാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: ‘സഹോദരന്റെ ഭവനം പണിതുയർത്തുക’ എന്ന രൂപകം വിശദീകരിക്കണമോ നേരിട്ട് വിവർത്തനം ചെയ്യണമോ
  choice: രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി
  alternative: സഹോദരന്റെ കുടുംബവംശം തുടരുക എന്ന് മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിക്കുക
  rationale: ബൈബിൾഭാഷയിലെ ‘ഭവനം’ എന്ന കുടുംബ-വംശ രൂപകവും അതിലെ നിയമ-ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു; സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമവിവരണ ശൈലി സ്വീകരിച്ചു. ‘മൂപ്പന്മാർ കാൺകെ,’ ‘ഇപ്രകാരം ചെയ്യപ്പെടും’ എന്നീ പ്രയോഗങ്ങൾ ചടങ്ങിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; അപരിചിത സാംസ്കാരിക അർഥം മുഖ്യവാചകം ഭാരപ്പെടുത്താതെ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
