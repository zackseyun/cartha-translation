  terminology: ‘സഹോദരന്റെ വിധവ,’ ‘മൂപ്പന്മാർ,’ ‘ഭവനം പണിതുയർത്തുക’ എന്നിവ യോജിച്ചതാണ്. ‘പുരുഷൻ’ എബ്രായത്തിലെ പുരുഷലിംഗ ഏകവചനത്തെ നിലനിർത്തുന്നു. മുഖ്യവാചകത്തിലെ രൂപകത്തെ അടിക്കുറിപ്പ് ശരിയായി വിശദീകരിക്കുന്നു.
