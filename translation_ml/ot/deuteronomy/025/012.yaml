translation:
  language: ml
  text: അവളുടെ കൈപ്പത്തി[a] വെട്ടിക്കളയണം; നിന്റെ കണ്ണ് കനിവു കാണിക്കരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൈ.’ എബ്രായപദം പ്രത്യേകമായി കൈപ്പത്തിയെയും വിശാലമായി കൈയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ കണ്ണ് കനിവു കാണിക്കരുത്.’ കരുണയോ ദയയോ കാണിക്കരുത് എന്നർഥമുള്ള എബ്രായ നിയമപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: വെട്ടിക്കളയണം
  rationale: קצץ എന്ന ക്രിയയുടെ ‘വെട്ടിമാറ്റുക/ഛേദിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥവും നിയമകല്പനയുടെ കാഠിന്യവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֶת
  choice: '[നേരിട്ടുള്ള കർമസൂചകം; പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന പദത്തിന് മലയാളത്തിൽ തുല്യമായ സ്വതന്ത്രപദം ആവശ്യമില്ല.
- source_word: כַּפָּהּ
  choice: അവളുടെ കൈപ്പത്തി
  rationale: כַּף എന്ന പദത്തിന്റെ കൂടുതൽ നിർദിഷ്ടമായ അർഥം ‘കൈപ്പത്തി’ എന്നാണ്; മലയാളത്തിൽ ഇത് സ്വാഭാവികവും ശരീരഭാഗത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നതുമാണ്. ‘കൈ’ എന്ന വിശാലാർഥവും സാധ്യതയായി അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לֹא
  choice: അരുത്
  rationale: നിഷേധാത്മക കല്പനയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תָחוֹס
  choice: കനിവു കാണിക്കുക
  rationale: חוס എന്ന പദത്തിലെ കരുണ/കനിവ് കാണിക്കുക, ഒഴിവാക്കിവിടുക എന്നീ അർഥങ്ങളിൽ, ‘കണ്ണ്’ എന്ന എബ്രായ പ്രയോഗത്തോടൊപ്പം ‘കനിവു കാണിക്കുക’ അർഥവും ദൃശ്യരൂപവും നിലനിർത്തുന്നു.
- source_word: עֵינֶךָ
  choice: നിന്റെ കണ്ണ്
  rationale: വെറും ‘നീ’ എന്നു ലളിതമാക്കാതെ എബ്രായത്തിലെ സജീവമായ നിയമപ്രയോഗമായ ‘നിന്റെ കണ്ണ്’ അതേപടി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശിക്ഷാവിധിയുടെ മൂർത്തവും കഠിനവുമായ ഭാഷ
  choice: ‘കൈപ്പത്തി വെട്ടിക്കളയണം’ എന്നും ‘നിന്റെ കണ്ണ് കനിവു കാണിക്കരുത്’ എന്നും നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവളോട് യാതൊരു ദയയും കാണിക്കരുത്’ എന്നിങ്ങനെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി മൃദൂകരിക്കുക.
  rationale: ഇത് ഇസ്രായേലിന്റെ നിയമസംഹിതയിലെ നേരിട്ടുള്ള കല്പനയാണ്. മൂലപാഠത്തിന്റെ കാഠിന്യമോ ‘കണ്ണ്’ എന്ന പ്രയോഗമോ മൃദൂകരിക്കാതെ, അവയുടെ അർഥവും രൂപവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമഭാഷ ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ’ നിലനിർത്തി; മൂലപാഠത്തിലെ ‘കണ്ണ്’ എന്ന ശരീരാവയവപ്രയോഗം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കിയില്ല.
