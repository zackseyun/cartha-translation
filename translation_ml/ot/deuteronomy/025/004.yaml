  text: You shall not muzzle an ox while it is threshing[a].
translation:
  language: ml
  text: കാള മെതിക്കുമ്പോൾ അതിന്റെ വായ് കെട്ടരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ധാന്യം ചവിട്ടിമെതിക്കുമ്പോൾ.’ എബ്രായപ്രയോഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം ‘അതിന്റെ മെതിക്കലിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַחְסֹם
  choice: വായ് കെട്ടരുത്
  rationale: നിഷേധത്തോടുകൂടിയ חסם എന്ന ക്രിയ ഇവിടെ ഒരു മൃഗത്തിന് തീറ്റ തിന്നാനാകാത്തവിധം വായ് കെട്ടുന്നതിനെ നിരോധിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ നിയമനിർദേശശൈലിയിൽ ‘വായ് കെട്ടരുത്’ എന്നത് ആശയം നേരിട്ടും വ്യക്തമായും നൽകുന്നു.
- source_word: שׁוֹר
  choice: കാള
  rationale: കൃഷിപ്പണിയിൽ ഉപയോഗിക്കുന്ന ഗോവർഗമൃഗത്തെയാണ് ഈ പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്. മെതിക്കൽസന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികവും പരിചിതവുമായ തുല്യപദം ‘കാള’ ആണ്.
- source_word: בְּדִישׁוֹ
  choice: മെതിക്കുമ്പോൾ
  rationale: בְּ എന്ന ഉപസർഗവും דישׁ എന്ന പദവും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും ചേർന്ന രൂപം അക്ഷരാർഥത്തിൽ ‘അതിന്റെ മെതിക്കലിൽ’ എന്നാണ്. സന്ദർഭത്തിലെ സമയബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘മെതിക്കുമ്പോൾ’ എന്നു നൽകി; ധാന്യം ചവിട്ടിമെതിക്കുന്ന പ്രത്യേക രീതി മുഖ്യവാചകത്തിൽ അനാവശ്യമായി ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ചുരുക്കവും ഗൗരവവുമുള്ള നിയമനിർദേശശൈലി ഉപയോഗിച്ചു. ‘മുഖപട്ട കെട്ടരുത്’ എന്നതിനേക്കാൾ സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന ‘വായ് കെട്ടരുത്’ തിരഞ്ഞെടുത്തു; അടിക്കുറിപ്പിലെ പകരവിവർത്തനം മുഖ്യപാഠത്തിലെ യഥാർഥമായ പൊതുവായ അർഥം നിലനിർത്തിക്കൊണ്ട് കൃഷിരീതിയെ വ്യക്തമാക്കുന്നു.
