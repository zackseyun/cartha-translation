revisions:
- from: നിങ്ങൾ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ വഴിയിൽവെച്ച് അമാലേക്ക് നിങ്ങളോടു ചെയ്തത് ഓർക്കുക.[a]
  to: നിങ്ങൾ ഈജിപ്തിൽനിന്നു പുറപ്പെട്ടപ്പോൾ, വഴിയിൽ അമാലേക് നിന്നോടു ചെയ്തത് ഓർക്കുക.[a]
  rationale: The revision preserves the Hebrew singular ‘to you’ and plural ‘when you came out,’ uses a closer transliteration of Amalek, and corrects the lexical-alternative footnote while retaining the verse's concise, solemn imperative style.
  reviewer_model: gpt-5.6-terra
