translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാവാക്യം. എബ്രായത്തിലെ അഭിസംബോധന ഏകവചനമായ ‘നിങ്ങളോട്’ എന്ന ആശയത്തിലാണെങ്കിലും പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്ന ക്രിയയിലെ പ്രത്യയം ബഹുവചനമാണ്; മലയാളത്തിലെ ആദര/സമൂഹസൂചക ‘നിങ്ങൾ’ ഈ രൂപപരമായ സംഘർഷം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു. തുടർന്നുള്ള വാക്യങ്ങളുമായി ബന്ധിപ്പിക്കുന്ന എബ്രായ വിരാമത്തിന്റെ സ്വഭാവം മാനിച്ചുകൊണ്ട് വാക്യം അനാവശ്യമായി വിശദീകരിച്ചിട്ടില്ല.
