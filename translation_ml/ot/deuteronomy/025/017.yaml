source:
  edition: WLC
  text: זָכ֕וֹר אֵ֛ת אֲשֶׁר עָשָׂ֥ה לְ/ךָ֖ עֲמָלֵ֑ק בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/017.yaml
  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: ml
  text: നിങ്ങൾ ഈജിപ്തിൽനിന്നു പുറപ്പെട്ടപ്പോൾ, വഴിയിൽ അമാലേക് നിന്നോടു ചെയ്തത് ഓർക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈജിപ്തിൽനിന്നു പുറത്തേക്ക്.’
    reason: ‘ഈജിപ്തിൽനിന്ന്’ എന്നതിന് പകരമായി ‘ഈജിപ്തിൽനിന്നു പുറത്തേക്ക്’ എന്ന പ്രയോഗം പുറപ്പെടലിന്റെ ഭാവം കൂടുതൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: זָכוֹר
  choice: ഓർക്കുക
  rationale: זכר എന്ന ക്രിയയുടെ കാൽ ആജ്ഞാരൂപം ഏകവചനത്തിലാണ്. ‘ഓർക്കുക’ നേരിട്ടുള്ള ആജ്ഞയും ഉടമ്പടിസംബന്ധമായ ഓർമയുടെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵת אֲשֶׁר
  choice: ചെയ്തത്
  rationale: കർമചിഹ്നവും ബന്ധസൂചകവും ചേർന്ന് ഓർക്കേണ്ട കാര്യത്തെ അവതരിപ്പിക്കുന്നു; ‘ചെയ്തത്’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഉള്ളടക്കം ബന്ധിപ്പിക്കുന്നു.
- source_word: עָשָׂה לְךָ
  choice: നിങ്ങളോടു ചെയ്തത്
  rationale: עשה എന്ന ക്രിയയോടുകൂടിയ לְךָ ഇവിടെ ഇസ്രായേലിനെ ലക്ഷ്യമാക്കിയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ അത് ശത്രുതാപരമായതിനാൽ ‘നിങ്ങളോടു ചെയ്തത്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עֲמָלֵק
  choice: അമാലേക്ക്
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: בַּדֶּרֶךְ
  choice: വഴിയിൽവെച്ച്
  rationale: ב prefixed דרך യാത്രയുടെ വഴിയെയോ യാത്രാമധ്യേയുള്ള സാഹചര്യത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വഴിയിൽവെച്ച്’ ആ സാഹചര്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּצֵאתְכֶם
  choice: നിങ്ങൾ ... പുറപ്പെട്ടപ്പോൾ
  rationale: ב ചേർന്ന יצאയുടെ infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ബഹുവചന പ്രത്യയം നിലനിർത്തിക്കൊണ്ട് ‘നിങ്ങൾ ... പുറപ്പെട്ടപ്പോൾ’ എന്ന് സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: מן ഉറവിടമോ പുറപ്പെടുന്ന സ്ഥലമോ സൂചിപ്പിക്കുന്നു. ‘ഈജിപ്തിൽനിന്ന്’ മൂലപാഠത്തിന്റെ രൂപം കൃത്യമായി നിലനിർത്തുന്നു; പുറപ്പെടുക എന്ന ക്രിയയോടൊപ്പം അർഥം വ്യക്തമാണ്.
