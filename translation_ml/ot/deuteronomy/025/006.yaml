source:
  edition: WLC
  text: וְ/הָיָ֗ה הַ/בְּכוֹר֙ אֲשֶׁ֣ר תֵּלֵ֔ד יָק֕וּם עַל שֵׁ֥ם אָחִ֖י/ו הַ/מֵּ֑ת וְ/לֹֽא יִמָּחֶ֥ה שְׁמ֖/וֹ מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: ml
  text: അവൾ പ്രസവിക്കുന്ന ആദ്യജാതപുത്രൻ മരിച്ചുപോയ ആ സഹോദരന്റെ പേര് നിലനിർത്തണം[a]; അങ്ങനെ ആ സഹോദരന്റെ പേര് ഇസ്രായേലിൽനിന്ന് മാഞ്ഞുപോകാതിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: “മരിച്ചുപോയ തന്റെ സഹോദരന്റെ പേരിന്മേൽ നിലകൊള്ളണം.” ഈ നിയമപ്രയോഗം മരിച്ചുപോയ സഹോദരന്റെ കുടുംബരേഖയും ഇസ്രായേലിലെ സ്ഥാനവും തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു; കുട്ടിക്ക് അതേ വ്യക്തിപരമായ പേര് നൽകണമെന്നത് നിർബന്ധമല്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: ആദ്യജാതൻ
  rationale: ആദ്യമായി ജനിക്കുന്ന ആൺകുട്ടിയെന്ന നിയമപരവും കുടുംബപരവുമായ പ്രാധാന്യം നിലനിർത്തുന്നു.
- source_word: תֵּלֵד
  choice: അവൾ പ്രസവിക്കുന്ന
  rationale: സ്ത്രീലിംഗ ഏകവചന ക്രിയ വിധവയെ സൂചിപ്പിക്കുന്നു; മാതൃകർത്താവിനെ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יָקוּם עַל שֵׁם
  choice: പേരും വംശപരമ്പരയും തുടരുന്നവനാകണം
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പ്രയോഗം മരിച്ചവന്റെ വ്യക്തിപരമായ പേര് കുട്ടിക്ക് നൽകുന്നതിൽ മാത്രം ഒതുങ്ങാതെ, അവന്റെ കുടുംബസ്ഥാനവും വംശരേഖയും നിലനിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചും അടിക്കുറിപ്പിൽ പദശഃ രൂപം നൽകിയുമാണ് യഥാർഥ പ്രയോഗത്തിന്റെ വ്യാപ്തി സംരക്ഷിച്ചത്.
- source_word: אָחִיו הַמֵּת
  choice: മരിച്ച സഹോദരന്റെ
  rationale: ഹീബ്രു ബന്ധപദത്തിന്റെ ലളിതമായ അർഥം നൽകുന്നു; സന്ദർഭത്തിൽ ഇത് ജീവിച്ചിരിക്കുന്ന സഹോദരന്റെ മരിച്ച സഹോദരനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יִמָּחֶה
  choice: മാഞ്ഞുപോകാതിരിക്കണം
  rationale: מחה എന്ന ക്രിയയുടെ തുടച്ചുനീക്കപ്പെടുക, ഇല്ലാതാകുക എന്ന ആശയം ഒരു പേരിനെക്കുറിച്ച് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്ന്
  rationale: ജനസമൂഹത്തിൽനിന്നുള്ള നീക്കം സൂചിപ്പിക്കുന്ന מן എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷയാണ്.
theological_decisions:
- issue: יָקוּם עַל שֵׁם എന്ന ലേവിരേറ്റ് നിയമപ്രയോഗത്തിന്റെ അർഥം
  choice: കുട്ടി മരിച്ച സഹോദരന്റെ പേരും വംശപരമ്പരയും കുടുംബസ്ഥാനവും തുടരുന്നു.
  alternative: കുട്ടിക്ക് മരിച്ച സഹോദരന്റെ അതേ വ്യക്തിപരമായ പേര് നൽകണം.
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പ്രയോഗം മരിച്ചവന്റെ പേര്, അവകാശരേഖ, ഇസ്രായേലിലെ കുടുംബസ്മരണം എന്നിവ നിലനിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. അതിനെ വെറും വ്യക്തിനാമകരണമായി ചുരുക്കുന്നത് ഹീബ്രു പ്രയോഗത്തിന്റെ നിയമ-സാമൂഹിക ശക്തി കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ഹീബ്രു പ്രയോഗത്തിന്റെ അപരിചിതമായ പദശഃ രൂപം മുഖ്യവാചകത്തെ ദുർഗ്രാഹ്യമാക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; ‘ആ സഹോദരന്റെ’ എന്ന് ആവർത്തിച്ചത് അവസാനത്തെ സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാനാണ്.
