revisions:
- from: അവൾ പ്രസവിക്കുന്ന ആദ്യജാതൻ മരിച്ച സഹോദരന്റെ പേരും വംശപരമ്പരയും തുടരുന്നവനാകണം[a]; അങ്ങനെ ആ സഹോദരന്റെ പേര് ഇസ്രായേലിൽനിന്ന് മാഞ്ഞുപോകാതിരിക്കണം.
