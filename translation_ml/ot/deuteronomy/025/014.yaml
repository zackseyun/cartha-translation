id: DEU.25.14
reference: Deuteronomy 25:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא יִהְיֶ֥ה לְ/ךָ֛ בְּ/בֵיתְ/ךָ֖ אֵיפָ֣ה וְ/אֵיפָ֑ה גְּדוֹלָ֖ה וּ/קְטַנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/014.yaml
  text: You shall not have in your house an ephah and an ephah[a], a large and a small.
translation:
  language: ml
  text: നിന്റെ വീട്ടിൽ ഒരു വലിയ ഏഫാ[a] അളവും ഒരു ചെറിയ ഏഫാ അളവും ഉണ്ടാകരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഏഫാ ധാന്യാദി ഉണങ്ങിയ വസ്തുക്കൾ അളക്കുന്നതിനുള്ള പുരാതന എബ്രായ അളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: നിനക്ക് ... ഉണ്ടാകരുത്
  rationale: നിഷേധരൂപത്തിലുള്ള היה എന്ന ക്രിയയും ദത്തിവാചകവും ചേർന്ന് കൈവശം വെക്കുന്നതിനെ വിലക്കുന്ന നിയമപ്രയോഗമാണ്; മലയാളത്തിൽ ‘ഉണ്ടാകരുത്’ അതിന്റെ നിരോധനസ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּבֵיתְךָ
  choice: നിന്റെ വീട്ടിൽ
  rationale: בַּיִת ഇവിടെ അളവുപാത്രങ്ങൾ സൂക്ഷിക്കുന്ന ഭൗതികമായ വീടിനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘കുടുംബത്തിൽ’ എന്നതിനെക്കാൾ ‘വീട്ടിൽ’ കൃത്യമാണ്.
- source_word: אֵיפָה וְאֵיפָה
  choice: ഏഫാ അളവ് രണ്ടുതരത്തിൽ
  rationale: ആവർത്തിച്ച אֵיפָה വ്യത്യസ്ത മാനദണ്ഡങ്ങളുള്ള രണ്ട് ഏഫാ അളവുകളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്കുതോറ്റുള്ള ആവർത്തനം ആശയക്കുഴപ്പമുണ്ടാക്കാവുന്നതിനാൽ ‘രണ്ടുതരത്തിൽ’ എന്ന് വ്യക്തമാക്കി, പുരാതന അളവിന്റെ പേര് നിലനിർത്തി.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: ഒന്ന് വലുതും ഒന്ന് ചെറുതും
  rationale: രണ്ട് വ്യത്യസ്ത ഏഫാ അളവുകൾ എന്ന അർഥം വ്യക്തമായി നൽകുകയും എബ്രായത്തിന്റെ സംക്ഷിപ്തമായ വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. പുരാതന അളവിന്റെ പേര് ലിപ്യന്തരണം ചെയ്ത് സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി; വാക്യത്തിലെ നിരോധനവും ഇരട്ട അളവുകളുടെ വൈരുധ്യവും വ്യക്തമായി സൂക്ഷിച്ചു.
