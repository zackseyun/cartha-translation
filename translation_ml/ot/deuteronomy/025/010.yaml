  text: And his name shall be called in Israel[a], ‘The house of him whose sandal was removed.’
translation:
  language: ml
  text: ഇസ്രായേലിൽ അവന്റെ പേര്, “ചെരിപ്പ് ഊരപ്പെട്ടവന്റെ ഭവനം” എന്നു വിളിക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ ഈ ആചാരപരമായ അപമാനനാമം വളരെ സംക്ഷിപ്തമാണ്; അക്ഷരാർഥത്തോട് അടുത്തായി: “ചെരിപ്പ് ഊരപ്പെട്ടവന്റെ ഭവനം.” ‘ഭവനം’ ഇവിടെ കുടുംബത്തെയോ വംശത്തെയോ സൂചിപ്പിക്കാനും കഴിയും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרָא
  choice: വിളിക്കപ്പെടും
  rationale: קרא എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ പൊതുവായ പേരിടൽസൂത്രമായി പ്രവർത്തിക്കുന്നു; നിഷ്ക്രിയഭാവവും നിയമപരമായ ഔപചാരികതയും നിലനിർത്തുന്നു.
- source_word: שְׁמוֹ
  choice: അവന്റെ പേര്
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയമുള്ള രൂപത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ; പൊതുസമൂഹത്തിലെ കുടുംബപ്പേരിനെയോ കീർത്തിയെയോ സൂചിപ്പിക്കുന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: ഈ പേര് ഉപയോഗിക്കപ്പെടുന്ന സാമൂഹികമണ്ഡലത്തെ ב സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בֵּית
  choice: ഭവനം
  rationale: ഇവിടെ ഒരു കെട്ടിടം മാത്രമല്ല, കുടുംബത്തെയും വംശപരമ്പരയെയും സൂചിപ്പിക്കുന്ന സ്ഥിരമായ അപമാനനാമത്തിന്റെ ഭാഗമാണ്; ‘ഭവനം’ പേരിടൽസൂത്രത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: חֲלוּץ הַנָּעַל
  choice: ചെരിപ്പ് ഊരപ്പെട്ടവന്റെ
  rationale: חלץ എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ കൃദന്തരൂപവും ‘ചെരിപ്പ്’ എന്ന നിർദിഷ്ട നാമവും ചേർന്ന സംക്ഷിപ്ത എബ്രായപ്രയോഗം. മുൻവാക്യത്തിലെ ആചാരവുമായി ബന്ധപ്പെടുത്തി അതിന്റെ നിഷ്ക്രിയ അർഥം വ്യക്തമായി നൽകുന്നു.
