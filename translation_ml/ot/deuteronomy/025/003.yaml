language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַרְבָּעִ֥ים יַכֶּ֖/נּוּ לֹ֣א יֹסִ֑יף פֶּן יֹסִ֨יף לְ/הַכֹּת֤/וֹ עַל אֵ֨לֶּה֙ מַכָּ֣ה רַבָּ֔ה וְ/נִקְלָ֥ה אָחִ֖י/ךָ לְ/עֵינֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: ml
  text: അവനെ നാല്പത് പ്രാവശ്യം അടിക്കാം[a], എന്നാൽ അതിൽ കൂടുതൽ അടിക്കരുത്; അല്ലെങ്കിൽ, ഇവയ്ക്കപ്പുറം അവനെ അമിതമായി അടിച്ചതിനാൽ നിന്റെ സഹോദരൻ[b] നിന്റെ കൺമുമ്പിൽ നിന്ദ്യനായിത്തീരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നാല്പത് അടി’ അല്ലെങ്കിൽ ‘നാല്പത് പ്രഹരങ്ങൾ’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപാഠം നാല്പത് എന്ന എണ്ണം വ്യക്തമാക്കുന്നു; എന്നാൽ അടിക്കാനുള്ള ഉപകരണമോ ഓരോ പ്രഹരത്തിന്റെ കൃത്യരൂപമോ ഇവിടെ പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘സഹോദരൻ’ എന്നത് ഉടമ്പടി സമൂഹത്തിലെ ഒരു സഹാംഗത്തെ സൂചിപ്പിക്കുന്നു. ശിക്ഷിക്കപ്പെടുന്നവനെ നിന്ദ്യനായി കണക്കാക്കാതിരിക്കാനാണ് നിയമം ശിക്ഷയ്ക്ക് പരിധി നിശ്ചയിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: അവനെ നാല്പതു പ്രാവശ്യം അടിക്കാം
  rationale: എണ്ണം നാല്പത് എന്നു വ്യക്തമായി നിലനിർത്തുന്നു. അടിക്കാനുള്ള ഉപകരണമോ ഓരോ അടിയുടെ കൃത്യരൂപമോ എബ്രായപാഠം പറയാത്തതിനാൽ ‘പ്രാവശ്യം’ എന്നു നൽകി ക്രിയയോടു സ്വാഭാവികമായി ചേർത്തു.
- source_word: לֹא יֹסִיף
  choice: അതിൽ കൂടരുത്
  rationale: יסף എന്നതിന്റെ ‘കൂട്ടുക/അധികമാക്കുക’ എന്ന ആശയം നിയമപരമായ പരിധിയായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ עַל אֵלֶּה
  choice: അല്ലെങ്കിൽ, ഇവയ്ക്കു പുറമേ ... അവനെ അടിക്കുന്നതിനാൽ
  rationale: നിശ്ചയിച്ച എണ്ണത്തിനു മീതെ അടിക്കൽ തുടരരുതെന്ന മുന്നറിയിപ്പിന്റെ ഉദ്ദേശ്യവും ഫലവും നിലനിർത്തുന്നു.
- source_word: מַכָּה רַבָּה
  choice: അനവധി അടി
  rationale: എബ്രായത്തിൽ ഏകവചനരൂപമുള്ളെങ്കിലും ഇവിടെ അതിരുകടന്ന അടികളുടെ സമാഹാരത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സന്ദർഭാനുസൃതമായി ബഹുവചനാർഥം നൽകി.
- source_word: וְנִקְלָה
  choice: നിന്ദിതനായിത്തീരും
  rationale: קלה എന്ന ക്രിയയുടെ നിഫാൽ രൂപം അപമാനിക്കപ്പെടുക, നിസ്സാരനായി കണക്കാക്കപ്പെടുക എന്ന ആശയം നൽകുന്നു; ശിക്ഷിക്കപ്പെടുന്നവന്റെ മാന്യത നഷ്ടപ്പെടുന്നതാണ് ഇവിടെ പ്രധാനം.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരൻ
  rationale: ഉടമ്പടിസമൂഹത്തിലെ സഹാംഗത്തെ സൂചിപ്പിക്കുന്ന കുടുംബബന്ധപദം അതേപടി നിലനിർത്തി; ‘സഹഇസ്രായേല്യൻ’ എന്നു വിശദീകരിച്ച് മൂലപാഠത്തിലെ നൈതിക ശക്തി ചുരുക്കിയില്ല.
- source_word: לְעֵינֶיךָ
  choice: നിന്റെ കൺമുമ്പിൽ
  rationale: ‘നിന്റെ കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന മൂലപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള നൈതിക ഭാരം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിയമസന്ദർഭത്തിലെ ഉടമ്പടിബന്ധത്തെ സൂചിപ്പിക്കുന്ന אָחִיךָ എന്ന പദം
  choice: നിന്റെ സഹോദരൻ
  alternative: നിന്റെ സഹഇസ്രായേല്യൻ
  rationale: ശിക്ഷ ലഭിച്ചാലും ആ വ്യക്തി സമൂഹത്തിലെ ‘സഹോദരൻ’ തന്നെയാണെന്ന വാക്യത്തിന്റെ മാനവമഹത്വപരമായ ഊന്നൽ കുടുംബബന്ധപദം നിലനിർത്തുമ്പോൾ വ്യക്തമായി സംരക്ഷിക്കപ്പെടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമവാക്യത്തിന്റെ ഗൗരവവും സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയും ഒരുമിച്ച് സൂക്ഷിച്ചു. ‘കൺമുമ്പിൽ’, ‘അതിൽ കൂടരുത്’ എന്നീ സ്വാഭാവിക പ്രയോഗങ്ങൾ ഉപയോഗിച്ചപ്പോൾ മൂലപാഠത്തിലെ എണ്ണം, മുന്നറിയിപ്പ്, സഹോദരബന്ധം, മാനവമഹത്വം എന്നിവ നിലനിർത്തി.
