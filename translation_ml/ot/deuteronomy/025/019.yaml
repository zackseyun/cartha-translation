reference: Deuteronomy 25:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֡ה בְּ/הָנִ֣יחַ יְהוָ֣ה אֱלֹהֶ֣י/ךָ לְ֠/ךָ מִ/כָּל אֹ֨יְבֶ֜י/ךָ מִ/סָּבִ֗יב בָּ/אָ֨רֶץ֙ אֲשֶׁ֣ר יְהוָֽה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֤ נַחֲלָה֙ לְ/רִשְׁתָּ֔/הּ תִּמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹ֖א תִּשְׁכָּֽח׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വേ നിനക്കു ചുറ്റുമുള്ള സകല ശത്രുക്കളിൽനിന്നും നിനക്കു വിശ്രമം നൽകുമ്പോൾ, അവകാശമായി കൈവശമാക്കാൻ നിന്റെ ദൈവമായ യഹ്‌വേ നിനക്കു നൽകുന്ന ദേശത്ത് അമാലേക്കിന്റെ ഓർമ[a] ആകാശത്തിൻ കീഴിൽനിന്ന് മായിച്ചുകളയുക. മറക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അമാലേക്കിന്റെ സ്മരണം.’
    reason: זֵכֶר എന്ന പദത്തിന് ‘ഓർമ’ എന്നും ‘സ്മരണം’ എന്നും അർഥമാക്കാം.
lexical_decisions:
- source_word: וְהָיָה בְּהָנִיחַ
  choice: സ്വസ്ഥത നൽകുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്ന കാലവാക്യത്തിന്റെ അർഥവും, נוח എന്ന ക്രിയയുടെ കാരണാർത്ഥക ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: നിനക്കു ചുറ്റുമുള്ള സകല ശത്രുക്കളിൽനിന്നും
  rationale: ‘സകല’ എന്ന സമഗ്രതയും ‘ചുറ്റുമുള്ള’ എന്ന സ്ഥലസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: נַחֲלָה לְרִשְׁתָּהּ
  choice: കൈവശമാക്കുന്നതിനായി അവകാശമായി
  rationale: נַחֲלָה എന്ന ഉടമ്പടി-ദേശസംബന്ധമായ ‘അവകാശം’ എന്ന ആശയവും ירשׁ എന്നതിന്റെ കൈവശപ്പെടുത്തൽഭാവവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: תִּמְחֶה
  choice: മായിച്ചുകളയുക
  rationale: പൂർണമായി തുടച്ചുനീക്കുക അഥവാ ഇല്ലാതാക്കുക എന്ന ശക്തമായ ആജ്ഞ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: זֵכֶר
  choice: ഓർമ
  rationale: ഒരു ജനസമൂഹത്തെക്കുറിച്ചുള്ള ഓർമയെയോ സ്മരണയെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥവ്യാപ്തി ചുരുക്കാതെ ലളിതമായ ആധുനിക പദം ഉപയോഗിക്കുന്നു.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: ആകാശത്തിൻ കീഴിൽനിന്ന്
  rationale: എബ്രായത്തിലെ ദൃശ്യരൂപവും വ്യാപ്തിയും ‘ഭൂമിയിൽനിന്ന്’ എന്നു പരത്തിപ്പറയാതെ നിലനിർത്തുന്നു.
- source_word: לֹא תִּשְׁכָּח
  choice: മറക്കരുത്
  rationale: ഹ്രസ്വവും ശക്തവുമായ നിരോധനാജ്ഞയുടെ ഭാവം നേരിട്ട് പകരുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ‘അമാലേക്കിന്റെ ഓർമ മായിച്ചുകളയുക’ എന്ന പ്രയോഗത്തിന്റെ ശക്തി
  choice: രൂപകം അതേപടി നിലനിർത്തി
  alternative: അമാലേക്കിനെ പൂർണമായി നശിപ്പിക്കുക
  rationale: മൂലപാഠം നേരിട്ട് ഉപയോഗിക്കുന്ന ‘ഓർമ മായിക്കുക’ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നത് അതിലെ ഗൗരവവും വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. ഏകവചന ദ്വിതീയപുരുഷസംബോധന നിലനിർത്തി; അനാവശ്യമായ മതവിഭാഗപരമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
