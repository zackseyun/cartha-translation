source:
  edition: WLC
  text: וְ/הָיָ֛ה אִם בִּ֥ן הַכּ֖וֹת הָ/רָשָׁ֑ע וְ/הִפִּיל֤/וֹ הַ/שֹּׁפֵט֙ וְ/הִכָּ֣ה/וּ לְ/פָנָ֔י/ו כְּ/דֵ֥י רִשְׁעָת֖/וֹ בְּ/מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/002.yaml
  text: then[a], if the wicked man deserves to be beaten, the judge shall make him lie down and have him beaten before him, according to his wickedness, by number.
translation:
  language: ml
  text: ദുഷ്ടൻ അടി ശിക്ഷയ്ക്ക് അർഹനാണെങ്കിൽ, ന്യായാധിപൻ അവനെ കിടത്തി, തന്റെ മുമ്പാകെ അവന്റെ കുറ്റത്തിന് തക്കവണ്ണം എണ്ണം നിശ്ചയിച്ച അടികളാൽ അവനെ അടിക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എണ്ണമനുസരിച്ച്’; അതായത്, കുറ്റത്തിന് ആനുപാതികമായി എണ്ണിനിശ്ചയിച്ച അടികൾ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: അടിശിക്ഷയ്ക്ക് അർഹൻ
  rationale: ‘അടിയുടെ മകൻ’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ നിയമപ്രയോഗം അടിയേറ്റുള്ള ശിക്ഷയ്ക്ക് വിധേയനാകേണ്ടവനെ സൂചിപ്പിക്കുന്നു. ‘അടിശിക്ഷയ്ക്ക് അർഹൻ’ അതിന്റെ നിയമപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָרָשָׁע
  choice: ദുഷ്ടൻ
  rationale: ന്യായവിധിയിൽ കുറ്റം ചുമത്തപ്പെട്ട കക്ഷിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നതെങ്കിലും, പദത്തിന്റെ ധാർമിക-നിയമപരമായ ‘ദുഷ്ടൻ’ എന്ന ശക്തി നിലനിർത്തുന്നു.
- source_word: וְהִפִּילוֹ
  choice: അവനെ കിടത്തി
  rationale: נפל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ശിക്ഷയ്ക്കായി ഒരാളെ കിടത്തുക എന്ന കാരണാർഥത്തിലാണ്.
- source_word: הַשֹּׁפֵט
  choice: ന്യായാധിപൻ
  rationale: പറയപ്പെടുന്ന നീതിന്യായ ഉദ്യോഗസ്ഥനുള്ള സാധാരണവും മാന്യവുമായ മലയാളപദം.
- source_word: וְהִכָּהוּ
  choice: അവനെ അടിക്കണം
  rationale: എബ്രായത്തിൽ ന്യായാധിപനാണ് വ്യാകരണപരമായ കർത്താവ്; മറ്റൊരാളെക്കൊണ്ട് അടിപ്പിക്കുന്നു എന്ന് മൂലപാഠം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആ സാധ്യത മുൻകൂട്ടി തീർപ്പാക്കാതെ നേരിട്ടുള്ള ക്രിയ നിലനിർത്തുന്നു.
- source_word: לְפָנָיו
  choice: തന്റെ മുമ്പിൽവെച്ച്
  rationale: ശിക്ഷ ന്യായാധിപന്റെ മുമ്പാകെ, അവന്റെ മേൽനോട്ടത്തിൽ നടക്കുന്നു എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כְּדֵי רִשְׁעָתוֹ
  choice: അവന്റെ കുറ്റത്തിന് തക്കവണ്ണം
  rationale: ശിക്ഷ കുറ്റത്തിന് ആനുപാതികമായിരിക്കണം എന്ന നിയമപരമായ അർഥം നൽകുന്നു; ‘ദുഷ്ടത’ എന്ന ആവർത്തനം ഒഴിവാക്കി സന്ദർഭോചിതമായ ‘കുറ്റം’ ഉപയോഗിക്കുന്നു.
- source_word: בְּמִסְפָּר
  choice: എണ്ണിക്കൊണ്ട്
  rationale: അടികളുടെ എണ്ണം കണക്കാക്കിയതായിരിക്കണം എന്ന സംക്ഷിപ്ത എബ്രായപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘എണ്ണമനുസരിച്ച്’ എന്ന കൂടുതൽ ഔപചാരിക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ശിക്ഷാനടപടിയുടെ നേരിട്ടുള്ള സ്വഭാവം മൃദൂകരിച്ചില്ല; അതേസമയം അസ്വാഭാവികമായ പദാനുപദ വിവർത്തനം ഒഴിവാക്കി.
