revisions:
- from: നിങ്ങൾ ക്ഷീണിച്ചും തളർന്നും ഇരിക്കുമ്പോൾ, വഴിയിൽവെച്ച് അവൻ നിങ്ങളെ എതിരിട്ടതും നിങ്ങളുടെ പിന്നിൽ വന്നിരുന്ന ദുർബലരെയെല്ലാം ആക്രമിച്ചതും ഓർക്കുക. അവൻ ദൈവത്തെ ഭയപ്പെട്ടില്ല.
  to: വഴിയിൽവെച്ച് അവൻ നിങ്ങളെ കണ്ടുമുട്ടിയതും, നിങ്ങളുടെ പിന്നിലുണ്ടായിരുന്ന എല്ലാ ദുർബലരെയും ആക്രമിച്ചതും ഓർക്കുക. നിങ്ങൾ ക്ഷീണിച്ചും തളർന്നും ഇരിക്കുമ്പോഴായിരുന്നു അത്. അവൻ ദൈവത്തെ ഭയപ്പെട്ടില്ല.
  rationale: The revision replaces the interpretively stronger ‘എതിരിട്ടത്’ with ‘കണ്ടുമുട്ടിയതും’ for the Hebrew encounter verb, while retaining ‘ആക്രമിച്ചതും’ for the explicitly hostile verb. It also follows the Hebrew clause order more closely and preserves the contextual imperative required by the preceding verse.
