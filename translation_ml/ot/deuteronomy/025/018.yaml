source:
  edition: WLC
  text: אֲשֶׁ֨ר קָֽרְ/ךָ֜ בַּ/דֶּ֗רֶךְ וַ/יְזַנֵּ֤ב בְּ/ךָ֙ כָּל הַ/נֶּחֱשָׁלִ֣ים אַֽחַרֶ֔י/ךָ וְ/אַתָּ֖ה עָיֵ֣ף וְ/יָגֵ֑עַ וְ/לֹ֥א יָרֵ֖א אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/018.yaml
  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: ml
  text: വഴിയിൽവെച്ച് അവൻ നിങ്ങളെ കണ്ടുമുട്ടിയതും, നിങ്ങളുടെ പിന്നിലുണ്ടായിരുന്ന എല്ലാ ദുർബലരെയും ആക്രമിച്ചതും ഓർക്കുക. നിങ്ങൾ ക്ഷീണിച്ചും തളർന്നും ഇരിക്കുമ്പോഴായിരുന്നു അത്. അവൻ ദൈവത്തെ ഭയപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: നിങ്ങളെ എതിരിട്ടത്
  rationale: ക്രിയയ്ക്ക് ‘കണ്ടുമുട്ടുക/നേരിടുക’ എന്ന അർഥവ്യാപ്തിയുണ്ട്; ഇവിടെ ശത്രുതാപരമായ സന്ദർഭം സൂചിപ്പിക്കുന്നതിനാൽ ‘എതിരിട്ടത്’ സ്വാഭാവികവും അതിരുകടക്കാത്തതുമാണ്.
- source_word: וַיְזַנֵּב
  choice: പിന്നിൽ വന്നിരുന്ന ... ആക്രമിച്ചത്
  rationale: പിന്നിലുണ്ടായിരുന്നവരെ പിന്നിൽനിന്ന് പ്രഹരിക്കുക/ആക്രമിക്കുക എന്ന ആശയം നൽകുന്നു. കൊല്ലുകയോ വെട്ടിവീഴ്ത്തുകയോ ചെയ്തുവെന്ന് മൂലപാഠം നിർബന്ധമായി പറയാത്തതിനാൽ ‘ആക്രമിച്ചത്’ തിരഞ്ഞെടുത്തു.
- source_word: הַנֶּחֱשָׁלִים
  choice: ദുർബലർ
  rationale: ക്ഷീണത്താലോ ബലഹീനതയാലോ പിന്നിലായവരെ സൂചിപ്പിക്കുന്നു; ‘ദുർബലർ’ ഈ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: עָיֵף וְיָגֵעַ
  choice: ക്ഷീണിച്ചും തളർന്നും
  rationale: അടുത്ത അർഥമുള്ള ഇരട്ടപ്രയോഗത്തിന്റെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: അവൻ ദൈവത്തെ ഭയപ്പെട്ടില്ല
  rationale: ഹീബ്രു വാക്യഘടനയും ധാർമ്മിക വിലയിരുത്തലും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തെ ഭയപ്പെട്ടില്ല’ എന്നതിലെ കർത്താവ്
  choice: അവൻ—അമാലേക്ക്—ദൈവത്തെ ഭയപ്പെട്ടില്ല
  alternative: ഇസ്രായേൽ ദൈവത്തെ ഭയപ്പെട്ടില്ല
  rationale: ഏറ്റവും അടുത്ത ഏകവചന പുരുഷകർത്താവും പ്രസംഗസന്ദർഭവും അമാലേക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്; എങ്കിലും വിവർത്തനത്തിൽ ‘അവൻ’ എന്ന മൂലപാഠസാദൃശ്യം നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിലെ ‘അമാലേക്ക് നിന്നോടു ചെയ്തത് ഓർക്കുക’ എന്ന ആജ്ഞയോട് വ്യാകരണപരമായി ചേർന്നതിനാൽ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ഓർക്കുക’ ആവർത്തിച്ചു.
