  yaml_path: translation/ot/deuteronomy/025/013.yaml
  text: You shall not have in your bag differing weights[a], a large and a small.
translation:
  language: ml
  text: നിന്റെ സഞ്ചിയിൽ വ്യത്യസ്ത തൂക്കക്കല്ലുകൾ[a]—വലുതും ചെറുതും—ഉണ്ടാകരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘കല്ലും കല്ലും’; വ്യാപാരത്തിൽ തൂക്കം അളക്കാൻ ഉപയോഗിച്ചിരുന്ന കൽത്തൂക്കുകളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: നിനക്ക് ... ഉണ്ടാകരുത്
  rationale: ‘നിനക്കായി ഉണ്ടായിരിക്കരുത്’ എന്ന അക്ഷരാർഥഘടനയെ സ്വാഭാവികമായ മലയാള നിയമനിരോധനമായി അവതരിപ്പിക്കുന്നു; ഹീബ്രുവിലെ നിരോധനബലം നിലനിർത്തുന്നു.
- source_word: בְּכִיסְךָ
  choice: നിന്റെ സഞ്ചിയിൽ
  rationale: כִּיס വ്യാപാരത്തിൽ പണമോ തൂക്കക്കല്ലുകളോ സൂക്ഷിക്കുന്ന സഞ്ചിയെയോ ചെറുസഞ്ചിയെയോ സൂചിപ്പിക്കുന്നു. ‘സഞ്ചി’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֶבֶן וָאָבֶן
  choice: വ്യത്യസ്ത തൂക്കക്കല്ലുകൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘കല്ലും കല്ലും’ എന്ന ആവർത്തനപ്രയോഗം വ്യാപാരത്തിൽ ഉപയോഗിച്ചിരുന്ന വ്യത്യസ്ത അളവുള്ള കൽത്തൂക്കങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘തൂക്കക്കല്ലുകൾ’ വസ്തുവും ഉപയോഗവും വ്യക്തമാക്കുന്നു; ‘വ്യത്യസ്ത’ അവയിലെ കൃത്രിമ അസമത്വം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: വലുതും ചെറുതും
  rationale: രണ്ടു തൂക്കക്കല്ലുകളുടെ വിരുദ്ധ വലുപ്പങ്ങളെ ഹീബ്രുവിന്റെ സംക്ഷിപ്തതയോടെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ. ഡാഷുകൾ അവസാനത്തെ ‘വലുതും ചെറുതും’ എന്ന വിശദീകരണത്തെ പ്രധാന നിരോധനവുമായി വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
