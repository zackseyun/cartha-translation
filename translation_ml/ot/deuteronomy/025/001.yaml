  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: ml
  text: മനുഷ്യർ തമ്മിൽ ഒരു തർക്കമുണ്ടാകുകയും[a] അവർ ന്യായവിധിക്കായി കോടതിയിൽ വരികയും ചെയ്താൽ[b], ന്യായാധിപന്മാർ അവർക്കു വിധി പ്രസ്താവിക്കണം. അവർ നീതിയുള്ളവനെ നീതിയുള്ളവനെന്നു പ്രഖ്യാപിക്കുകയും കുറ്റക്കാരനെ കുറ്റക്കാരനെന്നു പ്രഖ്യാപിക്കുകയും വേണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “മനുഷ്യർ തമ്മിൽ ഒരു തർക്കമുണ്ടാകുമ്പോൾ.”'
    reason: alternative_reading
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ന്യായവിധിയിലേക്കു”; അതായത്, നീതിന്യായ നടപടിക്കായി അഥവാ കോടതിയിലേക്കു.'
    reason: lexical_alternative
  - marker: c
    text: “നീതിയുള്ളവനെന്നു പ്രഖ്യാപിക്കുക”, “കുറ്റക്കാരനെന്നു പ്രഖ്യാപിക്കുക” എന്നിവ കോടതിവിധിയെ സൂചിപ്പിക്കുന്ന പദപ്രയോഗങ്ങളാണ്; അതായത്, കേസിൽ ഒരാൾ ശരിയായ പക്ഷത്താണെന്നും മറ്റൊരാൾ കുറ്റക്കാരനാണെന്നും പ്രഖ്യാപിക്കുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: ഉണ്ടായി ... വന്നാൽ
  rationale: കേസിനിയമത്തിന്റെ സോപാധിക സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. כִּיക്ക് ഇവിടെ ‘എപ്പോൾ’ എന്ന കാലാർഥവും സാധ്യമാകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: רִיב
  choice: തർക്കം
  rationale: നിയമപരമായ വിവാദത്തെയും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന തർക്കത്തെയും ഒരുപോലെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം.
- source_word: בֵּין אֲנָשִׁים
  choice: മനുഷ്യർ തമ്മിൽ
  rationale: אֲנָשִׁים വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായിരുന്നാലും ഇവിടെ തർക്കത്തിലെ കക്ഷികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘മനുഷ്യർ’ മൂലപദത്തോട് അടുത്തും സ്വാഭാവികവുമാണ്.
- source_word: אֶל הַמִּשְׁפָּט
  choice: ന്യായവിധിക്കായി ന്യായാധിപന്മാരുടെ അടുക്കൽ
  rationale: അക്ഷരാർഥം ‘ന്യായവിധിയിലേക്കു’ എന്നാണ്; സന്ദർഭത്തിൽ ഇത് നീതിന്യായ നടപടിക്കായി അധികാരികളുടെ മുമ്പാകെ വരുന്നതിനെ സൂചിപ്പിക്കുന്നു. അടുത്ത ക്രിയയിലെ വ്യക്തമാക്കാത്ത വിധികർത്താക്കളെ ‘ന്യായാധിപന്മാർ’ എന്ന് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: וּשְׁפָטוּם
  choice: ന്യായാധിപന്മാർ അവരുടെ കാര്യത്തിൽ വിധി പ്രസ്താവിക്കണം
  rationale: എബ്രായത്തിൽ ‘അവർ അവരെ വിധിക്കണം’ എന്ന സജീവ ബഹുവചന രൂപമാണ്. മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമാക്കുകയും വിധി തർക്കവിഷയത്തെ സംബന്ധിക്കുന്നതാണെന്ന് സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִצְדִּיקוּ אֶת הַצַּדִּיק
  choice: നീതിയുള്ളവനെ നീതിമാനെന്നു വിധിക്കുക
  rationale: നിയമസന്ദർഭത്തിൽ ഹിഫീൽ രൂപം ഒരാളെ ധാർമികമായി മാറ്റുന്നതല്ല, ശരിയായ പക്ഷത്താണെന്ന് ഔദ്യോഗികമായി പ്രഖ്യാപിക്കുന്നതാണ്. ‘നീതിയുള്ളവൻ/നീതിമാൻ’ എന്ന പദജോടി മൂലത്തിലെ צדק ആവർത്തനം സംരക്ഷിക്കുന്നു.
- source_word: וְהִרְשִׁיעוּ אֶת הָרָשָׁע
  choice: കുറ്റക്കാരനെ കുറ്റക്കാരനെന്നു വിധിക്കുക
  rationale: നിയമപരമായി കുറ്റക്കാരനെന്ന് പ്രഖ്യാപിക്കുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; രשעയുടെ വിശേഷണ-ക്രിയ ബന്ധവും ആവർത്തനത്തിലൂടെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: צדק/רשע പദങ്ങളുടെ നിയമപരമായ അർഥമോ പൊതുവായ ധാർമിക അർഥമോ
  choice: കോടതിവിധിയുടെ അർഥത്തിൽ ‘നീതിമാനെന്നു വിധിക്കുക’, ‘കുറ്റക്കാരനെന്നു വിധിക്കുക’
  alternative: പൊതുവായ ധാർമിക വിശേഷണങ്ങളായി ‘നീതിമാനെ നീതീകരിക്കുക’, ‘ദുഷ്ടനെ ശിക്ഷിക്കുക’
  rationale: ന്യായവിധിക്കു വരുകയും വിധി പ്രസ്താവിക്കുകയും ചെയ്യുന്ന തത്സമയ സന്ദർഭം ഇവ നിയമപരമായ പ്രഖ്യാപനങ്ങളാണെന്ന് കാണിക്കുന്നു. ഇതിലൂടെ പിന്നീടുള്ള സിദ്ധാന്തപരമായ ‘നീതീകരണം’ എന്ന ആശയം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതെ മൂലത്തിലെ നീതി/കുറ്റം എന്ന വിരുദ്ധത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘നീതീകരിക്കുക’ എന്ന സാങ്കേതിക ദൈവശാസ്ത്രപദം ഒഴിവാക്കി നിയമപരമായ പ്രഖ്യാപനം തുറന്നുപറഞ്ഞു. പ്രധാനവാക്യത്തിൽ ചേർത്ത ‘ന്യായാധിപന്മാർ’ എബ്രായക്രിയയിലെ വ്യക്തമാക്കാത്ത ബഹുവചന കർത്താവിനെ നിയമസന്ദർഭത്തിൽ നിന്ന് വ്യക്തമാക്കുന്നതാണ്.
