revisions:
- from: ഇവ ചെയ്യുന്ന ഏവനും, അനീതി പ്രവർത്തിക്കുന്ന ഏവനും, നിന്റെ ദൈവമായ യഹ്‌വേക്കു വെറുപ്പാകുന്നു.[a]
  to: ഇവ ചെയ്യുന്ന ഏവനും, അനീതി ചെയ്യുന്ന ഏവനും, നിന്റെ ദൈവമായ യഹ്‌വേക്കു അറപ്പാകുന്നു.[a]
  rationale: “പ്രവർത്തിക്കുന്ന” എന്നതിനു പകരം “ചെയ്യുന്ന” ഉപയോഗിച്ച് മൂലത്തിലെ ആവർത്തിച്ച עֹשֵׂה (‘ചെയ്യുന്ന’) ഘടന കൂടുതൽ അടുത്തായി പ്രതിഫലിപ്പിച്ചു. തുֹעֵבָהയുടെ ശക്തമായ നൈതിക നിന്ദ സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകാൻ “വെറുപ്പാകുന്നു” എന്നതിന് പകരം “അറപ്പാകുന്നു” ഉപയോഗിച്ചു. ആവർത്തനവും ദൈവനാമവും അടിക്കുറിപ്പിന്റെ അർഥവ്യാപ്തിയും നിലനിർത്തിയിരിക്കുന്നു.
