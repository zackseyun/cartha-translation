source:
  edition: WLC
  text: כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֣שֵׂה אֵ֑לֶּה כֹּ֖ל עֹ֥שֵׂה עָֽוֶל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/016.yaml
  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
translation:
  language: ml
  text: ഇവ ചെയ്യുന്ന ഏവനും, അനീതി ചെയ്യുന്ന ഏവനും, നിന്റെ ദൈവമായ യഹ്‌വേക്കു അറപ്പാകുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അനീതി” എന്നതിന് “തെറ്റ്” എന്നോ “നീതികേട്” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദം തെറ്റ്, അനീതി, അധാർമികത എന്നിവയെ സൂചിപ്പിക്കാം; ഇവിടെ പ്രത്യേകിച്ച് കച്ചവടത്തിലെ വഞ്ചനയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന വാക്യബന്ധം (മലയാളത്തിൽ പ്രത്യേക പദമില്ലാതെ)
  rationale: മുൻവാക്യത്തിലെ വിലക്കിനുള്ള കാരണം ഈ വാക്യം നൽകുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ സ്വാഭാവികമായ മലയാളത്തിനായി പ്രത്യേകം ‘എന്തെന്നാൽ’ ചേർക്കാതെ വിശദീകരണബന്ധം നിലനിർത്തി.
- source_word: תוֹעֲבַת
  choice: വെറുപ്പാകുന്നു
  rationale: ദൈവസന്നിധിയിൽ അത്യന്തം അറപ്പുളവാക്കുന്നതും അസ്വീകാര്യവുമായതു എന്ന ശക്തമായ നൈതിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയവും ഉടമ്പടിസൂത്രത്തിന്റെ വ്യക്തിപരമായ അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: ഇവ ചെയ്യുന്ന ഏവനും
  rationale: പങ്കാളിക്രിയയുടെ പൊതുവായ വർഗസൂചനയും כָּל എന്നതിന്റെ സമഗ്രതയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: അനീതി പ്രവർത്തിക്കുന്ന ഏവനും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന כֹּל עֹשֵׂה ഘടന പ്രതിഫലിപ്പിക്കുകയും, കള്ളത്തൂക്കവും അളവും സംബന്ധിച്ച സന്ദർഭത്തിലെ നീതിവിരുദ്ധമായ പ്രവൃത്തിയെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരിന് പകരം അതിന്റെ സാധാരണ പണ്ഡിതപരമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: תוֹעֲבַת എന്നതിന്റെ ശക്തി
  choice: വെറുപ്പാകുന്നു
  alternative: അറപ്പായിരിക്കുന്നു / മ്ലേച്ഛമാണ്
  rationale: ദൈവത്തിന്റെ ശക്തമായ നൈതിക നിരാകരണം നിലനിർത്തുമ്പോഴും ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ‘ചെയ്യുന്ന ഏവനും … പ്രവർത്തിക്കുന്ന ഏവനും’ എന്ന ആവർത്തനത്തിന് സമാനമായ സമാന്തരഘടന നിലനിർത്തി; അടിക്കുറിപ്പുസൂചിക മുഖ്യവാചകത്തിൽ ചേർത്തു.
