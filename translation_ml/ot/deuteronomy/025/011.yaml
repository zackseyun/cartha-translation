  text: כִּֽי יִנָּצ֨וּ אֲנָשִׁ֤ים יַחְדָּו֙ אִ֣ישׁ וְ/אָחִ֔י/ו וְ/קָֽרְבָה֙ אֵ֣שֶׁת הָֽ/אֶחָ֔ד לְ/הַצִּ֥יל אֶת אִישָׁ֖/הּ מִ/יַּ֣ד מַכֵּ֑ה/וּ וְ/שָׁלְחָ֣ה יָדָ֔/הּ וְ/הֶחֱזִ֖יקָה בִּ/מְבֻשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: ml
  text: ഒരു പുരുഷനും അവന്റെ സഹോദരനും[b] തമ്മിൽ അടിപിടികൂടുമ്പോൾ[a], അവരിൽ ഒരാളുടെ ഭാര്യ തന്റെ ഭർത്താവിനെ അയാളെ അടിക്കുന്നവന്റെ കൈയിൽനിന്ന് രക്ഷിക്കാൻ അടുത്തുചെന്ന് കൈ നീട്ടി അയാളെ അടിക്കുന്നവന്റെ ഗുഹ്യാവയവങ്ങൾ[d] പിടിച്ചാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഒരു പുരുഷനും അവന്റെ സഹോദരനും തമ്മിൽ അടിപിടികൂടിയാൽ.”'
    reason: כִּי എന്ന പദത്തിന് ഈ നിയമസന്ദർഭത്തിൽ ‘എങ്കിൽ’ എന്നും ‘എപ്പോൾ/ചെയ്യുമ്പോൾ’ എന്നും അർഥമാകാം.
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഒരു പുരുഷനും അവന്റെ സഹോദരനും.” ഇവിടെ “സഹോദരൻ” എന്നത് ജൈവസഹോദരനെ മാത്രമല്ല, സഹദേശീയനെയോ കൂട്ടത്തിലുള്ള മറ്റൊരു പുരുഷനെയോ സൂചിപ്പിക്കാം.
    reason: എബ്രായ സാമൂഹിക-നിയമഭാഷയിലെ אָח എന്ന പദത്തിന്റെ വിശാലമായ പ്രയോഗം വ്യക്തമാക്കുന്നു.
  - marker: d
    text: എബ്രായത്തിൽ പുരുഷന്റെ സ്വകാര്യ ലൈംഗികാവയവങ്ങളെ സൂചിപ്പിക്കുന്ന മാന്യോക്തിയാണ്.
    reason: മൂലപദത്തിന്റെ മാന്യോക്തിസ്വഭാവവും ശരീരഭാഗത്തെക്കുറിച്ചുള്ള പരാമർശവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്താൽ
  rationale: നിയമപരമായ ഒരു സാങ്കൽപ്പിക സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ വ്യവസ്ഥാസൂചകമായ ‘ചെയ്താൽ’ സ്വാഭാവികമാണ്; ‘ചെയ്യുമ്പോൾ’ എന്ന കാലസൂചക അർഥവും സാധ്യമാണ്.
- source_word: יִנָּצוּ אֲנָשִׁים יַחְדָּו
  choice: രണ്ടു പുരുഷന്മാർ … തമ്മിൽ അടിപിടികൂടുകയും
  rationale: നിഫാൽ ക്രിയ ഇവിടെ പരസ്പരമുള്ള ശാരീരിക പോരാട്ടത്തെ സൂചിപ്പിക്കുന്നു. ‘അടിപിടികൂടുക’ ആ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אִישׁ וְאָחִיו
  choice: ഒരാളും അവന്റെ സഹോദരനും
  rationale: എബ്രായത്തിലെ ‘ഒരു പുരുഷനും അവന്റെ സഹോദരനും’ എന്ന രൂപം നിലനിർത്തുന്നു; ഇവിടെ ‘സഹോദരൻ’ ജൈവസഹോദരനെ മാത്രമല്ല, സഹദേശീയനെയോ കൂട്ടത്തിലുള്ള മറ്റൊരാളെയോ സൂചിപ്പിക്കാം.
- source_word: וְקָרְבָה
  choice: അടുത്തുചെന്ന്
  rationale: സംഭവസ്ഥലത്തേക്ക് സമീപിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ കഥനമലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: തന്റെ ഭർത്താവിനെ … രക്ഷിക്കാൻ
  rationale: אִישָׁהּ അക്ഷരാർഥത്തിൽ ‘അവളുടെ പുരുഷൻ’ എന്നാണെങ്കിലും വിവാഹസന്ദർഭത്തിൽ ‘ഭർത്താവ്’ തന്നെയാണ് വ്യക്തമായ മലയാള തുല്യം.
- source_word: מִיַּד מַכֵּהוּ
  choice: അവനെ അടിക്കുന്നവന്റെ കൈയിൽനിന്ന്
  rationale: ‘അവനെ അടിക്കുന്നവന്റെ കൈയിൽനിന്ന്’ എന്ന എബ്രായത്തിലെ സജീവവും ദൃശ്യവുമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וְשָׁלְחָה יָדָהּ
  choice: കൈ നീട്ടി
  rationale: കൈ മുന്നോട്ടു നീട്ടുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וְהֶחֱזִיקָה
  choice: പിടിക്കുകയും
  rationale: ശക്തമായി കൈവശപ്പെടുത്തുകയോ മുറുകെ പിടിക്കുകയോ ചെയ്യുന്ന പ്രവൃത്തിയെ സന്ദർഭത്തിന് യോജിച്ച ലളിതമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: בִּמְבֻשָׁיו
  choice: അയാളുടെ ഗുഹ്യാവയവങ്ങൾ
  rationale: പുരുഷന്റെ സ്വകാര്യ ലൈംഗികാവയവങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായത്തിലെ മാന്യോക്തി, വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
