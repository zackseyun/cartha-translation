  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമകേസിന്റെ ശൈലി ഉപയോഗിച്ചു. അടുത്ത വാക്യത്തിൽ ഫലം പറയുന്നതിനാൽ ഈ വാക്യം വ്യവസ്ഥാസൂചകമായ കോമയിൽ അവസാനിക്കുന്നു. മൂലത്തിലെ ‘സഹോദരൻ,’ ‘കൈയിൽനിന്ന്,’ ഗുഹ്യാവയവങ്ങളെ സൂചിപ്പിക്കുന്ന മാന്യോക്തി എന്നിവ സാധ്യമായത്ര നിലനിർത്തി.
