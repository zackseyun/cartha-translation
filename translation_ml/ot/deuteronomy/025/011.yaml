  naturalness: The proposed revision uses more natural Malayalam legal-case phrasing and removes the potentially confusing appositional construction “രണ്ടു പുരുഷന്മാർ—ഒരാളും അവന്റെ സഹോദരനും.”
  terminology: “ഗുഹ്യാവയവങ്ങൾ” is an appropriately dignified modern Malayalam rendering of the Hebrew euphemism. “സഹോദരൻ” is retained with a clarifying note, and “അടിക്കുന്നവൻ” preserves the source’s concrete participial expression.
