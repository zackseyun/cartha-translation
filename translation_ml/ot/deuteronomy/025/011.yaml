    rationale: “രണ്ടു പുരുഷന്മാർ—ഒരാളും അവന്റെ സഹോദരനും” is understandable but less idiomatic than directly rendering the Hebrew pair as “ഒരു പുരുഷനും അവന്റെ സഹോദരനും.”
