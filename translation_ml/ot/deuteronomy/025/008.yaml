  yaml_path: translation/ot/deuteronomy/025/008.yaml
  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: ml
  text: അപ്പോൾ അവന്റെ പട്ടണത്തിലെ മൂപ്പന്മാർ അവനെ വിളിച്ചുവരുത്തി അവനോട് സംസാരിക്കണം. അവൻ തന്റെ നിലപാടിൽ ഉറച്ചുനിന്ന്, “അവളെ സ്വീകരിക്കാൻ[a] എനിക്കു താൽപര്യമില്ല” എന്നു പറഞ്ഞാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭത്തിൽ, “അവളെ വിവാഹം കഴിക്കാൻ” എന്നും അർഥം. ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “അവളെ എടുക്കാൻ” എന്നാണ്; ഒരു സ്ത്രീയെ വിവാഹത്തിൽ സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ
  choice: വിളിപ്പിച്ച്
  rationale: നിയമനടപടിയിലെ തുടർക്രമവും ഔദ്യോഗികമായി ആളെ വരുത്തുന്നതും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: זִקְנֵי עִירוֹ
  choice: അവന്റെ പട്ടണത്തിലെ മൂപ്പന്മാർ
  rationale: ഇത് പ്രാദേശിക സമൂഹത്തിന്റെ അംഗീകൃത നേതാക്കളെ സൂചിപ്പിക്കുന്നു; עִיר എന്നതിന് സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘പട്ടണം’ തെരഞ്ഞെടുത്തു.
- source_word: וְדִבְּרוּ אֵלָיו
  choice: അവനോടു സംസാരിക്കണം
  rationale: മൂപ്പന്മാർ അയാളെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ഔദ്യോഗിക സംഭാഷണം വ്യക്തമാക്കുന്നു.
- source_word: וְעָמַד
  choice: തന്റെ നിലപാടിൽ ഉറച്ചുനിന്ന്
  rationale: അക്ഷരാർഥമായ ‘നിന്നു’ എന്നതിനു പിന്നിലുള്ള, മൂപ്പന്മാരുടെ ഇടപെടലിനുശേഷവും തീരുമാനത്തിൽ ഉറച്ചുനിൽക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֹא חָפַצְתִּי
  choice: എനിക്ക് ഇഷ്ടമില്ല
  rationale: ആഗ്രഹമില്ലായ്മയെയോ മനസ്സില്ലായ്മയെയോ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְקַחְתָּהּ
  choice: അവളെ സ്വീകരിക്കാൻ
  rationale: ‘അവളെ എടുക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ വിവാഹസന്ദർഭം മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു; ‘വിവാഹം കഴിക്കുക’ എന്നു പൂർണമായി വിശദീകരിക്കാതെ മൂലപ്രയോഗത്തിന്റെ വിസ്താരം നിലനിർത്തുന്നു.
