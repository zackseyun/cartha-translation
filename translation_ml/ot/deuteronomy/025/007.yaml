  text: וְ/אִם לֹ֤א יַחְפֹּץ֙ הָ/אִ֔ישׁ לָ/קַ֖חַת אֶת יְבִמְתּ֑/וֹ וְ/עָלְתָה֩ יְבִמְתּ֨/וֹ הַ/שַּׁ֜עְרָ/ה אֶל הַ/זְּקֵנִ֗ים וְ/אָֽמְרָה֙ מֵאֵ֨ין יְבָמִ֜/י לְ/הָקִ֨ים לְ/אָחִ֥י/ו שֵׁם֙ בְּ/יִשְׂרָאֵ֔ל לֹ֥א אָבָ֖ה יַבְּמִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: ml
  text: 'എന്നാൽ ആ മനുഷ്യൻ തന്റെ സഹോദരന്റെ വിധവയെ ഭാര്യയായി സ്വീകരിക്കാൻ ഇഷ്ടപ്പെടുന്നില്ലെങ്കിൽ, ആ വിധവ പട്ടണകവാടത്തിലേക്കു മൂപ്പന്മാരുടെ അടുക്കൽ ചെന്നു പറയണം: ‘എന്റെ ഭർത്താവിന്റെ സഹോദരൻ ഇസ്രായേലിൽ തന്റെ സഹോദരന്റെ പേര് നിലനിർത്താൻ വിസമ്മതിക്കുന്നു[a]; എന്നോടുള്ള ഭർത്താവിന്റെ സഹോദരന്റെ കടമ നിറവേറ്റാൻ അവൻ തയ്യാറല്ല[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘ഇസ്രായേലിൽ തന്റെ സഹോദരനുവേണ്ടി ഒരു പേര് സ്ഥാപിക്കാൻ.’ ഈ പ്രയോഗം മരിച്ച സഹോദരന്റെ കുടുംബവംശവും സമൂഹത്തിലെ സ്ഥാനവും നിലനിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ഇത് ‘എന്നോടുള്ള ഭർത്താവിന്റെ സഹോദരന്റെ കടമ നിർവഹിക്കുക’ എന്ന ആശയം നൽകുന്ന സാങ്കേതിക ക്രിയയാണ്; മരിച്ച സഹോദരന്റെ വിധവയെ വിവാഹംചെയ്ത് ആ ബന്ധത്തിലെ കടമ നിറവേറ്റുന്നതിനെ ഇത് സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: ഇഷ്ടപ്പെടുന്നില്ലെങ്കിൽ
  rationale: חפץ ആഗ്രഹം, താത്പര്യം, സന്നദ്ധത എന്നിവ സൂചിപ്പിക്കുന്നു. നിയമസന്ദർഭത്തിൽ ‘ഇഷ്ടപ്പെടുന്നില്ലെങ്കിൽ’ അതിന്റെ ഇച്ഛാസംബന്ധമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָקַחַת
  choice: ഭാര്യയായി സ്വീകരിക്കാൻ
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘എടുക്കുക/സ്വീകരിക്കുക’ എന്നാണെങ്കിലും ഇവിടെ വിവാഹസന്ദർഭമാണ്. ‘ഭാര്യയായി സ്വീകരിക്കുക’ ആ പ്രവൃത്തിയെ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: יְבִמְתּוֹ
  choice: തന്റെ സഹോദരന്റെ വിധവ
  rationale: ഈ പദം പൊതുവായ ‘സഹോദരഭാര്യ’ എന്നതിലുപരി, മരിച്ച സഹോദരന്റെ വിധവയെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְעָלְתָה ... הַשַּׁעְרָה
  choice: പട്ടണകവാടത്തിൽ ... ചെന്നു
  rationale: കവാടം പ്രാദേശിക ന്യായനിർവഹണത്തിന്റെ പൊതുസ്ഥലമായിരുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘കയറിച്ചെല്ലുക’ എന്ന ഭൗതിക രൂപം നിർബന്ധമായി നിലനിർത്താതെ ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കി.
- source_word: הַזְּקֵנִים
  choice: മൂപ്പന്മാർ
  rationale: പ്രാദേശിക സമൂഹത്തിലെ അംഗീകൃത അധികാരികളെ സൂചിപ്പിക്കുന്ന പതിവും മാന്യവുമായ മലയാളപദം.
- source_word: מֵאֵין
  choice: വിസമ്മതിക്കുന്നു
  rationale: ഔപചാരികമായ നിരാകരണമോ സന്നദ്ധതയില്ലായ്മയോ ഈ രൂപം പ്രകടിപ്പിക്കുന്നു.
- source_word: לְהָקִים ... שֵׁם
  choice: പേര് നിലനിർത്താൻ
  rationale: മരിച്ച സഹോദരന്റെ കുടുംബവംശവും ഇസ്രായേലിലെ സ്ഥാനവും തുടർന്നുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; അതിന്റെ കൂടുതൽ പദാനുപദരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: സ്ഥാനപരവും സമൂഹപരവുമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לֹא אָבָה
  choice: തയ്യാറല്ല
  rationale: אבה സമ്മതമോ സന്നദ്ധതയോ സൂചിപ്പിക്കുന്നു. മുമ്പുള്ള ‘വിസമ്മതിക്കുന്നു’ എന്നതിൽനിന്ന് വേർതിരിച്ച് എബ്രായത്തിലെ രണ്ടു വ്യത്യസ്ത ക്രിയാരൂപങ്ങളും സംരക്ഷിക്കുന്നു.
- source_word: יַבְּמִי
  choice: എന്നോടുള്ള ഭർതൃസഹോദരധർമം നിറവേറ്റാൻ
  rationale: יבם മരിച്ച സഹോദരന്റെ വിധവയെ വിവാഹംചെയ്ത് നിർദിഷ്ട ഉത്തരവാദിത്വം നിറവേറ്റുന്നതിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ക്രിയയാണ്. അപരിചിതമായ പദജാലം ഒഴിവാക്കി നിയമപരമായ ബന്ധവും കടമയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സഹോദരന്റെ വിധവയോടുള്ള വിവാഹബാധ്യതയുടെ സാങ്കേതിക പദപ്രയോഗം
  choice: ‘സഹോദരന്റെ വിധവ’, ‘ഭർത്താവിന്റെ സഹോദരൻ’, ‘ഭർതൃസഹോദരധർമം നിറവേറ്റുക’ എന്നീ വ്യക്തമായ ബന്ധ-നിയമ പദങ്ങൾ ഉപയോഗിക്കുക
  alternative: ‘ലെവിറേറ്റ് വിവാഹം’ എന്ന സാങ്കേതിക പദം നേരിട്ട് ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ബന്ധം വ്യക്തമാക്കാത്ത പൊതുവായ ‘മരുമകൻ/സഹോദരഭാര്യ’ തുടങ്ങിയ പദങ്ങൾ ഉപയോഗിക്കുക
  rationale: വാക്യം ഒരു നിയമക്രമത്തെ വിവരിക്കുന്നു. സാങ്കേതിക സ്ഥാപനത്തിന്റെ അർഥം വ്യക്തമാക്കുമ്പോഴും മൂലപാഠത്തിൽ ഇല്ലാത്ത മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർക്കാതെ ബന്ധവും ബാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമവിവരണശൈലി. ‘പട്ടണകവാടം’, ‘മൂപ്പന്മാർ’ എന്നിവ പുരാതന പൊതുന്യായസന്ദർഭം വ്യക്തമാക്കുന്നു. അപരിചിതമായ അക്കാദമിക പദമായ ‘ലെവിറേറ്റ്’ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി; യഥാർഥ സാങ്കേതിക അർഥം വിവർത്തനത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
