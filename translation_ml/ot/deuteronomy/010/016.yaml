source:
  edition: WLC
  text: וּ/מַלְתֶּ֕ם אֵ֖ת עָרְלַ֣ת לְבַבְ/כֶ֑ם וְ/עָ֨רְפְּ/כֶ֔ם לֹ֥א תַקְשׁ֖וּ עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/016.yaml
  text: So circumcise the foreskin of your heart[c][b][a], and do not stiffen your neck any longer.
translation:
  language: ml
  text: അതുകൊണ്ട്[a] നിങ്ങളുടെ ഹൃദയത്തിന്റെ അഗ്രചർമ്മത്തെ പരിച്ഛേദനം ചെയ്യുക[b]; ഇനി നിങ്ങളുടെ കഴുത്ത് കടുപ്പിക്കരുത്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ഹൃദയത്തിന്റെ അഗ്രചർമ്മത്തെ പരിച്ഛേദനം ചെയ്യുക.” ഇവിടെ സംയോജകത്തെ വെറും ബന്ധസൂചകമായി വായിക്കാം; എന്നാൽ സന്ദർഭം “അതുകൊണ്ട്” എന്ന നിഗമനാർഥത്തെയും പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായം രൂപകത്തെ അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു: “നിങ്ങളുടെ ഹൃദയത്തിന്റെ അഗ്രചർമ്മം.” ദൈവത്തോടുള്ള ആന്തരിക എതിർപ്പ് നീക്കുന്നതിന്റെ ചിത്രമാണിത്.'
    reason: cultural_note
  - marker: c
    text: അഥവാ, “ഇനി നിങ്ങളുടെ കഴുത്ത് കഠിനമാക്കരുത്” അല്ലെങ്കിൽ “ഇനി ദുശ്ശാഠ്യമുള്ളവരായിരിക്കരുത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: അതുകൊണ്ട് … പരിച്ഛേദനം ചെയ്യുക
  rationale: മുൻസന്ദർഭത്തിലെ ആഹ്വാനവുമായി ബന്ധിപ്പിക്കുന്ന וּ־ എന്ന സംയോജകത്തിന് ഇവിടെ നിഗമനസൂചകമായ അർഥം ഉണ്ടാകാം. പൂർത്തിക്രിയാരൂപം ഉപദേശാത്മക കല്പനയായി പ്രവർത്തിക്കുന്നതിനാൽ മലയാളത്തിൽ നേരിട്ടുള്ള കല്പനാരൂപം ഉപയോഗിച്ചു.
- source_word: עָרְלַת לְבַבְכֶם
  choice: നിങ്ങളുടെ ഹൃദയത്തിന്റെ അഗ്രചർമം
  rationale: ‘ഹൃദയത്തിന്റെ അഗ്രചർമം’ എന്ന എബ്രായത്തിലെ മൂർത്തമായ രൂപകം നിലനിർത്തുന്നു; അതിനെ ‘ഹൃദയം ശുദ്ധീകരിക്കുക’ എന്ന വ്യാഖ്യാനാത്മക പുനരാഖ്യാനമാക്കി ചുരുക്കുന്നില്ല.
- source_word: לְבַבְכֶם
  choice: നിങ്ങളുടെ ഹൃദയം
  rationale: לֵבָב മനസ്സ്, ഇച്ഛ, ഗ്രഹണം എന്നിവ ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിയെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ പരിച്ഛേദനരൂപകത്തിൽ ‘ഹൃദയം’ സ്വാഭാവികവും പരമ്പരാഗതവുമായ സമാനപദമാണ്.
- source_word: וְעָרְפְּכֶם
  choice: നിങ്ങളുടെ കഴുത്ത്
  rationale: עֹרֶף കഴുത്തിനെയോ പിരടിയെയോ സൂചിപ്പിക്കുന്നു. കടുപ്പത്തിന്റെ എബ്രായ ശൈലി നേരിട്ട് നിലനിർത്താൻ ‘കഴുത്ത്’ ഉപയോഗിച്ചു.
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: ഇനി … കടുപ്പിക്കരുത്
  rationale: הקשׁה എന്ന ക്രിയയുടെ ‘കടുപ്പിക്കുക’ എന്ന അർഥവും עוֹד നിഷേധവാക്യത്തിൽ നൽകുന്ന ‘ഇനി/മേലാൽ’ എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആന്തരിക പരിച്ഛേദനത്തിന്റെ ഉടമ്പടിരൂപകം
  choice: ‘നിങ്ങളുടെ ഹൃദയത്തിന്റെ അഗ്രചർമം പരിച്ഛേദനം ചെയ്യുക’ എന്ന രൂപകം വ്യക്തമായി നിലനിർത്തി.
  alternative: ‘നിങ്ങളുടെ ഹൃദയം ശുദ്ധീകരിക്കുക’ അല്ലെങ്കിൽ ‘ഹൃദയത്തിലെ ദുശ്ശാഠ്യം നീക്കുക’.
  rationale: വാക്യം ബാഹ്യമായ ഉടമ്പടിചിഹ്നത്തെ ആന്തരികമായ അനുസരണയുമായി ബന്ധിപ്പിക്കുന്നു. രൂപകം നിലനിർത്തുന്നത് ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷവും ആഹ്വാനവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. അപരിചിതമായ രൂപകം വിശദീകരണത്തിലൂടെ പകരംവയ്ക്കാതെ മുഖ്യവാക്യത്തിൽ നിലനിർത്തി; അതിന്റെ അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകി.
