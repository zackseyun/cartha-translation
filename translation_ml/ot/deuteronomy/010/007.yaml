  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. യാത്രാവിവരണത്തിന്റെ ചുരുക്കവും സ്ഥലനാമങ്ങളുടെ എബ്രായസ്വഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
