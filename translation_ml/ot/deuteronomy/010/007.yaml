source:
  edition: WLC
  text: מִ/שָּׁ֥ם נָסְע֖וּ הַ/גֻּדְגֹּ֑דָ/ה וּ/מִן הַ/גֻּדְגֹּ֣דָ/ה יָטְבָ֔תָה אֶ֖רֶץ נַ֥חֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/007.yaml
  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: ml
  text: അവിടെനിന്ന് അവർ ഗുദ്ഗോദായിലേക്ക് പുറപ്പെട്ടു; ഗുദ്ഗോദായിൽനിന്ന് നീരൊഴുക്കുകളുള്ള ദേശമായ യൊത്ബാഥായിലേക്ക് യാത്ര ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ജലവാഹിനികളുള്ള ദേശം” അഥവാ “ജലവാഹിനികളായ വാദികളുള്ള ദേശം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ഒഴുകുന്ന ജലപാതകളെയോ അരുവികളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: മുൻപ് പറഞ്ഞ സ്ഥലത്തുനിന്നുള്ള പുറപ്പാടിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נָסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: മരുഭൂയാത്രാ സന്ദർഭത്തിൽ പാളയം പിരിച്ച് യാത്ര പുറപ്പെടുക എന്ന נסע എന്ന ക്രിയയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: הַגֻּדְגֹּדָה
  choice: ഗുദ്ഗോദയിലേക്ക്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്യുന്നു; ദിശാസൂചകമായ -ה മലയാളത്തിലെ ‘-യിലേക്ക്’ എന്ന രൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וּמִן הַגֻּדְגֹּדָה
  choice: ഗുദ്ഗോദയിൽനിന്ന്
  rationale: യാത്രാവിവരണത്തിലെ അടുത്ത പുറപ്പാടിനെ ലളിതമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: יָטְבָתָה
  choice: യൊത്ബാഥയിലേക്ക്
  rationale: സ്ഥലനാമത്തെ എബ്രായരൂപത്തിൽനിന്ന് ലിപ്യന്തരണം ചെയ്യുകയും ദിശാസൂചകമായ -ה വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: നീരൊഴുക്കുകളുള്ള ദേശം
  rationale: נַחַל എന്ന പദത്തിനുള്ള അരുവി, ജലവാഹിനി, വാദി എന്നീ അർഥസാധ്യതകൾ പൂർണമായി ചുരുക്കാതെ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘നീരൊഴുക്ക്’ തിരഞ്ഞെടുക്കുന്നു.
