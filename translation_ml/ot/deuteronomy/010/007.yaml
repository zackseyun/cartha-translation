  terminology: ‘നീരൊഴുക്കുകളുള്ള ദേശം’ is a suitable accessible rendering of נַחֲלֵי מָיִם. The footnote should explain that the term can denote streams, watercourses, or wadis, without treating ‘wadi’ as an ordinary Malayalam word.
