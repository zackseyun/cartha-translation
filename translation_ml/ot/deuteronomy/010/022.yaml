reference: Deuteronomy 10:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/שִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖י/ךָ מִצְרָ֑יְמָ/הּ וְ/עַתָּ֗ה שָֽׂמְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: ml
  text: എഴുപത് പേരുമായി നിന്റെ പിതാക്കന്മാർ ഈജിപ്തിലേക്കു ഇറങ്ങിപ്പോയി[a][b]; എന്നാൽ ഇപ്പോൾ നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ അനേകരാക്കിയിരിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘എഴുപത് ആത്മാക്കൾ’; ഇവിടെ എബ്രായ പദം ആളുകളെ എണ്ണുന്നതിനുള്ള പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ പൂർവികർ’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായ പദം അക്ഷരാർഥത്തിൽ ‘നിന്റെ പിതാക്കന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ’ അഥവാ ‘ആകാശത്തിലെ നക്ഷത്രങ്ങൾപോലെ അസംഖ്യം’ എന്നും പറയാം; ഉദ്ദേശ്യം സംഖ്യാപരമായ സമൃദ്ധിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: എഴുപതു പേരായിട്ട്
  rationale: നֶפֶשׁ ഇവിടെ ആളുകളെ എണ്ണുന്ന പ്രയോഗമാണ്. അക്ഷരാർഥമായ ‘ആത്മാക്കൾ’ ആധുനിക മലയാളത്തിൽ തെറ്റിദ്ധരിപ്പിക്കാവുന്നതിനാൽ സ്വാഭാവികമായി ‘പേർ’ എന്നു നൽകി.
- source_word: יָרְדוּ
  choice: പോയത്
  rationale: יָרַד എന്നതിന് അക്ഷരാർഥത്തിൽ ‘താഴേക്കു പോകുക’ എന്നാണെങ്കിലും, ഈജിപ്തിലേക്കുള്ള യാത്രയെ മലയാളത്തിൽ സ്വാഭാവികമായി പറയാൻ ‘പോയത്’ മതിയാകുന്നു; ‘ഇറങ്ങിപ്പോയി’ എന്നത് അനാവശ്യമായ ഭൗമദിശാഭാരം നൽകാം.
- source_word: אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാർ
  rationale: ഹീബ്രു പദത്തിന്റെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയാണ്.
- source_word: מִצְרָיְמָה
  choice: ഈജിപ്തിലേക്കു
  rationale: ദിശാസൂചകമായ -ה ചലനം ഈജിപ്തിലേക്കാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וְעַתָּה
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: ആദ്യത്തെ ചെറിയ സംഖ്യയും ഇപ്പോഴത്തെ വർധനയും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഹീബ്രുവിലെ ബന്ധവും കാലസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: שָׂמְךָ
  choice: നിന്നെ ... പെരുപ്പിച്ചിരിക്കുന്നു
  rationale: שׂים അക്ഷരാർഥത്തിൽ ‘വയ്ക്കുക/ആക്കുക’ എന്നാണെങ്കിലും, לָרֹב സഹിതം ഇവിടെ ജനസംഖ്യ വർധിപ്പിച്ചതാണ് അർഥം. ‘പെരുപ്പിച്ചിരിക്കുന്നു’ ഫലാവസ്ഥ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ അംഗീകൃത സമീപലിപ്യന്തരണമായി നൽകി.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം കൃത്യമായി നിലനിർത്തുകയും മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם ... לָרֹב
  choice: ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ പെരുപ്പിച്ചിരിക്കുന്നു
  rationale: ഉപമയും സംഖ്യാപരമായ സമൃദ്ധിയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു. שָׁמַיִם രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ഈ അർഥത്തിൽ സ്വാഭാവിക മലയാളം ‘ആകാശം’ ആണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ആധുനിക പണ്ഡിതസമ്മത ഉച്ചാരണത്തോട് അടുത്ത മലയാളലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: אֲבֹתֶיךָ എന്ന ലിംഗസൂചക പൂർവികപദം
  choice: നിന്റെ പിതാക്കന്മാർ
  alternative: നിന്റെ പൂർവികർ
  rationale: ഹീബ്രുവിലെ വ്യക്തമായ പുല്ലിംഗ പദം നിലനിർത്തുന്നു; വിശാലമായ സന്ദർഭാർത്ഥം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: നക്ഷത്രോപമയിലെ സംഖ്യാപരമായ അർഥം
  choice: നക്ഷത്രങ്ങളെപ്പോലെ പെരുപ്പിച്ചിരിക്കുന്നു
  alternative: നക്ഷത്രങ്ങളെപ്പോലെ ആക്കിയിരിക്കുന്നു
  rationale: לָרֹב ഉപമയുടെ ഉദ്ദേശ്യം എണ്ണത്തിലെ വർധനയാണെന്ന് സൂചിപ്പിക്കുന്നു; അതേസമയം നക്ഷത്രങ്ങളുടെ ചിത്രം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പിതാക്കന്മാർ’, ‘പെരുപ്പിച്ചിരിക്കുന്നു’ എന്നിവ മൂലപാഠത്തിന്റെ രൂപവും ആശയവും നിലനിർത്തുമ്പോൾ സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്നവയാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
