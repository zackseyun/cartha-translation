revisions:
- from: എഴുപതു പേരായിട്ടാണ് നിന്റെ പിതാക്കന്മാർ ഈജിപ്തിലേക്കു പോയത്[a][b]; എന്നാൽ ഇപ്പോൾ നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ പെരുപ്പിച്ചിരിക്കുന്നു[c].
  to: എഴുപത് പേരുമായി നിന്റെ പിതാക്കന്മാർ ഈജിപ്തിലേക്കു ഇറങ്ങിപ്പോയി[a][b]; എന്നാൽ ഇപ്പോൾ നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ അനേകരാക്കിയിരിക്കുന്നു[c].
