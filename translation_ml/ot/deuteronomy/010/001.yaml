revisions:
- from: 'ആ സമയത്ത് യഹ്‌വെ എന്നോടു പറഞ്ഞു: “ആദ്യത്തേതുപോലെയുള്ള രണ്ടു കൽപ്പലകകൾ നിനക്കായി വെട്ടിയുണ്ടാക്കുക. പിന്നെ മലമുകളിൽ എന്റെ അടുക്കൽ കയറിവരിക. നിനക്കായി ഒരു മരപ്പെട്ടകവും ഉണ്ടാക്കുക.”'
  to: 'ആ സമയത്ത് യഹ്‌വെ എന്നോടു പറഞ്ഞു: “ആദ്യത്തേതുപോലെയുള്ള രണ്ടു കൽപ്പലകകൾ നിനക്കായി വെട്ടിയുണ്ടാക്കുക. പിന്നെ മലയിലേക്ക് എന്റെ അടുക്കൽ കയറിവരിക. നിനക്കായി മരംകൊണ്ടുള്ള ഒരു പെട്ടകവും ഉണ്ടാക്കുക.”'
  rationale: 'The revision corrects the mountain phrase to express the Hebrew directional movement toward the mountain rather than location upon it. It also uses a more natural explicit Malayalam expression for a wooden ark. No footnote is needed: the supplied English footnote anchors are misplaced and do not identify a textual ambiguity requiring a Malayalam note.'
