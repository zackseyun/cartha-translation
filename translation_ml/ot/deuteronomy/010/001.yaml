id: DEU.10.1
reference: Deuteronomy 10:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בָּ/עֵ֨ת הַ/הִ֜וא אָמַ֧ר יְהוָ֣ה אֵלַ֗/י פְּסָל לְ/ךָ֞ שְׁנֵֽי לֻוחֹ֤ת אֲבָנִים֙ כָּ/רִ֣אשֹׁנִ֔ים וַ/עֲלֵ֥ה אֵלַ֖/י הָ/הָ֑רָ/ה וְ/עָשִׂ֥יתָ לְּ/ךָ֖ אֲר֥וֹן עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: ml
  text: 'ആ സമയത്ത് യഹ്‌വെ എന്നോടു പറഞ്ഞു: “ആദ്യത്തേതുപോലെയുള്ള രണ്ടു കൽപ്പലകകൾ നിനക്കായി വെട്ടിയുണ്ടാക്കുക. പിന്നെ മലയിലേക്ക് എന്റെ അടുക്കൽ കയറിവരിക. നിനക്കായി മരംകൊണ്ടുള്ള ഒരു പെട്ടകവും ഉണ്ടാക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: ആ സമയത്ത്
  rationale: കഥയിലെ സമയസന്ദർഭം ചൂണ്ടിക്കാണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: פְּסָל לְךָ
  choice: നിനക്കായി വെട്ടിയുണ്ടാക്കുക
  rationale: കല്ല് വെട്ടി രൂപപ്പെടുത്തുക എന്ന פסל എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥവും לְךָ എന്നതിന്റെ ഗുണഭോക്തൃഭാവവും നിലനിർത്തുന്നു.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים כָּרִאשֹׁנִים
  choice: ആദ്യത്തേതുപോലെയുള്ള രണ്ടു കൽപ്പലകകൾ
  rationale: മുമ്പുണ്ടായിരുന്ന രണ്ടു നിയമപ്പലകകളോടുള്ള താരതമ്യം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: പിന്നെ മലമുകളിൽ എന്റെ അടുക്കൽ കയറിവരിക
  rationale: ദിശാസൂചകമായ הָהָרָה, ഉയരത്തിലേക്കുള്ള ചലനം, אֵלַי എന്ന ‘എന്റെ അടുക്കൽ’ എന്ന ബന്ധം എന്നിവ വ്യക്തമാക്കുന്നു; ‘പിന്നെ’ വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ
  choice: നിനക്കായി ഒരു മരപ്പെട്ടകവും ഉണ്ടാക്കുക
  rationale: അֲרוֹן എന്നത് നിയമപ്പലകകൾ സൂക്ഷിക്കുന്ന വിശുദ്ധ പെട്ടകത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പെട്ടകം’ എന്നും, עֵץ സംയുക്തവിശേഷണമായി ‘മരപ്പെട്ടകം’ എന്നും പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു ബിരുദനാമമാക്കി മാറ്റാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: אֲרוֹן എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: പെട്ടകം
  alternative: പെട്ടി
  rationale: ഇവിടെ സാധാരണ മരപ്പെട്ടിയല്ല, നിയമപ്പലകകൾ സൂക്ഷിക്കാനുള്ള വിശുദ്ധ പെട്ടകമാണ് ഉദ്ദേശിക്കുന്നത്; എങ്കിലും മൂലപാഠത്തിൽ ഈ വാക്യത്തിൽ ‘നിയമപെട്ടകം’ എന്ന വിപുലീകരണം ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായ ആജ്ഞാരൂപങ്ങളും സംഭവക്രമവും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ലുള്ള [a], [b] അടിക്കുറിപ്പുകൾ അവയുടെ അടയാളസ്ഥലങ്ങളുമായി പൊരുത്തപ്പെടാത്തതും യഥാർഥ പാഠവ്യത്യാസമോ നിർണായകമായ അർഥസന്ദിഗ്ധതയോ രേഖപ്പെടുത്താത്തതുമായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
