  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: ml
  text: അവൻ പലകകളിൽ, ആദ്യത്തെ എഴുത്തുപോലെതന്നെ, പത്തു വചനങ്ങൾ[a] എഴുതി; സമൂഹം കൂടിയ ദിവസം, മലയിൽ തീയുടെ നടുവിൽനിന്ന് യഹ്‌വെ നിങ്ങളോടു സംസാരിച്ച വചനങ്ങളായിരുന്നു അവ; യഹ്‌വെ അവ എനിക്കു തന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: “പത്തു കല്പനകൾ.” എബ്രായത്തിൽ: “പത്തു വാക്കുകൾ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: അവിടുന്ന് ... എഴുതി
  rationale: כתב എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘എഴുതുക’ നിലനിർത്തുന്നു. കൽപ്പലകകളിൽ കൊത്തിയെന്ന ആശയം സന്ദർഭത്തിൽ സാധ്യമാണെങ്കിലും ഈ വാക്യത്തിൽ അത് പ്രത്യേകം വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: הַלֻּחֹת
  choice: പലകകളിൽ
  rationale: നിയമം എഴുതപ്പെട്ട പലകകളെയാണ് לֻחֹת സൂചിപ്പിക്കുന്നത്. ഈ വാക്യത്തിൽ ‘കൽ’ എന്നു വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: ആദ്യത്തെ എഴുത്തുപോലെതന്നെ
  rationale: כ എന്ന താരതമ്യഘടകവും מִכְתָּב എന്നതിലെ ‘എഴുത്ത്’ എന്ന ആശയവും നിലനിർത്തുന്നു; ‘തന്നെ’ ആദ്യ പലകകളിലെ എഴുത്തുമായുള്ള സാമ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: പത്തു വചനങ്ങൾ
  rationale: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘പത്തു വാക്കുകൾ/വചനങ്ങൾ’ എന്നാണ്. മലയാളത്തിൽ ദൈവികമായി അരുളപ്പെട്ട ഉള്ളടക്കത്തെ സൂചിപ്പിക്കാൻ ‘വചനങ്ങൾ’ സ്വാഭാവികവും മാന്യവുമാണ്; പരമ്പരാഗതമായ ‘പത്തു കല്പനകൾ’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: യഹ്‌വെ നിങ്ങളോടു സംസാരിച്ച വചനങ്ങളായിരുന്നു അവ
  rationale: ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ട്, എഴുതപ്പെട്ട പത്തു വചനങ്ങളുടെ ഉള്ളടക്കം യഹ്‌വെ മുമ്പ് സംസാരിച്ചതാണെന്ന ക്രമം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בָּהָר
  choice: മലയിൽ
  rationale: വെളിപ്പാട് ഉണ്ടായ സ്ഥലം ലളിതമായും നേരിട്ടും നൽകുന്നു.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: തീയുടെ നടുവിൽനിന്ന്
  rationale: ദൈവശബ്ദം തീയുടെ ഉള്ളിൽനിന്ന് വന്നുവെന്ന എബ്രായ ദൃശ്യാവിഷ്കാരം നിലനിർത്തുന്നു.
- source_word: בְּיוֹם הַקָּהָל
  choice: നിങ്ങൾ സമ്മേളിച്ച ദിവസം
  rationale: ‘സമ്മേളനത്തിന്റെ ദിവസം’ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ഇവിടെ അഭിസംബോധന ചെയ്യപ്പെടുന്ന ഇസ്രായേൽജനമാണ് കൂടിവന്ന സമൂഹമെന്നത് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּתְּנֵם יְהוָה אֵלָי
  choice: പിന്നെ യഹ്‌വെ ആ പലകകൾ എനിക്കു തന്നു
  rationale: ബഹുവചന പ്രത്യയം മലയാളത്തിൽ അവ്യക്തമാകാതിരിക്കാൻ അതിന്റെ സന്ദർഭപരമായ സൂചകം ‘ആ പലകകൾ’ എന്നു വ്യക്തമാക്കുന്നു; נתן എന്നതിന് ലളിതമായ ‘തന്നു’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ നിലനിർത്തുന്നു; പ്രത്യേക മതവിഭാഗത്തിന്റെ പതിവിലേക്ക് ചായാതെ സ്രോതസ്സിനോടുള്ള അടുപ്പം സംരക്ഷിക്കുന്നു.
- issue: עֲשֶׂרֶת הַדְּבָרִים എന്ന ഉടമ്പടിപദത്തിന്റെ പരിഭാഷ
  choice: പത്തു വചനങ്ങൾ
  alternative: പത്തു കല്പനകൾ
  rationale: മൂലപദമായ דְּבָרִים ‘വാക്കുകൾ/വചനങ്ങൾ’ എന്നാണ്; അതിനാൽ പ്രധാനപാഠത്തിൽ അതിന്റെ രൂപം നിലനിർത്തുകയും പരമ്പരാഗത വ്യാഖ്യാനപരമായ പേര് അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: וַיִּכְתֹּב എന്ന ക്രിയയുടെ കർത്താവ്
  choice: അവിടുന്ന്
  alternative: യഹ്‌വെ
  rationale: എബ്രായത്തിൽ കർത്താവ് ‘അവൻ’ എന്ന ക്രിയാരൂപത്തിൽ മാത്രം സൂചിപ്പിക്കപ്പെടുന്നു; അടുത്ത സന്ദർഭം അത് യഹ്‌വെയാണെന്ന് വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ മാന്യമായ സർവനാമം ഉപയോഗിച്ച് മൂലത്തിലെ പരാമർശരീതി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ദീർഘമായ എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; ആശയക്രമം നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘പത്തു വചനങ്ങൾ’ എന്ന പ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
