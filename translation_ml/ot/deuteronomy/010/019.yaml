id: DEU.10.19
reference: Deuteronomy 10:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲהַבְתֶּ֖ם אֶת הַ/גֵּ֑ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/019.yaml
  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
translation:
  language: ml
  text: അതുകൊണ്ട് നിങ്ങൾ പരദേശിയെ[a] സ്നേഹിക്കണം; കാരണം നിങ്ങൾ ഈജിപ്തുദേശത്ത് പരദേശികളായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിദേശി,’ ‘താമസിക്കുന്ന അന്യദേശക്കാരൻ,’ അല്ലെങ്കിൽ ‘അന്യദേശക്കാരൻ.’ എബ്രായത്തിലെ ഗേർ (גֵּר) എന്ന പദം ഇസ്രായേല്യരുടെ ഇടയിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  choice: അതിനാൽ … സ്നേഹിക്കണം
  rationale: אהב എന്നത് ‘സ്നേഹിക്കുക’ എന്നാണ്. മുൻവാക്യത്തിൽ ദൈവം പരദേശിയെ സ്നേഹിക്കുന്നു എന്നു പറഞ്ഞതിന്റെ അടിസ്ഥാനത്തിലുള്ള കൽപ്പനയായതിനാൽ, വാവിന്റെ ബന്ധവും കൽപ്പനയുടെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ ‘അതിനാൽ … സ്നേഹിക്കണം’ എന്നു പ്രകടിപ്പിച്ചു.
- source_word: הַ/גֵּר
  choice: പരദേശിയെ
  rationale: גֵּר എന്നത് ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുന്ന, സ്വദേശിയല്ലാത്തതും സാമൂഹികമായി ദുർബലവുമായ ഒരാളെ സൂചിപ്പിക്കുന്നു; വെറും വഴിപോക്കനെ അല്ല. ‘പരദേശി’ ഈ പുറംനാട്ടുകാരൻ/താമസക്കാരൻ എന്ന അർഥവ്യാപ്തി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: കൽപ്പനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നതിനാൽ, ആധുനിക മലയാളത്തിലെ വ്യക്തമായ കാരണസൂചകമായ ‘കാരണം’ ഉപയോഗിച്ചു.
- source_word: גֵרִים
  choice: പരദേശികളായിരുന്നു
  rationale: ഏകവചനത്തിലെ גֵּר എന്ന പദവുമായി പദബന്ധം നിലനിർത്താൻ അതേ മലയാളപദത്തിന്റെ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: הֱיִיתֶם
  choice: ആയിരുന്നു
  rationale: 'היה ഇവിടെ ഭൂതകാലത്തിലെ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു: ഇസ്രായേല്യർ ഈജിപ്തിൽ പരദേശികളായി കഴിഞ്ഞിരുന്നു.'
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്ത്
  rationale: אֶרֶץ (‘ദേശം’) എന്ന ഘടകം ഒഴിവാക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ പശ്ചാത്തലത്തിലെ גֵּר എന്ന സാമൂഹിക തിരിച്ചറിയൽ
  choice: പരദേശി
  alternative: വിദേശി; അന്യദേശക്കാരൻ; വന്നു പാർക്കുന്നവൻ
  rationale: ഇസ്രായേലിന്റെ സ്വന്തം ഈജിപ്താനുഭവത്തെ അടിസ്ഥാനമാക്കി അവരുടെ ഇടയിൽ താമസിക്കുന്ന പുറംനാട്ടുകാരനെ സ്നേഹിക്കണമെന്ന ധാർമിക ബാധ്യതയാണ് വാക്യം ഉന്നയിക്കുന്നത്. ‘പരദേശി’ പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക നിയമവിഭാഗങ്ങൾ അടിച്ചേൽപ്പിക്കാതെയും വെറും അപരിചിതൻ എന്ന അർഥത്തിലേക്ക് ചുരുക്കാതെയും മൂലപദത്തിന്റെ സാമൂഹികവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സ്നേഹിക്കണം’ കൽപ്പനയുടെ ശക്തി സ്വാഭാവികമായി നൽകുന്നു; ‘പരദേശി’ എന്ന ആവർത്തനം എബ്രായത്തിലെ ഏകവചന-ബഹുവചന പദബന്ധം നിലനിർത്തുന്നു.
