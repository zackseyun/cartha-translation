source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל נָֽסְע֛וּ מִ/בְּאֵרֹ֥ת בְּנֵי יַעֲקָ֖ן מוֹסֵרָ֑ה שָׁ֣ם מֵ֤ת אַהֲרֹן֙ וַ/יִּקָּבֵ֣ר שָׁ֔ם וַ/יְכַהֵ֛ן אֶלְעָזָ֥ר בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ ബെയേരോത്ത്-ബെനേ-യാക്കാനിൽനിന്ന് മോസേരയിലേക്കു യാത്രയായി[a]. അവിടെ അഹരോൻ മരിച്ചു; അവിടെത്തന്നെ അടക്കപ്പെട്ടു. അവന്റെ മകൻ എലെയാസാർ അവനു പകരം പുരോഹിതനായി ശുശ്രൂഷിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബെയേരോത്ത്-ബെനേ-യാക്കാൻ’ എന്നത് അക്ഷരാർഥത്തിൽ ‘യാക്കാന്റെ മക്കളുടെ കിണറുകൾ’ എന്നു മനസ്സിലാക്കാം; ഇവിടെ സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവന്റെ ശേഷം പുരോഹിതനായി ശുശ്രൂഷിച്ചു.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവന്റെ സ്ഥാനത്ത്’ എന്നാണ്; അത് പിൻഗാമിത്വത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ ദേശീയ-വംശാവലി പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ നിലനിർത്തുന്നു. വാക്യാരംഭത്തിലെ וְ ഇവിടെ കഥയിലെ ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകമായി ‘ഇപ്പോൾ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: נָסְעוּ
  choice: യാത്രയായി
  rationale: נסע പാളയം പൊളിച്ച് അടുത്ത സ്ഥലത്തേക്കു പുറപ്പെടുന്ന യാത്രയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: מִ/בְּאֵרֹת בְּנֵי יַעֲקָן
  choice: ബെയേരോത്ത്-ബെനേ-യാക്കാനിൽനിന്ന്
  rationale: മരുഭൂമിയിലെ സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു; מִן എന്ന ഉപസർഗം ‘-ൽനിന്ന്’ എന്നു നൽകി.
- source_word: מוֹסֵרָה
  choice: മോസേരയിലേക്ക്
  rationale: യാത്രാവിവരണത്തിലെ ഘടന ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ എബ്രായത്തിൽ പ്രത്യേകം മുൻപ്രത്യയം ഇല്ലെങ്കിലും മലയാളത്തിൽ ‘-യിലേക്ക്’ ചേർത്തു.
- source_word: שָׁם
  choice: അവിടെ / അവിടെത്തന്നെ
  rationale: എബ്രായത്തിലെ രണ്ടുതവണയുള്ള സ്ഥലസൂചന നിലനിർത്തി; രണ്ടാം പ്രയോഗത്തിലെ ആവർത്തന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ‘അവിടെത്തന്നെ’ എന്നു നൽകി.
- source_word: וַ/יִּקָּבֵר
  choice: അടക്കപ്പെട്ടു
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണി അർഥം നിലനിർത്തുന്നു; ആരാണ് അടക്കിയതെന്ന് മൂലപാഠം പറയാത്തതിനാൽ കർത്താവിനെ ചേർത്തിട്ടില്ല.
- source_word: וַ/יְכַהֵן
  choice: പുരോഹിതനായി ശുശ്രൂഷിച്ചു
  rationale: כהן എന്ന ക്രിയ പുരോഹിതനായി പ്രവർത്തിക്കുകയോ സേവിക്കുകയോ ചെയ്യുന്നതാണ്; വെറും സ്ഥാനാരോഹണം മാത്രമായി ചുരുക്കാതെ പ്രവർത്തനാർഥം നൽകുന്നു.
- source_word: אֶלְעָזָר בְּנוֹ תַּחְתָּיו
  choice: അവന്റെ മകൻ എലെയാസർ അവനു പകരം
  rationale: תחתיו എന്നത് അക്ഷരാർഥത്തിൽ ‘അവന്റെ സ്ഥാനത്ത്/അവനു പകരം’ എന്നതും ഇവിടെ പുരോഹിതപദവിയിലെ പിൻഗാമിത്വം സൂചിപ്പിക്കുന്നതുമാണ്.
theological_decisions:
- issue: അഹരോന്റെ മരണശേഷമുള്ള എലെയാസറിന്റെ പുരോഹിതശുശ്രൂഷയുടെ സ്വഭാവം
  choice: ‘അവനു പകരം പുരോഹിതനായി ശുശ്രൂഷിച്ചു’
  alternative: ‘അവന്റെ ശേഷം പുരോഹിതനായി ശുശ്രൂഷിച്ചു’
  rationale: תחתיו എന്ന പദത്തിന്റെ സ്ഥാനപൂരക അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; കാലക്രമത്തിലുള്ള പിൻഗാമിത്വം എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു, പ്രത്യേക ദൈവശാസ്ത്ര വ്യവസ്ഥ ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സ്ഥലനാമങ്ങൾ പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തു. എബ്രായത്തിലെ സ്ഥലസൂചനയുടെ ആവർത്തനവും കർമണിപ്രയോഗവും പുരോഹിതശുശ്രൂഷയുടെ പ്രവർത്തനാർഥവും നിലനിർത്തി.
