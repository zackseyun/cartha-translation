source:
  edition: WLC
  text: וָ/אַ֤עַשׂ אֲרוֹן֙ עֲצֵ֣י שִׁטִּ֔ים וָ/אֶפְסֹ֛ל שְׁנֵי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וָ/אַ֣עַל הָ/הָ֔רָ/ה וּ/שְׁנֵ֥י הַ/לֻּחֹ֖ת בְּ/יָדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: ml
  text: അങ്ങനെ ഞാൻ അക്കേഷ്യ മരംകൊണ്ട് ഒരു പെട്ടകം ഉണ്ടാക്കി; ആദ്യത്തെ പലകകൾപോലെ രണ്ടു കൽപ്പലകകൾ വെട്ടിയുണ്ടാക്കി[a]. ആ രണ്ടു പലകകളും കൈയിൽ പിടിച്ചുകൊണ്ട് ഞാൻ മല കയറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആദ്യത്തെ പലകകൾപോലെ രണ്ടു കൽപ്പലകകൾ ചെത്തിയുണ്ടാക്കി.”
    reason: פסל എന്ന ക്രിയയ്ക്ക് കല്ല് വെട്ടി അല്ലെങ്കിൽ ചെത്തി രൂപപ്പെടുത്തുക എന്ന അർഥമുണ്ട്; ‘ചെത്തിയുണ്ടാക്കി’ എന്നത് സാധുവായ പദപരമായ ബദലാണ്.
lexical_decisions:
- source_word: אֲרוֹן
  choice: പെട്ടകം
  rationale: സാധാരണ പെട്ടിയെന്നതിലുപരി ഉടമ്പടിയുടെ പലകകൾ സൂക്ഷിക്കുന്ന വിശുദ്ധ പാത്രത്തെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥാപിതമായ പദം.
- source_word: עֲצֵי שִׁטִּים
  choice: അക്കേഷ്യമരം
  rationale: മരയിനത്തെ വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക ആധുനിക മലയാള പ്രയോഗം.
- source_word: וָאֶפְסֹל
  choice: വെട്ടിയുണ്ടാക്കി
  rationale: פסל എന്ന ക്രിയ ഇവിടെ കല്ല് വെട്ടി രൂപപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; പ്രവർത്തനവും ഫലവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֻחֹת אֲבָנִים
  choice: കൽപ്പലകകൾ
  rationale: കല്ലുകൊണ്ടുള്ള പലകകൾ എന്ന ഭൗതിക അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כָּרִאשֹׁנִים
  choice: ആദ്യത്തേതുപോലെയുള്ള
  rationale: മുമ്പുണ്ടായിരുന്ന പലകകളോടുള്ള സാദൃശ്യം താരതമ്യരൂപത്തിൽ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וָאַעַל הָהָרָה
  choice: ഞാൻ മല കയറി
  rationale: ദിശാസൂചക രൂപത്തോടുകൂടിയ עלה മലമുകളിലേക്കുള്ള കയറ്റത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ അവതരണം.
- source_word: בְּיָדִי
  choice: കൈയിൽ എടുത്തുകൊണ്ട്
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘എന്റെ കൈയിൽ’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, രണ്ടു പലകകളും വഹിച്ചുകൊണ്ടുള്ള കയറ്റം സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു.
- source_word: וָאַעַשׂ
  choice: ഉണ്ടാക്കി
  rationale: עשה എന്ന പൊതുവായ ‘ഉണ്ടാക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടിപ്പലകകൾ സൂക്ഷിക്കുന്ന വിശുദ്ധ പാത്രത്തിന്റെ വിവർത്തനം
  choice: പെട്ടകം
  alternative: പെട്ടി
  rationale: ‘പെട്ടകം’ എന്നത് സന്ദർഭത്തിലെ ഉടമ്പടിപരവും ആരാധനാപരവുമായ പ്രത്യേകത നിലനിർത്തുന്നു; എന്നാൽ മൂലപദത്തിൽ ഇല്ലാത്ത അധിക ദൈവശാസ്ത്രവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. തുടർച്ചയായ പ്രവൃത്തികളെ വ്യക്തമാക്കാൻ സ്വാഭാവിക വാക്യവിഭജനം ഉപയോഗിച്ചു; മൂലത്തിലെ ഏകവചന ‘കൈ’യുടെ ആശയം ‘കൈയിൽ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
