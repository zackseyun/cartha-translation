  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֵ֗פֶן וָֽ/אֵרֵד֙ מִן הָ/הָ֔ר וָֽ/אָשִׂם֙ אֶת הַ/לֻּחֹ֔ת בָּ/אָר֖וֹן אֲשֶׁ֣ר עָשִׂ֑יתִי וַ/יִּ֣הְיוּ שָׁ֔ם כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: ml
  text: പിന്നെ ഞാൻ തിരിഞ്ഞ് മലയിൽനിന്ന് ഇറങ്ങി. ഞാൻ ഉണ്ടാക്കിയ പെട്ടകത്തിൽ പലകകൾ വെച്ചു; യഹ്‌വെ എന്നോടു കല്പിച്ചതുപോലെ അവ അവിടെത്തന്നെയുണ്ട്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവ അവിടെ ഉണ്ടായിരുന്നു’ എന്നാണ്; സംസാരിച്ച സമയത്തും അവ അവിടെത്തന്നെ തുടർന്നിരുന്നു എന്ന അർഥവും അതിന് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: പിന്നെ ഞാൻ തിരിഞ്ഞ്
  rationale: פנה എന്ന ക്രിയയുടെ ‘തിരിയുക’ എന്ന അർഥവും തുടർച്ചയായ ആഖ്യാനക്രമവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וָאֵרֵד מִן הָהָר
  choice: മലയിൽനിന്ന് ഇറങ്ങി
  rationale: ירד എന്നതിന്റെ താഴേക്കുള്ള ചലനവും הָהָר എന്ന നിർദിഷ്ടമായ ‘മല’യും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וָאָשִׂם
  choice: വെച്ചു
  rationale: שׂים എന്നതിന്റെ സാധാരണ അർഥമായ ‘വയ്ക്കുക’ ഇവിടെ ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: הַלֻּחֹת
  choice: പലകകൾ
  rationale: ലിഖിതപലകകളെയാണ് സൂചിപ്പിക്കുന്നത്; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘കല്ല്’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: בָּאָרוֹן
  choice: പെട്ടകത്തിൽ
  rationale: אָרוֹן എന്നത് പെട്ടി/പെട്ടകം എന്നു വരുന്നു; ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ ‘പെട്ടകം’ യോജിച്ച പദമാണ്. മലയാളത്തിൽ സ്ഥാനം സൂചിപ്പിക്കുന്ന രൂപം അകത്തേക്കുള്ള ചലനവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: ഞാൻ ഉണ്ടാക്കിയ
  rationale: പെട്ടകത്തെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം; എബ്രായ പൂർണക്രിയയെ അനാവശ്യമായി കൂടുതൽ വ്യാഖ്യാനിക്കാതെ മുൻപ് നടന്ന പ്രവൃത്തിയായി സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּהְיוּ שָׁם
  choice: അവ അവിടെ ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ നിലസൂചകമായ രൂപത്തെ ഔപചാരികമായി അടുത്ത് പിന്തുടരുന്നു; സംസാരസമയംവരെ അവിടെ തുടർന്നു എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר צִוַּנִי יְהוָה
  choice: യഹ്‌വെ എന്നോടു കല്പിച്ചതുപോലെ
  rationale: כַּאֲשֶׁר സൂചിപ്പിക്കുന്ന അനുരൂപതയും צוה എന്നതിന്റെ ‘കല്പിക്കുക’ എന്ന അർഥവും ദൈവനാമവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരോ ‘യഹോവ’ എന്ന പരമ്പരാഗത മിശ്രരൂപമോ ആക്കാതെ Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം Yahweh എന്നതിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: וַיִּהְיוּ שָׁם എന്നതിന്റെ സമയസൂചന
  choice: അവ അവിടെ ഉണ്ടായിരുന്നു
  alternative: അവ അവിടെത്തന്നെ തുടർന്നു; അവ അവിടെയുണ്ട്
  rationale: മൂലത്തിലെ രൂപം ഭൂതകാല ആഖ്യാനമായി വായിക്കാം; അതേസമയം സംസാരസമയംവരെ തുടർന്നിരുന്നുവെന്ന സൂചനയും സാധ്യമാണ്. മുഖ്യപാഠം ഔപചാരികമായി അടുത്ത രൂപം സ്വീകരിക്കുകയും ആ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. അടിക്കുറിപ്പ് ചൂണ്ടുന്ന വാക്കുകൾക്കു പിന്നാലെ തന്നെയാണ് [a] അടയാളം നൽകിയിരിക്കുന്നത്.
