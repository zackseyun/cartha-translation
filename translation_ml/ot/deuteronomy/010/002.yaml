  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: ml
  text: നീ തകർത്ത ആദ്യത്തെ പലകകളിൽ ഉണ്ടായിരുന്ന വാക്കുകൾ[a] ഞാൻ പലകകളിൽ എഴുതും; നീ അവ പെട്ടകത്തിൽ വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘കല്പനകൾ’; എബ്രായത്തിൽ ‘വാക്കുകൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: ഞാൻ ... എഴുതും
  rationale: כתב എന്ന ധാതുവിന്റെ Qal അപൂർണ്ണരൂപം ഒന്നാംപുരുഷ ഏകവചനമാണ്; ഈ ദൈവിക വാഗ്ദാനസന്ദർഭത്തിൽ മലയാളത്തിലെ ലളിതഭാവി സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַלֻּחֹת
  choice: പലകകളിൽ
  rationale: לוח ഇവിടെ എഴുത്തിനുള്ള പലകകളെയാണ് സൂചിപ്പിക്കുന്നത്. ഈ വാക്യത്തിൽ ‘കല്ല്’ ആവർത്തിക്കുന്നില്ലാത്തതിനാൽ അത് കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: הַדְּבָרִים
  choice: വചനങ്ങൾ
  rationale: דבר എന്ന പദം ഇവിടെ ഉടമ്പടിയുടെ ഭാഗമായി എഴുതപ്പെട്ട വാക്കുകളെ സൂചിപ്പിക്കുന്നു. ‘വചനങ്ങൾ’ എബ്രായ പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘കല്പനകൾ’ എന്ന വ്യാഖ്യാനപരമായ അർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: אֲשֶׁר הָיוּ
  choice: ഉണ്ടായിരുന്ന
  rationale: היה ഉൾപ്പെടുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָרִאשֹׁנִים
  choice: ആദ്യത്തെ
  rationale: പകരമായി നൽകിയ പലകകളിൽനിന്ന് മുമ്പത്തെ ഗണത്തെ വേർതിരിക്കുന്ന വിശേഷണമാണ്; ‘ആദ്യത്തെ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: שִׁבַּרְתָּ
  choice: നീ തകർത്തുകളഞ്ഞ
  rationale: שבר എന്ന ധാതുവിന്റെ Piel പൂർണ്ണരൂപം രണ്ടാംപുരുഷ പുല്ലിംഗ ഏകവചനമാണ്. സംഭവത്തിന്റെ ഉദ്ദേശ്യപൂർവവും സമ്പൂർണ്ണവുമായ തകർക്കൽ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְשַׂמְתָּם
  choice: നീ അവ ... വെക്കണം
  rationale: שים എന്നത് വെക്കുക/സ്ഥാപിക്കുക എന്നാണ്. പ്രത്യയത്തിലെ പുല്ലിംഗ ബഹുവചനം സന്ദർഭത്തിൽ പലകകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അവ’ ആ ബന്ധം നിലനിർത്തുന്നു.
- source_word: בָּאָרוֹן
  choice: പെട്ടകത്തിൽ
  rationale: ארון ഇവിടെ വിശുദ്ധ ഉടമ്പടിപ്പെട്ടകത്തെ സൂചിപ്പിക്കുന്നു. ‘പെട്ടകം’ മലയാള ബൈബിൾഭാഷയിൽ സ്ഥാപിതവും ഈ സന്ദർഭത്തിൽ വ്യക്തവുമാണ്.
theological_decisions:
- issue: ‘നീ അവ പെട്ടകത്തിൽ വെക്കണം’ എന്നതിലെ ‘അവ’യുടെ സൂചിതവസ്തു
  choice: ‘അവ’ പലകകളെ സൂചിപ്പിക്കുന്നു.
  alternative: എഴുതപ്പെട്ട വചനങ്ങളെയോ കല്പനകളെയോ സൂചിപ്പിക്കുന്നു.
  rationale: പുല്ലിംഗ ബഹുവചനപ്രത്യയം വ്യാകരണപരമായി അടുത്തുള്ള രണ്ടു ബഹുവചന നാമങ്ങളിലേക്കും ചൂണ്ടാമെങ്കിലും പെട്ടകത്തിൽ ഭൗതികമായി വെക്കപ്പെടുന്നത് പലകകളാണെന്ന വായന ആവർത്തനം 10:1–5-ലെ സന്ദർഭവുമായി യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യക്രമം അതേപടി പകർത്താതെ അർഥബന്ധങ്ങൾ തെളിയുന്ന മലയാളക്രമം സ്വീകരിച്ചു; എന്നാൽ പദാർഥത്തിലെ യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
