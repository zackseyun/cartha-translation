id: DEU.10.14
reference: Deuteronomy 10:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֵ֚ן לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/שָּׁמַ֖יִם וּ/שְׁמֵ֣י הַ/שָּׁמָ֑יִם הָ/אָ֖רֶץ וְ/כָל אֲשֶׁר בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: ml
  text: ഇതാ, ആകാശവും ആകാശങ്ങളുടെ ആകാശവും[a], ഭൂമിയും അതിലുള്ള സകലവും നിന്റെ ദൈവമായ യാഹ്‌വേക്കുള്ളവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ആകാശവും ആകാശങ്ങളുടെ ആകാശവും.” ഈ പ്രയോഗം അത്യുന്നത ആകാശത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും പ്രസ്താവനയ്ക്ക് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന വ്യവഹാരകണത്തിന്റെ ഗൗരവമുള്ള ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യാഹ്‌വേക്കുള്ളവയാണ്
  rationale: לְ സൂചിപ്പിക്കുന്ന ഉടമസ്ഥതാബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന അഭിസംബോധന സംരക്ഷിക്കുകയും ദൈവനാമത്തോടുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: הַשָּׁמַיִם
  choice: ആകാശം
  rationale: ഹീബ്രായ ബഹുവചനരൂപത്തിന് മലയാളത്തിൽ പതിവായ സമാഹാരാർഥ ഏകവചനമായ ‘ആകാശം’ സ്വാഭാവികമാണ്.
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  choice: ആകാശങ്ങളുടെ ആകാശം
  rationale: ഹീബ്രായത്തിലെ തീവ്രതയുള്ള ഘടനയെ വ്യാഖ്യാനിച്ച് ‘അത്യുന്നത ആകാശം’ എന്നു മാറ്റാതെ, അതിന്റെ രൂപവും കവിതാത്മക ശക്തിയും നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ഭൂമി
  rationale: ആകാശത്തോടുള്ള സമാന്തരതയും അതിലുള്ള സകലത്തെയും കുറിച്ചുള്ള പരാമർശവും ആഗോളമായ അർഥം സൂചിപ്പിക്കുന്നു.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: അതിലുള്ള സകലവും
  rationale: בָּהּ എന്ന ‘അതിൽ’ എന്ന ബന്ധവും സമഗ്രതയും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: שְׁמֵי הַשָּׁמַיִם എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ആകാശങ്ങളുടെ ആകാശം
  alternative: അത്യുന്നത ആകാശം
  rationale: ഇത് ഏറ്റവും ഉയർന്ന ആകാശത്തെ സൂചിപ്പിക്കുന്ന തീവ്രതാപ്രയോഗമായി മനസ്സിലാക്കാമെങ്കിലും, മൂലത്തിലെ ആവർത്തനഘടന സംരക്ഷിച്ച് അർഥപരമായ വ്യാപ്തി തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. ‘ഇതാ’ എന്നത് മൂലത്തിലെ ശ്രദ്ധാകർഷക ഊന്നൽ നിലനിർത്തുന്നു; ദൈവനാമം ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു. പ്രധാനപാഠത്തിൽ മൂലഘടനയ്ക്ക് അടുത്ത പ്രയോഗം നിലനിർത്തി, അതിന്റെ സാദ്ധ്യമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
