  text: ה֥וּא תְהִלָּתְ/ךָ֖ וְ/ה֣וּא אֱלֹהֶ֑י/ךָ אֲשֶׁר עָשָׂ֣ה אִתְּ/ךָ֗ אֶת הַ/גְּדֹלֹ֤ת וְ/אֶת הַ/נּֽוֹרָאֹת֙ הָ/אֵ֔לֶּה אֲשֶׁ֥ר רָא֖וּ עֵינֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: ml
  text: അവനാണ് നിന്റെ സ്തുതി[a], അവനാണ് നിന്റെ ദൈവം; നിന്റെ കണ്ണുകൾ കണ്ട ഈ മഹത്തായതും ഭയഭക്തി ഉണർത്തുന്നതുമായ[b] കാര്യങ്ങൾ അവൻ നിനക്കുവേണ്ടി ചെയ്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “നീ സ്തുതിക്കുന്നവൻ അവനാണ്” അല്ലെങ്കിൽ “അവനാണ് നിന്റെ പ്രശംസയ്ക്ക് ആധാരം.” എബ്രായത്തിൽ അക്ഷരാർഥം: “അവനാണ് നിന്റെ സ്തുതി.”'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഭയാനകമായ” അല്ലെങ്കിൽ “ഭീതിജനകമായ.” എബ്രായപദം ഭയവും വിസ്മയാദരവും ഉളവാക്കുന്ന പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְהִלָּתְךָ
  choice: നിന്റെ സ്തുതി
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ നാമവാക്യം നേരിട്ട് നിലനിർത്തുന്നു. ദൈവം ഇസ്രായേലിന്റെ സ്തുതിയുടെ വിഷയവും അടിസ്ഥാനവും ആണെന്ന ഇരട്ടസൂചന വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവം
  rationale: ഇസ്രായേലിനെ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്ന ഉടമ്പടിഭാഷ നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עָשָׂה אִתְּךָ
  choice: നിനക്കുവേണ്ടി ചെയ്തത്
  rationale: ഈ സന്ദർഭത്തിലെ പ്രയോജനാർത്ഥകമായ അർഥം വ്യക്തമാക്കുന്നു; ദൈവം ഇസ്രായേലിനുവേണ്ടി പ്രവർത്തിച്ചതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַגְּדֹלֹת
  choice: മഹത്തായ കാര്യങ്ങൾ
  rationale: നാമവൽക്കരിച്ച് ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ശക്തിയെ മാത്രം സൂചിപ്പിക്കുന്ന പദമായി ചുരുക്കുന്നില്ല.
- source_word: הַנּוֹרָאוֹת
  choice: ഭയഭക്തിയുണർത്തുന്ന കാര്യങ്ങൾ
  rationale: ഭയവും വിസ്മയാദരവും ഉളവാക്കുന്ന പ്രവൃത്തികൾ എന്ന എബ്രായപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; വെറും ഭീകരതയായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: רָאוּ עֵינֶיךָ
  choice: നിന്റെ കണ്ണുകൾ കണ്ട
  rationale: നേരിട്ടുള്ള ദൃക്സാക്ഷ്യത്തിന് എബ്രായപ്രയോഗം നൽകുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: הוּא ... וְהוּא
  choice: അവനാണ് ... അവനാണ് ...
  rationale: ആവർത്തിച്ച സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘അവൻ മാത്രം’ എന്ന ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: הוּא תְהִלָּתְךָ എന്ന നാമവാക്യത്തിന്റെ പരിഭാഷ
  choice: അവനാണ് നിന്റെ സ്തുതി
  alternative: നീ സ്തുതിക്കുന്നവൻ അവനാണ് / നിന്റെ പ്രശംസയ്ക്ക് ആധാരം അവനാണ്
  rationale: ദൈവം സ്തുതിയുടെ വിഷയവും അതിന്റെ അടിസ്ഥാനവും ആണെന്ന മൂലഭാഷയിലെ സാന്ദ്രതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
- issue: הַנּוֹרָאוֹת എന്ന പദത്തിന്റെ ഭാവം
  choice: ഭയഭക്തിയുണർത്തുന്ന കാര്യങ്ങൾ
  alternative: ഭയാനകമായ കാര്യങ്ങൾ / ഭീതിജനകമായ കാര്യങ്ങൾ
  rationale: ദൈവത്തിന്റെ പ്രവൃത്തികൾ ഉളവാക്കുന്ന ഭയവും ആദരപൂർവമായ വിസ്മയവും ഒരുമിച്ച് അറിയിക്കുന്നു; അതിനെ നാശകരമായ ഭീകരതയായി മാത്രം വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചനമായ ‘നിന്റെ/നിനക്കുവേണ്ടി’ എന്ന രൂപങ്ങൾ ഇസ്രായേലിനെ സമൂഹമായി അഭിസംബോധന ചെയ്യുന്ന മൂലഭാഷയുടെ ഉടമ്പടിസ്വരം നിലനിർത്തുന്നു. അർദ്ധവിരാമം ആവർത്തിച്ച ‘അവനാണ്’ എന്ന ഊന്നലിനെയും തുടർന്നുള്ള ദൈവികപ്രവൃത്തികളുടെ വിവരണത്തെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
