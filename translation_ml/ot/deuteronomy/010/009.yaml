  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַל כֵּ֞ן לֹֽא הָיָ֧ה לְ/לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: ml
  text: അതുകൊണ്ട് ലേവിക്ക് തന്റെ സഹോദരന്മാരോടൊപ്പം ഓഹരിയോ അവകാശമോ ഇല്ല[a]; യഹ്‌വെയാണ് അവന്റെ അവകാശം[b]—നിന്റെ ദൈവമായ യഹ്‌വെ അവനോടു പറഞ്ഞതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘തന്റെ സഹോദരന്മാരോടൊപ്പം.’ ഏകവചനമായ ‘ലേവി’ ഇവിടെ മറ്റു ഇസ്രായേൽ ഗോത്രങ്ങളിൽനിന്നു വേർതിരിച്ച ലേവി ഗോത്രത്തെ പ്രതിനിധീകരിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ ‘യഹ്‌വെയാണ് അവന്റെ ഓഹരി.’ എബ്രായപാഠം ‘അവകാശം’ എന്ന ആശയം ആവർത്തിച്ച്, ലേവിയുടെ പങ്ക് ഭൂമിയല്ല, യഹ്‌വെ തന്നെയാണെന്ന് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְלֵוִי
  choice: ലേവിക്ക്
  rationale: എബ്രായത്തിലെ ഏകവചന വ്യക്തിനാമം നിലനിർത്തുന്നു; ഇവിടെ ലേവി ഗോത്രത്തെ പ്രതിനിധീകരിക്കുന്നു.
- source_word: חֵלֶק וְנַחֲלָה
  choice: ഓഹരിയോ അവകാശമോ
  rationale: ഭൂവിഭജനത്തിലെ പങ്ക് എന്ന ആശയവും പാരമ്പര്യമായി ലഭിക്കുന്ന അവകാശം എന്ന ആശയവും വേർതിരിച്ചുതന്നെ നിലനിർത്തുന്നു; നിഷേധവാക്യത്തിൽ മലയാളത്തിന് സ്വാഭാവികമായ ‘-യോ ... -യോ’ ഘടന ഉപയോഗിക്കുന്നു.
- source_word: עִם אֶחָיו
  choice: തന്റെ സഹോദരന്മാരോടൊപ്പം
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചന ബന്ധുപദം നേരിട്ട് സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ മറ്റു ഇസ്രായേൽ ഗോത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הוּא נַחֲלָתוֹ
  choice: യഹ്‌വെയാണ് അവന്റെ അവകാശം
  rationale: ആദ്യത്തെ נַחֲלָה എന്ന പദവുമായുള്ള ആവർത്തനബന്ധം നിലനിർത്തി, ഭൂമിയല്ല യഹ്‌വെ തന്നെയാണ് ലേവിയുടെ അവകാശം എന്ന വൈരുധ്യം ഊന്നുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: അരുളിച്ചെയ്തതുപോലെതന്നെ
  rationale: ‘വാഗ്ദാനം ചെയ്തു’ എന്ന അധിക അർത്ഥം ചേർക്കാതെ ദൈവത്തിന്റെ സംസാരത്തെ മാന്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: എബ്രായത്തിലെ രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: לוֹ
  choice: അവനോടു
  rationale: ഏകവചന സർവനാമം നേരിട്ട് നിലനിർത്തുന്നു; മുൻപുള്ള ‘ലേവി’യെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ, സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: אֶחָיו എന്ന ലിംഗസൂചക ബന്ധുപദം
  choice: തന്റെ സഹോദരന്മാർ
  alternative: തന്റെ ബന്ധുക്കൾ / മറ്റു ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനം സംരക്ഷിക്കുന്നു; അതിന്റെ ഗോത്രപരമായ പ്രതിനിധ്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ലേവി എന്ന ഏകവചനം ഗോത്രത്തെ പ്രതിനിധീകരിക്കുന്നത്
  choice: ലേവി
  alternative: ലേവി ഗോത്രം
  rationale: മൂലത്തിലെ ഏകവചന വ്യക്തിനാമം നിലനിർത്തി അതിന്റെ കൂട്ടായ ഗോത്രസൂചന അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- issue: നַחֲלָה എന്ന പദത്തിന്റെ ആവർത്തനം
  choice: രണ്ടിടത്തും ‘അവകാശം’
  alternative: രണ്ടാമത്തെ ഇടത്ത് ‘ഓഹരി’
  rationale: ലേവിക്ക് ഭൂമിയവകാശമില്ലെങ്കിലും യഹ്‌വെ തന്നെയാണ് അവന്റെ അവകാശം എന്ന പാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ പദബന്ധവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരവും ഭൂവിഭജനപരവുമായ ഭാവം നിലനിർത്താൻ ‘ഓഹരി’, ‘അവകാശം’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; ദൈവത്തിന്റെ സംസാരത്തിന് ‘അരുളിച്ചെയ്തു’ എന്ന ഗൗരവമുള്ള പ്രയോഗം തിരഞ്ഞെടുത്തു.
