source:
  edition: WLC
  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א אֹת֣/וֹ תַעֲבֹ֑ד וּ/ב֣/וֹ תִדְבָּ֔ק וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെയെ നീ ഭയപ്പെടണം[a]; അവനെത്തന്നെ നീ സേവിക്കണം; അവനോടു ചേർന്നുനിൽക്കണം[b]; അവന്റെ നാമത്തെച്ചൊല്ലി സത്യം ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ദൈവമായ യഹ്‌വെയെ നീ ഭയഭക്തിയോടെ ആദരിക്കണം.’ ഉടമ്പടി പശ്ചാത്തലത്തിൽ എബ്രായക്രിയ ആദരത്തോടുകൂടിയ ഭയത്തെയും സൂചിപ്പിക്കാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവനെ മുറുകെപ്പിടിക്കണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം ഉൾക്കൊള്ളുന്ന ഉടമ്പടിസംബന്ധമായ അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: תִּירָא
  choice: നീ ഭയപ്പെടണം
  rationale: ירא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും ഉടമ്പടി പശ്ചാത്തലത്തിലെ ഗൗരവവും നിലനിർത്തി; അതിലുള്ള ആദരഭയത്തിന്റെ ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אֹתוֹ
  choice: അവനെത്തന്നെ
  rationale: എബ്രായത്തിലെ മുൻനിറുത്തിയ കർമസർവനാമത്തിന്റെ ഊന്നൽ ‘-ത്തന്നെ’ എന്ന രൂപത്തിലൂടെ സംരക്ഷിച്ചു.
- source_word: תַעֲבֹד
  choice: നീ സേവിക്കണം
  rationale: עבד എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘സേവിക്കുക’ നിലനിർത്തുന്നു; ആരാധനാസംബന്ധമായ അർഥവ്യാപ്തിയെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וּבוֹ תִדְבָּק
  choice: അവനോടു ചേർന്നുനിൽക്കണം
  rationale: דבק-നോടൊപ്പമുള്ള ב വ്യക്തിയോടുള്ള ദൃഢമായ പറ്റിച്ചേരലും ഉടമ്പടിവിശ്വസ്തതയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  choice: അവന്റെ നാമത്തെച്ചൊല്ലി സത്യം ചെയ്യണം
  rationale: നിഫാൽ രൂപത്തിലുള്ള שבע-യോടുകൂടിയ ഈ പ്രയോഗം ഒരാളുടെ നാമത്തെ സാക്ഷിയാക്കി ശപഥം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനനുസരിച്ചുള്ള വ്യക്തമായ മലയാള ശൈലി ഉപയോഗിച്ചു.
theological_decisions:
- issue: ഉടമ്പടിബാധ്യതകളെ സൂചിപ്പിക്കുന്ന എബ്രായ അപൂർണക്രിയാരൂപങ്ങൾ
  choice: ‘നീ ...ണം’ എന്ന ആജ്ഞാത്മക-ബാധ്യതാരൂപം ആവർത്തിച്ചു
  alternative: ‘ഭയപ്പെടുക; സേവിക്കുക; ചേർന്നുനിൽക്കുക; സത്യം ചെയ്യുക’ എന്ന നേരിട്ടുള്ള ആജ്ഞാരൂപം
  rationale: നിയമപരവും പ്രബോധനാത്മകവുമായ പശ്ചാത്തലത്തിൽ ഈ രൂപങ്ങൾ ഉടമ്പടിയാജ്ഞകളാണ്. ആജ്ഞയുടെ ബലവും മലയാളത്തിലെ സ്വാഭാവിക ഗൗരവശൈലിയും ഒരുമിച്ച് നിലനിർത്താൻ ‘-ണം’ രൂപം അനുയോജ്യം.
- issue: ירא എന്ന ക്രിയയിലെ ഭയവും ആദരഭയവും
  choice: പ്രധാനപാഠത്തിൽ ‘ഭയപ്പെടണം’
  alternative: ‘ഭക്ത്യാദരത്തോടെ ഭയപ്പെടണം’ അഥവാ ‘ഭയഭക്തിയോടെ ആദരിക്കണം’
  rationale: മൂലക്രിയയുടെ നേരിട്ടുള്ള ഭയാർഥം മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു; ഉടമ്പടി പശ്ചാത്തലത്തിലെ ആദരത്തിന്റെ അർഥഛായ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ കർമഊന്നൽ, സമാന്തരമായ ഉടമ്പടിയാജ്ഞകൾ, ദൈവനാമം എന്നിവ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തു.
