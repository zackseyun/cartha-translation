source:
  edition: WLC
  text: עֹשֶׂ֛ה מִשְׁפַּ֥ט יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אֹהֵ֣ב גֵּ֔ר לָ֥/תֶת ל֖/וֹ לֶ֥חֶם וְ/שִׂמְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: ml
  text: അപ്പനില്ലാത്തവനും വിധവയ്ക്കും അവൻ നീതി നടപ്പാക്കുന്നു; പരദേശിയെ അവൻ സ്നേഹിക്കുകയും അവന് ആഹാരവും വസ്ത്രവും നൽകുകയും ചെയ്യുന്നു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അപ്പനില്ലാത്തവൻ’ എന്നതിന് ‘അനാഥൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പദം പ്രത്യേകിച്ച് പിതാവില്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പരദേശി’ എന്നതിന് ‘താമസിക്കുന്ന വിദേശി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ גֵּר വഴിപോക്കനെയല്ല, സമൂഹത്തിനിടയിൽ താമസിക്കുന്ന അന്യദേശക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘അപ്പവും വസ്ത്രവും.’ ഇവിടെ ‘ആഹാരം’ അടിസ്ഥാന ഉപജീവനത്തിനുള്ള ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: നീതി നടത്തിക്കൊടുക്കുന്നു
  rationale: ഈ പദസമുച്ചയം പൊതുവായി ‘ചെയ്യുന്നു’ എന്നതല്ല, ദുർബലർക്കു ലഭിക്കേണ്ട നീതി പ്രാവർത്തികമാക്കുന്നു എന്ന ന്യായപരമായ അർഥമാണ് നൽകുന്നത്.
- source_word: יָתוֹם
  choice: അപ്പനില്ലാത്തവൻ
  rationale: എബ്രായപദം പ്രത്യേകിച്ച് പിതാവിനെ നഷ്ടപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘അനാഥൻ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ സാമൂഹിക-നിയമപരമായ സൂക്ഷ്മത ഇത് നിലനിർത്തുന്നു.
- source_word: אַלְמָנָה
  choice: വിധവ
  rationale: മൂലപദം സൂചിപ്പിക്കുന്ന ദുർബലമായ സാമൂഹികവിഭാഗത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אֹהֵב
  choice: സ്നേഹിച്ച്
  rationale: ദൈവത്തിന്റെ സജീവമായ സ്നേഹവും തുടർന്ന് പറയുന്ന നൽകൽ അതിന്റെ പ്രകടനമാണെന്ന ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: גֵּר
  choice: നിങ്ങളുടെ ഇടയിൽ പാർക്കുന്ന വിദേശി
  rationale: വഴിപോക്കനെയല്ല, ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുന്ന അന്യദേശക്കാരനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിലെ സമൂഹത്തെ വ്യക്തമാക്കാൻ ‘നിങ്ങളുടെ ഇടയിൽ’ ഉപയോഗിച്ചു.
- source_word: לָתֶת לוֹ
  choice: അവന് ... നൽകുന്നു
  rationale: സ്നേഹം ആഹാരവും വസ്ത്രവും നൽകുന്നതിലൂടെ മൂർത്തമായി പ്രകടമാകുന്നു എന്ന മൂലവാക്യബന്ധം നിലനിർത്തുന്നു.
- source_word: לֶחֶם
  choice: ആഹാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘അപ്പം’ എന്നാണെങ്കിലും വസ്ത്രത്തോടൊപ്പം വരുമ്പോൾ അടിസ്ഥാന ഉപജീവനത്തിനുള്ള ഭക്ഷണത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: שִׂמְלָה
  choice: വസ്ത്രം
  rationale: ധരിക്കാനുള്ള വസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പൊതുവുമായ മലയാളപദം.
theological_decisions:
- issue: ദുർബലരോടുള്ള ദൈവത്തിന്റെ കരുതൽ
  choice: ന്യായം നടത്തുന്നതും സ്നേഹത്തോടെ ഭൗതികാവശ്യങ്ങൾ നൽകുന്നതുമായ ദൈവിക പ്രവർത്തനങ്ങൾ രണ്ടും നിലനിർത്തി.
  alternative: നിയമപരമായ സംരക്ഷണത്തെയോ വികാരപരമായ കരുണയെയോ മാത്രം ഊന്നിപ്പറയുക.
  rationale: എബ്രായവാക്യം ന്യായപരമായ പ്രവർത്തനവും സ്നേഹവും ആഹാര-വസ്ത്ര ദാനവും ഒരുമിച്ചു അവതരിപ്പിക്കുന്നു; ഒന്നിനെ മറ്റൊന്നായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ മാന്യവും സ്വാഭാവികവുമായ ശൈലി. ‘നീതി നടത്തിക്കൊടുക്കുന്നു’ എന്ന പ്രയോഗം ന്യായപരമായ സജീവതയും ദുർബലർക്കു നീതി ലഭ്യമാക്കുന്ന അർഥവും നിലനിർത്തുന്നു.
