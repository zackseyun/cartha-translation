reference: Deuteronomy 10:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָנֹכִ֞י עָמַ֣דְתִּי בָ/הָ֗ר כַּ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וַ/יִּשְׁמַ֨ע יְהוָ֜ה אֵלַ֗/י גַּ֚ם בַּ/פַּ֣עַם הַ/הִ֔וא לֹא אָבָ֥ה יְהוָ֖ה הַשְׁחִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: ml
  text: ഞാനാകട്ടെ, ആദ്യത്തെ പ്രാവശ്യത്തെപ്പോലെ നാല്പത് ദിവസവും നാല്പത് രാത്രിയും മലയിൽ നിന്നു. ആ പ്രാവശ്യവും യഹ്‌വെ എന്നെ കേട്ടു[a]; നിന്നെ നശിപ്പിക്കാൻ യഹ്‌വെ ഇച്ഛിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെ എനിക്കു ചെവികൊടുത്തു.” ഇബ്രായ ക്രിയയ്ക്ക് കേൾക്കുക എന്നും അനുകൂലമായി കേട്ട് പ്രതികരിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: ഞാനാകട്ടെ
  rationale: സംയോജകവും സ്വതന്ത്ര സർവനാമവും നൽകുന്ന മൃദുവായ വിഷയപ്രാധാന്യം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עָמַדְתִּי
  choice: നിന്നു
  rationale: മൂലത്തിലെ ‘നിൽക്കുക’ എന്ന പദത്തോട് അടുത്തുനിൽക്കുകയും, ഈ സന്ദർഭത്തിൽ ദീർഘകാലം അവിടെ തുടരുക എന്ന അർഥവും സ്വാഭാവികമായി വഹിക്കുകയും ചെയ്യുന്നു.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: ആദ്യത്തെ പ്രാവശ്യത്തെപ്പോലെ
  rationale: മോശെയുടെ മുമ്പത്തെ നാല്പതുദിവസത്തെ മലവാസവുമായി ഈ കാലയളവിനെ താരതമ്യം ചെയ്യുന്നതു വ്യക്തമാക്കുന്നു.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: നാല്പതു പകലും നാല്പതു രാത്രിയും
  rationale: കാലദൈർഘ്യം കൃത്യമായും മലയാളത്തിൽ സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: യഹ്‌വെ എന്റെ അപേക്ഷ കേട്ടു
  rationale: שׁמע + אֶל ഇവിടെ വെറും ശ്രവണത്തേക്കാൾ അനുകൂലമായി ശ്രദ്ധിച്ചു പ്രതികരിച്ച അർഥം സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ മധ്യസ്ഥപ്രാർഥന ‘അപേക്ഷ’ എന്ന പദത്തിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: ആ പ്രാവശ്യവും
  rationale: ആ സന്ദർഭത്തിലും ദൈവം മോശെയെ കേട്ടുവെന്ന ആവർത്തനഭാവം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: לֹא אָבָה
  choice: മനസ്സായില്ല
  rationale: ആഗ്രഹമോ സമ്മതമോ ഇല്ലായ്മ എന്ന ഇബ്രായ ക്രിയയുടെ ഇച്ഛാസംബന്ധിയായ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: הַשְׁחִיתֶךָ
  choice: നിന്നെ നശിപ്പിക്കാൻ
  rationale: ഏകവചന അഭിസംബോധനയിൽ സമൂഹമായ ഇസ്രായേലിനെ ഉദ്ദേശിക്കുന്ന മൂലരൂപവും ന്യായവിധിയുടെ തീവ്രതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദമായി പകരാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: וַיִּשְׁמַע יְהוָה אֵלַי എന്നതിലെ ദൈവിക പ്രതികരണത്തിന്റെ ഭാവം
  choice: യഹ്‌വെ എന്റെ അപേക്ഷ കേട്ടു
  alternative: യഹ്‌വെ എന്നെ കേട്ടു / യഹ്‌വെ എനിക്കു ചെവികൊടുത്തു
  rationale: മോശെയുടെ മധ്യസ്ഥതയുടെ പശ്ചാത്തലത്തിൽ കേൾക്കലും അനുകൂല പ്രതികരണവും ഉൾക്കൊള്ളുന്നു; പ്രതികരണത്തിന്റെ യന്ത്രവത്കൃതമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഞാനാകട്ടെ’ വിഷയപ്രാധാന്യം നിലനിർത്തുന്നു; ‘മനസ്സായില്ല’ ഇച്ഛാഭാവം സ്വാഭാവികമായി നൽകുന്നു. ‘നിന്നെ’ എന്ന ഏകവചനം സമൂഹമായ ഇസ്രായേലിനോടുള്ള മൂലപാഠത്തിലെ ഏകവചന അഭിസംബോധന സംരക്ഷിക്കുന്നു.
