reference: Deuteronomy 10:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗וא הִבְדִּ֤יל יְהוָה֙ אֶת שֵׁ֣בֶט הַ/לֵּוִ֔י לָ/שֵׂ֖את אֶת אֲר֣וֹן בְּרִית יְהוָ֑ה לַ/עֲמֹד֩ לִ/פְנֵ֨י יְהוָ֤ה לְ/שָֽׁרְת/וֹ֙ וּ/לְ/בָרֵ֣ךְ בִּ/שְׁמ֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: ml
  text: 'ആ കാലത്ത് യഹ്‌വെ ലേവി ഗോത്രത്തെ വേർതിരിച്ചു: യഹ്‌വെയുടെ ഉടമ്പടിപ്പെട്ടകം ചുമക്കാനും, യഹ്‌വെയുടെ സന്നിധിയിൽ നിൽക്കാനും, അവിടുത്തെ ശുശ്രൂഷിക്കാനും, അവിടുത്തെ നാമത്തിൽ അനുഗ്രഹിക്കാനും—ഇന്നുവരെയും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: ആ കാലത്ത്
  rationale: കാലസൂചനയെ സ്വാഭാവികവും നേരിട്ടുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הִבְדִּיל
  choice: വേർതിരിച്ചുനിർത്തി
  rationale: ഒരു പ്രത്യേക ദൗത്യത്തിനായി വേർതിരിച്ച് നിയമിക്കുക എന്ന ആശയം വ്യക്തമാക്കുന്നു; വെറും ഭൗതികമായ വേർപെടുത്തൽ എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: שֵׁבֶט הַלֵּוִי
  choice: ലേവി ഗോത്രം
  rationale: ഗോത്രനാമമായ ‘ലേവി’ നിലനിർത്തിക്കൊണ്ട് ഹീബ്രു ഘടനയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לָשֵׂאת
  choice: ചുമക്കാൻ
  rationale: ഉടമ്പടിപ്പെട്ടകം വഹിക്കുന്ന ലേവ്യദൗത്യത്തിന് യോജിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: യഹ്‌വെയുടെ ഉടമ്പടിപ്പെട്ടകം
  rationale: ‘യഹ്‌വെയുടെ ഉടമ്പടിയുടെ പെട്ടകം’ എന്ന ഘടനയെ മലയാളത്തിലെ പതിവും വ്യക്തവുമായ സംയുക്തപദത്തിലൂടെ നൽകുന്നു.
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ നിൽക്കാൻ
  rationale: ആരാധനാസംബന്ധമായ സേവനസന്ദർഭം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: לְשָׁרְתוֹ
  choice: അവിടുത്തെ ശുശ്രൂഷിക്കാൻ
  rationale: വിശുദ്ധസേവനത്തിന്റെ സന്ദർഭം ‘ശുശ്രൂഷിക്കുക’ വ്യക്തമാക്കുന്നു; പ്രത്യയം ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക സർവനാമത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: അവിടുത്തെ നാമത്തിൽ അനുഗ്രഹിക്കാൻ
  rationale: ദൈവനാമത്തിന്റെ അധികാരത്തിൽ അനുഗ്രഹം ഉച്ചരിക്കുക എന്ന ആശയം നൽകുന്നു; അനുഗ്രഹത്തിന്റെ സ്വീകർത്താവിനെ മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിലും കർമം ചേർക്കുന്നില്ല.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: വിവരണകർത്താവിന്റെ കാലംവരെ ഈ നിയമനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായി വരുന്ന ദൈവനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: לַעֲמֹד ... לְשָׁרְתוֹ എന്നതിലെ ലേവിയുടെ ആരാധനാസംബന്ധമായ പങ്ക്
  choice: സന്നിധിയിൽ നിന്ന് അവിടുത്തെ ശുശ്രൂഷിക്കാൻ
  alternative: മുമ്പാകെ നിന്ന് അവിടുത്തെ സേവിക്കാൻ
  rationale: വിശുദ്ധസേവനത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; എന്നാൽ പിൽക്കാല സഭാപരമോ വിഭാഗീയമോ ആയ പൗരോഹിത്യഘടനകൾ പാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- issue: וּלְבָרֵךְ בִּשְׁמוֹ എന്നതിലെ അനുഗ്രഹത്തിന്റെ കർമം
  choice: കർമം ചേർക്കാതെ ‘അവിടുത്തെ നാമത്തിൽ അനുഗ്രഹിക്കാൻ’
  alternative: ജനത്തെ അവിടുത്തെ നാമത്തിൽ അനുഗ്രഹിക്കാൻ
  rationale: സന്ദർഭത്തിൽ ജനത്തെ അനുഗ്രഹിക്കുന്നതാകാം ഉദ്ദേശ്യമെങ്കിലും ഈ വാക്യത്തിലെ ഹീബ്രു പാഠം കർമം പറയുന്നില്ല; അതിനാൽ അതിന്റെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: עַד הַיּוֹם הַזֶּה ഏതിനോടാണ് ബന്ധപ്പെടുന്നത്
  choice: വാക്യാവസാനത്തിൽ ‘ഇന്നുവരെയും’ എന്ന് തുറന്ന നിലയിൽ നിലനിർത്തുന്നു
  alternative: ഇന്നുവരെയും അവർ ഈ ചുമതല നിർവഹിക്കുന്നു
  rationale: ഈ പ്രയോഗം നിയമനത്തിന്റെയോ ചുമതലകളുടെയോ തുടർച്ചയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പുതിയ കർത്താവും ക്രിയയും ചേർത്ത് വ്യാഖ്യാനം നിർബന്ധിതമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവനാമത്തിന് ‘യഹ്‌വെ’, വിശുദ്ധസേവനത്തിന് ‘ശുശ്രൂഷിക്കുക’, ark എന്നതിന് പ്രചാരത്തിലുള്ള ‘ഉടമ്പടിപ്പെട്ടകം’ എന്നിവ ഉപയോഗിച്ചു. അവസാനത്തെ ‘ഇന്നുവരെയും’ എന്ന പ്രയോഗത്തിന്റെ ബന്ധം മൂലപാഠത്തിലെപ്പോലെ തുറന്ന നിലയിൽ സൂക്ഷിക്കാൻ ദീർഘവിരാമം ഉപയോഗിച്ചു.
