- from: 'ആ കാലത്ത് യഹ്‌വെ ലേവി ഗോത്രത്തെ വേർതിരിച്ചുനിർത്തി: യഹ്‌വെയുടെ ഉടമ്പടിപ്പെട്ടകം ചുമക്കാനും, യഹ്‌വെയുടെ സന്നിധിയിൽ നിന്ന് അവിടുത്തെ ശുശ്രൂഷിക്കാനും, അവിടുത്തെ നാമത്തിൽ അനുഗ്രഹിക്കാനും—ഇന്നുവരെയും.'
  to: 'ആ കാലത്ത് യഹ്‌വെ ലേവി ഗോത്രത്തെ വേർതിരിച്ചു: യഹ്‌വെയുടെ ഉടമ്പടിപ്പെട്ടകം ചുമക്കാനും, യഹ്‌വെയുടെ സന്നിധിയിൽ നിൽക്കാനും, അവിടുത്തെ ശുശ്രൂഷിക്കാനും, അവിടുത്തെ നാമത്തിൽ അനുഗ്രഹിക്കാനും—ഇന്നുവരെയും.'
