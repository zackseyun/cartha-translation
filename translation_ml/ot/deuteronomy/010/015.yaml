source:
  edition: WLC
  text: רַ֧ק בַּ/אֲבֹתֶ֛י/ךָ חָשַׁ֥ק יְהוָ֖ה לְ/אַהֲבָ֣ה אוֹתָ֑/ם וַ/יִּבְחַ֞ר בְּ/זַרְעָ֣/ם אַחֲרֵי/הֶ֗ם בָּ/כֶ֛ם מִ/כָּל הָ/עַמִּ֖ים כַּ/יּ֥וֹם הַ/זֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: ml
  text: എന്നിരുന്നാലും, നിങ്ങളുടെ പിതാക്കന്മാരെ സ്നേഹിക്കാനായി യഹോവ അവരോടു മമത പുലർത്തി; അവർക്കുശേഷം അവരുടെ സന്തതിയായ നിങ്ങളെ സകല ജനതകളിൽനിന്നും തിരഞ്ഞെടുത്തു—ഇന്നുള്ളതുപോലെതന്നെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യഹോവ നിങ്ങളുടെ പിതാക്കന്മാരോടു മാത്രം മമത പുലർത്തി, അവരെ സ്നേഹിക്കാനായി.”'
    reason: רַק എന്നതിന് ‘മാത്രം’ എന്ന നിയന്ത്രണാർഥവും חָשַׁק എന്നതിന് ‘മമത പുലർത്തുക’ എന്ന കൂടുതൽ പദാനുപദ വായനയും സാധ്യമാണ്.
lexical_decisions:
- source_word: רַק
  choice: എന്നിട്ടും
  rationale: മുൻവാക്യത്തിൽ ആകാശവും ഭൂമിയും യഹോവയ്ക്കുള്ളതാണെന്ന പ്രസ്താവനയോടുള്ള വൈരുധ്യവും, അതിനിടയിലും ഒരു പ്രത്യേക ജനത്തെ തിരഞ്ഞെടുത്തതിലെ ആശ്ചര്യകരമായ പ്രത്യേകതയും സൂചിപ്പിക്കുന്നു. ‘മാത്രം’ എന്ന വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: בַּאֲבֹתֶיךָ חָשַׁק
  choice: നിങ്ങളുടെ പിതാക്കന്മാരോടു പ്രിയം തോന്നി
  rationale: חָשַׁק ശക്തമായ അടുപ്പവും സ്നേഹപൂർവമായ താത്പര്യവും സൂചിപ്പിക്കുന്നു; בְ ആ സ്നേഹബന്ധം ലക്ഷ്യമാക്കിയവരെ അടയാളപ്പെടുത്തുന്നു. ഈ പ്രയോഗം ആ ബന്ധാത്മക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְאַהֲבָה אֹתָם
  choice: അവരെ സ്നേഹിച്ചു
  rationale: ഇൻഫിനിറ്റീവ് സ്നേഹിക്കുകയെന്ന ഉദ്ദേശ്യത്തെയോ ഫലത്തെയോ മുൻക്രിയയുമായി അടുത്തു ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ഏകോപിത ക്രിയാരൂപം ഉപയോഗിച്ചിട്ടും ‘സ്നേഹിക്കുക’ എന്ന മൂലപദത്തിന്റെ വ്യക്തത നിലനിർത്തുന്നു.
- source_word: וַיִּבְחַר
  choice: തിരഞ്ഞെടുത്തു
  rationale: בחר എന്ന ദൈവിക തിരഞ്ഞെടുപ്പിന്റെ നേരിട്ടുള്ള അർഥം മൃദൂകരിക്കാതെ നൽകുന്നു.
- source_word: בְּזַרְעָם אַחֲרֵיהֶם בָּכֶם
  choice: അവർക്കുശേഷം അവരുടെ സന്തതിയായ നിങ്ങളെ
  rationale: זֶרַע ഇവിടെ കൂട്ടമായ സന്തതിയെ സൂചിപ്പിക്കുന്നു; בָּכֶם ഇപ്പോഴത്തെ ശ്രോതാക്കളാണ് ആ സന്തതി എന്ന് വിശദീകരിക്കുന്ന സമാനാധികരണപ്രയോഗമാണ്.
- source_word: מִכָּל הָעַמִּים
  choice: സകല ജനതകളിൽനിന്നും
  rationale: עַמִּים എന്ന ബഹുവചനത്തിന്റെ ‘peoples’ എന്ന അർഥവും מן എന്ന വേർതിരിച്ചെടുക്കൽഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: כַּיּוֹם הַזֶּה
  choice: ഇന്നുള്ളതുപോലെതന്നെ
  rationale: പ്രസ്താവിച്ച തിരഞ്ഞെടുപ്പിന്റെ ഫലം ഇപ്പോഴത്തെ അവസ്ഥയിൽ ദൃശ്യമാണെന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്ഥിരീകരണഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക തിരഞ്ഞെടുപ്പിന്റെ ഭാഷ
  choice: യഹോവയുടെ പ്രിയം, സ്നേഹം, തിരഞ്ഞെടുപ്പ് എന്നിവ വ്യക്തമായി നിലനിർത്തി.
  alternative: ഇതിനെ കേവലം ചരിത്രപരമായ മുൻഗണനയായി മൃദൂകരിക്കുകയോ, പിന്നീടുള്ള ഒരു പ്രത്യേക തിരഞ്ഞെടുപ്പ്-സിദ്ധാന്തത്തിന്റെ ഭാഷ ചേർത്ത് വികസിപ്പിക്കുകയോ ചെയ്യുക.
  rationale: എബ്രായവാക്യം പിതാക്കന്മാരോടുള്ള യഹോവയുടെ അടുപ്പവും സ്നേഹവും അവരുടെ സന്തതിയുടെ തിരഞ്ഞെടുപ്പും നേരിട്ട് പ്രസ്താവിക്കുന്നു. അതിന്റെ ശക്തിയും അന്തർഘർഷവും നിലനിർത്തി; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പിതാക്കന്മാർ’, ‘സന്തതി’, ‘തിരഞ്ഞെടുത്തു’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും മൂലഭാഷയുടെ ബന്ധാത്മകവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നതുമാണ്.
