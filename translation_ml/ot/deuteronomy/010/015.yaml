revisions:
- from: എന്നിട്ടും യഹോവ നിങ്ങളുടെ പിതാക്കന്മാരോടു പ്രിയം തോന്നി അവരെ സ്നേഹിച്ചു; അവർക്കുശേഷം അവരുടെ സന്തതിയായ നിങ്ങളെ സകല ജനതകളിൽനിന്നും തിരഞ്ഞെടുത്തു—ഇന്നുള്ളതുപോലെതന്നെ.[a]
  to: എന്നിരുന്നാലും, നിങ്ങളുടെ പിതാക്കന്മാരെ സ്നേഹിക്കാനായി യഹോവ അവരോടു മമത പുലർത്തി; അവർക്കുശേഷം അവരുടെ സന്തതിയായ നിങ്ങളെ സകല ജനതകളിൽനിന്നും തിരഞ്ഞെടുത്തു—ഇന്നുള്ളതുപോലെതന്നെ.[a]
  rationale: The revision retains the adversative-emphatic force of רַק with ‘എന്നിരുന്നാലും,’ renders חָשַׁק as affectionate attachment (‘മമത പുലർത്തി’), and explicitly preserves the infinitive relationship in ‘സ്നേഹിക്കാനായി.’ It retains the appositional identification of the offspring as ‘നിങ്ങളെ,’ the separative sense of ‘സകല ജനതകളിൽനിന്നും,’ and the present-confirming idiom ‘ഇന്നുള്ളതുപോലെതന്നെ.’
