id: DEU.10.13
reference: Deuteronomy 10:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/שְׁמֹ֞ר אֶת מִצְוֺ֤ת יְהוָה֙ וְ/אֶת חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְ/ט֖וֹב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/013.yaml
  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: ml
  text: നിന്റെ നന്മയ്ക്കായി ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്ന യഹ്‌വേയുടെ കല്പനകളും അവിടുത്തെ ചട്ടങ്ങളും പാലിക്കേണ്ടതുമല്ലയോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാലിക്കുക’ എന്നതിന് ‘ആചരിക്കുക’ അല്ലെങ്കിൽ ‘കാത്തുസൂക്ഷിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: പാലിക്കേണ്ടതും
  rationale: ל ചേർന്ന infinitive construct മുൻവാക്യത്തിലെ യഹ്‌വേ ആവശ്യപ്പെടുന്ന കാര്യങ്ങളുടെ തുടർച്ചയായ ഉള്ളടക്കം സൂചിപ്പിക്കുന്നു. ‘പാലിക്കുക’ അനുസരണത്തിന്റെയും പ്രായോഗികമായി ആചരിക്കുന്നതിന്റെയും ഉടമ്പടിപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִצְוֺת
  choice: കല്പനകളും
  rationale: מִצְוָה എന്നതിന്റെ ബഹുവചന construct രൂപം യഹ്‌വേ നൽകിയ നിർബന്ധിത കല്പനകളെ സൂചിപ്പിക്കുന്നു; ‘കല്പനകൾ’ നിയമപരവും ഉടമ്പടിപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: חֻקֹּתָיו
  choice: അവിടുത്തെ ചട്ടങ്ങളും
  rationale: നിയമമായി നിശ്ചയിച്ച വ്യവസ്ഥകളെ സൂചിപ്പിക്കുന്ന חֻקִּים എന്ന പദത്തിന് ‘ചട്ടങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമായ നിയമ-ഉടമ്പടി പദമാണ്; ആദരസൂചകമായ ‘അവിടുത്തെ’ യഹ്‌വേയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്ന
  rationale: ബന്ധവാക്യം കല്പനകളെയും ചട്ടങ്ങളെയും വിശേഷിപ്പിക്കുന്നു. വർത്തമാനകാല രൂപം participle-ന്റെ ഇപ്പോഴത്തെ ഉടമ്പടിപരമായ അടിയന്തരത നിലനിർത്തുന്നു.
- source_word: לְטוֹב לָךְ
  choice: നിന്റെ നന്മയ്ക്കായി
  rationale: ഈ പ്രയോഗം ഇസ്രായേലിന്റെ ഗുണത്തിനോ ക്ഷേമത്തിനോ വേണ്ടിയുള്ള ലക്ഷ്യം/ഫലം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇത് സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: വാക്യത്തിന്റെ ചോദ്യരൂപവും മുൻവാക്യത്തോടുള്ള ബന്ധവും
  choice: ‘പാലിക്കേണ്ടതുമല്ലയോ?’ എന്ന ചോദ്യതുടർച്ച
  alternative: സ്വതന്ത്ര ആജ്ഞയായി ‘പാലിക്കുക’
  rationale: ഈ വാക്യം 10:12-ൽ ആരംഭിക്കുന്ന ‘യഹ്‌വേ നിന്നോട് ആവശ്യപ്പെടുന്നത് എന്ത്?’ എന്ന ചോദ്യത്തിന്റെ അവസാന ഘടകമാണ്. അതിനാൽ മൂലത്തിലെ infinitive ഘടനയെ സ്വതന്ത്ര ആജ്ഞയാക്കി മാറ്റാതെ ചോദ്യതുടർച്ചയായി നിലനിർത്തി.
- issue: לְטוֹב לָךְ ഏതിനോടാണ് ചേർന്നു നിൽക്കുന്നത്
  choice: പാലിക്കലിന്റെ ഗുണകരമായ ലക്ഷ്യം മുൻനിർത്തുന്ന സ്വാഭാവിക സ്ഥാനം
  alternative: ‘നിന്റെ നന്മയ്ക്കായി ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്ന’ എന്ന ക്രമം
  rationale: ഹീബ്രു വാക്യാവസാനത്തിലെ പ്രയോഗം കല്പനകൾ നൽകുന്നതും അവ പാലിക്കുന്നതും ഇസ്രായേലിന്റെ നന്മയ്ക്കാണെന്ന വിശാലമായ അർഥം അനുവദിക്കുന്നു. മലയാളക്രമം അർഥം സ്വാഭാവികമാക്കുന്നു; ദൈവിക ആവശ്യത്തിന്റെ ഗുണകരമായ ഉദ്ദേശ്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നിന്നോട്/നിന്റെ’ ഹീബ്രുവിലെ ഏകവചന രൂപം നിലനിർത്തുന്നു. വാക്യം 10:12-ലെ ചോദ്യത്തിന്റെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ ചോദ്യചിഹ്നം ഉപയോഗിച്ചു.
