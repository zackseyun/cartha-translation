  source_fidelity: 'ലְטוֹב לָךְ എന്ന വാക്യാവസാന പ്രയോഗം ഏറ്റവും നേരിട്ട് ‘ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്ന’ എന്ന ബന്ധവാക്യത്തോടാണ് ചേർന്നുനിൽക്കുന്നത്: യഹ്‌വേ കല്പനകളും ചട്ടങ്ങളും നിന്റെ നന്മയ്ക്കായി കല്പിക്കുന്നു. നിലവിലെ പദക്രമത്തിൽ അത് പ്രധാനമായും ‘പാലിക്കൽ’ ന്റെ ഉദ്ദേശ്യമായി വായിക്കപ്പെടുന്നു. ഈ വ്യത്യാസം പരിഹരിക്കാൻ പദക്രമം മാറ്റണം. ചോദ്യതുടർച്ചയും ഏകവചന അഭിസംബോധനയും യഹ്‌വേ എന്ന നാമരൂപവും ശരിയാണ്.'
