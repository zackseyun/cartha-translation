reference: Deuteronomy 10:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: ml
  text: ഇപ്പോൾ, ഇസ്രായേലേ, നിന്റെ ദൈവമായ യാഹ്‌വേ നിന്നോട് ആവശ്യപ്പെടുന്നത് എന്താണ്? നിന്റെ ദൈവമായ യാഹ്‌വേയെ ഭയപ്പെടുക[a], അവന്റെ എല്ലാ വഴികളിലും നടക്കുക, അവനെ സ്നേഹിക്കുക, നിന്റെ പൂർണഹൃദയത്തോടും പൂർണപ്രാണനോടുംകൂടെ[b] നിന്റെ ദൈവമായ യാഹ്‌വേയെ സേവിക്കുക—ഇതല്ലാതെ മറ്റെന്താണ്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ഭയപ്പെടുക’ എന്നത് ഭക്ത്യാദരം, വിസ്മയം, അനുസരണപൂർവമായ സമർപ്പണം എന്നിവയും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിന്റെ പൂർണജീവനോടുംകൂടെ’ അല്ലെങ്കിൽ ‘നിന്റെ മുഴുവൻ അസ്തിത്വത്തോടുംകൂടെ’; എബ്രായത്തിലെ നെഫെഷ് എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് പ്രാണൻ, ജീവൻ, വ്യക്തി എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മോശെയുടെ ഉപദേശത്തിലെ പുതിയ ആഹ്വാനം അവതരിപ്പിക്കുന്ന സംഭാഷണസൂചകം; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇപ്പോൾ’ എന്നു നൽകി.
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: നിന്നോട് ആവശ്യപ്പെടുന്നത് എന്താണ്?
  rationale: שׁאל + מֵעִם ഇവിടെ ബാധ്യത ഉൾക്കൊള്ളുന്ന ചോദിക്കൽ/ആവശ്യപ്പെടൽ സൂചിപ്പിക്കുന്നു. വാക്യത്തിന്റെ ഉടമ്പടിപരമായ ബലം നിലനിർത്താൻ ‘ആവശ്യപ്പെടുന്നു’ തെരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: כִּי אִם
  choice: ഇതല്ലാതെ മറ്റെന്താണ്?
  rationale: ആവശ്യപ്പെടുന്ന കാര്യങ്ങളുടെ പരിധി വ്യക്തമാക്കുന്ന പ്രയോഗം. ഹീബ്രു വാചകത്തിന്റെ വാഗ്മിതാപരമായ ചോദ്യരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְיִרְאָה
  choice: ഭയപ്പെടുക
  rationale: ഉടമ്പടിസന്ദർഭത്തിലെ ഭക്ത്യാദരവും വിസ്മയവും അനുസരണവും ഉൾപ്പെടുന്നുവെങ്കിലും, മൂലപദത്തിന്റെ ഗൗരവവും ദൈവഭയത്തിന്റെ സംഘർഷവും സംരക്ഷിക്കാൻ ‘ഭയപ്പെടുക’ ഉപയോഗിച്ചു.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: അവന്റെ എല്ലാ വഴികളിലും നടക്കുക
  rationale: ജീവിതനടപ്പിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതായതിനാൽ അതേപടി നിലനിർത്തി.
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: അവനെ സ്നേഹിക്കുക
  rationale: ദൈവത്തോടുള്ള ഉടമ്പടിപരവും ഹൃദയപൂർവവുമായ സ്നേഹം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלַעֲבֹד
  choice: സേവിക്കുക
  rationale: עבד ആരാധന ഉൾപ്പെടുന്ന വിശാലമായ അനുസരണസേവനത്തെ സൂചിപ്പിക്കുന്നു; ‘ആരാധിക്കുക’ എന്നു മാത്രം നൽകുന്നത് അർഥം ചുരുക്കും.
- source_word: בְּכָל לְבָבְךָ
  choice: നിന്റെ പൂർണഹൃദയത്തോടും
  rationale: לֵבָב മനസ്സ്, ഇച്ഛ, ആന്തരിക വ്യക്തിത്വം എന്നിവ ഉൾക്കൊള്ളുന്നു; ‘പൂർണഹൃദയം’ മലയാളത്തിൽ സ്വാഭാവികമായ സമഗ്രസമർപ്പണം സൂചിപ്പിക്കുന്നു.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: പൂർണപ്രാണനോടുംകൂടെ
  rationale: נֶפֶשׁ പ്രാണൻ, ജീവൻ, സ്വയം എന്നീ അർഥവ്യാപ്തികൾക്കുള്ളതാണ്. ‘പ്രാണൻ’ പരമ്പരാഗത ഗൗരവവും ജീവൻ മുഴുവനെന്ന ആശയവും നിലനിർത്തുന്നു; പാദക്കുറിപ്പിൽ വ്യത്യസ്ത സാധ്യത വ്യക്തമാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിച്ചില്ല. മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം തെരഞ്ഞെടുത്തു.
- issue: ഉടമ്പടിപരമായ ירא എന്ന ക്രിയയുടെ ബലം
  choice: ഭയപ്പെടുക
  alternative: ഭക്ത്യാദരവോടെ വണങ്ങുക
  rationale: ഭക്ത്യാദരവും വിസ്മയവും അനുസരണവും ഉൾപ്പെടുന്നുണ്ടെങ്കിലും ‘ഭയം’ എന്ന മൂലഘടകം മായ്ച്ചുകളയാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ മനുഷ്യശാസ്ത്രപരമായ വ്യാപ്തി
  choice: പ്രാണൻ
  alternative: ജീവൻ; മുഴുവൻ വ്യക്തിത്വം
  rationale: ഒരു പ്രത്യേക ദ്വൈതവാദ മനുഷ്യശാസ്ത്രം വാക്യത്തിൽ നിർബന്ധിച്ച് ചുമത്താതെ, പദത്തിന്റെ പരമ്പരാഗത അർഥവും ജീവൻ/സ്വയം എന്ന വ്യാപ്തിയും പാദക്കുറിപ്പിലൂടെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഇസ്രായേലിനെ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്ന ഹീബ്രു രൂപം ‘നിന്റെ’ എന്നതിലൂടെ നിലനിർത്തി. ക്രിയാപട്ടികയിലെ സമാന്തരതയും അവസാനത്തെ വാഗ്മിതാപരമായ പരിധിനിർണ്ണയവും മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിന് അനുസരിച്ച് ക്രമപ്പെടുത്തി.
