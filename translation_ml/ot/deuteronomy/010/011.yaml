reference: Deuteronomy 10:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י ק֛וּם לֵ֥ךְ לְ/מַסַּ֖ע לִ/פְנֵ֣י הָ/עָ֑ם וְ/יָבֹ֨אוּ֙ וְ/יִֽרְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: ml
  text: 'യഹ്‌വെ എന്നോടു പറഞ്ഞു: “എഴുന്നേറ്റ്, ജനത്തിന് മുന്നിലായി യാത്ര പുറപ്പെടുക[a]; ഞാൻ അവരുടെ പിതാക്കന്മാർക്കു കൊടുക്കുമെന്ന് സത്യം ചെയ്ത ദേശത്തേക്കു അവർ കടന്നുചെന്ന് അതു കൈവശമാക്കേണ്ടതിന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജനത്തിനു മുന്നിലായി”; സന്ദർഭത്തിൽ ജനത്തെ മുന്നിൽനിന്നു നയിക്കുക എന്ന ആശയവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ടു പകരംവയ്ക്കാതെ, ഹീബ്രു ഉച്ചാരണത്തിന്റെ സാധാരണ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: קוּם לֵךְ לְמַסַּע
  choice: എഴുന്നേറ്റ് … യാത്ര പുറപ്പെടുക
  rationale: തുടർച്ചയായ ആജ്ഞകളുടെയും യാത്ര ആരംഭിക്കുന്നതിന്റെയും അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי הָעָם
  choice: ജനത്തിന്റെ മുമ്പിലായി
  rationale: ഈ പ്രയോഗത്തിന്റെ സ്ഥലപരമായ ‘മുമ്പിൽ/മുന്നിൽ’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ മുന്നിൽ നയിക്കുക എന്ന സൂചന ഉണ്ടെങ്കിലും അതു മുഖ്യവാചകത്തിൽ നിർബന്ധിതമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: וְיָבֹאוּ וְיִרְשׁוּ
  choice: അവർ കടന്നുചെന്ന് അതു കൈവശമാക്കട്ടെ
  rationale: ദേശത്തേക്കുള്ള പ്രവേശനവും അതിന്റെ യഥാർഥ അധീനതയും എന്ന രണ്ടു ചലനങ്ങളും വേർതിരിച്ചു നിലനിർത്തുന്നു; ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ഉദ്ദേശ്യ/ഫലഭാവം ‘-ട്ടെ’ രൂപത്തിൽ നൽകുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിലെ സന്ദർഭത്തിൽ വാഗ്ദത്തഭൂമിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പദം.
- source_word: נִשְׁבַּעְתִּי
  choice: ഞാൻ … സത്യം ചെയ്ത
  rationale: ദൈവിക പ്രതിജ്ഞയുടെ ശക്തി ചുരുക്കാതെയും അധിക വ്യാഖ്യാനം ചേർക്കാതെയും അവതരിപ്പിക്കുന്നു.
- source_word: לַאֲבֹתָם
  choice: അവരുടെ പിതാക്കന്മാർക്ക്
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചന കുടുംബപദവും ചരിത്രപരമായ പിതൃപുരുഷസൂചനയും നിലനിർത്തുന്നു.
- source_word: לָתֵת לָהֶם
  choice: അവർക്ക് കൊടുക്കുമെന്ന്
  rationale: നൽകുമെന്ന പ്രതിജ്ഞയുടെ ലക്ഷ്യവും സ്വീകരിക്കുന്നവരെയും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യ്ഹ്വ്ഹ് എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ടു പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; പ്രത്യേക സമുദായപരമായ ഉച്ചാരണവാദം വിശദീകരിച്ച് ചുമത്തുന്നില്ല.
- issue: לַאֲבֹתָם എന്നതിന്റെ ലിംഗവും ചരിത്രസൂചനയും
  choice: അവരുടെ പിതാക്കന്മാർക്ക്
  alternative: അവരുടെ പൂർവികർക്ക്
  rationale: മൂലത്തിലെ ‘പിതാക്കന്മാർ’ എന്ന രൂപം സംരക്ഷിക്കുന്നു; വിപുലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: וְיָבֹאוּ וְיִרְשׁוּ എന്നതിലെ ഭാവം
  choice: അവർ കടന്നുചെന്ന് അതു കൈവശമാക്കട്ടെ
  alternative: അവർ കടന്നുചെന്ന് അതു കൈവശമാക്കേണ്ടതിന്
  rationale: ഹീബ്രു തുടർച്ചയായ ക്രിയാരൂപം ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം; മലയാളത്തിലെ ഈ ആജ്ഞാനുബന്ധ രൂപം രണ്ടിനുമിടയിലെ സംഘർഷം അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എഴുന്നേറ്റ്’, ‘സത്യം ചെയ്ത’, ‘കൈവശമാക്കട്ടെ’ എന്നീ രൂപങ്ങൾ വാക്യത്തിന്റെ ആജ്ഞാപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്നു; അനാവശ്യമായ പുരാതന പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
