source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: ml
  text: എന്തെന്നാൽ നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ ദേവന്മാരുടെ ദൈവവും കർത്താക്കന്മാരുടെ കർത്താവും മഹാനും ശക്തനും ഭയാദരം ഉണർത്തുന്നവനായ[a] ദൈവവുമാകുന്നു; അവിടുന്ന് പക്ഷപാതം കാണിക്കുകയോ കൈക്കൂലി വാങ്ങുകയോ ചെയ്യുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഭയപ്പെടേണ്ടവൻ” അല്ലെങ്കിൽ “ഭയങ്കരൻ.” ഹീബ്രുപദം ഭയാദരം ഉണർത്തുന്നവനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള ആഹ്വാനത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ഹീബ്രു ബന്ധകത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: ദേവന്മാരുടെ ദൈവം
  rationale: ഹീബ്രു സംയുക്തപദക്രമം നിലനിർത്തി ദൈവിക പരമാധികാരത്തിന്റെ പ്രഖ്യാപനം സംരക്ഷിക്കുന്നു; മറ്റു ദേവന്മാരുടെ സ്വഭാവത്തെക്കുറിച്ച് വാക്യം പറയാത്തത് വിവർത്തനം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: കർത്താക്കന്മാരുടെ കർത്താവ്
  rationale: മുൻപുള്ള സമാന്തരപ്രയോഗത്തിന്റെ ഘടനയും പരമാധികാരത്തിന്റെ ആശയവും നിലനിർത്തുന്നു.
- source_word: הַגָּדֹל הַגִּבֹּר וְהַנּוֹרָא
  choice: മഹാനും ശക്തനും ഭയഭക്തി ഉണർത്തുന്നവനും
  rationale: മൂന്നു ദൈവിക വിശേഷണങ്ങളുടെ ഉയർന്ന ശൈലിയും, נורא സൂചിപ്പിക്കുന്ന ഭയാദരവുണർത്തുന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: പക്ഷപാതം കാണിക്കാത്തവൻ
  rationale: ‘മുഖം ഉയർത്തുന്നില്ല’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ നീതിന്യായസംബന്ധമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: കൈക്കൂലി വാങ്ങാത്തവൻ
  rationale: നിയമ-ധാർമിക ശക്തി നഷ്ടപ്പെടാതെ നേരിട്ടും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിലും പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ‘ദേവന്മാരുടെ ദൈവം, കർത്താക്കന്മാരുടെ കർത്താവ്’ എന്ന പരമ്പര മറ്റു ദേവന്മാരുടെ അസ്തിത്വത്തെ അംഗീകരിക്കുന്നതായി വിശദീകരിക്കണോ എന്നത്
  choice: ഹീബ്രുവിലെ പരമാധികാരസൂത്രം അതേ ഘടനയിൽ നിലനിർത്തി
  alternative: ‘എല്ലാ ദേവന്മാർക്കും കർത്താക്കന്മാർക്കും മീതെയുള്ള ദൈവം’
  rationale: മൂലപാഠത്തിന്റെ ശക്തമായ താരതമ്യഭാഷ സംരക്ഷിക്കുകയും അത് ഉന്നയിക്കാത്ത സത്താശാസ്ത്ര വിശദീകരണം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വ്യക്തിനാമം പദവിയായി മാറ്റാതെ, സാധാരണമായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: וְהַנּוֹרָא എന്ന വിശേഷണത്തിലെ ഭയവും ആദരവും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: ഭയഭക്തി ഉണർത്തുന്നവൻ
  alternative: ഭയങ്കരൻ; വിസ്മയാവഹൻ
  rationale: കഠിനഭീതിയിലേക്കു മാത്രം ചുരുക്കാതെയും ലഘുവായ വിസ്മയമായി മൃദൂകരിക്കാതെയും ഭയാദരത്തിന്റെ ഇരട്ടനിറം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും വായിക്കാൻ എളുപ്പമുള്ളതുമായ ശൈലി. ദൈവിക പദവികളുടെ സമാന്തരതയും വാക്യത്തിന്റെ നിയമ-ധാർമിക സമാപനവും നിലനിർത്തിയിരിക്കുന്നു.
