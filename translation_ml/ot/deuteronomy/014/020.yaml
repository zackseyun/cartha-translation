  text: You may eat any clean bird[a].
translation:
  language: ml
  text: ശുദ്ധമായ ഏതു പക്ഷിയെയും നിങ്ങൾക്കു ഭക്ഷിക്കാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “ശുദ്ധമായ എല്ലാ പക്ഷികളെയും നിങ്ങൾ ഭക്ഷിക്കാം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: ഏതു …-യെയും
  rationale: അനുവാദം സൂചിപ്പിക്കുന്ന വാക്യത്തിൽ, നിർദിഷ്ട വിഭാഗത്തിനുള്ളിലെ നിയന്ത്രണമില്ലാത്ത വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: עוֹף
  choice: പക്ഷി
  rationale: ഈ ഭക്ഷണനിയമങ്ങളുടെ തൊട്ടടുത്ത സന്ദർഭം പക്ഷികളെപ്പറ്റിയുള്ളതിനാൽ, വിശാലമായി ‘പറക്കുന്ന ജീവി’ എന്നതിനെക്കാൾ ‘പക്ഷി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: טָהוֹר
  choice: ശുദ്ധമായ
  rationale: ഇവിടെ ധാർമികമോ ഭൗതികമോ ആയ പരിശുദ്ധിയല്ല, ഭക്ഷണനിയമത്തിലെ ആചാരപരമായ ‘ശുദ്ധ’ വിഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: תֹּאכֵלוּ
  choice: നിങ്ങൾക്കു ഭക്ഷിക്കാം
  rationale: നിരോധിക്കപ്പെട്ടവയോടുള്ള വ്യത്യാസത്തിൽ ഈ ക്രിയാരൂപം അനുവാദമാണ് പ്രകടിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ഭക്ഷിക്കാം’ അതിന്റെ നിയമപരമായ അനുവദനീയത സ്വാഭാവികമായി നൽകുന്നു.
