source:
  edition: WLC
  text: מִ/קְצֵ֣ה שָׁלֹ֣שׁ שָׁנִ֗ים תּוֹצִיא֙ אֶת כָּל מַעְשַׂר֙ תְּבוּאָ֣תְ/ךָ֔ בַּ/שָּׁנָ֖ה הַ/הִ֑וא וְ/הִנַּחְתָּ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: ml
  text: ഓരോ മൂന്നുവർഷക്കാലത്തിന്റെ അവസാനത്തിൽ[b], ആ വർഷത്തെ നിന്റെ വിളവിന്റെ ദശാംശം മുഴുവനും പുറത്തുകൊണ്ടുവന്ന് നിന്റെ പട്ടണങ്ങളിൽ[a] സൂക്ഷിച്ചുവെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ.’ ഇവിടെ ഈ എബ്രായ പ്രയോഗം ഒരാളുടെ അധികാരപരിധിയിലുള്ള പ്രാദേശിക പട്ടണങ്ങളെയോ വാസസ്ഥലങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ ‘ഓരോ മൂന്നാം വർഷത്തിലും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: മൂന്നു വർഷം തികയുമ്പോൾ
  rationale: കാലയളവ് അതിന്റെ അറ്റത്തിലെത്തുന്ന സമയത്തെയാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ആവർത്തിച്ചുവരുന്ന മൂവർഷക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ഇതിലൂടെ വ്യക്തമാകുന്നു; ‘ഓരോ മൂന്നാം വർഷത്തിലും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תּוֹצִיא
  choice: പുറത്തുകൊണ്ടുവന്ന്
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘പുറത്തേക്കു കൊണ്ടുവരുക’ എന്ന മൂർത്തമായ അർഥം നിലനിർത്തുന്നു.
- source_word: כָּל מַעְשַׂר
  choice: ദശാംശം മുഴുവനും
  rationale: നൽകേണ്ട പത്തിലൊന്നിന്റെ സമ്പൂർണതയെ כָּל ഊന്നിപ്പറയുന്നു; ‘മുഴുവനും’ ആ ഊന്നൽ സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: תְּבוּאָתְךָ
  choice: നിന്റെ വിളവ്
  rationale: תְּבוּאָה ഭൂമിയിൽനിന്നുള്ള കാർഷിക ഉൽപ്പാദനത്തെയോ ആദായത്തെയോ സൂചിപ്പിക്കുന്നു. ധാന്യത്തിൽ മാത്രം അർഥം ചുരുക്കാതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദമാണ് ‘വിളവ്’.
- source_word: בַּשָּׁנָה הַהִוא
  choice: ആ വർഷത്തെ
  rationale: പ്രസ്തുത വർഷത്തിൽ ലഭിച്ച വിളവിനോടാണ് ദശാംശം ബന്ധപ്പെട്ടിരിക്കുന്നത് എന്ന ബന്ധം മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി പ്രകടമാക്കുന്നു.
- source_word: וְהִנַּחְתָּ
  choice: സൂക്ഷിച്ചുവെക്കണം
  rationale: വെക്കുക, നിക്ഷേപിക്കുക എന്ന ക്രിയാർഥവും തുടർവിതരണത്തിനായി പ്രാദേശികമായി സംഭരിക്കുന്ന സന്ദർഭവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: בִּשְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണങ്ങളിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ’ എന്നാണെങ്കിലും, എബ്രായത്തിൽ പട്ടണകവാടം പട്ടണത്തെയോ പ്രാദേശിക സമൂഹത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ലക്ഷ്യഭാഷയിൽ ഉദ്ദേശ്യാർഥം നേരിട്ട് നൽകുകയും അക്ഷരാർഥ ചിത്രം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
