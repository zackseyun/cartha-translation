translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ’ നിലനിർത്തി. എബ്രായത്തിലെ പട്ടണകവാടം എന്ന സാംസ്കാരിക പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യാർഥം മുഖ്യപാഠത്തിലും അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകി.
