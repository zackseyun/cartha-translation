theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: അവസാനത്തെ כִּי എന്നതിന്റെ ബന്ധം
  choice: 'കാലാർഥം: ‘അനുഗ്രഹിക്കുമ്പോൾ’'
  alternative: 'കാരണാർഥം: ‘അനുഗ്രഹിക്കുന്നതിനാൽ’'
  rationale: ദൈവാനുഗ്രഹത്താൽ ലഭിച്ച സമൃദ്ധിയാണ് ഗതാഗതപ്രശ്നത്തിന്റെ സാഹചര്യമെന്ന നിലയിൽ കാലാർഥം വാക്യപ്രവാഹത്തിന് യോജിക്കുന്നു; ഹീബ്രുവിലെ യഥാർഥ കാരണാർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ദീർഘമായ ഉപാധിവാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പുനഃക്രമീകരിച്ചു. വാക്യം 25-ാം വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാനത്തിൽ പൂർണ്ണവിരാമത്തിനു പകരം ദീർഘവിരാമവും കോമയും നിലനിർത്തി.
