  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി സ്വീകരിച്ചു. പക്ഷിനാമങ്ങളിലെ യഥാർഥമായ ശാസ്ത്രീയ അനിശ്ചിതത്വം ഒരൊറ്റ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി; മുഖ്യപാഠം വായിക്കാൻ സ്വാഭാവികമായി നിലനിർത്തി.
