  text: the ostrich[a], the hawk, the gull, and the falcon according to its kind[b],
translation:
  language: ml
  text: ഒട്ടകപ്പക്ഷി[a], പരുന്ത്, കടൽക്കാക്ക, അതിന്റെ ഇനങ്ങൾ ഉൾപ്പെടെ ഫാൽക്കൺ എന്നിവയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലെ പല പക്ഷികളുടെയും കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ‘പരുന്ത്’ എന്നു പരിഭാഷപ്പെടുത്തിയ תַּחְמָס മൂങ്ങയെയോ മറ്റൊരു പക്ഷിയെയോ സൂചിപ്പിക്കാം; ‘കടൽക്കാക്ക’ എന്നു പരിഭാഷപ്പെടുത്തിയ שָׁחַף കുയിൽ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്; ‘ഫാൽക്കൺ’ എന്നു പരിഭാഷപ്പെടുത്തിയ נֵץ പരുന്തിനെയോ മറ്റൊരു ഇരപിടിയൻ പക്ഷിയെയോ സൂചിപ്പിക്കാം. ‘ഒട്ടകപ്പക്ഷി’ എന്നതിനുള്ള എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘യഅനയുടെ മകൾ’ എന്നാണ്; ഇവിടെ അത് ഒട്ടകപ്പക്ഷിയെ സൂചിപ്പിക്കുന്ന ഒരു ഇനനാമമാണ്.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: ഒട്ടകപ്പക്ഷി
  rationale: അക്ഷരാർഥത്തിൽ ‘യഅനയുടെ മകൾ’ എന്നാണെങ്കിലും, ജന്തുപട്ടികയിൽ ഇത് ഒരു പക്ഷിവർഗത്തിന്റെ പേരായുള്ള എബ്രായ പ്രയോഗമാണ്. മരുഭൂമിയുമായി ബന്ധപ്പെട്ട പക്ഷി എന്ന സൂചനയും ആധുനിക നിഘണ്ടുവിലയിരുത്തലും കണക്കിലെടുത്ത് ‘ഒട്ടകപ്പക്ഷി’ എന്നു നൽകി.
- source_word: הַתַּחְמָס
  choice: പരുന്ത്
  rationale: പക്ഷിയുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ഇരപിടിയൻ പക്ഷിയെ സൂചിപ്പിക്കുന്ന സാദ്ധ്യതയുള്ള സ്വാഭാവിക മലയാളപദമായി ‘പരുന്ത്’ തിരഞ്ഞെടുത്തു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: הַשָּׁחַף
  choice: കടൽക്കാക്ക
  rationale: ആധുനിക നിഘണ്ടുക്കൾ ഈ ദുഷ്കരമായ പദത്തെ സാധാരണയായി കടൽക്കാക്കയോ സമാനമായ കടൽപ്പക്ഷിയോ ആയി ബന്ധിപ്പിക്കുന്നു. പഴയ ‘കുയിൽ’ എന്ന പാരമ്പര്യപരിഭാഷയെക്കാൾ ഇതാണ് സാദ്ധ്യതയുള്ളത്.
- source_word: הַנֵּץ
  choice: പ്രാപ്പിടിയൻ
  rationale: ഇരപിടിയൻ പക്ഷിയെ സൂചിപ്പിക്കുന്ന പദമാണിത്; പരുന്തിനെയോ ഫാൽക്കണിനെയോ കുറിക്കാം. അതേ വാക്യത്തിലെ תַּחְמָס എന്ന പദത്തിൽനിന്ന് വേർതിരിക്കാനും വിശാലമായ അർഥം നിലനിർത്താനും ‘പ്രാപ്പിടിയൻ’ എന്നു നൽകി.
- source_word: לְמִינֵהוּ
  choice: അതതു വർഗത്തിലുള്ള
  rationale: ഒരു ജീവിയെയും അതുമായി ബന്ധപ്പെട്ട ഇനങ്ങളെയും ഉൾക്കൊള്ളുന്ന എബ്രായ വർഗീകരണസൂത്രം. മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമായ രൂപം.
