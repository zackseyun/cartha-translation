source:
  edition: WLC
  text: וְ/זֶ֕ה אֲשֶׁ֥ר לֹֽא תֹאכְל֖וּ מֵ/הֶ֑ם הַ/נֶּ֥שֶׁר וְ/הַ/פֶּ֖רֶס וְ/הָֽ/עָזְנִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/012.yaml
  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: ml
  text: 'അവയിൽനിന്ന് നിങ്ങൾ തിന്നാൻ പാടില്ലാത്തവ ഇവയാണ്: കഴുകൻ[a], താടിയുള്ള കഴുകൻ, കറുത്ത കഴുകൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലെ എബ്രായ പക്ഷിനാമങ്ങളുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ‘കഴുകൻ’ വലിയൊരു ശവഭോജി പക്ഷിയെയും സൂചിപ്പിച്ചേക്കാം; ‘താടിയുള്ള കഴുകൻ’ പരമ്പരാഗതമായി ‘ഓസിഫ്രേജ്’ എന്നാണ് അറിയപ്പെട്ടിരുന്നത്; ‘കറുത്ത കഴുകൻ’ എന്നതിന് ചിലർ ‘മീൻപരുന്ത്’ അല്ലെങ്കിൽ ‘കടൽക്കഴുകൻ’ എന്നും നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: ഇവയാണ്
  rationale: രൂപത്തിൽ ഏകവചനമായ ‘ഇതാകുന്നു’ എന്ന പ്രയോഗം ഇവിടെ ഒരു പട്ടികയെ പരിചയപ്പെടുത്തുന്നതിനാൽ, സ്വാഭാവികമായ മലയാളത്തിൽ ബഹുവചനമായ ‘ഇവയാണ്’ എന്നു നൽകി.
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: അവയിൽനിന്ന് നിങ്ങൾ തിന്നരുതാത്തവ
  rationale: നിരോധനത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവവും מִן എന്നതിന്റെ വിഭാഗത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്ന അംശാർത്ഥവും നിലനിർത്തുന്നു.
- source_word: הַנֶּשֶׁר
  choice: കഴുകൻ
  rationale: പരമ്പരാഗതവും പൊതുവേ മനസ്സിലാകുന്നതുമായ പദം; എബ്രായപദം വലിയൊരു ശവഭോജി പക്ഷിയെയും സൂചിപ്പിച്ചേക്കാമെന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: הַפֶּרֶס
  choice: താടിക്കഴുകൻ
  rationale: അസ്ഥിഭോജിയായ bearded vulture/lammergeier എന്ന ആധുനിക തിരിച്ചറിയൽ വ്യക്തമായി നൽകുന്നു; പഴയ ‘ossifrage’ എന്ന പേരിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: הָעָזְנִיָּה
  choice: കറുത്ത കഴുകൻ
  rationale: പക്ഷിവർഗത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ വിവാദമാണെങ്കിലും, പ്രചാരത്തിലുള്ള ആധുനിക പണ്ഡിതപരമായ തിരിച്ചറിയൽ പിന്തുടരുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
