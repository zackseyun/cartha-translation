reference: Deuteronomy 14:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/לֵּוִ֥י אֲשֶׁר בִּ/שְׁעָרֶ֖י/ךָ לֹ֣א תַֽעַזְבֶ֑/נּוּ כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: ml
  text: നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന ലേവ്യനെ ഉപേക്ഷിക്കരുത്[a]; കാരണം, നിന്നോടൊപ്പം അവന് ഓഹരിയോ അവകാശഭൂമിയോ ഇല്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉപേക്ഷിക്കരുത്’ എന്നതിന് ‘കൈവിടരുത്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, മറ്റു ഇസ്രായേൽ ഗോത്രങ്ങൾക്കുള്ളതുപോലെയുള്ള സാധാരണ ഗോത്രഭൂവിഹിതം ലേവ്യന് ഇല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: ലേവ്യനെ
  rationale: നിശ്ചിത ഏകവചനം ഇവിടെ ലേവ്യവർഗത്തിലെ ഒരു പ്രതിനിധിയെ സൂചിപ്പിക്കുന്നു. ‘ലേവ്യൻ’ എന്നത് കൃത്യമാണ്; ‘പുരോഹിതൻ’ എന്നു ചേർക്കുന്നത് എല്ലാ ലേവ്യരും പുരോഹിതന്മാരാണെന്ന അതിവിവർത്തനം വരുത്തും.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിലുള്ള’ എന്നാണെങ്കിലും, ഈ എബ്രായ പ്രയോഗം ഒരാളുടെ പട്ടണങ്ങളെയോ പ്രാദേശിക സമൂഹങ്ങളെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא תַעַזְבֶנּוּ
  choice: ഉപേക്ഷിക്കരുത്
  rationale: עזב എന്ന ക്രിയയ്ക്ക് വിട്ടുകളയുക, ഉപേക്ഷിക്കുക, കൈവിടുക എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ലേവ്യനുവേണ്ട കരുതലും സഹായവും നൽകാതെ കൈവിടരുതെന്ന കല്പനയാണ്; ‘ഉപേക്ഷിക്കരുത്’ അതിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: കല്പനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: אֵין לוֹ
  choice: അവന് ... ഇല്ല
  rationale: എബ്രായ അസ്തിത്വനിഷേധ ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: חֵלֶק וְנַחֲלָה
  choice: ഓഹരിയോ അവകാശഭൂമിയോ
  rationale: חֵלֶק ഒരു പങ്കിനെയോ ഓഹരിയെയോ, נַחֲלָה പാരമ്പര്യമായി ലഭിക്കുന്ന ഭൂസ്വത്തിനെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ നിഷേധവാക്യത്തിനൊപ്പം ‘-യോ ... -യോ’ ഉപയോഗിക്കുന്നത് രണ്ടു പദങ്ങളുടെയും വ്യത്യാസവും സംയുക്തമായ അഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עִמָּךְ
  choice: നിന്നോടൊപ്പം
  rationale: മറ്റു ഇസ്രായേല്യരോടൊപ്പം ലേവ്യന് ഭൂവിഹിതമില്ലെന്ന ബന്ധപരമായ ആശയം നിലനിർത്തുന്ന നേരിട്ടുള്ള വിവർത്തനം.
theological_decisions:
- issue: ലേവ്യന് ഇല്ലാത്ത ഓഹരിയുടെയും അവകാശത്തിന്റെയും സ്വഭാവം
  choice: ഇസ്രായേലിലെ സാധാരണ ഗോത്രഭൂവിഹിതം ലേവ്യന് ഇല്ലെന്നാണ് വാക്യം സൂചിപ്പിക്കുന്നത്.
  alternative: പൊതുവായ സാമൂഹിക പാർശ്വവൽക്കരണം മാത്രമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
  rationale: ആവർത്തനപുസ്തകത്തിലെ പശ്ചാത്തലത്തിൽ ‘ഓഹരിയും അവകാശഭൂമിയും’ എന്ന പദജോടി ലേവ്യർക്കു പ്രദേശാധിഷ്ഠിതമായ ഗോത്രവിഹിതം ലഭിക്കാത്തതിനെയാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യപാഠത്തിൽ അധിക വ്യാഖ്യാനം ചേർക്കാതെ അടിക്കുറിപ്പിൽ ഈ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിയമോപദേശ ശൈലി. എബ്രായത്തിലെ ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ’ എന്ന പ്രയോഗം അർഥസുതാര്യതയ്ക്കായി ‘നിന്റെ പട്ടണങ്ങളിൽ’ എന്നു വിവർത്തനം ചെയ്തു. ഏകവചന രണ്ടാംപുരുഷപ്രയോഗം നിലനിർത്തി.
