  source_fidelity: 'മുഖ്യപാഠം എബ്രായവാക്യത്തിന്റെ ഘടനയും അർഥവും വിശ്വസ്തമായി നൽകുന്നു: ലേവ്യൻ, ‘നിന്റെ പട്ടണങ്ങളിൽ’ എന്ന കവാട-പ്രയോഗത്തിന്റെ അർഥവിവർത്തനം, അവനെ കൈവിടരുതെന്ന വിലക്ക്, ഓഹരിയും അവകാശഭൂമിയും ഇല്ലായ്മ എന്നിവ എല്ലാം സംരക്ഷിച്ചിട്ടുണ്ട്. ‘ഓഹരിയോ അവകാശഭൂമിയോ ഇല്ല’ എന്ന നിഷേധഘടന എബ്രായത്തിലെ ചേർന്ന പദജോടിയുടെ സംയുക്ത അഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.'
