  text: וְ/הַ֣/חֲסִידָ֔ה וְ/הָ/אֲנָפָ֖ה לְ/מִינָ֑/הּ וְ/הַ/דּוּכִיפַ֖ת וְ/הָ/עֲטַלֵּֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/018.yaml
  text: the stork[a], and the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: ml
  text: കൊക്ക്[a], അതതു ഇനത്തിലുള്ള ഞാറപ്പക്ഷിയും[b], പൂപിയും[c], വവ്വാലും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാറപ്പക്ഷി’; ഈ വാക്യത്തിലെ ചില പക്ഷികളുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഞാറപ്പക്ഷി’ എന്നതിനു പകരം ‘ഐബിസ് പക്ഷി’ എന്നോ ‘പ്ലവർ പക്ഷി’ എന്നോ ആകാം.
    reason: lexical_alternative
  - marker: c
    text: പഴയ വിവർത്തനങ്ങളിൽ പലതും ഇവിടെ ‘ടിറ്റിഭപ്പക്ഷി’ എന്നു വായിക്കുന്നു; എബ്രായപദം ‘പൂപി’യെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲסִידָה
  choice: കൊക്ക്
  rationale: ഈ പക്ഷിയുടെ സാധാരണയും പരമ്പരാഗതവുമായ തിരിച്ചറിയൽ കൊക്ക് (stork) എന്നാണ്; കൃത്യമായ ജന്തുശാസ്ത്രപരമായ തിരിച്ചറിയലിൽ അനിശ്ചിതത്വമുള്ളതിനാൽ അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യത നൽകിയിരിക്കുന്നു.
- source_word: הָאֲנָפָה
  choice: ഞാറപ്പക്ഷികൾ
  rationale: കൃത്യമായ ഇനം അനിശ്ചിതമാണ്. പിന്നാലെയുള്ള לְמִינָהּ എന്ന പ്രയോഗം വിശാലമായ ഇനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ ഒരു വർഗനാമം ബഹുവചനത്തിൽ ഉപയോഗിച്ചു.
- source_word: לְמִינָהּ
  choice: അതതു ഇനത്തിൽപ്പെട്ട
  rationale: ആഹാരനിയമങ്ങളിലും സൃഷ്ടിവിവരണത്തിലും കാണുന്ന ഈ സൂത്രപ്രയോഗം ബന്ധപ്പെട്ട പക്ഷിവർഗത്തിലെ വിവിധ ഇനങ്ങളെ ഉൾക്കൊള്ളുന്നു; ഈ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַדּוּכִיפַת
  choice: പൂപി
  rationale: പഴയ വിവർത്തനങ്ങളിൽ കാണുന്ന lapwing എന്ന തിരിച്ചറിയലിനേക്കാൾ ആധുനിക പദപഠനം hoopoe എന്ന തിരിച്ചറിയലിനെ പിന്തുണയ്ക്കുന്നു; അതിന്റെ നിലവിലുള്ള മലയാളനാമമായ പൂപി സ്വീകരിച്ചു.
- source_word: הָעֲטַלֵּף
  choice: വവ്വാൽ
  rationale: എബ്രായപദം വ്യക്തമായി വവ്വാലിനെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക വർഗീകരണത്തിൽ പക്ഷിയല്ലെങ്കിലും, ഇവിടെ പറക്കുന്ന ജീവികളുടെ പട്ടികയിൽ ഉൾപ്പെട്ടിരിക്കുന്നതിനാൽ നേരിട്ടുള്ള പദം നിലനിർത്തി.
