  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പട്ടികയുടെ സംക്ഷിപ്ത ഘടന നിലനിർത്തി. לְמִינָהּ എന്ന ഏകവചന സൂത്രപ്രയോഗത്തിന്റെ കൂട്ടവർഗാർഥം സ്വാഭാവികമായി അറിയിക്കാൻ ‘അതതു ഇനത്തിൽപ്പെട്ട ഞാറപ്പക്ഷികൾ’ എന്നു നൽകി. എല്ലാ പദപരമായ അനിശ്ചിതത്വങ്ങളും അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
