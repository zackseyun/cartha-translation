  text: the glede[a], and the falcon, and the kite according to its kind,
translation:
  language: ml
  text: ചുവന്ന പരുന്തും[a], പ്രാപ്പിടിയനും, അതിന്റെ ഇനപ്രകാരമുള്ള ചെമ്പരുന്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പക്ഷികളുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. പുരാതനവും ആധുനികവുമായ പരിഭാഷകളിൽ ‘ചുവന്ന പരുന്ത്,’ ‘ചെമ്പരുന്ത്,’ ‘പ്രാപ്പിടിയൻ,’ ‘ഗ്ലീഡ്’ തുടങ്ങിയ പേരുകൾ വ്യത്യസ്തമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָאָה
  choice: ചുവന്ന പരുന്ത്
  rationale: ഈ പക്ഷിനാമത്തിന്റെ കൃത്യമായ ജന്തുശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്; רָאָה എന്നത് കൈറ്റ് വർഗത്തിലെ, പലപ്പോഴും ‘റെഡ് കൈറ്റ്’ എന്നു തിരിച്ചറിയപ്പെടുന്ന ഇരപിടിയൻ പക്ഷിയാകാമെന്ന ആധുനിക നിഘണ്ടുസാക്ഷ്യം പിന്തുടരുന്നു.
- source_word: הָאַיָּה
  choice: പ്രാപ്പിടിയൻ
  rationale: אַיָּה ഒരു ഇരപിടിയൻ പക്ഷിയെ സൂചിപ്പിക്കുന്നു; സമീപമുള്ള കൈറ്റ്-വർഗനാമങ്ങളിൽനിന്ന് വേർതിരിച്ചും സാധാരണ മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധത്തിലുമാണ് ‘പ്രാപ്പിടിയൻ’ തെരഞ്ഞെടുത്തത്.
- source_word: הַדַּיָּה
  choice: ചെമ്പരുന്ത്
  rationale: דַּיָּה സാധാരണയായി കൈറ്റ് വർഗത്തിലെ പക്ഷിയായി വ്യാഖ്യാനിക്കപ്പെടുന്നു; മലയാളത്തിൽ പരിചിതമായ ‘ചെമ്പരുന്ത്’ അതിന് സ്വാഭാവികമായ സമാനപദമാണ്, എങ്കിലും കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്.
- source_word: לְמִינָהּ
  choice: അതതിന്റെ ഇനത്തിലുള്ള
  rationale: ഭക്ഷണനിയമങ്ങളിലും സൃഷ്ടിവിവരണത്തിലും കാണുന്ന വർഗീകരണസൂത്രമായ ‘അതിന്റെ ഇനപ്രകാരം’ എന്ന ആശയം, പട്ടികയിലെ പക്ഷിവർഗത്തെ സ്വാഭാവികമായി വിശേഷിപ്പിക്കുന്ന രീതിയിൽ നൽകി.
- source_word: וְאֶת / וְ
  choice: എന്നിവയും
  rationale: വാക്യം മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന ഒരു പട്ടികയാണ്; ഹീബ്രു സംയോജകങ്ങളുടെയും കർമചിഹ്നത്തിന്റെയും പ്രവർത്തനം മലയാളത്തിൽ പട്ടികാവസാനത്തെ ‘എന്നിവയും’ കൊണ്ടു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
