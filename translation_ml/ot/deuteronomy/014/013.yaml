  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. അപൂർവമായ ഇംഗ്ലീഷ് ‘glede’ പകർത്താതെ സാദ്ധ്യമായ പക്ഷിവർഗനാമം മുഖ്യപാഠത്തിൽ നൽകി; യഥാർത്ഥത്തിലെ ജന്തുശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
