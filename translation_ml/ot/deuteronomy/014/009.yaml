  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּ֖ל אֲשֶׁ֣ר בַּ/מָּ֑יִם כֹּ֧ל אֲשֶׁר ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת תֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/009.yaml
  text: 'You may eat this from all that are in the waters: everything that has fins and scales you may eat.'
translation:
  language: ml
  text: വെള്ളത്തിലുള്ള സകല ജീവികളിലും ചിറകുകളും ചെതുമ്പലുകളും ഉള്ളവയെ നിങ്ങൾക്കു ഭക്ഷിക്കാം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סְנַפִּיר
  choice: ചിറകുകൾ
  rationale: ജലജീവികളുടെ സഞ്ചാരാവയവമായ fins എന്ന അർഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: קַשְׂקֶשֶׂת
  choice: ചെതുമ്പലുകൾ
  rationale: മത്സ്യങ്ങളുടെ scales സൂചിപ്പിക്കുന്ന പ്രചാരത്തിലുള്ള കൃത്യമായ മലയാളപദം.
- source_word: תֹּאכְלוּ
  choice: നിങ്ങൾക്കു ഭക്ഷിക്കാം
  rationale: നിയമപരമായ അനുമതിയുടെ ഭാവം നിലനിർത്തുന്നു; ഹീബ്രു ബഹുവചന അഭിസംബോധനയും വ്യക്തമാക്കുന്നു.
- source_word: אֶת זֶה ... מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: വെള്ളത്തിലുള്ള സകല ജീവികളിലും ... ഉള്ളവയെ
  rationale: ഹീബ്രുവിലെ ‘ഇവയെ ... സകലത്തിൽനിന്നും’ എന്ന ഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പുനഃക്രമീകരിക്കുന്നു; സന്ദർഭം സൂചിപ്പിക്കുന്ന ജീവികളെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിയമഭാഷ. മൂലത്തിലെ ആവർത്തനം മലയാളത്തിൽ അനാവശ്യമായി ഭാരമുള്ളതാകാതിരിക്കാൻ ഒരു വ്യവസ്ഥാവാക്യമായി സ്വാഭാവികമാക്കി.
