revisions:
- from: നിന്നോടൊപ്പം ഓഹരിയോ അവകാശമോ ഇല്ലാത്ത ലേവ്യനും, നിന്റെ പട്ടണങ്ങളിൽ[b] താമസിക്കുന്ന പരദേശിയും[a] അനാഥനും വിധവയും വന്ന് ഭക്ഷിച്ചു തൃപ്തരാകട്ടെ. അങ്ങനെ, നീ ചെയ്യുന്ന സകല പ്രവൃത്തിയിലും നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.
  to: നിന്നോടൊപ്പം ഓഹരിയോ അവകാശമോ ഇല്ലാത്ത ലേവ്യനും, നിന്റെ പട്ടണങ്ങളിൽ[b] താമസിക്കുന്ന പരദേശിയും[a] അനാഥനും വിധവയും വന്ന് ഭക്ഷിച്ച് തൃപ്തരാകും. അങ്ങനെ, നീ ചെയ്യുന്ന സകല പ്രവൃത്തിയിലും നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.
  rationale: Only the verb sequence has been revised. ‘വന്ന് ഭക്ഷിച്ച് തൃപ്തരാകും’ reflects the Hebrew legal-context future/result force while preserving the sequence of coming, eating, and being satisfied. The wording, divine name, and both correctly anchored footnotes are otherwise retained.
