source:
  edition: WLC
  text: וּ/בָ֣א הַ/לֵּוִ֡י כִּ֣י אֵֽין ל/וֹ֩ חֵ֨לֶק וְ/נַחֲלָ֜ה עִמָּ֗/ךְ וְ֠/הַ/גֵּר וְ/הַ/יָּת֤וֹם וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/אָכְל֖וּ וְ/שָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל מַעֲשֵׂ֥ה יָדְ/ךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: ml
  text: നിന്നോടൊപ്പം ഓഹരിയോ അവകാശമോ ഇല്ലാത്ത ലേവ്യനും, നിന്റെ പട്ടണങ്ങളിൽ[b] താമസിക്കുന്ന പരദേശിയും[a] അനാഥനും വിധവയും വന്ന് ഭക്ഷിച്ച് തൃപ്തരാകും. അങ്ങനെ, നീ ചെയ്യുന്ന സകല പ്രവൃത്തിയിലും നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താമസക്കാരനായ വിദേശി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇസ്രായേല്യരുടെ ഇടയിൽ സ്ഥിരമായി പാർത്തിരുന്ന ഇസ്രായേല്യനല്ലാത്ത ഒരാളെയാണ് ഹീബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘നിന്റെ പടിവാതിലുകൾക്കുള്ളിൽ.’ പട്ടണങ്ങളിലോ പ്രാദേശിക സമൂഹത്തിലോ താമസിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന ഹീബ്രായപ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא הַלֵּוִי
  choice: ലേവ്യനും … വന്ന്
  rationale: וּבָא എന്ന രൂപത്തിന് ഈ നിയമനിർദേശസന്ദർഭത്തിൽ പ്രതീക്ഷിതമോ നിർദേശാത്മകമോ ആയ ഭാവാർഥമുണ്ട്. തുടർന്ന് പറയുന്ന എല്ലാ വിഭാഗങ്ങളെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ ‘വന്ന് … തൃപ്തരാകട്ടെ’ എന്നു നൽകി; ‘ലേവ്യൻ’ എന്ന സാമൂഹിക-ഗോത്രപരമായ പദവി നിലനിർത്തി, ‘പുരോഹിതൻ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: חֵלֶק וְנַחֲלָה
  choice: ഓഹരിയോ അവകാശമോ
  rationale: ആദ്യപദം ലഭിക്കുന്ന പങ്കിനെയും രണ്ടാമത്തേത് പാരമ്പര്യമായി ലഭിക്കുന്ന സ്വത്തിനെയോ ഭൂവകാശത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ ഈ നിയമ-സാമ്പത്തിക ഇരട്ട അർഥം നിലനിർത്തുന്നു.
- source_word: הַגֵּר
  choice: പരദേശി
  rationale: ഇസ്രായേലിന്റെ സമൂഹത്തിനുള്ളിൽ താമസിക്കുന്ന ഇസ്രായേല്യനല്ലാത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പരദേശി’ സംക്ഷിപ്തവും പരിചിതവുമാണ്; താമസക്കാരൻ എന്ന പ്രത്യേകത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַיָּתוֹם
  choice: അനാഥൻ
  rationale: പിതാവിന്റെ സംരക്ഷണമില്ലാത്ത സാമൂഹികമായി ദുർബലനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ പരിഭാഷ.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന
  rationale: ‘നിന്റെ പടിവാതിലുകൾക്കുള്ളിൽ’ എന്ന ഹീബ്രായ പ്രയോഗം പട്ടണങ്ങളെയോ പ്രാദേശിക സമൂഹത്തെയോ സൂചിപ്പിക്കുന്ന ലാക്ഷണികപ്രയോഗമാണ്. മുഖ്യവാചകത്തിൽ അർഥം സ്വാഭാവികമായി നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: ഭക്ഷിച്ചു തൃപ്തരാകട്ടെ
  rationale: സംഭരിച്ച ദശാംശത്തിൽനിന്ന് അവർക്ക് വേണ്ടത്ര ഭക്ഷണം ലഭിക്കണമെന്ന ഉദ്ദേശ്യം പ്രകടമാക്കുന്നു. ‘തൃപ്തരാകട്ടെ’ സമൃദ്ധമായ പര്യാപ്തതയുടെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: അനുഗ്രഹിക്കേണ്ടതിന്
  rationale: לְמַעַן ഉദ്ദേശ്യമോ പ്രതീക്ഷിക്കുന്ന ഫലമോ രേഖപ്പെടുത്തുന്നു. ഇത് നിബന്ധനയില്ലാത്ത പ്രവചനമായി മാറ്റാതെ ഉദ്ദേശ്യാർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു.
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: നീ ചെയ്യുന്ന സകല പ്രവൃത്തിയിലും
  rationale: ‘നിന്റെ കൈയുടെ സകല പ്രവൃത്തിയിലും’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഏകവചനത്തിലുള്ള ഉടമ്പടിസംബോധനയായ ‘നീ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര ദൈവനാമം തന്നെയാണ് ഉള്ളത്. അതിനാൽ വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു.
- issue: അനുഗ്രഹവാക്യത്തിന്റെ ഭാവം
  choice: നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്
  alternative: നിന്നെ അനുഗ്രഹിക്കും
  rationale: לְמַעַן എന്ന ഉദ്ദേശ്യസൂചകവും തുടർന്നുള്ള അപൂർണക്രിയയും ഉദ്ദേശിച്ച ഫലമാണ് രേഖപ്പെടുത്തുന്നത്; നിബന്ധനയില്ലാത്ത ഉറച്ച വാഗ്ദാനമായി അതിനെ ശക്തിപ്പെടുത്തിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശ ശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ഏകവചന ഉടമ്പടിസംബോധനയ്ക്ക് ‘നീ/നിന്റെ/നിന്നെ’ ഉപയോഗിച്ചു. ഹീബ്രായത്തിലെ ദീർഘമായ ഏകവാക്യം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; അർഥബന്ധം ‘അങ്ങനെ’ എന്നതിലൂടെ നിലനിർത്തി.
