lexical_decisions:
- source_word: וְאֵת
  choice: -ഉം
  rationale: മുമ്പുള്ള നിരോധിത പക്ഷികളുടെ പട്ടികയോട് ഈ ഇനത്തെ ബന്ധിപ്പിക്കുന്ന וְ മലയാളത്തിൽ ചേർക്കൽസൂചകമായ ‘-ഉം’കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; אֵת എന്ന കർമസൂചകത്തിന് ഇവിടെ വേറെ പരിഭാഷ ആവശ്യമില്ല.
- source_word: כָּל
  choice: സകലതും
  rationale: ഏകവചന വർഗനാമത്തോടു ചേർന്ന כָּל ആ വർഗം മുഴുവനും ഉൾപ്പെടുന്നതായി സൂചിപ്പിക്കുന്നു.
- source_word: עֹרֵב
  choice: കാക്ക
  rationale: עֹרֵב റേവൻ, കാക്ക എന്നിവ ഉൾപ്പെടുന്ന വിശാലമായ പക്ഷിവർഗത്തെ സൂചിപ്പിക്കാം. സാധാരണ മലയാളത്തിൽ ഈ വർഗത്തിന്റെ സ്വാഭാവികവും എളുപ്പം മനസ്സിലാകുന്നതുമായ പേരായി ‘കാക്ക’ ഉപയോഗിക്കുന്നു.
- source_word: לְמִינוֹ
  choice: വർഗത്തിൽപ്പെട്ട
  rationale: ‘അതിന്റെ ഇനംപ്രകാരം’ എന്ന വർഗീകരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും עֹרֵב എന്ന പദത്തിന്റെ വിശാലമായ കുടുംബസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ചുരുക്കവും നിയമപ്പട്ടികയ്ക്ക് യോജിച്ച ഗൗരവവും പാലിച്ചു. അക്ഷരാർഥത്തിലുള്ള ‘അതിന്റെ ഇനംപ്രകാരം’ എന്നതിനു പകരം സ്വാഭാവികമായ ‘വർഗത്തിൽപ്പെട്ട’ ഉപയോഗിച്ചു; പദത്തിന്റെ ജന്തുശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
