source:
  edition: WLC
  text: וְ/אָכַלְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּק֣וֹם אֲשֶׁר יִבְחַר֮ לְ/שַׁכֵּ֣ן שְׁמ֣/וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ לְמַ֣עַן תִּלְמַ֗ד לְ/יִרְאָ֛ה אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל הַ/יָּמִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെ തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ[a] തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത്, നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെയുടെ സന്നിധിയിൽവെച്ച്, നിങ്ങളുടെ ധാന്യത്തിന്റെയും പുതുവീഞ്ഞിന്റെയും എണ്ണയുടെയും ദശാംശവും നിങ്ങളുടെ കന്നുകാലിക്കൂട്ടത്തിലെയും ആട്ടിൻപറ്റത്തിലെയും കടിഞ്ഞൂലുകളെയും നിങ്ങൾ ഭക്ഷിക്കണം. അങ്ങനെ നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെയെ എല്ലാ ദിവസവും ഭയപ്പെടാൻ നിങ്ങൾ പഠിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ നാമം അവിടെ വസിക്കുമാറാക്കാൻ’ എന്നും ‘തന്റെ നാമം അവിടെ സ്ഥാപിക്കാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. തിരഞ്ഞെടുത്ത വിശുദ്ധസ്ഥാനത്ത് തന്റെ നാമം വസിക്കുമാറാക്കുന്നു എന്ന എബ്രായ പ്രയോഗം ദ്വിതീയോപദേശത്തിലെ ഒരു പ്രത്യേക ശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: നിങ്ങൾ ഭക്ഷിക്കണം
  rationale: നിയമനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള വാവ് ചേർന്ന ഖാൽ പൂർണക്രിയ ഇവിടെ നിർദേശാത്മകമായ ഭാവാർഥം നൽകുന്നു; ‘ഭക്ഷിക്കണം’ അത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെയുടെ സന്നിധിയിൽവെച്ച്
  rationale: לִפְנֵי എന്നതിലെ ‘മുമ്പിൽ/സാന്നിധ്യത്തിൽ’ എന്ന ആരാധനാസന്ദർഭാർഥം ‘സന്നിധിയിൽവെച്ച്’ സ്വാഭാവികമായും മാന്യമായും നൽകുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ അതിന്റെ പ്രചാരത്തിലുള്ള ശബ്ദലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത്
  rationale: ആരാധനാസ്ഥലം ദൈവം തിരഞ്ഞെടുക്കുന്നു എന്ന ആവർത്തിക്കുന്ന ദ്വിതീയോപദേശ സൂത്രവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; സന്ദർഭം അതിന്റെ മുന്നോട്ടുനോക്കുന്ന സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ
  rationale: ഹിഫീൽ രൂപത്തിലെ കാരണാർഥവും ദൈവനാമം തിരഞ്ഞെടുത്ത സ്ഥലത്ത് വസിക്കുന്നു എന്ന എബ്രായ ദൃശ്യവും നിലനിർത്തുന്നു; സാധ്യതയുള്ള മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ കൊടുക്കുന്നു.
- source_word: מַעְשַׂר דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: നിങ്ങളുടെ ധാന്യത്തിന്റെയും പുതുവീഞ്ഞിന്റെയും എണ്ണയുടെയും ദശാംശം
  rationale: കാർഷിക ഉൽപ്പന്നങ്ങളുടെ മൂന്നു ഘടകങ്ങളെയും വേർതിരിച്ചു സൂക്ഷിച്ചുകൊണ്ട് מַעְשַׂר എന്ന ആരാധനാപദം ‘ദശാംശം’ എന്നു നൽകുന്നു.
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: നിങ്ങളുടെ കന്നുകാലിക്കൂട്ടത്തിലെയും ആട്ടിൻപറ്റത്തിലെയും കടിഞ്ഞൂലുകൾ
  rationale: വലിയ വളർത്തുമൃഗങ്ങളെയും ചെറുകന്നുകാലികളെയും സൂചിപ്പിക്കുന്ന എബ്രായ ജോടിയെ കൂട്ടം/പറ്റം എന്ന വ്യത്യാസത്തോടെ അവതരിപ്പിക്കുകയും בכורות എന്നത് മൃഗങ്ങളുടെ ആദ്യജാത സന്തതിയെ സൂചിപ്പിക്കുന്ന ‘കടിഞ്ഞൂലുകൾ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: അങ്ങനെ … ഭയപ്പെടാൻ നിങ്ങൾ പഠിക്കും
  rationale: לְמַעַן സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം നിലനിർത്തുകയും ‘ഭയപ്പെടുക’ എന്ന ദൈവഭക്തിയുടെയും ഭയഭക്തിയുടെയും അർഥവ്യാപ്തി വിശദീകരിച്ച് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל הַיָּמִים
  choice: എല്ലാ ദിവസവും
  rationale: അക്ഷരാർഥത്തോട് അടുത്തും സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവുമായ പ്രയോഗം; ജീവിതകാലം മുഴുവൻ തുടരുന്ന ശീലത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിനാമത്തെ ഒരു പദവിയാൽ പകരാതെ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പിന്നീടുണ്ടായ സംയുക്തോച്ചാരണത്തെയും ഒഴിവാക്കുന്നു.
- issue: ലְשַׁכֵּן שְׁמוֹ שָׁם എന്ന വിശുദ്ധമന്ദിര സൂത്രവാക്യം
  choice: തന്റെ നാമം അവിടെ വസിപ്പിക്കാൻ
  alternative: തന്റെ നാമം അവിടെ വസിക്കേണ്ടതിന്; തന്റെ നാമം അവിടെ സ്ഥാപിക്കാൻ
  rationale: ദൈവത്തിന്റെ അതീതത്വവും തിരഞ്ഞെടുത്ത ആരാധനാസ്ഥലത്തിലെ ഉടമ്പടിസാന്നിധ്യവും തമ്മിലുള്ള എബ്രായ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം മായ്ച്ചുകളയാതെ നാമം ‘വസിക്കുന്നു/വസിപ്പിക്കുന്നു’ എന്ന ചിത്രം നിലനിർത്തുന്നു.
- issue: לְיִרְאָה എന്നതിലെ ദൈവഭയം
  choice: യാഹ്‌വെയെ … ഭയപ്പെടാൻ
  alternative: യാഹ്‌വെയോട് ഭക്തിയുള്ളവരാകാൻ; യാഹ്‌വെയെ ആദരിക്കാൻ
  rationale: ‘ഭയം’ എന്ന മൂലപദത്തിലെ യഥാർഥ അർഥഘടകം നിലനിർത്തുന്നു; അത് ഭക്തിയെന്ന ഒറ്റ ആശയമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി ഉപയോഗിച്ചു. ഏകവചന രണ്ടാംപുരുഷനായ എബ്രായ രൂപത്തിന് മലയാളത്തിൽ പതിവായ മാന്യരൂപമായ ‘നിങ്ങൾ’ സ്വീകരിച്ചു. ആരാധനാസന്ദർഭത്തിൽ ‘സന്നിധി’, കാർഷിക-നിയമസന്ദർഭത്തിൽ ‘ദശാംശം’, ‘കടിഞ്ഞൂൽ’ എന്നീ സ്ഥാപിതമായെങ്കിലും ഇന്നും മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു.
