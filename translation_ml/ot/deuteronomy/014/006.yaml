reference: Deuteronomy 14:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל בְּהֵמָ֞ה מַפְרֶ֣סֶת פַּרְסָ֗ה וְ/שֹׁסַ֤עַת שֶׁ֨סַע֙ שְׁתֵּ֣י פְרָס֔וֹת מַעֲלַ֥ת גֵּרָ֖ה בַּ/בְּהֵמָ֑ה אֹתָ֖/הּ תֹּאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/006.yaml
  text: You may eat any animal that has a split hoof[a], divided into two hoof-parts, and that chews the cud among the animals.
translation:
  language: ml
  text: കുളമ്പ് പിളർന്നതും കുളമ്പിലെ പിളർപ്പ് അതിനെ രണ്ടായി വിഭജിക്കുന്നതും അയവിറക്കുന്നതുമായ ഏതു മൃഗത്തെയും നിങ്ങൾക്കു ഭക്ഷിക്കാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “മൃഗങ്ങളിൽ, കുളമ്പ് പിളരുകയും കുളമ്പിലെ പിളർപ്പ് അതിനെ രണ്ടു കുളമ്പുകളായി വിഭജിക്കുകയും അയവിറക്കുകയും ചെയ്യുന്ന ഓരോ മൃഗത്തെയും നിങ്ങൾക്കു ഭക്ഷിക്കാം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: ഏതു ... മൃഗത്തെയും
  rationale: അനുവാദം അറിയിക്കുന്ന നിയമവാക്യത്തിൽ വിതരണാർഥമുള്ള ‘എല്ലാ/ഓരോ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘ഏതു ... മൃഗത്തെയും’ എന്നു നൽകുന്നു.
- source_word: בְּהֵמָה
  choice: മൃഗം
  rationale: ഈ സന്ദർഭത്തിൽ ഭക്ഷണനിയമത്തിന്റെ പരിധിയിലുള്ള കരമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘മൃഗം’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും വിശാലവുമാണ്.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: കുളമ്പു പിളർന്നത്
  rationale: മൃഗത്തിന്റെ കുളമ്പ് പിളർന്നിരിക്കുന്നതെന്ന ദൃശ്യമായ മാനദണ്ഡം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: ആ പിളർപ്പ് കുളമ്പിനെ രണ്ടായി വേർതിരിക്കുന്നത്
  rationale: പിളർപ്പ് യഥാർഥത്തിൽ രണ്ടു കുളമ്പുഭാഗങ്ങളായി വേർതിരിക്കുന്നുവെന്ന എബ്രായത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: מַעֲלַת גֵּרָה
  choice: അയവിറക്കുന്നത്
  rationale: റൂമിനേഷൻ സൂചിപ്പിക്കുന്ന, സാധാരണ മലയാളത്തിൽ സ്ഥാപിതവും സംക്ഷിപ്തവുമായ പ്രയോഗമാണിത്.
- source_word: בַּבְּהֵמָה
  choice: മൃഗങ്ങളിൽ
  rationale: യോഗ്യതകൾ മൃഗവർഗത്തിനുള്ളിൽ ബാധകമാണെന്ന വർഗപരമായ ആശയം ഔപചാരിക അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; മുഖ്യവാക്യത്തിൽ ആവർത്തനം സ്വാഭാവികതയ്ക്കായി ലയിപ്പിച്ചിരിക്കുന്നു.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: നിങ്ങൾക്കു ഭക്ഷിക്കാം
  rationale: നിയമസന്ദർഭത്തിൽ ഇത് ഭക്ഷിക്കാനുള്ള അനുമതിയാണ്, നിർബന്ധമല്ല; മലയാളത്തിൽ ‘ഭക്ഷിക്കാം’ ആ അനുമതി വ്യക്തമായി അറിയിക്കുന്നു.
