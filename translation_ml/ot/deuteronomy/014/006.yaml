translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘കുളമ്പു പിളർന്നത്’ എന്ന പരിചിതപ്രയോഗത്തോടൊപ്പം രണ്ടായി പൂർണമായി വേർപെടുന്നതെന്ന മൂലപാഠത്തിലെ ഊന്നലും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
