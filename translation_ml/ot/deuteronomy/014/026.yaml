source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: ml
  text: ആ വെള്ളിപ്പണം നിന്റെ മനസ്സ് കൊതിക്കുന്ന എന്തിനുവേണ്ടിയും—കന്നുകാലികളോ ആടുകളോ വീഞ്ഞോ ലഹരിപാനീയമോ[c], അങ്ങനെ നിന്റെ മനസ്സ് ആവശ്യപ്പെടുന്ന എന്തിനുവേണ്ടിയും[b]—ചെലവഴിക്കുക. അവിടെ നിന്റെ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽവെച്ച് നീ ഭക്ഷണം കഴിക്കുകയും നീയും നിന്റെ കുടുംബവും ആനന്ദിക്കുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘നിന്റെ ജീവൻ കൊതിക്കുന്നതു … നിന്റെ ജീവൻ ആവശ്യപ്പെടുന്നതു.’ ഇവിടെ ‘ജീവൻ’ എന്നത് വ്യക്തിയുടെ ആഗ്രഹത്തെയോ ഭക്ഷണപാനീയങ്ങളോടുള്ള മോഹത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘ലഹരിപാനീയം’ എന്നത് വീഞ്ഞല്ലാത്ത മറ്റൊരു ലഹരിയുണ്ടാക്കുന്ന പാനീയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: ആ വെള്ളിപ്പണം ചെലവഴിക്കുക
  rationale: വ്യാപാരസന്ദർഭത്തിൽ נָתַן എന്നത് പണം ‘കൊടുക്കുക’ എന്നതിലുപരി സാധനങ്ങൾ വാങ്ങാൻ ചെലവഴിക്കുക എന്നാണ്. הַכֶּסֶף എന്നതിന്റെ അക്ഷരാർഥമായ ‘വെള്ളി’യും ധനാർഥവും ‘വെള്ളിപ്പണം’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: תְּאַוֶּה נַפְשְׁךָ / תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: നിന്റെ മനസ്സ് കൊതിക്കുന്ന / നിന്റെ മനസ്സ് ആവശ്യപ്പെടുന്ന
  rationale: נֶפֶשׁ ഇവിടെ വേറിട്ട അഭൗതിക ‘ആത്മാവ്’ എന്നതല്ല, വ്യക്തിയുടെ ആഗ്രഹത്തെയും ഭക്ഷണപാനീയങ്ങളോടുള്ള മോഹത്തെയും സൂചിപ്പിക്കുന്നു. ‘മനസ്സ്’ എന്നത് ഹീബ്രു പ്രയോഗത്തിന്റെ വ്യക്തിവൽക്കരണം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: בַּבָּקָר וּבַצֹּאן
  choice: കന്നുകാലികളോ ആടുകളോ
  rationale: בָּקָר പശുവർഗത്തിലെ വളർത്തുമൃഗങ്ങളെയും צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറിയ ആട്ടിൻകൂട്ടത്തെയും സൂചിപ്പിക്കുന്ന സമൂഹനാമങ്ങളാണ്. സാധാരണ മലയാളത്തിൽ സംക്ഷിപ്തവും ഗ്രാഹ്യവുമായ വിഭാഗനാമങ്ങൾ ഉപയോഗിച്ചു.
- source_word: וּבַיַּיִן וּבַשֵּׁכָר
  choice: വീഞ്ഞോ ലഹരിപാനീയമോ
  rationale: יַיִן വീഞ്ഞാണ്; שֵׁכָר വീഞ്ഞിൽനിന്നു വേറിട്ട ലഹരിയുണ്ടാക്കുന്ന പുളിപ്പിച്ച പാനീയമാണ്. കൃത്യമായ പാനീയതരം അനാവശ്യമായി നിശ്ചയിക്കാതെ വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽവെച്ച്
  rationale: לִפְנֵי എന്ന സാന്നിധ്യാർഥവും വെളിപ്പെടുത്തപ്പെട്ട ദൈവനാമമായ יְהוָהയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: നീയും നിന്റെ കുടുംബവും ആനന്ദിക്കുകയും വേണം
  rationale: בַּיִת ഇവിടെ കെട്ടിടമല്ല, വീട്ടുകാരെയാണ് സൂചിപ്പിക്കുന്നത്. നിർദേശാത്മക സ്വരവും ഉത്സവസന്തോഷവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ പ്രത്യേക നാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു പദവിയായി മാറ്റാതെ ആ നാമത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: മദ്യപാനീയങ്ങളെ പരാമർശിക്കുന്ന ഭാഷ
  choice: വീഞ്ഞ്, ലഹരിപാനീയം
  alternative: വീഞ്ഞ്, പുളിപ്പിച്ച പാനീയം
  rationale: ഹീബ്രു പാഠം വീഞ്ഞിനെയും മറ്റൊരു ലഹരിയുള്ള പാനീയത്തെയും വ്യക്തമായി വേർതിരിക്കുന്നു. മതപരമായ മുൻവിധികൊണ്ട് പരാമർശം മൃദൂകരിക്കാതെയും കൃത്യമായ ഇനം അനുമാനിക്കാതെയും അർഥം നിലനിർത്തി.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ മനുഷ്യശാസ്ത്രപരമായ അർഥം
  choice: മനസ്സ്
  alternative: ജീവൻ / ആത്മാവ് / വിശപ്പ്
  rationale: ഈ ഭക്ഷണപാനീയസന്ദർഭത്തിൽ പദം മുഴുവൻ വ്യക്തിയുടെ ആഗ്രഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മനസ്സ്’ അർഥം വ്യക്തമാക്കുകയും ‘കൊതിക്കുന്നു’, ‘ആവശ്യപ്പെടുന്നു’ എന്നീ രണ്ടു വ്യത്യസ്ത ക്രിയകളുമായുള്ള ഹീബ്രു ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. കല്പനയുടെ സ്വരം ‘ചെലവഴിക്കുക’, ‘വേണം’ എന്നിവയിലൂടെ വ്യക്തമാക്കി; പട്ടികയും ആവർത്തിച്ച ആഗ്രഹപ്രയോഗവും വായിക്കാൻ സ്വാഭാവികമാക്കി.
