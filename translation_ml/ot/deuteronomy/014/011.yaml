translation:
  language: ml
  text: ശുദ്ധമായ ഏതു പക്ഷിയെയും നിങ്ങൾക്കു ഭക്ഷിക്കാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ശുദ്ധമായ എല്ലാ പക്ഷികളെയും നിങ്ങൾക്കു ഭക്ഷിക്കാം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: ഏതു …-യെയും
  rationale: ഈ പരിമാണപദം ശുദ്ധമായ പക്ഷികളുടെ മുഴുവൻ വിഭാഗത്തിനുള്ളിൽ നിയന്ത്രണമില്ലാത്ത അനുമതി സൂചിപ്പിക്കുന്നു. ഏകവചനമായ ‘പക്ഷി’യോടൊപ്പം ‘ഏതു …-യെയും’ എന്നത് ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: צִפּוֹר
  choice: പക്ഷി
  rationale: ഭക്ഷണനിയമത്തിന്റെ ഈ സന്ദർഭത്തിൽ ഈ നാമം സാധാരണയായി പക്ഷിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പറക്കുന്ന ജീവി’ എന്ന വിശാലമായ പ്രയോഗത്തേക്കാൾ ‘പക്ഷി’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: טְהֹרָה
  choice: ശുദ്ധമായ
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഭക്ഷണനിയമസന്ദർഭത്തിൽ ഇത് ഭക്ഷിക്കാൻ അനുവദിക്കപ്പെട്ട ആചാരപരമായ വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. ‘ശുദ്ധമായ’ എന്നത് ആ നിയമപരമായ വേർതിരിവ് നിലനിർത്തുന്നു.
- source_word: תֹּאכֵלוּ
  choice: നിങ്ങൾക്കു ഭക്ഷിക്കാം
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലെ ഈ അപൂർണക്രിയ ഇവിടെ നിയമപരമായ അനുമതിയാണ് പ്രകടിപ്പിക്കുന്നത്. ‘നിങ്ങൾക്കു ഭക്ഷിക്കാം’ എന്നത് നിർബന്ധമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി അനുമതിയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘നിങ്ങൾക്കു’ എന്ന ബഹുവചനരൂപം ഹീബ്രുവിലെ രണ്ടാം പുരുഷ ബഹുവചനം നിലനിർത്തുന്നു; ‘ഭക്ഷിക്കാം’ അനുമതിസ്വഭാവം വ്യക്തമാക്കുന്നു.
