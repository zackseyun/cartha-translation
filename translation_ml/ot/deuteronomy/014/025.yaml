  text: וְ/נָתַתָּ֖ה בַּ/כָּ֑סֶף וְ/צַרְתָּ֤ הַ/כֶּ֨סֶף֙ בְּ/יָ֣דְ/ךָ֔ וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/025.yaml
  text: then you shall turn it into silver[a], bind the silver in your hand[b], and go to the place that Yahweh your God will choose.
translation:
  language: ml
  text: അപ്പോൾ നീ അതു വെള്ളിക്കു മാറ്റി[a], ആ വെള്ളി കെട്ടിപ്പൊതിഞ്ഞ് കൈയിൽ എടുത്ത്[b], നിന്റെ ദൈവമായ യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തേക്കു പോകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതു വെള്ളിക്കു വിൽക്കുക” അല്ലെങ്കിൽ “അതു പണമാക്കി മാറ്റുക.” എബ്രായപദത്തിന്റെ അക്ഷരാർഥം “വെള്ളി” എന്നാണ്; ഇവിടെ അതു പണമായി ഉപയോഗിക്കുന്ന വെള്ളിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ആ വെള്ളി കെട്ടിപ്പൊതിഞ്ഞ് കൈയിൽ വയ്ക്കുക”; അതായത്, യാത്രയ്ക്കായി അതു സുരക്ഷിതമായി കൈവശം വയ്ക്കുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: നീ അതു വെള്ളിക്കു മാറ്റി
  rationale: നָתַן + בְּכֶּסֶף എന്ന പ്രയോഗം ഇവിടെ മുൻവാക്യത്തിലെ ദശാംശവിളവ് വെള്ളിക്കു കൈമാറുകയോ വിൽക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വെള്ളിക്കു മാറ്റുക’ ഇടപാടിന്റെ അർഥവും כֶּסֶף എന്ന പദത്തിന്റെ മൂർത്തമായ ‘വെള്ളി’ എന്ന രൂപവും നിലനിർത്തുന്നു.
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: ആ വെള്ളി നിന്റെ കൈയിൽ കെട്ടിപ്പൊതിഞ്ഞ്
  rationale: צָרַר എന്നതിന് കെട്ടുക, പൊതിയുക, സുരക്ഷിതമായി കെട്ടിവയ്ക്കുക എന്നീ അർഥങ്ങളുണ്ട്. യാത്രയ്ക്കായി വെള്ളി സുരക്ഷിതമാക്കുന്ന മൂർത്തമായ ദൃശ്യം ‘കെട്ടിപ്പൊതിയുക’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּיָדְךָ
  choice: നിന്റെ കൈയിൽ
  rationale: ഹീബ്രായിയുടെ അക്ഷരാർഥമായ ‘നിന്റെ കൈയിൽ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് കൈവശം വഹിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: സ്ഥലത്തേക്കു പോകണം
  rationale: הלך എന്ന സാധാരണ ക്രിയയുടെ ‘പോകുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. നിയമനിർദേശത്തിന്റെ ഭാവം പ്രകടമാക്കാൻ ‘പോകണം’ ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר יִבְחַר
  choice: തിരഞ്ഞെടുക്കുന്ന
  rationale: ഇംപെർഫെക്റ്റ് രൂപം സന്ദർഭത്തിൽ ഭാവിയിലുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും, മലയാളത്തിലെ ‘തിരഞ്ഞെടുക്കുന്ന സ്ഥലം’ എന്ന ബന്ധവാക്യം ഭാവിസൂചന ഉൾക്കൊള്ളുകയും ഹീബ്രായിയിലെ കാലപരമായ തുറന്ന സ്വഭാവം അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ, സാധാരണമായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തിന് അനുയോജ്യമായ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: ഉടമ്പടിസംബന്ധമായ ‘നിന്റെ ദൈവം’ എന്ന അഭിസംബോധന ദൈവനാമത്തോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ലിപ്യന്തരിച്ചു. ‘യഹ്‌വെ’ എന്ന രൂപം സാധാരണമായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണനിശ്ചിതമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഏകവചന ദ്വിതീയപുരുഷ നിയമനിർദേശത്തിന്റെ ഭാവത്തോടെ തയ്യാറാക്കി. ‘വെള്ളി’ എന്ന മൂർത്തമായ പദവും ‘കൈയിൽ’ എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തിയപ്പോൾ, അവയുടെ സന്ദർഭാർഥം അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി.
