base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/017.yaml
  text: the pelican[a], the carrion vulture, and the cormorant[c][b],
translation:
  language: ml
  text: ഞാറപ്പക്ഷി[a], ശവംതീനിക്കഴുകൻ[b], നീർക്കാക്ക[c] എന്നിവയും;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലെ എബ്രായ പക്ഷിനാമങ്ങളുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ഇവിടെ ‘ഞാറപ്പക്ഷി’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത് ‘മരുഭൂമിയിലെ മൂങ്ങ’ എന്നോ പൊതുവായി ‘മൂങ്ങ’ എന്നോ ആകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കഴുകൻ’; കൃത്യമായ പക്ഷിയിനം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: c
    text: ഈ എബ്രായപദം ഞാറപ്പക്ഷിയോ മീൻപിടിയൻ മൂങ്ങയോ പോലുള്ള മറ്റൊരു ജലപക്ഷിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּאָת
  choice: ഞാറപ്പക്ഷി
  rationale: പക്ഷിയുടെ കൃത്യമായ ഇനം അനിശ്ചിതമാണെങ്കിലും, അശുദ്ധപക്ഷികളുടെ പട്ടികയിൽ പരമ്പരാഗതമായി സ്വീകരിക്കപ്പെട്ട 'pelican' എന്ന തിരിച്ചറിയലിന് സ്വാഭാവികമായ ആധുനിക മലയാളപദം. അനിശ്ചിതത്വവും മറ്റു സാധ്യതകളും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָרָחָמָה
  choice: ശവംതീനി കഴുകൻ
  rationale: ഇരപിടിയൻ അഥവാ ശവംതീനി പക്ഷിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നതെന്ന സാധ്യത വായനക്കാരന് വ്യക്തമായി നൽകുന്നു; കൃത്യമായ പക്ഷിയിനം ഉറപ്പല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ പറയുന്നു.
- source_word: הַשָּׁלָךְ
  choice: നീർക്കാക്ക
  rationale: മീൻപിടിച്ചു തിന്നുന്ന ജലപക്ഷിയെ സൂചിപ്പിക്കുന്നതായി കരുതപ്പെടുന്ന പദത്തിന് മലയാളത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ സമാനപദം. കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְ / וְאֶת
  choice: എന്നിവയും
  rationale: וְ എന്ന സംയോജകത്തിന്റെ പട്ടികാസംബന്ധിയായ അർഥം മലയാളത്തിൽ 'എന്നിവയും' എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; നേരിട്ടുള്ള കർമസൂചകമായ אֵת പ്രത്യേകം പരിഭാഷപ്പെടുത്തുന്നില്ല.
