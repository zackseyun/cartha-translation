translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. പക്ഷിനാമങ്ങളിലെ മൂലഭാഷാപരമായ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ പരിചിതമായ പേരുകൾ ഉപയോഗിച്ചും അടിക്കുറിപ്പുകളിൽ സാധ്യതകൾ തുറന്നുവെച്ചും സംരക്ഷിച്ചു. മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന പട്ടികയായതിനാൽ അവസാനം അർധവിരാമം ഉപയോഗിച്ചു.
