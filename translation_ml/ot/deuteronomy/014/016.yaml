translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. മൂന്നു എബ്രായ പക്ഷിപ്പേരുകളുടെയും വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് ജന്തുശാസ്ത്രപരമായ തിരിച്ചറിയലിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
