id: DEU.14.16
reference: Deuteronomy 14:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶת הַ/כּ֥וֹס וְ/אֶת הַ/יַּנְשׁ֖וּף וְ/הַ/תִּנְשָֽׁמֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/016.yaml
  text: the little owl[a], the great owl, and the white owl;
translation:
  language: ml
  text: ചെറിയ മൂങ്ങയെയും[a] വലിയ മൂങ്ങയെയും വെള്ള മൂങ്ങയെയും;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പക്ഷിപ്പേരുകൾ കൃത്യമായി ഏതു ഇനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് ഉറപ്പില്ല. പരമ്പരാഗതവും ആധുനികവുമായ പരിഭാഷകൾ അവയെ പലതരം മൂങ്ങകളായി വ്യത്യസ്തമായി വിവർത്തനം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: ചെറിയ മൂങ്ങ
  rationale: അശുദ്ധപ്പക്ഷികളുടെ പട്ടികയിൽ ഇത് ഒരിനം മൂങ്ങയെ സൂചിപ്പിക്കുന്നതായി സാധാരണ മനസ്സിലാക്കുന്നു. കൃത്യമായ ജന്തുശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണെങ്കിലും, തുടർന്നുള്ള രണ്ടു പേരുകളിൽനിന്ന് വേർതിരിക്കാൻ ‘ചെറിയ മൂങ്ങ’ യോജിക്കുന്നു.
- source_word: יַנְשׁוּף
  choice: വലിയ മൂങ്ങ
  rationale: ഇത് ഒരു രാത്രിഞ്ചരപ്പക്ഷിയുടെ പേരാണ്; ഈ പക്ഷിപ്പട്ടികയിൽ പരമ്പരാഗതമായി മൂങ്ങയിനമായി ഗ്രഹിക്കപ്പെടുന്നു. ‘വലിയ മൂങ്ങ’ മൂന്നു വ്യത്യസ്ത എബ്രായ പേരുകളുടെ വേർതിരിവ് നിലനിർത്തുന്നു, എന്നാൽ കൃത്യമായ ഇനം ഉറപ്പിക്കുന്നില്ല.
- source_word: תִּנְשָׁמֶת
  choice: വെള്ള മൂങ്ങ
  rationale: ഈ സന്ദർഭത്തിൽ ഈ പദം ഒരു പക്ഷിയെ സൂചിപ്പിക്കുന്നു; മറ്റിടങ്ങളിൽ ഇതേ രൂപം വേറൊരു ജീവിയെ സൂചിപ്പിക്കാം. ഇവിടെ മൂങ്ങയിനം സാദ്ധ്യമാണെന്ന പരമ്പരാഗത ധാരണ പിന്തുടർന്ന്, മുൻപുള്ള പേരുകളിൽനിന്ന് വേർതിരിക്കാൻ ‘വെള്ള മൂങ്ങ’ ഉപയോഗിച്ചു.
- source_word: אֶת
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിൽ സ്വതന്ത്ര പദമായി പരിഭാഷപ്പെടുത്തേണ്ടതില്ല. കർമവിഭക്തിയായ ‘-യെ’ വഴി ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: וְ
  choice: -യും
  rationale: പട്ടികയിലെ ഇനങ്ങളെ ബന്ധിപ്പിക്കുന്ന സാധാരണ സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ സമുച്ചയപ്രത്യയംകൊണ്ട് പ്രകടമാക്കി.
- source_word: הַ
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: എബ്രായത്തിലെ നിർദ്ദിഷ്ട ഉപപദത്തിന് മലയാളത്തിൽ ഇവിടെ സ്വതന്ത്രമായ തുല്യപദം ആവശ്യമില്ല; ഓരോ പക്ഷിയിനവും പട്ടികയിലെ ഒരു വർഗമായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
