id: DEU.14.10
reference: Deuteronomy 14:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֧ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת לֹ֣א תֹאכֵ֑לוּ טָמֵ֥א ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: ml
  text: എന്നാൽ ചിറകുകളും ചെതുമ്പലുകളും ഇല്ലാത്ത യാതൊന്നും നിങ്ങൾ തിന്നരുത്; അതു നിങ്ങൾക്ക് അശുദ്ധമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: എന്നാൽ ... യാതൊന്നും
  rationale: כֹל-ന്റെ സമഗ്രത ‘യാതൊന്നും’ എന്നതിലൂടെ നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ അനുമതിയോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കാൻ וְ ‘എന്നാൽ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: ഇല്ലാത്ത
  rationale: אֵין + לְ എന്ന ഉടമസ്ഥതാനിഷേധഘടനയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ ‘ഇല്ലാത്ത’ എന്നു നൽകി.
- source_word: סְנַפִּיר
  choice: ചിറകുകൾ
  rationale: ജലജീവികളുടെ fin-നെ സൂചിപ്പിക്കുന്ന പദം; വർഗീകരണനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: וְ/קַשְׂקֶשֶׂת
  choice: ചെതുമ്പലുകളും
  rationale: മത്സ്യത്തിന്റെ scales എന്ന അർഥം; സമുച്ചയബന്ധവും വർഗീകരണസ്വഭാവവും ബഹുവചനത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: לֹא תֹאכֵלוּ
  choice: നിങ്ങൾ തിന്നരുത്
  rationale: നിഷേധത്തോടുകൂടിയ രണ്ടാംപുരുഷ ബഹുവചന നിയമപ്രയോഗത്തെ വ്യക്തമായ നിരോധനമായി അവതരിപ്പിക്കുന്നു.
- source_word: טָמֵא
  choice: അശുദ്ധം
  rationale: ആചാരപരമായ ശുദ്ധി-അശുദ്ധി വിഭാഗത്തിൽ മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ മതപരമായ പ്രയോഗത്തിലും സ്ഥാപിതമായ പദമാണ്.
- source_word: הוּא לָכֶם
  choice: അതു നിങ്ങൾക്ക് അശുദ്ധമാണ്
  rationale: ലָכֶם സൂചിപ്പിക്കുന്ന ഇസ്രായേലിനോടുള്ള ബന്ധപരമായ പദവി ‘നിങ്ങൾക്ക്’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘തിന്നരുത്’ നിരോധനത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു; ‘അശുദ്ധം’ ഭക്ഷ്യശുചിത്വമെന്നതിലുപരി വാക്യത്തിലെ ആചാരപരമായ വിഭാഗം സൂചിപ്പിക്കുന്നു.
