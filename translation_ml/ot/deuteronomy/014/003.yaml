  text: You shall not eat any detestable thing[a].
translation:
  language: ml
  text: അറപ്പുളവാക്കുന്നതൊന്നും നീ തിന്നരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെറുപ്പുളവാക്കുന്ന ഒരു വസ്തുവും.” എബ്രായപദം അറപ്പിനും വെറുപ്പിനും പാത്രമായ ഒന്നിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് തുടർന്നുവരുന്ന നിരോധിത ഭക്ഷണങ്ങളുടെ പട്ടികയ്ക്ക് ആമുഖമാകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכַל
  choice: നീ തിന്നരുത്
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ לֹא ചേർന്ന രണ്ടാംപുരുഷ ഏകവചന അപൂർണക്രിയ നേരിട്ടുള്ള നിരോധനമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘തിന്നരുത്’ അതിന്റെ ആജ്ഞാത്മക ബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כָּל
  choice: യാതൊന്നും
  rationale: നിഷേധവാക്യത്തിൽ ഏകവചന നാമത്തോടുകൂടിയ כָּל സമഗ്രമായ വ്യാപ്തി നൽകുന്നു; ‘യാതൊന്നും ... അരുത്’ എന്ന പ്രയോഗം ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תּוֹעֵבָה
  choice: അറപ്പുളവാക്കുന്ന യാതൊന്നും
  rationale: ഈ പദം വെറുപ്പിനും അറപ്പിനും പാത്രമായ, നിരോധിക്കപ്പെട്ട വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുവരുന്ന ഭക്ഷണനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ ‘അറപ്പുളവാക്കുന്ന’ എന്നത് ശക്തമായ പ്രതികൂലഭാവം നിലനിർത്തുന്നു; അതിനെ വെറും രുചിവിരുപ്പായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ഉടമ്പടിനിയമത്തിലെ നിരോധനത്തിന്റെ ബലം
  choice: 'നേരിട്ടുള്ള നിയമനിരോധനം: ‘നീ തിന്നരുത്.’'
  alternative: 'പതിവിനെ വിവരിക്കുന്ന പ്രസ്താവന: ‘നീ തിന്നുന്നില്ല.’'
  rationale: ഈ നിയമസന്ദർഭത്തിൽ לֹא + അപൂർണക്രിയ ഒരു പ്രവചനമോ പതിവിന്റെ വിവരണമോ അല്ല, ബാധകമായ നിരോധനമാണ്. അധികമായ വ്യാഖ്യാനദൈവശാസ്ത്രം ചേർക്കാതെ തോറായിലെ നിർദേശബലം പരിഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നേരിട്ടുള്ള നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ‘അറപ്പുളവാക്കുന്ന’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നതുമാണ്; പരമ്പരാഗതമായ ‘മ്ലേച്ഛം’ അടിക്കുറിപ്പിൽ പദവികൽപമായി നൽകിയിരിക്കുന്നു.
