source:
  edition: WLC
  text: זֹ֥את הַ/בְּהֵמָ֖ה אֲשֶׁ֣ר תֹּאכֵ֑לוּ שׁ֕וֹר שֵׂ֥ה כְשָׂבִ֖ים וְ/שֵׂ֥ה עִזִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/004.yaml
  text: 'These are the animals that you may eat: the ox[a], the sheep, and the goat.'
translation:
  language: ml
  text: 'നിങ്ങൾക്ക് ഭക്ഷിക്കാവുന്ന മൃഗങ്ങൾ ഇവയാണ്: കാള[a], ചെമ്മരിയാട്, കോലാട്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നിങ്ങൾക്ക് ഭക്ഷിക്കാവുന്ന മൃഗം ഇതാണ്.’ തുടർന്ന് ഉദാഹരണങ്ങൾ നിരത്തുന്നതിന് മുമ്പ് ഒരു കൂട്ടവിഭാഗത്തെ പരിചയപ്പെടുത്താൻ ഇവിടെ ഏകവചനരൂപങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: മൃഗങ്ങൾ ഇവയാണ്
  rationale: എബ്രായത്തിൽ നിർദേശകസർവനാമവും നാമവും ഏകവചനത്തിലാണെങ്കിലും, തുടർന്നുവരുന്ന പട്ടികയെ ഒരു കൂട്ടവിഭാഗമായി പരിചയപ്പെടുത്തുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: നിങ്ങൾക്ക് ഭക്ഷിക്കാവുന്ന
  rationale: ഈ വാക്യം ഭക്ഷിക്കാൻ അനുമതിയുള്ള മൃഗങ്ങളെ തിരിച്ചറിയുന്നു; നിർബന്ധകല്പനയായി തോന്നിക്കാതെ അനുമതി വ്യക്തമാക്കുന്നു.
- source_word: שׁוֹר
  choice: കാള
  rationale: ഇവിടെ പൊതുവായ ഗോവർഗമൃഗത്തെ സൂചിപ്പിക്കുന്ന പദമാണ്. പട്ടികയുടെ സംക്ഷിപ്ത രൂപം നിലനിർത്തുന്ന പരിചിതമായ മലയാളപദം തെരഞ്ഞെടുത്തു.
- source_word: שֵׂה כְשָׂבִים
  choice: ചെമ്മരിയാട്
  rationale: שֵׂה എന്ന ആട്ടിൻകൂട്ടത്തിലെ മൃഗത്തെ כְשָׂבִים ചെമ്മരിയാടുവർഗമെന്ന് വ്യക്തമാക്കുന്നു; പ്രായം നിർണ്ണയിക്കുന്ന 'കുഞ്ഞാട്' ഒഴിവാക്കി.
- source_word: וְשֵׂה עִזִּים
  choice: കോലാട്
  rationale: മുൻപത്തെ പ്രയോഗത്തിന് സമാന്തരമായി, עִזִּים കോലാട്ടുവർഗത്തെ വ്യക്തമാക്കുന്നു; പ്രായവിശേഷം ചേർക്കാതെ വിഭാഗനാമം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നിയമപട്ടികയുടെ സംക്ഷിപ്തത കാത്തുസൂക്ഷിക്കുകയും എബ്രായത്തിലെ കൂട്ടാർഥമുള്ള ഏകവചനത്തെ സ്വാഭാവിക മലയാള ബഹുവചനമായി അവതരിപ്പിക്കുകയും ചെയ്തു.
