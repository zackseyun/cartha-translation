reference: Deuteronomy 14:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בָּנִ֣ים אַתֶּ֔ם לַֽ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם לֹ֣א תִתְגֹּֽדְד֗וּ וְ/לֹֽא תָשִׂ֧ימוּ קָרְחָ֛ה בֵּ֥ין עֵינֵי/כֶ֖ם לָ/מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: ml
  text: നിങ്ങൾ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയുടെ പുത്രന്മാരാണ്[a]. മരിച്ചവനെച്ചൊല്ലി നിങ്ങളെത്തന്നെ മുറിവേൽപ്പിക്കരുത്; നിങ്ങളുടെ കണ്ണുകൾക്കിടയിൽ[b] കഷണ്ടിപ്പാട് ഉണ്ടാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയുടെ മക്കളാണ്.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘പുത്രന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘കണ്ണുകൾക്കിടയിൽ’; അതായത് നെറ്റിയിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים
  choice: പുത്രന്മാർ
  rationale: എബ്രായപദം പുല്ലിംഗ ബഹുവചനത്തിൽ അക്ഷരാർഥത്തിൽ ‘പുത്രന്മാർ’ എന്നാണ്. ഉടമ്പടിബന്ധത്തിലുള്ള തിരിച്ചറിയൽ പ്രസ്താവനയുടെ മൂലരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഉൾക്കൊള്ളുന്ന അർഥമായ ‘മക്കൾ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേയുടെ
  rationale: ഇവിടെയുള്ള ל ബന്ധത്തെയും അവകാശബന്ധത്തെയും സൂചിപ്പിക്കുന്നു. ദൈവത്തിന്റെ ഉടമ്പടിനാമമായ יהוה മലയാളത്തിൽ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: സർവനാമപ്രത്യയത്തോടുകൂടിയ രൂപത്തിന്റെ അർഥം ‘നിങ്ങളുടെ ദൈവം’ എന്നാണ്; മലയാളത്തിലെ സ്വാഭാവികമായ ബന്ധവാക്യഘടനയ്ക്കായി ‘നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ’ എന്നു നൽകി.
- source_word: תִתְגֹּדְדוּ
  choice: നിങ്ങളെത്തന്നെ മുറിവേൽപ്പിക്കരുത്
  rationale: ആത്മനേപദസ്വഭാവമുള്ള രൂപം വിലാപാചാരത്തിന്റെ ഭാഗമായി സ്വന്തം ശരീരത്തിൽ മുറിവുണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. അതിന്റെ പ്രതിഫലനാർഥവും പ്രവൃത്തിയും വ്യക്തമായി നിലനിർത്തി.
- source_word: תָשִׂימוּ קָרְחָה
  choice: കഷണ്ടിപ്പാട് ഉണ്ടാക്കുകയും അരുത്
  rationale: ഈ പദസമുച്ചയം മനഃപൂർവം ഒരു കഷണ്ടിപ്പാട് ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. എങ്ങനെ ഉണ്ടാക്കുന്നു എന്നു മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘മുണ്ഡനം ചെയ്യുക’ എന്ന വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: בֵּין עֵינֵיכֶם
  choice: നിങ്ങളുടെ കണ്ണുകൾക്കിടയിൽ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തി; ഉദ്ദേശിക്കുന്ന ശരീരഭാഗം നെറ്റിയാണെന്ന വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לָמֵת
  choice: മരിച്ചവനുവേണ്ടി
  rationale: ഏകവചനത്തിലുള്ള ഈ പ്രയോഗം ഒരു മരിച്ച വ്യക്തിയെച്ചൊല്ലിയുള്ള വിലാപാചാരത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ലിംഗനിർദ്ദിഷ്ട പദം
  choice: പുത്രന്മാർ
  alternative: മക്കൾ
  rationale: മൂലപാഠത്തിലെ בָּנִים പുല്ലിംഗ ബഹുവചനമാണെന്ന വസ്തുത മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു. ഉടമ്പടിസമൂഹത്തിലെ സ്ത്രീകളെ ഒഴിവാക്കുന്നു എന്ന വ്യാഖ്യാനം ഇതിൽ നിർബന്ധിതമല്ല; വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഇവിടെ ഒരു സ്ഥാനനാമമല്ല, ദൈവത്തിന്റെ വ്യക്തമായ ഉടമ്പടിനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ പദവി ഉപയോഗിച്ച് മറയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വിലാപവുമായി ബന്ധപ്പെട്ട ശരീരവികൃതീകരണത്തിന്റെ രണ്ട് വിലക്കുകളും വ്യക്തമായി വേർതിരിക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ‘പുത്രന്മാർ’, ‘കണ്ണുകൾക്കിടയിൽ’ എന്നീ സവിശേഷ പ്രയോഗങ്ങൾ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സ്വാഭാവികമായ അർഥവ്യക്തീകരണം അടിക്കുറിപ്പുകളിൽ നൽകി.
