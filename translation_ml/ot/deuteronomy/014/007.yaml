reference: Deuteronomy 14:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: ml
  text: 'എന്നാൽ, അയവിറക്കുന്നവയുടെയോ കുളമ്പ് പിളർന്നവയുടെയോ കൂട്ടത്തിൽ ഇവയെ നിങ്ങൾ തിന്നരുത്: ഒട്ടകം, കാട്ടുമുയൽ[a], പാറക്കുഴിമുയൽ[b] എന്നിവ. കാരണം അവ അയവിറക്കുന്നവയാണ്, പക്ഷേ അവയുടെ കുളമ്പ് പിളർന്നിട്ടില്ല. അവ നിങ്ങൾക്ക് അശുദ്ധമാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുയൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ മൃഗനാമം കാട്ടുമുയലിനെയാകാം സൂചിപ്പിക്കുന്നത്; എങ്കിലും കൃത്യമായ ജന്തുശാസ്ത്രപരമായ തിരിച്ചറിയൽ സംബന്ധിച്ച് അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഹൈറാക്സ്’; പാറക്കെട്ടുകളിൽ ജീവിക്കുന്ന ഒരു ചെറിയ സസ്തനി.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പൊതുനിയമത്തിന് ഇവിടെ വരുന്ന ഒഴിവിനെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; എബ്രായപദത്തിന്റെ വിരുദ്ധതയും പരിമിതപ്പെടുത്തുന്ന ശക്തിയും നിലനിർത്തുന്നു.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: അയവിറക്കുന്നവയിൽ
  rationale: മൃഗം വിഴുങ്ങിയ ആഹാരം വീണ്ടും വായിലേക്കു കൊണ്ടുവന്ന് ചവയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് മലയാളത്തിൽ പതിവും വ്യക്തവുമായ രൂപമാണ് ‘അയവിറക്കുക’.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: കുളമ്പ് പിളർന്നിരിക്കുന്നവയിൽ
  rationale: പിളർന്ന കുളമ്പുള്ള മൃഗങ്ങളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. തുടർന്നുള്ള വിശദീകരണവുമായി പദസമാനത നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: הַגָּמָל
  choice: ഒട്ടകം
  rationale: മൃഗനാമത്തിന്റെ നേരിട്ടുള്ള സാധാരണ മലയാളപരിഭാഷ.
- source_word: הָאַרְנֶבֶת
  choice: കാട്ടുമുയൽ
  rationale: സാധാരണയായി hare എന്നു തിരിച്ചറിയുന്ന മൃഗത്തെ മുയലിൽനിന്ന് വേർതിരിക്കാൻ ‘കാട്ടുമുയൽ’ എന്നു നൽകി; തിരിച്ചറിയലിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַשָּׁפָן
  choice: പാറമുയൽ
  rationale: പാറക്കെട്ടുകളിൽ ജീവിക്കുന്ന hyrax-നെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളനാമം; ശാസ്ത്രീയമായി കൂടുതൽ കൃത്യമായ ‘ഹൈറാക്സ്’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה
  choice: അവ അയവിറക്കുന്നവയാണെങ്കിലും
  rationale: മൃഗങ്ങളെക്കുറിച്ചുള്ള പൊതുവായ പ്രസ്താവനയായി മൂലപാഠത്തിന്റെ വർഗീകരണം അതേപടി നിലനിർത്തുന്നു; അടുത്ത വിരുദ്ധഘടകവുമായി മലയാളത്തിൽ സുഗമമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וּפַרְסָה לֹא הִפְרִיסוּ
  choice: അവയുടെ കുളമ്പ് പിളർന്നിട്ടില്ല
  rationale: എബ്രായത്തിലെ പൊതുവർഗീയ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ആദ്യപകുതിയിലെ ‘കുളമ്പ് പിളർന്നിരിക്കുന്ന’ എന്ന പ്രയോഗവുമായി യോജിപ്പ് പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: അവ നിങ്ങൾക്ക് അശുദ്ധമാണ്
  rationale: ഭക്ഷണനിയമത്തിന്റെ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ പശ്ചാത്തലം ചുരുക്കാതെ, എബ്രായത്തിലെ വിശാലമായ ‘അശുദ്ധം’ എന്ന ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭക്ഷണനിയമത്തിലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: അശുദ്ധം
  alternative: ആചാരപരമായി അശുദ്ധം
  rationale: טָמֵא എന്ന പദം ഈ സന്ദർഭത്തിൽ ശുദ്ധി-അശുദ്ധി വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ആചാരപരമായി’ എന്നു ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ അർഥം ചുരുക്കുന്നതിനാൽ പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: മൃഗങ്ങൾ ‘അയവിറക്കുന്നു’ എന്ന പാഠപ്രസ്താവന
  choice: മൂലപാഠത്തിലെ ദൃശ്യാനുഭവാധിഷ്ഠിത വർഗീകരണം നേരിട്ട് നിലനിർത്തി
  alternative: ആധുനിക ജന്തുശാസ്ത്രത്തിന്റെ അടിസ്ഥാനത്തിൽ പ്രസ്താവന പുനർവ്യാഖ്യാനിക്കുക
  rationale: വാക്യം നൽകുന്ന പുരാതന നിയമവർഗീകരണത്തെ ശാസ്ത്രീയ വിശദീകരണം ചേർത്ത് പരിഹരിക്കുകയോ മാറ്റുകയോ ചെയ്യാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നിയമവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാങ്കേതികമോ പഴഞ്ചനോ ആയ ഭാഷ ഒഴിവാക്കി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പുസൂചകങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടുന്ന വിധത്തിൽ ബന്ധപ്പെട്ട മൃഗനാമങ്ങൾക്കു പിന്നാലെ സ്ഥാപിച്ചു.
