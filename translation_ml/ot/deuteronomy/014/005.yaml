source:
  edition: WLC
  text: אַיָּ֥ל וּ/צְבִ֖י וְ/יַחְמ֑וּר וְ/אַקּ֥וֹ וְ/דִישֹׁ֖ן וּ/תְא֥וֹ וָ/זָֽמֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/005.yaml
  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
translation:
  language: ml
  text: മാൻ[a], കലമാൻ, റോ മാൻ, കാട്ടാട്, ഐബെക്സ്, ആന്റിലോപ്പ്, മലച്ചെമ്മരിയാട് എന്നിവ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലെ പല മൃഗനാമങ്ങളുടെയും കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. ‘റോ മാൻ’ എന്നത് ഫാലോ മാൻ അഥവാ ചുവന്ന മാൻ ആയിരിക്കാം; ‘കാട്ടാട്’ ഐബെക്സ് ആയിരിക്കാം; ‘ഐബെക്സ്’ അഡാക്സ് അഥവാ കാട്ടാട് ആയിരിക്കാം; ‘ആന്റിലോപ്പ്’ കാട്ടുകാള അഥവാ ഔറോക്സ് ആയിരിക്കാം; ‘മലച്ചെമ്മരിയാട്’ ചാമോയിസ് അഥവാ മലവെള്ളാട് ആയിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: മാൻ
  rationale: മാൻവർഗത്തിലെ ഒരു മൃഗത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായതും സ്വാഭാവികവുമായ ആധുനിക മലയാളപദം.
- source_word: צְבִי
  choice: കലമാൻ
  rationale: ഗസെൽ എന്ന മൃഗത്തിനുള്ള പരിചിതമായ മലയാളനാമം; പൊതുവായ ‘മാൻ’ എന്നതിൽനിന്ന് പട്ടികയിലെ ഇനത്തെ വേർതിരിക്കുന്നു.
- source_word: יַחְמוּר
  choice: റോ മാൻ
  rationale: കൃത്യമായ ജന്തുശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണെങ്കിലും, സ്രോതസ്സിലെ മാൻവർഗനാമത്തെ അതിരുകടന്ന് നിർണ്ണയിക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: אַקּוֹ
  choice: കാട്ടാട്
  rationale: ഒരു കാട്ടുകാപ്രിഡിനെ സൂചിപ്പിക്കുന്നതായി കരുതപ്പെടുന്നു; സാങ്കേതികമായ ‘ഐബെക്സ്’ എന്നതിനേക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തം.
- source_word: דִישֹׁן
  choice: ഐബെക്സ്
  rationale: തിരിച്ചറിയൽ വിവാദവിധേയമാണെങ്കിലും, പട്ടികയിലെ വേറിട്ട കാട്ടുമൃഗനാമമായി നിലനിർത്താവുന്ന സാധ്യതയുള്ള പദം.
- source_word: תְּאוֹ
  choice: ആന്റിലോപ്പ്
  rationale: മൃഗത്തിന്റെ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്; കാട്ടുകാള എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യമുള്ള പദം സ്വീകരിച്ചു.
- source_word: זָמֶר
  choice: മലച്ചെമ്മരിയാട്
  rationale: കൃത്യമായ ഇനം അനിശ്ചിതമായതിനാൽ, സാധ്യതയുള്ള മലവാസിയായ ആടുവർഗമൃഗത്തെ സാധാരണക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ പറയുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, ഭക്ഷണനിയമത്തിലെ മൃഗപ്പട്ടിക എന്ന സ്വഭാവം നിലനിർത്തി സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. അപൂർവമായ ജന്തുനാമങ്ങളിൽ മലയാളത്തിൽ സ്ഥിരമായ തത്തുല്യപദം ഇല്ലാത്തിടത്ത് ലിപ്യന്തരണം സ്വീകരിക്കുകയും യഥാർഥമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
