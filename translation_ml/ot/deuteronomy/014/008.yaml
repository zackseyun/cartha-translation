source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: ml
  text: പന്നിയാകട്ടെ, അതിന്റെ കുളമ്പ് പിളർന്നതാണെങ്കിലും അത് അയവിറക്കുന്നില്ല; അതു നിങ്ങൾക്ക് അശുദ്ധമാണ്. അവയുടെ മാംസത്തിൽനിന്ന് ഒന്നും തിന്നരുത്; അവയുടെ ചത്ത ശരീരങ്ങളെ തൊടരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ‘പന്നി’ ഏകവചനമാണെങ്കിലും, ‘അവയുടെ മാംസം’, ‘അവയുടെ ചത്ത ശരീരം’ എന്നീ തുടർന്നുള്ള രൂപങ്ങളിൽ ബഹുവചന പ്രത്യയങ്ങളുണ്ട്; അവ ഇവിടെ ഈ മൃഗവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: textual_grammar
lexical_decisions:
- source_word: הַחֲזִיר
  choice: പന്നി
  rationale: ആധുനിക മലയാളത്തിൽ ഈ മൃഗത്തെ വ്യക്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്ന പൊതുപദം.
- source_word: מַפְרִיס פַּרְסָה
  choice: കുളമ്പ് പിളർന്നത്
  rationale: കുളമ്പ് രണ്ടായി പിരിഞ്ഞിരിക്കുന്നതെന്ന ആഹാരനിയമത്തിലെ മാനദണ്ഡം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: גֵרָה
  choice: അയവിറക്കുക
  rationale: വീണ്ടും വായിലേക്കു കൊണ്ടുവന്ന തീറ്റ ചവയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: טָמֵא
  choice: അശുദ്ധം
  rationale: ധാർമിക ദുഷ്ടത എന്ന ആശയം ചേർക്കാതെ തോറായിലെ ആചാരപരവും ആഹാരനിയമപരവുമായ നില സംരക്ഷിക്കുന്നു.
- source_word: מִבְּשָׂרָם
  choice: പന്നികളുടെ മാംസം
  rationale: ഹീബ്രുവിലെ ബഹുവചന പ്രത്യയം മൃഗവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: נִבְלָתָם
  choice: അവയുടെ ശവങ്ങൾ
  rationale: ചത്ത മൃഗശരീരത്തെ സൂചിപ്പിക്കുന്ന നിയമപരമായ അർഥം നിലനിർത്തുകയും ഹീബ്രുവിലെ ബഹുവചനബന്ധം പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: תִגָּעוּ
  choice: തൊടുക
  rationale: കല്പനയുടെ നേരിട്ടുള്ള ശക്തി വിപുലീകരിക്കാതെയും മയപ്പെടുത്താതെയും നൽകുന്നു.
theological_decisions:
- issue: തോറായിലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: טָמֵא എന്നത് ‘അശുദ്ധം’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: മലിനം; അശുദ്ധീകരിക്കപ്പെട്ടത്
  rationale: വാക്യം ആഹാരനിയമത്തിലെ നിയമപരവും ആചാരപരവുമായ പദവി പ്രസ്താവിക്കുന്നു; ധാർമിക തിന്മയെക്കുറിച്ചുള്ള അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ശവം തൊടരുതെന്ന വിലക്കിന്റെ ശക്തി
  choice: ‘തൊടുകയും അരുത്’ എന്ന നേരിട്ടുള്ള വിലക്ക്
  alternative: കൈകാര്യം ചെയ്യരുത്; അടുത്തു ചെല്ലരുത്
  rationale: נגע എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘തൊടുക’ നിലനിർത്തി കല്പനയുടെ പരിധി കൂട്ടുകയോ കുറയ്ക്കുകയോ ചെയ്യുന്നില്ല.
- issue: ഏകവചന മൃഗനാമവും തുടർന്നുള്ള ബഹുവചന പ്രത്യയങ്ങളും
  choice: ആദ്യം ഏകവചന വർഗനാമം; തുടർന്ന് ‘പന്നികളുടെ/അവയുടെ’ എന്ന വർഗസൂചക ബഹുവചനം
  alternative: മുഴുവനും ഏകവചനമായി ‘അതിന്റെ മാംസം/ശവം’
  rationale: ഹീബ്രുവിലെ യഥാർഥ രൂപമാറ്റം മറച്ചുവയ്ക്കാതെ മലയാളത്തിൽ വായനാസൗകര്യം ഉറപ്പാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി. ‘അയവിറക്കുക’, ‘അശുദ്ധം’ എന്നീ പരിചിതമായ ബൈബിൾ-നിയമപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
