  text: You shall surely tithe all the produce of your seed that comes out of the field[a], year by year.
translation:
  language: ml
  text: നിന്റെ വിത്തിന്റെ സകല വിളവും—വയലിൽനിന്ന് ലഭിക്കുന്നതു—നീ വർഷംതോറും നിർബന്ധമായും പത്തിലൊന്നായി വേർതിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “ഓരോ വർഷവും നിന്റെ വയൽ തരുന്ന മുഴുവൻ വിളവിന്റെയും പത്തിലൊന്ന് നീ നിർബന്ധമായും വേർതിരിക്കണം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: പത്തിലൊന്ന് നീ നിർബന്ധമായും വേർതിരിക്കണം
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്നുള്ള എബ്രായ പ്രയോഗം കല്പനയ്ക്ക് ഊന്നൽ നൽകുന്നു. ‘നിർബന്ധമായും’ ആ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘പത്തിലൊന്ന് വേർതിരിക്കുക’ എന്നത് മതപരമായ സാങ്കേതികപദം മാത്രം ആശ്രയിക്കാതെ അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: תְּבוּאַת
  choice: വിളവ്
  rationale: കൃഷിയിൽനിന്നുള്ള ഉത്പന്നമോ ആദായമോ സൂചിപ്പിക്കുന്ന വിശാലമായ പദമാണിത്. സന്ദർഭത്തിൽ ‘വിളവ്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: זַרְעֶךָ
  choice: നിന്റെ വിത്തിന്റെ വിളവ്
  rationale: മൂലത്തിലെ ‘നിന്റെ വിത്ത്’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ ഉദ്ദേശിക്കുന്നത് വിതച്ചതിൽനിന്നുള്ള കാർഷികോത്പാദനമാണെന്ന് ‘വിളവ്’ വ്യക്തമാക്കുന്നു.
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: വയലിൽനിന്ന് ... ലഭിക്കുന്ന
  rationale: അക്ഷരാർഥത്തിൽ ‘വയലിൽനിന്ന് പുറപ്പെടുന്നത്’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു. കൂടുതൽ ചലനാത്മകമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: שָׁנָה שָׁנָה
  choice: വർഷംതോറും
  rationale: ആവർത്തിച്ചുള്ള എബ്രായ രൂപം ഓരോ വർഷവും മുടങ്ങാതെ എന്ന വിതരണാത്മക ആശയം നൽകുന്നു; ‘വർഷംതോറും’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
