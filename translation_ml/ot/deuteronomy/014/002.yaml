  to: കാരണം, നീ നിന്റെ ദൈവമായ യഹോവയ്ക്ക് വിശുദ്ധമായ ഒരു ജനമാണ്. ഭൂമുഖത്തുള്ള സകല ജനതകളിൽനിന്നും, തനിക്കു സ്വന്തമായ പ്രത്യേക ജനമായിരിക്കേണ്ടതിന് യഹോവ നിന്നെ തിരഞ്ഞെടുത്തിരിക്കുന്നു.[a]
  rationale: തിരഞ്ഞെടുക്കപ്പെട്ട ജനത്തിന്റെ ‘പ്രത്യേക സ്വന്ത’ പദവി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ സְגֻלָּהയുടെ മുഖ്യപാഠരൂപം പരിഷ്കരിച്ചു. ‘അമൂല്യസമ്പത്ത്’ എന്ന ന്യായമായ ശബ്ദാർഥബദൽ അടിക്കുറിപ്പിൽ നിലനിർത്തി. മിക്കാഖണ്ഡങ്ങൾ, ദൈവനാമം, ദൈവിക തിരഞ്ഞെടുപ്പിന്റെ ഉദ്ദേശ്യം, ജനതകളിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് എന്നിവ മാറ്റിയിട്ടില്ല.
