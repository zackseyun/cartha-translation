source:
  edition: WLC
  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וּ/בְ/ךָ֞ בָּחַ֣ר יְהוָ֗ה לִֽ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: ml
  text: കാരണം, നീ നിന്റെ ദൈവമായ യഹോവയ്ക്ക് വിശുദ്ധമായ ഒരു ജനമാണ്. ഭൂമുഖത്തുള്ള സകല ജനതകളിൽനിന്നും, തനിക്കു സ്വന്തമായ പ്രത്യേക ജനമായിരിക്കേണ്ടതിന് യഹോവ നിന്നെ തിരഞ്ഞെടുത്തിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തനിക്കുള്ള അമൂല്യസമ്പത്തായ ഒരു ജനം’ എന്നും പരിഭാഷപ്പെടുത്താം. סְגֻלָּה എന്ന ഹീബ്രുപദം പ്രത്യേകമായി വിലമതിക്കപ്പെടുന്ന ഒരു സ്വത്തിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ വിലക്കിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ഹീബ്രു ബന്ധപദത്തിന്റെ വിശദീകരണശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַם קָדוֹשׁ
  choice: വിശുദ്ധജനം
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ഉടമ്പടിസമൂഹം എന്ന ആശയം സംക്ഷിപ്തവും പരിചിതവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവയ്ക്കു
  rationale: ל സൂചിപ്പിക്കുന്ന ബന്ധവും സ്വന്തമായിരിക്കലും മലയാളത്തിലെ ദാതൃവിഭക്തിയിലൂടെ നിലനിർത്തുന്നു; ദൈവനാമം പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: וּבְךָ בָּחַר יְהוָה
  choice: യഹോവ നിന്നെ ... തിരഞ്ഞെടുത്തിരിക്കുന്നു
  rationale: בחר ב എന്ന ഹീബ്രു പ്രയോഗത്തിൽ ב തിരഞ്ഞെടുക്കപ്പെടുന്ന വ്യക്തിയെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള കർമരൂപമാണ് സ്വാഭാവികം. പൂർത്തിയായ തിരഞ്ഞെടുപ്പിന്റെ ഇപ്പോഴത്തെ ഉടമ്പടിപ്രസക്തിയും ക്രിയാരൂപം സൂചിപ്പിക്കുന്നു.
- source_word: לִהְיוֹת לוֹ
  choice: തനിക്കായി ... ആയിരിക്കേണ്ടതിന്
  rationale: തിരഞ്ഞെടുപ്പിന്റെ ഉദ്ദേശ്യവും ദൈവത്തോടുള്ള സ്വന്തബന്ധവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְעַם סְגֻלָּה
  choice: അമൂല്യസമ്പത്തായ ഒരു ജനം
  rationale: עַם എന്ന ‘ജനം’ എന്ന പദവും סְגֻלָּה സൂചിപ്പിക്കുന്ന പ്രത്യേകമായി വിലമതിക്കപ്പെടുന്ന സ്വത്തും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: מִכֹּל הָעַמִּים
  choice: സകല ജനതകളിൽനിന്നും
  rationale: ജനതകളുടെ ഇടയിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പാണ് מן ഇവിടെ സൂചിപ്പിക്കുന്നത്; അവരെക്കാൾ ശ്രേഷ്ഠർ എന്ന ആശയം വിവർത്തനം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר עַל־פְּנֵי הָאֲדָמָה
  choice: ഭൂമുഖത്തുള്ള
  rationale: ഭൂമിയിൽ വസിക്കുന്ന സകല ജനതകളെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന് സ്വാഭാവികവും സമഗ്രവുമായ മലയാളരൂപം.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ തിരഞ്ഞെടുപ്പിന്റെ സ്വഭാവം
  choice: ദൈവത്തിന്റേതായ വിശുദ്ധജനവും അമൂല്യസമ്പത്തുമായിരിക്കാനുള്ള ഉടമ്പടിപരമായ തിരഞ്ഞെടുപ്പായി അവതരിപ്പിച്ചു.
  alternative: מִכֹּל എന്നത് ‘സകല ജനതകളെക്കാളും മേലായി’ എന്നു പരിഭാഷപ്പെടുത്തി ശ്രേഷ്ഠത ഊന്നിപ്പറയുക.
  rationale: ഹീബ്രു വാചകം സകല ജനതകളുടെ ഇടയിൽനിന്നുള്ള ദൈവിക തിരഞ്ഞെടുപ്പും പ്രത്യേക സ്വന്തബന്ധവും പ്രസ്താവിക്കുന്നു; വംശീയ ശ്രേഷ്ഠതയോ പിൽക്കാലത്തെ തിരഞ്ഞെടുപ്പുസിദ്ധാന്തങ്ങളോ അതിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. അഭിസംബോധനയുടെ ഹീബ്രു ഏകവചനം ‘നീ’ എന്ന രൂപത്തിൽ നിലനിർത്തിയെങ്കിലും അത് ഉടമ്പടിസമൂഹത്തെ കൂട്ടായ്മയായി അഭിസംബോധന ചെയ്യുന്നതാണ്. ദൈവനാമത്തിന് വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
