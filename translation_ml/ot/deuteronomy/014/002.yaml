  naturalness: വാക്യക്രമവും രജിസ്റ്ററും പൊതുവേ ആധുനിക നിലവാരമലയാളത്തിന് അനുയോജ്യമാണ്. ‘വിശുദ്ധമായ ഒരു ജനം’ എന്നും ‘തനിക്കു സ്വന്തമായ പ്രത്യേക ജനമായി’ എന്നും ഉപയോഗിക്കുന്നത് വായനാസുഗമതയും വ്യാകരണസ്വാഭാവികതയും മെച്ചപ്പെടുത്തുന്നു.
