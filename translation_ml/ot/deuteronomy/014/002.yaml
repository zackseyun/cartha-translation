    rationale: ഹീബ്രുവിലെ לְעַם סְגֻלָּה ഒരു ജനത്തെ യഹോവയുടെ പ്രത്യേകവും വിലമതിക്കപ്പെട്ടതുമായ സ്വന്തമായി അവതരിപ്പിക്കുന്നു. ‘തനിക്കു സ്വന്തമായ പ്രത്യേക ജനം’ എന്നത് അർഥം നിലനിർത്തിക്കൊണ്ട് കൂടുതൽ സ്വാഭാവികമായ മലയാളമാണ്.
