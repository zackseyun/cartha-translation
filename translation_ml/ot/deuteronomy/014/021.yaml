revisions:
- from: താനേ ചത്ത ഒരു മൃഗത്തെയും നിങ്ങൾ തിന്നരുത്.[a] നിങ്ങളുടെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന പരദേശിക്ക് അതു കൊടുക്കാം; അയാൾ അതു തിന്നട്ടെ. അല്ലെങ്കിൽ അന്യദേശക്കാരന് അതു വിൽക്കാം.[b][c] കാരണം, നിങ്ങളുടെ ദൈവമായ യഹോവയ്ക്കു വിശുദ്ധജനമാണ് നിങ്ങൾ. കോലാട്ടിൻകുട്ടിയെ അതിന്റെ അമ്മയുടെ പാലിൽ പുഴുങ്ങരുത്.[d]
  to: താനേ ചത്ത ഒരു മൃഗത്തെയും നിങ്ങൾ തിന്നരുത്.[a] നിങ്ങളുടെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന പരദേശിക്ക്[b] അതു കൊടുക്കാം; അയാൾക്ക് അതു തിന്നാം. അല്ലെങ്കിൽ അന്യദേശക്കാരന് അതു വിൽക്കാം.[c] കാരണം, നിങ്ങളുടെ ദൈവമായ യഹോവയ്ക്കു വിശുദ്ധജനമാണ് നിങ്ങൾ. കോലാട്ടിൻകുട്ടിയെ അതിന്റെ അമ്മയുടെ പാലിൽ പുഴുങ്ങരുത്.[d]
  rationale: The sole substantive revision changes the resident foreigner’s eating from a jussive-style expression to an unambiguous Malayalam expression of legal permission. Footnote-anchor placement and the alternative-rendering note have been adjusted to match the revised wording. No doctrinal or interpretive expansion has been introduced.
