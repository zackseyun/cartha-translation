source:
  edition: WLC
  text: לֹ֣א תֹאכְל֣וּ כָל נְ֠בֵלָה לַ/גֵּ֨ר אֲשֶׁר בִּ/שְׁעָרֶ֜י/ךָ תִּתְּנֶ֣נָּ/ה וַ/אֲכָלָ֗/הּ א֤וֹ מָכֹר֙ לְ/נָכְרִ֔י כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: ml
  text: താനേ ചത്ത ഒരു മൃഗത്തെയും നിങ്ങൾ തിന്നരുത്.[a] നിങ്ങളുടെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന പരദേശിക്ക്[b] അതു കൊടുക്കാം; അയാൾക്ക് അതു തിന്നാം. അല്ലെങ്കിൽ അന്യദേശക്കാരന് അതു വിൽക്കാം.[c] കാരണം, നിങ്ങളുടെ ദൈവമായ യഹോവയ്ക്കു വിശുദ്ധജനമാണ് നിങ്ങൾ. കോലാട്ടിൻകുട്ടിയെ അതിന്റെ അമ്മയുടെ പാലിൽ പുഴുങ്ങരുത്.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താനേ ചത്ത ഒരു മൃഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം, അനുവദിക്കപ്പെട്ട രീതിയിൽ അറുക്കാതെ ചത്ത മൃഗത്തിന്റെ ജഡത്തെ സൂചിപ്പിക്കുന്നു; ‘ശവം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘താമസിക്കുന്ന പരദേശി’ എന്നു പറഞ്ഞിരിക്കുന്നത് ഇസ്രായേൽ സമൂഹത്തിനുള്ളിൽ വസിക്കുന്ന ഇസ്രായേല്യനല്ലാത്ത വ്യക്തിയെയാണ്; അടുത്തതായി പറയുന്ന ‘അന്യദേശക്കാരൻ’ മറ്റൊരു എബ്രായപദത്തിന്റെ പരിഭാഷയാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘കൊടുക്കാം … തിന്നാം … വിൽക്കാം’ എന്നത് അനുവാദമായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു. എബ്രായ നിയമശൈലി കൂടുതൽ ഔപചാരികമായി ‘കൊടുക്കണം … അവൻ തിന്നണം … വിൽക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താവുന്നതാണ്.
    reason: alternative_reading
  - marker: d
    text: ‘കോലാട്ടിൻകുട്ടി’ എന്നതിന് പരമ്പരാഗതമായി ‘ആട്ടിൻകുട്ടി’ എന്നു പറയാറുണ്ടെങ്കിലും, ഇവിടെ എബ്രായപദം പ്രത്യേകമായി കോലാടിന്റെ കുഞ്ഞിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  choice: താനേ ചത്ത ഒരു മൃഗം
  rationale: അനുവദിക്കപ്പെട്ട രീതിയിൽ അറുക്കാതെ ചത്ത മൃഗത്തിന്റെ ജഡത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘താനേ ചത്ത മൃഗം’ ഭക്ഷണനിയമത്തിന്റെ ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: גֵּר
  choice: താമസിക്കുന്ന പരദേശി
  rationale: ഇസ്രായേൽ സമൂഹത്തിനുള്ളിൽ താമസിക്കുന്ന, ഇസ്രായേല്യനല്ലാത്ത വ്യക്തിയുടെ അംഗീകൃത സാമൂഹിക നില സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള נָכְרִי എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: בִּשְׁעָרֶיךָ
  choice: നിങ്ങളുടെ പട്ടണങ്ങളിൽ
  rationale: അക്ഷരാർഥം ‘നിങ്ങളുടെ കവാടങ്ങൾക്കുള്ളിൽ’ എന്നാണെങ്കിലും, പട്ടണങ്ങളിലോ പ്രാദേശിക സമൂഹത്തിലോ താമസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ / מָכֹר
  choice: കൊടുക്കാം … തിന്നട്ടെ / വിൽക്കാം
  rationale: നിയമഭാഷയിലെ രൂപങ്ങൾ ഇവിടെ നിർബന്ധത്തെക്കാൾ അനുവദനീയമായ നടപടിയാണ് വ്യക്തമാക്കുന്നത്; മലയാളത്തിൽ ഈ അനുവാദഭാവം സ്വാഭാവികമായി പകർന്നു.
- source_word: נָכְרִי
  choice: അന്യദേശക്കാരൻ
  rationale: സമൂഹത്തിനുള്ളിൽ താമസിക്കുന്ന גֵּר എന്ന പരദേശിയിൽനിന്ന് വ്യത്യസ്തമായി, പുറത്തുള്ള വിദേശിയെയോ അന്യദേശക്കാരനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: עַם קָדוֹשׁ
  choice: വിശുദ്ധജനം
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കു
  rationale: ലഭ്യമായ ഹീബ്രു പാഠത്തിലെ ദൈവനാമമായ יהוה നേരിട്ട് പ്രതിനിധീകരിക്കുകയും ‘യഹോവയ്ക്കായി/യഹോവയ്ക്കു സ്വന്തമായ’ എന്ന സമർപ്പണബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: גְּדִי
  choice: കോലാട്ടിൻകുട്ടി
  rationale: ആധുനിക മലയാളവായനക്കാർക്ക് വ്യക്തമായ വിധത്തിൽ ചെറുപ്പമായ ആടിനെയല്ല, goat-ന്റെ കുഞ്ഞിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תְבַשֵּׁל
  choice: പുഴുങ്ങുക
  rationale: ദ്രാവകത്തിൽ വേവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ പ്രത്യേക അർഥം പൊതുവായ ‘പാകം ചെയ്യുക’ എന്നതിനെക്കാൾ കൃത്യമായി നൽകുന്നു.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: അതിന്റെ അമ്മയുടെ പാലിൽ
  rationale: നിരോധനത്തിലെ മൂർത്തമായ ദൃശ്യവും ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം മറച്ചുവയ്ക്കാതെ മലയാളത്തിലെ പരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു.
- issue: ചത്ത മൃഗത്തെ കൊടുക്കുകയോ വിൽക്കുകയോ ചെയ്യുന്നതിനെക്കുറിച്ചുള്ള നിയമക്രിയകളുടെ ഭാവം
  choice: 'അനുവാദഭാവം: ‘കൊടുക്കാം … വിൽക്കാം’'
  alternative: 'ആജ്ഞാഭാവം: ‘കൊടുക്കണം … വിൽക്കണം’'
  rationale: പ്രധാന നിരോധനം ഇസ്രായേല്യർ അതു ഭക്ഷിക്കരുത് എന്നതാണ്; തുടർന്നുള്ള നടപടികൾ നിർബന്ധമായ കല്പനയായി അല്ല, അനുവദിക്കപ്പെട്ട വഴികളായി വായിക്കുന്നത് സന്ദർഭത്തിന് യോജിക്കുന്നു. എന്നാൽ ഹീബ്രു നിയമശൈലിയിൽ ആജ്ഞാഭാവത്തിലുള്ള വിവർത്തനവും സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നിങ്ങളുടെ കവാടങ്ങൾക്കുള്ളിൽ’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിനു പകരം സ്വാഭാവികമായ ‘നിങ്ങളുടെ പട്ടണങ്ങളിൽ’ ഉപയോഗിച്ചു. നിയമവാക്യങ്ങളുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായി പുരാതനമോ സഭാവിഭാഗ-വിശേഷമോ ആയ ഭാഷ ഒഴിവാക്കി.
