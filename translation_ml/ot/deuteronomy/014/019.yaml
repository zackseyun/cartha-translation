translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. അപരിചിതമായ പദാനുപദ ഘടന ഒഴിവാക്കിയെങ്കിലും, പറക്കുന്ന ജീവികളുടെ വിഭാഗവും കൂട്ടംകൂടുന്ന ചെറുജീവികളുടെ സ്വഭാവവും തമ്മിലുള്ള എബ്രായത്തിലെ യഥാർഥ ആശയസംഘർഷം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
