source:
  edition: WLC
  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף טָמֵ֥א ה֖וּא לָ/כֶ֑ם לֹ֖א יֵאָכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/019.yaml
  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: ml
  text: പറക്കുന്ന എല്ലാ കൂട്ടംകൂടുന്ന ചെറുജീവിയും നിങ്ങൾക്ക് അശുദ്ധമാണ്[a]; അവയെ ഭക്ഷിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘പറക്കുന്ന കൂട്ടംകൂടുന്ന ജീവികളൊക്കെയും’ / ‘ചിറകുള്ള കൂട്ടംകൂടുന്ന ജീവികളൊക്കെയും.’ എബ്രായപ്രയോഗം שֶׁרֶץ (‘കൂട്ടംകൂടുന്ന ജീവി’) എന്ന പദത്തോടു עוֹף (‘പറക്കുന്ന ജീവി, പക്ഷി’) എന്ന പദം ചേർക്കുന്നു; അതിനാൽ സാധാരണ അർഥത്തിലുള്ള പക്ഷികളെക്കാൾ പ്രത്യേകിച്ച് പറക്കുന്ന കീടങ്ങളെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: ഒക്കെയും
  rationale: וְ ഈ വിലക്കിനെ മുൻപുള്ള ആഹാരനിയമങ്ങളോടു ബന്ധിപ്പിക്കുന്നു; כֹל-ന്റെ സമഗ്രമായ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ ‘ഒക്കെയും’ വ്യക്തമാക്കുന്നു.
- source_word: שֶׁרֶץ הָ/עוֹף
  choice: പറക്കുന്ന കൂട്ടത്തിൽപ്പെട്ട കൂട്ടംകൂടുന്ന ചെറുജീവികൾ
  rationale: שֶׁרֶץ കൂട്ടംകൂടി പെരുകുകയോ സഞ്ചരിക്കുകയോ ചെയ്യുന്ന ചെറിയ ജീവികളെ സൂചിപ്പിക്കുന്നു; עוֹף പറക്കുന്ന ജീവികളുടെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ഈ സംയുക്തപ്രയോഗം സാധാരണ പക്ഷികളെക്കാൾ പ്രത്യേകിച്ച് ചിറകുള്ള ചെറുജീവികളെയോ പറക്കുന്ന കീടങ്ങളെയോ ഉദ്ദേശിക്കുന്നതായി തോന്നുന്നു. അതേസമയം എബ്രായത്തിലെ വിഭാഗബന്ധം പൂർണമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: טָמֵא
  choice: അശുദ്ധമാണ്
  rationale: ആചാരപരവും ആഹാരനിയമപരവുമായ അശുദ്ധിയുടെ നിയമവിഭാഗം സൂചിപ്പിക്കുന്ന പതിവായ മലയാളപദമാണ് ‘അശുദ്ധം’.
- source_word: לָ/כֶם
  choice: നിങ്ങൾക്ക്
  rationale: നിയമം അഭിസംബോധിതരായ ഇസ്രായേല്യരോടുള്ള ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לֹא יֵאָכֵלוּ
  choice: അവയെ തിന്നരുത്
  rationale: എബ്രായത്തിൽ രൂപം നിഷ്ക്രിയവും ബഹുവചനവുമാണ്—‘അവ ഭക്ഷിക്കപ്പെടരുത്.’ എന്നാൽ മലയാള നിയമഭാഷയിൽ അതിന്റെ നിരോധനബലം സ്വാഭാവികമായി ‘അവയെ തിന്നരുത്’ എന്നു പറയാം; ‘അവയെ’ എന്ന ബഹുവചനം മൂലപാഠത്തിലെ ബഹുവചനസൂചന നിലനിർത്തുന്നു.
