- from: അവനെ തീർച്ചയായും കൊന്നുകളയണം; അവനെ കൊല്ലേണ്ടതിന് ആദ്യം അവന്റെമേൽ കൈവെക്കേണ്ടത് നീയാണ്[a]; അതിനുശേഷം ജനമെല്ലാം കൈവെക്കണം.
  to: എന്തെന്നാൽ, നീ അവനെ തീർച്ചയായും വധിക്കണം[a]; അവനെ വധിക്കുന്നതിൽ ആദ്യം അവന്റെമേൽ നിന്റെ കൈ ഉണ്ടായിരിക്കണം; അതിനുശേഷം സകല ജനത്തിന്റെയും കൈയും ഉണ്ടായിരിക്കണം.
