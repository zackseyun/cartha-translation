source:
  edition: WLC
  text: כִּ֤י הָרֹג֙ תַּֽהַרְגֶ֔/נּוּ יָֽדְ/ךָ֛ תִּֽהְיֶה בּ֥/וֹ בָ/רִֽאשׁוֹנָ֖ה לַ/הֲמִית֑/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/010.yaml
  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: ml
  text: എന്തെന്നാൽ, നീ അവനെ തീർച്ചയായും വധിക്കണം[a]; അവനെ വധിക്കുന്നതിൽ ആദ്യം അവന്റെമേൽ നിന്റെ കൈ ഉണ്ടായിരിക്കണം; അതിനുശേഷം സകല ജനത്തിന്റെയും കൈയും ഉണ്ടായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ അവനെ തീർച്ചയായും കൊല്ലണം.” എബ്രായത്തിൽ ഒരേ ക്രിയയുടെ ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും പരിമിതക്രിയയും ചേർത്ത് ശക്തമായ ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ ആജ്ഞയുടെ ഊന്നലിൽ ഉൾപ്പെടുത്തി
  rationale: ഇവിടെ כִּי മുൻസന്ദർഭത്തിന്റെ വിശദീകരണമോ ശക്തമായ ഉറപ്പോ നൽകുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ ‘എന്തെന്നാൽ’ എന്നു തുടങ്ങുന്നത് അസ്വാഭാവികമാകാം; അതിന്റെ ശക്തി ‘തീർച്ചയായും’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: അവനെ തീർച്ചയായും കൊന്നുകളയണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും പരിമിതക്രിയയും ചേർന്ന രൂപം ശക്തമായ നിർബന്ധവും ഉറപ്പും പ്രകടിപ്പിക്കുന്നു. ‘തീർച്ചയായും ... വേണം’ അതിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: יָדְךָ
  choice: കൈവെക്കേണ്ടത് നീയാണ്
  rationale: എബ്രായത്തിലെ ‘നിന്റെ കൈ’ എന്ന ദൃശ്യമായ നിയമപ്രയോഗം പൂർണമായി ‘നീ’ എന്നാക്കി ലഘൂകരിക്കാതെ, പ്രവർത്തനത്തിൽ നേരിട്ട് പങ്കുചേരുന്നതിനെ സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗമായി നിലനിർത്തുന്നു.
- source_word: תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: ആദ്യം അവന്റെമേൽ കൈവെക്കേണ്ടത് നീയാണ്
  rationale: ശിക്ഷ നടപ്പാക്കുന്നതിൽ ആദ്യം പ്രവർത്തിക്കേണ്ട വ്യക്തിയെ ഈ ഘടന വ്യക്തമാക്കുന്നു. ‘അവന്റെമേൽ’ എന്നത് בּוֹ-യുടെ ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: לַהֲמִיתוֹ
  choice: അവനെ കൊല്ലേണ്ടതിന്
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം മരണത്തിന് ഇടയാക്കുക എന്ന നിയമപരമായ അർഥം നൽകുന്നു. മലയാളത്തിൽ ആവർത്തനം ഉണ്ടായാലും മൂലത്തിലെ വ്യക്തതയും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: וְיַד כָּל הָעָם
  choice: ജനമെല്ലാം കൈവെക്കണം
  rationale: ‘നിന്റെ കൈ’ / ‘സകല ജനത്തിന്റെയും കൈ’ എന്ന സമാന്തരത മലയാളത്തിൽ പ്രവർത്തനാത്മകമായി സംരക്ഷിക്കുകയും സമൂഹത്തിന്റെ പങ്കാളിത്തം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בָּאַחֲרֹנָה
  choice: അതിനു ശേഷം
  rationale: ‘ആദ്യം’ എന്നതിനോടുള്ള കാലക്രമവിരുദ്ധത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: നിയമപരമായ വധശിക്ഷയുടെ ഭാഷ മൃദൂകരിക്കാതെയും അതിശയോക്തിയാക്കാതെയും പരിഭാഷപ്പെടുത്തൽ
  choice: കൊന്നുകളയണം / കൊല്ലേണ്ടതിന്
  alternative: വധിക്കണം / മരണശിക്ഷ നടപ്പാക്കാൻ
  rationale: മൂലപാഠം നേരിട്ട് കൊല്ലുന്നതിനെക്കുറിച്ചാണ് പറയുന്നത്. ‘വധിക്കുക’ സാധുവായിരുന്നാലും ‘കൊല്ലുക’ הרג-ന്റെ നേരിട്ടുള്ള അർഥം സുതാര്യമായി നിലനിർത്തുന്നു; ഇതിലൂടെ ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളം. നിയമസന്ദർഭത്തിന്റെ കാഠിന്യം മൃദൂകരിക്കാതെ, ‘കൈവെക്കുക’ എന്ന ദൃശ്യപ്രയോഗത്തിലൂടെ മൂലത്തിലെ ‘കൈ’ എന്ന സമാന്തരത സംരക്ഷിച്ചു.
