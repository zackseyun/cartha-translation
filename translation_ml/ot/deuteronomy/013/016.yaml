reference: Deuteronomy 13:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַכֵּ֣ה תַכֶּ֗ה אֶת יֹֽשְׁבֵ֛י הָ/עִ֥יר ה/הוא לְ/פִי חָ֑רֶב הַחֲרֵ֨ם אֹתָ֧/הּ וְ/אֶת כָּל אֲשֶׁר בָּ֛/הּ וְ/אֶת בְּהֶמְתָּ֖/הּ לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/016.yaml
  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: ml
  text: ആ പട്ടണത്തിലെ നിവാസികളെ വാളിന്റെ മൂർച്ചയാൽ[b] നിശ്ചയമായും വെട്ടിവീഴ്ത്തണം. ആ പട്ടണത്തെയും അതിലുള്ള സകലത്തെയും അതിലെ വളർത്തുമൃഗങ്ങളെയും നാശത്തിനായി സമർപ്പിച്ച്[a] വാളിന്റെ മൂർച്ചയാൽ സംഹരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിശ്ശേഷം നശിപ്പിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ, തിരിച്ചെടുക്കാനാവാത്തവിധം നാശത്തിനായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘വാളിന്റെ വായാൽ’; ‘വാളിന്റെ മൂർച്ചയാൽ’ എന്നർഥമുള്ള എബ്രായ ശൈലിപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: നിശ്ചയമായും വെട്ടിവീഴ്ത്തണം
  rationale: നכה എന്ന ക്രിയയുടെ infinitive absolute + imperfect ഘടന കല്പനയ്ക്ക് ശക്തമായ ഊന്നൽ നൽകുന്നു. ‘നിശ്ചയമായും’ ആ ഊന്നൽ നിലനിർത്തുന്നു; വാളിനെക്കുറിച്ചുള്ള തുടർന്നുള്ള പ്രയോഗം മാരകമായ അർഥം വ്യക്തമാക്കുന്നതിനാൽ ‘വെട്ടിവീഴ്ത്തണം’ യോജിക്കുന്നു.
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: ആ പട്ടണത്തിലെ നിവാസികളെ
  rationale: പട്ടണത്തിൽ താമസിക്കുന്ന ജനസമൂഹത്തെയാണ് participial രൂപം സൂചിപ്പിക്കുന്നത്. ‘നിവാസികൾ’ ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְפִי חָרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ
  rationale: പ്രയോഗത്തിന്റെ അക്ഷരാർഥമായ ‘വാളിന്റെ വായ്’ എന്ന ദൃശ്യബിംബവും മുറിക്കുന്ന വായ്ത്തല എന്ന അർഥവും മലയാളത്തിൽ നിലനിർത്തുന്നു. എബ്രായത്തിലെ ആവർത്തനം മുഖ്യപാഠത്തിലും നിലനിർത്തി.
- source_word: הַחֲרֵם
  choice: നാശത്തിനായി പൂർണമായി സമർപ്പിച്ച്
  rationale: Hiphil രൂപത്തിലുള്ള חרם വെറും നശിപ്പിക്കൽ മാത്രമല്ല, തിരിച്ചെടുക്കാനാവാത്തവിധം നാശത്തിനായി നീക്കിവെക്കുന്നതെന്ന സാങ്കേതിക-വിശുദ്ധ അർഥവും വഹിക്കുന്നു. ഈ പരിഭാഷ ആ അർഥതലവും കല്പനയുടെ സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: אֹתָהּ
  choice: പട്ടണത്തെയും
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം ‘പട്ടണം’ എന്ന പദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ മലയാളത്തിൽ നാമം ആവർത്തിച്ചു.
- source_word: וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: അതിലുള്ള സകലത്തെയും
  rationale: നാശത്തിന്റെ പരിധി പട്ടണത്തിലെ എല്ലാ വസ്തുക്കളിലേക്കും വ്യാപിക്കുന്നതായി സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: בְּהֶמְתָּהּ
  choice: അതിലെ കന്നുകാലികളെയും
  rationale: בְּהֵמָה സാധാരണയായി വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘കന്നുകാലികൾ’ മലയാളത്തിൽ ഈ കൂട്ടാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യുദ്ധ-ന്യായവിധി സന്ദർഭത്തിലെ חרם എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നാശത്തിനായി പൂർണമായി സമർപ്പിച്ച്
  alternative: നിശ്ശേഷം നശിപ്പിച്ച്; നിരോധനത്തിനു കീഴിലാക്കി
  rationale: ഈ പദം സമ്പൂർണ നാശത്തോടൊപ്പം ഒരു സാങ്കേതിക-വിശുദ്ധ സമർപ്പണഭാവവും ഉൾക്കൊള്ളുന്നു. തിരഞ്ഞെടുത്ത രൂപം വെറും സൈനിക നശീകരണമായി ചുരുക്കാതെയും ആധുനിക വായനക്കാരന് പൂർണമായി അഗ്രാഹ്യമാകാതെയും ആ സംഘർഷം നിലനിർത്തുന്നു.
- issue: കല്പനയിലെ കഠിനമായ ന്യായവിധിഭാഷ
  choice: കല്പനയുടെ പൂർണ ശക്തി മയപ്പെടുത്താതെ നിലനിർത്തുക
  alternative: തോൽപ്പിക്കുക പോലുള്ള മൃദുവായ പദങ്ങൾ ഉപയോഗിക്കുക
  rationale: എബ്രായപാഠം നിവാസികളെയും പട്ടണത്തിലുള്ള സകലത്തെയും കന്നുകാലികളെയും ഉൾക്കൊള്ളുന്ന സമഗ്രമായ നാശകല്പനയാണ് നൽകുന്നത്. അതിന്റെ കഠിനത കുറയ്ക്കുന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനപരമായ ശമനം ചേർക്കും.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ള കല്പനാശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ഊന്നലും ‘വാളിന്റെ വായ്’ എന്ന ദൃശ്യബിംബത്തിന്റെ ആവർത്തനവും നിലനിർത്തി; חרם എന്ന പദത്തിന്റെ സാങ്കേതിക-വിശുദ്ധ അർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
