  source_fidelity: 'മുഖ്യ ആശയം ശരിയായി കൈമാറുന്നു: ഊന്നലുള്ള കല്പന, പട്ടണനിവാസികൾ, חרם മുഖേന നാശത്തിനു സമർപ്പിക്കൽ, ഉള്ളടക്കവും വളർത്തുമൃഗങ്ങളും, ‘വാളിന്റെ വായ്’ എന്ന ആവർത്തിത പ്രയോഗം എന്നിവ നിലനിൽക്കുന്നു. എന്നാൽ ‘വാളിന്റെ വായ്ത്തലയാൽ’ ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികവും അല്പം അവ്യക്തവുമാണ്; എബ്രായ ശൈലിപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകാൻ ‘വാളിന്റെ മൂർച്ചയാൽ’ ഉചിതമാണ്.'
  naturalness: ‘വാളിന്റെ മൂർച്ചയാൽ’ എന്നത് സാധാരണവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണ്. ‘പൂർണമായി’ നീക്കുന്നതിലൂടെ മൂലത്തിലെ സാങ്കേതികമായ חרם-അർഥം അധികവ്യാഖ്യാനമില്ലാതെ ‘നാശത്തിനായി സമർപ്പിക്കുക’ എന്നതിൽ നിലനിർത്താം. വാക്യഘടനയും പട്ടണവും അതിലെ സകലവും വളർത്തുമൃഗങ്ങളും ഒരേ വ്യാപ്തിയിൽ ഉൾപ്പെടുന്നതായി വ്യക്തമാക്കുന്നു.
  terminology: ‘നിവാസികൾ,’ ‘നാശത്തിനായി സമർപ്പിക്കുക,’ ‘വളർത്തുമൃഗങ്ങൾ’ എന്നിവ ആധുനിക മാനക മലയാളത്തിൽ കൃത്യമാണ്. בְּהֵמָהയ്ക്ക് ‘വളർത്തുമൃഗങ്ങൾ’ എന്നത് ‘കന്നുകാലികൾ’ എന്നതിനെക്കാൾ വ്യാപകമായ കൂട്ടാർത്ഥം നൽകുന്നു. חרם-ന്റെ തിരിച്ചെടുക്കാനാവാത്ത സമർപ്പണ-നാശഭാവം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
  issues:
