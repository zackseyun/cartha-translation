  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹר֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לַ/עֲשׂוֹת֙ הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സ്വരം കേൾക്കുകയും, ഞാൻ ഇന്ന് നിന്നോടു കൽപ്പിക്കുന്ന അവന്റെ എല്ലാ കൽപ്പനകളും പാലിക്കുകയും, നിന്റെ ദൈവമായ യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ ശരിയായത് ചെയ്യുകയും ചെയ്താൽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്താൽ
  rationale: ഇവിടെ മുൻവാക്യത്തിലെ വാഗ്ദാനത്തിനുള്ള വ്യവസ്ഥയാണ് അവതരിപ്പിക്കുന്നത്. മലയാളത്തിൽ വാക്യാവസാനത്തിലെ ‘ചെയ്താൽ’ വ്യവസ്ഥാഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תִשְׁמַע בְּקוֹל
  choice: സ്വരം നീ കേട്ട്
  rationale: ശ്രദ്ധയോടെ കേൾക്കുന്നതും അതനുസരിക്കുന്നതും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശ്രവണരൂപകം നിലനിർത്തുന്നു; ‘അനുസരിക്കുക’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: ഉടമ്പടിസംബന്ധിയായ ‘നിന്റെ ദൈവം’ എന്ന ബന്ധം സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: לִשְׁמֹר אֶת כָּל מִצְוֺתָיו
  choice: അവന്റെ എല്ലാ കല്പനകളും പാലിക്കുകയും
  rationale: שׁמר എന്നതിലെ ശ്രദ്ധാപൂർവമായ ആചരണഭാവം ‘പാലിക്കുക’ വ്യക്തമാക്കുന്നു; ‘എല്ലാ’ എന്ന സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന
  rationale: പങ്കാളിക്രിയയുടെ ഇപ്പോഴത്തെ പ്രസംഗക്രിയാഭാവവും ‘ഇന്ന്’ എന്ന സമയസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: ശരിയായതു ചെയ്യുകയും
  rationale: ധാർമികമായി നേരായതോ ശരിയായതോ ചെയ്യുക എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: വിലയിരുത്തൽ സൂചിപ്പിക്കുന്ന എബ്രായ ‘കണ്ണുകളിൽ’ എന്ന പ്രയോഗത്തിന് മലയാളത്തിൽ പരിചിതവും മാന്യവുമായ തുല്യപ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: שׁמע בקול എന്നതിലെ അനുസരണഭാവം
  choice: സ്വരം കേൾക്കുക
  alternative: അനുസരിക്കുക
  rationale: ഈ പ്രയോഗത്തിൽ അനുസരണം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, മൂലത്തിലെ ശ്രവണരൂപകവും വ്യക്തിപരമായ ‘സ്വരം’ എന്ന ഘടകവും സംരക്ഷിക്കാൻ ‘കേൾക്കുക’ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. മൂലത്തിലെ വ്യവസ്ഥാഭാവം മലയാളത്തിലെ ‘ചെയ്താൽ’ ഘടനയിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു; ദൈവനാമം ‘യഹ്‌വേ’ എന്നു നൽകിയിരിക്കുന്നു.
