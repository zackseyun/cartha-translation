revisions:
- from: നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സ്വരം നീ കേട്ട്, ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന അവന്റെ എല്ലാ കല്പനകളും പാലിക്കുകയും നിന്റെ ദൈവമായ യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്യുകയും ചെയ്താൽ.
