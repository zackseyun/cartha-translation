reference: Deuteronomy 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי תִשְׁמַ֞ע בְּ/אַחַ֣ת עָרֶ֗י/ךָ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֥ן לְ/ךָ֛ לָ/שֶׁ֥בֶת שָׁ֖ם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: ml
  text: 'നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ നിങ്ങൾക്കു അവിടെ താമസിക്കാനായി[b] നൽകുന്ന പട്ടണങ്ങളിലൊന്നിൽ ഇങ്ങനെ പറയുന്നതായി നിങ്ങൾ കേട്ടാൽ[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങൾ കേൾക്കുമ്പോൾ.’ നിയമപരമായ സന്ദർഭങ്ങളിൽ ഹീബ്രു സംയോജകപദത്തിന് നിബന്ധനയെയോ സമയത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവിടെ പാർക്കാനായി’ അല്ലെങ്കിൽ ‘അവിടെ കുടിയേറാനായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കേട്ടാൽ
  rationale: നിയമപരമായ ഈ സാങ്കൽപ്പിക സാഹചര്യത്തിൽ כִּי നിബന്ധന അവതരിപ്പിക്കുന്നു. അതിനാൽ ‘എങ്കിൽ/കേട്ടാൽ’ എന്ന അർഥം യോജിക്കുന്നു; കാലസൂചനയായ ‘കേൾക്കുമ്പോൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תִשְׁמַע
  choice: നിങ്ങൾ കേട്ടാൽ
  rationale: ഇവിടെ שׁמע ഒരു വിവരം കേട്ടറിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ തുടർന്നുവരുന്ന റിപ്പോർട്ടിന്റെ ഉള്ളടക്കവുമായി സ്വാഭാവികമായി ചേരുന്ന പ്രയോഗമാണിത്.
- source_word: בְּאַחַת עָרֶיךָ
  choice: പട്ടണങ്ങളിലൊന്നിൽ
  rationale: עִיר എന്നത് നഗരം അല്ലെങ്കിൽ പട്ടണം എന്നർഥമുള്ളതാണ്. ഈ പൊതുവായ ഇസ്രായേല്യ വാസകേന്ദ്രസന്ദർഭത്തിൽ ‘പട്ടണം’ സ്വാഭാവികമാണ്; രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥത ‘നിങ്ങളുടെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ഉടമ്പടിസംബന്ധമായ നേരിട്ടുള്ള അഭിസംബോധന ‘നിങ്ങളുടെ ദൈവം’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: נֹתֵן לְךָ
  choice: നിങ്ങൾക്കു ... നൽകുന്ന
  rationale: ഹീബ്രു കർത്തൃവാചക ക്രിയാനാമം ദൈവത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്നതോ സവിശേഷമായതോ ആയ ദാനപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ബന്ധവാക്യത്തിലെ ‘നൽകുന്ന’ മലയാളത്തിൽ ആ ഭാവം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: לָשֶׁבֶת שָׁם
  choice: താമസിക്കാനായി
  rationale: ל + ישׁב എന്ന ഘടന പട്ടണങ്ങൾ നൽകുന്നതിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ‘താമസിക്കാനായി’ ആ അർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറയുന്നതായി
  rationale: לֵאמֹר അടുത്ത വാക്യത്തിൽ വരുന്ന റിപ്പോർട്ടിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. ‘ഇങ്ങനെ പറയുന്നതായി’ എന്നത് മലയാളത്തിൽ കേട്ട വിവരത്തിലേക്കുള്ള സ്വാഭാവികമായ പ്രവേശനമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനനാമമോ പദവിയോ അല്ല, ചതുർവ്യഞ്ജന ദൈവനാമമാണ് നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ ‘യഹോവ’ എന്നു നൽകുന്നു.
- issue: כִּי എന്നതിന്റെ നിബന്ധനാത്മകമോ കാലികമോ ആയ അർഥം
  choice: കേട്ടാൽ
  alternative: കേൾക്കുമ്പോൾ
  rationale: തുടർന്നുള്ള നിയമനടപടിക്കുള്ള സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ നിബന്ധനാത്മക വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ഹീബ്രുവിലെ കാലിക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ നിബന്ധനാത്മക ഘടനയും അടുത്ത വാക്യത്തിലേക്കു തുറക്കുന്ന റിപ്പോർട്ട്-സൂചനയും നിലനിർത്തിയിരിക്കുന്നു. ‘നീ’ എന്ന ഏകവചന രൂപത്തിനുപകരം മലയാള ബൈബിൾ ഗദ്യത്തിൽ മാന്യവും സ്വാഭാവികവുമായ ‘നിങ്ങൾ’ ഉപയോഗിച്ചു.
