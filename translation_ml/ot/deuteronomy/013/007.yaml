source:
  edition: WLC
  text: כִּ֣י יְסִֽיתְ/ךָ֡ אָחִ֣י/ךָ בֶן אִ֠מֶּ/ךָ אֽוֹ בִנְ/ךָ֨ אֽוֹ בִתְּ/ךָ֜ א֣וֹ אֵ֣שֶׁת חֵיקֶ֗/ךָ א֧וֹ רֵֽעֲ/ךָ֛ אֲשֶׁ֥ר כְּ/נַפְשְׁ/ךָ֖ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר נֵֽלְכָ֗ה וְ/נַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַ/אֲבֹתֶֽי/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: ml
  text: നിന്റെ അമ്മയുടെ മകനായ നിന്റെ സഹോദരനോ, നിന്റെ മകനോ മകളോ, നിന്റെ മാറോടു ചേർന്നിരിക്കുന്ന ഭാര്യയോ[a], നിന്റെ സ്വന്തം പ്രാണനെപ്പോലെയുള്ള സ്നേഹിതനോ[b] നിന്നെ രഹസ്യമായി പ്രലോഭിപ്പിച്ചുകൊണ്ട്, ‘നമുക്കു പോയി അന്യദേവന്മാരെ സേവിക്കാം’ എന്നു പറഞ്ഞാൽ—നിനക്കും നിന്റെ പിതാക്കന്മാർക്കും പരിചയമില്ലാത്ത ദേവന്മാരെ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ മാറിടത്തിലെ ഭാര്യ’; ഏറ്റവും അടുത്ത ദാമ്പത്യബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ സ്വന്തം ജീവനെപ്പോലെയുള്ള സ്നേഹിതൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  choice: നിന്നെ വശീകരിച്ച്
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള סות ഒരാളെ ഒരു പ്രവൃത്തിയിലേക്കു പ്രലോഭിപ്പിക്കുക, വശീകരിക്കുക, പ്രേരിപ്പിക്കുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. ഇവിടെ ‘വശീകരിക്കുക’ തെറ്റായ ദൈവാരാധനയിലേക്കുള്ള രഹസ്യമായ ആകർഷണത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: നിന്റെ അമ്മയുടെ മകനായ നിന്റെ സഹോദരൻ
  rationale: എബ്രായത്തിലെ സമാനാധികരണ പ്രയോഗം അടുത്ത രക്തബന്ധത്തിന് നൽകുന്ന ഊന്നൽ നഷ്ടപ്പെടാതിരിക്കാൻ ‘അമ്മയുടെ മകനായ’ എന്നത് നിലനിർത്തി.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: നീ മാറോടണയ്ക്കുന്ന ഭാര്യ
  rationale: חֵיק മടി, മാറിടം, ആലിംഗനം എന്നീ അടുത്ത ബന്ധത്തിന്റെ ദൃശ്യങ്ങൾ നൽകുന്നു. അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമായ രൂപം ഒഴിവാക്കി, ദാമ്പത്യസാന്നിധ്യം സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: നിന്റെ സ്വന്തം പ്രാണനെപ്പോലെയുള്ള സ്നേഹിതൻ
  rationale: נֶפֶשׁ ഇവിടെ വെറും ജൈവജീവനല്ല, ഒരാളുടെ സ്വന്തം ജീവൻപോലെയുള്ള അടുപ്പമാണ് സൂചിപ്പിക്കുന്നത്. ‘പ്രാണൻ’ മൂലഭാഷയിലെ തീവ്രമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: בַּסֵּתֶר
  choice: രഹസ്യമായി
  rationale: ‘രഹസ്യത്തിൽ’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാവിശേഷണമായി നൽകി.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: നമുക്കു പോയി ... സേവിക്കാം
  rationale: രണ്ട് cohortative ക്രിയകളിലുമുള്ള ക്ഷണവും പ്രേരണയും നിലനിർത്തുന്നു. עבד എന്നതിന്റെ ആരാധന ഉൾപ്പെടെയുള്ള വിശാലമായ മതസേവനാർഥം ചുരുക്കാതിരിക്കാൻ ‘സേവിക്കുക’ ഉപയോഗിച്ചു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാർ
  rationale: മലയാള ബൈബിൾഭാഷയിലും പൊതുപ്രയോഗത്തിലും ‘അന്യദേവന്മാർ’ എന്നത് ‘മറ്റു ദേവന്മാർ’ എന്ന ആശയം വ്യക്തമായി നൽകുന്നു; ‘വിദേശദേവന്മാർ’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: നിനക്കോ നിന്റെ പിതാക്കന്മാർക്കോ അറിവില്ലാതിരുന്ന
  rationale: വ്യക്തിപരവും മതപരവുമായ പരിചയമില്ലായ്മയെ സൂചിപ്പിക്കുന്ന ידע എന്ന ക്രിയയുടെ വിശാലത നിലനിർത്തുന്നു; ‘നിനക്കോ ... പിതാക്കന്മാർക്കോ’ എന്ന ഘടന ഇരുകൂട്ടരെയും വ്യക്തമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: അടുത്ത കുടുംബ-സൗഹൃദബന്ധങ്ങളെ സൂചിപ്പിക്കുന്ന രൂപകങ്ങൾ
  choice: ‘അമ്മയുടെ മകനായ,’ ‘മാറോടണയ്ക്കുന്ന ഭാര്യ,’ ‘സ്വന്തം പ്രാണനെപ്പോലെയുള്ള സ്നേഹിതൻ’ എന്നീ തീവ്രമായ ബന്ധപ്രയോഗങ്ങൾ നിലനിർത്തി.
  alternative: ‘സ്വന്തം സഹോദരൻ,’ ‘പ്രിയഭാര്യ,’ ‘ഏറ്റവും അടുത്ത സുഹൃത്ത്’ എന്നിങ്ങനെ രൂപകങ്ങൾ ലളിതമാക്കുക.
  rationale: ഏറ്റവും അടുത്ത മനുഷ്യബന്ധങ്ങൾപോലും ഉടമ്പടിവിശ്വസ്തതയെ മറികടക്കരുതെന്ന വാക്യത്തിന്റെ സംഘർഷവും വാചാടോപശക്തിയും മൂലഭാഷയിലെ ചിത്രങ്ങൾ നിലനിർത്തുമ്പോൾ കൂടുതൽ വ്യക്തമാണ്.
- issue: അന്യദേവന്മാരോടുള്ള עבד എന്ന ക്രിയ
  choice: ‘ആരാധിക്കാം’ എന്നതിനു പകരം ‘സേവിക്കാം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നമുക്കു പോയി അന്യദേവന്മാരെ ആരാധിക്കാം.’
  rationale: עבד ആരാധനയെ ഉൾക്കൊള്ളുന്നുവെങ്കിലും ദൈവത്തിനുള്ള മതപരമായ സേവനത്തിന്റെ വിശാലാർഥവും വഹിക്കുന്നു. ‘സേവിക്കുക’ ആ അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘പിതാക്കന്മാർ,’ ‘അന്യദേവന്മാർ,’ ‘സേവിക്കുക’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തിന്റെ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. മൂലവാക്യം അടുത്ത വാക്യത്തിലേക്കു നീളുന്നതിനാൽ അവസാനത്തിലെ അപൂർണത ദീർഘരേഖകൊണ്ട് നിലനിർത്തി.
