  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נָּבִ֣יא הַ/ה֡וּא א֣וֹ חֹלֵם֩ הַ/חֲל֨וֹם הַ/ה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר סָ֠רָה עַל יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם הַ/מּוֹצִ֥יא אֶתְ/כֶ֣ם מֵ/אֶ֣רֶץ מִצְרַ֗יִם וְ/הַ/פֹּֽדְ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים לְ/הַדִּֽיחֲ/ךָ֙ מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָ/לֶ֣כֶת בָּ֑/הּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: ml
  text: എന്നാൽ ആ പ്രവാചകനോ ആ സ്വപ്നദർശിയോ വധിക്കപ്പെടണം. കാരണം, നിങ്ങളെ ഈജിപ്ത് ദേശത്തുനിന്ന് പുറപ്പെടുവിക്കുകയും അടിമകളുടെ ഭവനത്തിൽനിന്ന്[b] വീണ്ടെടുക്കുകയും ചെയ്ത നിങ്ങളുടെ ദൈവമായ യഹ്‌വെക്കെതിരെ അവൻ ധിക്കാരവചനം പറഞ്ഞു[a]; നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങളോടു നടക്കാൻ കല്പിച്ച വഴിയിൽനിന്ന് നിങ്ങളെ തെറ്റിച്ചുകളയാൻ. അങ്ങനെ നിങ്ങളുടെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വാസത്യാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘ധിക്കാരവചനം പറഞ്ഞു’ എന്ന എബ്രായ പ്രയോഗം യഹ്‌വെയോടുള്ള ഉടമ്പടി വിശ്വസ്തത ഉപേക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അടിമകളുടെ ഭവനം’; പരമ്പരാഗതമായി ‘അടിമത്തത്തിന്റെ ഭവനം’ അല്ലെങ്കിൽ ‘അടിമവീട്’ എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא אוֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: എന്നാൽ ആ പ്രവാചകനെയോ ആ സ്വപ്നദർശിയെയോ
  rationale: നിയമവിവരണത്തിലെ മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന וְ ഇവിടെ ‘എന്നാൽ’ എന്നു സ്വാഭാവികമായി നൽകി. ‘ആ’ എന്ന നിർദ്ദേശക ഊന്നൽ ഇരുകൂട്ടർക്കും നിലനിർത്തി; ആവർത്തനപരമായ എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ‘സ്വപ്നദർശി’യായി നൽകി.
- source_word: יוּמָת
  choice: വധിക്കണം
  rationale: מות എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം സാധാരണ മരണമല്ല, അധികാരപരമായ വധശിക്ഷയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ നിയമപരവും നേരിട്ടുള്ളതുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: כִּי דִבֶּר סָרָה
  choice: കാരണം ... അവൻ കലാപം പ്രസംഗിച്ചു[a]
  rationale: סָרָה ഉടമ്പടി വിശ്വസ്തതയിൽനിന്നുള്ള വ്യതിചലനം, കലാപം, വിശ്വാസത്യാഗം എന്നിവ ഉൾക്കൊള്ളുന്നു. ‘കലാപം പ്രസംഗിച്ചു’ എബ്രായത്തിലെ സംസാരപ്രവൃത്തിയും വിരോധത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: עַל יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെക്കെതിരെ
  rationale: ഈ വിരോധപരമായ സന്ദർഭത്തിൽ עַל എന്നത് ‘എതിരെ’ എന്ന അർഥത്തിലാണ്. ദൈവനാമം യഹ്‌വെ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: നിങ്ങളെ ഈജിപ്ത് ദേശത്തുനിന്ന് പുറപ്പെടുവിക്കുകയും
  rationale: പുറപ്പാടിനെ ഓർമിപ്പിക്കുന്ന സ്ഥിരമായ ദൈവശാസ്ത്രഭാഷയും ദേശസൂചനയും നിലനിർത്തി.
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: അടിമത്തത്തിന്റെ ഭവനത്തിൽനിന്ന്[b] വീണ്ടെടുക്കുകയും ചെയ്ത
  rationale: פדה-യുടെ മോചനാർഥത്തിന് ‘വീണ്ടെടുക്കുക’ നൽകി. בֵּית עֲבָדִים എന്ന ദൃശ്യപ്രയോഗം മനസ്സിലാകുന്ന മലയാളത്തിൽ ‘അടിമത്തത്തിന്റെ ഭവനം’ എന്നു നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: വഴിയിൽനിന്ന് നിങ്ങളെ തെറ്റിച്ചുകളയാൻ
  rationale: נדח-യുടെ ഹിഫീൽ രൂപത്തിലുള്ള വഴിതെറ്റിക്കൽ/അകറ്റൽ എന്ന ആശയം ‘തെറ്റിച്ചുകളയുക’ വ്യക്തമാക്കുന്നു; ‘വഴി’ എന്ന ഉടമ്പടിസംബന്ധിയായ രൂപകം നിലനിർത്തി.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങളോട് നടക്കാൻ കല്പിച്ച വഴിയിൽനിന്ന്
  rationale: ‘വഴിയിൽ നടക്കുക’ എന്ന പെരുമാറ്റരൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: അങ്ങനെ നിങ്ങളുടെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയണം
  rationale: ആവർത്തിക്കുന്ന ദ്വിതീയോപദേശ നിയമസൂത്രത്തിലെ നിർണായക നീക്കം בער സൂചിപ്പിക്കുന്നു. ‘നീക്കിക്കളയണം’ ആ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരിച്ചു.
- issue: סָרָה എന്ന പദത്തിലെ കലാപം–വിശ്വാസത്യാഗം അർഥവ്യാപ്തി
  choice: കലാപം
  alternative: വിശ്വാസത്യാഗം
  rationale: സന്ദർഭത്തിലെ യഹ്‌വെക്കെതിരായ പ്രേരണയും ഉടമ്പടിവിരോധവും ‘കലാപം’ വ്യക്തമായി നൽകുന്നു; മതവിശ്വാസത്തിൽനിന്നുള്ള വ്യതിചലനം മാത്രം എന്നു ചുരുക്കാതിരിക്കാൻ മറ്റർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: വചനത്തിലെ ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള അഭിസംബോധനമാറ്റം
  choice: മലയാളത്തിൽ ബഹുവചനം തുടർച്ചയായി ഉപയോഗിച്ചു
  alternative: മൂലത്തിലെ നിങ്ങളെ/നിന്നെ എന്ന സംഖ്യാമാറ്റം അക്ഷരാർഥത്തിൽ നിലനിർത്തുക
  rationale: എബ്രായത്തിൽ സമൂഹത്തെ ആദ്യം ബഹുവചനത്തിലും തുടർന്ന് പ്രതിനിധിയായ ഏകവചനത്തിലും അഭിസംബോധന ചെയ്യുന്നു. മലയാളത്തിൽ പെട്ടെന്നുള്ള മാറ്റം വേറൊരു അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാം; അതിനാൽ സമൂഹസംബന്ധിയായ അർഥം നിലനിർത്തി ബഹുവചനമായി ഏകീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ഉടമ്പടി ശൈലി സ്വീകരിച്ചു. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടന ഉപയോഗിച്ചെങ്കിലും ‘വഴിയിൽ നടക്കുക,’ ‘വീണ്ടെടുക്കുക,’ ‘നിങ്ങളുടെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയുക’ എന്നീ മൂലപാഠത്തിലെ പ്രധാന രൂപകങ്ങളും സൂത്രഭാഷയും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കരികെ തന്നെയാണ് ചേർത്തത്.
