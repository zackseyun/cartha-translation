id: DEU.13.14
reference: Deuteronomy 13:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יָצְא֞וּ אֲנָשִׁ֤ים בְּנֵֽי בְלִיַּ֨עַל֙ מִ/קִּרְבֶּ֔/ךָ וַ/יַּדִּ֛יחוּ אֶת יֹשְׁבֵ֥י עִירָ֖/ם לֵ/אמֹ֑ר נֵלְכָ֗ה וְ/נַעַבְדָ֛ה אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹא יְדַעְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിൽനിന്ന് ചില നീചന്മാർ[a] പുറപ്പെട്ടിരിക്കുന്നു; അവർ, ‘നമുക്കു പോയി നിങ്ങൾ അറിഞ്ഞിട്ടില്ലാത്ത അന്യദേവന്മാരെ സേവിക്കാം’ എന്നു പറഞ്ഞ്, തങ്ങളുടെ പട്ടണത്തിലെ നിവാസികളെ വഴിതെറ്റിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നിഷ്ഫലതയുടെ പുത്രന്മാർ’; പരമ്പരാഗതമായി: ‘ബെലിയാലിന്റെ പുത്രന്മാർ.’'
    reason: ഹീബ്രു ശൈലിപ്രയോഗത്തിന്റെ അക്ഷരാർഥവും പരമ്പരാഗത പരിഭാഷയും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: יָצְאוּ
  choice: പുറപ്പെട്ട്
  rationale: יצא എന്ന ക്രിയയുടെ ‘ഉള്ളിൽനിന്ന് പുറത്തുവരുക/പുറപ്പെടുക’ എന്ന അർഥം തുടർന്നുള്ള ക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; റിപ്പോർട്ടുചെയ്യപ്പെടുന്ന സംഭവത്തിന്റെ പൂർത്തിയായ സ്വഭാവം അവസാനത്തെ ‘വഴിതെറ്റിച്ചിരിക്കുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: നീചന്മാരായ ചിലർ
  rationale: ഈ പ്രയോഗം ധാർമികമായി അധഃപതിച്ചവരെയോ നിയമലംഘകരെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണ്. ‘ബെലിയാലിന്റെ പുത്രന്മാർ’ എന്നത് പിന്നീടുള്ള വ്യക്തിനാമസംബന്ധിയായ ആശയം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാം; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִקִּרְבְּךָ
  choice: നിങ്ങളുടെ ഇടയിൽനിന്ന്
  rationale: ഉടമ്പടി സമൂഹത്തിനുള്ളിൽനിന്നുതന്നെയാണ് ഇവർ ഉയർന്നുവന്നത് എന്ന ആശയം കൃത്യമായി സൂക്ഷിക്കുന്നു.
- source_word: וַיַּדִּיחוּ
  choice: വഴിതെറ്റിച്ചിരിക്കുന്നു
  rationale: נדח എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം മറ്റുള്ളവരെ ശരിയായ വഴിയിൽനിന്ന്, ഇവിടെ യഹോവയോടുള്ള വിശ്വസ്തതയിൽനിന്ന്, അകറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: יֹשְׁבֵי עִירָם
  choice: തങ്ങളുടെ പട്ടണത്തിലെ നിവാസികളെ
  rationale: ‘അവരുടെ പട്ടണത്തിൽ വസിക്കുന്നവർ’ എന്ന അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: നമുക്കു പോയി … സേവിക്കാം
  rationale: രണ്ട് cohortative രൂപങ്ങളുടെയും കൂട്ടായ ആഹ്വാനം നിലനിർത്തുന്നു. עבד എന്നതിന്റെ വിപുലമായ മതപരമായ ‘സേവിക്കുക’ എന്ന അർഥം സ്വീകരിക്കുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാർ
  rationale: ആവർത്തിച്ചുവരുന്ന ദ്വിതീയോപദേശ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള സമാനതയാണ്; വെറും വിദേശീയതയിലേക്കു അർഥം ചുരുക്കുന്നില്ല.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: നിങ്ങൾ അറിഞ്ഞിട്ടില്ലാത്ത
  rationale: ידע എന്നതിലെ അറിവും ബന്ധപരമായ പരിചയവും ഒരുപോലെ തുറന്നുവയ്ക്കുന്ന സാധാരണ മലയാള പ്രയോഗമാണിത്.
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: നീചന്മാരായ ചിലർ
  alternative: ബെലിയാലിന്റെ പുത്രന്മാർ / കൊള്ളരുതായ്മയുടെ പുത്രന്മാർ
  rationale: ഈ സന്ദർഭത്തിൽ ഇത് ദുഷിച്ച മനുഷ്യരെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിപ്രയോഗമാണ്; ‘ബെലിയാൽ’ എന്ന പിൽക്കാല വ്യക്തിവൽക്കരണം വാക്യത്തിലേക്ക് കൊണ്ടുവരാതിരിക്കുകയാണ് ഉചിതം. അതേസമയം അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള വാക്കിലെ കൂട്ടായ ആഹ്വാനം വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു; ഉറവിടത്തിലെ മതപരവും ബന്ധപരവുമായ അർഥങ്ങൾ അനാവശ്യമായി വിശദീകരിച്ചിട്ടില്ല.
