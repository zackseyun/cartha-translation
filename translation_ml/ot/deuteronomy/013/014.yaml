  - severity: low
    issue: Footnote literal gloss is awkward.
    rationale: “കൊള്ളരുതായ്മയുടെ പുത്രന്മാർ” is not idiomatic Malayalam for the literal sense of בְּנֵי בְלִיַּעַל. “നിഷ്ഫലതയുടെ പുത്രന്മാർ” is clearer while remaining a literal-style gloss.
