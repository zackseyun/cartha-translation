reference: Deuteronomy 13:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַחֲרֵ֨י יְהוָ֧ה אֱלֹהֵי/כֶ֛ם תֵּלֵ֖כוּ וְ/אֹת֣/וֹ תִירָ֑אוּ וְ/אֶת מִצְוֺתָ֤י/ו תִּשְׁמֹ֨רוּ֙ וּ/בְ/קֹל֣/וֹ תִשְׁמָ֔עוּ וְ/אֹת֥/וֹ תַעֲבֹ֖דוּ וּ/ב֥/וֹ תִדְבָּקֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയുടെ പിന്നാലെ നിങ്ങൾ നടക്കണം[a]; അവനെ ഭയപ്പെടണം; അവന്റെ കൽപ്പനകൾ പാലിക്കണം; അവന്റെ ശബ്ദം കേൾക്കണം[b]; അവനെ സേവിക്കണം; അവനോടു ചേർന്നുനിൽക്കണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയെ അനുഗമിക്കണം.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയുടെ പിന്നാലെ നടക്കണം’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ ശബ്ദം കേൾക്കണം’ എന്നതിന് ‘അവന്റെ ശബ്ദം അനുസരിക്കണം’ അല്ലെങ്കിൽ ‘അവനെ അനുസരിക്കണം’ എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവനെ മുറുകെപ്പിടിക്കണം’ അല്ലെങ്കിൽ ‘അവനോടു പറ്റിനിൽക്കണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה אֱלֹהֵיכֶם תֵּלֵכוּ
  choice: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയുടെ പിന്നാലെ നിങ്ങൾ നടക്കണം
  rationale: ‘പിന്നാലെ നടക്കുക’ എന്ന എബ്രായ രൂപകം ദൈവത്തെ വിശ്വസ്തതയോടെ അനുഗമിക്കുക എന്ന ഉടമ്പടിസംബന്ധമായ ആശയം നിലനിർത്തുന്നു; മലയാളത്തിലും ഇത് സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: תִירָאוּ
  choice: അവനെ ഭയപ്പെടണം
  rationale: ദൈവത്തോടുള്ള ഭക്ത്യാദരവും ഭയവും ഉൾക്കൊള്ളുന്ന ירא എന്ന ഉടമ്പടിപദത്തിന്റെ ശക്തി മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: מִצְוֺתָיו תִּשְׁמֹרוּ
  choice: അവന്റെ കല്പനകൾ പാലിക്കണം
  rationale: കല്പനകളെ സൂക്ഷിച്ച് അനുസരിക്കുക എന്ന שׁמר എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּבְקֹלוֹ תִשְׁמָעוּ
  choice: അവന്റെ ശബ്ദം കേൾക്കണം
  rationale: വാക്യത്തിന്റെ പ്രത്യക്ഷരൂപം നിലനിർത്തുന്നു; ‘അനുസരിക്കുക’ എന്ന ആശയം ഇതിൽ ഉൾക്കൊള്ളാമെങ്കിലും അത് മുഖ്യപാഠത്തിൽ മാത്രം നിർബന്ധിതമാക്കുന്നില്ല.
- source_word: תַעֲבֹדוּ
  choice: അവനെ സേവിക്കണം
  rationale: עבד എന്ന പദത്തിന്റെ സേവനവും ആരാധനാപരമായ ശുശ്രൂഷയും ഉൾക്കൊള്ളുന്ന വിശാലത ‘സേവിക്കുക’ നിലനിർത്തുന്നു.
- source_word: תִדְבָּקוּן
  choice: അവനോടു പറ്റിച്ചേരണം
  rationale: דבק സൂചിപ്പിക്കുന്ന ദൃഢവും അടുത്തതുമായ ബന്ധവും വിശ്വസ്തതയും സജീവമായ മലയാളപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്ന് പകരംവയ്ക്കാതെ ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: שׁמע בְּקוֹל എന്ന പ്രയോഗത്തിൽ കേൾവിയും അനുസരണവും തമ്മിലുള്ള ബന്ധം
  choice: അവന്റെ ശബ്ദം കേൾക്കണം
  alternative: അവന്റെ ശബ്ദം അനുസരിക്കണം; അവനെ അനുസരിക്കണം
  rationale: എബ്രായത്തിലെ പ്രത്യക്ഷമായ ‘ശബ്ദം കേൾക്കുക’ എന്ന രൂപം നിലനിർത്തി; അതിൽ അടങ്ങിയിരിക്കാവുന്ന അനുസരണത്തിന്റെ അർഥസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: דבק എന്നതിലെ ഉടമ്പടിവിശ്വസ്തതയുടെ തീവ്രത
  choice: അവനോടു പറ്റിച്ചേരണം
  alternative: അവനെ മുറുകെപ്പിടിക്കണം; അവനോടു ചേർന്നുനിൽക്കണം
  rationale: ബന്ധത്തിന്റെ അടുപ്പവും സ്ഥിരതയും പ്രകടമാക്കുമ്പോഴും പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാത്ത രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഉടമ്പടിപരമായ ഗൗരവം നിലനിർത്തുന്ന ഭാഷ ഉപയോഗിച്ചു. സമാന്തരമായ ആറ് നിർദേശങ്ങളുടെ താളം അർധവിരാമങ്ങളിലൂടെ സംരക്ഷിച്ചു; ദൈവനാമം ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
