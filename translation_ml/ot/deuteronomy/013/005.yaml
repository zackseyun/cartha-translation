    rationale: എബ്രായത്തിൽ יְהוָה אֱלֹהֵיכֶם (‘യാഹ്‌വേ, നിങ്ങളുടെ ദൈവം’) ഉണ്ട്. നിലവിലെ ഉദ്ധരണി ‘യാഹ്‌വേയുടെ പിന്നാലെ നടക്കണം’ എന്നു മാത്രമായതിനാൽ ‘നിങ്ങളുടെ ദൈവമായ’ എന്ന ഘടകം നഷ്ടപ്പെടുന്നു.
