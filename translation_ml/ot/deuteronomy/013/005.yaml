  naturalness: ഭാഷ ആധുനിക നിലവാരമലയാളത്തിലും ഗൗരവമുള്ള തിരുവെഴുത്തു-രജിസ്റ്ററിലും സ്വാഭാവികമാണ്. ദבק-യ്ക്കുള്ള ‘അവനോടു ചേർന്നുനിൽക്കണം’ എന്ന പ്രയോഗം നിലവിലെ ‘പറ്റിച്ചേരണം’ എന്നതിനെക്കാൾ വ്യക്തവും സ്വാഭാവികവുമാണ്.
  terminology: ‘യാഹ്‌വേ,’ ‘ഭയപ്പെടണം,’ ‘കൽപ്പനകൾ പാലിക്കണം,’ ‘ശബ്ദം കേൾക്കണം,’ ‘സേവിക്കണം’ എന്നിവ മൂലപാഠത്തിന്റെ അർഥവ്യാപ്തിയും ഔപചാരികതയും സംരക്ഷിക്കുന്നു. ‘കൽപ്പനകൾ’ എന്ന നിലവാരലിപി ഉപയോഗിച്ചിട്ടുണ്ട്.
