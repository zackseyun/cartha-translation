id: DEU.13.8
reference: Deuteronomy 13:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מֵ/אֱלֹהֵ֣י הָֽ/עַמִּ֗ים אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם הַ/קְּרֹבִ֣ים אֵלֶ֔י/ךָ א֖וֹ הָ/רְחֹקִ֣ים מִמֶּ֑/ךָּ מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: ml
  text: നിങ്ങളുടെ ചുറ്റുമുള്ള ജനതകളുടെ ദേവന്മാരിൽനിന്ന്—ആ ജനതകൾ നിങ്ങൾക്ക് അടുത്തുള്ളവരായാലും അകലെയുള്ളവരായാലും, ഭൂമിയുടെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ[a] എവിടെയുള്ളവരായാലും—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദേശത്തിന്റെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ.’ എബ്രായത്തിലെ אֶרֶץ എന്ന പദത്തിന് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֱלֹהֵי
  choice: ദേവന്മാരിൽനിന്ന്
  rationale: מִן ഇവിടെ ഉറവിടത്തെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു; ബഹുവചനമായ אֱלֹהֵי എന്നതിന്റെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הָעַמִּים
  choice: ജനതകൾ
  rationale: വ്യത്യസ്ത ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന עַמִּים എന്ന ബഹുവചനത്തിന്റെ സമൂഹ-വംശീയ ഭാവം ‘ജനതകൾ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: നിങ്ങളുടെ ചുറ്റുമുള്ള
  rationale: സമീപപ്രദേശങ്ങളിലുള്ള ജനതകളെ സൂചിപ്പിക്കുന്ന സ്ഥലപരമായ അർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: הַקְּרֹבִים אֵלֶיךָ
  choice: നിങ്ങൾക്ക് അടുത്തുള്ളവരായാലും
  rationale: קָרוֹב സൂചിപ്പിക്കുന്ന സാമീപ്യം നിലനിർത്തുകയും തുടർന്നുള്ള ‘അകലെയുള്ളവർ’ എന്ന വിരുദ്ധജോടിയോട് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: אוֹ הָרְחֹקִים מִמֶּךָּ
  choice: അകലെയുള്ളവരായാലും
  rationale: רָחוֹק എന്നതിന്റെ ദൂരസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: ഭൂമിയുടെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ
  rationale: സമ്പൂർണ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആലങ്കാരിക ശക്തി നിലനിർത്തുന്നു; ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി ചുരുക്കിയിരിക്കുന്നു.
theological_decisions:
- issue: הָאָרֶץ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം
  rationale: אֶרֶץ എന്നതിന് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമുണ്ടാകാം. ഇവിടെ ‘ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ’ എന്ന വിശാല പ്രയോഗം ഏറ്റവും വിപുലമായ ഭൂമിശാസ്ത്രപരിധിയെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിൽ വിശേഷണങ്ങളുടെ ആശ്രയം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നതിനാൽ, മലയാളത്തിലെ അവ്യക്തത ഒഴിവാക്കാൻ ‘ആ ജനതകൾ’ എന്നും ‘എവിടെയുള്ളവരായാലും’ എന്നും മിതമായി വ്യക്തമാക്കി. ഈ ഭാഗം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
