source:
  edition: WLC
  text: וְ/אֶת כָּל שְׁלָלָ֗/הּ תִּקְבֹּץ֮ אֶל תּ֣וֹךְ רְחֹבָ/הּ֒ וְ/שָׂרַפְתָּ֨ בָ/אֵ֜שׁ אֶת הָ/עִ֤יר וְ/אֶת כָּל שְׁלָלָ/הּ֙ כָּלִ֔יל לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וְ/הָיְתָה֙ תֵּ֣ל עוֹלָ֔ם לֹ֥א תִבָּנֶ֖ה עֽוֹד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: ml
  text: അതിലെ എല്ലാ കൊള്ളമുതലും അതിന്റെ പൊതുചത്വരത്തിന്റെ നടുവിൽ നീ കൂട്ടിച്ചേർക്കണം. ആ പട്ടണവും അതിലെ എല്ലാ കൊള്ളമുതലും നിന്റെ ദൈവമായ യഹോവയ്ക്ക് പൂർണാർപ്പണമായി[a] തീയിൽ ചുട്ടുകളയണം. ആ പട്ടണം എന്നേക്കുമുള്ള നാശക്കൂമ്പാരമായിരിക്കും[b]; അത് ഇനി പുനർനിർമിക്കപ്പെടരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ദൈവമായ യഹോവയ്ക്കായി പൂർണമായി.’ എബ്രായത്തിലെ כָּלִיל എന്ന പദത്തിന് ‘മുഴുവനായി, പൂർണമായി’ എന്ന ക്രിയാവിശേഷണാർഥമോ, ദൈവത്തിന് മുഴുവനായി സമർപ്പിച്ച് ദഹിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ബലിസംബന്ധമായ അർഥമോ ആകാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘എന്നേക്കുമുള്ള ഒരു കൂമ്പാരം’; അതായത്, സ്ഥിരമായി അവശേഷിക്കുന്ന നാശാവശിഷ്ടക്കൂമ്പാരം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: അതിലെ കൊള്ളമുതൽ
  rationale: യുദ്ധത്തിലോ ആക്രമണത്തിലോ പിടിച്ചെടുക്കുന്ന വസ്തുവകകളെ സൂചിപ്പിക്കുന്ന שָׁלָל എന്ന പദത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: תִּקְבֹּץ
  choice: കൂട്ടിച്ചേർക്കണം
  rationale: നിയമനിർദേശത്തിന്റെ ബലമുള്ള കൽപ്പനാഭാവം മലയാളത്തിലെ ‘-ണം’ രൂപത്തിലൂടെ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: അതിന്റെ പൊതുചത്വരത്തിന്റെ നടുവിൽ
  rationale: רְחוֹב ഇവിടെ ഇടുങ്ങിയ തെരുവിനെക്കാൾ പട്ടണത്തിലെ വിശാലമായ പൊതുസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: തീയിൽ ചുട്ടുകളയണം
  rationale: തീകൊണ്ടുള്ള സമ്പൂർണ നശീകരണത്തെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כָּלִיל
  choice: പൂർണാർപ്പണമായി
  rationale: ‘പൂർണമായി’ എന്ന ക്രിയാവിശേഷണാർഥവും ദൈവത്തിന് മുഴുവനായി സമർപ്പിച്ച് ദഹിപ്പിക്കുന്ന ബലിസംബന്ധമായ ധ്വനിയും ഒരളവുവരെ നിലനിർത്തുന്നു.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: യഹോവയായ നിങ്ങളുടെ ദൈവത്തിന്
  rationale: ദൈവനാമത്തെ വ്യക്തമായി പ്രതിനിധീകരിക്കുകയും ל എന്ന ഉപസർഗത്തിലെ സമർപ്പണലക്ഷ്യം ‘ദൈവത്തിന്’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: תֵּל עוֹלָם
  choice: എന്നേക്കും നിലനിൽക്കുന്ന ഒരു നാശക്കൂമ്പാരം
  rationale: תֵּל എന്ന പദത്തിലെ ഭൗതികമായ കൂമ്പാരത്തിന്റെ ചിത്രവും עוֹלָם സൂചിപ്പിക്കുന്ന സ്ഥിരമായ അവസ്ഥയും സംരക്ഷിക്കുന്നു.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: വീണ്ടും പണിയപ്പെടരുത്
  rationale: എബ്രായത്തിലെ നിഫാൽ രൂപത്തിന്റെ കർമണി ഭാവവും തുടർന്നുള്ള പുനർനിർമാണനിഷേധവും ചുരുക്കമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: כָּלִיל എന്ന പദത്തിന്റെ ബലിസംബന്ധമായ ധ്വനി
  choice: ‘യഹോവയായ നിങ്ങളുടെ ദൈവത്തിന് പൂർണാർപ്പണമായി’
  alternative: ‘യഹോവയായ നിങ്ങളുടെ ദൈവത്തിനായി പൂർണമായി’
  rationale: പട്ടണത്തിന്റെ നശീകരണം വെറും സമ്പൂർണ ദഹനം മാത്രമല്ല, ദൈവത്തിന് മുഴുവനായി സമർപ്പിക്കുന്ന പ്രവൃത്തിയാണെന്ന ധ്വനി നിലനിർത്തുന്നു. എന്നാൽ മൃഗബലിക്കുള്ള സാങ്കേതിക പദം അനാവശ്യമായി ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമനിർദേശശൈലി ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധനയ്ക്ക് മലയാളത്തിൽ സ്വാഭാവികമായ ആദരബഹുവചനമായ ‘നിങ്ങളുടെ’ സ്വീകരിച്ചു; കൽപ്പനകൾക്ക് ‘-ണം/പാടില്ല’ എന്നതിനു പകരം മൂലത്തിലെ കർമണി ഘടന നിലനിർത്താൻ അവസാന വാക്യത്തിൽ ‘പണിയപ്പെടരുത്’ ഉപയോഗിച്ചു.
