id: DEU.13.12
reference: Deuteronomy 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֔ל יִשְׁמְע֖וּ וְ/יִֽרָא֑וּ/ן וְ/לֹֽא יוֹסִ֣פוּ לַ/עֲשׂ֗וֹת כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/012.yaml
  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: ml
  text: ഇസ്രായേൽ മുഴുവനും കേൾക്കുകയും ഭയപ്പെടുകയും ചെയ്യും; നിന്റെ മധ്യേ[a] ഈ ദുഷ്കാര്യം അവർ വീണ്ടും ചെയ്യുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ ഇടയിൽ.’ എബ്രായമൂലത്തിൽ ഇസ്രായേലിനെ ഒരു ജനസമൂഹമായി കണ്ട് ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു.
    reason: ഏകവചനത്തിലുള്ള സമൂഹാഭിസംബോധനയും അതിന്റെ സ്വാഭാവികമായ ബഹുവചന പരിഭാഷയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനും
  rationale: כָּל എന്നത് ഇവിടെ ഇസ്രായേൽജനത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആ സമൂഹപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יִשְׁמְעוּ
  choice: കേൾക്കുകയും … ചെയ്യും
  rationale: നിയമസന്ദർഭത്തിലെ അപൂർണക്രിയയ്ക്ക് ഭാവി/ഫലസൂചനയുണ്ട്; മലയാളത്തിൽ സംയുക്തക്രിയയായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: וְיִרָאוּן
  choice: ഭയപ്പെടുകയും ചെയ്യും
  rationale: ശിക്ഷയെക്കുറിച്ചു കേൾക്കുന്നതിലൂടെ ഉണ്ടാകുന്ന ഭയവും അതിന്റെ പിന്തിരിപ്പിക്കുന്ന ഫലവും ירא ഇവിടെ സൂചിപ്പിക്കുന്നു; ‘ഭയപ്പെടുക’ അതിനെ അമിതവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: അവർ വീണ്ടും ചെയ്യുകയില്ല
  rationale: יסף + ക്രിയാനാമം ഇവിടെ പ്രവൃത്തി ആവർത്തിക്കാതിരിക്കുക എന്ന അർഥത്തിലാണ്; ‘വീണ്ടും ചെയ്യുകയില്ല’ മലയാളത്തിലെ സ്വാഭാവിക തുല്യപ്രയോഗമാണ്.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: ഈ ദുഷ്കാര്യം
  rationale: דָּבָר ഈ നിയമസന്ദർഭത്തിൽ മുമ്പ് വിവരിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ദുഷ്കാര്യം’ അതിന്റെ ധാർമികവും പ്രവൃത്തിസംബന്ധവുമായ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: בְּקִרְבֶּךָ
  choice: നിന്റെ മധ്യേ
  rationale: ‘നിന്റെ മധ്യേ’ എന്നത് ഏകവചന പ്രത്യയം നിലനിർത്തുകയും ഇസ്രായേലിനെ ഒരു ജനസമൂഹമായി അഭിസംബോധന ചെയ്യുന്ന ആവർത്തനപുസ്തകത്തിന്റെ ശൈലി പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉടമ്പടിസമൂഹത്തോടുള്ള അഭിസംബോധനയിലെ അവസാന പ്രത്യയത്തിന്റെ വചനം
  choice: ഏകവചനമായ ‘നിന്റെ മധ്യേ’ നിലനിർത്തി
  alternative: ‘നിങ്ങളുടെ ഇടയിൽ’
  rationale: എബ്രായത്തിൽ പുല്ലിംഗ ഏകവചന പ്രത്യയമാണ്; ഇസ്രായേലിനെ ഒരൊറ്റ ഉടമ്പടിജനമായി അഭിസംബോധന ചെയ്യുന്ന ഭാവം നഷ്ടപ്പെടാതിരിക്കാൻ അത് മുഖ്യവാചകത്തിൽ സൂക്ഷിച്ചു. തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ ഫലസൂചന നിലനിർത്തിയെങ്കിലും അതിപുരാതനമായ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
