id: DEU.13.4
reference: Deuteronomy 13:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: ml
  text: ആ പ്രവാചകന്റെയോ സ്വപ്നം കാണുന്ന ആ വ്യക്തിയുടെയോ വാക്കുകൾക്ക് നിങ്ങൾ ചെവികൊടുക്കരുത്. കാരണം, നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങളെ പരീക്ഷിക്കുകയാണ്—നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ മുഴുഹൃദയത്തോടും മുഴുപ്രാണനോടുംകൂടെ[a] നിങ്ങൾ സ്നേഹിക്കുന്നുണ്ടോ[b] എന്ന് അറിയാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രാണൻ’ ഇവിടെ ‘ജീവൻ,’ ‘സ്വയം,’ അല്ലെങ്കിൽ ‘സത്ത’ എന്നുമാകാം. ഈ ഉടമ്പടി-സൂത്രത്തിന്റെ പരമ്പരാഗതവും അന്തർപാഠപരവുമായ ഭാഷ നിലനിർത്താനാണ് ‘പ്രാണൻ’ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘സ്നേഹിക്കുന്നുണ്ടോ’ ഹീബ്രായിയിലെ participle-ന്റെ നിലനിൽക്കുന്ന അഥവാ തുടരുന്ന സ്നേഹഭാവം വ്യക്തമാക്കുന്നു; ലളിതമായി ‘സ്നേഹിക്കുന്നുവോ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל
  choice: നിങ്ങൾ ചെവികൊടുക്കരുത്
  rationale: שׁמע אֶל എന്നത് ഇവിടെ വെറുതെ ശബ്ദം കേൾക്കുക എന്നതിലുപരി ഒരാളുടെ വാക്ക് അനുസരണയോടെ സ്വീകരിക്കുക എന്ന അർഥം വഹിക്കുന്നു. ‘ചെവികൊടുക്കരുത്’ ഈ ശ്രവണ-അനുസരണ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: דִּבְרֵי הַנָּבִיא הַהוּא
  choice: ആ പ്രവാചകന്റെ വാക്കുകൾക്ക്
  rationale: דִּבְרֵי എന്ന ബഹുവചനത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘വാക്കുകൾ’ നിലനിർത്തുകയും הַהוּא മുൻപ് പരാമർശിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്തു.
- source_word: חוֹלֵם הַחֲלוֹם הַהוּא
  choice: സ്വപ്നം കാണുന്ന ആ വ്യക്തിക്ക്
  rationale: ഹീബ്രായിയിലെ ആവർത്തനസ്വഭാവമുള്ള പ്രയോഗം അക്ഷരാർഥത്തിൽ പകർത്തിയാൽ മലയാളത്തിൽ അസ്വാഭാവികമാകും. പ്രവാചകീയ സ്വപ്നം അവകാശപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന അർഥം ലളിതവും നിഷ്പക്ഷവുമായി നൽകി.
- source_word: מְנַסֶּה
  choice: പരീക്ഷിക്കുകയാണ്
  rationale: Piel രൂപം പരീക്ഷിക്കുക, പരിശോധിക്കുക എന്ന അർഥം നൽകുന്നു. വർത്തമാനത്തിൽ നടന്നുകൊണ്ടിരിക്കുന്ന പ്രവർത്തനഭാവം ‘പരീക്ഷിക്കുകയാണ്’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, Yahweh എന്ന രൂപത്തിന് യോജിച്ച മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: לָדַעַת
  choice: അറിയാൻ
  rationale: മൂലപാഠത്തിലെ ലക്ഷ്യസൂചക infinitive-നെ നേരിട്ട് നിലനിർത്തുന്നു; ‘വെളിപ്പെടുത്താൻ’ അല്ലെങ്കിൽ ‘കാണിച്ചുതരാൻ’ എന്നു വ്യാഖ്യാനിച്ച് ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിച്ചിട്ടില്ല.
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: നിങ്ങൾ സ്നേഹിക്കുന്നുണ്ടോ
  rationale: ചോദ്യകണവും participle-ഉം ചേർന്ന പ്രയോഗത്തിന്റെ നിലനിൽക്കുന്ന/തുടരുന്ന സ്നേഹഭാവം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְּכָל לְבַבְכֶם
  choice: മുഴുഹൃദയത്തോടും
  rationale: ലֵבָב മനസ്സ്, ഇച്ഛ, ആന്തരിക വ്യക്തിത്വം എന്നിവ ഉൾക്കൊള്ളാമെങ്കിലും ഉടമ്പടിഭാഷയിലെ പരിചിതവും സമഗ്രവുമായ ‘ഹൃദയം’ നിലനിർത്തി.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: മുഴുപ്രാണനോടുംകൂടെ
  rationale: נֶפֶשׁ ജീവൻ, സ്വയം, സത്ത എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ഹൃദയത്തോടൊപ്പം വരുന്ന ഉടമ്പടിസൂത്രത്തിന്റെ പരമ്പരാഗതവും അന്തർപാഠപരവുമായ ബന്ധം നിലനിർത്താൻ ‘പ്രാണൻ’ തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെയും Jehovah-നോട് യോജിക്കുന്ന ‘യഹോവ’ രൂപം സ്വീകരിക്കാതെയും Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകി.
- issue: ദൈവം പരീക്ഷിക്കുന്നത് ‘അറിയാൻ’ എന്ന മനുഷ്യസദൃശ പ്രയോഗം
  choice: മൂലപാഠത്തിലെ ‘അറിയാൻ’ അതേപടി നിലനിർത്തി
  alternative: വെളിപ്പെടുത്താൻ; തെളിയിക്കാൻ
  rationale: ദൈവം അറിയേണ്ടതിന്നായി പരീക്ഷിക്കുന്നു എന്ന വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ മയപ്പെടുത്തുകയോ വ്യാഖ്യാനിച്ചു തീർക്കുകയോ ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ഉടമ്പടി ശൈലി സ്വീകരിച്ചു. ‘ചെവികൊടുക്കരുത്’ എന്നത് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതോടൊപ്പം കേൾക്കുക-അനുസരിക്കുക എന്ന ഇരട്ടഭാവവും സംരക്ഷിക്കുന്നു. വാക്യം അമിതമായി സംസ്കൃതവൽക്കരിക്കാതെ ദൈവനാമവും പ്രധാന ഉടമ്പടിപദങ്ങളും കൃത്യമായി നിലനിർത്തി.
