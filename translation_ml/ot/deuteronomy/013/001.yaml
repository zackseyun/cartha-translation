source:
  edition: WLC
  text: אֵ֣ת כָּל הַ/דָּבָ֗ר אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם אֹת֥/וֹ תִשְׁמְר֖וּ לַ/עֲשׂ֑וֹת לֹא תֹסֵ֣ף עָלָ֔י/ו וְ/לֹ֥א תִגְרַ֖ע מִמֶּֽ/נּוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുന്ന വചനം മുഴുവനും[a] നിങ്ങൾ ശ്രദ്ധയോടെ അനുഷ്ഠിക്കണം. അതിനോടു ഒന്നും കൂട്ടിച്ചേർക്കരുത്[b]; അതിൽനിന്ന് ഒന്നും കുറയ്ക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുന്നതെല്ലാം.’ എബ്രായയിൽ സമൂഹവാചകമായ ഏകവചനമാണ്; അക്ഷരാർഥത്തിൽ ‘സകല വചനവും.’
    reason: lexical_alternative
  - marker: b
    text: ചില വാക്യസംഖ്യാ സമ്പ്രദായങ്ങളിൽ ഈ വാക്യം ആവർത്തനം 12:32 എന്നാണ് രേഖപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: വചനം മുഴുവനും
  rationale: എബ്രായയിലെ ഏകവചനമായ דָּבָר-നെയും അതിന്റെ സമൂഹവാചകമായ כָּל-നെയും നിലനിർത്തുന്നു; ‘എല്ലാ വാക്കുകളും’ എന്ന ബഹുവചനമാക്കാതെ സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: מְצַוֶּה
  choice: കല്പിക്കുന്ന
  rationale: പങ്കാളിക്രിയയുടെ ഇപ്പോഴത്തെ/തുടർച്ചയായ ബലം മലയാളത്തിലെ ‘കല്പിക്കുന്ന’ എന്ന രൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: ശ്രദ്ധയോടെ അനുഷ്ഠിക്കണം
  rationale: ശ്രദ്ധാപൂർവം കാത്തുപാലിച്ച് പ്രവർത്തിക്കണമെന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא תֹסֵף עָלָיו
  choice: അതിനോടു ഒന്നും കൂട്ടിച്ചേർക്കരുത്
  rationale: עַל സഹിതമുള്ള יסף എന്ന ക്രിയയുടെ ‘അതിന്റെമേൽ ചേർക്കുക’ എന്ന നിയമപരമായ നിരോധനാർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: അതിൽനിന്ന് ഒന്നും കുറയ്ക്കുകയും അരുത്
  rationale: גרע എന്നതിന്റെ കുറയ്ക്കുക/നീക്കിക്കളയുക എന്ന അർഥവും മുൻ നിരോധനത്തോടുള്ള സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്ര സർവനാമത്തിലെ ഊന്നൽ മലയാളത്തിൽ അസ്വാഭാവികമായി അതിശയിപ്പിക്കാതെ സംസാരിക്കുന്നവന്റെ അധികാരം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വാക്യസംഖ്യയും പ്രസംഗബന്ധവും
  choice: തുടർന്നുവരുന്ന വ്യാജപ്രവാചകനെക്കുറിച്ചുള്ള വ്യവസ്ഥയിലെ ഉള്ളടക്കം ചേർക്കാതെ, ഈ വാക്യം സമ്പൂർണമായ ഒരു നിർദേശമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ചില പാരമ്പര്യങ്ങളെ പിന്തുടർന്ന് ഇതിനെ ആവർത്തനം 12:32 ആയി എണ്ണുകയും മുൻഭാഗത്തോടു കൂടുതൽ ചേർത്തുവായിക്കുകയും ചെയ്യുക.
  rationale: എബ്രായ പാഠത്തിലെ ഈ വാക്യം സ്വതന്ത്രമായി സമ്പൂർണമായ നിർദേശം നൽകുന്നു; സംഖ്യനിർണ്ണയത്തിലെ വ്യത്യാസം മുഖ്യപാഠത്തെ മാറ്റേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ ശൈലി. ‘വചനം മുഴുവനും’ എന്ന പ്രയോഗം എബ്രായയിലെ സമൂഹവാചക ഏകവചനം സംരക്ഷിക്കുമ്പോൾ, ‘ശ്രദ്ധയോടെ അനുഷ്ഠിക്കണം’ കല്പനയുടെ പ്രായോഗിക അനുസരണബലം സ്വാഭാവികമായി നൽകുന്നു.
