reference: Deuteronomy 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי יָק֤וּם בְּ/קִרְבְּ/ךָ֙ נָבִ֔יא א֖וֹ חֹלֵ֣ם חֲל֑וֹם וְ/נָתַ֥ן אֵלֶ֛י/ךָ א֖וֹת א֥וֹ מוֹפֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/002.yaml
  text: If a prophet or a dreamer of dreams arises among you and gives you a sign or a wonder,[a]
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിൽ ഒരു പ്രവാചകനോ സ്വപ്നം കാണുന്ന ഒരാളോ എഴുന്നേറ്റ്, നിങ്ങൾക്ക് ഒരു അടയാളമോ അത്ഭുതമോ നൽകിയാൽ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഒരു അടയാളമോ ശകുനമോ.’'
    reason: מוֹפֵת എന്ന പദത്തിന് ‘അത്ഭുതം’ എന്നതിനുപുറമേ സന്ദർഭാനുസൃതമായി ‘ശകുനം/മുൻസൂചന നൽകുന്ന വിസ്മയകര പ്രതിഭാസം’ എന്ന അർഥവും ഉണ്ടാകാം.
lexical_decisions:
- source_word: כִּי
  choice: എങ്കിൽ / നൽകിയാൽ
  rationale: നിയമപരമായ സോപാധിക സന്ദർഭത്തിൽ ഒരു സാധ്യതാപരമായ സാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യാവസാനത്തെ ‘നൽകിയാൽ’ എന്ന സോപാധിക രൂപം ഇത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יָקוּם
  choice: എഴുന്നേറ്റ്
  rationale: സമൂഹത്തിനുള്ളിൽ അത്തരമൊരു വ്യക്തി ഉയർന്നുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മൂലപദത്തിന്റെ രൂപകഭാവം നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: בְּקִרְבְּךָ
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: ‘നിങ്ങളുടെ മധ്യേ/ഇടയിൽ’ എന്ന സമൂഹപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: נָבִיא
  choice: പ്രവാചകൻ
  rationale: ഈ എബ്രായ പദത്തിനുള്ള സ്ഥിരവും പൊതുവായി മനസ്സിലാകുന്നതുമായ മലയാളപരിഭാഷ.
- source_word: אוֹ
  choice: -ഓ ... -ഓ
  rationale: രണ്ട് സാധ്യതകളെ വേർതിരിക്കുന്ന വികൽപബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: חֹלֵם חֲלוֹם
  choice: സ്വപ്നം കാണുന്ന ഒരാൾ
  rationale: എബ്രായത്തിലെ കൃതന്തവും സമാനധാതുനാമവും ചേർന്ന പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘സ്വപ്നക്കാരൻ’ എന്നതിന് ഉണ്ടാകാവുന്ന അവഹേളനമോ അനാവശ്യ അർഥനിറമോ ഒഴിവാക്കുന്നു.
- source_word: וְנָתַן אֵלֶיךָ
  choice: നിങ്ങൾക്ക് ... നൽകിയാൽ
  rationale: സോപാധിക ക്രമത്തിൽ ഭാവിസാധ്യത സൂചിപ്പിക്കുന്ന ക്രിയയെ മലയാളത്തിലെ സോപാധിക രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אוֹת
  choice: അടയാളം
  rationale: തെളിവോ സ്ഥിരീകരണമോ നൽകുന്ന ചിഹ്നം എന്ന സാധാരണ അർഥം സംരക്ഷിക്കുന്ന സ്ഥിരമായ പരിഭാഷ.
- source_word: מוֹפֵת
  choice: അത്ഭുതം
  rationale: ഓת എന്ന പദത്തോടൊപ്പം വരുന്ന ശ്രദ്ധേയമായ അത്ഭുതകര പ്രതിഭാസം എന്ന അർഥം നൽകുന്നു; അത് യഥാർഥത്തിൽ ദൈവിക അത്ഭുതമാണെന്ന് മുൻകൂട്ടി വിധിക്കുന്നില്ല.
theological_decisions:
- issue: പ്രവാചകനോ സ്വപ്നം കാണുന്നയാളോ നൽകുന്ന അടയാളത്തിന്റെയോ അത്ഭുതത്തിന്റെയോ സ്വഭാവം
  choice: ‘ഒരു അടയാളമോ അത്ഭുതമോ’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി, പ്രതിഭാസം യഥാർഥ അത്ഭുതമാണോ വഞ്ചനയാണോ വെറും അവകാശവാദമാണോ എന്ന് നിർണയിക്കാതെ വിടുന്നു.
  alternative: ‘ഒരു അടയാളമോ ശകുനമോ’ അല്ലെങ്കിൽ ‘ഒരു അത്ഭുതകരമായ അടയാളമോ അത്ഭുതമോ’
  rationale: ഈ വാക്യം പ്രതിഭാസത്തിന്റെ ഉറവിടമോ സ്വഭാവമോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ നിഗമനം പരിഭാഷയിൽ ചേർക്കാതെ മൂലത്തിലെ സംഘർഷവും അവ്യക്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധനയുള്ള എബ്രായരൂപത്തെ മലയാളത്തിലെ മാന്യവും സമൂഹത്തെ അഭിസംബോധന ചെയ്യാൻ സ്വാഭാവികവുമായ ‘നിങ്ങൾ’ എന്നു നൽകി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന സോപാധിക ഘടനയായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
