id: DEU.13.9
reference: Deuteronomy 13:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תֹאבֶ֣ה ל֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע אֵלָ֑י/ו וְ/לֹא תָח֤וֹס עֵֽינְ/ךָ֙ עָלָ֔י/ו וְ/לֹֽא תַחְמֹ֥ל וְ/לֹֽא תְכַסֶּ֖ה עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: ml
  text: നീ അവനു വഴങ്ങുകയോ അവന്റെ വാക്കു കേൾക്കുകയോ അരുത്.[a] നിന്റെ കണ്ണ് അവനോടു കനിവു കാണിക്കരുത്; നീ അവനെ വെറുതെ വിടുകയോ മറച്ചുവെക്കുകയോ അരുത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനോടു സമ്മതിക്കുകയോ അവനു ചെവികൊടുക്കുകയോ അരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവനുവേണ്ടി മറച്ചുവെക്കുകയോ,’ അതായത് അവനെയോ അവന്റെ കുറ്റത്തെയോ ഒളിപ്പിക്കുകയോ, എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לוֹ
  choice: അവനു വഴങ്ങുക
  rationale: אָבָה എന്ന ക്രിയ സന്നദ്ധത, സമ്മതം, വഴങ്ങൽ എന്നിവ സൂചിപ്പിക്കുന്നു. വിശ്വാസത്യാഗത്തിലേക്കുള്ള പ്രേരണയുടെ പശ്ചാത്തലത്തിൽ ‘വഴങ്ങുക’ എന്നത് അവന്റെ പ്രേരണയ്ക്കു കീഴടങ്ങാതിരിക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תִשְׁמַע אֵלָיו
  choice: അവന്റെ വാക്കു കേൾക്കുക
  rationale: שׁמע + אֶל ഇവിടെ വെറും ശബ്ദം കേൾക്കുന്നതിലുപരി ശ്രദ്ധിച്ചു ചെവികൊടുക്കുക എന്ന അർഥത്തിലാണ്. ‘അവന്റെ വാക്കു കേൾക്കുക’ അനുസരിക്കുക എന്ന ആശയം നിർബന്ധമായി ചേർക്കാതെ ഈ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: നിന്റെ കണ്ണ് അവനോടു കനിവു കാണിക്കുക
  rationale: ഹീബ്രായമൂലത്തിലെ ‘നിന്റെ കണ്ണ്’ എന്ന ദൃശ്യപ്രയോഗം നിലനിർത്തുകയും חוּס സൂചിപ്പിക്കുന്ന സഹതാപം/കനിവ് പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: תַחְמֹל
  choice: അവനെ വെറുതെ വിടുക
  rationale: חמל എന്നത് കരുണ കാണിക്കുക അഥവാ ശിക്ഷയിൽനിന്ന് ഒഴിവാക്കുക എന്ന ആശയം നൽകുന്നു. മുൻപുള്ള ‘കനിവു കാണിക്കുക’ എന്നതിൽനിന്ന് വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് നിയമപരമായ സന്ദർഭത്തിൽ ‘വെറുതെ വിടുക’ സ്വാഭാവികമാണ്.
- source_word: תְכַסֶּה עָלָיו
  choice: അവനെ മറച്ചുവെക്കുക
  rationale: Piel രൂപത്തിലുള്ള כסה ഇവിടെ ഒരാളെ മറയ്ക്കുക, അയാൾക്കുവേണ്ടി കാര്യങ്ങൾ മൂടിവെക്കുക എന്നീ സാധ്യതകൾ വഹിക്കുന്നു. ‘അവനെ മറച്ചുവെക്കുക’ നേരിട്ടുള്ള കർമത്തെ നിലനിർത്തുന്നു; കുറ്റം മറച്ചുവെക്കുക എന്ന സന്ദർഭാർഥവും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസത്യാഗത്തിലേക്കു പ്രേരിപ്പിക്കുന്നവനെക്കുറിച്ചുള്ള കഠിനമായ ഉടമ്പടി-ന്യായഭാഷ
  choice: ആവർത്തിച്ചുള്ള നേരിട്ടുള്ള വിലക്കുകൾ മൃദൂകരിക്കാതെ നിലനിർത്തി.
  alternative: ഇത് കേവലം മാനസികമായ വിയോജിപ്പായി പരാവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ ‘അവനെ സംരക്ഷിക്കരുത്’ എന്ന ഒറ്റ പൊതുവിലക്കായി ചുരുക്കുക.
  rationale: മൂലപാഠം സമ്മതിക്കുക, ചെവികൊടുക്കുക, കനിവു കാണിക്കുക, വെറുതെ വിടുക, മറച്ചുവെക്കുക എന്നിവയെ ക്രമമായി വിലക്കുന്നു. അതിനാൽ വാക്യത്തിന്റെ നിയമപരമായ കാഠിന്യവും സഞ്ചിതശക്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ഹീബ്രായത്തിലെ രണ്ടാംപുരുഷ ഏകവചനവും നിരോധനങ്ങളുടെ ആവർത്തനവും ‘നിന്റെ കണ്ണ്’ എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തിയിരിക്കുന്നു.
