id: DEU.13.3
reference: Deuteronomy 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָ֤א הָ/אוֹת֙ וְ/הַ/מּוֹפֵ֔ת אֲשֶׁר דִּבֶּ֥ר אֵלֶ֖י/ךָ לֵ/אמֹ֑ר נֵֽלְכָ֞ה אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים אֲשֶׁ֥ר לֹֽא יְדַעְתָּ֖/ם וְ/נָֽעָבְדֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
translation:
  language: ml
  text: ‘നീ അറിയാത്ത അന്യദേവന്മാരുടെ പിന്നാലെ നമുക്കു പോകാം; അവരെ സേവിക്കാം’ എന്ന് അവൻ നിന്നോടു പറഞ്ഞ അടയാളമോ അത്ഭുതമോ സംഭവിക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָא
  choice: സംഭവിക്കുകയും
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘വരുക’ എന്നാണെങ്കിലും, മുൻകൂട്ടി പറഞ്ഞ അടയാളമോ അത്ഭുതമോ യാഥാർഥ്യമാകുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘സംഭവിക്കുക’ എന്നു പറയുന്നു. വാക്യം മുൻപും പിന്നാലെയും ഉള്ള ആശയങ്ങളുമായി ബന്ധിപ്പിക്കപ്പെട്ടിരിക്കുന്നതിനാൽ ‘-യും’ ഘടന നിലനിർത്തി.
- source_word: הָאוֹת וְהַמּוֹפֵת
  choice: അടയാളമോ അത്ഭുതമോ
  rationale: אוֹת എന്നതിന് ‘അടയാളം’, מוֹפֵת എന്നതിന് ‘അത്ഭുതം’ എന്നു നൽകി. ഹീബ്രു പദജോടി സന്ദർഭത്തിൽ ഏതെങ്കിലും തരത്തിലുള്ള അസാധാരണ സ്ഥിരീകരണത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘-ഓ ... -ഓ’ പ്രയോഗിച്ചു; അക്ഷരാർഥമായ ‘അടയാളവും അത്ഭുതവും’ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: അവൻ നിന്നോടു പറഞ്ഞ
  rationale: ബന്ധവാക്യം മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നാമപദത്തിനു മുമ്പായി നൽകി; ദിശാസൂചകമായ אֵלֶיךָ ‘നിന്നോടു’ എന്നു നിലനിർത്തി.
- source_word: נֵלְכָה אַחֲרֵי
  choice: പിന്നാലെ നമുക്കു പോകാം
  rationale: ആഹ്വാനാത്മകമായ cohortative രൂപവും אַחֲרֵי എന്നതിലെ ‘പിന്നാലെ’ എന്ന ദൃശ്യരൂപവും മതപരമായ അനുഗമനഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാർ
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടിസന്ദർഭത്തിനു ചേരുന്ന, ആധുനിക മലയാളത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പ്രയോഗം.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: നീ അറിയാത്ത
  rationale: ידע എന്ന ക്രിയയുടെ ‘അറിയുക/പരിചയപ്പെട്ടിരിക്കുക’ എന്ന തുറന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു; വിഗ്രഹങ്ങൾക്ക് വ്യക്തിത്വമുണ്ടോ എന്ന ചോദ്യം വിവർത്തനം സ്വയം തീർപ്പാക്കുന്നില്ല.
- source_word: וְנָעָבְדֵם
  choice: അവരെ സേവിക്കാം
  rationale: עבד എന്നത് മതപരമായ സേവനത്തെയും ആരാധനയെയും സൂചിപ്പിക്കാം. ‘സേവിക്കുക’ മൂലപദത്തിന്റെ വിശാലമായ ഉടമ്പടിസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു; ‘ആരാധിക്കുക’ അടിക്കുറിപ്പിൽ പകരമായി നൽകി.
theological_decisions:
- issue: അന്യദേവന്മാരെ സൂചിപ്പിക്കുന്ന സർവനാമം
  choice: അവരെ
  alternative: അവയെ
  rationale: ഹീബ്രുവിലെ ബഹുവചന കർമപ്രത്യയം വ്യാകരണപരമായി אֱלֹהִים אֲחֵרִים എന്നതിലേക്കാണ് മടങ്ങുന്നത്; അത് വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള തത്ത്വശാസ്ത്രവിധി നിർബന്ധിക്കുന്നില്ല. മലയാളത്തിൽ ദേവന്മാരെ സംബന്ധിച്ച് ‘അവരെ’ എന്നത് സ്വാഭാവികമായതിനാൽ അതു സ്വീകരിച്ചു; ഇതിലൂടെ അവരുടെ യാഥാർഥ്യമോ നിയമസാധുതയോ സ്ഥിരീകരിക്കുന്നില്ല.
- issue: עבד എന്ന മതപരമായ ക്രിയയുടെ പരിഭാഷ
  choice: സേവിക്കാം
  alternative: ആരാധിക്കാം
  rationale: ‘സേവിക്കുക’ എന്നത് മതപരമായ അനുസരണവും ആരാധനയും ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു; ‘ആരാധിക്കുക’ സന്ദർഭോചിതമായ വ്യക്തീകരണമാണെങ്കിലും അർഥത്തെ കുറച്ചുകൂടി ചുരുക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വാക്യം സന്ദർഭത്തിൽ തുടരുന്ന നിബന്ധനാഘടകമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ‘പിന്നാലെ പോകുക’ എന്ന മൂലഭാഷാ ദൃശ്യരൂപവും ‘സേവിക്കുക’ എന്ന ഉടമ്പടിപദവും വായനാസൗകര്യം നഷ്ടപ്പെടാതെ സംരക്ഷിച്ചു.
