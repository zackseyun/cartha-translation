source:
  edition: WLC
  text: וְ/דָרַשְׁתָּ֧ וְ/חָקַרְתָּ֧ וְ/שָׁאַלְתָּ֖ הֵיטֵ֑ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/קִרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/015.yaml
  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: ml
  text: നീ അന്വേഷിക്കുകയും പരിശോധിക്കുകയും നന്നായി ചോദിച്ചറിയുകയും വേണം. അപ്പോൾ, കാര്യം സത്യവും ഉറപ്പുള്ളതുമാണെന്നും[a] ഈ അറപ്പുളവാക്കുന്ന പ്രവൃത്തി നിന്റെ മധ്യേ നടന്നിട്ടുണ്ടെന്നും തെളിഞ്ഞാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വാർത്ത സത്യമാണെന്നും കാര്യം സ്ഥിരീകരിക്കപ്പെട്ടിട്ടുണ്ടെന്നും.’
    reason: הַדָּבָർ സന്ദർഭത്തിൽ റിപ്പോർട്ടിനെയോ പരിശോധിക്കപ്പെടുന്ന കാര്യത്തെയോ സൂചിപ്പിക്കാം; ഈ ബദൽ ആ നിയമപരമായ സൂക്ഷ്മത വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וְדָרַשְׁתָּ
  choice: നന്നായി അന്വേഷിക്കുകയും
  rationale: നിയമപരമായ സാഹചര്യത്തിൽ דרש ക്രമബദ്ധമായ അന്വേഷണം നടത്തുക എന്ന അർഥം വഹിക്കുന്നു. തുടർന്നുള്ള ക്രിയകളിൽനിന്ന് വേർതിരിച്ചറിയാവുന്ന സ്വാഭാവിക മലയാളമാണ് ‘അന്വേഷിക്കുക’.
- source_word: וְחָקַרְתָּ
  choice: സൂക്ഷ്മമായി പരിശോധിക്കുകയും
  rationale: חקר ആഴത്തിലുള്ള പരിശോധനയെ സൂചിപ്പിക്കുന്നു. ‘സൂക്ഷ്മമായി പരിശോധിക്കുക’ അന്വേഷണത്തിന്റെ ശ്രദ്ധാപൂർവമായ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: വിശദമായി ചോദിച്ചറിയുകയും
  rationale: שאל എന്ന ‘ചോദിക്കുക/അന്വേഷിക്കുക’ എന്ന ക്രിയയെ הֵיטֵב ശക്തിപ്പെടുത്തുന്നു. ‘വിശദമായി ചോദിച്ചറിയുക’ ഈ സംയുക്തത്തിന്റെ സമഗ്രമായ അന്വേഷണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: הנה അന്വേഷണത്തിനു ശേഷം കണ്ടെത്തിയ ഫലത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരചിഹ്നമാണ്. ‘ഇതാ’ അതിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: കാര്യം സത്യമാണെന്നും സ്ഥിരീകരിക്കപ്പെട്ടതാണെന്നും
  rationale: ഈ പദസമുച്ചയം വിവരം സത്യവും കാര്യം ഉറപ്പിക്കപ്പെട്ടതുമാണെന്ന ന്യായപരമായ സ്ഥിരീകരണത്തെ സൂചിപ്പിക്കുന്നു. ‘കാര്യം’ എന്നത് הַדָּבָר വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: נֶעֶשְׂתָה
  choice: നടന്നിട്ടുണ്ടെന്നും
  rationale: עשה എന്ന ക്രിയയുടെ നിഫാൽ രൂപം സംഭവം നടന്നുകഴിഞ്ഞതായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ പൂർത്തീകരണരൂപം അന്വേഷണത്തിനു മുമ്പ് നടന്ന പ്രവൃത്തിയെന്ന അർഥം നൽകുന്നു.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: ഈ അറപ്പുളവാക്കുന്ന പ്രവൃത്തി
  rationale: תועבה വളരെ ശക്തമായ ധാർമിക-ഉടമ്പടിപരമായ വെറുപ്പിനെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘അറപ്പുളവാക്കുന്ന പ്രവൃത്തി’ അതിന്റെ ഗൗരവം സംരക്ഷിക്കുന്നു.
- source_word: בְּקִרְבֶּךָ
  choice: നിന്റെ മധ്യേ
  rationale: ഈ പ്രയോഗം അഭിസംബോധന ചെയ്യപ്പെടുന്ന സമൂഹത്തിനുള്ളിൽ സംഭവം നടന്നതിനെ സൂചിപ്പിക്കുന്നു. ഏകവചന പ്രത്യയം നിലനിർത്തി ‘നിന്റെ മധ്യേ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ന്യായപരമായ സ്ഥിരീകരണസൂത്രം
  choice: അന്വേഷണക്രിയകളുടെ ശൃംഖലയിൽനിന്ന് ‘കാര്യം സത്യമാണെന്നും സ്ഥിരീകരിക്കപ്പെട്ടതാണെന്നും’ എന്ന നിഗമനത്തിലേക്ക് വാക്യം നീങ്ങുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘വാർത്ത സത്യമാണെന്നും കാര്യം ഉറപ്പിക്കപ്പെട്ടിട്ടുണ്ടെന്നും’
  rationale: എബ്രായം റിപ്പോർട്ടിനെ സൂചിപ്പിക്കാമെങ്കിലും ‘വാർത്ത’ എന്ന പദം നേരിട്ട് ഉപയോഗിക്കുന്നില്ല; הַדָּבָר എന്ന ‘കാര്യം’ നിലനിർത്തുന്നത് മൂലപാഠത്തോട് കൂടുതൽ ചേർന്നുനിൽക്കുന്നു. അതേസമയം നിബന്ധനാത്മകമായ ‘തെളിഞ്ഞാൽ’ എന്ന ഘടന മലയാളത്തിൽ നിയമപരമായ അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. മൂന്ന് അന്വേഷണക്രിയകളുടെയും സഞ്ചിതബലം വേർതിരിച്ചു നിലനിർത്തി. അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്ന നിബന്ധനാവാക്യമാണെന്നതിനാൽ അവസാനം അർധവിരാമസദൃശമായ കോമ നിലനിർത്തി.
