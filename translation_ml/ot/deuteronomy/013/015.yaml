revisions:
- from: നീ നന്നായി അന്വേഷിക്കുകയും സൂക്ഷ്മമായി പരിശോധിക്കുകയും വിശദമായി ചോദിച്ചറിയുകയും വേണം. ഇതാ, കാര്യം സത്യമാണെന്നും സ്ഥിരീകരിക്കപ്പെട്ടതാണെന്നും[a]—ഈ അറപ്പുളവാക്കുന്ന പ്രവൃത്തി നിന്റെ മധ്യേ നടന്നിട്ടുണ്ടെന്നും—തെളിഞ്ഞാൽ,
  to: നീ അന്വേഷിക്കുകയും പരിശോധിക്കുകയും നന്നായി ചോദിച്ചറിയുകയും വേണം. അപ്പോൾ, കാര്യം സത്യവും ഉറപ്പുള്ളതുമാണെന്നും[a] ഈ അറപ്പുളവാക്കുന്ന പ്രവൃത്തി നിന്റെ മധ്യേ നടന്നിട്ടുണ്ടെന്നും തെളിഞ്ഞാൽ,
  rationale: ‘നന്നായി’ മൂന്നാമത്തെ അന്വേഷണക്രിയയോടു ചേർത്ത് എബ്രായ വ്യാകരണബന്ധം പുനഃസ്ഥാപിച്ചു. സ്ഥിരീകരണസൂത്രം ‘കാര്യം സത്യവും ഉറപ്പുള്ളതുമാണ്’ എന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകി; തുടർന്ന് നടന്നതായി സ്ഥിരീകരിക്കപ്പെടുന്ന പ്രവൃത്തിയെ ഏകോപിതമായ നിബന്ധനാവാക്യത്തിൽ നിലനിർത്തി. വാക്യാവസാന കോമ അടുത്ത വാക്യത്തിലേക്കുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നു.
