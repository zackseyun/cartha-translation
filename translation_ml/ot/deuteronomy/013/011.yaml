source:
  edition: WLC
  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: ml
  text: നീ അവനെ കല്ലുകൾകൊണ്ട് എറിഞ്ഞുകൊല്ലണം. അവൻ മരിക്കണം; കാരണം, അടിമത്തത്തിന്റെ ഭവനമായ ഈജിപ്തുദേശത്തുനിന്ന്[b] നിന്നെ പുറപ്പെടുവിച്ച നിന്റെ ദൈവമായ യഹോവയിൽനിന്ന് നിന്നെ അകറ്റിക്കളയാൻ[a] അവൻ ശ്രമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അകറ്റിക്കളയാൻ” എന്നതിന് “വഴിതെറ്റിക്കാൻ” അഥവാ “വശീകരിച്ച് അകറ്റാൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “അടിമത്തത്തിന്റെ ഭവനം” എന്നത് ഈജിപ്തിലെ അടിമത്തത്തിൽനിന്ന് ഇസ്രായേലിനെ വിടുവിച്ചതിനെ ഓർമിപ്പിക്കുന്ന ഉടമ്പടി പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים
  choice: നീ അവനെ കല്ലുകൾകൊണ്ട് എറിഞ്ഞുകൊല്ലണം
  rationale: നിയമപരമായ കല്പനയും കല്ലെറിഞ്ഞുള്ള വധശിക്ഷയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וָמֵת
  choice: അവൻ മരിക്കണം
  rationale: മരണഫലം വേറൊരു വാക്യഘടകമായി പറയുന്ന എബ്രായ ക്രമവും നിയമഭാഷയുടെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: כִּי בִקֵּשׁ
  choice: കാരണം ... അവൻ ശ്രമിച്ചു
  rationale: ശിക്ഷയുടെ കാരണവും മനഃപൂർവമായ ശ്രമവും വ്യക്തമാക്കുന്നു; בקש എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: לְהַדִּיחֲךָ מֵעַל
  choice: നിന്നെ അകറ്റിക്കളയാൻ
  rationale: കാരണപ്രയോഗത്തിലുള്ള נדח എന്ന ക്രിയയുടെ ശക്തിയും ഉടമ്പടി വിശ്വസ്തതയിൽനിന്നുള്ള അകൽച്ചയും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമമായ יהוה-യെ ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്ത് വ്യക്തിനാമ സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: הַמּוֹצִיאֲךָ
  choice: നിന്നെ പുറപ്പെടുവിച്ച
  rationale: ചരിത്രപരമായ വിടുതൽപ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല വിശേഷണവാക്യമായി നൽകുന്നു.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: ഭൂമിശാസ്ത്രപരമായ പ്രയോഗം സംക്ഷിപ്തവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִבֵּית עֲבָדִים
  choice: അടിമത്തത്തിന്റെ ഭവനമായ
  rationale: ‘അടിമത്തത്തിന്റെ ഭവനം’ എന്ന ഉടമ്പടി സൂത്രവാക്യത്തിന്റെ രൂപകം നിലനിർത്തുകയും അത് ഈജിപ്തിനെ വിശേഷിപ്പിക്കുന്നതായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: לְהַדִּיחֲךָ מֵעַל יהוה എന്ന ഉടമ്പടി-വിശ്വാസത്യാഗ ഭാഷ
  choice: യഹോവയിൽനിന്ന് നിന്നെ അകറ്റിക്കളയാൻ
  alternative: യഹോവയെ വിട്ട് വഴിതെറ്റിക്കാൻ; യഹോവയിൽനിന്ന് വശീകരിച്ച് അകറ്റാൻ
  rationale: മറ്റൊരാളെ ഉടമ്പടി വിശ്വസ്തതയിൽനിന്ന് മാറ്റുന്ന കാരണപ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; വശീകരണം എന്ന പ്രത്യേക രീതി മൂലത്തിൽ നിർബന്ധമല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള നിയമഭാഷ. സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദപ്രയോഗം ഉപയോഗിച്ചുകൊണ്ട് എബ്രായത്തിലെ ആവർത്തിത മരണപ്രസ്താവനയും ഉടമ്പടി സൂത്രവാക്യവും നിലനിർത്തിയിരിക്കുന്നു.
