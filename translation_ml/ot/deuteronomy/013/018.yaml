revisions:
- from: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതിൽനിന്ന് യാതൊന്നും നിന്റെ കൈയിൽ പറ്റിപ്പിടിക്കരുത്[a]. അങ്ങനെ യഹ്‌വെ തന്റെ ഉഗ്രകോപത്തിൽനിന്ന് പിന്തിരിഞ്ഞ്[b] നിന്നോടു കരുണ കാട്ടുകയും നിന്നിൽ മനസ്സലിയുകയും നിന്റെ പിതാക്കന്മാരോടു സത്യം ചെയ്തതുപോലെ നിന്നെ പെരുപ്പിക്കുകയും ചെയ്യും.
  to: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതിൽനിന്ന് യാതൊന്നും നിന്റെ കൈയിൽ പറ്റിനിൽക്കരുത്[a]. അങ്ങനെ യഹ്‌വെ തന്റെ ഉഗ്രകോപത്തിൽനിന്ന് പിന്തിരിയുകയും നിനക്കു കരുണ കാട്ടുകയും നിന്നോടു അനുകമ്പ കാണിക്കുകയും നിന്റെ പിതാക്കന്മാരോടു സത്യം ചെയ്തതുപോലെ നിന്നെ വർധിപ്പിക്കുകയും ചെയ്യും[b].
  rationale: The revision clarifies that nothing of the devoted material is to remain attached to the person's hand, rather than phrasing this as an ambiguous imperative. It also uses natural Malayalam for Yahweh's compassion and for multiplying the people, while retaining the source's sequence, intensification, divine name, and reference to the fathers.
