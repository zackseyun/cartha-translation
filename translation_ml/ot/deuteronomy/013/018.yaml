reference: Deuteronomy 13:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: ml
  text: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതിൽനിന്ന് യാതൊന്നും നിന്റെ കൈയിൽ പറ്റിനിൽക്കരുത്[a]. അങ്ങനെ യഹ്‌വെ തന്റെ ഉഗ്രകോപത്തിൽനിന്ന് പിന്തിരിയുകയും നിനക്കു കരുണ കാട്ടുകയും നിന്നോടു അനുകമ്പ കാണിക്കുകയും നിന്റെ പിതാക്കന്മാരോടു സത്യം ചെയ്തതുപോലെ നിന്നെ വർധിപ്പിക്കുകയും ചെയ്യും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി, “ശാപാർപ്പിതമായതിൽനിന്ന്” അഥവാ “നിരോധനത്തിൻ കീഴിലുള്ളതിൽനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിലെ חֵרֶם ദൈവത്തിനായി പിൻവലിക്കാനാവാത്തവിധം സമർപ്പിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു; പല സന്ദർഭങ്ങളിലും അത് നശിപ്പിക്കേണ്ടതാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവന്റെ മൂക്കിന്റെ ജ്വലനത്തിൽനിന്ന്”; ഇത് തീവ്രമായ കോപത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: יִדְבַּק בְּיָדְךָ
  choice: നിന്റെ കൈയിൽ പറ്റിപ്പിടിക്കരുത്
  rationale: דבק എന്ന ക്രിയയുടെ ‘പറ്റിപ്പിടിക്കുക’ എന്ന മൂർത്തമായ ദൃശ്യവും, കൈവശം വെക്കുക എന്ന സന്ദർഭസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מְאוּמָה
  choice: യാതൊന്നും
  rationale: നിഷേധത്തോടു ചേർന്ന ഈ പദം സമ്പൂർണമായ വിലക്ക് വ്യക്തമാക്കുന്നു.
- source_word: הַחֵרֶם
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടത്
  rationale: ദൈവത്തിനായി പിൻവലിക്കാനാവാത്തവിധം സമർപ്പിച്ച് നശിപ്പിക്കേണ്ട വസ്തുവിനെ സൂചിപ്പിക്കുന്ന നിയമ-ഉടമ്പടി പദത്തിന്റെ അർഥം ആധുനിക വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: יָשׁוּב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: യഹ്‌വെ തന്റെ ഉഗ്രകോപത്തിൽനിന്ന് പിന്തിരിഞ്ഞ്
  rationale: שׁוב מן എന്നതിന്റെ ‘പിന്തിരിയുക’ എന്ന ചലനവും חֲרוֹן אַף എന്ന തീവ്രകോപത്തിന്റെ ഹീബ്രു പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: רַחֲמִים
  choice: കരുണ
  rationale: נתן എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കരുണ കാട്ടുക’ എന്നു നൽകി ദയയുടെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְרִחַמְךָ
  choice: നിന്നിൽ മനസ്സലിയുകയും
  rationale: മുൻപുള്ള רַחֲמִים എന്ന നാമത്തോട് ഒരേ പദം ആവർത്തിക്കാതെ, ഹീബ്രുവിലെ അടുത്ത അർഥമുള്ള ഊന്നൽ വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: וְהִרְבֶּךָ
  choice: നിന്നെ പെരുപ്പിക്കുകയും
  rationale: רבהയുടെ കാരകഭാവവും പിതാക്കന്മാർക്കു നൽകിയ സന്തതിവർധനയുടെ ഉടമ്പടി വാഗ്ദാനപ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരോടു സത്യം ചെയ്തതുപോലെ
  rationale: താരതമ്യബന്ധവും ഗോത്രപിതാക്കന്മാരോടുള്ള ഉടമ്പടി-സൂചനയും കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ഉടമ്പടി നാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: חֵרֶם എന്ന ഉടമ്പടി-യുദ്ധ പദം
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടത്
  alternative: ശാപാർപ്പിതം; നിരോധനത്തിൻ കീഴിലുള്ളത്
  rationale: ദൈവത്തിനായി മാറ്റിവെച്ചതും ഈ സന്ദർഭത്തിൽ നശിപ്പിക്കേണ്ടതുമായ വസ്തുവിന്റെ ഇരട്ടസൂചന വ്യക്തമാക്കുന്നു; ‘ശാപം’ എന്ന ഒറ്റ ആശയത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: ദൈവകോപത്തിന്റെ ശരീരാവയവാധിഷ്ഠിത ഹീബ്രു പ്രയോഗം
  choice: ഉഗ്രകോപം
  alternative: മൂക്കിന്റെ ജ്വലനം; ജ്വലിക്കുന്ന കോപം
  rationale: חֲרוֹן אַף സൂചിപ്പിക്കുന്ന തീവ്രത സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാവുന്ന അക്ഷരാർഥ ശരീരചിത്രം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു; അടിക്കുറിപ്പിൽ അത് രേഖപ്പെടുത്തുന്നു.
- issue: אֲבֹתֶיךָ എന്നതിന്റെ ലിംഗ-ചരിത്ര കൃത്യത
  choice: നിന്റെ പിതാക്കന്മാർ
  alternative: നിന്റെ പൂർവികർ
  rationale: ഇവിടെ ഗോത്രപിതാക്കന്മാരോടു ചെയ്ത സത്യത്തെ സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ ബഹുവചനം ചരിത്രപരമായ പ്രത്യേകതയോടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പറ്റിപ്പിടിക്കുക’ എന്ന മൂർത്തരൂപവും ‘പെരുപ്പിക്കുക’ എന്ന ഉടമ്പടി-പ്രതിധ്വനിയും നിലനിർത്തി; അപരിചിതമായ സാങ്കേതിക പദത്തിന് പകരം അർഥവ്യക്തമായ മുഖ്യപാഠവും വിശദീകരണ അടിക്കുറിപ്പും നൽകി.
