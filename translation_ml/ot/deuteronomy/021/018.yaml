    rationale: In modern Malayalam it commonly means ‘competitor/rival’; ‘വിമതൻ’ more clearly communicates the source’s defiant, rebellious sense.
  - severity: low
    issue: ‘ശിക്ഷണത്തിന് വിധേയനാക്കിയിട്ടും’ is stiff and indirect.
    rationale: ‘അവനെ ശാസിച്ചിട്ടും’ is a natural Malayalam expression for parental corrective discipline and does not require an implication of physical punishment.
