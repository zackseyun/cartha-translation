  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: ml
  text: ഒരാൾക്ക് ദുശ്ശാഠ്യക്കാരനും വിമതനുമായ ഒരു മകൻ ഉണ്ടായിരിക്കുകയും[a], അവൻ തന്റെ പിതാവിന്റെ വാക്കോ അമ്മയുടെ വാക്കോ അനുസരിക്കാതിരിക്കുകയും[b][c], അവർ അവനെ ശാസിച്ചിട്ടും[d] അവൻ അവരെ അനുസരിക്കാതിരിക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരാൾക്ക് ... ഒരു മകൻ ഉണ്ടാകുമ്പോൾ.’ ഹീബ്രായ നിയമസൂത്രത്തിലെ പ്രയോഗം ‘എങ്കിൽ’ എന്നോ ‘എപ്പോൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ ‘അനുസരിക്കുക’ എന്നത് മാതാപിതാക്കളുടെ നിർദേശം ശ്രദ്ധിച്ചു കേട്ട് അതനുസരിച്ച് പ്രവർത്തിക്കുക എന്ന അർഥത്തിലാണ്.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘തന്റെ പിതാവിന്റെ ശബ്ദവും തന്റെ അമ്മയുടെ ശബ്ദവും.’ ഇവിടെ ‘ശബ്ദം’ അധികാരപൂർവമായ വാക്കിനെയോ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, ‘അവർ അവനെ ശാസിക്കുകയും.’ ഹീബ്രായ സംയോജകം സാധാരണ ‘കൂടാതെ/അപ്പോൾ’ എന്ന നിലയിൽ വായിക്കാം; എന്നാൽ സന്ദർഭം ‘ശാസിച്ചിട്ടും’ എന്ന വഴക്കാർഥത്തെയും പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ഉണ്ടായിരിക്കുകയും ... ചെയ്താൽ
  rationale: സാഹചര്യാധിഷ്ഠിത നിയമവ്യവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധനാവാക്യമായി അവതരിപ്പിക്കുന്നു; ‘ഉണ്ടാകുമ്പോൾ’ എന്ന കാലാർഥവും സാധ്യമാണ്.
- source_word: יִהְיֶה לְאִישׁ
  choice: ഒരാൾക്ക് ... ഒരു മകൻ ഉണ്ടായിരിക്കുക
  rationale: ഹീബ്രായയിലെ അസ്തിത്വക്രിയയും സമ്പ്രദാനവിഭക്തിയും ചേർന്ന ഉടമസ്ഥതാപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: בֵּן
  choice: മകൻ
  rationale: മൂലപദം പൊതുവായ ‘കുട്ടി’ എന്നതല്ല, പുരുഷസന്തതിയെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
- source_word: סוֹרֵר
  choice: ദുശ്ശാഠ്യക്കാരൻ
  rationale: വഴങ്ങാനും തിരുത്തപ്പെടാനും വിസമ്മതിക്കുന്ന സ്ഥിരമായ പിടിവാശിയുടെ അർഥം നൽകുന്നു.
- source_word: מוֹרֶה
  choice: മത്സരി
  rationale: סוֹרֵר എന്ന പദത്തോടു ചേർന്ന് സജീവമായ എതിർപ്പും അധികാരത്തിനെതിരായ മത്സരവും പ്രകടമാക്കുന്നു.
- source_word: אֵינֶנּוּ שֹׁמֵעַ
  choice: അനുസരിക്കാതിരിക്കുക
  rationale: שׁמע എന്നതിന് അടിസ്ഥാനമായി ‘കേൾക്കുക’ എന്നാണെങ്കിലും ഈ മാതാപിതൃ-നിയമസന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് അവരുടെ നിർദേശം ചെവിക്കൊണ്ട് അനുസരിക്കലാണ്.
- source_word: בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ
  choice: തന്റെ അപ്പന്റെ വാക്കോ അമ്മയുടെ വാക്കോ
  rationale: ‘ശബ്ദത്തിൽ’ എന്ന ഹീബ്രായ പ്രയോഗം അധികാരപൂർവമായ വാക്കിനെയോ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നു. നിഷേധവാക്യത്തിൽ മലയാളത്തിലെ ‘വാക്കോ ... വാക്കോ’ സ്വാഭാവികമായി ഇരുവരെയും ഉൾക്കൊള്ളുന്നു.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: അവർ അവനെ ശിക്ഷണത്തിന് വിധേയനാക്കിയിട്ടും
  rationale: יסר ശിക്ഷ മാത്രം എന്നതിലുപരി തിരുത്താനും പരിശീലിപ്പിക്കാനുമുള്ള ശിക്ഷണത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ വഴങ്ങാതിരിക്കൽ കണക്കിലെടുത്ത് concessive അർഥം ‘-യിട്ടും’ കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: അവൻ അവരെ അനുസരിക്കാതിരിക്കുക
  rationale: ആവർത്തിക്കുന്ന שׁמעയുടെ അനുസരണാർഥം നിലനിർത്തുകയും മാതാപിതാക്കളിലേക്കുള്ള വ്യക്തമായ സൂചന നൽകുകയും ചെയ്യുന്നു.
