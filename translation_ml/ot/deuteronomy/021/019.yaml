revisions:
- from: അപ്പോൾ അവന്റെ അപ്പനും അമ്മയും അവനെ പിടിച്ച് അവന്റെ പട്ടണത്തിലെ മൂപ്പന്മാരുടെ അടുക്കൽ, അവൻ താമസിക്കുന്ന സ്ഥലത്തിന്റെ കവാടത്തിങ്കലേക്ക്[a][b], കൊണ്ടുപോകണം.
  to: അപ്പോൾ അവന്റെ അപ്പനും അമ്മയും അവനെ പിടിച്ച്, അവന്റെ പട്ടണത്തിലെ മൂപ്പന്മാരുടെ അടുക്കലേക്കും അവന്റെ സ്ഥലത്തിന്റെ കവാടത്തിലേക്കും അവനെ പുറത്തുകൊണ്ടുവരണം.[a][b]
