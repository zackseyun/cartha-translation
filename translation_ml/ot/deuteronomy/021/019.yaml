base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/019.yaml
  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: ml
  text: അപ്പോൾ അവന്റെ അപ്പനും അമ്മയും അവനെ പിടിച്ച്, അവന്റെ പട്ടണത്തിലെ മൂപ്പന്മാരുടെ അടുക്കലേക്കും അവന്റെ സ്ഥലത്തിന്റെ കവാടത്തിലേക്കും അവനെ പുറത്തുകൊണ്ടുവരണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പട്ടണകവാടം പൊതുസ്ഥലമായിരുന്നു; അവിടെ പ്രാദേശിക മൂപ്പന്മാർ നിയമകാര്യങ്ങൾ കേൾക്കുമായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: 'അല്ലെങ്കിൽ: “അവന്റെ പട്ടണത്തിന്റെ കവാടത്തിലേക്ക്.” എബ്രായപാഠത്തിൽ: “അവന്റെ സ്ഥലത്തിന്റെ കവാടത്തിലേക്ക്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: അവനെ പിടിച്ച്
  rationale: תפשׂ എന്ന ക്രിയയും ב എന്ന ഉപസർഗവും ചേർന്ന് ഒരാളെ ശാരീരികമായി ഉറച്ചുപിടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അവനെ പിടിച്ച്’ എന്നത് ബലപ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אָבִיו וְאִמּוֹ
  choice: അവന്റെ അപ്പനും അമ്മയും
  rationale: എബ്രായപാഠം അപ്പനെയും അമ്മയെയും പ്രത്യേകം ഉടമസ്ഥപ്രത്യയങ്ങളോടെ പരാമർശിക്കുന്നു. ഈ രൂപം ഇരുവരും ചേർന്ന് പ്രവർത്തിക്കുന്നുവെന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: കൊണ്ടുപോകണം
  rationale: Hiphil രൂപത്തിലുള്ള יצא ഒരാളെ പുറത്തേക്കു കൊണ്ടുവരുക അല്ലെങ്കിൽ കൊണ്ടുപോകുക എന്നർഥം നൽകുന്നു. ഇവിടെ വീട്ടിൽനിന്ന് പൊതുന്യായവേദിയായ കവാടത്തിലേക്കുള്ള നീക്കം ലക്ഷ്യസ്ഥാനത്തോടൊപ്പം വ്യക്തമാകുന്നതിനാൽ ‘കൊണ്ടുപോകണം’ സ്വാഭാവികമാണ്.
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: അവന്റെ പട്ടണത്തിലെ മൂപ്പന്മാരുടെ അടുക്കൽ
  rationale: זקני העיר പ്രാദേശിക സമൂഹത്തിന്റെ നേതാക്കളും ന്യായകാര്യങ്ങൾ കേൾക്കുന്നവരുമായ മൂപ്പന്മാരെ സൂചിപ്പിക്കുന്ന പതിവുപദപ്രയോഗമാണ്. ‘പട്ടണത്തിലെ മൂപ്പന്മാർ’ അതിന്റെ സാമൂഹികവും നിയമപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: അവൻ താമസിക്കുന്ന സ്ഥലത്തിന്റെ കവാടത്തിങ്കലേക്ക്
  rationale: מקום അക്ഷരാർഥത്തിൽ ‘സ്ഥലം’ എന്നാണ്; സന്ദർഭത്തിൽ അത് അവൻ പാർക്കുന്ന പ്രാദേശിക സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘അവൻ താമസിക്കുന്ന സ്ഥലത്തിന്റെ കവാടം’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുകയും മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശ ശൈലി സ്വീകരിച്ചു. ‘മൂപ്പന്മാർ’, ‘കവാടം’ എന്നീ ബൈബിൾ-സാംസ്കാരിക പദങ്ങൾ വ്യക്തതയ്ക്കായി നിലനിർത്തി; കവാടത്തിന്റെ നിയമപരമായ പങ്ക് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
