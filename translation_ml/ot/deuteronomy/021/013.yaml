revisions:
- from: അവൾ തന്റെ മേലുള്ള തടവുകാരിയുടെ വസ്ത്രം[a] അഴിച്ചുമാറ്റി നിന്റെ വീട്ടിൽ താമസിച്ച്, തന്റെ അപ്പനെയും അമ്മയെയും ഓർത്ത് ഒരു മാസം മുഴുവൻ കരയട്ടെ. അതിനുശേഷം നിനക്ക് അവളുടെ അടുക്കൽ ചെല്ലാം; നീ അവളുടെ ഭർത്താവാകുകയും അവൾ നിന്റെ ഭാര്യയാകുകയും ചെയ്യും.
  to: അവൾ തന്റെ മേലുള്ള അവളുടെ തടവിന്റെ വസ്ത്രം[a] അഴിച്ചുമാറ്റി നിന്റെ വീട്ടിൽ താമസിച്ച്, തന്റെ അപ്പനെയും അമ്മയെയും ഓർത്ത് ഒരു മാസം മുഴുവൻ കരയട്ടെ. അതിനുശേഷം നിനക്ക് അവളുടെ അടുക്കൽ ചെല്ലാം; നീ അവളുടെ ഭർത്താവാകുകയും അവൾ നിന്റെ ഭാര്യയാകുകയും ചെയ്യും.
  rationale: The sole revision replaces a Malayalam possessive expression that narrows the Hebrew genitive with one that preserves the source wording and its interpretive uncertainty. The footnote now supplies the former rendering as a possible alternative rather than presenting it as the primary sense. No change has been made to the legal, sexual, or marital sequence.
