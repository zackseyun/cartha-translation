id: DEU.21.13
reference: Deuteronomy 21:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵסִ֩ירָה֩ אֶת שִׂמְלַ֨ת שִׁבְיָ֜/הּ מֵ/עָלֶ֗י/הָ וְ/יָֽשְׁבָה֙ בְּ/בֵיתֶ֔/ךָ וּ/בָֽכְתָ֛ה אֶת אָבִ֥י/הָ וְ/אֶת אִמָּ֖/הּ יֶ֣רַח יָמִ֑ים וְ/אַ֨חַר כֵּ֜ן תָּב֤וֹא אֵלֶ֨י/הָ֙ וּ/בְעַלְתָּ֔/הּ וְ/הָיְתָ֥ה לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: ml
  text: അവൾ തന്റെ മേലുള്ള അവളുടെ തടവിന്റെ വസ്ത്രം[a] അഴിച്ചുമാറ്റി നിന്റെ വീട്ടിൽ താമസിച്ച്, തന്റെ അപ്പനെയും അമ്മയെയും ഓർത്ത് ഒരു മാസം മുഴുവൻ കരയട്ടെ. അതിനുശേഷം നിനക്ക് അവളുടെ അടുക്കൽ ചെല്ലാം; നീ അവളുടെ ഭർത്താവാകുകയും അവൾ നിന്റെ ഭാര്യയാകുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തടവുകാരിയുടെ വസ്ത്രം’ അല്ലെങ്കിൽ ‘പിടിക്കപ്പെട്ടപ്പോൾ അവൾ ധരിച്ചിരുന്ന വസ്ത്രം.’
    reason: שִׂמְלַת שִׁבְיָהּ എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവളുടെ തടവിന്റെ വസ്ത്രം’ എന്നാണ്; അത് തടവുകാരി എന്ന നിലയുമായി ബന്ധപ്പെട്ട വസ്ത്രത്തെയോ പിടിക്കപ്പെട്ടപ്പോൾ അവൾ ധരിച്ചിരുന്ന വസ്ത്രത്തെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וְהֵסִירָה
  choice: അഴിച്ചുമാറ്റി
  rationale: ഹിഫിൽ രൂപം നീക്കിക്കളയുക എന്ന അർഥം നൽകുന്നു; വസ്ത്രത്തെ സംബന്ധിച്ച് ‘അഴിച്ചുമാറ്റുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: שִׂמְלַת שִׁבְיָהּ
  choice: തടവുകാരിയുടെ വസ്ത്രം
  rationale: ‘അവളുടെ തടവിന്റെ വസ്ത്രം’ എന്ന എബ്രായ ഘടനയുടെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; പിടിക്കപ്പെട്ടപ്പോൾ ധരിച്ചിരുന്ന വസ്ത്രമോ തടവുകാരി എന്ന നിലയുമായി ബന്ധപ്പെട്ട വസ്ത്രമോ എന്ന സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מֵעָלֶיהָ
  choice: തന്റെ മേലുള്ള
  rationale: അക്ഷരാർഥമായ ‘അവളുടെ മേൽനിന്ന്’ എന്ന ആശയം മലയാളത്തിൽ വസ്ത്രം അഴിക്കുന്ന സന്ദർഭത്തിന് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: നിന്റെ വീട്ടിൽ താമസിച്ച്
  rationale: ישב എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ താമസിക്കുക/കഴിയുക എന്ന അർഥം നിയമസന്ദർഭത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּבָכְתָה
  choice: കരയട്ടെ
  rationale: മൂലക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കരയുക’ എന്നാണ്; മാതാപിതാക്കളെ ഓർത്തുള്ള ദുഃഖാചരണത്തിന്റെ സന്ദർഭം വാക്യം തന്നെ വ്യക്തമാക്കുന്നു.
- source_word: אֶת אָבִיהָ וְאֶת אִמָּהּ
  choice: തന്റെ അപ്പനെയും അമ്മയെയും ഓർത്ത്
  rationale: ‘കരയുക’ എന്ന ക്രിയയോടുള്ള നേരിട്ടുള്ള കർമങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ഓർത്ത്’ ചേർക്കുന്നു; നഷ്ടം സംഭവിച്ചുവെന്ന് അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
- source_word: יֶרַח יָמִים
  choice: ഒരു മാസം മുഴുവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളുടെ ഒരു മാസം’; പൂർണമായ ഒരു മാസകാലം എന്ന പ്രയോഗാർത്ഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תָּבֹא אֵלֶיהָ
  choice: നിനക്ക് അവളുടെ അടുക്കൽ ചെല്ലാം
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി നേരിട്ട് വിശദീകരിച്ചു കടുപ്പിക്കാതെയും വെറും വിവാഹം എന്നാക്കി മൃദൂകരിക്കാതെയും സംരക്ഷിക്കുന്നു; ‘നിനക്ക് ... ചെല്ലാം’ നിയമപരമായ അനുമതി പ്രകടമാക്കുന്നു.
- source_word: וּבְעַלְתָּהּ
  choice: നീ അവളുടെ ഭർത്താവാകുകയും
  rationale: בעל എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ ഭർത്താവിന്റെ നിലയിലാകുക എന്ന അർഥം ഉടമസ്ഥതാഭാവം ഇറക്കുമതി ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: അവൾ നിന്റെ ഭാര്യയാകുകയും ചെയ്യും
  rationale: വിവാഹബന്ധത്തിലെ പുതിയ നില വ്യക്തമാക്കുന്ന എബ്രായ സൂത്രവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യുദ്ധത്തടവുകാരിയുമായുള്ള വിവാഹനിയമത്തിലെ ലൈംഗികവും വിവാഹപരവുമായ ഭാഷ
  choice: ‘അവളുടെ അടുക്കൽ ചെല്ലാം’ എന്ന ശൈലിയും തുടർന്ന് ഭർത്താവും ഭാര്യയും ആകുന്ന നിലയും വേർതിരിച്ച് നിലനിർത്തി.
  alternative: മുഴുവനും ‘അവളെ വിവാഹം കഴിക്കാം’ എന്നു ചുരുക്കുക; അല്ലെങ്കിൽ ‘അവളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടാം’ എന്നു തുറന്നുപറയുക.
  rationale: മൂലപാഠം അടുക്കൽ ചെല്ലുന്നതും ഭർത്താവാകുന്നതും അവൾ ഭാര്യയാകുന്നതും വേർതിരിച്ചാണ് പറയുന്നത്. ഈ ഘടന നിലനിർത്തുന്നത് വാക്യത്തെ പ്രണയാത്മകമായി മൃദൂകരിക്കാതെയും എബ്രായം പറയുന്നതിലപ്പുറം കടുപ്പിക്കാതെയും നിയമപരവും നൈതികവുമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമവിവരണ ശൈലി. ‘അപ്പൻ’, ‘അമ്മ’ എന്നിവ കുടുംബബന്ധത്തിന്റെ സ്വാഭാവിക ഭാവം നിലനിർത്തുന്നു; ലൈംഗിക ശൈലി മൃദൂകരിക്കാതെയും അനാവശ്യമായി തുറന്നുപറയാതെയും സംരക്ഷിച്ചിരിക്കുന്നു.
