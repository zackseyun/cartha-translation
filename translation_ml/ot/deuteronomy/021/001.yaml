- issue: חָלָל എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: കൊല്ലപ്പെട്ട ഒരു പുരുഷൻ
  alternative: കൊല്ലപ്പെട്ട ഒരാൾ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായ പുല്ലിംഗ ഏകവചനം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു; നിയമത്തിന്റെ പ്രയോഗം തിരിച്ചറിയപ്പെടാത്ത കൊലപാതകത്തെ പൊതുവായി സംബന്ധിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
