source:
  edition: WLC
  text: וְ/הָיָ֣ה הָ/עִ֔יר הַ/קְּרֹבָ֖ה אֶל הֶ/חָלָ֑ל וְ/לָֽקְח֡וּ זִקְנֵי֩ הָ/עִ֨יר הַ/הִ֜וא עֶגְלַ֣ת בָּקָ֗ר אֲשֶׁ֤ר לֹֽא עֻבַּד֙ בָּ֔/הּ אֲשֶׁ֥ר לֹא מָשְׁכָ֖ה בְּ/עֹֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: ml
  text: അങ്ങനെ, കൊല്ലപ്പെട്ടവനോട് ഏറ്റവും അടുത്തുള്ള പട്ടണം ഏതാണ് എങ്കിൽ, ആ പട്ടണത്തിലെ മൂപ്പന്മാർ കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന്, ഇതുവരെ വേലയ്ക്ക് ഉപയോഗിച്ചിട്ടില്ലാത്തതും നുകം ഇട്ട് വലിച്ചിട്ടില്ലാത്തതുമായ ഒരു പെൺപശുക്കിടാവിനെ എടുക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്യാതെ നിയമനിർദേശത്തിന്റെ തുടർച്ചയായി സ്വാഭാവിക വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: ഈ സന്ദർഭത്തിലെ ഹീബ്രു സൂത്രവാക്യം അടുത്ത നടപടിയെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അപ്പോൾ സംഭവിക്കേണ്ടത്’ എന്നു പദശഃ ചേർക്കുന്നത് അസ്വാഭാവികമായതിനാൽ നിർദേശരൂപത്തിലൂടെ അതിന്റെ പ്രവർത്തനം നിലനിർത്തി.
- source_word: הָעִיר הַקְּרֹבָה אֶל הֶחָלָל
  choice: കൊല്ലപ്പെട്ടവനോട് ഏറ്റവും അടുത്തുള്ള പട്ടണം
  rationale: חָלָל കൊല്ലപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്നു; ‘കൊല്ലപ്പെട്ടവൻ’ വ്യക്തിസൂചന നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ താരതമ്യത്തിലുള്ള ഏറ്റവും അടുത്ത പട്ടണമെന്ന അർഥവും വ്യക്തമാക്കി.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: പട്ടണത്തിലെ മൂപ്പന്മാർ
  rationale: പട്ടണത്തിന്റെ അംഗീകൃത സാമൂഹിക-ന്യായനേതാക്കളെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും ഗ്രാഹ്യവുമായ മലയാളപ്രയോഗം.
- source_word: עֶגְלַת בָּקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു പശുക്കിടാവ്
  rationale: עֶגְלָה ചെറുപ്പമായ പെൺകന്നുകാലിയെയും בָּקָר കന്നുകാലിവർഗത്തെയോ കൂട്ടത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ഉറവിടബന്ധം ‘കൂട്ടത്തിൽനിന്ന്’ എന്നു നൽകി; ലിംഗവിശദീകരണം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: ഇതുവരെ വേലയ്ക്ക് ഉപയോഗിച്ചിട്ടില്ലാത്തത്
  rationale: മൃഗത്തെ ഉപയോഗിച്ച് ജോലി ചെയ്തിട്ടില്ലെന്ന ഉപകരണാർഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: നുകത്തിൽ കെട്ടി വലിച്ചിട്ടില്ലാത്തത്
  rationale: משך എന്നത് ‘വലിക്കുക’ എന്നാണ്; നുകം ചുമന്നിട്ടില്ല എന്നതിലുപരി വലിവേലയ്ക്ക് ഉപയോഗിച്ചിട്ടില്ലെന്ന കൃത്യമായ ആശയം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമനിർദേശശൈലി. സാങ്കേതികത ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ ‘വേലയ്ക്ക് ഉപയോഗിക്കുക’, ‘നുകത്തിൽ കെട്ടി വലിക്കുക’ എന്നീ പ്രയോഗങ്ങൾ സ്വീകരിച്ചു.
