revisions:
- from: കൊല്ലപ്പെട്ടവനോട് ഏറ്റവും അടുത്തുള്ള പട്ടണത്തിലെ മൂപ്പന്മാർ, ഇതുവരെ വേലയ്ക്ക് ഉപയോഗിച്ചിട്ടില്ലാത്തതും നുകത്തിൽ കെട്ടി വലിച്ചിട്ടില്ലാത്തതുമായ ഒരു പശുക്കിടാവിനെ[a] കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് എടുക്കണം.
  to: അങ്ങനെ, കൊല്ലപ്പെട്ടവനോട് ഏറ്റവും അടുത്തുള്ള പട്ടണം ഏതാണ് എങ്കിൽ, ആ പട്ടണത്തിലെ മൂപ്പന്മാർ കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന്, ഇതുവരെ വേലയ്ക്ക് ഉപയോഗിച്ചിട്ടില്ലാത്തതും നുകം ഇട്ട് വലിച്ചിട്ടില്ലാത്തതുമായ ഒരു പെൺപശുക്കിടാവിനെ എടുക്കണം.
  rationale: 'The revision retains the legal-procedural transition, explicitly identifies the elders with the nearest city, and moves the feminine specification inherent in עֶגְלַת into the text. The wording remains idiomatic modern standard Malayalam and preserves the source’s two distinct qualifications: never used for work and never having drawn under a yoke.'
