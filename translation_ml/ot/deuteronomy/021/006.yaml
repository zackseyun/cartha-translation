source:
  edition: WLC
  text: וְ/כֹ֗ל זִקְנֵי֙ הָ/עִ֣יר הַ/הִ֔וא הַ/קְּרֹבִ֖ים אֶל הֶ/חָלָ֑ל יִרְחֲצוּ֙ אֶת יְדֵי/הֶ֔ם עַל הָ/עֶגְלָ֖ה הָ/עֲרוּפָ֥ה בַ/נָּֽחַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/006.yaml
  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: ml
  text: കൊല്ലപ്പെട്ടയാളുടെ സമീപത്തുള്ള ആ പട്ടണത്തിലെ എല്ലാ മൂപ്പന്മാരും, നീർച്ചാലിൽ കഴുത്തൊടിക്കപ്പെട്ട പെൺകിടാവിന്മേൽ തങ്ങളുടെ കൈകൾ കഴുകണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൊല്ലപ്പെട്ടവന്റെ മൃതദേഹത്തിന്റെ സമീപത്തുള്ള.’ എബ്രായപദം കൊല്ലപ്പെട്ട ഒരാളെയോ കൊല്ലപ്പെട്ടവന്റെ മൃതദേഹത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘താഴ്‌വരയിൽ’ അല്ലെങ്കിൽ ‘അരുവിപ്പടുകയിൽ.’ എബ്രായപദം ജലധാരയോടു ബന്ധപ്പെട്ട താഴ്‌വരയെയോ, കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന നീർച്ചാലിനെയോ അതിന്റെ പടുകയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: എല്ലാ
  rationale: വാക്യത്തിലെ ബന്ധകമായ וְ നടപടിക്രമത്തിന്റെ തുടർച്ച വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യബന്ധം കൊണ്ടുതന്നെ അത് സൂചിപ്പിക്കപ്പെടുന്നതിനാൽ പ്രത്യേകമായി ‘പിന്നെ’ ചേർക്കാതെ כֹל എന്നതിന്റെ സമഗ്രത ‘എല്ലാ’ എന്നു നിലനിർത്തി.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: ആ പട്ടണത്തിലെ ... മൂപ്പന്മാർ
  rationale: זִקְנֵי എന്നത് സമൂഹത്തിലെ മുതിർന്ന പൗരനേതാക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മൂപ്പന്മാർ’ എന്നു നൽകി. ഇവിടെ עִיר ജനവാസകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ ‘പട്ടണം’ സ്വാഭാവികമാണ്; הַהִוא എന്ന നിർദ്ദേശകത ‘ആ’ എന്നു നിലനിർത്തി.
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: കൊല്ലപ്പെട്ടവനോട് ഏറ്റവും അടുത്തുള്ള
  rationale: קָרוֹב ... אֶל സ്ഥലപരമായ സാമീപ്യം സൂചിപ്പിക്കുന്നു. חָלָל കൊല്ലപ്പെട്ട ഒരാളെയോ അയാളുടെ മൃതദേഹത്തെയോ സൂചിപ്പിക്കാം; പ്രധാന പാഠത്തിൽ കൊലപാതകസന്ദർഭം വ്യക്തമാക്കുന്ന ‘കൊല്ലപ്പെട്ടവൻ’ സ്വീകരിക്കുകയും വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: തങ്ങളുടെ കൈകൾ കഴുകണം
  rationale: നിയമനടപടിയിലെ നിർദേശാത്മക imperfect-ന്റെ ബാധ്യത ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കാൻ ‘കഴുകണം’ ഉപയോഗിച്ചു.
- source_word: עַל
  choice: മേൽ
  rationale: ആചാരപരമായി മൃഗത്തിന്മീതെ/മുകളിൽ കൈ കഴുകുന്നതെന്ന സ്ഥാനബന്ധം ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָעֶגְלָה
  choice: പശുക്കിടാവ്
  rationale: עֶגְלָה ഇളം പെൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ ‘പശുക്കിടാവ്’ തെരഞ്ഞെടുത്തു; സന്ദർഭത്തിൽ പെൺലിംഗം ഈ രൂപത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളപ്പെടുന്നു.
- source_word: הָעֲרוּפָה
  choice: കഴുത്തൊടിക്കപ്പെട്ട
  rationale: ערף ഇവിടെ സാധാരണ അറുക്കലല്ല, കഴുത്ത് ഒടിക്കുന്ന പ്രത്യേക ആചാരനടപടിയാണ് സൂചിപ്പിക്കുന്നത്. ‘തലവെട്ടപ്പെട്ട’ എന്നു പറഞ്ഞാൽ മൂർച്ചയുള്ള ആയുധത്താൽ ശിരഛേദം ചെയ്തെന്ന തെറ്റായ ധാരണ വരാം.
- source_word: בַנָּחַל
  choice: താഴ്‌വരയിൽ
  rationale: נַחַל താഴ്‌വര, നീർച്ചാൽ, അല്ലെങ്കിൽ കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന അരുവിപ്പടുക എന്നിവ സൂചിപ്പിക്കാം. സ്വാഭാവികമായ പ്രധാന പാഠത്തിനായി ‘താഴ്‌വര’ സ്വീകരിച്ച് ഭൂപ്രകൃതിയുടെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
