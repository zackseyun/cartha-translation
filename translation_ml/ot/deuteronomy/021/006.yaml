translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ നിയമ-ആചാര രജിസ്റ്റർ. ‘കഴുകണം’ നിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം നിലനിർത്തുന്നു; അപൂർവമായ ഭൂപ്രകൃതി പദം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി അതിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
