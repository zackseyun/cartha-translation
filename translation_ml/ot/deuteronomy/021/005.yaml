revisions:
- from: ലേവിയുടെ പുത്രന്മാരായ പുരോഹിതന്മാർ മുന്നോട്ടുവരണം. കാരണം, നിന്റെ ദൈവമായ യഹോവ തന്നെ ശുശ്രൂഷിക്കാനും യഹോവയുടെ നാമത്തിൽ അനുഗ്രഹിക്കാനും അവരെയാണ് തിരഞ്ഞെടുത്തിരിക്കുന്നത്. എല്ലാ തർക്കത്തിന്റെയും എല്ലാ ക്ഷതത്തിന്റെയും[a] തീർപ്പ് അവരുടെ വാക്കനുസരിച്ചായിരിക്കണം.
