source:
  edition: WLC
  text: וְ/נִגְּשׁ֣וּ הַ/כֹּהֲנִים֮ בְּנֵ֣י לֵוִי֒ כִּ֣י בָ֗/ם בָּחַ֞ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שָׁ֣רְת֔/וֹ וּ/לְ/בָרֵ֖ךְ בְּ/שֵׁ֣ם יְהוָ֑ה וְ/עַל פִּי/הֶ֥ם יִהְיֶ֖ה כָּל רִ֥יב וְ/כָל נָֽגַע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: ml
  text: ലേവിയുടെ പുത്രന്മാരായ പുരോഹിതന്മാർ മുന്നോട്ടുവരും. കാരണം, നിന്റെ ദൈവമായ യഹോവ തന്നെ ശുശ്രൂഷിക്കാനും യഹോവയുടെ നാമത്തിൽ അനുഗ്രഹിക്കാനും അവരെയാണ് തിരഞ്ഞെടുത്തിരിക്കുന്നത്. എല്ലാ തർക്കവും എല്ലാ പരിക്കും[a] അവരുടെ വാക്കനുസരിച്ച് തീർപ്പാക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരിക്ക്’ എന്നതിന് ‘പ്രഹരം,’ ‘ബാധ,’ അല്ലെങ്കിൽ ‘വ്യാധി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് വിശാലമായ അർഥമുണ്ടെങ്കിലും ഈ നിയമസന്ദർഭത്തിൽ ശരീരഹാനി ഉൾപ്പെട്ട കേസുകളെയാകാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: മുന്നോട്ടുവരണം
  rationale: നിഗ്ഗശു എന്ന ക്രിയ ഇവിടെ ഔദ്യോഗികമായ നിയമ-ആചാര നടപടിയിൽ പുരോഹിതന്മാർ പങ്കുചേരാൻ അടുത്തുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘മുന്നോട്ടുവരണം’ ആ ഔദ്യോഗിക ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാരായ പുരോഹിതന്മാർ
  rationale: എബ്രായത്തിലെ സമാനാധികരണ ഘടനയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: כִּי בָם בָּחַר
  choice: കാരണം ... അവരെയാണ് തിരഞ്ഞെടുത്തിരിക്കുന്നത്
  rationale: כִּי കാരണം അവതരിപ്പിക്കുന്നു; ദൈവത്തിന്റെ മുൻകാല തിരഞ്ഞെടുപ്പിന്റെ നിലനിൽക്കുന്ന ഫലം മലയാളത്തിലെ പൂർത്തികാലരൂപം വ്യക്തമാക്കുന്നു. בָם എന്നതിലെ ഊന്നൽ ‘അവരെയാണ്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവ
  rationale: വെളിപ്പെടുത്തപ്പെട്ട ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ഉടമ്പടി സൂത്രവാക്യത്തിന്റെ വ്യക്തിപരമായ ഏകവചന രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לְשָׁרְתוֹ
  choice: തന്നെ ശുശ്രൂഷിക്കാനും
  rationale: שרת പുരോഹിതസന്ദർഭത്തിൽ വിശുദ്ധ സേവനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ശുശ്രൂഷിക്കുക’ അനുയോജ്യം; ‘തന്നെ’ എന്നത് ദൈവത്തെ സൂചിപ്പിക്കുന്ന പ്രത്യയത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: യഹോവയുടെ നാമത്തിൽ അനുഗ്രഹിക്കാനും
  rationale: ദൈവിക അധികാരത്തിൽ പുരോഹിതന്മാർ അനുഗ്രഹം പ്രസ്താവിക്കുന്നതിനെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: וְעַל פִּיהֶם
  choice: അവരുടെ വാക്കനുസരിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ വായിന്മേൽ’ എന്ന പ്രയോഗം അധികാരപൂർവമായ വാക്കിനെയോ വിധിയെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വാക്കനുസരിച്ച്’ ആ ഭാഷാചിത്രവും നിയമപരമായ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: יִהְיֶה כָּל רִיב וְכָל נָגַע
  choice: എല്ലാ തർക്കത്തിന്റെയും എല്ലാ ക്ഷതത്തിന്റെയും തീർപ്പ് ... ആയിരിക്കണം
  rationale: എബ്രായത്തിൽ പ്രത്യക്ഷമായി പറയാത്ത വിധി/തീർപ്പ് എന്ന ആശയം നിയമസന്ദർഭത്തിൽ മലയാളത്തിന് ആവശ്യമായ വിധത്തിൽ പൂരിപ്പിക്കുന്നു; അതേസമയം നിർണയാധികാരം പുരോഹിതരുടെ വാക്കിനാണെന്ന ഘടന നിലനിർത്തുന്നു.
- source_word: כָּל רִיב
  choice: എല്ലാ തർക്കം
  rationale: רִיב നിയമപരമായ വിവാദമോ തർക്കമോ സൂചിപ്പിക്കുന്നു; ‘തർക്കം’ വിശാലവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: וְכָל נָגַע
  choice: എല്ലാ ക്ഷതം
  rationale: נֶגַע പ്രഹരം, ക്ഷതം, ബാധ എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാല പദമാണ്. ഈ നിയമസന്ദർഭത്തിൽ ‘ക്ഷതം’ ശരീരഹാനിയുടെ സാധ്യത വ്യക്തമാക്കുകയും ‘ആക്രമണം’ എന്ന അതിസങ്കുചിത വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണമായ ‘യഹോവ’ ആ ഉടമ്പടിനാമത്തെ മറയ്ക്കാതെ നിലനിർത്തുന്നു.
- issue: പുരോഹിതരുടെ വിധിനിർണയാധികാരത്തിന്റെ സ്വഭാവം
  choice: തീർപ്പ് അവരുടെ വാക്കനുസരിച്ചായിരിക്കണം
  alternative: അവർ എല്ലാ തർക്കവും ക്ഷതവും തീർപ്പാക്കണം
  rationale: עַל־פִּיהֶם എന്നത് അവരുടെ അധികാരപൂർവമായ പ്രസ്താവനയ്ക്ക് അനുസൃതമായി കാര്യം നിശ്ചയിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. പുരോഹിതന്മാരെ ഏക നിർവാഹകരായി കൂടുതൽ വ്യക്തമായി അവതരിപ്പിക്കാതെ മൂലത്തിലെ ഔദ്യോഗിക അധികാരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരവും ആചാരപരവുമായ ഭാവം നിലനിർത്തുമ്പോൾ അനാവശ്യമായ സംസ്കൃതഭാരവും പഴയ ശൈലിയും ഒഴിവാക്കി.
