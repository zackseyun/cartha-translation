source:
  edition: WLC
  text: לֹא תָלִ֨ין נִבְלָת֜/וֹ עַל הָ/עֵ֗ץ כִּֽי קָב֤וֹר תִּקְבְּרֶ֨/נּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי קִלְלַ֥ת אֱלֹהִ֖ים תָּל֑וּי וְ/לֹ֤א תְטַמֵּא֙ אֶת אַדְמָ֣תְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: ml
  text: അവന്റെ ശവം മരത്തിന്മേൽ രാത്രി മുഴുവൻ വെച്ചിരിക്കരുത്; അന്നുതന്നെ നീ അവനെ തീർച്ചയായും അടക്കം ചെയ്യണം; കാരണം, തൂക്കപ്പെട്ടവൻ ദൈവത്തിന്റെ ശാപത്തിൻ കീഴിലാണ്[a]. നിന്റെ ദൈവമായ യഹോവ നിനക്കു അവകാശമായി നൽകുന്ന ദേശത്തെ നീ അശുദ്ധമാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, “തൂക്കപ്പെട്ടവൻ ദൈവത്താൽ ശപിക്കപ്പെട്ടവനാണ്”; മറ്റൊരു സാധ്യത: “തൂക്കിയിടൽ ദൈവത്തോടുള്ള അപമാനമാണ്.” എബ്രായ പ്രയോഗം സംക്ഷിപ്തമായതിനാൽ അതിനെ ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָלִין
  choice: രാത്രി മുഴുവൻ കിടക്കരുത്
  rationale: לון എന്ന ക്രിയയുടെ രാത്രിയിലുടനീളം ശേഷിക്കുക എന്ന കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נִבְלָתוֹ
  choice: അവന്റെ ശവം
  rationale: മരിച്ച ശരീരത്തെ സൂചിപ്പിക്കുന്ന נְבֵלָה എന്ന പദത്തിന്റെ കൃത്യവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പരിഭാഷ.
- source_word: עַל הָעֵץ
  choice: മരത്തിന്മേൽ
  rationale: עֵץ എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മരം’ നിലനിർത്തുകയും പിൽക്കാല ബൈബിൾ പ്രതിധ്വനികൾ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: അവനെ അടക്കം ചെയ്യണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ക്രിയയും ചേർന്നുള്ള നിർബന്ധാത്മക ഊന്നൽ മലയാളത്തിലെ ശക്തമായ ‘ചെയ്യണം’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നുതന്നെ
  rationale: രാത്രിയാകുന്നതിനു മുമ്പ് അതേ ദിവസം അടക്കം ചെയ്യണമെന്ന ആശയം സ്വാഭാവികമായും കൃത്യമായും വ്യക്തമാക്കുന്നു.
- source_word: קִלְלַת אֱלֹהִים
  choice: ദൈവത്തിന്റെ ശാപത്തിൻ കീഴിൽ
  rationale: സംക്ഷിപ്തവും വ്യാഖ്യാനഭേദമുള്ളതുമായ എബ്രായ പ്രയോഗത്തെ പ്രധാന വായനയിൽ ദൈവശാപത്തിന് വിധേയനായ അവസ്ഥയായി അവതരിപ്പിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: תָלוּי
  choice: തൂക്കപ്പെട്ടവൻ
  rationale: ‘തൂക്കിയിടപ്പെട്ട’ എന്ന നിഷ്ക്രിയ പങ്കാളിത്തരൂപത്തിന്റെ ഏകവചന വ്യക്തിസൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: תְטַמֵּא
  choice: അശുദ്ധമാക്കരുത്
  rationale: טמא എന്ന പദത്തിലുള്ള ആചാരപരവും ധാർമികവുമായ മലിനീകരണസൂചനകൾ ഉൾക്കൊള്ളുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: אַדְמָתְךָ
  choice: ദേശത്തെ
  rationale: അവകാശമായി നൽകപ്പെടുന്ന ഭൂവിഭാഗത്തിന്റെ ഉടമ്പടിപരമായ പശ്ചാത്തലത്തിൽ ‘ദേശം’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: נַחֲלָה
  choice: അവകാശമായി
  rationale: പാരമ്പര്യമായി ലഭിക്കുന്ന കൈവശം എന്ന ഉടമ്പടിപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: כִּי קִלְלַת אֱלֹהִים תָּלוּי എന്നതിന്റെ അർഥം
  choice: തൂക്കപ്പെട്ടവൻ ദൈവത്തിന്റെ ശാപത്തിൻ കീഴിലാണ്
  alternative: ‘തൂക്കപ്പെട്ടവൻ ദൈവത്താൽ ശപിക്കപ്പെട്ടവനാണ്’ അല്ലെങ്കിൽ ‘തൂക്കിയിടൽ ദൈവത്തോടുള്ള നിന്ദയാണ്’
  rationale: എബ്രായ ഘടന അതിസംക്ഷിപ്തവും ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാവുന്നതുമാണ്. പ്രധാന പാഠം തൂക്കപ്പെട്ട വ്യക്തി ദൈവശാപത്തിന്റെ അടയാളം വഹിക്കുന്നു എന്ന സന്ദർഭോചിതമായ വായന നൽകുന്നു; വ്യാകരണപരവും ദൈവശാസ്ത്രപരവുമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘തീർച്ചയായും അടക്കം ചെയ്യണം’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപം ഒഴിവാക്കി, നിർബന്ധാത്മക ഊന്നൽ ‘അടക്കം ചെയ്യണം’ എന്നതിൽ പ്രകടമാക്കി. ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
