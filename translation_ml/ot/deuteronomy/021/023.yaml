review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the corpse, overnight prohibition, same-day burial, land defilement, divine name, and inheritance. A small revision is warranted because the Hebrew explicitly marks both the burial rationale and the final consequence with conjunctions; adding “കാരണം” makes the causal relationship clear. The emphatic infinitive absolute in קָבוֹר תִּקְבְּרֶנּוּ is also represented more fully by “തീർച്ചയായും … അടക്കം ചെയ്യണം.”
  naturalness: The revised wording uses natural modern standard Malayalam legal prose. “വെച്ചിരിക്കരുത്” is more idiomatic for prohibiting a corpse from being left overnight than wording that treats the corpse itself as the active bearer of the prohibition.
  terminology: “ശവം,” “മരത്തിന്മേൽ,” “തൂക്കപ്പെട്ടവൻ,” “അശുദ്ധമാക്കരുത്,” “ദേശം,” “അവകാശമായി,” and “യഹോവ” are appropriate. The terse and disputed phrase קִלְלַת אֱלֹהִים תָּלוּי remains represented by the contextual main reading, while alternatives are retained in the footnote.
  issues:
  - severity: low
    issue: The causal connector following the burial command is absent from the main text.
    rationale: כִּי introduces the reason for prompt burial. Without “കാരണം,” the statement about the hanged person can read as an unconnected assertion rather than the stated rationale.
  - severity: low
    issue: The emphatic force of קָבוֹר תִּקְבְּרֶנּוּ is somewhat understated.
    rationale: “അടക്കം ചെയ്യണം” expresses obligation, but adding “തീർച്ചയായും” more clearly reflects the infinitive absolute plus finite verb without becoming unnatural.
  revised_text: അവന്റെ ശവം മരത്തിന്മേൽ രാത്രി മുഴുവൻ വെച്ചിരിക്കരുത്; അന്നുതന്നെ നീ അവനെ തീർച്ചയായും അടക്കം ചെയ്യണം; കാരണം, തൂക്കപ്പെട്ടവൻ ദൈവത്തിന്റെ ശാപത്തിൻ കീഴിലാണ്[a]. നിന്റെ ദൈവമായ യഹോവ നിനക്കു അവകാശമായി നൽകുന്ന ദേശത്തെ നീ അശുദ്ധമാക്കരുത്.
