  text: כִּֽי תִהְיֶ֨יןָ לְ/אִ֜ישׁ שְׁתֵּ֣י נָשִׁ֗ים הָ/אַחַ֤ת אֲהוּבָה֙ וְ/הָ/אַחַ֣ת שְׂנוּאָ֔ה וְ/יָֽלְדוּ ל֣/וֹ בָנִ֔ים הָ/אֲהוּבָ֖ה וְ/הַ/שְּׂנוּאָ֑ה וְ/הָיָ֛ה הַ/בֵּ֥ן הַ/בְּכ֖וֹר לַ/שְּׂנִיאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: ml
  text: ഒരു പുരുഷന് രണ്ടു ഭാര്യമാർ ഉണ്ടെങ്കിൽ, ഒരുവൾ സ്നേഹിക്കപ്പെട്ടവളും മറ്റവൾ സ്നേഹിക്കപ്പെടാത്തവളും[a] ആയിരിക്കുകയും, സ്നേഹിക്കപ്പെട്ടവളും സ്നേഹിക്കപ്പെടാത്തവളും അവന് പുത്രന്മാരെ പ്രസവിക്കുകയും, ആദ്യജാതനായ പുത്രൻ സ്നേഹിക്കപ്പെടാത്ത ഭാര്യയ്ക്കു ജനിച്ചവനായിരിക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെറുക്കപ്പെട്ടവളും.” എബ്രായപദത്തിന് ഈ ശക്തമായ അർഥവും വരാം; എന്നാൽ ഇവിടെ സ്നേഹിക്കപ്പെട്ട ഭാര്യയ്ക്കു വിരുദ്ധമായി മുൻഗണന ലഭിക്കാത്ത ഭാര്യയെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ഉണ്ടെങ്കിൽ
  rationale: ഇത് ഒരു നിയമപരമായ സാങ്കൽപ്പിക സാഹചര്യം നിബന്ധനാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എങ്കിൽ’ അതിന്റെ വ്യവസ്ഥാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תִהְיֶיןָ לְאִישׁ
  choice: ഒരു പുരുഷന് ... ഉണ്ടെങ്കിൽ
  rationale: എബ്രായത്തിലെ അസ്തിത്വപ്രയോഗമായ ‘ഒരു പുരുഷന് ഉണ്ടായിരിക്കുക’ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: שְׁתֵּי נָשִׁים
  choice: രണ്ടു ഭാര്യമാർ
  rationale: അവകാശനിയമത്തിന്റെ ഈ സന്ദർഭത്തിൽ נָשִׁים എന്നത് പൊതുവായി സ്ത്രീകളെയല്ല, ഭാര്യമാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הָאַחַת אֲהוּבָה
  choice: ഒരുവൾ സ്നേഹിക്കപ്പെട്ടവൾ
  rationale: അഹൂവാ എന്ന നിഷ്ക്രിയ വിശേഷണത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘പ്രിയപ്പെട്ടവൾ’ എന്നത് മുൻഗണന എന്ന വ്യാഖ്യാനം കൂടുതൽ ശക്തമാക്കാം.
- source_word: וְהָאַחַת שְׂנוּאָה
  choice: മറ്റവൾ സ്നേഹിക്കപ്പെടാത്തവൾ
  rationale: ഈ കുടുംബനിയമസന്ദർഭത്തിലെ വൈരുദ്ധ്യജോടി സ്വാഭാവികമായി നൽകുന്നു; അതേസമയം ‘വെറുക്കപ്പെട്ടവൾ’ എന്ന ശക്തമായ പദാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: അവന് പുത്രന്മാരെ പ്രസവിക്കുകയും
  rationale: בָנִים എന്നതിന്റെ പുരുഷലിംഗസൂചനയും ആദ്യജാതപുത്രനെ സംബന്ധിച്ച നിയമസന്ദർഭവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: הָאֲהוּבָה וְהַשְּׂנוּאָה
  choice: സ്നേഹിക്കപ്പെട്ടവളും സ്നേഹിക്കപ്പെടാത്തവളും
  rationale: രണ്ടു ഭാര്യമാരും പുത്രന്മാരെ പ്രസവിച്ചുവെന്ന എബ്രായവാക്യത്തിന്റെ സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר
  choice: ആദ്യജാതനായ പുത്രൻ ... ആയിരിക്കുകയും
  rationale: നിയമസാഹചര്യത്തിലെ അടുത്ത വ്യവസ്ഥയായി വരുന്ന സാഹചര്യപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ചയായി നൽകുന്നു.
- source_word: לַשְּׂנִיאָה
  choice: സ്നേഹിക്കപ്പെടാത്ത ഭാര്യയുടേതായിരിക്കുകയും
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ബന്ധം ഇവിടെ മാതൃത്വബന്ധമായി വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന നിബന്ധനാരൂപവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുടുംബനിയമസന്ദർഭത്തിൽ שְׂנוּאָה എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: സ്നേഹിക്കപ്പെടാത്തവൾ
  alternative: വെറുക്കപ്പെട്ടവൾ; കുറച്ച് സ്നേഹിക്കപ്പെട്ടവൾ
  rationale: ഈ എബ്രായപദത്തിന് ‘വെറുക്കപ്പെട്ടവൾ’ എന്ന ശക്തമായ അർഥം ഉണ്ടാകാം. എന്നാൽ സ്നേഹിക്കപ്പെട്ട ഭാര്യയോടുള്ള വൈരുദ്ധ്യത്തിൽ ഇത് മുൻഗണന ലഭിക്കാത്തതോ സ്നേഹിക്കപ്പെടാത്തതോ ആയ ഭാര്യയെ സൂചിപ്പിക്കാം. മുഖ്യപാഠം സന്ദർഭത്തിന് യോജിച്ച മിതമായ അർഥം നൽകുകയും അടിക്കുറിപ്പ് യഥാർഥമായ ശക്തമായ സാധ്യത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ നിയമശൈലി. ‘ആദ്യജാതനായ പുത്രൻ’, ‘പുത്രന്മാർ’ എന്നീ പദങ്ങൾ അവകാശനിയമസന്ദർഭത്തിലെ കൃത്യതയ്ക്കായി ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ നിബന്ധന പൂർത്തിയാകാത്തതായി സൂചിപ്പിക്കുന്ന കോമ നിലനിർത്തി.
