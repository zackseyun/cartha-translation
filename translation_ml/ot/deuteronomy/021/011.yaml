  source_fidelity: 'The draft correctly represents the sequence: seeing a woman among the captives, desiring her, and taking her as a wife. However, “സ്വീകരിക്കുക” (‘receive/accept’) softens the concrete Hebrew marriage idiom לָקַח ... לְאִשָּׁה (‘take ... as a wife’).'
