  terminology: “മോഹിക്കുക” appropriately conveys the strong desire of חָשַׁק without euphemism. “നിനക്കു ഭാര്യയായി എടുക്കുക” retains the Hebrew idiom and its ‘for yourself’ nuance more closely than “നിനക്കുവേണ്ടി ... സ്വീകരിക്കുക.”
