source:
  edition: WLC
  text: וְ/רָאִיתָ֙ בַּ/שִּׁבְיָ֔ה אֵ֖שֶׁת יְפַת תֹּ֑אַר וְ/חָשַׁקְתָּ֣ בָ֔/הּ וְ/לָקַחְתָּ֥ לְ/ךָ֖ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/011.yaml
  text: and you see among the captives a woman beautiful in form[a], and you desire her and take her for yourself as a wife[b],
translation:
  language: ml
  text: അപ്പോൾ തടവുകാരുടെ കൂട്ടത്തിൽ സുന്ദരമായ രൂപമുള്ള ഒരു സ്ത്രീയെ നീ കാണുകയും[a] അവളെ മോഹിക്കുകയും അവളെ നിനക്കു ഭാര്യയായി എടുക്കുകയും ചെയ്താൽ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സുന്ദരമായ കാഴ്ചയുള്ള ഒരു സ്ത്രീയെ.’
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അവളെ നിനക്കു ഭാര്യയായി എടുക്കുക’; വിവാഹം കഴിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רָאִיתָ בַּ/שִּׁבְיָה
  choice: തടവുകാരുടെ കൂട്ടത്തിൽ ... നീ കാണുകയും
  rationale: യുദ്ധത്തിൽ പിടിക്കപ്പെട്ടവരുടെ സമൂഹത്തെയാണ് שִׁבְיָה സൂചിപ്പിക്കുന്നത്. നിയമവാക്യത്തിന്റെ സോപാധിക പ്രവാഹം നിലനിർത്താൻ ക്രിയകളെ ‘ചെയ്യുകയും ... ചെയ്താൽ’ എന്ന ഘടനയിൽ ചേർത്തു.
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: അഴകുള്ള രൂപമുള്ള ഒരു സ്ത്രീയെ
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ ബാഹ്യരൂപത്തിനുള്ള ഊന്നൽ വെറും ‘സുന്ദരിയായ സ്ത്രീ’ എന്നു ചുരുക്കാതെ നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമാകാൻ ‘അഴകുള്ള രൂപമുള്ള’ എന്നു നൽകി.
- source_word: וְ/חָשַׁקְתָּ בָהּ
  choice: അവളെ മോഹിച്ച്
  rationale: חָשַׁק എന്ന ക്രിയയിലെ ശക്തമായ ആഗ്രഹം ‘ഇഷ്ടപ്പെട്ട്’ എന്നതിലേക്കു മയപ്പെടുത്താതെ ‘മോഹിച്ച്’ എന്നു വ്യക്തമാക്കി.
- source_word: וְ/לָקַחְתָּ לְ/ךָ לְ/אִשָּׁה
  choice: നിനക്കുവേണ്ടി ഭാര്യയായി സ്വീകരിക്കുകയും
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘നിനക്കായി ഭാര്യയായി എടുക്കുക’ എന്ന വിവാഹസംബന്ധിയായ പ്രയോഗം ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായി നൽകി; לְךָയുടെ സ്വപ്രയോജനസൂചനയും നിലനിർത്തി.
theological_decisions:
- issue: ധാർമ്മികമായി പ്രയാസമുള്ള യുദ്ധകാല നിയമവിവരണം മയപ്പെടുത്തുകയോ മൂലപാഠത്തിലില്ലാത്ത വിധിനിർണയം ചേർക്കുകയോ ചെയ്യാതിരിക്കുക
  choice: പുരുഷന്റെ മോഹവും സ്ത്രീയെ ഭാര്യയായി സ്വീകരിക്കുന്നതും നേരിട്ട് രേഖപ്പെടുത്തുക
  alternative: ‘അവളെ ഭാര്യയായി തിരഞ്ഞെടുക്കുക’ എന്നു മയപ്പെടുത്തുകയോ നിർബന്ധം/അംഗീകാരം സംബന്ധിച്ച വിശദീകരണം വാക്യത്തിൽ ചേർക്കുകയോ ചെയ്യുക
  rationale: വാക്യം യുദ്ധകാല സാഹചര്യത്തെ വിലയിരുത്തുന്ന അധികഭാഷയില്ലാതെ വിവരിക്കുന്നു. അതിനാൽ അതിലെ നൈതിക സംഘർഷം പരിഭാഷയിൽ പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന സോപാധിക നിയമത്തിന്റെ തുടർച്ചയായതിനാൽ ‘അപ്പോൾ ... ചെയ്താൽ’ എന്ന ഘടന ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
