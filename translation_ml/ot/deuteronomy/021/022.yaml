  yaml_path: translation/ot/deuteronomy/021/022.yaml
  text: And if in a man there is a sin deserving death[a], and he is put to death, and you hang him on a tree[b],
translation:
  language: ml
  text: ഒരു മനുഷ്യനിൽ മരണശിക്ഷ അർഹിക്കുന്ന പാപം[a] ഉണ്ടായിരിക്കുകയും, അവൻ വധിക്കപ്പെടുകയും, നീ അവനെ ഒരു മരത്തിന്മേൽ[b] തൂക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മരണത്തിന് അർഹമായ” അല്ലെങ്കിൽ “മരണവിധിക്കു കീഴിലുള്ള.” ഹീബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “മരണത്തിന്റെ വിധി/ന്യായം ഉള്ള പാപം” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഒരു തൂണിന്മേൽ” അല്ലെങ്കിൽ “ഒരു കഴുമരത്തിന്മേൽ.” ഹീബ്രായയിൽ അക്ഷരാർഥത്തിൽ “ഒരു മരത്തിന്മേൽ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: ഉണ്ടായിരിക്കുകയും … ചെയ്താൽ
  rationale: വാവിനോടുകൂടിയ വ്യവസ്ഥാസൂചകമായ כִּיയെ മലയാളത്തിലെ സ്വാഭാവിക നിയമവാക്യഘടനയിൽ വ്യവസ്ഥയായി അവതരിപ്പിക്കുന്നു; വാക്യത്തിന്റെ തുടർച്ചയും നിലനിർത്തുന്നു.
- source_word: יִהְיֶה בְ/אִישׁ
  choice: ഒരു മനുഷ്യനിൽ … ഉണ്ടായിരിക്കുകയും
  rationale: ഹീബ്രായയിലെ അസ്തിത്വപ്രയോഗവും בְ എന്ന ഉപസർഗവും കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു. אִישׁ എന്ന പുല്ലിംഗ ഏകവചന നിയമവിഷയം ‘ഒരു മനുഷ്യൻ’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
- source_word: חֵטְא
  choice: പാപം
  rationale: ധാർമ്മികവും നിയമപരവുമായ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു; ‘കുറ്റം’ എന്നു മാത്രം പറഞ്ഞ് ആശയം ചുരുക്കുന്നില്ല.
- source_word: מִשְׁפַּט מָוֶת
  choice: മരണശിക്ഷ അർഹിക്കുന്ന
  rationale: അക്ഷരാർഥത്തിൽ ‘മരണത്തിന്റെ ന്യായവിധി/വിധി’ എന്ന ദുഷ്കരമായ സംയുക്തപ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. ശിക്ഷാർഹതയും മരണവിധിയും ഉൾക്കൊള്ളുന്ന മൂലത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְ/הוּמָת
  choice: അവനെ കൊന്നശേഷം
  rationale: Hophal രൂപത്തിലെ ‘അവൻ കൊല്ലപ്പെടുന്നു/മരണത്തിന് ഏല്പിക്കപ്പെടുന്നു’ എന്ന നിഷ്ക്രിയ ആശയം മലയാളത്തിലെ സാഹചര്യസഹജമായ പ്രയോഗത്തിൽ നൽകുന്നു; തുടർന്നുള്ള തൂക്കൽ മരണത്തിനു ശേഷമാണെന്ന ഹീബ്രായ ക്രമം വ്യക്തമാക്കുന്നു, എന്നാൽ ‘വധശിക്ഷ നടപ്പാക്കുക’ എന്ന കൂടുതൽ സാങ്കേതിക പദം ഒഴിവാക്കുന്നു.
- source_word: וְ/תָלִיתָ אֹת/וֹ
  choice: നീ അവനെ … തൂക്കുകയും ചെയ്താൽ
  rationale: תלה എന്ന ക്രിയയുടെ ‘തൂക്കുക’ എന്ന അടിസ്ഥാനാർഥവും രണ്ടാം പുരുഷ ഏകവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: עַל עֵץ
  choice: ഒരു മരത്തിന്മേൽ
  rationale: עֵץ എന്നതിന്റെ സാധാരണ അർഥമായ ‘മരം’ നിലനിർത്തി, ‘കഴുമരം’ പോലുള്ള കൂടുതൽ നിർദ്ദിഷ്ടമായ ചരിത്രപുനർനിർമാണം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: നിയമവിഷയത്തിന്റെ ലിംഗസൂചന
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരാൾ / ഒരു വ്യക്തി
  rationale: אִישׁ പുല്ലിംഗ ഏകവചനമാണ്. അതിനാൽ മൂലത്തിലെ ലിംഗസൂചന നീക്കം ചെയ്യാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- issue: עַל עֵץ എന്ന പ്രയോഗം
  choice: ഒരു മരത്തിന്മേൽ
  alternative: ഒരു കഴുമരത്തിന്മേൽ / ഒരു മരക്കുറ്റിയിന്മേൽ
  rationale: ഹീബ്രായയിലെ ‘മരം/തടി’ എന്ന വിശാലപദം നിലനിർത്തുകയും, വധോപകരണത്തിന്റെ രൂപത്തെക്കുറിച്ചുള്ള ഒരു നിർദ്ദിഷ്ട വ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു; പിന്നീടുള്ള തിരുവെഴുത്ത് പ്രതിധ്വനിക്കും ഇടം നൽകുന്നു.
- issue: മരണവും തൂക്കലും തമ്മിലുള്ള ക്രമം
  choice: അവനെ കൊന്നശേഷം … തൂക്കുകയും
  alternative: അവനെ മരണശിക്ഷയ്ക്കു വിധിച്ച് … തൂക്കുകയും
  rationale: וְהוּמָת എന്നത് അവൻ കൊല്ലപ്പെട്ടതായി പറയുന്നു; തുടർന്ന് തൂക്കൽ വരുന്നു. അതിനാൽ തൂക്കലാണ് മരണരീതി എന്നു നിർബന്ധമായി വ്യാഖ്യാനിക്കാതെ സംഭവക്രമം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്ന വ്യവസ്ഥാവാക്യമായി നിലനിർത്തിയിരിക്കുന്നു. മുഖ്യവാചകം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും ഹീബ്രായയിലെ നിയമപരവും ധാർമ്മികവുമായ അർത്ഥതീവ്രതയും ‘മരം’ എന്ന പദത്തിന്റെ വിശാലതയും സംരക്ഷിക്കുന്നു.
