  text: וְ/הָיָ֞ה אִם לֹ֧א חָפַ֣צְתָּ בָּ֗/הּ וְ/שִׁלַּחְתָּ/הּ֙ לְ/נַפְשָׁ֔/הּ וּ/מָכֹ֥ר לֹא תִמְכְּרֶ֖/נָּה בַּ/כָּ֑סֶף לֹא תִתְעַמֵּ֣ר בָּ֔/הּ תַּ֖חַת אֲשֶׁ֥ר עִנִּיתָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: ml
  text: എന്നാൽ നിനക്ക് അവളെ ഇഷ്ടമില്ലെങ്കിൽ, അവളെ അവളുടെ ഇഷ്ടപ്രകാരം പോകാൻ അനുവദിക്കണം.[a] പണത്തിനുവേണ്ടി അവളെ വിൽക്കരുത്—ഒരിക്കലും വിൽക്കരുത്. അവളെ ചരക്കുപോലെ കണക്കാക്കി ചൂഷണം ചെയ്യരുത്,[b] കാരണം നീ അവളെ അപമാനിച്ചിരിക്കുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “അവളെ സ്വതന്ത്രയായി പോകാൻ അനുവദിക്കണം.” അക്ഷരാർഥം: “അവളെ അവൾക്കുതന്നെ അയയ്ക്കണം.”'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ലാഭത്തിനായി അവളെ ചൂഷണം ചെയ്യരുത്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ അപൂർവമാണ്; ഒരാളെ സാമ്പത്തിക നേട്ടത്തിനുള്ള വസ്തുവായി ഉപയോഗിക്കുക എന്ന ആശയം അതിനുണ്ടാകാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “നീ അവളെ ലൈംഗികമായി പീഡിപ്പിച്ചിരിക്കുന്നു.” സന്ദർഭമനുസരിച്ച് എബ്രായപദത്തിന് പീഡിപ്പിക്കുക, അപമാനിക്കുക, അല്ലെങ്കിൽ ലൈംഗികമായി ലംഘിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻനിയമത്തിന്റെ തുടർച്ചയിലുള്ള വ്യവസ്ഥയും ആശയവൈരുധ്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לֹא חָפַצְתָּ בָּהּ
  choice: നിനക്ക് അവളിൽ ഇഷ്ടമില്ലെങ്കിൽ
  rationale: חפץ എന്ന പദത്തിന്റെ ഇഷ്ടം, താത്പര്യം, ആഗ്രഹം എന്നീ വ്യക്തിപരമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ഇനി’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: അവളെ അവളുടെ ഇഷ്ടപ്രകാരം പോകാൻ അനുവദിക്കണം
  rationale: അക്ഷരാർഥത്തിൽ ‘അവളെ അവൾക്കുതന്നെ അയയ്ക്കുക’ എന്ന പ്രയോഗം അവളെ സ്വതന്ത്രയായി, സ്വന്തം തീരുമാനപ്രകാരം പോകാൻ വിടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: പണത്തിനുവേണ്ടി അവളെ വിൽക്കരുത്—ഒരിക്കലും വിൽക്കരുത്
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്നുള്ള എബ്രായ ഊന്നൽ ആവർത്തനത്തിലൂടെ വ്യക്തമാക്കുന്നു; כֶּסֶף ഇവിടെ സ്വാഭാവികമായി ‘പണം’ എന്നാണ്.
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: അവളെ ചരക്കുപോലെ കണക്കാക്കി ചൂഷണം ചെയ്യരുത്
  rationale: അപൂർവമായ עמר എന്ന ക്രിയയുടെ വാണിജ്യപരവും ആധിപത്യപരവുമായ ചൂഷണഭാവം, വിൽപ്പനാനിരോധനത്തോടുള്ള സമാന്തരതയിൽ, വ്യക്തമായി പകരുന്നു.
- source_word: תַּחַת אֲשֶׁר
  choice: കാരണം
  rationale: നിരോധനത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ഈ ഘടനയ്ക്ക് ലളിതവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: עִנִּיתָהּ
  choice: നീ അവളെ അപമാനിച്ചിരിക്കുന്നു
  rationale: പീഡിപ്പിക്കുക, അപമാനിക്കുക, ലൈംഗികമായി ലംഘിക്കുക എന്നിവ ഉൾക്കൊള്ളാവുന്ന ענה എന്ന പദത്തിന്റെ സന്ദർഭഗൗരവം നിലനിർത്തുന്നു; പ്രധാനവാക്യത്തിൽ അതിനെ ഒരൊറ്റ സാങ്കേതിക അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ബന്ദിയാക്കപ്പെട്ട സ്ത്രീയെ സംബന്ധിച്ച നിയമത്തിന്റെ ധാർമിക പ്രാബല്യം
  choice: ലൈംഗിക/വൈവാഹിക ബന്ധത്തിനു ശേഷം സ്ത്രീയുടെ മേലുള്ള പുരുഷന്റെ അധികാരം നിയന്ത്രിക്കുകയും അവളെ വിൽക്കുന്നതും സാമ്പത്തികമായി ചൂഷണം ചെയ്യുന്നതും വിലക്കുകയും ചെയ്യുന്ന വിധത്തിൽ വാക്യം പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് പരസ്പരസമ്മതത്തോടെയുള്ള വിവാഹമോചനം മാത്രമാണെന്നോ, പ്രധാനവാക്യത്തിൽ തന്നെ പ്രവൃത്തിയെ ബലാത്സംഗം എന്ന് നിർവചിച്ചോ പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം സ്ത്രീയുടെ മോചനത്തെ നിർദേശിക്കുകയും, അവൾക്കുണ്ടാക്കിയ അപമാനം/ലംഘനം കാരണം അവളെ ചരക്കാക്കുന്നത് വിലക്കുകയും ചെയ്യുന്നു. അതിനാൽ ബലപ്രയോഗസന്ദർഭത്തെ മൃദൂകരിക്കാതെയും എബ്രായപദം വ്യക്തമാക്കുന്നതിലധികം നിർദിഷ്ടമാക്കാതെയും അതിന്റെ ധാർമിക സംഘർഷവും ഗൗരവവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള നിയമഭാഷ ഉപയോഗിച്ചു. സ്ത്രീയുടെ വ്യക്തിപരമായ സ്വാതന്ത്ര്യം വ്യക്തമാക്കാൻ ‘അവളുടെ ഇഷ്ടപ്രകാരം’ എന്നും, അപൂർവക്രിയയിലെ സാമ്പത്തിക വസ്തുവൽക്കരണവും ചൂഷണവും ഒരുമിച്ച് അറിയിക്കാൻ ‘ചരക്കുപോലെ കണക്കാക്കി ചൂഷണം’ എന്നും തിരഞ്ഞെടുത്തു. എല്ലാ പാഠക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
