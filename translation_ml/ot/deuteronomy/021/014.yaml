  to: എന്നാൽ നിനക്ക് അവളെ ഇഷ്ടമില്ലെങ്കിൽ, അവളെ അവളുടെ ഇഷ്ടപ്രകാരം പോകാൻ അനുവദിക്കണം.[a] പണത്തിനുവേണ്ടി അവളെ വിൽക്കരുത്—ഒരിക്കലും വിൽക്കരുത്. അവളെ ചരക്കുപോലെ കണക്കാക്കി ചൂഷണം ചെയ്യരുത്,[b] കാരണം നീ അവളെ അപമാനിച്ചിരിക്കുന്നു.[c]
