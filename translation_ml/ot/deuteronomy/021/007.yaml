source:
  edition: WLC
  text: וְ/עָנ֖וּ וְ/אָמְר֑וּ יָדֵ֗י/נוּ לֹ֤א שפכה אֶת הַ/דָּ֣ם הַ/זֶּ֔ה וְ/עֵינֵ֖י/נוּ לֹ֥א רָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/007.yaml
  text: Then they shall answer and say[a], ‘Our hands did not shed this blood[b], and our eyes did not see it.’
translation:
  language: ml
  text: 'അപ്പോൾ അവർ മറുപടിയായി ഇങ്ങനെ പറയണം: “ഞങ്ങളുടെ കൈകൾ ഈ രക്തം[a] ചൊരിഞ്ഞിട്ടില്ല; ഞങ്ങളുടെ കണ്ണുകൾ അതു കണ്ടിട്ടില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “ഈ രക്തം.” കൊലപാതകത്തിന്റെ ഉത്തരവാദിത്വം നിഷേധിക്കുന്ന നിയമപരമായ ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അതിനു സാക്ഷികളായിട്ടില്ല.” എബ്രായത്തിലെ “ഞങ്ങളുടെ കണ്ണുകൾ കണ്ടിട്ടില്ല” എന്ന മൂർത്തമായ പ്രയോഗം ദൃക്സാക്ഷിയായുള്ള അറിവിനെ നിഷേധിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: അപ്പോൾ അവർ മറുപടിയായി ഇങ്ങനെ പറയണം
  rationale: നിയമപരമായ നടപടിയിലെ തുടർച്ചയും ഔപചാരികമായ വാചികപ്രതികരണവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. രണ്ട് എബ്രായ ക്രിയകളുടെയും സംയുക്തപ്രയോഗം വാക്കിന് വാക്കായി ആവർത്തിച്ച് അസ്വാഭാവികമാക്കാതെ അർഥം നിലനിർത്തുന്നു.
- source_word: יָדֵינוּ
  choice: ഞങ്ങളുടെ കൈകൾ
  rationale: കൊലപാതകത്തിലെ നേരിട്ടുള്ള ഉത്തരവാദിത്വത്തെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ ശരീരാവയവഭാഷ എബ്രായത്തിലെപ്പോലെ നിലനിർത്തുന്നു.
- source_word: לֹא שָׁפְכָה אֶת־הַדָּם הַזֶּה
  choice: ഈ രക്തം ചൊരിഞ്ഞിട്ടില്ല
  rationale: שפך דם എന്നത് ‘രക്തം ചൊരിയുക’ എന്ന കൊലപാതകസംബന്ധിയായ സ്ഥിരപ്രയോഗമാണ്. ‘ഈ രക്തം’ എന്ന മൂർത്തമായ നിയമഭാഷയെ ‘ഈ കൊലപാതകം’ എന്നു വ്യാഖ്യാനിച്ചു മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: ഞങ്ങളുടെ കണ്ണുകൾ അതു കണ്ടിട്ടുമില്ല
  rationale: ദൃക്സാക്ഷിയായുള്ള അറിവ് നിഷേധിക്കുന്ന ശരീരാവയവഭാഷ നിലനിർത്തുന്നു. മലയാളത്തിൽ വാക്യം വ്യക്തമാകാൻ ‘അതു’ ചേർത്തിരിക്കുന്നു; സന്ദർഭത്തിലെ കൊലപാതകത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
