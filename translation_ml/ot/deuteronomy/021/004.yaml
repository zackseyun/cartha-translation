id: DEU.21.4
reference: Deuteronomy 21:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הוֹרִ֡דוּ זִקְנֵי֩ הָ/עִ֨יר הַ/הִ֤וא אֶת הָֽ/עֶגְלָה֙ אֶל נַ֣חַל אֵיתָ֔ן אֲשֶׁ֛ר לֹא יֵעָבֵ֥ד בּ֖/וֹ וְ/לֹ֣א יִזָּרֵ֑עַ וְ/עָֽרְפוּ שָׁ֥ם אֶת הָ/עֶגְלָ֖ה בַּ/נָּֽחַל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: ml
  text: പിന്നെ ആ പട്ടണത്തിലെ മൂപ്പന്മാർ ആ പെൺകിടാവിനെ, കൃഷി ചെയ്യുകയോ വിത്ത് വിതയ്ക്കുകയോ ചെയ്യാത്ത, വറ്റാത്ത ഒഴുക്കുള്ള ഒരു തോട്ടിലേക്ക്[a] താഴേക്കു കൊണ്ടുപോകണം. അവിടെ, ആ തോട്ടിൽവെച്ച് അവർ പെൺകിടാവിന്റെ കഴുത്തൊടിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്ഥിരൊഴുക്കുള്ള ഒരു തോട്ടിലേക്ക്” അല്ലെങ്കിൽ “വറ്റാത്ത ഒഴുക്കുള്ള ഒരു മലയിടുക്കിലേക്ക്.” എബ്രായപ്രയോഗമായ נַחַל אֵיתָן വറ്റാത്ത ഒഴുക്കുള്ള തോടിനെയോ മലയിടുക്കിനെയോ സൂചിപ്പിച്ചേക്കാം; ‘ഉറച്ചതോ പരുക്കനായതോ ആയ താഴ്‌വര’ എന്നും വ്യാഖ്യാനിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: נַחַל אֵיתָן എന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗത്തിന്റെ യഥാർഥ സൂചനയിൽ നിലനിൽക്കുന്ന പദാർഥപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: കൊണ്ടുപോകണം
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘താഴേക്കു കൊണ്ടുപോകുക’ എന്ന കാരണാർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ലക്ഷ്യസ്ഥാനമായ തോട് താഴ്ന്ന പ്രദേശമാണെന്ന ആശയം വാക്യഘടനയിൽ അന്തർലീനമാണ്.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: ആ പട്ടണത്തിലെ മൂപ്പന്മാർ
  rationale: നിയമപരമായ പശ്ചാത്തലത്തിൽ പട്ടണത്തിന്റെ ഉത്തരവാദിത്വമുള്ള മുതിർന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പതിവുമായ പ്രയോഗം.
- source_word: הָעֶגְלָה
  choice: പശുക്കിടാവ്
  rationale: ഇത് ചെറുപ്പമായ പെൺകന്നുകാലിയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘പശുക്കിടാവ്’ ലിംഗവും ജീവിവർഗവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶל נַחַל אֵיתָן
  choice: വറ്റാത്ത നീരൊഴുക്കുള്ള ഒരു തോട്ടിലേക്ക്
  rationale: נחל എന്നത് തോട്, നീർച്ചാൽ, അല്ലെങ്കിൽ മലയിടുക്ക് സൂചിപ്പിക്കാം; איתן ഇവിടെ നിലനിൽക്കുന്ന, വറ്റാത്ത ഒഴുക്കിനെ സൂചിപ്പിക്കാമെന്ന സാധ്യത പ്രധാനപാഠത്തിൽ വായനാസൗകര്യത്തോടെ നൽകുന്നു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ
  choice: കൃഷിചെയ്യുകയോ വിത്തുവിതയ്ക്കുകയോ ചെയ്യാത്ത
  rationale: രണ്ട് നിഷേധിത കൃഷിക്രിയകളെയും സംക്ഷിപ്തമായ സമാന്തര ഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְעָרְפוּ
  choice: കഴുത്തൊടിക്കണം
  rationale: പൊതുവായ ‘കൊല്ലുക’ എന്നതിനു പകരം ഈ പ്രത്യേക അനുഷ്ഠാനക്രിയയായ കഴുത്തൊടിക്കൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בַּנָּחַל
  choice: ആ തോട്ടിൽവെച്ച്
  rationale: മുമ്പ് പറഞ്ഞ נחל എന്ന സ്ഥലത്തെ ആവർത്തിച്ചു വ്യക്തമാക്കുകയും ക്രിയ നടന്ന സ്ഥലം കൃത്യമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
