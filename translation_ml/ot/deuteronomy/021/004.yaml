  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ നിയമപാഠത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘തോട്’ എന്ന പരിചിതപദം പ്രധാനപാഠത്തിൽ ഉപയോഗിച്ച് ഭൂമിശാസ്ത്രപരമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
