source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּבַעֵ֛ר הַ/דָּ֥ם הַ/נָּקִ֖י מִ/קִּרְבֶּ֑/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: ml
  text: അങ്ങനെ നിരപരാധിയുടെ രക്തം നിങ്ങളുടെ ഇടയിൽനിന്ന് നീക്കിക്കളയണം[a]; കാരണം, യാഹ്‌വേയുടെ ദൃഷ്ടിയിൽ ശരിയായതു നിങ്ങൾ ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിരപരാധിയുടെ രക്തം നിങ്ങളുടെ ഇടയിൽനിന്ന് അകറ്റണം.’ ‘നിരപരാധിയുടെ രക്തം’ എന്ന എബ്രായ പ്രയോഗം, പരിഹരിക്കപ്പെടാതെ കിടക്കുന്ന രക്തച്ചൊരിച്ചിലിനുള്ള സമൂഹത്തിന്റെ കുറ്റബാധ്യതയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: അങ്ങനെ ... നിങ്ങൾ
  rationale: വാവ് സംയോജകവും ഊന്നൽ നൽകുന്ന സ്വതന്ത്ര സർവനാമവും ചേർന്ന് മുൻനിർദേശത്തിന്റെ നിഗമനം സൂചിപ്പിക്കുന്നു. ‘അങ്ങനെ’ ആ വ്യവഹാരബലം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഏകവചന അഭിസംബോധന സമൂഹമായ ഇസ്രായേലിനോടായതിനാൽ മലയാളത്തിൽ ‘നിങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: תְּבַעֵר
  choice: നീക്കിക്കളയണം
  rationale: ആവർത്തനപുസ്തകത്തിലെ നിയമസന്ദർഭങ്ങളിൽ പീയേൽ രൂപത്തിലുള്ള בער സമൂഹത്തിനിടയിൽനിന്ന് തിന്മയെയോ രക്തക്കുറ്റത്തെയോ പൂർണമായി അകറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നീക്കിക്കളയണം’ നിർദേശാത്മകതയും സമ്പൂർണമായ നീക്കവും വ്യക്തമാക്കുന്നു.
- source_word: הַ/דָּם הַ/נָּקִי
  choice: നിരപരാധിയുടെ രക്തം
  rationale: പദശഃ ‘നിരപരാധമായ രക്തം.’ മലയാളത്തിൽ ‘നിരപരാധിയുടെ രക്തം’ സ്വാഭാവികവും നിയമ-ധാർമികമായ രക്തച്ചൊരിച്ചിലിന്റെ ദൃശ്യബിംബം നിലനിർത്തുന്നതുമാണ്; സമൂഹത്തിന്മേൽ ശേഷിക്കാവുന്ന രക്തക്കുറ്റം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: מִ/קִּרְבֶּךָ
  choice: നിങ്ങളുടെ ഇടയിൽനിന്ന്
  rationale: ആവർത്തനപുസ്തകത്തിൽ പതിവായി കാണുന്ന സമൂഹപരവും ന്യായവിധിസംബന്ധവുമായ പ്രയോഗം. ‘നിങ്ങളുടെ ഇടയിൽനിന്ന്’ അതിന്റെ സാമൂഹിക പരിധി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഇവിടെ כִּי മുൻ നിർദേശത്തിനുള്ള കാരണമോ അടിസ്ഥാനമോ അവതരിപ്പിക്കുന്നു. ‘കാരണം’ ആ ബന്ധം തുറന്നുകാട്ടുന്നു; ‘എപ്പോൾ’ എന്ന സാദ്ധ്യതയിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: תַעֲשֶׂה
  choice: നിങ്ങൾ ചെയ്യണം
  rationale: നിയമനിർദേശത്തിലെ അപൂർണക്രിയാരൂപത്തിന് ബാധ്യതാസൂചകമായ ബലം ഉണ്ട്. ആ നിർദേശാത്മക സ്വരം ‘ചെയ്യണം’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הַ/יָּשָׁר
  choice: ശരിയായതു
  rationale: വിശേഷണം ഇവിടെ നാമവാചകമായി പ്രവർത്തിക്കുന്നു. നൈതികസന്ദർഭത്തിൽ ‘ശരിയായതു’ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ളതുമാണ്.
- source_word: בְּ/עֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തൽ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്. ‘ദൃഷ്ടിയിൽ’ എന്നത് രൂപകം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളം നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദിവ്യനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. ഒരു പൊതുപദവിയാൽ മാറ്റാതെ ഉടമ്പടിനാമം വ്യക്തിനാമമായി നിലനിർത്താൻ ‘യഹോവ’ ഉപയോഗിച്ചു.
- issue: ‘നിരപരാധിയുടെ രക്തം’ എന്ന പ്രയോഗത്തിലെ സമൂഹത്തിന്റെ ഉത്തരവാദിത്വം
  choice: മുഖ്യപാഠത്തിൽ രക്തത്തിന്റെ ദൃശ്യബിംബം നിലനിർത്തി, രക്തക്കുറ്റത്തിന്റെ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി
  alternative: ‘നിരപരാധിയെ കൊന്നതിന്റെ രക്തക്കുറ്റം’ എന്ന് മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് നൽകുക
  rationale: הַדָּם הַנָּקִי എന്നത് രക്തത്തെയും അതിനോടനുബന്ധിച്ച കുറ്റബാധ്യതയെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ‘രക്തം’ നിലനിർത്തുന്നത് മൂലത്തിലെ യഥാർഥമായ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും മുൻകൂട്ടി തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ നിയമനിർദേശ ശൈലി ഉപയോഗിച്ചു. ഇസ്രായേലിനെ ഏകസമൂഹമായി അഭിസംബോധന ചെയ്യുന്ന എബ്രായ ഏകവചനം മലയാളത്തിൽ സ്വാഭാവികമായ ‘നിങ്ങൾ’ എന്ന രൂപത്തിൽ നൽകി. വാക്യത്തിലെ രക്തത്തിന്റെ നിയമ-ധാർമിക ദൃശ്യബിംബം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ സൂക്ഷിച്ചു.
