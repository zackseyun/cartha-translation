source:
  edition: WLC
  text: כִּֽי תֵצֵ֥א לַ/מִּלְחָמָ֖ה עַל אֹיְבֶ֑י/ךָ וּ/נְתָנ֞/וֹ יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/יָדֶ֖/ךָ וְ/שָׁבִ֥יתָ שִׁבְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/010.yaml
  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
translation:
  language: ml
  text: നീ നിന്റെ ശത്രുക്കൾക്കെതിരെ യുദ്ധത്തിന് പുറപ്പെടുമ്പോൾ, നിന്റെ ദൈവമായ യഹോവ അവരെ[a] നിന്റെ കൈയിൽ ഏൽപ്പിക്കുകയും, നീ അവരിൽനിന്ന് തടവുകാരെ പിടിച്ചെടുക്കുകയും[b] ചെയ്യുമ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ, “അവനെ/അതിനെ നിന്റെ കൈയിൽ ഏൽപ്പിക്കുമ്പോൾ” എന്നാണ്. ഏകവചന പ്രത്യയം ശത്രുസേനയെ ഒരു കൂട്ടമായി സൂചിപ്പിക്കുന്നതായിരിക്കാം; അതിനാലാണ് ഇവിടെ “അവരെ” എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “നീ അവന്റെ/അതിന്റെ തടവുകാരെ പിടിച്ചെടുക്കുകയും.” ഹീബ്രുവിൽ തടവിലാക്കുക എന്ന ക്രിയയും തടവുകാർ എന്ന നാമവും ഒരേ ധാതുവിൽനിന്നുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: പുറപ്പെടുമ്പോൾ
  rationale: നിയമത്തിലെ ഒരു സാഹചര്യത്തെ അവതരിപ്പിക്കുന്നതിനാൽ വ്യവസ്ഥാസൂചകമായ ‘എങ്കിൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ‘-ുമ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: תֵצֵא לַמִּלְחָמָה
  choice: യുദ്ധത്തിനു പുറപ്പെടുമ്പോൾ
  rationale: ‘പുറപ്പെടുക’ എന്ന മൂലചിത്രവും സൈനികസന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל אֹיְבֶיךָ
  choice: നിന്റെ ശത്രുക്കൾക്കെതിരെ
  rationale: ശത്രുതാപരമായ പ്രവർത്തനത്തോടൊപ്പമുള്ള עַל എന്ന പദത്തിന്റെ അർഥം ‘എതിരെ’ എന്നാണ്.
- source_word: וּנְתָנוֹ
  choice: അവരെ ... ഏല്പിക്കുകയും
  rationale: ഹീബ്രുവിൽ പ്രത്യയം ഏകവചനമാണെങ്കിലും ബഹുവചനമായ ‘ശത്രുക്കൾ’ എന്ന കൂട്ടത്തെ സമഷ്ടിയായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; ഉടമസ്ഥബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കി.
- source_word: בְּיָדֶךָ
  choice: നിന്റെ കൈയിൽ
  rationale: അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കൈ-രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: നീ അവരിൽനിന്ന് തടവുകാരെ പിടിക്കുകയും
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയ-നാമ പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ശത്രുസേനയിൽനിന്ന് ആളുകളെ തടവുകാരാക്കുന്നതാണ് ഉദ്ദേശ്യം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പദവിനാമംകൊണ്ട് പകരാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: ഏകവചന പ്രത്യയങ്ങളുടെ കൂട്ടവാചകപ്രയോഗം
  choice: ശത്രുക്കളെ സൂചിപ്പിക്കാൻ ബഹുവചനം
  alternative: അവനെ / അവന്റെ തടവുകാരെ
  rationale: മുൻപുള്ള ‘നിന്റെ ശത്രുക്കൾ’ ബഹുവചനമാണെങ്കിലും തുടർന്നുള്ള പ്രത്യയങ്ങൾ ശത്രുസേനയെ ഒരു കൂട്ടമായി ഏകവചനത്തിൽ കാണുന്നു; മലയാളത്തിൽ ആശയം വ്യക്തമാക്കാൻ ബഹുവചനം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ദ്വിതീയപുരുഷ ഏകവചനം നിലനിർത്തി. വാക്യം തുടർന്നുള്ള നിയമനിർദേശത്തിലേക്കു നയിക്കുന്നതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം അർധവിരാമസദൃശമായ തുടർച്ചാഭാവം കോമയിലൂടെ സൂചിപ്പിച്ചു.
