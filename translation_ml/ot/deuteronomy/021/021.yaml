revisions:
- from: അപ്പോൾ അവന്റെ പട്ടണത്തിലെ പുരുഷന്മാരെല്ലാവരും അവനെ കല്ലെറിഞ്ഞു കൊല്ലണം[a]. അങ്ങനെ നിങ്ങളുടെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയണം. ഇസ്രായേൽ മുഴുവനും ഇതു കേട്ടു ഭയപ്പെടും.
