source:
  edition: WLC
  text: וּ֠/רְגָמֻ/הוּ כָּל אַנְשֵׁ֨י עִיר֤/וֹ בָֽ/אֲבָנִים֙ וָ/מֵ֔ת וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּ֑/ךָ וְ/כָל יִשְׂרָאֵ֖ל יִשְׁמְע֥וּ וְ/יִרָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: ml
  text: അപ്പോൾ അവന്റെ പട്ടണത്തിലെ പുരുഷന്മാരെല്ലാവരും അവനെ കല്ലുകൊണ്ട് കല്ലെറിയണം; അവൻ മരിക്കണം. അങ്ങനെ നിങ്ങളുടെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയണം. ഇസ്രായേൽ മുഴുവനും ഇതു കേട്ടു ഭയപ്പെടും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְגָמֻהוּ ... בָאֲבָנִים
  choice: അവനെ കല്ലെറിഞ്ഞു കൊല്ലണം
  rationale: רגם എന്ന ക്രിയയും ‘കല്ലുകൾകൊണ്ട്’ എന്ന ഉപാധിപ്രയോഗവും ചേർന്ന് കല്ലെറിഞ്ഞുള്ള വധശിക്ഷയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും ഫലവും ഉൾപ്പെടുത്തി ഈ പ്രയോഗം നൽകുന്നു.
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: അവന്റെ പട്ടണത്തിലെ പുരുഷന്മാരെല്ലാവരും
  rationale: אַנְשֵׁי എന്നത് വ്യക്തമായി പുല്ലിംഗമായ ‘പുരുഷന്മാർ’ എന്നാണ്; അതിനെ ലിംഗനിഷ്പക്ഷമായി പൊതുവാക്കാതെ മൂലപാഠത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: וָמֵת
  choice: കൊല്ലണം
  rationale: കല്ലെറിയലിന്റെ ഫലമായി ‘അവൻ മരിക്കണം’ എന്ന നിയമപരമായ ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ സംയുക്തപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: നിങ്ങളുടെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയണം
  rationale: ആവർത്തിച്ചുവരുന്ന ആവർത്തനപുസ്തക നിയമസൂത്രത്തിൽ בער അക്ഷരാർഥത്തിൽ കത്തിക്കൽ അല്ല, സമൂഹത്തിൽനിന്ന് ദോഷം പൂർണമായി നീക്കലാണ്. ‘നീക്കിക്കളയണം’ ഗൗരവവും സ്വാഭാവികതയും ഒരുമിച്ച് നൽകുന്നു.
- source_word: יִשְׁמְעוּ וְיִרָאוּ
  choice: കേട്ടു ഭയപ്പെടും
  rationale: രണ്ടു ക്രിയകളുടെയും നേരിട്ടുള്ള അർഥവും ന്യായവിധി കേൾക്കുന്നതിലൂടെ ഉണ്ടാകുന്ന ഭയവും നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: നിയമസന്ദർഭത്തിലെ ലിംഗസൂചക പൗരപദം
  choice: അവന്റെ പട്ടണത്തിലെ പുരുഷന്മാരെല്ലാവരും
  alternative: അവന്റെ പട്ടണത്തിലെ ജനങ്ങളെല്ലാവരും
  rationale: എബ്രായ പദപ്രയോഗം വ്യക്തമായി ‘പുരുഷന്മാർ’ എന്നാണ്. ഇത് നിലനിർത്തുന്നത് പാഠസൂക്ഷ്മതയ്ക്കായാണ്; അതിനപ്പുറം ലിംഗപങ്കുകളെക്കുറിച്ചുള്ള സിദ്ധാന്തപരമായ നിഗമനം വരുത്തുന്നില്ല.
- issue: തിന്മ നീക്കുന്നതിനുള്ള ആവർത്തനപുസ്തകത്തിലെ നിയമസൂത്രം
  choice: നിങ്ങളുടെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയണം
  alternative: നിങ്ങളുടെ മധ്യത്തിൽനിന്ന് തിന്മ നിർമാർജനം ചെയ്യണം
  rationale: ‘നീക്കിക്കളയണം’ സമൂഹത്തിൽനിന്നുള്ള സമ്പൂർണ നീക്കത്തിന്റെ നിയമപരവും ധാർമികവുമായ ശക്തി സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമപരമായ ഭാവം. ‘പുരുഷന്മാർ’ എന്നത് മൂലത്തിലെ പുല്ലിംഗരൂപം കൃത്യമായി നിലനിർത്തുന്നു. ആവർത്തനപുസ്തകത്തിലെ സ്ഥിരസൂത്രത്തിന് സ്വാഭാവികമായ ‘തിന്മ നീക്കിക്കളയണം’ ഉപയോഗിച്ചു.
