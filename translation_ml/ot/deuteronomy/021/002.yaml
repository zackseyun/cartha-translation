source:
  edition: WLC
  text: וְ/יָצְא֥וּ זְקֵנֶ֖י/ךָ וְ/שֹׁפְטֶ֑י/ךָ וּ/מָדְדוּ֙ אֶל הֶ֣/עָרִ֔ים אֲשֶׁ֖ר סְבִיבֹ֥ת הֶ/חָלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/002.yaml
  text: then your elders and your judges shall go out and measure to the cities that are around the slain man[a].
translation:
  language: ml
  text: അപ്പോൾ നിന്റെ മൂപ്പന്മാരും ന്യായാധിപന്മാരും പുറപ്പെട്ടുചെന്ന്, കൊല്ലപ്പെട്ടവന്റെ ചുറ്റുമുള്ള പട്ടണങ്ങളിലേക്കുള്ള ദൂരം അളക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “കൊല്ലപ്പെട്ടവന്റെ ചുറ്റുമുള്ള പട്ടണങ്ങളിലേക്ക് അളക്കണം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: അപ്പോൾ ... പുറപ്പെട്ടുചെന്ന്
  rationale: വാവ് ചേർന്ന ക്രിയ നിയമനടപടിയിലെ അടുത്ത ഘട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: זְקֵנֶיךָ
  choice: നിന്റെ മൂപ്പന്മാർ
  rationale: ഏകവചന ദ്വിതീയപുരുഷ പ്രത്യയം നിലനിർത്തുകയും ഇസ്രായേലിനെ സമൂഹമായി അഭിസംബോധന ചെയ്യുന്ന രൂപം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וְשֹׁפְטֶיךָ
  choice: ന്യായാധിപന്മാർ
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ ന്യായവിധി നടത്തുന്ന അധികാരികളെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: וּמָדְדוּ אֶל הֶעָרִים
  choice: പട്ടണങ്ങളിലേക്കുള്ള ദൂരം അളക്കണം
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘പട്ടണങ്ങളിലേക്ക് അളക്കുക’ എന്നാണ്; മലയാളത്തിൽ അളക്കപ്പെടുന്നത് ദൂരമാണെന്ന് വ്യക്തമാക്കുന്നത് സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്.
- source_word: אֲשֶׁר סְבִיבֹת
  choice: ചുറ്റുമുള്ള
  rationale: മൃതശരീരം കണ്ടെത്തിയ സ്ഥലത്തെ ചുറ്റിയുള്ള സമീപപട്ടണങ്ങളെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: הֶחָלָל
  choice: കൊല്ലപ്പെട്ടവൻ
  rationale: חָלָל കൊല്ലപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്നു; ‘മൃതശരീരം’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ അർഥം നിലനിർത്തുകയും ‘കൊലചെയ്യപ്പെട്ടവൻ’ എന്ന നിയമപരമായ മുൻവിധി ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനടപടി ശൈലി. സമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന എബ്രായ ഏകവചനമായ ‘നിന്റെ’ നിലനിർത്തിയിരിക്കുന്നു; ക്രിയയിലെ നിർദേശാത്മക ഭാവം ‘അളക്കണം’ എന്നു നൽകിയിരിക്കുന്നു.
