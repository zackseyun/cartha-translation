  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: ml
  text: എന്നാൽ സ്നേഹിക്കപ്പെടാത്ത ഭാര്യയുടെ മകനായ ആദ്യജാതനെ അവൻ അംഗീകരിക്കണം; തനിക്കുള്ള സകലസ്വത്തിൽനിന്നും അവന് ഇരട്ടി ഓഹരി[a] കൊടുക്കണം. കാരണം, അവൻ പിതാവിന്റെ ശക്തിയുടെ ആദ്യഫലമാണ്[b]; ആദ്യജാതാവകാശം അവനുള്ളതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘രണ്ടിന്റെ വായ്’; അവകാശത്തിൽ രണ്ട് ഓഹരികൾ, അതായത് ഇരട്ടി വിഹിതം, എന്നർഥമുള്ള എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘പിതാവിന്റെ ശക്തിയുടെ ആരംഭം.’ പിതാവിന്റെ ജനനശക്തിയുടെ ആദ്യപ്രകടനമായ ആദ്യസന്തതിയെയാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: അംഗീകരിക്കണം
  rationale: ഹിഫിൽ രൂപം ഇവിടെ യഥാർഥ ആദ്യജാതന്റെ നിയമപരമായ പദവി അംഗീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; വെറും തിരിച്ചറിയലിനേക്കാൾ ‘അംഗീകരിക്കണം’ നിയമസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: הַבְּכֹר
  choice: ആദ്യജാതൻ
  rationale: ജന്മാവകാശവും അവകാശവിഹിതവും ഉൾക്കൊള്ളുന്ന സാങ്കേതിക കുടുംബ-നിയമപദമായി മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: בֶּן הַשְּׂנוּאָה
  choice: സ്നേഹിക്കപ്പെടാത്ത ഭാര്യയുടെ മകൻ
  rationale: שְׂנוּאָה അക്ഷരാർഥത്തിൽ ‘വെറുക്കപ്പെട്ട’ എന്നു വരാമെങ്കിലും, സ്നേഹിക്കപ്പെടുന്ന ഭാര്യയോടുള്ള വൈരുധ്യത്തിൽ ഇവിടെ സ്നേഹം ലഭിക്കാത്തതോ കുറച്ച് പ്രിയങ്കരിയായതോ ആയ ഭാര്യയെ സൂചിപ്പിക്കാം. ശക്തമായ വൈരാഗ്യം അനാവശ്യമായി ചുമത്താതെ ഈ ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: അവന് ഇരട്ടി ഓഹരി കൊടുക്കണം
  rationale: ‘രണ്ടിന്റെ വായ്’ എന്ന എബ്രായ പ്രയോഗം അവകാശത്തിൽ രണ്ട് ഓഹരികൾ, അഥവാ ഇരട്ടി വിഹിതം, എന്നാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: തനിക്കുള്ള സകലത്തിലും
  rationale: പിതാവിന്റെ കൈവശമുള്ള സമ്പത്ത്, അഥവാ അവകാശസ്വത്ത്, എന്ന അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; എബ്രായത്തിലെ കൈവശബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: רֵאשִׁית אֹנוֹ
  choice: അവന്റെ ശക്തിയുടെ ആദ്യഫലം
  rationale: പിതാവിന്റെ ജനനശക്തിയുടെ ആദ്യപ്രകടനം എന്ന രൂപകഭാവം നിലനിർത്തുന്നു. ‘ശക്തിയുടെ ആരംഭം’ എന്നതും സാധ്യമെങ്കിലും ‘ആദ്യഫലം’ സന്തതിയെക്കുറിച്ചുള്ള സൂചന കൂടുതൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: ആദ്യജാതാവകാശം
  rationale: ആദ്യജാതപദവിയോടു ചേർന്ന നിയമപരമായ അവകാശത്തെ സംക്ഷിപ്തമായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: כִּי ... כִּי
  choice: എന്നാൽ ... കാരണം
  rationale: ആദ്യ כִּי മുൻവാക്യത്തിലെ പക്ഷപാതപരമായ നടപടിക്കെതിരായ വൈരുധ്യവും രണ്ടാമത്തേത് നിയമത്തിന്റെ കാരണവും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: വിവാഹബന്ധസന്ദർഭത്തിലെ שְׂנוּאָה എന്ന പദത്തിന്റെ ശക്തി
  choice: സ്നേഹിക്കപ്പെടാത്ത ഭാര്യ
  alternative: വെറുക്കപ്പെട്ട ഭാര്യ; കുറച്ച് സ്നേഹിക്കപ്പെട്ട ഭാര്യ
  rationale: പാഠം വിവാഹത്തെക്കുറിച്ചുള്ള വികാരപരമായ വിധിയേക്കാൾ അവകാശനിയമത്തെക്കുറിച്ചാണ്. എബ്രായത്തിന്റെ യഥാർഥ അർഥപരിധി മറയ്ക്കാതെ, നിർബന്ധമല്ലാത്ത കടുത്ത വൈരാഗ്യം ചുമത്താതിരിക്കാനാണ് പ്രധാന പാഠത്തിൽ ‘സ്നേഹിക്കപ്പെടാത്ത’ എന്നു നൽകിയിരിക്കുന്നത്; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ നിയമപരമായ ഗൗരവം നിലനിർത്തിയ സ്വാഭാവിക ശൈലി. ‘ആദ്യജാതൻ/ആദ്യജാതാവകാശം’, ‘ഇരട്ടി ഓഹരി’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ നിയമസ്വഭാവം കാത്തുസൂക്ഷിക്കുന്നതുമാണ്. שְׂנוּאָהയുടെ അർഥപരിധി പ്രധാന പാഠത്തിൽ മിതമായി നൽകിയിരിക്കുന്നു.
