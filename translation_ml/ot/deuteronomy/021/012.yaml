  source_fidelity: എബ്രായ നിയമക്രമത്തിലെ തുടർച്ച (‘പിന്നെ’)യും ആജ്ഞാഭാവവും കൃത്യമായി പ്രതിഫലിക്കുന്നു. ‘നിന്റെ വീട്ടിനകത്തേക്ക്’ תּוֹךְ-ന്റെ ഉൾഭാഗ/അകത്തേക്ക് എന്ന ഭാവം സ്വാഭാവികമായി നൽകുന്നു. ‘തല മുണ്ഡനം ചെയ്യുക’ גלח-ന്റെ നേരായ അർഥമാണ്. നഖങ്ങളെക്കുറിച്ചുള്ള അവ്യക്തമായ പ്രയോഗത്തിന് മുഖ്യവാചകത്തിൽ സ്വീകാര്യമായ ഒരു വായനയും അടിക്കുറിപ്പിൽ പ്രധാന ബദൽവായനയും നൽകിയിരിക്കുന്നു.
