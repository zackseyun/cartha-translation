source:
  edition: WLC
  text: וַ/הֲבֵאתָ֖/הּ אֶל תּ֣וֹךְ בֵּיתֶ֑/ךָ וְ/גִלְּחָה֙ אֶת רֹאשָׁ֔/הּ וְ/עָשְׂתָ֖ה אֶת צִפָּרְנֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/012.yaml
  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: ml
  text: പിന്നെ നീ അവളെ നിന്റെ വീട്ടിനകത്തേക്കു കൊണ്ടുവരണം. അവൾ തന്റെ തല മുണ്ഡനം ചെയ്യുകയും നഖങ്ങൾ വെട്ടിയൊതുക്കുകയും വേണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾ തന്റെ നഖങ്ങൾ വളരാൻ വിടണം.” എബ്രായി അക്ഷരാർഥത്തിൽ “അവൾ തന്റെ നഖങ്ങൾ ചെയ്യണം” എന്നാണ്; ഈ പ്രയോഗത്തിന്റെ അർഥം വിവാദവിധേയമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: പിന്നെ നീ അവളെ … കൊണ്ടുവരണം
  rationale: നിയമനിർദേശങ്ങളുടെ തുടർച്ചയിൽ വാവ് ചേർന്ന ഹിഫ്ഇൽ രൂപം അടുത്ത നിർബന്ധിത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘പിന്നെ’ ക്രമം വ്യക്തമാക്കുകയും ‘കൊണ്ടുവരണം’ ആജ്ഞാത്മക നിയമഭാവം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: നിന്റെ വീട്ടിനകത്തേക്ക്
  rationale: תּוֹךְ എന്നത് അകത്തളത്തെ സൂചിപ്പിക്കുന്നു. ‘വീട്ടിനകത്തേക്ക്’ ഈ ദിശാഭാവം കൃത്യവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; ‘വീടിന്റെ നടുവിലേക്ക്’ എന്ന അതിവാച്യമായ വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: അവൾ തന്റെ തല മുണ്ഡനം ചെയ്യുകയും
  rationale: גלח എന്നതിന് ‘മുണ്ഡനം ചെയ്യുക’ എന്നതാണ് ഇവിടെ നേരായ അർഥം. ‘തന്റെ തല’ എന്ന് നൽകുന്നത് എബ്രായത്തിലെ സ്ത്രീലിംഗ ഉടമസ്ഥപ്രത്യയത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: നഖങ്ങൾ വെട്ടിയൊതുക്കുകയും വേണം
  rationale: ‘നഖങ്ങൾ ചെയ്യുക’ എന്ന എബ്രായ പ്രയോഗം അർഥവ്യക്തതയില്ലാത്തതും വിവാദവിധേയവുമാണ്. മുഖ്യവാചകത്തിൽ നഖങ്ങൾ പരിചരിക്കുക/വെട്ടുക എന്ന സാധാരണ വ്യാഖ്യാനം സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; മറ്റൊരു പ്രധാന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ എന്ന പ്രയോഗത്തിന്റെ അവ്യക്തത
  choice: അവൾ നഖങ്ങൾ വെട്ടിയൊതുക്കണം.
  alternative: അവൾ നഖങ്ങൾ വളരാൻ വിടണം.
  rationale: എബ്രായി അക്ഷരാർഥത്തിൽ ‘അവൾ തന്റെ നഖങ്ങൾ ചെയ്യണം’ എന്നാണ്; ഉദ്ദേശിക്കുന്ന പ്രവൃത്തി വ്യക്തമല്ല. വായനാസൗകര്യത്തിനായി മുഖ്യവാചകത്തിൽ ഒരു സാധാരണ വ്യാഖ്യാനം സ്വീകരിച്ചെങ്കിലും യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമനിർദേശത്തിന്റെ ഭാവം ‘കൊണ്ടുവരണം’, ‘വേണം’ എന്നീ രൂപങ്ങളിലൂടെ സൂക്ഷിച്ചു. അവ്യക്തമായ നഖപ്രയോഗത്തോടു ചേർന്നാണ് [a] അടയാളം നൽകിയിരിക്കുന്നത്.
