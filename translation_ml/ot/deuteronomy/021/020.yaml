id: DEU.21.20
reference: Deuteronomy 21:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָמְר֞וּ אֶל זִקְנֵ֣י עִיר֗/וֹ בְּנֵ֤/נוּ זֶה֙ סוֹרֵ֣ר וּ/מֹרֶ֔ה אֵינֶ֥/נּוּ שֹׁמֵ֖עַ בְּ/קֹלֵ֑/נוּ זוֹלֵ֖ל וְ/סֹבֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: ml
  text: 'പിന്നെ അവർ അവന്റെ പട്ടണത്തിലെ മൂപ്പന്മാരോടു പറയണം: “ഞങ്ങളുടെ ഈ മകൻ ശാഠ്യക്കാരനും ധിക്കാരിയുമാണ്; അവൻ ഞങ്ങളുടെ വാക്കു കേൾക്കുന്നില്ല[a]; അവൻ അമിതഭോജിയും മദ്യപാനിയുമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ഞങ്ങളെ അനുസരിക്കുന്നില്ല.” എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “അവൻ ഞങ്ങളുടെ ശബ്ദം കേൾക്കുന്നില്ല” എന്നാണ്; ഇവിടെ കേൾക്കുക എന്നതിന് ശ്രദ്ധിച്ചു അനുസരിക്കുക എന്ന അർഥവുമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: പിന്നെ അവർ ... പറയണം
  rationale: നിയമനടപടിയിലെ അടുത്ത ഘട്ടത്തെ തുടർച്ചയായി അവതരിപ്പിക്കുന്ന ക്രിയാരൂപത്തിന്റെ നടപടിക്രമപരമായ ബലം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: זִקְנֵי עִירוֹ
  choice: അവന്റെ പട്ടണത്തിലെ മൂപ്പന്മാർ
  rationale: זִקְנֵי പ്രാദേശിക ഭരണനേതാക്കളായ മൂപ്പന്മാരെ സൂചിപ്പിക്കുന്നു. עִיר വലിയ നഗരമെന്നതിൽ മാത്രം ഒതുങ്ങാത്തതിനാൽ ‘പട്ടണം’ എന്ന വിശാലമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: בְּנֵנוּ זֶה
  choice: ഞങ്ങളുടെ ഈ മകൻ
  rationale: സർവനാമത്തിന്റെയും നിർദ്ദേശകപദത്തിന്റെയും ഊന്നൽ സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: סוֹרֵר
  choice: ശാഠ്യക്കാരൻ
  rationale: വഴങ്ങാതെയും ഉറച്ച എതിർപ്പോടെയും പെരുമാറുന്ന വ്യക്തിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; നിയമപരമായ ആരോപണത്തിന്റെ ശക്തി ‘ശാഠ്യക്കാരൻ’ നിലനിർത്തുന്നു.
- source_word: וּמֹרֶה
  choice: ധിക്കാരി
  rationale: വെറും പക്വതക്കുറവല്ല, അധികാരത്തോടുള്ള സജീവമായ എതിർപ്പും മത്സരവും സൂചിപ്പിക്കുന്ന വ്യക്തിനാമമായി ‘ധിക്കാരി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: അവൻ ഞങ്ങളുടെ വാക്കു കേൾക്കുന്നില്ല
  rationale: ‘ഞങ്ങളുടെ ശബ്ദം കേൾക്കുന്നില്ല’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അനുസരണത്തിന്റെ അന്തർഭാവവും മലയാളത്തിലെ സ്വാഭാവികമായ ‘വാക്കു കേൾക്കുക’ എന്ന പ്രയോഗം ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: זוֹלֵל
  choice: അമിതഭോജി
  rationale: മദ്യപാനിയോടു ചേർന്നുള്ള ഈ സന്ദർഭത്തിൽ ഭക്ഷണത്തിൽ അതിരുകടക്കുന്ന പതിവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘അമിതഭോജി’ അതിനെ മാന്യവും വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וְסֹבֵא
  choice: മദ്യപാനി
  rationale: മദ്യപാനത്തിൽ പതിവായി മുഴുകുന്ന ഒരാളെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയുടെ സ്വഭാവം ‘മദ്യപാനി’ കൃത്യമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനടപടി ശൈലി സ്വീകരിച്ചു. അതിപുരാതനമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി; ആരോപണങ്ങളുടെ ശക്തിയും എബ്രായത്തിലെ ‘വാക്കു കേൾക്കുക’ എന്ന അനുസരണസൂചനയുള്ള പ്രയോഗവും നിലനിർത്തി.
