source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/יוֹם֙ הַנְחִיל֣/וֹ אֶת בָּנָ֔י/ו אֵ֥ת אֲשֶׁר יִהְיֶ֖ה ל֑/וֹ לֹ֣א יוּכַ֗ל לְ/בַכֵּר֙ אֶת בֶּן הָ֣/אֲהוּבָ֔ה עַל פְּנֵ֥י בֶן הַ/שְּׂנוּאָ֖ה הַ/בְּכֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: ml
  text: അവൻ തനിക്കുള്ളത് തന്റെ പുത്രന്മാർക്ക് അവകാശമായി നൽകുന്ന ദിവസം, സ്നേഹിക്കപ്പെടുന്ന ഭാര്യയുടെ മകനെ വെറുക്കപ്പെടുന്ന[a] ഭാര്യയുടെ ആദ്യജാതനായ മകനെക്കാൾ മുൻനിർത്തി ആദ്യജാതനായി കണക്കാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “വെറുക്കപ്പെടുന്ന ഭാര്യ”; “സ്നേഹിക്കപ്പെടാത്ത ഭാര്യ” അല്ലെങ്കിൽ “കുറച്ച് സ്നേഹിക്കപ്പെടുന്ന ഭാര്യ” എന്നും അർത്ഥമാകാം. കുടുംബനിയമസന്ദർഭത്തിൽ എബ്രായപദം സജീവമായി വെറുക്കപ്പെടുന്നവളെ മാത്രമല്ല, താരതമ്യേന കുറച്ച് പരിഗണിക്കപ്പെടുന്നവളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: ആ ദിവസം
  rationale: നിയമപരമായ ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം; മലയാളത്തിൽ കാലസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַנְחִילוֹ אֶת בָּנָיו אֵת אֲשֶׁר יִהְיֶה לוֹ
  choice: അവൻ തനിക്കുള്ളത് തന്റെ പുത്രന്മാർക്ക് അവകാശമായി നൽകുന്ന
  rationale: נחל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘അവകാശം ലഭിക്കുമാറാക്കുക’ എന്ന കാരണാർത്ഥവും אֵת אֲשֶׁר יִהְיֶה לוֹ എന്ന ‘തനിക്കുള്ളത്’ എന്ന സ്വതന്ത്ര ഘടകവും നിലനിർത്തുന്നു.
- source_word: לֹא יוּכַל
  choice: കണക്കാക്കരുത്
  rationale: ഈ നിയമസന്ദർഭത്തിൽ ശാരീരിക അസമർഥതയല്ല, നിയമപരമായ വിലക്കാണ് ഉദ്ദേശ്യം.
- source_word: לְבַכֵּר
  choice: ആദ്യജാതനായി കണക്കാക്കുക
  rationale: ആദ്യജാതന്റെ പദവിയും അവകാശവും നൽകുക എന്ന നിയമപരമായ അർത്ഥം സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: בֶּן הָאֲהוּבָה
  choice: സ്നേഹിക്കപ്പെടുന്ന ഭാര്യയുടെ മകൻ
  rationale: എബ്രായത്തിലെ കർമണിപദമായ ‘സ്നേഹിക്കപ്പെട്ടവൾ’ എന്ന രൂപം നിലനിർത്തുന്നു; സന്ദർഭം വ്യക്തമാക്കാൻ ‘ഭാര്യ’ ചേർക്കുന്നു.
- source_word: עַל פְּנֵי
  choice: മകനെക്കാൾ മുൻനിർത്തി
  rationale: ഈ താരതമ്യത്തിൽ മുൻഗണന നൽകുക എന്ന അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֶּן הַשְּׂנוּאָה
  choice: സ്നേഹിക്കപ്പെടാത്ത ഭാര്യയുടെ മകൻ
  rationale: שׂנא എന്ന പദത്തിന്റെ ശക്തമായ ഉപരിതലാർത്ഥം ‘വെറുക്കപ്പെട്ട’ എന്നാണെങ്കിലും കുടുംബനിയമസന്ദർഭത്തിലെ താരതമ്യപരമായ അനിഷ്ടം മലയാളത്തിൽ അനാവശ്യമായി കടുപ്പിക്കാതിരിക്കാൻ പ്രധാന പാഠത്തിൽ ‘സ്നേഹിക്കപ്പെടാത്ത’ എന്നു നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַבְּכֹר
  choice: ആദ്യജാതനായ
  rationale: സ്നേഹിക്കപ്പെടാത്ത ഭാര്യയുടെ മകനാണ് യഥാർഥ ആദ്യജാതൻ എന്നു വിശേഷണരൂപത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ബഹുഭാര്യത്വമുള്ള കുടുംബത്തിലെ സ്നേഹപരമായ വൈരുധ്യത്തിന്റെ വിവർത്തനം
  choice: ‘സ്നേഹിക്കപ്പെടുന്ന ഭാര്യ’ എന്നും ‘സ്നേഹിക്കപ്പെടാത്ത ഭാര്യ’ എന്നും
  alternative: ‘സ്നേഹിക്കപ്പെടുന്ന ഭാര്യ’ എന്നും ‘വെറുക്കപ്പെടുന്ന ഭാര്യ’ എന്നും
  rationale: മൂലപാഠത്തിലെ വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട്, שְׂנוּאָה കുടുംബബന്ധങ്ങളിൽ ‘താരതമ്യേന കുറച്ച് സ്നേഹിക്കപ്പെട്ടവൾ’ എന്ന അർത്ഥം വഹിക്കാവുന്നതിനാൽ മലയാളത്തിൽ സജീവമായ വെറുപ്പ് നിർബന്ധമായി ചുമത്തുന്നില്ല; ശക്തമായ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘പുത്രന്മാർ’, ‘അവകാശം’, ‘ആദ്യജാതൻ’ എന്നീ പദങ്ങൾ നിയമപരവും വേദപാഠപരവുമായ കൃത്യതയ്ക്കായി ഉപയോഗിച്ചു.
