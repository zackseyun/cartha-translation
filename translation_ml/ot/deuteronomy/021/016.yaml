    issue: The main text renders שְׂנוּאָה as “സ്നേഹിക്കപ്പെടാത്ത.”
    rationale: Although comparative lesser affection is a possible contextual nuance, the Hebrew explicitly contrasts אֲהוּבָה (“loved”) with שְׂנוּאָה (“hated”). The main translation should retain that contrast; the less-forceful interpretation belongs in a footnote.
  - severity: low
    issue: The final identification of the actual firstborn is syntactically crowded.
    rationale: Placing “ആദ്യജാതനായ” immediately before “മകനെ” makes clear that the son of the hated wife—not the loved wife's son—is the firstborn.
  - severity: low
    issue: The footnote anchor is placed at the end of the verse rather than beside the term it explains.
    rationale: Moving the anchor adjacent to “വെറുക്കപ്പെടുന്ന” gives the lexical note a clear referent.
