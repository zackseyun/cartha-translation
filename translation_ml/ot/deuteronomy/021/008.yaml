source:
  edition: WLC
  text: כַּפֵּר֩ לְ/עַמְּ/ךָ֨ יִשְׂרָאֵ֤ל אֲשֶׁר פָּדִ֨יתָ֙ יְהוָ֔ה וְ/אַל תִּתֵּן֙ דָּ֣ם נָקִ֔י בְּ/קֶ֖רֶב עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וְ/נִכַּפֵּ֥ר לָ/הֶ֖ם הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: ml
  text: യഹ്‌വേ, അങ്ങ് വീണ്ടെടുത്ത അങ്ങയുടെ ജനമായ ഇസ്രായേലിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണമേ. നിരപരാധരക്തം അങ്ങയുടെ ജനമായ ഇസ്രായേലിന്റെ ഇടയിൽ നിലനിൽക്കാൻ അനുവദിക്കരുതേ. അങ്ങനെ ആ രക്തക്കുറ്റത്തിന് അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം ഉണ്ടാകും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അപ്പോൾ ആ രക്തത്തിന് അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം ഉണ്ടാകും.” രക്തച്ചൊരിച്ചിലിൽനിന്നുള്ള നിയമബാധ്യതയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായാണ് എബ്രായപാഠം ഇവിടെ “രക്തം” എന്നു പറയുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֵּר
  choice: പ്രായശ്ചിത്തം ചെയ്യണമേ
  rationale: כפר എന്ന ക്രിയയുടെ ആരാധനാപരവും നിയമപരവുമായ അർഥം നിലനിർത്തുന്ന, മലയാളത്തിൽ പരിചിതവും സന്ദർഭത്തിന് യോജിച്ചതുമായ പ്രയോഗം.
- source_word: לְעַמְּךָ יִשְׂרָאֵל
  choice: അങ്ങയുടെ ജനമായ ഇസ്രായേലിനുവേണ്ടി
  rationale: ל ഗുണഭോക്താവിനെ സൂചിപ്പിക്കുന്നു; ‘ജനമായ ഇസ്രായേൽ’ എന്ന രൂപം ഇസ്രായേലിനെ ദൈവത്തിന്റെ ജനമായി വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: അങ്ങ് വീണ്ടെടുത്ത
  rationale: פדה അടിമത്തത്തിൽനിന്നോ ബാധ്യതയിൽനിന്നോ മോചിപ്പിക്കുന്ന വീണ്ടെടുപ്പിനെ സൂചിപ്പിക്കുന്നു; ‘വീണ്ടെടുത്ത’ ഉടമ്പടിപരമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וְאַל תִּתֵּן דָּם נָקִי בְּקֶרֶב
  choice: നിരപരാധരക്തത്തിന്റെ കുറ്റം ... ഇടയിൽ ... നിലനിൽക്കാൻ അനുവദിക്കരുതേ
  rationale: נתן എന്നതിന്റെ അക്ഷരാർഥം ‘വെക്കുക/നൽകുക’ എന്നാണെങ്കിലും, ഈ നിയമസന്ദർഭത്തിൽ കൊലപാതകത്തിൽനിന്നുള്ള കൂട്ടായ ബാധ്യത ജനത്തിനിടയിൽ തുടരാൻ അനുവദിക്കരുതെന്ന അപേക്ഷയാണ്. മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകാൻ നിയമപരമായ ‘കുറ്റം’ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: അങ്ങനെ ആ രക്തക്കുറ്റത്തിന് അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം ഉണ്ടാകും
  rationale: Niphal രൂപത്തിന്റെ ഫലസൂചകവും കർമണിപരവുമായ ഭാവം ‘പ്രായശ്ചിത്തം ഉണ്ടാകും’ എന്നു നൽകി. הַדָּם അക്ഷരാർഥത്തിൽ ‘രക്തം’ ആണെങ്കിലും ഇവിടെ രക്തച്ചൊരിച്ചിലിൽനിന്നുള്ള നിയമബാധ്യതയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘രക്തക്കുറ്റം’ എന്നു വ്യക്തമാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്തുകയും പദവിയായ ‘കർത്താവ്’ കൊണ്ട് പകരംവയ്ക്കാതിരിക്കുകയും ചെയ്തു.
- issue: അവസാന വാക്യഘടകത്തിലെ הַדָּם എന്നതിന്റെ നിയമപരമായ അർഥം
  choice: രക്തക്കുറ്റം
  alternative: രക്തം
  rationale: പരിഹരിക്കപ്പെടുന്നത് ഭൗതിക രക്തമല്ല, പരിഹരിക്കപ്പെടാത്ത കൊലപാതകത്തിൽനിന്നുള്ള സമൂഹത്തിന്റെ ബാധ്യതയാണ്. എന്നാൽ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി യഥാർഥ ഭാഷാപരമായ രൂപം മറച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ എന്ന ആദരസൂചക രൂപവും അപേക്ഷയ്ക്ക് ‘-ണമേ’ എന്ന രൂപവും സ്വീകരിച്ചു; നിയമ-ആരാധനാപരമായ ‘പ്രായശ്ചിത്തം’ എന്ന പദം സന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
