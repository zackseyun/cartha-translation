source:
  edition: WLC
  text: אָר֗וּר שֹׁכֵב֙ עִם אֵ֣שֶׁת אָבִ֔י/ו כִּ֥י גִלָּ֖ה כְּנַ֣ף אָבִ֑י/ו וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/020.yaml
  text: Cursed is the one who lies with his father's wife[a], because he has uncovered his father's skirt. And all the people shall say[b], ‘Amen.’
translation:
  language: ml
  text: “തന്റെ പിതാവിന്റെ ഭാര്യയോടുകൂടെ[a] ശയിക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ; കാരണം, അവൻ തന്റെ പിതാവിന്റെ വസ്ത്രത്തിന്റെ മടിത്തട്ട് തുറന്നുകാട്ടിയിരിക്കുന്നു.[b]” ജനമെല്ലാം, “ആമേൻ” എന്നു പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭത്തിൽ ‘പിതാവിന്റെ ഭാര്യ’ എന്നത് രണ്ടാനമ്മയെ സൂചിപ്പിച്ചേക്കാം; എന്നാൽ എബ്രായപാഠം ‘രണ്ടാനമ്മ’ എന്ന ബന്ധപദം വ്യക്തമായി ഉപയോഗിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘പിതാവിന്റെ വസ്ത്രത്തിന്റെ മടിത്തട്ട് തുറന്നുകാട്ടി.’ ഇത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഒരു ശിഷ്ടോക്തിയാണ്; ‘പിതാവിന്റെ നഗ്നത അനാവൃതമാക്കി’ എന്നും അർഥമാക്കാം. ലേവ്യപുസ്തകം 18:8; 20:11 എന്നിവയിലെ ഭാഷയുമായി ഇതിന് ബന്ധമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ഉടമ്പടിശാപത്തിന്റെ സൂത്രവാക്യസ്വഭാവം വ്യക്തവും ഗൗരവപൂർണവുമായി നിലനിർത്തുന്നു.
- source_word: שֹׁכֵב עִם
  choice: കൂടെ ശയിക്കുന്നവൻ
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശിഷ്ടോക്തി നിയമപരമായ ഭാവത്തോടെ മലയാളത്തിലും ശിഷ്ടോക്തിയായി നിലനിർത്തുന്നു.
- source_word: אֵשֶׁת אָבִיו
  choice: തന്റെ പിതാവിന്റെ ഭാര്യ
  rationale: ‘രണ്ടാനമ്മ’ എന്നു ബന്ധം കൂടുതൽ നിർവചിക്കാതെ എബ്രായത്തിലെ വാക്കുകൾ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ശാപവിധിയുടെ കാരണം അവതരിപ്പിക്കുന്ന വ്യക്തമായ കാരണബന്ധം നൽകുന്നു.
- source_word: גִלָּה כְּנַף אָבִיו
  choice: തന്റെ പിതാവിന്റെ വസ്ത്രത്തിന്റെ അറ്റം അനാവൃതമാക്കിയിരിക്കുന്നു
  rationale: כְּנַף എന്നതിന്റെ ‘വസ്ത്രത്തിന്റെ അറ്റം/തുമ്പ്’ എന്ന ദൃശ്യരൂപവും ലൈംഗിക ശിഷ്ടോക്തിയും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു; അർഥവ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְאָמַר כָּל הָעָם
  choice: ജനമെല്ലാം … എന്നു പറയണം
  rationale: ഉടമ്പടി-ആരാധനാപരമായ സമൂഹപ്രതികരണത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിർദേശരൂപമായി അവതരിപ്പിക്കുന്നു.
- source_word: אָמֵן
  choice: ആമേൻ
  rationale: പരമ്പരാഗത ആരാധനാപരമായ എബ്രായ പ്രതികരണത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിയമപരമായ ശാപവാക്യത്തിലെ ലൈംഗിക ശിഷ്ടോക്തിയുടെ പരിഭാഷ
  choice: ‘പിതാവിന്റെ വസ്ത്രത്തിന്റെ അറ്റം അനാവൃതമാക്കി’ എന്ന ഉറവിടരൂപകം നിലനിർത്തുക
  alternative: ‘പിതാവിന്റെ നഗ്നത അനാവൃതമാക്കി’ അല്ലെങ്കിൽ ‘പിതാവിന്റെ വിവാഹബന്ധത്തെ ലംഘിച്ചു’
  rationale: ഈ പ്രയോഗം ലേവ്യപുസ്തകത്തിലെ ലൈംഗിക നിരോധനഭാഷയെ ഓർമിപ്പിക്കുന്നതോടൊപ്പം പിതാവിന്റെ വൈവാഹിക അവകാശത്തെയും മാനത്തെയും സൂചിപ്പിച്ചേക്കാം. കൃത്യമായ സൂക്ഷ്മാർഥം വിവാദവിധേയമായതിനാൽ മുഖ്യപാഠത്തിൽ രൂപകം നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
- issue: אֵשֶׁת אָבִיו സൂചിപ്പിക്കുന്ന ബന്ധം
  choice: ‘പിതാവിന്റെ ഭാര്യ’ എന്നു വിവർത്തനം ചെയ്യുക
  alternative: ‘രണ്ടാനമ്മ’
  rationale: സന്ദർഭത്തിൽ രണ്ടാനമ്മയെ ഉദ്ദേശിച്ചേക്കാമെങ്കിലും എബ്രായപാഠം ആ ബന്ധപദം വ്യക്തമായി ഉപയോഗിക്കുന്നില്ല; അതിനാൽ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആരാധനാഭാവം. ‘ശയിക്കുക’, ‘അനാവൃതമാക്കുക’ എന്നീ ശിഷ്ടോക്തികൾ ഉറവിടത്തിന്റെ മാന്യതയും രൂപകവും നിലനിർത്തുന്നു; അതേസമയം വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
