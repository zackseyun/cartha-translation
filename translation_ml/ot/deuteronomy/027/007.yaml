base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: ml
  text: നീ സമാധാനയാഗങ്ങൾ[a] അർപ്പിക്കണം; അവിടെ ഭക്ഷിക്കണം; നിന്റെ ദൈവമായ യാഹ്‌വെയുടെ സന്നിധിയിൽ സന്തോഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൂട്ടായ്മയാഗങ്ങൾ’ അല്ലെങ്കിൽ ‘ക്ഷേമയാഗങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זָבַחְתָּ
  choice: അർപ്പിച്ച്
  rationale: യാഗസന്ദർഭത്തിൽ זבח യാഗം നടത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യാഗം അർപ്പിക്കുക’ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്; ‘അറുക്കുക’ എന്നത് ഇവിടെ അനാവശ്യമായി ക്രിയയുടെ ഭൗതിക വശത്തിന് ഊന്നൽ നൽകും.
- source_word: שְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: שְׁלָמִים പങ്കിട്ട യാഗഭക്ഷണത്തോടും ക്ഷേമം, സമാധാനം, കൂട്ടായ്മ എന്നിവയോടും ബന്ധപ്പെട്ട ഒരു യാഗവിഭാഗമാണ്. ‘സമാധാനയാഗങ്ങൾ’ പരിചിതവും സംക്ഷിപ്തവുമായ പ്രധാനപാഠരൂപമാണ്; മറ്റു സാധുവായ അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְ/אָכַלְתָּ שָּׁם
  choice: അവിടെ ഭക്ഷിക്കുകയും
  rationale: ശബ്ദാർത്ഥം ‘അവിടെ ഭക്ഷിക്കുക’ എന്നാണ്. തുടർച്ചയായ എബ്രായ ക്രിയാരൂപങ്ങളെ മലയാളത്തിലെ സ്വാഭാവിക ഏകവാക്യഘടനയിൽ ബന്ധിപ്പിച്ചിരിക്കുന്നു.
- source_word: וְ/שָׂמַחְתָּ
  choice: സന്തോഷിക്കുകയും വേണം
  rationale: שׂמח ആരാധനാപരവും ആഘോഷപരവുമായ സന്തോഷത്തെ സൂചിപ്പിക്കുന്നു. ‘സന്തോഷിക്കുക’ ആ ഭാവം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לִ/פְנֵי
  choice: സന്നിധിയിൽ
  rationale: ആരാധനാസന്ദർഭത്തിലെ לִפְנֵי ദൈവത്തിന്റെ മുമ്പിൽ അഥവാ സാന്നിധ്യത്തിൽ എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ‘സന്നിധിയിൽ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: എബ്രായത്തിലെ രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം വ്യക്തമായി നിലനിർത്തുന്നു; ‘നിന്റെ ദൈവമായ യഹോവ’ മലയാളത്തിൽ സ്വാഭാവികമായ നാമവിന്യാസമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയായ ‘കർത്താവ്’ കൊണ്ട് പകരാതെ ലിപ്യന്തരിച്ചു. ആധുനിക പണ്ഡിതപ്രയോഗത്തിൽ ‘യാഹ്‌വെ’ സാധുവാണെങ്കിലും മലയാള ബൈബിൾ വായനക്കാർക്ക് കൂടുതൽ പരിചിതമായ ‘യഹോവ’ പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചു.
- issue: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ അർത്ഥം
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ; ക്ഷേമയാഗങ്ങൾ
  rationale: ഇത് വ്യക്തിയുടെ ഉള്ളിലെ സമാധാനത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയല്ല, പങ്കിട്ട ഭക്ഷണവുമായി ബന്ധപ്പെട്ട യാഗവിഭാഗത്തിന്റെ പേരാണ്. പദത്തിന്റെ സമാധാനം, ക്ഷേമം, കൂട്ടായ്മ എന്നീ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. എബ്രായത്തിലെ രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധന ‘നീ/നിന്റെ’ എന്നായി നിലനിർത്തി; ആവർത്തിച്ച നിർദേശക്രിയകളെ സ്വാഭാവികമായ മലയാള സംയുക്തവാക്യമായി അവതരിപ്പിച്ചു.
