  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: ml
  text: “ഈ ന്യായപ്രമാണത്തിലെ വചനങ്ങളെ അവ അനുഷ്ഠിച്ചുകൊണ്ട് നിലനിർത്താത്തവൻ[a] ശപിക്കപ്പെട്ടവൻ.” ജനമെല്ലാവരും, “ആമേൻ” എന്നു പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിലനിർത്താത്തവൻ” എന്നതിന് “സ്ഥിരീകരിക്കാത്തവൻ” അല്ലെങ്കിൽ “പ്രാബല്യത്തിൽ സ്ഥാപിക്കാത്തവൻ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് ന്യായപ്രമാണത്തിന്റെ പ്രാബല്യം നിലനിർത്തുക അഥവാ സാധൂകരിക്കുക എന്ന ആശയം വരാം; ഇവിടെ അത് “അവ അനുഷ്ഠിച്ചുകൊണ്ട്” എന്ന അനുസരണസൂചനയുമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ഉടമ്പടിശാപത്തിന്റെ സൂത്രവാക്യസ്വഭാവം വ്യക്തമായി നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: אֲשֶׁר
  choice: —ത്തവൻ
  rationale: ഒരു പ്രത്യേക വ്യക്തിയെയല്ല, പൊതുവായി ആരെയും സൂചിപ്പിക്കുന്ന എബ്രായ ആപേക്ഷികപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ ഏകവചന പൊതുപ്രയോഗത്തിലൂടെ നൽകി.
- source_word: לֹא יָקִים
  choice: നിലനിർത്താത്തവൻ
  rationale: ഹിഫ്ഇൽ ക്രിയയുടെ ‘ഉറപ്പിക്കുക, സ്ഥാപിക്കുക, പ്രാബല്യത്തിൽ നിലനിർത്തുക’ എന്നീ അർഥവ്യാപ്തികളിൽ, തുടർന്നുള്ള അനുഷ്ഠാനസൂചനയുമായി ചേരുന്ന ‘നിലനിർത്തുക’ തിരഞ്ഞെടുത്തു; ‘അനുസരിക്കാതിരിക്കുക’ എന്നു മാത്രം പറഞ്ഞ് ഇരട്ടപ്രയോഗം ലഘൂകരിച്ചില്ല.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ഈ ന്യായപ്രമാണത്തിലെ വചനങ്ങൾ
  rationale: ദ്വിതീയോപദേശത്തിലെ ഉടമ്പടിനിയമസന്ദർഭത്തിൽ תּוֹרָהയ്ക്ക് ‘ന്യായപ്രമാണം’ യോജിക്കുന്നു; דִּבְרֵיയുടെ വാചികസ്വഭാവം ‘വചനങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: לַעֲשׂוֹת אֹתָם
  choice: അനുഷ്ഠിച്ചുകൊണ്ട് അവയെ
  rationale: നിയമത്തെ നിലനിർത്തുന്നത് പ്രായോഗിക അനുസരണത്തിലൂടെയാണെന്ന ബന്ധം ‘അനുഷ്ഠിച്ചുകൊണ്ട്’ വ്യക്തമാക്കുന്നു; മൂലത്തിലെ ബഹുവചന സൂചന ‘അവയെ’ കൊണ്ടു നിലനിർത്തി.
- source_word: וְאָמַר כָּל הָעָם
  choice: ജനമെല്ലാം … എന്നു പറയണം
  rationale: ആരാധനാക്രമത്തിലെ നിർദേശാത്മകവും കൂട്ടായതുമായ പ്രതികരണം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഭൂതകാല സംഭവവിവരണമായി മാറ്റിയിട്ടില്ല.
- source_word: אָמֵן
  choice: ആമേൻ
  rationale: കൂട്ടായ സ്ഥിരീകരണത്തിന്റെ പാരമ്പര്യ ആരാധനാപദം അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יָקִים ... לַעֲשׂוֹת אֹתָם എന്നതിലെ ഉടമ്പടിബാധ്യത
  choice: ന്യായപ്രമാണത്തിലെ വചനങ്ങളെ അനുഷ്ഠിച്ചുകൊണ്ട് അവയെ പ്രാബല്യത്തിൽ നിലനിർത്താതിരിക്കുന്നവനാണ് ശാപത്തിന് വിധേയൻ.
  alternative: ന്യായപ്രമാണത്തെ പരസ്യമായി സ്ഥിരീകരിക്കാത്തവൻ; അല്ലെങ്കിൽ ന്യായപ്രമാണം പാലിക്കാത്തവൻ.
  rationale: എബ്രായം ‘നിലനിർത്തുക/ഉറപ്പിക്കുക’ എന്ന ആശയത്തെയും ‘അവ അനുഷ്ഠിക്കുക’ എന്ന ആശയത്തെയും ചേർക്കുന്നു. അതിനാൽ വാക്കാലുള്ള അംഗീകാരം മാത്രമായോ പൊതുവായ ‘പാലിക്കൽ’ മാത്രമായോ ചുരുക്കാതെ രണ്ടും പരിഭാഷയിൽ സൂക്ഷിച്ചു.
- issue: אֲשֶׁר എന്നതിന്റെ പൊതുവായ വ്യക്തിസൂചന
  choice: —ത്തവൻ
  alternative: ആരെങ്കിലും; ഏവൻ
  rationale: എബ്രായത്തിലെ വ്യാകരണപരമായ ഏകവചനം ഒരു പൊതുപ്രതിനിധിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘—ത്തവൻ’ ഈ പൊതുസ്വഭാവം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; ഒരു പ്രത്യേക പുരുഷനെ ഉദ്ദേശിക്കുന്നതായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ആരാധനാ-നിയമഭാഷ ഉപയോഗിച്ചു. ‘ന്യായപ്രമാണം,’ ‘വചനങ്ങൾ,’ ‘ആമേൻ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. മൂലത്തിലെ ‘നിലനിർത്തുക’ എന്നും ‘അനുഷ്ഠിക്കുക’ എന്നും ഉള്ള രണ്ടു ഘടകങ്ങളും വേർതിരിച്ചുതന്നെ സൂക്ഷിച്ചു.
