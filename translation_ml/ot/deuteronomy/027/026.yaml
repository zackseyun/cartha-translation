revisions:
- from: “ഈ ന്യായപ്രമാണത്തിലെ വചനങ്ങൾ അനുഷ്ഠിച്ചുകൊണ്ട് അവയെ നിലനിർത്താത്തവൻ[a] ശപിക്കപ്പെട്ടവൻ.” ജനമെല്ലാം, “ആമേൻ” എന്നു പറയണം.
  to: “ഈ ന്യായപ്രമാണത്തിലെ വചനങ്ങളെ അവ അനുഷ്ഠിച്ചുകൊണ്ട് നിലനിർത്താത്തവൻ[a] ശപിക്കപ്പെട്ടവൻ.” ജനമെല്ലാവരും, “ആമേൻ” എന്നു പറയണം.
