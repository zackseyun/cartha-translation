  to: നിങ്ങൾ യോർദാൻ കടക്കുമ്പോൾ, ഇന്ന് ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുന്ന ഈ കല്ലുകൾ ഏബാൽ മലയിൽ[a] സ്ഥാപിക്കണം; അവയ്ക്ക് ചുണ്ണാമ്പ് പൂശണം.
