source:
  edition: WLC
  text: וְ/הָיָה֮ בְּ/עָבְרְ/כֶ֣ם אֶת הַ/יַּרְדֵּן֒ תָּקִ֜ימוּ אֶת הָ/אֲבָנִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם בְּ/הַ֣ר עֵיבָ֑ל וְ/שַׂדְתָּ֥ אוֹתָ֖/ם בַּ/שִּֽׂיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: ml
  text: നിങ്ങൾ യോർദാൻ കടക്കുമ്പോൾ, ഇന്ന് ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുന്ന ഈ കല്ലുകൾ ഏബാൽ മലയിൽ[a] സ്ഥാപിക്കണം; അവയ്ക്ക് ചുണ്ണാമ്പ് പൂശണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പാഠപാരമ്പര്യങ്ങൾ, പ്രത്യേകിച്ച് ശമര്യ പഞ്ചഗ്രന്ഥം, “ഏബാൽ മല” എന്നതിനു പകരം “ഗെരിസീം മല” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: നിങ്ങൾ ... കടന്നശേഷം
  rationale: വാക്യാരംഭത്തിലെ וְהָיָהയും בְּ + ധാതുനാമരൂപവും ചേർന്ന് ഭാവിയിലെ സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കടന്നശേഷം’ സ്വാഭാവികവും സന്ദർഭാനുസൃതവുമാണ്.
- source_word: הַיַּרְדֵּן
  choice: യോർദാൻ
  rationale: നദിയുടെ സുപരിചിതമായ പേരായതിനാൽ ‘നദി’ എന്നു കൂട്ടിച്ചേർക്കാതെ പേരുതന്നെ നിലനിർത്തുന്നു.
- source_word: תָּקִימוּ
  choice: നാട്ടിനിർത്തി
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ കല്ലുകൾ സ്ഥാപിക്കുക, എഴുന്നേൽപ്പിച്ചുനിർത്തുക എന്നർഥം നൽകുന്നു. ‘നാട്ടിനിർത്തി’ ഭൗതികപ്രവർത്തനം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: ഈ കല്ലുകൾ
  rationale: മൂലത്തിലെ ലളിതമായ നിർദ്ദേശക നാമപദപ്രയോഗം അതേപടി നിലനിർത്തുന്നു; ‘സ്മാരകശിലകൾ’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ഇന്ന് ഞാൻ നിങ്ങളോടു കല്പിക്കുന്ന
  rationale: מְצַוֶּה എന്ന കൃതന്തത്തിന്റെ ഇപ്പോഴത്തെ/തുടർച്ചയായ ബലം സ്വാഭാവികമായ മലയാള ബന്ധവാക്യത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: בְּהַר עֵיבָל
  choice: ഏബാൽ മലയിൽ
  rationale: בְּ എന്ന ഉപസർഗം ഈ സന്ദർഭത്തിൽ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. മലയുടെ പേര് മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: അവയ്ക്കു ചുണ്ണാമ്പ് പൂശണം
  rationale: שׂוד എന്ന ക്രിയയുടെ പൂശുക/തേക്കുക എന്ന അർഥവും שׂיד എന്ന വസ്തുവിന്റെ ചുണ്ണാമ്പ് എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ആവർത്തനം 27:4-ലെ മലയുടെ പേരിനെക്കുറിച്ചുള്ള പാഠഭേദം
  choice: ഏബാൽ മല
  alternative: ഗെരിസീം മല
  rationale: നൽകിയിരിക്കുന്ന WLC/മസോററ്റിക് പാഠത്തിൽ ‘ഏബാൽ’ എന്നാണ്. എന്നാൽ ശമര്യ പഞ്ചഗ്രന്ഥം ഉൾപ്പെടെയുള്ള ശ്രദ്ധേയമായ പാഠപാരമ്പര്യങ്ങളിൽ ‘ഗെരിസീം’ എന്ന വായനയുള്ളതിനാൽ മുഖ്യപാഠം ഉറവിടപാഠത്തെ പിന്തുടരുകയും പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘നാട്ടിനിർത്തി’, ‘ചുണ്ണാമ്പ് പൂശണം’ എന്നീ പ്രയോഗങ്ങൾ നിർമാണപ്രവർത്തനം വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
