  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: ml
  text: 'അപ്പോൾ മോശെയും ലേവ്യരായ പുരോഹിതന്മാരും എല്ലാ ഇസ്രായേലിനോടും ഇങ്ങനെ പറഞ്ഞു: “ഇസ്രായേലേ, നിശ്ശബ്ദമായിരിക്കുക[a]; കേൾക്കുക. ഇന്നു നീ നിന്റെ ദൈവമായ യാഹ്‌വേയ്ക്ക് ഒരു ജനമായിത്തീർന്നിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ശ്രദ്ധിക്കുക.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ആജ്ഞ നിശ്ശബ്ദതയെയോ ഏകാഗ്രമായ ശ്രദ്ധയെയോ ഊന്നിപ്പറയാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “നിന്റെ ദൈവമായ യാഹ്‌വേയ്ക്കുള്ള ഒരു ജനമായിത്തീർന്നിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... ഇങ്ങനെ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; לֵאמֹר ഉൾപ്പെടുന്ന പ്രസ്താവനാസൂത്രം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഇങ്ങനെ പറഞ്ഞു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: ലേവ്യരായ പുരോഹിതന്മാർ
  rationale: ‘പുരോഹിതന്മാർ’ എന്ന വിഭാഗത്തെ ‘ലേവ്യർ’ എന്നു തിരിച്ചറിയിക്കുന്ന എബ്രായ പദസാമീപ്യം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: כָּל יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേലും
  rationale: ഇസ്രായേൽജനത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന സമൂഹവാചകത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הַסְכֵּת
  choice: നിശ്ശബ്ദനായിരിക്കുക
  rationale: കേൾക്കുന്നതിനു മുമ്പുള്ള നിശ്ശബ്ദമായ ശ്രദ്ധയ്ക്കുള്ള ആജ്ഞയുടെ മൂർത്തമായ അർഥം സംരക്ഷിക്കുന്നു; ‘ശ്രദ്ധിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וּשְׁמַע
  choice: കേൾക്കുക
  rationale: ശ്രദ്ധയോടെ സ്വീകരിക്കാനുള്ള ആജ്ഞയെ ആധുനിക മലയാളത്തിൽ ലളിതമായും നേരിട്ടും അറിയിക്കുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്നു
  rationale: ‘ഈ ദിവസം’ എന്ന കാലസൂചനയുടെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: נִהְיֵיתָ לְעָם
  choice: നീ ... ഒരു ജനമായിത്തീർന്നിരിക്കുന്നു
  rationale: ഇസ്രായേലിനെ ഏകീകൃത സമൂഹമായി അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷ ഏകവചനവും עָם എന്ന അനിശ്ചിത ജനസമൂഹസൂചനയും നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: היה + ל എന്ന ഘടനയിലെ ഉടമ്പടിപരമായ ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘യഹോവയുടേതായ’ എന്ന ഉടമസ്ഥതാഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: ഇസ്രായേലിനോടുള്ള സമൂഹ-ഏകവചന അഭിസംബോധനയോടു പൊരുത്തപ്പെടുന്ന രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ പേരായിത്തന്നെ അവതരിപ്പിക്കുന്നു.
- issue: ഇസ്രായേലിനോടുള്ള സമൂഹ-ഏകവചന അഭിസംബോധന
  choice: നീ ... ഒരു ജനമായിത്തീർന്നിരിക്കുന്നു
  alternative: നിങ്ങൾ ... ഒരു ജനമായിത്തീർന്നിരിക്കുന്നു
  rationale: എബ്രായത്തിലെ രണ്ടാംപുരുഷ പുൽലിംഗ ഏകവചനം ഇസ്രായേലിനെ ഏകീകൃത ഉടമ്പടിസമൂഹമായി അഭിസംബോധന ചെയ്യുന്നു; അതിനാൽ ഏകവചനം നിലനിർത്തി.
- issue: לַיהוָה സൂചിപ്പിക്കുന്ന ബന്ധം
  choice: യഹോവയ്ക്ക് ഒരു ജനം
  alternative: യഹോവയുടേതായ ജനം
  rationale: പ്രധാനപാഠത്തിൽ എബ്രായത്തിലെ לְ എന്ന ബന്ധസൂചനയുടെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു; ഉടമസ്ഥതാഭാവമുള്ള വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഇസ്രായേലിനോടുള്ള ഏകവചന അഭിസംബോധനയും ദിവ്യനാമവും മൂലപാഠത്തിനനുസരിച്ച് നിലനിർത്തിയിരിക്കുന്നു; യഥാർത്ഥ പദാർഥവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
