base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/011.yaml
  text: And on that day Moses commanded the people, saying,
translation:
  language: ml
  text: 'ആ ദിവസം മോശ ജനത്തോടു കല്പിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ ആധികാരികമായ കല്പനാഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ സ്ഥിരപ്പെട്ടിട്ടുള്ള വ്യക്തിനാമരൂപം.
- source_word: אֶת הָעָם
  choice: ജനത്തോട്
  rationale: עָם ഇവിടെ ഇസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി ‘കല്പിച്ചു’ എന്ന ക്രിയയോടൊപ്പം സംപ്രദാനവിഭക്തി ഉപയോഗിച്ചു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നുതന്നെ
  rationale: ‘ആ ദിവസം’ എന്ന കാലസൂചനയെ സന്ദർഭബന്ധത്തോടെ സ്വാഭാവികവും ഊന്നലോടെയും അവതരിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന കല്പനയുടെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഹീബ്രു ഘടന മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; അനാവശ്യമായ ‘പറഞ്ഞുകൊണ്ട്’ ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. മൂലത്തിലെ കല്പനാഭാവവും കാലസൂചനയും നിലനിർത്തിക്കൊണ്ട്, അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളിലേക്കുള്ള ബന്ധം ദ്വിബിന്ദുവിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു.
