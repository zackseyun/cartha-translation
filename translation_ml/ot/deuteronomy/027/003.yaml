source:
  edition: WLC
  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: ml
  text: നീ അക്കരെ കടക്കുമ്പോൾ, ഈ ന്യായപ്രമാണത്തിലെ[a] സകല വാക്കുകളും അവയുടെമേൽ എഴുതണം; അങ്ങനെ, നിന്റെ ദൈവമായ യഹോവ നിനക്കു നൽകുന്ന ദേശത്ത്—പാലും തേനും ഒഴുകുന്ന ദേശത്ത്—നീ പ്രവേശിക്കേണ്ടതിന്, നിന്റെ പിതാക്കന്മാരുടെ[b] ദൈവമായ യഹോവ നിന്നോടു പറഞ്ഞതുപോലെ തന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ പ്രബോധനത്തിലെ സകല വാക്കുകളും’ എന്നും പരിഭാഷപ്പെടുത്താം. തോറാ എന്ന എബ്രായപദത്തിന് ‘പ്രബോധനം’ എന്നും ‘ന്യായപ്രമാണം’ എന്നും അർഥമാകാം; ഇവിടെ ഉടമ്പടിസംബന്ധമായ നിയമസന്ദർഭം ‘ന്യായപ്രമാണം’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ പൂർവികരുടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘നിന്റെ പിതാക്കന്മാരുടെ’ എന്നാണ്; ആവർത്തിക്കുന്ന ഉടമ്പടി-സൂത്രവാക്യം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: എഴുതണം
  rationale: സംയോജകാവ്യയത്തോടുകൂടിയ ഖാൽ പൂർണക്രിയ ഇവിടെ നിർദേശാത്മക കല്പനയായി പ്രവർത്തിക്കുന്നു; ‘എഴുതണം’ ആ നിയമപരമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֲלֵיהֶן
  choice: അവയുടെമേൽ
  rationale: മുൻവാക്യത്തിലെ കല്ലുകളെയാണ് സ്ത്രീലിംഗ ബഹുവചന സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ഈ ന്യായപ്രമാണത്തിലെ സകല വാക്കുകളും
  rationale: דִּבְרֵי എന്നതിന്റെ വ്യക്തമായ ‘വാക്കുകൾ’ എന്ന അർഥം നിലനിർത്തുന്നു; תּוֹרָהയ്ക്ക് ‘പ്രബോധനം’ എന്ന അർഥവും സാധ്യമെങ്കിലും ഇവിടെ ഉടമ്പടിസംബന്ധമായ നിയമസന്ദർഭത്തിൽ ‘ന്യായപ്രമാണം’ യോജിക്കുന്നു.
- source_word: בְּעָבְרֶךָ
  choice: നീ അക്കരെ കടക്കുമ്പോൾ
  rationale: ബെത് ഉപസർഗത്തോടുകൂടിയ ക്രിയാനാമം കാലസൂചന നൽകുന്നു; സന്ദർഭത്തിൽ യോർദ്ദാൻ അക്കരെ കടക്കുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: അങ്ങനെ ... നീ പ്രവേശിക്കാം
  rationale: ഉദ്ദേശ്യത്തെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്ന ഘടനയുടെ ഇരട്ടസാധ്യത പൂർണമായി ചുരുക്കാതെ, സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവ
  rationale: വ്യക്തിനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ബന്ധഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: נֹתֵן לְךָ
  choice: നിനക്കു നൽകുന്ന
  rationale: വർത്തമാന കൃതന്തം ദാനം നടന്നുകൊണ്ടിരിക്കുന്നതോ സുനിശ്ചിതമായി സമീപിച്ചിരിക്കുന്നതോ ആയ ഭാവത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: പാലും തേനും ഒഴുകുന്ന ദേശം
  rationale: സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ സജീവ ദൃശ്യരൂപം അതേപടി നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: അരുളിച്ചെയ്തതുപോലെതന്നെ
  rationale: ‘വാഗ്ദാനം ചെയ്തു’ എന്ന് വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കാതെ ‘പറഞ്ഞു’ എന്ന മൂലക്രിയ നിലനിർത്തുന്നു; ദൈവത്തിന്റെ വാക്കിനെ സൂചിപ്പിക്കുന്ന dignified Malayalam ആയി ‘അരുളിച്ചെയ്തു’ ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: മൂലത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനവും ആവർത്തിക്കുന്ന ഉടമ്പടി-സൂത്രവാക്യവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനനാമംകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: אֲבֹתֶיךָ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നിന്റെ പിതാക്കന്മാർ
  alternative: നിന്റെ പൂർവികർ
  rationale: മൂലത്തിലെ പുല്ലിംഗ രൂപവും ആവർത്തിക്കുന്ന ഉടമ്പടി ഭാഷയും സംരക്ഷിക്കുന്നു; കൂടുതൽ ഉൾക്കൊള്ളുന്ന ‘പൂർവികർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: לְמַעַן אֲשֶׁר ഘടനയിലെ ഉദ്ദേശ്യം/ഫലം
  choice: അങ്ങനെ ... നീ പ്രവേശിക്കാം
  alternative: നീ പ്രവേശിക്കേണ്ടതിന്
  rationale: എഴുത്തുകല്പനയും ദേശപ്രവേശവും തമ്മിലുള്ള ഉദ്ദേശ്യ-ഫലബന്ധം നിലനിർത്തിക്കൊണ്ട്, കാരണം-ഫലം അതിയായി കർശനമാക്കാതെ അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ നിയമ-ഉടമ്പടി സന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ന്യായപ്രമാണം,’ ‘അരുളിച്ചെയ്തു’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ തിരുവെഴുത്തുസംബന്ധമായ ഔന്നത്യം നിലനിർത്തുന്നു; വാക്യക്രമം ഹീബ്രുവിന്റെ ആശയക്രമത്തോട് കഴിയുന്നത്ര ചേർന്നു നിൽക്കുന്നു.
