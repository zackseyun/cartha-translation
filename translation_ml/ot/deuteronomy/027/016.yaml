id: DEU.27.16
reference: Deuteronomy 27:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָר֕וּר מַקְלֶ֥ה אָבִ֖י/ו וְ/אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: ml
  text: “തന്റെ അപ്പനെയോ അമ്മയെയോ അവമതിക്കുന്നവൻ[a] ശപിക്കപ്പെട്ടവൻ.” ജനമെല്ലാം, “ആമേൻ” എന്നു പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിസ്സാരമായി കാണുന്നവൻ,’ ‘നിന്ദിക്കുന്നവൻ,’ ‘അവജ്ഞ കാണിക്കുന്നവൻ.’ ഒരാളെ പ്രാധാന്യമില്ലാത്തവനോ നിന്ദ്യനോ ആയി കണക്കാക്കി പെരുമാറുക എന്ന ആശയം ഹീബ്രു ക്രിയ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ഉടമ്പടിശാപത്തിന്റെ സൂത്രവാക്യം അവതരിപ്പിക്കുന്ന നിഷ്ക്രിയ വിശേഷണരൂപത്തിന്റെ അർഥവും നിയമപരവും ആരാധനാക്രമപരവുമായ ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַקְלֶה
  choice: അവമതിക്കുന്നവൻ
  rationale: കേവലം ഉള്ളിലെ അനിഷ്ടമല്ല, മാതാപിതാക്കളെ നിസ്സാരരോ മാനമില്ലാത്തവരോ ആയി കണക്കാക്കി പെരുമാറുന്നതും ഉൾക്കൊള്ളുന്ന קלה എന്ന ക്രിയയുടെ സാമൂഹിക-ധാർമിക ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: אָבִיו וְאִמּוֹ
  choice: തന്റെ അപ്പനെയോ അമ്മയെയോ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം ‘തന്റെ’ എന്നു നൽകുന്നു. ഹീബ്രുവിലെ ‘ഉം’ എന്ന സംയോജകം ഓരോ മാതാപിതാവിനോടുമുള്ള കുറ്റം ഉൾക്കൊള്ളുന്ന വിതരണാർഥത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘യോ…യോ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וְאָמַר כָּל הָעָם
  choice: അപ്പോൾ ജനമെല്ലാം … എന്നു പറയണം
  rationale: ആരാധനാക്രമത്തിലെ തുടർന്നുള്ള സമൂഹപ്രതികരണം വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ഇസ്രായേൽ’ ചേർക്കാതെ ‘ജനമെല്ലാം’ എന്നു നിലനിർത്തുന്നു.
- source_word: אָמֵן
  choice: ആമേൻ
  rationale: ഉടമ്പടിപരമായ ഗൗരവമുള്ള ആരാധനാപരമായ സമ്മതവാക്ക് മലയാളത്തിലെ സ്ഥിരപ്രയോഗമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മാതാപിതാക്കൾക്കെതിരായ കുറ്റത്തിന്റെ സ്വഭാവം
  choice: അവമതിക്കുന്നവൻ
  alternative: നിസ്സാരമായി കാണുന്നവൻ; നിന്ദിക്കുന്നവൻ
  rationale: ഹീബ്രുക്രിയ മാതാപിതാക്കളെ നിസ്സാരരും മാനമില്ലാത്തവരും ആയി കണക്കാക്കുന്ന സമീപനവും പെരുമാറ്റവും സൂചിപ്പിക്കുന്നു. ‘അവമതിക്കുക’ എന്നത് കുറ്റത്തെ വെറും മാനസിക അനിഷ്ടമായോ വാക്കാലുള്ള നിന്ദയായോ ചുരുക്കാതെ അതിന്റെ വിശാലമായ ധാർമിക ഭാരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം നിയമപരവും ആരാധനാക്രമപരവുമായ ഗൗരവമുള്ള ശൈലി. ‘അപ്പൻ/അമ്മ’ സ്വാഭാവികമായ കുടുംബബന്ധപദങ്ങളായി ഉപയോഗിച്ചു; വാക്യഘടന അനാവശ്യമായി പുരാതനമാക്കിയിട്ടില്ല.
