id: DEU.27.15
reference: Deuteronomy 27:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: ml
  text: “യഹ്‌വേക്കു വെറുപ്പായതും ശില്പിയുടെ കൈപ്പണിയുമായ ഒരു കൊത്തുരൂപമോ വാർപ്പുരൂപമോ[a] ഉണ്ടാക്കി അതു രഹസ്യമായി സ്ഥാപിക്കുന്ന പുരുഷൻ[b] ശപിക്കപ്പെട്ടവൻ.” ജനമെല്ലാം മറുപടിയായി, “ആമേൻ” എന്നു പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വാർപ്പുരൂപം’ എന്നത് ഉരുക്കിയ വസ്തു അച്ചിൽ ഒഴിച്ചു വാർത്ത് ഉണ്ടാക്കുന്ന രൂപത്തെ സൂചിപ്പിക്കുന്നു; പലപ്പോഴും അത് ലോഹത്തിൽ ഉണ്ടാക്കിയതായിരിക്കും.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘പുരുഷൻ’ എന്ന പുല്ലിംഗ ഏകവചനമാണ്; ഇവിടെ അത് പ്രതിനിധാനപരമായ നിയമസൂത്രമായി പ്രവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ഉടമ്പടിസംബന്ധമായ ശാപപ്രഖ്യാപനത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאִישׁ
  choice: പുരുഷൻ
  rationale: എബ്രായത്തിലെ വ്യാകരണപരമായ പുല്ലിംഗ ഏകവചനത്തെ നിലനിർത്തുന്നു; ഇവിടെ അത് നിയമസൂത്രത്തിൽ പ്രതിനിധാനപരമായി ഉപയോഗിച്ചിരിക്കുന്നു.
- source_word: פֶסֶל
  choice: കൊത്തുരൂപം
  rationale: കൊത്തിയുണ്ടാക്കുന്ന രൂപം എന്ന മൂർത്തമായ അർഥം കൃത്യമായി നൽകുന്നു; പൊതുവായ ‘വിഗ്രഹം’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: מַסֵּכָה
  choice: വാർപ്പുരൂപം
  rationale: ഉരുക്കിയ വസ്തു അച്ചിൽ ഒഴിച്ചു വാർക്കുന്ന രീതിയിൽ ഉണ്ടാക്കിയ രൂപത്തെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ലോഹം’ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: תּוֹעֲבַת יְהוָה
  choice: യഹ്‌വേക്കു വെറുപ്പായത്
  rationale: യഹ്‌വേ തികച്ചും വെറുക്കുന്ന കാര്യം എന്ന ശക്തമായ ഉടമ്പടി-നൈതിക ഭാവം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: ശില്പിയുടെ കൈപ്പണി
  rationale: പ്രതിമ മനുഷ്യൻ നിർമിച്ചതാണെന്ന ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וְשָׂם בַּסָּתֶר
  choice: അതു രഹസ്യമായി സ്ഥാപിക്കുന്നു
  rationale: രൂപത്തെ വെക്കുകയോ പ്രതിഷ്ഠിക്കുകയോ ചെയ്യുന്ന പ്രവൃത്തിയും അതിന്റെ മറച്ചുവെച്ച സ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: וְעָנוּ כָל הָעָם וְאָמְרוּ
  choice: ജനമെല്ലാം മറുപടിയായി … എന്നു പറയണം
  rationale: സമൂഹത്തിന്റെ ഔപചാരിക പ്രത്യുത്തരത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אָמֵן
  choice: ആമേൻ
  rationale: പരിചിതമായ ആരാധനാപരവും ഉടമ്പടിസംബന്ധവുമായ പ്രത്യുത്തരം ലിപ്യന്തരിച്ചു നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം നാമം ലിപ്യന്തരിച്ചു.
- issue: ഉടമ്പടി-ശാപസൂത്രത്തിലെ പ്രതിനിധാനപരമായ പുല്ലിംഗം
  choice: പുരുഷൻ
  alternative: വ്യക്തി; ആരെങ്കിലും
  rationale: മൂലത്തിലെ പുല്ലിംഗ ഏകവചനം മറച്ചുവെക്കാതെ നിലനിർത്തുകയും അതിന്റെ പ്രതിനിധാനപരമായ നിയമപ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
- issue: תּוֹעֵבָה എന്ന ശക്തമായ വിലയിരുത്തൽ
  choice: വെറുപ്പായത്
  alternative: അറപ്പായത്; നിന്ദ്യമായത്
  rationale: ദൈവത്തിന്റെ ശക്തമായ നിരാകരണം വ്യക്തമായി നൽകുന്നു; ആചാരപരമായ അശുദ്ധിയെന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആരാധനാ ശൈലി. വാക്യാരംഭത്തിലെ ഉദ്ധരണി ശാപപ്രഖ്യാപനവും തുടർന്നുള്ള സമൂഹപ്രത്യുത്തരവും വേർതിരിക്കുന്നു. സാങ്കേതികത നിലനിർത്തിക്കൊണ്ട് ‘കൊത്തുരൂപം’, ‘വാർപ്പുരൂപം’ എന്നീ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു.
