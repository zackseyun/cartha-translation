  text: וְ/שָׁ֣מַעְתָּ֔ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/עָשִׂ֤יתָ אֶת מִצְוֺתָ/ו֙ וְ/אֶת חֻקָּ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: ml
  text: അതിനാൽ, നിന്റെ ദൈവമായ യഹ്‌വേയുടെ ശബ്ദം കേൾക്കുകയും, ഞാൻ ഇന്നു നിന്നോടു കൽപ്പിക്കുന്ന അവന്റെ കൽപ്പനകളും ചട്ടങ്ങളും പാലിക്കുകയും വേണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ദൈവമായ യഹ്‌വേയുടെ ശബ്ദം അനുസരിക്കണം.” “ശബ്ദം കേൾക്കുക” എന്ന എബ്രായ പ്രയോഗത്തിൽ പലപ്പോഴും അനുസരിക്കുക എന്ന ആശയവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: ശബ്ദം കേട്ട്
  rationale: ശמע בקול എന്ന എബ്രായ പ്രയോഗം ശ്രദ്ധയോടെ കേൾക്കുകയും അനുസരിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ശബ്ദം കേട്ട്’ എന്നത് അടിസ്ഥാന രൂപകം നിലനിർത്തുന്നു; അനുസരണത്തിന്റെ ആശയം തുടർന്നുള്ള ‘അനുസരിച്ചു പ്രവർത്തിക്കണം’ എന്നതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു; ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് പകരംവയ്ക്കുന്നില്ല.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥബന്ധവും യഹ്‌വേയുമായുള്ള സമീകരണവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְעָשִׂיתָ
  choice: അനുസരിച്ചു പ്രവർത്തിക്കണം
  rationale: עשה എന്നത് ഇവിടെ കല്പനകൾ പ്രാവർത്തികമാക്കുക എന്ന അർഥത്തിലാണ്. വെറും ‘ചെയ്യുക’ എന്നതിനേക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായി നിയമങ്ങൾ പാലിച്ചു നടപ്പാക്കുന്ന അർഥം നൽകുന്നു.
- source_word: מִצְוֺתָיו
  choice: അവന്റെ കല്പനകൾ
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ നിർദേശങ്ങൾ എന്ന അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: חֻקָּיו
  choice: ചട്ടങ്ങൾ
  rationale: חֹק എന്ന നിയമവിഭാഗത്തെ ‘കല്പനകൾ’ എന്നതിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് ആധുനികവും വ്യക്തവുമായ പദം ഉപയോഗിക്കുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ
  choice: ഞാൻ ... നിന്നോടു കല്പിക്കുന്ന
  rationale: മോശയുടെ ഇപ്പോഴത്തെ പ്രസംഗസന്ദർഭവും ഒന്നാംപുരുഷ കർത്താവും നിലനിർത്തുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്നു
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഇപ്പോഴത്തെ ഉടമ്പടി നിമിഷത്തിനുള്ള ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: ‘ശബ്ദം കേൾക്കുക’ എന്ന പ്രയോഗത്തിലെ അനുസരണാർഥം
  choice: പ്രധാനവാക്യത്തിൽ ‘ശബ്ദം കേട്ട്’ എന്ന രൂപകം നിലനിർത്തി, തുടർന്നുള്ള പ്രവൃത്തിയിൽ അനുസരണം വ്യക്തമാക്കുന്നു
  alternative: ‘വാക്ക് അനുസരിച്ച്’ എന്ന് മുഴുവനായും അർഥപരിഭാഷ ചെയ്യുക
  rationale: എബ്രായ രൂപകവും അതിലെ അനുസരണസൂചനയും രണ്ടും സംരക്ഷിക്കുന്നു; കേൾക്കലിനെയും പ്രവർത്തനത്തെയും വേർതിരിക്കുന്ന വാക്യഘടനയും നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധന നിലനിർത്തി. നിയമപരമായ പദഭേദം വ്യക്തമാക്കാൻ מִצְוֺתָיו എന്നതിന് ‘കല്പനകൾ’, חֻקָּיו എന്നതിന് ‘ചട്ടങ്ങൾ’ ഉപയോഗിച്ചു.
