source:
  edition: WLC
  text: וּ/בָנִ֤יתָ שָּׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ מִזְבַּ֣ח אֲבָנִ֔ים לֹא תָנִ֥יף עֲלֵי/הֶ֖ם בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: ml
  text: അവിടെ നിന്റെ ദൈവമായ യാഹ്‌വേയ്ക്ക് നീ ഒരു യാഗപീഠം പണിയണം—കല്ലുകൾകൊണ്ടുള്ള ഒരു യാഗപീഠം. അവയുടെമേൽ ഇരുമ്പ് ഉപയോഗിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവയിൽ ഇരുമ്പുപകരണം ഉപയോഗിക്കരുത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: നീ പണിയണം
  rationale: നിർദേശപരമായ സന്ദർഭത്തിലെ വാവ് ചേർന്ന ഖാൽ പെർഫെക്റ്റിന് ബാധ്യതയുള്ള ആജ്ഞാഭാവമുണ്ട്; ആധുനിക മലയാളത്തിൽ ‘പണിയണം’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: മുൻപ് നിർദേശിച്ച സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ലളിതമായ സ്ഥലക്രിയാവിശേഷണം.
- source_word: מִזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പണത്തിനുള്ള പീഠം എന്ന അർത്ഥം വ്യക്തമായി നൽകുന്ന നിലവാരമുള്ള മലയാള പദം.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവയ്ക്കായി
  rationale: לְ സമർപ്പണം/ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; יהוה എന്ന ദൈവനാമം ‘യഹോവ’യായി ലിപ്യന്തരിച്ചു, אֱלֹהֶיךָയിലെ ഉടമ്പടിബന്ധം ‘നിന്റെ ദൈവമായ’ എന്നു നിലനിർത്തുന്നു.
- source_word: מִזְבַּח אֲבָנִים
  choice: കല്ലുകൾകൊണ്ടുള്ള ഒരു യാഗപീഠം
  rationale: നിർമാണവസ്തുവിനെ വ്യക്തമാക്കുന്ന ഹീബ്രു ഘടന മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: לֹא תָנִיף עֲלֵיהֶם בַּרְזֶל
  choice: അവയുടെമേൽ ഇരുമ്പ് പ്രയോഗിക്കരുത്
  rationale: נוף എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ കല്ലുകളിൽ ഇരുമ്പുപകരണം ഉപയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഇരുമ്പ്’ എന്ന മൂലപദത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന പ്രയോഗം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ചതുർക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപദംകൊണ്ട് മറയ്ക്കാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- issue: ഇരുമ്പിനെക്കുറിച്ചുള്ള വിലക്കിന്റെ വ്യാപ്തി
  choice: ‘ഇരുമ്പ്’ എന്ന മൂലരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു
  alternative: ‘ഇരുമ്പുപകരണം’ എന്നു വ്യക്തമാക്കുക
  rationale: בַּרְזֶל അക്ഷരാർഥത്തിൽ ‘ഇരുമ്പ്’ എന്നാണ്; സന്ദർഭത്തിൽ ഇരുമ്പുപകരണം ഉദ്ദേശിക്കുന്നുവെങ്കിലും മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും നേരിയ അർത്ഥവ്യാപ്തിയും മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു, വ്യക്തീകരണം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിർദേശശൈലി. ‘യാഗപീഠം’ എന്ന സ്ഥാപിത ബൈബിൾപദം ഉപയോഗിച്ചു; അത്യന്തം അക്ഷരാർഥപരമായ ‘ഇരുമ്പ് ഉയർത്തരുത്’ എന്ന അസ്വാഭാവിക രൂപം ഒഴിവാക്കി.
