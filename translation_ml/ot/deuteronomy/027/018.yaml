id: DEU.27.18
reference: Deuteronomy 27:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָר֕וּר מַשְׁגֶּ֥ה עִוֵּ֖ר בַּ/דָּ֑רֶךְ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: ml
  text: “വഴിയിൽ അന്ധനായ ഒരു മനുഷ്യനെ വഴിതെറ്റിക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ.” ജനമെല്ലാം, “ആമേൻ” എന്നു പറയണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ഉടമ്പടിശാപത്തിന്റെ പ്രഖ്യാപനരൂപം നിലനിർത്തുന്നു; ഒരു ആശംസയോ പ്രാർഥനയോ ആക്കി മാറ്റുന്നില്ല.
- source_word: מַשְׁגֶּה
  choice: വഴിതെറ്റിക്കുന്നവൻ
  rationale: ഹിഫീൽ കൃദന്തരൂപത്തിലെ കാരണാർത്ഥം—മറ്റൊരാളെ വഴിതെറ്റിക്കുക—സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עִוֵּר
  choice: അന്ധനായ ഒരു മനുഷ്യനെ
  rationale: എബ്രായത്തിലെ ഏകവചന പുല്ലിംഗ നാമവൽക്കൃത വിശേഷണത്തെ നിയമപരമായ വ്യക്തിഗത ഉദാഹരണമായി കൃത്യമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: בַּדָּרֶךְ
  choice: വഴിയിൽ
  rationale: ഇവിടെ പ്രാഥമികമായി ഉദ്ദേശിക്കുന്ന സഞ്ചാരപാതയെന്ന മൂർത്തമായ സ്ഥലാർത്ഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וְאָמַר
  choice: എന്നു പറയണം
  rationale: നിയമ-ആരാധനാക്രമത്തിലെ നിർദേശാത്മക ഭാവി അർത്ഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל הָעָם
  choice: ജനമെല്ലാം
  rationale: മൂലത്തിലെ ‘സകല ജനവും’ എന്ന അർത്ഥം അധിക വിശദീകരണം ചേർക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אָמֵן
  choice: ആമേൻ
  rationale: ഉടമ്പടിപരവും ആരാധനാപരവുമായ അംഗീകാരപ്രതികരണത്തിന്റെ സ്ഥാപിത മലയാള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
theological_decisions:
- issue: עִוֵּר എന്ന നാമവൽക്കൃത വിശേഷണത്തിന്റെ ലിംഗാവിഷ്കാരം
  choice: അന്ധനായ ഒരു മനുഷ്യനെ
  alternative: അന്ധനായ ഒരാളെ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ഏകവചനം പ്രകടമാക്കുകയും നിയമവാക്യത്തിലെ ഒരു വ്യക്തിഗത സംഭവത്തെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- issue: ശാപസൂത്രത്തിന്റെ സ്വഭാവം
  choice: ശപിക്കപ്പെട്ടവൻ
  alternative: ശപിക്കപ്പെടട്ടെ
  rationale: എബ്രായം ആശംസാരൂപമല്ല, പ്രഖ്യാപനാത്മകമായ ഉടമ്പടിശാപമാണ്; അതിനാൽ വിധിപ്രഖ്യാപനത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാശൈലി. ‘വഴിയിൽ’ എന്നും ‘വഴിതെറ്റിക്കുന്നവൻ’ എന്നും ഉള്ള പദാവർത്തനം മലയാളത്തിൽ അർത്ഥസുതാര്യവും മൂലത്തിലെ പ്രവൃത്തിയുടെ ദൃശ്യത നിലനിർത്തുന്നതുമാണ്.
