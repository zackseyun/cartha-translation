source:
  edition: WLC
  text: וְ/כָתַבְתָּ֣ עַל הָ/אֲבָנִ֗ים אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בַּאֵ֥ר הֵיטֵֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/008.yaml
  text: And you shall write on the stones all the words of this law very clearly[a].
translation:
  language: ml
  text: ഈ ന്യായപ്രമാണത്തിലെ എല്ലാ വചനങ്ങളും ആ കല്ലുകളിൽ വളരെ വ്യക്തമായി എഴുതണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വളരെ വ്യക്തമായി’ എന്നതിന് പകരം ‘സുവ്യക്തമായി’ അല്ലെങ്കിൽ ‘തെളിച്ചമായി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗത്തിൽ ‘വ്യക്തമാക്കുക/വിശദീകരിക്കുക’ എന്ന ആശയമുള്ള ഒരു ക്രിയയും അതിനെ ശക്തിപ്പെടുത്തുന്ന ഒരു പദവും ചേർന്നിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: എഴുതണം
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിൽ വരുന്ന സംയോജകത്തോടുകൂടിയ രണ്ടാംപുരുഷ ഏകവചന ക്രിയ ആജ്ഞാത്മക ഭാവം വഹിക്കുന്നു. മലയാളത്തിൽ ‘എഴുതണം’ സ്വാഭാവികമായി ആ നിർദേശം അറിയിക്കുന്നു.
- source_word: עַל הָאֲבָנִים
  choice: ആ കല്ലുകളിൽ
  rationale: עַל എന്നത് ഇവിടെ എഴുത്തിന്റെ ഉപരിതലമായ ‘കല്ലുകളിൽ’ എന്നാണ്. നിർദിഷ്ടപ്രത്യയം മുമ്പ് പറഞ്ഞ കല്ലുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആ’ ചേർത്തു.
- source_word: אֵת כָּל דִּבְרֵי
  choice: സകല വചനങ്ങളും
  rationale: כָּל דִּבְרֵי എന്നതിന്റെ സമഗ്രതയും ‘വാക്കുകൾ’ എന്ന ഔപചാരിക ഭാവവും ‘സകല വചനങ്ങളും’ നിലനിർത്തുന്നു.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ഈ ന്യായപ്രമാണത്തിലെ
  rationale: നിയമ-ഉടമ്പടി പശ്ചാത്തലത്തിൽ תּוֹרָהയ്ക്ക് ‘ന്യായപ്രമാണം’ എന്നത് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും ഇവിടെ യോജിച്ചതുമാണ്; ‘ഈ’ മൂലത്തിലെ നിർദേശകപദത്തെ നിലനിർത്തുന്നു.
- source_word: בַּאֵר הֵיטֵב
  choice: വളരെ വ്യക്തമായി
  rationale: באר എന്ന ‘വ്യക്തമാക്കുക/തെളിവാക്കുക’ എന്ന ആശയത്തെയും הֵיטֵב നൽകുന്ന ശക്തീകരണത്തെയും ചേർത്ത്, എഴുത്ത് വ്യക്തമായി വായിക്കാനോ ഗ്രഹിക്കാനോ കഴിയുന്ന വിധത്തിലാകണം എന്ന അർഥം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിർദേശശൈലി. ‘ന്യായപ്രമാണം’, ‘വചനങ്ങൾ’ എന്നീ പദങ്ങൾ നിയമ-ഉടമ്പടി പശ്ചാത്തലവും മൂലത്തിന്റെ ഔപചാരിക ഘടനയും നിലനിർത്തുന്നു; ദുഷ്കരമായ പുരാതന വാക്യക്രമം ഒഴിവാക്കി.
