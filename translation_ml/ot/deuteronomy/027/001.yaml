id: DEU.27.1
reference: Deuteronomy 27:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ וְ/זִקְנֵ֣י יִשְׂרָאֵ֔ל אֶת הָ/עָ֖ם לֵ/אמֹ֑ר שָׁמֹר֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: ml
  text: 'പിന്നെ മോശെയും ഇസ്രായേലിന്റെ മൂപ്പന്മാരും ജനത്തോടു കല്പിച്ചു: “ഇന്നു ഞാൻ നിങ്ങളോടു കല്പിക്കുന്ന കല്പന മുഴുവനും പാലിക്കുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה അധികാരപൂർവമായ കല്പന നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കല്പിച്ചു’ നേരിട്ടും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മൂപ്പന്മാരും
  rationale: എബ്രായവാക്യം മോശെയെയും മൂപ്പന്മാരെയും ക്രിയയുടെ സംയുക്ത കർത്താക്കളായി ഏകോപിപ്പിക്കുന്നു; ‘-യും’ ആ ഘടന നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനത്തോടു
  rationale: עָם ഇവിടെ ഉടമ്പടിസമൂഹമായ ജനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഏകവചന സമൂഹനാമമായ ‘ജനം’ സ്വാഭാവികമാണ്.
- source_word: לֵאמֹר
  choice: ഉദ്ധരണിക്ക് മുമ്പുള്ള ദ്വിബിന്ദുവിലൂടെ പ്രകടിപ്പിച്ചു
  rationale: לֵאמֹר ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന രൂപമാണ്. മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർക്കുന്നതിനെക്കാൾ ദ്വിബിന്ദു സ്വാഭാവികമായി അതേ വ്യവഹാരപ്രവർത്തനം നിർവഹിക്കുന്നു.
- source_word: שָׁמֹר
  choice: പാലിക്കുവിൻ
  rationale: കല്പനയുടെ സന്ദർഭത്തിൽ שׁמר ശ്രദ്ധയോടെയുള്ള അനുസരണത്തെയും ആചരണത്തെയും സൂചിപ്പിക്കുന്നു; ‘പാലിക്കുവിൻ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל הַמִּצְוָה
  choice: കല്പന മുഴുവനും
  rationale: מִצְוָה ഏകവചനത്തിലാണ്; כָּל ചേർന്നതിനാൽ ‘കല്പന മുഴുവനും’ എന്നത് ഏകവചനത്തിന്റെ കൂട്ടായ/സമഗ്രമായ ഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: ഞാൻ നിങ്ങളോടു കല്പിക്കുന്ന
  rationale: പങ്ക്തിരൂപമായ מְצַוֶּה വർത്തമാനകാല/ഇപ്പോഴത്തെ കല്പനയുടെ ഭാവം നൽകുന്നു; മലയാളത്തിലെ വർത്തമാന കൃദന്തരൂപം അത് സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്നു
  rationale: הַיּוֹם എന്ന കാലസൂചനയെ ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടിനിർദേശത്തിലെ מִצְוָה എന്ന പദത്തിന്റെ വചനം
  choice: ‘കല്പന’ എന്ന ഏകവചനം നിലനിർത്തി, ‘മുഴുവനും’ എന്നതിലൂടെ സമഗ്രത വ്യക്തമാക്കി
  alternative: ‘കല്പനകളെല്ലാം’ എന്ന് ബഹുവചനമാക്കുക
  rationale: എബ്രായപദം ഏകവചനമാണ്; അതിനെ നിലനിർത്തുന്നത് നിയമസംഹിതയെ ഏകീകൃതമായ ഉടമ്പടിബാധ്യതയായി അവതരിപ്പിക്കുന്ന സാധ്യമായ സൂക്ഷ്മത സംരക്ഷിക്കുന്നു. ബഹുവചനമാക്കുന്നത് ആ യഥാർഥമായ രൂപഭേദം ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി. ‘കല്പിക്കുവിൻ’ എന്ന കല്പനാരൂപം സമൂഹത്തോടുള്ള ബഹുവചന അഭിസംബോധനയും ഗൗരവവും നിലനിർത്തുന്നു; അനാവശ്യമായ പുരാതന പദക്രമം ഒഴിവാക്കി.
