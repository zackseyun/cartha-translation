source:
  edition: WLC
  text: אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הַעֲלִ֤יתָ עָלָי/ו֙ עוֹלֹ֔ת לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
translation:
  language: ml
  text: പൂർണമായ കല്ലുകൾകൊണ്ട്[a] നിന്റെ ദൈവമായ യാഹ്‌വേയുടെ യാഗപീഠം പണിയണം; അതിന്മേൽ നിന്റെ ദൈവമായ യാഹ്‌വേക്കു ഹോമയാഗങ്ങൾ അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ചെത്താത്ത കല്ലുകൾ.’ എബ്രായപദത്തിന് അക്ഷരാർഥത്തിൽ ‘പൂർണമായ/മുഴുവനായ കല്ലുകൾ’ എന്നാണ് അർഥം; അവയിൽ ഇരുമ്പുപകരണം ഉപയോഗിക്കരുതെന്ന 5-ാം വാക്യത്തിലെ നിർദേശം ‘ചെത്താത്ത’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: പൂർണമായ കല്ലുകൾ
  rationale: שְׁלֵמוֹת എന്ന വിശേഷണത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘പൂർണമായ/മുഴുവനായ’ എന്ന ആശയം നിലനിർത്തുന്നു. ‘ചെത്താത്ത’ എന്നത് 5-ാം വാക്യത്തിലെ ഇരുമ്പുപകരണം ഉപയോഗിക്കരുതെന്ന സന്ദർഭത്തിൽനിന്നുള്ള വ്യാഖ്യാനമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: תִּבְנֶה
  choice: പണിയണം
  rationale: നിയമപരമായ നിർദേശസന്ദർഭത്തിലെ നിർബന്ധസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִזְבַּח
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പണത്തിനുള്ള ഘടനയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും കൃത്യവുമായ മലയാളപദം.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവം
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം പ്രകടിപ്പിക്കുന്ന ഉടമ്പടിബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: അതിന്‍മേൽ ... അർപ്പിക്കണം
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ബലിസന്ദർഭത്തിലുള്ള ‘അർപ്പിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עוֹלֹת
  choice: ഹോമയാഗങ്ങൾ
  rationale: മുഴുവനായി ദഹിപ്പിച്ചിരുന്ന ഈ യാഗവിഭാഗത്തിനുള്ള പ്രചാരമുള്ളതും കൃത്യവുമായ മലയാളപരിഭാഷ.
- source_word: לַיהוָה
  choice: യാഹ്‌വേക്കു
  rationale: ל എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്ന സമർപ്പണത്തിന്റെ ലക്ഷ്യം മലയാളത്തിലെ ദത്തിവിഭക്തിയിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: യഹോവ
  rationale: എബ്രായപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ ഒരു സ്ഥാനപ്പേരിനു പകരം അതിന്റെ സാധാരണ പണ്ഡിതലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: שְׁלֵמוֹת എന്നത് വ്യാഖ്യാനാത്മകമായി ‘ചെത്താത്ത’ എന്നു പരിഭാഷപ്പെടുത്തണമോ
  choice: പൂർണമായ കല്ലുകൾ
  alternative: ചെത്താത്ത കല്ലുകൾ
  rationale: വിശേഷണത്തിന്റെ നേരിട്ടുള്ള അർഥം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; 5-ാം വാക്യത്തിലെ ഇരുമ്പുപകരണം സംബന്ധിച്ച വിലക്കിൽനിന്നു ലഭിക്കുന്ന സന്ദർഭപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധന നിലനിർത്താൻ ‘നിന്റെ’ എന്നു നൽകി; വാക്യത്തിലെ ആവർത്തനവും സംരക്ഷിച്ചു.
