  text: אֵ֠לֶּה יַֽעַמְד֞וּ לְ/בָרֵ֤ךְ אֶת הָ/עָם֙ עַל הַ֣ר גְּרִזִ֔ים בְּ/עָבְרְ/כֶ֖ם אֶת הַ/יַּרְדֵּ֑ן שִׁמְעוֹן֙ וְ/לֵוִ֣י וִֽ/יהוּדָ֔ה וְ/יִשָּׂשכָ֖ר וְ/יוֹסֵ֥ף וּ/בִנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/012.yaml
  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: ml
  text: 'നിങ്ങൾ യോർദ്ദാൻ കടന്നശേഷം ജനത്തെ അനുഗ്രഹിക്കാനായി ഗെരിസീം മലയിൽ നിൽക്കേണ്ടവർ ഇവരാണ്: ശിമെയോൻ, ലേവി, യെഹൂദാ, യിസ്സാഖാർ, യോസേഫ്[a], ബെന്യാമീൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ ഗോത്രപ്പട്ടികയിൽ യോസേഫ് എന്ന പേര് യോസേഫിൽനിന്നുള്ള എഫ്രയീം, മനശ്ശെ എന്നീ ഗോത്രങ്ങളെ പ്രതിനിധാനം ചെയ്യുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: אֵלֶּה יַעַמְדוּ
  choice: നിൽക്കേണ്ടവർ ഇവരാണ്
  rationale: നിയമപരമായ നിർദേശത്തിന്റെ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെറും ഭാവികാല പ്രവചനമായി ചുരുക്കുന്നില്ല.
- source_word: לְבָרֵךְ אֶת־הָעָם
  choice: ജനത്തെ അനുഗ്രഹിക്കാനായി
  rationale: לְ ചേർന്ന infinitive construct ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; הָעָם എന്നത് ഇസ്രായേൽ സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עַל הַר גְּרִזִים
  choice: ഗെരിസീംമലയിൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരം ചെയ്ത്, പർവതത്തിന്മേലുള്ള സ്ഥാനം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകി.
- source_word: בְּעָבְרְכֶם אֶת־הַיַּרְדֵּן
  choice: നിങ്ങൾ യോർദ്ദാൻ കടന്നശേഷം
  rationale: בְּ + infinitive construct കാലസംബന്ധം സൂചിപ്പിക്കുന്നു. ചടങ്ങ് നദി കടന്നതിനു പിന്നാലെയാണെന്ന ക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וְיוֹסֵף וּבִנְיָמִן
  choice: ശിമെയോൻ, ലേവി, യെഹൂദാ, യിസ്സാഖാർ, യോസേഫ്, ബെന്യാമീൻ
  rationale: പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളിൽ ലിപ്യന്തരം ചെയ്തു; മൂലപാഠത്തിലെ ഗോത്രപ്പട്ടിക മാറ്റമില്ലാതെ നിലനിർത്തി.
theological_decisions:
- issue: ഗോത്രങ്ങളുടെ സ്ഥാനവും ചുമതലയും സംബന്ധിച്ച നിർദേശത്തിന്റെ സ്വഭാവം
  choice: ‘നിൽക്കേണ്ടവർ’ എന്ന നിർദേശാത്മക രൂപം
  alternative: ‘നിൽക്കും’ എന്ന പ്രവചനാത്മക രൂപം
  rationale: മോശെയുടെ ഉടമ്പടിസംബന്ധമായ ചടങ്ങിനുള്ള നിർദേശമാണ് സന്ദർഭം; അതിനാൽ നിർബന്ധകത നിലനിർത്തി, എന്നാൽ അനാവശ്യമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർത്തില്ല.
- issue: ഗോത്രപ്പട്ടികയിലെ യോസേഫ് എന്ന പേരിന്റെ അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘യോസേഫ്’ എന്നു തന്നെ നിലനിർത്തി
  alternative: ‘യോസേഫിന്റെ ഗോത്രങ്ങൾ’ അല്ലെങ്കിൽ ‘എഫ്രയീമും മനശ്ശെയും’ എന്ന് വികസിപ്പിക്കൽ
  rationale: എബ്രായ മൂലപാഠം യോസേഫ് എന്നു മാത്രമാണ് പറയുന്നത്. പ്രതിനിധാനസ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നത് മൂലപാഠത്തോടുള്ള വിശ്വസ്തതയും വായനാസഹായവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വാക്യത്തിന്റെ നിർദേശാത്മകതയും ചടങ്ങിന്റെ സമയക്രമവും വ്യക്തമായി സൂക്ഷിച്ചു; പേരുകൾ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകി.
