id: DEU.27.13
reference: Deuteronomy 27:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה יַֽעַמְד֥וּ עַל הַ/קְּלָלָ֖ה בְּ/הַ֣ר עֵיבָ֑ל רְאוּבֵן֙ גָּ֣ד וְ/אָשֵׁ֔ר וּ/זְבוּלֻ֖ן דָּ֥ן וְ/נַפְתָּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: ml
  text: 'ശാപത്തിനായി ഏബാൽമലയിൽ നിൽക്കേണ്ടവർ ഇവരാണ്: രൂബേൻ[a], ഗാദ്, ആശേർ, സെബൂലൂൻ, ദാൻ, നഫ്താലി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശാപം പ്രഖ്യാപിക്കുന്നതിനായി” അല്ലെങ്കിൽ “ശപിക്കുന്നതിനായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവരാണ്
  rationale: മുൻവാക്യത്തിലെ അനുബന്ധ പട്ടികയോട് വൈരുധ്യസമാന്തരമായി ഈ കൂട്ടത്തെ പരിചയപ്പെടുത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഊന്നൽ നൽകുന്നു.
- source_word: יַעַמְדוּ
  choice: നിൽക്കേണ്ടവർ
  rationale: മോശെയുടെ നിർദേശത്തിനുള്ളിലെ ഭാവികാല കർത്തവ്യഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל הַקְּלָלָה
  choice: ശാപത്തിനായി
  rationale: ശാപവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ നിയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ശാപം ഉച്ചരിക്കുക എന്ന ക്രിയ എബ്രായത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: בְּהַר עֵיבָל
  choice: ഏബാൽമലയിൽ
  rationale: മലയുടെ മേലുള്ള സ്ഥാനത്തെ മലയാളത്തിലെ പതിവായ സ്ഥലനിർദേശരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: എബ്രായ വ്യക്തി/ഗോത്രനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: גָּד
  choice: ഗാദ്
  rationale: എബ്രായ വ്യക്തി/ഗോത്രനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אָשֵׁר
  choice: ആശേർ
  rationale: എബ്രായ വ്യക്തി/ഗോത്രനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: זְבוּלֻן
  choice: സെബൂലൂൻ
  rationale: എബ്രായ വ്യക്തി/ഗോത്രനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: דָּן
  choice: ദാൻ
  rationale: എബ്രായ വ്യക്തി/ഗോത്രനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: נַפְתָּלִי
  choice: നഫ്താലി
  rationale: എബ്രായ വ്യക്തി/ഗോത്രനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: ശാപവുമായി ബന്ധപ്പെട്ട ഗോത്രങ്ങളുടെ ആചാരപരമായ പങ്ക്
  choice: ശാപത്തിനായി
  alternative: ശാപം പ്രഖ്യാപിക്കുന്നതിനായി; ശപിക്കുന്നതിനായി
  rationale: എബ്രായപാഠം ‘പ്രഖ്യാപിക്കുക’ എന്ന ക്രിയ വ്യക്തമാക്കുന്നില്ല. അനുഗ്രഹവും ശാപവും സംബന്ധിച്ച ചടങ്ങിലെ നിയോഗം സന്ദർഭം സൂചിപ്പിക്കുന്നുവെങ്കിലും, പ്രവർത്തി അനാവശ്യമായി നിർവചിക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പട്ടികയുടെ ചടങ്ങുസംബന്ധിയായ സ്വഭാവം നിലനിർത്തുകയും എബ്രായത്തിലെ സംക്ഷിപ്തത അനാവശ്യമായി വിശദീകരിക്കാതിരിക്കുകയും ചെയ്തു.
