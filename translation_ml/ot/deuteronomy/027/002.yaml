  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֗ה בַּ/יּוֹם֮ אֲשֶׁ֣ר תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֒ אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ וַ/הֲקֵמֹתָ֤ לְ/ךָ֙ אֲבָנִ֣ים גְּדֹל֔וֹת וְ/שַׂדְתָּ֥ אֹתָ֖/ם בַּ/שִּֽׂיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: ml
  text: നിങ്ങൾ യോർദ്ദാൻ കടന്ന് നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകുന്ന ദേശത്തു പ്രവേശിക്കുന്ന ദിവസം, നീ നിനക്കായി വലിയ കല്ലുകൾ നാട്ടിനിർത്തണം; അവയ്ക്കു ചുണ്ണാമ്പ് പൂശണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയ്ക്കു കുമ്മായം പൂശണം’; എബ്രായ നാമം ആവരണമായി ഉപയോഗിക്കുന്ന ചുണ്ണാമ്പിനെയോ കുമ്മായത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם
  choice: …പ്രവേശിക്കുന്ന ദിവസം
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യം പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗത്തിന്റെ കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘അങ്ങനെ സംഭവിക്കും’ എന്ന അനാവശ്യ ഘടന ഒഴിവാക്കുന്നു.
- source_word: תַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: നിങ്ങൾ യോർദ്ദാൻ കടന്ന്
  rationale: עבר എന്ന ക്രിയ ഇവിടെ നദിയുടെ ഒരു കരയിൽനിന്ന് മറുകരയിലേക്കുള്ള കടക്കലാണ് സൂചിപ്പിക്കുന്നത്. ക്രിയയുടെ രണ്ടാംപുരുഷ ബഹുവചനവും ‘നിങ്ങൾ’ വഴി നിലനിർത്തുന്നു.
- source_word: אֶל הָאָרֶץ
  choice: ദേശത്തു പ്രവേശിക്കുന്ന
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന אֶל സ്വാഭാവിക മലയാളത്തിൽ ‘ദേശത്തു പ്രവേശിക്കുക’ എന്നു പ്രകടമാക്കുന്നു; אֶרֶץ എന്നതിന്റെ ഭൂമിശാസ്ത്രപരവും ഉടമ്പടിസംബന്ധവുമായ ‘ദേശം’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: נֹתֵן
  choice: നൽകുന്ന
  rationale: എബ്രായ വർത്തമാനകൃദ്‌രൂപത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്നതോ ഉറപ്പുള്ളതോ ആയ ദാനപ്രവൃത്തിയെ മലയാളത്തിലെ ബന്ധകൃദ്‌രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַהֲקֵמֹתָ לְךָ
  choice: നീ നിനക്കായി … നാട്ടിനിർത്തി
  rationale: ഹിഫീൽ ക്രിയയുടെ ‘സ്ഥാപിക്കുക/നാട്ടിനിർത്തുക’ എന്ന അർഥവും לְךָയിലെ ഏകവചന സ്വപ്രയോജനഭാവവും നിലനിർത്തുന്നു.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: വലിയ കല്ലുകൾ
  rationale: വലിപ്പം സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: അവയ്ക്കു ചുണ്ണാമ്പ് പൂശണം
  rationale: കല്ലുകളുടെ മേൽ ചുണ്ണാമ്പ്/കുമ്മായം ഒരു ആവരണമായി പൂശുന്നതാണ് പ്രയോഗത്തിന്റെ അർഥം. മലയാളത്തിൽ സ്വാഭാവികവും പ്രവർത്തിയും വസ്തുവും വ്യക്തവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്. അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ, ‘Yahweh’ എന്ന അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: സംബോധനയിലെ വചനമാറ്റം
  choice: ‘നിങ്ങൾ’ എന്ന ബഹുവചനത്തിൽനിന്ന് ‘നിന്റെ/നിനക്കു/നീ’ എന്ന ഏകവചനത്തിലേക്കുള്ള മാറ്റം നിലനിർത്തി
  alternative: വാക്യം മുഴുവൻ ബഹുവചനമാക്കുക
  rationale: മൂലപാഠം תַּעַבְרוּ എന്ന ബഹുവചനത്തിൽനിന്ന് אֱלֹהֶיךָ, לָךְ, וַהֲקֵמֹתָ, לְךָ എന്നീ ഏകവചന രൂപങ്ങളിലേക്കു മാറുന്നു. ഇസ്രായേലിനെ സമൂഹമായും ഏകഘടകമായും അഭിസംബോധന ചെയ്യുന്ന ഈ യഥാർഥ വ്യാകരണവലിവ് ഏകീകരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ബഹുവചന–ഏകവചന മാറ്റം മനപ്പൂർവം നിലനിർത്തിയതിനാൽ മലയാളത്തിലും ‘നിങ്ങൾ’ എന്നതിനു പിന്നാലെ ‘നിന്റെ/നിനക്കു/നീ’ വരുന്നു. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘ചുണ്ണാമ്പ് പൂശണം’ എന്ന പ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
