reference: Deuteronomy 27:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָר֗וּר שֹׁכֵב֙ עִם אֲחֹת֔/וֹ בַּת אָבִ֖י/ו א֣וֹ בַת אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: ml
  text: തന്റെ പിതാവിന്റെ മകളോ മാതാവിന്റെ മകളോ ആയ സഹോദരിയോടുകൂടെ ശയിക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ. ജനമെല്ലാം, “ആമേൻ” എന്നു പറയും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ഉടമ്പടിശാപത്തിന്റെ വിധിപ്രഖ്യാപനസ്വഭാവം നിലനിർത്തുന്ന, വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: שֹׁכֵב עִם
  choice: കൂടെ ശയിക്കുന്നവൻ
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും ഗൗരവമുള്ള നിയമശൈലിയും നിലനിർത്തുന്നു; മലയാളത്തിലും സന്ദർഭത്തിൽ അർഥം വ്യക്തമാണ്.
- source_word: אֲחֹתוֹ
  choice: തന്റെ സഹോദരി
  rationale: മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ നേരിട്ടുള്ള ബന്ധുത്വപദം സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: അവൾ തന്റെ പിതാവിന്റെ മകളായാലും മാതാവിന്റെ മകളായാലും
  rationale: പിതൃവഴിയിലോ മാതൃവഴിയിലോ ഉള്ള സഹോദരിയെ ഉൾക്കൊള്ളുന്ന നിയമപരമായ വിശദീകരണം ആവർത്തനവും വ്യത്യാസവും നിലനിർത്തി വ്യക്തമാക്കുന്നു.
- source_word: וְאָמַר כָּל הָעָם
  choice: ജനമെല്ലാം ... എന്നു പറയണം
  rationale: ആരാധനാക്രമത്തിൽ സമൂഹം നൽകേണ്ട നിർദേശിത പ്രതികരണത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אָמֵן
  choice: ആമേൻ
  rationale: എബ്രായ ആരാധനാപരമായ സ്ഥിരീകരണപദത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം; ഉടമ്പടിസമ്മതത്തിന്റെ സ്വരം നിലനിർത്തുന്നു.
theological_decisions:
- issue: രക്തബന്ധത്തിലുള്ള സഹോദരിയുടെ പരിധി
  choice: ‘സഹോദരി’ എന്നു പറഞ്ഞശേഷം പിതാവിന്റെ മകളായാലും മാതാവിന്റെ മകളായാലും എന്നു വ്യക്തമാക്കുക
  alternative: ഇത് അർധസഹോദരിമാരെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കുക
  rationale: എബ്രായവാക്യം പിതൃബന്ധമോ മാതൃബന്ധമോ ഉള്ള സഹോദരിയെ നിയമപരമായി നിർവചിക്കുന്നു; പൂർണസഹോദരിയെയോ അർധസഹോദരിയെയോ കൃത്രിമമായി ഒഴിവാക്കാതെ മൂലപാഠത്തിന്റെ പരിധി സംരക്ഷിക്കുന്നു.
- issue: നിയമവാക്യത്തിലെ പുരുഷ ഏകവചന കർത്താവ്
  choice: ‘ശയിക്കുന്നവൻ’ എന്ന പുരുഷരൂപം ഉപയോഗിക്കുക
  alternative: ലിംഗനിരപേക്ഷമായി പരാവർത്തനം ചെയ്യുക
  rationale: എബ്രായത്തിലെ പുരുഷ ഏകവചന കർത്താവിനെയും ബന്ധപദങ്ങളെയും മലയാളത്തിൽ സുതാര്യമായി പ്രതിഫലിപ്പിക്കുന്നു; അതേസമയം ‘പുരുഷൻ’ എന്ന പദം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമ-ആരാധനാശൈലി സ്വീകരിച്ചു. ‘കൂടെ ശയിക്കുക’ എന്ന പ്രയോഗം മൂലത്തിലെ ലൈംഗിക സൂചനയുള്ള ശൈലി നിലനിർത്തുന്നു; സമൂഹത്തിന്റെ നിർബന്ധിത പ്രതികരണത്തിന് ‘പറയണം’ എന്ന സ്വാഭാവിക നിർദേശരൂപം ഉപയോഗിച്ചു.
