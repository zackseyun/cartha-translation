  text: וְ/עָנ֣וּ הַ/לְוִיִּ֗ם וְ/אָֽמְר֛וּ אֶל כָּל אִ֥ישׁ יִשְׂרָאֵ֖ל ק֥וֹל רָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/014.yaml
  text: And the Levites shall answer and say to every man of Israel with a loud voice:[a]
translation:
  language: ml
  text: ലേവ്യർ ഇസ്രായേലിലെ ഓരോ പുരുഷനോടും ഉച്ചത്തിൽ ഉത്തരം പറഞ്ഞ് ഇപ്രകാരം പറയണം:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഓരോ ഇസ്രായേല്യനോടും.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിലെ ഓരോ പുരുഷനോടും’ എന്നാണ്; ഇവിടെ ഏകവചന പുല്ലിംഗപ്രയോഗത്തിന് പ്രതിനിധാനപരമായ അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ
  choice: മറുപടി പറയണം
  rationale: ענה ഇവിടെ ഉടമ്പടിസംബന്ധമായ ഔപചാരിക പ്രതികരണമോ പ്രഖ്യാപനമോ ആരംഭിക്കുന്നു. നിർദേശത്തിന്റെ പശ്ചാത്തലം അറിയിക്കാൻ ‘പറയണം’ ഉപയോഗിച്ചു.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: എബ്രായപാഠം പുരോഹിതന്മാർ എന്നല്ല, വ്യക്തമായി ‘ലേവ്യർ’ എന്നാണ് പറയുന്നത്; അതിനാൽ പദത്തിന്റെ കൃത്യത നിലനിർത്തി.
- source_word: וְאָמְרוּ
  choice: ഇങ്ങനെ ... പറയണം
  rationale: אמר എന്ന സാധാരണ സംസാരക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും തുടർന്നുവരുന്ന പ്രഖ്യാപനത്തിന് ആമുഖമാകുന്ന ഭാവം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ ഓരോ പുരുഷനോടും
  rationale: אִישׁ ഏകവചന പുല്ലിംഗമായ ‘പുരുഷൻ’ എന്നാണ്. അതിന്റെ പ്രതിനിധാനപരമായ കൂട്ടാർഥം മാറ്റാതെ മൂലരൂപത്തിലെ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: קוֹל רָם
  choice: ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ
  rationale: പൊതുവായി എല്ലാവരും കേൾക്കത്തക്ക വിധത്തിലുള്ള ഔപചാരിക പ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: אִישׁ എന്ന പദത്തിലെ പ്രതിനിധാനപരമായ പുല്ലിംഗഭാഷ
  choice: ഇസ്രായേലിലെ ഓരോ പുരുഷനോടും
  alternative: ഓരോ ഇസ്രായേല്യനോടും
  rationale: എബ്രായത്തിൽ ഏകവചന പുല്ലിംഗപദം കൂട്ടത്തെ പ്രതിനിധാനം ചെയ്യുന്ന വിധത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. ‘ഓരോ ഇസ്രായേല്യനോടും’ എന്നത് വ്യാപ്തി സ്വാഭാവികമായി വ്യക്തമാക്കുമെങ്കിലും മൂലത്തിലെ വ്യക്തമായ പുല്ലിംഗരൂപം മിനുക്കിക്കളയും; അതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. ‘മറുപടി പറയണം’ എന്നത് രണ്ട് എബ്രായക്രിയകളെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ‘ഇങ്ങനെ’ തുടർന്നുവരുന്ന ശാപപ്രഖ്യാപനങ്ങൾക്ക് വ്യക്തമായ ആമുഖം നൽകുന്നു.
