source:
  edition: WLC
  text: אָר֕וּר שֹׁכֵ֖ב עִם חֹֽתַנְתּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/023.yaml
  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: ml
  text: “തന്റെ അമ്മായിയമ്മയുമായി ശയിക്കുന്നവൻ[a] ശപിക്കപ്പെട്ടവൻ.” ജനമെല്ലാം, “ആമേൻ” എന്നു പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, തന്റെ അമ്മായിയമ്മയുമായി ലൈംഗികബന്ധം പുലർത്തുന്നവൻ. എബ്രായ മൂലപാഠത്തിൽ ‘കൂടെ ശയിക്കുക’ എന്ന സൗമ്യപ്രയോഗമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ഉടമ്പടിശാപം പ്രഖ്യാപിക്കുന്ന വിധേയപ്രയോഗത്തിന്റെ ശക്തി വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: שֹׁכֵב עִם
  choice: കൂടെ ശയിക്കുന്നവൻ
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സൗമ്യോക്തിയായ ‘കൂടെ കിടക്കുക’ എന്ന ആശയം മാന്യമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֹתַנְתּוֹ
  choice: തന്റെ അമ്മായിയമ്മ
  rationale: חֹתֶנֶת എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘mother-in-law’ ആണ്; മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം ‘തന്റെ’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְאָמַר
  choice: എന്നു പറയണം
  rationale: ആചാരപരമായി ജനമെല്ലാം നൽകേണ്ട പ്രതികരണത്തിന്റെ നിർദേശാത്മക സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל הָעָם
  choice: ജനമെല്ലാം
  rationale: മൂലപാഠത്തിലെ ‘സകല ജനവും’ എന്ന അർഥം അധിക വിശദീകരണം ചേർക്കാതെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אָמֵן
  choice: ആമേൻ
  rationale: എബ്രായ ആരാധനാപരമായ സമ്മതപ്രതികരണം മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിയമവാക്യത്തിലെ ലൈംഗിക സൗമ്യോക്തി
  choice: ‘കൂടെ ശയിക്കുന്നവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി, ലൈംഗികബന്ധമാണ് ഉദ്ദേശ്യമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: ‘ലൈംഗികബന്ധം പുലർത്തുന്നവൻ’ എന്നു മുഖ്യപാഠത്തിൽത്തന്നെ തുറന്നുപറയുക.
  rationale: മൂലഭാഷയുടെ മാന്യമായ സൗമ്യോക്തിയും നിയമപരമായ വ്യക്തതയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- issue: പുരുഷലിംഗ ഏകവചന കർത്താവ്
  choice: ‘ശയിക്കുന്നവൻ … ശപിക്കപ്പെട്ടവൻ’ എന്ന പുരുഷലിംഗ ഏകവചനരൂപം നിലനിർത്തുക.
  alternative: ലിംഗനിഷ്പക്ഷമായി ‘ശയിക്കുന്നയാൾ’ എന്നു നൽകുക.
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ഏകവചന കൃതന്തത്തിന്റെ രൂപം പ്രതിഫലിപ്പിക്കുന്നു; അതേസമയം മലയാളത്തിൽ സ്വാഭാവികമായ ശാപസൂത്രവാക്യം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായി ഗ്രഹിക്കാവുന്നതുമായ നിയമ-ആരാധനാശൈലി. ‘ശയിക്കുക’ എന്നത് മൂലത്തിലെ സൗമ്യോക്തി സംരക്ഷിക്കുന്നു; ‘പറയണം’ ആചാരപരമായ നിർദേശത്തിന്റെ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
