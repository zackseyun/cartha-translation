id: DEU.27.19
reference: Deuteronomy 27:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: ml
  text: പരദേശിയുടെയും[a] പിതാവില്ലാത്തവന്റെയും വിധവയുടെയും ന്യായം വളച്ചൊടിക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ. എല്ലാ ജനവും, “ആമേൻ,” എന്നു പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പരദേശി” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം ഗേർ ആണ്; ഇസ്രായേലിന്റെ ഇടയിൽ താമസിച്ചിരുന്ന സ്വദേശിയല്ലാത്ത ഒരാളെ അത് സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ഉടമ്പടിശാപത്തിന്റെ സൂത്രവാക്യസ്വഭാവവും വിധിപ്രഖ്യാപനത്തിന്റെ ശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַטֶּה
  choice: വഴിതെറ്റിക്കുന്നവൻ
  rationale: נטה എന്ന ധാതുവിന്റെ ഹിഫീൽ പ്രയോഗം ഇവിടെ നീതിയെ ശരിയായ വഴിയിൽനിന്നു തിരിച്ചുവിടുക അഥവാ വളച്ചൊടിക്കുക എന്ന നിയമപരമായ ആശയം നൽകുന്നു.
- source_word: מִשְׁפַּט
  choice: നീതി
  rationale: ഈ സന്ദർഭത്തിൽ ദുർബലർക്കു ലഭിക്കേണ്ട നീതിയും നിയമപരമായ അവകാശവും ഉൾക്കൊള്ളുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: גֵּר
  choice: പ്രവാസി
  rationale: ഇസ്രായേലിന്റെ ഇടയിൽ സ്വന്തം ദേശത്തിനു പുറത്തു താമസിച്ചിരുന്ന, സാമൂഹികമായി ദുർബലനായ അന്യദേശവാസിയെ സൂചിപ്പിക്കാൻ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന പദം.
- source_word: יָתוֹם
  choice: അനാഥൻ
  rationale: പിതൃസംരക്ഷണം നഷ്ടപ്പെട്ടവൻ എന്ന എബ്രായ നിയമ-സാമൂഹിക വിഭാഗത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אַלְמָנָה
  choice: വിധവ
  rationale: എബ്രായ സാമൂഹിക-നിയമ വിഭാഗത്തിന്റെ നേരിട്ടുള്ളതും പ്രചാരത്തിലുള്ളതുമായ മലയാള തുല്യം.
- source_word: וְאָמַר כָּל הָעָם
  choice: ജനമെല്ലാം ... എന്നു പറയണം
  rationale: ചടങ്ങിൽ സമൂഹം നൽകേണ്ട നിർദേശിത പ്രതികരണം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אָמֵן
  choice: ആമേൻ
  rationale: ഉടമ്പടി പ്രഖ്യാപനത്തോടുള്ള സ്ഥിരമായ ആരാധനാക്രമ പ്രതികരണം ലിപ്യന്തരണം ചെയ്ത് അതിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദുർബലരായ മൂന്ന് സാമൂഹിക വിഭാഗങ്ങളെ ആധുനിക രാഷ്ട്രീയ വിഭാഗങ്ങളാക്കി മാറ്റാതെ അവതരിപ്പിക്കൽ
  choice: പ്രവാസി, അനാഥൻ, വിധവ
  alternative: അന്യദേശവാസി, പിതാവില്ലാത്തവൻ, വിധവ
  rationale: മൂലപാഠത്തിലെ ചരിത്രപരവും നിയമപരവുമായ വിഭാഗങ്ങളെയും അവരുടെ ദുർബലാവസ്ഥയെയും നിലനിർത്തുന്നു; അതേസമയം ഏതെങ്കിലും ആധുനിക നയപരമായ അർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആരാധനാക്രമ ശൈലി. വാക്യഘടന വായിക്കാൻ ലളിതമാക്കിയെങ്കിലും ഉടമ്പടിശാപത്തിന്റെ ഔപചാരിക ശക്തി നിലനിർത്തിയിരിക്കുന്നു.
