revisions:
- from: പ്രവാസിയുടെയും[a] അനാഥന്റെയും വിധവയുടെയും നീതി വഴിതെറ്റിക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ. ജനമെല്ലാം, “ആമേൻ,” എന്നു പറയണം.
  to: പരദേശിയുടെയും[a] പിതാവില്ലാത്തവന്റെയും വിധവയുടെയും ന്യായം വളച്ചൊടിക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ. എല്ലാ ജനവും, “ആമേൻ,” എന്നു പറയണം.
  rationale: ഗേർ, യാതോം, മിശ്പാത്ത് എന്നീ നിയമ-സാമൂഹിക പദങ്ങളുടെ അർഥവ്യത്യാസങ്ങൾ കൂടുതൽ കൃത്യമായി പ്രതിഫലിപ്പിക്കാൻ പദങ്ങൾ പരിഷ്കരിച്ചു. ശാപപ്രഖ്യാപനത്തിന്റെ ഔപചാരികതയും ജനത്തിന്റെ നിർദേശിത ‘ആമേൻ’ പ്രതികരണവും നിലനിർത്തിയിരിക്കുന്നു.
