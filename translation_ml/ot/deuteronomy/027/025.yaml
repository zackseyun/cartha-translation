source:
  edition: WLC
  text: אָרוּר֙ לֹקֵ֣חַ שֹׁ֔חַד לְ/הַכּ֥וֹת נֶ֖פֶשׁ דָּ֣ם נָקִ֑י וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/025.yaml
  text: Cursed is the one who takes a bribe to strike down an innocent person[a], and all the people shall say, ‘Amen.’
translation:
  language: ml
  text: കുറ്റമില്ലാത്ത ഒരാളെ കൊന്നുകളയാൻ കൈക്കൂലി വാങ്ങുന്നവൻ ശപിക്കപ്പെട്ടവൻ.[a] ജനമെല്ലാം ‘ആമേൻ’ എന്നു പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിരപരാധ രക്തത്തെ അടിച്ചുവീഴ്ത്താൻ.’ ‘നിരപരാധ രക്തം’ എന്ന ഹീബ്രായ പ്രയോഗം കുറ്റമില്ലാത്ത ഒരാളെ, പ്രത്യേകിച്ച് അയാളെ കൊല്ലുന്നതിലൂടെ ഉണ്ടാകുന്ന രക്തഗിൽറ്റിനെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ഉടമ്പടിശാപത്തിന്റെ വിധിപ്രഖ്യാപനസ്വഭാവം നിലനിർത്തുന്ന, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: לֹקֵחַ
  choice: വാങ്ങുന്നവൻ
  rationale: സുബ്സ്റ്റാന്റീവ് സ്വഭാവമുള്ള ഖാൽ കൃതന്തത്തിന്റെ പൊതുവായ ഏകവചനബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שֹׁחַד
  choice: കൈക്കൂലി
  rationale: നീതി അട്ടിമറിക്കാനോ കുറ്റകരമായ പ്രവൃത്തി ചെയ്യിക്കാനോ നൽകുന്ന അനധികൃത പ്രതിഫലത്തിനുള്ള വ്യക്തമായ ആധുനിക മലയാളപദം.
- source_word: לְהַכּוֹת
  choice: കൊന്നുകളയാൻ
  rationale: נכה എന്ന ക്രിയയ്ക്ക് അടിക്കുക, വീഴ്ത്തുക, കൊല്ലുക എന്നീ അർഥങ്ങൾ വരാം; ‘കുറ്റമില്ലാത്ത രക്തം’ എന്ന പ്രയോഗത്തോടൊപ്പം ഇവിടെ മാരകമായ പ്രവൃത്തിയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: נֶפֶשׁ דָּם נָקִי
  choice: കുറ്റമില്ലാത്ത ഒരാളെ
  rationale: ഹീബ്രായിലെ ദുഷ്കരമായ ‘കുറ്റമില്ലാത്ത രക്തത്തിന്റെ ജീവൻ/വ്യക്തി’ എന്ന ഘടനയുടെ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു; മൂലരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְאָמַר כָּל הָעָם
  choice: ജനമെല്ലാം … എന്നു പറയണം
  rationale: ആരാധനാപരവും നിയമപരവുമായ സന്ദർഭത്തിലെ നിർദേശിത സമൂഹപ്രതികരണത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָמֵן
  choice: ആമേൻ
  rationale: ഉടമ്പടിപ്രഖ്യാപനത്തോടുള്ള അംഗീകാരസൂത്രമായി മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടിശാപസൂത്രത്തിന്റെ അവതരണം
  choice: കുറ്റമില്ലാത്ത ഒരാളെ കൊന്നുകളയാൻ കൈക്കൂലി വാങ്ങുന്നവൻ ശപിക്കപ്പെട്ടവൻ
  alternative: കുറ്റമില്ലാത്ത രക്തത്തെ വീഴ്ത്താൻ കൈക്കൂലി വാങ്ങുന്നവൻ ശപിക്കപ്പെട്ടവൻ
  rationale: നിയമപരവും ഉടമ്പടിപരവുമായ ശാപത്തിന്റെ ബലം നിലനിർത്തിക്കൊണ്ട് ഹീബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘കുറ്റമില്ലാത്ത രക്തം’ എന്ന മൂലരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാഭാവം. ‘ശപിക്കപ്പെട്ടവൻ,’ ‘കൈക്കൂലി,’ ‘ആമേൻ’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; കൃത്രിമമായ പുരാതനശൈലി ഒഴിവാക്കി.
