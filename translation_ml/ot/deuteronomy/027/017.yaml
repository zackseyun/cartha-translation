  to: അയൽക്കാരന്റെ അതിർത്തിക്കല്ല്[a] മാറ്റുന്നവൻ ശപിക്കപ്പെട്ടവൻ. സകല ജനവും, “ആമേൻ,” എന്ന് പറയണം.
