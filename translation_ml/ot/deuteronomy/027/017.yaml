source:
  edition: WLC
  text: אָר֕וּר מַסִּ֖יג גְּב֣וּל רֵעֵ֑/הוּ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/017.yaml
  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: ml
  text: അയൽക്കാരന്റെ അതിർത്തിക്കല്ല്[a] മാറ്റുന്നവൻ ശപിക്കപ്പെട്ടവൻ. സകല ജനവും, “ആമേൻ,” എന്ന് പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിർത്തി.” എബ്രായപദം സ്വത്തിന്റെ അതിർത്തിയെയോ അതു സൂചിപ്പിക്കുന്ന അടയാളത്തെയോ കുറിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: നിയമപട്ടികയിലെ ഉടമ്പടിശാപപ്രഖ്യാപനത്തിന്റെ ഗൗരവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַסִּיג
  choice: നീക്കിവെക്കുന്നവൻ
  rationale: അതിർത്തി അടയാളം വെറുതെ എടുത്തുകളയുന്നതിലുപരി, മറ്റൊരിടത്തേക്കു മാറ്റി അതിർത്തി വ്യാജമായി മാറ്റുന്ന പ്രവൃത്തിയെ പങ്കാളി രൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: גְּבוּל
  choice: അതിർത്തിക്കല്ല്
  rationale: ഈ ഭൂസ്വത്ത്-നിയമസന്ദർഭത്തിൽ അതിർത്തിയെയോ അതു സൂചിപ്പിക്കുന്ന അടയാളത്തെയോ പദം കുറിക്കാം; മലയാളത്തിൽ പുരാതന ഭൂമിയതിർത്തിയുടെ മൂർത്തമായ അടയാളം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: רֵעֵהוּ
  choice: അയൽക്കാരന്റെ
  rationale: സമൂഹത്തിലെ സഹാംഗത്തെയോ അടുത്തവനെയോ സൂചിപ്പിക്കുന്ന നിയമ-സാമൂഹിക അർഥത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: וְאָמַר
  choice: അപ്പോൾ ... എന്നു പറയണം
  rationale: ജനത്തിന്റെ ഔപചാരികവും നിർബന്ധിതവുമായ ഉടമ്പടി-പ്രതികരണത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל הָעָם
  choice: ജനമെല്ലാം
  rationale: മൂലത്തിലെ ‘സകല ജനവും’ എന്ന സമഗ്രത നിലനിർത്തുന്നു; വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ‘ഇസ്രായേൽ’ എന്നത് ചേർക്കുന്നില്ല.
- source_word: אָמֵן
  choice: ആമേൻ
  rationale: എബ്രായത്തിലെ സമൂഹപരമായ സമ്മതപ്രതികരണത്തെ പരിചിതമായ ആരാധനാപദമായി നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-നിയമസന്ദർഭത്തിലെ ശാപപ്രഖ്യാപനം
  choice: അയൽക്കാരന്റെ അതിർത്തിക്കല്ല് നീക്കിവെക്കുന്നവൻ ശപിക്കപ്പെട്ടവൻ
  alternative: അയൽക്കാരന്റെ അതിർത്തി മാറ്റുന്നവൻ ശപിക്കപ്പെട്ടവൻ
  rationale: ഭൂമിയുടെ അതിർത്തി വഞ്ചനാപരമായി മാറ്റുന്നതിനെതിരായ ഔപചാരിക ശാപത്തിന്റെ നിയമപരവും സമൂഹപരവുമായ ഗൗരവം നിലനിർത്തുന്നു; അടയാളവും അതിർത്തിയും തമ്മിലുള്ള അർഥബന്ധം അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
- issue: പുരുഷലിംഗ ഏകവചന പങ്കാളിയുടെ പ്രതിനിധാനസ്വഭാവം
  choice: നീക്കിവെക്കുന്നവൻ
  alternative: നീക്കിവെക്കുന്ന ആൾ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ഏകവചനം ഒരു പ്രതിനിധാന നിയമകേസായി മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; വചനത്തെ ബഹുവചന പൊതുപ്രസ്താവനയാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാശൈലി. ‘അതിർത്തിക്കല്ല്’ സാധാരണ വായനക്കാരന് പുരാതന ഭൂസ്വത്ത്-സന്ദർഭം വ്യക്തമാക്കുന്നു; മൂലപദത്തിന്റെ സാധ്യതാവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
