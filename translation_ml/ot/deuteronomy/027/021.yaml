id: DEU.27.21
reference: Deuteronomy 27:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָר֕וּר שֹׁכֵ֖ב עִם כָּל בְּהֵמָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: ml
  text: “ഏതെങ്കിലും മൃഗത്തോടൊപ്പം ശയിക്കുന്നവൻ[a] ശപിക്കപ്പെട്ടവൻ.” ജനമെല്ലാം, “ആമേൻ” എന്നു പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഏതെങ്കിലും മൃഗത്തോടൊപ്പം ശയിക്കുന്ന ആരും.” ഹീബ്രുവിൽ പുല്ലിംഗ ഏകവചനരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ഉടമ്പടിശാപത്തിന്റെ ഗൗരവമുള്ള പ്രഖ്യാപനരൂപം നിലനിർത്തുന്ന, വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: שֹׁכֵב
  choice: ശയിക്കുന്നവൻ
  rationale: ഇവിടെ ക്രിയയ്ക്ക് ലൈംഗികമായ അർഥമാണുള്ളത്. മൂലപാഠത്തിലെ പരോക്ഷപ്രയോഗം നിലനിർത്തുന്നതിനായി കൂടുതൽ തുറന്ന വിശദീകരണത്തിനു പകരം ‘ശയിക്കുന്നവൻ’ സ്വീകരിച്ചു.
- source_word: עִם
  choice: ത്തോടൊപ്പം
  rationale: ‘ശയിക്കുക’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായി ചേരുകയും ഹീബ്രു മുൻവ്യയത്തിന്റെ അർഥം നേരിട്ട് നൽകുകയും ചെയ്യുന്നു.
- source_word: כָּל
  choice: ഏതെങ്കിലും
  rationale: ഏകവചനത്തിലുള്ള അനിശ്ചിത നാമത്തോടു ചേർന്ന വിതരണാർഥം നിയമസന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּהֵמָה
  choice: മൃഗം
  rationale: വളർത്തുമൃഗങ്ങളിൽ മാത്രം പരിമിതപ്പെടുത്താതെ പ്രസക്തമായ വിശാലവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ആധുനിക പൊതുപദം.
- source_word: וְאָמַר
  choice: എന്നു പറയണം
  rationale: ഉടമ്പടിച്ചടങ്ങിൽ ജനങ്ങൾ നൽകേണ്ട നിർബന്ധിത പ്രതികരണത്തിന്റെ വിധിപരമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כָּל הָעָם
  choice: ജനമെല്ലാം
  rationale: ‘എല്ലാ ജനവും’ എന്ന മൂലപാഠത്തിന്റെ അർഥം അധിക സന്ദർഭവിവരം ചേർക്കാതെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אָמֵן
  choice: ആമേൻ
  rationale: ഉടമ്പടി അംഗീകരിക്കുന്ന ആരാധനാക്രമപരമായ പ്രതികരണം മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിയമശാപസൂത്രത്തിലെ പുല്ലിംഗ ഏകവചന കർത്തൃവാചക കൃദന്തം
  choice: ശയിക്കുന്നവൻ
  alternative: ശയിക്കുന്ന ആരും
  rationale: ഹീബ്രുവിലെ രൂപം പുല്ലിംഗ ഏകവചനമാണ്; ‘-വൻ’ അത് മലയാളത്തിൽ ദൃശ്യമാക്കുന്നു. നിയമവാക്യം പൊതുവായി വായിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാക്രമ ശൈലി. ലൈംഗിക പ്രവൃത്തിയെ മൂലപാഠംപോലെ പരോക്ഷമായി സൂചിപ്പിക്കുന്നു; ‘പറയണം’ ചടങ്ങിലെ നിർദേശഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
