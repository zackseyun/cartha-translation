source:
  edition: WLC
  text: אָר֕וּר מַכֵּ֥ה רֵעֵ֖/הוּ בַּ/סָּ֑תֶר וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/024.yaml
  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: ml
  text: “തന്റെ അയൽക്കാരനെ രഹസ്യമായി അടിച്ചുവീഴ്ത്തുന്നവൻ[a] ശപിക്കപ്പെട്ടവൻ.” ജനമെല്ലാം, “ആമേൻ” എന്നു പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പ്രഹരിക്കുന്നവൻ” അല്ലെങ്കിൽ “കൊല്ലുന്നവൻ”; എബ്രായ ക്രിയയ്ക്ക് പ്രഹരിക്കൽ മുതൽ മാരകമായ അക്രമം വരെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ഉടമ്പടിശാപത്തിന്റെ പ്രഖ്യാപനരൂപം വ്യക്തമായും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: מַכֵּה
  choice: അടിച്ചുവീഴ്ത്തുന്നവൻ
  rationale: נכה എന്ന ക്രിയയ്ക്ക് പ്രഹരിക്കൽ മുതൽ മാരകമായ അക്രമംവരെ അർഥവ്യാപ്തിയുണ്ട്. ഇവിടെ അക്രമത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അത് നിർബന്ധമായും കൊലപാതകമാണെന്ന് ചുരുക്കാതെ ഈ പ്രയോഗം നൽകുന്നു.
- source_word: רֵעֵהוּ
  choice: തന്റെ അയൽക്കാരനെ
  rationale: സമൂഹത്തിലെ സഹജീവിയെയോ കൂട്ടാളിയെയോ സൂചിപ്പിക്കുന്ന സാധാരണ അർഥം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ബൈബിൾ ഭാഷയിൽ പരിചിതവുമാണ്.
- source_word: בַּסָּתֶר
  choice: രഹസ്യമായി
  rationale: പൊതുദൃഷ്ടിയിൽപ്പെടാതെ മറച്ചുവെച്ച് ചെയ്യുന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאָמַר
  choice: എന്നു പറയണം
  rationale: ചടങ്ങിലെ ജനസമൂഹത്തിന്റെ നിർദിഷ്ട പ്രതികരണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל הָעָם
  choice: ജനമെല്ലാം
  rationale: മൂലപാഠത്തിലെ ‘സകല ജനവും’ എന്ന ആശയം അധിക വിശദീകരണം ചേർക്കാതെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אָמֵן
  choice: ആമേൻ
  rationale: ഉടമ്പടിപരവും ആരാധനാക്രമപരവുമായ അംഗീകാരപ്രതികരണമായി മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
theological_decisions:
- issue: מַכֵּה സൂചിപ്പിക്കുന്ന അക്രമത്തിന്റെ തീവ്രത
  choice: അടിച്ചുവീഴ്ത്തുന്നവൻ
  alternative: പ്രഹരിക്കുന്നവൻ; കൊല്ലുന്നവൻ
  rationale: എബ്രായ ക്രിയയുടെ അർഥം സാധാരണ പ്രഹരം മുതൽ മരണകരമായ അക്രമംവരെ വ്യാപിക്കുന്നു. ‘അടിച്ചുവീഴ്ത്തുന്നു’ എന്നത് പ്രവൃത്തിയുടെ ഗൗരവം കാത്തുസൂക്ഷിക്കുമ്പോഴും കൊലപാതകം മാത്രമാണെന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാക്രമഭാഷ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ശാപപ്രഖ്യാപനത്തിന്റെ മുൻനിരസ്ഥാനം ഉദ്ധരണിയിലൂടെ നിലനിർത്തി; പദാർത്ഥപരമായ അടിക്കുറിപ്പ് ബന്ധപ്പെട്ട ക്രിയയ്ക്കു പിന്നാലെ ചേർത്തു.
