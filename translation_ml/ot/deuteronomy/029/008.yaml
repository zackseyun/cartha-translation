  text: וּ/שְׁמַרְתֶּ֗ם אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם לְמַ֣עַן תַּשְׂכִּ֔ילוּ אֵ֖ת כָּל אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/008.yaml
  text: So keep the words of this covenant and do them[a], so that you may act wisely in all that you do.
translation:
  language: ml
  text: ഈ ഉടമ്പടിയുടെ വചനങ്ങൾ പാലിക്കുകയും അവ അനുഷ്ഠിക്കുകയും ചെയ്യുവിൻ; അങ്ങനെ നിങ്ങൾ ചെയ്യുന്നതിലെല്ലാം വിവേകത്തോടെ പ്രവർത്തേണ്ടതിന്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിങ്ങൾ ചെയ്യുന്നതിലെല്ലാം വിജയിക്കും” അഥവാ “അഭിവൃദ്ധിപ്പെടും.”'
    reason: תַּשְׂכִּילוּ എന്ന ക്രിയയ്ക്ക് വിവേകത്തോടെ പ്രവർത്തിക്കുക, വിജയിക്കുക, അഭിവൃദ്ധിപ്പെടുക എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: അതുകൊണ്ട് ... പാലിക്കുകയും
  rationale: וְ സന്ദർഭത്തിലെ നിഗമനബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘അതുകൊണ്ട്’ എന്നു നൽകി; ഉടമ്പടിസന്ദർഭത്തിലെ שׁמר ബാധ്യതകൾ വിശ്വസ്തമായി പാലിക്കുക എന്ന അർഥം വഹിക്കുന്നു.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: ഈ ഉടമ്പടിയുടെ വചനങ്ങൾ
  rationale: דִּבְרֵי എന്നതിന്റെ പദസംബന്ധം നിലനിർത്തിക്കൊണ്ട്, ഉടമ്പടിയുടെ പ്രഖ്യാപിത ഉള്ളടക്കം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: അവ അനുഷ്ഠിക്കുകയും ചെയ്യുക
  rationale: ബഹുവചനമായ אֹתָם മുൻപുള്ള ‘വചനങ്ങൾ’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്. ‘അവ അനുഷ്ഠിക്കുക’ എന്നത് ‘അവ ചെയ്യുക’ എന്നതിനെക്കാൾ സ്വാഭാവികവും അനുസരണത്തിന്റെ പ്രായോഗികത വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: לְמַעַן
  choice: അപ്പോൾ
  rationale: ഇവിടെ അനുസരണവും തുടർന്നുള്ള ഫലമോ ലക്ഷ്യമോ തമ്മിലുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; കർശനമായി ഫലം മാത്രം നിർണയിക്കാതെ ഉദ്ദേശ്യം/ഫലം എന്നീ സാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു.
- source_word: תַּשְׂכִּילוּ
  choice: വിവേകത്തോടെ പ്രവർത്തിക്കാൻ കഴിയും
  rationale: שׂכל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘വിവേകത്തോടെ പ്രവർത്തിക്കുക’ എന്ന മുഖ്യഭാവം നേരിട്ട് നൽകുന്നു; ‘വിജയിക്കുക’ എന്ന ഫലസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֵת כָּל אֲשֶׁר תַּעֲשׂוּן
  choice: നിങ്ങൾ ചെയ്യുന്നതിലെല്ലാം
  rationale: പ്രവർത്തനത്തിന്റെ സമഗ്ര വ്യാപ്തി സൂചിപ്പിക്കുന്ന כָּל אֲשֶׁר സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പകരുന്നു.
theological_decisions:
- issue: תַּשְׂכִּילוּ എന്നതിൽ ജ്ഞാനപൂർവമായ പ്രവർത്തനമോ വിജയകരമായ ഫലമോ
  choice: പ്രധാന പാഠത്തിൽ ‘വിവേകത്തോടെ പ്രവർത്തിക്കാൻ കഴിയും’
  alternative: ‘നിങ്ങൾ ചെയ്യുന്നതിലെല്ലാം വിജയിക്കും’ അഥവാ ‘അഭിവൃദ്ധിപ്പെടും’
  rationale: ഈ ക്രിയ ജ്ഞാനപൂർവമായ പെരുമാറ്റത്തെയും അതിൽനിന്നുള്ള വിജയത്തെയും സൂചിപ്പിക്കാം. പ്രധാന പാഠം പ്രവൃത്തിയുടെ വിവേകഭാവം മുൻനിർത്തുന്നു; ഉടമ്പടി അനുസരണത്തെ ഭൗതിക സമൃദ്ധിയെന്ന സിദ്ധാന്തമായി ചുരുക്കാതിരിക്കാനും യഥാർഥ ഫലസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്താനും ഈ രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഉടമ്പടി’, ‘വചനങ്ങൾ’, ‘അനുഷ്ഠിക്കുക’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സുതാര്യമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
