id: DEU.29.5
reference: Deuteronomy 29:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֶ֚חֶם לֹ֣א אֲכַלְתֶּ֔ם וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שְׁתִיתֶ֑ם לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/005.yaml
  text: You did not eat bread[a], and you did not drink wine or strong drink, so that you might know that I am Yahweh your God.
translation:
  language: ml
  text: നിങ്ങൾ അപ്പം ഭക്ഷിച്ചില്ല; വീഞ്ഞോ ലഹരിയുണ്ടാക്കുന്ന പാനീയമോ[a] കുടിച്ചില്ല; ഞാൻ നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെ ആണെന്ന് നിങ്ങൾ അറിയേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വീര്യമുള്ള പാനീയം.’ എബ്രായപദം ഒരു പ്രത്യേക പാനീയത്തെ മാത്രമല്ല, വീഞ്ഞല്ലാത്ത വിവിധ പുളിപ്പിച്ച ലഹരിപാനീയങ്ങളെയും പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: പദത്തിന്റെ പ്രാഥമികവും മൂർത്തവുമായ അർഥം ‘അപ്പം’ എന്നാണ്; ഭക്ഷണം എന്ന വിശാലാർഥം സാധ്യമെങ്കിലും ഇവിടെ വീഞ്ഞിനോടും വീര്യമുള്ള പാനീയത്തോടും ചേർന്നുള്ള പട്ടികയിൽ മൂലപദത്തിന്റെ വ്യക്തത നിലനിർത്തുന്നു.
- source_word: אֲכַלְתֶּם
  choice: നിങ്ങൾ ഭക്ഷിച്ചില്ല
  rationale: എബ്രായ പൂർണക്രിയ മരുഭൂമിയിലെ കഴിഞ്ഞ അനുഭവത്തെ സംഗ്രഹിക്കുന്നു; മലയാളത്തിൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: יַיִן
  choice: വീഞ്ഞ്
  rationale: സന്ദർഭത്തിന് യോജിച്ച പതിവ് നിഘണ്ടു അർഥം.
- source_word: שֵׁכָר
  choice: വീര്യമുള്ള പാനീയം
  rationale: വീഞ്ഞിൽനിന്ന് വേർതിരിച്ചുപറയുന്ന, ലഹരിയുണ്ടാക്കുന്ന പുളിപ്പിച്ച പാനീയങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ഒരു പ്രത്യേക പാനീയമായി ചുരുക്കുന്നില്ല.
- source_word: שְׁתִיתֶם
  choice: നിങ്ങൾ കുടിച്ചില്ല
  rationale: കഴിഞ്ഞ മരുഭൂയാത്രാനുഭവത്തിന്റെ സ്വാഭാവിക മലയാള ഭൂതകാല വിവരണം.
- source_word: לְמַעַן
  choice: അറിയേണ്ടതിനായിരുന്നു
  rationale: ഉദ്ദേശ്യമോ ലക്ഷ്യമിട്ട ഫലമോ സൂചിപ്പിക്കുന്ന ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תֵּדְעוּ
  choice: നിങ്ങൾ അറിയേണ്ടതിന്
  rationale: ഉദ്ദേശ്യസൂചകമായ לְמַעַן എന്നതോടൊപ്പം അറിവിലേക്കുള്ള ലക്ഷ്യം വ്യക്തമാക്കുന്നു; ഫലത്തെ നിർബന്ധിതമായി പ്രഖ്യാപിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: ഉടമസ്ഥബന്ധമുള്ള എബ്രായ പ്രയോഗത്തിന്റെ നേരായ മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ Yahweh എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനു പകരം മൂലനാമത്തോട് കൂടുതൽ അടുത്ത രൂപം സ്വീകരിച്ചു.
- issue: לְמַעַן സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം–ഫലം ബന്ധം
  choice: നിങ്ങൾ അറിയേണ്ടതിനായിരുന്നു
  alternative: അങ്ങനെ നിങ്ങൾ അറിഞ്ഞു
  rationale: എബ്രായഘടന ലക്ഷ്യമോ ഉദ്ദേശിച്ച ഫലമോ സൂചിപ്പിക്കുന്നു; അതിനെ നിർബന്ധിതമായി സഫലമായ ഫലമായി മാറ്റാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അപ്പം,’ ‘വീഞ്ഞ്’ എന്നീ മൂർത്തപദങ്ങൾ സംരക്ഷിച്ചു. ‘വീര്യമുള്ള പാനീയം’ സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യമായിരിക്കെ എബ്രായപദത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു.
