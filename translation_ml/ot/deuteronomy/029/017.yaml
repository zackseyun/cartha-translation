  rationale: The revision corrects the Malayalam grammatical ambiguity in the first clause through a natural relative construction while preserving the Hebrew's explicit sequence of person, woman, clan, and tribe, its ongoing/incipient participial sense, and both repeated warning clauses. The footnote is refined to preserve the disputed lexical range of רֹאשׁ without over-specifying it as a particular plant. Its anchor remains directly after the root phrase it explains.
