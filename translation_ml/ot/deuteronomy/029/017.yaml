source:
  edition: WLC
  text: פֶּן יֵ֣שׁ בָּ֠/כֶם אִ֣ישׁ אוֹ אִשָּׁ֞ה א֧וֹ מִשְׁפָּחָ֣ה אוֹ שֵׁ֗בֶט אֲשֶׁר֩ לְבָב֨/וֹ פֹנֶ֤ה הַ/יּוֹם֙ מֵ/עִם֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ לָ/לֶ֣כֶת לַ/עֲבֹ֔ד אֶת אֱלֹהֵ֖י הַ/גּוֹיִ֣ם הָ/הֵ֑ם פֶּן יֵ֣שׁ בָּ/כֶ֗ם שֹׁ֛רֶשׁ פֹּרֶ֥ה רֹ֖אשׁ וְ/לַעֲנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/017.yaml
  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
translation:
  language: ml
  text: ഇന്നു നമ്മുടെ ദൈവമായ യഹ്‌വെയെ വിട്ട് ആ ജനതകളുടെ ദേവന്മാരെ ചെന്നു സേവിക്കാൻ ഹൃദയം തിരിയുന്ന ഒരു പുരുഷനോ സ്ത്രീയോ, ഒരു കുലമോ ഗോത്രമോ നിങ്ങളുടെ ഇടയിൽ ഉണ്ടായിരിക്കരുത്; വിഷവും കാഞ്ഞിരവും വിളയിക്കുന്ന ഒരു വേര് നിങ്ങളുടെ ഇടയിൽ ഉണ്ടായിരിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിഷമുള്ള വിളവും കാഞ്ഞിരവും പുറപ്പെടുവിക്കുന്ന ഒരു വേര്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ רֹאשׁ എന്ന പദം വിഷത്തെയോ വിഷമുള്ള വിളവിനെയോ സൂചിപ്പിക്കാം.
    reason: רֹאשׁ എന്ന പദത്തിന്റെ ‘വിഷം’ എന്നും ‘വിഷമുള്ള വിളവ്’ എന്നും ഉള്ള അർത്ഥസാധ്യതകൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: פֶּן יֵשׁ בָּכֶם
  choice: നിങ്ങളുടെ ഇടയിൽ ... ഉണ്ടാകരുത്
  rationale: മുന്നറിയിപ്പോടുകൂടിയ സാധ്യതയെ സൂചിപ്പിക്കുന്ന פֶּן എന്ന പദത്തിന്റെ ജാഗ്രതാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ഒരു പുരുഷനോ സ്ത്രീയോ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുരുഷൻ–സ്ത്രീ ദ്വയം പൊതുവായ ഒരു പദത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: מִשְׁפָּחָה אוֹ שֵׁבֶט
  choice: ഒരു കുലമോ ഗോത്രമോ
  rationale: מִשְׁפָּחָה ഇവിടെ ഒറ്റ കുടുംബത്തെക്കാൾ വിപുലമായ ബന്ധുസമൂഹത്തെയും שֵׁבֶט ഇസ്രായേലിലെ ഗോത്രഘടകത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: לְבָבוֹ פֹנֶה
  choice: ഹൃദയം തിരിയുന്നവരായി
  rationale: പങ്കാളിക്രിയയുടെ തുടരുന്നതോ ആരംഭിച്ചുകൊണ്ടിരിക്കുന്നതോ ആയ തിരിഞ്ഞുപോക്കിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: מֵעִם יְהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹ്‌വെയെ വിട്ട്
  rationale: ഉടമ്പടി-വിശ്വസ്തതയിൽനിന്നുള്ള അകൽച്ച വ്യക്തമാക്കുകയും ദൈവനാമം നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: לָלֶכֶת לַעֲבֹד
  choice: ചെന്നു സേവിക്കാൻ
  rationale: ചലനവും ഉദ്ദേശ്യവും ചേർന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: שֹׁרֶשׁ פֹּרֶה רֹאשׁ וְלַעֲנָה
  choice: വിഷവും കാഞ്ഞിരവും വിളയിക്കുന്ന ഒരു വേര്
  rationale: വേരിൽനിന്ന് ദോഷകരമായ വിളവ് ഉത്ഭവിക്കുന്ന രൂപകം നിലനിർത്തുന്നു; רֹאשׁ എന്നതിന്റെ വിഷം/വിഷച്ചെടി എന്ന അർത്ഥപരിധി അതിയായി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർക്ഷര ദൈവനാമം ഒരു പദവിയാക്കി മാറ്റാതെ, സാധാരണയായി അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ഹൃദയം തിരിയുന്നതിന്റെ കാലഭാവം
  choice: ഹൃദയം തിരിയുന്നവരായി
  alternative: ഹൃദയം തിരിഞ്ഞവരായി
  rationale: പൂർത്തിയായ വിശ്വാസത്യാഗം മാത്രം സൂചിപ്പിക്കാതെ, ഇപ്പോൾ നടക്കുന്നതോ ആരംഭിക്കുന്നതോ ആയ തിരിഞ്ഞുപോക്കിന്റെ പങ്കാളിക്രിയാഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വ്യക്തി, കുലം, ഗോത്രം എന്നീ ക്രമവും രണ്ടു മുന്നറിയിപ്പ് ഘടകങ്ങളുടെ ആവർത്തനവും രൂപകത്തിന്റെ കാഠിന്യവും നിലനിർത്തിയിരിക്കുന്നു.
