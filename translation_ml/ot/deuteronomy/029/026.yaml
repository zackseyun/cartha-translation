  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בָּ/אָ֣רֶץ הַ/הִ֑וא לְ/הָבִ֤יא עָלֶ֨י/הָ֙ אֶת כָּל הַ/קְּלָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֥פֶר הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/026.yaml
  text: So the anger of Yahweh burned against that land, to bring upon it every curse written in this book.
translation:
  language: ml
  text: അങ്ങനെ, ഈ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന എല്ലാ ശാപങ്ങളും ആ ദേശത്തിന്മേൽ വരുത്താൻ യഹ്‌വേയുടെ കോപം ആ ദേശത്തിനെതിരെ ജ്വലിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: കോപം ... ജ്വലിച്ചു
  rationale: എബ്രായ പ്രയോഗത്തിലെ ‘കോപം കത്തുക’ എന്ന സജീവമായ ദൃശ്യഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בָּאָרֶץ הַהִוא
  choice: ആ ദേശത്തിനെതിരെ
  rationale: ഈ സന്ദർഭത്തിൽ ב എന്ന ഉപസർഗം കോപം തിരിയുന്ന ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; ന്യായവിധി ദേശത്തിന്മേൽ പതിക്കുന്നതിനാൽ ‘എതിരെ’ എന്നത് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לְהָבִיא
  choice: വരുത്താൻ തന്നേ
  rationale: ക്രിയാനാമരൂപം കോപത്തിന്റെ ഫലമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു. ‘തന്നേ’ എന്നത് മുൻവാക്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുമ്പോഴും ഉദ്ദേശ്യം–ഫലം എന്ന സാധ്യത പൂർണമായി അടച്ചുപൂട്ടുന്നില്ല.
- source_word: עָלֶיהָ
  choice: അതിന്മേൽ
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ‘ദേശം’ എന്ന പദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അതിന്റെ സ്വാഭാവിക സർവനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: כָּל הַקְּלָלָה
  choice: ശാപമെല്ലാം
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപത്തിന് ഇവിടെ സമഗ്രമായ കൂട്ടാർഥമുണ്ട്. ‘ശാപമെല്ലാം’ സമ്പൂർണതയും മലയാളത്തിലെ സ്വാഭാവികതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: הַכְּתוּבָה
  choice: എഴുതിയിരിക്കുന്ന
  rationale: നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ രേഖാമൂലവും നിയമപരവുമായ ഭാവം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: ഈ പുസ്തകത്തിൽ
  rationale: סֵפֶר എന്നത് പുസ്തകം, ചുരുൾ, രേഖ എന്നിവയെ സൂചിപ്പിക്കാമെങ്കിലും ഈ ഉടമ്പടി-സന്ദർഭത്തിൽ ‘പുസ്തകം’ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സുഗ്രാഹ്യവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു ബിരുദനാമം പകരംവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്ന് ലിപ്യന്തരണം ചെയ്തു.
- issue: לְהָבִיא എന്ന ക്രിയാനാമത്തിന്റെ ഉദ്ദേശ്യം/ഫലം
  choice: വരുത്താൻ തന്നേ
  alternative: വരുത്തേണ്ടതിന്
  rationale: എബ്രായരൂപം ഉദ്ദേശ്യത്തെയോ ഫലത്തെയോ സൂചിപ്പിക്കാം. തിരഞ്ഞെടുത്ത രൂപം മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ ആ ബന്ധത്തെ കർശനമായി ഒരേയൊരു വിധത്തിൽ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം, എന്നാൽ ഉടമ്പടി-ന്യായവിധിയുടെ ഗൗരവം നിലനിർത്തുന്ന ഭാഷ. ‘കോപം ജ്വലിച്ചു’ എന്ന രൂപം എബ്രായ ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു; അനാവശ്യ സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
