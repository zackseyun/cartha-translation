source:
  edition: WLC
  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה אֶל כָּל יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אַתֶּ֣ם רְאִיתֶ֗ם אֵ֣ת כָּל אֲשֶׁר֩ עָשָׂ֨ה יְהוָ֤ה לְ/עֵֽינֵי/כֶם֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
translation:
  language: ml
  text: 'മോശെ ഇസ്രായേല്യരെയെല്ലാം വിളിച്ച് അവരോടു പറഞ്ഞു: “ഈജിപ്തുദേശത്ത് ഫറവോനോടും അവന്റെ സകല ദാസന്മാരോടും അവന്റെ സകല ദേശത്തോടും[a] യാഹ്‌വെ നിങ്ങളുടെ കൺമുന്നിൽ ചെയ്തതെല്ലാം നിങ്ങൾ കണ്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഫറവോനെതിരെയും അവന്റെ സകല ദാസന്മാർക്കെതിരെയും അവന്റെ സകല ദേശത്തിനെതിരെയും.” ഈജിപ്തിൽ യാഹ്‌വെ ചെയ്ത പ്രവൃത്തികൾ അവർക്കെതിരായ ന്യായവിധികളായിരുന്നുവെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കാൻ എബ്രായ ഉപസർഗം ഇങ്ങനെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ചുകൂട്ടി
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ ക്രിയ ഒരു ജനസമൂഹത്തെ വിളിച്ചുചേർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; വെറും ‘വിളിച്ചു’ എന്നതിനെക്കാൾ സന്ദർഭം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽജനത്തെ മുഴുവൻ
  rationale: ഉടമ്പടിജനത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന സമൂഹനാമമാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ ‘എല്ലാ’ എന്ന വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: רְאִיתֶם
  choice: നിങ്ങൾ കണ്ടിരിക്കുന്നു
  rationale: ശ്രോതാക്കൾ നേരിട്ടു സാക്ഷ്യംവഹിച്ച കഴിഞ്ഞ അനുഭവത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി എബ്രായ പൂർണ്ണക്രിയയിൽ നിലനിൽക്കുന്നതിനാൽ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: എബ്രായപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: לְעֵינֵיכֶם
  choice: നിങ്ങളുടെ കൺമുന്നിൽ
  rationale: സംഭവങ്ങൾ അവർ നേരിട്ടും പരസ്യമായും കണ്ടുവെന്ന ഊന്നൽ നൽകുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളസമാനതയാണ്.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്ത്
  rationale: എബ്രായത്തിലെ ‘ദേശം’ എന്ന ഘടകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: ഫറവോനോടും അവന്റെ എല്ലാ ദാസന്മാരോടും അവന്റെ ദേശം മുഴുവനോടും
  rationale: ആവർത്തിക്കുന്ന לְ എന്ന ഉപസർഗത്തിന്റെ വിശാലമായ ബന്ധാർത്ഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ‘എതിരെ’ എന്ന അർത്ഥവും സാധ്യമാണെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ഫറവോനോടും അവന്റെ ആളുകളോടും ദേശത്തോടുമുള്ള യാഹ്‌വെയുടെ പ്രവൃത്തികളുടെ ബന്ധം
  choice: ‘ഓട്’ എന്ന ബന്ധപ്രയോഗം ഉപയോഗിച്ച് അർത്ഥവ്യാപ്തി തുറന്നുവയ്ക്കുന്നു
  alternative: ‘എതിരെ’ എന്ന് വ്യക്തമാക്കി ന്യായവിധിയുടെ അർത്ഥം പ്രകടമാക്കുക
  rationale: ഈജിപ്തിലെ പ്രവൃത്തികൾ ന്യായവിധികളായിരുന്നുവെങ്കിലും לְ എന്ന ഉപസർഗം സ്വതവേ അത്ര മാത്രം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനം നിർബന്ധമാക്കാതെ യഥാർത്ഥ അർത്ഥസമ്മർദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കൺമുന്നിൽ’ പോലുള്ള സ്വാഭാവിക പ്രയോഗം മൂലപാഠത്തിന്റെ ദൃശ്യഊന്നൽ നിലനിർത്തുന്നു; ദൈവനാമം ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
