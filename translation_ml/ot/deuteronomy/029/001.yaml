revisions:
- from: 'മോശെ ഇസ്രായേൽജനത്തെ മുഴുവൻ വിളിച്ചുകൂട്ടി അവരോടു പറഞ്ഞു: “ഈജിപ്തുദേശത്ത് ഫറവോനോടും അവന്റെ എല്ലാ ദാസന്മാരോടും അവന്റെ ദേശം മുഴുവനോടും[a] യാഹ്‌വെ നിങ്ങളുടെ കൺമുന്നിൽ ചെയ്തതെല്ലാം നിങ്ങൾ കണ്ടിരിക്കുന്നു.”'
  to: 'മോശെ ഇസ്രായേല്യരെയെല്ലാം വിളിച്ച് അവരോടു പറഞ്ഞു: “ഈജിപ്തുദേശത്ത് ഫറവോനോടും അവന്റെ സകല ദാസന്മാരോടും അവന്റെ സകല ദേശത്തോടും[a] യാഹ്‌വെ നിങ്ങളുടെ കൺമുന്നിൽ ചെയ്തതെല്ലാം നിങ്ങൾ കണ്ടിരിക്കുന്നു.”'
  rationale: മൂലപാഠത്തിന്റെ ലളിതമായ ആഖ്യാനബലം നിലനിർത്താൻ ‘വിളിച്ചുകൂട്ടി’ ‘വിളിച്ച്’ എന്നാക്കി. സമാന്തരമായ ‘ഫറവോനോടും … ദാസന്മാരോടും … ദേശത്തോടും’ ഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും, לְ എന്ന ഉപസർഗത്തിന്റെ ‘എതിരെ’ എന്ന സന്ദർഭസാധ്യമായ അർത്ഥം അടിക്കുറിപ്പിൽ മാത്രം നിലനിർത്തുകയും ചെയ്തു.
