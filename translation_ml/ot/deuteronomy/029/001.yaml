    rationale: ക്രിയയ്ക്ക് ‘വിളിച്ചുകൂട്ടുക’ എന്ന സന്ദർഭാനുസൃത സാധ്യതയുണ്ടെങ്കിലും, ഈ വാക്യം അവരെ വിളിച്ചുകൂട്ടിയ പ്രവൃത്തി വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല; ‘വിളിച്ചു’ കൂടുതൽ നേരിട്ടുള്ള സമാനതയാണ്.
