reference: Deuteronomy 29:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְ/עָבְרְ/ךָ֗ בִּ/בְרִ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/בְ/אָלָת֑/וֹ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כֹּרֵ֥ת עִמְּ/ךָ֖ הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/011.yaml
  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ ഇന്ന് നിന്നോടു ചെയ്യുന്ന[b] ഉടമ്പടിയിലേക്കും അവിടുത്തെ ശപഥത്തിലേക്കും[a] നീ പ്രവേശിക്കേണ്ടതിനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശാപം ഉൾക്കൊള്ളുന്ന ശപഥം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഉടമ്പടിയിലെ ശാപവ്യവസ്ഥകളോടു ബന്ധപ്പെട്ട ഒരു ശപഥത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഇന്ന് നിന്നോടു മുറിക്കുന്ന’; ‘ഉടമ്പടി മുറിക്കുക’ എന്നത് ഉടമ്പടി ചെയ്യുക എന്നർഥമുള്ള എബ്രായ ശൈലിയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: לְעָבְרְךָ
  choice: നീ പ്രവേശിക്കേണ്ടതിനാണ്
  rationale: לְ ചേർന്ന infinitive ഇവിടെ ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്നു. ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ עבר എന്നത് അക്ഷരാർഥത്തിലുള്ള കടന്നുപോകലല്ല, ഉടമ്പടിബന്ധത്തിലേക്കും അതിന്റെ ബാധ്യതകളിലേക്കും പ്രവേശിക്കലാണ്.
- source_word: בִּבְרִית
  choice: ഉടമ്പടിയിൽ
  rationale: בְּרִית എന്നതിന്റെ സാധാരണവും ദൈവശാസ്ത്രപരമായി കേന്ദ്രവുമായ മലയാളരൂപം ‘ഉടമ്പടി’യാണ്; בְ എന്ന ഉപസർഗം ‘പ്രവേശിക്കുക’ എന്ന ക്രിയയോടൊപ്പം ‘-യിൽ’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം ‘നിന്റെ’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു; മലയാളവാക്യത്തിൽ ദൈവനാമത്തോടുള്ള വിശേഷണബന്ധം സ്വാഭാവികമാക്കാൻ ‘ദൈവമായ’ എന്നു നൽകി.
- source_word: וּבְאָלָתוֹ
  choice: അവിടുത്തെ ശപഥത്തിലും
  rationale: אָלָה ശപഥത്തെയും അതോടൊപ്പമുള്ള ശാപപരമായ ഉടമ്പടിശിക്ഷകളെയും സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിൽ വിശാലമായ ‘ശപഥം’ നിലനിർത്തി, ശാപത്തിന്റെ അർഥനിറം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כֹּרֵת
  choice: ചെയ്യുന്ന
  rationale: כרת ברית അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിക്കുക’ എന്ന എബ്രായ പ്രയോഗമാണ്. ആധുനിക മലയാളത്തിൽ അർഥം വ്യക്തമായിരിക്കാനായി ‘ഉടമ്പടി ചെയ്യുക’ എന്നു നൽകി; participle-ന്റെ സമകാലികഭാവം ‘ചെയ്യുന്ന’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: עִמְּךָ
  choice: നിന്നോടു
  rationale: രണ്ടാം പുരുഷ ഏകവചനരൂപം നേരിട്ട് സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: സമകാലികവും സ്വാഭാവികവുമായ മലയാള തുല്യപദം.
theological_decisions:
- issue: യഹ്‌വെ എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ יְהוָה എന്ന വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു. ‘യഹോവ’യ്ക്കു പകരം Yahweh-യോട് അടുത്ത ‘യഹ്‌വെ’ തിരഞ്ഞെടുത്തു.
- issue: אָלָה എന്ന പദത്തിലെ ശപഥം–ശാപം അർഥസംഘർഷം
  choice: പ്രധാനപാഠത്തിൽ ‘ശപഥം’; ശാപപരമായ അർഥനിറം അടിക്കുറിപ്പിൽ
  alternative: ശാപം / ശാപം ഉൾക്കൊള്ളുന്ന ശപഥം
  rationale: ഈ പദത്തിന് സത്യപ്രതിജ്ഞയും അതിന്റെ ലംഘനത്തിനുള്ള ശാപശിക്ഷയും ഉൾക്കൊള്ളാനാകും. പ്രധാനപാഠത്തിൽ ഒന്നിനെ മാത്രം അതിരുകടന്ന് ഉറപ്പിക്കാതെ വിശാലമായ അർഥം നൽകി, യഥാർഥ അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കൂട്ടായ ഇസ്രായേലിനെ അഭിസംബോധന ചെയ്യുന്ന മൂലത്തിലെ രണ്ടാം പുരുഷ ഏകവചനം ‘നീ/നിന്റെ/നിന്നോടു’ എന്ന രൂപങ്ങളിൽ നിലനിർത്തി. ‘അവിടുത്തെ’ എന്ന ആദരസൂചക ഉടമസ്ഥരൂപം ദൈവത്തെപ്പറ്റിയുള്ള മലയാളപ്രയോഗത്തിന് യോജിച്ചവിധം ഉപയോഗിച്ചു.
