revisions:
- from: നിന്റെ ദൈവമായ യഹ്‌വെ ഇന്ന് നിന്നോടു ചെയ്യുന്ന[b] ഉടമ്പടിയിലും അവിടുത്തെ ശപഥത്തിലും[a] നീ പ്രവേശിക്കേണ്ടതിനാണ്.
  to: നിന്റെ ദൈവമായ യഹ്‌വെ ഇന്ന് നിന്നോടു ചെയ്യുന്ന[b] ഉടമ്പടിയിലേക്കും അവിടുത്തെ ശപഥത്തിലേക്കും[a] നീ പ്രവേശിക്കേണ്ടതിനാണ്.
  rationale: ‘പ്രവേശിക്കുക’ എന്ന ക്രിയയോടു ചേർത്ത് ‘ഉടമ്പടിയിലേക്കും ... ശപഥത്തിലേക്കും’ എന്നു മാറ്റിയതിലൂടെ ഉദ്ദേശ്യവും പ്രവേശനത്തിന്റെ ദിശയും സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ വ്യക്തമായി. אָלָהയുടെ ശപഥം–ശാപം അർഥവ്യാപ്തി പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും അതിരുകടന്ന വ്യാഖ്യാനം കൂടാതെ സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ്-ചിഹ്നങ്ങൾ യഥാക്രമം ശപഥത്തിന്റെയും ‘ചെയ്യുന്ന’ എന്ന ഉടമ്പടി-നിർമ്മാണപ്രയോഗത്തിന്റെയും സമീപത്ത് നിലനിർത്തിയിരിക്കുന്നു.
