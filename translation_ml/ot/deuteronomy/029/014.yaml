  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי֩ אֶת אֲשֶׁ֨ר יֶשְׁנ֜/וֹ פֹּ֗ה עִמָּ֨/נוּ֙ עֹמֵ֣ד הַ/יּ֔וֹם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אֵ֨ת אֲשֶׁ֥ר אֵינֶ֛/נּוּ פֹּ֖ה עִמָּ֥/נוּ הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/014.yaml
  text: but with whoever is standing here with us today before Yahweh our God[a], and with whoever is not here with us today.
translation:
  language: ml
  text: പക്ഷേ, ഇന്ന് നമ്മുടെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ നമ്മോടൊപ്പം ഇവിടെ നിൽക്കുന്ന ഏവരോടും, ഇന്ന് നമ്മോടൊപ്പം ഇവിടെ ഇല്ലാത്ത ഏവരോടും കൂടെയാണ് ഈ ഉടമ്പടി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇന്ന് നമ്മോടൊപ്പം ഇവിടെ ഇല്ലാത്തവർ” എന്നത് ഈ സമ്മേളനത്തിൽ ഹാജരാകാത്ത ഇസ്രായേല്യരെയോ ഭാവിതലമുറകളെയോ ഇരുകൂട്ടരെയുമോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: മറിച്ച്
  rationale: മുൻവാക്യത്തിലെ ‘നിങ്ങളോടുമാത്രമല്ല’ എന്ന നിഷേധത്തെ തുടർന്നു ഉടമ്പടിയിൽ ഉൾപ്പെടുന്ന മറ്റുള്ളവരെ അവതരിപ്പിക്കുന്നതിനാൽ, ഇവിടെ കാരണസൂചകമായ ‘എന്തെന്നാൽ’ എന്നതിനെക്കാൾ വൈരുധ്യസൂചകമായ ‘മറിച്ച്’ യോജിക്കുന്നു.
- source_word: אֶת אֲשֶׁר
  choice: ഏവരോടും
  rationale: മുൻവാക്യത്തിലെ ഉടമ്പടി ചെയ്യുക/ശപഥത്തിൽ പ്രവേശിപ്പിക്കുക എന്ന ആശയത്തിൽനിന്ന് ‘-ഓടും’ എന്ന ബന്ധം പൂരിപ്പിച്ചിരിക്കുന്നു. ‘ഏവരോടും’ വ്യക്തികളെ വിതരണാത്മകമായി ഉൾക്കൊള്ളുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: יֶשְׁנוֹ
  choice: ഇവിടെ ... നിൽക്കുന്ന
  rationale: יֵשׁ രൂപം സാന്നിധ്യം സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള עֹמֵד എന്ന പദത്തോടൊപ്പം ചേർത്ത് വ്യക്തമായ മലയാളവാക്യമായി നൽകിയിരിക്കുന്നു.
- source_word: פֹּה עִמָּנוּ
  choice: നമ്മോടൊപ്പം ഇവിടെ
  rationale: സഭയിൽ ശാരീരികമായി സന്നിഹിതരായിരിക്കുന്നതും ‘നമ്മോടൊപ്പം’ എന്ന ബന്ധഭാവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עֹמֵד
  choice: നിൽക്കുന്ന
  rationale: ഉടമ്പടിസഭയിൽ ദൈവസന്നിധിയിൽ നിൽക്കുന്ന concrete posture നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: രണ്ടു ഖണ്ഡങ്ങളിലും ആവർത്തിക്കുന്ന കാലസൂചനയെ ആധുനികവും സ്വാഭാവികവുമായ രീതിയിൽ അതേപടി ആവർത്തിക്കുന്നു.
- source_word: לִפְנֵי
  choice: സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പാകെയുള്ള സ്ഥലപരവും ഉടമ്പടിപരവുമായ സാന്നിധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിന്റെ വ്യക്തിനാമരൂപം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ
  rationale: പ്രത്യയസഹിതമായ എബ്രായരൂപം നേരിട്ട് നൽകുകയും ‘യഹോവ’യുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְאֵת אֲשֶׁר אֵינֶנּוּ
  choice: ഇല്ലാത്ത ഏവരോടും
  rationale: ആദ്യഖണ്ഡത്തോട് സമാന്തരത നിലനിർത്തുന്നു; ‘ഹാജരാകാത്ത’ എന്നു വ്യാഖ്യാനിച്ച് പരിധി ചുരുക്കാതെ എബ്രായത്തിലെ അസ്തിത്വനിഷേധത്തോട് ചേർന്നുനിൽക്കുന്നു.
theological_decisions:
- issue: ‘ഇന്ന് നമ്മോടൊപ്പം ഇവിടെ ഇല്ലാത്തവർ’ എന്നവരുടെ പരിധി
  choice: ആരെ ഉദ്ദേശിക്കുന്നു എന്നു മുഖ്യവാചകത്തിൽ നിർണ്ണയിക്കാതെ വിശാലമായ പ്രയോഗം നിലനിർത്തുക
  alternative: സഭയിൽ ഹാജരാകാത്ത സമകാലിക ഇസ്രായേല്യർ മാത്രം; ഇനിയും ജനിക്കാത്ത ഭാവിതലമുറകൾ മാത്രം; അല്ലെങ്കിൽ ഇരുകൂട്ടരും
  rationale: എബ്രായവാചകം പരാമർശിക്കുന്ന കൂട്ടത്തെ കൂടുതൽ കൃത്യമായി നിർവചിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ തുറന്ന നില പരിഭാഷയിൽ സംരക്ഷിക്കുകയും സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന അപൂർണ ഘടന മലയാളത്തിൽ വ്യക്തമാക്കാൻ അവസാനത്തിൽ ‘ആണ്’ ചേർത്തിരിക്കുന്നു; ‘ഏവരോടും’ എന്ന പ്രയോഗം ഏകവചന-വിതരണാത്മക ഭാവവും കൂട്ടായ ഉൾക്കൊള്ളലും സ്വാഭാവികമായി കൈമാറുന്നു.
