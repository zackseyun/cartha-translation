id: DEU.29.13
reference: Deuteronomy 29:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֥א אִתְּ/כֶ֖ם לְ/בַדְּ/כֶ֑ם אָנֹכִ֗י כֹּרֵת֙ אֶת הַ/בְּרִ֣ית הַ/זֹּ֔את וְ/אֶת הָ/אָלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/013.yaml
  text: And it is not with you alone that I am making this covenant and this oath[b][a],
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളോടു മാത്രമല്ല ഞാൻ ഈ ഉടമ്പടിയും ഈ ശപഥവും[a] ചെയ്യുന്നത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഈ ശാപവും.’ എബ്രായപദം ശപഥത്തെയോ ആ ശപഥത്തോടു ബന്ധിച്ച ശാപശിക്ഷയെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘ഈ ഉടമ്പടി മുറിക്കുന്നത്.’ ‘ഉടമ്പടി ചെയ്യുക’ എന്നത് എബ്രായത്തിലെ ഈ ഉടമ്പടി-പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: എന്നാൽ ... മാത്രമല്ല
  rationale: സംയോജകവും നിഷേധവും മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ആ ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘എന്നാൽ ... മാത്രമല്ല’ എന്നു നൽകി.
- source_word: אִתְּכֶם לְבַדְּכֶם
  choice: നിങ്ങളോടുമാത്രമല്ല
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തോടുള്ള ബന്ധവും ‘മാത്രം’ എന്ന പരിമിതിയും വ്യക്തമായും സംക്ഷിപ്തമായും നിലനിർത്തുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ പ്രത്യക്ഷമായ ‘ഞാൻ’ എന്ന കർത്താവിലൂടെ മതിയായ വിധം പ്രകടമാകുന്നു.
- source_word: כֹּרֵת
  choice: ചെയ്യുന്നത്
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിക്കുക’ എന്ന പ്രയോഗമാണെങ്കിലും മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്യുക’ എന്നത് അർഥം സ്വാഭാവികമായി പകരുന്നു; മൂലരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: הַבְּרִית הַזֹּאת
  choice: ഈ ഉടമ്പടി
  rationale: ആവർത്തനപുസ്തകത്തിലെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ബന്ധത്തെ ‘ഉടമ്പടി’ കൃത്യമായി പകരുന്നു.
- source_word: וְאֶת הָאָלָה הַזֹּאת
  choice: ഈ ശപഥം
  rationale: אָלָה ശപഥത്തെയും അതിനോടു ബന്ധിച്ച ശാപശിക്ഷയെയും സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ ഉടമ്പടി ഉറപ്പിക്കുന്ന പ്രവൃത്തിയെ മുൻനിർത്തി ‘ശപഥം’ നൽകി, ‘ശാപം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: ഉടമ്പടിസന്ദർഭത്തിലെ אָלָה എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ശപഥം
  alternative: ശാപം
  rationale: בְּרִית-നോടൊപ്പം വരുന്ന אָלָה ഉടമ്പടി ഉറപ്പിക്കുന്ന ശപഥത്തെയും അതിലെ സ്വയംശാപപരമായ ശിക്ഷാവ്യവസ്ഥയെയും ഉൾക്കൊള്ളാം. മുഖ്യപാഠത്തിൽ ‘ശപഥം’ നൽകി; പദത്തിലെ ശാപസൂചന പരിഹരിച്ചുകളയാതെ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ വൈരുധ്യബന്ധം ‘എന്നാൽ’ കൊണ്ടും പരിമിതി ‘മാത്രമല്ല’ കൊണ്ടും വ്യക്തമാക്കി; സാങ്കേതിക പദമായി ‘ഉടമ്പടി’ നിലനിർത്തി.
