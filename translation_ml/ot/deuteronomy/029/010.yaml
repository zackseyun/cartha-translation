translation:
  language: ml
  text: നിങ്ങളുടെ കുഞ്ഞുങ്ങളും[a] ഭാര്യമാരും നിങ്ങളുടെ പാളയത്തിനകത്തുള്ള പരദേശിയും[b]—നിങ്ങളുടെ വിറക് വെട്ടുന്നവൻ മുതൽ നിങ്ങളുടെ വെള്ളം കോരുന്നവൻ വരെ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങളുടെ മക്കൾ.’ എബ്രായത്തിലെ טַף പ്രത്യേകിച്ച് ചെറിയ കുട്ടികളെയോ ആശ്രിതരെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിങ്ങളുടെയിടയിൽ താമസിക്കുന്ന വിദേശി.’ എബ്രായത്തിലെ גֵּר സമൂഹത്തിനകത്തു താമസിക്കുന്ന അന്യദേശക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: നിങ്ങളുടെ കുഞ്ഞുങ്ങൾ
  rationale: טַף പ്രധാനമായും ചെറിയ കുട്ടികളെയോ ആശ്രിതരെയോ സൂചിപ്പിക്കുന്നു. ‘കുഞ്ഞുങ്ങൾ’ എന്നത് പൊതുവായ ‘മക്കൾ’ എന്നതിനെക്കാൾ അതിന്റെ വ്യക്തമായ അർഥം നിലനിർത്തുന്നു.
- source_word: נְשֵׁיכֶם
  choice: ഭാര്യമാർ
  rationale: ഉടമ്പടി സമൂഹത്തിന്റെ ഈ സന്ദർഭത്തിൽ, രണ്ടാംപുരുഷ ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ נָשִׁים എന്നതിന് സ്വാഭാവികമായ ബന്ധസൂചക അർഥം ‘ഭാര്യമാർ’ എന്നാണ്.
- source_word: וְגֵרְךָ
  choice: നിങ്ങളുടെ പരദേശി
  rationale: גֵּר വഴിപോക്കനെയല്ല, സമൂഹത്തിനിടയിൽ താമസിക്കുന്ന അന്യദേശക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്. ഏകവചനത്തിലെ സമൂഹപ്രതിനിധാന സ്വഭാവവും ഉടമസ്ഥപ്രത്യയവും പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בְּקֶרֶב מַחֲנֶיךָ
  choice: നിങ്ങളുടെ പാളയത്തിനകത്തുള്ള
  rationale: ഈ പ്രയോഗം പരദേശിയെ ഇസ്രായേലിന്റെ പാളയത്തിനകത്തുള്ള ഒരാളായി നിർണയിക്കുന്നു; മലയാളത്തിൽ ബന്ധവാക്യത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵחֹטֵב עֵצֶיךָ
  choice: നിങ്ങൾക്കുവേണ്ടി വിറകുവെട്ടുന്നവൻമുതൽ
  rationale: മലയാളത്തിൽ ‘നിങ്ങളുടെ വിറക് വെട്ടുന്നവൻ’ എന്ന അസ്വാഭാവിക ഉടമസ്ഥപ്രയോഗം ഒഴിവാക്കി, സേവനബന്ധം ‘നിങ്ങൾക്കുവേണ്ടി’ എന്നു വ്യക്തമാക്കുന്നു. പങ്കാളിവാചകത്തിന്റെ പ്രവർത്തനഭാവവും מִן…עַד എന്ന പരിധിപ്രയോഗത്തിന്റെ തുടക്കവും നിലനിർത്തുന്നു.
- source_word: עַד שֹׁאֵב מֵימֶיךָ
  choice: വെള്ളം കോരുന്നവൻവരെ
  rationale: שֹׁאֵב വെള്ളം കോരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പങ്കാളിവാചകമാണ്. ‘വെള്ളം കോരുക’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്; ‘വരെ’ עַד-ന്റെ പരിധിഭാവം നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടി സമ്മേളനത്തിന്റെ സാമൂഹിക വ്യാപ്തി
  choice: കുഞ്ഞുങ്ങൾ, ഭാര്യമാർ, സമൂഹത്തിനകത്തു താമസിക്കുന്ന പരദേശി, താഴ്ന്ന നിലയിലുള്ള അധ്വാനികൾ എന്നിവരെയും പട്ടിക വ്യക്തമായി ഉൾക്കൊള്ളുന്നു.
  alternative: ഈ പട്ടിക ഇസ്രായേല്യരെ മാത്രമാണ് സൂചിപ്പിക്കുന്നത്; അല്ലെങ്കിൽ തൊഴിലാളികൾ കേവലം രൂപകാത്മക വിഭാഗങ്ങളാണ്.
  rationale: എബ്രായവാക്യത്തിന്റെ സ്വാഭാവിക അർഥം സമൂഹത്തിന്റെ വിവിധ തലങ്ങളിലുള്ളവരെ സമ്മേളനത്തിൽ ഉൾപ്പെടുത്തുന്ന യഥാർഥ പട്ടികയാണ്. വാചകം പറയുന്നതിലപ്പുറം ഒരു സിദ്ധാന്തനിഗമനവും പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഈ ഭാഗം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം വിരാമചിഹ്നം നിലനിർത്തുന്നു. ‘വിറക്’ എന്ന സാധാരണ പദവും ‘വെള്ളം കോരുക’ എന്ന സ്വാഭാവിക പ്രയോഗവും ഉപയോഗിച്ചു; യഥാർഥ പാഠത്തിലെ സാമൂഹിക വ്യാപ്തിയും ഏകവചന പ്രതിനിധാനരീതിയും സംരക്ഷിച്ചു.
