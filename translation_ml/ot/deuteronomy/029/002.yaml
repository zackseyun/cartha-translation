  source_fidelity: 'The draft accurately represents the Hebrew sequence: the great trials witnessed directly by the addressee''s eyes, followed by those great signs and wonders. However, the initial «ആ» adds a demonstrative nuance where the first Hebrew noun phrase is definite but not demonstrative. The demonstrative belongs specifically to the final phrase (הָהֵם).'
