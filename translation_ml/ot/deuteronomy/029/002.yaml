    issue: The initial phrase begins with «ആ വലിയ പരീക്ഷണങ്ങൾ».
    rationale: The Hebrew has a definite article on «trials» but no demonstrative there. Its demonstrative, «those», occurs with the later «signs and wonders». Malayalam can preserve this distribution by omitting «ആ» from the first phrase and retaining it in the second.
  revised_text: നിന്റെ കണ്ണുകൾ കണ്ട വലിയ പരീക്ഷണങ്ങൾ[a]—ആ വലിയ അടയാളങ്ങളും അത്ഭുതങ്ങളും.
