  text: the great trials that your eyes saw[a], those great signs and wonders.
translation:
  language: ml
  text: നിന്റെ കണ്ണുകൾ കണ്ട വലിയ പരീക്ഷണങ്ങൾ[a]—ആ വലിയ അടയാളങ്ങളും അത്ഭുതങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വലിയ പരിശോധനകൾ.’ ഇവിടെ ഉദ്ദേശിക്കുന്നത് പാപത്തിലേക്കുള്ള പ്രലോഭനങ്ങളല്ല, പരീക്ഷിക്കുകയോ തെളിയിക്കുകയോ ചെയ്യുന്ന അനുഭവങ്ങളാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסּוֹת הַגְּדֹלֹת
  choice: ആ വലിയ പരീക്ഷണങ്ങൾ
  rationale: מַסּוֹת എന്നത് പാപത്തിലേക്കുള്ള പ്രലോഭനങ്ങളെയല്ല, പരീക്ഷിക്കുകയോ തെളിയിക്കുകയോ ചെയ്യുന്ന സംഭവങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. 'വലിയ പരീക്ഷണങ്ങൾ' എന്നത് അതിന്റെ അർഥവും הַגְּדֹלֹת നൽകുന്ന ഊന്നലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: നിന്റെ കണ്ണുകൾ കണ്ട
  rationale: നേരിട്ടുള്ള ദൃക്സാക്ഷ്യത്തെ ഊന്നുന്ന എബ്രായ പ്രയോഗം ചുരുക്കി 'നീ കണ്ട' എന്നാക്കാതെ നിലനിർത്തുന്നു.
- source_word: הָאֹתֹת
  choice: അടയാളങ്ങൾ
  rationale: אוֹת എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ അർഥം; ദൈവിക പ്രവൃത്തികളെ തിരിച്ചറിയിക്കുന്ന അടയാളങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: וְהַמֹּפְתִים
  choice: അത്ഭുതങ്ങൾ
  rationale: מוֹפֵת എന്ന പദം אוֹת-നോടൊപ്പം അസാധാരണ ദൈവിക പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ 'അടയാളങ്ങളും അത്ഭുതങ്ങളും' വ്യക്തവും സ്വാഭാവികവുമായ പദജോടിയാണ്.
- source_word: הַגְּדֹלִים הָהֵם
  choice: ആ മഹത്തായ
  rationale: הָהֵם എന്ന ചൂണ്ടിക്കാട്ടൽ 'ആ' എന്നതിലൂടെ നിലനിർത്തുകയും הַגְּדֹלִים നൽകുന്ന പ്രാധാന്യവും മഹിമയും 'മഹത്തായ' എന്നതിലൂടെ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ദൃക്സാക്ഷ്യ ഊന്നൽ ('നിന്റെ കണ്ണുകൾ കണ്ട')യും അടയാളങ്ങൾ–അത്ഭുതങ്ങൾ എന്ന പദജോടിയും സംരക്ഷിച്ചു. വാക്യം നൽകിയിരിക്കുന്ന എബ്രായ ഭാഗം മാത്രമായതിനാൽ ഖണ്ഡവാക്യസ്വഭാവം നിലനിർത്തി.
