  text: הַ֨/נִּסְתָּרֹ֔ת לַ/יהוָ֖ה אֱלֹהֵ֑י/נוּ וְ/הַ/נִּגְלֹ֞ת לָ֤ׄ/נׄוּׄ וּׄ/לְׄ/בָׄנֵׄ֨יׄ/נׄוּׄ֙ עַד עוֹלָ֔ם לַ/עֲשׂ֕וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/028.yaml
  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
translation:
  language: ml
  text: മറഞ്ഞിരിക്കുന്ന കാര്യങ്ങൾ നമ്മുടെ ദൈവമായ യഹോവയ്ക്കുള്ളവയാണ്; എന്നാൽ വെളിപ്പെടുത്തപ്പെട്ട കാര്യങ്ങൾ നമുക്കും നമ്മുടെ മക്കൾക്കും എന്നേക്കുമുള്ളവയാണ്—നാം ഈ ന്യായപ്രമാണത്തിന്റെ[a] എല്ലാ വാക്കുകളും പാലിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഈ ന്യായപ്രമാണം” എന്നത് “ഈ ഉപദേശം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  choice: മറഞ്ഞിരിക്കുന്ന കാര്യങ്ങൾ
  rationale: סתר എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ കർത്തൃവാചക രൂപം ഇവിടെ നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു. മനുഷ്യരുടെ അറിവിൽനിന്ന് മറഞ്ഞിരിക്കുന്ന കാര്യങ്ങൾ എന്ന ആശയം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹോവയ്ക്കുള്ളവയാണ്
  rationale: לְ ഉടമസ്ഥതയെയോ അവകാശത്തെയോ സൂചിപ്പിക്കുന്നു. ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהֵינוּ എന്നത് ‘നമ്മുടെ ദൈവമായ’ എന്നു ബന്ധിപ്പിച്ചു.
- source_word: וְהַנִּגְלֹת
  choice: എന്നാൽ വെളിപ്പെടുത്തപ്പെട്ട കാര്യങ്ങൾ
  rationale: גלה എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ രൂപം ആദ്യ പദപ്രയോഗത്തോടുള്ള സമാന്തരത നിലനിർത്തുന്നു. וְ ഇവിടെ വിരുദ്ധത സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לָנוּ וּלְבָנֵינוּ
  choice: നമുക്കും നമ്മുടെ മക്കൾക്കും ... ഉള്ളവയാണ്
  rationale: ആദ്യ ഉപവാക്യത്തിലെ ഉടമസ്ഥതാസൂചന രണ്ടാമത്തേതിലും അർത്ഥസൂചനയായി തുടരുന്നു. בנים ഈ ഉടമ്പടിസന്ദർഭത്തിൽ തുടർന്നുവരുന്ന തലമുറകളെ ഉൾക്കൊള്ളുന്നതിനാൽ ‘മക്കൾ’ എന്നു നൽകി.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: നിലനിൽക്കുന്ന കാലവ്യാപ്തി സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: לַעֲשׂוֹת
  choice: നാം അനുസരിക്കേണ്ടതിന്
  rationale: לְ ചേർന്ന അനന്തക്രിയ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. നിയമത്തിലെ വാക്കുകൾ ‘ചെയ്യുക’ എന്നത് മലയാളത്തിൽ ‘അനുസരിക്കുക’ എന്നു പറയുന്നത് അർത്ഥസഹജമാണ്; അടിക്കുറിപ്പിൽ കൂടുതൽ പദാനുപദ രൂപം നൽകിയിരിക്കുന്നു.
- source_word: אֵת כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ഈ ന്യായപ്രമാണത്തിലെ എല്ലാ വാക്കുകളും
  rationale: דִּבְרֵי എന്നതിന്റെ ‘വാക്കുകൾ’ എന്ന പാഠകേന്ദ്രിതത്വം നിലനിർത്തി. תורה ഈ ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടിപരമായ നിയമോപദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ന്യായപ്രമാണം’ എന്നു നൽകി.
theological_decisions:
- issue: ‘മറഞ്ഞിരിക്കുന്നവ’യും ‘വെളിപ്പെടുത്തപ്പെട്ടവ’യും എന്തെല്ലാമെന്ന പരിധി
  choice: ദൈവത്തിനായി നിലനിൽക്കുന്ന കാര്യങ്ങളെയും ഇസ്രായേലിന് അനുസരണത്തിനായി വെളിപ്പെടുത്തിയ കാര്യങ്ങളെയും പൊതുവായി വിരുദ്ധമായി അവതരിപ്പിച്ചു.
  alternative: ഇത് സകല ദൈവിക രഹസ്യങ്ങളെയും കുറിച്ചുള്ള സമഗ്ര ജ്ഞാനശാസ്ത്രപ്രസ്താവനയായോ, സമീപസന്ദർഭത്തിലെ അനുഗ്രഹ-ശാപങ്ങളെ മാത്രം കുറിച്ചുള്ള പ്രസ്താവനയായോ വ്യക്തമാക്കുക.
  rationale: എബ്രായപാഠം ആ വിഭാഗങ്ങളുടെ കൃത്യമായ പരിധി നിർവചിക്കുന്നില്ല. അതിനാൽ ഉടമ്പടിസന്ദർഭം നിലനിർത്തിക്കൊണ്ട് പാഠത്തിലെ യഥാർത്ഥ അനിശ്ചിതത്വം പരിഹരിക്കാതെ വിട്ടു.
- issue: תורה എന്ന പദത്തിന്റെ വ്യാഖ്യാനം
  choice: ന്യായപ്രമാണം
  alternative: ഉപദേശം
  rationale: ‘ഉപദേശം’ സാധ്യമായ അർത്ഥമാണെങ്കിലും, ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടിനിയമസന്ദർഭത്തിൽ ‘ന്യായപ്രമാണം’ തിരിച്ചറിയാവുന്നതും യോജിച്ചതുമാണ്; പകരംവായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യഹോവ’ എന്ന ദൈവനാമം നിലനിർത്തി. മറഞ്ഞതും വെളിപ്പെടുത്തപ്പെട്ടതുമായ കാര്യങ്ങൾ തമ്മിലുള്ള സമാന്തരതയും വിരുദ്ധതയും സംരക്ഷിച്ചു; ദൈവിക രഹസ്യങ്ങളുടെ പരിധി പാഠം പറയുന്നതിലപ്പുറം നിർവചിച്ചിട്ടില്ല.
