  text: וַ/תָּבֹ֖אוּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יֵּצֵ֣א סִיחֹ֣ן מֶֽלֶךְ חֶ֠שְׁבּוֹן וְ/ע֨וֹג מֶֽלֶךְ הַ/בָּשָׁ֧ן לִ/קְרָאתֵ֛/נוּ לַ/מִּלְחָמָ֖ה וַ/נַּכֵּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
translation:
  language: ml
  text: നിങ്ങൾ ഈ സ്ഥലത്ത് എത്തിയപ്പോൾ[a], ഹെശ്ബോൻ രാജാവായ സീഹോനും ബാശാൻ രാജാവായ ഓഗും യുദ്ധത്തിനായി നമ്മെ നേരിടാൻ പുറപ്പെട്ടു; നാം അവരെ അടിച്ചുതോൽപ്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ ഈ സ്ഥലത്ത് എത്തി.” എബ്രായത്തിലെ ആഖ്യാനരൂപം ലളിതമായ സംഭവക്രമമായോ കാലബന്ധം സൂചിപ്പിക്കുന്നതായോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നാം അവരെ അടിച്ചു.” എബ്രായക്രിയയ്ക്ക് ‘അടിക്കുക’ എന്ന അർഥമുണ്ട്; സൈനികസന്ദർഭങ്ങളിൽ അത് പരാജയപ്പെടുത്തുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ
  choice: നിങ്ങൾ ... എത്തിയപ്പോൾ
  rationale: בוא എന്ന ക്രിയയുടെ Qal wayyiqtol രണ്ടാംപുരുഷ ബഹുവചനരൂപം കഴിഞ്ഞ സംഭവത്തെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള സംഭവവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ കാലസൂചക ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി; എബ്രായത്തിലെ ലളിതമായ ആഖ്യാനസംയോജനവും അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലത്ത്
  rationale: മലയാളത്തിൽ എത്തിച്ചേരൽ സൂചിപ്പിക്കുന്ന ‘എത്തുക’ എന്ന ക്രിയയോടൊപ്പം ‘ഈ സ്ഥലത്ത്’ സ്വാഭാവികമാണ്; מָקוֹם എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘സ്ഥലം’ നിലനിർത്തുന്നു.
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടുവന്നു
  rationale: יצא എന്നതിന്റെ ‘പുറപ്പെടുക/പുറത്തുവരുക’ എന്ന ദൃശ്യഭാവവും സംസാരിക്കുന്നവരുടെ ദിശയിലേക്കുള്ള വരവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു; ‘പടനീക്കം നടത്തി’ എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: סִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻ രാജാവായ സീഹോൻ
  rationale: പേരും രാജപദവിയും മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണഘടനയിൽ നൽകി.
- source_word: וְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: ബാശാൻ രാജാവായ ഓഗ്
  rationale: മുൻപത്തെ രാജപദവിയോട് സമാന്തരമായ മലയാളഘടന പാലിക്കുകയും സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: לִקְרָאתֵנוּ
  choice: നമ്മെ നേരിടാൻ
  rationale: സൈനികസന്ദർഭത്തിൽ ‘നമ്മെ എതിരേൽക്കാൻ/നേരിടാൻ’ എന്ന അർഥം വരുന്നു. ‘നേരിടാൻ’ ഏറ്റുമുട്ടലിന്റെ ആശയം വ്യക്തമാക്കുമ്പോഴും തുടർന്നുള്ള ‘യുദ്ധത്തിനായി’ എന്ന പ്രയോഗം ലക്ഷ്യം നിർണ്ണയിക്കുന്നു.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധത്തിനായി
  rationale: מִלְחָמָה യുദ്ധത്തെയോ പോരാട്ടത്തെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: וַנַּכֵּם
  choice: നാം അവരെ പരാജയപ്പെടുത്തി
  rationale: נכה എന്ന Hiphil ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ ‘അടിച്ചു’ എന്നും സൈനികസന്ദർഭത്തിൽ ‘തോൽപ്പിച്ചു/പരാജയപ്പെടുത്തി’ എന്നും അർഥമുണ്ട്. ആധുനിക മലയാളത്തിൽ സന്ദർഭാർത്ഥം വ്യക്തമായി നൽകുന്നു; മൂർത്തമായ പദാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പുറപ്പെട്ടുവന്നു’ എന്നത് മൂലത്തിലെ ദിശാഭാവം നിലനിർത്തുന്നു; സൈനികക്രിയയുടെ അക്ഷരാർഥവും സന്ദർഭാർത്ഥവും മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും തുലനപ്പെടുത്തി.
