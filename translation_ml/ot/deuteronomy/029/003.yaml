source:
  edition: WLC
  text: וְ/לֹֽא נָתַן֩ יְהוָ֨ה לָ/כֶ֥ם לֵב֙ לָ/דַ֔עַת וְ/עֵינַ֥יִם לִ/רְא֖וֹת וְ/אָזְנַ֣יִם לִ/שְׁמֹ֑עַ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/003.yaml
  text: But Yahweh has not given you a heart to know[a], or eyes to see, or ears to hear, to this day.
translation:
  language: ml
  text: എന്നാൽ ഇന്നുവരെ അറിയാനുള്ള ഹൃദയമോ കാണാനുള്ള കണ്ണുകളോ കേൾക്കാനുള്ള ചെവികളോ യഹോവ നിങ്ങൾക്കു നൽകിയിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹോവ ഇന്നുവരെ നിങ്ങൾക്ക് അറിയാനുള്ള ഹൃദയവും കാണാനുള്ള കണ്ണുകളും കേൾക്കാനുള്ള ചെവികളും നൽകിയിട്ടില്ല.”'
    reason: ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള וְ എന്ന സംയോജകത്തെ ‘-ഉം’ എന്ന കൂട്ടിച്ചേർക്കൽരീതിയിൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കാം; മുഖ്യപാഠത്തിലെ ‘-ഓ ... -ഓ ... -ഓ’ മലയാളത്തിലെ നിഷേധവാക്യത്തിൽ പട്ടിക കൂടുതൽ സ്വാഭാവികമാക്കുന്നു.
lexical_decisions:
- source_word: וְלֹא
  choice: എന്നാൽ ... നൽകിയിട്ടില്ല
  rationale: മുൻവാക്യത്തിൽ ഇസ്രായേൽ കണ്ട കാര്യങ്ങളോടുള്ള വൈരുധ്യം സന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ, സാധാരണ സംയോജകമായ ‘എന്നിട്ട്/കൂടാതെ’ എന്നതിനെക്കാൾ ‘എന്നാൽ’ സ്വാഭാവികമാണ്. ‘പക്ഷേ’ എന്നതിനെക്കാൾ ‘എന്നാൽ’ dignified modern Malayalam register നിലനിർത്തുന്നു.
- source_word: נָתַן
  choice: നൽകിയിട്ടില്ല
  rationale: ഹീബ്രു perfect-ഉം ‘ഇന്നുവരെ’ എന്ന സമയപ്രയോഗവും ചേർന്ന്, ഇതുവരെ തുടരുന്ന അഭാവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ perfect negative അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֵב לָדַעַת
  choice: അറിയാനുള്ള ഹൃദയം
  rationale: לֵב എന്ന ഹീബ്രു മനുഷ്യശാസ്ത്രപരമായ രൂപകം ബുദ്ധിയെയും ആന്തരിക മനോഭാവത്തെയും ഉൾക്കൊള്ളുന്നതിനാൽ ‘മനസ്സ്’ എന്നു ചുരുക്കാതെ ‘ഹൃദയം’ നിലനിർത്തുന്നു. ידעയുടെ നേരിട്ടുള്ള അർഥം ‘അറിയുക’ എന്നും സംരക്ഷിക്കുന്നു.
- source_word: וְעֵינַיִם לִרְאוֹת
  choice: കാണാനുള്ള കണ്ണുകൾ
  rationale: ഹീബ്രു സമാന്തരഘടനയും ദൃശ്യരൂപകവും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְאָזְנַיִם לִשְׁמֹעַ
  choice: കേൾക്കാനുള്ള ചെവികൾ
  rationale: ഗ്രഹണശേഷിയുള്ള കേൾവിയെ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകവും ഹീബ്രു സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: ആഖ്യാനത്തിലെ ഇപ്പോഴത്തെ സമയംവരെ അവസ്ഥ തുടരുന്നു എന്ന അർഥം നൽകുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ ഗ്രഹണശൂന്യതയിൽ ദൈവിക പ്രവർത്തകത്വം
  choice: യഹോവ ഹൃദയവും കണ്ണുകളും ചെവികളും ‘നൽകിയിട്ടില്ല’ എന്ന് വാക്യം നേരിട്ട് പറയുന്നു.
  alternative: ഇസ്രായേലിന്റെ സ്വന്തം പരാജയം മാത്രം ഊന്നിപ്പറയുക, അല്ലെങ്കിൽ യഹോവ അനുവദിച്ചില്ല/സഹായിച്ചില്ല എന്നു മയപ്പെടുത്തുക.
  rationale: ഹീബ്രു വാചകം നൽകാതിരുന്നതിന്റെ കർത്താവായി യഹോവയെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു. അതേസമയം, ദൈവാധിപത്യവും മനുഷ്യ ഉത്തരവാദിത്തവും തമ്മിലുള്ള ബന്ധത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലപ്പുറം ഒരു വ്യവസ്ഥിത ദൈവശാസ്ത്രപരമായ പരിഹാരം വിവർത്തനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ‘ഹൃദയം—കണ്ണുകൾ—ചെവികൾ’ എന്ന മൂന്ന് ഘടക സമാന്തരത സംരക്ഷിച്ചിരിക്കുന്നു. ‘അറിയാനുള്ള/കാണാനുള്ള/കേൾക്കാനുള്ള’ എന്ന ഏകീകൃത ഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തത നൽകുന്നു.
