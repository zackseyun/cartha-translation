reference: Deuteronomy 29:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא יֹאבֶ֣ה יְהוָה֮ סְלֹ֣חַֽ ל/וֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף יְהוָ֤ה וְ/קִנְאָת/וֹ֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/רָ֤בְצָה בּ/וֹ֙ כָּל הָ֣/אָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֣פֶר הַ/זֶּ֑ה וּ/מָחָ֤ה יְהוָה֙ אֶת שְׁמ֔/וֹ מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
translation:
  language: ml
  text: യഹ്‌വെ അവനോടു ക്ഷമിക്കാൻ മനസ്സാകുകയില്ല; കാരണം, അപ്പോൾ യഹ്‌വെയുടെ കോപവും അവിടുത്തെ അസൂയയും ആ മനുഷ്യനെതിരെ ജ്വലിക്കും; ഈ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന ശാപമെല്ലാം[a] അവന്റെമേൽ വന്നു പതിയും; യഹ്‌വെ അവന്റെ പേര് ആകാശത്തിൻ കീഴിൽനിന്ന് മായിച്ചുകളയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശപഥവുമായി ബന്ധപ്പെട്ട ശാപം മുഴുവനും.’ എബ്രായപദത്തിന് ഒരു പൊതുശാപം മാത്രമല്ല, ഉടമ്പടിശപഥത്തിന്റെ ഭാഗമായി വിളിച്ചുവരുത്തുന്ന ശാപവും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבֶה
  choice: മനസ്സാകുകയില്ല
  rationale: അനുവദിക്കാനുള്ള കഴിവില്ലായ്മയല്ല, ക്ഷമിക്കാനുള്ള സന്നദ്ധതയോ സമ്മതമോ ഇല്ലെന്ന ക്രിയയുടെ ഇച്ഛാസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: סְלֹחַ לוֹ
  choice: അവനോടു ക്ഷമിക്കാൻ
  rationale: ഉടമ്പടിപശ്ചാത്തലത്തിലെ ക്ഷമ/മാപ്പ് എന്ന സാധാരണ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כִּי אָז
  choice: അപ്പോൾ
  rationale: വിശദീകരണപരവും കാലസൂചകവുമായ ബന്ധം മലയാളവാക്യക്രമത്തിൽ സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: יֶעְשַׁן אַף יְהוָה
  choice: യഹ്‌വെയുടെ കോപം ... ജ്വലിക്കും
  rationale: എബ്രായത്തിലെ ‘കോപം പുകയുക’ എന്ന ശക്തമായ ദൃശ്യരൂപത്തെ മലയാളത്തിൽ അസ്വാഭാവികമാക്കാതെ ജ്വലിക്കുന്ന കോപമായി അവതരിപ്പിക്കുന്നു.
- source_word: קִנְאָתוֹ
  choice: അവിടുത്തെ അസൂയ
  rationale: ഉടമ്പടിയോടുള്ള ഏകാവകാശപരമായ തീക്ഷ്ണത ഉൾക്കൊള്ളുന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; അതിനെ വെറും ക്രോധമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: בָּאִישׁ הַהוּא
  choice: ആ മനുഷ്യനെതിരെ
  rationale: പുരുഷലിംഗ ഏകവചനസൂചന നിലനിർത്തുകയും വിരോധദിശ സൂചിപ്പിക്കുന്ന ב എന്ന ഉപസർഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: וְרָבְצָה בוֹ
  choice: അവന്റെമേൽ വന്നമരും
  rationale: ‘കിടക്കുക/പതിയിരിക്കുക’ എന്ന മൂലദൃശ്യവും ശാപം ഒരാളുടെമേൽ വന്ന് സ്ഥിരപ്പെടുന്നു എന്ന ആശയവും വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: כָּל הָאָלָה
  choice: ശാപമെല്ലാം
  rationale: മുഖ്യപാഠത്തിൽ അർഥം ലളിതമായി നൽകുന്നു; ഉടമ്പടിശപഥവുമായി ബന്ധപ്പെട്ട പ്രത്യേക സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: הַכְּתוּבָה בַּסֵּפֶר הַזֶּה
  choice: ഈ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന
  rationale: סֵפֶר എന്നത് പുസ്തകമോ ചുരുളോ ആകാമെങ്കിലും, ഇവിടെ ‘പുസ്തകം’ ആധുനിക വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: וּמָחָה ... אֶת שְׁמוֹ
  choice: അവന്റെ പേര് ... മായിച്ചുകളയും
  rationale: പേര്, സ്മരണം, പിൻതലമുറ എന്നിവ ഇല്ലാതാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: ആകാശത്തിൻ കീഴിൽനിന്ന്
  rationale: ഭൂമിയിൽനിന്നുള്ള സമ്പൂർണ നീക്കത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗത്തിന്റെ രൂപവും ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, എബ്രായ ചതുരക്ഷരനാമത്തിന്റെ അംഗീകൃത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയുടെ മനുഷ്യരൂപക ദൃശ്യം
  choice: കോപവും അസൂയയും ‘ജ്വലിക്കും’ എന്നു നിലനിർത്തി.
  alternative: കോപം ‘പുകയുയരും’ എന്നു അക്ഷരാർഥത്തിൽ നൽകുക, അല്ലെങ്കിൽ പൊതുവായി ‘ക്രോധിക്കും’ എന്നു പറയുക.
  rationale: മൂലപാഠത്തിലെ ശക്തമായ ന്യായവിധിദൃശ്യം സംരക്ഷിക്കുമ്പോൾ, മലയാളത്തിൽ ആശയക്കുഴപ്പമുണ്ടാക്കുന്ന അക്ഷരാർഥപ്രയോഗം ഒഴിവാക്കുന്നു.
- issue: קִנְאָה എന്നതിലെ ദൈവിക അസൂയ/തീക്ഷ്ണത
  choice: ‘അസൂയ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തീക്ഷ്ണത’ അല്ലെങ്കിൽ ‘തീക്ഷ്ണരോഷം’ എന്നു നൽകുക.
  rationale: പദത്തിലെ ഉടമ്പടിപരമായ ഏകാവകാശഭാവവും ദൈവിക തീക്ഷ്ണതയും വെറും കോപമായി മാറ്റാതെ യഥാർത്ഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: പുരുഷലിംഗ ഏകവചനസൂചന
  choice: ‘ആ മനുഷ്യൻ’ എന്ന പുരുഷലിംഗരൂപം നിലനിർത്തി.
  alternative: ‘ആ വ്യക്തി’ എന്നു ലിംഗനിരപേക്ഷമാക്കുക.
  rationale: സന്ദർഭത്തിലെ ഉടമ്പടിലംഘകനെ എബ്രായം പുരുഷലിംഗ ഏകവചനത്തിൽ സൂചിപ്പിക്കുന്നതിനാൽ അതു മാറ്റിയിട്ടില്ല.
- issue: ഉടമ്പടിശാപത്തിന്റെ സാങ്കേതിക സൂക്ഷ്മത
  choice: മുഖ്യപാഠത്തിൽ ‘ശാപമെല്ലാം’ എന്നും അടിക്കുറിപ്പിൽ ശപഥശാപസൂക്ഷ്മതയും നൽകി.
  alternative: മുഖ്യപാഠത്തിൽതന്നെ ‘ശപഥശാപം മുഴുവനും’ എന്നു നൽകുക.
  rationale: മുഖ്യപാഠം സാധാരണ വായനക്കാർക്ക് സുതാര്യമാക്കുകയും אָלָה എന്ന പദത്തിന്റെ ഉടമ്പടിപരമായ വ്യാപ്തി നഷ്ടപ്പെടാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവനാമമായി ‘യഹ്‌വെ’ ഉപയോഗിച്ചു. ‘അസൂയ’ എന്ന പദത്തിലെ അസൗകര്യകരമായെങ്കിലും മൂലപാഠസത്യമായ ഉടമ്പടിപരമായ സംഘർഷം മൃദൂകരിച്ചിട്ടില്ല; ‘വന്നമരും’ എന്നത് רבץ എന്ന ദൃശ്യത്തെ സ്വാഭാവികമായി വഹിക്കുന്നു. അടിക്കുറിപ്പ് ചൂണ്ടുന്ന [a] ശാപപദത്തിനരികിലാണ് നൽകിയിരിക്കുന്നത്.
