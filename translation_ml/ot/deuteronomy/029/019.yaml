revisions:
- from: യഹ്‌വെ അവനോടു ക്ഷമിക്കാൻ മനസ്സാകുകയില്ല. അപ്പോൾ യഹ്‌വെയുടെ കോപവും അവിടുത്തെ അസൂയയും ആ മനുഷ്യനെതിരെ ജ്വലിക്കും; ഈ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന ശാപമെല്ലാം[a] അവന്റെമേൽ വന്നമരും; യഹ്‌വെ അവന്റെ പേര് ആകാശത്തിൻ കീഴിൽനിന്ന് മായിച്ചുകളയും.
  to: യഹ്‌വെ അവനോടു ക്ഷമിക്കാൻ മനസ്സാകുകയില്ല; കാരണം, അപ്പോൾ യഹ്‌വെയുടെ കോപവും അവിടുത്തെ അസൂയയും ആ മനുഷ്യനെതിരെ ജ്വലിക്കും; ഈ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന ശാപമെല്ലാം[a] അവന്റെമേൽ വന്നു പതിയും; യഹ്‌വെ അവന്റെ പേര് ആകാശത്തിൻ കീഴിൽനിന്ന് മായിച്ചുകളയും.
