id: DEU.29.24
reference: Deuteronomy 29:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔/ם בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/024.yaml
  text: Then they will say[a], ‘Because they forsook the covenant of Yahweh, the God of their fathers, which he made with them when he brought them out of the land of Egypt.’
translation:
  language: ml
  text: 'അപ്പോൾ അവർ പറയും: “അവരുടെ പിതാക്കന്മാരുടെ ദൈവമായ യഹ്‌വെ അവരെ ഈജിപ്തുദേശത്തുനിന്നു പുറപ്പെടുവിച്ചപ്പോൾ അവരുമായി ചെയ്ത ഉടമ്പടി അവർ ഉപേക്ഷിച്ചതുകൊണ്ടാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: അപ്പോൾ അവർ പറയും
  rationale: സന്ദർഭത്തിലെ ഭാവികാല പ്രതികരണവും വാക്യക്രമത്തിലെ തുടർച്ചയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַל אֲשֶׁר
  choice: ഉപേക്ഷിച്ചതുകൊണ്ടാണ്
  rationale: ദേശത്തിന്റെ നാശത്തിനു കാരണമെന്തെന്ന ചോദ്യത്തിനുള്ള കാരണസൂചക മറുപടിയാണ്; മലയാളത്തിലെ ‘-തുകൊണ്ടാണ്’ അതിനെ വ്യക്തമായി നൽകുന്നു.
- source_word: עָזְבוּ
  choice: ഉപേക്ഷിച്ചു
  rationale: വെറുമൊരു വിട്ടുപോകലല്ല, ഉടമ്പടിബന്ധത്തെ മനപ്പൂർവം കൈവിടുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּרִית
  choice: ഉടമ്പടി
  rationale: ദൈവവും ഇസ്രായേലും തമ്മിലുള്ള ബന്ധനാത്മക covenant എന്ന ആശയത്തിന് മലയാള ബൈബിൾ ഭാഷയിലും പൊതുവായ ഉപയോഗത്തിലും യോജിച്ച പദം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: അവരുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: ഹീബ്രു സംയുക്തപദത്തിന്റെ പുരുഷലിംഗപരവും പിതൃപരമ്പരാസംബന്ധിയുമായ രൂപം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר כָּרַת עִמָּם
  choice: അവരുമായി ചെയ്ത ഉടമ്പടി
  rationale: ‘ഉടമ്പടി മുറിച്ചു’ എന്ന ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ പകർത്താതെ സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ അർഥം നൽകുന്നു.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: അവരെ ... പുറപ്പെടുവിച്ചപ്പോൾ
  rationale: ബേത് ചേർന്ന infinitive construct ഇവിടെ സമയബന്ധം സൂചിപ്പിക്കുന്നു; ദൈവമാണ് പ്രവർത്തനകർത്താവ് എന്നതും നിലനിർത്തുന്നു.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്നു
  rationale: ‘ഈജിപ്തിന്റെ ദേശം’ എന്ന പൂർണ്ണ ഹീബ്രു ആശയം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ദൈവനാമം പദവിയാക്കി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു; ‘യഹ്‌വെ’ എന്നത് YHWH-ന്റെ സാധാരണ ശാസ്ത്രീയ പുനർനിർമാണത്തോട് ചേർന്ന മലയാളരൂപമാണ്.
- issue: אֱלֹהֵי אֲבֹתָם എന്ന പിതൃപരമ്പരാ പ്രയോഗം
  choice: അവരുടെ പിതാക്കന്മാരുടെ ദൈവം
  alternative: അവരുടെ പൂർവികരുടെ ദൈവം
  rationale: മൂലത്തിലെ אָבוֹת എന്ന പുരുഷലിംഗ പദവും പിതൃപരമ്പരയുമായുള്ള നേരിട്ടുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- issue: സീനായിലോ മോവാബിലോ ഉടമ്പടി ചെയ്തതെന്ന സാധ്യതയുള്ള ചരിത്രസൂചന
  choice: മൂലപാഠത്തിലെ സമയബന്ധം മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ഒരു പ്രത്യേക ഉടമ്പടിസംഭവം വിശദീകരിച്ച് ചേർക്കുക
  rationale: ‘ഈജിപ്തിൽനിന്നു പുറപ്പെടുവിച്ചപ്പോൾ’ എന്ന വാചകം നൽകുന്ന ബന്ധം മാത്രം സൂക്ഷിച്ചു; ഏത് പ്രത്യേക ഉടമ്പടിയെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് പരിഭാഷയിൽ തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ഉദ്ധരണിയുടെ കാരണം ഊന്നിപ്പറയാൻ ‘-തുകൊണ്ടാണ്’ അവസാനം വെച്ചു. അർത്ഥവ്യത്യാസം ആവശ്യപ്പെടാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
