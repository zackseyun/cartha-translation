id: DEU.29.21
reference: Deuteronomy 29:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָמַ֞ר הַ/דּ֣וֹר הָֽ/אַחֲר֗וֹן בְּנֵי/כֶם֙ אֲשֶׁ֤ר יָק֨וּמוּ֙ מֵ/אַ֣חֲרֵי/כֶ֔ם וְ/הַ֨/נָּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵ/אֶ֣רֶץ רְחוֹקָ֑ה וְ֠/רָאוּ אֶת מַכּ֞וֹת הָ/אָ֤רֶץ הַ/הִוא֙ וְ/אֶת תַּ֣חֲלֻאֶ֔י/הָ אֲשֶׁר חִלָּ֥ה יְהוָ֖ה בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
translation:
  language: ml
  text: 'നിങ്ങൾക്കുശേഷം വരുന്ന തലമുറ[a]—നിങ്ങൾക്കുശേഷം എഴുന്നേൽക്കുന്ന നിങ്ങളുടെ മക്കൾ—ദൂരദേശത്തുനിന്നു വരുന്ന വിദേശിയും, ആ ദേശത്തിനേറ്റ പ്രഹരങ്ങളും യാഹ്‌വെ അതിൽ വരുത്തിയ രോഗങ്ങളും[b] കാണുമ്പോൾ പറയും:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വരുന്ന തലമുറ” എന്നതിന് “പിന്നീടുള്ള തലമുറ” എന്നും പരിഭാഷപ്പെടുത്താം; ഇത് നിർബന്ധമായും അവസാനത്തെ തലമുറയെ സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: “രോഗങ്ങൾ” എന്നതിന് “വ്യാധികൾ” എന്നും പരിഭാഷപ്പെടുത്താം. “യാഹ്‌വെ അതിൽ വരുത്തിയ” എന്നതിന്റെ അക്ഷരാർഥം, യാഹ്‌വെ ആ ദേശത്തെ രോഗബാധിതമാക്കി, അല്ലെങ്കിൽ അതിൽ ബാധ വരുത്തി, എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוֹר הָאַחֲרוֹן
  choice: നിങ്ങൾക്കുശേഷം വരുന്ന തലമുറ
  rationale: അന്ത്യതലമുറ എന്ന നിർബന്ധിത അർഥമല്ല, ഇപ്പോഴത്തെ ശ്രോതാക്കൾക്കുശേഷമുള്ള ഭാവിതലമുറയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  choice: നിങ്ങൾക്കുശേഷം എഴുന്നേൽക്കുന്ന നിങ്ങളുടെ മക്കൾ
  rationale: ഉറവിടത്തിലെ കുടുംബബന്ധവും ‘എഴുന്നേൽക്കുക’ എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തുന്നു; ‘മക്കൾ’ പിൻതലമുറയെയും ഉൾക്കൊള്ളാം.
- source_word: וְהַנָּכְרִי
  choice: വിദേശി
  rationale: ഇസ്രായേലിനു പുറത്തുനിന്നുള്ള വ്യക്തി എന്ന ദേശീയ-ഭൗമിക അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: ദൂരദേശത്തുനിന്നു
  rationale: ഭൗമിക അകലം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְרָאוּ
  choice: കാണുമ്പോൾ
  rationale: കാണുന്നതും തുടർന്ന് പറയുന്നതും തമ്മിലുള്ള കാലബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מַכּוֹת
  choice: പ്രഹരങ്ങൾ
  rationale: מכה എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘അടികൾ/പ്രഹരങ്ങൾ’ എന്ന അർഥവും ശിക്ഷാത്മക ദുരന്തങ്ങളുടെ വ്യാപ്തിയും നിലനിർത്തുന്നു; ‘ബാധകൾ’ എന്നതിനെക്കാൾ രോഗങ്ങളോടുള്ള ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: תַּחֲלֻאֶיהָ
  choice: അതിൽ വരുത്തിയ രോഗങ്ങൾ
  rationale: ദേശത്തെ രോഗബാധിതമായി ചിത്രീകരിക്കുന്ന ഉറവിടരൂപകം സൂക്ഷിക്കുന്നു.
- source_word: חִלָּה
  choice: വരുത്തിയ
  rationale: പീയേൽ രൂപത്തിലെ കാരണാർഥം, ‘രോഗങ്ങൾ’ എന്ന നാമത്തോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְאָמַר
  choice: പറയും
  rationale: എബ്രായത്തിൽ ഏകവചനമായിരുന്നാലും പിന്നാലെയുള്ള സംയുക്ത കർത്താവിനോട് മലയാളത്തിലെ ഏകവചന ക്രിയ സ്വാഭാവികമായി യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: ഉറവിടത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്; അതിനെ പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: הַדּוֹר הָאַחֲרוֹן എന്നതിന്റെ കാലപരമായ പരിധി
  choice: നിങ്ങൾക്കുശേഷം വരുന്ന തലമുറ
  alternative: അവസാന തലമുറ
  rationale: ഈ പ്രയോഗം നിർബന്ധമായും ചരിത്രത്തിന്റെ അന്തിമ തലമുറയെ സൂചിപ്പിക്കുന്നില്ല; ഇപ്പോഴുള്ളവർക്കുശേഷമുള്ള തലമുറ എന്ന സന്ദർഭാർഥം സംരക്ഷിക്കുന്നു.
- issue: בְּנֵיכֶם എന്നതിന്റെ പരിധി
  choice: നിങ്ങളുടെ മക്കൾ
  alternative: നിങ്ങളുടെ പുത്രന്മാർ / സന്തതികൾ
  rationale: പുരുഷലിംഗ ബഹുവചനം ഇവിടെ സമൂഹത്തിന്റെ പിൻതലമുറയെ പ്രതിനിധീകരിക്കാം; ‘മക്കൾ’ കുടുംബബന്ധം നിലനിർത്തിക്കൊണ്ട് അർഥം അനാവശ്യമായി പുരുഷന്മാരിലേക്കു ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പൊതുവായ വായനയ്ക്ക് അനുയോജ്യമായ ഗൗരവമുള്ള മലയാളം. നീണ്ട എബ്രായ വാക്യഘടന വായനാസൗകര്യത്തിനായി ഡാഷുകളാൽ വേർതിരിച്ചെങ്കിലും സംയുക്ത കർത്താവും തുടർന്നുള്ള ദൃശ്യവും സംരക്ഷിച്ചു. അടുത്ത വാക്യത്തിൽ വരുന്ന ചോദ്യത്തിനായി അവസാനം ദ്വിബിന്ദു നിലനിർത്തി.
