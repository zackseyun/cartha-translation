  source_fidelity: 'മുഖ്യപരിഭാഷ എബ്രായവാക്യത്തിന്റെ ഘടനയും അർഥവും മിക്കവാറും കൃത്യമായി നിലനിർത്തുന്നു: ഭാവിയിലെ തലമുറ/മക്കൾ, ദൂരദേശത്തുനിന്നുള്ള വിദേശി, ദേശത്തിന്റെ പ്രഹരങ്ങളും രോഗങ്ങളും, യാഹ്‌വെയുടെ കാരണപ്രവർത്തനം എന്നിവ വ്യക്തമാണ്. എന്നാൽ അടിക്കുറിപ്പ് b-യിലെ നിർദ്ദേശിത ‘അക്ഷരാർഥം’ എബ്രായവാക്യഘടനയെ തെറ്റായി ‘രോഗങ്ങളെ രോഗമാക്കി’ എന്ന അർഥത്തിലാക്കുന്നു. חִלָּה-യുടെ പ്രവർത്തനം ദേശത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്.'
  naturalness: ‘നിങ്ങൾക്കുശേഷം വരുന്ന തലമുറ’ സ്വാഭാവികമാണ്. അടിക്കുറിപ്പിന്റെ ആങ്കർ ബന്ധപ്പെട്ട പദത്തിനരികിലാക്കുകയും, വാക്യാന്ത്യത്തിലെ ‘ഇങ്ങനെ’ ഒഴിവാക്കി ദ്വിബിന്ദു തന്നെ അടുത്ത വാക്യത്തിലെ പ്രസ്താവനയെ മുന്നറിയിപ്പാക്കുകയും ചെയ്തിരിക്കുന്നു.
