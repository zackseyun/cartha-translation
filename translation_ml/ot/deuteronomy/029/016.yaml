revisions:
- from: അവരുടെ അറപ്പുളവാക്കുന്ന വസ്തുക്കളും[a] വിഗ്രഹങ്ങളും[b]—മരം, കല്ല്, വെള്ളി, പൊന്ന് എന്നിവകൊണ്ടുള്ളവ—അവരുടെ ഇടയിൽ ഉണ്ടായിരുന്നത്[c] നിങ്ങൾ കണ്ടു—
  to: അവരുടെ അറപ്പുളവാക്കുന്ന വസ്തുക്കളെയും[a] വിഗ്രഹങ്ങളെയും[b]—മരം, കല്ല്, വെള്ളി, പൊന്ന് എന്നിവകൊണ്ടുള്ളവയെ—അവരുടെ ഇടയിൽ നിങ്ങൾ കണ്ടു—
  rationale: The revision clarifies that both ‘detestable things’ and ‘idols’ are what Israel saw, while the wood, stone, silver, and gold phrase describes the cult objects. It retains the source’s pejorative distinction, the contextual scope of the relative clause, and the unfinished connective force indicated by the final dash. Footnote a is adjusted to a semantically closer Malayalam alternative.
