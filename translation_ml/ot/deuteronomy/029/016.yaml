source:
  edition: WLC
  text: וַ/תִּרְאוּ֙ אֶת שִׁקּ֣וּצֵי/הֶ֔ם וְ/אֵ֖ת גִּלֻּלֵי/הֶ֑ם עֵ֣ץ וָ/אֶ֔בֶן כֶּ֥סֶף וְ/זָהָ֖ב אֲשֶׁ֥ר עִמָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/016.yaml
  text: and you saw their detestable things and their idols[a], wood and stone, silver and gold[c][b], that were among them—
translation:
  language: ml
  text: അവരുടെ അറപ്പുളവാക്കുന്ന വസ്തുക്കളെയും[a] വിഗ്രഹങ്ങളെയും[b]—മരം, കല്ല്, വെള്ളി, പൊന്ന് എന്നിവകൊണ്ടുള്ളവയെ—അവരുടെ ഇടയിൽ നിങ്ങൾ കണ്ടു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവരുടെ വെറുപ്പുളവാക്കുന്ന വസ്തുക്കൾ.’ എബ്രായപദം ശക്തമായ അറപ്പു പ്രകടിപ്പിക്കുന്നതും പലപ്പോഴും വിഗ്രഹാരാധനാവസ്തുക്കളെ സൂചിപ്പിക്കുന്നതുമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘വിഗ്രഹങ്ങൾ’ എന്നതിനുള്ള എബ്രായപദം അവയെ നിന്ദിക്കുന്ന പരുഷമായ പദമാണ്; ‘ചാണകവിഗ്രഹങ്ങൾ’ എന്നതുപോലുള്ള ഭാവം അതിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: നിങ്ങൾ കണ്ടു
  rationale: ראה എന്ന ധാതുവിന്റെ Qal wayyiqtol രണ്ടാം പുരുഷ ബഹുവചനരൂപമാണ്. മോശെ ജനത്തോടു നടത്തുന്ന മുൻകാലസംഭവങ്ങളുടെ അനുസ്മരണം മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകിയിരിക്കുന്നു; വാക്യാന്തത്തിലെ ദീർഘവിരാമം തുടർന്നുവരുന്ന ആശയബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: שִׁקּוּצֵיהֶם
  choice: അവരുടെ അറപ്പുളവാക്കുന്ന വസ്തുക്കൾ
  rationale: വിഗ്രഹാരാധനയുമായി ബന്ധപ്പെട്ട് ശക്തമായ വെറുപ്പോ അറപ്പോ പ്രകടിപ്പിക്കുന്ന പദമാണിത്. സാധാരണ വായനക്കാർക്കു വ്യക്തവും ശക്തവുമായ ആധുനിക മലയാളപ്രയോഗമായി ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: גִּלֻּלֵיהֶם
  choice: വിഗ്രഹങ്ങൾ
  rationale: വിഗ്രഹങ്ങളെ നിന്ദാപൂർവം സൂചിപ്പിക്കുന്ന പദമാണിത്. മുഖ്യപാഠത്തിൽ അർഥം വ്യക്തമായി നൽകുകയും അതിലെ കൂടുതൽ പരുഷമായ നിന്ദാഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
- source_word: עֵץ וָאֶבֶן כֶּסֶף וְזָהָב
  choice: മരം, കല്ല്, വെള്ളി, പൊന്ന് എന്നിവകൊണ്ടുള്ളവ
  rationale: ഈ നാമങ്ങൾ ആരാധനാവസ്തുക്കൾ നിർമിച്ച വസ്തുക്കളുടെ പട്ടികയായി ഗ്രഹിക്കപ്പെടുന്നു. മലയാളത്തിൽ അവയുടെ ബന്ധം വ്യക്തമാക്കാൻ ‘എന്നിവകൊണ്ടുള്ളവ’ ചേർത്തു; നാലിനെയും ഒരേ പട്ടികയായി നിലനിർത്തി.
- source_word: אֲשֶׁר עִמָּהֶם
  choice: അവരുടെ ഇടയിൽ ഉണ്ടായിരുന്നത്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ജനതകളുടെ സാന്നിധ്യത്തിലോ കൈവശത്തിലോ ഈ ആരാധനാവസ്തുക്കൾ ഉണ്ടായിരുന്നുവെന്നതാണ് സന്ദർഭസഹജമായ അർഥം. ഉടമസ്ഥത മാത്രം നിർബന്ധമായി പ്രസ്താവിക്കാതെ എബ്രായത്തിലെ ബന്ധത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിഗ്രഹാരാധനാവസ്തുക്കൾക്കുള്ള രണ്ട് നിന്ദാസൂചക പദങ്ങളുടെ വിവർത്തനം
  choice: മുഖ്യപാഠത്തിൽ ‘അറപ്പുളവാക്കുന്ന വസ്തുക്കൾ’ എന്നും ‘വിഗ്രഹങ്ങൾ’ എന്നും വേർതിരിച്ചു നൽകുക
  alternative: ‘മ്ലേച്ഛവസ്തുക്കളും ചാണകവിഗ്രഹങ്ങളും’ എന്നതുപോലുള്ള കൂടുതൽ പരുഷമായ രൂപം
  rationale: എബ്രായത്തിലെ വ്യത്യസ്തമായ രണ്ട് പദങ്ങളും നിലനിർത്തി, അവയുടെ ശക്തമായ പ്രതികൂല വിലയിരുത്തൽ മായ്ച്ചുകളയാതെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഭാഷ ഉപയോഗിച്ചു. രണ്ടാമത്തെ പദത്തിന്റെ പരുഷമായ വ്യുത്പത്തിസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: אֲשֶׁר עִמָּהֶם എന്ന ബന്ധവാക്യത്തിന്റെ സൂചന
  choice: വിഗ്രഹങ്ങൾ മുൻവാക്യത്തിലെ ജനതകളുടെ ഇടയിൽ ഉണ്ടായിരുന്നുവെന്ന നിലയിൽ വിവർത്തനം ചെയ്യുക
  alternative: ‘അവർക്കുള്ളവ’ അഥവാ ‘അവരുടെ ഉടമസ്ഥതയിലുള്ളവ’
  rationale: സന്ദർഭം ഇസ്രായേൽ കടന്നുപോയ ജനതകളിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. ‘ഇടയിൽ’ എന്ന പ്രയോഗം സാന്നിധ്യം/കൈവശം എന്ന അർഥപരിധി സംരക്ഷിക്കുകയും ഇസ്രായേലിനാണ് അവ ഉണ്ടായിരുന്നതെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. എബ്രായത്തിലെ നിന്ദാഭാവം അതിരുകടക്കാതെ നിലനിർത്തി; വസ്തുക്കളുടെ പട്ടിക വ്യക്തമായ മലയാളവാക്യഘടനയിൽ നൽകി. അവസാനത്തെ ദീർഘവിരാമം അടുത്ത വാക്യത്തിലേക്കുള്ള അപൂർണമായ ആശയപ്രവാഹം സൂചിപ്പിക്കുന്നു.
