  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
translation:
  language: ml
  text: ഇന്ന് അവിടുന്ന് നിന്നെ തനിക്കായി ഒരു ജനമായി സ്ഥാപിക്കേണ്ടതിനും[a], അവിടുന്ന് തന്നേ നിനക്കു ദൈവമായിരിക്കേണ്ടതിനും—അവിടുന്ന് നിന്നോടു പറഞ്ഞതുപോലെയും നിന്റെ പിതാക്കന്മാരായ അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും[b] യാക്കോബിനോടും ശപഥം ചെയ്തതുപോലെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “തനിക്കായി ഒരു ജനമായി.”'
    reason: lexical_alternative
  - marker: b
    text: “നിന്റെ പിതാക്കന്മാർ” എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നീ പിതൃപുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: לְמַעַן
  choice: —വേണ്ടതിനും
  rationale: ഉദ്ദേശ്യം അല്ലെങ്കിൽ ഫലം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; മുൻവാക്യവുമായി ഇതിന്റെ വ്യാകരണബന്ധവും തുറന്നുവയ്ക്കുന്നു.
- source_word: הָקִים אֹתְךָ הַיּוֹם
  choice: ഇന്ന് ... നിന്നെ ... സ്ഥാപിക്കേണ്ടതിനും
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള ‘നിലനിറുത്തുക/സ്ഥാപിക്കുക’ എന്ന ഉടമ്പടിസംബന്ധമായ അർഥം സംരക്ഷിക്കുന്നു. ഏകവചനമായ ‘നിന്നെ’ ഇസ്രായേലിനെ സമൂഹമായി അഭിസംബോധന ചെയ്യുന്നതിനെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לוֹ לְעָם
  choice: തനിക്കായി ഒരു ജനമായി
  rationale: അക്ഷരാർഥത്തോടടുത്ത ഘടനയും ഉടമ്പടിയിലെ സ്വന്തബന്ധവും നിലനിർത്തുന്നു; ‘തന്റെ ജനം’ എന്നു മാത്രം പറഞ്ഞ് സൂക്ഷ്മത ചുരുക്കുന്നില്ല.
- source_word: וְהוּא יִהְיֶה לְךָ לֵאלֹהִים
  choice: അവിടന്ന് നിനക്കു ദൈവമായിരിക്കേണ്ടതിനും
  rationale: പരമ്പരാഗത ഉടമ്പടി-സൂത്രത്തിന്റെ ‘നിനക്കു ദൈവമായിരിക്കുക’ എന്ന ബന്ധപരമായ ഘടന സംരക്ഷിക്കുന്നു; וְהוּאയിലെ ഊന്നൽ ബഹുമാനസൂചക സർവനാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: നിന്നോടു അരുളിച്ചെയ്തതുപോലെയും
  rationale: ദൈവത്തിന്റെ സംസാരത്തെ മാന്യവും സ്വാഭാവികവുമായ രീതിയിൽ അവതരിപ്പിക്കുന്നു; പിന്നാലെയുള്ള ‘സത്യം ചെയ്തു’ എന്ന ക്രിയയുമായി കലർത്തി ‘വാഗ്ദാനം ചെയ്തു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നില്ല.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע
  choice: സത്യം ചെയ്തതുപോലെയും
  rationale: ശപഥം ചെയ്യുക എന്ന נשבעയുടെ വ്യക്തമായ അർഥം നൽകുന്നു.
- source_word: לַאֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരായ
  rationale: തുടർന്ന് അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരെ വ്യക്തമായി പറയുന്നതിനാൽ പുരുഷലിംഗത്തിലുള്ള പൂർവപിതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും
  rationale: ഓരോ പേരിനോടുമുള്ള ഹീബ്രു ബന്ധസൂചകത്തെ മലയാളത്തിലെ ‘-നോട്’ രൂപം ആവർത്തിച്ച് ഗൗരവമുള്ള താളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-സൂത്രത്തിന്റെ ഭാഷ
  choice: തനിക്കായി ഒരു ജനമായി ... നിനക്കു ദൈവമായിരിക്കുക
  alternative: തന്റെ ജനമായി ... നിന്റെ ദൈവമായിരിക്കുക
  rationale: ഹീബ്രുവിലെ പരസ്പര ഉടമ്പടിബന്ധവും ‘അവനുവേണ്ടി ഒരു ജനമായി / നിനക്കു ദൈവമായി’ എന്ന വ്യാകരണരൂപവും കൂടുതൽ നേരിട്ട് നിലനിർത്തുന്നു.
- issue: לַאֲבֹתֶיךָ എന്നതിലെ ലിംഗസൂചന
  choice: നിന്റെ പിതാക്കന്മാർ
  alternative: നിന്റെ പൂർവികർ
  rationale: തുടർന്നുതന്നെ അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നീ പിതൃപുരുഷന്മാരെ പേരെടുത്തുപറയുന്നതിനാൽ പ്രത്യേകമായ പുരുഷസൂചന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ബഹുമാനസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിലെ ഉടമ്പടിയിൽ പ്രവേശിക്കുന്ന പ്രവൃത്തിയുമായി ഉദ്ദേശ്യബന്ധത്തിലാണെന്നതിനാൽ മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ‘ഇത്’ ചേർത്തിട്ടുണ്ട്; പുതിയ ആശയം ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
