id: DEU.29.23
reference: Deuteronomy 29:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָֽמְרוּ֙ כָּל הַ/גּוֹיִ֔ם עַל מֶ֨ה עָשָׂ֧ה יְהוָ֛ה כָּ֖כָה לָ/אָ֣רֶץ הַ/זֹּ֑את מֶ֥ה חֳרִ֛י הָ/אַ֥ף הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/023.yaml
  text: And all the nations will say[a], ‘Why has Yahweh done thus to this land? Why this great burning anger?’
translation:
  language: ml
  text: 'എല്ലാ ജനതകളും പറയും[a]: “യഹ്‌വെ ഈ ദേശത്തോടു ഇങ്ങനെ ചെയ്തതെന്തിന്? ഈ മഹാക്രോധത്തിന്റെ ജ്വലനം എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “യഹ്‌വെ ഈ ദേശത്തോടു ഇങ്ങനെ ചെയ്തതെന്തിന്? ഈ വലിയ ക്രോധജ്വലനം എന്തിന്?”'
    reason: രണ്ട് מֶה പ്രയോഗങ്ങളുടെയും കാരണചോദ്യ സ്വഭാവവും חֳרִי הָאַף എന്നതിലെ ജ്വലനരൂപകവും കൂടുതൽ ഔപചാരികമായി കാണിക്കുന്നു.
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: പറയും
  rationale: പ്രവചനാത്മകമായ ഉടമ്പടി-സന്ദർഭത്തിൽ വാവ് ചേർന്ന ഖാൽ പൂർണ്ണക്രിയ ഭാവിയിലെ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഭാവികാലം അതു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വാക്യബന്ധം തുടർച്ചയായ വിവരണത്തിലൂടെ നിലനിൽക്കുന്നു.
- source_word: כָּל הַגּוֹיִם
  choice: സകല ജനതകളും
  rationale: ഗּוֹיִם ഇവിടെ ഇസ്രായേലിന്റെ ദേശത്തിന് സംഭവിച്ചതു കാണുന്ന വിദേശജനസമൂഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സകല ജനതകളും’ അതിന്റെ സമഗ്രമായ കൂട്ടാർഥം നിലനിർത്തുന്നു.
- source_word: עַל מֶה
  choice: എന്തുകൊണ്ട്
  rationale: കാരണത്തെക്കുറിച്ചുള്ള ചോദ്യമാണ് ഈ ഹീബ്രു പ്രയോഗം ഉന്നയിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘എന്തുകൊണ്ട്’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: യഹ്‌വെ ... ഇങ്ങനെ ചെയ്തത്
  rationale: עָשָׂה ... כָּכָה എന്നതിലെ ‘ഇങ്ങനെ ചെയ്യുക’ എന്ന പ്രയോഗശക്തി നിലനിർത്തുകയും മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യഘടന പിന്തുടരുകയും ചെയ്യുന്നു.
- source_word: לָאָרֶץ הַזֹּאת
  choice: ഈ ദേശത്തോട്
  rationale: אָרֶץ ഇവിടെ ന്യായവിധിക്കു വിധേയമായ ഉടമ്പടി-ദേശമാണ്. ‘ഈ ദേശത്തോട് ... ചെയ്തത്’ എന്നത് לְ എന്ന ബന്ധത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מֶה חֳרִי הָאַף הַגָּדוֹל הַזֶּה
  choice: ഈ മഹാക്രോധത്തിന്റെ ജ്വലനം എന്തിന്?
  rationale: חֳרִי എന്നതിലെ ചൂട്/ജ്വലനം എന്ന സജീവ രൂപകം ‘ജ്വലനം’ കൊണ്ട് സംരക്ഷിക്കുന്നു; אַף എന്ന ഹീബ്രു വ്യവഹാരത്തിന്റെ അർഥം ‘ക്രോധം’ എന്നും גָּדוֹל എന്നത് ‘മഹാ-’ എന്നും നൽകുന്നു. രണ്ടാമത്തെ מֶה കാരണത്തെ ചോദിക്കുന്നതായി ‘എന്തിന്’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഒരു പദവി അല്ല, ചതുരക്ഷര ദൈവനാമമാണ് നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്തു; ‘കർത്താവ്’ എന്നു മാറ്റിയില്ല.
- issue: חֳרִי הָאַף എന്ന ക്രോധരൂപകം
  choice: ക്രോധത്തിന്റെ ജ്വലനം
  alternative: ഉഗ്രകോപം
  rationale: ‘ഉഗ്രകോപം’ ആശയം സ്വാഭാവികമായി അറിയിക്കുമെങ്കിലും, ഹീബ്രുവിലെ ചൂടിന്റെയും ജ്വലനത്തിന്റെയും രൂപകം ഇല്ലാതാക്കും. അതിനാൽ മൂലത്തിലെ ദൃശ്യഭാഷ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സകല ജനതകളും’ എന്നത് വിശാലമായ കൂട്ടാർഥവും ‘മഹാക്രോധത്തിന്റെ ജ്വലനം’ എന്നത് ഹീബ്രുവിലെ തീക്ഷ്ണരൂപകവും നിലനിർത്തുന്നു. ഉദ്ധരണിചിഹ്നങ്ങളും ചോദ്യരൂപങ്ങളും വായനാസൗകര്യത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
