revisions:
- from: ഞാൻ നിങ്ങളെ നാല്പതു വർഷം മരുഭൂമിയിലൂടെ നടത്തി. നിങ്ങളുടെ വസ്ത്രങ്ങൾ നിങ്ങളുടെ മേൽവെച്ച് ജീർണിച്ചില്ല; നിങ്ങളുടെ ചെരിപ്പ് നിങ്ങളുടെ കാലിൽവെച്ച് ജീർണിച്ചില്ല.[a]
  to: ഞാൻ നിങ്ങളെ നാല്പത് വർഷം മരുഭൂമിയിൽ നടത്തി. നിങ്ങളുടെ മേലിരുന്ന വസ്ത്രങ്ങൾ തേഞ്ഞുപോയില്ല; നിന്റെ കാലിലിരുന്ന ചെരിപ്പ് തേഞ്ഞുപോയില്ല.[a]
  rationale: The revision changes only wording needed for source fidelity and idiomatic modern Malayalam. ‘മരുഭൂമിയിൽ’ follows the Hebrew locative phrase directly. The clothing and footwear clauses now use natural Malayalam, while the final ‘നിന്റെ’ singular deliberately retains the Hebrew number shift and is explained by the anchored footnote.
  reviewer_model: gpt-5.6-terra
