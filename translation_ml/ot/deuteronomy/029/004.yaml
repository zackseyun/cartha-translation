reference: Deuteronomy 29:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֛ם אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לֹֽא בָל֤וּ שַׂלְמֹֽתֵי/כֶם֙ מֵ/עֲלֵי/כֶ֔ם וְ/נַֽעַלְ/ךָ֥ לֹֽא בָלְתָ֖ה מֵ/עַ֥ל רַגְלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/004.yaml
  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളെ നാല്പത് വർഷം മരുഭൂമിയിൽ നടത്തി. നിങ്ങളുടെ മേലിരുന്ന വസ്ത്രങ്ങൾ തേഞ്ഞുപോയില്ല; നിന്റെ കാലിലിരുന്ന ചെരിപ്പ് തേഞ്ഞുപോയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം ആദ്യ ഉപവാക്യത്തിലെ ബഹുവചന അഭിസംബോധനയിൽനിന്ന് അവസാന ഉപവാക്യത്തിൽ ഏകവചനത്തിലേക്ക് മാറുന്നു: അക്ഷരാർഥത്തിൽ, “നിന്റെ ചെരിപ്പ് നിന്റെ കാലിന്മേൽനിന്ന് തേഞ്ഞുപോയില്ല.” ഈ ഏകവചനം ഇസ്രായേലിനെ ഒരൊറ്റ ജനതയായി അഭിസംബോധന ചെയ്യുന്നതോ ഓരോരുത്തരെയും സൂചിപ്പിക്കുന്ന വിതരണ ഏകവചനമോ ആയിരിക്കാം.'
    reason: എബ്രായപാഠത്തിലെ ബഹുവചന–ഏകവചന മാറ്റവും അതിന്റെ വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וָאוֹלֵךְ
  choice: ഞാൻ ... നടത്തി
  rationale: הלך എന്ന ധാതുവിന്റെ കാരകപ്രയോഗം ഇവിടെ യഹോവ മരുഭൂമിയിലൂടെ ജനത്തെ നയിച്ചതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നടത്തി’ കാരകഭാവവും യാത്രയുടെ ദൃശ്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിലൂടെ
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ വരണ്ട വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ചലനക്രിയയോടൊപ്പം മലയാളത്തിൽ ‘മരുഭൂമിയിലൂടെ’ സ്വാഭാവികമാണ്.
- source_word: בָּלוּ / בָלְתָה
  choice: ജീർണിച്ചില്ല
  rationale: בלה വസ്ത്രവും ചെരിപ്പും ഉപയോഗത്താൽ പഴകി നശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ജീർണിച്ചില്ല’ ഇരു വസ്തുക്കൾക്കും യോജിക്കുന്ന, ഗൗരവമുള്ള ആധുനിക പ്രയോഗമാണ്.
- source_word: שַׂלְמֹתֵיכֶם
  choice: നിങ്ങളുടെ വസ്ത്രങ്ങൾ
  rationale: പദം പൊതുവായി ധരിക്കുന്ന വസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വസ്ത്രങ്ങൾ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: מֵעֲלֵיכֶם
  choice: നിങ്ങളുടെ മേൽവെച്ച്
  rationale: അക്ഷരാർഥമായ ‘നിങ്ങളുടെ മേൽനിന്ന്’ എന്ന ഘടന, വസ്ത്രം ധരിച്ചിരിക്കെ ജീർണിക്കാതിരുന്നതാണ് ഉദ്ദേശിക്കുന്നത്. ‘മേൽവെച്ച്’ ഈ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: נַעַלְךָ
  choice: നിങ്ങളുടെ ചെരിപ്പ്
  rationale: נַעַל കാലിൽ ധരിക്കുന്ന ചെരിപ്പിനെ സൂചിപ്പിക്കുന്നു. എബ്രായയിലെ ഏകവചന രണ്ടാംപുരുഷ രൂപം നിലനിർത്തിയിരിക്കുന്നു.
- source_word: מֵעַל רַגְלֶךָ
  choice: നിങ്ങളുടെ കാലിൽവെച്ച്
  rationale: ചെരിപ്പ് കാലിൽ ധരിച്ചിരിക്കെ ജീർണിക്കാതിരുന്നതെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഏകവചനം നിലനിർത്തുന്നു.
- source_word: אַרְבָּעִים שָׁנָה
  choice: നാല്പതു വർഷം
  rationale: കാലദൈർഘ്യം നേരിട്ട് വിവർത്തനം ചെയ്തിരിക്കുന്നു.
theological_decisions:
- issue: ആദ്യ ഭാഗത്തിലെ ബഹുവചന അഭിസംബോധനയിൽനിന്ന് അവസാന ഉപവാക്യത്തിലെ ഏകവചനത്തിലേക്കുള്ള മാറ്റം
  choice: ‘നിങ്ങളുടെ ചെരിപ്പ് ... നിങ്ങളുടെ കാലിൽ’ എന്ന് ഏകവചനം നിലനിർത്തുക
  alternative: ‘നിങ്ങളുടെ ചെരിപ്പുകൾ ... നിങ്ങളുടെ കാലുകളിൽ’ എന്ന് മുഴുവൻ ബഹുവചനമാക്കുക
  rationale: എബ്രായപാഠം അവസാന ഉപവാക്യത്തിൽ ഏകവചന പ്രത്യയങ്ങളിലേക്ക് മാറുന്നു. ഇത് ഇസ്രായേലിനെ സമൂഹമൊട്ടാകെ ഏകഘടകമായി അഭിസംബോധന ചെയ്യുന്നതോ ഓരോ വ്യക്തിയെയും വേർതിരിച്ച് സൂചിപ്പിക്കുന്ന വിതരണ ഏകവചനമോ ആയിരിക്കാം. ഈ യഥാർഥ അനിശ്ചിതത്വം പരിഹരിക്കാതെ പാഠരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘നടത്തി’, ‘വസ്ത്രങ്ങൾ’, ‘ചെരിപ്പ്’, ‘ജീർണിച്ചില്ല’ എന്നിവ കൃത്യതയും സ്വാഭാവികതയും തുലനം ചെയ്യുന്നു. ഉറവിടത്തിലെ ബഹുവചന–ഏകവചന മാറ്റം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
