language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/נִּקַּח֙ אֶת אַרְצָ֔/ם וַ/נִּתְּנָ֣/הּ לְ/נַחֲלָ֔ה לָ/רֽאוּבֵנִ֖י וְ/לַ/גָּדִ֑י וְ/לַ/חֲצִ֖י שֵׁ֥בֶט הַֽ/מְנַשִּֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/007.yaml
  text: and we took their land and gave it as an inheritance to the Reubenites[a], the Gadites, and the half-tribe of the Manassites.
translation:
  language: ml
  text: അവരുടെ ദേശം നാം എടുത്ത്, അത് രൂബേന്യർക്കും ഗാദ്യർക്കും മനശ്ശെയുടെ പാതിഗോത്രത്തിനും അവകാശഭൂമിയായി കൊടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  choice: നാം കൈവശപ്പെടുത്തി
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണ്; ഇവിടെ സൈനികവിജയത്തിലൂടെ ദേശം സ്വന്തമാക്കിയ സന്ദർഭമായതിനാൽ ‘കൈവശപ്പെടുത്തി’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്. ‘പിടിച്ചെടുത്തു’ എന്നത് മൂലക്രിയ ആവശ്യപ്പെടുന്നതിനെക്കാൾ ശക്തമായേക്കാം.
- source_word: אַרְצָם
  choice: അവരുടെ ദേശം
  rationale: אֶרֶץ ഇവിടെ മുമ്പ് പരാമർശിച്ച രാജാക്കന്മാരുടെ അധീനപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘ദേശം’ territorial sense വ്യക്തമായി നൽകുന്നു.
- source_word: וַנִּתְּנָהּ
  choice: അത് ... കൊടുത്തു
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ നേരായ അർഥം നിലനിർത്തുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുമ്പുള്ള ‘ദേശം’ എന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְנַחֲלָה
  choice: അവകാശമായി
  rationale: נַחֲלָה ഗോത്രങ്ങൾക്ക് ലഭിക്കുന്ന പാരമ്പര്യ ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവകാശമായി’ എന്നത് ഈ ഭൂവിതരണസന്ദർഭത്തിൽ സ്വാഭാവികവും അർഥസമ്പന്നവുമാണ്.
- source_word: לָראוּבֵנִי
  choice: രൂബേന്യർക്ക്
  rationale: ഏകവചനത്തിലുള്ള ജനവിഭാഗസൂചക രൂപം മുഴുവൻ ഗോത്രവിഭാഗത്തെയും കൂട്ടായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനസമൂഹരൂപം ഉപയോഗിച്ചു.
- source_word: וְלַגָּדִי
  choice: ഗാദ്യർക്ക്
  rationale: ജനവിഭാഗസൂചക ഏകവചനം കൂട്ടായ ഗോത്രസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘ഗാദ്യർ’ ആ കൂട്ടായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: മനശ്ശെയുടെ പാതിഗോത്രത്തിന്
  rationale: חֲצִי שֵׁבֶט എന്നത് ‘പാതിഗോത്രം’ എന്നാണ്. הַמְנַשִּׁי ജനവിഭാഗസൂചക രൂപമാണെങ്കിലും, മലയാളത്തിൽ ‘മനശ്ശെയുടെ പാതിഗോത്രം’ എന്നത് കൂടുതൽ സ്വാഭാവികമാണ്; മൂലരൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. വാക്യത്തിന്റെ ആഖ്യാനശൈലിയും ഭൂമി ഗോത്രങ്ങൾക്ക് അവകാശമായി നൽകുന്ന ആശയവും നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദരൂപം പ്രധാനവാചകത്തിൽ ഒഴിവാക്കി, ബന്ധപ്പെട്ട എബ്രായരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
