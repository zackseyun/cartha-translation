revisions:
- from: ഗന്ധകവും ഉപ്പുംകൊണ്ട് അതിന്റെ ദേശം മുഴുവൻ കത്തിക്കരിഞ്ഞിരിക്കുന്നു; അവിടെ വിതയ്ക്കുകയില്ല, ഒന്നും മുളയ്ക്കുകയില്ല, ഒരു ചെടിയും വളരുകയില്ല. യഹോവ തന്റെ കോപത്തിലും ക്രോധത്തിലും കീഴ്മേൽ മറിച്ച സൊദോം, ഗൊമോറ, അദ്മ, സെബോയീം എന്നിവയുടെ നാശംപോലെയായിരിക്കും അത്.
  to: അതിന്റെ ദേശമെല്ലാം ഗന്ധകം[a]യും ഉപ്പും നിറഞ്ഞ് ദഹിച്ചുകിടക്കുന്ന ഭൂമിയായിരിക്കും; അതിൽ വിത്തുവിതയ്ക്കുകയില്ല, ഒന്നും മുളപ്പിക്കുകയില്ല, ഒരു സസ്യവും അതിൽ വളരുകയില്ല—യാഹ്‌വേ തന്റെ കോപത്തിലും ക്രോധത്തിലും കീഴ്മേൽ മറിച്ച സൊദോം, ഗൊമോറ, അദ്മ, സെബോയീം എന്നിവയുടെ നാശംപോലെ.
  rationale: The revision restores the opening as a coordinated description of total devastation rather than an explicit instrumental construction, makes the future/resulting condition consistent throughout, uses a broad term for vegetation, and aligns the rendering of יְהוָה with the supplied POB policy. The footnote preserves the audit-trail alternative for ‘sulfur.’
