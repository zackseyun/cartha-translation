language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: גָּפְרִ֣ית וָ/מֶלַח֮ שְׂרֵפָ֣ה כָל אַרְצָ/הּ֒ לֹ֤א תִזָּרַע֙ וְ/לֹ֣א תַצְמִ֔חַ וְ/לֹֽא יַעֲלֶ֥ה בָ֖/הּ כָּל עֵ֑שֶׂב כְּֽ/מַהְפֵּכַ֞ת סְדֹ֤ם וַ/עֲמֹרָה֙ אַדְמָ֣ה ו/צביים אֲשֶׁר֙ הָפַ֣ךְ יְהוָ֔ה בְּ/אַפּ֖/וֹ וּ/בַ/חֲמָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
translation:
  language: ml
  text: അതിന്റെ ദേശമെല്ലാം ഗന്ധകം[a]യും ഉപ്പും നിറഞ്ഞ് ദഹിച്ചുകിടക്കുന്ന ഭൂമിയായിരിക്കും; അതിൽ വിത്തുവിതയ്ക്കുകയില്ല, ഒന്നും മുളപ്പിക്കുകയില്ല, ഒരു സസ്യവും അതിൽ വളരുകയില്ല—യാഹ്‌വേ തന്റെ കോപത്തിലും ക്രോധത്തിലും കീഴ്മേൽ മറിച്ച സൊദോം, ഗൊമോറ, അദ്മ, സെബോയീം എന്നിവയുടെ നാശംപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ബ്രിംസ്റ്റോൺ’; ഗന്ധകത്തിനുള്ള പരമ്പരാഗത പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּפְרִית וָמֶלַח שְׂרֵפָה כָל אַרְצָהּ
  choice: ഗന്ധകവും ഉപ്പുംകൊണ്ട് അതിന്റെ ദേശം മുഴുവൻ കത്തിക്കരിഞ്ഞിരിക്കുന്നു
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യഘടന ദേശത്തിന്റെ ദഹിച്ചും ഊഷരവുമായ അവസ്ഥയെ വിവരിക്കുന്നു. ‘ഗന്ധകം’, ‘ഉപ്പ്’, ‘കത്തിക്കരിഞ്ഞിരിക്കുന്നു’ എന്നിവ അഗ്നിയുടെയും വന്ധ്യതയുടെയും ദൃശ്യങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא תִזָּרַע וְלֹא תַצְמִחַ
  choice: അവിടെ വിതയ്ക്കുകയില്ല, ഒന്നും മുളയ്ക്കുകയില്ല
  rationale: വിതയ്ക്കപ്പെടാത്തതും വളർച്ച പുറപ്പെടുവിക്കാത്തതുമായ ദേശത്തിന്റെ അവസ്ഥയെ സമാന്തരമായ മലയാളപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  choice: ഒരു ചെടിയും വളരുകയില്ല
  rationale: עֵשֶׂב ഇവിടെ പുല്ലിനെയോ സസ്യത്തെയോ പൊതുവായി സൂചിപ്പിക്കാം; ‘ചെടി’ പ്രസക്തമായ വിശാലത നിലനിർത്തുന്നു.
- source_word: כְּמַהְפֵּכַת ... אֲשֶׁר הָפַךְ
  choice: കീഴ്മേൽ മറിച്ച ... നാശംപോലെ
  rationale: നാമത്തിന്റെയും അതേ ധാതുവിലുള്ള ക്രിയയുടെയും ബന്ധം മലയാളത്തിൽ ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികതയ്ക്കായി നാമത്തെ ‘നാശം’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ മലയാളത്തിലെ പരിചിതമായ നേരിട്ടുള്ള നാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; ഒരു പദവിപ്പേര് പകരം വെക്കുന്നില്ല.
- source_word: בְּאַפּוֹ וּבַחֲמָתוֹ
  choice: തന്റെ കോപത്തിലും ക്രോധത്തിലും
  rationale: രണ്ട് സമാന്തര പദങ്ങളിലുമുള്ള തീവ്രതയും വ്യത്യാസവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയായി മാറ്റാതെ നിലനിർത്തുന്നു; ‘യഹോവ’ സാധാരണ മലയാളവായനക്കാർക്ക് സുപരിചിതമായ രൂപമാണ്.
- issue: വിധിയുടെ പ്രവർത്തകൻ
  choice: യഹോവ തന്റെ കോപത്തിലും ക്രോധത്തിലും കീഴ്മേൽ മറിച്ചു
  alternative: ദൈവിക പ്രവർത്തകനെ പരോക്ഷമാക്കുക
  rationale: എബ്രായം നാശത്തെ യഹോവയുടെ പ്രവർത്തനമായും കോപത്തോടും ക്രോധത്തോടും ബന്ധപ്പെട്ടതായും വ്യക്തമായി പറയുന്നു; അതിലെ ദൈവശാസ്ത്രപരമായ കാഠിന്യം മൃദൂകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലെ പരിചിതരൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു. വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ സംക്ഷിപ്തവും ക്രിയരഹിതവുമായ എബ്രായ ഘടന സ്വാഭാവിക മലയാളത്തിനായി വ്യക്തമായ അവസ്ഥാവിവരണമായി രൂപപ്പെടുത്തി.
