source:
  edition: WLC
  text: כִּֽי אַתֶּ֣ם יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יָשַׁ֖בְנוּ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אֵ֧ת אֲשֶׁר עָבַ֛רְנוּ בְּ/קֶ֥רֶב הַ/גּוֹיִ֖ם אֲשֶׁ֥ר עֲבַרְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/015.yaml
  text: For you know how we lived in the land of Egypt[a], and how we passed through the midst of the nations through which you passed.
translation:
  language: ml
  text: കാരണം, ഈജിപ്തുദേശത്ത് നാം എങ്ങനെ പാർത്തെന്നും നിങ്ങൾ കടന്നുപോയ ജനതകളുടെ നടുവിലൂടെ നാം എങ്ങനെ കടന്നുപോയെന്നും[a] നിങ്ങൾക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ കടന്നുപോയ ജനതകളുടെ ഇടയിൽ നാം കടന്നുപോയതെല്ലാം.” ഹീബ്രു വാക്യഘടന ‘എങ്ങനെ കടന്നുപോയി’ എന്ന സാഹചര്യാർഥത്തിലോ ‘കടന്നുപോയതെല്ലാം’ എന്ന അനുഭവാർഥത്തിലോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപ്രസ്താവനയ്ക്കുള്ള വിശദീകരണപരമായ അടിസ്ഥാനം അവതരിപ്പിക്കുന്നതിനാൽ ഹീബ്രുവിലെ കാരണസൂചകബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְדַעְתֶּם
  choice: നിങ്ങൾക്കറിയാം
  rationale: കഴിഞ്ഞകാല അനുഭവത്തെ അടിസ്ഥാനമാക്കിയുള്ള ഇപ്പോഴത്തെ അറിവാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ വർത്തമാനകാലപ്രയോഗം അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֵת אֲשֶׁר יָשַׁבְנוּ
  choice: നാം എങ്ങനെ പാർത്തെന്ന്
  rationale: വാക്യഘടന അറിയപ്പെടുന്ന സാഹചര്യത്തെയോ അനുഭവത്തിന്റെ രീതിയെയോ സൂചിപ്പിക്കാം. അർഥം അനാവശ്യമായി വികസിപ്പിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יָשַׁבְנוּ
  choice: നാം പാർത്തു
  rationale: ישב എന്നതിന്റെ ‘താമസിക്കുക/വസിക്കുക’ എന്ന അടിസ്ഥാനാർഥം മാന്യവും സാധാരണക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്ത്
  rationale: ‘ഈജിപ്തുദേശം’ എന്ന ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְאֵת אֲשֶׁר עָבַרְנוּ
  choice: നാം എങ്ങനെ കടന്നുപോയെന്ന്
  rationale: עבר എന്ന ചലനാർഥം നിലനിർത്തുകയും ഈ ഘടനയിലെ സാഹചര്യപരമായ അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു; കഷ്ടാനുഭവം എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: בְּקֶרֶב הַגּוֹיִם
  choice: ജനതകളുടെ നടുവിലൂടെ
  rationale: בקרב എന്നതിലെ ‘നടുവിൽ/ഇടയിൽ’ എന്ന അർഥവും ചലനസൂചകമായ ക്രിയയുമായുള്ള ബന്ധവും ഒരുമിച്ച് നൽകുന്നു.
- source_word: הַגּוֹיִם
  choice: ജനതകൾ
  rationale: ഇവിടെ גוים വ്യത്യസ്ത ജനസമൂഹങ്ങളെയോ രാഷ്ട്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘വിജാതീയർ’ പോലുള്ള പിൽക്കാല മതപരമായ അർഥനിറം ഒഴിവാക്കുന്നു.
- source_word: אֲשֶׁר עֲבַרְתֶּם
  choice: നിങ്ങൾ കടന്നുപോയ
  rationale: ‘ജനതകൾ’ എന്നതിനെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യവും ശ്രോതാക്കളോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും സംരക്ഷിക്കുന്നു; മൂലത്തിലെ ക്രിയാവർത്തനവും നിലനിർത്തുന്നു.
