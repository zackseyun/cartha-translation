translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പാർത്തു,’ ‘ജനതകൾ,’ ‘നടുവിലൂടെ’ എന്നീ പദങ്ങൾ മൂലത്തിന്റെ ഔപചാരികത നിലനിർത്തുമ്പോഴും അതിപുരാതനമായ ഭാഷ ഒഴിവാക്കുന്നു. ഒന്നാംപുരുഷ ബഹുവചനമായ ‘നാം’ എന്നതും അവസാനത്തെ രണ്ടാംപുരുഷ ബഹുവചനമായ ‘നിങ്ങൾ’ എന്നതും മൂലത്തിലെ ശ്രദ്ധേയമായ വ്യത്യാസം പരിഹരിക്കാതെ അതേപടി സംരക്ഷിച്ചിട്ടുണ്ട്.
