id: DEU.29.27
reference: Deuteronomy 29:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְּשֵׁ֤/ם יְהוָה֙ מֵ/עַ֣ל אַדְמָתָ֔/ם בְּ/אַ֥ף וּ/בְ/חֵמָ֖ה וּ/בְ/קֶ֣צֶף גָּד֑וֹל וַ/יַּשְׁלִכֵ֛/ם אֶל אֶ֥רֶץ אַחֶ֖רֶת כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
translation:
  language: ml
  text: അങ്ങനെ യാഹ്‌വെ കോപത്തിലും ഉഗ്രരോഷത്തിലും മഹാക്രോധത്തിലും അവരെ അവരുടെ ദേശത്തുനിന്ന് വേരോടെ പിഴുതുമാറ്റി, മറ്റൊരു ദേശത്തേക്ക് എറിഞ്ഞുകളഞ്ഞു; ഇന്നും കാണുന്നതുപോലെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  choice: പിഴുതെറിഞ്ഞ്
  rationale: נתשׁ എന്ന ക്രിയയുടെ ‘വേരോടെ പിഴുതുമാറ്റുക/പറിച്ചുകളയുക’ എന്ന ശക്തമായ ദൃശ്യഭാവം ദേശത്തുനിന്നുള്ള ബലമായ നീക്കത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: מֵעַל אַדְמָתָם
  choice: അവരുടെ ദേശത്തുനിന്ന്
  rationale: אֲדָמָה മണ്ണ്/നിലം/ദേശം എന്നിവ സൂചിപ്പിക്കാം; ഉടമ്പടി-പ്രവാസ പശ്ചാത്തലത്തിൽ ‘ദേശം’ സ്വാഭാവികവും പ്രദേശനഷ്ടം വ്യക്തമായി അറിയിക്കുന്നതുമാണ്.
- source_word: בְּאַף וּבְחֵמָה וּבְקֶצֶף גָּדוֹל
  choice: കോപത്തോടും ക്രോധത്തോടും മഹാരോഷത്തോടുംകൂടെ
  rationale: മൂലപാഠത്തിലെ കോപസൂചകമായ മൂന്ന് പദങ്ങളുടെ സഞ്ചയം ചുരുക്കാതെ, തീവ്രത ഉയരുന്ന മൂന്നു വ്യത്യസ്ത മലയാളപദങ്ങളാൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וַיַּשְׁלִכֵם
  choice: എറിഞ്ഞുകളഞ്ഞു
  rationale: שׁלך എന്നതിന്റെ ബലപ്രയോഗമുള്ള ‘എറിയുക’ എന്ന അർഥം വ്യക്തവും ആധുനികവുമായ ഭാഷയിൽ നൽകുന്നു; പിഴുതുമാറ്റൽ എന്ന മുൻദൃശ്യത്തിന്റെ ശക്തിയും തുടരുന്നു.
- source_word: אֶל אֶרֶץ אַחֶרֶת
  choice: മറ്റൊരു ദേശത്തേക്ക്
  rationale: വിദേശദേശത്തേക്കുള്ള നീക്കത്തെയും പ്രവാസത്തെയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּיּוֹם הַזֶּה
  choice: ഇന്നും സ്ഥിതി അങ്ങനെതന്നെയാണ്
  rationale: ‘ഈ ദിവസംപോലെ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം—വിധിയുടെ ഫലം ഇപ്പോഴും ദൃശ്യമായിരിക്കുന്നു—വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു; പദശഃരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, സാധാരണ മലയാളവായനക്കാർക്ക് ഏറ്റവും പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിക്കുന്നു; ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് പകരംവയ്ക്കുന്നില്ല.
- issue: കോപത്തെ സൂചിപ്പിക്കുന്ന പദങ്ങളുടെ സഞ്ചയം
  choice: കോപത്തോടും ക്രോധത്തോടും മഹാരോഷത്തോടുംകൂടെ
  alternative: കോപത്തിലും ഉഗ്രരോഷത്തിലും വലിയ ക്രോധത്തിലും
  rationale: ദൈവവിധിയുടെ തീവ്രത പ്രകടമാക്കുന്ന മൂന്നു സമീപാർഥപദങ്ങളും ഒന്നാക്കി ചുരുക്കാതെ നിലനിർത്തുന്നു; ‘മഹാ-’ വഴി גָּדוֹל എന്ന വിശേഷണവും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മൂലത്തിലെ ശക്തമായ പിഴുതുമാറ്റൽ–എറിഞ്ഞുകളയൽ ദൃശ്യവും കോപപദങ്ങളുടെ ത്രിതല സഞ്ചയവും നിലനിർത്തിയിരിക്കുന്നു.
