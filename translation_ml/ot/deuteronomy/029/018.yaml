  source_fidelity: 'മുഖ്യവാക്യം മൂലപാഠത്തോടു പൊതുവേ വിശ്വസ്തമാണ്: אָלָהയ്ക്ക് ‘ശപഥം’ എന്നും ശാപസൂചനയെ അടിക്കുറിപ്പിലും, ശാലോംയ്ക്ക് ‘ക്ഷേമം’ എന്നും, ഹൃദയത്തിന്റെ ശാഠ്യത്തിനനുസരിച്ചുള്ള നടത്തത്തെ നിലനിർത്തുകയും ചെയ്യുന്നു. അവസാനത്തെ ദുഷ്കരരൂപകം വ്യാഖ്യാനിച്ചു ചുരുക്കാതിരിക്കുന്നതും ഉചിതമാണ്. എന്നാൽ ‘നനവുള്ളതിനോടൊപ്പം ദാഹിക്കുന്നതിനെയും’ എന്നതിൽ രണ്ട് വിശേഷണനാമങ്ങളുടെ വാക്യഘടന സമമല്ല; ‘നനവുള്ളതിനെ ദാഹിക്കുന്നതിനോടൊപ്പം’ എന്ന രൂപം എബ്രായത്തിലെ ‘A-യെ B-യോടൊപ്പം’ എന്ന ബന്ധം കൂടുതൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു. ‘തുടച്ചുനീക്കേണ്ടതിന്’ ഇവിടെ അനാവശ്യമായ കടമ/വിധേയത്വഭാവം സൃഷ്ടിക്കുന്നു; ഉദ്ദേശം സൂചിപ്പിക്കുന്ന ‘തുടച്ചുനീക്കാൻ’ മതിയാകും.'
  naturalness: ‘ദുശ്ശാഠ്യത്തിൽ ഞാൻ നടന്നാലും’ എന്നത് ഗ്രഹിക്കാവുന്നതാണെങ്കിലും ആധുനിക നിലവാരമലയാളത്തിൽ ‘ഹൃദയത്തിന്റെ ശാഠ്യം അനുസരിച്ച് ഞാൻ നടന്നാലും’ കൂടുതൽ സ്വാഭാവികമാണ്. ‘തന്നെത്താൻ’ എന്നതിനു പകരം ‘സ്വയം’ ഉപയോഗിക്കുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്. വാക്യത്തിന്റെ ഗൗരവമുള്ള ബൈബിൾരജിസ്റ്റർ നിലനിർത്തിയിരിക്കുന്നു.
  terminology: ‘ശപഥം,’ ‘ശാപം,’ ‘അനുഗ്രഹിക്കും,’ ‘ക്ഷേമം,’ ‘ശാഠ്യം’ എന്നിവ യോജിച്ച തിരഞ്ഞെടുപ്പുകളാണ്. ‘ശപഥം’ എന്ന മുഖ്യവായനയോടൊപ്പം ശാപസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. അവസാനപ്രയോഗത്തിൽ ‘നനവുള്ളത്/ദാഹിക്കുന്നത്’ എന്ന അവ്യക്തരൂപകം നിലനിർത്തുന്നു; അടിക്കുറിപ്പിലെ ‘നനവുള്ള നിലം/വരണ്ട നിലം’ വ്യാഖ്യാനസാധ്യതയായി മാത്രം അവതരിപ്പിക്കുന്നു.
