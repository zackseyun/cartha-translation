reference: Deuteronomy 29:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֡ה בְּ/שָׁמְע/וֹ֩ אֶת דִּבְרֵ֨י הָֽ/אָלָ֜ה הַ/זֹּ֗את וְ/הִתְבָּרֵ֨ךְ בִּ/לְבָב֤/וֹ לֵ/אמֹר֙ שָׁל֣וֹם יִֽהְיֶה לִּ֔/י כִּ֛י בִּ/שְׁרִר֥וּת לִבִּ֖/י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָ/רָוָ֖ה אֶת הַ/צְּמֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
translation:
  language: ml
  text: ഈ ശപഥത്തിന്റെ[a] വാക്കുകൾ കേൾക്കുമ്പോൾ, അയാൾ തന്റെ ഹൃദയത്തിൽ സ്വയം അനുഗ്രഹിച്ചുകൊണ്ട്, ‘എന്റെ ഹൃദയത്തിന്റെ ശാഠ്യം അനുസരിച്ച് ഞാൻ നടന്നാലും എനിക്കു ക്ഷേമം ഉണ്ടാകും’ എന്നു പറയും; നനവുള്ളതിനെ ദാഹിക്കുന്നതിനോടൊപ്പം തുടച്ചുനീക്കാൻ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ശാപത്തിന്റെ.’ എബ്രായപദം ശാപശിക്ഷ ഉൾക്കൊള്ളുന്ന ഒരു ശപഥത്തെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘നനവുള്ള നിലത്തോടൊപ്പം വരണ്ട നിലത്തെയും തുടച്ചുനീക്കാൻ’; അതായത്, എല്ലാം ഒരുപോലെ നശിപ്പിക്കാൻ. എബ്രായപ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: ശപഥം
  rationale: കർത്തവ്യലംഘനത്തിനുള്ള ശാപം ഉൾക്കൊള്ളുന്ന ഉടമ്പടി-ശപഥത്തെ ഈ പദം സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ‘ശപഥം’ ഉപയോഗിക്കുകയും ശിക്ഷാത്മകമായ ‘ശാപം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  choice: തന്റെ ഹൃദയത്തിൽ തന്നെത്താൻ അനുഗ്രഹിക്കും
  rationale: ഹിത്പയേൽ രൂപത്തിന്റെ ആത്മനേപദസ്വഭാവവും അയാളുടെ വ്യാജമായ ആത്മവിശ്വാസത്തിലെ പരിഹാസവും പരമാവധി നിലനിർത്തുന്നു.
- source_word: שָׁלוֹם יִהְיֶה לִּי
  choice: എനിക്കു ക്ഷേമം ഉണ്ടാകും
  rationale: שָׁלוֹם എന്നതിലെ സമാധാനം, സൗഖ്യം, സുരക്ഷിതത്വം എന്നീ വിശാല ആശയങ്ങൾ ‘ക്ഷേമം’ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: שְׁרִרוּת לִבִּי
  choice: എന്റെ ഹൃദയത്തിന്റെ ദുശ്ശാഠ്യം
  rationale: സ്വന്തം ഇച്ഛയിൽ കടുപ്പത്തോടെ ഉറച്ചുനിൽക്കുന്ന മനോഭാവം വ്യക്തമാക്കുന്നു; ‘ഭാവന’ പോലുള്ള മൃദുവായ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: לְמַעַן
  choice: അങ്ങനെ … വേണ്ടതിന്
  rationale: മൂലത്തിലെ ഉദ്ദേശ്യത്തെയോ ലക്ഷ്യഫലത്തെയോ സൂചിപ്പിക്കുന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: סְפוֹת
  choice: തുടച്ചുനീക്കുക
  rationale: ഉടമ്പടി-ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ നശിപ്പിക്കുകയോ പൂർണമായി നീക്കുകയോ ചെയ്യുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָרָוָה אֶת־הַצְּמֵאָה
  choice: നനവുള്ളതിനോടൊപ്പം ദാഹിക്കുന്നതിനെയും
  rationale: ‘പൂരിതമായത്/നനവുള്ളത്’, ‘ദാഹിക്കുന്നത്/വരണ്ടത്’ എന്നീ മൂലരൂപകങ്ങളും അവയുടെ യഥാർഥ അവ്യക്തതയും നിലനിർത്തുന്നു; ഭൂമിയെ സൂചിപ്പിക്കുന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: הָאָלָה എന്ന ഉടമ്പടി-ശിക്ഷാഭാഷയുടെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ ‘ശപഥം’
  alternative: ‘ശാപം’ അല്ലെങ്കിൽ ‘ശാപം ഉൾക്കൊള്ളുന്ന ശപഥം’
  rationale: ഈ പദത്തിന് ശാപശിക്ഷ ഉൾക്കൊള്ളുന്ന ശപഥം എന്ന അർഥമുണ്ടാകാം. ‘ശപഥം’ ഉടമ്പടി പ്രഖ്യാപനത്തെ മുൻനിർത്തുന്നു; അടിക്കുറിപ്പ് അതിന്റെ ശിക്ഷാത്മക വശം മറയാതെ സൂക്ഷിക്കുന്നു.
- issue: הָרָוָה אֶת־הַצְּמֵאָה എന്ന ദുഷ്കരമായ പ്രയോഗം
  choice: ‘നനവുള്ളതിനോടൊപ്പം ദാഹിക്കുന്നതിനെയും’ എന്ന രൂപകം നിലനിർത്തുക
  alternative: ‘നനവുള്ള നിലത്തോടൊപ്പം വരണ്ട നിലത്തെയും’ അല്ലെങ്കിൽ ‘എല്ലാറ്റിനെയും ഒരുപോലെ’
  rationale: ഇത് അർഥനിർണയം ദുഷ്കരമായ ഒരു രൂപകപ്രയോഗമാണ്. മുഖ്യപാഠം അതിനെ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുകയും കൂടുതൽ വ്യക്തമായ ഭൂമി-വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘തന്നെത്താൻ അനുഗ്രഹിക്കും’ എന്ന അല്പം ഔപചാരികമായ പ്രയോഗം മൂലത്തിലെ ആത്മനേപദവും പരിഹാസവും നിലനിർത്താൻ ഉദ്ദേശപൂർവം സൂക്ഷിച്ചു. ദുഷ്കരമായ അവസാന രൂപകം മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് ലഘൂകരിച്ചിട്ടില്ല.
