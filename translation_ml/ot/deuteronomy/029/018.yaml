revisions:
- from: ഈ ശപഥത്തിന്റെ[a] വാക്കുകൾ കേൾക്കുമ്പോൾ, ‘എന്റെ ഹൃദയത്തിന്റെ ദുശ്ശാഠ്യത്തിൽ ഞാൻ നടന്നാലും എനിക്കു ക്ഷേമം ഉണ്ടാകും’ എന്നു പറഞ്ഞ് അയാൾ തന്റെ ഹൃദയത്തിൽ തന്നെത്താൻ അനുഗ്രഹിക്കും; അങ്ങനെ നനവുള്ളതിനോടൊപ്പം ദാഹിക്കുന്നതിനെയും തുടച്ചുനീക്കേണ്ടതിന്[b].
  to: ഈ ശപഥത്തിന്റെ[a] വാക്കുകൾ കേൾക്കുമ്പോൾ, അയാൾ തന്റെ ഹൃദയത്തിൽ സ്വയം അനുഗ്രഹിച്ചുകൊണ്ട്, ‘എന്റെ ഹൃദയത്തിന്റെ ശാഠ്യം അനുസരിച്ച് ഞാൻ നടന്നാലും എനിക്കു ക്ഷേമം ഉണ്ടാകും’ എന്നു പറയും; നനവുള്ളതിനെ ദാഹിക്കുന്നതിനോടൊപ്പം തുടച്ചുനീക്കാൻ[b].
  rationale: അവസാനത്തെ വിവാദാസ്പദമായ എബ്രായരൂപകം മുഖ്യപാഠത്തിൽ അവ്യക്തമായിത്തന്നെ സൂക്ഷിച്ചു; പക്ഷേ മലയാളത്തിലെ കാരകബന്ധം സമമാക്കുകയും ഉദ്ദേശസൂചകമായ ലְמַעַן-നെ ‘തുടച്ചുനീക്കാൻ’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി നൽകിയുകയും ചെയ്തു. ഹൃദയത്തിന്റെ ശാഠ്യത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും ആത്മാനുഗ്രഹണവും ആധുനിക നിലവാരമലയാളത്തിന് കൂടുതൽ യോജിച്ച രീതിയിൽ ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പുകൾ മുഖ്യപാഠത്തിലെ വായനയെയും വിവർത്തനപരമായ അനിശ്ചിതത്വത്തെയും നിലനിർത്തുന്നു.
