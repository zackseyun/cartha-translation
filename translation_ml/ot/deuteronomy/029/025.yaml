- from: അവർ പോയി അന്യദേവന്മാരെ സേവിക്കുകയും അവയുടെ മുമ്പിൽ കുമ്പിടുകയും ചെയ്തു—അവർ അറിഞ്ഞിട്ടില്ലാത്തതും അവർക്കു അവൻ ഓഹരിയായി നൽകിയിട്ടില്ലാത്തതുമായ ദേവന്മാരെ.[a]
