source:
  edition: WLC
  text: וַ/יֵּלְכ֗וּ וַ/יַּֽעַבְדוּ֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲוּ֖וּ לָ/הֶ֑ם אֱלֹהִים֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ם וְ/לֹ֥א חָלַ֖ק לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
translation:
  language: ml
  text: അവർ പോയി അന്യദേവന്മാരെ സേവിക്കുകയും അവരുടെ മുമ്പിൽ കുമ്പിടുകയും ചെയ്തു—അവർ അറിഞ്ഞിട്ടില്ലാത്തതും അവർക്കു, അവൻ ഓഹരിയായി നൽകിയിട്ടില്ലാത്തതുമായ ദേവന്മാരെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർക്കു ഓഹരിയായി നൽകപ്പെട്ടിട്ടില്ലാത്ത.” എബ്രായത്തിൽ കർത്താവ് വ്യക്തമാക്കാത്ത ഏകവചന ക്രിയയാണ്; അത് ദൈവത്തെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: അവർ പോയി
  rationale: הלך എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘പോകുക’ നിലനിർത്തുന്നു; വിശ്വാസത്യാഗത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം വിവർത്തനത്തിൽ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וַיַּעַבְדוּ
  choice: സേവിക്കുകയും
  rationale: עבד എന്നതിന്റെ ‘സേവിക്കുക’ എന്ന അർഥം നൽകുന്നു; തുടർന്നുള്ള കുമ്പിടൽ എന്ന ആരാധനാപ്രവൃത്തിയിൽനിന്ന് ഇതിനെ വേർതിരിച്ചുനിർത്തുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരെ
  rationale: ‘മറ്റു ദേവന്മാർ’ എന്ന ആശയം സ്വാഭാവികവും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; ‘വിദേശദേവന്മാർ’ എന്ന പരിമിതമായ അർഥം ചുമത്തുന്നില്ല.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: അവയുടെ മുമ്പിൽ കുമ്പിടുകയും ചെയ്തു
  rationale: שׁחה സൂചിപ്പിക്കുന്ന ശരീരം കുനിച്ചുള്ള വണക്കം നിലനിർത്തുന്നു; മുൻക്രിയയായ ‘സേവിക്കുക’ എന്നതുമായി ലയിപ്പിച്ച് പൊതുവായി ‘ആരാധിക്കുക’ എന്നു മാത്രം പറയുന്നില്ല.
- source_word: אֱלֹהִים אֲשֶׁר לֹא יְדָעוּם
  choice: അവർ അറിഞ്ഞിട്ടില്ലാത്ത ... ദേവന്മാരെ
  rationale: ידע എന്നതിലെ പരിചയപരവും ബന്ധപരവുമായ ഭാവം ലളിതമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְלֹא חָלַק לָהֶם
  choice: അവർക്കു അവൻ ഓഹരിയായി നൽകിയിട്ടില്ലാത്ത
  rationale: חלק എന്ന ക്രിയയിലെ പങ്കുവെക്കുക/ഓഹരിയായി നൽകുക എന്ന അർഥം സംരക്ഷിക്കുന്നു. എബ്രായത്തിലെ പരാമർശിക്കാത്ത ഏകവചന കർത്താവിനെ പ്രധാന പാഠത്തിൽ ‘അവൻ’ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: חָלַק എന്ന ഏകവചന ക്രിയയുടെ പരാമർശിക്കാത്ത കർത്താവ്
  choice: 'ദൈവത്തെ സൂചിപ്പിക്കുന്ന ‘അവൻ’: ‘അവർക്കു അവൻ ഓഹരിയായി നൽകിയിട്ടില്ലാത്ത’'
  alternative: ‘അവർക്കു ഓഹരിയായി നൽകപ്പെട്ടിട്ടില്ലാത്ത’ എന്ന കർമണിപ്രയോഗസദൃശ വായന
  rationale: എബ്രായത്തിൽ കർത്താവ് നേരിട്ട് പറഞ്ഞിട്ടില്ലെങ്കിലും ക്രിയ മൂന്നാംപുരുഷ ഏകവചനത്തിലാണ്. സന്ദർഭത്തിലും ആവർത്തനപുസ്തകത്തിലെ ദൈവിക ഓഹരിനൽകൽ ഭാഷയിലും ദൈവമാണ് ഏറ്റവും സാധ്യതയുള്ള കർത്താവ്. എന്നാൽ വ്യാകരണപരമായ പരോക്ഷത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സേവിക്കുക’ എന്നും ‘കുമ്പിടുക’ എന്നും വേർതിരിച്ച് മൂലപാഠത്തിലെ രണ്ട് പ്രവൃത്തികളും ദൃശ്യഭാവവും നിലനിർത്തി. ദേവന്മാരെ സൂചിപ്പിക്കാൻ മലയാളത്തിലെ വ്യാകരണലിംഗത്തിന് യോജിച്ച ‘അവയുടെ’ ഉപയോഗിച്ചു.
