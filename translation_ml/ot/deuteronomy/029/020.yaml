source:
  edition: WLC
  text: וְ/הִבְדִּיל֤/וֹ יְהוָה֙ לְ/רָעָ֔ה מִ/כֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹל֙ אָל֣וֹת הַ/בְּרִ֔ית הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
translation:
  language: ml
  text: യിസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും യഹ്‌വെ അവനെ അനർഥത്തിനായി വേർതിരിച്ചുനിർത്തും; ഈ ന്യായപ്രമാണപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന ഉടമ്പടിയുടെ എല്ലാ ശാപങ്ങൾക്കും[a] അനുസരിച്ച് അങ്ങനെ ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉടമ്പടിയുടെ സത്യപ്രതിജ്ഞാശാപങ്ങൾ.” എബ്രായപദം സത്യപ്രതിജ്ഞയിലൂടെ ആഹ്വാനം ചെയ്യപ്പെടുന്ന ഉടമ്പടിശാപങ്ങളെ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדִּילוֹ
  choice: അവനെ വേർതിരിച്ചുനിർത്തും
  rationale: בדל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഒരാളെ മറ്റുള്ളവരിൽനിന്ന് വേർതിരിക്കുക എന്ന ആശയം നൽകുന്നു. ന്യായവിധിയുടെ പ്രതികൂല സന്ദർഭം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി ഈ പ്രയോഗം അതു വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ יהוה വിവർത്തനം ചെയ്യാതെ, അതിന്റെ അംഗീകൃത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְרָעָה
  choice: അനർഥത്തിനായി
  rationale: ഇവിടെ רָעָה ധാർമിക തിന്മയെയല്ല, ഉടമ്പടി ലംഘനത്തിന്റെ ഫലമായ ദോഷകരമായ ന്യായവിധിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും
  rationale: מן വലിയ സമൂഹത്തിൽനിന്നുള്ള വേർതിരിവ് സൂചിപ്പിക്കുന്നു; എബ്രായ പദക്രമവും ബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כְּכֹל
  choice: എല്ലാ ... അനുസരിച്ച്
  rationale: כְ ഇവിടെ ശിക്ഷയും എഴുതപ്പെട്ട ഉടമ്പടിശാപങ്ങളും തമ്മിലുള്ള അനുരൂപത സൂചിപ്പിക്കുന്നു.
- source_word: אָלות
  choice: ശാപങ്ങൾ
  rationale: ഉടമ്പടി സന്ദർഭത്തിൽ אָלָה സത്യപ്രതിജ്ഞയോടു ബന്ധപ്പെട്ട ശാപങ്ങളെ സൂചിപ്പിക്കാം. വ്യക്തമായ പൊതുപദം മുഖ്യവാചകത്തിൽ നൽകി പ്രത്യേക സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הַבְּרִית
  choice: ഉടമ്പടിയുടെ
  rationale: בְּרִית എന്ന പദത്തിന്റെ സ്ഥിരവും പ്രസക്തവുമായ മലയാള പരിഭാഷ ‘ഉടമ്പടി’ ആണ്.
- source_word: הַכְּתוּבָה
  choice: എഴുതിയിരിക്കുന്ന
  rationale: സ്ത്രീലിംഗ ഏകവചന കർമ്മണി കൃദന്തരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണവാക്യമായി അവതരിപ്പിക്കുന്നു; ആശയപരമായി എഴുതപ്പെട്ട ശാപങ്ങളോടാണ് ഇത് ബന്ധപ്പെടുന്നത്.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: ഈ ന്യായപ്രമാണപുസ്തകത്തിൽ
  rationale: סֵפֶר എന്നതിന് ‘പുസ്തകം’ എന്നും תּוֹרָה എന്നതിന് ഈ ഉടമ്പടി സന്ദർഭത്തിൽ പരിചിതമായ ‘ന്യായപ്രമാണം’ എന്നും നൽകി, മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ഉടമ്പടിനാമം പൊതുവായ പദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: לְרָעָה സൂചിപ്പിക്കുന്ന ന്യായവിധിയുടെ സ്വഭാവം
  choice: അനർഥത്തിനായി
  alternative: തിന്മയ്ക്കായി; ദോഷത്തിനായി; ദുരന്തത്തിനായി
  rationale: ദൈവം ഒരാളെ ധാർമിക തിന്മയ്ക്കായി മാറ്റിനിർത്തുന്നു എന്ന തെറ്റായ സൂചന ഒഴിവാക്കി, പാഠത്തിലെ ശിക്ഷാത്മകവും ദോഷകരവുമായ ഫലം നിലനിർത്തുന്നു.
- issue: אָלות എന്നതിലെ സത്യപ്രതിജ്ഞാ സൂക്ഷ്മത
  choice: മുഖ്യവാചകത്തിൽ ‘ശാപങ്ങൾ’, അടിക്കുറിപ്പിൽ ‘സത്യപ്രതിജ്ഞയോടു ബന്ധപ്പെട്ട ഉടമ്പടിശാപങ്ങൾ’
  alternative: മുഖ്യവാചകത്തിൽ ‘സത്യപ്രതിജ്ഞാശാപങ്ങൾ’
  rationale: വായനാസൗകര്യത്തിനായി പൊതുവായ അർഥം മുഖ്യവാചകത്തിൽ നൽകുകയും പദത്തിന്റെ ഉടമ്പടി-സത്യപ്രതിജ്ഞാ സൂക്ഷ്മത നഷ്ടപ്പെടാതിരിക്കാൻ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ വേർതിരിവ്, ലക്ഷ്യം, എഴുതപ്പെട്ട ഉടമ്പടിശാപങ്ങളോടുള്ള അനുരൂപത എന്നിവ വ്യക്തമായി നിലനിർത്തി.
