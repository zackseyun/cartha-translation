id: DEU.29.9
reference: Deuteronomy 29:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַתֶּ֨ם נִצָּבִ֤ים הַ/יּוֹם֙ כֻּלְּ/כֶ֔ם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵי/כֶ֑ם רָאשֵׁי/כֶ֣ם שִׁבְטֵי/כֶ֗ם זִקְנֵי/כֶם֙ וְ/שֹׁ֣טְרֵי/כֶ֔ם כֹּ֖ל אִ֥ישׁ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
translation:
  language: ml
  text: 'നിങ്ങളെല്ലാവരും ഇന്ന് നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽ നിൽക്കുന്നു: നിങ്ങളുടെ തലവന്മാർ[a], നിങ്ങളുടെ ഗോത്രങ്ങൾ, നിങ്ങളുടെ മൂപ്പന്മാർ, നിങ്ങളുടെ ഉദ്യോഗസ്ഥർ—ഇസ്രായേലിലെ സകല പുരുഷന്മാരും.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങളുടെ തലവന്മാർ” എന്നും “നിങ്ങളുടെ ഗോത്രങ്ങൾ” എന്നും വേർതിരിക്കുന്നതിനുപകരം, ഈ പദങ്ങൾ ചേർത്ത് “നിങ്ങളുടെ ഗോത്രത്തലവന്മാർ” എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിലെ ഓരോ പുരുഷനും”; ഇവിടെ ഏകവചനം വിതരണാർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִצָּבִים
  choice: നിൽക്കുന്നു
  rationale: നിഫാൽ കർത്തൃപ്രത്യയരൂപം ഉടമ്പടി സമൂഹം ദൈവസന്നിധിയിൽ ഇപ്പോൾ ഒരുമിച്ചുകൂടി നിൽക്കുന്ന ദൃശ്യം അവതരിപ്പിക്കുന്നു; അതിനാൽ കല്പനാരൂപമല്ലാതെ തുടർന്നുനിൽക്കുന്ന അവസ്ഥയായി പരിഭാഷപ്പെടുത്തി.
- source_word: כֻּלְּכֶם
  choice: നിങ്ങളെല്ലാവരും
  rationale: രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയത്തോടുകൂടിയ സമഗ്രതയുടെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי
  choice: സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിലുള്ള ഉടമ്പടിസമ്മേളനം മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവപൂർണവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ച് പദവിനാമം പകരംവയ്ക്കാതെ വ്യക്തിനാമം സംരക്ഷിക്കുന്നു.
- source_word: רָאשֵׁיכֶם
  choice: നിങ്ങളുടെ തലവന്മാർ
  rationale: അക്ഷരാർഥത്തിലെ ‘തലകൾ’ എന്ന രൂപകത്തിന്റെ ഭരണനേതൃത്വസൂചന ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; അടുത്ത പദവുമായി ചേർത്തുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: שִׁבְטֵיכֶם
  choice: നിങ്ങളുടെ ഗോത്രങ്ങൾ
  rationale: മസോററ്റിക് പാഠത്തിലെ സ്വതന്ത്ര പ്രത്യയരൂപവും പട്ടികയുടെ ഘടനയും പിന്തുടർന്ന് ‘ഗോത്രങ്ങൾ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: זִקְנֵיכֶם
  choice: നിങ്ങളുടെ മൂപ്പന്മാർ
  rationale: ഇസ്രായേലിന്റെ സാമൂഹിക-ഭരണ ഘടനയിലെ മുതിർന്ന നേതാക്കളെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: שֹׁטְרֵיכֶם
  choice: നിങ്ങളുടെ ഉദ്യോഗസ്ഥർ
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഭരണപരമായ പശ്ചാത്തലത്തിൽ പദത്തിന്റെ ചുമതല അനാവശ്യമായി ചുരുക്കാതെ പൊതുവായ ഔദ്യോഗിക സ്ഥാനം സൂചിപ്പിക്കുന്നു.
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ സകല പുരുഷന്മാരും
  rationale: אִישׁ എന്ന പുരുഷലിംഗ നാമത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട്, ഏകവചനത്തിലെ വിതരണാർഥം സ്വാഭാവികമായ മലയാള ബഹുവചനത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവിനാമം പകരംവയ്ക്കാതെ അതിന്റെ അംഗീകരിക്കപ്പെട്ട ശാസ്ത്രീയ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: כֹּל אִישׁ יִשְׂרָאֵל എന്നതിലെ ലിംഗസൂചന
  choice: ഇസ്രായേലിലെ സകല പുരുഷന്മാരും
  alternative: ഇസ്രായേലിലുള്ള എല്ലാവരും; ഇസ്രായേൽ മുഴുവനും
  rationale: മൂലത്തിലെ אִישׁ പുരുഷന്മാരെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. അടുത്ത വാക്യം സ്ത്രീകളെയും കുട്ടികളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ ഇവിടെ ലിംഗസൂചന പൊതുവാക്കാതെ നിലനിർത്തി.
- issue: רָאשֵׁיכֶם שִׁבְטֵיכֶם എന്ന പദബന്ധത്തിന്റെ ഘടന
  choice: നിങ്ങളുടെ തലവന്മാർ, നിങ്ങളുടെ ഗോത്രങ്ങൾ
  alternative: നിങ്ങളുടെ ഗോത്രത്തലവന്മാർ
  rationale: മസോററ്റിക് പാഠത്തിന്റെ സ്വരചിഹ്നങ്ങളും പദക്രമവും രണ്ടിനെയും പട്ടികയിലെ വേറിട്ട ഘടകങ്ങളായി മനസ്സിലാക്കാൻ അനുവദിക്കുന്നു; എന്നാൽ ചേർത്തുവായിക്കാവുന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഉടമ്പടിസമ്മേളനത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തിയെങ്കിലും അനാവശ്യമായ പുരാതന പ്രയോഗങ്ങൾ ഒഴിവാക്കി. പട്ടികയുടെ ആവർത്തനഘടനയും അവസാനത്തെ സമാപക ഊന്നലും സംരക്ഷിച്ചു.
