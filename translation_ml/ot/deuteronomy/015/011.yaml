id: DEU.15.11
reference: Deuteronomy 15:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֛י לֹא יֶחְדַּ֥ל אֶבְי֖וֹן מִ/קֶּ֣רֶב הָ/אָ֑רֶץ עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לֵ/אמֹ֔ר פָּ֠תֹחַ תִּפְתַּ֨ח אֶת יָדְ/ךָ֜ לְ/אָחִ֧י/ךָ לַ/עֲנִיֶּ֛/ךָ וּ/לְ/אֶבְיֹנְ/ךָ֖ בְּ/אַרְצֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: ml
  text: 'കാരണം, ദേശത്തിനുള്ളിൽ ദരിദ്രർ ഒരിക്കലും ഇല്ലാതാകുകയില്ല. അതുകൊണ്ട് ഞാൻ നിന്നോട് ഇങ്ങനെ കല്പിക്കുന്നു: “നിന്റെ ദേശത്തിൽ നിന്റെ സഹോദരനോടും[a], നിന്റെ കഷ്ടതയനുഭവിക്കുന്നവനോടും[b], നിന്റെ ദരിദ്രനോടും നീ നിന്റെ കൈ തീർച്ചയായും തുറക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ സഹഇസ്രായേല്യനോട്.” ഹീബ്രുവിൽ “നിന്റെ സഹോദരനോട്” എന്നാണ്; ഉടമ്പടി-സമൂഹത്തിലെ ബന്ധത്തെ പ്രതിനിധിപരമായി സൂചിപ്പിക്കുന്ന കുടുംബഭാഷയാണിത്.
    reason: lexical_alternative
  - marker: b
    text: “കഷ്ടതയനുഭവിക്കുന്നവൻ” എന്നു പരിഭാഷപ്പെടുത്തിയ പദത്തിന് ദരിദ്രൻ, എളിയവൻ, പീഡിതൻ എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: അതുകൊണ്ടെന്ന കാരണബന്ധം സൂചിപ്പിക്കുന്ന ആദ്യവാക്യം
  rationale: ഈ ഘടകം മുമ്പുള്ള കല്പനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്തെന്നാൽ’ ചേർക്കാതെ വാക്യക്രമവും തുടർന്നുള്ള ‘അതുകൊണ്ട്’ എന്ന പ്രയോഗവും കാരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא יֶחְדַּל
  choice: ഒരിക്കലും ഇല്ലാതാകുകയില്ല
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണക്രിയ സൂചിപ്പിക്കുന്ന തുടർന്നുനിൽക്കുന്ന ഭാവിയാഥാർഥ്യവും ഊന്നലും ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֶבְיוֹן
  choice: ദരിദ്രർ / ദരിദ്രൻ
  rationale: ആദ്യപ്രയോഗത്തിലെ ഏകവചനം ഒരു വിഭാഗത്തെ പ്രതിനിധീകരിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനമായ ‘ദരിദ്രർ’ ഉപയോഗിച്ചു; അവസാനത്തെ വ്യക്തിഗത അഭിസംബോധനയിൽ ഏകവചനം നിലനിർത്തി.
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: ദേശത്തിന്റെ നടുവിൽനിന്ന്
  rationale: קֶרֶב എന്നതിലെ ‘നടുവിൽ/ഇടയിൽ’ എന്ന ആശയവും ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടി-ദേശസന്ദർഭവും സംരക്ഷിക്കുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: ആദ്യപ്രസ്താവനയിൽനിന്ന് കല്പനയിലേക്കുള്ള നിഗമനബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אָנֹכִי מְצַוְּךָ לֵאמֹר
  choice: ഞാൻ നിന്നോട് ഇങ്ങനെ കല്പിക്കുന്നു
  rationale: വർത്തമാനവും നേരിട്ടുള്ളതുമായ കല്പനയുടെ ഭാവവും לֵאמֹר എന്ന ഉദ്ധരണി-ആമുഖവും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: פָּתֹחַ תִּפְתַּח
  choice: നീ ... തീർച്ചയായും തുറക്കണം
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്നുള്ള ഹീബ്രു ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: אֶת יָדְךָ
  choice: നിന്റെ കൈ
  rationale: ഉദാരമായി സഹായിക്കുക എന്ന അർഥമുള്ള മൂലപാഠത്തിലെ ദൃശ്യരൂപകം വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְאָחִיךָ
  choice: നിന്റെ സഹോദരനോട്
  rationale: കുടുംബബന്ധവും ഉടമ്പടി-സമൂഹബന്ധവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: לַעֲנִיֶּךָ
  choice: കഷ്ടതയനുഭവിക്കുന്നവനോട്
  rationale: עָנִי എന്ന പദത്തിലെ ദാരിദ്ര്യം, താഴ്മ, കഷ്ടത എന്നീ അർഥവ്യാപ്തി തുറന്നുവയ്ക്കുകയും അതേ വാക്യത്തിലെ אֶבְיוֹן എന്നതിൽനിന്ന് പദവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וּלְאֶבְיֹנְךָ
  choice: ദരിദ്രനോട്
  rationale: സാമ്പത്തിക അഭാവത്തിന്റെ ആശയം വ്യക്തമായി നൽകുകയും വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ אֶבְיוֹן എന്ന പദവുമായുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּאַרְצֶךָ
  choice: നിന്റെ ദേശത്തുള്ളവരോട്
  rationale: ഭൂമിയാകെ എന്ന സാർവലൗകിക അർഥത്തിലേക്ക് വികസിപ്പിക്കാതെ ഇസ്രായേലിന്റെ ഉടമ്പടി-ദേശമെന്ന അടുത്ത സന്ദർഭം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബന്ധം വ്യക്തതയോടെ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ബന്ധുഭാഷ
  choice: നിന്റെ സഹോദരനോട്
  alternative: നിന്റെ സഹഇസ്രായേല്യനോട് / നിന്റെ സ്വജനത്തോട്
  rationale: ആൺ ഏകവചനത്തിലുള്ള אָח എന്ന മൂലപദത്തിന്റെ കുടുംബപരവും ഉടമ്പടിപരവുമായ ശക്തി ‘സഹോദരൻ’ നിലനിർത്തുന്നു; അതിന്റെ പ്രതിനിധിപരമായ പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: הָאָרֶץ / אַרְצֶךָ എന്നതിന്റെ പരിധി
  choice: ദേശം / നിന്റെ ദേശം
  alternative: ഭൂമി / രാജ്യം
  rationale: ആവർത്തനപുസ്തകത്തിലെ അടുത്ത സന്ദർഭം ഉടമ്പടി-ദേശമാണ്. ‘ദേശം’ ആ ചരിത്രസന്ദർഭം നിലനിർത്തുന്നു; പ്രസ്താവനയെ ഭൂഗോളം മുഴുവനേക്കുറിച്ചുള്ള അമൂർത്ത അവകാശവാദമായി മാറ്റുന്നില്ല.
- issue: ആവശ്യത്തിലിരിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സമാന്തര പദങ്ങൾ
  choice: കഷ്ടതയനുഭവിക്കുന്നവൻ; ദരിദ്രൻ
  alternative: എളിയവൻ; അഗതി / ദരിദ്രൻ; ആവശ്യക്കാരൻ
  rationale: עָנִי, אֶבְיוֹן എന്നീ പദങ്ങളുടെ അർഥപരമായ മിശ്രണവും വ്യത്യാസവും ഒരുപോലെ കാത്തുസൂക്ഷിക്കുന്നു; ഒന്നിനെ വെറും ആത്മീയ താഴ്മയായോ മറ്റേതിനെ പൂർണ ദാരിദ്ര്യമായോ സിദ്ധാന്തപരമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘കൈ തുറക്കുക’ എന്ന സെമിറ്റിക് ദൃശ്യരൂപകം മനസ്സിലാക്കാവുന്നതിനാൽ നിലനിർത്തി. ഊന്നൽ സ്വാഭാവികമാക്കാൻ ‘തീർച്ചയായും’ ഉപയോഗിച്ചു; അവസാനത്തെ മൂന്ന് ദാതൃപദങ്ങളുടെ ബന്ധം ദീർഘചിഹ്നങ്ങളാൽ വ്യക്തീകരിച്ചു.
