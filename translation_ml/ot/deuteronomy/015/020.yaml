id: DEU.15.20
reference: Deuteronomy 15:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֤י/ךָ תֹאכֲלֶ֨/נּוּ֙ שָׁנָ֣ה בְ/שָׁנָ֔ה בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה אַתָּ֖ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/020.yaml
  text: You and your household shall eat it before Yahweh your God year by year in the place that Yahweh will choose[a].
translation:
  language: ml
  text: നീയും നിന്റെ വീട്ടുകാരും വർഷംതോറും നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ[a], യഹോവ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത്, അതിനെ ഭക്ഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിന്റെ ദൈവമായ യഹോവയുടെ മുമ്പാകെ.’
    reason: ലִפְנֵי എന്ന ഹീബ്രു പ്രയോഗത്തിന് ‘സന്നിധിയിൽ’ എന്നതിനൊപ്പം സാധുവായ സന്ദർഭാനുസൃത ബദലാണ് ‘മുമ്പാകെ’; ഇത് ഇംഗ്ലീഷ് ഓഡിറ്റ്-ട്രെയിലിലെ lexical alternative സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: לִפְנֵי
  choice: സന്നിധിയിൽ
  rationale: פָּנִים ചേർന്ന ഈ ഉപസർഗപ്രയോഗം ‘മുമ്പാകെ’ എന്നും ‘സന്നിധിയിൽ’ എന്നും അർഥമാക്കാം. ആരാധനാസംബന്ധമായ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ ‘സന്നിധിയിൽ’ തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവത്തിന്റെ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയമുള്ള രൂപം ‘നിന്റെ ദൈവം’ എന്നാണ്; לִפְנֵי-യോടു ചേർന്നതിനാൽ മലയാളത്തിൽ ‘നിന്റെ ദൈവത്തിന്റെ സന്നിധിയിൽ’ എന്നു സ്വാഭാവികമായി രൂപപ്പെടുത്തി.
- source_word: תֹאכֲלֶנּוּ
  choice: അതിനെ ഭക്ഷിക്കണം
  rationale: നിയമനിർദേശത്തിന്റെ ഭാവം നിലനിർത്താൻ ‘ഭക്ഷിക്കണം’ ഉപയോഗിച്ചു; പുരുഷലിംഗ ഏകവചന കർമപ്രത്യയം മുൻസന്ദർഭത്തിലെ കടിഞ്ഞൂൽ മൃഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിനെ’ എന്നു നൽകി.
- source_word: שָׁנָה בְּשָׁנָה
  choice: വർഷംതോറും
  rationale: ആവർത്തിച്ചുള്ള വാർഷിക ആചരണം സൂചിപ്പിക്കുന്ന വിതരണപ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: യഹോവ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തുവെച്ച്
  rationale: ആവർത്തനപുസ്തകത്തിലെ തിരഞ്ഞെടുത്ത ആരാധനാസ്ഥലത്തെക്കുറിച്ചുള്ള സ്ഥിരപ്രയോഗം സംരക്ഷിക്കുന്നു. ഹീബ്രു അപൂർണ്ണക്രിയയ്ക്ക് സന്ദർഭാനുസൃതമായി മലയാളത്തിലെ ഭാവി/പൊതുനിർദേശബോധമുള്ള ‘തിരഞ്ഞെടുക്കുന്ന’ നൽകി.
- source_word: אַתָּה וּבֵיתֶךָ
  choice: നീയും നിന്റെ വീട്ടുകാരും
  rationale: בַּיִת ഇവിടെ കെട്ടിടത്തെയല്ല, ഗൃഹസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘വീട്ടുകാർ’ അതിന്റെ സാമൂഹിക വ്യാപ്തി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ദൈവനാമരൂപം നിലനിർത്തി.
- issue: לִפְנֵי എന്നതിലെ ആരാധനാസംബന്ധമായ ബന്ധം
  choice: സന്നിധിയിൽ
  alternative: മുമ്പാകെ
  rationale: ഇരുവായനകളും സാധുവാണ്. ഭക്ഷണം ദൈവത്തിന്റെ ആരാധനാസന്നിധിയിൽ നടക്കുന്നു എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകാൻ ‘സന്നിധിയിൽ’ തിരഞ്ഞെടുത്തു; ഇതിലൂടെ ദൈവത്തിന്റെ ഭൗതിക സ്ഥാനത്തെക്കുറിച്ചുള്ള അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമനിർദേശത്തിന്റെ ഗൗരവം ‘ഭക്ഷിക്കണം’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തിയിരിക്കുന്നു; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും ഹീബ്രുവിലെ പ്രധാന ഘടകങ്ങൾ എല്ലാം സംരക്ഷിച്ചു.
