    rationale: ഇവിടെ യഹോവയും ‘നിന്റെ ദൈവം’ എന്ന വിശേഷണവും ചേർന്ന അപ്പോസിഷൻ മലയാളത്തിൽ വ്യക്തമായി അടയാളപ്പെടുത്തേണ്ടതാണ്. നിലവിലെ രൂപം വായനയിൽ മങ്ങലോ അസ്വാഭാവികതയോ സൃഷ്ടിക്കുന്നു. ‘നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ’ മൂലത്തിലെ ‘Yahweh your God’ എന്ന ബന്ധം കൃത്യമായി വ്യക്തമാക്കുന്നു.
