revisions:
- from: നീയും നിന്റെ വീട്ടുകാരും വർഷംതോറും യഹോവ നിന്റെ ദൈവത്തിന്റെ സന്നിധിയിൽ, യഹോവ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തുവെച്ച്, അതിനെ ഭക്ഷിക്കണം.
  to: നീയും നിന്റെ വീട്ടുകാരും വർഷംതോറും നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ[a], യഹോവ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത്, അതിനെ ഭക്ഷിക്കണം.
  rationale: വാക്യത്തിന്റെ അർഥം മാറ്റാതെ, യഹോവയും ‘നിന്റെ ദൈവം’ എന്ന വിശേഷണവും തമ്മിലുള്ള ബന്ധം മലയാളത്തിൽ വ്യാകരണപരമായും സ്വാഭാവികമായും വ്യക്തമാക്കാൻ മാത്രം പരിഷ്കരിച്ചു. മൂലപാഠത്തിലെ നിയമനിർദേശഭാവവും വാർഷിക ആവർത്തനവും കേന്ദ്രാരാധനാസ്ഥല സൂചനയും നിലനിർത്തി.
