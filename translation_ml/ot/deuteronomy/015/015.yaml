id: DEU.15.15
reference: Deuteronomy 15:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a servant in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: ml
  text: നീ ഈജിപ്തുദേശത്ത് അടിമയായിരുന്നുവെന്നും[a] നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ വീണ്ടെടുത്തുവെന്നും[b] ഓർക്കണം; അതുകൊണ്ട് ഞാൻ ഇന്ന് ഈ കാര്യം[c] നിന്നോടു കല്പിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദാസൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ עֶבֶד എന്ന പദത്തിന് രണ്ടർഥങ്ങളും വരാം; എന്നാൽ ഈജിപ്തിലെ ബന്ധനാവസ്ഥ ഇവിടെ ‘അടിമ’ എന്ന പരിഭാഷയെ കൂടുതൽ യോജിച്ചതാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘മോചനവില നൽകി വിടുവിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ ബന്ധനത്തിൽനിന്ന് വീണ്ടെടുക്കുകയോ മോചനവില നൽകി വിടുവിക്കുകയോ ചെയ്യുന്ന ആശയം വഹിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘ഈ വസ്തുത/കാര്യം’; ഇവിടെ പറഞ്ഞുകൊണ്ടിരിക്കുന്ന നിർദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: ഓർക്കണം
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഈ സന്ദർഭത്തിൽ ക്രിയാരൂപം ഒരു നിർദേശം പ്രകടിപ്പിക്കുന്നു; ആ നിർബന്ധസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֶבֶד
  choice: അടിമ
  rationale: ഈജിപ്തിലെ പീഡനപരമായ ബന്ധനാവസ്ഥയാണ് സന്ദർഭത്തിൽ പ്രധാനമായതിനാൽ ‘ദാസൻ’ എന്നതിനെക്കാൾ ‘അടിമ’ ശക്തവും കൃത്യവുമാണ്.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്ത്
  rationale: ‘ഈജിപ്തിൽ’ എന്നു ചുരുക്കാതെ എബ്രായത്തിലെ ‘ഈജിപ്തുദേശം’ എന്ന ചരിത്രപരമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיִּפְדְּךָ
  choice: നിന്നെ വീണ്ടെടുത്തു
  rationale: ബന്ധനത്തിൽനിന്ന് മോചനവില നൽകി വിടുവിക്കുക എന്ന פדה എന്ന ക്രിയയുടെ അർഥവും അതിന്റെ ഉടമ്പടിസംബന്ധമായ ധ്വനിയും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന ബന്ധം നേരിട്ട് പ്രകടിപ്പിക്കുകയും മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി യഹ്‌വെയോടു ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: മുൻപറഞ്ഞ വീണ്ടെടുപ്പിൽനിന്ന് ഇപ്പോഴത്തെ കല്പനയിലേക്കുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: ഞാൻ ... നിന്നോടു കല്പിക്കുന്നു
  rationale: വ്യക്തമായ ഒന്നാംപുരുഷ സർവനാമവും വർത്തമാനകാല നിർദേശഭാവവും നിലനിർത്തുന്നു.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דבר എന്ന വിശാലാർഥമുള്ള പദത്തെ ‘കല്പന’ എന്നു ചുരുക്കാതെ, സന്ദർഭത്തിലെ നിർദേശത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളമായി നൽകുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: ഉടമ്പടിപരമായ ആഹ്വാനത്തിന്റെ വർത്തമാന അടിയന്തരത നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ പേരായി നൽകുന്നു.
- issue: עֶבֶד സൂചിപ്പിക്കുന്ന സാമൂഹിക സ്ഥിതി
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: ഈജിപ്തിലെ നിർബന്ധിതവും പീഡനപരവുമായ ബന്ധനമാണ് വാക്യത്തിന്റെ ധാർമിക പ്രേരണ; അതിനാൽ മൃദുവായ പദത്തിനു പകരം ‘അടിമ’ തിരഞ്ഞെടുക്കുന്നു.
- issue: פדה എന്ന ക്രിയയുടെ മോചനധ്വനി
  choice: വീണ്ടെടുത്തു
  alternative: മോചനവില നൽകി വിടുവിച്ചു / സ്വതന്ത്രനാക്കി
  rationale: ‘വീണ്ടെടുത്തു’ എന്നത് ബന്ധനത്തിൽനിന്നുള്ള മോചനവും ദൈവിക വീണ്ടെടുപ്പിന്റെ ദൈവശാസ്ത്രപരമായ ധ്വനിയും സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു; മോചനത്തിന്റെ കൃത്യമായ രീതി പാഠത്തിൽ ഇല്ലാത്തതിനാൽ വിശദീകരണം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. രണ്ടാംപുരുഷ ഏകവചനം നിലനിർത്തിയിട്ടുണ്ട്. മൂലത്തിലെ കാരണം–നിഗമന ഘടന അർദ്ധവിരാമത്തിലൂടെ സംരക്ഷിച്ചു; ആവശ്യമില്ലാത്ത വിഭാഗീയ ദൈവശാസ്ത്രപദങ്ങൾ ഒഴിവാക്കി.
