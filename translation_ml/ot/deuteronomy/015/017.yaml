source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ אֶת הַ/מַּרְצֵ֗עַ וְ/נָתַתָּ֤ה בְ/אָזְנ/וֹ֙ וּ/בַ/דֶּ֔לֶת וְ/הָיָ֥ה לְ/ךָ֖ עֶ֣בֶד עוֹלָ֑ם וְ/אַ֥ף לַ/אֲמָתְ/ךָ֖ תַּעֲשֶׂה כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/017.yaml
  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your servant permanently. And you shall do the same for your female servant.
translation:
  language: ml
  text: അപ്പോൾ നീ തുളയ്ക്കുന്ന കൂർത്ത ഉപകരണം എടുത്ത് അവന്റെ ചെവിയിലൂടെ വാതിലിൽ കുത്തിക്കയറ്റണം; അവൻ സ്ഥിരമായി നിന്റെ അടിമയായിരിക്കും.[a] നിന്റെ അടിമസ്ത്രീയോടും നീ അങ്ങനെതന്നെ ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നേക്കുമായി”; ഈ നിയമസന്ദർഭത്തിൽ എബ്രായപദം “ജീവിതകാലം മുഴുവൻ” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: തുളയ്ക്കാനുള്ള സൂചി
  rationale: מַרְצֵעַ തുളയ്ക്കാൻ ഉപയോഗിക്കുന്ന കൂർത്ത ഉപകരണമാണ്. മലയാളത്തിൽ അപരിചിതമായ സാങ്കേതികപദം ഒഴിവാക്കി ഉപകരണത്തിന്റെ പ്രവർത്തനം വ്യക്തമായി പറയുന്നു.
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: അവന്റെ ചെവിയിലൂടെ വാതിലിലേക്കു കുത്തിക്കയറ്റണം
  rationale: എബ്രായത്തിലെ ‘അവന്റെ ചെവിയിൽ/ചെവിയിലൂടെ, വാതിലിൽ/വാതിലിലേക്ക് വെക്കുക’ എന്ന പ്രയോഗം ആചാരപരമായ ചെവിതുളയ്ക്കൽ വ്യക്തമാക്കുന്നു; വാതിലിനോട് ചേർത്തുവെച്ച ചെവിയിലൂടെ ഉപകരണം കുത്തുന്ന പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: עֶבֶד
  choice: അടിമ
  rationale: ഇവിടെ നിയമപരമായി ബന്ധിതവും സ്ഥിരവുമായ പദവിയാണ് ഉദ്ദേശിക്കുന്നത്; ‘ദാസൻ’ എന്നതിനെക്കാൾ ‘അടിമ’ സാമൂഹിക-നിയമപരമായ ശക്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עוֹלָם
  choice: ജീവിതകാലം മുഴുവൻ
  rationale: ഈ നിയമസന്ദർഭത്തിൽ עוֹלָם അനന്തമായ കാലത്തേക്കാൾ ആ വ്യക്തിയുടെ ശേഷിക്കുന്ന ജീവിതകാലം മുഴുവൻ നിലനിൽക്കുന്ന പദവിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֲמָתְךָ
  choice: നിന്റെ അടിമസ്ത്രീ
  rationale: אָמָה സ്ത്രീലിംഗത്തിലുള്ള അടിമയെ സൂചിപ്പിക്കുന്നു. עֶבֶד എന്ന പദത്തിന് നൽകിയ ‘അടിമ’ എന്ന പരിഭാഷയുമായി നിയമപരമായ നിലയിൽ ഏകീകരണം പാലിക്കുന്നു.
- source_word: וְאַף
  choice: -ഓടും
  rationale: മുൻനിയമം സ്ത്രീയിലേക്കും വ്യാപിപ്പിക്കുന്ന ചേർക്കൽഭാവം ‘അടിമസ്ത്രീയോടും’ എന്നതിലെ ‘-ഉം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תַּעֲשֶׂה כֵּן
  choice: നീ അങ്ങനെതന്നെ ചെയ്യണം
  rationale: അതേ നടപടി സ്ത്രീയോടും പ്രയോഗിക്കണമെന്ന നേരിട്ടുള്ള നിയമനിർദേശം ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഇസ്രായേല്യ അടിമത്തനിയമത്തിലെ ബന്ധിത പദവിയുടെ പരിഭാഷ
  choice: ‘അടിമ’ / ‘അടിമസ്ത്രീ’
  alternative: ‘ദാസൻ’ / ‘ദാസി’ അല്ലെങ്കിൽ ‘വേലക്കാരൻ’ / ‘വേലക്കാരി’
  rationale: ഈ വാക്യം നിയമപരമായി ബന്ധിതമായ, ആചാരത്തിലൂടെ സ്ഥിരപ്പെടുത്തുന്ന പദവിയെക്കുറിച്ചാണ്. അതിന്റെ സാമൂഹിക യാഥാർഥ്യം മയപ്പെടുത്താതെ നൽകാൻ ‘അടിമ’ കൂടുതൽ യോജിക്കുന്നു.
- issue: עוֹלָם എന്ന കാലപ്രയോഗത്തിന്റെ പരിധി
  choice: ‘ജീവിതകാലം മുഴുവൻ’ എന്ന മുഖ്യവാചകം; ‘എന്നേക്കുമായി/സ്ഥിരമായി’ എന്ന പദാർത്ഥവികല്പം അടിക്കുറിപ്പിൽ
  alternative: ‘എന്നേക്കുമായി’ അല്ലെങ്കിൽ ‘സ്ഥിരമായി’
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ പദം വ്യക്തിയുടെ ജീവിതപരിധിക്കുള്ള സ്ഥിരതയെ സൂചിപ്പിക്കാം. ‘ജീവിതകാലം മുഴുവൻ’ അനന്തത എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു; എങ്കിലും എബ്രായത്തിന്റെ വിശാലമായ ദൈർഘ്യഭാവം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. അപരിചിതമായ ഉപകരണനാമത്തിനു പകരം പ്രവർത്തനാധിഷ്ഠിതമായ ‘തുളയ്ക്കാനുള്ള സൂചി’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിലെ ബന്ധപ്പെട്ട കാലപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
