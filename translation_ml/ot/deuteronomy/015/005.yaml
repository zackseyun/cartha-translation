  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֚ק אִם שָׁמ֣וֹעַ תִּשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֶ֑י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/005.yaml
  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവയുടെ വാക്ക് നീ ശ്രദ്ധയോടെ കേൾക്കുകയും, ഇന്നു ഞാൻ നിന്നോടു കൽപ്പിക്കുന്ന ഈ കല്പന മുഴുവനും പാലിച്ചു നടപ്പാക്കാൻ ജാഗ്രത കാണിക്കുകയും ചെയ്താൽ മാത്രം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק אִם
  choice: ചെയ്താൽ മാത്രം
  rationale: ഈ വാക്യം മുൻവാക്യത്തിലെ വാഗ്ദാനത്തിന് ഊന്നലുള്ള നിബന്ധന നൽകുന്നു; മലയാളത്തിൽ വാക്യാവസാനത്തെ ‘മാത്രം’ ആ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: ശ്രദ്ധയോടെ കേൾക്കുകയും
  rationale: ക്രിയയുടെ ആവർത്തനമുള്ള ഹീബ്രു ഘടന കേൾക്കുന്നതിലെ ഊന്നലും ശ്രദ്ധയും സൂചിപ്പിക്കുന്നു.
- source_word: בְּקוֹל יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവയുടെ വാക്ക്
  rationale: ‘ശബ്ദം/വാക്ക് കേൾക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിൽ കല്പന അനുസരിച്ച് കേൾക്കുക എന്ന ആശയമുണ്ട്; ‘വാക്ക്’ ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ദൈവനാമം വ്യക്തിനാമമായ ‘യഹോവ’ എന്നു നിലനിർത്തുന്നു.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: ജാഗ്രതയോടെ അനുസരിക്കുകയും
  rationale: അക്ഷരാർഥത്തിൽ ‘കാത്തുസൂക്ഷിച്ച് ചെയ്യുക’; ഇവിടെ കല്പന ശ്രദ്ധാപൂർവം പ്രാവർത്തികമാക്കുന്നതാണ് ഉദ്ദേശ്യം. ‘അനുസരിക്കുക’ ഈ സംയുക്ത ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת כָּל הַמִּצְוָה הַזֹּאת
  choice: ഈ കല്പന മുഴുവനും
  rationale: ഏകവചനമായ ‘കല്പന’യും כָּל സൂചിപ്പിക്കുന്ന സമഗ്രതയും സംരക്ഷിക്കുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്നു
  rationale: മോശെയുടെ ഇപ്പോഴത്തെ കല്പനാപ്രഖ്യാപനത്തിന്റെ സമയസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവനാമം יהוה എങ്ങനെ പ്രതിനിധീകരിക്കണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ പ്രതിനിധീകരിക്കുന്നു; പ്രത്യേക സമുദായവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ‘കേൾക്കുക’ എന്നത് വെറും ശ്രവണമോ അനുസരണമോ
  choice: ‘ശ്രദ്ധയോടെ കേൾക്കുക’ എന്നും തുടർന്നുള്ള പ്രവൃത്തിയെ ‘അനുസരിക്കുക’ എന്നും വേർതിരിച്ചു
  alternative: ‘പൂർണമായി അനുസരിക്കുക’ എന്നു മാത്രം
  rationale: שמע എന്ന പദത്തിന്റെ കേൾവി-അനുസരണ വ്യാപ്തി നിലനിർത്തുന്നതിനൊപ്പം, മൂലത്തിലെ രണ്ടു ക്രിയാഘടകങ്ങളെയും ഒന്നാക്കി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന നിബന്ധനാഭാവം നിലനിർത്താൻ വാക്യം ‘ചെയ്താൽ മാത്രം’ എന്നു അവസാനിപ്പിച്ചു; വാക്യം ഒറ്റയ്ക്ക് വായിക്കുമ്പോഴും അർഥം വ്യക്തമാണ്.
