  to: നിന്റെ ദൈവമായ യഹോവയുടെ വാക്ക് നീ ശ്രദ്ധയോടെ കേൾക്കുകയും, ഇന്നു ഞാൻ നിന്നോടു കൽപ്പിക്കുന്ന ഈ കല്പന മുഴുവനും പാലിച്ചു നടപ്പാക്കാൻ ജാഗ്രത കാണിക്കുകയും ചെയ്താൽ മാത്രം.
