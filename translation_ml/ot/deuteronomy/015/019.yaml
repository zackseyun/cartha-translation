  to: നിന്റെ കന്നുകാലിക്കൂട്ടത്തിലും ആട്ടിൻപറ്റത്തിലും ജനിക്കുന്ന ഓരോ ആൺകടിഞ്ഞൂലിനെയും[a] നിന്റെ ദൈവമായ യഹ്‌വേക്കായി വിശുദ്ധമായി വേർതിരിക്കണം. നിന്റെ കാളയുടെ കടിഞ്ഞൂലിനെക്കൊണ്ട് പണിയെടുപ്പിക്കരുത്; നിന്റെ ആട്ടിൻപറ്റത്തിലെ കടിഞ്ഞൂലിന്റെ രോമം കത്രിക്കരുത്.
