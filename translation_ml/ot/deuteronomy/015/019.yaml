reference: Deuteronomy 15:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּֽל הַ/בְּכ֡וֹר אֲשֶׁר֩ יִוָּלֵ֨ד בִּ/בְקָרְ/ךָ֤ וּ/בְ/צֹֽאנְ/ךָ֙ הַ/זָּכָ֔ר תַּקְדִּ֖ישׁ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֤א תַעֲבֹד֙ בִּ/בְכֹ֣ר שׁוֹרֶ֔/ךָ וְ/לֹ֥א תָגֹ֖ז בְּכ֥וֹר צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: ml
  text: നിന്റെ കന്നുകാലിക്കൂട്ടത്തിലും ആട്ടിൻപറ്റത്തിലും ജനിക്കുന്ന ഓരോ ആൺകടിഞ്ഞൂലിനെയും[a] നിന്റെ ദൈവമായ യഹ്‌വേക്കായി വിശുദ്ധമായി വേർതിരിക്കണം. നിന്റെ കാളയുടെ കടിഞ്ഞൂലിനെക്കൊണ്ട് പണിയെടുപ്പിക്കരുത്; നിന്റെ ആട്ടിൻപറ്റത്തിലെ കടിഞ്ഞൂലിന്റെ രോമം കത്രിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്റെ കന്നുകാലിക്കൂട്ടത്തിൽനിന്നും ആട്ടിൻപറ്റത്തിൽനിന്നും ജനിക്കുന്ന ആൺകടിഞ്ഞൂലുകളെയെല്ലാം.”'
    reason: כָּל הַבְּכוֹר എന്ന ഏകവചനപ്രയോഗം വിതരണാർഥത്തിലോ കൂട്ടാർഥത്തിലോ മലയാളത്തിൽ അവതരിപ്പിക്കാം; പ്രധാനപാഠം വിതരണാർഥം സ്വീകരിക്കുന്നു.
lexical_decisions:
- source_word: כָּל הַבְּכוֹר ... הַזָּכָר
  choice: ഓരോ ആൺകടിഞ്ഞൂലിനെയും
  rationale: ഏകവചനത്തോടുകൂടിയ כָּל ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോ’ എന്നാണ്; הַזָּכָר ആൺമൃഗങ്ങളെയാണ് നിർദിഷ്ടമാക്കുന്നത്. ‘കടിഞ്ഞൂൽ’ ആദ്യമായി ജനിക്കുന്ന സന്തതിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר יִוָּלֵד
  choice: ജനിക്കുന്ന
  rationale: ילד എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ജനിക്കപ്പെടുക/ജനിക്കുക എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘ജനിക്കുന്ന’ സ്വാഭാവികമാണ്.
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: നിന്റെ കന്നുകാലിക്കൂട്ടത്തിലും ആട്ടിൻപറ്റത്തിലും
  rationale: בקר വലിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെയും צאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലികളുടെ പറ്റത്തെയും സൂചിപ്പിക്കുന്നു. പ്രസംഗസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവികമായ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: תַּקְדִּישׁ
  choice: വിശുദ്ധീകരിക്കണം
  rationale: קדש എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വിശുദ്ധമായി വേർതിരിക്കുക എന്ന ആരാധനാപരമായ അർഥം വഹിക്കുന്നു; ‘വിശുദ്ധീകരിക്കുക’ ആ ബലം നിലനിർത്തുന്നു.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേക്കായി
  rationale: ലാമെദ് സമർപ്പണത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; יהוה എന്ന ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: നിന്റെ കാളയുടെ കടിഞ്ഞൂലിനെക്കൊണ്ട് പണിയെടുപ്പിക്കരുത്
  rationale: עבד കൂടെയുള്ള ב ഇവിടെ മൃഗത്തെ അധ്വാനത്തിനായി ഉപയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പണിയെടുപ്പിക്കുക’ വിലക്കിന്റെ പ്രായോഗിക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: നിന്റെ ആട്ടിൻപറ്റത്തിലെ കടിഞ്ഞൂലിന്റെ രോമം കത്രിക്കുകയുമരുത്
  rationale: גזז എന്നത് രോമം കത്രിക്കുക എന്നാണ്. צאן എന്ന വിശാല പദം ‘ആട്ടിൻപറ്റം’ എന്നു നിലനിർത്തി, മലയാളത്തിൽ ആവശ്യമായ ‘രോമം’ വ്യക്തമാക്കി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമം പൊതുപദവിയാൽ മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; പ്രത്യേക മതവിഭാഗപരമായ രൂപം ഒഴിവാക്കി.
- issue: תַּקְדִּישׁ എന്നതിലെ വിശുദ്ധമായി വേർതിരിക്കൽ
  choice: വിശുദ്ധീകരിക്കണം
  alternative: സമർപ്പിക്കണം; വിശുദ്ധമായി വേർതിരിക്കണം
  rationale: ആദ്യജാത മൃഗത്തെ ദൈവത്തിനായി ആരാധനാപരമായി വേർതിരിക്കുന്ന ആശയം നിലനിർത്തുന്നു; അതിന്റെ തുടർന്നുള്ള കൃത്യമായ ആചാരപരിണതിയെ വാക്യത്തിൽ ചേർത്ത് നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കൃഷി-മൃഗപരിപാലന പശ്ചാത്തലം സ്വാഭാവികമായി വ്യക്തമാക്കിക്കൊണ്ട് മൂലപാഠത്തിലെ വലിയ കന്നുകാലികളും ചെറിയ ആട്ടുവർഗവും തമ്മിലുള്ള വ്യത്യാസം സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
