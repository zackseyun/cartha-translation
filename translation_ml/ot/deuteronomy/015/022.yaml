source:
  edition: WLC
  text: בִּ/שְׁעָרֶ֖י/ךָ תֹּאכֲלֶ֑/נּוּ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יַחְדָּ֔ו כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: ml
  text: നിന്റെ പട്ടണങ്ങൾക്കുള്ളിൽ[a] നീ അതു ഭക്ഷിക്കാം; ആചാരപരമായി അശുദ്ധനായവനും ശുദ്ധനായവനും ഒരുപോലെ അതു ഭക്ഷിക്കാം[b]—കലമാനെയും മാനിനെയുംപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ’; അതായത്, നിന്റെ പട്ടണങ്ങളിലോ പ്രാദേശിക സമൂഹങ്ങളിലോ.
    reason: cultural_note
  - marker: b
    text: ആചാരപരമായി അശുദ്ധനായവനും ആചാരപരമായി ശുദ്ധനായവനും ഇതു ഭക്ഷിക്കാമെന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണങ്ങൾക്കുള്ളിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ’ എന്നാണെങ്കിലും, ഇവിടെ കവാടങ്ങൾ പട്ടണത്തെയോ പ്രാദേശിക സമൂഹത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. ആധുനിക മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘പട്ടണങ്ങൾക്കുള്ളിൽ’ എന്നു നൽകി; അടിസ്ഥിത ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: תֹּאכֲלֶנּוּ
  choice: നീ അതു ഭക്ഷിക്കാം
  rationale: രണ്ടാം പുരുഷ ഏകവചന ക്രിയയും മൂന്നാം പുരുഷ ഏകവചന കർമപ്രത്യയവും മുൻസന്ദർഭത്തിലെ മൃഗത്തെയോ അതിന്റെ മാംസത്തെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ അനുമതിയുടെ ഭാവം ‘ഭക്ഷിക്കാം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַטָּמֵא
  choice: ആചാരപരമായി അശുദ്ധനായവൻ
  rationale: ഇത് ധാർമിക ദുഷ്ടതയെയല്ല, ആചാരപരമായ നിലയെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ആചാരപരമായ അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കി.
- source_word: וְהַטָּהוֹר
  choice: ശുദ്ധനായവൻ
  rationale: הַטָּמֵא എന്നതോടു ചേർന്ന ആചാരപരമായ വിരുദ്ധപദമാണ്. മുൻപത്തെ വിശേഷണം ഈ പദത്തിന്റെയും ആചാരപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יַחְדָּו
  choice: ഒരുപോലെ
  rationale: ഇരു വിഭാഗക്കാർക്കും തുല്യമായി ഭക്ഷിക്കാമെന്ന വിതരണാർഥം നൽകുന്നു; ‘ഒരുമിച്ച്’ എന്നു പറഞ്ഞാൽ ഒരേ സമയത്ത് ഭക്ഷിക്കണമെന്ന അനാവശ്യ സൂചന വരാം.
- source_word: כַּצְּבִי
  choice: കലമാനിനെപ്പോലെ
  rationale: צְבִי ഗസെൽ വർഗത്തിലുള്ള മൃഗത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ പരിചിതവും യോജിച്ചതുമായ വന്യമൃഗനാമമായി ‘കലമാൻ’ സ്വീകരിച്ചു.
- source_word: וְכָאַיָּל
  choice: മാനിനെപ്പോലെ
  rationale: אַיָּל മാൻ, ചിലപ്പോൾ പ്രത്യേകിച്ച് ആൺമാൻ, എന്നർഥം നൽകുന്നു. ഇവിടെ പൊതുവായ ആധുനിക മലയാളപദമായ ‘മാൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ‘അശുദ്ധൻ’ എന്നും ‘ശുദ്ധൻ’ എന്നും പറയുന്നതിന്റെ സ്വഭാവം
  choice: ആചാരപരമായ നിലയായി വ്യക്തമായി അവതരിപ്പിച്ചു
  alternative: വിശേഷണമില്ലാതെ ‘അശുദ്ധനായവനും ശുദ്ധനായവനും’ എന്നു മാത്രം നൽകുക
  rationale: എബ്രായ സന്ദർഭം ആചാരശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്; ധാർമിക സ്വഭാവത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയായി വായിക്കപ്പെടാതിരിക്കാൻ ഇത് വ്യക്തമാക്കി. എന്നാൽ ഇരു വിഭാഗക്കാർക്കും ഭക്ഷിക്കാമെന്ന വാക്യത്തിന്റെ സംഘർഷവും പ്രാധാന്യവും അതേപടി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ’ എബ്രായ വ്യാകരണത്തോട് ചേർന്നു നിൽക്കുന്നു. ‘കവാടങ്ങൾ’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിനു പകരം സ്വാഭാവികമായ ‘പട്ടണങ്ങൾ’ മുഖ്യവാചകത്തിൽ നൽകി, മൂലരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
