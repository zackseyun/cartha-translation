revisions:
- from: നിന്റെ സഹോദരനായ ഒരു എബ്രായപുരുഷനോ എബ്രായസ്ത്രീയോ നിനക്കു വിൽക്കപ്പെടുകയും ആറു വർഷം നിന്നെ സേവിക്കുകയും ചെയ്താൽ, ഏഴാം വർഷത്തിൽ നീ അയാളെ നിന്റെ അടുക്കൽനിന്ന് സ്വതന്ത്രനായി വിട്ടയക്കണം.[a]
  to: നിന്റെ സഹോദരങ്ങളിൽപ്പെട്ട ഒരു എബ്രായപുരുഷനോ എബ്രായസ്ത്രീയോ നിനക്കു വിൽക്കപ്പെടുകയും ആറു വർഷം നിന്നെ സേവിക്കുകയും ചെയ്താൽ, ഏഴാം വർഷത്തിൽ നീ അയാളെ നിന്റെ ഇടയിൽനിന്ന് സ്വതന്ത്രനായി വിട്ടയക്കണം.[a]
  rationale: The revision resolves the Malayalam agreement and scope problem in the kinship phrase while retaining its familial sense. It also uses a more idiomatic expression for release from the addressee’s sphere. The source’s masculine singular wording after the male/female pair is preserved in the main text and explained by the existing footnote.
