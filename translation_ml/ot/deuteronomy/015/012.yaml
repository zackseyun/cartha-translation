source:
  edition: WLC
  text: כִּֽי יִמָּכֵ֨ר לְ/ךָ֜ אָחִ֣י/ךָ הָֽ/עִבְרִ֗י א֚וֹ הָֽ/עִבְרִיָּ֔ה וַ/עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בַ/שָּׁנָה֙ הַ/שְּׁבִיעִ֔ת תְּשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵ/עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: ml
  text: നിന്റെ സഹോദരങ്ങളിൽപ്പെട്ട ഒരു എബ്രായപുരുഷനോ എബ്രായസ്ത്രീയോ നിനക്കു വിൽക്കപ്പെടുകയും ആറു വർഷം നിന്നെ സേവിക്കുകയും ചെയ്താൽ, ഏഴാം വർഷത്തിൽ നീ അയാളെ നിന്റെ ഇടയിൽനിന്ന് സ്വതന്ത്രനായി വിട്ടയക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അയാളെ ... സ്വതന്ത്രനായി’ എന്ന് എബ്രായപാഠം പുല്ലിംഗ ഏകവചനത്തിൽ തുടരുന്നു. എന്നാൽ മുമ്പ് എബ്രായപുരുഷനെയോ എബ്രായസ്ത്രീയെയോ എന്നു പറഞ്ഞിരിക്കുന്നതിനാൽ ഈ നിയമം ഇരുവർക്കും ബാധകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּכֵר
  choice: നിനക്കു വിൽക്കപ്പെടുകയും
  rationale: നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയാർഥം നിലനിർത്തുന്നു; കടബാധ്യത മൂലം സ്വയം വിറ്റതാണോ മറ്റൊരാൾ വിറ്റതാണോ എന്ന് പാഠം വ്യക്തമാക്കാത്തതിനാൽ ആ രീതി നിർണ്ണയിക്കുന്നില്ല.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരനായ
  rationale: ഉടമ്പടിസമൂഹത്തിലെ കുടുംബബന്ധസദൃശമായ ‘സഹോദരൻ’ എന്ന ഭാഷ നിലനിർത്തുന്നു; ‘സ്വദേശി’ എന്നാക്കി അർഥം പരത്തുന്നില്ല.
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: ഒരു എബ്രായപുരുഷനോ എബ്രായസ്ത്രീയോ
  rationale: മൂലപാഠത്തിലെ എബ്രായ പുരുഷ-സ്ത്രീ രൂപങ്ങളെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു; ഇവിടെ ഇല്ലാത്ത ‘അടിമ’ എന്ന നാമം ചേർക്കുന്നില്ല.
- source_word: וַעֲבָדְךָ
  choice: നിന്നെ സേവിക്കുകയും
  rationale: עבד എന്ന ക്രിയയുടെ സേവനം/വേല എന്ന വിശാലാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שֵׁשׁ שָׁנִים
  choice: ആറു വർഷം
  rationale: സംഖ്യാവാചകത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: ഏഴാം വർഷത്തിൽ
  rationale: ആറുവർഷത്തെ സേവനത്തിനു ശേഷമുള്ള നിയമപരമായ കാലക്രമം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: תְּשַׁלְּחֶנּוּ
  choice: നീ അയാളെ ... വിട്ടയക്കണം
  rationale: שלח എന്ന ക്രിയയുടെ ‘അയയ്ക്കുക/വിട്ടയയ്ക്കുക’ എന്ന ദൃശ്യവും മോചനസന്ദർഭവും നിലനിർത്തുന്നു; പുല്ലിംഗ ഏകവചന പ്രത്യയം ‘അയാളെ’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: חָפְשִׁי
  choice: സ്വതന്ത്രനായി
  rationale: മോചിതനായ വ്യക്തിയുടെ സ്വതന്ത്രപദവി സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം നിലനിർത്തുന്നു.
- source_word: מֵעִמָּךְ
  choice: നിന്റെ അടുക്കൽനിന്ന്
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ കൂടെയായിരിക്കുന്നതിൽനിന്ന്’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; യജമാനന്റെ വീട്ടിലോ സേവനത്തിലോ നിന്നുള്ള വിടുതൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പുരുഷനെയും സ്ത്രീയെയും പറഞ്ഞശേഷം മോചിപ്പിക്കപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ ഏകവചനരൂപം
  choice: മുഖ്യപാഠത്തിൽ ‘അയാളെ ... സ്വതന്ത്രനായി’ എന്ന പുല്ലിംഗ ഏകവചനം നിലനിർത്തി, നിയമം ഇരുവർക്കും ബാധകമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘അയാളെയോ അവളെയോ’ എന്നും ‘ആ വ്യക്തിയെ സ്വതന്ത്രനായി/സ്വതന്ത്രയായി’ എന്നും ലിംഗവ്യത്യാസം തുറന്നുപറയുക.
  rationale: എബ്രായപാഠം ആദ്യം പുരുഷനെയും സ്ത്രീയെയും വ്യക്തമായി ഉൾക്കൊള്ളിച്ചിട്ടും തുടർന്ന് പുല്ലിംഗ ഏകവചന പ്രത്യയവും വിശേഷണവും ഉപയോഗിക്കുന്നു. അതിനാൽ വ്യാകരണരൂപം മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുകയും അതിന്റെ ഉൾക്കൊള്ളുന്ന നിയമപ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ നിയമവാക്യത്തിന് യോജിച്ച ഗൗരവവും വ്യക്തതയും പാലിച്ചു. ‘വിൽക്കപ്പെടുക’, ‘സേവിക്കുക’, ‘വിട്ടയക്കുക’, ‘സ്വതന്ത്രനായി’ എന്നീ പദങ്ങൾ ബന്ധിതസേവനത്തിന്റെയും മോചനത്തിന്റെയും ആശയം വ്യക്തമാക്കുന്നു; പാഠത്തിൽ ഇല്ലാത്ത സംവിധാനവിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
