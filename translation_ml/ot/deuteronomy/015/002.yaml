reference: Deuteronomy 15:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֶה֮ דְּבַ֣ר הַ/שְּׁמִטָּה֒ שָׁמ֗וֹט כָּל בַּ֨עַל֙ מַשֵּׁ֣ה יָד֔/וֹ אֲשֶׁ֥ר יַשֶּׁ֖ה בְּ/רֵעֵ֑/הוּ לֹֽא יִגֹּ֤שׂ אֶת רֵעֵ֨/הוּ֙ וְ/אֶת אָחִ֔י/ו כִּֽי קָרָ֥א שְׁמִטָּ֖ה לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: ml
  text: 'കടവിമോചനത്തിന്റെ വ്യവസ്ഥ ഇതാണ്: ഓരോ കടംകൊടുത്തവനും തന്റെ അയൽക്കാരന് കൊടുത്തിരിക്കുന്ന വായ്പയുടെ അവകാശവാദം വിട്ടുകളയണം[a]. അവൻ തന്റെ അയൽക്കാരനിൽനിന്നോ സഹോദരനിൽനിന്നോ[b] ഈടാക്കരുത്; കാരണം യഹ്‌വേക്കുള്ള കടവിമോചനം പ്രഖ്യാപിക്കപ്പെട്ടിരിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കടവിമോചനം’ എന്നതിന് ‘കടമൊഴിവാക്കൽ’ എന്നും ‘കടം റദ്ദാക്കൽ’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായത്തിലെ ‘ശെമിത്താ’ എന്ന പദം ശബ്ബത്ത് വർഷത്തിൽ കടം ഈടാക്കാനുള്ള അവകാശവാദം വിട്ടുകളയുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘സഹോദരൻ’ എന്നത് ഉടമ്പടിസമൂഹത്തിലെ ഒരു സഹഅംഗത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ചില വിവർത്തനങ്ങൾ ‘സഹയിസ്രായേല്യൻ’ എന്നിങ്ങനെ അർഥവ്യക്തമായി നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַשְּׁמִטָּה
  choice: വിമോചനത്തിന്റെ വ്യവസ്ഥ
  rationale: דְּבַר ഇവിടെ വെറും ‘വാക്ക്’ എന്നല്ല, വിശദീകരിക്കപ്പെടുന്ന നിയമവ്യവസ്ഥയെ സൂചിപ്പിക്കുന്നു; שְׁמִטָּה കടബാധ്യതയുടെ അവകാശവാദം വിട്ടുകളയുന്നതാണ്.
- source_word: הַשְּׁמִטָּה / שְׁמִטָּה
  choice: വിമോചനം
  rationale: ശബ്ബത്ത് വർഷത്തിൽ കടം ഈടാക്കാനുള്ള അവകാശം ഔപചാരികമായി വിട്ടുകളയുന്നതിനെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായ പദം.
- source_word: שָׁמוֹט
  choice: വിട്ടുകളയണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് കല്പനയുടെ ഊന്നൽ ശക്തമാക്കുന്നു; മലയാളത്തിൽ നിർബന്ധബോധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל בַּעַל מַשֵּׁה יָדוֹ
  choice: ഓരോ കടംകൊടുത്തവനും
  rationale: വായ്പയിൽനിന്നുള്ള അവകാശവാദം കൈവശമുള്ള വ്യക്തിയെയാണ് ഈ എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; അക്ഷരാർഥത്തിലുള്ള ‘കൈ’ മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ നിയമപരമായ പങ്ക് നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יַשֶּׁה בְּרֵעֵהוּ
  choice: തന്റെ അയൽക്കാരനു കൊടുത്ത കടം
  rationale: ഹിഫീൽ രൂപം കടമായി കൊടുക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ നാമവാക്യമായി നൽകിയാൽ ആശയം വ്യക്തവും സ്വാഭാവികവുമാകുന്നു.
- source_word: לֹא יִגֹּשׂ
  choice: കടം തിരിച്ചടയ്ക്കാൻ നിർബന്ധിക്കരുത്
  rationale: കടക്കാരനിൽനിന്ന് പണം ആവശ്യപ്പെടുക, സമ്മർദം ചെലുത്തുക, ഈടാക്കുക എന്നീ അർഥങ്ങൾ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: רֵעֵהוּ
  choice: അയൽക്കാരൻ
  rationale: സാമൂഹികവും ഉടമ്പടിസമൂഹപരവുമായ ബന്ധത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ വിവർത്തനം.
- source_word: אָחִיו
  choice: സഹോദരൻ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായ പദം നിലനിർത്തുന്നു; അതിന്റെ ഉടമ്പടിസമൂഹപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי קָרָא
  choice: കാരണം ... പ്രഖ്യാപിച്ചിരിക്കുന്നു
  rationale: എബ്രായത്തിലെ കർത്താവില്ലാത്ത പൂർണക്രിയ ഒരു പൊതുപ്രഖ്യാപിത അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാള കർമണിപ്രയോഗം അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: ലാമെദ് ദൈവനാമത്തോടുള്ള ബന്ധമോ സമർപ്പണമോ സൂചിപ്പിക്കുന്നു; ദൈവത്തിന്റെ ഉടമ്പടിനാമം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ ഉടമ്പടിനാമം ലിപ്യന്തരണം ചെയ്ത് സംരക്ഷിക്കുന്നു.
- issue: אָחִיו എന്ന പദത്തിന്റെ നിയമ-സാമൂഹിക വ്യാപ്തി
  choice: സഹോദരൻ
  alternative: സഹയിസ്രായേല്യൻ / സ്വന്തജനത്തിൽപ്പെട്ടവൻ
  rationale: മൂലത്തിലെ ബന്ധപദവും പുല്ലിംഗ രൂപവും മുഖ്യപാഠത്തിൽ നിലനിർത്തി, ഉടമ്പടിസമൂഹത്തെ ഉദ്ദേശിക്കുന്ന വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ശְׁמִטָּה കടം പൂർണമായി റദ്ദാക്കുന്നതാണോ ഈടാക്കൽ താൽക്കാലികമായി നിർത്തുന്നതാണോ
  choice: വിമോചനം; കടം വിട്ടുകളയണം
  alternative: കടം ഈടാക്കുന്നത് നിർത്തിവെക്കണം / കടം റദ്ദാക്കണം
  rationale: എബ്രായ പദത്തിന് ‘വിട്ടുകളയൽ’ എന്ന ആശയമുണ്ടെങ്കിലും നിയമഫലത്തിന്റെ കൃത്യസ്വഭാവത്തെക്കുറിച്ച് വ്യാഖ്യാനവ്യത്യാസമുണ്ട്; മുഖ്യപാഠം അതിനെ അമിതമായി നിർവചിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘വിട്ടുകളയണം’, ‘നിർബന്ധിക്കരുത്’ എന്നിവ കല്പനയുടെ ബലം സ്വാഭാവികമായി നൽകുന്നു; ദൈവനാമം ‘യഹ്‌വേ’ എന്നു നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
