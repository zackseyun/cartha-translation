source:
  edition: WLC
  text: כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בֵּֽרַכְ/ךָ֔ כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/הַֽעֲבַטְתָּ֞ גּוֹיִ֣ם רַבִּ֗ים וְ/אַתָּה֙ לֹ֣א תַעֲבֹ֔ט וּ/מָֽשַׁלְתָּ֙ בְּ/גוֹיִ֣ם רַבִּ֔ים וּ/בְ/ךָ֖ לֹ֥א יִמְשֹֽׁלוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ, നിന്നോടു വാഗ്ദാനം ചെയ്തതുപോലെ[a] നിന്നെ അനുഗ്രഹിച്ചിരിക്കുന്നു. നീ അനേകം ജനതകൾക്കു വായ്പ കൊടുക്കും; എന്നാൽ നീ വായ്പ വാങ്ങുകയില്ല. നീ അനേകം ജനതകളെ ഭരിക്കും; എന്നാൽ അവർ നിന്നെ ഭരിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്നോടു സംസാരിച്ചതുപോലെ.” ഹീബ്രുവിൽ അക്ഷരാർഥം “സംസാരിച്ചു” എന്നാണ്; എന്നാൽ ഈ ഉടമ്പടി-സന്ദർഭത്തിൽ അതിന് വാഗ്ദാനം എന്ന ആശയമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: בֵּרַכְךָ
  choice: നിന്നെ അനുഗ്രഹിച്ചിരിക്കുന്നു
  rationale: ഹീബ്രു പൂർണക്രിയയുടെ പൂർത്തിയായ പ്രവർത്തിയും ഇപ്പോഴുള്ള ഫലവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: നിന്നോടു വാഗ്ദാനം ചെയ്തതുപോലെ
  rationale: דבר എന്നത് അക്ഷരാർഥത്തിൽ ‘സംസാരിക്കുക’ ആണെങ്കിലും, ഉടമ്പടി-സന്ദർഭത്തിൽ മുൻപ് നൽകിയ വാഗ്ദാനത്തെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהַעֲבַטְתָּ
  choice: നീ ... വായ്പ കൊടുക്കും
  rationale: עבט എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപം ഇവിടെ മറ്റുള്ളവർക്കു കടം നൽകുക എന്ന കാരകാർഥം പ്രകടിപ്പിക്കുന്നു.
- source_word: גּוֹיִם רַבִּים
  choice: അനേകം ജനതകൾ
  rationale: സാമ്പത്തികവും രാഷ്ട്രീയവുമായ ദേശീയസന്ദർഭത്തിൽ גוים എന്നതിനു ‘ജനതകൾ’ സ്വാഭാവികവും വിശാലവുമായ തുല്യപദമാണ്.
- source_word: לֹא תַעֲבֹט
  choice: നീ വായ്പ വാങ്ങുകയില്ല
  rationale: മുൻപുള്ള ‘വായ്പ കൊടുക്കും’ എന്നതിനോടുള്ള ഹീബ്രു വിരുദ്ധസമാന്തരത വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: וּמָשַׁלְתָּ
  choice: നീ ... ഭരിക്കും
  rationale: משׁל എന്ന ക്രിയയുടെ ഭരണാധികാരമോ ആധിപത്യമോ ചെലുത്തുക എന്ന നേരിട്ടുള്ള അർഥം ലളിതമായി നൽകുന്നു.
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: അവർ നിന്നെ ഭരിക്കുകയില്ല
  rationale: ബഹുവചനക്രിയയുടെ കർത്താവ് മുൻപറഞ്ഞ അനേകം ജനതകളാണെന്ന ബന്ധം മലയാളത്തിൽ ‘അവർ’ എന്നു വ്യക്തമാക്കി, സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടി-നാമത്തെ ഒരു പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: דִּבֶּר എന്നതിന്റെ ഉടമ്പടി-സന്ദർഭാർഥം
  choice: വാഗ്ദാനം ചെയ്തു
  alternative: സംസാരിച്ചു / അരുളിച്ചെയ്തു
  rationale: സന്ദർഭത്തിൽ ദൈവം മുമ്പ് നൽകിയ ഉറപ്പിനെയാണ് വാക്യം ആശ്രയിക്കുന്നത്; എങ്കിലും ഹീബ്രുവിന്റെ അക്ഷരാർഥമായ ‘സംസാരിച്ചു’ എന്ന വായന അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘വായ്പ കൊടുക്കുക/വാങ്ങുക’ എന്ന സമാന്തരപ്രയോഗം സാമ്പത്തിക വിരുദ്ധതയും ‘ഭരിക്കും/ഭരിക്കുകയില്ല’ എന്ന ആവർത്തനം ഹീബ്രു വാക്യഘടനയും വ്യക്തമാക്കുന്നു.
