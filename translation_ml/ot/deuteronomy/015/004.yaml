id: DEU.15.4
reference: Deuteronomy 15:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶ֕פֶס כִּ֛י לֹ֥א יִֽהְיֶה בְּ/ךָ֖ אֶבְי֑וֹן כִּֽי בָרֵ֤ךְ יְבָֽרֶכְ/ךָ֙ יְהוָ֔ה בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹֽתֵן לְ/ךָ֥ נַחֲלָ֖ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: ml
  text: എന്നിരുന്നാലും[a], നിന്റെ ഇടയിൽ ഒരു ദരിദ്രനും ഉണ്ടാകുകയില്ല; കാരണം, നിന്റെ ദൈവമായ യാഹ്‌വേ നിനക്കു അവകാശമായി കൈവശമാക്കുന്നതിനായി നൽകുന്ന ദേശത്ത് യാഹ്‌വേ നിന്നെ തീർച്ചയായും അനുഗ്രഹിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എങ്കിലും,’ ‘എന്നാൽ,’ അല്ലെങ്കിൽ ‘മാത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രു אֶפֶס മുൻപുള്ള നിർദേശത്തോടു ബന്ധപ്പെട്ട ഒരു പരിമിതിയോ യോഗ്യതയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס
  choice: എന്നിരുന്നാലും
  rationale: മുൻപുള്ള കടമോചനനിർദേശത്തെ പരിമിതപ്പെടുത്തുന്ന ആശയമാറ്റം സൂചിപ്പിക്കുന്നു; ആ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶבְיוֹן
  choice: ദരിദ്രൻ
  rationale: സാമ്പത്തിക ഞെരുക്കത്തിലുള്ള ദരിദ്രനെയോ ആവശ്യക്കാരനെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ വിശാലവും സ്വാഭാവികവുമായ പദം.
- source_word: כִּי
  choice: കാരണം
  rationale: യഹോവയുടെ അനുഗ്രഹത്തെ മുൻവാക്യത്തിന്റെ കാരണമായി അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: നിങ്ങളെ തീർച്ചയായും അനുഗ്രഹിക്കും
  rationale: ക്രിയയുടെ ഹീബ്രു ഊന്നൽ അധിക അർഥം ചേർക്കാതെ ‘തീർച്ചയായും’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: נֹתֵן
  choice: തരുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം വാഗ്ദത്തദാനം നടന്നുകൊണ്ടിരിക്കുന്നതോ സമീപസ്ഥമോ ആയ പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു.
- source_word: נַחֲלָה
  choice: അവകാശം
  rationale: വിഹിതമായി ലഭിക്കുന്ന ഉടമസ്ഥാവകാശത്തെയും ഉടമ്പടിദേശത്തിന്റെ ആശയത്തെയും സംക്ഷിപ്തമായി വഹിക്കുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ദേശത്തെ സ്വന്തമാക്കി അധീനതയിൽ എടുക്കുക എന്ന ירשׁ എന്ന ക്രിയയുടെ ആശയം ആവർത്തനഭാരം കൂടാതെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരായി മാറ്റാതെ നിലനിർത്തുന്നു; ആധുനിക സാധാരണ മലയാളവായനക്കാർക്ക് കൂടുതൽ പരിചിതമായ ലിപ്യന്തരണം തിരഞ്ഞെടുത്തു.
- issue: ദരിദ്രൻ ഉണ്ടാകരുത് എന്ന പ്രസ്താവനയുടെ സ്വഭാവം
  choice: അവ്യക്തത പരിഹരിക്കാതെ നേരിട്ടുള്ള പ്രസ്താവനയായി നിലനിർത്തി
  alternative: ‘ദരിദ്രൻ ഉണ്ടാകേണ്ട ആവശ്യമില്ല’ എന്ന സാധ്യതാഭാവം
  rationale: ലֹא יִהְיֶה രൂപം നിരോധനമോ ആശയലക്ഷ്യമോ ഫലവാഗ്ദാനമോ എന്ന ബന്ധത്തിൽ വ്യാഖ്യാനസമ്മർദം നിലനിൽക്കുന്നു; മലയാളത്തിൽ ഒരു മാത്രം ദൈവശാസ്ത്രപരമായ പരിഹാരം ഇറക്കുമതി ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യത്തിലെ ഏകവചന അഭിസംബോധന മലയാളത്തിൽ ആദരസൂചകമായ ‘നിങ്ങൾ’ ഉപയോഗിച്ച് നൽകി; ‘അവിടന്ന്’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആദരപ്രയോഗമാണ്.
