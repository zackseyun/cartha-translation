- from: നിന്റെ ഹൃദയത്തിൽ ഒരു നീചചിന്ത ഉണ്ടാകാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക. ‘ഏഴാം വർഷം, കടമൊഴിവിന്റെ വർഷം[b], അടുത്തിരിക്കുന്നു’ എന്നു പറഞ്ഞുകൊണ്ട്, ദരിദ്രനായ നിന്റെ സഹോദരനോട്[c] നിന്റെ കണ്ണ് ദുഷിക്കുകയും[a] അവന് ഒന്നും കൊടുക്കാതിരിക്കുകയും ചെയ്യരുത്. അങ്ങനെ ചെയ്താൽ അവൻ നിനക്കെതിരെ യാഹ്‌വേയോട് നിലവിളിക്കും; അതു നിനക്കു പാപമായിത്തീരും.
  to: 'നിന്റെ ഹൃദയത്തിൽ ഒരു നീചമായ ചിന്ത ഉണ്ടാകാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക: ‘ഏഴാം വർഷം, കടമൊഴിവിന്റെ വർഷം[b], അടുത്തിരിക്കുന്നു’ എന്നു പറഞ്ഞ്, ദരിദ്രനായ നിന്റെ സഹോദരനോട്[c] പിശുക്കു കാണിക്കുകയും[a] അവന് ഒന്നും കൊടുക്കാതിരിക്കുകയും ചെയ്യരുത്. അങ്ങനെ ചെയ്താൽ അവൻ യാഹ്‌വേയോടു നിനക്കെതിരെ നിലവിളിക്കും; അതു നിനക്കു പാപമാകും.'
  rationale: The revision retains the full source meaning and causal sequence, while replacing an opaque literal idiom with the natural Malayalam expression “പിശുക്കു കാണിക്കുക.” Footnote a preserves the Hebrew wording and explains it. No theological or interpretive expansion has been introduced.
