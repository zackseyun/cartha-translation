source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: ml
  text: 'നിന്റെ ഹൃദയത്തിൽ ഒരു നീചമായ ചിന്ത ഉണ്ടാകാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക: ‘ഏഴാം വർഷം, കടമൊഴിവിന്റെ വർഷം[b], അടുത്തിരിക്കുന്നു’ എന്നു പറഞ്ഞ്, ദരിദ്രനായ നിന്റെ സഹോദരനോട്[c] പിശുക്കു കാണിക്കുകയും[a] അവന് ഒന്നും കൊടുക്കാതിരിക്കുകയും ചെയ്യരുത്. അങ്ങനെ ചെയ്താൽ അവൻ യാഹ്‌വേയോടു നിനക്കെതിരെ നിലവിളിക്കും; അതു നിനക്കു പാപമാകും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ കണ്ണ് ദുഷിക്കുക.’ ആവശ്യത്തിലിരിക്കുന്ന ഒരാളോട് പിശുക്കോ വിമുഖതയോ കാണിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ഭാഷാശൈലിയാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘മോചനത്തിന്റെ വർഷം’ അല്ലെങ്കിൽ ‘കടം റദ്ദാക്കുന്ന വർഷം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘സഹോദരൻ’ എന്നത് ഉടപ്പിറന്നവനെ മാത്രം അല്ല, ഉടമ്പടിസമൂഹത്തിലെ ഒരു സഹാംഗത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ ... פֶּן
  choice: ഉണ്ടാകാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക
  rationale: സ്വയം ജാഗ്രത പാലിക്കണമെന്ന മുന്നറിയിപ്പും തുടർന്നുള്ള നിഷേധസാധ്യതയും സ്വാഭാവികമായ മലയാളത്തിൽ ചേർത്തു നൽകുന്നു.
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: നിന്റെ ഹൃദയത്തിൽ ഒരു നീചചിന്ത
  rationale: דָבָר എന്ന പദത്തിന് ‘വാക്ക്/കാര്യം’ എന്ന വിശാല അർഥമുണ്ടെങ്കിലും, ഹൃദയവും തുടർന്നുള്ള ‘പറഞ്ഞുകൊണ്ട്’ എന്ന പ്രയോഗവും ഇവിടെ ഉള്ളിലെ ചിന്തയെയോ ഉദ്ദേശ്യത്തെയോ സൂചിപ്പിക്കുന്നു. בְלִיַּעַל വ്യക്തിനാമമല്ല, ധാർമികമായി നീചമായതിനെ വിശേഷിപ്പിക്കുന്നു.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: കടമൊഴിവിന്റെ വർഷം
  rationale: ആവർത്തനം 15-ലെ പശ്ചാത്തലത്തിൽ കടം ഈടാക്കുന്നതിൽനിന്നുള്ള മോചനമാണ് ഉദ്ദേശിക്കുന്നത്. ‘കടമൊഴിവ്’ സാധാരണ വായനക്കാർക്ക് ഈ പ്രത്യേക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְרָעָה עֵינְךָ
  choice: നിന്റെ കണ്ണ് ദുഷിക്കുകയും
  rationale: ആവശ്യത്തിലിരിക്കുന്നവനോടുള്ള പിശുക്കിനെയും വിമുഖതയെയും സൂചിപ്പിക്കുന്ന എബ്രായ ഭാഷാശൈലി മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: ദരിദ്രനായ നിന്റെ സഹോദരനോട്
  rationale: אָח എന്ന കുടുംബബന്ധപദം നിലനിർത്തുന്നു; ഇവിടെ അത് ഉടപ്പിറന്നവനെ മാത്രം അല്ല, ഉടമ്പടിസമൂഹത്തിലെ സഹാംഗത്തെയും സൂചിപ്പിക്കാം.
- source_word: וְלֹא תִתֵּן לוֹ
  choice: അവന് ഒന്നും കൊടുക്കാതിരിക്കുകയും ചെയ്യരുത്
  rationale: നിഷേധിക്കപ്പെട്ട സഹായത്തിന്റെ പ്രായോഗിക ഫലം വ്യക്തമായി നൽകുന്നു; ‘കൊടുക്കുക’ എന്ന മൂലക്രിയയും നിലനിർത്തുന്നു.
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: അവൻ നിനക്കെതിരെ യാഹ്‌വേയോട് നിലവിളിക്കും
  rationale: നീതിക്കായുള്ള പരാതിയെന്ന ഭാവം ‘നിനക്കെതിരെ ... നിലവിളിക്കും’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു; ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: അതു നിനക്കു പാപമായിത്തീരും
  rationale: കുറ്റത്തിന്റെ ഉത്തരവാദിത്വം സഹായം നിഷേധിച്ച വ്യക്തിക്കാണെന്ന മൂലപാഠത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവി ഉപയോഗിച്ച് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ‘കണ്ണ് ദുഷിക്കുക’ എന്ന എബ്രായ ഭാഷാശൈലി നിലനിർത്തണമോ
  choice: ഭാഷാശൈലി മുഖ്യപാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുക
  alternative: അവനോട് പിശുക്കു കാണിക്കുക
  rationale: മൂലപാഠത്തിന്റെ സാഹിത്യരൂപവും ധാർമികതീവ്രതയും സംരക്ഷിക്കുമ്പോൾ അടിക്കുറിപ്പ് അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- issue: אָחִיךָ എന്ന പദത്തിന്റെ സാമൂഹിക വ്യാപ്തി
  choice: നിന്റെ സഹോദരൻ
  alternative: നിന്റെ സഹ ഇസ്രായേല്യൻ; നിന്റെ ചാർച്ചക്കാരൻ
  rationale: മൂലത്തിലെ കുടുംബബന്ധഭാഷ നിലനിർത്തുന്നു; അതിന്റെ ഉടമ്പടിസമൂഹപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായത്തിലെ ‘ദുഷിച്ച കണ്ണ്’ എന്ന ഭാഷാശൈലി സുതാര്യതയ്ക്കായി നിലനിർത്തിയെങ്കിലും അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു. വാക്യത്തിന്റെ മുന്നറിയിപ്പുരൂപവും കാരണഫലക്രമവും സംരക്ഷിച്ചു.
