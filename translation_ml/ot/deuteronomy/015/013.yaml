id: DEU.15.13
reference: Deuteronomy 15:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי תְשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ לֹ֥א תְשַׁלְּחֶ֖/נּוּ רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/013.yaml
  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: ml
  text: നീ അവനെ നിന്റെ അടുക്കൽനിന്ന് സ്വതന്ത്രനായി വിട്ടയയ്ക്കുമ്പോൾ[a], അവനെ വെറുംകൈയോടെ വിട്ടയയ്ക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘നീ അവനെ നിന്റെ അടുക്കൽനിന്ന് സ്വതന്ത്രനായി വിട്ടയയ്ക്കുന്നെങ്കിൽ.’ എബ്രായ സംയോജകപദത്തിന് നിബന്ധനാർഥം (‘എങ്കിൽ’) അല്ലെങ്കിൽ കാലാർഥം (‘ചെയ്യുമ്പോൾ’) വരാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  choice: വിട്ടയയ്ക്കുമ്പോൾ
  rationale: ഈ സംയോജകപ്രയോഗത്തിന് ‘എങ്കിൽ’ എന്ന നിബന്ധനാർഥമോ ‘എപ്പോൾ/ചെയ്യുമ്പോൾ’ എന്ന കാലാർഥമോ വരാം. നിയമസന്ദർഭത്തിലെ പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവിസംഭവം സ്വാഭാവികമായി അറിയിക്കാൻ പ്രധാനവാചകത്തിൽ കാലാർഥം സ്വീകരിച്ചു; നിബന്ധനാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: תְשַׁלְּחֶנּוּ
  choice: അവനെ ... വിട്ടയയ്ക്കുക
  rationale: പീയേൽ രൂപത്തിലുള്ള שלח ഇവിടെ ഒരാളെ സേവനത്തിൽനിന്ന് പോകാൻ അനുവദിക്കുക എന്നർഥം നൽകുന്നു. രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ മലയാളക്രിയ ഉപയോഗിച്ച് എബ്രായ ആവർത്തനം സംരക്ഷിച്ചു.
- source_word: חָפְשִׁי
  choice: സ്വതന്ത്രനായി
  rationale: അടിമസേവനത്തിന് വിരുദ്ധമായ സ്വതന്ത്രാവസ്ഥയാണ് വിശേഷണം സൂചിപ്പിക്കുന്നത്. പുരുഷ ഏകവചനസൂചനയും അവസ്ഥയും സ്വാഭാവിക മലയാളത്തിൽ ‘സ്വതന്ത്രനായി’ എന്നു നൽകി.
- source_word: מֵעִמָּךְ
  choice: നിന്റെ അടുക്കൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്നോടൊപ്പമുള്ളിടത്തുനിന്ന്’ എന്ന ആശയം. ‘നിന്റെ സേവനത്തിൽനിന്ന്’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ മൂലത്തിന്റെ ബന്ധസൂചന നിലനിർത്തുന്നു.
- source_word: לֹא תְשַׁלְּחֶנּוּ
  choice: വിട്ടയയ്ക്കരുത്
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണക്രിയയുടെ നിയമപരമായ വിലക്ക് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ശക്തവുമായ നിരോധനരൂപത്തിൽ നൽകി.
- source_word: רֵיקָם
  choice: വെറുംകൈയോടെ
  rationale: ഒന്നും നൽകാതെ അയയ്ക്കുക എന്ന സന്ദർഭാർഥം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമായ ‘വെറുംകൈയോടെ’ കൃത്യമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ക്രിയാവർത്തനം ‘വിട്ടയയ്ക്കുക’ എന്ന ഒരേ പദത്തിലൂടെ സംരക്ഷിക്കുകയും യഥാർഥമായ കാലാർഥ–നിബന്ധനാർഥ ദ്വയസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
