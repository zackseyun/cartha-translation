source:
  edition: WLC
  text: כִּֽי פָתֹ֧חַ תִּפְתַּ֛ח אֶת יָדְ/ךָ֖ ל֑/וֹ וְ/הַעֲבֵט֙ תַּעֲבִיטֶ֔/נּוּ דֵּ֚י מַחְסֹר֔/וֹ אֲשֶׁ֥ר יֶחְסַ֖ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/008.yaml
  text: Instead[a], you must open your hand to him and surely lend him enough for whatever he lacks.
translation:
  language: ml
  text: മറിച്ച്, നീ നിന്റെ കൈ അവനുവേണ്ടി തീർച്ചയായും തുറക്കണം; അവന് എന്തു കുറവുണ്ടോ, അതിന് മതിയായത്ര നീ അവന് തീർച്ചയായും കടം കൊടുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘തുറക്കുക, നീ തുറക്കണം … കടം കൊടുക്കുക, നീ കടം കൊടുക്കണം’ എന്നാണ്; ഊന്നലിനായി ഒരേ ക്രിയയുടെ രൂപങ്ങൾ ആവർത്തിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: മറിച്ച്
  rationale: മുൻവാക്യത്തിലെ ഹൃദയം കഠിനമാക്കി സഹായം നിരസിക്കരുതെന്ന വിലക്കിനോട് ഈ വാക്യം വിപരീതമായി നിൽക്കുന്നതിനാൽ, ഇവിടെ കാരണാർഥത്തേക്കാൾ വൈപരീത്യാർഥമാണ് സന്ദർഭത്തിന് യോജിച്ചത്.
- source_word: פָתֹחַ תִּפְתַּח
  choice: തീർച്ചയായും തുറക്കണം
  rationale: ക്രിയയുടെ infinitive absolute രൂപവും finite verb-ഉം ചേർന്ന ആവർത്തനം കല്പനയുടെ ഊന്നൽ പ്രകടമാക്കുന്നു. ‘കൈ തുറക്കുക’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം ഉദാരമായി സഹായിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ അതേ രൂപത്തിൽ നിലനിർത്തി.
- source_word: יָדְךָ
  choice: നിന്റെ കൈ
  rationale: മൂലത്തിലെ വ്യക്തമായ ദൃശ്യരൂപം സംരക്ഷിക്കുകയും മലയാളത്തിലും ഉദാരതയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമായി നിലകൊള്ളുകയും ചെയ്യുന്നു.
- source_word: לוֹ
  choice: അവനുവേണ്ടി
  rationale: കൈ തുറക്കുന്ന പ്രവൃത്തിയുടെ ഗുണഭോക്താവായി ദരിദ്രനായ സഹോദരനെ വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ഈ ക്രിയാസന്ദർഭത്തിന് സ്വാഭാവികമായ രൂപമാണിത്.
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: അവനു കടം കൊടുക്കുകതന്നെ വേണം
  rationale: עבט എന്ന ക്രിയയുടെ causative അർഥമായ ‘കടം കൊടുക്കുക’ സംരക്ഷിച്ചു. ആവർത്തിത ക്രിയാരൂപത്തിന്റെ നിർബന്ധവും ഊന്നലും ‘കൊടുക്കുകതന്നെ വേണം’ എന്നതിലൂടെ അറിയിച്ചു; അതിനെ ‘ദാനം ചെയ്യുക’ എന്നാക്കി മാറ്റിയില്ല.
- source_word: דֵּי
  choice: മതിയായത്ര
  rationale: ആവശ്യം നിറവേറ്റുന്ന പര്യാപ്തമായ അളവിനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
- source_word: מַחְסֹרוֹ אֲשֶׁר יֶחְסַר לוֹ
  choice: അവന് എന്താണോ കുറവുള്ളത്, അതിന് മതിയായത്ര
  rationale: ‘അവന്റെ കുറവ്—അവന് കുറവുള്ളത്’ എന്ന മൂലത്തിലെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുമ്പോഴും ആവശ്യത്തിന്റെ തുറന്ന പരിധി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘കൈ തുറക്കുക’ എന്ന മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗവും ‘കടം കൊടുക്കുക’ എന്ന നിയമപരമായ ആശയവും നിലനിർത്തി; കല്പനയുടെ ഇരട്ട ഊന്നൽ മലയാളത്തിൽ ‘തീർച്ചയായും’ എന്നും ‘-തന്നെ വേണം’ എന്നും പ്രകടമാക്കി.
