base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: ml
  text: നിന്റെ ആട്ടിൻപറ്റത്തിൽനിന്നും മെതിക്കളത്തിൽനിന്നും മുന്തിരിച്ചക്കിൽനിന്നും അവന് സമൃദ്ധമായി നൽകണം[a]. നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ അനുഗ്രഹിച്ചിട്ടുള്ളതിൽനിന്ന് അവന് കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന് വേണ്ടുവോളം വിഭവങ്ങൾ നൽകണം.” എബ്രായത്തിൽ ഒരു ഇൻഫിനിറ്റീവ് ആബ്സല്യൂട്ട് രൂപവും അതേ ധാതുവിന്റെ ക്രിയാരൂപവും ചേർത്ത് കല്പനയ്ക്ക് ഊന്നൽ നൽകുന്നു; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ മോചനസമയത്ത് സമൃദ്ധമായി വിഭവങ്ങൾ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: അവന് ധാരാളമായി നൽകണം
  rationale: הַעֲנֵיק എന്ന ക്രിയയെ അതേ ധാതുവിന്റെ നിർവികാരരൂപമായ תַּעֲנִיק ശക്തിപ്പെടുത്തുന്നു. മോചിപ്പിക്കപ്പെടുന്ന ദാസന് വെറുതെ എന്തെങ്കിലും കൊടുക്കുക എന്നതിലുപരി മതിയായ വിധത്തിൽ വിഭവങ്ങൾ നൽകണമെന്ന കല്പനയുടെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ഇത് അറിയിക്കുന്നു.
- source_word: מִצֹּאנְךָ
  choice: നിന്റെ ആട്ടിൻപറ്റത്തിൽനിന്നും
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘ആട്ടിൻപറ്റം’ മലയാളത്തിൽ സ്വാഭാവികമായ സമഷ്ടിപദമാണ്.
- source_word: וּמִגָּרְנְךָ
  choice: മെതിക്കളത്തിൽനിന്നും
  rationale: גֹּרֶן അക്ഷരാർഥത്തിൽ ധാന്യം മെതിക്കുന്ന കളമാണ്; ഇവിടെ അവിടെനിന്നുള്ള ധാന്യവിളവിനെയും സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ മൂർത്തമായ കാർഷികചിത്രം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: וּמִיִּקְבֶךָ
  choice: മുന്തിരിച്ചക്കിൽനിന്നും
  rationale: יֶקֶב മുന്തിരി ചതച്ച് നീരെടുക്കുന്ന ചക്കിനെയോ അതിന്റെ സംഭരണിയെയോ സൂചിപ്പിക്കുന്നു. ‘മുന്തിരിച്ചക്ക്’ കാർഷികചിത്രം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ അനുഗ്രഹിച്ചിട്ടുള്ളതിൽനിന്ന്
  rationale: നൽകേണ്ട വിഭവങ്ങളുടെ ഉറവിടം ദൈവം മുമ്പേ നൽകിയ അനുഗ്രഹമാണെന്ന ബന്ധം ഈ രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അളവിന് അനുസൃതമായിരിക്കാം എന്ന സൂചന അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ‘Yahweh’ എന്ന ദൈവനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: תִּתֶּן לוֹ
  choice: അവന് കൊടുക്കണം
  rationale: വാക്യത്തിന്റെ അവസാനത്തിൽ കൊടുക്കാനുള്ള ബാധ്യതയെ ഹീബ്രു ലളിതമായി ആവർത്തിക്കുന്നു; മലയാളത്തിലും ആ ആവർത്തനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ ‘Yahweh’ എന്ന സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപം സ്വീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ കാർഷിക ത്രയം—ആട്ടിൻപറ്റം, മെതിക്കളം, മുന്തിരിച്ചക്ക്—മൂർത്തമായിത്തന്നെ നിലനിർത്തി; അവസാനത്തെ ആവർത്തനവും സംരക്ഷിച്ചു.
