source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֨ה ב֜/וֹ מ֗וּם פִּסֵּ֨חַ֙ א֣וֹ עִוֵּ֔ר כֹּ֖ל מ֣וּם רָ֑ע לֹ֣א תִזְבָּחֶ֔/נּוּ לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/021.yaml
  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: ml
  text: എന്നാൽ അതിന് മുടന്തോ കുരുടോ, അല്ലെങ്കിൽ മറ്റേതെങ്കിലും ഗുരുതരമായ വൈകല്യമോ[a] ഉണ്ടെങ്കിൽ, അതിനെ നിന്റെ ദൈവമായ യഹോവയ്ക്ക് ബലിയർപ്പിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ദോഷകരമായ/മോശമായ ഏതൊരു വൈകല്യവും’ എന്നാണ്; ബലിക്ക് അയോഗ്യമാക്കുന്ന ഗുരുതരമോ അംഗീകരിക്കാനാകാത്തതോ ആയ ശാരീരിക വൈകല്യമാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: എന്നാൽ ... ചെയ്താൽ
  rationale: മുൻവാക്യത്തിലെ നിർദേശത്തോടുള്ള വ്യത്യാസവും വ്യവസ്ഥയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: יִהְיֶה בּוֹ מוּם
  choice: അതിന് ഒരു വൈകല്യം ... ഉണ്ടായിരിക്കുകയാണെങ്കിൽ
  rationale: അക്ഷരാർഥമായ ‘അതിൽ ഒരു വൈകല്യം ഉണ്ടെങ്കിൽ’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: פִּסֵּחַ
  choice: മുടന്ത്
  rationale: നടക്കാനുള്ള ശാരീരികശേഷി തകരാറിലായ മൃഗത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ പദം.
- source_word: עִוֵּר
  choice: കുരുട്
  rationale: ശാരീരിക അന്ധതയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: כֹּל מוּם רָע
  choice: മറ്റേതെങ്കിലും ഗുരുതരമായ വൈകല്യം
  rationale: רָע ഇവിടെ ധാർമിക തിന്മയെക്കാൾ ബലിക്ക് അയോഗ്യമാക്കുന്ന ഗൗരവമുള്ള ശാരീരിക വൈകല്യത്തെ സൂചിപ്പിക്കുന്നു; ‘ഗുരുതരമായ’ എന്നത് അർഥം സ്വാഭാവികമായി കൈമാറുന്നു, അടിക്കുറിപ്പിൽ അക്ഷരാർഥസാധ്യതയും നിലനിർത്തുന്നു.
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: അതിനെ ... ബലിയർപ്പിക്കരുത്
  rationale: നിയമപരമായ നിരോധനവും ക്രിയയുടെ ബലികർമ്മസംബന്ധമായ അർഥവും വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പ്രത്യയവും സംരക്ഷിക്കുന്നു.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു നേരിട്ട് നൽകുകയും ഉടമ്പടിസംബന്ധമായ ‘നിന്റെ ദൈവം’ എന്ന അഭിസംബോധന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ദൈവനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- issue: מוּם רָע എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: ഗുരുതരമായ വൈകല്യം
  alternative: ദോഷകരമായ വൈകല്യം / മോശമായ വൈകല്യം
  rationale: ഇവിടെ רָע ധാർമിക തിന്മയെ ആരോപിക്കുന്നില്ല; ബലിക്ക് അംഗീകരിക്കാനാകാത്ത ശാരീരിക വൈകല്യത്തിന്റെ ഗൗരവമാണ് സൂചിപ്പിക്കുന്നത്. അക്ഷരാർഥത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമവാക്യത്തിന് യോജിച്ച ഗൗരവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വ്യക്തതയും പാലിച്ചു. ഉദാഹരണങ്ങളെയും പൊതുവിഭാഗത്തെയും വേർതിരിക്കാൻ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
