  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ നിനക്കു തരുന്ന ദേശത്തിലെ നിന്റെ പട്ടണങ്ങളിലൊന്നിൽ[a] നിന്റെ സഹോദരന്മാരിൽ ഒരാൾ ദരിദ്രനായാൽ[b], നീ നിന്റെ ഹൃദയം കഠിനമാക്കുകയോ ദരിദ്രനായ നിന്റെ സഹോദരനോടു നിന്റെ കൈ അടച്ചുപിടിക്കുകയോ അരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ ‘നിന്റെ കവാടങ്ങളിൽ ഒന്നിനകത്ത്’; ഇവിടെ ‘കവാടങ്ങൾ’ പട്ടണങ്ങളെയോ പാർപ്പിടകേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘സഹോദരന്മാർ’, ‘സഹോദരൻ’ എന്നീ കുടുംബബന്ധപദങ്ങൾ ഉടമ്പടി സമൂഹത്തിലെ സഹാംഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: ആയിരുന്നാൽ
  rationale: നിയമപരമായ സോപാധിക സാഹചര്യം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘സംഭവിക്കുമ്പോൾ’ എന്ന അർഥസാധ്യത പൂർണമായി നിഷേധിക്കുന്നില്ല.
- source_word: אֶבְיוֹן
  choice: ദരിദ്രൻ
  rationale: സാമ്പത്തികമായി ദരിദ്രനും ആവശ്യത്തിലുമുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പ്രധാന അർഥം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵאַחַד אַחֶיךָ / מֵאָחִיךָ
  choice: നിന്റെ സഹോദരന്മാരിൽ ഒരാൾ / നിന്റെ സഹോദരൻ
  rationale: ഉടമ്പടി സമൂഹത്തിലെ സഹാംഗങ്ങളെ കുടുംബബന്ധത്തിന്റെ ഭാഷയിൽ അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: നിന്റെ ഏതെങ്കിലും ഒരു പട്ടണത്തിൽ
  rationale: ‘നിന്റെ കവാടങ്ങളിൽ ഒന്നിൽ’ എന്ന പദശ പ്രയോഗം പട്ടണത്തെയോ പാർപ്പിടകേന്ദ്രത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ, പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ മലയാള അർഥം നൽകുകയും പദശ ചിത്രം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: നിന്റെ ഹൃദയം കഠിനമാക്കുകയോ അരുത്
  rationale: കരുണ കാണിക്കാതിരിക്കാൻ മനസ്സിനെ കടുപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ശരീരരൂപകം നിലനിർത്തുന്നു.
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: നിന്റെ കൈ അടച്ചുപിടിക്കുകയോ അരുത്
  rationale: സഹായം നൽകാതിരിക്കാനായി കൈ അടയ്ക്കുന്ന എബ്രായ രൂപകം സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടി സമൂഹത്തെ സൂചിപ്പിക്കുന്ന אַחֶיךָ / אָחִיךָ എന്ന ബന്ധഭാഷ
  choice: സഹോദരന്മാർ / സഹോദരൻ
  alternative: ബന്ധുക്കൾ; സഹഇസ്രായേല്യർ
  rationale: മൂലപാഠത്തിലെ കുടുംബബന്ധഭാഷ സമൂഹത്തിനുള്ളിലെ പരസ്പര ഉത്തരവാദിത്വത്തിന് നൽകുന്ന ഊന്നൽ നിലനിർത്തുന്നു; അതിന്റെ സാമൂഹിക വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു; ‘കർത്താവ്’ എന്ന പദവി പകരംവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹൃദയവും കൈയും സംബന്ധിച്ച മൂലപാഠത്തിലെ രൂപകങ്ങൾ നിലനിർത്തിയപ്പോൾ, ‘കവാടങ്ങൾ’ എന്ന സ്ഥലസൂചക പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യാർഥം പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
