base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: ml
  text: അവനെ സ്വതന്ത്രനാക്കി നിന്നിൽനിന്ന് അയച്ചുവിടുമ്പോൾ അതു നിനക്കു വിഷമമായി തോന്നരുത്. കാരണം, ഒരു കൂലിക്കാരന്റെ കൂലിയുടെ ഇരട്ടി മൂല്യത്തിനൊത്തവണ്ണം അവൻ ആറു വർഷം നിനക്കു സേവനം ചെയ്തിരിക്കുന്നു.[a] നിന്റെ ദൈവമായ യാഹ്‌വേ നീ ചെയ്യുന്ന സകലത്തിലും നിന്നെ അനുഗ്രഹിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു കൂലിക്കാരന്റെ കൂലിയുടെ ഇരട്ടിക്കു തുല്യമായി അവൻ നിനക്കു ആറു വർഷം സേവനം ചെയ്തിരിക്കുന്നു.” ആറു വർഷത്തെ അവന്റെ സേവനത്തിന്റെ മൂല്യത്തെ ഒരു കൂലിക്കാരന്റെ വേലയുമായി താരതമ്യം ചെയ്യുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  choice: അതു നിനക്കു വിഷമമായി തോന്നരുത്
  rationale: ‘നിന്റെ കണ്ണുകളിൽ കഠിനമായിരിക്കരുത്’ എന്ന എബ്രായ പ്രയോഗം ഒരു കാര്യം ഭാരമായോ അനിഷ്ടമായോ തോന്നുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആ വിലയിരുത്തൽഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ
  choice: അവനെ സ്വതന്ത്രനായി നിന്റെ അടുക്കൽനിന്ന് വിട്ടയയ്ക്കുമ്പോൾ
  rationale: חָפְשִׁי എന്നത് വെറുതെ പറഞ്ഞയയ്ക്കുന്നതല്ല, സ്വതന്ത്രനാക്കുന്നതാണ്. מֵעִמָּךְ എന്ന ബന്ധസൂചകപ്രയോഗത്തെ ‘നിന്റെ അടുക്കൽനിന്ന്’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി, ‘നിന്റെ സേവനത്തിൽനിന്ന്’ എന്ന വിശദീകരണം വാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: ഒരു കൂലിപ്പണിക്കാരന്റെ ഇരട്ടി കൂലിക്കു തുല്യമായ സേവനം
  rationale: מִשְׁנֶה എന്നതിലെ ‘ഇരട്ടി’ എന്ന ആശയവും שְׂכַר שָׂכִיר എന്നതിലെ കൂലിത്തൊഴിലിന്റെ താരതമ്യവും നിലനിർത്തുന്നു. സേവനത്തിന്റെ മൂല്യത്തെക്കുറിച്ചുള്ള എബ്രായ പ്രയോഗത്തിന്റെ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: അവൻ ആറു വർഷം നിനക്കു ചെയ്തിട്ടുണ്ട്
  rationale: עֲבָדְךָ ഇവിടെ ‘നിന്നെ സേവിച്ചു’ എന്ന ക്രിയാർഥത്തിലാണ്. മലയാളത്തിൽ മുൻപുള്ള ‘സേവനം’ എന്ന നാമത്തോട് ചേർത്ത് സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു; ബന്ധിത സേവകന്റെ സ്ഥിതി ചുറ്റുപാടിൽ വ്യക്തമാണ്.
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവ ... നിന്നെ അനുഗ്രഹിക്കും
  rationale: വാക്യത്തിന്റെ വാഗ്ദാനസ്വഭാവം ഭാവികാലത്തിൽ നൽകുകയും יהוה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: നീ ചെയ്യുന്ന സകലത്തിലും
  rationale: വായനക്കാരന്റെ എല്ലാ പ്രവൃത്തികളെയും ഉദ്യമങ്ങളെയും ഉൾക്കൊള്ളുന്ന വിശാലമായ മൂലാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ നേരിട്ട് നൽകുന്നു.
- issue: עבד എന്ന പദത്തിന്റെ ബന്ധിത സേവകപശ്ചാത്തലം വാക്യത്തിൽ തുറന്നുപറയണമോ
  choice: അവൻ ... സേവനം ചെയ്തിട്ടുണ്ട്
  alternative: അടിമയായ അവൻ നിന്നെ സേവിച്ചിട്ടുണ്ട്
  rationale: ഈ പദരൂപം ഇവിടെ ക്രിയാർഥമുള്ളതാണ്; നിയമഭാഗത്തിന്റെ പശ്ചാത്തലം ബന്ധിതസ്ഥിതി വ്യക്തമാക്കുന്നതിനാൽ വാക്യത്തിൽ ‘അടിമ’ എന്നു കൂട്ടിച്ചേർത്ത് അർഥഭാരം വർധിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നിയമപരമായ ‘സ്വതന്ത്രനായി വിട്ടയയ്ക്കുക’ എന്ന ആശയം വ്യക്തമായി സൂക്ഷിക്കുകയും, ഇരട്ടി കൂലിയെക്കുറിച്ചുള്ള സങ്കുചിതമായ എബ്രായ താരതമ്യം അടിക്കുറിപ്പിലൂടെ തുറന്നുവയ്ക്കുകയും ചെയ്തു.
