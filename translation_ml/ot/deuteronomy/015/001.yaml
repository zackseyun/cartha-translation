  terminology: ‘കടവിമോചനം’ യോജിച്ച നിയമ-സാമ്പത്തിക പദമാണ്. അടിക്കുറിപ്പ് ‘ഒഴിവാക്കൽ’, ‘കടം ഇളച്ചുകൊടുക്കൽ’ എന്നീ ബദൽപ്രയോഗങ്ങളിലൂടെ ശְׁמִטָּהയുടെ പദാർഥവ്യാപ്തിയും ഈ സന്ദർഭത്തിലെ കടനിയമബന്ധവും പര്യാപ്തമായി സൂചിപ്പിക്കുന്നു.
