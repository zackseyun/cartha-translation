id: DEU.15.1
reference: Deuteronomy 15:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/קֵּ֥ץ שֶֽׁבַע שָׁנִ֖ים תַּעֲשֶׂ֥ה שְׁמִטָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/001.yaml
  text: At the end of every seven years you shall make a release[a].
translation:
  language: ml
  text: ഓരോ ഏഴു വർഷത്തിന്റെയും അവസാനം നീ ഒരു കടവിമോചനം[a] നടപ്പാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒഴിവാക്കൽ’ അല്ലെങ്കിൽ ‘കടം ഇളച്ചുകൊടുക്കൽ’; എബ്രായത്തിലെ שְׁמִטָּה ഏഴാംവർഷത്തെ കടനിയമപ്രകാരം നടപ്പാക്കുന്ന കടവിമോചനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: അവസാനം
  rationale: מִן + קֵץ എന്ന പ്രയോഗത്തിന്റെ കാലസൂചനയായ ‘അവസാനത്തിൽ’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൃത്യ നിമിഷമോ ചക്രത്തിന്റെ സമാപനഘട്ടമോ എന്ന് അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: שֶׁבַע שָׁנִים
  choice: ഓരോ ഏഴു വർഷത്തിന്റെയും
  rationale: അക്ഷരാർഥം ‘ഏഴു വർഷം’ എന്നാണെങ്കിലും നിയമസന്ദർഭത്തിലെ ആവർത്തിക്കുന്ന ഏഴുവർഷചക്രം ‘ഓരോ’ എന്നതിലൂടെ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: תַּעֲשֶׂה
  choice: നടപ്പാക്കണം
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയ ഇവിടെ നിയമപരമായ ഒരു ക്രമീകരണം പ്രാബല്യത്തിൽ വരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നടപ്പാക്കണം’ ആജ്ഞാത്മക നിയമബലം നിലനിർത്തുന്നു.
- source_word: שְׁמִטָּה
  choice: കടവിമോചനം
  rationale: പദത്തിന്റെ അടിസ്ഥാന ആശയം വിട്ടുകളയൽ/വിമോചനം എന്നതാണ്; തുടർന്നുള്ള വാക്യങ്ങൾ കടങ്ങളാണ് വിഷയമെന്ന് വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘വിമോചനം’ മാത്രം അവ്യക്തമാകുന്നതിനാൽ ‘കടവിമോചനം’ വായനാസൗകര്യത്തിനായി ഉപയോഗിച്ചു, എന്നാൽ അടിക്കുറിപ്പിൽ വിശാലമായ പദസാധ്യതകൾ സൂചിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നീ’യും നിർബന്ധം സൂചിപ്പിക്കുന്ന ‘നടപ്പാക്കണം’ എന്ന രൂപവും മൂലപാഠത്തിന്റെ നിയമപരമായ ആജ്ഞാബലം നിലനിർത്തുന്നു.
