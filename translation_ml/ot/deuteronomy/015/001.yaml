  source_fidelity: മൂലത്തിലെ מִקֵּץ (‘അവസാനത്തിൽ/അവസാനഘട്ടത്തിൽ’), שֶׁבַע שָׁנִים എന്ന ആവർത്തിത ഏഴുവർഷകാലഘട്ടം, നിയമപരമായ ആജ്ഞാബലമുള്ള תַּעֲשֶׂה എന്നിവ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു. ‘കടവിമോചനം’ ഈ നിയമസന്ദർഭത്തിൽ שְׁמִטָּהയുടെ ഉദ്ദേശ്യത്തെ ശരിയായി വ്യക്തമാക്കുന്നു.
