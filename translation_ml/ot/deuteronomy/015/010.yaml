source:
  edition: WLC
  text: נָת֤וֹן תִּתֵּן֙ ל֔/וֹ וְ/לֹא יֵרַ֥ע לְבָבְ/ךָ֖ בְּ/תִתְּ/ךָ֣ ל֑/וֹ כִּ֞י בִּ/גְלַ֣ל הַ/דָּבָ֣ר הַ/זֶּ֗ה יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָֽל מַעֲשֶׂ֔/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: ml
  text: നീ അവന് തീർച്ചയായും കൊടുക്കണം; അവന് കൊടുക്കുമ്പോൾ നിന്റെ ഹൃദയം വിഷമിക്കരുത്. എന്തെന്നാൽ, ഈ കാര്യത്തിന്റെ നിമിത്തം നിന്റെ ദൈവമായ യാഹ്‌വെ നിന്റെ എല്ലാ പ്രവൃത്തികളിലും നീ ഏറ്റെടുക്കുന്ന എല്ലാ കാര്യങ്ങളിലും നിന്നെ അനുഗ്രഹിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നിന്റെ കൈ അയയ്ക്കുന്ന എല്ലാറ്റിലും’; അതായത്, നീ ഏറ്റെടുത്തു ചെയ്യുന്ന എല്ലാ കാര്യങ്ങളിലും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: ഉദാരമായി കൊടുക്കണം
  rationale: ക്രിയയുടെ infinitive absolute + imperfect ഘടന കല്പനയ്ക്ക് ശക്തമായ ഊന്നൽ നൽകുന്നു. മലയാളത്തിൽ ‘കൊടുക്കുകതന്നെ വേണം’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി സന്ദർഭത്തിലെ തുറന്ന മനസ്സോടെയുള്ള ദാനത്തെ ‘ഉദാരമായി കൊടുക്കണം’ പ്രകടിപ്പിക്കുന്നു.
- source_word: לּוֹ
  choice: അവന്
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ഏകവചന പ്രത്യയം മുൻസന്ദർഭത്തിലെ ദരിദ്രനായ സഹോദരനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: നിന്റെ ഹൃദയത്തിൽ നീരസം തോന്നരുത്
  rationale: רעע എന്ന ക്രിയ ഇവിടെ കൊടുക്കുന്നതിനെക്കുറിച്ചുള്ള ഉള്ളിലെ അനിഷ്ടം, വേദന, മടുപ്പ് എന്നിവ സൂചിപ്പിക്കുന്നു. ‘നീരസം തോന്നരുത്’ ഈ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ദുഃഖം എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: בְּתִתְּךָ לוֹ
  choice: അവന് കൊടുക്കുമ്പോൾ
  rationale: ב + infinitive construct ഇവിടെ കാലിക/സാഹചര്യാർഥമുള്ളതിനാൽ ‘കൊടുക്കുമ്പോൾ’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: എന്തെന്നാൽ, ഇക്കാരണത്താൽ
  rationale: בגלל കാരണബന്ധം സൂചിപ്പിക്കുന്നു; הדבר הזה മുൻപറഞ്ഞ കൊടുക്കൽ എന്ന പ്രവൃത്തിയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. മലയാളത്തിൽ ‘ഇക്കാരണത്താൽ’ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ YHWH ഒരു പദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: നിന്റെ എല്ലാ പ്രവൃത്തികളിലും
  rationale: מַעֲשֶׂה ഒരാൾ ചെയ്യുന്ന പ്രവൃത്തികളെയോ ജോലിയെയോ വിശാലമായി സൂചിപ്പിക്കുന്നു.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: നീ കൈവെക്കുന്ന എല്ലാറ്റിലും
  rationale: ‘കൈ അയയ്ക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം ഒരാൾ ഏറ്റെടുത്തു ചെയ്യുന്ന എല്ലാ സംരംഭങ്ങളുമാണ്. മലയാളത്തിലെ ‘കൈവെക്കുക’ കൈയുടെ ദൃശ്യരൂപവും പ്രയോഗാർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന പദവിയാൽ പകരാതെ ലിപ്യന്തരിച്ചു. മലയാള വായനക്കാർക്ക് കൂടുതൽ പരിചിതമായ രൂപം ‘യഹോവ’ ആണെങ്കിലും ഉച്ചാരണപുനർനിർമാണത്തെ ആശ്രയിച്ച ‘യാഹ്‌വെ’യും സാധുവായ മറ്റൊരു രൂപമാണ്.
- issue: സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ ഏകവചന സർവനാമം
  choice: അവന്
  alternative: അവർക്ക്
  rationale: മൂലത്തിലെ പ്രത്യയം പുരുഷലിംഗ ഏകവചനമാണ്; മുൻസന്ദർഭത്തിലെ ആവശ്യക്കാരനായ സഹോദരനെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ബഹുവചനമോ ലിംഗനിരപേക്ഷ പുനർവാചകമോ ഉപയോഗിച്ചില്ല.
- issue: അനുഗ്രഹവും മനുഷ്യന്റെ കൊടുക്കലും തമ്മിലുള്ള കാരണബന്ധം
  choice: ഇക്കാരണത്താൽ ... അനുഗ്രഹിക്കും
  alternative: അതുകൊണ്ട് ... അനുഗ്രഹിക്കും
  rationale: בגלל എന്ന പദത്തിന്റെ പ്രകടമായ കാരണബന്ധം നിലനിർത്തി; അതിനെ പ്രതിഫലത്തിന് അർഹത നേടുന്നുവെന്നോ യാന്ത്രിക ഇടപാടെന്നോ കൂടുതൽ വ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. രണ്ടാംപുരുഷ ഏകവചനം മൂലപാഠത്തോട് ഒത്തുനിൽക്കുന്നു. ‘നീരസം’ ഉള്ളിലെ മടുപ്പും മനസ്സില്ലായ്മയും ഉൾക്കൊള്ളുന്നു. പ്രധാന പാഠത്തിൽ [a] അടയാളം അതിന്റെ വിശദീകരണവുമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു.
