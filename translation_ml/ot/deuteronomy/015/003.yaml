  to: അന്യദേശക്കാരനിൽനിന്ന് നീ കടം പിരിച്ചെടുക്കാം[a]; എന്നാൽ നിന്റെ സഹോദരന്റെ പക്കലുള്ള നിനക്കവകാശപ്പെട്ടതെന്തും നീ വിട്ടുകൊടുക്കണം[c].
