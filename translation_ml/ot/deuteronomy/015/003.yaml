id: DEU.15.3
reference: Deuteronomy 15:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶת הַ/נָּכְרִ֖י תִּגֹּ֑שׂ וַ/אֲשֶׁ֨ר יִהְיֶ֥ה לְ/ךָ֛ אֶת אָחִ֖י/ךָ תַּשְׁמֵ֥ט יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/003.yaml
  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
translation:
  language: ml
  text: അന്യദേശക്കാരനിൽനിന്ന് നീ കടം പിരിച്ചെടുക്കാം[a]; എന്നാൽ നിന്റെ സഹോദരന്റെ പക്കലുള്ള നിനക്കവകാശപ്പെട്ടതെന്തും നീ വിട്ടുകൊടുക്കണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അന്യദേശക്കാരനിൽനിന്ന് നീ തിരിച്ചടവ് നിർബന്ധിച്ചു വാങ്ങാം’ എന്നും പരിഭാഷപ്പെടുത്താം. കടത്തിന്റെ സന്ദർഭത്തിൽ എബ്രായ ക്രിയയ്ക്ക് തിരിച്ചടയ്ക്കാൻ സമ്മർദം ചെലുത്തുക അഥവാ തുക ഈടാക്കുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കൈ വിട്ടുകളയണം.’ വിടുതൽവർഷത്തിൽ കടത്തിന്മേലുള്ള അവകാശവാദം ഉപേക്ഷിക്കുക അഥവാ കടം ഇളച്ചുകൊടുക്കുക എന്നതാണ് ഈ പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: അന്യദേശക്കാരൻ
  rationale: ഈ നിയമസന്ദർഭത്തിൽ നָכְרִי ഇസ്രായേലിന്റെ ഉടമ്പടിസമൂഹത്തിനു പുറത്തുള്ള വിദേശിയെ സൂചിപ്പിക്കുന്നു. ‘അന്യദേശക്കാരൻ’ സാമൂഹികവും നിയമപരവുമായ വ്യത്യാസം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: תִּגֹּשׂ
  choice: കടം പിരിച്ചെടുക്കാം
  rationale: נגשׂ എന്ന ക്രിയയ്ക്ക് കടം തിരിച്ചുപിടിക്കാൻ സമ്മർദം ചെലുത്തുക അഥവാ തുക ഈടാക്കുക എന്ന അർഥമാണുള്ളത്. സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘കടം’ ചേർത്തത് മലയാളത്തിൽ പ്രവർത്തിയുടെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ
  choice: നിനക്കുള്ളതെന്തും
  rationale: കടക്കാരനോടു ബന്ധപ്പെട്ട് കടം കൊടുത്തവന് അവകാശപ്പെട്ടതെല്ലാം ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ തുറന്ന സ്വഭാവം ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരൻ
  rationale: അക്ഷരാർഥമായ കുടുംബബന്ധപദം നിലനിർത്തുന്നു; ഈ നിയമത്തിൽ അത് സഹ-ഇസ്രായേല്യനെ സൂചിപ്പിക്കുന്നുവെന്ന സാമൂഹിക പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: നീ കൈവിട്ടുകളയണം
  rationale: ‘നിന്റെ കൈ വിട്ടുകളയണം’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള ശൈലിയിൽ നിലനിർത്തുകയും കടത്തിന്മേലുള്ള അവകാശവാദം ഉപേക്ഷിക്കുന്ന ആശയം അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആവർത്തനപുസ്തകത്തിലെ നിയമത്തിൽ ‘നിന്റെ സഹോദരൻ’ എന്നതിന്റെ പരിധി
  choice: മുഖ്യപാഠത്തിൽ ‘നിന്റെ സഹോദരൻ’ എന്ന ഉടമ്പടിബന്ധസൂചകമായ അക്ഷരാർഥപദം നിലനിർത്തി.
  alternative: നിന്റെ സഹ-ഇസ്രായേല്യൻ
  rationale: വാക്യം അന്യദേശക്കാരനെയും ഇസ്രായേൽസമൂഹത്തിലെ ‘സഹോദരനെയും’ വേർതിരിക്കുന്നു. അക്ഷരാർഥപദം മൂലപാഠത്തിലെ കുടുംബരൂപകം സംരക്ഷിക്കുന്നു; അതിന്റെ നിയമപരവും സാമൂഹികവുമായ പരിധി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘അന്യദേശക്കാരൻ’–‘സഹോദരൻ’ എന്ന മൂലപാഠത്തിലെ വൈരുധ്യവും ‘കൈവിട്ടുകളയുക’ എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തി; ആവശ്യമായ വിശദീകരണം അടിക്കുറിപ്പുകളിലേക്കു മാറ്റി.
