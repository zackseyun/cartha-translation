  yaml_path: translation/ot/deuteronomy/015/016.yaml
  text: And if he says to you[a], ‘I will not go out from you,’ because he loves you and your household, because it is good for him with you[b],
translation:
  language: ml
  text: അവൻ നിന്നോട്, ‘ഞാൻ നിന്നെ വിട്ടുപോകില്ല’[a] എന്നു പറഞ്ഞാൽ—അവൻ നിന്നെയും നിന്റെ വീട്ടുകാരെയും[b] സ്നേഹിക്കുന്നതിനാലും നിന്റെ കൂടെ കഴിയുന്നത് അവനു നല്ലതായതിനാലും—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ അടുക്കൽനിന്ന് ഞാൻ പുറത്തുപോകില്ല.’ ഈ സന്ദർഭത്തിൽ ‘ഞാൻ നിന്നെ വിട്ടുപോകില്ല’ എന്നോ ‘ഞാൻ സ്വതന്ത്രനായി പോകില്ല’ എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: '‘വീട്ടുകാർ’ എന്നത് എബ്രായത്തിലെ ‘വീട്’ എന്ന പദത്തിന്റെ ഇവിടെ ഉദ്ദേശിക്കുന്ന അർഥമാണ്: കെട്ടിടം മാത്രമല്ല, യജമാനന്റെ ഗൃഹസമൂഹവും ഗാർഹികവലയവും.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: എന്നാൽ ... പറഞ്ഞാൽ
  rationale: നിയമപരമായ ഒരു സാധ്യതാസന്ദർഭം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിലെ സോപാധിക ഘടനയായി അവതരിപ്പിക്കുന്നു.
- source_word: יֹאמַר אֵלֶיךָ
  choice: അവൻ നിന്നോട് ... എന്നു പറഞ്ഞാൽ
  rationale: നിയമവാക്യത്തിലെ സാധ്യതാസന്ദർഭവും നേരിട്ടുള്ള അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: ഞാൻ നിന്നെ വിട്ടുപോകില്ല
  rationale: അക്ഷരാർഥം ‘നിന്റെ അടുക്കൽനിന്ന്/നിന്നോടൊപ്പമുള്ള നിലയിൽനിന്ന് ഞാൻ പുറത്തുപോകില്ല’ എന്നാണ്; മലയാളത്തിൽ ബന്ധപരമായ വേർപാടിനെ സ്വാഭാവികമായി അറിയിക്കാൻ ‘വിട്ടുപോകില്ല’ ഉപയോഗിച്ചു.
- source_word: כִּי אֲהֵבְךָ
  choice: അവൻ നിന്നെ ... സ്നേഹിക്കുന്നതിനാൽ
  rationale: כִּיയുടെ കാരണാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְאֶת בֵּיתֶךָ
  choice: നിന്റെ വീട്ടുകാരെയും
  rationale: בַּיִת ഇവിടെ കെട്ടിടത്തെക്കാൾ യജമാനന്റെ ഗൃഹസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വീട്ടുകാർ’ ആ സാമൂഹിക അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: നിന്റെ കൂടെ കഴിയുന്നത് അവനു നല്ലതായതിനാൽ
  rationale: ‘നിന്നോടൊപ്പം അവനു നല്ലതാണ്’ എന്ന എബ്രായ ഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും അവന്റെ അനുകൂല ജീവിതസ്ഥിതി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിയമവാക്യശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമം ഉപയോഗിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
