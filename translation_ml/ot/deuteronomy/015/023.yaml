id: DEU.15.23
reference: Deuteronomy 15:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֥ק אֶת דָּמ֖/וֹ לֹ֣א תֹאכֵ֑ל עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/023.yaml
  text: Only[a], you shall not eat its blood; you shall pour it out on the ground like water.
translation:
  language: ml
  text: എന്നാൽ അതിന്റെ രക്തം തിന്നരുത്; അത് വെള്ളംപോലെ നിലത്ത് ഒഴിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ അനുമതിക്കുള്ള നിയന്ത്രണമോ ഒഴിവോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എന്നാൽ’ ഈ വിരുദ്ധ-നിയന്ത്രണ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת דָּמוֹ
  choice: അതിന്റെ രക്തം
  rationale: നേരിട്ടുള്ള കർമസൂചകത്തോടുകൂടിയ ‘അതിന്റെ രക്തം’ എന്ന പ്രയോഗം മൃഗത്തിന്റെ രക്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ജീവരക്തം’ എന്ന വ്യാഖ്യാനാത്മക ശക്തീകരണം ഒഴിവാക്കുന്നു.
- source_word: לֹא תֹאכֵל
  choice: തിന്നരുത്
  rationale: നിയമപരമായ നിരോധനം ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ കല്പനാരൂപത്തിൽ നൽകുന്നു.
- source_word: עַל הָאָרֶץ
  choice: നിലത്ത്
  rationale: ഈ മൂർത്തമായ ആചാരസന്ദർഭത്തിൽ രക്തം മണ്ണിലേക്കോ നിലത്തേക്കോ ഒഴിക്കുന്നതാണു ഉദ്ദേശ്യം; ‘ഭൂമിയിൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികം.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: അത് ഒഴിച്ചുകളയണം
  rationale: ക്രിയയുടെ ‘ഒഴിക്കുക/ചൊരിയുക’ എന്ന അർഥവും രക്തം ഉപേക്ഷിക്കുന്ന സന്ദർഭവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כַּמָּיִם
  choice: വെള്ളംപോലെ
  rationale: ഹീബ്രു ഉപമ കൃത്യമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭക്ഷണനിയമത്തിൽ രക്തത്തോടുള്ള സമീപനം
  choice: മൃഗത്തിന്റെ രക്തം ഭക്ഷിക്കരുതെന്നും അത് നിലത്ത് ഒഴിക്കണമെന്നും ഉള്ള നിയമകല്പന നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: രക്തവും ജീവനും തമ്മിലുള്ള ബന്ധം മുൻനിർത്താൻ ‘ജീവരക്തം’ എന്നു വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: വിശാലമായ പഞ്ചഗ്രന്ഥസന്ദർഭം രക്തത്തെ ജീവനോടു ബന്ധിപ്പിക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യം ആ കാരണം തുറന്നുപറയുന്നില്ല; അതിനാൽ വാക്യത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്ര വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ‘തിന്നരുത്’ എന്ന രൂപം കല്പനയുടെ ശക്തി നിലനിർത്തുന്നു; ‘ഒഴിച്ചുകളയണം’ ആചാരപരമായ നിർദേശത്തെ വ്യക്തമായി അറിയിക്കുന്നു.
