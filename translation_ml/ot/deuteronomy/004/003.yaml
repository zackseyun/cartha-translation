reference: Deuteronomy 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֵ֛ת אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה בְּ/בַ֣עַל פְּע֑וֹר כִּ֣י כָל הָ/אִ֗ישׁ אֲשֶׁ֤ר הָלַךְ֙ אַחֲרֵ֣י בַֽעַל פְּע֔וֹר הִשְׁמִיד֛/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/קִּרְבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
translation:
  language: ml
  text: ബാൽ-പെയോറിൽ യഹോവ ചെയ്തതു നിങ്ങളുടെ കണ്ണുകൾതന്നെ കണ്ടിരിക്കുന്നു; കാരണം, ബാൽ-പെയോറിനെ അനുഗമിച്ച[a] ഓരോ പുരുഷനെയും നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങളുടെ ഇടയിൽനിന്ന് നശിപ്പിച്ചുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ബാൽ-പെയോറിന്റെ പിന്നാലെ പോയ ഓരോ പുരുഷനെയും.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “ബാൽ-പെയോറിന്റെ പിന്നാലെ പോയ ഓരോ പുരുഷനും” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: നിങ്ങൾ സ്വന്തം കണ്ണുകൊണ്ട് കണ്ടതാണ്
  rationale: എബ്രായ പ്രയോഗത്തിലെ ദൃക്‌സാക്ഷിത്വത്തിനുള്ള ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָשָׂה
  choice: ചെയ്തത്
  rationale: ബാൽ-പെയോർ സംഭവത്തിൽ യഹോവ നടത്തിയ ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന പൊതുവായ ക്രിയ; 'ഉണ്ടാക്കി' എന്ന അർഥമല്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בְּבַעַל פְּעוֹר
  choice: ബാൽ-പെയോറിൽവെച്ച്
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ സംഭവസ്ഥല/സാഹചര്യാർഥം വ്യക്തമാക്കുകയും സ്ഥലപ്പേരും ദേവനാമവും തമ്മിലുള്ള ഉദ്ദേശ്യമായ അസ്പഷ്ടത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כָּל הָאִישׁ
  choice: ഓരോ പുരുഷനെയും
  rationale: വിതരണാർഥത്തിലുള്ള ഏകവചന പുല്ലിംഗരൂപം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: הָלַךְ אַחֲרֵי
  choice: അനുഗമിച്ച
  rationale: വിഗ്രഹത്തോടുള്ള ചായ്‌വും വിധേയത്വവും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥമായ 'പിന്നാലെ പോയ' എന്ന രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הִשְׁמִידוֹ
  choice: നശിപ്പിച്ചുകളഞ്ഞു
  rationale: ഹിഫീൽ രൂപത്തിലെ ശക്തമായ നാശാർഥവും ഏകവചന കർമവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: യഹോവ എന്ന ദൈവനാമത്തോട് ചേർന്ന ഉടമ്പടി-ബന്ധസൂചക വിശേഷണം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִקִּרְבֶּךָ
  choice: നിങ്ങളുടെ ഇടയിൽനിന്ന്
  rationale: സമൂഹത്തിന്റെ നടുവിൽനിന്നുള്ള നീക്കം എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ പദവിയായ 'കർത്താവ്' എന്ന് പകരാതെ ദൈവനാമം നിലനിർത്തുന്നു.
- issue: כָּל הָאִישׁ എന്ന വിതരണാർഥമുള്ള പുല്ലിംഗ ഏകവചനം
  choice: ഓരോ പുരുഷനെയും
  alternative: ഓരോരുത്തനെയും
  rationale: മൂലത്തിലെ വ്യാകരണപരമായ പുല്ലിംഗസൂചനയെ ലിംഗനിരപേക്ഷമാക്കാതെ കൃത്യമായി സംരക്ഷിക്കുന്നു.
- issue: בַּעַל פְּעוֹר എന്നതിന്റെ സൂചന
  choice: ബാൽ-പെയോർ
  alternative: പെയോറിലെ ബാൽ
  rationale: ഇത് സ്ഥലസംഭവത്തെയോ പെയോറുമായി ബന്ധപ്പെട്ട ദേവനെയോ ചൂണ്ടിക്കാണിക്കാവുന്നതിനാൽ സംയുക്തനാമം നിലനിർത്തി യഥാർഥ അസ്പഷ്ടത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൃക്‌സാക്ഷിത്വത്തിന്റെ ഊന്നലും ന്യായവിധിയുടെ ശക്തിയും സംരക്ഷിച്ചിട്ടുണ്ട്; ബാൽ-പെയോർ എന്ന സംജ്ഞയിലെ യഥാർഥ സൂചനാവ്യാപ്തി അതിരുകടന്ന് വിശദീകരിച്ചിട്ടില്ല.
