source:
  edition: WLC
  text: א֣וֹ הֲ/נִסָּ֣ה אֱלֹהִ֗ים לָ֠/בוֹא לָ/קַ֨חַת ל֣/וֹ גוֹי֮ מִ/קֶּ֣רֶב גּוֹי֒ בְּ/מַסֹּת֩ בְּ/אֹתֹ֨ת וּ/בְ/מוֹפְתִ֜ים וּ/בְ/מִלְחָמָ֗ה וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָאִ֖ים גְּדֹלִ֑ים כְּ֠/כֹל אֲשֶׁר עָשָׂ֨ה לָ/כֶ֜ם יְהוָ֧ה אֱלֹהֵי/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ഒരു ജനതയുടെ നടുവിൽനിന്ന് തനിക്കായി മറ്റൊരു ജനതയെ എടുത്തുകൊണ്ടുപോകാൻ ഏതെങ്കിലും ദേവൻ ഒരിക്കലെങ്കിലും ശ്രമിച്ചിട്ടുണ്ടോ—പരീക്ഷണങ്ങളാലും അടയാളങ്ങളാലും അത്ഭുതങ്ങളാലും യുദ്ധത്താലും ബലമുള്ള കൈയാലും നീട്ടിയ ഭുജത്താലും മഹാഭയങ്ങളാലും[a]—ഈജിപ്തിൽ നിങ്ങളുടെ കൺമുന്നിൽ നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങൾക്കുവേണ്ടി ചെയ്തതെല്ലാംപോലെ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മഹാഭയങ്ങൾ’ എന്നതിന് ‘ഭയഭക്തി ഉളവാക്കുന്ന മഹാപ്രവൃത്തികൾ’ അല്ലെങ്കിൽ ‘മഹാഭീകരകൃത്യങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ഭയവും വിസ്മയവും ഉളവാക്കുന്ന പ്രവൃത്തികളെയോ സംഭവങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  choice: മുമ്പെപ്പോഴെങ്കിലും ശ്രമിച്ചിട്ടുണ്ടോ
  rationale: נסה എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ ‘ശ്രമിക്കുക/തുനിയുക’ എന്ന അർഥവും അലങ്കാരപ്രശ്നത്തിന്റെ ‘എപ്പോഴെങ്കിലും’ എന്ന ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പരീക്ഷിച്ചു’ എന്ന പരിഭാഷ തെറ്റായ അർഥത്തിലേക്ക് നയിക്കാം.
- source_word: אֱלֹהִים
  choice: ഏതെങ്കിലും ദേവൻ
  rationale: യഹ്‌വെയുടെ അതുല്യപ്രവൃത്തികളോടു മറ്റേതെങ്കിലും ദേവന്റെ പ്രവൃത്തിയെ താരതമ്യം ചെയ്യുന്ന അലങ്കാരപ്രശ്നമായതിനാൽ അനിശ്ചിതമായ പൊതുസൂചന നിലനിർത്തുന്നു.
- source_word: לָבוֹא לָקַחַת
  choice: ചെന്നെടുക്കാൻ
  rationale: ഉദ്ദേശ്യപൂർവമായ നീക്കവും തുടർന്ന് സ്വന്തമാക്കുന്ന/വിടുവിച്ചെടുക്കുന്ന പ്രവൃത്തിയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: ഒരു ജനതയുടെ നടുവിൽനിന്ന് തനിക്കായി മറ്റൊരു ജനതയെ
  rationale: ഒരു രാഷ്ട്രീയജനതയ്ക്കുള്ളിൽനിന്ന് മറ്റൊരു ജനതയെ വേർതിരിച്ചെടുക്കുന്ന എബ്രായ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: בְּמַסֹּת
  choice: പരീക്ഷണങ്ങളാൽ
  rationale: ഈജിപ്തിലെ ശോധനാത്മകമായ സംഭവങ്ങളെയും ന്യായവിധികളെയും ഉൾക്കൊള്ളുന്ന വിശാലമായ പദം; ആധുനിക മലയാളത്തിൽ ‘പ്രലോഭനങ്ങൾ’ എന്നു തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
- source_word: בְּאֹתֹת וּבְמוֹפְתִים
  choice: അടയാളങ്ങളാലും അത്ഭുതങ്ങളാലും
  rationale: എബ്രായത്തിലെ പതിവ് യുഗ്മത്തിന്റെ വ്യത്യസ്തമായ രണ്ട് ഘടകങ്ങളും നിലനിർത്തുന്നു.
- source_word: וּבְמִלְחָמָה
  choice: യുദ്ധത്താലും
  rationale: പുറപ്പാടിലെ വിടുതലിന്റെ പോരാട്ടപരമായ മാനം മറച്ചുവയ്ക്കാതെ ഏകവചനരൂപം പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וּבְיָד חֲזָקָה
  choice: ബലമുള്ള കൈയാലും
  rationale: ദൈവികശക്തിയെ സൂചിപ്പിക്കുന്ന പുറപ്പാട്-പ്രയോഗത്തിന്റെ ശരീരരൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: നീട്ടിയ ഭുജത്താലും
  rationale: സ്ഥിരമായ പുറപ്പാട്-രൂപകത്തെ വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: ഭയം ജനിപ്പിക്കുന്ന മഹാപ്രവൃത്തികളാലും
  rationale: ഭയവും വിസ്മയവും ഉളവാക്കുന്ന പ്രവൃത്തികൾ എന്ന എബ്രായപ്രയോഗത്തിന്റെ സജീവ അർഥം നൽകുന്നു; വെറും അനുഭവമായ ‘ഭീതികൾ’ എന്നതിൽ ഒതുക്കുന്നില്ല.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: ചെയ്തതെല്ലാംപോലെ
  rationale: മുൻ അലങ്കാരപ്രശ്നത്തെ ഇസ്രായേലിന്റെ ചരിത്രാനുഭവവുമായി ബന്ധിപ്പിക്കുകയും כֹל എന്ന സമഗ്രത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അലങ്കാരപരമായ താരതമ്യത്തിലെ אֱלֹהִים
  choice: ഏതെങ്കിലും ദേവൻ
  alternative: ദൈവം
  rationale: ആദ്യ ഉപവാക്യം സത്യദൈവത്തെ തന്നെയാണു സൂചിപ്പിക്കുന്നതെന്ന ധാരണ ഒഴിവാക്കി, യഹ്‌വെയുടെ രക്ഷാപ്രവൃത്തിയുടെ അതുല്യതയെ മറ്റെല്ലാ ദേവന്മാരോടും താരതമ്യം ചെയ്യുന്ന വാക്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: എബ്രായ വ്യക്തിനാമമായ YHWH-നെ ബിരുദമാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന രൂപത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: അവസാന താരതമ്യത്തിന്റെ മലയാള വാക്യഘടന
  choice: ആരെങ്കിലും ചെയ്തിട്ടുണ്ടോ? എന്ന ചോദ്യം സന്ദർഭാനുസൃതമായി ആവർത്തിച്ചു
  alternative: മുൻ ചോദ്യത്തോട് ചേർന്ന ഒറ്റ ദീർഘവാക്യം
  rationale: എബ്രായത്തിൽ മുൻ ചോദ്യത്തെ ആശ്രയിക്കുന്ന താരതമ്യവാക്യത്തിന്റെ അർഥം മാറ്റാതെ, സാധാരണ വായനക്കാർക്ക് വ്യക്തത ലഭിക്കാനായി മലയാളത്തിൽ ചോദ്യം പൂർത്തിയാക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ആവർത്തിച്ച instrumental בְ-നെ ‘-ആലും’ എന്ന സമാന്തരഘടനയിലൂടെ നിലനിർത്തി. ദീർഘമായ എബ്രായ അലങ്കാരപ്രശ്നം വായനാസൗകര്യത്തിനായി രണ്ട് ബന്ധപ്പെട്ട ചോദ്യങ്ങളാക്കി, അർഥബന്ധം സംരക്ഷിച്ചു.
