source:
  edition: WLC
  text: לְ/הוֹרִ֗ישׁ גּוֹיִ֛ם גְּדֹלִ֧ים וַ/עֲצֻמִ֛ים מִמְּ/ךָ֖ מִ/פָּנֶ֑י/ךָ לַ/הֲבִֽיאֲ/ךָ֗ לָֽ/תֶת לְ/ךָ֧ אֶת אַרְצָ֛/ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: ml
  text: നിന്നെക്കാൾ വലുതും ശക്തവുമായ ജനതകളെ നിന്റെ മുമ്പിൽനിന്ന് പുറത്താക്കാനും[a], നിന്നെ അകത്തു കൊണ്ടുവരാനും, അവരുടെ ദേശം നിനക്കു അവകാശമായി നൽകാനും—ഇന്നു കാണുന്നതുപോലെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൈവശക്കാരെ നീക്കി അവകാശം നൽകുക’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയിൽ മുൻവാസികളെ നീക്കുന്നതും അതിലൂടെ മറ്റൊരാൾക്കു ദേശം ലഭ്യമാക്കുന്നതും ഉൾപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘ഈ ദിവസംപോലെ.’ ഇപ്പോൾ വ്യക്തമായി കാണുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: പുറത്താക്കി
  rationale: ഹിഫ്ഈൽ രൂപത്തിലുള്ള ക്രിയ മുൻവാസികളെ നീക്കി മറ്റൊരാൾക്ക് ദേശം ലഭ്യമാക്കുക എന്ന ആശയം വഹിക്കുന്നു. ഇവിടെ കർമം ‘ജനതകൾ’ ആയതിനാൽ ‘പുറത്താക്കി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: גּוֹיִם
  choice: ജനതകളെ
  rationale: ആവർത്തനപുസ്തകത്തിലെ ജന-രാഷ്ട്രീയ പശ്ചാത്തലത്തിൽ വ്യത്യസ്ത ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദമാണ്.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: നിന്നെക്കാൾ വലുതും ശക്തവുമായ
  rationale: מִמְּךָ സൂചിപ്പിക്കുന്ന താരതമ്യം വ്യക്തമായി നിലനിർത്തുകയും വലിപ്പവും ശക്തിയും ചേർന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: ഒരാളുടെ സന്നിധിയിൽനിന്നോ മുന്നിൽനിന്നോ നീക്കുക എന്ന എബ്രായ സ്ഥലസൂചക പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: לַהֲבִיאֲךָ
  choice: നിന്നെ അകത്തു കൊണ്ടുവന്ന്
  rationale: സന്ദർഭത്തിൽ ഇസ്രായേലിനെ ദേശത്തിനകത്തേക്ക് കൊണ്ടുവരുന്നതാണ് ഉദ്ദേശ്യം; ലക്ഷ്യസ്ഥാനം അടുത്ത ഉപവാക്യത്തിൽ വ്യക്തമാകുന്നതിനാൽ ‘അകത്തു’ എന്നത് ആവശ്യമായ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: അവരുടെ ദേശം നിനക്ക് ... നൽകാൻ
  rationale: ദൈവിക ദാനത്തിന് ഊന്നൽ നൽകുന്ന മൂലവാക്യത്തിന്റെ നേരിട്ടുള്ള ഘടന നിലനിർത്തുന്നു.
- source_word: נַחֲלָה
  choice: അവകാശമായി
  rationale: പാരമ്പര്യമായി ലഭിക്കുന്ന സ്ഥിരസ്വത്തും ഉടമസ്ഥതയും സൂചിപ്പിക്കുന്ന പദം; നിയമപുസ്തകത്തിലെ ഉടമ്പടി-ദേശ ആശയം അനാവശ്യമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: כַּיּוֹם הַזֶּה
  choice: ഇന്നുള്ളതുപോലെ
  rationale: ഇപ്പോൾ ദൃശ്യമായിരിക്കുന്ന അവസ്ഥയെ ചൂണ്ടിക്കാണിക്കുന്ന ആവർത്തനപുസ്തകത്തിലെ പ്രയോഗം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: נַחֲלָה എന്ന പദത്തിലെ ഉടമ്പടി-ദേശ ആശയം
  choice: അവകാശമായി
  alternative: കൈവശമായി
  rationale: ‘അവകാശമായി’ എന്നത് ദേശം ദൈവം നൽകുന്ന പാരമ്പര്യസ്വത്താണെന്ന ആശയം നിലനിർത്തുന്നു; ‘കൈവശമായി’ എന്നത് ആ അർത്ഥത്തെ വെറും ഉടമസ്ഥതയിലേക്ക് ചുരുക്കാൻ ഇടയുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. മുൻവാക്യവുമായി വ്യാകരണപരമായി ബന്ധപ്പെടുന്ന മൂലഭാഷയിലെ ഉദ്ദേശ്യവാക്യഘടന നിലനിർത്തിയിരിക്കുന്നു; അതിനാൽ വാക്യം ‘നൽകാൻ’ എന്ന രൂപത്തിൽ അവസാനിച്ച് തുടർന്ന് നിലവിലെ ഫലത്തെ സൂചിപ്പിക്കുന്നു.
