  terminology: ‘രൂപം’ appropriately preserves the breadth of תְּמוּנָה, with viable alternatives retained in the note. ‘യഹ്‌വേ’ is used to represent Yahweh rather than the conventionally distinct form ‘യഹോവ.’ The nephesh note identifies the expression as idiomatic without making an anthropological claim.
  issues:
