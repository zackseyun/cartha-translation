source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹׁתֵי/כֶ֑ם כִּ֣י לֹ֤א רְאִיתֶם֙ כָּל תְּמוּנָ֔ה בְּ/י֗וֹם דִּבֶּ֨ר יְהוָ֧ה אֲלֵי/כֶ֛ם בְּ/חֹרֵ֖ב מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: ml
  text: അതിനാൽ, നിങ്ങളെത്തന്നെ അതീവ ജാഗ്രതയോടെ കാത്തുകൊള്ളണം[b]. കാരണം, യഹ്‌വേ ഹോരേബിൽ തീയുടെ നടുവിൽനിന്ന് നിങ്ങളോടു സംസാരിച്ച ദിവസം നിങ്ങൾ ഒരു രൂപവും കണ്ടില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു സാദൃശ്യവും കണ്ടില്ല’ അല്ലെങ്കിൽ ‘ഒരു പ്രതിരൂപവും കണ്ടില്ല.’
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നിങ്ങളുടെ ജീവനുവേണ്ടി നിങ്ങളെത്തന്നെ അതിയായി കാത്തുകൊള്ളുക’; അതീവ ജാഗ്രത പാലിക്കണമെന്നർഥമുള്ള ഒരു ഭാഷാശൈലി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: അതിനാൽ നിങ്ങൾ നിങ്ങളെത്തന്നെ അതീവ ജാഗ്രതയോടെ സൂക്ഷിക്കണം
  rationale: മുഴുവൻ പ്രയോഗവും സ്വയം കാത്തുസൂക്ഷിക്കാനുള്ള ശക്തമായ മുന്നറിയിപ്പാണ്. נֶפֶשׁ ഇവിടെ ശരീരത്തിൽനിന്നു വേറിട്ട ‘ആത്മാവ്’ എന്ന സാങ്കേതിക അർഥത്തിലല്ല, പ്രത്യാവർത്തകമായ ഹീബ്രു ശൈലിയുടെ ഭാഗമായാണ് വരുന്നത്. ‘അതീവ ജാഗ്രതയോടെ’ എന്നത് מְאֹד നൽകുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുന്നറിയിപ്പിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: നിങ്ങൾ ഒരു രൂപവും കണ്ടില്ല
  rationale: תְּמוּנָה ദൃശ്യമായ രൂപം, സാദൃശ്യം, പ്രതിരൂപം എന്നീ അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്നു. തുടർന്നുവരുന്ന വിഗ്രഹനിരോധനത്തിലേക്ക് പദത്തെ നേരത്തേ ചുരുക്കാതെ ‘രൂപം’ അതിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: בְּיוֹם
  choice: സംസാരിച്ച ദിവസം
  rationale: ഹീബ്രുവിലെ ‘ദിവസത്തിൽ’ എന്ന കാലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: യഹോവ നിങ്ങളോടു സംസാരിച്ച
  rationale: אֶל സൂചിപ്പിക്കുന്ന അഭിമുഖസംസാരം ‘നിങ്ങളോടു’ എന്നു നൽകുന്നു; ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּחֹרֵב
  choice: ഹോരേബിൽ
  rationale: സംഭവത്തിന്റെ സ്ഥലം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: തീയുടെ നടുവിൽനിന്ന്
  rationale: മִתּוֹךְ എന്നതിലെ ‘മധ്യത്തിൽനിന്ന്’ എന്ന ദൃശ്യസവിശേഷത പൂർണമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: לְנַפְשֹׁתֵיכֶם എന്നതിലെ נֶפֶשׁ-ന്റെ മനുഷ്യസ്വഭാവശാസ്ത്രപരമായ സൂക്ഷ്മത
  choice: ‘നിങ്ങളെത്തന്നെ ... സൂക്ഷിക്കണം’ എന്ന പ്രത്യാവർത്തക ശൈലി
  alternative: ‘നിങ്ങളുടെ ആത്മാക്കളെ സൂക്ഷിക്കണം’
  rationale: ഇവിടെ പ്രയോഗം അതീവ ശ്രദ്ധയോടെ സ്വയം കാത്തുകൊള്ളാനുള്ള ഹീബ്രു ഭാഷാശൈലിയാണ്; ശരീരവും ആത്മാവും വേർതിരിക്കുന്ന സിദ്ധാന്തപരമായ പ്രസ്താവന വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ പ്രത്യാവർത്തകമായി പരിഭാഷപ്പെടുത്തി.
- issue: ഹോരേബിലെ ദൈവപ്രത്യക്ഷതയുടെ പശ്ചാത്തലത്തിൽ תְּמוּנָה എന്നതിന്റെ അർഥം
  choice: രൂപം
  alternative: സാദൃശ്യം; പ്രതിരൂപം; വിഗ്രഹം
  rationale: ജനങ്ങൾ ദൈവത്തിന്റെ ദൃശ്യരൂപമൊന്നും കണ്ടില്ല എന്ന ആശയം വ്യക്തമാക്കുമ്പോഴും, ഈ വാക്യത്തിൽതന്നെ പദത്തെ നിർമിത വിഗ്രഹം എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല. മൂലപദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്താൻ ‘അതീവ ജാഗ്രതയോടെ’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
