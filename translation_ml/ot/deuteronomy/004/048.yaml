  terminology: The transliterated place names, «അർന്നോൻ», «അരോവേർ», «സീയോൻ», and «ഹെർമ്മോൻ», are suitable. «സീയോൻ» should remain distinct in this verse from assumptions based on the more familiar Zion name.
