translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭൂമിശാസ്ത്രപരമായ ഭാഷ ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ മൂലപാഠത്തെപ്പോലെ അപൂർണ്ണ ഖണ്ഡരൂപവും അവസാനത്തിലെ വിരാമചിഹ്നവും നിലനിർത്തി; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
