  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
translation:
  language: ml
  text: അർന്നോൻ താഴ്‌വരയുടെ കരയിൽ സ്ഥിതിചെയ്യുന്ന അരോവേർ[a] മുതൽ സീയോൻ പർവതംവരെ—അതായത്, ഹെർമ്മോൻ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ נַחַל എന്ന പദം ‘അർന്നോൻ വാദി’ എന്നും ‘അർന്നോന്റെ താഴ്‌വര’ എന്നും പരിഭാഷപ്പെടുത്താം. അത് നിർബന്ധമായും വർഷം മുഴുവൻ ഒഴുകുന്ന ഒരു നദിയെ സൂചിപ്പിക്കുന്നില്ല; നീരൊഴുക്കിന്റെ പാതയെയോ മലയിടുക്കിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ ‘സീയോൻ’ എന്നാണ്. ആവർത്തനം 3:9 താരതമ്യം ചെയ്യുക; അവിടെ സീദോന്യർ ഈ പർവതത്തെ ‘സിര്യോൻ’ എന്നു വിളിച്ചതായി പറയുന്നു. ഇവിടെ സീയോൻ ഹെർമ്മോൻ തന്നെയാണെന്ന് പാഠം നേരിട്ട് വ്യക്തമാക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  choice: അരോവേർ മുതൽ
  rationale: מִן പ്രദേശപരിധിയുടെ ആരംഭസ്ഥാനം സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲשֶׁר עַל שְׂפַת
  choice: കരയിലുള്ള
  rationale: ബന്ധവാക്യവും שָׂפָה എന്നതിന്റെ ഭൂമിശാസ്ത്രപരമായ ‘കര/അരിക്’ അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: נַחַל אַרְנֹן
  choice: അർന്നോൻ താഴ്‌വര
  rationale: נַחַל എന്നത് എല്ലായ്പോഴും വറ്റാത്ത നദിയല്ല; നീരൊഴുക്കുള്ള മലയിടുക്ക് അഥവാ വാദി/താഴ്‌വരയും സൂചിപ്പിക്കാം. അതിനാൽ അർഥവ്യാപ്തി ചുരുക്കാതെ ‘താഴ്‌വര’ സ്വീകരിച്ചു.
- source_word: וְ/עַד
  choice: വരെ
  rationale: പ്രദേശപരിധിയുടെ അവസാനസ്ഥാനം കൃത്യവും സ്വാഭാവികവുമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: הַר שִׂיאֹן
  choice: സീയോൻ പർവതം
  rationale: הַר എന്നതിന് ‘പർവതം’; שִׂיאֹן ഈ വാക്യത്തിലെ പ്രത്യേക സ്ഥലനാമമായതിനാൽ ‘സീയോൻ’ എന്നു ലിപ്യന്തരണം ചെയ്തു, പരിചിതമായ צִיּוֹן (‘സീയോൻ/സീയോൻ’) എന്ന പേരുമായി നിശ്ശബ്ദമായി ഏകീകരിച്ചില്ല.
- source_word: הוּא חֶרְמוֹן
  choice: അതായത് ഹെർമ്മോൻ
  rationale: הוּא ഇവിടെ മുൻപറഞ്ഞ പർവതത്തെ ഹെർമ്മോനായി തിരിച്ചറിയുന്ന വിശദീകരണാത്മക പ്രയോഗമാണ്.
