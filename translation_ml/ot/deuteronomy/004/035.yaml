  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: ml
  text: 'നീ അറിയേണ്ടതിന് ഇതു നിനക്കു കാണിച്ചുതന്നു: യഹ്‌വേ[a] തന്നെയാണ് ദൈവം[b]; അവിടുന്നല്ലാതെ മറ്റാരുമില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു മൂലത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ יהוה (YHWH) ആണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘യഹ്‌വേ—അവിടുന്നാണ് ദൈവം’; സ്വതന്ത്ര സർവനാമം ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: നിങ്ങൾക്കു കാണിച്ചുതന്നു
  rationale: 'ראה എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപം കാരണക-കർമണി അർഥം നൽകുന്നു: അഭിസംബോധിതൻ സ്വയം കണ്ടു എന്നതിലുപരി, അവനു കാണിച്ചുകൊടുത്തു. മലയാളത്തിൽ സജീവമായ അവ്യക്തകർത്തൃപ്രയോഗം ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.'
- source_word: לָדַעַת
  choice: നിങ്ങൾ അറിയേണ്ടതിന്
  rationale: ל ചേർന്ന infinitive construct ഇവിടെ ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്നു. ‘അറിയേണ്ടതിന്’ ആ ലക്ഷ്യബലം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: — (ദ്വിബിന്ദുവിലൂടെ ഉള്ളടക്കബന്ധം)
  rationale: ഇവിടെ כִּי അറിയേണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു, കാരണമല്ല. മലയാളത്തിൽ ദ്വിബിന്ദുവിനു ശേഷമുള്ള പ്രസ്താവന ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: הוּא
  choice: തന്നെയാണ്
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ ‘തന്നെയാണ്’ നിലനിർത്തുന്നു; അടുത്ത വാക്യഖണ്ഡത്തിലുള്ള ഏകത്വവാദത്തെ ഇതിലേക്കു മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: הָאֱלֹהִים
  choice: ദൈവം
  rationale: നിർദേശകവാക്യത്തിലെ predicate ആയി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രൂപം.
- source_word: אֵין עוֹד
  choice: മറ്റാരുമില്ല
  rationale: യഹ്‌വേയ്ക്കു പുറമെ മറ്റൊരു ദൈവവുമില്ലെന്ന നിഷേധത്തെ വ്യക്തമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: מִלְבַדּוֹ
  choice: അവിടുന്നല്ലാതെ
  rationale: ഒഴിവാക്കൽ/വ്യതിരിക്തത സൂചിപ്പിക്കുന്ന പ്രയോഗം. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ്; അതിനെ ഒരു സ്ഥാനപ്പേരായി പകരാതെ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നത് പാഠസാക്ഷ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- issue: הוּא നൽകുന്ന ഊന്നൽ
  choice: യഹ്‌വേ തന്നെയാണ് ദൈവം
  alternative: യഹ്‌വേ ദൈവമാണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ ‘തന്നെയാണ്’ വഴി സംരക്ഷിക്കുന്നു; എന്നാൽ ‘യഹ്‌വേ മാത്രം’ എന്ന് വിവർത്തനം ചെയ്ത് തുടർന്നുള്ള വാക്യത്തിന്റെ ആശയം മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- issue: ഏകദൈവത്വപ്രസ്താവനയുടെ വ്യാപ്തി
  choice: അവിടുന്നല്ലാതെ മറ്റാരുമില്ല
  alternative: അവിടുന്നു മാത്രമാണ് ഉള്ളത്
  rationale: മൂലത്തിലെ אֵין עוֹד מִלְבַדּוֹ എന്ന ഒഴിവാക്കൽപ്രസ്താവനയുടെ ശക്തി നിലനിർത്തുന്നു; സത്തയെക്കുറിച്ചുള്ള കൂടുതൽ വിപുലമായ തത്ത്വചിന്താപരമായ അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് സുതാര്യവുമായ മലയാളം. ഏകവചന അഭിസംബോധനയെ ആദരസൂചകമായ ‘നിങ്ങൾ’ കൊണ്ട് നൽകി. ദൈവത്തെ പരാമർശിക്കുമ്പോൾ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
