  text: Then Moses set apart three cities beyond the Jordan[a], toward the sunrise[b],
translation:
  language: ml
  text: അപ്പോൾ മോശെ യോർദ്ദാന്റെ മറുകരയിൽ[a], സൂര്യൻ ഉദിക്കുന്ന ദിക്കിലായി[b], മൂന്നു പട്ടണങ്ങൾ വേർതിരിച്ചുവച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യോർദ്ദാനക്കരെ’ എന്നും ‘യോർദ്ദാന്റെ അപ്പുറത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇത് ഒരു ഭൂമിശാസ്ത്രപ്രയോഗമാണ്; കൃത്യമായ പദപ്രയോഗം ആഖ്യാനത്തിന്റെ ദൃശ്യകോണിനെ ആശ്രയിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘സൂര്യൻ ഉദിക്കുന്ന ദിക്കിലേക്ക്’; അതായത്, കിഴക്കോട്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: തുടർന്നുള്ള സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന കാലസൂചകമായ ക്രിയാവിശേഷണം; ആഖ്യാനക്രമത്തിൽ സ്വാഭാവികമാണ്.
- source_word: יַבְדִּיל
  choice: വേർതിരിച്ചുവച്ചു
  rationale: בדל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഒരു പ്രത്യേക ഉദ്ദേശ്യത്തിനായി വേർതിരിക്കുക എന്ന ആശയം നൽകുന്നു; അഭയനഗരങ്ങളായി നിശ്ചയിക്കുന്ന സന്ദർഭത്തിൽ ഉദ്ദേശ്യം അമിതമായി വിശദീകരിക്കാതെ ആ അർഥം നിലനിർത്തുന്നു.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: שָׁלֹשׁ עָרִים
  choice: മൂന്നു പട്ടണങ്ങൾ
  rationale: സംഖ്യയും നാമവും നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തി.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ മറുകരയിൽ
  rationale: യോർദ്ദാന്റെ അപ്പുറത്തുള്ള പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗം; ദൃശ്യകോണിനെ നിർബന്ധമായി തീർപ്പാക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִזְרְחָה שָׁמֶשׁ
  choice: സൂര്യൻ ഉദിക്കുന്ന ദിക്കിലായി
  rationale: ‘സൂര്യൻ ഉദിക്കുന്ന ദിക്കിലേക്ക്’ എന്ന മൂലഭാഷയിലെ ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് കിഴക്കുദിക്കെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
