reference: Deuteronomy 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: ml
  text: ഇപ്പോൾ, ഇസ്രായേലേ, നിങ്ങൾ അനുഷ്ഠിക്കേണ്ടതിന് ഞാൻ നിങ്ങളെ പഠിപ്പിക്കുന്ന ചട്ടങ്ങളും ന്യായവിധികളും ശ്രദ്ധിച്ചു കേൾക്കുക; അങ്ങനെ നിങ്ങൾ ജീവിക്കേണ്ടതിനും, നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവമായ യാഹ്‌വെ[a] നിങ്ങൾക്കു നൽകുന്ന ദേശത്തേക്കു പ്രവേശിച്ച് അതു കൈവശമാക്കേണ്ടതിനുമായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; ‘യഹോവ’ എന്നും, പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മുൻവിവരണത്തിൽനിന്ന് ഇപ്പോഴത്തെ പ്രബോധനത്തിലേക്കുള്ള പ്രഭാഷണപരമായ മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാവിന്റെ ബന്ധകബലം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: שְׁמַע אֶל
  choice: ശ്രദ്ധിച്ചുകേൾക്കുക
  rationale: ഇവിടെ കേൾക്കലിനൊപ്പം ശ്രദ്ധിച്ചു ചെവിക്കൊള്ളുന്ന ആശയവും ഉണ്ട്. ‘അനുസരിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് അർത്ഥത്തെ അതിയായി നിർണയിക്കും; അനുഷ്ഠാനത്തിന്റെ ആശയം തുടർന്നുള്ള לַעֲשׂוֹת നൽകുന്നു.
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിയമസന്ദർഭത്തിൽ חֻקִּים സൂചിപ്പിക്കുന്ന നിശ്ചയിക്കപ്പെട്ട വ്യവസ്ഥകൾ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം നൽകുകയും, מִשְׁפָּטִים എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַמִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: പദത്തിന്റെ നിയമപരവും ന്യായപരവുമായ ഭാവം സംരക്ഷിക്കുന്നു; മുൻപുള്ള ‘ചട്ടങ്ങൾ’ എന്നതിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: מְלַמֵּד
  choice: പഠിപ്പിക്കുന്ന
  rationale: ഹീബ്രു കർത്തൃവാചക വിശേഷണത്തിന്റെ ഇപ്പോൾ നടന്നുകൊണ്ടിരിക്കുന്ന പ്രവർത്തനഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לַעֲשׂוֹת
  choice: അനുഷ്ഠിക്കേണ്ടതിന്
  rationale: കൽപ്പനകൾ പ്രവൃത്തിയിൽ നടപ്പാക്കുക എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; വെറും കേൾവിയല്ല, ചെയ്യലാണ് ഉദ്ദേശ്യമെന്ന് സംരക്ഷിക്കുന്നു.
- source_word: לְמַעַן תִּחְיוּ
  choice: അങ്ങനെ നിങ്ങൾ ജീവിക്കുകയും
  rationale: ഉദ്ദേശ്യവും അതിന്റെ ഫലവും തമ്മിലുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; നിയമാനുസരണവുമായി ബന്ധപ്പെട്ട ഉടമ്പടിപരമായ ജീവന്റെ ആശയം നിർവചിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וּבָאתֶם
  choice: പ്രവേശിച്ച്
  rationale: ദേശത്തിനകത്തേക്കുള്ള ദിശാബോധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וִירִשְׁתֶּם
  choice: കൈവശമാക്കുകയും
  rationale: ദേശവാഗ്ദാനസന്ദർഭത്തിൽ ירשׁ എന്നതിന്റെ മൂർത്തമായ ‘അധീനമാക്കുക/കൈവശപ്പെടുത്തുക’ എന്ന അർത്ഥം നൽകുന്നു; ‘അവകാശമാക്കുക’ എന്ന ഉടമ്പടിപരമായ ഭാവം മറ്റൊരു സാധ്യതയായി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ YHWH-നെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതമായി പരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: ഹീബ്രുവിലെ പിതൃകേന്ദ്രിതമായ ഉടമ്പടി സൂത്രവാക്യം അതിന്റെ ചരിത്രപരമായ നിർദ്ദിഷ്ടതയോടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം നാലക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. മലയാള വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ച് അത് പദവിയാക്കി മാറ്റാതെ നാമമായി സംരക്ഷിക്കുന്നു; ഹീബ്രു രൂപത്തെക്കുറിച്ചുള്ള വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: לְמַעַן തുടർന്നുള്ള ക്രിയകളുടെ ഉദ്ദേശ്യ/ഫലബന്ധം
  choice: ‘അങ്ങനെ’ എന്ന ഘടനയിൽ ജീവിക്കുക, പ്രവേശിക്കുക, കൈവശമാക്കുക എന്നീ ഫലങ്ങളെ ബന്ധിപ്പിച്ചു
  alternative: ‘നിങ്ങൾ ജീവിക്കേണ്ടതിനും പ്രവേശിച്ച് കൈവശമാക്കേണ്ടതിനും’ എന്ന കർശന ഉദ്ദേശ്യഘടന
  rationale: ഹീബ്രുവിൽ ഉദ്ദേശ്യവും പ്രതീക്ഷിക്കപ്പെടുന്ന ഫലവും ചേർന്നുനിൽക്കുന്നു. മലയാളത്തിൽ ഒന്നിനെ മാത്രം ഉറപ്പിച്ച് മറ്റേതിനെ ഇല്ലാതാക്കാതെ സ്വാഭാവികമായ ബന്ധം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനയ്ക്ക് വ്യക്തവും ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്നതുമായ ശൈലി. ‘ഇസ്രായേലേ’ എന്ന നേരിട്ടുള്ള സംബോധനയും നിയമപദങ്ങളായ ‘ചട്ടങ്ങൾ’, ‘ന്യായവിധികൾ’ എന്നിവയുടെ വേർതിരിവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
