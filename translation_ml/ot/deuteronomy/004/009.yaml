  text: רַ֡ק הִשָּׁ֣מֶר לְ/ךָ֩ וּ/שְׁמֹ֨ר נַפְשְׁ/ךָ֜ מְאֹ֗ד פֶּן תִּשְׁכַּ֨ח אֶת הַ/דְּבָרִ֜ים אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וּ/פֶן יָס֨וּרוּ֙ מִ/לְּבָ֣בְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וְ/הוֹדַעְתָּ֥/ם לְ/בָנֶ֖י/ךָ וְ/לִ/בְנֵ֥י בָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: ml
  text: പ്രത്യേകമായി, നീ നിന്നെത്തന്നെ സൂക്ഷിക്കുകയും അത്യന്തം ജാഗ്രതയോടെ നിന്നെത്തന്നെ കാത്തുകൊള്ളുകയും ചെയ്യുക; നിന്റെ കണ്ണുകൾ കണ്ട കാര്യങ്ങൾ നീ മറന്നുപോകാതിരിക്കാനും നിന്റെ ആയുഷ്കാലമൊക്കെയും അവ നിന്റെ ഹൃദയത്തിൽനിന്ന് നീങ്ങിപ്പോകാതിരിക്കാനും. അവ നിന്റെ മക്കളെയും നിന്റെ മക്കളുടെ മക്കളെയും അറിയിക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘നിന്റെ പുത്രന്മാരെയും നിന്റെ പുത്രന്മാരുടെ പുത്രന്മാരെയും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന പുല്ലിംഗ ബഹുവചനപദങ്ങൾ സന്ദർഭത്തിൽ മക്കളെയോ സന്തതികളെയോ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള ശക്തമായ മുന്നറിയിപ്പും നിയന്ത്രണവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘എന്നാൽ’ സ്വാഭാവികമായി ഈ വിരുദ്ധത നൽകുന്നു.
- source_word: הִשָּׁמֶר לְךָ
  choice: നിന്നെത്തന്നെ സൂക്ഷിക്കുക
  rationale: സ്വയം ജാഗ്രത പാലിക്കണമെന്ന നിഫാൽ ആജ്ഞയുടെ പ്രതിഫലനസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: നിന്റെ ജീവനെ അതീവ ജാഗ്രതയോടെ കാത്തുകൊള്ളുക
  rationale: נֶפֶשׁ എന്നതിന്റെ ‘ജീവൻ/സ്വയം’ എന്ന വിശാല അർഥം നിലനിർത്തുകയും ആവർത്തിച്ചുള്ള שׁמר-ന്റെ ഊന്നൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു; ‘ആത്മാവ്’ എന്ന ചുരുങ്ങിയ ദ്വൈതവാദ അർഥം ഒഴിവാക്കുന്നു.
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: നീ കണ്ട കാര്യങ്ങൾ
  rationale: കണ്ണുകൊണ്ടുള്ള നേരിട്ടുള്ള അനുഭവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; דְּבָרִים ഇവിടെ ദൃശ്യമായ കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּפֶן יָסוּרוּ מִלְּבָבְךָ
  choice: അവ നിന്റെ ഹൃദയത്തിൽനിന്ന് നീങ്ങിപ്പോകാതിരിക്കാൻ
  rationale: סור എന്ന ക്രിയയുടെ ‘നീങ്ങിപ്പോകുക’ എന്ന രൂപകവും ഹൃദയത്തെ ഓർമ്മ, ഗ്രഹണം, ഇച്ഛ എന്നിവയുടെ ആന്തരിക കേന്ദ്രമായി കാണുന്ന എബ്രായ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: וְהוֹדַעְתָּם
  choice: അവ ... അറിയിക്കുക
  rationale: ידע-യുടെ ഹിഫീൽ രൂപത്തിലെ ‘അറിയാൻ ഇടയാക്കുക/അറിയിക്കുക’ എന്ന അർഥം ‘പഠിപ്പിക്കുക’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണമില്ലാതെ നൽകുന്നു.
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: നിന്റെ മക്കളെയും നിന്റെ മക്കളുടെ മക്കളെയും
  rationale: തലമുറകളിലേക്കുള്ള ഉടമ്പടി-സ്മരണയുടെ പശ്ചാത്തലത്തിൽ בנים സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കാം; എബ്രായ ഘടനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ മനുഷ്യശാസ്ത്രപരമായ അർഥം
  choice: ‘നിന്റെ ജീവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘നിന്റെ ആത്മാവ്’ അല്ലെങ്കിൽ ‘നിന്നെത്തന്നെ’
  rationale: ഇവിടെ പദം മുഴുവൻ വ്യക്തിയെയോ ജീവനെക്കുറിച്ചുള്ള കരുതലെയോ സൂചിപ്പിക്കുന്നു. ‘ആത്മാവ്’ എന്നത് മൂലപാഠം നിർബന്ധിക്കാത്ത ശരീരം–ആത്മാവ് വിഭജനം തോന്നിപ്പിക്കാം; ‘ജീവൻ’ പദത്തിന്റെ രൂപവും വിശാലതയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- issue: בָנֶיךָ എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ വ്യാപ്തി
  choice: ‘മക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘പുത്രന്മാർ’
  rationale: ഈ തലമുറാന്തര കല്പനയിൽ പദം ആൺമക്കളിൽ മാത്രം പരിമിതമാണെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നില്ല; സന്തതികളെ പൊതുവായി ഉൾക്കൊള്ളുന്ന ‘മക്കൾ’ ഉചിതമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വ്യക്തതയും നിലനിർത്തി. എബ്രായത്തിലെ ആവർത്തിച്ച ജാഗ്രതാ ആജ്ഞയും ‘ഹൃദയം’ എന്ന രൂപകവും സംരക്ഷിച്ചു; വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ നെഗറ്റീവ് മുന്നറിയിപ്പുകൾ ഉദ്ദേശ്യരൂപത്തിൽ ക്രമപ്പെടുത്തി.
