  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י אֵ֤ל רַחוּם֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַשְׁחִיתֶ֑/ךָ וְ/לֹ֤א יִשְׁכַּח֙ אֶת בְּרִ֣ית אֲבֹתֶ֔י/ךָ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: ml
  text: എന്തെന്നാൽ നിന്റെ ദൈവമായ യാഹ്‌വേ കരുണയുള്ള ദൈവമാണ്[a]. അവൻ നിന്നെ കൈവിടുകയോ[b] നശിപ്പിക്കുകയോ നിന്റെ പിതാക്കന്മാരോടു[c] സത്യംചെയ്ത ഉടമ്പടി മറക്കുകയോ ഇല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ദയാലുവായ ദൈവമാണ്.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘നിന്നെ ഉപേക്ഷിക്കുകയോ.’'
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: ‘നിന്റെ പൂർവികരോടു.’ എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘നിന്റെ പിതാക്കന്മാർ’ എന്നാണ്; ഇവിടെ ഇസ്രായേലിന്റെ ഉടമ്പടിപിതാക്കന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തിനും ഉറപ്പിനും കാരണം നൽകുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אֵל רַחוּם
  choice: കരുണയുള്ള ദൈവം
  rationale: רַחוּם സൂചിപ്പിക്കുന്ന കരുണയും മനസ്സലിവും സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: പദവിക്കു പകരം എബ്രായ ദൈവനാമത്തെ മലയാളത്തിൽ പതിവായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവം
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള ഉടമ്പടിസംബന്ധമായ നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: לֹא יַרְפְּךָ
  choice: നിന്നെ കൈവിടുകയില്ല
  rationale: ഹിഫീൽ രൂപം ഇവിടെ വിട്ടുകളയുക, പിന്തുണ പിൻവലിക്കുക എന്ന ആശയം നൽകുന്നു; ‘കൈവിടുക’ സ്വാഭാവികമായി അത് അറിയിക്കുന്നു.
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: നശിപ്പിക്കുകയില്ല
  rationale: שׁחת എന്ന ക്രിയയുടെ ഈ സാഹചര്യത്തിലെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא יִשְׁכַּח אֶת בְּרִית
  choice: ഉടമ്പടി മറക്കുകയില്ല
  rationale: ദൈവം ഉടമ്പടി ‘മറക്കുകയില്ല’ എന്ന ഉറവിടത്തിലെ പ്രാധാന്യമുള്ള പ്രയോഗം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാർ
  rationale: ഇസ്രായേലിന്റെ ഉടമ്പടിപിതാക്കന്മാരെ സൂചിപ്പിക്കുന്ന ചരിത്രപരവും പുരുഷലിംഗപരവുമായ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: അവരോടു സത്യംചെയ്ത
  rationale: נשבע എന്നത് സത്യപ്രതിജ്ഞയുടെ ഗൗരവം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ പ്രയോഗം അത് ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ ഉടമ്പടിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- issue: אֲבֹתֶיךָ എന്ന ഉടമ്പടിചരിത്രപരമായ പരാമർശം
  choice: നിന്റെ പിതാക്കന്മാർ
  alternative: നിന്റെ പൂർവികർ
  rationale: സന്ദർഭം പൊതുവായ വംശപരമ്പരയെക്കാൾ ഇസ്രായേലിന്റെ ഉടമ്പടിപിതാക്കന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ഉറവിടത്തിലെ പ്രത്യേകത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ രണ്ടാംപുരുഷ ഏകവചനം ‘നിന്റെ/നിന്നെ’ എന്ന രൂപങ്ങളിൽ നിലനിർത്തി; ദൈവനാമം ‘യഹോവ’ എന്നും ഉടമ്പടിഭാഷ നേരിട്ടും സംരക്ഷിച്ചു.
