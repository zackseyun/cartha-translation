source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ וַ/עֲשִׂיתֶם֒ כִּ֣י הִ֤וא חָכְמַתְ/כֶם֙ וּ/בִ֣ינַתְ/כֶ֔ם לְ/עֵינֵ֖י הָ/עַמִּ֑ים אֲשֶׁ֣ר יִשְׁמְע֗וּ/ן אֵ֚ת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה וְ/אָמְר֗וּ רַ֚ק עַם חָכָ֣ם וְ/נָב֔וֹן הַ/גּ֥וֹי הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: ml
  text: നിങ്ങൾ അവ പാലിക്കുകയും അനുഷ്ഠിക്കുകയും ചെയ്യുക; ജനതകളുടെ ദൃഷ്ടിയിൽ ഇതാണ് നിങ്ങളുടെ ജ്ഞാനവും വിവേകവും. ഈ ചട്ടങ്ങളെല്ലാം[a] കേൾക്കുന്ന ജനതകൾ, “തീർച്ചയായും[b] ഈ വലിയ ജനത ജ്ഞാനവും വിവേകവുമുള്ള ജനമാണ്” എന്നു പറയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചട്ടങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ חֻקִּים എന്ന എബ്രായ നിയമപദം ‘നിയമവിധികൾ’ അല്ലെങ്കിൽ ‘കൽപ്പിത വ്യവസ്ഥകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: '‘തീർച്ചയായും’ എന്നു പരിഭാഷപ്പെടുത്തിയ רַק എന്ന എബ്രായപദത്തിന് അക്ഷരാർഥത്തിൽ പലപ്പോഴും ‘മാത്രം’ എന്നാണ് അർഥം; ഇവിടെ അത് ഊന്നലോടെയുള്ള ആശ്ചര്യോദ്ഗാരമായി ഉപയോഗിച്ചിരിക്കുന്നതായി തോന്നുന്നു. മറ്റൊരു പരിഭാഷ: ‘ഈ വലിയ ജനത മാത്രമാണ് ജ്ഞാനവും വിവേകവുമുള്ള ജനം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: പാലിക്കുകയും
  rationale: നിയമ-ഉടമ്പടി പശ്ചാത്തലത്തിൽ שׁמר കല്പനകൾ ശ്രദ്ധയോടെ അനുസരിക്കുകയും കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാലിക്കുക’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַעֲשִׂיתֶם
  choice: അനുഷ്ഠിക്കുകയും ചെയ്യണം
  rationale: עשה യഥാർഥ പ്രവർത്തനത്തെ ഊന്നുന്നു. ‘അനുഷ്ഠിക്കുക’ എന്നത് ‘പാലിക്കുക’ എന്നതിനോടൊപ്പം പ്രവൃത്തിയിലാക്കൽ എന്ന വ്യത്യസ്ത ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: כִּי הִוא
  choice: ഇതാണ്
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുമ്പുള്ള ചട്ടങ്ങളെയോ അവ പാലിച്ച് അനുഷ്ഠിക്കുന്നതിനെയോ കൂട്ടമായി സൂചിപ്പിക്കാം. ‘ഇതാണ്’ ആ സന്ദർഭസൂചനയെ അനാവശ്യമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: חָכְמַתְכֶם
  choice: നിങ്ങളുടെ ജ്ഞാനം
  rationale: חכמה ഇവിടെ ധാർമികവും പ്രായോഗികവുമായ ജ്ഞാനത്തെ സൂചിപ്പിക്കുന്നു; ‘ജ്ഞാനം’ സുതാര്യവും മാന്യവുമായ തുല്യപദമാണ്.
- source_word: וּבִינַתְכֶם
  choice: നിങ്ങളുടെ വിവേകം
  rationale: בינה, חכמהയോട് ബന്ധപ്പെട്ടെങ്കിലും വേറിട്ട തിരിച്ചറിവിനെയും വിവേചനശേഷിയെയും സൂചിപ്പിക്കുന്നു; ‘വിവേകം’ ഈ പദജോടിയുടെ ഭേദം നിലനിർത്തുന്നു.
- source_word: לְעֵינֵי הָעַמִּים
  choice: ജനതകളുടെ ദൃഷ്ടിയിൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘ജനതകളുടെ കണ്ണിൽ’ എന്ന പൊതുവായി കാണപ്പെടുന്ന വശം സ്വാഭാവിക മലയാളത്തിൽ ‘ദൃഷ്ടിയിൽ’ സംരക്ഷിക്കുന്നു.
- source_word: הָעַמִּים
  choice: ജനതകൾ
  rationale: പിന്നീട് വരുന്ന גּוֹי എന്ന പദത്തിൽനിന്നുള്ള പദഭേദം സാധ്യമാകുന്നത്ര നിലനിർത്തുകയും അനേകം ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: ഈ ചട്ടങ്ങളെല്ലാം
  rationale: חֻקִּים നിയമബലമുള്ള നിശ്ചിത വ്യവസ്ഥകളെ സൂചിപ്പിക്കുന്നു; ‘ചട്ടങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന നിയമപരമായ പദമാണ്.
- source_word: רַק
  choice: തീർച്ചയായും
  rationale: רַק സാധാരണയായി ‘മാത്രം’ എന്നർഥമുള്ളതെങ്കിലും ഇവിടെ ജനതകളുടെ നിഗമനത്തെ ഊന്നുന്ന ആശ്ചര്യോദ്ഗാരപരമായ പ്രയോഗമാണ്; ‘തീർച്ചയായും’ ആ പ്രയോഗബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַם חָכָם וְנָבוֹן
  choice: ജ്ഞാനവും വിവേകവുമുള്ള ഒരു ജനം
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ ‘ജ്ഞാനം’, ‘വിവേകം’ എന്നീ ആശയങ്ങളുമായുള്ള പ്രതിധ്വനി നിലനിർത്തുന്നു.
- source_word: הַגּוֹי הַגָּדוֹל הַזֶּה
  choice: ഈ മഹത്തായ ജനത
  rationale: גּוֹיയെ ‘ജനത’ എന്നും גָּדוֹלനെ സംഖ്യയിലോ ധാർമിക ശ്രേഷ്ഠതയിലോ മാത്രം ചുരുക്കാതെ ‘മഹത്തായ’ എന്നും പരിഭാഷപ്പെടുത്തി മൂലത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അനുസരണവും ജ്ഞാനവും തമ്മിലുള്ള ബന്ധം
  choice: ചട്ടങ്ങൾ പാലിക്കുകയും അനുഷ്ഠിക്കുകയും ചെയ്യുന്നതുമായി ‘നിങ്ങളുടെ ജ്ഞാനവും വിവേകവും’ അടുത്ത് ബന്ധിപ്പിച്ചു; അത് മറ്റു ജനതകളുടെ മുമ്പിൽ പ്രകടമാകുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: അനുസരണത്തിൽനിന്ന് വേർപ്പെടുത്തി ചട്ടങ്ങൾ തന്നെയാണ് ജ്ഞാനവും വിവേകവും എന്നു വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യഘടന അനുസരണത്തെയും ദൈവിക ചട്ടങ്ങളെയും അടുത്ത് ബന്ധിപ്പിക്കുന്നുവെങ്കിലും ‘ഇത്’ എന്ന സർവനാമത്തിന്റെ സൂചന പൂർണമായി തുറന്നുപറയുന്നില്ല. പരിഭാഷ ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; പുണ്യമോ ദേശീയ ശ്രേഷ്ഠതയോ സംബന്ധിച്ച പിൽക്കാല സിദ്ധാന്തങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളമാണ് ഉപയോഗിച്ചത്. ‘പാലിക്കുക—അനുഷ്ഠിക്കുക’, ‘ജ്ഞാനം—വിവേകം’ എന്നീ ഇരട്ടപ്രയോഗങ്ങൾ മൂലപാഠത്തിലെ ആശയഭേദവും ആവർത്തനബന്ധവും നിലനിർത്തുന്നു.
