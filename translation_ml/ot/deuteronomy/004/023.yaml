id: DEU.4.23
reference: Deuteronomy 4:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִשָּׁמְר֣וּ לָ/כֶ֗ם פֶּֽן תִּשְׁכְּחוּ֙ אֶת בְּרִ֤ית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר כָּרַ֖ת עִמָּ/כֶ֑ם וַ/עֲשִׂיתֶ֨ם לָ/כֶ֥ם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ നിങ്ങളുമായി ചെയ്ത ഉടമ്പടി മറക്കുകയോ, നിന്റെ ദൈവമായ യാഹ്‌വേ നിന്നോട് ഉണ്ടാക്കരുതെന്ന് കല്പിച്ചിട്ടുള്ള[a] ഏതെങ്കിലും വസ്തുവിന്റെ സാദൃശ്യമായ ഒരു കൊത്തുരൂപം നിങ്ങൾക്കായി ഉണ്ടാക്കുകയോ ചെയ്യാതിരിക്കാൻ നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു അക്ഷരാർഥത്തിൽ: ‘നിന്റെ ദൈവമായ യാഹ്‌വേ നിന്നോടു കല്പിച്ചിട്ടുള്ള.’ ‘ഉണ്ടാക്കരുത്’ എന്ന നിഷേധം സന്ദർഭത്തിൽ സൂചിതമാണ്; ആവർത്തനപുസ്തകം 4:16 താരതമ്യം ചെയ്യുക.'
    reason: ഹീബ്രു പാഠത്തിലെ അവസാന ബന്ധവാക്യത്തിൽ പ്രത്യക്ഷമല്ലാത്തതും സന്ദർഭത്തിൽനിന്ന് വ്യക്തവുമായ നിഷേധം പരിഭാഷയിൽ വ്യക്തമാക്കിയതിന്റെ രേഖപ്പെടുത്തൽ.
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുക
  rationale: നിഫാൽ ആജ്ഞാരൂപവും לָכֶם എന്ന ഘടകവും ചേർന്നുള്ള സ്വയം ജാഗ്രത പാലിക്കണമെന്ന മുന്നറിയിപ്പ് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: פֶּן
  choice: …ചെയ്യാതിരിക്കാൻ
  rationale: ഒഴിവാക്കേണ്ട അപകടം സൂചിപ്പിക്കുന്ന നിഷേധാത്മക മുന്നറിയിപ്പ് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മറക്കലും രൂപം ഉണ്ടാക്കലും ഒരേ മുന്നറിയിപ്പിന് കീഴിൽ നിലനിർത്തുന്നു.
- source_word: בְּרִית
  choice: ഉടമ്പടി
  rationale: ദൈവവും ഇസ്രായേലും തമ്മിലുള്ള ബന്ധത്തിന്റെ ഗൗരവവും പരസ്പരബന്ധിത സ്വഭാവവും സൂക്ഷിക്കുന്ന പരിചിതമായ ബൈബിൾപദമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാള ലിപിയിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: നിങ്ങളുമായി ചെയ്ത
  rationale: כרת ברית എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥമായ ‘മുറിക്കുക’ മലയാളത്തിൽ അവ്യക്തമായതിനാൽ അതിന്റെ സ്വാഭാവിക അർഥമായ ഉടമ്പടി ചെയ്യുക എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: നിങ്ങൾക്കായി ഉണ്ടാക്കുകയോ
  rationale: לָכֶם എന്നതിലെ സ്വയംലക്ഷ്യമാക്കുന്ന അർഥം ഒഴിവാക്കാതെ ‘നിങ്ങൾക്കായി’ എന്നു നിലനിർത്തുന്നു.
- source_word: פֶּסֶל
  choice: ഒരു കൊത്തുരൂപം
  rationale: കൊത്തിയോ ചെതുക്കിയോ നിർമ്മിച്ച പ്രതിമയെയോ രൂപത്തെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ദൃശ്യവും നിർമാണപരവുമായ അർഥം നിലനിർത്തുന്നു; പൊതുവായ ‘വിഗ്രഹം’ എന്നതിനെക്കാൾ നിർദിഷ്ടമാണ്.
- source_word: תְּמוּנַת כֹּל
  choice: ഏതൊന്നിന്റെയെങ്കിലും സാദൃശ്യത്തിലുള്ള
  rationale: תְּמוּנָה എന്നതിലെ രൂപം, സാദൃശ്യം, പ്രതിനിധാനം എന്നീ ആശയങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אֱלֹהֵיכֶם / אֱלֹהֶיךָ; צִוְּךָ
  choice: നിങ്ങളുടെ ദൈവമായ … / നിന്റെ ദൈവമായ … നിന്നോട്
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ ബഹുവചന അഭിസംബോധനയിൽനിന്ന് അവസാന ഉപവാക്യത്തിലെ ഏകവചനത്തിലേക്കുള്ള ഹീബ്രു മാറ്റം മറച്ചുവയ്ക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാന ബന്ധവാക്യത്തിൽ സൂചിതമായ നിഷേധം
  choice: ‘ഉണ്ടാക്കരുതെന്നു കല്പിച്ചിട്ടുള്ള’ എന്നു സന്ദർഭത്തിൽ സൂചിതമായ നിഷേധം മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കി.
  alternative: ‘നിന്നോടു കല്പിച്ചിട്ടുള്ള’ എന്ന് അക്ഷരരൂപത്തിൽ മാത്രം നൽകി നിഷേധം സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാൻ വിടുക.
  rationale: മസോററ്റിക് പാഠത്തിൽ ‘അരുത്’ എന്ന നിഷേധപദം ഇവിടെ പ്രത്യക്ഷമല്ല. എങ്കിലും ആവർത്തനപുസ്തകം 4:16 ഉൾപ്പെടെയുള്ള തൊട്ടടുത്ത സന്ദർഭം കൊത്തുരൂപം ഉണ്ടാക്കുന്നതിനെ വിലക്കുന്നതാണ്. നിഷേധം ചേർക്കാതെയുള്ള മലയാളം ദൈവം അത്തരമൊരു രൂപം ഉണ്ടാക്കാൻ കല്പിച്ചു എന്ന വിപരീത ധാരണ സൃഷ്ടിക്കാം; അതിനാൽ സൂചിതമായ അർഥം വ്യക്തമാക്കി, പാഠത്തിന്റെ അക്ഷരരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള അഭിസംബോധനമാറ്റം
  choice: ‘നിങ്ങളുടെ/നിങ്ങളുമായി/നിങ്ങൾക്കായി’ എന്ന ബഹുവചനത്തോടൊപ്പം അവസാന ഭാഗത്തെ ‘നിന്റെ/നിന്നോട്’ എന്ന ഏകവചനം നിലനിർത്തി.
  alternative: മലയാളത്തിലെ ഒഴുക്കിനായി വാക്യമെങ്ങും ബഹുവചനം ഉപയോഗിക്കുക.
  rationale: ഈ മാറ്റം ഹീബ്രു പാഠത്തിൽ യഥാർഥമായി ഉള്ളതിനാൽ സമൂഹത്തെ ഒന്നാകെയും ഓരോ അംഗത്തെയും അഭിസംബോധന ചെയ്യുന്ന സാധ്യത തുറന്നുവെക്കുന്നു; അതിനെ ശൈലിപരമായി ഒതുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മുന്നറിയിപ്പിന്റെ ഏകീകൃത വാക്യഘടനയ്ക്കായി ‘മറക്കുകയോ … ഉണ്ടാക്കുകയോ ചെയ്യാതിരിക്കാൻ’ എന്നു രൂപപ്പെടുത്തി. ഹീബ്രുവിലെ ബഹുവചന–ഏകവചന മാറ്റം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചതിനാൽ മലയാളത്തിലും ആ മാറ്റം ശ്രദ്ധേയമാണ്.
