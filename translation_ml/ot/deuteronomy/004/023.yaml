revisions:
- from: നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങളുമായി ചെയ്ത ഉടമ്പടി മറക്കുകയോ, നിന്റെ ദൈവമായ യഹോവ നിന്നോട് ഉണ്ടാക്കരുതെന്നു കല്പിച്ചിട്ടുള്ള[a] ഏതൊന്നിന്റെയെങ്കിലും സാദൃശ്യത്തിലുള്ള ഒരു കൊത്തുരൂപം നിങ്ങൾക്കായി ഉണ്ടാക്കുകയോ ചെയ്യാതിരിക്കാൻ നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുക.
  to: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ നിങ്ങളുമായി ചെയ്ത ഉടമ്പടി മറക്കുകയോ, നിന്റെ ദൈവമായ യാഹ്‌വേ നിന്നോട് ഉണ്ടാക്കരുതെന്ന് കല്പിച്ചിട്ടുള്ള[a] ഏതെങ്കിലും വസ്തുവിന്റെ സാദൃശ്യമായ ഒരു കൊത്തുരൂപം നിങ്ങൾക്കായി ഉണ്ടാക്കുകയോ ചെയ്യാതിരിക്കാൻ നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുക.
