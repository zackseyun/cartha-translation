  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/תַ֗חַת כִּ֤י אָהַב֙ אֶת אֲבֹתֶ֔י/ךָ וַ/יִּבְחַ֥ר בְּ/זַרְע֖/וֹ אַחֲרָ֑י/ו וַ/יּוֹצִֽאֲ/ךָ֧ בְּ/פָנָ֛י/ו בְּ/כֹח֥/וֹ הַ/גָּדֹ֖ל מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: ml
  text: നിന്റെ പിതാക്കന്മാരെ അവൻ സ്നേഹിക്കുകയും അവരുടെ ശേഷം അവരുടെ സന്തതിയെ തിരഞ്ഞെടുക്കുകയും ചെയ്തതുകൊണ്ട്[a], തന്റെ സാന്നിധ്യത്താൽ[b], തന്റെ മഹാശക്തിയാൽ, അവൻ നിന്നെ ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അവന്റെ ശേഷം അവന്റെ സന്തതിയെ.’ ഹീബ്രുവിൽ പ്രത്യയങ്ങൾ ഏകവചനത്തിലാണ്; ‘നിന്റെ പിതാക്കന്മാർ’ എന്നതിനെ ഒരു കൂട്ടമായി കണക്കാക്കിയിരിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘തന്റെ മുഖത്താൽ’ അല്ലെങ്കിൽ ‘തന്റെ മുമ്പിൽ.’ ഇവിടെ ഈ പ്രയോഗം ദൈവത്തിന്റെ സ്വന്തം സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: ചെയ്തതുകൊണ്ട്
  rationale: ഈ പ്രയോഗത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മുൻവാക്യത്തോടുള്ള ബന്ധം നിലനിർത്താൻ വാക്യഘടന കാരണവാചകമായി സൂക്ഷിച്ചു.
- source_word: אָהַב
  choice: സ്നേഹിക്കുകയും
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരെ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനവും ഏകവചന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു; ഉടമ്പടിപരമായ പൂർവപിതൃസൂചനയും നിലനിൽക്കുന്നു.
- source_word: וַיִּבְחַר
  choice: തിരഞ്ഞെടുക്കുകയും
  rationale: בחר എന്ന ക്രിയയുടെ സാധാരണ അർഥം നൽകുന്നു; പിന്നീട് രൂപപ്പെട്ട സാങ്കേതിക ദൈവശാസ്ത്രപദം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: בְּזַרְעוֹ אַחֲרָיו
  choice: അവരുടെ ശേഷം അവരുടെ സന്തതിയെ
  rationale: ഹീബ്രുവിലെ ഏകവചന പ്രത്യയങ്ങൾ കൂട്ടായ അർഥത്തിലുള്ള ‘പിതാക്കന്മാർ’ എന്ന മുൻപദത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു. ‘സന്തതി’ זרעയുടെ കൂട്ടായ ഏകവചനഭാവം സൂക്ഷിക്കുന്നു.
- source_word: וַיּוֹצִאֲךָ
  choice: അവൻ നിന്നെ ... പുറപ്പെടുവിച്ചു
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരകാർഥവും പുറപ്പാട്-ഭാഷയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: בְּפָנָיו
  choice: തന്റെ സാന്നിധ്യത്താൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘തന്റെ മുഖത്താൽ/തന്റെ മുമ്പിൽ’ എന്ന പ്രയോഗം ഇവിടെ ദൈവത്തിന്റെ സ്വന്തം സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥവത്തും സ്വാഭാവികവുമായ രൂപമാണിത്.
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: തന്റെ മഹാശക്തിയാൽ
  rationale: כח എന്നതിന്റെ ശക്തി/ബലം എന്ന അർഥവും വിശേഷണത്തിന്റെ തീവ്രതയും ഉപകരണാർഥക വിഭക്തിയും ചുരുക്കമായി നൽകുന്നു.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: പുറപ്പെടുവിക്കൽ ക്രിയയോടൊപ്പം ഉറവിടസ്ഥാനം വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: ‘അവന്റെ സന്തതി, അവന്റെ ശേഷം’ എന്ന ഏകവചന പ്രത്യയങ്ങളുടെ കൂട്ടായ സൂചന
  choice: അവരുടെ ശേഷം അവരുടെ സന്തതി
  alternative: അവന്റെ ശേഷം അവന്റെ സന്തതി
  rationale: രൂപപരമായി പ്രത്യയങ്ങൾ ഏകവചനമാണെങ്കിലും അവയുടെ മുൻപദം കൂട്ടായ അർഥത്തിലുള്ള ‘നിന്റെ പിതാക്കന്മാർ’ ആണ്. പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ കൂട്ടായ അർഥം നൽകി, രൂപപരമായ വ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: בְּפָנָיו എന്നതിന്റെ അർഥം
  choice: തന്റെ സാന്നിധ്യത്താൽ
  alternative: തന്റെ മുഖത്താൽ; തന്റെ മുമ്പിൽ
  rationale: ദൈവം തന്റെ സ്വന്തം സാന്നിധ്യത്തിൽ ഇസ്രായേലിനെ പുറപ്പെടുവിച്ചു എന്ന ആശയം സന്ദർഭത്തിൽ യോജിക്കുന്നു. അക്ഷരാർഥത്തിലെ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ/നിന്നെ’ നിലനിർത്തി. കാരണബന്ധം മലയാളത്തിലെ ക്രിയാവസാന ഘടനയിൽ വ്യക്തമായി നൽകി; യഥാർഥ ഹീബ്രു അസ്പഷ്ടതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
