source:
  edition: WLC
  text: רְאֵ֣ה לִמַּ֣דְתִּי אֶתְ/כֶ֗ם חֻקִּים֙ וּ/מִשְׁפָּטִ֔ים כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָ֣ה אֱלֹהָ֑/י לַ/עֲשׂ֣וֹת כֵּ֔ן בְּ/קֶ֣רֶב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם בָּאִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: ml
  text: 'നോക്കുക[a], എന്റെ ദൈവമായ യഹോവ എന്നോടു കല്പിച്ചതുപോലെതന്നെ ഞാൻ നിങ്ങളെ ചട്ടങ്ങളും ന്യായവിധികളും[b] പഠിപ്പിച്ചിരിക്കുന്നു; നിങ്ങൾ കൈവശമാക്കാൻ[d] അവിടേക്കു പ്രവേശിക്കുന്ന ആ ദേശത്തിന്റെ നടുവിൽ[c] അപ്രകാരം അനുഷ്ഠിക്കേണ്ടതിന്.


    [a] അഥവാ, “ശ്രദ്ധിക്കുക.” എബ്രായഭാഷയിൽ ഇത് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഏകവചന കല്പനയാണ്.


    [b] അഥവാ, “നിയമങ്ങളും വിധികളും.”


    [c] അക്ഷരാർഥത്തിൽ, “ദേശത്തിന്റെ നടുവിൽ”; ലളിതമായി, “ദേശത്ത്.”


    [d] അഥവാ, “അവകാശമാക്കാൻ.” ഈ സന്ദർഭത്തിൽ എബ്രായപദത്തിന് കൈവശമാക്കുക, അവകാശമാക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശ്രദ്ധിക്കുക.” എബ്രായഭാഷയിൽ ഇത് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഏകവചന കല്പനയാണ്.
    reason: വ്യവഹാരപരമായ അർഥവും വ്യാകരണരൂപവും വ്യക്തമാക്കാൻ.
  - marker: b
    text: അഥവാ, “നിയമങ്ങളും വിധികളും.”
    reason: എബ്രായ നിയമപദജോടിയുടെ സാധുവായ മറ്റൊരു പരിഭാഷ നൽകാൻ.
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “ദേശത്തിന്റെ നടുവിൽ”; ലളിതമായി, “ദേശത്ത്.”
    reason: മൂലപാഠത്തിലെ בְּקֶרֶב എന്ന പദത്തിന്റെ അക്ഷരാർഥവും സ്വാഭാവിക ലളിതീകരണവും കാണിക്കാൻ.
  - marker: d
    text: അഥവാ, “അവകാശമാക്കാൻ.” ഈ സന്ദർഭത്തിൽ എബ്രായപദത്തിന് കൈവശമാക്കുക, അവകാശമാക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്.
    reason: ירשׁ എന്ന പദത്തിലെ കൈവശപ്പെടുത്തൽ/അവകാശലഭ്യത എന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: רְאֵה
  choice: നോക്കുക
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഏകവചന കല്പനയുടെ നേരിട്ടുള്ള ബലം നിലനിർത്തുന്നു; ‘ശ്രദ്ധിക്കുക’ എന്ന വ്യവഹാരപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לִמַּדְתִּי
  choice: പഠിപ്പിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ പഠിപ്പിക്കൽ ഇപ്പോഴത്തെ അനുസരണവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നതിനാൽ എബ്രായ perfect രൂപത്തിന്റെ നിലവിലെ പ്രസക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: ചട്ടങ്ങളും ന്യായവിധികളും
  rationale: രണ്ടു നിയമപദങ്ങളുടെയും വ്യത്യാസവും നിയമപരമായ ഭാവവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: മോശെയുടെ പഠിപ്പിക്കൽ ദൈവകല്പനയോടു കൃത്യമായി ഒത്തിരിക്കുന്നുവെന്ന താരതമ്യബലം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה אֱלֹהָי
  choice: എന്റെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരിച്ചു, אֱלֹהָי എന്ന വ്യക്തിപരമായ ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַעֲשׂוֹת כֵּן
  choice: നിങ്ങൾ അപ്രകാരം അനുഷ്ഠിക്കേണ്ടതിന്
  rationale: പഠിപ്പിച്ചതിന്റെ ഉദ്ദേശ്യം പ്രയോഗമാണെന്ന ആശയവും כֵּן എന്നതിന്റെ ‘അപ്രകാരം’ എന്ന പരാമർശബലവും സംരക്ഷിക്കുന്നു.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: ആ ദേശത്തിന്റെ നടുവിൽ
  rationale: בְּקֶרֶב എന്ന പദത്തിന്റെ ‘നടുവിൽ/ഉള്ളിൽ’ എന്ന ദൃശ്യഭാവം ലളിതമായ ‘ദേശത്ത്’ എന്നതിലേക്കു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בָּאִים שָׁמָּה
  choice: അവിടേക്കു പ്രവേശിക്കുന്ന
  rationale: ശീഘ്രം സംഭവിക്കാനിരിക്കുന്ന പ്രവേശനവും שָׁמָּה എന്ന ദിശാസൂചകമായ ‘അവിടേക്ക്’ എന്ന ഘടകവും ഉൾക്കൊള്ളുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ഭൂമിയെ സംബന്ധിച്ച ירשׁ എന്ന ക്രിയയുടെ വിശാലമായ അർഥം നൽകുന്നു; ‘അവകാശമാക്കാൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: לַעֲשׂוֹת כֵּן എന്ന ഉദ്ദേശ്യവാക്യത്തിന്റെ കർത്താവ്
  choice: നിങ്ങൾ അപ്രകാരം അനുഷ്ഠിക്കേണ്ടതിന്
  alternative: അപ്രകാരം ചെയ്യാൻ
  rationale: സന്ദർഭത്തിൽ ജനങ്ങളാണ് ചട്ടങ്ങളും ന്യായവിധികളും അനുഷ്ഠിക്കേണ്ടവർ; എങ്കിലും പുതിയ ദൈവശാസ്ത്രവിവരണം ചേർക്കാതെ എബ്രായത്തിലെ ഉദ്ദേശ്യബന്ധം മാത്രം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-പ്രബോധന ശൈലി സ്വീകരിച്ചു. ഏകവചന ശ്രദ്ധാകല്പനയും തുടർന്ന് വരുന്ന ബഹുവചന അഭിസംബോധനയും മൂലപാഠത്തിലെ വ്യാകരണപരമായ മാറിച്ചേരലനുസരിച്ച് നിലനിർത്തി. ദുഷ്കരമായ ‘ദേശത്തിന്റെ നടുവിൽ’ എന്ന പ്രയോഗം ഔപചാരിക സമത്വത്തിനായി മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ച് ലളിതരൂപം അടിക്കുറിപ്പിൽ നൽകി.
