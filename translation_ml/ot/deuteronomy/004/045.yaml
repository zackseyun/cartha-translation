source:
  edition: WLC
  text: אֵ֚לֶּה הָֽ/עֵדֹ֔ת וְ/הַֽ/חֻקִּ֖ים וְ/הַ/מִּשְׁפָּטִ֑ים אֲשֶׁ֨ר דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/045.yaml
  text: These are the testimonies[a], the statutes, and the judgments that Moses spoke to the sons of Israel when they came out from Egypt.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ മോശ അവരോടു പ്രസ്താവിച്ച സാക്ഷ്യങ്ങളും ചട്ടങ്ങളും ന്യായവിധികളും ഇവയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; അഥവാ ‘ഇസ്രായേൽജനം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവയാണ്
  rationale: തുടർന്ന് പറയുന്ന നിയമവിഭാഗങ്ങളെ ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചനരൂപം; മലയാളത്തിലെ നാമവാക്യത്തിന് സ്വാഭാവികമായി ‘ആണ്’ ചേർത്തു.
- source_word: הָעֵדֹת
  choice: സാക്ഷ്യങ്ങൾ
  rationale: ഉടമ്പടിയുമായി ബന്ധപ്പെട്ട സാക്ഷ്യസ്വഭാവമുള്ള വ്യവസ്ഥകൾ എന്ന മൂലപദത്തിന്റെ ആശയം നിലനിർത്തുകയും മറ്റു നിയമപദങ്ങളിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിയമപരമായി നിശ്ചയിക്കപ്പെട്ട വ്യവസ്ഥകൾ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പദം.
- source_word: הַמִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: നീതിന്യായപരമായ തീരുമാനങ്ങളെയോ നിയമവിധികളെയോ സൂചിപ്പിക്കുകയും חֻקִּים എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר דִּבֶּר
  choice: പ്രസ്താവിച്ച
  rationale: ഇവിടെ നിയമങ്ങൾ ജനത്തോടു പറഞ്ഞതിന്റെ ഔപചാരിക സന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അതിരുകടന്ന ദൈവശാസ്ത്രപരമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു രൂപത്തിന്റെ പാരമ്പര്യവും സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന ജനനാമസ്വഭാവവും മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּצֵאתָם
  choice: പുറപ്പെട്ടപ്പോൾ
  rationale: ബെത് + ക്രിയാനാമരൂപത്തിന്റെ കാലസൂചന സ്വാഭാവികമായ മലയാള കാലവാക്യമായി നൽകുന്നു.
- source_word: מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: പുറപ്പെടലിന്റെ ഉറവിടസ്ഥലം നേരിട്ട് വ്യക്തമാക്കുന്ന സാധാരണ ഭൂമിശാസ്ത്രപ്രയോഗം.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ജനനാമത്തിന്റെ ലിംഗരൂപവും വ്യാപ്തിയും
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ; ഇസ്രായേൽജനം
  rationale: ഹീബ്രുവിന്റെ ശാബ്ദിക രൂപം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ ആണെങ്കിലും സന്ദർഭത്തിൽ അത് ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ജനനാമമാണ്. ‘ഇസ്രായേൽമക്കൾ’ ഉറവിടരൂപത്തിന്റെ പ്രതിധ്വനി നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായി പുരുഷന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ നിയമപരമായ ശൈലി. മൂന്ന് ഹീബ്രു നിയമവിഭാഗങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം ‘സാക്ഷ്യങ്ങൾ, ചട്ടങ്ങൾ, ന്യായവിധികൾ’ എന്ന സമാന്തരക്രമത്തിൽ സംരക്ഷിച്ചു.
