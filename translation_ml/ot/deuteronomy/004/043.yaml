revisions:
- from: മരുഭൂമിയിൽ, സമതലപ്രദേശത്ത്[a] ഉള്ള ബേസെർ രൂബേൻഗോത്രക്കാർക്കും; ഗിലെയാദിലുള്ള രാമോത്ത് ഗാദ്ഗോത്രക്കാർക്കും; ബാശാനിലുള്ള ഗോലാൻ മനശ്ശെഗോത്രക്കാർക്കും.
  to: മരുഭൂമിയിലെ പീഠഭൂമിപ്രദേശത്തുള്ള ബെസെർ രൂബേൻഗോത്രക്കാർക്കും; ഗിലെയാദിലുള്ള രാമോത്ത് ഗാദ്ഗോത്രക്കാർക്കും; ബാശാനിലുള്ള ഗോലാൻ മനശ്ശെഗോത്രക്കാർക്കും.
  rationale: The geographic phrase is revised to reflect the likely upland/plateau sense of מִישֹׁר and made idiomatic Malayalam. The footnote retains the legitimate ‘plain/level country’ alternative. The spelling of Bezer is adjusted to align more closely with the Hebrew vocalization. No theological or interpretive change is made.
