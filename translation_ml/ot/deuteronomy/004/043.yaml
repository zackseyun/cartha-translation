  edition: WLC
  text: אֶת בֶּ֧צֶר בַּ/מִּדְבָּ֛ר בְּ/אֶ֥רֶץ הַ/מִּישֹׁ֖ר לָ/רֻֽאוּבֵנִ֑י וְ/אֶת רָאמֹ֤ת בַּ/גִּלְעָד֙ לַ/גָּדִ֔י וְ/אֶת גּוֹלָ֥ן בַּ/בָּשָׁ֖ן לַֽ/מְנַשִּֽׁי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: ml
  text: മരുഭൂമിയിലെ പീഠഭൂമിപ്രദേശത്തുള്ള ബെസെർ രൂബേൻഗോത്രക്കാർക്കും; ഗിലെയാദിലുള്ള രാമോത്ത് ഗാദ്ഗോത്രക്കാർക്കും; ബാശാനിലുള്ള ഗോലാൻ മനശ്ശെഗോത്രക്കാർക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּצֶר
  choice: ബേസെർ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: മִדְבָּר എന്നത് ജനവാസം കുറഞ്ഞ വരണ്ട തുറന്ന പ്രദേശത്തെയും മരുഭൂമിയെയും സൂചിപ്പിക്കാം; സന്ദർഭത്തിന് യോജിക്കുന്ന സ്വാഭാവിക മലയാളപദം തിരഞ്ഞെടുത്തു.
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: സമതലപ്രദേശത്ത്
  rationale: מִישׁוֹר നിരപ്പായ ഭൂഭാഗത്തെയോ പീഠഭൂമിയെയോ സൂചിപ്പിക്കുന്നു. പ്രധാനവാചകത്തിൽ വായനാസൗകര്യമുള്ള ‘സമതലപ്രദേശം’ ഉപയോഗിച്ച് ഭൗമശാസ്ത്രപരമായ ‘പീഠഭൂമി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: לָרֻאוּבֵנִי
  choice: രൂബേൻഗോത്രക്കാർക്കും
  rationale: എബ്രായത്തിലെ ഏകവചന ഗോത്രനാമവിശേഷണം സമൂഹത്തെ പ്രതിനിധീകരിക്കുന്നതാണ്; മലയാളത്തിൽ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ബഹുവചന ഗോത്രരൂപം ഉപയോഗിച്ചു.
- source_word: רָאמֹת
  choice: രാമോത്ത്
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בַּגִּלְעָד
  choice: ഗിലെയാദിലുള്ള
  rationale: പ്രദേശനാമം ലിപ്യന്തരിച്ചു; നഗരത്തിന്റെ സ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിച്ചു.
- source_word: לַגָּדִי
  choice: ഗാദ്ഗോത്രക്കാർക്കും
  rationale: ഗോത്രത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന രൂപം മലയാളത്തിൽ സമൂഹവാചക ബഹുവചനമായി നൽകി.
- source_word: גּוֹלָן
  choice: ഗോലാൻ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בַּבָּשָׁן
  choice: ബാശാനിലുള്ള
  rationale: പ്രദേശനാമം ലിപ്യന്തരിച്ചു; സ്ഥാനം സൂചിപ്പിക്കുന്ന രൂപത്തിൽ ചേർത്തു.
- source_word: לַמְנַשִּׁי
  choice: മനശ്ശെഗോത്രക്കാർക്കും
  rationale: എബ്രായ ഏകവചന ഗോത്രനാമവിശേഷണത്തിന്റെ സമൂഹവാചക അർത്ഥം വ്യക്തമായി പ്രകടിപ്പിച്ചു.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: മൂന്നു നഗരങ്ങളുടെ സമാന്തര പട്ടികയും ‘ക്കും’ എന്ന ഏകോപനരൂപവും
  rationale: നേരിട്ടുള്ള കർമസൂചകമായ אֶת-ന് മലയാളത്തിൽ പ്രത്യേക പദം ആവശ്യമില്ല; ആവർത്തിച്ച ഘടന പട്ടികയുടെ സമാന്തരരൂപത്തിൽ പ്രതിഫലിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂമിശാസ്ത്ര-പട്ടികാശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ഗോത്രസൂചക ഏകവചനങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹവാചക ബഹുവചനങ്ങളാക്കി; മൂന്നു ഘടകങ്ങളുടെയും സമാന്തരത നിലനിർത്തി.
