    text: അഥവാ, ‘സമതലപ്രദേശത്ത്.’ എബ്രായപദം നിരപ്പായ ഭൂഭാഗത്തെയോ ഉയർന്ന പീഠഭൂമിയെയോ സൂചിപ്പിക്കാം.
