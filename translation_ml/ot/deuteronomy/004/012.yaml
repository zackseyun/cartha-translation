language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֲלֵי/כֶ֖ם מִ/תּ֣וֹךְ הָ/אֵ֑שׁ ק֤וֹל דְּבָרִים֙ אַתֶּ֣ם שֹׁמְעִ֔ים וּ/תְמוּנָ֛ה אֵינְ/כֶ֥ם רֹאִ֖ים זוּלָתִ֥י קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വെ തീയുടെ നടുവിൽനിന്ന്[a] നിങ്ങളോടു സംസാരിച്ചു. നിങ്ങൾ വാക്കുകളുടെ ശബ്ദം[b] കേട്ടു; എന്നാൽ ഒരു രൂപവും[c] കണ്ടില്ല—ശബ്ദം മാത്രം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തീയ്ക്കുള്ളിൽനിന്ന്.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘വാക്കുകളുടെ ശബ്ദം’; അഥവാ, ‘സംസാരത്തിന്റെ ശബ്ദം.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘സാദൃശ്യം,’ ‘ആകൃതി,’ അല്ലെങ്കിൽ ‘ദൃശ്യഭാവം.’ കാണാവുന്ന ഒരു പ്രതിനിധാനവും കണ്ടില്ലെന്നതാണ് എബ്രായപദം ഊന്നിപ്പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമത്തെ ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിലേക്ക് മാറ്റാതെ, ഹീബ്രു നാമത്തിന്റെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘സംസാരിക്കുക’ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: തീയുടെ നടുവിൽനിന്ന്
  rationale: മൊഴി തീയുടെ ഉള്ളിൽനിന്ന് പുറപ്പെട്ടുവെന്ന ദൃശ്യബോധം מִתּוֹךְ എന്ന പ്രയോഗത്തിനനുസരിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: קוֹל דְּבָרִים
  choice: വാക്കുകളുടെ ശബ്ദം
  rationale: ‘ശബ്ദം/സ്വരം’ എന്നും ‘വാക്കുകൾ’ എന്നും വരുന്ന ഹീബ്രു ഘടന നിലനിർത്തി, അവ്യക്തമായ ഒച്ചയല്ല അർഥമുള്ള വാക്കുകളാണ് കേട്ടതെന്ന ആശയം നൽകുന്നു.
- source_word: שֹׁמְעִים
  choice: കേട്ടു
  rationale: രൂപത്തിൽ കർത്തൃവാചക വിശേഷണമായിരുന്നാലും ഈ പ്രസംഗസന്ദർഭത്തിൽ ഭൂതകാല വിവരണമായി സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു.
- source_word: תְמוּנָה
  choice: രൂപം
  rationale: കാണാവുന്ന ആകൃതി, സാദൃശ്യം, അല്ലെങ്കിൽ പ്രതിനിധാനം എന്ന അർഥപരിധി ചുരുക്കാതെ ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֵינְכֶם רֹאִים
  choice: ഒരു രൂപവും കണ്ടില്ല
  rationale: കാഴ്ചയുടെ പൂർണ അഭാവം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും മുൻവാക്യത്തിലെ ‘കേട്ടു’ എന്നതിനോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: זוּלָתִי קוֹל
  choice: ശബ്ദം മാത്രം
  rationale: 'זוּלָתִי സൂചിപ്പിക്കുന്ന ഒഴിവാക്കൽ വ്യക്തമായി നൽകുന്നു: ദൃശ്യരൂപമൊന്നുമില്ല, കേൾക്കപ്പെട്ട ശബ്ദം മാത്രം.'
theological_decisions:
- issue: ദൈവപ്രത്യക്ഷതയെക്കുറിച്ചുള്ള രൂപപരമായ ഭാഷ
  choice: കേൾക്കപ്പെട്ട യഥാർഥ വെളിപ്പാടും കാണപ്പെടാത്ത രൂപവും തമ്മിലുള്ള വൈരുധ്യം അതേപടി നിലനിർത്തുന്നു.
  alternative: ‘നിങ്ങൾ അവന്റെ ശബ്ദം കേട്ടു, എന്നാൽ ദൃശ്യമായ ഒരു പ്രതിനിധാനവും കണ്ടില്ല’ എന്നു വിശദീകരിച്ചു പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം ദൈവശബ്ദത്തിന്റെ യാഥാർഥ്യത്തെയും ദൃശ്യരൂപത്തിന്റെ അഭാവത്തെയും ഒരുമിച്ച് ഉറപ്പിക്കുന്നു. പിന്നീട് രൂപപ്പെട്ട വിഗ്രഹശാസ്ത്രപരമോ ദൈവശാസ്ത്രപരമോ ആയ വിശദീകരണങ്ങൾ പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കേട്ടു/കണ്ടില്ല’ എന്ന സമാന്തരവൈരുധ്യവും അവസാനത്തെ ‘ശബ്ദം മാത്രം’ എന്ന ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
