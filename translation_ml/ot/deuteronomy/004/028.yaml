id: DEU.4.28
reference: Deuteronomy 4:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/עֲבַדְתֶּם שָׁ֣ם אֱלֹהִ֔ים מַעֲשֵׂ֖ה יְדֵ֣י אָדָ֑ם עֵ֣ץ וָ/אֶ֔בֶן אֲשֶׁ֤ר לֹֽא יִרְאוּ/ן֙ וְ/לֹ֣א יִשְׁמְע֔וּ/ן וְ/לֹ֥א יֹֽאכְל֖וּ/ן וְ/לֹ֥א יְרִיחֻֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: ml
  text: അവിടെ നിങ്ങൾ മനുഷ്യരുടെ കൈപ്പണിയായ മരവും കല്ലുമായ ദേവന്മാരെ സേവിക്കും. അവ കാണുകയോ കേൾക്കുകയോ ഭക്ഷിക്കുകയോ മണം അറിയുകയോ ഇല്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: നിങ്ങൾ ... സേവിക്കും
  rationale: മുന്നറിയിപ്പിന്റെ പ്രവചനസന്ദർഭത്തിൽ עבד എന്ന ക്രിയയുടെ ‘സേവിക്കുക/ആരാധിക്കുക’ എന്ന അർഥം ഭാവികാലത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘സേവിക്കും’ എന്നത് മൂലത്തിലെ പദപ്രയോഗം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന ചിതറിപ്പോകുന്ന ദേശങ്ങളിലേക്കുള്ള സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദേവന്മാർ
  rationale: ഇവിടെ ബഹുവചനത്തിലുള്ള പദം വ്യാജദേവതകളെ സൂചിപ്പിക്കുന്നു. ‘വിഗ്രഹങ്ങൾ’ എന്നു വ്യാഖ്യാനപരമായി മാറ്റാതെ, മനുഷ്യനിർമിതമാണെന്ന വിശദീകരണം തുടർന്നുള്ള വാക്യഭാഗത്തിന് വിടുന്നു.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: മനുഷ്യരുടെ കൈപ്പണി
  rationale: മനുഷ്യർ നിർമിച്ചതെന്ന ആശയം സ്വാഭാവികവും സുതാര്യവുമായ മലയാളത്തിൽ നൽകുന്നു. אָדָם ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗപരമായി ചുരുക്കുന്ന പദം ഒഴിവാക്കി.
- source_word: עֵץ וָאֶבֶן
  choice: മരവും കല്ലും
  rationale: ജീവിച്ചിരിക്കുന്ന വൃക്ഷമല്ല, ദേവപ്രതിമകൾ നിർമിച്ച വസ്തുക്കളാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: അവ കാണുകയോ കേൾക്കുകയോ ഭക്ഷിക്കുകയോ മണം അറിയുകയോ ഇല്ല
  rationale: നാല് ക്രിയകൾക്കും ആവർത്തിക്കുന്ന എബ്രായ നിഷേധം മലയാളത്തിലെ ‘-യോ ... ഇല്ല’ എന്ന സമാന്തരഘടനയിൽ നിലനിർത്തുന്നു. ‘കഴിയില്ല’ എന്നു ചേർത്ത് അശക്തിയെ വ്യക്തമായി വ്യാഖ്യാനിക്കുന്നതിനുപകരം മൂലത്തിലെ യഥാർഥ നിഷേധരൂപം സംരക്ഷിക്കുന്നു.
- source_word: יְרִיחֻן
  choice: മണം അറിയുക
  rationale: മലയാളത്തിലെ ‘മണക്കുക’ എന്നതിന് മണം പുറപ്പെടുവിക്കുക എന്ന അർഥവും വരാവുന്നതിനാൽ, ഇവിടെ ഉദ്ദേശിക്കുന്ന ഘ്രാണേന്ദ്രിയപ്രവർത്തനം ‘മണം അറിയുക’ എന്നു വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദേവന്മാർ
  alternative: വിഗ്രഹങ്ങൾ
  rationale: മൂലപദത്തിന്റെ ബഹുവചന അർഥം നിലനിർത്തുകയും അവ മനുഷ്യരുടെ കൈപ്പണിയാണെന്ന വാക്യത്തിലെ പരിഹാസാത്മകമായ ദൈവശാസ്ത്ര സംഘർഷം സ്വയം സംസാരിക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- issue: പ്രതിമകളുടെ ഇന്ദ്രിയശേഷിയെക്കുറിച്ചുള്ള നിഷേധം
  choice: കാണുകയോ കേൾക്കുകയോ ഭക്ഷിക്കുകയോ മണം അറിയുകയോ ഇല്ല
  alternative: കാണാനോ കേൾക്കാനോ ഭക്ഷിക്കാനോ മണം അറിയാനോ കഴിയില്ല
  rationale: അശക്തിയാണ് ആശയപരമായ സൂചനയെങ്കിലും, എബ്രായം ഓരോ പ്രവൃത്തിയും ‘ചെയ്യുന്നില്ല’ എന്ന നിഷേധരൂപത്തിലാണ് പറയുന്നത്. അതിനാൽ വ്യാഖ്യാനപരമായ ‘കഴിയില്ല’ ചേർക്കാതെ മൂലത്തിലെ രൂപവും പരിഹാസത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘മനുഷ്യരുടെ കൈപ്പണി’ എന്ന പ്രയോഗം മനുഷ്യനിർമിതത്വം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; സമാന്തരമായ ‘-യോ ... ഇല്ല’ ഘടന എബ്രായത്തിലെ ആവർത്തിത നിഷേധത്തിന്റെ താളം കാത്തുസൂക്ഷിക്കുന്നു.
