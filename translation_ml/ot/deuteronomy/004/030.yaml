source:
  edition: WLC
  text: בַּ/צַּ֣ר לְ/ךָ֔ וּ/מְצָא֕וּ/ךָ כֹּ֖ל הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה בְּ/אַחֲרִית֙ הַ/יָּמִ֔ים וְ/שַׁבְתָּ֙ עַד יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׁמַעְתָּ֖ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: ml
  text: നീ കഷ്ടത്തിലായിരിക്കുമ്പോൾ, ഈ കാര്യങ്ങളെല്ലാം നിനക്കു വന്നുചേരുമ്പോൾ, പിൽക്കാലത്ത്[a] നീ നിന്റെ ദൈവമായ യഹ്‌വേയിലേക്കു മടങ്ങിവന്ന് അവന്റെ ശബ്ദം കേൾക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭാവികാലത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘പിൽക്കാലത്ത്’ എന്ന എബ്രായ പ്രയോഗം പൊതുവായി ഭാവിയിലെ ഒരു സമയത്തെ സൂചിപ്പിക്കാം; അതിനെ ഒരു പ്രത്യേക അന്ത്യകാലപദ്ധതിയിൽ മാത്രം ഒതുക്കേണ്ടതില്ല.
    reason: alternative_reading
  - marker: b
    text: ‘അവന്റെ ശബ്ദം അനുസരിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിൽ പലപ്പോഴും ശ്രദ്ധിച്ചുകേട്ട് അനുസരിക്കുക എന്ന അർഥവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לְךָ
  choice: നീ കഷ്ടത്തിലായിരിക്കുമ്പോൾ
  rationale: צַר സൂചിപ്പിക്കുന്ന ഞെരുക്കത്തിന്റെയോ ദുരിതത്തിന്റെയോ അവസ്ഥയെ സ്വാഭാവികമായ മലയാള കാലവാക്യമായി അവതരിപ്പിക്കുന്നു; ‘മഹാകഷ്ടം’ പോലുള്ള സാങ്കേതിക അന്ത്യകാലപദം ഒഴിവാക്കുന്നു.
- source_word: וּמְצָאוּךָ כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ കാര്യങ്ങളെല്ലാം നിനക്കു വന്നുഭവിച്ചാൽ
  rationale: ദുരന്തസംഭവങ്ങൾ കർത്താവായിരിക്കുമ്പോൾ מצא എന്നതിന്റെ അക്ഷരാർഥമായ ‘കണ്ടെത്തുക’ എന്നതിനെക്കാൾ ‘വന്നുഭവിക്കുക’ മലയാളത്തിൽ സ്വാഭാവികമാണ്. דְּבָרִים ഇവിടെ മുൻപു പറഞ്ഞ സംഭവങ്ങളെയും ന്യായവിധികളെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘കാര്യങ്ങൾ’ എന്നു നൽകി.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: പിൽക്കാലത്ത്
  rationale: ഭാവിയിലെ ഒരു കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ഒരു പ്രത്യേക അന്ത്യകാലക്രമം നിർബന്ധമായി ആരോപിക്കുന്നില്ല.
- source_word: וְשַׁבְתָּ עַד
  choice: മടങ്ങിവന്ന്
  rationale: שׁוּב + עַד സൂചിപ്പിക്കുന്ന വ്യക്തിയിലേക്കുള്ള തിരിച്ചുവരവിന്റെ ബന്ധപരവും ഉടമ്പടിപരവുമായ ഭാവം നിലനിർത്തുന്നു; ‘മാനസാന്തരപ്പെടുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം സംരക്ഷിക്കുകയും തുടർന്നുള്ള ദൈവനാമവുമായി സ്വാഭാവിക മലയാളബന്ധം സൃഷ്ടിക്കുകയും ചെയ്യുന്നു.
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: അവന്റെ ശബ്ദം കേൾക്കും
  rationale: എബ്രായത്തിലെ ശ്രവണരൂപകം നിലനിർത്തുന്നു; അതിൽ ഉൾപ്പെടാവുന്ന അനുസരണത്തിന്റെ അർഥസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים എന്ന കാലപ്രയോഗത്തെ പ്രത്യേക അന്ത്യകാലപദ്ധതിയുമായി ഒതുക്കാനുള്ള സാധ്യത
  choice: പിൽക്കാലത്ത്
  alternative: ഭാവികാലത്ത്; നാളുകളുടെ അന്ത്യത്തിൽ
  rationale: മൂലപ്രയോഗത്തിന് പൊതുവായ ഭാവികാലത്തെയും അവസാനകാലത്തെയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ അതിന്റെ ഉദ്ദേശ്യപൂർവമായ വിശാലത സംരക്ഷിച്ചു.
- issue: וְשַׁבְתָּ עַד יְהוָה എന്ന ഉടമ്പടിപരമായ തിരിച്ചുവരവ്
  choice: നിന്റെ ദൈവമായ യഹ്‌വേയിലേക്കു മടങ്ങിവന്ന്
  alternative: നിന്റെ ദൈവമായ യഹ്‌വേയിലേക്കു മാനസാന്തരപ്പെട്ടു തിരിഞ്ഞ്
  rationale: ദൈവത്തിലേക്കുള്ള ബന്ധപരമായ തിരിച്ചുവരവ് വ്യക്തമാക്കുന്നു; ക്രിയയിൽ തനിയെ വ്യക്തമല്ലാത്ത വികസിത മാനസാന്തരസങ്കൽപ്പം പാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: שׁמע בקול എന്നതിലെ കേൾവിയും അനുസരണവും
  choice: അവന്റെ ശബ്ദം കേൾക്കും
  alternative: അവന്റെ ശബ്ദം അനുസരിക്കും
  rationale: മൂലത്തിലെ ശ്രവണരൂപകം പ്രധാനപാഠത്തിൽ നിലനിർത്തി, അനുസരണസൂചന അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ’ നിലനിർത്തി. ‘കഷ്ടം’, ‘പിൽക്കാലം’, ‘മടങ്ങിവരുക’ എന്നീ സാധാരണക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക പദാവലി ഒഴിവാക്കി.
