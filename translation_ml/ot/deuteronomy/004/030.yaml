  revised_text: നീ കഷ്ടത്തിലായിരിക്കുമ്പോൾ, ഈ കാര്യങ്ങളെല്ലാം നിനക്കു വന്നുചേരുമ്പോൾ, പിൽക്കാലത്ത്[a] നീ നിന്റെ ദൈവമായ യഹ്‌വേയിലേക്കു മടങ്ങിവന്ന് അവന്റെ ശബ്ദം കേൾക്കും[b].
