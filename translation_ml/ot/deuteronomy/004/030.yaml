- from: നീ കഷ്ടത്തിലായിരിക്കുമ്പോൾ ഈ കാര്യങ്ങളെല്ലാം നിനക്കു വന്നുഭവിച്ചാൽ, പിൽക്കാലത്ത്[a] നീ നിന്റെ ദൈവമായ യഹ്‌വേയിലേക്കു മടങ്ങിവന്ന് അവന്റെ ശബ്ദം കേൾക്കും[b].
  to: നീ കഷ്ടത്തിലായിരിക്കുമ്പോൾ, ഈ കാര്യങ്ങളെല്ലാം നിനക്കു വന്നുചേരുമ്പോൾ, പിൽക്കാലത്ത്[a] നീ നിന്റെ ദൈവമായ യഹ്‌വേയിലേക്കു മടങ്ങിവന്ന് അവന്റെ ശബ്ദം കേൾക്കും[b].
  rationale: മൂലത്തിലെ അർഥമോ കാലസൂചനയോ മാറ്റാതെ, അസ്വാഭാവികമായ ‘വന്നുഭവിച്ചാൽ’ എന്ന പ്രയോഗം ‘വന്നുചേരുമ്പോൾ’ എന്നു തിരുത്തി. ഇതിലൂടെ സംഭവങ്ങൾ അഭിസംബോധിതന്റെമേൽ വന്നെത്തുന്നു എന്ന וּמְצָאוּךָയുടെ ആശയവും, വാക്യത്തിന്റെ കാലസാഹചര്യവും കൂടുതൽ സ്വാഭാവികമായ മലയാളത്തിൽ ലഭിക്കുന്നു. അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളും അവയുടെ അർഥങ്ങളും മാറ്റിയിട്ടില്ല.
