  yaml_path: translation/ot/deuteronomy/004/024.yaml
  text: For Yahweh your God is a consuming fire[a], a jealous God.
translation:
  language: ml
  text: കാരണം നിന്റെ ദൈവമായ യഹോവ ദഹിപ്പിക്കുന്ന അഗ്നിയാണ്; അവൻ അസൂയയുള്ള ദൈവമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തീക്ഷ്ണതയുള്ള ദൈവം.’ വിഗ്രഹാരാധനയുടെ ഈ പശ്ചാത്തലത്തിൽ, തന്റെ ജനത്തിന്മേലുള്ള യഹോവയുടെ അനന്യമായ ഉടമ്പടി അവകാശത്തിനാണ് ഹീബ്രു പദം ഊന്നൽ നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ഹീബ്രു ബന്ധകത്തിന്റെ വിശദീകരണബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം നിലനിർത്തി, ഇസ്രായേലിനോടുള്ള ഉടമ്പടിസംബന്ധമായ ഏകവചന അഭിസംബോധന സംരക്ഷിക്കുന്നു.
- source_word: אֵשׁ אֹכְלָה
  choice: ദഹിപ്പിക്കുന്ന അഗ്നി
  rationale: നാമവും കർത്തൃവാചക രൂപവും ചേർന്ന ശക്തമായ രൂപകം അടുത്തും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു; വിശുദ്ധിയുടെയും ന്യായവിധിയുടെയും ദൃശ്യബലം മയപ്പെടുത്തുന്നില്ല.
- source_word: הוּא
  choice: ആണ്
  rationale: ഹീബ്രുവിലെ ഊന്നൽ മലയാളത്തിലെ വിധേയവാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אֵל
  choice: ദൈവം
  rationale: ഇവിടെ മുൻവാക്യത്തോട് സമാന്തരമായി വരുന്ന പൊതുവായ ദൈവിക വിശേഷണം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: קַנָּא
  choice: അസൂയയുള്ള
  rationale: വിഗ്രഹാരാധനയുടെ പശ്ചാത്തലത്തിൽ തന്റെ ജനത്തിന്മേലുള്ള യഹോവയുടെ അനന്യമായ ഉടമ്പടി അവകാശവും എതിരാളിയായ ആരാധനയോടുള്ള അസഹിഷ്ണുതയും ഈ പദം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ קַנָּא എന്ന ഗുണത്തിന്റെ പരിഭാഷ
  choice: അസൂയയുള്ള ദൈവം
  alternative: തീക്ഷ്ണതയുള്ള ദൈവം
  rationale: സന്ദർഭം വിഗ്രഹാരാധനയ്‌ക്കെതിരായ ഉടമ്പടിപരമായ അനന്യാവകാശത്തെക്കുറിച്ചാണ്. ‘അസൂയയുള്ള’ എന്നത് ആ ബന്ധപരമായ ശക്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും മയപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് സാധ്യമായ മറ്റൊരു അർത്ഥഭാവം രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവനാമത്തിന് ‘യഹോവ’യും രണ്ടാംപുരുഷ ഏകവചനത്തിന് ‘നിന്റെ’ എന്ന രൂപവും ഉപയോഗിച്ചു. രൂപകവും ദൈവിക അസൂയയുടെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിച്ചു.
