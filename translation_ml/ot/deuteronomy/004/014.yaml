  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֹתִ֞/י צִוָּ֤ה יְהוָה֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/לַמֵּ֣ד אֶתְ/כֶ֔ם חֻקִּ֖ים וּ/מִשְׁפָּטִ֑ים לַ/עֲשֹׂתְ/כֶ֣ם אֹתָ֔/ם בָּ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: ml
  text: എന്നെയും ആ സമയത്ത് യഹ്‌വെ, നിങ്ങൾക്കു ചട്ടങ്ങളും ന്യായവിധികളും[a] പഠിപ്പിക്കാൻ കൽപ്പിച്ചു; കൈവശമാക്കാൻ[b] നിങ്ങൾ കടന്നുചെല്ലുന്ന ദേശത്ത് അവ പ്രമാണിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചട്ടങ്ങളും ന്യായവിധികളും’ എന്നതിന് ‘കൽപ്പനകളും നിയമങ്ങളും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കൈവശമാക്കാൻ’ എന്നതിന് ‘അവകാശമായി നേടാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹתִי
  choice: എന്നോടാകട്ടെ
  rationale: വാക്യാരംഭത്തിലെ ഊന്നലും മുൻവാക്യത്തോടുള്ള നേരിയ വൈരുധ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവമായ ആജ്ഞയെ സൂചിപ്പിക്കുകയും നിയമ-ഉടമ്പടി പശ്ചാത്തലത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: לְלַמֵּד
  choice: പഠിപ്പിക്കാൻ
  rationale: മോശെയ്ക്കു നൽകിയ അധ്യാപനദൗത്യം ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിർണയിച്ച നിയമവ്യവസ്ഥകളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു നിയമപദത്തിന്റെ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: מִשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: നിയമപരമായ വിധികളെയോ ന്യായനിയമങ്ങളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പ്രത്യേകത ‘ചട്ടങ്ങൾ’ എന്നതിൽനിന്ന് വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: അവ അനുഷ്ഠിക്കേണ്ടതിനായിരുന്നു
  rationale: നിയമങ്ങൾ പ്രാവർത്തികമാക്കുക എന്ന ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അറിവിൽ മാത്രം ഒതുങ്ങാത്ത അനുസരണം ഇതിൽ ഉൾപ്പെടുന്നു.
- source_word: עֹבְרִים שָׁמָּה
  choice: കടന്നുചെല്ലുന്ന
  rationale: യോർദ്ദാൻ കടന്ന് ദേശത്തേക്കു പ്രവേശിക്കുന്ന സമീപകാല പ്രവൃത്തിയെ സന്ദർഭോചിതമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ദേശത്തെ സ്വന്തമാക്കുക/അവകാശമാക്കുക എന്ന ക്രിയയുടെ തത്സന്ദർഭത്തിലുള്ള അർത്ഥം നൽകുന്നു; ‘അവകാശമായി നേടാൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിനാമത്തെ ലിപ്യന്തരണം ചെയ്യുന്നു; പ്രചാരത്തിലുള്ള മറ്റൊരു ലിപ്യന്തരണം ‘യഹോവ’ ആണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. നിയമപദങ്ങളിലെ ഹീബ്രു വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്; വാക്യാരംഭത്തിലെ ‘എന്നോടാകട്ടെ’ മൂലപാഠത്തിലെ നേരിയ ഊന്നൽ സംരക്ഷിക്കുന്നു.
