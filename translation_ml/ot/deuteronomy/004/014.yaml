revisions:
- from: എന്നോടാകട്ടെ, ആ സമയത്ത് യഹ്‌വെ നിങ്ങളെ ചട്ടങ്ങളും ന്യായവിധികളും[a] പഠിപ്പിക്കാൻ കല്പിച്ചു; നിങ്ങൾ കൈവശമാക്കാൻ[b] കടന്നുചെല്ലുന്ന ദേശത്ത് അവ അനുഷ്ഠിക്കേണ്ടതിനായിരുന്നു അത്.
