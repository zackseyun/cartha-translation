  rationale: The revised wording corrects the case of the fronted Hebrew object, clarifies that Israel is the recipient of Moses’ teaching, and expresses the purpose of observance directly. It retains the source’s legal terminology, the divine name, and both lexical-alternative footnotes without introducing interpretive expansion.
