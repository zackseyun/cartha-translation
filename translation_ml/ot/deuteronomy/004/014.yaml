    text: ‘ചട്ടങ്ങളും ന്യായവിധികളും’ എന്നതിന് ‘കൽപ്പനകളും നിയമങ്ങളും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കൈവശമാക്കാൻ’ എന്നതിന് ‘അവകാശമായി നേടാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
