source:
  edition: WLC
  text: הַעִידֹתִי֩ בָ/כֶ֨ם הַ/יּ֜וֹם אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ כִּֽי אָבֹ֣ד תֹּאבֵדוּ/ן֮ מַהֵר֒ מֵ/עַ֣ל הָ/אָ֔רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ לֹֽא תַאֲרִיכֻ֤/ן יָמִים֙ עָלֶ֔י/הָ כִּ֥י הִשָּׁמֵ֖ד תִּשָּׁמֵדֽוּ/ן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: ml
  text: 'ഇന്നു ഞാൻ ആകാശത്തെയും ഭൂമിയെയും നിങ്ങൾക്കെതിരേ സാക്ഷികളായി വിളിക്കുന്നു: നിങ്ങൾ കൈവശമാക്കാൻ യോർദ്ദാൻ കടന്നുചെല്ലുന്ന ദേശത്തുനിന്ന് നിങ്ങൾ തീർച്ചയായും വേഗത്തിൽ നശിച്ചുപോകും. അതിൽ നിങ്ങൾ ദീർഘകാലം ജീവിക്കുകയില്ല; നിങ്ങൾ തീർച്ചയായും നശിപ്പിക്കപ്പെടും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: നിങ്ങൾക്കെതിരേ സാക്ഷികളായി വിളിക്കുന്നു
  rationale: הפעיל രൂപത്തിന്റെയും בָכֶם എന്ന പ്രയോഗത്തിന്റെയും നിയമപരവും പ്രതികൂലവുമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ആകാശത്തെയും ഭൂമിയെയും
  rationale: സൃഷ്ടിയെ ഉടമ്പടിയുടെ സാക്ഷികളായി വിളിക്കുന്ന സൂത്രവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; എബ്രായത്തിലെ രൂപപരമായ ബഹുവചനം മലയാളത്തിൽ നിർബന്ധമായി പകർത്തുന്നില്ല.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: നശിച്ചുപോകും
  rationale: ക്രിയാനാമവും സമാപികക്രിയയും ചേർന്നുള്ള ഉറപ്പിന്റെ ഊന്നൽ വാക്യസന്ദർഭവും പിന്നാലെയുള്ള 'തീർച്ചയായും' എന്ന പ്രയോഗവും ചേർന്ന് വ്യക്തമാക്കുന്നു.
- source_word: מַהֵר
  choice: വേഗത്തിൽ
  rationale: ഭൂമിയിൽനിന്നുള്ള നഷ്ടം താമസിയാതെ സംഭവിക്കുമെന്ന ഭീഷണിയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: מֵעַל הָאָרֶץ
  choice: ദേശത്തുനിന്ന്
  rationale: അക്ഷരാർഥമായ 'ദേശത്തിന്റെ മുകളിൽനിന്ന്' എന്നതിനു പകരം നീക്കം ചെയ്യപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: നിങ്ങൾ കൈവശമാക്കാൻ യോർദ്ദാൻ കടന്നുചെല്ലുന്ന
  rationale: שָׁמָּהയുടെ ദിശാബോധം 'കടന്നുചെല്ലുന്ന' എന്നതിൽ ഉൾപ്പെടുത്തി, ירשׁ എന്നത് ദേശസന്ദർഭത്തിൽ 'കൈവശമാക്കുക' എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: അതിൽ നിങ്ങൾ ദീർഘകാലം ജീവിക്കുകയില്ല
  rationale: അക്ഷരാർഥമായ 'നാളുകൾ ദീർഘിപ്പിക്കുകയില്ല' എന്ന എബ്രായ രൂപകത്തിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: നിങ്ങൾ തീർച്ചയായും നശിപ്പിക്കപ്പെടും
  rationale: നിഫാൽ ക്രിയയുടെ കർമണി സ്വഭാവവും infinitive absolute നൽകുന്ന ഉറപ്പിന്റെ ഊന്നലും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആകാശവും ഭൂമിയും ഉൾപ്പെടുന്ന ഉടമ്പടി-സാക്ഷി സൂത്രവാക്യം
  choice: സൃഷ്ടിയെ ഇസ്രായേലിനെതിരായ സാക്ഷികളായി ഔപചാരികമായി വിളിക്കുന്ന നിയമപരമായ ഭാഷയായി പരിഭാഷപ്പെടുത്തി
  alternative: '''ആകാശത്തെയും ഭൂമിയെയും മുൻനിർത്തി ഞാൻ നിങ്ങളെ മുന്നറിയിപ്പു നൽകുന്നു'' എന്ന ശിഥിലമായ പരിഭാഷ'
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടി-വ്യവഹാരത്തിന്റെ നിയമപരമായ ശക്തി നിലനിർത്തുകയും പാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: ആദ്യത്തെയും അവസാനത്തെയും നാശപ്രയോഗങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം
  choice: ആദ്യം അകർമകമായി 'നശിച്ചുപോകും'; അവസാനം കർമണിയായി 'നശിപ്പിക്കപ്പെടും'
  alternative: രണ്ടും ഒരേപോലെ 'നശിക്കും' എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: אָבֹד תֹּאבֵדוּן എന്ന സജീവ രൂപത്തിനും הִשָּׁמֵד תִּשָּׁמֵדוּן എന്ന നിഫാൽ രൂപത്തിനും ഇടയിലെ യഥാർഥ വ്യത്യാസം മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. നിയമപരമായ 'സാക്ഷികളായി വിളിക്കുന്നു' എന്ന പ്രയോഗം സംരക്ഷിച്ചു; അതേസമയം എബ്രായ വാക്യഘടന യാന്ത്രികമായി പകർത്തിയിട്ടില്ല. അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
