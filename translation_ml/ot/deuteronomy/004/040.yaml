revisions:
- from: അതുകൊണ്ട്, ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന അവന്റെ ചട്ടങ്ങളും കല്പനകളും നീ പാലിക്കണം. അങ്ങനെ നിനക്കും നിന്റെ ശേഷം നിന്റെ മക്കൾക്കും[b] നന്മയുണ്ടാകും[a]; നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്ക് നൽകുന്ന ദേശത്ത്[c] നീ ദീർഘകാലം ജീവിക്കുകയും ചെയ്യും—നിന്റെ ആയുഷ്കാലമൊക്കെയും.
  to: അതുകൊണ്ട്, ഞാൻ ഇന്ന് നിന്നോടു കൽപ്പിക്കുന്ന അവന്റെ ചട്ടങ്ങളും കൽപ്പനകളും നീ പാലിക്കണം. അങ്ങനെ നിനക്കും നിന്റെ ശേഷമുള്ള നിന്റെ മക്കൾക്കും[b] നന്മയുണ്ടാകുകയും[a], നിന്റെ ദൈവമായ യഹ്‌വേ നിനക്കു നൽകുന്ന ദേശത്ത്[c] നിന്റെ ദിവസങ്ങൾ ദീർഘമാകുകയും ചെയ്യും—എല്ലാക്കാലവും.
  rationale: The revision removes the interpretively narrowed and stylistically redundant final expression, more closely reflects the Hebrew idiom of making one's days long, smooths the generational phrase, and corrects the Malayalam transliteration of Yahweh. No doctrinal interpretation has been added.
