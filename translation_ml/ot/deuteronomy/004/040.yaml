source:
  edition: WLC
  text: וְ/שָׁמַרְתָּ֞ אֶת חֻקָּ֣י/ו וְ/אֶת מִצְוֺתָ֗י/ו אֲשֶׁ֨ר אָנֹכִ֤י מְצַוְּ/ךָ֙ הַ/יּ֔וֹם אֲשֶׁר֙ יִיטַ֣ב לְ/ךָ֔ וּ/לְ/בָנֶ֖י/ךָ אַחֲרֶ֑י/ךָ וּ/לְמַ֨עַן תַּאֲרִ֤יךְ יָמִים֙ עַל הַ֣/אֲדָמָ֔ה אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഞാൻ ഇന്ന് നിന്നോടു കൽപ്പിക്കുന്ന അവന്റെ ചട്ടങ്ങളും കൽപ്പനകളും നീ പാലിക്കണം. അങ്ങനെ നിനക്കും നിന്റെ ശേഷമുള്ള നിന്റെ മക്കൾക്കും[b] നന്മയുണ്ടാകുകയും[a], നിന്റെ ദൈവമായ യഹ്‌വേ നിനക്കു നൽകുന്ന ദേശത്ത്[c] നിന്റെ ദിവസങ്ങൾ ദീർഘമാകുകയും ചെയ്യും—എല്ലാക്കാലവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിനക്കു നല്ലതായിരിക്കും’; കാര്യങ്ങൾ നിനക്കു നന്നായി ഭവിക്കും എന്നതാണ് ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
  - marker: b
    text: ‘മക്കൾ’ എന്നത് ‘പുത്രന്മാർ’ എന്നും, ഈ സന്ദർഭത്തിൽ കൂടുതൽ വ്യാപകമായി ‘സന്തതികൾ’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘ദേശത്തിന്മേൽ’. മലയാളത്തിൽ ഈ പ്രയോഗം സാധാരണയായി ‘ദേശത്ത്’ എന്നാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: അതുകൊണ്ട് ... നീ പാലിക്കണം
  rationale: വാക്യാരംഭത്തിലെ waw മുൻവാദത്തിന്റെ നിഗമനത്തിലേക്കുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു; ഉടമ്പടിസന്ദർഭത്തിലെ שׁמר-ന്റെ അർഥമായ ‘അനുസരിച്ച് പാലിക്കുക’ എന്നത് ‘പാലിക്കണം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חֻקָּיו
  choice: അവന്റെ ചട്ടങ്ങൾ
  rationale: ദൈവം നിശ്ചയിച്ച നിയമവ്യവസ്ഥകളെ സൂചിപ്പിക്കുന്ന חֻקִּים എന്ന പദത്തെ, מִצְוֹת എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തി, ‘ചട്ടങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִצְוֺתָיו
  choice: അവന്റെ കല്പനകൾ
  rationale: מִצְוָה എന്നത് അധികാരപൂർവമായ കല്പനയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ബൈബിൾപരവും സാധാരണക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ രൂപമാണ് ‘കല്പനകൾ’.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന
  rationale: പങ്കാളിക്രിയയായ מְצַוֶּה പ്രസംഗത്തിന്റെ ഇപ്പോഴത്തെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ വർത്തമാനബന്ധക രൂപം ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: അങ്ങനെ നിനക്ക് ... നന്മയുണ്ടാകും
  rationale: ייטב לְ എന്ന ഹീബ്രു പ്രയോഗം കാര്യങ്ങൾ ഒരാൾക്കു നന്നായി ഭവിക്കുക എന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘നന്മയുണ്ടാകും’ എന്നു നൽകി.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: നിന്റെ ശേഷം നിന്റെ മക്കൾക്കും
  rationale: בָּנִים എന്നത് ഇവിടെ പുരുഷസന്താനത്തിൽ മാത്രം ഒതുങ്ങാതെ തുടർതലമുറയെ ഉൾക്കൊള്ളാം; ആ വ്യാപ്തി തുറന്നുവയ്ക്കാൻ ‘മക്കൾ’ ഉപയോഗിച്ചു.
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: നീ ദീർഘകാലം ജീവിക്കുകയും ചെയ്യും
  rationale: ‘ദിവസങ്ങൾ ദീർഘമാക്കുക’ എന്ന ഹീബ്രു രൂപകം അക്ഷരാർഥത്തിൽ മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ അതിന്റെ അർഥം വ്യക്തമായി നൽകുന്ന ‘ദീർഘകാലം ജീവിക്കുക’ ഉപയോഗിച്ചു.
- source_word: עַל הָאֲדָמָה
  choice: ദേശത്ത്
  rationale: ഈ സന്ദർഭത്തിൽ אֲדָמָה സാധാരണ മണ്ണല്ല, ദൈവം നൽകുന്ന ദേശമാണ്; עַל എന്നതിനുള്ള സ്വാഭാവിക മലയാള സ്ഥാനസൂചകം ‘-ത്ത്’ ആണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: נֹתֵן לְךָ
  choice: നിനക്ക് നൽകുന്ന
  rationale: നിലവിലുള്ളതോ ഉറപ്പോടെ മുന്നോട്ടുപോകുന്നതോ ആയ ദാനത്തെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയുടെ ഭാവം മലയാള ബന്ധകക്രിയ നിലനിർത്തുന്നു.
- source_word: כָּל הַיָּמִים
  choice: നിന്റെ ആയുഷ്കാലമൊക്കെയും
  rationale: ‘എല്ലാ ദിവസങ്ങളും’ എന്ന കാലവ്യാപ്തി ഇവിടെ ജീവിതകാലമൊട്ടാകെയുള്ള വാസത്തോടും ദീർഘായുസ്സോടും ബന്ധപ്പെട്ടതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി; സമീപവാക്യഘടകങ്ങളോടുള്ള ഹീബ്രുവിലെ ബന്ധസാധ്യത കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה ഉപയോഗിക്കുന്നു. അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ Yahweh എന്ന പുനർനിർമിത ഉച്ചാരണത്തോട് ചേർന്ന മലയാളരൂപം നൽകി.
- issue: അനുസരണവും അനുഗ്രഹവും തമ്മിലുള്ള ബന്ധം
  choice: ഉദ്ദേശ്യവും ഫലവും പ്രകടമാക്കുന്ന ‘അങ്ങനെ ... ഉണ്ടാകും’
  alternative: നിബന്ധനാപരമായി ‘പാലിച്ചാൽ മാത്രം’ എന്നു വ്യക്തമാക്കുക
  rationale: വാക്യത്തിലെ אֲשֶׁר, לְמַעַן ഘടനകൾ അനുസരണത്തിന്റെ ഉദ്ദേശ്യവും പ്രതീക്ഷിത ഫലവും ബന്ധിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത കർശനമായ ‘മാത്രം’ ചേർത്ത് ദൈവശാസ്ത്രപരമായ ബന്ധം കൂടുതൽ നിർണ്ണയിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരവുള്ള നിയമ-ഉടമ്പടി ശൈലി സ്വീകരിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ’ നിലനിർത്തി. നീണ്ട ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; എന്നാൽ ആശയക്രമവും കാരണ-ഫലബന്ധവും കാത്തുസൂക്ഷിച്ചു. അവസാനത്തെ כָּל הַיָּמִים എന്ന പ്രയോഗത്തിന്റെ ബന്ധത്തിൽ ചെറിയ ഘടനാപരമായ അനിശ്ചിതത്വമുണ്ട്; പ്രധാനപാഠത്തിൽ അതിനെ ദീർഘായുസ്സിന്റെ കാലവ്യാപ്തിയായി സ്വാഭാവികമായി ചേർത്തു.
