  text: וְ/הֵפִ֧יץ יְהוָ֛ה אֶתְ/כֶ֖ם בָּ/עַמִּ֑ים וְ/נִשְׁאַרְתֶּם֙ מְתֵ֣י מִסְפָּ֔ר בַּ/גּוֹיִ֕ם אֲשֶׁ֨ר יְנַהֵ֧ג יְהוָ֛ה אֶתְ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: ml
  text: യഹ്‌വെ നിങ്ങളെ ജനവിഭാഗങ്ങൾക്കിടയിൽ ചിതറിക്കും; യഹ്‌വെ നിങ്ങളെ ഓടിച്ചുകൊണ്ടുപോകുന്ന[a] ജനതകളുടെ ഇടയിൽ നിങ്ങൾ എണ്ണത്തിൽ ചുരുക്കംപേരായി അവശേഷിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യഹ്‌വെ നിങ്ങളെ നയിച്ചുകൊണ്ടുപോകുന്ന.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് “നയിക്കുക” എന്നും “ഓടിച്ചുകൊണ്ടുപോകുക” എന്നും അർഥമാകാം. ന്യായവിധിയുടെയും പ്രവാസത്തിന്റെയും പശ്ചാത്തലമായതിനാൽ മുഖ്യവാചകത്തിൽ “ഓടിച്ചുകൊണ്ടുപോകുക” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: ചിതറിക്കും
  rationale: פוץ എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം കാരണാത്മകമായ ചിതറിക്കലിനെ സൂചിപ്പിക്കുന്നു. ന്യായവിധിയുടെയും പ്രവാസത്തിന്റെയും പശ്ചാത്തലത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בָּעַמִּים
  choice: ജനസമൂഹങ്ങൾക്കിടയിൽ
  rationale: עַמִּים എന്നത് ഇവിടെ വിവിധ ജനവിഭാഗങ്ങളെയോ ജനസമൂഹങ്ങളെയോ സൂചിപ്പിക്കുന്നു. പിന്നീട് വരുന്ന גּוֹיִם എന്ന പദത്തിൽനിന്നുള്ള സൂക്ഷ്മവ്യത്യാസവും ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: וְנִשְׁאַרְתֶּם
  choice: ശേഷിക്കും
  rationale: ന്യായവിധിക്കുശേഷം അവശേഷിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന നിഫാൽ രൂപത്തിന്റെ ഫലാവസ്ഥ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מְתֵי מִסְפָּר
  choice: എണ്ണത്തിൽ ചുരുക്കംപേർ മാത്രം
  rationale: വളരെ കുറച്ചുപേർ, എളുപ്പം എണ്ണാവുന്നത്ര പേർ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בַּגּוֹיִם
  choice: ജനതകളുടെ ഇടയിൽ
  rationale: גּוֹיִם ഇവിടെ പൊതുവായി വിദേശജനതകളെ സൂചിപ്പിക്കുന്നു; പിൽക്കാല മതപരമായ പ്രത്യേക അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר יְנַהֵג
  choice: ഓടിച്ചുകൊണ്ടുപോകുന്ന
  rationale: נהג എന്ന ക്രിയയ്ക്ക് ‘നയിക്കുക’ എന്നും ‘ഓടിച്ചുകൊണ്ടുപോകുക’ എന്നും അർഥമാകാം. നിർബന്ധിതമായ പ്രവാസന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ രണ്ടാമത്തേതാണ് മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചത്.
- source_word: שָׁמָּה
  choice: ഇടയിൽ
  rationale: ‘അവിടെ’ എന്ന സ്ഥലസൂചന ബന്ധവാക്യത്തിലും ‘ജനതകളുടെ ഇടയിൽ’ എന്ന പ്രയോഗത്തിലും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; വേറിട്ട് ആവർത്തിച്ചിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദനാമമായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: נהג എന്ന ക്രിയയിലെ നയിക്കൽ/ഓടിച്ചുകൊണ്ടുപോകൽ എന്ന അർഥസാധ്യത
  choice: ഓടിച്ചുകൊണ്ടുപോകുന്ന
  alternative: നയിക്കുന്ന
  rationale: ന്യായവിധിയും പ്രവാസവും വിവരിക്കുന്ന സന്ദർഭം നിർബന്ധിതമായി കൊണ്ടുപോകുന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും ക്രിയയുടെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. עַמִּים, גּוֹיִם എന്നീ പദങ്ങളുടെ സൂക്ഷ്മവ്യത്യാസം യഥാക്രമം ‘ജനസമൂഹങ്ങൾ’, ‘ജനതകൾ’ എന്നിങ്ങനെ നിലനിർത്തി. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
