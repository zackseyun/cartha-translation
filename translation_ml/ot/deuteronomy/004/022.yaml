id: DEU.4.22
reference: Deuteronomy 4:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י אָנֹכִ֥י מֵת֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את אֵינֶ֥/נִּי עֹבֵ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֙ עֹֽבְרִ֔ים וִֽ/ירִשְׁתֶּ֕ם אֶת הָ/אָ֥רֶץ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: ml
  text: കാരണം, ഞാൻ ഈ ദേശത്തുവെച്ചു മരിക്കാനിരിക്കുകയാണ്[a]; ഞാൻ യോർദ്ദാൻ കടക്കുകയില്ല; എന്നാൽ നിങ്ങൾ കടന്നുചെന്ന് ഈ നല്ല ദേശം കൈവശമാക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ ഈ ദേശത്തുവെച്ചു മരിക്കും.’ ഹീബ്രുവിലെ കൃദന്തരൂപം ആസന്നഭാവിയിലെ പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവകാശമാക്കും’ അല്ലെങ്കിൽ ‘അവകാശമായി പ്രാപിക്കും.’ ദേശത്തെ അവകാശമായി ഏറ്റെടുത്തു കൈവശമാക്കുന്നതിനെ ഹീബ്രു ക്രിയ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിനോ പ്രബോധനത്തിനോ കാരണം നൽകുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്ര സർവനാമത്തിലെ ഊന്നൽ സന്ദർഭവും ‘ഞാൻ—നിങ്ങൾ’ എന്ന വൈരുധ്യവും വ്യക്തമാക്കുന്നതിനാൽ അധിക പദം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: מֵת
  choice: മരിക്കുകയാണ്
  rationale: മോശെയുടെ ആസന്നമായ മരണത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു വർത്തമാനകൃദന്തരൂപത്തിന്റെ അടിയന്തരത നിലനിർത്തുന്നു; ഇത് ഇപ്പോൾ നടന്നുകൊണ്ടിരിക്കുന്ന മരണമെന്നോ ആസന്നഭാവിയെന്നോ ഗ്രഹിക്കാവുന്നതിനാൽ പാദക്കുറിപ്പിൽ വ്യത്യസ്ത വായന നൽകുന്നു.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: ഈ ദേശത്തുവെച്ചു
  rationale: യോർദ്ദാന്റെ കിഴക്കുവശത്തുള്ള മോശെ നിൽക്കുന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ആവർത്തിച്ചു വരുന്ന ദേശം/അവകാശം എന്ന ആശയബന്ധവും നിലനിർത്തുന്നു.
- source_word: אֵינֶנִּי עֹבֵר
  choice: ഞാൻ ... കടക്കുകയില്ല
  rationale: ആസന്നമായി സംഭവിക്കാത്ത കാര്യത്തെ സൂചിപ്പിക്കുന്ന നിഷേധവും കൃദന്തരൂപവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ഭാവിനിഷേധമായി നൽകുന്നു.
- source_word: אֶת הַיַּרְדֵּן
  choice: യോർദ്ദാൻ
  rationale: നദിയുടെ പരമ്പരാഗതവും വ്യക്തവുമായ സ്ഥലനാമം; ‘നദി’ എന്ന വിശദീകരണം അർത്ഥവ്യക്തതയ്ക്ക് അനിവാര്യമല്ല.
- source_word: וְאַתֶּם עֹבְרִים
  choice: എന്നാൽ നിങ്ങൾ കടന്നുചെന്ന്
  rationale: മോശെ കടക്കാത്തതും ജനങ്ങൾ കടക്കുന്നതും തമ്മിലുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; עבר എന്ന ക്രിയയിലെ മറുകരയിലേക്കുള്ള ചലനവും ‘കടന്നുചെന്ന്’ പ്രകടിപ്പിക്കുന്നു.
- source_word: וִירִשְׁתֶּם
  choice: കൈവശമാക്കും
  rationale: വാഗ്ദത്തദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ഭൂമി അവകാശമായി ലഭിക്കുകയും അതിൽ അധിവാസമുറപ്പിക്കുകയും ചെയ്യുന്ന ירשׁ എന്ന ക്രിയയുടെ സജീവമായ അർത്ഥം ലളിതമായി നൽകുന്നു.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: ഈ നല്ല ദേശം
  rationale: വിശേഷണവും നിർദ്ദേശകപദവും യാതൊരു അധിക വ്യാഖ്യാനവും ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ירשׁ എന്ന ക്രിയയിൽ അവകാശമായി ലഭിക്കൽ, കൈവശപ്പെടുത്തൽ എന്നീ അർത്ഥനിറങ്ങൾ
  choice: കൈവശമാക്കും
  alternative: അവകാശമാക്കും / അവകാശമായി പ്രാപിക്കും
  rationale: ഭൂമിയിലേക്കു കടന്നുചെന്ന് അതിനെ സ്വന്താധീനത്തിലാക്കുന്ന സജീവത പ്രധാനവാചകത്തിൽ വ്യക്തമാക്കുന്നു; അവകാശമായി ലഭിക്കുന്ന അർത്ഥനിറം പാദക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മോശെയും ജനവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു. [b] എന്ന അടയാളം അതു വിശദീകരിക്കുന്ന ‘കൈവശമാക്കും’ എന്ന പദത്തിനു ശേഷമാണ് നൽകിയിരിക്കുന്നത്.
