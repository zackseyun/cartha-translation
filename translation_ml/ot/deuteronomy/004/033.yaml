  text: Has any people heard the voice of God speaking from the midst of the fire[a], as you have heard, and lived?
translation:
  language: ml
  text: നീ കേട്ടതുപോലെ, തീയുടെ നടുവിൽനിന്ന് സംസാരിക്കുന്ന ദൈവത്തിന്റെ ശബ്ദം കേട്ട് ജീവിച്ച ഏതെങ്കിലും ജനമുണ്ടോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അതിജീവിച്ച ഏതെങ്കിലും ജനമുണ്ടോ?’ ഹീബ്രു ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘ജീവിച്ചു’ എന്നാണ്; എന്നാൽ ദൈവം തീയുടെ നടുവിൽനിന്ന് സംസാരിക്കുന്നത് കേട്ടിട്ടും ജനം ജീവനോടെ തുടർന്നു എന്നതാണ് സന്ദർഭത്തിലെ ഊന്നൽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע
  choice: കേൾക്കുകയും ... ചെയ്തിട്ടുണ്ടോ?
  rationale: ചോദ്യകണമായ הֲയും സമാപ്തക്രിയയും ചേർന്ന് ഒരു അനുഭവത്തെക്കുറിച്ചുള്ള ആലങ്കാരിക ചോദ്യം ഉന്നയിക്കുന്നു. മലയാളത്തിലെ ‘ചെയ്തിട്ടുണ്ടോ?’ ആ അനുഭവാർഥവും ചോദ്യരൂപവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עָם
  choice: ജനം
  rationale: ഒരു ജനവിഭാഗത്തെ ഏകവചന കൂട്ടനാമമായി സൂചിപ്പിക്കുന്ന עָם എന്ന പദത്തിന് ‘ജനം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തുല്യപദമാണ്.
- source_word: קוֹל
  choice: ശബ്ദം
  rationale: മലയാളത്തിൽ ‘ദൈവത്തിന്റെ ശബ്ദം’ വ്യക്തിപരവും ഗ്രഹിക്കാവുന്നതുമായ ദൈവിക സംസാരത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് വെറും ധ്വനിയല്ലെന്ന് מְדַבֵּר വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും ഏകവചനമായ מְדַבֵּרയും ഹോരേബിലെ ഉടമ്പടിസന്ദർഭവും ഏകവചനമായ ‘ദൈവം’ ആവശ്യപ്പെടുന്നു.
- source_word: מְדַבֵּר
  choice: സംസാരിക്കുന്ന
  rationale: വർത്തമാന പങ്കാളിക്രിയ ദൈവത്തിന്റെ ശബ്ദത്തെ സജീവമായി സംസാരിക്കുന്നതായി വിശേഷിപ്പിക്കുന്നു; ‘സംസാരിക്കുന്ന’ അതിനെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: തീയുടെ നടുവിൽനിന്ന്
  rationale: מִתּוֹךְ സൂചിപ്പിക്കുന്ന ഉള്ളിൽനിന്നുള്ള സ്ഥാനം ‘നടുവിൽനിന്ന്’ എന്ന പ്രയോഗം വ്യക്തവും ദൃശ്യാത്മകവുമായി സംരക്ഷിക്കുന്നു.
- source_word: כַּ/אֲשֶׁר
  choice: പോലെ
  rationale: മറ്റേതെങ്കിലും ജനത്തിന്റെ അനുഭവത്തെയും ഇസ്രായേലിന്റെ അനുഭവത്തെയും തമ്മിൽ താരതമ്യം ചെയ്യുന്ന ബന്ധം മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: שָׁמַעְתָּ אַתָּה
  choice: നിങ്ങൾ കേട്ടതുപോലെ
  rationale: സ്വതന്ത്ര സർവനാമമായ אַתָּה നൽകുന്ന ഊന്നൽ ‘നിങ്ങൾ’ തുറന്നുപറഞ്ഞുകൊണ്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്നത് ഇസ്രായേൽജനമായതിനാൽ ആദര/ബഹുവചന രൂപം യോജിക്കുന്നു.
- source_word: וַ/יֶּחִי
  choice: ജീവനോടെ ഇരിക്കുകയും
  rationale: חיה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘ജീവിക്കുക’ സംരക്ഷിക്കുകയും ദൈവശബ്ദം കേട്ടശേഷവും അവർ മരിച്ചില്ലെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു; ‘അതിജീവിക്കുക’ എന്ന വ്യാഖ്യാനാത്മക പദം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി.
theological_decisions:
- issue: നേരിട്ടുള്ള ദൈവിക വെളിപ്പാടിന്റെ സന്ദർഭത്തിൽ אֱלֹהִים എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ദൈവം
  alternative: ഒരു ദൈവം; ദേവന്മാർ
  rationale: മോശെ ഹോരേബിൽ ഇസ്രായേൽ അനുഭവിച്ച ഉടമ്പടിസംഗമം ഓർമിപ്പിക്കുകയാണ്. ഏകവചന പങ്കാളിക്രിയയും സന്ദർഭവും ഏകവചനമായ ‘ദൈവം’ എന്ന വായന ഉറപ്പിക്കുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ദൈവത്തിന്റെ ശബ്ദം കേട്ടാൽ സാധാരണയായി മരണം സംഭവിക്കുമെന്ന അന്തർലീന വൈരുധ്യം വ്യക്തമാക്കണമോ
  choice: ജീവനോടെ ഇരിക്കുകയും
  alternative: എന്നിട്ടും ജീവനോടെ ഇരിക്കുകയും; അതിജീവിക്കുകയും
  rationale: ഹീബ്രു വാക്യം ഘടകങ്ങളെ ലളിതമായി ‘കൂടാതെ/ഉം’ എന്ന ബന്ധത്തിൽ ചേർക്കുന്നു. അസാധാരണമായ സംരക്ഷണം സന്ദർഭത്തിൽ വ്യക്തമായിരുന്നാലും ‘എന്നിട്ടും’ അല്ലെങ്കിൽ ‘അതിജീവിച്ചു’ എന്ന് മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് വൈരുധ്യത്തെ മൂലപാഠത്തേക്കാൾ ശക്തമാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചോദ്യരൂപം ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ആലങ്കാരിക ചോദ്യവും ‘നിങ്ങൾ’ എന്ന ഊന്നലും തീയുടെ നടുവിൽനിന്നുള്ള സംസാരത്തിന്റെ ദൃശ്യരൂപവും നിലനിർത്തി. ‘ജനം’ ഏകവചന കൂട്ടനാമമായി ഉപയോഗിച്ചു; ‘അതിജീവിച്ചു’ എന്ന വ്യാഖ്യാനാത്മക സാധ്യത അടിക്കുറിപ്പിൽ മാത്രം നൽകി.
